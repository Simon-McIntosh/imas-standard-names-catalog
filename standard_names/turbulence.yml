      kind: llm
- name: reference_magnetic_field
  kind: vector
  status: active
  description: Magnetic field at a specified reference major radius, generalizing
    the equilibrium field vector whose resolved components provide common reference
    values for turbulence quantities.
  documentation: 'The reference magnetic field designates the equilibrium magnetic-field
    vector evaluated at a prescribed reference major radius. It generalizes the resolved
    components of that vector, including the [toroidal reference magnetic field](name:toroidal_reference_magnetic_field),
    and is a reference specialization of the [magnetic field](name:magnetic_field).


    The reference evaluation is represented by


    $$

    \mathbf{B}_{\mathrm{ref}} = \mathbf{B}_{\mathrm{eq}}(R_{\mathrm{ref}})

    $$


    where $\mathbf{B}_{\mathrm{ref}}$ is the reference magnetic-field vector, $\mathbf{B}_{\mathrm{eq}}$
    is the equilibrium magnetic-field vector, and $R_{\mathrm{ref}}$ is the prescribed
    reference major radius measured in the right-handed cylindrical $(R,\phi,Z)$ frame.


    Perturbation-only fields and fields defined exclusively by external coils are
    outside this equilibrium reference quantity.


    Sign convention: Positive when a resolved component of $\mathbf{B}_{\mathrm{ref}}$
    points along its corresponding positive basis direction in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: turbulence
  links:
  - name:toroidal_reference_magnetic_field
  - name:magnetic_field
  arguments:
  - name: magnetic_field
    operator: reference
    operator_kind: qualifier
- name: toroidal_reference_magnetic_field
  kind: scalar
  status: active
  description: "Toroidal reference magnetic field is the signed toroidal component\
    \ of the equilibrium magnetic field at the reference point whose major radius\
    \ is the reference major radius, expressed in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'Toroidal reference magnetic field is the signed toroidal component
    of the equilibrium magnetic field at a specified reference point in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The reference point has major radius equal
    to the [reference major radius](name:reference_major_radius).


    The defining projection is:


    $$

    B_{\phi,\mathrm{ref}} = \mathbf{B}_{\mathrm{eq}}(\mathbf{x}_{\mathrm{ref}}) \cdot
    \hat{\phi}(\mathbf{x}_{\mathrm{ref}})

    $$


    where $B_{\phi,\mathrm{ref}}$ is the toroidal reference magnetic field, $\mathbf{B}_{\mathrm{eq}}$
    is the equilibrium magnetic field, $\mathbf{x}_{\mathrm{ref}}=(R_{\mathrm{ref}},\phi_{\mathrm{ref}},Z_{\mathrm{ref}})$
    is the full reference point in the right-handed cylindrical $(R, \phi, Z)$ frame,
    $R_{\mathrm{ref}}$ is the reference major radius, and $\hat{\phi}$ is the unit
    vector in the direction of increasing $\phi$. For an axisymmetric equilibrium,
    the value is independent of $\phi_{\mathrm{ref}}$.


    This quantity is the reference-location specialization of [toroidal magnetic field](name:toroidal_magnetic_field).
    It is distinct from [toroidal magnetic field at magnetic axis](name:toroidal_magnetic_field_at_magnetic_axis),
    from the magnetic-field magnitude, and from [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field).


    Sign convention: Positive when $B_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: turbulence
  links:
  - name:reference_magnetic_field
  - name:toroidal_vacuum_magnetic_field
  - name:reference_major_radius
