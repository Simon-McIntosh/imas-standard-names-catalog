- name: electron_temperature_at_magnetic_axis
  kind: scalar
  status: active
  description: Thermal energy per particle of the electron population, expressed as
    an energy-equivalent temperature and evaluated at the magnetic axis.
  documentation: 'Thermal energy per particle of the electron population, expressed
    as an energy-equivalent temperature and evaluated at the magnetic axis. The magnetic
    axis is the degenerate innermost magnetic surface of the equilibrium, where the
    gradient of the poloidal magnetic flux vanishes; evaluation at this locus does
    not imply that the electron temperature has an extremum there.


    For a thermal electron population with a well-defined absolute thermodynamic temperature,
    the energy-equivalent electron temperature is defined by:


    $$

    T_e = k_\mathrm{B}\,\Theta_e

    $$


    where $T_e$ is the electron temperature expressed as energy per particle, $\Theta_e$
    is the absolute thermodynamic temperature of the electrons, and $k_\mathrm{B}$
    is the Boltzmann constant.


    This quantity applies specifically to the electron population at the magnetic
    axis and is an intensive, per-particle quantity rather than a charge-state sum,
    volume average, or volume-integrated electron energy. It excludes ion temperatures,
    radiative temperature-equivalent scales, and the total thermal energy content
    of the electron population.


    It is the electron-specific member of the broader [temperature at the magnetic
    axis](name:temperature_at_magnetic_axis), which also encompasses other populations
    and radiative temperature interpretations. The corresponding electron temperature
    at another locus is [electron temperature at the outboard midplane](name:electron_temperature_at_outboard_midplane),
    while [thermal electron energy](name:thermal_electron_energy) denotes an integrated
    energy content rather than this local temperature.'
  unit: eV
  physics_domain: transport
  links: []
  sources:
  - kind: imas-dd
    ref: camera_x_rays/t_e_magnetic_axis
    version: 4.1.0
  - kind: imas-dd
    ref: summary/local/magnetic_axis/t_e/value
    version: 4.1.0
