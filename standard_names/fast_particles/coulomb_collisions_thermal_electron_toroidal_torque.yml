name: coulomb_collisions_thermal_electron_toroidal_torque
status: draft
description: Volume-integrated toroidal torque transferred to the thermal electron
  population through Coulomb collisions with fast particles.
documentation: "This scalar represents the total toroidal torque $T_{\\phi,e}^{\\\
  mathrm{th}}$ (N\xB7m) deposited into the background thermal electron population\
  \ via Coulomb collisions with the fast (supra-thermal) particle distribution, integrated\
  \ over the plasma volume. By Newton's third law, $T_{\\phi,e}^{\\mathrm{th}} = -T_{\\\
  phi,\\mathrm{fast\\text{-}e}}$, where $T_{\\phi,\\mathrm{fast\\text{-}e}}$ is the\
  \ corresponding torque on the fast particles due to electron friction (`toroidal_fast_particle_torque_due_to_coulomb_collisions_with_electrons`).\
  \ Because electrons are much lighter than the fast ions, they absorb primarily the\
  \ pitch-angle\u2013scattering recoil; the resulting torque is typically small compared\
  \ with the ion-channel counterpart but contributes to the electron toroidal rotation\
  \ which can matter for current-drive and neoclassical transport. Typical magnitudes\
  \ are $10^{-2}$\u2013$10^{-1}\\;\\mathrm{N\\,m}$ in NBI-heated H-mode plasmas. Computed\
  \ by fast-particle orbit-following or Fokker\u2013Planck solvers (NUBEAM, CQL3D,\
  \ ASCOT). See also the profile-resolved density version (`co_passing_thermal_electron_collisional_toroidal_torque_density`)\
  \ and the ion thermal channel (`thermal_ion_toroidal_torque_due_to_coulomb_collisions`)."
