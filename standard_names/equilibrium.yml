- name: toroidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: active
  description: Toroidal magnetic flux at the plasma boundary is the net flux of toroidal
    magnetic field through the poloidal cross-section enclosed by the plasma boundary,
    including externally imposed and plasma-poloidal-current contributions.
  documentation: 'Toroidal magnetic flux at the plasma boundary is the net flux of
    the toroidal magnetic-field component through the poloidal cross-section enclosed
    by the plasma boundary. It is the boundary value of toroidal magnetic flux used
    to define toroidal-flux radial labels.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle increasing counter-clockwise when viewed from above $+\hat{Z}$,
    and $Z$ is vertical height, the boundary toroidal flux is defined by


    $$

    \Phi_{\mathrm{tor},b} = \int_{\Omega_b} \mathbf{B}\cdot\hat{\phi}\, dA_{RZ} =
    \int_{\Omega_b} B_\phi(R,Z)\, dA_{RZ} = \int_{\Omega_b} \frac{F(\psi(R,Z))}{R}\,
    dA_{RZ}

    $$


    where $\Phi_{\mathrm{tor},b}$ is this boundary toroidal flux, $\Omega_b$ is the
    boundary-enclosed region in the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, $\mathbf{B}$ is the magnetic field, $B_\phi$ is its toroidal
    component in tesla, $dA_{RZ}$ is the poloidal cross-sectional area element in
    square meters, $F(\psi)=R B_\phi$ is the poloidal-current function in tesla meters,
    and $\psi$ is the equilibrium poloidal magnetic-flux label.


    The geometric measure of $\Omega_b$ is the [poloidal cross-sectional area of the
    plasma boundary](name:poloidal_cross_sectional_area_of_plasma_boundary). $\Phi_{\mathrm{tor},b}$
    includes both externally imposed toroidal-field flux and the contribution associated
    with plasma poloidal current, and is distinct from [toroidal magnetic flux at
    the plasma boundary due to poloidal current](name:toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current),
    which contains only that plasma-current contribution. It also differs from [poloidal
    magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary),
    which is magnetic flux through a horizontal disk rather than through the boundary-enclosed
    poloidal cross-section.


    Sign convention: Positive when the net toroidal magnetic field threading the plasma-boundary
    poloidal cross-section points in the direction of increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/boundary/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-phi
    dd_documentation:
      leaf: Toroidal flux at the selected plasma boundary
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of boundary."
      kind: template
- name: toroidal_non_axisymmetric_magnetic_field
  kind: scalar
  status: active
  description: "Toroidal non-axisymmetric magnetic field is the signed component of\
    \ the toroidally varying vacuum magnetic field along increasing toroidal angle\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal non-axisymmetric magnetic field is the toroidal component
    of the toroidally varying part of a vacuum magnetic field in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius in meters, $\phi$
    is toroidal angle in radians, and $Z$ is vertical height in meters. It is the
    signed component along increasing $\phi$ and excludes the axisymmetric equilibrium
    contribution.


    The component projection is defined by


    $$

    B_\phi^{\mathrm{NA}}(R,\phi,Z) = \mathbf{B}_{\mathrm{NA}}(R,\phi,Z) \cdot \hat{\boldsymbol{\phi}}

    $$


    where $B_\phi^{\mathrm{NA}}$ is the toroidal component in tesla, $\mathbf{B}_{\mathrm{NA}}$
    is the non-axisymmetric vacuum magnetic-field vector in tesla, and $\hat{\boldsymbol{\phi}}$
    is the toroidal unit vector.


    Together with the [radial non-axisymmetric magnetic field](name:radial_non_axisymmetric_magnetic_field)
    and [vertical non-axisymmetric magnetic field](name:vertical_non_axisymmetric_magnetic_field),
    this component decomposes the [non-axisymmetric magnetic field](name:non_axisymmetric_magnetic_field)
    in the right-handed cylindrical $(R, \phi, Z)$ frame. The [toroidal magnetic field](name:toroidal_magnetic_field)
    is the corresponding projection of the total magnetic field and is not restricted
    to its non-axisymmetric part.


    Sign convention: Positive when the non-axisymmetric magnetic field points in the
    direction of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_non_axisymmetric_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  - name:non_axisymmetric_magnetic_field
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - dd_path: b_field_non_axisymmetric/time_slice/control_surface/b_field_phi
