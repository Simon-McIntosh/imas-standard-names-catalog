- name: temperature_at_plasma_boundary
  kind: scalar
  status: active
  description: Temperature at the plasma boundary is the kinetic temperature of a
    specified plasma particle population evaluated on the last closed magnetic flux
    surface or separatrix. It generalizes species-specific boundary temperatures,
    such as the electron boundary temperature, without changing the boundary locus.
  documentation: 'Temperature at the plasma boundary is the kinetic temperature of
    a specified plasma particle population evaluated on the last closed magnetic flux
    surface or separatrix. It characterizes the random, thermal part of particle motion
    at that boundary and does not change the boundary locus when the particle population
    changes.


    For a nonrelativistic population with mean flow removed, the scalar boundary temperature
    is defined by the trace of the random kinetic energy per particle:


    $$

    T_{a,\mathrm{bdry}} = \frac{1}{3} m_a \left\langle \left|\mathbf{v} - \mathbf{u}_a\right|^2
    \right\rangle_{\mathrm{bdry}}

    $$


    where $a$ denotes the specified particle population, $m_a$ is the particle mass
    of that population, $\mathbf{v}$ is particle velocity, $\mathbf{u}_a$ is the mean
    flow velocity of that population, and $\langle \cdot \rangle_{\mathrm{bdry}}$
    is the particle average over population $a$ at the plasma boundary.


    This parent generalizes over particle population while retaining the plasma-boundary
    locus. The electron specialization is [electron temperature at the plasma boundary](name:electron_temperature_at_plasma_boundary);
    quantities at other named locations are distinct from this boundary value. If
    the specified population is a species aggregated over charge states, this intensive
    quantity is the density-weighted mean over the included charge states.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_plasma_boundary
- name: electron_temperature_at_plasma_boundary
  kind: scalar
  status: active
  description: Thermal energy of the bulk electron population at the plasma boundary
    expressed as a kinetic temperature, equal to two-thirds of the mean random electron
    kinetic energy per particle. The boundary value is evaluated on the last closed
    magnetic flux surface or separatrix.
  documentation: 'Thermal energy of the bulk electron population at the plasma boundary
    expressed as a kinetic temperature, equal to two-thirds of the mean random electron
    kinetic energy per particle, is the scalar electron temperature evaluated on the
    last closed magnetic flux surface. In a diverted plasma the boundary is the separatrix;
    in a limiter plasma it is the limiting last closed flux surface. The boundary
    surface is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise when
    viewed from above, and $Z$ is vertical height.


    For an isotropic scalar-temperature electron distribution at that boundary, the
    defining thermal-energy relation is:


    $$

    \left\langle E_{e,\mathrm{rand}}\right\rangle_b = \frac{3}{2}\,k_B T_{K,b} = \frac{3}{2}\,e\,T_{e,b}

    $$


    where $\left\langle E_{e,\mathrm{rand}}\right\rangle_b$ is the mean random kinetic
    energy per bulk electron at the boundary, subscript $b$ denotes boundary evaluation,
    $k_B$ is Boltzmann''s constant, $T_{K,b}$ is the thermodynamic electron temperature
    in kelvin, $T_{e,b}$ is this boundary electron temperature in electronvolts, and
    $e$ is the elementary-charge magnitude converting electronvolts to joules.


    This quantity is the electron-species member of [temperature_at_plasma_boundary](name:temperature_at_plasma_boundary)
    and refines [electron_temperature](name:electron_temperature) by locus. It denotes
    the local confined-plasma-side boundary value and is not a flux-surface average;
    the corresponding averaged quantity is [flux_surface_averaged_electron_temperature_at_plasma_boundary](name:flux_surface_averaged_electron_temperature_at_plasma_boundary).
    With [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    it gives the scalar isotropic boundary electron-pressure relation $p_{e,b}=n_{e,b}
    e T_{e,b}$ when such a pressure is defined. As a scalar kinetic temperature of
    the thermal bulk population, it is non-negative and excludes separately represented
    nonthermal electron components.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:temperature_at_plasma_boundary
  - name:flux_surface_averaged_electron_temperature_at_plasma_boundary
  arguments:
  - name: temperature_at_plasma_boundary
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix/t_e/value
