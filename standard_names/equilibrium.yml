- name: vertical_coordinate_of_constraint_position
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the physical location where an equilibrium\
    \ constraint is applied, expressed in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'Vertical Z coordinate of the physical location where an equilibrium
    constraint is applied in the right-handed cylindrical $(R, \phi, Z)$ frame. Here
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height; the
    coordinate is the height of the constraint point relative to the chosen $Z=0$
    reference plane.


    The constraint position is the physical point in the equilibrium domain at which
    a prescribed condition on the equilibrium solution is imposed. Together with the
    [major radius of the constraint position], this coordinate specifies the constraint
    point in the axisymmetric poloidal cross-section and is distinct from the [vertical
    coordinate of a measurement position](name:vertical_coordinate_of_measurement_position).


    Sign convention: Positive when the constraint position lies in the $+\hat{Z}$
    direction from the $Z=0$ reference plane in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
