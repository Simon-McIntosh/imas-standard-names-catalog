- name: length_of_plasma_boundary
  kind: scalar
  status: draft
  description: Arc length of the plasma boundary in a fixed-toroidal-angle poloidal
    cross-section of the right-handed cylindrical (R, phi, Z) frame. It is the perimeter
    of the last closed magnetic-flux-surface contour.
  documentation: 'Length of the plasma boundary is the total arc length of the closed
    contour formed by the last closed magnetic flux surface in a fixed-toroidal-angle
    poloidal cross-section. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height; this
    quantity is computed from the contour in the $(R,Z)$ cross-section at constant
    $\phi$. It is independent of whether the contour is traversed clockwise or counter-clockwise.


    For a smooth boundary represented by a parameter $\lambda$ that traces the closed
    contour once, the poloidal boundary length is


    $$

    L_\mathrm{pol} = \int_0^1 \sqrt{\left(\frac{dR}{d\lambda}\right)^2 + \left(\frac{dZ}{d\lambda}\right)^2}\,
    d\lambda

    $$


    where $R(\lambda)$ and $Z(\lambda)$ are the contour coordinates in meters and
    $\lambda$ is dimensionless. For a circular boundary of minor radius $a$ in meters,
    this reduces to $L_\mathrm{pol}=2\pi a$.


    The contour is obtained from magnetic-equilibrium reconstruction by identifying
    the separatrix in diverted plasmas or the limiting last closed flux surface in
    limited plasmas, then integrating the arc element around that closed curve. This
    length complements other boundary-geometry measures such as [area_of_plasma_boundary](name:flux_surface_area_at_plasma_boundary),
    [volume_of_plasma_boundary](name:volume_of_flux_surface), [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),
    and [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary);
    elongation, triangularity, and X-point shaping generally increase the perimeter
    relative to a circular contour with the same minor radius.


    Representative values scale directly with plasma minor radius and shaping. As
    geometric scale checks, a circular contour with $a=0.3-2$ m has $L_\mathrm{pol}\approx
    2-13$ m, while elongated or diverted contours of comparable minor radius are typically
    larger by tens of percent.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:flux_surface_area_at_plasma_boundary
  - name:volume_of_flux_surface
  - name:elongation_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/length_pol
    dd_path: equilibrium/time_slice/global_quantities/length_pol
    status: composed
- name: lower_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Ratio of the lower boundary half-height to the plasma minor radius,
    describing the vertical elongation of the plasma cross-section below the geometric
    axis.
  documentation: 'The lower elongation $\kappa_{\rm lower}$ is a dimensionless shape
    parameter quantifying the vertical extent of the lower half of the plasma boundary
    cross-section relative to the plasma minor radius, complementing [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary)
    for up-down asymmetric plasma shaping.


    The defining relation is:


    $$

    \kappa_{\rm lower} = \frac{Z_{\rm axis} - Z_{\rm lower}}{a}

    $$


    where $Z_{\rm axis}$ is the vertical coordinate of the plasma geometric axis in
    the right-handed cylindrical $(R, \phi, Z)$ frame, $Z_{\rm lower}$ is the vertical
    coordinate of the lowermost point of the boundary contour, and $a$ is the plasma
    minor radius.


    When $\kappa_{\rm lower}$ differs from [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary),
    the plasma has up-down asymmetric shaping, which is characteristic of single-null
    divertor configurations with the X-point in the lower divertor. The global [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)
    captures the overall vertical half-height ratio for symmetric boundaries, but
    $\kappa_{\rm lower}$ and its upper counterpart together fully characterize asymmetric
    boundary shapes relevant to MHD stability and confinement modeling. Typical values
    range from 1.0 in near-circular lower halves to approximately 2.0 in strongly
    shaped H-mode plasmas. The quantity is obtained from equilibrium reconstruction
    by fitting the boundary contour in the poloidal $(R, Z)$ plane using external
    magnetic measurements.


    Sign convention: Positive when the lowermost point of the plasma boundary contour
    lies below the geometric axis, i.e., $Z_{\rm lower} < Z_{\rm axis}$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  arguments:
  - name: elongation_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_lower
    dd_path: equilibrium/time_slice/boundary/elongation_lower
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation_lower
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation_lower
    status: attached
- name: magnetic_field
  kind: vector
  status: draft
  description: Total local magnetic field vector in a magnetically confined plasma,
    formed by superposition of contributions from external coil systems and plasma-current-generated
    fields.
  documentation: "The magnetic field vector $\\mathbf{B}$ represents the total local\
    \ magnetic field at each point in a magnetically confined plasma, combining the\
    \ dominant toroidal component provided by toroidal field coils with the poloidal\
    \ component arising from plasma current and poloidal field coils, together with\
    \ any non-axisymmetric perturbations from error fields or applied resonant magnetic\
    \ perturbations. The [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field)\
    \ isolates the externally driven toroidal contribution, while [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field)\
    \ captures the toroidally varying non-axisymmetric part.\n\nThe field satisfies\
    \ the solenoidal constraint $\\nabla \\cdot \\mathbf{B} = 0$ everywhere and, in\
    \ the presence of plasma currents $\\mathbf{j}$, obeys Amp\xE8re's law:\n\n$$\n\
    \\nabla \\times \\mathbf{B} = \\mu_0 \\, \\mathbf{j}\n$$\n\nwhere $\\mu_0 = 4\\\
    pi \\times 10^{-7}$ H m$^{-1}$ is the permeability of free space and $\\mathbf{j}$\
    \ is the total current density in A m$^{-2}$.\n\nThe field is reconstructed from\
    \ external magnetics diagnostics \u2014 flux loops, Rogowski coils, and pick-up\
    \ coils \u2014 supplemented where available by in-vessel probe measurements. The\
    \ ratio of plasma kinetic pressure to local magnetic pressure defines beta, a\
    \ key dimensionless stability parameter derived from $|\\mathbf{B}|$.\n\nOn-axis\
    \ total field magnitudes span 1\u20136 T in present-day tokamaks, with the toroidal\
    \ component dominant and the poloidal component typically 10\u2013100 times smaller.\n\
    \nSign convention: Positive when each component points in the positive direction\
    \ of the corresponding axis of the right-handed cylindrical $(R, \\phi, Z)$ frame\
    \ \u2014 outward for the radial component, in the direction of increasing toroidal\
    \ angle $\\phi$ for the toroidal component, and upward ($+Z$) for the vertical\
    \ component."
  unit: T
  physics_domain: equilibrium
  links:
  - name:toroidal_vacuum_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
- name: magnetic_flux
  kind: vector
  status: draft
  description: Family of magnetic flux quantities in tokamak equilibrium, spanning
    poloidal and toroidal projections and contributions from external coils, resistive
    dissipation, and plasma diamagnetism.
  documentation: 'Magnetic flux is the surface integral of the magnetic field over
    a bounded area, quantifying the total field lines threading a specified surface.
    In tokamak equilibrium, the vector quantity encompasses several physically distinct
    components: [poloidal magnetic flux](name:poloidal_magnetic_flux) threading horizontal
    disks centered on the toroidal symmetry axis serves as the canonical radial flux-surface
    coordinate, while [toroidal magnetic flux](name:toroidal_magnetic_flux) threads
    the poloidal cross-section enclosed by each flux surface and increases monotonically
    outward from the magnetic axis.


    The defining surface integral is:


    $$

    \Phi = \int_S \mathbf{B} \cdot d\mathbf{A}

    $$


    where $\mathbf{B}$ is the magnetic-field vector and $d\mathbf{A}$ is the oriented
    area element of the bounding surface $S$.


    Beyond the geometric poloidal and toroidal projections, the equilibrium flux budget
    includes contributions from external coil systems such as the central solenoid
    and poloidal-field coils, and flux consumed by resistive dissipation within the
    plasma. The [poloidal current weighted average external magnetic flux](name:poloidal_current_weighted_average_external_magnetic_flux)
    is one such derived quantity combining external-source flux with current weighting.
    Flux quantities are measured by saddle loops, flux loops, and diamagnetic loops
    distributed around the vacuum vessel, and are reconstructed from equilibrium solvers
    that invert the Grad-Shafranov equation in the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    Sign convention: Positive when the enclosed magnetic flux is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  - name:toroidal_magnetic_flux
  - name:poloidal_current_weighted_average_external_magnetic_flux
- name: magnetic_shear
  kind: scalar
  status: draft
  description: Normalized logarithmic derivative of the safety factor with respect
    to the normalized toroidal flux radius, quantifying the radial rate of change
    of magnetic field-line helicity across nested flux surfaces.
  documentation: "Magnetic shear $s$ measures how rapidly the pitch of nested magnetic\
    \ field lines changes across flux surfaces and is a fundamental parameter governing\
    \ magnetohydrodynamic (MHD) stability and cross-field turbulent transport. It\
    \ distinguishes conventional positive-shear configurations, which suppress certain\
    \ interchange modes, from reversed-shear configurations, which can suppress ion-temperature-gradient\
    \ turbulence.\n\nThe defining relation is:\n\n$$\ns = \\frac{\\rho_\\mathrm{tor}}{q}\
    \ \\frac{dq}{d\\rho_\\mathrm{tor}}\n$$\n\nwhere $q$ is the safety factor and $\\\
    rho_\\mathrm{tor}$ is the normalized toroidal flux radius running from 0 at the\
    \ magnetic axis to 1 at the last closed flux surface. An equivalent minor-radius\
    \ form is $s = (r/q)(dq/dr)$ where $r$ is the local minor radius.\n\nMagnetic\
    \ shear is computed from equilibrium reconstructions by evaluating the logarithmic\
    \ derivative of the reconstructed safety factor profile with respect to the radial\
    \ flux label. In conventional H-mode scenarios, $s$ rises from near zero on axis\
    \ to approximately 2\u20135 near the edge; in reversed-shear advanced scenarios,\
    \ $s$ is negative (typically $-1$ to $-2$) in the core. The on-axis limit is given\
    \ by [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis),\
    \ the pedestal value by [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal),\
    \ and the flux-surface-averaged form by [flux_surface_averaged_magnetic_shear](name:flux_surface_averaged_magnetic_shear).\n\
    \nSign convention: Positive when the safety factor $q$ increases with increasing\
    \ normalized toroidal flux radius $\\rho_\\mathrm{tor}$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_pedestal
  - name:flux_surface_averaged_magnetic_shear
  sources:
  - id: dd:core_profiles/profiles_1d/magnetic_shear
    dd_path: core_profiles/profiles_1d/magnetic_shear
    status: skipped
  - id: dd:edge_profiles/profiles_1d/magnetic_shear
    dd_path: edge_profiles/profiles_1d/magnetic_shear
    status: attached
  - id: dd:equilibrium/time_slice/profiles_1d/magnetic_shear
    dd_path: equilibrium/time_slice/profiles_1d/magnetic_shear
    status: attached
  - id: dd:gyrokinetics/flux_surface/magnetic_shear_r_minor
    dd_path: gyrokinetics/flux_surface/magnetic_shear_r_minor
    status: composed
  - id: dd:plasma_profiles/profiles_1d/magnetic_shear
    dd_path: plasma_profiles/profiles_1d/magnetic_shear
    status: attached
  - id: dd:sawteeth/profiles_1d/magnetic_shear
    dd_path: sawteeth/profiles_1d/magnetic_shear
    status: attached
- name: magnetic_shear_at_magnetic_axis
  kind: scalar
  status: draft
  description: Dimensionless magnetic shear at the magnetic axis, defined as the limiting
    normalized logarithmic derivative of the safety factor with respect to normalized
    toroidal flux radius. For a smooth finite-q equilibrium this axis limit is zero.
  documentation: 'Magnetic shear at the magnetic axis is the axis limiting value of
    local magnetic shear, describing how rapidly the safety factor changes as one
    moves outward from the magnetic axis in normalized toroidal flux radius. It is
    a dimensionless local equilibrium quantity, not a finite-radius average.


    The defining value is the one-sided radial limit of local magnetic shear:


    $$

    s_\mathrm{axis} = \lim_{\rho_\mathrm{tor}\to 0^+} \frac{\rho_\mathrm{tor}}{q(\rho_\mathrm{tor})}\frac{d
    q}{d\rho_\mathrm{tor}}

    $$


    where $\rho_\mathrm{tor}$ is the normalized toroidal flux radius, a dimensionless
    radial coordinate with value 0 at the magnetic axis and value 1 at the plasma
    boundary, and $q(\rho_\mathrm{tor})$ is the safety factor. Since both $q$ and
    $\rho_\mathrm{tor}$ are dimensionless, $s_\mathrm{axis}$ has unit 1.


    In equilibrium analysis it is obtained from the reconstructed radial dependence
    of $q$ by fitting or differentiating near the magnetic axis and taking the limiting
    expression above. For regular equilibria with finite $q$ at the axis, the factor
    $\rho_\mathrm{tor}$ makes the exact limit vanish; the curvature of $q$ controls
    how quickly magnetic shear rises away from the axis, not a finite physical on-axis
    shear. Negative or positive shear associated with reversed-shear configurations
    occurs at finite radius, while the smooth on-axis limit remains zero.


    The typical physical value is 0 for smooth finite-q tokamak equilibria. Numerical
    evaluations may show small residual absolute values, commonly 0-0.1 depending
    on radial resolution, smoothing, and whether a finite-radius point was used instead
    of the mathematical limit; larger magnitudes usually indicate extrapolation or
    loss of near-axis regularity.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_at_pedestal
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/magnetic_axis/magnetic_shear/value
    dd_path: summary/local/magnetic_axis/magnetic_shear/value
