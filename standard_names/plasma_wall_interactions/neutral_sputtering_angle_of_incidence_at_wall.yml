name: neutral_sputtering_angle_of_incidence_at_wall
status: draft
description: Angle of incidence of a neutral projectile relative to the wall surface
  normal, used as abscissa for sputtering yield tabulation.
documentation: "The incident angle $\\theta$ (in radians) is measured between the\
  \ velocity vector of the incoming neutral particle and the local outward surface\
  \ normal of the wall element; $\\theta = 0$ corresponds to normal incidence and\
  \ $\\theta = \\pi/2$ to grazing incidence. Physical sputtering yields $Y(E, \\theta)$\
  \ exhibit a characteristic increase with oblique incidence, peaking near $\\theta\
  \ \\approx 60\xB0$\u2013$80\xB0$ before dropping sharply at grazing angles where\
  \ projectiles are reflected. This angular grid, together with the energy grid (`sputtering_physical_coefficient_incident_energy_grid`),\
  \ forms the two-dimensional lookup table for the sputtering coefficient $Y(E, \\\
  theta)$, interpolated during plasma-wall interaction simulations in codes such as\
  \ ERO or WallDYN. Typical grid resolution is 5\xB0\u201310\xB0 increments over the\
  \ $[0, \\pi/2]$ range."
