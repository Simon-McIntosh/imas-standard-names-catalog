- name: toroidal_current_density_at_constraint_position
  kind: scalar
  status: draft
  description: Toroidal current density at specified spatial positions used as a constraint
    in equilibrium reconstruction codes.
  documentation: 'The toroidal current density $j_\phi(R,Z)$ on a set of discrete
    spatial positions (``constraint positions'''') defined by their $R$ and $Z$ coordinates.
    These positions are distinct from the equilibrium reconstruction grid and are
    used to enforce agreement between the reconstructed current profile and independent
    current-density measurements (e.g. from MSE or current wires). The quantity is
    a scalar value at each position; the full toroidal current-density profile is
    obtained by integrating over the plasma cross-section. Typical core values range
    from $10^5$--$10^7$ A/m$^2$ in medium-size tokamaks. The constraint positions
    are defined in [major_radius_of_constraint_position](name:major_radius_of_constraint_position).


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).'
