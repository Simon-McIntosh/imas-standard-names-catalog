- name: diamagnetic_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Component of the ion-neutral-friction current density projected onto
    the local diamagnetic direction. It quantifies the friction-driven current from
    ion-neutral momentum exchange along that direction.
  documentation: 'Diamagnetic current density due to ion-neutral friction is the scalar
    projection, onto the local ion-diamagnetic direction, of the electric current
    density associated with momentum exchange between plasma ions and neutral particles.
    It represents the part of the friction-driven drift current perpendicular to the
    magnetic field and complements projections such as [parallel_current_density_due_to_ion_neutral_friction](name:parallel_current_density_due_to_ion_neutral_friction),
    [poloidal_current_density_due_to_ion_neutral_friction](name:poloidal_current_density_due_to_ion_neutral_friction),
    and [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction),
    where the toroidal projection is along $\hat{\phi}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    For a single ion species, the force-drift projection can be written as:


    $$

    j_{\mathrm{dia},in} = \left(\frac{\mathbf{R}_{in}\times\mathbf{B}}{B^2}\right)\cdot\hat{\mathbf{e}}_{\mathrm{dia}},
    \qquad \mathbf{R}_{in}=m_i n_i \nu_{in}(\mathbf{u}_n-\mathbf{u}_i)

    $$


    where $j_{\mathrm{dia},in}$ is the diamagnetic ion-neutral-friction current density
    in A m^-2, $\mathbf{R}_{in}$ is the ion-neutral friction force density in N m^-3,
    $\mathbf{B}$ is the magnetic field in T, $B=|\mathbf{B}|$, and $\hat{\mathbf{e}}_{\mathrm{dia}}$
    is the dimensionless unit vector along $\mathbf{B}\times\nabla p_i$, with $p_i$
    the ion pressure in Pa. In the friction model, $m_i$ is the ion mass in kg, $n_i$
    is the ion density in m^-3, $\nu_{in}$ is an effective ion-neutral momentum-exchange
    frequency in s^-1, and $\mathbf{u}_i$ and $\mathbf{u}_n$ are ion and neutral flow
    velocities in m s^-1. For multiple ion species, the force density is summed over
    species before projection.


    This quantity is usually computed from edge plasma and neutral-particle models
    using charge-exchange, elastic-scattering, ionization, and recombination momentum
    exchange rates, together with measured or reconstructed density, temperature,
    flow, and magnetic-field information. Direct measurement is uncommon; it is typically
    constrained through momentum balance, current balance, and comparisons with spectroscopy,
    neutral pressure measurements, probe data, and magnetic equilibrium information.


    Typical absolute magnitudes in the edge and scrape-off layer are about 0.1-1000
    A m^-2, depending strongly on neutral density, ion flow speed, magnetic-field
    strength, and recycling conditions. In dense divertor or strong gas-puffing conditions,
    localized values can approach 10000 A m^-2, while in low-neutral regions the contribution
    may be negligible compared with other current-density components.


    Sign convention: Positive when the friction-driven current density has a component
    in the direction of $\mathbf{B}\times\nabla p_i$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:poloidal_current_density_due_to_ion_neutral_friction
  - name:current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: diamagnetic
    operator_kind: qualifier
- name: flux_surface_averaged_deuterium_tritium_density
  kind: scalar
  status: draft
  description: Flux-surface average of the combined deuterium-tritium fuel ion number
    density. Deuterium and tritium are treated as a single pseudo-species with effective
    mass 2.5 amu, which assumes equal deuterium and tritium number densities.
  documentation: 'Flux-surface-averaged deuterium-tritium density is the mean fuel-ion
    number density on a magnetic flux surface when deuterium and tritium are represented
    together as one ion pseudo-species. The fixed effective mass of 2.5 amu is valid
    for an equal-number-density mixture of deuterium and tritium; the pseudo-species
    density is the combined deuterium plus tritium ion number density.


    For an axisymmetric closed flux surface labeled by poloidal magnetic flux $\psi$,
    the flux-surface average is commonly written as:


    $$

    \langle n_\mathrm{DT} \rangle_\psi = \frac{\oint_\psi n_\mathrm{DT} \, dl / B_p}{\oint_\psi
    dl / B_p}

    $$


    where $n_\mathrm{DT} = n_D + n_T$ is the combined fuel-ion density in $\mathrm{m}^{-3}$
    with the equal-mixture constraint $n_D = n_T$, $n_D$ and $n_T$ are the deuterium
    and tritium ion densities in $\mathrm{m}^{-3}$, $\psi$ is the poloidal magnetic
    flux in Wb, $dl$ is the poloidal contour length element in m, and $B_p$ is the
    magnitude of the poloidal magnetic field in T. The contour integral is taken around
    the intersection of the flux surface with a poloidal plane in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    In practice this quantity is obtained from equilibrium and transport or edge-plasma
    calculations by evaluating the local deuterium and tritium ion densities on the
    reconstructed magnetic surface and applying the flux-surface metric weighting.
    It is appropriate only when the DT pseudo-species approximation is intended; unequal
    isotope mixtures should be represented by separate deuterium and tritium density
    quantities.


    Typical edge and separatrix flux-surface averages in tokamak plasmas are about
    $1 \times 10^{18}$-$1 \times 10^{20}$ $\mathrm{m}^{-3}$, depending on fueling,
    pumping, confinement regime, and detachment state. Core-adjacent surfaces in high-performance
    plasmas may approach a few $10^{20}$ $\mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_tritium_density_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
  - name:volume_averaged_deuterium_tritium_density
  - name:line_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_tritium_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_electron_temperature
  kind: scalar
  status: draft
  description: Electron temperature averaged over a magnetic flux surface using flux-surface-average
    weighting, giving the thermodynamic temperature associated with that surface after
    poloidal and toroidal variations are removed.
  documentation: 'Flux-surface-averaged electron temperature is the electron temperature
    averaged over one magnetic surface labeled by the poloidal magnetic flux $\psi$.
    It describes the thermodynamic temperature of the electron population associated
    with that surface, not the total electron thermal energy content.


    The flux-surface average of electron temperature is defined by the surface-element
    weighting appropriate to a magnetic-flux label:


    $$

    \langle T_e \rangle_\psi = \frac{\int_{\psi=\mathrm{const}} T_e\, dS / |\nabla
    \psi|}{\int_{\psi=\mathrm{const}} dS / |\nabla \psi|}

    $$


    where $T_e$ is the local electron temperature in eV, $dS$ is a surface element
    in m^2 on the magnetic surface, $\psi$ is the poloidal magnetic flux label in
    Wb, and $|\nabla\psi|$ is in Wb m^-1. In an axisymmetric equilibrium this is equivalently
    a poloidal-contour average weighted by $dl/B_p$, where $dl$ is distance along
    the poloidal contour and $B_p$ is the poloidal magnetic-field magnitude.


    In practice, the quantity is obtained by mapping local electron-temperature measurements
    or model results onto reconstructed magnetic surfaces and applying the flux-surface-average
    weighting. At the separatrix it gives the limiting closed-surface value used to
    characterize the boundary between confined plasma and the scrape-off layer, but
    the definition applies to any closed flux surface. It differs from [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature),
    which averages over a finite plasma volume, and from [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target),
    which is a local material-surface temperature on open field lines.


    Typical edge and separatrix values are 10-300 eV in many L-mode and detached-boundary
    conditions, while H-mode pedestal surfaces can reach 100-2000 eV. Hot core flux
    surfaces in high-performance plasmas can have flux-surface-averaged electron temperatures
    of 1000-20000 eV.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature
  - name:electron_pressure_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
  arguments:
  - name: electron_temperature
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_magnetic_shear
  kind: scalar
  status: draft
  description: Normalized logarithmic derivative of the safety factor with respect
    to normalized toroidal flux radius, reported as the representative magnetic shear
    on a complete magnetic flux surface.
  documentation: 'Flux-surface-averaged magnetic shear is the value of [magnetic_shear](name:magnetic_shear)
    representative of a complete magnetic flux surface. It quantifies how rapidly
    magnetic field-line pitch changes between neighboring flux surfaces through the
    radial variation of the [safety factor](name:safety_factor) $q$ with the radial
    flux coordinate $\rho_\mathrm{tor}$ (normalized toroidal flux radius). Because
    $q$ and $\rho_\mathrm{tor}$ are flux functions in this definition, the surface
    average equals the single safety-factor-shear value on that surface.


    The defining relation on a surface labeled by $\rho_\mathrm{tor}$ is:


    $$

    s_\mathrm{fs}(\rho_\mathrm{tor}) = \frac{\rho_\mathrm{tor}}{q(\rho_\mathrm{tor})}\frac{d
    q}{d\rho_\mathrm{tor}}

    $$


    where $s_\mathrm{fs}$ is the flux-surface-averaged magnetic shear, $q$ is the
    dimensionless safety factor, and $\rho_\mathrm{tor}$ is dimensionless with $\rho_\mathrm{tor}=0$
    at the magnetic axis and $\rho_\mathrm{tor}=1$ at the last closed flux surface.
    The derivative is taken outward across neighboring flux surfaces, so applying
    a flux-surface average to this safety-factor-shear definition does not change
    the value.


    In practice, this quantity is obtained from an equilibrium description by evaluating
    the safety-factor variation as a function of $\rho_\mathrm{tor}$ and differentiating
    it at the selected flux surface. Related special-surface evaluations include [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis),
    [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal), [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier),
    [magnetic_shear_at_plasma_boundary](name:magnetic_shear_at_plasma_boundary), and
    [magnetic_shear_at_sawtooth_inversion_radius](name:magnetic_shear_at_sawtooth_inversion_radius).


    Typical values are dimensionless. In conventional H-mode tokamak scenarios, $s_\mathrm{fs}$
    is near zero at the magnetic axis and commonly reaches about 2-5 toward the edge;
    reversed-shear configurations can have negative core values, often around -1 to
    -2.


    Sign convention: Positive when the safety factor $q$ increases with increasing
    normalized toroidal flux radius $\rho_\mathrm{tor}$.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear
  - name:safety_factor
  - name:magnetic_shear_at_plasma_boundary
  arguments:
  - name: magnetic_shear
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_total_ion_density
  kind: scalar
  status: draft
  description: Flux-surface average of the aggregate ion number density, formed by
    summing the number densities of all charged ion species and charge states without
    charge weighting. Neutral atoms and molecules are excluded, so it represents ion
    particle density rather than charge density.
  documentation: 'Flux-surface-averaged total ion density is the magnetic-surface
    mean of the local aggregate ion number density. The local aggregate is an unweighted
    particle-density sum over all charged ion species and ionization states; neutral
    atoms and molecules are excluded, and no multiplication by charge state is applied.


    For a magnetic flux surface labeled by poloidal magnetic flux $\psi$, the flux-surface
    average can be written as


    $$

    \langle n_{i,\mathrm{tot}} \rangle_\psi = \frac{\int_{\psi=\mathrm{const}} \left(\sum_{\alpha}\sum_{z\ge
    1} n_{\alpha z}\right)\, dS/|\nabla\psi|}{\int_{\psi=\mathrm{const}} dS/|\nabla\psi|}

    $$


    where $\psi$ is in Wb, $dS$ is a surface-area element in m^2, $|\nabla\psi|$ is
    in Wb m^-1, $n_{\alpha z}$ is the number density in m^-3 of ion species $\alpha$
    in charged ionization state $z$, and the sums include only charged states with
    $z \ge 1$. The factor $dS/|\nabla\psi|$ gives the volume weighting of a thin shell
    between neighboring flux surfaces, and the resulting average has units m^-3.


    In practice this quantity is obtained by combining an equilibrium geometry with
    local or modeled ion composition, summing the charged ion particle densities on
    each flux surface before averaging. Electron density and quasineutrality constrain
    a charge-weighted ion sum, so composition information is needed to recover the
    unweighted total ion particle density; neutral-density contributions are not included.


    Typical edge-plasma values in magnetic-confinement devices are about $10^{18}-10^{20}$
    m^-3, depending on fueling, confinement regime, impurity content, and radial location
    relative to the confined edge and boundary region.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_density
  - name:flux_surface_averaged_boron_density
  - name:flux_surface_averaged_deuterium_tritium_density
  arguments:
  - name: total_ion_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: gradient_of_electron_pressure
  kind: scalar
  status: draft
  description: Signed derivative of electron pressure with respect to normalized poloidal
    magnetic flux, evaluated at the H-mode pedestal location of greatest absolute
    pressure steepness. The selection uses the largest magnitude of the derivative,
    while the reported value retains its algebraic sign.
  documentation: 'The gradient of electron pressure is the signed slope of [electron_pressure](name:electron_pressure)
    with respect to the normalized poloidal magnetic flux coordinate $\psi_N$ in the
    H-mode pedestal. It is evaluated at the pedestal location where the absolute value
    of that slope is greatest, so a steep outward pressure drop is selected by magnitude
    but reported with its negative sign.


    The defining value is


    $$

    G_{p_e} = \left.\frac{d p_e}{d\psi_N}\right|_{\psi_N=\psi_*}, \qquad \psi_* =
    \operatorname*{arg\,max}_{\psi_N \in \mathrm{pedestal}} \left|\frac{d p_e}{d\psi_N}\right|

    $$


    where $p_e$ is electron pressure, $\psi_N$ is normalized poloidal magnetic flux
    increasing from 0 at the magnetic axis to 1 at the last closed flux surface, and
    $\psi_*$ is the pedestal location of maximum absolute slope. Electron pressure
    is $p_e=n_e k_B T_e$ when $T_e$ is thermodynamic temperature in K, equivalently
    $p_e=n_e e T_e$ when $T_e$ is reported in eV; $n_e$ is electron density in m$^{-3}$,
    $k_B$ is the Boltzmann constant, and $e$ is the elementary charge.


    In practice this quantity is obtained by fitting the radial dependence of electron
    pressure across the pedestal, often from electron density and temperature measurements
    such as Thomson scattering, and then differentiating the fitted function with
    respect to $\psi_N$. Modified hyperbolic-tangent and piecewise-linear fits are
    common ways to locate the steepest pedestal segment. This normalized-flux derivative
    complements [gradient_of_electron_temperature](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top)
    and gradient_of_electron_density, and differs from [gradient_of_radial_electron_pressure](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal),
    which is a spatial derivative requiring a local conversion between $\psi_N$ and
    a chosen radial distance.


    Typical signed values are usually negative in ordinary H-mode pedestals. Absolute
    magnitudes are about $10^4$-$10^6$ Pa in present tokamaks; small or low-pressure
    pedestals can be near $10^3$ Pa, while high-performance pedestals can reach several
    $10^6$ Pa.


    Sign convention: Positive when electron pressure increases as the normalized poloidal
    magnetic flux coordinate $\psi_N$ increases from the magnetic axis toward the
    last closed flux surface.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal
  arguments:
  - name: electron_pressure
    operator: gradient
    operator_kind: unary_prefix
- name: magnetic_shear_at_pedestal
  kind: scalar
  status: draft
  description: Dimensionless magnetic shear at the H-mode pedestal, equal to the normalized
    logarithmic derivative of the safety factor with respect to normalized toroidal
    flux radius evaluated at the steep edge transport barrier.
  documentation: 'Magnetic shear at the pedestal is the value of [magnetic_shear](name:magnetic_shear)
    on the flux surface corresponding to the H-mode transport barrier, characterizing
    how rapidly the magnetic field-line pitch changes with normalized toroidal flux
    radius in the steep-gradient edge region.


    The defining relation is:


    $$

    s_\mathrm{ped} = \left. \frac{\rho_\mathrm{tor}}{q} \frac{dq}{d\rho_\mathrm{tor}}
    \right|_{\rho_\mathrm{ped}}

    $$


    where $q$ is the safety factor, $\rho_\mathrm{tor}$ is the normalized toroidal
    flux radius running from 0 at the magnetic axis to 1 at the last closed flux surface,
    and $\rho_\mathrm{ped}$ is the radial coordinate of the pedestal.


    The pedestal magnetic shear is obtained from equilibrium reconstruction by evaluating
    the logarithmic derivative of the safety factor profile at the reconstructed pedestal
    location. It enters peeling-ballooning stability analyzes that govern edge-localized
    mode onset, and it complements the on-axis value given by [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis)
    and the boundary value given by [magnetic_shear_at_plasma_boundary](name:magnetic_shear_at_plasma_boundary).
    In conventional H-mode scenarios, $s_\mathrm{ped}$ typically ranges from 1 to
    5, reflecting the rapid outward rise of the safety factor profile near the plasma
    edge.


    Sign convention: Positive when the safety factor $q$ increases with increasing
    normalized toroidal flux radius $\rho_\mathrm{tor}$ at the pedestal location.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_plasma_boundary
  arguments:
  - name: magnetic_shear
    operator: pedestal
    operator_kind: locus
- name: magnetic_shear_at_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless magnetic shear at the last closed flux surface, equal
    to the normalized radial derivative of the safety factor with respect to normalized
    toroidal flux radius at the plasma boundary.
  documentation: 'Magnetic shear at the plasma boundary is the value of magnetic shear
    on the last closed flux surface. It quantifies how rapidly the magnetic field-line
    pitch, represented by the [safety factor](name:safety_factor), changes with normalized
    toroidal flux radius at the edge of the confined plasma.


    The boundary value is defined by evaluating the magnetic-shear expression at the
    outer end of the normalized toroidal flux radius:


    $$

    s_b = \left. \frac{\rho_\mathrm{tor}}{q}\frac{dq}{d\rho_\mathrm{tor}} \right|_{\rho_\mathrm{tor}=1}

    $$


    where $s_b$ is the dimensionless magnetic shear at the plasma boundary, $\rho_\mathrm{tor}$
    is the dimensionless normalized toroidal flux radius with $\rho_\mathrm{tor}=1$
    on the last closed flux surface, and $q$ is the dimensionless safety factor.


    In practice this quantity is computed from an equilibrium reconstruction or magnetic-geometry
    model by fitting or differentiating $q(\rho_\mathrm{tor})$ near the boundary.
    Because it depends on a radial derivative, it is sensitive to edge resolution,
    separatrix location, and smoothing of the reconstructed safety-factor variation.


    Typical tokamak edge values are about 2-10 in conventional H-mode equilibria,
    with values near 1-5 often found in weaker-shear edge conditions and larger values
    possible in strongly shaped or high edge-current-gradient plasmas. Values near
    zero indicate weak radial variation of field-line pitch, while negative values
    occur when $q$ decreases outward with increasing $\rho_\mathrm{tor}$.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_pedestal
  - name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  - name:magnetic_shear_at_magnetic_axis
  arguments:
  - name: magnetic_shear
    operator: plasma_boundary
    operator_kind: locus
  sources:
  - id: dd:summary/local/separatrix/magnetic_shear/value
    dd_path: summary/local/separatrix/magnetic_shear/value
    status: composed
- name: normalized_poloidal_flux_coordinate_of_pedestal
  kind: scalar
  status: draft
  description: Radial flux-surface location of the H-mode pedestal, expressed by the
    normalized poloidal flux coordinate. It identifies the position of the edge transport
    barrier relative to the magnetic axis and the last closed flux surface.
  documentation: 'The normalized poloidal flux coordinate of the pedestal is the value
    of the flux coordinate $\psi_N$ at the characteristic radial location of the H-mode
    pedestal or edge transport barrier. It specifies where the pedestal sits between
    the magnetic axis and the last closed flux surface; the associated normalized_width_of_pedestal
    gives the pedestal extent in the same coordinate.


    The normalized poloidal flux coordinate is defined by normalizing the poloidal
    magnetic flux to its magnetic-axis and last-closed-flux-surface values:


    $$

    \psi_N = \frac{\psi - \psi_\mathrm{axis}}{\psi_\mathrm{LCFS} - \psi_\mathrm{axis}}

    $$


    where $\psi$ is the poloidal magnetic flux at the flux surface of interest, $\psi_\mathrm{axis}$
    is its value at the magnetic axis, and $\psi_\mathrm{LCFS}$ is its value at the
    last closed flux surface. With this definition, $\psi_N = 0$ at the magnetic axis
    and $\psi_N = 1$ at the last closed flux surface.


    In practice, the pedestal position is obtained by mapping edge measurements of
    density, temperature, or pressure onto equilibrium flux surfaces and locating
    the characteristic pedestal center or transition position from the resulting radial
    variation. Different physical channels and fitting choices can give slightly different
    pedestal positions, so the quantity should be interpreted as the location associated
    with the specified pedestal observable.


    In H-mode plasmas the pedestal position is usually close to the plasma edge, typically
    $\psi_N = 0.90$-$1.05$, with many pedestal centers lying around $0.95$-$1.00$.
    Values below 1 are inside the last closed flux surface, while values slightly
    above 1 can occur when the inferred transition extends into the near scrape-off-layer
    region or when the fitted midpoint lies just outside the separatrix.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: normalized_poloidal_flux_coordinate
    operator: pedestal
    operator_kind: locus
- name: parallel_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Parallel component of the heat-viscosity-driven current density, obtained
    by projecting that current-density vector onto the local magnetic-field direction.
  documentation: 'Parallel current density due to heat viscosity is the field-aligned
    scalar component of the current density associated with heat-viscosity transport
    effects. It represents the part of this signed electric current density that flows
    along, or opposite to, the local magnetic field direction.


    The component is defined by projection onto the magnetic-field unit vector:


    $$

    j_{\parallel}^{\mathrm{hv}} = \mathbf{j}_{\mathrm{hv}} \cdot \hat{\mathbf{b}},
    \qquad \hat{\mathbf{b}} = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathbf{j}_{\mathrm{hv}}$ is the heat-viscosity-driven current-density
    vector in A m^-2, $\mathbf{B}$ is the magnetic-field vector in T, $|\mathbf{B}|$
    is the magnetic-field magnitude in T, and $\hat{\mathbf{b}}$ is the dimensionless
    unit vector along the local magnetic field.


    This quantity is usually computed in edge-plasma transport or fluid modeling by
    first evaluating the heat-viscosity current-density vector and then taking its
    projection along $\hat{\mathbf{b}}$. It is not normally measured as a separate
    diagnostic observable, but may contribute to modeled current balance, parallel
    closure currents, sheath-connected current paths, and comparisons with magnetic
    or electric-current constraints.


    Representative signed values in edge-plasma applications are often near zero where
    heat-viscosity effects are weak, with typical modeled ranges from -10^3 to 10^3
    A m^-2 and localized excursions up to about -10^4 to 10^4 A m^-2 in steep-gradient
    or strongly driven regions.


    Sign convention: Positive when the heat-viscosity-driven current density is directed
    along the local magnetic field $\mathbf{B}$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_heat_viscosity
  - name:toroidal_current_density_due_to_heat_viscosity
  - name:vertical_current_density_due_to_heat_viscosity
