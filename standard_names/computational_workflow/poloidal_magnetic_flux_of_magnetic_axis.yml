name: poloidal_magnetic_flux_of_magnetic_axis
status: draft
cocos_transformation_type: psi_like
description: Value of the poloidal magnetic flux $\psi$ at the magnetic axis, the
  $O$-point where $\nabla\psi = 0$ inside the plasma.
documentation: "The poloidal magnetic flux at the magnetic axis, $\\psi_{\\mathrm{axis}}\
  \ = \\psi(R_{\\mathrm{axis}}, Z_{\\mathrm{axis}})$ (Wb), is the extremum of the\
  \ poloidal flux function $\\psi(R,Z)$ within the last closed flux surface, located\
  \ at the $O$-point satisfying $\\nabla\\psi = 0$. Together with the boundary value\
  \ $\\psi_{\\mathrm{bnd}}$, it defines the normalized poloidal flux coordinate $\\\
  hat{\\psi} = (\\psi - \\psi_{\\mathrm{axis}})/(\\psi_{\\mathrm{bnd}} - \\psi_{\\\
  mathrm{axis}})$, which maps 0 at the axis to 1 at the separatrix and serves as the\
  \ standard radial coordinate for 1-D profile representation. Typical absolute values\
  \ range from a few Wb in medium-size tokamaks (e.g., TCV, ASDEX Upgrade) to tens\
  \ of Wb in large devices ($|\\psi_{\\mathrm{axis}}| \\sim 10$\u201340 Wb for ITER-class\
  \ equilibria). Obtained from Grad\u2013Shafranov equilibrium reconstruction codes\
  \ such as EFIT, LIUQE, or NICE. Positive $\\psi_{\\mathrm{axis}}$ under COCOS-11\
  \ when $I_p$ flows counter-clockwise viewed from above and $\\psi$ increases from\
  \ axis to boundary. See also `major_radius_of_magnetic_axis` for the spatial location\
  \ and `poloidal_magnetic_flux_of_halo_boundary` for the boundary counterpart."
