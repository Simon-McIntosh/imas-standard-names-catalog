- name: radial_ion_state_energy_diffusivity
  kind: scalar
  status: draft
  description: Radial cross-field diffusion coefficient for thermal energy carried
    by a particular ion charge state in the edge plasma. It governs the diffusive,
    perpendicular part of ion-state energy transport across magnetic flux surfaces.
  documentation: 'Radial ion-state energy diffusivity is the effective transport coefficient
    that relates the thermal-energy flux of one resolved ion charge state to a radial
    cross-field thermodynamic gradient. It is charge-state specific, so it applies
    only to the modeled population of that ionization state and contributes to aggregated
    ion or total energy transport through density- and abundance-weighted combinations
    with other states.


    A common Fick-law representation for the diffusive radial energy flux density
    is


    $$

    q_{E,r}^{(s)} = -D_{E,r}^{(s)} \, \nabla_r u_E^{(s)}, \qquad u_E^{(s)} = \frac{3}{2}
    n_s T_s

    $$


    where $q_{E,r}^{(s)}$ is the radial energy flux density of charge state $s$ in
    W m$^{-2}$, $D_{E,r}^{(s)}$ is this diffusivity, $u_E^{(s)}$ is the thermal energy
    density, $n_s$ is the ion charge-state density, $T_s$ is the ion temperature expressed
    in energy units, and $\nabla_r u_E^{(s)}$ is the outward cross-field gradient
    of thermal energy density in J m$^{-4}$. When density variation is treated separately
    or is locally weak, this is equivalent to the temperature-gradient form $q_{E,r}^{(s)}
    \simeq -(3/2)n_s D_{E,r}^{(s)}\nabla_r T_s$, which is the form often used for
    species-summed and total energy diffusion coefficients.


    In edge transport modeling, this coefficient is prescribed, fitted, or inferred
    from comparisons between simulated and measured ion temperatures, radiation, charge-state
    densities, and energy fluxes. It is distinct from [radial_ion_state_diffusivity](name:radial_ion_state_diffusivity)
    for particle transport and [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity)
    for momentum transport; its associated flux quantity is [radial_ion_charge_state_energy_flux](name:radial_ion_state_energy_flux).
    State-resolved coefficients combine to form aggregate quantities such as radial_total_energy_diffusion_coefficient
    and [radial_total_thermal_ion_energy_diffusivity_over_edge_region](name:radial_total_thermal_ion_energy_diffusivity_over_edge_region).


    Typical effective values in edge and scrape-off-layer plasmas range from 0.1-20
    m^2 s^-1. Smaller values are associated with weak turbulent mixing or near-closed-field-line
    confinement, while larger values may represent enhanced cross-field transport,
    detached divertor conditions, or empirical broadening used to match measured edge
    energy losses.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_diffusivity
  - name:radial_ion_state_momentum_diffusivity
  - name:radial_ion_state_energy_flux
  - name:radial_total_thermal_ion_energy_diffusivity_over_edge_region
- name: radial_momentum_coefficient
  kind: scalar
  status: draft
  description: "Dimensionless, non-negative flux-limiter coefficient for transport\
    \ of momentum along the major-radius direction R in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It scales the collisionless free-streaming upper bound\
    \ on the radial momentum-flux density, capping how large the modeled radial momentum\
    \ flux may become; the inward or outward sign is carried by the underlying momentum\
    \ flux, not by this coefficient."
  documentation: 'The radial momentum coefficient $C_R$ is a dimensionless flux-limiter
    factor for transport of momentum along the major-radius direction $R$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is a non-negative magnitude limiter: it
    scales the collisionless free-streaming upper bound on the radial momentum-flux
    density, so that diffusive transport closures cannot drive an unphysically large
    flux in steep-gradient edge regions. The inward or outward sign of the transported
    momentum is carried by the underlying momentum flux, not by this coefficient.


    The limiter caps the modeled radial momentum-flux density at a fraction of the
    collisionless free-streaming upper bound:


    $$

    \left|\Pi_R\right| \le C_R \, \Pi_{\mathrm{fs},R}, \qquad \Pi_{\mathrm{fs},R}
    \sim n_s m_s v_{\mathrm{th},s} \left|u_s\right|

    $$


    where $\Pi_R$ is the radial momentum-flux density, $C_R$ is the dimensionless
    coefficient, and $\Pi_{\mathrm{fs},R}$ is the collisionless free-streaming momentum-flux-density
    scale. For species $s$, $n_s$ is the number density in m$^{-3}$, $m_s$ is the
    particle mass in kg, $v_{\mathrm{th},s}$ is the thermal speed in m s$^{-1}$, and
    $u_s$ is the flow-velocity component being transported in m s$^{-1}$; the product
    has units kg m$^{-1}$ s$^{-2}$, equivalent to Pa.


    The coefficient is a user-specified model parameter assigned prior to a transport
    simulation rather than a quantity inferred from diagnostics. It may be set separately
    for ion, neutral, or total momentum transport and is often tuned via sensitivity
    studies to keep diffusive closures within physically plausible collisionless limits.


    Typical values lie between 0 and 1. Values much smaller than unity impose a strong
    limiter that strongly suppresses radial momentum transport, while values of order
    unity allow the flux to approach the selected free-streaming upper bound.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:radial_neutral_momentum_coefficient
  - name:parallel_momentum_coefficient
  - name:poloidal_momentum_coefficient
  - name:toroidal_ion_state_momentum_coefficient
  - name:vertical_momentum_coefficient
  arguments:
  - name: momentum_coefficient
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_plasma_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Effective radial diffusion coefficient for cross-field transport of
    ion-fluid momentum in the edge plasma. It aggregates the momentum carried by all
    ion species and charge states into a single transport parameter, rather than resolving
    it per species or charge state.
  documentation: 'Radial plasma momentum diffusion coefficient is the scalar coefficient
    that relates the radial (cross-field) diffusive flux of ion-fluid momentum to
    the radial gradient of momentum density in the edge plasma. It is an aggregate
    quantity summed over all ion species and charge states; electron inertial momentum
    is usually negligible in these ion-dominated edge regimes and is not included.
    It complements the species- and charge-state-resolved [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity).


    In a Fickian transport closure, the radial diffusive flux of a momentum component
    is proportional to the radial gradient of the corresponding aggregate momentum
    density:


    $$

    \Gamma_j = -D \, \frac{\partial \mathcal{P}_j}{\partial r_\perp}

    $$


    where $D$ is the radial plasma momentum diffusion coefficient, $\Gamma_j$ is the
    radial flux of the $j$-th momentum component in kg m^-1 s^-2, $r_\perp$ is the
    distance measured outward normal to flux surfaces in m, and $\mathcal{P}_j = \sum_{a,z}
    m_a\, n_{a,z}\, u_{a,z,j}$ is the aggregate ion momentum density in kg m^-2 s^-1,
    with $m_a$ the ion mass in kg, $n_{a,z}$ the number density of charge state $z$
    of species $a$ in m^-3, and $u_{a,z,j}$ the corresponding fluid-velocity component
    in m s^-1. The leading minus sign means a positive coefficient drives momentum
    down its gradient, from regions of higher toward lower momentum density.


    The coefficient is typically inferred as an effective transport parameter from
    edge momentum-balance analysis, measured ion flows and rotation shear, and comparisons
    with collisional, neoclassical, or turbulence-based transport estimates. It is
    the aggregate momentum counterpart to the aggregate energy and particle transport
    coefficients radial_total_energy_diffusion_coefficient and [radial_diffusion_coefficient](name:radial_ion_particle_diffusivity),
    and pairs with the convective term radial_ion_effective_momentum_convection_velocity
    in diffusion-convection closures.


    Representative effective edge-plasma values used in transport modeling are of
    order 0.01-10 m^2 s^-1, with smaller values where diffusive coupling is weak and
    larger values in regions of strong turbulent or externally driven momentum redistribution.
    This range is indicative and not a physical bound.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_momentum_diffusivity
  - name:radial_ion_particle_diffusivity
- name: radiated_power_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Total electromagnetic power radiated from the open field-line scrape-off
    layer plasma by all species and emission channels combined.
  documentation: 'The radiated power over the scrape-off layer is the total electromagnetic
    power emitted by plasma occupying the open field-line region between the magnetic
    separatrix and the first wall or divertor structures. Contributions arise from
    line radiation of impurity ions (both intrinsic and deliberately seeded species
    such as argon or neon), hydrogen isotope resonance emission, bremsstrahlung, and
    radiative recombination, integrated over the full SOL volume.


    The total SOL radiated power is the volume integral of the local emissivity:


    $$

    P_\mathrm{rad,SOL} = \int_\mathrm{SOL} \varepsilon_\mathrm{rad}(\mathbf{r}) \,
    dV

    $$


    where $\varepsilon_\mathrm{rad} = n_e \sum_z n_z L_z(T_e, n_e)$, with $n_e$ the
    electron number density, $n_z$ the density of radiating species $z$, and $L_z$
    the temperature- and density-dependent cooling function for species $z$.


    It is measured via resistive or photodiode bolometer arrays, with the spatial
    distribution recovered by tomographic inversion. Alternatively, it is inferred
    from global power balance by subtracting the conducted and convected power reaching
    the divertor targets from the total power crossing the separatrix given by total_lost_power_at_plasma_boundary.


    A high SOL radiated power fraction $f_\mathrm{rad} = P_\mathrm{rad,SOL} / P_\mathrm{SOL}$
    is the primary control target in reactor-relevant divertor detachment scenarios,
    as it disperses the power load before it reaches solid surfaces. The residual
    non-radiated heat governs the radial heat-flux profiles characterized by the [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer)
    and [ion_heat_decay_length_over_scrape_off_layer](name:ion_heat_decay_length_over_scrape_off_layer).
    This quantity is the radiated sub-component of power_over_scrape_off_layer.'
  unit: W
  physics_domain: edge_plasma_physics
  links:
  - name:electron_heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
- name: thermal_electron_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding scale length of the thermal electron temperature in
    the scrape-off layer. It is the positive inverse magnitude of the outward logarithmic
    radial gradient of the thermal electron temperature.
  documentation: 'Thermal electron decay length over the scrape-off layer is the characteristic
    distance over which the thermal electron temperature falls by a factor of $e$
    outside the last closed flux surface. It describes the local radial steepness
    of $T_e$ in the open-field-line region and is a positive scale length, not a signed
    gradient.


    For a local radial coordinate $r$ measured outward from the separatrix along the
    normal to magnetic flux surfaces into the scrape-off layer, an exponential falloff
    is represented by:


    $$

    T_e(r) \simeq T_{e,\mathrm{sep}} \exp\left[-\frac{r-r_{\mathrm{sep}}}{\lambda_{T_e}}\right],
    \qquad \lambda_{T_e} = \left|\frac{d\ln T_e}{dr}\right|^{-1}

    $$


    where $T_e$ is the thermal electron temperature in eV, $T_{e,\mathrm{sep}}$ is
    its separatrix value, $r_{\mathrm{sep}}$ is the separatrix location on the same
    outward radial coordinate, and $\lambda_{T_e}$ is the thermal electron temperature
    decay length.


    In practice, $\lambda_{T_e}$ is obtained by fitting an exponential or local logarithmic-gradient
    model to scrape-off-layer electron temperature measurements or reconstructed edge
    profiles. The radial coordinate is usually interpreted locally at a specified
    poloidal location, such as the outboard midplane or divertor-mapped upstream location,
    because flux expansion and magnetic geometry can make the apparent decay length
    location dependent.


    Typical values in tokamak scrape-off layers are about 0.002-0.05 m, with shorter
    lengths in high-confinement, high-power-density conditions and longer lengths
    in cooler, lower-power, or more weakly magnetized edge plasmas.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: electron_decay_length_over_scrape_off_layer
    operator: thermal
    operator_kind: qualifier
- name: toroidal_angle_of_active_limiter_point
  kind: scalar
  status: draft
  description: "Toroidal angle, in radians, of the active limiter point: the point\
    \ where the plasma boundary contacts the limiter surface. It is measured in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, with \u03C6 increasing counter-clockwise\
    \ when viewed from above +Z."
  documentation: 'The toroidal angle of the active limiter point is the azimuthal
    coordinate of the plasma-boundary contact point on a limiter surface. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $Z$ is vertical height,
    and $\phi$ is the angle about the toroidal symmetry axis.


    For a contact point with Cartesian coordinates $(x,y,z)$ in the right-handed $(\hat{x},
    \hat{y}, \hat{z})$ basis, with $\hat{z}=\hat{Z}$, the toroidal angle is defined
    by


    $$

    \phi = \operatorname{atan2}(y, x)

    $$


    where $\operatorname{atan2}$ returns the signed angular displacement from the
    chosen $+x$ reference direction to the point''s projection in the horizontal plane.
    The angle $\phi$ is measured in radians; because radians are dimensionless, the
    canonical unit may be written as $1$.


    In practice, this quantity is computed from the three-dimensional location assigned
    to the active plasma-limiter contact point by projecting that point onto the horizontal
    plane and evaluating its azimuth. The definition is purely geometric and does
    not depend on a particular reconstruction code or diagnostic method.


    Typical reported values lie in a $2\pi$ interval, most commonly $0-2\pi$ rad or
    equivalently $-\pi$ to $\pi$ rad depending on angle wrapping. Values differing
    by $2\pi$ rad represent the same physical toroidal direction.


    Sign convention: Positive when $\phi$ increases in the counter-clockwise toroidal
    direction when viewed from above along $+\hat{Z}$.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:major_radius_of_active_limiter_point
  - name:vertical_coordinate_of_active_limiter_point
  sources:
  - id: dd:edge_transport/model/ggd/ion/momentum/flux_limiter/phi
    dd_path: edge_transport/model/ggd/ion/momentum/flux_limiter/phi
    status: composed
- name: toroidal_argon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of argon impurity bulk flow velocity evaluated at
    the H-mode pedestal top, a key quantity for determining the pedestal radial electric
    field through the impurity force balance.
  documentation: 'The toroidal velocity of argon ions at the pedestal top quantifies
    the $\hat{\phi}$-directed bulk flow of this impurity species within the steep-gradient
    edge transport barrier of H-mode plasmas. Alongside [toroidal nitrogen velocity
    at the pedestal](name:toroidal_nitrogen_velocity_at_pedestal) and [toroidal tungsten
    velocity at the pedestal](name:toroidal_tungsten_velocity_at_pedestal), it enables
    species-resolved comparison of impurity momentum transport in the pedestal region.


    The toroidal velocity component $v_\phi^{\rm Ar}$ enters the radial force balance
    for argon ions:


    $$

    E_r = v_\phi^{\rm Ar} B_\theta - v_\theta^{\rm Ar} B_\phi + \frac{1}{Z_{\rm Ar}
    e n_{\rm Ar}} \frac{dp_{\rm Ar}}{dr}

    $$


    where $E_r$ is the radial electric field, $B_\theta$ and $B_\phi$ are the poloidal
    and toroidal magnetic field components, $v_\theta^{\rm Ar}$ is the argon poloidal
    velocity, $Z_{\rm Ar}$ is the mean ionization state of argon, $n_{\rm Ar}$ is
    the argon number density (see [argon density at the pedestal](name:argon_density_at_pedestal)),
    and $p_{\rm Ar}$ is the argon pressure.


    Argon toroidal velocity at the pedestal is measured by charge exchange recombination
    spectroscopy (CXRS), which detects the Doppler shift of argon emission lines excited
    by neutral beam injection in the pedestal region. The full radial profile of argon
    rotation is built from this pedestal value together with the counterpart quantities
    [at the magnetic axis](name:toroidal_argon_velocity_at_magnetic_axis), [at the
    internal transport barrier](name:toroidal_argon_velocity_at_internal_transport_barrier),
    and [at the plasma boundary](name:toroidal_argon_velocity_at_plasma_boundary).


    Sign convention: Positive when the argon flow points in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_pedestal
  - name:toroidal_tungsten_velocity_at_pedestal
  - name:argon_density_at_pedestal
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_internal_transport_barrier
  - name:toroidal_argon_velocity_at_plasma_boundary
- name: toroidal_argon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Local toroidal component of the argon ion bulk flow velocity evaluated
    at the last closed flux surface (separatrix). This is the pointwise boundary value,
    not a flux-surface average; for the averaged counterpart see the flux-surface-averaged
    variant.
  documentation: "Toroidal argon velocity at the plasma boundary is the local projection\
    \ of the argon impurity ion bulk velocity onto the toroidal direction at the last\
    \ closed flux surface (separatrix) in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is\
    \ vertical height. The quantity denotes a local value on the separatrix; a flux-surface-averaged\
    \ boundary velocity is a separate concept.\n\nThe toroidal component is obtained\
    \ by projecting the argon bulk velocity onto the toroidal unit vector:\n\n$$\n\
    v_{\\phi,\\mathrm{Ar}} = \\mathbf{v}_{\\mathrm{Ar}} \\cdot \\hat{\\phi}\n$$\n\n\
    where $\\mathbf{v}_{\\mathrm{Ar}}$ is the argon ion bulk velocity (in m\xB7s$^{-1}$)\
    \ and $\\hat{\\phi}$ is the dimensionless unit vector in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame.\n\
    \nThe velocity is primarily measured using charge-exchange recombination spectroscopy\
    \ (CXRS), which resolves the Doppler shift of argon emission lines produced by\
    \ charge exchange with injected neutral beams. Passive edge spectroscopy of argon\
    \ lines can also provide local estimates when combined with equilibrium reconstruction\
    \ of the separatrix location. The measurement is local in the sense that it applies\
    \ to the argon population at a given poloidal and toroidal position on the boundary;\
    \ poloidal variation is expected and not removed by this definition.\n\nTypical\
    \ toroidal argon velocities at the separatrix range from a few km\xB7s$^{-1}$\
    \ in low-momentum ohmic plasmas to several tens of km\xB7s$^{-1}$ in strongly\
    \ beam-heated discharges. The sign reflects the direction of edge rotation and\
    \ can be either co- or counter-current depending on momentum input.\n\nSign convention:\
    \ Positive when the argon bulk flow projects in the direction of increasing toroidal\
    \ angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame, i.e., counter-clockwise\
    \ when viewed from above the $+\\hat{Z}$ direction."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  - name:toroidal_xenon_velocity_at_plasma_boundary
  - name:toroidal_tungsten_velocity_at_plasma_boundary
- name: toroidal_beryllium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of beryllium impurity ion velocity at the H-mode
    pedestal, where the steep electron pressure gradient defines the edge transport
    barrier.
  documentation: 'The toroidal velocity of beryllium ions at the pedestal is the projection
    of the beryllium impurity ion fluid velocity onto the toroidal direction $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, evaluated at the pedestal
    location.


    The defining projection is:


    $$

    v_{\phi}^{\rm Be} = \mathbf{v}_{\rm Be} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\rm Be}$ is the beryllium ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    Toroidal impurity rotation is measured by charge exchange recombination spectroscopy
    (CXRS), in which the Doppler shift of Be emission lines at the pedestal chord
    positions yields the local toroidal velocity. The pedestal''s steep pressure gradient
    and associated radial electric field well can drive strong toroidal velocity shear,
    contributing to turbulence suppression at the edge transport barrier. Toroidal
    velocities at the pedestal range from near-zero in low-momentum-input plasmas
    to tens of km/s in discharges with strong neutral-beam injection. Position-resolved
    analogs are available via [toroidal_beryllium_velocity_at_plasma_boundary](name:toroidal_beryllium_velocity_at_plasma_boundary)
    and [toroidal_beryllium_velocity_at_magnetic_axis](name:toroidal_beryllium_velocity_at_magnetic_axis);
    the analogous quantity for tritium at the same location is toroidal_tritium_velocity_at_pedestal.


    Sign convention: Positive when $v_{\phi}^{\rm Be}$ is directed in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_beryllium_velocity_at_plasma_boundary
  - name:toroidal_beryllium_velocity_at_magnetic_axis
- name: toroidal_beryllium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the beryllium impurity ion bulk flow velocity
    at the plasma boundary, summed over all ionization stages and averaged over the
    last closed flux surface.
  documentation: 'The toroidal component of the beryllium impurity ion bulk flow velocity
    at the plasma boundary quantifies the azimuthal rotation of beryllium ions at
    the last closed flux surface, which separates the magnetically confined plasma
    from the open-field-line scrape-off layer. This quantity encompasses all beryllium
    ionization stages (Be$^+$ through Be$^{4+}$) and represents the flux-surface-averaged
    toroidal impurity flow at the separatrix.


    The toroidal velocity is defined as the projection of the charge-state-averaged
    beryllium ion fluid velocity onto the toroidal direction:


    $$

    v_{\phi,\mathrm{Be}} = \mathbf{v}_\mathrm{Be} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{Be}$ is the charge-state-averaged beryllium ion fluid
    velocity and $\hat{\phi}$ is the unit vector in the toroidal direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame.


    Beryllium toroidal rotation at the plasma boundary is inferred from charge exchange
    recombination spectroscopy (CXRS), which resolves the Doppler shift of emission
    lines produced during charge-transfer reactions between beryllium ions and diagnostic
    neutral beam atoms. This measurement constrains edge impurity momentum transport
    and toroidal rotation profiles near the separatrix.


    Toroidal impurity velocities at the plasma boundary span approximately $-10^5$
    to $+10^5$ m/s in tokamak plasmas, with sign and magnitude governed by plasma
    current direction, auxiliary heating power, and external toroidal momentum injection.
    The pedestal-top value is given by [toroidal_beryllium_velocity_at_pedestal](name:toroidal_beryllium_velocity_at_pedestal),
    and the on-axis value by [toroidal_beryllium_velocity_at_magnetic_axis](name:toroidal_beryllium_velocity_at_magnetic_axis);
    the associated impurity density at this location is characterized by [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary).


    Sign convention: Positive when the beryllium ion flow is directed in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_beryllium_velocity_at_pedestal
  - name:toroidal_beryllium_velocity_at_magnetic_axis
  - name:beryllium_density_at_plasma_boundary
- name: toroidal_carbon_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the carbon impurity ion fluid velocity evaluated
    at the pedestal top, the steep-gradient transport barrier just inside the separatrix
    in H-mode plasmas.
  documentation: 'The toroidal carbon velocity at the pedestal top quantifies the
    $\phi$-component of the carbon impurity ion fluid velocity at the top of the H-mode
    transport barrier, where the steep pressure-gradient region transitions to the
    flatter core profile. Carbon (typically fully stripped C$^{6+}$ in hot plasmas)
    provides a widely used spectroscopic tracer for plasma toroidal rotation because
    inter-species Coulomb collisions couple impurity and main-ion momenta on the neoclassical
    timescale.


    The toroidal velocity component is defined as:


    $$

    v_\phi = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{C}}$ is the carbon ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.


    This quantity is measured by charge exchange recombination spectroscopy (CXRS):
    a neutral beam excites carbon ions in the pedestal region, and the resulting Doppler-shifted
    C VI emission line encodes the line-of-sight velocity component. Spatial resolution
    is set by the beam geometry and viewing configuration. Typical pedestal-top values
    range from a few km/s up to tens of km/s depending on plasma current, heating
    scheme, and device size. The analogous carbon velocity at other radial locations
    includes [toroidal carbon velocity at the magnetic axis](name:toroidal_carbon_velocity_at_magnetic_axis),
    [at the internal transport barrier](name:toroidal_carbon_velocity_at_internal_transport_barrier),
    and [at the plasma boundary](name:toroidal_carbon_velocity_at_plasma_boundary).
    The hydrogen-isotope counterpart in the pedestal region is [toroidal hydrogen
    velocity at the pedestal](name:toroidal_hydrogen_velocity_at_pedestal).


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_magnetic_axis
  - name:toroidal_carbon_velocity_at_internal_transport_barrier
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_hydrogen_velocity_at_pedestal
- name: toroidal_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the carbon impurity ion bulk flow velocity at\
    \ the plasma boundary, resolved in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It is the local value at the last-closed flux surface, not a flux-surface\
    \ average."
  documentation: 'Toroidal carbon velocity at the plasma boundary is the component
    of the carbon impurity ion bulk flow along the toroidal direction at the last-closed
    flux surface or separatrix. The toroidal direction is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. This quantity denotes a local boundary value;
    the corresponding flux-surface-averaged quantity is [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary).


    The local toroidal component is defined by projecting the carbon bulk velocity
    onto the toroidal unit vector:


    $$

    v_{\phi}^{\mathrm{C}} = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi} = R\Omega_{\mathrm{C}}

    $$


    where $v_{\phi}^{\mathrm{C}}$ is the carbon toroidal velocity in m.s^-1, $\mathbf{v}_{\mathrm{C}}$
    is the carbon ion bulk velocity in m.s^-1, $\hat{\phi}$ is the unit vector in
    the direction of increasing toroidal angle $\phi$, $R$ is the major radius in
    m, and $\Omega_{\mathrm{C}}$ is the carbon toroidal angular rotation frequency
    in s^-1.


    In practice, this velocity is commonly inferred from Doppler shifts of carbon
    spectral lines, often using charge-exchange or passive edge spectroscopy, after
    correcting for viewing geometry and projecting the measured line-of-sight velocity
    onto the toroidal direction. The plasma boundary location is usually supplied
    by magnetic equilibrium reconstruction, and the measured or modeled velocity is
    mapped to the last-closed flux surface. When only an average over the boundary
    flux surface is intended, the flux-surface-averaged standard name should be used
    instead.


    Typical absolute values at the plasma boundary are of order $10^3-5 \times 10^4$
    m.s^-1 in tokamak edge plasmas. Values can be close to zero in weakly rotating
    conditions and can approach $10^5$ m.s^-1 in plasmas with strong external torque
    or steep edge rotation gradients.


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_magnetic_axis
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:toroidal_krypton_velocity_at_plasma_boundary
- name: toroidal_deuterium_tritium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal velocity of the fictitious DT single-species (atomic mass
    2.5 amu) at the H-mode pedestal, used in simulations treating the deuterium-tritium
    fuel as a single ion fluid.
  documentation: 'The fictitious DT species is a single-fluid representation of the
    deuterium-tritium fuel mixture, assigned an atomic mass of 2.5 amu (the arithmetic
    mean of deuterium mass 2 and tritium mass 3), and treated as a single ion population
    in transport and gyrokinetic simulations. The toroidal velocity of this species
    at the pedestal quantifies the bulk toroidal rotation of the fuel ions within
    the steep-gradient edge transport barrier characteristic of H-mode plasmas.


    The toroidal component is the projection of the DT ion fluid velocity onto the
    toroidal unit vector $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$
    frame:


    $$

    v_\phi = \mathbf{v}_\mathrm{DT} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{DT}$ is the DT ion fluid velocity vector.


    Toroidal rotation at the pedestal contributes to the $E \times B$ shear layer
    that suppresses turbulent transport and sustains the H-mode confinement barrier.
    Ion toroidal velocities are inferred from Doppler shifts in charge exchange recombination
    spectroscopy (CXRS) emission lines on trace impurity species and corrected to
    the DT fuel population via neoclassical offsets. This pedestal evaluation belongs
    to a spatial family that includes [toroidal_deuterium_tritium_velocity_at_magnetic_axis](name:toroidal_deuterium_tritium_velocity_at_magnetic_axis)
    and [toroidal_deuterium_tritium_velocity_at_internal_transport_barrier](name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier);
    the resolved deuterium counterpart at the same location is [toroidal_deuterium_velocity_at_pedestal](name:toroidal_deuterium_velocity_at_pedestal).


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_tritium_velocity_at_magnetic_axis
  - name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier
  - name:toroidal_deuterium_velocity_at_pedestal
- name: toroidal_deuterium_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the bulk flow velocity for the effective deuterium-tritium\
    \ single-species approximation with atomic mass 2.5 amu, evaluated at the last\
    \ closed flux surface. It is the projection along the \u03C6 direction in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, where \u03C6 increases counter-clockwise\
    \ when viewed from above +Z."
  documentation: 'The toroidal deuterium-tritium velocity at the plasma boundary is
    the component of the effective DT bulk flow tangent to the toroidal direction
    at the last closed flux surface. The effective species represents deuterium and
    tritium as a single ion population with atomic mass 2.5 amu. The right-handed
    cylindrical $(R, \phi, Z)$ frame uses $R$ as major radius measured from the toroidal
    symmetry axis, $\phi$ as toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ as vertical height.


    The toroidal component is defined by projecting the effective DT bulk velocity
    vector onto the toroidal basis direction at the plasma boundary:


    $$

    v_{\phi,\mathrm{DT}}^{\mathrm{bdry}} = \left. \mathbf{v}_{\mathrm{DT}}(R,\phi,Z)
    \cdot \hat{\phi} \right|_{\mathrm{LCFS}}

    $$


    where $v_{\phi,\mathrm{DT}}^{\mathrm{bdry}}$ and $\mathbf{v}_{\mathrm{DT}}$ are
    velocities in $\mathrm{m\,s^{-1}}$, $\hat{\phi}$ is the dimensionless toroidal
    unit vector, LCFS denotes the last closed flux surface, $R$ and $Z$ are coordinate
    values in meters, and $\phi$ is in radians.


    In transport modeling this quantity is obtained from the effective DT ion momentum
    balance or velocity field and evaluated, or interpolated, to the last closed flux
    surface. When related to measurements, edge ion flow information is commonly inferred
    from spectroscopic Doppler shifts together with a model that maps the observed
    ion flow to the effective DT species representation.


    Typical edge toroidal ion flow magnitudes near the last closed flux surface are
    about $10^3$-$10^5$ m.s^-1, with smaller values possible in weakly rotating plasmas
    and larger values during strong external momentum input or strong edge electric-field
    shear. The signed value may be positive or negative depending on the toroidal
    flow direction.


    Sign convention: Positive when the toroidal component of the effective deuterium-tritium
    bulk velocity points in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
