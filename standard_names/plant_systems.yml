- name: accumulated_ethylene_count
  kind: scalar
  status: active
  description: Cumulative ethylene (C2H4) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethylene molecule contributes 16 equivalent
    electrons (2 carbon atoms at Z = 6 each, 4 hydrogen atoms at Z = 1 each).
  documentation: 'Ethylene (C2H4) is a two-carbon hydrocarbon molecule in which each
    molecule contributes 2 carbon atoms (atomic number $Z_C = 6$) and 4 hydrogen atoms
    ($Z_H = 1$), yielding 16 equivalent electrons per molecule.


    The accumulated equivalent-electron count is defined by:


    $$

    N_{\mathrm{eq}}(t) = 16 \int_{t_{\mathrm{bd}}}^{t} \frac{dN_{\mathrm{C_2H_4}}}{dt''}
    \, dt''

    $$


    where $t_{\mathrm{bd}}$ is the time of plasma breakdown and $dN_{\mathrm{C_2H_4}}/dt$
    is the instantaneous ethylene injection rate in molecules per second.


    The integral runs from plasma breakdown onward, excluding any prefill contribution.
    The quantity is inferred from calibrated gas-valve flow measurements and tracks
    the hydrocarbon-based electron inventory added to the plasma, relevant to impurity
    seeding and disruption mitigation experiments. Closely related hydrocarbon counts
    include [accumulated_ethane_count](name:accumulated_ethane_count) (C2H6, 18 equivalent
    electrons per molecule) and [accumulated_propane_count](name:accumulated_propane_count)
    (C3H8, 26 equivalent electrons per molecule). For the species-summed inventory
    across all injected gasses, see [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:accumulated_propane_count
  - name:accumulated_total_particle_count_due_to_gas_injection
