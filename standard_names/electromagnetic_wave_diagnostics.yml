- name: polarization_ellipticity_of_polarimeter_beam
  kind: scalar
  status: active
  description: Signed ratio of the minor to major semiaxes of the polarization ellipse
    of a polarimeter beam after propagation through magnetized plasma. It describes
    the beam's post-propagation transverse polarization state, not the incident state
    or the ellipse orientation.
  documentation: 'Signed ratio of the minor to major semiaxes of the polarization
    ellipse of a polarimeter beam after propagation through magnetized plasma is the
    ellipticity of that beam. It characterizes the relative electric-field semiamplitudes
    of the post-propagation transverse polarization ellipse.


    The ellipticity is defined by


    $$

    \varepsilon = \frac{b}{a}

    $$


    where $\varepsilon$ is the polarization ellipticity, $a$ is the major-axis semiamplitude
    of the electric-field polarization ellipse, and $b$ is the signed minor-axis semiamplitude
    of that ellipse. The magnitude satisfies $|\varepsilon| \leq 1$.


    This quantity applies to the polarimeter beam after it has traversed the magnetized
    plasma and is therefore distinct from the [initial polarization ellipticity](name:initial_polarization_ellipticity_of_polarimeter_beam).
    It is a polarization-shape parameter and excludes the orientation of the ellipse;
    rotation of that orientation is represented by the [Faraday angle](name:faraday_angle).
    The quantity refers to a single beam polarization state, with no aggregation over
    distinct beam paths.


    Magnetized-plasma birefringence can transform the [initial polarization ellipticity](name:initial_polarization_ellipticity_of_polarimeter_beam)
    into this post-propagation ellipticity by changing the polarization ellipse during
    propagation; that change is distinct from Faraday rotation of the ellipse orientation.


    Sign convention: Positive when the electric-field vector rotates in a right-handed
    sense about the beam-propagation direction.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:faraday_angle
  - name:initial_polarization_ellipticity_of_polarimeter_beam
  sources:
  - dd_path: polarimeter/channel/ellipticity
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/polarimeter.html#polarimeter-channel-ellipticity
    dd_documentation:
      leaf: Ellipticity
      parent_path: polarimeter/channel
      parent: Set of channels (lines-of-sight)
      data_type: STRUCTURE
      unit: '1'
    enhanced_context:
      description: Ellipticity of the polarization state of the probing electromagnetic
        wave after propagation through magnetized plasma, measured per polarimeter
        channel. Changes arise from the birefringent nature of the magnetized plasma
        medium.
      kind: llm
- name: initial_polarization_ellipticity_of_polarimeter_beam
  kind: scalar
  status: active
  description: Signed ratio of the minor to major semiaxes of the electric-field polarization
    ellipse of a polarimeter probing beam in its incident state, before plasma entry.
    It gives only the ellipticity component of the initial polarization vector, not
    the ellipse orientation.
  documentation: 'Signed ratio of the minor to major semiaxes of the electric-field
    polarization ellipse of a polarimeter probing beam in its incident state, before
    plasma entry, is the initial polarization ellipticity of that beam. It is the
    ellipticity component of the beam''s initial polarization vector and specifies
    the shape and handedness of the incident polarization ellipse, not its orientation.


    For an incident electric-field polarization ellipse with major semiaxis amplitude
    $a_0$ and minor semiaxis amplitude $b_0$, the initial ellipticity $\epsilon_0$
    is defined by:


    $$

    \epsilon_0 = \sigma_0 \frac{b_0}{a_0}

    $$


    where $\epsilon_0$ is the initial polarization ellipticity, $a_0$ is the major
    semiaxis amplitude, $b_0$ is the minor semiaxis amplitude with $0 \le b_0 \le
    a_0$, and $\sigma_0$ is the handedness sign of the incident polarization state.


    This quantity applies to a single polarimeter probing beam along a specified line
    of sight in its pre-plasma state. It is not averaged or summed over multiple lines
    of sight, and it does not describe the full polarization vector, beam intensity,
    wavelength, path geometry, path-integrated ellipticity, or any post-plasma polarization
    state.


    It provides the reference value for Cotton-Mouton ellipticity changes induced
    during traversal of magnetized plasma. It is the incident-state counterpart of
    [polarization ellipticity of a polarimeter beam](name:polarization_ellipticity_of_polarimeter_beam),
    which denotes the polarization ellipticity after plasma traversal; it is distinct
    from the [Faraday angle](name:faraday_angle), which describes rotation of the
    polarization-ellipse orientation rather than the semiaxis ratio.


    Sign convention: Positive when, in the right-handed beam-local basis $(\hat{e}_1,
    \hat{e}_2, \hat{k})$ with $\hat{k}$ along beam propagation, $\hat{e}_1$ along
    the major semiaxis, and $\hat{e}_2 = \hat{k} \times \hat{e}_1$, the electric-field
    vector rotates from $+\hat{e}_1$ toward $+\hat{e}_2$ as time increases.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:polarization_ellipticity_of_polarimeter_beam
  - name:faraday_angle
  arguments:
