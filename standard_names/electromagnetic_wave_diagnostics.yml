        \ an interferometer channel's line-of-sight. This quantity encodes the phase\
        \ shift from which the line-integrated electron density is derived."
      kind: llm
- name: wave_phase_of_wave_beam
  kind: scalar
  status: active
  description: "Fringe-jump-corrected phase angle of a probing electromagnetic signal\
    \ at a selected wavelength, referenced to the channel\u2019s defined launch phase."
  documentation: "This quantity is the continuous phase angle of a probing electromagnetic\
    \ signal at one selected wavelength, with integer-cycle discontinuities caused\
    \ by fringe jumps removed. It represents the phase accumulated along the signal\u2019\
    s propagation chord relative to the channel\u2019s defined launch-phase reference.\n\
    \nThe corrected phase is related to the measured wrapped phase by\n\n$$\n\\phi_{\\\
    mathrm{corr}} = \\phi_{\\mathrm{meas}} + 2\\pi N_{\\mathrm{fj}}\n$$\n\nwhere $\\\
    phi_{\\mathrm{corr}}$ is the fringe-jump-corrected phase, $\\phi_{\\mathrm{meas}}$\
    \ is the measured wrapped phase, and $N_{\\mathrm{fj}}$ is the signed integer\
    \ number of full-cycle fringe-jump corrections. The factor $2\\pi$ represents\
    \ one complete phase revolution.\n\nThe quantity applies to a single probing wavelength\
    \ and represents the phase accumulated over the complete propagation chord, rather\
    \ than a local phase at one point. It is referenced to the channel\u2019s defined\
    \ launch phase; it is not an absolute electromagnetic phase and does not include\
    \ an uncorrected fringe discontinuity.\n\nThe corrected phase is the phase observable\
    \ used to obtain the [line-integrated electron number density](name:line_integrated_electron_number_density)\
    \ through the wavelength-dependent plasma refractive index. It is distinct from\
    \ the general [reference phase](name:reference_phase), which establishes a phase\
    \ origin without specifying fringe-jump correction or a propagation chord."
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_integrated_electron_number_density
  sources:
  - dd_path: interferometer/channel/wavelength/phase_corrected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-wavelength-phase_corrected
    dd_documentation:
