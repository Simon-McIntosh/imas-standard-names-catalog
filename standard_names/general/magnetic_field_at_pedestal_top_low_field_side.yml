name: magnetic_field_at_pedestal_top_low_field_side
status: draft
description: Total magnetic field magnitude $|\mathbf{B}|$ evaluated at the pedestal-top
  position on either the high-field or low-field side.
documentation: "The magnetic field at the pedestal top $B_{\\rm ped}$ is the magnitude\
  \ $|\\mathbf{B}| = \\sqrt{B_\\phi^2 + B_\\theta^2}$ evaluated at the radial location\
  \ corresponding to the top of the H-mode pedestal, where $B_\\phi$ is the toroidal\
  \ and $B_\\theta$ the poloidal magnetic-field component (both in T). Because the\
  \ tokamak field varies as $B_\\phi \\propto 1/R$, separate values are reported for\
  \ the low-field side (LFS) and high-field side (HFS) pedestal-top locations. Typical\
  \ values range from 1\u20136 T depending on device and radial position. The quantity\
  \ enters pedestal stability analyses through the normalized pressure gradient $\\\
  alpha$ and the ballooning parameter; it also sets the local ion gyroradius $\\rho_i\
  \ = m_i v_{\\rm th,i}/(Z_i e B_{\\rm ped})$, which influences pedestal width scaling\
  \ models. Obtained from equilibrium reconstruction constrained by magnetic diagnostics\
  \ and fitted $\\tanh$ pedestal profiles."
