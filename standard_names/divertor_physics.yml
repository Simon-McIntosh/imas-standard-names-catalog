- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: active
  description: Local number density of hydrogen ions evaluated in the plasma adjacent
    to the divertor target surface, summed over all positive hydrogen ionization charge
    states and excluding neutral hydrogen atoms and molecules.
  documentation: 'Hydrogen density at the divertor target is the local number density
    of hydrogen ions in the plasma immediately adjacent to a divertor target surface,
    evaluated at the entrance to the electrostatic sheath. It is the hydrogen-specific
    member of [density at the divertor target](name:density_at_divertor_target), with
    an isotope-specific scope analogous to [deuterium density at the divertor target](name:deuterium_density_at_divertor_target).


    The charge-state-summed density is defined by


    $$

    n_{\mathrm{H}} = \sum_{Z>0} n_{\mathrm{H}}^{(Z)}

    $$


    where $n_{\mathrm{H}}$ is the hydrogen-ion density and $n_{\mathrm{H}}^{(Z)}$
    is the density of hydrogen ions with positive ionization charge number $Z$. For
    hydrogen, the sum contains only the singly ionized state $\mathrm{H}^{+}$.


    Neutral hydrogen atoms and hydrogen molecules are excluded; consequently, this
    quantity is not the total density of hydrogen nuclei in all charge and molecular
    states.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  arguments:
