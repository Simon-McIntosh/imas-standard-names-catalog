- name: propane_prefill_count
  kind: scalar
  status: active
  description: Propane prefill count is the total amount of C3H8 introduced before
    plasma breakdown, expressed as an equivalent-electron count with 26 count units
    per neutral propane molecule.
  documentation: 'Propane prefill count is the total amount of neutral propane (C3H8)
    introduced during the prefill phase before plasma breakdown, expressed as an equivalent-electron
    count. Each propane molecule contributes 26 equivalent electrons: 18 from three
    carbon atoms and 8 from eight hydrogen atoms.


    The equivalent-electron count is obtained by accumulating the injected propane
    molecules over the prefill interval:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{C_3H_8,prefill}} = (3Z_C + 8Z_H)N_{\mathrm{C_3H_8,prefill}}
    = 26N_{\mathrm{C_3H_8,prefill}} = \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{C_3H_8}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{C_3H_8,prefill}}$ is the equivalent-electron
    count, $N_{\mathrm{C_3H_8,prefill}}$ is the accumulated propane molecule count,
    $Z_C=6$ and $Z_H=1$ are the atomic numbers of carbon and hydrogen, $\dot{N}_{\mathrm{C_3H_8}}$
    is the propane molecule injection rate, $t_0$ is the start of prefill, and $t_\mathrm{bd}$
    is the plasma-breakdown time.


    This quantity includes only propane introduced before breakdown and excludes later
    fueling, other gas species, and the retained or ionized inventory. It uses the
    common equivalent-electron bookkeeping of [prefill_count](name:prefill_count),
    with [ethane_prefill_count](name:ethane_prefill_count) providing the analogous
    molecular-species convention.'
  unit: '1'
  physics_domain: plant_systems
