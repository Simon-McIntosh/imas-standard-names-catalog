name: neutral_particle_radial_diffusivity_on_ggd
status: draft
description: Effective radial diffusion coefficient for neutral particle transport,
  discretized on a general grid description (GGD) mesh.
documentation: The neutral particle radial diffusivity $D_{\perp,n}$ (in $\mathrm{m^2\,s^{-1}}$)
  enters the diffusive neutral transport equation $\Gamma_n = -D_{\perp,n} \nabla
  n_n$, where $n_n$ is the neutral number density and $\Gamma_n$ the radial neutral
  flux. In kinetic neutral codes (EIRENE, DEGAS2) the effective diffusivity can be
  extracted from Monte Carlo results; in fluid neutral models it is set explicitly.
  One scalar value per GGD grid element allows representation of the strong spatial
  variation of neutral penetration across the separatrix, divertor legs, and private-flux
  region. Values span a wide range, from $\sim 10^{-2}\,\mathrm{m^2\,s^{-1}}$ in high-opacity
  divertor conditions to $\sim 10^{1}\,\mathrm{m^2\,s^{-1}}$ at low densities where
  neutrals are near free-streaming. See the ion counterpart `ion_particle_radial_diffusivity_on_ggd`
  for charged-species diffusion.
