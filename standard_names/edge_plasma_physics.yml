    status: composed
- name: helium_3_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of singly ionized helium-3 ions at the limiter surface,
    the primary ion-facing component defining the plasma boundary.
  documentation: 'The density $n_{\mathrm{^3He^+}}$ of helium-3 ions incident on the
    limiter is a key boundary condition for edge plasma and impurity transport modeling.
    In tokamaks, the limiter can be the primary plasma-facing component or a secondary
    structure protecting apertures; helium-3 may be present as a minority species
    from deliberate injection for minority ICRH heating or as a fusion product. Typical
    near-limiter helium-3 densities range from $10^{16}\;\mathrm{m^{-3}}$ in the scrape-off
    layer to $10^{18}\;\mathrm{m^{-3}}$ near the separatrix, depending on the fueling
    scheme and the effectiveness of the divertor or limiter pumping. This density
    is routinely measured by optical emission spectroscopy on the neutral helium line
    (e.g., He I 587.6 nm) with collisional-radiative modeling, or by residual gas
    analyzers sampling the neutral flux. The quantity is paired with [deuterium density
    at limiter](name:deuterium_density_at_limiter) for fuel-to-impurity ratio studies
    and with [helium-4 density at limiter](name:helium_4_density_at_limiter) for helium
    ash behavior.


    Sign convention: Positive when the number density of helium-3 ions at the limiter
    surface is greater than zero.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_limiter
  - name:helium_4_density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/helium_3/value
    dd_path: summary/local/limiter/n_i/helium_3/value
    status: composed
- name: helium_4_density_at_limiter
  kind: scalar
  status: draft
  description: Volume number density of singly ionized helium-4 (alpha) ions in the
    plasma flux incident on the limiter surface.
  documentation: 'The helium-4 density at the limiter quantifies the number of singly
    ionized helium-4 ($\alpha$) particles per unit volume arriving at the outermost
    plasma-facing component. This density is critical for modeling net erosion, impurity
    transport, and hydrogenic fueling at the limiter, as well as for estimating the
    helium-4 exhaust rate in the scrape-off layer. Typical densities range from $10^{15}$
    to $10^{18}$ m$^{-3}$ at the limiter for fusion-relevant plasmas, decreasing with
    increasing distance from the confined plasma. The quantity is commonly inferred
    from spectroscopic measurements of the He~II line emission coupled with collisional-radiative
    modeling, and is related to the *electron_density_at_separatrix* and the *ion_temperature_at_limiter*
    through ionization balance equations.


    Sign convention: Positive when the measured or reconstructed density takes a non-negative
    value.


    The sibling [helium_4_density_at_divertor_target](name:helium_4_density_at_divertor_target)
    and [helium_4_density_at_separatrix](name:helium_4_density_at_separatrix) provide
    context for the same species at other key plasma-facing surfaces.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_4_density_at_divertor_target
  - name:helium_4_density_at_separatrix
