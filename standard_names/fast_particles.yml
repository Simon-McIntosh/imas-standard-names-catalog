- name: toroidal_component_of_co_passing_particle_torque_density
  kind: scalar
  status: draft
  description: Net toroidal torque density acting on the co-passing particle population,
    summing all momentum-source mechanisms per unit volume.
  documentation: "The toroidal torque density on co-passing particles quantifies the\
    \ local rate of toroidal angular momentum deposition per unit volume into the\
    \ subset of the particle distribution executing co-passing (co-current) orbits.\
    \ It is the toroidal projection of the full [co_passing_particle_torque_density](name:co_passing_particle_torque_density)\
    \ vector, $\\tau_{\\phi,\\mathrm{co}} = \\mathbf{\\tau}_{\\mathrm{co}} \\cdot\
    \ \\hat{\\phi}$, where $\\hat{\\phi}$ is the unit vector in the direction of increasing\
    \ toroidal angle $\\phi$. This bare (mechanism-summed) form aggregates all contributing\
    \ processes \u2014 including radial-current Lorentz forces (see [toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current](name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current)),\
    \ collisional momentum exchange, and wave\u2013particle interactions \u2014 whereas\
    \ mechanism-specific variants isolate individual channels. The analogous quantities\
    \ for other orbit classes are [toroidal_component_of_counter_passing_particle_torque_density](name:toroidal_component_of_counter_passing_particle_torque_density)\
    \ and [toroidal_component_of_trapped_particle_torque_density](name:toroidal_component_of_trapped_particle_torque_density).\
    \ Typical magnitudes in neutral-beam-heated tokamaks range from $10^3$ to $10^5$\
    \ N m$^{-2}$ in the plasma core, depending on beam power and plasma density. This\
    \ quantity is computed from kinetic distribution-function codes that track the\
    \ co-passing particle population and integrate momentum-source terms over velocity\
    \ space.\n\nSign convention: Positive when the net torque acts in the direction\
    \ of increasing toroidal angle $\\phi$, accelerating co-passing particles in the\
    \ co-current direction."
  unit: N.m^-2
  physics_domain: fast_particles
  links:
  - name:co_passing_particle_torque_density
  - name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_counter_passing_particle_torque_density
  - name:toroidal_component_of_trapped_particle_torque_density
  constraints: []
  arguments:
  - name: co_passing_particle_torque_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/source/momentum_tor
    dd_path: distributions/distribution/profiles_1d/co_passing/source/momentum_tor
    status: composed
- name: toroidal_component_of_counter_passing_particle_torque_density
  kind: scalar
  status: draft
  description: Toroidal component of the net torque density exerted on the counter-passing
    particle population by all momentum-source mechanisms, per unit volume. Counter-passing
    particles circulate in the direction opposite to the plasma current toroidal direction.
    This quantity sums contributions from collisions, wave-particle interactions,
    and external beam or RF sources acting on this orbit class.
  documentation: 'The toroidal torque density on the counter-passing particle population
    is defined as the net rate of change of toroidal angular momentum density $\ell_{\phi,\mathrm{cp}}$
    due to all source and sink mechanisms:


    $$\tau_{\phi,\mathrm{cp}} = \sum_s \left.\frac{\partial \ell_{\phi,\mathrm{cp}}}{\partial
    t}\right|_{\mathrm{source},s}$$


    where the sum runs over all physical mechanisms $s$ (collisional friction, wave-particle
    resonance, neutral-beam momentum injection, etc.) and $\ell_{\phi,\mathrm{cp}}
    = m n_{\mathrm{cp}} R v_\phi$ is the toroidal angular momentum density of the
    counter-passing sub-population, with $R$ the major radius in the cylindrical $(R,
    \phi, Z)$ frame.


    Counter-passing particles are those whose toroidal drift velocity $v_\phi$ is
    directed opposite to the direction of increasing toroidal angle $\phi$, i.e.,
    opposite to the positive $\hat{\phi}$ direction.


    Units are $\mathrm{N\,m^{-2}}$ (torque per unit volume, equivalent to angular
    momentum density per unit time).


    Sign convention: Positive when the net source transfers angular momentum in the
    direction of increasing toroidal angle $\phi$.


    Typical magnitudes in NBI-heated tokamak discharges range from $10^{-3}$ to $10^{1}\,\mathrm{N\,m^{-2}}$,
    depending on heating power, plasma density, and beam injection geometry. This
    quantity is the counter-passing analog of `toroidal_component_of_co_passing_particle_torque_density`
    and, together with the trapped-particle torque density, partitions the total toroidal
    torque density across kinetic orbit classes.'
  unit: N.m^-2
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_co_passing_particle_torque_density
  - name:toroidal_component_of_trapped_particle_torque_density
  constraints: []
  arguments:
  - name: counter_passing_particle_torque_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/source/momentum_tor
    dd_path: distributions/distribution/profiles_1d/counter_passing/source/momentum_tor
    status: composed
- name: toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons
  kind: scalar
  status: draft
  description: Toroidal projection of the volume-integrated torque received by the
    fast particle population via Coulomb collisions with background thermal electrons.
  documentation: The toroidal component of the collisional torque quantifies the net
    rate of toroidal angular momentum transferred to the fast particle distribution
    through binary Coulomb collisions with the background thermal electron population,
    integrated over the plasma volume. Because electrons carry far less momentum per
    collision than ions, this electron-channel torque is typically smaller than the
    ion-channel counterpart [toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion](name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion),
    but becomes significant for high-energy fast particles in the MeV range where
    the slowing-down time on electrons is comparable to that on ions. The governing
    relation is $\tau_{\phi,e} = \int \mathbf{r} \times \delta\dot{\mathbf{p}}_{e}
    \, dV$, where $\delta\dot{\mathbf{p}}_{e}$ (kg m s$^{-2}$) is the collisional
    momentum-source density on fast particles due to electrons and $V$ is the plasma
    volume. This quantity is the volume integral of the corresponding density form
    [toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons](name:toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons).
    It is computed from kinetic or Fokker-Planck distribution-function solvers and
    feeds directly into global toroidal momentum balance alongside the [toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions](name:toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions),
    which captures the equal-and-opposite transfer to the electron population. Typical
    values in neutral-beam-heated tokamaks range from $10^{1}$ to $10^{3}$ N m depending
    on injected power and plasma density.
  unit: N.m
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
  - name:toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons
  - name:toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions
  constraints: []
  arguments:
  - name: fast_particle_torque_due_to_coulomb_collisions_with_electrons
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/electrons/torque_fast_tor
    dd_path: distributions/distribution/global_quantities/collisions/electrons/torque_fast_tor
    status: composed
- name: toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
  kind: scalar
  status: draft
  description: Toroidal component of the total (volume-integrated) torque transferred
    to the fast particle population through Coulomb collisions with background ion
    species. This scalar quantity is the projection of the collisional torque onto
    the toroidal direction, integrated over the plasma volume. Positive values indicate
    a net toroidal acceleration of the fast particles in the direction of increasing
    toroidal angle.
  documentation: "## Toroidal Component of Fast-Particle Torque due to Coulomb Collisions\
    \ with Ions\n\nThis quantity is the toroidal scalar component of the volume-integrated\
    \ torque that background ion species exert on the fast (non-thermal) particle\
    \ population through binary Coulomb collisions. It is obtained by integrating\
    \ the local toroidal collisional torque density over the full plasma volume:\n\
    \n$$T_{\\phi,\\mathrm{fast\\leftarrow ions}} = \\int_{V} R \\, \\left(\\delta\\\
    dot{p}_{\\phi}\\right)_{\\mathrm{fast\\leftarrow ions}} \\, dV$$\n\nwhere $R$\
    \ is the major radius (cylindrical $(R, \\phi, Z)$ frame with $R$ measured from\
    \ the machine symmetry axis), $\\delta\\dot{p}_{\\phi}$ is the toroidal component\
    \ of the collisional momentum-transfer rate density from all background ion species\
    \ to the fast particle population, and $dV$ is the volume element. The integrand\
    \ $R\\,\\delta\\dot{p}_{\\phi}$ is the toroidal torque density (i.e., the $\\\
    hat{\\phi}$-projection of $R \\times \\delta\\dot{\\mathbf{p}}$), ensuring that\
    \ only the scalar toroidal projection enters the integral.\n\n**Physical interpretation:**\
    \ Coulomb drag and pitch-angle scattering off background ions transfer angular\
    \ momentum between the fast and thermal populations. Fast ions born with super-Alfvenic\
    \ energies (e.g., from neutral beam injection or ion cyclotron resonance heating)\
    \ slow down predominantly on background electrons at high energy and on background\
    \ ions at lower energy. The ion-channel torque therefore captures the angular-momentum\
    \ exchange as the fast ions thermalize. Its magnitude can be comparable to or\
    \ exceed the electron-channel contribution at low fast-ion energies.\n\n**Typical\
    \ values:** For conventional tokamak plasmas with neutral beam injection, the\
    \ magnitude is typically in the range $10^{0}$ to $10^{2}$ N$\\cdot$m, depending\
    \ on beam power (1\u201340 MW range), injection geometry (co- vs. counter-current),\
    \ and plasma density. In spherical tokamaks or low-field devices, values may extend\
    \ above $10^{2}$ N$\\cdot$m.\n\n**Relation to the density counterpart:** Dividing\
    \ by the plasma volume gives the toroidal torque density (W/m$^3$ equivalent in\
    \ angular-momentum flux), which is the quantity most directly used in transport\
    \ codes. Summing the electron-channel and ion-channel contributions yields the\
    \ total collisional torque on the fast particle population.\n\nSign convention:\
    \ Positive when the net collisional torque accelerates the fast particle population\
    \ in the direction of increasing toroidal angle $\\phi$ (counter-clockwise when\
    \ viewed from above along $+\\hat{Z}$)."
  unit: N.m
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons
  - name:toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions
  - name:toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons
  constraints: []
  arguments:
  - name: fast_particle_torque_due_to_coulomb_collisions_with_ion
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/ion/state/torque_fast_tor
    dd_path: distributions/distribution/global_quantities/collisions/ion/state/torque_fast_tor
    status: composed
  - id: dd:distributions/distribution/global_quantities/collisions/ion/torque_fast_tor
    dd_path: distributions/distribution/global_quantities/collisions/ion/torque_fast_tor
    status: composed
- name: toroidal_component_of_neutral_beam_particle_torque_due_to_shinethrough
  kind: scalar
  status: draft
  description: Toroidal component of the volume-integrated torque lost because neutral
    beam particles traverse the plasma without being ionized (shine-through). Beam
    ions that are not ionized deposit no momentum in the plasma; the torque deficit
    is integrated over the plasma volume and expressed in the toroidal direction of
    the cylindrical $(R, \phi, Z)$ frame.
  documentation: 'When neutral beam injection (NBI) particles fail to ionize before
    exiting the plasma, they carry away toroidal angular momentum that would otherwise
    have been deposited in the plasma.


    The lost toroidal torque is computed from the local angular-momentum-loss density
    $\mathcal{T}_{\phi,\rm shine}(\mathbf{r})$ [N\,m$^{-3}$], defined as the toroidal
    projection of the angular momentum per unit volume per unit time that unabsorbed
    beam particles remove from the plasma volume:

    $$\mathcal{T}_{\phi,\rm shine}(\mathbf{r}) = R\, s_{\phi,\rm shine}(\mathbf{r}),$$

    where $R$ is the local major radius and $s_{\phi,\rm shine}(\mathbf{r})$ [N\,m$^{-4}$]
    is the lost toroidal momentum-source density due to shine-through (positive values
    correspond to momentum removed from the plasma). The volume-integrated quantity
    is then

    $$\tau_\phi^{\rm shine} = \int_V \mathcal{T}_{\phi,\rm shine}(\mathbf{r})\, dV
    = \int_V R\, s_{\phi,\rm shine}(\mathbf{r})\, dV,$$

    where the integral extends over the entire plasma volume $V$. This quantity has
    units of N\,m (equivalently J or m\,N).


    Physically, shine-through occurs when the plasma is insufficiently dense or the
    beam energy is too high for complete absorption along the beam path. The deposited
    NBI torque is reduced by exactly this shine-through loss. At typical operating
    densities in medium-to-large tokamaks, the shine-through fraction is small ($\lesssim
    5\%$), but at low densities during plasma startup or in compact high-energy-beam
    devices it can exceed $10\text{--}20\%$ of the total injected angular momentum.
    In the toroidal momentum budget, the total plasma torque equals the injected NBI
    torque minus shine-through losses, orbit losses, and charge-exchange losses.


    The closely related quantity [toroidal_component_of_neutral_beam_shinethrough_torque](name:toroidal_component_of_neutral_beam_shinethrough_torque)
    represents the same physical loss using a canonical compound base, while [toroidal_component_of_torque_due_to_neutral_beam_shinethrough](name:toroidal_component_of_torque_due_to_neutral_beam_shinethrough)
    captures the same concept via the process-attribution naming pattern. For broader
    context on the toroidal momentum budget, see [toroidal_component_of_plasma_torque](name:toroidal_component_of_plasma_torque)
    and [toroidal_component_of_plasma_torque_inside_flux_surface](name:toroidal_component_of_plasma_torque_inside_flux_surface).


    Sign convention: Positive when the shine-through torque loss acts in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the major radius and $Z$ is the vertical height.'
  unit: N.m
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_neutral_beam_shinethrough_torque
  - name:toroidal_component_of_torque_due_to_neutral_beam_shinethrough
  - name:toroidal_torque_inside_flux_surface
  constraints: []
  sources:
  - id: dd:distribution_sources/source/global_quantities/shinethrough/torque_tor
    dd_path: distribution_sources/source/global_quantities/shinethrough/torque_tor
    status: composed
- name: toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volume-integrated toroidal torque transferred to the bulk thermal electron
    population via Coulomb collisions with the fast particle distribution, representing
    the net rate of toroidal angular momentum exchange integrated over the plasma
    volume.
  documentation: "This quantity gives the total toroidal component of the collisional\
    \ torque exerted on thermal electrons by Coulomb scattering with suprathermal\
    \ (fast) particles, integrated over the plasma volume. The governing relation\
    \ is $\\tau_{\\phi,\\mathrm{th,e}} = \\int R\\, F_{\\phi,\\mathrm{th,e}}^{\\mathrm{coll}}\\\
    , dV$, where $R$ is the major radius in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, $F_{\\phi,\\mathrm{th,e}}^{\\mathrm{coll}}$ is the toroidal Coulomb-collision\
    \ force density on thermal electrons, and the integral is taken over the full\
    \ plasma volume $V$. Momentum conservation requires that the torque transferred\
    \ to thermal electrons equals and opposes the corresponding loss from the fast\
    \ particle population, linking this quantity to [toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons](name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons).\
    \ Because electrons are light, this channel is typically smaller in magnitude\
    \ than the ion analog [toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions](name:toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions),\
    \ but can become significant when the fast particle distribution is strongly anisotropic.\
    \ The local torque density counterpart is [toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions](name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions);\
    \ integrating that density over volume recovers this quantity. Values are computed\
    \ from Fokker\u2013Planck or Monte Carlo fast particle codes that track the collisional\
    \ momentum deposition on the thermal background.\n\nSign convention: Positive\
    \ when the net toroidal angular momentum transferred to thermal electrons is in\
    \ the direction of increasing toroidal angle $\\phi$."
  unit: N.m
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons
  - name:toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions
  - name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions
  constraints: []
