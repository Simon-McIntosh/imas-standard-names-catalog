- name: toroidal_total_plasma_current_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal current density of the total plasma
    immediately after a sawtooth crash.
  documentation: "The toroidal current density $j_{\\phi}^{\\text{total}}$ represents\
    \ the flux-surface average of the total toroidal current density, defined as $j_{\\\
    phi}^{\\text{total}} = \\langle J_{\\phi} / R \\rangle / \\langle 1 / R \\rangle$,\
    \ where $J_{\\phi}$ is the local toroidal current density and $R$ is the major\
    \ radius. This quantity is evaluated immediately after a sawtooth crash, capturing\
    \ the redistribution of current in the core following the internal reconnection\
    \ event. Typical post-crash values in the core of a tokamak are in the range 0.1\u2013\
    1.0 MA\xB7m$^{-2}$, depending on plasma current and density profiles, and the\
    \ profile is commonly inferred from equilibrium reconstruction using magnetic\
    \ measurements combined with motional Stark effect (MSE) or polarimetry constraints.\
    \ The total current density is the sum of ohmic, bootstrap, and non-inductive\
    \ contributions, and it is distinguished from individual component contributions\
    \ such as [ohmic_current_density_at_post_sawtooth_crash](name:ohmic_current_density_at_post_sawtooth_crash)\
    \ and [bootstrap_current_density_at_post_sawtooth_crash](name:bootstrap_current_density_at_post_sawtooth_crash).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above)."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:ohmic_current_density_at_post_sawtooth_crash
  - name:bootstrap_current_density_at_post_sawtooth_crash
  sources:
