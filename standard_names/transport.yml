- name: parallel_component_of_trapped_fast_particle_pressure
  kind: scalar
  status: draft
  description: Local parallel component of the anisotropic pressure tensor for the
    bounce-trapped fast (suprathermal) particle population, defined as the second
    velocity moment of the trapped distribution function along the magnetic field
    direction. This local quantity is reported as a radial profile and is distinct
    from both the isotropic trapped fast-particle pressure and the perpendicular pressure
    component.
  documentation: "For fast particles with anisotropic velocity distributions, the\
    \ pressure tensor has distinct parallel and perpendicular components. The parallel\
    \ pressure $p_{\\parallel,\\mathrm{trap,fast}}$ is the second moment of the distribution\
    \ function along the local magnetic field unit vector $\\hat{b}$:\n$$p_{\\parallel,\\\
    mathrm{trap,fast}} = m \\int (v_{\\parallel} - u_{\\parallel})^2\\, f_{\\mathrm{trap,fast}}\\\
    , d^3v$$\nwhere $m$ is the particle mass, $v_{\\parallel}$ is the velocity component\
    \ along $\\hat{b}$, $u_{\\parallel}$ is the mean parallel flow velocity, and $f_{\\\
    mathrm{trap,fast}}$ is the distribution function restricted to the trapped particle\
    \ population (particles with sufficiently large pitch angle to be magnetically\
    \ mirrored on banana orbits).\n\nThis quantity is a **local** value at each spatial\
    \ point, not a flux-surface average. It characterizes the kinetic stress carried\
    \ by trapped fast particles in the field-aligned direction and, together with\
    \ the perpendicular component $p_{\\perp,\\mathrm{trap,fast}}$, fully describes\
    \ the anisotropic pressure contribution of the trapped fast particle population.\n\
    \nThe isotropic (scalar) trapped fast-particle pressure [trapped_fast_particle_pressure](name:trapped_fast_particle_pressure)\
    \ is related by $(p_{\\parallel} + 2\\,p_{\\perp})/3$. The pressure anisotropy\
    \ $p_{\\parallel} - p_{\\perp}$ enters MHD equilibrium and stability analyzes\
    \ through the anisotropic pressure tensor. Trapped fast particles \u2014 produced\
    \ by neutral beam injection, ion cyclotron resonance heating, or other auxiliary\
    \ heating schemes \u2014 are confined to banana orbits and typically exhibit strong\
    \ pitch-angle anisotropy, so $p_{\\parallel}$ can differ substantially from $p_{\\\
    perp}$.\n\nTypical values in reactor-relevant plasmas range from $10^2$ to $10^5$\
    \ Pa for high-power heating scenarios, depending on beam power, plasma density,\
    \ and confinement quality. This quantity is computed from distribution-function\
    \ solvers, Monte Carlo codes, or drift-kinetic solvers. Compare with [perpendicular_component_of_trapped_fast_particle_pressure](name:perpendicular_component_of_trapped_fast_particle_pressure)\
    \ for the orthogonal component, [trapped_fast_particle_pressure](name:trapped_fast_particle_pressure)\
    \ for the isotropic scalar pressure of the same population, [parallel_component_of_co_passing_fast_particle_pressure](name:parallel_component_of_co_passing_fast_particle_pressure)\
    \ and [parallel_component_of_counter_passing_fast_particle_pressure](name:parallel_component_of_counter_passing_fast_particle_pressure)\
    \ for the passing-particle counterparts, and [fast_particle_pressure](name:fast_particle_pressure)\
    \ for the total fast-particle isotropic pressure."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:trapped_fast_particle_pressure
  - name:fast_particle_pressure
