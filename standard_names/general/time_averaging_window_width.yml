name: time_averaging_window_width
status: draft
cocos_transformation_type: one_like
description: Full width of the time interval over which time-dependent quantities
  are averaged for summary reporting.
documentation: "The time averaging window width $\\Delta t_{\\rm avg}$ specifies the\
  \ duration of a centered (or offset) time window used to compute time-averaged values\
  \ of plasma parameters (e.g., stored energy, density, temperature) for summary or\
  \ scalar reporting. By convention the averaging interval starts at $t - \\Delta\
  \ t_{\\rm avg}$ and ends at $t$, where $t$ is the reference time stamp. Choosing\
  \ $\\Delta t_{\\rm avg}$ balances noise suppression against temporal resolution;\
  \ typical values range from 1\u201350 ms for fast transient studies to 0.1\u2013\
  1 s for quasi-stationary flat-top characterization. This metadata scalar accompanies\
  \ any time-averaged quantity to ensure reproducibility of the averaging procedure."
