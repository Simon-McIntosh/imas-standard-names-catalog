- name: poloidal_component_of_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the electron fluid velocity onto the poloidal direction,
    defined as the dot product of the electron fluid velocity vector with the poloidal
    unit vector on a given flux surface. Together with the toroidal component, it
    fully describes the non-radial electron fluid flow decomposition.
  documentation: 'The poloidal component of the electron fluid velocity is defined
    as $v_{e,\mathrm{pol}} = \mathbf{v}_e \cdot \hat{e}_\theta$, where $\hat{e}_\theta$
    is the unit vector in the poloidal direction tangent to the flux surface in the
    meridional plane, and $\mathbf{v}_e$ is the electron fluid velocity. Together
    with the toroidal component $v_{e,\mathrm{tor}}$, this quantity fully specifies
    the in-surface electron fluid flow as decomposed in the electron fluid velocity
    vector [electron_velocity](name:electron_velocity).


    In neoclassical transport theory, the poloidal electron flow is driven by radial
    gradients in electron pressure and temperature. The quantity enters the radial
    force balance relation linking $E_r$, the magnetic field components $B_\mathrm{pol}$
    and $B_\mathrm{tor}$, the electron pressure $p_e$, and the electron number density
    $n_e$. Neoclassical predictions for $v_{e,\mathrm{pol}}$ depend sensitively on
    the collisionality regime; typical magnitudes in the core of tokamak plasmas range
    from $10^2$ to $10^4$ m s$^{-1}$.


    Experimental determination of $v_{e,\mathrm{pol}}$ is generally indirect. It is
    often inferred from spectroscopic measurements of impurity poloidal rotation combined
    with neoclassical inter-species relations, or from charge-exchange recombination
    spectroscopy of trace impurity ions. The quantity is distinct from its ion counterpart
    [poloidal_component_of_ion_velocity](name:poloidal_component_of_ion_velocity)
    because the large electron-to-ion mass ratio leads to qualitatively different
    poloidal momentum balance dynamics.


    Sign convention: Positive when the electron fluid flows in the direction of increasing
    poloidal angle $\theta$, consistent with the right-handed cylindrical $(R, \phi,
    Z)$ frame where $R$ is the major radius, $\phi$ is the toroidal angle, and $Z$
    is the vertical height.'
  unit: m.s^-1
  physics_domain: core_plasma_physics
  links:
  - name:poloidal_component_of_ion_velocity
  - name:toroidal_component_of_electron_velocity
  - name:electron_velocity
  constraints: []
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity_pol
    dd_path: core_profiles/profiles_1d/electrons/velocity_pol
    status: composed
- name: poloidal_component_of_ion_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk ion fluid velocity onto the poloidal direction,
    governing neoclassical flows, radial electric field balance, and parallel viscosity
    in magnetized plasmas.
  documentation: 'The poloidal component $v_{i,\mathrm{pol}} = \mathbf{v}_i \cdot
    \hat{e}_{\mathrm{pol}}$ is the scalar projection of the bulk [ion_velocity](name:ion_velocity)
    onto the poloidal unit vector $\hat{e}_{\mathrm{pol}}$ in the poloidal cross-section.
    In neoclassical theory, $v_{i,\mathrm{pol}}$ is set by the balance between the
    poloidal viscosity force and the poloidal component of the $\mathbf{j} \times
    \mathbf{B}$ force; it is directly related to the radial electric field $E_r$ through
    the radial force balance $E_r = v_{i,\phi} B_{\mathrm{pol}} - v_{i,\mathrm{pol}}
    B_{\phi} + (\nabla p_i)/(Z_i e n_i)$, where $B_{\mathrm{pol}}$ and $B_{\phi}$
    are the poloidal and toroidal magnetic-field magnitudes, $p_i$ is the ion pressure,
    $Z_i$ is the ion charge number, $e$ is the elementary charge, and $n_i$ is the
    ion number density. When multiple charge states are present, this quantity represents
    the average over all charge states. Typical magnitudes in the core of tokamak
    plasmas range from $10^3$ to $10^4$ m s$^{-1}$, substantially smaller than the
    toroidal rotation captured by [toroidal_component_of_ion_velocity](name:toroidal_component_of_ion_velocity).
    The primary measurement technique is charge-exchange recombination spectroscopy
    (CXRS), which resolves Doppler shifts and broadening of impurity emission lines
    as a proxy for the bulk ion flow; the result is compared with the electron poloidal
    flow [poloidal_component_of_electron_velocity](name:poloidal_component_of_electron_velocity)
    to constrain ambipolarity conditions.


    Sign convention: Positive when the ion flow is directed in the direction of increasing
    poloidal angle, consistent with the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: core_plasma_physics
  links:
  - name:ion_velocity
  - name:toroidal_component_of_ion_velocity
  - name:poloidal_component_of_electron_velocity
  constraints: []
  arguments:
  - name: ion_velocity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/velocity_pol
    dd_path: core_profiles/profiles_1d/ion/velocity_pol
    status: composed
- name: toroidal_component_of_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the electron fluid velocity onto the toroidal direction
    $\hat{\phi}$, giving the net azimuthal flow speed of the electron population along
    the magnetic field's dominant direction.
  documentation: "The toroidal electron velocity $v_{e,\\phi} = \\mathbf{v}_e \\cdot\
    \ \\hat{\\phi}$ is the $\\hat{\\phi}$-component of the electron fluid velocity\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $\\hat{\\phi}$\
    \ is the unit vector in the direction of increasing toroidal angle $\\phi$. Together\
    \ with [poloidal_component_of_electron_velocity](name:poloidal_component_of_electron_velocity),\
    \ it completes the two-component poloidal\u2013toroidal decomposition described\
    \ in [electron_velocity](name:electron_velocity): $\\mathbf{v}_e = v_{e,\\mathrm{pol}}\\\
    ,\\hat{e}_\\theta + v_{e,\\phi}\\,\\hat{\\phi}$. The toroidal electron velocity\
    \ is linked to the radial electric field through the neoclassical force balance\
    \ and drives a net toroidal current contribution $j_{\\phi,e} = -e n_e v_{e,\\\
    phi}$, where $e$ is the elementary charge and $n_e$ is the electron number density.\
    \ In typical tokamak discharges, $v_{e,\\phi}$ ranges from $10^3$ to $10^5$ m\
    \ s$^{-1}$ in the core, influenced by the bootstrap current drive, neutral beam\
    \ injection, and electron cyclotron heating. The electron toroidal velocity is\
    \ the electron-species counterpart of [toroidal_component_of_ion_velocity](name:toroidal_component_of_ion_velocity);\
    \ differences between the two reflect the net toroidal current density. It is\
    \ inferred from equilibrium reconstruction combined with spectroscopic measurements\
    \ or from gyrokinetic and fluid simulations.\n\nSign convention: Positive when\
    \ $v_{e,\\phi}$ points in the direction of increasing toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: core_plasma_physics
  links:
  - name:poloidal_component_of_electron_velocity
  - name:electron_velocity
  - name:toroidal_component_of_ion_velocity
  constraints: []
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity_tor
    dd_path: core_profiles/profiles_1d/electrons/velocity_tor
    status: composed
- name: toroidal_component_of_ion_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk ion fluid velocity onto the toroidal direction
    $\hat{\phi}$, giving the net azimuthal flow speed of the ion population in the
    direction of increasing toroidal angle.
  documentation: 'The toroidal component of the ion velocity, $v_{i,\phi} = \mathbf{v}_i
    \cdot \hat{\phi}$, quantifies the azimuthal flow of the ion species in the right-handed
    cylindrical $(R, \phi, Z)$ frame. Together with the [poloidal component](name:poloidal_component_of_ion_velocity),
    it fully specifies the non-radial ion fluid flow as decomposed from the parent
    vector [ion_velocity](name:ion_velocity). Toroidal rotation is driven by external
    momentum injection (neutral beams), intrinsic torques, and radial electric field
    balance through the force balance $v_{i,\phi} \approx (E_r - \partial_r p_i /
    (Z_i e n_i)) / B_\theta$, where $E_r$ is the radial electric field, $p_i$ is the
    ion pressure, $Z_i$ the ion charge state, $e$ the elementary charge, $n_i$ the
    ion density, and $B_\theta$ the poloidal magnetic field. In tokamak plasmas, toroidal
    ion rotation speeds range from a few km/s in ohmic discharges up to $\sim$200
    km/s in beam-heated H-mode plasmas. It is measured by charge exchange recombination
    spectroscopy and compared with [toroidal_component_of_center_of_mass_velocity](name:toroidal_component_of_center_of_mass_velocity)
    for multi-species plasmas.


    Sign convention: Positive when $v_{i,\phi}$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: core_plasma_physics
  links:
  - name:poloidal_component_of_ion_velocity
  - name:ion_velocity
  - name:toroidal_component_of_center_of_mass_velocity
  constraints: []
  arguments:
  - name: ion_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
