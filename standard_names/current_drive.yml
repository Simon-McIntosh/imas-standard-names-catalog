- name: per_toroidal_mode_of_parallel_component_of_wave_driven_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel component of wave-driven current density
    decomposed per toroidal Fourier mode number, capturing the spectral contribution
    of each mode to the total wave-driven parallel current.
  documentation: 'The parallel component of wave-driven current density arises when
    electromagnetic waves resonantly transfer momentum to plasma particles along the
    magnetic field direction $\hat{b}$, driving net current via mechanisms such as
    electron Landau damping or transit-time magnetic pumping. Decomposing this quantity
    per toroidal mode number $n_\phi$ reveals the spectral efficiency of current drive:
    each toroidal harmonic contributes independently to the flux-surface-averaged
    parallel current density $\langle j_\parallel \rangle_{n_\phi}$, and summing over
    all modes recovers the total [parallel_component_of_wave_driven_current_density](name:parallel_component_of_wave_driven_current_density).
    The toroidal mode decomposition connects directly to the launched wave spectrum
    characterized by quantities such as the toroidal refractive index distribution;
    modes with high $|n_\phi|$ couple to higher parallel phase velocities and different
    resonant particle populations. The flux-surface average suppresses rapid poloidal
    variation, yielding the net current relevant for equilibrium and transport modeling.
    Typical magnitudes in radio-frequency current-drive scenarios range from $10^4$
    to $10^6$ A m$^{-2}$ per dominant mode in the plasma core. The enclosed current
    analog per mode is given by [wave_driven_current_inside_flux_surface_per_toroidal_mode](name:wave_driven_current_inside_flux_surface_per_toroidal_mode),
    which integrates this density over the flux surface volume.


    Sign convention: Positive when the wave-driven parallel current flows in the direction
    of the equilibrium magnetic field $\hat{b}$, i.e., in the direction of increasing
    toroidal angle $\phi$ for positive toroidal field.'
  unit: A.m^-2
  physics_domain: current_drive
  links:
  - name:parallel_component_of_wave_driven_current_density
  - name:wave_driven_current_inside_flux_surface_per_toroidal_mode
  constraints: []
  arguments:
  - name: parallel_component_of_wave_driven_current_density
    operator: per_toroidal_mode
    operator_kind: unary_prefix
  sources:
