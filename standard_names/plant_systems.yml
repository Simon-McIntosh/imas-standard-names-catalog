- name: propane_source_rate
  kind: scalar
  status: active
  description: Instantaneous propane (C3H8) injection rate into the plasma vessel,
    converted from molecules to equivalent electrons using 26 electrons per neutral
    molecule.
  documentation: 'This quantity is the instantaneous source rate of propane gas entering
    the plasma vessel, expressed using the equivalent-electron convention. Each neutral
    C3H8 molecule contributes the total electron count of its constituent atoms.


    The equivalent-electron source rate is defined by


    $$

    S_{\mathrm{C_3H_8}}(t)=26\,\dot{N}_{\mathrm{C_3H_8}}(t)

    $$


    where $S_{\mathrm{C_3H_8}}(t)$ is the equivalent-electron source rate, $\dot{N}_{\mathrm{C_3H_8}}(t)$
    is the propane molecular injection rate in molecules per second, $t$ is time,
    and 26 is the dimensionless electron count per neutral molecule: three carbon
    atoms contribute 18 electrons and eight hydrogen atoms contribute 8 electrons.
    This is an instantaneous rate, distinct from the accumulated [propane count](name:propane_count),
    which is the time-integrated equivalent-electron inventory.'
