- name: poloidal_ion_momentum_diffusivity
  kind: scalar
  status: active
  description: Diffusion coefficient relating the diffusive poloidal ion momentum
    flux to the local poloidal ion momentum density gradient, expressing the rate
    at which diffusive processes redistribute poloidal momentum within the total ion
    population summed over charge states.
  documentation: 'The poloidal ion momentum diffusivity $D_{\rm pol}^i$ is the effective
    diffusion coefficient characterizing down-gradient redistribution of the poloidal
    component of momentum within the total ion population summed over all charge states.
    It specializes [ion_momentum_diffusivity](name:ion_momentum_diffusivity) to poloidal
    transport and complements [poloidal_ion_charge_state_momentum_diffusivity](name:poloidal_ion_charge_state_momentum_diffusivity),
    which resolves the same transport by ion charge state.


    The diffusive poloidal ion momentum flux density satisfies:


    $$

    \Gamma_{\mathrm{mom},i}^{\mathrm{pol}} = -D_{\mathrm{pol}}^i\frac{\partial \Pi_i^{\mathrm{pol}}}{\partial
    \ell_{\mathrm{pol}}}

    $$


    where $\Gamma_{\mathrm{mom},i}^{\mathrm{pol}}$ is the diffusive flux density of
    poloidal ion momentum, $\Pi_i^{\mathrm{pol}}$ is the local poloidal ion momentum
    density, and $\ell_{\mathrm{pol}}$ is poloidal arc length.


    This coefficient describes only the diffusive, down-gradient contribution for
    the charge-state-summed ion population; convective, source, and charge-state-resolved
    contributions are excluded. It is distinct from the cross-flux-surface coefficient
    [radial_momentum_diffusivity](name:radial_momentum_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_diffusivity
  - name:poloidal_ion_charge_state_momentum_diffusivity
  - name:radial_momentum_diffusivity
