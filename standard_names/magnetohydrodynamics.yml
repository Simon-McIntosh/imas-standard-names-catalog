- name: radial_mode_number
  kind: scalar
  status: active
  description: Dimensionless non-negative integer labeling the radial branch of a
    linear MHD eigenmode by its number of radial nodes between the magnetic axis and
    plasma boundary.
  documentation: 'Radial mode number is a dimensionless integer branch index that
    specifies the radial branch of a linear MHD perturbation. It identifies radial
    structure rather than periodicity in either angular direction.


    The radial branch index is defined by


    $$

    n_r = N_{\mathrm{nodes}}[\xi(\rho)]

    $$


    where $n_r$ is the radial mode number, $\xi(\rho)$ is the radial eigenfunction,
    $N_{\mathrm{nodes}}$ counts its interior zeros, and $\rho$ is the radial coordinate
    within the flux-coordinate set $(\rho,\theta,\phi)$; the count is taken between
    the magnetic axis and the plasma boundary.


    The radial mode number is one component of the [mode number](name:mode_number),
    distinct from the angular harmonics represented by the [poloidal mode number](name:poloidal_mode_number)
    and [toroidal MHD mode number](name:toroidal_mhd_mode_number).'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:poloidal_mode_number
  - name:toroidal_mhd_mode_number
