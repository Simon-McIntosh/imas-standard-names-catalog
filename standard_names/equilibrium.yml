- name: upper_triangularity
  kind: scalar
  status: draft
  description: Dimensionless measure of the inward or outward horizontal displacement
    of the upper plasma-boundary apex relative to the magnetic-axis reference and
    minor radius.
  documentation: 'Upper triangularity describes the shaping of the upper part of a
    tokamak plasma boundary by measuring the horizontal indentation of the upper boundary
    apex relative to a reference major radius. It refines the overall [triangularity](name:triangularity)
    by separating the upper half of the cross-section from the lower half, which is
    represented by [lower triangularity](name:lower_triangularity). This separation
    is important for asymmetric diverted equilibria and for comparing upper and lower
    plasma shaping.


    A common geometric definition is


    $$

    \delta_u = \frac{R_0 - R_u}{a}

    $$


    where $\delta_u$ is the upper triangularity, $R_0$ is the reference major radius
    of the magnetic axis in the right-handed cylindrical $(R, \phi, Z)$ frame, $R_u$
    is the major radius of the upper boundary apex, and $a$ is the minor radius reference
    used for the same boundary. Related one-sided measures include [inner triangularity](name:inner_triangularity),
    [outer triangularity](name:outer_triangularity), and [minor triangularity](name:triangularity),
    which describe complementary aspects of boundary indentation.


    Upper triangularity is obtained from magnetic-equilibrium reconstruction of the
    last closed flux surface or separatrix using magnetic probes, flux loops, pressure
    constraints, and internal magnetic measurements when available. Representative
    values in diverted tokamak plasmas range from about -0.3 to 0.6, with positive
    values associated with conventional positive-triangularity shaping and negative
    values associated with negative-triangularity scenarios.


    Sign convention: Positive when the upper boundary apex lies at smaller major radius
    $R$ than the reference magnetic-axis major radius in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:triangularity
  - name:lower_triangularity
  - name:inner_triangularity
  - name:outer_triangularity
  - name:triangularity
