- name: normalized_atomic_count_of_pellet
  kind: scalar
  status: active
  description: Normalized atomic count of a pellet is the total inventory of atomic
    nuclei associated with one pellet after division by a fixed reference inventory
    of 10^20 atomic nuclei, independent of molecular bonding, phase, or species.
  documentation: 'Normalized atomic count of a pellet is the total inventory of atomic
    nuclei associated with one pellet after division by a fixed reference atomic inventory.
    Molecules, compounds, and mixtures are converted to their constituent atoms before
    summation, regardless of molecular bonding, phase, or species.


    For constituent entity types indexed by $i$, the normalized atomic inventory is
    defined by


    $$

    N_{\mathrm{atom,n}} = \frac{N_{\mathrm{atom}}}{N_{\mathrm{ref}}} = \frac{1}{N_{\mathrm{ref}}}\sum_i
    a_i N_i

    $$


    where $N_{\mathrm{atom,n}}$ is the normalized atomic count, $N_{\mathrm{atom}}$
    is the physical atomic inventory, $N_{\mathrm{ref}}=10^{20}$ is the fixed reference
    atomic inventory, $N_i$ is the number of entities of type $i$, and $a_i$ is the
    number of atomic nuclei in each entity; molecular multiplicity is represented
    by [molecular atomic multiplicity](name:molecular_atomic_multiplicity).


    This quantity is the scaled counterpart of [atomic count of pellet](name:atomic_count_of_pellet),
    which is unnormalized, and remains an atomic inventory rather than a separately
    counted molecule inventory in [count of pellet](name:count_of_pellet). Layer-restricted
    values, such as [core atomic count of pellet](name:core_atomic_count_of_pellet)
    and [outer atomic count of pellet](name:outer_atomic_count_of_pellet), partition
    the same atomic inventory, while normalized atomic count applies only the reference
    scaling; it is not a fraction or probability.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:atomic_count_of_pellet
