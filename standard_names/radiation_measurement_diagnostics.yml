- name: neutral_fraction
  kind: scalar
  status: active
  description: Dimensionless fraction of a hydrogen-isotope neutral population component
    (cold recycled or hot charge-exchange neutrals) relative to the total neutral
    atom population.
  documentation: 'The neutral fraction is a dimensionless ratio bounded in $[0, 1]$
    expressing the relative abundance of a defined component of the hydrogen-isotope
    neutral population. In the standard two-component neutral model, cold recycled
    neutrals and charge-exchange-born hot neutrals partition the neutral atom inventory,
    and their respective fractions sum to unity.


    The fraction for a given component is defined as:


    $$

    f_{\mathrm{component}} = \frac{n_{\mathrm{component}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $n_{\mathrm{component}}$ is the number density of the specified neutral
    component and $n_{\mathrm{cold}}$, $n_{\mathrm{hot}}$ are the cold and hot neutral
    number densities respectively.


    The component fractions are inferred from Doppler-broadening analysis of visible
    hydrogen-isotope spectral emission lines, in which the cold and hot neutral populations
    contribute distinct narrow and broad Gaussian components to the line shape. The
    [cold_neutral_fraction](name:cold_neutral_fraction) characterizes the low-energy
    recycled neutral component, while [hot_neutral_fraction](name:hot_neutral_fraction)
    gives the charge-exchange-born component; together they form a complete partition
    of the neutral population. The energy threshold separating the two components
    must be specified by the diagnostic or population model employed.


    Sign convention: Positive when the specified neutral component density is greater
    than zero.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  - name:hot_neutral_fraction
- name: cold_neutral_fraction
  kind: scalar
  status: active
  description: Dimensionless fraction of the cold recycled component of a hydrogen-isotope
    neutral population relative to the total neutral atom population.
  documentation: 'The cold neutral fraction is a dimensionless ratio bounded in $[0,
    1]$ expressing the relative abundance of the cold, low-energy recycled component
    of a hydrogen-isotope neutral population. It is a component of the broader [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density), distinct
    from the hot charge-exchange-born component.


    The fraction is defined as:


    $$

    f_{\mathrm{cold}} = \frac{n_{\mathrm{cold}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $f_{\mathrm{cold}}$ is the cold neutral fraction, $n_{\mathrm{cold}}$ is
    the number density of cold recycled neutral atoms, and $n_{\mathrm{hot}}$ is the
    number density of hot charge-exchange-born neutral atoms.


    The quantity applies to a specified hydrogen isotope and uses the two-component
    neutral-population model. Its denominator is the total neutral population formed
    by the cold and hot components for that isotope; it is not summed across different
    isotopes and does not represent the hot component itself.


    Within this model, the cold and hot fractions are complementary and sum to unity.
    The [hot neutral fraction](name:hot_neutral_fraction) gives the corresponding
    charge-exchange-born component, with the energy threshold separating the two components
    defined by the applicable population model.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_fraction
  sources:
  - dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-isotope_ratios-isotope-cold_neutrals_fraction
    dd_documentation:
      leaf: Fraction of cold neutrals for this isotope (n_cold_neutrals/(n_cold_neutrals+n_hot_neutrals))
      parent_path: spectrometer_visible/channel/isotope_ratios/isotope
      parent: Set of isotopes
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/isotope/time
    enhanced_context:
      description: Fraction of cold neutrals for a given hydrogen isotope, defined
        as n_cold/(n_cold + n_hot). Quantifies the relative population of cold (low-energy)
        neutrals compared to the total neutral population of that isotope from visible
        spectroscopy.
      kind: llm
- name: hot_neutral_fraction
  kind: scalar
  status: active
  description: Dimensionless fraction of the hot charge-exchange-born component of
    a hydrogen-isotope neutral population relative to the total neutral atom population.
  documentation: 'The hot neutral fraction is a dimensionless ratio bounded in $[0,
    1]$ expressing the relative abundance of the hot, charge-exchange-born component
    of a hydrogen-isotope neutral population. It is a component of the broader [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density), distinct
    from the cold recycled component.


    The fraction is defined as:


    $$

    f_{\mathrm{hot}} = \frac{n_{\mathrm{hot}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $f_{\mathrm{hot}}$ is the hot neutral fraction, $n_{\mathrm{hot}}$ is the
    number density of hot charge-exchange-born neutral atoms, and $n_{\mathrm{cold}}$
    is the number density of cold recycled neutral atoms.


    The quantity applies to a specified hydrogen isotope and uses the two-component
    neutral-population model. Its denominator is the total neutral population formed
    by the cold and hot components for that isotope; it is not summed across different
    isotopes and does not represent the cold component itself.


    Within this model, the hot and cold fractions are complementary and sum to unity.
    The [cold neutral fraction](name:cold_neutral_fraction) gives the corresponding
    recycled component, with the energy threshold separating the two components defined
    by the applicable population model.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  sources:
