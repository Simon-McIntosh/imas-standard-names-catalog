- name: open_magnetic_field_line_fraction
  kind: scalar
  status: draft
  description: Ratio of open magnetic field lines (those terminating on material surfaces
    such as limiters or the vessel wall) to the total number of traced field lines,
    evaluated during plasma initiation.
  documentation: 'The open magnetic field line fraction $f_\mathrm{open} = N_\mathrm{open}
    / (N_\mathrm{open} + N_\mathrm{closed})$ quantifies what proportion of field lines
    in a given spatial region or tracing ensemble intercept a material boundary rather
    than forming closed toroidal orbits. During plasma initiation, a high $f_\mathrm{open}$
    indicates poor magnetic confinement: runaway electrons and the initial electron
    population escape to the wall rather than being confined long enough to sustain
    avalanche ionization. Conversely, regions where $f_\mathrm{open} \to 0$ mark the
    development of a closed-flux-surface region essential for plasma breakdown. The
    fraction is computed by tracing a set of field lines from discrete grid positions
    (see [major_radius_of_field_line_tracing_start_position](name:major_radius_of_field_line_tracing_start_position))
    and classifying each line as open (finite [connection length](name:connection_length_of_magnetic_field_line))
    or closed (returns to its starting point after one full toroidal transit). Typical
    pre-breakdown configurations exhibit $f_\mathrm{open}$ near unity across most
    of the vessel cross-section, dropping sharply toward zero as the vertical field
    and ohmic flux ramp up and closed flux surfaces form. The quantity is dimensionless
    and bounded to $[0, 1]$.'
  unit: '1'
  physics_domain: machine_operations
  links:
  - name:major_radius_of_field_line_tracing_start_position
  - name:connection_length_of_magnetic_field_line
  constraints: []
  sources:
  - id: dd:plasma_initiation/b_field_lines/open_fraction
    dd_path: plasma_initiation/b_field_lines/open_fraction
    status: composed
- name: vertical_coordinate_of_townsend_grid_position
  kind: scalar
  status: draft
  description: Vertical Z coordinate of discrete grid points used in Townsend avalanche
    or closed field-line analysis during plasma initiation, measured in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: 'During plasma initiation modeling, magnetic field lines are traced
    and sampled at discrete grid positions to evaluate ionization conditions. The
    vertical coordinate $Z$ of each Townsend grid point locates the node along the
    height axis of the cylindrical $(R, \phi, Z)$ frame, where $Z$ is measured from
    the machine midplane in meters. These grid positions serve as evaluation points
    for quantities such as the [Townsend avalanche critical electric field](name:townsend_avalanche_critical_electric_field)
    and the [parallel component of the electric field](name:parallel_component_of_electric_field),
    which govern breakdown conditions. The grid spacing and extent are determined
    by the field-line tracing algorithm; typical $Z$ ranges span the full plasma chamber
    height, roughly $-3$ m to $+3$ m for large tokamaks. The distinction between this
    quantity and [vertical_coordinate_of_townsend_position](name:vertical_coordinate_of_townsend_position)
    is that the latter identifies individual sampled positions along field lines,
    whereas the grid positions here form the structured node set of the analysis grid.
    The companion radial coordinate completes the $(R, Z)$ location of each grid node.


    Sign convention: Positive when $Z$ is above the machine midplane in the direction
    of increasing $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: machine_operations
  links:
  - name:townsend_avalanche_critical_electric_field
  - name:parallel_component_of_electric_field
  - name:vertical_coordinate_of_townsend_position
  constraints: []
