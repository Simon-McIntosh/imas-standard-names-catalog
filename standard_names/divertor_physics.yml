        all ion species. Provides a local plasma density metric at the divertor strike
        point relevant to plasma-surface interaction and heat load assessment.
      kind: template
- name: total_ion_power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Rate of energy deposition by all incident ion species and charge states
    on the inner, high-field-side divertor target, integrated over its wetted surface.
  documentation: 'This quantity is the ion-carried contribution to power deposited
    on the inner, high-field-side divertor target. It includes the thermal energy
    entering the electrostatic sheath and the directed kinetic energy acquired by
    ions across the sheath potential drop, while excluding electron, neutral-particle,
    photon, and halo-current contributions. It is the ion-resolved component of [ion
    power at the inner divertor target](name:ion_power_at_inner_divertor_target) and
    is distinct from the all-channel [power at the inner divertor target](name:power_at_inner_divertor_target).


    The deposited ion power is defined by


    $$

    P_{i,in} = \int_{A_{\mathrm{wetted,in}}} \mathbf{q}_i \cdot \hat{\mathbf{n}}_{t}\,
    dA

    $$


    where $P_{i,\mathrm{in}}$ is the integrated ion power, $A_{\mathrm{wetted,in}}$
    is the wetted inner-target surface, $\mathbf{q}_i$ is the total incident ion energy-flux
    density summed over ion species and charge states, and $\hat{\mathbf{n}}_{t}$
    points from the plasma toward the target material.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:ion_power_at_inner_divertor_target
  - name:power_at_inner_divertor_target
  arguments:
  - name: ion_power_at_inner_divertor_target
    operator: total
    operator_kind: qualifier
