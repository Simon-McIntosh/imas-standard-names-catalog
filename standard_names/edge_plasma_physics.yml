- name: flux_surface_averaged_tritium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface average of tritium ion number density evaluated at the
    plasma boundary, with the species-level ion density summed over all charge states.
  documentation: 'Flux-surface average of tritium ion number density evaluated at
    the plasma boundary is the value obtained by applying the flux-surface-average
    operator to the local tritium ion number density on the last closed magnetic flux
    surface. The plasma boundary is the separatrix bounding the confined plasma.


    The average at the boundary flux value $\psi_b$ is defined in flux coordinates
    $(\psi, \theta, \phi)$ by the Jacobian-weighted surface integral:


    $$

    \langle n_T \rangle_{\psi_b} = \frac{\int_0^{2\pi}\!\int_0^{2\pi} n_T(\psi_b,\theta,\phi)\,\mathcal{J}(\psi_b,\theta,\phi)\,d\theta\,d\phi}{\int_0^{2\pi}\!\int_0^{2\pi}
    \mathcal{J}(\psi_b,\theta,\phi)\,d\theta\,d\phi}

    $$


    where $n_T$ is the local [tritium ion number density at the plasma boundary](name:tritium_density_at_plasma_boundary),
    $\psi_b$ is the boundary value of the poloidal magnetic flux, $\theta$ and $\phi$
    are the poloidal and toroidal coordinates in the flux-coordinate tuple $(\psi,
    \theta, \phi)$, and $\mathcal{J}$ is the positive coordinate Jacobian of the flux-coordinate
    mapping. Equivalently, $\mathcal{J}\,d\theta\,d\phi$ is the flux-surface measure
    $dS/|\nabla\psi|$ at fixed $\psi$.


    The species-level tritium density is summed over all charge states of tritium
    ions. It excludes neutral tritium atoms and tritium-bearing molecules, and is
    distinct from [flux-surface-averaged total ion density], which aggregates over
    all ion species.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:tritium_density_at_plasma_boundary
  arguments:
  - name: tritium_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix_average/n_i/tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-tritium-value
    dd_documentation:
