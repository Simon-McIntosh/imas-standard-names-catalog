- name: perpendicular_fast_particle_pressure
  kind: scalar
  status: draft
  description: Perpendicular component of the anisotropic pressure tensor carried
    by the fast (suprathermal) particle population.
  documentation: "The perpendicular fast particle pressure $p_{\\perp,\\mathrm{fast}}$\
    \ is the pressure component orthogonal to the local magnetic field direction,\
    \ arising from the gyromotion of energetic particles. In an anisotropic plasma,\
    \ the full pressure tensor is expressed as $\\mathbf{P} = p_\\parallel \\mathbf{b}\\\
    mathbf{b} + p_\\perp (\\mathbf{I} - \\mathbf{b}\\mathbf{b})$, where $\\mathbf{b}\
    \ = \\mathbf{B}/B$ is the unit vector along the field. This quantity sums contributions\
    \ from all suprathermal species, including fast ions and fast electrons, and is\
    \ obtained from the second moment of the fast-particle distribution function integrated\
    \ over energy-pitch space. Typical fast-particle perpendicular pressures in the\
    \ core of ITER baseline scenarios reach tens of kilopascals, strongly coupled\
    \ to the heating and current drive sources. The flux-surface-averaged quantity\
    \ enters the Grad\u2013Shafranov equilibrium force balance via the total perpendicular\
    \ pressure, linking it to the Shafranov shift and local magnetic shear. Standard\
    \ diagnostics for inferring this quantity include fast-ion $D_\\alpha$ (FIDA)\
    \ measurements, neutron emission spectrometry, and equilibrium reconstruction\
    \ constrained by external magnetic measurements. For the total anisotropic pressure,\
    \ refer to the parent quantity [fast_particle_pressure](name:fast_particle_pressure).\
    \ See also [perpendicular_fast_ion_pressure](name:perpendicular_fast_ion_pressure)\
    \ and [perpendicular_fast_electron_pressure](name:perpendicular_fast_electron_pressure)\
    \ for individual species contributions, and [parallel_fast_electron_pressure](name:parallel_fast_electron_pressure)\
    \ for the parallel counterpart.\n\nSign convention: Positive when the pressure\
    \ tensor component normal to the local magnetic field carries compressive energy\
    \ density.\n\nTypical experimental values in present-day tokamaks (e.g., JET,\
    \ DIII-D) range from 0.1\u201310 kPa during neutral beam injection, increasing\
    \ to tens of kilopascals in burning plasma regimes."
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_particle_pressure
  - name:perpendicular_fast_ion_pressure
  - name:perpendicular_fast_electron_pressure
  - name:parallel_fast_electron_pressure
  arguments:
