- name: total_power_due_to_ohmic_dissipation
  kind: scalar
  status: active
  description: Aggregate rate of irreversible electrical-energy conversion into heat
    by resistive current flow across the applicable conducting plasma or structure.
  documentation: 'Total ohmic-dissipation power is the rate of irreversible conversion
    of electrical work into heat by finite-resistivity currents. The total aggregation
    covers the complete applicable conducting domain rather than one selected surface,
    component, or region.


    For a conducting domain $V$, the power is defined by


    $$

    P_{\mathrm{ohm}} = \int_V \mathbf{J} \cdot \mathbf{E}_{\mathrm{res}}\,dV

    $$


    where $P_{\mathrm{ohm}}$ is the total ohmic-dissipation power, $\mathbf{J}$ is
    electric-current density, $\mathbf{E}_{\mathrm{res}}$ is the resistive electric
    field, and $V$ is the conducting volume over which dissipation is aggregated.


    For the global plasma quantity, the domain is the full plasma region and the result
    includes the total resistive heating associated with the plasma current, not only
    a local contribution or the halo-region contribution. The same physical definition
    applies to an explicitly named conducting locus: [power at the wall](name:power_at_wall_due_to_ohmic_dissipation)
    restricts the domain to wall and vessel structures, while [power of the divertor](name:power_of_divertor_due_to_ohmic_dissipation)
    restricts it to all divertor targets. These locus-specific quantities are distinct
    from the global total and exclude radiated or externally launched power.'
  unit: W
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - kind: imas-dd
    ref: disruption/global_quantities/power_ohm
    version: 4.1.0
  - kind: imas-dd
    ref: disruption/global_quantities/power_ohm_halo
    version: 4.1.0
  - kind: imas-dd
    ref: summary/global_quantities/power_ohm/value
    version: 4.1.0
- name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label locating the sawtooth inversion
    radius, where the electron-temperature perturbation changes sign during a crash.
  documentation: 'The quantity is the normalized toroidal magnetic-flux label of the
    magnetic surface passing through the sawtooth inversion radius. This radius is
    the location at which the electron-temperature perturbation reverses sign during
    a sawtooth crash.


    The value is defined by the normalized toroidal flux relation


    $$

    \rho_{\mathrm{tor,norm}}(r_{\mathrm{inv}})=\left[\frac{\Phi_{\mathrm{tor}}(r_{\mathrm{inv}})-\Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}}-\Phi_{\mathrm{tor,axis}}}\right]^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(r_{\mathrm{inv}})$ is the normalized toroidal
    flux coordinate at the inversion radius, $r_{\mathrm{inv}}$ is the sawtooth inversion
    radius, $\Phi_{\mathrm{tor}}(r_{\mathrm{inv}})$ is the toroidal magnetic flux
    enclosed by the magnetic surface at that radius, $\Phi_{\mathrm{tor,axis}}$ is
    the toroidal magnetic flux at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$
    is the toroidal magnetic flux at the equilibrium boundary.


    The quantity applies to the plasma magnetic surface at the sawtooth inversion
    radius and is a point evaluation of the parent [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    not a volume or surface average and not a population-weighted quantity. It is
    not the inversion radius itself, a cylindrical radial distance, or a local vector
    component.


    It is the parent normalized toroidal flux coordinate evaluated specifically at
    the inversion locus. It therefore differs from the corresponding value at the
    [sawtooth mixing radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius),
    which identifies the magnetic surface associated with sawtooth mixing rather than
    the surface where the electron-temperature perturbation changes sign.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: sawtooth_inversion_radius
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: sawteeth/diagnostics/rho_tor_norm_inversion
    version: 4.1.0
  - kind: imas-dd
    ref: sawteeth/diagnostics/rho_tor_norm_q1
    version: 4.1.0
- name: normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  kind: scalar
  status: active
  description: Normalized toroidal-flux surface label evaluated at the sawtooth mixing
    radius, marking the outer boundary of the plasma region homogenized during a sawtooth
    crash.
  documentation: 'This quantity is the normalized toroidal magnetic-flux label of
    the magnetic surface passing through the sawtooth mixing radius. It identifies
    the outer boundary of the plasma region homogenized during a sawtooth crash.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}}) = \left(\frac{\Phi_{\mathrm{tor}}(r_{\mathrm{mix}})
    - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}})$ is the normalized toroidal
    flux coordinate at the mixing radius, $r_{\mathrm{mix}}$ is the sawtooth mixing
    radius, $\Phi_{\mathrm{tor}}(r_{\mathrm{mix}})$ is the toroidal magnetic flux
    enclosed by the mixing surface, $\Phi_{\mathrm{tor,axis}}$ is the toroidal magnetic
    flux at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$ is the toroidal
    magnetic flux at the equilibrium boundary.


    The scope is the single magnetic surface at the sawtooth mixing radius within
    the plasma region affected by the crash. This is a locus-specific evaluation of
    the broader [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    not a coordinate assigned to every magnetic surface, a volume average, or a flux-surface
    average. It is distinct from the corresponding coordinate at the [sawtooth inversion
    radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius),
    because the mixing radius and inversion radius represent different sawtooth characteristics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: sawtooth_mixing_radius
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: sawteeth/diagnostics/rho_tor_norm_mixing
    version: 4.1.0
- name: normalized_toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label locating the resonant flux surface
    at the center of a neoclassical tearing-mode magnetic island.
  documentation: "This quantity is the normalized toroidal-flux label of the magnetic\
    \ surface passing through the center of a neoclassical tearing-mode magnetic island.\
    \ It identifies the island\u2019s resonant surface rather than describing the\
    \ island\u2019s helical phase or radial extent.\n\nAt the island center, the normalized\
    \ toroidal-flux coordinate is defined by\n\n$$\n\\rho_{\\mathrm{tor,norm}} = \\\
    left(\\frac{\\Phi_{\\mathrm{tor}} - \\Phi_{\\mathrm{tor,axis}}}{\\Phi_{\\mathrm{tor,boundary}}\
    \ - \\Phi_{\\mathrm{tor,axis}}}\\right)^{1/2}\n$$\n\nwhere $\\rho_{\\mathrm{tor,norm}}$\
    \ is the normalized toroidal-flux coordinate, $\\Phi_{\\mathrm{tor}}$ is the enclosed\
    \ toroidal magnetic flux at the island center, $\\Phi_{\\mathrm{tor,axis}}$ is\
    \ its value at the magnetic axis, and $\\Phi_{\\mathrm{tor,boundary}}$ is its\
    \ value at the equilibrium boundary.\n\nThe quantity applies to the center, or\
    \ resonant-surface location, of one specified neoclassical tearing-mode island\
    \ and is a pointwise magnetic-surface label, not an average over the island or\
    \ a sum over modes. It is not a cylindrical radial distance, a local vector component,\
    \ or the unnormalized toroidal-flux radius represented by [toroidal flux coordinate\
    \ at the neoclassical tearing-mode center](name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center).\n\
    \nIt is the locus-specific evaluation of the parent [normalized toroidal flux\
    \ coordinate](name:normalized_toroidal_flux_coordinate) at the neoclassical tearing-mode\
    \ center. The island\u2019s helical orientation is described separately by its\
    \ [neoclassical tearing-mode phase](name:neoclassical_tearing_mode_phase)."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  - name:normalized_toroidal_flux_coordinate
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: neoclassical_tearing_mode_center
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: ntms/time_slice/mode/rho_tor_norm
    version: 4.1.1
- name: toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  kind: scalar
  status: active
  description: Non-normalized toroidal-flux radius locating the magnetic surface and
    radial position of a neoclassical tearing-mode island center.
  documentation: "This quantity is the toroidal-flux coordinate of the magnetic surface\
    \ passing through the center of a neoclassical tearing-mode island. It provides\
    \ a radius-like magnetic-surface label for the island\u2019s radial location,\
    \ rather than a geometric distance.\n\nIt is a non-negative, dimensional coordinate\
    \ evaluated at the neoclassical tearing-mode center. The value represents a single\
    \ locus on the nested magnetic surfaces; it is neither a surface average nor a\
    \ volume average.\n\nThe quantity is the locus-specific instance of the parent\
    \ [toroidal flux coordinate](name:toroidal_flux_coordinate). Unlike the [normalized\
    \ toroidal flux coordinate at the neoclassical tearing-mode center](name:normalized_toroidal_flux_coordinate_of_neoclassical_tearing_mode_center),\
    \ it retains the dimensional toroidal-flux-radius scale rather than mapping the\
    \ location to a normalized interval."
  unit: m
