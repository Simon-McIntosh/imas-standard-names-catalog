      parent_path: ferritic/object/centroid
      parent: List of positions of the centroids, in Cartesian coordinates
      data_type: FLT_1D
      unit: m
      coordinates:
      - ferritic/object/centroid/x
    enhanced_context:
      description: Y coordinate of centroid.
      kind: template
- name: power_density_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Power density of a breeder blanket layer is the net local rate at which
    energy is transferred to or from material within a specified breeder blanket layer
    per unit material volume, independent of the volumetric mechanism specified by
    a more specialized quantity.
  documentation: 'Power density of a breeder blanket layer is the net local rate at
    which energy is transferred to or from material within a specified breeder blanket
    layer per unit material volume. It is the material-region specialization of [power
    density](name:power_density) for a layer of a breeder blanket, with the layer
    defining the recipient material region in the local energy balance.


    For a differential material volume of the layer, the volumetric power density
    is defined by


    $$

    p_\mathrm{layer} = \frac{dE_\mathrm{layer}}{dt\,dV_\mathrm{layer}}

    $$


    where $E_\mathrm{layer}$ is the energy transferred to the layer material, $t$
    is time, and $V_\mathrm{layer}$ is the material volume within that layer.


    This quantity is not mechanism-specific unless qualified by a more specialized
    standard name; [nuclear power density of breeder blanket layer](name:nuclear_power_density_of_breeder_blanket_layer)
    restricts the transfer to nuclear energy deposition in the same material layer.
    It is distinct from surface heat flux at a layer interface, volume-integrated
    power of the layer, and [power density of a breeder blanket module](name:power_density_of_breeder_blanket_module)
    defined for a larger blanket material region.


    Sign convention: Positive when energy is transferred to the material of the breeder
    blanket layer.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_layer
  arguments:
  - name: power_density
    operator: breeder_blanket_layer
    operator_kind: locus
- name: nuclear_power_density_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Local rate of nuclear energy deposition within the material volume
    of one breeder blanket layer, generated by neutron interactions and associated
    photon absorption.
  documentation: 'Nuclear power density is the local volumetric heat-generation rate
    within one defined breeder blanket material layer. It includes energy deposited
    by neutron interactions and by absorption of primary or secondary photons, rather
    than surface heat loads or externally applied heating.


    The volume integral gives the corresponding layer-integrated nuclear heating power:


    $$

    P_{\mathrm{nuc,layer}} = \int_{V_{\mathrm{layer}}} q_{\mathrm{nuc}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $q_{\mathrm{nuc}}(\mathbf{r})$ is the local nuclear power density, $P_{\mathrm{nuc,layer}}$
    is the integrated nuclear heating power, $\mathbf{r}$ is position, and $V_{\mathrm{layer}}$
    is the material volume of the layer. This quantity is the nuclear-deposition component
    of [power density of a breeder blanket layer](name:power_density_of_breeder_blanket_layer)
    and integrates to [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer).'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:power_density_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_layer
  arguments:
  - name: power_density_of_breeder_blanket_layer
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/layer/time_slice/midplane_power_density_nuclear
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-layer-time_slice-midplane_power_density_nuclear
    dd_documentation:
      leaf: Nuclear heating power density in the layer, evaluated at midplane
      parent_path: breeding_blanket/module/layer/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W.m^-3
    enhanced_context:
      description: Nuclear heating power density (volumetric) in a breeding blanket
        layer evaluated at the outboard midplane. Quantifies local neutron-induced
        heat deposition at the midplane position within the blanket material.
      kind: llm
- name: power_density_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Net volumetric rate of energy transfer to or from material within a
    single breeder blanket module, encompassing the mechanisms included in its local
    material energy balance.
  documentation: 'Power density of a breeder blanket module is the net local rate
    at which energy is transferred to or from material within a single breeder blanket
    module per unit material volume. It is the material-region specialization of [power
    density](name:power_density), with the transfer mechanism left unqualified.


    The local volumetric power density is defined by


    $$

    p_E = \frac{dE}{dt\,dV}

    $$


    where $E$ is the energy transferred to the material, $t$ is time, and $V$ is the
    material volume. Positive values denote net energy gain by the material, while
    negative values denote net energy loss.


    This is a local quantity, not a module-integrated power or a module average. Mechanism-specific
    quantities such as [nuclear power density of breeder blanket module](name:nuclear_power_density_of_breeder_blanket_module)
    are specializations, while [power of breeder blanket module](name:power_of_breeder_blanket_module)
    is the corresponding integrated module-level quantity; [power density of breeder
    blanket layer](name:power_density_of_breeder_blanket_layer) applies the same local
    concept to a layer locus.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:power_density
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:power_of_breeder_blanket_module
  - name:power_density_of_breeder_blanket_layer
  arguments:
  - name: power_density
    operator: breeder_blanket_module
    operator_kind: locus
- name: nuclear_power_density_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Volumetric nuclear heating power density deposited in breeder-blanket
    module materials by neutron interactions and associated photon absorption. It
    is a local material quantity, not a module average or total module heating power.
  documentation: 'Volumetric nuclear heating power density deposited in a breeder
    blanket module is the local rate of nuclear energy deposition per material volume
    within the module material. It represents nuclear heating from neutron-induced
    reactions, recoil and charged-particle products, and associated photon energy
    absorption in the local material mixture.


    The total nuclear heating power of the module is the material-volume integral
    of the local density:


    $$

    P_\mathrm{nuc}^{\mathrm{module}} = \int_{V_\mathrm{module}} q_\mathrm{nuc}(\mathbf{r})\,dV

    $$


    where $P_\mathrm{nuc}^{\mathrm{module}}$ is the [nuclear heating power of the
    breeder blanket module](name:nuclear_heating_power_of_breeder_blanket_module),
    $q_\mathrm{nuc}(\mathbf{r})$ is the local nuclear power density at material point
    $\mathbf{r}$, $V_\mathrm{module}$ is the material volume of the breeder blanket
    module, and $dV$ is a material-volume element.


    This quantity is local to breeder-blanket module material and is not a module-volume
    average, not the layer-restricted [nuclear power density of a breeder blanket
    layer](name:nuclear_power_density_of_breeder_blanket_layer), and not the total
    module nuclear heating power. A layer-specific density restricts the same local
    physical quantity to an individual functional layer of the module.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:power_density_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_layer
  arguments:
  - name: power_density_of_breeder_blanket_module
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/time_slice/midplane_power_density_nuclear
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-midplane_power_density_nuclear
    dd_documentation:
      leaf: Nuclear heating power density in the module, evaluated at midplane
      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_1D
      unit: W.m^-3
      coordinates:
      - breeding_blanket/module/time_slice/midplane_wall_distance
    enhanced_context:
      description: Nuclear heating power density profile in a breeding blanket module,
        evaluated at the midplane. Represents the volumetric power deposition from
        neutron and gamma interactions in the blanket material.
      kind: llm
- name: power_density_of_limiter_tile
  kind: scalar
  status: active
  description: Net volumetric rate of energy transfer to or from material within a
    limiter tile, independent of the mechanism producing the local gain or loss.
  documentation: 'Power density of a limiter tile is the net rate at which energy
    is transferred to or from material within the tile per unit material volume. It
    is the local source or sink in the tile''s energy balance and is independent of
    the contributing mechanism. This material-region specialization of [power density](name:power_density)
    applies to the net energy balance of the tile.


    For a differential material volume, the volumetric power density is defined by


    $$

    p_E = \frac{dE}{dt\,dV}

    $$


    where $E$ is the energy transferred to the tile material, $t$ is time, and $V$
    is material volume.


    The quantity is local and per unit material volume, not the volume-integrated
    [nuclear power of a limiter tile](name:nuclear_power_of_limiter_tile). Positive
    values denote net energy gain by the tile material, while negative values denote
    net energy loss. [Nuclear power density of a limiter tile](name:nuclear_power_density_of_limiter_tile)
    is a mechanism-specific specialization.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:power_density
  - name:nuclear_power_of_limiter_tile
  - name:nuclear_power_density_of_limiter_tile
  arguments:
  - name: power_density
    operator: limiter_tile
    operator_kind: locus
- name: nuclear_power_density_of_limiter_tile
  kind: scalar
  status: active
  description: Local volumetric rate of nuclear energy deposition in limiter-tile
    material from neutron interactions and associated absorption of primary and secondary
    gamma radiation.
  documentation: 'Nuclear power density of a limiter tile is the local volumetric
    energy deposition rate within the material of one limiter tile caused by neutron
    interactions and associated gamma-radiation absorption. It is the nuclear contribution
    to the broader [power density of a limiter tile](name:power_density_of_limiter_tile),
    not the total local energy source.


    $$

    P_{\mathrm{nuc}} = \int_{V_{\mathrm{tile}}} q_{\mathrm{nuc}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $q_{\mathrm{nuc}}(\mathbf{r})$ is the nuclear power density at position
    $\mathbf{r}$, $V_{\mathrm{tile}}$ is the material volume of the limiter tile,
    and $P_{\mathrm{nuc}}$ is the corresponding [nuclear power of a limiter tile](name:nuclear_power_of_limiter_tile).


    The quantity includes energy deposited volumetrically by neutron scattering and
    capture and by absorption of primary and secondary gamma radiation. Surface heat
    loads, externally applied heating, and nonnuclear energy-transfer mechanisms are
    excluded.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:power_density_of_limiter_tile
  - name:nuclear_power_of_limiter_tile
  arguments:
  - name: power_density_of_limiter_tile
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: wall/description_2d/limiter/unit/midplane_power_density_nuclear
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-limiter-unit-midplane_power_density_nuclear
    dd_documentation:
      leaf: Nuclear power density heating this unit evaluated at the midplane (whenever
        relevant)
      parent_path: wall/description_2d/limiter/unit
      parent: Set of limiter units
      data_type: STRUCTURE
      unit: W.m^-3
    enhanced_context:
      description: Nuclear power density deposited in a limiter wall unit at the midplane.
        Represents volumetric nuclear heating from neutron and gamma interactions
        at that toroidal location.
      kind: llm
- name: toroidal_angular_width_of_limiter_tile
  kind: scalar
  status: active
  description: "Full toroidal angular span of one limiter tile between its minimum\
    \ and maximum \u03C6 coordinates in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'The toroidal angular width of an individual limiter tile is the
    full angular span occupied by that tile around the machine symmetry axis. It is
    a non-negative geometric extent in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The width is defined from the extrema of the tile''s toroidal-angle extent:


    $$

    \Delta\phi_{\mathrm{tile}} = \phi_{\max} - \phi_{\min}

    $$


    where $\Delta\phi_{\mathrm{tile}}$ is the tile''s toroidal angular width, and
    $\phi_{\max}$ and $\phi_{\min}$ are the maximum and minimum toroidal-angle coordinates
    of the tile, evaluated on a continuous angular branch when the extent crosses
    the angular periodic boundary.


    This quantity applies to one individual limiter tile and represents its complete
    toroidal span; it is not summed over tiles, limiter units, or periodic repetitions.
    It is distinct from a toroidal-angle coordinate, a tile-center angle, and the
    angular width of an entire limiter assembly.


    The toroidal extent complements the boundary geometry described by the [vertical
    outline of the limiter tile](name:vertical_outline_of_limiter_tile), while the
    analogous camera field-of-view quantity [toroidal angular width of a camera](name:toroidal_angular_width_of_camera)
    applies to an optical viewing extent rather than a structural tile.'
  unit: rad
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_limiter_tile
  sources:
  - dd_path: wall/description_2d/limiter/unit/phi_extensions
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-limiter-unit-phi_extensions
    dd_documentation:
      leaf: Simplified description of toroidal angle extensions of the unit, by a
        list of zones defined by their center and full width (in toroidal angle).  In
        each of these zones, the unit outline remains the same. Leave this node empty
        for an axisymmetric unit. The first dimension gives the center and full width
        toroidal angle values for the unit. The second dimension represents the toroidal
        occurrences of the unit countour (i.e. the number of toroidal zones).
      parent_path: wall/description_2d/limiter/unit
      parent: Set of limiter units
      data_type: FLT_2D
      unit: rad
      coordinates:
      - 1...N
      - 1...2
    enhanced_context:
      description: "Simplified description of the toroidal angle (\u03C6) extensions\
        \ of a limiter unit, given as a list of zones defined by their centre and\
        \ full width in toroidal angle. Used to describe toroidally periodic or discrete\
        \ plasma-facing components."
      kind: llm
- name: vertical_outline_of_plasma_facing_component
  kind: scalar
  status: active
  description: "The vertical coordinate of each point on a plasma-facing component\
    \ boundary outline is the signed height in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The vertical outline coordinate is the signed height $Z$ of each
    boundary-contour point belonging to a plasma-facing component. It describes the
    component boundary in the right-handed cylindrical $(R, \phi, Z)$ frame.


    For outline point $i$, the coordinate is defined by


    $$

    Z_i = \mathbf{r}_i \cdot \hat{\mathbf{Z}}

    $$


    where $Z_i$ is the vertical coordinate of point $i$, $\mathbf{r}_i$ is that point''s
    position vector relative to the cylindrical coordinate origin, and $\hat{\mathbf{Z}}$
    is the unit vector in the vertical direction. The quantity applies pointwise to
    one component boundary outline and is not an average, extremum, centroid coordinate,
    or integrated geometric measure. A closed outline does not repeat its first point
    as a closing point.


    This coordinate has the same geometric meaning as the corresponding outline coordinate
    for a limiter tile or divertor tile, such as [vertical outline of limiter tile](name:vertical_outline_of_limiter_tile)
    and [vertical outline of divertor tile](name:vertical_outline_of_divertor_tile),
    but its locus is the plasma-facing component boundary in general.


    Sign convention: Positive when $Z_i$ increases in the $+\hat{\mathbf{Z}}$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_limiter_tile
  sources:
  - dd_path: wall/description_2d/mobile/unit/outline/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-mobile-unit-outline-z
    dd_documentation:
      leaf: Height
      parent_path: wall/description_2d/mobile/unit/outline
      parent: Irregular outline of the mobile unit, for a set of time slices. Do NOT
        repeat the first point for closed contours
      data_type: FLT_1D
      unit: m
      coordinates:
      - wall/description_2d/mobile/unit/outline/r
    enhanced_context:
      description: Vertical (Z) coordinate of outline.
      kind: template
