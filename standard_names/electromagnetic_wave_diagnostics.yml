    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/polarimeter.html#polarimeter-channel-ellipticity_initial
    dd_documentation:
      leaf: Initial ellipticity before entering the plasma
