name: electron_number_density_at_separatrix
status: draft
cocos_transformation_type: one_like
description: Electron number density evaluated at the last closed flux surface (separatrix),
  bridging confined and scrape-off-layer plasmas.
documentation: The electron density at the separatrix $n_{e,\rm sep}$ is the value
  of $n_e$ at the last closed flux surface ($\psi_N = 1$). It sets the upstream boundary
  condition for scrape-off-layer (SOL) transport models and strongly influences divertor
  detachment thresholds and parallel heat-flux decay lengths. Typical values range
  from $1 \times 10^{19}$ to $5 \times 10^{19}\;\mathrm{m^{-3}}$ in current tokamaks.
  $n_{e,\rm sep}$ is difficult to measure directly; it is usually inferred from an
  outward extrapolation of the Thomson scattering pedestal fit (mtanh or linear),
  sometimes cross-checked with Langmuir probe data mapped to the midplane separatrix.
  See `electron_density_at_pedestal` for the pedestal-top value and `volume_averaged_electron_density`
  for the global average.
