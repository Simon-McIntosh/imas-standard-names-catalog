      parent_path: spectrometer_visible/channel/isotope_ratios/isotope
      parent: Set of isotopes
      data_type: FLT_1D
      unit: eV
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/isotope/time
    enhanced_context:
      description: Temperature of cold neutral atoms for a given hydrogen isotope,
        inferred from visible spectral line analysis. Characterizes the thermal cold
        neutral population used in isotope ratio fitting models for edge plasma composition
        analysis.
      kind: llm
  - dd_path: spectrometer_visible/channel/polarization_spectroscopy/temperature_cold_neutrals
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-polarization_spectroscopy-temperature_cold_neutrals
