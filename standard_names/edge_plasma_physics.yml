- name: toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal velocity of helium-3 ions at the plasma
    boundary (separatrix).
  documentation: "The flux-surface-averaged toroidal velocity of helium-3 ($^3$He)\
    \ ions quantifies the bulk toroidal flow of this light helium isotope (2 protons,\
    \ 1 neutron) evaluated on the last closed flux surface that separates the confined\
    \ plasma from the open-field-line scrape-off layer. This boundary value characterizes\
    \ net toroidal rotation of $^3$He ions at the separatrix, relevant to impurity\
    \ transport, momentum balance, and plasma\u2013wall interaction studies.\n\nThe\
    \ flux-surface average of the toroidal velocity component is defined as:\n\n$$\n\
    \\langle v_\\phi \\rangle = \\frac{\\oint v_\\phi \\, dl / B_p}{\\oint dl / B_p}\n\
    $$\n\nwhere $v_\\phi = \\mathbf{v}_{\\mathrm{He_3}} \\cdot \\hat{\\phi}$ is the\
    \ ion fluid velocity projected onto $\\hat{\\phi}$ \u2014 the unit vector in the\
    \ direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame \u2014 $B_p$ is the poloidal magnetic field magnitude,\
    \ and $dl$ is the arc-length element along the separatrix contour.\n\nToroidal\
    \ rotation at the boundary is driven by external momentum sources such as neutral\
    \ beam injection, intrinsic rotation arising from turbulent and neoclassical stresses,\
    \ and the edge radial electric field. The quantity is inferred from charge exchange\
    \ recombination spectroscopy (CXRS) using injected neutral beams that stimulate\
    \ helium-3 charge-exchange emission lines whose Doppler shift encodes the local\
    \ toroidal velocity.\n\nBoundary toroidal flow speeds for light ions in tokamak\
    \ edge plasmas are of order $10^3$\u2013$10^4$ m s$^{-1}$, depending on heating\
    \ power, plasma current, and confinement regime. The analogous quantities for\
    \ tritium and hydrogen are [toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary)\
    \ and [toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary);\
    \ the generic multi-species form is toroidal_ion_velocity_at_plasma_boundary.\n\
    \nSign convention: Positive when helium-3 ions flow in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above along $+\\hat{Z}$)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/velocity_phi/helium_3/value
