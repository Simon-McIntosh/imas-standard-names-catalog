- name: x2_coordinate_of_filter
  kind: scalar
  status: draft
  description: X2 coordinate of filter window outline vertices in the local orthogonal
    (X1, X2) plane frame, giving the second-axis positions that jointly define the
    filter aperture boundary shape.
  documentation: "The filter aperture boundary is represented as a closed polygon\
    \ of vertices whose positions are specified in a local orthogonal 2D coordinate\
    \ system $(X_1, X_2)$ attached to the filter element. The X2 coordinate provides\
    \ the second-axis component of each boundary vertex, and together with [x1_coordinate_of_filter](name:x1_coordinate_of_filter),\
    \ fully defines the transverse cross-sectional outline of the filter window. This\
    \ planar boundary geometry is used to compute the \xE9tendue, solid angle, and\
    \ angular acceptance of the associated X-ray diagnostic channel.\n\nThe local\
    \ $(X_1, X_2)$ frame is defined in the plane of the filter element; both axes\
    \ form a right-handed orthogonal pair with the origin fixed to the filter element\
    \ mounting reference. Filter windows in X-ray diagnostics span dimensions from\
    \ roughly 0.001\u20130.05 m, so outline vertex coordinates lie within that range\
    \ of the local frame origin. The identical coordinate convention governs the aperture\
    \ outline described by [x2_coordinate_of_diagnostic_aperture](name:x2_coordinate_of_diagnostic_aperture),\
    \ while the closely related [x2_coordinate_of_filter_window](name:x2_coordinate_of_filter_window)\
    \ applies the same scheme to a more narrowly scoped filter-window object.\n\n\
    Sign convention: Positive when the vertex position lies in the positive $X_2$\
    \ direction from the local frame origin."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x1_coordinate_of_filter
  - name:x2_coordinate_of_diagnostic_aperture
  - name:x2_coordinate_of_filter_window
  sources:
  - id: dd:soft_x_rays/channel/filter_window/outline/x2
    dd_path: soft_x_rays/channel/filter_window/outline/x2
    status: composed
- name: x2_coordinate_of_filter_window
  kind: scalar
  status: draft
  description: X2 coordinate of the filter window outline vertices in the local (X1,
    X2) frame, jointly defining the aperture boundary shape with the paired X1 vertex
    positions.
  documentation: 'The X2 coordinate gives the positions of the filter window outline
    vertices along the second axis of the local two-dimensional $(X_1, X_2)$ coordinate
    frame attached to the filter window assembly. Together with the [X1 coordinate](name:x1_coordinate_of_filter_window),
    these vertex positions jointly specify the full irregular polygonal boundary of
    the filter aperture.


    The outline is constructed from a set of $N$ vertex pairs $(x_{1,i},\, x_{2,i})$,
    $i = 1, \ldots, N$, connected sequentially to close the boundary polygon:


    $$

    \partial A = \{(x_{1,i},\, x_{2,i}) : i = 1, \ldots, N\}

    $$


    where each $(x_{1,i}, x_{2,i})$ is a vertex of the closed outline and $\partial
    A$ denotes the filter aperture boundary. This representation applies when the
    window shape is described as an irregular polygon; simpler geometries such as
    rectangles or circles may instead be parameterized by scalar width or radius descriptors.


    The filter window geometry is characterized during instrument fabrication or calibration
    by direct dimensional measurement of the filter frame. For X-ray cameras and crystal
    spectrometers, the precise aperture shape determines the acceptance solid angle
    and enters etendue calculations that link measured count rates to source brightness,
    making accurate vertex coordinates essential for absolute photometric calibration.
    The analogous role for collimating apertures is served by [x2_coordinate_of_diagnostic_aperture](name:x2_coordinate_of_diagnostic_aperture).


    Sign convention: Positive when the outline vertex lies in the positive $X_2$ direction
    from the local coordinate origin of the filter window frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x1_coordinate_of_filter_window
  - name:x2_coordinate_of_diagnostic_aperture
  sources:
