    [vertical coordinate of a toroidal magnetic-field probe](name:vertical_coordinate_of_toroidal_magnetic_field_probe)
    and is distinct from the [vertical coordinate of a flux loop](name:vertical_coordinate_of_flux_loop).


    Sign convention: Positive when the probe position lies above the machine midplane
    in the $+Z$ direction.'
