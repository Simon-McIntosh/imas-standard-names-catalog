- name: toroidal_flux_surface_averaged_current_density_at_constraint_position
  kind: scalar
  status: active
  description: "Toroidal flux-surface-averaged current density at a constraint position\
    \ is the flux-surface average of the toroidal component of plasma current density\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, evaluated on the magnetic\
    \ surface at the constraint point's normalized toroidal flux radius."
  documentation: 'Toroidal flux-surface-averaged current density at a constraint position
    is the flux-surface average of the toroidal component of plasma current density
    in the right-handed cylindrical $(R, \phi, Z)$ frame, evaluated on the magnetic
    surface at the constraint point''s normalized toroidal flux radius, specified
    by [normalized_toroidal_flux_coordinate_at_constraint_position](name:normalized_toroidal_flux_coordinate_at_constraint_position).
    In this frame, $R$ is major radius, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    The flux-surface average on the selected surface $\rho_c$ is defined by:


    $$

    \left\langle j_\phi \right\rangle(\rho_c) = \frac{\displaystyle\oint_{\rho_\mathrm{tor,norm}=\rho_c}
    j_\phi \, dl_p / B_p}{\displaystyle\oint_{\rho_\mathrm{tor,norm}=\rho_c} dl_p
    / B_p}

    $$


    where $\rho_c$ is the normalized toroidal flux radius of the constraint point,
    $j_\phi$ is the toroidal component of plasma current density in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $B_p$ is the poloidal magnetic-field magnitude
    in tesla, and $dl_p$ is an element of poloidal arc length in meters. The closed
    integrals run over one full poloidal circuit on the surface at fixed $\rho_c$;
    any common toroidal-symmetry factor cancels between numerator and denominator.


    This quantity is the constrained-surface evaluation of toroidal_flux_surface_averaged_current_density,
    not the radial dependence over all magnetic surfaces. It averages the toroidal
    component and is distinct from [parallel_flux_surface_averaged_current_density_at_constraint_position](name:parallel_flux_surface_averaged_current_density_at_constraint_position),
    which averages the component of current density parallel to the magnetic field
    on the same selected surface.


    Sign convention: Positive when the toroidal current density points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, counter-clockwise when viewed from above $+\hat{Z}$.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:parallel_flux_surface_averaged_current_density_at_constraint_position
  sources:
