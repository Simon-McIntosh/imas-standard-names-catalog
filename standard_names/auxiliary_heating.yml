- name: radial_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: "Major-radius coordinate locating the sphere center that defines an\
    \ electron-cyclotron launcher mirror in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The quantity is the major-radius coordinate $R$ of the center of
    the sphere that defines an electron-cyclotron launcher mirror. It identifies the
    mirror''s geometric reference point rather than a point on the reflecting surface.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, the major-radius coordinate
    relates to right-handed Cartesian coordinates $(x,y,z)$ through


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $R$ is the major-radius coordinate, $x$ and $y$ are the Cartesian coordinate
    values in the $(\hat{x},\hat{y},\hat{z})$ basis, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The quantity applies to the electron-cyclotron launcher mirror''s spherical defining
    geometry and represents one geometric point. It is not a plasma quantity, a surface
    coordinate, a mirror steering angle, or an average or integral over the mirror.


    The broader [radial coordinate](name:radial_coordinate) concept is specialized
    here to the sphere center of the mirror. Together with the [vertical coordinate
    of the electron-cyclotron launcher mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror)
    and [toroidal coordinate of the electron-cyclotron launcher mirror](name:toroidal_coordinate_of_electron_cyclotron_launcher_mirror),
    it locates the same geometric center.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ec_launchers/mirror/geometry/sphere_centre/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-mirror-geometry-sphere_centre-r
    dd_documentation:
