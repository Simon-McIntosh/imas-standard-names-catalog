- name: parallel_non_inductive_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged non-inductive current density parallel to the
    magnetic field, including bootstrap and auxiliary drive contributions.
  documentation: "The parallel non-inductive current density $j_{\\parallel}^{\\rm\
    \ ni}$ is defined as the flux-surface average of the component of the non-inductive\
    \ current density vector parallel to the local magnetic field, $j_{\\parallel}^{\\\
    rm ni} = \\langle \\mathbf{j}^{\\rm ni} \\cdot \\mathbf{B} \\rangle / \\langle\
    \ B \\rangle$, where $\\langle B \\rangle$ is the flux-surface-averaged magnetic\
    \ field strength. This definition ensures that $j_{\\parallel}^{\\rm ni}$ represents\
    \ the parallel component exactly on all flux surfaces, not only on-axis. It bundles\
    \ all current not sustained by the inductive electric field: the bootstrap current\
    \ arising from neoclassical effects in a pressure pedestal, plus auxiliary currents\
    \ driven by neutral-beam injection (NBI) and electron-cyclotron (ECCD) or lower-hybrid\
    \ (LHCD) wave heating. Typical core values range from 0.1\u20131 MA/m\xB2 in H-mode\
    \ tokamaks, peaking in the steep-gradient region of the pedestal. In practice,\
    \ this quantity is derived from transport simulations or reconstructed via equilibrium\
    \ codes that solve the current diffusion equation using measured plasma profiles.\
    \ It is distinguished from the scalar non-inductive current density by averaging\
    \ over both angle and radial surfaces, and from the total parallel current density\
    \ by excluding the inductive (Ohmic) component.\n\nSign convention: Positive when\
    \ the current flows in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ viewed from above)."
  unit: A.m^-2
  physics_domain: transport
  links:
