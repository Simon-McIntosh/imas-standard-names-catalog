- name: first_coordinate_width_of_detector_aperture
  kind: scalar
  status: draft
  description: Full width of a detector aperture element in the first local coordinate
    (X1) direction, applicable when the aperture geometry is rectangular.
  documentation: 'The first coordinate width $w_{X1}$ defines the extent of a detector
    aperture along the local X1 axis in a rectangular geometry model. The local coordinate
    frame (X1, X2) is defined per aperture element and is distinct from the global
    cylindrical $(R, \phi, Z)$ frame; the X1 and X2 axes together span the aperture
    plane, so that the full rectangular opening is characterized by $w_{X1} \times
    w_{X2}$. This quantity is only physically meaningful when the aperture geometry
    type is set to rectangular; for circular apertures the relevant quantity is [radius_of_collimating_aperture_of_neutron_detector](name:radius_of_collimating_aperture_of_neutron_detector),
    and for polygonal apertures the outline vertices are described by [first_coordinate_of_detector_outline](name:first_coordinate_of_detector_outline).
    The complementary width in the orthogonal direction is given by [second_coordinate_width_of_aperture](name:second_coordinate_width_of_aperture).
    Typical aperture widths range from a few millimeters to several centimeters depending
    on the diagnostic system (reflectometers, bolometers, neutron detectors, MSE systems).
    The quantity pairs naturally with [first_coordinate_width_of_aperture](name:first_coordinate_width_of_aperture)
    and [first_coordinate_width_of_detector](name:first_coordinate_width_of_detector),
    which describe analogous widths for standalone aperture and detector elements,
    respectively.


    Sign convention: Positive when the width extends in the positive X1 direction
    from the aperture center.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
