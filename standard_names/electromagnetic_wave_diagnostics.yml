      unit: s
    enhanced_context:
      description: Duration of a single frequency sweep of the fluctuation reflectometer
        channel. Sets the temporal resolution of the swept-frequency measurement,
        determining the trade-off between spectral coverage and time resolution.
      kind: llm
- name: length_of_electron_cyclotron_beam
  kind: scalar
  status: active
  description: Curvilinear distance measured along an electron-cyclotron beam-tracing
    ray, providing the propagation coordinate from its launch point to the evaluated
    point.
  documentation: 'This quantity is the cumulative arclength along an electron-cyclotron
    beam-tracing ray from its launch point to a specified point on the propagation
    path. It parameterizes the ray independently of the arbitrary parameter used to
    trace it.


    The arclength is defined by


    $$

    s(\lambda)=\int_{\lambda_0}^{\lambda}\left\lvert\frac{d\mathbf{r}}{d\lambda''}\right\rvert\,d\lambda''

    $$


    where $\mathbf{r}(\lambda'')$ is the ray position in the right-handed cylindrical
    $(R, \phi, Z)$ frame, $\lambda''$ is an arbitrary path parameter, and $\lambda_0$
    denotes the launch point. The arclength is non-negative and increases in the chosen
    propagation direction. It is a local path coordinate; the complete trajectory
    length represented by [length of beam-tracing beam](name:length_of_beam_tracing_beam)
    is a distinct endpoint quantity.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:length_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-length
    dd_documentation:
      leaf: Ray/beam curvilinear length
      parent_path: ece/channel/beam_tracing/beam
      parent: Set of rays/beams describing the wave propagation
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: Curvilinear arc length along the ray or beam path in ECE beam-tracing
        calculations. Parameterizes the propagation distance from the launcher to
        the emission or absorption region along the beam trajectory.
      kind: llm
- name: length_of_fiber_optic_current_sensor
  kind: scalar
  status: active
  description: Total physical arclength of the optical fiber centerline in a fiber-optic
    current sensor, defining its optical propagation distance and distributed magneto-optic
    interaction length.
  documentation: 'This quantity is the total arclength of the optical fiber centerline
    forming the fiber-optic current sensor. It includes the complete winding path
    and is not the straight-line distance between endpoints or the length of the sensor
    outline.


    For a centerline parameterized by an arbitrary parameter $u$, the fiber length
    is defined by


    $$

    L = \int_{u_0}^{u_1} \left|\frac{d\mathbf{r}}{du}\right|\,du

    $$


    where $L$ is the total fiber arclength, $\mathbf{r}(u)$ is the centerline position,
    and $u_0$ and $u_1$ delimit the fiber path. The length sets the optical propagation
    distance; accumulated Faraday rotation additionally depends on the magnetic-field
    projection along the winding and the [Verdet constant](name:verdet_constant_of_fiber_optic_current_sensor).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:verdet_constant_of_fiber_optic_current_sensor
  sources:
  - dd_path: focs/fibre_length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/focs.html#focs-fibre_length
    dd_documentation:
      leaf: Spun fibre length on the vacuum vessel
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Total length of the spun optical fibre wound on the vacuum vessel
        for the Fiber Optic Current Sensor (FOCS) diagnostic. A key geometric parameter
        determining the sensitivity and integration path length for the Faraday-effect
        current measurement.
      kind: llm
- name: normalized_toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Dimensionless toroidal direction cosine of an electromagnetic wave\
    \ vector along a beam-tracing ray in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The normalized toroidal wave-vector component is the signed direction
    cosine of the electromagnetic wave vector along a beam-tracing ray. It gives the
    projection of the propagation direction onto the geometric toroidal direction,
    rather than the unnormalized toroidal wavenumber.


    $$

    n_\phi = \frac{k_\phi}{\lVert\mathbf{k}\rVert} = \frac{\mathbf{k}\cdot\hat{\boldsymbol{\phi}}}{\sqrt{k_R^2+k_\phi^2+k_Z^2}}

    $$


    Here $n_\phi$ is the normalized toroidal wave-vector component, $\mathbf{k}$ is
    the wave vector, $\lVert\mathbf{k}\rVert$ is its magnitude, $k_R$, $k_\phi$, and
    $k_Z$ are its components in the right-handed cylindrical $(R,\phi,Z)$ frame, and
    $\hat{\boldsymbol{\phi}}$ is the unit vector in the direction of increasing toroidal
    angle. The quantity lies between $-1$ and $1$. The same normalization is used
    for the [radial normalized wave-vector component](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    and [vertical normalized wave-vector component](name:vertical_normalized_wave_vector_of_beam_tracing_beam).


    Sign convention: Positive when the wave vector has a component in the direction
    of increasing toroidal angle $\phi$.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/wave_vector/k_phi_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-wave_vector-k_phi_norm
    dd_documentation:
      leaf: Normalized wave vector component in the toroidal direction = k_phi / norm(k)
      parent_path: ece/channel/beam_tracing/beam/wave_vector
      parent: Wave vector of the ray/beam along its path
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Normalized toroidal wave vector component (k_phi/|k|) of an ECE
        beam or ray along its propagation path in cylindrical coordinates. Represents
        the toroidal direction cosine of the unit wave vector in beam tracing calculations
        for ECE diagnostics.
      kind: llm
- name: parallel_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Signed fraction of a beam\u2019s local time-averaged electromagnetic\
    \ power flow parallel to the local magnetic field, normalized to the launched\
    \ beam power."
  documentation: "This quantity is the signed local fraction of electromagnetic power\
    \ carried by a coherent beam-tracing beam in the direction parallel to the local\
    \ magnetic field. It is evaluated along the beam\u2019s ray path and referenced\
    \ to the beam\u2019s initial launched power.\n\nThe normalized parallel fraction\
    \ is defined by\n\n$$\nf_\\parallel = \\frac{P_\\parallel}{P_0} = \\frac{\\int_{\\\
    mathcal{A}} \\langle\\mathbf{S}\\rangle \\cdot \\hat{\\mathbf{b}}\\,\\mathrm{d}A}{P_0}\n\
    $$\n\nwhere $P_\\parallel$ is the local parallel power flow, $\\langle\\mathbf{S}\\\
    rangle$ is the time-averaged electromagnetic Poynting vector, $\\hat{\\mathbf{b}}$\
    \ is the unit vector along the local magnetic field, $\\mathcal{A}$ is the beam\
    \ cross-section, and $P_0$ is the [initial power of the beam-tracing beam](name:initial_power_of_beam_tracing_beam).\
    \ This signed projection is distinct from the non-negative [perpendicular normalized\
    \ power of the beam-tracing beam](name:perpendicular_normalized_power_of_beam_tracing_beam).\n\
    \nSign convention: Positive when the local electromagnetic power flow has a component\
    \ in the direction of the local magnetic field."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:initial_power_of_beam_tracing_beam
  - name:perpendicular_normalized_power_of_beam_tracing_beam
  sources:
