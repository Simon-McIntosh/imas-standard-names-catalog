- name: x1_coordinate_of_bragg_crystal
  kind: scalar
  status: draft
  description: X1 coordinate of a Bragg-crystal outline vertex, measured along the
    first axis of the crystal-local Cartesian (X1, X2) frame. Together with the corresponding
    X2 coordinate, it defines the crystal cross-section boundary used in diffraction
    geometry.
  documentation: 'The $x_1$ coordinate of a Bragg crystal is the signed scalar position
    of an outline vertex along the first axis of the crystal-local Cartesian $(X_1,
    X_2)$ frame. Paired with the corresponding [x2 coordinate of a Bragg crystal](name:x2_coordinate_of_bragg_crystal),
    it identifies one vertex of the crystal cross-section boundary; consecutive paired
    vertices define the ordered polygonal outline of the crystal aperture.


    For a vertex with position vector $\mathbf{r}$ in the crystal-local Cartesian
    $(X_1, X_2)$ frame, the coordinate is the projection of the displacement from
    the local origin onto the positive $X_1$ axis:


    $$

    x_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_{X_1}

    $$


    where $\mathbf{r}_0$ is the local-frame origin and $\hat{\mathbf{e}}_{X_1}$ is
    the unit vector along the positive $X_1$ direction.


    Crystal outline coordinates are usually obtained from mechanical design drawings,
    manufacturer specifications, or optical and coordinate-measuring metrology of
    the mounted crystal. The outline specifies the physical aperture and illuminated
    crystal extent in ray tracing or spectrometer geometry models, but it does not
    by itself determine whether the Bragg condition is satisfied; diffraction also
    depends on lattice spacing, incidence angle, diffraction order, and X-ray wavelength.


    Typical coordinate magnitudes for Bragg-crystal spectrometers range from 0.001-0.10
    m, with millimeter-scale values for small crystals and centimeter-scale values
    for larger analyzer crystals or extended mounts.


    Sign convention: Positive when the vertex displacement from the local origin has
    a component along the positive $X_1$ axis of the crystal-local Cartesian $(X_1,
    X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x2_coordinate_of_bragg_crystal
  - name:x1_coordinate_of_optical_element
  - name:x1_coordinate_of_soft_xray_detector
