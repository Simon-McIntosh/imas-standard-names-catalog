    ref: plasma_profiles/profiles_1d/electrons/pressure
    version: 4.1.0
- name: tritium_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the tritium ion population evaluated at
    the magnetic axis is the local tritium-ion count per physical volume at that location,
    summed over all tritium ionic charge states.
  documentation: 'Particle number density of the tritium ion population evaluated
    at the magnetic axis is the local tritium-ion count per physical volume at that
    location. It represents tritium ions specifically, rather than electrons, other
    ion species, neutral tritium, or another plasma population.


    The defining relation is


    $$

    n_{\mathrm{T,axis}} = \left.\frac{dN_{\mathrm{T}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{T,axis}}$ is the tritium-ion number density at the magnetic
    axis, $N_{\mathrm{T}}$ is the number of tritium ions, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete tritium-ion population at that location and is summed
    over all tritium ionic charge states; neutral tritium is excluded. It is neither
    a flux-surface nor a volume integral.


    This is the tritium-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It differs from [tritium
    density at the plasma boundary](name:tritium_density_at_plasma_boundary), which
    describes the same charge-state aggregation at the plasma boundary rather than
    at the magnetic axis.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:tritium_density_at_plasma_boundary
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/tritium/value
