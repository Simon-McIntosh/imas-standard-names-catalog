name: diamagnetic_flux_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the diamagnetic flux measurement is treated
  as an exact input (1) or fitted via least squares (0) in equilibrium reconstruction.
documentation: This flag controls how the diamagnetic flux constraint enters the equilibrium
  reconstruction solver. When set to 1, the measured diamagnetic flux $\Phi_{\rm dia}$
  is imposed as an exact boundary condition rather than being included in the $\chi^2$
  cost functional with an associated weight. When set to 0, the solver performs a
  least-squares fit balancing this measurement against other constraints according
  to its assigned weight. The diamagnetic flux $\Phi_{\rm dia} = \int \mu_0 (p - p_{\rm
  ext})\,dA$ (where $p$ is the plasma pressure and $p_{\rm ext}$ the external magnetic
  pressure, integrated over the plasma cross-sectional area $A$) provides a global
  constraint on stored energy. See `equilibrium_reconstruction_constraint_weight_of_diamagnetic_flux`
  for the companion weight parameter.
