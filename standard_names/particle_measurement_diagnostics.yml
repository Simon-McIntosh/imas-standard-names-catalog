- name: wetted_area_of_langmuir_probe
  kind: scalar
  status: active
  description: Geometric surface area of a Langmuir probe collector directly exposed
    to plasma and available to receive particle current, excluding shielded surfaces.
  documentation: 'The wetted area of a Langmuir probe is the portion of the collector''s
    geometric surface directly exposed to plasma and available to receive particle
    current. It represents the plasma-contacting area rather than the full hardware
    extent described by [area of a Langmuir probe](name:area_of_langmuir_probe).


    The wetted area is defined by integrating the surface element over the plasma-exposed
    collector surface:


    $$

    A_w = \int_{S_\mathrm{exp}} dS

    $$


    where $S_\mathrm{exp}$ is the plasma-exposed portion of the collector and $dS$
    is its differential surface-area element. Surfaces shielded from direct plasma
    contact are excluded. This geometric contact area is distinct from the [effective
    area of a Langmuir probe](name:effective_area_of_langmuir_probe), which accounts
    for projection relative to the local magnetic field.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_langmuir_probe
  - name:effective_area_of_langmuir_probe
  arguments:
  - name: area_of_langmuir_probe
    operator: wetted
    operator_kind: qualifier
  sources:
  - dd_path: langmuir_probes/embedded/surface_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-surface_area
    dd_documentation:
      leaf: Area of the probe surface exposed to the plasma
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Area of the probe surface exposed to the plasma for an embedded
        Langmuir probe. Used to convert ion saturation current to current density,
        directly affecting derived quantities such as electron density (ne) and parallel
        heat flux.
      kind: llm
  - dd_path: langmuir_probes/reciprocating/surface_area
