- name: normalized_particle_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: "Gyrobohm-normalized turbulent particle flux driven by the perturbed\
    \ electrostatic potential \u03B4\u03C6, summed over the flux surface in a nonlinear\
    \ gyrokinetic simulation."
  documentation: 'In nonlinear gyrokinetic turbulence, the total turbulent particle
    flux has contributions from distinct electromagnetic field components. This quantity
    isolates the contribution of the perturbed electrostatic potential $\delta\varphi$
    to the radial particle flux, normalized to the gyro-Bohm unit $\Gamma_{\rm gB}
    = n_s v_{T,s} (\rho_s / a)^2$, where $n_s$ is the species density, $v_{T,s} =
    \sqrt{T_s / m_s}$ is the thermal velocity, $\rho_s$ is the thermal gyroradius,
    and $a$ is the minor radius. The normalized flux is computed as the flux-surface
    average of $\langle \tilde{n} \tilde{v}_{E,r} \rangle$, where $\tilde{n}$ is the
    perturbed density and $\tilde{v}_{E,r}$ is the radial component of the $E\times
    B$ drift driven by $\delta\varphi$. Typical values in ion-temperature-gradient
    (ITG) turbulence range from near zero in stable regimes to order unity at marginal
    stability; electromagnetic corrections from $\delta A_\parallel$ are tracked separately
    in [normalized_particle_flux_due_to_perturbed_parallel_vector_potential](name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential).
    The companion [normalized_energy_flux_due_to_electrostatic_potential](name:normalized_energy_flux_due_to_electrostatic_potential)
    gives the electrostatic contribution to the energy channel under the same normalization.


    Sign convention: Positive when the net particle flux is directed radially outward,
    away from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
