- name: carbon_density_at_divertor_target
  kind: scalar
  status: active
  description: Carbon density at the divertor target is the local number density of
    carbon ions in the plasma immediately adjacent to a divertor target surface, evaluated
    at the entrance to the electrostatic sheath. It is summed over C1+ through C6+
    and excludes neutral carbon atoms and carbon-bearing neutral molecules.
  documentation: 'Carbon density at the divertor target is the local number density
    of carbon ions in the plasma immediately adjacent to a divertor target surface,
    evaluated at the entrance to the electrostatic sheath. It is the carbon-specific
    member of [density_at_divertor_target](name:density_at_divertor_target) and the
    carbon ionic specialization of [ion_density_at_divertor_target](name:ion_density_at_divertor_target).


    The charge-state-summed carbon ion density is defined by summing the densities
    of the positive carbon ionization states:


    $$

    n_{\mathrm{C},t} = \sum_{q=1}^{6} n_{\mathrm{C}^{q+},t}

    $$


    where $n_{\mathrm{C},t}$ is the carbon ion density at the divertor target, $n_{\mathrm{C}^{q+},t}$
    is the density of carbon ions with charge state $q$ at the same locus, and $q=1$
    and $q=6$ denote singly ionized and fully stripped carbon, respectively.


    The sum includes carbon ions from $\mathrm{C}^{1+}$ through $\mathrm{C}^{6+}$,
    excludes neutral carbon atoms and carbon-bearing neutral molecules, and counts
    particles rather than ionic charge. It contributes as a species-resolved component
    of [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target),
    which aggregates ion particle densities over species without charge-state weighting.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:ion_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: carbon
    operator_kind: qualifier
  sources:
