- name: temperature_at_outlet
  kind: scalar
  status: active
  description: Absolute thermodynamic temperature of a fluid stream at a component
    outlet, defining its downstream thermal state.
  documentation: 'The quantity is the absolute thermodynamic temperature of a fluid
    as it exits a component or cooling loop. It defines the outlet thermal state and
    may serve as a downstream boundary condition; [coolant temperature at outlet](name:coolant_temperature_at_outlet)
    is a coolant-specific instance.


    For a fluid in thermodynamic equilibrium, absolute temperature is defined by


    $$

    T = \left(\frac{\partial U}{\partial S}\right)_{V,N}

    $$


    where $T$ is absolute temperature, $U$ is internal energy, $S$ is entropy, $V$
    is volume, and $N$ is the amount of substance held fixed in the derivative.


    The quantity refers to the state at the exit location and is distinct from the
    upstream [temperature at inlet](name:temperature_at_inlet); it does not by itself
    represent a temperature difference, heat flow, or transferred power.'
  unit: K
  physics_domain: plant_systems
  links:
  - name:coolant_temperature_at_outlet
  - name:temperature_at_inlet
- name: coolant_temperature_at_outlet
  kind: scalar
  status: active
  description: Absolute thermodynamic temperature of coolant as it leaves a cooling
    component or loop, defining the downstream thermal state of the coolant stream.
  documentation: "This quantity is the absolute thermodynamic temperature of the coolant\
    \ stream at a cooling component or loop outlet. It defines the coolant\u2019s\
    \ downstream thermal state and is the coolant-specific form of [temperature at\
    \ outlet](name:temperature_at_outlet).\n\nThe outlet value refers to the coolant\
    \ at the outlet boundary and excludes the inlet state, which is represented by\
    \ [coolant temperature at inlet](name:coolant_temperature_at_inlet). It applies\
    \ to the coolant or working fluid identified as the cooling medium and does not\
    \ represent the temperature of the cooled component or the temperature rise across\
    \ the circuit."
  unit: K
  physics_domain: plant_systems
  links:
  - name:temperature_at_outlet
  - name:coolant_temperature_at_inlet
  arguments:
  - name: temperature_at_outlet
    operator: coolant
