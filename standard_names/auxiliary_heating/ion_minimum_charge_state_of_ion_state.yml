name: ion_minimum_charge_state_of_ion_state
status: draft
description: Lower bound of the charge-state range within an ion charge-state bundle,
  in units of the elementary charge $e$.
documentation: In many plasma modeling frameworks, contiguous ionization stages of
  an ion species are grouped into a charge-state bundle rather than tracked individually.
  The minimum charge state $Z_{\min}$ defines the lower boundary of such a bundle;
  the upper boundary is given by the corresponding maximum charge state $Z_{\max}$.
  For a neutral species the convention is $Z_{\min} = Z_{\max} = 0$. This grouping
  is used in transport solvers, edge source calculations, wave absorption models,
  and wall recycling descriptions to reduce computational cost while preserving essential
  atomic-physics fidelity. Typical values range from 0 (neutral) to several tens for
  high-$Z$ impurities such as tungsten ($Z_{\min}$ up to $\sim 40$). The quantity
  enters ionization and recombination rate balances where the effective rate coefficient
  is averaged over the bundle. See also `ion_dominant_charge_state` for the single
  representative charge.
