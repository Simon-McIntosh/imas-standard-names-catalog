- name: parallel_normalized_wave_vector
  kind: scalar
  status: draft
  description: Dimensionless parallel component of a gyrokinetic wave vector, formed
    by multiplying the component along the local magnetic field by a reference gyroradius.
    It characterizes the fluctuation scale along the field line and is typically much
    smaller than perpendicular normalized components.
  documentation: 'The parallel normalized wave vector is the component of a fluctuation
    wave vector along the local magnetic-field direction, scaled by a reference gyroradius.
    It describes the inverse parallel length scale of a gyrokinetic mode or turbulent
    fluctuation relative to the gyroradius used for normalization.


    The normalized component is defined by projecting the wave vector onto the magnetic-field
    unit vector and multiplying by the reference gyroradius:


    $$

    k_{\parallel,\mathrm{norm}} = k_\parallel \rho_\mathrm{ref} = \left(\mathbf{k}\cdot\hat{\mathbf{b}}\right)\rho_\mathrm{ref}

    $$


    where $\mathbf{k}$ is the fluctuation wave vector, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field, $k_\parallel$ is the parallel
    wavenumber, and $\rho_\mathrm{ref}$ is the reference gyroradius, often written
    inline as $v_{\mathrm{th,ref}}/\Omega_\mathrm{ref}$.


    In gyrokinetic analysis, this quantity is computed from the phase variation of
    a mode or turbulent fluctuation along the equilibrium magnetic field. In local
    field-line treatments it is associated with variation along the extended field-line
    coordinate, while in global calculations it is obtained by projecting the full
    wave vector onto $\hat{\mathbf{b}}$.


    Gyrokinetic turbulence is usually strongly anisotropic, with $|k_\parallel \rho_\mathrm{ref}|
    \ll |k_\perp \rho_\mathrm{ref}|$. Representative absolute values for core ion-scale
    tokamak microturbulence are about $10^{-4}$-$10^{-2}$, with larger values possible
    for shorter connection lengths, high-frequency waves, or cases using a different
    reference gyroradius.


    Sign convention: Positive when the wave-vector projection onto the local magnetic-field
    direction is positive, $\mathbf{k}\cdot\hat{\mathbf{b}}>0$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_wave_vector
  - name:linear_growth_rate_of_gyrokinetic_eigenmode
  - name:frequency_of_gyrokinetic_eigenmode
