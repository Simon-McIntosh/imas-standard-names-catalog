      data_type: FLT_0D
      unit: ohm
    enhanced_context:
      description: "Plasma electrical resistance (R_plasma), defined as the volume\
        \ integral of E\xB7J divided by Ip\xB2, representing the effective resistive\
        \ impedance of the plasma column. Related to loop voltage and ohmic heating\
        \ power."
      kind: llm
