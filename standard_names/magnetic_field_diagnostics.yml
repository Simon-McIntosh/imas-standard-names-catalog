- name: poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_grid_coupling
  kind: scalar
  status: draft
  description: Poloidal magnetic field per unit current coupling from equilibrium
    grid current elements to poloidal field probe sensors, forming one column block
    of the full electromagnetic coupling matrix used in equilibrium reconstruction.
  documentation: "Each entry $M^{\\rm grid}_{ij}$ of this coupling matrix gives the\
    \ poloidal magnetic field $\\delta B_{\\rm pol}$ measured at probe $i$ per unit\
    \ current $I_j$ carried by equilibrium grid current element $j$, so that $\\delta\
    \ B_{\\rm pol,i} = \\sum_j M^{\\rm grid}_{ij} I_j$. The equilibrium grid discretizes\
    \ the poloidal cross-section into current-carrying filaments whose distribution\
    \ encodes the plasma and vessel current configuration; this coupling matrix maps\
    \ those source currents to the sensor response. It complements the analogous [plasma\
    \ coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling),\
    \ [passive coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling),\
    \ and [active coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling)\
    \ matrices, which together span all current sources entering the equilibrium reconstruction\
    \ forward model. The grid-to-probe coupling is computed analytically from the\
    \ Biot\u2013Savart law given the positions and orientations of the probe sensors\
    \ and the geometry of the grid filaments; it is fixed for a given grid topology\
    \ and does not change between plasma discharges. The analogous flux-loop quantity\
    \ is [mutual_inductance_of_flux_loop_grid_coupling](name:mutual_inductance_of_flux_loop_grid_coupling),\
    \ which maps the same grid currents to poloidal flux rather than poloidal field."
  unit: A^-1.T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling
  - name:mutual_inductance_of_flux_loop_grid_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/field_probes_grid
    dd_path: em_coupling/field_probes_grid
    status: composed
- name: poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling
  kind: scalar
  status: draft
  description: Poloidal magnetic field per unit current coupling matrix from discretized
    plasma current filaments to poloidal field probe sensors, analogous to the active,
    passive, and grid coupling matrices but sourced from the distributed plasma current
    distribution.
  documentation: "Each entry $M^{\\rm pol}_{ij}$ of this coupling matrix gives the\
    \ poloidal magnetic field $B_{\\rm pol}$ measured at probe $i$ per unit current\
    \ $I_j$ carried by plasma current filament $j$, such that $B_{\\rm pol,i} = \\\
    sum_j M^{\\rm pol}_{ij} I_j$, where $B_{\\rm pol}$ is the poloidal magnetic field\
    \ component and $I_j$ is the current in the $j$-th plasma filament. The matrix\
    \ is computed from the geometry of the plasma current discretization (typically\
    \ a set of filaments or current-carrying elements on a computational grid) and\
    \ the positions and orientations of the poloidal field probe sensors in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. Its values depend on the equilibrium configuration\
    \ and the chosen plasma discretization, and are used in equilibrium reconstruction\
    \ to form the forward model relating a trial current distribution to predicted\
    \ probe signals. Typical matrix entries are of order $10^{-7}$\u2013$10^{-5}$\
    \ T/A depending on probe\u2013plasma geometry and distance. This matrix is the\
    \ plasma-source analog of the [active coil coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling),\
    \ [passive structure coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling),\
    \ and [equilibrium grid coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_grid_coupling)\
    \ matrices, and complements the [mutual inductance of plasma to flux loop](name:mutual_inductance_of_flux_loop_plasma_coupling)\
    \ for flux-loop diagnostics."
  unit: A^-1.T
  physics_domain: magnetic_field_diagnostics
  links:
