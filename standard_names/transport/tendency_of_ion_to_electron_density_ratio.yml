name: tendency_of_ion_to_electron_density_ratio
status: draft
cocos_transformation_type: one_like
description: Time derivative of the ratio of total ion number density (summed over
  all species and charge states) to electron number density.
documentation: "The quantity $\\partial(n_i^{\\mathrm{tot}} / n_e)/\\partial t$ tracks\
  \ the temporal evolution of the ion-to-electron density ratio, where $n_i^{\\mathrm{tot}}\
  \ = \\sum_s \\sum_z n_{s,z}$ includes both thermal and non-thermal ion populations\
  \ across all species $s$ and charge states $z$, and $n_e$ is the electron number\
  \ density. In a quasi-neutral plasma the ratio satisfies $\\sum_s \\sum_z Z_{s,z}\
  \ n_{s,z} / n_e = 1$; departures from unity in $n_i^{\\mathrm{tot}}/n_e$ arise when\
  \ multiply charged impurities (e.g., tungsten $Z \\leq 74$) are present, so each\
  \ impurity ion contributes one particle count but $Z$ electrons. A non-zero tendency\
  \ signals evolving impurity content or changing ionization-state balance. Transport\
  \ solvers use this derivative as a diagnostic of charge-state evolution and effective\
  \ charge $Z_{\\mathrm{eff}}$ dynamics. Typical values of the ratio itself range\
  \ from 0.5 to 1.0 in impurity-seeded plasmas, and its time derivative is of order\
  \ $10^{-3}$\u2013$10^{0}$ s$^{-1}$ during transient impurity influx events."
