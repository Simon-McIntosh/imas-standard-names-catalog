      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: X coordinate of pinhole.
      kind: template
- name: x_coordinate_of_divertor_target
  kind: scalar
  status: active
  description: "Signed Cartesian x-coordinate locating the geometric center of a divertor\
    \ target surface in the right-handed (x, y, z) frame, with +x at toroidal angle\
    \ \u03C6 = 0."
  documentation: 'The x coordinate of a divertor target is the signed Cartesian position
    of the geometric center of its target surface. It locates that center in the right-handed
    Cartesian basis $(\hat{x}, \hat{y}, \hat{z})$, where $\hat{z}$ is vertical and
    the positive x direction is horizontal at toroidal angle $\phi=0$.


    The coordinate is defined by projection of the center position onto the Cartesian
    x unit vector:


    $$

    x_c = \mathbf{r}_c \cdot \hat{\mathbf{x}}

    $$


    where $\mathbf{r}_c$ is the position vector of the target-surface geometric center,
    $\hat{\mathbf{x}}$ is the Cartesian x unit vector, and $x_c$ is the resulting
    signed coordinate. The corresponding center location is completed by the [y coordinate
    of the divertor target](name:y_coordinate_of_divertor_target) and [z coordinate
    of the divertor target](name:z_coordinate_of_divertor_target); this quantity does
    not specify the target surface extent.


    Sign convention: Positive when the target center lies in the direction of increasing
    Cartesian x from the coordinate origin.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_divertor_target
  - name:z_coordinate_of_divertor_target
  sources:
  - dd_path: camera_ir/channel/target_surface_center/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-target_surface_center-x
    dd_documentation:
      leaf: Component along X axis
      parent_path: camera_ir/channel/target_surface_center
      parent: Position of the center of the targeted surface
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: X coordinate of target surface center.
      kind: template
- name: x_direction_unit_vector_of_camera
  kind: scalar
  status: active
  description: X-axis component of the unit vector defining the line-of-sight direction
    of a camera, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The x-component $d_x$ of the unit vector $\hat{d}$ that specifies
    the line-of-sight (viewing) direction of the camera in the right-handed Cartesian
    $(x, y, z)$ frame. Together with the [y-component](name:y_direction_unit_vector_of_camera)
    and [z-component](name:z_direction_unit_vector_of_camera), it fully determines
    the camera pointing direction as $\hat{d} = (d_x, d_y, d_z)$ with $d_x^2 + d_y^2
    + d_z^2 = 1$.


    This quantity is geometrically distinct from the [x_image_up_unit_vector_of_camera](name:x_image_up_unit_vector_of_camera),
    which encodes the image-plane vertical orientation rather than the viewing axis.


    Sign convention: Positive when the camera''s line-of-sight direction has a component
    in the $+x$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:y_direction_unit_vector_of_camera
  sources:
  - dd_path: camera_ir/channel/camera/direction/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-direction-x
    dd_documentation:
      leaf: Component along X axis
      parent_path: camera_ir/channel/camera/direction
      parent: Line of sight direction unit vector
