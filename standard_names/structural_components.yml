- name: side_wall_thickness_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Perpendicular distance between the two toroidal bounding surfaces of
    a breeding blanket module side wall. This non-negative geometric scalar characterizes
    the wall material thickness in the toroidal direction.
  documentation: 'The side wall thickness $t_\mathrm{sw}$ is defined as the perpendicular
    distance between the inner and outer toroidal faces of a single side wall of a
    breeding blanket module, measured normal to the wall surface.


    $$t_\mathrm{sw} = \lvert x_\mathrm{outer} - x_\mathrm{inner} \rvert \geq 0$$


    where $x_\mathrm{outer}$ and $x_\mathrm{inner}$ denote positions of the two toroidal
    bounding surfaces along the local wall-normal direction. By definition, $t_\mathrm{sw}
    \geq 0$.


    Typical values range from $0.01$ to $0.05\,\text{m}$ depending on the blanket
    concept and structural material selection.


    This dimension complements the [top cap thickness](name:top_cap_thickness_of_breeding_blanket_module)
    and [bottom cap thickness](name:bottom_cap_thickness_of_breeding_blanket_module)
    (poloidal enclosure walls) and the [layer midplane thickness](name:layer_midplane_thickness_of_breeding_blanket_module)
    (radial internal layer dimensions) to form the complete geometric envelope of
    the module box. Together with the [first wall thickness](name:first_wall_thickness_of_breeding_blanket_module),
    these parameters define the structural boundary conditions for neutronic and thermal-hydraulic
    analyzes.


    Recorded in meters.'
  unit: m
  physics_domain: structural_components
  links:
  - name:top_cap_thickness
  - name:bottom_cap_thickness
  - name:layer_midplane_thickness
  - name:tritium_breeding_ratio
  - name:blanket_neutron_energy_multiplication
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/side_wall_thickness
    dd_path: breeding_blanket/module/side_wall_thickness
    status: composed
- name: top_cap_thickness
  kind: scalar
  status: draft
  description: Poloidal thickness of the top cap of a breeding blanket module, defined
    as the non-negative distance between the inner and outer bounding surfaces of
    the cap along the poloidal direction.
  documentation: "The top cap poloidal thickness $d_{\\mathrm{top}}$ is the perpendicular\
    \ distance between the two bounding surfaces of the end-plate that closes the\
    \ upper poloidal face of a breeding blanket module. Geometrically, it is the solid-body\
    \ dimension\n\n$$d_{\\mathrm{top}} = \\lvert z_{\\mathrm{outer}} - z_{\\mathrm{inner}}\
    \ \\rvert$$\n\nwhere $z_{\\mathrm{outer}}$ and $z_{\\mathrm{inner}}$ are the axial\
    \ ($Z$) coordinates, in meters, of the outer and inner bounding planes of the\
    \ cap in the right-handed cylindrical $(R, \\phi, Z)$ frame, with $Z$ measured\
    \ vertically along the machine symmetry axis. The absolute value ensures a non-negative\
    \ result regardless of surface labeling. For modules near the top of the vacuum\
    \ vessel, the poloidal direction is approximately aligned with $+\\hat{Z}$; for\
    \ off-midplane modules at other poloidal positions, the relevant direction is\
    \ the local surface normal of the cap, which in simplified planar geometry reduces\
    \ to the perpendicular distance between parallel bounding planes.\n\nTypical values\
    \ in conceptual breeding blanket designs range from 0.01 m to 0.05 m (a few millimeters\
    \ to several centimeters), reflecting the trade-off between structural integrity\
    \ under neutron and thermal loads, neutron shielding, coolant manifold space,\
    \ and tritium breeding volume. Together with the complementary [bottom_cap_thickness](name:bottom_cap_thickness)\
    \ and [side_wall_thickness](name:side_wall_thickness), this quantity fully characterizes\
    \ the outer structural shell of the module. It enters neutronics transport calculations\
    \ \u2014 a thicker cap reduces neutron leakage from the upper face but displaces\
    \ fertile breeding material \u2014 and thermal-hydraulic models evaluating conductive\
    \ heat flow through the cap. The value is non-negative by definition and is obtained\
    \ from engineering design specifications or CAD models of the blanket module."
  unit: m
  physics_domain: structural_components
  links:
  - name:bottom_cap_thickness
  - name:side_wall_thickness
  - name:layer_midplane_thickness
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/top_cap_thickness
    dd_path: breeding_blanket/module/top_cap_thickness
    status: composed
- name: tritium_breeding_ratio
  kind: scalar
  status: draft
  description: Number of tritium atoms produced per fusion neutron absorbed in the
    breeding blanket, the primary figure of merit for fuel self-sufficiency in a deuterium-tritium
    fusion reactor.
  documentation: "The tritium breeding ratio (TBR) quantifies the neutron economy\
    \ of the breeding blanket by measuring how many tritium atoms are generated per\
    \ fusion neutron entering the blanket assembly. It is defined as $\\mathrm{TBR}\
    \ = N_T / N_n$, where $N_T$ is the number of tritium atoms produced via neutron\
    \ reactions (principally $^6\\mathrm{Li}(n,\\alpha)T$ and $^7\\mathrm{Li}(n,n'\\\
    alpha)T$) and $N_n$ is the number of incident fusion neutrons. Fuel self-sufficiency\
    \ requires TBR $> 1$ to account for tritium decay losses, permeation, and processing\
    \ inefficiencies; engineering target values are generally TBR $\\geq 1.05$\u2013\
    $1.15$. The TBR is evaluated over the full blanket assembly and depends sensitively\
    \ on lithium-6 enrichment fraction, blanket geometry (characterized by parameters\
    \ such as [layer_midplane_thickness](name:layer_midplane_thickness) and [side_wall_thickness](name:side_wall_thickness)),\
    \ neutron multiplier content, and neutron energy spectrum. It is computed via\
    \ neutron transport codes (e.g., Monte Carlo methods) and is closely coupled to\
    \ the [blanket_neutron_energy_multiplication](name:blanket_neutron_energy_multiplication),\
    \ which captures the concurrent nuclear energy gain. Experimental validation is\
    \ pursued through activation measurements and tritium recovery accounting during\
    \ integral blanket tests.\n\nSign convention: Positive when the number of tritium\
    \ atoms produced exceeds zero, i.e. for any blanket with net tritium generation."
  unit: '1'
  physics_domain: structural_components
  links:
  - name:layer_midplane_thickness
  - name:side_wall_thickness
  - name:blanket_neutron_energy_multiplication
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/time_slice/tritium_breeding_ratio
    dd_path: breeding_blanket/module/time_slice/tritium_breeding_ratio
    status: composed
  - id: dd:breeding_blanket/time_slice/tritium_breeding_ratio
    dd_path: breeding_blanket/time_slice/tritium_breeding_ratio
    status: composed
- name: vertical_coordinate_of_annular_inner_outline_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of a point on the inner outline contour of
    an annular structural unit, defining the axial height of the inner boundary cross-section
    in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "This quantity specifies the $Z$ coordinate of a discrete point on\
    \ the inner outline contour of an annular structural component, such as an annular\
    \ cryostat vessel or thermal shield unit. The inner outline defines the radially\
    \ inward-facing boundary of the annular cross-section, and a sequence of such\
    \ $Z$ values \u2014 paired with the corresponding major-radius values from [major_radius_of_annular_inner_outline_point](name:major_radius_of_annular_inner_outline_point)\
    \ \u2014 traces the complete inner contour in the poloidal $(R, Z)$ plane. Together\
    \ with [vertical_coordinate_of_annular_outer_outline_point](name:vertical_coordinate_of_annular_outer_outline_point),\
    \ which gives the equivalent $Z$ coordinate on the outer boundary, this quantity\
    \ fully characterizes the axial extent of the annular wall cross-section. The\
    \ [vertical_coordinate_of_annular_centerline](name:vertical_coordinate_of_annular_centerline)\
    \ provides the corresponding $Z$ coordinate at the mid-surface of the same annular\
    \ unit. Typical values span the axial height range of the structural component,\
    \ from a few tenths of a meter to several meters in large tokamak devices. These\
    \ coordinates are derived from engineering design drawings and verified against\
    \ as-built survey measurements.\n\nSign convention: Positive when $Z$ is above\
    \ the machine midplane, in the direction of increasing vertical height."
  unit: m
  physics_domain: structural_components
  links:
  - name:major_radius_of_annular_inner_outline_point
  - name:vertical_coordinate_of_annular_outer_outline_point
  - name:vertical_coordinate_of_annular_centerline
