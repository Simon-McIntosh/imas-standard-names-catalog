- name: perturbed_toroidal_magnetic_vector_potential_real_part
  kind: complex
  status: draft
  description: Real part of the toroidal component of the perturbed magnetic vector
    potential $\delta\mathbf{A}$ for a linear MHD toroidal mode, applicable in the
    vacuum region surrounding the plasma.
  documentation: The perturbed magnetic vector potential $\delta\mathbf{A}$ satisfies
    $\delta\mathbf{B} = \nabla \times \delta\mathbf{A}$, where $\delta\mathbf{B}$
    is the perturbed magnetic field associated with a linear MHD eigenmode. The toroidal
    component $\delta A_\phi$ is the projection of $\delta\mathbf{A}$ onto the $\hat{\phi}$
    direction in the right-handed cylindrical $(R, \phi, Z)$ frame, and this standard
    name gives its real part when the complex mode amplitude is decomposed as $\delta
    A_\phi = \mathrm{Re}(\delta A_\phi) + i\,\mathrm{Im}(\delta A_\phi)$. In linear
    MHD stability analyzes, the fields are expanded as $\sim e^{i(n\phi - \omega t)}$
    for toroidal mode number $n$ and complex eigenfrequency $\omega$; the real and
    imaginary parts together encode both the amplitude and phase of the perturbation.
    Typical magnitudes in stability calculations for tokamak eigenmodes range from
    $10^{-6}$ to $10^{-2}$ m$\cdot$T depending on normalization convention. The direct
    complex counterpart is [perturbed_toroidal_magnetic_vector_potential_imaginary_part](name:perturbed_toroidal_magnetic_vector_potential_imaginary_part),
    while the radial and poloidal real-part components are [perturbed_radial_magnetic_vector_potential_real_part](name:perturbed_radial_magnetic_vector_potential_real_part)
    and [perturbed_poloidal_magnetic_vector_potential_real_part](name:perturbed_poloidal_magnetic_vector_potential_real_part).
  unit: T.m
  physics_domain: magnetohydrodynamics
  links:
