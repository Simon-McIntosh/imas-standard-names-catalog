- name: toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current
  kind: scalar
  status: draft
  description: Toroidal component of the torque density acting on counter-passing
    particles due to the Lorentz force from a radial current, defined as R times the
    toroidal force density from the radial-current-magnetic-field interaction integrated
    over the counter-passing portion of phase space and flux-surface averaged.
  documentation: 'Counter-passing particles occupy untrapped orbits whose guiding-center
    parallel velocity is directed opposite to the direction of increasing toroidal
    angle $\phi$. When a radial current density $J_r$ flows across flux surfaces,
    the Lorentz interaction $\mathbf{J}_r \times \mathbf{B}$ generates a toroidal
    body force per unit volume. The toroidal torque density is obtained by multiplying
    this toroidal force density by the major radius $R$ (the moment arm for toroidal
    rotation) and flux-surface averaging, then restricting the kinetic distribution
    integral to the counter-passing population:


    $$\tau_\phi^\mathrm{ctr} = \left\langle R\,(\mathbf{J}_r^\mathrm{ctr} \times \mathbf{B})\cdot\hat{\phi}
    \right\rangle_{\mathrm{FS}}$$


    where $\langle\cdots\rangle_\mathrm{FS}$ denotes the flux-surface average, $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $\mathbf{J}_r^\mathrm{ctr}$ is the radial
    current density carried by the counter-passing particle class. Counter-passing
    particles are distinguished from co-passing particles by having guiding-center
    parallel velocity antiparallel to the plasma current direction. The passing-particle
    contribution to the radial-current torque is decomposed as:


    $$\tau_\phi^\mathrm{pass} = \tau_\phi^\mathrm{co} + \tau_\phi^\mathrm{ctr}$$


    and the total radial-current torque density (see `name:toroidal_component_of_torque_density_due_to_radial_current`)
    sums contributions from co-passing (see `name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current`),
    counter-passing (this quantity), and trapped (see `name:toroidal_component_of_trapped_particle_torque_density_due_to_radial_current`)
    populations:


    $$\tau_\phi^\mathrm{total} = \tau_\phi^\mathrm{co} + \tau_\phi^\mathrm{ctr} +
    \tau_\phi^\mathrm{trap}$$


    This decomposition is physically motivated because co-passing, counter-passing,
    and trapped particles respond differently to non-axisymmetric magnetic perturbations,
    giving rise to orbit-class-selective angular momentum exchange central to neoclassical
    toroidal viscosity (NTV) and non-ambipolar radial transport. The quantity is evaluated
    from drift-kinetic or gyrokinetic codes that resolve the passing-trapped boundary
    in phase space and compute the radial current moment separately for each orbit
    class. Typical magnitudes in neutral-beam-heated tokamaks range from $10^{-3}$
    to $10^{0}$ N m$^{-2}$, depending on beam power, plasma density, and the amplitude
    of non-axisymmetric field perturbations.


    Sign convention: Positive when the torque acts in the direction of increasing
    toroidal angle $\phi$.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_trapped_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_torque_density_due_to_radial_current
  constraints: []
