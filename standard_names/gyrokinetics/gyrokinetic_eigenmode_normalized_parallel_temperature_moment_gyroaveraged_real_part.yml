name: gyrokinetic_eigenmode_normalized_parallel_temperature_moment_gyroaveraged_real_part
description: Real part of the gyroaveraged normalized parallel temperature moment
  of the perturbed distribution for a gyrokinetic eigenmode in the rotating frame.
documentation: This quantity is the real component of the gyroaveraged parallel temperature
  moment, defined as $\mathrm{Re}\,\langle (v_\parallel^2 - T_{\parallel,0}/m_s)\,
  J_0(k_\perp \rho_s)\, \delta \hat{f}_s \rangle_v$, where $v_\parallel$ is the parallel
  velocity, $T_{\parallel,0}$ is the equilibrium parallel temperature, $m_s$ is the
  species mass, $J_0$ is the zeroth-order Bessel function of the first kind implementing
  the gyroaveraging at perpendicular wavenumber $k_\perp$ and Larmor radius $\rho_s$,
  and $\delta \hat{f}_s$ is the normalized perturbed distribution. The moment is normalized
  to code reference quantities so the result is dimensionless. It characterizes the
  parallel temperature fluctuation associated with a given eigenmode, which is essential
  for diagnosing anisotropic heat transport and the energy partition between parallel
  and perpendicular channels in gyrokinetic turbulence. Gyrokinetic codes (GENE, CGYRO,
  GS2) output this moment alongside the perpendicular temperature moment to close
  the perturbed energy balance. The imaginary part is stored in a companion field.
kind: complex_part
unit: '1'
