  kind: scalar
  status: active
  description: Instantaneous injection rate of ethylene (C2H4) gas into the plasma
    vessel, expressed as equivalent electrons per second with each molecule counted
    as 16 equivalent electrons.
  documentation: 'Ethylene (C2H4) is a two-carbon, four-hydrogen molecule used as
    a gaseous source of both carbon and hydrogen in plasma fueling and wall-conditioning
    experiments. The source rate is the instantaneous equivalent-electron delivery
    rate to the plasma vessel, where each molecule is assigned 16 equivalent electrons
    based on the total atomic electron inventory of the molecular formula.


    The equivalent-electron rate $\dot{N}_\mathrm{eq}$ relates to the molecular injection
    rate $\dot{N}_\mathrm{C_2H_4}$ by


    $$

    \dot{N}_\mathrm{eq} = 16\,\dot{N}_\mathrm{C_2H_4}

    $$


    where the factor $16 = 2Z_\mathrm{C} + 4Z_\mathrm{H}$, with $Z_\mathrm{C} = 6$
    the carbon atomic number and $Z_\mathrm{H} = 1$ the hydrogen atomic number.


    The injection rate is inferred from valve conductance calibrations and upstream
    pressure measurements. Its time-integral gives the [accumulated ethylene count](name:accumulated_ethylene_count),
    which tracks the total equivalent-electron inventory delivered since plasma breakdown.
    Related molecular and atomic injection rates include [silane_source_rate](name:silane_source_rate)
    for SiH4 and [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection)
    for atomic hydrogen delivery.


    Sign convention: Positive when ethylene gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ethylene_count
  - name:silane_source_rate
  - name:hydrogen_source_rate_due_to_gas_injection
