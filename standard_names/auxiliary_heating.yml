        antenna strap element. Defines the vertical dimension of the rectangular strap
        geometry used in ion cyclotron antenna modelling.
      kind: llm
- name: length_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Curvilinear distance accumulated along a beam-tracing ray from a designated
    reference point to a point on its vacuum or plasma trajectory.
  documentation: 'The quantity is the geometric distance accumulated along a beam-tracing
    ray from its designated reference point to a point on the ray. It follows the
    ray trajectory and therefore differs from the straight-line separation of the
    endpoints.


    For a ray position $\mathbf{r}(\lambda)$ parameterized by a monotonically increasing
    path parameter $\lambda$, the arc length is


    $$

    s(\lambda_0,\lambda_1)=\int_{\lambda_0}^{\lambda_1}\left\lVert\frac{d\mathbf{r}}{d\lambda}\right\rVert\,d\lambda

    $$


    where $\lambda_0$ identifies the reference point, $\lambda_1$ identifies the endpoint,
    $\mathbf{r}$ is the ray position, and $\lVert\cdot\rVert$ is the Euclidean norm.
    The resulting length is non-negative and may include segments in both vacuum and
    plasma. The electron-cyclotron-specific counterpart [length of electron-cyclotron
    beam](name:length_of_electron_cyclotron_beam) uses the same geometric path-length
    concept.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:length_of_electron_cyclotron_beam
  sources:
  - dd_path: waves/coherent_wave/beam_tracing/beam/length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-length
    dd_documentation:
