- name: argon_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of argon ions evaluated at the magnetic axis
    is the local argon-ion count per physical volume at that location, summed over
    all argon ionic charge states.
  documentation: 'Particle number density of argon ions evaluated at the magnetic
    axis is the local argon-ion count per physical volume at that location, summed
    over all argon ionic charge states. It represents argon ions specifically, rather
    than electrons, neutrals, or another plasma population.


    The defining relation is


    $$

    n_{\mathrm{Ar},\mathrm{axis}} = \left.\frac{dN_{\mathrm{Ar}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{Ar},\mathrm{axis}}$ is the argon-ion number density at the magnetic
    axis, $N_{\mathrm{Ar}}$ is the number of argon ions summed over all ionic charge
    states, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the gradient of the poloidal magnetic flux
    vanishes. It applies to the complete ionic argon population at that location and
    is charge-state summed; neutral argon is excluded. It is neither a flux-surface
    or volume integral nor a density for another species.


    This is the argon-specific realization of [density at the magnetic axis](name:density_at_magnetic_axis),
    with the population fixed to argon ions and the aggregation fixed to a sum over
    ionic charge states. The corresponding species specialization for oxygen is [oxygen
    density at the magnetic axis](name:oxygen_density_at_magnetic_axis), which uses
    the same magnetic-axis locus but a different ion population.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:oxygen_density_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/argon/value
    version: 4.1.0
- name: atomic_count
  kind: scalar
  status: active
  description: Stoichiometric multiplicity of a selected element within the chemical
    formula of an atomic or molecular species.
  documentation: 'This quantity is the number of atoms belonging to a selected element
    in one atomic or molecular species, as specified by its composition. It is a composition
    property rather than a particle population or field quantity.


    For an atomic species, the count is one for its constituent element; for a molecular
    species, it is the element''s stoichiometric coefficient in the molecular formula.
    The count applies to the selected species composition and is not a number density,
    abundance, or present/absent flag. It is not summed over particles or charge states,
    and changing the ionization state does not change the elemental atom count.


    The selected element is identified independently by its [atomic number](name:atomic_number),
    while this quantity gives the number of atoms of that element in the species.
    The same composition count can therefore be used for neutral or ionized forms
    of a species and for elemental constituents of reaction participants.'
