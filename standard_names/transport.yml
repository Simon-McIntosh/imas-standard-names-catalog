    status: composed
- name: trapped_fast_particle_density
  kind: scalar
  status: draft
  description: Number density of fast (suprathermal) particles on trapped orbits,
    representing only the fraction of the non-thermal distribution whose velocity-space
    pitch angle places them in the magnetically trapped orbit class.
  documentation: 'Trapped fast particles occupy velocity-space regions where $v_\parallel
    / v < \sqrt{1 - B_{\min}/B_{\max}}$, with $v_\parallel$ the velocity component
    parallel to the local magnetic field $\mathbf{B}$, $B_{\min}$ and $B_{\max}$ the
    minimum and maximum field strengths along the field line. These particles execute
    banana orbits rather than passing orbits, and their density $n_{\mathrm{trap,fast}}$
    is obtained by integrating the fast-particle distribution function $f(\mathbf{r},
    \mathbf{v})$ over the trapped portion of velocity space: $n_{\mathrm{trap,fast}}
    = \int_{\mathrm{trapped}} f\, d^3v$. The trapped fast population is particularly
    relevant to neoclassical transport, bootstrap current generation, and the resonant
    drive of energetic-particle modes such as toroidal Alfven eigenmodes (TAEs). Typical
    values range from $10^{16}$ to $10^{19}$ m$^{-3}$ depending on plasma scenario
    and neutral beam or radio-frequency heating power. The trapped fraction is computed
    from kinetic distribution solvers (e.g., Monte Carlo or Fokker-Planck codes) applied
    to neutral beam injection or ICRH fast-ion sources. It complements [co-passing
    fast particle density](name:co_passing_fast_particle_density) and [counter-passing
    fast particle density](name:counter_passing_fast_particle_density), which together
    with this quantity partition [fast_particle_density](name:fast_particle_density)
    by orbit class. The corresponding all-energy (thermal plus non-thermal) trapped
    population is described by [trapped_particle_density](name:trapped_particle_density).


    Sign convention: Positive when the number density of trapped fast particles is
    greater than zero, i.e. when the trapped fast-particle population is present in
    the plasma.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:co_passing_fast_particle_density
  - name:counter_passing_fast_particle_density
  - name:fast_particle_density
  - name:trapped_particle_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/density_fast
    dd_path: distributions/distribution/profiles_1d/trapped/density_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/density_fast
    dd_path: distributions/distribution/profiles_2d/trapped/density_fast
    status: composed
- name: trapped_particle_density
  kind: scalar
  status: draft
  description: "Total number density of particles \u2014 thermal plus non-thermal\
    \ \u2014 whose parallel velocity is small enough that the magnetic mirror force\
    \ confines them to a bounded poloidal arc rather than allowing full poloidal transit.\
    \ Equivalently, these are particles with pitch angle exceeding the local trapping\
    \ criterion defined by the magnetic field variation on a flux surface."
  documentation: "## Trapped Particle Density\n\nThe trapped particle density $n_\\\
    mathrm{trap}$ is the total number of trapped-orbit particles (thermal and non-thermal)\
    \ per unit volume on a given flux surface. A particle is classified as trapped\
    \ when its pitch angle $\\lambda = v_\\parallel / v$ satisfies the local mirror\
    \ trapping condition\n\n$$|v_\\parallel| < v \\sqrt{1 - B_\\mathrm{min}/B}$$\n\
    \nwhere $B$ is the local magnetic field magnitude and $B_\\mathrm{min}$ is the\
    \ minimum field on the same flux surface. Such particles undergo bounce oscillations\
    \ between mirror points and do not complete full poloidal circuits.\n\nThe quantity\
    \ is resolved on flux surfaces and stored as a function of the minor-radial coordinate\
    \ (typically $\\rho_\\mathrm{tor,norm}$, the normalized toroidal flux radius)\
    \ and optionally on a two-dimensional $(R, Z)$ poloidal grid in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame where $R$ is the major radius, $\\phi$ is\
    \ the toroidal angle increasing counter-clockwise when viewed from above, and\
    \ $Z$ is the vertical height. It is NOT a bounce-averaged quantity; it represents\
    \ the local particle density integrated over the trapped portion of velocity space\
    \ at each spatial point.\n\nThe orbit-class partition identity reads\n\n$$n_\\\
    mathrm{total} = n_\\mathrm{trap} + n_\\mathrm{co} + n_\\mathrm{counter}$$\n\n\
    where $n_\\mathrm{co}$ and $n_\\mathrm{counter}$ are the co-passing and counter-passing\
    \ densities respectively.\n\n**Typical values:** In a deuterium plasma with $n_e\
    \ \\sim 10^{19}\\,\\mathrm{m}^{-3}$ and inverse aspect ratio $\\epsilon = r/R\
    \ \\sim 0.1$\u2013$0.3$, the trapped fraction $f_t \\approx 1.46\\sqrt{\\epsilon}\
    \ - 0.46\\epsilon$ implies $n_\\mathrm{trap} \\sim (0.3$\u2013$0.6)\\,n_\\mathrm{total}$.\n\
    \n**IMAS/DD source paths:**\n- `distributions/distribution/profiles_1d/trapped/density`\
    \ (m$^{-3}$, thermal+non-thermal)\n- `distributions/distribution/profiles_2d/trapped/density`\
    \ (m$^{-3}$, thermal+non-thermal)\n\n**Physical context:** Trapped particles drive\
    \ neoclassical transport through banana-regime diffusion and are responsible for\
    \ bootstrap current generation. Their density appears directly in neoclassical\
    \ transport coefficients and in gyrokinetic stability calculations for drift-wave\
    \ and kinetic-ballooning instabilities."
  unit: m^-3
  physics_domain: transport
  links:
  - name:trapped_fast_particle_density
  - name:co_passing_particle_density
  - name:counter_passing_particle_density
  - name:particle_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/density
    dd_path: distributions/distribution/profiles_1d/trapped/density
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/density
    dd_path: distributions/distribution/profiles_2d/trapped/density
    status: composed
- name: vertical_component_of_center_of_mass_velocity
  kind: scalar
  status: draft
  description: Projection of the mass-weighted mean fluid velocity of the plasma mixture
    onto the vertical Z-axis of the right-handed cylindrical (R, phi, Z) frame, representing
    the net upward or downward bulk motion of all species combined.
  documentation: 'The vertical component of the center-of-mass velocity is defined
    as $v_{Z,\mathrm{cm}} = \hat{Z} \cdot \mathbf{v}_{\mathrm{cm}}$, where the center-of-mass
    velocity $\mathbf{v}_{\mathrm{cm}} = \sum_s m_s n_s \mathbf{v}_s / \sum_s m_s
    n_s$ is the mass-density-weighted mean velocity summed over all species $s$ (electrons,
    ions, neutrals), with $m_s$ the species mass, $n_s$ the number density, and $\mathbf{v}_s$
    the species fluid velocity. This quantity is the $Z$-component of [center_of_mass_velocity](name:center_of_mass_velocity)
    and differs from individual-species vertical velocities such as [vertical_component_of_ion_velocity](name:vertical_component_of_ion_velocity)
    or [vertical_component_of_neutral_velocity](name:vertical_component_of_neutral_velocity)
    in that it accounts for the full momentum budget of the mixture rather than a
    single species. It appears in the continuity and total-momentum equations of multi-fluid
    transport models and is relevant to impurity transport, divertor target loads,
    and vertical stability analysis. Typical magnitudes range from a few m/s in quiescent
    edge plasmas to tens of km/s during disruptions or ELMs. It is computed from multi-fluid
    simulation codes or inferred by combining charge-exchange recombination spectroscopy
    data for multiple ion species with electron measurements weighted by their respective
    mass densities.


    Sign convention: Positive when $v_{Z,\mathrm{cm}}$ points in the direction of
    increasing $Z$ (upward, away from the divertor in standard lower-single-null configurations).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:center_of_mass_velocity
  - name:vertical_component_of_ion_velocity
  - name:vertical_component_of_neutral_velocity
  constraints: []
  arguments:
  - name: center_of_mass_velocity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/velocity_mass_centre/z
    dd_path: plasma_profiles/ggd/velocity_mass_centre/z
    status: composed
- name: vertical_component_of_e_cross_b_drift_velocity
  kind: scalar
  status: draft
  description: "Vertical Z-component of the E\xD7B drift velocity for charged plasma\
    \ species in the right-handed cylindrical (R, \u03C6, Z) frame, where Z is the\
    \ vertical height axis. The drift arises from crossed electric and magnetic fields\
    \ and acts on ions and electrons but not on neutral particles. One scalar value\
    \ is stored per grid-subset element in the GGD representation."
  documentation: "The E\xD7B drift velocity is given by\n\n$$\\mathbf{v}_{E\\times\
    \ B} = \\frac{\\mathbf{E}\\times\\mathbf{B}}{|B|^2}$$\n\nwhere $\\mathbf{E}$ is\
    \ the electric field vector and $\\mathbf{B}$ is the magnetic field vector. This\
    \ standard name records the projection of that velocity onto the vertical $\\\
    hat{Z}$ axis of the right-handed cylindrical $(R, \\phi, Z)$ frame, i.e.\n\n$$v_{E\\\
    times B,Z} = \\frac{(\\mathbf{E}\\times\\mathbf{B})\\cdot\\hat{Z}}{|B|^2} = \\\
    frac{E_R B_\\phi - E_\\phi B_R}{|B|^2}$$\n\nwhere $E_R$, $E_\\phi$ are the radial\
    \ and toroidal components of the electric field and $B_R$, $B_\\phi$ are the corresponding\
    \ magnetic field components in the $(R, \\phi, Z)$ basis.\n\nThis drift acts on\
    \ all charged species (ions and electrons) but does not apply to neutral particles,\
    \ which are unaffected by electromagnetic forces. Neutral velocity components\
    \ along $Z$ are separately described by convective or pressure-driven transport.\n\
    \nTypical magnitudes in tokamak edge and scrape-off-layer regions range from $10^2$\
    \ to $10^4$ m/s, depending on the local electric field strength and magnetic field\
    \ magnitude.\n\nIn the IMAS data dictionary this quantity is stored at paths such\
    \ as `plasma_profiles/ggd/ion/state/velocity_exb/z` and `plasma_profiles/ggd/neutral/state/velocity_exb/z`,\
    \ where each element corresponds to one cell or node in the associated GGD grid\
    \ subset (one scalar value per element).\n\nSign convention: Positive when the\
    \ E\xD7B drift points in the direction of increasing $Z$ (upward, i.e., away from\
    \ the midplane toward the top of the vessel)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:vertical_component_of_ion_velocity
  - name:vertical_component_of_electron_velocity
  - name:vertical_component_of_ion_diamagnetic_drift_velocity
  - name:e_cross_b_drift_velocity
  constraints: []
  arguments:
  - name: e_cross_b_drift_velocity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
