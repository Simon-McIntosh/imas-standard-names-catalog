- name: major_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Major radius of a toroidal-field-coil conductor outline point is its
    radial distance from the toroidal symmetry axis in the right-handed cylindrical
    (R, phi, Z) frame. It is an absolute non-negative coordinate, not a local radial
    offset.
  documentation: 'Major radius of a toroidal-field-coil conductor outline point is
    the absolute radial coordinate $R$ of that point, measured from the toroidal symmetry
    axis. In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. This quantity describes
    where the conductor outline lies radially and is distinct from a local construction
    offset used to generate the outline.


    For a point with horizontal Cartesian position $(x,y)$ in the right-handed Cartesian
    $(x,y,z)$ frame with $z=Z$, the major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$ is the major radius in meters, and $x$ and $y$ are horizontal distances
    in meters from the toroidal symmetry axis. By definition $R \ge 0$; negative values
    are not physical. If an outline point is specified by a local radial offset $\Delta
    R_i$ from a reference radius $R_\mathrm{ref}$, the absolute coordinate is $R_i
    = R_\mathrm{ref} + \Delta R_i$, with $R_i$, $R_\mathrm{ref}$, and $\Delta R_i$
    all in meters.


    In practice, this coordinate is obtained from engineering geometry, survey data,
    or electromagnetic-model geometry by transforming each conductor outline point
    into the right-handed cylindrical $(R, \phi, Z)$ frame and reading its $R$ value.
    It uses the same radial-coordinate concept as [major_radius_of_coil_conductor_element](name:major_radius_of_coil_conductor_element),
    and is analogous to the poloidal-field-coil outline coordinate [radial_outline_of_poloidal_field_coil](name:radial_outline_of_poloidal_field_coil).
    The transverse size of the toroidal-field-coil conductor is instead characterized
    by quantities such as [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil).


    Typical values are set by the scale of the device rather than by a universal material
    property. For tokamak toroidal-field-coil systems, major radii are commonly of
    order 1-10 m, with compact devices below this range and reactor-scale designs
    above it; variations between nearby outline points are usually much smaller than
    the absolute major radius.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/delta_r
    dd_path: tf/coil/conductor/cross_section/delta_r
    status: composed
- name: normal_coordinate_of_correction_coil
  kind: scalar
  status: draft
  description: "Coordinate of the correction-coil conductor cross-section outline\
    \ vertices along the normal axis of the local Frenet\u2013Serret frame."
  documentation: "The normal coordinate locates each vertex of the polygonal outline\
    \ bounding a correction-coil conductor cross-section along the principal normal\
    \ basis vector $\\hat{n}$ of the Frenet\u2013Serret moving frame. In that frame,\
    \ $\\hat{t}$ is the unit tangent along the conductor centerline, $\\hat{n}$ points\
    \ toward the instantaneous center of curvature, and $\\hat{b} = \\hat{t} \\times\
    \ \\hat{n}$ is the binormal. Paired with the complementary [binormal coordinate](name:binormal_coordinate_of_correction_coil),\
    \ the two coordinates fully specify each outline vertex in the plane perpendicular\
    \ to the centerline.\n\nFor an outline vertex at position $\\mathbf{r}$ relative\
    \ to the centerline reference point $\\mathbf{r}_0$, the normal coordinate is:\n\
    \n$$\nn = (\\mathbf{r} - \\mathbf{r}_0) \\cdot \\hat{n}\n$$\n\nwhere $\\hat{n}$\
    \ is the Frenet\u2013Serret principal normal unit vector at the corresponding\
    \ centerline location.\n\nThe outline vertices are defined from engineering drawings\
    \ or CAD models of the correction-coil winding pack. The closed polygon formed\
    \ by the normal and binormal vertex pairs encloses the [cross-sectional area](name:area_of_correction_coil)\
    \ of the conductor. The analogous quantity for toroidal field coils is [normal_coordinate_of_toroidal_field_coil](name:normal_coordinate_of_toroidal_field_coil).\n\
    \nSign convention: Positive when the vertex displacement is in the direction of\
    \ the principal normal $\\hat{n}$, pointing toward the center of curvature of\
    \ the conductor centerline."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_correction_coil
  - name:area_of_correction_coil
  - name:normal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    status: composed
- name: normal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate along the normal axis of the local Frenet-Serret frame for
    a toroidal field coil conductor cross-section, measuring each outline vertex's
    displacement perpendicular to both the conductor centerline and the binormal direction.
  documentation: 'The normal coordinate specifies the position of each vertex of the
    toroidal field coil conductor cross-section outline polygon along the principal
    normal axis $\hat{N}$ of the local Frenet-Serret frame. Together with the [binormal
    coordinate](name:binormal_coordinate_of_toroidal_field_coil), it fully describes
    the 2D polygonal shape of the conductor cross-section in the plane perpendicular
    to the conductor centerline.


    At any point along the conductor path, the Frenet-Serret frame is defined by the
    unit tangent $\hat{T}$ (along the centerline), the principal normal $\hat{N}$
    (perpendicular to $\hat{T}$ in the plane of curvature), and the binormal $\hat{B}
    = \hat{T} \times \hat{N}$. The normal coordinate of an outline vertex is:


    $$

    s_N = \mathbf{r}_v \cdot \hat{N}

    $$


    where $\mathbf{r}_v$ is the displacement vector from the local centerline point
    to the vertex in meters, and $\hat{N}$ is the dimensionless unit normal vector.


    The complete set of normal and binormal coordinate pairs for all outline vertices
    defines the conductor cross-section polygon, which determines conductor area,
    current density distribution, and electromagnetic force calculations on the coil.
    The analogous quantity for non-axisymmetric correction coils is [normal_coordinate_of_correction_coil](name:normal_coordinate_of_correction_coil).


    Typical TF coil conductor cross-sections in large tokamaks span a few centimeters
    to tens of centimeters, placing vertex coordinates in the range of roughly $-0.1$
    to $0.1$ m relative to the conductor centerline.


    Sign convention: Positive when the vertex displacement is in the direction of
    the Frenet-Serret normal vector $\hat{N}$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/normal
    dd_path: tf/coil/conductor/cross_section/outline/normal
    status: composed
- name: outer_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Non-negative radial distance from the toroidal symmetry axis to the
    outer boundary of an annular iron-core segment. Together with the inner radius,
    it fixes the radial extent of the hollow circular cross section.
  documentation: 'The outer radius of an iron-core segment is the non-negative major-radius
    distance from the toroidal symmetry axis to the outer boundary of an annular iron
    region. It is expressed in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    Together with [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment),
    it defines the radial span of the annular segment used to represent the iron transformer
    core.


    For an ideal annular segment, the outer radius is the largest major-radius coordinate
    occupied by the segment material:


    $$

    R_\mathrm{out} = \max_{\mathbf{x} \in \Omega_\mathrm{seg}} R(\mathbf{x})

    $$


    where $\Omega_\mathrm{seg}$ is the material region of the annular iron-core segment
    and $R(\mathbf{x})$ is the major-radius coordinate of point $\mathbf{x}$. The
    radial wall thickness is $R_\mathrm{out} - R_\mathrm{in}$, with $R_\mathrm{out}
    > R_\mathrm{in} \ge 0$ for a physically valid hollow annulus.


    This quantity is usually taken from engineering geometry, survey data, or a simplified
    magnetic-circuit representation of the iron core. It determines the outer radial
    reach of high-permeability material and therefore affects estimates of iron volume,
    magnetic reluctance, flux linkage, and saturation in equilibrium or magnetic-field
    modeling. For rectangular iron-core segment descriptions, related geometric extents
    are [width_of_iron_core_segment](name:width_of_iron_core_segment) and [height_of_iron_core_segment](name:height_of_iron_core_segment).


    Typical values range from about 1-5 m in small and medium tokamaks and about 5-15
    m in large devices, depending on the size and placement of the transformer yoke.
    The difference between outer and inner radii is commonly 0.1-2 m for annular iron-core
    elements.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_iron_core_segment
  - name:width_of_iron_core_segment
  - name:height_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/annulus/radius_outer
    dd_path: iron_core/segment/geometry/annulus/radius_outer
    status: skipped
- name: outer_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a passive conducting loop
    element, defining the outer radial boundary of the annulus geometry used in electromagnetic
    modeling.
  documentation: 'The outer radius defines the radial extent of the outer boundary
    of the annular (hollow circular) cross-section of a passive conducting loop element,
    such as a vacuum vessel segment or other passive toroidal conductor. Together
    with [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop), it fully
    parameterizes the annular cross-section geometry used in electromagnetic circuit
    models to compute eddy-current responses, self-inductances, and resistances.


    The cross-sectional area of the annulus is:


    $$

    A = \pi \left( r_{\rm out}^2 - r_{\rm in}^2 \right)

    $$


    where $r_{\rm out}$ is the outer radius and $r_{\rm in}$ is the correspondent
    [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop), both in m.
    This area enters directly into resistance and inductance estimates of the passive
    loop element under the thin-shell approximation.


    Geometry parameters are obtained from engineering drawings or CAD models of the
    passive conductor assembly. Typical values range from a few centimeters for small
    conducting ribs to approximately 0.5 m for large vacuum vessel sectors, depending
    on device scale. The [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    is the analogous quantity for active poloidal field coil conductors.


    Sign convention: Positive when measured as a radial distance from the geometric
    center of the annular cross-section outward to the conductor''s outer boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_outer
    dd_path: pf_passive/loop/element/geometry/annulus/radius_outer
    status: composed
- name: radial_angle_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: First inclination angle (alpha) of the oblique parallelogram or trapezoidal
    cross-section of a poloidal field coil element, measured in the poloidal plane
    from the outward major-radius direction.
  documentation: "Poloidal field coil conductors are frequently designed with non-rectangular\
    \ cross-sections modeled as parallelograms or trapezoids in the poloidal $(R,\
    \ Z)$ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame. The radial\
    \ angle $\\alpha$ defines the inclination of one pair of parallel sides (the alpha-sides)\
    \ relative to the outward major-radius direction $+\\hat{R}$, characterizing how\
    \ much the conductor winding departs from a purely radial orientation.\n\nThe\
    \ oblique cross-section is fully parameterized by two inclination angles and two\
    \ side lengths. The radial angle $\\alpha$ pairs with the [vertical angle](name:vertical_angle_of_poloidal_field_coil)\
    \ $\\beta$ \u2014 measured from the vertical $+\\hat{Z}$ direction \u2014 to define\
    \ both side orientations, while [major_length_of_poloidal_field_coil](name:major_length_of_poloidal_field_coil)\
    \ and [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil) give\
    \ the corresponding alpha-side and beta-side lengths.\n\nThis angle is a fixed\
    \ geometric design parameter derived from coil engineering drawings and used in\
    \ computing cross-sectional area, mutual inductance, and electromagnetic force\
    \ distributions in poloidal field coil systems. The analogous first inclination\
    \ angle for iron core segments is described by [alpha_angle_of_iron_core_segment](name:alpha_angle_of_iron_core_segment).\n\
    \nSign convention: Positive when the alpha-side of the cross-section is inclined\
    \ counter-clockwise from $+\\hat{R}$ (toward $+\\hat{Z}$) in the poloidal $(R,\
    \ Z)$ plane."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_angle_of_poloidal_field_coil
  - name:major_length_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  - name:alpha_angle_of_iron_core_segment
