name: runaway_electron_density
status: draft
cocos_transformation_type: one_like
description: Number density of runaway electrons whose kinetic energy exceeds the
  critical threshold for continuous acceleration by the parallel electric field.
documentation: "The runaway electron density $n_{\\mathrm{RE}}$ (m$^{-3}$) counts\
  \ electrons accelerated beyond the critical velocity $v_c = \\sqrt{e E / (4\\pi\
  \ \\epsilon_0 m_e \\ln\\Lambda \\, n_e)}$, above which the decelerating collisional\
  \ drag decreases with speed, allowing unbounded acceleration by the toroidal electric\
  \ field $E$ (V m$^{-1}$). Here $e$ is the elementary charge, $m_e$ the electron\
  \ mass, $\\ln\\Lambda$ the Coulomb logarithm, and $n_e$ the total electron density.\
  \ In disruption scenarios with large loop voltages, $n_{\\mathrm{RE}}$ can reach\
  \ $10^{17}$\u2013$10^{19}$ m$^{-3}$, carrying currents of several MA and posing\
  \ severe first-wall damage risks. Primary runaway generation is described by the\
  \ Dreicer mechanism, while secondary (avalanche) multiplication amplifies the population\
  \ exponentially: $dn_{\\mathrm{RE}}/dt \\approx n_{\\mathrm{RE}} / \\tau_{\\mathrm{av}}$,\
  \ where $\\tau_{\\mathrm{av}}$ is the avalanche growth time. The density is inferred\
  \ experimentally from hard X-ray and synchrotron emission diagnostics, or computed\
  \ by kinetic codes such as DREAM or CODE. The complement of this quantity is the\
  \ thermal population described by `thermal_electron_number_density`, and the total\
  \ electron population by `electron_density`."
