- name: flux_surface_averaged_boron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of boron, including neutral atoms
    and all ionization states, evaluated on the plasma boundary.
  documentation: 'The quantity is the boron particle number density averaged over
    the last closed magnetic flux surface at the plasma boundary. It includes neutral
    boron and all ionic charge states through fully stripped B5+, rather than selecting
    a single charge state. It is the flux-surface-averaged counterpart of [boron density
    at the plasma boundary](name:boron_density_at_plasma_boundary).


    $$

    \langle n_{\mathrm B}\rangle_{\psi_b} = \frac{\displaystyle\oint_{\psi=\psi_b}
    n_{\mathrm B}\,\frac{dS}{|\nabla\psi|}}{\displaystyle\oint_{\psi=\psi_b} \frac{dS}{|\nabla\psi|}}

    $$


    Here $n_{\mathrm B}$ is the local total boron particle number density, $\psi$
    is the poloidal-flux surface label, $\psi_b$ identifies the plasma-boundary surface,
    and $dS$ is its surface element. The result is an average over the complete surface,
    not the density at a selected point or for a selected ionization state.


    Sign convention: Positive when the underlying boron number density is positive.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density_at_plasma_boundary
  arguments:
  - name: boron_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
