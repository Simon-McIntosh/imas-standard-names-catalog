- name: toroidal_beryllium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the beryllium impurity ion bulk flow velocity
    at the plasma boundary, summed over all ionization stages and averaged over the
    last closed flux surface.
  documentation: 'The toroidal component of the beryllium impurity ion bulk flow velocity
    at the plasma boundary quantifies the azimuthal rotation of beryllium ions at
    the last closed flux surface, which separates the magnetically confined plasma
    from the open-field-line scrape-off layer. This quantity encompasses all beryllium
    ionization stages (Be$^+$ through Be$^{4+}$) and represents the flux-surface-averaged
    toroidal impurity flow at the separatrix.


    The toroidal velocity is defined as the projection of the charge-state-averaged
    beryllium ion fluid velocity onto the toroidal direction:


    $$

    v_{\phi,\mathrm{Be}} = \mathbf{v}_\mathrm{Be} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{Be}$ is the charge-state-averaged beryllium ion fluid
    velocity and $\hat{\phi}$ is the unit vector in the toroidal direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame.


    Beryllium toroidal rotation at the plasma boundary is inferred from charge exchange
    recombination spectroscopy (CXRS), which resolves the Doppler shift of emission
    lines produced during charge-transfer reactions between beryllium ions and diagnostic
    neutral beam atoms. This measurement constrains edge impurity momentum transport
    and toroidal rotation profiles near the separatrix.


    Toroidal impurity velocities at the plasma boundary span approximately $-10^5$
    to $+10^5$ m/s in tokamak plasmas, with sign and magnitude governed by plasma
    current direction, auxiliary heating power, and external toroidal momentum injection.
    The pedestal-top value is given by [toroidal_beryllium_velocity_at_pedestal](name:toroidal_beryllium_velocity_at_pedestal_top),
    and the on-axis value by [toroidal_beryllium_velocity_at_magnetic_axis](name:toroidal_beryllium_velocity_at_magnetic_axis);
    the associated impurity density at this location is characterized by [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary).


    Sign convention: Positive when the beryllium ion flow is directed in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_beryllium_velocity_at_magnetic_axis
  - name:beryllium_density_at_plasma_boundary
