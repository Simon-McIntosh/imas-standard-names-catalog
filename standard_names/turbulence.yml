- name: ratio_of_particle_temperature_to_reference_particle_temperature
  kind: scalar
  status: draft
  description: Dimensionless ratio of a particle species temperature to a normalization
    reference temperature, setting the relative thermal speed of that species in a
    gyrokinetic simulation.
  documentation: "The ratio of a particle species temperature $T_s$ to a reference\
    \ temperature $T_{\\rm ref}$ is a fundamental dimensionless input in gyrokinetic\
    \ flux-tube simulations, governing the amplitude of thermal fluctuations and the\
    \ relative equilibrium distribution widths between co-existing plasma species.\n\
    \nThe defining relation is:\n\n$$\n\\tau_s = \\frac{T_s}{T_{\\rm ref}}\n$$\n\n\
    where $T_s$ is the temperature of species $s$ and $T_{\\rm ref}$ is the global\
    \ normalization reference temperature, often chosen as the electron temperature\
    \ at the outboard midplane flux surface. Through the thermal speed $v_{T,s} =\
    \ \\sqrt{T_s / m_s}$, where $m_s$ is the species mass, $\\tau_s$ directly sets\
    \ the gyrokinetic Maxwellian width and controls interspecies temperature contrasts\
    \ that drive ion-temperature-gradient and trapped-electron-mode instabilities.\n\
    \nThis quantity is equivalent to [normalized_particle_temperature](name:ratio_of_particle_temperature_to_reference_particle_temperature)\
    \ and overlaps with the more generic [normalized_temperature](name:ratio_of_particle_temperature_to_reference_particle_temperature);\
    \ it is the temperature analog of [ratio_of_particle_number_density_to_reference_number_density](name:ratio_of_particle_number_density_to_reference_number_density).\
    \ In practice it is prescribed as a species-level input parameter to a gyrokinetic\
    \ code, derived from experimental profiles or equilibrium reconstruction at the\
    \ chosen flux surface.\n\nTypical values in core-plasma flux-tube runs span $\\\
    tau_s \\approx 0.1$\u201310, with the reference species by definition having $\\\
    tau_s = 1$ and minority or impurity species taking values determined by their\
    \ experimental temperature ratios."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:ratio_of_particle_number_density_to_reference_number_density
  sources:
  - id: dd:gyrokinetics/species/temperature_norm
    dd_path: gyrokinetics/species/temperature_norm
    status: attached
  - id: dd:gyrokinetics_local/species/temperature_norm
    dd_path: gyrokinetics_local/species/temperature_norm
    status: composed
- name: toroidal_reference_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the equilibrium magnetic field evaluated at the
    reference major radius in the right-handed cylindrical (R, phi, Z) frame. It is
    a signed field component, distinct from the corresponding vacuum toroidal field.
  documentation: 'The toroidal reference magnetic field is the toroidal component
    of the equilibrium magnetic field evaluated at the chosen reference location whose
    major radius is $R_\mathrm{ref}$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is a signed component of the equilibrium field and is distinct from
    both the full magnetic-field magnitude and the vacuum toroidal-field estimate.


    The defining projection at the reference point is:


    $$

    B_\mathrm{ref} = \mathbf{B}_\mathrm{eq}(R_\mathrm{ref}, \phi, Z_\mathrm{ref})
    \cdot \hat{\phi}

    $$


    where $\mathbf{B}_\mathrm{eq}$ is the equilibrium magnetic field, $\hat{\phi}$
    is the toroidal unit vector, $B_\mathrm{ref}$ and the component $B_\phi$ are in
    tesla, and $R_\mathrm{ref}$ and $Z_\mathrm{ref}$ are in meters. In an axisymmetric
    equilibrium the value is independent of $\phi$; if the reference is specified
    only by major radius, $Z_\mathrm{ref}$ denotes the associated vertical coordinate
    of that reference location.


    The value is computed by evaluating the equilibrium field at the reference point
    and projecting onto $\hat{\phi}$. It is the reference-location specialization
    of [toroidal_magnetic_field](name:toroidal_magnetic_field); [toroidal_magnetic_field_at_magnetic_axis](name:toroidal_magnetic_field_at_magnetic_axis)
    uses the magnetic-axis location instead. The related [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field)
    is often written $B_\mathrm{vac}=F_\mathrm{vac}/R_\mathrm{ref}$, where $F_\mathrm{vac}$
    is in T m and $B_\mathrm{vac}$ is in T, or equivalently $B_\mathrm{vac}=B_{\phi0}R_0/R_\mathrm{ref}$,
    where $B_{\phi0}$ is in T and $R_0$ is in meters. The equilibrium reference value
    can differ from this vacuum value because plasma pressure and current modify the
    toroidal-field function and because the reference point may be displaced by plasma
    shaping or Shafranov shift.


    Typical magnitudes are 1-6 T in medium-sized to large tokamaks, below 1 T in some
    low-field spherical tokamaks, and up to about 8-12 T in high-field devices. Quantities
    such as gyrofrequency scales or gyroradii normally use $|B_\mathrm{ref}|$ or a
    full-field magnitude; the signed value is retained when toroidal-field orientation
    matters.


    Sign convention: Positive when $B_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: turbulence
  links:
  - name:reference_major_radius
  sources:
