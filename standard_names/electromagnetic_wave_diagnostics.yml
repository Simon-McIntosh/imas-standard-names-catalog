- name: tilt_angle_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Signed rotation of an elliptical beam cross-section\u2019s principal\
    \ axis relative to the local transverse basis attached to a beam-tracing propagation\
    \ path."
  documentation: "The tilt angle specifies the orientation of a selected principal\
    \ axis of the elliptical cross-section associated with a beam-tracing beam, relative\
    \ to the beam\u2019s transverse basis. It describes ellipse orientation rather\
    \ than the beam\u2019s propagation direction, which is characterized separately\
    \ by the [poloidal angle of the beam-tracing beam](name:poloidal_angle_of_beam_tracing_beam).\n\
    \nThe principal-axis direction is defined by\n\n$$\n\\hat{\\mathbf a} = \\cos\\\
    alpha\\,\\hat{\\mathbf e}_1 + \\sin\\alpha\\,\\hat{\\mathbf e}_2\n$$\n\nwhere\
    \ $\\alpha$ is the tilt angle, $\\hat{\\mathbf a}$ is the selected principal-axis\
    \ unit vector, and $(\\hat{\\mathbf e}_1,\\hat{\\mathbf e}_2,\\hat{\\mathbf e}_\\\
    parallel)$ is the local right-handed beam frame, with $\\hat{\\mathbf e}_\\parallel$\
    \ aligned with propagation. Because an ellipse is unchanged when a principal axis\
    \ is reversed, the angle is defined modulo $\\pi$; selecting the other principal\
    \ axis changes the reference by $\\pi/2$.\n\nSign convention: Positive when the\
    \ selected principal axis rotates from $\\hat{\\mathbf e}_1$ toward $\\hat{\\\
    mathbf e}_2$ according to the right-handed orientation about $\\hat{\\mathbf e}_\\\
    parallel$."
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
