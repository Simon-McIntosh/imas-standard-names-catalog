- name: bremsstrahlung_power
  kind: scalar
  status: draft
  description: Total power radiated via bremsstrahlung emission from the plasma due
    to free electron scattering off ions.
  documentation: Bremsstrahlung power is the total radiated power from free-free electron-ion
    collisions in the plasma. It scales as $P_{br} \propto Z_{\text{eff}} n_e^2 T_e^{1/2}$,
    where $Z_{\text{eff}}$ is the effective ion charge, $n_e$ is the electron density,
    and $T_e$ is the electron temperature. This represents a significant volumetric
    power loss channel in high-temperature plasmas, particularly in the core. Typical
    values range from kilowatts to tens of megawatts in fusion-grade tokamaks, depending
    on density, temperature, and impurity content. The quantity is related to the
    total radiated power from impurity radiation, [radiated_power_due_to_impurity_radiation](name:radiated_power_due_to_impurity_radiation),
    and to the volumetric [power_density_due_to_radiation_emission](name:power_density_due_to_radiation_emission).
    Bremsstrahlung is measured indirectly via soft X-ray diagnostics and bolometry,
    and is a key input for power balance calculations.
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radiated_power_due_to_impurity_radiation
  - name:power_density_due_to_radiation_emission
  sources:
  - id: dd:summary/global_quantities/power_bremsstrahlung/value
    dd_path: summary/global_quantities/power_bremsstrahlung/value
    status: composed
- name: cold_neutral_initial_temperature
  kind: scalar
  status: draft
  description: Initial temperature of the cold neutral population for a specific hydrogen
    isotope, used as a model input parameter for edge plasma and neutral transport
    simulations.
  documentation: "The initial temperature of the cold neutral population characterizes\
    \ the thermal energy of neutral atoms or molecules (e.g., H, D, T) entering the\
    \ plasma edge from the wall or gas puff, before they undergo charge-exchange or\
    \ ionization. This parameter sets the low-energy boundary condition for neutral\
    \ transport models and directly influences the calculated penetration depth and\
    \ the cold neutral density profile. The cold neutral temperature is typically\
    \ on the order of 0.1\u20131 eV, corresponding to Franck\u2013Condon dissociation\
    \ energies or thermal energies of recycled molecules at the wall. It is measured\
    \ via analysis of Balmer line emission spectra, where Doppler broadening of the\
    \ narrow central peak yields the cold neutral temperature, while the broader pedestal\
    \ is associated with the hot neutral population. In simulations, the initial value\
    \ is often set to 0.5 eV for deuterium and 0.3 eV for helium, reflecting typical\
    \ Franck\u2013Condon energies. For a physically derived quasi-steady-state value,\
    \ see [cold_neutral_temperature](name:cold_neutral_temperature); for the hot neutral\
    \ counterpart see [hot_neutral_initial_temperature](name:hot_neutral_initial_temperature).\n\
    \nSign convention: Positive when temperature is greater than absolute zero.\n\n\
    This parameter is a model initial condition, not a directly time-resolved measurement,\
    \ and its value may be adjusted in interpretive or predictive simulations to match\
    \ observed neutral fractions."
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_temperature
  - name:hot_neutral_initial_temperature
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_temperature
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_temperature
    status: composed
- name: curvature_of_optical_element
  kind: scalar
  status: draft
  description: Geometric radius of curvature of a diagnostic optical element's surface
    in the X2 transverse direction, characterizing the surface shape for ray tracing.
  documentation: 'This quantity specifies the radius of curvature of an optical element
    (lens, mirror, or window) in the X2 transverse direction, as used in diagnostic
    ray-tracing and optical design. The radius of curvature $R_{X2}$ (in m) describes
    the spherical or cylindrical curvature of the surface, where $R > 0$ corresponds
    to a convex surface as seen from the incoming beam direction. The associated focal
    power scales as $1/R$, with tighter curvature giving stronger focusing. Pair with
    [major_radius_of_optical_element](name:major_radius_of_optical_element) for the
    element''s spatial position and [area_of_optical_element](name:area_of_optical_element)
    for surface throughput calculations. Typical optical-component radii range from
    a few centimeters (high-curvature lenses in collimators) to several meters (weakly
    curved focusing mirrors) depending on the diagnostic geometry. Measurement relies
    on interferometric profilometry or coordinate measuring machine (CMM) data acquired
    during component fabrication.


    Sign convention: Positive when the center of curvature lies in the direction of
    the inward surface normal on the X2 axis (convex surface as seen from the incident
    beam).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:major_radius_of_optical_element
  - name:area_of_optical_element
  sources:
  - id: dd:spectrometer_visible/channel/optical_element/back_surface/x1_curvature
    dd_path: spectrometer_visible/channel/optical_element/back_surface/x1_curvature
    status: composed
  - id: dd:spectrometer_visible/channel/optical_element/front_surface/x2_curvature
    dd_path: spectrometer_visible/channel/optical_element/front_surface/x2_curvature
    status: composed
- name: deuterium_deuterium_beam_source_rate
  kind: scalar
  status: draft
  description: Rate of 2.45 MeV neutron production from deuterium-deuterium fusion
    reactions where both reactants are fast ions from neutral beam injection, measured
    in hertz.
  documentation: "This quantity represents the total rate of neutron production from\
    \ deuterium-deuterium (D-D) fusion reactions between fast deuterium ions originating\
    \ from neutral beam injectors. The reaction channel is D + D \u2192 \xB3He (0.82\
    \ MeV) + n (2.45 MeV). The rate is obtained by integrating the beam-beam fusion\
    \ reactivity over the overlapping fast ion distribution functions, taking into\
    \ account the beam energy, density, and geometry of the injection system.\n\n\
    The typical value range for an ITER-like device with 1\u20131.5 MW of beam power\
    \ is 10\xB9\u2074\u201310\xB9\u2076 neutrons per second. The rate is sensitive\
    \ to beam energy (typically 50\u2013500 keV), the overlap between different beam\
    \ sources, and the residual thermal deuterium background.\n\n\\[\nR_{\\text{DD,beam-beam}}\
    \ = \\iint n_1(\\mathbf{r}) n_2(\\mathbf{r}) \\langle \\sigma v \\rangle_{\\text{DD}}\
    \ \\, d^3\\mathbf{r}\n\\]\n\nwhere \\(n_1\\) and \\(n_2\\) are the densities of\
    \ fast deuterium ions from two beam sources (or the same beam population if self-reactive),\
    \ and \\(\\langle \\sigma v \\rangle_{\\text{DD}}\\) is the D-D fusion reactivity\
    \ averaged over the fast ion velocity distributions.\n\nMeasurement is performed\
    \ with neutron flux monitors and activation samples calibrated for 2.45 MeV neutrons.\
    \ Time resolution is typically 1\u201310 ms.\n\nSign convention: Positive when\
    \ the computed neutron emission rate from the beam-beam reaction is directed outward\
    \ from the plasma."
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_source_rate
  - name:deuterium_tritium_beam_source_rate
  sources:
  - id: dd:summary/fusion/neutron_fluxes/dd/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/dd/beam_beam/value
    status: composed
- name: diagnostic_aperture_radius
  kind: scalar
  status: draft
  description: Geometric radius of the circular entrance pupil that limits the photon
    collection solid angle for an X-ray crystal spectrometer channel.
  documentation: "The diagnostic aperture radius $r_a$ defines the circular entrance\
    \ pupil of an X-ray crystal spectrometer channel. For a geometry type indicating\
    \ a circular aperture, this radius determines the geometric acceptance area $A\
    \ = \\pi r_a^2$, which together with the solid angle of the viewed plasma volume\
    \ sets the photon collection efficiency. Typical values range from 1 to 50 mm,\
    \ chosen to balance signal throughput against desired spatial localization. The\
    \ companion quantity [area_of_diagnostic_aperture](name:area_of_diagnostic_aperture)\
    \ is derived directly from this radius. When rectangular collimation is used instead,\
    \ the equivalent parameter is captured by [width](name:width).\n\nSign convention:\
    \ Positive when measured outward from the aperture center, making it an inherently\
    \ non-negative geometric length.\n\nCr K-alpha He-li-like spectroscopy routinely\
    \ uses apertures of 5\u201320 mm radius to achieve count rates above 100 kHz while\
    \ maintaining 1\u20132 cm spatial resolution along the line of sight."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:area_of_diagnostic_aperture
  - name:width
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/aperture/radius
    dd_path: spectrometer_x_ray_crystal/channel/aperture/radius
    status: composed
- name: etendue_of_spectrometer
  kind: scalar
  status: draft
  description: Geometric extent of the spectrometer optical system, defined as the
    product of the limiting aperture area and the solid angle of the accepted radiation.
  documentation: The etendue (geometric throughput, $G = A \Omega$) of a UV spectrometer
    characterizes the light-collection efficiency by combining the effective aperture
    area $A$ (in m$^2$) with the solid angle $\Omega$ (in sr) subtended by the optical
    system. It is an invariant quantity in an ideal lossless optical chain and determines
    the maximum signal flux incident on the detector. Typical values range from $10^{-6}$
    to $10^{-4}$ m$^2\cdot$sr for UV spectrometers on fusion diagnostics, depending
    on the f-number and entrance slit geometry. The etendue is related to the [area_of_optical_element](name:area_of_optical_element)
    and the [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture) of
    individual components, which together define the overall throughput of the imaging
    system.
  unit: m^2.sr
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:area_of_optical_element
  - name:radius_of_diagnostic_aperture
  sources:
  - id: dd:spectrometer_uv/etendue
    dd_path: spectrometer_uv/etendue
    status: composed
- name: hot_neutral_initial_temperature
  kind: scalar
  status: draft
  description: Temperature of the hot neutral population for a specific hydrogen isotope
    at the start of the observation or simulation.
  documentation: 'The initial temperature of the hot neutral population characterizes
    the kinetic energy of neutral atoms that have undergone charge-exchange reactions
    with energetic ions. This quantity is derived from the Doppler broadening of neutral
    emission lines measured by visible spectroscopy, providing a boundary condition
    for neutral particle transport models. For typical tokamak edge conditions, hot
    neutral temperatures range from 100 to 1000 eV, depending on the local ion temperature
    and the energy distribution of the parent ions. The initial temperature is distinct
    from the steady-state hot neutral temperature; together with [cold_neutral_initial_temperature](name:cold_neutral_initial_temperature)
    it provides a complete initial condition for the neutral energy distribution in
    multispecies simulations.


    Sign convention: Positive when the population temperature is above absolute zero.


    See also [hot_neutral_temperature](name:hot_neutral_temperature) for the instantaneous
    temperature during the observation period.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_initial_temperature
  - name:hot_neutral_temperature
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    status: composed
- name: hot_neutral_temperature
  kind: scalar
  status: draft
  description: Maxwellian temperature of the hot neutral atom population, typically
    arising from charge-exchange reactions, as inferred from Doppler broadening in
    polarization spectroscopy.
  documentation: 'The hot neutral temperature $T_n$ quantifies the thermal energy
    of the suprathermal neutral population produced primarily via charge-exchange
    reactions between plasma ions and cold neutrals. These hot neutrals have energies
    comparable to the background ion temperature and are measurable through the Doppler
    broadening of spectral lines in polarization spectroscopy, often using a visible
    spectrometer. Typical values range from tens of eV in the edge to several keV
    in the core plasma. The temperature is extracted from a fit to the broadened line
    shape, assuming a Maxwellian velocity distribution for the hot neutral component.
    See also [cold_neutral_temperature](name:cold_neutral_temperature) for the thermal
    population and [hot_neutral_initial_temperature](name:hot_neutral_initial_temperature)
    for isotope-specific measurements.


    Sign convention: Positive when the spectral line width increases, corresponding
    to higher neutral kinetic energy.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_temperature
  - name:hot_neutral_initial_temperature
  sources:
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    status: composed
- name: major_radius_of_optical_element
  kind: scalar
  status: draft
  description: "Major radius (R) coordinate of the center point of a diagnostic optical\
    \ element, such as a lens or mirror, in the IMAS cylindrical (R, \u03C6, Z) frame."
  documentation: "The major radius $R$ coordinates the spatial position of the optical\
    \ element's geometric center in the machine's toroidal plane. This coordinate\
    \ is essential for ray-tracing models that compute the diagnostic line of sight\
    \ and for mapping the detector field of view onto the plasma volume. Typical values\
    \ range from 0.5\u20135.0 m depending on the tokamak size, with in-vessel elements\
    \ located closer to the plasma (e.g., $R=1.5$ m for a first-wall mirror on a medium-size\
    \ device) and ex-vessel elements further out (e.g., $R=2.5$ m for a focusing lens).\
    \ The position is routinely measured during diagnostic alignment and may be refined\
    \ by in-situ calibration using backlit targets. This quantity is related to the\
    \ major radius of the diagnostic aperture via [major_radius_of_diagnostic_antenna](name:major_radius_of_diagnostic_antenna),\
    \ which defines the line-of-sight endpoint for the same optical chain.\n\nSign\
    \ convention: Positive when the center point lies at a major radius value greater\
    \ than that of the machine symmetry axis ($R>0$).\n\nFor multi-element optics,\
    \ the element properties are further described by [length_of_optical_element](name:length_of_optical_element)\
    \ (thickness along the optical axis) and [area_of_diagnostic_aperture](name:area_of_diagnostic_aperture)\
    \ (cross-sectional area defining the etendue)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:major_radius_of_diagnostic_antenna
  - name:length_of_optical_element
  - name:area_of_diagnostic_aperture
  sources:
