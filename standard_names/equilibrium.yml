- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the geometric axis (area centroid) of
    the plasma cross-section, measured as the perpendicular distance from the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The geometric axis is the area centroid of the plasma poloidal cross-section,
    defined by $R_{\rm geo} = (R_{\rm max} + R_{\rm min})/2$, where $R_{\rm max}$
    and $R_{\rm min}$ are the outermost and innermost major-radius extents of the
    plasma boundary. This coordinate locates the geometric center of the plasma shape
    and is a key parameter in plasma positioning and shape control, distinct from
    the magnetic axis (where $\nabla\psi = 0$). Typical values range from approximately
    0.6 m in small tokamaks to 6.2 m for ITER. It is inferred from equilibrium reconstruction
    using external magnetics, supplemented by internal measurements such as motional
    Stark effect or soft X-ray emission. The companion vertical coordinate is given
    by [vertical coordinate of centroid](name:vertical_coordinate_of_centroid), and
    the related [major radius of the plasma boundary outline point](name:major_radius_of_plasma_boundary_outline_point)
    provides the full boundary shape from which the centroid is computed.


    Sign convention: Positive when the geometric axis lies at a finite perpendicular
    distance from the machine symmetry axis, consistent with $R \geq 0$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_centroid
  - name:major_radius_of_plasma_boundary_outline_point
  sources:
  - id: dd:equilibrium/time_slice/boundary/geometric_axis/r
    dd_path: equilibrium/time_slice/boundary/geometric_axis/r
    status: composed
