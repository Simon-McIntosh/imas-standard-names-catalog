- name: tungsten_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of tungsten ions in the plasma immediately adjacent
    to a divertor target, summed over all ionization stages W1+ through W74+ and excluding
    neutral tungsten atoms.
  documentation: 'Tungsten density at the divertor target is the local number density
    of tungsten ions in the plasma adjacent to a divertor target surface, summed over
    all ionization stages W$^{1+}$ through W$^{74+}$ and excluding neutral tungsten
    atoms. As a fully charge-state-summed impurity ion density, it follows the convention
    of the parent [density_at_divertor_target](name:density_at_divertor_target) and
    is evaluated at the plasma-material interface immediately upstream of the electrostatic
    sheath entrance.


    Tungsten is a high-Z refractory metal with atomic number $Z = 74$. The total ion
    number density is defined as:


    $$

    n_W = \sum_{z=1}^{74} n_{W^{z+}}

    $$


    where $n_{W^{z+}}$ is the local number density of tungsten ions in charge state
    $z$. Tungsten ions at the divertor target arise primarily from physical sputtering
    of tungsten plasma-facing components by energetic incident hydrogenic and impurity
    ions.


    Even trace tungsten concentrations that migrate from the divertor region into
    the core can produce severe radiative power losses at electron temperatures above
    a few keV, making this near-target density a critical diagnostic quantity for
    impurity transport and divertor detachment studies. It is distinct from the bulk
    plasma content captured by [tungsten_density](name:tungsten_density) and from
    the separatrix-averaged value given by [tungsten_density_at_plasma_boundary](name:flux_surface_averaged_tungsten_density_at_plasma_boundary).
    Near-target tungsten ion densities are inferred from vacuum-ultraviolet and optical
    emission spectroscopy of tungsten line radiation combined with impurity transport
    modeling.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:tungsten_density
  - name:flux_surface_averaged_tungsten_density_at_plasma_boundary
  arguments:
  - name: density_at_divertor_target
    operator: tungsten
    operator_kind: qualifier
  sources:
