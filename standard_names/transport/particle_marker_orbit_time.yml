name: particle_marker_orbit_time
status: draft
cocos_transformation_type: one_like
description: Elapsed time along the most recent guiding-center orbit of a Monte Carlo
  marker particle used in kinetic transport simulations.
documentation: "In particle-following codes (e.g., ASCOT, NUBEAM, SPIRAL), the orbit\
  \ of each marker is integrated along the guiding-center equations of motion. The\
  \ orbit time $t_{\\rm orb}$ records the time coordinate sampled along the marker's\
  \ last complete or partial orbit, forming the independent variable for orbit-integral\
  \ diagnostics such as bounce-averaged quantities. The orbit period $\\tau_{\\rm\
  \ orb}$ depends on the particle class: passing particles complete a full toroidal\
  \ transit in $\\tau_{\\rm pass} \\sim 2\\pi R_0 / v_\\parallel$ (where $R_0$ is\
  \ the major radius in meters and $v_\\parallel$ the parallel velocity in m/s), while\
  \ trapped particles have bounce times $\\tau_{\\rm bounce} \\sim q R_0 / (\\epsilon^{1/2}\
  \ v)$ with $q$ the safety factor and $\\epsilon = r/R_0$ the inverse aspect ratio.\
  \ Typical orbit times range from $10^{-7}$\u2013$10^{-5}$ s for fast ions in tokamak\
  \ plasmas. This array is used to evaluate orbit integrals of heating, current-drive,\
  \ and collisional quantities along individual marker trajectories. See also `distribution_particle_count`,\
  \ `distribution_particle_number_density`."
