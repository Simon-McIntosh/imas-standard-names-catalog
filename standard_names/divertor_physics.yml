  documentation: 'Oxygen density at the divertor target is the local number density
    of ionized oxygen in the plasma next to a divertor target surface. It is the charge-state-summed
    oxygen ion population per unit volume at the plasma-material interface, spanning
    all ionization stages from singly ionized O$^{1+}$ through fully stripped O$^{8+}$,
    and excludes neutral oxygen atoms. As a species-resolved component of [density_at_divertor_target](name:density_at_divertor_target),
    it quantifies the oxygen impurity content at the sheath entrance of the divertor.


    Oxygen is a low-Z impurity in fusion plasmas, entering through outgassing of vacuum
    vessel walls, residual water vapor, or erosion of oxide-forming plasma-facing
    components. Elevated oxygen density at the target enhances radiative power dissipation
    through line emission from partially stripped ions and raises [effective_charge_at_divertor_target](name:effective_charge_at_divertor_target)
    above unity, degrading fuel-ion purity. In strongly radiating or detached divertor
    regimes, distributed oxygen line radiation can partially detach the plasma and
    redistribute heat loads away from the target surface.


    The oxygen ion density at the target is inferred from visible and vacuum-ultraviolet
    spectroscopy of oxygen emission lines near the divertor, combined with collisional-radiative
    modeling to relate observed line intensities to the total ion population across
    charge states. This interpretation requires concurrent knowledge of the local
    electron temperature and electron density to resolve the charge-state distribution.
    The oxygen contribution sums into [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    alongside fuel species such as [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target);
    the volume-averaged confined-plasma counterpart is [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:effective_charge_at_divertor_target
  - name:total_ion_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:volume_averaged_oxygen_density
  arguments:
