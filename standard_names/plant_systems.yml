- name: methane_source_rate
  kind: scalar
  status: active
  description: Instantaneous rate of neutral methane-molecule delivery into the plasma
    vessel by gas injection, counted per molecule rather than as an equivalent-electron
    or elemental source.
  documentation: 'Methane source rate is the instantaneous rate at which neutral methane
    molecules are delivered to the plasma vessel by gas injection. It counts methane
    molecules directly, rather than converting them to equivalent electrons or to
    elemental carbon or hydrogen.


    The source rate is defined by


    $$

    \dot{N}_{\mathrm{CH_4}}(t) = \frac{dN_{\mathrm{CH_4}}(t)}{dt}

    $$


    where $N_{\mathrm{CH_4}}(t)$ is the cumulative number of methane molecules delivered
    by gas injection and $t$ is time. The quantity is distinct from the [methane carbon-13
    source rate](name:methane_carbon_13_source_rate), which applies specifically to
    carbon-13-labeled methane.'
  unit: s^-1
  physics_domain: plant_systems
