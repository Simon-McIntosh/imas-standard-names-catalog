- name: radial_ion_energy_convection_velocity
  kind: scalar
  status: active
  description: Effective radial transport velocity for convective ion-energy transport
    in the edge plasma; it need not equal the radial ion particle-flow velocity.
  documentation: 'This quantity is the effective velocity assigned to the convective
    component of ion-energy transport in the edge plasma. It parameterizes energy
    advection and is not, by definition, the ion particle-flow velocity.


    Its defining relation to the convective ion-energy flux is


    $$

    u_{i,E,r}^{\mathrm{conv}} = \frac{Q_{i,E,r}^{\mathrm{conv}}}{W_{i,E}}$$


    where $Q_{i,E,r}^{\mathrm{conv}}$ is the radial convective ion-energy flux and
    $W_{i,E}$ is the corresponding ion-energy density. The quantity is defined where
    $W_{i,E}$ is nonzero and excludes diffusive, conductive, and source contributions.
    It is the radial component of ion_energy_convection_velocity, and differs from
    [radial_ion_convection_velocity](name:radial_ion_convection_velocity), which parameterizes
    particle transport.


    Sign convention: Positive when the associated convective ion-energy flux points
    in the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
  sources:
