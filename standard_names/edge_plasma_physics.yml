    V_{\mathrm{Ne},\phi} = \frac{\sum_q n_{\mathrm{Ne},q} v_{\mathrm{Ne},q,\phi}}{\sum_q
    n_{\mathrm{Ne},q}}

    $$


    Here, $q$ labels neon ion charge state, $n_{\mathrm{Ne},q}$ is its number density,
    and $v_{\mathrm{Ne},q,\phi}$ is its toroidal fluid-velocity component. The quantity
    is distinguished from [toroidal neon velocity at the internal transport barrier](name:toroidal_neon_velocity_at_internal_transport_barrier)
    by its pedestal-top location and is a species-specific counterpart of [toroidal
    hydrogen velocity at the pedestal top](name:toroidal_hydrogen_velocity_at_pedestal_top).


    Sign convention: Positive when the neon-ion flow has a component in the direction
    of increasing toroidal angle $\phi$.'
