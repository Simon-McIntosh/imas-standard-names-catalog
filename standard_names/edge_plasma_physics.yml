      kind: template
- name: radial_ion_particle_diffusivity
  kind: scalar
  status: active
  description: Effective Fickian coefficient for cross-field radial transport of the
    total charged-ion population, relating its diffusive particle flux to the negative
    radial gradient of ion density.
  documentation: 'Radial ion particle diffusivity is the effective Fickian coefficient
    for cross-field transport of the total charged-ion population across neighboring
    magnetic flux surfaces. It describes diffusive particle transport, excluding convective,
    energy, and momentum transport.


    The defining relation is:


    $$

    \Gamma_{i,r}^{\mathrm{diff}} = -D_{i,r}^{\mathrm{part}}\frac{\partial n_i}{\partial
    r}

    $$


    where $\Gamma_{i,r}^{\mathrm{diff}}$ is the radial diffusive ion particle flux,
    $D_{i,r}^{\mathrm{part}}$ is this diffusivity, $n_i$ is the total charged-ion
    number density, and $r$ is a radial coordinate increasing away from the magnetic
    axis.


    The density $n_i$ is summed over charged ion species and all charge states without
    charge, mass, or atomic-number weighting. This total-population quantity is related
    to [radial ion diffusion coefficient](name:radial_ion_diffusion_coefficient) and
    is distinct from [radial ion charge-state diffusivity](name:radial_ion_charge_state_diffusivity),
    which applies to one specified charge state.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_diffusion_coefficient
  - name:radial_ion_charge_state_diffusivity
