- name: krypton_density_at_limiter
  kind: scalar
  status: active
  description: Krypton ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all krypton ionization states.
  documentation: "Krypton density at a limiter is the local number density of krypton\
    \ ions in the boundary plasma immediately adjacent to a plasma-facing limiter\
    \ surface. The evaluation point is the plasma side of the magnetic presheath or\
    \ sheath entrance at the plasma\u2013limiter contact, where open scrape-off-layer\
    \ field lines terminate on the material boundary.\n\nUnless a single charge state\
    \ is explicitly specified, the quantity represents the charge-state-summed total:\n\
    \n$$\nn_\\mathrm{Kr} = \\sum_{q=1}^{36} n_{\\mathrm{Kr}^{q+}}\n$$\n\nwhere $n_{\\\
    mathrm{Kr}^{q+}}$ is the number density of krypton ions in ionization state $q$,\
    \ ranging from $q = 1$ (singly ionized) to $q = 36$ (fully stripped). Neutral\
    \ krypton atoms are excluded from this quantity.\n\nKrypton is a high-$Z$ noble\
    \ gas ($Z = 36$) injected as a seeding impurity to enhance radiative dissipation\
    \ in the scrape-off layer, redistributing heat load away from plasma-facing components.\
    \ Its local density at the limiter characterizes krypton availability for charge\
    \ exchange, ionization, and plasma\u2013material interactions at the wall. Even\
    \ modest krypton concentrations significantly elevate [effective_charge_at_limiter](name:effective_charge_at_limiter)\
    \ due to its high nuclear charge.\n\nWithin the [density_at_limiter](name:density_at_limiter)\
    \ family, krypton density serves as a heavier-impurity counterpart to lighter\
    \ noble-gas seeds such as [argon_density_at_limiter](name:argon_density_at_limiter),\
    \ and contrasts with fuel-ion species such as [deuterium_density_at_limiter](name:deuterium_density_at_limiter).\
    \ Under quasi-neutrality, the charge-weighted sum of all ion densities at the\
    \ limiter equals [electron_density_at_limiter](name:electron_density_at_limiter)."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:effective_charge_at_limiter
  - name:density_at_limiter
  - name:argon_density_at_limiter
  - name:deuterium_density_at_limiter
  - name:electron_density_at_limiter
  arguments:
