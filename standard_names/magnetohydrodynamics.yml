- name: radial_width_of_neoclassical_tearing_mode
  kind: scalar
  status: active
  description: "Radial width of a neoclassical tearing mode is the nonnegative full\
    \ extent of its magnetic island along the major-radius coordinate R in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, measured between separatrix crossings through\
    \ the resonant rational surface."
  documentation: 'Radial width of a neoclassical tearing mode is the full cross-island
    extent of the associated magnetic island along the major-radius coordinate $R$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It is evaluated across the
    island separatrix through the resonant rational surface and is a nonnegative full
    width, not a signed displacement of the island center.


    The full-width convention is represented by the separation of the outer and inner
    separatrix crossings along $R$:


    $$

    w = R_\mathrm{out} - R_\mathrm{in}

    $$


    where $w$, $R_\mathrm{in}$, and $R_\mathrm{out}$ are lengths in meters, and $R_\mathrm{in}$
    and $R_\mathrm{out}$ are the inner and outer separatrix crossing positions on
    the same island cross-section, ordered so that $R_\mathrm{out} \ge R_\mathrm{in}$.


    This quantity uses a full-width convention; an island half-width is half of this
    value and is not the same quantity. The generic [mode width](name:mode_width)
    uses the same full-island-width convention without the neoclassical-tearing-mode
    specialization, while [time derivative of mode width](name:time_derivative_of_mode_width)
    denotes the temporal rate of change of the width. The position of the island center
    may be specified by the [toroidal flux coordinate of the neoclassical tearing
    mode center](name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center).'
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  sources:
  - dd_path: ntms/time_slice/mode/detailed_evolution/width
    dd_version: 4.1.0
