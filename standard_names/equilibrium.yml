- name: radius_of_plasma_boundary
  kind: scalar
  status: active
  description: "Radius of plasma boundary is a scalar radius measure characterizing\
    \ the size of the plasma-boundary contour in a poloidal cross-section. Specializations\
    \ define the particular radius descriptor, such as the minor-radius half-width\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radius of plasma boundary is a scalar radius measure assigned to
    the closed contour that represents the plasma boundary in a poloidal cross-section.
    It defines the common boundary-radius concept; concrete specializations determine
    which radius descriptor is used, while the locus remains the plasma-boundary contour.


    For the representative [minor radius of plasma boundary](name:minor_radius_of_plasma_boundary)
    specialization, the descriptor is the half difference between the maximum and
    minimum major radius of the same boundary contour in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height: $a = (R_{\max} - R_{\min})/2$. Other specializations preserve
    the same boundary locus and differ only in the radius descriptor.


    This quantity excludes coordinates of individual boundary points, boundary perimeter,
    enclosed area, and flux-surface labels; those describe boundary geometry or labeling
    rather than a scalar radius descriptor.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  - name:elongation_of_plasma_boundary
- name: minor_radius_of_plasma_boundary
  kind: scalar
  status: active
  description: Minor radius of the last closed plasma-boundary contour, obtained from
    its maximum and minimum major-radius coordinates.
  documentation: 'The minor radius of the plasma boundary is the radial half-width
    of the last closed plasma-boundary contour in a poloidal cross-section at fixed
    toroidal angle. In the right-handed cylindrical $(R,\phi,Z)$ frame, $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is the component-specific
    radial measure represented by [radius of plasma boundary](name:radius_of_plasma_boundary).


    The minor radius is defined by


    $$

    a = \frac{R_{\max} - R_{\min}}{2}

    $$


    where $a$ is the minor radius, and $R_{\max}$ and $R_{\min}$ are the maximum and
    minimum values of the major-radius coordinate along the complete boundary contour,
    measured in m. The definition excludes vertical extent, contour perimeter, and
    shaping parameters.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radius_of_plasma_boundary
  arguments:
  - name: radius_of_plasma_boundary
    operator: minor
    operator_kind: qualifier
  sources:
