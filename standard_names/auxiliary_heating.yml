- name: vertical_centroid_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the geometric centroid of a rectangular coil
    conductor element cross-section, measured in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: "The vertical centroid coordinate locates the geometric center of\
    \ a rectangular coil conductor element cross-section along the $Z$-axis of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major-radius\
    \ distance from the machine symmetry axis, $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above, and $Z$ is the vertical height.\n\n\
    For a rectangular cross-section with lower edge at $Z_\\text{min}$ and upper edge\
    \ at $Z_\\text{max}$, the centroid is:\n\n$$\nZ_c = \\frac{Z_\\text{min} + Z_\\\
    text{max}}{2}\n$$\n\nwhere $Z_c$ is in meters and coincides with the midpoint\
    \ between the two horizontal bounding edges of the rectangle.\n\nThis geometric\
    \ parameter is specified in engineering design documentation for coil, antenna,\
    \ and passive-structure assemblies, and may be confirmed by physical survey measurements\
    \ before or during machine operation. Paired with the corresponding major-radius\
    \ centroid, it fully characterizes the planar position of each sub-element within\
    \ the poloidal cross-section, providing the input required for Biot\u2013Savart\
    \ magnetic field calculations from individual current-carrying segments. The analogous\
    \ coordinate for the parent coil conductor is captured by [vertical_coordinate_of_coil_conductor](name:vertical_coordinate_of_coil_conductor),\
    \ the generic conductor cross-section center by [vertical_coordinate_of_conductor_cross_section](name:vertical_coordinate_of_conductor_cross_section),\
    \ and the ion cyclotron antenna strap center by [vertical_coordinate_of_antenna_strap](name:vertical_coordinate_of_antenna_strap).\n\
    \nSign convention: Positive when the centroid lies above the machine midplane\
    \ in the direction of increasing $Z$."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_coil_conductor
  - name:vertical_coordinate_of_conductor_cross_section
  - name:vertical_coordinate_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/z
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/z
    status: attached
- name: vertical_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the geometric center of an electron cyclotron\
    \ launcher mirror, measured along the machine symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ locates the geometric center of an EC
    launcher mirror along the machine symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z = 0$ denotes the machine midplane. Together with
    the major-radius coordinate [radial_centroid_of_electron_cyclotron_launcher_mirror](name:radial_centroid_of_electron_cyclotron_launcher_mirror)
    and the toroidal angle, it fully specifies the three-dimensional position of the
    mirror center in the machine.


    The vertical position is determined by the port assignment in the vacuum vessel
    and is established during machine assembly or optical survey, with uncertainties
    of order millimeters. The coordinate serves as a boundary condition for beam-tracing
    calculations that compute EC wave power deposition and current-drive profiles;
    small changes in $Z$ shift the injection height and alter which resonance layer
    the beam intercepts.


    EC launchers installed in equatorial ports have mirror $Z$ values near the midplane,
    while upper-port launchers occupy elevated $Z$ positions depending on machine
    geometry and plasma shaping requirements. The [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror)
    parametrizes the mirror rotation that steers the beam poloidally, while the mirror
    boundary in its local planar frame is described by [x1_coordinate_of_electron_cyclotron_launcher_mirror](name:x1_coordinate_of_electron_cyclotron_launcher_mirror)
    and [x2_coordinate_of_electron_cyclotron_launcher_mirror](name:x2_coordinate_of_electron_cyclotron_launcher_mirror).
    For an analogous position coordinate of a different heating system, see [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector).


    Sign convention: Positive when the mirror center is located above the machine
    midplane in the direction of increasing $Z$.'
  unit: m
  physics_domain: auxiliary_heating
