- name: thickness_of_bragg_crystal
  kind: scalar
  status: active
  description: Physical thickness of a Bragg crystal is the normal material thickness
    measured between its opposing surfaces along the local surface normal. It excludes
    the X-ray ray-path length through the crystal, which depends on incidence geometry.
  documentation: 'Physical thickness of a Bragg crystal is the geometric separation
    of its opposing crystal surfaces measured along the local surface normal. It is
    a property of the crystal body, independent of the direction taken by an incident
    or diffracted X-ray ray.


    The local normal thickness is defined by


    $$

    t = \left| (\mathbf{x}_2 - \mathbf{x}_1) \cdot \hat{\mathbf{n}} \right|

    $$


    where $t$ is the Bragg-crystal thickness in meters, $\mathbf{x}_1$ and $\mathbf{x}_2$
    are corresponding points on the two opposing crystal surfaces in meters, and $\hat{\mathbf{n}}$
    is the unit normal to the local surface at $\mathbf{x}_1$.


    This quantity excludes the oblique material path length of an X-ray through the
    crystal; for an ideal flat slab that path length also depends on the ray angle
    relative to the local normal. It is distinct from [bragg_crystal_width](name:bragg_crystal_width)
    and height_of_bragg_crystal, which are tangential dimensions of the crystal element.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bragg_crystal_width
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-thickness
    dd_documentation:
      leaf: Thickness of the crystal
      parent_path: spectrometer_x_ray_crystal/channel/crystal
      parent: Characteristics of the crystal used
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Physical thickness of the Bragg crystal used in an X-ray crystal
        spectrometer channel. A geometric parameter relevant to X-ray absorption,
        diffraction efficiency, and spectral resolution.
      kind: llm
- name: thickness_of_filter
  kind: scalar
  status: active
  description: Geometric thickness of one diagnostic filter window, determining the
    amount of material available for photon attenuation and spectral selection.
  documentation: 'Filter thickness is the geometric separation of the two opposing
    surfaces of one filter window, measured locally along the material normal. It
    represents the material thickness itself rather than a photon path length through
    the window.


    For corresponding points on the opposing surfaces, the local thickness is defined
    by


    $$

    d = \left| (\mathbf{r}_2 - \mathbf{r}_1) \cdot \hat{\mathbf{n}} \right|

    $$


    where $d$ is the filter thickness, $\mathbf{r}_1$ and $\mathbf{r}_2$ are the position
    vectors of the corresponding surface points, and $\hat{\mathbf{n}}$ is the local
    unit normal to the filter surface.


    This quantity applies to the material of a single filter window used for X-ray
    spectral selection, including soft-X-ray, hard-X-ray, and crystal-spectrometer
    filter windows. It is not a sum over multiple windows, diagnostic channels, or
    detector elements, and it is distinct from the longer oblique photon path through
    the material.


    For homogeneous material at normal incidence, thickness enters the attenuation
    relation $T(E) = \exp[-\mu(E)d]$, where $T(E)$ is photon transmission at energy
    $E$, $E$ is photon energy, and $\mu(E)$ is the material attenuation coefficient.
    Thus, thickness is a geometric input to [spectral absorptivity of the filter](name:spectral_absorptivity_of_filter),
    whereas [filter width](name:width_of_filter) describes the wavelength span of
    the transmitted passband rather than the material dimension.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: camera_x_rays/filter_window/thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-filter_window-thickness
    dd_documentation:
      leaf: Thickness of the filter window
      parent_path: camera_x_rays/filter_window
      parent: Characteristics of the filter window
      data_type: FLT_0D
      unit: m
      lifecycle_status: alpha
    enhanced_context:
      description: Physical thickness of the filter window in an X-ray camera diagnostic.
        Determines the spectral transmission, photon absorption, and effective energy
        passband of the detected X-ray emission.
      kind: llm
