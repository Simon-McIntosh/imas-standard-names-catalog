- name: vertical_coordinate_of_oblique_reference_point
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the reference point of an oblique cross-section\
    \ geometry element, measured along the machine symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical coordinate $Z$ locates the reference point of an oblique\
    \ geometry element along the machine symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $Z$ is the height measured in meters. This reference\
    \ point \u2014 marked conventionally by a '+' in oblique cross-section diagrams\
    \ \u2014 serves as the origin from which the orientation angles $\\alpha$ and\
    \ $\\beta$ of the oblique element are defined, making it the geometric anchor\
    \ for the full specification of the element's shape and attitude. Together with\
    \ the companion [major-radius coordinate](name:major_radius_of_oblique_geometry),\
    \ the $(R, Z)$ pair fully specifies the location of this anchor point in the poloidal\
    \ plane. Oblique cross-section elements appear in poloidal-field coils, passive\
    \ conductors, ferritic inserts, ion-cyclotron antenna straps, and iron-core segments;\
    \ the reference-point coordinates are used in inductance and field calculations\
    \ for device modeling. Typical $Z$ values span the machine height, roughly $-5$\
    \ m to $+5$ m for large tokamaks, depending on the vertical extent of the device.\
    \ The analogous point coordinates for other geometry types are [vertical_coordinate_of_rectangular_element_center](name:vertical_coordinate_of_rectangular_element_center)\
    \ and [vertical_coordinate_of_first_point_of_thick_line](name:vertical_coordinate_of_first_point_of_thick_line).\
    \ This quantity is the vertical projection of [coordinate_of_oblique_reference_point](name:coordinate_of_oblique_reference_point).\n\
    \nSign convention: Positive when the reference point lies above the machine midplane\
    \ in the direction of increasing $Z$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_oblique_geometry
  - name:vertical_coordinate_of_rectangular_element_center
  - name:vertical_coordinate_of_first_point_of_thick_line
