- name: flux_surface_averaged_major_radius
  kind: scalar
  status: active
  description: "Flux-surface-averaged nonnegative perpendicular distance from the\
    \ toroidal symmetry axis to points on a nested magnetic flux surface, giving the\
    \ mean major-radius coordinate in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Major radius is the nonnegative perpendicular distance from the
    toroidal symmetry axis to a geometric point or specified location. For this flux-surface-averaged
    quantity, that distance is averaged over each nested magnetic flux surface in
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.


    The flux-surface average of major radius is defined by


    $$

    \langle R\rangle_\psi = \frac{\oint_\psi R\,dl/B_p}{\oint_\psi dl/B_p}

    $$


    where $\langle R\rangle_\psi$ is the averaged major-radius coordinate, $\psi$
    is the magnetic-flux label identifying the surface, $l$ is poloidal arc length
    along that surface, and $B_p$ is the magnitude of the poloidal magnetic field.
    The contour integral extends around the complete poloidal intersection of the
    nested magnetic flux surface.


    This quantity applies to a complete magnetic flux surface and aggregates the local
    [major radius] using the flux-surface weighting defined by the inverse poloidal-field
    magnitude. It is therefore distinct from pointwise major radius and contains no
    point-specific or localized evaluation.


    The quantity is the flux-surface-averaged counterpart of [major radius]. It must
    not be confused with [flux-surface-averaged inverse of major radius](name:flux_surface_averaged_inverse_of_major_radius),
    which averages the reciprocal $1/R$ rather than averaging $R$ itself; consequently,
    it is not generally the reciprocal of that neighboring average.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_inverse_of_major_radius
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/gm8
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-gm8
