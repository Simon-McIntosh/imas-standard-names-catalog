- name: squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the plasma boundary,
    measuring the signed departure of the boundary corners from the reference ellipse
    defined by the elongation and triangularity shape parameters.
  documentation: 'The squareness of the plasma boundary is a dimensionless Luce shape
    coefficient that quantifies how much the corners of the poloidal cross-section
    depart from the reference ellipse parameterized by size, [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),
    and triangularity. A positive value indicates corners that bulge outward beyond
    the reference ellipse, giving a more rectangular cross-section; a negative value
    indicates corners that indent inward, producing a more rounded, over-elliptic
    shape. This general quantity subsumes the [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)
    characterizing the high-field-side boundary and the [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    characterizing the low-field-side corners.


    In the Luce boundary parameterization, the squareness $\zeta$ enters as the coefficient
    of a $\sin(2\theta)$ angular distortion term in the poloidal angle mapping:


    $$

    \theta_b(\theta) = \theta + \arcsin(\delta)\sin\theta + \zeta\sin(2\theta)

    $$


    where $\theta$ is the poloidal parameter angle, $\delta$ is the triangularity,
    and $\theta_b$ is the effective angle determining the boundary coordinates in
    the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius and
    $Z$ the vertical height. The $\sin(2\theta)$ factor peaks at the corner positions
    ($\theta = \pi/4, 3\pi/4, 5\pi/4, 7\pi/4$), concentrating the squareness effect
    at the corners while leaving the outboard midplane and top/bottom extrema unaffected.


    The squareness is inferred from equilibrium reconstruction by fitting the parametric
    boundary form to measured plasma shape data; quadrant-resolved values are accessible
    as [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary).
    Typical values in shaped tokamak plasmas range from approximately $-0.5$ to $+0.5$.


    Sign convention: Positive when the plasma boundary corner regions lie outside
    the reference ellipse defined by the elongation and triangularity, corresponding
    to a more rectangularly squared cross-sectional shape.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:inner_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_plasma_boundary
  sources:
  - id: derived:squareness_of_plasma_boundary
    status: composed
- name: inner_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness parameter for the inboard (high-field-side)
    plasma boundary, measuring the departure of the inner corners from the reference
    ellipse set by minor radius, elongation, and triangularity; parent of the upper-inner
    and lower-inner quadrant components.
  documentation: 'The inner squareness of the plasma boundary is the dimensionless
    Luce shape coefficient quantifying how much the inboard (smaller major-radius)
    portion of the last-closed flux surface deviates from the reference ellipse determined
    by the boundary minor radius, the inner-side elongation, and the inner-side triangularity.
    It is the high-field-side counterpart to the outer squareness and serves as the
    parent quantity encompassing the quadrant-specific [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary)
    (above-midplane, inboard) and [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    (below-midplane, inboard).


    In the Luce higher-order boundary parameterization, the inboard boundary contour
    in a poloidal cross-section at fixed toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame is described by a $\sin(2\theta)$ correction
    to the standard elliptical shape:


    $$

    R(\theta) = R_0 - a\cos\!\bigl(\theta + \arcsin(\delta_{\mathrm{i}})\sin\theta
    - \zeta_{\mathrm{i}}\sin(2\theta)\bigr)

    $$


    where $R_0$ is the major radius of the magnetic axis, $a$ is the boundary minor
    radius, $\delta_{\mathrm{i}}$ is the inner triangularity, $\theta$ is the poloidal
    parametric angle, and $\zeta_{\mathrm{i}}$ is the inner squareness. An analogous
    form $Z(\theta) = a\kappa_{\mathrm{i}}\sin(\theta + \zeta_{\mathrm{i}}\sin(2\theta))$
    governs the vertical extent with inner elongation $\kappa_{\mathrm{i}}$.


    This parameter is inferred from equilibrium reconstruction by fitting the Luce
    boundary representation to the geometry of the last-closed flux surface. It extends
    [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary) and complements
    [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary) for complete
    higher-order boundary characterization. Typical values of $\zeta_{\mathrm{i}}$
    lie in the range $-0.5$ to $0.5$ for conventional tokamak configurations.


    Sign convention: Positive when the inboard boundary corners are more rectangular
    than the reference ellipse; negative when the corners are more pointed (diamond-like).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_inner_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: inner
    operator_kind: qualifier
- name: lower_inner_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless shape parameter quantifying the deviation of the lower
    inner quadrant of the plasma cross-section from a reference ellipse, as part of
    the higher-order Luce boundary parameterization.
  documentation: "The lower inner squareness $\\zeta_{LI}$ characterizes how much\
    \ the plasma boundary in the lower inner quadrant \u2014 below the equatorial\
    \ plane and on the high-field inboard side \u2014 departs from the reference ellipse\
    \ defined by the plasma elongation $\\kappa$ and triangularity $\\delta$. It is\
    \ a higher-order geometric shape descriptor that refines the plasma boundary representation\
    \ beyond what elongation and triangularity alone can capture.\n\nIn the Luce boundary-shape\
    \ framework, the plasma cross-section is divided into four quadrants, each assigned\
    \ an independent squareness coefficient $\\zeta$ to represent up-down and inner-outer\
    \ asymmetries. A value of zero indicates that the boundary in the lower inner\
    \ quadrant coincides exactly with the local reference ellipse; positive values\
    \ indicate the boundary extends beyond the ellipse (producing a squarer, more\
    \ rectangular profile in that quadrant), while negative values indicate the boundary\
    \ lies inward of the ellipse (a more rounded profile).\n\nThis coefficient is\
    \ inferred from equilibrium reconstruction by fitting the reconstructed plasma\
    \ boundary contour \u2014 derived primarily from magnetic diagnostics and boundary\
    \ position measurements \u2014 to the higher-order shape parameterization. It\
    \ is the lower-half counterpart of [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),\
    \ and together with [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary)\
    \ and [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),\
    \ provides the complete quadrant-resolved squareness description of the plasma\
    \ boundary, complementing the [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)\
    \ aggregate.\n\nTypical values in diverted tokamak plasmas range from approximately\
    \ $-0.4$ to $0.4$, with the sign and magnitude sensitive to X-point position,\
    \ divertor geometry, and poloidal field coil configuration.\n\nSign convention:\
    \ Positive when the lower inner quadrant of the plasma boundary extends outward\
    \ beyond the reference ellipse, producing a squarer cross-section profile in that\
    \ region."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_inner_squareness_of_plasma_boundary
  - name:lower_outer_squareness_of_plasma_boundary
  - name:inner_squareness_of_plasma_boundary
  arguments:
  - name: inner_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/boundary/squareness_lower_inner
    dd_path: equilibrium/time_slice/boundary/squareness_lower_inner
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/squareness_lower_inner
    dd_path: equilibrium/time_slice/boundary_separatrix/squareness_lower_inner
    status: attached
- name: outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient measuring how both outboard (low-field-side)
    corners of the plasma boundary depart from the reference ellipse defined by minor
    radius, elongation, and triangularity.
  documentation: 'The outer squareness of the plasma boundary is the Luce (2013) dimensionless
    shape coefficient characterizing how the low-field-side (large-$R$) corners of
    the last-closed flux surface poloidal cross-section depart from the reference
    ellipse defined by the boundary minor radius $a$, elongation $\kappa$, and triangularity
    $\delta$. It is the parent quantity for [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    which resolve the upper-outboard and lower-outboard corner contributions separately.


    A positive outer squareness indicates the outboard corners of the plasma cross-section
    lie outside the reference ellipse (a more rectangular boundary), while a negative
    value indicates inward concavity at the outboard corners. The outer squareness
    is particularly sensitive to X-point geometry and the configuration of low-field-side
    shaping coils, making it relevant to heat-load distribution and edge stability.


    Outer squareness is inferred from equilibrium reconstruction by fitting the poloidal
    boundary contour $\{R(\xi), Z(\xi)\}$, where $\xi$ is a poloidal parameter, to
    external magnetic measurements and internal constraints. The global single-coefficient
    summary is provided by [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary),
    while the high-field-side corner contributions are captured by [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    and [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary).


    Sign convention: Positive when the outer boundary corner lies outside the reference
    ellipse at the corner poloidal angle, i.e., the outboard boundary is displaced
    toward larger minor radius relative to the inscribed ellipse in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is vertical
    height.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_outer_squareness_of_plasma_boundary
  - name:lower_outer_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: outer
    operator_kind: qualifier
- name: lower_outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Shape parameter for the lower outer quadrant of the plasma cross-section
    boundary measuring its deviation from an inscribed ellipse, following the Luce
    (2013) four-corner squareness decomposition.
  documentation: 'The lower outer squareness $\zeta_{lo}$ is one of four corner-specific
    shape parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the lower outer quadrant of the plasma cross-section boundary deviates
    from an inscribed ellipse with the same elongation and triangularity. The lower
    outer quadrant spans the outboard lower region of the cross-section, characterized
    by increasing major radius $R$ and decreasing height $Z$ from the geometric midplane.


    In the Luce framework the boundary near each corner is locally fitted by a superellipse
    whose exponent $n_{lo}$ controls the corner curvature:


    $$

    \zeta_{lo} = 1 - \frac{2}{n_{lo}}

    $$


    where $n_{lo} = 2$ corresponds to a pure ellipse ($\zeta_{lo} = 0$), $n_{lo} >
    2$ produces more rectangular corners ($\zeta_{lo} > 0$), and $n_{lo} < 2$ produces
    more rounded corners ($\zeta_{lo} < 0$). The squareness parameters capture fourth-order
    boundary shaping effects that are independent of elongation and triangularity.


    The squareness parameters are obtained from equilibrium reconstructions by fitting
    the reconstructed last-closed flux surface or separatrix boundary contour. They
    are particularly relevant for diverted configurations where divertor geometry
    shapes the lower boundary region.


    Typical values of $\zeta_{lo}$ in tokamak plasmas range from approximately $-0.3$
    to $+0.3$. Together with [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    and [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    it completes the four-corner boundary shape decomposition; the parent quantity
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    describes outer-quadrant squareness without the upper/lower distinction.


    Sign convention: Positive when the lower outer quadrant of the boundary protrudes
    further outward than the ellipse inscribed at the same elongation and triangularity.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
  arguments:
  - name: outer_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
