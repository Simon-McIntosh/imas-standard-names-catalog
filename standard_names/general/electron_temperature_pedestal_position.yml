name: electron_temperature_pedestal_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate $\psi_N$ at the center of the electron
  temperature pedestal in H-mode plasmas.
documentation: "The electron temperature pedestal position gives the $\\psi_N$ location\
  \ (normalized poloidal flux, dimensionless, 0 at the magnetic axis, 1 at the separatrix)\
  \ of the midpoint of the steep-gradient region in the $T_e$ profile. It is extracted\
  \ from mtanh or piecewise-linear fits to edge Thomson scattering or electron cyclotron\
  \ emission (ECE) data. In typical H-mode discharges, this position lies at $\\psi_N\
  \ \\approx 0.93$\u2013$0.98$, and it can differ from the density or pressure pedestal\
  \ position, reflecting different transport mechanisms governing heat versus particle\
  \ channels. The $T_e$ pedestal position, together with its width and height, constrains\
  \ edge stability and ELM frequency models. See also `electron_temperature_pedestal_width`,\
  \ `electron_pressure_pedestal_position`."
