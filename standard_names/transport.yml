- name: safety_factor_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Safety factor q at the radial location of an internal transport barrier,
    where steep gradients in rotation and pressure reduce turbulent transport.
  documentation: "The safety factor $q$ is defined as $q = \\frac{d\\Phi}{d\\Psi}\
    \ / (2\\pi)$, where $\\Phi$ is the toroidal magnetic flux and $\\Psi$ is the poloidal\
    \ magnetic flux. This ratio measures the helicity of magnetic field lines in a\
    \ toroidal plasma confinement device.\n\nAt the internal transport barrier (ITB)\
    \ location, the safety factor often exhibits a local plateau or reversed shear\
    \ profile that contributes to the formation of the barrier. Typical values at\
    \ an ITB depend on the plasma scenario: for a monotonic $q$-profile, the ITB may\
    \ occur at $q \\sim 1.5$\u2013$3$; for a reversed-shear scenario, the ITB radius\
    \ can coincide with the minimum $q$ value $q_\\mathrm{min}$ which may be in the\
    \ range $2$\u2013$4$.\n\nThis quantity is the value of $q$ evaluated at the radial\
    \ position where the ITB is identified, typically from profiles of ion temperature,\
    \ electron temperature, toroidal rotation, or density.\n\nSign convention: Positive\
    \ when $q$ is defined in the right-handed $(R, \\phi, Z)$ cylindrical basis, corresponding\
    \ to the usual toroidal-poloidal sense."
  unit: '1'
  physics_domain: transport
  links:
  - name:safety_factor_at_separatrix
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/q/value
    dd_path: summary/local/itb/q/value
    status: composed
- name: thermal_electron_density
  kind: scalar
  status: draft
  description: Number density of the bulk thermal electron population, following a
    Maxwellian velocity distribution.
  documentation: 'The thermal electron density $n_{e,\mathrm{th}}$ represents the
    number of free electrons per unit volume in the thermal (Maxwellian) population
    of the plasma, excluding suprathermal or runaway electrons. It is a fundamental
    parameter in plasma transport, setting the plasma frequency $\omega_{pe} = \sqrt{n_{e,\mathrm{th}}
    e^2 / (m_e \epsilon_0)}$, the electron pressure $p_e = n_{e,\mathrm{th}} k_B T_e$,
    and the collision rates. Typical core values in tokamaks range from $10^{19}$
    to $10^{20}\,\mathrm{m}^{-3}$, while the scrape-off layer density is typically
    $10^{18} \,\mathrm{m}^{-3}$ or lower. This quantity is routinely measured by interferometry,
    reflectometry, and Langmuir probes, and is distinguished from the total electron
    density by excluding the fast electron component. It is closely related to [thermal_electron_pressure](name:thermal_electron_pressure)
    and [electron_density](name:electron_density).


    Sign convention: Positive when the number of thermal electrons per unit volume
    is positive.


    For transport modeling, the thermal electron density profile is a key input to
    the electron density gradient drive for turbulence and the bootstrap current calculation.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:thermal_electron_pressure
  - name:electron_density
  sources:
  - id: dd:plasma_profiles/profiles_1d/electrons/density_thermal
    dd_path: plasma_profiles/profiles_1d/electrons/density_thermal
    status: composed
  - id: dd:turbulence/profiles_2d/electrons/density_thermal
    dd_path: turbulence/profiles_2d/electrons/density_thermal
    status: composed
- name: thermal_electron_pressure
  kind: scalar
  status: draft
  description: Isotropic thermal pressure of the bulk Maxwellian electron population,
    arising from random thermal motion and excluding suprathermal contributions.
  documentation: "The thermal electron pressure $p_{e,\\mathrm{th}} = n_e k_B T_e$\
    \ is the isotropic scalar pressure of the bulk Maxwellian electron population,\
    \ where $n_e$ is the electron density and $T_e$ is the electron temperature. This\
    \ quantity excludes the pressure contribution from fast (suprathermal) electrons;\
    \ the total electron pressure is the sum $p_{e,\\mathrm{total}} = p_{e,\\mathrm{th}}\
    \ + p_{e,\\mathrm{fast}}$. The thermal electron pressure is routinely inferred\
    \ from Thomson scattering or electron cyclotron emission measurements of $n_e$\
    \ and $T_e$; typical core values in tokamak plasmas range from 10 to 500 kPa.\
    \ The thermal electron density [thermal_electron_density](name:thermal_electron_density)\
    \ is a closely related quantity, while the isotropic thermal pressure summed over\
    \ all species is captured by [thermal_pressure](name:thermal_pressure).\n\nSign\
    \ convention: Positive when the plasma exerts an outward isotropic force per unit\
    \ area.\n\nThe thermal electron pressure provides the dominant contribution to\
    \ the total plasma pressure in most fusion-relevant regimes and enters directly\
    \ into the radial force balance via the pressure-gradient drive for the diamagnetic\
    \ current and the Pfirsch\u2013Schl\xFCter current."
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_electron_density
  - name:thermal_pressure
  sources:
  - id: dd:plasma_profiles/profiles_1d/electrons/pressure_thermal
    dd_path: plasma_profiles/profiles_1d/electrons/pressure_thermal
    status: composed
- name: time_derivative_of_electron_density
  kind: scalar
  status: draft
  description: Temporal rate of change of the electron number density.
  documentation: The time derivative of the electron density, $\partial n_e / \partial
    t$, represents the net rate of change of the free electron population per unit
    volume, including contributions from ionization, recombination, and transport
    processes. This quantity is the continuity-equation source term for the electron
    density evolution, where positive values indicate increasing electron inventory
    and negative values indicate net loss. In fusion plasmas, it is inferred from
    diagnostic time traces of line-averaged density (interferometry) or volume-averaged
    density, with typical core magnitudes of $10^{19}$--$10^{21}$ m$^{-3}$ s$^{-1}$
    during density ramps, transients, or pellet injection events. The time derivative
    is linked to the particle sources and sinks in the electron continuity equation
    and provides a global measure of density evolution that complements the local
    profiles of `[electron_density](name:electron_density)` and its radial gradient.
  unit: m^-3.s^-1
  physics_domain: transport
  links:
  - name:electron_density
  arguments:
  - name: electron_density
    operator: time_derivative
    operator_kind: unary_prefix
  sources:
