name: flux_surface_area
status: draft
cocos_transformation_type: one_like
description: Surface area of a toroidal flux surface, obtained by integrating the
  area element over the full poloidal and toroidal extent of the surface.
documentation: "The flux surface area $A(\\psi)$ is the total area of the axisymmetric\
  \ toroidal surface labeled by poloidal flux $\\psi$. It is computed as $$A(\\psi)\
  \ = \\oint_{\\text{pol}} \\int_0^{2\\pi} R\\,\\sqrt{(dR)^2 + (dZ)^2}\\,d\\phi\\\
  ,,$$ where $R$ is the major radius (m) and $Z$ is the vertical coordinate (m) of\
  \ a point on the flux surface, and $\\phi$ is the toroidal angle. This quantity\
  \ appears in flux-surface-averaged transport equations, where one-dimensional radial\
  \ profiles of heat and particle fluxes are expressed per unit surface area. Typical\
  \ values range from $\\sim$1 m$^2$ near the magnetic axis to $\\sim$100\u2013200\
  \ m$^2$ at the last closed flux surface for medium-size tokamaks (e.g., DIII-D,\
  \ ASDEX-Upgrade), scaling up to $\\sim$800 m$^2$ at the separatrix for ITER-class\
  \ devices. The surface area is a strictly positive, monotonically increasing function\
  \ of the enclosed poloidal flux. It is closely related to the enclosed plasma volume\
  \ $V(\\psi)$ via $dV/d\\rho = A\\, |\\nabla \\rho|^{-1}$, where $\\rho$ is the radial\
  \ coordinate. It is derived from equilibrium reconstruction codes (EFIT, LIUQE,\
  \ VMEC) alongside the magnetic geometry. See also `flux_surface_cross_sectional_area`\
  \ for the poloidal cross-sectional area, `plasma_volume_inside_flux_surface` for\
  \ the enclosed volume, and `toroidal_magnetic_flux` for the flux label."
