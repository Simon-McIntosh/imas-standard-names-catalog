- name: line_averaged_krypton_density
  kind: scalar
  status: active
  description: Line-averaged krypton density is the chord-length average of the total
    local krypton number density, summed over all charge states from neutral krypton
    through fully stripped krypton.
  documentation: 'Line-averaged krypton density is the chord-length average of the
    total local krypton number density. It includes every krypton charge state, so
    it measures elemental krypton abundance along a specified line of sight rather
    than the density of one particular ionization state.


    For a chord parameterized by path length, the line average is defined by:


    $$

    \langle n_\mathrm{Kr} \rangle_\mathrm{line} = \frac{1}{L}\int_0^L \sum_{q=0}^{36}
    n_\mathrm{Kr}^{(q)}(\ell)\,d\ell = \frac{1}{L}\int_0^L n_\mathrm{Kr}(\ell)\,d\ell

    $$


    where $\langle n_\mathrm{Kr} \rangle_\mathrm{line}$ has units of $\mathrm{m}^{-3}$,
    $L$ is the chord length in meters, $\ell$ is distance along the chord in meters,
    $q$ is the integer charge-state index with $q=0$ for neutral krypton and $q=36$
    for fully stripped krypton, $n_\mathrm{Kr}^{(q)}$ is the local density of charge
    state $q$ in $\mathrm{m}^{-3}$, and $n_\mathrm{Kr}=\sum_{q=0}^{36} n_\mathrm{Kr}^{(q)}$
    is the charge-state-summed local [krypton_density](name:krypton_density).


    This quantity is a normalized path mean, not an unnormalized line integral. It
    differs from [volume_averaged_krypton_density](name:volume_averaged_krypton_density),
    which averages the same charge-state-summed local density over a plasma volume
    rather than along a chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:krypton_density
  - name:volume_averaged_krypton_density
  arguments:
  - name: krypton_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
