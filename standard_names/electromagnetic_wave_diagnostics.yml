- name: perpendicular_refractive_index
  kind: scalar
  status: active
  description: Projection magnitude of the refractive-index vector onto the plane
    perpendicular to the local equilibrium magnetic field, equal to the perpendicular
    wave-vector magnitude normalized by the vacuum wave number.
  documentation: 'The perpendicular refractive index $N_\perp$ is the magnitude of
    the component of the refractive-index vector projected onto the plane perpendicular
    to the local equilibrium magnetic field direction. It is the field-normal part
    of the dimensionless wave-propagation vector used to describe electromagnetic
    waves in a magnetized plasma.


    The defining relation is:


    $$

    N_\perp = \left|\mathbf{N} - (\mathbf{N}\cdot\hat{b})\hat{b}\right|, \qquad \mathbf{N}=\frac{\mathbf{k}}{k_0},
    \qquad k_0=\frac{\omega}{c}

    $$


    where $\mathbf{N}$ is the refractive-index vector, $\mathbf{k}$ is the local wave
    vector, $k_0$ is the vacuum wave number, $\omega$ is angular frequency, $c$ is
    the speed of light in vacuum, and $\hat{b}=\mathbf{B}/|\mathbf{B}|$ is the unit
    vector along the local equilibrium magnetic field.


    This scalar is the nonnegative magnitude of the perpendicular projection, not
    a signed projection along a chosen transverse basis direction. Together with the
    [parallel refractive index](name:parallel_refractive_index) $N_\parallel=\mathbf{N}\cdot\hat{b}$,
    it satisfies $N_\perp^2+N_\parallel^2=|\mathbf{N}|^2$; the corresponding unnormalized
    quantity is the [perpendicular wave-vector magnitude](name:perpendicular_wave_vector_magnitude).'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_refractive_index
  - name:refractive_index
  arguments:
  - name: refractive_index
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
