- name: neutron_source_energy_bin_center
  kind: scalar
  status: draft
  description: Central energy value of a discrete bin defining the energy axis of
    a neutron source spectrum, used as an abscissa coordinate in Green function response
    matrices for neutron diagnostics.
  documentation: Each element of this quantity gives the midpoint energy $E_c$ of
    an energy bin on the neutron source energy axis, defined as $E_c = (E_{\rm low}
    + E_{\rm high})/2$ where $E_{\rm low}$ and $E_{\rm high}$ are the lower and upper
    bin edges. Bin-center energies serve as the abscissa for tabulating neutron production
    spectra and response kernels; the bin-center convention ensures that numerical
    integrals over the spectrum are evaluated at the representative energy of each
    interval rather than at an edge. This quantity plays the same axial role as [neutron_source_energy_grid_point](name:neutron_source_energy_grid_point),
    but is specifically the geometric midpoint of each energy interval rather than
    a general grid-point value, which matters when bins are non-uniform in width.
    Typical source neutron energies of interest range from approximately $10^4$ eV
    for thermal contributions up to $1.4 \times 10^7$ eV for D-T fusion neutrons,
    with D-D neutrons near $2.45 \times 10^6$ eV. Related spectral axis quantities
    include [neutron_detection_band_energy_grid_point](name:neutron_detection_band_energy_grid_point)
    for detector-side energy bands and [neutron_energy_band_sample](name:neutron_energy_band_sample)
    for intra-band sampling.
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
