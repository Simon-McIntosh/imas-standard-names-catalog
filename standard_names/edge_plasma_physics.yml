    status: composed
- name: vertical_current_density_due_to_inertial
  kind: scalar
  status: draft
  description: Vertical (Z) component of the current density arising from the ion
    polarization drift in the edge plasma.
  documentation: "The vertical component $j_{\\text{inertial},Z}$ of the inertial\
    \ current density vector represents the projection onto the $+\\hat{Z}$ axis of\
    \ the current driven by the ion polarization drift $\\mathbf{j}_{\\text{inertial}}\
    \ = (m_i n_i / B^2) \\, d\\mathbf{E}_\\perp / dt$. This component arises from\
    \ the time-varying perpendicular electric field and contributes to the radial\
    \ force balance in the edge plasma, particularly during transient events such\
    \ as edge-localized modes (ELMs). Typical magnitudes in the pedestal region range\
    \ from 1 to 100 kA/m\xB2 for medium-size tokamaks. The full vector is described\
    \ by [current_density_due_to_inertial](name:current_density_due_to_inertial);\
    \ the radial counterpart is [radial_current_density_due_to_inertial](name:radial_current_density_due_to_inertial).\n\
    \nSign convention: Positive when the current density flows in the direction of\
    \ increasing vertical coordinate $Z$ (upward in the machine cylindrical $(R, \\\
    phi, Z)$ frame)."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
