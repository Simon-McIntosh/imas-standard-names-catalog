    dd_path: polarimeter/channel/wavelength
    status: attached
  - id: dd:thomson_scattering/laser/wavelength
    dd_path: thomson_scattering/laser/wavelength
    status: attached
- name: width_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Full aperture width of a reflectometer antenna along one transverse
    dimension of the local orthogonal (X1, X2) antenna frame, applicable when the
    aperture is described by a rectangular geometry.
  documentation: "The width characterizes the physical extent of a reflectometer antenna\
    \ aperture along one of the two transverse axes of the local orthogonal (X1, X2)\
    \ frame used to describe the antenna geometry. It applies to both emission and\
    \ detection antennas in reflectometry diagnostics and is defined when the aperture\
    \ shape is rectangular; a companion dimension specifies the orthogonal transverse\
    \ extent.\n\nFor a rectangular aperture, the width $d$ along each transverse axis\
    \ governs the far-field beam divergence, with the diffraction half-angle scaling\
    \ as $\\theta \\approx \\lambda / d$, where $\\lambda$ is the probing wavelength.\
    \ Larger apertures produce more collimated beams and sharper spatial localization\
    \ of the reflection layer along the probing path. The aperture geometry is complemented\
    \ by the outline vertex coordinates [x1_coordinate_of_reflectometer_antenna](name:x1_coordinate_of_reflectometer_antenna)\
    \ and [x2_coordinate_of_reflectometer_antenna](name:x2_coordinate_of_reflectometer_antenna),\
    \ which define the full aperture shape. The analogous quantity for optical focusing\
    \ elements is [optical_element_width](name:optical_element_width).\n\nThis is\
    \ a fixed hardware parameter set by the physical waveguide or horn antenna dimensions\
    \ at the diagnostic port. It is used in beam characterization models to compute\
    \ antenna radiation patterns and to assess spatial resolution for density profile\
    \ or fluctuation measurements. Typical aperture widths for fusion microwave reflectometer\
    \ antennas range from about 1\u201320 cm, depending on the probing frequency band\
    \ (typically 15\u2013150 GHz) and the waveguide standard employed.\n\nSign convention:\
    \ Positive for all physically realizable apertures; the width is a non-negative\
    \ spatial extent that does not depend on the orientation of the ambient coordinate\
    \ system."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
