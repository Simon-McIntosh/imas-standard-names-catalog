- name: midplane_thickness_of_cryostat_vessel_block
  kind: scalar
  status: draft
  description: Wall thickness of a cryostat vessel block element measured perpendicular
    to the local vessel surface at the machine midplane (Z = 0). This is a non-negative
    geometric quantity expressing the local material extent between the inner and
    outer faces of the vessel wall at the equatorial plane.
  documentation: "The midplane thickness $t$ of a cryostat vessel block element is\
    \ defined as the perpendicular distance between the inner and outer surfaces of\
    \ the vessel wall, evaluated at the equatorial plane $Z = 0$ of the machine cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is the major radius from the machine symmetry\
    \ axis and $Z$ is the vertical height.\n\nFormally, if $\\mathbf{n}$ is the outward\
    \ unit normal to the vessel mid-surface at the midplane intersection point, and\
    \ $r_\\mathrm{in}$ and $r_\\mathrm{out}$ are the positions of the inner and outer\
    \ surfaces along $\\mathbf{n}$, then\n$$t = r_\\mathrm{out} - r_\\mathrm{in} \\\
    geq 0.$$\nThis wall-normal convention distinguishes $t$ from a purely radial or\
    \ vertical coordinate separation, which would differ for curved or tilted vessel\
    \ walls. The non-negativity constraint $t \\geq 0$ holds by definition; a value\
    \ of zero indicates a degenerate or absent element at the midplane.\n\nFor a large\
    \ tokamak cryostat, vessel wall thicknesses at the midplane typically lie in the\
    \ range $0.02$\u2013$0.20$ m, with thicker sections near structural supports or\
    \ penetrations. The midplane is often the location of peak thermal flux and of\
    \ primary structural loads in hoop tension, making the local wall thickness a\
    \ critical parameter for section-modulus and heat-conduction computations. However,\
    \ the quantity itself is purely geometric \u2014 it represents only the material\
    \ extent of the vessel wall and carries no embedded load or thermal assumption.\n\
    \nWhen the vessel cross-section is not circular in the poloidal plane, the midplane\
    \ intersection may intersect multiple shell segments; in such cases $t$ refers\
    \ to the thickness of the individual block element at its midplane crossing point,\
    \ not to any aggregate or average over the full cross-section.\n\nTypical units:\
    \ meters (m). Non-negative by definition."
  unit: m
  physics_domain: structural_components
  links:
  - name:midplane_thickness_of_thermal_shield_element
  - name:annular_layer_thickness
  - name:midplane_thickness_of_breeding_blanket_layer
  constraints: []
