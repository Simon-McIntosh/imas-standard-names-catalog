name: radial_component_of_beam_tracing_wavevector
status: draft
description: Major-radius ($R$) component of the wavevector along a beam-tracing ray
  trajectory.
documentation: "The radial wavevector component $k_R$ is the projection of the local\
  \ wavevector $\\mathbf{k}$ of a coherent wave beam onto the major-radius direction\
  \ $\\hat{R}$ in the tokamak cylindrical coordinate system $(R, \\phi, Z)$. In geometrical-optics\
  \ and beam-tracing formalisms (e.g., TORBEAM, GRAY, C3PO), $k_R$ evolves along the\
  \ ray according to Hamilton's equations $dR/d\\tau = \\partial \\mathcal{H}/\\partial\
  \ k_R$ and $dk_R/d\\tau = -\\partial \\mathcal{H}/\\partial R$, where $\\mathcal{H}(\\\
  mathbf{x}, \\mathbf{k}, \\omega)$ is the wave Hamiltonian and $\\tau$ is the ray\
  \ parameter. Typical magnitudes for electron cyclotron waves at $f \\sim 170\\;\\\
  mathrm{GHz}$ are $|k_R| \\sim 10$\u2013$40\\;\\mathrm{m^{-1}}$ in the plasma core.\
  \ Together with the vertical and toroidal wavevector components, $k_R$ fully specifies\
  \ the local propagation direction and is essential for computing refraction, absorption,\
  \ and current-drive profiles. Positive $k_R$ corresponds to propagation toward larger\
  \ major radius. See also `radial_component_of_ion_velocity` and `radial_component_of_electron_velocity`\
  \ for analogous radial projections of fluid quantities."
