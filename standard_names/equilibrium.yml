- name: major_radius
  kind: scalar
  status: active
  description: "Nonnegative perpendicular distance from the toroidal symmetry axis\
    \ to a point or defined location, serving as the major-radius coordinate in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Major radius is the nonnegative perpendicular distance from the
    toroidal symmetry axis to a geometric point or specified location. It is the radial
    coordinate $R$ in the right-handed cylindrical $(R,\phi,Z)$ frame and is independent
    of toroidal angle.


    Using a right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis with $\hat{z}=\hat{Z}$
    along the toroidal symmetry axis, it is defined by:


    $$

    R = \sqrt{X^2 + Y^2}

    $$


    where $X$ and $Y$ are the Cartesian coordinates perpendicular to the axis, and
    $R$ is the resulting distance. The cylindrical basis satisfies $\hat{R}\times\hat{\phi}=\hat{Z}$;
    $\phi$ is toroidal angle and $Z$ is vertical height.


    For an extended or derived quantity, major radius may be evaluated pointwise,
    averaged over a flux surface, fixed at a reference location, or combined algebraically
    with another quantity. Thus [flux-surface-averaged major radius](name:flux_surface_averaged_major_radius)
    is an average, whereas [reference major radius](name:reference_major_radius) identifies
    a fixed normalization location; products, ratios, and differences of major radii
    are derived quantities rather than alternate definitions of $R$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_major_radius
  - name:reference_major_radius
  sources:
  - dd_path: distributions/distribution/profiles_2d/grid/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/distributions.html#distributions-distribution-profiles_2d-grid-r
    dd_documentation:
      leaf: Major radius
      parent_path: distributions/distribution/profiles_2d/grid
