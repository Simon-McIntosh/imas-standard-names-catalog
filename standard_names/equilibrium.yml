- name: vertical_coordinate_of_second_point_of_thick_line
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the second endpoint of a thick-line cross-section
    geometry element in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The thick-line geometry element is a cross-sectional representation
    used for axisymmetric conducting structures such as poloidal field coils, passive
    loops, and iron core segments. It is defined by two endpoints; this quantity gives
    the $Z$ coordinate (height along the machine symmetry axis) of the second of those
    endpoints. Together with [vertical_coordinate_of_first_point_of_thick_line](name:vertical_coordinate_of_first_point_of_thick_line)
    and the corresponding major-radius coordinates, the two endpoints fully specify
    the orientation and extent of the thick-line element in the poloidal $(R, Z)$
    plane. The full position vector of this endpoint is given by [coordinate_of_second_point_of_thick_line](name:coordinate_of_second_point_of_thick_line),
    of which this quantity is the $Z$ projection. Typical values span the machine
    height range, roughly $-5$ m to $+5$ m for large tokamaks and $-2$ m to $+2$ m
    for medium-size devices. The coordinate is obtained from engineering design drawings
    or machine geometry surveys and enters equilibrium reconstruction codes as fixed
    geometric input.


    Sign convention: Positive when the second endpoint lies above the machine midplane,
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
