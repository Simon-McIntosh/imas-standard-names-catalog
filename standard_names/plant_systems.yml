    + \hat{n}_{\rm cone,y}^2 + \hat{n}_{\rm cone,z}^2 = 1$. This component is particularly
    sensitive to the elevation angle of the SPI injector and determines what fraction
    of the pellet fragment cloud travels along the vertical direction; typical values
    range from $-1$ (purely downward injection) to $+1$ (purely upward injection),
    with near-zero values for predominantly horizontal injectors. The unit vector
