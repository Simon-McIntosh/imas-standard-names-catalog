    and $\operatorname{Re}$ denotes the real-part operator.


    The complementary quadrature is [the imaginary part of the right-hand circularly
    polarized wave electric field](name:right_hand_circularly_polarized_wave_electric_field_imaginary_part);
    together, the real and imaginary quadratures reconstruct the parent complex phasor.'
