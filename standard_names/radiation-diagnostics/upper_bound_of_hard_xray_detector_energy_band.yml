name: upper_bound_of_hard_xray_detector_energy_band
description: Upper energy threshold of hard X-ray detector sensitive energy band.
documentation: |-
  Upper energy boundary of the hard X-ray detector's sensitive energy band. The upper limit defines the maximum photon energy to which the detector is sensitive, typically determined by detector material thickness and photon interaction cross-sections.

  Physical significance: The upper bound determines the maximum photon energy included in [hard_xray_emissivity](#hard_xray_emissivity) measurements. For runaway electron diagnostics, the upper bound is chosen to capture high-energy bremsstrahlung while avoiding saturation and pile-up effects. Multiple overlapping energy bands provide spectral information for temperature and [runaway_electron](#runaway_electron) energy distribution analysis.

  Measurement methods: Upper bound is set by detector saturation characteristics, pulse height analyzer settings, and physical detector thickness. CdTe detectors typically have upper limits of 100-300 keV, while scintillator-based systems can extend to several MeV. Calibration verifies response linearity up to the specified upper bound.

  Typical values: 100-500 keV for plasma diagnostic applications. Up to several MeV for runaway electron and gamma-ray studies. Higher bounds capture more energetic emission but may include unwanted background contributions.

  Sign convention: Positive energy value representing maximum photon energy detected.
status: draft
tags:
