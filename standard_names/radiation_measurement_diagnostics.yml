- name: spectral_calibration_factor_of_spectrometer
  kind: scalar
  status: draft
  description: Calibration factor converting a dark-corrected spectrometer count rate
    at a wavelength channel into absolute photon spectral radiance density per unit
    wavelength. It is wavelength-dependent and includes the effects of throughput,
    etendue, detector gain, spectral width, and optical efficiency.
  documentation: 'Spectral calibration factor of a spectrometer is a wavelength-dependent
    coefficient that converts a dark-subtracted detector count rate, or an equivalent
    count-rate-normalized signal, into absolute photon spectral radiance density.
    The spectral coordinate $\lambda$ is wavelength in meters, and the normalization
    is per unit wavelength, not per unit frequency, wavenumber, photon energy, or
    integrated spectral channel. With photon counts treated as dimensionless, the
    factor has unit $m^{-3}\,sr^{-1}$ so that multiplication by a signal rate in $s^{-1}$
    gives photon spectral radiance density in $m^{-3}\,s^{-1}\,sr^{-1}$.


    For a wavelength sample $i$, the defining calibration relation is:


    $$

    L_\lambda(\lambda_i) = C_\lambda(\lambda_i)\,\dot{S}(\lambda_i)

    $$


    where $L_\lambda(\lambda_i)$ is the calibrated photon spectral radiance density
    in $m^{-3}\,s^{-1}\,sr^{-1}$, $C_\lambda(\lambda_i)$ is the spectral calibration
    factor in $m^{-3}\,sr^{-1}$, and $\dot{S}(\lambda_i)$ is the corrected detector
    signal rate in $s^{-1}$. If the measurement is recorded as integrated counts $N_i$
    over an exposure time $\Delta t$, then $\dot{S}(\lambda_i)$ is obtained from $N_i/\Delta
    t$ after dark, background, gain, and linearity corrections. For a finite spectral
    channel, the radiance integrated over that channel is approximately $L_\lambda(\lambda_i)\Delta\lambda_{\mathrm{eff},i}$,
    linking this quantity to the [effective_spectral_width_of_spectrometer_channel](name:effective_spectral_width_of_spectrometer_channel).


    The factor is determined by viewing a calibrated lamp, integrating sphere, monochromator,
    or line source with known spectral radiance under the same optical configuration
    used for plasma measurements. It includes the collection etendue_of_spectrometer_channel,
    wavelength-dependent transmission, grating or filter response, detector quantum
    efficiency, electronic gain, and the conversion from finite channel signal to
    per-wavelength radiance density. In grating systems it is normally assigned to
    each detector pixel or wavelength bin; in filter spectrometers it applies to the
    channel centered at the filter wavelength with its effective spectral width.


    Typical values span many orders of magnitude because they scale approximately
    as the inverse of etendue, efficiency, and spectral width. Visible high-throughput
    systems commonly have factors around $10^{15}$-$10^{20}\ m^{-3}\,sr^{-1}$, while
    ultraviolet systems, narrow spectral bins, or low-throughput optical paths may
    require $10^{18}$-$10^{23}\ m^{-3}\,sr^{-1}$.'
  unit: m^-3.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:effective_spectral_width_of_spectrometer_channel
  sources:
  - id: dd:charge_exchange/channel/spectrum/radiance_calibration
    dd_path: charge_exchange/channel/spectrum/radiance_calibration
    status: attached
  - id: dd:spectrometer_uv/channel/radiance_calibration
    dd_path: spectrometer_uv/channel/radiance_calibration
    status: attached
  - id: dd:spectrometer_visible/channel/filter_spectrometer/radiance_calibration
    dd_path: spectrometer_visible/channel/filter_spectrometer/radiance_calibration
