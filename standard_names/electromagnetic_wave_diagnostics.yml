- name: faraday_angle
  kind: scalar
  status: active
  description: Angular rotation of the polarization plane of a polarimeter probe beam
    induced by circular birefringence of the magnetized plasma, proportional to the
    line-integrated product of electron density and the parallel magnetic field.
  documentation: 'The Faraday rotation angle is the net signed angular displacement
    of the plane of linear polarization of a probe beam that accumulates as the beam
    traverses a magnetized plasma along a polarimeter line of sight. Left- and right-hand
    circularly polarized components of the beam propagate at different phase velocities
    in the magnetized medium, producing a rotation whose magnitude and sign depend
    on the line-integrated product of electron number density and the magnetic-field
    component parallel to the beam.


    The defining relation is:


    $$

    \Psi_F = \frac{e^3 \lambda^2}{8\pi^2 \varepsilon_0 m_e^2 c^3} \int n_e B_\parallel
    \, dl

    $$


    where $e$ is the elementary charge, $\lambda$ is the vacuum probing wavelength,
    $\varepsilon_0$ is the permittivity of free space, $m_e$ is the electron mass,
    $c$ is the speed of light, $n_e$ is the local electron number density, $B_\parallel$
    is the component of the equilibrium magnetic field along the beam propagation
    direction, and the integral is taken along the line of sight through the plasma.


    This quantity represents the variation induced by the plasma alone, excluding
    any initial polarization offset or instrumental offset at launch. It is sensitive
    to $\int n_e B_\parallel \, dl$, combining constraints from both the magnetic
    geometry and the electron density, and complements [line_averaged_electron_density](name:line_averaged_electron_density)
    in equilibrium reconstruction by adding explicit magnetic-field sensitivity.


    Sign convention: Positive when the net line-integrated product $\int n_e B_\parallel
    \, dl$ is positive, with $B_\parallel$ taken as the projection of the magnetic
    field onto the beam propagation direction.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_averaged_electron_density
  sources:
  - dd_path: equilibrium/time_slice/constraints/faraday_angle/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-faraday_angle-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/faraday_angle
      parent: Set of faraday angles
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: Measured value of faraday angle.
      kind: template
    semantic_facet: measured
  - dd_path: polarimeter/channel/faraday_angle
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/polarimeter.html#polarimeter-channel-faraday_angle
    dd_documentation:
      leaf: 'Faraday angle (variation of the Faraday angle induced by crossing the
        plasma) '
      parent_path: polarimeter/channel
      parent: Set of channels (lines-of-sight)
      data_type: STRUCTURE
      unit: rad
    enhanced_context:
      description: "Faraday rotation angle induced by passage of the probing beam\
        \ through the magnetized plasma in a polarimeter channel. Sensitive to the\
        \ line-integrated product of electron density and parallel magnetic field\
        \ (\u222Bn_e\xB7B\u2225 dl), used as a constraint in equilibrium reconstruction."
      kind: llm
- name: frequency_of_diagnostic_antenna
  kind: scalar
  status: active
  description: Temporal frequency of the coherent electromagnetic wave associated
    with a diagnostic antenna channel, whether transmitted, received, or selected
    for tuning.
  documentation: 'This quantity specifies the oscillation rate of the coherent electromagnetic
    wave associated with a diagnostic antenna channel. It applies to the channel''s
    transmitted, received, or selected wave and does not by itself identify a plasma
    location.


    The temporal frequency $f$ is related to angular frequency by


    $$

    f = \frac{\omega}{2\pi}

    $$


    where $\omega$ is the wave angular frequency in radians per second and $f$ is
    the temporal frequency in hertz.


    This channel-associated frequency is distinct from the local electron plasma frequency,
    which is determined by electron density at a measurement position as described
    by [frequency at measurement position](name:frequency_at_measurement_position).
    It is also distinct from the launch-referenced spectral framework of [launched
    wave frequency](name:launched_wave_frequency) and from the general [wave frequency](name:wave_frequency).'
  unit: Hz
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:launched_wave_frequency
  - name:wave_frequency
  sources:
