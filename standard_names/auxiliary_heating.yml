- name: parallel_component_of_wave_electric_field
  kind: scalar
  status: draft
  description: Scalar projection of the coherent wave electric field onto the unit
    vector parallel to the background magnetic field, forming the field-aligned component
    of the field-aligned triad (parallel, normal, binormal). This quantity characterizes
    the electric field component along the magnetic field direction within the decomposition
    of the total wave electric field.
  documentation: 'The parallel component of the wave electric field is defined as

    $$E_\parallel = \mathbf{E}_w \cdot \hat{b},$$

    where $\mathbf{E}_w$ is the coherent wave electric field vector and $\hat{b} =
    \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along the equilibrium (background)
    magnetic field $\mathbf{B}_0$.


    The field-aligned triad consists of three mutually orthogonal unit vectors: $\hat{b}$
    (parallel, along $\mathbf{B}_0$), $\hat{n}$ (normal, in the direction of the gradient
    of magnetic flux surfaces), and $\hat{\pi} = \hat{b} \times \hat{n}$ (binormal).
    The total wave electric field is recovered as $\mathbf{E}_w = E_\parallel \hat{b}
    + E_n \hat{n} + E_{\pi} \hat{\pi}$. This entry gives the parallel scalar projection
    $E_\parallel$ without implying a particular phasor representation; the quantity
    may be real-valued or represent a component of a complex amplitude depending on
    context, and should be distinguished from the explicitly labeled real-part quantity
    [parallel_component_of_wave_electric_field_real_part](name:parallel_component_of_wave_electric_field_real_part).


    Physically, $E_\parallel$ is important in wave-particle interactions where particle
    motion along field lines is relevant, such as electron Landau damping and wave-driven
    parallel transport. It is generally small for electromagnetic waves in well-magnetized
    plasmas but can become significant for kinetic Alfven waves, lower-hybrid waves,
    and electrostatic modes.


    Typical magnitudes range from tens to thousands of V m$^{-1}$ depending on the
    launched power, wave mode, and local plasma parameters.


    Sign convention: Positive when the projection of the wave electric field onto
    $\hat{b} = \mathbf{B}_0 / |\mathbf{B}_0|$ is in the direction of the background
    magnetic field.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:normal_component_of_wave_electric_field
  - name:binormal_component_of_wave_electric_field
  - name:wave_electric_field
  - name:parallel_component_of_wave_magnetic_field
  constraints: []
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
