- name: volume_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Physical volume of the converter material in a neutron detector, used
    to calculate detection efficiency from the nuclear interaction cross-section.
  documentation: 'The converter volume $V_c$ is the geometric volume of the neutron-sensitive
    converter material within a neutron detector, typically a thin foil or layer of
    materials such as $^{235}$U, $^{238}$U, or $^{10}$B. This volume, combined with
    the nuclear density $n_c$ of the converter material, determines the total number
    of target nuclei ($N = n_c V_c$) available for neutron-induced reactions such
    as fission or (n,$\alpha$) capture. The detection efficiency of a neutron detector
    is directly proportional to the converter volume and the interaction cross-section,
    with typical converter volumes ranging from $10^{-6}$ to $10^{-4}$ m$^3$ for fission
    chambers in fusion diagnostics. The converter volume is a fundamental input for
    calculating the detector response and calibrating the measured neutron flux. See
    also [nuclear_density_of_neutron_detector_converter](name:nuclear_density_of_neutron_detector_converter)
    and [temperature_of_neutron_detector_converter](name:temperature_of_neutron_detector_converter).


    Sign convention: Positive for any physical volume.'
  unit: m^3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:temperature_of_neutron_detector_converter
  sources:
