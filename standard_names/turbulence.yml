- name: perpendicular_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: "Perpendicular component of the gyrobohm-normalized toroidal angular\
    \ momentum flux driven by fluctuations in the parallel perturbed magnetic field\
    \ \u03B4B\u2225, summed over the full wavevector spectrum in a gyrokinetic simulation."
  documentation: "The perpendicular component of the toroidal momentum flux $\\Pi^{\\\
    delta B_\\parallel}_{\\perp}$ quantifies the contribution of perturbed parallel\
    \ magnetic field fluctuations $\\delta B_\\parallel = \\hat{b} \\cdot \\delta\\\
    vec{B}$ to turbulent radial transport of toroidal angular momentum $L_\\phi =\
    \ m R v_\\phi$ projected onto the direction perpendicular to the equilibrium magnetic\
    \ field unit vector $\\hat{b}$ on each flux surface. It is evaluated in the plasma\
    \ rotating frame and normalized to gyrobohm units, with the wavevector sum running\
    \ over the full $k_x$\u2013$k_y$ spectrum. Together with the [parallel component](name:parallel_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field),\
    \ it fully decomposes the parent vector [toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field](name:toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field)\
    \ into its field-aligned basis components. The analogous decomposition for the\
    \ perturbed parallel vector potential $\\delta A_\\parallel$ is given by [perpendicular_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_vector_potential](name:perpendicular_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_vector_potential).\
    \ In typical nonlinear gyrokinetic simulations, the $\\delta B_\\parallel$ contribution\
    \ is smaller than the electrostatic channel but becomes significant at high plasma\
    \ beta. Typical normalized values range from $10^{-3}$ to $10^{-1}$ in dimensionless\
    \ gyrobohm units depending on collisionality, beta, and magnetic geometry.\n\n\
    Sign convention: Positive when the perpendicular toroidal momentum flux driven\
    \ by $\\delta B_\\parallel$ is directed radially outward, corresponding to outward\
    \ transport of co-current toroidal angular momentum."
  unit: '1'
