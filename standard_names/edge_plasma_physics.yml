- name: plasma_momentum_diffusion_coefficient
  kind: vector
  status: active
  description: Vector of directional diffusion coefficients governing diffusive transport
    of plasma momentum aggregated over all ion species and charge states, forming
    the diagonal of the bulk ion-fluid momentum diffusivity tensor.
  documentation: "The plasma momentum diffusion coefficient vector collects the anisotropic\
    \ directional components of the bulk plasma momentum diffusivity, each relating\
    \ the diffusive flux of ion-fluid momentum along a given geometric direction to\
    \ the local flow-velocity gradient. By summing over all ion species and charge\
    \ states, it characterizes the ion fluid as a composite transport medium; the\
    \ radial cross-field projection is the most directly accessible component, as\
    \ attested by [radial_plasma_momentum_diffusion_coefficient](name:radial_plasma_momentum_diffusion_coefficient).\n\
    \nThe defining Fickian relation for the diffusive momentum flux density along\
    \ direction $i$ is\n\n$$\n\\Pi_i^{\\rm diff} = -\\rho \\, D_i^{\\rm plasma} \\\
    , \\frac{\\partial u_i}{\\partial x_i}\n$$\n\nwhere $\\rho$ is the local ion-fluid\
    \ mass density in kg m$^{-3}$, $u_i$ is the fluid velocity component along direction\
    \ $i$, and $D_i^{\\rm plasma}$ is the plasma momentum diffusion coefficient in\
    \ that direction.\n\nMagnetized plasmas are strongly anisotropic: cross-field\
    \ components are suppressed by Lorentz-force confinement, while the field-aligned\
    \ component \u2014 exemplified by [parallel_edge_plasma_momentum_diffusivity](name:parallel_edge_plasma_momentum_diffusivity)\
    \ \u2014 can exceed cross-field values by several orders of magnitude. In edge\
    \ and divertor regions, turbulent and neoclassical processes set the effective\
    \ cross-field diffusivities, which are inferred from momentum-balance analysis\
    \ of measured toroidal or poloidal flow profiles. This quantity is the plasma-species\
    \ member of the [momentum_diffusion_coefficient](name:momentum_diffusion_coefficient)\
    \ family; species-resolved variants resolve transport per ion population, while\
    \ neutral-particle analogs account for the charge-exchange coupling that transfers\
    \ momentum between ions and neutrals in the edge."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_plasma_momentum_diffusion_coefficient
  - name:parallel_edge_plasma_momentum_diffusivity
  - name:momentum_diffusion_coefficient
  arguments:
  - name: momentum_diffusion_coefficient
    operator: plasma
    operator_kind: qualifier
- name: radial_plasma_momentum_diffusion_coefficient
  kind: scalar
  status: active
  description: "Effective kinematic coefficient governing down-gradient transport\
    \ of bulk plasma momentum along R in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame, where R is major radius, \u03C6 is toroidal angle, and Z is vertical\
    \ height. Bulk plasma momentum is ion-fluid momentum summed over all ion species\
    \ and charge states; electron inertial momentum is excluded."
  documentation: 'The radial plasma momentum diffusion coefficient is the effective
    kinematic coefficient governing down-gradient transport of bulk plasma momentum
    along $\hat{R}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is vertical height. The radial direction specifies
    the transport direction, not the component of momentum being transported.


    In a Fickian closure, the coefficient is defined component-wise by the relation
    between radial diffusive momentum flux and the major-radius gradient of the corresponding
    momentum density:


    $$

    \Gamma^{\mathrm{diff}}_{\mathcal{P}_j,R} = -D_{\mathcal{P},R}\,\frac{\partial
    \mathcal{P}_j}{\partial R}

    $$


    where $D_{\mathcal{P},R}$ is the radial plasma momentum diffusion coefficient,
    $\Gamma^{\mathrm{diff}}_{\mathcal{P}_j,R}$ is the diffusive flux of the $j$-th
    component of bulk plasma momentum through a surface of constant $R$ and is positive
    in the $+\hat{R}$ direction, $\mathcal{P}_j$ is the bulk plasma momentum density
    component, and $j$ denotes any chosen momentum-vector component. The derivative
    is taken with respect to $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
    The leading minus sign fixes the down-gradient diffusion convention: a positive
    $D_{\mathcal{P},R}$ transports each component from larger toward smaller $\mathcal{P}_j$
    along $R$.


    Bulk plasma momentum density means the charge-state-summed ion-fluid momentum
    density, $\mathcal{P}_j = \sum_{a,z} m_a n_{a,z} u_{a,z,j}$, where $a$ indexes
    ion species, $z$ indexes charge state, $m_a$ is ion mass, $n_{a,z}$ is ion number
    density, and $u_{a,z,j}$ is the corresponding ion fluid-velocity component. Electron
    inertial momentum and neutral momentum are excluded.


    This quantity is the $R$-directed member of the bulk plasma-momentum diffusion-coefficient
    family anchored by [plasma momentum diffusion coefficient](name:plasma_momentum_diffusion_coefficient),
    with the $Z$-directed counterpart [vertical plasma-momentum transport coefficient](name:vertical_plasma_momentum_diffusivity).
    It is distinct from a flux-surface-normal momentum-transport coefficient such
    as [radial momentum transport coefficient](name:radial_momentum_diffusivity),
    from the charge-state-resolved [radial ion charge-state momentum transport coefficient](name:radial_ion_charge_state_momentum_diffusivity),
    and from the neutral-fluid analog [radial neutral momentum diffusion coefficient](name:radial_neutral_momentum_diffusion_coefficient).
    In an anisotropic tensor representation, it corresponds to a radial diagonal transport
    coefficient; related ion-momentum tensor-family quantities include [ion momentum
    diffusion coefficient](name:ion_momentum_diffusion_coefficient) and the toroidal
    diagonal component [toroidal ion momentum diffusion coefficient](name:toroidal_ion_momentum_diffusion_coefficient).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_momentum_diffusion_coefficient
  - name:vertical_plasma_momentum_diffusivity
  arguments:
  - name: plasma_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - dd_path: edge_transport/model/ggd/momentum/d_radial/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_transport.html#edge_transport-model-ggd-momentum-d_radial-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
      parent_path: edge_transport/model/ggd/momentum/d_radial
      parent: Effective diffusivity (in the radial direction), on various grid subsets
      data_type: FLT_1D
      unit: m^2.s^-1
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for d radial.
      kind: template
- name: plasma_momentum_flux
  kind: vector
  status: active
  description: Rate of transport of linear momentum per unit area across an oriented
    surface, summed over charged plasma populations and excluding neutral transport.
  documentation: 'The plasma momentum flux describes the rate at which charged plasma
    populations transport linear momentum through a unit area of an oriented surface.
    It includes convective, isotropic-pressure, and viscous or turbulent-stress contributions.


    $$

    \mathbf{F}_{\mathrm{pl}} = \boldsymbol{\Pi}_{\mathrm{pl}}\cdot\hat{\mathbf n},
    \qquad \boldsymbol{\Pi}_{\mathrm{pl}} = \sum_{s\in\mathrm{charged}}\left(\rho_s\mathbf{v}_s\mathbf{v}_s
    + p_s\mathbf{I} + \boldsymbol{\pi}_s\right)

    $$


    Here, $\mathbf{F}_{\mathrm{pl}}$ is the momentum-flux vector, $\boldsymbol{\Pi}_{\mathrm{pl}}$
    is the charged-plasma momentum-flux tensor, and $\hat{\mathbf n}$ is the oriented
    unit surface normal. The sum covers charged species $s$; $\rho_s$ is mass density,
    $\mathbf{v}_s$ bulk velocity, $p_s$ scalar pressure, $\mathbf{I}$ the identity
    tensor, and $\boldsymbol{\pi}_s$ the viscous or turbulent stress tensor.


    This charged-plasma specialization belongs to the broader [momentum flux](name:momentum_flux)
    family and excludes the neutral contribution represented by [neutral momentum
    flux](name:neutral_momentum_flux). Its field-aligned projection is [parallel plasma
    momentum flux](name:parallel_plasma_momentum_flux).


    Sign convention: Positive when momentum transport across the surface is directed
    along the chosen surface normal.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_flux
  - name:neutral_momentum_flux
  - name:parallel_plasma_momentum_flux
  arguments:
  - name: momentum_flux
    operator: plasma
    operator_kind: qualifier
- name: parallel_plasma_momentum_flux
  kind: scalar
  status: active
  description: Scalar obtained by projecting the charged-plasma momentum-flux tensor
    onto the local magnetic-field direction for both transported momentum and flux
    direction. It includes advective, isotropic-pressure, and parallel stress contributions.
  documentation: 'Parallel plasma momentum flux is the flux density of plasma momentum
    carried in the local magnetic-field direction, with the transported momentum and
    flux direction both projected parallel to the field. It is the parallel scalar
    component of the parent [plasma momentum flux](name:plasma_momentum_flux).


    $$

    \Pi_{\parallel}=\mathbf{b}\cdot\mathbf{\Pi}\cdot\mathbf{b},\qquad \mathbf{b}=\frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    Here $\Pi_{\parallel}$ is the parallel momentum flux, $\mathbf{\Pi}$ is the charged-plasma
    momentum-flux tensor, $\mathbf{B}$ is the magnetic-field vector, and $\mathbf{b}$
    is its unit direction. The tensor includes bulk-flow transport, isotropic pressure,
    and viscous or other anisotropic stress. This quantity includes the charged plasma
    as a whole and excludes neutral momentum; [parallel ion momentum flux](name:parallel_ion_momentum_flux)
    is its ion-only counterpart.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_momentum_flux
  - name:parallel_ion_momentum_flux
  arguments:
  - name: plasma_momentum_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: edge_transport/model/ggd/momentum/flux/parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_transport.html#edge_transport-model-ggd-momentum-flux-parallel
    dd_documentation:
      leaf: Parallel component, one scalar value is provided per element in the grid
        subset.
      parent_path: edge_transport/model/ggd/momentum/flux
      parent: Flux, on various grid subsets
      data_type: FLT_1D
