- name: current_density
  kind: vector
  status: draft
  description: Electric current density is the vector charge flux per unit area in
    the plasma, equal to the sum of charge-weighted mean flows over all charged species
    and encompassing inductive, neoclassical, wave-driven, and kinetic contributions.
  documentation: "Electric current density $\\mathbf{J}$ characterizes the net charge\
    \ transport per unit area at every point in the plasma, unifying contributions\
    \ from all current-carrying mechanisms across the thermal and suprathermal particle\
    \ populations with a single vector field.\n\nThe fundamental relation connecting\
    \ $\\mathbf{J}$ to the magnetic field is given by Ampere's law:\n\n$$\n\\nabla\
    \ \\times \\mathbf{B} = \\mu_0 \\mathbf{J}\n$$\n\nwhere $\\mathbf{B}$ is the magnetic\
    \ field vector and $\\mu_0$ is the permeability of free space. The microscopic\
    \ definition is $\\mathbf{J} = \\sum_s q_s n_s \\mathbf{u}_s$, where $q_s$, $n_s$,\
    \ and $\\mathbf{u}_s$ are the charge, number density, and mean flow velocity of\
    \ species $s$ respectively.\n\nAs a parent quantity, $\\mathbf{J}$ subsumes contributions\
    \ from physically distinct mechanisms: [fast current density] carried by energetic\
    \ suprathermal particles, [flux-surface-averaged current density] describing the\
    \ equilibrium distribution over nested toroidal surfaces, pressure-gradient-driven\
    \ bootstrap and diamagnetic currents, and wave-driven contributions. The full\
    \ vector decomposes into toroidal, poloidal, radial, vertical, and field-parallel\
    \ projections that govern axisymmetric force balance and Grad-Shafranov source\
    \ terms. In tokamak core plasmas, parallel current densities are typically $10^5$\u2013\
    $10^7$ A m$^{-2}$, scaling with total plasma current divided by poloidal cross-sectional\
    \ area.\n\nThe total current density is reconstructed from external magnetic measurements\
    \ through equilibrium analysis, or assembled from individual contributions computed\
    \ by kinetic transport and fluid models.\n\nSign convention: Positive when the\
    \ conventional current flows in the direction of increasing toroidal angle $\\\
    phi$."
  unit: A.m^-2
  physics_domain: equilibrium
  links: []
- name: current_of_passive_structure
  kind: scalar
  status: draft
  description: Net toroidal electrical current circulating in a passive conducting
    structure, induced by time-varying magnetic flux from the plasma, active coils,
    and neighboring conducting structures rather than by an external power supply.
  documentation: "Current of a passive structure is the net toroidal conduction current\
    \ circulating in an electrically conducting component that is not driven by an\
    \ external current supply. It is induced by time-varying magnetic flux from the\
    \ plasma current, active poloidal-field coils, and neighboring conducting structures,\
    \ and it couples back to the magnetic equilibrium through mutual inductance.\n\
    \nUsing the right-handed cylindrical $(R, \\phi, Z)$ frame, the net toroidal current\
    \ is the cross-sectional integral of current density through a cut surface of\
    \ the conducting path:\n\n$$\nI_\\mathrm{passive} = \\int_S \\mathbf{J}\\cdot\\\
    hat{\\phi}\\, dS\n$$\n\nwhere $I_\\mathrm{passive}$ is the passive-structure current,\
    \ $S$ is a cross-section of the connected conductor normal to the toroidal direction,\
    \ $\\mathbf{J}$ is current density in $\\mathrm{A\\,m^{-2}}$, $dS$ is an area\
    \ element in $\\mathrm{m^2}$, and $\\hat{\\phi}$ points toward increasing toroidal\
    \ angle $\\phi$.\n\nIn lumped circuit models this current is often evolved with\
    \ $L\\,dI_\\mathrm{passive}/dt + R\\,I_\\mathrm{passive} = -d\\Phi_\\mathrm{ext}/dt$,\
    \ where $L$ is self-inductance in H, $R$ is electrical resistance in \u03A9, and\
    \ $\\Phi_\\mathrm{ext}$ is the linked magnetic flux from plasma, active coils,\
    \ and other conductors in Wb. The characteristic resistive decay time is $\\tau\
    \ = L/R$; for multiple coupled structures, inductance and resistance matrices\
    \ replace the single $L$ and $R$. For loop elements, this resistance is closely\
    \ related to [resistance_of_passive_loop](name:resistance_of_passive_loop).\n\n\
    The value may be measured by diagnostics that encircle or magnetically couple\
    \ to the conducting element, such as Rogowski coils, flux loops, or magnetic probes,\
    \ and may also be inferred by equilibrium reconstruction constrained by magnetic\
    \ measurements and conductor circuit equations. Isolated passive loops are described\
    \ by [current_of_passive_loop](name:current_of_passive_loop), while vessel elements\
    \ are represented by quantities such as [toroidal_current_of_vacuum_vessel](name:toroidal_current_of_vacuum_vessel);\
    \ the driving plasma current is [toroidal_plasma_current](name:toroidal_plasma_current).\n\
    \nTypical magnitudes are device- and event-dependent: individual passive elements\
    \ during slowly varying equilibria are commonly treated on the order of $10^0-10^4$\
    \ A, while larger connected structures or rapid flux changes can produce substantially\
    \ larger transient currents. The appropriate range is set by the linked flux-change\
    \ rate, resistance, inductance, and electromagnetic coupling geometry.\n\nSign\
    \ convention: Positive when the net current flows in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: A
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_passive_loop
- name: current_of_plasma_filament
  kind: scalar
  status: draft
  description: Electric current carried by a single discrete plasma-filament element
    in an axisymmetric filamentary representation of the distributed plasma current.
  documentation: "In the filamentary model of an axisymmetric plasma, the spatially\
    \ distributed plasma current is represented as an array of discrete annular current-carrying\
    \ elements, each called a filament. The current of each element is its individual\
    \ contribution to the net toroidal plasma current, and the ensemble of filament\
    \ currents constitutes a discrete model of the plasma current density distribution\
    \ across the poloidal cross-section.\n\nThe total plasma current $I_p$ is recovered\
    \ by summing the contributions from all filament elements:\n\n$$\nI_p = \\sum_k\
    \ I_k\n$$\n\nwhere $I_k$ is the current of the $k$-th filament element and the\
    \ sum runs over all elements in the filamentary array.\n\nFilament currents are\
    \ determined during equilibrium reconstruction or electromagnetic circuit-equation\
    \ integration, treating the plasma as a collection of discrete current sources.\
    \ Each filament element is fully characterized by its current together with its\
    \ geometric descriptors \u2014 including area_of_plasma_filament, [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),\
    \ and [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)\
    \ \u2014 which together define the local current-density contribution. The analogous\
    \ quantity for the conducting vessel structure is [toroidal_current_of_vacuum_vessel](name:toroidal_current_of_vacuum_vessel).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above $+\\hat{Z}$)."
  unit: A
  physics_domain: equilibrium
  links: []
- name: current_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Signed conductor current carried by a poloidal-field coil winding.
    It is the electrical current in amperes through the winding conductor, distinct
    from the ampere-turn product obtained by multiplying by the number of turns.
  documentation: 'Current of a poloidal-field coil is the signed electrical current
    carried by the coil winding conductor. For a multi-turn winding, this quantity
    is the conductor current $I_\mathrm{PF}$, while the magnetomotive ampere-turn
    product is $N I_\mathrm{PF}$, where $N$ is the number of turns.


    The vacuum poloidal-flux contribution of a coil can be written, for a field point
    in the right-handed cylindrical $(R, \phi, Z)$ system where $R$ is major radius
    in meters and $Z$ is vertical height in meters, as


    $$

    \psi_\mathrm{coil}(R,Z) = M_\mathrm{coil}(R,Z) I_\mathrm{PF}

    $$


    where $\psi_\mathrm{coil}$ is in Wb, $I_\mathrm{PF}$ is in A, and $M_\mathrm{coil}$
    is the mutual inductance in Wb/A between the modeled coil winding and the flux
    surface label at $(R,Z)$. When $M_\mathrm{coil}$ is defined per conductor current,
    it includes the winding turn count and the finite coil cross-section represented
    by the coil model; if a per-turn Green-function response is used instead, the
    factor $N I_\mathrm{PF}$ appears explicitly.


    In practice, poloidal-field coil currents are measured with electrical current
    transducers in the coil circuits and may also be estimated or constrained during
    equilibrium reconstruction. These currents determine the externally applied poloidal
    magnetic-field and flux contributions used for plasma position, boundary, and
    shape control, together with plasma current and currents in passive conducting
    structures.


    Representative values are strongly device- and coil-dependent, ranging from kA-scale
    currents in smaller or auxiliary poloidal-field coils to several tens of kA in
    large shaping or vertical-field coils.


    Sign convention: Positive when the conventional current in the winding flows in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ system.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_of_passive_structure
- name: electron_density
  kind: scalar
  status: draft
  description: Number density of free electrons per unit volume in the plasma, encompassing
    both bulk thermal and non-thermal (fast or suprathermal) electron populations.
  documentation: "The electron density $n_e$ quantifies the number of free electrons\
    \ per unit volume at a given point in the plasma and is a fundamental scalar of\
    \ plasma state, entering directly into fluid, kinetic, and transport equations\
    \ governing plasma behavior.\n\nIn a quasi-neutral plasma, $n_e$ is constrained\
    \ by charge neutrality:\n\n$$\nn_e \\approx \\sum_s Z_s \\, n_s\n$$\n\nwhere $Z_s$\
    \ is the charge number and $n_s$ the number density of ion species $s$, with the\
    \ sum extending over all ion species. Departures from quasi-neutrality are confined\
    \ to length scales of order the Debye length $\\lambda_D$.\n\nThomson scattering\
    \ measures $n_e$ locally from the total intensity of incoherently scattered laser\
    \ light; interferometry and reflectometry provide line-integrated or cutoff-layer\
    \ measurements; and Langmuir probes at the plasma boundary infer $n_e$ from the\
    \ ion saturation current. Together these diagnostics span the full radial range\
    \ from core to scrape-off layer.\n\nCore electron densities in H-mode tokamaks\
    \ lie in the range $1$\u2013$20 \\times 10^{19}$ m$^{-3}$, falling to $10^{17}$\u2013\
    $10^{18}$ m$^{-3}$ in the scrape-off layer. The bulk thermal component alone is\
    \ captured by [thermal_electron_density](name:thermal_electron_density), the non-thermal\
    \ component by [fast_electron_density](name:fast_electron_density), and the plasma-volume\
    \ average by [volume_averaged_electron_density](name:volume_averaged_electron_density)."
  unit: m^-3
  physics_domain: equilibrium
  links:
  - name:thermal_electron_density
  - name:fast_electron_density
  - name:volume_averaged_electron_density
- name: elongation_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless ratio of the vertical to horizontal semi-axis of each
    nested magnetic flux surface, parameterizing the poloidal elongation of plasma
    shape as a function of the flux label.
  documentation: "The elongation $\\kappa$ of a flux surface is a dimensionless measure\
    \ of how vertically stretched the poloidal cross-section of a nested toroidal\
    \ magnetic surface is relative to its horizontal extent. A value of $\\kappa =\
    \ 1$ denotes a circular cross-section, while $\\kappa > 1$ characterizes the vertically\
    \ elongated shapes used in modern tokamaks to improve MHD stability and energy\
    \ confinement.\n\nThe defining relation is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\
    \nwhere $b$ is the vertical semi-axis (half-height measured from the geometric\
    \ center of the surface) and $a$ is the horizontal semi-axis (half-width) of the\
    \ flux surface in the poloidal cross-section.\n\nThe elongation profile is derived\
    \ from MHD equilibrium reconstruction by extracting the geometric shape parameters\
    \ of each nested flux surface obtained from the Grad-Shafranov solution, parameterized\
    \ as a function of the poloidal flux coordinate $\\psi$ across the minor radius.\
    \ The radial variation of $\\kappa$ is captured by [radial_derivative_of_elongation_of_flux_surface](name:radial_derivative_of_elongation_of_flux_surface).\
    \ Complementary poloidal shape descriptors include [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface),\
    \ which characterizes the poloidal corner geometry, and [area_of_flux_surface](name:surface_area_of_flux_surface),\
    \ which gives the total enclosed cross-sectional area.\n\nTypical values rise\
    \ from $\\kappa \\approx 1.0$ near the magnetic axis to $\\kappa \\approx 1.5$\u2013\
    $2.0$ at the plasma boundary in shaped tokamak discharges; ITER is designed for\
    \ a boundary elongation near $\\kappa = 1.85$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
- name: elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless ratio of the plasma boundary vertical half-height to
    its minor radius, quantifying the overall vertical elongation of the plasma cross-sectional
    shape at the last closed flux surface.
  documentation: "The elongation $\\kappa$ is a global dimensionless shape parameter\
    \ characterizing the vertical-to-horizontal aspect ratio of the plasma cross-section\
    \ at the plasma boundary. It enters directly into MHD stability criteria, the\
    \ Troyon beta limit, and confinement scaling relations, making it one of the primary\
    \ descriptors of plasma shaping alongside triangularity.\n\nThe defining relation\
    \ is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\nwhere $b$ is the vertical half-height\
    \ of the plasma boundary (half the total poloidal extent between the uppermost\
    \ and lowermost boundary points) and $a$ is the plasma minor radius (half the\
    \ horizontal full width at the midplane).\n\nThe quantity is obtained from equilibrium\
    \ reconstruction by fitting the closed poloidal boundary contour to external magnetic\
    \ measurements and internal pressure or current profiles. The boundary extremal\
    \ coordinates determine $b$ and $a$ directly.\n\nA circular cross-section corresponds\
    \ to $\\kappa = 1$. Modern shaped tokamaks typically operate in the range $\\\
    kappa = 1.5$\u2013$2.0$; strongly elongated configurations approach $\\kappa \\\
    approx 1.8$\u2013$2.0$. Higher elongation increases plasma volume at fixed minor\
    \ radius and improves the MHD beta limit, but at the cost of reduced vertical\
    \ stability requiring active position control.\n\nWhen up-down asymmetry is significant,\
    \ this global parameter decomposes into [upper elongation](name:upper_elongation_of_plasma_boundary)\
    \ and [lower elongation], each measuring the half-boundary contribution. The radial\
    \ variation of elongation across nested flux surfaces is captured by [elongation_of_flux_surface](name:elongation_of_flux_surface)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_flux_surface
- name: external_loop_voltage
  kind: scalar
  status: draft
  description: Electromotive-force contribution to the total loop voltage from the
    time variation of externally generated poloidal magnetic flux, produced by driven
    central-solenoid and poloidal-field circuits and by induced currents in conducting
    passive structures.
  documentation: 'External loop voltage is the inductive contribution to the total
    loop voltage associated with changes in poloidal magnetic flux generated by currents
    outside the plasma. The external sources include driven central-solenoid and poloidal-field
    coil circuits, as well as induced currents in conducting passive structures; the
    plasma self-flux contribution is excluded.


    For a single plasma-representative value, it is defined as the time derivative
    of the signed plasma-current-weighted average of the external poloidal flux over
    the plasma cross-section:


    $$

    V_\mathrm{ext}(t) = \frac{d}{dt}\left[\frac{\int_{\Omega_p(t)} \psi_\mathrm{ext}(R,Z,t)\,
    j_\phi(R,Z,t)\, dR\,dZ}{\int_{\Omega_p(t)} j_\phi(R,Z,t)\, dR\,dZ}\right]

    $$


    where $V_\mathrm{ext}$ is the external loop voltage, $\psi_\mathrm{ext}$ is the
    signed poloidal magnetic flux produced by non-plasma currents, $\Omega_p$ is the
    plasma cross-section in a poloidal plane of the right-handed cylindrical $(R,\phi,Z)$
    frame, and $j_\phi$ is the toroidal plasma current density. The weighting uses
    the signed differential plasma current $dI_p = j_\phi\,dR\,dZ$, so this is a current-weighted
    cross-sectional average rather than an unweighted geometric or flux-surface average.


    In practice, this quantity is obtained from magnetic-equilibrium and circuit reconstructions
    by decomposing the poloidal flux into contributions from driven coils, conducting
    passive structures, and plasma current. Passive-structure currents are generally
    inferred through electromagnetic response models constrained by magnetic measurements,
    and their contribution can lag the driven coil-current waveforms.


    Typical values are highly scenario and device dependent. The external loop voltage
    is near 0 V when external and passive-structure currents are steady, and it can
    become either positive or negative during current ramp-up, ramp-down, coil waveform
    changes, or passive-current decay; it is usually interpreted relative to the total
    loop voltage and other inductive or resistive voltage components rather than by
    a universal numerical range.


    Sign convention: Positive when the signed plasma-current-weighted average of $\psi_\mathrm{ext}$
    increases with time, with positive $\psi_\mathrm{ext}$ corresponding to external
    vertical magnetic field through the horizontal integration disk pointing in the
    $+Z$ direction of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: V
  physics_domain: equilibrium
  links: []
- name: gap_at_plasma_boundary
  kind: scalar
  status: draft
  description: Signed geometric distance from a specified measurement location to
    the plasma boundary, represented by the last closed flux surface or separatrix.
    It is zero on the boundary, positive on the scrape-off-layer side, and negative
    inside the confined plasma.
  documentation: 'Gap at the plasma boundary is the signed shortest distance from
    a specified point to the nearest point on the last closed flux surface or separatrix.
    It measures the point''s geometric offset from the confined plasma edge and is
    zero when the point lies on that boundary.


    Using position vectors expressed in the right-handed cylindrical $(R, \phi, Z)$
    frame, the signed gap $g$ is defined as the minimum Euclidean distance to the
    plasma-boundary surface $\Gamma_b$:


    $$

    g = \sigma \min_{\mathbf{x}_b \in \Gamma_b} \left\lVert \mathbf{x}_m - \mathbf{x}_b
    \right\rVert

    $$


    where $\mathbf{x}_m$ is the measurement position, $\mathbf{x}_b$ is a point on
    the plasma-boundary surface, and $\sigma$ assigns the outside or inside sign.
    For an axisymmetric equilibrium, the same definition is commonly evaluated as
    the minimum distance to the separatrix curve in a poloidal cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame at the relevant toroidal angle $\phi$.


    The quantity is computed by combining the measurement-point geometry with an equilibrium
    reconstruction of the last closed flux surface or separatrix. If a flux-surface
    label such as normalized poloidal flux $\psi_N$ is used operationally, that label
    must first be mapped to a specified geometric distance, for example an outboard-midplane
    radial distance, rather than treated as a distance by itself.


    Typical near-edge values have absolute magnitudes from about $10^{-3}$-$10^{-1}$
    m, with embedded or reciprocating edge measurements often within a few centimeters
    of the separatrix. Larger magnitudes can occur for points well inside the confined
    plasma or far into the scrape-off layer.


    Sign convention: Positive when the measurement point lies outside the last closed
    flux surface on the scrape-off-layer side of the plasma boundary.'
  unit: m
  physics_domain: equilibrium
  links: []
- name: height_of_plasma_filament
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of a discrete
    plasma current-carrying filament element, measured parallel to the machine symmetry
    axis.
  documentation: 'In the filamentary model of plasma current distribution used for
    equilibrium reconstruction, the plasma current is represented by a set of discrete
    elements, each assigned a cross-sectional geometry. When the cross-section is
    modeled as a rectangle, the height defines the full vertical extent of that rectangle
    measured along the $Z$ axis of the cylindrical $(R, \phi, Z)$ frame, where $R$
    is the major radius, $\phi$ is the toroidal angle, and $Z$ is the vertical coordinate.


    For a rectangular filament element with height $h$ and horizontal width $w$, the
    rectangular cross-sectional area is $A = h \times w$, which is consistent with
    area_of_plasma_filament. The height is specified alongside width_of_plasma_filament
    to fully characterize the rectangular geometry; for annular cross-sections, the
    radial bounds are instead described by [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament)
    and [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament).


    The height is a fixed geometric input parameter assigned when constructing the
    filamentary current model, with its value chosen to resolve the spatial scale
    of interest in the current distribution. Typical values range from a few centimeters
    to tens of centimeters depending on the resolution requirements of the equilibrium
    reconstruction.


    Sign convention: Positive when the vertical extent of the filament cross-section
    is measured in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_plasma_filament
  - name:outer_radius_of_plasma_filament
- name: length_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Arc length of the plasma boundary in a fixed-toroidal-angle poloidal\
    \ cross-section of the right-handed cylindrical (R, \u03C6, Z) frame. It is the\
    \ perimeter of the last closed magnetic-flux-surface contour."
  documentation: 'Length of the plasma boundary is the total arc length of the closed
    contour formed by the last closed magnetic flux surface in a fixed-toroidal-angle
    poloidal cross-section. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height; this
    quantity is computed from the contour in the $(R,Z)$ cross-section at constant
    $\phi$. It is independent of whether the contour is traversed clockwise or counter-clockwise.


    For a smooth boundary represented by a parameter $\lambda$ that traces the closed
    contour once, the poloidal boundary length is


    $$

    L_\mathrm{pol} = \int_0^1 \sqrt{\left(\frac{dR}{d\lambda}\right)^2 + \left(\frac{dZ}{d\lambda}\right)^2}\,
    d\lambda

    $$


    where $R(\lambda)$ and $Z(\lambda)$ are the contour coordinates in meters and
    $\lambda$ is dimensionless. For a circular boundary of minor radius $a$ in meters,
    this reduces to $L_\mathrm{pol}=2\pi a$.


    The contour is obtained from magnetic-equilibrium reconstruction by identifying
    the separatrix in diverted plasmas or the limiting last closed flux surface in
    limited plasmas, then integrating the arc element around that closed curve. This
    length complements other boundary-geometry measures such as area_of_plasma_boundary,
    [volume_of_plasma_boundary](name:volume_of_flux_surface), [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),
    and [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary);
    elongation, triangularity, and X-point shaping generally increase the perimeter
    relative to a circular contour with the same minor radius.


    Representative values scale directly with plasma minor radius and shaping. As
    geometric scale checks, a circular contour with $a=0.3-2$ m has $L_\mathrm{pol}\approx
    2-13$ m, while elongated or diverted contours of comparable minor radius are typically
    larger by tens of percent.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:volume_of_flux_surface
  - name:elongation_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
- name: lower_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Ratio of the lower boundary half-height to the plasma minor radius,
    describing the vertical elongation of the plasma cross-section below the geometric
    axis.
  documentation: 'The lower elongation $\kappa_{\rm lower}$ is a dimensionless shape
    parameter quantifying the vertical extent of the lower half of the plasma boundary
    cross-section relative to the plasma minor radius, complementing [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary)
    for up-down asymmetric plasma shaping.


    The defining relation is:


    $$

    \kappa_{\rm lower} = \frac{Z_{\rm axis} - Z_{\rm lower}}{a}

    $$


    where $Z_{\rm axis}$ is the vertical coordinate of the plasma geometric axis in
    the right-handed cylindrical $(R, \phi, Z)$ frame, $Z_{\rm lower}$ is the vertical
    coordinate of the lowermost point of the boundary contour, and $a$ is the plasma
    minor radius.


    When $\kappa_{\rm lower}$ differs from [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary),
    the plasma has up-down asymmetric shaping, which is characteristic of single-null
    divertor configurations with the X-point in the lower divertor. The global [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)
    captures the overall vertical half-height ratio for symmetric boundaries, but
    $\kappa_{\rm lower}$ and its upper counterpart together fully characterize asymmetric
    boundary shapes relevant to MHD stability and confinement modeling. Typical values
    range from 1.0 in near-circular lower halves to approximately 2.0 in strongly
    shaped H-mode plasmas. The quantity is obtained from equilibrium reconstruction
    by fitting the boundary contour in the poloidal $(R, Z)$ plane using external
    magnetic measurements.


    Sign convention: Positive when the lowermost point of the plasma boundary contour
    lies below the geometric axis, i.e., $Z_{\rm lower} < Z_{\rm axis}$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  arguments:
  - name: elongation_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
- name: magnetic_field
  kind: vector
  status: draft
  description: Total local magnetic field vector in a magnetically confined plasma,
    formed by superposition of contributions from external coil systems and plasma-current-generated
    fields.
  documentation: "The magnetic field vector $\\mathbf{B}$ represents the total local\
    \ magnetic field at each point in a magnetically confined plasma, combining the\
    \ dominant toroidal component provided by toroidal field coils with the poloidal\
    \ component arising from plasma current and poloidal field coils, together with\
    \ any non-axisymmetric perturbations from error fields or applied resonant magnetic\
    \ perturbations. The [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field)\
    \ isolates the externally driven toroidal contribution, while [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field)\
    \ captures the toroidally varying non-axisymmetric part.\n\nThe field satisfies\
    \ the solenoidal constraint $\\nabla \\cdot \\mathbf{B} = 0$ everywhere and, in\
    \ the presence of plasma currents $\\mathbf{j}$, obeys Amp\xE8re's law:\n\n$$\n\
    \\nabla \\times \\mathbf{B} = \\mu_0 \\, \\mathbf{j}\n$$\n\nwhere $\\mu_0 = 4\\\
    pi \\times 10^{-7}$ H m$^{-1}$ is the permeability of free space and $\\mathbf{j}$\
    \ is the total current density in A m$^{-2}$.\n\nThe field is reconstructed from\
    \ external magnetics diagnostics \u2014 flux loops, Rogowski coils, and pick-up\
    \ coils \u2014 supplemented where available by in-vessel probe measurements. The\
    \ ratio of plasma kinetic pressure to local magnetic pressure defines beta, a\
    \ key dimensionless stability parameter derived from $|\\mathbf{B}|$.\n\nOn-axis\
    \ total field magnitudes span 1\u20136 T in present-day tokamaks, with the toroidal\
    \ component dominant and the poloidal component typically 10\u2013100 times smaller.\n\
    \nSign convention: Positive when each component points in the positive direction\
    \ of the corresponding axis of the right-handed cylindrical $(R, \\phi, Z)$ frame\
    \ \u2014 outward for the radial component, in the direction of increasing toroidal\
    \ angle $\\phi$ for the toroidal component, and upward ($+Z$) for the vertical\
    \ component."
  unit: T
  physics_domain: equilibrium
  links:
  - name:toroidal_vacuum_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
- name: magnetic_flux
  kind: vector
  status: draft
  description: Family of magnetic flux quantities in tokamak equilibrium, spanning
    poloidal and toroidal projections and contributions from external coils, resistive
    dissipation, and plasma diamagnetism.
  documentation: 'Magnetic flux is the surface integral of the magnetic field over
    a bounded area, quantifying the total field lines threading a specified surface.
    In tokamak equilibrium, the vector quantity encompasses several physically distinct
    components: [poloidal magnetic flux](name:poloidal_magnetic_flux) threading horizontal
    disks centered on the toroidal symmetry axis serves as the canonical radial flux-surface
    coordinate, while [toroidal magnetic flux](name:toroidal_magnetic_flux) threads
    the poloidal cross-section enclosed by each flux surface and increases monotonically
    outward from the magnetic axis.


    The defining surface integral is:


    $$

    \Phi = \int_S \mathbf{B} \cdot d\mathbf{A}

    $$


    where $\mathbf{B}$ is the magnetic-field vector and $d\mathbf{A}$ is the oriented
    area element of the bounding surface $S$.


    Beyond the geometric poloidal and toroidal projections, the equilibrium flux budget
    includes contributions from external coil systems such as the central solenoid
    and poloidal-field coils, and flux consumed by resistive dissipation within the
    plasma. The [poloidal current weighted average external magnetic flux](name:poloidal_current_weighted_average_external_magnetic_flux)
    is one such derived quantity combining external-source flux with current weighting.
    Flux quantities are measured by saddle loops, flux loops, and diamagnetic loops
    distributed around the vacuum vessel, and are reconstructed from equilibrium solvers
    that invert the Grad-Shafranov equation in the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    Sign convention: Positive when the enclosed magnetic flux is directed in the direction
    of increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  - name:toroidal_magnetic_flux
  - name:poloidal_current_weighted_average_external_magnetic_flux
- name: magnetic_shear
  kind: scalar
  status: draft
  description: Normalized logarithmic derivative of the safety factor with respect
    to the normalized toroidal flux radius, quantifying the radial rate of change
    of magnetic field-line helicity across nested flux surfaces.
  documentation: "Magnetic shear $s$ measures how rapidly the pitch of nested magnetic\
    \ field lines changes across flux surfaces and is a fundamental parameter governing\
    \ magnetohydrodynamic (MHD) stability and cross-field turbulent transport. It\
    \ distinguishes conventional positive-shear configurations, which suppress certain\
    \ interchange modes, from reversed-shear configurations, which can suppress ion-temperature-gradient\
    \ turbulence.\n\nThe defining relation is:\n\n$$\ns = \\frac{\\rho_\\mathrm{tor}}{q}\
    \ \\frac{dq}{d\\rho_\\mathrm{tor}}\n$$\n\nwhere $q$ is the safety factor and $\\\
    rho_\\mathrm{tor}$ is the normalized toroidal flux radius running from 0 at the\
    \ magnetic axis to 1 at the last closed flux surface. An equivalent minor-radius\
    \ form is $s = (r/q)(dq/dr)$ where $r$ is the local minor radius.\n\nMagnetic\
    \ shear is computed from equilibrium reconstructions by evaluating the logarithmic\
    \ derivative of the reconstructed safety factor profile with respect to the radial\
    \ flux label. In conventional H-mode scenarios, $s$ rises from near zero on axis\
    \ to approximately 2\u20135 near the edge; in reversed-shear advanced scenarios,\
    \ $s$ is negative (typically $-1$ to $-2$) in the core. The on-axis limit is given\
    \ by [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis),\
    \ the pedestal value by [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal),\
    \ and the flux-surface-averaged form by [flux_surface_averaged_magnetic_shear](name:flux_surface_averaged_magnetic_shear).\n\
    \nSign convention: Positive when the safety factor $q$ increases with increasing\
    \ normalized toroidal flux radius $\\rho_\\mathrm{tor}$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_pedestal
  - name:flux_surface_averaged_magnetic_shear
- name: magnetic_shear_at_magnetic_axis
  kind: scalar
  status: draft
  description: Dimensionless magnetic shear at the magnetic axis, defined as the limiting
    normalized logarithmic derivative of the safety factor with respect to normalized
    toroidal flux radius. For a smooth finite-q equilibrium this axis limit is zero.
  documentation: 'Magnetic shear at the magnetic axis is the axis limiting value of
    local magnetic shear, describing how rapidly the safety factor changes as one
    moves outward from the magnetic axis in normalized toroidal flux radius. It is
    a dimensionless local equilibrium quantity, not a finite-radius average.


    The defining value is the one-sided radial limit of local magnetic shear:


    $$

    s_\mathrm{axis} = \lim_{\rho_\mathrm{tor}\to 0^+} \frac{\rho_\mathrm{tor}}{q(\rho_\mathrm{tor})}\frac{d
    q}{d\rho_\mathrm{tor}}

    $$


    where $\rho_\mathrm{tor}$ is the normalized toroidal flux radius, a dimensionless
    radial coordinate with value 0 at the magnetic axis and value 1 at the plasma
    boundary, and $q(\rho_\mathrm{tor})$ is the safety factor. Since both $q$ and
    $\rho_\mathrm{tor}$ are dimensionless, $s_\mathrm{axis}$ has unit 1.


    In equilibrium analysis it is obtained from the reconstructed radial dependence
    of $q$ by fitting or differentiating near the magnetic axis and taking the limiting
    expression above. For regular equilibria with finite $q$ at the axis, the factor
    $\rho_\mathrm{tor}$ makes the exact limit vanish; the curvature of $q$ controls
    how quickly magnetic shear rises away from the axis, not a finite physical on-axis
    shear. Negative or positive shear associated with reversed-shear configurations
    occurs at finite radius, while the smooth on-axis limit remains zero.


    The typical physical value is 0 for smooth finite-q tokamak equilibria. Numerical
    evaluations may show small residual absolute values, commonly 0-0.1 depending
    on radial resolution, smoothing, and whether a finite-radius point was used instead
    of the mathematical limit; larger magnitudes usually indicate extrapolation or
    loss of near-axis regularity.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_at_pedestal
  - name:magnetic_shear_at_internal_transport_barrier
  arguments:
  - name: magnetic_shear
    operator: magnetic_axis
    operator_kind: locus
- name: major_radius
  kind: scalar
  status: draft
  description: "Perpendicular distance from the machine's toroidal symmetry axis to\
    \ a point in the right-handed cylindrical (R, \u03C6, Z) frame, used as the fundamental\
    \ radial coordinate in equilibrium grids, MHD geometry, and device cross-section\
    \ calculations."
  documentation: "The major radius $R$ is the perpendicular distance from the machine's\
    \ toroidal symmetry axis to a given spatial point, measured in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above $+\\hat{Z}$ and $Z$ is the vertical\
    \ height. It is the primary radial coordinate of axisymmetric plasma geometry,\
    \ entering metric factors in cylindrical differential operators, the ion gyroradius\
    \ $\\rho_i = m_i v_{\\perp} / (Z_i e B)$, and the geometric weighting of current\
    \ and pressure distributions.\n\nIn axisymmetric equilibrium, the poloidal magnetic\
    \ flux $\\psi(R, Z)$ satisfies the Grad-Shafranov equation:\n\n$$\nR\\frac{\\\
    partial}{\\partial R}\\!\\left(\\frac{1}{R}\\frac{\\partial\\psi}{\\partial R}\\\
    right) + \\frac{\\partial^2\\psi}{\\partial Z^2} = -\\mu_0 R^2\\frac{dp}{d\\psi}\
    \ - F\\frac{dF}{d\\psi}\n$$\n\nwhere $p(\\psi)$ is the plasma kinetic pressure,\
    \ $F(\\psi) = RB_\\phi$ is the poloidal current function, and $\\mu_0$ is the\
    \ permeability of free space. Coordinate grids in $R$ are constructed for equilibrium\
    \ reconstruction, MHD linear stability analysis, and the geometric description\
    \ of device structures including halo-current wall boundaries and injector positions.\n\
    \nThe [flux-surface-averaged major radius](name:flux_surface_averaged_major_radius)\
    \ provides the flux-surface mean of $R$, weighted by the inverse poloidal field\
    \ strength, and is used in transport modeling. The quantity major_radius_of_geometric_axis\
    \ specializes $R$ to the plasma geometric center, and major_radius_of_strike_point\
    \ gives $R$ at the divertor heat-load footprint. Typical values span roughly 0.3\u2013\
    1.5 m on the high-field side to 1.5\u20136 m at the outer midplane for present-day\
    \ tokamaks.\n\nSign convention: Positive when measured outward from the toroidal\
    \ symmetry axis in the direction of increasing $R$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_major_radius
- name: flux_surface_averaged_major_radius
  kind: scalar
  status: draft
  description: Flux-surface average of the major radius coordinate R on each nested
    magnetic flux surface, yielding the mean distance from the toroidal symmetry axis
    weighted by the inverse poloidal field strength.
  documentation: 'The flux-surface averaged major radius $\langle R \rangle$ is the
    mean value of the cylindrical major radius coordinate $R$ over a closed toroidal
    magnetic flux surface, weighted by the local inverse poloidal magnetic field magnitude.
    It belongs to the family of geometric metric coefficients (sometimes denoted $gm8$
    in neoclassical transport literature) that enter the flux-surface-averaged forms
    of transport and equilibrium equations, and is the flux-surface-averaging transformation
    of the parent quantity [major_radius](name:major_radius).


    The defining expression is:


    $$

    \langle R \rangle = \frac{\oint R \, \frac{dl}{B_p}}{\oint \frac{dl}{B_p}}

    $$


    where $l$ is the poloidal arc length along the flux surface and $B_p$ is the poloidal
    magnetic field magnitude, with integrals taken over one complete poloidal circuit.
    Because $B_p$ is smaller on the outboard low-field side, field lines dwell longer
    there, and $\langle R \rangle$ is shifted toward larger $R$ relative to a simple
    geometric centroid; it lies between the inner_major_radius_of_flux_surface and
    the outer_major_radius_of_flux_surface.


    This coefficient is computed directly from the magnetic geometry obtained in equilibrium
    reconstruction, and is closely related to flux_surface_average_magnetic_field
    and flux_surface_averaged_curvature, which are derived from the same surface-averaging
    procedure.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links: []
  arguments:
  - name: major_radius
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: maximum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Maximum value of the total magnetic field magnitude on a nested toroidal
    magnetic flux surface. It is a non-negative scalar that characterizes the strongest
    field encountered on that surface.
  documentation: 'Maximum magnetic field magnitude is the largest value of $|\mathbf{B}|$
    over a single nested toroidal magnetic flux surface. It is paired with [minimum_magnetic_field_magnitude](name:minimum_magnetic_field_magnitude)
    and, together with that minimum, characterizes the magnetic-field variation experienced
    by guiding-center orbits on the surface.


    For a surface labeled by poloidal flux $\psi$, the quantity is defined by


    $$

    B_{\max}(\psi) = \max_{\mathbf{x} \in S(\psi)} \left|\mathbf{B}(\mathbf{x})\right|

    $$


    where $S(\psi)$ is the magnetic flux surface with label $\psi$, $\mathbf{x}$ is
    position, $\mathbf{B}$ is the magnetic field vector, and both $|\mathbf{B}|$ and
    $B_{\max}$ are measured in T.


    In equilibrium analysis it is computed by evaluating the full magnetic field magnitude
    on each flux surface and taking the surface maximum, usually with interpolation
    between reconstructed equilibrium points. In axisymmetric tokamaks the maximum
    often occurs toward the inboard, higher-field side because the toroidal field
    usually increases there, but this location is not part of the definition and can
    be affected by shaping and poloidal-field contributions.


    For trapped-passing physics, $B_{\max}$ gives the largest field strength a particle
    must access to circulate around the surface. For a particle with kinetic energy
    $E$ and magnetic moment $\mu$, full access to the surface requires $\mu B_{\max}
    < E$; equality gives the trapped-passing boundary, while $\mu B_{\max} > E$ implies
    reflection before the particle reaches the highest-field region.


    Typical values are about 1-8 T in many present tokamak plasmas and can exceed
    10 T in compact high-field devices; low-field or spherical tokamak plasmas can
    be below 1 T. The value depends mainly on external toroidal field strength, plasma
    geometry, and the poloidal-field contribution.'
  unit: T
  physics_domain: equilibrium
  links: []
- name: minimum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Smallest value of total magnetic field magnitude on each nested toroidal
    flux surface, used in determining the magnetic trapping condition for charged
    particles in bounce motion.
  documentation: 'The minimum magnetic field magnitude $B_\mathrm{min}(\psi)$ is the
    smallest value of $|\mathbf{B}|$ over all points on the flux surface labeled by
    poloidal flux $\psi$. In tokamaks with a dominant toroidal field satisfying $B_\phi
    \propto 1/R$, the minimum occurs near the outboard (low-field-side) midplane,
    where the major radius $R$ reaches its largest value on the flux surface.


    The ratio $B_\mathrm{min}/B_\mathrm{max}$ governs magnetic trapping of charged
    particles bouncing along field lines. A particle with normalized parallel velocity
    $\xi = v_\parallel/v$ is magnetically trapped when


    $$

    \xi^2 < 1 - \frac{B_\mathrm{min}}{B_\mathrm{max}}

    $$


    where $v_\parallel$ is the velocity component along the magnetic field and $v$
    is the total particle speed. The resulting trapped particle fraction enters neoclassical
    transport coefficients, bootstrap current models, and bounce-averaged kinetic
    equations.


    $B_\mathrm{min}$ is obtained from MHD equilibrium reconstruction by minimizing
    the total field strength $|\mathbf{B}(\psi, \theta)|$ over the poloidal angle
    $\theta$ on each flux surface. Together with [maximum_magnetic_field_magnitude](name:maximum_magnetic_field_magnitude)
    and flux_surface_average_magnetic_field, it fully characterizes the field-strength
    variation on a flux surface that is relevant for classifying particle orbits.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_magnitude
- name: minor_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Half the difference between the maximum and minimum major radii of
    the plasma boundary contour, giving the characteristic radial half-width of the
    outermost closed flux surface.
  documentation: "The minor radius $a$ of the plasma boundary is a fundamental geometric\
    \ length quantifying the radial half-extent of the outermost closed flux surface.\
    \ Together with the [major radius of the plasma boundary], it sets the first-order\
    \ cross-sectional size and determines the plasma aspect ratio.\n\nThe minor radius\
    \ is defined from the extremal major radii of the boundary outline in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame:\n\n$$\na = \\frac{R_{\\max} - R_{\\min}}{2}\n\
    $$\n\nwhere $R_{\\max}$ and $R_{\\min}$ are the maximum and minimum values of\
    \ the major radius $R$ along the closed poloidal boundary contour.\n\nThe minor\
    \ radius is obtained from equilibrium reconstruction using external magnetic measurements\
    \ \u2014 flux loops and poloidal field probes \u2014 supplemented by internal\
    \ constraints from motional Stark effect polarimetry or pressure-profile data.\
    \ It also serves directly as a position-control reference in plasma shape control.\n\
    \nValues range from 0.2\u20130.3 m in small tokamaks to ~2 m in large high-current\
    \ devices. The inverse aspect ratio $\\epsilon = a / R_0$ (where $R_0$ is the\
    \ major radius on axis) underpins dimensionless confinement scalings, and derived\
    \ shape descriptors such as [elongation of the plasma boundary](name:elongation_of_plasma_boundary)\
    \ and the [poloidal boundary perimeter](name:length_of_plasma_boundary) are both\
    \ normalized by $a$.\n\nSign convention: Positive when $R_{\\max} > R_{\\min}$\
    \ along the boundary contour in the $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:length_of_plasma_boundary
- name: non_axisymmetric_magnetic_field
  kind: vector
  status: draft
  description: Non-axisymmetric part of the vacuum magnetic field vector, obtained
    by removing the toroidally averaged component, representing toroidally varying
    perturbations such as error fields, resonant magnetic perturbations, and finite
    coil geometry effects.
  documentation: 'The non-axisymmetric magnetic field is the vector magnetic induction
    formed by subtracting the axisymmetric (toroidally averaged) component from the
    total vacuum magnetic field, retaining only the part that varies with toroidal
    angle $\phi$. It encompasses both intrinsic error fields arising from coil misalignment
    and discrete conductor geometry, and deliberately applied perturbation fields
    from coil systems used in resonant magnetic perturbation (RMP) experiments targeting
    edge-localized mode suppression.


    The decomposition into non-axisymmetric and axisymmetric parts is defined as:


    $$

    \mathbf{B}_\mathrm{na}(R,\phi,Z) = \mathbf{B}_\mathrm{vac}(R,\phi,Z) - \frac{1}{2\pi}\int_0^{2\pi}\mathbf{B}_\mathrm{vac}(R,\phi'',Z)\,d\phi''

    $$


    where $\mathbf{B}_\mathrm{vac}$ is the total vacuum magnetic field and the integral
    extracts its toroidal average. The vector is expressed in the right-handed cylindrical
    $(R, \phi, Z)$ frame with $\hat{R} \times \hat{\phi} = \hat{Z}$.


    The field is computed by Biot-Savart integration over each conductor''s geometry
    followed by subtraction of the axisymmetric component; it represents the vacuum
    perturbation only and does not include plasma shielding or amplification, which
    require magnetohydrodynamic or kinetic modeling. The individual cylindrical components
    are [radial_non_axisymmetric_magnetic_field](name:radial_non_axisymmetric_magnetic_field),
    [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field),
    and [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field).
    The normal projection onto prescribed control surfaces is given by non_axisymmetric_magnetic_field_at_control_surface,
    commonly used as an equilibrium reconstruction constraint.


    Typical perturbation amplitudes at the plasma boundary range from $10^{-5}$ to
    $10^{-2}$ T, with deliberately applied RMP systems at the upper end and residual
    intrinsic error fields around $10^{-4}$ T for well-corrected devices.


    Sign convention: Positive when each cylindrical component points in the direction
    of its respective basis vector, $+\hat{R}$, $+\hat{\phi}$, or $+\hat{Z}$, in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  arguments:
  - name: magnetic_field
    operator: non_axisymmetric
    operator_kind: qualifier
- name: normalized_minor_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless minor-radius label of a magnetic flux surface. It is
    half the difference between the surface's maximum and minimum major radii, divided
    by a specified positive reference length L_ref.
  documentation: 'The normalized minor radius of a flux surface is a geometric radial
    coordinate based on the inboard-to-outboard extent of that surface in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height. It labels how far the surface lies from the magnetic axis by using the
    surface half-width in major radius, normalized by a separately specified positive
    reference length.


    The defining relation is


    $$

    r_{\mathrm{minor,norm}} = \frac{R_{\max} - R_{\min}}{2 L_{\mathrm{ref}}}

    $$


    where $R_{\max}$ and $R_{\min}$ are the maximum and minimum major radii of the
    flux surface in meters, and $L_{\mathrm{ref}}$ is the positive reference length
    in meters used for the normalization. The reference length is part of the normalization
    definition and must be stated consistently; for a whole-plasma radial coordinate
    it is commonly the minor radius of a reference boundary flux surface, so the boundary
    value is approximately 1, whereas other modeling contexts may choose a different
    positive reference length.


    In practice the quantity is computed from an equilibrium flux surface by finding
    the extrema of $R$ on the closed surface or on its poloidal cross-section in an
    axisymmetric equilibrium. It is a geometric flux-surface label and should be distinguished
    from flux-based radial coordinates such as the toroidal flux radius, which are
    derived from enclosed magnetic flux rather than from the major-radius half-width.


    Typical values are 0 at the magnetic axis, about 0.1-0.9 for core to near-edge
    flux surfaces when $L_{\mathrm{ref}}$ is the boundary minor radius, and approximately
    1 at the reference boundary surface. Values greater than 1 can occur if the chosen
    reference length is smaller than the surface minor radius or if surfaces outside
    the reference boundary are considered.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_major_radius
  - name:toroidal_reference_magnetic_field
  - name:normalized_particle_mass
- name: normalized_plasma_internal_inductance
  kind: scalar
  status: draft
  description: Dimensionless plasma inductance parameter measuring the peaking of
    the poloidal magnetic field profile relative to a uniform current distribution;
    values above 0.5 indicate increasingly centrally peaked current density.
  documentation: 'The normalized plasma internal inductance is a dimensionless global
    equilibrium parameter that measures how centrally concentrated the toroidal current
    density is relative to a uniform distribution, with larger values corresponding
    to more strongly peaked current profiles.


    The governing definition integrates the squared poloidal magnetic field $B_p$
    over the plasma volume and normalizes it by the reference magnetic pressure associated
    with the total current:


    $$

    l_i = \frac{2}{R_0 \mu_0^2 I_p^2} \int B_p^2 \, dV

    $$


    where $R_0$ is the reference major radius, $\mu_0$ is the permeability of free
    space, $I_p$ is the total plasma current, and $B_p$ is the poloidal field strength.
    A cylindrical plasma with uniform current density gives $l_i \approx 0.5$; centrally
    peaked profiles yield larger values approaching or exceeding unity.


    Equilibrium reconstruction combining external magnetic measurements (flux loops,
    Rogowski coils, and poloidal field probes) with internal profile diagnostics provides
    $l_i$ as a global output. Typical tokamak discharge values range from about 0.5
    in broad H-mode current profiles to above 1.0 in peaked Ohmic or post-sawtooth
    states.


    The value of $l_i$ is set by the radial profile of [current density](name:current_density)
    and the equilibrium geometry; it is a central indicator of current profile evolution
    during sawtooth cycles, current ramps, and non-inductive drive scenarios. Together
    with [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary) and triangularity,
    $l_i$ constrains the passive vertical stability margin of an elongated tokamak
    plasma.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:elongation_of_plasma_boundary
  sources:
