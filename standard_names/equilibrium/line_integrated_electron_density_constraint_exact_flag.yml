name: line_integrated_electron_density_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the line-integrated electron density
  constraint is treated as exact input (1) or fitted in a least-squares sense (0).
documentation: This flag controls how the equilibrium reconstruction code handles
  the line-integrated electron density measurement $\int n_e \, dl$ along a given
  chord. When set to 1, the measurement is imposed as an exact constraint and is not
  subject to least-squares fitting; when set to 0, the solver includes it in the $\chi^2$
  cost functional with its associated weight and uncertainty. The distinction matters
  for well-diagnosed chords where the interferometric measurement uncertainty is negligible
  compared to other constraints. Typical usage pairs this flag with the corresponding
  constraint weight and measured value. See also `measurement_time_of_line_integrated_electron_density_constraint`
  for the associated time stamp and `equilibrium_reconstruction_constraint_weight_of_diamagnetic_flux`
  for an analogous weight quantity.
