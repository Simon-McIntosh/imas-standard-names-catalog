name: volume_averaged_xenon_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Volume-averaged number density of all xenon ion charge states, summed
  over the confined plasma volume.
documentation: "The volume-averaged xenon ion number density $\\langle n_{\\mathrm{Xe}}\\\
  rangle_V = V^{-1}\\int n_{\\mathrm{Xe}}(\\mathbf{r})\\,dV$ represents the total\
  \ ionized xenon content (charge states up to Xe$^{54+}$) averaged over the plasma\
  \ volume $V$ in m$^{-3}$. Xenon is occasionally injected as a high-$Z$ noble-gas\
  \ impurity for radiative mantle cooling, disruption mitigation via massive gas injection\
  \ (MGI), or as a diagnostic tracer for impurity transport studies. In radiative-mantle\
  \ scenarios, typical volume-averaged values are $10^{15}$\u2013$10^{17}\\;\\mathrm{m}^{-3}$,\
  \ chosen so that the radiated power fraction stays below the confinement-degradation\
  \ threshold. The quantity is measured by VUV/EUV spectroscopy targeting specific\
  \ Xe charge-state transitions or deduced from bolometric radiated-power profiles\
  \ coupled with impurity transport codes. Xenon's high atomic number ($Z=54$) means\
  \ even modest concentrations significantly elevate $Z_{\\mathrm{eff}}$ and dilute\
  \ the fuel-ion population, impacting fusion performance. See also `volume_averaged_electron_number_density`,\
  \ `volume_averaged_tungsten_ion_number_density`, and `argon_ion_number_density_at_pedestal`\
  \ for other impurity species."
