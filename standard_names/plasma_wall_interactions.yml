- name: particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Outgoing particle-number flux per unit plasma-facing wall area produced
    when incident plasma ions recombine at the surface, summed over emitted product
    species and states.
  documentation: 'Particle flux at the wall due to recombination quantifies the rate
    at which recombination-associated particles are emitted from a plasma-facing surface
    per unit area as a result of incident plasma ions recombining or neutralizing
    at the material boundary. It is the total count flux of emitted product particles,
    not the incident plasma flux or the energy deposited in the wall.


    The total recombination particle flux at wall location $\mathbf{x}_w$ is defined
    by


    $$

    \Gamma_\mathrm{rec}(\mathbf{x}_w) = \sum_{a,\,q,\,c,\,k} \Gamma_{a,q,c,k}(\mathbf{x}_w)

    $$


    where $a$ identifies the emitted product species, $q$ the incident-ion charge
    state, $c$ the recombination channel, $k$ the product internal state or energy
    class, and $\Gamma_{a,q,c,k}$ the corresponding emitted-particle flux. For continuous
    product variables, the corresponding sums become integrals.


    This quantity is the particle-count counterpart of [energy flux at the wall due
    to recombination](name:energy_flux_at_wall_due_to_recombination) and is the component-specific
    realization of [flux at the wall due to recombination](name:flux_at_wall_due_to_recombination).
    The neutral-product specialization is [neutral particle flux at the wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination).'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
- name: neutral_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Outgoing neutral-particle number flux per unit plasma-facing wall area
    produced when incident plasma ions recombine at the surface, summed over neutral
    product species and internal states.
  documentation: 'Neutral particle flux at the wall due to recombination quantifies
    the rate at which neutral particles are emitted from a plasma-facing surface per
    unit area as a result of incident plasma ions recombining or neutralizing at the
    material boundary. It is the outgoing neutral-particle count flux, not the incident
    neutral flux or the energy deposited in the wall.


    The total neutral recombination particle flux at wall location $\mathbf{x}_w$
    is defined by


    $$

    \Gamma_{\mathrm{neutral,rec}}(\mathbf{x}_w) = \sum_{a,\,q,\,c,\,k} \Gamma_{a,q,c,k}(\mathbf{x}_w)

    $$


    where $a$ identifies the emitted neutral product species, $q$ the incident-ion
    charge state, $c$ the recombination channel, $k$ the product internal state or
    energy class, and $\Gamma_{a,q,c,k}$ the corresponding emitted-neutral particle
    flux. For continuous product variables, the corresponding sums become integrals.


    This quantity is the neutral-product specialization of [particle flux at the wall
    due to recombination](name:particle_flux_at_wall_due_to_recombination). Its state-resolved
    counterpart is [neutral internal state particle flux at the wall due to recombination](name:neutral_internal_state_particle_flux_at_wall_due_to_recombination),
    while [incident neutral particle flux at the wall due to recombination](name:incident_neutral_particle_flux_at_wall_due_to_recombination)
    describes the opposite direction of transport.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall_due_to_recombination
  - name:neutral_internal_state_particle_flux_at_wall_due_to_recombination
  - name:incident_neutral_particle_flux_at_wall_due_to_recombination
