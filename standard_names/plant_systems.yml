- name: efficiency_of_plant_system
  kind: scalar
  status: active
  description: Dimensionless ratio quantifying how effectively a plant system converts
    input power or energy into a specified useful output, abstracting over thermal
    and net efficiency definitions.
  documentation: "The efficiency of a plant system is a dimensionless performance\
    \ metric expressing the fraction of input power or energy that the plant converts\
    \ into a specified useful output. The exact physical scope depends on the efficiency\
    \ type applied: [thermal efficiency](name:thermal_efficiency_of_plant_system)\
    \ characterizes heat-to-work conversion across all thermodynamic conversion stages,\
    \ while [net efficiency](name:net_efficiency_of_plant_system) accounts for the\
    \ signed ratio of exported electrical power to total plant electrical consumption\
    \ including recirculating power.\n\nThe general defining relation takes the form:\n\
    \n$$\n\\eta = \\frac{W_\\text{out}}{W_\\text{in}}\n$$\n\nwhere $W_\\text{out}$\
    \ is the useful output (work, exported electrical power, or heat converted to\
    \ work) and $W_\\text{in}$ is the total input power or energy over the same operating\
    \ interval.\n\nEfficiency is evaluated from calorimetric heat-flow surveys, electrical\
    \ generation meters, and auxiliary power consumption measurements across all plant\
    \ subsystems. For fusion facilities, thermal conversion efficiencies in steam-cycle\
    \ plants lie in the range 30\u201345%, and net electrical efficiencies are further\
    \ reduced by recirculating power fractions for heating, current drive, and cooling\
    \ systems.\n\nSign convention: Positive when the plant system delivers net useful\
    \ output, so that $W_\\text{out} > 0$."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:thermal_efficiency_of_plant_system
  - name:net_efficiency_of_plant_system
- name: electron_source_rate_at_pellet_path_due_to_pellet_injection
  kind: scalar
  status: active
  description: Electron source rate at the pellet path due to pellet injection is
    the charge-weighted electron-equivalent production rate from ablation and ionization
    of pellet material at a specified position along the injected pellet trajectory.
  documentation: 'Electron source rate at the pellet path due to pellet injection
    is the charge-weighted electron-equivalent production rate from ablation and ionization
    of pellet material at a specified position along the injected pellet trajectory.
    It counts the free-electron source associated with material reaching that path
    position, not the electron concentration of the surrounding plasma.


    For trajectory coordinate $\ell$ and time $t$, the local rate is defined by the
    charge-weighted sum over ablated pellet constituents contributing at that same
    path position:


    $$

    S_e(\ell,t) = \sum_a Z_a^\mathrm{eff}(\ell,t)\,\dot{N}_a(\ell,t)

    $$


    where $S_e$ is the electron source rate at the pellet path due to pellet injection,
    $a$ indexes the pellet constituents or represented charge-state groups, $\dot{N}_a$
    is the local production rate of constituent $a$ by ablation and ionization, and
    $Z_a^\mathrm{eff}$ is the effective number of free electrons contributed by one
    produced constituent. For a fully ionized atomic constituent, $Z_a^\mathrm{eff}$
    reduces to its nuclear charge.


    This is a path-position rate, not a source density per distance along the pellet
    trajectory or a volume-integrated source. The [electron source rate due to injection](name:electron_source_rate_due_to_injection)
    is obtained only after aggregating the appropriate local electron-equivalent contributions,
    while [electron density of pellet path] describes electron concentration along
    the same trajectory. The [accumulated particle count at pellet path due to pellet
    injection](name:accumulated_particle_count_at_pellet_path_due_to_pellet_injection)
    is an unweighted cumulative particle count; it is not an electron-equivalent accumulated
    source unless the same charge weighting and time integration are applied.


    The value is non-negative and is zero where injected pellet material at the considered
    path position does not produce free electrons.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:electron_source_rate_due_to_injection
  - name:accumulated_particle_count_at_pellet_path_due_to_pellet_injection
  sources:
  - dd_path: pellets/time_slice/pellet/path_profiles/ablation_rate
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pellets.html#pellets-time_slice-pellet-path_profiles-ablation_rate
    dd_documentation:
