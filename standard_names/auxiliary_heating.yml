- name: ordinary_mode_fraction_of_wave_beam
  kind: scalar
  status: draft
  description: Dimensionless fraction of launched electron-cyclotron wave-beam power
    carried by ordinary-mode polarization.
  documentation: 'The ordinary-mode fraction of a wave beam is the fraction of launched
    electron-cyclotron power carried by the ordinary cold-plasma eigenpolarization.
    For propagation perpendicular to the equilibrium magnetic field, the ordinary
    mode has its electric field polarized parallel to the magnetic field, while the
    extraordinary mode has the complementary perpendicular polarization.


    The fraction is defined from the launched modal powers:


    $$

    f_O = \frac{P_O}{P_O + P_X}

    $$


    where $P_O$ is the launched ordinary-mode power in W and $P_X$ is the launched
    extraordinary-mode power in W. The denominator is the total launched power in
    W represented by these two polarization components.


    In practice, $f_O$ is computed from the complex wave electric field by projecting
    the launch polarization onto the ordinary and extraordinary eigenmodes, or inferred
    from calibrated launcher and polarizer settings. It characterizes the launched
    polarization state only; absorption and resonance behavior depend additionally
    on wave frequency, plasma parameters, propagation path, and electron cyclotron
    harmonic conditions.


    Allowed values range from 0 to 1. A value of 0 represents purely extraordinary-mode
    launch, 1 represents purely ordinary-mode launch, and intermediate values represent
    mixed launch polarization, with 0.5 corresponding to equal ordinary- and extraordinary-mode
    launched powers.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_electron_cyclotron_current_drive
  - name:fraction_of_wave_beam
  sources:
  - id: dd:ec_launchers/beam/o_mode_fraction
    dd_path: ec_launchers/beam/o_mode_fraction
    status: attached
  - id: dd:ec_launchers/beam/polarization/o_mode_fraction
    dd_path: ec_launchers/beam/polarization/o_mode_fraction
    status: composed
- name: parallel_per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel current density from wave-driven current
    drive, resolved per toroidal Fourier mode number, giving the field-aligned driven-current
    contribution of each harmonic as a radial profile.
  documentation: 'The flux-surface-averaged parallel (field-aligned) current density
    attributable to wave-driven current drive for a single toroidal Fourier mode $n_\phi$
    describes how each harmonic of the RF wave field contributes to non-inductive
    current generation as a function of plasma radius. Systems such as electron cyclotron
    (EC), lower hybrid (LH), and ion cyclotron (IC) heating drive parallel currents
    by transferring directed momentum to resonant particles; resolving the driven
    current density by toroidal mode number reveals the modal structure of the deposition
    profile.


    The quantity is the flux-surface average of the mode-resolved parallel current
    density:


    $$

    \langle J_\parallel^{(n_\phi)} \rangle = \frac{\langle \mathbf{J}^{(n_\phi)} \cdot
    \mathbf{B} \rangle}{\langle B \rangle}

    $$


    where $\mathbf{J}^{(n_\phi)}$ is the current density from the $n_\phi$-th toroidal
    mode, $\mathbf{B}$ is the equilibrium magnetic field, and $\langle \cdot \rangle$
    denotes the flux-surface average.


    This quantity is computed by ray-tracing, beam-tracing, or full-wave codes that
    model RF wave propagation and absorption on a flux-surface-resolved radial grid.
    Integrating over the enclosed plasma cross-section recovers the per-mode driven
    current [per_toroidal_mode_current_due_to_wave_driven_current_drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive),
    while summing all modes and integrating radially yields the total [current due
    to wave-driven current drive](name:current_due_to_wave_driven_current_drive).
    Peak values in tokamak RF scenarios range from $10^4$ to $10^6$ A m$^{-2}$ depending
    on absorbed power, plasma density, and wave geometry.


    Sign convention: Positive when the wave-driven parallel current flows in the same
    direction as the equilibrium magnetic field $\mathbf{B}$.'
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_current_due_to_wave_driven_current_drive
  - name:current_due_to_wave_driven_current_drive
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/current_parallel_density_n_tor
    dd_path: waves/coherent_wave/profiles_1d/current_parallel_density_n_tor
    status: composed
- name: parallel_per_toroidal_mode_electric_field
  kind: scalar
  status: draft
  description: Component of a coherent electromagnetic wave's electric field projected
    along the local equilibrium magnetic-field direction and resolved for a single
    toroidal Fourier mode. It is a mode-resolved electric-field phasor measured in
    volts per meter; its magnitude gives the field strength and its argument carries
    the radio-frequency phase. The parallel field drives wave-particle resonances
    such as Landau damping and transit-time pumping.
  documentation: 'Parallel per toroidal mode electric field is the component of a
    coherent electromagnetic-wave electric field directed along the local equilibrium
    magnetic field, associated with one integer toroidal Fourier mode. It is an electric-field
    phasor whose unit is volts per meter (equivalently $m^{-1}\cdot V$): its modulus
    gives the local field strength and its argument gives the radio-frequency phase
    relative to a stated source and time reference. It is not a dimensionless phase.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    in meters measured from the toroidal symmetry axis, $\phi$ is the toroidal angle
    in radians increasing counter-clockwise when viewed from above $+\hat{Z}$, and
    $Z$ is the vertical height in meters, the instantaneous physical parallel field
    is reconstructed from the toroidal-mode phasors as:


    $$

    E_\parallel(R,\phi,Z,t) = \Re\!\left[\sum_n E_{\parallel n}(R,Z)\,\exp\!\left(i(n\phi-\omega
    t)\right)\right]

    $$


    where $E_{\parallel n}=\mathbf{E}_n\cdot\hat{b}$ is the complex coefficient for
    mode $n$, $\hat{b}=\mathbf{B}/|\mathbf{B}|$ is the unit vector along the equilibrium
    magnetic field, $n$ is the integer toroidal mode number, $\omega$ is the wave
    angular frequency in radians per second, and $t$ is time in seconds. A phase derived
    from the phasor is $\arg(E_{\parallel n})$ on a branch such as $(-\pi,\pi]$ radians;
    changing the reference adds a constant phase without altering the field component
    itself.


    The quantity is obtained by decomposing a coherent wave field into toroidal Fourier
    harmonics and projecting each harmonic onto $\hat{b}$. It is local in the poloidal
    plane, and the projection along $\hat{b}$ ties its magnitude to the wave-particle
    interactions that underlie radio-frequency heating and current drive. The associated
    mode-resolved wave-driven current is described by parallel_per_toroidal_mode_wave_driven_current_density.


    Sign convention: Positive when the real instantaneous electric-field component
    points in the local magnetic-field direction $\hat{b}=\mathbf{B}/|\mathbf{B}|$.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/phase
    status: attached
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/phase
    status: attached
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/phase
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/phase
    status: attached
- name: per_toroidal_mode_current_due_to_wave_driven_current_drive
  kind: scalar
  status: draft
  description: Cumulative toroidal plasma current driven by wave-particle interactions
    and attributed to a single toroidal Fourier mode. It is enclosed by the flux surface
    labeled by normalized toroidal flux radius; at the outer closed surface it is
    that mode contribution to the total wave-driven current.
  documentation: 'Per-toroidal-mode current due to wave-driven current drive is the
    cumulative toroidal plasma current enclosed by a magnetic flux surface and assigned
    to one toroidal Fourier harmonic of the wave field. The enclosing surface is labeled
    by the normalized toroidal flux radius $\rho_\mathrm{tor,norm}$ in the flux-coordinate
    system $(\rho_\mathrm{tor,norm}, \theta, \phi)$, where $\phi$ is the toroidal
    angle of the right-handed cylindrical $(R, \phi, Z)$ frame with $R$ major radius
    and $Z$ vertical height. Summing all mode contributions gives the mode-integrated
    [current_due_to_wave_driven_current_drive](name:toroidal_current_due_to_wave_driven_current_drive)
    or [toroidal_current_due_to_wave_driven_current_drive](name:toroidal_current_due_to_wave_driven_current_drive);
    evaluated at the outer closed flux surface it gives that harmonic contribution
    to [toroidal_wave_driven_current](name:toroidal_current_due_to_wave_driven_current_drive).


    The toroidal mode label $n$ follows the wave-field Fourier convention in which
    the complex amplitude of that harmonic has toroidal phase factor $\exp(i n\phi)$.
    The enclosed current assigned to that harmonic can be defined from the mode-resolved
    driven current density by


    $$

    I_{\mathrm{wd},n}(\rho) = \frac{1}{2\pi}\int_{V(\rho)} \mathbf{j}_{\mathrm{wd},n}\cdot\nabla\phi\,dV

    $$


    where $I_{\mathrm{wd},n}$ is in A, $\rho=\rho_\mathrm{tor,norm}$ is dimensionless,
    $V(\rho)$ is the volume inside the flux surface, $\mathbf{j}_{\mathrm{wd},n}$
    is the wave-driven current-density contribution in A m$^{-2}$ assigned to mode
    $n$, $\nabla\phi$ is in m$^{-1}$, and $dV$ is in m$^3$. In an axisymmetric representation
    this is equivalent to integrating the toroidal component $j_{\phi,\mathrm{wd},n}$
    over the poloidal cross-section inside the same flux surface, and the mode-integrated
    current satisfies $I_\mathrm{wd}(\rho)=\sum_n I_{\mathrm{wd},n}(\rho)$.


    Computation normally starts from a wave absorption and wave-particle interaction
    model that resolves the toroidal Fourier spectrum, then projects or accumulates
    the driven-current contribution of each harmonic into the enclosed toroidal current.
    When using parallel_per_toroidal_mode_wave_driven_current_density, note that the
    related density is a flux-surface-averaged parallel current density; conversion
    to this current requires the equilibrium magnetic-field pitch and projection from
    the parallel direction to the toroidal direction before radial accumulation. The
    per-mode current is generally inferred from modeling constrained by magnetic,
    kinetic, and RF diagnostics rather than measured directly as an isolated harmonic
    current.


    Typical values are scenario dependent and are best interpreted relative to the
    mode-integrated wave-driven current at the same radius. Weak or nonresonant harmonics
    may contribute near 0 A, while a dominant harmonic can be a substantial fraction
    of the total wave-driven current, with the absolute scale set by the applied wave
    power, absorption, and current-drive efficiency.


    Sign convention: Positive when the wave-driven toroidal current contribution flows
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_current_due_to_wave_driven_current_drive
  arguments:
  - name: current_due_to_wave_driven_current_drive
    operator: per_toroidal_mode
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/global_quantities/current_phi_n_phi
    dd_path: waves/coherent_wave/global_quantities/current_phi_n_phi
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/current_tor_n_tor
    dd_path: waves/coherent_wave/global_quantities/current_tor_n_tor
