- name: particle_flux_due_to_neutral_beam_shinethrough
  kind: scalar
  status: draft
  description: Particle flux lost from the plasma due to neutral beam injection particles
    that traverse the plasma without ionizing.
  documentation: 'The shinethrough particle flux quantifies the rate at which neutral
    beam particles exit the plasma without undergoing ionization inside the confined
    region. These neutrals are lost through the last closed flux surface and deposit
    their energy and particles onto plasma-facing components, primarily the first
    wall. The flux is computed from the beam attenuation along its path through the
    plasma, integrating the neutral density lost via shinethrough for each beamlet.
    Shinethrough losses are most significant at low plasma density, high beam energy,
    or in the plasma edge, where the ionization mean free path exceeds the plasma
    chord length. Typical values for neutral beam injection in present-day tokamaks
    range from $10^{17}$ to $10^{19}$ s$^{-1}$ depending on the beam energy and target
    density, decreasing at higher densities where beam collisional ionization becomes
    more effective. This quantity complements the associated power loss described
    by [power_due_to_neutral_beam_shinethrough](name:power_due_to_neutral_beam_shinethrough).
    The particle flux compares with the incident beam particle flux and the fraction
    of ions that are thermalized in the core, which are not part of the shinethrough
    process.


    Sign convention: Positive when particles are lost from the plasma due to shinethrough.'
  unit: s^-1
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_neutral_beam_shinethrough
  sources:
  - id: dd:distribution_sources/source/global_quantities/shinethrough/particles
    dd_path: distribution_sources/source/global_quantities/shinethrough/particles
    status: composed
- name: per_toroidal_mode_fast_electron_absorbed_wave_power_density
  kind: scalar
  status: draft
  description: Volumetric power density deposited onto the fast electron population
    by auxiliary wave heating, resolved per toroidal mode number.
  documentation: 'This quantity represents the local power density $P_{n_\phi}(R,Z)$
    absorbed by the fast (suprathermal) electron population from a coherent auxiliary
    wave, decomposed by toroidal mode number $n_\phi$. It is obtained from full-wave
    or ray-tracing codes that compute the spatial distribution of wave power absorption
    on the fast electron distribution function, typically via quasi-linear diffusion
    models. In tokamaks, fast electrons are generated by electron cyclotron resonance
    heating (ECRH) and lower hybrid current drive, with absorbed power densities ranging
    from $10^3$ to $10^6~\mathrm{W/m^3}$ in the core depending on the heating system
    and plasma parameters. The sum over all toroidal mode numbers of this quantity
    recovers the total absorbed power density on fast electrons: $P_{\mathrm{fast}}(R,Z)
    = \sum_{n_\phi} P_{n_\phi}(R,Z)$. For the corresponding quantity on thermal electrons,
    see [per_toroidal_mode_thermal_electron_absorbed_wave_power_density](name:per_toroidal_mode_thermal_electron_absorbed_wave_power_density);
    for the fast-ion analog, see [per_toroidal_mode_fast_ion_absorbed_wave_power_density](name:per_toroidal_mode_fast_ion_absorbed_wave_power_density).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_electron_absorbed_wave_power_density
  - name:per_toroidal_mode_fast_ion_absorbed_wave_power_density
