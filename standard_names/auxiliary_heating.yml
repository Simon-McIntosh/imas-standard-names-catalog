- name: thermal_ion_power_density
  kind: scalar
  status: draft
  description: Volumetric absorbed wave power density deposited into the bulk Maxwellian
    ion population by coherent wave-particle interaction, summed over toroidal modes
    unless a mode-resolved quantity is specified.
  documentation: 'Thermal ion power density is the local rate per unit volume at which
    a coherent electromagnetic wave transfers energy to the bulk Maxwellian ion population.
    It excludes energy deposited directly into fast ions or electrons and represents
    the total thermal-ion absorption associated with the wave; for a toroidal-mode
    decomposition, summing the mode-resolved contributions gives this quantity.


    The local time-averaged absorption can be written in a quasi-linear Poynting-theorem
    form as


    $$

    p_{\mathrm{th},i}(\mathbf{x}) = \sum_n \frac{1}{2}\,\mathrm{Re}\!\left[\mathbf{J}_{\mathrm{th},i,n}(\mathbf{x})
    \cdot \mathbf{E}_n^*(\mathbf{x})\right]

    $$


    where $p_{\mathrm{th},i}$ is the thermal ion power density, $\mathbf{x}$ is position,
    $n$ is the toroidal Fourier mode index in the right-handed cylindrical $(R, \phi,
    Z)$ frame where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height, $\mathbf{E}_n$ is the complex wave electric-field amplitude, $\mathbf{J}_{\mathrm{th},i,n}$
    is the induced current associated with the thermal ion response, $^*$ denotes
    complex conjugation, and $\mathrm{Re}$ denotes the real part. A positive value
    corresponds to conversion of wave energy into thermal ion internal energy.


    In practice it is computed from coherent-wave fields and the thermal ion dielectric
    or damping response, including resonant wave-particle interactions, finite-Larmor-radius
    effects, and the relevant ion composition. Integrating this density over a plasma
    volume gives the corresponding [thermal_ion_power](name:thermal_ion_power), while
    integration inside a magnetic flux surface gives [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface).
    Charge-state-resolved deposition is represented by [thermal_ion_state_power_density](name:thermal_ion_state_power_density),
    and toroidal-mode-resolved deposition by [per_toroidal_mode_thermal_ion_power_density](name:per_toroidal_mode_thermal_ion_power_density).


    Typical values in RF-heated tokamak plasmas are about $10^3$-$10^6$ W m$^{-3}$
    for broadly distributed thermal-ion absorption, with localized ion-cyclotron resonance
    layers or strong single-pass damping reaching $10^6$-$10^8$ W m$^{-3}$. Values
    can be much smaller away from resonant layers or when most wave power is absorbed
    by electrons or fast ions.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_density
  - name:fast_ion_power_density
  - name:thermal_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
