- name: ion_state_velocity
  kind: vector
  status: draft
  description: Bulk fluid velocity vector of an ion species in a specified ionization
    charge state, defined as the first velocity moment of the charge-state distribution
    function normalized by the local charge-state number density.
  documentation: 'The ion-state velocity is the mean flow velocity of ions belonging
    to a single resolved ionization charge state, representing the hydrodynamic drift
    of that charge-state fluid within the plasma. In a multi-fluid treatment, each
    charge state $z$ of a given ion species carries its own velocity field, which
    couples to neighboring charge states through ionization, recombination, and Coulomb
    friction between the constituent fluids.


    The velocity vector is the first moment of the charge-state-resolved distribution
    function $f_z(\mathbf{v})$:


    $$

    \mathbf{u}_z = \frac{1}{n_z} \int \mathbf{v} \, f_z(\mathbf{v}) \, d^3v

    $$


    where $n_z = \int f_z(\mathbf{v}) \, d^3v$ is the number density of ions in charge
    state $z$ (in m$^{-3}$) and $\mathbf{v}$ is the particle velocity.


    The vector components are defined in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius, $\phi$ is the toroidal angle increasing
    counter-clockwise when viewed from above, and $Z$ is the vertical height. The
    magnetic-field-aligned projection is [parallel_ion_state_velocity](name:parallel_ion_state_velocity),
    which is experimentally accessible via Doppler shifts from charge-exchange recombination
    spectroscopy. The charge-state-averaged parallel flow is captured by [parallel_ion_velocity](name:parallel_ion_velocity),
    while [parallel_electron_velocity](name:parallel_electron_velocity) provides the
    electron-fluid counterpart entering Ohm''s law. Full vector components are computed
    self-consistently in multi-fluid edge transport codes that evolve separate momentum
    equations per charge state.


    Typical parallel ion-state flow speeds range from sub-km/s in the low-flow core
    to near-sonic values of order $10^4$ m/s approaching the divertor target.


    Sign convention: Positive when the flow is directed in the positive direction
    of the respective basis vectors $+\hat{R}$, $+\hat{\phi}$, or $+\hat{Z}$ of the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:parallel_ion_state_velocity
  - name:parallel_ion_velocity
  - name:parallel_electron_velocity
  sources:
  - id: derived:ion_state_velocity
    status: composed
- name: ion_state_velocity_due_to_e_cross_b_drift
  kind: vector
  status: draft
  description: "Full vector E\xD7B drift velocity for a specified ion charge state,\
    \ perpendicular to both the local electric and magnetic fields and independent\
    \ of the ion's mass and charge value."
  documentation: "The E\xD7B drift velocity of a specified ion charge state is the\
    \ guiding-center drift arising when a magnetized charged particle experiences\
    \ an electric field perpendicular to the confining magnetic field. Because the\
    \ drift depends only on the local ratio of fields and not on particle mass, charge\
    \ sign, or ionization degree, this quantity resolved per ion charge state is numerically\
    \ identical to the same drift for any other species; tracking it per charge state\
    \ enables charge-state-resolved transport modeling in edge plasma simulations.\n\
    \nThe defining expression is:\n\n$$\n\\mathbf{v}_{E\\times B} = \\frac{\\mathbf{E}\
    \ \\times \\mathbf{B}}{B^2}\n$$\n\nwhere $\\mathbf{E}$ is the local electric field\
    \ in V m$^{-1}$, $\\mathbf{B}$ is the magnetic field in T, and $B = |\\mathbf{B}|$,\
    \ yielding a velocity directed perpendicular to both fields. Scalar projections\
    \ of this vector are provided by [radial_ion_state_velocity_due_to_e_cross_b_drift](name:radial_ion_state_velocity_due_to_e_cross_b_drift),\
    \ [toroidal_ion_state_velocity_due_to_e_cross_b_drift](name:toroidal_ion_state_velocity_due_to_e_cross_b_drift),\
    \ and [parallel_ion_state_velocity_due_to_e_cross_b_drift](name:parallel_ion_state_velocity_due_to_e_cross_b_drift).\
    \ The parent quantity [velocity_due_to_e_cross_b_drift](name:velocity_due_to_e_cross_b_drift)\
    \ gives the species-independent drift for the bulk plasma.\n\nIn tokamak edge\
    \ and pedestal plasmas, E\xD7B drift speeds range from $10^3$ to $10^5$ m s$^{-1}$,\
    \ set primarily by the magnitude of the radial electric field relative to the\
    \ local magnetic field strength. This drift is computed from equilibrium or fluid-model\
    \ electric and magnetic field profiles and drives cross-field convective particle\
    \ and momentum transport.\n\nSign convention: Positive when each cylindrical vector\
    \ component points in the direction of increasing $R$, increasing toroidal angle\
    \ $\\phi$, or increasing $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is the major radius measured from the symmetry axis and $Z$ is the\
    \ vertical coordinate."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:radial_ion_state_velocity_due_to_e_cross_b_drift
  - name:toroidal_ion_state_velocity_due_to_e_cross_b_drift
  - name:parallel_ion_state_velocity_due_to_e_cross_b_drift
  - name:velocity_due_to_e_cross_b_drift
- name: krypton_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of krypton ions evaluated at the radial position of
    the internal transport barrier, where locally reduced cross-field turbulent transport
    sustains steep impurity density gradients within the confined plasma.
  documentation: "Krypton (atomic number $Z = 36$) is a noble-gas impurity that is\
    \ seeded into fusion plasmas for divertor heat-load mitigation and radiative power\
    \ exhaust control. This quantity is the total number of krypton particles per\
    \ unit volume, aggregated over all charge states present, evaluated at the radial\
    \ location of the internal transport barrier (ITB) \u2014 a localized zone where\
    \ cross-field turbulent transport is strongly suppressed, allowing steep radial\
    \ gradients in both temperature and impurity density to persist.\n\nThe krypton\
    \ density at the ITB reflects the competition between the neoclassical inward\
    \ pinch, which tends to accumulate impurities in the plasma core, and turbulent\
    \ outward diffusion, which is reduced at the barrier; the resulting impurity peaking\
    \ makes this quantity a sensitive indicator of barrier strength and confinement\
    \ quality. It is a species-specific instance of [density_at_internal_transport_barrier](name:density_at_internal_transport_barrier),\
    \ directly analogous to [xenon_density_at_internal_transport_barrier](name:xenon_density_at_internal_transport_barrier)\
    \ and [argon_density_at_internal_transport_barrier](name:argon_density_at_internal_transport_barrier)\
    \ for heavier and lighter noble-gas impurities, respectively.\n\nIn practice the\
    \ value is inferred from vacuum ultraviolet or soft X-ray spectroscopy of krypton\
    \ line emission, or from impurity transport modeling constrained by measured radial\
    \ profiles. Combining this quantity with [electron_density_at_internal_transport_barrier](name:electron_density_at_internal_transport_barrier)\
    \ enables estimates of the local krypton impurity fraction and its contribution\
    \ to the effective charge $Z_{\\mathrm{eff}}$ at the barrier. The krypton density\
    \ at other radial locations is given by [krypton_density_at_pedestal](name:krypton_density_at_pedestal),\
    \ [krypton_density_at_limiter](name:krypton_density_at_limiter), and [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_internal_transport_barrier
  - name:xenon_density_at_internal_transport_barrier
  - name:argon_density_at_internal_transport_barrier
  - name:electron_density_at_internal_transport_barrier
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_limiter
  - name:krypton_density_at_divertor_target
  sources:
  - id: dd:summary/local/itb/n_i/krypton/value
    dd_path: summary/local/itb/n_i/krypton/value
    status: composed
- name: krypton_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of krypton ions evaluated at the magnetic axis, the
    innermost point of the confined plasma where the gradient of poloidal magnetic
    flux vanishes.
  documentation: "Krypton ($Z = 36$) is a noble-gas impurity that can be seeded into\
    \ confined plasmas for radiative power exhaust management or employed as a spectroscopic\
    \ tracer. The krypton number density at the magnetic axis gives the on-axis value\
    \ of the impurity concentration profile at the innermost nested flux surface,\
    \ located at coordinates $(R_\\mathrm{axis}, Z_\\mathrm{axis})$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame where $\\nabla\\psi = 0$, with $\\psi$ the\
    \ poloidal magnetic flux. It is the krypton-species instance of the [density_at_magnetic_axis](name:density_at_magnetic_axis)\
    \ family.\n\nThe on-axis krypton density is inferred from spectrally resolved\
    \ line-emission diagnostics \u2014 such as charge-exchange recombination spectroscopy\
    \ or vacuum-ultraviolet spectroscopy \u2014 combined with atomic data for the\
    \ krypton charge-state distribution, and serves as the inner boundary value of\
    \ the impurity concentration profile in radial transport analyzes.\n\nComparing\
    \ this on-axis value with [krypton_density_at_pedestal](name:krypton_density_at_pedestal)\
    \ and [krypton_density_at_internal_transport_barrier](name:krypton_density_at_internal_transport_barrier)\
    \ characterizes the radial accumulation pattern: central peaking indicates the\
    \ neoclassical inward pinch dominates over turbulent outward diffusion, while\
    \ a hollow profile signals the reverse. The analogous on-axis density for boron\
    \ is given by [boron_density_at_magnetic_axis](name:boron_density_at_magnetic_axis)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_magnetic_axis
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_internal_transport_barrier
  - name:boron_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/krypton/value
    dd_path: summary/local/magnetic_axis/n_i/krypton/value
    status: composed
- name: lithium_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Lithium ion number density evaluated at the representative radial location
    of an internal transport barrier.
  documentation: 'Lithium ion number density at the internal transport barrier is
    the local number of lithium ions per unit volume at the representative radial
    location of an ITB. The ITB is a localized region of reduced radial transport
    within the confined plasma, so impurity densities can vary strongly across the
    barrier.


    Using the flux coordinate $\rho_\mathrm{tor,norm}$ (normalized toroidal flux radius),
    the point value is


    $$

    n_{\mathrm{Li,ITB}} = n_{\mathrm{Li}}\!\left(\rho_{\mathrm{tor,norm,ITB}}\right)

    $$


    where $n_{\mathrm{Li,ITB}}$ and $n_{\mathrm{Li}}$ are lithium ion number densities
    in $\mathrm{m}^{-3}$, and $\rho_{\mathrm{tor,norm,ITB}}$ is the dimensionless
    value of the normalized toroidal flux radius selected to represent the ITB. If
    the barrier has finite radial width, the representative point is commonly chosen
    as the barrier center, the location of strongest local gradient, or the same ITB
    location used for related quantities such as [total_ion_density_at_internal_transport_barrier](name:total_ion_density_at_internal_transport_barrier).


    The value is obtained by identifying the ITB location from the radial variation
    of transport-sensitive plasma quantities and evaluating a lithium-specific density
    estimate at that location. Lithium density is typically inferred from species-sensitive
    impurity measurements combined with atomic-physics or transport analysis, and
    it should be interpreted together with neighboring-location quantities such as
    [lithium_density_at_pedestal](name:lithium_density_at_pedestal) and [lithium_density_at_magnetic_axis](name:lithium_density_at_magnetic_axis).


    Typical trace-to-minor lithium impurity densities in confined tokamak plasmas
    are about $10^{15}$-$10^{18}\ \mathrm{m}^{-3}$, usually well below the local total
    ion density. Values outside this order-of-magnitude range can occur depending
    on lithium source strength, confinement, and diagnostic sensitivity.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_internal_transport_barrier
  - name:argon_density_at_internal_transport_barrier
  - name:lithium_density_at_magnetic_axis
  - name:lithium_density_at_pedestal
  sources:
  - id: dd:summary/local/itb/n_i/lithium/value
    dd_path: summary/local/itb/n_i/lithium/value
    status: composed
- name: loop_voltage_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal electromotive force integrated around the last closed flux
    surface, measuring the net inductive and resistive voltage driving ohmic plasma
    current.
  documentation: "The loop voltage at the plasma boundary is the line integral of\
    \ the total electric field around a toroidal contour lying on the last closed\
    \ flux surface (LCFS), equal to the time rate of change of the total poloidal\
    \ magnetic flux threading that boundary.\n\nThe defining relation is:\n\n$$\n\
    V_{loop} = -\\frac{d\\Psi_b}{dt}\n$$\n\nwhere $\\Psi_b$ is the total poloidal\
    \ magnetic flux enclosed by the LCFS. In a resistive plasma at quasi-steady state\
    \ this balances as $V_{loop} \\approx R_p I_p$, where $R_p$ is the total parallel\
    \ plasma resistance and $I_p$ is the plasma current; during ramp phases the inductive\
    \ term $L_p dI_p/dt$ adds significantly. This quantity therefore characterizes\
    \ both ohmic flux consumption and the resistive state of the plasma column.\n\n\
    It is inferred from voltage loops or flux loops positioned outside the plasma,\
    \ after subtracting time derivatives of external coil fluxes. The externally driven\
    \ component alone is captured by [external_loop_voltage](name:current_weighted_average_external_loop_voltage),\
    \ and the [toroidal_electric_field](name:toroidal_electric_field) profile provides\
    \ the radially resolved field from which boundary values are extracted.\n\nTypical\
    \ magnitudes are 0.1\u20135 V during the current flat-top in medium-to-large tokamaks,\
    \ rising to 10\u201320 V during rapid current ramp-up.\n\nSign convention: Positive\
    \ when the electromotive force drives plasma current in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: V
  physics_domain: transport
  links:
  - name:current_weighted_average_external_loop_voltage
  - name:toroidal_electric_field
  sources:
  - id: dd:core_profiles/global_quantities/v_loop
    dd_path: core_profiles/global_quantities/v_loop
    status: attached
  - id: dd:plasma_profiles/global_quantities/v_loop
    dd_path: plasma_profiles/global_quantities/v_loop
    status: composed
  - id: dd:summary/global_quantities/v_loop/value
    dd_path: summary/global_quantities/v_loop/value
    status: attached
- name: magnetic_shear_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Normalized logarithmic derivative of the safety factor with respect
    to normalized toroidal flux radius, evaluated at the internal transport barrier
    location.
  documentation: "The magnetic shear at the internal transport barrier is the normalized\
    \ logarithmic derivative of the safety factor $q$ with respect to the normalized\
    \ toroidal flux radius $\\rho_{tor}$, evaluated at the radial position of the\
    \ internal transport barrier. The sign and magnitude of this quantity govern the\
    \ stability of microinstabilities at the barrier, with reversed (negative) shear\
    \ strongly associated with ITB formation in advanced tokamak scenarios.\n\nThe\
    \ defining relation is:\n\n$$\ns = \\frac{\\rho_{tor}}{q} \\frac{dq}{d\\rho_{tor}}\n\
    $$\n\nwhere $q$ is the safety factor \u2014 the number of toroidal field-line\
    \ transits per single poloidal circuit \u2014 and $\\rho_{tor}$ is the normalized\
    \ toroidal flux radius, equal to zero at the magnetic axis and unity at the last\
    \ closed flux surface.\n\nThe safety-factor profile needed to evaluate this quantity\
    \ is obtained from equilibrium reconstruction, often constrained by motional Stark\
    \ effect polarimetry or Faraday rotation measurements resolving the internal $q$-profile.\
    \ The full radial context is provided by the [magnetic shear](name:magnetic_shear_at_pedestal)\
    \ profile; analogous point evaluations are defined at [the magnetic axis](name:magnetic_shear_at_magnetic_axis)\
    \ and [the pedestal top](name:magnetic_shear_at_pedestal).\n\nIn reversed-shear\
    \ configurations the value is negative near the $q$-minimum, commonly ranging\
    \ from $-2$ to $0$; in conventional positive-shear ITB scenarios values are small\
    \ and positive, in the range $0$ to $1$.\n\nSign convention: Positive when the\
    \ safety factor $q$ increases with the normalized toroidal flux radius $\\rho_{tor}$,\
    \ i.e., when $dq/d\\rho_{tor} > 0$."
  unit: '1'
  physics_domain: transport
  links:
  - name:magnetic_shear_at_pedestal
  - name:magnetic_shear_at_magnetic_axis
  sources:
  - id: dd:summary/local/itb/magnetic_shear/value
    dd_path: summary/local/itb/magnetic_shear/value
    status: composed
- name: neutral_source_rate
  kind: scalar
  status: draft
  description: Net volumetric production rate of neutral particles, equal to creation
    minus loss processes per unit volume. It enters the neutral particle density balance
    as a source term, with positive values representing a net gain of neutral particles.
  documentation: 'Neutral source rate is the local net rate at which neutral particles
    of a given species are produced or removed by atomic, molecular, and plasma interaction
    processes. It represents creation minus loss per unit physical volume and directly
    changes the neutral number density.


    A common local neutral continuity equation is


    $$

    \frac{\partial n_n}{\partial t} + \nabla \cdot \left(n_n \mathbf{u}_n\right) =
    S_n

    $$


    where $n_n$ is the neutral number density in $\mathrm{m}^{-3}$, $\mathbf{u}_n$
    is the neutral flow velocity in $\mathrm{m}\,\mathrm{s}^{-1}$, and $S_n$ is the
    neutral source rate in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$. The equation is coordinate
    independent; when expressed in the right-handed cylindrical $(R, \phi, Z)$ frame,
    $S_n$ is the net rate per physical volume at position $(R, \phi, Z)$.


    In practice, $S_n$ is computed from neutral transport and collisional-radiative
    models using rates for ionization, recombination, charge exchange, molecular dissociation,
    recycling, gas fueling, pellet ablation, and neutral beam deposition when relevant.
    It can also be constrained indirectly by particle balance, spectroscopy, pressure
    gages, and neutral particle diagnostics, with volume or flux-surface averaging
    applied only after the local volumetric rate has been defined.


    Typical magnitudes vary strongly with plasma region and fueling conditions: core
    values with weak neutral penetration may be $10^{16}$-$10^{20}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$,
    edge and scrape-off-layer recycling regions are commonly $10^{20}$-$10^{23}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$,
    and highly localized pellet, gas-puff, or beam-related sources can locally exceed
    $10^{24}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$.


    Sign convention: Positive when the net processes add neutral particles to the
    neutral population, increasing the neutral number density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_sources/source/profiles_1d/neutral/particles
    dd_path: core_sources/source/profiles_1d/neutral/particles
    status: composed
  - id: dd:edge_sources/source/ggd/neutral/particles/values
    dd_path: edge_sources/source/ggd/neutral/particles/values
    status: attached
  - id: dd:plasma_sources/source/ggd/neutral/particles/values
    dd_path: plasma_sources/source/ggd/neutral/particles/values
    status: attached
  - id: dd:plasma_sources/source/profiles_1d/neutral/particles
    dd_path: plasma_sources/source/profiles_1d/neutral/particles
    status: attached
- name: neutral_state_momentum
  kind: vector
  status: draft
  description: Area-normalized vector source of linear momentum for a specified neutral
    species charge state, representing net momentum transfer from charge exchange,
    ionization, recombination, elastic scattering, and related collisions.
  documentation: 'Neutral state momentum is the vector source of linear momentum transferred
    to a specified neutral species charge state, normalized by the area through which
    the transfer is represented. It has pressure-like dimensions while retaining the
    direction of the net impulse acting on the neutral population, and it contributes
    to the neutral momentum balance together with advection, pressure, and momentum-flux
    terms.


    When the area-normalized source is obtained by integrating a local collisional
    force density over a representative length, a generic balance for state $s$ can
    be written as:


    $$

    \mathbf{M}_s = \int_{\Delta \ell} \left[ m_s n_s \sum_j \nu^{\mathrm{cx}}_{sj}(\mathbf{u}_j-\mathbf{u}_s)
    + \sum_{\alpha \in \mathcal{B}_s} R_\alpha \Delta\mathbf{p}_{\alpha\to s} - \sum_{\beta
    \in \mathcal{L}_s} R_\beta \Delta\mathbf{p}_{s\to\beta} + \mathbf{f}^{\mathrm{el}}_s
    \right] d\ell

    $$


    where $\mathbf{M}_s$ is the area-normalized momentum source vector, $d\ell$ is
    a length element in m, and the bracketed term is a local force density. The mass
    $m_s$ is in kg, $n_s$ is the neutral-state density in m^-3, $\nu^{\mathrm{cx}}_{sj}$
    is an effective charge-exchange frequency with collision partner $j$ in s^-1,
    and $\mathbf{u}_s$ and $\mathbf{u}_j$ are species mean velocities in m s^-1. The
    sets $\mathcal{B}_s$ and $\mathcal{L}_s$ contain reactions that create and remove
    state $s$, $R_\alpha$ and $R_\beta$ are volumetric reaction rates in m^-3 s^-1,
    $\Delta\mathbf{p}$ is the event-averaged momentum increment or removal in kg m
    s^-1, and $\mathbf{f}^{\mathrm{el}}_s$ is the elastic-scattering force density
    in kg m^-2 s^-2.


    In practice, this quantity is evaluated from plasma and neutral densities, temperatures,
    species flow velocities, distribution functions, and atomic or molecular rate
    coefficients. Charge exchange transfers directed momentum between ion and neutral
    populations while conserving the momentum of the interacting pair, ionization
    removes the momentum carried by neutrals leaving the state, recombination and
    molecular channels add product momentum, and elastic scattering redistributes
    momentum among existing particles. Direct measurement is uncommon; spectroscopy,
    neutral pressure gages, particle balance, and plasma momentum balance provide
    indirect constraints.


    Projected components may be taken along radial, toroidal, poloidal, or magnetic-field-parallel
    directions. Related projected quantities include [poloidal_neutral_state_momentum](name:poloidal_neutral_state_momentum),
    [toroidal_neutral_state_momentum](name:toroidal_neutral_state_momentum), and [parallel_neutral_momentum](name:parallel_neutral_momentum),
    while momentum-flux analogs such as [parallel_neutral_state_momentum_flux](name:parallel_neutral_state_momentum_flux)
    and [toroidal_neutral_state_momentum_flux](name:toroidal_neutral_state_momentum_flux)
    describe transport of neutral-state momentum rather than a local source.


    Representative modeled magnitudes are highly regime dependent: 10^-6-10^-2 kg.m^-1.s^-2
    in weakly recycling or low-neutral-density edge regions, 10^-2-10^2 kg.m^-1.s^-2
    in scrape-off-layer and divertor conditions, and up to about 10^3 kg.m^-1.s^-2
    in localized high-recycling, detachment-front, or gas-injection regions. Values
    may be near zero where the neutral density is small or interacting flows are nearly
    equilibrated.


    Sign convention: Positive when a resolved component of the net momentum transfer
    to the neutral state acts along the positive direction of its basis vector; in
    the right-handed cylindrical $(R, \phi, Z)$ frame, this is $+\hat{R}$, increasing
    toroidal angle $\phi$, or $+\hat{Z}$, where $R$ is major radius and $Z$ is vertical
    height.'
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:radial_neutral_state_momentum
  - name:poloidal_neutral_state_momentum
  - name:toroidal_neutral_state_momentum
  - name:parallel_neutral_state_momentum_flux
  - name:momentum
- name: neutral_state_particle_flux
  kind: scalar
  status: draft
  description: Signed number flux of neutral particles in a specified internal state
    through an oriented surface, per unit area and per unit time. It is the surface-normal
    component of state-resolved neutral particle transport.
  documentation: 'Neutral-state particle flux is the signed surface-normal number
    flux of neutral atoms or molecules belonging to a specified internal state. For
    a closed control surface, choosing the normal outward from the control volume
    makes positive values represent neutral particles leaving that volume; choosing
    the opposite normal reverses the sign.


    For an oriented surface with unit normal $\hat{\mathbf{n}}$, the scalar flux is
    the projection of the vector particle flux:


    $$

    \Gamma_s = \boldsymbol{\Gamma}_s \cdot \hat{\mathbf{n}}

    $$


    where $\Gamma_s$ is the scalar neutral-state particle flux in $m^{-2}\,s^{-1}$,
    $\boldsymbol{\Gamma}_s$ is the vector number flux of neutrals in internal state
    $s$ in $m^{-2}\,s^{-1}$, and $\hat{\mathbf{n}}$ is the unit normal to the surface.
    In a local particle balance it enters through $\partial n_s/\partial t + \nabla
    \cdot \boldsymbol{\Gamma}_s = S_s$, where $n_s$ is the state-resolved neutral
    density in $m^{-3}$ and $S_s$ is the net volumetric source in $m^{-3}\,s^{-1}$.


    In practice this quantity is computed from neutral kinetic or fluid transport
    models as a velocity moment of the state-resolved distribution, or from a particle
    crossing rate divided by the corresponding surface area. Experimental constraints
    are usually indirect, using spectroscopy, pressure measurements, gas balance,
    and recycling observations to infer the state-resolved neutral population and
    its transport.


    Typical magnitudes span about $10^{17}$-$10^{22}$ $m^{-2}\,s^{-1}$ in low-density
    or weakly recycling regions and can reach $10^{22}$-$10^{24}$ $m^{-2}\,s^{-1}$
    near strong gas, recycling, or divertor sources. Fluxes for excited internal states
    are often smaller than ground-state neutral fluxes because excited-state populations
    are shorter lived.


    Sign convention: Positive when neutral particles in the specified internal state
    cross the oriented surface in the direction of the chosen unit normal.'
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:poloidal_neutral_state_particle_flux
  - name:neutral_state_energy_flux
  - name:ion_state_particle_flux
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/particles/flux/values
    dd_path: edge_transport/model/ggd/neutral/state/particles/flux/values
    status: composed
  - id: dd:plasma_transport/model/ggd/neutral/state/particles/flux/values
    dd_path: plasma_transport/model/ggd/neutral/state/particles/flux/values
    status: skipped
- name: nitrogen_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of nitrogen ions evaluated at the radial location of
    the internal transport barrier. It represents the local nitrogen impurity concentration
    at the barrier position, independent of the diagnostic or reconstruction method
    used to obtain it.
  documentation: 'Nitrogen density at the internal transport barrier is the local
    number density of nitrogen impurity ions evaluated at the barrier position. Unless
    a charge state is specified separately, the quantity represents the sum over ionized
    nitrogen charge states present in the plasma, not a single ionization stage.


    A useful definition is the charge-state sum evaluated at the barrier location:


    $$

    n_{\mathrm{N}}(r_{\mathrm{ITB}}) = \sum_Z n_{\mathrm{N}^{Z+}}(r_{\mathrm{ITB}})

    $$


    where $n_{\mathrm{N}^{Z+}}$ is the number density of nitrogen ions with charge
    state $Z+$ and $r_{\mathrm{ITB}}$ denotes the radial location assigned to the
    internal transport barrier.


    In practice, this density is inferred from impurity spectroscopy, charge-exchange
    measurements where available, ionization-balance analysis, or transport modeling
    constrained by line emission and equilibrium information. The reported value is
    the local nitrogen density at the identified barrier position rather than a volume
    average.


    Typical values in magnetically confined plasmas are about $10^{16}-10^{19}$ m^-3.
    Trace nitrogen concentrations are often near the lower end of this range, while
    deliberate nitrogen seeding or strongly impurity-enriched conditions can give
    values approaching the upper end.


    Conceptually related quantities include total ion density at the internal transport
    barrier and analogous impurity densities such as oxygen and tungsten density at
    the internal transport barrier.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_internal_transport_barrier
  - name:carbon_density_at_internal_transport_barrier
  - name:neon_density_at_internal_transport_barrier
  - name:iron_density_at_internal_transport_barrier
  - name:nitrogen_density_at_pedestal
  sources:
  - id: dd:summary/local/itb/n_i/nitrogen/value
    dd_path: summary/local/itb/n_i/nitrogen/value
    status: composed
- name: nitrogen_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of nitrogen ions at the magnetic axis, the innermost
    point of the confined plasma where the gradient of the poloidal magnetic flux
    vanishes.
  documentation: 'The nitrogen ion number density at the magnetic axis is the total
    concentration of nitrogen impurity ions evaluated at the point $(R_\mathrm{axis},
    Z_\mathrm{axis})$ in the right-handed cylindrical $(R, \phi, Z)$ frame where $\nabla\psi
    = 0$, marking the geometric center of the nested flux-surface family. This on-axis
    value typically represents the peak of the nitrogen density radial profile in
    regimes without impurity-transport-driven hollowing.


    The total on-axis nitrogen density sums contributions across all ionization states:


    $$

    n_\mathrm{N}(R_\mathrm{axis}, Z_\mathrm{axis}) = \sum_{k=1}^{7} n_{\mathrm{N}^{k+}}(R_\mathrm{axis},
    Z_\mathrm{axis})

    $$


    where $n_{\mathrm{N}^{k+}}$ is the density of nitrogen ions in charge state $k$
    and the sum runs over all seven possible ionization states of nitrogen (atomic
    number 7). In typical tokamak core conditions the fully stripped $\mathrm{N}^{7+}$
    state dominates, and this on-axis value directly influences the effective charge
    $Z_\mathrm{eff} = \sum_s n_s Z_s^2 / n_e$, governing bremsstrahlung losses and
    resistivity at the plasma center.


    The on-axis value is inferred from impurity transport modeling constrained by
    charge exchange recombination spectroscopy or passive ultraviolet emission diagnostics,
    whose line-integrated signals are inverted to yield local density profiles. Comparing
    this quantity with [nitrogen density at the pedestal](name:nitrogen_density_at_pedestal)
    yields the impurity peaking factor, while [nitrogen density at the plasma boundary](name:nitrogen_density_at_plasma_boundary)
    characterizes penetration depth from the edge. The analogous neon quantity is
    [neon_density_at_magnetic_axis](name:neon_density_at_magnetic_axis), and the species-general
    parent is [density_at_magnetic_axis](name:density_at_magnetic_axis).


    Sign convention: Positive when nitrogen impurity ions are present in the confined
    plasma at the magnetic axis location.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:nitrogen_density_at_pedestal
  - name:nitrogen_density_at_plasma_boundary
  - name:neon_density_at_magnetic_axis
  - name:density_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/nitrogen/value
    dd_path: summary/local/magnetic_axis/n_i/nitrogen/value
    status: composed
- name: normalized_poloidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial coordinate derived from the square root of the
    normalized poloidal magnetic flux, mapping the magnetic axis to 0 and the last
    closed flux surface to 1.
  documentation: "The normalized poloidal flux coordinate $\\rho_{\\mathrm{pol,norm}}$\
    \ is a dimensionless radial label for nested flux surfaces derived from the poloidal\
    \ magnetic flux $\\psi$, providing a monotonic coordinate that equals zero at\
    \ the magnetic axis and one at the last closed flux surface.\n\n$$\n\\rho_{\\\
    mathrm{pol,norm}} = \\sqrt{\\frac{\\psi - \\psi_{\\mathrm{axis}}}{\\psi_{\\mathrm{LCFS}}\
    \ - \\psi_{\\mathrm{axis}}}}\n$$\n\nwhere $\\psi$ is the poloidal magnetic flux\
    \ on the flux surface of interest, $\\psi_{\\mathrm{axis}}$ is its value at the\
    \ magnetic axis, and $\\psi_{\\mathrm{LCFS}}$ is its value at the last closed\
    \ flux surface.\n\nThe coordinate is obtained from equilibrium reconstruction,\
    \ which solves for the poloidal flux distribution $\\psi(R, Z)$ over the poloidal\
    \ cross-section in the right-handed cylindrical $(R, \\phi, Z)$ frame using magnetic\
    \ diagnostic measurements. For point measurements, $\\rho_{\\mathrm{pol,norm}}$\
    \ is assigned the local value at the measurement position; for line-integrated\
    \ diagnostics, it is taken as the minimum value reached along the line of sight\
    \ within the closed flux surface region.\n\nTypical pedestal locations in H-mode\
    \ plasmas fall near $\\rho_{\\mathrm{pol,norm}} = 0.90$\u2013$0.98$. In nearly\
    \ circular, low-$\\beta$ plasmas, $\\rho_{\\mathrm{pol,norm}}$ closely approximates\
    \ the normalized minor radius $r/a$ (where $r$ is the local minor radius and $a$\
    \ is the separatrix minor radius); in strongly shaped or high-$\\beta$ configurations,\
    \ significant deviations arise. The closely related [normalized toroidal flux\
    \ coordinate] uses the enclosed toroidal flux and is often preferred for transport\
    \ calculations requiring a well-behaved Jacobian.\n\nSign convention: Positive\
    \ when the evaluation point lies on a flux surface between the magnetic axis and\
    \ the last closed flux surface; the coordinate is non-negative by construction\
    \ and equals zero only at the magnetic axis."
  unit: '1'
  physics_domain: transport
  links: []
