- name: poloidal_component_of_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Poloidal component of the effective diffusivity for ion momentum transport,
    quantifying the diffusive radial flux of ion poloidal momentum density across
    magnetic flux surfaces. It enters the ion momentum transport equation as the proportionality
    between the flux-surface-averaged radial flux of poloidal momentum density and
    the radial gradient of ion poloidal flow velocity.
  documentation: 'The poloidal component of ion momentum diffusivity $\chi_{i,\theta}$
    is defined through the Fick-type closure for the diffusive radial flux of ion
    poloidal momentum density:


    $$\Pi_{i,\theta}^{\rm diff} = -m_i n_i \chi_{i,\theta} \frac{\partial v_{i,\theta}}{\partial
    r}$$


    where $m_i$ is the ion mass, $n_i$ is the ion number density, $v_{i,\theta}$ is
    the ion poloidal flow velocity (the $\hat{\theta}$ projection of the ion fluid
    velocity in the right-handed cylindrical $(R, \phi, Z)$ frame, with $\theta$ the
    poloidal angle), and $r$ denotes the generalized radial coordinate labeling magnetic
    flux surfaces. The quantity $\Pi_{i,\theta}^{\rm diff}$ represents the flux-surface-averaged
    radial transport of poloidal momentum density; positive $\chi_{i,\theta}$ with
    a negative radial velocity gradient produces an outward (positive-$r$) momentum
    flux, spreading the poloidal rotation profile.


    Sign convention: Positive when the diffusive poloidal momentum flux is directed
    outward, i.e., in the direction of increasing flux-surface label $r$, for a negative
    radial gradient of poloidal flow velocity.


    This is a flux-surface-averaged, radially resolved transport coefficient for the
    bulk ion population. Species-resolved transport coefficients are described by
    [poloidal_component_of_ion_state_momentum_diffusivity](name:poloidal_component_of_ion_state_momentum_diffusivity).


    In magnetized tokamak plasmas, poloidal momentum transport is strongly influenced
    by neoclassical poloidal viscosity, which tends to damp poloidal rotation toward
    its neoclassical equilibrium value. Anomalous contributions to $\chi_{i,\theta}$
    arise from turbulent fluctuations. In most plasma conditions, $\chi_{i,\theta}$
    is significantly smaller than its toroidal counterpart $\chi_{i,\phi}$ owing to
    the efficiency of poloidal flow damping. Typical values range from $10^{-2}$ to
    $10^{0}$ m$^2$ s$^{-1}$ in the plasma core, depending on collisionality regime,
    plasma geometry, and turbulence levels.


    This quantity is one component of the full ion momentum diffusivity tensor and
    should be interpreted alongside the toroidal, radial, and parallel components.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_momentum_diffusivity
  - name:toroidal_component_of_ion_momentum_diffusivity
  - name:radial_component_of_ion_momentum_diffusivity
  - name:parallel_component_of_ion_momentum_diffusivity
  - name:poloidal_component_of_ion_state_momentum_diffusivity
  constraints: []
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/poloidal/d
    dd_path: core_transport/model/profiles_1d/ion/momentum/poloidal/d
    status: composed
- name: poloidal_component_of_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity governing the radial, cross-flux-surface transport
    of poloidal momentum for a specific ion charge state. Quantifies the diffusive
    radial flux of ion poloidal momentum density driven by the radial gradient of
    the ion poloidal flow velocity. Resolves the poloidal momentum diffusivity by
    charge state rather than summing over all states of a given ion species.
  documentation: 'The poloidal component of the ion-state momentum diffusivity, $\chi_{\theta,s}$,
    appears in the flux-gradient relation for radial transport of poloidal momentum
    for a specified ion charge state $s$:


    $$\Gamma_{m,\theta,s} = -n_s m_s \chi_{\theta,s} \frac{\partial v_{\theta,s}}{\partial
    r}$$


    where $n_s$ is the number density, $m_s$ is the ion mass, $v_{\theta,s}$ is the
    poloidal flow velocity, and $r$ denotes a radial flux-surface coordinate. The
    gradient is taken in the radial direction (across flux surfaces), not along the
    poloidal direction; $\chi_{\theta,s}$ thus governs how efficiently poloidal momentum
    is redistributed radially.


    This quantity is charge-state-resolved, complementing the species-level aggregate
    $\chi_\theta$ defined in `poloidal_component_of_ion_momentum_diffusivity`. Because
    all charge states of a given ion species share the same mass $m_s$, the aggregate
    is related to the charge-state values by a number-density-weighted average:


    $$\chi_\theta = \frac{\sum_s n_s \chi_{\theta,s}}{\sum_s n_s}$$


    although specific transport models may employ alternative flux-matching or mass-density-weighted
    aggregation schemes.


    This quantity is conventionally treated as a flux-surface-averaged effective diffusivity
    within one-dimensional core transport models. The poloidal momentum transport
    channel can receive significant contributions from neoclassical poloidal viscosity,
    which in some regimes makes $\chi_{\theta,s}$ substantially larger than the ion
    heat diffusivity; assumptions about the relative magnitude of $\chi_{\theta,s}$
    compared to $\chi_i$ should be verified for the specific plasma regime and transport
    model in use.


    Typical values range from $10^{-2}$ to $10^{1}$ m$^2$s$^{-1}$ depending on the
    plasma regime, transport model, and charge state. This quantity is not directly
    measured but is inferred from transport analysis codes or prescribed in fluid
    transport models.


    Sign convention: Positive when the diffusive flux of poloidal momentum is directed
    down the radial gradient of poloidal flow velocity, consistent with Fick''s law
    for diffusive transport across flux surfaces.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:poloidal_component_of_ion_momentum_diffusivity
  - name:radial_component_of_ion_state_momentum_diffusivity
  - name:toroidal_component_of_ion_state_momentum_diffusivity
  - name:parallel_component_of_ion_state_momentum_diffusivity
  - name:ion_state_momentum_diffusivity
  constraints: []
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/poloidal/d
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/poloidal/d
    status: composed
- name: radial_component_of_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity coefficient relating the diffusive radial flux
    of radial ion momentum density to the radial gradient of the mean radial ion flow
    velocity across magnetic flux surfaces. This is the species-sum aggregate over
    all ion charge states, representing the bulk ion fluid.
  documentation: "The radial component of ion momentum diffusivity, $D_{\\mathrm{mom},r}$,\
    \ enters the diffusive closure for radial transport of the radial component of\
    \ ion momentum. The constitutive relation expresses the diffusive radial flux\
    \ of radial momentum density as\n\n$$\\Gamma_{\\Pi,r} = -n_i m_i \\, D_{\\mathrm{mom},r}\
    \ \\, \\frac{\\partial v_{i,r}}{\\partial r}$$\n\nwhere $n_i m_i$ is the total\
    \ ion mass density (summed over all charge states), $v_{i,r}$ is the mean radial\
    \ flow velocity of the ion fluid, and $\\partial / \\partial r$ denotes the radial\
    \ gradient directed outward across flux surfaces along the effective minor-radius\
    \ coordinate. The quantity $\\Gamma_{\\Pi,r}$ has dimensions of momentum density\
    \ times velocity (kg m$^{-1}$ s$^{-2}$) and represents the flux-surface-averaged\
    \ diffusive transport of radial momentum in the radial direction.\n\nSign convention:\
    \ Positive when the diffusivity acts to reduce an outward-increasing radial velocity\
    \ gradient, i.e., when the diffusive momentum flux is directed opposite to $\\\
    partial v_{i,r}/\\partial r$.\n\nThis quantity is a flux-surface-averaged, species-summed\
    \ effective diffusivity representing the bulk ion fluid. It aggregates contributions\
    \ from all resolved ion charge states; the corresponding state-resolved quantity\
    \ is given by $D_{\\mathrm{mom},r}^{(s)}$ for each ion species $s$, and the bulk\
    \ effective diffusivity satisfies the relationship implicit in the total momentum\
    \ balance where each species contributes proportionally to its mass density fraction.\n\
    \nPhysically, $D_{\\mathrm{mom},r}$ quantifies how rapidly radial ion momentum\
    \ is redistributed across flux surfaces by both collisional (neoclassical) and\
    \ turbulent (anomalous) processes. In tokamak core plasmas, typical values range\
    \ from $0.01$ to $10\\,\\mathrm{m^2\\,s^{-1}}$, with neoclassical contributions\
    \ near the lower bound and turbulence-driven transport spanning the upper range.\
    \ The momentum Prandtl number $\\mathrm{Pr} = D_{\\mathrm{mom},r}/\\chi_i$, where\
    \ $\\chi_i$ is the ion thermal diffusivity, characterizes the relative strength\
    \ of momentum versus thermal diffusion and typically lies in the range $0.1$\u2013\
    $1$ depending on turbulence regime.\n\nIn transport modeling, $D_{\\mathrm{mom},r}$\
    \ appears alongside a convective pinch velocity term in the radial momentum transport\
    \ equation. It is typically inferred from experimental rotation profiles measured\
    \ via charge-exchange recombination spectroscopy combined with power-balance or\
    \ perturbative transport analysis."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_momentum_diffusivity
  - name:radial_component_of_ion_state_momentum_diffusivity
  - name:parallel_component_of_ion_momentum_diffusivity
  - name:poloidal_component_of_ion_momentum_diffusivity
  - name:toroidal_component_of_ion_momentum_diffusivity
  constraints: []
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/radial/d
    dd_path: core_transport/model/profiles_1d/ion/momentum/radial/d
    status: composed
- name: radial_component_of_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity coefficient for a specific ion charge state that
    relates the diffusive radial flux of momentum density across magnetic flux surfaces
    to the radial gradient of that state's momentum density.
  documentation: "The radial component of the ion-state momentum diffusivity, $\\\
    chi_{m,r}^{\\mathrm{state}}$, is a scalar transport coefficient entering the local,\
    \ flux-surface-averaged constitutive closure for diffusive momentum transport\
    \ of a single resolved ion charge state perpendicular to magnetic flux surfaces.\n\
    \nFor a charge state $s$ with number density $n_s$ and ion mass $m_i$, the diffusive\
    \ component of the flux-surface-averaged radial momentum flux density is\n\n$$\\\
    langle \\Gamma_{p,r} \\rangle = -n_s \\, m_i \\, \\chi_{m,r}^{\\mathrm{state}}\
    \ \\, \\frac{\\partial v_\\parallel^{(s)}}{\\partial \\rho}$$\n\nwhere $\\rho$\
    \ is a generalized radial coordinate labeling flux surfaces (e.g., the normalized\
    \ toroidal flux radius $\\rho_{\\mathrm{tor,norm}}$), $v_\\parallel^{(s)}$ is\
    \ the flux-surface-averaged parallel (or toroidal) flow velocity of that charge\
    \ state, and $\\langle \\Gamma_{p,r} \\rangle$ is the flux-surface-averaged momentum\
    \ flux density carried across the flux surface. Here the transported quantity\
    \ is the parallel (or toroidal) component of momentum, while the transport direction\
    \ is radial (normal to flux surfaces). The coefficient $\\chi_{m,r}^{\\mathrm{state}}$\
    \ has dimensions of $\\mathrm{m^2\\,s^{-1}}$, consistent with $\\langle \\Gamma_{p,r}\
    \ \\rangle$ having units of $\\mathrm{kg\\,m^{-1}\\,s^{-2}}$ when gradient lengths\
    \ are expressed per meter of effective radial distance.\n\nSign convention: Positive\
    \ when the diffusive momentum flux is directed outward (toward larger $\\rho$)\
    \ for a negative velocity gradient $\\partial v_\\parallel^{(s)} / \\partial \\\
    rho < 0$.\n\nThis quantity is the charge-state-resolved analog of the species-level\
    \ radial momentum diffusivity, which aggregates contributions over all ionization\
    \ stages of a given element. Resolving by charge state is essential when ionization\
    \ balance is spatially non-uniform or when transport coefficients differ between\
    \ charge states, as occurs near the plasma edge or in highly ionizing regimes\
    \ for impurity species.\n\nTypical values in tokamak core transport modeling range\
    \ from $0.01$ to $10\\;\\mathrm{m^2\\,s^{-1}}$: neoclassical contributions are\
    \ typically $0.01$\u2013$0.1\\;\\mathrm{m^2\\,s^{-1}}$, while anomalous (turbulent)\
    \ contributions can reach $1$\u2013$10\\;\\mathrm{m^2\\,s^{-1}}$. The coefficient\
    \ is inferred from transport analysis codes matching measured impurity rotation\
    \ profiles or computed from neoclassical and gyrokinetic models resolving individual\
    \ charge states."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_component_of_ion_momentum_diffusivity
  - name:parallel_component_of_ion_state_momentum_diffusivity
  - name:poloidal_component_of_ion_state_momentum_diffusivity
  - name:toroidal_component_of_ion_state_momentum_diffusivity
  - name:ion_state_momentum_diffusivity
  constraints: []
