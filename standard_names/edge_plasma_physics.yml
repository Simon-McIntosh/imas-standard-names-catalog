    status: skipped
- name: parallel_flux_surface_averaged_electric_field_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged parallel electric field at the plasma boundary,\
    \ defined as the separatrix average of the electric-field and magnetic-field dot\
    \ product divided by the signed reference toroidal field in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It is not an average of the local unit-vector projection."
  documentation: 'The parallel flux-surface-averaged electric field at the plasma
    boundary is a separatrix scalar describing the net field-aligned electric drive
    at the interface between the closed-field-line plasma and the scrape-off layer.
    It is a magnetic-field-weighted surface average, distinct from [parallel_electric_field_at_plasma_boundary](name:parallel_electric_field_at_plasma_boundary),
    which represents the local projection of the electric field onto the unit magnetic-field
    direction.


    Using a magnetic surface labeled by poloidal magnetic flux $\psi$, the boundary
    value is defined by


    $$

    \begin{aligned}

    E_{\parallel,\mathrm{FSA},b}

    &= \frac{\left\langle \mathbf{E}\cdot\mathbf{B}\right\rangle_{\psi_b}}{B_0}, \\

    \left\langle f\right\rangle_{\psi_b}

    &= \frac{\int_{\psi=\psi_b} f\, dA/|\nabla\psi|}{\int_{\psi=\psi_b} dA/|\nabla\psi|}

    \end{aligned}

    $$


    where $E_{\parallel,\mathrm{FSA},b}$ denotes this boundary flux-surface-averaged
    quantity, $\mathbf{E}$ is the electric field in V m^-1, $\mathbf{B}$ is the magnetic
    field in T, $B_0$ is the signed reference toroidal magnetic field in T, and $\psi_b$
    is the boundary value of $\psi$. In the averaging convention, $\psi$ is in Wb,
    $dA$ is a magnetic-surface area element in m^2, $\nabla\psi$ is in Wb m^-1, and
    $\langle f\rangle_{\psi_b}$ has the same unit as $f$. The toroidal direction is
    defined in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The quantity is computed by evaluating $\mathbf{E}\cdot\mathbf{B}$ from an equilibrium
    magnetic field together with an electric field inferred from loop voltage, electrostatic-potential
    evolution, or a transport model, then applying the flux-surface average before
    division by $B_0$. Averaging the local projection $\mathbf{E}\cdot\mathbf{B}/|\mathbf{B}|$
    would give a different physical quantity. In diverted plasmas, care is needed
    near an X point because $|\nabla\psi|$ becomes small; practical analyzes should
    make clear whether a limiting closed surface or a regularized boundary average
    is used.


    A useful order-of-magnitude scale is the loop-voltage electric-field magnitude
    $|V_\mathrm{loop}|/(2\pi R_0)$. In many quasistationary tokamak plasmas this scale
    is about 0.01-1 V m^-1; values close to zero can occur when inductive and electrostatic
    contributions nearly cancel, and transient or strongly driven edge conditions
    may exceed this range.


    Sign convention: Positive when the separatrix flux-surface average of $\mathbf{E}\cdot\mathbf{B}$
    has the same sign as the signed reference toroidal magnetic field $B_0$, with
    $B_0$ positive for toroidal magnetic field in the direction of increasing $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: V.m^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:effective_charge_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
- name: parallel_ion_heat_convection_velocity
  kind: scalar
  status: draft
  description: The effective velocity at which bulk ion thermal energy is advected
    along magnetic field lines in the edge plasma, used as a transport coefficient
    in the parallel ion energy equation.
  documentation: "The parallel ion heat convection velocity is the field-aligned component\
    \ of the effective velocity governing convective ion thermal-energy transport\
    \ in the edge plasma. It represents the aggregate ion population over all charge\
    \ states, in contrast to the per-charge-state quantity parallel_effective_ion_state_energy_convection_velocity,\
    \ which resolves a single ionization level.\n\nIn the ion energy equation, the\
    \ parallel convective heat flux density is:\n\n$$\nq_{\\parallel,i}^{\\text{conv}}\
    \ = \\frac{5}{2}\\, n_i T_i\\, v_{\\parallel,\\text{heat}}^{i}\n$$\n\nwhere $n_i$\
    \ is the total ion number density, $T_i$ is the ion temperature, and $v_{\\parallel,\\\
    text{heat}}^{i}$ is this convection velocity. The prefactor $5/2$ reflects the\
    \ enthalpy content per particle for a monatomic ideal gas.\n\nThis quantity is\
    \ computed from edge plasma fluid transport models solving the ion energy equation\
    \ in the scrape-off layer and divertor regions. Values range from order $10^2$\
    \ m/s in low-density far-SOL regions to near the ion acoustic speed ($\\sim 10^4$\u2013\
    $10^5$ m/s) approaching divertor target plates, depending on local ion density\
    \ and temperature.\n\nThe parent quantity ion_heat_convection_velocity defines\
    \ the full vector; the parallel component dominates along open field lines where\
    \ parallel transport greatly exceeds cross-field transport. The analogous transport\
    \ coefficient for parallel momentum is parallel_momentum_effective_convection_velocity.\n\
    \nSign convention: Positive when the ion heat convection is directed along the\
    \ local magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:edge_transport/model/ggd/electrons/energy/v_parallel/values
    dd_path: edge_transport/model/ggd/electrons/energy/v_parallel/values
    status: skipped
  - id: dd:edge_transport/model/ggd/ion/energy/v_parallel/values
    dd_path: edge_transport/model/ggd/ion/energy/v_parallel/values
    status: composed
  - id: dd:edge_transport/model/ggd/neutral/energy/v_parallel/values
    dd_path: edge_transport/model/ggd/neutral/energy/v_parallel/values
    status: composed
- name: parallel_ion_state_convection_velocity
  kind: scalar
  status: draft
  description: Parallel component of the effective convective velocity used for particle
    transport of a specified ion charge state in the edge plasma. It is a transport
    coefficient along the local magnetic-field direction and need not equal the bulk
    ion fluid velocity.
  documentation: 'The parallel ion-state convection velocity is the coefficient multiplying
    the density of one ion charge state in the convective part of its parallel particle
    transport. It describes transport along the local magnetic-field direction in
    the edge plasma and is an effective balance-equation coefficient, not necessarily
    the literal mean fluid velocity of that ion state.


    A common particle-flux decomposition defines the named quantity as:


    $$

    \Gamma_{\parallel,s} = n_s v_{\parallel,s}^{\mathrm{conv}} + \Gamma_{\parallel,s}^{\mathrm{nonconv}}

    $$


    where $\Gamma_{\parallel,s}$ is the total parallel particle flux of charge state
    $s$ along $\hat{b}=\mathbf{B}/|\mathbf{B}|$, $n_s$ is the charge-state density,
    $v_{\parallel,s}^{\mathrm{conv}}$ is this effective convection velocity, and $\Gamma_{\parallel,s}^{\mathrm{nonconv}}$
    contains diffusive, drift-ordering, turbulent, and source-related contributions
    that are not represented as density times a convective coefficient. Equivalently,
    where $n_s$ is nonzero, the effective coefficient is the residual parallel flux
    per particle after those nonconvective contributions have been separated; it can
    differ from the bulk ion fluid parallel velocity.


    In practice it is obtained from charge-state particle-balance analysis or transport
    modeling using density evolution, parallel flux constraints, and atomic source
    terms such as ionization, recombination, charge exchange, neutral fueling, and
    recycling. Direct charge-state-resolved parallel flux measurements are uncommon,
    so the coefficient is usually constrained by a combination of spectroscopy, edge
    or divertor probes, and consistency with modeled sources and sinks. The same effective-coefficient
    interpretation underlies related radial convection-velocity quantities such as
    [radial_ion_convection_velocity](name:radial_ion_convection_velocity) and [radial_ion_state_effective_momentum_convection_velocity](name:radial_ion_state_momentum_convection_velocity).


    Typical signed values in the confined edge are about $-10^4$ to $10^4\ \mathrm{m\,s^{-1}}$,
    while scrape-off-layer and divertor values often reach $-10^5$ to $10^5\ \mathrm{m\,s^{-1}}$.
    Magnitudes comparable to a fraction of the local ion sound speed are common near
    material boundaries or strong source regions.


    Sign convention: Positive when the effective convective particle flux for the
    ion charge state is directed along the local magnetic-field unit vector $\hat{b}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
  - name:radial_ion_state_momentum_convection_velocity
- name: parallel_neutral_species_particle_diffusivity
  kind: scalar
  status: draft
  description: Parallel particle diffusivity for neutral species in edge plasma. It
    parameterizes density-gradient-driven neutral transport along the local magnetic-field
    direction in reduced transport models.
  documentation: 'Parallel neutral species particle diffusivity is the scalar coefficient
    that sets the strength of neutral-density smoothing along the local magnetic-field
    direction in a diffusive edge-plasma transport model. Although neutral particles
    are not magnetized, the magnetic-field direction is often used as a reference
    direction because neutral sources, ionization, and charge exchange are coupled
    to the surrounding magnetized plasma.


    In a Fick''s-law closure, the parallel neutral particle flux is modeled as:


    $$

    \Gamma_{\parallel,0} = -D_{\parallel,0}\,\nabla_{\parallel} n_0

    $$


    where $\Gamma_{\parallel,0}$ is the neutral particle flux along the magnetic field
    in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$, $D_{\parallel,0}$ is this diffusivity,
    $n_0$ is the neutral species density in $\mathrm{m}^{-3}$, and $\nabla_{\parallel}
    n_0 = \hat{b}\cdot\nabla n_0$ is the density gradient along $\hat{b}=\mathbf{B}/|\mathbf{B}|$
    in $\mathrm{m}^{-4}$. Components of $\mathbf{B}$ may be expressed in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ increases
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical height.
    The minus sign means that the modeled flux is down the neutral-density gradient;
    if $n_0$ decreases in the $+\hat{b}$ direction, $\Gamma_{\parallel,0}$ is positive
    along $+\hat{b}$.


    The coefficient is normally not a direct diagnostic observable. It is prescribed
    in transport calculations or inferred by adjusting a neutral model to reproduce
    neutral-density-sensitive observations such as Balmer-line emission, neutral pressure,
    recycling fluxes, or charge-exchange signals. Estimates may also be based on an
    effective random-walk form involving a neutral thermal speed and an effective
    mean free path or loss time, but kinetic neutral models may replace this diffusion
    approximation entirely.


    Typical effective values are strongly model and regime dependent. In reduced edge-plasma
    calculations, order-of-magnitude values often span 0.1-10^4 m^2.s^-1; cold, dense
    divertor regions tend toward the lower part of this range, while more transparent
    scrape-off-layer or main-chamber regions may require larger effective values when
    diffusion is used to mimic long mean-free-path neutral motion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_energy_diffusivity
  - name:parallel_ion_charge_state_diffusivity
  - name:radial_neutral_energy_diffusion_coefficient
