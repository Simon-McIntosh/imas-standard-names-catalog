    enhanced_context:
      description: "Diamagnetic flux (\u03A6_dia) measured by diamagnetic loop diagnostics,\
        \ sensitive to the plasma's diamagnetic response. Multiple entries correspond\
        \ to different calculation methods, with the first being the generally recommended\
        \ one."
      kind: llm
- name: toroidal_vacuum_magnetic_field
  kind: scalar
  status: active
  description: Signed toroidal component of the current-free vacuum magnetic field
    at a reference major radius, defining the nominal externally generated field strength.
  documentation: 'The vacuum toroidal magnetic field $B_0$ is the signed toroidal
    component of the equilibrium magnetic-field vector in the current-free region
    surrounding the plasma, evaluated at a reference major radius.


    The reference value is defined by


    $$

    B_0 = B_{\\phi,\mathrm{vac}}(R_0)

    $$


    where $B_0$ is the vacuum toroidal field at the reference major radius, $B_{\phi,\mathrm{vac}}$
    is the toroidal component of the vacuum magnetic field, and $R_0$ is the major-radius
    coordinate of the reference location in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    This quantity applies to the equilibrium vacuum field generated by external sources,
    with contributions from plasma currents omitted. It is a single signed reference
    value rather than a spatial average, surface integral, local total field, or Fourier
    perturbation coefficient. The vector quantity it specializes is the [vacuum magnetic
    field](name:vacuum_magnetic_field); it is distinct from the [toroidal perturbed
    vacuum magnetic field real part](name:toroidal_perturbed_vacuum_magnetic_field_real_part),
    which describes a first-order perturbation. The normalization product $R_0 B_0$
    represents the conserved major-radius-weighted toroidal field of an axisymmetric
    vacuum field, for which $R B_{\phi,\mathrm{vac}}(R) = R_0 B_0$, where $R$ is the
    major-radius coordinate.


    Sign convention: Positive when the associated vacuum magnetic-field vector has
    a toroidal component in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links: []
  sources:
