- name: radial_coordinate_of_antenna_strap
  kind: scalar
  status: active
  description: "Major-radius coordinate locating the antenna strap\u2019s specified\
    \ geometry reference point in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The antenna-strap radial coordinate is the major-radius position\
    \ of the strap\u2019s specified geometry reference point, measured from the toroidal\
    \ symmetry axis. It identifies the strap location in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, rather than describing the strap\u2019s orientation or\
    \ extent.\n\nThe coordinate is defined by\n\n$$\nR = \\sqrt{x^2+y^2}\n$$\n\nwhere\
    \ $R$ is the major-radius coordinate, and $x$ and $y$ are the horizontal Cartesian\
    \ coordinates of the reference point relative to the toroidal symmetry axis in\
    \ the right-handed Cartesian $(\\hat{x}, \\hat{y}, \\hat{z})$ basis.\n\nThis quantity\
    \ applies to the antenna strap reference point only; it is not averaged over the\
    \ strap length, thickness, or cross-section, and it does not denote a flux-surface-normal\
    \ projection. It is the antenna-strap-specific realization of [radial coordinate](name:radial_coordinate).\
    \ The corresponding [toroidal angle of the antenna strap](name:toroidal_angle_of_antenna_strap)\
    \ and [vertical coordinate of the antenna strap](name:vertical_coordinate_of_antenna_strap)\
    \ provide complementary cylindrical location coordinates."
  unit: m
  physics_domain: auxiliary_heating
