name: electron_cyclotron_launched_power_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-trace of the total launched power for the entire electron
  cyclotron heating system.
documentation: "This reference waveform specifies the aggregate power to be launched\
  \ by all EC beams combined as a function of time during a discharge. The plasma\
  \ control system distributes this total among individual gyrotrons according to\
  \ beam-level power references, managing gyrotron modulation and sequencing. Typical\
  \ total EC system power ranges from 2\u20135 MW on present devices (DIII-D, ASDEX\
  \ Upgrade, TCV) to 20 MW planned for ITER. The unit is dimensionless (normalized)\
  \ within the pulse-schedule framework; the physical value in watts is recovered\
  \ by multiplication with the system's nominal power rating. Real-time adjustments\
  \ to this waveform support scenarios such as H-mode access, sawtooth period control,\
  \ and NTM stabilization. See also individual beam power references for per-beam\
  \ allocation."
