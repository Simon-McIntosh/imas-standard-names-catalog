- name: radial_component_of_neutral_velocity
  kind: scalar
  status: draft
  description: Major-radius ($R$) component of the bulk flow velocity of neutral particles
    in the edge plasma, projected onto the radial direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  documentation: 'The radial component of neutral velocity, $v_{n,R} = \mathbf{v}_n
    \cdot \hat{R}$, describes the bulk flow of neutral particles along the major-radius
    direction $\hat{R}$ in the edge and divertor plasma. Neutrals play a central role
    in plasma-wall interaction, recycling, and fueling; their radial velocity governs
    the transport of neutral particles across magnetic flux surfaces and determines
    the source of momentum, energy, and particles that neutral atoms deliver to the
    ionized plasma through charge-exchange and ionization reactions. Typical values
    range from a few tens to a few thousands of m/s in the scrape-off layer and divertor,
    depending on the local neutral pressure gradient, wall geometry, and neutral-ion
    coupling strength. This quantity is the radial projection of the parent vector
    [neutral_velocity](name:neutral_velocity); the analogous quantities for ions are
    [radial_component_of_ion_velocity_per_magnetic_field_strength](name:radial_component_of_ion_velocity_per_magnetic_field_strength)
    and [radial_component_of_ion_diamagnetic_drift_velocity](name:radial_component_of_ion_diamagnetic_drift_velocity),
    which are explicitly qualified by velocity type. The momentum transport of neutrals
    in the radial direction is further characterized by the [radial_component_of_neutral_momentum_flux_limiter](name:radial_component_of_neutral_momentum_flux_limiter).


    Sign convention: Positive when the neutral bulk flow is directed in the direction
    of increasing major radius $R$ (outward, away from the machine symmetry axis).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
