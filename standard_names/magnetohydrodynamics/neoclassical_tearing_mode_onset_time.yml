description: Time at which a neoclassical tearing mode is first triggered, marking
  the transition from seed perturbation to sustained island growth.
documentation: The NTM onset time $t_{\rm onset}$ (s) marks the instant at which the
  magnetic island at a given rational surface begins self-sustained growth driven
  by the perturbed bootstrap current, as described by the modified Rutherford equation.
  This time is identified experimentally from the appearance of a coherent $m/n$ oscillation
  on Mirnov coil or ECE signals that exceeds a predefined amplitude threshold. In
  modeling, $t_{\rm onset}$ corresponds to the moment the seed island width exceeds
  the critical threshold $w_{\rm crit}$ below which classical tearing stability ($\Delta'
  < 0$) would cause decay. Knowledge of the onset time is essential for timing preemptive
  or reactive ECCD stabilization and for correlating NTM triggering with sawtooth
  crashes, ELMs, or other MHD events. Typical onset times occur during the flat-top
  or ramp-up phase, depending on $\beta_N$ evolution.
