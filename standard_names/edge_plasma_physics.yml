        \ in the SOL."
      kind: template
- name: electron_density_at_launching_position
  kind: scalar
  status: active
  description: Electron number density at the wave-launching position is the local
    free-electron count per unit volume where an injected electromagnetic wave first
    contacts the edge plasma.
  documentation: 'This quantity is the local free-electron number density at the geometric
    launching position, such as a wave launcher aperture or waveguide mouth where
    an injected electromagnetic wave first contacts the edge plasma. It is the electron-specific
    component of [number density at the launching position](name:density_at_launching_position).


    The density is defined from the electron velocity-distribution function by


    $$

    n_e(\mathbf{x}_{\mathrm{launch}})=\int f_e(\mathbf{x}_{\mathrm{launch}},\mathbf{v})\,d^3\mathbf{v}

    $$


    where $n_e$ is electron number density, $\mathbf{x}_{\mathrm{launch}}$ is the
    launching position, $f_e$ is the electron velocity-distribution function, and
    $\mathbf{v}$ is electron velocity.


    This is a local value for free electrons at the launching position, not a density
    summed over plasma species, a flux-surface average, or a wave-power quantity.
    It is distinct from [electron number density at the plasma boundary](name:electron_density_at_plasma_boundary),
    which is evaluated at the last closed flux surface.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_launching_position
  - name:electron_density_at_plasma_boundary
  arguments:
  - name: density_at_launching_position
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: lh_antennas/antenna/n_e
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-n_e
