    dd_path: core_profiles/profiles_1d/neutral/pressure_fast_parallel
    status: composed
  - id: dd:plasma_profiles/profiles_1d/neutral/pressure_fast_parallel
    dd_path: plasma_profiles/profiles_1d/neutral/pressure_fast_parallel
    status: composed
- name: parallel_ion_energy_flux
  kind: scalar
  status: draft
  description: Parallel component of the ion thermal energy flux, representing energy
    transported along magnetic field lines per unit area per unit time.
  documentation: "The ion parallel energy flux $Q_{\\parallel,i}$ is the component\
    \ of the total ion energy flux vector projected onto the magnetic field direction.\
    \ It quantifies the rate at which thermal energy is transported along field lines\
    \ by the ion population, driven by parallel gradients in temperature, density,\
    \ and flow velocity. The total ion energy flux is the sum of the convective and\
    \ conductive contributions: $Q_{\\parallel,i} = \\frac{5}{2} n_i T_i v_{\\parallel,i}\
    \ - \\kappa_{\\parallel,i} \\nabla_{\\parallel} T_i$, where $n_i$ is the ion density,\
    \ $T_i$ the ion temperature, $v_{\\parallel,i}$ the parallel flow velocity, and\
    \ $\\kappa_{\\parallel,i}}$ the parallel ion thermal conductivity. In the scrape-off\
    \ layer, this flux determines the heat load on divertor targets; typical values\
    \ range from 1\u2013100 MW/m\xB2 at the outer divertor strike point. The parallel\
    \ component is distinguished from the total flux vector by its direction: it carries\
    \ energy only along the field line, not across flux surfaces. Compare with the\
    \ [parallel electron energy flux](name:parallel_electron_energy_flux), which dominates\
    \ in the core, and the [parallel total ion energy flux](name:parallel_total_ion_energy_flux),\
    \ which sums over all charge states. The perpendicular (radial) component is described\
    \ by the [ion energy flux](name:ion_energy_flux)."
  unit: W.m^-2
  physics_domain: transport
  links:
  - name:parallel_electron_energy_flux
  - name:parallel_total_ion_energy_flux
  - name:ion_energy_flux
  arguments:
  - name: ion_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:plasma_transport/model/ggd/ion/energy/flux_parallel/values
    dd_path: plasma_transport/model/ggd/ion/energy/flux_parallel/values
    status: composed
- name: perpendicular_co_passing_fast_pressure
  kind: scalar
  status: draft
  description: Perpendicular component of the fast particle pressure from the co-passing
    population, representing the anisotropic kinetic energy density orthogonal to
    the local magnetic field.
  documentation: "The perpendicular fast particle pressure $p_{\\perp,\\mathrm{fast,co}}$\
    \ from the co-passing population quantifies the kinetic energy density of suprathermal\
    \ particles whose guiding-center orbits circulate in the direction of the plasma\
    \ current, resolved perpendicular to the local magnetic field. It is defined as\
    \ $p_{\\perp,\\mathrm{fast,co}} = \\int f_{\\mathrm{co}}(\\mathbf{r}, \\mathbf{v})\
    \ \\, m v_\\perp^2 \\, d^3v$, where $f_{\\mathrm{co}}$ is the co-passing distribution\
    \ function, $m$ is the particle mass, and $v_\\perp$ is the velocity component\
    \ orthogonal to $\\mathbf{B}$. This component together with $p_\\parallel$ (see\
    \ [parallel_co_passing_fast_pressure](name:parallel_co_passing_fast_pressure))\
    \ captures the pressure anisotropy of the fast co-passing population, which is\
    \ essential for evaluating MHD stability and Alfv\xE9n eigenmode drive. Typical\
    \ values in NBI-heated tokamaks range from 0.1 to 10 kPa for the perpendicular\
    \ component, comparable to the isotropic total reported in [co_passing_fast_pressure](name:co_passing_fast_pressure).\
    \ Perpendicular pressure is inferred from a combination of neutral particle analyzer\
    \ data and fast-ion FIDA measurements, supplemented by NUBEAM or ASCOT simulations.\n\
    \nSign convention: Positive when the perpendicular fast-particle pressure is compressive."
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_co_passing_fast_pressure
  - name:co_passing_fast_pressure
  arguments:
  - name: co_passing_fast_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure_fast_perpendicular
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_2d/co_passing/pressure_fast_perpendicular
    status: composed
- name: perpendicular_counter_passing_fast_pressure
  kind: scalar
  status: draft
  description: Perpendicular pressure from fast ions on counter-passing orbits, projected
    onto the plane perpendicular to the magnetic field.
  documentation: "The perpendicular component of the fast (suprathermal) ion pressure\
    \ tensor, averaged over the counter-passing population. It represents the kinetic\
    \ energy density associated with gyromotion of counter-passing fast ions, $p_{\\\
    perp,\\mathrm{cp}} = \\int \\frac{1}{2} m_i v_\\perp^2 f_{\\mathrm{cp}}(\\mathbf{r},\
    \ \\mathbf{v})\\, d^3v$, where $m_i$ is the fast ion mass, $v_\\perp$ is the speed\
    \ perpendicular to the local magnetic field, and $f_{\\mathrm{cp}}$ is the counter-passing\
    \ fast ion distribution function. This quantity is typically obtained from neutral\
    \ beam injection (NBI) modeling or fast-ion diagnostics such as fast-ion D$\\\
    alpha$ (FIDA) and neutral particle analyzers (NPA), which provide constraints\
    \ on the pitch-angle-resolved fast-ion distribution. The total pressure from counter-passing\
    \ fast ions is given by the sum of this perpendicular component and the [parallel_counter_passing_fast_pressure](name:parallel_counter_passing_fast_pressure)\
    \ component. The equivalent quantity for the co-passing population is [perpendicular_co_passing_fast_pressure](name:perpendicular_co_passing_fast_pressure),\
    \ while the total fast ion pressure (summed over all orbit types) is given by\
    \ [counter_passing_fast_pressure](name:counter_passing_fast_pressure). Typical\
    \ core values for neutral-beam-heated tokamaks range from 1 to 100 kPa, depending\
    \ on beam power and plasma density.\n\nSign convention: Positive when the perpendicular\
    \ pressure is directed outward from the magnetic field line, consistent with the\
    \ gyromotion.\n\nThe perpendicular pressure in a magnetized plasma contributes\
    \ to the force balance in the MHD equilibrium through the anisotropic pressure\
    \ tensor and influences the stability of Alfv\xE9n eigenmodes driven by fast ions."
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_counter_passing_fast_pressure
  - name:perpendicular_co_passing_fast_pressure
  - name:counter_passing_fast_pressure
  arguments:
  - name: counter_passing_fast_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_1d/counter_passing/pressure_fast_perpendicular
    status: composed
  - id: dd:distributions/distribution/profiles_2d/counter_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_2d/counter_passing/pressure_fast_perpendicular
    status: composed
- name: perpendicular_fast_ion_state_pressure
  kind: scalar
  status: draft
  description: Perpendicular component of the pressure tensor of the suprathermal
    (fast) ion population for a specific charge state, defined relative to the local
    magnetic field direction.
  documentation: 'The perpendicular fast ion state pressure $p_{\perp, \mathrm{fast},
    Z}$ represents the component of the anisotropic pressure tensor acting perpendicular
    to the local magnetic field for a given ion charge state $Z$. It is defined as
    $p_{\perp, \mathrm{fast}, Z} = n_{\mathrm{fast}, Z} \, m_i \langle v_\perp^2 \rangle$,
    where $n_{\mathrm{fast}, Z}$ is the fast ion density for that charge state, $m_i$
    is the ion mass, and $v_\perp$ is the velocity component perpendicular to $\mathbf{B}$.
    This component dominates the anisotropic pressure of energetic ions when the gyroradius
    is non-negligible compared to the equilibrium scale length, and it contributes
    directly to the MHD equilibrium force balance through the perpendicular pressure
    gradient. Typical values for NBI-heated tokamaks range from 0.1 to 10 kPa in the
    core, depending on beam power and charge state. The quantity is inferred from
    fast-ion diagnostics such as FIDA and NPA, combined with equilibrium reconstruction.
    Together with the parallel component, it forms the [fast_ion_state_pressure](name:fast_ion_state_pressure)
    vector. See also [fast_ion_state_density](name:fast_ion_state_density) for the
    density of the same charge state and [fast_ion_pressure](name:fast_ion_pressure)
    for the pressure summed over charge states.


    Sign convention: Positive when the pressure acts outward from the plasma, consistent
    with the sign of the diagonal elements of the pressure tensor in a local magnetic
    coordinate system.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_ion_state_pressure
  - name:fast_ion_state_density
  - name:fast_ion_pressure
  arguments:
  - name: fast_ion_state_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    dd_path: core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    status: composed
  - id: dd:edge_profiles/ggd/ion/state/pressure_fast_perpendicular/values
    dd_path: edge_profiles/ggd/ion/state/pressure_fast_perpendicular/values
    status: composed
  - id: dd:plasma_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    dd_path: plasma_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
