- name: toroidal_co_passing_fast_electron_torque_density_due_to_collisions
  kind: scalar
  status: draft
  description: Collisional source density of toroidal angular momentum transferred
    to co-passing fast electrons by Coulomb scattering. The toroidal direction is
    the increasing phi direction in the right-handed cylindrical (R, phi, Z) frame;
    co-passing denotes passing orbits in the plasma-current toroidal direction.
  documentation: 'This quantity is the torque per unit volume acting on the co-passing
    fast-electron population through Coulomb collisions, expressed as a source of
    toroidal angular momentum. The toroidal direction is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ increases
    counter-clockwise viewed from above $+\hat{Z}$, and $Z$ is vertical height. Co-passing
    electrons are the passing part of the fast-electron population whose toroidal
    motion is in the same direction as the plasma current.


    For a local kinetic description, the collisional toroidal torque density is the
    first toroidal momentum moment of the collision operator multiplied by major radius:


    $$

    \tau_{\phi,\mathrm{fe}}^{\mathrm{co,coll}}(\mathbf{x}) = R \int m_e v_\phi\, C_{\mathrm{coll}}\!\left[f_{\mathrm{fe}}^{\mathrm{co}}(\mathbf{x},\mathbf{v})\right]
    \, d^3v

    $$


    where $\tau_{\phi,\mathrm{fe}}^{\mathrm{co,coll}}$ has units $\mathrm{N\,m^{-2}}$,
    $R$ is in meters, $m_e$ is the electron mass in kilograms, $v_\phi$ is the velocity
    component along increasing $\phi$ in $\mathrm{m\,s^{-1}}$, $f_{\mathrm{fe}}^{\mathrm{co}}$
    is the co-passing fast-electron distribution, and $C_{\mathrm{coll}}[f]$ is its
    collisional time derivative with units of $f$ per second. If $f$ is normalized
    so that $\int f\,d^3v$ is a number density in $\mathrm{m^{-3}}$, then $C_{\mathrm{coll}}[f]$
    has units $\mathrm{s^2\,m^{-6}}$ and $d^3v$ has units $\mathrm{m^3\,s^{-3}}$,
    giving the torque-density unit $\mathrm{N\,m^{-2}}$.


    In practice this quantity is computed from kinetic or guiding-center distributions
    using Coulomb slowing-down, energy diffusion, and pitch-angle scattering operators.
    It appears in fast-electron toroidal angular-momentum balance and represents the
    collisional drag or acceleration of the co-passing population relative to the
    surrounding plasma.


    Typical magnitudes are strongly scenario dependent: weak suprathermal electron
    tails may give $10^{-7}$-$10^{-3}\ \mathrm{N\,m^{-2}}$, while intense runaway-electron
    or strongly collisional fast-electron populations can reach $10^{-3}$-$1\ \mathrm{N\,m^{-2}}$.
    Values approach zero where the co-passing fast-electron density is negligible
    or where opposing collisional contributions nearly cancel.


    Sign convention: Positive when Coulomb collisions increase the co-passing fast-electron
    toroidal angular momentum in the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_counter_passing_fast_electron_torque_density_due_to_collisions
  - name:toroidal_co_passing_fast_ion_torque_density_due_to_collisions
  - name:co_passing_fast_electron_torque_density_due_to_collisions
  - name:co_passing_fast_electron_power_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/collisions/electrons/torque_fast_phi
    dd_path: distributions/distribution/profiles_1d/co_passing/collisions/electrons/torque_fast_phi
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/collisions/electrons/torque_fast_tor
    dd_path: distributions/distribution/profiles_2d/co_passing/collisions/electrons/torque_fast_tor
    status: attached
- name: toroidal_co_passing_torque_density
  kind: scalar
  status: draft
  description: Toroidal torque density contributed by the co-passing particle population.
    It is the local source rate of toroidal angular momentum per unit volume for that
    orbit class, distinct from counter-passing and trapped contributions.
  documentation: 'Toroidal co-passing torque density is the local rate at which toroidal
    angular momentum is added to, or removed from, particles in the co-passing passing-orbit
    class. In the right-handed cylindrical $(R, \phi, Z)$ system, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height; the quantity refers to the
    toroidal component of angular momentum associated with that coordinate convention.


    A kinetic source moment for one or more represented species can be written as


    $$

    \tau_{\phi,\mathrm{co}}(\mathbf{x}) = \sum_{s \in \mathcal{S}} \int_{\mathcal{V}_{\mathrm{co}}}
    m_s R v_\phi S_s(\mathbf{x},\mathbf{v}) \, d^3v

    $$


    where $\tau_{\phi,\mathrm{co}}$ is the co-passing toroidal torque density, $\mathbf{x}$
    is position, $\mathbf{v}$ is particle velocity, $\mathcal{V}_{\mathrm{co}}$ is
    the co-passing region of velocity space, $s$ labels the included species, $m_s$
    is particle mass in kg, $R$ is major radius in meters, $v_\phi$ is toroidal velocity
    in m s$^{-1}$, and $S_s = \partial f_s/\partial t|_\mathrm{src}$ is the distribution-function
    source rate. Equivalently, it is the source part of $\partial \ell_{\phi,\mathrm{co}}/\partial
    t$, where $\ell_{\phi,\mathrm{co}} = \sum_s \int_{\mathcal{V}_{\mathrm{co}}} m_s
    R v_\phi f_s d^3v$ has units kg m$^{-1}$ s$^{-1}$; therefore $\tau_{\phi,\mathrm{co}}$
    has units N m$^{-2}$.


    In practice this quantity is computed by taking the toroidal angular-momentum
    moment of kinetic or transport source terms over the co-passing orbit class. It
    is combined with related orbit-class contributions such as [toroidal_counter_passing_torque_density](name:toroidal_counter_passing_torque_density)
    and [toroidal_trapped_torque_density](name:toroidal_trapped_torque_density); force-resolved
    components such as [toroidal_co_passing_torque_density_due_to_j_cross_b_force](name:toroidal_co_passing_torque_density_due_to_j_cross_b_force)
    represent specific physical mechanisms within the same co-passing momentum balance.


    Typical values are strongly scenario dependent because this is a local source
    term tied to momentum deposition, collisional exchange, and electromagnetic forces.
    It is often close to 0 N m$^{-2}$ outside active source or sink regions, and its
    magnitude is best interpreted relative to the local [toroidal_plasma_momentum](name:toroidal_plasma_momentum)
    and momentum transport time.


    Sign convention: Positive when toroidal angular momentum is added to the co-passing
    population in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ system.'
  unit: N.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/source/momentum_phi
    dd_path: distributions/distribution/profiles_1d/co_passing/source/momentum_phi
    status: composed
- name: toroidal_counter_passing_torque_density_due_to_j_cross_b_force
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal torque density exerted on counter-passing
    particles by the J cross B force arising from the current component normal to
    the flux surface. Counter-passing particles are those whose guiding-center parallel
    velocity is directed opposite to the plasma current.
  documentation: 'Toroidal counter-passing torque density due to the $J\times B$ force
    is the rate of change of toroidal angular momentum per unit volume assigned to
    the orbit class whose guiding-center parallel velocity is directed opposite to
    the plasma current. The toroidal direction is the $\phi$ direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame, and this quantity retains only the Lorentz-force
    contribution produced by the current component normal to the flux surface. It
    is interpreted as the flux-surface-averaged toroidal angular-momentum source for
    the counter-passing population.


    The flux-surface-averaged source may be written as


    $$

    T_{\phi,\mathrm{cp}}^{J\times B}=\left\langle R\,\hat{\boldsymbol{\phi}}\cdot\left(J_{\perp,\mathrm{cp}}\,\hat{\mathbf{n}}\times\mathbf{B}\right)\right\rangle

    $$


    where $\langle\cdot\rangle$ denotes the flux-surface average, $R$ is major radius
    in m, $\hat{\boldsymbol{\phi}}$ is the unit vector in the direction of increasing
    $\phi$, $\hat{\mathbf{n}}$ is the outward unit normal to the flux surface, $J_{\perp,\mathrm{cp}}$
    is the counter-passing current density along that normal in $\mathrm{A\,m^{-2}}$,
    and $\mathbf{B}$ is the magnetic field in T. The relevant current component is
    the one normal to the flux surface; this coincides with the cylindrical radial
    direction $\hat{R}$ only in the special case of circular, concentric surfaces,
    and in general differs from it once the equilibrium is shaped, so the two should
    not be treated as identical.


    The quantity is obtained from kinetic or Fokker-Planck transport models that partition
    the particle distribution by orbit class, retaining only the counter-passing segment
    when forming the current and the associated $J\times B$ force. Together with the
    [co-passing](name:toroidal_co_passing_torque_density_due_to_j_cross_b_force) and
    [trapped](name:toroidal_trapped_torque_density_due_to_j_cross_b_force) orbit-class
    contributions, it decomposes the [total toroidal J cross B torque density](name:toroidal_torque_density_due_to_j_cross_b_force);
    summing the orbit classes recovers that aggregate. It is the mechanism-specific
    counterpart of the broader [counter-passing toroidal torque density](name:toroidal_counter_passing_torque_density).


    Magnitudes scale with the local fast-particle current and the magnetic field,
    and are largest where radial current or fast-particle gradients are strong; the
    sign and amplitude depend on scenario, beam geometry, and orbit-class cancelation.


    Sign convention: Positive when the $J\times B$ force from the flux-surface-normal
    current component drives counter-passing toroidal angular momentum in the direction
    of increasing toroidal angle $\phi$.'
  unit: N.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/torque_phi_j_radial
    dd_path: distributions/distribution/profiles_1d/counter_passing/torque_phi_j_radial
    status: composed
  - id: dd:distributions/distribution/profiles_1d/counter_passing/torque_tor_j_radial
