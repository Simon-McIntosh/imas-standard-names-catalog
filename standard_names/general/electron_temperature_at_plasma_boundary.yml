name: electron_temperature_at_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Electron temperature evaluated at the plasma boundary (separatrix or
  last closed flux surface), setting the thermal boundary condition for the scrape-off
  layer.
documentation: "The boundary electron temperature $T_{e,\\rm bnd}$ is the value of\
  \ $T_e$ at the outermost closed flux surface, often identified with the separatrix\
  \ in diverted configurations or the limiter contact point in limited ones. It determines\
  \ the SOL parallel heat flux via $q_{\\parallel} \\propto n_{e,\\rm sep} T_{e,\\\
  rm sep}^{3/2}$ in the Spitzer conductivity regime and controls the transition between\
  \ sheath-limited and conduction-limited SOL regimes. Typical values are 20\u2013\
  200 eV in H-mode tokamaks; values below $\\sim$20 eV often indicate a conduction-limited\
  \ or detached SOL. Commonly derived from mtanh or linear fits to edge Thomson scattering\
  \ profiles, where it appears as the offset parameter of the fit function. See also\
  \ `electron_pressure_at_separatrix` for the corresponding pressure and `electron_pressure_scrape_off_layer_offset`\
  \ for the SOL pressure baseline."
