- name: pressure_at_cooling_circuit_inlet
  kind: scalar
  status: active
  description: Absolute static pressure of a coolant or working fluid at a defined
    hydraulic location, referenced to perfect vacuum and independent of flow-speed
    effects.
  documentation: 'Absolute static pressure is the isotropic thermodynamic pressure
    of a coolant or working fluid at a defined hydraulic location, referenced to perfect
    vacuum. It describes the local fluid state rather than a pressure contribution
    associated with bulk-flow motion.


    The quantity is the static component only: it excludes gage pressure as a reference
    convention, dynamic pressure, and stagnation pressure. A concrete inlet instance
    is [coolant pressure at cooling-circuit inlet](name:coolant_pressure_at_cooling_circuit_inlet),
    while [coolant pressure](name:coolant_pressure) applies the same physical definition
    at a plant-system component port.'
  unit: Pa
  physics_domain: structural_components
  links:
  - name:coolant_pressure_at_cooling_circuit_inlet
  - name:coolant_pressure
- name: coolant_pressure_at_cooling_circuit_inlet
  kind: scalar
  status: active
  description: Coolant pressure at a cooling-circuit inlet is the absolute static
    pressure of the coolant where it enters a hydraulically defined cooling circuit
    or component. It is the coolant-specific inlet pressure boundary and excludes
    gage, dynamic, and stagnation pressure.
  documentation: 'Coolant pressure at a cooling-circuit inlet is the absolute static
    thermodynamic pressure of the coolant where it enters a hydraulically defined
    cooling circuit or component. It denotes the scalar upstream boundary pressure
    of the coolant and excludes gage pressure, dynamic pressure, and stagnation pressure.


    For the same hydraulic flow path, the associated static pressure drop is related
    to this inlet pressure by:


    $$

    p_{\mathrm{coolant,in}} = p_{\mathrm{coolant,out}} + \Delta p_{\mathrm{coolant}}

    $$


    where $p_{\mathrm{coolant,in}}$ is this inlet absolute static coolant pressure
    in pascals, $p_{\mathrm{coolant,out}}$ is the corresponding outlet absolute static
    coolant pressure in pascals, and $\Delta p_{\mathrm{coolant}}$ is the total static
    pressure drop in pascals, defined positive when the outlet static pressure is
    lower than the inlet static pressure.


    This quantity is the coolant-specific specialization of [pressure at a cooling-circuit
    inlet](name:pressure_at_cooling_circuit_inlet): when the working fluid is coolant,
    both names denote the same inlet absolute static pressure. It is also the cooling-circuit-inlet
    value of [coolant pressure](name:coolant_pressure), and it is distinct from pressure
    loss, pump head, and mechanical stress in the surrounding structure.'
  unit: Pa
  physics_domain: structural_components
  links:
  - name:pressure_at_cooling_circuit_inlet
  - name:coolant_pressure
  arguments:
  - name: pressure_at_cooling_circuit_inlet
    operator: coolant
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/cooling/time_slice/pressure_inlet
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-cooling-time_slice-pressure_inlet
    dd_documentation:
