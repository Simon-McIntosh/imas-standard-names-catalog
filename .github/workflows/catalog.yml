name: Catalog Site

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "catalog-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ISN site source
        uses: actions/checkout@v4
        with:
          repository: Simon-McIntosh/imas-standard-names
          path: _isn
          sparse-checkout: site
          sparse-checkout-cone-mode: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - id: version
        run: |
          ref_name="${{ github.ref_name }}"
          clean_name="${ref_name#v}"

          if [[ $clean_name =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Stable release (e.g., v0.1.0) — use major.minor
            version="v$(echo $clean_name | cut -d. -f1-2)"
            tagged=true
          elif [[ $clean_name =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            # RC release (e.g., v0.1.0rc7) — use full version
            version="v${clean_name}"
            tagged=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}"
            tagged=false
          else
            version=${{ github.ref_name }}
            tagged=false
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tagged=$tagged" >> $GITHUB_OUTPUT

      - name: Build and deploy catalog site
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch yet"
          VERSION="${{ steps.version.outputs.version }}"
          TAGGED="${{ steps.version.outputs.tagged }}"
          DEPLOY_ARGS="--version $VERSION --push --site-dir _isn/site"
          # Only tagged releases carry the `latest` alias and the root
          # index.html redirect. Pushes to `main` still publish a
          # `main/` preview build but must not outrank tagged versions
          # in the selector — otherwise users land on an unreleased
          # build by default.
          if [[ "$TAGGED" == "true" ]]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --set-default"
          fi
          uv run standard-names site-deploy standard_names/ $DEPLOY_ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
