    dd_path: summary/local/limiter/n_i/iron/value
    status: composed
- name: nitrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of ionized nitrogen in the boundary plasma immediately
    adjacent to a limiter. It represents the local nitrogen impurity ion population,
    normally summed over ion charge states.
  documentation: 'Ionized nitrogen density at a limiter is the local number of nitrogen
    impurity ions per unit volume in the boundary plasma immediately adjacent to a
    limiter surface. Unless a charge-state-specific quantity is named, it denotes
    the sum over all ionized nitrogen charge states $N^{q+}$ with $q=1,\ldots,7$ and
    excludes neutral nitrogen atoms or molecules.


    The charge-state-summed density is the zeroth velocity-space moment of the nitrogen
    ion distribution functions:


    $$

    n_N^{\mathrm{ion}} = \sum_{q=1}^{7} n_{N^{q+}} = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{v})
    \, d^3v

    $$


    where $n_N^{\mathrm{ion}}$ is the total ionized nitrogen number density in m^-3,
    $n_{N^{q+}}$ is the number density of charge state $q$ in m^-3, $f_{N^{q+}}(\mathbf{v})$
    is the velocity-space distribution function with units s^3 m^-6, and $d^3v$ is
    the velocity-space volume element with units m^3 s^-3.


    In experiments, this quantity is typically inferred from impurity spectroscopy
    together with atomic data, local electron density and temperature constraints,
    and edge plasma modeling. In simulations or reconstructions that resolve nitrogen
    charge states, the limiter value is obtained by summing the local ionized charge-state
    densities adjacent to the limiter; neutral nitrogen is treated separately.


    Typical summed ionized nitrogen densities near limiters are about $10^{14}$-$10^{17}$
    m^-3 for trace or weakly seeded nitrogen and can reach $10^{17}$-$10^{19}$ m^-3
    during strong nitrogen seeding or local nitrogen release. The value depends on
    the limiter source rate, ionization balance, recombination, and transport along
    the boundary plasma.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:nitrogen_density_at_pedestal
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:argon_density_at_limiter
  - name:neon_density_at_limiter
  - name:density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/nitrogen/value
    dd_path: summary/local/limiter/n_i/nitrogen/value
    status: composed
- name: oxygen_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed number density of ionized oxygen impurity immediately
    adjacent to a limiter surface at the plasma-wall interface.
  documentation: 'Oxygen density at a limiter is the local number density of ionized
    oxygen impurity in the plasma immediately adjacent to the limiter surface. It
    is species-specific and charge-state-summed, so it represents oxygen ions only,
    not neutral oxygen or electrons.


    For oxygen ion charge states from singly ionized to fully stripped, the charge-state-summed
    limiter density is defined as:


    $$

    n_{\mathrm{O,lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{O,lim}}$ and each charge-state density $n_{\mathrm{O}^{q+},\mathrm{lim}}$
    are number densities in m^-3, $q$ is the dimensionless ion charge state, and the
    upper limit 8 is the nuclear charge of oxygen. The neutral state $q=0$ is excluded.


    In practice, this quantity is estimated from oxygen spectral line emission together
    with collisional-radiative or ionization-balance modeling, or from edge plasma
    and impurity-transport calculations constrained by local plasma conditions and
    wall-interaction source terms. It is the limiter-local counterpart of [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    and is interpreted alongside limiter plasma quantities such as [electron_density_at_limiter](name:electron_density_at_limiter).


    Typical limiter-adjacent oxygen ion densities are strongly device- and scenario-dependent
    and are usually trace impurity values relative to the local electron density.
    Representative order-of-magnitude values can range from 10^14-10^18 m^-3 in clean
    or moderately conditioned edge plasmas, with larger transient values possible
    during enhanced oxygen influx or strong plasma-wall interaction.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_limiter
  - name:nitrogen_density_at_limiter
