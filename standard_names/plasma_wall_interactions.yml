    is the set of points comprising the limiter surface.


    This is the limiter-surface counterpart of [energy flux at wall](name:energy_flux_at_wall).
    It denotes the total surface energy deposition and is not restricted to the field-aligned
    component represented by [parallel heat flux](name:parallel_heat_flux).'
