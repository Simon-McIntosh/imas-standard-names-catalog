  - id: dd:neutron_diagnostic/detector/geometry/outline/x1
    dd_path: neutron_diagnostic/detector/geometry/outline/x1
    status: composed
  - id: dd:neutron_diagnostic/detectors/detector/outline/x1
    dd_path: neutron_diagnostic/detectors/detector/outline/x1
