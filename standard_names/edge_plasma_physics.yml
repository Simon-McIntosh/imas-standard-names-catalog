- name: toroidal_flux_surface_averaged_beryllium_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted toroidal bulk-flow velocity of beryllium ions, flux-surface
    averaged at the plasma boundary over all populated charge states.
  documentation: 'This quantity is the toroidal component of the beryllium-ion bulk-flow
    velocity, averaged over the plasma-boundary flux surface. The toroidal projection
    is taken in the right-handed cylindrical $(R,\phi,Z)$ frame onto $\hat{\phi}$.


    Let $\mathcal{S}_b$ denote the plasma-boundary, or separatrix, flux surface. The
    density-weighted combination of beryllium ion charge states is defined by:


    $$

    \left\langle v_{\phi,\mathrm{Be}} \right\rangle_{\mathcal{S}_b} = \frac{\sum_q
    \left\langle n_{\mathrm{Be}^{q+}} v_{\phi,\mathrm{Be}^{q+}} \right\rangle_{\mathcal{S}_b}}{\sum_q
    \left\langle n_{\mathrm{Be}^{q+}} \right\rangle_{\mathcal{S}_b}}

    $$


    where angle brackets denote flux-surface averaging over $\mathcal{S}_b$, $n_{\mathrm{Be}^{q+}}$
    is the number density in m$^{-3}$, $v_{\phi,\mathrm{Be}^{q+}}$ is the toroidal
    bulk-flow velocity in m s$^{-1}$, and $q$ indexes all populated beryllium ion
    charge states. This intensive mean is distinct from the local quantity [toroidal
    beryllium velocity at the magnetic axis](name:toroidal_beryllium_velocity_at_magnetic_axis).


    Sign convention: Positive when the beryllium bulk-flow component $v_{\phi,\mathrm{Be}}$
    points in the direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_beryllium_velocity_at_magnetic_axis
  sources:
