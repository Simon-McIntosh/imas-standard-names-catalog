name: argon_ion_number_density_at_separatrix
status: draft
cocos_transformation_type: one_like
description: Number density of ionized argon (summed over all charge states) evaluated
  at the last closed flux surface (separatrix).
documentation: "The argon ion number density $n_{\\rm Ar}$ at the separatrix measures\
  \ the total concentration of all argon charge states at the boundary between the\
  \ confined plasma and the scrape-off layer. In impurity-seeded scenarios the separatrix\
  \ argon density controls the magnitude of edge radiation, $P_{\\rm rad}^{\\rm edge}\
  \ \\propto n_e n_{\\rm Ar} L_{\\rm Ar}(T_e)$, where $L_{\\rm Ar}$ is the argon radiative\
  \ loss function that peaks near $T_e \\sim 10$\u201350 eV. Typical separatrix values\
  \ range from $10^{15}$ to $10^{17}\\;\\mathrm{m^{-3}}$ depending on the argon puff\
  \ rate and edge transport. The quantity is derived from spectroscopic measurements\
  \ (VUV or CXRS) inverted to local values at the equilibrium-reconstructed separatrix.\
  \ See also `argon_ion_number_density_at_pedestal` for the pedestal-top evaluation\
  \ and `argon_number_density_at_magnetic_axis` for the on-axis value."
