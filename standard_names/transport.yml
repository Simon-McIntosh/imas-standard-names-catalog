    dd_path: core_profiles/profiles_1d/electrons/density
    status: composed
- name: electron_pressure
  kind: scalar
  status: draft
  description: Isotropic part of the electron momentum-flux tensor, combining thermal
    bulk and non-thermal electron contributions that enter force balance and transport.
  documentation: 'Electron pressure is the isotropic electron contribution to plasma
    momentum balance, including both the Maxwellian bulk population and any non-thermal
    electron component. It provides the electron part of the total kinetic pressure
    that competes with magnetic pressure in equilibrium and drives transport through
    pressure gradients. The thermal component is closely related to [thermal electron
    pressure](name:thermal_electron_pressure), [thermal electron density](name:thermal_electron_density),
    and [electron temperature](name:electron_temperature), while comparison with [ion
    pressure](name:ion_pressure) determines the species partition of plasma pressure.


    A common decomposition is


    $$

    p_e = p_{e,\mathrm{th}} + p_{e,\mathrm{fast}} = n_{e,\mathrm{th}} T_{e,\mathrm{J}}
    + \frac{1}{3}\mathrm{Tr}(\mathbf{P}_{e,\mathrm{fast}})

    $$


    where $p_e$, $p_{e,\mathrm{th}}$, and $p_{e,\mathrm{fast}}$ are pressures in Pa,
    $n_{e,\mathrm{th}}$ is thermal electron density in m$^{-3}$, $T_{e,\mathrm{J}}$
    is thermal electron temperature expressed as energy per particle in joules, and
    $\mathbf{P}_{e,\mathrm{fast}}$ is the fast-electron pressure tensor in Pa.


    The thermal part is inferred from electron density and temperature diagnostics
    such as interferometry, Thomson scattering, and electron cyclotron emission. Non-thermal
    contributions are estimated from suprathermal-electron diagnostics such as hard-X-ray
    bremsstrahlung, electron cyclotron emission, and kinetic modeling constrained
    by measured distributions.


    Typical core values range from about 1e3-3e5 Pa in tokamak plasmas, with edge
    and scrape-off-layer values often below 1e3 Pa. Non-thermal electron pressure
    is usually smaller than the thermal part, but it can become significant in strongly
    RF-heated plasmas or in runaway-electron scenarios.


    Sign convention: Positive when random and non-thermal electron particle motion
    produces compressive isotropic stress on a surface element.'
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_electron_pressure
  - name:thermal_electron_density
  - name:electron_temperature
  - name:ion_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/pressure
    dd_path: core_profiles/profiles_1d/electrons/pressure
    status: composed
- name: electron_temperature
  kind: scalar
  status: draft
  description: Mean random kinetic energy per degree of freedom of the electron population,
    expressed as an equivalent thermodynamic temperature.
  documentation: 'Electron temperature describes the thermal spread of the electron
    velocity distribution after subtracting any mean fluid motion. It is a kinetic-moment
    quantity that controls collisional transport, electrical conductivity, ionization
    balance, and the electron contribution to pressure; it is closely paired with
    [electron density](name:electron_density) and [thermal electron pressure](name:thermal_electron_pressure).


    For a near-Maxwellian electron distribution, the temperature in energy units is
    related to the mean random kinetic energy per electron by


    $$

    T_e = \frac{2}{3}\,\langle E_{\mathrm{rand},e}\rangle

    $$


    where $T_e$ is the electron temperature in eV and $\langle E_{\mathrm{rand},e}\rangle$
    is the mean kinetic energy associated with random electron motion, also expressed
    in eV. In a thermal equation of state, this moment combines with [thermal electron
    density](name:thermal_electron_density) to determine the thermal part of the electron
    pressure, while [electron pressure](name:electron_pressure) may include additional
    nonthermal contributions.


    Electron temperature is measured with Thomson scattering, electron cyclotron emission,
    soft-X-ray spectral methods, Langmuir probes in sufficiently cool edge plasma,
    or inferred from integrated transport and equilibrium-consistent modeling. Comparisons
    with [ion temperature](name:ion_temperature) diagnose electron-ion energy exchange
    and distinguish electron-heated from ion-heated regimes.


    Representative values range from 1-30 keV in hot tokamak cores, 50-1000 eV near
    the pedestal and edge, and 1-100 eV in scrape-off-layer and divertor plasmas,
    depending on heating power, density, and confinement regime.


    Sign convention: Positive when the electron random kinetic energy relative to
    the mean electron flow is greater than zero.'
  unit: eV
  physics_domain: transport
  links:
