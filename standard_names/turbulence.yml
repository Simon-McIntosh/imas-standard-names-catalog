- name: normalized_particle_charge
  kind: scalar
  status: draft
  description: Dimensionless electric charge assigned to a particle species, equal
    to its physical charge divided by a chosen positive reference charge. It specifies
    the sign and relative strength of the species coupling to electromagnetic fields;
    with the elementary charge as reference, electrons have -1 and singly charged
    ions have +1.
  documentation: 'Normalized particle charge is the electric charge of a particle
    species expressed as a dimensionless multiple of a fixed positive reference charge.
    It is a signed species property: the magnitude gives the relative charge strength,
    while the sign distinguishes negatively charged species such as electrons from
    positively charged ion species.


    The normalized particle charge $\hat{q}_s$ for species $s$ is defined by


    $$

    \hat{q}_s = \frac{q_s}{q_\mathrm{ref}}

    $$


    where $q_s$ is the physical electric charge of the species in coulombs and $q_\mathrm{ref}$
    is the positive reference charge in coulombs. In most plasma applications $q_\mathrm{ref}$
    is the elementary charge $e = 1.602176634 \times 10^{-19}\,\mathrm{C}$, so $\hat{q}_s$
    is numerically the signed charge state.


    The value is normally assigned from the species identity and ionization state
    rather than measured independently. For a resolved charge state it is an integer
    multiple of the reference charge, consistent with ion species charge. Effective
    or bundled kinetic species may use non-integer values, consistent with a mean
    charge state, to represent averaged ionization or a mixture of charge states.
    The value enters charge density, quasineutrality, and electromagnetic force terms
    through factors involving $q_s$ or $\hat{q}_s$; mass affects inertia and gyrofrequency
    separately and does not define the electric charge.


    Allowed values are finite real numbers. With $q_\mathrm{ref}=e$, typical values
    are -1 for electrons, +1 for singly ionized hydrogen isotopes, +2 for alpha particles
    or fully ionized helium, +6 for fully ionized carbon, and up to about +74 for
    fully stripped tungsten. Non-integer effective impurity charges commonly lie between
    1-60 depending on plasma conditions; 0 represents an electrically neutral model
    species with no direct electromagnetic charge coupling.


    Sign convention: Positive when the species charge has the same sign as the positive
    reference charge $q_\mathrm{ref}$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_mass
  - name:normalized_collisionality
