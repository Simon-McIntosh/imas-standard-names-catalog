- name: toroidal_flux_surface_averaged_hydrogen_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted toroidal bulk-flow velocity of hydrogen ions, averaged
    over the last closed magnetic flux surface and combining all ionization states.
  documentation: 'This quantity is the density-weighted mean toroidal bulk-flow velocity
    of hydrogen ions at the plasma boundary, combining all hydrogen ionization states.
    The average is taken over the last closed magnetic flux surface in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    $$

    \bar v_{\phi,\mathrm{H}}^{\mathrm{FS}} = \frac{\sum_q \left\langle n_{\mathrm{H},q}v_{\phi,\mathrm{H},q}\right\rangle_{\mathrm{FS}}}{\sum_q
    \left\langle n_{\mathrm{H},q}\right\rangle_{\mathrm{FS}}}

    $$


    Here $q$ indexes the hydrogen ionization states, $n_{\mathrm{H},q}$ is the number
    density of state $q$, $v_{\phi,\mathrm{H},q}$ is its toroidal velocity component,
    and $\langle\cdot\rangle_{\mathrm{FS}}$ denotes the flux-surface average over
    the plasma boundary.


    The charge-state aggregation is a density-weighted mean, not a sum of velocities.
    It differs from the local quantity [toroidal hydrogen velocity at the plasma boundary](name:toroidal_hydrogen_velocity_at_plasma_boundary)
    because that quantity is not flux-surface averaged, and from [toroidal flux-surface-averaged
    ion velocity at the plasma boundary](name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary),
    which represents the total ion fluid.


    Sign convention: Positive when the density-weighted hydrogen-ion flow has a component
    in the direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_hydrogen_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary
  sources:
