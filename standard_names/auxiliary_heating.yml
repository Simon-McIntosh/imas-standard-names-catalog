- name: per_toroidal_mode_thermal_electron_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged absorbed wave power density on the thermal electron
    population, resolved per toroidal Fourier mode number.
  documentation: 'The power density $P_{\mathrm{th},e}^{(n_\phi)}$ quantifies the
    volumetric rate at which wave energy is absorbed by the thermal (Maxwellian) electron
    population via resonant or collisional damping, decomposed into contributions
    from each toroidal Fourier mode $n_\phi$. The total absorbed power density on
    thermal electrons is recovered by summing over all toroidal modes: $P_{\mathrm{th},e}
    = \sum_{n_\phi} P_{\mathrm{th},e}^{(n_\phi)}$. This quantity is routinely computed
    by full-wave or ray-tracing codes that model radio-frequency heating (e.g., electron
    cyclotron or lower hybrid waves) and is a key input to transport codes for predicting
    electron temperature profiles. Typical values in the core of a fusion-grade tokamak
    under auxiliary heating range from $10^4$ to $10^6$ W/m$^3$ per dominant mode,
    with the spectrum peaking near the launched mode number. The radial profile of
    $P_{\mathrm{th},e}^{(n_\phi)}$ is closely related to the wave electric field amplitude
    and the electron conductivity tensor. See also [per_toroidal_mode_fast_electron_power_density](name:per_toroidal_mode_fast_electron_power_density)
    for the same quantity on the fast electron population, and [thermal_electron_power_density](name:thermal_electron_power_density)
    for the total (all modes) absorbed power density.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_fast_electron_power_density
  - name:thermal_electron_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_density_thermal_n_phi
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_density_thermal_n_phi
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_density_thermal_n_tor
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_density_thermal_n_tor
