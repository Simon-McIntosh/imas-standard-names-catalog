- name: radial_coordinate_of_strike_point
  kind: scalar
  status: active
  description: Major-radius coordinate of a magnetic strike point where the plasma
    separatrix meets a divertor target or first-wall surface in the poloidal cross-section.
  documentation: "The strike-point major radius is the distance from the toroidal\
    \ symmetry axis to the intersection of the plasma separatrix with a divertor target\
    \ or first-wall surface. It is evaluated in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is major radius, $\\phi$ is toroidal angle, and\
    \ $Z$ is vertical height.\n\nLet $\\mathbf{x}_{\\rm sp}$ denote the strike-point\
    \ position and $R(\\mathbf{x}_{\\rm sp})$ its major-radius coordinate:\n\n$$\n\
    R_{\\rm sp}=R(\\mathbf{x}_{\\rm sp})\n$$\n\nThe quantity refers to the radial\
    \ coordinate of the separatrix\u2013surface intersection, not to the nearby magnetic\
    \ null represented by the [radial coordinate of the X-point](name:radial_coordinate_of_x_point).\
    \ It complements the general [radial coordinate](name:radial_coordinate) used\
    \ to specify positions in the poloidal plane."
  unit: m
  physics_domain: equilibrium
  links:
