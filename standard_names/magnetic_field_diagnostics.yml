      kind: llm
- name: breakdown_stray_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Breakdown stray magnetic field magnitude is the scalar Euclidean magnitude
    of the stray magnetic-field vector at the plasma position during plasma initiation.
    It includes residual field in all spatial directions and carries no directional
    information.
  documentation: 'Breakdown stray magnetic field magnitude is the scalar Euclidean
    magnitude of the stray magnetic-field vector at the plasma position during plasma
    initiation. It represents the local residual magnetic field at the breakdown location
    without retaining vector direction.


    For a stray magnetic-field vector $\mathbf{B}_\mathrm{stray}$ with components
    in the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height, the magnitude is defined by:


    $$

    B_\mathrm{stray} = |\mathbf{B}_\mathrm{stray}| = \sqrt{B_R^2 + B_\phi^2 + B_Z^2}

    $$


    where $B_R$, $B_\phi$, and $B_Z$ are respectively the $\hat{R}$, $\hat{\phi}$,
    and $\hat{Z}$ components of the stray magnetic-field vector, and $B_\mathrm{stray}$
    is the scalar magnitude.


    This quantity is the breakdown-specific counterpart of [stray_magnetic_field_magnitude](name:breakdown_stray_magnetic_field_magnitude)
    and the scalar magnitude corresponding to breakdown_stray_magnetic_field. It differs
    from poloidal_breakdown_stray_magnetic_field_magnitude, which uses only the projection
    onto the $(\hat{R}, \hat{Z})$ poloidal plane of the right-handed cylindrical $(R,
    \phi, Z)$ frame; it also differs from directional component quantities because
    it contains no sign or orientation information.'
  unit: T
  physics_domain: magnetic_field_diagnostics
  links: []
  sources:
  - dd_path: plasma_initiation/global_quantities/b_field_stray
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/plasma_initiation.html#plasma_initiation-global_quantities-b_field_stray
    dd_documentation:
