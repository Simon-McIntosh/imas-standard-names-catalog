name: gyrokinetic_eigenmode_normalized_particle_parallel_heat_flux_moment
status: draft
cocos_transformation_type: one_like
description: Normalized parallel heat flux moment of the perturbed particle distribution
  for a gyrokinetic eigenmode.
documentation: The dimensionless parallel heat flux moment computed from the full
  particle (as opposed to gyrocenter) perturbed distribution function, $\hat{q}_{\parallel,\mathrm{part}}
  \propto \int \frac{1}{2} m v_\parallel v^2 \delta f_{\mathrm{part}} \, d^3v$, where
  $m$ is the species mass, $v_\parallel$ the parallel velocity, $v^2 = v_\parallel^2
  + v_\perp^2$, and $\delta f_{\mathrm{part}}$ the perturbed particle distribution.
  Unlike the gyrocenter moment, this quantity already incorporates the pullback transformation
  from gyrocenter to particle coordinates, so it includes all finite-Larmor-radius
  corrections to the heat flux. It is normalized to a reference quantity built from
  the thermal speed and reference density, giving a dimensionless value of order unity
  for dominant eigenmodes. This moment is relevant for computing the total energy
  transport due to the eigenmode perturbation. Produced by gyrokinetic codes during
  linear eigenmode analysis or nonlinear saturation studies.
