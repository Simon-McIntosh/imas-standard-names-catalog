- name: electron_pressure_over_scrape_off_layer
  kind: scalar
  status: active
  description: Volume-averaged thermal pressure of electrons in the scrape-off layer,
    the open-field-line region between the last closed flux surface and material plasma-facing
    components.
  documentation: 'Electron pressure over the scrape-off layer is the volume-averaged
    thermal pressure of electrons in the open-field-line region between the last closed
    flux surface and the material plasma-facing components. It represents the electron
    partial-pressure contribution to [pressure over the scrape-off layer](name:pressure_over_scrape_off_layer)
    over that volume.


    The volume average is defined from the local electron thermal pressure over the
    scrape-off-layer volume:


    $$

    \langle p_e \rangle_{\mathrm{SOL}} = \frac{1}{V_{\mathrm{SOL}}} \int_{V_{\mathrm{SOL}}}
    n_e(\mathbf{x}) T_e(\mathbf{x}) \, dV

    $$


    where $\langle p_e \rangle_{\mathrm{SOL}}$ is the volume-averaged electron pressure
    over the scrape-off layer, $n_e(\mathbf{x})$ is the local electron number density,
    $T_e(\mathbf{x})$ is the local electron temperature expressed as thermal energy
    per electron, $V_{\mathrm{SOL}}$ is the scrape-off-layer volume, $dV$ is a volume
    element, and $\mathbf{x}$ is position.


    This quantity excludes ion partial pressures and the neutral-gas pressure described
    by [neutral pressure over the scrape-off layer](name:neutral_pressure_over_scrape_off_layer).
    It is a SOL volume average, not the [electron pressure at the plasma boundary](name:electron_pressure_at_plasma_boundary),
    and it is related to [electron density over the scrape-off layer](name:electron_density_over_scrape_off_layer)
    through the same averaging domain but is a density-temperature moment rather than
    a number-density average.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_over_scrape_off_layer
  - name:pressure_over_scrape_off_layer
  - name:neutral_pressure_over_scrape_off_layer
