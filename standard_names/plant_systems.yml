- name: x_component_of_shatter_cone_major_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the unit vector $\hat{e}_{\mathrm{major}}$
    defining the primary symmetry axis of the SPI shatter cone geometry.
  documentation: 'The shatter cone major unit vector $\hat{e}_{\mathrm{major}}$ defines
    the central symmetry axis of the conical fragment dispersion pattern produced
    when a shattered pellet injector (SPI) pellet strikes the shattering target. This
    quantity is the projection of $\hat{e}_{\mathrm{major}}$ onto the $\hat{x}$ axis
    of the right-handed Cartesian $(x, y, z)$ frame, so that $\hat{e}_{\mathrm{major}}
    = (e_x, e_y, e_z)$ with $e_x^2 + e_y^2 + e_z^2 = 1$. Together with the [Y component](name:y_component_of_shatter_cone_major_unit_vector)
    and [Z component](name:z_component_of_shatter_cone_major_unit_vector), it completely
    specifies the major-axis orientation; the orthogonal minor axis is described by
    [shatter_cone_minor_unit_vector](name:x_component_of_shatter_cone_minor_unit_vector)
    and its siblings. The major unit vector orientation governs the direction of peak
    fragment flux and is an essential input for computing pellet fragment deposition
    profiles during disruption mitigation studies.


    Sign convention: Positive when the $\hat{x}$ projection of the shatter cone major
    unit vector points in the $+x$ direction of the right-handed Cartesian $(x, y,
    z)$ frame.'
