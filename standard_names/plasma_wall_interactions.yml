    is the hydrogen-ion velocity distribution function, and $\mathbf{v}$ is particle
    velocity at the evaluation point.


    This quantity is the hydrogen-specific component of [density_at_limiter](name:density_at_limiter).
    It counts hydrogen ions separately from [deuterium_density_at_limiter](name:deuterium_density_at_limiter),
