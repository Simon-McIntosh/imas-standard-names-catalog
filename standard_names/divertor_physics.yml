    dd_path: summary/local/divertor_plate/zeff/value
    status: composed
  - id: dd:summary/local/divertor_target/zeff/value
    dd_path: summary/local/divertor_target/zeff/value
    status: attached
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of iron ions at the divertor target, summed over all
    ionization stages, providing a local measure of this high-Z metallic impurity
    from erosion of iron-containing plasma-facing and structural materials.
  documentation: 'Iron is a high-Z metallic impurity in fusion plasmas, originating
    from sputtering and erosion of iron-containing structural components and plasma-facing
    materials. The iron number density at the divertor target represents the total
    number of iron ions per unit volume at the divertor target location, aggregated
    over all ionization states $z = 1, \ldots, 26$.


    The combined iron density is defined as:


    $$

    n_\text{Fe} = \sum_{z=1}^{26} n_{\text{Fe}^{z+}}

    $$


    where $n_{\text{Fe}^{z+}}$ is the local density of iron ions in charge state $z$,
    in m$^{-3}$.


    This quantity is a species-resolved component of the broader [density_at_divertor_target](name:density_at_divertor_target),
    characterizing how much high-Z impurity load reaches the divertor target from
    the scrape-off layer. Elevated iron concentrations at the divertor target indicate
    strong erosion or enhanced impurity transport toward the target, and can substantially
    increase radiated power through iron line emission. The density is inferred from
    spectroscopic analysis of iron emission lines in the divertor region, combined
    with collisional-radiative modeling to convert observed line intensities to absolute
    number densities.


    Comparison with [volume_averaged_iron_density](name:volume_averaged_iron_density)
    reveals the degree of impurity accumulation near the target relative to the bulk
    plasma, while [iron_density_at_pedestal](name:iron_density_at_pedestal) gives
    the corresponding local density at the pedestal. Analogous divertor-target densities
    for other impurity species include [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), and
    [boron_density_at_divertor_target](name:boron_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:volume_averaged_iron_density
  - name:iron_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/iron/value
    dd_path: summary/local/divertor_plate/n_i/iron/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/iron/value
    dd_path: summary/local/divertor_target/n_i/iron/value
    status: composed
- name: nitrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Nitrogen ion number density evaluated at the divertor target.
  documentation: 'Nitrogen ion number density at the divertor target quantifies the
    local concentration of ionized nitrogen in the plasma immediately adjacent to
    the divertor plate surface. Nitrogen is commonly seeded as an impurity into the
    divertor region to enhance radiative power dissipation through atomic line emission,
    promoting plasma detachment and reducing peak heat loads on the target.


    The ion number density $n_\mathrm{N}$ is defined as the zeroth velocity moment
    of the nitrogen ion velocity distribution:


    $$

    n_\mathrm{N} = \int f_\mathrm{N}(\mathbf{v}) \, d^3v

    $$


    where $f_\mathrm{N}(\mathbf{v})$ is the nitrogen ion phase-space distribution
    function and integration is over all velocities $\mathbf{v}$.


    This quantity is inferred from optical spectroscopy of nitrogen line emission
    in the divertor plasma, or from Langmuir probe measurements combined with spectroscopic
    impurity fraction estimates. It is a key parameter for characterizing impurity
    seeding scenarios and controlling plasma detachment. Analogous quantities for
    other seeded impurity species include [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    and [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    this quantity is the nitrogen-specific component of the parent [density_at_divertor_target](name:density_at_divertor_target).


    Sign convention: Positive when nitrogen ions are present at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:neon_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:oxygen_density_at_divertor_target
  - name:xenon_density_at_divertor_target
  - name:density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/nitrogen/value
    dd_path: summary/local/divertor_plate/n_i/nitrogen/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/nitrogen/value
    dd_path: summary/local/divertor_target/n_i/nitrogen/value
    status: composed
