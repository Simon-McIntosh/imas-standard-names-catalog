- name: poloidal_angle_of_measurement_position
  kind: scalar
  status: active
  description: "Poloidal angle of a diagnostic measurement position in the poloidal\
    \ cross-section of the right-handed cylindrical (R, \u03C6, Z) frame, measured\
    \ clockwise from the outward radial direction about the magnetic axis."
  documentation: 'The poloidal angle of a diagnostic measurement position is the angular
    coordinate of that point about the magnetic axis in a poloidal cross-section of
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It is the measurement-position
    form of [poloidal angle](name:poloidal_angle).


    For a measurement position with coordinates $(R,Z)$ and magnetic-axis coordinates
    $(R_\mathrm{ax},Z_\mathrm{ax})$, the angle is


    $$

    \theta=\operatorname{atan2}(Z_\mathrm{ax}-Z,\,R-R_\mathrm{ax})\pmod{2\pi}

    $$


    where $\theta$ is the poloidal angle, $R$ and $R_\mathrm{ax}$ are major-radius
    coordinates in meters, $Z$ and $Z_\mathrm{ax}$ are vertical coordinates in meters,
    and $\operatorname{atan2}$ returns the quadrant-resolved angle. Unlike [poloidal
    angle of a flux-surface point](name:poloidal_angle_of_flux_surface), this quantity
    applies to a diagnostic measurement position and does not require the position
    to be identified as a point on a flux surface.


    Sign convention: Positive when the measurement position lies clockwise from the
    outward $+R$ direction when viewed from the $+\phi$ direction.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:poloidal_angle_of_flux_surface
  sources:
