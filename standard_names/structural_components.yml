- name: lower_thickness_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Lower thickness of a breeder blanket module is the non-negative geometric
    separation through the lower cap, measured normal to its exterior boundary and
    main-body interface.
  documentation: 'Lower thickness of a breeder blanket module is the geometric thickness
    of the cap that closes the module at its lower end. The reference surfaces are
    the lower exterior boundary of the cap and the interface where the lower cap joins
    the main module body. It is distinct from the overall [thickness of a breeder
    blanket module](name:thickness_of_breeder_blanket_module) and the corresponding
    [upper thickness of a breeder blanket module](name:upper_thickness_of_breeder_blanket_module).


    The lower-cap thickness is the normal projection of the separation between the
    reference surfaces:


    $$

    t_{\mathrm{lower}} = \left|\left(\mathbf{x}_{\mathrm{ext}} - \mathbf{x}_{\mathrm{int}}\right)
    \cdot \hat{\mathbf{n}}\right|

    $$


    where $\mathbf{x}_{\mathrm{ext}}$ and $\mathbf{x}_{\mathrm{int}}$ are corresponding
    points on the lower exterior boundary and cap-to-body interface, $\hat{\mathbf{n}}$
    is the local unit normal directed through the cap, and $t_{\mathrm{lower}}$ is
    the lower-cap thickness. The quantity is a non-negative geometric magnitude; it
    is not a signed vertical coordinate or displacement and excludes the thicknesses
    of internal breeder, coolant, or shielding layers.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_breeder_blanket_module
  - name:upper_thickness_of_breeder_blanket_module
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: lower
    operator_kind: qualifier
  sources:
