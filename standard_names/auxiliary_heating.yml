      kind: llm
- name: perpendicular_wave_vector_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Non-negative magnitude of the RF wave-vector component perpendicular
    to the local equilibrium magnetic field launched by an ion-cyclotron heating antenna.
  documentation: 'This quantity measures the transverse spatial variation of the radio-frequency
    wave launched by an ion-cyclotron heating antenna, relative to the local equilibrium
    magnetic field.


    The perpendicular wave-vector magnitude is defined by


    $$

    k_\perp = \left|\mathbf{k} - (\mathbf{k}\cdot\hat{\mathbf{b}})\hat{\mathbf{b}}\right|

    $$


    where $\mathbf{k}$ is the local RF wave vector, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local equilibrium magnetic field $\mathbf{B}$, and
    vertical bars denote vector magnitude.


    Only the component transverse to the magnetic field is included; the parallel
    component is excluded. The result is non-negative and has no propagation-direction
    sign. It is the antenna-specific counterpart of the general [perpendicular wave-vector
    magnitude](name:perpendicular_wave_vector_magnitude).'
  unit: m^-1
  physics_domain: auxiliary_heating
  links:
  - name:perpendicular_wave_vector_magnitude
  sources:
  - dd_path: summary/heating_current_drive/ic/k_perpendicular/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-ic-k_perpendicular-value
    dd_documentation:
