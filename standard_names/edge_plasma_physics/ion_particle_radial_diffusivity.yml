name: ion_particle_radial_diffusivity
status: draft
description: Effective radial diffusion coefficient for ion particle transport, parameterizing
  cross-field spreading of ion density due to turbulent and collisional processes.
documentation: "The ion particle radial diffusivity $D_{i,r}$ (m$^2$ s$^{-1}$) enters\
  \ the radial ion continuity equation through the diffusive-convective ansatz $\\\
  Gamma_{i,r} = -D_{i,r}\\,\\nabla_r n_i + V_{i,r}\\,n_i$, where $\\Gamma_{i,r}$ is\
  \ the radial ion particle flux (m$^{-2}$ s$^{-1}$), $n_i$ the ion number density\
  \ (m$^{-3}$), and $V_{i,r}$ the convective (pinch) velocity (m s$^{-1}$). It encapsulates\
  \ both neoclassical contributions, typically $\\sim 10^{-2}$ m$^2$ s$^{-1}$, and\
  \ anomalous (turbulent) transport that raises the effective value to $0.1$\u2013\
  $1$ m$^2$ s$^{-1}$ in the core and up to $\\sim 10$ m$^2$ s$^{-1}$ in the scrape-off\
  \ layer. In the edge plasma context the coefficient is specified per element on\
  \ a general grid description (GGD) mesh, enabling non-flux-surface-aligned representations\
  \ relevant for divertor and SOL modeling in codes such as SOLPS-ITER and SOLEDGE.\
  \ The diffusivity is inferred experimentally from perturbative transport experiments\
  \ (gas-puff modulation, impurity tracer injection) or extracted from integrated\
  \ transport modeling. See `electron_particle_radial_diffusivity` for the electron\
  \ counterpart, `ion_momentum_radial_diffusivity` for the momentum channel, and `ion_particle_poloidal_diffusivity`\
  \ for the poloidal projection."
