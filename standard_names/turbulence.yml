- name: normalized_time
  kind: scalar
  status: active
  description: Dimensionless gyrokinetic time coordinate formed by dividing physical
    elapsed time by a positive reference thermal transit time.
  documentation: 'This quantity parameterizes gyrokinetic evolution using a thermal
    transit-time scale rather than physical time. It is a coordinate, not a frequency,
    growth rate, or elapsed-time measurement in physical units.


    The normalized time is defined by


    $$

    t_* = \frac{t}{\tau_{\mathrm{th}}}

    $$


    where $t$ is physical elapsed time from the selected time origin and $\tau_{\mathrm{th}}$
    is the positive reference thermal transit time for the specified gyrokinetic system.


    The reference time fixes the normalization convention; changing it changes the
    numerical coordinate without changing the underlying evolution. This quantity
    is distinct from [normalized frequency of a gyrokinetic eigenmode](name:normalized_frequency_of_gyrokinetic_eigenmode),
    which describes a spectral frequency normalized to a reference scale.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_frequency_of_gyrokinetic_eigenmode
  sources:
  - dd_path: gyrokinetics_local/non_linear/time_norm
    dd_version: 4.1.0
