        as a time slice from the Access Layer point of view. The time child node corresponds
        to the time of maximum penetration of the probe during a given plunge. The
        dynamics of physicas quantities within the plunge are described via the time_within_plunge
        vector.
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Plasma potential (Vp) measured by a reciprocating Langmuir probe
        during a plunge. Represents the local electrostatic potential of the plasma
        in the scrape-off layer or boundary region.
      kind: llm
- name: electrostatic_potential_at_wall
  kind: scalar
  status: active
  description: Electrostatic potential at wall is the voltage-valued scalar potential
    of the plasma immediately adjacent to a plasma-facing wall, relative to a chosen
    electrical reference.
  documentation: 'Electrostatic potential at wall is the voltage-valued scalar potential
    of the plasma immediately adjacent to a plasma-facing wall, relative to a chosen
    electrical reference. It is the wall-local restriction of [electrostatic potential](name:electrostatic_potential).


    The electrostatic contribution to the electric field is defined by


    $$

    \mathbf{E}_{\rm es} = -\nabla \Phi

    $$


    where $\Phi$ is the electrostatic potential, $\mathbf{E}_{\rm es}$ is the electrostatic
    electric field, and $\nabla$ is the spatial gradient.


    This quantity refers to the plasma-side potential adjacent to the wall, not the
    electrical potential of the wall material, an applied wall bias, or the [floating
    electrostatic potential](name:floating_electrostatic_potential), which is established
    by a zero-net-current condition. The full electric field may additionally contain
    an inductive contribution.


    Sign convention: Positive when a positive test charge has greater electrostatic
    potential energy at the specified location than at the chosen electrical reference.'
  unit: V
  physics_domain: edge_plasma_physics
  links:
  - name:electrostatic_potential
  - name:floating_electrostatic_potential
