    dd_path: camera_ir/optical_element/back_surface/x1_curvature
    status: attached
  - id: dd:camera_ir/optical_element/back_surface/x2_curvature
    dd_path: camera_ir/optical_element/back_surface/x2_curvature
    status: composed
  - id: dd:camera_visible/channel/optical_element/back_surface/x1_curvature
    dd_path: camera_visible/channel/optical_element/back_surface/x1_curvature
