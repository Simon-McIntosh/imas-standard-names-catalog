- name: coolant_pressure
  kind: scalar
  status: active
  description: Absolute static pressure of the coolant or working fluid at a plant-system
    component port, referenced to perfect vacuum rather than atmospheric or another
    gage reference.
  documentation: 'The quantity is the local thermodynamic pressure of the coolant
    or working fluid at a component-port interface, with perfect vacuum as the zero-pressure
    reference. Static pressure is the isotropic mechanical stress of the fluid and
    excludes kinetic-energy contributions associated with bulk flow.


    $$

    \boldsymbol{\sigma}=-p_{\mathrm{abs}}\mathbf{I}

    $$


    where $\boldsymbol{\sigma}$ is the isotropic fluid Cauchy stress, $p_{\mathrm{abs}}$
    is the absolute static pressure, and $\mathbf{I}$ is the identity tensor.


    The value represents local pressure at the port, not stagnation pressure, pressure
    drop, or pressure difference. At a cooling-circuit inlet, it is related to [cooling-circuit
    inlet pressure](name:pressure_at_cooling_circuit_inlet), while [coolant flow through
    a plant component port](name:coolant_flow_of_plant_component_port) describes mass
    transport rather than mechanical pressure.'
  unit: Pa
  physics_domain: plant_systems
  links:
  - name:pressure_at_cooling_circuit_inlet
  sources:
  - dd_path: balance_of_plant/power_plant/system/component/port/pressure
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-system-component-port-pressure
    dd_documentation:
