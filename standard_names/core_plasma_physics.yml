- name: ion_charge_state_bundle_ionization_potential
  kind: scalar
  status: draft
  description: Cumulative average ionization potential required to reach a given ion
    charge-state bundle, weighted by relative abundance within the bundle.
  documentation: "For an ion species $X$ represented as a charge-state bundle, this\
    \ quantity is defined as $$E_{\\rm ion} = \\sum_z x_z \\left( \\sum_{z'=0}^{z-1}\
    \ E_{\\rm pot}(z') \\right),$$ where $x_z$ is the fractional abundance of charge\
    \ state $z$ within the bundle (dimensionless, $\\sum_z x_z = 1$), and $E_{\\rm\
    \ pot}(z')$ (in eV) is the ionization potential of the ion $X^{z'+}$. This weighted\
    \ sum represents the average energy that has been invested in ionization to produce\
    \ the observed charge-state distribution. It enters radiation-loss estimates,\
    \ impurity-transport modeling, and coronal-equilibrium calculations. Values range\
    \ from a few eV for light elements at low charge states (e.g., carbon $C^{1+}$\u2013\
    $C^{3+}$) to tens of keV for high-$Z$ impurities (e.g., tungsten $W^{40+}$\u2013\
    $W^{50+}$). The ionization potentials $E_{\\rm pot}(z')$ are obtained from atomic\
    \ databases such as ADAS or NIST. See also [electron_temperature](name:electron_temperature)\
    \ and [ion_density](name:ion_density)."
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - impurity-transport
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_electric_field
  kind: scalar
  status: draft
  description: Flux-surface-averaged electric field projected along the equilibrium
    magnetic field, defined as $E_{\parallel} = \langle \mathbf{E} \cdot \mathbf{B}
    \rangle / B_0$.
  documentation: The parallel electric field $E_{\parallel} = \langle \mathbf{E} \cdot
    \mathbf{B} \rangle / B_0$ (in V/m) is a flux-surface-averaged scalar, where $\langle
    \cdot \rangle$ denotes the flux-surface average, $\mathbf{E}$ is the electric
    field, $\mathbf{B}$ is the total magnetic field, and $B_0$ is the vacuum toroidal
    field at the magnetic axis (in T). $E_{\parallel}$ drives parallel current (ohmic
    and runaway) and enters the neoclassical resistivity relation $E_{\parallel} =
    \eta_{\parallel} j_{\parallel}$, where $\eta_{\parallel}$ is the Spitzer or neoclassical
    parallel resistivity. In tokamak core plasmas $|E_{\parallel}|$ ranges from $10^{-3}$
    to $10^{-1}$ V/m during flat-top and rises sharply during current ramps or disruptions.
    It is inferred from equilibrium reconstruction using the time derivative of the
    poloidal flux, $E_{\parallel} \propto \partial \psi / \partial t$, or from transport
    codes. See also [toroidal_component_of_total_current_density](name:toroidal_component_of_total_current_density)
    and [plasma_internal_inductance](name:plasma_internal_inductance).
  unit: V.m^-1
  tags:
  - flux-surface-average
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: plasma_internal_inductance
  kind: scalar
  status: draft
  description: Dimensionless measure of the poloidal magnetic-field energy stored
    inside the plasma relative to a surface-average reference, using the $l_{i,3}$
    definition.
  documentation: "The internal inductance quantifies how peaked the poloidal magnetic-field\
    \ (and hence current) profile is inside the plasma. It is defined in the $l_{i,3}$\
    \ convention as $$l_{i,3} = \\frac{2}{R_0 \\mu_0^2 I_p^2} \\int B_p^2 \\, dV,$$\
    \ where $R_0$ is the geometric major radius of the plasma (in m), $\\mu_0 = 4\\\
    pi \\times 10^{-7}$ H/m is the vacuum permeability, $I_p$ is the total plasma\
    \ current (in A), $B_p$ is the poloidal magnetic-field magnitude (in T), and the\
    \ integral is taken over the plasma volume $V$. A peaked current profile yields\
    \ $l_{i,3} > 1$, while a broad profile gives $l_{i,3} < 1$; values of 0.7\u2013\
    1.2 are common in standard H-mode tokamak operation. The internal inductance is\
    \ a key input for vertical stability analysis and plasma shape control, and is\
    \ reconstructed from external magnetic measurements using equilibrium codes. See\
    \ also [poloidal_magnetic_flux](name:poloidal_magnetic_flux) and [safety_factor](name:safety_factor)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_component_of_electron_velocity
  kind: vector
  status: draft
  description: Projection of the electron fluid velocity onto the poloidal direction
    $\hat{\theta}$.
  documentation: "The poloidal electron velocity $v_{\\theta,e} = \\mathbf{v}_e \\\
    cdot \\hat{\\theta}$ arises primarily from the electron diamagnetic drift, $E\
    \ \\times B$ drift, and neoclassical effects. In the fluid picture $v_{\\theta,e}\
    \ \\approx -\\nabla p_e \\times \\hat{b} / (n_e e B)$ in the diamagnetic limit,\
    \ where $p_e$ is the electron pressure, $n_e$ the electron density, $e$ the elementary\
    \ charge, and $B$ the magnetic-field magnitude. Direct measurement is challenging;\
    \ estimates are obtained from Doppler reflectometry, beam-emission spectroscopy,\
    \ or inferred from radial force balance. In the core of H-mode tokamak plasmas,\
    \ poloidal electron velocities are of order $10^2$\u2013$10^4$ m/s, much smaller\
    \ than the toroidal component. See also [toroidal_component_of_electron_velocity](name:toroidal_component_of_electron_velocity)\
    \ and [poloidal_component_of_ion_velocity](name:poloidal_component_of_ion_velocity)."
  unit: m.s^-1
  tags:
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_component_of_ion_velocity
  kind: vector
  status: draft
  description: Projection of the ion fluid velocity onto the poloidal direction $\hat{\theta}$,
    averaged over charge states when multiple ion charge states coexist.
  documentation: The poloidal ion velocity $v_{i,\theta} = \mathbf{v}_i \cdot \hat{\theta}$
    (in m/s) characterizes the ion flow within a poloidal cross-section of the plasma.
    Here $\mathbf{v}_i$ is the ion fluid velocity vector and $\hat{\theta}$ is the
    unit vector in the poloidal direction on a given flux surface. In neoclassical
    theory, $v_{i,\theta}$ is related to temperature gradients and radial electric
    field through the relation $v_{i,\theta} \approx K_1 \frac{1}{e_i B_\phi} \frac{\partial
    T_i}{\partial r}$, where $K_1$ is a neoclassical coefficient of order unity depending
    on collisionality regime, $e_i$ is the ion charge, $B_\phi$ is the toroidal magnetic
    field (T), $T_i$ is the ion temperature (eV), and $r$ is the minor radius (m).
    Measured by charge-exchange recombination spectroscopy (CXRS) or beam emission
    spectroscopy; values in tokamak core plasmas range from $10^2$ to $10^4$ m/s,
    an order of magnitude smaller than toroidal rotation velocities. In the banana
    regime the poloidal flow is strongly damped by magnetic pumping on the ion-ion
    collision timescale. See also [toroidal_component_of_ion_velocity](name:toroidal_component_of_ion_velocity)
    for the dominant rotation component and [poloidal_component_of_electron_velocity](name:poloidal_component_of_electron_velocity)
    for the electron counterpart.
  unit: m.s^-1
  tags:
  - flux-surface-average
  - measured
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angular_momentum_density
  kind: scalar
  status: draft
  description: Volume density of toroidal angular momentum carried by the plasma,
    summed over all ion species and electrons.
  documentation: "The toroidal angular momentum density $L_\\phi$ (in kg\xB7m\xB7\
    s$^{-1}$ per unit volume, though stored here as the integrated profile quantity\
    \ in kg\xB7m/s) is defined as $$L_\\phi = \\sum_s n_s m_s R v_{\\phi,s},$$ where\
    \ $n_s$ is the number density (m$^{-3}$), $m_s$ the particle mass (kg), $R$ the\
    \ major radius (m), and $v_{\\phi,s}$ the toroidal velocity (m/s) of species $s$;\
    \ the sum runs over all ion species and electrons (the electron contribution is\
    \ negligible by mass). Toroidal momentum is injected by neutral-beam injection\
    \ and intrinsic torques, redistributed by neoclassical and turbulent viscosity,\
    \ and lost through charge-exchange friction with neutrals and resonant magnetic\
    \ perturbations. In NBI-heated H-mode tokamak plasmas, core momentum densities\
    \ reach $\\sim 0.01$\u2013$1$ kg\xB7m/s per unit volume element, depending on\
    \ beam power and plasma mass. This quantity appears as the conserved variable\
    \ in the angular momentum transport equation, making it central to rotation prediction\
    \ in integrated modeling. See also [toroidal_component_of_ion_velocity](name:toroidal_component_of_ion_velocity)\
    \ and [ion_density](name:ion_density)."
  unit: kg.m.s^-1
  tags:
  - momentum-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_total_current_density
  kind: vector
  status: draft
  description: Toroidal projection of the total plasma current density, including
    ohmic, bootstrap, and driven contributions.
  documentation: "The toroidal current density $j_\\phi$ (in A m$^{-2}$) is defined\
    \ as the flux-surface average $\\langle J_\\phi / R \\rangle / \\langle 1/R \\\
    rangle$, where $J_\\phi = \\mathbf{j} \\cdot \\hat{\\phi}$ is the local toroidal\
    \ current density and $R$ is the major radius. It sums all current sources: ohmic\
    \ ($j_{\\text{oh}}$), bootstrap ($j_{\\text{bs}}$), and externally driven (NBI,\
    \ ECCD, LHCD). In conventional H-mode tokamak cores, peak values reach $10^5$\u2013\
    $10^7$ A m$^{-2}$ depending on machine size and plasma current. The profile is\
    \ reconstructed from equilibrium codes using magnetic diagnostics, motional Stark\
    \ effect, or polarimetry. Positive $j_\\phi$ corresponds to current flowing in\
    \ the $+\\phi$ direction under COCOS-11. See also [toroidal_component_of_current_density](name:toroidal_component_of_current_density)\
    \ and [parallel_electric_field](name:parallel_electric_field)."
  unit: A.m^-2
  tags:
  - equilibrium-reconstruction
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
