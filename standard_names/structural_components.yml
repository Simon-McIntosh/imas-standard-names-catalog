- name: resistivity_of_vacuum_vessel
  kind: scalar
  status: active
  description: Effective isotropic electrical resistivity of vacuum-vessel material,
    relating local electric field to current density and governing transient passive-current
    response.
  documentation: 'Electrical resistivity of vacuum-vessel material is the effective
    isotropic constitutive coefficient that opposes electric current and determines
    ohmic dissipation during transient electromagnetic events. It governs induced
    eddy and halo currents in the vessel material.


    For isotropic material, the constitutive relation is


    $$

    \mathbf{E} = \rho\,\mathbf{J}

    $$


    where $\mathbf{E}$ is the local electric-field vector, $\rho$ is electrical resistivity,
    and $\mathbf{J}$ is current-density vector. The associated ohmic power density
    is $\mathbf{J}\cdot\mathbf{E} = \rho |\mathbf{J}|^2$.


    This is a local material property of the vessel and excludes conductor geometry,
    interfaces, and contact effects. Consequently, it is distinct from the total [resistance
    of the vacuum vessel](name:resistance_of_vacuum_vessel), which also depends on
    current path and geometry.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistance_of_vacuum_vessel
  sources:
  - dd_path: wall/description_2d/vessel/unit/annular/resistivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-vessel-unit-annular-resistivity
