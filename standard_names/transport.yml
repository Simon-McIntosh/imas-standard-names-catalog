    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/velocity/toroidal
    dd_path: core_profiles/profiles_1d/ion/velocity/toroidal
    status: composed
- name: total_ion_pressure
  kind: scalar
  status: draft
  description: Thermal kinetic pressure obtained by summing the isotropic pressure
    contributions of all ion species and resolved charge states.
  documentation: 'Total ion pressure is the thermal isotropic pressure carried by
    the complete ion population, aggregated over ion species and resolved charge states.
    It is the ion part of the plasma thermal pressure and should be distinguished
    from [ion_pressure](name:ion_pressure) when that quantity includes non-thermal
    ion contributions.


    For Maxwellian ion subpopulations, the defining relation is


    $$

    p_{i,\mathrm{tot}} = \sum_s \sum_Z n_{sZ} k_B T_{sZ}

    $$


    where $n_{sZ}$ is the number density of ion species $s$ in charge state $Z$, $T_{sZ}$
    is its temperature, and $k_B$ is Boltzmann''s constant. A single resolved contribution
    corresponds to [ion_state_pressure](name:ion_charge_state_pressure) or [ion_charge_state_pressure](name:ion_charge_state_pressure),
    while charge-state weighting is related to [ion_average_charge](name:ion_average_charge).


    It is computed from ion density and temperature measurements, using charge-exchange
    recombination spectroscopy, impurity line spectroscopy, neutral-particle analysis,
    and quasineutrality constraints combined with [ion_density](name:ion_density)
    and [ion_temperature](name:ion_temperature). Representative values range from
    10^2-10^4 Pa near the edge to 10^4-10^5 Pa in high-performance tokamak cores;
    reactor-grade plasmas can reach several 10^5 Pa when electron and ion temperatures
    are both high.


    Sign convention: Positive when the summed ion momentum flux corresponds to a compressive
    isotropic stress on a local surface element.'
  unit: Pa
  physics_domain: transport
  links:
  - name:ion_pressure
  - name:ion_charge_state_pressure
  - name:ion_average_charge
  - name:ion_density
  - name:ion_temperature
  sources:
  - id: dd:core_profiles/profiles_1d/pressure_ion_total
    dd_path: core_profiles/profiles_1d/pressure_ion_total
    status: composed
- name: total_thermal_ion_species_density
  kind: scalar
  status: draft
  description: Aggregate number density of Maxwellian bulk ion species contributing
    to quasineutrality, excluding suprathermal fast-ion populations.
  documentation: 'This quantity represents the local sum of number densities over
    all thermal ion species in the bulk plasma. It differs from a single-species [thermal
    ion density] by aggregating species contributions, and it excludes energetic populations
    described by [fast ion density](name:fast_ion_density).


    The species-summed thermal ion density is


    $$

    n_{i,\mathrm{th}}^{\mathrm{tot}} = \sum_s n_{s,\mathrm{th}}

    $$


    where $s$ labels each thermal ion species and $n_{s,\mathrm{th}}$ is that species''
    thermal number density in m$^{-3}$. In quasineutral plasmas it is constrained
    together with charge states by the electron balance, so interpretation often uses
    [electron density](name:electron_density), [ion density](name:ion_density), and
    [ion average charge](name:ion_average_charge).


    It is inferred from a combination of interferometry or Thomson-scattering electron
    density, charge-exchange recombination spectroscopy, visible spectroscopy of impurities,
    neutral-beam or gas-fueling particle balance, and transport modeling that separates
    thermal species from fast-ion components.


    Representative core values in present tokamak plasmas are about $0.1-1.5 \times
    10^{20}$ m$^{-3}$, with lower edge and scrape-off-layer values around $10^{17}-10^{19}$
    m$^{-3}$ depending on fueling, confinement regime, and impurity dilution. The
    closely related [total thermal ion density] may be used when the thermal ion ensemble
    is not resolved by species.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_ion_density
  - name:electron_density
  - name:ion_density
  - name:ion_average_charge
- name: volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Plasma-volume mean of the electron number density, weighting each spatial
    element by its contribution to the confined plasma volume.
  documentation: 'The volume-averaged electron density is the global mean electron
    number density over the confined plasma volume. It condenses the spatially varying
    [electron density](name:electron_density) into a single particle-inventory measure
    and is interpreted together with [plasma volume](name:volume_of_plasma_boundary)
    when comparing fueling level and confinement between discharges.


    The defining average is


    $$

    \langle n_e \rangle_V = \frac{1}{V_p}\int_{V_p} n_e(\mathbf{x})\,dV

    $$


    where $n_e(\mathbf{x})$ is the local electron density in m$^{-3}$, $dV$ is the
    volume element in m$^3$, and $V_p$ is the confined plasma volume in m$^3$. The
    same averaging operation applied to ion populations gives [volume-averaged ion
    density](name:volume_averaged_ion_density), while [volume of flux surface](name:volume_of_flux_surface)
    provides the geometric basis for flux-surface-resolved volume integration.


    It is computed from density reconstructions constrained by interferometry, Thomson
    scattering, reflectometry, or microwave diagnostics, combined with an equilibrium
    boundary defining the averaging volume. Representative tokamak values are about
    $0.1-2\times10^{20}$ m$^{-3}$ in the confined plasma, with startup and low-density
    phases below this range and high-performance scenarios approaching operational
    density limits.


    Sign convention: Positive when electrons contribute positive particle number density
    to the confined plasma inventory.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:volume_of_plasma_boundary
  - name:volume_averaged_ion_density
  - name:volume_of_flux_surface
  sources:
  - id: dd:core_profiles/global_quantities/n_e_volume_average
    dd_path: core_profiles/global_quantities/n_e_volume_average
    status: composed
- name: volume_averaged_ion_density
  kind: scalar
  status: draft
  description: Plasma-volume mean number concentration of the ion population, used
    as a global measure of ion inventory and fueling state.
  documentation: 'The volume-averaged ion density is the spatial mean of the local
    ion number density over the confined plasma volume bounded by the last closed
    flux surface. It compresses the distribution described by [ion density](name:ion_density)
    into a single inventory-like measure, enabling comparison with [volume-averaged
    electron density](name:volume_averaged_electron_density) and with thermal-population
    measures such as [total thermal ion density].


    The defining average is


    $$

    \langle n_i \rangle_V = \frac{1}{V_p}\int_{V_p} n_i(\mathbf{x})\,dV

    $$


    where $n_i(\mathbf{x})$ is the local ion number density at position $\mathbf{x}$,
    $V_p$ is the enclosed plasma volume, and $dV$ is the volume element. The geometric
    normalization is set by the same confined volume concept used in [volume of flux
    surface](name:volume_of_flux_surface).


    It is inferred from particle-balance analysis, charge-state and quasineutrality
    constraints, ionization modeling, and density diagnostics combined with composition
    measurements. Representative core-fusion values are about $0.1-2 \times 10^{20}$
    m$^{-3}$, with lower values during startup or low-density operation and higher
    values in fueled H-mode plasmas. It is often interpreted together with [volume-averaged
    ion temperature](name:volume_averaged_ion_temperature) to assess ion thermal content
    and confinement.


    Sign convention: Positive when ions are counted as particles contributing positively
    to the volume integral.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:ion_density
  - name:volume_averaged_electron_density
  - name:volume_of_flux_surface
  - name:volume_averaged_ion_temperature
  sources:
  - id: dd:core_profiles/global_quantities/ion/n_i_volume_average
    dd_path: core_profiles/global_quantities/ion/n_i_volume_average
    status: composed
- name: volume_averaged_ion_temperature
  kind: scalar
  status: draft
  description: Ion thermal energy per degree of freedom averaged over the confined
    plasma volume, giving a global measure of ion heat content.
  documentation: 'The volume-averaged ion temperature is the spatial average of the
    local ion thermal temperature over the confined plasma volume, usually bounded
    by the last closed flux surface. It compresses the local [ion temperature](name:ion_temperature)
    distribution into a single global transport metric that is directly related to
    stored ion thermal energy and confinement quality.


    For plasma volume $V$ and local ion temperature $T_i(\mathbf{x})$, the volume
    average is


    $$

    \langle T_i \rangle_V = \frac{1}{V}\int_V T_i(\mathbf{x})\,dV

    $$


    where $\mathbf{x}$ denotes position in the plasma volume and $dV$ is the physical
    volume element. Combined with [volume-averaged ion density](name:volume_averaged_ion_density),
    this quantity constrains the ion contribution to thermal pressure and energy content;
    the related local thermodynamic measure is [ion pressure](name:ion_pressure).


    It is computed by integrating ion-temperature measurements or reconstructed ion-temperature
    fields over the confined volume. Charge-exchange recombination spectroscopy provides
    common local ion-temperature measurements, while profile reconstruction and equilibrium
    geometry define the volume weighting; neutron spectroscopy can add constraints
    in high-temperature deuterium-tritium plasmas.


    Typical volume-averaged values range from 0.2-5 keV in present medium-size tokamak
    discharges and can reach 5-20 keV in high-performance reactor-relevant plasmas.
    The value is lower than the central ion temperature when edge and pedestal regions
    occupy a substantial fraction of the plasma volume.


    Sign convention: Positive when the averaged ion thermal energy is above the zero-energy
    reference used for temperature.'
  unit: eV
  physics_domain: transport
  links:
  - name:ion_temperature
  - name:volume_averaged_ion_density
  - name:ion_pressure
  sources:
  - id: dd:core_profiles/global_quantities/ion/t_i_volume_average
    dd_path: core_profiles/global_quantities/ion/t_i_volume_average
    status: composed
