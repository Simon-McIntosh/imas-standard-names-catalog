    dd_path: langmuir_probes/embedded/position/z
    status: composed
  - id: dd:langmuir_probes/probe/position_static/z
    dd_path: langmuir_probes/probe/position_static/z
    status: composed
  - id: dd:langmuir_probes/reciprocating/plunge/collector/position/z
