      kind: llm
  - dd_path: summary/global_quantities/power_ohm/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_ohm-value
