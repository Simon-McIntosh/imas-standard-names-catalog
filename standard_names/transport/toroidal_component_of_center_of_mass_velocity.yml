name: toroidal_component_of_center_of_mass_velocity
status: draft
description: Projection of the plasma center-of-mass velocity onto the toroidal ($\phi$)
  direction in cylindrical coordinates.
documentation: Defined as $v_{\rm cm,\phi} = \mathbf{v}_{\rm cm} \cdot \hat{\phi}$,
  where the center-of-mass velocity is $\mathbf{v}_{\rm cm} = \sum_s n_s m_s \mathbf{v}_s
  / \sum_s n_s m_s$ with summation over all plasma species $s$ ($n_s$ is number density
  in m$^{-3}$, $m_s$ mass in kg, $\mathbf{v}_s$ fluid velocity in m/s). The toroidal
  component is typically the dominant flow component in a tokamak, driven by momentum
  input from neutral-beam injection, intrinsic rotation, and $\mathbf{E} \times \mathbf{B}$
  drifts. Core toroidal rotation velocities range from $\sim 10^3$ m/s in Ohmic plasmas
  to $\sim 10^5$ m/s with strong auxiliary heating. This quantity is evaluated on
  a GGD mesh and is essential for momentum-balance analysis and rotation-shear stabilization
  of turbulence. It is dominated by the main-ion contribution because $m_i \gg m_e$.
