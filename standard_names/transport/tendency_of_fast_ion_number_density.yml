name: tendency_of_fast_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Time derivative of the non-thermal (fast) ion number density, quantifying
  how the supra-thermal ion population evolves.
documentation: "The tendency $\\partial n_{i,\\text{fast}} / \\partial t$ (m$^{-3}$\
  \ s$^{-1}$) describes the temporal rate of change of the fast (non-thermal) ion\
  \ number density. Fast ions are produced by NBI, ICRH tail formation, and fusion-born\
  \ alpha particles; they thermalize through Coulomb collisions on a slowing-down\
  \ time $\\tau_s \\propto T_e^{3/2} / n_e$. In integrated transport modeling this\
  \ tendency appears as the time-advance term in the fast-ion continuity equation,\
  \ balanced by volumetric source rates, radial transport losses, and thermalization\
  \ sinks. Typical fast-ion densities in high-power tokamak discharges are $10^{17}$\u2013\
  $10^{19}$ m$^{-3}$, and transient changes during NBI blip experiments can produce\
  \ tendencies of order $10^{18}$\u2013$10^{20}$ m$^{-3}$ s$^{-1}$. The quantity is\
  \ summed over charge states when multiple states are present. See `ion_number_density`\
  \ for the total ion density and `co_passing_fast_particle_energy_source` for the\
  \ energy input channel."
