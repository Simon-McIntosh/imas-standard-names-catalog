- name: vertical_magnetization_of_ferritic_element
  kind: scalar
  status: active
  description: "Signed vertical component of the effective magnetization vector assigned\
    \ to a ferritic element in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Vertical magnetization of a ferritic element is the signed projection
    of its assigned effective magnetization vector onto the vertical direction in
    the right-handed cylindrical $(R, \phi, Z)$ frame.


    The defining projection is:


    $$

    M_Z^{\mathrm{eff}} = \mathbf{M}^{\mathrm{eff}} \cdot \hat{\mathbf{Z}}

    $$


    where $M_Z^{\mathrm{eff}}$ is the vertical magnetization component, $\mathbf{M}^{\mathrm{eff}}$
    is the effective magnetization vector assigned to the ferritic element, and $\hat{\mathbf{Z}}$
    is the unit vector toward increasing vertical height. The corresponding radial
    projection is [radial magnetization of a ferritic element](name:radial_magnetization_of_ferritic_element);
    neither quantity is the magnetic field at the element centroid, such as the [vertical
    magnetic field at a ferritic element centroid](name:vertical_magnetic_field_at_ferritic_element_centroid).


    Sign convention: Positive when the effective magnetization vector has a component
    toward increasing vertical height $Z$.'
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetization_of_ferritic_element
  - name:vertical_magnetic_field_at_ferritic_element_centroid
  sources:
