- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: active
  description: Signed Z coordinate of the magnetic axis, the interior poloidal-flux
    extremum around which nested magnetic flux surfaces are organized.
  documentation: 'This quantity is the signed vertical coordinate of the magnetic
    axis in an equilibrium. The magnetic axis is the O-point of the nested poloidal-flux
    surfaces, located at an interior extremum of poloidal magnetic flux in the poloidal
    cross-section.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, it is defined by


    $$

    Z_{\rm axis}=Z(\mathbf{x}_{\rm axis}), \qquad \nabla_{R,Z}\psi(\mathbf{x}_{\rm
    axis})=\mathbf{0}

    $$


    where $\mathbf{x}_{\rm axis}$ is the magnetic-axis position, $R$ is major radius,
    $\phi$ is toroidal angle, $Z$ is vertical height, and $\psi$ is poloidal magnetic
    flux. The gradient is taken in the poloidal $(R,Z)$ plane.


    This coordinate refers to the magnetic-axis O-point, not the separatrix X-point
    described by the [vertical coordinate of the X-point](name:vertical_coordinate_of_x_point).


    Sign convention: Positive when the magnetic axis lies above the $Z=0$ reference
    plane in the direction of increasing $Z$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_x_point
  sources:
  - dd_path: distribution_sources/magnetic_axis/z
    dd_version: 4.1.0
