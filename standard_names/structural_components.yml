- name: blanket_neutron_energy_multiplication
  kind: scalar
  status: draft
  description: Ratio of total nuclear energy deposited in the breeding blanket to
    the incident fusion neutron kinetic energy, quantifying the blanket's capacity
    to amplify energy through exothermic nuclear reactions.
  documentation: "The blanket neutron energy multiplication $M$ is defined as\n\n\
    $$M = \\frac{E_{\\rm total}}{E_n}$$\n\nwhere $E_{\\rm total}$ is the total nuclear\
    \ energy (including neutron scattering, capture, and fission reactions) deposited\
    \ per source neutron in the blanket, and $E_n \\approx 14.1\\;\\text{MeV}$ is\
    \ the kinetic energy carried by the fusion neutron from the D-T reaction. The\
    \ principal exothermic reaction contributing to $M > 1$ is the $^6\\text{Li}(n,\\\
    alpha)\\text{T}$ breeding reaction (releasing 4.8 MeV), alongside beryllium and\
    \ lead neutron multipliers ($^9\\text{Be}(n,2n)$ and $^{208}\\text{Pb}(n,2n)$)\
    \ that generate additional neutrons to drive further reactions. Typical design\
    \ targets for fusion power plants lie in the range $M \\approx 1.1$\u2013$1.3$;\
    \ achieving values above 1.1 is necessary for net energy gain in the blanket subsystem.\
    \ $M$ is computed via Monte Carlo neutronics codes such as OpenMC or MCNP, using\
    \ detailed nuclear cross-section libraries and a three-dimensional blanket geometry\
    \ model. It is a key blanket performance figure of merit alongside the [tritium\
    \ breeding ratio](name:tritium_breeding_ratio), which counts tritium atoms produced\
    \ per absorbed neutron; the two metrics must be jointly optimized since many multiplier\
    \ materials affect both quantities. Blanket layer dimensions, such as [layer_midplane_thickness](name:layer_midplane_thickness),\
    \ directly influence $M$ by setting the neutron path length through each material\
    \ zone."
  unit: '1'
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio
  - name:layer_midplane_thickness
  constraints: []
  sources:
  - id: dd:breeding_blanket/time_slice/energy_multiplication_factor
    dd_path: breeding_blanket/time_slice/energy_multiplication_factor
    status: composed
- name: bottom_cap_thickness
  kind: scalar
  status: draft
  description: Poloidal thickness of the bottom cap of a breeding blanket module,
    defined as the non-negative distance between the inner and outer bounding surfaces
    of the cap along the poloidal (axial) direction.
  documentation: 'The bottom cap thickness is the perpendicular distance between the
    two bounding surfaces of the bottom cap of a breeding blanket module, measured
    along the poloidal direction. This is a non-negative scalar quantity by definition:
    $t_{\mathrm{bottom}} \geq 0$.


    Geometrically, the bottom cap closes the lower axial end of the module assembly.
    Its thickness $t_{\mathrm{bottom}}$ is the distance from the innermost surface
    (facing the breeding zone) to the outermost structural surface along the poloidal
    axis.


    Typical values for breeding blanket module bottom caps range from approximately
    $0.02\,\mathrm{m}$ to $0.15\,\mathrm{m}$, depending on the blanket concept, structural
    material, and required neutron shielding margin. Thicker caps reduce the local
    neutron flux leakage through the module end and improve thermal performance by
    providing additional structural mass, but also reduce the available breeding volume.


    This quantity is used in module-level geometry descriptions and feeds directly
    into neutron transport and thermal-hydraulic analyzes of the blanket system.'
  unit: m
  physics_domain: structural_components
  links:
  - name:midplane_thickness_of_breeding_blanket_layer
  - name:side_wall_thickness_of_breeding_blanket_module
  - name:top_cap_thickness
  - name:tritium_breeding_ratio
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/bottom_cap_thickness
    dd_path: breeding_blanket/module/bottom_cap_thickness
    status: composed
- name: breeding_blanket_module_count
  kind: scalar
  status: draft
  description: Total count of breeding blanket modules installed around the plasma,
    segmenting the blanket toroidally and poloidally to form the complete blanket
    assembly.
  documentation: 'The breeding blanket module count $N_{\mathrm{total}}$ is a non-negative
    integer giving the total number of discrete blanket modules that together form
    the breeding blanket surrounding the plasma. Each module is a self-contained structural
    and tritium-breeding unit; the full set of modules spans the available toroidal
    and poloidal coverage of the first wall.


    For symmetric reactor designs, $N_{\mathrm{total}}$ is approximately related to
    the number of toroidal sectors $N_{\phi}$ and the number of poloidal modules per
    sector $N_{\theta}$ by


    $$N_{\mathrm{total}} \approx N_{\phi} \cdot N_{\theta},$$


    where $N_{\phi}$ is the number of toroidal sectors (each spanning $2\pi / N_{\phi}$
    radians in the toroidal angle $\phi$ of the cylindrical $(R, \phi, Z)$ frame)
    and $N_{\theta}$ is the poloidal module count per sector. This product relation
    is only approximate in practice: port cutouts, maintenance bays, asymmetric sector
    layouts, or partial-coverage segments may reduce the installed module count below
    the fully symmetric value.


    This quantity counts physically installed (or modeled as installed) discrete modules;
    partially covering or dummy modules should be documented in associated metadata.
    Typical values range from $O(10)$ for simplified models to several hundred for
    full-scale reactor designs such as DEMO or fusion power plant concepts.


    See also: `breeding_blanket_module_poloidal_count` for the poloidal segmentation
    per sector, and `breeding_blanket_module_toroidal_count` for the number of toroidal
    sectors.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:breeding_blanket_module_poloidal_count
  - name:tritium_breeding_ratio
  - name:midplane_thickness_of_breeding_blanket_layer
  - name:top_cap_thickness
  constraints: []
  sources:
  - id: dd:breeding_blanket/modules_n
    dd_path: breeding_blanket/modules_n
    status: composed
- name: breeding_blanket_module_poloidal_count
  kind: scalar
  status: draft
  description: Integer count of breeding blanket modules arranged within a single
    full 360-degree poloidal cross-section of the reactor. This dimensionless positive
    integer defines the poloidal segmentation of the blanket assembly and is set during
    engineering design.
  documentation: "The poloidal module count $N_\\mathrm{pol}$ is the number of discrete\
    \ breeding blanket modules distributed along the poloidal direction within one\
    \ complete 360\xB0 poloidal cross-section of the reactor. It is a design integer\
    \ that characterizes the poloidal segmentation of the blanket assembly independently\
    \ of the toroidal layout.\n\nThe total number of blanket modules surrounding the\
    \ plasma is related by $N_\\mathrm{total} = N_\\mathrm{pol} \\times N_\\mathrm{tor}$,\
    \ where $N_\\mathrm{tor}$ is the number of toroidal sectors; this defining relation\
    \ is documented in [breeding_blanket_module_count](name:breeding_blanket_module_count).\
    \ However, $N_\\mathrm{pol}$ is defined per poloidal cross-section and does not\
    \ presuppose toroidal symmetry \u2014 in asymmetric or sector-varying configurations\
    \ the poloidal count may differ between sectors, in which case this quantity captures\
    \ the count for a representative or specified cross-section.\n\nTypical values\
    \ range from 5 to 20 modules per poloidal cross-section. Compact pilot-plant designs\
    \ tend toward fewer, larger modules to simplify remote maintenance, while DEMO-class\
    \ reactors may require finer poloidal subdivision to satisfy structural, thermal,\
    \ and neutronics constraints. The poloidal count directly influences shielding\
    \ adequacy (governed by module dimensions such as those in [top_cap_thickness](name:top_cap_thickness)\
    \ and [bottom_cap_thickness](name:bottom_cap_thickness)), tritium breeding ratio\
    \ estimates, and maintenance port access planning.\n\nThis quantity is always\
    \ a non-negative integer; a value of zero is physically meaningless and indicates\
    \ an uninitialized or invalid entry."
  unit: '1'
  physics_domain: structural_components
  links:
  - name:breeding_blanket_module_count
  - name:top_cap_thickness
  - name:bottom_cap_thickness
  - name:tritium_breeding_ratio
  constraints: []
  sources:
  - id: dd:breeding_blanket/modules_pol_n
    dd_path: breeding_blanket/modules_pol_n
    status: composed
- name: coolant_temperature_at_inlet
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the inlet of a breeding blanket
    module cooling circuit, setting the thermal boundary condition for the blanket
    heat-removal analysis.
  documentation: "The inlet coolant temperature $T_{\\rm in}$ is the bulk fluid temperature\
    \ at the entry point of the cooling circuit supplying a breeding blanket module.\
    \ Together with the complementary [outlet temperature](name:coolant_temperature_at_outlet),\
    \ it determines the coolant temperature rise $\\Delta T = T_{\\rm out} - T_{\\\
    rm in}$ and, combined with the mass flow rate $\\dot{m}$ and specific heat capacity\
    \ $c_p$, gives the total heat extracted: $Q = \\dot{m}\\,c_p\\,\\Delta T$, where\
    \ $Q$ is in watts, $\\dot{m}$ in kg s$^{-1}$, and $c_p$ in J kg$^{-1}$ K$^{-1}$.\
    \ For water-cooled blanket designs, typical inlet values range from 285\u2013\
    330 K; helium-cooled concepts operate at 573\u2013773 K at the inlet. The quantity\
    \ is measured by in-line resistance temperature detectors (RTDs) or thermocouples\
    \ installed on the inlet manifold, and is also prescribed as a boundary condition\
    \ in thermal-hydraulic simulations of blanket cooling performance. It forms a\
    \ key constraint on tritium breeding zone structural integrity and material compatibility\
    \ assessments."
  unit: K
  physics_domain: structural_components
  links:
  - name:coolant_temperature_at_outlet
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_inlet
    status: composed
- name: coolant_temperature_at_outlet
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the outlet of a breeding blanket
    module cooling circuit, reflecting the thermal energy extracted from the blanket
    during operation.
  documentation: "The outlet coolant temperature $T_{\\rm out}$ marks the end-state\
    \ of the heat-removal process within a breeding blanket cooling circuit, where\
    \ the coolant has absorbed thermal energy deposited by neutron heating, gamma\
    \ radiation, and surface heat flux from the plasma. The temperature rise $\\Delta\
    \ T = T_{\\rm out} - T_{\\rm in}$ across the circuit, combined with the mass flow\
    \ rate $\\dot{m}$ and specific heat capacity $c_p$ of the coolant, determines\
    \ the total extracted thermal power via $P = \\dot{m} c_p \\Delta T$, where $T_{\\\
    rm in}$ is the [coolant temperature at inlet](name:coolant_temperature_at_inlet).\
    \ Typical outlet temperatures range from 320 K to 770 K depending on the coolant\
    \ medium \u2014 pressurized water, helium, or liquid lithium-lead alloy \u2014\
    \ and the operating regime; these values set material compatibility limits and\
    \ thermodynamic cycle efficiency. $T_{\\rm out}$ is measured by calibrated thermocouples\
    \ or resistance temperature detectors placed at the cooling-circuit exit manifold,\
    \ and is a primary monitor quantity for blanket thermal performance. The inlet\u2013\
    outlet temperature difference is also used to validate computational thermal-hydraulic\
    \ models of blanket modules."
  unit: K
  physics_domain: structural_components
  links:
  - name:coolant_temperature_at_inlet
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_outlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_outlet
    status: composed
- name: electrical_resistivity_of_structural_element
  kind: scalar
  status: draft
  description: Electrical resistivity of a discrete structural element, characterizing
    the intrinsic opposition of the constituent material to electric current flow.
    For an isotropic material it relates the local electric field to current density
    via the constitutive relation E = rho * J. This is a bulk or homogenized material
    property assigned to the element, not a circuit or geometric resistance.
  documentation: 'The electrical resistivity $\rho$ of a structural element quantifies
    how strongly the element''s material opposes the flow of electric current. For
    an isotropic, homogeneous material the constitutive relation is


    $$\mathbf{E} = \rho\,\mathbf{J},$$


    where $\mathbf{E}$ (V m$^{-1}$) is the electric field and $\mathbf{J}$ (A m$^{-2}$)
    is the current density. In the general anisotropic case $\rho$ becomes a rank-2
    tensor $\overleftrightarrow{\rho}$; the present standard name carries the scalar
    (isotropic) value appropriate for structural elements whose material response
    does not distinguish direction.


    The value may represent either the intrinsic bulk resistivity of a uniform material
    or an effective homogenized resistivity derived from the detailed microstructure
    of a composite or laminated element. Which interpretation applies must be documented
    at the dataset level.


    **Typical values:**

    - Copper (cryogenic, ~4 K): $\sim 2\times10^{-10}$ $\Omega\,\mathrm{m}$

    - Stainless steel (room temperature): $\sim 7\times10^{-7}$ $\Omega\,\mathrm{m}$

    - Inconel / superalloys: $\sim 1\times10^{-6}$ $\Omega\,\mathrm{m}$

    - Insulating materials: $\gg 1$ $\Omega\,\mathrm{m}$


    Resistivity enters directly into eddy-current and electromagnetic induction analyzes
    (e.g., halo-current distribution, disruption force calculations) and is a key
    parameter in circuit-model representations of passive conducting structures such
    as the cryostat vessel, thermal shields, and vacuum vessel segments.


    The inverse of resistivity is the electrical conductivity $\sigma = 1/\rho$ (S
    m$^{-1}$). Both are intrinsic material properties, independent of the geometry
    of the element; the corresponding geometry-dependent quantity is the resistance.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistance_of_structural_element
  constraints: []
  sources:
  - id: dd:cryostat/description_2d/cryostat/unit/annular/resistivity
    dd_path: cryostat/description_2d/cryostat/unit/annular/resistivity
    status: composed
  - id: dd:cryostat/description_2d/cryostat/unit/element/resistivity
    dd_path: cryostat/description_2d/cryostat/unit/element/resistivity
    status: attached
  - id: dd:cryostat/description_2d/thermal_shield/unit/annular/resistivity
    dd_path: cryostat/description_2d/thermal_shield/unit/annular/resistivity
    status: composed
  - id: dd:cryostat/description_2d/thermal_shield/unit/element/resistivity
    dd_path: cryostat/description_2d/thermal_shield/unit/element/resistivity
    status: composed
- name: extracted_thermal_power_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Total thermal power removed from a breeding blanket module by the coolant
    system, encompassing nuclear heating from neutron and gamma interactions plus
    any radiative contributions.
  documentation: "The extracted thermal power $P_{\\rm th}$ of a breeding blanket\
    \ module is the net rate at which thermal energy is carried away by the coolant\
    \ circuit, integrating all volumetric heat sources within the module. These sources\
    \ include neutron-induced nuclear heating \u2014 captured in [neutron_thermal_power_of_breeding_blanket_module](name:neutron_thermal_power_of_breeding_blanket_module)\
    \ \u2014 and surface radiative loading quantified by [incident_radiated_power_of_breeding_blanket_module](name:incident_radiated_power_of_breeding_blanket_module).\
    \ In steady state the extracted power equals the sum of all deposited powers minus\
    \ any parasitic losses (e.g. activation decay heat stored in the structure), so\
    \ $P_{\\rm th} = P_{\\rm nuclear} + P_{\\rm rad} - P_{\\rm loss}$, where all terms\
    \ are in W. For a full-scale tokamak reactor module, typical values range from\
    \ tens to hundreds of MW depending on neutron wall loading and module geometry;\
    \ in present test-blanket-module experiments values are on the order of 1\u2013\
    10 MW. The quantity is evaluated from coolant enthalpy rise: $P_{\\rm th} = \\\
    dot{m} c_p (T_{\\rm out} - T_{\\rm in})$, where $\\dot{m}$ is the coolant mass\
    \ flow rate, $c_p$ is the specific heat capacity, $T_{\\rm out}$ and $T_{\\rm\
    \ in}$ are the [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet)\
    \ and [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet) respectively.\
    \ It feeds directly into balance-of-plant energy accounting and determines the\
    \ thermal efficiency of the blanket heat-exchange loop, complementing the overall\
    \ [thermal_power_load_of_breeding_blanket](name:thermal_power_load_of_breeding_blanket)."
  unit: W
  physics_domain: structural_components
  links:
  - name:neutron_thermal_power_of_breeding_blanket_module
  - name:incident_radiated_power_of_breeding_blanket_module
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
  - name:thermal_power_load_of_breeding_blanket
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_extracted
    dd_path: breeding_blanket/module/time_slice/power_thermal_extracted
    status: composed
- name: major_radius_of_annular_centerline
  kind: scalar
  status: draft
  description: Cylindrical radial coordinate R of the centerline path of an annular
    structural unit, giving the non-negative perpendicular distance from the machine
    symmetry axis to each point along the path, measured in meters.
  documentation: 'The major radius $R$ of the annular centerline is the cylindrical
    radial coordinate of each point along the nominal mid-surface path of an annular
    structural unit, evaluated in the right-handed cylindrical $(R, \phi, Z)$ frame
    where $R$ is the radial coordinate (major radius), $\phi$ is the toroidal angle,
    and $Z$ is the vertical height.


    The centerline path is defined as the ordered sequence of $(R_i, Z_i)$ coordinate
    pairs that parameterize the poloidal cross-section of the nominal mid-surface
    between the inner and outer boundaries of the annular component. Each pair $(R_i,
    Z_i)$ specifies one discrete node of this contour, with $R_i \geq 0$ by the geometric
    definition of the cylindrical radial coordinate.


    Together with the companion vertical coordinate [vertical_coordinate_of_annular_centerline](name:vertical_coordinate_of_annular_centerline),
    the $R$ values fully define the 2-D poloidal outline of the centerline. The centerline
    lies between the contours described by [major_radius_of_annular_inner_outline_point](name:major_radius_of_annular_inner_outline_point)
    and [major_radius_of_annular_outer_outline_point](name:major_radius_of_annular_outer_outline_point).


    For tokamak cryostat and thermal shield annular structures, typical $R$ values
    range from approximately 2 m to 12 m depending on machine size and radial extent
    of the component.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_coordinate_of_annular_centerline
  - name:major_radius_of_annular_inner_outline_point
  - name:major_radius_of_annular_outer_outline_point
  constraints: []
  sources:
  - id: dd:cryostat/description_2d/cryostat/unit/annular/centreline/r
    dd_path: cryostat/description_2d/cryostat/unit/annular/centreline/r
    status: composed
  - id: dd:cryostat/description_2d/thermal_shield/unit/annular/centreline/r
    dd_path: cryostat/description_2d/thermal_shield/unit/annular/centreline/r
    status: composed
- name: major_radius_of_annular_outer_outline_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a point on the outer outline contour
    of an annular structural unit, defined in the right-handed cylindrical $(R, \phi,
    Z)$ frame where $R$ is measured from the machine symmetry axis.
  documentation: 'The major radius $R$ of a point on the outer outline contour of
    an annular structural unit (such as a cryostat thermal shield) locates the radially
    outermost boundary cross-section of that unit within the poloidal plane. Together
    with the companion vertical coordinate [vertical coordinate of annular outer outline
    point](name:vertical_coordinate_of_annular_outer_outline_point), it fully specifies
    the 2D shape of the outer boundary in the $(R, \phi, Z)$ cylindrical frame. The
    outer outline contrasts with the inner boundary described by [major radius of
    annular inner outline point](name:major_radius_of_annular_inner_outline_point),
    and the two together define the annular cross-sectional thickness; the radial
    mid-surface position is captured by [major radius of annular centerline](name:major_radius_of_annular_centerline).
    Typical values for thermal shield outer outlines in medium-to-large tokamaks range
    from approximately 2 m to 10 m depending on machine size. The coordinate is obtained
    from engineering design drawings or 2D CAD models of the structural component.


    Sign convention: Positive when $R$ is measured outward from the machine symmetry
    axis, i.e. $R > 0$ for all physical points in the cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_coordinate_of_annular_outer_outline_point
  - name:major_radius_of_annular_inner_outline_point
  - name:major_radius_of_annular_centerline
  constraints: []
  sources:
  - id: dd:cryostat/description_2d/cryostat/unit/annular/outline_outer/r
    dd_path: cryostat/description_2d/cryostat/unit/annular/outline_outer/r
