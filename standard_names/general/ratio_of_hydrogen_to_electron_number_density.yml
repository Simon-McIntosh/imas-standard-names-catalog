name: ratio_of_hydrogen_to_electron_number_density
status: draft
cocos_transformation_type: one_like
description: Dimensionless ratio $n_H / n_e$ of total hydrogen ion number density
  to electron number density in the plasma.
documentation: The ratio $n_H / n_e$ quantifies the fraction of the electron population
  that is charge-balanced by hydrogen ions (all charge states combined), where $n_H$
  is the hydrogen ion number density (in m$^{-3}$) and $n_e$ is the electron number
  density (in m$^{-3}$). In a pure hydrogen plasma this ratio equals unity; the presence
  of impurities or multiple hydrogenic isotopes reduces it below 1, making it a direct
  indicator of effective plasma dilution. This quantity is inferred from charge-exchange
  recombination spectroscopy, visible bremsstrahlung analysis, or integrated modeling
  codes that solve the coupled particle-balance equations. Typical values range from
  0.7 to 1.0 in low-impurity tokamak discharges. See also `ratio_of_hydrogen_to_deuterium_number_density`
  for the isotopic mix and `electron_number_density` for the denominator quantity.
