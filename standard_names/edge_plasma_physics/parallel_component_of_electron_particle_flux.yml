name: parallel_component_of_electron_particle_flux
status: draft
description: Projection of the electron particle flux vector onto the direction parallel
  to the local magnetic field.
documentation: "The parallel electron particle flux $\\Gamma_{e,\\parallel} = n_e\
  \ v_{e,\\parallel}$ quantifies the rate of electron transport per unit area along\
  \ the magnetic field line, where $n_e$ is the electron number density (m$^{-3}$)\
  \ and $v_{e,\\parallel}$ is the electron parallel velocity (m/s). In edge plasmas\
  \ this quantity governs the particle balance at divertor targets and is a key ingredient\
  \ for sheath boundary conditions; typical magnitudes are $10^{21}$\u2013$10^{23}$\
  \ m$^{-2}$s$^{-1}$ in detached versus attached divertor regimes. It is computed\
  \ from kinetic or fluid transport models (SOLPS-ITER, SOLEDGE2D, EMC3-EIRENE) and\
  \ can be inferred from Langmuir probe measurements of ion saturation current combined\
  \ with Bohm sheath theory. See also `ion_energy_flux` for the energy transport counterpart."
