- name: cold_neutral_fraction
  kind: scalar
  status: active
  description: Dimensionless fraction of the cold recycled component of a hydrogen-isotope
    neutral population relative to the total neutral atom population.
  documentation: 'The cold neutral fraction is a dimensionless ratio bounded in $[0,
    1]$ expressing the relative abundance of the cold, low-energy recycled component
    of a hydrogen-isotope neutral population. It is a component of the broader [neutral
    fraction](name:ratio_of_neutral_state_density_to_total_hydrogenic_density), distinct
    from the hot charge-exchange-born component.


    The fraction is defined as:


    $$

    f_{\mathrm{cold}} = \frac{n_{\mathrm{cold}}}{n_{\mathrm{cold}} + n_{\mathrm{hot}}}

    $$


    where $f_{\mathrm{cold}}$ is the cold neutral fraction, $n_{\mathrm{cold}}$ is
    the number density of cold recycled neutral atoms, and $n_{\mathrm{hot}}$ is the
    number density of hot charge-exchange-born neutral atoms.


    The quantity applies to a specified hydrogen isotope and uses the two-component
    neutral-population model. Its denominator is the total neutral population formed
    by the cold and hot components for that isotope; it is not summed across different
    isotopes and does not represent the hot component itself.


    Within this model, the cold and hot fractions are complementary and sum to unity.
    The [hot neutral fraction](name:hot_neutral_fraction) gives the corresponding
    charge-exchange-born component, with the energy threshold separating the two components
    defined by the applicable population model.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_fraction
  sources:
  - dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-isotope_ratios-isotope-cold_neutrals_fraction
    dd_documentation:
      leaf: Fraction of cold neutrals for this isotope (n_cold_neutrals/(n_cold_neutrals+n_hot_neutrals))
      parent_path: spectrometer_visible/channel/isotope_ratios/isotope
      parent: Set of isotopes
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/isotope/time
    enhanced_context:
      description: Fraction of cold neutrals for a given hydrogen isotope, defined
        as n_cold/(n_cold + n_hot). Quantifies the relative population of cold (low-energy)
        neutrals compared to the total neutral population of that isotope from visible
        spectroscopy.
      kind: llm
- name: etendue_of_hard_xray_detector
  kind: scalar
  status: active
  description: "Geometric optical throughput of a hard X-ray detector\u2019s optical\
    \ system, determined by its effective collecting area and accepted solid angle."
  documentation: "\xC9tendue is the geometric throughput of the optical system associated\
    \ with a hard X-ray detector. It characterizes the angular and spatial acceptance\
    \ that determines how incident radiation is coupled into the detector.\n\nThe\
    \ defining relation is\n\n$$\nG = A\\Omega\n$$\n\nwhere $G$ is the detector \xE9\
    tendue, $A$ is the effective collecting area, and $\\Omega$ is the accepted solid\
    \ angle.\n\nThis quantity applies to the detector-level optical system and uses\
    \ effective area and angular acceptance for the associated detector; it does not\
    \ specify whether those properties arise from one or multiple optical elements.\
    \ It is distinct from the detector\u2019s linear dimensions, such as its [height](name:height_of_hard_xray_detector)\
    \ and width, which do not determine optical throughput alone.\n\n\xC9tendue provides\
    \ the geometric factor relating incident [hard X-ray brightness](name:hard_xray_brightness)\
    \ to radiation coupled into the detector and is the same physical optical-throughput\
    \ concept represented by [etendue_of_spectrometer](name:etendue_of_spectrometer),\
    \ with the owning optical system changed from a spectrometer to a hard X-ray detector."
  unit: m^2.sr
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  sources:
  - dd_path: hard_x_rays/channel/etendue
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/hard_x_rays.html#hard_x_rays-channel-etendue
    dd_documentation:
      leaf: Etendue (geometric extent) of the channel's optical system
      parent_path: hard_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: FLT_0D
      unit: m^2.sr
    enhanced_context:
      description: "\xC9tendue (geometric extent, A\u03A9) of a hard X-ray detector\
        \ channel's optical system, quantifying the product of detector area and solid\
        \ angle subtended. Used for absolute calibration of photon flux measurements."
      kind: llm
- name: etendue_of_spectrometer_channel
  kind: scalar
  status: active
  description: Optical phase-space acceptance of a radiation-collection system, determined
    by effective collecting area and accepted ray directions and optionally weighted
    by spectral response.
  documentation: "Optical \xE9tendue is the geometric phase-space acceptance of a\
    \ radiation-collection system. It describes how the collecting area and range\
    \ of accepted ray directions jointly determine the system's throughput for radiation\
    \ from an observed source.\n\nFor an effective area and accepted solid angle,\
    \ the \xE9tendue $G$ is defined by:\n\n$$\nG = A_{\\mathrm{eff}}\\Omega_{\\mathrm{eff}}\n\
    $$\n\nwhere $G$ is the optical \xE9tendue, $A_{\\mathrm{eff}}$ is the effective\
    \ collecting area, and $\\Omega_{\\mathrm{eff}}$ is the accepted solid angle.\n\
    \nThe quantity applies to radiation entering an optical collection system from\
    \ a plasma or other observed source and aggregates acceptance over the collecting\
    \ area and accepted ray directions. It is non-negative and does not itself represent\
    \ radiance, collected power, detector signal, or spectral intensity. The [spectral\
    \ \xE9tendue of a spectrometer channel](name:spectral_etendue_of_spectrometer_channel)\
    \ is a narrower response-weighted form in which the optical acceptance is weighted\
    \ by the channel's wavelength response, while [\xE9tendue of a spectrometer](name:etendue_of_spectrometer)\
    \ represents the corresponding unweighted spectrometer-level acceptance."
  unit: m^2.sr
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: soft_x_rays/channel/etendue
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-etendue
    dd_documentation:
      leaf: Etendue (geometric extent) of the channel's optical system
      parent_path: soft_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: FLT_0D
      unit: m^2.sr
    enhanced_context:
      description: "\xC9tendue (geometric extent, A\u03A9) of a soft X-ray diagnostic\
        \ channel's optical system. Characterizes the product of detector area and\
        \ solid angle, determining the channel's geometric sensitivity to plasma emission."
      kind: llm
- name: hard_xray_brightness
  kind: scalar
  status: active
  description: Band-integrated hard X-ray photon radiance received by a channel, normalized
    by projected collecting area and accepted solid angle.
  documentation: 'Hard X-ray brightness is the photon radiance received from a viewing
    direction by a channel. It represents photon arrival rate with the photon-energy
    dependence integrated over the selected hard X-ray band.


    The band-integrated photon radiance is defined by


    $$

    B_{\mathrm{HX}} = \frac{dN_\gamma}{dt\,dA_{\mathrm{proj}}\,d\Omega}

    $$


    where $B_{\mathrm{HX}}$ is the hard X-ray brightness, $N_\gamma$ is the number
    of received photons in the selected energy band, $t$ is time, $A_{\mathrm{proj}}$
    is projected collecting area, and $\Omega$ is accepted solid angle.


    This quantity applies to hard X-ray photons received by a channel and is evaluated
    separately for each selected energy band. Its aggregation convention is integration
    over photon energy within that band while retaining normalization by projected
    area and solid angle. It is a received radiometric quantity, not a local volumetric
    source term, and it counts photons rather than their deposited or carried energy.


    The local production counterpart is [hard X-ray emissivity](name:hard_xray_emissivity),
    which describes photon generation per unit volume and solid angle before propagation
    to the channel. Integrating this brightness over the collecting geometry represented
    by the [etendue of a hard X-ray detector](name:etendue_of_hard_xray_detector)
    gives the received photon rate under the corresponding angular and area acceptance.
    Unlike [incident soft X-ray radiance](name:incident_soft_xray_radiance), which
    is energy-weighted, this quantity is photon-count radiance; photon registration
    probability is a separate detector property described by [spectral efficiency
    of a hard X-ray detector](name:spectral_efficiency_of_hard_xray_detector).'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_emissivity
  - name:etendue_of_hard_xray_detector
  - name:incident_soft_xray_radiance
  sources:
  - dd_path: hard_x_rays/channel/radiance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/hard_x_rays.html#hard_x_rays-channel-radiance
    dd_documentation:
      leaf: Photons received by the detector per unit time, per unit solid angle and
        per unit area (i.e. photon flux divided by the etendue), in multiple energy
        bands if available from the detector
      parent_path: hard_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: STRUCTURE
      unit: s^-1.m^-2.sr^-1
    enhanced_context:
      description: "Hard X-ray channel radiance defined as photon flux per unit solid\
        \ angle per unit area (photon flux divided by \xE9tendue), resolved across\
        \ multiple energy bands. Used for absolute calibration of bremsstrahlung emission\
        \ from suprathermal electrons."
      kind: llm
- name: hard_xray_emissivity
  kind: scalar
  status: active
  description: Local production rate of hard-X-ray bremsstrahlung photons per plasma
    volume and emission solid angle, integrated over a specified photon-energy band.
  documentation: 'Hard-X-ray emissivity is the local bremsstrahlung photon production
    rate per plasma volume and emission solid angle, integrated over the selected
    hard-X-ray photon-energy band. It represents emission from suprathermal electrons
    at a physical location and in a specified emission direction.


    The band-integrated emissivity is defined by


    $$

    \varepsilon_{\mathrm{HXR}}(\mathbf{r},\Omega;E_1,E_2)=\int_{E_1}^{E_2}\varepsilon_{\mathrm{HXR}}^{(E)}(\mathbf{r},\Omega,E)\,\mathrm{d}E

    $$


    where $\varepsilon_{\mathrm{HXR}}$ is the band-integrated hard-X-ray photon emissivity,
    $\varepsilon_{\mathrm{HXR}}^{(E)}$ is the differential photon emissivity with
    respect to photon energy, $\mathbf{r}$ is the emission location, $\Omega$ is the
    emission direction labeled by solid angle, $E$ is photon energy, and $E_1$ and
    $E_2$ are the lower and upper limits of the selected energy band.


    This quantity is local and directional: it is not integrated along a line of sight,
    over a plasma volume, or over emission directions. It applies to hard-X-ray photons
    produced by suprathermal-electron bremsstrahlung and excludes the total bremsstrahlung
    electromagnetic power and detector-received radiation.


    In an optically thin plasma, [hard X-ray brightness](name:hard_xray_brightness)
    is obtained from the corresponding local emissivity by propagation and integration
    along a viewing path; brightness is therefore a received radiance, whereas this
    quantity is the local photon source density.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  sources:
  - dd_path: hard_x_rays/emissivity_profile_1d/emissivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/hard_x_rays.html#hard_x_rays-emissivity_profile_1d-emissivity
    dd_documentation:
