name: plasma_current_due_to_runaway_electrons
status: draft
description: Toroidal plasma current carried by relativistic runaway electrons accelerated
  beyond the critical electric field.
documentation: "The runaway electron current $I_{\\rm RE}$ is the portion of the total\
  \ toroidal plasma current $I_p$ carried by electrons that have been accelerated\
  \ to relativistic energies by the parallel electric field $E_\\parallel$ exceeding\
  \ the Dreicer critical field $E_D = n_e e^3 \\ln\\Lambda / (4\\pi \\varepsilon_0^2\
  \ m_e c^2)$, where $n_e$ is the electron number density, $e$ the elementary charge,\
  \ $\\ln\\Lambda$ the Coulomb logarithm, $\\varepsilon_0$ the permittivity of free\
  \ space, $m_e$ the electron mass, and $c$ the speed of light. Runaway currents are\
  \ particularly dangerous during disruptions, where rapid thermal quench and current\
  \ quench phases can convert a substantial fraction of $I_p$ (up to 50\u201370% in\
  \ large tokamaks) into $I_{\\rm RE}$, with magnitudes reaching several MA. Diagnostics\
  \ include hard X-ray cameras, synchrotron radiation imaging, and neutron detectors;\
  \ the current magnitude is typically inferred from equilibrium reconstruction or\
  \ directly from magnetic measurements after the thermal current has decayed. See\
  \ also `plasma_current` for the total toroidal current and `scrape_off_layer_radiated_power`\
  \ for the radiated losses accompanying runaway events."
