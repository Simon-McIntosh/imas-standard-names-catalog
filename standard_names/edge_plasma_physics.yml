    last closed magnetic flux surface. This local value is distinct from the flux-surface
    average [toroidal_flux_surface_averaged_xenon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_xenon_velocity_at_plasma_boundary).


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$.'
