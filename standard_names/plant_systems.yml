- name: source_rate_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron source rate delivered to the plasma
    vessel by gas injection systems, where each injected atom contributes Z equivalent
    electrons per second according to its atomic number.
  documentation: 'The source rate due to gas injection characterizes the instantaneous
    rate at which neutral gas is admitted to the plasma vessel by gas injection hardware,
    expressed as an equivalent-electron count rate. Every injected atom of atomic
    number $Z$ contributes $Z$ equivalent electrons per second to the total inventory
    rate, providing a unified accounting framework across species of differing nuclear
    charge.


    The defining relation for a single injected species is:


    $$

    \dot{S} = Z \cdot \dot{N}_{\mathrm{atoms}}

    $$


    where $\dot{N}_{\mathrm{atoms}}$ is the raw atomic delivery rate in atoms per
    second and $Z$ is the atomic number of the injected species. For simultaneous
    multi-species injection, contributions are summed over all active species.


    This rate is inferred from calibrated mass-flow controllers or upstream pressure-rise
    measurements on the gas supply plumbing. It is the instantaneous time derivative
    of the corresponding accumulated equivalent-electron inventories, such as [accumulated_argon_count](name:accumulated_argon_count)
    or [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection).
    The nearest-peer quantity gas_particle_source_rate_over_vessel_due_to_gas_injection
    provides the vessel-integrated analog expressed in raw gas-phase particles rather
    than equivalent electrons.


    Sign convention: Positive when gas is being delivered into the vessel at a nonzero
    rate, increasing the equivalent-electron particle inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:accumulated_hydrogen_count_due_to_gas_injection
- name: argon_source_rate_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron argon source rate delivered to the
    plasma vessel by gas injection systems, where each injected argon atom with Z
    = 18 contributes 18 equivalent-electron counts.
  documentation: 'The argon source rate due to gas injection characterizes the instantaneous
    rate at which neutral argon with atomic number $Z_{\mathrm{Ar}} = 18$ is admitted
    to the plasma vessel by gas injection hardware, expressed as an equivalent-electron
    count rate. The equivalent-electron convention counts each injected neutral argon
    atom as 18 equivalent electrons because neutral argon has 18 electrons; this is
    an inventory-accounting convention, not a statement about subsequent ionization
    or confinement.


    The defining relation for injected argon is:


    $$

    \dot{S}_{\mathrm{Ar}} = Z_{\mathrm{Ar}}\,\dot{N}_{\mathrm{Ar}} = 18\,\dot{N}_{\mathrm{Ar}}

    $$


    where $\dot{S}_{\mathrm{Ar}}$ is the argon equivalent-electron source rate, $\dot{N}_{\mathrm{Ar}}$
    is the raw argon-atom delivery rate in atoms per second, and $Z_{\mathrm{Ar}}
    = 18$ is the dimensionless atomic number of argon.


    This quantity is the argon-species member of [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection).
    It is the instantaneous time derivative of the corresponding accumulated equivalent-electron
    inventory [accumulated_argon_count](name:accumulated_argon_count), and differs
    from raw gas-particle source rates by the factor $Z_{\mathrm{Ar}}$.


    Sign convention: Positive when argon is delivered into the plasma vessel, increasing
    the equivalent-electron particle inventory.'
  unit: s^-1
  physics_domain: plant_systems
