- name: power_at_wall_due_to_conduction
  kind: scalar
  status: active
  description: Thermal power deposited on all plasma-facing wall and divertor surfaces
    by parallel electron and ion heat conduction along open scrape-off-layer magnetic
    field lines, excluding convective, radiative, and neutral-particle channels.
  documentation: 'The power at the wall due to conduction is the thermal energy deposited
    on all plasma-facing wall and divertor surfaces by electron and ion heat conduction
    along open scrape-off-layer magnetic field lines. It excludes convective particle
    enthalpy, absorbed radiation, and neutral-particle energy deposition.


    The defining surface integral is:


    $$

    P_{\mathrm{wall,cond}} = \int_{S_{\mathrm{wall}}} \left(\mathbf{q}_{e,\parallel}^{\mathrm{cond}}
    + \mathbf{q}_{i,\parallel}^{\mathrm{cond}}\right) \cdot \hat{\mathbf{n}}\,\mathrm{d}A

    $$


    where $P_{\mathrm{wall,cond}}$ is the deposited conductive power, $S_{\mathrm{wall}}$
    is the union of all plasma-facing wall and divertor surfaces, $\mathbf{q}_{e,\parallel}^{\mathrm{cond}}$
    and $\mathbf{q}_{i,\parallel}^{\mathrm{cond}}$ are the electron and ion conductive
    heat-flux vectors along open magnetic field lines, $\hat{\mathbf{n}}$ is the unit
    normal directed from the plasma toward the material, and $\mathrm{d}A$ is a surface-area
    element.


    This quantity is the all-wall member of [power due to conduction](name:power_due_to_conduction).
    Restricting the selected surfaces to all divertor targets gives [power of divertor
    due to conduction](name:power_of_divertor_due_to_conduction), while a single target
    contribution is represented by [power at divertor target due to conduction](name:power_at_divertor_target_due_to_conduction).'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_divertor_target_due_to_conduction
  - name:power_of_divertor_due_to_conduction
  - name:power_due_to_conduction
  - name:energy_flux_at_wall
  arguments:
  - name: power_due_to_conduction
    operator: wall
    operator_kind: locus
  sources:
