- name: accumulated_ammonia_count
  description: |-
    Cumulative post-breakdown inventory of ammonia molecules introduced into the
    plasma vessel, expressed as an equivalent-electron count with ten count
    units assigned to each neutral NH3 molecule.
  documentation: |-
    The accumulated ammonia count is the cumulative post-breakdown amount of NH3
    introduced into the plasma vessel, represented using an equivalent-electron
    accounting convention. It is the post-breakdown component of the total
    ammonia count, not a direct count of free plasma electrons.

    $$
    C_{\mathrm{NH_3}}^{\mathrm{acc}} = (Z_\mathrm{N}+3Z_\mathrm{H})N_{\mathrm{NH_3}}^{\mathrm{acc}} = 10N_{\mathrm{NH_3}}^{\mathrm{acc}}
    $$

    Here, $C_{\mathrm{NH_3}}^{\mathrm{acc}}$ is the accumulated
    equivalent-electron count, $N_{\mathrm{NH_3}}^{\mathrm{acc}}$ is the
    cumulative number of ammonia molecules introduced after plasma breakdown,
    and $Z_\mathrm{N}=7$ and $Z_\mathrm{H}=1$ are the atomic numbers of nitrogen
    and hydrogen. The quantity excludes ammonia introduced during prefill, which
    is represented by [ammonia prefill count](name:ammonia_prefill_count), and
    does not represent instantaneous injection rate, retained neutral inventory,
    ionization state, or actual free-electron content.
  unit: '1'

- name: accumulated_ammonia_deuterated_count
  description: |-
    Cumulative post-breakdown inventory of neutral deuterated ammonia (ND3),
    expressed as an equivalent-electron count with ten count units per molecule.
  documentation: |-
    This quantity is the cumulative number of neutral deuterated ammonia (ND3)
    molecules introduced after plasma breakdown, converted to an
    equivalent-electron count. It is the post-breakdown contribution to
    ammonia_deuterated_count, distinct from the prefill contribution
    [ammonia_deuterated_prefill_count](name:ammonia_deuterated_prefill_count).

    The equivalent-electron count is defined by

    $$
    N_{\mathrm{eq,ND_3}}^{\mathrm{post}} = (Z_{\mathrm{N}} + 3Z_{\mathrm{D}})N_{\mathrm{ND_3}}^{\mathrm{post}} = 10N_{\mathrm{ND_3}}^{\mathrm{post}}
    $$

    where $N_{\mathrm{eq,ND_3}}^{\mathrm{post}}$ is the dimensionless
    equivalent-electron count, $N_{\mathrm{ND_3}}^{\mathrm{post}}$ is the
    cumulative neutral-molecule count after breakdown, and $Z_{\mathrm{N}}=7$
    and $Z_{\mathrm{D}}=1$ are the atomic numbers of nitrogen and deuterium.
    This is a bookkeeping quantity, not the number of free electrons in the
    plasma and not an instantaneous injection rate.
  unit: '1'

- name: accumulated_argon_count
  description: |-
    Accumulated argon count is the cumulative equivalent-electron inventory of
    argon atoms delivered by gas injection after plasma breakdown. Each argon
    atom contributes 18 equivalent electrons, equal to its atomic number; this
    is delivered inventory, not plasma electron content or ionization state.
  documentation: |-
    Accumulated argon count is the cumulative equivalent-electron inventory of
    argon atoms delivered by gas injection after plasma breakdown. Each
    delivered argon atom contributes $Z_{\mathrm{Ar}}=18$ equivalent electrons,
    equal to the atomic number of argon.

    The accumulated count is defined by integrating the delivered argon atom
    injection rate from the plasma-breakdown time:

    $$
    N_{\mathrm{Ar,eq}}(t) = Z_{\mathrm{Ar}} \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Ar}}(t')\,dt', \qquad Z_{\mathrm{Ar}} = 18
    $$

    where $N_{\mathrm{Ar,eq}}$ is the dimensionless equivalent-electron argon
    count, $Z_{\mathrm{Ar}}$ is the dimensionless atomic number of argon,
    $\dot{N}_{\mathrm{Ar}}$ is the argon atom injection rate in atoms per
    second, $t$ is time in seconds, and $t_{\mathrm{bd}}$ is the
    plasma-breakdown time in seconds.

    This quantity includes only argon delivered after breakdown. Argon
    introduced before breakdown belongs to the pre-breakdown inventory
    represented by argon_count; the accumulated value is not a measure of free
    electrons, plasma argon content, retained argon, or argon ionization state,
    and is not reduced by subsequent pumping, exhaust, wall retention,
    ionization, radiation, or redistribution.
  unit: '1'

- name: accumulated_carbon_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown carbon inventory from gas injection, expressed as
    six equivalent-electron counts for every injected neutral carbon atom.
  documentation: |-
    This quantity is the cumulative post-breakdown inventory of carbon atoms
    delivered by gas injection, represented as an equivalent-electron count. It
    excludes carbon introduced during the plasma prefill phase and does not
    represent an instantaneous source rate or a charge-state-resolved ion
    inventory.

    The equivalent-electron count is defined by

    $$
    N_{\mathrm{C,eq}}(t)=6N_{\mathrm{C}}(t)=6\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{C}}^{\mathrm{gas}}(t')\,dt'
    $$

    where $N_{\mathrm{C,eq}}$ is the equivalent-electron count, $N_{\mathrm{C}}$
    is the cumulative number of injected carbon atoms,
    $\dot{N}_{\mathrm{C}}^{\mathrm{gas}}$ is the carbon injection rate,
    $t_{\mathrm{bd}}$ is the plasma breakdown time, and $t$ is the evaluation
    time. The factor 6 is carbon's atomic number. This is the post-breakdown
    component of carbon count due to gas injection and is distinct from [carbon
    prefill count due to gas
    injection](name:carbon_prefill_count_due_to_gas_injection).
  unit: '1'

- name: accumulated_deuterium_count_due_to_gas_injection
  description: |-
    Cumulative equivalent-electron inventory of deuterium delivered by gas
    injection after plasma breakdown.
  documentation: |-
    This quantity is the cumulative post-breakdown inventory of deuterium atoms
    delivered through gas injection, expressed using an equivalent-electron
    weighting. It represents delivered fuel inventory rather than an
    instantaneous injection rate or the number of electrons currently present in
    the plasma.

    The equivalent-electron convention is defined by

    $$
    N_D^{\mathrm{eq}} = Z_D N_D
    $$

    where $N_D^{\mathrm{eq}}$ is the equivalent-electron inventory, $Z_D$ is the
    atomic number of deuterium and equals one, and $N_D$ is the cumulative
    number of deuterium atoms delivered after plasma breakdown.

    The scope is restricted to deuterium introduced after plasma breakdown by
    gas injection. Contributions are accumulated over the injection history and
    weighted per deuterium atom; prefill delivery and other injected species are
    excluded. Ionization after delivery does not change the assigned
    equivalent-electron weighting.

    The weighting convention is shared by
    [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection)
    and
    [accumulated_oxygen_count_due_to_gas_injection](name:oxygen_count_accumulated_due_to_gas_injection),
    while this quantity remains specific to deuterium.
  unit: '1'

- name: accumulated_ethane_count
  description: |-
    Cumulative equivalent-electron inventory of ethane molecules injected after
    plasma breakdown, assigning 18 equivalent-electron counts to each neutral
    C2H6 molecule.
  documentation: |-
    This quantity is the post-breakdown cumulative ethane-gas inventory
    expressed as an equivalent-electron count. Each neutral C2H6 molecule
    contributes 18 counts: 12 from its two carbon atoms and 6 from its six
    hydrogen atoms.

    The accumulated count is defined by

    $$
    N_{\mathrm{eq}}(t) = 18\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{C_2H_6}}(t')\,dt'
    $$

    where $N_{\mathrm{eq}}$ is the equivalent-electron count,
    $\dot{N}_{\mathrm{C_2H_6}}$ is the ethane molecule injection rate,
    $t_{\mathrm{bd}}$ is the plasma-breakdown time, and $t$ is the evaluation
    time.

    This quantity is the accumulated post-breakdown form of the ethane count
    convention. It excludes ethane introduced during prefill, represented by
    [ethane prefill count](name:ethane_prefill_count), and differs from the
    instantaneous [ethane source rate](name:ethane_source_rate).
  unit: '1'

- name: accumulated_helium_3_count_due_to_gas_injection
  description: |-
    Cumulative equivalent-electron inventory of helium-3 atoms delivered by gas
    injection after plasma breakdown, assigning two count units to each atom.
  documentation: |-
    This quantity is the cumulative post-breakdown inventory of helium-3 atoms
    delivered by gas injection, expressed as an equivalent-electron count. It
    represents delivered atomic inventory, not the number of free plasma
    electrons or the ionization state of the helium-3.

    $$
    N_{\mathrm{eq}}(t)=Z_{\mathrm{He\text{-}3}}\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{He\text{-}3}}(t')\,dt'
    $$

    Here, $N_{\mathrm{eq}}$ is the dimensionless equivalent-electron count,
    $Z_{\mathrm{He\text{-}3}}=2$ is the helium-3 atomic number,
    $\dot{N}_{\mathrm{He\text{-}3}}$ is the helium-3 atom delivery rate in atoms
    per second, $t$ and $t'$ are times in seconds, and $t_{\mathrm{bd}}$ is the
    plasma-breakdown time.

    The quantity includes only helium-3 delivered after breakdown and is
    cumulative rather than instantaneous. The corresponding instantaneous
    delivery rate is [helium-3 source rate due to gas
    injection](name:helium_3_source_rate_due_to_gas_injection), while
    [accumulated helium-3 prefill count due to gas
    injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    covers delivery before breakdown.
  unit: '1'

- name: accumulated_helium_3_prefill_count_due_to_gas_injection
  description: |-
    Cumulative equivalent-electron inventory of helium-3 atoms introduced by gas
    injection during plasma prefill before plasma breakdown, with two count
    units assigned per atom.
  documentation: |-
    The quantity is the cumulative inventory of helium-3 atoms delivered by gas
    injection during the plasma prefill phase, expressed as an
    equivalent-electron count. It covers injection before plasma breakdown and
    excludes helium-3 introduced after breakdown.

    The equivalent-electron count is defined by

    $$
    N_{\mathrm{eq}} = Z_{\mathrm{He\text{-}3}} N_{\mathrm{He\text{-}3}} = 2\int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{He\text{-}3}}(t)\,dt
    $$

    where $N_{\mathrm{eq}}$ is the equivalent-electron count,
    $Z_{\mathrm{He\text{-}3}}=2$ is the helium-3 atomic number,
    $N_{\mathrm{He\text{-}3}}$ is the injected helium-3 atom count,
    $\dot{N}_{\mathrm{He\text{-}3}}$ is the injection rate in s$^{-1}$, and
    $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and breakdown times in s.

    This is the pre-breakdown counterpart of [accumulated helium-3 count due to
    gas injection](name:accumulated_helium_3_count_due_to_gas_injection);
    [helium-3 source rate due to gas
    injection](name:helium_3_source_rate_due_to_gas_injection) represents the
    instantaneous rate rather than the accumulated inventory.
  unit: '1'

- name: accumulated_hydrogen_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown equivalent-electron inventory of neutral hydrogen
    delivered by gas injection, with one count unit assigned to each hydrogen
    atom.
  documentation: |-
    This quantity is the cumulative inventory of neutral hydrogen atoms
    delivered by gas injection after plasma breakdown, expressed as an
    equivalent-electron count. Hydrogen contributes one equivalent electron per
    atom because its atomic number is one.

    $$
    N_{H,mathrm{gas}}(t)=Z_H\,\int_{t_{\mathrm{bd}}}^{t}\dot{N}_H(t')\,dt'
    $$

    where $N_{H,\mathrm{gas}}$ is the accumulated equivalent-electron count,
    $Z_H=1$ is hydrogen's atomic number, $t_{\mathrm{bd}}$ is the
    plasma-breakdown time, and $\dot{N}_H$ is the neutral-hydrogen injection
    rate. The corresponding instantaneous rate is [hydrogen source rate due to
    gas injection](name:hydrogen_source_rate_due_to_gas_injection).

    The accumulation begins at breakdown and excludes hydrogen introduced during
    prefill; it represents delivered hydrogen inventory rather than the number
    of free plasma electrons or the ionization-state distribution. It is the
    post-breakdown component of hydrogen count due to gas injection, distinct
    from [accumulated hydrogen prefill
    count](name:accumulated_hydrogen_prefill_count).
  unit: '1'

- name: accumulated_hydrogen_prefill_count
  description: |-
    Cumulative equivalent-electron inventory of hydrogen atoms introduced by gas
    injection during prefill before plasma breakdown; hydrogen contributes one
    count per atom.
  documentation: |-
    The quantity is the cumulative hydrogen atom inventory delivered by gas
    injection during the prefill interval ending at plasma breakdown, expressed
    using the equivalent-electron convention. It is the hydrogen-specific
    contribution to the hydrogen prefill count.

    $$
    N_{\mathrm{H,eq}} = Z_{\mathrm{H}}N_{\mathrm{H}} = N_{\mathrm{H}}, \qquad N_{\mathrm{H}} = \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{H}}(t)\,dt
    $$

    Here $N_{\mathrm{H,eq}}$ and $N_{\mathrm{H}}$ are dimensionless
    equivalent-electron and atom counts, $Z_{\mathrm{H}}=1$ is hydrogen's atomic
    number, $\dot{N}_{\mathrm{H}}$ is the hydrogen injection rate in s$^{-1}$,
    and $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and breakdown times in
    s. Only pre-breakdown gas injection is included; post-breakdown delivery is
    represented by [accumulated hydrogen count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection).
  unit: '1'

- name: accumulated_krypton_count
  description: |-
    Cumulative number of krypton atoms injected into the machine since plasma
    breakdown, expressed as 36 equivalent electrons for each krypton atom.
  documentation: |-
    Cumulative number of krypton atoms injected into the machine since plasma
    breakdown, expressed as 36 equivalent electrons for each krypton atom, is
    the post-breakdown time integral of the krypton atom influx into the machine
    with a fixed species multiplier. The multiplier is the krypton atomic number
    used as an equivalent-electron counting convention.

    The accumulated count at time $t$ is defined by

    $$
    N_{\mathrm{Kr,acc}}(t) = Z_{\mathrm{Kr}} \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Kr}}(t')\,dt'
    $$

    where $N_{\mathrm{Kr,acc}}$ is the accumulated krypton count,
    $Z_{\mathrm{Kr}}=36$ is the krypton atomic-number multiplier,
    $\dot{N}_{\mathrm{Kr}}$ is the krypton atom injection rate into the machine,
    $t_{\mathrm{bd}}$ is the plasma-breakdown time, $t$ is the evaluation time,
    and $t'$ is the integration time.

    The scope is krypton introduced after plasma breakdown; it excludes krypton
    present before breakdown, non-krypton species, instantaneous injection rate,
    and any plasma number density. The species population is not charge-state
    resolved; if charge-state labels are used, krypton contributions are summed
    over all charge states before applying the fixed multiplier.

    The equivalent-electron convention means this quantity equals 36 times the
    unweighted accumulated krypton atom count. It follows the same
    post-breakdown accumulated-species convention as [accumulated neon
    count](name:accumulated_neon_count), [accumulated ammonia
    count](name:accumulated_ammonia_count), and [accumulated helium-3 count due
    to gas injection](name:accumulated_helium_3_count_due_to_gas_injection). The
    factor 36 is a counting convention and does not specify the ionization state
    of the injected krypton.
  unit: '1'

- name: accumulated_lithium_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown lithium inventory delivered by gas injection,
    expressed as three equivalent-electron counts per injected lithium atom.
  documentation: |-
    The quantity is the cumulative inventory of lithium atoms introduced by gas
    injection after plasma breakdown, re-expressed as an equivalent-electron
    count. It represents delivered lithium inventory, not the number of
    electrons currently present in the plasma or a lithium ion charge-state
    population.

    The cumulative value at time $t$ is defined by

    $$
    N_{\mathrm{Li,eq}}(t)=Z_{\mathrm{Li}}\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{Li}}(t')\,dt'
    $$

    where $N_{\mathrm{Li,eq}}(t)$ is the accumulated equivalent-electron lithium
    inventory, $Z_{\mathrm{Li}}$ is lithium's atomic number and equals three,
    $\dot{N}_{\mathrm{Li}}(t')$ is the lithium-atom injection rate at
    integration time $t'$, and $t_{\mathrm{bd}}$ is the plasma-breakdown time.

    The accumulation begins at plasma breakdown and includes only lithium
    delivered by gas injection, with three equivalent-electron counts assigned
    to each lithium atom. It excludes lithium introduced during prefill,
    represented by [accumulated lithium prefill count due to gas
    injection](name:accumulated_lithium_prefill_count_due_to_gas_injection), and
    excludes inventories of other species. The equivalent-electron weighting is
    an inventory convention, not a measurement of lithium ionization or the
    instantaneous plasma electron population.

    The corresponding instantaneous source is the [lithium source rate due to
    gas injection](name:lithium_source_rate_due_to_gas_injection); integrating
    that source from breakdown gives the accumulated post-breakdown inventory.
  unit: '1'

- name: accumulated_lithium_prefill_count_due_to_gas_injection
  description: |-
    Cumulative equivalent-electron inventory of lithium introduced by gas
    injection during plasma prefill, assigning three count units to each lithium
    atom.
  documentation: |-
    The accumulated lithium prefill count is the equivalent-electron inventory
    of lithium introduced by gas injection before plasma breakdown. Each lithium
    atom contributes three equivalent-electron counts, corresponding to its
    atomic number.

    The defining accumulation is

    $$
    N_{\mathrm{eq,Li}} = Z_{\mathrm{Li}} N_{\mathrm{Li}} = 3\int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Li}}(t)\,dt
    $$

    where $N_{\mathrm{eq,Li}}$ is the equivalent-electron inventory,
    $Z_{\mathrm{Li}}$ is lithium's atomic number, $N_{\mathrm{Li}}$ is the
    introduced lithium-atom inventory, $\dot{N}_{\mathrm{Li}}$ is the lithium
    injection rate, $t_{\mathrm{start}}$ is the prefill start time, and
    $t_{\mathrm{bd}}$ is the plasma-breakdown time.

    This quantity describes delivered lithium inventory during prefill, not the
    instantaneous [lithium source
    rate](name:lithium_source_rate_due_to_gas_injection), post-breakdown
    [accumulated lithium
    count](name:accumulated_lithium_count_due_to_gas_injection), or the
    inventory of all injected species represented by [accumulated total prefill
    gas count](name:accumulated_total_prefill_gas_count).
  unit: '1'

- name: accumulated_neon_count
  description: |-
    Cumulative number of neon atoms from gas injection accumulated since plasma
    breakdown, expressed in equivalent electrons; each injected neon atom
    contributes ten equivalent electrons.
  documentation: |-
    Cumulative number of neon atoms from gas injection accumulated since plasma
    breakdown is the time integral of the neon atom injection rate due to gas
    injection, weighted by the neon atomic number. It is a species-specific
    accumulated count expressed in equivalent electrons, so each injected neon
    atom contributes $Z_{\mathrm{Ne}}=10$ equivalent electrons.

    The accumulated neon count $N_{\mathrm{Ne,acc}}$ is defined by

    $$
    N_{\mathrm{Ne,acc}}(t) = Z_{\mathrm{Ne}} \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Ne,inj}}(t') \, dt'
    $$

    where $t_{\mathrm{bd}}$ is the plasma-breakdown time, $t$ is the evaluation
    time, $t'$ is the integration time, $\dot{N}_{\mathrm{Ne,inj}}$ is the
    neutral-neon atom injection rate due to gas injection, and
    $Z_{\mathrm{Ne}}=10$ is the number of electrons in a neutral neon atom.

    The scope is neon supplied by gas injection during the interval from plasma
    breakdown to the evaluation time; the aggregation is cumulative over
    injected neon atoms, with equivalent-electron weighting applied per atom. It
    excludes neon present before breakdown, neon supplied by non-gas-injection
    sources, retained inventory, pumped-out amount, and charge-state-resolved
    plasma neon populations.

    This quantity is the accumulated gas-injection counterpart of the species
    neon count convention, with the additional accumulation interval and
    equivalent-electron weighting. It follows the same accumulated
    equivalent-electron convention as [accumulated krypton
    count](name:accumulated_krypton_count) and [accumulated ammonia
    count](name:accumulated_ammonia_count); a neutral-neon atom count without
    equivalent-electron weighting is obtained by dividing by $Z_{\mathrm{Ne}}$.
  unit: '1'

- name: accumulated_nitrogen_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown nitrogen inventory delivered by gas injection,
    expressed as seven equivalent-electron counts for each injected nitrogen
    atom.
  documentation: |-
    This quantity is the cumulative equivalent-electron inventory of nitrogen
    delivered by gas injection after plasma breakdown. It represents the
    nitrogen contribution to the injected fueling and impurity inventory.

    The equivalent-electron inventory is defined by

    $$
    N_{\mathrm{eq}} = Z_{\mathrm{N}} N_{\mathrm{N}}
    $$

    where $N_{\mathrm{eq}}$ is the cumulative equivalent-electron inventory,
    $Z_{\mathrm{N}}=7$ is the atomic number of nitrogen, and $N_{\mathrm{N}}$ is
    the cumulative number of nitrogen atoms delivered by gas injection after
    breakdown.

    The quantity applies only to nitrogen delivered after plasma breakdown and
    aggregates all such delivered nitrogen over the accumulation interval. It is
    a cumulative inventory, not an instantaneous injection rate, and it is the
    nitrogen-specific contribution rather than an all-species inventory.

    The equivalent-electron convention counts seven contributions per nitrogen
    atom; it does not represent the number of free electrons currently present
    in the plasma and is independent of the nitrogen ionization state. This
    convention is shared by accumulated_carbon_count_due_to_gas_injection, which
    applies the corresponding atomic-number weighting to accumulated carbon.
  unit: '1'

- name: accumulated_oxygen_prefill_count_due_to_gas_injection
  description: |-
    Cumulative oxygen gas introduced during the prefill phase by gas injection,
    expressed as an equivalent-electron count where each oxygen atom contributes
    8 count units equal to its atomic number.
  documentation: |-
    The prefill phase precedes plasma breakdown, during which controlled gas
    injection establishes an initial neutral gas background in the vessel. This
    quantity accumulates the total oxygen inventory delivered during that phase,
    representing each oxygen atom as 8 equivalent electrons equal to the atomic
    number $Z_\mathrm{O} = 8$.

    The equivalent-electron inventory is defined as:

    $$
    N_\mathrm{eq} = Z_\mathrm{O} \cdot N_\mathrm{O}
    $$

    where $N_\mathrm{O}$ is the total number of oxygen atoms injected during the
    prefill interval and $Z_\mathrm{O} = 8$ is the atomic number of oxygen.

    The count is inferred from calibrated gas injection valve records integrated
    over the prefill interval, from the start of the prefill phase through
    plasma breakdown. It is the accumulated component of
    oxygen_prefill_count_due_to_gas_injection and follows the same
    equivalent-electron convention applied to helium-3 in
    [accumulated_helium_3_prefill_count_due_to_gas_injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    and to lithium in
    [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection).
    Post-breakdown oxygen injection is tracked separately by
    [oxygen_count](name:oxygen_count_accumulated_due_to_gas_injection).
  unit: '1'

- name: accumulated_particle_count_at_pellet_path_due_to_pellet_injection
  description: |-
    Cumulative number of particles released by ablation from an injected pellet
    up to a specified position along its trajectory.
  documentation: |-
    This quantity is the cumulative particle release from pellet ablation as the
    pellet travels through the plasma. It counts particles removed from the
    pellet up to the specified trajectory position, rather than particles
    remaining in the pellet.

    The accumulated release at path distance $\ell$ is defined by

    $$
    N_{\mathrm{abl}}(\ell)=\int_{\ell_0}^{\ell}\frac{dN_{\mathrm{abl}}}{d\ell'}\,d\ell'
    $$

    where $N_{\mathrm{abl}}$ is the dimensionless released-particle count,
    $\ell$ and $\ell'$ are distances along the pellet trajectory in m, $\ell_0$
    is the trajectory entry position, and $dN_{\mathrm{abl}}/d\ell'$ is the
    local ablation release per unit path distance.

    The count is nondecreasing along the trajectory when the ablation release
    rate is nonnegative. It represents deposited pellet material and is distinct
    from the initial pellet inventory given by count of pellet.
  unit: '1'

- name: accumulated_propane_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown propane inventory delivered by gas injection,
    expressed as 26 equivalent electrons for each neutral molecule.
  documentation: |-
    This quantity is the cumulative inventory of neutral propane
    ($\mathrm{C_3H_8}$) molecules delivered by gas injection after plasma
    breakdown. It represents delivered propane inventory, not the number of free
    electrons in the plasma or the ionization state of the propane.

    For evaluation time $t$ after breakdown, the equivalent-electron count is
    defined by:

    $$
    N_{\mathrm{eq}}(t) = 26N_{\mathrm{C_3H_8}}(t) = \int_{t_{\mathrm{bd}}}^{t} 26\dot{N}_{\mathrm{C_3H_8}}(t')\,dt'
    $$

    where $N_{\mathrm{eq}}(t)$ is the accumulated equivalent-electron count,
    $N_{\mathrm{C_3H_8}}(t)$ is the cumulative number of propane molecules
    delivered by time $t$, $\dot{N}_{\mathrm{C_3H_8}}(t')$ is the instantaneous
    propane molecular delivery rate at integration time $t'$, $t_{\mathrm{bd}}$
    is the plasma-breakdown time, and $t'$ is the integration variable. The
    factor 26 is the total number of electrons in one neutral propane molecule:
    three carbon atoms contribute six each and eight hydrogen atoms contribute
    one each.

    The scope is restricted to propane introduced by gas injection after
    breakdown and includes all such molecules delivered up to the evaluation
    time. It excludes prefill propane and does not represent inventory from
    other gas species, free plasma-electron content, or an
    ionization-state-resolved amount.

    Unlike the [propane prefill count](name:propane_prefill_count), which covers
    propane introduced before breakdown, this quantity covers the post-breakdown
    interval. Unlike the [propane source rate](name:propane_source_rate), it is
    cumulative rather than instantaneous.
  unit: '1'

- name: accumulated_silane_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown inventory of silane molecules delivered by gas
    injection, expressed as an equivalent-electron count with 18 equivalent
    electrons per neutral SiH4 molecule.
  documentation: |-
    This quantity is the cumulative inventory of neutral silane (SiH4) molecules
    delivered by gas injection after plasma breakdown, represented on an
    equivalent-electron basis.

    The equivalent-electron count is defined by

    $$
    N_{\mathrm{eq}} = 18N_{\mathrm{SiH_4}}
    $$

    where $N_{\mathrm{eq}}$ is the equivalent-electron count and
    $N_{\mathrm{SiH_4}}$ is the cumulative number of neutral silane molecules
    delivered after breakdown. The factor 18 is the sum of silicon's 14
    atomic-number electrons and four hydrogen atoms' one atomic-number electron
    each.

    The scope is silane delivered after plasma breakdown specifically by gas
    injection. The count is cumulative over all such delivery and is not an
    instantaneous rate, a count of free electrons in the plasma, or a
    charge-state-resolved inventory; subsequent ionization, transport,
    retention, and removal do not change the delivered-inventory convention. The
    corresponding instantaneous quantity is the [silane source
    rate](name:silane_source_rate).

    Like the [accumulated hydrogen count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection), this
    quantity uses an equivalent-electron aggregation, but silane contributes 18
    equivalent electrons per molecule rather than one per hydrogen atom.
  unit: '1'

- name: accumulated_total_gas_count
  description: |-
    Cumulative equivalent-electron inventory of all gas species delivered by
    injection after plasma breakdown, summed across species.
  documentation: |-
    This quantity is the cumulative equivalent-electron inventory of gas
    introduced into the plasma by injection after plasma breakdown. It combines
    all injected gas species into one total inventory.

    The total is defined by

    $$
    N_{\mathrm{eq}}(t) = \sum_s z_s N_s(t)
    $$

    where $N_{\mathrm{eq}}(t)$ is the accumulated equivalent-electron count, $s$
    identifies an injected gas species, $N_s(t)$ is the cumulative number of
    particles of species $s$ delivered since plasma breakdown, and $z_s$ is the
    equivalent-electron contribution per particle; for an atomic species, $z_s$
    is its atomic number, while for a molecule it is the sum of the atomic
    numbers of its constituent atoms.

    The quantity applies to all gas species and uses a cumulative sum over the
    post-breakdown injection history. It excludes gas introduced during prefill
    before plasma breakdown, instantaneous injection rates, and any
    single-species inventory such as [accumulated hydrogen count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection).

    It is the post-breakdown counterpart of the prefill inventory [accumulated
    total prefill gas count](name:accumulated_total_prefill_gas_count); the two
    quantities differ by the injection phase they accumulate.
  unit: '1'

- name: accumulated_tritium_count_due_to_gas_injection
  description: |-
    Cumulative number of tritium atoms delivered by gas injection since plasma
    breakdown, expressed as an equivalent-electron count where each tritium atom
    corresponds to one equivalent electron.
  documentation: |-
    The accumulated tritium count due to gas injection is the running total of
    tritium ($^3\mathrm{H}$) atoms introduced to the plasma vessel through gas
    injection valves, accumulated continuously from plasma breakdown onward. The
    quantity is dimensionless, representing each injected atom as an
    equivalent-electron contribution scaled by its atomic number.

    For tritium, whose atomic number is $Z = 1$, the equivalent-electron
    inventory equals the raw atom count directly:

    $$
    N_\mathrm{eq} = Z \cdot N_\mathrm{atoms} = N_\mathrm{atoms}
    $$

    where $N_\mathrm{atoms}$ is the total number of tritium atoms injected after
    breakdown. The equivalent-electron convention provides a species-independent
    basis for comparing injected particle inventories — for higher-$Z$ species
    such as argon ($Z = 18$), the multiplier is correspondingly larger.

    This is the time-integrated form of tritium_count_due_to_gas_injection,
    accumulating monotonically as gas is puffed after breakdown. Tritium
    introduced before breakdown is tracked separately as tritium_prefill_count.
    The deuterium analog in the same equivalent-electron framework is
    [deuterium_count_due_to_gas_injection](name:accumulated_deuterium_count_due_to_gas_injection).
  unit: '1'

- name: accumulated_xenon_count_due_to_gas_injection
  description: |-
    Cumulative post-breakdown xenon inventory delivered by gas injection,
    expressed as an equivalent-electron count with 54 count units assigned to
    each xenon atom.
  documentation: |-
    This quantity is the cumulative inventory of xenon atoms introduced by gas
    injection after plasma breakdown, represented using an equivalent-electron
    counting convention. It denotes delivered xenon inventory rather than
    instantaneous xenon content in the plasma.

    The equivalent-electron count is defined by

    $$
    N_{\mathrm{Xe,eq}} = Z_{\mathrm{Xe}} N_{\mathrm{Xe}} = 54 N_{\mathrm{Xe}}
    $$

    where $N_{\mathrm{Xe,eq}}$ is the cumulative equivalent-electron xenon
    inventory, $Z_{\mathrm{Xe}}$ is the xenon atomic number, and
    $N_{\mathrm{Xe}}$ is the cumulative number of xenon atoms delivered by
    post-breakdown gas injection.

    The scope is limited to xenon atoms delivered after plasma breakdown, with
    contributions from all post-breakdown gas-injection events cumulatively
    summed. No other injected species are included, and the quantity is not an
    instantaneous injection rate.

    The equivalent-electron convention uses the xenon atomic number and does not
    represent the actual number of free plasma electrons supplied by xenon; it
    is independent of the xenon ionization state. Gas introduced before
    breakdown is excluded and belongs to the distinct [accumulated xenon prefill
    inventory](name:accumulated_xenon_prefill_count), which provides the
    corresponding prefill contribution.
  unit: '1'

- name: accumulated_xenon_prefill_count
  description: |-
    Cumulative equivalent-electron inventory of neutral xenon introduced during
    plasma prefill, ending at plasma breakdown, with 54 count units per atom.
  documentation: |-
    This quantity is the equivalent-electron inventory of neutral xenon gas
    introduced between the start of prefill and plasma breakdown. It represents
    the accumulated prefill contribution, not an instantaneous injection rate.

    The defining accumulation is

    $$
    N_{\mathrm{Xe,eq}}^{\mathrm{prefill}} = Z_{\mathrm{Xe}} \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Xe}}(t)\,dt
    $$

    where $\dot{N}_{\mathrm{Xe}}(t)$ is the neutral xenon atom injection rate,
    $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and breakdown times, and
    $Z_{\mathrm{Xe}}=54$ is xenon's atomic number. The resulting count assigns
    54 equivalent-electron units to each xenon atom.

    This quantity is the prefill component of xenon_prefill_count and excludes
    xenon introduced after breakdown, which is represented by
    accumulated_xenon_count.
  unit: '1'

- name: ammonia_deuterated_prefill_count
  description: |-
    Deuterated ammonia prefill count is the total amount of neutral ND3
    introduced before plasma breakdown, expressed as an equivalent-electron
    count with 10 count units per molecule.
  documentation: |-
    Deuterated ammonia prefill count is the total amount of neutral deuterated
    ammonia (ND3) introduced during the prefill phase before plasma breakdown,
    expressed as an equivalent-electron count. Each neutral ND3 molecule
    contributes ten equivalent electrons: seven from nitrogen and one from each
    of its three deuterium atoms.

    The equivalent-electron count is defined by

    $$
    N_{e,\mathrm{eq}}^{\mathrm{ND_3,prefill}} = (Z_{\mathrm{N}} + 3Z_{\mathrm{D}})N_{\mathrm{ND_3,prefill}} = 10\int_{t_0}^{t_{\mathrm{bd}}}\dot{N}_{\mathrm{ND_3}}(t)\,dt
    $$

    where $Z_{\mathrm{N}}=7$ and $Z_{\mathrm{D}}=1$ are atomic numbers,
    $N_{\mathrm{ND_3,prefill}}$ is the accumulated molecule count,
    $\dot{N}_{\mathrm{ND_3}}$ is the molecule injection rate, and $t_0$ and
    $t_{\mathrm{bd}}$ are the prefill start and breakdown times.

    This quantity includes only ND3 introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and
    retained or ionized inventory. It is the deuterated-ammonia component of
    [prefill_count](name:prefill_count), distinct from
    [ammonia_prefill_count](name:ammonia_prefill_count) and post-breakdown
    [accumulated_ammonia_deuterated_count](name:accumulated_ammonia_deuterated_count).
  unit: '1'

- name: ammonia_deuterated_source_rate
  description: |-
    Instantaneous molecular injection rate of deuterated ammonia (ND3) supplied
    to the plasma vessel by gas injection.
  documentation: |-
    This quantity is the rate at which deuterated ammonia (ND3) molecules are
    admitted to the plasma vessel by gas injection. It counts ND3 molecules
    directly rather than converting them to an equivalent-electron inventory.

    $$
    \dot{N}_{\mathrm{ND_3}}(t)=\frac{dN_{\mathrm{ND_3}}(t)}{dt}
    $$

    where $N_{\mathrm{ND_3}}(t)$ is the cumulative number of injected ND3
    molecules and $t$ is time. The rate is distinct from the [ammonia source
    rate](name:ammonia_source_rate), which refers to NH3 molecules, and its time
    integral gives the injected molecular inventory represented by the
    [accumulated deuterated ammonia
    count](name:accumulated_ammonia_deuterated_count).
  unit: s^-1

- name: ammonia_prefill_count
  description: |-
    Ammonia prefill count is the total amount of NH3 introduced before plasma
    breakdown, expressed as an equivalent-electron count of 10 per neutral
    molecule.
  documentation: |-
    Ammonia prefill count is the total amount of neutral ammonia, NH3,
    introduced before plasma breakdown, expressed as an equivalent-electron
    count. Each neutral NH3 molecule contributes ten count units: seven from
    nitrogen and one from each of its three hydrogen atoms.

    The count is defined by the accumulated molecular amount over the prefill
    interval:

    $$
    N_{e,\mathrm{eq}}^{\mathrm{NH_3,prefill}} = 10N_{\mathrm{NH_3,prefill}} = \int_{t_0}^{t_\mathrm{bd}} 10\dot{N}_{\mathrm{NH_3}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{NH_3,prefill}}$ is the equivalent-electron
    count, $N_{\mathrm{NH_3,prefill}}$ is the accumulated number of ammonia
    molecules, $\dot{N}_{\mathrm{NH_3}}$ is the ammonia injection rate in
    molecules per second, and $t_0$ and $t_{\mathrm{bd}}$ are the start of
    prefill and plasma-breakdown times in seconds.

    This species-specific contribution is included in the common prebreakdown
    bookkeeping of [prefill_count](name:prefill_count). Ammonia introduced after
    breakdown is excluded and is represented by
    [accumulated_ammonia_count](name:accumulated_ammonia_count).
  unit: '1'

- name: ammonia_source_rate
  description: |-
    Instantaneous ammonia source rate expressed as equivalent-electron count per
    time, assigning ten count units to each neutral NH3 molecule introduced into
    the plasma vessel.
  documentation: |-
    This quantity is the instantaneous rate of ammonia delivery to the plasma
    vessel, expressed using the equivalent-electron convention for neutral
    ammonia molecules. It represents injected NH3 inventory, not the plasma
    electron source or the ionization state of ammonia.

    $$
    \dot{N}_{\mathrm{eq}} = 10\,\dot{N}_{\mathrm{NH_3}}
    $$

    where $\dot{N}_{\mathrm{eq}}$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{NH_3}}$ is the molecular ammonia injection rate, and the
    factor 10 is the total atomic-electron count of one neutral NH3 molecule.
    Time integration gives the corresponding
    [accumulated_ammonia_count](name:accumulated_ammonia_count). The
    isotopologue-specific counterpart is
    [ammonia_deuterated_source_rate](name:ammonia_deuterated_source_rate).
  unit: s^-1

- name: argon_prefill_count
  description: |-
    Argon prefill count is the total amount of neutral argon (Ar) introduced
    before plasma breakdown, expressed as an equivalent-electron count with 18
    per atom.
  documentation: |-
    Argon prefill count is the total amount of neutral argon (Ar) introduced
    during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral argon atom contributes 18 equivalent
    electrons.

    The equivalent-electron count is obtained by accumulating injected argon
    atoms over the prefill interval and weighting them by the argon atomic
    number:

    $$
    N_{e,\mathrm{eq}}^{\mathrm{Ar,prefill}} = Z_{\mathrm{Ar}} N_{\mathrm{Ar,prefill}} = Z_{\mathrm{Ar}} \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Ar}}(t)\,dt = 18\int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Ar}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{Ar,prefill}}$ is the equivalent-electron
    count, $N_{\mathrm{Ar,prefill}}$ is the accumulated neutral-argon atom
    count, $Z_{\mathrm{Ar}}=18$ is the argon atomic number,
    $\dot{N}_{\mathrm{Ar}}$ is the argon atom injection rate, $t_0$ is the
    prefill start time, and $t_{\mathrm{bd}}$ is the plasma-breakdown time.

    This quantity includes only argon introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and
    retained or ionized inventory. It is the argon-specific component of
    [prefill count](name:prefill_count) and follows the isotope-resolved
    convention used for tritium prefill count.
  unit: '1'

- name: carbon_prefill_count_due_to_gas_injection
  description: |-
    Cumulative equivalent-electron inventory introduced as carbon gas during
    plasma prefill, with six count units assigned to each injected carbon atom.
  documentation: |-
    This quantity is the cumulative equivalent-electron inventory of carbon
    introduced by gas injection during the plasma prefill phase, before plasma
    breakdown. It represents injected carbon atoms rather than an instantaneous
    injection rate.

    The defining relation is

    $$
    N_{\mathrm{C,eq}} = Z_{\mathrm{C}}N_{\mathrm{C}} = 6N_{\mathrm{C}}
    $$

    where $N_{\mathrm{C,eq}}$ is the equivalent-electron count, $N_{\mathrm{C}}$
    is the cumulative number of injected carbon atoms, and $Z_{\mathrm{C}}=6$ is
    the carbon atomic number. Both counts are dimensionless.

    The prefill interval ends at plasma breakdown, so post-breakdown carbon
    delivery is represented separately by [accumulated carbon count due to gas
    injection](name:accumulated_carbon_count_due_to_gas_injection). The
    aggregation convention parallels [accumulated hydrogen prefill
    count](name:accumulated_hydrogen_prefill_count), with the atomic number
    providing the equivalent-electron weighting.
  unit: '1'

- name: coolant_pressure
  description: |-
    Absolute static pressure of the coolant or working fluid at a plant-system
    component port, referenced to perfect vacuum rather than atmospheric or
    another gage reference.
  documentation: |-
    The quantity is the local thermodynamic pressure of the coolant or working
    fluid at a component-port interface, with perfect vacuum as the
    zero-pressure reference. Static pressure is the isotropic mechanical stress
    of the fluid and excludes kinetic-energy contributions associated with bulk
    flow.

    $$
    \boldsymbol{\sigma}=-p_{\mathrm{abs}}\mathbf{I}
    $$

    where $\boldsymbol{\sigma}$ is the isotropic fluid Cauchy stress,
    $p_{\mathrm{abs}}$ is the absolute static pressure, and $\mathbf{I}$ is the
    identity tensor.

    The value represents local pressure at the port, not stagnation pressure,
    pressure drop, or pressure difference. At a cooling-circuit inlet, it is
    related to cooling-circuit inlet pressure, while coolant flow through a
    plant component port describes mass transport rather than mechanical
    pressure.
  unit: Pa

- name: coolant_temperature_of_plant_component_port
  description: |-
    Thermodynamic temperature of the working coolant at a generic inlet or
    outlet port of a power-conversion component.
  documentation: |-
    Coolant temperature is the thermodynamic temperature describing the thermal
    state of the working fluid at a connection port of a power-conversion
    component.

    The quantity applies to coolant at a generic plant-component port, which may
    be an inlet or an outlet. It denotes the local fluid state at that port; no
    summation, spatial averaging, or integration is implied. It excludes the
    temperature of the component structure or any other material.

    Unlike [coolant temperature at outlet](name:coolant_temperature_at_outlet),
    this quantity does not restrict the port to an outlet. It is a thermal-state
    quantity, whereas [coolant transit time of plant component
    port](name:coolant_transit_time_of_plant_component_port) describes the
    elapsed transport time between component ports rather than the coolant
    temperature.
  unit: K

- name: core_atomic_count_of_pellet
  description: |-
    Core atomic count of a pellet is the total inventory of individual atoms
    contained in its core material, independent of bonding, phase, or species.
  documentation: |-
    Core atomic count is the inventory of individual atoms contained in the core
    material of one pellet. Molecules, compounds, and mixtures are resolved into
    their constituent atoms before summation, independently of bonding, phase,
    and species. It is the core-restricted component of atomic count of pellet
    and is distinct from the outer atomic count of pellet.

    For constituent entity types indexed by $i$, the core atomic inventory is
    defined by

    $$
    N_{\mathrm{core,atom}} = \sum_i a_i N_{i,\mathrm{core}}
    $$

    where $N_{i,\mathrm{core}}$ is the number of core entities of type $i$ and
    $a_i$ is the number of atoms in each entity. The quantity includes atoms in
    the pellet core and excludes atoms in other pellet layers and separately
    counted propellant gas molecules; the whole-pellet inventory is atomic count
    of pellet.
  unit: '1'

- name: deuterium_prefill_count
  description: |-
    Deuterium prefill count is the total amount of neutral deuterium introduced
    before plasma breakdown, expressed as an equivalent-electron count with one
    count unit per atom.
  documentation: |-
    Deuterium prefill count is the total amount of neutral deuterium (D)
    introduced during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral deuterium atom contributes one
    equivalent electron.

    The equivalent-electron count is obtained by accumulating injected deuterium
    atoms over the prefill interval and weighting them by the deuterium atomic
    number:

    $$
    N_{e,\mathrm{eq}}^{\mathrm{D,prefill}} = Z_{\mathrm{D}} N_{\mathrm{D,prefill}} = Z_{\mathrm{D}} \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{D}}(t)\,dt = \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{D}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{D,prefill}}$ is the equivalent-electron
    count, $N_{\mathrm{D,prefill}}$ is the accumulated neutral-deuterium atom
    count, $Z_{\mathrm{D}}=1$ is the deuterium atomic number,
    $\dot{N}_{\mathrm{D}}$ is the deuterium atom injection rate, $t_0$ is the
    prefill start time, and $t_{\mathrm{bd}}$ is the plasma-breakdown time.

    This quantity includes only deuterium introduced before breakdown and
    excludes wall recycling, neutral-beam or pellet fueling, later gas
    injection, and retained or ionized inventory. It is the deuterium-specific
    component of [prefill_count](name:prefill_count) and uses the same
    isotope-resolved convention as tritium_prefill_count.
  unit: '1'

- name: deuterium_source_rate_due_to_injection
  description: |-
    Instantaneous rate of deuterium particles supplied by active injection,
    expressed on a common equivalent-electron basis.
  documentation: |-
    This quantity is the instantaneous particle supply from active injection
    systems for deuterium, expressed on an equivalent-electron basis. Because
    each deuterium atom has nuclear charge number one, the equivalent-electron
    rate equals the deuterium particle rate.

    The defining relation is

    $$
    \dot{N}_{\mathrm{D,eq}}(t)=Z_{\mathrm{D}}\dot{N}_{\mathrm{D}}(t)=\dot{N}_{\mathrm{D}}(t)
    $$

    where $\dot{N}_{\mathrm{D,eq}}$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{D}}$ is the injected deuterium particle rate, and
    $Z_{\mathrm{D}}=1$ is the dimensionless deuterium nuclear charge number.
    This is a component of the multi-species [source rate due to
    injection](name:source_rate_due_to_injection) and is distinct from the
    charge-weighted [electron source rate due to
    injection](name:electron_source_rate_due_to_injection). It represents
    injected inventory supply, not a local volumetric particle source or a net
    plasma production-minus-loss rate.
  unit: s^-1

- name: diameter_of_pellet
  description: |-
    Transverse extent of the intact cylindrical pellet before injection and
    shattering, defined as the full width of its circular cross-section
    perpendicular to the pellet axis.
  documentation: |-
    Transverse extent of the intact cylindrical pellet before injection and
    shattering is the full width of its circular cross-section measured
    perpendicular to the pellet axis. It defines the pellet cross-sectional
    geometry before fragmentation, ablation, or interaction with the plasma.

    For an ideal right circular cylindrical pellet, the diameter and axial
    length determine the pellet volume by

    $$
    V_\mathrm{pellet} = \frac{\pi}{4} d_\mathrm{pellet}^2 L_\mathrm{pellet}
    $$

    where $V_\mathrm{pellet}$ is the pellet volume, $d_\mathrm{pellet}$ is the
    pellet diameter, and $L_\mathrm{pellet}$ is the [length of
    pellet](name:length_of_pellet).

    This quantity excludes the axial extent of the pellet, which is the [length
    of pellet](name:length_of_pellet), and excludes characteristic sizes of
    shattered fragments, ablated material, or the post-shattering material
    cloud.
  unit: m

- name: efficiency_of_plant_system
  description: |-
    Dimensionless ratio quantifying how effectively a plant system converts
    input power or energy into a specified useful output, abstracting over
    thermal and net efficiency definitions.
  documentation: |-
    The efficiency of a plant system is a dimensionless performance metric
    expressing the fraction of input power or energy that the plant converts
    into a specified useful output. The exact physical scope depends on the
    efficiency type applied: [thermal
    efficiency](name:thermal_efficiency_of_plant_system) characterizes
    heat-to-work conversion across all thermodynamic conversion stages, while
    [net efficiency](name:net_efficiency_of_plant_system) accounts for the
    signed ratio of exported electrical power to total plant electrical
    consumption including recirculating power.

    The general defining relation takes the form:

    $$
    \eta = \frac{W_\text{out}}{W_\text{in}}
    $$

    where $W_\text{out}$ is the useful output (work, exported electrical power,
    or heat converted to work) and $W_\text{in}$ is the total input power or
    energy over the same operating interval.

    Efficiency is evaluated from calorimetric heat-flow surveys, electrical
    generation meters, and auxiliary power consumption measurements across all
    plant subsystems. For fusion facilities, thermal conversion efficiencies in
    steam-cycle plants lie in the range 30–45%, and net electrical efficiencies
    are further reduced by recirculating power fractions for heating, current
    drive, and cooling systems.
  unit: '1'

- name: electron_density_at_pellet_path
  description: |-
    Local free-electron number density of the background plasma at points along
    a pellet's ablation trajectory.
  documentation: |-
    The quantity is the local number density of free electrons in the background
    plasma at each point traversed by an injected pellet. It describes the
    plasma encountered by the pellet, not electron content in pellet material or
    electron production by ablation.

    At a path point, the electron number density is defined by the local
    number-to-volume ratio:

    $$
    n_e = \lim_{\Delta V \to 0} \frac{\Delta N_e}{\Delta V}
    $$

    where $n_e$ is the electron number density, $\Delta N_e$ is the number of
    free electrons in the volume element $\Delta V$, and $\Delta V$ is the
    volume element centered at the path point.

    The quantity is evaluated locally along the pellet trajectory and is
    distinct from the [electron source rate at the pellet path due to pellet
    injection](name:electron_source_rate_at_pellet_path_due_to_pellet_injection),
    which describes electron production rather than background density. It has
    the same physical meaning as [electron density at the launching
    position](name:electron_density_at_launching_position), but at a different
    locus.
  unit: m^-3

- name: electron_source_rate_at_pellet_path_due_to_pellet_injection
  description: |-
    Electron source rate at the pellet path due to pellet injection is the
    charge-weighted electron-equivalent production rate from ablation and
    ionization of pellet material at a specified position along the injected
    pellet trajectory.
  documentation: |-
    Electron source rate at the pellet path due to pellet injection is the
    charge-weighted electron-equivalent production rate from ablation and
    ionization of pellet material at a specified position along the injected
    pellet trajectory. It counts the free-electron source associated with
    material reaching that path position, not the electron concentration of the
    surrounding plasma.

    For trajectory coordinate $\ell$ and time $t$, the local rate is defined by
    the charge-weighted sum over ablated pellet constituents contributing at
    that same path position:

    $$
    S_e(\ell,t) = \sum_a Z_a^\mathrm{eff}(\ell,t)\,\dot{N}_a(\ell,t)
    $$

    where $S_e$ is the electron source rate at the pellet path due to pellet
    injection, $a$ indexes the pellet constituents or represented charge-state
    groups, $\dot{N}_a$ is the local production rate of constituent $a$ by
    ablation and ionization, and $Z_a^\mathrm{eff}$ is the effective number of
    free electrons contributed by one produced constituent. For a fully ionized
    atomic constituent, $Z_a^\mathrm{eff}$ reduces to its nuclear charge.

    This is a path-position rate, not a source density per distance along the
    pellet trajectory or a volume-integrated source. The [electron source rate
    due to injection](name:electron_source_rate_due_to_injection) is obtained
    only after aggregating the appropriate local electron-equivalent
    contributions, while electron density of pellet path describes electron
    concentration along the same trajectory. The [accumulated particle count at
    pellet path due to pellet
    injection](name:accumulated_particle_count_at_pellet_path_due_to_pellet_injection)
    is an unweighted cumulative particle count; it is not an electron-equivalent
    accumulated source unless the same charge weighting and time integration are
    applied.

    The value is non-negative and is zero where injected pellet material at the
    considered path position does not produce free electrons.
  unit: s^-1

- name: electron_source_rate_due_to_injection
  description: |-
    Instantaneous rate of electron-equivalent particles supplied by active
    injection, obtained by nuclear-charge weighting each injected atomic
    species.
  documentation: |-
    This quantity is the instantaneous particle supply from active injection
    systems, expressed on an equivalent-electron basis when multiple injected
    species are combined. It represents the electron inventory that the supplied
    material can contribute after ionization.

    The equivalent-electron source rate is defined by

    $$
    \dot{N}_{\mathrm{eq}}(t)=\sum_s Z_s\dot{N}_s(t)
    $$

    where $\dot{N}_{\mathrm{eq}}$ and $\dot{N}_s$ are source rates, $s$ indexes
    the injected atomic species, and $Z_s$ is the dimensionless nuclear charge
    number. For molecular feeds, each constituent atom is included with its
    nuclear-charge weighting. This is the charge-weighted instance of the
    [source rate due to injection](name:source_rate_due_to_injection); for
    unit-charge deuterium, it equals the [deuterium source rate due to
    injection](name:deuterium_source_rate_due_to_injection).

    This is an injected inventory rate, not a local volumetric particle source
    or a net plasma production-minus-loss rate such as the [total electron
    source rate](name:total_electron_source_rate).

    Sign convention: Positive when active injection increases the supplied
    equivalent-electron inventory.
  unit: s^-1

- name: ethane_prefill_count
  description: |-
    Ethane prefill count is the total amount of neutral ethane (C2H6) introduced
    before plasma breakdown, expressed as an equivalent-electron count with 18
    equivalent electrons per molecule.
  documentation: |-
    Ethane prefill count is the total amount of neutral ethane (C2H6) introduced
    during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral ethane molecule contributes 18
    equivalent electrons: 12 from its two carbon atoms and 6 from its six
    hydrogen atoms.

    The equivalent-electron count is defined by

    $$
    N_{e,\mathrm{eq}}^{\mathrm{C_2H_6,prefill}} = 18N_{\mathrm{C_2H_6,prefill}} = \int_{t_0}^{t_{\mathrm{bd}}}18\dot{N}_{\mathrm{C_2H_6}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{C_2H_6,prefill}}$ and
    $N_{\mathrm{C_2H_6,prefill}}$ are pure counts, $\dot{N}_{\mathrm{C_2H_6}}$
    is the neutral-ethane introduction rate in molecules s$^{-1}$, and $t_0$,
    $t_{\mathrm{bd}}$, and $t$ are the prefill start, plasma-breakdown, and time
    variables in seconds.

    This quantity includes only neutral ethane introduced before breakdown and
    excludes wall recycling, neutral-beam or pellet fueling, later gas
    injection, and retained or ionized inventory. It is the ethane component of
    [prefill_count](name:prefill_count);
    [accumulated_ethane_count](name:accumulated_ethane_count) represents
    distinct post-breakdown accumulation, while
    [ethylene_prefill_count](name:ethylene_prefill_count) applies the same
    convention to a different hydrocarbon.
  unit: '1'

- name: ethane_source_rate
  description: |-
    Instantaneous ethane-gas injection rate into the plasma vessel, expressed as
    equivalent electrons per second, with 18 equivalent electrons assigned to
    each neutral C2H6 molecule.
  documentation: |-
    This quantity is the instantaneous rate at which neutral ethane molecules
    are delivered to the plasma vessel, converted to an equivalent-electron
    rate. It counts the electrons associated with neutral molecular composition,
    not free electrons produced by ionization.

    $$
    \dot{N}_{\mathrm{eq}}(t)=18\,\dot{N}_{\mathrm{C_2H_6}}(t)
    $$

    where $\dot{N}_{\mathrm{eq}}$ is the equivalent-electron injection rate,
    $\dot{N}_{\mathrm{C_2H_6}}$ is the neutral ethane molecular injection rate
    in molecules per second, and $t$ is time in seconds. The factor
    $18=2\times6+6\times1$ is the total atomic-number electron count of one C2H6
    molecule.

    This is an instantaneous rate rather than a cumulative inventory; its time
    integral gives the accumulated equivalent-electron count represented by
    [accumulated ethane count](name:accumulated_ethane_count). It excludes other
    molecular species, including the distinct [ethylene source
    rate](name:ethylene_source_rate).
  unit: s^-1

- name: ethylene_prefill_count
  description: |-
    Ethylene prefill count is the total amount of neutral ethylene (C2H4)
    introduced before plasma breakdown, expressed as an equivalent-electron
    count with 16 equivalent electrons per molecule.
  documentation: |-
    Ethylene prefill count is the total amount of neutral ethylene (C2H4)
    introduced during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral ethylene molecule contributes
    sixteen equivalent electrons: twelve from two carbon atoms and four from
    four hydrogen atoms.

    The equivalent-electron count is defined by

    $$
    N_{e,\mathrm{eq}}^{\mathrm{C_2H_4,prefill}} = (2Z_{\mathrm{C}}+4Z_{\mathrm{H}})N_{\mathrm{C_2H_4,prefill}} = 16N_{\mathrm{C_2H_4,prefill}} = \int_{t_0}^{t_{\mathrm{bd}}}16\dot{N}_{\mathrm{C_2H_4}}(t)\,dt
    $$

    where $Z_{\mathrm{C}}=6$ and $Z_{\mathrm{H}}=1$ are the atomic numbers of
    carbon and hydrogen, $N_{\mathrm{C_2H_4,prefill}}$ is the accumulated
    ethylene-molecule count, $\dot{N}_{\mathrm{C_2H_4}}$ is the ethylene
    introduction rate, and $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and
    plasma-breakdown times.

    This quantity includes only neutral ethylene introduced before breakdown and
    excludes wall recycling, neutral-beam or pellet fueling, later gas
    injection, and retained or ionized inventory. It is the ethylene component
    of [prefill_count](name:prefill_count);
    [accumulated_ethylene_count](name:accumulated_ethylene_count) represents the
    distinct post-breakdown accumulation, while
    [ethane_prefill_count](name:ethane_prefill_count) applies the same
    convention to a different molecule.
  unit: '1'

- name: ethylene_source_rate
  description: |-
    Instantaneous injection rate of ethylene (C2H4) gas into the plasma vessel,
    expressed as equivalent electrons per second with each molecule counted as
    16 equivalent electrons.
  documentation: |-
    Ethylene (C2H4) is a two-carbon, four-hydrogen molecule used as a gaseous
    source of both carbon and hydrogen in plasma fueling and wall-conditioning
    experiments. The source rate is the instantaneous equivalent-electron
    delivery rate to the plasma vessel, where each molecule is assigned 16
    equivalent electrons based on the total atomic electron inventory of the
    molecular formula.

    The equivalent-electron rate $\dot{N}_\mathrm{eq}$ relates to the molecular
    injection rate $\dot{N}_\mathrm{C_2H_4}$ by

    $$
    \dot{N}_\mathrm{eq} = 16\,\dot{N}_\mathrm{C_2H_4}
    $$

    where the factor $16 = 2Z_\mathrm{C} + 4Z_\mathrm{H}$, with $Z_\mathrm{C} =
    6$ the carbon atomic number and $Z_\mathrm{H} = 1$ the hydrogen atomic
    number.

    The injection rate is inferred from valve conductance calibrations and
    upstream pressure measurements. Its time-integral gives the [accumulated
    ethylene count](name:accumulated_ethylene_count), which tracks the total
    equivalent-electron inventory delivered since plasma breakdown. Related
    molecular and atomic injection rates include
    [silane_source_rate](name:silane_source_rate) for SiH4 and
    [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection)
    for atomic hydrogen delivery.

    Sign convention: Positive when ethylene gas flows from the injection system
    into the plasma vessel.
  unit: s^-1

- name: first_measurement_direction_unit_vector_of_shatter_cone
  description: |-
    Unit direction vector defining the first measurement direction associated
    with an elliptic shatter cone in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    This quantity is the unit direction vector assigned to the first measurement
    direction of an elliptic shatter cone. It describes orientation, not
    position, length, or cone-axis magnitude. Its components are resolved in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, with
    $\hat{z}=\hat{Z}$ representing the vertical direction.

    $$
    \hat{\mathbf{d}}_1 = d_{1x}\hat{x} + d_{1y}\hat{y} + d_{1z}\hat{z}, \qquad d_{1x}^2+d_{1y}^2+d_{1z}^2=1
    $$

    Here, $\hat{\mathbf{d}}_1$ is the first measurement-direction unit vector,
    $d_{1x}$, $d_{1y}$, and $d_{1z}$ are its Cartesian projections, and
    $\hat{x}$, $\hat{y}$, and $\hat{z}$ are the Cartesian basis vectors. The
    designation “first” follows the shatter-cone measurement-direction
    convention and does not imply alignment with the Cartesian $x$ axis. It is
    distinct from the [X component of the shatter-cone major-axis unit
    vector](name:x_major_axis_unit_vector_of_shatter_cone), which describes cone
    geometry rather than measurement-direction ordering.
  unit: '1'

- name: incident_thermal_power_at_wall
  description: |-
    Thermal power carried from the plasma and incident on the first wall,
    defining the wall-directed heat load before downstream coolant extraction.
  documentation: |-
    This quantity is the thermal power transported from the plasma toward and
    incident on the first wall. It represents an integrated wall load rather
    than a local heat-flux density.

    The incident thermal power is defined by

    $$
    P_{\mathrm{wall}} = \frac{dE_{\mathrm{th,inc}}}{dt}
    $$

    where $P_{\mathrm{wall}}$ is the thermal power incident on the first wall
    and $E_{\mathrm{th,inc}}$ is the thermal energy delivered from the plasma to
    the wall.

    The quantity applies to the thermal plasma contribution and aggregates the
    incident power over the first-wall surface. It excludes power extracted by
    coolant after deposition and is distinct from [total thermal
    coolant-absorbed power at the
    wall](name:total_thermal_coolant_absorbed_power_at_wall), which describes
    the downstream removal of deposited energy. It is also not limited to the
    radiative component represented by [absorbed radiated power at the
    wall](name:absorbed_radiated_power_at_wall).

    The total incident load can contain conductive and convective contributions,
    represented by [power due to conduction](name:power_due_to_conduction) and
    [power due to convection](name:power_due_to_convection) when those
    components are resolved.
  unit: W

- name: krypton_prefill_count
  description: |-
    Krypton prefill count is the total amount of neutral krypton introduced
    before plasma breakdown, expressed as an equivalent-electron count with 36
    count units per atom.
  documentation: |-
    Krypton prefill count is the total amount of neutral krypton (Kr) introduced
    during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral krypton atom contributes 36
    equivalent electrons.

    The equivalent-electron count is obtained by accumulating the injected
    krypton atoms over the prefill interval and weighting them by the krypton
    atomic number:

    $$
    N_{e,\mathrm{eq}}^{\mathrm{Kr,prefill}} = Z_{\mathrm{Kr}} N_{\mathrm{Kr,prefill}} = Z_{\mathrm{Kr}} \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{Kr}}(t)\,dt = 36 \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{Kr}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{Kr,prefill}}$ is the dimensionless
    equivalent-electron count, $N_{\mathrm{Kr,prefill}}$ is the dimensionless
    accumulated neutral-krypton atom count, $Z_{\mathrm{Kr}}=36$ is the
    dimensionless atomic number of krypton, $\dot{N}_{\mathrm{Kr}}$ is the
    neutral-krypton atom injection rate, $t_0$ is the start of prefill, and
    $t_\mathrm{bd}$ is the plasma-breakdown time.

    This quantity includes only krypton introduced before breakdown and excludes
    later fueling, other gas species, and the retained or ionized inventory. It
    uses the common equivalent-electron bookkeeping of
    [prefill_count](name:prefill_count), with xenon_prefill_count providing the
    analogous noble-gas convention for xenon.
  unit: '1'

- name: length_of_pellet
  description: |-
    End-to-end extent of an intact cylindrical pellet measured along its
    symmetry axis before injection or shattering.
  documentation: |-
    The pellet axial length is the distance between the two end faces measured
    parallel to the symmetry axis of the intact cylindrical pellet.

    $$
    L_p = z_2 - z_1
    $$

    where $L_p$ is the axial length and $z_1$ and $z_2$ are the axial
    coordinates of the two end faces, ordered so that $z_2 > z_1$ along the
    chosen axial direction.

    This quantity describes the unshattered pellet before injection or
    fragmentation and excludes its transverse size, which is described by the
    [diameter of the pellet](name:diameter_of_pellet).
  unit: m

- name: maximum_gas_flow
  description: |-
    Maximum gas flow is the largest pressure-volume throughput that a gas
    injection valve can reliably deliver, defining the upper bound of its
    controllable range.
  documentation: |-
    Maximum gas flow is the upper reliable operating limit of the
    pressure-volume throughput delivered by a gas injection valve. It represents
    the aggregate gas stream rather than a particular molecular species, charge
    state, mass flow, or particle-number rate.

    The defining pressure-volume throughput at the upper delivery limit is

    $$
    Q_g^{\max} = p_g \frac{dV_g}{dt}
    $$

    where $Q_g^{\max}$ is the maximum gas pressure-volume throughput, $p_g$ is
    the gas pressure at the flow boundary, $V_g$ is the volume of gas crossing
    that boundary, and $t$ is time.

    This quantity applies to gas delivered through a gas injection valve for
    fueling, impurity seeding, or disruption mitigation. The maximum qualifier
    denotes a reliable upper delivery limit for the aggregate gas stream, not a
    species-resolved flow, mass-flow rate, or particle-number rate.

    The quantity is the upper-bound member of the gas flow family: gas flow
    denotes the same pressure-volume throughput without an upper-limit
    restriction, while [minimum gas flow](name:minimum_gas_flow) denotes its
    lower reliable operating limit.
  unit: Pa.m^3.s^-1

- name: methane_carbon_13_source_rate
  description: |-
    Instantaneous injection rate of carbon-13-labeled methane into the plasma
    vessel, expressed as an equivalent-electron rate with 10 equivalent
    electrons assigned to each neutral molecule.
  documentation: |-
    Instantaneous injection rate of carbon-13-labeled methane into the plasma
    vessel is the rate at which neutral $^{13}\mathrm{CH}_4$ enters the plasma
    vessel, counted using the equivalent-electron convention. Each neutral
    carbon-13-labeled methane molecule contributes 10 equivalent electrons.

    The constitutive relation between the equivalent-electron source rate and
    the molecular injection rate is:

    $$
    \dot{S}_{^{13}\mathrm{CH}_4} = 10\,\dot{N}_{^{13}\mathrm{CH}_4}
    $$

    where $\dot{S}_{^{13}\mathrm{CH}_4}$ is the carbon-13-labeled methane source
    rate, $\dot{N}_{^{13}\mathrm{CH}_4}$ is the molecule-counted injection rate
    of neutral carbon-13-labeled methane, and $^{13}\mathrm{CH}_4$ denotes
    methane with carbon-13 as the carbon isotope.

    This quantity applies only to neutral carbon-13-labeled methane crossing
    into the plasma vessel by gas injection, aggregated over the relevant
    injection locations as an instantaneous total. It excludes unlabeled
    methane, other hydrocarbons, gas remaining upstream of the vessel, and
    accumulated injected amount.

    It is distinguished from a molecule-counted [methane source
    rate](name:methane_source_rate) by the equivalent-electron counting
    convention: the present quantity is 10 times the corresponding
    molecule-counted rate for the same carbon-13-labeled methane population.
    When the corresponding accumulated count is used, this source rate is the
    time derivative of the [accumulated methane carbon-13 count due to gas
    injection](name:accumulated_methane_carbon_13_count_due_to_gas_injection)
    under the same equivalent-electron convention.

    Sign convention: Positive when carbon-13-labeled methane enters the plasma
    vessel.
  unit: s^-1

- name: methane_source_rate
  description: |-
    Instantaneous rate of neutral methane-molecule delivery into the plasma
    vessel by gas injection, counted per molecule rather than as an
    equivalent-electron or elemental source.
  documentation: |-
    Methane source rate is the instantaneous rate at which neutral methane
    molecules are delivered to the plasma vessel by gas injection. It counts
    methane molecules directly, rather than converting them to equivalent
    electrons or to elemental carbon or hydrogen.

    The source rate is defined by

    $$
    \dot{N}_{\mathrm{CH_4}}(t) = \frac{dN_{\mathrm{CH_4}}(t)}{dt}
    $$

    where $N_{\mathrm{CH_4}}(t)$ is the cumulative number of methane molecules
    delivered by gas injection and $t$ is time. The quantity is distinct from
    the [methane carbon-13 source rate](name:methane_carbon_13_source_rate),
    which applies specifically to carbon-13-labeled methane.
  unit: s^-1

- name: minimum_gas_flow
  description: |-
    Minimum gas flow is the smallest pressure-volume gas throughput that a gas
    injection valve can reliably deliver, defining the lower bound of its
    controllable range.
  documentation: |-
    Minimum gas flow is the lower reliable operating limit of the
    pressure-volume throughput delivered by a gas injection valve. It identifies
    the smallest controllable value of the aggregate gas stream throughput,
    rather than a molecular-species flow or particle-number rate.

    The pressure-volume throughput represented by this quantity is defined as

    $$
    Q_g = p_g \frac{dV_g}{dt}
    $$

    where $Q_g$ is gas pressure-volume throughput, $p_g$ is gas pressure at the
    flow boundary, $V_g$ is the volume of gas crossing that boundary, and $t$ is
    time.

    This quantity applies to the aggregate gas stream delivered through an
    injection system across a defined flow boundary. The stream is not
    restricted to a particular molecular species or charge state, and this
    quantity is distinct from mass flow and particle-number rate. Its defining
    distinction is the lower reliable operating bound, rather than an
    unrestricted instantaneous throughput.

    The gas flow quantity defines the same pressure-volume throughput without
    imposing a lower-limit condition; minimum gas flow is its lower reliable
    operating bound. Conversely, [maximum gas flow](name:maximum_gas_flow) is
    the upper reliable operating bound, so the two quantities delimit the
    controllable range rather than represent different throughput definitions.
  unit: Pa.m^3.s^-1

- name: minor_angle_of_pellet_injector
  description: |-
    Minor directional half-opening angle of the elliptic fragment-dispersion
    cone formed by a shattered pellet injector.
  documentation: |-
    Minor half-opening angle of the elliptic shatter cone formed by a shattered
    pellet injector is the angular separation between the cone axis and its
    boundary along the minor transverse semi-axis. It is the minor directional
    component of the angle of the pellet injector.

    $$
    \alpha_{\mathrm{minor}} = \arccos\left(\hat{u}_{\mathrm{axis}} \cdot \hat{u}_{\mathrm{minor}}\right)
    $$

    where $\alpha_{\mathrm{minor}}$ is the minor half-opening angle,
    $\hat{u}_{\mathrm{axis}}$ is the shatter-cone axis unit vector, and
    $\hat{u}_{\mathrm{minor}}$ is the unit vector along the cone's minor
    semi-axis. The quantity describes a half-angle, not the full angular
    opening; the corresponding major-direction value is the major angle of the
    pellet injector.
  unit: rad

- name: molecular_neutral_species_flow_at_outlet
  description: |-
    Molecular neutral species flow at an outlet is the pressure-volume
    throughput of one molecular neutral species removed across a pumping outlet.
    It is defined by the outlet partial pressure of that species and the
    corresponding effective pumping speed, not by total neutral pressure.
  documentation: |-
    Molecular neutral species flow at an outlet is the pressure-volume
    throughput of one molecular neutral species removed across a pumping outlet.
    It is species-specific and uses the outlet partial pressure of that
    molecular neutral species rather than the [total neutral
    pressure](name:total_neutral_pressure).

    The outlet throughput is defined by the product of the outlet species
    partial pressure and the effective pumping speed for that species:

    $$
    Q_{s,\mathrm{out}} = p_{s,\mathrm{out}} S_{s,\mathrm{out}}
    $$

    where $Q_{s,\mathrm{out}}$ is this molecular neutral species flow at the
    outlet, $p_{s,\mathrm{out}}$ is the outlet partial pressure of molecular
    neutral species $s$, and $S_{s,\mathrm{out}}$ is the effective pumping speed
    for species $s$ at the outlet.

    This quantity is an outlet removal throughput, distinct from a gas source
    into the vessel such as [gas
    injection](name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection).
    It is the molecular, species-resolved outlet form of neutral species flow
    and a species-specific specialization of gas flow.

    Sign convention: Positive when the molecular neutral species is removed
    through the outlet in the pumping direction away from the vessel.
  unit: Pa.m^3.s^-1

- name: neon_prefill_count
  description: |-
    Neon prefill count is the total amount of neutral neon (Ne) introduced
    before plasma breakdown, expressed as an equivalent-electron count with 10
    equivalent electrons per atom.
  documentation: |-
    Neon prefill count is the total amount of neutral neon (Ne) introduced
    during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral neon atom contributes 10 equivalent
    electrons.

    The equivalent-electron count is defined by

    $$
    N_{e,\mathrm{eq}}^{\mathrm{Ne,prefill}} = Z_{\mathrm{Ne}}N_{\mathrm{Ne,prefill}} = 10N_{\mathrm{Ne,prefill}} = \int_{t_0}^{t_{\mathrm{bd}}}10\dot{N}_{\mathrm{Ne}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{Ne,prefill}}$ is the neon
    equivalent-electron count and $N_{\mathrm{Ne,prefill}}$ is the accumulated
    neutral-neon atom count, both pure counts; $Z_{\mathrm{Ne}}=10$ is the
    atomic number of neon; $\dot{N}_{\mathrm{Ne}}$ is the neutral-neon atom
    introduction rate in atoms s$^{-1}$; and $t_0$ and $t_{\mathrm{bd}}$ are the
    prefill start and plasma-breakdown times, with $t$ in s.

    This quantity includes only neutral neon introduced before breakdown and
    excludes wall recycling, neutral-beam or pellet fueling, later gas
    injection, and retained or ionized inventory. The equivalent-electron
    convention is an accounting normalization based on neutral atomic
    composition, not a statement that the gas is fully ionized during prefill.
    It is the neon component of [prefill_count](name:prefill_count);
    [accumulated_neon_count](name:accumulated_neon_count) represents distinct
    post-breakdown accumulation, while
    [argon_prefill_count](name:argon_prefill_count) applies the same convention
    to a different noble gas.
  unit: '1'

- name: neon_source_rate
  description: |-
    Instantaneous injection rate of neon gas into the plasma vessel, expressed
    as an equivalent-electron count rate with ten counts assigned to each
    injected neon atom.
  documentation: |-
    Instantaneous injection rate of neon gas into the plasma vessel is the time
    rate of increase of the equivalent-electron count associated with injected
    neon. The equivalent-electron convention assigns ten counts to each injected
    neon atom, reflecting neon's atomic number.

    The defining relation to injected atom count is:

    $$
    S_\mathrm{Ne} = \frac{dN_{e,\mathrm{eq}}^\mathrm{Ne}}{dt} = 10\,\frac{dN_\mathrm{Ne}}{dt}
    $$

    where $S_\mathrm{Ne}$ is the neon source rate,
    $N_{e,\mathrm{eq}}^\mathrm{Ne}$ is the equivalent-electron count assigned to
    injected neon, $N_\mathrm{Ne}$ is the count of injected neon atoms, $t$ is
    time, and the label $\mathrm{Ne}$ denotes neon.

    This quantity is species-specific to neon gas entering the plasma vessel and
    is aggregated over the injected neon population by summing the
    equivalent-electron contributions from all injected neon atoms. It excludes
    injection of other gasses, total gas throughput, pumping or exhaust flow,
    retained neutral inventory, and source terms from wall recycling,
    sputtering, or ionization inside the plasma.

    The corresponding [accumulated neon count](name:accumulated_neon_count) is
    the time integral of $S_\mathrm{Ne}$ over the accumulation interval using
    the same factor of ten. Conversely, where differentiable, $S_\mathrm{Ne}$ is
    the time derivative of that accumulated count.

    Sign convention: Positive when neon is added to the plasma vessel.
  unit: s^-1

- name: net_efficiency_of_plant_system
  description: |-
    Dimensionless ratio quantifying how effectively a plant system delivers
    signed net electrical power to an external load relative to the total
    internal electrical consumption needed to operate it.
  documentation: |-
    The net efficiency of a plant system is the dimensionless ratio of signed
    net electrical power exported outside the plant boundary to total internal
    electrical power consumed by plant systems over the same accounting
    interval. It is the net-electrical-gain specialization of [efficiency of a
    plant system](name:efficiency_of_plant_system), with recirculating
    electrical loads included in the net exported power balance.

    The defining relation, including the corresponding net-power balance, is:

    $$
    \eta_{\mathrm{net,plant}} = \frac{P_{\mathrm{net}}}{P_{\mathrm{cons}}}, \qquad
    P_{\mathrm{net}} = P_{\mathrm{gen}} - P_{\mathrm{int}}, \qquad
    P_{\mathrm{cons}} = \sum_{i \in \mathcal{B}_{\mathrm{plant}}} P_{\mathrm{load},i}
    $$

    where $P_{\mathrm{net}}$ is the net electrical power of the plant system in
    W, $P_{\mathrm{cons}}$ is the positive total electrical consumption
    represented by [power of the plant system](name:power_of_plant_system) in W,
    $P_{\mathrm{gen}}$ is gross generated electrical power in W,
    $P_{\mathrm{int}}$ is the internal operational electrical consumption
    subtracted in the net-power balance in W, $P_{\mathrm{load},i}$ is the
    electrical consumption of included load $i$ in W, and
    $\mathcal{B}_{\mathrm{plant}}$ is the set of electrically powered plant
    loads included in the accounting boundary.

    The denominator $P_{\mathrm{cons}}$ is a gross positive consumption
    quantity, not the signed net exchange $P_{\mathrm{net}}$ and not the gross
    generated power $P_{\mathrm{gen}}$. It equals the internal-consumption term
    $P_{\mathrm{int}}$ only when the same loads, plant boundary, and interval
    define both the net-power balance and the denominator. Unlike [thermal
    efficiency of the plant system](name:thermal_efficiency_of_plant_system),
    this quantity relates net electrical export to internal electrical
    consumption rather than gross electrical output to thermal input.

    Sign convention: Positive when signed net electrical power is exported from
    the plant system to an external electrical network or load.
  unit: '1'

- name: nitrogen_prefill_count
  description: |-
    Nitrogen prefill count is the total amount of neutral nitrogen (N or N₂)
    introduced before plasma breakdown, expressed as an equivalent-electron
    count with 7 per atom or 14 per N₂ molecule.
  documentation: |-
    Nitrogen prefill count is the total amount of neutral nitrogen (N or N₂)
    introduced during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each neutral nitrogen atom contributes 7
    equivalent electrons, so each N₂ molecule contributes 14.

    The equivalent-electron count is defined by

    $$
    N_{e,\mathrm{eq}}^{\mathrm{N,prefill}} = 7N_{\mathrm{N,prefill}} + 14N_{\mathrm{N_2,prefill}} = \int_{t_0}^{t_{\mathrm{bd}}} \left[7\dot{N}_{\mathrm{N}}(t) + 14\dot{N}_{\mathrm{N_2}}(t)\right]dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{N,prefill}}$ is the equivalent-electron
    count, $N_{\mathrm{N,prefill}}$ and $N_{\mathrm{N_2,prefill}}$ are
    accumulated neutral atom and molecule counts, and $\dot{N}_{\mathrm{N}}$ and
    $\dot{N}_{\mathrm{N_2}}$ are their introduction rates. The counts are pure
    counts, the rates are in s$^{-1}$, and $t_0$ and $t_{\mathrm{bd}}$ are the
    prefill start and plasma-breakdown times in seconds.

    This quantity includes only neutral nitrogen introduced before breakdown and
    excludes wall recycling, neutral-beam or pellet fueling, later gas
    injection, and retained or ionized inventory. It is the nitrogen component
    of [prefill_count](name:prefill_count), whereas accumulated_nitrogen_count
    represents post-breakdown nitrogen accumulation.
  unit: '1'

- name: nitrogen_source_rate
  description: |-
    Instantaneous rate of neutral molecular nitrogen admitted to the plasma
    vessel, expressed as equivalent-electron particles with fourteen counts
    assigned to each molecule.
  documentation: |-
    This quantity is the equivalent-electron source rate carried by neutral
    molecular nitrogen admitted to the plasma vessel. It represents delivered
    molecular inventory, not free-electron production, ionization rate, or
    nitrogen ions retained in the plasma.

    $$
    \dot{N}_{\mathrm{eq}} = 14\,\dot{N}_{\mathrm{N_2}}
    $$

    where $\dot{N}_{\mathrm{eq}}$ is the equivalent-electron source rate and
    $\dot{N}_{\mathrm{N_2}}$ is the injection rate of nitrogen molecules. The
    factor 14 assigns seven equivalent-electron counts to each of the two
    nitrogen atoms in a molecule.

    This species-resolved rate is consistent with the aggregate [source rate due
    to gas injection](name:source_rate_due_to_gas_injection). Integrating it
    over a time interval gives the corresponding accumulated nitrogen inventory
    represented by accumulated nitrogen count.
  unit: s^-1

- name: poloidal_magnetic_flux_at_pellet_path
  description: |-
    Poloidal magnetic flux at a pellet-path point is the value of the
    equilibrium poloidal magnetic-flux function evaluated at the position of a
    pellet along its injection trajectory. For an axisymmetric equilibrium it
    depends only on the major-radius and vertical coordinates of that trajectory
    point.
  documentation: |-
    Poloidal magnetic flux at a pellet-path point is the value of the
    equilibrium [poloidal_magnetic_flux](name:poloidal_magnetic_flux) function
    sampled at the location of a pellet along its injection trajectory. It
    labels the magnetic flux surface threading that trajectory point and shares
    the sign and normalization of the underlying equilibrium flux function.

    The quantity is the equilibrium poloidal flux function evaluated at the
    pellet position:

    $$
    \psi_p = \psi\!\left(R_p, Z_p\right)
    $$

    where $\psi(R, Z)$ is the axisymmetric equilibrium poloidal magnetic-flux
    function in the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the
    major radius and $Z$ the vertical height, and $(R_p, Z_p)$ are the
    major-radius and vertical coordinates of the pellet-path point. Because the
    equilibrium is axisymmetric, $\psi$ is independent of the toroidal angle
    $\phi$, so the toroidal location of the trajectory point does not enter this
    value.

    This is one scalar flux value associated with a single point on the pellet
    trajectory; sampled at successive points or instants along the path it
    traces the sequence of flux-surface labels crossed by the pellet. It differs
    from
    [poloidal_magnetic_flux_at_flux_surface](name:poloidal_magnetic_flux_at_flux_surface),
    which is the flux value attached to a specified magnetic flux surface
    independent of any trajectory. It is not the toroidal magnetic flux, the
    pellet trajectory geometry, or a derivative of the flux label with respect
    to a flux coordinate.

    Sign convention: Positive when the vertical magnetic field on the horizontal
    disk that defines the equilibrium poloidal flux points in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: Wb

- name: power_of_plant_subsystem
  description: |-
    Real electrical power consumed by an individual plant subsystem at its
    electrical boundary, contributing to auxiliary-load accounting without
    including plant-wide aggregation.
  documentation: |-
    This quantity is the real electrical power consumed by one plant subsystem
    at its electrical boundary. It represents the subsystem's contribution to
    auxiliary electrical load, distinct from plant-wide aggregation and net
    electrical balance quantities.

    $$
    P_{\rm sub} = \left\langle v(t)i(t) \right\rangle_t
    $$

    where $P_{\rm sub}$ is the boundary real power, $v(t)$ is the instantaneous
    terminal voltage, $i(t)$ is the instantaneous current directed into the
    subsystem, and $\langle\cdot\rangle_t$ denotes averaging over the relevant
    operating interval. For multiple terminals, the boundary power is the
    algebraic sum of the terminal power contributions. Positive power denotes
    consumption by the subsystem; exported or generated power is not included as
    consumed load. The quantity is distinct from absorbed power of a plant
    system, total power of a plant system, and net power of a plant system.
  unit: W

- name: power_of_plant_system
  description: |-
    Real electrical power assigned at a plant-system boundary, representing
    absorbed load, net generation balance, or an aggregate of included system
    loads.
  documentation: |-
    Real electrical power is the rate of electrical-energy transfer or
    accounting associated with a plant system at its electrical boundary. It
    excludes reactive power and other non-electrical energy flows.

    The instantaneous power is defined by

    $$
    P = \frac{\mathrm{d}E}{\mathrm{d}t}
    $$

    where $E$ is the electrical energy associated with the accounting boundary
    and $t$ is time.

    The accounting convention is fixed by the specialized quantity. Absorbed
    power of a plant system represents one-way incoming electrical load, net
    power of a plant system represents generation minus internal consumption and
    is positive for net export, and total power of a plant system is the sum of
    the loads of all included systems. These forms are distinct applications of
    the same plant-boundary electrical-power concept.
  unit: W

- name: prefill_gas_pressure
  description: |-
    Pressure of the neutral gas introduced before plasma breakdown, governing
    the pressure-dependent ionization conditions for early electron-avalanche
    breakdown.
  documentation: |-
    Prefill gas pressure is the thermodynamic pressure of the neutral gas
    present before plasma breakdown. It establishes the gas conditions used in
    the Townsend electron-avalanche criterion during plasma initiation.

    For an ideal neutral gas, pressure is related to particle density and
    temperature by:

    $$
    p_g = n_g k_B T_g
    $$

    where $p_g$ is the prefill gas pressure, $n_g$ is the neutral particle
    number density, $k_B$ is Boltzmann's constant, and $T_g$ is the neutral-gas
    temperature. This ideal-gas relation applies when the ideal-gas
    approximation is valid.

    This quantity describes the prebreakdown gas state; it is not the
    accumulated injected inventory represented by
    [prefill_count](name:prefill_count) or the pressure of the plasma formed
    after breakdown.
  unit: Pa

- name: propane_prefill_count
  description: |-
    Propane prefill count is the total amount of C3H8 introduced before plasma
    breakdown, expressed as an equivalent-electron count with 26 count units per
    neutral propane molecule.
  documentation: |-
    Propane prefill count is the total amount of neutral propane (C3H8)
    introduced during the prefill phase before plasma breakdown, expressed as an
    equivalent-electron count. Each propane molecule contributes 26 equivalent
    electrons: 18 from three carbon atoms and 8 from eight hydrogen atoms.

    The equivalent-electron count is obtained by accumulating the injected
    propane molecules over the prefill interval:

    $$
    N_{e,\mathrm{eq}}^{\mathrm{C_3H_8,prefill}} = (3Z_C + 8Z_H)N_{\mathrm{C_3H_8,prefill}} = 26N_{\mathrm{C_3H_8,prefill}} = \int_{t_0}^{t_\mathrm{bd}} \dot{N}_{\mathrm{C_3H_8}}(t)\,dt
    $$

    where $N_{e,\mathrm{eq}}^{\mathrm{C_3H_8,prefill}}$ is the
    equivalent-electron count, $N_{\mathrm{C_3H_8,prefill}}$ is the accumulated
    propane molecule count, $Z_C=6$ and $Z_H=1$ are the atomic numbers of carbon
    and hydrogen, $\dot{N}_{\mathrm{C_3H_8}}$ is the propane molecule injection
    rate, $t_0$ is the start of prefill, and $t_\mathrm{bd}$ is the
    plasma-breakdown time.

    This quantity includes only propane introduced before breakdown and excludes
    later fueling, other gas species, and the retained or ionized inventory. It
    uses the common equivalent-electron bookkeeping of
    [prefill_count](name:prefill_count), with
    [ethane_prefill_count](name:ethane_prefill_count) providing the analogous
    molecular-species convention.
  unit: '1'

- name: propane_source_rate
  description: |-
    Instantaneous propane (C3H8) injection rate into the plasma vessel,
    converted from molecules to equivalent electrons using 26 electrons per
    neutral molecule.
  documentation: |-
    This quantity is the instantaneous source rate of propane gas entering the
    plasma vessel, expressed using the equivalent-electron convention. Each
    neutral C3H8 molecule contributes the total electron count of its
    constituent atoms.

    The equivalent-electron source rate is defined by

    $$
    S_{\mathrm{C_3H_8}}(t)=26\,\dot{N}_{\mathrm{C_3H_8}}(t)
    $$

    where $S_{\mathrm{C_3H_8}}(t)$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{C_3H_8}}(t)$ is the propane molecular injection rate in
    molecules per second, $t$ is time, and 26 is the dimensionless electron
    count per neutral molecule: three carbon atoms contribute 18 electrons and
    eight hydrogen atoms contribute 8 electrons. This is an instantaneous rate,
    distinct from the accumulated propane count, which is the time-integrated
    equivalent-electron inventory.
  unit: s^-1

- name: radial_velocity_of_pellet
  description: |-
    Signed major-radius component of the pellet center-of-mass velocity,
    describing motion toward or away from the toroidal symmetry axis in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the signed major-radius component of the translational
    velocity of the pellet center of mass. It resolves motion in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    The radial velocity is defined by:

    $$
    v_R = \mathbf{v}_{\mathrm{cm}} \cdot \hat{R} = \frac{dR_{\mathrm{cm}}}{dt}
    $$

    where $v_R$ is the radial velocity component, $\mathbf{v}_{\mathrm{cm}}$ is
    the center-of-mass translational velocity vector, $\hat{R}$ is the unit
    vector toward increasing major radius, $R_{\mathrm{cm}}$ is the
    center-of-mass major-radius coordinate, and $t$ is time.

    The quantity applies to the pellet center of mass. For fragment-resolved
    motion, it applies to the individual fragment center of mass; for collective
    fragment-cloud motion, it applies to the cloud center of mass at the shatter
    cone origin. The cloud center of mass is mass-weighted, rather than an
    equal-weight average of fragment positions, and its motion is distinct from
    the spread of individual fragment velocities.

    This component is not the total speed, a flux-surface-normal velocity, or
    rotational motion about the represented center of mass. Together with the
    [toroidal velocity](name:toroidal_velocity_of_pellet) and [vertical
    velocity](name:vertical_velocity_of_pellet), it specifies the translational
    velocity vector when all components refer to the same entity and instant.
    For the pellet at vacuum-chamber entry, it is the radial component of the
    [initial velocity](name:initial_velocity_of_pellet); the radial quantity
    itself is not restricted to that instant.

    Sign convention: Positive when the represented center of mass moves toward
    increasing major radius $R$, away from the toroidal symmetry axis.
  unit: m.s^-1

- name: shattered_pellet_species_number_density_of_pellet_fragment
  description: |-
    Number density of a specified atomic species within the solid material of an
    individual shattered-pellet fragment.
  documentation: |-
    This quantity is the local volumetric abundance of one selected atomic
    species in the material composing an individual shattered-pellet fragment.

    It is defined by

    $$
    n_s = \frac{N_s}{V_f}
    $$

    where $n_s$ is the number density of the selected atomic species, $N_s$ is
    its number of constituent atoms in the fragment, and $V_f$ is the physical
    volume occupied by the fragment.

    The scope is restricted to one fragment and one specified atomic species in
    the fragment material. The quantity is species-selective rather than summed
    over different species, and it describes pellet composition rather than the
    number density of particles in the surrounding plasma. No plasma
    ionization-state aggregation or charge-state resolution is implied.

    Multiplying this density by the fragment volume gives the corresponding
    constituent-atom count. It therefore provides a fragment-local density
    counterpart to the whole-pellet inventory represented by atomic count of
    pellet, while [fast neutral internal state number
    density](name:fast_neutral_internal_state_number_density) describes a
    plasma-particle population distinguished by internal state.
  unit: m^-3

- name: silane_source_rate
  description: |-
    Instantaneous injection rate of silane (SiH4) gas into the plasma vessel,
    expressed as an electron-equivalent particle rate with 18 equivalent
    electrons for each SiH4 molecule.
  documentation: |-
    Instantaneous injection rate of silane ($\mathrm{SiH}_4$) gas into the
    plasma vessel is the silane gas source rate expressed on an
    electron-equivalent particle-counting basis. Each $\mathrm{SiH}_4$ molecule
    contributes 18 equivalent electrons, equal to the total electron count of a
    neutral molecule.

    The conversion from a molecular silane injection rate to this
    electron-equivalent source rate is

    $$
    S_{\mathrm{SiH}_4}=18\,\dot{N}_{\mathrm{SiH}_4}
    $$

    where $S_{\mathrm{SiH}_4}$ is the silane source rate,
    $\dot{N}_{\mathrm{SiH}_4}$ is the molecular injection rate of neutral silane
    into the plasma vessel, and 18 is the electron-equivalent count of one
    neutral $\mathrm{SiH}_4$ molecule.

    This quantity applies only to silane gas introduced into the plasma vessel
    and is aggregated over all silane introduced into that vessel on the same
    electron-equivalent basis. It excludes source rates for other gasses, total
    gas-source rates, silicon-only or hydrogen-only atomic source rates, mass
    flow, neutral-gas inventory, and pressure.

    The silane source count is the time integral of $S_{\mathrm{SiH}_4}$ using
    the same factor of 18 between molecular count and electron-equivalent count.
    This quantity is the silane analog of the [ethylene source
    rate](name:ethylene_source_rate) and [ethane source
    rate](name:ethane_source_rate); the molecular identity fixes the conversion
    factor in each case.

    Sign convention: Positive when silane is added to the plasma vessel.
  unit: s^-1

- name: source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron source rate delivered to the plasma vessel
    by gas injection systems, where each injected atom contributes Z equivalent
    electrons per second according to its atomic number.
  documentation: |-
    The source rate due to gas injection characterizes the instantaneous rate at
    which neutral gas is admitted to the plasma vessel by gas injection
    hardware, expressed as an equivalent-electron count rate. Every injected
    atom of atomic number $Z$ contributes $Z$ equivalent electrons per second to
    the total inventory rate, providing a unified accounting framework across
    species of differing nuclear charge.

    The defining relation for a single injected species is:

    $$
    \dot{S} = Z \cdot \dot{N}_{\mathrm{atoms}}
    $$

    where $\dot{N}_{\mathrm{atoms}}$ is the raw atomic delivery rate in atoms
    per second and $Z$ is the atomic number of the injected species. For
    simultaneous multi-species injection, contributions are summed over all
    active species.

    This rate is inferred from calibrated mass-flow controllers or upstream
    pressure-rise measurements on the gas supply plumbing. It is the
    instantaneous time derivative of the corresponding accumulated
    equivalent-electron inventories, such as
    [accumulated_argon_count](name:accumulated_argon_count) or
    accumulated_hydrogen_count_due_to_gas_injection. The nearest-peer quantity
    gas_particle_source_rate_over_vessel_due_to_gas_injection provides the
    vessel-integrated analog expressed in raw gas-phase particles rather than
    equivalent electrons.
  unit: s^-1

- name: argon_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron argon source rate delivered to the plasma
    vessel by gas injection systems, where each injected argon atom with Z = 18
    contributes 18 equivalent-electron counts.
  documentation: |-
    The argon source rate due to gas injection characterizes the instantaneous
    rate at which neutral argon with atomic number $Z_{\mathrm{Ar}} = 18$ is
    admitted to the plasma vessel by gas injection hardware, expressed as an
    equivalent-electron count rate. The equivalent-electron convention counts
    each injected neutral argon atom as 18 equivalent electrons because neutral
    argon has 18 electrons; this is an inventory-accounting convention, not a
    statement about subsequent ionization or confinement.

    The defining relation for injected argon is:

    $$
    \dot{S}_{\mathrm{Ar}} = Z_{\mathrm{Ar}}\,\dot{N}_{\mathrm{Ar}} = 18\,\dot{N}_{\mathrm{Ar}}
    $$

    where $\dot{S}_{\mathrm{Ar}}$ is the argon equivalent-electron source rate,
    $\dot{N}_{\mathrm{Ar}}$ is the raw argon-atom delivery rate in atoms per
    second, and $Z_{\mathrm{Ar}} = 18$ is the dimensionless atomic number of
    argon.

    This quantity is the argon-species member of
    [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection).
    It is the instantaneous time derivative of the corresponding accumulated
    equivalent-electron inventory
    [accumulated_argon_count](name:accumulated_argon_count), and differs from
    raw gas-particle source rates by the factor $Z_{\mathrm{Ar}}$.

    Sign convention: Positive when argon is delivered into the plasma vessel,
    increasing the equivalent-electron particle inventory.
  unit: s^-1

- name: beryllium_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron source rate of beryllium atoms introduced
    by gas injection, with four equivalent electrons assigned to each atom.
  documentation: |-
    This quantity is the instantaneous rate of beryllium supplied by gas
    injection, represented using an equivalent-electron counting convention. It
    describes injected beryllium input rather than the creation rate of free
    plasma electrons or a time-integrated beryllium inventory.

    The equivalent-electron rate is defined from the beryllium atom injection
    rate by

    $$
    \dot{N}_{\mathrm{eq,Be}}(t) = Z_{\mathrm{Be}}\,\dot{N}_{\mathrm{Be}}(t)
    $$

    where $N_{\mathrm{eq,Be}}$ is the equivalent-electron count assigned to
    injected beryllium, $N_{\mathrm{Be}}$ is the number of injected beryllium
    atoms, $Z_{\mathrm{Be}}$ is the atomic number of beryllium, $t$ is time, and
    the dot denotes differentiation with respect to time. For beryllium,
    $Z_{\mathrm{Be}}=4$.

    The scope is beryllium delivered by gas injection alone, aggregated over all
    injected beryllium atoms. It excludes source contributions from other
    species and other injection mechanisms, and it is not a
    charge-state-resolved plasma source; the equivalent-electron convention
    assigns four counts per injected beryllium atom.

    This is the beryllium-specific member of the gas-injection source-rate
    family, using the same equivalent-electron basis as the [hydrogen
    gas-injection source rate](name:hydrogen_source_rate_due_to_gas_injection),
    [helium-4 gas-injection source
    rate](name:helium_4_source_rate_due_to_gas_injection), and [lithium
    gas-injection source rate](name:lithium_source_rate_due_to_gas_injection).
    Unlike the broader [electron source rate due to
    injection](name:electron_source_rate_due_to_injection), it isolates the
    nuclear-charge-weighted beryllium contribution. Integrating this
    instantaneous rate over a time interval gives the corresponding accumulated
    equivalent-electron inventory.
  unit: s^-1

- name: carbon_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron carbon source rate delivered to the plasma
    vessel by gas injection systems, with each injected carbon atom contributing
    six equivalent-electron counts.
  documentation: |-
    The carbon source rate due to gas injection characterizes the instantaneous
    rate at which neutral carbon with atomic number six is admitted to the
    plasma vessel by gas injection, expressed as an equivalent-electron count
    rate. It is the carbon-specific component of [source rate due to gas
    injection](name:source_rate_due_to_gas_injection).

    For carbon injection, the defining relation is:

    $$
    \dot{S}_{\mathrm{C}} = 6\,\dot{N}_{\mathrm{C}}
    $$

    where $\dot{S}_{\mathrm{C}}$ is the equivalent-electron source rate and
    $\dot{N}_{\mathrm{C}}$ is the raw carbon-atom delivery rate; both rates have
    units of inverse seconds.

    This quantity counts injected carbon atoms, not electrons currently present
    in the plasma, carbon ionization states, or the net carbon balance after
    transport and removal. Its time integral gives [accumulated carbon count due
    to gas injection](name:accumulated_carbon_count_due_to_gas_injection). The
    same equivalent-electron convention applies to [tritium source rate due to
    gas injection](name:tritium_source_rate_due_to_gas_injection), with a
    different atomic-number factor.

    Sign convention: Positive when carbon gas is delivered into the vessel,
    increasing the equivalent-electron inventory.
  unit: s^-1

- name: helium_3_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron helium-3 source rate delivered to the
    plasma vessel by gas injection systems, where each injected helium-3 atom
    contributes two equivalent-electron counts.
  documentation: |-
    The helium-3 source rate due to gas injection characterizes the
    instantaneous rate at which neutral helium-3 is admitted to the plasma
    vessel by gas-injection hardware, expressed as an equivalent-electron count
    rate. Each helium-3 atom contributes two equivalent-electron counts because
    helium has atomic number $Z_{\mathrm{He}} = 2$.

    The defining relation is:

    $$
    \dot{S}_{^{3}\mathrm{He},\mathrm{gas}} = Z_{\mathrm{He}}\,\dot{N}_{^{3}\mathrm{He},\mathrm{gas}} = 2\,\dot{N}_{^{3}\mathrm{He},\mathrm{gas}}
    $$

    where $\dot{S}_{^{3}\mathrm{He},\mathrm{gas}}$ is the helium-3
    equivalent-electron source rate due to gas injection,
    $\dot{N}_{^{3}\mathrm{He},\mathrm{gas}}$ is the raw neutral helium-3 atomic
    delivery rate due to gas injection, and $Z_{\mathrm{He}}$ is the atomic
    number of helium.

    This quantity is isotope-specific: it applies only to neutral helium-3 gas
    admitted through gas injection and is aggregated over all gas-injection
    paths feeding the plasma vessel. It excludes helium-4 and other injected
    species, particle sources not due to gas injection, and raw gas-particle
    accounting represented by the gas particle source rate over vessel due to
    gas injection.

    It is the time derivative of the [accumulated helium-3 count due to gas
    injection](name:accumulated_helium_3_count_due_to_gas_injection) under the
    same equivalent-electron weighting. Summing species-specific
    equivalent-electron source rates over active injected species gives the
    [source rate due to gas injection](name:source_rate_due_to_gas_injection).
    The [helium-4 source rate due to gas
    injection](name:helium_4_source_rate_due_to_gas_injection) uses the same
    helium atomic-number weighting but applies to a different isotope, whereas
    the [hydrogen source rate due to gas
    injection](name:hydrogen_source_rate_due_to_gas_injection) differs through
    the hydrogen atomic number.

    Sign convention: Positive when helium-3 gas is delivered into the plasma
    vessel, increasing the helium-3 equivalent-electron inventory.
  unit: s^-1

- name: helium_4_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron source rate of helium-4 delivered to the
    plasma vessel by gas injection, with each helium-4 atom contributing two
    equivalent-electron counts.
  documentation: |-
    The helium-4 source rate due to gas injection characterizes the
    instantaneous rate at which neutral helium-4 is admitted to the plasma
    vessel by gas-injection hardware, expressed as an equivalent-electron count
    rate. Each helium-4 atom contributes two counts because helium has atomic
    number 2.

    The defining relation is:

    $$
    \dot{S}_{\mathrm{He4}} = Z_{\mathrm{He}}\,\dot{N}_{\mathrm{He4}} = 2\,\dot{N}_{\mathrm{He4}}
    $$

    where $\dot{S}_{\mathrm{He4}}$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{He4}}$ is the helium-4 atom delivery rate in atoms per
    second, and $Z_{\mathrm{He}}=2$ is helium's atomic number. This is the
    helium-4 component of the [source rate due to gas
    injection](name:source_rate_due_to_gas_injection); integrating it over time
    gives the [accumulated helium-4 count due to gas
    injection](name:accumulated_helium_4_count_due_to_gas_injection). The
    [helium-3 source rate due to gas
    injection](name:helium_3_source_rate_due_to_gas_injection) uses the same
    atomic-number weighting but represents a separate isotope inventory.

    Sign convention: Positive when helium-4 gas is delivered into the vessel,
    increasing the equivalent-electron particle inventory.
  unit: s^-1

- name: hydrogen_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron hydrogen source rate delivered to the
    plasma vessel by gas injection systems; each hydrogen atom contributes one
    equivalent-electron count.
  documentation: |-
    The hydrogen source rate due to gas injection characterizes the
    instantaneous rate at which neutral hydrogen atoms are admitted to the
    plasma vessel by gas injection, expressed as an equivalent-electron count
    rate. Because hydrogen has atomic number one, each atom contributes one
    equivalent-electron count.

    The defining relation is:

    $$
    \dot{S}_{\mathrm{H}} = Z_{\mathrm{H}}\dot{N}_{\mathrm{H}} = \dot{N}_{\mathrm{H}}, \qquad Z_{\mathrm{H}} = 1
    $$

    where $\dot{S}_{\mathrm{H}}$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{H}}$ is the neutral hydrogen-atom delivery rate in atoms
    per second, and $Z_{\mathrm{H}}$ is the hydrogen atomic number. This is the
    hydrogen component of the total [source rate due to gas
    injection](name:source_rate_due_to_gas_injection). Its time integral gives
    the accumulated hydrogen inventory [accumulated hydrogen count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection).

    Sign convention: Positive when hydrogen gas is being delivered into the
    vessel, increasing the equivalent-electron inventory.
  unit: s^-1

- name: krypton_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron krypton source rate delivered to the
    plasma vessel by gas injection systems, where each injected krypton atom
    with Z = 36 contributes 36 equivalent-electron counts.
  documentation: |-
    The krypton source rate due to gas injection characterizes the instantaneous
    rate at which neutral krypton with atomic number $Z_{\mathrm{Kr}} = 36$ is
    admitted to the plasma vessel by gas injection hardware, expressed as an
    equivalent-electron count rate. Each neutral krypton atom contributes
    $Z_{\mathrm{Kr}}$ equivalent electrons to the equivalent particle inventory;
    this accounting uses nuclear charge and does not imply ionization at the
    injection location.

    The defining relation for krypton injection is:

    $$
    \dot{S}_{\mathrm{Kr}} = Z_{\mathrm{Kr}}\,\dot{N}_{\mathrm{Kr}} = 36\,\dot{N}_{\mathrm{Kr}}
    $$

    where $\dot{S}_{\mathrm{Kr}}$ is the krypton equivalent-electron source rate
    in equivalent-electron counts per second, $\dot{N}_{\mathrm{Kr}}$ is the
    neutral krypton atom delivery rate in atoms per second, and $Z_{\mathrm{Kr}}
    = 36$ is the atomic number of krypton.

    This is the krypton-species contribution to
    [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection)
    and is the instantaneous time derivative of
    [accumulated_krypton_count](name:accumulated_krypton_count) when the same
    equivalent-electron accounting is used. It excludes krypton supplied by
    mechanisms other than gas injection and differs from
    gas_particle_source_rate_over_vessel_due_to_gas_injection, which is counted
    as raw gas-phase particles rather than equivalent electrons. It is directly
    parallel to same-family species quantities such as
    [argon_source_rate_due_to_gas_injection](name:argon_source_rate_due_to_gas_injection),
    differing by the injected species and its atomic number.
  unit: s^-1

- name: lithium_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron lithium source rate delivered to the
    plasma vessel by gas injection systems, with each injected lithium atom
    contributing three equivalent-electron counts.
  documentation: |-
    The lithium source rate due to gas injection characterizes the instantaneous
    rate at which neutral lithium with atomic number $Z_{\mathrm{Li}}=3$ is
    admitted to the plasma vessel by gas injection hardware, expressed as an
    equivalent-electron count rate. It is the lithium-specific component of the
    [source rate due to gas injection](name:source_rate_due_to_gas_injection),
    rather than the raw lithium-atom delivery rate.

    For lithium, the defining relation is:

    $$
    \dot{S}_{\mathrm{Li}} = Z_{\mathrm{Li}}\dot{N}_{\mathrm{Li}} = 3\dot{N}_{\mathrm{Li}}
    $$

    where $\dot{S}_{\mathrm{Li}}$ is the lithium equivalent-electron source
    rate, $\dot{N}_{\mathrm{Li}}$ is the raw lithium atom delivery rate in atoms
    per second, and $Z_{\mathrm{Li}}=3$ is lithium's dimensionless atomic
    number.

    The equivalent-electron convention assigns three source counts to each
    injected lithium atom and excludes other gas species. This rate is the time
    derivative of the corresponding accumulated lithium count; its atomic-number
    weighting distinguishes it from the [helium-3 source rate due to gas
    injection](name:helium_3_source_rate_due_to_gas_injection).

    Sign convention: Positive when lithium is delivered into the vessel,
    increasing the equivalent-electron particle inventory.
  unit: s^-1

- name: oxygen_source_rate_due_to_gas_injection
  description: |-
    Instantaneous oxygen injection rate from gas fueling, expressed on an
    equivalent-electron basis with eight equivalent electrons assigned to each
    oxygen atom.
  documentation: |-
    This quantity is the instantaneous source rate of oxygen atoms supplied by
    gas injection, expressed using an equivalent-electron weighting. It
    describes injected oxygen input, not the subsequent oxygen population or its
    ionization state.

    The equivalent-electron source rate is defined from the oxygen-atom
    injection rate by:

    $$
    \dot{N}_{\mathrm{eq,O}}(t) = 8\,\dot{N}_{\mathrm{O}}(t)
    $$

    where $t$ is physical time, $\dot{N}_{\mathrm{eq,O}}(t)$ is the oxygen
    source rate on the equivalent-electron basis, $\dot{N}_{\mathrm{O}}(t)$ is
    the injected oxygen-atom rate, and the factor $8$ is the atomic number of
    oxygen.

    The scope is oxygen introduced by gas injection; contributions from other
    species and from non-gas-injection sources are excluded. The rate is
    instantaneous and aggregates the injected oxygen amount over the
    gas-injection input, weighting each oxygen atom by eight equivalent
    electrons. This bookkeeping weighting does not represent physical
    free-electron production and does not resolve oxygen charge states.

    Time integration of this rate over the post-breakdown interval gives the
    corresponding accumulated equivalent-electron inventory represented by
    [accumulated oxygen count due to gas
    injection](name:oxygen_count_accumulated_due_to_gas_injection); unlike that
    quantity, this standard name denotes the instantaneous source rate.
  unit: s^-1

- name: thermal_power_of_breeder_blanket
  description: |-
    Thermal power of the breeder blanket is the integrated non-nuclear heat load
    entering the blanket through its plasma-facing surface, excluding volumetric
    neutron and photon heating. It is a blanket-level surface-deposition power,
    distinct from module-level coolant heat removal.
  documentation: |-
    Thermal power of the breeder blanket is the total rate at which non-nuclear
    thermal energy enters the breeder blanket through its plasma-facing surface.
    It represents an integrated surface heat load on the blanket, not a local
    heat-flux density.

    For a surface heat-load representation, the integrated power is defined by
    the area integral of the local non-nuclear heat flux entering the blanket:

    $$
    P_{\mathrm{th,bb}} = \int_{A_{\mathrm{pf,bb}}} q_{\mathrm{th}} \, dA
    $$

    where $P_{\mathrm{th,bb}}$ is the thermal power of the breeder blanket,
    $A_{\mathrm{pf,bb}}$ is the plasma-facing surface area of the breeder
    blanket included in the blanket-level total, $q_{\mathrm{th}}$ is the local
    non-nuclear heat-flux density directed into the blanket, and $dA$ is the
    surface element.

    This quantity excludes volumetric neutron and photon energy deposition in
    blanket material, which is represented by
    [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).
    It also differs from thermal_power_of_breeder_blanket_module, which denotes
    module-level thermal power associated with an individual breeder-blanket
    module rather than the blanket-level plasma-facing surface load.
  unit: W

- name: toroidal_coordinate_at_pellet_path_point
  description: |-
    Azimuthal location of a sampled point along the pellet path in the
    right-handed cylindrical (R, φ, Z) frame about the machine symmetry axis.
    Phi increases counterclockwise when viewed from above +Z.
  documentation: |-
    Azimuthal location of a sampled point along the pellet path is the toroidal
    coordinate $\phi$ of that point about the machine symmetry axis. It is the
    angular component of the point position in the right-handed cylindrical $(R,
    \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi}, \hat{Z})$, where $R$ is
    major radius, $\phi$ is the [toroidal angle](name:toroidal_angle), and $Z$
    is vertical height.

    For the same point projected onto the plane perpendicular to the symmetry
    axis, using the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis
    with $\hat{z}=\hat{Z}$ and $\hat{x}$ defining $\phi=0$, the coordinate is
    defined by the oriented azimuth:

    $$
    \phi = \operatorname{atan2}(y, x)
    $$

    where $x$ is the coordinate along $\hat{x}$, $y$ is the coordinate along
    $\hat{y}$, and $\operatorname{atan2}(y,x)$ is the quadrant-resolving azimuth
    to the transverse projection of the pellet path point.

    The scope is a single geometrical point on the pellet path; the quantity is
    point-local and is not averaged or accumulated over any segment of the path.
    It is an absolute coordinate, not a toroidal offset from another locus, and
    it is not the radial coordinate $R$, the vertical coordinate $Z$, path
    length, velocity, or injection direction.

    This quantity is the pellet-path-point specialization of [toroidal
    angle](name:toroidal_angle). Together with the corresponding $R$ and $Z$
    coordinates in the right-handed cylindrical $(R, \phi, Z)$ frame, it
    identifies the point up to the angular periodicity of $\phi$.

    Sign convention: Positive when rotation from the $\phi=0$ reference
    direction toward the point projection is counterclockwise about the symmetry
    axis when viewed from above $+\hat{Z}$.
  unit: rad

- name: toroidal_coordinate_at_shattering_position
  description: |-
    Toroidal azimuthal coordinate of the point where the pellet center-of-mass
    trajectory intersects the shattering element.
  documentation: |-
    The toroidal coordinate of the shattering position is the azimuthal
    coordinate of the intersection between the pellet center-of-mass trajectory
    and the shattering element.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, its coordinate is
    defined by

    $$
    \mathbf{r}_s = R_s(\cos\phi_s\,\hat{x} + \sin\phi_s\,\hat{y}) + Z_s\hat{z}
    $$

    where $\mathbf{r}_s$ is the shattering-position vector, $R_s$ is its
    major-radius coordinate, $Z_s$ is its vertical coordinate, $\phi_s$ is this
    toroidal coordinate, and $(\hat{x},\hat{y},\hat{z})$ is the right-handed
    Cartesian basis with $\hat{z}=\hat{Z}$.

    This event-location coordinate is distinct from the [toroidal coordinate at
    a pellet path point](name:toroidal_coordinate_at_pellet_path_point) and from
    the [toroidal coordinate of a pellet
    fragment](name:toroidal_coordinate_of_pellet_fragment), which refer to
    different physical locations.

    Sign convention: Positive when the angular displacement from the $\phi=0$
    reference is in the direction of increasing toroidal angle $\phi$.
  unit: rad

- name: toroidal_coordinate_of_pellet
  description: |-
    Toroidal azimuthal coordinate of a pellet’s center of mass, locating the
    pellet around the machine symmetry axis in cylindrical geometry.
  documentation: |-
    This quantity is the azimuthal position of the pellet center of mass around
    the toroidal symmetry axis, expressed as the angle coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The toroidal coordinate is defined from the horizontal Cartesian coordinates
    of the pellet center of mass by

    $$
    \phi = \operatorname{atan2}(y,x)
    $$

    where $x$ and $y$ are the horizontal Cartesian coordinates in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis, with
    $\hat{z}=\hat{Z}$. The coordinate is periodic over one complete toroidal
    circuit and identifies the pellet’s azimuthal location, distinct from the
    post-shattering [toroidal coordinate of a pellet
    fragment](name:toroidal_coordinate_of_pellet_fragment).

    The angle uses the same geometric convention as the general [toroidal
    angle](name:toroidal_angle), but is evaluated at the pellet center of mass.

    Sign convention: Positive when increasing $phi$ follows the direction of
    increasing toroidal angle in the right-handed cylindrical $(R, \phi, Z)$
    frame, counter-clockwise when viewed from above $+\hat{Z}$.
  unit: rad

- name: toroidal_coordinate_of_pellet_fragment
  description: |-
    Azimuthal location of a shattered-pellet fragment’s center of mass around
    the machine symmetry axis, expressed in the right-handed cylindrical (R, φ,
    Z) frame.
  documentation: |-
    The quantity is the toroidal angle $\phi_f$ of a shattered-pellet fragment’s
    center of mass. It specifies that position around the machine symmetry axis
    in the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ frame, whose
    coordinate values are $(R,\phi,Z)$; $R$ is major radius and $Z$ is vertical
    height.

    Using Cartesian coordinates $(x_f,y_f,z_f)$ of the same center of mass in
    the right-handed $(\hat{x},\hat{y},\hat{z})$ basis, the toroidal angle is

    $$
    \phi_f = \operatorname{atan2}(y_f,x_f)
    $$

    where $\operatorname{atan2}$ gives the oriented azimuth relative to the
    defined $\phi=0$ direction. The angle is periodic modulo $2\pi$ and is
    distinct from the [toroidal coordinate at the shattering
    position](name:toroidal_coordinate_at_shattering_position) and the [toroidal
    coordinate of the intact pellet](name:toroidal_coordinate_of_pellet).

    Sign convention: Positive when the fragment center of mass lies in the
    direction of increasing toroidal angle $\phi$.
  unit: rad

- name: total_gas_source_rate_at_midplane_due_to_gas_injection
  description: |-
    Gas source rate at midplane due to gas injection is the non-negative total
    unweighted rate at which neutral gas particles are injected by gas valves
    assigned to the vessel equatorial midplane. It is not an electron-equivalent
    or charge-weighted rate.
  documentation: |-
    Gas source rate at midplane due to gas injection is the instantaneous total
    unweighted source rate of neutral gas particles injected by gas-injection
    valves assigned to the vessel equatorial midplane. It counts injected
    neutral gas particles themselves, not electron-equivalent particles,
    charge-weighted particles, or particles produced by later plasma or wall
    interactions.

    For the set of midplane injection valves, the total rate is the sum of the
    individual unweighted valve particle throughputs:

    $$
    \dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}} = \sum_{k \in \mathcal{M}_{\mathrm{mid}}} \dot{N}_k
    $$

    where $\dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}}$ is the gas source rate at
    midplane due to gas injection, $\mathcal{M}_{\mathrm{mid}}$ is the set of
    gas-injection valves assigned to the vessel equatorial midplane, and
    $\dot{N}_k$ is the unweighted neutral-particle throughput of valve $k$.

    The total includes all gas-injection valves in the midplane group and
    excludes upper, lower, wall, recycling, pumping, ionization, and transport
    contributions. It is not additive with regional gas-source quantities that
    use an electron-equivalent or charge-weighted convention. Its time integral
    is the corresponding [accumulated total gas count at midplane due to gas
    injection](name:accumulated_total_gas_count_at_midplane_due_to_gas_injection).
  unit: s^-1

- name: total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection
  description: |-
    Instantaneous total rate at which neutral gas is introduced into the lower
    vacuum-vessel region by gas injection valves, summed over lower-region
    valves and expressed using the equivalent-electron convention across
    injected species.
  documentation: |-
    Instantaneous total rate at which neutral gas is introduced into the lower
    vacuum-vessel region by gas injection valves is the lower-region aggregate
    equivalent-electron source rate due to gas injection. It counts each
    injected neutral atom or molecule by the number of electrons associated with
    its neutral composition and sums over all injected species and all
    lower-region gas-injection valves.

    The multi-species aggregate is defined by:

    $$
    \dot{N}_{e,\mathrm{eq}}^{\mathrm{lower}} = \sum_{v \in \mathrm{lower}} \sum_m E_m\,\dot{N}_{v,m}
    $$

    where $\dot{N}_{e,\mathrm{eq}}^{\mathrm{lower}}$ is this total lower gas
    source rate, $\dot{N}_{v,m}$ is the neutral gas injection rate of atomic or
    molecular species $m$ from lower-region valve $v$, and $E_m = \sum_a
    \nu_{a,m} Z_a$ is the equivalent-electron count for one neutral injected
    particle of species $m$, with $\nu_{a,m}$ the stoichiometric count of atom
    $a$ in species $m$ and $Z_a$ its atomic number.

    This quantity is an injected source into the vacuum vessel and excludes
    pumping, wall recycling, ionization losses after entry, and gas introduced
    outside the lower region. Species-level quantities such as [neon source
    rate](name:neon_source_rate) and [propane source
    rate](name:propane_source_rate) are individual species contributions under
    the same equivalent-electron convention; gas source rate of the vacuum
    vessel due to gas injection is the vessel-level source quantity without the
    lower-region restriction.

    Sign convention: Positive when neutral gas is introduced into the vacuum
    vessel through lower-region injection valves.
  unit: s^-1

- name: total_neutral_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron source rate of neutral gas introduced into
    the vessel by gas injection, summed over all injected species.
  documentation: |-
    This quantity is the instantaneous neutral-gas throughput supplied to the
    vessel by gas injection, expressed as an equivalent-electron rate. It
    combines all injected neutral species rather than representing one gas
    species.

    For the set of injected species, the equivalent-electron rate is defined by:

    $$
    \dot{N}_{\mathrm{eq}} = \sum_{s \in \mathcal{S}} Z_s\,\dot{N}_s
    $$

    where $\dot{N}_{\mathrm{eq}}$ is the total equivalent-electron source rate,
    $\mathcal{S}$ is the set of injected neutral gas species, $\dot{N}_s$ is the
    particle injection rate of species $s$, and $Z_s$ is the equivalent-electron
    weighting per injected particle. For an atomic species, $Z_s$ is its atomic
    number; for a molecule, it is the sum of the atomic numbers of its
    constituent atoms.

    The quantity applies to the vessel-level gas input and is aggregated by
    summing over all injected neutral species. It is an instantaneous rate, not
    a time-integrated inventory, and excludes ionization and subsequent plasma
    particle sources. Species-resolved rates such as the [hydrogen source rate
    due to gas injection](name:hydrogen_source_rate_due_to_gas_injection)
    provide individual contributions to this total. Unlike the [total lower gas
    source rate of the vacuum vessel due to gas
    injection](name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection),
    it is not restricted to the lower vessel region.

    The corresponding accumulated quantity, such as the [accumulated hydrogen
    count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection), is
    obtained by time integration and represents delivered inventory rather than
    instantaneous throughput.
  unit: s^-1

- name: total_thermal_coolant_absorbed_power_at_wall
  description: |-
    Thermal power extracted by active coolant circuits from cooled plasma-facing
    wall surfaces, representing energy removal from the wall rather than
    incident plasma power.
  documentation: |-
    This quantity is the total heat-transfer rate from cooled plasma-facing wall
    structures into their active coolant circuits. It represents energy removed
    from the wall and is distinct from [total incident power at the
    wall](name:total_incident_power_at_wall), which measures plasma power
    arriving at wall surfaces.

    $$
    P_{\mathrm{cool}} = \sum_i \dot{Q}_{i}
    $$

    where $P_{\mathrm{cool}}$ is the total coolant-absorbed thermal power and
    $\dot{Q}_{i}$ is the heat-transfer rate from the wall into coolant circuit
    $i$. The sum includes all active cooling circuits serving the cooled
    plasma-facing surfaces and excludes heat deposited on uncooled structures or
    power merely incident on the wall.
  unit: W

- name: total_thermal_power_at_outlet
  description: |-
    Total thermal power at the outlet is the aggregate rate at which thermal
    energy leaves a power-conversion cycle through all heat-rejection outlet
    streams. It includes all rejected heat contributions and excludes useful
    electrical output.
  documentation: |-
    Total thermal power at the outlet is the aggregate rate at which thermal
    energy leaves a power-conversion cycle through all heat-rejection outlet
    streams. It represents the total rejected heat load delivered from the
    conversion cycle to its heat sink, excluding useful electrical output.

    The total outlet thermal power is the sum of the thermal-power contributions
    from the individual heat-rejection outlet streams:

    $$
    P_{\mathrm{th,out}}^{\mathrm{tot}} = \sum_{i \in \mathcal{O}} P_{\mathrm{th,out},i} = \frac{dE_{\mathrm{waste,out}}}{dt}
    $$

    where $\mathcal{O}$ is the set of heat-rejection outlet streams,
    $P_{\mathrm{th,out},i}$ is the thermal power carried by outlet stream $i$,
    $E_{\mathrm{waste,out}}$ is the cumulative rejected thermal energy in J, and
    $t$ is time in s.

    This quantity is the aggregate over outlet streams; an individual
    outlet-stream contribution is thermal_power_at_outlet. For a steady
    conversion cycle with no net energy accumulation inside the conversion
    boundary, it is related to total_thermal_power_at_inlet by the first-law
    balance $P_{\mathrm{th,out}}^{\mathrm{tot}} =
    P_{\mathrm{th,in}}^{\mathrm{tot}} - P_{\mathrm{net}}$, where
    $P_{\mathrm{net}}$ is the net useful electrical power delivered by the
    conversion system.
  unit: W

- name: tritium_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron tritium source rate delivered to the
    plasma vessel by gas injection, with each injected tritium atom contributing
    one equivalent-electron count.
  documentation: |-
    The tritium source rate due to gas injection characterizes the instantaneous
    rate at which neutral tritium with atomic number $Z_{\mathrm{T}} = 1$ is
    admitted to the plasma vessel by gas injection hardware, expressed as an
    equivalent-electron count rate. It is the tritium-specific component of the
    [source rate due to gas injection](name:source_rate_due_to_gas_injection).

    The defining relation is:

    $$
    \dot{S}_{\mathrm{T}} = Z_{\mathrm{T}} \dot{N}_{\mathrm{T}} = \dot{N}_{\mathrm{T}}
    $$

    where $\dot{S}_{\mathrm{T}}$ is the equivalent-electron source rate,
    $\dot{N}_{\mathrm{T}}$ is the raw tritium atom delivery rate in atoms per
    second, and $Z_{\mathrm{T}}$ is tritium's atomic number. The rate is the
    instantaneous derivative of the accumulated inventory [accumulated tritium
    count due to gas
    injection](name:accumulated_tritium_count_due_to_gas_injection), and it
    counts delivered atoms rather than plasma electron content or ionization
    state.

    Sign convention: Positive when tritium gas is being delivered into the
    vessel, increasing the equivalent-electron inventory.
  unit: s^-1

- name: vertical_velocity_of_pellet
  description: |-
    Signed vertical component of the pellet center-of-mass velocity, parallel to
    the symmetry axis in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the signed vertical component of the translational velocity
    of the pellet center of mass. It resolves motion in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The vertical velocity is defined by:

    $$
    v_Z = \mathbf{v}_{\mathrm{cm}}\cdot\hat{\mathbf{z}} = \frac{dZ_{\mathrm{cm}}}{dt}
    $$

    where $v_Z$ is the vertical velocity component, $\mathbf{v}_{\mathrm{cm}}$
    is the pellet center-of-mass velocity vector, $\hat{\mathbf{z}}$ is the unit
    vector along the symmetry axis toward increasing $Z$, $Z_{\mathrm{cm}}$ is
    the vertical coordinate of the pellet center of mass, and $t$ is time.

    For a shattered pellet, this quantity describes the mass-weighted bulk
    motion of the fragment cloud, not an individual fragment's velocity. It
    excludes rotational motion about the center of mass and is not restricted to
    the initial value at vacuum-chamber entry.

    Together with the [radial velocity of the
    pellet](name:radial_velocity_of_pellet) and [toroidal velocity of the
    pellet](name:toroidal_velocity_of_pellet), it specifies the translational
    velocity vector when all components refer to the same pellet and instant.
    This signed component is distinct from the speed, which is the magnitude of
    that vector.

    Sign convention: Positive when the pellet center of mass moves toward
    increasing $Z$.
  unit: m.s^-1

- name: volume_of_pellet_fragment
  description: |-
    Geometric volume occupied by the material of an individual shattered pellet
    fragment, distinguishing fragment size from the intact pellet and
    surrounding propellant.
  documentation: |-
    This quantity is the geometric volume enclosed by the material boundary of
    one shattered pellet fragment. It describes the fragment’s physical size
    rather than the volume of the complete pellet, injector, or surrounding
    propellant.

    The volume is defined from the fragment’s material domain:

    $$
    V_f = \int_{\mathcal{D}_f} d^3\mathbf{r}
    $$

    where $V_f$ is the volume of the individual fragment, $\mathcal{D}_f$ is the
    three-dimensional region occupied by its material, and $d^3\mathbf{r}$ is
    the volume element integrated over that region.

    The scope is one individual fragment within the shattered-pellet population.
    This is an extensive geometric quantity for that fragment and is not an
    aggregate over multiple fragments; it excludes surrounding gas and does not
    represent the volume of the intact pellet, injector, or complete fragment
    cloud.

    The associated [toroidal coordinate of the pellet
    fragment](name:toroidal_coordinate_of_pellet_fragment) locates the same
    fragment around the machine symmetry axis, while this quantity characterizes
    its geometric size.
  unit: m^3

- name: x_major_axis_unit_vector_of_shatter_cone
  description: |-
    Cartesian x-component of the unit vector directed along the major geometric
    axis of the elliptic shatter cone.
  documentation: |-
    This quantity is the projection of the shatter cone’s major-axis unit vector
    onto the Cartesian x direction. The major-axis unit vector specifies the
    orientation of the elliptic shatter cone.

    In the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, the
    component is defined by

    $$
    u_{\mathrm{major},x} = \hat{\mathbf{u}}_{\mathrm{major}} \cdot \hat{x}
    $$

    where $\hat{\mathbf{u}}_{\mathrm{major}}$ is the unit vector along the
    cone’s major axis, $\hat{x}$ is the Cartesian x-direction unit vector, and
    $u_{\mathrm{major},x}$ is their scalar projection. The component
    participates in the unit-vector constraint with the corresponding y and z
    components. The [y major-axis unit-vector
    component](name:y_major_axis_unit_vector_of_shatter_cone) resolves the same
    axis in the y direction, whereas the [x minor-axis unit-vector
    component](name:x_minor_axis_unit_vector_of_shatter_cone) describes the
    orthogonal minor axis.
  unit: '1'

- name: x_minor_axis_unit_vector_of_shatter_cone
  description: |-
    Signed x projection of the unit vector along an elliptic shatter cone’s
    minor geometric axis in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the signed projection of the unit vector directed along the
    minor geometric axis of an elliptic shatter cone onto the Cartesian x
    direction. It specifies one orientation coordinate of that hardware axis.

    Let $u_x$ denote this x component, $\hat{\mathbf{u}}_{\mathrm{minor}}$ the
    unit vector along the shatter cone’s minor axis, and $\hat{\mathbf{x}}$ the
    unit vector toward increasing x in the right-handed Cartesian $(x, y, z)$
    frame. The defining projection is

    $$
    u_x = \hat{\mathbf{u}}_{\mathrm{minor}} \cdot \hat{\mathbf{x}}
    $$

    The component is bounded between −1 and 1 because
    $\hat{\mathbf{u}}_{\mathrm{minor}}$ is normalized.

    This quantity applies only to the minor axis of the shatter cone and
    represents one Cartesian component; it is neither the complete direction
    vector, its magnitude, nor an aggregation over axes or hardware objects. It
    is distinct from the corresponding [x component of the major-axis unit
    vector](name:x_major_axis_unit_vector_of_shatter_cone).

    Together with the other Cartesian components of the same minor-axis unit
    vector, including the [z component of the minor-axis unit
    vector](name:z_minor_axis_unit_vector_of_shatter_cone), this component
    specifies the minor-axis orientation.
  unit: '1'

- name: x_unit_vector_of_pellet_injector
  description: |-
    Cartesian x component of the unit vector along the unshattered pellet
    velocity immediately before shattering, resolved in the right-handed
    Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the x-directed Cartesian component of the unit vector
    aligned with the unshattered pellet velocity immediately before shattering.
    It describes the injection direction associated with the pellet injector,
    not a hardware-axis orientation or a post-shattering fragment direction.

    The injection-direction vector is decomposed in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis as

    $$
    \mathbf{u}_{\mathrm{inj}}=u_x\hat{x}+u_y\hat{y}+u_z\hat{z},\qquad u_x=\mathbf{u}_{\mathrm{inj}}\cdot\hat{x},\qquad |\mathbf{u}_{\mathrm{inj}}|=1
    $$

    where $\mathbf{u}_{\mathrm{inj}}$ is the unshattered pellet
    velocity-direction unit vector, $u_x$ is its x component, and $\hat{x}$,
    $\hat{y}$, and $\hat{z}$ are the Cartesian basis unit vectors. The
    corresponding components are given by the [y unit vector of the pellet
    injector](name:y_unit_vector_of_pellet_injector) and [z direction unit
    vector of the pellet
    injector](name:z_direction_unit_vector_of_pellet_injector).
  unit: '1'

- name: xenon_source_rate_due_to_gas_injection
  description: |-
    Instantaneous equivalent-electron source rate for xenon atoms supplied by
    gas injection, assigning 54 equivalent electrons to each xenon atom.
  documentation: |-
    This quantity is the instantaneous rate at which xenon is supplied by gas
    injection, expressed on an equivalent-electron basis. It represents injected
    xenon inventory rather than electron production or the xenon content already
    present in the plasma.

    The equivalent-electron source rate is defined by

    $$
    \dot{N}_{\mathrm{Xe,eq}}(t) = Z_{\mathrm{Xe}}\dot{N}_{\mathrm{Xe}}(t) = 54\dot{N}_{\mathrm{Xe}}(t)
    $$

    where $\dot{N}_{\mathrm{Xe,eq}}(t)$ is the equivalent-electron source rate,
    $Z_{\mathrm{Xe}}$ is the atomic number of xenon, $\dot{N}_{\mathrm{Xe}}(t)$
    is the xenon-atom injection rate due to gas injection, and $t$ is time.

    The quantity applies only to xenon supplied by gas injection and aggregates
    the injected xenon-atom rate by weighting each atom with xenon's atomic
    number. It is species-resolved and instantaneous, not a total rate over all
    injected gasses.

    The factor 54 is an equivalent-electron bookkeeping convention based on
    nuclear charge, not a count of free electrons produced by ionization. This
    rate is distinct from an accumulated xenon inventory; integrating it over
    time gives the equivalent-electron inventory delivered by gas injection. The
    same species-resolved convention is used for the [helium-4 gas-injection
    source rate](name:helium_4_source_rate_due_to_gas_injection) and [hydrogen
    gas-injection source rate](name:hydrogen_source_rate_due_to_gas_injection).
  unit: s^-1

- name: y_direction_unit_vector_of_shatter_cone
  description: |-
    Signed Y-axis projection of the unit vector defining the orientation of an
    elliptic shatter cone in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    This quantity is the signed projection of an elliptic shatter cone's
    direction unit vector onto the Cartesian Y axis.

    The component is defined by

    $$
    d_y = \hat{\mathbf{d}}_{\rm cone} \cdot \hat{\mathbf{y}}
    $$

    where $d_y$ is the Y component, $\hat{\mathbf{d}}_{\rm cone}$ is the
    shatter-cone direction unit vector, and $\hat{\mathbf{y}}$ is the unit
    vector along increasing $y$ in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis.

    This quantity applies only to the shatter-cone direction and represents one
    Cartesian component; no population, regional, charge-state, averaging, or
    summation convention applies. It is not the direction-vector magnitude and
    must not be confused with the [Y component of the shatter-cone major-axis
    unit vector](name:y_major_axis_unit_vector_of_shatter_cone), which describes
    a geometric axis rather than the cone direction. The complete direction
    requires all three Cartesian components.
  unit: '1'

- name: y_major_axis_unit_vector_of_shatter_cone
  description: |-
    The signed y component of the unit vector along the major axis of an
    elliptic shatter cone is its projection in the right-handed Cartesian (x, y,
    z) frame.
  documentation: |-
    The signed y component of the unit vector along the major axis of an
    elliptic shatter cone is the projection of that major-axis direction onto
    the $y$ basis direction of the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame. The major-axis direction is the orientation of the
    principal semiaxis of the cone's elliptic cross-section.

    The component is defined by

    $$
    e_{\mathrm{maj},y} = \hat{e}_{\mathrm{maj}} \cdot \hat{y}
    $$

    where $e_{\mathrm{maj},y}$ is the y component of the shatter-cone major-axis
    unit vector, $\hat{e}_{\mathrm{maj}}$ is the unit vector along the major
    axis of the elliptic shatter cone, and $\hat{y}$ is the y basis vector of
    the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.

    This quantity applies to the geometry of an elliptic shatter cone and to the
    major semiaxis orientation of its elliptic cross-section; its aggregation
    convention is none, because it is a single vector component rather than a
    sum or mean. It is distinct from the unsigned major-axis length, from the [y
    component of the shatter-cone direction unit
    vector](name:y_direction_unit_vector_of_shatter_cone), which describes the
    cone direction rather than the major-axis orientation, and from the [y
    component of the minor-axis unit
    vector](name:y_minor_axis_unit_vector_of_shatter_cone), which refers to the
    orthogonal minor semiaxis.

    Together with the [x
    component](name:x_major_axis_unit_vector_of_shatter_cone) and [z
    component](name:z_major_axis_unit_vector_of_shatter_cone), this quantity
    forms the Cartesian representation of $\hat{e}_{\mathrm{maj}}$; the linked x
    and z components and $e_{\mathrm{maj},y}$ satisfy $(e_{\mathrm{maj},x})^2 +
    (e_{\mathrm{maj},y})^2 + (e_{\mathrm{maj},z})^2 = 1$, where
    $e_{\mathrm{maj},x}$ and $e_{\mathrm{maj},z}$ are the linked x and z
    components. The major-axis and minor-axis unit vectors jointly orient the
    elliptic cone and satisfy $\hat{e}_{\mathrm{maj}} \cdot
    \hat{e}_{\mathrm{min}} = 0$, where $\hat{e}_{\mathrm{min}}$ is the
    minor-axis unit vector with
    [x](name:x_minor_axis_unit_vector_of_shatter_cone),
    [y](name:y_minor_axis_unit_vector_of_shatter_cone), and
    [z](name:z_minor_axis_unit_vector_of_shatter_cone) components.

    Sign convention: Positive when $\hat{e}_{\mathrm{maj}}$ has a component in
    the $+\hat{y}$ direction of the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.
  unit: '1'

- name: y_minor_axis_unit_vector_of_shatter_cone
  description: |-
    Y component of the unit vector along the minor axis of an elliptic shatter
    cone, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The minor-axis unit vector specifies one orientation of the elliptic shatter
    cone. This quantity is its signed projection onto the Cartesian y direction,
    complementing the [x minor-axis
    component](name:x_minor_axis_unit_vector_of_shatter_cone) and [z minor-axis
    component](name:z_minor_axis_unit_vector_of_shatter_cone).

    The component is defined by

    $$
    u_y = \mathbf{u}_{\mathrm{minor}} \cdot \hat{\mathbf{y}}
    $$

    where $\mathbf{u}_{\mathrm{minor}}$ is the unit vector along the
    shatter-cone minor axis and $\hat{\mathbf{y}}$ is the y-directed unit vector
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame. The
    complete minor-axis vector has unit norm, so its components satisfy $u_x^2 +
    u_y^2 + u_z^2 = 1$.
  unit: '1'

- name: y_unit_vector_of_pellet_injector
  description: |-
    Cartesian y component of the unit vector aligned with the unshattered pellet
    velocity direction immediately before shattering.
  documentation: |-
    This quantity is the projection onto the Cartesian y axis of the
    unit-normalized direction of the unshattered pellet velocity immediately
    before shattering.

    The component is defined by

    $$
    u_y = \hat{\mathbf{u}} \cdot \hat{\mathbf{y}}, \qquad \hat{\mathbf{u}} = \frac{\mathbf{v}}{|\mathbf{v}|}
    $$

    where $u_y$ is the y component, $\hat{\mathbf{u}}$ is the pellet
    injection-direction unit vector, $\mathbf{v}$ is the unshattered pellet
    velocity, $|\mathbf{v}|$ is its magnitude, and $\hat{\mathbf{y}}$ is the y
    unit vector in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame.

    This quantity describes direction only, not pellet speed or position. Its
    value is bounded between $-1$ and $1$; together with the [x component of the
    pellet-injector unit vector](name:x_unit_vector_of_pellet_injector) and [z
    component of the pellet-injector direction unit
    vector](name:z_direction_unit_vector_of_pellet_injector), it specifies the
    injection direction.
  unit: '1'

- name: z_direction_unit_vector_of_pellet_injector
  description: |-
    Z component of the unit vector aligned with the unshattered pellet velocity
    immediately before shattering, resolved in the right-handed Cartesian (x, y,
    z) frame.
  documentation: |-
    This quantity is the signed projection of the unshattered pellet-injection
    direction onto the Cartesian z axis immediately before shattering. It
    describes orientation only, not the pellet speed or the velocity of
    shattered fragments.

    The component is defined by:

    $$
    d_z = \hat{\mathbf{d}} \cdot \hat{\mathbf{z}}
    $$

    where $\hat{\mathbf{d}}$ is the unit vector aligned with the unshattered
    pellet velocity and $\hat{\mathbf{z}}$ is the unit vector along increasing z
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame. Together
    with the corresponding [x component](name:x_unit_vector_of_pellet_injector)
    and [y component](name:y_unit_vector_of_pellet_injector), it specifies the
    injection direction.
  unit: '1'

- name: z_major_axis_unit_vector_of_shatter_cone
  description: |-
    Signed z-component of the shatter-cone major-axis unit vector, specifying
    its orientation along z in the right-handed Cartesian frame.
  documentation: |-
    The quantity is the signed projection of the shatter-cone major-axis unit
    vector onto the Cartesian z direction. It specifies the major-axis
    orientation along z, not an axis length or a position coordinate.

    The component is defined by

    $$
    u_{\mathrm{major},z} = \hat{\mathbf{u}}_{\mathrm{major}} \cdot \hat{z}
    $$

    where $\hat{\mathbf{u}}_{\mathrm{major}}$ is the unit vector along the
    shatter-cone major axis and $\hat{z}$ is the z basis vector in the
    right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ frame. Together with the
    [x major-axis unit-vector
    component](name:x_major_axis_unit_vector_of_shatter_cone) and [y major-axis
    unit-vector component](name:y_major_axis_unit_vector_of_shatter_cone), it
    defines the Cartesian orientation of that axis. It is distinct from the [z
    minor-axis unit-vector
    component](name:z_minor_axis_unit_vector_of_shatter_cone).
  unit: '1'

- name: z_minor_axis_unit_vector_of_shatter_cone
  description: |-
    Signed Z component of the minor-axis unit vector defining the orientation of
    an elliptic shatter cone in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the projection of the unit vector along an elliptic shatter
    cone's minor geometric axis onto the Cartesian z direction.

    The component is defined by

    $$
    u_{\mathrm{minor},z} = \mathbf{u}_{\mathrm{minor}} \cdot \hat{\mathbf{z}}
    $$

    where $\mathbf{u}_{\mathrm{minor}}$ is the unit vector directed along the
    shatter cone's minor axis, $\hat{\mathbf{z}}$ is the unit basis vector for
    increasing $z$ in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame, and $u_{\mathrm{minor},z}$ is their scalar projection.

    This quantity applies only to the minor geometric axis of the shatter cone
    and represents one Cartesian component, not the complete orientation vector,
    its magnitude, or a component of the major axis. It is a signed component
    and is not an aggregate over multiple axes or objects.

    Together with the remaining Cartesian components, including the [x component
    of the shatter-cone minor-axis unit
    vector](name:x_minor_axis_unit_vector_of_shatter_cone), it defines the
    minor-axis orientation. It is distinct from the [z component of the
    shatter-cone major-axis unit
    vector](name:z_major_axis_unit_vector_of_shatter_cone), which describes the
    other principal axis.
  unit: '1'

- name: normalized_toroidal_flux_coordinate_at_pellet_path
  description: |-
    Normalized toroidal magnetic-flux surface label assigned to each pellet
    location, identifying the nested magnetic surface reached along the pellet’s
    in-plasma ablation trajectory.
  documentation: |-
    This quantity identifies the nested magnetic surface containing the pellet
    at a specified location along its in-plasma ablation trajectory. It is a
    magnetic-surface coordinate, not a cylindrical distance or a local vector
    component.

    At pellet position $\mathbf{x}_{\mathrm p}$, the normalized toroidal flux
    coordinate is defined by

    $$
    \rho_{\mathrm{tor,norm}}(\mathbf{x}_{\mathrm p}) = \left[\frac{\Phi_{\mathrm{tor}}(\mathbf{x}_{\mathrm p}) - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}\right]^{1/2}
    $$

    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate,
    $\mathbf{x}_{\mathrm p}$ is the pellet position,
    $\Phi_{\mathrm{tor}}(\mathbf{x}_{\mathrm p})$ is the toroidal magnetic flux
    labeling the magnetic surface through that position,
    $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and
    $\Phi_{\mathrm{tor,boundary}}$ is its value at the equilibrium boundary. The
    position is interpreted in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    The scope is the pellet’s in-plasma ablation trajectory, with the coordinate
    evaluated pointwise at each pellet location. It does not represent distance
    traveled along the path, a path integral, an average over the trajectory, or
    an aggregate over multiple pellets.

    This is the locus-specific realization of the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate). The axis and boundary
    references set the coordinate endpoints, so the value increases outward
    across nested magnetic surfaces while remaining distinct from a cylindrical
    radial coordinate.
  unit: '1'

- name: radial_coordinate_of_shatter_cone
  description: |-
    Major-radius coordinate of the shatter-cone origin, locating its reference
    point by perpendicular distance from the toroidal symmetry axis.
  documentation: |-
    The radial coordinate of a shatter-cone origin is the major-radius location
    of that geometric reference point relative to the toroidal symmetry axis. It
    is the $R$ coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame,
    with basis vectors $(\hat{R}, \hat{\phi}, \hat{Z})$ satisfying $\hat{R}
    \times \hat{\phi} = \hat{Z}$.

    This quantity applies specifically to the origin of the elliptic shatter
    cone. It denotes one geometric coordinate of that reference point, with no
    averaging, integration, or aggregation over the cone surface, its axis, or
    injected fragments; it is distinct from radial coordinates assigned to other
    injector features or positions.

    It is a locus-specific specialization of [radial
    coordinate](name:radial_coordinate): the parent defines the major-radius
    coordinate generally, while this quantity evaluates it at the shatter-cone
    origin.
  unit: m

- name: total_heating_power_due_to_fusion_reactions
  description: |-
    Gross thermal power delivered to a fusion power plant’s thermal-to-electric
    conversion cycle from fusion reactions, including blanket energy
    multiplication.
  documentation: |-
    Total fusion-attributed heating power is the gross thermal input delivered
    to a fusion power plant’s thermal-to-electric conversion cycle. It combines
    heat released by fusion reactions with additional thermal power produced by
    nuclear energy multiplication in the blanket.

    $$
    P_{\mathrm{cycle}}^{\mathrm{fusion}} = P_{\mathrm{fusion}} + P_{\mathrm{blanket}}^{\mathrm{mult}}
    $$

    Here, $P_{\mathrm{cycle}}^{\mathrm{fusion}}$ is the total fusion-attributed
    thermal power supplied to the conversion cycle, $P_{\mathrm{fusion}}$ is the
    thermal power released by fusion reactions and entering the plant heat
    stream, and $P_{\mathrm{blanket}}^{\mathrm{mult}}$ is the additional thermal
    power generated by energy multiplication in the blanket.

    The quantity is aggregated over all included fusion-reaction and
    blanket-multiplication contributions at the plant conversion-cycle boundary.
    It is a gross thermal input, not local plasma heating or a power density.
    The cumulative plasma heating or energy-transfer quantity [power at an
    inside flux surface](name:power_at_inside_flux_surface) describes energy
    associated with a plasma region and is therefore distinct from this
    plant-level cycle input.
  unit: W
