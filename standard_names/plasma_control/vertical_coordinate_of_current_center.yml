name: vertical_coordinate_of_current_center
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) position of the plasma current centroid, defined as the
  current-density-weighted mean of the vertical coordinate.
documentation: "The vertical coordinate of the current center $Z_{\\mathrm{cc}} =\
  \ \\int Z\\, j_\\phi\\, dA \\,/\\, \\int j_\\phi\\, dA$ is the $Z$-position of the\
  \ toroidal-current-density centroid, where $j_\\phi$ is the toroidal current density\
  \ in A/m\xB2 and $A$ is the poloidal cross-section area. This quantity is a key\
  \ input for vertical stability control: the plasma is vertically unstable in elongated\
  \ tokamak configurations, so the control system must track $Z_{\\mathrm{cc}}$ and\
  \ drive it toward the reference waveform to prevent vertical displacement events\
  \ (VDEs). In the pulse schedule context, $Z_{\\mathrm{cc}}$ is specified in normalized\
  \ (dimensionless) form relative to a machine-specific length scale, hence the unit\
  \ is 1. Typical physical values before normalization range from $-0.5$ m to $+0.5$\
  \ m for medium-size tokamaks; ITER targets $|Z_{\\mathrm{cc}}| < 0.05$ m during\
  \ flat-top. The quantity is inferred from external magnetic diagnostics via equilibrium\
  \ reconstruction or real-time estimators. See the companion major-radius coordinate\
  \ of the current centroid for horizontal position control."
