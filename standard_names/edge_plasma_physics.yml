- name: poloidal_ion_velocity_due_to_convection
  kind: scalar
  status: draft
  description: Poloidal component of the effective ion velocity arising from convective
    transport processes in the edge plasma.
  documentation: 'The poloidal ion convection velocity $v_{\theta, \mathrm{conv}}$
    is the projection of the total convective velocity for ion transport onto the
    poloidal direction, perpendicular to both the radial and toroidal axes. It quantifies
    the poloidal advection of ion particles, momentum, and energy due to macroscopic
    plasma flows such as those driven by neoclassical effects or turbulent eddy transport.
    This quantity is a component of the vector field defined by [ion_velocity_due_to_convection](name:ion_velocity_due_to_convection).
    In the edge and scrape-off layer, typical poloidal convection speeds range from
    tens to hundreds of m/s, depending on the collisionality and plasma rotation profile.
    It is diagnosed through transport code analysis or inferred from poloidal distribution
    of ion fluxes.


    Sign convention: Positive when the convection velocity is in the direction of
    increasing poloidal angle $\theta$ (counter-clockwise when viewed from the outboard
    midplane).


    Related quantities include the radial counterpart [radial_ion_convection_velocity](name:radial_ion_convection_velocity)
    and the [ion_momentum_flux](name:ion_momentum_flux) which characterizes the associated
    momentum transport.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_velocity_due_to_convection
  - name:radial_ion_convection_velocity
  - name:ion_momentum_flux
  arguments:
  - name: ion_velocity_due_to_convection
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/energy/v_pol/values
    dd_path: edge_transport/model/ggd/ion/energy/v_pol/values
    status: composed
- name: poloidal_ion_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Poloidal component of the diamagnetic drift velocity for an ion charge
    state, arising from pressure gradients perpendicular to the magnetic field.
  documentation: 'The poloidal ion diamagnetic drift velocity $v_{\theta}^{\text{dia}}$
    is the poloidal projection of the diamagnetic drift velocity $\mathbf{v}_{\text{dia}}
    = (\mathbf{B} \times \nabla p_i) / (n_i Z_i e B^2)$, where $p_i$ is the ion pressure,
    $n_i$ is the ion density, $Z_i$ is the charge state, $e$ is the elementary charge,
    and $B = |\mathbf{B}|$ is the magnetic field magnitude. This quantity represents
    the poloidal component of the total diamagnetic drift vector for a single ion
    species and is the poloidal projection of the parent quantity [ion_velocity_due_to_diamagnetic_drift](name:ion_velocity_due_to_diamagnetic_drift).
    It is distinguished from perpendicular (radial) and toroidal components by its
    direction along the poloidal angle and is a key player in determining the poloidal
    rotation balance and radial electric field in the edge pedestal and scrape-off
    layer. Typical values in the edge of H-mode tokamak plasmas range from a few hundred
    m/s to several km/s, driven by the steep pressure gradients of the pedestal. The
    poloidal component is routinely inferred from charge exchange recombination spectroscopy
    (CXRS) measurements or predicted by neoclassical transport codes. Sibling components
    include [radial_neutral_velocity_due_to_diamagnetic_drift](name:radial_neutral_velocity_due_to_diamagnetic_drift)
    and [toroidal_neutral_diamagnetic_velocity](name:toroidal_neutral_diamagnetic_velocity),
    while the perpendicular pressure gradient that drives it is related to [ion_diamagnetic_velocity](name:ion_diamagnetic_velocity)
    and [current_density_due_to_diamagnetic_drift](name:current_density_due_to_diamagnetic_drift).


    Sign convention: Positive when the drift velocity points in the direction of increasing
    poloidal angle $\theta$ (towards the outboard midplane).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_velocity_due_to_diamagnetic_drift
  - name:radial_neutral_velocity_due_to_diamagnetic_drift
  - name:toroidal_neutral_diamagnetic_velocity
  - name:ion_diamagnetic_velocity
  - name:current_density_due_to_diamagnetic_drift
  arguments:
  - name: ion_velocity_due_to_diamagnetic_drift
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/ion/state/velocity_diamagnetic/poloidal
    dd_path: plasma_profiles/ggd/ion/state/velocity_diamagnetic/poloidal
    status: composed
- name: poloidal_neutral_state_velocity
  kind: scalar
  status: draft
  description: Poloidal component of the flow velocity for neutral particles in a
    specific quantum state, resolved relative to the magnetic field direction.
  documentation: 'The poloidal neutral state velocity $v_{\theta, \text{n}}^{\text{state}}$
    is the component of the neutral particle velocity vector perpendicular to the
    toroidal direction and lying within the poloidal plane. It describes the poloidal
    drift of neutrals in a particular charge state, which is essential for modeling
    edge plasma fueling and neutral transport. This quantity is part of the [neutral_state_velocity](name:neutral_state_velocity)
    vector, which also includes parallel and radial components. Typical poloidal velocities
    in the edge region range from $10^2$ to $10^4$ m/s, depending on charge-exchange
    and ionization rates. Measurement is typically inferred from spectroscopic diagnostics
    or 2D neutral fluid simulations.


    Sign convention: Positive when the poloidal component points in the direction
    of increasing poloidal angle $\theta$.


    Related standard names include [poloidal_neutral_velocity](name:poloidal_neutral_velocity)
    for charge-state-averaged flow and [poloidal_ion_state_velocity](name:poloidal_ion_state_velocity)
    for ion species.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
