    plasma-facing surface, identifying the peak thermal load point at a given instant.
  documentation: "The maximum of energy flux at the first wall is the highest value\
    \ of [energy_flux_at_wall](name:energy_flux_at_wall) sampled over the entire first-wall\
    \ plasma-facing surface at a given instant.\n\n$$\nq_\\mathrm{max} = \\max_{\\\
    mathbf{x}\\,\\in\\,\\mathcal{S}_\\mathrm{FW}} q(\\mathbf{x})\n$$\n\nwhere $q(\\\
    mathbf{x})$ is the local total energy flux and $\\mathcal{S}_\\mathrm{FW}$ denotes\
    \ the first-wall surface.\n\nThe base quantity $q(\\mathbf{x})$ encompasses all\
    \ energy-transport channels \u2014 kinetic energy carried by ions, electrons,\
    \ and neutrals together with radiative and electromagnetic contributions \u2014\
    \ consistent with [energy_flux_at_wall](name:energy_flux_at_wall). The maximum\
    \ is taken across the full first-wall geometry at each time point, not area-averaged.\
    \ It is distinct from [maximum_of_energy_flux_at_divertor_target](name:maximum_of_energy_flux_at_divertor_target),\
