        rate of change of the vertical position of the centroid of the plasma current
        distribution. A global scalar equilibrium quantity.
      kind: llm
- name: volume_of_flux_surface
  kind: scalar
  status: active
  description: Volume enclosed by a nested toroidal magnetic flux surface, increasing
    from zero at the magnetic axis to the plasma volume at the last closed flux surface.
  documentation: 'The enclosed volume is the three-dimensional region inside a nested
    toroidal magnetic flux surface, bounded by that surface and containing the magnetic
    axis.


    For a surface labeled by poloidal magnetic flux \(\psi\), the enclosed volume
    is defined by


    $$

    V(\psi) = \int_{\Omega(\psi)} d^3\mathbf{x}

    $$


    where \(V\) is the enclosed volume, \(\Omega(\psi)\) is the region inside the
    flux surface, and \(\mathbf{x}\) is the position vector. The label \(\psi\) is
    the [poloidal magnetic flux](name:poloidal_magnetic_flux) associated with the
    surface.


    The volume is zero at the magnetic axis and increases outward through nested surfaces;
    at the last closed flux surface it equals the confined plasma volume. It excludes
    regions outside that surface and is distinct from the [surface area of the flux
    surface](name:surface_area_of_flux_surface).'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  sources:
