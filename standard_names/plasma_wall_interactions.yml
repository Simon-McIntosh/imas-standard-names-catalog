        element in the grid subset.
      parent_path: wall/description_ggd/ggd/j_total
      parent: Total current density, given on various grid subsets
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - 1...N
    enhanced_context:
      description: Major radius (R) coordinate of j total.
      kind: template
- name: source_rate_due_to_surface_emission
  kind: scalar
  status: active
  description: Global rate at which surface emission (recycling, outgassing, and sputtering)
    at plasma-facing surfaces supplies ionized particles to the plasma, summed over
    all surfaces and weighted by each species' particle multiplicity.
  documentation: 'The surface emission source rate is the total number of particles
    per second added to the plasma from all material boundaries through recycling
    of incident plasma species, thermal outgassing, and physical or chemical sputtering.
    Each emitted neutral atom or molecule is weighted by the number of plasma particles
    it yields upon ionization, so a molecule that releases multiple ions on ionization
    contributes proportionally more than a monatomic species.


    The defining relation for the aggregate rate is:


    $$

    S_{\rm surf} = \sum_{\rm surfaces} \int_A \sum_{k} \Gamma_k(\mathbf{r})\, w_k\,
    dA

    $$


    where $\Gamma_k(\mathbf{r})$ is the emitted particle flux density of neutral species
    $k$ at wall position $\mathbf{r}$, $w_k$ is the ionization-weighted particle multiplicity
    (number of plasma particles produced per emitted neutral of species $k$), and
    the area integral runs over all plasma-facing surfaces.


    This parent name abstracts over species-resolved surface source rates; the concrete
    electron-equivalent contribution is given by [electron_source_rate_due_to_surface_emission](name:electron_source_rate_due_to_surface_emission).
    For comparison, [total_neutral_particle_flux_at_wall_due_to_surface_emission](name:total_neutral_particle_flux_at_wall_due_to_surface_emission)
    gives the corresponding neutral flux leaving surfaces before ionization, while
    [particle_flux_of_divertor_due_to_recycling](name:particle_flux_of_divertor_due_to_recycling)
    isolates the recycling-specific input at divertor targets. In edge plasma and
    scrape-off-layer modeling, this source rate enters the global particle balance
    alongside volumetric ionization from the bulk, and is non-negative by construction.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_source_rate_due_to_surface_emission
  - name:particle_flux_of_divertor_due_to_recycling
- name: electron_source_rate_due_to_surface_emission
  kind: scalar
  status: active
  description: Instantaneous electron-equivalent source rate supplied by surface emission
    of material from plasma-facing surfaces, weighted by the electron contribution
    of each emitted species after ionization.
  documentation: 'Instantaneous electron-equivalent source rate supplied by surface
    emission is the rate at which ionization of material released from plasma-facing
    surfaces adds electrons to the plasma particle balance. It aggregates all emitted
    fuel, molecular, and impurity species over all plasma-facing surfaces, with each
    emitted particle weighted by the number of bound electrons it can contribute after
    full ionization.


    The global rate is defined by integrating the emitted particle flux density over
    the plasma-facing surface area:


    $$

    S_e^{\mathrm{surf}} = \int_{A_{\mathrm{pf}}} \sum_s \nu_{e,s}\,\Gamma_s^{\mathrm{emit}}(\mathbf{x})\,dA

    $$


    where $S_e^{\mathrm{surf}}$ is the electron-equivalent surface-emission source
    rate, $A_{\mathrm{pf}}$ is the total plasma-facing surface area, $s$ indexes emitted
    species, $\Gamma_s^{\mathrm{emit}}(\mathbf{x})$ is the emitted particle flux density
    of species $s$ at surface position $\mathbf{x}$ directed toward the plasma, $dA$
    is a surface element, and $\nu_{e,s}$ is the electron yield of one emitted particle
    on full ionization. For an emitted atom, $\nu_{e,s}=Z_s$ with $Z_s$ the nuclear
    charge number; for an emitted molecule or compound particle, $\nu_{e,s}$ is the
    sum of the nuclear charge numbers of its constituent atoms.


    Surface emission includes recycling, delayed outgassing, and physical or chemical
    sputtering only insofar as the released material returns toward the plasma and
    is ionized. This quantity is the electron-specific counterpart of [source_rate_due_to_surface_emission](name:source_rate_due_to_surface_emission),
    is distinct from externally supplied material represented by [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection),
    excludes electron loss by incidence on surfaces, and contributes to [total_electron_source_rate](name:total_electron_source_rate).


    Sign convention: Positive when ionization of material emitted from plasma-facing
    surfaces supplies electron-equivalent particles to the plasma.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:source_rate_due_to_surface_emission
  arguments:
  - name: source_rate_due_to_surface_emission
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: wall/global_quantities/electrons/particle_flux_from_wall
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-electrons-particle_flux_from_wall
    dd_documentation:
      leaf: 'Particle flux from the wall corresponding to the conversion into various
        neutral types (first dimension: 1: cold; 2: thermal; 3: fast), in equivalent
        electrons'
      parent_path: wall/global_quantities/electrons
