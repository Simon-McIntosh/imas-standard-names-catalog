- name: major_radius_of_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the point where the plasma separatrix
    or boundary intersects a material surface (divertor target or wall) in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: "The strike point is the locus where the outermost open field line\
    \ \u2014 the separatrix \u2014 meets a solid surface such as a divertor target\
    \ plate or limiter. Its major-radius coordinate $R_{\\rm sp}$ locates this plasma-wall\
    \ interaction point in the right-handed cylindrical $(R, \\phi, Z)$ frame, where\
    \ $R$ is the perpendicular distance from the machine symmetry axis. Typical values\
    \ range from 0.5 m (compact machines, inner target) to 2.5 m (large devices, outer\
    \ target), depending on device geometry and divertor configuration. The strike-point\
    \ location is inferred from equilibrium reconstruction codes constrained by magnetic\
    \ diagnostics, and its control is central to heat-load management in diverted\
    \ plasmas. Compare with [major_radius_of_x_point](name:major_radius_of_x_point),\
    \ which gives the $R$ coordinate of the magnetic null that projects to the strike\
    \ point, and [major_radius_of_closest_wall_point](name:major_radius_of_closest_wall_point)\
    \ for the nearest wall intercept of the plasma boundary.\n\nSign convention: Positive\
    \ when $R_{\\rm sp}$ is measured in the direction of increasing distance from\
    \ the machine symmetry axis, i.e. $R_{\\rm sp} > 0$ for all physically realizable\
    \ strike points."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_x_point
  - name:major_radius_of_closest_wall_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    status: composed
- name: major_radius_of_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of a magnetic X-point (saddle point of the
    poloidal flux function psi) on the plasma separatrix or boundary, measured from
    the machine symmetry axis in meters. At an X-point, both poloidal components of
    the magnetic field vanish and the gradient of psi is zero, so separatrix field
    lines cross. R is non-negative by definition of the cylindrical coordinate.
  documentation: "The X-point is the location in the poloidal plane where the poloidal\
    \ magnetic flux function $\\psi(R,Z)$ has a saddle point: both partial derivatives\
    \ $\\partial\\psi/\\partial R$ and $\\partial\\psi/\\partial Z$ vanish simultaneously,\
    \ so the full gradient $\\nabla\\psi = 0$ in that plane. This condition identifies\
    \ the magnetic null of the poloidal field, at which the separatrix \u2014 the\
    \ outermost closed flux surface \u2014 self-intersects (or, for a snowflake equilibrium,\
    \ branches). The quantity recorded here is the $R$ coordinate of that saddle point\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the perpendicular\
    \ distance from the machine symmetry axis and $Z$ is the vertical height.\n\n\
    Typical values in a tokamak divertor equilibrium range from roughly $0.5\\,\\\
    mathrm{m}$ (compact machines) to $2\\,\\mathrm{m}$ or more (large devices such\
    \ as ITER, where the lower X-point sits near $R \\approx 4\\,\\mathrm{m}$). A\
    \ single-null configuration has one X-point; a double-null configuration has two,\
    \ placed symmetrically or asymmetrically in $Z$. The companion vertical coordinate\
    \ of the same X-point is given by `vertical_coordinate_of_x_point`.\n\nBecause\
    \ $R$ is a distance from the symmetry axis, it is intrinsically non-negative ($R\
    \ \\geq 0$); no signed convention applies. The X-point $R$ is used in equilibrium\
    \ reconstruction codes, divertor geometry characterization, heat-load calculations,\
    \ and separatrix tracking algorithms. It is closely related to the major-radius\
    \ positions of divertor strike points and of the magnetic axis."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_strike_point
  - name:major_radius_of_dr_dz_zero_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/x_point/r
    status: composed
- name: maximum_magnetic_field_strength_on_flux_surface
  kind: scalar
  status: draft
  description: Maximum of the total magnetic field modulus |B| taken over all points
    on each flux surface, yielding a positive-definite scalar for each surface label.
    This quantity enters neoclassical transport theory and determines the threshold
    pitch angle for magnetically trapped particles.
  documentation: "## Maximum Magnetic Field Strength on Flux Surface\n\nFor a given\
    \ flux surface labeled by a normalized flux coordinate (e.g., $\\rho_{\\mathrm{tor,norm}}\
    \ = \\sqrt{\\Phi/\\Phi_{\\mathrm{boundary}}}$, where $\\Phi$ is the toroidal magnetic\
    \ flux), this quantity is defined as\n\n$$B_{\\max}(\\rho) = \\sup_{\\theta,\\\
    phi}\\, |\\mathbf{B}(R(\\rho,\\theta,\\phi),\\,\\phi,\\,Z(\\rho,\\theta,\\phi))|,$$\n\
    \nwhere the supremum is taken over all poloidal angles $\\theta$ and toroidal\
    \ angles $\\phi$ on the surface, and $|\\mathbf{B}|$ is evaluated in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame. The result is always strictly positive regardless\
    \ of the sign convention applied to individual magnetic field components.\n\n\
    **Physical context.** In an axisymmetric tokamak the toroidal dependence drops\
    \ out and the maximum is attained at the high-field side (small $R$), where the\
    \ dominant toroidal field component $B_\\phi \\sim B_0 R_0 / R$ is largest. Typical\
    \ values in conventional tokamaks range from roughly 3 T on axis to 6\u201310\
    \ T at the high-field side for high-field devices.\n\n$B_{\\max}$ together with\
    \ $B_{\\min}$ (the minimum on the same surface) determines the local mirror ratio\
    \ $R_{\\mathrm{mirror}} = B_{\\max}/B_{\\min}$, which governs the fraction of\
    \ magnetically trapped particles. A particle with velocity-space pitch angle $\\\
    lambda = v_\\perp^2 / (v^2 B)$ satisfies the trapping condition when $\\lambda\
    \ > 1/B_{\\max}$, i.e., when its magnetic moment prevents it from passing through\
    \ the field maximum. This in turn controls neoclassical transport coefficients\
    \ such as the bootstrap current and thermal conductivity.\n\n**IMAS data dictionary\
    \ provenance.** This standard name maps to `equilibrium/time_slice/profiles_1d/b_field_max`\
    \ (Maximum(modulus(B)) on the flux surface, always positive) in the `equilibrium`\
    \ IDS. A closely related path `equilibrium/time_slice/profiles_1d/b_max` stores\
    \ Maximum(B) on the flux surface and may differ in treatment of field-direction\
    \ sign. Both paths are indexed along the same 1D flux-surface grid as other `profiles_1d`\
    \ quantities.\n\nSign convention: Positive definite; $B_{\\max}$ is the modulus\
    \ and carries no sign."
  unit: T
  physics_domain: equilibrium
  links:
  - name:minimum_magnetic_field_strength_on_flux_surface
  - name:flux_surface_averaged_magnetic_field_strength
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_max
    dd_path: equilibrium/time_slice/profiles_1d/b_field_max
    status: composed
- name: minimum_magnetic_field_strength_on_flux_surface
  kind: scalar
  status: draft
  description: Minimum magnitude of the total magnetic field $|B|$ on each magnetic
    flux surface, always positive regardless of the sign convention for the field
    direction.
  documentation: 'The minimum magnetic field strength $B_{\min}(\psi)$ on a flux surface
    is defined as $\min_{\theta,\phi} |\mathbf{B}(\psi,\theta,\phi)|$, where $\psi$
    labels the flux surface and $(\theta, \phi)$ are poloidal and toroidal angles.
    This quantity is always positive by construction. It plays a central role in neoclassical
    transport theory: the ratio $B_{\min}/B_{\max}$ determines the trapping fraction
    of particles, since particles with $v_\perp^2/v^2 > B_{\min}/B_{\max}$ are magnetically
    trapped. In a large-aspect-ratio circular tokamak, $B_{\min} \approx B_0 R_0 /
    (R_0 + a)$, where $B_0$ is the on-axis field, $R_0$ is the major radius, and $a$
    is the minor radius; on the low-field side of the torus $B_{\min}$ corresponds
    to the field at the outboard midplane. The quantity is computed from equilibrium
    reconstruction as a profile function of the normalized flux coordinate. Together
    with [maximum magnetic field strength on the flux surface](name:maximum_magnetic_field_strength_on_flux_surface)
    and the [flux-surface-averaged magnetic field strength](name:flux_surface_averaged_magnetic_field_strength),
    it characterizes the magnetic ripple and field-line helicity relevant to transport
    and MHD stability calculations.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_strength_on_flux_surface
  - name:flux_surface_averaged_magnetic_field_strength
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_min
    dd_path: equilibrium/time_slice/profiles_1d/b_field_min
    status: composed
- name: mutual_inductance_of_grid_active_coupling
  kind: scalar
  status: draft
  description: Mutual inductance between active poloidal field coils and equilibrium
    reconstruction grid elements, quantifying the electromagnetic coupling from coil
    currents to the vector potential on each grid element.
  documentation: "The mutual inductance $M_{\\rm ga}$ couples the current $I_k$ in\
    \ each active poloidal field (PF) coil $k$ to the magnetic flux threading equilibrium\
    \ reconstruction grid element $i$ via $\\Psi_i = \\sum_k M_{\\rm ga,ik}\\, I_k$,\
    \ where $\\Psi_i$ is the poloidal flux contribution at grid element $i$ from the\
    \ active coils. This matrix enters directly into the Grad\u2013Shafranov equilibrium\
    \ reconstruction, allowing the contribution of externally driven coil currents\
    \ to be separated from the plasma current response on the computational grid.\
    \ Typical element magnitudes range from $10^{-8}$ to $10^{-5}$ H depending on\
    \ the geometric proximity of the coil to the grid element and the overall machine\
    \ scale. The matrix is computed from the Biot\u2013Savart law applied to filamentary\
    \ or distributed coil models and the grid element geometry; it is a fixed geometric\
    \ quantity recomputed only when the coil or grid configuration changes. The coupling\
    \ to passive structures is captured by [mutual_inductance_of_grid_passive_coupling](name:mutual_inductance_of_grid_passive_coupling),\
    \ while [mutual_inductance_of_passive_active_coupling](name:mutual_inductance_of_passive_active_coupling)\
    \ describes the active-to-passive link. The flux-loop analog of this grid coupling\
    \ is given by [mutual_inductance_of_flux_loop_active_coupling](name:mutual_inductance_of_flux_loop_active_coupling),\
    \ and the self-coupling of grid elements is described by [mutual_inductance_of_grid_element_self_coupling](name:mutual_inductance_of_grid_element_self_coupling)."
  unit: H
  physics_domain: equilibrium
  links:
  - name:mutual_inductance_of_grid_passive_coupling
  - name:mutual_inductance_of_passive_active_coupling
  - name:mutual_inductance_of_flux_loop_active_coupling
  - name:mutual_inductance_of_grid_element_self_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_grid_active
    dd_path: em_coupling/mutual_grid_active
    status: composed
- name: mutual_inductance_of_grid_element_self_coupling
  kind: scalar
  status: draft
  description: Self-inductance of a single equilibrium reconstruction grid element,
    defined as the magnetic flux linking that element per unit current flowing within
    it. This is the physically regularized diagonal entry of the inductive coupling
    matrix between grid elements, distinct from the off-diagonal mutual inductance
    between different elements.
  documentation: 'The self-inductance $L_{ii}$ of a grid element $i$ is defined by
    the flux-linkage relation

    $$L_{ii} = \frac{\Psi_{ii}}{I_i},$$

    where $\Psi_{ii}$ is the poloidal flux threading element $i$ due to a current
    $I_i$ flowing entirely within that same element, and all other element currents
    are zero.


    In the context of equilibrium reconstruction, the plasma cross-section is discretized
    into a set of current-carrying filaments or area elements. Each element is idealized
    as carrying a uniform current density over its cross-sectional area. The full
    inductive coupling matrix $\mathbf{M}$ has entries $M_{ij}$ giving the flux linked
    in element $i$ per unit current in element $j$. The diagonal entries $M_{ii} =
    L_{ii}$ are the self-inductances addressed by this standard name; the off-diagonal
    entries $M_{ij}$ ($i \neq j$) are the mutual inductances between distinct elements,
    addressed by [mutual_inductance_of_grid_element_coupling](name:mutual_inductance_of_grid_element_coupling).


    Because each grid element has a finite cross-sectional area, the self-inductance
    integral is well-defined and finite. For a finite-area element with cross-section
    $\mathcal{A}$, the self-inductance may be expressed as an area-averaged Neumann-type
    integral

    $$L_{ii} = \frac{\mu_0}{4\pi} \iint_{\mathcal{A} \times \mathcal{A}} \frac{d^2\mathbf{r}\,
    d^2\mathbf{r}''}{|\mathbf{r} - \mathbf{r}''|},$$

    where $\mu_0 = 4\pi \times 10^{-7}\,\mathrm{H\,m^{-1}}$ is the permeability of
    free space and $\mathbf{r}, \mathbf{r}''$ are position vectors within the element
    area. The finite extent of the element regularizes the otherwise singular point-filament
    self-inductance; the result depends on the element size and shape but not on an
    arbitrary cutoff.


    Typical self-inductance values for tokamak equilibrium grid elements range from
    a few nanohenries to a few microhenries, depending on element size (typically
    centimeters to tens of centimeters across) and geometric aspect ratio. These values
    enter the forward model of equilibrium reconstruction, determining how each grid
    element''s own current contributes to the total poloidal flux distribution across
    the plasma cross-section.


    The self-inductance matrix diagonal is complemented by coupling terms to external
    passive conductors, active coils, and flux-loop diagnostics, captured respectively
    in [mutual_inductance_of_grid_passive_coupling](name:mutual_inductance_of_grid_passive_coupling),
    [mutual_inductance_of_grid_active_coupling](name:mutual_inductance_of_grid_active_coupling),
    and [mutual_inductance_of_flux_loop_grid_coupling](name:mutual_inductance_of_flux_loop_grid_coupling).'
  unit: H
  physics_domain: equilibrium
  links:
  - name:mutual_inductance_of_grid_element_coupling
  - name:mutual_inductance_of_grid_passive_coupling
  - name:mutual_inductance_of_grid_active_coupling
  - name:mutual_inductance_of_flux_loop_grid_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_grid_grid
    dd_path: em_coupling/mutual_grid_grid
    status: composed
- name: mutual_inductance_of_grid_passive_coupling
  kind: scalar
  status: draft
  description: Mutual inductance matrix between passive conducting structures and
    equilibrium reconstruction grid elements, coupling passive-loop fluxes to the
    vector potential on each grid element.
  documentation: "The mutual inductance $M_{gp}$ quantifies the electromagnetic coupling\
    \ between passive conducting structures (such as vessel walls, stabilizing shells,\
    \ and conducting support structures) and the discrete current-filament elements\
    \ of the equilibrium reconstruction grid. For a passive loop $j$ and grid element\
    \ $i$, the coupling is defined by $\\Psi_{g,i} = \\sum_j M_{gp,ij} I_{p,j}$, where\
    \ $\\Psi_{g,i}$ is the poloidal flux threading grid element $i$ due to current\
    \ $I_{p,j}$ flowing in passive conductor $j$. This matrix enters the forward electromagnetic\
    \ model used in equilibrium reconstruction codes to compute the contribution of\
    \ eddy currents and halo currents in passive structures to the total poloidal\
    \ flux distribution. The matrix is typically pre-computed from the geometry of\
    \ the passive structures and the grid element positions using Neumann's formula\
    \ or equivalent filamentary or surface-current methods, and it is held fixed throughout\
    \ the reconstruction. It complements the [grid\u2013active coupling](name:mutual_inductance_of_grid_active_coupling)\
    \ matrix (from poloidal field coils) and the [grid self-coupling](name:mutual_inductance_of_grid_coupling)\
    \ matrix, together forming the complete inductive model. Passive-structure inductances\
    \ depend on conductor cross-section and toroidal continuity; off-diagonal elements\
    \ reflect geometric proximity between each passive segment and each grid filament."
  unit: H
  physics_domain: equilibrium
  links:
  - name:mutual_inductance_of_grid_active_coupling
  - name:mutual_inductance_of_grid_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_grid_passive
    dd_path: em_coupling/mutual_grid_passive
    status: composed
- name: solver_convergence_iteration_count
  kind: scalar
  status: draft
  description: Count of iterations performed in the convergence loop of a solver before
    the solution meets the prescribed tolerance criterion.
  documentation: 'The solver convergence iteration count records how many iteration
    cycles a numerical solver executed before its convergence criterion was satisfied
    for the system of equations being solved. A smaller count indicates rapid convergence
    (well-conditioned problem, good initial guess, or loose tolerance), while a large
    count may signal numerical stiffness, a poorly conditioned matrix, or an approaching
    divergence. For iterative linear or nonlinear solvers, the residual $r^{(k)}$
    at iteration $k$ must satisfy $\|r^{(k)}\| / \|r^{(0)}\| \leq \epsilon_{\rm tol}$
    before the loop terminates; this quantity records the final $k$ at exit. Typical
    counts range from a few iterations for well-posed equilibrium reconstructions
    to several hundred for stiff transport equations near transient events. This general
    quantity applies across solver contexts; the more specific [electron energy equation
    convergence iteration count](name:electron_energy_equation_convergence_iteration_count)
    provides an example of per-equation resolution. The companion [solver convergence
    residual relative deviation](name:solver_convergence_residual_relative_deviation)
    and [transport solver convergence relative deviation](name:transport_solver_convergence_relative_deviation)
    give the residual magnitude achieved at convergence.


    Sign convention: Positive when the solver has completed at least one iteration,
    with zero indicating no iterations were performed.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:electron_energy_equation_convergence_iteration_count
  - name:solver_convergence_residual_relative_deviation
  - name:transport_solver_convergence_relative_deviation
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/convergence/iterations_n
    dd_path: equilibrium/time_slice/convergence/iterations_n
    status: composed
  - id: dd:transport_solver_numerics/convergence/equations/ion/particles/iterations_n
    dd_path: transport_solver_numerics/convergence/equations/ion/particles/iterations_n
    status: attached
  - id: dd:transport_solver_numerics/convergence/equations/ion/state/particles/iterations_n
    dd_path: transport_solver_numerics/convergence/equations/ion/state/particles/iterations_n
    status: attached
- name: vertical_component_of_magnetic_field
  kind: scalar
  status: draft
  description: Vertical (Z) component of the magnetic field vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame, representing the field projection along the
    machine symmetry axis direction.
  documentation: 'The vertical component $B_Z = \mathbf{B} \cdot \hat{Z}$ is the projection
    of the total magnetic field onto the vertical axis $\hat{Z}$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $Z$ is the coordinate parallel to the
    machine symmetry axis. In tokamak equilibria, $B_Z$ arises primarily from the
    poloidal field system and contributes to vertical plasma stability and equilibrium
    force balance; the poloidal field magnitude is $B_p = \sqrt{B_R^2 + B_Z^2}$, where
    $B_R$ is the radial component. Typical magnitudes on the midplane range from near
    zero on the outboard equatorial plane to several tenths of a tesla near X-points
    or in the divertor region for machines like JET or ITER. The quantity is evaluated
    across the poloidal cross-section and is used together with the radial component
    to reconstruct flux surfaces and to compute the poloidal field topology; see [maximum_magnetic_field_strength_on_flux_surface](name:maximum_magnetic_field_strength_on_flux_surface)
    and [minimum_magnetic_field_strength_on_flux_surface](name:minimum_magnetic_field_strength_on_flux_surface)
    for flux-surface-averaged field extrema.


    Sign convention: Positive when $B_Z$ points in the direction of increasing $Z$
    (upward along the machine symmetry axis).'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_strength_on_flux_surface
  - name:minimum_magnetic_field_strength_on_flux_surface
  constraints: []
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
