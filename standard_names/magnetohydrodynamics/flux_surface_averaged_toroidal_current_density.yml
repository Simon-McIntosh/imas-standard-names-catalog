name: flux_surface_averaged_toroidal_current_density
status: draft
cocos_transformation_type: one_like
description: Flux-surface average of the toroidal current density, defined as $\langle
  j_\phi / R \rangle / \langle 1/R \rangle$, characterizing the current profile on
  each flux surface.
documentation: "The flux-surface-averaged toroidal current density $\\langle j_\\\
  phi \\rangle_{\\mathrm{FSA}}$ is defined by the ratio $\\langle j_\\phi / R \\rangle\
  \ / \\langle 1/R \\rangle$, where $j_\\phi$ is the local toroidal current density\
  \ in A m$^{-2}$, $R$ is the major radius in m, and $\\langle \\cdot \\rangle$ denotes\
  \ the flux-surface average $\\oint (\\cdot)\\, dS / \\oint dS$ over a surface of\
  \ constant poloidal magnetic flux $\\psi$. This definition removes the geometric\
  \ $1/R$ weighting inherent in toroidal geometry and yields a quantity that enters\
  \ directly into the Grad\u2013Shafranov source term: $\\Delta^* \\psi = -\\mu_0\
  \ R j_\\phi$. The profile peaks on axis with typical values 0.5\u20133 MA m$^{-2}$\
  \ in conventional tokamak H-mode scenarios and is inferred from equilibrium reconstruction\
  \ constrained by external magnetics and internal measurements such as motional Stark\
  \ effect (MSE) polarimetry. Positive $\\langle j_\\phi \\rangle_{\\mathrm{FSA}}$\
  \ corresponds to current flowing in the $+\\phi$ direction under COCOS-11. The safety\
  \ factor profile $q(\\psi)$ is intimately related via $q = d\\Phi_{\\mathrm{tor}}/d\\\
  Phi_{\\mathrm{pol}}$, and the local magnetic shear derives from the gradient of\
  \ $\\langle j_\\phi \\rangle_{\\mathrm{FSA}}$."
