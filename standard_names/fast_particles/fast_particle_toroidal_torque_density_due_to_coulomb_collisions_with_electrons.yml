name: fast_particle_toroidal_torque_density_due_to_coulomb_collisions_with_electrons
status: draft
description: Toroidal torque density exerted on the fast-electron population through
  Coulomb collisions with background species.
documentation: "This quantity, $\\tau_{\\phi,\\mathrm{fast,e}}^{\\mathrm{coll}}$,\
  \ represents the collisional drag torque density in the toroidal direction acting\
  \ on the supra-thermal (fast) electron distribution function due to friction with\
  \ thermal electrons and ions. Fast electrons are generated by electron-cyclotron\
  \ current drive (ECCD) or lower-hybrid current drive (LHCD) and carry a highly anisotropic\
  \ distribution in velocity space. The collisional torque governs the relaxation\
  \ rate of the fast-electron momentum toward the bulk and is obtained from the linearized\
  \ Fokker\u2013Planck collision operator $\\tau_{\\phi,\\mathrm{fast,e}} = \\int\
  \ R\\, C_{ee'}(f_{\\mathrm{fast,e}}, f_{\\mathrm{th}})\\, m_e v_\\phi\\, d^3v$,\
  \ where $R$ is the major radius, $m_e$ the electron mass, and $v_\\phi$ the toroidal\
  \ velocity component. Because $m_e \\ll m_i$, the magnitude is typically much smaller\
  \ than the corresponding ion torque density, often $10^{-5}$\u2013$10^{-3}\\;\\\
  mathrm{N\\,m^{-2}}$. Evaluated by ray-tracing/Fokker\u2013Planck codes such as LUKE\
  \ or CQL3D. See `fast_ion_collisional_toroidal_torque_density_due_to_collisions`\
  \ for the ion analogue and `electron_collisional_toroidal_torque_density_on_thermal_population_due_to_fast_ions`\
  \ for the reaction torque on the thermal electron population from fast ions."
