- name: critical_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Critical temperature at the pedestal top is the threshold kinetic temperature
    at the pedestal top at which an H-mode edge pedestal is marginal to ideal magnetohydrodynamic
    peeling-ballooning stability, representing a stability-limit quantity distinct
    from the measured or fitted pedestal temperature.
  documentation: 'Critical temperature at the pedestal top is the threshold kinetic
    temperature of a plasma species or population evaluated at the top of the H-mode
    edge transport barrier at which the pedestal is marginally stable to ideal magnetohydrodynamic
    peeling-ballooning modes. The pedestal top is the fitted transition location where
    the steep edge temperature gradient relaxes toward the core region, following
    the convention of the [temperature_at_pedestal_top](name:temperature_at_pedestal_top)
    family. This critical temperature is a stability-limit quantity, not the measured
    or fitted kinetic temperature of the edge pedestal.


    The critical temperature $T_\mathrm{crit,ped}$ at the fitted pedestal-top normalized
    poloidal flux coordinate $\psi_{N,\mathrm{ped}}$ is defined by the marginal peeling-ballooning
    stability condition:


    $$

    \gamma_\mathrm{peel-bal}(T_\mathrm{crit,ped},\, \psi_{N,\mathrm{ped}}) = 0

    $$


    where $\gamma_\mathrm{peel-bal}$ is the ideal-MHD peeling-ballooning mode growth
    rate evaluated at pedestal-top parameters and $\psi_{N,\mathrm{ped}}$ is the normalized
    poloidal flux coordinate at the pedestal top.


    The representative species specialization is [electron_critical_temperature_at_pedestal_top](name:electron_critical_temperature_at_pedestal_top);
    other species-resolved members are defined analogously. This quantity is distinct
    from [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top),
    which gives the measured kinetic temperature at the pedestal top rather than the
    stability threshold.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:temperature_at_pedestal_top
  - name:electron_critical_temperature_at_pedestal_top
  - name:electron_temperature_at_pedestal_top
  arguments:
  - name: temperature_at_pedestal_top
    operator: critical
    operator_kind: qualifier
- name: electron_critical_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Electron critical temperature at the pedestal top is the electron kinetic-temperature
    threshold at the top of an H-mode edge transport barrier for marginal ideal peeling-ballooning
    stability. It is distinct from the fitted electron temperature at the same pedestal-top
    locus.
  documentation: 'Electron critical temperature at the pedestal top is the electron
    kinetic-temperature threshold at the top of an H-mode edge transport barrier for
    marginal ideal peeling-ballooning stability. It is the pedestal-top electron temperature
    that, with the specified accompanying pedestal density, ion temperature, impurity
    content, pedestal width, current-profile, and equilibrium-shape parameters, places
    the pedestal pressure-gradient and edge-current state on the ideal magnetohydrodynamic
    stability boundary.


    The threshold is defined by the marginality condition:


    $$

    \mathcal{M}(T_{e,\mathrm{crit}}; \mathbf{p}_{\mathrm{ped}}, \mathbf{p}_{\mathrm{eq}})
    = 0

    $$


    where $T_{e,\mathrm{crit}}$ is the electron critical temperature at the pedestal
    top, $\mathcal{M}$ is the ideal peeling-ballooning marginality condition whose
    zero level is the stability boundary, $\mathbf{p}_{\mathrm{ped}}$ denotes the
    accompanying pedestal kinetic, composition, gradient, and width parameters, and
    $\mathbf{p}_{\mathrm{eq}}$ denotes the associated equilibrium, shaping, magnetic-shear,
    and current-density parameters.


    The value is conditioned on the joint pedestal/equilibrium parameter set; changing
    those companion parameters changes the threshold being named. It is the electron-specific
    counterpart of [critical_temperature_at_pedestal_top](name:critical_temperature_at_pedestal_top),
    not the fitted [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)
    at the same locus, and it does not by itself define a total pedestal temperature
    or pressure.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:critical_temperature_at_pedestal_top
  - name:electron_temperature_at_pedestal_top
  arguments:
  - name: critical_temperature_at_pedestal_top
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: summary/pedestal_fits/mtanh/stability/bootstrap_current_hager/t_e_pedestal_top_critical/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-mtanh-stability-bootstrap_current_hager-t_e_pedestal_top_critical-value
