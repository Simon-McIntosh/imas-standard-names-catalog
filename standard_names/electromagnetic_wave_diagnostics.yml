- name: vertical_wave_electric_field
  kind: scalar
  status: active
  description: "Complex phasor of the wave electric field projected onto the vertical\
    \ Z direction in the right-handed cylindrical (R, \u03C6, Z) frame, preserving\
    \ local amplitude, phase, and vertical polarization."
  documentation: 'The vertical wave electric field is the complex phasor component
    of an electromagnetic-wave electric-field vector along the vertical direction.
    It preserves the local amplitude and phase of the vertical polarization of the
    [wave electric field](name:wave_electric_field), distinct from its parallel and
    flux-surface-normal components.


    The vertical projection is defined by:


    $$

    \tilde{E}_Z(\mathbf{r}) = \tilde{\mathbf{E}}(\mathbf{r}) \cdot \hat{Z}

    $$


    where $\tilde{E}_Z$ is the vertical wave-electric-field phasor in V m$^{-1}$,
    $\tilde{\mathbf{E}}$ is the full wave-electric-field phasor in V m$^{-1}$, $\mathbf{r}$
    is position in m, and $\hat{Z}$ is the vertical unit vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame. The component is a wave phasor, not an instantaneous
    field value or a magnitude; the equilibrium or slowly varying contribution represented
    by [vertical electric field](name:vertical_electric_field) is excluded.


    Sign convention: Positive when the projected phasor component is oriented along
    the $+Z$ direction, toward increasing vertical height in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_electric_field
  - name:vertical_electric_field
  arguments:
  - name: wave_electric_field
