- name: toroidal_ion_rotation_frequency
  kind: scalar
  status: draft
  description: Toroidal angular rotation frequency of an ion species, averaged over
    charge states, defined as the toroidal velocity divided by the local major radius.
  documentation: "The toroidal rotation frequency $\\Omega_\\mathrm{tor}$ characterizes\
    \ the bulk angular rotation of an ion species about the machine symmetry axis\
    \ in the toroidal direction, with contributions from all charge states combined\
    \ into a single effective frequency. It is the primary scalar measure of ion toroidal\
    \ rotation used in momentum transport analysis and serves as a profile quantity\
    \ spanning core to edge plasma regions.\n\nThe defining relation connects $\\\
    Omega_\\mathrm{tor}$ to the toroidal fluid velocity $v_\\mathrm{tor}$ and the\
    \ local major radius $R$ in the right-handed cylindrical $(R, \\phi, Z)$ frame:\n\
    \n$$\n\\Omega_\\mathrm{tor} = \\frac{v_\\mathrm{tor}}{R}\n$$\n\nwhere $v_\\mathrm{tor}$\
    \ is the toroidal component of the ion mass-flow velocity, and $R$ is the major\
    \ radius at the evaluation point. When multiple charge states are present, this\
    \ frequency is the charge-state-averaged value, weighted by respective particle\
    \ densities. The charge-state-resolved counterpart is [toroidal ion state rotation\
    \ frequency](name:toroidal_ion_state_rotation_frequency), which distinguishes\
    \ contributions from individual ionization levels.\n\nToroidal rotation is routinely\
    \ inferred from charge exchange recombination spectroscopy, which measures the\
    \ Doppler shift of impurity emission lines to obtain $v_\\mathrm{tor}$; $\\Omega_\\\
    mathrm{tor}$ then follows by dividing by the local $R$. The closely related quantity\
    \ [toroidal ion velocity](name:toroidal_ion_velocity) gives the same physical\
    \ flow in velocity units. In NBI-heated core plasmas, $\\Omega_\\mathrm{tor}$\
    \ typically spans $10^3$\u2013$10^5$ rad/s, with co-current rotation being predominant\
    \ during tangential beam injection.\n\nSign convention: Positive when the ions\
    \ rotate in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ viewed from above $+\\hat{Z}$)."
  unit: rad.s^-1
  physics_domain: transport
  links:
  - name:toroidal_ion_state_rotation_frequency
  - name:toroidal_ion_velocity
