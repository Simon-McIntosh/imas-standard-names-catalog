- name: power_density_due_to_radiation
  kind: scalar
  status: draft
  description: Volumetric rate at which plasma thermal energy is converted into emitted
    electromagnetic radiation. It represents a local radiative loss term per unit
    volume in plasma power balance.
  documentation: 'Power density due to radiation is the local rate per unit volume
    at which plasma thermal energy is converted into emitted electromagnetic radiation.
    It includes continuum emission, line radiation, recombination radiation, and radiation
    from intrinsic or injected impurities. It is the same physical loss density commonly
    denoted [radiative_power_density](name:power_density_due_to_radiation), while
    this name emphasizes its role as one term in plasma power balance alongside processes
    such as power_density_due_to_conduction.


    The quantity is defined from a radiated power element by:


    $$

    p_\mathrm{rad} = \frac{dP_\mathrm{rad}}{dV}

    $$


    where $p_\mathrm{rad}$ is the local radiative power density, $dP_\mathrm{rad}$
    is the photon power emitted from the volume element $dV$, and the resulting unit
    is W m$^{-3}$.


    Experimentally it is inferred from bolometer signals, filtered cameras, spectroscopy,
    or tomographic reconstructions by converting measured photon brightness into local
    emissivity. In modeling and power-balance analysis it is often estimated with
    atomic cooling functions; for an optically thin plasma a common local form is
    $p_\mathrm{rad} \approx n_e \sum_z n_z L_z(T_e,n_e,\ldots)$, where $n_e$ is electron
    density in m$^{-3}$, $n_z$ is the density of radiating species or charge state
    $z$ in m$^{-3}$, $T_e$ is electron temperature, and $L_z$ has units W m$^3$.


    Typical values span many orders of magnitude: hot-core bremsstrahlung and light-impurity
    emission are often 10^3-10^6 W m^-3, while radiating edge regions, impurity-seeded
    plasmas, or disruption-mitigation scenarios can reach 10^5-10^8 W m^-3 locally.
    Exact values depend strongly on density, temperature, impurity concentration,
    charge-state distribution, and optical thickness.


    Sign convention: Positive when radiative emission removes energy from the plasma.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:disruption/profiles_1d/power_density_radiative_losses
    dd_path: disruption/profiles_1d/power_density_radiative_losses
    status: composed
- name: power_due_to_line_radiation
  kind: scalar
  status: draft
  description: Total electromagnetic power radiated by the plasma via line radiation,
    the discrete photon emission from bound-bound transitions in impurity and hydrogen
    ions.
  documentation: 'Power due to line radiation is the volume-integrated electromagnetic
    power emitted in discrete spectral lines by bound-bound atomic transitions in
    neutral atoms and ions. It is a component of the total radiated power, distinct
    from continuum [bremsstrahlung_power](name:bremsstrahlung_power) and [power_due_to_synchrotron_radiation](name:power_due_to_synchrotron_radiation),
    and usually represents an energy-loss channel from the thermal plasma.


    For optically thin plasma, a common collisional-radiative representation is:


    $$

    P_\mathrm{line} = \int_V n_e \sum_z n_z L_z(T_e,n_e) \, dV

    $$


    where $n_e$ is the electron density in m$^{-3}$, $n_z$ is the density in m$^{-3}$
    of emitting ion population $z$, $L_z$ is the effective line-radiation cooling
    coefficient in W m$^3$, $T_e$ is the electron temperature, and $dV$ is the volume
    element in m$^3$.


    In practice, line-radiation power is inferred from absolutely calibrated spectroscopy,
    filtered imaging, bolometry with spectral separation, or tomographic reconstruction
    combined with atomic physics models. Computations require electron temperature,
    electron density, impurity concentrations, ionization balance, excitation rates,
    photon energies, and possible corrections for optical thickness in dense edge
    or divertor regions.


    Typical values range from $10^4$-$10^5$ W in very clean low-power plasmas to $10^5$-$10^7$
    W in present-day auxiliary-heated tokamaks, and can reach several $10^7$ W in
    impurity-seeded, detached, or strongly radiating scenarios. The emitted power
    contributes to plasma energy loss, while radiated_power_at_wall describes the
    surface-deposited radiative load after transport to surrounding structures.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bremsstrahlung_power
  - name:power_due_to_synchrotron_radiation
  sources:
  - id: dd:summary/global_quantities/power_line/value
    dd_path: summary/global_quantities/power_line/value
    status: composed
- name: power_due_to_synchrotron_radiation
  kind: scalar
  status: draft
  description: Total electromagnetic power emitted by the plasma through synchrotron
    radiation from relativistic electron gyro-motion in the magnetic field.
  documentation: 'Synchrotron-radiation power is the total electromagnetic power emitted
    by electrons whose gyro-motion in the magnetic field is relativistic enough to
    radiate appreciably. It is a mechanism-specific contribution to the plasma radiative
    power balance and is non-negative, with zero corresponding to absent or negligible
    synchrotron emission.


    For a plasma volume $V$, the emitted synchrotron power is defined by the volume
    integral of the local volumetric emissivity:


    $$

    P_{\mathrm{syn}} = \int_V p_{\mathrm{syn}}(\mathbf{r})\,dV

    $$


    where $P_{\mathrm{syn}}$ is the global power in W, $p_{\mathrm{syn}}$ is the local
    synchrotron emissivity in W m$^{-3}$, $dV$ is a volume element in m$^3$, and $\mathbf{r}$
    denotes position. The integration is over the emitting plasma volume.


    The quantity denotes emitted synchrotron power. It is not necessarily the net
    power escaping the plasma-facing boundary: synchrotron photons may be reabsorbed
    in the plasma or reflected by surrounding structures. If a radiation-transport
    model is used, the emissivity in the integral should represent the chosen convention,
    such as gross emitted emissivity or net loss emissivity after absorption.


    In practice, synchrotron power is usually computed from the electron distribution
    function, magnetic-field strength, plasma geometry, and an optical-depth or wall-reflection
    model; direct bolometric separation from other radiative mechanisms is generally
    difficult. For thermal plasmas the emission grows rapidly with electron temperature
    and magnetic-field strength and is also proportional to the number of radiating
    electrons, but quantitative values require the full emissivity model rather than
    a universal scaling law.


    Typical global values span many orders of magnitude: effectively 0 W when relativistic-electron
    synchrotron emission is negligible or not modeled, up to kW-MW levels in hot high-field
    tokamak plasmas, with reactor-relevant scenarios potentially reaching the upper
    part of that range depending on absorption and reflection assumptions.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:total_plasma_radiated_power
  - name:bremsstrahlung_power
  - name:power_due_to_line_radiation
  sources:
  - id: dd:summary/global_quantities/power_synchrotron/value
    dd_path: summary/global_quantities/power_synchrotron/value
    status: composed
- name: power_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Radiative power received by a hard X-ray detector channel, integrated
    over its photon-energy acceptance band and serving as a direct measure of suprathermal
    electron bremsstrahlung emission.
  documentation: 'Hard X-ray diagnostic power is the total electromagnetic power deposited
    on a detector channel by photons in the hard X-ray band, produced predominantly
    by suprathermal and runaway electrons decelerating in the Coulomb fields of plasma
    ions via bremsstrahlung.


    The channel-integrated power relates to the photon power spectral density $d\Phi/dE$
    at the detector face through:


    $$

    P = \int_{\Delta E} \frac{d\Phi}{dE} \, dE

    $$


    where $\Delta E$ is the channel''s photon-energy acceptance interval and $d\Phi/dE$
    is the power spectral density incident on the detector.


    Measurement uses scintillator-based detectors (NaI(Tl), BGO, LaBr$_3$) or solid-state
    semiconductor detectors (CdTe, HPGe) operated in current mode or pulse-height
    analysis mode, with detector efficiency calibration applied to convert count rates
    to power. The hard X-ray power level is sensitive to the high-energy tail of the
    electron energy distribution, making this quantity a primary diagnostic indicator
    for runaway electron characterization and suprathermal electron beam measurements
    during disruptions and off-normal plasma events.


    The spectrally resolved counterpart, expressed as power per detector area per
    steradian, is [spectral radiance of a hard X-ray detector channel](name:spectral_radiance_of_hard_xray_detector).
    The soft X-ray analog covering lower photon energies is [power_of_soft_xray_detector](name:power_of_soft_xray_detector).
    The total volumetric bremsstrahlung emission driving the detected signal is described
    by [bremsstrahlung_power](name:bremsstrahlung_power).'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance_of_hard_xray_detector
  - name:power_of_soft_xray_detector
  - name:bremsstrahlung_power
  sources:
  - id: dd:hard_x_rays/channel/power
    dd_path: hard_x_rays/channel/power
    status: composed
- name: power_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Radiative power received by a soft X-ray detector channel, integrated
    over its soft-X-ray photon-energy band.
  documentation: "Power of a soft X-ray detector is the total electromagnetic power\
    \ delivered to one detector channel by plasma emission in the soft-X-ray photon-energy\
    \ range. It is an energy-band-integrated received power, so it depends on both\
    \ the plasma spectral emission along the viewing chord and the channel throughput\
    \ over photon energy.\n\nA common model expresses the received power as a photon-energy\
    \ integral of the line-integrated directional spectral emissivity weighted by\
    \ the detector \xE9tendue and spectral response:\n\n$$\nP_\\mathrm{SXR} = \\int\
    \ R(E)\\,\\mathcal{G}(E)\\left[\\int_\\mathrm{LOS} \\varepsilon_E(\\mathbf{r}(\\\
    ell),E)\\,d\\ell\\right] dE\n$$\n\nwhere $E$ is photon energy, $R(E)$ is the dimensionless\
    \ filter and detector response, $\\mathcal{G}(E)$ is the channel \xE9tendue in\
    \ m^2 sr, $\\varepsilon_E$ is the directional spectral emissivity in W m^-3 sr^-1\
    \ J^-1 when $E$ is in joules, and $d\\ell$ is a line element in meters along the\
    \ line of sight. If photon energy is expressed in eV, $\\varepsilon_E$ must instead\
    \ be expressed per eV so that the integral remains in W. Equivalent formulations\
    \ may use spectral radiance at the detector aperture in place of the bracketed\
    \ line integral.\n\nIn practice this quantity is inferred from detector current,\
    \ voltage, or photon-counting rate using calibration of the filter transmission,\
    \ detector quantum efficiency, gain, aperture, and viewing geometry. It is used\
    \ to compare soft-X-ray brightness between channels, constrain tomographic reconstructions,\
    \ and monitor fast changes associated with MHD activity, impurity radiation, or\
    \ core temperature variations.\n\nTypical received powers are about $10^{-9}-10^{-5}$\
    \ W for strongly collimated or heavily filtered channels in medium-size tokamak\
    \ plasmas, and may reach $10^{-4}-10^{-3}$ W for large-\xE9tendue channels or\
    \ very bright soft-X-ray emission. The range depends strongly on plasma temperature,\
    \ impurity content, filter thickness, detector area, and viewing chord."
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_density_of_soft_xray_detector
  - name:brightness_of_soft_xray_detector
  sources:
  - id: dd:soft_x_rays/channel/power
    dd_path: soft_x_rays/channel/power
    status: composed
- name: radial_coordinate_of_aperture
  kind: scalar
  status: draft
  description: Major radius R coordinate of the geometric center of a diagnostic aperture
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: "The major-radius $R$ coordinate of the geometric center of a diagnostic\
    \ aperture locates the aperture centroid along the radial axis of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the perpendicular distance from\
    \ the machine toroidal symmetry axis measured outward. For spatially extended\
    \ apertures, the representative point is the centroid of the aperture opening;\
    \ the physical size of the aperture opening is separately characterized by [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture).\n\
    \nThis coordinate is established from mechanical survey data or optical alignment\
    \ procedures performed during diagnostic installation and commissioning, and it\
    \ enters line-of-sight geometry models that project plasma emission volumes onto\
    \ detector arrays. It applies across a wide range of plasma diagnostics, including\
    \ hard and soft X-ray cameras, visible and ultraviolet spectrometers, neutron\
    \ detectors, and infrared imaging systems. The analogous coordinate for filter\
    \ windows is given by [radial_coordinate_of_filter_window](name:radial_coordinate_of_filter_window),\
    \ and the measurement-position counterpart used in equilibrium reconstruction\
    \ is [radial_coordinate_of_measurement_position](name:radial_coordinate_of_measurement_position).\n\
    \nTypical values span roughly 0.5\u201310 m depending on device size and the radial\
    \ placement of the diagnostic port.\n\nSign convention: Positive when the aperture\
    \ center lies at a positive major radius in the $+\\hat{R}$ direction from the\
    \ machine toroidal symmetry axis."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
