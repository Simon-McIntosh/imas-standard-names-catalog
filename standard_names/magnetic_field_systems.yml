- name: area_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Physical cross-sectional area enclosed by a poloidal-field coil element
    conductor or winding pack, used to characterize conductor size for current density
    and loading estimates.
  documentation: 'The area of a poloidal-field coil is the physical cross-section
    enclosed by the conductor or winding-pack boundary, perpendicular to the local
    current path through the coil element. It determines the engineering current density
    when combined with [current of poloidal-field coil](name:current_of_poloidal_field_coil),
    and it is the aggregate geometric measure associated with dimensional quantities
    such as [width of poloidal-field coil](name:width_of_poloidal_field_coil) and
    [height of poloidal-field coil](name:height_of_poloidal_field_coil).


    For a general coil-element cross-section $S$, the defining geometric measure is


    $$

    A_{\mathrm{PF}} = \int_S dS

    $$


    where $A_{\mathrm{PF}}$ is the coil cross-sectional area and $dS$ is the differential
    surface element over the conductor or winding-pack cross-section. For rectangular
    sections this reduces to the product of the radial and vertical dimensions in
    the right-handed cylindrical $(R, \phi, Z)$ frame; for annular sections it is
    related to [inner radius of poloidal-field coil](name:inner_radius_of_poloidal_field_coil)
    and [outer radius of poloidal-field coil](name:outer_radius_of_poloidal_field_coil).


    The area is determined from engineering geometry, manufacturing drawings, metrology
    of the coil casing or winding pack, or electromagnetic model geometry. It may
    also be reconstructed from measured outline dimensions, with [length of poloidal-field
    coil](name:length_of_poloidal_field_coil) used for oblique or non-rectangular
    cross-section descriptions when applicable.


    Representative element cross-sections range from about 1e-3-1 m^2 for auxiliary
    and medium-size poloidal-field coils, and can exceed 1 m^2 for large superconducting
    coil modules or central-solenoid-like structures.


    Sign convention: Positive when the cross-section is evaluated as the unsigned
    physical area enclosed by the poloidal-field coil element boundary.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  sources:
