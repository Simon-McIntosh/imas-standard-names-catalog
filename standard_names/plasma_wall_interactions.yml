- name: neutral_internal_state_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Neutral internal-state particle flux at a wall due to recombination
    is the outgoing particle flux density of neutral atoms or molecules in a specified
    internal quantum state produced by ion recombination at a plasma-facing wall surface.
  documentation: 'Neutral internal-state particle flux at a wall due to recombination
    is the particle flux density of neutral atoms or molecules in a specified internal
    quantum state that are produced by ion recombination at a plasma-facing wall surface
    and cross that surface away from the wall. It is resolved by the neutral product
    species and by the internal quantum state of that product.


    For neutral product species $n$ in internal state $\alpha$, with $\hat{\mathbf
    n}_w$ the unit normal directed from wall material into the adjacent plasma, the
    outgoing recombination contribution is defined by


    $$

    \Gamma^{\mathrm{rec,out}}_{n,\alpha} = \int_{\mathbf v \cdot \hat{\mathbf n}_w
    > 0} (\mathbf v \cdot \hat{\mathbf n}_w)\, f^{\mathrm{rec}}_{n,\alpha}(\mathbf
    v)\, d^3\mathbf v

    $$


    where $\mathbf v$ is particle velocity and $f^{\mathrm{rec}}_{n,\alpha}$ is the
    velocity-space distribution at the wall of neutral products generated by recombination.


    This quantity includes only neutral recombination products in the specified internal
    state. Summing over internal states for the same neutral product species gives
    the [neutral particle flux at wall due to recombination](name:neutral_particle_flux_at_wall_due_to_recombination);
    the incident-direction counterpart is [incident neutral internal-state particle
    flux at wall due to recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination).


    Sign convention: Positive when neutral recombination products cross the wall surface
    along the wall normal directed from the wall material into the plasma.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall_due_to_recombination
