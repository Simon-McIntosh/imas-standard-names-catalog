      kind: template
- name: toroidal_argon_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Toroidal argon velocity at the pedestal top is the \u03C6 component,\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, of the density-weighted\
    \ mean bulk flow of argon impurity ions where the H-mode pedestal transitions\
    \ to the confined core."
  documentation: 'Toroidal argon velocity at the pedestal top is the $\phi$ component,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, of the density-weighted
    mean bulk flow of argon impurity ions where the H-mode pedestal transitions to
    the confined core. As an intensive species-level quantity, it is the density-weighted
    mean over all argon charge states, not a charge-state-summed velocity.


    The charge-state aggregation is defined by the density-weighted mean at the pedestal
    top:


    $$

    v_{\phi,\mathrm{Ar}}^{\mathrm{ped}} = \frac{\sum_q n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}}
    v_{\phi,\mathrm{Ar}^{q+}}^{\mathrm{ped}}}{\sum_q n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}}}

    $$


    where $q$ indexes argon ionization state, $n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}}$
    is the local number density of that charge state, and $v_{\phi,\mathrm{Ar}^{q+}}^{\mathrm{ped}}$
    is its toroidal velocity component at the pedestal top.


    It is inferred primarily from Doppler spectroscopy of argon emission, often charge-exchange
    recombination spectroscopy when suitable neutral-beam excitation is available.
    The observed line shift and viewing geometry determine the velocity projected
    onto the $\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame; estimating the all-charge-state mean may require emissivity modeling, ionization-balance
    information, or collisional equilibration assumptions.


    Because pedestal argon rotation is sensitive to external torque, radial electric-field
    shear, neoclassical friction, turbulence-driven momentum transport, and charge-state
    distribution, no device-independent numerical range is implied. This value is
    commonly interpreted with same-species values at other loci, including [toroidal
    argon velocity at the magnetic axis](name:toroidal_argon_velocity_at_magnetic_axis),
    [toroidal argon velocity at the internal transport barrier](name:toroidal_argon_velocity_at_internal_transport_barrier),
    [toroidal argon velocity at the plasma boundary](name:toroidal_argon_velocity_at_plasma_boundary),
    and [toroidal flux-surface-averaged argon velocity at the plasma boundary](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary).


    Sign convention: Positive when the density-weighted mean argon flow points in
    the $+\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:argon_density_at_pedestal_top
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_internal_transport_barrier
  - name:toroidal_tungsten_velocity_at_pedestal_top
  - name:toroidal_nitrogen_velocity_at_pedestal_top
  sources:
  - dd_path: summary/local/pedestal/velocity_phi/argon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-pedestal-velocity_phi-argon-value
    dd_documentation:
      leaf: Value
