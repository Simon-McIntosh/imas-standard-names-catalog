name: flux_surface_averaged_inverse_major_radius
status: draft
description: Flux-surface average of the inverse major radius $\langle 1/R \rangle$,
  a geometric metric coefficient used in equilibrium and transport calculations.
documentation: "The quantity $\\langle 1/R \\rangle = \\oint (1/R)\\, d\\ell / \\\
  oint d\\ell$ represents the flux-surface average of the reciprocal of the major\
  \ radius $R$ (in m), where the integral is taken over the poloidal cross-section\
  \ of the flux surface weighted by the Jacobian. It appears as the metric coefficient\
  \ $gm9$ in the Grad\u2013Shafranov equilibrium formulation and enters expressions\
  \ for the flux-surface-averaged toroidal current density, the neoclassical bootstrap\
  \ current, and the toroidal component of Ohm's law. Typical values range from $\\\
  sim 0.15$\u2013$0.6\\;\\mathrm{m^{-1}}$ for medium-to-large tokamaks (DIII-D, JET,\
  \ ITER) depending on the Shafranov shift; it decreases monotonically from the high-field\
  \ side toward the magnetic axis. Computed during equilibrium reconstruction by codes\
  \ such as EFIT, CHEASE, or LIUQE. See also the companion metric quantities `flux_surface_averaged_square_of_radial_coordinate_gradient`\
  \ and `flux_surface_averaged_inverse_square_magnetic_field_strength`."
