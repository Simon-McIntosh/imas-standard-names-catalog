name: iron_composition_fraction
status: draft
cocos_transformation_type: one_like
description: Fractional contribution of iron ions to the total plasma ion composition,
  expressed as a dimensionless ratio.
documentation: "The iron composition fraction $f_{\\mathrm{Fe}} = n_{\\mathrm{Fe}}\
  \ / \\sum_s n_s$ (dimensionless) quantifies the relative abundance of iron ions\
  \ among all ion species in the plasma, where $n_{\\mathrm{Fe}}$ is the iron ion\
  \ number density (in m$^{-3}$) and $\\sum_s n_s$ is the total ion number density\
  \ summed over all species $s$. Iron is a high-$Z$ impurity ($Z = 26$) that can enter\
  \ the plasma through sputtering of steel-based first-wall and structural components;\
  \ even trace concentrations ($f_{\\mathrm{Fe}} \\sim 10^{-4}$\u2013$10^{-3}$) contribute\
  \ significantly to radiative power losses via line radiation from partially ionized\
  \ charge states. The quantity is typically inferred from vacuum ultraviolet (VUV)\
  \ and soft-X-ray spectroscopy of Fe emission lines, combined with ionization-balance\
  \ modeling (e.g., ADAS atomic data). See also `iron_number_density` for the absolute\
  \ density."
