- name: width_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Full geometric width of a toroidal-field-coil conductor cross-section,
    measured as the boundary-to-boundary transverse extent along the normal direction
    of the local Frenet-Serret frame. It is an unsigned extent, not a centerline location
    or coil radius.
  documentation: 'Full geometric width of a toroidal-field-coil conductor cross-section,
    measured along the normal axis of the local right-handed Frenet-Serret frame $(\hat{t},
    \hat{n}, \hat{b})$. The tangent $\hat{t}$ follows the conductor centerline, the
    normal $\hat{n}$ lies in the cross-section plane, and the binormal $\hat{b} =
    \hat{t} \times \hat{n}$; the corresponding extent along $\hat{b}$ is [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil).


    The width is the boundary-to-boundary span of the outer conductor boundary $\partial
    S$ projected onto $\hat{n}$:


    $$

    w = \max_{\mathbf{r} \in \partial S} (\mathbf{r} \cdot \hat{n}) - \min_{\mathbf{r}
    \in \partial S} (\mathbf{r} \cdot \hat{n})

    $$


    where $\mathbf{r}$ is the position of a boundary point in the cross-section plane
    and $\hat{n}$ is the unit normal. Reversing the sense of $\hat{n}$ leaves $w$
    unchanged, so it is an unsigned extent.


    For a rectangular or square section this is the full side length along $\hat{n}$;
    for a circular section it is the diameter; for an annular section it is the outer
    diameter, not the bore diameter or wall thickness. It is a geometric extent of
    the outer cross-section and is distinct from a centerline location or from a coil
    radius such as [radius_of_toroidal_field_coil](name:radius_of_toroidal_field_coil)
    or [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil).'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_toroidal_field_coil
  - name:radius_of_toroidal_field_coil
  sources:
  - dd_path: tf/coil/conductor/cross_section/width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-coil-conductor-cross_section-width
    dd_documentation:
      leaf: Full width of the rectangle or square in the normal direction, when geometry_type/index
        = 3 or 4. Diameter of the circle when geometry_type/index = 2. Outer diameter
        of the annulus in case geometry_type/index = 5
      parent_path: tf/coil/conductor/cross_section
      parent: The cross-section perpendicular to the TF conductor contour is described
        by a series of contour points, given by their relative position with respect
        to the start point of the first element. This cross-section is assumed constant
        for all elements.
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: 'Characteristic width of a TF coil conductor cross-section: full
        width for rectangular/square geometries, diameter for circular, or outer diameter
        for annular cross-sections, depending on the geometry type index.'
      kind: llm
- name: x_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: active
  description: "Signed Cartesian x coordinate of a ferritic element\u2019s geometric\
    \ centroid in the right-handed (x, y, z) frame, with z aligned with the vertical\
    \ Z direction."
  documentation: "The quantity is the signed Cartesian x position of the geometric\
    \ centroid of a ferritic element. It gives the element\u2019s absolute position\
    \ in the right-handed Cartesian $(\\hat{x}, \\hat{y}, \\hat{z})$ basis, with $\\\
    hat{z}$ aligned with the vertical direction; it is not a radial coordinate or\
    \ a local displacement.\n\nFor an element occupying volume $V$, the centroid coordinate\
    \ is defined by\n\n$$\nx_c = \\frac{1}{V}\\int_V x\\,\\mathrm{d}V\n$$\n\nwhere\
    \ $x_c$ and $x$ are Cartesian x coordinates in meters, $V$ is the element volume,\
    \ and $\\mathrm{d}V$ is a volume element. Together with the [y coordinate of the\
    \ ferritic element centroid](name:y_coordinate_of_ferritic_element_centroid) and\
    \ [z coordinate of the ferritic element centroid](name:z_coordinate_of_ferritic_element_centroid),\
    \ it locates the same geometric centroid; it is distinct from the [radial coordinate\
    \ of the ferritic element centroid](name:radial_coordinate_of_ferritic_element_centroid).\n\
    \nSign convention: Positive when the centroid lies in the $+x$ direction from\
    \ the Cartesian origin."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:y_coordinate_of_ferritic_element_centroid
  - name:z_coordinate_of_ferritic_element_centroid
  - name:radial_coordinate_of_ferritic_element_centroid
  sources:
