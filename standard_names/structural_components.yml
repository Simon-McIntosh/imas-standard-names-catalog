- name: area_of_first_wall
  kind: scalar
  status: active
  description: Total geometric area of the material surface forming the plasma-facing
    first wall, including installed wall armor and bare vessel surface where applicable.
  documentation: 'The first-wall area is the geometric measure of the material surface
    exposed toward the plasma and forming the innermost plasma-facing boundary. It
    includes installed wall armor and bare vessel surface where no armor is present,
    but excludes backing structures and surfaces that are not plasma-facing.


    $$

    A_{\mathrm{FW}} = \int_{\mathcal{S}_{\mathrm{FW}}} \mathrm{d}A

    $$


    where $A_{\mathrm{FW}}$ is the total first-wall area, $\mathcal{S}_{\mathrm{FW}}$
    is the plasma-facing first-wall surface, and $\mathrm{d}A$ is an elemental surface
    area. This surface measure is distinct from the enclosed [volume of the first
    wall](name:volume_of_first_wall) and provides the geometric basis for integrating
    areal loads such as [energy flux at the wall](name:energy_flux_at_wall).'
  unit: m^2
  physics_domain: structural_components
  links:
  - name:volume_of_first_wall
  - name:energy_flux_at_wall
  sources:
  - dd_path: wall/first_wall_surface_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-first_wall_surface_area
    dd_documentation:
      leaf: First wall surface area
      data_type: FLT_0D
      unit: m^2
      lifecycle_status: alpha
    enhanced_context:
      description: Total surface area of the first wall (A_fw), the plasma-facing
        inner surface of the vacuum vessel. A global device geometry parameter relevant
        to plasma-wall interaction and heat load analysis.
      kind: llm
- name: fraction_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Fraction of breeder blanket layer is the part-to-whole share of a specified
    constituent material, phase, void, or subregion within a defined breeder-blanket
    layer. It abstracts composition fractions formed on a stated basis, such as volume,
    mass, chemical amount, or atom count, for homogenized layer properties.
  documentation: 'Fraction of breeder blanket layer is the composition share of a
    specified constituent material, phase, void, or subregion within a defined breeder-blanket
    layer. It is an abstract part-to-whole fraction; each concrete specialization
    defines which extensive geometrical or material measure is used to form the share.


    For a constituent $\alpha$ and a chosen fraction basis $Q$, the fraction is defined
    by


    $$

    f_\alpha^{(Q)} = \frac{Q_\alpha}{Q_\mathrm{layer}}

    $$


    where $Q_\alpha$ is the selected extensive measure associated with constituent
    $\alpha$ in the breeder-blanket layer, and $Q_\mathrm{layer}$ is the corresponding
    total measure for that same layer on the same basis.


    Fractions formed on different bases, such as volume basis, mass basis, chemical-amount
    basis, or atom-count basis, are distinct quantities and are not generally interchangeable.
    The [volumetric fraction of breeder blanket layer](name:volumetric_fraction_of_breeder_blanket_layer)
    is the volume-basis specialization of this parent concept. A set of such fractions
    sums to unity only when the listed constituents form a complete, non-overlapping
    decomposition of the same layer on the same basis.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:volumetric_fraction_of_breeder_blanket_layer
  - name:volume_of_breeder_blanket
- name: heating_power_of_breeder_blanket
  kind: scalar
  status: active
  description: Heating power of a breeder blanket is the rate at which thermal energy
    is deposited or generated in breeder-blanket materials, integrated over the whole
    blanket and independent of deposition mechanism. Mechanism-qualified names such
    as nuclear heating power are contributions to this aggregate.
  documentation: 'Heating power of a breeder blanket is the total rate of conversion
    of any energy source into thermal energy within the materials of the breeder blanket.
    It is a mechanism-independent source power for the blanket as a component, summed
    over all breeder-blanket modules and materials.


    The integrated heating power may be written as the sum of volumetric and absorbed
    surface contributions:


    $$

    P_\mathrm{heat} = \int_{V_\mathrm{bb}} q_V(\mathbf{r})\,dV + \int_{\partial V_\mathrm{bb}}
    q_S(\mathbf{r})\,dA

    $$


    where $V_\mathrm{bb}$ is the breeder-blanket material volume, $\partial V_\mathrm{bb}$
    denotes its heat-receiving boundary surfaces, $q_V$ is the local volumetric heating-rate
    density, and $q_S$ is the absorbed surface heat-flux density.


    Only energy deposited in or converted to heat by the breeder-blanket materials
    is included. Incident power not absorbed in those materials, heat generated in
    neighboring structures, and power removed by coolants after deposition are not
    part of this source quantity. Mechanism-qualified quantities, such as [nuclear
    heating power of a breeder blanket](name:nuclear_heating_power_of_breeder_blanket),
    are specific contributions to this mechanism-independent quantity rather than
    duplicate definitions.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_power_density_of_breeder_blanket_layer
- name: heating_power_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Rate at which energy is deposited as heat within a defined breeder-blanket
    material layer, integrated over the layer and independent of deposition mechanism.
  documentation: 'Heating power of a breeder-blanket layer is the total rate of energy
    converted to heat within a specified material layer. It is an extensive quantity
    integrated over the layer, rather than a local volumetric heat source.


    $$

    P_{\mathrm{layer}} = \int_{V_{\mathrm{layer}}} \dot{q}_{\mathrm{dep}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $P_{\mathrm{layer}}$ is the layer-integrated heating power, $\dot{q}_{\mathrm{dep}}(\mathbf{r})$
    is the local volumetric rate of energy deposition at position $\mathbf{r}$, and
    $V_{\mathrm{layer}}$ is the volume of the defined material layer. The quantity
    is distinct from [power density of a breeder blanket layer](name:power_density_of_breeder_blanket_layer),
    which is local; [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer)
    is a mechanism-specific specialization involving neutron and photon energy deposition.'
  unit: W
  physics_domain: structural_components
  links:
  - name:power_density_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_layer
- name: heating_power_of_breeder_blanket_shield
  kind: scalar
  status: active
  description: Rate of energy deposition as heat within the breeder blanket shield,
    integrated over the full shield volume and independent of the specific deposition
    mechanism.
  documentation: "The heating power of the breeder blanket shield is the volume-integral\
    \ of all local power-deposition rates within the shield structural materials,\
    \ encompassing every mechanism by which incident radiation transfers energy to\
    \ the shield.\n\nThe total shield heating power $P_\\mathrm{shield}$ is defined\
    \ as:\n\n$$\nP_\\mathrm{shield} = \\int_{V_\\mathrm{shield}} q'''(\\mathbf{r})\
    \ \\, dV\n$$\n\nwhere $q'''(\\mathbf{r})$ is the local volumetric power deposition\
    \ rate and $V_\\mathrm{shield}$ is the total shield volume.\n\nIn a fusion blanket,\
    \ the shield primarily attenuates the neutron and photon fluxes emerging from\
    \ the breeding zone, making nuclear interactions \u2014 neutron scattering, neutron\
    \ capture, and secondary gamma absorption \u2014 the dominant heating channel,\
    \ as detailed by [nuclear_heating_power_of_breeder_blanket_shield](name:nuclear_heating_power_of_breeder_blanket_shield).\
    \ This total power sets the thermal load on shield coolant circuits and constrains\
    \ peak material temperatures critical for structural integrity. The layer-resolved\
    \ analog [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer)\
    \ and the module-integrated quantity [nuclear_heating_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module)\
    \ provide complementary views of the power distribution within the broader blanket\
    \ system. Shield heating powers are obtained by integrating neutron and photon\
    \ transport solutions over the shield volume, summing contributions from all interaction\
    \ channels."
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_shield
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_module
- name: nuclear_heating_power_of_breeder_blanket
  kind: scalar
  status: active
  description: Total rate of heat generation in all breeder-blanket materials from
    neutron and photon interactions, excluding plasma-facing surface heat loads and
    external incident power.
  documentation: 'Nuclear heating power of the breeder blanket is the total rate at
    which neutron and photon interactions deposit energy as heat throughout all included
    blanket materials. It is the blanket-wide nuclear component of [heating power
    of the breeder blanket](name:heating_power_of_breeder_blanket).


    The defining relation is


    $$

    P_{\mathrm{nuc}} = \int_{V_{\mathrm{BB}}} q_{\mathrm{nuc}}(\mathbf{r})\,dV

    $$


    where $q_{\mathrm{nuc}}(\mathbf{r})$ is the local nuclear heating power density
    in W m$^{-3}$, $\mathbf{r}$ is position within the blanket, $dV$ is differential
    volume in m$^3$, and $V_{\mathrm{BB}}$ is the union of the included blanket-module
    and constituent-material volumes.


    The integral includes energy deposited by neutron scattering, neutron capture,
    and photon interactions, including secondary gamma absorption, without double-counting
    overlapping material descriptions. It excludes power carried by neutrons or photons
    crossing into the blanket before deposition and separate plasma-facing surface
    loads. Module- and layer-restricted integrals are represented by [nuclear heating
    power of the breeder blanket module](name:nuclear_heating_power_of_breeder_blanket_module)
    and [nuclear heating power of the breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer),
    respectively.'
  unit: W
  physics_domain: structural_components
  links:
  - name:heating_power_of_breeder_blanket
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_layer
  arguments:
  - name: heating_power_of_breeder_blanket
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/time_slice/power_nuclear_blanket
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-time_slice-power_nuclear_blanket
    dd_documentation:
      leaf: Nuclear heating power on the blanket
      parent_path: breeding_blanket/time_slice
      parent: Dynamic quantities for a set of time_slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Nuclear heating power deposited in the breeding blanket modules
        by neutron and gamma interactions (P_nuclear,blanket). A key performance metric
        governing tritium breeding and energy multiplication in a fusion reactor.
      kind: llm
- name: nuclear_heating_power_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Total rate of heat generated within one breeder-blanket material layer
    by neutron and photon interactions, excluding external and surface heat loads.
  documentation: 'Nuclear heating power of a breeder-blanket layer is the volume-integrated
    rate at which neutron and photon interactions convert radiation energy into heat
    within that material layer. It is the nuclear component of [heating power of a
    breeder-blanket layer](name:heating_power_of_breeder_blanket_layer), rather than
    the local volumetric quantity [nuclear power density of a breeder-blanket layer](name:nuclear_power_density_of_breeder_blanket_layer).


    The defining relation is


    $$

    P_{\mathrm{nuc,layer}} = \int_{V_{\mathrm{layer}}} \dot{q}_{\mathrm{nuc}}\,\mathrm{d}V

    $$


    where $P_{\mathrm{nuc,layer}}$ is the layer-integrated nuclear heating power,
    $\dot{q}_{\mathrm{nuc}}$ is the local nuclear energy-deposition rate per unit
    volume, and $V_{\mathrm{layer}}$ is the volume of the specified material layer.


    The integral includes energy deposited by neutron interactions and absorption
    of primary or secondary photons within the layer. It excludes plasma-facing radiative
    heat loads, incident energy that is not deposited, and energy deposited outside
    the layer; the result is non-negative.'
  unit: W
  physics_domain: structural_components
  links:
  - name:heating_power_of_breeder_blanket_layer
  - name:nuclear_power_density_of_breeder_blanket_layer
  arguments:
  - name: heating_power_of_breeder_blanket_layer
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/layer/time_slice/power_nuclear
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-layer-time_slice-power_nuclear
    dd_documentation:
      leaf: Nuclear power heating this layer
      parent_path: breeding_blanket/module/layer/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Total nuclear power deposited in a specific breeding blanket layer
        by neutron heating. Represents the volumetric nuclear heat load from fusion
        neutron interactions with the blanket material.
      kind: llm
- name: nuclear_heating_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Rate of nuclear energy deposited throughout one breeder blanket module
    by neutron interactions and associated photon absorption, excluding incident and
    externally applied heat.
  documentation: 'Nuclear heating power of a breeder blanket module is the rate of
    nuclear energy deposited within the material volume of one module by neutron interactions
    and the absorption of primary or secondary photons. It is an integrated deposition
    quantity, not incident radiation power or local power density.


    The module-integrated power is defined by


    $$

    P_{\mathrm{nuc,module}} = \int_{V_{\mathrm{module}}} q_{\mathrm{nuc}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $P_{\mathrm{nuc,module}}$ is the integrated nuclear heating power, $V_{\mathrm{module}}$
    is the module material volume, $q_{\mathrm{nuc}}(\mathbf{r})$ is the local nuclear
    heating power density in W m$^{-3}$, $\mathbf{r}$ is position in the module in
    m, and $\mathrm{d}V$ is differential material volume in m$^{3}$.


    The integration includes energy deposited in module materials by neutron and photon
    interactions. It excludes unde posited incident radiation, plasma-facing surface
    heat loads, and heat subsequently transferred to coolant. It is distinct from
    the local [nuclear power density of a breeder blanket module](name:nuclear_power_density_of_breeder_blanket_module),
    the layer-resolved [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer),
    and the blanket-wide [nuclear heating power](name:nuclear_heating_power_of_breeder_blanket).'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket
  sources:
  - dd_path: breeding_blanket/module/time_slice/power_thermal_neutrons
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-power_thermal_neutrons
    dd_documentation:
      leaf: Total neutron power (deposited + generated) in the blanket module
      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Total neutron power (deposited plus generated) in a breeding blanket
        module, combining incident fusion neutrons and neutrons from multiplication
        reactions. A key quantity for nuclear heating and tritium breeding assessments.
      kind: llm
- name: nuclear_heating_power_of_breeder_blanket_shield
  kind: scalar
  status: active
  description: Nuclear heating power deposited in the breeding blanket shield by neutron
    and gamma radiation interactions with shield structural materials.
  documentation: 'The breeder blanket shield absorbs residual neutron and gamma radiation
    that penetrates the breeding zone, converting particle energy to heat through
    neutron scattering, capture reactions, and Compton scattering of secondary photons.
    This thermal load determines the cooling circuit requirements for the shield structure
    and is a principal design constraint for protecting superconducting magnets from
    radiation-induced heating.


    The total nuclear heating power is the volume integral of the local nuclear power
    density $q''''''(\mathbf{r})$ over the shield volume $V_\mathrm{shield}$:


    $$

    P_\mathrm{shield} = \int_{V_\mathrm{shield}} q''''''(\mathbf{r}) \, dV

    $$


    where $q''''''(\mathbf{r})$ is in W m$^{-3}$ and sums contributions from both
    neutron and secondary gamma interactions throughout the shield material.


    This quantity is evaluated via neutron transport analysis using validated nuclear
    cross-section libraries for the shield material composition, benchmarked against
    integral activation experiments. It is the shield-level analog of the layer-resolved
    [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer)
    and the blanket-wide integral [nuclear heating power of the full breeding blanket](name:nuclear_heating_power_of_breeder_blanket);
    the volumetric counterpart [nuclear power density of a breeder blanket module](name:nuclear_power_density_of_breeder_blanket_module)
    provides the spatially resolved distribution used in detailed thermal-hydraulic
    analyzes.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_power_density_of_breeder_blanket_module
  arguments:
  - name: heating_power_of_breeder_blanket_shield
    operator: nuclear
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/time_slice/power_nuclear_shields
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-time_slice-power_nuclear_shields
    dd_documentation:
      leaf: Nuclear heating power on the shields
      parent_path: breeding_blanket/time_slice
      parent: Dynamic quantities for a set of time_slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Nuclear heating power deposited in the breeding blanket shield
        modules due to neutron and gamma interactions. A key thermal load parameter
        for shield design and reactor safety assessment.
      kind: llm
- name: power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Power quantity associated with a single breeder blanket module, abstracting
    over incident neutron surface loads, volumetric nuclear energy deposition, plasma
    radiation, and total thermal output as distinct energy-budget components.
  documentation: 'A breeder blanket module participates in multiple distinct energy-exchange
    pathways between the fusion plasma and the blanket structure. The principal power
    channels resolved at the module level include the neutron surface load characterized
    by [incident_power_of_breeder_blanket_module](name:incident_power_of_breeder_blanket_module),
    the volumetric nuclear energy deposited inside the module through scattering and
    capture reactions described by neutron_power_of_breeder_blanket_module, and the
    electromagnetic photon flux from plasma bremsstrahlung and line radiation quantified
    by [radiated_power_of_breeder_blanket_module](name:radiated_power_of_breeder_blanket_module).


    The total power delivered to the module coolant combines these channels:


    $$

    P_\mathrm{module} = P_n + P_\mathrm{rad,abs} + P_\mathrm{aux}

    $$


    where $P_n$ is the deposited neutron power, $P_\mathrm{rad,abs}$ is the absorbed
    fraction of incident plasma radiation after surface reflection, and $P_\mathrm{aux}$
    covers auxiliary heating contributions; nuclear multiplication reactions in the
    tritium-breeding material can amplify $P_n$ above the incident neutron surface
    load.


    Module-level power quantities are computed from neutronics transport simulations
    for nuclear deposition channels, coupled with plasma radiation models for photon
    loads, and validated against calorimetric measurements of coolant enthalpy rise,
    the latter captured by [net_thermal_power_of_breeder_blanket_module](name:net_thermal_power_of_breeder_blanket_module).
    The blanket-wide integral summed over all modules is given by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).'
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_power_of_breeder_blanket_module
  - name:radiated_power_of_breeder_blanket_module
  - name:net_thermal_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
- name: incident_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Fusion-born neutron power crossing onto a single breeder blanket module
    before energy deposition within its materials, defining an incident neutron surface
    load.
  documentation: 'The incident neutron power of a breeder blanket module quantifies
    the energy rate carried by fusion-born neutrons crossing onto the module''s neutron-intercepting
    surface. It is a surface-load quantity, distinct from volumetric nuclear heating
    and electromagnetic photon power.


    The incident power is defined by the surface integral


    $$

    P_{n,\mathrm{inc}} = \int_{S_\mathrm{module}} q_{n,\mathrm{inc}}(\mathbf{r})\,\mathrm{d}A

    $$


    where $P_{n,\mathrm{inc}}$ is incident neutron power, $S_\mathrm{module}$ is the
    module surface receiving the neutrons, $q_{n,\mathrm{inc}}(\mathbf{r})$ is the
    inward neutron energy-flux density at surface position $\mathbf{r}$, and $\mathrm{d}A$
    is a surface-area element. The surface integral includes neutron energy entering
    the module before subsequent scattering, capture, or nuclear multiplication within
    its materials.


    This quantity is one component of the broader [power associated with a breeder
    blanket module](name:power_of_breeder_blanket_module). It excludes deposited energy,
    represented by [nuclear heating power of a breeder blanket module](name:nuclear_heating_power_of_breeder_blanket_module),
    and electromagnetic radiation, represented by [incident radiated power of a breeder
    blanket module](name:incident_radiated_power_of_breeder_blanket_module).'
  unit: W
  physics_domain: structural_components
  links:
  - name:power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:incident_radiated_power_of_breeder_blanket_module
  arguments:
  - name: power_of_breeder_blanket_module
    operator: incident
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/time_slice/power_incident_neutron
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-power_incident_neutron
    dd_documentation:
