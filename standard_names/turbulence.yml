      kind: llm
- name: parallel_normalized_particle_perturbed_pressure
  kind: scalar
  status: active
  description: Normalized parallel pressure-tensor moment of the perturbed physical-particle
    distribution in a linear gyrokinetic eigenmode, representing its parallel thermal-energy
    fluctuation relative to a reference pressure.
  documentation: 'The parallel normalized particle perturbed pressure is a dimensionless
    complex eigenmode moment of the perturbed physical-particle distribution function.
    It represents the fluctuation of thermal energy associated with random particle
    motion parallel to the equilibrium magnetic field.


    For species $s$, its defining velocity-space moment is


    $$

    \hat{p}_{\parallel,s} = \frac{m_s}{p_\mathrm{ref}} \int v_\parallel^2 \, \delta
    f_s \, d^3v

    $$


    where $m_s$ is the species mass, $v_\parallel$ is the velocity component parallel
    to the equilibrium magnetic field, $\delta f_s$ is the perturbed particle distribution
    function, and $d^3v$ is the velocity-space volume element. The reference pressure
    is $p_\mathrm{ref}=n_\mathrm{ref}T_\mathrm{ref}$, with $n_\mathrm{ref}$ the reference
    particle number density and $T_\mathrm{ref}$ the reference thermal temperature.


    This quantity is the parallel component of the [normalized particle perturbed
    pressure](name:normalized_particle_perturbed_pressure). Together with the [perpendicular
    normalized particle perturbed pressure](name:perpendicular_normalized_particle_perturbed_pressure),
    it describes pressure anisotropy and is distinct from the isotropic trace represented
    by [normalized perturbed pressure](name:normalized_perturbed_pressure).


    Sign convention: Positive when the pressure perturbation corresponds to a local
    increase above the equilibrium background pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
  - name:normalized_perturbed_pressure
