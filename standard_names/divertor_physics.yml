- name: electron_density_of_divertor_target
  kind: scalar
  status: draft
  description: Electron number density evaluated at the divertor target plate, a key
    boundary condition for scrape-off layer models.
  documentation: "The target electron density $n_{e,\\rm target}$ is the electron\
    \ number density at the intersection of field lines with the divertor target surface.\
    \ Within the two-point model framework, $n_{e,\\rm target}$ is related to the\
    \ upstream (midplane) separatrix density $n_{e,\\rm up}$ through particle and\
    \ momentum conservation along the field line: $n_{e,\\rm target} = n_{e,\\rm up}\
    \ (T_{e,\\rm up} / T_{e,\\rm target})$ under simple conduction-limited conditions,\
    \ where $T_{e,\\rm up}$ and $T_{e,\\rm target}$ are the upstream and target electron\
    \ temperatures respectively, both in eV. Values span $10^{18}$\u2013$10^{21}$\
    \ m$^{-3}$ depending on plasma regime: attached high-recycling conditions yield\
    \ the highest densities, while detached divertors show reduced $n_{e,\\rm target}$.\
    \ Measured by Langmuir probes embedded in the target tiles or inferred from spectroscopic\
    \ line-ratio techniques. See also [electron_temperature_of_divertor_target](name:electron_temperature_of_divertor_target)\
    \ and [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)."
  unit: m^-3
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: electron_temperature_of_divertor_target
  kind: scalar
  status: draft
  description: Electron temperature at the divertor target plate, characterizing the
    thermal energy of electrons striking the material surface.
  documentation: "The electron temperature at the divertor target $T_{e,\\mathrm{target}}$\
    \ (in eV) quantifies the thermal energy of electrons arriving at the plasma-wetted\
    \ surface and is a key parameter governing sheath physics, sputtering yield, and\
    \ surface heat-load partitioning. In the two-point model framework, $T_{e,\\mathrm{target}}$\
    \ is related to upstream separatrix conditions by parallel heat conduction along\
    \ the scrape-off layer (SOL): the conduction-limited regime yields $T_{e,\\mathrm{target}}\
    \ \\propto (q_\\parallel L_\\parallel)^{-2/7}$, where $q_\\parallel$ is the parallel\
    \ heat flux (W m$^{-2}$) and $L_\\parallel$ is the connection length (m). Values\
    \ range from $\\lesssim 1$ eV in detached divertor conditions to 20\u201380 eV\
    \ in attached high-power H-mode plasmas. Measured by Langmuir probes embedded\
    \ in the target tiles or inferred from spectroscopic line-ratio techniques (e.g.,\
    \ He-I or D-$\\alpha$ emission). See also [electron_density_of_divertor_target](name:electron_density_of_divertor_target)\
    \ for the companion density and [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)\
    \ for the upstream power-width parameter entering the two-point model."
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_scrape_off_layer_heat_flux_decay_length
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the SOL heat-flux decay
    length $\lambda_q$.
  documentation: "This quantity represents the magnitude of the downward (negative)\
    \ error bar on the scrape-off layer (SOL) heat-flux decay length $\\lambda_q$\
    \ (in m), such that the confidence interval lower bound is $\\lambda_q - \\delta\\\
    lambda_{q,\\mathrm{lower}}$. Because $\\lambda_q$ is inferred from a nonlinear\
    \ fit of the heat-flux profile\u2014convolution of an exponential decay with a\
    \ Gaussian spreading function (Eich profile)\u2014the resulting uncertainty is\
    \ generally asymmetric. Infrared thermography target profiles, Langmuir probe\
    \ arrays, or inverse two-point-model analysis are common sources for $\\lambda_q$\
    \ and its error. Values of $\\lambda_q$ itself range from $\\sim$1 mm in high-field\
    \ spherical tokamaks to $\\sim$5 mm in conventional aspect-ratio devices at high\
    \ power; uncertainty magnitudes are device- and fit-dependent. See also [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)\
    \ for the parent quantity and [upper_uncertainty_of_scrape_off_layer_heat_flux_decay_length](name:upper_uncertainty_of_scrape_off_layer_heat_flux_decay_length)\
    \ for the companion upper error."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - derived
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the plasma-facing surface
    area of a divertor tile.
  documentation: This quantity gives the negative (lower) error bar on the [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),
    expressed in the same unit (m$^2$). The reported value represents the lower deviation
    $\Delta A^-$ such that the true area lies above $A_{\rm tile} - \Delta A^-$ at
    the stated confidence level. Asymmetric uncertainties can originate from systematic
    effects in tile surface metrology, such as shadowing in optical scanning. This
    lower bound, together with the [upper_uncertainty_of_surface_area_of_divertor_tile](name:upper_uncertainty_of_surface_area_of_divertor_tile),
    defines the full error envelope used in power-handling margin assessments.
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_divertor_tile_surface_outline_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a vertex on the poloidal cross-section
    outline defining the plasma-facing surface of a divertor tile.
  documentation: "The major radius $R$ specifies the radial distance from the machine\
    \ symmetry axis to a point on the two-dimensional surface outline of a divertor\
    \ tile, measured in meters. Together with [vertical_coordinate_of_divertor_tile_surface_outline_point](name:vertical_coordinate_of_divertor_tile_surface_outline_point)\
    \ and [toroidal_angle_of_divertor_tile_outline_point](name:toroidal_angle_of_divertor_tile_outline_point),\
    \ this coordinate fully defines the three-dimensional geometry of the tile's plasma-facing\
    \ surface. The outline is used for power-load mapping, erosion calculations, and\
    \ strike-point identification in scrape-off layer models. Values range from approximately\
    \ 0.3 m (compact spherical tokamaks) to 6\u20137 m (ITER-class devices), depending\
    \ on the machine size and the tile's position along the divertor target."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - divertor-configuration
  links: []
  validity_domain: ''
  constraints: []
- name: radial_extension_of_divertor_target
  kind: scalar
  status: draft
  description: Length of the divertor target projected onto the major-radius axis
    $R$.
  documentation: The radial extension $\Delta R_{\rm target}$ is the projection of
    the divertor target surface onto the major-radius direction. For a target inclined
    at angle $\alpha$ to the horizontal plane, $\Delta R_{\rm target} = L_{\rm target}
    \cos\alpha$, where $L_{\rm target}$ is the total target length and $\alpha$ is
    measured from the $R$-axis. This geometric parameter governs the wetted area available
    for power exhaust and is used together with the [vertical_extension_of_divertor_target](name:vertical_extension_of_divertor_target)
    to reconstruct the target orientation in the poloidal cross-section. Values range
    from a few centimeters for compact divertors to $\sim$0.5 m for large devices.
    Determined from engineering design or in-vessel metrology. See also [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile)
    and [major_radius_of_divertor_tile_surface_outline_point](name:major_radius_of_divertor_tile_surface_outline_point).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: scrape_off_layer_heat_flux_decay_length
  kind: scalar
  status: draft
  description: Exponential e-folding length $\lambda_q$ of the parallel heat flux
    in the scrape-off layer, mapped to the outer midplane.
  documentation: "The SOL heat-flux decay length $\\lambda_q$ (in meters) characterizes\
    \ the radial width over which the parallel heat flux $q_\\parallel$ falls off\
    \ exponentially at the divertor entrance: $q_\\parallel(r) = q_0 \\exp(-r/\\lambda_q)$,\
    \ where $r$ is the radial distance from the separatrix mapped to the outer midplane.\
    \ This parameter, as defined by T. Eich et al. (Nucl. Fusion 53, 093031, 2013),\
    \ is a key determinant of peak divertor heat loads and sets the engineering constraint\
    \ on power exhaust. Measurements are obtained from infrared thermography of the\
    \ divertor target combined with field-line tracing and flux-expansion corrections;\
    \ inter-ELM values in H-mode tokamaks are 1\u20133 mm for $B_\\text{pol}$-scaled\
    \ machines, while L-mode values can reach 5\u201310 mm. The effective wetted area\
    \ at the target depends on both $\\lambda_q$ and the [scrape_off_layer_heat_spreading_length](name:scrape_off_layer_heat_spreading_length)\
    \ $S$, which parameterizes cross-field broadening along the divertor leg. See\
    \ also [electron_temperature_of_divertor_target](name:electron_temperature_of_divertor_target)\
    \ and [electron_density_of_divertor_target](name:electron_density_of_divertor_target)\
    \ for target plasma conditions."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - energy-balance
  - high-confinement-mode
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: scrape_off_layer_heat_spreading_length
  kind: scalar
  status: draft
  description: Gaussian power-spreading length $S$ in the SOL mapped to the outer
    midplane, parameterizing cross-field broadening of the heat-flux footprint.
  documentation: "The heat-flux spreading length $S$ (in m) is the Gaussian-broadening\
    \ parameter in the Eich model of divertor heat-flux profiles: the target heat\
    \ flux is expressed as the convolution of an exponential decay of width $\\lambda_q$\
    \ with a Gaussian of width $S$ mapped to the outer midplane. Formally, $q(s) \\\
    propto \\exp\\bigl(S^2/(2\\lambda_q^2) - s/\\lambda_q\\bigr)\\,\\mathrm{erfc}\\\
    bigl(S/(\\sqrt{2}\\lambda_q) - s/(\\sqrt{2}S)\\bigr)$, where $s$ is the coordinate\
    \ along the target surface mapped to the midplane (m). $S$ encodes the integrated\
    \ effect of cross-field transport and magnetic geometry between the midplane and\
    \ the target; it is relevant only for attached plasma conditions where the exponential\u2013\
    Gaussian decomposition is valid. Values are on the order of 1\u20133 mm for medium-size\
    \ tokamaks. Determined by nonlinear fits of infrared thermography or Langmuir-probe\
    \ target profiles. See [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)\
    \ for the companion exponential decay length $\\lambda_q$ and [electron_temperature_of_divertor_target](name:electron_temperature_of_divertor_target)\
    \ for target plasma conditions."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - derived
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: Plasma-facing surface area of an individual divertor tile, used for
    power-load and erosion calculations.
  documentation: The tile surface area $A_{\rm tile}$ is the area of the plasma-facing
    surface of a single divertor tile element. It enters directly into the computation
    of heat flux $q = P / A_{\rm tile}$ (W m$^{-2}$) where $P$ is the power deposited
    on the tile, and into erosion rate estimates and tile lifetime assessments. Values
    range from $10^{-4}$ m$^2$ for small research devices to $\sim 10^{-2}$ m$^2$
    for ITER tungsten mono-block assemblies. Determined from engineering CAD models
    or laser scanning of installed tiles. See also [major_radius_of_divertor_tile_surface_outline_point](name:major_radius_of_divertor_tile_surface_outline_point)
    and [vertical_coordinate_of_divertor_tile_surface_outline_point](name:vertical_coordinate_of_divertor_tile_surface_outline_point)
    for the tile contour geometry, and [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)
    for the SOL power-exhaust scale.
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_divertor_tile_outline_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of a vertex on the surface outline of a divertor
    tile, expressed in radians.
  documentation: This quantity specifies the toroidal angular coordinate $\phi$ (in
    rad) of a point on the surface outline polygon that describes the shape of an
    individual divertor tile. Together with the major-radius and vertical coordinates
    of the same outline, it provides a full three-dimensional geometric description
    of the tile boundary in cylindrical $(R, \phi, Z)$ coordinates. Such geometric
    data are essential for calculating wetted areas, magnetic-field-line strike-point
    mapping, and neutral-particle transport in divertor Monte Carlo codes (e.g., EIRENE,
    SOLPS-ITER). The outline is defined as a closed polygon; the number of vertices
    depends on the tile design. See also [major_radius_of_divertor_tile_surface_outline_point](name:major_radius_of_divertor_tile_surface_outline_point)
    and [vertical_coordinate_of_divertor_tile_surface_outline_point](name:vertical_coordinate_of_divertor_tile_surface_outline_point)
    for the companion $(R, Z)$ coordinates, and [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile)
    for the resulting tile area.
  unit: rad
  tags:
  - cartesian-coordinates
  - divertor-configuration
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_scrape_off_layer_heat_flux_decay_length
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the SOL heat-flux decay
    length $\lambda_q$.
  documentation: This quantity represents the magnitude of the upward (positive) error
    bar on the scrape-off layer (SOL) heat-flux decay length $\lambda_q$ (in m), so
    the confidence interval upper bound is $\lambda_q + \delta\lambda_{q,\mathrm{upper}}$.
    Because $\lambda_q$ is extracted from a nonlinear fit of the divertor heat-flux
    profile (Eich parameterization), the error distribution is generally asymmetric,
    requiring separate upper and lower bounds. The fit uses an exponential decay of
    width $\lambda_q$ convolved with a Gaussian of width $S$ (spreading length); correlation
    between $\lambda_q$ and $S$ contributes to the asymmetry. Infrared thermography,
    swept Langmuir probes, and calorimetry provide the underlying heat-flux profiles.
    See also [scrape_off_layer_heat_flux_decay_length](name:scrape_off_layer_heat_flux_decay_length)
    for the parent quantity and [lower_uncertainty_of_scrape_off_layer_heat_flux_decay_length](name:lower_uncertainty_of_scrape_off_layer_heat_flux_decay_length)
    for the companion lower error.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - derived
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the plasma-facing surface
    area of a divertor tile.
  documentation: "This quantity gives the positive (upper) error bar on the [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),\
    \ expressed in the same unit (m$^2$). Asymmetric uncertainties arise when tile\
    \ surface metrology has direction-dependent measurement precision \u2014 for example,\
    \ laser-scanner depth-of-field limits versus lateral resolution. The reported\
    \ value represents the upper deviation $\\Delta A^+$ such that the true area lies\
    \ below $A_{\\rm tile} + \\Delta A^+$ at the stated confidence level. Propagation\
    \ of this uncertainty into heat flux estimates is critical for assessing peak\
    \ tile temperature margins. See also [lower_uncertainty_of_surface_area_of_divertor_tile](name:lower_uncertainty_of_surface_area_of_divertor_tile)."
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_divertor_tile_surface_outline_point
  kind: scalar
  status: draft
  description: Vertical (height) coordinate $Z$ of a vertex on the surface outline
    of a divertor tile.
  documentation: "This quantity gives the vertical coordinate $Z$ (in m) of a point\
    \ on the closed polygon that defines the surface outline of a divertor tile in\
    \ the $(R, \\phi, Z)$ cylindrical coordinate system. The $Z$ coordinate is measured\
    \ from the machine midplane, with positive values above the midplane. The full\
    \ set of outline vertices\u2014comprising $R$, $\\phi$, and $Z$ arrays of the\
    \ same length\u2014defines the three-dimensional tile boundary used in plasma-wall\
    \ interaction and power-deposition analyses. Accurate tile geometry is required\
    \ for infrared thermography inversion, strike-point tracking, and erosion/redeposition\
    \ modeling. See also [major_radius_of_divertor_tile_surface_outline_point](name:major_radius_of_divertor_tile_surface_outline_point)\
    \ and [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile) for\
    \ companion geometric quantities."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - divertor-configuration
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_extension_of_divertor_target
  kind: scalar
  status: draft
  description: Length of the divertor target projected onto the vertical (height)
    axis $Z$.
  documentation: The vertical extension $\Delta Z_{\rm target}$ is the projection
    of the divertor target surface onto the vertical axis of the cylindrical $(R,
    \phi, Z)$ coordinate system. Together with the [radial_extension_of_divertor_target](name:radial_extension_of_divertor_target),
    it fully specifies the target orientation and poloidal extent in the $(R, Z)$
    plane via $\tan\alpha = \Delta Z_{\rm target} / \Delta R_{\rm target}$, where
    $\alpha$ is the target tilt angle from horizontal. Steeply inclined targets (large
    $\Delta Z / \Delta R$) spread the strike-point heat load over a larger wetted
    area. Values range from centimeters in compact devices to $\sim$0.5 m in ITER-class
    machines. Obtained from CAD models or in-vessel survey. See also [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile)
    and [vertical_coordinate_of_divertor_tile_surface_outline_point](name:vertical_coordinate_of_divertor_tile_surface_outline_point).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - divertor-configuration
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
