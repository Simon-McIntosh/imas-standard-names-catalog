name: second_radial_derivative_of_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Second derivative of the total ion number density (thermal plus non-thermal)
  with respect to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}}$.
documentation: "This quantity is defined as $d^2 n_i / d\\rho_{\\mathrm{tor,N}}^2$,\
  \ where $n_i$ is the total ion number density (summing over all charge states of\
  \ a given species) and $\\rho_{\\mathrm{tor,N}} = \\sqrt{\\Phi_{\\mathrm{tor}} /\
  \ \\Phi_{\\mathrm{tor,LCFS}}}$ is the normalized toroidal flux coordinate, with\
  \ $\\Phi_{\\mathrm{tor}}$ the toroidal magnetic flux enclosed by a given flux surface\
  \ and $\\Phi_{\\mathrm{tor,LCFS}}$ its value at the last closed flux surface. The\
  \ second radial derivative encodes the curvature of the density profile and enters\
  \ directly into diffusive and higher-order transport flux expressions in 1-D radial\
  \ transport solvers. Steep profile curvature (large $|d^2 n_i / d\\rho_{\\mathrm{tor,N}}^2|$)\
  \ is characteristic of internal transport barriers or edge pedestals, where values\
  \ can reach $10^{22}$\u2013$10^{24}$ m$^{-3}$ depending on the machine and confinement\
  \ regime. The unit m$^{-3}$ results from $\\rho_{\\mathrm{tor,N}}$ being dimensionless.\
  \ See the first derivative and the ion number density itself for the complete profile\
  \ description."
