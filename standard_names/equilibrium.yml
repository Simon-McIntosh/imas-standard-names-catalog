- name: minimum_magnetic_field
  kind: scalar
  status: active
  description: The minimum magnetic field is the smallest total magnetic-field strength
    attained on a given nested toroidal flux surface. It is paired with the maximum
    magnetic field and defines the weak-field endpoint used in magnetic-mirror and
    trapped-particle conditions.
  documentation: 'The minimum magnetic field $B_{\min}$ is the smallest value of the
    total [magnetic_field](name:magnetic_field) strength attained anywhere on a specified
    nested toroidal flux surface. It is a scalar extremum of $|\mathbf{B}|$ on that
    surface, not a signed component of the magnetic-field vector.


    For a flux surface $S_\lambda$ labeled by a scalar flux label $\lambda$, the defining
    relation is


    $$

    B_{\min}(\lambda) = \min_{\mathbf{x} \in S_\lambda} |\mathbf{B}(\mathbf{x})|

    $$


    where $\mathbf{B}(\mathbf{x})$ is the total magnetic-field vector at position
    $\mathbf{x}$ and $S_\lambda$ is the corresponding closed toroidal flux surface.


    This quantity is the lower field-strength bound paired with [maximum_magnetic_field](name:maximum_magnetic_field),
    and the two extrema define mirror-ratio quantities such as $B_{\max}/B_{\min}$.
    The explicitly magnitude-named form [minimum_magnetic_field_magnitude](name:minimum_magnetic_field_magnitude)
    refers to this same flux-surface minimum of $|\mathbf{B}|$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:minimum_magnetic_field_magnitude
  - name:maximum_magnetic_field
  arguments:
  - name: magnetic_field
    operator: minimum
    operator_kind: qualifier
- name: minimum_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Smallest value of total magnetic field magnitude on each nested toroidal
    flux surface, used in determining the magnetic trapping condition for charged
    particles in bounce motion.
  documentation: 'The minimum magnetic field magnitude $B_\mathrm{min}(\psi)$ is the
    smallest value of $|\mathbf{B}|$ over all points on the flux surface labeled by
    poloidal flux $\psi$. In tokamaks with a dominant toroidal field satisfying $B_\phi
    \propto 1/R$, the minimum occurs near the outboard (low-field-side) midplane,
    where the major radius $R$ reaches its largest value on the flux surface.


    The ratio $B_\mathrm{min}/B_\mathrm{max}$ governs magnetic trapping of charged
    particles bouncing along field lines. A particle with normalized parallel velocity
    $\xi = v_\parallel/v$ is magnetically trapped when


    $$

    \xi^2 < 1 - \frac{B_\mathrm{min}}{B_\mathrm{max}}

    $$


    where $v_\parallel$ is the velocity component along the magnetic field and $v$
    is the total particle speed. The resulting trapped particle fraction enters neoclassical
    transport coefficients, bootstrap current models, and bounce-averaged kinetic
    equations.


    $B_\mathrm{min}$ is obtained from MHD equilibrium reconstruction by minimizing
    the total field strength $|\mathbf{B}(\psi, \theta)|$ over the poloidal angle
    $\theta$ on each flux surface. Together with [maximum_magnetic_field_magnitude](name:maximum_magnetic_field_magnitude)
    and flux_surface_average_magnetic_field, it fully characterizes the field-strength
    variation on a flux surface that is relevant for classifying particle orbits.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_magnitude
  arguments:
  - name: minimum_magnetic_field
    operator: magnitude
    operator_kind: unary_postfix
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/b_field_min
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-b_field_min
    dd_documentation:
      leaf: Minimum(modulus(B)) on the flux surface (always positive, irrespective
        of the sign convention for the B-field direction)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: Minimum magnetic field modulus (|B|_min) on each flux surface as
        a 1D radial profile in the MHD equilibrium. Always positive and used in trapped
        particle fraction calculations and bounce-averaged transport models.
      kind: llm
- name: non_axisymmetric_magnetic_field
  kind: vector
  status: active
  description: Toroidally varying part of the external-coil vacuum magnetic-field
    vector, with its toroidally averaged component removed; it represents non-axisymmetric
    error and resonant perturbation fields.
  documentation: 'The non-axisymmetric magnetic field designates the toroidally varying
    part of the vacuum magnetic-field vector produced by external coil currents, after
    removal of its toroidally averaged component. It is a non-axisymmetric component
    of the total [magnetic field](name:magnetic_field), excluding the axisymmetric
    vacuum contribution and plasma-response field.


    At fixed major radius and vertical height, the field is defined by


    $$

    \mathbf{B}_{\mathrm{na}}(R,\phi,Z)=\mathbf{B}_{\mathrm{vac}}(R,\phi,Z)-\frac{1}{2\pi}\int_{0}^{2\pi}\mathbf{B}_{\mathrm{vac}}(R,\phi'',Z)\,d\phi''

    $$


    where $\mathbf{B}_{\mathrm{na}}$ is the non-axisymmetric field, $\mathbf{B}_{\mathrm{vac}}$
    is the vacuum field, $R$ and $Z$ are the major-radius and vertical coordinates
    in meters, $\phi$ and $\phi''$ are toroidal angles in radians, and $\phi''$ is
    the integration variable. Its cylindrical projections include the [radial non-axisymmetric
    magnetic field](name:radial_non_axisymmetric_magnetic_field), [toroidal non-axisymmetric
    magnetic field](name:toroidal_non_axisymmetric_magnetic_field), and [vertical
    non-axisymmetric magnetic field](name:vertical_non_axisymmetric_magnetic_field).


    Sign convention: Positive when a resolved component points along the corresponding
    positive direction of the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$
    basis.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:radial_non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  arguments:
  - name: magnetic_field
    operator: non_axisymmetric
    operator_kind: qualifier
- name: normalized_minor_radius_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless minor-radius label of a magnetic flux surface, obtained
    by normalizing its major-radius half-width to a specified positive reference length.
  documentation: 'This quantity is the dimensionless minor-radius label assigned to
    a magnetic flux surface from its radial extent in the right-handed cylindrical
    $(R,\phi,Z)$ frame.


    $$

    \rho_{\mathrm{minor}} = \frac{R_{\max}-R_{\min}}{2L_{\mathrm{ref}}}

    $$


    where $R_{\max}$ and $R_{\min}$ are the maximum and minimum major-radius coordinates
    of the surface, each in m, and $L_{\mathrm{ref}}$ is the specified positive reference
    length in m.


    The label is a geometric normalization of the surface half-width; it is not a
    magnetic-flux normalization and therefore is distinct from the [normalized toroidal
    flux coordinate](name:normalized_toroidal_flux_coordinate). Its numerical value
    depends on the chosen reference length.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: gyrokinetics_local/flux_surface/r_minor_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-flux_surface-r_minor_norm
    dd_documentation:
