name: upper_triangularity_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Upper triangularity of the plasma boundary, quantifying the inboard shift
  of the uppermost vertical extremum of the last closed flux surface.
documentation: "The upper triangularity $\\delta_{\\mathrm{upper}}$ is defined as\
  \ $\\delta_{\\mathrm{upper}} = (R_{\\mathrm{geo}} - R_{\\mathrm{upper}}) / a$, where\
  \ $R_{\\mathrm{geo}}$ is the major radius of the geometric center of the boundary,\
  \ $R_{\\mathrm{upper}}$ is the major radius at the highest point ($Z_{\\mathrm{max}}$),\
  \ and $a$ is the minor radius. Typical values range from $0.1$ to $0.5$ in conventional\
  \ positive-triangularity H-mode plasmas. In double-null configurations the upper\
  \ and lower triangularity may differ significantly, affecting the up\u2013down asymmetry\
  \ of divertor heat loads and MHD stability. The quantity is obtained from equilibrium\
  \ reconstruction or parametric boundary fitting. See also `lower_triangularity_of_plasma_boundary`,\
  \ `triangularity_of_plasma_boundary`, and `elongation_of_plasma_boundary`."
