- name: resistance_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Ohmic resistance of a toroidal-field-coil winding, relating its current
    to the resistive voltage drop and Joule power dissipation.
  documentation: 'The resistance of a toroidal-field-coil winding is the proportionality
    coefficient between its current and the voltage component produced by ohmic conduction
    in the winding. It is a conductor property that may vary with the winding temperature.


    The defining relation is


    $$

    V_R = R I

    $$


    where $V_R$ is the resistive voltage in volts, $R$ is the winding resistance,
    and $I$ is the signed coil current in amperes. The associated resistive power
    is $P_R = I^2R$. The [terminal voltage of the toroidal field coil](name:voltage_of_toroidal_field_coil)
    can also contain an inductive component and therefore is not identical to $V_R$;
    external circuit and contact resistances are excluded.'
  unit: ohm
  physics_domain: magnetic_field_systems
