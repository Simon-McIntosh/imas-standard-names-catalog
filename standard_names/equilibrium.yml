  documentation: "The quantity is the major-radius coordinate of the wall point selected\
    \ as closest to the plasma boundary. It identifies that point\u2019s perpendicular\
    \ distance from the toroidal symmetry axis in the right-handed cylindrical $(R,\
    \ phi, Z)$ frame.\n\nThe defining geometric relation is\n\n$$\nR_{\\mathrm{cw}}\
    \ = \\left\\lVert \\mathbf{r}_{\\mathrm{cw},\\perp} \\right\\rVert\n$$\n\nwhere\
    \ $R_{\\mathrm{cw}}$ is the radial coordinate of the closest wall point and $\\\
    mathbf{r}_{\\mathrm{cw},\\perp}$ is the perpendicular displacement vector from\
    \ the toroidal symmetry axis to that point.\n\nThe scope is the single wall point\
    \ selected by its minimum proximity to the plasma boundary. This is a pointwise\
    \ geometric coordinate with no plasma-population dependence and no averaging,\
    \ summation, or integration. It is not the wall-to-boundary separation distance,\
    \ nor is \u201Cclosest\u201D a statement that the point has the smallest major\
    \ radius among all wall points.\n\nThis quantity is a locus-specific instance\
    \ of [radial coordinate](name:radial_coordinate), restricted to the closest wall\
    \ point rather than an arbitrary geometric reference position."
