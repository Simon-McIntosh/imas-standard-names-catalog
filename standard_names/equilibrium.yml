- name: minimum_safety_factor
  kind: scalar
  status: draft
  description: Minimum value of the safety factor across the plasma radial profile,
    a key MHD stability parameter.
  documentation: 'The minimum safety factor $q_{\mathrm{min}}$ is the lowest value
    of $q(\psi)$ across the radial profile of a tokamak plasma, where $q$ is the ratio
    of toroidal to poloidal magnetic field line turns per circuit around the flux
    surface. It governs the core ideal MHD stability: when $q_{\mathrm{min}} < 1$,
    sawtooth oscillations are triggered, and values near a rational integer can destabilize
    resonant tearing modes. In a typical H-mode discharge, $q_{\mathrm{min}}$ lies
    between 1.0 and 2.0, and is inferred from equilibrium reconstruction using external
    magnetic measurements together with internal constraints such as the motional
    Stark effect. See also [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis)
    and [safety_factor_at_inside_flux_surface](name:safety_factor_at_inside_flux_surface).


    Sign convention: Positive when the standard safety factor $q$ is positive, i.e.,
    the field-line helicity is right-handed in the $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:safety_factor_at_inside_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/value
    dd_path: equilibrium/time_slice/global_quantities/q_min/value
    status: composed
- name: parallel_total_plasma_current_density
  kind: scalar
  status: draft
  description: Projection of the total plasma current density vector onto the direction
    parallel to the local magnetic field in the poloidal plane.
  documentation: "The parallel component of the total plasma current density, $j_{\\\
    parallel} = \\mathbf{j}_{\\mathrm{total}} \\cdot \\mathbf{b}$, where $\\mathbf{b}\
    \ = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along the total magnetic field.\
    \ This quantity accounts for all current sources \u2014 ohmic, bootstrap, and\
    \ auxiliary current drive \u2014 providing the field-aligned current that flows\
    \ along flux surfaces and generates the poloidal magnetic field. Typical values\
    \ in the core of a burning plasma range from 0.1 to 1.0 MA/m\xB2, decreasing toward\
    \ the scrape-off layer. The parallel current density is essential for MHD equilibrium\
    \ force balance $\\nabla p = \\mathbf{j} \\times \\mathbf{B}$ and determines the\
    \ poloidal field structure via Amp\xE8re's law. It is routinely reconstructed\
    \ from magnetic measurements combined with kinetic profile constraints using Grad\u2013\
    Shafranov solvers. See also the radial component [radial_total_plasma_current_density](name:radial_total_plasma_current_density)\
    \ and the parent vector quantity [total_plasma_current_density](name:total_plasma_current_density).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above)."
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:radial_total_plasma_current_density
  - name:total_plasma_current_density
  arguments:
  - name: total_plasma_current_density
    operator: component
    operator_kind: projection
