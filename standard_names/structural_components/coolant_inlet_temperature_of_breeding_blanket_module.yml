name: coolant_inlet_temperature_of_breeding_blanket_module
status: draft
description: Temperature of the coolant fluid at the inlet manifold of a breeding
  blanket module.
documentation: "The coolant inlet temperature $T_{\\mathrm{in}}$ (in K) is the bulk\
  \ fluid temperature at the entry point of the cooling circuit of a breeding blanket\
  \ module. It is a primary boundary condition for thermal-hydraulic analyses that\
  \ determine temperature distributions, thermal stresses, and tritium permeation\
  \ rates in the blanket structure. For helium-cooled ceramic breeder (HCCB) concepts\
  \ $T_{\\mathrm{in}} \\approx 573$\u2013$623\\;\\mathrm{K}$ (300\u2013350 \xB0C),\
  \ while water-cooled lithium-lead (WCLL) designs operate near $\\sim 558\\;\\mathrm{K}$\
  \ (285 \xB0C). The quantity is measured by resistance temperature detectors (RTDs)\
  \ or thermocouples installed in the inlet piping. Together with `coolant_outlet_temperature_of_breeding_blanket_module`\
  \ and the coolant mass flow rate, it determines the total thermal power extracted\
  \ by the cooling circuit via $P = \\dot{m}\\,c_p\\,(T_{\\mathrm{out}} - T_{\\mathrm{in}})$,\
  \ where $\\dot{m}$ is mass flow rate and $c_p$ is specific heat capacity at constant\
  \ pressure."
