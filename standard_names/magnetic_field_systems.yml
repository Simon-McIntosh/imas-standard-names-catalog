- name: binormal_coordinate_of_correction_coil
  kind: scalar
  status: active
  description: "Signed displacement of a correction-coil conductor outline vertex\
    \ along the local Frenet\u2013Serret binormal, measured from the conductor centerline."
  documentation: "The binormal coordinate specifies the signed position of a correction-coil\
    \ conductor cross-section outline vertex along the local Frenet\u2013Serret binormal\
    \ direction. Together with the [normal coordinate of the correction coil](name:normal_coordinate_of_correction_coil),\
    \ it defines the vertex position in the cross-sectional plane.\n\nFor vertex position\
    \ $\\mathbf{r}_v$ and corresponding centerline position $\\mathbf{r}_c$, the coordinate\
    \ is\n\n$$\nb_v = (\\mathbf{r}_v - \\mathbf{r}_c) \\cdot \\hat{\\mathbf{b}}\n\
    $$\n\nwhere $b_v$ is the binormal coordinate in m, $\\hat{\\mathbf{b}}$ is the\
    \ local unit binormal, and $\\mathbf{r}_v$ and $\\mathbf{r}_c$ are positions in\
    \ m. The local Frenet\u2013Serret triad is oriented so that $\\hat{\\mathbf{b}}\
    \ = \\hat{\\mathbf{t}} \\times \\hat{\\mathbf{n}}$, with $\\hat{\\mathbf{t}}$\
    \ the tangent and $\\hat{\\mathbf{n}}$ the normal unit vector. This coordinate\
    \ is a signed vertex displacement, not the full conductor cross-section height\
    \ represented by the [height of the correction coil](name:height_of_correction_coil).\n\
    \nSign convention: Positive when the vertex displacement from the conductor centerline\
    \ points in the direction of the local unit binormal $\\hat{\\mathbf{b}}$."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:normal_coordinate_of_correction_coil
  - name:height_of_correction_coil
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/binormal
