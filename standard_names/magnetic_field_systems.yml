      parent: Position of the start point of every element
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
      - coils_non_axisymmetric/coil/conductor/elements/types
    enhanced_context:
      description: Major radius (R) coordinate of start points.
      kind: template
