- name: toroidal_wave_electric_field
  kind: scalar
  status: active
  description: "Complex phasor component of the electromagnetic-wave electric field\
    \ projected onto the toroidal \u03C6 direction at the evaluation point in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame. It represents the signed toroidal\
    \ polarization component, not an instantaneous field value."
  documentation: 'The toroidal wave electric field $E_\phi$ is the complex phasor
    component of an electromagnetic-wave electric-field vector along $\hat{\phi}$,
    the toroidal basis vector of the right-handed cylindrical $(R, \phi, Z)$ frame.
    It is a coordinate component of the [wave electric field](name:wave_electric_field),
    retaining both amplitude and phase.


    Using the negative-time-harmonic convention, the component is defined by


    $$

    E_\phi(\mathbf{x}) = \mathbf{E}_{w}(\mathbf{x}) \cdot \hat{\phi}

    $$


    where $\mathbf{E}_{w}$ is the complex wave-electric-field phasor in volts per
    meter, $\mathbf{x}$ is the evaluation point, and $\hat{\phi}$ points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame. The associated physical field uses $\operatorname{Re}[\mathbf{E}_{w}\exp(-i\omega
    t)]$, so $E_\phi$ is a phase-referenced phasor component rather than an instantaneous
    real field value.


    This quantity is the toroidal coordinate component, distinct from the non-wave
    [toroidal electric field](name:toroidal_electric_field), from the vertical coordinate
    component [vertical wave electric field](name:vertical_wave_electric_field), and
    from components defined relative to magnetic geometry such as the [parallel wave
    electric field](name:parallel_wave_electric_field) or [radial wave electric field](name:radial_wave_electric_field).


    Sign convention: Positive when the real toroidal component of the wave electric
    field points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_electric_field
  - name:toroidal_electric_field
  - name:parallel_wave_electric_field
