- name: per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of wave power absorbed by the thermal ion
    population inside a given flux surface, resolved per toroidal mode number.
  documentation: This quantity gives the cumulative absorbed wave power $P_{\rm th,i}(\psi,
    n_\phi)$ deposited on the thermal ion population by a coherent wave inside the
    flux surface labeled by $\psi$, for a single toroidal mode number $n_\phi$. It
    is defined as the volume integral $P_{\rm th,i}(\psi, n_\phi) = \int_0^\psi p_{\rm
    abs,i}(\psi', n_\phi)\, dV'$, where $p_{\rm abs,i}$ is the local absorbed power
    density on thermal ions from mode $n_\phi$ and $dV'$ is the volume element. Summing
    over all toroidal mode numbers recovers [per_toroidal_mode_of_thermal_ion_wave_absorbed_power](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power),
    while integrating to the plasma boundary yields the total volume-integrated thermal
    ion absorption for that mode. This quantity is the thermal-ion counterpart to
    [per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface)
    and [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface),
    enabling species-resolved power balance analysis across flux surfaces. It is computed
    from wave-kinetic or full-wave codes resolving the toroidal mode spectrum of ion
    cyclotron or other RF heating scenarios; typical values range from tens of kilowatts
    to several megawatts per mode in ICRF-heated tokamak plasmas.
