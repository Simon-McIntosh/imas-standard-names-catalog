name: argon_number_density_at_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Total argon number density (neutral plus all ion charge states) evaluated
  at the magnetic axis.
documentation: "The argon number density at the magnetic axis $n_{\\mathrm{Ar}}(R_{\\\
  mathrm{axis}}, Z_{\\mathrm{axis}})$ (m$^{-3}$) gives the on-axis concentration of\
  \ argon particles in all ionization stages. On-axis argon density is a key parameter\
  \ for assessing core impurity accumulation and its impact on fuel dilution: the\
  \ effective charge contribution scales as $\\Delta Z_{\\mathrm{eff}} \\approx n_{\\\
  mathrm{Ar}} \\langle Z_{\\mathrm{Ar}}^2 \\rangle / n_e$. Typical core argon densities\
  \ in seeded H-mode discharges are $10^{16}$\u2013$10^{18}$ m$^{-3}$, well below\
  \ the electron density ($\\sim 10^{19}$\u2013$10^{20}$ m$^{-3}$). Inferred from\
  \ charge-exchange recombination spectroscopy, soft X-ray tomography, or integrated\
  \ impurity transport modeling. See also `argon_ion_number_density` for spatially\
  \ resolved values and `line_averaged_argon_number_density` for the chord-integrated\
  \ average."
