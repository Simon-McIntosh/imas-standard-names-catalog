      data_type: FLT_1D
      unit: T.m
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for a field z.
      kind: template
- name: vacuum_poloidal_current_function
  kind: scalar
  status: active
  description: Vacuum poloidal current function equal to major radius times the toroidal
    magnetic field generated solely by external coil currents; it is spatially constant
    in an axisymmetric current-free region.
  documentation: 'The vacuum poloidal current function is the contribution to the
    poloidal current function from the magnetic field of external coil currents alone.
    It excludes contributions from plasma currents and induced currents in conducting
    structures.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, it is defined by


    $$

    F_{\mathrm{vac}}(R,Z) = R B_{\phi}^{\mathrm{vac}}(R,Z)

    $$


    where $R$ is the major radius measured from the toroidal symmetry axis in meters,
    $Z$ is vertical height, and $B_{\phi}^{\mathrm{vac}}$ is the vacuum magnetic-field
    component in the direction of increasing toroidal angle $\phi$, in teslas. In
    an axisymmetric current-free region, $F_{\mathrm{vac}}$ is spatially constant
    and represents the vacuum part of the [poloidal current function](name:poloidal_current_function).
    The associated field is the toroidal component of the [vacuum magnetic field](name:vacuum_magnetic_field).


    Sign convention: Positive when $B_{\phi}^{\mathrm{vac}}$ points in the direction
    of increasing toroidal angle $\phi$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:poloidal_current_function
  - name:vacuum_magnetic_field
  arguments:
  - name: poloidal_current_function
    operator: vacuum
    operator_kind: qualifier
  sources:
  - dd_path: tf/b_field_phi_vacuum_r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-b_field_phi_vacuum_r
    dd_documentation:
