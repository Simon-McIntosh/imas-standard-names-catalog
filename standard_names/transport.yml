- name: toroidal_component_of_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for toroidal momentum transport of a specific
    ion charge state, governing the flux-gradient relation for that state's toroidal
    momentum across flux surfaces.
  documentation: 'The toroidal component of the ion-state momentum diffusivity $\chi_\phi^{\rm
    state}$ enters the flux-gradient closure for toroidal momentum transport of a
    single ion charge state: $\Gamma_{m,\phi} = -n_i m_i \chi_\phi^{\rm state} \nabla
    v_\phi$, where $n_i$ is the ion number density, $m_i$ is the ion mass, and $v_\phi$
    is the flux-surface-averaged toroidal flow velocity. This quantity isolates the
    contribution of a specific charge state to toroidal momentum redistribution, which
    is relevant in multi-charge-state plasmas such as those with partially ionized
    impurities or in edge-pedestal regions with significant ionization-stage variation.
    Typical values in tokamak core transport modeling range from $10^{-2}$ to $10^{1}$
    m$^2$ s$^{-1}$, depending on the level of turbulent transport. It is distinct
    from [toroidal_component_of_ion_momentum_diffusivity](name:toroidal_component_of_ion_momentum_diffusivity),
    which aggregates all charge states of an ion species, and from [toroidal_component_of_total_momentum_diffusivity](name:toroidal_component_of_total_momentum_diffusivity),
    which sums over all plasma species. The full [ion_state_momentum_diffusivity](name:ion_state_momentum_diffusivity)
    vector also provides the [poloidal_component_of_ion_state_momentum_diffusivity](name:poloidal_component_of_ion_state_momentum_diffusivity)
    and [radial_component_of_ion_state_momentum_diffusivity](name:radial_component_of_ion_state_momentum_diffusivity)
    components for a complete description of charge-state-resolved momentum diffusion.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
