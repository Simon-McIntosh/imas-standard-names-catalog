- name: neutral_particle_flux_from_plasma
  kind: scalar
  status: draft
  description: Total rate at which neutral particles leave the plasma and strike the
    plasma-facing wall, governing wall erosion, recycling, and fuel retention.
  documentation: "The neutral particle flux from the plasma quantifies the global\
    \ rate $\\Gamma_{\\mathrm{n}}^{\\mathrm{plasma}}$ (s$^{-1}$) at which neutral\
    \ species \u2014 including charge-exchanged neutrals, recombined atoms, and molecular\
    \ dissociation products \u2014 escape the plasma and impinge on plasma-facing\
    \ components. This quantity is the directional complement of [neutral_particle_flux_from_wall](name:neutral_particle_flux_from_wall),\
    \ which counts particles re-entering the plasma; together they close the global\
    \ neutral particle balance and characterize the recycling coefficient $R = \\\
    Gamma_{\\mathrm{n}}^{\\mathrm{plasma}} / \\Gamma_{\\mathrm{n}}^{\\mathrm{wall}}$.\
    \ Charge-exchange neutrals originating from ion\u2013neutral collisions in the\
    \ plasma core and edge dominate this flux in tokamak divertor plasmas; typical\
    \ integrated fluxes range from $10^{21}$ to $10^{23}$ s$^{-1}$ depending on plasma\
    \ density, power, and divertor configuration. The flux is estimated from neutral\
    \ particle analyzers, visible spectroscopy of Balmer-series emission, and particle\
    \ balance codes that track ionization and recombination sources. It plays a central\
    \ role in computing wall loading, fuel retention, and tritium inventory alongside\
    \ [electron_particle_flux_from_wall](name:electron_particle_flux_from_wall).\n\
    \nSign convention: Positive when neutral particles flow from the plasma toward\
    \ the wall."
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_from_wall
  - name:electron_particle_flux_from_wall
  constraints: []
  sources:
  - id: dd:wall/global_quantities/neutral/particle_flux_from_plasma
    dd_path: wall/global_quantities/neutral/particle_flux_from_plasma
    status: composed
- name: nuclear_charge_number_of_ion
  kind: scalar
  status: draft
  description: Nuclear charge number (atomic number) of an ion species, equal to the
    number of protons in the nucleus. This integer uniquely identifies the element
    and is independent of the ionization state of the ion.
  documentation: 'The nuclear charge number $Z_n$ is the count of protons in the atomic
    nucleus of the ion species. It is a positive integer that serves as the atomic
    number of the element, taking values such as $Z_n = 1$ for hydrogen, $Z_n = 2$
    for helium, $Z_n = 6$ for carbon, $Z_n = 74$ for tungsten, and so on up to $Z_n
    = 118$ for the heaviest known elements. The allowed value domain is therefore
    the positive integers $Z_n \in \{1, 2, 3, \ldots, 118\}$.


    $Z_n$ is distinct from the ionic charge state $Z$ (the net charge of the ion after
    ionization). A fully stripped carbon ion has $Z_n = 6$ and $Z = 6$, while a partially
    ionized carbon ion retains $Z_n = 6$ regardless of how many electrons have been
    removed. In plasma modeling, $Z_n$ is used alongside the mass number $A$ (see
    `atomic_mass_of_element`) to characterize the nuclear properties of the species,
    and is independent of the plasma conditions.


    This quantity plays a key role in identifying species in multi-fluid or impurity
    transport models, where both the nuclear identity (fixed $Z_n$) and the charge
    state (variable $Z$) must be tracked separately. It is also needed when computing
    nuclear stopping, charge-exchange cross-sections, and other atomic-physics quantities
    that depend on nuclear identity rather than ionization state.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
