- name: absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Absorbed power of a beam-tracing beam is the total electromagnetic
    wave power transferred from one coherent beam to the plasma along its trajectory.
  documentation: 'Absorbed power of a beam-tracing beam is the total electromagnetic
    wave power transferred from a single coherent beam to plasma particles along the
    beam trajectory. It is summed over the contributing plasma species and is distinct
    from the residual wave power represented by [power_of_beam_tracing_beam](name:power_of_beam_tracing_beam).


    Under the single-beam power balance, the absorbed power is defined by


    $$

    P_{\mathrm{abs}} = P_0 - P_{\mathrm{res}}

    $$


    where $P_{\mathrm{abs}}$ is this absorbed power, $P_0$ is the [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam),
    and $P_{\mathrm{res}}$ is the residual power of the same beam at the trajectory
    endpoint. The total includes contributions represented by species-resolved quantities
    such as [electron_absorbed_power_of_beam_tracing_beam](name:electron_absorbed_power_of_beam_tracing_beam)
    and [ion_charge_state_absorbed_power_of_beam_tracing_beam](name:ion_charge_state_absorbed_power_of_beam_tracing_beam).
    It excludes power remaining in the wave and power assigned at launch but not transferred
    along the traced trajectory.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_beam_tracing_beam
  - name:initial_power_of_beam_tracing_beam
  - name:electron_absorbed_power_of_beam_tracing_beam
  arguments:
  - name: power_of_beam_tracing_beam
    operator: absorbed
    operator_kind: qualifier
- name: power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Radio-frequency power associated with ion-cyclotron heating antenna
    systems, covering incident, reflected, net launched, and antenna-summed contributions.
  documentation: 'The quantity denotes radio-frequency wave power associated with
    an ion-cyclotron resonance heating antenna at the antenna reference plane. Depending
    on the specific quantity, it represents incident power traveling toward the antenna,
    reflected power returning toward the generator, net launched power, or an aggregate
    over antennas; it is distinct from power absorbed by the plasma.


    For a single antenna and an antenna set, the net and total launched powers are
    related by


    $$

    P_{\mathrm{net}} = P_{\mathrm{fwd}} - P_{\mathrm{ref}}, \qquad P_{\mathrm{total}}
    = \sum_{a=1}^{N_{\mathrm{ant}}} P_{\mathrm{net},a}

    $$


    where $P_{\mathrm{fwd}}$ is forward incident power, $P_{\mathrm{ref}}$ is reflected
    power, $P_{\mathrm{net}}$ is net launched power, $P_{\mathrm{net},a}$ is the net
    power from antenna $a$, and $N_{\mathrm{ant}}$ is the number of antennas. The
    [forward power](name:forward_power_of_ion_cyclotron_heating_antenna) and [reflected
    power](name:reflected_power_of_ion_cyclotron_heating_antenna) are directional
    components, while [total antenna power](name:total_power_of_ion_cyclotron_heating_antenna)
    is the antenna sum. Launched power is not the absorbed heating power represented
    by [total power due to ion-cyclotron heating](name:total_power_due_to_ion_cyclotron_heating).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:total_power_of_ion_cyclotron_heating_antenna
