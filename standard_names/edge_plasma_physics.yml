- name: diamagnetic_current_density_due_to_heat_viscosity
  kind: scalar
  status: active
  description: Diamagnetic component of the electric current density generated by
    heat-viscosity terms in a collisional magnetized-plasma fluid closure, projected
    perpendicular to both the magnetic field and poloidal-flux gradient.
  documentation: 'The diamagnetic heat-viscosity current density is the signed component
    of the electric current density generated when heat-viscosity terms in a collisional
    magnetized-plasma fluid closure drive net charge transport.


    $$

    j_{\mathrm{hv,d}}=\mathbf{j}_{\mathrm{hv}}\cdot\hat{\mathbf{d}},\qquad \hat{\mathbf{d}}=\hat{\mathbf{b}}\times\frac{\nabla\psi}{|\nabla\psi|},\qquad
    \hat{\mathbf{b}}=\frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    Here $\mathbf{j}_{\mathrm{hv}}$ is the [heat-viscosity current-density vector](name:current_density_due_to_heat_viscosity),
    $\mathbf{B}$ is the magnetic-field vector, $\hat{\mathbf{b}}$ is its unit direction,
    and $\psi$ is the poloidal magnetic-flux label. The projection is defined where
    $\nabla\psi$ is nonzero and excludes the field-aligned component represented by
    [parallel heat-viscosity current density](name:parallel_current_density_due_to_heat_viscosity).
    It is distinct from diamagnetic current contributions due to parallel or perpendicular
    viscosity.


    Sign convention: Positive when the heat-viscosity current-density vector points
    in the direction $\hat{\mathbf{d}}$, with vector products interpreted in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_heat_viscosity
  - name:parallel_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_heat_viscosity
