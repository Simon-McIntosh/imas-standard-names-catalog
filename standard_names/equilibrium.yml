      kind: llm
- name: normalized_poloidal_flux_coordinate_of_plasma_boundary
  kind: scalar
  status: active
  description: Radial flux-surface location of the selected plasma boundary, expressed
    by the normalized poloidal flux coordinate. It is the linear normalized poloidal
    flux value, increasing from zero at the magnetic axis to one at the separatrix,
    of the closed flux surface taken as the plasma boundary; fixed-boundary equilibrium
    calculations commonly set it slightly below one to select a surface just inside
    the separatrix.
  documentation: 'The normalized poloidal flux coordinate of the plasma boundary is
    the value of the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)
    on the closed flux surface selected as the plasma boundary. It is the linear normalized
    poloidal flux, labeling the boundary''s radial position between the magnetic axis
    and the last closed flux surface.


    Its value is the poloidal flux difference from the magnetic axis normalized to
    the axis-to-separatrix flux difference:


    $$

    \psi_{\mathrm{N}}^{\mathrm{boundary}} = \frac{\psi_{\mathrm{boundary}} - \psi_{\mathrm{axis}}}{\psi_{\mathrm{sep}}
    - \psi_{\mathrm{axis}}}

    $$


    where $\psi_{\mathrm{boundary}}$ is the [poloidal magnetic flux](name:poloidal_magnetic_flux)
    on the selected plasma-boundary surface, $\psi_{\mathrm{axis}}$ is the [poloidal
    magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis),
    and $\psi_{\mathrm{sep}}$ is the poloidal magnetic flux at the separatrix (last
    closed flux surface).


    The label equals zero at the magnetic axis and equals one when the selected plasma
    boundary coincides with the separatrix; a value below one selects an internal
    closed flux surface. Its defining role is to specify, for fixed-boundary equilibrium
    representations, which closed flux surface is taken as the plasma boundary, commonly
    a surface just inside the separatrix so that the boundary remains strictly closed.


    This is the linear normalized poloidal flux value itself, not its square root,
    and it is a flux-surface label rather than a signed poloidal-flux value or a geometric
    minor-radius measure. It is distinct from the toroidal-flux-based boundary label
    [normalized toroidal flux coordinate at the plasma boundary](name:normalized_toroidal_flux_coordinate_at_plasma_boundary),
    and it belongs to the same locus-valued family as the [normalized poloidal flux
    coordinate at minimum safety factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor)
    and the [normalized poloidal flux coordinate of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
