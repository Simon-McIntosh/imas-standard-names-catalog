- name: radial_neutral_momentum_source
  kind: scalar
  status: active
  description: Radial component of the area-normalized momentum source for the neutral
    population in the edge plasma, summed over all neutral states. Its sign distinguishes
    outward from inward neutral momentum transfer.
  documentation: 'The radial component of the area-normalized momentum source for
    the neutral population in the edge plasma, summed over all neutral states, is
    the net neutral momentum transfer per unit area resolved along the radial direction.
    It is one component of the aggregate [neutral momentum source](name:neutral_momentum_source)
    acting in the neutral momentum balance.


    The radial component is defined by projecting the parent source vector onto the
    radial unit vector:


    $$

    S_{n,R} = \boldsymbol{S}_n \cdot \hat{R}

    $$


    where $S_{n,R}$ is the radial neutral momentum source, $\boldsymbol{S}_n$ is the
    area-normalized neutral momentum source vector, and $\hat{R}$ is the radial unit
    vector in the right-handed cylindrical $(R, \phi, Z)$ frame. Here $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The quantity is summed over all neutral states and excludes ion momentum sources.
    Unlike the [toroidal neutral momentum source](name:toroidal_neutral_momentum_source),
    it resolves momentum transfer along increasing major radius rather than the toroidal
    direction.


    Sign convention: Positive when the neutral momentum source points in the direction
    of increasing major radius $R$, away from the cylindrical symmetry axis.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_source
  - name:toroidal_neutral_momentum_source
  arguments:
  - name: neutral_momentum_source
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
