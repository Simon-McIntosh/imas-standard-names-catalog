- name: total_ion_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Total ion density at an internal transport barrier is the local unweighted
    number-density sum over all ion populations present there, including fuel, minority,
    impurity, and non-thermal ions when they are part of the ion inventory. It excludes
    neutral particles and is not charge weighted.
  documentation: 'Total ion density at an internal transport barrier (ITB) is the
    local ion number density obtained by adding the number densities of all ion populations
    at the barrier. The sum includes thermal and, when represented, non-thermal ion
    populations for fuel, minority, and impurity ions; neutral particles are excluded.
    It is an unweighted particle count, not a charge density, mass density, or pressure.


    The local total is defined by the population sum evaluated at the ITB location:


    $$

    n_{i,\mathrm{total}}(\mathbf{x}_\mathrm{ITB}) = \sum_{\alpha \in \mathrm{ions}}
    n_\alpha(\mathbf{x}_\mathrm{ITB})

    $$


    where $\mathbf{x}_\mathrm{ITB}$ is the position of the internal transport barrier
    and $\alpha$ labels an ion population, which may distinguish chemical species,
    charge state, and thermal or non-thermal component. Both $n_\alpha$ and $n_{i,\mathrm{total}}$
    are number densities in m^-3. If charge states are resolved, each charge-state
    population contributes its own number density term; the charge $Z_\alpha$ is not
    used as a weight in this sum.


    In practice this quantity is obtained by combining local density and composition
    information at the identified ITB location. Electron-density measurements constrain
    the charge-weighted ion inventory through quasineutrality, while spectroscopy,
    charge-exchange recombination measurements, neutron or neutral-particle information,
    and transport analysis may constrain selected ion species or energetic-ion components.
    The total ion number density is then computed from the inferred population densities
    and composition model by applying the unweighted sum above.


    Typical local values in tokamak plasmas with internal transport barriers are of
    order 1 x 10^19-1 x 10^20 m^-3. This range is an order-of-magnitude guide rather
    than a device-independent bound, because the value depends on the local electron
    density, impurity content, fuel mix, and any non-thermal ion population included
    in the ion inventory.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:deuterium_density_at_internal_transport_barrier
  - name:hydrogen_density_at_internal_transport_barrier
  - name:carbon_density_at_internal_transport_barrier
  - name:oxygen_density_at_internal_transport_barrier
  - name:ion_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i_total/value
    dd_path: summary/local/itb/n_i_total/value
    status: composed
- name: total_ion_source_rate
  kind: scalar
  status: draft
  description: Net volumetric source term for total ion particle density, summed over
    all ion species and charge states. It includes ionization, recombination, charge
    exchange, fueling, and external particle injection or removal processes.
  documentation: 'Total ion source rate is the net local rate at which processes create
    or remove ion particles per unit volume, after summing over all ion species and
    charge states. It is the species-summed particle source term corresponding to
    [ion_source_rate](name:ion_source_rate), and is distinct from energy deposition
    quantities such as [total_ion_power_density](name:total_ion_power_density).


    In a local particle balance, the total ion source rate $S_{i,\mathrm{tot}}$ enters
    the continuity equation:


    $$

    \frac{\partial n_{i,\mathrm{tot}}}{\partial t} + \nabla \cdot \boldsymbol{\Gamma}_{i,\mathrm{tot}}
    = S_{i,\mathrm{tot}}

    $$


    where $n_{i,\mathrm{tot}}$ is the total ion particle density in m$^{-3}$, $\boldsymbol{\Gamma}_{i,\mathrm{tot}}$
    is the total ion particle flux density in m$^{-2}$ s$^{-1}$, and $S_{i,\mathrm{tot}}$
    is in m$^{-3}$ s$^{-1}$. The divergence is evaluated in physical space; for example,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. In flux-surface-averaged transport,
    the same balance is interpreted after averaging on surfaces labeled by an explicitly
    named flux coordinate, for example $(\rho_{\mathrm{tor,norm}}, \theta, \phi)$.


    In practice, this quantity is computed from particle balance using models or measurements
    of ionization, recombination, charge exchange with neutrals, neutral beam fueling,
    gas puffing, pellet ablation, and other particle exchange processes. It may also
    be inferred from density evolution and particle flux estimates when the transport
    divergence term is known.


    Typical core and edge magnitudes are about $10^{18}$-$10^{21}$ m$^{-3}$ s$^{-1}$
    in magnetically confined plasmas, with larger local values possible near strong
    fueling, pellet deposition, or intense recycling regions. Negative values occur
    where recombination, charge exchange, or outward particle exchange removes ions
    faster than they are created.


    Sign convention: Positive when local processes produce a net increase in the total
    ion particle density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_particles
    dd_path: core_sources/source/profiles_1d/total_ion_particles
    status: composed
  - id: dd:plasma_sources/source/global_quantities/total_ion_particles
    dd_path: plasma_sources/source/global_quantities/total_ion_particles
    status: composed
