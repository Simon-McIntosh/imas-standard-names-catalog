    ref: summary/local/pedestal/position/rho_tor
    version: 4.1.0
- name: volume_averaged_neutral_temperature
  kind: scalar
  status: active
  description: Volume-averaged neutral temperature is the translational kinetic temperature,
    expressed as energy per particle, of a neutral population throughout the plasma
    volume inside the last closed magnetic flux surface during plasma initiation.
  documentation: 'Volume-averaged neutral temperature is the translational kinetic
    temperature of a neutral population during plasma initiation, representing random
    translational energy after removal of mean flow. It excludes energy stored in
    internal excitation or other internal quantum states.


    The volume average is defined by


    $$

    \overline{T}_{n} = \frac{1}{V_{\mathrm{LCFS}}}\int_{V_{\mathrm{LCFS}}} T_n(\mathbf{x})\,\mathrm{d}V

    $$


    where $\overline{T}_{n}$ is the volume-averaged neutral temperature, $T_n(\mathbf{x})$
    is the local translational kinetic temperature of the neutral population at position
    $\mathbf{x}$, $V_{\mathrm{LCFS}}$ is the plasma volume enclosed by the last closed
    magnetic flux surface, and $\mathrm{d}V$ is the differential physical-volume element.


    The quantity applies to the represented neutral population throughout the volume
    enclosed by the last closed magnetic flux surface during plasma initiation. Its
    aggregation convention is an arithmetic spatial volume average of the local temperature,
    not a local value or a density-weighted particle average. It does not select only
    the cold or energetic neutral component and is not restricted to a particular
    internal quantum state.


    This quantity is obtained by applying the volume-averaging transformation to [neutral
    temperature](name:neutral_temperature), with the local population and state aggregation
    inherited from that quantity. [Cold neutral temperature](name:cold_neutral_temperature)
    and [hot neutral temperature](name:hot_neutral_temperature) are population-restricted
    alternatives, while [neutral internal state temperature](name:neutral_internal_state_temperature)
    resolves a specified internal state rather than the generic neutral population.'
