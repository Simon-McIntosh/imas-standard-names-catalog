      parent_path: wall/description_ggd/ggd/resistivity
      parent: Resistivity, given on various grid subsets
      data_type: FLT_1D
      unit: ohm.m
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for resistivity.
      kind: template
- name: thermal_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Thermal power quantity associated with a single breeder blanket module,
    abstracting over module-level thermal-output quantities for heat transferred from
    the module to its coolant, including net coolant-transfer accounting.
  documentation: 'Thermal power of a breeder blanket module quantifies the rate at
    which energy retained as heat in a single breeder blanket module is assigned to
    the module-level thermal-output channel. It is a module-integrated heat-output
    quantity, not a local material temperature, stored thermal energy, or surface
    power load.


    This parent name does not by itself prescribe a particular thermal-accounting
    convention. A qualified child name supplies that convention; [net thermal power
    of a breeder blanket module](name:net_thermal_power_of_breeder_blanket_module)
    denotes the net transfer from the module to its coolant summed over all coolant
    branches as an enthalpy increase.


    Thermal power is distinct from input or deposition channels such as neutron surface
    load and plasma radiation before their absorbed energy is accounted as module
    heat output. It belongs to the broader [power of a breeder blanket module](name:power_of_breeder_blanket_module)
    family of module-level energy-budget quantities.'
  unit: W
  physics_domain: structural_components
  links:
  - name:power_of_breeder_blanket_module
  - name:net_thermal_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  arguments:
  - name: power_of_breeder_blanket_module
    operator: thermal
    operator_kind: qualifier
- name: net_thermal_power_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Net thermal power transferred from a single breeder blanket module
    to its coolant, summed over all coolant branches as an enthalpy increase.
  documentation: 'Coolant thermal power of a single breeder blanket module is the
    net rate at which heat leaves the module through its coolant circuits. It aggregates
    the thermal energy carried by every coolant branch serving that module, regardless
    of whether the heat originated from nuclear deposition or absorbed incident radiation.


    The defining branch balance is


    $$

    P_{\mathrm{cool}} = \sum_b \dot{m}_b\left(h_{b,\mathrm{out}} - h_{b,\mathrm{in}}\right)

    $$


    where $P_{\mathrm{cool}}$ is the coolant-transferred power, $b$ indexes coolant
    branches, $\dot{m}_b$ is the mass flow rate in branch $b$, and $h_{b,\mathrm{in}}$
    and $h_{b,\mathrm{out}}$ are its inlet and outlet specific enthalpies. The quantity
    is the coolant-transferred component of [thermal power of a breeder blanket module](name:thermal_power_of_breeder_blanket_module),
    distinct from source-specific quantities such as [nuclear heating power of a breeder
    blanket module](name:nuclear_heating_power_of_breeder_blanket_module) and [absorbed
    radiated power of a breeder blanket module](name:absorbed_radiated_power_of_breeder_blanket_module).'
  unit: W
  physics_domain: structural_components
  links:
  - name:thermal_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:absorbed_radiated_power_of_breeder_blanket_module
  arguments:
  - name: thermal_power_of_breeder_blanket_module
    operator: net
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/module/time_slice/power_thermal_extracted
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-time_slice-power_thermal_extracted
    dd_documentation:
