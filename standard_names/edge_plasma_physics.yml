- name: toroidal_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted toroidal bulk-flow velocity of carbon impurity ions
    at the last closed magnetic flux surface, resolved along increasing toroidal angle.
  documentation: 'The carbon impurity-ion toroidal velocity at the plasma boundary
    is the local density-weighted mean of the bulk-flow velocities of all included
    carbon ion charge states on the last closed magnetic flux surface. It is not a
    flux-surface average; that distinct quantity is the [toroidal flux-surface-averaged
    carbon velocity](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    while the magnetic-axis counterpart is [toroidal carbon velocity at the magnetic
    axis](name:toroidal_carbon_velocity_at_magnetic_axis).


    The defining local component is


    $$

    V_{\phi,C}(R,Z)=\frac{\sum_{q\in Q} n_{C^{q+}}(R,Z)\,\mathbf{V}_{C^{q+}}(R,Z)\cdot\hat{\phi}}{\sum_{q\in
    Q} n_{C^{q+}}(R,Z)}

    $$


    where $Q$ is the set of included carbon ion charge states, $n_{C^{q+}}$ is the
    corresponding number density in m$^{-3}$, and $\mathbf{V}_{C^{q+}}$ is its bulk
    velocity in m s$^{-1}$. The component is resolved in the right-handed cylindrical
    $(R,\phi,Z)$ frame, with $\hat{R}\times\hat{\phi}=\hat{Z}$; $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    Sign convention: Positive when the carbon-ion bulk flow has a component in the
    direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_magnetic_axis
