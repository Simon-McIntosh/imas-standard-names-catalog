- name: thickness_of_plasma_facing_component
  kind: scalar
  status: active
  description: "Through-material geometric separation between a plasma-facing component\u2019\
    s exposed surface and its opposite material boundary, evaluated at the component\
    \ midplane."
  documentation: 'The thickness is the through-material dimension of a plasma-facing
    component at its midplane, separating the plasma-exposed surface from the opposite
    material boundary. It is measured along the local thickness direction normal to
    the exposed surface.


    $$

    t_{\mathrm{PFC}} = d_{\perp}\left(S_{\mathrm{plasma}}, S_{\mathrm{back}}\right)\big|_{\mathrm{midplane}}

    $$


    Here, $t_{\mathrm{PFC}}$ is the component thickness, $d_{\perp}$ is the through-material
    normal separation, and $S_{\mathrm{plasma}}$ and $S_{\mathrm{back}}$ are the exposed
    and opposite material surfaces, respectively.


    This is a geometric material dimension for the specified midplane section; it
    is not a plasma-to-wall separation such as the [gap at the plasma boundary](name:gap_at_plasma_boundary),
    nor a surface thermal quantity.'
  unit: m
  physics_domain: structural_components
  links:
  - name:gap_at_plasma_boundary
  sources:
