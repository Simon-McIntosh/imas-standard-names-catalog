- name: radial_perturbed_plasma_magnetic_field
  kind: scalar
  status: draft
  description: Flux-surface-normal component of the first-order perturbed plasma magnetic
    field eigenfunction for a specified toroidal Fourier mode inside the plasma region.
    It is the projection of the complex magnetic-field perturbation onto the outward
    normal to an equilibrium magnetic flux surface.
  documentation: 'Radial perturbed plasma magnetic field is the component of the first-order
    plasma magnetic-field perturbation normal to an equilibrium magnetic flux surface.
    For linear magnetohydrodynamic eigenmodes it is commonly treated as a complex
    eigenfunction for a specified toroidal Fourier mode number, with its real and
    imaginary parts carrying the phase information of the mode.


    The flux-surface-normal projection is defined by:


    $$

    \delta B_r(\rho,\theta) = \hat{\mathbf{n}}_\psi \cdot \delta\mathbf{B}_n(\rho,\theta)

    $$


    where $\delta B_r$ is the radial perturbed magnetic field in T, $\hat{\mathbf{n}}_\psi$
    is the dimensionless outward unit normal to the equilibrium magnetic flux surface,
    and $\delta\mathbf{B}_n$ is the complex first-order perturbed magnetic-field eigenfunction
    in T for toroidal mode number $n$. The flux coordinates $(\rho,\theta,\phi)$ use
    a flux-surface label $\rho$, poloidal angle $\theta$ in rad, and toroidal angle
    $\phi$ in rad; $\phi$ is the toroidal angle of the right-handed cylindrical $(R,
    \phi, Z)$ frame. A common normal-mode representation is $\mathrm{Re}\{\delta\mathbf{B}_n(\rho,\theta)\exp[i(n\phi-\omega
    t)]\}$, where $n$ is a dimensionless integer, $\omega$ is angular frequency in
    rad s$^{-1}$, and $t$ is time in s.


    This quantity is computed in linear or weakly nonlinear MHD analysis by perturbing
    an equilibrium magnetic field and projecting the perturbed field onto the flux-surface
    normal. It can be constrained indirectly from internal magnetic fluctuation measurements,
    edge magnetic probes, mode identification, and equilibrium-response modeling.
    A nonzero $|\delta B_r|$ near a rational surface is a signature of reconnecting-mode
    character, but it is not by itself a complete proof of magnetic reconnection.


    Typical physical fluctuation amplitudes range from $10^{-6}$-$10^{-3}$ T for small
    coherent MHD activity and can reach $10^{-2}$ T during large events. In eigenvalue
    calculations the overall amplitude and complex phase are often normalization choices,
    so relative spatial structure and phase are usually more meaningful than the absolute
    value unless a normalization is specified.


    Sign convention: Positive when the perturbed magnetic field points along the outward
    normal to the equilibrium magnetic flux surface.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the flux-surface-normal component of the complex first-order
    plasma magnetic-field perturbation eigenfunction for a specified toroidal Fourier
    harmonic, with toroidal angle phi measured in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: 'This quantity is the real part of the radial component of a complex
    first-order magnetic-field perturbation eigenfunction in the plasma region. The
    radial direction is the unit normal to equilibrium magnetic-flux surfaces in flux
    coordinates $(\psi, \theta, \phi)$, chosen from the magnetic axis toward the plasma
    boundary; $\phi$ is the toroidal angle in the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    Using the normal-mode phase convention $\exp[i(n\phi - \omega t)]$, the component
    is defined by projecting the complex perturbation eigenfunction onto the outward
    flux-surface-normal direction and taking its real part:


    $$

    \delta B_{r,\mathrm{real}}(\psi,\theta) = \operatorname{Re}\!\left[\tilde{\delta
    \mathbf{B}}_n(\psi,\theta)\cdot\hat{\mathbf{n}}_\psi\right]

    $$


    where $\delta B_{r,\mathrm{real}}$ is this quantity in T, $\tilde{\delta \mathbf{B}}_n$
    is the complex magnetic-field perturbation eigenfunction in T for toroidal mode
    number $n$, $\hat{\mathbf{n}}_\psi$ is a dimensionless outward unit normal to
    the equilibrium flux surface, $\phi$ is in radians, $\omega$ is in rad s$^{-1}$,
    and $t$ is in s. The real and imaginary parts depend on the chosen eigenfunction
    phase and normalization; the associated physical perturbation is obtained by taking
    the real part after applying the stated normal-mode factor.


    In practice this quantity is computed from a linear magnetohydrodynamic eigenfunction
    by using the equilibrium flux-surface geometry to form the radial projection.
    It quantifies the part of the mode that bends the magnetic field across equilibrium
    flux surfaces and can be constrained indirectly by comparing modeled fluctuation
    signals with magnetic and other plasma diagnostics.


    Because linear eigenfunctions can be scaled arbitrarily, values from normalized
    calculations may have arbitrary absolute amplitude. When scaled to measured magnetic
    fluctuations, radial perturbations in the confined plasma are commonly $10^{-6}$-$10^{-3}$
    T, while large coherent activity can locally reach $10^{-3}$-$10^{-2}$ T.


    Sign convention: Positive when, at zero normal-mode phase in the $\exp[i(n\phi
    - \omega t)]$ convention, the radial perturbation magnetic field points along
    $+\hat{\mathbf{n}}_\psi$ from the magnetic axis toward the plasma boundary.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  arguments:
  - name: radial_perturbed_plasma_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate1/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate1/real
    status: composed
- name: toroidal_perturbed_plasma_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the complex first-order plasma magnetic-field
    perturbation eigenfunction for a single toroidal Fourier harmonic in linear MHD,
    evaluated in the plasma region.
  documentation: 'The toroidal perturbed plasma magnetic field is the component of
    the complex magnetic-field perturbation eigenfunction along $\hat{\phi}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It is the plasma-region toroidal
    component of the first-order field perturbation used in linear MHD stability analysis,
    complementing the radial and poloidal components of the same vector perturbation.


    For a single toroidal Fourier harmonic, the physical toroidal perturbation may
    be represented by the complex eigenfunction amplitude as


    $$

    \delta B_\phi(R,\phi,Z,t)=\Re\left\{\hat{\delta B}_\phi(R,Z)\exp\left[i(n\phi-\omega
    t)\right]\right\}

    $$


    where $\hat{\delta B}_\phi$ is this complex toroidal eigenfunction amplitude in
    T, $\delta B_\phi$ is the corresponding physical toroidal perturbation in T, $R$
    is in m, $Z$ is in m, $\phi$ is in radians, $t$ is time in s, $n$ is the integer
    toroidal mode number, and $\omega$ is the complex angular eigenfrequency in rad
    s$^{-1}$. Equivalently, $\hat{\delta B}_\phi = \hat{\delta\mathbf{B}}_\mathrm{plasma}\cdot\hat{\phi}$,
    where $\hat{\delta\mathbf{B}}_\mathrm{plasma}$ is the complex plasma magnetic-field
    perturbation eigenfunction in T.


    In linear MHD calculations this component is obtained from the perturbed magnetic
    field associated with the plasma response, for example through the linearized
    induction equation, a perturbed vector potential, or an eigenfunction returned
    by a stability calculation. The constraint $\nabla\cdot\hat{\delta\mathbf{B}}_\mathrm{plasma}=0$
    couples the toroidal component to the radial and poloidal perturbed magnetic-field
    components, so the three components should be interpreted as parts of one solenoidal
    vector field.


    The absolute magnitude has no universal range because a linear eigenfunction can
    be multiplied by an arbitrary complex normalization constant. When a physical
    small-perturbation normalization is imposed, representative amplitudes are often
    quoted through ratios such as $|\hat{\delta B}_\phi|/B_0 \ll 1$; values from $10^{-6}$-$10^{-2}$
    of the equilibrium magnetic field correspond roughly to $10^{-6}$-$10^{-1}$ T
    for equilibrium fields of 1-10 T.


    Sign convention: Positive when the real toroidal perturbation points in the direction
    of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:perturbed_plasma_magnetic_field
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_perturbed_plasma_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex toroidal component of the first-order
    plasma magnetic-field perturbation eigenfunction for a single toroidal Fourier
    mode in linear MHD stability analysis.
  documentation: 'The toroidal component of the complex plasma magnetic-field perturbation
    eigenfunction $\delta\mathbf{B}$ is the projection $\delta B_\phi = \delta\mathbf{B}
    \cdot \hat{\phi}$ along the toroidal unit vector $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. This imaginary part, $\mathrm{Im}(\delta B_\phi)$,
    together with the [real part](name:toroidal_perturbed_plasma_magnetic_field_real_part),
    fully specifies the complex toroidal component of the [perturbed plasma magnetic-field](name:perturbed_plasma_magnetic_field)
    eigenfunction associated with a single toroidal mode number $n$ within the confined
    plasma region.


    The full complex toroidal amplitude is decomposed as:


    $$

    \delta B_\phi = \mathrm{Re}(\delta B_\phi) + i\,\mathrm{Im}(\delta B_\phi)

    $$


    where the ratio of imaginary to real parts encodes the spatial phase of the perturbation
    relative to the chosen eigenmode gage convention. The absolute magnitude of the
    eigenfunction is normalization-dependent and is set by the stability solver''s
    normalization choice.


    This quantity is defined within the confined plasma region and is computed alongside
    [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    and [radial_perturbed_plasma_magnetic_field_imaginary_part](name:radial_perturbed_plasma_magnetic_field_imaginary_part)
    to fully characterize the phase-resolved perturbed magnetic-field vector inside
    the plasma. The vacuum-region counterpart for the same toroidal component is [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part).


    Sign convention: Positive when $\mathrm{Im}(\delta B_\phi)$ is directed along
    increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:perturbed_plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: toroidal_perturbed_plasma_magnetic_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    status: composed
- name: toroidal_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex toroidal component of the first-order plasma
    magnetic-field perturbation eigenfunction for a specified toroidal Fourier mode
    in linear MHD stability analysis.
  documentation: 'The toroidal perturbed plasma magnetic-field real part is the real
    component of the complex eigenfunction $\delta\tilde{B}_\phi(R,Z)$, the projection
    of the first-order plasma magnetic-field perturbation onto the toroidal unit vector
    $\hat{\phi}$ in the plasma region for one specified toroidal mode number $n$.
    It forms a conjugate pair with [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part)
    that fully specifies the complex phasor $\delta\tilde{B}_\phi$.


    In linear MHD stability analysis the perturbed magnetic field is expressed in
    the toroidal Fourier basis:


    $$

    \delta B_\phi(R, \phi, Z, t) = \operatorname{Re}\!\left[\delta\tilde{B}_\phi(R,Z)\,
    e^{i(n\phi - \omega t)}\right]

    $$


    where $\delta\tilde{B}_\phi(R,Z)$ is the complex eigenfunction amplitude resolved
    in the poloidal cross-section $(R,Z)$, $n$ is the toroidal mode number, $\omega$
    is the complex mode frequency, and the quantity stored here is $\operatorname{Re}[\delta\tilde{B}_\phi(R,Z)]$.


    The eigenfunction is obtained from linear MHD stability solvers that linearize
    the ideal or resistive MHD equations about an axisymmetric equilibrium; the absolute
    amplitude depends on the normalization convention of the solver''s eigenfunction.
    The radial and poloidal counterparts within the plasma region are [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part),
    and the vacuum-region analog at the same toroidal mode number is [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part).


    Sign convention: Positive when $\operatorname{Re}[\delta\tilde{B}_\phi]$ points
    in the direction of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  arguments:
  - name: toroidal_perturbed_plasma_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/real
    status: composed
- name: plasma_mass_density
  kind: scalar
  status: draft
  description: Local plasma mass per unit volume, forming the inertial term in the
    MHD momentum equation and appearing in contexts from equilibrium transport profiles
    to linear MHD stability perturbations.
  documentation: "The plasma mass density is the local plasma mass per unit volume,\
    \ forming the inertial term in the MHD momentum balance and the compressibility\
    \ term in the plasma continuity equation. This parent concept subsumes both equilibrium-profile\
    \ and linear-perturbation contexts: the equilibrium total value summed over all\
    \ charged species, and the complex first-order perturbation amplitude used in\
    \ linear MHD eigenvalue problems.\n\nIn the equilibrium formulation, the mass\
    \ density is defined by:\n\n$$\n\\rho = \\sum_s m_s n_s\n$$\n\nwhere $m_s$ is\
    \ the particle mass and $n_s$ the number density of charged species $s$, summed\
    \ over electrons, main-ion isotopes, and impurity charge states; neutral atoms\
    \ are excluded. Ion contributions dominate because $m_i \\gg m_e$.\n\nIn deuterium-dominated\
    \ fusion plasmas at core electron densities of order $10^{20}$ m$^{-3}$, the mass\
    \ density is approximately $3 \\times 10^{-7}$ kg m$^{-3}$, scaling directly with\
    \ ion density and average ion mass. The mass density sets the local Alfv\xE9n\
    \ speed $v_A = B / \\sqrt{\\mu_0 \\rho}$, where $B$ is the local magnetic-field\
    \ magnitude and $\\mu_0$ is the permeability of free space, governing the [alfven_time](name:alfven_time)\
    \ and ideal-MHD wave dynamics. It enters inertial_current_density through the\
    \ plasma-fluid acceleration term and is inferred from electron_number_density\
    \ measurements combined with plasma composition analysis. This quantity is closely\
    \ related to [mass_density](name:total_plasma_mass_density), which covers the\
    \ same physical concept without explicit species qualification."
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_time
  - name:total_plasma_mass_density
  arguments:
  - name: mass_density
    operator: plasma
    operator_kind: qualifier
  sources:
  - id: derived:plasma_mass_density
    status: composed
- name: perturbed_plasma_mass_density
  kind: scalar
  status: draft
  description: Complex eigenfunction of the first-order plasma mass density perturbation
    associated with a given toroidal Fourier mode in linear MHD stability analysis.
  documentation: "The perturbed plasma mass density is the complex eigenfunction amplitude\
    \ representing the first-order departure from the equilibrium [plasma mass density](name:plasma_mass_density)\
    \ in linear MHD stability theory. It is defined for a specific toroidal Fourier\
    \ mode number $n$, with the physical perturbation reconstructed as $\\mathrm{Re}[\\\
    delta\\rho(\\mathbf{r})\\,e^{i(n\\phi - \\omega t)}]$, where $\\phi$ is the toroidal\
    \ angle in the right-handed cylindrical $(R, \\phi, Z)$ frame, $\\omega$ is the\
    \ complex mode frequency, and $\\mathbf{r}$ denotes position in the poloidal cross-section.\n\
    \nThe complex eigenfunction decomposes as:\n\n$$\n\\delta\\rho = \\delta\\rho_{\\\
    mathrm{Re}} + i\\,\\delta\\rho_{\\mathrm{Im}}\n$$\n\nwhere $\\delta\\rho_{\\mathrm{Re}}$\
    \ is the [real part](name:perturbed_plasma_mass_density_real_part) and $\\delta\\\
    rho_{\\mathrm{Im}}$ is the [imaginary part](name:perturbed_plasma_mass_density_imaginary_part)\
    \ of the eigenfunction, each carrying units of kg m$^{-3}$.\n\nThis eigenfunction\
    \ is computed by linear MHD stability solvers operating on a fixed equilibrium\
    \ state. The normalization and overall phase are determined by the solver's eigenfunction\
    \ convention, so the absolute amplitude of $\\delta\\rho$ is physically meaningful\
    \ only relative to the full eigenvector. The density perturbation couples to velocity\
    \ and magnetic-field perturbations \u2014 including the [toroidal component of\
    \ the perturbed magnetic field](name:toroidal_perturbed_plasma_magnetic_field_real_part)\
    \ \u2014 through the linearized MHD continuity and momentum equations."
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_mass_density
  - name:perturbed_plasma_mass_density_real_part
  - name:perturbed_plasma_mass_density_imaginary_part
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  arguments:
  - name: plasma_mass_density
    operator: perturbed
    operator_kind: qualifier
- name: perturbed_plasma_mass_density_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex first-order plasma mass density perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The imaginary part of the complex perturbed plasma mass density
    eigenfunction $\tilde{\rho}_m$ arises when the first-order mass density perturbation
    is separated into in-phase and quadrature components relative to a chosen eigenmode
    phase and normalization. In the standard perturbation decomposition $\delta\rho(\mathbf{r},
    t) = \mathrm{Re}[\tilde{\rho}_m(\mathbf{r})\, e^{i(n\phi - \omega t)}]$, where
    $n$ is the toroidal mode number, $\phi$ is the toroidal angle, and $\omega$ is
    the complex eigenfrequency, the eigenfunction splits as:


    $$

    \tilde{\rho}_m = \tilde{\rho}_\mathrm{re} + i\,\tilde{\rho}_\mathrm{im}

    $$


    where $\tilde{\rho}_\mathrm{re}$ is the [real part](name:perturbed_plasma_mass_density_real_part)
    and $\tilde{\rho}_\mathrm{im}$ is this quantity. Together they encode the local
    amplitude $|\tilde{\rho}_m|$ and spatial phase of the mass density perturbation
    over the poloidal cross-section.


    The equilibrium mass density about which the perturbation is defined is $\rho_{m0}
    = \sum_s m_s n_s$, where $m_s$ and $n_s$ are the mass and number density of species
    $s$; ion contributions dominate in fusion plasmas because electron mass is negligible.
    These eigenfunctions are produced by linear MHD eigenvalue solvers that Fourier-decompose
    perturbations in the toroidal direction; the imaginary part is meaningful only
    relative to the phase convention and normalization of the specific eigenmode calculation.
    The companion quantities [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)
    and [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part)
    form a self-consistent set of perturbed thermodynamic eigenfunctions for the same
    MHD mode.'
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_mass_density_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_temperature_imaginary_part
  arguments:
  - name: perturbed_plasma_mass_density
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/imaginary
    status: composed
- name: perturbed_plasma_mass_density_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma mass density perturbation
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD stability
    analysis.
  documentation: 'The real part of the perturbed plasma mass density eigenfunction
    is the in-phase component of the first-order mass density variation associated
    with a linear MHD eigenmode. In the linear expansion the total plasma mass density
    is $\rho_m = \rho_{m0} + \delta\rho_m$, where the equilibrium value $\rho_{m0}
    = \sum_s m_s n_s$ sums over particle species with particle mass $m_s$ and number
    density $n_s$ (electron mass is typically negligible in fusion plasmas).


    The physical mass density perturbation for toroidal mode number $n$ is reconstructed
    from the complex eigenfunction as


    $$\delta\rho_m(R, Z, \phi, t) = \mathrm{Re}\!\left[\tilde{\rho}_m(R, Z)\,e^{i(n\phi
    - \omega t)}\right]$$


    where $\omega = \omega_r + i\gamma$ is the complex eigenfrequency with oscillation
    frequency $\omega_r$ and growth or damping rate $\gamma$, $\phi$ is the toroidal
    angle, and $R$, $Z$ are cylindrical coordinates in the right-handed $(R, \phi,
    Z)$ frame. The real and imaginary parts of $\tilde{\rho}_m(R, Z)$ together encode
    the full amplitude and phase structure of the perturbation in the poloidal plane.


    This eigenfunction component is produced by linear MHD stability solvers as part
    of the solution to the linearized compressible MHD eigenvalue problem. The absolute
    magnitude is normalization-dependent; the physically significant information lies
    in the spatial structure across the poloidal cross-section. The complementary
    in-quadrature component is [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part),
    and together they constitute the full complex eigenfunction [perturbed_plasma_mass_density](name:perturbed_plasma_mass_density).
    The analogous real-part quantity for the plasma pressure perturbation is [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part).'
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_mass_density_imaginary_part
  - name:perturbed_plasma_mass_density
  - name:perturbed_plasma_pressure_real_part
  arguments:
  - name: perturbed_plasma_mass_density
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/real
    status: composed
- name: product_of_current_density_and_major_radius
  kind: scalar
  status: draft
  description: Product of major radius R and toroidal current-density component j_phi
    in the right-handed cylindrical (R, phi, Z) frame. It is the R-weighted toroidal
    current density appearing in axisymmetric MHD force balance and the Grad-Shafranov
    source term.
  documentation: 'The product of current density and major radius is the scalar $R
    j_\phi$ at a point, where $R$ is the major radius and $j_\phi$ is the toroidal
    component of current density in the right-handed cylindrical $(R, \phi, Z)$ frame.
    It represents toroidal current density weighted by distance from the symmetry
    axis and has unit $\mathrm{A\,m^{-1}}$.


    The defining relation is:


    $$

    Q_{Rj_\phi}(R, \phi, Z) = R\,j_\phi(R, \phi, Z)

    $$


    where $Q_{Rj_\phi}$ denotes the R-weighted toroidal current density, $R$ is measured
    in meters, and $j_\phi$ is measured in $\mathrm{A\,m^{-2}}$.


    In axisymmetric MHD equilibrium, $R j_\phi$ is the toroidal-current source coupled
    to the poloidal magnetic flux in the Grad-Shafranov balance. With poloidal flux
    $\psi$, vacuum permeability $\mu_0$, pressure $p(\psi)$, and $F(\psi)=R B_\phi$,
    the same source is related to the pressure-gradient and toroidal-field contributions
    through the inline relation $\mu_0 R j_\phi = \mu_0 R^2 dp/d\psi + F dF/d\psi$.


    In practice this quantity is computed from equilibrium reconstructions, magnetic-field
    models, or numerical MHD states by projecting the current density onto the $\hat{\phi}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame and multiplying
    by the local major radius. Across a poloidal cross-section it follows both the
    toroidal current channel and the geometric weighting by $R$, so it is often largest
    where strong toroidal current density coincides with larger major radius and can
    change sign in reversed-current or edge-current regions.


    Representative magnitudes in tokamak equilibria are about $10^5$-$10^7\ \mathrm{A\,m^{-1}}$,
    corresponding for example to toroidal current densities of order $10^5$-$10^6\
    \mathrm{A\,m^{-2}}$ at major radii of a few meters. Values outside this range
    can occur in very small devices, high-current plasmas, or localized current-drive
    regions.


    Sign convention: Positive when $j_\phi$ flows in the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-1
  physics_domain: magnetohydrodynamics
  links: []
  arguments:
  - name: current_density
    operator: product
    operator_kind: binary
    role: a
    separator: and
  - name: major_radius
    operator: product
    operator_kind: binary
    role: b
    separator: and
