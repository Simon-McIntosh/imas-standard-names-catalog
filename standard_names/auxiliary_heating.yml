- name: toroidal_width_of_rectangle_geometry_of_ion_cyclotron_antenna_strap
  kind: scalar
  status: draft
  description: Full toroidal width of the rectangular cross-section of an ion cyclotron
    antenna strap conductor, measured along the direction of increasing toroidal angle
    $\phi$ in the cylindrical $(R, \phi, Z)$ frame. Together with the height, it fully
    defines the rectangular conductor cross-section.
  documentation: 'The toroidal width $w_\phi$ is the full extent of the rectangular
    strap cross-section measured along the toroidal $\hat{\phi}$ direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius from
    the machine symmetry axis and $Z$ is the vertical height. Because the toroidal
    direction is perpendicular to the poloidal $(R, Z)$ plane, $w_\phi$ characterizes
    the strap dimension that extends out of that plane.


    The rectangular cross-section is completely specified by two orthogonal dimensions:

    $$A = w_\phi \times h$$

    where $h$ is the companion height given by [height_of_rectangle_geometry_of_ion_cyclotron_antenna_strap](name:height_of_rectangle_geometry_of_ion_cyclotron_antenna_strap).
    This area $A$ governs the current-carrying capacity and contributes to the RF
    impedance of the strap.


    Typical values of $w_\phi$ for ICRH antenna straps in tokamaks range from a few
    centimeters to several tens of centimeters, depending on antenna design and operating
    frequency. This quantity describes the cross-sectional rectangle dimension and
    is geometrically distinct from the overall toroidal arc length or span of the
    strap itself. For non-rectangular (oblique) strap cross-sections, the analogous
    measure is provided by [thickness_of_oblique_cross_section_of_ion_cyclotron_antenna_strap](name:thickness_of_oblique_cross_section_of_ion_cyclotron_antenna_strap).'
  unit: m
  physics_domain: auxiliary_heating
  links:
