    dd_path: cryostat/description_2d/cryostat/unit/element/resistance
    status: composed
  - id: dd:cryostat/description_2d/thermal_shield/unit/element/resistance
    dd_path: cryostat/description_2d/thermal_shield/unit/element/resistance
