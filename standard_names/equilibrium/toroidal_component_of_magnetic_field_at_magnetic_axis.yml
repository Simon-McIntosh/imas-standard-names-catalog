name: toroidal_component_of_magnetic_field_at_magnetic_axis
description: Toroidal component $B_\phi$ of the total magnetic field evaluated at
  the magnetic axis.
documentation: The on-axis toroidal field $B_{\phi,\mathrm{axis}} = \mathbf{B} \cdot
  \hat{\phi}\big|_{R_{\mathrm{axis}},Z_{\mathrm{axis}}}$ is a key global parameter
  that sets the ion and electron cyclotron frequencies, determines the magnetic rigidity,
  and enters the definition of $\beta_{\mathrm{tor}} = 2\mu_0 \langle p \rangle /
  B_{\phi,\mathrm{axis}}^2$, where $\langle p \rangle$ is the volume-averaged plasma
  pressure and $\mu_0$ is the vacuum permeability. Positive when $B_\phi$ is in the
  $+\phi$ direction under COCOS-11 (counter-clockwise viewed from above). In tokamaks
  with purely external toroidal field coils, $B_{\phi,\mathrm{axis}}$ is dominated
  by the vacuum field and modified slightly by the plasma diamagnetic and paramagnetic
  contributions; typical values range from 1 T (small devices) to 5.3 T (ITER) on
  axis. Obtained from equilibrium reconstruction or directly from the coil current
  and vacuum field model via $B_{\phi}^{\mathrm{vac}} = \mu_0 N I_{\mathrm{TF}} /
  (2\pi R_{\mathrm{axis}})$, where $N$ is the number of toroidal field coils and $I_{\mathrm{TF}}$
  the coil current.
kind: vector_component
unit: T
