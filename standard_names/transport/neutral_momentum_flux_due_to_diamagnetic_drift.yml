name: neutral_momentum_flux_due_to_diamagnetic_drift
status: draft
description: Momentum flux density of neutral species arising from the diamagnetic
  drift mechanism in a magnetized plasma.
documentation: "Although neutral particles are not directly subject to the Lorentz\
  \ force, the diamagnetic momentum flux for neutrals captures the effective momentum\
  \ transport inherited through charge-exchange coupling with the magnetized ion population.\
  \ In the fluid picture, frequent charge-exchange collisions transfer the ion diamagnetic\
  \ drift pattern $\\mathbf{v}_{\\rm dia} = (\\mathbf{B} \\times \\nabla p_i)/(Z_i\
  \ e n_i B^2)$ to the neutral velocity field, where $\\mathbf{B}$ is the magnetic\
  \ field (T), $\\nabla p_i$ the ion pressure gradient (Pa/m), $Z_i$ the charge number,\
  \ $e$ the elementary charge (C), and $n_i$ the ion density (m$^{-3}$). The resulting\
  \ neutral diamagnetic momentum flux $\\Pi_{\\rm n,dia}$ (kg m$^{-1}$ s$^{-2}$) is\
  \ most significant in high-recycling divertor and edge regions where neutral densities\
  \ are substantial ($10^{17}$\u2013$10^{20}$ m$^{-3}$). This term is evaluated on\
  \ GGD or 1-D radial grids in edge transport models. See also `ion_momentum_flux_due_to_diamagnetic_drift`\
  \ for the charged-species analog and `ion_momentum_diffusivity_due_to_diamagnetic_drift`\
  \ for the diffusive transport coefficient."
