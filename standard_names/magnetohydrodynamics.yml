- name: poloidal_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: active
  description: Quadrature poloidal velocity component of a complex first-order plasma-velocity
    perturbation eigenfunction for a specified toroidal Fourier harmonic. It is the
    imaginary part of the projection onto the positive poloidal direction, paired
    with the in-phase real part.
  documentation: 'Quadrature poloidal velocity component of a complex first-order
    plasma-velocity perturbation eigenfunction is the imaginary part of the poloidal
    projection of that eigenfunction for a specified toroidal Fourier harmonic. The
    poloidal direction is the unit vector $\hat{\mathbf e}_\theta$ toward increasing
    poloidal angle $\theta$ in a flux-coordinate basis $(\rho,\theta,\phi)$, with
    $\phi$ the toroidal angle of the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.


    The projected component and its imaginary part are defined by


    $$

    v_{\theta,\mathrm{im}} = \operatorname{Im}\!\left(\tilde v_\theta\right), \qquad
    \tilde v_\theta = \tilde{\mathbf v}\cdot\hat{\mathbf e}_\theta

    $$


    where $\tilde{\mathbf v}$ is the complex first-order plasma-velocity perturbation
    eigenfunction, $\tilde v_\theta$ is its poloidal component, and $v_{\theta,\mathrm{im}}$
    is the coefficient of the imaginary term when $\tilde v_\theta = v_{\theta,\mathrm{re}}
    + i v_{\theta,\mathrm{im}}$.


    This quantity is the quadrature component paired with the [poloidal perturbed
    plasma velocity real part](name:poloidal_perturbed_plasma_velocity_real_part);
    together they specify the complex [poloidal perturbed plasma velocity](name:poloidal_perturbed_plasma_velocity)
    for the chosen harmonic and phase convention. It is distinct from the corresponding
    [toroidal perturbed plasma velocity imaginary part](name:toroidal_perturbed_plasma_velocity_imaginary_part),
    which projects the same complex velocity perturbation onto the toroidal direction.


    Sign convention: Positive when the quadrature component of $\tilde{\mathbf v}\cdot\hat{\mathbf
    e}_\theta$ is aligned with $+\hat{\mathbf e}_\theta$, toward increasing poloidal
    angle $\theta$ in the flux-coordinate basis $(\rho,\theta,\phi)$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_velocity_real_part
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-velocity_perturbed-coordinate2-imaginary
    dd_documentation:
      leaf: Imaginary part
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2
      parent: Second coordinate (poloidal)
      data_type: FLT_2D
      unit: m.s^-1
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim2
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
    enhanced_context:
      description: "Imaginary part of the second (poloidal) component of the perturbed\
        \ velocity eigenvector (\u1E7D) in linear MHD stability analysis. Represents\
        \ the out-of-phase poloidal fluid velocity perturbation amplitude for a given\
        \ toroidal mode number."
      kind: llm
- name: poloidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: active
  description: "Real part of the poloidal perturbed plasma velocity is the in-phase\
    \ component of the complex first-order plasma-velocity amplitude for toroidal\
    \ mode number n, resolved tangent to increasing poloidal angle in the flux-coordinate\
    \ basis (\u03C1, \u03B8, \u03C6). The toroidal angle \u03C6 is that of the right-handed\
    \ cylindrical (R, \u03C6, Z) frame; equilibrium flow and the quadrature component\
    \ are excluded."
  documentation: 'Real part of the poloidal perturbed plasma velocity is the in-phase
    component of the complex first-order plasma-velocity perturbation amplitude for
    one toroidal Fourier harmonic with mode number $n$. The poloidal component is
    resolved along the local basis direction tangent to increasing poloidal angle
    $\theta$ in a specified flux-coordinate basis $(\rho,\theta,\phi)$, with $\phi$
    the toroidal angle of the right-handed cylindrical $(R,\phi,Z)$ frame where $R$
    is major radius, $Z$ is vertical height, and $\phi$ increases counterclockwise
    when viewed from above $+\hat{Z}$. It is distinct from equilibrium plasma flow.


    For a complex poloidal amplitude in that flux-coordinate basis, the real part
    is defined by:


    $$

    v_{\theta,1}^{\mathrm{Re}}(\rho,\theta;n) = \operatorname{Re}\!\left[\tilde{v}_{\theta,1}(\rho,\theta;n)\right]

    $$


    where $v_{\theta,1}^{\mathrm{Re}}$ is this real poloidal perturbation amplitude,
    $\tilde{v}_{\theta,1}$ is the [poloidal perturbed plasma velocity](name:poloidal_perturbed_plasma_velocity),
    $\tilde{\mathbf{v}}_1$ is the complex first-order plasma-velocity perturbation
    eigenfunction for harmonic $n$, $\hat{\mathbf{e}}_\theta$ is the local normalized
    direction tangent to increasing $\theta$ with $\tilde{v}_{\theta,1}=\tilde{\mathbf{v}}_1\cdot\hat{\mathbf{e}}_\theta$,
    $\rho$ is the radial flux label, and $n$ is the toroidal Fourier mode number.


    Together with [poloidal perturbed plasma velocity imaginary part](name:poloidal_perturbed_plasma_velocity_imaginary_part),
    this quantity specifies the complex poloidal velocity amplitude for the selected
    harmonic. It is not the full real-space poloidal velocity at a particular toroidal
    angle; the dependence on $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame
    is supplied by the chosen Fourier harmonic convention. Multiplication of the complex
    eigenfunction by a constant phase factor changes the split between real and imaginary
    parts without changing the underlying linear mode, so a fixed phase reference
    is required for this real component.


    Sign convention: Positive when the real first-order velocity perturbation component
    projects along $+\hat{\mathbf{e}}_\theta$, the local direction of increasing poloidal
    angle $\theta$ in the flux-coordinate basis $(\rho,\theta,\phi)$, after the complex
    eigenmode phase reference is fixed.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_velocity_imaginary_part
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate2/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-velocity_perturbed-coordinate2-real
    dd_documentation:
