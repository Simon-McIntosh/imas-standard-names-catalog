    status: attached
- name: reference_major_radius
  kind: scalar
  status: draft
  description: Fixed major-radius coordinate in the right-handed cylindrical (R, phi,
    Z) system at which the vacuum toroidal magnetic field is specified. It is a non-negative
    geometric radius; the sign of the toroidal field is carried by the associated
    field value, not by the radius.
  documentation: 'Reference major radius $R_0$ is the major-radius coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ system at which the [toroidal vacuum magnetic
    field](name:toroidal_vacuum_magnetic_field) value $B_0$ is defined. It is a geometric
    distance from the toroidal symmetry axis and is therefore non-negative; it does
    not carry the sign of the magnetic field.


    For an axisymmetric vacuum toroidal field in a current-free region, the toroidal
    field scales inversely with major radius:


    $$

    B_\phi^\mathrm{vac}(R) = B_0\,\frac{R_0}{R}

    $$


    where $B_\phi^\mathrm{vac}(R)$ is the toroidal vacuum magnetic-field component
    in tesla at major radius $R$ in meters, $B_0$ is the signed toroidal vacuum magnetic
    field in tesla at $R_0$, and $R_0$ is the reference major radius in meters. The
    factor $R_0/R$ is positive; the field direction is determined by the sign of $B_0$.


    In practice, $R_0$ is specified from the device geometry or equilibrium reference
    setup rather than measured by an independent diagnostic. It identifies where $B_0$
    is quoted, and quantities that use the same vacuum-field reference, including
    flux-radius definitions such as [toroidal flux radius of the magnetic axis](name:toroidal_flux_radius_of_magnetic_axis),
    should use a consistent $B_0$ and $R_0$ pair.


    Representative tokamak values are about 0.3-7 m, ranging from compact or spherical
    devices to large conventional devices; the appropriate value is facility and configuration
    dependent.'
  unit: m
  physics_domain: equilibrium
  links: []
