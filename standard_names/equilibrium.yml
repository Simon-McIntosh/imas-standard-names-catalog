- name: radial_coordinate_of_strike_point
  kind: scalar
  status: active
  description: "Major-radius location of an individual magnetic strike point where\
    \ a separatrix leg intersects a divertor target, expressed in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The radial coordinate of a strike point is its major-radius location
    relative to the toroidal symmetry axis, at the intersection of a separatrix leg
    with a divertor target.


    The major-radius coordinate is defined from the strike point''s horizontal Cartesian
    position by


    $$

    R_{\mathrm{sp}}=\sqrt{x_{\mathrm{sp}}^2+y_{\mathrm{sp}}^2}

    $$


    where $R_{\mathrm{sp}}$ is the strike-point major-radius coordinate, and $x_{\mathrm{sp}}$
    and $y_{\mathrm{sp}}$ are its horizontal Cartesian coordinates in the right-handed
    Cartesian $(\hat{x},\hat{y},\hat{z})$ basis, with $\hat{z}$ vertical and coincident
    with $\hat{Z}$.


    This quantity applies to one specified magnetic strike point at a time, with no
    summation, averaging, or other aggregation. The same definition covers inner and
    outer divertor strike points without combining them or selecting one branch by
    the name alone.


    It excludes the vertical location of the strike point, which is given by the [vertical
    coordinate of the strike point](name:vertical_coordinate_of_strike_point). As
    a component of [radial_coordinate](name:radial_coordinate), it supplies the major-radius
    coordinate needed with the vertical coordinate to locate the strike point in the
    poloidal $(R,Z)$ plane. The related [radial coordinate of the X-point](name:radial_coordinate_of_x_point)
    instead identifies the separatrix''s magnetic null rather than its divertor intersection.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_strike_point
  - name:radial_coordinate_of_x_point
  sources:
  - dd_path: equilibrium/time_slice/constraints/strike_point/position_measured/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-strike_point-position_measured-r
    dd_documentation:
      leaf: Major radius
      parent_path: equilibrium/time_slice/constraints/strike_point/position_measured
      parent: Measured or estimated position
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of position measured.
      kind: template
  - dd_path: summary/boundary/strike_point_inner_r/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-boundary-strike_point_inner_r-value
    dd_documentation:
      leaf: Value
