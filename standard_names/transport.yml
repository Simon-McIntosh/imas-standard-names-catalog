- name: total_ion_source_rate
  kind: scalar
  status: draft
  description: Net volumetric source term for total ion particle density, summed over
    all ion species and charge states. It includes ionization, recombination, charge
    exchange, fueling, and external particle injection or removal processes.
  documentation: 'Total ion source rate is the net local rate at which processes create
    or remove ion particles per unit volume, after summing over all ion species and
    charge states. It is the species-summed particle source term corresponding to
    [ion_source_rate](name:ion_source_rate), and is distinct from energy deposition
    quantities such as [total_ion_power_density](name:total_ion_power_density).


    In a local particle balance, the total ion source rate $S_{i,\mathrm{tot}}$ enters
    the continuity equation:


    $$

    \frac{\partial n_{i,\mathrm{tot}}}{\partial t} + \nabla \cdot \boldsymbol{\Gamma}_{i,\mathrm{tot}}
    = S_{i,\mathrm{tot}}

    $$


    where $n_{i,\mathrm{tot}}$ is the total ion particle density in m$^{-3}$, $\boldsymbol{\Gamma}_{i,\mathrm{tot}}$
    is the total ion particle flux density in m$^{-2}$ s$^{-1}$, and $S_{i,\mathrm{tot}}$
    is in m$^{-3}$ s$^{-1}$. The divergence is evaluated in physical space; for example,
    in the IMAS cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. In flux-surface-averaged transport, the same
    balance is interpreted after averaging on surfaces labeled by an explicitly named
    flux coordinate, for example $(\rho_{\mathrm{tor,norm}}, \theta, \phi)$.


    In practice, this quantity is computed from particle balance using models or measurements
    of ionization, recombination, charge exchange with neutrals, neutral beam fueling,
    gas puffing, pellet ablation, and other particle exchange processes. It may also
    be inferred from density evolution and particle flux estimates when the transport
    divergence term is known.


    Typical core and edge magnitudes are about $10^{18}$-$10^{21}$ m$^{-3}$ s$^{-1}$
    in magnetically confined plasmas, with larger local values possible near strong
    fueling, pellet deposition, or intense recycling regions. Negative values occur
    where recombination, charge exchange, or outward particle exchange removes ions
    faster than they are created.


    Sign convention: Positive when local processes produce a net increase in the total
    ion particle density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_particles
    dd_path: core_sources/source/profiles_1d/total_ion_particles
    status: composed
  - id: dd:plasma_sources/source/global_quantities/total_ion_particles
    dd_path: plasma_sources/source/global_quantities/total_ion_particles
    status: composed
  - id: dd:plasma_sources/source/profiles_1d/total_ion_particles
    dd_path: plasma_sources/source/profiles_1d/total_ion_particles
    status: attached
- name: trapped_fast_particle_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Coulomb-collisional power density deposited in or removed from the
    fast-particle population by the trapped-orbit part of the fast-particle distribution.
  documentation: 'Trapped fast-particle collisional power density is the local rate
    per unit volume at which Coulomb collisions exchange kinetic energy with the fast-particle
    population, restricted to particles on trapped orbits. It is the trapped-orbit
    contribution to [fast_particle_power_density_due_to_collisions](name:fast_particle_power_density_due_to_collisions),
    complementary to co-passing and counter-passing orbit-class contributions.


    For a species $s$, a kinetic definition is the energy moment of the collision
    operator over the trapped region of velocity space:


    $$

    P_{\mathrm{trap}} = \int_{\Omega_{\mathrm{trap}}} \frac{1}{2} m_s v^2\, C_{\mathrm{fast}}[f_{\mathrm{trap}}](\mathbf{v})\,
    d^3v

    $$


    where $P_{\mathrm{trap}}$ is in W m^-3, $m_s$ is the particle mass in kg, $\mathbf{v}$
    is the velocity vector, $v = |\mathbf{v}|$ is in m s^-1, $f_{\mathrm{trap}}$ is
    the trapped-orbit part of the fast-particle distribution with units m^-3 (m s^-1)^-3,
    $C_{\mathrm{fast}}[f_{\mathrm{trap}}]$ is the Coulomb-collisional rate of change
    of that distribution contributing to the fast population with units m^-3 s^-1
    (m s^-1)^-3, and $d^3v$ is the velocity-space volume element with units m^3 s^-3.
    The domain $\Omega_{\mathrm{trap}}$ contains velocity-space points whose guiding-center
    orbits are trapped; in large-aspect-ratio notation this is often approximated
    by $v_\parallel^2/v^2 < \epsilon$, where $v_\parallel$ is the velocity parallel
    to the magnetic field and $\epsilon \simeq r/R$ is the local inverse aspect ratio.


    This quantity is computed from kinetic transport, Fokker-Planck, Monte Carlo,
    or reduced fast-particle models by applying Coulomb collision operators to the
    trapped part of the distribution and taking the kinetic-energy moment. Experimentally
    constrained estimates use reconstructed fast-particle distributions, magnetic-equilibrium
    information for orbit classification, and background density and temperature profiles
    that determine the collisional coefficients.


    Typical absolute magnitudes are about 10^3-10^7 W m^-3 in neutral-beam, radio-frequency,
    or fusion-alpha fast-particle populations, with values below 10^3 W m^-3 in weak
    tails or near depleted regions and localized peaks approaching 10^8 W m^-3 in
    compact high-power scenarios. The sign can be either positive or negative depending
    on whether collisions heat or slow the trapped fast-particle population.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy to the
    fast-particle population associated with trapped orbits.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:fast_particle_power_density_due_to_collisions
  - name:counter_passing_fast_particle_power_density_due_to_collisions
  - name:trapped_fast_electron_power_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/collisions/electrons/power_fast
    dd_path: distributions/distribution/profiles_1d/trapped/collisions/electrons/power_fast
    status: composed
- name: vertical_ion_state_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Z component, in the right-handed cylindrical (R, phi, Z) frame, of
    the pressure-gradient-driven diamagnetic drift velocity of a specified ion charge
    state. It is perpendicular to the local magnetic field and that charge state's
    pressure gradient.
  documentation: 'The vertical ion-state velocity due to diamagnetic drift is the
    $Z$ component of the ion charge-state diamagnetic drift velocity in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The corresponding vector quantity is [ion_state_velocity_due_to_diamagnetic_drift](name:ion_state_velocity_due_to_diamagnetic_drift);
    together with [radial_ion_state_velocity_due_to_diamagnetic_drift](name:radial_ion_state_velocity_due_to_diamagnetic_drift)
    and [toroidal_ion_state_velocity_due_to_diamagnetic_drift](name:toroidal_ion_state_velocity_due_to_diamagnetic_drift),
    this component describes the projection of that drift onto the cylindrical basis.


    For an ion species and charge state $(i,k)$ with isotropic pressure, the vertical
    component is defined by the pressure-gradient drift formula:


    $$

    v_{\mathrm{dia},Z}^{i,k} =

    \frac{\left(\nabla p_{i,k} \times \mathbf{B}\right)\cdot \hat{Z}}

    {\mathcal{Z}_{i,k} e\, n_{i,k}\, |\mathbf{B}|^2}

    $$


    where $p_{i,k}$ is the charge-state pressure in $\mathrm{Pa}$, $\nabla p_{i,k}$
    is its spatial gradient in $\mathrm{Pa\,m^{-1}}$, $\mathbf{B}$ is the magnetic
    field in $\mathrm{T}$, $|\mathbf{B}|$ is the magnetic-field magnitude in $\mathrm{T}$,
    $n_{i,k}$ is the charge-state density in $\mathrm{m^{-3}}$, $\mathcal{Z}_{i,k}$
    is the dimensionless positive ion charge number, $e$ is the elementary charge
    in $\mathrm{C}$, and $\hat{Z}$ is the vertical unit vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    This quantity is generally evaluated from measured, reconstructed, or calculated
    pressure and magnetic-field information rather than measured as an independent
    flow component. The pressure may be obtained from charge-state density and temperature,
    using $p_{i,k}=n_{i,k}T_{i,k}$ when $T_{i,k}$ is expressed as energy per particle
    with consistent conversion to $\mathrm{Pa}$. It represents the pressure-gradient
    part of the perpendicular fluid drift and is physically distinct from the electric-field-driven
    [vertical_ion_state_velocity_due_to_e_cross_b_drift](name:vertical_ion_state_velocity_due_to_e_cross_b_drift)
    and from parallel flow.


    Typical absolute values in magnetized edge plasmas are 100-10000 m.s^-1, depending
    on pressure-gradient scale length, magnetic-field strength, density, and charge
    state. The vertical component can be smaller in regions where the projection of
    $\nabla p_{i,k} \times \mathbf{B}$ onto $\hat{Z}$ is weak, and it can change sign
    across pressure extrema or where the local magnetic geometry changes the projected
    drift direction.


    Sign convention: Positive when the diamagnetic drift velocity component points
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_profiles/ggd/ion/state/velocity_diamagnetic/z
    dd_path: plasma_profiles/ggd/ion/state/velocity_diamagnetic/z
    status: composed
- name: volume_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Plasma-volume mean of the total nitrogen number density, summed over
    all ionization states from neutral to fully stripped nitrogen.
  documentation: 'The volume-averaged nitrogen density $\langle n_N \rangle$ is the
    spatial mean of the local nitrogen number density over the entire plasma volume,
    with contributions from all charge states between neutral $N^0$ and fully stripped
    $N^{7+}$. It condenses the spatially varying impurity field into a single scalar
    that represents the total nitrogen inventory of the discharge, complementing the
    local [nitrogen_density](name:nitrogen_density) profiles resolved in space.


    The defining spatial average is:


    $$

    \langle n_N \rangle = \frac{1}{V} \int_V n_N(\mathbf{r}) \, dV

    $$


    where $V$ is the confined plasma volume and $n_N(\mathbf{r})$ is the local nitrogen
    number density at position $\mathbf{r}$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, aggregated across all ionization states.


    Nitrogen is deliberately seeded in fusion devices to radiate power in the divertor
    and scrape-off layer, reducing heat loads on plasma-facing components. The volume-averaged
    density is inferred from spectroscopic measurements of nitrogen line emission
    or charge-exchange recombination spectroscopy combined with global particle-balance
    analysis.


    In nitrogen-seeded H-mode discharges, values range from $10^{17}$ to $10^{18}$
    m$^{-3}$, a small fraction of the total electron density yet radiatively significant.
    For a chord-integrated counterpart, see [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density);
    [nitrogen_fraction](name:nitrogen_fraction) normalizes this density to the local
    electron density. The analogous quantity for neon impurity seeding is [volume_averaged_neon_density](name:volume_averaged_neon_density).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:nitrogen_density
  - name:line_averaged_nitrogen_density
  - name:nitrogen_fraction
  - name:volume_averaged_neon_density
  sources:
