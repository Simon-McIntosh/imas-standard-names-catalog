- name: particle_current_density
  kind: scalar
  status: active
  description: Particle current density is the dimensionless scalar projection of
    the flux density of conventional electric charge carried by particle motion, obtained
    from a charge-weighted first velocity moment of particle distribution functions
    and normalized by a positive reference scale.
  documentation: 'Particle current density $\tilde{J}_{\mathrm{part},\hat{\mathbf{e}}}$
    is the dimensionless scalar projection of the particle contribution to [current
    density](name:current_density). It represents conventional charge transport carried
    by charged particles along a defining positive unit direction $\hat{\mathbf{e}}$,
    rather than the full current-density vector.


    For a represented set of charged species, the normalized scalar particle current
    density is defined by the projected charge-weighted first velocity moment of the
    particle distribution functions:


    $$

    \tilde{J}_{\mathrm{part},\hat{\mathbf{e}}}(\mathbf{x},t;\mathcal{S}) = \frac{1}{J_{\mathrm{ref}}}
    \sum_{s\in\mathcal{S}} q_s \int (\hat{\mathbf{e}}\cdot\mathbf{v})\, f_s(\mathbf{x},\mathbf{v},t)\,
    d^3v

    $$


    where $\mathbf{x}$ is position, $t$ is time, $\mathcal{S}$ is the represented
    species set, $s$ indexes charged species, $q_s$ is species charge, $\mathbf{v}$
    is particle velocity, $f_s$ is the particle velocity-space distribution function,
    and $J_{\mathrm{ref}}$ is the positive reference current-density scale used for
    the dimensionless normalization. For a species-resolved quantity, $\mathcal{S}$
    contains that species; for a summed particle contribution, it contains all included
    charged species.


    This quantity excludes displacement-current density and is a scalar component
    or projection, not the vector [current density](name:current_density) itself.
    A [perturbed particle current density](name:perturbed_particle_current_density)
    applies the same particle-moment definition to the perturbed distribution or perturbed
    particle response. It is distinct from [gyrocenter current density](name:gyrocenter_current_density),
    because transformations between particle and gyrocenter variables can introduce
    finite-gyroradius, magnetization, or polarization contributions.


    Sign convention: Positive when the charge-weighted particle flux projects along
    the positive direction of the defining unit vector $\hat{\mathbf{e}}$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_particle_current_density
  - name:gyrocenter_current_density
  - name:current_density
  arguments:
  - name: current_density
    operator: particle
    operator_kind: qualifier
- name: perturbed_particle_current_density
  kind: scalar
  status: active
  description: Perturbed current density computed as a velocity-space moment of the
    species-resolved perturbed particle distribution function, including polarization
    drift contributions absent from the gyrocenter-frame analog.
  documentation: 'The particle perturbed current density is the fluctuation component
    of the electric current density for a given plasma species, obtained by integrating
    the perturbed particle distribution function $\delta f_s$ over velocity space
    weighted by charge and velocity:


    $$

    \delta \mathbf{J}_s = q_s \int \mathbf{v} \, \delta f_s(\mathbf{x}, \mathbf{v},
    t) \, d^3v

    $$


    where $q_s$ is the species charge and the integral runs over all of velocity space.


    In gyrokinetic theory, this particle-frame current density differs fundamentally
    from the gyrocenter-frame current density because the coordinate transformation
    between guiding-center and particle frames introduces polarization drift contributions.
    These contributions become significant at finite perpendicular wavenumber $k_\perp
    \rho_s \gtrsim 1$ (where $\rho_s$ is the species thermal Larmor radius) and are
    essential for satisfying the quasi-neutrality constraint and recovering the correct
    electromagnetic plasma response. The gyrocenter current density systematically
    underestimates the true current unless these polarization terms are restored.


    This quantity is related to [particle_current_density](name:particle_current_density)
    through the linearized decomposition $\mathbf{J}_s = \mathbf{J}_{s,0} + \delta
    \mathbf{J}_s$, where $\mathbf{J}_{s,0}$ is the equilibrium species current. The
    [normalized_particle_perturbed_current_density](name:normalized_particle_perturbed_current_density)
    provides the dimensionless form used as standard output in gyrokinetic eigenmode
    analyzes, while [parallel_normalized_particle_perturbed_current_density](name:parallel_normalized_particle_perturbed_current_density)
    gives the projection along the magnetic field direction.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_current_density
  - name:normalized_particle_perturbed_current_density
  - name:parallel_normalized_particle_perturbed_current_density
  arguments:
  - name: particle_current_density
    operator: perturbed
    operator_kind: qualifier
- name: normalized_particle_perturbed_current_density
  kind: vector
  status: active
  description: Dimensionless vector of the species-resolved fluctuating particle current-density
    moment, formed from the perturbed distribution and normalized to a positive reference
    current-density scale.
  documentation: 'The normalized perturbed particle current density is the dimensionless,
    species-resolved fluctuation obtained from the charge-weighted first velocity-space
    moment of the perturbed particle distribution. It represents the particle-frame
    electric-current perturbation described by the [perturbed particle current density](name:perturbed_particle_current_density),
    distinct from the corresponding gyrocenter moment.


    For species $s$, the normalized quantity is defined by


    $$

    \widehat{\delta \mathbf{J}}_s = \frac{q_s \int \mathbf{v}\,\delta f_s(\mathbf{v})\,d^3v}{J_{\mathrm{ref}}}

    $$


    where $q_s$ is the species charge, $\mathbf{v}$ is particle velocity, $\delta
    f_s$ is the perturbed particle distribution function, $d^3v$ is the velocity-space
    volume element, and $J_{\mathrm{ref}}$ is a positive reference current-density
    scale.


    The vector retains the full particle-frame current-density moment; a resolved
    member such as [parallel normalized particle perturbed current density](name:parallel_normalized_particle_perturbed_current_density)
    is one directional component. Particle-frame contributions, including polarization-drift
    effects when present, are not replaced by the gyrocenter approximation represented
    by [normalized gyrocenter perturbed current density](name:normalized_gyrocenter_perturbed_current_density).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_particle_current_density
  - name:parallel_normalized_particle_perturbed_current_density
  - name:normalized_gyrocenter_perturbed_current_density
  arguments:
  - name: perturbed_particle_current_density
    operator: normalized
    operator_kind: qualifier
- name: parallel_normalized_particle_perturbed_current_density
  kind: scalar
  status: active
  description: Normalized parallel current density moment of the perturbed particle
    distribution function for a gyrokinetic eigenmode, capturing the species-resolved
    parallel current in the particle frame including polarization drift contributions
    absent from the gyrocenter-frame analog.
  documentation: "The normalized parallel current density moment of the perturbed\
    \ particle distribution function characterizes the net parallel current carried\
    \ by a plasma species in response to a gyrokinetic eigenmode perturbation, evaluated\
    \ in the particle frame. Unlike the corresponding gyrocenter moment, it incorporates\
    \ the polarization drift correction that converts between the guiding-center and\
    \ full-particle representations of the perturbed distribution.\n\nThe moment is\
    \ the first parallel velocity moment of the perturbed distribution, normalized\
    \ to a gyro-Bohm reference current density:\n\n$$\nj_{\\parallel,\\mathrm{norm}}\
    \ = q_s \\int v_\\parallel \\, \\delta f_s \\, d^3v \\Big/ j_{\\mathrm{ref}}\n\
    $$\n\nwhere $q_s$ is the species charge, $v_\\parallel = \\mathbf{v} \\cdot \\\
    hat{b}$ is the particle velocity component along the unit vector $\\hat{b}$ parallel\
    \ to the equilibrium magnetic field $\\mathbf{B}_0$, $\\delta f_s$ is the perturbed\
    \ particle distribution function, and $j_{\\mathrm{ref}}$ is the gyro-Bohm reference\
    \ current density. The difference between this moment and [parallel normalized\
    \ gyrocenter current density](name:parallel_normalized_gyrocenter_perturbed_current_density)\
    \ arises precisely from the polarization correction relating particle and gyrocenter\
    \ phase-space coordinates.\n\nThis quantity is computed from linear gyrokinetic\
    \ eigenmode solutions at a specified perpendicular wavevector $\\mathbf{k}_\\\
    perp$ and enters the parallel Ampere equation, governing electromagnetic mode\
    \ structure relevant to microtearing modes and kinetic Alfv\xE9n waves. It belongs\
    \ to the same particle-frame moment hierarchy as [parallel normalized particle\
    \ perturbed pressure](name:parallel_normalized_particle_perturbed_pressure) and\
    \ [parallel normalized particle perturbed heat flux].\n\nSign convention: Positive\
    \ when the parallel current flows in the direction of the equilibrium magnetic\
    \ field $\\hat{b}$ (i.e., parallel to $\\mathbf{B}_0$)."
  unit: '1'
  physics_domain: turbulence
  links:
