- name: absorbed_radiated_power_at_wall
  description: |-
    Net radiative power deposited on plasma-facing wall surfaces, equal to
    incident plasma radiation minus the portion reflected back toward the
    plasma.
  documentation: |-
    Net absorbed radiative power is the total photon power retained by
    plasma-facing wall surfaces after reflection losses. It represents the
    wall's radiative power load and excludes nonradiative particle, conductive,
    and other thermal-power contributions.

    The net retained power is defined by

    $$
    P_{\mathrm{abs,wall}} = P_{\mathrm{inc,wall}} - P_{\mathrm{ref,wall}}
    $$

    where $P_{\mathrm{abs,wall}}$ is the absorbed radiative power at the wall,
    $P_{\mathrm{inc,wall}}$ is the total plasma-radiation power incident on the
    wall, and $P_{\mathrm{ref,wall}}$ is the portion of that incident radiation
    reflected away from the wall. The quantity is integrated over the wall
    rather than expressed as a local power per unit area.

    This wall-wide quantity includes the aggregate radiative load over all
    applicable plasma-facing wall surfaces. It is broader than [absorbed
    radiated power of divertor](name:absorbed_radiated_power_of_divertor) and
    [absorbed radiated power of breeder blanket
    module](name:absorbed_radiated_power_of_breeder_blanket_module), which apply
    the same incident-minus-reflected principle to specified wall components,
    and it is distinct from [total incident neutral energy flux at
    wall](name:total_incident_neutral_energy_flux_at_wall), which describes
    neutral-particle energy transport rather than absorbed photon power.
  unit: W

- name: density_at_limiter
  description: |-
    Local number density of a selected charged plasma population evaluated
    immediately on the plasma-facing side of a limiter surface.
  documentation: |-
    This quantity is the local number density of a selected charged plasma
    population at the plasma-facing side of a limiter. The selection may be
    electrons, an ion species summed over its ionization states, or a defined
    fuel pseudo-species formed by combining constituent ion populations.

    $$
    n_s(\mathbf{r}_L)=\frac{dN_s}{dV}
    $$

    where $n_s$ is the selected population number density in m$^{-3}$, $N_s$ is
    the number of counted particles, $V$ is volume in m$^3$, and $\mathbf{r}_L$
    is the limiter-side evaluation position in the right-handed cylindrical $(R,
    \phi, Z)$ frame. The position is immediately adjacent to the plasma-facing
    limiter, on the plasma side of the magnetic presheath or sheath entrance.

    Population aggregation is part of the specialization: ion species quantities
    may be summed over positive ionization states while excluding neutrals,
    electrons count the electron population, and the deuterium–tritium
    pseudo-species combines the corresponding ion densities. Concrete members
    include [electron density at a limiter](name:electron_density_at_limiter),
    ion density at a limiter, and [deuterium-tritium density at a
    limiter](name:deuterium_tritium_density_at_limiter). The bare quantity does
    not imply a sum over all charged populations.
  unit: m^-3

- name: argon_density_at_limiter
  description: |-
    Argon ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral argon atoms.
  documentation: |-
    Argon density at a limiter is the local number density of argon ions in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface. The
    evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, and neutral argon atoms are excluded.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{Ar}}(\mathbf{r}_L)=\sum_{q>0} n_{\mathrm{Ar}^{q+}}(\mathbf{r}_L)
    $$

    where $n_{\mathrm{Ar}}$ and $n_{\mathrm{Ar}^{q+}}$ are number densities in
    m$^{-3}$, $q$ is the positive argon ionization state, and $\mathbf{r}_L$ is
    the limiter-side position in the right-handed cylindrical $(R, \phi, Z)$
    frame.

    This is the argon-specific member of [density at a
    limiter](name:density_at_limiter). It counts argon ions rather than the
    electrons represented by [electron density at a
    limiter](name:electron_density_at_limiter), and is local rather than the
    flux-surface average represented by flux-surface-averaged argon density at
    the plasma boundary.
  unit: m^-3

- name: beryllium_density_at_limiter
  description: |-
    Beryllium ion number density in the boundary plasma immediately adjacent to
    a plasma-facing limiter surface, summed over all beryllium ionization states
    from Be1+ through Be4+.
  documentation: |-
    Beryllium density at a limiter is the local number density of beryllium ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is the plasma side of the magnetic presheath
    or sheath entrance, where open scrape-off-layer field lines terminate on the
    material surface. Unless a specific ionization stage is resolved, this
    quantity is summed over all charged beryllium states; neutral beryllium
    atoms are excluded.

    The charge-state-summed density is defined as:

    $$
    n_\mathrm{Be} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}
    $$

    where $n_{\mathrm{Be}^{z+}}$ is the number density of beryllium ions in
    ionization state $z$, spanning all four stages accessible under edge-plasma
    conditions.

    Beryllium is used as a plasma-facing material in several tokamak devices;
    sputtering of beryllium limiter surfaces introduces impurity ions into the
    scrape-off layer, where they contribute to fuel dilution and raise the
    effective charge $Z_\mathrm{eff}$. This limiter-edge density sets the
    impurity source boundary condition in edge transport models and is inferred
    from spectroscopic line-emission measurements of beryllium charge states
    combined with sheath or presheath models, or computed self-consistently in
    coupled plasma-fluid and impurity-continuity solvers.

    This quantity is the limiter-surface analog of
    [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary)
    at the last-closed flux surface and of
    [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target)
    at the divertor target. The parent
    [density_at_limiter](name:density_at_limiter) defines the evaluation locus
    shared by all species-resolved limiter density quantities, including the
    fuel-ion member
    [deuterium_density_at_limiter](name:deuterium_density_at_limiter). The
    volumetric profile away from the limiter is given by
    [beryllium_density](name:beryllium_density).
  unit: m^-3

- name: boron_density_at_limiter
  description: |-
    Boron ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral boron atoms.
  documentation: |-
    Boron density at a limiter is the local number density of boron ions in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface. The
    evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance.

    $$
    n_{\mathrm{B}}(\mathbf{r}_L)=\frac{dN_{\mathrm{B}}}{dV}=\sum_{q=1}^{5}n_{\mathrm{B}^{q+}}(\mathbf{r}_L)
    $$

    where $n_{\mathrm{B}}$ is the boron-ion number density in m$^{-3}$,
    $N_{\mathrm{B}}$ is the number of counted boron ions, $V$ is volume in
    m$^3$, $n_{\mathrm{B}^{q+}}$ is the density of boron charge state $q$, and
    $\mathbf{r}_L$ is the limiter-side evaluation position in the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    The sum includes boron ions from B$^{+}$ through fully stripped B$^{5+}$ and
    excludes neutral boron atoms. This is the boron-specific specialization of
    [density at a limiter](name:density_at_limiter); unlike [boron density at
    the plasma boundary](name:boron_density_at_plasma_boundary), it is evaluated
    specifically at the limiter-side location.
  unit: m^-3

- name: carbon_density_at_limiter
  description: |-
    Carbon ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all carbon ionization states and
    excluding neutral carbon atoms.
  documentation: |-
    Carbon density at a limiter is the local number density of carbon ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is the plasma side of the magnetic presheath or sheath
    entrance, consistent with the parent
    [density_at_limiter](name:density_at_limiter) framework. Carbon supports six
    ionization states ($\text{C}^{1+}$ through $\text{C}^{6+}$), and this
    quantity sums over all of them; neutral carbon atoms are excluded from this
    count.

    The total charge-state-summed carbon density at the limiter is:

    $$
    n_\text{C} = \sum_{z=1}^{6} n_{\text{C}^{z+}}
    $$

    where $n_{\text{C}^{z+}}$ is the number density of carbon ions in charge
    state $z$ at the limiter evaluation point.

    Carbon enters the edge plasma primarily through physical sputtering,
    chemical erosion, and recycling from carbon-based plasma-facing components.
    The density is inferred from spectroscopic line emission (C II through C VI)
    analyzed with collisional-radiative models that convert observed photon
    emissivities to charge-state-resolved densities.

    In carbon-wall configurations, $n_\text{C}$ at the limiter spans
    approximately $10^{15}$–$10^{18}$ m$^{-3}$, depending on the carbon source
    rate, local electron temperature, and scrape-off-layer plasma density.
    Carbon impurities contribute to
    [effective_charge_at_limiter](name:effective_charge_at_limiter) and radiate
    strongly at edge electron temperatures of 10–100 eV. Analogous carbon
    densities at other boundary locations are tracked by
    [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and
    [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).
  unit: m^-3

- name: deuterium_density_at_limiter
  description: |-
    Deuterium ion number density in the boundary plasma immediately adjacent to
    a plasma-facing limiter surface, evaluated on the plasma side of the
    magnetic presheath or sheath entrance.
  documentation: |-
    Deuterium density at a limiter is the local number density of deuterium ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is on the plasma side of the magnetic
    presheath or sheath entrance, where open scrape-off-layer field lines
    terminate on the limiter material. Because deuterium carries only a single
    ionization state ($\mathrm{D}^+$, charge number $Z = 1$), no charge-state
    summation is required, in contrast to impurity-species counterparts such as
    [carbon_density_at_limiter](name:carbon_density_at_limiter) or
    [argon_density_at_limiter](name:argon_density_at_limiter).

    This density, together with
    [electron_temperature_at_limiter](name:electron_temperature_at_limiter),
    determines the ion saturation current flux to the limiter and governs local
    deuterium recycling and redeposition. In two-point model analyzes of the
    scrape-off layer, the limiter-side density is linked to the upstream
    separatrix density through parallel momentum and energy balance along
    magnetic field lines, with the Bohm sheath criterion $v_s = c_s = \sqrt{(T_e
    + T_i)/m_i}$ setting the flow speed at the sheath entrance, where $T_e$ and
    $T_i$ are the electron and ion temperatures and $m_i$ is the deuterium ion
    mass.

    Measurement methods include flush-mounted Langmuir probes that yield the ion
    saturation current density from which the density is extracted,
    spectroscopic observation of deuterium Balmer emission combined with
    collisional-radiative modeling, and edge transport simulations constrained
    by upstream density profiles. Representative scrape-off-layer values at the
    limiter span $10^{17}$–$10^{19}$ m$^{-3}$, depending on global plasma
    density, fueling, and limiter geometry.

    As a member of the [density_at_limiter](name:density_at_limiter) parent
    family, this quantity complements the tritium fuel-ion counterpart
    [tritium_density_at_limiter](name:tritium_density_at_limiter) and
    [hydrogen_density_at_limiter](name:hydrogen_density_at_limiter). The
    corresponding quantity at the magnetic separatrix is
    [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary).
  unit: m^-3

- name: deuterium_tritium_density_at_limiter
  description: |-
    Number density of the deuterium-tritium fuel pseudo-species in the boundary
    plasma immediately adjacent to a plasma-facing limiter surface, equal to the
    sum of the local deuterium and tritium ion densities.
  documentation: |-
    Deuterium-tritium density at the limiter is the local number density of the
    combined DT fuel ion pseudo-species in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface, evaluated on the plasma side of
    the magnetic presheath or sheath entrance. The DT pseudo-species represents
    deuterium and tritium ions as a single fictitious fuel constituent with an
    effective per-ion mass of $\bar{m} \approx 2.5\,m_u$ (where $m_u$ is the
    unified atomic mass unit) for an equimolar D-T mixture.

    The quantity equals the sum of the separate deuterium and tritium ion
    densities at the limiter contact point:

    $$
    n_{DT} = n_D + n_T
    $$

    where $n_D$ is the local deuterium ion number density and $n_T$ is the local
    tritium ion number density at the same evaluation point.

    This quantity is the limiter-contact analog of
    [deuterium_tritium_density](name:deuterium_tritium_density) and the DT-fuel
    counterpart of
    [deuterium_density_at_limiter](name:deuterium_density_at_limiter) at the
    same locus. It differs from
    [deuterium_tritium_density_at_plasma_boundary](name:deuterium_tritium_density_at_plasma_boundary)
    in evaluation geometry: the limiter contact lies in the scrape-off layer on
    open field lines, not at the last-closed flux surface. As a member of the
    [density_at_limiter](name:density_at_limiter) parent family, the presheath
    evaluation convention and locus definition follow those of
    [electron_density_at_limiter](name:electron_density_at_limiter) and other
    sibling fuel-species densities.
  unit: m^-3

- name: effective_charge_at_limiter
  description: |-
    Effective charge number of the local ion mixture in boundary plasma
    immediately adjacent to a plasma-facing limiter surface.
  documentation: |-
    The effective charge at a limiter quantifies the charge-squared-weighted
    composition of the local positive-ion mixture immediately adjacent to the
    plasma-facing limiter surface. It is the limiter-local specialization of
    charge_at_limiter.

    $$
    Z_\mathrm{eff} = \frac{\sum_i n_i Z_i^2}{\sum_i n_i Z_i}
    $$

    where $Z_\mathrm{eff}$ is the effective charge number, $n_i$ is the number
    density of ion population $i$ in m$^{-3}$, and $Z_i$ is its positive integer
    charge number. The sum includes positive ion species and charge states,
    while neutral atoms are excluded. A pure hydrogenic ion mixture gives
    $Z_\mathrm{eff}=1$; admixture of multiply charged impurity ions raises the
    value. The limiter location distinguishes this quantity from
    [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary),
    which is evaluated at the plasma boundary.
  unit: '1'

- name: electron_density_at_limiter
  description: |-
    Electron number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, evaluated on the plasma side of the magnetic
    presheath or sheath entrance.
  documentation: |-
    Electron density at a limiter is the local number density of electrons in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or
    sheath entrance.

    $$
    n_e(\mathbf{r}_L)=\frac{dN_e}{dV}
    $$

    where $n_e$ is the electron number density in m$^{-3}$, $N_e$ is the number
    of electrons, $V$ is volume in m$^3$, and $\mathbf{r}_L$ is the limiter-side
    evaluation position in the right-handed cylindrical $(R,\phi,Z)$ frame.

    Unlike ion density at a limiter, this quantity counts electrons only and
    includes neither ions nor neutral atoms. It is the electron-specific member
    of [density at a limiter](name:density_at_limiter) and is distinct from
    [electron density at the plasma
    boundary](name:electron_density_at_plasma_boundary), which uses a different
    evaluation locus.
  unit: m^-3

- name: electron_particle_flux_at_wall_due_to_pumping
  description: |-
    Rate at which particles represented as equivalent electrons are removed from
    the plasma region by wall pumping, giving global electron-equivalent exhaust
    throughput.
  documentation: |-
    The rate at which particles of the electron-equivalent population are
    removed from the plasma region by wall pumping is the global scalar
    representation of the wall particle-removal flux. It describes pumped
    particle exhaust using equivalent-electron counting rather than a local wall
    flux density.

    The global removal rate is defined by

    $$
    \Gamma_{e,\mathrm{pump}} = \frac{dN_{e,\mathrm{removed}}}{dt}
    $$

    where $\Gamma_{e,\mathrm{pump}}$ is the pumped particle-removal rate
    expressed in equivalent electrons, $N_{e,\mathrm{removed}}$ is the
    cumulative number of electron equivalents removed by wall pumping, and $t$
    is time.

    This quantity is aggregated over the wall and represents the total pumping
    throughput for the electron-equivalent population. The electron-equivalent
    basis does not assert that all removed particles are physical electrons, and
    the quantity is not an areal flux density, an electrical current, or a rate
    for one specified neutral species.

    It is the electron-specific specialization of the general [particle-removal
    flux at the wall due to pumping](name:particle_rate_at_wall_due_to_pumping).
    In contrast, [neutral particle flux at the wall due to
    pumping](name:neutral_particle_flux_at_wall_due_to_pumping) uses a specified
    neutral species as its counting population rather than equivalent-electron
    counting.
  unit: s^-1

- name: electron_source_rate_due_to_surface_emission
  description: |-
    Instantaneous electron-equivalent source rate supplied by surface emission
    of material from plasma-facing surfaces, weighted by the electron
    contribution of each emitted species after ionization.
  documentation: |-
    Instantaneous electron-equivalent source rate supplied by surface emission
    is the rate at which ionization of material released from plasma-facing
    surfaces adds electrons to the plasma particle balance. It aggregates all
    emitted fuel, molecular, and impurity species over all plasma-facing
    surfaces, with each emitted particle weighted by the number of bound
    electrons it can contribute after full ionization.

    The global rate is defined by integrating the emitted particle flux density
    over the plasma-facing surface area:

    $$
    S_e^{\mathrm{surf}} = \int_{A_{\mathrm{pf}}} \sum_s \nu_{e,s}\,\Gamma_s^{\mathrm{emit}}(\mathbf{x})\,dA
    $$

    where $S_e^{\mathrm{surf}}$ is the electron-equivalent surface-emission
    source rate, $A_{\mathrm{pf}}$ is the total plasma-facing surface area, $s$
    indexes emitted species, $\Gamma_s^{\mathrm{emit}}(\mathbf{x})$ is the
    emitted particle flux density of species $s$ at surface position
    $\mathbf{x}$ directed toward the plasma, $dA$ is a surface element, and
    $\nu_{e,s}$ is the electron yield of one emitted particle on full
    ionization. For an emitted atom, $\nu_{e,s}=Z_s$ with $Z_s$ the nuclear
    charge number; for an emitted molecule or compound particle, $\nu_{e,s}$ is
    the sum of the nuclear charge numbers of its constituent atoms.

    Surface emission includes recycling, delayed outgassing, and physical or
    chemical sputtering only insofar as the released material returns toward the
    plasma and is ionized. This quantity is the electron-specific counterpart of
    source_rate_due_to_surface_emission, is distinct from externally supplied
    material represented by
    [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection),
    excludes electron loss by incidence on surfaces, and contributes to
    [total_electron_source_rate](name:total_electron_source_rate).

    Sign convention: Positive when ionization of material emitted from
    plasma-facing surfaces supplies electron-equivalent particles to the plasma.
  unit: s^-1

- name: electron_temperature_at_limiter
  description: |-
    Kinetic temperature of the electron population evaluated at the
    plasma-facing side of a limiter, where open scrape-off-layer field lines
    terminate.
  documentation: |-
    This quantity is the local kinetic temperature of the electron population at
    the plasma-wall interface on the plasma-facing side of a limiter, where open
    scrape-off-layer field lines terminate. It is the electron-specific member
    of temperature at limiter.

    For an isotropic electron population, its temperature expressed in energy
    units is defined by

    $$
    T_e = \frac{2}{3}\langle E_{\mathrm{kin},e} \rangle
    $$

    where $T_e$ is the electron kinetic temperature and $\langle
    E_{\mathrm{kin},e} \rangle$ is the mean random kinetic energy per electron.

    The quantity refers to electrons on the plasma-facing side of the limiter
    interface and does not denote the temperature of the limiter material. It is
    distinct from the density-weighted population average average temperature at
    limiter, which combines the relevant plasma populations.
  unit: eV

- name: flux_at_limiter
  description: |-
    Flux at a limiter is the local surface rate density at which an
    energy-dimensioned plasma-borne quantity is deposited on the plasma-facing
    surface of a limiter. It fixes the limiter locus and the local surface-flux
    character; more specific quantities state the energy channel being carried,
    as in energy flux at limiter.
  documentation: |-
    Flux at a limiter is the local surface rate density at which an
    energy-dimensioned plasma-borne quantity is deposited on the plasma-facing
    surface of a limiter. As a structural parent, it fixes the limiter locus and
    the local per-area rate character shared by its members, while each more
    specific name states the particular energy channel being deposited.

    For a local limiter surface element, the flux is the rate of the deposited
    quantity per surface area:

    $$
    q_{\mathrm{lim}} = \frac{\partial^2 Q_{\mathrm{plasma}\to\mathrm{lim}}}{\partial A_{\mathrm{lim}}\,\partial t}
    $$

    where $q_{\mathrm{lim}}$ is the flux at limiter,
    $Q_{\mathrm{plasma}\to\mathrm{lim}}$ is the energy-dimensioned quantity
    delivered by the plasma to the limiter surface element, $A_{\mathrm{lim}}$
    is the area of that limiter plasma-facing surface element, and $t$ is time.

    The scope is restricted to plasma-facing limiter surfaces, and the quantity
    is local to the surface element: it carries no built-in integration,
    maximum, average, or other aggregation over the limiter unless a more
    specific standard name states such an aggregation. The carried quantity
    always has the dimension of energy, so every member of this family shares
    the same surface power-density character; the family does not extend to
    particle-count or momentum surface fluxes, which are dimensionally distinct
    quantities.

    This quantity excludes fluxes to non-limiter wall components, the total
    power deposited on a limiter, and signed vector heat-flux components normal
    to a surface. The more specific [energy flux at
    limiter](name:energy_flux_at_limiter) is the attested member that fixes the
    carried quantity as plasma energy deposition, inheriting the local
    limiter-surface rate-density semantics defined here.
  unit: W.m^-2

- name: energy_flux_at_limiter
  description: |-
    Plasma energy deposition rate per unit area on the plasma-facing surface of
    a limiter, without implying a maximum or other surface aggregation.
  documentation: |-
    Energy flux at a limiter is the plasma energy deposition rate per unit area
    on the plasma-facing surface of a limiter. It is a surface power-density
    quantity for plasma-wall interaction with the limiter material.

    For a surface element on the limiter, the local limiter energy flux $q_E$ is
    defined by the deposited plasma power per surface area:

    $$
    q_E = \frac{dP_\mathrm{dep}}{dA}
    $$

    where $q_E$ is the energy flux at the limiter, $P_\mathrm{dep}$ is the
    plasma power deposited on the limiter surface element, and $A$ is the area
    of that surface element.

    This parent quantity applies to limiter plasma-facing surfaces and does not
    by itself specify a spatial maximum, average, integral, component, or
    normalization. It excludes total power deposited on the limiter, which is
    obtained by integrating the energy flux over surface area, and it excludes
    energy deposition on non-limiter plasma-facing components unless those
    components are acting as the limiter surface.

    The [maximum energy flux at limiter](name:energy_flux_maximum_at_limiter) is
    the surface maximum of this limiter energy-flux quantity over the limiter
    plasma-facing surface.
  unit: W.m^-2

- name: flux_at_wall_due_to_recombination
  description: |-
    Flux at a plasma-facing wall due to recombination is the wall-area density
    of a recombination-caused transfer rate at the wall. It fixes the wall locus
    and recombination cause; a more specific quantity specifies what is
    transported, such as energy, and how incident populations, charge states,
    channels, and products are aggregated.
  documentation: |-
    Flux at a plasma-facing wall due to recombination is the wall-area density
    of a transfer rate attributable to charged plasma particles recombining into
    lower-charge or neutral states at a plasma-facing material surface. It is
    the common at-wall recombination-flux concept: the wall locus and
    recombination cause are fixed, while the transported quantity is specified
    by a more specific member.

    For a member transporting an extensive quantity $X$, the local wall-area
    density is defined by

    $$
    F_X^{\mathrm{rec,wall}} = \frac{d\dot{X}^{\mathrm{rec,wall}}}{dA}
    $$

    where $F_X^{\mathrm{rec,wall}}$ is the at-wall flux density of the
    transported quantity $X$ due to recombination, $\dot{X}^{\mathrm{rec,wall}}$
    is the corresponding recombination-at-wall transfer rate, $A$ is
    plasma-facing wall surface area, and the superscript $\mathrm{rec,wall}$
    identifies the recombination contribution at the wall.

    The quantity applies only to plasma-facing wall surfaces and to
    recombination events occurring at or mediated by those surfaces. For the
    unqualified at-wall recombination contribution, the scope is inclusive over
    contributing incident plasma populations and charge states, recombination
    channels, and product species or internal states unless a more specific
    member explicitly narrows one of those categories.

    It is not a flux through an arbitrary surface, not a volume recombination
    rate, and not the total wall flux from all plasma-wall interaction
    mechanisms. It excludes contributions from non-recombination processes such
    as direct impact energy transfer, ionization, sputtering, radiation, or
    reflection unless those processes are part of the recombination channel
    being specified.

    The [energy flux at wall due to
    recombination](name:energy_flux_at_wall_due_to_recombination) is the member
    obtained by taking $X$ to be energy; it inherits the same at-wall
    recombination locus and cause while adding the energy-specific
    interpretation and its stated aggregation over incident-ion species, charge
    states, recombination channels, and emitted products. The parent relation
    itself does not impose energy weighting on every possible member; it defines
    the shared wall-area-density form for the recombination contribution.

    Sign convention: Positive when the recombination contribution transports the
    specified quantity from the material wall toward the plasma-facing side.
  unit: W.m^-2

- name: energy_flux_at_wall_due_to_recombination
  description: |-
    Outgoing energy flux per unit plasma-facing wall area produced when incident
    plasma ions recombine at the surface, summed over incident-ion species,
    incident-ion charge states, recombination channels, and emitted product
    species and states.
  documentation: |-
    Energy flux at the wall due to recombination quantifies the rate at which
    recombination-associated energy is emitted from a plasma-facing surface per
    unit area as a result of incident plasma ions recombining or neutralizing at
    the material boundary. It is the total outgoing energy flux carried by
    emitted recombination products or quanta, not the incident plasma energy
    flux or heat deposited in the wall material.

    The total recombination energy flux at wall location $\mathbf{x}_w$ is
    defined as the product-energy moment of the outgoing recombination source:

    $$
    Q_\mathrm{rec}(\mathbf{x}_w) = \sum_{i,\,\zeta,\,c,\,a,\,k}\int E_\mathrm{out}\,\frac{d\Gamma_{i,\zeta,c,a,k}}{dE_\mathrm{out}}(\mathbf{x}_w,E_\mathrm{out})\,dE_\mathrm{out}
    $$

    where $i$ identifies the incident-ion species, $\zeta$ the incident-ion
    charge state, $c$ the surface recombination or neutralization channel, $a$
    the emitted product species, $k$ the product internal state or emission
    class, $E_\mathrm{out}$ the energy carried into the plasma-facing half-space
    by an emitted product or quantum, and
    $d\Gamma_{i,\zeta,c,a,k}/dE_\mathrm{out}$ the corresponding outgoing
    recombination-product flux distribution with respect to product energy. For
    discrete product energies, the integral is replaced by the corresponding
    sum.

    This quantity is the energy-weighted counterpart of particle flux at the
    wall due to recombination, which counts the same surface recombination
    source without energy weighting, and is the energy-flux realization of [flux
    at the wall due to recombination](name:flux_at_wall_due_to_recombination).
    The incident-ion decomposition is charge-state-summed in this total: [ion
    charge-state energy flux at the wall due to
    recombination](name:ion_charge_state_energy_flux_at_wall_due_to_recombination)
    resolves a specified incident-ion species and charge state, while [ion
    energy flux at the wall due to
    recombination](name:ion_energy_flux_at_wall_due_to_recombination) is the
    corresponding ion contribution after summing over charge states.
    Neutral-product particle specializations such as [neutral particle flux at
    the wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination)
    partition emitted-product counts and do not by themselves include energy
    weighting.

    Sign convention: Positive when recombination-associated energy is emitted
    away from the plasma-facing wall surface into the plasma-facing half-space.
  unit: W.m^-2

- name: flux_due_to_eddy_current
  description: |-
    Eddy-current-attributed energy flux is the areal rate at which energy
    generated by Joule dissipation of induced eddy currents is transferred
    across a surface. It denotes the eddy-current contribution only, not a
    generic process-labeled wall flux or total heat flux.
  documentation: |-
    Eddy-current-attributed energy flux is the areal rate at which energy
    generated by Joule dissipation of induced eddy currents is transferred
    across a surface. It is a process-attributed scalar energy flux: the process
    is fixed to eddy currents, while more specific names may add a locus such as
    a wall surface.

    The scalar flux is defined as the surface density of eddy-current-attributed
    power:

    $$
    F_{\mathrm{eddy}} = \frac{dP_{\mathrm{eddy}}}{dA}
    $$

    where $F_{\mathrm{eddy}}$ is the eddy-current-attributed energy flux,
    $P_{\mathrm{eddy}}$ is the power associated with Joule dissipation of
    induced eddy currents, and $A$ is the area over which that power is
    distributed.

    The scope is the eddy-current contribution in conducting plasma-facing
    structures; if several induced-current paths contribute to the same surface
    element, their eddy-current-attributed power contributions are summed before
    division by area. This quantity excludes total wall heat flux and
    energy-flux contributions attributed to radiation, particle impact,
    externally applied heating, or non-eddy-current mechanisms, and it does not
    by itself specify that the evaluation locus is the wall.

    Energy flux due to eddy current is the explicitly energy-qualified form of
    this same process-attributed flux. [Flux at wall due to eddy
    current](name:flux_at_wall_due_to_eddy_current) is a locus-specialized form
    evaluated at a plasma-facing wall; the present quantity retains only the
    shared eddy-current mechanism attribution, not that child locus.
  unit: W.m^-2

- name: flux_due_to_surface_emission
  description: |-
    Flux of any physical quantity emanating from a material surface through
    emission processes such as particle recycling, sputtering, or secondary
    electron and photon emission.
  documentation: |-
    Surface emission encompasses the range of physical processes by which
    plasma-facing material surfaces re-emit particles, energy, or radiation into
    the plasma or surrounding environment. These include neutral recycling
    (incident ions reflected or thermally desorbed as neutrals), physical and
    chemical sputtering (wall atoms ejected by energetic ion bombardment),
    secondary electron emission (electrons liberated by ion or electron impact),
    and thermal or fluorescence photon emission from heated or excited surface
    atoms.

    The emitted flux $\Gamma_\mathrm{emit}$ at a surface element is related to
    the incident driving flux $\Gamma_\mathrm{incident}$ through a
    process-specific emission yield $Y$:

    $$
    \Gamma_\mathrm{emit} = Y \cdot \Gamma_\mathrm{incident}
    $$

    where $Y$ is the emission yield (dimensionless for particle emission, or
    carrying the appropriate units ratio for energy or photon emission), and
    $\Gamma_\mathrm{incident}$ is the incident flux of the driving species.

    The specific instantiation of this flux at the first wall is described by
    [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission).
    For the total radiated thermal power emitted by wall material, see
    thermal_power_of_wall_material_due_to_radiation_emission. General energy
    transport through a surface is captured by energy_flux.
  unit: W.m^-2

- name: flux_at_wall_due_to_surface_emission
  description: |-
    Flux of any physical quantity emanating from a plasma-facing wall surface
    through emission processes such as sputtering, desorption, photon emission,
    and secondary-electron emission. The transported quantity may be particle
    number, energy, momentum, or radiative power in a more specific member.
  documentation: |-
    Flux of any physical quantity emanating from a plasma-facing wall surface
    through emission processes such as sputtering, desorption, thermal
    evaporation, photon emission, secondary-electron emission, or surface
    de-excitation. It is the surface-normal flux density generated by the
    material response at the wall and carried from the material side toward the
    plasma side.

    The emission flux is related to incident driving fluxes through
    surface-emission yield or response coefficients:

    $$
    F_Q^{\mathrm{emit}} = \sum_k Y_{Qk}^{\mathrm{emit}} F_k^{\mathrm{inc}}
    $$

    where $F_Q^{\mathrm{emit}}$ is the emitted flux density of physical quantity
    $Q$, $F_k^{\mathrm{inc}}$ is incident channel $k$ that drives surface
    emission, and $Y_{Qk}^{\mathrm{emit}}$ is the surface-emission coefficient
    for producing the emitted $Q$ flux.

    This quantity is the wall-specific member of
    [flux_due_to_surface_emission](name:flux_due_to_surface_emission) and is an
    abstraction over component channels. The energy channel is
    [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission),
    while energy_flux_at_wall denotes energy flux at the wall without specifying
    surface emission as the cause. It excludes flux incident on the wall from
    the plasma or radiation field except as a driver of emission;
    flux_at_wall_due_to_radiation denotes radiative flux at the wall rather than
    material emission generated by the wall.

    Sign convention: Positive when the net emitted flux is directed from the
    wall material into the plasma.
  unit: W.m^-2

- name: energy_flux_at_wall_due_to_surface_emission
  description: |-
    Energy flux at the wall due to surface emission is the energy carried away
    per unit area and time, summed over emitted species and energy
    contributions.
  documentation: |-
    Energy flux at the wall due to surface emission is the outward energy
    transport rate per unit area associated with surface-emission processes. It
    includes the kinetic energy of emitted particles and other emitted energy
    contributions, rather than being restricted to radiation alone.

    The local emitted energy flux density is defined by

    $$
    \Gamma_W^{\mathrm{em}} = \frac{\mathrm{d}W_{\mathrm{em}}}{\mathrm{d}A\,\mathrm{d}t}
    $$

    where $\Gamma_W^{\mathrm{em}}$ is the emitted energy flux density,
    $W_{\mathrm{em}}$ is the energy carried away through surface emission, $A$
    is wall surface area, and $t$ is time.

    Contributions are summed over emitted species, their charge states, and
    emitted energy channels. The quantity is local to the wall, not a
    surface-integrated power or spatial maximum. It excludes incident energy and
    is not the net energy deposited at the wall.

    This is the energy-transport specialization of [flux at the wall due to
    surface emission](name:flux_at_wall_due_to_surface_emission). Its
    [kinetic-energy
    contribution](name:kinetic_energy_flux_at_wall_due_to_surface_emission)
    accounts for energy carried by emitted particle motion. The net energy flux
    received by the wall equals the [incident energy
    flux](name:incident_energy_flux_at_wall) minus this emitted energy flux.

    Sign convention: Positive when energy is carried away from the wall into the
    plasma.
  unit: W.m^-2

- name: helium_3_density_at_limiter
  description: |-
    Helium-3 ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral helium-3 atoms.
  documentation: |-
    Helium-3 density at a limiter is the local number density of helium-3 ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is on the plasma side of the magnetic
    presheath or sheath entrance.

    $$
    n_{^3\mathrm{He}}(\mathbf{r}_L)=\frac{dN_{^3\mathrm{He}}}{dV}
    $$

    where $n_{^3\mathrm{He}}$ is the helium-3 ion number density,
    $N_{^3\mathrm{He}}$ is the counted number of helium-3 ions, $V$ is volume,
    and $\mathbf{r}_L$ is the limiter-side evaluation position in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The density is summed over all positive helium-3 ionization states and
    excludes neutral helium-3 atoms. It is the helium-3-specific member of
    [density at a limiter](name:density_at_limiter) and differs from ion density
    at a limiter, which is not restricted to helium-3; [helium-4 density at a
    limiter](name:helium_4_density_at_limiter) describes the corresponding
    isotope.
  unit: m^-3

- name: helium_4_density_at_limiter
  description: |-
    Local particle number density of helium-4 ions evaluated in the boundary
    plasma immediately adjacent to the plasma-facing limiter surface, on the
    plasma side of the magnetic presheath or sheath entrance. The value is
    summed over He+ and He2+ ionization states and excludes neutral helium-4
    atoms.
  documentation: |-
    Helium-4 density at a limiter is the local number density of helium-4 ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is on the plasma side of the magnetic
    presheath or sheath entrance, not inside the limiter material or in neutral
    gas retained at the surface. It is summed over the helium-4 ion charge
    states He$^+$ and He$^{2+}$, and excludes neutral helium-4 atoms.

    The charge-state-summed helium-4 ion density is related to the
    charge-state-resolved velocity distribution functions by:

    $$
    n_{\mathrm{He4}} = \sum_{q=1}^{2} n_{\mathrm{He4}^{q+}} = \sum_{q=1}^{2} \int f_{\mathrm{He4}^{q+}}(\mathbf{v}) \, d^3v
    $$

    where $q$ is the positive ion charge state, $f_{\mathrm{He4}^{q+}}$ is the
    velocity distribution function of helium-4 ions with charge state $q+$, and
    the integral is taken over all particle velocities at the limiter-side
    evaluation point.

    This quantity is the helium-4 isotope contribution to
    [density_at_limiter](name:density_at_limiter) and to the unweighted ion
    population represented by
    [total_ion_density_at_limiter](name:total_ion_density_at_limiter). In a
    quasineutral boundary plasma,
    [electron_density_at_limiter](name:electron_density_at_limiter) is coupled
    to the charge-weighted ion sum, so helium-4 contributes $\sum_{q=1}^{2}
    q\,n_{\mathrm{He4}^{q+}}$ to that balance. The corresponding helium-3
    isotope quantity is
    [helium_3_density_at_limiter](name:helium_3_density_at_limiter).
  unit: m^-3

- name: hydrogen_density_at_limiter
  description: |-
    Local particle number density of hydrogen ions in the boundary plasma
    immediately adjacent to a plasma-facing limiter surface, evaluated on the
    plasma side of the magnetic presheath or sheath entrance.
  documentation: |-
    Hydrogen density at a limiter is the local number density of hydrogen ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is on the plasma side of the magnetic
    presheath or sheath entrance; neutral hydrogen is excluded. For hydrogen,
    the charge-state sum reduces to the density of positively charged hydrogen
    ions, H+.

    The local hydrogen-ion density is defined from the velocity distribution
    function:

    $$
    n_{\mathrm{H}^+} = \int f_{\mathrm{H}^+}(\mathbf{v})\,d^3v
    $$

    where $n_{\mathrm{H}^+}$ is the hydrogen-ion number density,
    $f_{\mathrm{H}^+}$ is the hydrogen-ion velocity distribution function, and
    $\mathbf{v}$ is particle velocity at the evaluation point.

    This quantity is the hydrogen-specific component of
    [density_at_limiter](name:density_at_limiter). It counts hydrogen ions
    separately from
    [deuterium_density_at_limiter](name:deuterium_density_at_limiter), and does
    not include neutral hydrogen or other ion species.
  unit: m^-3

- name: incident_angle_at_wall
  description: |-
    Incident angle at wall is the angle between the incoming neutral-particle
    velocity and the wall-surface normal directed into the material. It is the
    species-specific angular coordinate for physical sputtering by neutral
    projectiles; zero is normal incidence and grazing incidence approaches a
    right angle.
  documentation: |-
    Incident angle at wall is the geometrical angle between the velocity
    direction of an incident neutral particle at impact and the local
    wall-surface normal directed from the plasma-facing side into the wall
    material. It characterizes the incidence direction of a selected
    neutral-particle species on the wall.

    The incidence angle $\alpha$ is defined by

    $$
    \alpha = \arccos\left(\hat{\mathbf{v}}_\mathrm{inc}\cdot\hat{\mathbf{n}}_\mathrm{in}\right)
    $$

    where $\hat{\mathbf{v}}_\mathrm{inc}$ is the unit direction of the incoming
    neutral-particle velocity at the impact point and
    $\hat{\mathbf{n}}_\mathrm{in}$ is the local wall-surface unit normal
    directed into the wall material.

    The scope is a specified neutral incident species interacting with the wall.
    The allowed interval is $0 \le \alpha \le \pi/2$: $\alpha=0$ corresponds to
    normal incidence into the wall, and $\alpha=\pi/2$ corresponds to tangential
    grazing incidence. Directions for which the particle is leaving the
    wall-facing half-space are not incident angles.

    This quantity is the angular argument for the physical sputtering dependence
    of that neutral species at the wall. It is not the physical sputtering
    coefficient, not an angle for emitted or sputtered particles, and not an
    average over neutral species or wall locations.
  unit: rad

- name: incident_energy_flux_at_wall_due_to_eddy_current
  description: |-
    Incident energy flux at the wall is the incoming energy-transfer rate per
    unit area attributable to eddy-current processes, before subtraction of
    emitted energy.
  documentation: |-
    Incident energy flux at the wall due to eddy-current processes is the
    incoming contribution to the corresponding surface energy balance. It
    describes energy arriving at a wall component before accounting for energy
    emitted from that component.

    The local incident energy flux is defined by

    $$
    \Gamma_{W,\mathrm{inc}}^{\mathrm{eddy}} = \frac{\partial^2 W_{\mathrm{inc}}^{\mathrm{eddy}}}{\partial A\,\partial t}
    $$

    where $\Gamma_{W,\mathrm{inc}}^{\mathrm{eddy}}$ is the incident energy flux
    attributed to eddy-current processes, $W_{\mathrm{inc}}^{\mathrm{eddy}}$ is
    the cumulative incident energy attributed to those processes, $A$ is wall
    surface area, and $t$ is time.

    The quantity applies to the wall component under consideration and is an
    energy-transfer rate per unit area, not a component-integrated power or a
    sum over wall components. It includes only the eddy-current-attributed
    contribution, not the sum of all incident energy-transfer channels.

    Within this mechanism's energy balance, the net flux received by the wall
    equals this incident contribution minus the [emitted eddy-current energy
    flux]. Incident and emitted contributions are separate nonnegative
    directional quantities, unlike their net difference.
  unit: W.m^-2

- name: incident_ion_charge_state_kinetic_energy_flux_at_wall
  description: |-
    Kinetic-energy power delivered per unit wall area by ions in one specified
    charge state as they cross the sheath and strike the wall.
  documentation: |-
    This quantity is the incident kinetic-energy power flux delivered to a wall
    surface by ions belonging to one specified ion charge state. It represents
    the kinetic energy carried by those ions after traversing the sheath and
    arriving at the wall.

    At a wall point, the incident kinetic-energy flux is defined by

    $$
    q^{\mathrm{kin}}_{s,\mathrm{inc}} = \int_{\mathbf{v}\cdot\hat{\mathbf{n}}>0} \frac{1}{2}m_s\lvert\mathbf{v}\rvert^2(\mathbf{v}\cdot\hat{\mathbf{n}})f_s(\mathbf{v})\,d^3v
    $$

    where $q^{\mathrm{kin}}_{s,\mathrm{inc}}$ is the incident kinetic-energy
    flux, $s$ identifies the specified ion charge state, $m_s$ is the mass of
    that ion charge state, $\mathbf{v}$ is the ion velocity at the wall,
    $\hat{\mathbf{n}}$ is the unit normal directed from the plasma toward the
    wall, $f_s(\mathbf{v})$ is the velocity distribution of that charge state,
    and $d^3v$ is the velocity-space volume element. The integration condition
    selects ions moving toward the wall.

    The quantity applies locally to the wall surface and is specific to one ion
    charge state; it is not summed over ionization states or ion species. It
    includes kinetic energy only and excludes neutral-particle energy, radiative
    energy, recombination energy, and other non-kinetic contributions.

    Summing the charge-state-resolved contributions gives the corresponding
    all-ion quantity [ion kinetic energy flux at
    wall](name:ion_kinetic_energy_flux_at_wall), while [ion charge state
    particle flux at wall](name:ion_charge_state_particle_flux_at_wall) counts
    arriving ions rather than weighting them by kinetic energy. It is distinct
    from [total incident neutral energy flux at
    wall](name:total_incident_neutral_energy_flux_at_wall), which concerns
    neutral particles.
  unit: W.m^-2

- name: incident_ion_particle_flux_at_wall
  description: |-
    Areal arrival rate of particles from a selected ion species at a wall
    surface, summed over all ionization states.
  documentation: |-
    Incident ion particle flux at a wall is the local rate at which particles
    from a selected ion species arrive at a wall surface per unit area. It
    counts arriving particles rather than their charge or deposited energy.

    The flux is defined by

    $$
    \Gamma_i^{\mathrm{inc}}(A,t)=\frac{\partial^2 N_i^{\mathrm{inc}}}{\partial A\,\partial t},\qquad N_i^{\mathrm{inc}}=\sum_z N_{i,z}^{\mathrm{inc}}
    $$

    where $\Gamma_i^{\mathrm{inc}}$ is the incident particle flux of ion species
    $i$, $A$ is wall surface area, $t$ is time, $N_i^{\mathrm{inc}}$ is the
    cumulative number of incident particles of species $i$, $z$ is the
    ionization-state index, and $N_{i,z}^{\mathrm{inc}}$ is the cumulative
    number arriving in state $z$.

    The quantity applies locally to the selected wall surface and to the
    selected ion species, with contributions summed over all of that species'
    ionization states. It includes particles moving toward and reaching the
    wall, but excludes emitted particles, neutral particles, other ion species,
    and charge-state-resolved values.

    It is the charge-state sum represented by the [ion charge-state particle
    flux at the wall](name:ion_charge_state_particle_flux_at_wall). Unlike the
    [incident ion energy flux at the wall due to
    recombination](name:incident_ion_energy_flux_at_wall_due_to_recombination),
    it counts arriving particles without weighting them by deposited or carried
    energy.
  unit: m^-2.s^-1

- name: incident_neutral_particle_flux_at_wall
  description: |-
    Incident neutral particle flux at the wall is the wall-integrated arrival
    rate of neutral particles of one specified species moving from the plasma
    side toward plasma-facing material. It excludes neutral particles emitted by
    the wall.
  documentation: |-
    Incident neutral particle flux at the wall is the wall-integrated rate at
    which neutral particles of one specified species arrive at plasma-facing
    material from the plasma side. It counts incoming neutral particles crossing
    the material boundary toward the wall, not particles emitted by the wall.

    The wall-integrated arrival rate is the surface integral of the
    corresponding local incident flux:

    $$
    \dot{N}_{n,\mathrm{wall}}^{\mathrm{inc}} = \int_{A_\mathrm{wall}} \Gamma_{n,\mathrm{wall}}^{\mathrm{inc}}(\mathbf{x})\, dA
    $$

    where $\dot{N}_{n,\mathrm{wall}}^{\mathrm{inc}}$ denotes this incident
    neutral particle flux at the wall, $A_\mathrm{wall}$ is the plasma-facing
    wall surface included in the total,
    $\Gamma_{n,\mathrm{wall}}^{\mathrm{inc}}(\mathbf{x})$ is the incident
    component of the local neutral particle flux at the wall for the same
    neutral species at wall position $\mathbf{x}$, and $dA$ is the surface-area
    element.

    The quantity is species-resolved for one neutral species and aggregated over
    wall position by surface integration. It is not the local per-area neutral
    particle flux at the wall at a given wall position, and it is not a signed
    net balance between incoming and outgoing neutrals.

    Wall-emitted neutral particles belong to the opposite direction of exchange
    and are represented separately by quantities such as [neutral particle flux
    at the wall due to surface
    emission](name:neutral_particle_flux_at_wall_due_to_surface_emission).
    Contributions from disjoint wall regions add to form the global incident
    rate.
  unit: s^-1

- name: ion_average_temperature_at_limiter
  description: |-
    Density-weighted mean kinetic temperature of all ion species and charge
    states on the plasma-facing side of a limiter, providing the ion component
    of the local average plasma temperature.
  documentation: |-
    The ion component of the local plasma temperature at a limiter is the
    density-weighted mean kinetic temperature of all positive ion species and
    charge states on the plasma-facing side of the limiter. It is the
    ion-specific component of average temperature at the limiter.

    $$
    T_{i,\mathrm{avg}} = \frac{\sum_s \sum_q n_{s,q} T_{s,q}}{\sum_s \sum_q n_{s,q}}
    $$

    where $s$ indexes ion species, $q$ indexes their positive charge states,
    $n_{s,q}$ is the corresponding ion number density, and $T_{s,q}$ is its
    kinetic temperature. The denominator is the [total ion density at the
    limiter](name:total_ion_density_at_limiter).

    This quantity includes all ion species and charge states in the local plasma
    population and excludes electrons, neutral particles, and the solid limiter
    material. It is distinct from temperature at the limiter, which may denote a
    specified population or a different population aggregation.
  unit: eV

- name: ion_charge_state_energy_flux_at_wall_due_to_recombination
  description: |-
    Outgoing recombination energy flux at the wall is the emitted energy per
    unit area and time attributable to a specified incident-ion species and
    charge state.
  documentation: |-
    Ion charge-state energy flux at the wall due to recombination is the
    outgoing energy transfer associated with surface recombination of a
    specified incident-ion species and charge state. The charge-state label
    identifies the incident ion responsible for recombination, not the charge
    state of an emitted product.

    The local emitted energy flux is defined by:

    $$
    \Gamma_{W,s,Z}^{\mathrm{em,rec}} = \frac{\partial^2 W_{s,Z}^{\mathrm{em,rec}}}{\partial A\,\partial t}
    $$

    where $\Gamma_{W,s,Z}^{\mathrm{em,rec}}$ is the outgoing recombination
    energy flux attributable to incident-ion species $s$ and charge state $Z$,
    $W_{s,Z}^{\mathrm{em,rec}}$ is the corresponding cumulative emitted
    recombination-associated energy, $A$ is wall area, and $t$ is time. The
    superscripts $\mathrm{em}$ and $\mathrm{rec}$ denote emission and
    recombination, respectively.

    The quantity applies locally at the wall, with incident-ion species and
    charge state held fixed. Recombination channels and emitted product species
    and states are summed; incident-ion species and charge states are not. It is
    an energy flux per unit area, not a wall-integrated power, and excludes
    energy transferred through non-recombination channels.

    Summing over incident-ion species and charge states gives the [ion energy
    flux at the wall due to
    recombination](name:ion_energy_flux_at_wall_due_to_recombination), the
    ion-associated contribution to the broader [energy flux at the wall due to
    recombination](name:energy_flux_at_wall_due_to_recombination). Unlike the
    [incident-ion recombination energy
    flux](name:incident_ion_energy_flux_at_wall_due_to_recombination), this
    quantity describes energy emitted from the wall rather than energy delivered
    to it. It is neither incoming kinetic-energy flux nor an
    incident-minus-emitted net balance.
  unit: W.m^-2

- name: ion_energy_flux_at_wall_due_to_recombination
  description: |-
    Outgoing energy flux per unit plasma-facing wall area produced when incident
    plasma ions recombine at the surface, restricted to the ion-associated
    channel and summed over incident-ion species and charge states.
  documentation: |-
    Ion energy flux at the wall due to recombination quantifies the rate at
    which recombination-associated energy from incident plasma ions leaves a
    plasma-facing surface per unit area. It is the ion-associated component
    summed over incident-ion species and charge states, not the incident plasma
    energy flux or energy deposited in the wall material.

    The aggregate is defined from charge-state-resolved components by:

    $$
    Q_{\mathrm{rec,ion}}(\mathbf{x}_w) = \sum_{s,q} Q_{\mathrm{rec},s,q}(\mathbf{x}_w)
    $$

    where $\mathbf{x}_w$ is the wall location, $s$ identifies an incident-ion
    species, $q$ identifies its charge state, and $Q_{\mathrm{rec},s,q}$ is the
    corresponding [ion charge-state energy flux at the wall due to
    recombination](name:ion_charge_state_energy_flux_at_wall_due_to_recombination).
    The sum includes all represented incident-ion species and charge states.

    As a component of [energy flux at the wall due to
    recombination](name:energy_flux_at_wall_due_to_recombination), this quantity
    retains only the ion-associated energy channel. Unlike particle flux at the
    wall due to recombination, it weights the outgoing recombination
    contribution by carried energy; it is distinct from incident [ion kinetic
    energy flux at the wall](name:ion_kinetic_energy_flux_at_wall).
  unit: W.m^-2

- name: incident_ion_energy_flux_at_wall_due_to_recombination
  description: |-
    Incident ion energy flux at the wall due to recombination is the energy
    delivered per unit wall area by ions that strike the wall and recombine
    there. It is summed over ion species and charge states and excludes
    kinetic-energy flux and emitted-particle contributions.
  documentation: |-
    Incident ion energy flux at the wall due to recombination is the
    wall-directed energy transfer associated with ions that arrive at a material
    wall and recombine there. It represents the recombination-energy channel
    only, not the ions' translational kinetic-energy flux or other wall
    energy-transfer mechanisms.

    The quantity is defined as the species- and charge-state-summed
    recombination-energy flux of incident ions:

    $$
    q_{\mathrm{rec},i}^{\mathrm{inc}} = \sum_s \sum_Z \Gamma_{s,Z}^{\mathrm{inc}} \, \epsilon_{s,Z}^{\mathrm{rec}}
    $$

    where $q_{\mathrm{rec},i}^{\mathrm{inc}}$ is the incident ion energy flux at
    the wall due to recombination, $s$ indexes ion species, $Z$ indexes charge
    states, $\Gamma_{s,Z}^{\mathrm{inc}}$ is the particle flux of incident ions
    of species $s$ and charge state $Z$ to the wall, and
    $\epsilon_{s,Z}^{\mathrm{rec}}$ is the recombination energy delivered to the
    wall per such incident ion.

    The scope is local material wall surfaces and incident ions only. The
    aggregation convention is summation over all ion species and all charge
    states represented in the ion population. The quantity excludes neutral and
    electron recombination-energy contributions, particles emitted from the
    wall, kinetic-energy flux, radiation, and other non-recombination energy
    channels.

    Within the recombination energy-flux decomposition, this quantity is the
    incident-ion component related to the [ion energy flux at the wall due to
    recombination](name:ion_energy_flux_at_wall_due_to_recombination). The
    corresponding [energy flux at the wall due to
    recombination](name:energy_flux_at_wall_due_to_recombination) is the broader
    recombination-channel quantity over the particle classes included in that
    decomposition. These relationships are aggregations over species, charge
    states, or particle classes; they do not define an incident-minus-emitted
    net balance.
  unit: W.m^-2

- name: ion_kinetic_energy_flux_at_wall
  description: |-
    Incident kinetic-energy power flux delivered by all plasma ions striking a
    plasma-facing wall, summed over ion species and charge states and excluding
    electrons and neutrals.
  documentation: |-
    This quantity is the ion-resolved component of the incident kinetic-energy
    flux at a plasma-facing wall. It contributes to the parent kinetic energy
    flux at wall and includes all incident ion species and charge states, but
    excludes electron, neutral-particle, radiative, and electromagnetic
    contributions.

    For an outward wall normal $\hat{n}$ directed from the material into the
    plasma, the flux is defined by

    $$
    q_{i}^{\mathrm{kin}} = \sum_s \int_{\mathbf{v}\cdot\hat{n}<0} \frac{1}{2}m_s |\mathbf{v}|^2 (-\mathbf{v}\cdot\hat{n}) f_s(\mathbf{v})\,d^3\mathbf{v}
    $$

    where $s$ indexes ion species and charge states, $m_s$ is the ion mass,
    $\mathbf{v}$ is particle velocity, and $f_s$ is the incident velocity
    distribution. The minus sign converts the inward particle velocity into a
    positive arrival flux; the resulting quantity is non-negative.
  unit: W.m^-2

- name: iron_density_at_limiter
  description: |-
    Iron ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all ionization stages and
    excluding neutral iron atoms.
  documentation: |-
    Iron density at a limiter is the local number density of iron ions in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface. The
    evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, consistent with the parent
    [density_at_limiter](name:density_at_limiter). Unless a single ionization
    stage is specified in context, this quantity is summed over all iron charge
    states from Fe$^{1+}$ to Fe$^{26+}$, excluding neutral iron atoms.

    The total iron ion number density at the limiter is defined as:

    $$
    n_{\mathrm{Fe}} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}
    $$

    where $n_{\mathrm{Fe}^{z+}}$ is the local number density of iron in charge
    state $z$.

    Iron enters the edge plasma primarily through physical sputtering of
    metallic plasma-facing components by energetic ions and charge-exchange
    neutrals impacting the limiter surface. At the limiter, where open
    scrape-off-layer field lines terminate on the material boundary, sputtered
    iron atoms are ionized within a thin ionization front and become subject to
    parallel and cross-field impurity transport. The local iron ion density at
    the limiter characterizes the impurity source strength at this plasma-wall
    interface and serves as a boundary condition for edge impurity transport
    modeling. It connects to
    [iron_density_at_plasma_boundary](name:iron_density_at_plasma_boundary) and
    [iron_density_at_divertor_target](name:iron_density_at_divertor_target),
    which describe the same impurity density evaluated at different
    plasma-facing surfaces.
  unit: m^-3

- name: kinetic_energy_flux_at_wall_due_to_surface_emission
  description: |-
    Kinetic-energy power flux density carried away from a plasma-facing surface
    by emitted particles, including ions and electrons and aggregated over
    species.
  documentation: |-
    This quantity is the outward kinetic-energy flux density carried by
    particles emitted from a plasma-facing surface through sputtering,
    reflection, secondary emission, or related surface-emission processes. It
    includes all emitted particle species and charge states, rather than
    selecting a particular ion or charge state.

    The kinetic-energy flux density is defined by

    $$
    q_{\mathrm{kin}} = \sum_s \int_{\mathbf{v}\cdot\mathbf{n}>0} \frac{1}{2}m_s v^2\,(\mathbf{v}\cdot\mathbf{n}) f_s(\mathbf{v})\,d^3v
    $$

    where $s$ indexes emitted particle species and charge states, $m_s$ is
    particle mass in kg, $\mathbf{v}$ is particle velocity in m/s,
    $v=|\mathbf{v}|$, $\mathbf{n}$ is the outward surface-normal unit vector,
    and $f_s$ is the emitted-particle velocity distribution. The outward
    condition excludes particles incident on the surface. This is the kinetic
    component of [energy flux at wall due to surface
    emission](name:energy_flux_at_wall_due_to_surface_emission), excluding
    particle potential-energy contributions and photon or other radiative
    energy; [ion charge-state kinetic energy flux at wall due to surface
    emission](name:ion_charge_state_kinetic_energy_flux_at_wall_due_to_surface_emission)
    is a charge-state-resolved instance.
  unit: W.m^-2

- name: electron_kinetic_energy_flux_at_wall_due_to_surface_emission
  description: |-
    Kinetic-energy power carried away per unit wall area by electrons emitted
    from a plasma-facing surface after passage through the sheath.
  documentation: |-
    This quantity is the outward kinetic-energy flux density carried by
    electrons released from a plasma-facing wall through surface-emission
    processes. It represents energy transported by the emitted electron
    population after sheath transmission.

    The emitted electron kinetic-energy flux density is related to the emitted
    particle flux and the mean kinetic energy per emitted electron by

    $$
    q_{\mathrm{e,kin}}^{\mathrm{em}} = \Gamma_{\mathrm e}^{\mathrm{em}}\,\overline{E}_{\mathrm{kin,e}}
    $$

    where $q_{\mathrm{e,kin}}^{\mathrm{em}}$ is this kinetic-energy flux
    density, $\Gamma_{\mathrm e}^{\mathrm{em}}$ is the [electron particle flux
    due to surface
    emission](name:electron_particle_flux_at_wall_due_to_surface_emission), and
    $\overline{E}_{\mathrm{kin,e}}$ is the mean kinetic energy carried by each
    emitted electron.

    The quantity applies specifically to emitted electrons at the wall surface
    and is aggregated over the emitted electron population, rather than
    representing an individual electron energy or a spatial maximum. It excludes
    energy carried by incident electrons, emitted ions, emitted photons, and
    non-kinetic energy of emitted electrons.

    It is the electron kinetic contribution to the broader [energy flux at the
    wall due to surface
    emission](name:energy_flux_at_wall_due_to_surface_emission), which also
    includes other emitted energy channels. It is distinct from the incident
    wall energy represented by energy flux at the wall and from the
    corresponding emitted-ion quantity [ion kinetic energy flux at the wall due
    to surface
    emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission).

    Sign convention: Positive when kinetic energy is carried away from the wall
    into the plasma.
  unit: W.m^-2

- name: ion_charge_state_kinetic_energy_flux_at_wall_due_to_surface_emission
  description: |-
    Kinetic-energy power flux density carried by ions in a specified charge
    state leaving a plasma-facing surface through sputtering, reflection, or
    related surface-emission processes.
  documentation: |-
    This quantity is the outward kinetic-energy flux density carried by ions in
    a specified species and charge state emitted from a plasma-facing surface
    through sputtering, reflection, or related surface-emission processes.

    The charge-state-resolved kinetic-energy flux density is defined by

    $$
    q_{\mathrm{kin},s} = \int_{\mathbf{v}\cdot\mathbf{n}>0} \frac{1}{2}m_s v^2\,(\mathbf{v}\cdot\mathbf{n}) f_s(\mathbf{v})\,d^3v
    $$

    where $s$ identifies the selected ion species and charge state, $m_s$ is its
    particle mass, $\mathbf{v}$ is particle velocity, $v=|\mathbf{v}|$,
    $\mathbf{n}$ is the outward surface-normal unit vector, and $f_s$ is its
    emitted-particle velocity distribution. The outward condition excludes
    particles incident on the surface.

    This is one charge-state contribution to [kinetic-energy flux at wall due to
    surface emission](name:kinetic_energy_flux_at_wall_due_to_surface_emission),
    excluding other ion charge states, electrons, particle potential energy,
    photons, and other radiative energy. The ion-aggregated quantity [ion
    kinetic-energy flux at wall due to surface
    emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission) sums
    this contribution over ion species and charge states.
  unit: W.m^-2

- name: ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  description: |-
    Kinetic energy flux density carried by ions leaving the plasma-facing wall
    through surface emission processes such as physical sputtering and ion
    backscattering.
  documentation: |-
    The kinetic energy flux density at the plasma-facing wall surface carried by
    ions emitted outward via surface emission — the family of plasma–wall
    interaction processes, including physical sputtering, chemical sputtering,
    and ion backscattering, that return ionic species from the wall to the
    plasma. The `kinetic` qualifier restricts this to translational kinetic
    energy of the emitted ion velocity distribution, excluding potential energy
    stored in electronic excitation or residual ionization charge, which is
    captured separately by
    [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).

    The emitted kinetic energy flux $\Phi_{\mathrm{kin,emit}}$ sums over all
    emitted ion species $s$:

    $$
    \Phi_{\mathrm{kin,emit}} = \sum_s \int_{v_n > 0} \tfrac{1}{2} m_s v^2 \, v_n \, f_{s,\mathrm{emit}}(\mathbf{v}) \, d^3v
    $$

    where $m_s$ is the ion mass of species $s$, $v = |\mathbf{v}|$ is the ion
    speed, $v_n > 0$ is the outward surface-normal velocity component at the
    wall, and $f_{s,\mathrm{emit}}(\mathbf{v})$ is the velocity distribution
    function of emitted ions.

    In plasma–surface interaction modeling, this flux is evaluated by convolving
    incident plasma conditions with energy-resolved surface emission yields and
    backscattering coefficients from binary-collision approximation databases.
    It is the mechanism-attributed form of ion_energy_flux_at_wall and the
    emitted counterpart to
    [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),
    which captures the incident kinetic flux. Charge-state-resolved
    contributions are tracked by ion_state_energy_flux_at_wall, and the electron
    analog is
    [electron_energy_flux_at_wall](name:electron_kinetic_energy_flux_at_wall_due_to_surface_emission).
  unit: W.m^-2

- name: krypton_density_at_limiter
  description: |-
    Krypton ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all krypton ionization states.
  documentation: |-
    Krypton density at a limiter is the local number density of krypton ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is the plasma side of the magnetic presheath or sheath
    entrance at the plasma–limiter contact, where open scrape-off-layer field
    lines terminate on the material boundary.

    Unless a single charge state is explicitly specified, the quantity
    represents the charge-state-summed total:

    $$
    n_\mathrm{Kr} = \sum_{q=1}^{36} n_{\mathrm{Kr}^{q+}}
    $$

    where $n_{\mathrm{Kr}^{q+}}$ is the number density of krypton ions in
    ionization state $q$, ranging from $q = 1$ (singly ionized) to $q = 36$
    (fully stripped). Neutral krypton atoms are excluded from this quantity.

    Krypton is a high-$Z$ noble gas ($Z = 36$) injected as a seeding impurity to
    enhance radiative dissipation in the scrape-off layer, redistributing heat
    load away from plasma-facing components. Its local density at the limiter
    characterizes krypton availability for charge exchange, ionization, and
    plasma–material interactions at the wall. Even modest krypton concentrations
    significantly elevate
    [effective_charge_at_limiter](name:effective_charge_at_limiter) due to its
    high nuclear charge.

    Within the [density_at_limiter](name:density_at_limiter) family, krypton
    density serves as a heavier-impurity counterpart to lighter noble-gas seeds
    such as [argon_density_at_limiter](name:argon_density_at_limiter), and
    contrasts with fuel-ion species such as
    [deuterium_density_at_limiter](name:deuterium_density_at_limiter). Under
    quasi-neutrality, the charge-weighted sum of all ion densities at the
    limiter equals
    [electron_density_at_limiter](name:electron_density_at_limiter).
  unit: m^-3

- name: lithium_density_at_limiter
  description: |-
    Local number density of lithium ions in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface, summed over all positive
    ionization states and excluding neutral lithium atoms.
  documentation: |-
    Lithium density at a limiter is the local number density of lithium ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or
    sheath entrance.

    $$
    n_{\mathrm{Li}}(\mathbf{r}_L)=\frac{dN_{\mathrm{Li}}}{dV}
    $$

    where $n_{\mathrm{Li}}$ is the lithium-ion number density in m$^{-3}$,
    $N_{\mathrm{Li}}$ is the counted number of lithium ions, $V$ is volume in
    m$^3$, and $\mathbf{r}_L$ is the evaluation position in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius in m, $\phi$ is
    toroidal angle in radians, and $Z$ is vertical height in m.

    The quantity is summed over all positive lithium ionization states and
    excludes neutral lithium atoms. It is the lithium-specific specialization of
    [density at a limiter](name:density_at_limiter) and differs from the broader
    ion density at a limiter, which does not select lithium.
  unit: m^-3

- name: neon_density_at_limiter
  description: |-
    Neon ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all neon ionization stages.
  documentation: |-
    Neon density at a limiter is the local number density of neon ions in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface. The
    evaluation point is the plasma side of the magnetic presheath or sheath
    entrance at the limiter contact, not the magnetic separatrix, consistent
    with the parent [density_at_limiter](name:density_at_limiter).

    Unless a charge-state-resolved quantity specifies a particular ionization
    stage, this density is summed over all positive neon charge states
    ($\mathrm{Ne}^{1+}$ through $\mathrm{Ne}^{10+}$):

    $$
    n_{\mathrm{Ne}} = \sum_{z=1}^{10} n_{\mathrm{Ne}^{z+}}
    $$

    where $n_{\mathrm{Ne}^{z+}}$ is the partial number density of neon ions in
    charge state $z$.

    Neon is introduced as a controlled radiative impurity for power exhaust and
    divertor detachment. At the limiter, the local neon density governs
    recycling fluxes, charge-exchange with neutral neon, and impurity-driven
    edge plasma cooling near the wall. Edge Langmuir probes and vacuum
    ultraviolet or extreme ultraviolet spectroscopy provide experimental access
    to this quantity.

    The neon density in the scrape-off layer at neon-seeded discharges spans
    roughly $10^{16}$–$10^{18}$ m$^{-3}$, falling toward the lower end at low
    seeding rates and rising with neon puff level. The corresponding quantity
    evaluated at the separatrix is
    [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary);
    [xenon_density_at_limiter](name:xenon_density_at_limiter) is the analogous
    quantity for xenon impurity injection.
  unit: m^-3

- name: neutral_energy_flux_at_wall_due_to_recombination
  description: |-
    Incident neutral energy flux per unit plasma-facing wall area carried by
    neutral particles associated with recombination at the surface, summed over
    incident-ion species, incident-ion charge states, recombination channels,
    neutral species, and internal states.
  documentation: |-
    Neutral energy flux at the wall due to recombination quantifies the rate at
    which recombination-associated energy carried by neutral particles is
    incident on a plasma-facing surface per unit area. It is the
    neutral-particle carrier of energy associated with recombination or
    neutralization processes at the boundary, not the outgoing neutral emission
    from the surface.

    The incident neutral recombination energy flux at wall location
    $\mathbf{x}_w$ is defined as the energy moment of the incident neutral
    particle-flux distribution:

    $$
    Q_{\mathrm{rec},n}^{\mathrm{inc}}(\mathbf{x}_w) = \sum_{i,\,\zeta,\,c,\,a,\,k}\int E_\mathrm{in}\,\frac{d\Gamma^{\mathrm{inc}}_{i,\zeta,c,a,k}}{dE_\mathrm{in}}(\mathbf{x}_w,E_\mathrm{in})\,dE_\mathrm{in}
    $$

    where $Q_{\mathrm{rec},n}^{\mathrm{inc}}$ is the incident neutral energy
    flux at the wall due to recombination, $\mathbf{x}_w$ is a wall-surface
    location, the subscript $n$ denotes the neutral-particle channel, the
    superscript $\mathrm{inc}$ denotes the incident wall-crossing direction, $i$
    identifies the incident-ion species, $\zeta$ the incident-ion charge state,
    $c$ the surface recombination or neutralization channel, $a$ the neutral
    species, $k$ the neutral internal state, $E_\mathrm{in}$ the energy carried
    by a neutral particle crossing the surface in the incident direction, and
    $d\Gamma^{\mathrm{inc}}_{i,\zeta,c,a,k}/dE_\mathrm{in}$ the corresponding
    incident neutral particle-flux distribution with respect to $E_\mathrm{in}$.
    For discrete incident-neutral energies, the integral is replaced by the
    corresponding sum.

    This quantity applies to neutral particles crossing the plasma-facing
    surface toward the material. It is aggregated over incident-ion species,
    incident-ion charge states, recombination or neutralization channels,
    neutral species, and neutral internal states; no neutral species, state,
    incident-ion species, or charge-state resolution remains. It excludes
    ion-carried energy flux, photon or radiation energy flux, outgoing neutral
    recombination products, and the subsequent partition of incident energy into
    wall heating, reflection, or re-emission.

    This quantity is the energy-weighted counterpart of [incident neutral
    particle flux at the wall due to
    recombination](name:incident_neutral_particle_flux_at_wall_due_to_recombination),
    which counts the same incident neutral population without weighting by
    $E_\mathrm{in}$. It is directionally distinct from [neutral particle flux at
    the wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination),
    which refers to outgoing neutral recombination products, and it is not the
    total [energy flux at the wall due to
    recombination](name:energy_flux_at_wall_due_to_recombination). [Ion energy
    flux at the wall due to
    recombination](name:ion_energy_flux_at_wall_due_to_recombination) describes
    the ion-associated channel rather than neutral-carried incident energy.

    Sign convention: Positive when neutral particles carrying
    recombination-associated energy cross the plasma-facing surface from the
    plasma-facing volume toward the material surface.
  unit: W.m^-2

- name: neutral_internal_state_energy_flux_at_wall
  description: |-
    Incident kinetic-energy flux density carried by neutral particles in a
    specified internal quantum state as they arrive at a plasma-facing wall.
  documentation: |-
    This quantity is the incident kinetic-energy flux density carried by neutral
    atoms or molecules in a specified internal quantum state as they cross onto
    a plasma-facing wall. It includes only translational kinetic energy and only
    particles moving from the plasma toward the wall.

    $$
    q_{\mathrm{kin},s}^{\mathrm{inc}} = \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w<0} \frac{1}{2}m_s v^2\left(-\mathbf{v}\cdot\hat{\mathbf{n}}_w\right) f_s(\mathbf{v})\,d^3\mathbf{v}
    $$

    Here $q_{\mathrm{kin},s}^{\mathrm{inc}}$ is the incident kinetic-energy flux
    density, $s$ identifies the internal quantum state, $m_s$ is the particle
    mass, $\mathbf{v}$ is velocity relative to the wall, $\hat{\mathbf{n}}_w$ is
    the unit normal directed from the wall toward the plasma, and
    $f_s(\mathbf{v})$ is the velocity distribution of that state. Unlike
    [neutral_internal_state_particle_flux_at_wall](name:neutral_internal_state_particle_flux_at_wall),
    this quantity weights arrivals by translational kinetic energy;
    neutral_energy_flux_at_wall aggregates the corresponding kinetic-energy flux
    over internal states. Internal excitation, potential, and rest-mass energies
    are excluded.
  unit: W.m^-2

- name: neutral_internal_state_particle_flux_at_wall_due_to_recombination
  description: |-
    Outgoing neutral internal-state particle number flux density at a
    plasma-facing wall due to recombination, resolved by neutral product species
    and internal quantum state.
  documentation: |-
    Outgoing neutral internal-state particle number flux density at a
    plasma-facing wall due to recombination is the surface flux density of
    neutral atoms or molecules in a specified internal quantum state that are
    produced by recombination at the wall and cross the wall surface away from
    the wall. It is resolved by neutral product species and by the internal
    quantum state of that product.

    For neutral product species $n$ in internal state $\alpha$, with
    $\hat{\mathbf n}_w$ the unit normal directed from the wall material into the
    adjacent plasma, the outgoing recombination contribution is defined by

    $$
    \Gamma^{\mathrm{rec,out}}_{n,\alpha} = \int_{\mathbf v \cdot \hat{\mathbf n}_w > 0} (\mathbf v \cdot \hat{\mathbf n}_w)\, f^{\mathrm{rec}}_{n,\alpha}(\mathbf v)\, d^3\mathbf v
    $$

    where $\mathbf v$ is neutral-particle velocity and
    $f^{\mathrm{rec}}_{n,\alpha}$ is the velocity-space distribution function at
    the wall for neutral recombination products of species $n$ in internal state
    $\alpha$, normalized so that its velocity integral gives the corresponding
    local neutral-product number density.

    This quantity includes only the emitted, outward wall-normal component of
    neutral recombination products in the specified internal state. Aggregating
    over internal states for the same neutral product species gives the [neutral
    particle flux at wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination); the
    broader internal-state-resolved recombination-flux family is internal state
    particle flux at wall due to recombination. The distinct inward wall-normal
    counterpart is [incident neutral internal-state particle flux at wall due to
    recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination)
    and is not included here.

    Sign convention: Positive when neutral recombination products cross the wall
    surface in the direction of the wall normal from the wall material into the
    adjacent plasma.
  unit: m^-2.s^-1

- name: incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination
  description: |-
    Number flux density of neutral recombination products in a specified
    internal quantum state arriving at a plasma-facing wall surface.
  documentation: |-
    Incident internal-state neutral particle flux due to recombination is the
    density of neutral atoms or molecules in a specified internal quantum state
    that arrive at a plasma-facing wall surface from the plasma-facing side. It
    is a particle-count flux, not an energy flux.

    The incident flux density is defined by

    $$
    \Gamma_{\mathrm{inc}}^{(s)} = \frac{\mathrm{d}N_{\mathrm{inc}}^{(s)}}{\mathrm{d}A\,\mathrm{d}t}
    $$

    where $N_{\mathrm{inc}}^{(s)}$ is the number of incident neutral
    recombination products in internal state $s$, $A$ is wall surface area, and
    $t$ is time.

    This quantity selects the incident direction and the specified internal
    state from the state-resolved wall particle flux represented by [neutral
    internal-state particle flux at wall due to
    recombination](name:neutral_internal_state_particle_flux_at_wall_due_to_recombination).
    It excludes particles in other internal states and differs from the
    state-summed [incident neutral particle flux at wall due to
    recombination](name:incident_neutral_particle_flux_at_wall_due_to_recombination).
  unit: m^-2.s^-1

- name: neutral_particle_flux_at_wall_due_to_pumping
  description: |-
    Rate at which particles of a specified neutral species are removed from the
    plasma region by wall pumping, giving global neutral-particle exhaust
    throughput.
  documentation: |-
    The rate at which particles of a specified neutral species are removed from
    the plasma region by wall pumping is the global scalar representation of the
    wall particle-removal flux. It describes pumped neutral-particle exhaust at
    material surfaces due only to pumping.

    The pumped neutral-particle flux is defined as the removal term in the
    neutral-particle inventory balance:

    $$
    \Phi_{n,\mathrm{pump}} = -\left.\frac{dN_n}{dt}\right|_{\mathrm{pump}}
    $$

    where $\Phi_{n,\mathrm{pump}}$ is the neutral particle flux at the wall due
    to pumping, $N_n$ is the total particle inventory of the specified neutral
    species in the plasma region, and $t$ is time.

    This quantity applies to one specified neutral species and is aggregated
    globally over the wall pumping interface. It is not summed over different
    neutral species and does not include ionized-particle exhaust, recycling or
    sputtering sources, neutralization sources, or particle losses not
    attributed to wall pumping.

    This flux is the neutral-species member of the broader [particle flux at
    wall due to pumping](name:particle_rate_at_wall_due_to_pumping) family and
    is distinct from the [electron-equivalent particle flux at wall due to
    pumping](name:electron_particle_flux_at_wall_due_to_pumping). It is the
    removal rate itself, not a pumping-speed or first-order loss coefficient; if
    a model represents pumping by a coefficient $S_{n,\mathrm{pump}}$ acting on
    $N_n$, then $\Phi_{n,\mathrm{pump}}$ is related to that model by
    $\Phi_{n,\mathrm{pump}} = S_{n,\mathrm{pump}} N_n$, where
    $S_{n,\mathrm{pump}}$ is the neutral-species pumping coefficient.
  unit: s^-1

- name: neutral_particle_flux_at_wall_due_to_recombination
  description: |-
    Outgoing neutral-particle number flux density from recombination at a
    plasma-facing wall, summed over emitted neutral species and internal states.
  documentation: |-
    Recombination-associated neutral particle flux at a plasma-facing wall is
    the rate per unit wall area at which neutral products leave the surface and
    enter the adjacent plasma. It counts particles rather than the energy or
    momentum they carry.

    The flux is defined by

    $$
    \Gamma_{\mathrm{rec}}^{\mathrm{out}} = \frac{dN_{\mathrm{rec}}^{\mathrm{out}}}{dA\,dt}
    $$

    where $\Gamma_{\mathrm{rec}}^{\mathrm{out}}$ is the outgoing
    recombination-associated neutral particle-number flux density,
    $N_{\mathrm{rec}}^{\mathrm{out}}$ is the corresponding number of emitted
    neutral particles, $A$ is plasma-facing wall area, and $t$ is time.

    The quantity applies to neutral products generated when incident plasma ions
    recombine or neutralize at the wall. It is summed over contributing
    incident-ion species and charge states, recombination channels, emitted
    neutral species, and emitted internal states. It excludes energy weighting
    and therefore differs from
    [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).

    This neutral emitted-particle quantity is the neutral-product specialization
    of particle_flux_at_wall_due_to_recombination. It is distinct from
    [incident_neutral_particle_flux_at_wall_due_to_recombination](name:incident_neutral_particle_flux_at_wall_due_to_recombination),
    which counts recombination-associated neutral particles arriving at the
    wall, and from
    [neutral_internal_state_particle_flux_at_wall_due_to_recombination](name:neutral_internal_state_particle_flux_at_wall_due_to_recombination),
    which resolves the emitted flux by internal state.

    Sign convention: Positive when neutral particles travel from the
    plasma-facing wall into the adjacent plasma.
  unit: m^-2.s^-1

- name: incident_neutral_particle_flux_at_wall_due_to_recombination
  description: |-
    Incident number flux density of neutral recombination products arriving at a
    plasma-facing wall, summed over neutral species and internal states.
  documentation: |-
    This quantity is the incoming neutral-particle count flux at a wall
    attributable to recombination, with neutral product species and internal
    states aggregated. It selects particles arriving at the surface, rather than
    neutral particles emitted from it.

    The incident flux density is defined from the recombination-attributed
    neutral distribution by

    $$
    \Gamma_{\mathrm{inc}}^{\mathrm{rec}}(\mathbf{x}_w)=\int_{\mathbf{v}\cdot\hat{\mathbf{n}}<0} \left|\mathbf{v}\cdot\hat{\mathbf{n}}\right| f_{\mathrm{n,rec}}(\mathbf{x}_w,\mathbf{v})\,d^3\mathbf{v}
    $$

    where $\mathbf{x}_w$ is the wall position, $\hat{\mathbf{n}}$ is the outward
    wall normal, $\mathbf{v}$ is neutral-particle velocity, and
    $f_{\mathrm{n,rec}}$ is the recombination-attributed neutral distribution
    summed over species and internal states.

    This incident quantity is distinct from the outgoing emission described by
    [neutral particle flux at the wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination). A
    state-resolved counterpart, [incident neutral internal-state particle flux
    at the wall due to
    recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination),
    retains the internal-state distinction.
  unit: m^-2.s^-1

- name: nitrogen_density_at_limiter
  description: |-
    Nitrogen ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all ionization states and
    excluding neutral nitrogen.
  documentation: |-
    Nitrogen density at a limiter is the local number density of nitrogen ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter
    surface. The evaluation point is on the plasma side of the magnetic
    presheath or sheath entrance, where the limiter terminates open field lines
    in the scrape-off layer.

    The charge-state-summed density is defined from the velocity distribution
    functions by:

    $$
    n_{\mathrm{N}} = \sum_{q=1}^{q_{\max}} \int f_{\mathrm{N}^{q+}}(\mathbf{v})\,d^3v
    $$

    where $q$ is the positive nitrogen ion charge state, $q_{\max}$ is the
    highest included ionization state, and $f_{\mathrm{N}^{q+}}(\mathbf{v})$ is
    the velocity distribution function of that ion state at the evaluation
    point.

    This is the nitrogen-specific component of
    [density_at_limiter](name:density_at_limiter). It excludes neutral nitrogen
    and is distinct from
    [neon_density_at_limiter](name:neon_density_at_limiter), which applies the
    same boundary definition to neon ions.
  unit: m^-3

- name: oxygen_density_at_limiter
  description: |-
    Oxygen density at a limiter is the local number density of oxygen ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface,
    summed over all oxygen ionization states from O+ through O8+ and excluding
    neutral oxygen atoms.
  documentation: |-
    Oxygen density at a limiter is the local number density of oxygen ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or
    sheath entrance at the limiter. It is summed over all oxygen ionization
    states from O$^+$ through O$^{8+}$, and excludes neutral oxygen atoms.

    For oxygen ion charge states from singly ionized to fully stripped, the
    charge-state-summed limiter density is defined as:

    $$
    n_{\mathrm{O},\mathrm{lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}
    $$

    where $n_{\mathrm{O},\mathrm{lim}}$ is the oxygen ion density at the
    limiter, $n_{\mathrm{O}^{q+},\mathrm{lim}}$ is the local density of oxygen
    ions with charge state $q$, and the upper limit is the nuclear charge of
    oxygen.

    This quantity is species-specific and charge-state-summed; it is not the
    neutral oxygen density,
    [electron_density_at_limiter](name:electron_density_at_limiter), or
    [total_ion_density_at_limiter](name:total_ion_density_at_limiter). At the
    sheath entrance, oxygen charge-state densities contribute to quasineutrality
    through their charge-weighted sum and to the local effective charge. The
    analogous oxygen density at divertor target surfaces is
    [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target).
  unit: m^-3

- name: particle_flux_at_wall_due_to_surface_emission
  description: |-
    Particle number flux emanating from a plasma-facing wall surface through
    surface-emission processes and directed from the wall material into the
    plasma.
  documentation: |-
    Particle number flux emanating from a plasma-facing wall surface through
    surface-emission processes is the surface-normal rate density of particles
    generated by the wall material and carried into the plasma.

    The emitted particle flux density is defined by:

    $$
    F_N^{\mathrm{emit}} = \frac{\mathrm{d}N_{\mathrm{emit}}}{\mathrm{d}A\,\mathrm{d}t}
    $$

    where $F_N^{\mathrm{emit}}$ is the emitted particle-number flux density,
    $N_{\mathrm{emit}}$ is the number of particles emitted, $A$ is emitting wall
    area, and $t$ is time.

    This quantity applies to emitted electrons, selected ion species, and
    neutral particles. For an ion-species quantity, the particle number is
    summed over all ionization states; the parent does not require summation
    across distinct particle species. It is a local flux density per wall area,
    not a total emission rate integrated over the wall, and excludes particles
    incident on the wall and the resulting net wall flux.

    This is the particle-number specialization of
    [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission)
    and is the common abstraction for
    [electron_particle_flux_at_wall_due_to_surface_emission](name:electron_particle_flux_at_wall_due_to_surface_emission),
    [ion_species_particle_flux_at_wall_due_to_surface_emission](name:ion_species_particle_flux_at_wall_due_to_surface_emission),
    and
    [neutral_particle_flux_at_wall_due_to_surface_emission](name:neutral_particle_flux_at_wall_due_to_surface_emission).
    Unlike
    [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission),
    it counts emitted particles rather than the energy they carry.

    Sign convention: Positive when the emitted particle flux is directed from
    the wall material into the plasma.
  unit: m^-2.s^-1

- name: ion_species_particle_flux_at_wall_due_to_surface_emission
  description: |-
    Number flux density of ions from a selected species emitted by a
    plasma-facing wall through surface-emission processes, summed over all
    ionization states and directed into the plasma.
  documentation: |-
    This quantity is the local rate at which ions of one selected species leave
    a plasma-facing wall through surface-emission processes, expressed per unit
    wall area. It represents the emitted component of particle exchange rather
    than the total or net ion exchange at the wall.

    The local emitted particle flux density is defined by

    $$
    \Gamma_{i,\mathrm{em}} = \frac{dN_{i,\mathrm{em}}}{dA\,dt}
    $$

    where $\Gamma_{i,\mathrm{em}}$ is the emitted ion particle flux density,
    $N_{i,\mathrm{em}}$ is the number of emitted ions of the selected species,
    $A$ is wall surface area, $t$ is time, the subscript $i$ identifies the
    selected ion species, and the subscript $\mathrm{em}$ identifies the
    surface-emission contribution.

    The quantity applies locally at a plasma-facing wall and is summed over all
    positive ionization states of the selected species. It excludes neutral
    particles and has no spatial maximum, surface integral, or spatial average
    over the wall.

    Unlike the [ion charge-state particle flux at the
    wall](name:ion_charge_state_particle_flux_at_wall), which describes ions
    incident on the wall in a specified charge state, this quantity describes
    ions leaving the wall and is not the net difference between incident and
    emitted flux. The corresponding emitted-electron quantity, [electron
    particle flux at the wall due to surface
    emission](name:electron_particle_flux_at_wall_due_to_surface_emission),
    applies the same wall-local process distinction to electrons.
  unit: m^-2.s^-1

- name: neutral_particle_flux_at_wall_due_to_surface_emission
  description: |-
    Neutral particle number flux emanating from a plasma-facing wall surface
    through surface-emission processes and directed from the wall material into
    the plasma.
  documentation: |-
    Neutral particle number flux emanating from a plasma-facing wall surface
    through surface-emission processes is the surface-normal rate density of
    neutral particles generated by the wall material and carried into the
    plasma.

    The emitted neutral particle flux density is defined by:

    $$
    F_N^{\mathrm{emit}} = \frac{\mathrm{d}N_{\mathrm{emit}}}{\mathrm{d}A\,\mathrm{d}t}
    $$

    where $F_N^{\mathrm{emit}}$ is the emitted neutral particle-number flux
    density, $N_{\mathrm{emit}}$ is the number of emitted neutral particles, $A$
    is the emitting wall area, and $t$ is time.

    This quantity applies to the emitted neutral-particle population at the wall
    and is aggregated over the neutral particles represented by that population,
    without combining them with emitted electrons or ions. It is a local flux
    density per wall area, not a total emission rate integrated over the wall,
    and excludes neutral particles incident on the wall and the resulting net
    wall flux.

    This is the neutral-particle specialization of
    [particle_flux_at_wall_due_to_surface_emission](name:particle_flux_at_wall_due_to_surface_emission).
    It counts emitted particles rather than their carried energy, unlike
    [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission),
    and complements the emitted electron quantity
    [electron_particle_flux_at_wall_due_to_surface_emission](name:electron_particle_flux_at_wall_due_to_surface_emission).
    It is distinct from
    [incident_neutral_particle_flux_at_wall](name:incident_neutral_particle_flux_at_wall),
    which describes neutral particles arriving at the wall.

    Sign convention: Positive when the emitted neutral particle flux is directed
    from the wall material into the plasma.
  unit: m^-2.s^-1

- name: plasma_power_at_wall_due_to_recombination
  description: |-
    Power deposited on plasma-facing wall surfaces when incident plasma ions
    recombine at the material boundary, representing the ion-channel
    contribution to total wall recombination power.
  documentation: |-
    Plasma-ion recombination power at the wall is the rate at which
    recombination energy from incident plasma ions is deposited in plasma-facing
    wall material. It is the ion-channel contribution to the total wall heat
    load from recombination.

    The contribution is defined by

    $$
    P_{\mathrm{rec,wall}}^{\mathrm{plasma}} = \sum_s \int_A \Gamma_s^{\mathrm{ion}} E_{\mathrm{rec},s}\,\mathrm{d}A
    $$

    where $s$ indexes the contributing plasma-ion species and charge states,
    $\Gamma_s^{\mathrm{ion}}$ is the incident particle flux,
    $E_{\mathrm{rec},s}$ is the recombination energy deposited per event, and
    $A$ is the total plasma-facing wall area.

    This quantity excludes surface recombination of incident neutral particles
    into molecules, represented by neutral recombination power at the wall.
    Together, the two channels form total recombination power at the wall, which
    is distinct from volumetric [power due to
    recombination](name:power_due_to_recombination).
  unit: W

- name: power_at_wall_due_to_ohmic_dissipation
  description: |-
    Resistive Joule-heating power deposited in conducting wall structures by
    induced or halo currents flowing through them.
  documentation: |-
    This quantity is the rate of irreversible electrical-energy conversion into
    heat within conducting wall and vessel structures, caused by currents
    flowing through those structures.

    For the conducting wall domain, the ohmic power is defined by

    $$
    P_{\rm wall}^{\rm ohm} = \int_{V_{\rm wall}} \eta\,\lvert\mathbf{J}\rvert^2\,dV
    $$

    where $P_{\rm wall}^{\rm ohm}$ is the wall ohmic power, $V_{\rm wall}$ is
    the conducting wall volume, $\eta$ is the electrical resistivity of the wall
    material, and $\mathbf{J}$ is the current-density vector.

    The quantity aggregates resistive heating over the conducting wall and
    vessel structures as a single deposited power. It includes Joule heating
    from induced currents and halo currents, but excludes ohmic dissipation in
    the plasma or other conducting domains and excludes wall power deposited
    through thermal conduction, radiation, or particle transport without
    resistive current dissipation.

    This is the wall-locus specialization of [total ohmic-dissipation
    power](name:total_power_due_to_ohmic_dissipation), which aggregates
    irreversible electrical-energy conversion over the complete applicable
    conducting domain rather than only the wall structures. The resistivity
    governing the integrand is the [electrical resistivity of wall
    material](name:resistivity_of_wall_material).
  unit: W

- name: radial_outline_of_limiter_tile
  description: |-
    Major-radius coordinate R locating each point on the boundary outline of a
    plasma-facing limiter tile in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial outline coordinate is the major-radius value $R$ of each point on
    the geometric boundary outline of a plasma-facing limiter tile. It describes
    tile geometry rather than a plasma field or a flux-surface coordinate.

    In a right-handed cylindrical $(R,\phi,Z)$ frame, the major-radius
    coordinate is defined from Cartesian coordinates by

    $$
    R = \sqrt{x^2+y^2}
    $$

    where $R$ is the perpendicular distance from the toroidal symmetry axis, and
    $x$ and $y$ are Cartesian coordinate values along the $\hat{x}$ and
    $\hat{y}$ axes of the right-handed $(\hat{x},\hat{y},\hat{z})$ basis.

    The quantity is evaluated pointwise for every contour point of the
    limiter-tile outline. It is not an average, maximum, area, or integrated
    boundary measure; for a closed contour, the first point is not repeated at
    the end.

    Together with the [vertical outline of the limiter
    tile](name:vertical_outline_of_limiter_tile), it supplies the complementary
    radial and vertical coordinates that locate the outline in a poloidal
    cross-section. The related [radial coordinate](name:radial_coordinate)
    expresses the same geometric coordinate concept without specifying the
    limiter-tile outline locus.
  unit: m

- name: radial_outline_of_wall
  description: |-
    Major-radius coordinate of every point on a wall boundary outline, measured
    from the machine symmetry axis in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    The radial outline coordinate is the major-radius position of each point on
    the boundary contour designated as the wall. It locates the contour relative
    to the machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical coordinate.

    For a contour point identified by parameter $s$, the coordinate is defined
    by

    $$
    R(s)=\mathbf{r}(s)\cdot\hat{\mathbf{R}}(s)
    $$

    where $\mathbf{r}(s)$ is the position vector of the contour point measured
    from the machine symmetry axis, $\hat{\mathbf{R}}(s)$ is the local outward
    radial unit vector, and $s$ identifies the point along the outline.

    The quantity applies point-by-point to the specified wall contour and
    carries no contour averaging, integration, maximum, or other spatial
    aggregation. The generic wall locus does not by itself distinguish a first
    wall, vacuum-vessel wall, or limiter surface; that physical boundary
    identity is determined by the applicable wall definition. It is a radial
    coordinate, not a vertical coordinate, toroidal coordinate, surface-normal
    coordinate, or wall-normal distance.

    Its meaning is analogous to [radial outline of a limiter
    tile](name:radial_outline_of_limiter_tile), but the evaluated boundary
    differs; [radial outline of a coil conductor
    element](name:radial_outline_of_coil_conductor_element) likewise applies the
    same radial-coordinate concept to a conductor contour rather than a wall
    contour.
  unit: m

- name: radial_total_current_density_at_wall
  description: |-
    Radial (R-direction) component of the total electric current-density vector
    at a plasma-facing wall in the right-handed cylindrical (R, φ, Z) frame,
    where R is major radius and Z is vertical height. It is signed positive
    toward increasing R.
  documentation: |-
    Radial (R-direction) component of the total electric current-density vector
    at a plasma-facing wall is the projection of the local total electric
    current-density vector onto the $\hat{R}$ basis direction of the
    right-handed cylindrical $(R,\phi,Z)$ frame. Here $R$ is major radius
    measured from the toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$
    is vertical height.

    The defining projection at a wall point $\mathbf{x}_w$ is:

    $$
    j_{R,\mathrm{tot}}^{\mathrm{wall}}(\mathbf{x}_w) = \mathbf{j}_{\mathrm{tot}}(\mathbf{x}_w) \cdot \hat{\mathbf{R}}(\mathbf{x}_w)
    $$

    where $j_{R,\mathrm{tot}}^{\mathrm{wall}}$ denotes this scalar quantity,
    $\mathbf{j}_{\mathrm{tot}}$ is the total
    [current_density](name:current_density), $\hat{\mathbf{R}}$ is the local
    unit vector toward increasing $R$, and $\mathbf{x}_w$ lies on the
    plasma-facing material wall.

    Total means all current-carrying contributions included in the physical
    current-density vector, such as inductive, neoclassical, wave-driven,
    kinetic, conductive, charged-particle, and sheath-mediated currents. This
    quantity is the wall-evaluated radial projection of the total vector, not a
    process-resolved contribution such as
    [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction).
    A tile current such as
    [current_of_divertor_tile](name:current_of_divertor_tile) is a surface
    integral of the current-density component normal to that tile; it equals an
    area integral of this radial component only where the tile normal is
    parallel to $\hat{R}$.

    Sign convention: Positive when $\mathbf{j}_{\mathrm{tot}}$ at the wall
    points in the direction of increasing major radius $R$.
  unit: A.m^-2

- name: surface_emissivity
  description: |-
    Dimensionless ratio of thermal radiation emitted by a surface to blackbody
    radiation at the same surface temperature, with the stated spectral and
    angular averaging.
  documentation: |-
    Surface emissivity is the effectiveness of a material surface in emitting
    thermal electromagnetic radiation relative to an ideal blackbody at the same
    temperature. It is a material property of the emitting surface and is
    distinct from the emitted energy flux described by [energy flux due to
    surface emission](name:energy_flux_at_wall_due_to_surface_emission).

    The effective emissivity is defined by

    $$
    \varepsilon = \frac{M_{\mathrm{emit}}(T_s)}{M_{\mathrm{bb}}(T_s)}
    $$

    where $M_{\mathrm{emit}}$ is the surface thermal radiative exitance,
    $M_{\mathrm{bb}}$ is the blackbody exitance, and $T_s$ is the surface
    temperature. The ratio applies to the specified spectral band and angular
    averaging; it is not a wavelength- and direction-resolved emissivity.
    Incident radiation and geometric surface area, such as optical-element area,
    are excluded.
  unit: '1'

- name: surface_temperature
  description: |-
    Surface temperature is the thermodynamic temperature of the exposed material
    boundary of a plasma-facing component at a specified surface point. It
    refers to the surface material state, not to an area aggregate or regional
    extremum.
  documentation: |-
    Surface temperature is the thermodynamic temperature of the material at the
    exposed boundary of a plasma-facing component. It is a local scalar assigned
    to a specified material surface point and time, representing the state of
    the surface material rather than the temperature of the adjacent plasma,
    sheath, neutral gas, or radiation field.

    For an extended exposed surface, the unqualified quantity denotes the local
    point value at each surface point, not an area average, integral,
    percentile, or extremum. Region-level aggregates require distinct standard
    names; the maximum over a specified exposed surface region is
    [maximum_surface_temperature](name:maximum_surface_temperature).
    [temperature_at_wall](name:temperature_at_wall) is the corresponding
    boundary-locus temperature when the wall is the defining locus.
  unit: K

- name: maximum_surface_temperature
  description: |-
    Peak apparent temperature of the exposed plasma-facing surface over all
    valid points within a defined infrared-camera region of interest.
  documentation: |-
    This quantity is the largest apparent temperature assigned to the exposed
    material surface of a plasma-facing component within a specified
    infrared-camera region of interest. It is an extremum of the local [surface
    temperature](name:surface_temperature), not a local value, area average, or
    heat-flux measure.

    $$
    T_{\mathrm{max,ROI}} = \max_{\mathbf{x} \in V_{\mathrm{ROI}}} T_s(\mathbf{x})
    $$

    where $T_s(\mathbf{x})$ is the surface temperature at surface position
    $\mathbf{x}$, and $V_{\mathrm{ROI}}$ is the set of valid surface positions
    in the defined region of interest. Points excluded from the valid set do not
    contribute to the maximum.
  unit: K

- name: thermal_radiative_power_of_divertor
  description: |-
    Thermal radiation emitted by all divertor target surfaces, with each surface
    contribution weighted by its emissivity and summed over the divertor.
  documentation: |-
    This quantity is the total thermal radiative power emitted by the surfaces
    of all divertor targets. It represents surface emission governed by the
    local surface temperature and emissivity.

    $$
    P_{\mathrm{bb}} = \sum_{i \in \mathcal{D}} \int_{A_i} \epsilon_i\,\sigma_{\mathrm{SB}}\,T_i^4\,\mathrm{d}A
    $$

    where $P_{\mathrm{bb}}$ is the emitted thermal radiative power,
    $\mathcal{D}$ is the set of divertor target surfaces, $A_i$ is the surface
    area of target $i$, $\epsilon_i$ is its local thermal emissivity,
    $\sigma_{\mathrm{SB}}$ is the Stefan–Boltzmann constant, $T_i$ is its local
    absolute surface temperature, and $\mathrm{d}A$ is a surface-area element.

    The quantity is aggregated over every divertor target surface and includes
    emissivity effects. It describes radiation emitted by the targets, not
    plasma power incident on them or radiation retained after reflection.

    It is distinct from [absorbed radiated power of the
    divertor](name:absorbed_radiated_power_of_divertor), which is the net
    radiative power deposited on the targets after accounting for incident and
    reflected radiation, and from [total incident power of the
    divertor](name:total_incident_power_of_divertor), which describes incoming
    plasma power rather than surface emission.
  unit: W

- name: total_incident_power_at_wall
  description: |-
    Total plasma power arriving at all plasma-facing wall surfaces, summed over
    conducted, convected, radiative, and other incident energy channels.
  documentation: |-
    This quantity is the total energy delivered from the plasma to plasma-facing
    wall and divertor surfaces by all incident channels. It represents the
    area-integrated power arriving at those surfaces before reflection or
    re-emission.

    The total incident power is defined by integrating the incident energy-flux
    density over the complete plasma-facing area:

    $$
    P_{\mathrm{inc}} = \int_{A_{\mathrm{wall}}} q_{\mathrm{inc}}(\mathbf r)\,\mathrm{d}A
    $$

    where $P_{\mathrm{inc}}$ is the total incident power, $A_{\mathrm{wall}}$ is
    the union of the relevant plasma-facing surfaces, $q_{\mathrm{inc}}(\mathbf
    r)$ is the incident power per unit area at surface position $\mathbf r$, and
    $\mathrm{d}A$ is a differential surface area. The integrand is the
    area-density counterpart energy flux at wall. The total includes all
    incident energy channels and excludes power emitted from the wall toward the
    plasma or vacuum.
  unit: W

- name: total_ion_density_at_limiter
  description: |-
    Charge-state-summed number density of all ion species in the boundary plasma
    immediately on the plasma-facing side of a limiter surface.
  documentation: |-
    Total ion density at a limiter is the local number density of all charged
    ion species and ionization states at the plasma-side evaluation point
    adjacent to the limiter. It is the charge-state-summed component of
    ion_density_at_limiter.

    The defining aggregation is

    $$
    n_{i,\mathrm{tot}} = \sum_s \sum_{Z\geq 1} n_{s,Z}
    $$

    where $n_{s,Z}$ is the number density of ion species $s$ in charge state
    $Z$, and the sums include every ion species and positive charge state
    present at the evaluation point.

    Neutral atoms and molecules are excluded, as is electron density. The
    limiter-local aggregation is distinct from the corresponding total quantity
    at the plasma boundary,
    [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary),
    because the evaluation locus is specifically the plasma-facing side of a
    limiter surface.
  unit: m^-3

- name: total_neutral_particle_rate_at_wall_due_to_surface_emission
  description: |-
    Wall-integrated neutral-particle number rate emitted into the plasma by
    surface-emission processes, with cold, thermal, and fast energy categories
    represented separately.
  documentation: |-
    This quantity is the total number rate of neutral particles emitted from
    plasma-facing wall surfaces into the adjacent plasma-facing region by
    surface-emission processes. It represents the contribution from the selected
    neutral population and energy category rather than a local surface flux.

    The surface-integrated rate is defined by

    $$
    \dot{N}_{\mathrm{n,SE}}^{(c)} = \int_{A_{\mathrm{wall}}} \Gamma_{\mathrm{n,SE}}^{(c)}(\mathbf{x})\,\mathrm{d}A
    $$

    where $\dot{N}_{\mathrm{n,SE}}^{(c)}$ is the emitted neutral-particle number
    rate, $\Gamma_{\mathrm{n,SE}}^{(c)}(\mathbf{x})$ is the local
    neutral-particle flux density due to surface emission at wall position
    $\mathbf{x}$, $A_{\mathrm{wall}}$ is the emitting wall surface,
    $\mathrm{d}A$ is its differential area element, and $c$ identifies the cold,
    thermal, or fast neutral energy category.

    The aggregation is over the contributing wall surface; “total” does not
    imply summation over the cold, thermal, and fast categories, which remain
    distinct contributions. The quantity describes particles leaving the wall
    and excludes neutral particles incident on the wall, net
    incoming-minus-outgoing flux, and volumetric plasma sources.

    It is the area integral of [neutral particle flux density due to surface
    emission](name:neutral_particle_flux_at_wall_due_to_surface_emission),
    whereas [incident neutral particle flux at the
    wall](name:incident_neutral_particle_flux_at_wall) describes particles
    arriving at the wall and is not included in this outgoing rate. It is also
    distinct from the per-area recombination contribution represented by
    [neutral particle flux at the wall due to
    recombination](name:neutral_particle_flux_at_wall_due_to_recombination).
  unit: s^-1

- name: total_particle_source_rate_of_divertor_due_to_recycling
  description: |-
    Total equivalent-electron rate of neutral and ion particles re-emitted from
    all divertor surfaces into the plasma by recycling.
  documentation: |-
    This quantity is the aggregate particle source produced when neutral and ion
    particles are re-emitted from divertor surfaces into the plasma by
    recycling.

    The defining rate is

    $$
    \Gamma_{\mathrm{rec}} = \frac{dN_{\mathrm{eq}}}{dt}
    $$

    where $\Gamma_{\mathrm{rec}}$ is the total recycled particle source rate,
    $N_{\mathrm{eq}}$ is the cumulative equivalent-electron count of re-emitted
    particles, and $t$ is time.

    The quantity covers all divertor surfaces and combines the neutral and ion
    contributions using equivalent-electron counting. It is a total source rate
    rather than a local surface flux density, and it excludes particle sources
    produced by processes other than recycling or originating outside the
    divertor.

    This is a gross re-emission rate and does not by itself represent the net
    particle balance after incident-particle losses. Unlike [power of the
    divertor due to recombination](name:power_of_divertor_due_to_recombination),
    it counts recycled particles without weighting them by deposited energy.
  unit: s^-1

- name: total_thermal_power_density_due_to_conductive_losses
  description: |-
    Volumetric rate of thermal plasma energy removal by conductive transport
    toward plasma-facing surfaces.
  documentation: |-
    The quantity is the local volumetric rate at which total thermal plasma
    energy is removed by conductive transport toward plasma-facing surfaces. It
    represents an aggregate thermal-population loss rather than a
    species-resolved contribution, and is distinct from the corresponding
    surface energy flux.

    $$
    P_{\mathrm{cond,loss}} = \nabla \cdot \mathbf{q}_{\mathrm{cond}}
    $$

    where $P_{\mathrm{cond,loss}}$ is the conductive-loss power density and
    $\mathbf{q}_{\mathrm{cond}}$ is the total thermal conductive energy-flux
    vector. The divergence is taken in physical space; conductive transport is
    predominantly parallel to magnetic field lines.

    Positive values denote net conductive energy leaving the local plasma
    volume. Integrating this density over a volume gives the conductive power
    removed from that volume and, when bounded by plasma-facing surfaces,
    relates to [power due to conduction](name:power_due_to_conduction).
    Radiative, convective, and particle-loss channels are excluded.
  unit: W.m^-3

- name: total_xenon_fraction
  description: |-
    Dimensionless abundance ratio of xenon ion number density, summed over
    ionization states, to electron number density in the same plasma domain.
  documentation: |-
    The xenon fraction measures the abundance of charged xenon relative to the
    electron population in a plasma domain. It is a dimensionless
    part-to-reference ratio, not a xenon density or an effective charge.

    The fraction is defined by:

    $$
    f_{\mathrm{Xe}} = \frac{n_{\mathrm{Xe}}}{n_e}
    $$

    where $f_{\mathrm{Xe}}$ is the xenon fraction, $n_{\mathrm{Xe}}$ is the
    total xenon ion number density summed over all positive ionization states,
    and $n_e$ is the electron number density.

    The numerator and denominator refer to the same plasma domain and use the
    same spatial aggregation convention. Neutral xenon atoms are excluded, and
    the quantity is not restricted to an individual xenon ionization state. The
    specific volume-averaged realization applies the averaging operation to both
    densities before forming the ratio, as defined by
    [volume_averaged_total_xenon_fraction](name:volume_averaged_total_xenon_fraction).

    The underlying xenon density is the charge-state-summed quantity represented
    by [xenon_density](name:xenon_density); the fraction differs from it by
    normalization to the electron density. The corresponding volume-averaged
    xenon density is
    [volume_averaged_xenon_density](name:volume_averaged_xenon_density), which
    supplies the numerator for the volume-averaged realization.
  unit: '1'

- name: tritium_density_at_limiter
  description: |-
    Local particle number density of tritium ions evaluated in the boundary
    plasma immediately adjacent to a plasma-facing limiter surface, on the
    plasma side of the magnetic presheath or sheath entrance.
  documentation: |-
    Tritium density at a limiter is the local number density of tritium ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or
    sheath entrance, not inside limiter material or in neutral gas at the
    surface. The quantity excludes neutral tritium atoms.

    Because tritium is hydrogenic, its charge-state-summed ion density is the
    density of singly charged tritium ions:

    $$
    n_{\mathrm{T}} = n_{\mathrm{T}^{+}} = \int f_{\mathrm{T}^{+}}(\mathbf{v})\,d^{3}v
    $$

    where $n_{\mathrm{T}}$ is the tritium ion number density,
    $f_{\mathrm{T}^{+}}(\mathbf{v})$ is the velocity distribution function of
    singly charged tritium ions, and $\mathbf{v}$ is particle velocity.

    This isotope contribution is included in
    [density_at_limiter](name:density_at_limiter). It is evaluated at a limiter
    rather than at the separatrix, unlike
    [tritium_density_at_plasma_boundary](name:tritium_density_at_plasma_boundary),
    and is the tritium counterpart of
    [deuterium_density_at_limiter](name:deuterium_density_at_limiter).
  unit: m^-3

- name: tungsten_density_at_limiter
  description: |-
    Local particle number density of tungsten ions evaluated in the boundary
    plasma immediately adjacent to the plasma-facing limiter surface, summed
    over ionization states and excluding neutral tungsten.
  documentation: |-
    Number density of tungsten ions evaluated at the plasma-limiter interface on
    the plasma side of the magnetic presheath or sheath entrance. The limiter
    terminates open magnetic field lines in the scrape-off layer, so this
    quantity describes the tungsten impurity population participating in
    limiter-adjacent plasma–surface interactions.

    The charge-state sum is defined by

    $$
    n_{\mathrm W} = \sum_{Z\ge 1} n_{\mathrm{W}^{Z+}} = \sum_{Z\ge 1}\int f_{\mathrm{W}^{Z+}}(\mathbf{v})\,d^3v
    $$

    where $n_{\mathrm W}$ is the total tungsten-ion number density, $Z$ is the
    positive tungsten charge number, $n_{\mathrm{W}^{Z+}}$ is the density of
    charge state $Z$, and $f_{\mathrm{W}^{Z+}}(\mathbf{v})$ is its velocity
    distribution function. The sum includes all tungsten ionization states and
    excludes neutral tungsten.

    This quantity specializes [density_at_limiter](name:density_at_limiter) to
    tungsten and contributes to ion_density_at_limiter. It is evaluated at the
    limiter rather than the divertor-target location used by
    [tungsten_density_at_divertor_target](name:tungsten_density_at_divertor_target).
  unit: m^-3

- name: x_coordinate_of_diagnostic_aperture
  description: |-
    Signed x coordinate of the geometric center of a diagnostic aperture,
    measured from the origin of its right-handed camera Cartesian (x, y, z)
    frame.
  documentation: |-
    This quantity locates the geometric center of a diagnostic aperture along
    the x axis of its right-handed camera Cartesian basis
    $(\hat{x},\hat{y},\hat{z})$. It is a signed geometric position, not an
    aperture dimension or orientation.

    The coordinate is defined by

    $$
    x_A = (\mathbf{r}_A - \mathbf{r}_0) \cdot \hat{x}
    $$

    where $\mathbf{r}_A$ is the position of the aperture center, $\mathbf{r}_0$
    is the frame origin, $\hat{x}$ is the unit vector along the x axis, and
    $x_A$ is measured in m. The corresponding [y coordinate of the diagnostic
    aperture](name:y_coordinate_of_diagnostic_aperture) uses the same origin and
    camera basis; this quantity is distinct from cylindrical radial and vertical
    aperture coordinates.

    Sign convention: Positive when the aperture center lies in the direction of
    increasing x from the frame origin.
  unit: m

- name: x_coordinate_of_divertor_target
  description: |-
    Signed Cartesian x-coordinate locating the geometric center of a divertor
    target surface in the right-handed (x, y, z) frame, with +x at toroidal
    angle φ = 0.
  documentation: |-
    The x coordinate of a divertor target is the signed Cartesian position of
    the geometric center of its target surface. It locates that center in the
    right-handed Cartesian basis $(\hat{x}, \hat{y}, \hat{z})$, where $\hat{z}$
    is vertical and the positive x direction is horizontal at toroidal angle
    $\phi=0$.

    The coordinate is defined by projection of the center position onto the
    Cartesian x unit vector:

    $$
    x_c = \mathbf{r}_c \cdot \hat{\mathbf{x}}
    $$

    where $\mathbf{r}_c$ is the position vector of the target-surface geometric
    center, $\hat{\mathbf{x}}$ is the Cartesian x unit vector, and $x_c$ is the
    resulting signed coordinate. The corresponding center location is completed
    by the [y coordinate of the divertor
    target](name:y_coordinate_of_divertor_target) and [z coordinate of the
    divertor target](name:z_coordinate_of_divertor_target); this quantity does
    not specify the target surface extent.

    Sign convention: Positive when the target center lies in the direction of
    increasing Cartesian x from the coordinate origin.
  unit: m

- name: x_direction_unit_vector_of_camera
  description: |-
    X-axis component of a camera's unit viewing-direction vector in the
    right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the signed projection of a camera’s line-of-sight direction
    unit vector onto the Cartesian x axis. It specifies one component of the
    camera viewing orientation.

    If $\hat{\mathbf d}_{\rm cam}$ is the camera’s line-of-sight direction unit
    vector and $\hat{\mathbf x}$ is the x-axis unit vector, the component is
    defined by:

    $$
    d_x = \hat{\mathbf d}_{\rm cam} \cdot \hat{\mathbf x}
    $$

    Here $d_x$ is this quantity, $\hat{\mathbf d}_{\rm cam}$ is the camera
    direction vector, and $\hat{\mathbf x}$ is the unit vector along increasing
    x in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ frame. The
    corresponding y- and z-axis components are given by [y-direction unit vector
    of camera](name:y_direction_unit_vector_of_camera) and [z-direction unit
    vector of camera](name:z_direction_unit_vector_of_camera); these components
    together specify the viewing direction and satisfy unit-vector
    normalization.
  unit: '1'

- name: xenon_density_at_limiter
  description: |-
    Xenon ion number density in the boundary plasma immediately adjacent to a
    plasma-facing limiter surface, summed over all positive charge states and
    excluding neutral xenon atoms.
  documentation: |-
    Xenon density at the limiter is the local number density of xenon ions in
    the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is the plasma side of the magnetic presheath or sheath
    entrance at the plasma-limiter contact, consistent with the parent quantity
    [density_at_limiter](name:density_at_limiter).

    When charge states are not individually resolved, this quantity represents
    the sum over all positive xenon charge states $\text{Xe}^{q+}$, $q = 1,
    \ldots, 54$:

    $$
    n_{\text{Xe}} = \sum_{q=1}^{54} n_{\text{Xe}^{q+}}
    $$

    where $n_{\text{Xe}^{q+}}$ is the number density of xenon in charge state
    $q$. Neutral xenon atoms are excluded from this sum.

    Xenon is used as a high-$Z$ impurity seed for radiative power exhaust
    management in the scrape-off layer. Its concentration at the limiter is set
    by the balance of ionization, recombination, and cross-field impurity
    transport, and it determines the local particle flux, radiative power load,
    and potential sputtering damage to the plasma-facing surface. This quantity
    can be inferred from edge emission spectroscopy combined with
    collisional-radiative modeling. For xenon impurity density inside the
    confined plasma, see [xenon_density](name:xenon_density); for the analogous
    quantity at a divertor surface, see
    [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    and for xenon at the last closed flux surface, see
    [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary).
  unit: m^-3

- name: y_coordinate_of_diagnostic_aperture
  description: |-
    Signed y coordinate of the geometric center of a diagnostic aperture in the
    right-handed camera Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the signed Cartesian y coordinate of a diagnostic aperture's
    geometric center, measured from the origin of the right-handed camera basis
    $(\hat{x}, \hat{y}, \hat{z})$. It locates the aperture along the
    camera-frame y axis.

    The coordinate is defined by projection of the center position vector:

    $$
    y_{\rm ap} = \mathbf{r}_{\rm ap} \cdot \hat{\mathbf{y}}
    $$

    where $y_{\rm ap}$ is the coordinate value, $\mathbf{r}_{\rm ap}$ is the
    aperture-center position relative to the camera-frame origin, and
    $\hat{\mathbf{y}}$ is the positive y-axis unit vector; the length quantities
    are expressed in m.

    This camera-frame coordinate is distinct from the radial and vertical
    coordinates in the right-handed cylindrical $(R, \phi, Z)$ frame. Together
    with the [x coordinate of the diagnostic
    aperture](name:x_coordinate_of_diagnostic_aperture), it locates the aperture
    center in the camera frame.

    Sign convention: Positive when the aperture center lies in the positive y
    direction from the camera-frame origin.
  unit: m

- name: y_coordinate_of_divertor_target
  description: |-
    Signed Cartesian y-coordinate locating the geometric center of the divertor
    target surface in the right-handed Cartesian (x, y, z) frame; positive
    values lie along the +y axis.
  documentation: |-
    Signed Cartesian $y$-coordinate locating the geometric center of the
    divertor target surface is the component of that center-point position
    vector along $\hat{y}$ in the right-handed Cartesian $(x,y,z)$ frame with
    basis $(\hat{x},\hat{y},\hat{z})$. Here $x$, $y$, and $z$ are Cartesian
    position coordinates, $\hat{z}$ is vertical, and $\hat{x}$ is the horizontal
    direction corresponding to zero toroidal angle.

    The coordinate is related to the same point's position in the right-handed
    cylindrical $(R,\phi,Z)$ frame by

    $$
    y = R\sin\phi
    $$

    where $y$ is the signed Cartesian coordinate defined here, $R$ is the major
    radius of the target-surface center measured from the toroidal symmetry
    axis, $\phi$ is the toroidal angle of that same point, and $Z$ is vertical
    height in the cylindrical frame.

    The scope is the geometric center point of the divertor target surface. It
    is a point coordinate of that surface center, not a coordinate field over
    the full target surface, a local surface-tangent coordinate, a cylindrical
    coordinate, or an area average over target-surface elements.

    Together with
    [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target) and
    [z_coordinate_of_divertor_target](name:z_coordinate_of_divertor_target),
    this quantity forms the Cartesian position vector of the same center point.
    The cylindrical relation implies that the possible value is set by that
    point's own $R$ through $|y|\le R$, rather than by a generic device major
    radius.

    Sign convention: Positive when the divertor target surface center is
    displaced in the $+\hat{y}$ direction of the right-handed Cartesian
    $(x,y,z)$ frame with basis $(\hat{x},\hat{y},\hat{z})$.
  unit: m

- name: y_direction_unit_vector_of_camera
  description: |-
    Signed direction cosine giving a camera’s pointing direction along the y
    axis of the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The camera direction-vector component along the y axis is the signed
    direction cosine of its pointing direction in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis. It specifies the projection of the camera
    viewing direction onto the Cartesian y axis.

    The component is defined by

    $$
    d_y = \hat{\mathbf{d}} \cdot \hat{\mathbf{y}}
    $$

    where $\hat{\mathbf{d}}$ is the camera pointing-direction unit vector and
    $\hat{\mathbf{y}}$ is the positive y-axis unit vector. Its value forms part
    of the normalized direction vector together with the [x-axis camera
    direction component](name:x_direction_unit_vector_of_camera) and [z-axis
    camera direction component](name:z_direction_unit_vector_of_camera),
    satisfying $d_x^2+d_y^2+d_z^2=1$.

    This quantity describes camera pointing direction, not image-up orientation;
    that distinct orientation is represented by the [camera y image-up
    unit-vector component](name:y_image_up_unit_vector_of_camera).
  unit: '1'

- name: y_image_up_unit_vector_of_camera
  description: |-
    Y-axis component of a camera’s image-up orientation unit vector, expressed
    in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The camera image-up unit vector specifies the orientation of increasing
    image-up direction, distinct from the camera line-of-sight direction. This
    quantity is its projection onto the Cartesian y-axis.

    $$
    u_{\mathrm{up},y} = \mathbf{u}_{\mathrm{up}} \cdot \hat{\mathbf{y}}
    $$

    where $\mathbf{u}_{\mathrm{up}}$ is the image-up orientation unit vector and
    $\hat{\mathbf{y}}$ is the y-axis unit vector of the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame. The complete image-up vector has unit
    magnitude, so its components satisfy $u_{\mathrm{up},x}^2 +
    u_{\mathrm{up},y}^2 + u_{\mathrm{up},z}^2 = 1$. This component is distinct
    from the camera line-of-sight components represented by [x-direction unit
    vector of camera](name:x_direction_unit_vector_of_camera) and [z-direction
    unit vector of camera](name:z_direction_unit_vector_of_camera).
  unit: '1'

- name: z_coordinate_of_divertor_target
  description: |-
    Vertical Cartesian coordinate of the geometric center of a divertor target
    surface, identifying its location along the facility's vertical axis.
  documentation: |-
    The quantity is the vertical coordinate of the geometric center of a
    divertor target surface. It identifies the center point rather than the
    target's vertical extent or surface outline.

    In the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, the
    coordinate is defined by

    $$
    z_{\mathrm{target}} = \mathbf{r}_{\mathrm{target}} \cdot \hat{\mathbf{z}}
    $$

    where $\mathbf{r}_{\mathrm{target}}$ is the position vector of the target
    surface center relative to the frame origin and $\hat{\mathbf{z}}$ is the
    vertical unit vector. The $z$ direction corresponds to $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    Together with the [x coordinate of the divertor
    target](name:x_coordinate_of_divertor_target) and [y coordinate of the
    divertor target](name:y_coordinate_of_divertor_target), this quantity
    locates the target surface center. It is distinct from the [vertical length
    of the divertor target](name:vertical_length_of_divertor_target) and the
    [vertical outline of the divertor
    tile](name:vertical_outline_of_divertor_tile), which describe extent and
    boundary geometry rather than the center position.
  unit: m

- name: z_direction_unit_vector_of_camera
  description: |-
    Signed Z-direction cosine of a camera’s viewing-direction unit vector in the
    right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The camera direction component along the Cartesian Z axis is the signed
    directional cosine of the camera’s viewing-direction unit vector. It
    specifies how strongly the viewing direction points along the positive or
    negative Z direction.

    The component is defined by

    $$
    d_z = \mathbf{d} \cdot \hat{\mathbf{z}}
    $$

    where $d_z$ is the Z component, $\mathbf{d}$ is the camera’s direction unit
    vector, and $\hat{\mathbf{z}}$ is the positive-Z basis vector of the
    right-handed Cartesian $(x, y, z)$ frame.

    This quantity applies to the viewing direction of an individual camera, with
    no spatial, population, or charge-state aggregation. It is a directional
    component rather than the camera position, the image-up orientation, or the
    magnitude of the direction vector.

    Together with the corresponding [x direction unit vector of the
    camera](name:x_direction_unit_vector_of_camera) and [y direction unit vector
    of the camera](name:y_direction_unit_vector_of_camera), it specifies the
    complete viewing-direction vector; the three components satisfy $d_x^2 +
    d_y^2 + d_z^2 = 1$, where $d_x$ and $d_y$ are the X and Y components of that
    same unit vector.
  unit: '1'

- name: power_at_wall_due_to_conduction
  description: |-
    Thermal power deposited on all plasma-facing wall and divertor surfaces by
    parallel electron and ion heat conduction along open scrape-off-layer
    magnetic field lines, excluding convective, radiative, and neutral-particle
    channels.
  documentation: |-
    The power at the wall due to conduction is the thermal energy deposited on
    all plasma-facing wall and divertor surfaces by electron and ion heat
    conduction along open scrape-off-layer magnetic field lines. It excludes
    convective particle enthalpy, absorbed radiation, and neutral-particle
    energy deposition.

    The defining surface integral is:

    $$
    P_{\mathrm{wall,cond}} = \int_{S_{\mathrm{wall}}} \left(\mathbf{q}_{e,\parallel}^{\mathrm{cond}} + \mathbf{q}_{i,\parallel}^{\mathrm{cond}}\right) \cdot \hat{\mathbf{n}}\,\mathrm{d}A
    $$

    where $P_{\mathrm{wall,cond}}$ is the deposited conductive power,
    $S_{\mathrm{wall}}$ is the union of all plasma-facing wall and divertor
    surfaces, $\mathbf{q}_{e,\parallel}^{\mathrm{cond}}$ and
    $\mathbf{q}_{i,\parallel}^{\mathrm{cond}}$ are the electron and ion
    conductive heat-flux vectors along open magnetic field lines,
    $\hat{\mathbf{n}}$ is the unit normal directed from the plasma toward the
    material, and $\mathrm{d}A$ is a surface-area element.

    This quantity is the all-wall member of [power due to
    conduction](name:power_due_to_conduction). Restricting the selected surfaces
    to all divertor targets gives [power of divertor due to
    conduction](name:power_of_divertor_due_to_conduction), while a single target
    contribution is represented by [power at divertor target due to
    conduction](name:power_at_divertor_target_due_to_conduction).
  unit: W

- name: power_at_wall_due_to_convection
  description: |-
    Power deposited on plasma-facing wall and divertor surfaces by convective
    plasma particle flux, comprising thermal enthalpy and directed kinetic
    energy carried by streaming ions and electrons from the scrape-off layer.
  documentation: |-
    Convective power at plasma-facing wall and divertor surfaces quantifies the
    energy transported by bulk plasma-particle flow from the scrape-off layer
    into the material surfaces. It comprises thermal enthalpy and directed
    kinetic-energy contributions and is the surface-integrated component of
    [power due to convection](name:power_due_to_convection).

    $$
    P_{\mathrm{conv,wall}} = \int_{A_{\mathrm{wall}}} q_{\mathrm{conv}}(\mathbf{x})\,\mathrm{d}A
    $$

    where $P_{\mathrm{conv,wall}}$ is the total convective power,
    $q_{\mathrm{conv}}(\mathbf{x})$ is the local convective energy flux density
    at surface position $\mathbf{x}$, and $A_{\mathrm{wall}}$ is the combined
    plasma-facing wall and divertor surface area included in the quantity.

    Only convective particle-energy transport is included; conductive and
    radiative deposition are excluded. [Power at a single divertor target due to
    convection](name:power_at_divertor_target_due_to_convection) isolates one
    target, while [convective power summed over divertor
    targets](name:power_of_divertor_due_to_convection) includes only the
    divertor-target subset. The conductive counterpart is [power at the wall due
    to conduction](name:power_at_wall_due_to_conduction).
  unit: W

- name: ratio_of_iron_density_to_electron_density
  description: |-
    Dimensionless abundance ratio of charge-state-summed iron-ion number density
    to local free-electron number density.
  documentation: |-
    This quantity is the local iron-to-electron abundance ratio in a plasma,
    comparing the population of iron ions with unbound free electrons.

    $$
    R_{\mathrm{Fe}/e} = \frac{n_{\mathrm{Fe}}}{n_e}
    $$

    where $R_{\mathrm{Fe}/e}$ is the iron-to-electron abundance ratio,
    $n_{\mathrm{Fe}}$ is the total [iron-ion number density](name:iron_density),
    and $n_e$ is the local [free-electron number
    density](name:electron_density).

    The numerator is summed over all positive iron ionization states, while the
    denominator counts free electrons and excludes electrons bound in atoms,
    molecules, or ions. This is a local ratio with no volume averaging, maximum
    operation, or specified spatial locus.

    The ratio is the iron-specific counterpart of the general
    [ion-density-to-electron-density
    ratio](name:ratio_of_ion_density_to_electron_density); its numerator is the
    charge-state-summed iron density and its denominator is the electron-density
    parent quantity.
  unit: '1'

- name: ratio_of_volume_averaged_beryllium_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless beryllium abundance formed by dividing the volume-averaged
    beryllium density by the volume-averaged electron density.
  documentation: |-
    Dimensionless beryllium abundance formed by dividing the volume-averaged
    beryllium density by the volume-averaged electron density. It represents the
    abundance of ionized beryllium relative to free electrons in the confined
    plasma volume.

    The abundance is defined by the ratio of the two volume averages:

    $$
    a_{\mathrm{Be}} =
    \frac{\langle n_{\mathrm{Be}} \rangle_V}{\langle n_e \rangle_V}
    =
    \frac{\left\langle \sum_{q=1}^{4} n_{\mathrm{Be}^{q+}} \right\rangle_V}{\langle n_e \rangle_V}
    $$

    where $a_{\mathrm{Be}}$ is the beryllium abundance ratio, $\langle \cdot
    \rangle_V$ denotes averaging over the confined plasma volume,
    $n_{\mathrm{Be}}$ is the charge-state-summed beryllium ion number density,
    $n_{\mathrm{Be}^{q+}}$ is the number density of beryllium ions in charge
    state $q$, and $n_e$ is the [electron density](name:electron_density).

    The numerator is the [volume-averaged beryllium
    density](name:volume_averaged_beryllium_density), summed over all ionized
    beryllium charge states and excluding neutral beryllium atoms. The
    denominator is the [volume-averaged electron
    density](name:volume_averaged_electron_density) over the same confined
    plasma volume.

    This quantity is a ratio of two global volume averages, not a pointwise
    impurity fraction and not the volume average of $n_{\mathrm{Be}}/n_e$. It is
    not charge-weighted; a charge-weighted beryllium contribution to
    quasineutrality would use terms proportional to $q n_{\mathrm{Be}^{q+}}$
    rather than the unweighted ion sum. The local pre-averaged counterpart of
    the numerator is [beryllium density](name:beryllium_density).
  unit: '1'

- name: ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless global boron abundance ratio using separately volume-averaged
    boron and electron number densities, with neutral boron and every ionic
    charge state included.
  documentation: |-
    This quantity is the global abundance of elemental boron relative to the
    electron population. It characterizes plasma composition over the full
    plasma volume rather than at a local point or along a line of sight.

    The defining ratio is

    $$
    f_B = \frac{\overline{n}_B}{\overline{n}_e}
    $$

    where $f_B$ is the boron-to-electron abundance ratio, $\overline{n}_B$ is
    the volume-averaged elemental boron number density, and $\overline{n}_e$ is
    the volume-averaged electron number density. The overbar denotes averaging
    over the plasma volume.

    The numerator includes neutral boron and every ionic boron charge state,
    while the denominator represents the complete electron population. For the
    associated plasma-composition convention, the ratio is evaluated at the time
    of peak electron density.

    This quantity is distinct from local [boron density](name:boron_density) and
    from [line-averaged boron density](name:line_averaged_boron_density): it is
    a quotient of two separately volume-averaged densities, not a volume average
    of a pointwise ratio or a line average. Its numerator is the
    [volume-averaged boron density](name:volume_averaged_boron_density), making
    this ratio the corresponding normalized composition measure.
  unit: '1'

- name: ratio_of_volume_averaged_carbon_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless plasma-wide carbon abundance defined as the ratio of
    volume-averaged carbon number density to volume-averaged electron number
    density. The carbon density is summed over all carbon charge states.
  documentation: |-
    Dimensionless plasma-wide carbon abundance is the ratio of volume-averaged
    carbon number density to volume-averaged electron number density. It
    represents the elemental carbon abundance relative to electrons over the
    same plasma volume.

    The defining ratio is

    $$
    f_{C,V} = \frac{\langle n_C \rangle_V}{\langle n_e \rangle_V} = \frac{\left\langle \sum_{q=0}^{6} n_{\mathrm{C},q} \right\rangle_V}{\langle n_e \rangle_V}
    $$

    where $f_{C,V}$ is the ratio of volume-averaged carbon density to
    volume-averaged electron density, $\langle n_C \rangle_V$ is the
    [volume-averaged carbon density](name:volume_averaged_carbon_density),
    $\langle n_e \rangle_V$ is the [volume-averaged electron
    density](name:volume_averaged_electron_density), $n_C$ is the [carbon
    density](name:carbon_density), $n_{\mathrm{C},q}$ is the local number
    density of carbon nuclei in charge state $q$, $q$ is the carbon charge-state
    index with $q=0$ for neutral carbon and $q=6$ for fully stripped carbon, and
    $\langle\cdot\rangle_V$ denotes averaging over the same plasma volume for
    numerator and denominator.

    The population is elemental carbon in the plasma volume, with the numerator
    summed over neutral carbon and all ionic charge states. The aggregation
    convention is a ratio of two volume averages using the same volume
    weighting; it is not the volume average of the local ratio $n_C/n_e$.

    This quantity is not an ion-only carbon abundance, not a fraction of total
    particle density, and not a charge-weighted impurity measure. It is the
    carbon member of the same volume-averaged impurity-abundance family as the
    [boron abundance
    ratio](name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density),
    and it differs from the [ratio of total ion density to electron
    density](name:ratio_of_total_ion_density_to_electron_density), which
    aggregates over all ion species rather than isolating elemental carbon.
  unit: '1'

- name: ratio_of_volume_averaged_oxygen_density_to_volume_averaged_electron_density
  description: |-
    Volume-averaged oxygen ion density relative to volume-averaged electron
    density for the plasma, with oxygen summed over ionized charge states and
    neutral oxygen excluded.
  documentation: |-
    Volume-averaged oxygen ion density relative to volume-averaged electron
    density is a scalar oxygen impurity fraction for the plasma. It compares the
    charge-state-summed volume average of ionized oxygen number density with the
    corresponding volume average of electron number density over the same
    averaging volume.

    The ratio is defined by

    $$
    f_O = \frac{\left\langle \sum_{q=1}^{8} n_{O^{q+}} \right\rangle_V}{\langle n_e \rangle_V}
    $$

    where $f_O$ is this oxygen-to-electron density ratio,
    $\langle\cdot\rangle_V$ denotes a volume average over the averaging volume
    $V$, $q$ is the oxygen charge-state index, $n_{O^{q+}}$ is the local number
    density of oxygen ions in charge state $q+$, and $n_e$ is the local electron
    number density. The denominator $\langle n_e\rangle_V$ is the
    [volume-averaged electron density](name:volume_averaged_electron_density).

    The numerator is summed over ionized oxygen charge states $O^{1+}$ through
    $O^{8+}$ and excludes neutral oxygen. This quantity is a single scalar
    composition fraction formed from volume-averaged populations; it is distinct
    from a local [oxygen density](name:oxygen_density), from a [line-averaged
    oxygen density](name:line_averaged_oxygen_density), and from a
    neutral-inclusive [volume-averaged oxygen
    density](name:volume_averaged_oxygen_density) when that quantity includes
    neutral oxygen.

    The essential relationship is normalization: the charge-state-summed
    volume-averaged oxygen ion density is divided by the [volume-averaged
    electron density](name:volume_averaged_electron_density), so the result
    represents oxygen ion abundance relative to the electron population rather
    than an absolute density.
  unit: '1'

- name: ratio_of_volume_averaged_tungsten_density_to_volume_averaged_electron_density
  description: |-
    Dimensionless tungsten abundance ratio equal to the plasma-volume-averaged
    elemental tungsten density divided by the plasma-volume-averaged electron
    density.
  documentation: |-
    Dimensionless tungsten abundance ratio equal to the plasma-volume-averaged
    elemental tungsten density divided by the plasma-volume-averaged electron
    density. It compares the charge-state-summed tungsten-ion population with
    the free-electron population in the same plasma volume.

    The ratio is defined from the two volume averages over the plasma volume $V$
    as

    $$
    a_{\mathrm{W},V}
    =
    \frac{\langle n_{\mathrm{W}}\rangle_V}{\langle n_e\rangle_V}
    =
    \frac{V^{-1}\int_V \sum_{z=1}^{74} n_{\mathrm{W}^{z+}}(\mathbf{x})\, dV}{V^{-1}\int_V n_e(\mathbf{x})\, dV}
    $$

    where $a_{\mathrm{W},V}$ denotes this tungsten abundance ratio, $V$ denotes
    the plasma volume enclosed by the last closed flux surface over which both
    averages are formed, $\langle n_{\mathrm{W}}\rangle_V$ is the
    [volume-averaged tungsten density](name:volume_averaged_tungsten_density),
    $\langle n_e\rangle_V$ is the [volume-averaged electron
    density](name:volume_averaged_electron_density),
    $n_{\mathrm{W}^{z+}}(\mathbf{x})$ is the local number density of tungsten
    ions in charge state $z$ at position $\mathbf{x}$, $n_e(\mathbf{x})$ is the
    local free-electron number density, $z=1,\ldots,74$ indexes the positive
    tungsten ionization states, and $dV$ is the volume element.

    The scope is the confined plasma volume: both numerator and denominator use
    the same volume and the same volume-averaging operation. The tungsten
    population is elemental tungsten in positive ionization states, summed over
    charge state; neutral tungsten is excluded. The aggregation is the ratio of
    the two volume averages, not the volume average of the local ratio
    $n_{\mathrm{W}}/n_e$, and the quantity is defined only when $\langle
    n_e\rangle_V$ is nonzero.

    This ratio is an unweighted tungsten-nucleus abundance relative to free
    electrons; it is not a charge-weighted tungsten contribution to electron
    density and is not an effective-charge measure. It is the tungsten member of
    the same volume-averaged composition-ratio family as the [deuterium-tritium
    abundance
    ratio](name:ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density)
    and the [carbon abundance
    ratio](name:ratio_of_volume_averaged_carbon_density_to_volume_averaged_electron_density),
    which replace the tungsten numerator with the corresponding species volume
    average while retaining the same electron-density denominator.
  unit: '1'
