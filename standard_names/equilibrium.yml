- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: draft
  description: Vertical height (Z coordinate) in the cylindrical reference frame of
    the primary separatrix strike point in a diverted tokamak configuration.
  documentation: 'The vertical coordinate $Z_{\mathrm{sp}}$ locates the intersection
    of the primary separatrix with the divertor target plate in the poloidal plane,
    measured in the right-handed cylindrical $(R, \phi, Z)$ system where $Z$ increases
    upward. This position defines the footprint of the confined plasma on the divertor
    and is a critical actuator target for magnetic equilibrium control. Typical vertically
    diverting configurations place the strike point on the lower target at $Z \approx
    -1$ to $-2$ m for medium-size tokamaks (DIII-D, JET) and near $\pm 4$ m for the
    upper divertor in ITER. The strike point height is routinely extracted from equilibrium
    reconstruction (EFIT, LIUQE) and is paired with [major_radius_of_strike_point](name:major_radius_of_strike_point)
    to give the full poloidal location. See also [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target)
    for the coordinate of a target-tile reference point, and [vertical_coordinate_of_separatrix](name:vertical_coordinate_of_separatrix)
    for the full separatrix outline.


    Sign convention: Positive when $Z$ is above the machine mid-plane in the cylindrical
    frame, increasing upward.


    Typical values: $Z_{\mathrm{sp}} \approx -0.5$ to $-2.0$ m in conventional lower-divertor
    tokamaks, where the sign indicates divertor placement on the underside of the
    vessel.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_strike_point
  - name:vertical_coordinate_of_divertor_target
  - name:vertical_coordinate_of_separatrix
