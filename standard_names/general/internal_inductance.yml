name: internal_inductance
status: draft
cocos_transformation_type: one_like
description: Normalized internal inductance $l_i$ characterizing the peakedness of
  the poloidal current density profile inside the plasma.
documentation: 'The internal inductance $l_i$ (dimensionless) is defined as the ratio
  of the volume-averaged poloidal magnetic energy inside the plasma to a reference
  value evaluated at the plasma boundary: $l_i = \frac{\langle B_\theta^2 \rangle_V}{B_\theta^2(a)}$,
  where $B_\theta$ is the poloidal magnetic field magnitude and $a$ is the minor radius.
  Several normalization conventions exist; the $l_{i}(3)$ definition (also called
  $l_i^{(3)}$) normalizes by $2 V / (\mu_0^2 I_p^2 R_0)$, where $V$ is the plasma
  volume, $I_p$ the plasma current, $R_0$ the geometric major radius, and $\mu_0$
  the vacuum permeability. A higher $l_i$ indicates a more peaked current profile
  (centrally concentrated $j_\phi$), while a lower value suggests a broader or hollow
  profile. Typical tokamak values range from 0.7 to 1.5; values below 0.7 are associated
  with advanced-tokamak reversed-shear scenarios. $l_i$ is obtained from equilibrium
  reconstruction codes (e.g., EFIT) using external magnetic measurements, and it is
  a critical parameter for vertical stability assessment and disruption prediction.
  See also `plasma_current` and `safety_factor` for related equilibrium quantities.'
