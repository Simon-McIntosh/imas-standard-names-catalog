- name: poloidal_angle_of_magnetic_field_probe_sensor_normal
  kind: scalar
  status: draft
  description: Poloidal orientation angle of the sensor normal vector for a magnetic
    field probe coil, defined as the clockwise elevation from the outward major-radius
    direction in the poloidal plane. Zero when the sensor normal points radially outward
    along $+\hat{R}$, increasing clockwise toward $-\hat{Z}$.
  documentation: '## Poloidal angle of magnetic field probe sensor normal


    For a single-axis magnetic field probe (pickup coil), the **sensor normal** $\hat{n}$
    is the unit vector parallel to the geometric axis of the coil. The component of
    the ambient magnetic field measured by the probe is $B_n = \mathbf{B} \cdot \hat{n}$.
    Under the assumptions of a spatially uniform field over the coil area $A$ and
    $N$ turns, the induced signal relates to $B_n$ through $\Phi = N A B_n$; in general,
    $B_n$ is the area-weighted average of the normal field over the coil cross-section.


    The poloidal angle $\alpha_\mathrm{pol}$ characterizes the orientation of $\hat{n}$
    within the poloidal $(R, Z)$ plane (at a fixed toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius from the machine
    symmetry axis and $Z$ is the vertical height).


    **Defining relation.** Let $\hat{n}$ be decomposed in the $(R, Z)$ plane as

    $$\hat{n} = \cos\alpha_\mathrm{pol}\,\hat{R} - \sin\alpha_\mathrm{pol}\,\hat{Z}.$$

    Equivalently, $\alpha_\mathrm{pol}$ is the clockwise angle from $+\hat{R}$ to
    $\hat{n}$ when viewed from the $+\hat{\phi}$ direction:

    - $\alpha_\mathrm{pol} = 0$: $\hat{n}$ points in the $+\hat{R}$ (outward radial)
    direction.

    - $\alpha_\mathrm{pol} = \pi/2$: $\hat{n}$ points in the $-\hat{Z}$ (downward)
    direction.

    - $\alpha_\mathrm{pol} = \pi$: $\hat{n}$ points in the $-\hat{R}$ (inward radial)
    direction.

    - $\alpha_\mathrm{pol} = 3\pi/2$: $\hat{n}$ points in the $+\hat{Z}$ (upward)
    direction.


    **Range.** The angle is stored in the interval $[0, 2\pi)$ radians by convention.
    This is a conventional (not required) restriction; values outside this range should
    be reduced modulo $2\pi$.


    **Complement.** The toroidal orientation of $\hat{n}$ is described by the companion
    quantity `toroidal_angle_of_magnetic_field_probe_sensor_normal`. Together, $\alpha_\mathrm{pol}$
    and the toroidal angle fully specify the three-dimensional orientation of the
    sensor axis.


    **Typical values.** Divertor and mid-plane poloidal-field probes typically have
    $\alpha_\mathrm{pol}$ near $0$, $\pi/2$, $\pi$, or $3\pi/2$, reflecting alignment
    with $\hat{R}$ or $\hat{Z}$. Saddle-coil normals may take arbitrary intermediate
    values.


    **Measurement context.** This angle, together with the toroidal angle, the probe
    position in $(R, \phi, Z)$, and the active area $A$ and turn count $N$, completely
    specifies the geometry of the sensor for equilibrium reconstruction and comparison
    with computed field maps.'
  unit: rad
  physics_domain: magnetic_field_diagnostics
  links:
  - name:toroidal_angle_of_magnetic_field_probe_sensor_normal
  - name:cross_sectional_area_of_magnetic_field_probe
  constraints: []
  sources:
  - id: dd:magnetics/b_field_phi_probe/poloidal_angle
    dd_path: magnetics/b_field_phi_probe/poloidal_angle
    status: composed
  - id: dd:magnetics/b_field_pol_probe/poloidal_angle
    dd_path: magnetics/b_field_pol_probe/poloidal_angle
