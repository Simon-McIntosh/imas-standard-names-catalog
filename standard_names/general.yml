- name: energy_confinement_enhancement_factor
  kind: scalar
  status: active
  description: Dimensionless ratio comparing the plasma energy confinement time with
    the IPB98(y,2) reference scaling prediction.
  documentation: "The energy confinement enhancement factor is the multiplicative\
    \ departure of a plasma\u2019s global energy confinement time from the IPB98(y,2)\
    \ reference scaling prediction. It indicates whether energy is retained longer\
    \ or shorter than the reference predicts for the corresponding scaling inputs.\n\
    \nThe factor is defined by:\n\n$$\nh_{98} = \\frac{\\tau_E}{\\tau_{E,\\mathrm{IPB98(y,2)}}}\n\
    $$\n\nwhere $h_{98}$ is the energy confinement enhancement factor, $\\tau_E$ is\
    \ the plasma energy confinement time, and $\\tau_{E,\\mathrm{IPB98(y,2)}}$ is\
    \ the energy confinement time predicted by the IPB98(y,2) reference scaling.\n\
    \nThis is a global plasma quantity: the numerator represents the confinement of\
    \ the total stored plasma energy relative to the corresponding net energy-loss\
    \ power, aggregated over the plasma rather than assigned to a local region or\
    \ individual transport channel. It is not itself an energy confinement time, stored\
    \ energy, power, or local transport coefficient.\n\nA value of one denotes agreement\
    \ with the reference scaling; a value greater than one denotes longer confinement,\
    \ and a value less than one denotes shorter confinement than the reference prediction."
  unit: '1'
  physics_domain: general
  links: []
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/h_98/value
    version: 4.1.0
- name: ipb98y2_confinement_time
  kind: scalar
  status: active
  description: IPB98(y,2) empirical-scaling reference for global energy confinement
    time, providing the denominator for the H98 confinement enhancement factor.
  documentation: 'The IPB98(y,2) energy confinement time is the global energy-confinement
    timescale predicted by the IPB98(y,2) empirical scaling law. It is an energy-channel
    performance benchmark rather than a species-resolved or local transport time.


    The underlying global energy confinement time is defined by


    $$

    \tau_E = \frac{W}{P_{\mathrm{loss}}}

    $$


    where $\tau_E$ is the global energy confinement time, $W$ is the total thermal
    energy stored in the plasma, and $P_{\mathrm{loss}}$ is the net power leaving
    the plasma. The quantity documented here is the IPB98(y,2) scaling prediction
    of this timescale, not the directly evaluated confinement time for a particular
    plasma state.


    The value applies to the complete plasma energy content and its global loss balance;
    it is not a local profile quantity, a particle confinement time, or a confinement
    time assigned to an individual species. It is a single empirical reference value
    for the energy channel.


    The [energy confinement enhancement factor](name:energy_confinement_enhancement_factor)
    compares the actual global energy confinement time with this reference through
    $H_{98} = \tau_E / \tau_{E,98}$, where $H_{98}$ is the dimensionless confinement
    enhancement factor and $\tau_{E,98}$ is this IPB98(y,2) scaling prediction.'
  unit: s
  physics_domain: general
  links:
  - name:energy_confinement_enhancement_factor
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/tau_energy_98/value
    version: 4.1.0
- name: krypton_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of krypton ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface.
  documentation: 'Number density of krypton ions at the plasma boundary is the local,
    intensive particle count per physical volume for the krypton-ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local krypton ion number density is the sum of the zeroth velocity moments
    over all krypton ionization states at a boundary point:


    $$

    n_{\mathrm{Kr}}(\mathbf{x}_b,t) = \sum_{q \in \mathcal{Q}_{\mathrm{Kr}}} \int
    f_{\mathrm{Kr}^{q+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{\mathrm{Kr}}$ is the krypton ion number density, $\mathbf{x}_b$ is a
    point on the last closed magnetic flux surface, $t$ is time, $q$ is the krypton
    ionization-state index, $\mathcal{Q}_{\mathrm{Kr}}$ is the set of all positively
    charged krypton ionization states, $f_{\mathrm{Kr}^{q+}}$ is the phase-space distribution
    function for state $q$, $\mathbf{v}$ is particle velocity, and $d^3v$ is the velocity-space
    volume element.


    This quantity applies specifically to krypton ions and is summed over all included
    ionization states. It excludes neutral krypton and all other ion species, and
    it is a local boundary value with no averaging over the boundary surface or over
    a volume.


    It is the krypton-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary).
    The related [krypton density](name:krypton_density) represents the same charge-state-summed
    ion population at a general plasma location, whereas [flux-surface-averaged krypton
    density at the plasma boundary](name:flux_surface_averaged_krypton_density_at_plasma_boundary)
    averages the krypton density over the complete last closed magnetic flux surface
    rather than evaluating it locally.'
  unit: m^-3
  physics_domain: general
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/krypton/value
    version: 4.1.0
- name: normalized_toroidal_flux_coordinate_at_internal_transport_barrier
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface coordinate locating the internal transport
    barrier between the magnetic axis and the last closed flux surface.
  documentation: 'The normalized toroidal flux coordinate at the internal transport
    barrier is the dimensionless magnetic-surface label assigned to the flux surface
    containing the barrier. It locates that surface within the nested closed-flux
    region rather than giving a cylindrical distance or vector component.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}}(\mathrm{ITB}) = \left[\frac{\Phi_{\mathrm{tor}}(\mathrm{ITB})
    - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,LCFS}} - \Phi_{\mathrm{tor,axis}}}\right]^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(\mathrm{ITB})$ is the normalized toroidal flux
    coordinate at the internal transport barrier, $\Phi_{\mathrm{tor}}(\mathrm{ITB})$
    is the toroidal magnetic flux enclosed by the flux surface containing the barrier,
    $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and $\Phi_{\mathrm{tor,LCFS}}$
    is its value at the last closed flux surface. The nonnegative square-root branch
    is used.


    The value applies specifically to the flux surface assigned to the internal transport
    barrier and is bounded from zero at the magnetic axis to unity at the last closed
    flux surface for nested surfaces with monotonic toroidal flux. It has no species,
    charge-state, or spatial averaging; it is a scalar surface label.


    This quantity is the internal-transport-barrier specialization of the [normalized
    toroidal flux coordinate](name:normalized_toroidal_flux_coordinate). Unlike the
    [toroidal flux coordinate at the internal transport barrier](name:toroidal_flux_coordinate_at_internal_transport_barrier),
    it uses axis-to-last-closed-flux-surface normalization and is therefore dimensionless.'
  unit: '1'
  physics_domain: general
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:toroidal_flux_coordinate_at_internal_transport_barrier
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: internal_transport_barrier
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: summary/local/itb/position/rho_tor_norm
    version: 4.1.1
- name: normalized_toroidal_flux_coordinate_at_pedestal_top
  kind: scalar
  status: active
  description: Dimensionless toroidal-flux label locating the top of the H-mode edge
    pedestal on a nested magnetic surface relative to the magnetic axis and last closed
    flux surface.
  documentation: 'The normalized toroidal flux coordinate evaluated at the pedestal
    top is the dimensionless magnetic-surface label assigned to the top of the H-mode
    edge pedestal. It locates that position within the nested closed-flux-surface
    family, rather than representing a cylindrical distance or a local vector component.


    For a nested equilibrium, the coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}}(\mathrm{ped}) = \left[\frac{\Phi_{\mathrm{tor}}(\mathrm{ped})
    - \Phi_{\mathrm{tor}}(\mathrm{axis})}{\Phi_{\mathrm{tor}}(\mathrm{LCFS}) - \Phi_{\mathrm{tor}}(\mathrm{axis})}\right]^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(\mathrm{ped})$ is the normalized toroidal flux
    coordinate at the pedestal top, $\Phi_{\mathrm{tor}}$ is the toroidal magnetic
    flux enclosed by a magnetic surface, $\mathrm{ped}$ denotes the pedestal-top position,
    $\mathrm{axis}$ denotes the magnetic axis, and $\mathrm{LCFS}$ denotes the last
    closed flux surface.


    The value applies specifically at the top of the H-mode edge pedestal, the inner
    shoulder of the edge transport barrier. Its position is defined by the [normalized
    poloidal flux coordinate of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).
    This is a single coordinate evaluation: no species, charge-state, or population
    aggregation applies, and no surface averaging is implied. It is distinct from
    a cylindrical radial distance and from the unnormalized [toroidal flux coordinate
    at the pedestal top](name:toroidal_flux_coordinate_at_pedestal_top).


    This entry is the pedestal-top specialization of the [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate), with the same axis-to-boundary
    normalization. It should not be interpreted as the corresponding [normalized poloidal
    flux coordinate](name:normalized_poloidal_flux_coordinate), which labels surfaces
    using poloidal rather than toroidal magnetic flux.'
  unit: '1'
  physics_domain: general
  links:
  - name:normalized_poloidal_flux_coordinate_of_pedestal
  - name:toroidal_flux_coordinate_at_pedestal_top
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_poloidal_flux_coordinate
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: pedestal_top
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: summary/local/pedestal/position/rho_tor_norm
    version: 4.1.1
- name: normalized_toroidal_flux_coordinate_at_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless toroidal-flux surface label evaluated on the last closed
    magnetic surface, serving as the outer reference for the normalized flux coordinate.
  documentation: 'The normalized toroidal flux coordinate at the plasma boundary is
    the magnetic-surface label assigned to the last closed flux surface, also called
    the separatrix. It identifies the outer boundary of the nested closed-flux-surface
    region and is not a cylindrical distance or local vector component.


    The boundary value is defined by


    $$

    \left.\rho_{\mathrm{tor,norm}}\right|_{\mathrm{plasma\ boundary}} = 1

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate and
    the plasma boundary is the last closed magnetic flux surface.


    This quantity is evaluated at the boundary itself, rather than averaged over the
    boundary or assigned to an arbitrary spatial point. It is the boundary specialization
    of the parent [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    whose value increases outward from the magnetic axis; the corresponding unnormalized
    quantity is the [toroidal flux coordinate at the plasma boundary](name:toroidal_flux_coordinate_at_plasma_boundary).'
  unit: '1'
  physics_domain: general
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:toroidal_flux_coordinate_at_plasma_boundary
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: plasma_boundary
    operator_kind: locus
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix_average/position/rho_tor_norm
    version: 4.1.1
- name: oxygen_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of oxygen ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface and summed over all charged oxygen ionization states.
  documentation: 'Number density of oxygen ions at the plasma boundary is the local,
    intensive particle count per physical volume for the oxygen-ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local charge-state-summed oxygen ion density at a boundary point is the zeroth
    velocity moment of the oxygen-ion distribution functions:


    $$

    n_{\mathrm{O}}(\mathbf{x}_b,t)=\sum_{z=1}^{8}\int f_{\mathrm{O}^{z+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{\mathrm{O}}$ is the oxygen-ion number density, $\mathbf{x}_b$ is a point
    on the last closed magnetic flux surface, $t$ is time, $z$ is the positive oxygen
    ionization state, $f_{\mathrm{O}^{z+}}$ is the phase-space distribution function
    for that state, $\mathbf{v}$ is particle velocity, and $d^3v$ is the velocity-space
    volume element.


    This quantity applies specifically to oxygen ions and sums the populations from
    singly ionized through fully stripped oxygen. It excludes neutral oxygen and other
    ion species, and it is a local boundary value with no averaging over the boundary
    surface or over a volume.


    It is the oxygen-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary).
    The [flux-surface-averaged oxygen density at the plasma boundary](name:flux_surface_averaged_oxygen_density_at_plasma_boundary)
    represents the same charge-state-summed oxygen-ion content averaged over the last
    closed magnetic flux surface rather than evaluated locally.'
  unit: m^-3
  physics_domain: general
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/oxygen/value
    version: 4.1.0
- name: toroidal_beta
  kind: scalar
  status: active
  description: Toroidal beta is a dimensionless measure of total plasma pressure relative
    to the magnetic-pressure scale associated with a toroidal magnetic-field reference,
    with the pressure aggregate taken as the confined-volume average of total perpendicular
    pressure.
  documentation: 'Toroidal beta is a dimensionless equilibrium measure of the total
    pressure content of the confined plasma relative to the magnetic-pressure scale
    associated with a toroidal magnetic-field reference. It characterizes pressure
    relative to the toroidal field, with the pressure aggregate taken as the confined-volume
    average of total perpendicular plasma pressure.


    The toroidal specialization relation is


    $$

    \beta_{\mathrm{tor}} = \frac{2\mu_0\,\langle p_{\perp,\mathrm{plasma}}\rangle_V}{B_{\mathrm{tor,ref}}^2}

    $$


    where $\beta_{\mathrm{tor}}$ is toroidal beta, $\mu_0$ is the vacuum permeability,
    $\langle\cdot\rangle_V$ denotes averaging over the confined plasma volume $V$,
    $p_{\perp,\mathrm{plasma}}$ is the total plasma pressure perpendicular to the
    local magnetic-field direction, and $B_{\mathrm{tor,ref}}$ is the reference magnitude
    of the toroidal magnetic field associated with the toroidal direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The scope is the confined plasma in an equilibrium state. Its aggregation convention
    is fixed for this name: total perpendicular plasma pressure is summed over the
    plasma populations included in the equilibrium pressure and averaged over the
    confined plasma volume. This excludes local beta values, species-resolved beta
    values, beta definitions based on poloidal or total magnetic-field pressure scales,
    and beta definitions with an additional normalization.


    Toroidal beta specializes [plasma beta](name:plasma_beta) by choosing the confined-volume
    averaged total perpendicular plasma pressure and a toroidal magnetic-field reference,
    with no additional normalization beyond the pressure-to-magnetic-pressure ratio.
    [Normalized toroidal plasma beta](name:normalized_toroidal_plasma_beta) uses the
    same toroidal-field beta basis and applies an additional normalization, whereas
    [poloidal beta](name:poloidal_beta) instead uses a poloidal magnetic-pressure
    scale generated by the plasma current.'
  unit: '1'
  physics_domain: general
  links:
  - name:poloidal_beta
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/beta_tor_mhd/value
    version: 4.1.0
