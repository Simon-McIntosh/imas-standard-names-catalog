- name: toroidal_ion_state_momentum_damping_rate
  kind: scalar
  status: draft
  description: Rate coefficient for collisional or neoclassical damping of the toroidal
    phi component of fluid momentum for a specified ion charge state in the right-handed
    cylindrical (R, phi, Z) system.
  documentation: 'The toroidal ion state momentum damping rate is a charge-state-resolved
    effective relaxation coefficient for the toroidal component of ion fluid momentum.
    The toroidal direction is the direction of increasing angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ system, where $R$ is major radius and $Z$ is vertical
    height. In radial transport balances it is normally an effective flux-surface-averaged
    coefficient for the selected ion charge state, not a microscopic point-particle
    collision frequency.


    A common defining use is as the coefficient multiplying the toroidal momentum
    density in a radial flux-surface momentum balance written with a minor-radius-like
    flux-surface label $r$ measured in meters:


    $$

    \frac{\partial P_{\phi,q}}{\partial t}

    + \frac{1}{V''}\frac{\partial}{\partial r}\left(V''\Gamma_{\phi,q}^{r}\right)

    = S_{\phi,q} - \nu_{\phi,q} P_{\phi,q}

    $$


    where $\nu_{\phi,q}$ is the toroidal ion state momentum damping rate, $q$ labels
    the ion charge state, $P_{\phi,q}=m_i n_{i,q} v_{\phi,i,q}$ is the toroidal linear
    momentum density in $\mathrm{kg}\,\mathrm{m}^{-2}\,\mathrm{s}^{-1}$, $m_i$ is
    ion mass in $\mathrm{kg}$, $n_{i,q}$ is charge-state density in $\mathrm{m}^{-3}$,
    and $v_{\phi,i,q}$ is toroidal fluid velocity in $\mathrm{m}\,\mathrm{s}^{-1}$.
    Also, $V''=dV/dr$ is differential plasma volume per unit $r$ in $\mathrm{m}^{2}$,
    $\Gamma_{\phi,q}^{r}$ is the radial flux of toroidal momentum in $\mathrm{kg}\,\mathrm{m}^{-1}\,\mathrm{s}^{-2}$,
    and $S_{\phi,q}$ represents non-damping sources of toroidal momentum density in
    $\mathrm{kg}\,\mathrm{m}^{-2}\,\mathrm{s}^{-2}$. A dissipative damping model has
    $\nu_{\phi,q}\ge 0$; a negative value would represent an effective toroidal momentum
    drive rather than damping.


    The rate is usually inferred or prescribed in transport modeling rather than measured
    directly. It may be computed from Coulomb collision operators, neoclassical viscosity
    closures, charge-state-resolved impurity momentum exchange, or reduced relaxation
    models. It is the toroidal component of [ion_state_momentum_damping_rate](name:ion_state_momentum_damping_rate),
    the charge-state-resolved counterpart of [toroidal_ion_momentum_damping_rate](name:toroidal_ion_momentum_damping_rate),
    and is analogous to [poloidal_ion_state_momentum_damping_rate](name:poloidal_ion_state_momentum_damping_rate),
    [radial_ion_state_momentum_damping_rate](name:radial_ion_state_momentum_damping_rate),
    and [parallel_ion_state_momentum_damping_rate](name:parallel_ion_state_momentum_damping_rate).
    The corresponding electron momentum concept is represented by toroidal_electron_momentum_damping_rate.


    Typical effective values are highly model and regime dependent. In core tokamak
    transport studies they may range from near 0 to about $10^5$ s^-1; edge, impurity-rich,
    or strongly collisional cases, and models with different closure assumptions,
    can lie outside this broad range.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_state_momentum_damping_rate
  - name:radial_ion_state_momentum_damping_rate
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    status: attached
