- name: outer_radius_of_iron_core_segment
  kind: scalar
  status: active
  description: "Radius of an iron-core segment is the non-negative geometry radius\
    \ used to define its outer boundary in the poloidal cross-section of the right-handed\
    \ cylindrical (R, \u03C6, Z) frame about the toroidal symmetry axis."
  documentation: 'Radius of an iron-core segment is the non-negative geometry radius
    that defines the outer boundary of an annular iron-core region. This member specializes
    [radius of an iron-core segment](name:radius_of_iron_core_segment) to the outermost
    boundary measured from the toroidal symmetry axis. The relevant cross-section
    is the plane spanned by $R$ and $Z$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius measured from the toroidal symmetry axis
    and $Z$ is vertical height.


    The outer radius is the maximum major-radius coordinate on the cross-sectional
    boundary:


    $$

    r_{\rm out} = \max_{(R,Z)\in\partial A} R

    $$


    where $r_{\rm out}$ is the outer radius, $A$ is the iron-core cross-sectional
    region, and $\partial A$ is its boundary; $R$, $Z$, and $r_{\rm out}$ are expressed
    in meters.


    For annular geometry, the outer radius together with the [inner radius of an iron-core
    segment](name:inner_radius_of_iron_core_segment) determines the radial thickness
    through $r_{\rm out}-r_{\rm in}$. It is an axis-referenced outer extent, not the
    radius of a local circular arc about an explicit off-axis center or the full rectangular
    extent described by the [width of an iron-core segment](name:width_of_iron_core_segment).'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:width_of_iron_core_segment
  arguments:
  - name: radius_of_iron_core_segment
