- name: ammonia_deuterated_source_rate
  kind: scalar
  status: active
  description: Instantaneous molecular injection rate of deuterated ammonia (ND3)
    supplied to the plasma vessel by gas injection.
  documentation: 'This quantity is the rate at which deuterated ammonia (ND3) molecules
    are admitted to the plasma vessel by gas injection. It counts ND3 molecules directly
    rather than converting them to an equivalent-electron inventory.


    $$

    \dot{N}_{\mathrm{ND_3}}(t)=\frac{dN_{\mathrm{ND_3}}(t)}{dt}

    $$


    where $N_{\mathrm{ND_3}}(t)$ is the cumulative number of injected ND3 molecules
    and $t$ is time. The rate is distinct from the [ammonia source rate](name:ammonia_source_rate),
    which refers to NH3 molecules, and its time integral gives the injected molecular
    inventory represented by the [accumulated deuterated ammonia count](name:accumulated_ammonia_deuterated_count).'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_deuterated_count
  sources:
  - dd_path: summary/gas_injection_rates/ammonia_deuterated/value
