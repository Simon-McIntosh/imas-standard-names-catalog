    shape: component
- name: parallel_neutral_state_momentum_flux_limiter_coefficient
  kind: scalar
  status: draft
  description: Dimensionless flux-limiter coefficient that multiplies the field-aligned
    reference momentum-flux density for a neutral state in edge-plasma fluid transport.
    It changes the magnitude of the modeled parallel neutral momentum transport without
    defining its direction.
  documentation: 'The parallel neutral-state momentum coefficient is a dimensionless
    flux-limiter multiplier for the component of neutral momentum transport resolved
    along the local magnetic-field direction. It applies to a specified neutral state
    and modifies the magnitude of a reference field-aligned momentum-flux density
    used by a fluid closure; the coefficient itself does not carry a direction.


    A common closure interpretation is that the limited momentum-flux density is obtained
    by multiplying the reference value by this coefficient:


    $$

    \Pi_{\parallel,n}^{\mathrm{lim}} = C_{\parallel,n}^{\mathrm{mom}}\,\Pi_{\parallel,n}^{\mathrm{ref}}

    $$


    where $C_{\parallel,n}^{\mathrm{mom}}$ is this coefficient, $n$ labels the neutral
    state, and $\Pi_{\parallel,n}^{\mathrm{lim}}$ and $\Pi_{\parallel,n}^{\mathrm{ref}}$
    are the limited and reference parallel momentum-flux densities, both with units
    $\mathrm{N\,m^{-2}}$. The reference momentum-flux density is the signed value
    supplied by the un-limited closure, such as a free-streaming, convective, or diffusive
    estimate, before this multiplier is applied.


    The coefficient is normally specified by the transport model or inferred by calibration
    against kinetic neutral calculations and experimental constraints on edge density,
    pressure, and flow behavior. It is used to keep a fluid neutral momentum closure
    within a physically plausible range when mean-free paths become comparable to
    edge scale lengths.


    Typical values are 0-1. A value of 0 suppresses the reference parallel momentum
    flux, while 1 leaves it unchanged; values greater than 1 represent model-specific
    enhancement rather than flux limiting. Negative values are generally outside the
    physical domain because they reverse the reference momentum-flux density instead
    of limiting it.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: neutral_state_momentum_flux_limiter_coefficient
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: plasma_momentum_flux
  kind: vector
  status: draft
  description: Momentum-current vector carried by the plasma across an oriented surface
    per unit area. It is the contraction of the plasma momentum-flux tensor with the
    surface normal and includes convective flow, isotropic pressure, and viscous or
    turbulent stress contributions.
  documentation: 'Plasma momentum flux is the vector flux of bulk plasma linear momentum
    through an oriented surface per unit area. It represents the traction-like momentum
    current obtained by applying the rank-2 plasma momentum-flux tensor to the surface
    unit normal; its direction gives the component of momentum being transported,
    while the chosen normal defines the surface through which transport is evaluated.


    For a single-fluid plasma, the momentum-current vector through a surface with
    unit normal $\hat{\mathbf{n}}$ is commonly written as


    $$

    \boldsymbol{\Gamma}_{p}(\hat{\mathbf{n}}) = \left(\rho_m\,\mathbf{u}\otimes\mathbf{u}
    + p\,\mathbf{I} + \boldsymbol{\pi}\right)\cdot\hat{\mathbf{n}}

    $$


    where $\boldsymbol{\Gamma}_{p}$ has units of kg.m^-1.s^-2, $\rho_m$ is the plasma
    mass density in kg.m^-3, $\mathbf{u}$ is the bulk plasma velocity in m.s^-1, $\mathbf{u}\otimes\mathbf{u}$
    is the dyadic convective momentum transport, $p$ is the scalar plasma pressure
    in Pa, $\mathbf{I}$ is the identity tensor, $\boldsymbol{\pi}$ is the viscous
    or turbulent stress tensor in Pa, and $\hat{\mathbf{n}}$ is a dimensionless unit
    normal. Contracting the rank-2 tensor with one unit normal yields a vector, not
    a scalar; scalar directional fluxes are obtained by an additional projection,
    as in [parallel_plasma_momentum_flux](name:parallel_plasma_momentum_flux).


    In edge and scrape-off-layer plasma modeling this quantity is usually computed
    from fluid moments, kinetic closures, or turbulence simulations rather than measured
    directly. Components are often resolved in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height; neutral analogs
    such as toroidal_neutral_momentum_flux describe momentum transport by neutral
    particles rather than by the charged plasma fluid.


    Typical edge and scrape-off-layer magnitudes are about 0.01-1000 kg.m^-1.s^-2,
    depending strongly on density, temperature, flow speed, turbulence level, and
    magnetic geometry. Values approaching 10^5 kg.m^-1.s^-2 can occur locally in high-pressure-gradient
    pedestal regions, strong divertor flows, or transient edge events.


    Sign convention: Positive when a component of the momentum-current vector points
    in the positive direction of its specified basis vector after the momentum-flux
    tensor is contracted with the chosen oriented surface normal.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_plasma_momentum_flux
  arguments:
  - name: momentum_flux
    operator: plasma
    operator_kind: qualifier
  sources:
  - id: derived:plasma_momentum_flux
    status: composed
- name: parallel_plasma_momentum_flux
  kind: scalar
  status: draft
  description: Parallel plasma momentum flux is the double projection of the charged-plasma
    momentum-flux tensor along the local magnetic-field direction. It includes bulk-flow
    transport of parallel momentum, isotropic pressure, and parallel viscous or anisotropic
    stress.
  documentation: 'Parallel plasma momentum flux is the component of the charged-plasma
    momentum-flux tensor obtained by projecting both tensor indices along the local
    magnetic-field direction. It represents the effective pressure-like transport
    of parallel momentum through a surface normal to the field, including streaming
    inertia, thermodynamic pressure, and parallel viscous stress. Because it is a
    double projection, it is unchanged by reversing the sign chosen for the magnetic-field
    unit vector and should not be interpreted as a one-way directed flux.


    For charged species $s$, the total parallel component is


    $$

    \Phi_{\parallel,\mathrm{plasma}} = \hat{\mathbf{b}}\cdot\left[\sum_{s\in\mathrm{charged}}\left(\rho_s\mathbf{u}_s\mathbf{u}_s
    + p_s\mathbf{I} + \boldsymbol{\pi}_s\right)\right]\cdot\hat{\mathbf{b}} = \sum_{s\in\mathrm{charged}}\left(\rho_s
    u_{\parallel s}^2 + p_s + \pi_{\parallel\parallel s}\right)

    $$


    where $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is dimensionless, $\rho_s$ is
    mass density in $\mathrm{kg\,m^{-3}}$, $\mathbf{u}_s\mathbf{u}_s$ is the dyadic
    product of the flow velocity with itself, $\mathbf{u}_s$ is in $\mathrm{m\,s^{-1}}$,
    $u_{\parallel s}=\mathbf{u}_s\cdot\hat{\mathbf{b}}$, $p_s$ is scalar pressure
    in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $\mathbf{I}$ is the identity tensor, $\boldsymbol{\pi}_s$
    is the viscous or anisotropic stress tensor in $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    and $\pi_{\parallel\parallel s}=\hat{\mathbf{b}}\cdot\boldsymbol{\pi}_s\cdot\hat{\mathbf{b}}$.
    The $\rho_s u_{\parallel s}^2$ term is mean-flow advective transport; a Reynolds-stress
    contribution from turbulent velocity fluctuations would be a separate modeled
    closure.


    In edge-plasma modeling this quantity is computed from charged-species density,
    parallel flow, scalar pressure, and a closure or kinetic evaluation of the parallel
    stress. Experimentally, its components are constrained by density and temperature
    measurements, spectroscopic flow measurements, probes where applicable, and momentum-balance
    analysis; the viscous or anisotropic stress contribution is often inferred rather
    than directly measured. The neutral counterpart resolved by neutral state is [parallel_neutral_state_momentum_flux](name:parallel_neutral_state_momentum_flux).


    Typical magnitudes in scrape-off-layer and divertor plasmas are 0.1-10^4 kg m^-1
    s^-2. Attached edge conditions commonly give 10-10^3 kg m^-1 s^-2, while cold
    detached regions can be below 10 kg m^-1 s^-2 and short transients or high-recycling
    divertor conditions can reach 10^4 kg m^-1 s^-2 or more.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_momentum_flux
  - name:parallel_center_of_mass_velocity
  - name:parallel_neutral_momentum_flux
  arguments:
  - name: plasma_momentum_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: plasma_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Signed scalar component of the bulk plasma center-of-mass velocity
    associated with diamagnetic drift. It represents the mass-weighted sum of species
    diamagnetic drift velocities caused by pressure gradients perpendicular to the
    magnetic field, with direction retained through the component sign.
  documentation: 'Plasma velocity due to diamagnetic drift is the center-of-mass flow
    component associated with pressure-gradient drifts of the charged species in a
    magnetized plasma. It is a signed projection of the bulk diamagnetic-drift vector
    onto a specified unit direction, not a direction-free speed; the corresponding
    magnitude is [bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude](name:bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude).


    The scalar component is defined from the mass-weighted species drift sum:


    $$

    v_{\mathrm{dia,cm},\hat{e}} = \hat{e}\cdot\frac{\sum_s m_s n_s \mathbf{v}_{\mathrm{dia},s}}{\sum_s
    m_s n_s}, \qquad \mathbf{v}_{\mathrm{dia},s} = \frac{\mathbf{B}\times\nabla p_s}{q_s
    n_s B^2}

    $$


    where $\hat{e}$ is the dimensionless unit direction of the resolved component,
    $s$ indexes charged species, $m_s$ is species mass in kg, $n_s$ is number density
    in m$^{-3}$, $p_s$ is scalar pressure in Pa, $q_s$ is signed charge in C, $\mathbf{B}$
    is magnetic field in T, and $B=|\mathbf{B}|$. The species sum is mass weighted,
    so in ordinary electron-ion plasmas the bulk flow is usually dominated by the
    ion pressure-gradient contribution rather than by the total pressure that drives
    the diamagnetic current.


    In practice, the vector is computed from measured or reconstructed species pressure
    profiles and the magnetic-field geometry, then projected onto the chosen component
    direction. Edge charge-exchange spectroscopy, probe measurements, Thomson scattering,
    and equilibrium reconstruction can constrain the input pressures, gradients, and
    fields, but the diamagnetic component is usually inferred rather than observed
    as an isolated flow.


    Typical component magnitudes in edge plasmas are 10^2-10^4 m.s^-1, increasing
    to several 10^4 m.s^-1 or occasionally about 10^5 m.s^-1 in steep-gradient pedestal
    or scrape-off-layer conditions. Values scale roughly with pressure-gradient strength
    and inversely with magnetic-field strength and species charge.


    Sign convention: Positive when the bulk diamagnetic-drift velocity vector has
    a component in the positive sense of the specified unit direction $\hat{e}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:velocity_due_to_diamagnetic_drift
  - name:momentum_flux_due_to_diamagnetic_drift
  arguments:
  - name: velocity_due_to_diamagnetic_drift
    operator: plasma
    operator_kind: qualifier
- name: poloidal_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Poloidal component of the current density arising from heat-viscosity
    terms in a collisional edge-plasma closure.
  documentation: 'Poloidal current density due to heat viscosity is the component
    of the heat-viscosity current density tangent to a flux surface in the poloidal
    direction of the flux coordinate system $(\rho,\theta,\phi)$. It isolates the
    part of the electric current density attributed to heat-flux-related viscous stress
    terms in a collisional edge-fluid closure.


    The component is defined by projecting the heat-viscosity current density onto
    the poloidal unit direction:


    $$

    j_{\theta}^{\mathrm{hv}} = \mathbf{j}^{\mathrm{hv}} \cdot \hat{\mathbf{e}}_{\theta}

    $$


    where $j_{\theta}^{\mathrm{hv}}$ is the poloidal component in A m$^{-2}$, $\mathbf{j}^{\mathrm{hv}}$
    is the heat-viscosity current-density vector in A m$^{-2}$, and $\hat{\mathbf{e}}_{\theta}$
    is the dimensionless unit vector in the direction of increasing poloidal angle
    $\theta$ in the flux coordinate system $(\rho,\theta,\phi)$.


    In edge-fluid models, $\mathbf{j}^{\mathrm{hv}}$ is usually a closure-derived
    contribution rather than a directly measured diagnostic quantity. It is associated
    with the divergence of a heat-flux-dependent viscous stress tensor, commonly represented
    at the species level by $\nabla\cdot\boldsymbol{\Pi}^{\mathrm{hv}}_s$ in momentum
    balance, where $\boldsymbol{\Pi}^{\mathrm{hv}}_s$ is a stress tensor and its divergence
    is a force density. The exact constitutive coefficients, species weighting, and
    metric factors depend on the collisional closure and on the chosen flux coordinates.


    No universal numerical range is intrinsic to this term. Reported magnitudes should
    be interpreted relative to the total current density and to related viscosity-driven
    components; the value can be zero when the heat-viscosity closure is not included
    and can vary strongly with edge gradients, collisionality, magnetic geometry,
    and plasma regime.


    Sign convention: Positive when the heat-viscosity current density points in the
    direction of increasing poloidal angle $\theta$ in the flux coordinate system
    $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_heat_viscosity
  - name:poloidal_current_density_due_to_parallel_viscosity
  - name:poloidal_current_density_due_to_perpendicular_viscosity
  - name:diamagnetic_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_heat_viscosity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: "Poloidal component of the electric current density produced by ion-neutral\
    \ frictional momentum exchange, resolved along increasing poloidal angle \u03B8\
    \ in flux coordinates (\u03C1, \u03B8, \u03C6)."
  documentation: 'Poloidal current density due to ion-neutral friction is the component
    of the ion-neutral-friction current density in the direction of increasing poloidal
    angle $\theta$ in flux coordinates $(\rho,\theta,\phi)$. The poloidal direction
    lies in the poloidal cross-section described by the right-handed cylindrical $(R,\phi,Z)$
    frame at fixed $\phi$ and is tangent to a magnetic surface; radial, toroidal,
    and parallel projections describe related components of the same friction-driven
    current contribution.


    The component is defined by projection of the ion-neutral-friction current density
    vector onto the local poloidal unit direction:


    $$

    j_{\theta}^{(in)} = \mathbf{j}^{(in)} \cdot \hat{\mathbf{e}}_{\theta}

    $$


    where $j_{\theta}^{(in)}$ is this scalar current density in $\mathrm{A\,m^{-2}}$,
    $\mathbf{j}^{(in)}$ is the ion-neutral-friction current density vector in $\mathrm{A\,m^{-2}}$,
    and $\hat{\mathbf{e}}_{\theta}$ is the dimensionless unit vector in the direction
    of increasing $\theta$. The underlying momentum-transfer source is commonly represented
    by an ion-neutral friction force density $\mathbf{R}_{in}=\sum_i m_i n_i \nu_{in}(\mathbf{u}_n-\mathbf{u}_i)$,
    where $m_i$ is ion mass in kg, $n_i$ is ion number density in $\mathrm{m^{-3}}$,
    $\nu_{in}$ is an effective ion-neutral momentum-transfer frequency in $\mathrm{s^{-1}}$,
    and $\mathbf{u}_n$ and $\mathbf{u}_i$ are neutral and ion fluid velocities in
    $\mathrm{m\,s^{-1}}$. The conversion from this force density to $\mathbf{j}^{(in)}$
    depends on the charged-species momentum balance, electromagnetic geometry, and
    transport closure; no universal algebraic cross-product formula is implied.


    This quantity is usually obtained from edge plasma fluid, kinetic-fluid, or coupled
    plasma-neutral calculations rather than measured directly. Multispecies ion and
    neutral populations contribute through their individual momentum-transfer rates,
    including elastic scattering and charge exchange, and the reported scalar is the
    sum of the corresponding current contributions after projection onto $\hat{\mathbf{e}}_{\theta}$.
    It is the poloidal member of the component decomposition that also includes [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction),
    [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction),
    and [parallel_current_density_due_to_ion_neutral_friction](name:parallel_current_density_due_to_ion_neutral_friction);
    it is narrower than [poloidal_current_density_due_to_collisions](name:poloidal_current_density_due_to_collisions),
    which includes broader collisional current contributions.


    Typical modeled magnitudes in partially ionized scrape-off-layer and divertor
    plasmas are order $0.1-100\ \mathrm{A\,m^{-2}}$, with localized high-recycling
    or detached regions sometimes reaching order $10^2-10^3\ \mathrm{A\,m^{-2}}$.
    In hotter, more fully ionized regions the ion-neutral-friction contribution is
    usually negligible compared with other current-density terms.


    Sign convention: Positive when the ion-neutral-friction current density has a
    component in the direction of increasing poloidal angle $\theta$ in flux coordinates
    $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: "Poloidal component of the current density arising from perpendicular\
    \ viscosity effects in the plasma momentum balance. It represents the part of\
    \ the viscosity-driven drift current parallel to increasing \u03B8 in a flux-coordinate\
    \ system (\u03C1, \u03B8, \u03C6)."
  documentation: 'Poloidal current density due to perpendicular viscosity is the component,
    along the poloidal direction of a flux-coordinate system $(\rho,\theta,\phi)$,
    of the electric current density driven by the divergence of the perpendicular
    viscous stress tensor. The perpendicular viscous stress represents momentum transport
    associated with velocity shear perpendicular to the local magnetic field, and
    its divergence acts as a force density in the perpendicular momentum balance.


    The viscosity-driven current density and its poloidal projection are defined by:


    $$

    j_\theta^{\Pi_\perp} = \hat{\mathbf{e}}_\theta \cdot \mathbf{j}^{\Pi_\perp}, \qquad

    \mathbf{j}^{\Pi_\perp} = \frac{\mathbf{B} \times (\nabla \cdot \boldsymbol{\Pi}_\perp)}{B^2}

    $$


    where $j_\theta^{\Pi_\perp}$ and $\mathbf{j}^{\Pi_\perp}$ are current densities
    in A m^-2, $\hat{\mathbf{e}}_\theta$ is the dimensionless unit vector in the increasing-$\theta$
    direction, $\mathbf{B}$ is the magnetic field in T, $B=|\mathbf{B}|$, $\boldsymbol{\Pi}_\perp$
    is the perpendicular viscous stress tensor, and $\nabla \cdot \boldsymbol{\Pi}_\perp$
    is a force density in N m^-3.


    This quantity is usually obtained from edge plasma fluid or kinetic-fluid calculations
    rather than measured directly. It depends on the chosen viscosity model, collisionality,
    magnetic geometry, and gradients of density, temperature, and flow, and it is
    combined with other viscosity-related contributions such as [poloidal_current_density_due_to_parallel_viscosity](name:poloidal_current_density_due_to_parallel_viscosity)
    and [poloidal_current_density_due_to_heat_viscosity](name:poloidal_current_density_due_to_heat_viscosity)
    to form [poloidal_current_density_due_to_viscosity](name:poloidal_current_density_due_to_viscosity).


    Typical modeled magnitudes in edge and scrape-off-layer conditions range from
    below 1 A m^-2 to 10^3 A m^-2, with larger localized values possible near strong
    flow shear, steep pressure gradients, or material boundaries.


    Sign convention: Positive when the current density points in the direction of
    increasing poloidal angle $\theta$ in the flux-coordinate system $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_current_density_due_to_parallel_viscosity
  - name:poloidal_current_density_due_to_heat_viscosity
  - name:poloidal_current_density_due_to_viscosity
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  arguments:
  - name: current_density_due_to_perpendicular_viscosity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_electron_diffusivity
  kind: scalar
  status: draft
  description: "Effective scalar diffusion coefficient for electron particle transport\
    \ along the poloidal angle in flux coordinates (\u03C1, \u03B8, \u03C6). It multiplies\
    \ the metric-scaled electron-density gradient to give the diffusive flux component,\
    \ with that flux component taken positive toward increasing \u03B8."
  documentation: 'Poloidal electron diffusivity is an effective scalar transport coefficient
    for electron particles along the poloidal direction on a magnetic flux surface.
    In flux coordinates $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$
    is the poloidal angle, and $\phi$ is the toroidal angle, it quantifies how a poloidal
    electron-density gradient drives a diffusive particle flux.


    The local Fick-law convention for the physical poloidal flux component is:


    $$

    \Gamma^{\mathrm{diff}}_{e,\theta} = -D_{e,\theta}\,\frac{1}{h_\theta}\frac{\partial
    n_e}{\partial \theta}

    $$


    where $D_{e,\theta}$ is the poloidal electron diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Gamma^{\mathrm{diff}}_{e,\theta}$ is the diffusive electron particle flux in
    $\mathrm{m^{-2}\,s^{-1}}$, $n_e$ is the electron density in $\mathrm{m^{-3}}$,
    and $h_\theta = |\partial \mathbf{x}/\partial\theta|$ is the metric scale factor
    in meters converting an increment $d\theta$ at fixed $\rho$ and $\phi$ into poloidal
    distance. The flux component is taken positive in the local direction of increasing
    $\theta$; for $D_{e,\theta}>0$, the flux is down the metric-scaled density gradient.


    This coefficient is not normally measured directly. It is inferred or prescribed
    by combining electron density information with particle-balance constraints and
    an assumed separation between diffusive transport and other contributions such
    as convection, sources, sinks, and parallel losses.


    No universal numerical range is fixed by the definition, because the value is
    an effective transport coefficient and depends on the plasma state and on how
    non-diffusive transport is represented. Non-negative values correspond to a dissipative
    down-gradient diffusive closure, while zero gives no diffusive poloidal electron
    particle flux from a finite poloidal density gradient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_electron_diffusion_coefficient
  - name:poloidal_ion_diffusivity
  - name:poloidal_electron_energy_diffusivity
  arguments:
  - name: electron_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_electron_energy_diffusivity
  kind: scalar
  status: draft
  description: Poloidal electron energy diffusivity is the effective scalar transport
    coefficient for diffusive spreading of electron thermal energy along the poloidal
    direction on a magnetic surface. It relates the poloidal heat-flux projection
    to the local poloidal electron-temperature gradient.
  documentation: 'Poloidal electron energy diffusivity is an effective scalar coefficient
    for conductive transport of electron thermal energy in the poloidal direction
    on a magnetic surface. It represents the diffusive part of the electron energy
    transport closure, distinct from convective heat flow, particle-energy convection,
    radiation, and volumetric sources.


    In a local Fickian heat-flux closure using flux coordinates $(\rho, \theta, \phi)$,
    where $\theta$ is the chosen poloidal angle and $\phi$ is the toroidal angle of
    the right-handed cylindrical $(R, \phi, Z)$ frame with $R$ major radius and $Z$
    vertical height, the scalar poloidal projection can be written as:


    $$

    q_{e,\theta}^{\mathrm{cond}} = - n_e e\, \chi_{e,\theta}\, \hat{\mathbf{e}}_\theta
    \cdot \nabla T_e

    $$


    where $q_{e,\theta}^{\mathrm{cond}}$ is the conductive electron heat-flux component
    in W m$^{-2}$, $n_e$ is electron density in m$^{-3}$, $e$ is the elementary charge
    magnitude in J eV$^{-1}$, $\chi_{e,\theta}$ is the poloidal electron energy diffusivity
    in m$^2$ s$^{-1}$, $T_e$ is electron temperature in eV, and $\hat{\mathbf{e}}_\theta
    \cdot \nabla T_e$ is the temperature gradient per unit length in the direction
    of increasing $\theta$, in eV m$^{-1}$. If $T_e$ is expressed directly as an energy
    in joules, the conversion factor $e$ is omitted. The minus sign gives heat flow
    toward lower electron temperature; the coefficient itself is the scalar multiplying
    this projected gradient.


    The coefficient is usually prescribed or inferred in edge-fluid and transport
    modeling by matching electron temperature, density, and heat-flux balances. It
    may summarize unresolved collisional, turbulent, or numerical transport only within
    the limits of a local diffusive closure; nonlocal, off-diagonal, or advective
    transport should be represented by separate model terms rather than folded into
    this scalar coefficient.


    Typical modeled edge-plasma values are highly regime- and closure-dependent. Values
    of order 0.01-10 m^2.s^-1 are common in reduced transport descriptions, while
    broader phenomenological scans may extend from near zero to about 100 m^2.s^-1
    when enhanced effective transport is being represented.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_electron_diffusivity
  arguments:
  - name: electron_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective scalar diffusion coefficient for poloidal transport of ion
    thermal energy. In a diffusive closure, it multiplies the poloidal gradient of
    ion energy density to give the down-gradient ion energy flux.
  documentation: 'Poloidal ion energy diffusivity is an effective scalar transport
    coefficient for diffusive redistribution of ion thermal energy along the poloidal
    direction. The poloidal direction is tangent to increasing poloidal angle $\theta$
    at fixed radial flux coordinate $\rho$ and toroidal angle $\phi$ in a flux-coordinate
    representation $(\rho, \theta, \phi)$. It characterizes the ion energy channel
    and should be distinguished from aggregate total-ion or total-plasma energy transport
    coefficients when those channels are defined separately.


    A common local down-gradient closure for the diffusive poloidal ion energy flux
    is:


    $$

    q_{\theta,i}^{E,\mathrm{diff}} = -D_{\theta,i}^{E}\,\frac{\partial \varepsilon_i}{\partial
    l_\theta}

    $$


    where $q_{\theta,i}^{E,\mathrm{diff}}$ is the poloidal diffusive ion energy flux
    density in W.m^-2, $D_{\theta,i}^{E}$ is the poloidal ion energy diffusivity in
    m^2.s^-1, $\varepsilon_i$ is the ion thermal energy density in J.m^-3, and $l_\theta$
    is poloidal arclength in meters. For a Maxwellian ion population, $\varepsilon_i
    = 3p_i/2$, where $p_i$ is ion pressure; equivalently, $\varepsilon_i = 3n_iT_i/2$
    when $T_i$ is expressed as energy per particle. The minus sign means that a positive
    diffusivity drives the diffusive contribution from higher toward lower ion thermal
    energy density.


    In practice this coefficient is usually specified, fitted, or inferred within
    edge-plasma transport modeling from ion temperature, density, pressure, and heat-flux
    constraints rather than measured directly as a material property. It is the poloidal
    ion-energy analog of radial transport quantities such as radial_total_energy_diffusion_coefficient,
    [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity),
    and [radial_diffusion_coefficient](name:radial_ion_particle_diffusivity), and
    it is related to [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity) and
    [poloidal_ion_momentum_diffusivity](name:poloidal_ion_momentum_diffusivity) for
    particle and momentum transport in the same direction. Use [poloidal_total_ion_energy_diffusivity](name:poloidal_ion_energy_diffusivity)
    when the modeled coefficient applies to an aggregate total-ion energy channel.


    Typical effective values are strongly model and region dependent, with no universal
    range. Edge transport studies commonly explore broad values such as 0.01-100 m^2.s^-1;
    values near zero suppress modeled poloidal energy diffusion, while larger values
    more rapidly smooth poloidal variations of ion energy density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_particle_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_momentum_diffusivity
