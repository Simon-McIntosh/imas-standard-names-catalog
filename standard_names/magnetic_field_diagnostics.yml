    dd_path: magnetics/bpol_probe/position/r
    status: composed
- name: vertical_coordinate_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the physical location of a toroidal magnetic
    field probe in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z$ specifies the height of a toroidal magnetic
    field probe above the geometric midplane in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius measured from the toroidal symmetry
    axis and $Z$ is the vertical height. Toroidal magnetic field probes are inductive
    sensors deployed on or near the vacuum vessel to monitor the toroidal component
    $B_\phi$ of the magnetic field; precise knowledge of each probe''s spatial position
    is essential for interpreting the local field measurement and for incorporating
    the data into MHD equilibrium reconstruction.


    The $Z$ position is a fixed geometric attribute established by engineering survey
    during machine installation. Together with the corresponding major-radius and
    toroidal-angle coordinates, it fully specifies the three-dimensional location
    of the probe. This coordinate role is shared across other magnetic diagnostic
    components, such as [poloidal field coil] elements and [general measurement positions](name:vertical_coordinate_of_measurement_position)
    used in equilibrium reconstruction, and analogously for [lower hybrid antenna](name:vertical_coordinate_of_lower_hybrid_antenna)
    reference points.


    Sign convention: Positive when the probe is located above the geometric midplane,
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:vertical_coordinate_of_measurement_position
  - name:vertical_coordinate_of_lower_hybrid_antenna
  sources:
