- name: floating_electrostatic_potential
  kind: scalar
  status: draft
  description: Electrostatic potential acquired by an electrically isolated probe
    or surface when the net plasma current to it is zero.
  documentation: 'Floating electrostatic potential is the potential acquired by an
    electrically isolated material surface in contact with a plasma when the total
    collected current vanishes. It is usually displaced from the local plasma potential
    by a sheath drop governed mainly by electron temperature, ion mass, collecting
    geometry, and surface emission.


    The defining condition for the floating potential $V_f$ is zero net current to
    the surface:


    $$

    I_\mathrm{i}(V_f) + I_\mathrm{e}(V_f) = 0

    $$


    where $I_\mathrm{i}$ is the ion current and $I_\mathrm{e}$ is the electron current
    collected by the surface at potential $V_f$. For a Maxwellian plasma with ions
    collected near ion saturation, $V_f$ is commonly below the plasma potential $V_p$
    by a few electron-temperature volts; equivalently, $V_p - V_f$ is often about
    $2.5-4$ times $T_e$ when $T_e$ is expressed in eV, with the coefficient depending
    on ion species, effective collection area, magnetic-field incidence, and secondary-electron
    emission.


    Floating potential is measured directly with a high-impedance connection to an
    isolated Langmuir-probe electrode or inferred from the zero-current crossing of
    a probe current-voltage characteristic. Interpretation requires care because RF
    pickup, sheath expansion, temperature fluctuations, surface condition, and emitted
    electrons can shift the measured value relative to the local plasma potential.


    Typical values relative to grounded conducting structures are often -80 to -5
    V in limiter and scrape-off-layer edge conditions, while divertor, strongly biased,
    or RF-perturbed regions can reach about -200 to +50 V. The range is not universal
    because the value follows both the local plasma potential and the electron-temperature-dependent
    sheath drop.


    Sign convention: Positive when the floating surface potential is above the chosen
    electrical reference potential.'
  unit: V
  physics_domain: mechanical_measurement_diagnostics
  links:
