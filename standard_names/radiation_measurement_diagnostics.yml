- name: second_local_tangential_coordinate_of_bragg_crystal
  kind: scalar
  status: active
  description: Signed coordinate of a Bragg-crystal outline vertex along the second
    local tangential axis of the crystal-local Cartesian (X1, X2) frame.
  documentation: 'This quantity is the signed position of a vertex on the Bragg-crystal
    outline, resolved along the crystal-local second tangential direction. It describes
    the crystal geometry in the local planar Cartesian frame $(X_1, X_2)$ rather than
    in the machine cylindrical frame.


    For a vertex position vector $\mathbf{r}$ and local-frame origin $\mathbf{r}_0$,
    the coordinate is defined by:


    $$

    x_2 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_2

    $$


    where $x_2$ is the second local tangential coordinate, $\hat{\mathbf{e}}_2$ is
    the unit vector along the second local tangential axis, and $\mathbf{r}_0$ is
    the origin of the crystal-local frame. Together with the [first local tangential
    coordinate of the Bragg crystal](name:first_local_tangential_coordinate_of_bragg_crystal),
    it specifies the in-plane location of the outline vertex.


    Sign convention: Positive when the vertex displacement from the crystal-local
    origin has a positive projection along the second local tangential unit vector
    $\hat{\mathbf{e}}_2$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_bragg_crystal
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/crystal/outline/x2
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-outline-x2
    dd_documentation:
      leaf: Positions along x2 axis
      parent_path: spectrometer_x_ray_crystal/channel/crystal/outline
      parent: Irregular outline of the object in the (X1, X2) coordinate system, used
        only if geometry_type/index=1. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - spectrometer_x_ray_crystal/channel/crystal/outline/x1
    enhanced_context:
      description: Positions along the X2 axis defining the irregular outline of the
        crystal element in an X-ray crystal spectrometer channel, in the local (X1,
        X2) coordinate system. Together with X1 coordinates, this describes the crystal
        cross-sectional boundary.
      kind: llm
- name: second_local_tangential_coordinate_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Signed position of a vertex on a diagnostic-aperture boundary along
    the second tangent of the object-local (X1, X2) aperture-plane frame.
  documentation: 'The quantity is the signed second local tangential coordinate of
    a vertex on a diagnostic-aperture boundary. It locates the vertex within the aperture
    plane and, together with the first local tangential coordinate, defines the boundary
    geometry.


    The coordinate is defined by


    $$

    x_2 = (\mathbf{r} - \mathbf{r}_0) \cdot \mathbf{e}_2

    $$


    where $\mathbf{r}$ is the vertex position, $\mathbf{r}_0$ is the origin of the
    local aperture frame, and $\mathbf{e}_2$ is the second local tangential unit vector.
    The right-handed object-local basis $(\mathbf{e}_1, \mathbf{e}_2, \mathbf{e}_3)$
    uses $\mathbf{e}_3$ as the plasma-facing normal, $\mathbf{e}_1$ as the more-horizontal
    tangent directed toward increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, and $\mathbf{e}_2 = \mathbf{e}_3 \times \mathbf{e}_1$.


    The quantity applies only to the diagnostic-aperture boundary and is distinct
    from corresponding coordinates of filters, detector outlines, or other optical
    objects. The same local-axis convention is used by [second local tangential coordinate
    of filter](name:second_local_tangential_coordinate_of_filter).


    Sign convention: Positive when the vertex lies from the local origin in the direction
    of $\mathbf{e}_2 = \mathbf{e}_3 \times \mathbf{e}_1$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_local_tangential_coordinate_of_filter
  sources:
