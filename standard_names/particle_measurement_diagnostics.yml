- name: area_of_neutron_detector
  kind: scalar
  status: draft
  description: Surface area of a neutron detector hardware component, such as an active
    detection element or a collimating aperture, used to determine the geometric acceptance
    for incident neutron flux.
  documentation: 'The surface area $A_\mathrm{det}$ of the neutron detector defines
    the geometric cross-section presented to the incident neutron flux and is a key
    parameter for calculating the detector''s overall detection efficiency and solid
    angle of acceptance. Together with the detector''s distance from the plasma and
    its collimation geometry, this area determines the fraction of the total neutron
    emission that is intercepted. Typical detector areas in fusion neutron diagnostics
    range from a few square centimeters for compact scintillation or diamond detectors
    to several hundred square centimeters for large fission chambers or activation
    foil assemblies. The quantity is distinct from the active area of any internal
    converter material, which is described by `[area_of_neutron_detector_converter](name:area_of_neutron_detector_converter)`.


    Sign convention: Positive for all physically realizable detector surfaces, as
    area is a geometric property.


    Typical values in fusion diagnostics range from $10^{-4}\ \mathrm{m}^2$ for small
    fiber-coupled detectors to $0.1\ \mathrm{m}^2$ for large neutron flux monitors,
    depending on the required count rate and spatial resolution.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_neutron_detector_converter
  sources:
  - id: dd:neutron_diagnostic/detector/geometry/surface
    dd_path: neutron_diagnostic/detector/geometry/surface
    status: composed
  - id: dd:neutron_diagnostic/detectors/detector/surface
    dd_path: neutron_diagnostic/detectors/detector/surface
    status: composed
- name: area_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Active surface area of the converter material in a neutron detector,
    used to compute neutron-to-charged-particle conversion efficiency.
  documentation: 'The area of the neutron detector converter defines the active surface
    through which incident neutrons interact with the converter material to produce
    charged particles (e.g., protons, tritons) via nuclear reactions such as $^6\mathrm{Li}(n,\alpha)^3\mathrm{H}$.
    Together with the [nuclear density](name:nuclear_density_of_neutron_detector_converter)
    and [volume](name:volume_of_neutron_detector_converter) of the converter, this
    area enters the detection efficiency calculation: $\eta = n \sigma A_{\mathrm{conv}}
    d_{\mathrm{conv}}$, where $n$ is the nuclear number density, $\sigma$ the relevant
    cross-section, $A_{\mathrm{conv}}$ the converter area, and $d_{\mathrm{conv}}$
    the converter thickness. Typical converter areas for neutron cameras in present-day
    tokamaks range from 1-100 cm$^2$, depending on the detector design and required
    count-rate capability. This geometric parameter is determined during detector
    characterization and is stored for each detector channel.


    Sign convention: Positive when the surface is oriented outward from the converter
    material toward the incident neutron flux.


    The converter area is related to the detector''s [geometric acceptance](name:area_of_neutron_detector),
    which additionally accounts for collimation and viewing geometry.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:area_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/detector/surface
    dd_path: neutron_diagnostic/detectors/detector/surface
    status: composed
- name: dead_time_of_neutron_detector
  kind: scalar
  status: draft
  description: Minimum interval after a detected event during which the neutron detector
    cannot register a new event.
  documentation: 'The dead time of a neutron detector is the shortest time separation
    between two successive detected events such that the second event can be registered.
    This interval arises from the finite response time of the detector and its electronics,
    limiting the maximum count rate and causing count losses at high neutron fluxes.
    In fusion plasmas, typical dead times range from 0.1 to several microseconds,
    depending on detector technology (e.g., fission chambers, scintillators, diamond
    detectors). The dead time model (non-paralyzable or paralyzable) must be applied
    when correcting measured count rates for these losses. The related quantity [time_of_neutron_detector](name:time_of_neutron_detector)
    gives the integration time per spectrum slice, which together with dead time determines
    the effective duty cycle.


    Sign convention: Positive when the dead time interval is measured as a positive
    number of seconds.


    Dead times are used in the count-rate correction formula $R = C / (1 - C \tau)$
    for non-paralyzable detectors, where $R$ is the true count rate, $C$ the measured
    count rate, and $\tau$ the dead time.'
  unit: s
  physics_domain: particle_measurement_diagnostics
  links:
  - name:time_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/characteristics/dead_time
    dd_path: neutron_diagnostic/characteristics/dead_time
    status: composed
- name: deuterium_deuterium_emissivity
  kind: scalar
  status: draft
  description: Volumetric rate of 2.45 MeV neutrons produced by deuterium-deuterium
    fusion reactions in the plasma.
  documentation: "The deuterium-deuterium (DD) emissivity $\\epsilon_{\\mathrm{DD}}$\
    \ is the volumetric reaction rate density for the D(d,n)$^3$He fusion branch,\
    \ which produces a 2.45 MeV neutron and a $^3$He ion. It is given locally by $\\\
    epsilon_{\\mathrm{DD}} = n_D \\, n_D \\, \\langle \\sigma v \\rangle_{\\mathrm{DD}}\
    \ / (1+\\delta_{12})$, where $n_D$ is the deuterium density, $\\langle \\sigma\
    \ v \\rangle_{\\mathrm{DD}}$ is the Maxwellian-averaged reactivity for the DD\
    \ reaction, and the factor $(1+\\delta_{12})$ accounts for indistinguishability\
    \ of identical reactants. This emissivity profile is routinely reconstructed from\
    \ neutron camera measurements using tomographic inversion techniques. Core values\
    \ in a high-performance deuterium plasma can reach $10^{16}$\u2013$10^{17}$ m$^{-3}$s$^{-1}$,\
    \ depending on density and temperature. The total neutron source rate is obtained\
    \ by integrating the emissivity over the plasma volume, giving the [deuterium_deuterium_source_rate](name:deuterium_deuterium_source_rate).\
    \ For the DT fuel cycle, the analogous quantity is [deuterium_tritium_emissivity](name:deuterium_tritium_emissivity).\
    \ The [fusion_power](name:fusion_power) includes contributions from both DD and\
    \ DT reactions."
  unit: m^-3.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_deuterium_source_rate
  - name:deuterium_tritium_emissivity
  - name:fusion_power
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/emissivity_dd
    dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dd
    status: composed
- name: deuterium_deuterium_fusion_power_density
  kind: scalar
  status: draft
  description: Volumetric power density released as kinetic energy of charged fusion
    products and 2.45 MeV neutrons from deuterium-deuterium fusion reactions in the
    plasma.
  documentation: 'The deuterium-deuterium fusion power density quantifies the local
    rate of energy release from D(d,n)$^{3}$He and D(d,p)$^{3}$H reactions. Its defining
    relation is $P_{\mathrm{DD}} = \frac{1}{1+\delta_{12}} n_D^2 \langle \sigma v
    \rangle_{\mathrm{DD}} E_{\mathrm{DD}}$, where $n_D$ (m$^{-3}$) is the deuterium
    density, $\langle \sigma v \rangle_{\mathrm{DD}}$ (m$^3$s$^{-1}$) the Maxwellian-averaged
    reactivity, $E_{\mathrm{DD}} \approx 7.3$ MeV the total energy released per D-D
    fusion branch after accounting for the two-channel branching ratio, and $1+\delta_{12}$
    the statistical factor for identical reactants.


    This quantity is reconstructed from neutron emission measurements (neutron flux
    monitors, activation foils) combined with equilibrium density and temperature
    profiles via a forward model of the reactivity. In the core of high-performance
    D plasmas, typical values range from $10^3$ to $10^5$ W/m$^3$.


    The related standard name [deuterium_deuterium_emissivity](name:deuterium_deuterium_emissivity)
    gives the neutron production rate (particles per volume per time), while [deuterium_deuterium_source_rate](name:deuterium_deuterium_source_rate)
    integrates over the entire plasma volume. The deuterium-tritium counterpart is
    [deuterium_tritium_fusion_power_density](name:deuterium_tritium_fusion_power_density).'
  unit: W.m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_deuterium_emissivity
  - name:deuterium_deuterium_source_rate
  - name:deuterium_tritium_fusion_power_density
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fusion_power_dd
    dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dd
    status: composed
- name: deuterium_deuterium_source_rate
  kind: scalar
  status: draft
  description: Total neutron emission rate from deuterium-deuterium fusion reactions
    in the plasma, summing contributions from thermal, beam-thermal, and beam-beam
    reactions.
  documentation: "The deuterium-deuterium fusion source rate quantifies the total\
    \ 2.45 MeV neutron production from $D(d,n)^3He$ reactions, integrated over all\
    \ reaction channels (thermal-thermal, beam-thermal, and beam-beam). This rate\
    \ is a key fusion performance metric, directly proportional to the deuterium density\
    \ squared and the fusion reactivity $\bar{\\langle\\sigma v\\rangle}_{DD}$ in\
    \ the thermal plasma. Typical values range from $10^{12}$ to $10^{16}$ neutrons\
    \ per second in medium-sized tokamaks with neutral beam injection, measured using\
    \ neutron flux monitors (fission chambers, activation foils) and neutron cameras.\
    \ The total rate is the sum of [thermal_source_rate](name:thermal_source_rate)\
    \ and beam-driven components such as [deuterium_deuterium_beam_source_rate](name:deuterium_deuterium_beam_source_rate),\
    \ and is a subset of the overall [source_rate](name:source_rate) from all fusion\
    \ reactions.\n\nSign convention: Positive when the neutron emission rate is directed\
    \ outward from the plasma (net production)."
  unit: Hz
  physics_domain: particle_measurement_diagnostics
  links:
  - name:thermal_source_rate
  - name:deuterium_deuterium_beam_source_rate
  - name:source_rate
  sources:
  - id: dd:summary/fusion/neutron_fluxes/dd/total/value
    dd_path: summary/fusion/neutron_fluxes/dd/total/value
    status: composed
  - id: dd:summary/fusion/neutron_rates/dd/total/value
    dd_path: summary/fusion/neutron_rates/dd/total/value
    status: composed
- name: deuterium_tritium_emissivity
  kind: scalar
  status: draft
  description: Volumetric rate of 14.1 MeV neutrons produced by deuterium-tritium
    fusion reactions in the plasma.
  documentation: "This quantity represents the local volumetric neutron emissivity\
    \ $\frac{dN_{14.1}}{dV dt}$ from deuterium-tritium (DT) fusion, yielding 14.1\
    \ MeV neutrons. It is the product of the thermal reactivities and densities of\
    \ the deuterium and tritium populations integrated over their velocity distributions,\
    \ $\text{Emissivity}_{\text{DT}} = n_D n_T \frac{\bar{\tau}v}{\text{DT}}$, where\
    \ $n_D$ and $n_T$ are the deuterium and tritium densities (in $\text{m}^{-3}$)\
    \ and $\bar{\tau}v_{\text{DT}}$ is the Maxwellian-averaged fusion reactivity (in\
    \ $\text{m}^3\text{s}^{-1}$). Typical core values in ITER-baseline DT plasmas\
    \ are $1\times10^{17}$ to $1\times10^{19}\text{ m}^{-3}\text{s}^{-1}$, with the\
    \ peak near the magnetic axis. The emissivity profile is routinely reconstructed\
    \ from line-integrated neutron measurements using tomographic inversion of arrays\
    \ of neutron detectors (e.g., diamond detectors or liquid scintillators) and provides\
    \ a source term for neutronics calculations. See [deuterium_deuterium_emissivity](name:deuterium_deuterium_emissivity)\
    \ for the companion DD 2.45 MeV channel and [deuterium_tritium_source_rate](name:deuterium_tritium_source_rate)\
    \ for the integrated total DT neutron rate."
  unit: m^-3.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_deuterium_emissivity
  - name:deuterium_tritium_source_rate
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/emissivity_dt
    dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dt
    status: composed
- name: deuterium_tritium_fusion_power_density
  kind: scalar
  status: draft
  description: Volumetric thermal power released by deuterium-tritium fusion reactions
    in a magnetically confined plasma.
  documentation: "The deuterium-tritium fusion power density $P_{\\mathrm{DT}} = n_{\\\
    mathrm{D}}n_{\\mathrm{T}} \\langle \\sigma v \\rangle_{\\mathrm{DT}} E_{\\alpha}$\
    \ quantifies the local heating power per unit volume from DT reactions, where\
    \ $n_{\\mathrm{D}}$ and $n_{\\mathrm{T}}$ are the deuterium and tritium densities\
    \ in m$^{-3}$, $\\langle \\sigma v \\rangle_{\\mathrm{DT}}$ is the Maxwellian-averaged\
    \ DT fusion reactivity in m$^3$ s$^{-1}$, and $E_{\\alpha} = 3.52\\,\\mathrm{MeV}$\
    \ is the energy of the fusion-born alpha particle. This quantity represents the\
    \ dominant alpha-heating source in burning-plasma scenarios and is routinely reconstructed\
    \ from 14.1-MeV neutron emissivity measurements via collimated neutron cameras\
    \ or activation systems. In ITER-relevant DT plasmas with core densities of $10^{20}\\\
    ,\\mathrm{m}^{-3}$ and temperatures near 10\u201320 keV, the peak fusion power\
    \ density can approach several MW m$^{-3}$. The related quantity [deuterium_tritium_emissivity](name:deuterium_tritium_emissivity)\
    \ gives the volumetric rate of 14.1-MeV neutron production, while [deuterium_deuterium_fusion_power_density](name:deuterium_deuterium_fusion_power_density)\
    \ describes the analogous quantity for DD reactions."
  unit: W.m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_tritium_emissivity
  - name:deuterium_deuterium_fusion_power_density
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fusion_power_dt
    dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dt
    status: composed
- name: energy_of_neutron_detector
  kind: scalar
  status: draft
  description: Discrete neutron energy values defining the sampling points within
    an energy band of a neutron detector.
  documentation: 'The energy-of-neutron-detector provides the discrete energy grid
    $E_i$ (in eV) that defines the sampling points within an energy band of a neutron
    detector system. These energy values serve as the independent variable for the
    energy-resolved neutron flux incident on the detector, enabling spectral discrimination
    between fusion neutron sources such as DD (2.45 MeV) and DT (14.1 MeV) reactions.
    The energy sampling is typically chosen to match the detector intrinsic energy
    resolution and the width of the energy band being measured. The associated energy-resolved
    measurement quantity is [neutron_flux](name:neutron_flux), which gives the neutron
    flux per energy interval at each sampling point.


    Sign convention: Positive when the energy value increases with the index of the
    sampling array.


    Typical energy values range from 1 keV to 20 MeV for fusion neutron diagnostics,
    with finer sampling near the fusion peak energies to resolve the neutron spectrum
    shape.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux
  sources:
  - id: dd:neutron_diagnostic/detector/energy_band/energies
    dd_path: neutron_diagnostic/detector/energy_band/energies
    status: composed
  - id: dd:neutron_diagnostic/unit_source/radiation/reaction/energy
    dd_path: neutron_diagnostic/unit_source/radiation/reaction/energy
    status: composed
- name: gradient_of_neutron_flux
  kind: scalar
  status: draft
  description: Radial-poloidal cross-derivative of the neutron flux Green's function
    response matrix element, describing the spatial sensitivity of a detector to a
    unit ring source in the plasma.
  documentation: The gradient of neutron flux, $\nabla G_{ij}$, is the spatial derivative
    of the neutron flux per source neutron Green's function $G_{ij}$ with respect
    to the source position in the plasma. It quantifies how the detector response
    changes when the unit ring source is displaced radially or vertically, and is
    a key kernel quantity for tomographic reconstruction of the neutron emission profile
    from line-integrated measurements. In the IMAS cylindrical $(R, \phi, Z)$ frame,
    the cross-derivative $\partial^2 G_{ij} / (\partial R \, \partial Z)$ represents
    the mixed sensitivity; typical values are of order $10^{-4}\,\text{m}^{-4}$ for
    a compact neutron camera viewing a medium-size tokamak plasma. This quantity is
    computed from the same geometric and collimator model as the parent quantity [neutron_flux](name:neutron_flux),
    but differentiated analytically or numerically over the source grid, and is used
    in maximum-likelihood or Bayesian tomographic inversion algorithms.
  unit: m^-4
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux
  arguments:
  - name: neutron_flux
    operator: gradient
    operator_kind: unary_prefix
  sources:
  - id: dd:neutron_diagnostic/unit_source/radiation/reaction/d2flux_drdz
    dd_path: neutron_diagnostic/unit_source/radiation/reaction/d2flux_drdz
    status: composed
- name: major_radius_of_beam_tracing_point
  kind: scalar
  status: draft
  description: "Major radius coordinate of the third defining point of a diagnostic\
    \ line of sight in the cylindrical (R, \u03C6, Z) frame."
  documentation: 'The major radius $R_3$ of the third point that defines a diagnostic
    line of sight in the right-handed cylindrical $(R, \phi, Z)$ frame, completing
    the set of two points that specify a straight chord. This point lies on the ray
    path of a beam tracing diagnostic. It is used together with the first two points
    to fully define the geometry of the line of sight, enabling accurate calculation
    of the viewing direction and intersection with the plasma volume. Typical values
    span the tokamak minor-to-major radius range, e.g., 1.5--3.0 m for medium-size
    machines. The quantity is defined for each diagnostic beam tracing channel and
    can be obtained from the diagnostic engineering data. See [major_radius_of_measurement_position](name:major_radius_of_measurement_position)
    for the analogous first-point coordinate, and [toroidal_angle_of_line_of_sight](name:toroidal_angle_of_line_of_sight)
    for the toroidal orientation.


    Sign convention: Positive when the point lies at a larger major radius than the
    torus symmetry axis (R=0).'
  unit: m
