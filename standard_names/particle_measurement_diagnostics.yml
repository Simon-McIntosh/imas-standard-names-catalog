    dd_path: summary/line_average/n_i/krypton/value
    status: composed
- name: line_averaged_lithium_density
  kind: scalar
  status: draft
  description: Path-length average of the lithium impurity ion number density along
    a diagnostic line of sight. It sums all ionized lithium charge states and excludes
    neutral lithium.
  documentation: 'Line-averaged lithium density is the path-length average of the
    lithium impurity ion number density along a specified line of sight. The local
    lithium ion density is the sum over ionized lithium charge states, $n_{\mathrm{Li,ion}}
    = n_{\mathrm{Li}^+} + n_{\mathrm{Li}^{2+}} + n_{\mathrm{Li}^{3+}}$, and excludes
    neutral lithium atoms.


    For a chord of length $L$, the line average is defined by


    $$

    \langle n_{\mathrm{Li}} \rangle_{\mathrm{line}} = \frac{1}{L}\int_0^L n_{\mathrm{Li,ion}}(\ell)\,d\ell

    $$


    where $\ell$ is distance along the line of sight in meters, $L$ is the chord length
    in meters, $n_{\mathrm{Li,ion}}$ is the local summed ionized-lithium density in
    m^-3, and $\langle n_{\mathrm{Li}} \rangle_{\mathrm{line}}$ is in m^-3.


    In practice, this quantity may be inferred from a line-integrated lithium-sensitive
    measurement divided by the relevant chord length, or computed by integrating a
    reconstructed local lithium ion density along the same path. It provides a bulk
    chord measure of lithium impurity content and does not by itself resolve where
    along the line of sight the lithium ions are located.


    The value is non-negative and is typically interpreted relative to electron density
    or to other impurity densities, because lithium content depends strongly on wall
    conditioning, fueling, transport, and plasma scenario. No universal numerical
    range is implied by the definition.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:lithium_density
  - name:volume_averaged_lithium_density
  - name:lithium_fraction
  sources:
  - id: dd:summary/line_average/n_i/lithium/value
    dd_path: summary/line_average/n_i/lithium/value
    status: composed
- name: major_radius_of_neutron_detector
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the neutron detector center, measured
    as the perpendicular distance from the toroidal symmetry axis in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The major radius $R$ of the neutron detector specifies the perpendicular
    distance from the toroidal symmetry axis to the detector center (or aperture center)
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $\phi$ is the toroidal
    angle increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height. Together with [vertical_coordinate_of_neutron_detector](name:vertical_coordinate_of_neutron_detector),
    it fully locates the detector in the poloidal plane, determining the chord geometry
    that governs line-integrated neutron emission measurements and emissivity profile
    reconstructions.


    The major radius is related to Cartesian coordinates by:


    $$

    R = \sqrt{X^2 + Y^2}

    $$


    where $X$ and $Y$ are the horizontal Cartesian coordinates of the detector center
    in meters, with the origin placed on the toroidal symmetry axis.


    Detector positions are established from engineering surveys, photogrammetric alignment,
    or as-built design specifications; this is a fixed hardware coordinate rather
    than a plasma-state quantity. For aperture-type neutron diagnostics, this coordinate
    locates the collimating aperture center, consistent with the analogous quantity
    [major_radius_of_diagnostic_aperture](name:major_radius_of_diagnostic_aperture)
    and the pixel-level counterpart [major_radius_of_detector_pixel](name:major_radius_of_detector_pixel).


    Sign convention: Positive when the detector center lies at a nonzero perpendicular
    distance from the toroidal symmetry axis, which holds for all physically realizable
    detector positions since $R \geq 0$ by construction.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_neutron_detector
  - name:major_radius_of_diagnostic_aperture
  - name:major_radius_of_detector_pixel
  sources:
