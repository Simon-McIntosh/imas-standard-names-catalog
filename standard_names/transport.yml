- name: boron_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Boron ion number density at the location of the magnetic axis.
  documentation: 'The boron ion number density at the magnetic axis, $n_{\mathrm{B}}(R_{\mathrm{axis}},
    Z_{\mathrm{axis}})$, is the local concentration of fully ionized boron (B$^{5+}$)
    or other relevant charge states at the innermost flux surface. This quantity is
    a core plasma parameter that influences fuel dilution, radiative losses, and the
    impurity content in the plasma center. On-axis boron densities in tokamaks typically
    range from $10^{15}$ to $10^{19}\ \mathrm{m}^{-3}$, depending on wall conditioning
    (e.g., boronization), fueling, and transport conditions. The density is measured
    via charge-exchange recombination spectroscopy (CXRS) or inferred from passive
    spectroscopy, often in conjunction with transport modeling.


    Sign convention: Positive when the number density is a positive real number.


    Related quantities include [boron_density_at_pedestal](name:boron_density_at_pedestal),
    [boron_density_at_separatrix](name:boron_density_at_separatrix), and [line_averaged_boron_density](name:line_averaged_boron_density),
    which describe the same impurity species at different radial locations or along
    different measurement lines.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:boron_density_at_pedestal
  - name:boron_density_at_separatrix
  - name:line_averaged_boron_density
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/boron/value
    dd_path: summary/local/magnetic_axis/n_i/boron/value
    status: composed
- name: co_passing_fast_pressure
  kind: scalar
  status: draft
  description: Total isotropic fast (non-thermal) particle pressure from the co-passing
    population in the poloidal plane.
  documentation: The isotropic fast particle pressure $p_{\mathrm{fast,co}}$ from
    the co-passing population quantifies the kinetic energy density of suprathermal
    particles whose guiding-center orbits circulate in the direction of the plasma
    current, summed over all charge states. It is defined as $p_{\mathrm{fast,co}}
    = \frac{2}{3} \int \frac{1}{2} m v^2 f_{\mathrm{co}}(\mathbf{x},\mathbf{v})\,d^3v$,
    where $f_{\mathrm{co}}$ is the co-passing fast particle distribution function,
    $m$ is the particle mass, and $v$ is the particle speed. This quantity contributes
    to the total perpendicular pressure balance in the MHD equilibrium and is important
    for inferring the fast particle content from diagnostics such as neutral particle
    analyzers and fast-ion $D_\alpha$ (FIDA) measurements. Typical values in beam-heated
    tokamak plasmas range from $10$ to $10^3$ Pa, varying with beam power and confinement.
    The parallel and perpendicular projections of this population are given by `parallel_co_passing_fast_pressure`
    and `perpendicular_co_passing_fast_pressure`, respectively.
  unit: J.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure_fast
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/pressure_fast
    dd_path: distributions/distribution/profiles_2d/co_passing/pressure_fast
    status: composed
- name: electron_source_rate
  kind: scalar
  status: draft
  description: Total electron particle source rate integrated over the plasma volume,
    representing the net volume-integrated production of electrons from ionization
    and recombination processes.
  documentation: 'The volume-integrated electron source rate is the total number of
    electrons generated per unit time throughout the confined plasma, computed as
    the volume integral of the net electron particle source density. In steady state,
    this rate balances the total particle loss rate from the plasma and is a key quantity
    in particle transport modeling, appearing as the source term in the integrated
    electron density balance equation $dN_e/dt = \int S_e \, dV$, where $S_e$ is the
    volumetric electron source density (m$^{-3}$ s$^{-1}$) and $N_e$ is the total
    electron number. Typical values range from $10^{21}$ to $10^{23}$ s$^{-1}$ in
    magnetically confined fusion devices, depending on plasma density, volume, and
    auxiliary heating power. The rate can be inferred from line-integrated density
    measurements (interferometry, reflectometry) combined with particle transport
    analysis, or calculated from ionization rates of neutral gas and impurity species.
    See also the flux-surface-resolved [electron_source_rate_at_inside_flux_surface](name:electron_source_rate_at_inside_flux_surface)
    and the total ion source rate [total_ion_source_rate](name:total_ion_source_rate)
    for the particle balance counterpart.


    Sign convention: Positive when electrons are being added to the plasma (net production
    from ionization exceeds recombination losses).'
  unit: s^-1
  physics_domain: transport
  links:
  - name:electron_source_rate_at_inside_flux_surface
  - name:total_ion_source_rate
  sources:
  - id: dd:core_sources/source/global_quantities/electrons/particles
    dd_path: core_sources/source/global_quantities/electrons/particles
    status: composed
- name: electron_source_rate_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of the electron particle source rate enclosed
    within a specified flux surface.
  documentation: 'The electron source rate inside a flux surface, $S_{e,\text{inside}}(\psi)
    = \int_{V(\psi)} s_e \, dV$, represents the total rate at which electrons are
    produced (from ionization, recombination, and other atomic processes) within the
    volume $V(\psi)$ bounded by a given flux surface. This quantity enters the electron
    density transport equation as the volume-integrated source term, directly influencing
    the particle balance and density profile evolution in the core plasma. Typical
    values range from $10^{20}$ to $10^{22}$ s$^{-1}$ in medium-size tokamaks with
    significant gas fueling and neutral beam injection. The integrated source is obtained
    by summing volumetric electron sources from [ion_source_rate_at_inside_flux_surface](name:ion_source_rate_at_inside_flux_surface)
    contributions and atomic processes, often inferred from edge diagnostics and neutral
    transport modeling.


    Sign convention: Positive when the net electron particle source inside the flux
    surface adds electrons to the confined plasma.


    The flux-surface cumulative representation is complementary to the local volumetric
    source rate defined by [electron_source_rate](name:electron_source_rate), and
    the analogous quantity [ion_state_source_rate_at_inside_flux_surface](name:ion_state_source_rate_at_inside_flux_surface)
    provides the same integrated perspective for specific ion charge states.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_source_rate_at_inside_flux_surface
  - name:electron_source_rate
  - name:ion_state_source_rate_at_inside_flux_surface
  sources:
  - id: dd:core_sources/source/profiles_1d/electrons/particles_inside
    dd_path: core_sources/source/profiles_1d/electrons/particles_inside
    status: composed
- name: fast_electron_power_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volumetric power density transferred from a fast particle population
    to fast electrons through Coulomb collisions, representing the energy exchange
    rate that heats the fast electron population.
  documentation: 'This quantity represents the rate at which kinetic energy is transferred
    from a fast particle population (e.g., energetic ions or electrons) to fast electrons
    via Coulomb collisions. In the collisional slowing-down process, the fast particle
    population (source) loses energy and the fast electron population (target) gains
    energy, consistent with the transfer direction ''from fast particles to fast electrons''
    used in sibling quantities like `thermal_electron_power_density_due_to_coulomb_collisions`.
    The power density is computed as the velocity-space integral $P_{\mathrm{fast,e}}
    = \int \mathbf{F} \cdot \mathbf{v}\, f_{\mathrm{fast}}\, d^3v$, where $\mathbf{F}
    = -m_e v \nu_s(v) \hat{\mathbf{v}}$ is the collisional friction force (with $m_e$
    the electron mass and $\nu_s(v)$ the slowing-down frequency), $\mathbf{v}$ is
    the fast particle velocity, and $f_{\mathrm{fast}}$ is the fast-electron distribution
    function. The sign convention is such that positive values indicate energy gain
    by the fast electrons. Typical values in auxiliary-heated tokamak plasmas range
    from $10^3$ to $10^5\,\mathrm{W\,m^{-3}}$ in the core, depending on the fast-particle
    injection power and the electron density. This quantity contributes to the fast
    particle power balance and is closely related to $[\text{thermal electron power
    density due to Coulomb collisions}](name:thermal_electron_power_density_due_to_coulomb_collisions)$,
    $[\text{fast ion power density due to Coulomb collisions}](name:fast_ion_power_density_due_to_coulomb_collisions)$,
    and $[\text{fast electron power density due to Coulomb collisions perpendicular}](name:fast_electron_power_density_due_to_coulomb_collisions_perpendicular)$.


    Sign convention: Positive when energy is transferred from the colliding fast particle
    population to the fast electrons, heating them.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:thermal_electron_power_density_due_to_coulomb_collisions
  - name:fast_ion_power_density_due_to_coulomb_collisions
  sources:
