name: gyrokinetic_eigenmode_normalized_gyrocenter_parallel_heat_flux_moment
status: draft
cocos_transformation_type: one_like
description: Normalized parallel heat flux moment $\hat{q}_\parallel$ of the perturbed
  gyrocenter distribution for a gyrokinetic eigenmode.
documentation: The dimensionless velocity-space moment $\hat{q}_\parallel \propto
  \int \frac{1}{2} m v_\parallel v^2 \delta f_{\mathrm{gc}} \, d^3v$ of the perturbed
  gyrocenter distribution function $\delta f_{\mathrm{gc}}$, where $m$ is the species
  mass, $v_\parallel$ is the parallel velocity, and $v^2 = v_\parallel^2 + 2 \mu B_0
  / m$ with $\mu$ the magnetic moment and $B_0$ the reference magnetic field. This
  moment captures the parallel energy transport carried by the eigenmode perturbation
  and is a higher-order closure quantity in gyrofluid reductions. It is normalized
  to a reference value constructed from the species thermal speed $v_{\mathrm{th}}$
  and reference density $n_0$, yielding a dimensionless quantity. Computed by gyrokinetic
  codes (GENE, GS2, GKW) during eigenmode analysis; the gyrocenter frame means finite-Larmor-radius
  effects are not yet applied. The gyroaveraged counterpart includes $J_0$ Bessel
  weighting.
