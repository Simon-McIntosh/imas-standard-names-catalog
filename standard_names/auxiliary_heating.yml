- name: angle_of_antenna_strap
  kind: scalar
  status: draft
  description: "Second inclination angle (\u03B2) of the oblique trapezoidal cross-section\
    \ of an ICRH antenna strap, giving the signed tilt of the beta-side lateral face\
    \ relative to the directed strap base edge."
  documentation: "The oblique trapezoidal cross-section of an ICRH antenna strap is\
    \ geometrically characterized by two lateral-face inclination angles, alpha (\u03B1\
    ) and beta (\u03B2). The beta angle is the signed inclination of the beta-side\
    \ lateral face relative to the directed base edge of the trapezoid, complementing\
    \ [alpha_angle_of_antenna_strap](name:alpha_angle_of_antenna_strap), which describes\
    \ the inclination of the opposite lateral face.\n\nTogether with shape parameters\
    \ such as [length_of_antenna_strap](name:length_of_antenna_strap) and [height_of_antenna_strap](name:height_of_antenna_strap),\
    \ the pair of inclination angles (\u03B1, \u03B2) fully specifies the oblique\
    \ trapezoidal cross-sectional geometry used to model the conducting strap element\
    \ in RF antenna simulations. This angle is a fixed mechanical design parameter\
    \ derived from engineering drawings and does not vary with plasma conditions.\n\
    \nThe analogous second-inclination angle for passive structures is [angle_of_passive_loop](name:tilt_angle_of_passive_loop),\
    \ which encodes the \u03B2 angle of the passive loop cross-section in the same\
    \ geometric convention."
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:alpha_angle_of_antenna_strap
  - name:length_of_antenna_strap
  - name:height_of_antenna_strap
  - name:tilt_angle_of_passive_loop
- name: alpha_angle_of_antenna_strap
  kind: scalar
  status: draft
  description: Alpha angle is the signed inclination of the alpha-side lateral face
    of an oblique trapezoidal cross-section of an ICRH antenna strap conductor relative
    to the directed strap base edge. It complements the beta angle on the opposite
    lateral face.
  documentation: 'Alpha angle of an antenna strap is the directed inclination of the
    alpha-side lateral face of the strap conductor''s oblique trapezoidal cross-section.
    The angle is measured in a local cross-section plane from the directed base edge
    of the trapezoid to the slanted alpha-side edge; the complementary [beta angle]
    specifies the opposite lateral face. Together with the strap base length, width,
    and thickness, it fixes the trapezoidal conductor outline used in antenna geometry
    models.


    The signed inclination can be computed from two unit vectors in the local right-handed
    cross-section basis $(\hat{u}, \hat{v}, \hat{n})$:


    $$

    \alpha = \operatorname{atan2}\!\left[(\hat{u}\times\hat{s}_\alpha)\cdot\hat{n},\
    \hat{u}\cdot\hat{s}_\alpha\right]

    $$


    where $\hat{u}$ is the unit vector along the directed base edge, $\hat{s}_\alpha$
    is the unit vector along the alpha-side lateral face from the base edge toward
    the opposite edge, $\hat{n}$ is the cross-section normal, and $\operatorname{atan2}$
    returns the directed angle about $\hat{n}$.


    In practice, $\alpha$ is specified from the mechanical design geometry or obtained
    by fitting straight lines to the base edge and alpha-side edge of a surveyed or
    modeled conductor cross-section. Changing this angle changes the obliqueness of
    the conductor side wall and therefore the local outline supplied to antenna electromagnetic
    and structural calculations.


    Typical magnitudes for nondegenerate strap trapezoids are about 0.5-2.6 rad. Values
    near $\pi/2$ rad correspond to an almost rectangular side wall, while values close
    to 0 or $\pi$ rad would make the side wall nearly parallel to the base and are
    normally avoided.


    Sign convention: Positive when rotation from the $+\hat{u}$ base direction to
    the alpha-side lateral-face direction is counterclockwise when viewed along $+\hat{n}$
    in the local right-handed cross-section basis $(\hat{u}, \hat{v}, \hat{n})$.'
  unit: rad
  physics_domain: auxiliary_heating
  links: []
  arguments:
  - name: angle_of_antenna_strap
    operator: alpha
    operator_kind: qualifier
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/alpha
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/alpha
    status: composed
- name: angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Signed rotation angle of an electron-cyclotron launcher mirror about
    its mechanical steering axis, measured from the launcher reference orientation
    and controlling the EC microwave beam injection direction.
  documentation: 'The mirror angle quantifies the angular position of the steering
    mirror on an electron-cyclotron launcher, which redirects the millimeter-wave
    beam along the desired injection path into the plasma. By adjusting this angle,
    the beam can be directed at different magnetic flux surfaces, enabling localized
    electron heating or non-inductive current drive at a chosen plasma radius.


    The accessible angular range is bounded by the mechanical travel limits of the
    actuator system: the lower bound is given by [minimum_angle_of_electron_cyclotron_launcher_mirror](name:minimum_angle_of_electron_cyclotron_launcher_mirror)
    and the upper bound by [maximum_angle_of_electron_cyclotron_launcher_mirror](name:maximum_angle_of_electron_cyclotron_launcher_mirror),
    together defining the full range of injection directions available for the microwave
    beam. The resulting beam orientation after the mirror reflection is further characterized
    by angle_of_electron_cyclotron_beam, which describes the beam direction in the
    plane transverse to propagation.


    Mirror positioning is achieved through motorized actuators with angular position
    encoders; real-time feedback enables precise beam aiming during plasma operation.
    The spatial location of the mirror center is complemented by [radial_centroid_of_electron_cyclotron_launcher_mirror](name:radial_centroid_of_electron_cyclotron_launcher_mirror)
    and [vertical_coordinate_of_electron_cyclotron_launcher_mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror),
    which together define the mirror center position in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:minimum_angle_of_electron_cyclotron_launcher_mirror
  - name:maximum_angle_of_electron_cyclotron_launcher_mirror
  - name:radial_centroid_of_electron_cyclotron_launcher_mirror
  - name:vertical_coordinate_of_electron_cyclotron_launcher_mirror
- name: area_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Geometric surface area of the neutral beam injector ion-extraction
    face. It is the total emitting aperture area available for beam formation, independent
    of the detailed aperture shape.
  documentation: 'Area of a neutral beam injector is the geometric surface area of
    the ion-extraction face that is open or emitting for beam formation. For a multi-aperture
    source, it represents the sum of the contributing aperture areas on the extraction
    face.


    The source area is defined by the surface integral over the emitting extraction
    surface:


    $$

    A_\mathrm{src} = \int_{S_\mathrm{ext}} dA

    $$


    where $S_\mathrm{ext}$ is the emitting portion of the ion-extraction surface,
    $dA$ is an elemental surface area in m$^2$, and $A_\mathrm{src}$ is the neutral
    beam injector source area in m$^2$.


    In practice, the value is obtained from mechanical design, dimensional metrology,
    or aperture-pattern geometry. For discrete apertures, the total area may be computed
    as the sum of the individual open areas; circular and rectangular aperture dimensions
    are conceptually related to radius_of_aperture and x_width_of_aperture. When converting
    extraction current density to total extracted current, the relation $I_\mathrm{ext}=\langle
    j_\mathrm{ext}\rangle A_\mathrm{src}$ uses the area-averaged extraction current
    density $\langle j_\mathrm{ext}\rangle$ in A m$^{-2}$ and the extracted current
    $I_\mathrm{ext}$ in A; a nonuniform local current density must instead be integrated
    over the emitting surface.


    Typical emitting areas range from $10^{-3}$-$10^{-1}$ m$^2$ for compact research
    injectors and about $0.1$-$1$ m$^2$ for large multi-aperture heating injectors,
    depending on beam power, allowable extraction current density, and source technology.'
  unit: m^2
  physics_domain: auxiliary_heating
  links: []
- name: beam_area_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Area of the active ion-source emission face of a neutral beam injector.
    It is defined before downstream neutralization and sets the source cross-section
    used to normalize extracted beam current density.
  documentation: 'Beam area of a neutral beam injector is the total active area of
    the ion-source emission face from which ions are extracted into the accelerator.
    It describes the source-side geometric cross-section of the charged beam before
    the neutralizer, not the area of the beam after neutralization or after downstream
    divergence.


    For an emitting surface $S_\mathrm{emit}$, the beam area $A_\mathrm{beam}$ is


    $$

    A_\mathrm{beam} = \int_{S_\mathrm{emit}} dA

    $$


    where $dA$ is an element of the active emitting surface. For a multi-aperture
    or beamlet source, this integral is evaluated over the union of the active emitting
    apertures or over the effective emitting patches defined by the source model.


    The quantity is obtained from the ion-source and extraction-grid geometry, mechanical
    metrology, or an effective optical model of the source. It is closely related
    to the source-surface quantity [area_of_neutral_beam_injector](name:beam_area_of_neutral_beam_injector);
    the `beam_area` wording emphasizes its use as the normalization area for beam
    extraction, for example the average extracted ion current density $\langle j_i
    \rangle = I_i/A_\mathrm{beam}$ for total extracted ion current $I_i$.


    Typical values for heating neutral beam injectors are about 0.03-1 m^2. Compact
    diagnostic or test sources may be 10^{-4}-10^{-2} m^2, while large negative-ion
    heating sources can approach 1-2 m^2.'
  unit: m^2
  physics_domain: auxiliary_heating
  links: []
  arguments:
  - name: area_of_neutral_beam_injector
    operator: beam
    operator_kind: qualifier
  sources:
  - id: dd:nbi/unit/source/surface
    dd_path: nbi/unit/source/surface
    status: composed
- name: capacitance
  kind: scalar
  status: draft
  description: Electrical capacitance of a lumped impedance-matching element in an
    ion cyclotron resonance heating antenna RF tuning circuit. It is the non-negative
    charge-to-voltage proportionality of that element, not an effective capacitance
    of the whole antenna or plasma load.
  documentation: 'Capacitance is the non-negative proportionality between stored electric
    charge and voltage across a lumped circuit element, expressed in farads. In an
    ion cyclotron resonance heating RF tuning circuit it describes a physical matching
    capacitor or equivalent lumped capacitive element, not the effective capacitance
    of the complete antenna, transmission line, or plasma load.


    For sinusoidal phasors proportional to $e^{i\omega t}$, the capacitor impedance
    is


    $$

    Z_C = \frac{1}{i 2\pi f C} = -\frac{i}{2\pi f C}

    $$


    where $C$ is the capacitance in farads, $f$ is the RF frequency in hertz, and
    $Z_C$ is the complex impedance in ohms. The signed capacitive reactance is therefore
    $X_C = -1/(2\pi f C)$, while its magnitude is $|X_C| = 1/(2\pi f C)$.


    In practice the value is determined from component specifications, calibrated
    actuator position for variable capacitors, or RF network measurements fitted to
    a lumped-element circuit model. It governs the reactive part of the matching network
    and is adjusted to reduce reflected power and match the antenna load during operation.


    Typical values for ion cyclotron antenna matching capacitors range from about
    $10^{-12}$-$10^{-7}$ F, depending on RF frequency, voltage rating, antenna design,
    and whether the element is a fixed, switched, or continuously tunable capacitor.'
  unit: F
  physics_domain: auxiliary_heating
  links:
  - name:capacitance_of_ion_cyclotron_heating_antenna
- name: capacitance_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Capacitance of a lumped impedance-matching element in an ion cyclotron
    heating antenna module. It represents the tuner-element capacitance used to adjust
    the reactive part of the RF matching network, not an effective capacitance of
    the whole antenna or plasma load.
  documentation: 'Capacitance of an ion cyclotron heating antenna is the capacitance
    assigned to a specific lumped impedance-matching element in the antenna module
    RF circuit. It characterizes how that tuner element stores electric energy and
    changes the reactive impedance seen by the transmission line at the chosen circuit
    reference plane.


    For a simple lossless lumped LC matching branch, the tuning relation between capacitance
    and resonance frequency is commonly written as:


    $$

    f_0 = \frac{1}{2\pi\sqrt{LC}}

    $$


    where $f_0$ is the resonance frequency in Hz, $L$ is the associated lumped inductance
    in H, and $C$ is the matching-element capacitance in F. In a driven RF circuit,
    the same capacitance contributes the ideal capacitive reactance $X_C=-1/(2\pi
    f C)$ in ohms at drive frequency $f$ in Hz; practical matching networks also include
    losses, stray reactances, transmission-line transformations, and plasma loading.


    The value is normally obtained from the calibrated setting or circuit model of
    the matching capacitor at the reference plane used for antenna matching. If transmission-line
    sections or feedthroughs are de-embedded, this quantity denotes the de-embedded
    capacitance of the specified matching element, rather than the net input capacitance
    of the complete antenna module.


    Typical lumped RF matching-capacitor values for high-power ion cyclotron antenna
    circuits are hardware-specific but are commonly in the picofarad to nanofarad
    range, about $10^{-12}$-$10^{-9}$ F. The selected value depends on operating frequency,
    matching-network topology, antenna loading resistance, and the reference plane
    used for the circuit representation.'
  unit: F
  physics_domain: auxiliary_heating
  links:
  - name:resistance_of_ion_cyclotron_heating_antenna
  - name:frequency_of_ion_cyclotron_heating_antenna
  arguments:
  - name: capacitance
    operator: ion_cyclotron_heating_antenna
    operator_kind: locus
  sources:
  - id: dd:ic_antennas/antenna/module/matching_element/capacitance
    dd_path: ic_antennas/antenna/module/matching_element/capacitance
    status: composed
- name: current_due_to_electron_cyclotron_current_drive
  kind: scalar
  status: draft
  description: Net toroidal plasma current driven non-inductively by resonant absorption
    of electron cyclotron waves, summed over all EC wave sources. The waves drive
    a parallel current along the magnetic field whose toroidal projection contributes
    to the conventional toroidal plasma current.
  documentation: 'Current due to electron cyclotron current drive is the contribution
    to the conventional toroidal plasma current produced by resonant electron cyclotron
    wave absorption rather than by transformer induction. The wave selectively modifies
    the electron momentum distribution along the magnetic field, generating a parallel
    current density whose toroidal projection adds to the total non-inductive current.
    This scalar represents the net current summed over all electron cyclotron wave
    sources in the device.


    The net toroidal EC-driven current is the integral of the driven toroidal current
    density over a poloidal cross-section:


    $$

    I_{\mathrm{EC}} = \int_{S_p} j_{\phi,\mathrm{EC}} \, dS

    $$


    where $S_p$ is the plasma poloidal cross-section, $dS$ is its area element, and
    $j_{\phi,\mathrm{EC}} = j_{\parallel,\mathrm{EC}}\,\mathbf{b}\cdot\hat{\phi}$
    is the toroidal component of the EC-driven current density in the right-handed
    cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius and $Z$ the vertical
    height. Here $j_{\parallel,\mathrm{EC}}$ is the field-aligned EC-driven current
    density and $\mathbf{b}$ is the unit vector along the magnetic field, so the toroidal
    projection follows from $\mathbf{b}\cdot\hat{\phi}$.


    This current is usually inferred from wave absorption and current-drive calculations
    constrained by injected EC power, launch geometry, magnetic equilibrium, density,
    and temperature. It is the EC analog of the lower-hybrid and ion-cyclotron driven
    currents, and contributes to the aggregate non-inductive plasma current; the EC
    power sustaining it is quantified by the corresponding total absorbed electron
    cyclotron heating power.


    Typical magnitudes span roughly a few kiloamperes for localized current-profile
    control up to of order a megaampere in high-power scenarios, depending strongly
    on absorbed power, electron temperature, and deposition geometry. The value approaches
    zero when EC power is absent, weakly absorbed, or absorbed in a geometry that
    produces little net driven current.


    Sign convention: Positive when the EC-driven conventional plasma current flows
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_lower_hybrid_current_drive
  - name:current_due_to_ion_cyclotron_current_drive
  - name:power_due_to_electron_cyclotron_heating
  sources:
  - id: dd:summary/heating_current_drive/ec/current/value
    dd_path: summary/heating_current_drive/ec/current/value
    status: composed
- name: current_due_to_ion_cyclotron_current_drive
  kind: scalar
  status: draft
  description: Net non-inductive plasma current in the toroidal direction of the right-handed
    cylindrical (R, phi, Z) frame, produced by ion cyclotron wave absorption and integrated
    over the plasma cross-section.
  documentation: 'Current due to ion cyclotron current drive is the total non-inductive
    contribution to plasma current produced by ion cyclotron range waves. It is the
    toroidal current component in the right-handed cylindrical $(R, \phi, Z)$ frame
    integrated over the plasma cross-section, representing the boundary-enclosed total
    rather than the contribution from a single launched toroidal mode. It is the ion-cyclotron
    contribution to [plasma_current_due_to_non_inductive_current_drive](name:plasma_current_due_to_non_inductive_current_drive)
    and the mode-summed counterpart of [per_toroidal_mode_current_due_to_wave_driven_current_drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive).


    The total driven current is defined from the ion-cyclotron-driven current density
    by the cross-sectional current integral used for [toroidal_plasma_current](name:toroidal_plasma_current):


    $$

    I_{\mathrm{ICCD}} = \int_{S_p} \mathbf{j}_{\mathrm{ICCD}} \cdot \hat{\phi}\, dS

    $$


    where $\mathbf{j}_{\mathrm{ICCD}}$ is the driven current-density contribution
    in $\mathrm{A\,m^{-2}}$, $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, $S_p$
    is the plasma region in a surface of constant $\phi$, and $dS$ is the poloidal
    cross-sectional area element in $\mathrm{m^2}$. For an enclosed-current value
    inside a flux surface, $S_p$ would be restricted to the area inside that surface;
    for this total-current quantity, $S_p$ is the full plasma cross-section.


    In practice, this current is computed from radio-frequency wave propagation and
    absorption together with a kinetic description of resonant charged particles,
    minority species, and collisional momentum transfer to the bulk plasma. It can
    be constrained indirectly by current-balance analysis that separates inductive,
    bootstrap, ohmic, and other auxiliary-drive contributions, but it is not usually
    measured as an isolated current. If a current-drive efficiency is quoted separately,
    a common engineering form is $\eta_{\mathrm{CD}} = I_{\mathrm{ICCD}} n_e R_0 /
    P_{\mathrm{IC}}$, with units $\mathrm{A\,m^{-2}\,W^{-1}}$ when $I_{\mathrm{ICCD}}$
    is in A, $n_e$ is in $\mathrm{m^{-3}}$, $R_0$ is in m, and $P_{\mathrm{IC}}$ is
    in W; that efficiency is derived from the current and is not the definition of
    the current.


    Typical absolute magnitudes in present tokamak experiments range from near 0 to
    $10^5$ A, with optimized phasing or high-power scenarios reaching $10^5-10^6$
    A. The signed value and magnitude depend strongly on launched parallel wave-number
    spectrum, absorption location, species mix, density and temperature, collisionality,
    and competition with other current sources.


    Sign convention: Positive when the driven current density flows in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, counterclockwise when viewed from above along $+\hat{Z}$.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  - name:current_due_to_electron_cyclotron_current_drive
  - name:current_due_to_lower_hybrid_current_drive
  - name:current_due_to_neutral_beam_injection
  - name:current_due_to_fusion
  sources:
  - id: dd:summary/heating_current_drive/ic/current/value
    dd_path: summary/heating_current_drive/ic/current/value
    status: composed
- name: current_due_to_lower_hybrid_current_drive
  kind: scalar
  status: draft
  description: Lower-hybrid current-drive current is the whole-plasma non-inductive
    toroidal current produced by lower-hybrid slow waves. It is the lower-hybrid contribution
    to the total non-inductive plasma current.
  documentation: 'Lower-hybrid current-drive current is the whole-plasma net toroidal
    conventional current driven non-inductively by lower-hybrid waves. It is a source-specific
    contribution to [plasma_current_due_to_non_inductive_current_drive](name:plasma_current_due_to_non_inductive_current_drive),
    not an enclosed current or a radial distribution. The underlying wave-particle
    interaction primarily changes electron momentum along the magnetic field, while
    this scalar denotes the resulting toroidal current contribution integrated over
    the plasma.


    The scalar current is defined by integrating the lower-hybrid-driven toroidal
    current-density component over the full plasma cross-section at fixed toroidal
    angle in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    I_{\mathrm{LHCD}} = \int_{S_p} j_{\phi,\mathrm{LHCD}}(R,Z)\, dR\, dZ

    $$


    where $j_{\phi,\mathrm{LHCD}}$ is the toroidal component of the lower-hybrid-driven
    conventional current density and $S_p$ is the entire plasma region in that poloidal
    cross-section. The area element $dR\,dZ$ gives the integrated current in amperes.


    In practice this contribution is not usually measured as an isolated current.
    It is inferred from current-balance analysis combining the total plasma current,
    magnetic equilibrium constraints, loop-voltage information, lower-hybrid wave
    propagation and absorption modeling, and the fast-electron response responsible
    for the driven current.


    Typical values are strongly scenario dependent. The value is 0 A when no lower-hybrid
    power is coupled to the plasma; with lower-hybrid current drive it can range from
    a small correction to a substantial fraction of the total toroidal plasma current,
    depending on coupled power, wave spectrum, density, temperature, and collisionality.


    Sign convention: Positive when the driven conventional plasma current flows in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_electron_cyclotron_current_drive
  - name:toroidal_current_due_to_wave_driven_current_drive
  sources:
  - id: dd:summary/heating_current_drive/lh/current/value
    dd_path: summary/heating_current_drive/lh/current/value
    status: composed
- name: current_due_to_neutral_beam_injection
  kind: scalar
  status: draft
  description: Non-inductive toroidal plasma current produced by neutral beam injection
    through directed momentum transfer from fast beam ions to the background plasma
    during Coulomb-collision thermalization.
  documentation: 'Current due to neutral beam injection is the neutral-beam contribution
    to the total non-inductive plasma current, current_due_to_non_inductive_current_drive.
    Injected neutrals are ionized in the plasma, become energetic fast ions, and transfer
    directed momentum to electrons and ions as they slow down, producing a net driven
    current.


    At a global level, the driven current can be represented as the integral of a
    local NBI current-drive source density over the confined plasma volume:


    $$

    I_{\mathrm{NBI}} = \int_{V_p} S_{I,\mathrm{NBI}}(\mathbf{x})\, dV

    $$


    where $I_{\mathrm{NBI}}$ is the total NBI-driven current, $S_{I,\mathrm{NBI}}$
    is the local driven-current source density in $\mathrm{A\,m^{-3}}$, $\mathbf{x}$
    is position, $V_p$ is the plasma volume, and $dV$ is a volume element in $\mathrm{m^3}$.


    In practice this quantity is computed from neutral-beam deposition, ionization,
    fast-ion orbit and slowing-down physics, pitch-angle scattering, collisional momentum
    exchange, and the plasma equilibrium. It depends strongly on the injected and
    absorbed neutral-beam power, power_due_to_neutral_beam_injection and absorbed_power_of_neutral_beam_injector,
    as well as beam energy, tangency geometry, fast-ion confinement, electron temperature,
    density, and trapped-particle fraction.


    Typical values range from $1\times10^4$-$1\times10^6$ A in present-day tokamaks,
    with lower values for weak or poorly aligned beams and values near or above $1\times10^6$
    A in large, high-power, high-temperature plasmas.


    Sign convention: Positive when the toroidal projection of the driven parallel
    plasma current flows in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$,
    where $R$ is major radius, $\phi$ increases counter-clockwise when viewed from
    above $+\hat{Z}$, and $Z$ is vertical height.'
  unit: A
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:summary/heating_current_drive/nbi/current/value
    dd_path: summary/heating_current_drive/nbi/current/value
    status: composed
- name: current_due_to_wave_driven_current_drive
  kind: scalar
  status: draft
  description: Net non-inductive plasma current generated when resonant absorption
    of electromagnetic waves transfers directed momentum to charged particles.
  documentation: 'The current due to wave-driven current drive is the net contribution
    to plasma current produced by resonant absorption of externally applied electromagnetic
    waves. It is a wave-driven subset of [current_due_to_non_inductive_current_drive](name:current_due_to_non_inductive_current_drive)
    and contributes to [plasma_current_due_to_non_inductive_current_drive](name:plasma_current_due_to_non_inductive_current_drive):
    wave-particle interactions such as Landau damping, transit-time magnetic pumping,
    or cyclotron resonance create an asymmetric velocity-space distribution whose
    field-aligned current contributes to the net plasma current.


    The total current is the surface integral of the wave-driven current density through
    a poloidal cross-section:


    $$

    I_{\mathrm{wcd}} = \int_{S_p} \mathbf{j}_{\mathrm{wcd}} \cdot \hat{\phi}\, dR\,
    dZ

    $$


    where $\mathbf{j}_{\mathrm{wcd}}$ is the current-density contribution from wave-particle
    momentum transfer, $\hat{\phi}$ is the toroidal basis vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$ is toroidal angle,
    $Z$ is vertical height, and $S_p$ is the plasma cross-section at fixed $\phi$.


    In practice, this current is inferred from absorbed wave power, launch spectrum,
    deposition location, and equilibrium constraints, often through current-balance
    analysis that separates ohmic, bootstrap, neutral-beam, and other non-inductive
    contributions. Specific wave-driven components include [current_due_to_electron_cyclotron_current_drive](name:current_due_to_electron_cyclotron_current_drive)
    and [current_due_to_lower_hybrid_current_drive](name:current_due_to_lower_hybrid_current_drive);
    spectra may also be resolved as [per_toroidal_mode_current_due_to_wave_driven_current_drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive).


    Typical magnitudes in tokamaks are $10^4$-$10^6$ A. Localized electron-cyclotron
    drive often produces $10^4$-$10^5$ A, while lower-hybrid or fast-wave drive in
    large plasmas can contribute $10^5$-$10^6$ A; the value depends mainly on absorbed
    wave power, plasma density and temperature, magnetic geometry, and launch spectrum.


    Sign convention: Positive when the driven plasma current flows in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_current_due_to_wave_driven_current_drive
  - name:per_toroidal_mode_current_due_to_wave_driven_current_drive
  - name:current_due_to_electron_cyclotron_current_drive
  - name:current_due_to_lower_hybrid_current_drive
- name: fast_electron_energy
  kind: scalar
  status: draft
  description: Volume-integrated kinetic energy stored in the fast, suprathermal electron
    population, evaluated from the fast-electron energy density or distribution function
    over the plasma volume. It excludes the bulk thermal electron energy and is an
    energy content, not a power or power density.
  documentation: 'Fast electron energy is the total kinetic energy contained in electrons
    assigned to the suprathermal population rather than to the bulk thermal electron
    component. It represents stored energy in the non-thermal electron tail produced
    by wave heating, current drive, or other acceleration mechanisms.


    A common definition is the volume integral of the fast-electron kinetic energy
    density:


    $$

    W_{\mathrm{fast},e} = \int_V \mathcal{E}_{\mathrm{fast},e}(\mathbf{x})\,dV = \int_V
    \int_{\Omega_{\mathrm{fast}}} (\gamma - 1)m_e c^2 f_e(\mathbf{x},\mathbf{v})\,d^3v\,dV

    $$


    where $W_{\mathrm{fast},e}$ is the fast electron energy, $\mathcal{E}_{\mathrm{fast},e}$
    is the fast-electron kinetic energy density in J m$^{-3}$, $f_e$ is the electron
    distribution function, $\Omega_{\mathrm{fast}}$ is the velocity-space region or
    distribution-function component identified as suprathermal, $m_e$ is the electron
    mass, $c$ is the speed of light, and $\gamma$ is the relativistic factor. In the
    nonrelativistic limit the kinetic energy factor reduces to $m_e v^2/2$.


    In practice this quantity is computed by integrating a modeled or reconstructed
    fast-electron distribution over velocity space and plasma volume. Constraints
    may come from kinetic wave-particle calculations and from diagnostics sensitive
    to non-thermal electrons, such as hard x-ray bremsstrahlung, electron cyclotron
    emission, or synchrotron radiation. It is distinct from fast-electron power density:
    integrating a power density over volume gives power, while stored energy follows
    from the accumulated kinetic energy content and changes according to power balance
    and loss processes.


    The value is non-negative and is zero when no fast-electron population is present.
    Typical global values range from about 10^2-10^6 J in auxiliary-heated tokamak
    plasmas, depending on injected power, current-drive efficiency, tail confinement,
    and the energy threshold or model separation used to identify the suprathermal
    population.'
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power
  - name:fast_electron_power_density
  - name:perpendicular_fast_particle_energy
  sources:
  - id: dd:summary/heating_current_drive/lh/energy_fast/value
    dd_path: summary/heating_current_drive/lh/energy_fast/value
    status: composed
- name: frequency_of_electron_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Operating microwave frequency of an electron cyclotron heating antenna.
    It is a non-negative scalar that selects the cyclotron harmonic and constrains
    where resonance can occur in the magnetic field.
  documentation: 'The frequency of an electron cyclotron heating antenna is the electromagnetic
    wave frequency produced by the antenna for electron cyclotron heating or current
    drive. It is a non-negative scalar; physically active heating uses $f>0$. The
    frequency helps select the electron cyclotron harmonic, while the actual absorption
    location and deposition width also depend on magnetic-field geometry, launch angle,
    wave polarization, density, temperature, and relativistic and Doppler effects.


    In the simple cold, non-relativistic, Doppler-free resonance estimate, the antenna
    frequency matches an integer harmonic of the local electron cyclotron frequency:


    $$

    f \simeq n\,\frac{e B}{2\pi m_e}

    $$


    where $f$ is the antenna frequency in Hz, $n$ is the positive integer harmonic
    number, $e$ is the elementary charge in C, $B$ is the local magnetic flux density
    magnitude in T, and $m_e$ is the electron rest mass in kg. More complete resonance
    calculations include the parallel Doppler shift, relativistic mass correction,
    finite-temperature effects, and wave propagation constraints.


    The frequency is normally set by the microwave source and transmission system
    and is verified by radio-frequency or millimeter-wave instrumentation. In scenario
    design it is compared with equilibrium magnetic-field values to identify accessible
    resonance surfaces, but it should not be interpreted by itself as fixing a unique
    radial power-deposition location.


    Typical electron cyclotron heating frequencies are in the millimeter-wave range,
    about $3 \times 10^{10}$-$2 \times 10^{11}$ Hz for many magnetic-confinement applications,
    with the appropriate value set by the magnetic-field strength and chosen harmonic.
    Related antenna-frequency quantities include [ion cyclotron heating antenna frequency](name:frequency_of_ion_cyclotron_heating_antenna)
    and [lower-hybrid antenna frequency](name:frequency_of_lower_hybrid_antenna).'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_electron_cyclotron_heating
  - name:frequency_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:ec_antennas/antenna/frequency
    dd_path: ec_antennas/antenna/frequency
    status: attached
  - id: dd:ec_launchers/beam/frequency
    dd_path: ec_launchers/beam/frequency
    status: composed
  - id: dd:ec_launchers/launcher/frequency
    dd_path: ec_launchers/launcher/frequency
    status: attached
  - id: dd:summary/heating_current_drive/ec/frequency/value
    dd_path: summary/heating_current_drive/ec/frequency/value
    status: attached
- name: frequency_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Operating RF frequency of an ion cyclotron resonance heating antenna,
    which sets the resonance layer position in the plasma and selects the target ion
    species and harmonic number for cyclotron wave damping.
  documentation: "The RF operating frequency of an ICRH antenna determines the spatial\
    \ location of the ion cyclotron resonance layer and selects the target ion species\
    \ and harmonic number for wave absorption. Adjusting this frequency steers the\
    \ deposition layer radially across the plasma cross-section or shifts the heated\
    \ species between minority and majority heating configurations.\n\nThe fundamental\
    \ resonance condition linking antenna frequency to the local magnetic field is:\n\
    \n$$\n\\omega = n \\, \\Omega_{ci} = n \\frac{Z_i e B}{m_i}\n$$\n\nwhere $\\omega\
    \ = 2\\pi f$ is the angular wave frequency, $n$ is the harmonic number ($n = 1$\
    \ for fundamental resonance, $n = 2$ for second harmonic), $Z_i$ is the charge\
    \ number and $m_i$ is the mass of the resonant ion species, $e$ is the elementary\
    \ charge, and $B$ is the local magnetic field magnitude at the target layer.\n\
    \nThe frequency is set by the RF generator and recorded per antenna module or\
    \ averaged over modules in a multi-strap launcher. It is combined with equilibrium\
    \ reconstruction data to determine the resonance layer geometry in the plasma.\
    \ The antenna [resistance_of_ion_cyclotron_heating_antenna](name:resistance_of_ion_cyclotron_heating_antenna)\
    \ and [capacitance_of_ion_cyclotron_heating_antenna](name:capacitance_of_ion_cyclotron_heating_antenna)\
    \ are impedance-matched at this operating frequency to maximize power transfer.\
    \ Strap-to-strap phasing, characterized by [wave_phase_of_antenna_strap](name:wave_phase_of_antenna_strap),\
    \ is optimized alongside the frequency to shape the launched toroidal wave-number\
    \ spectrum. The analogous quantity for electron cyclotron systems is [frequency_of_electron_cyclotron_heating_antenna](name:frequency_of_electron_cyclotron_heating_antenna).\n\
    \nTypical operating frequencies span 25\u2013120 MHz for major tokamaks; the exact\
    \ value depends on the target ion species, harmonic number, and on-axis magnetic\
    \ field strength.\n\nSign convention: Positive when the antenna transmits at the\
    \ tuned RF operating frequency for ion cyclotron wave injection into the plasma."
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:resistance_of_ion_cyclotron_heating_antenna
  - name:capacitance_of_ion_cyclotron_heating_antenna
  - name:wave_phase_of_antenna_strap
  - name:frequency_of_electron_cyclotron_heating_antenna
  sources:
