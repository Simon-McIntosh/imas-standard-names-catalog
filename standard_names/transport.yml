    dd_path: core_profiles/profiles_1d/electrons/velocity/poloidal
    status: composed
- name: radial_electric_field
  kind: scalar
  status: draft
  description: Projection of the plasma electric-field vector along the outward radial
    direction, controlling cross-field drifts and radial force balance.
  documentation: 'The radial electric field is the component of the plasma [electric
    field](name:electric_field) across magnetic flux surfaces, directed outward from
    the magnetic axis toward the plasma boundary. It is central to neoclassical transport,
    ambipolar particle flux balance, and sheared $E \times B$ rotation that can influence
    turbulence suppression. It complements directional components such as the [toroidal
    electric field](name:toroidal_electric_field), [poloidal electric field](name:poloidal_electric_field),
    and [parallel electric field](name:parallel_electric_field).


    For an electrostatic contribution expressed in a flux-surface radial coordinate
    $r$, the radial field is related to the electrostatic potential $\Phi$ by


    $$

    E_r = -\frac{\partial \Phi}{\partial r}

    $$


    where $E_r$ is the radial electric-field component, $\Phi$ is the electrostatic
    potential, and $r$ increases outward from the magnetic axis. In more general time-varying
    cases, inductive contributions from the vector potential may also enter the full
    [electric field](name:electric_field).


    It is computed from radial force balance, neoclassical ambipolarity, or transport
    modeling, and can be constrained experimentally using charge-exchange recombination
    spectroscopy, Doppler reflectometry, heavy-ion beam probes, or measurements of
    flows and pressure gradients. Related flow responses include [radial electron
    velocity](name:radial_electron_velocity), while [parallel plasma electrical conductivity](name:parallel_plasma_electrical_conductivity)
    controls the current response to the field-aligned component rather than the radial
    one.


    Typical core tokamak values are about 1-50 kV/m, with edge pedestal or transport-barrier
    values reaching 50-300 kV/m over narrow radial layers.


    Sign convention: Positive when the electric-field vector points outward from the
    magnetic axis toward increasing flux-surface radius.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:toroidal_electric_field
  - name:poloidal_electric_field
  - name:parallel_electric_field
  - name:radial_electron_velocity
  - name:parallel_plasma_electrical_conductivity
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/radial
    dd_path: core_profiles/profiles_1d/e_field/radial
    status: composed
- name: radial_electron_velocity
  kind: scalar
  status: draft
  description: Electron fluid flow projected along increasing major radius in the
    right-handed cylindrical R-phi-Z geometry.
  documentation: 'Radial electron velocity is the component of the bulk [electron_velocity](name:electron_velocity)
    directed across nested magnetic surfaces in the radial direction of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It describes inward or outward electron fluid
    motion and is closely related to cross-field particle transport, distinct from
    the field-aligned motion described by [parallel_electron_velocity](name:parallel_electron_velocity)
    and the geometric angular components [poloidal_electron_velocity](name:poloidal_electron_velocity)
    and [toroidal_electron_velocity](name:toroidal_electron_velocity).


    The projection from the electron fluid velocity vector is


    $$

    v_{e,R} = \mathbf{v}_e \cdot \hat{R}

    $$


    where $\mathbf{v}_e$ is the electron fluid velocity in m s$^{-1}$, $\hat{R}$ is
    the unit vector toward increasing major radius, and $v_{e,R}$ is the radial component.


    This quantity is inferred from transport analysis, particle continuity, and combinations
    of density evolution with source and sink estimates; direct interpretation may
    also use drift decompositions involving the [radial_electric_field](name:radial_electric_field).
    Representative core values are often small compared with toroidal and parallel
    flows, commonly from about $10^{-2}$-$10^{1}$ m s$^{-1}$ for slow diffusive particle
    transport, while edge and transient conditions can reach $10^{2}$-$10^{4}$ m s$^{-1}$.
    Comparing with [radial_ion_velocity](name:radial_ion_velocity) helps diagnose
    ambipolarity, charge separation tendencies, and species-dependent cross-field
    transport.


    Sign convention: Positive when the electron fluid velocity component points toward
    increasing major radius $R$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:parallel_electron_velocity
  - name:poloidal_electron_velocity
  - name:toroidal_electron_velocity
  - name:radial_electric_field
  - name:radial_ion_velocity
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
