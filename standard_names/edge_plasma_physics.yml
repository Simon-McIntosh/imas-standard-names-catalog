- name: toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "The right-handed cylindrical (R, \u03C6, Z)-frame toroidal component\
    \ of the flux-surface-averaged tungsten ion bulk velocity at the plasma boundary\
    \ is a density-weighted average, with the species velocity taken as the density-weighted\
    \ mean over all ionization states."
  documentation: 'The right-handed cylindrical $(R, \phi, Z)$-frame toroidal component
    of the flux-surface-averaged tungsten ion bulk velocity at the plasma boundary
    is the density-weighted average of the tungsten impurity-ion bulk-flow component
    along $\hat{\phi}$ on the last closed magnetic flux surface. The species-level
    tungsten velocity is the density-weighted mean over all tungsten ionization states.


    The density-weighted flux-surface average is defined by:


    $$

    V_{\phi,\mathrm{tungsten},b}^{\mathrm{FS}} =

    \frac{\displaystyle \int_{S_b} \left(\sum_q n_{\mathrm{tungsten},q} v_{\phi,\mathrm{tungsten},q}\right)
    \frac{dS}{|\nabla \rho|}}

    {\displaystyle \int_{S_b} \left(\sum_q n_{\mathrm{tungsten},q}\right) \frac{dS}{|\nabla
    \rho|}}

    $$


    where $V_{\phi,\mathrm{tungsten},b}^{\mathrm{FS}}$ is this quantity, $S_b$ is
    the last closed magnetic flux surface, $q$ indexes tungsten ionization states,
    $n_{\mathrm{tungsten},q}$ is the local number density of ionization state $q$,
    $v_{\phi,\mathrm{tungsten},q}$ is its local toroidal bulk-flow component in the
    right-handed cylindrical $(R, \phi, Z)$ frame, $dS$ is the surface area element
    on $S_b$, and $\rho$ is the radial flux coordinate in a flux coordinate set $(\rho,
    \theta, \phi)$ labeling the nested magnetic flux surfaces. The factor $dS/|\nabla\rho|$
    gives the volume-derivative flux-surface-average measure, and any monotonic relabeling
    of $\rho$ gives the same ratio on a given surface.


    This quantity represents the boundary value only; for a diverted boundary it is
    understood as the limit approaching the last closed magnetic flux surface from
    inside the confined plasma. It is distinct from the local [toroidal tungsten velocity
    at the plasma boundary](name:toroidal_tungsten_velocity_at_plasma_boundary), which
    is not flux-surface averaged, and from [toroidal tungsten velocity at the magnetic
    axis](name:toroidal_tungsten_velocity_at_magnetic_axis), which is evaluated at
    a different locus. Because velocity is intensive, aggregation over ionization
    states is by density-weighted mean rather than by summation of velocities.


    Sign convention: Positive when the density-weighted mean tungsten ion bulk-flow
    component points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_tungsten_velocity_at_magnetic_axis
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/velocity_phi/tungsten/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-velocity_phi-tungsten-value
    dd_documentation:
