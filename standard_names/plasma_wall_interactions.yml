- name: helium_4_density_at_limiter
  kind: scalar
  status: active
  description: Local particle number density of helium-4 ions evaluated in the boundary
    plasma immediately adjacent to the plasma-facing limiter surface, on the plasma
    side of the magnetic presheath or sheath entrance. The value is summed over He+
    and He2+ ionization states and excludes neutral helium-4 atoms.
  documentation: 'Helium-4 density at a limiter is the local number density of helium-4
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, not inside the limiter material or in neutral gas retained at the surface.
    It is summed over the helium-4 ion charge states He$^+$ and He$^{2+}$, and excludes
    neutral helium-4 atoms.


    The charge-state-summed helium-4 ion density is related to the charge-state-resolved
    velocity distribution functions by:


    $$

    n_{\mathrm{He4}} = \sum_{q=1}^{2} n_{\mathrm{He4}^{q+}} = \sum_{q=1}^{2} \int
    f_{\mathrm{He4}^{q+}}(\mathbf{v}) \, d^3v

    $$


    where $q$ is the positive ion charge state, $f_{\mathrm{He4}^{q+}}$ is the velocity
    distribution function of helium-4 ions with charge state $q+$, and the integral
    is taken over all particle velocities at the limiter-side evaluation point.


    This quantity is the helium-4 isotope contribution to [density_at_limiter](name:density_at_limiter)
    and to the unweighted ion population represented by [total_ion_density_at_limiter](name:total_ion_density_at_limiter).
    In a quasineutral boundary plasma, [electron_density_at_limiter](name:electron_density_at_limiter)
    is coupled to the charge-weighted ion sum, so helium-4 contributes $\sum_{q=1}^{2}
    q\,n_{\mathrm{He4}^{q+}}$ to that balance. The corresponding helium-3 isotope
    quantity is [helium_3_density_at_limiter](name:helium_3_density_at_limiter).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:helium_3_density_at_limiter
  arguments:
  - name: density_at_limiter
