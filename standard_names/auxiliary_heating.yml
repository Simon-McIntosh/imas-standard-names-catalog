- name: maximum_angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: Maximum allowed value of the signed rotation angle of an electron-cyclotron
    launcher mirror within its mechanical travel range.
  documentation: "The upper mechanical travel limit is the greatest permitted value\
    \ of the mirror\u2019s signed rotation angle, bounding the accessible steering\
    \ range of the launcher. It is a limit of the mechanical actuator, not the mirror\
    \ angle during a particular operating condition.\n\nLet $\\theta$ denote the signed\
    \ mirror angle defined by [angle of electron-cyclotron launcher mirror](name:angle_of_electron_cyclotron_launcher_mirror).\
    \ The upper limit $\\theta_{\\max}$ is defined by\n\n$$\n\\theta_{\\max} = \\\
    sup\\{\\theta \\mid \\theta\\text{ is mechanically accessible}\\}\n$$\n\nThe quantity\
    \ excludes the lower travel limit and does not describe the mirror\u2019s position\
    \ unless that position equals the upper boundary of the allowed range.\n\nSign\
    \ convention: Positive when the mirror rotates in the positive sense defined for\
    \ [angle of electron-cyclotron launcher mirror](name:angle_of_electron_cyclotron_launcher_mirror)."
  unit: rad
  physics_domain: auxiliary_heating
