      kind: llm
- name: thickness_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Thickness of a poloidal field coil is the non-negative full conductor-cross-section\
    \ extent measured normal to the coil reference centerline in the poloidal plane\
    \ of the right-handed cylindrical (R, \u03C6, Z) frame, where R is major radius\
    \ and Z is vertical height. It is distinct from radial width and vertical height."
  documentation: 'Thickness of a poloidal field coil is the non-negative full extent
    of the coil conductor cross-section measured along the direction normal to the
    local poloidal-field-coil reference centerline. The direction is evaluated in
    the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a conductor cross-section with gross-envelope points $\mathbf{x}$ in the poloidal
    plane, a reference point $\mathbf{x}_c$ on the local coil centerline, and a unit
    normal $\hat{n}$ in that plane perpendicular to the centerline, the thickness
    $t$ is the full projected extent:


    $$

    t = \max_{\mathbf{x}}\left[(\mathbf{x}-\mathbf{x}_c)\cdot\hat{n}\right] - \min_{\mathbf{x}}\left[(\mathbf{x}-\mathbf{x}_c)\cdot\hat{n}\right]

    $$


    where the extrema are taken over the gross conductor-cross-section envelope. This
    definition fixes the signed projection coordinate relative to the centerline point
    $\mathbf{x}_c$; the resulting thickness is invariant under reversal of $\hat{n}$
    and satisfies $t \ge 0$.


    The gross envelope includes insulation, stabilizer, casing, and internal voids
    that are part of the conductor cross-section, and excludes material outside that
    conductor-cross-section envelope. Thickness is distinct from [width_of_poloidal_field_coil](name:width_of_poloidal_field_coil),
    which is a radial extent, and from [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil),
    which is a vertical extent; together with the cross-section shape these dimensions
    determine [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil).'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  sources:
