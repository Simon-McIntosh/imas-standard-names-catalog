name: ion_collisional_toroidal_torque_density_on_thermal_population_due_to_fast_ions
status: draft
description: Toroidal torque density exerted on the thermal ion population through
  Coulomb collisions with fast ions.
documentation: "This quantity represents the rate of toroidal angular momentum transfer\
  \ per unit area from supra-thermal (fast) ions to the background thermal-ion population\
  \ via Coulomb collisions, denoted $\\tau_{\\phi,\\mathrm{th}}^{\\mathrm{coll,fi}}$.\
  \ It is computed from the collisional friction integral $\\tau_{\\phi,\\mathrm{th}}\
  \ = \\int R\\, C_{ii'}(f_{\\mathrm{fast}}, f_{\\mathrm{th}})\\, m_i v_\\phi\\, d^3v$,\
  \ where $R$ is the major radius, $C_{ii'}$ is the linearized Coulomb collision operator\
  \ between fast species $i'$ and thermal species $i$, $m_i$ is the ion mass, and\
  \ $v_\\phi$ the toroidal velocity. Typical magnitudes range from $10^{-3}$ to $10^{-1}\\\
  ;\\mathrm{N\\,m^{-2}}$ in NBI-heated plasmas, peaking near the fast-ion density\
  \ gradient. This torque drives intrinsic toroidal rotation of the thermal plasma\
  \ and is a key input for momentum-transport modeling. Evaluated by Monte-Carlo orbit\
  \ codes (NUBEAM, ASCOT) or Fokker\u2013Planck solvers that resolve the fast-ion\
  \ slowing-down distribution. The complementary quantity transferring momentum to\
  \ the fast-ion population itself is `fast_ion_collisional_toroidal_torque_density_due_to_collisions`."
