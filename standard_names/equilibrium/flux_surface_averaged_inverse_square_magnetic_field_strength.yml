name: flux_surface_averaged_inverse_square_magnetic_field_strength
status: draft
description: Flux-surface average of the inverse square of the magnetic-field magnitude,
  $\langle 1/B^2 \rangle$.
documentation: "The metric coefficient $gm4 = \\langle 1/B^2 \\rangle = \\oint (1/B^2)\\\
  , d\\ell / \\oint d\\ell$ is the flux-surface average of $1/B^2$, where $B = |\\\
  mathbf{B}|$ is the total magnetic-field magnitude (in T) and the integral runs over\
  \ the poloidal contour weighted by the Jacobian. This quantity is central to neoclassical\
  \ transport theory: the fraction of trapped particles on a flux surface scales with\
  \ the variation of $B$ through $\\langle 1/B^2 \\rangle$ relative to $1/B_{\\max}^2$.\
  \ It also appears in expressions for the parallel current response, the bootstrap\
  \ current drive, and the averaged toroidal Ohm's law. In a typical tokamak with\
  \ $B_0 \\approx 2$\u2013$5\\;\\mathrm{T}$, values range from roughly $0.04$ to $0.25\\\
  ;\\mathrm{T^{-2}}$ depending on flux-surface shaping and aspect ratio. Produced\
  \ by equilibrium reconstruction codes as part of the standard metric-coefficient\
  \ set. See also `flux_surface_averaged_inverse_square_magnetic_field_strength_times_squared_radial_gradient`\
  \ and `flux_surface_averaged_inverse_major_radius`."
