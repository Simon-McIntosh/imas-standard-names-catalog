- name: radial_current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Radial component of the current density driven by the diamagnetic drift
    in the edge plasma.
  documentation: "The radial diamagnetic drift current density $j_{\\mathrm{dia},r}$\
    \ is the component of the diamagnetic drift current density $\\mathbf{j}_{\\mathrm{dia}}\
    \ = (\\mathbf{B} \\times \\nabla p) / B^2$ along the radial direction, where $\\\
    mathbf{B}$ is the magnetic field (T) and $p$ is the total plasma pressure (Pa).\
    \ This component arises from the imbalance between ion and electron diamagnetic\
    \ drifts in the presence of radial pressure gradients, and is a key contributor\
    \ to the radial current balance in the edge and scrape-off layer. It is typically\
    \ inferred from equilibrium reconstruction or measured by Langmuir probes and\
    \ is essential for modeling the radial electric field and confinement transitions.\n\
    \nSign convention: Positive when the current flows outward in the major radius\
    \ $R$.\n\nTypical values in the edge of a diverted tokamak are on the order of\
    \ 1\u2013100 kA\xB7m$^{-2}$, depending on the local pressure gradient and magnetic\
    \ geometry. Related quantities include [current_density_due_to_diamagnetic_drift](name:current_density_due_to_diamagnetic_drift),\
    \ [poloidal_current_density_due_to_diamagnetic_drift](name:poloidal_current_density_due_to_diamagnetic_drift),\
    \ and [toroidal_current_density_due_to_diamagnetic_drift](name:toroidal_current_density_due_to_diamagnetic_drift)."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
