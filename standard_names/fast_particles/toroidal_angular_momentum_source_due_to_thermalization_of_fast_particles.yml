name: toroidal_angular_momentum_source_due_to_thermalization_of_fast_particles
status: draft
description: Volumetric source rate of toroidal angular momentum density deposited
  into the thermal population by thermalization of fast particles.
documentation: "As fast particles (beam ions, ICRH tails, fusion-born alphas) undergo\
  \ Coulomb collisions with the thermal plasma, they lose directed angular momentum\
  \ at a rate $S_{L_\\phi}^{\\rm th} = R\\,(\\mathbf{F}_{\\rm coll})_\\phi \\, n_{\\\
  rm fp}$ (in N/m\xB2), where $R$ is the local major radius (in m), $(\\mathbf{F}_{\\\
  rm coll})_\\phi$ the toroidal collisional drag force per fast particle (in N), and\
  \ $n_{\\rm fp}$ the fast-particle density (in m$^{-3}$). This source enters the\
  \ thermal toroidal angular momentum balance equation $\\partial(n_i m_i R v_\\phi)/\\\
  partial t = \\ldots + S_{L_\\phi}^{\\rm th}$ and is a principal driver of plasma\
  \ rotation in beam-heated discharges. Typical magnitudes are $10^{-2}$\u2013$10^{0}$\
  \ N/m\xB2 in the core of medium-size tokamaks with multi-MW NBI. The quantity is\
  \ evaluated by fast-ion orbit-following codes such as NUBEAM, ASCOT, or CQL3D. See\
  \ also `toroidal_momentum_source_due_to_thermalization_of_fast_particles` for the\
  \ linear-momentum formulation and `particle_number_density_source_due_to_thermalization_of_fast_particles`\
  \ for the particle channel."
