- name: fast_neutron_flux_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Fast neutron flux incident on the inboard side of a toroidal field
    coil, providing a measure of radiation exposure relevant to material activation,
    radiation damage, and conductor insulation lifetime assessment.
  documentation: "Fast neutron flux at a toroidal field coil quantifies the number\
    \ of energetic neutrons crossing unit area per unit time at the inboard-facing\
    \ surface of the coil structure. In deuterium-tritium burning plasmas, 14.1 MeV\
    \ fusion neutrons are the dominant source; these are attenuated and scattered\
    \ by the blanket and shield, but a residual fast population reaches the coil and\
    \ constitutes the primary radiation load on the superconducting windings and their\
    \ organic insulation.\n\nThe quantity is the energy-integrated fluence rate above\
    \ a fast-neutron threshold:\n\n$$\n\\Phi_n = \\int_{E_\\mathrm{th}}^{\\infty}\
    \ \\Phi(E)\\, dE\n$$\n\nwhere $\\Phi(E)$, in m$^{-2}$ s$^{-1}$ eV$^{-1}$, is the\
    \ differential neutron flux spectrum and $E_\\mathrm{th}$ is the fast-neutron\
    \ energy threshold adopted in the transport model.\n\nThis flux drives radiation\
    \ damage processes including atomic displacement damage in conductor structural\
    \ materials, helium bubble formation, and degradation of organic insulation resins\
    \ \u2014 all of which set operational lifetime limits for the coil. It is assessed\
    \ using Monte Carlo or deterministic neutron transport codes, validated against\
    \ activation foil and threshold detector measurements. The analogous quantity\
    \ for non-axisymmetric correction coils is [fast_neutron_flux_of_correction_coil](name:fast_neutron_flux_of_correction_coil)."
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_correction_coil
  sources:
  - id: dd:tf/coil/neutron_fast_flux_inboard
    dd_path: tf/coil/neutron_fast_flux_inboard
    status: composed
- name: force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Signed electromagnetic force on an individual poloidal field coil,
    formed from radial and vertical Lorentz force components, used to define structural
    load limits and engineering bounds for coil system design.
  documentation: 'The force on a poloidal field coil arises from the Lorentz interaction
    between the energized coil conductors and the total magnetic field contributed
    by the plasma current and all electromagnets in the device. It is a signed scalar
    representing a projection or combination of force components resolved in the right-handed
    cylindrical $(R, \phi, Z)$ frame, with radial contributions along $\hat{R}$ (increasing
    major radius) and vertical contributions along $\hat{Z}$.


    The net electromagnetic force along a given direction is obtained by integrating
    the Lorentz body force over the conductor volume:


    $$

    F = \int_V (\mathbf{J} \times \mathbf{B}) \cdot \hat{n} \, dV

    $$


    where $\mathbf{J}$ is the current density in the conductor, $\mathbf{B}$ is the
    total magnetic field, and $\hat{n}$ is the unit vector of the projection direction.
    This force scalar underlies the engineering bounds expressed by [maximum_force_of_poloidal_field_coil](name:maximum_force_of_poloidal_field_coil)
    and [minimum_force_of_poloidal_field_coil](name:minimum_force_of_poloidal_field_coil),
    which set the upper and lower structural limits used in coil system design and
    scenario optimization. For spatially resolved component forces, see [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil)
    and [vertical_force_of_poloidal_field_coil](name:vertical_force_of_poloidal_field_coil);
    for the global coil-system resultants, see [radial_force](name:radial_force) and
    vertical_force.


    Sign convention: Positive when the vertical force component is directed upward
    along $+Z$ and the radial force component is directed outward along increasing
    major radius $R$.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:maximum_force_of_poloidal_field_coil
  - name:minimum_force_of_poloidal_field_coil
  - name:radial_force_of_poloidal_field_coil
  - name:vertical_force_of_poloidal_field_coil
  - name:radial_force
  sources:
  - id: dd:pf_active/force_limits/force
    dd_path: pf_active/force_limits/force
    status: composed
- name: height_of_correction_coil
  kind: scalar
  status: draft
  description: Full height of the rectangular cross-section of a correction-coil conductor
    along the binormal axis of the local Frenet-Serret (tangent, normal, binormal)
    frame.
  documentation: 'The height of a correction coil is the full transverse extent of
    a rectangular conductor cross-section along the binormal basis vector $\hat{b}$
    of the local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$ attached to the
    conductor centerline. It is the dimension perpendicular to the normal-direction
    width and is meaningful when the conductor cross-section is represented as rectangular.


    For a rectangular cross-section, the complementary width $w$ is measured along
    $\hat{n}$ and the height $h$ is measured along $\hat{b}$. Their product gives
    the cross-sectional area $A = w h$, where $h$ and $w$ are in meters and $A$ is
    in square meters. For a conductor carrying current $I$ in amperes, a simple average
    engineering current density is $J_\mathrm{eng} = I/A$ in A m^-2, before any corrections
    for insulation, cooling channels, or nonconducting structural material.


    In design and metrology, the height is obtained by resolving the rectangular cross-section
    onto the $\hat{b}$ direction of the local Frenet-Serret frame $(\hat{t}, \hat{n},
    \hat{b})$ along the conductor centerline. The associated local coordinates are
    described by [binormal_coordinate_of_correction_coil](name:binormal_coordinate_of_correction_coil)
    and [normal_coordinate_of_correction_coil](name:normal_coordinate_of_correction_coil),
    while the perpendicular rectangular dimension is [width_of_correction_coil](name:width_of_correction_coil).


    Representative values for correction-coil conductor or winding-pack heights are
    0.01-0.2 m for compact internal or edge coils and 0.05-0.5 m for larger external
    coils. The selected value depends on required ampere-turns, current density limits,
    cooling layout, insulation thickness, and mechanical support requirements.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_correction_coil
  - name:area_of_correction_coil
  - name:height_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/height
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/height
    status: attached
- name: height_of_iron_core_segment
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of an iron core
    segment, defining the vertical extent of the segment geometry used in electromagnetic
    modeling of the tokamak transformer core.
  documentation: "The height of an iron core segment is the total vertical dimension\
    \ of the rectangular cross-section in the axisymmetric representation of the ferromagnetic\
    \ transformer core used to drive poloidal flux in a tokamak. In the thick-line\
    \ approximation, each core segment is modeled with a rectangular cross-section;\
    \ this quantity measures its extent along the $Z$ axis of the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is the major radius and $Z$ is the vertical\
    \ coordinate.\n\nThe rectangular cross-section area $A$ entering the magnetic\
    \ reluctance calculation is:\n\n$$\nA = h \\cdot w\n$$\n\nwhere $h$ is the height\
    \ and $w$ is the [width](name:width_of_iron_core_segment). The reluctance follows\
    \ $\\mathcal{R} = l\\,/\\,(\\mu_r \\mu_0 A)$, where $l$ is the path length along\
    \ the segment, $\\mu_r$ is the relative permeability of the iron, and $\\mu_0\
    \ = 4\\pi \\times 10^{-7}$ H m$^{-1}$ is the permeability of free space.\n\nThe\
    \ segment geometry \u2014 including this height, the [width_of_iron_core_segment](name:width_of_iron_core_segment),\
    \ and the [thickness_of_iron_core_segment](name:thickness_of_iron_core_segment)\
    \ \u2014 is derived from engineering drawings of the tokamak magnetic circuit\
    \ and provided as input to field and equilibrium reconstruction models. For segments\
    \ with annular cross-sections, the complementary radial dimensions [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment)\
    \ and [outer_radius_of_iron_core_segment](name:outer_radius_of_iron_core_segment)\
    \ apply instead.\n\nSign convention: Positive when the vertical extent is measured\
    \ from the lower boundary to the upper boundary of the cross-section in the $+Z$\
    \ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_iron_core_segment
  - name:thickness_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
