name: ratio_of_hydrogen_to_deuterium_number_density
status: draft
cocos_transformation_type: one_like
description: Dimensionless ratio $n_H / n_D$ of protium to deuterium number densities,
  characterizing the hydrogenic isotope mix of the main-ion population.
documentation: "The hydrogen-to-deuterium density ratio $n_H / n_D$ quantifies the\
  \ isotopic composition of the main-ion fuel, where $n_H$ (m$^{-3}$) is the protium\
  \ number density and $n_D$ (m$^{-3}$) is the deuterium number density. This ratio\
  \ directly influences fusion reactivity: in D-T operation the optimal fuel mix requires\
  \ tight deuterium inventory control, while in pure deuterium discharges residual\
  \ hydrogen from wall recycling and gas fueling typically yields $n_H/n_D \\approx\
  \ 0.01$\u2013$0.1$. The isotope ratio also affects ion-cyclotron resonance heating\
  \ absorption efficiency (minority-heating schemes exploit the hydrogen minority\
  \ fraction) and isotope-dependent confinement scaling. Measurement techniques include\
  \ charge-exchange recombination spectroscopy with mass-resolved diagnostics, neutral\
  \ particle analyzers, and Balmer-$\\alpha$ spectroscopy exploiting the isotope wavelength\
  \ shift ($\\Delta\\lambda \\approx 0.18$ nm between H$_\\alpha$ and D$_\\alpha$).\
  \ In the plasma control context this quantity serves as a reference waveform target\
  \ for real-time isotope ratio feedback. See also the hydrogen-to-electron ratio\
  \ and the line-averaged hydrogen isotope fraction for complementary composition\
  \ descriptors."
