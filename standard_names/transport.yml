    dd_path: summary/local/itb/n_i/tritium/value
    status: composed
- name: tungsten_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Charge-state-summed number density of tungsten ions at the magnetic
    axis, the innermost point of the confined plasma where the poloidal magnetic flux
    gradient vanishes.
  documentation: 'Tungsten density at the magnetic axis is the number of tungsten
    ions per unit volume at the innermost flux-surface singular point of the confined
    plasma, where the gradient of poloidal magnetic flux vanishes. It is summed over
    all positively charged tungsten ionization states, so it represents the elemental
    tungsten ion density rather than the density of a single charge state.


    With charge-state-resolved densities, the definition is:


    $$

    n_{\mathrm{W},\mathrm{axis}} = \sum_{q=1}^{74} n_{\mathrm{W}^{q+}}(\mathrm{axis})

    $$


    where $n_{\mathrm{W}^{q+}}$ is the density of tungsten ions with charge $q$, and
    74 is the atomic number of tungsten. Neutral tungsten atoms are not included in
    this ion density.


    In practice, this quantity is inferred from impurity radiation measurements and
    transport modeling, or from charge-state population calculations constrained by
    plasma conditions. The magnetic-axis location is obtained from an equilibrium
    reconstruction, and the charge-state densities are evaluated at that location
    before summation.


    Typical on-axis tungsten densities are trace compared with electron and main-ion
    densities. In well-controlled tokamak cores they are commonly around 10^13-10^16
    m^-3, while plasmas with pronounced tungsten accumulation may approach or exceed
    10^17 m^-3; the value is strongly device-, scenario-, and wall-source-dependent.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:toroidal_tungsten_velocity_at_magnetic_axis
  - name:tungsten_density_at_pedestal
  - name:tungsten_density_at_plasma_boundary
  - name:density_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/tungsten/value
    dd_path: summary/local/magnetic_axis/n_i/tungsten/value
    status: composed
- name: vertical_ion_state_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Z component, in the right-handed cylindrical (R, phi, Z) frame, of
    the pressure-gradient-driven diamagnetic drift velocity of a specified ion charge
    state. It is perpendicular to the local magnetic field and that charge state's
    pressure gradient.
  documentation: 'The vertical ion-state velocity due to diamagnetic drift is the
    $Z$ component of the ion charge-state diamagnetic drift velocity in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The corresponding vector quantity is [ion_state_velocity_due_to_diamagnetic_drift](name:ion_state_velocity_due_to_diamagnetic_drift);
    together with [radial_ion_state_velocity_due_to_diamagnetic_drift](name:radial_ion_state_velocity_due_to_diamagnetic_drift)
    and [toroidal_ion_state_velocity_due_to_diamagnetic_drift](name:toroidal_ion_state_velocity_due_to_diamagnetic_drift),
    this component describes the projection of that drift onto the cylindrical basis.


    For an ion species and charge state $(i,k)$ with isotropic pressure, the vertical
    component is defined by the pressure-gradient drift formula:


    $$

    v_{\mathrm{dia},Z}^{i,k} =

    \frac{\left(\nabla p_{i,k} \times \mathbf{B}\right)\cdot \hat{Z}}

    {\mathcal{Z}_{i,k} e\, n_{i,k}\, |\mathbf{B}|^2}

    $$


    where $p_{i,k}$ is the charge-state pressure in $\mathrm{Pa}$, $\nabla p_{i,k}$
    is its spatial gradient in $\mathrm{Pa\,m^{-1}}$, $\mathbf{B}$ is the magnetic
    field in $\mathrm{T}$, $|\mathbf{B}|$ is the magnetic-field magnitude in $\mathrm{T}$,
    $n_{i,k}$ is the charge-state density in $\mathrm{m^{-3}}$, $\mathcal{Z}_{i,k}$
    is the dimensionless positive ion charge number, $e$ is the elementary charge
    in $\mathrm{C}$, and $\hat{Z}$ is the vertical unit vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    This quantity is generally evaluated from measured, reconstructed, or calculated
    pressure and magnetic-field information rather than measured as an independent
    flow component. The pressure may be obtained from charge-state density and temperature,
    using $p_{i,k}=n_{i,k}T_{i,k}$ when $T_{i,k}$ is expressed as energy per particle
    with consistent conversion to $\mathrm{Pa}$. It represents the pressure-gradient
    part of the perpendicular fluid drift and is physically distinct from the electric-field-driven
    [vertical_ion_state_velocity_due_to_e_cross_b_drift](name:vertical_ion_state_velocity_due_to_e_cross_b_drift)
    and from parallel flow.


    Typical absolute values in magnetized edge plasmas are 100-10000 m.s^-1, depending
    on pressure-gradient scale length, magnetic-field strength, density, and charge
    state. The vertical component can be smaller in regions where the projection of
    $\nabla p_{i,k} \times \mathbf{B}$ onto $\hat{Z}$ is weak, and it can change sign
    across pressure extrema or where the local magnetic geometry changes the projected
    drift direction.


    Sign convention: Positive when the diamagnetic drift velocity component points
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_profiles/ggd/ion/state/velocity_diamagnetic/z
    dd_path: plasma_profiles/ggd/ion/state/velocity_diamagnetic/z
    status: composed
- name: vertical_neutral_state_momentum_convection_velocity
  kind: scalar
  status: draft
  description: Effective vertical Z-component of the convection velocity governing
    momentum advection for a specified neutral state in an edge plasma.
  documentation: 'Vertical neutral-state momentum convection velocity is the component
    along vertical height $Z$ of the effective velocity that advects momentum carried
    by a specified neutral population state. It describes whether the modeled neutral
    momentum transport is directed upward or downward in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The scalar component is defined by projecting the effective neutral-state momentum
    convection velocity onto the vertical basis direction:


    $$

    v_{c,Z}^{(n,s)} = \hat{Z} \cdot \mathbf{v}_{c}^{(n,s)}

    $$


    where $\mathbf{v}_{c}^{(n,s)}$ is the effective momentum convection velocity for
    neutral species $n$ in state $s$, $\hat{Z}$ is the vertical unit vector, and $v_{c,Z}^{(n,s)}$
    has unit m.s^-1.


    This quantity is usually computed from neutral fluid or kinetic-neutral transport
    models rather than measured directly. It may represent resolved neutral flow,
    drift terms, or an effective closure for advective momentum transport, including
    the influence of recycling, ionization, charge exchange, elastic collisions, and
    boundary sources.


    Typical modeled values in scrape-off-layer and divertor conditions range from
    about -10^4 to 10^4 m.s^-1. Weakly convective regions may have magnitudes below
    10^2 m.s^-1, while strongly directed recycling or source-driven neutral flows
    can approach 10^5 m.s^-1 locally.


    Sign convention: Positive when the effective momentum convection velocity for
    the neutral state has a component in the $+Z$ direction, upward in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:neutral_state_momentum_convection_velocity
  - name:vertical_neutral_momentum_convection_velocity
  - name:radial_neutral_state_momentum_convection_velocity
  - name:vertical_ion_state_momentum_convection_velocity
