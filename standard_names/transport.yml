- name: parallel_total_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel total current density, defined by the
    total current density projected on the magnetic field and normalized by the signed
    reference toroidal magnetic field. It is the net field-aligned current density
    used in transport current-balance physics.
  documentation: 'Parallel total current density is a signed scalar measure of the
    net total current flowing along the magnetic field, expressed with the flux-surface-averaged,
    reference-field-normalized convention used in transport physics. It combines all
    physical mechanisms contributing to the total current before evaluating the field-aligned
    component.


    The defining convention is the flux-surface average of the magnetic-field projection
    of the total current density divided by the signed reference toroidal magnetic
    field:


    $$

    j_{\parallel,\mathrm{tot}} = \frac{\left\langle \mathbf{J}_{\mathrm{tot}}\cdot\mathbf{B}\right\rangle}{B_0}

    $$


    where $\mathbf{J}_{\mathrm{tot}}$ is the total current density in A m$^{-2}$,
    $\mathbf{B}$ is the magnetic field in T, $B_0$ is the signed reference toroidal
    magnetic field in T, and $\langle\cdot\rangle$ denotes an average over a magnetic
    flux surface.


    In practice, the quantity is computed by forming the total current density, taking
    its scalar product with the magnetic field, applying the flux-surface average,
    and dividing by $B_0$. Magnetic-equilibrium constraints determine the current
    distribution, while kinetic and current-drive physics may determine how individual
    contributions add to the total; this quantity is the summed total after applying
    the same convention.


    Representative magnitudes in tokamak transport analyzes are commonly $10^4$-$10^7$
    A m$^{-2}$, depending on plasma current, cross-sectional area, magnetic geometry,
    and non-inductive current drive.


    Sign convention: Positive when $\left\langle \mathbf{J}_{\mathrm{tot}}\cdot\mathbf{B}\right\rangle$
    has the same sign as the signed reference toroidal magnetic field $B_0$; $B_0$
    is positive when the reference toroidal field points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ system.'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:total_current_density
  - name:toroidal_total_current_density
  - name:poloidal_total_current_density
