- name: poloidal_beta
  kind: scalar
  status: active
  description: Poloidal beta is a dimensionless measure of total plasma pressure relative
    to the magnetic-pressure scale of the plasma-current-generated poloidal field.
  documentation: 'Poloidal beta is a dimensionless equilibrium measure of the total
    pressure content of the confined plasma relative to the magnetic-pressure scale
    generated by the plasma current. It characterizes pressure relative to the poloidal
    magnetic field rather than the toroidal magnetic field.


    The defining relation is


    $$

    \beta_p = \frac{4\int_V p\,dV}{R_0\,\mu_0\,I_p^2}

    $$


    where $\beta_p$ is poloidal beta, $p$ is the total plasma pressure, $V$ is the
    confined plasma volume, $dV$ is a differential volume element, $R_0$ is the reference
    major radius, $\mu_0$ is the vacuum permeability, and $I_p$ is the total toroidal
    plasma current.


    The pressure integral extends over the entire confined plasma volume and aggregates
    the pressure of all included plasma populations, so this quantity is global rather
    than local or species-resolved. It excludes any separate normalization based on
    minor radius or reference toroidal magnetic-field strength.


    As the poloidal-field member of the [beta](name:beta) family, poloidal beta uses
    a current- and major-radius-based poloidal magnetic-pressure scale. It is distinct
    from [toroidal_beta](name:toroidal_beta), which normalizes pressure to a toroidal
    magnetic-field scale, and from [normalized_toroidal_plasma_beta](name:normalized_toroidal_plasma_beta),
    which applies an additional engineering normalization.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:toroidal_beta
  - name:normalized_toroidal_plasma_beta
