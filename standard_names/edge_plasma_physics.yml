- name: vertical_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: active
  description: "Vertical component of the electric current density produced by frictional\
    \ momentum exchange between plasma ions and background neutral particles in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Vertical current density due to ion-neutral friction is the vertical
    component of the electric current density contribution from collisional momentum
    exchange between plasma ions and neutral atoms or molecules. It is a projection
    of the full [ion-neutral-friction current density](name:current_density_due_to_ion_neutral_friction)
    in the right-handed cylindrical $(R,\phi,Z)$ frame.


    The defining projection is:


    $$

    j_{\mathrm{in},Z}=\mathbf{j}_{\mathrm{in}}\cdot\hat{\mathbf{Z}}

    $$


    where $j_{\mathrm{in},Z}$ is the vertical component, $\mathbf{j}_{\mathrm{in}}$
    is the ion-neutral-friction current-density vector, both expressed in A.m$^{-2}$,
    and $\hat{\mathbf{Z}}$ is the unit vector along increasing $Z$.


    Only the current contribution attributed to ion-neutral momentum exchange is included;
    contributions from other collision or transport processes and the total plasma
    current are excluded. Unlike the [parallel current density due to ion-neutral
    friction](name:parallel_current_density_due_to_ion_neutral_friction), this quantity
    is a geometric vertical projection rather than a field-aligned projection.


    Sign convention: Positive when the friction-associated current points along $+\hat{\mathbf{Z}}$,
    toward increasing vertical coordinate $Z$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:parallel_current_density_due_to_ion_neutral_friction
  arguments:
