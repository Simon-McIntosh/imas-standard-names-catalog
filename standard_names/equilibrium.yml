- name: major_radius_of_last_closed_flux_surface
  kind: scalar
  status: draft
  description: Major radius coordinate of the last closed flux surface, defining the
    outermost point of the confined plasma region in the poloidal cross-section.
  documentation: 'The major radius $R_{\mathrm{lcfs}}$ of the last closed flux surface
    marks the outermost radial extent of the confined plasma at a given poloidal angle.
    This boundary separates the core plasma, where field lines are nested, from the
    scrape-off layer and divertor region. In diverted configurations the last closed
    flux surface coincides with the separatrix $\psi = \psi_{\mathrm{sep}}$; in limited
    configurations it is defined by the limiter radius. The value is obtained from
    equilibrium reconstruction (EFIT, LIUQE) using magnetic measurements and kinetic
    profile constraints. For typical medium-size tokamaks (JET, DIII-D) $R_{\mathrm{lcfs}}$
    ranges from 2.5 to 3.5 m; for ITER the design value is approximately 6.2 m on
    the outboard midplane.


    Sign convention: Positive when the point lies at increasing $R$ (outward along
    the major radius) relative to the machine symmetry axis.


    See also the related quantities [major radius of separatrix](name:major_radius_of_separatrix),
    [major radius of magnetic axis](name:major_radius_of_magnetic_axis), and [vertical
    coordinate of control surface](name:vertical_coordinate_of_control_surface) which
    together define the plasma boundary geometry.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_separatrix
  - name:major_radius_of_magnetic_axis
  - name:vertical_coordinate_of_control_surface
  sources:
  - id: dd:equilibrium/time_slice/boundary/lcfs/r
    dd_path: equilibrium/time_slice/boundary/lcfs/r
    status: composed
- name: major_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Major radius (cylindrical R coordinate) of the magnetic axis, the extremum
    of poloidal magnetic flux in the confined plasma region.
  documentation: 'The major radius $R_{\mathrm{axis}}$ of the magnetic axis is the
    cylindrical $R$ coordinate at which $\nabla \psi = 0$ for the poloidal magnetic
    flux $\psi$, identifying the innermost nested flux surface in a tokamak or stellarator
    equilibrium. It is the geometric reference point for radial profiles: the normalized
    poloidal flux coordinate $\rho_{\mathrm{pol}}$ and the safety factor $q$ are both
    evaluated relative to this axis. Typical core values range from 0.6 m in compact
    spherical tokamaks (e.g., MAST) to 6.2 m in ITER. The quantity is routinely extracted
    from equilibrium reconstruction codes using external magnetic measurements and
    internal constraints such as polarimetry or the Motional Stark Effect.


    Sign convention: Positive when the magnetic axis lies at a larger major radius
    than the machine symmetry axis ($R = 0$).


    The magnetic axis position differs from that of the [geometric axis](name:major_radius_of_geometric_axis),
    which is the centroid of the poloidal plasma cross-section; the two coincide only
    for perfectly symmetric, non-shifted equilibria. Related radial coordinates include
    the [major_radius_of_current_center](name:major_radius_of_current_center) and
    the [major_radius_of_plasma_boundary](name:major_radius_of_plasma_boundary).'
  unit: m
  physics_domain: equilibrium
  links:
