name: maximum_of_power_flux_density_at_outer_divertor_target
status: draft
description: Maximum power flux density incident on the outer divertor target plate,
  characterizing the peak thermal load on the plasma-facing surface.
documentation: "The peak power flux density $q_{\\perp,\\mathrm{max}}$ at the outer\
  \ divertor target quantifies the highest local heat load deposited on the outer\
  \ strike-point region. It is a critical parameter for divertor design because it\
  \ determines whether the plasma-facing material remains within its thermal fatigue\
  \ and melting limits. In attached H-mode plasmas, $q_{\\perp,\\mathrm{max}}$ typically\
  \ ranges from 5\u201320 MW m$^{-2}$ in current devices and may reach 10\u201320\
  \ MW m$^{-2}$ in ITER under partially detached conditions. The quantity is governed\
  \ by the scrape-off layer (SOL) power width $\\lambda_q$ (in m) and the flux expansion\
  \ at the target: $q_{\\perp,\\mathrm{max}} \\approx P_{\\mathrm{SOL}} f_{\\mathrm{out}}\
  \ / (2\\pi R_{\\mathrm{sp}} \\lambda_q f_x)$, where $P_{\\mathrm{SOL}}$ is the power\
  \ crossing the separatrix (W), $f_{\\mathrm{out}}$ is the outer-target power-sharing\
  \ fraction, $R_{\\mathrm{sp}}$ is the major radius of the strike point (m), and\
  \ $f_x$ is the poloidal flux expansion. Note that the DD unit is listed as W, whereas\
  \ the physics quantity is a power flux density (W m$^{-2}$); this unit inconsistency\
  \ should be verified upstream. Measured by infrared thermography, embedded thermocouples,\
  \ or Langmuir probe arrays. See also `peak_power_flux_density_at_inner_divertor_target`\
  \ for the companion inner-target quantity."
validity_domain: ''
