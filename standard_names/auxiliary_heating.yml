- name: y_component_of_first_unit_vector
  kind: scalar
  status: draft
  description: Y-axis Cartesian component of the first local unit vector defining
    the orientation of a diagnostic aperture or optical element in the right-handed
    $(\hat{x}, \hat{y}, \hat{z})$ frame.
  documentation: 'The quantity $\hat{e}_{1,y}$ is the projection of the first local
    unit vector $\hat{e}_1$ onto the $\hat{y}$ axis of the right-handed Cartesian
    frame $(\hat{x}, \hat{y}, \hat{z})$, where $\hat{z}$ is vertical. Together with
    [x_component_of_first_unit_vector](name:x_component_of_first_unit_vector) and
    [z_component_of_first_unit_vector](name:z_component_of_first_unit_vector), it
    completes the full Cartesian representation of $\hat{e}_1$, which forms part of
    the orthonormal triad defining the local orientation frame of a diagnostic aperture
    or optical element. Because $\hat{e}_1$ is a unit vector, the three components
    satisfy $e_{1,x}^2 + e_{1,y}^2 + e_{1,z}^2 = 1$, so $|\hat{e}_{1,y}| \leq 1$.
    The triad is specified at the time of diagnostic geometry definition and is used
    to relate sensor-local coordinates to the global $(\hat{x}, \hat{y}, \hat{z})$
    machine frame. The companion triad for the third unit vector is accessed via [y_component_of_third_unit_vector](name:y_component_of_third_unit_vector).


    Sign convention: Positive when the projection of $\hat{e}_1$ onto the $\hat{y}$
    axis points in the direction of increasing $y$ in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ frame.'
