- name: toroidal_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the magnetic field, evaluated at a reference
    major radius and used for normalizing quantities in local gyrokinetic simulations.
  documentation: 'The toroidal magnetic field $B_\mathrm{tor}$ is the projection of
    the total magnetic field vector onto the geometric toroidal direction $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ coordinate system. In tokamaks,
    $B_\mathrm{tor}$ is the dominant field component, set primarily by the toroidal
    field coils scalings as $B_\phi \propto 1/R$. This quantity serves as a normalizing
    scale for dimensionless parameters in local gyrokinetic simulations, such as the
    normalized gyroradius $\rho_* = \rho_\mathrm{tor}/a$, where $\rho_\mathrm{tor}
    = m_i v_\mathrm{th} / (e B_\mathrm{tor})$ is the thermal ion Larmor radius. Typical
    values at the reference radius range from 1 to 6 T for current devices (e.g.,
    2.0 T at $R_0 = 1.7$ m in DIII-D, 5.2 T at $R_0 = 6.2$ m in ITER). The reference
    major radius is typically the magnetic axis or geometric center, chosen to match
    the local gyrokinetic simulation domain. See also [toroidal_magnetic_field_at_magnetic_axis](name:toroidal_magnetic_field_at_magnetic_axis)
    for the value at the magnetic axis, and [magnetic_field](name:magnetic_field)
    for the total vector field.


    Sign convention: Positive when the field direction coincides with the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above).'
  unit: T
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_field_at_magnetic_axis
  - name:magnetic_field
