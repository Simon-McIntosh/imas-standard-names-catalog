- name: toroidal_magnetic_field_at_ferritic_element_centroid
  kind: scalar
  status: active
  description: "Signed projection of the magnetic-field vector onto the toroidal direction\
    \ at a ferritic element\u2019s geometric centroid."
  documentation: "The toroidal magnetic-field component at a ferritic element\u2019\
    s geometric centroid is the projection of the local magnetic-field vector onto\
    \ the toroidal direction. The projection is defined in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is major radius, $\\phi$ is toroidal angle,\
    \ and $Z$ is vertical height.\n\n$$\nB_\\phi(\\mathbf r_c) = \\mathbf B(\\mathbf\
    \ r_c) \\cdot \\hat{\\phi}\n$$\n\nwhere $\\mathbf B$ is the magnetic-field vector,\
    \ $\\mathbf r_c$ is the ferritic-element centroid position, and $\\hat{\\phi}$\
    \ is the unit vector in the direction of increasing toroidal angle.\n\nThis quantity\
    \ is the toroidal counterpart of the [radial magnetic field at a ferritic element\
    \ centroid](name:radial_magnetic_field_at_ferritic_element_centroid) and [vertical\
    \ magnetic field at a ferritic element centroid](name:vertical_magnetic_field_at_ferritic_element_centroid).\
    \ It describes magnetic field, not the material magnetization represented by [toroidal\
    \ magnetization of a ferritic element](name:toroidal_magnetization_of_ferritic_element).\n\
    \nSign convention: Positive when $B_\\phi$ points in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_at_ferritic_element_centroid
  - name:vertical_magnetic_field_at_ferritic_element_centroid
  - name:toroidal_magnetization_of_ferritic_element
  sources:
  - dd_path: ferritic/object/time_slice/b_field_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-time_slice-b_field_phi
    dd_documentation:
      leaf: Toroidal component of the magnetic field at each centroid
      parent_path: ferritic/object/time_slice
      parent: Dynamic quantities, per time slice
      data_type: FLT_1D
      unit: T
      coordinates:
      - ferritic/object/centroid/x
    enhanced_context:
      description: Toroidal (phi) component of the magnetic field (B_phi) evaluated
        at the centroid of each ferritic object element. Used in modelling the magnetic
        response of ferromagnetic in-vessel components to the ambient field.
      kind: llm
- name: toroidal_magnetization_of_ferritic_element
  kind: scalar
  status: active
  description: "Toroidal component of the ferritic-element magnetization vector: the\
    \ signed projection of the effective magnetization assigned to a discrete ferritic\
    \ element onto the positive toroidal direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. This is the element-level convention, not a pointwise\
    \ bulk-material magnetization field."
  documentation: 'Toroidal component of the ferritic-element magnetization vector
    is the signed projection of the effective magnetization assigned to a discrete
    ferritic element onto the toroidal basis direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The projection is defined by:


    $$

    M_\phi^{\mathrm{fe}} = \mathbf{M}^{\mathrm{fe}} \cdot \hat{\phi}

    $$


    where $\mathbf{M}^{\mathrm{fe}}$ is the ferritic-element magnetization vector
    assigned to the element, $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle, and $M_\phi^{\mathrm{fe}}$ is this toroidal component.


    In this family, ferritic-element magnetization denotes the effective magnetization
    attributed to the individual ferritic element for its magnetic source strength.
    It is not the pointwise bulk magnetization field inside the material, and it is
    distinct from material properties such as magnetic permeability. Together with
    the [radial component](name:radial_magnetization_of_ferritic_element) and [vertical
    component](name:vertical_magnetization_of_ferritic_element), it forms the three
    cylindrical components of the same effective ferritic-element magnetization vector.


    Sign convention: Positive when $M_\phi^{\mathrm{fe}}$ points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetization_of_ferritic_element
  sources:
  - dd_path: ferritic/object/time_slice/magnetic_moment_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-time_slice-magnetic_moment_phi
    dd_documentation:
      leaf: Toroidal component of the magnetic moment of each element
      parent_path: ferritic/object/time_slice
      parent: Dynamic quantities, per time slice
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - ferritic/object/centroid/x
    enhanced_context:
      description: Toroidal (phi) component of the magnetic dipole moment of ferritic
        material elements, describing the magnetization response of ferromagnetic
        components in the toroidal direction. Used in electromagnetic modelling of
        field perturbations.
      kind: llm
- name: vertical_angle_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Signed inclination of the second oblique side of a poloidal-field-coil\
    \ parallelogram cross-section, measured counterclockwise from upward +Z in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the signed orientation angle of the second oblique
    side of a poloidal field coil parallelogram cross-section. It is defined in a
    constant-$\phi$ poloidal plane of the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It is the beta-side counterpart to the first inclination angle [radial angle of
    the poloidal field coil](name:radial_angle_of_poloidal_field_coil).


    Let $\hat{\mathbf{s}}_\beta$ be the unit vector directed along the second oblique
    side, $\hat{\mathbf{Z}}$ the upward vertical unit vector, and $\hat{\mathbf{e}}_{\rm
    ccw}$ the in-plane unit vector toward counterclockwise rotation from $+Z$. The
    signed angle is defined by:


    $$

    \beta = \operatorname{atan2}\left(\hat{\mathbf{s}}_\beta \cdot \hat{\mathbf{e}}_{\rm
    ccw},\, \hat{\mathbf{s}}_\beta \cdot \hat{\mathbf{Z}}\right)

    $$


    Here, $\operatorname{atan2}$ returns the oriented angle from the upward direction
    to the directed side. The quantity describes orientation only; it is not the side
    length, cross-sectional area, or first oblique side inclination.


    Sign convention: Positive when the directed second oblique side is counterclockwise
    from the upward $+Z$ direction in the poloidal plane.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:radial_angle_of_poloidal_field_coil
  sources:
  - dd_path: pf_active/coil/element/geometry/oblique/beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-geometry-oblique-beta
    dd_documentation:
