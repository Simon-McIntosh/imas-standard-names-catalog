  kind: scalar
  status: active
  description: Full opening span of a rectangular filter window measured along its
    first local tangential axis in the right-handed (X1, X2, X3) frame.
  documentation: 'The filter-window width is the full separation of the two opposing
    boundaries measured along the first local tangential direction, X1, of the right-handed
    aperture frame (X1, X2, X3). The X1 and X2 directions lie in the filter plane,
    while X3 is normal to that plane.


    For opposing window boundaries with first-coordinate values $x_{1,\min}$ and $x_{1,\max}$,
    the width is defined by


    $$

    w = x_{1,\max} - x_{1,\min}

    $$


    where $w$, $x_{1,\min}$, and $x_{1,\max}$ are geometric lengths measured in m.


    This quantity describes the clear geometric opening of the rectangular filter
    window, excluding filter-material thickness and detector active width. The orthogonal
    window extent is described by the [second local tangential coordinates of the
    filter window](name:second_local_tangential_coordinate_of_filter_window), while
    the boundary positions along X1 are given by the [first local tangential coordinates
    of the filter window](name:first_local_tangential_coordinate_of_filter_window).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_local_tangential_coordinate_of_filter_window
  - name:first_local_tangential_coordinate_of_filter_window
  sources:
