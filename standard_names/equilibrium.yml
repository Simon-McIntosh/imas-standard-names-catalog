- name: plasma_pressure
  kind: scalar
  status: active
  description: Plasma pressure is the isotropic kinetic pressure of the plasma, the
    scalar part of the kinetic pressure tensor used in equilibrium force balance.
    The unqualified quantity denotes an equilibrium scalar pressure, not a first-order
    pressure perturbation.
  documentation: 'Plasma pressure is the isotropic kinetic pressure of the plasma,
    the scalar part of the kinetic pressure tensor in a fluid or magnetohydrodynamic
    description. It represents equilibrium mechanical stress from the plasma populations
    included in the pressure model and is not a perturbation amplitude.


    The scalar pressure is the one-third trace of the kinetic pressure tensor:


    $$

    p = \frac{1}{3}\operatorname{tr}\mathbf{P}

    $$


    where $p$ is the plasma pressure, $\mathbf{P}$ is the kinetic pressure tensor,
    and $\operatorname{tr}$ denotes the tensor trace. For locally isotropic Maxwellian
    populations, an included population $s$ contributes $n_s k_B T_s$, where $n_s$
    is the number density of population $s$, $T_s$ is its temperature, and $k_B$ is
    the Boltzmann constant.


    The unqualified quantity applies to equilibrium scalar kinetic pressure; it is
    additive over the included plasma populations and does not imply normalization,
    volume integration, or selection of only a bulk-thermal, fast-particle, or perturbed
    population subset. It excludes magnetic pressure, dynamic ram pressure, anisotropic
    pressure components, and any individual component of the pressure tensor.


    [Total plasma pressure](name:total_plasma_pressure) is the specialization in which
    all represented equilibrium kinetic pressure contributions are included, while
    [thermal plasma pressure](name:thermal_plasma_pressure) is restricted to bulk
    thermal electron and ion populations. [Perturbed plasma pressure](name:perturbed_plasma_pressure)
    denotes a first-order variation about an equilibrium pressure and is not part
    of the equilibrium quantity defined here. In magnetohydrostatic equilibrium, the
    pressure gradient satisfies $\nabla p = \mathbf{j} \times \mathbf{B}$, where $\nabla
    p$ is the spatial gradient of plasma pressure, $\mathbf{j}$ is the electric current
    density, and $\mathbf{B}$ is the magnetic field; on nested magnetic flux surfaces
    this pressure may be expressed as a function of the [poloidal magnetic flux](name:poloidal_magnetic_flux)
    $\psi$, where $\psi$ is the poloidal magnetic flux.'
  unit: Pa
  physics_domain: equilibrium
  links:
  - name:thermal_plasma_pressure
  sources:
  - dd_path: equilibrium/time_slice/constraints/pressure/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-pressure-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/pressure
      parent: Set of total pressure estimates
      data_type: FLT_0D
      unit: Pa
    enhanced_context:
      description: Measured value of pressure.
      kind: template
    semantic_facet: measured
  - dd_path: equilibrium/time_slice/constraints/pressure/reconstructed
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-pressure-reconstructed
    dd_documentation:
