- name: accumulated_methane_carbon_13_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of carbon-13-labeled methane
    delivered by gas injection after plasma breakdown, with ten count units assigned
    to each neutral 13CH4 molecule.
  documentation: 'This quantity is the cumulative equivalent-electron inventory of
    neutral carbon-13-labeled methane introduced by gas injection after plasma breakdown.
    It counts injected molecules rather than free electrons retained in the plasma.


    $$

    N_{\mathrm{eq}}(t)=10\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{^{13}\mathrm{CH}_4}(t'')\,dt''

    $$


    Here $N_{\mathrm{eq}}$ is the dimensionless equivalent-electron count, $\dot{N}_{^{13}\mathrm{CH}_4}$
    is the injection rate of neutral methane molecules in s$^{-1}$, and $t_{\mathrm{bd}}$,
    $t$, and $t''$ are times in seconds. The factor 10 is the sum of six equivalent
    electrons from carbon and four from hydrogen in each neutral molecule; carbon-13
    labeling does not change the atomic number. The quantity excludes methane introduced
    during prefill, which is represented by [methane carbon-13 prefill count](name:methane_carbon_13_prefill_count),
    and is the time integral of the corresponding [methane carbon-13 source rate](name:methane_carbon_13_source_rate).'
