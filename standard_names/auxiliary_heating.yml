- name: per_toroidal_mode_fast_electron_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged wave power density absorbed by the fast electron
    population, resolved per toroidal Fourier mode number.
  documentation: 'The absorbed power density per toroidal mode, $P_{n_\phi} = d^2
    P_{\rm abs} / (dV\, dn_\phi)$, quantifies the volumetric wave energy deposition
    on fast electrons for a given toroidal Fourier component $n_\phi$. This quantity
    is obtained from full-wave or ray-tracing codes that model electron cyclotron
    heating and current drive, and is typically integrated over the poloidal cross-section
    to yield a 1D radial profile. The total absorbed power density on fast electrons
    is recovered by summing over all toroidal modes: $P_{\rm abs} = \sum_{n_\phi}
    P_{n_\phi}$. Typical values in the plasma core range from $10^5 \,\text{W}\,\text{m}^{-3}$
    for high-power ECH to $10^3 \,\text{W}\,\text{m}^{-3}$ for low-power scenarios.
    See also [per_toroidal_mode_thermal_electron_power_density](name:per_toroidal_mode_thermal_electron_power_density)
    for the thermal electron counterpart and [per_toroidal_mode_fast_ion_power_density](name:per_toroidal_mode_fast_ion_power_density)
    for the fast ion channel.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
