name: ion_momentum_flux_due_to_diamagnetic_drift
status: draft
description: Ion momentum flux density arising from the diamagnetic drift, driven
  by the perpendicular ion pressure gradient in a magnetized plasma.
documentation: "The diamagnetic contribution to the ion momentum flux originates from\
  \ the guiding-center drift $\\mathbf{v}_{\\mathrm{dia},i} = (\\mathbf{B} \\times\
  \ \\nabla p_i) / (Z_i e n_i B^2)$, where $p_i$ is the ion pressure (Pa), $n_i$ the\
  \ ion number density (m$^{-3}$), $Z_i$ the charge state, $e$ the elementary charge\
  \ (C), and $\\mathbf{B}$ the magnetic field (T). The resulting momentum flux density\
  \ has dimensions of pressure (kg m$^{-1}$ s$^{-2}$) and represents the rate of momentum\
  \ transport per unit area carried by the diamagnetic drift motion. In edge transport\
  \ models this term enters the momentum balance equation alongside convective, viscous,\
  \ and anomalous contributions. Typical magnitudes in tokamak edge plasmas are $10^{-2}$\u2013\
  $10^{1}$ Pa, depending on the local ion pressure gradient and field strength. The\
  \ quantity is evaluated per grid element in general geometry description (GGD) representations\
  \ of the edge plasma. See also `ion_diamagnetic_drift_velocity` for the underlying\
  \ drift speed and `ion_energy_flux` for the energy-channel analogue."
