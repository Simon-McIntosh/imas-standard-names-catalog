- name: parallel_normalized_perturbed_vector_potential
  kind: scalar
  status: draft
  description: Dimensionless gyrokinetic perturbation formed from the component of
    the vector-potential fluctuation parallel to the equilibrium magnetic field, normalized
    by a reference vector-potential scale. Its signed or complex value depends on
    the chosen electromagnetic gage and, for linear eigenmodes, on the arbitrary eigenfunction
    phase.
  documentation: "Parallel normalized perturbed vector potential is the dimensionless\
    \ electromagnetic gyrokinetic field obtained by projecting the vector-potential\
    \ fluctuation along the equilibrium magnetic field and dividing by a reference\
    \ vector-potential scale. It represents the shear-Alfv\xE9n part of the perturbation\
    \ that enters parallel particle dynamics and magnetic-flutter coupling, but the\
    \ vector potential itself is not gage invariant.\n\nThe normalized field is defined\
    \ by\n\n$$\n\\widehat{A}_\\parallel = \\frac{\\delta A_\\parallel}{A_{\\parallel,\\\
    mathrm{ref}}}, \\qquad \\delta A_\\parallel = \\delta\\mathbf{A}\\cdot\\mathbf{b}\n\
    $$\n\nwhere $\\delta\\mathbf{A}$ is the vector-potential perturbation, $\\mathbf{b}$\
    \ is the unit vector along the equilibrium magnetic field, $\\delta A_\\parallel$\
    \ and $A_{\\parallel,\\mathrm{ref}}$ have physical units tesla meter, equivalently\
    \ Wb m$^{-1}$, and $\\widehat{A}_\\parallel$ is dimensionless. The reference scale\
    \ is the one used consistently for the accompanying gyrokinetic variables; a common\
    \ choice is $A_{\\parallel,\\mathrm{ref}}=T_\\mathrm{ref}/(q_\\mathrm{ref}v_\\\
    mathrm{ref})$, with $T_\\mathrm{ref}$ an energy, $q_\\mathrm{ref}$ a charge, and\
    \ $v_\\mathrm{ref}$ a speed.\n\nIn gyrokinetic calculations this quantity is usually\
    \ solved together with the perturbed electrostatic potential and distribution\
    \ functions. The physical parallel vector potential is constrained by the parallel\
    \ component of Ampere's law; in a Fourier representation and when displacement\
    \ current is neglected, it is commonly related to the parallel current perturbation\
    \ by $k_\\perp^2\\delta A_\\parallel \\approx \\mu_0\\delta j_\\parallel$, with\
    \ the overall algebraic sign set by the Fourier phase convention and with possible\
    \ corrections from electron inertia or skin-depth effects. Experimentally it is\
    \ not measured directly; it may be inferred indirectly from magnetic-fluctuation\
    \ diagnostics or from model-based reconstruction of electromagnetic turbulence.\n\
    \nThe value is gage dependent because an electromagnetic gage transformation changes\
    \ $\\delta\\mathbf{A}$ while leaving the observable fields unchanged. Physical\
    \ comparisons should therefore use a specified gage or gage-invariant combinations\
    \ such as the resulting magnetic perturbation or electromagnetic fields. For linear\
    \ eigenmodes, the whole eigenfunction can also be multiplied by an arbitrary complex\
    \ phase, so real and imaginary parts are phase dependent whereas amplitudes and\
    \ phase-invariant ratios are more directly comparable.\n\nThere is no universal\
    \ typical numerical range for this normalized quantity. Linear calculations often\
    \ choose an arbitrary eigenfunction normalization, and nonlinear values depend\
    \ on the reference scale, gage, plasma beta, fluctuation level, and mode spectrum;\
    \ values should be compared only within a consistent normalization and gage convention.\n\
    \nSign convention: Positive when the chosen real representative of $\\delta A_\\\
    parallel$ points along the equilibrium magnetic field direction after the electromagnetic\
    \ gage and any linear-eigenfunction phase have been fixed."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential_real_part
  - name:parallel_normalized_perturbed_vector_potential_amplitude
  - name:normalized_perturbed_vector_potential
  - name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  arguments:
  - name: normalized_perturbed_vector_potential
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_normalized_perturbed_vector_potential_amplitude
  kind: scalar
  status: draft
  description: Modulus of the complex normalized perturbed parallel vector potential
    eigenfunction for a gyrokinetic mode. It quantifies the dimensionless electromagnetic
    fluctuation amplitude associated with field-aligned current and magnetic flutter.
  documentation: 'Parallel normalized perturbed vector potential amplitude is the
    non-negative modulus of the complex dimensionless perturbation $\delta \tilde{A}_\parallel$,
    where the parallel component is taken along the local equilibrium magnetic field.
    It characterizes the electromagnetic part of a gyrokinetic fluctuation and vanishes
    for a purely electrostatic perturbation.


    For a complex normalized eigenfunction $\delta \tilde{A}_\parallel = \delta A_\parallel/A_\mathrm{ref}$,
    the amplitude is defined by:


    $$

    |\delta \tilde{A}_\parallel| = \left|\frac{\delta A_\parallel}{A_\mathrm{ref}}\right|
    = \sqrt{\left(\Re\,\delta \tilde{A}_\parallel\right)^2 + \left(\Im\,\delta \tilde{A}_\parallel\right)^2}

    $$


    where $\delta A_\parallel$ is the physical perturbed parallel vector potential
    with units of T m, $A_\mathrm{ref}$ is the reference vector-potential scale with
    the same units, and $\delta \tilde{A}_\parallel$ is dimensionless. The exact reference
    scale is set by the gyrokinetic normalization; common choices include a magnetic
    scale such as $\rho_\mathrm{ref} B_\mathrm{ref}$, with $\rho_\mathrm{ref}$ in
    meters and $B_\mathrm{ref}$ in tesla, or an equivalent potential-based scale specified
    by the chosen nondimensionalization.


    In gyrokinetic modeling, $\delta A_\parallel$ is computed from the electromagnetic
    field solve and is constrained by parallel Ampere''s law. In Fourier representation,
    this relates $k_\perp^2 \delta A_\parallel$ to the perturbed parallel-current
    moment, for example $\mu_0 \sum_s q_s \int v_\parallel g_s\,d^3v$, where $k_\perp$
    is the perpendicular wavenumber in m^-1, $q_s$ is species charge, $v_\parallel$
    is parallel velocity, and $g_s$ is the non-adiabatic distribution perturbation.
    For linear eigenmodes the overall complex scale may be arbitrary, so this amplitude
    is most meaningful together with the stated eigenmode normalization, relative
    variation, or ratios to other fluctuating fields.


    Typical dimensionless amplitudes are strongly normalization dependent. With equilibrium-scale
    normalizations, electrostatic drift-wave cases are often near 0, weakly electromagnetic
    microturbulence commonly gives about 1e-6-1e-3, and kinetic-ballooning or shear-Alfvenic
    cases can reach 1e-3-1; eigenfunctions rescaled to unit maximum can have peak
    amplitude of order 1 by construction.'
  unit: '1'
  physics_domain: turbulence
