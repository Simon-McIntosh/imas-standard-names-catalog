- name: toroidal_iron_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "Toroidal component of the bulk-flow velocity of iron impurity ions\
    \ evaluated at the last closed flux surface in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'This quantity is the local toroidal projection of the bulk-flow
    velocity of iron impurity ions at the last closed flux surface. The iron bulk-flow
    velocity is the density-weighted mean over all included iron ionization states.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, the projection is defined
    by


    $$

    v_{\phi,\mathrm{Fe}} = \mathbf{v}_{\mathrm{Fe}} \cdot \hat{\phi}

    $$


    where $v_{\phi,\mathrm{Fe}}$ is the toroidal velocity component, $\mathbf{v}_{\mathrm{Fe}}$
    is the iron impurity-ion bulk-flow velocity, and $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle $\phi$; $R$ is major radius and
    $Z$ is vertical height.


    The value is local to the plasma boundary and is distinct from the [flux-surface-averaged
    toroidal iron velocity](name:toroidal_flux_surface_averaged_iron_velocity_at_plasma_boundary),
    which averages the same projection over that surface. It is the iron-species counterpart
    of [toroidal carbon velocity at the plasma boundary](name:toroidal_carbon_velocity_at_plasma_boundary).


    Sign convention: Positive when the iron bulk-flow velocity has a component in
    the direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
