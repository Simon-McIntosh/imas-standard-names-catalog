- name: alpha_angle_of_iron_core_segment
  kind: scalar
  status: draft
  description: Alpha angle of an iron core segment is the first signed inclination
    of an oblique trapezoidal or parallelogram cross-section. It is measured in the
    poloidal R-Z cross-section of the right-handed cylindrical (R, phi, Z) frame from
    the outward major-radius direction to the slanted alpha-side direction.
  documentation: 'The alpha angle $\alpha$ is the first inclination angle used to
    parameterize an oblique trapezoidal or parallelogram cross-section of an iron
    core segment. The cross-section is taken in the poloidal $R$-$Z$ plane of the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It defines the orientation of the
    slanted side associated with [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment),
    complementary to the other inclined side length [length_of_iron_core_segment](name:major_length_of_iron_core_segment).


    For an $\alpha$-inclined side, the unit tangent in the cross-section is


    $$

    \hat{t}_{\alpha} = \cos\alpha\,\hat{R} + \sin\alpha\,\hat{Z}

    $$


    where $\hat{t}_{\alpha}$ is the tangent along the alpha-side, $\hat{R}$ and $\hat{Z}$
    are the major-radius and vertical basis vectors of the right-handed cylindrical
    $(R,\phi,Z)$ system, and $\alpha$ is in radians. A side of length $L_{\alpha}$
    then gives in-plane displacements $\Delta R=L_{\alpha}\cos\alpha$ and $\Delta
    Z=L_{\alpha}\sin\alpha$, which fixes the vertices and face normals used in geometric,
    magnetic, and structural calculations.


    In practice, $\alpha$ is obtained from engineering drawings, CAD geometry, or
    the coordinates of the endpoints of the slanted side in the local $R$-$Z$ cross-section.
    If the two endpoints are known, the same convention is recovered with $\alpha=\operatorname{atan2}(Z_2-Z_1,R_2-R_1)$,
    with $R$ and $Z$ in meters and the angular branch chosen consistently with the
    segment geometry.


    There is no universal device-independent design range. The full angular branch
    is commonly interpreted over about $-3.14$-$3.14$ rad; reference orientations
    are $0$ rad for an outward radial side, $1.57$ rad for a vertical upward side,
    and about $3.14$ rad or $-3.14$ rad for an inward radial side. Nearly rectangular
    cross-sections have $\alpha$ close to one of these reference orientations, while
    tapered iron-core segments use design-specific offsets.


    Sign convention: Positive when the alpha-side tangent is rotated counter-clockwise
    from the outward $+\hat{R}$ direction toward $+\hat{Z}$ in an $R$-to-the-right,
    $Z$-up drawing of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/oblique/alpha
    dd_path: iron_core/segment/geometry/oblique/alpha
    status: composed
- name: area_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional area of an individual conductor element of a poloidal
    field coil.
  documentation: 'The area of a poloidal field coil element is the geometric cross-sectional
    area of the conducting material assigned to one conductor element. It is a non-negative
    engineering geometry quantity that sets the conversion between element current
    and average current density and contributes to electromagnetic force, thermal,
    and structural calculations.


    For an arbitrary cross-section, the area is the surface measure of the conductor
    region:


    $$

    A = \int_{\mathcal{S}} dS

    $$


    where $\mathcal{S}$ is the conductor cross-section and $A$ is the resulting area.
    For common parameterizations, a rectangular element has $A = w t$, where $w$ is
    the [width](name:width_of_poloidal_field_coil) and $t$ is the [thickness](name:thickness_of_poloidal_field_coil),
    while an annular element has $A = \pi(r_{\rm out}^2-r_{\rm in}^2)$, where $r_{\rm
    out}$ and $r_{\rm in}$ are the [outer](name:outer_radius_of_poloidal_field_coil)
    and [inner](name:inner_radius_of_poloidal_field_coil) radii.


    In practice this area is obtained from the conductor design geometry, manufacturing
    drawings, or surveyed coil dimensions. For polygonal cross-sections it is computed
    from the closed boundary of the conductor region; for composite conductors the
    effective conducting area may be distinguished from the total structural envelope
    when evaluating the engineering average current density $J = I/A$, where $J$ is
    in A m$^{-2}$, $I$ is the element current in A, and $A$ is in m$^2$.


    Typical values range from $10^{-4}$-$10^{-2}$ m$^2$ for small trim or auxiliary
    poloidal-field conductors to $10^{-2}$-$1$ m$^2$ for large poloidal-field and
    central-solenoid conductor elements, depending on current, cooling, insulation,
    and structural requirements.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:thickness_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/area
    dd_path: pf_active/coil/element/area
    status: composed
- name: area_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Cross-sectional area enclosed by a toroidal field coil conductor in
    the plane normal to the coil centerline. It is the geometric area used with coil
    current to estimate average engineering current density and support electromagnetic
    and structural engineering estimates.
  documentation: 'Area of a toroidal field coil conductor is the area enclosed by
    the conductor cross-section in the plane perpendicular to the local coil centerline.
    In a local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$, the cross-section
    lies in the normal-binormal plane spanned by $(\hat{n}, \hat{b})$; it complements
    the [width](name:width_of_toroidal_field_coil) and [height](name:height_of_toroidal_field_coil)
    of the toroidal field coil conductor.


    For a closed polygonal contour with vertices $(u_i, v_i)$ in the normal-binormal
    plane, where $u$ is distance along $\hat{n}$ and $v$ is distance along $\hat{b}$,
    the area is commonly evaluated using the shoelace formula:


    $$

    A = \frac{1}{2}\left|\sum_{i=1}^{N}\left(u_i v_{i+1} - u_{i+1} v_i\right)\right|,\quad
    (u_{N+1},v_{N+1})=(u_1,v_1)

    $$


    where $A$ is the conductor cross-sectional area, $N$ is the number of contour
    vertices, and $u_i$ and $v_i$ are measured in meters. The absolute value removes
    dependence on whether the contour is traversed clockwise or counter-clockwise
    in the local cross-section plane.


    The area is obtained from the conductor geometry, a design drawing, a CAD model,
    or direct dimensional metrology. For a rectangular cross-section, $A$ is approximately
    the product of the normal and binormal extents; for circular or annular sections,
    the corresponding circular area is used with any represented voids subtracted.
    In engineering estimates the average current density is often approximated as
    $J_\mathrm{eng}=I/A$, with $I$ in A and $J_\mathrm{eng}$ in A m$^{-2}$; for composite,
    hollow, or cable-in-conduit conductors, the current and area must refer to the
    same physical material region.


    Typical values span about $10^{-4}$-$10^{-1}$ m$^2$. Small normal-conducting research
    coils may use conductors near $10^{-4}$-$10^{-3}$ m$^2$, superconducting cable-in-conduit
    conductors are often $10^{-3}$-$10^{-2}$ m$^2$, and large aggregate winding-pack
    or busbar-like conductors can approach $10^{-2}$-$10^{-1}$ m$^2$ depending on
    design and cooling requirements.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:area_of_correction_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/area
    dd_path: tf/coil/conductor/cross_section/area
    status: composed
- name: binormal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate of the toroidal field coil conductor cross-section outline
    vertices along the binormal axis of the local Frenet-Serret frame, measuring each
    polygon vertex's displacement in the binormal direction perpendicular to the conductor
    centerline.
  documentation: 'The binormal coordinate locates each vertex of the polygonal cross-section
    outline of a toroidal field coil conductor along the binormal direction $\hat{b}$
    of the local Frenet-Serret frame. In this frame, the unit tangent $\hat{t}$ follows
    the conductor centerline, the principal normal $\hat{n}$ points toward the center
    of curvature of the conductor path, and the binormal vector is defined as


    $$

    \hat{b} = \hat{t} \times \hat{n}

    $$


    forming a right-handed orthonormal triad $(\hat{t}, \hat{n}, \hat{b})$, with the
    cross-section lying in the $(\hat{n}, \hat{b})$ plane.


    Together with the [normal coordinate], the binormal coordinate fully specifies
    the 2D polygonal shape of the conductor cross-section perpendicular to the conductor
    path. The total span in the binormal direction for a rectangular conductor equals
    the [height of the toroidal field coil]. This framing is also used for non-axisymmetric
    coils; see [binormal coordinate of correction coil] for the analogous quantity.


    These coordinates are derived from engineering design data and are used in electromagnetic
    and structural analyzes of TF coils, where the precise cross-section shape affects
    current density distribution, self-inductance, and mechanical stress. Typical
    TF conductor cross-section dimensions range from a few centimeters to tens of
    centimeters in each local direction.


    Sign convention: Positive when the coordinate is in the direction of $\hat{b}
    = \hat{t} \times \hat{n}$, where $\hat{t}$ is the unit tangent along the conductor
    centerline and $\hat{n}$ is the principal normal directed toward the center of
    curvature.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/binormal
    dd_path: tf/coil/conductor/cross_section/outline/binormal
    status: composed
- name: count_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Number of discrete toroidal field coil modules in the confinement device,
    excluding conductor turns within each module.
  documentation: 'The count of toroidal field coils is the integer total of discrete
    coil modules arranged around the device to produce the dominant toroidal magnetic
    field. It counts coil modules, not individual conductor turns, pancakes, or strands
    within a module, and is a fixed engineering design parameter for the magnet system.


    For an axisymmetric tokamak with uniformly spaced toroidal field coils, this count
    sets the rotational periodicity of the coil set. If the count is $N_\mathrm{TF}$,
    one geometric sector spans $2\pi/N_\mathrm{TF}$ in toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical
    height. The finite number and detailed shape of the coils determine the toroidal-field
    ripple spectrum and can affect fast-ion confinement and periodic heat-load patterns.


    The count is obtained from the device magnet design by identifying the mechanically
    distinct toroidal field coil modules in the full torus. It is used together with
    geometric coil properties such as [cross-sectional area](name:area_of_toroidal_field_coil),
    [conductor width](name:width_of_toroidal_field_coil), and [major-radius position](name:major_radius_of_toroidal_field_coil)
    when characterizing the toroidal field system. In stellarators and heliotrons,
    comparable coil counts usually refer to separate modular, helical, or planar coil
    families rather than to tokamak-style toroidal field coils.


    Typical tokamak values are 12-20 toroidal field coils, with many medium and large
    devices using 16-18 coils. Smaller or specialized devices may use fewer coils,
    while increasing the count generally reduces the angular spacing between coils
    and changes the high-toroidal-mode content of the ripple field.'
  unit: '1'
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:major_radius_of_toroidal_field_coil
  sources:
  - id: dd:tf/coils_n
    dd_path: tf/coils_n
    status: composed
- name: fast_neutron_flux_of_correction_coil
  kind: scalar
  status: draft
  description: Fast neutron flux incident on the inboard side of a non-axisymmetric
    correction coil, used to assess radiation exposure and predict material degradation
    of coil components.
  documentation: 'Fast neutrons produced predominantly by deuterium-tritium fusion
    reactions scatter through plasma-facing and structural components and irradiate
    the conductors of non-axisymmetric correction coils. The fast neutron flux quantifies
    the number of energetic neutrons crossing a unit area of the coil''s inboard surface
    per unit time, with the inboard face experiencing the highest neutron loading
    due to its relative proximity to the plasma.


    The threshold-integrated fast neutron flux is defined as:


    $$

    \Phi_{\rm fast} = \int_{E \geq E_{\rm th}} \phi(E) \, dE

    $$


    where $\phi(E)$ is the differential neutron flux spectrum (m$^{-2}$ s$^{-1}$ eV$^{-1}$),
    $E$ is neutron kinetic energy, and $E_{\rm th}$ is a threshold energy (commonly
    0.1 MeV or 1 MeV) defining the fast-neutron energy range.


    This quantity is computed from neutron transport calculations using the device
    three-dimensional geometry and the predicted fusion neutron source rate; results
    are validated against threshold-detector or activation-foil measurements placed
    near accessible coil positions. Time-integrating this flux over an operational
    pulse yields the neutron fluence, which governs displacement damage in conductor
    insulation and structural materials. The analogous quantity for the main toroidal
    field coil is [fast_neutron_flux_of_toroidal_field_coil](name:fast_neutron_flux_of_toroidal_field_coil);
    for direct detector measurements see [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).'
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_toroidal_field_coil
  - name:neutron_flux_of_neutron_detector
  sources:
  - id: dd:coils_non_axisymmetric/coil/neutron_fast_flux_inboard
    dd_path: coils_non_axisymmetric/coil/neutron_fast_flux_inboard
    status: composed
- name: fast_neutron_flux_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Fast neutron flux incident on the inboard side of a toroidal field
    coil, providing a measure of radiation exposure relevant to material activation,
    radiation damage, and conductor insulation lifetime assessment.
  documentation: "Fast neutron flux at a toroidal field coil quantifies the number\
    \ of energetic neutrons crossing unit area per unit time at the inboard-facing\
    \ surface of the coil structure. In deuterium-tritium burning plasmas, 14.1 MeV\
    \ fusion neutrons are the dominant source; these are attenuated and scattered\
    \ by the blanket and shield, but a residual fast population reaches the coil and\
    \ constitutes the primary radiation load on the superconducting windings and their\
    \ organic insulation.\n\nThe quantity is the energy-integrated fluence rate above\
    \ a fast-neutron threshold:\n\n$$\n\\Phi_n = \\int_{E_\\mathrm{th}}^{\\infty}\
    \ \\Phi(E)\\, dE\n$$\n\nwhere $\\Phi(E)$, in m$^{-2}$ s$^{-1}$ eV$^{-1}$, is the\
    \ differential neutron flux spectrum and $E_\\mathrm{th}$ is the fast-neutron\
    \ energy threshold adopted in the transport model.\n\nThis flux drives radiation\
    \ damage processes including atomic displacement damage in conductor structural\
    \ materials, helium bubble formation, and degradation of organic insulation resins\
    \ \u2014 all of which set operational lifetime limits for the coil. It is assessed\
    \ using Monte Carlo or deterministic neutron transport codes, validated against\
    \ activation foil and threshold detector measurements. The analogous quantity\
    \ for non-axisymmetric correction coils is [fast_neutron_flux_of_correction_coil](name:fast_neutron_flux_of_correction_coil)."
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_correction_coil
  sources:
  - id: dd:tf/coil/neutron_fast_flux_inboard
    dd_path: tf/coil/neutron_fast_flux_inboard
    status: composed
- name: height_of_correction_coil
  kind: scalar
  status: draft
  description: Full height of the rectangular cross-section of a correction-coil conductor
    along the binormal axis of the local Frenet-Serret (tangent, normal, binormal)
    frame.
  documentation: 'The height of a correction coil is the full transverse extent of
    a rectangular conductor cross-section along the binormal basis vector $\hat{b}$
    of the local Frenet-Serret frame $(\hat{t}, \hat{n}, \hat{b})$ attached to the
    conductor centerline. It is the dimension perpendicular to the normal-direction
    width and is meaningful when the conductor cross-section is represented as rectangular.


    For a rectangular cross-section, the complementary width $w$ is measured along
    $\hat{n}$ and the height $h$ is measured along $\hat{b}$. Their product gives
    the cross-sectional area $A = w h$, where $h$ and $w$ are in meters and $A$ is
    in square meters. For a conductor carrying current $I$ in amperes, a simple average
    engineering current density is $J_\mathrm{eng} = I/A$ in A m^-2, before any corrections
    for insulation, cooling channels, or nonconducting structural material.


    In design and metrology, the height is obtained by resolving the rectangular cross-section
    onto the $\hat{b}$ direction of the local Frenet-Serret frame $(\hat{t}, \hat{n},
    \hat{b})$ along the conductor centerline. The associated local coordinates are
    described by [binormal_coordinate_of_correction_coil](name:binormal_coordinate_of_correction_coil)
    and [normal_coordinate_of_correction_coil](name:normal_coordinate_of_correction_coil),
    while the perpendicular rectangular dimension is [width_of_correction_coil](name:width_of_correction_coil).


    Representative values for correction-coil conductor or winding-pack heights are
    0.01-0.2 m for compact internal or edge coils and 0.05-0.5 m for larger external
    coils. The selected value depends on required ampere-turns, current density limits,
    cooling layout, insulation thickness, and mechanical support requirements.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_correction_coil
  - name:area_of_correction_coil
  - name:height_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/height
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/height
    status: attached
- name: height_of_iron_core_segment
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of an iron core
    segment, defining the vertical extent of the segment geometry used in electromagnetic
    modeling of the tokamak transformer core.
  documentation: "The height of an iron core segment is the total vertical dimension\
    \ of the rectangular cross-section in the axisymmetric representation of the ferromagnetic\
    \ transformer core used to drive poloidal flux in a tokamak. In the thick-line\
    \ approximation, each core segment is modeled with a rectangular cross-section;\
    \ this quantity measures its extent along the $Z$ axis of the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is the major radius and $Z$ is the vertical\
    \ coordinate.\n\nThe rectangular cross-section area $A$ entering the magnetic\
    \ reluctance calculation is:\n\n$$\nA = h \\cdot w\n$$\n\nwhere $h$ is the height\
    \ and $w$ is the [width](name:width_of_iron_core_segment). The reluctance follows\
    \ $\\mathcal{R} = l\\,/\\,(\\mu_r \\mu_0 A)$, where $l$ is the path length along\
    \ the segment, $\\mu_r$ is the relative permeability of the iron, and $\\mu_0\
    \ = 4\\pi \\times 10^{-7}$ H m$^{-1}$ is the permeability of free space.\n\nThe\
    \ segment geometry \u2014 including this height, the [width_of_iron_core_segment](name:width_of_iron_core_segment),\
    \ and the [thickness_of_iron_core_segment](name:thickness_of_iron_core_segment)\
    \ \u2014 is derived from engineering drawings of the tokamak magnetic circuit\
    \ and provided as input to field and equilibrium reconstruction models. For segments\
    \ with annular cross-sections, the complementary radial dimensions [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment)\
    \ and [outer_radius_of_iron_core_segment](name:outer_radius_of_iron_core_segment)\
    \ apply instead.\n\nSign convention: Positive when the vertical extent is measured\
    \ from the lower boundary to the upper boundary of the cross-section in the $+Z$\
    \ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_iron_core_segment
  - name:thickness_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  sources:
  - id: dd:ferritic/object/axisymmetric/rectangle/height
    dd_path: ferritic/object/axisymmetric/rectangle/height
    status: attached
  - id: dd:iron_core/segment/geometry/rectangle/height
    dd_path: iron_core/segment/geometry/rectangle/height
    status: attached
- name: height_of_passive_structure
  kind: scalar
  status: draft
  description: Vertical full height of a rectangular cross-section element of a passive
    conducting structure, measured along Z in the right-handed cylindrical (R, phi,
    Z) frame.
  documentation: 'Height of passive structure is the full vertical extent of a rectangular
    cross-section passive conducting element. It is measured parallel to $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. The quantity is a geometric length
    and is non-negative.


    For a rectangular cross-section whose sides are aligned with the $R$ and $Z$ directions,
    the cross-sectional area is related to height and width by:


    $$

    A = h w

    $$


    where $h$ is the vertical height in meters, $w$ is the horizontal [width of the
    passive structure](name:width_of_passive_structure) in meters, and $A$ is the
    rectangular cross-sectional area in square meters.


    In practice, this height is obtained from engineering geometry, survey data, or
    geometric reconstruction of the passive conductor boundary as the separation between
    the lower and upper faces of the rectangular cross-section. It applies specifically
    to rectangular cross-sections; annular or shell-like passive-loop descriptions
    are better characterized by quantities such as [inner radius of passive loop](name:inner_radius_of_passive_loop)
    and [thickness of passive loop](name:thickness_of_passive_loop).


    Typical values range from 0.01-1 m. Small segmented passive conductors may have
    heights of a few centimeters, while large vessel-integrated or stabilizing conducting
    structures can have vertical extents of several tenths of a meter or more.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_passive_structure
  - name:inner_radius_of_passive_loop
  - name:thickness_of_passive_loop
  - name:length_of_passive_structure
  sources:
  - id: dd:pf_passive/loop/element/geometry/rectangle/height
    dd_path: pf_passive/loop/element/geometry/rectangle/height
    status: composed
- name: height_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of a poloidal
    field coil conductor element, measured parallel to Z in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'The height of a poloidal field coil conductor element is the full
    vertical extent of its rectangular cross-section. It is measured parallel to the
    $Z$ axis of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a rectangular cross-section, the height is the difference between the upper
    and lower vertical boundaries:


    $$

    h = Z_{\max} - Z_{\min}

    $$


    where $h$ is the coil height, and $Z_{\max}$ and $Z_{\min}$ are the maximum and
    minimum vertical coordinates of the conductor cross-section boundary.


    This dimension is obtained from coil engineering geometry, drawings, or electromagnetic
    models. Together with the radial [width of a poloidal field coil](name:width_of_poloidal_field_coil),
    it defines the rectangular cross-section; for a solid rectangle, their product
    gives the [area of a poloidal field coil](name:area_of_poloidal_field_coil). The
    related [thickness of a poloidal field coil](name:thickness_of_poloidal_field_coil)
    describes a separate conductor or winding-pack extent when that dimension is distinguished.


    Typical values range from 0.05-0.5 m for small correction or shaping coils and
    about 0.2-2 m for large equilibrium-field coils, depending on current capacity,
    mechanical support, and available space.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_poloidal_field_coil
  - name:thickness_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:height_of_iron_core_segment
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/height
    dd_path: pf_active/coil/element/geometry/rectangle/height
    status: composed
  - id: dd:pf_active/coil/geometry/rectangle/height
    dd_path: pf_active/coil/geometry/rectangle/height
    status: attached
- name: height_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Full geometric height of a rectangular toroidal-field-coil conductor
    cross-section measured along the binormal direction of the local right-handed
    Frenet-Serret frame. It is a gross external envelope dimension, not a net current-carrying
    material thickness.
  documentation: 'The height of a toroidal field coil conductor cross-section is the
    full geometric extent of a rectangular conductor envelope measured along the binormal
    direction $\hat{b}$ of the local right-handed Frenet-Serret frame $(\hat{t}, \hat{n},
    \hat{b})$ attached to the conductor centerline. Together with the complementary
    [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil), measured along
    $\hat{n}$, it specifies the rectangular external cross-section used for coil geometry
    and engineering calculations.


    For a rectangular conductor envelope, the gross cross-sectional area is related
    to height and width by:


    $$

    A_\mathrm{env} = w h

    $$


    where $h$ is this height, $w$ is the corresponding rectangular width, and $A_\mathrm{env}$
    is the gross envelope area of the modeled conductor cross-section.


    In practice this dimension is taken from engineering drawings, manufacturing specifications,
    or a geometric model of the toroidal field coil conductor. It represents the outer
    envelope of the modeled conductor cross-section and should not be interpreted
    as the net thickness of current-carrying material; internal subdivision into strands,
    stabilizer, jacket, coolant channels, insulation, or voids is accounted for separately
    unless those regions are explicitly included in the chosen conductor envelope.
    For non-rectangular conductor shapes, polygonal outline quantities such as [binormal_coordinate_of_toroidal_field_coil](name:binormal_coordinate_of_toroidal_field_coil)
    provide the detailed shape description.


    Typical gross heights are about 0.02-0.2 m for individual cable-in-conduit or
    busbar-like toroidal field coil conductors, and about 0.2-1.5 m when the modeled
    conductor represents a larger homogenized winding-pack block. The appropriate
    value depends on machine size, number of turns, conductor technology, and the
    level of geometric homogenization used in the coil model.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:height_of_poloidal_field_coil
  - name:height_of_correction_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/height
    dd_path: tf/coil/conductor/cross_section/height
    status: composed
- name: inner_radius_of_correction_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a non-axisymmetric correction
    coil conductor, defining the bore size of the hollow conductor or winding pack.
  documentation: 'The inner radius defines the bore boundary of the annular cross-section
    used to model a correction coil conductor or winding pack. Together with the outer
    radius given by [radius_of_correction_coil](name:radius_of_correction_coil), it
    fully specifies the hollow circular geometry, with conductor material occupying
    the annular region between $r_{\rm in}$ (this quantity) and $r_{\rm out}$.


    The cross-sectional area enclosed by the conductor annulus is


    $$

    A = \pi \left( r_{\rm out}^2 - r_{\rm in}^2 \right)

    $$


    where $r_{\rm out}$ is the outer radius and $r_{\rm in}$ is the inner radius,
    both in meters.


    This parameter enters electromagnetic and structural models of non-axisymmetric
    coils used for error field correction or ELM suppression. The [area_of_correction_coil](name:area_of_correction_coil)
    is computed directly from the inner and outer radii. An analogous bore parameter
    for poloidal field coils is given by [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).


    Sign convention: Positive when measured as a radial distance from the conductor
    bore axis to the inner conducting surface.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_correction_coil
  - name:area_of_correction_coil
  - name:inner_radius_of_poloidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    status: attached
- name: inner_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Inner radius of an iron-core segment is the non-negative distance from
    the center or central axis of an annular cross-section to its inner ferromagnetic
    boundary. It defines the hollow bore and must be smaller than the corresponding
    outer radius.
  documentation: 'The inner radius of an iron-core segment is the radius of the inner
    boundary of an annular ferromagnetic cross-section. It identifies the boundary
    between the hollow region and the iron material, and together with [outer_radius_of_iron_core_segment](name:outer_radius_of_iron_core_segment)
    fixes the annular geometry of the segment.


    For a circular annulus, the defining distance is


    $$

    r_\mathrm{inner} = \left|\mathbf{x}_\mathrm{inner} - \mathbf{x}_0\right|

    $$


    where $\mathbf{x}_0$ is the center of the annular cross-section, $\mathbf{x}_\mathrm{inner}$
    is any point on the circular inner ferromagnetic boundary, and the resulting radius
    is measured in meters. A physically valid annulus satisfies $0 \le r_\mathrm{inner}
    < r_\mathrm{outer}$, where $r_\mathrm{outer}$ is the outer radius in meters; the
    corresponding iron cross-sectional area is $A = \pi\left(r_\mathrm{outer}^2 -
    r_\mathrm{inner}^2\right)$.


    This radius is used when constructing geometric and electromagnetic representations
    of iron-core segments. Increasing the inner radius reduces the flux-conducting
    iron area for a fixed outer radius, thereby affecting magnetic reluctance, possible
    saturation, and mass distribution. Non-annular segment cross-sections are more
    naturally described by [width_of_iron_core_segment](name:width_of_iron_core_segment)
    and [height_of_iron_core_segment](name:height_of_iron_core_segment).


    Typical values are strongly device- and design-dependent. In tokamak iron-core
    models they are usually engineering-scale lengths, from about 0.1-5 m, with compact
    or local annular segments toward the lower end and large central-core or return-yoke
    elements toward the upper end.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:iron_core/segment/geometry/annulus/radius_inner
    dd_path: iron_core/segment/geometry/annulus/radius_inner
    status: composed
- name: inner_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a passive conducting loop
    element. It is the distance from the annulus center to the inner conducting boundary
    and, with the outer radius, sets the conductor thickness used in electromagnetic
    and resistive calculations.
  documentation: 'The inner radius of a passive loop is the radius of the hole or
    excluded central region in an annular conductor cross-section. Together with the
    [outer radius](name:outer_radius_of_passive_loop), it defines the conducting material
    thickness of the loop element and affects its resistance, inductance, and eddy-current
    response.


    For an ideal annular cross-section, the conducting area is related to the inner
    and outer radii by:


    $$

    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)

    $$


    where $A$ is the conducting cross-sectional area, $r_\mathrm{inner}$ is the inner
    radius, and $r_\mathrm{outer}$ is the corresponding outer radius.


    The value is determined from the mechanical geometry of the passive conducting
    structure, such as a vacuum-vessel segment, stabilizing plate, shell, or other
    closed conducting loop. It is used in reduced electromagnetic models to compute
    the conductor area, resistance, mutual inductance, and induced eddy currents.
    The closely related [inner radius of a passive structure](name:inner_radius_of_passive_loop)
    describes the same geometric concept for passive conducting structures more generally.


    Typical values range from 0.001-0.1 m for small annular conductor features and
    from 0.01-1 m for large vessel or support-structure elements, depending on the
    device scale and the level of geometric simplification.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_inner
    dd_path: pf_passive/loop/element/geometry/annulus/radius_inner
    status: composed
- name: inner_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular conductor cross-section of a toroidal field
    coil. It is the non-negative distance from the annulus center to the bore-side
    boundary of the conducting material.
  documentation: 'The inner radius $r_\mathrm{inner}$ is the distance from the center
    of an annular toroidal-field-coil conductor cross-section to the inner boundary
    of the conducting material. It describes the radius of the central opening of
    the annulus and is defined only for hollow, annular conductor cross-sections,
    with $0 \le r_\mathrm{inner} < r_\mathrm{outer}$.


    For an annular conductor, the conducting cross-sectional area is related to the
    inner and outer radii by:


    $$

    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)

    $$


    where $A$ is the conducting area, $r_\mathrm{inner}$ is the inner radius in meters,
    and $r_\mathrm{outer}$ is the outer radius in meters. The paired quantity $r_\mathrm{outer}$
    is represented by outer_radius_of_toroidal_field_coil.


    This radius is specified from the mechanical design of the toroidal field coil
    conductor or inferred from cross-section drawings and manufacturing data. Together
    with the outer radius, it determines the amount of conducting material, the available
    cooling or insulation space in the central opening, and derived engineering quantities
    such as average current density.


    Typical values range from 0 m for a solid conductor treated as the limiting case
    to about 0.01-0.5 m for large annular conductors, depending on coil scale, conductor
    technology, cooling-channel layout, and structural design.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:tf/coil/conductor/cross_section/radius_inner
    dd_path: tf/coil/conductor/cross_section/radius_inner
    status: composed
- name: major_length_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at the alpha angle from the
    major-radius direction, defining the alpha-edge of the oblique cross-section of
    a poloidal field coil.
  documentation: 'In the oblique parallelogram model of a poloidal field coil cross-section,
    the full shape in the poloidal $(R, Z)$ plane is described by two inclined side
    lengths and their respective angles from the outward major-radius direction $+\hat{R}$.
    The major length $L_\alpha$ is the Euclidean length of the side whose orientation
    is inclined at the alpha angle from $+\hat{R}$, complementing the beta-side length
    given by [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil).


    For a parallelogram cross-section with alpha-side $L_\alpha$, beta-side $L_\beta$,
    and interior angle $\theta$ between the two sides, the cross-sectional area satisfies:


    $$

    A = L_\alpha \, L_\beta \, \sin\theta

    $$


    where $\theta$ is set by the combination of the alpha and beta inclination angles.


    This side length, together with [radial_angle_of_poloidal_field_coil](name:radial_angle_of_poloidal_field_coil)
    and [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil), fully
    parameterizes the oblique cross-section and enters coil flux and inductance calculations.
    The same alpha-side naming convention is used for iron core segments in [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment)
    and for individual conductor elements in major_length_of_coil_conductor_element.


    Sign convention: Positive as a geometric side length in the poloidal $(R, Z)$
    plane; this quantity is invariant under reversal of plasma current or toroidal
    field direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:length_of_poloidal_field_coil
  - name:radial_angle_of_poloidal_field_coil
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:pf_active/coil/element/geometry/oblique/length_alpha
    dd_path: pf_active/coil/element/geometry/oblique/length_alpha
    status: attached
  - id: dd:pf_active/coil/geometry/oblique/length_alpha
    dd_path: pf_active/coil/geometry/oblique/length_alpha
    status: composed
- name: major_radius_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Major-radius coordinate of a geometric point defining a coil conductor
    element, such as its center or an end point. It is the radial distance from the
    toroidal symmetry axis in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The major radius of a coil conductor element is the radial coordinate
    of a point used to define the element geometry, such as the element center, start
    point, end point, or another point on its conductor centerline. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is distance from the toroidal symmetry axis
    in meters, $\phi$ is toroidal angle in radians, and $Z$ is vertical height in
    meters.


    For a conductor-element point with Cartesian coordinates $(x,y,z)$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}=\hat{Z}$, the major
    radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates measured from the toroidal
    symmetry axis.


    The value is obtained from the specified coil geometry, mechanical design model,
    or surveyed conductor position. Together with the complementary [toroidal angle
    of a coil conductor element](name:toroidal_angle_of_coil_conductor_element) and
    [vertical coordinate of a coil conductor element], it locates the conductor-element
    point in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Typical values are set by the physical size of the coil system. In tokamak applications,
    conductor-element major radii are commonly of order 1-10 m for main field-coil
    structures, with smaller values possible in compact laboratory devices and larger
    values in reactor-scale designs.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_angle_of_coil_conductor_element
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/elements/centres/r
    dd_path: coils_non_axisymmetric/coil/conductor/elements/centres/r
    status: composed
  - id: dd:coils_non_axisymmetric/coil/conductor/elements/intermediate_points/r
    dd_path: coils_non_axisymmetric/coil/conductor/elements/intermediate_points/r
