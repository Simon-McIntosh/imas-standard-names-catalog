- name: parallel_normalized_perturbed_current_density
  kind: scalar
  status: active
  description: Dimensionless parallel component of the perturbed current density,
    obtained as a parallel-velocity-weighted moment of the perturbed distribution
    function in gyrokinetic theory and normalized to a reference current scale.
  documentation: 'The parallel normalized perturbed current density is the projection
    of the [normalized_perturbed_current_density](name:normalized_perturbed_current_density)
    vector along the equilibrium magnetic field direction. It characterizes how perturbations
    to the particle or gyrocenter distribution function $\delta f$ drive parallel
    current fluctuations relative to equilibrium, with normalization by a reference
    current density yielding a dimensionless measure of the parallel current response
    strength.


    The general defining moment takes the form:


    $$

    \tilde{j}_\parallel = \frac{\sum_s q_s \int v_\parallel \, \delta f_s \, d^3v}{j_\text{ref}}

    $$


    where $q_s$ is the charge of species $s$, $v_\parallel$ is the velocity component
    along the background magnetic field $\mathbf{B}$, $\delta f_s$ is the perturbed
    distribution function for species $s$, and $j_\text{ref}$ is a reference current
    density set by the gyrokinetic normalization. Finite-Larmor-radius corrections
    to this moment arise through Bessel-function weighting of the velocity-space integral;
    [parallel_normalized_perturbed_current_density_bessel_1](name:parallel_normalized_perturbed_current_density_bessel_1)
    isolates the J1-weighted contribution that enters the electromagnetic response
    through the perturbed parallel vector potential.


    This quantity enters the parallel component of Ampere''s law in gyrokinetic field
    equations, coupling the plasma current response to electromagnetic field perturbations.
    It is evaluated from gyrocenter or particle distribution functions in linear eigenmode
    analyzes and nonlinear turbulence simulations.


    Sign convention: Positive when the perturbed parallel current flows in the direction
    of the background magnetic field $\mathbf{B}$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_current_density
  - name:parallel_normalized_perturbed_current_density_bessel_1
  arguments:
  - name: normalized_perturbed_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_normalized_perturbed_current_density_bessel_1
  kind: scalar
  status: active
  description: Dimensionless finite-Larmor-radius contribution to the field-aligned
    perturbed current-density moment of a gyrocenter distribution, weighted by the
    first-order Bessel function.
  documentation: 'This quantity is the dimensionless finite-Larmor-radius contribution
    to the parallel perturbed current-density moment of a gyrocenter distribution.
    It is the Bessel-weighted component associated with the first-order gyroaveraging
    response and refines the full [parallel normalized perturbed current density](name:parallel_normalized_perturbed_current_density).


    A defining normalized moment is


    $$

    \mathcal{J}_{\parallel,\mathrm{FLR}}^{(1)} = \frac{1}{j_{\mathrm{ref}}} \sum_s
    q_s \int d^3v\, v_\parallel J_1(k_\perp\rho_s)\,\delta f_s

    $$


    where $q_s$ is the charge of species $s$ in C, $v_\parallel$ is its velocity along
    the local magnetic field in m/s, $\delta f_s$ is the perturbed gyrocenter distribution,
    $d^3v$ is the velocity-space measure, $J_1$ is the dimensionless first-order Bessel
    function, $k_\perp$ is the perpendicular wavenumber in m$^{-1}$, $\rho_s$ is the
    species gyroradius in m, and $j_{\mathrm{ref}}$ is the positive reference current-density
    scale in A/m$^2$.


    This component retains only the $J_1$-weighted finite-Larmor-radius contribution;
    it is not the complete parallel response or the unrestricted vector quantity [normalized
    gyrocenter perturbed current density](name:normalized_gyrocenter_perturbed_current_density).


    Sign convention: Positive when the charge-weighted moment is directed along the
    local magnetic-field unit vector $\hat{\mathbf b}$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_current_density
  - name:normalized_gyrocenter_perturbed_current_density
  arguments:
  - name: parallel_normalized_perturbed_current_density
    operator: bessel_1
    operator_kind: unary_postfix
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/j_parallel
