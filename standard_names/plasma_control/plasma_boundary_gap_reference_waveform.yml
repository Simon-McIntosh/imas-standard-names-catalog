name: plasma_boundary_gap_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for the normalized distance between
  the last closed flux surface and a first-wall or limiter reference contour.
documentation: "The plasma boundary gap reference waveform $g_{\\mathrm{ref}}(t)$\
  \ defines the desired clearance between the last closed flux surface (LCFS) and\
  \ a predefined wall or limiter contour point as a function of time. It is a primary\
  \ input to the plasma shape and position controller, which modulates poloidal-field\
  \ (PF) coil currents to maintain the prescribed distance and thereby protect plasma-facing\
  \ components while optimizing confinement volume and shaping parameters. Multiple\
  \ gap channels are typically defined at distinct poloidal locations around the vessel\
  \ cross section, each with its own reference waveform and control envelope specifying\
  \ the acceptable tolerance band. The dimensionless unit (1) indicates that the gap\
  \ is expressed in a normalized form relative to a machine-specific length scale\
  \ (e.g., the plasma minor radius $a$); before normalization, physical gaps range\
  \ from a few millimeters near the divertor strike points to 5\u201315 cm at the\
  \ outboard midplane in medium-to-large tokamaks. Real-time gap estimation relies\
  \ on magnetic equilibrium reconstruction codes or parameterized plasma boundary\
  \ models operating within the feedback loop. See also reference waveforms for complementary\
  \ shape descriptors such as elongation and triangularity."
