      kind: template
- name: line_averaged_helium_3_density
  kind: scalar
  status: active
  description: Line-averaged helium-3 density is the chord-length average of local
    ionized helium-3 density along a specified viewing path, excluding neutral atoms.
  documentation: 'Line-averaged helium-3 density is the chord-length average of the
    local helium-3 ion number density along a specified path. It includes singly ionized
    $^3\mathrm{He}^{+}$ and fully stripped $^3\mathrm{He}^{2+}$ ions, while excluding
    neutral helium-3 atoms.


    The line average is defined by


    $$

    \overline{n}_{^3\mathrm{He}} = \frac{1}{L}\int_{0}^{L} n_{^3\mathrm{He}}(s)\,\mathrm{d}s

    $$


    where $\overline{n}_{^3\mathrm{He}}$ is the line-averaged density, $n_{^3\mathrm{He}}(s)$
    is the local charge-state-summed density at path coordinate $s$, and $L$ is the
    chord length. Unlike the volume average in [volume-averaged helium-3 density](name:volume_averaged_helium_3_density),
    this quantity weights each position uniformly by distance along the path. It is
    a path-integrated representation of [helium-3 density](name:helium_3_density),
    not a separate charge-state population.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_helium_3_density
  - name:helium_3_density
  arguments:
  - name: helium_3_density
    operator: line_averaged
    operator_kind: qualifier
