name: electron_particle_radial_diffusivity
status: draft
description: Radial diffusion coefficient for electron particle transport, quantifying
  the turbulent and collisional spreading of electron density across flux surfaces.
documentation: "The electron particle radial diffusivity $D_e^r$ (m$^2$\xB7s$^{-1}$)\
  \ relates the radial electron particle flux $\\Gamma_e$ to the electron density\
  \ gradient via $\\Gamma_e = -D_e^r \\nabla_r n_e + V_e^{\\rm pinch} n_e$, where\
  \ $n_e$ is the electron number density (m$^{-3}$) and $V_e^{\\rm pinch}$ is the\
  \ pinch velocity (m\xB7s$^{-1}$). In tokamak core plasmas, neoclassical contributions\
  \ yield $D_e^r \\sim 0.01$\u2013$0.1$ m$^2$\xB7s$^{-1}$, while turbulence-driven\
  \ (anomalous) transport typically raises the effective value to $0.1$\u2013$1$ m$^2$\xB7\
  s$^{-1}$; in the edge and scrape-off layer, values can exceed $1$ m$^2$\xB7s$^{-1}$.\
  \ This coefficient is inferred from perturbative experiments (gas-puff modulation,\
  \ pellet injection), or computed by gyrokinetic and fluid turbulence codes such\
  \ as GENE, GS2, or SOLPS-ITER. See also `electron_number_density` for the transported\
  \ quantity and `radial_component_of_ion_momentum_diffusivity` for the analogous\
  \ ion momentum channel."
