- name: height_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Full geometric height of a rectangular toroidal-field-coil conductor
    cross-section measured along the binormal direction of the local right-handed
    Frenet-Serret frame. It is a gross external envelope dimension, not a net current-carrying
    material thickness.
  documentation: 'The height of a toroidal field coil conductor cross-section is the
    full geometric extent of a rectangular conductor envelope measured along the binormal
    direction $\hat{b}$ of the local right-handed Frenet-Serret frame $(\hat{t}, \hat{n},
    \hat{b})$ attached to the conductor centerline. Together with the complementary
    [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil), measured along
    $\hat{n}$, it specifies the rectangular external cross-section used for coil geometry
    and engineering calculations.


    For a rectangular conductor envelope, the gross cross-sectional area is related
    to height and width by:


    $$

    A_\mathrm{env} = w h

    $$


    where $h$ is this height, $w$ is the corresponding rectangular width, and $A_\mathrm{env}$
    is the gross envelope area of the modeled conductor cross-section.


    In practice this dimension is taken from engineering drawings, manufacturing specifications,
    or a geometric model of the toroidal field coil conductor. It represents the outer
    envelope of the modeled conductor cross-section and should not be interpreted
    as the net thickness of current-carrying material; internal subdivision into strands,
    stabilizer, jacket, coolant channels, insulation, or voids is accounted for separately
    unless those regions are explicitly included in the chosen conductor envelope.
    For non-rectangular conductor shapes, polygonal outline quantities such as [binormal_coordinate_of_toroidal_field_coil](name:binormal_coordinate_of_toroidal_field_coil)
    provide the detailed shape description.


    Typical gross heights are about 0.02-0.2 m for individual cable-in-conduit or
    busbar-like toroidal field coil conductors, and about 0.2-1.5 m when the modeled
    conductor represents a larger homogenized winding-pack block. The appropriate
    value depends on machine size, number of turns, conductor technology, and the
    level of geometric homogenization used in the coil model.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:height_of_poloidal_field_coil
  - name:height_of_correction_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/height
    dd_path: tf/coil/conductor/cross_section/height
    status: composed
- name: inner_radius_of_correction_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a non-axisymmetric correction
    coil conductor, defining the bore size of the hollow conductor or winding pack.
  documentation: 'The inner radius defines the bore boundary of the annular cross-section
    used to model a correction coil conductor or winding pack. Together with the outer
    radius given by radius_of_correction_coil, it fully specifies the hollow circular
    geometry, with conductor material occupying the annular region between $r_{\rm
    in}$ (this quantity) and $r_{\rm out}$.


    The cross-sectional area enclosed by the conductor annulus is


    $$

    A = \pi \left( r_{\rm out}^2 - r_{\rm in}^2 \right)

    $$


    where $r_{\rm out}$ is the outer radius and $r_{\rm in}$ is the inner radius,
    both in meters.


    This parameter enters electromagnetic and structural models of non-axisymmetric
    coils used for error field correction or ELM suppression. The [area_of_correction_coil](name:area_of_correction_coil)
    is computed directly from the inner and outer radii. An analogous bore parameter
    for poloidal field coils is given by [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).


    Sign convention: Positive when measured as a radial distance from the conductor
    bore axis to the inner conducting surface.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_correction_coil
  - name:inner_radius_of_poloidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/radius_inner
    status: composed
- name: length_of_iron_core_segment
  kind: scalar
  status: draft
  description: Non-negative Euclidean length of the beta-angle-inclined side of an
    oblique parallelogram iron-core segment, measured in the poloidal R-Z plane of
    the right-handed cylindrical (R, phi, Z) frame. The side is referenced to the
    vertical Z direction; its inclination is set by the beta angle.
  documentation: 'Length of an iron-core segment is the non-negative Euclidean size
    of the beta-inclined side of an oblique parallelogram cross-section. The geometry
    is interpreted in a poloidal cross-section of the right-handed cylindrical $(R,
    \phi, Z)$ frame, with $R$ the major radius and $Z$ the vertical height. The beta
    side is referenced to the $+Z$ vertical direction: the beta angle specifies the
    inclination of that side in the $R$-$Z$ plane, toward increasing $R$ for a positive
    beta angle.


    For two vertices on the same beta-inclined side, the length is the Euclidean distance
    between their coordinates in the poloidal cross-section:


    $$

    L_\beta = \sqrt{(R_2 - R_1)^2 + (Z_2 - Z_1)^2}

    $$


    where $L_\beta$ is this side length, $(R_1, Z_1)$ and $(R_2, Z_2)$ are the endpoint
    coordinates, $R$ is major radius, and $Z$ is vertical height. The endpoint ordering
    does not affect $L_\beta$; the beta-angle convention selects which pair of opposite
    sides of the parallelogram is being measured.


    The quantity is normally derived from the geometric specification of the iron
    core, such as CAD vertices, mechanical drawings, or survey points. A complete
    oblique-parallelogram parameterization requires this beta-side length together
    with the complementary major length or other side length, the alpha and beta angle
    conventions, and a position reference such as a center or corner; the length alone
    does not determine the full cross-section.


    Typical values for magnetic-system iron-core segments range from 0.05-10 m. Small
    shaping inserts or chamfer-like pieces can be below 0.5 m, while large transformer
    limbs and yoke segments are commonly 1-10 m.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_iron_core_segment
  - name:alpha_angle_of_iron_core_segment
  - name:height_of_iron_core_segment
  - name:width_of_iron_core_segment
- name: length_of_passive_structure
  kind: scalar
  status: draft
  description: Non-negative Euclidean length of the beta-side inclined edge of an
    oblique parallelogram cross-section of a passive conducting structure element,
    measured in the poloidal R-Z plane of the right-handed cylindrical (R, phi, Z)
    frame.
  documentation: 'The beta-side length is the geometric length of one inclined edge
    of an oblique parallelogram cross-section representing a passive conducting structure
    element. It is a non-negative scalar Euclidean distance in a constant-$\phi$ poloidal
    plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius and $Z$ is vertical height.


    For endpoints $(R_1,Z_1)$ and $(R_2,Z_2)$ of the beta-side edge in that poloidal
    plane, the length is


    $$

    L_\beta = \sqrt{(R_2-R_1)^2 + (Z_2-Z_1)^2}

    $$


    where $L_\beta$ is the beta-side length and the coordinate differences are measured
    between the two edge endpoints.


    In practice this quantity is obtained from engineering geometry, CAD-derived cross-section
    descriptions, or simplified electromagnetic models of passive conductors. Together
    with the complementary side length, inclination angle, and thickness, it fixes
    the oblique cross-section used to compute conductor area, resistance, mutual inductance,
    and induced-current response.


    Typical values for individual passive-structure elements range from 0.01-1 m,
    depending on device size and the geometric discretization of vessel, shell, plate,
    or stabilizing conductor components. Very fine segmented models may use lengths
    below 0.01 m, while large structural plates can have edge lengths of order 1-2
    m.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:pf_passive/loop/element/geometry/oblique/length_alpha
    dd_path: pf_passive/loop/element/geometry/oblique/length_alpha
    status: composed
  - id: dd:pf_passive/loop/element/geometry/oblique/length_beta
    dd_path: pf_passive/loop/element/geometry/oblique/length_beta
    status: attached
- name: major_length_of_ferritic_element
  kind: scalar
  status: draft
  description: Euclidean length of the parallelogram side inclined at the alpha angle
    in an axisymmetric ferritic element's oblique parallelogram cross-section, measured
    in the poloidal plane of the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The major length of a ferritic element is the Euclidean length of
    the pair of opposite sides inclined by the alpha angle in an oblique parallelogram
    cross-section. The cross-section is defined in the poloidal plane of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height; rotating this cross-section about the symmetry axis represents an axisymmetric
    ferritic body. This is a geometric size parameter, not a magnetic permeability
    or field-strength quantity.


    For endpoints $(R_1, Z_1)$ and $(R_2, Z_2)$ of one alpha-inclined side, the length
    is


    $$

    L_\alpha = \sqrt{(R_2 - R_1)^2 + (Z_2 - Z_1)^2}

    $$


    where $L_\alpha$ is the major length, and $R_i$ and $Z_i$ are the endpoint coordinates
    in meters in the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$
    frame. The corresponding edge orientation is given by the [alpha angle of the
    ferritic element], measured from the outward $R$ direction.


    The value is obtained from the engineering geometry or reconstructed geometric
    model by identifying the two vertices connected by the alpha-inclined edge. Together
    with minor_length_of_ferritic_element, [width_of_ferritic_element](name:width_of_ferritic_element),
    and alpha_angle_of_ferritic_element, it helps specify the size and orientation
    of the ferritic material region used in electromagnetic modeling. The analogous
    geometric parameter for iron-core segment models is [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment).


    Typical values range from 0.02-0.3 m for small ferritic inserts or tiles, 0.3-2
    m for passive magnetic shields and vessel-adjacent ferritic structures, and 2-10
    m for large axisymmetric return-yoke or iron-core-like elements represented by
    a coarse oblique parallelogram model.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_ferritic_element
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:ferritic/object/axisymmetric/oblique/length_alpha
    dd_path: ferritic/object/axisymmetric/oblique/length_alpha
    status: composed
- name: major_length_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at the alpha angle from the
    major-radius direction, defining the alpha-edge of the oblique cross-section of
    a poloidal field coil.
  documentation: 'In the oblique parallelogram model of a poloidal field coil cross-section,
    the full shape in the poloidal $(R, Z)$ plane is described by two inclined side
    lengths and their respective angles from the outward major-radius direction $+\hat{R}$.
    The major length $L_\alpha$ is the Euclidean length of the side whose orientation
    is inclined at the alpha angle from $+\hat{R}$, complementing the beta-side length
    given by [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil).


    For a parallelogram cross-section with alpha-side $L_\alpha$, beta-side $L_\beta$,
    and interior angle $\theta$ between the two sides, the cross-sectional area satisfies:


    $$

    A = L_\alpha \, L_\beta \, \sin\theta

    $$


    where $\theta$ is set by the combination of the alpha and beta inclination angles.


    This side length, together with [radial_angle_of_poloidal_field_coil](name:radial_angle_of_poloidal_field_coil)
    and [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil), fully
    parameterizes the oblique cross-section and enters coil flux and inductance calculations.
    The same alpha-side naming convention is used for iron core segments in [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment)
    and for individual conductor elements in major_length_of_coil_conductor_element.


    Sign convention: Positive as a geometric side length in the poloidal $(R, Z)$
    plane; this quantity is invariant under reversal of plasma current or toroidal
    field direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:length_of_poloidal_field_coil
  - name:radial_angle_of_poloidal_field_coil
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:pf_active/coil/element/geometry/oblique/length_alpha
    dd_path: pf_active/coil/element/geometry/oblique/length_alpha
    status: attached
  - id: dd:pf_active/coil/geometry/oblique/length_alpha
    dd_path: pf_active/coil/geometry/oblique/length_alpha
    status: composed
- name: major_radius_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Major-radius coordinate of a geometric point defining a coil conductor
    element, such as its center or an end point. It is the radial distance from the
    toroidal symmetry axis in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The major radius of a coil conductor element is the radial coordinate
    of a point used to define the element geometry, such as the element center, start
    point, end point, or another point on its conductor centerline. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is distance from the toroidal symmetry axis
    in meters, $\phi$ is toroidal angle in radians, and $Z$ is vertical height in
    meters.


    For a conductor-element point with Cartesian coordinates $(x,y,z)$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}=\hat{Z}$, the major
    radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates measured from the toroidal
    symmetry axis.


    The value is obtained from the specified coil geometry, mechanical design model,
    or surveyed conductor position. Together with the complementary [toroidal angle
    of a coil conductor element](name:toroidal_angle_of_coil_conductor_element) and
    [vertical coordinate of a coil conductor element], it locates the conductor-element
    point in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Typical values are set by the physical size of the coil system. In tokamak applications,
    conductor-element major radii are commonly of order 1-10 m for main field-coil
    structures, with smaller values possible in compact laboratory devices and larger
    values in reactor-scale designs.'
  unit: m
  physics_domain: magnetic_field_systems
