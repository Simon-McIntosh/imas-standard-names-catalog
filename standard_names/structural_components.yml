      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Total thermal power extracted from a breeding blanket module by
        the coolant system. A key engineering parameter for thermal-hydraulic design,
        tritium breeding efficiency assessment, and reactor power balance calculations.
      kind: llm
- name: thickness_of_breeder_blanket_layer
  kind: scalar
  status: active
  description: Non-negative geometric separation between the inner and outer material
    interfaces of a breeder blanket layer along the specified thickness direction.
  documentation: 'Non-negative geometric separation between the inner and outer material
    interfaces of a breeder blanket layer is the local through-thickness of that layer
    along the specified thickness direction. The quantity applies to a single material
    or functional layer within the blanket, not to the total breeder blanket module
    build.


    The layer thickness is defined by the separation of the two bounding interfaces
    along the thickness coordinate:


    $$

    d_\ell = \left|s_{\ell,\mathrm{out}} - s_{\ell,\mathrm{in}}\right|

    $$


    where $d_\ell$ is the layer thickness in m, and $s_{\ell,\mathrm{in}}$ and $s_{\ell,\mathrm{out}}$
    are the signed coordinates in m of the inner and outer layer interfaces along
    the specified thickness direction.


    It is not the toroidal width, poloidal height, surface extent, or volume-equivalent
    thickness of the layer. It is distinct from module-level quantities such as [thickness_of_breeder_blanket_module](name:thickness_of_breeder_blanket_module),
    [lower_thickness_of_breeder_blanket_module](name:lower_thickness_of_breeder_blanket_module),
    and [upper_thickness_of_breeder_blanket_module](name:upper_thickness_of_breeder_blanket_module).
    For a radially stacked layer, the thickness direction is the cylindrical $\hat{R}$
    direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.'
  unit: m
  physics_domain: structural_components
  links:
  - name:lower_thickness_of_breeder_blanket_module
  sources:
  - dd_path: breeding_blanket/module/layer/midplane_thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-layer-midplane_thickness
    dd_documentation:
