- name: poloidal_magnetic_flux_at_magnetic_axis
  kind: scalar
  status: active
  description: Signed poloidal magnetic flux evaluated at the magnetic axis, providing
    the inner reference value for normalized poloidal-flux coordinates.
  documentation: 'Poloidal magnetic flux at the magnetic axis is the signed value
    of the poloidal flux function at the central extremum associated with nested magnetic
    surfaces.


    The defining evaluation is


    $$

    \psi_\mathrm{axis} = \psi(R_\mathrm{axis}, Z_\mathrm{axis})

    $$


    where $\psi_\mathrm{axis}$ is the poloidal magnetic flux at the magnetic axis,
    $\psi$ is the poloidal magnetic-flux function, $R_\mathrm{axis}$ is the major-radius
    coordinate of the magnetic axis, and $Z_\mathrm{axis}$ is its vertical coordinate.
    The coordinates are expressed in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height;
    $Z_\mathrm{axis}$ is the [vertical coordinate of the magnetic axis](name:vertical_coordinate_of_magnetic_axis).


    This quantity applies specifically to the equilibrium magnetic field at the magnetic
    axis rather than to an arbitrary point or a plasma region. It is a single point
    evaluation with no species selection, regional aggregation, or flux-surface averaging.


    The value is an unnormalized flux reference and is distinct from [poloidal magnetic
    flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary),
    which supplies the outer reference value. Together, these two endpoint values
    define the flux interval used by the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate).


    Sign convention: Positive when the poloidal flux is oriented so that the vertical
    magnetic field through the defining horizontal disk points in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_magnetic_axis
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - dd_path: core_profiles/profiles_1d/grid/psi_magnetic_axis
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-grid-psi_magnetic_axis
    dd_documentation:
      leaf: Value of the poloidal magnetic flux at the magnetic axis (useful to normalize
        the psi array values when the radial grid doesn't go from the magnetic axis
        to the plasma boundary)
      parent_path: core_profiles/profiles_1d/grid
      parent: Radial grid
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: "Poloidal magnetic flux (\u03C8) at the magnetic axis, used as\
        \ a reference value to normalise the radial \u03C8 grid in core plasma profiles\
        \ when the grid does not extend from the magnetic axis to the plasma boundary."
      kind: llm
