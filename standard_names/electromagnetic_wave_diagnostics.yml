- name: vertical_magnetic_field_at_wall
  kind: scalar
  status: active
  description: "Z component of the total magnetic field vector at a vacuum-vessel\
    \ wall position in the right-handed cylindrical (R, \u03C6, Z) frame, positive\
    \ in the direction of increasing vertical height."
  documentation: 'Vertical magnetic field at the wall is the $Z$ component of the
    total magnetic-field vector evaluated at a specified point on the vacuum-vessel
    wall. It is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise when
    viewed from $+\hat{Z}$, and $Z$ is vertical height measured relative to the machine
    midplane.


    The defining projection is


    $$

    B_Z(R, \phi, Z) = \mathbf{B}(R, \phi, Z) \cdot \hat{Z}

    $$


    where $\mathbf{B}$ is the total magnetic-field vector at the wall point, $\hat{Z}$
    is the unit vector in the direction of increasing vertical height, and $B_Z$ is
    its vertical component.


    The specified wall point is a geometric locus on the vacuum-vessel wall; its vertical
    coordinate uses the same $Z$ reference as coordinate quantities such as [vertical
    coordinate of a poloidal magnetic-field probe](name:vertical_coordinate_of_poloidal_magnetic_field_probe).
    This quantity is a local vector component, not the magnetic-field magnitude, not
    a magnetic flux, and not the [radial](name:radial_magnetic_field) or [toroidal](name:toroidal_magnetic_field)
    magnetic-field component.


    Sign convention: Positive when $B_Z$ points in the direction of increasing $Z$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: focs/b_field_z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/focs.html#focs-b_field_z
    dd_documentation:
      leaf: Vertical component of the magnetic field on each point of the FOCS outline
      data_type: STRUCTURE
      unit: T
      lifecycle_status: alpha
    enhanced_context:
      description: "Vertical component (Bz) of the magnetic field at each point along\
        \ the FOCS fibre outline on the vacuum vessel. Used together with the fibre\
        \ geometry to derive the total enclosed toroidal plasma current via Amp\xE8\
        re's law."
      kind: llm
- name: vertical_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Direction cosine of the electromagnetic wave vector along the vertical
    Z-direction, equal to k_Z divided by the total wave-vector magnitude, evaluated
    pointwise along a beam-tracing ray path.
  documentation: 'The normalized vertical wave vector component is the direction cosine
    of the local electromagnetic wave propagation direction projected onto the vertical
    $Z$-axis of the right-handed cylindrical $(R, \phi, Z)$ frame, computed pointwise
    along a beam-tracing or ray-tracing path. It encodes the fraction of the propagation
    direction aligned with the vertical direction at each position along the ray.


    The defining relation is:


    $$

    k_{Z,\mathrm{norm}} = \frac{k_Z}{|\mathbf{k}|}

    $$


    where $k_Z$ is the [vertical wave vector component](name:vertical_wave_vector_of_beam_tracing_beam)
    and $|\mathbf{k}|$ is the total wave-vector magnitude. Together with [radial_normalized_wave_vector_of_beam_tracing_beam](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    and [toroidal_normalized_wave_vector_of_beam_tracing_beam](name:toroidal_normalized_wave_vector_of_beam_tracing_beam),
    it fully specifies the unit propagation direction in the cylindrical $(R, \phi,
    Z)$ frame, satisfying $k_{R,\mathrm{norm}}^2 + k_{\phi,\mathrm{norm}}^2 + k_{Z,\mathrm{norm}}^2
    = 1$.


    This quantity is computed during beam-tracing or ray-tracing simulations for RF
    wave propagation and ECE diagnostics, where the Hamiltonian ray equations simultaneously
    advance the spatial position and wave vector along the ray. The normalized form
    characterizes the instantaneous propagation direction independently of the local
    wave number magnitude.


    As a direction cosine, values are bounded to $[-1, 1]$. Values near zero indicate
    nearly horizontal propagation, while values near $\pm 1$ correspond to strongly
    oblique launch geometries or wave turning near a vertical reflection layer.


    Sign convention: Positive when $k_Z$ points in the direction of increasing $Z$.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/wave_vector/k_z_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-wave_vector-k_z_norm
    dd_documentation:
      leaf: Normalized wave vector component in the vertical direction = k_z / norm(k)
      parent_path: ece/channel/beam_tracing/beam/wave_vector
      parent: Wave vector of the ray/beam along its path
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Normalised vertical component of the wave vector (k_z/|k|) along
        the ECE beam or ray path. Represents the direction cosine of the wave vector
        in the vertical (z) direction during beam tracing propagation.
      kind: llm
  - dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/k_z_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-wave_vector-k_z_norm
    dd_documentation:
