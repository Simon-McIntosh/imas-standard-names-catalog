name: toroidal_angle_of_soft_xray_detector_line_of_sight_second_point
status: draft
description: Toroidal angle $\phi$ of the second defining point of a soft X-ray detector
  line of sight, in the machine cylindrical coordinate system.
documentation: This quantity specifies the toroidal angle $\phi$ (in radians) of the
  second geometric point used to define the line of sight of a soft X-ray (SXR) detector
  channel. Together with the first point (at the detector), this second point fixes
  the viewing chord's orientation through the plasma cross-section. The angle $\phi$
  is measured counter-clockwise when viewed from above, consistent with the standard
  right-handed cylindrical coordinate system $(R, \phi, Z)$. SXR line-of-sight geometry
  is essential for tomographic inversion of emissivity profiles and for interpreting
  MHD mode structures from multi-chord SXR arrays. In most tokamak installations the
  toroidal extent of a single SXR camera is small ($\Delta\phi \lesssim 0.05$ rad),
  so the second-point toroidal angle is close to the detector toroidal angle; however,
  tangential viewing geometries can produce separations of several degrees. See `vertical_coordinate_of_diagnostic_aperture`
  for the complementary vertical coordinate specification.
