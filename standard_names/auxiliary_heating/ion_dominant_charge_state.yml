name: ion_dominant_charge_state
status: draft
description: Charge state $Z$ of the most abundant ionization stage of an ion species,
  expressed in units of the elementary charge $e$.
documentation: "The dominant charge state $Z$ identifies the ionization level that\
  \ carries the largest fractional population for a given ion species within the plasma.\
  \ For fully stripped light ions (e.g., deuterium) $Z = 1$, while partially ionized\
  \ impurities such as tungsten may have $Z \\approx 20$\u2013$50$ depending on the\
  \ local electron temperature $T_e$. In wave-plasma interaction modeling (beam tracing,\
  \ ICRH absorption), $Z$ enters the ion cyclotron frequency $\\Omega_{ci} = Z e B\
  \ / m_i$, where $e$ is the elementary charge, $B$ is the magnetic field magnitude,\
  \ and $m_i$ is the ion mass. Lumped-ion approximations are permitted, combining\
  \ multiple charge states into a single effective species. The quantity is used in\
  \ source and distribution function descriptions to label the representative charge\
  \ of an ion population. See also the charge-state bundle boundaries defined by `ion_minimum_charge_state_of_ion_state`."
