name: toroidal_component_of_tendency_of_ion_velocity
description: Time derivative of the toroidal component of the ion fluid velocity,
  representing the rate of change of ion toroidal flow.
documentation: "The toroidal tendency of ion velocity $\\partial v_{\\phi,i}/\\partial\
  \ t$ (in m s$^{-1}$ per unit time context of the solver) captures how the ion toroidal\
  \ rotation evolves under the combined action of toroidal momentum sources, viscous\
  \ damping, and radial momentum transport. Here $v_{\\phi,i}$ is the toroidal component\
  \ of the ion fluid velocity averaged over charge states when multiple ion species\
  \ are present. In integrated-modeling transport solvers, $\\partial v_{\\phi,i}/\\\
  partial t$ appears as the left-hand side of the toroidal angular-momentum balance\
  \ equation and is advanced in time alongside density and temperature profiles. Typical\
  \ ion toroidal velocities in tokamak H-mode plasmas range from tens to hundreds\
  \ of km s$^{-1}$; corresponding tendencies during transient phases (e.g., L\u2013\
  H transition, NBI switch-on) can reach $\\sim 10^{4}$\u2013$10^{5}$ m s$^{-2}$ equivalent\
  \ rates. The quantity is obtained from charge-exchange recombination spectroscopy\
  \ (CXRS) time histories or predicted by momentum-transport models. See also `ion_number_density`\
  \ for the species context and `co_passing_fast_particle_energy_source` for NBI-driven\
  \ momentum input."
kind: vector_component
unit: m.s^-1
