- name: mutual_inductance_of_plasma_filament
  kind: scalar
  status: draft
  description: Mutual inductance coupling coefficient between discrete plasma current
    filaments, describing the poloidal magnetic flux induced in one filament per unit
    current in another.
  documentation: 'The mutual inductance between two plasma filaments quantifies the
    magnetic coupling that determines how a change in current in one filament induces
    a voltage in the other, as described by Faraday''s law. It is defined as $M_{ij}
    = \Phi_i / I_j$, where $\Phi_i$ is the poloidal magnetic flux linking filament
    $i$ due to a current $I_j$ in filament $j$. For two coaxial circular filaments
    of major radii $R_i$ and $R_j$ separated vertically by $\Delta Z$ in the $(R,
    \phi, Z)$ coordinate system, the mutual inductance is given by $M_{ij} = \mu_0
    \sqrt{R_i R_j} \left( \frac{2}{k} - k \right) K(k) - \frac{2}{k} E(k)$, where
    $k = \sqrt{\frac{4 R_i R_j}{(R_i + R_j)^2 + (\Delta Z)^2}}$, and $K(k)$ and $E(k)$
    are complete elliptic integrals of the first and second kind. Typical values for
    tokamak-relevant filament separations (centimeter-scale) range from tens of nanohenrys
    to a few microhenrys, with larger values for closely spaced filaments near the
    plasma core. This quantity is symmetric ($M_{ij} = M_{ji}$) and fundamental to
    building the inductance matrix for filament-based plasma response models.


    Sign convention: Positive when the induced flux in filament $i$ is in the same
    poloidal direction as the flux produced by a positive current in filament $j$,
    consistent with the right-hand rule in the $(R, \phi, Z)$ frame.'
  unit: H
  physics_domain: equilibrium
  links:
  - name:passive_loop_current
  - name:poloidal_field_coil_current
  - name:total_plasma_pressure
  sources:
  - id: dd:em_coupling/mutual_plasma_plasma
    dd_path: em_coupling/mutual_plasma_plasma
    status: composed
- name: passive_loop_current
  kind: scalar
  status: draft
  description: Measured electrical current in a passive conducting loop used as a
    constraint in plasma equilibrium reconstruction.
  documentation: "The passive loop current is the measured electrical current flowing\
    \ in a conducting structure that is not actively driven (e.g., a vacuum vessel\
    \ wall segment, limiter, or stabilizing shell). This current is induced by the\
    \ plasma and is used as a boundary constraint in equilibrium reconstruction codes\
    \ to improve accuracy. Typical values range from kiloamperes to several mega-amperes,\
    \ depending on loop inductance, plasma current, and geometric coupling. The measurement\
    \ is taken from a Rogowski coil or shunt, and the sign is defined by the direction\
    \ of current flow through the loop. Note that this quantity is the passive counterpart\
    \ of the actively driven current in a poloidal field coil; the cross-reference\
    \ is listed below.\n\nSign convention: Positive when the current flows in the\
    \ direction of increasing toroidal angle \u03C6 (counter-clockwise when viewed\
    \ from above +\u1E91) in the right-handed cylindrical (R, \u03C6, Z) frame."
  unit: A
  physics_domain: equilibrium
  links:
  - name:poloidal_field_coil_current
  - name:area_of_passive_loop
  - name:inner_radius_of_passive_loop
  sources:
  - id: dd:equilibrium/time_slice/constraints/pf_passive_current/measured
    dd_path: equilibrium/time_slice/constraints/pf_passive_current/measured
    status: composed
- name: plasma_volume
  kind: scalar
  status: draft
  description: Total volume enclosed by the outermost closed magnetic flux surface
    (plasma boundary), representing the volumetric extent of the confined plasma region.
  documentation: 'The plasma volume $V_p$ quantifies the spatial extent of the confined
    plasma, defined as the volume inside the last closed flux surface (LCFS) or the
    plasma boundary. In an axisymmetric tokamak equilibrium, the total plasma volume
    is obtained by integrating the elementary poloidal-plane grid cell volumes over
    the entire plasma cross-section and multiplying by $2\pi R$ for the toroidal direction,
    where $R$ is the major radius in meters. Typical plasma volumes range from $\sim10\,\mathrm{m}^3$
    in medium-size tokamaks (e.g., DIII-D, ASDEX Upgrade) to $\sim800\,\mathrm{m}^3$
    in ITER. The plasma volume is a fundamental geometric parameter entering flux-surface-averaged
    transport equations and volume-integrated power and particle balances. It is closely
    related to the [elongation](name:elongation) and [major_radius](name:major_radius)
    through the geometry of the plasma boundary.


    Sign convention: Positive when the volume is enclosed by the plasma boundary.


    This quantity is sign-invariant (always positive by definition).'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:elongation
  - name:major_radius
  sources:
  - id: dd:equilibrium/time_slice/profiles_2d/grid/volume_element
    dd_path: equilibrium/time_slice/profiles_2d/grid/volume_element
    status: composed
- name: poloidal_field_coil_current
  kind: scalar
  status: draft
  description: Measured electrical current flowing in a poloidal field coil, used
    as a constraint in plasma equilibrium reconstruction.
  documentation: 'Poloidal field coils are external conducting loops wound toroidally
    around the machine, carrying currents that produce a poloidal magnetic field for
    plasma shaping and position control. The measured current $I_{\mathrm{PF}}$ is
    the net direct current flowing in a single coil turn, obtained from a calibrated
    Rogowski coil or Hall sensor. Typical values range from tens of kA to tens of
    MA depending on the coil size and plasma scenario. The measurement is used as
    an external constraint in equilibrium reconstruction codes (e.g., EFIT, LIUQE)
    to enforce consistency between the observed poloidal field and the coil currents.


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).'
  unit: A
  physics_domain: equilibrium
  links:
