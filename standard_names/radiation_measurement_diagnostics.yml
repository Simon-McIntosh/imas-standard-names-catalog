- name: surface_roughness_of_optical_element
  kind: scalar
  status: draft
  description: Dimensionless surface roughness parameter of an optical element that
    represents how microscopic surface texture changes reflection from specular to
    diffuse. A value of 0 corresponds to perfectly specular reflection, while a value
    of 1 corresponds to perfectly diffuse reflection.
  documentation: 'Surface roughness of an optical element is a dimensionless parameter,
    denoted here by $r_s$, that characterizes the scattering effect of microscopic
    surface texture on reflected radiation. It is bounded by $0 \le r_s \le 1$, with
    $r_s = 0$ representing an ideal specular surface and $r_s = 1$ representing an
    ideal diffuse surface. The parameter describes optical scattering behavior rather
    than macroscopic element shape, which is characterized separately by quantities
    such as [front surface curvature] and [back surface curvature](name:back_surface_curvature_of_optical_element).


    There is no universal governing equation for $r_s$ because its numerical value
    depends on the bidirectional reflectance distribution function or radiation-transport
    model in which it is used. In a specific model, $r_s$ may be derived from measured
    surface parameters such as RMS height variation $\sigma_h$ in meters, surface
    correlation length $\ell_c$ in meters, optical wavelength $\lambda$ in meters,
    and incidence angle $\alpha$ in radians. The mapping from those physical inputs
    to the bounded interval $[0,1]$ must be defined by the chosen optical scattering
    model.


    The parameter is determined from surface metrology, angle-resolved scatter measurements,
    calibration measurements, or manufacturer specifications for mirrors, windows,
    lenses, filters, and diffuser elements. In diagnostic optical modeling it controls
    how much reflected power remains in the specular direction and how much is redistributed
    into a broader angular distribution.


    Typical values span the full dimensionless interval 0-1. Polished diagnostic optics
    are usually assigned values close to 0, intentionally diffusing or strongly degraded
    surfaces values close to 1, and partially scattering surfaces intermediate values.
    Numerical thresholds for "polished," "degraded," or "diffuse" behavior are model
    dependent and should be interpreted consistently with the reflectance model being
    used.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:back_surface_curvature_of_optical_element
  arguments:
  - name: roughness_of_optical_element
    operator: surface
    operator_kind: qualifier
