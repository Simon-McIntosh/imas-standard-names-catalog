- name: toroidal_angle_of_magnetic_field_probe
  kind: scalar
  status: draft
  description: Toroidal angle of a magnetic-field probe is the signed tilt of the
    coil sensitive axis out of the local poloidal plane in the right-handed cylindrical
    (R, phi, Z) frame. It specifies the toroidal component of the unit sensitivity
    direction used to project the local magnetic field onto the measured component.
  documentation: 'Toroidal angle of a magnetic-field probe is the signed angle between
    the probe sensitive axis and its projection onto the local poloidal plane. The
    local poloidal plane is spanned by $\hat{R}$ and $\hat{Z}$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. The
    angle is commonly represented on the principal branch $-\pi/2 \leq \alpha \leq
    \pi/2$, with $\alpha=0$ for a sensitive axis lying in the local poloidal plane.


    The local magnetic-field component measured along the sensitive axis is obtained
    from the angular projection:


    $$

    \hat{n}=\cos\alpha\,\hat{p}+\sin\alpha\,\hat{\phi}, \qquad B_n=\mathbf{B}\cdot\hat{n}=\cos\alpha\,B_{p,\mathrm{loc}}+\sin\alpha\,B_\phi

    $$


    where $\alpha$ is the toroidal angle, $\hat{n}$ is the unit sensitive-axis direction,
    $\hat{p}$ is the unit projection of $\hat{n}$ onto the local poloidal plane, $B_n$
    is the field component sensed by the probe, $B_{p,\mathrm{loc}}=(B_R\hat{R}+B_Z\hat{Z})\cdot\hat{p}$
    is the local scalar projection of the poloidal magnetic field onto $\hat{p}$,
    and $B_\phi$ is the toroidal magnetic-field component. Thus a zero toroidal angle
    means the probe responds to the local poloidal-field projection selected by its
    in-plane orientation, not to all poloidal components simultaneously.


    The angle is determined from probe design geometry, mechanical metrology, installation
    survey, or magnetic calibration. For an induction coil, it enters the conversion
    from coil voltage to field through the projected component, for example with the
    voltage proportional to $-N A_\mathrm{eff}\,dB_n/dt$ for $N$ turns and effective
    area $A_\mathrm{eff}$. A major-radius coordinate $R$ fixes only distance from
    the symmetry axis in the right-handed cylindrical $(R,\phi,Z)$ frame; it does
    not by itself specify the full probe location or the sensitive-axis projection
    direction $\hat{p}$.


    For probes intended to measure poloidal magnetic field, $|\alpha|$ is usually
    small, often 0-0.1 rad after alignment and calibration. Deliberately oblique installations
    or constrained mounting geometries may use 0.1-0.5 rad, while values approaching
    $\pm\pi/2$ rad correspond to an axis that is predominantly toroidal-field sensitive.


    Sign convention: Positive when the sensitive axis is tilted from its projection
    in the local poloidal plane toward the direction of increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_poloidal_magnetic_field_probe
  - name:major_radius_of_poloidal_magnetic_field_probe
  - name:toroidal_angle_of_toroidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_pol_probe/toroidal_angle
    dd_path: magnetics/b_field_pol_probe/toroidal_angle
    status: attached
  - id: dd:magnetics/bpol_probe/toroidal_angle
    dd_path: magnetics/bpol_probe/toroidal_angle
    status: attached
- name: toroidal_angle_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Toroidal angle of the horizontal projection of a toroidal magnetic
    field probe's sensitive-axis normal vector, defining the probe's azimuthal orientation
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The toroidal angle $\phi_\mathrm{probe}$ specifies the azimuthal
    orientation of a toroidal magnetic field probe''s sensitive axis, defined as the
    angle of the horizontal projection of the probe''s normal vector measured from
    the outward major-radius direction $+\hat{R}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $\hat{R} \times \hat{\phi} = \hat{Z}$.


    Together with the poloidal orientation angle, this quantity fully determines the
    three-dimensional pointing direction of the pickup coil, which is essential for
    correctly projecting the raw inductive voltage signal onto the toroidal field
    component during signal interpretation. The analogous orientation angle for non-type-specific
    magnetic probes is captured by [toroidal_angle_of_magnetic_field_probe](name:toroidal_angle_of_magnetic_field_probe).


    The value is determined from mechanical design drawings and installation surveys
    of the magnetics diagnostic system. Combined with the [major_radius_of_toroidal_magnetic_field_probe](name:major_radius_of_toroidal_magnetic_field_probe)
    and [vertical_coordinate_of_toroidal_magnetic_field_probe](name:vertical_coordinate_of_toroidal_magnetic_field_probe),
    it fully localizes the probe in three-dimensional space. For probes distributed
    around the machine, values span the range $0$ to $2\pi$ rad.


    Sign convention: Positive when the horizontal projection of the probe''s normal
    vector points in the direction of increasing toroidal angle $\phi$ (counter-clockwise
    when viewed from above $+\hat{Z}$).'
  unit: rad
  physics_domain: magnetic_field_diagnostics
