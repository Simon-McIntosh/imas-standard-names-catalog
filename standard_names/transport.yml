- name: thermal_electron_pressure
  kind: scalar
  status: draft
  description: Isotropic kinetic pressure carried by bulk electrons through their
    random thermal motion, excluding directed flow and nonthermal electron populations.
  documentation: 'Thermal electron pressure is the isotropic part of the electron
    kinetic stress associated with random motion about the mean electron flow. It
    describes the bulk Maxwellian electron contribution and is distinct from total
    [electron pressure](name:electron_pressure) when fast or nonthermal electron populations
    contribute.


    For a Maxwellian electron population, the pressure is related to density and temperature
    by


    $$

    p_{e,\mathrm{th}} = n_{e,\mathrm{th}} e T_e

    $$


    where $p_{e,\mathrm{th}}$ is the thermal electron pressure in Pa, $n_{e,\mathrm{th}}$
    is the [thermal electron density](name:thermal_electron_density) in m$^{-3}$,
    $T_e$ is the [electron temperature](name:electron_temperature) in eV, and $e$
    is the elementary charge used to convert electron-volts to joules. In a multispecies
    pressure balance, this contribution is compared with [thermal ion pressure](name:thermal_ion_pressure)
    and ion charge-state pressures such as [state pressure](name:thermal_ion_state_pressure).


    It is computed from combined electron density and temperature measurements, with
    Thomson scattering, interferometry, electron cyclotron emission, and edge Langmuir
    probes providing common inputs in magnetized fusion plasmas. Representative values
    span about 1-200 kPa in hot tokamak cores and 0.01-1 kPa in edge and scrape-off-layer
    conditions.


    Sign convention: Positive when the electron distribution has a positive second
    central velocity moment.'
  unit: Pa
  physics_domain: transport
  links:
  - name:electron_pressure
  - name:thermal_electron_density
  - name:electron_temperature
  - name:thermal_ion_pressure
  - name:thermal_ion_state_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/pressure_thermal
    dd_path: core_profiles/profiles_1d/electrons/pressure_thermal
    status: composed
- name: thermal_ion_pressure
  kind: scalar
  status: draft
  description: Isotropic kinetic pressure produced by random thermal motion of the
    bulk ion population, excluding fast or nonthermal ion contributions.
  documentation: 'Thermal ion pressure is the isotropic part of the ion stress associated
    with random particle motion about the mean ion flow. It represents the bulk, thermalized
    ion contribution and excludes energetic-ion pressure, so it is the thermal component
    of [ion pressure](name:ion_pressure) and complements [thermal electron pressure](name:thermal_electron_pressure).


    For a Maxwellian ion population, the defining relation is


    $$

    p_{i,\mathrm{th}} = \sum_s n_{i,s}\, e\, T_{i,s}

    $$


    where $p_{i,\mathrm{th}}$ is the thermal ion pressure in Pa, $n_{i,s}$ is the
    number density of ion charge state or species $s$ in m$^{-3}$, $T_{i,s}$ is the
    corresponding [ion temperature](name:ion_temperature) in eV, and $e$ is the elementary
    charge converting eV to joules. If a single thermal ion population is represented,
    the sum reduces to $p_i = n_i e T_i$, with $n_i$ related to [ion density](name:ion_density).


    It is computed from ion density and temperature measurements, with ion temperature
    often inferred from charge-exchange recombination spectroscopy, neutral particle
    analysis, or transport modeling constrained by heating and power-balance data.
    Core values in present tokamaks range from about $10^3$-$10^5$ Pa, while edge
    and scrape-off-layer values are often much lower; large departures between this
    quantity and [perpendicular fast ion pressure](name:perpendicular_fast_ion_pressure)
    indicate a significant energetic-particle contribution.


    Sign convention: Positive when random thermal ion motion produces a compressive
    isotropic pressure contribution in the plasma momentum balance.'
  unit: Pa
  physics_domain: transport
  links:
  - name:ion_pressure
  - name:thermal_electron_pressure
  - name:ion_temperature
  - name:ion_density
  - name:perpendicular_fast_ion_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/ion/pressure_thermal
    dd_path: core_profiles/profiles_1d/ion/pressure_thermal
    status: composed
  - id: dd:core_profiles/profiles_1d/pressure_ion_total
    dd_path: core_profiles/profiles_1d/pressure_ion_total
    status: composed
- name: thermal_ion_state_density
  kind: scalar
  status: draft
  description: Number of thermal ions per unit volume within a resolved ionization
    or charge-state bundle of an ion species.
  documentation: 'Thermal ion state density is the population density of bulk, near-Maxwellian
    ions belonging to a specified ionization or charge-state bundle. Summing over
    resolved states gives the corresponding [thermal ion density], while including
    fast populations and unresolved states connects to the total [ion density](name:ion_density).


    For a thermal ion species $i$ in charge state $Z$, it is the zeroth velocity-space
    moment of the state-resolved distribution function:


    $$

    n^{\mathrm{th}}_{i,Z} = \int f^{\mathrm{th}}_{i,Z}(\mathbf{v})\,d^3v

    $$


    where $f^{\mathrm{th}}_{i,Z}(\mathbf{v})$ is the thermal ion distribution function
    in velocity space and $\mathbf{v}$ is particle velocity. The same population contributes
    to [thermal ion state pressure](name:thermal_ion_state_pressure) through the thermal
    kinetic moment, and it is distinct from [fast ion state density](name:fast_ion_state_density),
    which describes suprathermal ions.


    This quantity is inferred from charge-exchange recombination spectroscopy, passive
    line emission with collisional-radiative modeling, impurity transport analysis,
    and quasineutrality constraints combined with [electron density](name:electron_density).
    Representative core main-ion densities are $10^{19}$-$10^{20}$ m$^{-3}$, while
    individual impurity charge-state densities can span $10^{14}$-$10^{18}$ m$^{-3}$
    depending on concentration, ionization balance, and transport.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:ion_density
  - name:thermal_ion_state_pressure
  - name:fast_ion_state_density
  - name:electron_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/density_thermal
    dd_path: core_profiles/profiles_1d/ion/state/density_thermal
    status: composed
- name: thermal_ion_state_pressure
  kind: scalar
  status: draft
  description: Isotropic kinetic pressure produced by random thermal motion of ions
    within a resolved charge-state population, excluding fast-ion contributions.
  documentation: 'Thermal ion-state pressure is the isotropic kinetic pressure carried
    by the thermal part of a resolved ion charge-state population. It is the charge-state-resolved
    contribution to [thermal ion pressure](name:thermal_ion_pressure) and excludes
    directional nonthermal pressure represented for energetic populations such as
    [fast ion-state pressure].


    For a charge-state bundle with temperature expressed as an energy per particle,
    the defining relation is


    $$

    p_{i,Z}^{\mathrm{th}} = n_{i,Z}^{\mathrm{th}} e T_{i,Z}

    $$


    where $p_{i,Z}^{\mathrm{th}}$ is the thermal pressure, $n_{i,Z}^{\mathrm{th}}$
    is the [thermal ion-state density](name:thermal_ion_state_density) in m$^{-3}$,
    $T_{i,Z}$ is the charge-state-resolved thermal ion temperature in eV, and $e$
    is the elementary charge in coulombs. Summing over charge states gives the corresponding
    species contribution to [ion pressure](name:ion_pressure) when nonthermal components
    are absent or treated separately.


    This quantity is computed from charge-state-resolved density and ion-temperature
    estimates. Density fractions are inferred from spectroscopy and collisional-radiative
    ionization balance, while thermal ion temperature is obtained from charge-exchange
    recombination spectroscopy, Doppler broadening, or transport inference constrained
    by power balance.


    Core values in fusion plasmas commonly span about $10^2$-$10^5$ Pa for abundant
    ion charge states, with edge and scrape-off-layer values falling to roughly $10^{-1}$-$10^3$
    Pa depending on density, ionization state, and temperature. The total [ion-state
    pressure](name:ion_charge_state_pressure) may exceed this value when fast-ion
    or anisotropic pressure contributions are included.'
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_ion_pressure
  - name:thermal_ion_state_density
  - name:ion_pressure
  - name:ion_charge_state_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_thermal
    dd_path: core_profiles/profiles_1d/ion/state/pressure_thermal
    status: composed
- name: toroidal_electric_field
  kind: scalar
  status: draft
  description: Projection of the plasma electric field along the toroidal direction,
    driving toroidal current and inductive acceleration around the symmetry axis.
  documentation: 'The toroidal electric field is the component of the electromagnetic
    force per unit charge along the toroidal direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is the component of [electric field](name:electric_field)
    most directly associated with inductive current drive, Ohmic heating, and acceleration
    of charged particles around the device symmetry axis.


    The component is defined by the projection


    $$

    E_\phi = \mathbf{E} \cdot \hat{\phi}

    $$


    where $\mathbf{E}$ is the electric-field vector and $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle $\phi$. In axisymmetric inductive
    operation, $E_\phi$ is closely related to the loop voltage through the approximate
    relation $E_\phi \simeq V_{\rm loop}/(2\pi R)$, where $R$ is major radius.


    It is inferred from magnetic flux evolution, loop-voltage measurements, and transport
    or equilibrium analysis, often constrained together with [toroidal plasma current
    density](name:toroidal_plasma_current_density) and [electrical conductivity].
    The orthogonal components [radial electric field](name:radial_electric_field)
    and [poloidal electric field](name:poloidal_electric_field) describe different
    force-balance and drift physics, while [parallel electric field](name:parallel_electric_field)
    captures acceleration along the magnetic field.


    Typical values are 0.01-1 V m$^{-1}$ in inductively driven tokamak cores, with
    several V m$^{-1}$ possible during current ramp-up, disruptions, or current-quench
    phases.


    Sign convention: Positive when $E_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:toroidal_plasma_current_density
  - name:radial_electric_field
  - name:poloidal_electric_field
  - name:parallel_electric_field
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/toroidal
    dd_path: core_profiles/profiles_1d/e_field/toroidal
    status: composed
- name: toroidal_electron_velocity
  kind: scalar
  status: draft
  description: Bulk electron-fluid flow projected onto the toroidal direction, capturing
    electron rotation around the device symmetry axis.
  documentation: 'Toroidal electron velocity is the azimuthal component of the bulk
    electron-fluid velocity around the torus. In the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height, it is the toroidal projection of [electron_velocity](name:electron_velocity)
    and complements [poloidal_electron_velocity](name:poloidal_electron_velocity),
    [radial_electron_velocity](name:radial_electron_velocity), and [parallel_electron_velocity](name:parallel_electron_velocity).


    The defining projection is


    $$

    v_{e\phi} = \mathbf{v}_e \cdot \hat{\phi}

    $$


    where $\mathbf{v}_e$ is the bulk electron-fluid velocity and $\hat{\phi}$ is the
    unit vector in the direction of increasing toroidal angle. Through the current
    relation $\mathbf{j} = e n_e (\mathbf{v}_i - \mathbf{v}_e)$, the toroidal electron
    flow is coupled to [electron_density](name:electron_density), ion rotation such
    as [toroidal_ion_velocity](name:toroidal_ion_velocity), and the driven response
    to [toroidal_electric_field](name:toroidal_electric_field).


    Direct measurement of electron toroidal flow is uncommon; it is commonly inferred
    from current-density reconstruction, electron momentum balance, density measurements,
    and constraints on ion flow. In edge or low-temperature plasmas, probe and spectroscopic
    methods may provide additional constraints on electron drift velocities.


    Representative core values range from about $10^3$-$10^5$ m.s$^{-1}$, with larger
    magnitudes possible where strong current density, electric field, or steep pressure
    gradients drive electron motion relative to the ion fluid.


    Sign convention: Positive when the electron fluid moves in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:poloidal_electron_velocity
  - name:radial_electron_velocity
  - name:parallel_electron_velocity
  - name:electron_density
  - name:toroidal_ion_velocity
  - name:toroidal_electric_field
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity/toroidal
    dd_path: core_profiles/profiles_1d/electrons/velocity/toroidal
    status: composed
- name: toroidal_ion_velocity
  kind: scalar
  status: draft
  description: Projection of bulk ion fluid motion around the device symmetry axis,
    capturing toroidal plasma rotation and angular momentum transport.
  documentation: 'Toroidal ion velocity is the component of the bulk ion flow around
    the toroidal direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    is the toroidal projection of [ion_velocity], distinct from thermal random motion
    described by [ion_temperature](name:ion_temperature), and it controls toroidal
    rotation, momentum confinement, and centrifugal effects.


    The defining projection is


    $$

    v_{i\phi} = \mathbf{u}_i \cdot \hat{\phi}

    $$


    where $\mathbf{u}_i$ is the ion fluid velocity vector and $\hat{\phi}$ is the
    unit vector in the direction of increasing toroidal angle. This component complements
    [radial_ion_velocity](name:radial_ion_velocity), which describes cross-surface
    transport, and [parallel_ion_velocity](name:parallel_ion_velocity), which follows
    the magnetic-field direction.


    Toroidal ion velocity is inferred from Doppler shifts of impurity or main-ion
    spectral lines, most often using charge-exchange recombination spectroscopy, and
    may also be constrained by momentum-balance analysis. Core tokamak values commonly
    range from $10^4$ to $3\times10^5$ m.s$^{-1}$, with larger values in strongly
    beam-heated plasmas and smaller values in weakly driven or edge regions. Comparison
    with [toroidal_electron_velocity](name:toroidal_electron_velocity) helps separate
    bulk rotation from current-carrying electron-ion relative motion.


    Sign convention: Positive when ion flow points in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:ion_temperature
  - name:radial_ion_velocity
  - name:parallel_ion_velocity
  - name:toroidal_electron_velocity
  arguments:
