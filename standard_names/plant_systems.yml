- name: z_component_of_shattered_pellet_injection_direction_unit_vector
  kind: scalar
  status: draft
  description: Vertical (Z-axis) component of the unit vector defining the injection
    direction of the shattered pellet injector (SPI) pellet in the right-handed Cartesian
    $(x, y, z)$ frame.
  documentation: 'The Z-component $n_z$ of the SPI injection direction unit vector
    $\hat{n}_{\rm SPI} = (n_x, n_y, n_z)$ quantifies how much of the pellet''s launch
    direction is aligned with the vertical axis $\hat{z}$. Together with [x_component_of_shattered_pellet_injection_direction_unit_vector](name:x_component_of_shattered_pellet_injection_direction_unit_vector)
    and [y_component_of_shattered_pellet_injection_direction_unit_vector](name:y_component_of_shattered_pellet_injection_direction_unit_vector),
    it fully determines the parent vector [shattered_pellet_injection_direction_unit_vector](name:shattered_pellet_injection_direction_unit_vector)
    via $n_x^2 + n_y^2 + n_z^2 = 1$, where $n_z \in [-1, 1]$. The Z-component is particularly
    important for characterizing the vertical targeting angle of the injector relative
    to the plasma column, and is distinguished from the analogous [z_component_of_shatter_cone_direction_unit_vector](name:z_component_of_shatter_cone_direction_unit_vector),
    which describes the shatter cone axis rather than the injection direction. Values
    near $\pm 1$ indicate nearly vertical injection, while values near 0 indicate
    a predominantly horizontal injection geometry.


    Sign convention: Positive when the injection direction has a component in the
    $+\hat{z}$ (upward vertical) direction.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:x_component_of_shattered_pellet_injection_direction_unit_vector
  - name:y_component_of_shattered_pellet_injection_direction_unit_vector
