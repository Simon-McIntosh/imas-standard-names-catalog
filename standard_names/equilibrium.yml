- name: radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Curvature radius of an arc-of-circle segment used to represent the
    cross-sectional contour of a plasma current filament; it is the non-negative radius
    of the circle from which the arc is drawn.
  documentation: 'Radius of a plasma filament segment is the curvature radius of one
    circular arc in an idealized cross-sectional contour of a current-carrying plasma
    filament. It is the non-negative distance from every point on that arc to its
    center of curvature; smaller values correspond to sharper boundary bending, while
    a straight segment is the limiting case of infinite radius.


    For a circular segment, the arc length is related to the curvature radius by:


    $$

    \ell = R_c |\Delta\alpha|

    $$


    where $\ell$ is the arc length in meters, $R_c$ is the curvature radius in meters,
    and $\Delta\alpha$ is the signed central angle subtended by the arc in radians,
    treated as dimensionless in the product.


    This quantity is usually specified or fitted as part of a piecewise geometric
    approximation to a filament cross-section for equilibrium and electromagnetic
    calculations, rather than measured directly by a diagnostic. Together with [width_of_plasma_filament](name:width_of_plasma_filament),
    [height_of_plasma_filament](name:height_of_plasma_filament), and the general radius,
    it helps define the idealized filament geometry; it is conceptually analogous
    to [radius_of_iron_core_segment](name:radius_of_iron_core_segment) and [radius_of_poloidal_field_coil](name:radius_of_poloidal_field_coil)
    for other piecewise circular contours.


    Finite curved segments require $R_c > 0$ and normally have values comparable to,
    or larger than, the local contour scale. Typical practical values range from 0.001-1
    m, with millimeter-to-centimeter radii representing rounded corners in compact
    filament models and decimeter-to-meter radii representing gently curved, large-scale
    contours.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:width_of_plasma_filament
  - name:height_of_plasma_filament
  - name:radius_of_iron_core_segment
  - name:radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_plasma/element/geometry/arcs_of_circle/curvature_radii
    dd_path: pf_plasma/element/geometry/arcs_of_circle/curvature_radii
    status: composed
- name: inner_radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a plasma current-carrying
    filament element, marking the boundary between the hollow central region and the
    conducting annular zone.
  documentation: 'The inner radius $r_\mathrm{inner}$ specifies the radial position
    of the inner wall of an annular plasma filament cross-section, defining the boundary
    between the hollow (non-current-carrying) core and the conducting annular region.
    In filamentary models of distributed plasma current, individual elements may be
    assigned annular geometries bounded at the outer wall by [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)
    $r_\mathrm{outer}$, with current flowing only in the region $r_\mathrm{inner}
    \leq r \leq r_\mathrm{outer}$.


    The conducting cross-sectional area of the annular element is:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $A$ is the geometric cross-sectional area corresponding to area_of_plasma_filament.
    A valid annular geometry requires $0 \leq r_\mathrm{inner} < r_\mathrm{outer}$;
    setting $r_\mathrm{inner} = 0$ recovers a solid circular cross-section with no
    hollow core.


    This parameter is a geometric input to the filamentary discretization of the plasma
    current distribution and is always specified alongside [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament).
    For rectangular filament cross-sections the analogous spatial parameters are [height_of_plasma_filament](name:height_of_plasma_filament)
    and [width_of_plasma_filament](name:width_of_plasma_filament).


    Sign convention: Positive when the inner boundary of the annular cross-section
    is measured outward from the local geometric center of the filament element.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_radius_of_plasma_filament
  - name:height_of_plasma_filament
  - name:width_of_plasma_filament
  arguments:
  - name: radius_of_plasma_filament
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:pf_plasma/element/geometry/annulus/radius_inner
    dd_path: pf_plasma/element/geometry/annulus/radius_inner
    status: composed
- name: outer_radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a discrete plasma current-carrying
    filament element, marking the external radial boundary of the hollow-disk geometry.
  documentation: 'The outer radius defines the external boundary of an annular cross-section
    when a plasma current filament element is represented as a hollow cylinder. Together
    with [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),
    it fully characterizes the annular geometry, which contrasts with the rectangular
    cross-section model parametrized by [height_of_plasma_filament](name:height_of_plasma_filament)
    and [width_of_plasma_filament](name:width_of_plasma_filament).


    For an annular cross-section, the cross-sectional area relates to both radii by:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $r_\mathrm{outer}$ is this outer radius, $r_\mathrm{inner}$ is the inner
    radius, and $A$ is the area_of_plasma_filament.


    The outer radius is specified as input geometry when constructing discrete filamentary
    representations of plasma current distributions used in equilibrium reconstruction
    and mutual-inductance computations. The constraint $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$ must be satisfied to define a valid non-degenerate annular region.


    Sign convention: Positive when measured as a radial distance from the cross-section
    center to the outer boundary, satisfying $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_plasma_filament
  - name:height_of_plasma_filament
  - name:width_of_plasma_filament
