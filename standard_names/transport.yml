- name: vertical_vorticity
  kind: scalar
  status: draft
  description: "Vertical vorticity is the projection of the plasma vorticity vector\
    \ onto the vertical Z direction in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It is the Z-component of the curl of the plasma fluid velocity and measures\
    \ signed local rotation in the R-\u03C6 plane."
  documentation: 'Vertical vorticity is the component of the plasma-fluid [vorticity](name:vorticity)
    vector along the vertical axis of the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height
    with $\hat{R}\times\hat{\phi}=\hat{Z}$. It measures the signed local angular shear
    of the velocity field associated with circulation about the vertical direction.
    The complementary cylindrical components are [radial_vorticity](name:radial_vorticity)
    and [toroidal_vorticity](name:toroidal_vorticity); related magnetic-geometry projections
    include [poloidal_vorticity](name:poloidal_vorticity) and [parallel_vorticity](name:parallel_vorticity).


    For a plasma fluid velocity $\mathbf{v}$ with cylindrical components $v_R$ and
    $v_\phi$, the vertical component of the curl is


    $$

    \omega_Z = (\nabla \times \mathbf{v})\cdot\hat{Z} = \frac{1}{R}\frac{\partial
    (R v_\phi)}{\partial R} - \frac{1}{R}\frac{\partial v_R}{\partial \phi}

    $$


    where derivatives are taken in the right-handed cylindrical $(R,\phi,Z)$ frame
    and $\omega_Z$ has unit s^-1. In axisymmetric conditions the toroidal-derivative
    term is absent, so vertical vorticity is mainly the radial shear of $R v_\phi$;
    in non-axisymmetric or turbulent flows, toroidal variation of the radial velocity
    can also contribute.


    Vertical vorticity is computed by differentiating measured or modeled velocity
    fields. In experiments the required velocity components can be inferred from flow
    diagnostics and from reconstructed $E\times B$, diamagnetic, or parallel-flow
    contributions; in transport and turbulence modeling it is obtained directly from
    the simulated plasma velocity field or from drift-reduced stream-function formulations.


    Typical magnitudes are 10^3-10^5 s^-1 for slowly varying core rotation shear,
    10^4-10^6 s^-1 in edge transport barriers and scrape-off-layer turbulence, and
    up to 10^6-10^7 s^-1 during rapid transient or small-scale shear events. The signed
    value may change across shear layers, vortices, and turbulent eddies.


    Sign convention: Positive when $(\nabla \times \mathbf{v})$ points in the $+\hat{Z}$
    direction of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:vorticity
  - name:toroidal_vorticity
  - name:parallel_vorticity
  - name:ratio_of_vertical_vorticity_to_major_radius
  sources:
  - id: dd:edge_profiles/ggd/vorticity/z
    dd_path: edge_profiles/ggd/vorticity/z
    status: attached
  - id: dd:plasma_profiles/ggd/vorticity/z
    dd_path: plasma_profiles/ggd/vorticity/z
    status: attached
- name: volume_averaged_boron_density
  kind: scalar
  status: draft
  description: Volume average of the total boron number density over the plasma volume.
    The density includes neutral boron and all boron ionization states, giving a global
    measure of elemental boron impurity content.
  documentation: 'Volume-averaged boron density is the total elemental boron number
    density averaged over the confined plasma volume bounded by the last-closed flux
    surface. It includes neutral boron and all ionization states of boron, so it represents
    the abundance of boron nuclei rather than the density of a single charge state.


    The volume average is defined by


    $$

    \langle n_B \rangle_V = \frac{1}{V_p}\int_{V_p} n_B(\mathbf{x})\,dV,\qquad n_B
    = \sum_{q=0}^{5} n_{\mathrm{B}^{q+}}

    $$


    where $V_p$ is the plasma volume enclosed by the last-closed flux surface, $n_B(\mathbf{x})$
    is the local total boron number density, and $n_{\mathrm{B}^{q+}}$ is the density
    of boron in charge state $q$, with $q=0$ denoting neutral boron and $q=5$ fully
    stripped boron. All number densities are in m^-3 and $V_p$ is in m^3.


    In practice, this quantity is inferred from impurity diagnostics and plasma modeling
    that constrain the boron charge-state distribution, spatial distribution, and
    neutral contribution. Spectroscopic measurements, charge-state-resolved impurity
    analysis, and transport or collisional-radiative modeling may be combined to estimate
    the local $n_B$ before integration over the last-closed-flux-surface volume.


    Typical values are trace-impurity densities relative to the main plasma density,
    often about 10^15-10^18 m^-3 in boron-conditioned tokamak plasmas, with larger
    values possible during active boron injection, strong wall sources, or transient
    impurity influx events.'
  unit: m^-3
  physics_domain: transport
  links:
