- name: motional_stark_radiance_at_spectral_line
  kind: scalar
  status: draft
  description: Photon radiance of a single identified Stark-split spectral line component
    from neutral beam atoms moving through the plasma magnetic field, measured per
    unit area perpendicular to the viewing direction and per unit solid angle integrated
    over the wavelength interval of that component.
  documentation: "The motional Stark effect (MSE) arises when neutral beam atoms injected\
    \ into the plasma experience a Lorentz electric field due to their motion through\
    \ the confining magnetic field. This field Stark-splits the beam emission \u2014\
    \ most commonly the hydrogen or deuterium Balmer-alpha transition \u2014 into\
    \ a multiplet of $\\pi$ and $\\sigma$ components at characteristic wavelength\
    \ displacements from the field-free line center. This quantity gives the photon\
    \ radiance of one identified component of that multiplet, wavelength-integrated\
    \ over the assigned spectral interval, as defined by the parent concept [radiance_at_spectral_line](name:radiance_at_spectral_line).\n\
    \nThe Lorentz electric field driving the Stark splitting is:\n\n$$\n\\mathbf{E}_L\
    \ = \\mathbf{v}_b \\times \\mathbf{B}\n$$\n\nwhere $\\mathbf{v}_b$ is the beam\
    \ atom velocity vector and $\\mathbf{B}$ is the local plasma magnetic field. The\
    \ magnitude of $\\mathbf{E}_L$ sets the wavelength splitting between Stark components,\
    \ and the intensity ratio between $\\pi$ and $\\sigma$ components encodes the\
    \ local magnetic field pitch angle, making per-component radiance the primary\
    \ observable in MSE-based field reconstruction.\n\nIn practice, narrow-band optical\
    \ filters or polychromators isolate individual $\\pi$ or $\\sigma$ components\
    \ along one or more viewing chords intercepting the beam injection volume. The\
    \ wavelength shift of an identified Stark component from the unperturbed transition\
    \ is characterized by the [Stark-shifted minus reference wavelength difference](name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line).\
    \ The line-of-sight path integral of the local MSE emissivity yields the related\
    \ quantity [line_integrated_motional_stark_radiance_at_spectral_line](name:line_integrated_motional_stark_radiance_at_spectral_line),\
    \ while [motional_stark_radiance](name:motional_stark_radiance_at_spectral_line)\
    \ captures the aggregate calibrated spectral radiance without resolving individual\
    \ Stark components."
  unit: m^-2.s^-1.sr^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radiance_at_spectral_line
  - name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line
  - name:line_integrated_motional_stark_radiance_at_spectral_line
  arguments:
  - name: radiance_at_spectral_line
    operator: motional_stark
    operator_kind: qualifier
- name: total_ion_temperature
  kind: scalar
  status: draft
  description: Density-weighted effective temperature of the combined thermal ion
    population at a plasma location, aggregated over all thermal ion species and charge
    states into a single scalar.
  documentation: 'The total ion temperature is the single scalar temperature that
    characterizes the entire thermal ion population at a plasma location by aggregating
    contributions from every ionic species and charge state through a density weighting.
    It is the multi-species generalization of [ion_temperature](name:ion_temperature),
    constructed so that the product with the [total_thermal_ion_density](name:total_thermal_ion_density)
    recovers the [total_thermal_ion_pressure](name:total_thermal_ion_pressure) through
    the thermal equation of state.


    The defining relation is a density-weighted species average:


    $$

    T_{i,\text{tot}} = \frac{\sum_s n_s T_s}{\sum_s n_s}

    $$


    where $s$ runs over all thermal ion species and charge states, $n_s$ is the local
    number density and $T_s$ is the kinetic temperature of species $s$, both evaluated
    at the same plasma location.


    In practice this quantity is inferred from charge-exchange recombination spectroscopy,
    which resolves individual species temperatures and densities; the aggregate total
    follows by density weighting. Typical core values in tokamak plasmas range from
    1 to 20 keV. Spatially integrated variants include [line_averaged_total_ion_temperature](name:line_averaged_total_ion_temperature),
    which averages along a diagnostic chord, and [volume_averaged_total_ion_temperature](name:volume_averaged_total_ion_temperature),
    which serves as a global ion energy-confinement metric.


    Sign convention: Positive for any thermalized ion population, as kinetic temperature
    is an intrinsically non-negative quantity.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_temperature
  - name:total_thermal_ion_density
  - name:total_thermal_ion_pressure
  - name:line_averaged_total_ion_temperature
  - name:volume_averaged_total_ion_temperature
  arguments:
  - name: ion_temperature
    operator: total
    operator_kind: qualifier
- name: line_averaged_total_ion_temperature
  kind: scalar
  status: draft
  description: Chord-length average of the total ion temperature along a diagnostic
    line of sight through the plasma. The local total ion temperature is the density-weighted
    effective temperature of all thermal ion species and charge states combined.
  documentation: 'Line-averaged total ion temperature is the path integral of the
    local total ion temperature divided by the chord length through the plasma. It
    characterizes the ion thermal energy per particle sampled by that line of sight,
    not a volume-averaged or whole-plasma temperature.


    For a chord coordinate $\ell$, the line average is defined by


    $$

    \langle T_{i,\mathrm{tot}} \rangle_\ell = \frac{1}{L}\int_{\ell_0}^{\ell_1} T_{i,\mathrm{tot}}(\ell)\,d\ell

    $$


    where $\ell$ is distance along the line of sight in meters, $L=\ell_1-\ell_0$
    is the averaged chord length in meters, and both $T_{i,\mathrm{tot}}$ and $\langle
    T_{i,\mathrm{tot}} \rangle_\ell$ are in eV. The local total ion temperature is
    $T_{i,\mathrm{tot}}=\sum_s n_s T_{i,s}/\sum_s n_s$, where $n_s$ is the density
    in m^-3 and $T_{i,s}$ is the temperature in eV of thermal ion species or charge
    state $s$. With temperatures expressed in eV, the corresponding ion thermal pressure
    is $p_i=e\sum_s n_s T_{i,s}=e n_{i,\mathrm{tot}}T_{i,\mathrm{tot}}$, where $e$
    is the elementary charge and converts eV per particle to joules per particle.


    In practice this quantity may be inferred from line-integrated or chord-sampled
    ion-temperature diagnostics such as charge-exchange spectroscopy, Doppler broadening
    measurements, neutron spectroscopy, or model-assisted diagnostic inversions. Diagnostic
    response, emissivity weighting, and viewing geometry can affect the inferred chord
    representative value, but the semantic quantity is the chord-length average of
    the density-weighted total thermal ion temperature.


    Physically valid values are non-negative. Typical line-averaged ion temperatures
    range from about 10-500 eV in cold edge or scrape-off-layer-dominated chords,
    500-5000 eV in many auxiliary-heated tokamak plasmas, and 5000-30000 eV in high-performance
    or fusion-grade plasmas.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:total_ion_temperature
  - name:volume_averaged_total_ion_temperature
  - name:line_averaged_total_ion_density
  - name:total_thermal_ion_pressure
  arguments:
  - name: total_ion_temperature
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/t_i_average/value
    dd_path: summary/line_average/t_i_average/value
    status: composed
