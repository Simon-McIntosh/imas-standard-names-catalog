- name: per_toroidal_mode_thermal_electron_power_density
  kind: scalar
  status: active
  description: Toroidal Fourier-mode component of the coherent-wave power density
    absorbed by the bulk thermal electron population.
  documentation: 'This quantity is the toroidal Fourier component of the [thermal
    electron power density](name:thermal_electron_power_density), representing coherent-wave
    energy deposition into bulk thermal electrons for one toroidal mode number. It
    excludes absorption by ions, fast particles, and other nonthermal populations.


    At fixed position in the right-handed cylindrical $(R, \phi, Z)$ frame, the component
    is defined by


    $$

    \tilde{p}_{e,n_\phi}(R,Z)=\frac{1}{2\pi}\int_{0}^{2\pi}p_e(R,\phi,Z)\,e^{-i n_\phi\phi}\,d\phi

    $$


    where $p_e$ is the thermal-electron absorbed power density, $\phi$ is toroidal
    angle, $n_\phi$ is the integer toroidal mode number, $R$ is major radius, and
    $Z$ is vertical height. The Fourier normalization and inverse-mode summation must
    be consistent with this definition; a single mode is not the toroidally integrated
    absorbed power.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
