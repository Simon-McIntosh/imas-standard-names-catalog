      kind: llm
- name: power_of_divertor_due_to_conduction
  kind: scalar
  status: active
  description: Thermal power deposited on all divertor targets by parallel electron
    and ion heat conduction along open scrape-off-layer magnetic field lines, excluding
    convective, radiative, and neutral-particle channels.
  documentation: 'The power of the divertor due to conduction is the total thermal
    energy deposited on all divertor target surfaces by electron and ion heat conduction
    along open scrape-off-layer magnetic field lines. It excludes convective particle
    enthalpy, absorbed radiation, recombination, and neutral-particle contributions,
    and is the divertor-wide counterpart of [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction).


    The total conductive power is defined by integrating the conductive heat-flux
    vector over every wetted divertor target surface:


    $$

    P_{\mathrm{div,cond}} = \sum_k \int_{A_k} \mathbf{q}_{\mathrm{cond}} \cdot \hat{\mathbf{n}}_k\,dA

    $$


    where $A_k$ is the wetted surface of target $k$, $\hat{\mathbf{n}}_k$ points from
    the plasma toward the target material, and $\mathbf{q}_{\mathrm{cond}}$ is the
    sum of the electron and ion conductive heat-flux vectors. This aggregate quantity
    covers the complete divertor assembly and is a locus-specific component of [power_due_to_conduction](name:power_due_to_conduction),
    rather than the global wall quantity [power_at_wall_due_to_conduction](name:power_at_wall_due_to_conduction).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_conduction
  - name:power_due_to_conduction
  - name:power_at_wall_due_to_conduction
  arguments:
  - name: power_due_to_conduction
    operator: divertor
    operator_kind: locus
  sources:
  - dd_path: divertors/divertor/power_conducted
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_conducted
    dd_documentation:
      leaf: Power conducted by the plasma on the divertor targets (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: "Power conducted by the plasma to the divertor targets (summed\
        \ over all targets), representing the conductive heat flux channel in the\
        \ plasma\u2013divertor power exhaust balance. A key quantity for divertor\
        \ heat load characterization."
      kind: llm
- name: power_of_divertor_due_to_convection
  kind: scalar
  status: active
  description: Power deposited on all divertor targets by convective plasma particle
    flux, comprising thermal enthalpy and directed kinetic energy carried by streaming
    ions and electrons from the scrape-off layer.
  documentation: 'Convective power at all divertor targets quantifies the energy transported
    to those targets by plasma particles streaming from the scrape-off layer. It comprises
    thermal enthalpy and directed kinetic-energy contributions carried by convective
    plasma particle flux into the material surfaces, summed over all divertor targets.


    The all-target convective divertor power is the sum of the incident convective
    energy flux over the wetted surfaces of the divertor targets:


    $$

    P_{\mathrm{conv,div}} =

    \sum_{k \in \mathcal{D}} \int_{A_k}

    \sum_s \Gamma_{s,k}^{\mathrm{in}}

    \left(h_{s,k} + \frac{1}{2} m_s |\mathbf{u}_{s,k}|^2\right)

    \, dA

    $$


    where $\mathcal{D}$ is the set of divertor target surfaces, $A_k$ is the wetted
    surface of target $k$, $dA$ is a surface-area element, and $s$ labels incident
    species in the convective channel, including streaming ion and electron species.
    $\Gamma_{s,k}^{\mathrm{in}}$ is the particle-flux density into the material, defined
    by the positive-into-target surface-normal projection $n_{s,k}\max(\mathbf{u}_{s,k}\cdot\hat{\mathbf
    n}_{\mathrm{in},k},0)$; $n_{s,k}$ is the particle density, $\hat{\mathbf n}_{\mathrm{in},k}$
    is the surface normal directed from the plasma into the target, $h_{s,k}$ is the
    thermal enthalpy per particle, $m_s$ is the particle mass, and $\mathbf{u}_{s,k}$
    is the directed flow velocity of the incident particles.


    This quantity is the all-divertor-target realization of [convective power](name:power_due_to_convection);
    the corresponding single-target quantity is [convective power at a single divertor
    target](name:power_at_divertor_target_due_to_convection), and the broader plasma-facing-surface
    counterpart is [convective power at plasma-facing wall and divertor surfaces](name:power_at_wall_due_to_convection).
    It excludes [conductive divertor power](name:power_of_divertor_due_to_conduction),
    radiative deposition, and [recombination-related divertor plasma power](name:plasma_power_of_divertor_due_to_recombination),
    which are separate channels of the divertor power balance.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_convection
  - name:power_at_divertor_target_due_to_convection
  arguments:
  - name: power_due_to_convection
    operator: divertor
    operator_kind: locus
  sources:
  - dd_path: divertors/divertor/power_convected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_convected
    dd_documentation:
      leaf: Power convected by the plasma on the divertor targets (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power convected by the plasma onto the divertor targets (summed
        over all targets), representing the kinetic energy flux of ions and electrons
        flowing along field lines. A key quantity for divertor power load assessment.
      kind: llm
- name: power_of_divertor_due_to_fusion
  kind: scalar
  status: active
  description: Nuclear power deposited in the divertor structure through neutron moderation
    and gamma absorption from fusion reactions, distinct from the plasma thermal load
    conducted or convected to divertor surfaces along magnetic field lines.
  documentation: "In a deuterium-tritium burning plasma, fusion reactions generate\
    \ 14.1 MeV neutrons carrying approximately 80% of the 17.6 MeV reaction energy\
    \ per event. These electrically neutral particles stream freely into surrounding\
    \ structures, and the divertor assembly \u2014 comprising plasma-facing targets,\
    \ support structures, and cooling circuits \u2014 absorbs a fraction via elastic\
    \ and inelastic neutron scattering, radiative capture, and secondary gamma emission.\
    \ This nuclear heating contribution is structurally and thermally distinct from\
    \ [thermal_power_of_divertor](name:thermal_power_of_divertor), which quantifies\
    \ the plasma heat exhaust deposited at divertor surfaces by conductive and convective\
    \ transport along open field lines.\n\nThe nuclear power deposited in the divertor\
    \ is the volume integral of the local nuclear heating power density $\\dot{q}_{\\\
    rm nuc}$ over the divertor assembly:\n\n$$\nP_{\\rm nuc,div} = \\int_{V_{\\rm\
    \ div}} \\dot{q}_{\\rm nuc}(\\mathbf{r}) \\, dV\n$$\n\nwhere $\\mathbf{r}$ is\
    \ position within the divertor volume $V_{\\rm div}$, which encompasses all structural\
    \ and plasma-facing components.\n\nBecause neutrons cannot be directly calorimetrically\
    \ resolved from plasma heat loads during operation, this quantity is computed\
    \ via neutron transport calculations using divertor geometry and material nuclear\
    \ cross-section data. It represents a volumetric heat source relevant to divertor\
    \ coolant system design and structural integrity analysis. Analogous nuclear deposition\
    \ integrals for breeding zone components are defined by [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer)\
    \ and [nuclear_heating_power_of_breeder_blanket_shield](name:nuclear_heating_power_of_breeder_blanket_shield);\
    \ this divertor quantity is a sub-component of the total [power_due_to_fusion](name:power_due_to_fusion)."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:thermal_power_of_divertor
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_shield
  - name:power_due_to_fusion
  arguments:
  - name: power_due_to_fusion
    operator: divertor
    operator_kind: locus
- name: power_of_divertor_due_to_radiation
  kind: scalar
  status: active
  description: Total net photon power absorbed by all divertor targets, summed over
    target surfaces after reflected radiative power is subtracted.
  documentation: 'This quantity is the divertor-wide net radiative power deposited
    on all divertor targets. It aggregates photon energy emitted by impurity and hydrogenic
    species, including line radiation, bremsstrahlung, and radiative recombination
    continuum.


    The total is defined by summing the net radiative deposition over the set of divertor
    targets:


    $$

    P_{\mathrm{rad,div}} = \sum_{t \in \mathcal{T}_{\mathrm{div}}} P_{\mathrm{rad},t}

    $$


    where $\mathcal{T}_{\mathrm{div}}$ is the set of divertor targets and $P_{\mathrm{rad},t}$
    is the photon power incident on target $t$ minus the reflected photon power. This
    quantity is the all-target aggregation of [power due to radiation](name:power_due_to_radiation)
    and excludes particle, conductive, convective, ohmic, and halo-current power deposition.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_radiation
  arguments:
  - name: power_due_to_radiation
    operator: divertor
    operator_kind: locus
  sources:
