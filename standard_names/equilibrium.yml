- name: vertical_coordinate_of_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: Vertical height of the reference point used to define a plasma-boundary
    clearance, expressed in the right-handed cylindrical R-phi-Z frame.
  documentation: 'The plasma-boundary gap reference point is the geometric point from
    which a clearance between the reconstructed plasma boundary and surrounding structures
    is evaluated. Its vertical coordinate locates that point along the $Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame, complementing the radial
    location given by [major radius of plasma boundary gap reference point](name:major_radius_of_plasma_boundary_gap_reference_point).


    For a reference-point position vector $\mathbf{x}_{\rm ref}$, the vertical coordinate
    is the projection onto the vertical basis direction:


    $$

    Z_{\rm ref} = \mathbf{x}_{\rm ref} \cdot \hat{Z}

    $$


    where $Z_{\rm ref}$ is the vertical coordinate and $\hat{Z}$ is the vertical unit
    vector of the cylindrical frame.


    This coordinate is computed from an equilibrium boundary reconstruction together
    with the chosen gap geometry; magnetic diagnostics and boundary-shape constraints
    determine the [vertical coordinate of the plasma boundary](name:vertical_coordinate_of_plasma_boundary),
    while wall or limiter geometry determines nearby reference locations such as the
    [vertical coordinate of the closest wall point](name:vertical_coordinate_of_closest_wall_point).


    Representative values range from about -3-3 m in medium-size tokamaks and can
    extend beyond this range in larger devices, depending on machine height and whether
    the selected gap is upper, lower, or outboard.


    Sign convention: Positive when the reference point lies in the $+Z$ direction
    relative to the machine midplane of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_plasma_boundary_gap_reference_point
  - name:vertical_coordinate_of_plasma_boundary
  - name:vertical_coordinate_of_closest_wall_point
  sources:
