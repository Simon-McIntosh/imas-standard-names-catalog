- name: second_coordinate_of_antenna_aperture_outline
  kind: scalar
  status: draft
  description: Second local coordinate (X2) of vertices defining the polygonal boundary
    of a reflectometer antenna aperture in its local (X1, X2) instrument reference
    frame.
  documentation: "The antenna aperture outline is a closed polygon described by an\
    \ ordered set of vertices in the local instrument frame $(X1, X2)$, where $X1$\
    \ and $X2$ are orthogonal axes fixed to the aperture plane. This quantity gives\
    \ the $X2$-axis position of each vertex, fully specifying the aperture boundary\
    \ shape when paired with the corresponding [first coordinate](name:second_coordinate_of_aperture_outline)\
    \ values. Reflectometer antenna apertures \u2014 used for both emission and detection\
    \ channels in microwave reflectometry \u2014 are typically rectangular or elliptical,\
    \ with characteristic dimensions ranging from a few centimeters to tens of centimeters\
    \ depending on the operating frequency band and beam-shaping requirements. The\
    \ outline geometry enters beam-tracing and synthetic-diagnostic calculations that\
    \ model the antenna radiation pattern and the finite spatial resolution of density-fluctuation\
    \ measurements. The companion quantity [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline)\
    \ covers the analogous coordinate for general diagnostic apertures, while [second_coordinate_of_reflector_outline](name:second_coordinate_of_reflector_outline)\
    \ covers reflector elements in the same local-frame convention.\n\nSign convention:\
    \ Positive when the vertex position is displaced in the positive $X2$ direction\
    \ of the local antenna aperture reference frame."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
