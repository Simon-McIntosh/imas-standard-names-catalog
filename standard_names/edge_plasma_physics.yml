- name: argon_density_at_pedestal_top
  description: |-
    Charge-state-summed local number density of argon ions at the H-mode edge
    pedestal top, excluding neutral argon.
  documentation: |-
    The local argon-ion number density at the H-mode edge pedestal top is the
    physical count of argon ions per plasma volume at that locus, aggregated
    across ionization states. It excludes neutral argon and is neither
    chord-averaged nor volume-averaged.

    $$
    n_{\mathrm{Ar}} = \sum_{z=1}^{18} n_{\mathrm{Ar}^{z+}}
    $$

    where $n_{\mathrm{Ar}}$ is the total local argon-ion number density, $z$ is
    the positive integer argon charge state, and $n_{\mathrm{Ar}^{z+}}$ is the
    local number density of argon ions in charge state $z$. The sum includes Ar+
    through Ar18+.

    The quantity is evaluated at the top of the H-mode edge pedestal, whose
    location is defined by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is a
    locus-specific form of [argon density](name:argon_density), whereas
    [line-averaged argon density](name:line_averaged_argon_density) represents
    averaging along a plasma path rather than a local value.
  unit: m^-3

- name: beryllium_density_at_pedestal_top
  description: |-
    Local number density of ionized beryllium at the top of the H-mode edge
    pedestal, summed over all beryllium ion charge states and excluding neutral
    beryllium.
  documentation: |-
    Beryllium-ion number density at the top of the H-mode edge pedestal
    represents the local concentration of ionized beryllium at the pedestal-top
    location.

    The total beryllium-ion density is defined by

    $$
    n_{\mathrm{Be}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+}}
    $$

    where $n_{\mathrm{Be}}$ is the total beryllium-ion number density,
    $n_{\mathrm{Be}^{q+}}$ is the number density of beryllium ions with charge
    state $q+$, and $q$ is the positive integer charge state from one through
    four.

    The quantity is evaluated locally at the pedestal top, whose position is
    defined by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It applies
    to ionized beryllium only and is summed over all included beryllium ion
    charge states; neutral beryllium is excluded, and individual charge-state
    densities are not reported separately.

    This is the pedestal-top specialization of [beryllium
    density](name:beryllium_density). Its charge-state aggregation is the same
    as for [beryllium density at the magnetic
    axis](name:beryllium_density_at_magnetic_axis), while the evaluation locus
    differs.
  unit: m^-3

- name: boron_density
  description: |-
    Elemental boron number density, summed over neutral atoms and all ionic
    charge states through fully stripped B5+.
  documentation: |-
    Boron density is the elemental boron particle density, with neutral boron
    and every ionic charge state included in one additive quantity.

    $$
    n_B = \sum_{Z=0}^{5} n_{B,Z}
    $$

    where $n_B$ is the elemental boron density, $Z$ is the boron ionic charge
    state with $Z=0$ denoting neutral boron, and $n_{B,Z}$ is the density of
    boron in state $Z$.

    The quantity is the underlying boron density field; [line-averaged boron
    density](name:line_averaged_boron_density) and [volume-averaged boron
    density](name:volume_averaged_boron_density) are distinct averages of it. It
    excludes no boron charge state but is not a charge-state-specific or
    charge-weighted density.
  unit: m^-3

- name: boron_density_at_pedestal_top
  description: |-
    Boron ion number density at the top of the H-mode edge pedestal, summed over
    all boron ionization states and excluding neutral boron.
  documentation: |-
    Boron ion number density at the top of the H-mode edge pedestal is the local
    concentration of boron ions at the inner shoulder of the H-mode transport
    barrier, summed over all positive ionization states.

    The charge-state aggregation is defined by

    $$
    n_{\mathrm{B}} = \sum_{z=1}^{5} n_{\mathrm{B}^{z+}}
    $$

    where $n_{\mathrm{B}}$ is the total boron ion number density,
    $n_{\mathrm{B}^{z+}}$ is the number density of boron ions with charge state
    $z+$, and $z$ is the positive integer ionization state from one through
    five.

    This quantity applies locally to boron ions at the pedestal top, whose
    position is defined by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over all boron ion charge states, excludes neutral boron, and is
    neither line-averaged nor volume-averaged.

    It is the boron-specific component of the broader [density at the pedestal
    top](name:density_at_pedestal_top). Unlike [electron density at the pedestal
    top](name:electron_density_at_pedestal_top), it counts boron ions rather
    than electrons; unlike [boron density at the
    limiter](name:boron_density_at_limiter), it is evaluated at the pedestal-top
    locus.
  unit: m^-3

- name: carbon_density
  description: |-
    Carbon density is the local number density of elemental carbon in the
    plasma, summed over neutral carbon atoms and all ionic charge states through
    fully stripped C6+.
  documentation: |-
    Carbon density is the local number density of elemental carbon in the
    plasma, summed over neutral carbon atoms and all ionic charge states through
    fully stripped $C^{6+}$. It represents the elemental carbon population per
    physical volume, independent of ionization balance.

    The charge-state aggregation is defined by the number-density sum:

    $$
    n_C = \sum_{z=0}^{6} n_{C^{z+}}
    $$

    where $n_C$ is the carbon density, $z=0$ denotes neutral carbon,
    $z=1,\ldots,6$ denote ionic charge states, and $n_{C^{z+}}$ is the number
    density of carbon in charge state $z$.

    This quantity is unweighted by charge, mass, or radiation emissivity and is
    distinct from electron density, charge density, and individual charge-state
    densities. Spatially averaged or locus-specific carbon-density quantities
    include
    [volume_averaged_carbon_density](name:volume_averaged_carbon_density),
    flux_surface_averaged_carbon_density_at_plasma_boundary, and the ion-only
    divertor-target quantity
    [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).
  unit: m^-3

- name: carbon_density_at_pedestal_top
  description: |-
    Carbon ion number density at the top of the H-mode edge pedestal is the
    local concentration of carbon ions, summed over all ionization states and
    excluding neutral carbon.
  documentation: |-
    Carbon ion number density at the top of the H-mode edge pedestal is the
    local concentration of carbon ions at the inner shoulder of the H-mode
    transport barrier.

    The charge-state-summed carbon-ion density is defined by

    $$
    n_{\mathrm{C}} = \sum_{z=1}^{6} n_{\mathrm{C}}^{z+}
    $$

    where $n_{\mathrm{C}}$ is the total carbon-ion number density,
    $n_{\mathrm{C}}^{z+}$ is the number density of carbon ions with charge state
    $z+$, and $z$ is the integer carbon-ion charge state.

    This quantity applies locally at the pedestal top, whose position is defined
    by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over all carbon ionization states from C$^{+}$ through C$^{6+}$,
    excludes neutral carbon, and is not line-, volume-, or
    flux-surface-averaged.

    It is the carbon-species component of the total [density at the pedestal
    top](name:density_at_pedestal_top). Unlike [carbon density at the
    limiter](name:carbon_density_at_limiter), it is evaluated at the
    pedestal-top locus rather than adjacent to a limiter surface.
  unit: m^-3

- name: decay_length_over_scrape_off_layer
  description: |-
    Characteristic outward distance over which a decaying plasma quantity
    decreases by one e-folding in the scrape-off layer.
  documentation: |-
    This quantity is the e-folding distance for a plasma quantity that decreases
    outward from the confined plasma into the open-field-line scrape-off layer.
    The operand may be a particle density, temperature, or heat-flux magnitude.

    $$
    L_f = \left|\frac{d\ln f}{dx}\right|^{-1}
    $$

    where $L_f$ is the e-folding length, $f$ is the positive scalar quantity or
    magnitude being characterized, and $x$ is outward distance from the confined
    plasma in the direction normal to magnetic flux surfaces. The scale is
    defined locally where the logarithmic gradient is nonzero.

    The general quantity includes the electron number-density specialization
    [electron decay length](name:electron_decay_length_over_scrape_off_layer),
    the ion number-density specialization ion decay length, and the heat-flux
    specialization [heat decay
    length](name:heat_decay_length_over_scrape_off_layer). It does not select a
    species, transport channel, or particular decaying quantity.
  unit: m

- name: density_at_pedestal_maximum
  description: |-
    Density at pedestal maximum is the selected plasma-particle number density
    evaluated at the pedestal maximum, the steep mid-pedestal locus of maximum
    pedestal-gradient magnitude. It is a density value at that locus, not a
    density gradient.
  documentation: |-
    Density at pedestal maximum is the selected plasma-particle number density
    evaluated at the [normalized poloidal-flux coordinate of the pedestal
    maximum](name:normalized_poloidal_flux_coordinate_of_pedestal), the steep
    mid-pedestal locus of maximum pedestal-gradient magnitude. The word maximum
    identifies the peak-gradient pedestal locus, not a maximum of the density
    value itself.

    The defining relation is the evaluation of the selected density function at
    that flux-coordinate locus:

    $$
    n_{\mathrm{ped,max}} = n(\psi_{N,\mathrm{ped}})
    $$

    where $n_{\mathrm{ped,max}}$ is the density at pedestal maximum, $n(\psi_N)$
    is the selected plasma-particle number density as a function of the
    normalized poloidal-flux coordinate $\psi_N$, and $\psi_{N,\mathrm{ped}}$ is
    the [normalized poloidal-flux coordinate of the pedestal
    maximum](name:normalized_poloidal_flux_coordinate_of_pedestal).

    This parent quantity is species- or population-generic; concrete children,
    such as [electron density at pedestal
    maximum](name:electron_density_at_pedestal_maximum), specialize the selected
    particle population without changing the locus definition. When the selected
    population is a species with charge states, the species-level density is
    summed over all charge states unless a charge-state-resolved name explicitly
    identifies one charge state.

    It excludes pedestal-top density and any local slope or maximum-gradient
    magnitude with respect to $\psi_N$; those quantities are distinct from the
    density value evaluated at this locus.
  unit: m^-3

- name: density_at_plasma_boundary
  description: |-
    Particle number density of a selected plasma population evaluated at the
    plasma boundary, the last closed magnetic flux surface separating confined
    plasma from the scrape-off layer.
  documentation: |-
    Particle number density at the plasma boundary is the amount of a selected
    particle population per physical volume at the boundary of magnetically
    confined plasma. The population is intentionally unspecified by this parent
    quantity and is fixed by each specialized instance.

    The defining zeroth velocity-space moment is

    $$
    n_P(\mathbf{x}_b,t)=\int f_P(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_P$ is the number density of population $P$, $\mathbf{x}_b$ is a
    point on the plasma boundary, $t$ is time, $\mathbf{v}$ is particle
    velocity, $f_P$ is the velocity distribution function of population $P$, and
    $d^3\mathbf{v}$ is the velocity-space volume element.

    The plasma boundary is the last closed magnetic flux surface, also called
    the separatrix, separating confined plasma from the open-field-line
    scrape-off layer. The selected population may be an electron population, an
    ion or impurity population, a neutral population, an elemental population,
    or an effective isotope mixture. The aggregation convention is additive over
    exactly the particles included in population $P$; inclusion of neutral
    particles and summation over charge states are specialization-dependent and
    are not fixed by this subject-less parent quantity. This boundary quantity
    is distinct from [density_at_magnetic_axis](name:density_at_magnetic_axis)
    and [density_at_limiter](name:density_at_limiter), which use different loci.

    Specialized instances fix the population and its aggregation convention:
    [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)
    selects electrons, while
    [krypton_density_at_plasma_boundary](name:krypton_density_at_plasma_boundary)
    selects krypton ions with charge-state aggregation. Elemental variants such
    as [boron_density_at_plasma_boundary](name:boron_density_at_plasma_boundary)
    may include both neutral atoms and ionic charge states. When population and
    aggregation are held fixed, the corresponding boundary value is the
    locus-specific counterpart of density evaluated at another defined plasma
    location.
  unit: m^-3

- name: beryllium_density_at_plasma_boundary
  description: |-
    Number density of beryllium ions at the plasma boundary, evaluated locally
    on the last closed magnetic flux surface and summed over all ionization
    states.
  documentation: |-
    Number density of beryllium ions at the plasma boundary is the local,
    intensive particle count per physical volume for the beryllium-ion
    population evaluated on the last closed magnetic flux surface. The plasma
    boundary is the separatrix separating magnetically confined plasma from the
    open-field-line scrape-off layer.

    The defining density is the zeroth velocity-space moment, summed over all
    beryllium ionization states:

    $$
    n_{\mathrm{Be}}(\mathbf{x}_b,t)=\sum_{z\in\mathcal{Z}_{\mathrm{Be}}}\int f_{\mathrm{Be},z}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_{\mathrm{Be}}$ is the beryllium-ion number density, $\mathbf{x}_b$
    is a point on the plasma boundary, $t$ is time, $z$ identifies a beryllium
    ionization state, $\mathcal{Z}_{\mathrm{Be}}$ is the set of included
    beryllium ionization states, $\mathbf{v}$ is particle velocity,
    $f_{\mathrm{Be},z}$ is the velocity distribution function for state $z$, and
    $d^3\mathbf{v}$ is the velocity-space volume element.

    The quantity applies locally at the plasma boundary and is additive over all
    included ionic charge states. It includes beryllium ions and excludes
    neutral beryllium atoms; it is not a flux-surface average.

    This is the beryllium-specific instance of
    [density_at_plasma_boundary](name:density_at_plasma_boundary), whose
    particle population is unspecified. It differs from
    flux_surface_averaged_beryllium_density_at_plasma_boundary because that
    quantity averages the beryllium-ion density over the boundary surface, and
    from [beryllium_density_at_limiter](name:beryllium_density_at_limiter),
    which uses a limiter-adjacent locus.
  unit: m^-3

- name: boron_density_at_plasma_boundary
  description: |-
    Number density of boron at the plasma boundary, evaluated as the local,
    intensive particle count per physical volume on the last closed magnetic
    flux surface, summed over neutral atoms and all ionization states.
  documentation: |-
    Number density of boron at the plasma boundary is the local, intensive
    particle count per physical volume for elemental boron evaluated on the last
    closed magnetic flux surface. The plasma boundary is the limiting closed
    magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.

    The local elemental-boron number density at a boundary point is the zeroth
    velocity moment summed over neutral boron and all ionic charge states:

    $$
    n_{\mathrm B}(\mathbf{x}_b,t) = \sum_{z=0}^{5} \int f_{\mathrm B,z}(\mathbf{x}_b,\mathbf{v},t)\,d^3v
    $$

    where $n_{\mathrm B}$ is the elemental-boron number density, $\mathrm B$
    denotes boron, $\mathbf{x}_b$ is a point on the last closed magnetic flux
    surface, $t$ is time, $z$ is the boron charge-state index with $z=0$
    denoting neutral boron and $z=1$ through $5$ denoting the ionic states,
    $f_{\mathrm B,z}$ is the phase-space distribution function for that state,
    $\mathbf{v}$ is particle velocity, and $d^3v$ is the velocity-space volume
    element.

    This quantity applies specifically to elemental boron and includes neutral
    atoms together with all ionic charge states through fully stripped B5+. It
    is a local value at the plasma boundary, with no averaging over the boundary
    surface or over a volume, and excludes densities of other elements and
    electrons. Unlike ion_density_at_plasma_boundary, it is not restricted to
    charged ions.

    It is the boron-specific instance of
    [density_at_plasma_boundary](name:density_at_plasma_boundary). The related
    [flux_surface_averaged_boron_density_at_plasma_boundary](name:flux_surface_averaged_boron_density_at_plasma_boundary)
    applies the same neutral-plus-ionic boron aggregation but averages the
    density over the last closed magnetic flux surface rather than giving the
    local boundary value.
  unit: m^-3

- name: carbon_density_at_plasma_boundary
  description: |-
    Number density of carbon impurity ions at the plasma boundary, evaluated
    locally on the last closed magnetic flux surface and summed over all
    ionization states.
  documentation: |-
    Number density of carbon ions at the plasma boundary is the local particle
    count per physical volume for the carbon-ion population evaluated on the
    last closed magnetic flux surface. The plasma boundary is the separatrix
    separating confined plasma from the open-field-line scrape-off layer.

    The defining zeroth velocity-space moment, with explicit aggregation over
    carbon ionization states, is

    $$
    n_C(\mathbf{x}_b,t)=\sum_{q=1}^{6}\int f_{C^{q+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_C$ is the carbon-ion number density, $\mathbf{x}_b$ is a point on
    the plasma boundary, $t$ is time, $q$ is the integer carbon charge-state
    index, $f_{C^{q+}}$ is the velocity distribution function of carbon ions in
    charge state $q$, $\mathbf{v}$ is particle velocity, and $d^3\mathbf{v}$ is
    the velocity-space volume element.

    This quantity applies locally to carbon ions in charge states C+ through C6+
    and is summed over those ionization states. Neutral carbon is excluded, and
    the value is not averaged over the boundary flux surface.

    It specializes the population-unspecified
    [density_at_plasma_boundary](name:density_at_plasma_boundary) to carbon
    ions. It is distinct from
    flux_surface_averaged_carbon_density_at_plasma_boundary, which applies the
    same carbon-ion aggregation after averaging over the boundary surface, and
    from [carbon_density](name:carbon_density), whose elemental scope includes
    neutral carbon as well as ionic charge states.
  unit: m^-3

- name: deuterium_density_at_pedestal_top
  description: |-
    Deuterium ion number density at the top of the H-mode edge pedestal is the
    local concentration of deuterium ions, summed over all charge states, at the
    transport-barrier shoulder.
  documentation: |-
    Deuterium ion number density at the top of the H-mode edge pedestal is the
    local concentration of deuterium ions at the inner shoulder of the H-mode
    transport barrier.

    The charge-state-summed density is defined by

    $$
    n_D = \sum_z n_{D,z}
    $$

    where $n_D$ is the deuterium ion number density and $n_{D,z}$ is the number
    density of deuterium ions in charge state $z$.

    This quantity applies specifically to deuterium ions and is evaluated
    locally at the pedestal top, whose position is defined by the [normalized
    poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over all deuterium ion charge states and is not a density-weighted
    average, line average, or volume average; neutral deuterium and electrons
    are excluded.

    It is the deuterium-specific component of the species-resolved [density at
    the pedestal top](name:density_at_pedestal_top). The corresponding [electron
    density at the pedestal top](name:electron_density_at_pedestal_top)
    describes the electron population at the same locus and is not included in
    this ion density.
  unit: m^-3

- name: deuterium_density_at_plasma_boundary
  description: |-
    Number density of deuterium ions at the plasma boundary, evaluated locally
    on the last closed magnetic flux surface, summed over all ionic charge
    states, and excluding neutral deuterium.
  documentation: |-
    Number density of deuterium ions at the plasma boundary is the local
    particle count per physical volume for the deuterium-ion population
    evaluated on the last closed magnetic flux surface. The plasma boundary is
    the separatrix separating magnetically confined plasma from the
    open-field-line scrape-off layer.

    The defining zeroth velocity-space moment is

    $$
    n_D(\mathbf{x}_b,t)=\sum_{z>0}\int f_{D^{z+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_D$ is the deuterium-ion number density, $\mathbf{x}_b$ is a point
    on the plasma boundary, $t$ is time, $z$ is a positive ionic charge state,
    $D^{z+}$ denotes deuterium in charge state $z$, $\mathbf{v}$ is particle
    velocity, $f_{D^{z+}}$ is the velocity distribution function for that charge
    state, and $d^3\mathbf{v}$ is the velocity-space volume element.

    This quantity applies specifically to deuterium ions, is evaluated locally
    at the plasma boundary, and is additive over all included positive deuterium
    charge states. Neutral deuterium atoms and molecules are excluded. It is
    therefore distinct from the broader ion_density_at_plasma_boundary, which
    does not select deuterium, and from
    flux_surface_averaged_deuterium_density_at_plasma_boundary, which applies a
    flux-surface average rather than a local boundary evaluation.

    This species-specific quantity is a specialization of
    [density_at_plasma_boundary](name:density_at_plasma_boundary), whose
    particle population and charge-state aggregation are unspecified. The local
    deuterium value provides the pointwise boundary quantity from which the
    corresponding flux-surface-averaged deuterium density is formed.
  unit: m^-3

- name: deuterium_tritium_density_at_pedestal_top
  description: |-
    Deuterium-tritium ion number density at the top of the H-mode edge pedestal
    is the local concentration of the effective single fuel pseudo-species at
    the transport-barrier shoulder.
  documentation: |-
    Deuterium-tritium ion number density at the top of the H-mode edge pedestal
    is the local concentration of the effective single deuterium-tritium fuel
    pseudo-species at the inner shoulder of the H-mode transport barrier.

    The local density is defined by

    $$
    n_{\mathrm{DT}} = \lim_{\Delta V \to 0} \frac{N_{\mathrm{DT}}(\Delta V)}{\Delta V}
    $$

    where $n_{\mathrm{DT}}$ is the deuterium-tritium pseudo-species number
    density, $N_{\mathrm{DT}}(\Delta V)$ is the number of pseudo-species ions
    within the volume $\Delta V$, and $\Delta V$ is a shrinking spatial volume
    around the evaluation point.

    This quantity applies to the effective single deuterium-tritium fuel
    pseudo-species, rather than to separately resolved deuterium and tritium
    populations. It is a local value at the pedestal top, whose position is
    defined by the [normalized poloidal-flux coordinate at the pedestal
    top](name:normalized_poloidal_flux_coordinate_of_pedestal), and is not a
    flux-surface or line-of-sight average.

    It is the deuterium-tritium species specialization of [density at the
    pedestal top](name:density_at_pedestal_top). Unlike [deuterium-tritium
    density at the plasma
    boundary](name:deuterium_tritium_density_at_plasma_boundary), which uses the
    plasma boundary as its locus, this quantity is evaluated at the pedestal-top
    location.
  unit: m^-3

- name: deuterium_tritium_density_at_plasma_boundary
  description: |-
    Number density of the effective deuterium-tritium fuel pseudo-species at the
    plasma boundary, evaluated as the local, intensive particle count per
    physical volume on the last closed magnetic flux surface.
  documentation: |-
    Number density of the effective deuterium-tritium fuel pseudo-species at the
    plasma boundary is the local, intensive particle count per physical volume
    for that effective species evaluated on the last closed magnetic flux
    surface. The plasma boundary is the limiting closed magnetic flux surface
    separating confined plasma from the open-field-line scrape-off-layer region.

    The local effective deuterium-tritium number density is the zeroth velocity
    moment of its distribution function at a boundary point:

    $$
    n_{DT}(\mathbf{x}_b,t) = \int f_{DT}(\mathbf{x}_b,\mathbf{v},t)\,d^3v
    $$

    where $n_{DT}$ is the effective deuterium-tritium fuel-pseudo-species number
    density, $\mathbf{x}_b$ is a point on the last closed magnetic flux surface,
    $t$ is time, $\mathbf{v}$ is the velocity of the effective pseudo-species,
    $f_{DT}$ is its phase-space distribution function, and $d^3v$ is the
    velocity-space volume element.

    This quantity applies to the deuterium-tritium fuel mixture represented as
    one effective pseudo-species, rather than to separate deuterium and tritium
    populations. It is a local boundary value with no averaging over the
    boundary surface or over a volume, and no additional charge-state
    aggregation is implied by the effective-species representation.

    It is the deuterium-tritium-specific instance of
    [density_at_plasma_boundary](name:density_at_plasma_boundary). Unlike
    flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary, it
    denotes the local value at the plasma boundary rather than an average over
    that last closed magnetic flux surface.
  unit: m^-3

- name: edge_localized_mode_frequency
  description: |-
    Rate of recurrent edge-localized mode events during an ELMing H-mode phase,
    expressing the cadence of pedestal-relaxation bursts rather than their
    amplitude or exhaust.
  documentation: |-
    The edge-localized mode frequency is the event rate of recurrent
    pedestal-relaxation bursts during an ELMing H-mode phase. It characterizes
    the cadence of ELM events, not their amplitude, duration, expelled particle
    content, or transient energy.

    $$
    f_{\mathrm{ELM}} = \frac{N_{\mathrm{ELM}}}{\Delta t}
    $$

    where $f_{\mathrm{ELM}}$ is the ELM event frequency, $N_{\mathrm{ELM}}$ is
    the number of identified ELM events, and $\Delta t$ is the elapsed interval
    over which those events are counted. The interval must represent the ELMing
    phase being characterized; isolated events outside that phase are excluded.
  unit: Hz

- name: effective_charge_at_plasma_boundary
  description: |-
    Effective charge number of the ion mixture at the plasma boundary is the
    charge-squared-weighted sum of ionic number densities divided by the
    electron number density at that boundary. It equals one for a purely singly
    charged hydrogenic ion mixture and increases with impurity charge content.
  documentation: |-
    Effective charge number of the ion mixture at the plasma boundary is the
    charge-squared-weighted sum of ionic number densities divided by the
    electron number density, evaluated at the plasma boundary where the confined
    plasma meets the last closed flux surface. Because each ion population is
    weighted by the square of its charge number, higher charge states contribute
    disproportionately to this quantity relative to their particle density.

    The boundary value is defined from the charge-state-resolved ion densities
    by

    $$
    Z_{\mathrm{eff},b} = \frac{\sum_i n_{i,b} Z_i^2}{n_{e,b}}
    $$

    where $Z_{\mathrm{eff},b}$ is the effective charge at the plasma boundary,
    $i$ indexes every ion species and charge state present at the boundary,
    $n_{i,b}$ is the number density of ion population $i$ at the boundary in
    $\mathrm{m}^{-3}$, $Z_i$ is its charge number, and $n_{e,b}$ is the electron
    number density at the boundary in $\mathrm{m}^{-3}$. Under quasineutrality,
    $n_{e,b} = \sum_i n_{i,b} Z_i$, so the denominator equals the
    charge-weighted (first-moment) sum of the same ion densities.

    The sum includes all ion species and all charge states at the boundary; for
    a quasineutral, purely singly charged hydrogenic ion mixture,
    $Z_{\mathrm{eff},b} = 1$, and any admixture of multiply charged impurities
    raises the value above unity. This local boundary value is distinct from
    [flux-surface-averaged effective charge at the plasma
    boundary](name:flux_surface_averaged_effective_charge_at_plasma_boundary),
    which applies an explicit average over the boundary flux surface, and from
    [effective charge at the limiter](name:effective_charge_at_limiter), which
    is evaluated at the limiter contact location rather than at the plasma
    boundary.
  unit: '1'

- name: electron_decay_length_over_scrape_off_layer
  description: |-
    Characteristic outward distance over which electron number density decreases
    by one e-folding in the scrape-off layer.
  documentation: |-
    This quantity is the e-folding distance for electron number density that
    decreases outward from the confined plasma into the open-field-line
    scrape-off layer. It is the electron-density member of the [decay-length
    family](name:decay_length_over_scrape_off_layer), distinct from the ion
    decay length.

    $$
    L_e = \left|\frac{d\ln n_e}{dx}\right|^{-1}
    $$

    where $L_e$ is the electron-density e-folding length, $n_e$ is electron
    number density, and $x$ is outward distance normal to magnetic flux
    surfaces. The quantity is defined locally where the logarithmic gradient is
    nonzero; the magnitude gives the positive distance associated with the
    outward decrease. It does not denote the decay length of temperature or heat
    flux, which are separate members of the family.
  unit: m

- name: electron_density_at_launching_position
  description: |-
    Electron number density at the wave-launching position is the local
    free-electron count per unit volume where an injected electromagnetic wave
    first contacts the edge plasma.
  documentation: |-
    This quantity is the local free-electron number density at the geometric
    launching position, such as a wave launcher aperture or waveguide mouth
    where an injected electromagnetic wave first contacts the edge plasma. It is
    the electron-specific component of number density at the launching position.

    The density is defined from the electron velocity-distribution function by

    $$
    n_e(\mathbf{x}_{\mathrm{launch}})=\int f_e(\mathbf{x}_{\mathrm{launch}},\mathbf{v})\,d^3\mathbf{v}
    $$

    where $n_e$ is electron number density, $\mathbf{x}_{\mathrm{launch}}$ is
    the launching position, $f_e$ is the electron velocity-distribution
    function, and $\mathbf{v}$ is electron velocity.

    This is a local value for free electrons at the launching position, not a
    density summed over plasma species, a flux-surface average, or a wave-power
    quantity. It is distinct from [electron number density at the plasma
    boundary](name:electron_density_at_plasma_boundary), which is evaluated at
    the last closed flux surface.
  unit: m^-3

- name: electron_density_at_pedestal_maximum
  description: |-
    Electron density at pedestal maximum is the electron number density
    evaluated at the pedestal maximum, the steep mid-pedestal location of
    maximum pedestal-gradient magnitude. It is the density value at that locus,
    not the slope with respect to normalized poloidal-flux coordinate.
  documentation: |-
    Electron density at pedestal maximum is the electron number density
    evaluated at the pedestal maximum, the steep mid-pedestal locus whose
    position is given by the [normalized poloidal-flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is a
    local density value of the electron population at that flux-coordinate
    position.

    The defining evaluation is

    $$
    n_{e,\mathrm{ped,max}} = n_e(\psi_{N,\mathrm{ped}})
    $$

    where $n_{e,\mathrm{ped,max}}$ is the electron density at pedestal maximum,
    $n_e(\psi_N)$ is the [electron density](name:electron_density) as a function
    of normalized poloidal-flux coordinate $\psi_N$, and $\psi_{N,\mathrm{ped}}$
    is the [normalized poloidal-flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).

    The scope is the free-electron population in the pedestal region at this
    single locus. The value is local rather than averaged over the pedestal or
    integrated over a flux surface or volume, and no ion charge-state
    aggregation is part of this electron quantity.

    It is distinct from the pedestal-top electron density and from a maximum
    value of $n_e$ over the pedestal; the word maximum denotes the
    pedestal-gradient locus, not an extremum of electron density. It is also
    distinct from the signed gradient or slope of electron density with respect
    to $\psi_N$.

    The associated derivative of electron density at pedestal maximum with
    respect to normalized poloidal-flux coordinate is $\partial n_e/\partial
    \psi_N$ evaluated at the same pedestal maximum locus; that derivative
    characterizes the local gradient, whereas $n_{e,\mathrm{ped,max}}$ is the
    value being differentiated.
  unit: m^-3

- name: electron_density_at_pedestal_top
  description: |-
    Number density of electrons at the H-mode pedestal top, giving the
    electron-density pedestal height as a local particle concentration.
  documentation: |-
    Number density of electron

    The local density is the zeroth velocity-space moment of the electron
    distribution:

    $$
    n_e(\mathbf{x}_{\rm pt}) = \int f_e(\mathbf{x}_{\rm pt},\mathbf{v})\,d^3v
    $$

    where $n_e$ is the electron number density, $\mathbf{x}_{\rm pt}$ is the
    position at the pedestal top, $f_e$ is the electron number distribution in
    position and velocity space, $\mathbf{v}$ is electron velocity, and $d^3v$
    is the velocity-space volume element.

    All free electrons contribute; ions and bound electrons are excluded. This
    is a local density, neither flux-surface averaged nor line-of-sight
    averaged. Pedestal height here denotes a density level, not a spatial width
    or a density gradient.

    It is the electron-specific member of [density at the pedestal
    top](name:density_at_pedestal_top), not a sum over different plasma species.
    [Electron density at the pedestal
    maximum](name:electron_density_at_pedestal_maximum) describes the same
    electron population evaluated at a different locus.
  unit: m^-3

- name: electron_density_at_plasma_boundary
  description: |-
    Number density of electrons at the plasma boundary, counting all free
    electrons and allowing pointwise values or an explicitly specified
    flux-surface average.
  documentation: |-
    Number density of electron

    The local density is defined by

    $$
    n_e(\mathbf{x}) = \int f_e(\mathbf{x},\mathbf{v})\,d^3v
    $$

    where $n_e$ is the local electron number density, $\mathbf{x}$ is the
    spatial position on the plasma boundary, $\mathbf{v}$ is electron velocity,
    $f_e$ is the electron phase-space number distribution, and $d^3v$ is the
    velocity-space volume element. The integral covers the full electron
    velocity distribution.

    The population includes thermal and nonthermal free electrons without an
    orbit-class restriction; electrons bound in atoms or ions are excluded.
    Unlike [ion density at the plasma
    boundary](name:ion_density_at_plasma_boundary), this quantity counts
    electrons rather than ions.

    This quantity encompasses pointwise values and explicitly specified
    magnetic-flux-surface averages. The [flux-surface-averaged electron density
    at the plasma
    boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary) is
    its surface-averaged specialization, using inverse-magnitude
    poloidal-flux-gradient weighting rather than pointwise evaluation. Neither a
    chord average nor an average over the confined plasma volume is implied.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: electron_heat_decay_length_over_scrape_off_layer
  description: |-
    Radial e-folding decay length of the electron heat flux in the scrape-off
    layer, defined by the inverse magnitude of its outward logarithmic gradient.
  documentation: |-
    The electron heat decay length in the scrape-off layer (SOL) is the radial
    distance over which the electron heat-flux profile falls to $1/e$ of its
    separatrix value. It characterizes the spatial scale of electron heat
    exhaust across the open-field-line region and specializes the
    channel-unspecified [heat decay
    length](name:heat_decay_length_over_scrape_off_layer).

    The decay length is defined as the inverse magnitude of the outward
    logarithmic gradient of the electron heat flux:

    $$
    \lambda_{q,e} = \left| \frac{\partial \ln q_e}{\partial r} \right|^{-1}
    $$

    where $q_e$ is the electron heat flux and $r$ is radial distance measured
    outward from the separatrix into the SOL.

    This quantity includes only the electron heat channel and is distinct from
    the corresponding [ion heat decay
    length](name:ion_heat_decay_length_over_scrape_off_layer). As the magnitude
    of a logarithmic gradient, the decay length is non-negative.
  unit: m

- name: electron_larmor_radius_normalized_at_pedestal_top_high_field_side
  description: |-
    Dimensionless ratio of the electron Larmor radius to its macroscopic
    normalization length at the high-field-side pressure-pedestal top, evaluated
    with the local magnetic-field magnitude.
  documentation: |-
    The normalized electron Larmor radius is the dimensionless gyroradius of the
    electron population evaluated at the high-field-side pressure-pedestal top.
    It characterizes electron orbit scale relative to the macroscopic length
    prescribed by the normalization convention.

    The defining relation is

    $$
    \rho_e^* = \frac{\rho_e}{L_{\mathrm{ref}}} = \frac{m_e v_{\perp,e}}{|q_e| B_{\mathrm{HFS}} L_{\mathrm{ref}}}
    $$

    where $\rho_e^*$ is the normalized electron Larmor radius, $\rho_e$ is the
    electron Larmor radius, $L_{\mathrm{ref}}$ is the prescribed macroscopic
    normalization length, $m_e$ is the electron mass, $v_{\perp,e}$ is the
    characteristic electron speed perpendicular to the magnetic field, $q_e$ is
    the electron charge, and $B_{\mathrm{HFS}}$ is the local magnetic-field
    magnitude at the high-field-side pressure-pedestal top. The field magnitude
    is the quantity represented by the [high-field-side pedestal-top
    magnetic-field
    magnitude](name:magnetic_field_magnitude_at_pedestal_top_high_field_side).

    The quantity applies specifically to electrons and to the high-field-side
    pressure-pedestal-top location. It is a local dimensionless scale ratio, not
    an unnormalized Larmor radius, a magnetic-field component, or a quantity
    aggregated over particle species. The normalization length and
    characteristic-speed convention must be specified consistently; this
    definition does not prescribe particular choices.

    The [corresponding low-field-side
    value](name:electron_larmor_radius_normalized_at_pedestal_top_low_field_side)
    uses the same normalization concept with the low-field-side magnetic-field
    evaluation. For equal characteristic electron speed and normalization
    length, the two normalized radii vary inversely with their respective local
    magnetic-field magnitudes.
  unit: '1'

- name: energy_diffusion_coefficient
  description: |-
    Fick's-law coefficient relating the diffusive thermal energy flux of a
    plasma constituent to its local temperature gradient, serving as the
    species-agnostic parent abstraction over electron, ion, and neutral
    population specializations.
  documentation: |-
    The energy diffusion coefficient characterizes gradient-driven thermal
    energy transport for any plasma constituent — electrons, ions, or neutrals —
    by specifying the proportionality between the diffusive heat flux and the
    local temperature gradient in the Fick's-law sense. It is the thermal-energy
    channel of the general diffusion_coefficient, which governs particle,
    momentum, and energy transport alike, and it is distinct from convective or
    $E \times B$ contributions to the total heat flux.

    The defining relation for the diffusive energy flux
    $\mathbf{Q}_\mathrm{diff}$ of a given constituent is:

    $$
    \mathbf{Q}_\mathrm{diff} = -D_E \, \nabla T
    $$

    where $D_E$ is the energy diffusion coefficient and $\nabla T$ is the
    temperature gradient of that constituent. In a magnetized plasma $D_E$ is
    strongly anisotropic; radial cross-field values govern energy confinement
    while values along field lines are orders of magnitude larger.

    Species-resolved children include
    [electron_energy_diffusion_coefficient](name:electron_energy_diffusion_coefficient)
    for the electron population and
    [ion_energy_diffusion_coefficient](name:ion_energy_diffusion_coefficient)
    for the total ion population aggregated over all charge states;
    neutral-particle transport is handled by analogous neutral specializations.
    The effective diffusivity that combines diffusive and convective
    contributions is tracked separately by energy_effective_diffusivity.
  unit: m^2.s^-1

- name: flux_surface_averaged_argon_density_at_plasma_boundary
  description: |-
    Number density of argon ions averaged over the last closed magnetic flux
    surface, summed over all argon ion charge states and excluding neutral
    argon.
  documentation: |-
    Number density of argon

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{Ar}}\rangle = \oint n_{\mathrm{Ar}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{Ar}}\rangle$ is the averaged argon-ion number
    density, $n_{\mathrm{Ar}}$ is the local argon-ion number density, $S$ is the
    plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is the
    poloidal magnetic flux; $|\nabla\psi|$ is the magnitude of its spatial
    gradient.

    This quantity is summed over all charged argon ion states and excludes
    neutral argon. It is a flux-surface average rather than a local point value,
    line average, or volume average.

    It is the averaged counterpart of the local [argon ion
    density](name:argon_density) and differs from the [volume-averaged argon
    density](name:volume_averaged_argon_density), which uses a plasma-volume
    average instead of an inverse-poloidal-flux-gradient-weighted surface
    average. Its species-specific structure parallels the [flux-surface-averaged
    xenon density at the plasma
    boundary](name:flux_surface_averaged_xenon_density_at_plasma_boundary).

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: flux_surface_averaged_beryllium_density_at_plasma_boundary
  description: |-
    Number density of beryllium ions averaged over the plasma boundary, summed
    over all ionization states and excluding neutral beryllium.
  documentation: |-
    Number density of beryllium

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{Be}}\rangle = \oint n_{\mathrm{Be}}\,dS/|\nabla\psi| \, /\, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{Be}}\rangle$ is the averaged beryllium-ion number
    density, $n_{\mathrm{Be}}$ is the local beryllium-ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is
    the poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity is summed over all beryllium ion charge states and excludes
    neutral beryllium. It is a flux-surface average, not a local point value,
    volume average, or chord average.

    It is the flux-surface-averaged counterpart of the local [beryllium ion
    density at the plasma boundary](name:beryllium_density_at_plasma_boundary).
    It differs from the [volume-averaged beryllium
    density](name:volume_averaged_beryllium_density), which uses a volume rather
    than a flux-surface domain.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: flux_surface_averaged_boron_density_at_plasma_boundary
  description: |-
    Flux-surface-averaged number density of boron, including neutral atoms and
    all ionization states, evaluated on the plasma boundary.
  documentation: |-
    The quantity is the boron particle number density averaged over the last
    closed magnetic flux surface at the plasma boundary. It includes neutral
    boron and all ionic charge states through fully stripped B5+, rather than
    selecting a single charge state. It is the flux-surface-averaged counterpart
    of [boron density at the plasma
    boundary](name:boron_density_at_plasma_boundary).

    $$
    \langle n_{\mathrm B}\rangle_{\psi_b} = \frac{\displaystyle\oint_{\psi=\psi_b} n_{\mathrm B}\,\frac{dS}{|\nabla\psi|}}{\displaystyle\oint_{\psi=\psi_b} \frac{dS}{|\nabla\psi|}}
    $$

    Here $n_{\mathrm B}$ is the local total boron particle number density,
    $\psi$ is the poloidal-flux surface label, $\psi_b$ identifies the
    plasma-boundary surface, and $dS$ is its surface element. The result is an
    average over the complete surface, not the density at a selected point or
    for a selected ionization state.
  unit: m^-3

- name: flux_surface_averaged_carbon_density_at_plasma_boundary
  description: |-
    Number density of carbon ions averaged over the last closed magnetic flux
    surface at the plasma boundary, summed over all carbon ion charge states and
    excluding neutral carbon.
  documentation: |-
    Number density of carbon

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{C}}\rangle = \oint n_{\mathrm{C}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{C}}\rangle$ is the averaged carbon-ion number
    density, $n_{\mathrm{C}}$ is the local carbon-ion number density, $S$ is the
    flux surface at the specified plasma-boundary locus, $dS$ is its surface
    element, and $\psi$ is the poloidal magnetic flux whose gradient magnitude
    provides the weighting.

    This quantity is summed over all carbon ion charge states and excludes
    neutral carbon. It is a flux-surface average rather than a local point
    value, a charge-state-resolved density, or a volume average. The
    transformation from the local [carbon-ion density at the plasma
    boundary](name:carbon_density_at_plasma_boundary) replaces the pointwise
    value with the inverse-poloidal-flux-gradient-weighted surface mean. It is
    the carbon-specific counterpart of [flux-surface-averaged neon density at
    the plasma
    boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary).

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: flux_surface_averaged_deuterium_density_at_plasma_boundary
  description: |-
    Number density of deuterium ions averaged over the plasma-boundary flux
    surface, summed over all deuterium ion charge states and excluding neutral
    deuterium.
  documentation: |-
    Number density of deuterium

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{D}}\rangle = \oint n_{\mathrm{D}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{D}}\rangle$ is the averaged deuterium-ion number
    density, $n_{\mathrm{D}}$ is the local deuterium-ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is
    the poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity is summed over all deuterium ion charge states. It is not a
    local point value, a volume average, or a density that includes neutral
    deuterium.

    It is the flux-surface-averaged counterpart of the local [deuterium ion
    density at the plasma boundary](name:deuterium_density_at_plasma_boundary),
    replacing the pointwise value with inverse-poloidal-flux-gradient weighting.
    It follows the same species-resolved averaging pattern as the
    [flux-surface-averaged xenon density at the plasma
    boundary](name:flux_surface_averaged_xenon_density_at_plasma_boundary), with
    deuterium ions as the selected population.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: flux_surface_averaged_effective_charge_at_plasma_boundary
  description: |-
    Flux-surface average of the ion-mixture effective charge over the entire
    plasma-boundary surface, distinct from the local boundary value.
  documentation: |-
    This quantity is the flux-surface average of the ion-mixture effective
    charge over the plasma boundary, identified with the last closed flux
    surface. It summarizes the charge composition across the complete boundary
    surface rather than at a single location.

    $$
    \left\langle Z_{\mathrm{eff}} \right\rangle_{\psi_b} = \frac{\oint_{\psi_b} Z_{\mathrm{eff}}\,d\ell/B_p}{\oint_{\psi_b} d\ell/B_p}, \qquad Z_{\mathrm{eff}} = \frac{\sum_i n_i Z_i^2}{n_e}
    $$

    Here $\psi_b$ labels the plasma-boundary flux surface, $d\ell$ is poloidal
    arc length, $B_p$ is the poloidal magnetic-field magnitude, $n_i$ and $Z_i$
    are the number density and charge number of ion population $i$, and $n_e$ is
    the electron number density. The linked effective charge at the plasma
    boundary denotes the corresponding local boundary quantity; this entry
    denotes its flux-surface average.
  unit: '1'

- name: flux_surface_averaged_electron_density_at_plasma_boundary
  description: |-
    Flux-surface-averaged electron number density at the plasma boundary, using
    inverse-magnitude poloidal-flux-gradient weighting rather than a pointwise
    value.
  documentation: |-
    Number density of electron

    The flux-surface average is defined by

    $$
    \langle n_e\rangle = \oint n_e\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_e\rangle$ is the averaged electron number density, $n_e$ is
    the local electron number density, the subscript $e$ identifies electrons,
    $S$ is the plasma-boundary flux surface, $dS$ is its surface element, $\psi$
    is poloidal magnetic flux, and $\nabla$ is the spatial gradient operator.

    This quantity applies only to the electron population at the plasma
    boundary. Its aggregation is over the flux surface with inverse-gradient
    weighting, not over particle species; it is neither an ion density, a
    pointwise density, a volume average, nor an unweighted surface average.

    It is the averaged counterpart of the local [electron number density at the
    plasma boundary](name:electron_density_at_plasma_boundary): the parent
    quantity supplies $n_e$ at each surface point, while this quantity applies
    the normalized flux-surface integral. It differs from [flux-surface-averaged
    total ion density at the plasma
    boundary](name:flux_surface_averaged_total_ion_density_at_plasma_boundary),
    which represents charged ions rather than electrons.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: flux_surface_averaged_tungsten_density_at_plasma_boundary
  description: |-
    Flux-surface-averaged number density of positively charged tungsten ions on
    the last closed magnetic flux surface, summed over all ionization states.
  documentation: |-
    This quantity is the number density of tungsten ions averaged over the last
    closed magnetic flux surface, with all positive ionization states included
    and neutral tungsten excluded. It is the surface-averaged counterpart of the
    local tungsten density at the plasma boundary.

    The flux-surface average at the plasma-boundary flux label is defined by

    $$
    \langle n_{\mathrm{W}} \rangle_{\psi_b} = \frac{\oint_{\psi=\psi_b} n_{\mathrm{W}}\,d\ell_p/B_p}{\oint_{\psi=\psi_b} d\ell_p/B_p}
    $$

    where $\psi_b$ is the flux label of the plasma boundary, $n_{\mathrm{W}}$ is
    the local summed tungsten-ion density, $d\ell_p$ is poloidal contour length,
    and $B_p$ is the poloidal magnetic-field magnitude. The quantity is distinct
    from [volume-averaged tungsten
    density](name:volume_averaged_tungsten_density), which averages over the
    enclosed plasma volume.
  unit: m^-3

- name: heat_convection_velocity
  description: |-
    Heat convection velocity is the effective advective velocity whose product
    with thermal-energy density gives the convective heat flux. It characterizes
    heat transport only and does not imply equality to any bulk fluid velocity.
  documentation: |-
    Heat convection velocity is the effective advective velocity associated with
    convective transport of thermal energy. It relates a convective heat-flux
    component to the corresponding thermal-energy density for the same heat
    population, without requiring the effective velocity to equal a bulk fluid
    velocity.

    For a scalar component along an oriented transport direction, the defining
    relation is

    $$
    q_h^{\mathrm{conv}} = w_h v_h^{\mathrm{conv}}
    $$

    where $q_h^{\mathrm{conv}}$ is the convective heat-flux component, $w_h$ is
    the thermal-energy density of the transported heat population, and
    $v_h^{\mathrm{conv}}$ is the heat convection velocity.

    This quantity is heat-specific: it is not a generic convection velocity for
    arbitrary plasma scalars. For species-level specializations such as [ion
    heat convection velocity](name:ion_heat_convection_velocity), the effective
    velocity is an intensive quantity and is the density-weighted mean over all
    charge states of the species.

    Sign convention: Positive when the associated convective heat-flux component
    is directed along the positive orientation of the transport direction used
    for that component.
  unit: m.s^-1

- name: heat_flux
  description: |-
    Vector of plasma energy transport per unit area, whose projection through an
    oriented surface gives the power crossing it through convective, conductive,
    and turbulent channels.
  documentation: |-
    The heat-flux vector represents the net transport of plasma energy through
    space, including convective, conductive, cross-field, field-aligned, and
    fluctuation-driven contributions when included in the energy balance.

    For an oriented surface $S$, the transported power is defined by

    $$
    P_S = \int_S \mathbf{q} \cdot \hat{\mathbf{n}}\,dA
    $$

    where $\mathbf{q}$ is the heat-flux vector, $P_S$ is the crossing power in
    W, $\hat{\mathbf{n}}$ is the chosen unit normal, and $dA$ is a surface
    element in m$^2$. The [parallel heat flux](name:parallel_heat_flux) is its
    projection along the local magnetic-field direction. Convective transport
    may be parameterized by the ratio of heat flux to product of particle flux
    and particle temperature due to convection.

    Sign convention: Positive when the local component of $\mathbf{q}$ points
    along the chosen oriented surface normal $\hat{\mathbf{n}}$.
  unit: W.m^-2

- name: helium_3_density_at_plasma_boundary
  description: |-
    Number density of helium-3 ions at the plasma boundary, evaluated as the
    local particle count per physical volume on the last closed magnetic flux
    surface and summed over charge states.
  documentation: |-
    Number density of helium-3 ions at the plasma boundary is the local,
    intensive particle count per physical volume for the helium-3 ion population
    evaluated on the last closed magnetic flux surface. The plasma boundary is
    the limiting closed magnetic flux surface, or separatrix, separating
    confined plasma from the open-field-line scrape-off-layer region.

    The local charge-state-summed helium-3 number density is the zeroth velocity
    moment of the helium-3 ion distribution functions at a boundary point:

    $$
    n_{{}^{3}\mathrm{He}}(\mathbf{x}_b,t) = \sum_{q=1}^{2} \int f_{{}^{3}\mathrm{He},q}(\mathbf{x}_b,\mathbf{v},t)\,d^3v
    $$

    where $n_{{}^{3}\mathrm{He}}$ is the helium-3 ion number density,
    $\mathbf{x}_b$ is a point on the last closed magnetic flux surface, $t$ is
    time, $q$ is the helium-3 ionic charge state, $f_{{}^{3}\mathrm{He},q}$ is
    the phase-space distribution function for that charge state, $\mathbf{v}$ is
    ion velocity, and $d^3v$ is the velocity-space volume element.

    This quantity applies specifically to helium-3 ions, whose nuclei contain
    three nucleons, and includes all ionized charge states from singly charged
    through fully stripped helium-3. It excludes neutral helium-3, other helium
    isotopes, and other plasma species. The value is local at the boundary and
    is not averaged over the boundary surface or over a volume.

    It is the helium-3-specific instance of
    [density_at_plasma_boundary](name:density_at_plasma_boundary). The related
    flux_surface_averaged_helium_3_density_at_plasma_boundary represents the
    average of this local helium-3 ion density over the same last closed
    magnetic flux surface rather than its value at a boundary point.
  unit: m^-3

- name: flux_surface_averaged_helium_3_density_at_plasma_boundary
  description: |-
    Number density of helium-3 ions averaged over the plasma boundary, summed
    over all helium-3 ion charge states and excluding neutral helium-3.
  documentation: |-
    Number density of helium 3

    The flux-surface average is defined by

    $$
    \langle n_{{}^3\mathrm{He}}\rangle = \oint n_{{}^3\mathrm{He}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{{}^3\mathrm{He}}\rangle$ is the averaged helium-3 ion
    number density, $n_{{}^3\mathrm{He}}$ is the local helium-3 ion number
    density, $S$ is the plasma-boundary flux surface, $dS$ is its surface
    element, and $\psi$ is the poloidal magnetic flux whose gradient magnitude
    provides the averaging weight.

    This quantity applies to helium-3 ions at the plasma boundary, is summed
    over all helium-3 ion charge states, and excludes neutral helium-3. It is
    not a local point value and does not include neutral atoms.

    It is the flux-surface-averaged counterpart of the local [helium-3 ion
    density at the plasma boundary](name:helium_3_density_at_plasma_boundary),
    replacing the pointwise value with an
    inverse-poloidal-flux-gradient-weighted surface mean. It differs from the
    [volume-averaged helium-3 density](name:volume_averaged_helium_3_density),
    which averages over the confined plasma volume rather than over the
    plasma-boundary surface.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.

    Related quantities:
    [flux_surface_averaged_helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary).
  unit: m^-3

- name: helium_4_density_at_pedestal_top
  description: |-
    Helium-4 ion number density at the top of the H-mode edge pedestal is the
    local concentration of helium-4 ions summed over all ionization states.
  documentation: |-
    Helium-4 ion number density at the top of the H-mode edge pedestal is the
    local concentration of helium-4 ions at the inner shoulder of the H-mode
    transport barrier.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{He4}} = \sum_{q=1}^{2} n_{\mathrm{He4}}^{(q)}
    $$

    where $n_{\mathrm{He4}}$ is the helium-4 ion number density,
    $n_{\mathrm{He4}}^{(q)}$ is the local number density of helium-4 ions in
    charge state $q$, and $q$ is the positive ion charge-state index. The sum
    includes singly and doubly ionized helium-4 and excludes neutral helium-4.

    This quantity applies specifically to the helium-4 isotope and is evaluated
    locally at the pedestal top, whose position is defined by the [normalized
    poloidal-flux coordinate at the pedestal
    top](name:normalized_poloidal_flux_coordinate_of_pedestal). It is not a
    flux-surface average, line-of-sight average, or total ion density.

    It is the helium-4 species specialization of [density at the pedestal
    top](name:density_at_pedestal_top). It differs from [helium-4 density at the
    plasma boundary](name:helium_4_density_at_plasma_boundary) because the
    latter is evaluated at the plasma-boundary locus, and it is the mass-isotope
    counterpart of [helium-3 density at the pedestal
    top](name:helium_3_density_at_pedestal_top).
  unit: m^-3

- name: helium_4_density_at_plasma_boundary
  description: |-
    Number density of helium-4 ions at the plasma boundary, evaluated locally on
    the last closed magnetic flux surface and summed over all charge states.
  documentation: |-
    Number density of helium-4 ions at the plasma boundary is the local particle
    count per physical volume for the helium-4 ion population evaluated on the
    last closed magnetic flux surface. It represents the charge-state-summed
    helium-4 ion population at that locus.

    The defining charge-state-summed zeroth velocity-space moment is

    $$
    n_{{}^{4}\mathrm{He}}(\mathbf{x}_b,t)=\sum_q\int f_{{}^{4}\mathrm{He},q}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_{{}^{4}\mathrm{He}}$ is the helium-4 ion number density,
    $\mathbf{x}_b$ is a point on the plasma boundary, $t$ is time, $q$ is the
    ionic charge-state index, $f_{{}^{4}\mathrm{He},q}$ is the velocity
    distribution function of helium-4 ions in charge state $q$, $\mathbf{v}$ is
    particle velocity, and $d^3\mathbf{v}$ is the velocity-space volume element.

    The plasma boundary is the last closed magnetic flux surface, also called
    the separatrix, separating confined plasma from the open-field-line
    scrape-off layer. This quantity applies only to helium-4 ions, is evaluated
    locally at the boundary, includes all helium-4 ionic charge states, and
    excludes neutral helium-4 atoms.

    As a species-specific instance of [particle number density at the plasma
    boundary](name:density_at_plasma_boundary), it fixes the otherwise
    unspecified population to helium-4 ions. It differs from
    flux-surface-averaged helium-4 density at the plasma boundary, which
    averages the same charge-state-summed population over the boundary surface,
    and from [helium-3 density at the plasma
    boundary](name:helium_3_density_at_plasma_boundary), which selects a
    different helium isotope.
  unit: m^-3

- name: flux_surface_averaged_helium_4_density_at_plasma_boundary
  description: |-
    Number density of helium-4 ions averaged over the full plasma-boundary flux
    surface, summed over all ionic charge states and excluding neutral helium-4.
  documentation: |-
    Number density of helium 4

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{He4}}\rangle = \oint n_{\mathrm{He4}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{He4}}\rangle$ is the averaged helium-4 ion number
    density, $n_{\mathrm{He4}}$ is the local helium-4 ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is
    the poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    The density is summed over all positive helium-4 ion charge states and is
    not a local point value, a volume average, or a density that includes
    neutral helium-4. It is the flux-surface-averaged counterpart of the local
    [helium-4 ion density at the plasma
    boundary](name:helium_4_density_at_plasma_boundary);
    inverse-poloidal-flux-gradient weighting replaces that parent quantity's
    pointwise value with a surface mean. The isotope-specific scope
    distinguishes it from [flux-surface-averaged helium-3 density at the plasma
    boundary](name:flux_surface_averaged_helium_3_density_at_plasma_boundary).

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.

    Related quantities:
    [flux_surface_averaged_hydrogen_density_at_plasma_boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary).
  unit: m^-3

- name: hydrogen_density_at_pedestal_top
  description: |-
    Local number density of hydrogen ions at the core-side shoulder of the
    H-mode edge pedestal, summed over all hydrogen ion charge states and
    excluding neutral hydrogen.
  documentation: |-
    Hydrogen ion number density at the top of the H-mode edge pedestal is the
    local count of hydrogen ions per unit volume at the pedestal's core-side
    shoulder. It is specific to hydrogen ions rather than the total ion
    population.

    The charge-state-summed hydrogen ion density is defined by:

    $$
    n_{\mathrm H} = \sum_{Z\geq 1} n_{\mathrm H}^{(Z+)}
    $$

    where $n_{\mathrm H}$ is the local hydrogen-ion number density, $n_{\mathrm
    H}^{(Z+)}$ is the local number density of hydrogen ions with charge state
    $Z+$, and $Z$ is the positive integer charge-state index.

    This quantity applies locally at the pedestal top, whose position is defined
    by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). The
    aggregation is a sum over all hydrogen ion charge states; neutral hydrogen
    and ions of other elements are excluded.

    It differs from [flux-surface-averaged hydrogen density at the plasma
    boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary),
    which is averaged over a flux surface and evaluated at the plasma boundary,
    and from [hydrogen density at the plasma
    boundary](name:hydrogen_density_at_plasma_boundary), which has a different
    spatial locus.
  unit: m^-3

- name: hydrogen_density_at_plasma_boundary
  description: |-
    Number density of hydrogen ions at the plasma boundary, evaluated locally on
    the last closed magnetic flux surface and summed over all hydrogen ion
    charge states.
  documentation: |-
    Number density of hydrogen ions at the plasma boundary is the local particle
    count per physical volume for the hydrogen-ion population on the last closed
    magnetic flux surface separating confined plasma from the open-field-line
    scrape-off layer.

    The defining zeroth velocity-space moment is

    $$
    n_H(\mathbf{x}_b,t)=\int f_H(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_H$ is the hydrogen-ion number density, $\mathbf{x}_b$ is a point on
    the plasma boundary, $t$ is time, $\mathbf{v}$ is particle velocity, $f_H$
    is the hydrogen-ion velocity distribution function, and $d^3\mathbf{v}$ is
    the velocity-space volume element.

    This quantity is evaluated locally at the plasma boundary and is summed over
    the included hydrogen ion charge states. It excludes neutral hydrogen and is
    distinct from electron density and from the total ion population represented
    by ion_density_at_plasma_boundary.

    The corresponding surface-averaged quantity,
    flux_surface_averaged_hydrogen_density_at_plasma_boundary, applies the same
    hydrogen-ion population to an average over the boundary surface rather than
    a local evaluation. The subject-unspecified parent
    [density_at_plasma_boundary](name:density_at_plasma_boundary) defines the
    common boundary-density concept, while this quantity fixes the population as
    hydrogen ions.
  unit: m^-3

- name: flux_surface_averaged_hydrogen_density_at_plasma_boundary
  description: |-
    Number density of hydrogen ions averaged over the plasma-boundary flux
    surface, with all hydrogen ion charge states summed and neutral hydrogen
    excluded.
  documentation: |-
    Number density of hydrogen

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{H}}\rangle = \oint n_{\mathrm{H}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{H}}\rangle$ is the averaged hydrogen-ion number
    density, $n_{\mathrm{H}}$ is the local hydrogen-ion number density, $S$ is
    the averaging flux surface, $dS$ is its surface element, and $\psi$ is the
    poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity applies to hydrogen ions on the plasma boundary, with all
    hydrogen ion charge states summed and neutral hydrogen excluded. It is a
    flux-surface average rather than a local point value, a volume average, or a
    charge-state-resolved density.

    It is the averaged counterpart of the local [hydrogen ion density at the
    plasma boundary](name:hydrogen_density_at_plasma_boundary): the local
    density is replaced by an inverse-flux-gradient-weighted surface mean. The
    same averaging operation applied to another species gives a distinct
    quantity, such as [flux-surface-averaged helium-4 density at the plasma
    boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary).

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: ion_average_temperature_at_pedestal_top
  description: |-
    Density-weighted kinetic temperature of all ion species and charge states
    evaluated at the core-side shoulder of the H-mode pedestal.
  documentation: |-
    Ion average temperature at the pedestal top is the density-weighted kinetic
    temperature of the combined ion population at the core-side shoulder of the
    H-mode pedestal. It is the ion-specific component of average temperature at
    the pedestal top.

    $$
    T_{i,\mathrm{avg}} = \frac{\sum_s n_s T_s}{\sum_s n_s}
    $$

    where $T_{i,\mathrm{avg}}$ is the ion average temperature, $n_s$ is the
    number density of ion species or charge state $s$, and $T_s$ is its kinetic
    temperature. The sum includes all ion species and charge states in the
    defined ion population; it is not an electron temperature or a temperature
    for a single ion species. The weighting denominator is the total ion density
    represented by total ion density at the pedestal top.
  unit: eV

- name: ion_density_at_plasma_boundary
  description: |-
    Number density of charged ions at the plasma boundary, with each
    specialization defining whether the value is local or averaged over the last
    closed magnetic flux surface.
  documentation: |-
    Number density of ions at the plasma boundary is the particle count per
    physical volume for a charged-ion population associated with the last closed
    magnetic flux surface separating confined plasma from the scrape-off layer.

    The defining charge-state-summed velocity-space moment is

    $$
    n_i(\mathbf{x}_b,t)=\sum_{s\in\mathcal{S}}\sum_{Z>0}\int f_{s,Z}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_i$ is the ion number density, $\mathbf{x}_b$ is a point on the
    plasma boundary, $t$ is time, $\mathcal{S}$ is the set of included ion
    species, $Z$ is a positive ionic charge state, $f_{s,Z}$ is the velocity
    distribution function of species $s$ in charge state $Z$, $\mathbf{v}$ is
    particle velocity, and $d^3\mathbf{v}$ is the velocity-space volume element.

    The aggregation is additive over the included charged-ion species and all
    their positive charge states; neutral atoms are excluded. A concrete
    instance may provide the local boundary value, as in [total ion density at
    the plasma boundary](name:total_ion_density_at_plasma_boundary), or its
    average over the last closed magnetic flux surface, as in
    [flux-surface-averaged ion density at the plasma
    boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary). This
    ion-specific parent is narrower than [density at the plasma
    boundary](name:density_at_plasma_boundary), whose selected population and
    neutral-particle inclusion are specialization-dependent.
  unit: m^-3

- name: flux_surface_averaged_ion_density_at_plasma_boundary
  description: |-
    Number density of ions of a specified species at the plasma boundary,
    flux-surface averaged with inverse poloidal-flux-gradient weighting, summed
    over all charge states, and excluding neutral atoms and molecules.
  documentation: |-
    Number density of ion

    The flux-surface average is defined by

    $$
    \langle n_i\rangle = \oint n_i\,dS/|\nabla\psi| \,/\, \oint dS/|\nabla\psi|
    $$

    where $\langle n_i\rangle$ is the averaged ion number density, $n_i$ is the
    local [ion density at the plasma
    boundary](name:ion_density_at_plasma_boundary) of the represented ion
    species, $i$ is the ion-species label, $S$ is the plasma-boundary flux
    surface, $dS$ is its surface element, and $\psi$ is the [poloidal magnetic
    flux](name:poloidal_magnetic_flux) whose gradient magnitude is
    $|\nabla\psi|$.

    This quantity is evaluated on the confined-plasma side of the plasma
    boundary. It is summed over all charge states of the represented ion species
    and excludes neutral atoms and molecules; distinct ion species are not
    implicitly combined. It is a flux-surface average, not a local point value,
    volume average, or chord average.

    The average is formed from the local [ion density at the plasma
    boundary](name:ion_density_at_plasma_boundary) by applying
    inverse-poloidal-flux-gradient weighting over the surface. It differs from
    the [flux-surface-averaged total ion density at the plasma
    boundary](name:flux_surface_averaged_total_ion_density_at_plasma_boundary),
    which additionally aggregates charged-ion densities across ion species.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: ion_heat_convection_velocity
  description: |-
    Ion heat convection velocity is the effective vector velocity whose product
    with ion thermal-energy density gives the convective flux of ion thermal
    energy. As a species-level intensive quantity, it is the density-weighted
    mean over all ion charge states and is not assumed to equal the bulk ion
    flow velocity.
  documentation: |-
    Ion heat convection velocity is the effective vector velocity that advects
    aggregate ion thermal energy in an ion energy balance. It is a species-level
    intensive velocity for the ion population, defined as the density-weighted
    mean over all ion charge states.

    The defining relation is the convective part of the ion thermal-energy flux:

    $$
    \mathbf{q}_{i,\mathrm{conv}} = \mathcal{E}_{i,\mathrm{th}}\,\mathbf{v}_{Q_i}
    $$

    where $\mathbf{q}_{i,\mathrm{conv}}$ is the convective flux of ion thermal
    energy, $\mathcal{E}_{i,\mathrm{th}}$ is the ion thermal-energy density, and
    $\mathbf{v}_{Q_i}$ is the ion heat convection velocity.

    This quantity is not, by definition, the bulk ion flow velocity or an ion
    particle convection velocity; it is defined by the ion thermal-energy flux
    decomposition. Component-resolved specializations, such as [parallel ion
    heat convection velocity](name:parallel_ion_heat_convection_velocity), are
    projections of this ion-heat transport velocity and do not change the
    charge-state aggregation convention.

    Sign convention: Positive when a resolved component of $\mathbf{v}_{Q_i}$
    points along the positive basis vector for that component, such as
    $+\hat{R}$, $+\hat{\phi}$, or $+\hat{Z}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: ion_heat_decay_length_over_scrape_off_layer
  description: |-
    Radial e-folding decay length of the ion heat flux in the scrape-off layer,
    defined by its outward logarithmic decrease.
  documentation: |-
    The ion heat decay length in the scrape-off layer (SOL) is the radial
    distance over which the ion heat-flux profile falls to $1/e$ of its
    separatrix value, characterizing the spatial scale of ion heat exhaust
    across the open-field-line region.

    The decay length is defined by the inverse magnitude of the outward
    logarithmic radial gradient of the ion heat flux $q_i$:

    $$
    \lambda_{q,i} = \left| \frac{\partial \ln q_i}{\partial r} \right|^{-1}
    $$

    where $r$ is radial distance measured outward from the separatrix and $q_i$
    is the ion contribution to the heat flux. This species-resolved quantity is
    the ion-channel specialization of
    [heat_decay_length_over_scrape_off_layer](name:heat_decay_length_over_scrape_off_layer);
    the corresponding electron channel is
    [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer).
    It excludes the electron heat contribution and any unspecified total
    heat-flux combination.
  unit: m

- name: ion_power_density
  description: |-
    Net rate of energy transfer to or from an ion population per unit physical
    volume, summed over its ionic charge states and the included energy-transfer
    processes.
  documentation: |-
    Ion power density is the net rate at which energy is transferred to or from
    an ion population per unit physical volume. It is the source or sink term
    for that recipient population in its energy balance.

    The volumetric power density is defined by

    $$
    Q_i = \frac{dP_i}{dV}
    $$

    where $Q_i$ is the ion power density, $P_i$ is the net power transferred to
    the selected ion population within physical volume $V$, and the subscript
    $i$ identifies the ion recipient.

    The recipient may be a specified ion species or an aggregate of species,
    with contributions summed over all ionic charge states of each included
    species. The net source combines the included energy-transfer processes; it
    does not inherently require every heating or loss mechanism. Unlike [ion
    charge-state power density](name:ion_charge_state_power_density), it does
    not resolve individual charge states or charge-state bundles.

    This quantity is neither stored ion energy nor volume-integrated power. It
    is also distinct from the complete rate of change of ion energy, which
    includes transport contributions. Energy transferred to electron or neutral
    recipients is excluded.

    [Fast-ion power density](name:fast_ion_power_density) specializes this
    quantity to coherent-wave energy deposition into nonthermal ions of a
    specified species. [Total ion power density](name:total_ion_power_density)
    instead aggregates the net energy-transfer rate over all included ion
    species and charge states.

    Sign convention: Positive when energy is transferred to the selected ion
    population; negative when energy is removed from it.
  unit: W.m^-3

- name: iron_density
  description: |-
    Total number density of iron impurity ions in the plasma, summed over all
    ionization states from singly to fully ionized iron (atomic number Z = 26).
  documentation: |-
    Iron density is the total number density of iron ions present in the plasma,
    aggregated over all charge states from Fe$^{1+}$ through Fe$^{26+}$ (atomic
    number $Z = 26$). It characterizes the iron impurity content without
    resolving the per-charge-state distribution, and may refer to a local point
    value or a spatially averaged quantity depending on the sampling convention.

    The total iron ion number density $n_\mathrm{Fe}$ is defined as:

    $$
    n_\mathrm{Fe} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}
    $$

    where $n_{\mathrm{Fe}^{z+}}$ is the number density of iron in charge state
    $z$.

    Iron enters confined plasmas primarily through physical sputtering of
    high-$Z$ plasma-facing components. Spectroscopic measurements in the
    vacuum-ultraviolet and soft X-ray ranges resolve individual charge-state
    emission lines; the total iron density is reconstructed by summing
    ionization-state-resolved densities derived from ionization balance
    calculations.

    This general quantity is concretized by spatial-sampling variants:
    flux_surface_averaged_iron_density averages the local density over a
    magnetic flux surface,
    [line_averaged_iron_density](name:line_averaged_iron_density) represents a
    chord-integrated value divided by path length, and
    [volume_averaged_iron_density](name:volume_averaged_iron_density) integrates
    over the full plasma volume. Position-specific forms are available at key
    radial locations such as
    [iron_density_at_magnetic_axis](name:iron_density_at_magnetic_axis),
    iron_density_at_pedestal, and
    [iron_density_at_limiter](name:iron_density_at_limiter).
  unit: m^-3

- name: iron_density_at_pedestal_top
  description: |-
    Local number density of iron ions, summed over all ionization states,
    evaluated at the core-side top of the H-mode edge pedestal.
  documentation: |-
    Iron-ion number density is the local amount of ionized iron per unit plasma
    volume at the H-mode edge-pedestal top.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{Fe}} = \sum_{q=1}^{Z_{\mathrm{Fe}}} n_{\mathrm{Fe}^{q+}}
    $$

    where $n_{\mathrm{Fe}}$ is the total iron-ion number density,
    $n_{\mathrm{Fe}^{q+}}$ is the number density of iron ions in charge state
    $q$, $q$ is the positive ionization-state index, and $Z_{\mathrm{Fe}}$ is
    the atomic number of iron and maximum positive charge state. The quantity is
    evaluated at the core-side shoulder of the H-mode edge pedestal, whose
    position is defined by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).

    The aggregation includes all positive iron ionization states and excludes
    neutral iron and ions of every other element. It is therefore distinct from
    a charge-state-resolved iron-ion density and from the total density of all
    ion species.

    This density is an additive species contribution to the total ion density at
    the same location and provides one of the density weights entering the [ion
    average temperature at the pedestal
    top](name:ion_average_temperature_at_pedestal_top).
  unit: m^-3

- name: iron_density_at_plasma_boundary
  description: |-
    Number density of iron impurity ions at the plasma boundary, the last closed
    flux surface separating the magnetically confined plasma from the
    open-field-line scrape-off layer, summed over all ion charge states from Fe+
    through fully stripped Fe26+.
  documentation: |-
    Iron density at the plasma boundary is the number of iron impurity ions per
    unit volume — summed over all ion charge states from singly ionized Fe$^+$
    through fully stripped Fe$^{26+}$ (atomic number $Z = 26$) — evaluated at
    the separatrix, the last closed flux surface separating the magnetically
    confined plasma from the open-field-line scrape-off layer. It represents the
    charge-state-summed iron impurity concentration on that boundary.

    The charge-state aggregation is

    $$
    n_{\mathrm{Fe}} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}
    $$

    where $n_{\mathrm{Fe}}$ is the iron ion number density at the plasma
    boundary, $z$ is the positive ion charge state, and $n_{\mathrm{Fe}^{z+}}$
    is the partial number density of iron ions in charge state $z+$ at the same
    boundary; these number-density variables have the unit specified for this
    standard name.

    The sum is over ion charge states only, so neutral iron Fe$^0$ is excluded.
    As a scalar number density, the quantity is non-negative, with zero denoting
    absence of iron ions at the plasma boundary. It is distinct from
    flux_surface_averaged_iron_density_at_plasma_boundary, which denotes a
    flux-surface-averaged boundary value rather than the local boundary density.
  unit: m^-3

- name: flux_surface_averaged_iron_density_at_plasma_boundary
  description: |-
    Number density of iron ions averaged over the plasma-boundary flux surface,
    summed over all iron ion charge states and excluding neutral iron.
  documentation: |-
    Number density of iron

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{Fe}}\rangle = \oint n_{\mathrm{Fe}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{Fe}}\rangle$ is the averaged iron-ion number
    density, $n_{\mathrm{Fe}}$ is the local iron-ion number density, $S$ is the
    plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is the
    poloidal magnetic flux whose gradient magnitude provides the averaging
    weight.

    This quantity applies to iron ions on the plasma-boundary flux surface and
    is summed over all positive iron ion charge states, from singly ionized
    through fully stripped iron. Neutral iron is excluded. The result is a
    flux-surface average, not a local point value, volume average, or total iron
    inventory.

    It is the flux-surface-averaged counterpart of the local [iron density at
    the plasma boundary](name:iron_density_at_plasma_boundary): the same
    charge-state-summed ion density is converted from a pointwise value to an
    inverse-poloidal-flux-gradient-weighted surface mean. It is distinct from
    [iron density at the limiter](name:iron_density_at_limiter), which refers to
    a different evaluation locus.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: krypton_density_at_pedestal_top
  description: |-
    Charge-state-summed number density of krypton ions at the top of the H-mode
    pedestal, with neutral krypton excluded.
  documentation: |-
    Krypton ion number density at the top of the H-mode pedestal counts ionized
    krypton particles per unit plasma volume at that locus.

    The charge-state aggregation is defined by

    $$
    n_{\mathrm{Kr,ion}} = \sum_{z=1}^{36} n_{\mathrm{Kr}^{z+}}
    $$

    where $n_{\mathrm{Kr,ion}}$ is the total krypton ion number density,
    $n_{\mathrm{Kr}^{z+}}$ is the number density of krypton ions in charge state
    $z+$, $z$ is the positive integer charge state, and 36 is krypton's atomic
    number.

    The quantity is evaluated at the top of the H-mode pedestal, whose position
    is defined by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over all ionized krypton charge states and excludes neutral krypton.

    This entry is the pedestal-top specialization of
    [krypton_density](name:krypton_density); it is a local value rather than the
    volume-averaged quantity
    [volume_averaged_krypton_density](name:volume_averaged_krypton_density).
  unit: m^-3

- name: lithium_density_at_pedestal_top
  description: |-
    Local number density of charged lithium ions at the top of the H-mode edge
    pedestal, summed over all lithium ionization states and excluding neutral
    lithium.
  documentation: |-
    Lithium-ion number density at the top of the H-mode edge pedestal is the
    local concentration of charged lithium particles at the pedestal's inner
    shoulder, where the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal) identifies
    the evaluation location.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{Li}} = \sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}
    $$

    where $n_{\mathrm{Li}}$ is the total charged-lithium number density, $q$ is
    the lithium ionization charge-state index, and $n_{\mathrm{Li}^{q+}}$ is the
    number density of lithium ions in charge state $q$. The aggregation includes
    Li$^+$, Li$^{2+}$, and Li$^{3+}$ and excludes neutral lithium.

    This quantity is a local value at the pedestal top, not a line average such
    as [line-averaged lithium density](name:line_averaged_lithium_density) or a
    flux-surface average such as [flux-surface-averaged lithium density at the
    plasma
    boundary](name:flux_surface_averaged_lithium_density_at_plasma_boundary).
    Its species scope is lithium only, and its charge-state aggregation is a sum
    over all charged lithium ionization states.
  unit: m^-3

- name: lithium_density_at_plasma_boundary
  description: |-
    Number density of lithium ions at the plasma boundary, evaluated locally on
    the last closed magnetic flux surface and summed over all ionization states.
  documentation: |-
    Number density of lithium ions at the plasma boundary is the local particle
    count per physical volume for the lithium-ion population evaluated on the
    last closed magnetic flux surface. The plasma boundary is the separatrix
    separating confined plasma from the open-field-line scrape-off layer.

    The defining charge-state-summed zeroth velocity-space moment is

    $$
    n_{\mathrm{Li}}(\mathbf{x}_b,t)=\sum_{Z=1}^{3}\int f_{\mathrm{Li}^{Z+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_{\mathrm{Li}}$ is the lithium-ion number density, $\mathbf{x}_b$ is
    a point on the plasma boundary, $t$ is time, $Z$ is the lithium
    ionization-state index, $f_{\mathrm{Li}^{Z+}}$ is the velocity distribution
    function for lithium ions in charge state $Z+$, $\mathbf{v}$ is particle
    velocity, and $d^3\mathbf{v}$ is the velocity-space volume element.

    This quantity is local at the plasma boundary and is not averaged over the
    boundary flux surface. It includes lithium ions from Li+ through Li3+,
    summed over these charge states, and excludes neutral lithium. It is the
    lithium-specific specialization of [density at the plasma
    boundary](name:density_at_plasma_boundary).

    The corresponding flux-surface-averaged quantity, flux-surface-averaged
    lithium density at the plasma boundary, applies a flux-surface average to
    the same charge-state-summed lithium-ion density. The boundary locus also
    distinguishes this quantity from [lithium density at the
    limiter](name:lithium_density_at_limiter), which is evaluated at a limiter
    rather than at the plasma boundary.
  unit: m^-3

- name: flux_surface_averaged_lithium_density_at_plasma_boundary
  description: |-
    Number density of lithium ions averaged over the plasma-boundary flux
    surface, summed over all lithium ion charge states and excluding neutral
    lithium.
  documentation: |-
    Number density of lithium

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{Li}}\rangle = \oint n_{\mathrm{Li}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{Li}}\rangle$ is the averaged lithium-ion number
    density, $n_{\mathrm{Li}}$ is the local lithium-ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, $\psi$ is
    poloidal magnetic flux, and $\nabla$ denotes the spatial gradient operator,
    so $|\nabla\psi|$ is the magnitude of that gradient.

    This quantity applies to lithium ions on the plasma boundary and is summed
    over all positive lithium ion charge states. It excludes neutral lithium and
    is not a local point value, a volume average, or a line-of-sight average.

    It is the flux-surface-averaged counterpart of the local [lithium-ion number
    density at the plasma boundary](name:lithium_density_at_plasma_boundary),
    replacing the pointwise value with inverse-poloidal-flux-gradient weighting
    over the surface. It differs from the [volume-averaged lithium
    density](name:volume_averaged_lithium_density), which averages over plasma
    volume, and the [line-averaged lithium
    density](name:line_averaged_lithium_density), which averages along a
    specified chord.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: mach_number
  description: |-
    Dimensionless vector ratio of plasma flow velocity to the local sound speed,
    retaining directional components of the flow.
  documentation: |-
    The Mach-number vector is the plasma flow velocity normalized by the local
    sound speed. Its magnitude expresses flow speed relative to sound speed,
    while its directional components retain the signed flow projection. The
    family includes directional quantities such as the [parallel Mach
    number](name:parallel_mach_number).

    $$
    \mathbf{M} = \frac{\mathbf{v}}{c_s}
    $$

    where $\mathbf{M}$ is the Mach-number vector, $\mathbf{v}$ is the plasma
    flow-velocity vector, and $c_s$ is the local sound speed. For a specified
    direction $a$, the corresponding component is $M_a = v_a/c_s$, where $v_a$
    is the flow-velocity projection along that direction.

    The quantity is dimensionless and is distinct from the unnormalized flow
    velocity; the sound-speed definition and the selected projection determine
    the specific physical interpretation of each component.
  unit: '1'

- name: magnetic_shear_at_plasma_boundary
  description: |-
    Magnetic shear at the plasma boundary is the logarithmic derivative of the
    safety factor with respect to the outward normalized toroidal flux radius.
  documentation: |-
    Magnetic shear at plasma boundary

    The defining relation is

    $$
    \hat{s} = \frac{\rho}{q}\frac{dq}{d\rho}
    $$

    where $\hat{s}$ is the magnetic shear, $q$ is the safety factor, and $\rho$
    is the normalized toroidal flux radius, increasing outward. The expression
    is evaluated at the plasma boundary, using the limit from the
    confined-plasma side when required and where that limit exists.

    The scope is a single boundary evaluation, with no additional flux-surface
    averaging or averaging over neighboring flux surfaces. It is not an integral
    across the edge or the magnetic shear evaluated at another named locus.

    This quantity is the plasma-boundary specialization of [magnetic shear at a
    flux surface](name:magnetic_shear_at_flux_surface): it uses the same
    logarithmic safety-factor derivative, with the evaluation locus fixed to the
    plasma boundary.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: '1'

- name: neon_density_at_pedestal_top
  description: |-
    Neon ion number density at the top of the H-mode edge pedestal, summed over
    all ionization states.
  documentation: |-
    Neon ion number density at the top of the H-mode edge pedestal is the local
    concentration of ionized neon particles there, aggregated over their
    ionization states.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{Ne}} = \sum_{z=1}^{Z_{\mathrm{Ne}}} n_{\mathrm{Ne}^{z+}}
    $$

    where $n_{\mathrm{Ne}}$ is the total neon ion number density,
    $n_{\mathrm{Ne}^{z+}}$ is the number density of neon ions with charge state
    $z+$, $z$ is the positive integer charge state, and $Z_{\mathrm{Ne}}$ is the
    atomic number of neon and the maximum ion charge state.

    This quantity applies to ionized neon at the top of the H-mode edge
    pedestal, whose position is defined by the [normalized poloidal flux
    coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is local
    and summed over all neon ion charge states; it excludes neutral neon,
    individual charge-state densities, and line-, surface-, or volume-averaged
    densities.

    It is the neon-species component of the aggregate [density at the pedestal
    top](name:density_at_pedestal_top). In contrast, [neon density at the plasma
    boundary](name:neon_density_at_plasma_boundary) describes the same
    charge-state-summed neon population at a different spatial locus.
  unit: m^-3

- name: neon_density_at_plasma_boundary
  description: |-
    Number density of neon ions at the plasma boundary, evaluated locally on the
    last closed magnetic flux surface and summed over all ionization stages.
  documentation: |-
    Number density of neon ions at the plasma boundary is the local particle
    count per physical volume for the neon-ion population evaluated on the last
    closed magnetic flux surface. The population is summed over all ionization
    stages from singly ionized neon, Ne$^+$, through fully stripped neon,
    Ne$^{10+}$.

    The defining zeroth velocity-space moment is

    $$
    n_{\mathrm{Ne}}(\mathbf{x}_b)=\int f_{\mathrm{Ne}}(\mathbf{x}_b,\mathbf{v})\,d^3\mathbf{v}
    $$

    where $n_{\mathrm{Ne}}$ is the neon-ion number density, $\mathbf{x}_b$ is a
    point on the plasma boundary, $\mathbf{v}$ is ion velocity,
    $f_{\mathrm{Ne}}$ is the velocity distribution function aggregated over the
    included neon ion charge states, and $d^3\mathbf{v}$ is the velocity-space
    volume element.

    The plasma boundary is the last closed magnetic flux surface, also called
    the separatrix, separating confined plasma from the open-field-line
    scrape-off layer. This quantity is evaluated locally at that boundary and is
    not averaged over the flux surface. It includes neon ions across all charge
    states from Ne$^+$ through Ne$^{10+}$ and excludes neutral neon and other
    particle species.

    This quantity is the neon-specific specialization of
    [density_at_plasma_boundary](name:density_at_plasma_boundary). It is
    distinct from flux_surface_averaged_neon_density_at_plasma_boundary, which
    applies the same charge-state aggregation to a flux-surface average rather
    than a local boundary value.
  unit: m^-3

- name: neutral_species_density
  description: |-
    Particle number density of a designated neutral species, counting its
    neutral particles per physical volume.
  documentation: |-
    The density of a specified neutral species is the local population of
    neutral particles of that species per physical volume. It is resolved by
    species rather than representing a combined density of different neutral
    species.

    $$
    n_N = \frac{dN_N}{dV}
    $$

    where $n_N$ is the neutral-species number density, $N_N$ is the number of
    neutral particles of the designated species, and $V$ is physical volume.

    The quantity applies only to the neutral form of the designated species;
    ions and other neutral species are excluded. Its aggregation is over neutral
    particles of that one species, without implying a sum over species or a
    particular population subdivision.

    [volume_averaged_neutral_species_density](name:volume_averaged_neutral_species_density)
    is a volume-averaged specialization of this quantity over the plasma volume
    enclosed by the last closed flux surface during plasma initiation.
  unit: m^-3

- name: neutral_state_diamagnetic_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless coefficient scaling the free-streaming bound on diamagnetic
    momentum flux for a specified neutral species and internal state, limiting
    flux magnitude without reversing its direction.
  documentation: |-
    This coefficient scales the collisionless free-streaming bound on the
    diamagnetic component of [momentum](name:momentum) flux carried by a
    specified neutral species in a specified internal state. It controls the
    admissible flux magnitude in a state-resolved fluid transport closure.

    Its cap-setting role is defined by:

    $$
    \Pi_{\max} = \alpha\,\Pi_{\mathrm{fs}}
    $$

    where $\alpha$ is this coefficient, $\Pi_{\max}$ is the maximum admissible
    diamagnetic momentum-flux magnitude, and $\Pi_{\mathrm{fs}}$ is the
    nonnegative collisionless free-streaming reference magnitude for the same
    momentum component and neutral-state population.

    The coefficient applies separately to the selected neutral species and
    internal state; it is neither summed nor averaged over species or states.
    Limiting reduces the flux magnitude without reversing its direction. This
    coefficient is not a momentum diffusivity or a neutral-particle drift
    velocity, and its definition does not prescribe a particular interpolation
    between unrestricted and limited fluxes.

    It is the neutral-state-resolved specialization of the [diamagnetic momentum
    flux limiter
    coefficient](name:diamagnetic_momentum_flux_limiter_coefficient), within the
    broader [momentum flux limiter
    coefficient](name:momentum_flux_limiter_coefficient) family. Unlike the
    [neutral-state particle flux limiter
    coefficient](name:neutral_state_particle_flux_limiter_coefficient), it
    bounds momentum transport rather than particle-number transport.
  unit: '1'

- name: nitrogen_density_at_pedestal_top
  description: |-
    Local number density of nitrogen ions at the H-mode pedestal top, summed
    over all ionization states and excluding neutral nitrogen.
  documentation: |-
    Nitrogen ion number density at the H-mode pedestal top is the local number
    of nitrogen ions per physical volume, with all ionic charge states
    aggregated.

    The charge-state sum is defined by

    $$
    n_{\mathrm{N}} = \sum_{q=1}^{7} n_{\mathrm{N}^{q+}}
    $$

    where $n_{\mathrm{N}}$ is the total nitrogen-ion number density,
    $n_{\mathrm{N}^{q+}}$ is the number density of nitrogen ions in charge state
    $q$, and $q$ is the positive integer ionic charge state from singly ionized
    through fully stripped nitrogen.

    This quantity applies locally at the inner shoulder of the H-mode edge
    pedestal, whose position is defined by the [normalized poloidal flux
    coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over nitrogen ion charge states and excludes neutral nitrogen; it is
    not a charge-state-resolved density or a flux-surface average.

    The locus distinguishes this quantity from [nitrogen density at the plasma
    boundary](name:nitrogen_density_at_plasma_boundary), which represents the
    same charge-state-summed nitrogen-ion density at the plasma boundary rather
    than at the pedestal top.
  unit: m^-3

- name: nitrogen_density_at_plasma_boundary
  description: |-
    Number density of nitrogen ions at the plasma boundary, evaluated as the
    local, intensive particle count per physical volume on the last closed
    magnetic flux surface.
  documentation: |-
    Number density of nitrogen ions at the plasma boundary is the local,
    intensive particle count per physical volume for the nitrogen ion population
    evaluated on the last closed magnetic flux surface. The plasma boundary is
    the limiting closed magnetic flux surface separating confined plasma from
    the open-field-line scrape-off-layer region.

    The local nitrogen ion number density at a boundary point is the zeroth
    velocity moment summed over ionic charge states:

    $$
    n_N(\mathbf{x}_b,t) = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3v
    $$

    where $n_N$ is the nitrogen ion number density, $\mathbf{x}_b$ is a point on
    the last closed magnetic flux surface, $t$ is time, $q$ is the positive
    integer ionic charge state, $N^{q+}$ is a nitrogen ion with charge state
    $q$, $\mathbf{v}$ is ion velocity, $f_{N^{q+}}$ is the phase-space
    distribution function for that charge state, and $d^3v$ is the
    velocity-space volume element.

    This quantity applies specifically to nitrogen ions and is summed over
    charge states from singly ionized nitrogen through fully stripped nitrogen.
    It excludes neutral nitrogen and electron density, and it is a local
    boundary value with no averaging over the boundary surface or over a volume.

    It is the nitrogen-specific instance of
    [density_at_plasma_boundary](name:density_at_plasma_boundary). The related
    flux_surface_averaged_nitrogen_density_at_plasma_boundary instead averages
    the same charge-state-summed nitrogen ion density over the last closed
    magnetic flux surface.
  unit: m^-3

- name: flux_surface_averaged_nitrogen_density_at_plasma_boundary
  description: |-
    Number density of nitrogen ions averaged over the last closed magnetic flux
    surface bounding the confined plasma, summed over all ion charge states and
    excluding neutral nitrogen.
  documentation: |-
    Number density of nitrogen

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{N}}\rangle = \oint n_{\mathrm{N}}\,dS/|\nabla\psi| \, /\, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{N}}\rangle$ is the averaged nitrogen-ion number
    density, $n_{\mathrm{N}}$ is the local nitrogen-ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is
    poloidal magnetic flux. The quantity $|\nabla\psi|$ is the magnitude of the
    poloidal magnetic-flux gradient, and the closed-integral symbols denote
    integration over the complete surface.

    This quantity is summed over all nitrogen ion charge states and excludes
    neutral nitrogen. It is a flux-surface average rather than the local value
    given by [nitrogen ion density at the plasma
    boundary](name:nitrogen_density_at_plasma_boundary), and it is not a volume
    or line average. It follows the same species-specific family pattern as
    [flux-surface-averaged neon density at the plasma
    boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary), with
    nitrogen replacing neon.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: oxygen_density_at_pedestal_top
  description: |-
    Local number density of oxygen ions at the H-mode pedestal top, summed over
    all positively charged ionization states.
  documentation: |-
    The oxygen ion number density is the local population density of oxygen ions
    at the H-mode pedestal top, the core-side shoulder of the edge transport
    barrier. The location is identified by the [normalized poloidal flux
    coordinate at the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).

    The defining charge-state aggregation is

    $$
    n_{\mathrm{O}} = \sum_{q>0} n_{\mathrm{O}^{q+}}
    $$

    where $n_{\mathrm{O}}$ is the total oxygen ion number density, $q$ is the
    positive integer charge-state index, and $n_{\mathrm{O}^{q+}}$ is the number
    density of oxygen ions in charge state $q$.

    This quantity is specific to oxygen and is evaluated locally at the pedestal
    top. It includes all positively charged oxygen states, from singly charged
    through fully stripped oxygen, and excludes neutral oxygen and ions of other
    species. It is distinct from the [oxygen ion density at the plasma
    boundary](name:oxygen_density_at_plasma_boundary), which applies the same
    charge-state aggregation at the plasma boundary rather than at the pedestal
    top.
  unit: m^-3

- name: parallel_electric_field_at_plasma_boundary
  description: |-
    Signed projection of the local electric field along the local magnetic-field
    direction, evaluated at the last closed flux surface.
  documentation: |-
    The parallel electric field at the plasma boundary is the signed projection
    of the local [electric field](name:electric_field) vector onto the local
    magnetic-field direction at the last closed flux surface. It is a
    point-local boundary value, distinct from the parallel flux-surface-averaged
    electric field.

    The defining projection is

    $$
    E_\parallel = \mathbf{E} \cdot \hat{\mathbf{b}} = \mathbf{E} \cdot \frac{\mathbf{B}}{|\mathbf{B}|}
    $$

    where $E_\parallel$ and $\mathbf{E}$ are the parallel component and
    electric-field vector in V m$^{-1}$, $\mathbf{B}$ is the local
    magnetic-field vector, and $\hat{\mathbf{b}}$ is its unit vector. All
    quantities are evaluated at the same boundary location.

    The plasma boundary is the separatrix or last closed flux surface; no
    flux-surface or regional averaging is implied.

    Sign convention: Positive when the electric field has a component in the
    direction of the local magnetic field.
  unit: V.m^-1

- name: parallel_electric_field_at_separatrix
  description: |-
    Parallel electric field at the separatrix is the electric field projected
    along the local magnetic field on the separatrix. It fixes the field-aligned
    projection and separatrix locus, while more specific names may add an
    aggregation over that locus.
  documentation: |-
    Parallel electric field at the separatrix is the component of the
    electric-field vector along the local magnetic-field direction evaluated on
    the separatrix. The separatrix is the magnetic flux surface that separates
    the closed-field-line region from the open-field-line edge region.

    The field-aligned component at a separatrix point is defined by the
    projection:

    $$
    E_\parallel(\mathbf{x}) = \mathbf{E}(\mathbf{x}) \cdot \hat{\mathbf{b}}(\mathbf{x}), \qquad \mathbf{x}\in S
    $$

    where $\mathbf{x}$ is a spatial point on the separatrix $S$, $\mathbf{E}$ is
    the electric-field vector, $\hat{\mathbf{b}}$ is the unit vector in the
    direction of the local magnetic-field vector $\mathbf{B}$, and $E_\parallel$
    is the resulting parallel electric field.

    The scope is limited to the separatrix locus and to the component along
    $\hat{\mathbf{b}}$; it is not the electric-field magnitude, a component
    perpendicular to the magnetic-field direction, or a flux-surface-normal
    projection. This parent quantity does not by itself fix a spatial
    aggregation over the separatrix; an aggregation qualifier belongs to a more
    specific quantity.

    The [flux-surface averaged parallel electric field at the
    separatrix](name:flux_surface_averaged_parallel_electric_field_at_plasma_boundary)
    is the flux-surface average of this same $E_\parallel$ over $S$; it differs
    only by specifying the aggregation, while the parallel projection and
    separatrix evaluation are already part of the present quantity.

    Sign convention: Positive when the electric-field vector has a component in
    the direction of the local magnetic-field vector at the separatrix.
  unit: V.m^-1

- name: parallel_fluctuating_ion_current_density
  description: |-
    Temporal standard deviation of the total ion charge-current density after
    projection onto the local magnetic-field direction at a plasma-facing probe.
  documentation: |-
    This quantity is the temporal standard deviation of the total ion-carried
    charge-current density after projection onto the local magnetic-field
    direction at the specified plasma-facing probe. Ion contributions from all
    included species and charge states are summed with their signed charge
    weighting before the fluctuation statistic is evaluated. It is the parallel
    specialization of [fluctuating ion current
    density](name:fluctuating_ion_current_density).

    With $t$ denoting time in seconds, the defining relation is:

    $$
    \sigma_{j_i,\parallel}=\left\langle\left[j_{i,\parallel}(t)-\left\langle j_{i,\parallel}\right\rangle_t\right]^2\right\rangle_t^{1/2},\qquad j_{i,\parallel}(t)=\mathbf{j}_i(t)\cdot\hat{\mathbf b}(t),\qquad \hat{\mathbf b}(t)=\frac{\mathbf{B}(t)}{|\mathbf{B}(t)|}
    $$

    Here $\mathbf{j}_i$ is the aggregated ion current-density vector in A
    m$^{-2}$, $\hat{\mathbf b}$ is the unit vector along the local magnetic
    field, $\mathbf{B}$ is the local magnetic field in tesla, and
    $\langle\cdot\rangle_t$ denotes the temporal average.

    The aggregation and projection precede the standard-deviation operation;
    this is not a sum of separately calculated species fluctuations. Unlike
    [fluctuating saturated ion current
    density](name:fluctuating_saturated_ion_current_density), it represents the
    total ion current rather than only the ion-saturation current component. The
    result is nonnegative even when the underlying parallel current changes
    sign.
  unit: A.m^-2

- name: parallel_ion_charge_state_momentum_diffusion_coefficient
  description: |-
    Kinematic diffusion coefficient governing down-gradient transport along the
    magnetic field of flow momentum carried by ions of one species in a
    specified charge state.
  documentation: |-
    Parallel ion charge-state momentum diffusivity is the kinematic diffusion
    coefficient for down-gradient transport of flow momentum carried by ions of
    one species in a specified charge state. Parallel identifies the transport
    direction along the local magnetic field, not necessarily the direction of
    the transported momentum component.

    For a local Fickian description, the parallel diffusive flux of the
    represented momentum density is:

    $$
    \Gamma^{\mathrm{diff}}_{s,\parallel} = -D_{s,\parallel}\nabla_{\parallel} M_s
    $$

    Here, $\Gamma^{\mathrm{diff}}_{s,\parallel}$ is the diffusive flux of that
    momentum density along the magnetic field, $D_{s,\parallel}$ is this
    coefficient, and $M_s$ is the flow-momentum density carried by ion species
    and charge state $s$. The index $s$ identifies that species and charge
    state. The parallel gradient is $\nabla_{\parallel}=\hat{\mathbf
    b}\cdot\nabla$, where $\hat{\mathbf b}$ is the unit vector along the local
    magnetic field and $\nabla$ is the spatial gradient operator. The minus sign
    means the diffusive flux is directed down the field-parallel gradient.

    The coefficient is resolved for one ion species and one specified charge
    state; it is not summed or averaged over species or charge states. It
    describes diffusive transport only, not convective transport or total
    momentum flux. It is the parallel directional component of the
    charge-state-resolved [ion charge-state momentum
    diffusivity](name:ion_charge_state_momentum_diffusivity), and is distinct
    from the [radial ion charge-state momentum diffusion
    coefficient](name:radial_ion_charge_state_momentum_diffusion_coefficient),
    whose transport direction is cylindrical $\hat R$ in the right-handed
    cylindrical $(\hat R,\hat\phi,\hat Z)$ basis. Here, $\hat R$, $\hat\phi$,
    and $\hat Z$ are the basis directions; $R$ is major radius from the machine
    symmetry axis, $\phi$ is toroidal angle increasing counterclockwise when
    viewed from above, and $Z$ is vertical height.
  unit: m^2.s^-1

- name: parallel_ion_heat_convection_velocity
  description: |-
    Signed field-aligned effective velocity whose product with neutral energy
    density gives the convective neutral-energy flux in the edge plasma.
  documentation: |-
    Parallel neutral-energy convection velocity is the effective coefficient of
    the energy-density-proportional advective flux of neutral energy in the edge
    plasma. It describes directed energy transport after gradient-driven
    transport has been separated.

    The parallel convective energy flux is defined by

    $$
    F_{n,\parallel}^{\mathrm{conv}} = U_n v_{n,\parallel}^{E}
    $$

    where $F_{n,\parallel}^{\mathrm{conv}}$ is the field-parallel neutral-energy
    flux due to convection, $U_n$ is the energy density of the selected neutral
    population, and $v_{n,\parallel}^{E}$ is this effective convection velocity.

    The quantity is the local magnetic-field-aligned projection,
    $v_{n,\parallel}^{E}=\mathbf{v}_n^{E}\cdot\hat{\mathbf{b}}$, where
    $\mathbf{v}_n^{E}$ is the neutral-energy convection velocity vector and
    $\hat{\mathbf{b}}$ is the unit vector along the local nonzero magnetic
    field. It applies to the selected neutral population, not to a sum of
    particle-, heat-, and momentum-channel velocities.

    It excludes conductive or diffusive energy flux and need not equal the
    neutral bulk-flow velocity. The [radial neutral-energy convection
    velocity](name:radial_neutral_energy_convection_velocity) describes the
    corresponding major-radius projection rather than the field-parallel
    projection. This neutral-energy coefficient is distinct from [ion heat
    convection velocity](name:ion_heat_convection_velocity), which acts on ion
    thermal energy.

    Sign convention: Positive when neutral-energy convection is directed along
    the local magnetic field.
  unit: m.s^-1

- name: parallel_mach_number
  description: |-
    Signed ratio of the plasma flow component along the local magnetic-field
    direction to the local plasma sound speed.
  documentation: |-
    The parallel Mach number is the signed field-aligned flow speed normalized
    by the local sound speed. It is the parallel component of the [Mach-number
    vector](name:mach_number), rather than the magnitude of the full flow Mach
    number.

    $$
    M_\parallel = \frac{v_\parallel}{c_s}, \qquad v_\parallel = \mathbf{v} \cdot \mathbf{b}
    $$

    where $M_\parallel$ is the parallel Mach number, $\mathbf{v}$ is the plasma
    flow velocity, $\mathbf{b}$ is the unit vector in the local magnetic-field
    direction, $v_\parallel$ is the field-aligned flow component, and $c_s$ is
    the local plasma sound speed. The quantity excludes perpendicular flow
    contributions and is distinct from the magnitude of the full Mach-number
    vector.
  unit: '1'

- name: parallel_neutral_internal_state_momentum_flux_limiter_coefficient
  description: |-
    Parallel flux-limiter coefficient that sets a nonnegative cap on the
    field-aligned neutral-particle momentum-flux density for a specified
    internal state as a fraction of its collisionless free-streaming bound,
    without reversing the signed component.
  documentation: |-
    Parallel flux-limiter coefficient that applies to neutral particles
    occupying a specified internal state is the directional coefficient used to
    bound the component of the corresponding neutral internal-state
    momentum-flux density parallel to the magnetic field. The internal state may
    be an electronic, vibrational, rotational, or other resolved excitation
    state, and this scalar coefficient applies to the field-aligned projection
    rather than to the poloidal or toroidal projection.

    For the parallel component, the limiter defines the admissible cap:

    $$
    |\Pi_{\mathrm{lim},\parallel}| \le \lambda_{\parallel}\,|\Pi_{\mathrm{fs},\parallel}|,\qquad 0 \le \lambda_{\parallel} \le 1
    $$

    where $\Pi_{\mathrm{lim},\parallel}$ is the limited component of the neutral
    internal-state momentum-flux density parallel to the magnetic field,
    $\Pi_{\mathrm{fs},\parallel}$ is the corresponding collisionless
    free-streaming component whose magnitude defines the bound, and
    $\lambda_{\parallel}$ is this coefficient.

    The inequality is a cap on magnitude rather than an equality for the
    realized momentum-flux density. Because $\lambda_{\parallel}$ is
    nonnegative, applying the limiter may reduce or bound a signed parallel
    momentum-flux component but does not reverse its direction; a nonzero
    limited component retains the sign of the underlying field-aligned component
    to which the cap is applied. This scalar coefficient is the field-aligned
    member of the [neutral internal-state momentum-flux limiter coefficient over
    the edge
    region](name:neutral_internal_state_momentum_flux_limiter_coefficient_over_edge_region)
    and is distinct from the
    [poloidal](name:poloidal_momentum_neutral_internal_state_flux_limiter_coefficient)
    and
    [toroidal](name:toroidal_neutral_internal_state_momentum_flux_limiter_coefficient)
    directional members.
  unit: '1'

- name: parallel_neutral_state_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless parallel flux-limiter coefficient that scales the
    free-streaming bound on the parallel momentum-flux-density magnitude,
    projected along the local magnetic-field unit vector, for a specified
    neutral particle state in edge-plasma transport closures.
  documentation: |-
    The parallel neutral-state momentum coefficient is a dimensionless
    flux-limiter factor assigned to a specified neutral particle state in
    edge-plasma transport closures. It scales the free-streaming bound on the
    magnitude of the parallel component of neutral momentum-flux density, with
    the projection taken along the local magnetic-field unit vector $\hat{b} =
    \mathbf{B}/|\mathbf{B}|$.

    The cap set by the parallel coefficient is:

    $$
    \Pi_{\parallel}^{\rm lim} = c_{\parallel}\,\Pi_{\parallel}^{\rm FS}
    $$

    where $\Pi_{\parallel}^{\rm lim}$ is the nonnegative limiter bound on the
    magnitude of the modeled parallel neutral-state momentum-flux density,
    $\Pi_{\parallel}^{\rm FS}$ is the nonnegative free-streaming bound for the
    same field-aligned projection, and $c_{\parallel}$ is this coefficient. The
    signed projected flux satisfies $|\Pi_{\parallel}| \le \Pi_{\parallel}^{\rm
    lim}$; when flux limiting is active, $c_{\parallel}$ is bounded in $[0, 1]$.

    This quantity is the parallel projection component of the vector
    [neutral-state momentum flux-limiter
    coefficient](name:neutral_internal_state_momentum_flux_limiter_coefficient_over_edge_region);
    relative to that vector quantity, the specialization is the field-aligned
    projection, not a different species or state aggregation. The coefficient
    itself is a nonnegative cap and carries no directional sign, so it limits
    the magnitude of the parallel momentum-flux-density component without
    reversing the signed component. It differs from the
    [radial](name:radial_neutral_state_momentum_flux_limiter_coefficient),
    [toroidal](name:toroidal_neutral_internal_state_momentum_flux_limiter_coefficient),
    and
    [vertical](name:vertical_neutral_state_momentum_flux_limiter_coefficient)
    coefficients, which use $\hat{R}$, $\hat{\phi}$, and $\hat{Z}$ projections
    in the right-handed cylindrical $(R, \phi, Z)$ frame, and from the
    [poloidal](name:poloidal_neutral_state_momentum_flux_limiter_coefficient)
    coefficient, which uses the poloidal projection.
  unit: '1'

- name: parallel_total_ion_energy_diffusion_coefficient
  description: |-
    Parallel diffusion coefficient for total ion energy transport is the
    effective scalar diffusivity in a Fickian flux-gradient closure along the
    magnetic-field direction, with total ion energy summed over all ion species
    and charge states.
  documentation: |-
    Parallel diffusion coefficient for total ion energy transport is the
    effective scalar diffusivity that multiplies the parallel gradient of total
    ion energy density in a Fickian closure. It is the parallel component of the
    [total ion energy diffusion
    coefficient](name:total_ion_energy_diffusion_coefficient), where total ion
    energy is summed over all ion species and charge states.

    A local diffusive closure for the parallel total-ion-energy flux is

    $$
    q^{\mathrm{diff}}_{i,\parallel} = -D^{E_i}_{\parallel}\,\nabla_{\parallel} W^{\mathrm{tot}}_i
    $$

    where $q^{\mathrm{diff}}_{i,\parallel}$ is the diffusive flux of total ion
    energy along the magnetic-field direction, $D^{E_i}_{\parallel}$ is this
    coefficient, $\nabla_{\parallel} = \hat{b}\cdot\nabla$ is the derivative
    along the magnetic-field unit vector $\hat{b}$, and $W^{\mathrm{tot}}_i$ is
    the total ion energy density summed over all ion species and charge states.

    This coefficient represents only the diffusive parallel contribution;
    advective, convective, source, sink, and cross-field transport terms are
    outside its definition. It is directionally distinct from the [poloidal
    total ion energy diffusion
    coefficient](name:poloidal_total_ion_energy_diffusion_coefficient).

    Sign convention: Positive when the diffusive total-ion-energy flux is
    directed down the parallel gradient of total ion energy density.
  unit: m^2.s^-1

- name: particle_diffusivity
  description: |-
    Effective Fickian transport coefficient relating particle flux to
    particle-number-density gradients, with directional or population-specific
    components represented by more specific quantities.
  documentation: |-
    Particle diffusivity is an effective Fickian coefficient describing the
    diffusive part of particle transport driven by a particle-number-density
    gradient. It may be resolved by transport direction or by the particle
    population being transported.

    For each resolved direction $i$, the diffusive particle flux is defined by

    $$
    \Gamma_{p,i}^{\mathrm{diff}} = -D_{p,i}\,\frac{\partial n_p}{\partial x_i}
    $$

    where $\Gamma_{p,i}^{\mathrm{diff}}$ is the diffusive particle flux,
    $D_{p,i}$ is the corresponding diffusivity component, $n_p$ is the particle
    number density, and $x_i$ is the coordinate along the resolved transport
    direction. The minus sign defines down-gradient diffusive transport for a
    positive coefficient.

    This parent quantity does not specify a particle population, charge-state
    aggregation, transport direction, or microscopic mechanism. Population- and
    direction-specific instances include [neutral particle
    diffusivity](name:neutral_particle_diffusivity) and poloidal particle
    diffusivity.
  unit: m^2.s^-1

- name: neutral_species_particle_diffusivity
  description: |-
    Effective Fickian transport coefficient relating neutral-species particle
    flux to neutral-species number-density gradients, with directional
    components represented by more specific quantities.
  documentation: |-
    Neutral-species particle diffusivity is the effective transport coefficient
    for particle spreading driven by a neutral-species number-density gradient.
    It is the neutral-species specialization of [particle
    diffusivity](name:particle_diffusivity), with directional components
    represented by more specific quantities.

    For each resolved direction $i$, the diffusive particle flux of neutral
    species $s$ is defined by

    $$
    \Gamma_{\mathrm{n},s,i}^{\mathrm{diff}} = -D_{\mathrm{n},s,i}\,\frac{\partial n_{\mathrm{n},s}}{\partial x_i}
    $$

    where $\Gamma_{\mathrm{n},s,i}^{\mathrm{diff}}$ is the diffusive particle
    flux of neutral species $s$ along direction $i$, $D_{\mathrm{n},s,i}$ is the
    corresponding neutral-species particle diffusivity component,
    $n_{\mathrm{n},s}$ is the number density of neutral species $s$, and $x_i$
    is the coordinate along the resolved transport direction. The minus sign
    defines down-gradient diffusive transport for a positive coefficient.

    This quantity selects the neutral-species population but does not select a
    transport direction, neutral state, or microscopic mechanism.
    Direction-specific instances include [parallel neutral-species particle
    diffusivity](name:parallel_neutral_species_particle_diffusivity). When a
    neutral species is decomposed into neutral states, the species-level
    diffusivity is the density-weighted mean over those states; the
    state-resolved counterpart is [neutral-state particle
    diffusivity](name:neutral_state_particle_diffusivity).
  unit: m^2.s^-1

- name: neutral_state_particle_diffusivity
  description: |-
    Effective Fickian transport coefficient relating neutral-state particle flux
    to neutral-state number-density gradients, with directional components
    represented by more specific quantities.
  documentation: |-
    Neutral-state particle diffusivity is the effective transport coefficient
    for particle spreading driven by a neutral-state number-density gradient. It
    is the neutral-charge-state specialization of [particle
    diffusivity](name:particle_diffusivity), with directional components
    represented by more specific quantities.

    For each resolved direction $i$, the diffusive particle flux of neutral
    state $\alpha$ is defined by

    $$
    \Gamma_{\alpha,i}^{\mathrm{diff}} = -D_{\alpha,i}\,\frac{\partial n_\alpha}{\partial x_i}
    $$

    where $\Gamma_{\alpha,i}^{\mathrm{diff}}$ is the diffusive particle flux of
    neutral state $\alpha$ along resolved transport direction $i$,
    $D_{\alpha,i}$ is the corresponding neutral-state particle diffusivity
    component, $n_\alpha$ is the number density of that neutral state, and $x_i$
    is the coordinate along the resolved transport direction. The minus sign
    defines down-gradient diffusive transport for a positive coefficient.

    This parent quantity selects a specified neutral state and does not
    aggregate over different neutral states, but it does not specify a transport
    direction or microscopic mechanism. Direction-specific instances include
    [poloidal neutral-state particle
    diffusivity](name:poloidal_neutral_state_particle_diffusivity).
  unit: m^2.s^-1

- name: parallel_neutral_species_particle_diffusivity
  description: |-
    Effective particle diffusivity for an ion species along the magnetic field,
    relating its diffusive particle flux to its parallel number-density
    gradient.
  documentation: |-
    Effective parallel particle diffusivity for an ion species is the
    directional transport coefficient that represents ion-particle spreading
    driven by that species' number-density gradient. It is the field-parallel
    specialization of [ion particle diffusivity](name:ion_particle_diffusivity),
    with transport resolved along the magnetic field.

    For the field-parallel direction, the diffusive ion-particle flux is defined
    by

    $$
    \Gamma_{\parallel,i}^{\mathrm{diff}} = -D_{\parallel,i}\frac{\partial n_i}{\partial s_{\parallel}}
    $$

    where $i$ identifies the selected ion species,
    $\Gamma_{\parallel,i}^{\mathrm{diff}}$ is its parallel diffusive particle
    flux, $D_{\parallel,i}$ is its parallel particle diffusivity, $n_i$ is its
    ion number density, and $s_{\parallel}$ is physical arclength along the
    magnetic-field direction. The minus sign specifies down-gradient transport
    for positive diffusivity.

    The density and diffusive flux are summed over all ionic charge states of
    the selected species, excluding neutral particles. This ion-species scope
    differs from [neutral-species particle
    diffusivity](name:neutral_species_particle_diffusivity) and its
    field-parallel counterpart, [parallel neutral particle
    diffusivity](name:parallel_neutral_particle_diffusivity). The coefficient
    describes particle diffusion only; it excludes convective particle flux and
    is distinct from energy and momentum diffusion coefficients.
  unit: m^2.s^-1

- name: poloidal_electron_beta_at_pedestal_top_high_field_side
  description: |-
    Poloidal electron beta at the high-field-side pedestal top is the ratio of
    local electron thermal pressure to magnetic pressure based on the local
    poloidal magnetic-field magnitude.
  documentation: |-
    Poloidal electron beta at the high-field-side pedestal top compares local
    electron thermal pressure with the magnetic-pressure scale associated with
    the local poloidal magnetic-field magnitude. It is an electron-pressure
    specialization of [plasma beta](name:beta) with a poloidal-field reference.

    The defining local pressure ratio is

    $$\beta = \frac{2\mu_0 \langle p\rangle}{B^2}$$

    where $\beta_{e,\mathrm{p,HFS}}$ denotes this poloidal electron beta,
    $p_{e,\mathrm{ped,HFS}}$ is the local electron thermal pressure at the
    high-field-side pedestal top, $B_{\mathrm{p,ped,HFS}}$ is the poloidal
    magnetic-field magnitude at the same point, and $\mu_0$ is the vacuum
    permeability.

    Both inputs are point-local; neither flux-surface nor volume averaging is
    applied. The numerator excludes ion pressure, and the magnetic-pressure
    scale uses the poloidal field rather than the total magnetic-field
    magnitude. The ratio is defined only for nonzero poloidal magnetic-field
    magnitude.

    It differs from [poloidal electron beta at the low-field-side pedestal
    top](name:poloidal_electron_beta_at_pedestal_top_low_field_side) by its
    evaluation locus. It also differs from [poloidal flux-surface-averaged
    electron beta at the pedestal
    top](name:poloidal_electron_beta_flux_surface_averaged_at_pedestal_top),
    which uses flux-surface-averaged pressure and field rather than point-local
    inputs, and from [poloidal beta](name:poloidal_beta), which uses a
    whole-plasma total-pressure convention.
  unit: '1'

- name: poloidal_electron_beta_at_pedestal_top_low_field_side
  description: |-
    Poloidal electron beta at the low-field-side pedestal top is the
    dimensionless ratio of local electron thermal pressure to the local magnetic
    pressure computed from the poloidal magnetic-field magnitude at the fitted
    core-side shoulder of the H-mode edge transport barrier. Both quantities are
    evaluated at the outboard, low-field-side point.
  documentation: |-
    Poloidal electron beta at the low-field-side pedestal top is the ratio of
    local electron thermal pressure to the magnetic pressure computed from the
    local poloidal magnetic-field magnitude at the fitted core-side shoulder of
    the H-mode edge transport barrier. The low-field-side locus is the
    outboard-midplane point, equivalently the largest-major-radius point on that
    pedestal-top flux surface in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    The quantity is defined by the local pressure-to-field-pressure ratio at
    that point:

    $$
    \beta_{e,\mathrm{pol,LFS}} = \frac{p_{e,\mathrm{ped,LFS}}}{B_{\mathrm{pol,ped,LFS}}^2/(2\mu_0)} = \frac{2\mu_0 p_{e,\mathrm{ped,LFS}}}{B_{\mathrm{pol,ped,LFS}}^2}
    $$

    where $p_{e,\mathrm{ped,LFS}}$ is the local electron pressure at the
    low-field-side point of the pedestal-top surface, $B_{\mathrm{pol,ped,LFS}}$
    is the local poloidal magnetic-field magnitude at the same point, and
    $\mu_0$ is the vacuum permeability.

    This is a point-local low-field-side beta: both the electron pressure and
    the poloidal magnetic-field magnitude are evaluated at the same
    low-field-side pedestal-top point. It differs from poloidal
    flux-surface-averaged electron beta at the pedestal top, which uses
    flux-surface averaging, from [poloidal electron beta at the high-field-side
    pedestal top](name:poloidal_electron_beta_at_pedestal_top_high_field_side),
    which uses the corresponding inboard point, and from [poloidal
    beta](name:poloidal_beta), which uses a global plasma-pressure convention
    rather than the local pedestal-top electron pressure.
  unit: '1'

- name: poloidal_electron_diffusivity
  description: |-
    Directional electron particle diffusion coefficient linking the poloidal
    diffusive electron flux to the electron density gradient in a magnetized
    plasma.
  documentation: |-
    Poloidal electron diffusivity is an effective scalar transport coefficient
    for diffusive electron-particle transport along the poloidal direction of
    flux coordinates $(\rho,\theta,\phi)$.

    The constitutive relation is

    $$
    \Gamma_{e,\theta}^{\mathrm{diff}} = -D_{e,\theta}\,\nabla_\theta n_e
    $$

    where $\Gamma_{e,\theta}^{\mathrm{diff}}$ is the poloidal component of the
    diffusive electron particle-flux vector, $D_{e,\theta}$ is the poloidal
    electron diffusivity, $\nabla_\theta n_e$ is the metric-scaled
    electron-density gradient along increasing poloidal angle $\theta$, and
    $n_e$ is electron number density. The associated flux component is positive
    toward increasing $\theta$.

    This is the poloidal projection of the anisotropic transport represented by
    electron diffusivity. It describes diffusive transport only and excludes
    convective fluxes, particle sources, and sinks; poloidal particle
    diffusivity is the corresponding species-independent quantity.
  unit: m^2.s^-1

- name: poloidal_ion_charge_state_energy_diffusivity
  description: |-
    Poloidal ion charge-state energy diffusivity is the poloidal Fickian
    diffusivity for thermal-energy transport of a specified ion charge state in
    flux coordinates (ρ, θ, φ), defined so the diffusive energy flux along
    increasing poloidal angle θ at fixed radial flux label ρ and toroidal angle
    φ is proportional to and opposite the corresponding gradient of that state's
    thermal-energy density.
  documentation: |-
    Poloidal ion charge-state energy diffusivity is the effective transport
    coefficient for local diffusive smoothing of the thermal-energy density of
    one specified ion charge state along the poloidal direction in flux
    coordinates $(\rho, \theta, \phi)$. It represents the Fickian part of that
    charge state's thermal-energy transport along the poloidal coordinate
    direction, distinct from convective transport and explicit energy sources,
    and is the poloidal component of ion charge-state energy diffusivity.

    The defining closure for the poloidal component is

    $$
    \mathbf{q}_{E,z}\cdot\hat{e}_{\mathrm{pol}} = -\chi_{E,z}^{\mathrm{pol}}\,\hat{e}_{\mathrm{pol}}\cdot\nabla w_z
    $$

    where $\mathbf{q}_{E,z}$ is the diffusive thermal-energy flux density of ion
    charge state $z$, $\hat{e}_{\mathrm{pol}}$ is the local unit tangent
    generated by increasing poloidal angle $\theta$ at fixed radial flux label
    $\rho$ and fixed toroidal angle $\phi$ in flux coordinates $(\rho, \theta,
    \phi)$, $\chi_{E,z}^{\mathrm{pol}}$ is the poloidal ion charge-state energy
    diffusivity, $w_z$ is the thermal-energy density of that charge state, and
    $\hat{e}_{\mathrm{pol}}\cdot\nabla w_z$ is the corresponding poloidal
    gradient. The minus sign specifies down-gradient transport.

    This quantity applies to one specified ion charge state and is not summed
    over ion species or charge states, unlike [poloidal ion energy
    diffusivity](name:poloidal_ion_energy_diffusivity). The field-aligned
    directional counterpart is [parallel ion charge-state energy
    diffusivity](name:parallel_ion_charge_state_energy_diffusivity). A
    temperature-gradient form is equivalent only when the relevant density and
    heat-capacity factors are explicitly included in the coefficient.
  unit: m^2.s^-1

- name: poloidal_ion_momentum_diffusivity
  description: |-
    Effective kinematic coefficient governing diffusive redistribution of an ion
    species’ poloidal bulk-flow momentum, with all ionic charge states included.
  documentation: |-
    Poloidal ion momentum diffusivity is the effective kinematic transport
    coefficient governing diffusive redistribution of the poloidal component of
    ion bulk-flow [momentum](name:momentum). The poloidal direction is tangent
    to a magnetic flux surface within a constant-toroidal-angle plane in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    In a local, one-direction viscous closure, the diffusive flux of poloidal
    momentum is:

    $$
    \Pi_{i,\mathrm{p}}^{\mathrm{diff}} = -\varrho_i\chi_{i,\mathrm{p}}\frac{\partial u_{i,\mathrm{p}}}{\partial \ell}
    $$

    where $i$ identifies the selected ion species, $\mathrm{p}$ denotes its
    poloidal momentum component, $\Pi_{i,\mathrm{p}}^{\mathrm{diff}}$ is the
    diffusive flux of that component along the transport direction, $\varrho_i$
    is the species mass density summed over all ionic charge states,
    $\chi_{i,\mathrm{p}}$ is this diffusivity, $u_{i,\mathrm{p}}$ is the
    density-weighted mean poloidal velocity over all ionic charge states, and
    $\ell$ is physical distance along the transport direction.

    The poloidal qualifier selects the transported momentum component; it does
    not require the transport direction to follow a poloidal arc. This kinematic
    closure acts on the poloidal velocity gradient rather than the gradient of
    total momentum density. It excludes convective momentum transport, residual
    stress, and external momentum sources.

    This quantity specializes [momentum diffusivity](name:momentum_diffusivity)
    to the poloidal momentum of one ion species, without summing over different
    ion species or including electrons or neutrals. It is a species-level
    effective coefficient, not a sum of charge-state diffusivities; [poloidal
    ion charge-state momentum diffusivity] instead applies to ions in one
    specified ionization state.
  unit: m^2.s^-1

- name: poloidal_ion_state_particle_convection_velocity
  description: |-
    Effective poloidal convection velocity for ion charge-state particle
    transport, representing the signed pinch contribution rather than the ion
    bulk flow.
  documentation: |-
    Effective poloidal convection velocity for ion charge-state particle
    transport is the coefficient of the convective, or pinch, contribution to
    transport of the particle density of a specified ion charge state. It is
    distinct from the poloidal component of the ion bulk velocity.

    The associated poloidal convective particle flux is defined by

    $$
    \Gamma_{\mathrm{pol,conv}} = n\,v_{\mathrm{pol}}
    $$

    where $\Gamma_{\mathrm{pol,conv}}$ is the poloidal component of convective
    particle flux, $n$ is the particle density of the specified ion charge
    state, and $v_{\mathrm{pol}}$ is the poloidal component of
    ion_state_particle_convection_velocity. The projection is taken in the local
    poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame, with
    the poloidal direction defined by increasing poloidal angle. The
    corresponding radial coefficient is
    [radial_ion_state_particle_convection_velocity](name:radial_ion_state_particle_convection_velocity),
    while
    [poloidal_neutral_state_particle_convection_velocity](name:poloidal_neutral_state_particle_convection_velocity)
    applies the same transport concept to neutral particles.
  unit: m.s^-1

- name: poloidal_magnetic_flux_at_pedestal_top
  description: |-
    Poloidal magnetic flux at the pedestal top is the signed value of the
    poloidal magnetic flux function on the H-mode pedestal-top flux surface.
  documentation: |-
    Poloidal magnetic flux at the pedestal top is the signed value of the
    poloidal magnetic flux function on the H-mode pedestal-top flux surface. The
    pedestal top is the core-side top of the steep edge pedestal and may be
    identified by the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).

    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, the value can
    be represented as the flux through a horizontal disk bounded by a point on
    that flux surface:

    $$
    \psi_\mathrm{ped} = \int_0^{R_\mathrm{ped}} B_Z(R', Z_\mathrm{ped})\,2\pi R'\,dR'
    $$

    where $\psi_\mathrm{ped}$ denotes this quantity, $(R_\mathrm{ped},
    Z_\mathrm{ped})$ is any point on the pedestal-top flux surface with
    $R_\mathrm{ped}$ and $Z_\mathrm{ped}$ in meters, $R'$ is the
    disk-integration radius in meters, and $B_Z$ is the vertical magnetic-field
    component in tesla. The integral fixes the additive reference to the
    zero-radius disk on the toroidal symmetry axis; only differences in $\psi$
    are invariant under an added constant.

    This dimensional flux value is related to normalized poloidal magnetic flux
    at the pedestal top through the normalization
    $(\psi_\mathrm{ped}-\psi_0)/(\psi_b-\psi_0)$, where $\psi_0$ is the
    [poloidal magnetic flux at the magnetic
    axis](name:poloidal_magnetic_flux_at_magnetic_axis) and $\psi_b$ is the
    [poloidal magnetic flux at the plasma
    boundary](name:poloidal_magnetic_flux_at_plasma_boundary). It is not a
    radius-like coordinate such as [toroidal flux radius at the pedestal
    top](name:toroidal_flux_coordinate_at_pedestal_top), and it is distinct from
    values at the pedestal center or maximum-gradient surface unless those loci
    are defined to coincide with the pedestal top.

    Sign convention: Positive when $B_Z$ on the horizontal integration disk
    points in the $+\hat{Z}$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  unit: Wb

- name: poloidal_neutral_energy_diffusivity
  description: |-
    Effective poloidal diffusivity for neutral thermal-energy transport,
    relating the diffusive energy flux tangent to constant-ρ surfaces to the
    local poloidal gradient of neutral energy density.
  documentation: |-
    Poloidal neutral energy diffusivity is the effective diagonal transport
    coefficient for diffusive transport of thermal energy carried by neutral
    atoms and molecules along the poloidal direction.

    In flux coordinates $(\rho,\theta,\phi)$, its defining constitutive relation
    is

    $$
    q_{n,\theta}^{\mathrm{diff}}=-D_{n,\theta}\frac{\partial u_n}{\partial s_\theta}
    $$

    where $q_{n,\theta}^{\mathrm{diff}}$ is the poloidal diffusive
    neutral-energy flux density, $D_{n,\theta}$ is the poloidal diffusivity,
    $u_n$ is neutral thermal-energy density, and $s_\theta$ is physical
    arclength along the poloidal tangent at fixed $\rho$ and $\phi$. The
    diffusivity has units of m$^2$ s$^{-1}$, while $s_\theta$ is measured in m.

    This quantity is the poloidal specialization of [neutral energy
    diffusivity](name:effective_neutral_energy_diffusion_coefficient). It
    aggregates the relevant neutral populations and is distinct from the
    state-resolved [poloidal neutral internal-state energy
    diffusivity](name:poloidal_neutral_internal_state_energy_diffusivity).
  unit: m^2.s^-1

- name: poloidal_neutral_internal_state_energy_diffusivity
  description: |-
    Effective diagonal diffusivity for down-gradient transport of energy carried
    by neutral particles in a specified internal state along poloidal flux
    surfaces.
  documentation: |-
    The poloidal component of the [effective neutral internal-state energy
    diffusivity](name:effective_neutral_internal_state_energy_diffusivity)
    tensor expresses effective Fickian transport of energy carried by neutral
    particles occupying a specified internal state. It acts along the poloidal
    tangent to a flux surface, rather than along the magnetic-field direction.

    $$
    \Gamma_{E,\theta}=-D^{\mathrm{eff}}_{E,\theta}\left.\frac{\partial e_{n,s}}{\partial \ell_\theta}\right|_{\rho,\phi}
    $$

    Here $\Gamma_{E,\theta}$ is the poloidal energy flux,
    $D^{\mathrm{eff}}_{E,\theta}$ is this diffusivity, $e_{n,s}$ is the energy
    density of neutral particles in internal state $s$, and $\ell_\theta$ is
    distance along the poloidal tangent. The coordinates $(\rho,\theta,\phi)$
    are the flux-surface, poloidal-angle, and toroidal-angle coordinates; the
    derivative is taken at fixed $\rho$ and $\phi$.

    This effective coefficient represents the net phenomenological response, not
    a single microscopic mechanism. Its directional and state scope is shared by
    the [poloidal neutral internal-state energy diffusion
    coefficient](name:poloidal_neutral_internal_state_energy_diffusion_coefficient),
    while the parallel counterpart resolves transport along magnetic field
    lines.
  unit: m^2.s^-1

- name: poloidal_neutral_particle_diffusivity
  description: |-
    Effective coefficient relating the poloidal diffusive flux of a neutral
    species to its local number-density gradient in the same direction.
  documentation: |-
    Effective poloidal particle diffusivity for neutral species is the
    directional transport coefficient that represents neutral-particle spreading
    driven by a neutral number-density gradient. It is the poloidal
    specialization of [neutral particle
    diffusivity](name:neutral_particle_diffusivity), with transport resolved
    around the magnetic axis within a plane of constant toroidal angle.

    For the poloidal direction, the diffusive neutral-particle flux is defined
    by

    $$
    \Gamma_{0,\mathrm{p}}^{\mathrm{diff}} = -D_{0,\mathrm{p}}\frac{\partial n_0}{\partial s_{\mathrm{p}}}
    $$

    where $\Gamma_{0,\mathrm{p}}^{\mathrm{diff}}$ is the poloidal diffusive
    neutral-particle flux density, $D_{0,\mathrm{p}}$ is the poloidal neutral
    particle diffusivity, $n_0$ is the neutral-species number density, and
    $s_{\mathrm{p}}$ is physical arclength along the poloidal direction. The
    minus sign specifies transport down the neutral number-density gradient for
    positive diffusivity.

    The density and flux refer to the selected neutral species as a whole,
    without resolving its internal states; no sum over different neutral species
    is implied. This distinguishes the coefficient from the [poloidal neutral
    internal-state diffusion
    coefficient](name:poloidal_neutral_internal_state_diffusion_coefficient),
    which applies to a specified internal state. This quantity describes
    diffusive particle transport, not convective particle transport or energy
    diffusion. Its directional counterpart, [parallel neutral particle
    diffusivity](name:parallel_neutral_particle_diffusivity), instead resolves
    transport along the magnetic field.
  unit: m^2.s^-1

- name: poloidal_neutral_state_particle_convection_velocity
  description: |-
    Signed effective poloidal velocity coefficient for density-proportional
    convective particle transport of a specified neutral state in edge plasma.
  documentation: |-
    This quantity is the effective coefficient of density-proportional
    convective particle transport for a specified neutral state, projected onto
    the poloidal direction. It represents directed drift or pinch transport
    after density-gradient-driven diffusive transport has been separated.

    The poloidal convective particle flux is defined by

    $$
    \Gamma_{n,s}^{\mathrm{conv,pol}} = n_s v_{n,s}^{\mathrm{conv,pol}}
    $$

    where $\Gamma_{n,s}^{\mathrm{conv,pol}}$ is the poloidal convective particle
    flux, $n_s$ is the particle density of the specified neutral state, and
    $v_{n,s}^{\mathrm{conv,pol}}$ is this effective velocity coefficient. The
    quantity is the poloidal component of [neutral state particle convection
    velocity](name:neutral_state_particle_convection_velocity), not the complete
    particle flux and not the diffusive transport coefficient. Its species-state
    and particle-channel meaning distinguishes it from the analogous [poloidal
    ion charge-state convection
    velocity](name:poloidal_ion_charge_state_convection_velocity).
  unit: m.s^-1

- name: poloidal_neutral_state_particle_diffusivity
  description: |-
    Poloidal neutral internal-state particle diffusivity is the effective
    Fickian transport coefficient for diffusive particle transport of a
    specified neutral internal-state population along the poloidal coordinate θ
    in flux coordinates (ρ, θ, φ).
  documentation: |-
    Poloidal neutral internal-state particle diffusivity is the effective
    Fickian transport coefficient for diffusive particle transport of a
    specified neutral internal-state population along the poloidal coordinate
    $\theta$ in flux coordinates $(\rho, \theta, \phi)$. The neutral state is an
    internal population of a neutral species, not an ion charge state or an
    aggregate over neutral states.

    The Fickian relation for neutral internal state $s$ is

    $$
    \Gamma_{\theta,s}^{\mathrm{diff}} = -D_{\theta,s}\,\frac{\partial n_s}{\partial \ell_\theta}
    $$

    where $\Gamma_{\theta,s}^{\mathrm{diff}}$ is the poloidal diffusive
    particle-flux component of neutral internal state $s$, $D_{\theta,s}$ is
    this diffusivity, $n_s$ is the number density of neutral internal state $s$,
    and $\ell_\theta$ is arc length in the direction of increasing $\theta$ at
    fixed $\rho$ and $\phi$.

    This coefficient is resolved for a single neutral internal state and
    excludes summation or averaging over distinct neutral internal states. It
    describes diffusive particle-number transport only and excludes advective
    transport, sources and sinks, energy diffusivity, and momentum diffusivity;
    related broader particle diffusivities include [neutral-state particle
    diffusivity](name:neutral_state_particle_diffusivity), [poloidal neutral
    particle diffusivity](name:poloidal_neutral_particle_diffusivity), and
    poloidal particle diffusivity.

    Sign convention: Positive when the poloidal diffusive particle-flux
    component is directed opposite to the poloidal number-density gradient.
  unit: m^2.s^-1

- name: pressure_at_pedestal_top
  description: |-
    Kinetic plasma pressure evaluated at the fitted core-side shoulder of the
    H-mode edge transport barrier, including population-specific and total
    pressure contributions.
  documentation: |-
    Kinetic pressure at the pedestal top is the scalar stress associated with
    random particle motion at the fitted core-side shoulder of the H-mode edge
    transport barrier. It may describe a selected plasma population or the
    aggregate of the populations included in the plasma pressure.

    The scalar pressure is defined from the kinetic pressure tensor by

    $$
    p = \frac{1}{3}\operatorname{Tr}(\mathbf{P})
    $$

    where $p$ is the scalar kinetic pressure, $\mathbf{P}$ is the kinetic
    pressure tensor, and $\operatorname{Tr}$ is the tensor trace. For a
    specified population, $\mathbf{P}$ is that population's partial-pressure
    tensor; the total plasma pressure is the sum of the partial pressures
    included in the aggregation.

    This quantity is restricted to the pedestal-top location, namely the fitted
    core-side shoulder of the H-mode edge transport barrier, rather than a
    pressure value at an arbitrary point or across the entire edge region. A
    population-specific instance such as [electron pressure at the pedestal
    top](name:electron_pressure_at_pedestal_top) represents only the electron
    partial-pressure contribution and is therefore distinct from the total
    plasma pressure. The quantity is pressure itself, not the electron
    temperature or a dimensionless beta formed by normalizing pressure to
    magnetic-field energy.
  unit: Pa

- name: pressure_over_scrape_off_layer
  description: |-
    Thermal pressure of a plasma constituent or neutral-gas population in the
    open-field-line scrape-off layer, the region between the last closed flux
    surface and the material plasma-facing components.
  documentation: |-
    The scrape-off layer (SOL) is the open-field-line region extending from the
    last closed flux surface to the material plasma-facing components, where
    local pressure governs energy and particle exhaust, neutral recycling,
    ionization balance, and the onset of divertor detachment. This parent name
    generalizes over species-resolved SOL pressure quantities: [electron
    pressure over the scrape-off
    layer](name:electron_pressure_over_scrape_off_layer) represents the electron
    partial pressure and additionally anchors the pressure baseline offset in
    H-mode pedestal profile fits, while [neutral pressure over the scrape-off
    layer](name:neutral_pressure_over_scrape_off_layer) characterizes the
    neutral gas inventory affecting recycling, pumping balance, and detachment
    control.

    For any thermally equilibrated species $s$, the scalar thermal pressure
    satisfies:

    $$
    p_s = n_s k_B T_s
    $$

    where $n_s$ is the species number density and $T_s$ is its temperature in
    energy units.

    SOL pressure is inferred from a combination of diagnostics: Langmuir probes
    provide local electron pressure at plasma-facing surfaces from saturation
    current and electron temperature; neutral gas pressure gages directly
    measure gas pressure in the divertor pumping region; Thomson scattering
    resolves electron density and temperature profiles from which electron
    pressure is derived. The characteristic radial scale over which pressure
    falls from the separatrix outward is described by the [decay length over the
    scrape-off layer](name:decay_length_over_scrape_off_layer).
  unit: Pa

- name: electron_pressure_over_scrape_off_layer
  description: |-
    Volume-averaged thermal pressure of electrons in the scrape-off layer, the
    open-field-line region between the last closed flux surface and material
    plasma-facing components.
  documentation: |-
    Electron pressure over the scrape-off layer is the volume-averaged thermal
    pressure of electrons in the open-field-line region between the last closed
    flux surface and the material plasma-facing components. It represents the
    electron partial-pressure contribution to [pressure over the scrape-off
    layer](name:pressure_over_scrape_off_layer) over that volume.

    The volume average is defined from the local electron thermal pressure over
    the scrape-off-layer volume:

    $$
    \langle p_e \rangle_{\mathrm{SOL}} = \frac{1}{V_{\mathrm{SOL}}} \int_{V_{\mathrm{SOL}}} n_e(\mathbf{x}) T_e(\mathbf{x}) \, dV
    $$

    where $\langle p_e \rangle_{\mathrm{SOL}}$ is the volume-averaged electron
    pressure over the scrape-off layer, $n_e(\mathbf{x})$ is the local electron
    number density, $T_e(\mathbf{x})$ is the local electron temperature
    expressed as thermal energy per electron, $V_{\mathrm{SOL}}$ is the
    scrape-off-layer volume, $dV$ is a volume element, and $\mathbf{x}$ is
    position.

    This quantity excludes ion partial pressures and the neutral-gas pressure
    described by [neutral pressure over the scrape-off
    layer](name:neutral_pressure_over_scrape_off_layer). It is a SOL volume
    average, not the electron pressure at the plasma boundary, and it is related
    to electron density over the scrape-off layer through the same averaging
    domain but is a density-temperature moment rather than a number-density
    average.
  unit: Pa

- name: neutral_pressure_over_scrape_off_layer
  description: |-
    Volume-averaged thermal pressure of neutral atoms and molecules in the
    scrape-off layer, the open-field-line region between the last closed flux
    surface and material plasma-facing components.
  documentation: |-
    Neutral pressure over the scrape-off layer is the volume-averaged thermal
    pressure of neutral atoms and molecules in the open-field-line region
    between the last closed flux surface and the material plasma-facing
    components. It represents the neutral-gas contribution to the SOL pressure,
    distinct from the electron partial pressure described by [electron pressure
    over the scrape-off layer](name:electron_pressure_over_scrape_off_layer),
    and is a component of [pressure over the scrape-off
    layer](name:pressure_over_scrape_off_layer).

    The defining volume average is

    $$
    \overline{p}_{\mathrm{n,SOL}} = \frac{1}{V_{\mathrm{SOL}}} \int_{\mathrm{SOL}} p_{\mathrm{n}}(\mathbf{r})\,\mathrm{d}V, \qquad p_{\mathrm{n}}(\mathbf{r}) = \sum_s n_s(\mathbf{r}) k_B T_s(\mathbf{r})
    $$

    where $V_{\mathrm{SOL}}$ is the scrape-off-layer volume, $\mathbf{r}$ is
    position, $p_{\mathrm{n}}$ is local neutral pressure, $s$ indexes neutral
    atomic and molecular species, $n_s$ is their number density, $T_s$ is their
    thermodynamic temperature, and $k_B$ is Boltzmann's constant.

    The quantity excludes charged-particle pressure and represents an average
    over the entire scrape-off-layer domain rather than a pressure evaluated at
    a particular location.
  unit: Pa

- name: radial_thermal_ion_charge_state_energy_diffusion_coefficient
  description: |-
    Effective Fickian coefficient for radial diffusive transport of thermal
    energy by ions in a specified charge state.
  documentation: |-
    The radial ion charge-state energy diffusion coefficient is the effective
    proportionality coefficient for down-gradient diffusive transport of thermal
    energy carried by ions in a specified charge state. It characterizes the
    radial transport component directed outward from the magnetic axis.

    The diffusive radial ion-energy flux is defined by

    $$
    q_{i,z,E}^{\mathrm{diff,rad}} = -n_{i,z} D_{i,z,E}^{\mathrm{rad}} \nabla_{\mathrm{rad}} T_{i,z}
    $$

    where $q_{i,z,E}^{\mathrm{diff,rad}}$ is the radial diffusive thermal-energy
    flux, $n_{i,z}$ is the number density of ion charge state $z$,
    $D_{i,z,E}^{\mathrm{rad}}$ is this coefficient, $T_{i,z}$ is the
    corresponding ion temperature, and $\nabla_{\mathrm{rad}}$ denotes the
    outward radial gradient.

    This quantity is the radial specialization of the [thermal ion charge-state
    energy diffusion
    coefficient](name:thermal_ion_charge_state_energy_diffusion_coefficient). It
    applies to one specified charge state and excludes parallel, poloidal, and
    toroidal transport contributions.
  unit: m^2.s^-1

- name: temperature_over_scrape_off_layer
  description: |-
    Temperature over the scrape-off layer is the thermal plasma temperature
    associated with the open-field-line edge region outside the confined plasma.
    It is a parent quantity whose specializations define any species, locality,
    or averaging convention.
  documentation: |-
    Temperature over the scrape-off layer is the scalar thermal plasma
    temperature associated with particles in the scrape-off layer, the
    open-field-line edge region outside the confined plasma. It denotes the
    temperature concept for that region without fixing a particular plasma
    species, spatial locus, or averaging measure.

    This parent quantity applies only to plasma in the scrape-off layer and not
    to temperatures in the closed-field-line confined plasma or to
    material-surface temperatures. It also does not by itself specify whether
    the represented SOL temperature is local, region-averaged,
    field-line-associated, or otherwise aggregated; those semantics belong to
    concrete specializations.

    A specialization such as [average temperature over the scrape-off
    layer](name:average_temperature_over_scrape_off_layer) is a narrower
    quantity that adds an averaging convention while retaining the same
    scrape-off-layer temperature concept.
  unit: eV

- name: average_temperature_over_scrape_off_layer
  description: |-
    Averaged kinetic temperature of a specified plasma species over the
    open-field-line scrape-off layer, with the averaging domain and measure
    defined by its specialization.
  documentation: |-
    This quantity is the temperature of a specified plasma species after
    averaging over a defined domain or path within the scrape-off layer. The
    scrape-off layer is the open-field-line region outside the last closed
    magnetic flux surface.

    The averaged temperature is defined by

    $$
    \overline{T}_s = \frac{\int_{\mathcal{D}} T_s\,d\mu}{\int_{\mathcal{D}} d\mu}
    $$

    where $\overline{T}_s$ is the averaged temperature, $T_s$ is the local
    temperature of species $s$, $\mathcal{D}$ is the specified scrape-off-layer
    domain or path, and $d\mu$ is the averaging measure. For [field-line-average
    temperature over the scrape-off
    layer](name:field_line_average_temperature_over_scrape_off_layer),
    $\mathcal{D}$ is an open magnetic field line between its defined upstream
    and downstream locations and $d\mu$ is the corresponding path measure.

    The quantity is species-specific and does not sum temperatures over multiple
    species or represent a local pointwise temperature. It is an averaged
    specialization of [temperature over the scrape-off
    layer](name:temperature_over_scrape_off_layer), while the concrete averaging
    domain and measure distinguish each child quantity.
  unit: eV

- name: field_line_average_temperature_over_scrape_off_layer
  description: |-
    Species-resolved temperature averaged by arc length along an open magnetic
    field line between upstream and downstream locations in the scrape-off
    layer.
  documentation: |-
    This quantity is the temperature of a specified plasma species averaged
    along an open magnetic field line traversing the scrape-off layer. It
    represents the common field-line-averaged quantity instantiated by the
    electron and ion species-specific children.

    The field-line average is defined by

    $$
    \overline{T}_{\sigma,\mathrm{FL}} = \frac{\int_{\ell_u}^{\ell_d} T_\sigma(\ell)\,d\ell}{\int_{\ell_u}^{\ell_d} d\ell}
    $$

    where $\overline{T}_{\sigma,\mathrm{FL}}$ is the field-line-averaged
    temperature, $\sigma$ identifies the selected plasma species,
    $T_\sigma(\ell)$ is its local temperature, and $\ell$ is arc length along
    the open magnetic field line. The limits $\ell_u$ and $\ell_d$ identify the
    upstream and downstream endpoints of the averaging interval.

    The quantity applies to one species at a time and uses an arc-length average
    along the open field line; it is neither a sum nor an average over multiple
    species. It is restricted to the scrape-off layer and does not denote a
    local temperature at one point or a volume average over that region.

    This is the field-line-averaged, species-resolved specialization of [average
    temperature over the scrape-off
    layer](name:average_temperature_over_scrape_off_layer). Its concrete
    realizations include [electron field-line average temperature over the
    scrape-off
    layer](name:electron_field_line_average_temperature_over_scrape_off_layer)
    and [ion field-line average temperature over the scrape-off
    layer](name:ion_field_line_average_temperature_over_scrape_off_layer), which
    differ only by the selected species.
  unit: eV

- name: electron_field_line_average_temperature_over_scrape_off_layer
  description: |-
    Electron temperature averaged along an open magnetic field line between
    upstream and downstream locations in the scrape-off layer.
  documentation: |-
    This quantity is the mean bulk-electron thermal temperature along an open
    magnetic field line through the scrape-off layer, between specified upstream
    and downstream locations. It represents the connected-field-line average
    rather than the local electron temperature at a single position.

    The field-line average is defined by

    $$
    \overline{T}_e = \frac{1}{L_{\parallel}} \int_{s_u}^{s_d} T_e(s)\,ds
    $$

    where $T_e(s)$ is the local electron temperature, $s$ is arc length along
    the magnetic field line, $s_u$ and $s_d$ are the upstream and downstream
    endpoints, and $L_{\parallel}=s_d-s_u$ is the connection length.

    The quantity applies to the bulk electron population in the scrape-off layer
    and is aggregated by arc-length averaging along one open field line. It
    excludes local single-point temperature values and does not represent a
    flux-surface or volume average.

    This is the electron-species specialization of the [field-line-averaged
    temperature over the scrape-off
    layer](name:field_line_average_temperature_over_scrape_off_layer). It is
    distinct from the corresponding [ion field-line-averaged
    temperature](name:ion_field_line_average_temperature_over_scrape_off_layer),
    which uses the ion temperature, and from [temperature over the scrape-off
    layer](name:temperature_over_scrape_off_layer), which averages over the
    region rather than along a connected field line.
  unit: eV

- name: ion_field_line_average_temperature_over_scrape_off_layer
  description: |-
    Ion temperature averaged along an open magnetic field line between upstream
    and downstream locations in the scrape-off layer.
  documentation: |-
    This quantity is the mean bulk-ion thermal temperature along an open
    magnetic field line through the scrape-off layer, between specified upstream
    and downstream locations. It represents the connected-field-line average
    rather than the local temperature at a single position.

    The field-line average is defined by

    $$
    \overline{T}_i = \frac{1}{L_{\parallel}} \int_{s_u}^{s_d} T_i(s)\,ds
    $$

    where $T_i(s)$ is the local ion temperature, $s$ is arc length along the
    magnetic field line, $s_u$ and $s_d$ are the upstream and downstream
    endpoints, and $L_{\parallel}=s_d-s_u$ is the connection length. The result
    is distinct from the local ion temperature at midplane and does not denote a
    flux-surface average.
  unit: eV

- name: toroidal_argon_velocity_at_pedestal_top
  description: |-
    Toroidal argon velocity at the pedestal top is the φ component, in the
    right-handed cylindrical (R, φ, Z) frame, of the density-weighted mean bulk
    flow of argon impurity ions where the H-mode pedestal transitions to the
    confined core.
  documentation: |-
    Toroidal argon velocity at the pedestal top is the $\phi$ component, in the
    right-handed cylindrical $(R, \phi, Z)$ frame, of the density-weighted mean
    bulk flow of argon impurity ions where the H-mode pedestal transitions to
    the confined core. As an intensive species-level quantity, it is the
    density-weighted mean over all argon charge states, not a
    charge-state-summed velocity.

    The charge-state aggregation is defined by the density-weighted mean at the
    pedestal top:

    $$
    v_{\phi,\mathrm{Ar}}^{\mathrm{ped}} = \frac{\sum_q n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}} v_{\phi,\mathrm{Ar}^{q+}}^{\mathrm{ped}}}{\sum_q n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}}}
    $$

    where $q$ indexes argon ionization state,
    $n_{\mathrm{Ar}^{q+}}^{\mathrm{ped}}$ is the local number density of that
    charge state, and $v_{\phi,\mathrm{Ar}^{q+}}^{\mathrm{ped}}$ is its toroidal
    velocity component at the pedestal top.

    It is inferred primarily from Doppler spectroscopy of argon emission, often
    charge-exchange recombination spectroscopy when suitable neutral-beam
    excitation is available. The observed line shift and viewing geometry
    determine the velocity projected onto the $\hat{\phi}$ direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame; estimating the
    all-charge-state mean may require emissivity modeling, ionization-balance
    information, or collisional equilibration assumptions.

    Because pedestal argon rotation is sensitive to external torque, radial
    electric-field shear, neoclassical friction, turbulence-driven momentum
    transport, and charge-state distribution, no device-independent numerical
    range is implied. This value is commonly interpreted with same-species
    values at other loci, including [toroidal argon velocity at the magnetic
    axis](name:toroidal_argon_velocity_at_magnetic_axis), [toroidal argon
    velocity at the internal transport
    barrier](name:toroidal_argon_velocity_at_internal_transport_barrier),
    [toroidal argon velocity at the plasma
    boundary](name:toroidal_argon_velocity_at_plasma_boundary), and toroidal
    flux-surface-averaged argon velocity at the plasma boundary.

    Sign convention: Positive when the density-weighted mean argon flow points
    in the $+\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  unit: m.s^-1

- name: toroidal_argon_velocity_at_plasma_boundary
  description: |-
    Toroidal component in the right-handed cylindrical (R, φ, Z) frame of the
    argon-ion bulk-flow velocity at the last closed flux surface.
  documentation: |-
    This quantity is the local toroidal component of the argon-ion bulk-flow
    velocity evaluated at the plasma boundary, identified with the last closed
    flux surface. It is a pointwise boundary value rather than an average over
    that flux surface.

    The charge-state-aggregated toroidal velocity is defined by

    $$
    V_{\mathrm{Ar},\phi} = \frac{\sum_z n_{\mathrm{Ar},z} v_{\mathrm{Ar},z,\phi}}{\sum_z n_{\mathrm{Ar},z}}
    $$

    where $V_{\mathrm{Ar},\phi}$ and $v_{\mathrm{Ar},z,\phi}$ are toroidal
    velocity components in m s$^{-1}$, $n_{\mathrm{Ar},z}$ is the argon-ion
    number density in m$^{-3}$, and $z$ indexes argon ion charge states. The
    toroidal component is defined in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    The local value is distinct from the toroidal flux-surface-averaged argon
    velocity at the plasma boundary, which averages the same component over the
    boundary flux surface. Neutral argon is excluded from the ion bulk-flow
    aggregation.

    Sign convention: Positive when the argon-ion bulk velocity projects onto the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_beryllium_velocity_at_pedestal_top
  description: |-
    Toroidal bulk-flow velocity of beryllium ions at the core-side shoulder of
    the H-mode edge transport barrier, density-weighted over all ionization
    states.
  documentation: |-
    This quantity is the toroidal component of the beryllium impurity-ion
    bulk-flow velocity at the core-side shoulder of the H-mode edge transport
    barrier, conventionally called the pedestal top.

    The charge-state aggregation is defined by

    $$
    V_{\mathrm{Be},\phi} = \frac{\sum_z n_{\mathrm{Be},z} v_{\mathrm{Be},z,\phi}}{\sum_z n_{\mathrm{Be},z}}
    $$

    where $z$ indexes the included beryllium ion charge states,
    $n_{\mathrm{Be},z}$ is the corresponding number density in m$^{-3}$, and
    $v_{\mathrm{Be},z,\phi}$ is the charge-state-resolved toroidal velocity in m
    s$^{-1}$. The result is a density-weighted intensive mean, not a sum of
    charge-state velocities; the corresponding elemental concentration is
    represented by beryllium density at the pedestal top. It is evaluated at the
    pedestal top rather than at the magnetic axis, as in [toroidal beryllium
    velocity at the magnetic
    axis](name:toroidal_beryllium_velocity_at_magnetic_axis).

    Sign convention: Positive when the beryllium bulk flow has a component in
    the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: toroidal_carbon_velocity_at_pedestal_top
  description: |-
    Density-weighted toroidal flow velocity of carbon impurity ions at the
    core-side shoulder of the H-mode edge transport barrier, resolved along
    increasing toroidal angle in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The carbon impurity-ion fluid velocity at the H-mode pedestal top is the
    density-weighted bulk-flow velocity of all contributing carbon ion charge
    states, evaluated at the core-side shoulder of the H-mode edge transport
    barrier. It is the toroidal component rather than the total
    three-dimensional speed, expressed in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    $$
    v_{\phi,C}=\frac{\sum_q n_{C^{q+}}v_{\phi,C^{q+}}}{\sum_q n_{C^{q+}}}
    $$

    Here, $q$ indexes the contributing carbon ion charge states, $n_{C^{q+}}$ is
    the corresponding number density in m$^{-3}$, and $v_{\phi,C^{q+}}$ is its
    toroidal velocity in m s$^{-1}$. Neutral carbon is excluded because this
    quantity is defined for impurity ions. The pedestal-top value is distinct
    from the [toroidal carbon velocity at the plasma
    boundary](name:toroidal_carbon_velocity_at_plasma_boundary).

    Sign convention: Positive when the carbon-ion flow has a component in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.
  unit: m.s^-1

- name: toroidal_carbon_velocity_at_plasma_boundary
  description: |-
    Density-weighted toroidal bulk-flow velocity of carbon impurity ions at the
    last closed magnetic flux surface, resolved along increasing toroidal angle.
  documentation: |-
    The carbon impurity-ion toroidal velocity at the plasma boundary is the
    local density-weighted mean of the bulk-flow velocities of all included
    carbon ion charge states on the last closed magnetic flux surface. It is not
    a flux-surface average; that distinct quantity is the toroidal
    flux-surface-averaged carbon velocity, while the magnetic-axis counterpart
    is [toroidal carbon velocity at the magnetic
    axis](name:toroidal_carbon_velocity_at_magnetic_axis).

    The defining local component is

    $$
    V_{\phi,C}(R,Z)=\frac{\sum_{q\in Q} n_{C^{q+}}(R,Z)\,\mathbf{V}_{C^{q+}}(R,Z)\cdot\hat{\phi}}{\sum_{q\in Q} n_{C^{q+}}(R,Z)}
    $$

    where $Q$ is the set of included carbon ion charge states, $n_{C^{q+}}$ is
    the corresponding number density in m$^{-3}$, and $\mathbf{V}_{C^{q+}}$ is
    its bulk velocity in m s$^{-1}$. The component is resolved in the
    right-handed cylindrical $(R,\phi,Z)$ frame, with
    $\hat{R}\times\hat{\phi}=\hat{Z}$; $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.

    Sign convention: Positive when the carbon-ion bulk flow has a component in
    the direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_deuterium_tritium_velocity_at_pedestal_top
  description: |-
    Toroidal component of the bulk flow velocity assigned to the effective
    deuterium–tritium fuel species at the core-side shoulder of the H-mode edge
    pedestal.
  documentation: |-
    The quantity is the bulk-flow velocity of deuterium and tritium treated as
    one effective fuel species, evaluated at the core-side shoulder of the
    H-mode edge transport barrier. It is distinct from the velocity of deuterium
    alone, such as [toroidal deuterium velocity at the pedestal
    top](name:toroidal_deuterium_velocity_at_pedestal_top).

    The effective toroidal velocity is the mass-density-weighted mean of the
    isotope flow components:

    $$
    v_{\mathrm{DT},\phi} = \frac{m_D n_D v_{D,\phi} + m_T n_T v_{T,\phi}}{m_D n_D + m_T n_T}
    $$

    where $m_D$ and $m_T$ are the deuterium and tritium masses in kg, $n_D$ and
    $n_T$ are their number densities in m$^{-3}$, and $v_{D,\phi}$ and
    $v_{T,\phi}$ are their toroidal velocity components in m.s$^{-1}$. The
    effective species uses the deuterium–tritium fuel convention with mean
    atomic mass 2.5; this local quantity is not a flux-surface average or a
    value at the plasma boundary, such as [toroidal deuterium–tritium velocity
    at the plasma
    boundary](name:toroidal_deuterium_tritium_velocity_at_plasma_boundary).

    Sign convention: Positive when the velocity points in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  unit: m.s^-1

- name: toroidal_deuterium_tritium_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the bulk flow velocity of the fictitious
    deuterium-tritium single-species (atomic mass 2.5 amu), evaluated at the
    plasma boundary (last closed flux surface).
  documentation: |-
    The toroidal deuterium-tritium velocity at the plasma boundary is the
    $\hat{\phi}$-component of the bulk-flow velocity of a fictitious
    single-species representing a deuterium-tritium fuel mixture with atomic
    mass 2.5 amu, evaluated at the plasma boundary — the last closed flux
    surface separating magnetically confined plasma from the scrape-off layer.

    The toroidal projection is defined as:

    $$
    v_\phi^{DT} = \mathbf{v}_{DT} \cdot \hat{\phi}
    $$

    where $\mathbf{v}_{DT}$ is the bulk-flow velocity of the fictitious
    deuterium-tritium species and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    This quantity is a local point evaluation at the plasma boundary, distinct
    from
    toroidal_flux_surface_averaged_deuterium_tritium_velocity_at_plasma_boundary,
    which gives the flux-surface mean at the same location, and from
    [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary),
    which resolves the deuterium species independently rather than treating the
    D-T mixture as a single effective species.
  unit: m.s^-1

- name: toroidal_deuterium_velocity_at_pedestal_top
  description: |-
    Toroidal deuterium-ion fluid velocity at the core-side shoulder of the
    H-mode edge transport barrier, averaged over deuterium ion charge states.
  documentation: |-
    Deuterium-ion toroidal fluid velocity at the core-side shoulder of the
    H-mode edge transport barrier represents the bulk rotational flow of
    deuterium ions. It is the density-weighted mean over all deuterium ion
    charge states, rather than a thermal speed or velocity magnitude.

    $$
    v_{phi,D} = \frac{\sum_q n_{D,q} v_{phi,D,q}}{\sum_q n_{D,q}}
    $$

    where $q$ labels deuterium ion charge state, $n_{D,q}$ is its number density
    in m$^{-3}$, and $v_{\phi,D,q}$ is its toroidal fluid-velocity component in
    m.s$^{-1}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. The locus
    is the core-side shoulder of the H-mode edge transport barrier, and the
    quantity is distinct from the corresponding [toroidal hydrogen-ion
    velocity](name:toroidal_hydrogen_velocity_at_pedestal_top).
  unit: m.s^-1

- name: toroidal_deuterium_velocity_at_plasma_boundary
  description: |-
    Density-weighted toroidal bulk-flow velocity of deuterium ions at the last
    closed flux surface, resolved along increasing toroidal angle.
  documentation: |-
    The deuterium toroidal velocity is the local toroidal projection of the
    density-weighted bulk-flow velocity of deuterium ions at the plasma
    boundary, identified with the last closed flux surface. It excludes neutral
    deuterium and is not a flux-surface average.

    $$
    v_{D,\phi}=\hat{\phi}\cdot\frac{\sum_{q\in Q_D}n_{D,q}\mathbf{v}_{D,q}}{\sum_{q\in Q_D}n_{D,q}}
    $$

    Here $Q_D$ is the set of included deuterium ion charge states, $n_{D,q}$ is
    the number density of charge state $q$, $\mathbf{v}_{D,q}$ is its bulk-flow
    velocity, and $\hat{\phi}$ is the toroidal unit vector in the right-handed
    cylindrical $(R,\phi,Z)$ frame. The local quantity is distinct from the
    toroidal flux-surface-averaged deuterium velocity at the plasma boundary and
    from the corresponding value at the [magnetic
    axis](name:toroidal_deuterium_velocity_at_magnetic_axis).

    Sign convention: Positive when the deuterium bulk velocity points in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_helium_3_velocity_at_pedestal_top
  description: |-
    Toroidal component of the helium-3 ion fluid velocity at the pedestal top,
    resolved along the toroidal direction in the right-handed cylindrical (R, φ,
    Z) frame. It is the density-weighted mean over all helium-3 ion charge
    states and is signed positive for flow toward increasing φ.
  documentation: |-
    Toroidal component of the helium-3 ion fluid velocity at the pedestal top is
    the helium-3 ion bulk-flow component resolved along $\hat{\phi}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame. For species-level helium-3,
    this intensive quantity is the density-weighted mean over all helium-3 ion
    charge states at the pedestal top.

    The charge-state-aggregated toroidal component is defined by

    $$
    v_{\phi,\,^3\mathrm{He}}^{\mathrm{ped}} = \frac{\sum_q n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}\left(\mathbf{v}_{^3\mathrm{He}^{q+}}^{\mathrm{ped}} \cdot \hat{\phi}\right)}{\sum_q n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}}
    $$

    where $q$ indexes helium-3 ion charge state,
    $n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}$ is the number density of that charge
    state at the pedestal top, $\mathbf{v}_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}$
    is its ion fluid velocity there, and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle $\phi$.

    This quantity excludes radial and vertical components in the right-handed
    cylindrical $(R, \phi, Z)$ frame, vector speed, arithmetic averages over
    charge states, and values at other loci such as the [magnetic
    axis](name:toroidal_helium_3_velocity_at_magnetic_axis). It is defined where
    the total helium-3 ion density in the averaging denominator is nonzero.

    Sign convention: Positive when the helium-3 ion fluid velocity is directed
    toward increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_helium_3_velocity_at_plasma_boundary
  description: |-
    Signed toroidal component of the helium-3 ion bulk-flow velocity evaluated
    on the plasma boundary, along the direction of increasing toroidal angle.
  documentation: |-
    The helium-3 ion bulk-flow velocity at the plasma boundary is the
    density-weighted mean flow of helium-3 ions over their ion charge states,
    evaluated on the last closed magnetic flux surface, or separatrix. It
    describes toroidal motion rather than the full velocity vector.

    The toroidal component is defined by

    $$
    v_{c6,{}^3\mathrm{He}} = \mathbf{u}_{{}^3\mathrm{He}} \cdot \hat{\phi}
    $$

    where $\mathbf{u}_{{}^3\mathrm{He}}$ is the helium-3 ion bulk-flow velocity
    and $\hat{\phi}$ is the toroidal unit vector in the right-handed cylindrical
    $(R,\phi,Z)$ frame.

    Unlike the flux-surface-averaged helium-3 boundary velocity, this quantity
    is the velocity evaluated at the plasma boundary and does not imply
    flux-surface averaging.
  unit: m.s^-1

- name: toroidal_helium_4_velocity_at_pedestal_top
  description: |-
    Toroidal component of the helium-4 ion fluid velocity evaluated at the
    H-mode pressure pedestal top, resolved along the direction of increasing
    toroidal angle in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Toroidal component of the helium-4 ion fluid velocity evaluated at the
    H-mode pressure pedestal top, resolved along the direction of increasing
    toroidal angle, is the signed bulk-flow component of helium-4 ions along
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. The
    pedestal top is the core-side shoulder of the H-mode pressure pedestal. As a
    species-level intensive quantity, it is the density-weighted mean over all
    helium-4 ionization charge states in the ion population.

    The charge-state-aggregated toroidal component at the pedestal top is
    defined by

    $$
    v_{\phi,\mathrm{ped}}^{{}^4\mathrm{He}} =
    \frac{\sum_q n_q^{{}^4\mathrm{He}} \left(\mathbf{v}_q^{{}^4\mathrm{He}} \cdot \hat{\phi}\right)}
    {\sum_q n_q^{{}^4\mathrm{He}}}
    $$

    where $q$ labels helium-4 ionization charge states, $n_q^{{}^4\mathrm{He}}$
    is the local number density of charge state $q$,
    $\mathbf{v}_q^{{}^4\mathrm{He}}$ is its fluid velocity, and $\hat{\phi}$ is
    the unit vector in the direction of increasing $\phi$; all quantities are
    evaluated at the pedestal-top location.

    This quantity is local to the pedestal top and is not an average over the
    full pedestal or scrape-off layer. It is a species-level helium-4 velocity,
    so it differs from charge-state-resolved helium-4 velocities by the
    density-weighted charge-state aggregation and from other isotope velocities
    only by the selected ion species.

    Sign convention: Positive when the helium-4 ion flow is in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, counter-clockwise when viewed from above along $+\hat{Z}$.
  unit: m.s^-1

- name: toroidal_helium_4_velocity_at_plasma_boundary
  description: |-
    Signed toroidal component of the bulk-flow velocity of helium-4 ions
    evaluated on the last closed magnetic flux surface.
  documentation: |-
    This quantity is the local bulk-flow velocity component of helium-4 ions at
    the plasma boundary, identified with the last closed magnetic flux surface.
    It is not a flux-surface average.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the component is
    defined by

    $$
    v_\phi = \mathbf{v}_{\mathrm{He\text{-}4}} \cdot \hat{\boldsymbol{\phi}}
    $$

    where $\mathbf{v}_{\mathrm{He\text{-}4}}$ is the bulk-flow velocity of the
    helium-4 ion population and $\hat{\boldsymbol{\phi}}$ is the unit vector in
    the direction of increasing toroidal angle. The boundary-local value is
    distinct from the [toroidal helium-4 velocity at the magnetic
    axis](name:toroidal_helium_4_velocity_at_magnetic_axis) and from a
    flux-surface-averaged helium velocity.
  unit: m.s^-1

- name: toroidal_hydrogen_velocity_at_pedestal_top
  description: |-
    Toroidal fluid velocity of hydrogen ions at the core-side shoulder of the
    H-mode edge transport barrier, resolved along increasing toroidal angle in
    the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the hydrogen-ion fluid velocity component tangent to the
    toroidal direction at the core-side shoulder of the H-mode edge transport
    barrier. It describes the directed bulk motion of the hydrogen-ion
    population, rather than its speed or a thermal velocity spread.

    $$
    v_{\phi,H} = \mathbf{v}_H \cdot \hat{\phi}
    $$

    where $\mathbf{v}_H$ is the hydrogen-ion fluid-velocity vector and
    $\hat{\phi}$ is the toroidal unit vector in the right-handed cylindrical
    $(R, \phi, Z)$ frame. The pedestal-top locus denotes the inner shoulder of
    the edge transport barrier and is distinct from the hydrogen-ion velocity
    evaluated at an internal transport barrier, as in
    [toroidal_hydrogen_velocity_at_internal_transport_barrier](name:toroidal_hydrogen_velocity_at_internal_transport_barrier).
    The quantity is a directed component, not the magnitude of the hydrogen-ion
    velocity.

    Sign convention: Positive when the hydrogen-ion fluid velocity points in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_hydrogen_velocity_at_plasma_boundary
  description: |-
    Local toroidal component of the hydrogen-ion bulk-flow velocity at the
    plasma boundary, density-weighted over all hydrogen charge states.
  documentation: |-
    The quantity is the local hydrogen-ion bulk-flow velocity component tangent
    to the toroidal direction at the plasma boundary, rather than a flux-surface
    average. Hydrogen denotes the combined hydrogen-ion population.

    The toroidal component is defined by

    $$
    v_{phi,H}(R,Z)=\mathbf{v}_H(R,Z)\cdot\hat{\phi},\qquad \mathbf{v}_H=\frac{\sum_q n_{H,q}\mathbf{v}_{H,q}}{\sum_q n_{H,q}}
    $$

    where $\mathbf{v}_H$ is the hydrogen bulk-flow velocity, $\hat{\phi}$ is the
    toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame,
    $n_{H,q}$ is the density of hydrogen charge state $q$, and
    $\mathbf{v}_{H,q}$ is its bulk-flow velocity. The coordinates $R$ and $Z$
    are major radius and vertical height, respectively. The local quantity is
    distinct from the toroidal flux-surface-averaged hydrogen velocity at the
    plasma boundary.
  unit: m.s^-1

- name: toroidal_ion_velocity_at_plasma_boundary
  description: |-
    Toroidal ion velocity at the plasma boundary is the toroidal component, in
    the right-handed cylindrical (R, φ, Z) frame, of the density-weighted
    bulk-flow velocity of the total ion fluid at the plasma boundary. It is
    distinct from random thermal motion and transport-model convection
    velocities.
  documentation: |-
    Toroidal ion velocity at the plasma boundary is the $\hat{\phi}$ component,
    in the right-handed cylindrical $(R,\phi,Z)$ frame, of the density-weighted
    bulk-flow velocity of the total ion fluid evaluated on the plasma-boundary
    surface. It represents directed collective ion motion, not random thermal
    motion.

    The total-ion population aggregation is the density-weighted mean over ion
    species and charge states:

    $$
    v_{\phi i}\big|_{\partial p} =
    \frac{\sum_{\alpha,c} n_{\alpha c}\big|_{\partial p}\, v_{\phi,\alpha c}\big|_{\partial p}}
    {\sum_{\alpha,c} n_{\alpha c}\big|_{\partial p}}
    $$

    where $v_{\phi i}\big|_{\partial p}$ is the toroidal ion velocity at the
    plasma boundary, $\partial p$ denotes the plasma-boundary surface,
    $n_{\alpha c}\big|_{\partial p}$ is the ion number density for species
    $\alpha$ in charge state $c$ at that surface, $v_{\phi,\alpha
    c}\big|_{\partial p}$ is the corresponding toroidal bulk-flow velocity
    component, and the sums run over all ion species and charge states.

    The scope is the total ion fluid at the plasma-boundary surface: all ion
    species and all charge states contribute, with intensive velocity values
    averaged by density rather than summed. It excludes electrons and neutrals,
    the radial component along $\hat{R}$ or any poloidal component in the
    $R$-$Z$ plane of the right-handed cylindrical $(R,\phi,Z)$ frame, and the
    ion velocity magnitude. A transport-model convection velocity is outside
    this definition unless it is explicitly the same density-weighted toroidal
    bulk-flow component at the plasma boundary.

    This parent fixes toroidal projection, total-ion population aggregation, and
    plasma-boundary locus, but it does not by itself prescribe an additional
    averaging operation over the boundary surface. The [flux-surface-averaged
    toroidal ion velocity at the plasma
    boundary](name:flux_surface_averaged_toroidal_ion_velocity_at_plasma_boundary)
    is a more specific child that adds flux-surface averaging to the same
    quantity rather than adding the toroidal, ion-population, or boundary
    qualifiers.

    Sign convention: Positive when the total-ion bulk flow at the plasma
    boundary is in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: m.s^-1

- name: toroidal_iron_velocity_at_pedestal_top
  description: |-
    Density-weighted toroidal bulk-flow velocity of ionized iron at the
    core-side shoulder of the H-mode edge transport barrier, resolved along
    increasing toroidal angle in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Toroidal iron velocity at the pedestal top is the density-weighted mean
    bulk-flow velocity of ionized iron ions at the core-side shoulder of the
    H-mode edge transport barrier. It includes all populated iron charge states
    from Fe+ through fully stripped iron and excludes neutral iron.

    For charge states $q=1,\ldots,26$, the velocity is defined by

    $$
    v_\phi^{\mathrm{Fe}} = \frac{\sum_{q=1}^{26} n_q u_{\phi,q}}{\sum_{q=1}^{26} n_q}
    $$

    where $n_q$ is the number density of iron charge state $q$ in m$^{-3}$,
    $u_{\phi,q}$ is its toroidal bulk-flow component in m s$^{-1}$, and
    $v_\phi^{\mathrm{Fe}}$ is the resulting density-weighted velocity. This
    charge-state aggregation is distinct from a charge-state-resolved velocity
    and is analogous to [toroidal krypton velocity at the pedestal
    top](name:toroidal_krypton_velocity_at_pedestal_top); its locus differs from
    [toroidal iron velocity at the internal transport
    barrier](name:toroidal_iron_velocity_at_internal_transport_barrier).

    Sign convention: Positive when the density-weighted iron-ion flow points in
    the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is
    vertical height.
  unit: m.s^-1

- name: toroidal_iron_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the bulk-flow velocity of iron impurity ions evaluated
    at the last closed flux surface in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    This quantity is the local toroidal projection of the bulk-flow velocity of
    iron impurity ions at the last closed flux surface. The iron bulk-flow
    velocity is the density-weighted mean over all included iron ionization
    states.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the projection is
    defined by

    $$
    v_{\phi,\mathrm{Fe}} = \mathbf{v}_{\mathrm{Fe}} \cdot \hat{\phi}
    $$

    where $v_{\phi,\mathrm{Fe}}$ is the toroidal velocity component,
    $\mathbf{v}_{\mathrm{Fe}}$ is the iron impurity-ion bulk-flow velocity, and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal
    angle $\phi$; $R$ is major radius and $Z$ is vertical height.

    The value is local to the plasma boundary and is distinct from the
    flux-surface-averaged toroidal iron velocity, which averages the same
    projection over that surface. It is the iron-species counterpart of
    [toroidal carbon velocity at the plasma
    boundary](name:toroidal_carbon_velocity_at_plasma_boundary).

    Sign convention: Positive when the iron bulk-flow velocity has a component
    in the direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_krypton_velocity_at_pedestal_top
  description: |-
    Toroidal krypton velocity at the pedestal top is the toroidal component of
    the density-weighted mean krypton ion bulk-flow velocity at the H-mode
    pedestal top, taken over all krypton charge states. It is resolved along
    increasing toroidal angle φ in the right-handed cylindrical (R, φ, Z) frame,
    where R is major radius and Z is vertical height.
  documentation: |-
    Toroidal krypton velocity at the pedestal top is the toroidal component of
    the krypton ion bulk-flow velocity evaluated at the H-mode pedestal-top
    reference location. As a species-level intensive quantity, it is the
    density-weighted mean over all krypton ion charge states, not a sum of
    charge-state velocities. The toroidal direction is the $\hat{\phi}$ basis
    direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    The charge-state aggregation and toroidal projection are defined by

    $$
    v_{\phi}^{\mathrm{Kr}} = \frac{\sum_q n_{\mathrm{Kr}^{q+}}\left(\mathbf{v}_{\mathrm{Kr}^{q+}} \cdot \hat{\phi}\right)}{\sum_q n_{\mathrm{Kr}^{q+}}}
    $$

    where $q$ indexes krypton ion charge states, $n_{\mathrm{Kr}^{q+}}$ is the
    number density of charge state $q$ in m$^{-3}$,
    $\mathbf{v}_{\mathrm{Kr}^{q+}}$ is its bulk-flow velocity, and
    $v_{\phi}^{\mathrm{Kr}}$ is the resulting signed species-level toroidal
    velocity.

    This quantity is inferred from krypton line spectroscopy or other
    impurity-flow diagnostics localized near the pedestal top, with
    viewing-geometry corrections used to isolate the toroidal component. Because
    line emission is often charge-state selective, interpretation must map
    measured charge-state velocities onto the density-weighted species mean.
    Momentum-balance or radial-force-balance analysis may combine this quantity
    with poloidal krypton velocity at the pedestal top, pressure-gradient,
    electric-field, and magnetic-field information.

    No universal krypton-specific pedestal range applies across devices.
    Representative signed impurity toroidal velocities at pedestal-top
    conditions are commonly in the range $-5 \times 10^4$ to $5 \times 10^4$
    m.s$^{-1}$, with higher-rotation cases approaching $\pm 10^5$ m.s$^{-1}$ in
    either toroidal direction.

    Sign convention: Positive when the density-weighted krypton ion bulk flow at
    the pedestal top is along $+\hat{\phi}$, the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: toroidal_krypton_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the local bulk flow velocity of krypton impurity ions
    at the plasma boundary, projected along the φ direction of the right-handed
    cylindrical (R, φ, Z) frame. It is a density-weighted mean over all krypton
    ionization states represented in the plasma.
  documentation: |-
    Toroidal component of the local bulk flow velocity of krypton impurity ions
    at the plasma boundary is the projection of the krypton ion bulk-flow
    velocity onto the toroidal direction at the last closed flux surface. In the
    right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. As an intensive species-level
    quantity, the krypton bulk-flow velocity is the density-weighted mean over
    all krypton ionization states represented in the plasma.

    The boundary value is defined by projecting the charge-state-averaged
    krypton bulk-flow velocity onto the toroidal unit vector at the last closed
    flux surface:

    $$
    \left. v_{\phi,\mathrm{Kr}} \right|_{\mathrm{LCFS}}
    =
    \left.
    \left(
    \frac{\sum_z n_{\mathrm{Kr}^{z+}}\mathbf{v}_{\mathrm{Kr}^{z+}}}{\sum_z n_{\mathrm{Kr}^{z+}}}
    \right) \cdot \hat{\phi}
    \right|_{\mathrm{LCFS}}
    $$

    where $v_{\phi,\mathrm{Kr}}$ is the toroidal krypton bulk-flow velocity, $z$
    indexes krypton ionization states, $n_{\mathrm{Kr}^{z+}}$ is the number
    density of krypton ions in ionization state $z$,
    $\mathbf{v}_{\mathrm{Kr}^{z+}}$ is the bulk-flow velocity vector of that
    ionization state, and $\hat{\phi}$ is the unit vector in the direction of
    increasing toroidal angle.

    This quantity is a local boundary value, not a flux-surface average; any
    flux-surface-averaged krypton boundary velocity denotes an additional
    average over the last closed flux surface. The unqualified krypton species
    label denotes the density-weighted mean over charge states, not a sum of
    velocity components.
  unit: m.s^-1

- name: toroidal_lithium_velocity_at_pedestal_top
  description: |-
    Toroidal component of the lithium impurity ion fluid velocity evaluated at
    the H-mode pedestal top. It represents the local azimuthal rotation of
    lithium impurity ions at the steep-gradient edge transport barrier, not a
    pedestal-region average.
  documentation: |-
    The toroidal lithium ion fluid velocity at the pedestal top is the
    $\hat{\phi}$-projection of the lithium impurity ion mean velocity vector at
    the radial reference location where the H-mode edge transport barrier
    steep-gradient region joins the flatter core profile. This is a
    point-evaluated quantity, not a spatial average over the pedestal region.

    The toroidal component is defined as:

    $$
    v_{\phi}^{\mathrm{Li}} = \mathbf{v}_{\mathrm{Li}} \cdot \hat{\phi}
    $$

    where $\mathbf{v}_{\mathrm{Li}}$ is the lithium ion fluid velocity vector
    and $\hat{\phi}$ is the unit vector in the direction of increasing toroidal
    angle in the right-handed cylindrical $(R, \phi, Z)$ frame.

    Lithium toroidal rotation at the pedestal is inferred from charge exchange
    recombination spectroscopy (CXRS) using Doppler shifts of lithium spectral
    lines following charge exchange with an injected neutral beam. The
    pedestal-top reference location is identified from the steep-gradient region
    of the relevant kinetic profile. Comparable pedestal-top rotation
    measurements for other impurity species are provided by
    [toroidal_iron_velocity_at_pedestal_top](name:toroidal_iron_velocity_at_pedestal_top)
    and
    [toroidal_oxygen_velocity_at_pedestal_top](name:toroidal_oxygen_velocity_at_pedestal_top);
    the lithium ion rotation at other radial reference points is covered by
    [toroidal_lithium_velocity_at_magnetic_axis](name:toroidal_lithium_velocity_at_magnetic_axis)
    and
    [toroidal_lithium_velocity_at_internal_transport_barrier](name:toroidal_lithium_velocity_at_internal_transport_barrier).

    Sign convention: Positive when $v_{\phi}^{\mathrm{Li}}$ points in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_neon_velocity_at_pedestal_top
  description: |-
    Toroidal component of the density-weighted neon-ion fluid velocity at the
    core-side top of the H-mode edge transport barrier.
  documentation: |-
    Toroidal neon-ion velocity at the H-mode pedestal top is the
    density-weighted mean of the toroidal fluid velocities of all represented
    neon ion charge states at the core-side shoulder of the edge transport
    barrier. It is a signed projection in the right-handed cylindrical $(R,
    \phi, Z)$ frame.

    $$
    V_{\mathrm{Ne},\phi} = \frac{\sum_q n_{\mathrm{Ne},q} v_{\mathrm{Ne},q,\phi}}{\sum_q n_{\mathrm{Ne},q}}
    $$

    Here, $q$ labels neon ion charge state, $n_{\mathrm{Ne},q}$ is its number
    density, and $v_{\mathrm{Ne},q,\phi}$ is its toroidal fluid-velocity
    component. The quantity is distinguished from [toroidal neon velocity at the
    internal transport
    barrier](name:toroidal_neon_velocity_at_internal_transport_barrier) by its
    pedestal-top location and is a species-specific counterpart of [toroidal
    hydrogen velocity at the pedestal
    top](name:toroidal_hydrogen_velocity_at_pedestal_top).

    Sign convention: Positive when the neon-ion flow has a component in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_neon_velocity_at_plasma_boundary
  description: |-
    Toroidal neon velocity at the plasma boundary is the toroidal component of
    the density-weighted bulk velocity of neon impurity ions at the last closed
    flux surface, in the right-handed cylindrical (R, φ, Z) frame. It is the
    density-weighted mean over all neon ion charge states and is local, not a
    flux-surface average.
  documentation: |-
    Toroidal neon velocity at the plasma boundary is the toroidal component of
    the density-weighted bulk velocity of neon impurity ions at the last closed
    flux surface. The toroidal component is taken in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height. Because no neon ionization state
    is specified, the elemental neon velocity is the density-weighted mean over
    all neon ion charge states present at that locus.

    The component and charge-state aggregation are defined by

    $$
    v_{\phi,\mathrm{Ne}} = \left(\frac{\sum_q n_{\mathrm{Ne}^{q+}}\,\mathbf{v}_{\mathrm{Ne}^{q+}}}{\sum_q n_{\mathrm{Ne}^{q+}}}\right) \cdot \hat{\phi}
    $$

    where $q$ indexes neon ion charge states, $n_{\mathrm{Ne}^{q+}}$ is the
    number density of charge state $q$, $\mathbf{v}_{\mathrm{Ne}^{q+}}$ is its
    bulk velocity, and $\hat{\phi}$ is the unit vector in the direction of
    increasing toroidal angle $\phi$.

    This quantity is a local boundary value and does not imply a flux-surface
    average, poloidal average, toroidal average, or charge-state sum. The
    flux-surface-averaged boundary counterpart is
    toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary; the same
    toroidal component at other radial loci includes
    [toroidal_neon_velocity_at_magnetic_axis](name:toroidal_neon_velocity_at_magnetic_axis)
    and
    [toroidal_neon_velocity_at_internal_transport_barrier](name:toroidal_neon_velocity_at_internal_transport_barrier).

    Sign convention: Positive when the density-weighted neon ion flow is in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: toroidal_neutral_state_momentum_source
  description: |-
    Toroidal component of the area-normalized net momentum-transfer source for a
    specified neutral internal state, resolved in the right-handed cylindrical
    (R, φ, Z) frame.
  documentation: |-
    The toroidal component of the area-normalized momentum source term for a
    neutral internal state is the signed projection of the state-resolved net
    momentum-transfer source onto the local toroidal direction. It represents
    the toroidal part of the area-normalized momentum exchange between that
    neutral internal state and the plasma or other interacting populations.

    The component is defined by projection onto the toroidal unit vector of the
    right-handed cylindrical $(R, \phi, Z)$ frame:

    $$
    S_{\phi,n,\alpha} = \mathbf{S}_{n,\alpha} \cdot \hat{\mathbf{e}}_\phi
    $$

    where $S_{\phi,n,\alpha}$ is the toroidal momentum-source component,
    $\mathbf{S}_{n,\alpha}$ is the area-normalized vector momentum source for
    neutral species $n$ in internal state $\alpha$, and $\hat{\mathbf{e}}_\phi$
    is the unit vector in the direction of increasing toroidal angle $\phi$.
    Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    coordinate.

    This quantity is resolved for the specified neutral internal state:
    contributions from other neutral internal states are excluded, and no sum
    over neutral internal states is implied. It applies to the edge-plasma
    momentum exchange and uses the net source rather than an individual transfer
    process.

    This component is derived from the vector [neutral state momentum
    source](name:neutral_internal_state_momentum_source). It is distinct from
    the state-summed [toroidal neutral momentum
    source](name:toroidal_neutral_momentum_source), which combines the
    corresponding toroidal contributions from all neutral internal states, and
    from the field-aligned [parallel neutral state momentum
    source](name:parallel_neutral_state_momentum_source), which uses a different
    projection direction.

    Sign convention: Positive when the area-normalized net momentum-transfer
    source for the specified neutral internal state has a component in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: kg.m^-1.s^-2

- name: toroidal_nitrogen_velocity_at_pedestal_top
  description: |-
    Density-weighted toroidal flow velocity of ionized nitrogen across its
    charge states, evaluated at the core-side shoulder of the H-mode edge
    transport barrier.
  documentation: |-
    The toroidal nitrogen velocity at the pedestal top is the density-weighted
    mean flow of ionized nitrogen ions over all nitrogen charge states at the
    core-side shoulder of the H-mode edge transport barrier. It describes flow
    rather than abundance, which is represented by nitrogen density at the
    pedestal top.

    For nitrogen charge states $q=1,\ldots,7$, the species velocity is defined
    by

    $$
    v_{\phi,N} = \frac{\sum_{q=1}^{7} n_q v_{\phi,q}}{\sum_{q=1}^{7} n_q}
    $$

    where $n_q$ is the number density of charge state $q$ in m$^{-3}$ and
    $v_{\phi,q}$ is its toroidal velocity in m s$^{-1}$, measured in the
    right-handed cylindrical $(R,\phi,Z)$ frame. Neutral nitrogen is excluded.
    The pedestal-top value is distinguished from the corresponding [toroidal
    nitrogen velocity at the magnetic
    axis](name:toroidal_nitrogen_velocity_at_magnetic_axis) by its edge-barrier
    location.

    Sign convention: Positive when the density-weighted velocity points in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_nitrogen_velocity_at_plasma_boundary
  description: |-
    Density-weighted toroidal bulk-flow velocity of nitrogen ions, evaluated on
    the last closed magnetic flux surface at the plasma boundary.
  documentation: |-
    The toroidal nitrogen-ion bulk-flow velocity is the density-weighted mean
    directed motion of all nitrogen ion charge states along the geometric
    toroidal direction at the plasma boundary, which is the last closed magnetic
    flux surface.

    The charge-state-averaged velocity is defined by

    $$
    v_{\phi,\mathrm{N}} = \frac{\sum_z n_{\mathrm{N},z} v_{\phi,\mathrm{N},z}}{\sum_z n_{\mathrm{N},z}}
    $$

    where $z$ is the nitrogen ion charge-state index, $n_{\mathrm{N},z}$ is the
    number density of that charge state, and $v_{\phi,\mathrm{N},z}$ is its
    toroidal bulk-flow velocity. Neutral nitrogen is excluded. The corresponding
    [toroidal oxygen velocity at the plasma
    boundary](name:toroidal_oxygen_velocity_at_plasma_boundary) has the same
    definition with oxygen replacing nitrogen, while [toroidal nitrogen velocity
    at the magnetic axis](name:toroidal_nitrogen_velocity_at_magnetic_axis) uses
    a different evaluation locus.
  unit: m.s^-1

- name: toroidal_oxygen_velocity_at_pedestal_top
  description: |-
    Toroidal component of the oxygen impurity ion fluid velocity evaluated at
    the H-mode pedestal reference location, projected along the direction of
    increasing toroidal angle in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The toroidal oxygen velocity at the pedestal top characterizes the impurity
    ion fluid flow projected onto the $\hat{\phi}$ direction at the H-mode edge
    transport barrier's outer shoulder, where the steep-gradient pedestal region
    transitions to the flatter core profile. Oxygen (atomic number $Z = 8$) is a
    common intrinsic or deliberately seeded impurity in tokamaks, present in
    charge states spanning O$^{5+}$ through O$^{8+}$ in the pedestal; this
    quantity represents the oxygen fluid velocity aggregated over the
    predominant charge states unless a specific ionization state is separately
    resolved.

    The toroidal component is defined by the projection:

    $$
    v_{\phi,\mathrm{O}} = \mathbf{v}_{\mathrm{O}} \cdot \hat{\phi}
    $$

    where $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    and $\mathbf{v}_{\mathrm{O}}$ is the oxygen ion fluid velocity vector
    evaluated at the pedestal-top locus.

    This quantity is measured via charge exchange recombination spectroscopy,
    which resolves the Doppler shift of oxygen emission lines following charge
    exchange with an injected neutral beam. Toroidal rotation velocities at the
    pedestal top in H-mode span roughly $10^3$–$10^5$ m s$^{-1}$, reflecting
    neutral beam torque input, intrinsic rotation, and impurity-specific flow
    corrections. Comparison with
    [toroidal_nitrogen_velocity_at_pedestal_top](name:toroidal_nitrogen_velocity_at_pedestal_top)
    and
    [toroidal_neon_velocity_at_pedestal_top](name:toroidal_neon_velocity_at_pedestal_top)
    enables cross-species benchmarking of pedestal rotation profiles.

    Sign convention: Positive when the oxygen ion flow is directed in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_oxygen_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the oxygen impurity ion bulk flow velocity evaluated
    at the plasma boundary (last closed flux surface).
  documentation: |-
    The toroidal velocity of oxygen impurity ions at the plasma boundary
    quantifies the toroidal momentum carried by the oxygen ion population at the
    last closed flux surface, which separates the magnetically confined plasma
    from the open-field-line scrape-off layer. This local point value is
    distinct from the flux-surface-averaged quantity
    toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary, which
    integrates the velocity weighted by the boundary flux-surface geometry.

    The toroidal component $v_\phi$ is the projection of the oxygen bulk flow
    velocity onto the toroidal direction:

    $$
    v_\phi = \mathbf{v}_\mathrm{O} \cdot \hat{\phi}
    $$

    where $\mathbf{v}_\mathrm{O}$ is the oxygen ion bulk flow velocity and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal
    angle in the right-handed cylindrical $(R, \phi, Z)$ frame.

    Oxygen toroidal velocity at the boundary is primarily measured by charge
    exchange recombination spectroscopy (CXRS), exploiting the Doppler shift of
    oxygen emission lines to extract the ion flow velocity component along
    $\hat{\phi}$. Analogous boundary velocities for other impurity species
    include
    [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary)
    and
    [toroidal_neon_velocity_at_plasma_boundary](name:toroidal_neon_velocity_at_plasma_boundary).

    Sign convention: Positive when the oxygen ion flow is directed in the
    direction of increasing toroidal angle $\phi$ (counter-clockwise when viewed
    from above in the $+\hat{Z}$ direction).
  unit: m.s^-1

- name: toroidal_plasma_momentum_at_pedestal_top
  description: |-
    Toroidal plasma momentum at the pedestal top is the volume-integrated
    toroidal linear momentum of the confined plasma inside the pedestal-top flux
    surface, summed over electrons and all ion species. It is the pedestal-top
    endpoint of total toroidal plasma momentum, not a local momentum density or
    toroidal angular momentum.
  documentation: |-
    Toroidal plasma momentum at the pedestal top is the cumulative toroidal
    component of plasma linear momentum contained inside the flux surface
    located at the top of the H-mode pedestal, summed over electrons and all ion
    species. The toroidal component is taken in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle,
    and $Z$ is vertical height.

    Let $\rho_{\mathrm{ped}}$ denote the radial flux-surface label of the
    pedestal-top flux surface and let $V(\rho_{\mathrm{ped}})$ be the plasma
    volume enclosed by that surface. The quantity is the radial cumulative
    [toroidal_total_plasma_momentum](name:toroidal_total_plasma_momentum)
    evaluated at the pedestal-top endpoint:

    $$
    P_{\phi,\mathrm{ped}} = P_\phi(\rho_{\mathrm{ped}}) = \int_{V(\rho_{\mathrm{ped}})} \sum_s m_s n_s(\mathbf{x}) v_{\phi,s}(\mathbf{x})\, dV
    $$

    where $P_\phi(\rho)$ is the cumulative toroidal plasma momentum inside the
    flux surface labeled by $\rho$, $s$ indexes electrons and all ion species,
    $m_s$ is the species particle mass, $n_s$ is the species number density,
    $v_{\phi,s}$ is the signed toroidal velocity component, $\mathbf{x}$ is
    position, and $dV$ is the volume element.

    This quantity is an endpoint value of a volume-integrated radial function:
    it is not the local toroidal momentum density $\sum_s m_s n_s v_{\phi,s}$ on
    the pedestal-top surface, and it is not a flux-surface average. It is also
    not toroidal angular momentum; the angular-momentum integral would include
    the moment arm $R$ multiplying the toroidal linear-momentum density. The
    same cumulative quantity has related endpoint values at the [magnetic
    axis](name:toroidal_plasma_momentum_at_magnetic_axis) and at the plasma
    boundary.

    Sign convention: Positive when the net toroidal plasma momentum points in
    the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: kg.m.s^-1

- name: toroidal_tungsten_velocity_at_pedestal_top
  description: |-
    Density-weighted mean toroidal velocity of tungsten impurity ions at the
    H-mode pedestal top, averaged over all tungsten ion charge states.
  documentation: |-
    The toroidal tungsten velocity at the H-mode pedestal top is the
    density-weighted mean of the toroidal fluid velocities of tungsten impurity
    ions over their ionization states. It is evaluated at the core-side shoulder
    of the edge transport barrier in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    The defining charge-state average is

    $$
    V_{\phi,\mathrm{W}} = \frac{\sum_q n_q v_{\phi,q}}{\sum_q n_q}
    $$

    where $V_{\phi,\mathrm{W}}$ is the tungsten toroidal velocity, $n_q$ is the
    number density of tungsten ions in charge state $q$, and $v_{\phi,q}$ is
    their toroidal velocity component.

    The average is density-weighted over tungsten ion charge states, not a sum
    of velocities and not a flux-surface average. It therefore differs from the
    toroidal flux-surface-averaged tungsten velocity at the plasma boundary;
    [toroidal carbon velocity at the pedestal
    top](name:toroidal_carbon_velocity_at_pedestal_top) is the analogous
    species-specific quantity.

    Sign convention: Positive when the tungsten velocity component points in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_tungsten_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the density-weighted bulk velocity of tungsten
    impurity ions at the last closed flux surface separating confined plasma
    from the scrape-off layer.
  documentation: |-
    This quantity is the local toroidal projection of the tungsten impurity-ion
    bulk velocity at the plasma boundary, defined on the last closed flux
    surface separating confined plasma from the scrape-off layer. It is a
    density-weighted mean over the included tungsten ion charge states.

    $$
    v_{\\phi,\\mathrm{W}}(\\mathbf{x}_b)=\\frac{\\sum_q n_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)\\left[\\mathbf{v}_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)\\cdot\\hat{\\boldsymbol{\\phi}}\\right]}{\\sum_q n_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)}
    $$

    Here, $q$ is the tungsten ion charge state, $n_{\\mathrm{W}^{q+}}$ is its
    number density, $\\mathbf{v}_{\\mathrm{W}^{q+}}$ is its bulk velocity,
    $\\mathbf{x}_b$ is a point on the boundary, and $\\hat{\\boldsymbol{\\phi}}$
    is the toroidal unit vector in the right-handed cylindrical $(R, \\phi, Z)$
    frame. Unlike
    toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary, this
    quantity is local rather than flux-surface averaged.

    Sign convention: Positive when the tungsten-ion velocity component points in
    the direction of increasing toroidal angle $\\phi$.
  unit: m.s^-1

- name: toroidal_xenon_velocity_at_pedestal_top
  description: |-
    Density-weighted toroidal bulk-flow velocity of xenon ions, averaged over
    all ionization states at the core-side shoulder of the H-mode edge transport
    barrier.
  documentation: |-
    This quantity is the toroidal component of the xenon-ion bulk-flow velocity
    at the H-mode pedestal top. It is the density-weighted mean over all xenon
    ionization states, rather than a sum of their velocities.

    $$
    V_{\phi,\mathrm{Xe}} = \frac{\sum_q n_{\mathrm{Xe},q} V_{\phi,\mathrm{Xe},q}}{\sum_q n_{\mathrm{Xe},q}}
    $$

    Here $q$ labels xenon ionization state, $n_{\mathrm{Xe},q}$ is the number
    density of that state, and $V_{\phi,\mathrm{Xe},q}$ is its toroidal
    bulk-flow component. The denominator is the total xenon ion density
    corresponding to xenon density at the pedestal top. The value is evaluated
    at the core-side shoulder of the H-mode edge transport barrier and is
    distinct from [toroidal xenon velocity at the internal transport
    barrier](name:toroidal_xenon_velocity_at_internal_transport_barrier) and
    [toroidal xenon velocity at the magnetic
    axis](name:toroidal_xenon_velocity_at_magnetic_axis).

    Sign convention: Positive when the velocity component along $\hat{\phi}$ is
    positive in the right-handed cylindrical $(R, \phi, Z)$ frame, in the
    direction of increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: toroidal_xenon_velocity_at_plasma_boundary
  description: |-
    Toroidal component of the xenon-ion bulk-flow velocity evaluated on the
    plasma boundary, the last closed flux surface.
  documentation: |-
    This quantity is the local xenon-ion bulk-flow velocity projected onto the
    geometric toroidal direction at the plasma boundary. The xenon-ion bulk
    velocity is the density-weighted mean over all xenon ion charge states and
    excludes thermal random motion.

    $$
    v_\phi = \mathbf{v}_{\mathrm{Xe}} \cdot \hat{\boldsymbol{\phi}}
    $$

    where $\mathbf{v}_{\mathrm{Xe}}$ is the xenon-ion bulk-flow velocity in m
    s$^{-1}$ and $\hat{\boldsymbol{\phi}}$ is the toroidal unit vector of the
    right-handed cylindrical $(\hat{R}, \hat{\phi}, \hat{Z})$ frame. The plasma
    boundary is the last closed magnetic flux surface. This local value is
    distinct from the flux-surface average
    toroidal_flux_surface_averaged_xenon_velocity_at_plasma_boundary.

    Sign convention: Positive when $v_\phi$ points in the direction of
    increasing toroidal angle $\phi$.
  unit: m.s^-1

- name: total_ion_decay_length_over_scrape_off_layer
  description: |-
    Positive e-folding distance for the outward decrease of total ion number
    density across magnetic flux surfaces in the scrape-off layer.
  documentation: |-
    This quantity is the positive cross-field decay length of the total ion
    number density in the scrape-off layer. It is the species- and
    charge-state-summed specialization of ion decay length over the scrape-off
    layer.

    $$
    \lambda_{i,\mathrm{tot}} = \left|\frac{1}{n_{i,\mathrm{tot}}}\frac{\partial n_{i,\mathrm{tot}}}{\partial \ell_\perp}\right|^{-1}
    $$

    Here $n_{i,\mathrm{tot}}$ is the total ion number density, summed over the
    included ion species and charge states, and $\ell_\perp$ is outward distance
    normal to magnetic flux surfaces, measured in m. The quantity excludes
    electron and neutral-particle densities and is non-negative by definition.
  unit: m

- name: total_ion_density_at_plasma_boundary
  description: |-
    Total ion number density at the plasma boundary is the local particle count
    per volume, summing all charged ion species and charge states while
    excluding neutrals.
  documentation: |-
    Total ion density at the plasma boundary is the local number density of all
    positively charged ion populations at the separatrix, the last closed flux
    surface separating confined plasma from the open-field-line scrape-off
    layer. It is the charge-state-summed specialization of ion density at the
    plasma boundary.

    The total ion density is defined by

    $$
    n_i^{\mathrm{tot}} = \sum_s \sum_{Z\geq 1} n_{s,Z}
    $$

    where $n_{s,Z}$ is the number density of ion species $s$ in charge state
    $Z$, and the sums include every charged ion species and charge state present
    at the boundary.

    Neutral particles are excluded, and each ion contributes one particle
    regardless of its charge. The corresponding surface average is
    flux-surface-averaged total ion density at the plasma boundary, which
    averages this local quantity over the separatrix.
  unit: m^-3

- name: flux_surface_averaged_total_ion_density_at_plasma_boundary
  description: |-
    Flux-surface-averaged number density of all charged ion species at the
    plasma boundary, summed over charge states and excluding neutral particles.
  documentation: |-
    Number density of ion

    The flux-surface average is defined by

    $$
    \langle n_i\rangle = \oint n_i\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_i\rangle$ is the averaged total ion number density, $n_i$
    is the local total ion number density, $S$ is the plasma-boundary flux
    surface, $dS$ is its surface element, and $\psi$ is the poloidal magnetic
    flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity includes all charged ion species and is summed over their
    positive charge states; neutral particles are excluded. It is a flux-surface
    average rather than a local point value, a volume average, or a
    neutral-inclusive density.

    It is the averaged counterpart of the local [total ion number density at the
    plasma boundary](name:total_ion_density_at_plasma_boundary), replacing that
    pointwise value with inverse-poloidal-flux-gradient weighting. It differs
    from the [line-averaged total ion
    density](name:line_averaged_total_ion_density), which averages the same
    charge-state-summed ion population along a specified plasma chord rather
    than over the plasma-boundary flux surface.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.

    Related quantities:
    [flux_surface_averaged_electron_density_at_plasma_boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary),
    [flux_surface_averaged_ion_density_at_plasma_boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary).
  unit: m^-3

- name: total_momentum_convection_velocity
  description: |-
    Effective velocity coefficient for advective, non-diffusive transport of
    total plasma momentum, distinct from the plasma bulk flow velocity.
  documentation: |-
    This quantity is the effective coefficient describing the advective,
    non-diffusive transport of total plasma momentum for a selected momentum
    component and transport direction. It is a transport closure quantity, not
    an actual plasma bulk flow velocity.

    For each selected total-momentum component and transport direction, the
    convective total-momentum flux is defined by

    $$
    \Gamma_{P_\mathrm{tot},\mathrm{conv}} = V_{\mathrm{tot},\mathrm{conv}} P_\mathrm{tot}
    $$

    where $\Gamma_{P_\mathrm{tot},\mathrm{conv}}$ is the corresponding
    convective flux of total plasma momentum, $V_{\mathrm{tot},\mathrm{conv}}$
    is the total momentum convection velocity, and $P_\mathrm{tot}$ is the
    corresponding total plasma momentum density. The definition applies
    componentwise when the momentum component or transport direction is
    resolved.

    The scope is total plasma momentum only; it does not denote
    species-resolved, charge-state-resolved, neutral-only, or
    attributed-contribution momentum convection velocities. A resolved
    projection of this quantity is the [parallel total momentum convection
    velocity](name:parallel_total_momentum_convection_velocity).

    Sign convention: Positive when the associated convective total-momentum flux
    is in the chosen positive transport direction for positive transported
    total-momentum density.
  unit: m.s^-1

- name: total_power_at_separatrix
  description: |-
    Net energy power leaving the confined plasma through the last closed
    magnetic flux surface and entering the scrape-off layer.
  documentation: |-
    Separatrix power is the net global energy loss from the confined plasma into
    the scrape-off layer across the last closed magnetic flux surface. It
    represents the aggregate power crossing the entire separatrix rather than a
    local surface value.

    The defining boundary integral is

    $$
    P_{\rm sep} = \oint_{S_{\rm sep}} \mathbf{S}_E \cdot \hat{\mathbf{n}}\, dA
    $$

    where $P_{\rm sep}$ is the separatrix power, $S_{\rm sep}$ is the last
    closed magnetic flux surface, $\mathbf{S}_E$ is the net plasma-energy flux
    density, $\hat{\mathbf{n}}$ is the unit normal directed from the confined
    plasma toward the scrape-off layer, and $dA$ is an element of separatrix
    area.

    This is a total, net quantity integrated over the complete separatrix. It
    applies to the confined plasma as a whole, with no selection of species,
    reaction channel, or individual transport mechanism; outward energy transfer
    is the plasma loss represented by the quantity. It is not a pointwise
    energy-flux density or a power associated with a single surface location.

    The boundary total is distinct from [radiated power over the core
    region](name:radiated_power_over_core_region), which describes
    electromagnetic power emitted within the core and is not necessarily equal
    to power crossing the separatrix. It is also distinct from [power due to
    conduction](name:power_due_to_conduction), which describes
    conduction-mediated power deposited on plasma-facing surfaces downstream of
    the separatrix.
  unit: W

- name: tritium_density_at_pedestal_top
  description: |-
    Tritium ion number density at the top of the H-mode edge pedestal, summed
    over all tritium charge states.
  documentation: |-
    Tritium ion number density at the top of the H-mode edge pedestal is the
    local concentration of tritium ions at the core-side shoulder of the edge
    transport barrier.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{T}} = \sum_z n_{\mathrm{T}}^{z+}
    $$

    where $n_{\mathrm{T}}$ is the tritium ion number density,
    $n_{\mathrm{T}}^{z+}$ is the number density of tritium ions with charge
    state $z$, and $z$ is the positive integer charge state. For tritium, the
    physically ionized population has one positive charge state, so the sum
    reduces to the density of singly ionized tritium.

    The quantity applies only to tritium ions and is evaluated locally at the
    pedestal top, whose position is defined by the [normalized poloidal flux
    coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is not a
    chord-, volume-, or species-averaged density, and it excludes neutral
    tritium and all non-tritium species.

    This is the tritium-specific component of [density at the pedestal
    top](name:density_at_pedestal_top), rather than the corresponding total or
    non-species-resolved density. The same tritium ion density concept evaluated
    at a different transport-barrier location is [tritium density at the
    internal transport
    barrier](name:tritium_density_at_internal_transport_barrier).
  unit: m^-3

- name: tritium_density_at_plasma_boundary
  description: |-
    Number density of tritium ions at the plasma boundary, evaluated as the
    local, intensive particle count per physical volume on the last closed
    magnetic flux surface.
  documentation: |-
    Number density of tritium ions at the plasma boundary is the local,
    intensive particle count per physical volume for the tritium-ion population
    evaluated on the last closed magnetic flux surface. The plasma boundary is
    the limiting closed magnetic flux surface separating confined plasma from
    the open-field-line scrape-off-layer region.

    The local tritium-ion number density is the zeroth velocity moment of the
    tritium-ion distribution function at a boundary point:

    $$
    n_\mathrm{T}(\mathbf{x}_b,t) = \int f_\mathrm{T}(\mathbf{x}_b,\mathbf{v},t)\,d^3v
    $$

    where $n_\mathrm{T}$ is the tritium-ion number density, $\mathbf{x}_b$ is a
    point on the last closed magnetic flux surface, $t$ is time, $\mathbf{v}$ is
    tritium-ion velocity, $f_\mathrm{T}$ is the tritium-ion phase-space
    distribution function, and $d^3v$ is the velocity-space volume element.

    This quantity applies specifically to ionized tritium and excludes neutral
    tritium, deuterium, protium, electrons, impurity ions, and total ion
    density. It is a local boundary value, with no averaging over the boundary
    surface or over a volume; for tritium, the relevant positive ion population
    is singly ionized tritium, so no aggregation over multiple positive
    ionization stages is applied.

    It is the tritium-specific instance of [density at the plasma
    boundary](name:density_at_plasma_boundary). The related
    flux-surface-averaged tritium density at the plasma boundary instead
    represents the average of tritium-ion density over the same last closed
    magnetic flux surface, while [hydrogen density at the plasma
    boundary](name:hydrogen_density_at_plasma_boundary) and [deuterium density
    at the plasma boundary](name:deuterium_density_at_plasma_boundary) refer to
    different hydrogen-isotope ion populations.
  unit: m^-3

- name: flux_surface_averaged_tritium_density_at_plasma_boundary
  description: |-
    Number density of tritium ions averaged over the plasma boundary, summed
    over all tritium ion charge states and excluding neutral tritium.
  documentation: |-
    Number density of tritium

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{T}}\rangle = \oint n_{\mathrm{T}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{T}}\rangle$ is the averaged tritium-ion number
    density, $n_{\mathrm{T}}$ is the local tritium-ion number density, $S$ is
    the plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is
    the poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity is summed over all tritium ion charge states and excludes
    neutral tritium. It is a flux-surface average, not a local point value,
    volume average, or chord average.

    The average is formed from the local [tritium density at the plasma
    boundary](name:tritium_density_at_plasma_boundary) by applying
    inverse-poloidal-flux-gradient weighting over the surface. It differs from
    the [volume-averaged tritium density](name:volume_averaged_tritium_density),
    which uses a volume rather than a flux-surface domain.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: tungsten_density_at_pedestal_top
  description: |-
    Tungsten ion number density at the top of the H-mode edge pedestal is the
    local concentration of ionized tungsten, summed over all tungsten charge
    states.
  documentation: |-
    Tungsten ion number density at the top of the H-mode edge pedestal is the
    local concentration of ionized tungsten at the inner shoulder of the H-mode
    transport barrier.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{W}} = \sum_{q=1}^{Z_{\mathrm{W}}} n_{\mathrm{W}^{q+}}
    $$

    where $n_{\mathrm{W}}$ is the total tungsten-ion number density, $q$ is the
    positive tungsten charge state, $Z_{\mathrm{W}}$ is the atomic number of
    tungsten, and $n_{\mathrm{W}^{q+}}$ is the number density of tungsten ions
    in charge state $q$. Neutral tungsten is excluded.

    This quantity applies to the local tungsten-ion population at the pedestal
    top, whose position is defined by the [normalized poloidal-flux coordinate
    at the pedestal top](name:normalized_poloidal_flux_coordinate_of_pedestal).
    It is summed over all positive tungsten charge states and is neither
    flux-surface averaged nor line-of-sight averaged.

    It is the tungsten-specific component of [density at the pedestal
    top](name:density_at_pedestal_top). Unlike [tungsten density at the internal
    transport barrier](name:tungsten_density_at_internal_transport_barrier),
    which is evaluated on an internal-transport-barrier flux surface, this
    quantity is evaluated at the pedestal-top location.
  unit: m^-3

- name: tungsten_density_at_separatrix
  description: |-
    Tungsten-ion number density on the last closed magnetic flux surface, summed
    over all positive ionization states and distinguished from its flux-surface
    average.
  documentation: |-
    Tungsten-ion number density at the plasma boundary represents the local
    population of positively charged tungsten ions on the separatrix, the last
    closed magnetic flux surface. The same physical quantity may also be
    evaluated as a flux-surface average over that boundary surface; the local
    and averaged forms are distinct.

    The charge-state-summed local density is defined from the velocity
    distributions by:

    $$
    n_{\mathrm{W}}(\mathbf{x}) = \sum_{Z=1}^{Z_{\max}} \int f_{\mathrm{W}}^{Z}(\mathbf{x},\mathbf{v})\,d^3v
    $$

    where $n_{\mathrm{W}}$ is the tungsten-ion number density, $\mathbf{x}$ is a
    position on the separatrix, $Z$ is the positive tungsten ion charge state,
    $Z_{\max}$ is the highest included charge state, $f_{\mathrm{W}}^{Z}$ is the
    velocity distribution of that charge state, $\mathbf{v}$ is particle
    velocity, and $d^3v$ is the velocity-space volume element.

    This quantity applies to tungsten ions evaluated at the plasma boundary and
    sums over all positive ionization states. It excludes neutral tungsten and
    does not select an individual charge state. The local form is evaluated at a
    boundary position, whereas the flux-surface-averaged tungsten density at the
    plasma boundary averages the same charge-state-summed density over the
    boundary flux surface.

    The flux-surface-averaged quantity is therefore an aggregation of this local
    density over the same separatrix, not a different species or charge-state
    convention. It is distinct from [volume-averaged tungsten
    density](name:volume_averaged_tungsten_density), which averages tungsten-ion
    density over the plasma volume enclosed by the last closed flux surface.
  unit: m^-3

- name: vector_potential
  description: |-
    Magnetic vector-potential quantity covering the full potential, its
    directional components, and fluctuations about an equilibrium potential.
  documentation: |-
    The magnetic vector potential is a vector field whose spatial curl
    determines the associated magnetic field. A perturbation denotes the
    departure from an equilibrium vector potential and may be represented by a
    reference-scaled amplitude.

    $$
    \mathbf{B} = \nabla \times \mathbf{A}
    $$

    where $\mathbf{A}$ is the magnetic vector-potential field, $\mathbf{B}$ is
    its associated magnetic-field vector, and $\nabla \times$ is the spatial
    curl operator. The potential is gage-dependent: replacing $\mathbf{A}$ by
    $\mathbf{A} + \nabla\chi$, where $\chi$ is a scalar gage function, leaves
    $\mathbf{B}$ unchanged. The family includes directional components such as
    the [radial vector potential](name:radial_vector_potential) and [poloidal
    vector potential](name:poloidal_vector_potential), as well as the perturbed
    vector potential.

    Sign convention: Positive when a specified gage-fixed component points along
    its corresponding positive direction in the right-handed cylindrical
    $(R,\phi,Z)$ basis, where $R$ increases away from the symmetry axis, $\phi$
    increases toroidally, and $Z$ increases vertically.
  unit: T.m

- name: poloidal_vector_potential
  description: |-
    Magnetic vector-potential quantity given by the signed projection of the
    electromagnetic vector potential onto the local poloidal direction tangent
    to increasing poloidal angle in the poloidal cross-section of the
    right-handed cylindrical (R, φ, Z) frame, where R is major radius, φ is
    toroidal angle, and Z is vertical height.
  documentation: |-
    The poloidal component of the magnetic vector potential is the signed
    projection of the electromagnetic vector potential onto the local poloidal
    direction in the poloidal cross-section of the right-handed cylindrical
    $(R,\phi,Z)$ frame. The local poloidal unit vector is tangent to increasing
    poloidal angle $\theta$ at fixed toroidal angle $\phi$; $R$ is major radius,
    $\phi$ increases toroidally, and $Z$ is vertical height.

    The component is defined by the scalar projection of the vector potential
    onto the poloidal unit direction:

    $$
    A_\theta = \mathbf{A}\cdot\hat{e}_\theta
    $$

    where $A_\theta$ is the poloidal vector potential, $\mathbf{A}$ is the
    magnetic vector-potential field, and $\hat{e}_\theta$ is the local unit
    vector tangent to increasing $\theta$ in the $R$-$Z$ plane.

    This quantity is a component of the gage-dependent vector potential, not a
    component of the magnetic field. The associated magnetic-field vector
    satisfies $\mathbf{B}=\nabla\times\mathbf{A}$ after a gage is fixed, and
    replacing $\mathbf{A}$ by $\mathbf{A}+\nabla\chi$ leaves $\mathbf{B}$
    unchanged. Related directional variants include the [radial vector
    potential](name:radial_vector_potential), [poloidal magnetic vector
    potential](name:poloidal_magnetic_vector_potential), [radial magnetic vector
    potential](name:radial_magnetic_vector_potential), and [vertical magnetic
    vector potential](name:vertical_magnetic_vector_potential).

    Sign convention: Positive when the gage-fixed vector potential has a
    component along $\hat{e}_\theta$, the local direction tangent to increasing
    poloidal angle $\theta$ at fixed $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.
  unit: T.m

- name: volume_averaged_neutral_species_density
  description: |-
    Mean number density of a specified neutral species over the plasma volume
    enclosed by the last closed flux surface during plasma initiation.
  documentation: |-
    This quantity is the spatial mean of the local number density of one
    specified neutral species within the plasma volume enclosed by the last
    closed flux surface during plasma initiation. The local quantity is
    distinguished from [neutral_density](name:neutral_density), which is
    evaluated at a point.

    $$
    \overline{n}_0 = \frac{1}{V_{\mathrm{LCFS}}} \int_{V_{\mathrm{LCFS}}} n_0(\mathbf{r})\,dV
    $$

    where $n_0(\mathbf{r})$ is the local number density of the specified neutral
    species at position $\mathbf{r}$, $V_{\mathrm{LCFS}}$ is the volume enclosed
    by the last closed flux surface, and $dV$ is the volume element.

    The average is species-specific and excludes neutral particles outside the
    enclosed volume. It is not the charge-state or population aggregate
    represented by [total_neutral_density](name:total_neutral_number_density),
    nor the volume average of ion density represented by
    [volume_averaged_ion_density](name:volume_averaged_ion_density).
  unit: m^-3

- name: xenon_density_at_pedestal_top
  description: |-
    Xenon ion number density at the top of the H-mode edge pedestal, summed over
    all xenon ionization states.
  documentation: |-
    Xenon ion number density at the top of the H-mode edge pedestal is the local
    concentration of xenon ions with all positive charge states combined.

    The charge-state-summed density is defined by

    $$
    n_{\mathrm{Xe}} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}
    $$

    where $n_{\mathrm{Xe}}$ is the total xenon ion number density,
    $n_{\mathrm{Xe}^{z+}}$ is the number density of xenon ions with charge state
    $z$, and $z$ is the positive integer xenon charge state.

    The quantity applies locally at the top of the H-mode edge pedestal, the
    inner shoulder of the edge transport barrier, whose position is defined by
    the [normalized poloidal flux coordinate of the
    pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It is
    summed over xenon ions from the singly ionized through fully ionized states
    and excludes neutral xenon; it is not a chord, flux-surface, or volume
    average.

    This is the xenon-specific component of the total [density at the pedestal
    top](name:density_at_pedestal_top), whereas [xenon
    density](name:xenon_density) denotes the corresponding local xenon ion
    density without fixing the pedestal-top locus. The same charge-state
    aggregation evaluated at another boundary location is given by [xenon
    density at the plasma boundary](name:xenon_density_at_plasma_boundary).
  unit: m^-3

- name: xenon_density_at_plasma_boundary
  description: |-
    Number density of xenon ions at the plasma boundary, evaluated locally on
    the last closed magnetic flux surface and summed over all ionization stages.
  documentation: |-
    Number density of xenon ions at the plasma boundary is the amount of the
    xenon ion population per physical volume at the last closed magnetic flux
    surface. It is the local boundary value, not a flux-surface average.

    The local charge-state-summed density is defined by

    $$
    n_{\mathrm{Xe}}(\mathbf{x}_b,t)=\sum_{Z=1}^{54}\int f_{\mathrm{Xe},Z}(\mathbf{x}_b,\mathbf{v},t)\,d^3\mathbf{v}
    $$

    where $n_{\mathrm{Xe}}$ is the xenon ion number density, $\mathbf{x}_b$ is a
    point on the plasma boundary, $t$ is time, $Z$ is the xenon ion charge-state
    number, $f_{\mathrm{Xe},Z}$ is the velocity distribution function for charge
    state $Z$, $\mathbf{v}$ is particle velocity, and $d^3\mathbf{v}$ is the
    velocity-space volume element.

    The plasma boundary is the last closed magnetic flux surface, also called
    the separatrix, separating confined plasma from the open-field-line
    scrape-off layer. The aggregation is additive over all xenon ion charge
    states from singly ionized through fully stripped xenon and excludes neutral
    xenon atoms. The value is local at the boundary rather than averaged over
    that surface.

    This entry specializes the population-unspecified
    [density_at_plasma_boundary](name:density_at_plasma_boundary) to xenon ions.
    The corresponding flux_surface_averaged_xenon_density_at_plasma_boundary
    applies the same xenon charge-state aggregation after averaging over the
    plasma-boundary flux surface, so it is distinct from this local quantity.
  unit: m^-3

- name: flux_surface_averaged_xenon_density_at_plasma_boundary
  description: |-
    Number density of xenon ions averaged over the last closed magnetic flux
    surface, summed over all xenon ion charge states and excluding neutral
    xenon.
  documentation: |-
    Number density of xenon

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{Xe}}\rangle = \oint n_{\mathrm{Xe}}\,dS/|\nabla\psi| \, / \, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{Xe}}\rangle$ is the averaged xenon-ion number
    density, $n_{\mathrm{Xe}}$ is the local xenon-ion number density, $S$ is the
    plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is the
    poloidal magnetic flux whose gradient magnitude is $|\nabla\psi|$.

    This quantity is charge-state-summed over xenon ions and is not a local
    point value, a volume average, or a density that includes neutral xenon. It
    is the flux-surface-averaged counterpart of the local [xenon ion density at
    the plasma boundary](name:xenon_density_at_plasma_boundary), with
    inverse-poloidal-flux-gradient weighting replacing the pointwise value by
    its surface mean. It differs from the [volume-averaged xenon
    density](name:volume_averaged_xenon_density), which averages over the plasma
    volume rather than over the plasma-boundary surface.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.

    Related quantities:
    [flux_surface_averaged_argon_density_at_plasma_boundary](name:flux_surface_averaged_argon_density_at_plasma_boundary),
    [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary).
  unit: m^-3

- name: coulomb_logarithm_at_pedestal_top
  description: |-
    Natural logarithm of the effective upper-to-lower impact-parameter ratio
    governing cumulative small-angle Coulomb scattering between charged
    particles at the pressure pedestal top.
  documentation: |-
    The Coulomb logarithm at the [pressure pedestal
    top](name:normalized_poloidal_flux_coordinate_of_pedestal) expresses the
    effective logarithmic range of impact parameters contributing to cumulative
    small-angle Coulomb scattering between charged particles at that location.

    Its defining relation is

    $$
    \ln\Lambda = \ln\left(\frac{b_{\max}}{b_{\min}}\right)
    $$

    where $\ln\Lambda$ is the local Coulomb logarithm, $\ln$ denotes the natural
    logarithm, $\Lambda$ is the effective impact-parameter ratio, $b_{\max}$ is
    the upper impact-parameter cutoff associated with plasma screening, and
    $b_{\min}$ is the lower cutoff associated with strong deflections or quantum
    diffraction, as applicable. Both cutoffs refer to local plasma conditions at
    the pressure pedestal top.

    This quantity is the local evaluation of the [Coulomb
    logarithm](name:coulomb_logarithm), not an average or integral across the
    pedestal. No particular colliding species pair is specified.
  unit: '1'

- name: diamagnetic_current_density_due_to_heat_viscosity
  description: |-
    Signed projection of the heat-viscosity electric-current contribution onto
    the local diamagnetic direction in a collisional magnetized plasma.
  documentation: |-
    Diamagnetic current density due to heat viscosity is the local diamagnetic
    component of the electric-current contribution generated by heat-viscosity
    stresses in a collisional magnetized-plasma fluid closure.

    Its defining projection is

    $$
    j_{\mathrm{dia}} = \mathbf{j}_{\mathrm{hv}} \cdot \hat{\mathbf{e}}_{\mathrm{dia}}
    $$

    where $j_{\mathrm{dia}}$ is the diamagnetic current density due to heat
    viscosity, $\mathbf{j}_{\mathrm{hv}}$ is the [heat-viscosity current-density
    vector](name:current_density_due_to_heat_viscosity), and
    $\hat{\mathbf{e}}_{\mathrm{dia}}$ is the unit vector along the designated
    local diamagnetic direction, perpendicular to the magnetic field. The
    positive orientation of this direction must be specified by the local
    component convention; the heat-viscosity attribution alone does not
    determine it.

    This is a local, unaveraged contribution to [electric current
    density](name:current_density), not a surface-integrated current or the
    total current density from all mechanisms. Only the heat-viscosity
    contribution is included; the definition imposes no restriction to a
    particular plasma region.

    Unlike [parallel current density due to heat
    viscosity](name:parallel_current_density_due_to_heat_viscosity), which
    projects the same parent vector along the local magnetic field, this
    quantity projects onto the local diamagnetic direction. The diamagnetic
    qualifier identifies the projection, not a replacement of the heat-viscosity
    mechanism by pressure-gradient-driven current.

    Sign convention: Positive when the heat-viscosity current has a component
    along the designated positive local diamagnetic direction
    $\hat{\mathbf{e}}_{\mathrm{dia}}$.
  unit: A.m^-2

- name: flux_surface_averaged_oxygen_density_at_plasma_boundary
  description: |-
    Number density of oxygen ions flux-surface-averaged at the plasma boundary,
    summed over all charged oxygen ionization states and excluding neutral
    oxygen.
  documentation: |-
    Number density of oxygen

    The flux-surface average is defined by

    $$
    \langle n_{\mathrm{O}}\rangle = \oint n_{\mathrm{O}}\,dS/|\nabla\psi| \, /\, \oint dS/|\nabla\psi|
    $$

    where $\langle n_{\mathrm{O}}\rangle$ is the averaged oxygen-ion number
    density, $n_{\mathrm{O}}$ is the local oxygen-ion number density, $S$ is the
    plasma-boundary flux surface, $dS$ is its surface element, and $\psi$ is the
    poloidal magnetic flux. The factor $|\nabla\psi|$ is the magnitude of the
    spatial gradient of poloidal magnetic flux, and both closed integrals extend
    over $S$.

    This quantity is not a local point value, a volume average, an individual
    charge-state density, or a density that includes neutral oxygen. It is the
    flux-surface-averaged counterpart of the local [oxygen density at the plasma
    boundary](name:oxygen_density_at_plasma_boundary), using
    inverse-poloidal-flux-gradient weighting to replace the pointwise value with
    a surface mean.

    The last closed magnetic flux surface: the outermost flux surface on which
    field lines close on themselves, bounding the confined plasma. Where $\psi =
    \psi_{\mathrm{LCFS}}$, $\psi$ is poloidal magnetic flux;
    $\psi_{\mathrm{LCFS}}$ is its value on the last closed flux surface.
  unit: m^-3

- name: ion_current_density
  description: |-
    Ion current density is the vector density of conventional electric charge
    flux carried by ions, obtained by charge-weighting their directed particle
    motion across unit area.
  documentation: |-
    Ion current density $\mathbf{J}_i$ is the vector density of conventional
    electric charge flux carried by ions. It represents signed charge transport
    from all included ion species and charge states.

    The kinetic definition is the charge-weighted first velocity moment of the
    ion distribution functions:

    $$
    \mathbf{J}_i(\mathbf{x},t) = \sum_{s\in\mathrm{ions}} q_s \int \mathbf{v}\,f_s(\mathbf{x},\mathbf{v},t)\,d^3v = \sum_{s\in\mathrm{ions}} q_s n_s \mathbf{u}_s
    $$

    where $\mathbf{x}$ is position, $t$ is time, $s$ indexes ion species and
    charge states, $q_s$ is the charge of population $s$, $\mathbf{v}$ is
    particle velocity, $f_s$ is its velocity-space distribution function, $n_s$
    is its number density, and $\mathbf{u}_s$ is its mean velocity.

    This quantity includes ion-carried charge flux and excludes electron-carried
    and displacement-current density. Its qualified instances may select a
    magnetic-field-aligned projection such as [parallel ion current
    density](name:parallel_ion_current_density), a temporal fluctuation measure
    such as [fluctuating ion current
    density](name:fluctuating_ion_current_density), or an ion-saturation
    collection condition.

    Sign convention: Positive when an ion-carried charge-flux component is
    aligned with the positive direction of its defining basis vector or oriented
    surface normal.
  unit: A.m^-2

- name: parallel_ion_current_density
  description: |-
    Parallel ion current density is the signed conventional electric-charge flux
    carried by ions along the local magnetic field at a plasma-facing surface.
  documentation: |-
    Parallel ion current density at a plasma-facing surface is the signed
    projection of the [ion current-density vector](name:ion_current_density)
    onto the local magnetic-field direction.

    The projection is defined by:

    $$
    j_{\parallel,i} = \hat{\mathbf{b}}\cdot\mathbf{J}_i
    $$

    where $j_{\parallel,i}$ is the parallel ion current density, $\mathbf{J}_i$
    is the ion current-density vector, and
    $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the unit vector along the
    local magnetic-field vector $\mathbf{B}$.

    This quantity applies locally at a plasma-facing surface, including a
    divertor surface; it is not surface- or flux-surface-averaged. Contributions
    from all included ion species and charge states are summed algebraically.
    Each charge-state contribution equals its [parallel ion charge-state
    particle flux](name:parallel_ion_charge_state_particle_flux) multiplied by
    its electric charge. Electron current is excluded.

    It is the ion contribution to [current density](name:current_density)
    projected along the magnetic field, whereas [parallel current
    density](name:parallel_current_density) has no ion-only restriction. It is
    neither the magnitude of the ion current-density vector nor its projection
    onto the surface normal.

    Sign convention: Positive when net conventional ion charge transport is in
    the direction of the local magnetic-field vector.
  unit: A.m^-2

- name: saturated_ion_current_density
  description: |-
    Conventional ion charge flux per collecting area at a Langmuir-probe
    collector in the negative-bias saturation regime, where electron collection
    is suppressed.
  documentation: |-
    The saturated ion current density is the limiting conventional ion
    charge-flux density reaching a Langmuir-probe collector biased sufficiently
    negative relative to the plasma to suppress electron collection. It is the
    ion-saturation specialization of [ion current
    density](name:ion_current_density), rather than the unrestricted [current
    density](name:current_density) carried by all charged particles.

    The charge-weighted ion flux defines the current-density vector:

    $$
    \mathbf{j}_{i,\mathrm{sat}} = \sum_a \sum_{z\geq 1} z e\,\boldsymbol{\Gamma}_{a,z}^{\mathrm{sat}}
    $$

    where $\mathbf{j}_{i,\mathrm{sat}}$ is the saturated ion current-density
    vector, $i$ denotes the ion population, $a$ labels ion species, $z$ is the
    positive ionic charge number, $e$ is the elementary charge, and
    $\boldsymbol{\Gamma}_{a,z}^{\mathrm{sat}}$ is the particle-flux vector of
    that species and charge state at the collector in ion saturation.

    The sum includes all collected ion species and charge states, weighted by
    their electric charge. Electron and neutral-particle contributions are
    excluded. This is a charge flux per collecting area, not an area-integrated
    current or an unweighted ion particle flux.

    The [saturated ion current](name:saturated_ion_current) is the surface
    integral of the collector-directed component:
    $I_{i,\mathrm{sat}}=\int_S\mathbf{j}_{i,\mathrm{sat}}\cdot\hat{\mathbf{n}}_{\mathrm{col}}\,dA$,
    where $I_{i,\mathrm{sat}}$ is the collected saturated ion current, $S$ is
    the collecting surface, $dA$ is a surface-area element, and
    $\hat{\mathbf{n}}_{\mathrm{col}}$ is the unit normal directed from the
    plasma into the collector. The [fluctuating saturated ion current
    density](name:fluctuating_saturated_ion_current_density) is the temporal
    standard deviation of the collected current-density component; no temporal
    statistical operation is implied here.

    Sign convention: Positive when positive ion charge flows from the plasma
    into the collector, as defined by the collector-directed normal.
  unit: A.m^-2

- name: fluctuating_saturated_ion_current_density
  description: |-
    Temporal standard deviation of the ion charge flux per collecting area at a
    Langmuir-probe collector biased into ion saturation, with electron
    collection suppressed.
  documentation: |-
    The fluctuating saturated ion current density is the temporal standard
    deviation of [saturated ion current
    density](name:saturated_ion_current_density). It describes the amplitude of
    boundary-plasma ion-collection fluctuations, not the mean saturation level.

    The fluctuation amplitude is defined by:

    $$
    \sigma_{j_{i,\mathrm{sat}}} = \sqrt{\left\langle\left(j_{i,\mathrm{sat}}(t)-\left\langle j_{i,\mathrm{sat}}\right\rangle_t\right)^2\right\rangle_t}
    $$

    where $\sigma_{j_{i,\mathrm{sat}}}$ is the temporal standard deviation,
    $j_{i,\mathrm{sat}}(t)$ is the collected ion saturation current density at
    time $t$, and $\langle\cdot\rangle_t$ denotes temporal averaging over the
    same specified interval at one collector. The subscript $i$ denotes ions and
    $\mathrm{sat}$ denotes the ion-saturation regime.

    The collector is sufficiently negatively biased relative to the local plasma
    to suppress electron collection. The underlying ion signal includes the
    charge-weighted contributions of all collected ion species and charge
    states; the standard deviation is taken after those contributions are
    combined, rather than summed from their separate standard deviations.
    Electron-current fluctuations are excluded, and the averaging is temporal
    rather than spatial.

    This is a fluctuation statistic of collector-defined [current
    density](name:current_density), not an instantaneous signed perturbation or
    an uncertainty in the temporal mean. Unlike [parallel fluctuating ion
    current density](name:parallel_fluctuating_ion_current_density), it refers
    to ion-saturation collection rather than projection onto the local
    magnetic-field direction.
  unit: A.m^-2

- name: momentum_flux_limiter_coefficient
  description: |-
    Dimensionless coefficient that scales the collisionless free-streaming upper
    bound on momentum-flux density in multi-fluid edge plasma transport
    closures, capping the flux magnitude while leaving its sign direction
    unchanged.
  documentation: |-
    In multi-fluid edge plasma transport models, gradient-driven diffusive
    closures can produce momentum-flux densities that exceed the physically
    realizable collisionless free-streaming limit in steep-gradient regions such
    as the scrape-off layer and divertor. A flux-limiter coefficient $\alpha_m$
    is introduced to bound the effective flux: the limited momentum-flux density
    magnitude cannot exceed $\alpha_m$ times a free-streaming reference scale,
    while the sign follows the underlying diffusive flux direction.

    The limited momentum-flux density $\Pi^{\mathrm{lim}}$ is formed by the
    harmonic-mean combination:

    $$
    \Pi^{\mathrm{lim}} = \frac{\alpha_m \, \Pi^{\mathrm{FS}} \cdot \Pi^{\mathrm{diff}}}{|\Pi^{\mathrm{diff}}| + \alpha_m \, \Pi^{\mathrm{FS}}}
    $$

    where $\Pi^{\mathrm{diff}}$ is the collisional diffusive momentum-flux
    estimate, $\Pi^{\mathrm{FS}} = m n v_{\mathrm{th}}^2$ is the free-streaming
    scale with $m$ the particle mass, $n$ the number density, and
    $v_{\mathrm{th}}$ the thermal speed. When $|\Pi^{\mathrm{diff}}| \gg
    \alpha_m \Pi^{\mathrm{FS}}$ the flux saturates at $\pm \alpha_m
    \Pi^{\mathrm{FS}}$; when $|\Pi^{\mathrm{diff}}| \ll \alpha_m
    \Pi^{\mathrm{FS}}$ the diffusive value is recovered unchanged.

    Specializations target individual projection directions, such as
    parallel_momentum_coefficient for field-aligned transport, and individual
    particle populations, such as ion_state_momentum_coefficient for specific
    ion charge states or parallel_neutral_state_momentum_coefficient for
    neutral-particle parallel transport. The coefficient is intrinsically
    non-negative; values in the range 0.1–1 are common in edge-plasma
    simulations, selected by calibration against experimental separatrix and
    divertor data.
  unit: '1'

- name: ion_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless ion momentum-flux limiter coefficient that scales the
    collisionless free-streaming bound component-by-component, capping flux
    magnitude while preserving its sign.
  documentation: |-
    The ion momentum coefficient is a dimensionless flux-limiter parameter for
    gradient-driven momentum transport, providing one limiter factor for each
    selected spatial transport component. It is the ion specialization of
    [momentum_flux_limiter_coefficient](name:momentum_flux_limiter_coefficient),
    scaling the collisionless free-streaming bound while preserving the
    direction supplied by the underlying diffusive closure.

    For each selected component, the limited momentum-flux density is defined by
    the harmonic-mean closure:

    $$
    \Pi^{\mathrm{lim}} = \frac{\alpha_m \, \Pi^{\mathrm{FS}} \cdot \Pi^{\mathrm{diff}}}{|\Pi^{\mathrm{diff}}| + \alpha_m \, \Pi^{\mathrm{FS}}}
    $$

    where $\alpha_m$ is the momentum-flux limiter coefficient,
    $\Pi^{\mathrm{FS}}$ is the collisionless free-streaming reference
    momentum-flux density, $\Pi^{\mathrm{diff}}$ is the collisional diffusive
    momentum-flux estimate, and $\Pi^{\mathrm{lim}}$ is the resulting limited
    flux density.

    The shared quantity spans parallel, poloidal, and radial ion components;
    [parallel ion momentum-flux limiter
    coefficient](name:parallel_ion_momentum_flux_limiter_coefficient) and
    [poloidal ion momentum-flux limiter
    coefficient](name:poloidal_ion_momentum_flux_limiter_coefficient) are
    concrete instances. It applies to momentum flux rather than particle, heat,
    or energy flux, and the coefficient is non-negative.
  unit: '1'

- name: neutral_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless vector flux-limiter coefficient that scales the free-streaming
    upper bound on neutral-particle momentum-flux density component-by-component
    in edge-plasma transport closures.
  documentation: |-
    The neutral momentum coefficient is the neutral-particle specialization of
    the general momentum_coefficient vector, providing one dimensionless limiter
    factor per spatial direction for neutral momentum transport in multi-fluid
    edge plasma models. Each directional component independently bounds the
    corresponding neutral momentum flux density, preventing unphysical
    exceedance of the free-streaming limit when the neutral mean free path is
    large relative to macroscopic gradient scales.

    The component $\alpha_\alpha$ in direction $\hat{e}_\alpha$ is defined as
    the ratio of the modeled flux to its free-streaming upper bound:

    $$
    \alpha_\alpha = \frac{\Pi_\alpha}{\Pi_\alpha^{\rm free}}
    $$

    where $\Pi_\alpha$ is the modeled neutral momentum flux density in direction
    $\hat{e}_\alpha$ and $\Pi_\alpha^{\rm free} = m_n n_n u_\alpha^{\rm free}$
    is the free-streaming estimate, with $m_n$ the neutral particle mass, $n_n$
    the neutral number density, and $u_\alpha^{\rm free}$ the direction-$\alpha$
    free-streaming reference speed. The constraint $\alpha_\alpha \in [0, 1]$
    ensures the closure preserves the sign of the momentum flux while bounding
    its magnitude. The field-aligned component is analogous to
    parallel_neutral_state_momentum_coefficient, which resolves the same
    quantity by internal neutral state.

    Components are computed within edge-plasma transport closures as a function
    of local collisionality; values near 1 characterize the collision-dominated
    limit, while values near 0 indicate strongly free-streaming conditions where
    the limiter actively constrains the flux.
  unit: '1'

- name: parallel_ion_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless factor setting the collisionless free-streaming upper bound on
    field-aligned ion momentum flux without reversing the flux direction.
  documentation: |-
    The parallel ion momentum flux limiter coefficient sets the collisionless
    free-streaming cap for gradient-driven transport of ion
    [momentum](name:momentum) along the local magnetic field. Limiting restricts
    the flux magnitude without reversing its direction.

    The coefficient defines the cap through:

    $$
    \Pi_{i,\parallel}^{\mathrm{cap}} = \alpha_{i,\parallel}\Pi_{i,\parallel}^{\mathrm{fs}}
    $$

    where $\alpha_{i,\parallel}$ is this coefficient,
    $\Pi_{i,\parallel}^{\mathrm{cap}}$ is the nonnegative upper bound on the
    field-aligned ion momentum-flux magnitude, and
    $\Pi_{i,\parallel}^{\mathrm{fs}}$ is the corresponding collisionless
    free-streaming reference magnitude. The subscript $i$ identifies the
    selected ion population, and $\parallel$ denotes the local magnetic-field
    direction. The limited flux magnitude cannot exceed this cap; the
    coefficient does not prescribe a particular interpolation between the
    unlimited flux and the cap.

    This is the field-aligned component of the [ion momentum flux limiter
    coefficient](name:ion_momentum_flux_limiter_coefficient), whereas the
    [poloidal ion momentum flux limiter
    coefficient](name:poloidal_ion_momentum_flux_limiter_coefficient) selects
    the poloidal component. It applies to ion rather than neutral momentum
    transport and is a limiter parameter, not a momentum flux or diffusivity. No
    sum or average over ion species or charge states is implied.
  unit: '1'

- name: parallel_neutral_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless factor scaling the collisionless free-streaming cap on the
    magnetic-field-parallel component of neutral momentum flux in edge-fluid
    transport closures.
  documentation: |-
    This coefficient sets the free-streaming upper bound on the parallel
    component of neutral-particle [momentum](name:momentum) flux in edge-fluid
    transport closures. Parallel denotes the local magnetic-field direction,
    used as a geometric reference without implying that neutral particles follow
    magnetic field lines.

    The limiting flux magnitude is defined by

    $$
    \Pi^{0,\max}_{\parallel} = \alpha^0_{\parallel}\Pi^{0,\mathrm{fs}}_{\parallel}
    $$

    where $\alpha^0_{\parallel}$ is this nonnegative limiter coefficient,
    $\Pi^{0,\mathrm{fs}}_{\parallel}$ is the nonnegative collisionless
    free-streaming reference magnitude, and $\Pi^{0,\max}_{\parallel}$ is the
    resulting upper bound. The superscript $0$ denotes neutral particles, and
    $\parallel$ denotes the magnetic-field-parallel component. The limited
    neutral momentum flux $\Pi^0_{\parallel}$ satisfies
    $|\Pi^0_{\parallel}|\leq\Pi^{0,\max}_{\parallel}$; limiting its magnitude
    does not reverse its direction. The free-streaming normalization and
    limiting function are specified by the transport closure, not by this
    coefficient alone.

    This quantity is the parallel directional component of the [neutral momentum
    flux-limiter coefficient](name:neutral_momentum_flux_limiter_coefficient),
    not the momentum flux itself or a momentum diffusivity. It applies to the
    selected neutral population without explicit internal-state resolution,
    unlike the [parallel neutral-state momentum flux-limiter
    coefficient](name:parallel_neutral_state_momentum_flux_limiter_coefficient).
    No summation or averaging rule for state-resolved coefficients is implied.
  unit: '1'

- name: toroidal_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless coefficient that scales the collisionless free-streaming upper
    bound on toroidal momentum-flux density in multi-fluid edge plasma transport
    closures, capping the flux magnitude while leaving its sign direction
    unchanged.
  documentation: |-
    In multi-fluid edge plasma transport models, gradient-driven diffusive
    closures can produce toroidal momentum-flux densities that exceed the
    physically realizable collisionless free-streaming limit in steep-gradient
    regions. A toroidal momentum-flux-limiter coefficient $\alpha_{m,\phi}$ is
    introduced to bound the effective $\hat{\phi}$-projected momentum-flux
    density, where $m$ denotes momentum and $\phi$ denotes the toroidal
    projection. The toroidal projection is along $\hat{\phi}$, the tangent to
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame with basis $(\hat{R}, \hat{\phi}, \hat{Z})$ and $\hat{R} \times
    \hat{\phi} = \hat{Z}$.

    The bounded toroidal momentum-flux density satisfies the limiter constraint:

    $$
    |\Pi_{\phi}^{\mathrm{lim}}| \le \alpha_{m,\phi}\,\Pi_{\phi}^{\mathrm{FS}}
    $$

    where $\Pi_{\phi}^{\mathrm{lim}}$ is the limited toroidal momentum-flux
    density, $\Pi_{\phi}^{\mathrm{FS}}$ is the toroidal free-streaming
    momentum-flux reference scale, and $\alpha_{m,\phi}$ is the toroidal
    momentum-flux-limiter coefficient.

    This coefficient is the toroidal directional specialization of
    [momentum-flux-limiter coefficient](name:momentum_flux_limiter_coefficient),
    not a particle-, heat-, or energy-flux limiter and not the momentum-flux
    density itself. It is intrinsically non-negative: it caps the magnitude of
    the modeled toroidal momentum-flux density and does not carry the positive
    or negative sign of that flux. Directional siblings include the poloidal,
    radial, [parallel](name:parallel_momentum_flux_limiter_coefficient), and
    [diamagnetic](name:diamagnetic_momentum_flux_limiter_coefficient)
    momentum-flux-limiter coefficients.
  unit: '1'

- name: vertical_neutral_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless vertical momentum flux-limiter coefficient that scales the
    free-streaming upper bound on neutral-particle momentum-flux density in
    edge-plasma transport closures.
  documentation: |-
    The vertical neutral momentum flux-limiter coefficient is the vertical
    component of the neutral-particle specialization of the general momentum
    flux-limiter coefficient vector, providing the dimensionless limiter factor
    for neutral momentum transport along the vertical $Z$ direction of the
    right-handed cylindrical $(R, \phi, Z)$ frame in multi-fluid edge-plasma
    models. It bounds the vertical neutral momentum-flux density by the
    free-streaming limit when the neutral mean free path is large relative to
    macroscopic gradient scales.

    The vertical component $\alpha_Z$ is defined as the ratio of the magnitude
    of the modeled vertical neutral momentum-flux density to its positive
    free-streaming upper bound:

    $$
    \alpha_Z = \frac{|\Pi_Z|}{\Pi_Z^{\rm free}}, \qquad \Pi_Z^{\rm free} = m_n n_n \left(u_Z^{\rm free}\right)^2
    $$

    where $\Pi_Z$ is the modeled vertical neutral momentum-flux density
    component along $\hat{Z}$, $\Pi_Z^{\rm free}$ is the corresponding
    free-streaming upper bound, $m_n$ is the neutral particle mass, $n_n$ is the
    neutral number density, and $u_Z^{\rm free}$ is the nonnegative
    free-streaming reference speed for neutral motion along $\hat{Z}$. The
    constraint $\alpha_Z \in [0, 1]$ makes the coefficient a magnitude limiter;
    any sign of the vertical momentum flux is carried by $\Pi_Z$, not by
    $\alpha_Z$.

    This quantity is the vertical member of the [neutral momentum flux-limiter
    coefficient](name:neutral_momentum_flux_limiter_coefficient) vector and is
    distinct from the [parallel neutral momentum flux-limiter
    coefficient](name:parallel_neutral_momentum_flux_limiter_coefficient), which
    is taken along the magnetic-field direction, and the toroidal neutral
    momentum flux-limiter coefficient, which is taken along $\hat{\phi}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It is a limiter coefficient,
    not the neutral momentum-flux density itself.
  unit: '1'

- name: neutral_state_momentum_flux_due_to_diamagnetic_drift
  description: |-
    Neutral state momentum flux due to diamagnetic drift is the signed flux
    density of linear momentum carried by a specified neutral state and
    attributed to pressure-gradient-driven diamagnetic drift.
  documentation: |-
    Neutral state momentum flux due to diamagnetic drift is the signed flux
    density of linear momentum carried by a specified neutral state and
    associated with its pressure-gradient-driven diamagnetic drift. The quantity
    denotes the diamagnetic contribution without selecting a particular flux
    direction or transported momentum component.

    The contribution is defined componentwise by:

    $$
    \Pi_{ab,\mathrm{ns}}^{\mathrm{dia}} = \rho_{\mathrm{ns}} v_{a,\mathrm{ns}}^{\mathrm{dia}} u_{b,\mathrm{ns}}
    $$

    where $\Pi_{ab,\mathrm{ns}}^{\mathrm{dia}}$ is the momentum flux, $a$ is its
    flux-direction index, $b$ is its transported-momentum index,
    $\rho_{\mathrm{ns}}$ is neutral-state mass density,
    $v_{a,\mathrm{ns}}^{\mathrm{dia}}$ is the diamagnetic drift velocity, and
    $u_{b,\mathrm{ns}}$ is neutral-state linear flow velocity.

    This is the neutral-state specialization of
    [momentum_flux_due_to_diamagnetic_drift](name:momentum_flux_due_to_diamagnetic_drift).
    It excludes contributions attributed to other transport mechanisms and is
    closely related to
    [neutral_diamagnetic_momentum_flux](name:neutral_diamagnetic_momentum_flux).

    Sign convention: Positive when the transported neutral-state momentum
    crosses the oriented reference surface along its positive flux direction.
  unit: kg.m^-1.s^-2

- name: neutral_velocity_due_to_diamagnetic_drift
  description: |-
    Effective convection velocity for the pressure-gradient diamagnetic
    contribution to neutral-species momentum transport, retaining transport
    direction rather than only speed.
  documentation: |-
    The neutral diamagnetic momentum-convection velocity is the effective vector
    coefficient assigned to the pressure-gradient-associated diamagnetic
    contribution to neutral momentum transport. It is distinct from the total
    mean velocity of neutral particles.

    For a selected component of neutral momentum density, its constitutive role
    is:

    $$
    \boldsymbol{\Gamma}^{0}_{\pi,\ast} = \pi^{0}\mathbf{v}^{0}_{\ast}
    $$

    where $\mathbf{v}^{0}_{\ast}$ is the effective diamagnetic convection
    velocity, $\pi^{0}$ is the selected component of neutral momentum density,
    and $\boldsymbol{\Gamma}^{0}_{\pi,\ast}$ is its associated convective
    momentum-flux vector. The superscript $0$ denotes the neutral population,
    and the subscript $\ast$ identifies the diamagnetic contribution.

    The quantity applies to a selected neutral species without selecting an
    individual internal state; no aggregation over different neutral species is
    implied. An internal-state-resolved counterpart, [neutral-state velocity due
    to diamagnetic drift](name:neutral_state_velocity_due_to_diamagnetic_drift),
    instead applies to one specified neutral state.

    The diamagnetic attribution identifies an effective momentum-transport
    contribution, not a Lorentz-force drift of electrically neutral particles.
    Consequently, a charged-particle diamagnetic-drift formula does not define
    this coefficient, and perpendicularity to the magnetic field is not implied.
    Diffusive momentum transport and other convection contributions are
    excluded.

    This is the neutral momentum-transport member of the [velocity due to
    diamagnetic drift](name:velocity_due_to_diamagnetic_drift) family. Its
    [neutral velocity magnitude due to diamagnetic drift] is the norm
    $|\mathbf{v}^{0}_{\ast}|$, which discards the transport direction.

    Sign convention: Positive when a velocity component advects positive neutral
    momentum density along the specified positive direction of that component.
  unit: m.s^-1

- name: normalized_poloidal_flux_coordinate_of_pedestal
  description: |-
    Normalized poloidal flux coordinate locating the pedestal as a linear flux
    fraction, referenced to zero at the magnetic axis and one at the last closed
    flux surface.
  documentation: |-
    Normalized poloidal flux coordinate

    The coordinate is defined by

    $$
    \psi_{\mathrm{N}} = \frac{\psi - \psi_{\mathrm{axis}}}{\psi_{\mathrm{b}} - \psi_{\mathrm{axis}}}
    $$

    where $\psi_{\mathrm{N}}$ is the normalized poloidal flux coordinate of the
    pedestal, $\psi$ is the poloidal magnetic flux on the surface containing the
    pedestal location, $\psi_{\mathrm{axis}}$ is the [magnetic-axis flux
    value](name:poloidal_magnetic_flux_at_magnetic_axis), and
    $\psi_{\mathrm{b}}$ is the [boundary flux
    value](name:poloidal_magnetic_flux_at_plasma_boundary) at the last closed
    flux surface. The denominator must be nonzero.

    The normalization gives zero at the magnetic axis and one at the last closed
    flux surface. This quantity uses the linear fraction, not its square root;
    it specifies a location rather than a geometric radius, a [pedestal
    width](name:pedestal_width), or a spatial average. The [coordinate of the
    selected plasma
    boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary)
    evaluates the same linear fraction at a different locus.

    $$\psi_{\mathrm{N}} = (\psi - \psi_{\mathrm{axis}})/(\psi_{\mathrm{b}} - \psi_{\mathrm{axis}})$$
  unit: '1'

- name: parallel_current_density_due_to_heat_viscosity
  description: |-
    Parallel current density due to heat viscosity is the signed charge flux
    along the local magnetic field generated by heat-viscosity stresses in a
    collisional magnetized plasma.
  documentation: |-
    Parallel current density due to heat viscosity is the magnetic-field-aligned
    component of the electric-current contribution generated by heat-viscosity
    stresses in a collisional magnetized-plasma fluid closure.

    Its defining projection is

    $$
    j_\parallel = \mathbf{j}_{\mathrm{hv}} \cdot \hat{\mathbf{b}}
    $$

    where $j_\parallel$ is the parallel current density due to heat viscosity,
    $\mathbf{j}_{\mathrm{hv}}$ is the [heat-viscosity current-density
    vector](name:current_density_due_to_heat_viscosity), and $\hat{\mathbf{b}}$
    is the unit vector along the local magnetic field. Specifically,
    $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$, where $\mathbf{B}$ is the
    magnetic-field vector and $|\mathbf{B}|$ is its magnitude; the projection
    requires a nonzero magnetic field.

    This is a local, unaveraged contribution to [electric current
    density](name:current_density), not a surface-integrated current or the
    total current density from all mechanisms. It represents net plasma charge
    transport attributable to heat viscosity, rather than an individual species
    contribution; the definition imposes no restriction to a particular plasma
    region.

    Unlike [toroidal current density due to heat
    viscosity](name:toroidal_current_density_due_to_heat_viscosity), which
    projects the same parent vector onto the geometric toroidal direction, this
    quantity projects along the local magnetic field.

    Sign convention: Positive when the heat-viscosity conventional electric
    current flows along the local magnetic-field vector.
  unit: A.m^-2

- name: parallel_diamagnetic_current_density
  description: |-
    Parallel component of the diamagnetic current density, obtained by
    projecting the magnetic-field–pressure-gradient drift current onto the local
    magnetic-field direction.
  documentation: |-
    The parallel diamagnetic current density is the projection of the total
    [diamagnetic current density](name:diamagnetic_current_density) onto the
    local magnetic-field direction. It arises from the
    magnetic-field–pressure-gradient drift current and represents the signed
    field-aligned component of [current density due to diamagnetic
    drift](name:current_density_due_to_diamagnetic_drift).

    The projection is defined by:

    $$
    j_{\mathrm{dia},\parallel} = \hat{\mathbf{b}}\cdot\mathbf{j}_{\mathrm{dia}}
    $$

    where $j_{\mathrm{dia},\parallel}$ is the parallel diamagnetic current
    density, $\hat{\mathbf{b}}=\mathbf{B}/B$ is the unit vector in the local
    magnetic-field direction, $\mathbf{B}$ is the magnetic-field vector,
    $B=|\mathbf{B}|$ is the magnetic-field magnitude, and
    $\mathbf{j}_{\mathrm{dia}}$ is the [current density due to diamagnetic
    drift](name:current_density_due_to_diamagnetic_drift).

    This quantity applies to the total included edge-plasma current density
    carried by all included charge carriers; it is not species- or
    charge-state-resolved unless those qualifiers are part of the standard name.
    It is a signed component, not the scalar magnitude [diamagnetic current
    density](name:diamagnetic_current_density), and not a perpendicular
    component with respect to the magnetic-field direction.

    It is distinct from signed cylindrical projections such as [radial
    diamagnetic current density](name:radial_diamagnetic_current_density),
    [vertical diamagnetic current
    density](name:vertical_diamagnetic_current_density), and toroidal
    diamagnetic current density. In the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height, radial, toroidal, and vertical projections are along
    $(\hat{R}, \hat{\phi}, \hat{Z})$ respectively; the parallel projection is
    along $\hat{\mathbf{b}}$, not along any fixed cylindrical basis vector.

    The same resolved contribution is denoted by [parallel current density due
    to diamagnetic
    drift](name:parallel_current_density_due_to_diamagnetic_drift) when
    expressed as a contribution to [current density](name:current_density). For
    the ideal isotropic scalar-pressure relation
    $\mathbf{j}_{\mathrm{dia}}=\mathbf{B}\times\nabla p/B^2$, where $p$ is total
    scalar plasma pressure and $\nabla p$ is its spatial gradient,
    $\mathbf{j}_{\mathrm{dia}}$ is perpendicular to $\mathbf{B}$ and therefore
    $j_{\mathrm{dia},\parallel}=0$; this is distinct from return-current
    contributions such as [Pfirsch-Schlüter current
    density](name:pfirsch_schlueter_current_density).

    Sign convention: Positive when the diamagnetic current-density vector has a
    component in the local magnetic-field direction $\hat{\mathbf{b}}$.
  unit: A.m^-2

- name: parallel_ion_charge_state_convection_velocity
  description: |-
    Parallel component of the effective convective velocity used for particle
    transport of a specified ion charge state in an edge plasma.
  documentation: |-
    Parallel component of the effective convective velocity used for particle
    transport of a specified ion charge state in an edge plasma. It is the
    field-aligned component of the vector defined by [ion charge-state
    convection velocity](name:ion_charge_state_convection_velocity) for that
    charge-state population.

    The parallel component is defined by projection onto the local
    magnetic-field direction:

    $$
    v_{s,\parallel} = \mathbf{v}_s \cdot \hat{\mathbf{b}}
    $$

    where $v_{s,\parallel}$ is this parallel ion charge-state convection
    velocity, $\mathbf{v}_s$ is the [ion charge-state convection
    velocity](name:ion_charge_state_convection_velocity) vector for ion charge
    state $s$, and $\hat{\mathbf{b}}$ is the unit vector along the local
    magnetic-field vector $\mathbf{B}$.

    The scope is charge-state resolved: $s$ denotes one specified ion charge
    state in the edge plasma, with no summation over charge states and no
    density-weighted mean over all charge states. The quantity is an effective
    particle-transport coefficient for that charge state, including the
    applicable thermal and nonthermal populations represented by the
    charge-state particle population.

    It is distinct from the parallel ion fluid velocity or kinetic bulk
    velocity: it is the coefficient multiplying charge-state number density in
    convective particle transport and need not equal a moment of the particle
    velocity distribution. The total particle flux may also contain diffusive
    transport, which is excluded from this convective velocity.

    The field-aligned convective particle-flux component
    $\Gamma_{s,\parallel,\mathrm{conv}}$ satisfies
    $\Gamma_{s,\parallel,\mathrm{conv}} = n_s v_{s,\parallel}$, where
    $\Gamma_{s,\parallel,\mathrm{conv}}$ is the field-aligned convective
    particle-flux component and $n_s$ is the number density of ion charge state
    $s$. Together with directional components such as the [poloidal ion
    charge-state convection
    velocity](name:poloidal_ion_charge_state_convection_velocity) and [radial
    ion charge-state convection
    velocity](name:radial_ion_charge_state_convection_velocity), it is a
    projection of the same parent vector; the parallel direction is
    field-aligned and is not the poloidal tangent direction.

    Sign convention: Positive when the effective convection velocity is directed
    along the local magnetic-field vector $\mathbf{B}$.
  unit: m.s^-1

- name: parallel_ion_charge_state_energy_diffusion_coefficient
  description: |-
    Fick's-law proportionality coefficient relating the density-normalized
    parallel diffusive thermal energy flux of a specified ion charge state to
    its local temperature gradient.
  documentation: |-
    The ion charge-state energy diffusion coefficient $D_{i,z,E,\parallel}$
    quantifies gradient-driven diffusive transport of thermal energy carried by
    ions in one specified charge state $z$ along the magnetic field. It is the
    parallel component of the direction-agnostic [ion charge-state energy
    diffusion coefficient](name:ion_charge_state_energy_diffusion_coefficient).

    The defining relation for the density-normalized parallel diffusive energy
    flux is:

    $$
    \frac{Q_{i,z,\parallel,\mathrm{diff}}}{n_{i,z}} = -D_{i,z,E,\parallel}\,\nabla_{\parallel} T_{i,z}
    $$

    where $Q_{i,z,\parallel,\mathrm{diff}}$ is the parallel diffusive
    thermal-energy flux of charge state $z$, $n_{i,z}$ is its number density,
    $T_{i,z}$ is its temperature, and $\nabla_{\parallel}$ is the derivative
    along the magnetic-field direction.

    This coefficient applies to one specified ion charge state and is not summed
    over charge states. It excludes convective, advective, and $E \times B$
    contributions; the broader [parallel ion energy diffusion
    coefficient](name:parallel_ion_energy_diffusion_coefficient) represents the
    corresponding transport aggregated over ion species.
  unit: m^2.s^-1

- name: parallel_ion_charge_state_momentum_source
  description: |-
    Parallel ion charge-state momentum source is the parallel projection of the
    area-normalized momentum source acting on one specified ion charge state. It
    represents momentum transfer along the local magnetic-field direction.
  documentation: |-
    Parallel ion charge-state momentum source is the parallel projection of the
    area-normalized momentum source acting on one specified ion charge state. It
    represents directional momentum transfer to or from that charge state
    resolved along the local magnetic-field direction, rather than summed over
    charge states.

    The parallel projection is defined by projecting the momentum-source vector
    for that charge state onto the local magnetic-field unit vector:

    $$
    S_{\parallel,i,Z} = \mathbf{S}_{i,Z} \cdot \hat{\mathbf{b}}
    $$

    where $\mathbf{S}_{i,Z}$ is the area-normalized momentum-source vector
    acting on ion species $i$ in charge state $Z$, and $\hat{\mathbf{b}} =
    \mathbf{B}/|\mathbf{B}|$ is the unit vector along the local magnetic field.

    This quantity is distinct from the [poloidal ion charge-state momentum
    source](name:poloidal_ion_charge_state_momentum_source) and the [toroidal
    ion charge-state momentum
    source](name:toroidal_ion_charge_state_momentum_source), which use poloidal
    and toroidal projections of the same charge-state-resolved momentum source.

    Sign convention: Positive when the momentum-source vector acting on the
    charge state has a component in the direction of $\hat{\mathbf{b}}$, the
    local magnetic-field unit vector.
  unit: kg.m^-1.s^-2

- name: parallel_ion_energy_diffusion_coefficient
  description: |-
    Fick's-law proportionality coefficient relating the density-normalized
    diffusive thermal-energy flux of the ion population to the local
    ion-temperature gradient along magnetic field lines.
  documentation: |-
    The parallel ion energy diffusion coefficient quantifies gradient-driven
    diffusive transport of thermal energy carried by the ion population,
    providing the Fick's-law proportionality between the density-normalized
    diffusive parallel ion heat flux and the ion-temperature gradient along
    magnetic field lines. It is the field-aligned component of the
    direction-agnostic [ion energy diffusion
    coefficient](name:ion_energy_diffusion_coefficient), excluding convective
    and other non-Fickian heat-flux contributions.

    The defining Fickian relation for the parallel diffusive ion thermal-energy
    flux is:

    $$
    Q_{i,\parallel,\mathrm{diff}} = -n_i D_{i,E,\parallel} \nabla_\parallel T_i
    $$

    where $Q_{i,\parallel,\mathrm{diff}}$ is the parallel diffusive ion
    thermal-energy flux, $n_i$ is the ion number density associated with the
    modeled ion population, $D_{i,E,\parallel}$ is the parallel ion energy
    diffusion coefficient, $T_i$ is the corresponding ion temperature, and
    $\nabla_\parallel T_i$ is its derivative along the magnetic-field direction.
    The coefficient does not select a particular charge state or impose the
    total-ion aggregation represented by [parallel total ion energy diffusion
    coefficient](name:parallel_total_ion_energy_diffusion_coefficient);
    [parallel ion charge-state energy diffusion
    coefficient](name:parallel_ion_charge_state_energy_diffusion_coefficient) is
    the charge-state-resolved counterpart.
  unit: m^2.s^-1

- name: pedestal_thermal_electron_energy
  description: |-
    Volume-integrated random kinetic energy of bulk thermal electrons within the
    plasma pedestal, excluding suprathermal electrons and non-electron
    populations.
  documentation: |-
    Pedestal thermal electron energy is the random kinetic energy stored by the
    bulk thermal electron population within the plasma pedestal. It is an
    extensive energy content, not a local energy density or an energy-transfer
    rate.

    For nonrelativistic thermal electrons, the defining pressure integral is:

    $$
    W_{\mathrm{ped},e} = \frac{3}{2}\int_{V_{\mathrm{ped}}} p_{e,\mathrm{th}}\,dV
    $$

    where $W_{\mathrm{ped},e}$ is the pedestal thermal electron energy,
    $V_{\mathrm{ped}}$ is the volume occupied by the pedestal region,
    $p_{e,\mathrm{th}}$ is the scalar thermal-electron pressure, and $dV$ is the
    physical volume element. The scalar pressure is one-third of the trace of
    the pressure tensor associated with random thermal-electron motion.

    The integral covers only the pedestal region, rather than the entire
    confined plasma, and excludes suprathermal electrons, directed bulk-flow
    energy, and non-electron populations. Restricting the volume integral
    defining [thermal electron energy](name:thermal_electron_energy) to the
    pedestal gives this quantity. The corresponding energy stored by pedestal
    ions is [pedestal thermal ion energy](name:pedestal_thermal_ion_energy).
  unit: J

- name: pedestal_thermal_ion_energy
  description: |-
    Volume-integrated random kinetic energy of thermal ions within the H-mode
    edge pedestal, excluding electron energy, bulk-flow energy, and nonthermal
    ion contributions.
  documentation: |-
    Pedestal thermal ion energy is the internal energy stored by thermal-ion
    populations within the H-mode edge pedestal. It is the pedestal-region
    contribution to [thermal ion energy](name:thermal_ion_energy), rather than
    the energy of the entire confined ion population.

    For isotropic, nonrelativistic thermal ions, the defining relation is:

    $$
    W_{\mathrm{ped},i} = \frac{3}{2}\int_{V_{\mathrm{ped}}} p_{\mathrm{th},i}\,dV
    $$

    where $W_{\mathrm{ped},i}$ is the pedestal thermal ion energy,
    $V_{\mathrm{ped}}$ is the pedestal integration region, $p_{\mathrm{th},i}$
    is the thermal-ion pressure summed over all included ion species and
    positive charge states, and $dV$ is a differential physical volume element.

    The quantity is a volume-integrated energy content, not the local [ion
    average temperature at the pedestal
    top](name:ion_average_temperature_at_pedestal_top). It excludes directed
    bulk-flow energy, fast-ion and other suprathermal contributions, and
    electron energy. The separate [pedestal thermal electron
    energy](name:pedestal_thermal_electron_energy) supplies the electron
    contribution; their sum gives the combined ion–electron thermal energy for
    the same pedestal region.
  unit: J

- name: plasma_momentum_flux
  description: |-
    Rate of transport of linear momentum per unit area across an oriented
    surface, summed over charged plasma populations and excluding neutral
    transport.
  documentation: |-
    The plasma momentum flux describes the rate at which charged plasma
    populations transport linear momentum through a unit area of an oriented
    surface. It includes convective, isotropic-pressure, and viscous or
    turbulent-stress contributions.

    $$
    \mathbf{F}_{\mathrm{pl}} = \boldsymbol{\Pi}_{\mathrm{pl}}\cdot\hat{\mathbf n}, \qquad \boldsymbol{\Pi}_{\mathrm{pl}} = \sum_{s\in\mathrm{charged}}\left(\rho_s\mathbf{v}_s\mathbf{v}_s + p_s\mathbf{I} + \boldsymbol{\pi}_s\right)
    $$

    Here, $\mathbf{F}_{\mathrm{pl}}$ is the momentum-flux vector,
    $\boldsymbol{\Pi}_{\mathrm{pl}}$ is the charged-plasma momentum-flux tensor,
    and $\hat{\mathbf n}$ is the oriented unit surface normal. The sum covers
    charged species $s$; $\rho_s$ is mass density, $\mathbf{v}_s$ bulk velocity,
    $p_s$ scalar pressure, $\mathbf{I}$ the identity tensor, and
    $\boldsymbol{\pi}_s$ the viscous or turbulent stress tensor.

    This charged-plasma specialization belongs to the broader [momentum
    flux](name:momentum_flux) family and excludes the neutral contribution
    represented by [neutral momentum flux](name:neutral_momentum_flux). Its
    field-aligned projection is [parallel plasma momentum
    flux](name:parallel_plasma_momentum_flux).

    Sign convention: Positive when momentum transport across the surface is
    directed along the chosen surface normal.
  unit: kg.m^-1.s^-2

- name: parallel_plasma_momentum_flux
  description: |-
    Parallel plasma momentum flux is the transfer rate per unit area of
    field-aligned linear momentum across an oriented surface, summed over
    charged plasma populations.
  documentation: |-
    Parallel plasma momentum flux is the signed rate per unit area at which the
    field-aligned component of [linear momentum](name:momentum) crosses an
    oriented surface. The parallel qualifier selects the transported momentum
    component, not the direction normal to the surface.

    It is the field-aligned projection of the [plasma momentum
    flux](name:plasma_momentum_flux):

    $$
    \Gamma_{\parallel,\mathrm{pl}} = \hat{\mathbf b}\cdot\mathbf F_{\mathrm{pl}} = \hat{\mathbf b}\cdot\left(\boldsymbol{\Pi}_{\mathrm{pl}}\cdot\hat{\mathbf n}\right)
    $$

    where $\Gamma_{\parallel,\mathrm{pl}}$ is this parallel momentum flux,
    $\hat{\mathbf b}$ is the unit vector along the nonzero local magnetic field,
    $\mathbf F_{\mathrm{pl}}$ is the vector of plasma momentum transported per
    unit area and time across the oriented surface,
    $\boldsymbol{\Pi}_{\mathrm{pl}}$ is the plasma momentum-flux tensor, and
    $\hat{\mathbf n}$ is the chosen positive unit normal to that surface.

    The quantity applies to aggregate charged-population momentum transport in
    the edge plasma, summed over electrons and all ion species and ionic charge
    states. It includes convective, isotropic-pressure, and viscous or
    turbulent-stress contributions; it is not restricted to diffusive transport
    and excludes neutral momentum transport. The [parallel ion charge-state
    momentum flux](name:parallel_ion_charge_state_momentum_flux) instead
    restricts the transported momentum to one ion charge state.

    Sign convention: Positive when the net momentum transferred across the
    surface in its chosen positive-normal direction is co-directed with the
    local magnetic field.
  unit: kg.m^-1.s^-2

- name: poloidal_current_density_due_to_heat_viscosity
  description: |-
    Poloidal current density due to heat viscosity is the signed local charge
    flux in the poloidal direction generated by heat-viscosity stresses in a
    collisional magnetized plasma.
  documentation: |-
    Poloidal current density due to heat viscosity is the local poloidal
    component of the electric-current contribution generated by heat-viscosity
    stresses in a collisional magnetized-plasma fluid closure.

    Its defining projection is

    $$
    j_{\mathrm{p}} = \mathbf{j}_{\mathrm{hv}} \cdot \hat{\mathbf{e}}_{\mathrm{p}}
    $$

    where $j_{\mathrm{p}}$ is the poloidal current density due to heat
    viscosity, $\mathbf{j}_{\mathrm{hv}}$ is the [heat-viscosity current-density
    vector](name:current_density_due_to_heat_viscosity), and
    $\hat{\mathbf{e}}_{\mathrm{p}}$ is the unit vector along the designated
    local poloidal direction. This direction lies in a plane of constant
    toroidal angle in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. Its
    positive orientation must be specified by the local poloidal-component
    convention; the heat-viscosity attribution alone does not determine it.

    This is a local, unaveraged contribution to [electric current
    density](name:current_density), not a surface-integrated current or the
    total current density from all mechanisms. Only the heat-viscosity
    contribution is included; the definition imposes no restriction to a
    particular species or plasma region. The quantity is a signed directional
    projection, not the magnitude of the current in the poloidal plane.

    Unlike [parallel current density due to heat
    viscosity](name:parallel_current_density_due_to_heat_viscosity), which
    projects the same parent vector along the local magnetic field, this
    quantity projects onto the designated local poloidal direction. Poloidal
    therefore identifies the projection, not the orientation of the viscous
    stress responsible for the current.

    Sign convention: Positive when the heat-viscosity current has a component
    along the designated positive local poloidal direction
    $\hat{\mathbf{e}}_{\mathrm{p}}$.
  unit: A.m^-2

- name: poloidal_current_density_due_to_ion_neutral_friction
  description: |-
    Poloidal current density due to ion–neutral friction is the signed
    electric-charge flux contribution along the local poloidal tangent arising
    from momentum exchange between ions and neutrals.
  documentation: |-
    Poloidal current density due to ion–neutral friction is the poloidal
    projection of the [current density due to ion–neutral
    friction](name:current_density_due_to_ion_neutral_friction). It represents
    the electric-current contribution attributable to frictional momentum
    exchange between plasma ions and neutral particles.

    The component is defined by

    $$
    j_{\mathrm{p}} = \mathbf{j}_{\mathrm{in}} \cdot \hat{\mathbf{e}}_{\mathrm{p}}
    $$

    where $j_{\mathrm{p}}$ is this poloidal current-density contribution,
    $\mathbf{j}_{\mathrm{in}}$ is the ion–neutral-friction current-density
    vector, and $\hat{\mathbf{e}}_{\mathrm{p}}$ is the local unit poloidal
    tangent directed toward increasing poloidal angle. The tangent lies in a
    plane of constant toroidal angle in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is distance from the toroidal symmetry axis, $\phi$ is
    toroidal angle, and $Z$ is vertical height. The positive poloidal-angle
    orientation must be specified independently; the cylindrical basis alone
    does not fix it.

    This is a local contribution in a partially ionized plasma, without spatial
    averaging or integration. It excludes contributions assigned to other
    mechanisms and does not represent the total plasma [current
    density](name:current_density). The [toroidal current density due to
    ion–neutral
    friction](name:toroidal_current_density_due_to_ion_neutral_friction) is a
    different projection of the same mechanism-resolved vector, rather than an
    additional mechanism. The poloidal projection is not the
    magnetic-field-parallel projection.

    Sign convention: Positive when the ion–neutral-friction contribution carries
    conventional electric current along the local poloidal tangent toward
    increasing poloidal angle.
  unit: A.m^-2

- name: poloidal_electron_energy_diffusivity
  description: |-
    Effective coefficient relating the poloidal diffusive flux of electron
    thermal energy to the poloidal gradient of electron thermal-energy density
    in the edge plasma.
  documentation: |-
    The poloidal electron energy diffusivity describes local, gradient-driven
    smoothing of electron thermal-energy density in the edge plasma. It is the
    poloidal specialization of the [electron energy
    diffusivity](name:electron_energy_diffusivity).

    The defining local closure is:

    $$
    Q_{e,W,\mathrm{p},\mathrm{diff}} = -D_{e,W,\mathrm{p}}\,\frac{\partial u_e}{\partial l_{\mathrm{p}}}
    $$

    where $Q_{e,W,\mathrm{p},\mathrm{diff}}$ is the poloidal component of
    diffusive electron thermal-energy flux density, $D_{e,W,\mathrm{p}}$ is this
    diffusivity, $u_e$ is electron thermal-energy density, and $l_{\mathrm{p}}$
    is physical distance along the local poloidal transport direction. The minus
    sign expresses down-gradient transport for a nonnegative diffusivity.

    The poloidal direction runs around the magnetic axis within a plane of
    constant toroidal angle in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. This differs from the field-aligned direction associated with
    [parallel electron energy
    diffusivity](name:parallel_electron_energy_diffusivity).

    This coefficient applies locally to electron thermal energy, without spatial
    averaging or aggregation with ion or neutral energy transport. It excludes
    advective and convective contributions, including the contribution
    parameterized by [electron energy convection
    velocity](name:electron_energy_convection_velocity). It is an
    energy-density-gradient coefficient, not directly a temperature-gradient
    heat-transport coefficient; conversion requires the electron density,
    heat-capacity factors, and their spatial dependence to be specified.
  unit: m^2.s^-1

- name: radial_current_density_due_to_parallel_viscosity
  description: |-
    Radial current density due to parallel viscosity is the signed major-radius
    projection of the electric current contribution associated with
    magnetic-field-aligned viscous stress.
  documentation: |-
    Radial current density due to parallel viscosity is the signed local
    projection of the current contribution associated with the divergence of
    parallel viscous stress onto the major-radius direction. Parallel identifies
    the viscous-stress mechanism, not the direction of the current.

    The defining projection is:

    $$
    j_R^{(\mathrm{pv})} = \mathbf{j}^{(\mathrm{pv})}\cdot\hat{R}
    $$

    where $j_R^{(\mathrm{pv})}$ is the radial current-density contribution,
    $\mathbf{j}^{(\mathrm{pv})}$ is the full [current-density vector due to
    parallel viscosity](name:current_density_due_to_parallel_viscosity), and
    $\hat{R}$ is the unit vector toward increasing major radius. In the
    right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is distance from the
    toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical
    height. The superscript $\mathrm{pv}$ identifies the parallel-viscosity
    contribution.

    In the magnetized edge plasma, this is a local, mechanism-resolved
    contribution to [current density](name:current_density), not the total
    radial current density or a flux-surface average. It excludes the
    perpendicular-viscosity contribution. The major-radius direction is not
    generally the flux-surface-normal direction or a direction perpendicular to
    the magnetic field.

    Parallel viscosity does not require its full current-density contribution to
    be field aligned. The [parallel current density due to parallel
    viscosity](name:parallel_current_density_due_to_parallel_viscosity) is the
    magnetic-field-aligned projection of the same parent vector, rather than its
    major-radius projection.

    Sign convention: Positive when the parallel-viscosity current-density
    contribution points toward increasing major radius, away from the toroidal
    symmetry axis.
  unit: A.m^-2

- name: radial_electron_convection_velocity
  description: |-
    Signed major-radius component of the effective velocity multiplying electron
    number density in the advective part of electron-particle transport.
  documentation: |-
    Radial electron convection velocity is the effective coefficient of the
    density-proportional advective electron particle flux. It represents
    directed convection after density-gradient-driven diffusive transport has
    been separated.

    The radial convective particle flux is defined by

    $$
    \Gamma_{e,R}^{\mathrm{conv}} = n_e v_{e,R}
    $$

    where $\Gamma_{e,R}^{\mathrm{conv}}$ is the major-radius component of
    electron particle flux due to convection, $n_e$ is electron number density,
    and $v_{e,R}$ is this radial convection velocity.

    The quantity applies to the electron particle channel, not to ion or neutral
    transport, and is not a sum over species. It is the radial component in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    measured from the toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$
    is vertical height. This major-radius direction is not generally normal to a
    magnetic flux surface.

    The quantity excludes density-gradient-driven transport, whose radial
    coefficient is the [radial effective electron
    diffusivity](name:radial_effective_electron_diffusivity), and need not equal
    the radial bulk electron flow velocity. It specializes [electron convection
    velocity] by specifying the major-radius projection; [electron particle
    convection velocity](name:electron_particle_convection_velocity) is the
    corresponding unprojected vector coefficient.

    Sign convention: Positive when the electron convective velocity points
    toward increasing major radius $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  unit: m.s^-1

- name: radial_ion_charge_state_diffusivity
  description: |-
    Radial ion charge-state diffusivity is the effective Fickian particle
    diffusivity for ions in a specified ionization state along the radial
    direction.
  documentation: |-
    Radial ion charge-state diffusivity is the effective Fickian particle
    diffusivity for ions in a specified ionization state along the radial
    direction. It is the scalar transport coefficient that relates the radial
    diffusive particle flux density of that charge state to the negative radial
    gradient of its number density.

    For the radial projection in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height, the defining Fickian relation is:

    $$
    \Gamma^{\mathrm{diff}}_{s,R} = -D_{s,R}\,\nabla_R n_s
    $$

    where $\Gamma^{\mathrm{diff}}_{s,R}$ is the radial diffusive particle flux
    density of charge state $s$, $D_{s,R}$ is this diffusivity, $n_s$ is the
    number density of charge state $s$, and $\nabla_R n_s =
    \hat{\mathbf{R}}\cdot\nabla n_s$ is its derivative along increasing $R$.

    This quantity is charge-state-resolved and applies to one ionization state,
    unlike the charge-state-averaged ion diffusivity. It is the radial
    counterpart of [ion charge-state
    diffusivity](name:ion_charge_state_diffusivity) and is equivalent to [radial
    ion charge-state diffusion
    coefficient](name:radial_ion_charge_state_diffusion_coefficient) when the
    same Fickian closure is used. Radial denotes the cylindrical
    $\hat{\mathbf{R}}$ projection and is not synonymous with a
    flux-surface-normal projection; convective transport and particle sources or
    sinks are excluded.
  unit: m^2.s^-1

- name: radial_ion_particle_convection_velocity
  description: |-
    Radial component of the effective convective velocity used for ion particle
    transport in the edge plasma, taken along increasing major radius R in the
    right-handed cylindrical (R, φ, Z) frame. It represents collective
    particle-transport advection and is distinct from the ion fluid velocity.
  documentation: |-
    Radial component of the effective convective velocity used for ion particle
    transport is the scalar transport velocity whose multiplication by ion
    particle density gives the advective part of the ion particle flux in the
    radial direction. For this quantity, the radial direction is the
    major-radius direction $\hat R$ of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is
    vertical height.

    The defining relation for the radial convective contribution to the ion
    particle flux is:

    $$
    \Gamma_{i,R}^{\mathrm{conv}} = n_i v_{i,R}^{\mathrm{conv}}
    $$

    where $\Gamma_{i,R}^{\mathrm{conv}}$ is the radial convective ion particle
    flux, $n_i$ is the ion particle density, and $v_{i,R}^{\mathrm{conv}}$ is
    the radial ion particle convection velocity.

    The quantity applies to collective ion particle transport in the edge plasma
    and to the ion species as a whole. Because velocity is an intensive
    per-particle field, the species-level ion value is the density-weighted mean
    over all ion charge states; if $q$ indexes ion charge state,
    $v_{i,q,R}^{\mathrm{conv}}$ is the radial convection velocity of charge
    state $q$, and $n_{i,q}$ is its particle density, then
    $v_{i,R}^{\mathrm{conv}} = (\sum_q n_{i,q}
    v_{i,q,R}^{\mathrm{conv}})/(\sum_q n_{i,q})$.

    This is an effective transport coefficient, not the ion fluid velocity, not
    an individual charge-state flow velocity, and not the diffusive contribution
    to the radial particle flux. A flux-surface-normal convection velocity is a
    different projection; it coincides with this radial component only where the
    flux-surface normal is parallel to $\hat R$.

    The direction-complement and population-resolved sibling [parallel ion
    charge-state convection
    velocity](name:parallel_ion_charge_state_convection_velocity) describes the
    magnetic-field-parallel convective velocity for one ion charge state. This
    quantity instead describes the radial component for the
    charge-state-aggregated ion population.

    Sign convention: Positive when the velocity is directed toward increasing
    major radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: ratio_of_vertical_vorticity_to_major_radius
  description: |-
    Vertical plasma vorticity divided by the local major radius, retaining the
    signed rotation rate about the vertical axis with inverse-length scaling.
  documentation: |-
    This quantity is the major-radius-scaled form of [vertical
    vorticity](name:vertical_vorticity), measuring local bulk-plasma rotation
    about the vertical direction per unit major radius. It is defined in the
    right-handed cylindrical $(R,\phi,Z)$ frame.

    $$
    \omega_Z^*(R,\phi,Z)=\frac{\omega_Z(R,\phi,Z)}{R},\qquad \omega_Z=(\nabla\times\mathbf{v})\cdot\hat{\mathbf{Z}}
    $$

    where $R$ is major radius measured from the toroidal symmetry axis, $\phi$
    is toroidal angle, $Z$ is vertical height, $\mathbf{v}$ is the plasma
    bulk-velocity vector, $\nabla$ is the spatial gradient, and
    $\hat{\mathbf{Z}}$ is the vertical unit vector. The scaling applies to the
    vertical-vorticity component itself and does not represent the full
    [vorticity](name:vorticity) vector.

    Sign convention: Positive when the bulk-flow rotation is in the $+Z$ sense,
    namely counterclockwise in the $(R,\phi)$ plane when viewed from $+Z$.
  unit: m^-1.s^-1

- name: thermal_ion_energy_diffusion_coefficient
  description: |-
    Fick's-law proportionality coefficient relating density-normalized diffusive
    thermal-energy flux of the ion population to its local ion-temperature
    gradient, without selecting a transport direction.
  documentation: |-
    The ion energy diffusion coefficient $D_{i,E}$ quantifies gradient-driven
    diffusive transport of thermal energy carried by the ion population. It is
    the direction-agnostic ion-population coefficient underlying
    component-specific quantities such as the [total thermal ion energy
    diffusion coefficient](name:total_thermal_ion_energy_diffusion_coefficient)
    and the radial form [radial total thermal ion energy diffusion
    coefficient](name:radial_total_thermal_ion_energy_diffusion_coefficient),
    and is distinct from convective or drift contributions to the ion heat flux.

    The defining Fickian relation for the diffusive ion thermal-energy flux is:

    $$
    \mathbf{Q}_{i,\mathrm{diff}} = -n_i D_{i,E}\nabla T_i
    $$

    where $\mathbf{Q}_{i,\mathrm{diff}}$ is the diffusive ion thermal-energy
    flux, $n_i$ is the total ion number density, $D_{i,E}$ is the ion energy
    diffusion coefficient, $T_i$ is the total-ion temperature expressed as
    thermal energy per ion, and $\nabla T_i$ is its spatial gradient.

    For a total-ion quantity, the coefficient is the density-weighted mean over
    all ion species and charge states. Direction-specific projections, including
    the radial component, retain this physical definition while selecting a
    transport direction. The leading minus sign specifies down-gradient Fickian
    diffusion for a positive coefficient.
  unit: m^2.s^-1

- name: total_thermal_ion_energy_diffusion_coefficient
  description: |-
    Effective coefficient relating diffusive transport of total thermal energy
    carried by thermal ions to the spatial gradient of their energy density,
    without fixing a direction.
  documentation: |-
    This quantity characterizes diffusive transport of the total thermal energy
    carried by the thermal-ion population. It is the direction-independent
    parent of directional components such as the [radial total thermal-ion
    energy diffusion
    coefficient](name:radial_total_thermal_ion_energy_diffusion_coefficient).

    For a selected transport direction $a$, the effective coefficient is defined
    through the diffusive energy flux:

    $$
    q_{i,\mathrm{diff}}^{(a)} = -D_{i,E}^{(a)}\frac{\partial w_i}{\partial x_a}
    $$

    where $q_{i,\mathrm{diff}}^{(a)}$ is the thermal-ion diffusive energy-flux
    component, $D_{i,E}^{(a)}$ is the corresponding energy-diffusion
    coefficient, $w_i$ is the total thermal-ion energy density, and $x_a$ is the
    coordinate along the selected direction. The coefficient excludes
    convective, conductive, and explicit source or sink contributions. It is the
    total-energy specialization of the broader [thermal-ion energy diffusion
    coefficient](name:thermal_ion_energy_diffusion_coefficient).
  unit: m^2.s^-1

- name: radial_total_thermal_ion_energy_diffusion_coefficient
  description: |-
    Effective radial coefficient for diffusive transport of total thermal energy
    carried by the ion population in edge plasma.
  documentation: |-
    This quantity is the effective diffusivity for radial transport of total ion
    thermal energy. “Total” denotes the sum over the included ion species, while
    the thermal scope distinguishes energy transport from particle and momentum
    transport.

    The diffusive radial energy flux is related to the radial gradient of total
    ion energy density by:

    $$
    q_{i,E,R}^{\mathrm{diff}} = -D_{i,E,R}\frac{\partial w_{i,E}}{\partial R}
    $$

    where $q_{i,E,R}^{\mathrm{diff}}$ is the radial diffusive flux of ion
    energy, $D_{i,E,R}$ is this radial energy diffusion coefficient, $w_{i,E}$
    is total ion energy density, and $R$ is the major-radius coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame.

    The coefficient describes the diffusive contribution only; it excludes
    advective transport represented by the [radial ion-state energy convection
    velocity](name:radial_ion_state_energy_convection_velocity). Its directional
    role parallels that of the [radial momentum diffusion
    coefficient](name:radial_momentum_diffusion_coefficient), while its
    transported quantity is ion energy.
  unit: m^2.s^-1

- name: toroidal_current_density_due_to_parallel_viscosity
  description: |-
    Toroidal current density due to parallel viscosity is the signed toroidal
    projection of the electric current contribution associated with
    magnetic-field-aligned viscous stress.
  documentation: |-
    Toroidal current density due to parallel viscosity is the signed local
    projection of the current contribution associated with the divergence of
    parallel viscous stress onto the geometric toroidal direction. Parallel
    identifies the viscous-stress mechanism, not the current projection.

    The defining projection in the right-handed cylindrical $(R, \phi, Z)$ frame
    is:

    $$
    j_\phi^{(\mathrm{pv})} = \mathbf{j}^{(\mathrm{pv})}\cdot\hat{\phi}
    $$

    where $j_\phi^{(\mathrm{pv})}$ is the toroidal current-density contribution,
    $\mathbf{j}^{(\mathrm{pv})}$ is the full [current-density vector due to
    parallel viscosity](name:current_density_due_to_parallel_viscosity), and
    $\hat{\phi}$ is the unit vector toward increasing toroidal angle $\phi$.
    Here $R$ is the major radius measured from the symmetry axis, $Z$ is
    vertical height, and the superscript $\mathrm{pv}$ identifies the
    parallel-viscosity contribution.

    In the magnetized edge plasma, this is a local, mechanism-resolved
    contribution to [current density](name:current_density), not the total
    toroidal current density or a flux-surface average. It excludes the
    perpendicular-viscosity contribution, whose toroidal projection is [toroidal
    current density due to perpendicular
    viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity).

    Parallel viscosity does not require its full current-density contribution to
    be field aligned. The [parallel current density due to parallel
    viscosity](name:parallel_current_density_due_to_parallel_viscosity) is the
    magnetic-field-aligned projection of the same parent vector and is not
    generally equal to this toroidal projection.

    Sign convention: Positive when the parallel-viscosity current-density
    contribution points toward increasing toroidal angle $\phi$,
    counter-clockwise when viewed from above.
  unit: A.m^-2

- name: toroidal_flux_coordinate_at_pedestal_top
  description: |-
    Non-negative radius-like toroidal-flux label identifying the magnetic flux
    surface at the core-side shoulder of the H-mode edge transport barrier.
  documentation: |-
    This quantity is the non-negative, radius-like toroidal-flux label of the
    magnetic flux surface at the H-mode [pedestal
    top](name:normalized_poloidal_flux_coordinate_of_pedestal), the core-side
    shoulder of the edge transport barrier. It locates that surface on the
    physical toroidal-flux scale rather than specifying a geometric distance.

    The coordinate is defined from enclosed toroidal magnetic flux by:

    $$
    \rho_{\rm tor} = \sqrt{\frac{\Phi_{\rm tor}}{\pi B_0}}
    $$

    where $\rho_{\rm tor}$ is the toroidal flux coordinate, $\Phi_{\rm tor}$ is
    the enclosed toroidal magnetic flux, $B_0$ is the positive reference vacuum
    toroidal-field magnitude that sets the coordinate scale, and $\pi$ is the
    circular constant.

    The value applies to the single nested magnetic flux surface passing through
    the pedestal top. It is a local flux-surface label, not a flux-surface or
    volume average, and it has no particle-population or charge-state
    aggregation.

    This is the pedestal-top specialization of the parent [toroidal flux
    coordinate](name:toroidal_flux_coordinate), obtained by evaluating that
    coordinate on the pedestal-top surface. Unlike the [normalized toroidal flux
    coordinate at the pedestal
    top](name:normalized_toroidal_flux_coordinate_at_pedestal_top), it retains
    the radius-like physical scale of the toroidal flux coordinate.
  unit: m

- name: toroidal_ion_charge_state_momentum_source
  description: |-
    The toroidal component of the area-normalized momentum source for a
    specified ion charge state represents directional momentum transfer in an
    edge plasma.
  documentation: |-
    The toroidal component of the area-normalized momentum source for a
    specified ion charge state represents directional momentum transfer in an
    edge plasma. It is resolved for one ion species and charge state rather than
    summed over charge states.

    The toroidal component is defined by

    $$
    S_{\phi,i,q} = \mathbf{S}_{i,q} \cdot \hat{\phi}
    $$

    where $\mathbf{S}_{i,q}$ is the area-normalized momentum source for ion
    species $i$ in charge state $q$, and $\hat{\phi}$ is the toroidal unit
    vector in the right-handed cylindrical $(R,\phi,Z)$ frame.

    This quantity is the toroidal specialization of the charge-state-resolved
    vector [ion charge state momentum
    source](name:ion_charge_state_momentum_source). It represents net momentum
    transfer associated with ionization, recombination, charge exchange, and
    related collisional processes; unlike [toroidal ion momentum
    source](name:toroidal_ion_momentum_source), it is not summed over ion charge
    states. Its corresponding poloidal projection is [poloidal ion charge state
    momentum source](name:poloidal_ion_charge_state_momentum_source).

    Sign convention: Positive when the sourced momentum points in the direction
    of increasing toroidal angle $\phi$.
  unit: kg.m^-1.s^-2

- name: toroidal_neutral_internal_state_momentum_diffusion_coefficient
  description: |-
    Kinematic coefficient for down-gradient diffusion of neutral momentum along
    the toroidal direction, resolved for one electronic, vibrational, or
    rotational internal state.
  documentation: |-
    This coefficient governs diffusive transport of [momentum](name:momentum)
    along the toroidal direction for a selected neutral species in one specified
    internal state. The toroidal direction follows increasing toroidal angle in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    For a local, componentwise Fick-law closure, the defining relation is:

    $$
    \Pi^{\mathrm{diff}}_{0a,\phi} = -D_{0a,\phi}\frac{1}{R}\frac{\partial g_{0a}}{\partial\phi}
    $$

    where $\Pi^{\mathrm{diff}}_{0a,\phi}$ is the toroidally directed diffusive
    flux of a selected momentum component, $D_{0a,\phi}$ is this diffusion
    coefficient, and $g_{0a}$ is the corresponding momentum density. The
    subscript $0$ denotes neutral particles, and $a$ identifies their internal
    state. The derivative is taken at fixed major radius and vertical height;
    the geometric factor converts the angular derivative to a derivative along
    physical toroidal arc length.

    The coefficient applies to the specified internal state, without summation
    or averaging over other internal states. The toroidal qualifier selects the
    flux and gradient direction, not the transported momentum component. This
    momentum-density-gradient closure excludes convective transport,
    nondiffusive momentum flux, and momentum sources; it is not defined by a
    flow-velocity gradient.

    This quantity is the toroidal directional member of the [neutral
    internal-state momentum diffusion
    coefficient](name:neutral_internal_state_momentum_diffusion_coefficient).
    The corresponding [poloidal
    member](name:poloidal_neutral_internal_state_momentum_diffusion_coefficient)
    instead selects the poloidal transport direction.
  unit: m^2.s^-1

- name: toroidal_neutral_momentum_flux
  description: |-
    Toroidal neutral momentum flux measures signed toroidal linear-momentum
    transfer per unit area and time across an oriented surface in the edge
    plasma, summed over neutral species and internal states.
  documentation: |-
    Toroidal neutral momentum flux describes the transfer of the toroidal
    component of [linear momentum](name:momentum) across an oriented surface by
    neutral atoms and molecules in the edge plasma. It is the toroidal
    projection of the [neutral momentum flux](name:neutral_momentum_flux).

    For a surface with a chosen orientation, this component is defined by:

    $$
    \Gamma_\phi^0 = \hat{\phi}\cdot\boldsymbol{\Gamma}^0(\hat{\mathbf n})
    $$

    where $\Gamma_\phi^0$ is the toroidal neutral momentum flux,
    $\boldsymbol{\Gamma}^0(\hat{\mathbf n})$ is the vector of neutral linear
    momentum transferred per unit area and time across the surface, and
    $\hat{\mathbf n}$ is the chosen surface unit normal. The superscript $0$
    denotes the neutral population. The unit vector $\hat{\phi}$ points along
    increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$ is vertical height.

    The flux includes convective transport and isotropic neutral-pressure
    contributions, summed over all neutral species and internal states; ion and
    electron contributions are excluded. The [internal-state-resolved
    counterpart](name:toroidal_neutral_internal_state_momentum_flux) instead
    restricts the neutral population to one specified internal state.

    The toroidal qualifier selects the transported momentum component, not the
    surface-normal direction: the surface normal need not be toroidal. This
    quantity is a flux of linear momentum, not angular momentum.

    Sign convention: Positive when the net neutral momentum transferred across
    the surface, counted in the chosen normal orientation, has a positive
    projection along increasing toroidal angle.
  unit: kg.m^-1.s^-2

- name: toroidal_neutral_momentum_source
  description: |-
    Toroidal component of the area-normalized momentum source for the neutral
    population in the edge plasma, summed over all neutral states. Its sign
    distinguishes neutral momentum transfer along increasing versus decreasing
    toroidal angle in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The toroidal component of the area-normalized momentum source for the
    neutral population in the edge plasma, summed over all neutral states, is
    the net neutral momentum transfer per unit area resolved along the toroidal
    direction. It is one component of the aggregate [neutral momentum
    source](name:neutral_momentum_source) acting in the neutral momentum
    balance.

    The toroidal component is defined by projecting the parent source vector
    onto the toroidal unit vector:

    $$
    S_{\phi,n} = \boldsymbol{S}_n \cdot \hat{\phi}
    $$

    where $S_{\phi,n}$ is the toroidal neutral momentum source,
    $\boldsymbol{S}_n$ is the area-normalized [neutral momentum
    source](name:neutral_momentum_source) vector, and $\hat{\phi}$ is the
    toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame.
    Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.

    The quantity is summed over all neutral states and excludes ion momentum
    sources. Unlike the [radial neutral momentum
    source](name:radial_neutral_momentum_source), [poloidal neutral momentum
    source](name:poloidal_neutral_momentum_source), and [parallel neutral
    momentum source](name:parallel_neutral_momentum_source), it resolves
    momentum transfer along the toroidal direction rather than along major
    radius, the local poloidal direction, or the local magnetic-field direction.

    Sign convention: Positive when the neutral momentum source points in the
    direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  unit: kg.m^-1.s^-2

- name: toroidal_neutral_state_velocity_due_to_diamagnetic_drift
  description: |-
    Particle-flow velocity component assigned to a neutral species state and
    projected in the toroidal direction in the right-handed cylindrical (R, φ,
    Z) frame, attributed to effective diamagnetic pressure-gradient transport.
  documentation: |-
    Toroidal neutral-state velocity due to diamagnetic drift is the signed
    toroidal component of particle-flow velocity assigned to a specified neutral
    atomic or molecular state and attributed to the diamagnetic,
    pressure-gradient part of transport. For an uncharged neutral state, it
    denotes an effective contribution in a modeled velocity decomposition rather
    than a direct single-particle Lorentz-force drift. The toroidal direction is
    $hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle increasing counter-clockwise when
    viewed from above $+\hat{Z}$, and $Z$ is vertical height.

    The toroidal scalar component is the projection of the effective
    neutral-state diamagnetic velocity vector onto $\hat{\phi}$:

    $$
    v_{a,\phi}^{\mathrm{dia}} = \hat{\phi} \cdot \mathbf{v}_{a}^{\mathrm{dia}}
    $$

    where $a$ labels the neutral state, $\mathbf{v}_{a}^{\mathrm{dia}}$ is the
    effective diamagnetic velocity contribution for that state, and $\hat{\phi}$
    is the unit vector tangent to increasing toroidal angle $\phi$.

    This quantity is a component of an effective neutral-state velocity
    decomposition, not the total neutral-state velocity and not a mechanical
    drift of an isolated neutral particle. It is distinct from the radial,
    vertical, poloidal, and field-parallel component refinements and retains
    only the toroidal contribution assigned to the diamagnetic part of the
    decomposition.
  unit: m.s^-1

- name: total_momentum_flux
  description: |-
    Rate of transport of linear momentum per unit area across an oriented
    surface in the plasma, combining convective, isotropic pressure, and viscous
    stress contributions from any species or population.
  documentation: |-
    The [momentum flux](name:momentum_flux) describes the rate at which linear
    momentum crosses a unit area of an oriented surface in the plasma. It
    encompasses convective ram pressure, isotropic thermal pressure, and viscous
    or turbulent stress contributions from the selected plasma populations.

    The momentum-flux tensor for a fluid or aggregated population is:

    $$
    \boldsymbol{\Pi} = \rho\,\mathbf{v}\mathbf{v} + p\,\mathbf{I} + \boldsymbol{\pi}
    $$

    where $\rho$ is the mass density, $\mathbf{v}$ is the bulk flow velocity,
    $p$ is the scalar pressure, $\mathbf{I}$ is the identity tensor, and
    $\boldsymbol{\pi}$ is the viscous or turbulent stress tensor. The momentum
    current through a surface with outward unit normal $\hat{n}$ is
    $\boldsymbol{\Pi}\cdot\hat{n}$.

    This structural quantity is independent of species, population, and
    directional projection. Contributions may be aggregated over charged or
    neutral populations; [toroidal total momentum
    flux](name:toroidal_total_momentum_flux) is a representative directional
    projection that combines the total edge-plasma contributions.
  unit: kg.m^-1.s^-2

- name: toroidal_total_momentum_flux
  description: |-
    Toroidal total momentum flux is the stress-like rate per unit area at which
    the toroidal component of plasma linear momentum is transported across an
    oriented surface. Contributions from included plasma species and charge
    states are combined; for flux-surface transport, it is the outward
    flux-surface average.
  documentation: |-
    Toroidal total momentum flux is the stress-like flux density of the toroidal
    component of plasma [momentum](name:momentum) across an oriented surface. It
    combines contributions from included plasma species, with charge-state
    contributions summed over all charge states. It describes transported linear
    momentum, not stored momentum or a momentum source or torque.

    The toroidal momentum flux through an oriented surface is the projection of
    the total momentum-flux tensor onto the toroidal direction and the surface
    normal:

    $$
    \Gamma_{\phi n}^{\mathrm{tot}} = \hat{\boldsymbol{\phi}} \cdot \left(\sum_s \boldsymbol{\Pi}_s^{\mathrm{tot}}\right) \cdot \hat{\mathbf{n}}
    $$

    Here, $\Gamma_{\phi n}^{\mathrm{tot}}$ is this flux, $s$ indexes the
    included plasma species and charge states, and
    $\boldsymbol{\Pi}_s^{\mathrm{tot}}$ is the total momentum-flux tensor
    contributed by $s$, including convective, isotropic-pressure, and viscous or
    turbulent-stress contributions as applicable. The vector
    $\hat{\boldsymbol{\phi}}$ points toward increasing toroidal angle $\phi$,
    and $\hat{\mathbf{n}}$ is the oriented surface normal. The toroidal
    direction is defined in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is the toroidal angle, and $Z$ is vertical
    height.

    The quantity is defined locally across an oriented surface. For transport
    across magnetic flux surfaces, the crossing direction is the outward
    flux-surface normal and the flux is the flux-surface average; this
    surface-normal direction is distinct from the toroidal momentum direction.
    The quantity is the toroidal component of [total momentum
    flux](name:total_momentum_flux), rather than a flux in the toroidal
    direction.

    Sign convention: Positive when positive toroidal linear momentum, directed
    toward increasing toroidal angle $\phi$, is transported outward across the
    flux surface.
  unit: kg.m^-1.s^-2

- name: vertical_current_density_due_to_ion_neutral_friction
  description: |-
    Vertical current density due to ion–neutral friction is the signed
    electric-charge flux contribution along the symmetry axis arising from
    momentum exchange between plasma ions and neutrals.
  documentation: |-
    Vertical current density due to ion–neutral friction is the vertical
    projection of the [current density due to ion–neutral
    friction](name:current_density_due_to_ion_neutral_friction). It represents
    the electric-current contribution attributable to frictional momentum
    exchange between plasma ions and neutral particles.

    The component is defined by

    $$
    j_Z = \mathbf{j}_{\mathrm{in}} \cdot \hat{\mathbf{z}}
    $$

    where $j_Z$ is this vertical current-density contribution,
    $\mathbf{j}_{\mathrm{in}}$ is the ion–neutral-friction current-density
    vector, and $\hat{\mathbf{z}}$ is the unit vector parallel to the toroidal
    symmetry axis toward increasing height. The direction is defined in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the distance
    from the symmetry axis, $\phi$ is the toroidal angle, and $Z$ is the
    vertical height.

    This is a local contribution in a partially ionized plasma, without spatial
    averaging or integration. It excludes contributions assigned to other
    mechanisms and does not represent the total plasma [current
    density](name:current_density). The [radial current density due to
    ion–neutral
    friction](name:radial_current_density_due_to_ion_neutral_friction) is a
    different projection of the same mechanism-resolved vector, rather than an
    additional mechanism.

    Sign convention: Positive when the ion–neutral-friction contribution carries
    conventional electric current toward increasing vertical height $Z$.
  unit: A.m^-2

- name: vertical_ion_charge_state_momentum_flux_limiter_coefficient
  description: |-
    Dimensionless vertical ion charge-state momentum flux-limiter coefficient
    that scales the free-streaming bound on vertical momentum transport for a
    specified ion charge state.
  documentation: |-
    The vertical ion charge-state momentum coefficient is a dimensionless
    flux-limiter parameter for momentum transport of a specified ion charge
    state in the vertical $Z$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame. It is the vertical component of the vector quantity [ion
    charge-state momentum flux-limiter
    coefficient](name:ion_charge_state_momentum_flux_limiter_coefficient).

    The coefficient $\alpha_{s,Z}$ bounds the vertical momentum-flux density
    through the harmonic-mean combination:

    $$
    \Pi_{s,Z}^{\mathrm{lim}} = \frac{\alpha_{s,Z} \, \Pi_s^{\mathrm{FS}} \, \Pi_{s,Z}^{\mathrm{diff}}}{|\Pi_{s,Z}^{\mathrm{diff}}| + \alpha_{s,Z} \, \Pi_s^{\mathrm{FS}}}
    $$

    where $\Pi_{s,Z}^{\mathrm{lim}}$ is the limited vertical momentum-flux
    density for ion charge state $s$, $\Pi_{s,Z}^{\mathrm{diff}}$ is the
    collisional diffusive estimate of that vertical momentum-flux density, and
    $\Pi_s^{\mathrm{FS}} = m_s n_s v_{\mathrm{th},s}^2$ is the free-streaming
    reference scale with $m_s$ the ion mass, $n_s$ the charge-state number
    density, and $v_{\mathrm{th},s}$ the thermal speed. When
    $|\Pi_{s,Z}^{\mathrm{diff}}| \gg \alpha_{s,Z}\Pi_s^{\mathrm{FS}}$, the
    vertical flux saturates at $\pm\alpha_{s,Z}\Pi_s^{\mathrm{FS}}$; otherwise
    the diffusive value is recovered unchanged.

    The coefficient is specific to the vertical component and is distinct from
    the
    [parallel](name:parallel_ion_charge_state_momentum_flux_limiter_coefficient),
    [poloidal](name:poloidal_ion_charge_state_momentum_flux_limiter_coefficient),
    and
    [toroidal](name:toroidal_ion_charge_state_momentum_flux_limiter_coefficient)
    ion charge-state momentum flux-limiter coefficients. The neutral-particle
    analog is
    [neutral_momentum_flux_limiter_coefficient](name:neutral_momentum_flux_limiter_coefficient).
    The coefficient is intrinsically non-negative.
  unit: '1'

- name: vertical_ion_momentum_convection_velocity
  description: |-
    Effective vertical convection velocity that advects a chosen component of
    ion momentum density for a specified ion species, represented as the
    density-weighted mean over all charge states. The vertical label names the
    velocity direction, not the transported momentum component.
  documentation: |-
    The vertical ion momentum convection velocity is the vertical effective
    velocity that advects a chosen component of ion momentum density for a
    specified ion species. The vertical direction is the $Z$ projection in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height; the vertical label
    names the velocity direction, not the transported momentum component.
    Because this is an intensive species-level quantity, it is the
    density-weighted mean over all charge states of that species.

    The vertical convective flux density of an ion-momentum component is
    represented by:

    $$
    \Gamma^{\mathrm{conv}}_{p_{i,a},Z} = p_{i,a}\,V_{i,\mathrm{mom,conv},Z}
    $$

    where $p_{i,a}=n_i m_i u_{i,a}$ is the ion momentum density associated with
    ion flow component $u_{i,a}$, $n_i$ is the ion density, $m_i$ is the ion
    mass, $a$ labels the momentum component being transported,
    $V_{i,\mathrm{mom,conv},Z}$ is the vertical ion momentum convection
    velocity, and $\Gamma^{\mathrm{conv}}_{p_{i,a},Z}$ is the corresponding
    vertical convective flux density of that momentum component.

    This quantity is the convective coefficient multiplying local ion momentum
    density; it excludes diffusive viscosity, residual stress, and explicit
    momentum sources. It is not generally identical to the bulk [vertical ion
    velocity](name:vertical_ion_velocity), because it characterizes transport of
    momentum density rather than the mean particle flow. The unprojected
    coefficient is [ion momentum convection
    velocity](name:ion_momentum_convection_velocity); other projections specify
    their own directions.

    Sign convention: Positive when the effective convection carries the selected
    ion momentum density toward increasing vertical height $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: m.s^-1

- name: vertical_total_current_density
  description: |-
    Vertical total current density is the net conventional electric-charge flux
    per unit area along the toroidal symmetry axis, summed algebraically over
    all included contributions.
  documentation: |-
    Vertical total current density is the signed projection of the total
    electric-current-density vector along the toroidal symmetry axis. It
    represents net local charge transport in the vertical direction.

    The projection and algebraic aggregation are defined by:

    $$
    j_{\mathrm{tot},Z} = \mathbf{j}_{\mathrm{tot}}\cdot\hat{\mathbf{z}} = \sum_a \mathbf{j}_a\cdot\hat{\mathbf{z}}
    $$

    where $j_{\mathrm{tot},Z}$ is the vertical total current density,
    $\mathbf{j}_{\mathrm{tot}}$ is the total current-density vector,
    $\mathbf{j}_a$ is an included current-density contribution, and $a$ labels
    contributions in the decomposition of the total. The unit vector
    $\hat{\mathbf{z}}$ points along increasing vertical height in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    In the edge plasma, all included contributions are summed algebraically, so
    oppositely directed contributions can cancel. The quantity is not species-
    or mechanism-resolved, and it is neither a vector magnitude, a surface
    average, nor an area-integrated current.

    This quantity specializes [total current
    density](name:total_current_density) by fixing its common signed projection
    basis to the vertical direction. It is a component of [current
    density](name:current_density), distinct from [radial total current
    density](name:radial_total_current_density), which describes charge
    transport along increasing major radius, and [toroidal total current
    density](name:toroidal_total_current_density), which describes transport
    around the symmetry axis.

    Sign convention: Positive when net conventional electric charge flows in the
    direction of increasing vertical height $Z$.
  unit: A.m^-2

- name: volume_averaged_neutral_temperature
  description: |-
    Volume-averaged neutral temperature is the translational kinetic
    temperature, expressed as energy per particle, of a neutral population
    throughout the plasma volume inside the last closed magnetic flux surface
    during plasma initiation.
  documentation: |-
    Volume-averaged neutral temperature is the translational kinetic temperature
    of a neutral population during plasma initiation, representing random
    translational energy after removal of mean flow. It excludes energy stored
    in internal excitation or other internal quantum states.

    The volume average is defined by

    $$
    \overline{T}_{n} = \frac{1}{V_{\mathrm{LCFS}}}\int_{V_{\mathrm{LCFS}}} T_n(\mathbf{x})\,\mathrm{d}V
    $$

    where $\overline{T}_{n}$ is the volume-averaged neutral temperature,
    $T_n(\mathbf{x})$ is the local translational kinetic temperature of the
    neutral population at position $\mathbf{x}$, $V_{\mathrm{LCFS}}$ is the
    plasma volume enclosed by the last closed magnetic flux surface, and
    $\mathrm{d}V$ is the differential physical-volume element.

    The quantity applies to the represented neutral population throughout the
    volume enclosed by the last closed magnetic flux surface during plasma
    initiation. Its aggregation convention is an arithmetic spatial volume
    average of the local temperature, not a local value or a density-weighted
    particle average. It does not select only the cold or energetic neutral
    component and is not restricted to a particular internal quantum state.

    This quantity is obtained by applying the volume-averaging transformation to
    [neutral temperature](name:neutral_temperature), with the local population
    and state aggregation inherited from that quantity. [Cold neutral
    temperature](name:cold_neutral_temperature) and [hot neutral
    temperature](name:hot_neutral_temperature_at_plasma_boundary) are
    population-restricted alternatives, while [neutral internal state
    temperature](name:neutral_internal_state_temperature) resolves a specified
    internal state rather than the generic neutral population.
  unit: eV
