- name: flux_surface_averaged_hydrogen_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged hydrogen ion number density at the plasma boundary,
    summed over all hydrogen ion charge states.
  documentation: 'Flux-surface-averaged hydrogen ion number density at the plasma
    boundary is the charge-state-summed density of hydrogen ions, averaged over the
    last closed magnetic flux surface (separatrix).


    $$

    \langle n_{\mathrm H}\rangle_{\mathrm{FS}} = \frac{\oint_{\mathrm{sep}} n_{\mathrm
    H}\,dl/B_{\mathrm p}}{\oint_{\mathrm{sep}} dl/B_{\mathrm p}}

    $$


    Here $n_{\mathrm H}$ is the local hydrogen ion number density, $dl$ is poloidal
    arc length, and $B_{\mathrm p}$ is the magnitude of the poloidal magnetic field;
    both integrals follow the separatrix. The hydrogen charge-state sum is formed
    before the flux-surface average. This quantity is the averaged counterpart of
    [hydrogen ion number density at the plasma boundary](name:hydrogen_density_at_plasma_boundary),
    which denotes the corresponding local boundary value.'
