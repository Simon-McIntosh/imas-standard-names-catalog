  - name: ion_state_power
    operator: fast
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_fast
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_fast
    status: composed
- name: per_toroidal_mode_fast_ion_state_power
  kind: scalar
  status: draft
  description: Power transferred from a coherent electromagnetic wave to fast ions
    of a specified ion species and charge state, resolved for one toroidal Fourier
    mode. For flux-surface-resolved use it is the volume-integrated absorbed power
    inside the chosen magnetic flux surface; at the outer boundary it is the global
    mode contribution.
  documentation: 'Per-toroidal-mode fast-ion state power is the rate at which a coherent
    electromagnetic wave transfers energy to the fast, suprathermal population of
    a specified ion species and charge state for one toroidal Fourier mode. The toroidal
    mode number is the integer index describing variation with toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. When evaluated on a magnetic
    flux surface, the quantity is cumulative: it is the absorbed power integrated
    over the plasma volume enclosed by that surface; evaluated at the outermost closed
    flux surface or plasma boundary, it is the corresponding global contribution from
    that toroidal mode.


    For a flux surface labeled by a radial flux coordinate $\rho$, the cumulative
    absorbed power for charge state $q$ and toroidal mode $n$ is commonly defined
    from the local wave-particle power density as:


    $$

    P_{\mathrm{fast},q,n}(\rho) = \int_{V(\rho)} p_{\mathrm{fast},q,n}(\mathbf{x})\,dV

    $$


    where $p_{\mathrm{fast},q,n}$ is the local volumetric power density transferred
    from the coherent wave harmonic with toroidal mode number $n$ to fast ions in
    charge state $q$, and $V(\rho)$ is the volume enclosed by the flux surface labeled
    by $\rho$. The outer-boundary value gives the total absorbed power in that ion
    charge state for mode $n$, and summing over toroidal modes gives the total fast-ion
    state absorbed wave power.


    In practice this quantity is obtained from wave absorption and fast-particle modeling,
    often using the resonant wave-particle interaction between the wave frequency,
    the particle parallel motion, and cyclotron harmonics. It may also be constrained
    by integrated RF power balance and by diagnostics sensitive to fast ions, although
    the decomposition by toroidal mode is normally a modeled quantity rather than
    a directly measured observable.


    Typical values span a wide range depending on launched RF power, coupling, species
    concentration, charge state, and resonance location. Weakly absorbed modes may
    contribute less than $10^3$ W, while dominant modes in auxiliary-heated tokamak
    plasmas can deposit $10^5$-$10^7$ W into a particular fast-ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
