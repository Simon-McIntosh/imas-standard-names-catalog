name: argon_prefill_gas_injection
status: draft
cocos_transformation_type: one_like
description: Number of argon atoms injected into the vacuum vessel during the prefill
  phase before plasma breakdown.
documentation: "The argon prefill gas injection records the total particle count of\
  \ argon introduced into the vessel prior to plasma initiation. Prefill gas sets\
  \ the initial neutral pressure and composition, influencing breakdown conditions\
  \ and early impurity content. In devices using argon-seeded discharges, the prefill\
  \ fraction is typically small ($10^{16}$\u2013$10^{19}$ atoms) compared with the\
  \ main working-gas prefill. The dimensionless unit (1) represents a raw particle\
  \ count. Measured or inferred from calibrated piezoelectric valve flow and vessel\
  \ volume. See also `argon_accumulated_gas_injection` for the full-discharge integral\
  \ and `argon_gas_injection_rate` for the instantaneous rate."
