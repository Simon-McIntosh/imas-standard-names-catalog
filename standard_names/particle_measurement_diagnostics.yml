  - id: dd:charge_exchange/channel/momentum_phi
    dd_path: charge_exchange/channel/momentum_phi
    status: composed
  - id: dd:charge_exchange/channel/momentum_tor
    dd_path: charge_exchange/channel/momentum_tor
    status: composed
- name: vertical_coordinate_of_beam_tracing_point
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of a discrete point along the wave-beam ray path
    in a beam-tracing model of electromagnetic wave propagation, giving the height
    above the machine equatorial plane.
  documentation: "The vertical coordinate $Z$ locates a beam-tracing point in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius,\
    \ $\\phi$ is the toroidal angle, and $Z$ is the height above the machine equatorial\
    \ plane. In beam-tracing models used to follow the propagation of radio-frequency\
    \ and microwave waves through a magnetized plasma \u2014 including electron cyclotron,\
    \ lower hybrid, and ion cyclotron scenarios \u2014 the wave-beam trajectory is\
    \ discretized into successive spatially resolved points; this quantity specifies\
    \ the vertical component of each such point's position. Together with the major-radius\
    \ and toroidal angle coordinates of the same beam-tracing point, it fully determines\
    \ the three-dimensional location of the ray within the plasma volume, and it is\
    \ used alongside local wave-vector quantities such as [radial_wave_vector_of_beam_tracing_beam](name:radial_wave_vector_of_beam_tracing_beam)\
    \ to evaluate wave absorption and current-drive profiles. The beam energy deposited\
    \ along the trajectory may also be referenced through [wave_beam_energy](name:wave_beam_energy).\
    \ Typical values fall within the vertical extent of the plasma cross-section,\
    \ ranging from approximately -2 m to +2 m in current mid-size tokamaks and proportionally\
    \ larger in reactor-scale devices.\n\nSign convention: Positive when the beam-tracing\
    \ point lies above the machine equatorial plane in the $+Z$ direction of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:wave_beam_energy
