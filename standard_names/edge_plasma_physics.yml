- name: ion_current_density
  kind: vector
  status: active
  description: Ion current density is the vector density of conventional electric
    charge flux carried by ions, obtained by charge-weighting their directed particle
    motion across unit area.
  documentation: 'Ion current density $\mathbf{J}_i$ is the vector density of conventional
    electric charge flux carried by ions. It represents signed charge transport from
    all included ion species and charge states.


    The kinetic definition is the charge-weighted first velocity moment of the ion
    distribution functions:


    $$

    \mathbf{J}_i(\mathbf{x},t) = \sum_{s\in\mathrm{ions}} q_s \int \mathbf{v}\,f_s(\mathbf{x},\mathbf{v},t)\,d^3v
    = \sum_{s\in\mathrm{ions}} q_s n_s \mathbf{u}_s

    $$


    where $\mathbf{x}$ is position, $t$ is time, $s$ indexes ion species and charge
    states, $q_s$ is the charge of population $s$, $\mathbf{v}$ is particle velocity,
    $f_s$ is its velocity-space distribution function, $n_s$ is its number density,
    and $\mathbf{u}_s$ is its mean velocity.


    This quantity includes ion-carried charge flux and excludes electron-carried and
    displacement-current density. Its qualified instances may select a magnetic-field-aligned
    projection such as [parallel ion current density](name:parallel_ion_current_density),
    a temporal fluctuation measure such as [fluctuating ion current density](name:fluctuating_ion_current_density),
    or an ion-saturation collection condition.


    Sign convention: Positive when an ion-carried charge-flux component is aligned
    with the positive direction of its defining basis vector or oriented surface normal.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_ion_current_density
  - name:fluctuating_ion_current_density
  arguments:
  - name: current_density
    operator: ion
    operator_kind: qualifier
- name: fluctuating_ion_current_density
  kind: vector
  status: active
  description: Fluctuating ion current density is the temporal standard deviation
    of ion-carried vector charge transport per unit area about its mean, with charge
    weighting across included ion species and charge states.
  documentation: 'Fluctuating ion current density is the temporal spread of the ion-carried
    contribution to vector charge transport per unit area, evaluated about its temporal
    mean. It preserves the charge weighting and species and charge-state aggregation
    of the [ion current density](name:ion_current_density), while describing variation
    rather than the mean current.


    The componentwise temporal standard deviation is defined by


    $$

    \sigma_{i,k} = \left\langle \left[J_{i,k}(t) - \left\langle J_{i,k}(t) \right\rangle_t\right]^2
    \right\rangle_t^{1/2}

    $$


    where $J_{i,k}(t)$ is component $k$ of the [ion current density](name:ion_current_density)
    at time $t$, $\langle\cdot\rangle_t$ denotes temporal averaging, and $\sigma_{i,k}$
    is the corresponding fluctuation amplitude.


    The vector is formed from the relevant component or projection standard deviations
    and is not the signed temporal mean current. For example, [parallel fluctuating
    ion current density](name:parallel_fluctuating_ion_current_density) applies the
    same fluctuation definition after projection along the local magnetic-field direction,
    whereas [fluctuating saturated ion current density](name:fluctuating_saturated_ion_current_density)
    is restricted to ion-saturation current.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_current_density
  - name:parallel_fluctuating_ion_current_density
  - name:fluctuating_saturated_ion_current_density
  arguments:
  - name: ion_current_density
    operator: fluctuating
    operator_kind: qualifier
- name: parallel_fluctuating_ion_current_density
  kind: scalar
  status: active
  description: Temporal standard deviation of the total ion charge-current density
    after projection onto the local magnetic-field direction at a plasma-facing probe.
  documentation: 'This quantity is the temporal standard deviation of the total ion-carried
    charge-current density after projection onto the local magnetic-field direction
    at the specified plasma-facing probe. Ion contributions from all included species
    and charge states are summed with their signed charge weighting before the fluctuation
    statistic is evaluated. It is the parallel specialization of [fluctuating ion
    current density](name:fluctuating_ion_current_density).


    With $t$ denoting time in seconds, the defining relation is:


    $$

    \sigma_{j_i,\parallel}=\left\langle\left[j_{i,\parallel}(t)-\left\langle j_{i,\parallel}\right\rangle_t\right]^2\right\rangle_t^{1/2},\qquad
    j_{i,\parallel}(t)=\mathbf{j}_i(t)\cdot\hat{\mathbf b}(t),\qquad \hat{\mathbf
    b}(t)=\frac{\mathbf{B}(t)}{|\mathbf{B}(t)|}

    $$


    Here $\mathbf{j}_i$ is the aggregated ion current-density vector in A m$^{-2}$,
    $\hat{\mathbf b}$ is the unit vector along the local magnetic field, $\mathbf{B}$
    is the local magnetic field in tesla, and $\langle\cdot\rangle_t$ denotes the
    temporal average.


    The aggregation and projection precede the standard-deviation operation; this
    is not a sum of separately calculated species fluctuations. Unlike [fluctuating
    saturated ion current density](name:fluctuating_saturated_ion_current_density),
    it represents the total ion current rather than only the ion-saturation current
    component. The result is nonnegative even when the underlying parallel current
    changes sign.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:fluctuating_ion_current_density
  - name:fluctuating_saturated_ion_current_density
  arguments:
  - name: fluctuating_ion_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: langmuir_probes/embedded/j_i_parallel_sigma
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-j_i_parallel_sigma
    dd_documentation:
      leaf: Standard deviation of ion parallel current density at the probe position
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: STRUCTURE
      unit: A.m^-2
    enhanced_context:
      description: "Standard deviation of the ion parallel current density (j_i\u2225\
        ) at an embedded Langmuir probe position. Characterizes statistical fluctuations\
        \ or measurement uncertainty in the parallel ion current at plasma-facing\
        \ component surfaces."
      kind: llm
- name: parallel_ion_current_density
  kind: scalar
  status: active
  description: Parallel ion current density is the projection of charge-weighted ion
    electric-current density onto the local magnetic-field direction.
  documentation: 'Parallel ion current density is the magnetic-field-aligned component
    of the ion contribution to charge transport per unit area. It retains the species
    and charge-state aggregation of the [ion current density](name:ion_current_density)
    while selecting only the component along the local magnetic field.


    $$

    J_{i\parallel} = \mathbf{J}_i \cdot \mathbf{b}, \qquad \mathbf{b} = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $J_{i\parallel}$ is the parallel ion current density, $\mathbf{J}_i$ is
    [ion current density](name:ion_current_density), $\mathbf{b}$ is the unit vector
    along the local magnetic field, and $\mathbf{B}$ is the magnetic-field vector.


    This quantity is distinct from [parallel ion particle flux](name:parallel_ion_particle_flux),
    which counts ion transport without electric-charge weighting. It represents the
    aggregate ion contribution rather than only a mechanism-specific component such
    as [parallel current density due to ion inertia](name:parallel_current_density_due_to_ion_inertia).


    Sign convention: Positive when the ion current-density vector has a component
    in the direction of the local magnetic field.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_current_density
  - name:parallel_ion_particle_flux
  - name:parallel_current_density_due_to_ion_inertia
  arguments:
  - name: ion_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - dd_path: langmuir_probes/embedded/j_i_parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-j_i_parallel
    dd_documentation:
      leaf: Ion parallel current density at the probe position
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: STRUCTURE
      unit: A.m^-2
    enhanced_context:
      description: "Ion parallel current density (j_i\u2225) at an embedded Langmuir\
        \ probe position, measuring the component of ion current flowing along the\
        \ magnetic field direction at the probe surface in the divertor or plasma-facing\
        \ component."
      kind: llm
  - dd_path: langmuir_probes/reciprocating/plunge/collector/j_i_parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-plunge-collector-j_i_parallel
