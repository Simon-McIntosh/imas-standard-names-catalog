- name: per_toroidal_mode_thermal_ion_power_density
  kind: scalar
  status: draft
  description: Absorbed coherent-wave power density deposited in bulk thermal ions,
    resolved by toroidal mode number. It may be local or magnetic-surface averaged
    under the stated spatial convention; summing modes gives the total thermal-ion
    absorbed power density.
  documentation: 'Per-toroidal-mode thermal-ion power density is the volumetric rate
    at which one toroidal Fourier component of a coherent wave deposits energy in
    the bulk thermal ion population. The mode number $n_\phi$ labels variation with
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where
    $R$ is major radius, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from $+\hat{Z}$, and $Z$ is vertical height. The quantity can represent
    either a pointwise deposition density or a flux-surface-averaged density over
    a thin magnetic-surface shell.


    The density is defined as the differential absorbed modal power per unit plasma
    volume:


    $$

    p_{\mathrm{th},i,n_\phi}(\mathbf{x}) = \frac{dP_{\mathrm{th},i,n_\phi}}{dV}(\mathbf{x})

    $$


    where $P_{\mathrm{th},i,n_\phi}$ is the coherent-wave power absorbed by bulk thermal
    ions from toroidal mode $n_\phi$, $dV$ is a plasma volume element, and $\mathbf{x}$
    denotes either a spatial position or the magnetic-surface label after averaging.
    Thus $p_{\mathrm{th},i,n_\phi}$ has units W m$^{-3}$; integrating it over a chosen
    plasma volume gives [per_toroidal_mode_thermal_ion_power](name:per_toroidal_mode_thermal_ion_power),
    while summing over toroidal modes gives [thermal_ion_power_density](name:thermal_ion_power_density).


    In practice this quantity is computed from the mode-resolved wave field and the
    thermal-ion part of the wave-particle energy balance or dielectric response. For
    a local convention, the value applies at the specified point; for a flux-surface-averaged
    convention, it is the shell-volume average whose product with shell volume gives
    the shell contribution to the absorbed power. The corresponding electron quantities
    are [per_toroidal_mode_thermal_electron_power_density](name:per_toroidal_mode_thermal_electron_power_density)
    and, after volume integration, [per_toroidal_mode_thermal_electron_power](name:per_toroidal_mode_thermal_electron_power);
    ion-state resolution is represented by [per_toroidal_mode_thermal_ion_state_power_density](name:per_toroidal_mode_thermal_ion_state_power_density).


    Typical magnitudes range from $10^3$-$10^6$ W m$^{-3}$ in heated plasma cores,
    with localized resonance or damping regions reaching about $10^7$ W m$^{-3}$ in
    high-power scenarios and values near zero where the selected toroidal mode is
    weakly absorbed.


    Sign convention: Positive when net coherent-wave energy is transferred to the
    bulk thermal ion population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_density
  - name:per_toroidal_mode_thermal_electron_power_density
  - name:per_toroidal_mode_thermal_ion_state_power_density
  - name:per_toroidal_mode_thermal_ion_power
  sources:
