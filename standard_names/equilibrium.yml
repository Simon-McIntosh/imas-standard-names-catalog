- name: toroidal_plasma_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the plasma electric current density, projected
    along the geometric toroidal direction.
  documentation: "The toroidal plasma current density $j_\\phi = \\mathbf{j} \\cdot\
    \ \\hat{\\phi}$ is the projection of the total plasma current density vector onto\
    \ the geometric toroidal direction $\\hat{\\phi}$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. This quantity drives the poloidal magnetic field via\
    \ Amp\xE8re's law $\\nabla \\times \\mathbf{B}_\\text{pol} = \\mu_0 j_\\phi \\\
    hat{\\phi}$, making it the fundamental source term for the tokamak poloidal field\
    \ configuration. The flux-surface averaged quantity $\\langle j_\\phi \\rangle$\
    \ defines the net plasma current $I_p = \\int j_\\phi \\, dS$ and is used in equilibrium\
    \ reconstruction to constrain the safety factor profile. Typical values in the\
    \ plasma core range from 0.1\u20131.0 MA/m\xB2 for medium-size tokamaks like DIII-D,\
    \ falling off toward the edge.\n\nSign convention: Positive when $j_\\phi$ flows\
    \ in the direction of increasing toroidal angle $\\phi$ (counter-clockwise when\
    \ viewed from above).\n\nThe distinguishing toroidal projection is related to\
    \ the full current density vector through [plasma_current_density](name:plasma_current_density)\
    \ and to the parallel current density through the $\\mathbf{B} \\cdot \\hat{\\\
    phi}$ alignment factor. See also [toroidal_current_density](name:toroidal_current_density)\
    \ for the total (including non-plasma) toroidal current density, and [toroidal_electric_field](name:toroidal_electric_field)\
    \ for the associated inductive drive in the same direction."
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:plasma_current_density
  - name:toroidal_current_density
  - name:toroidal_electric_field
  arguments:
  - name: plasma_current_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:equilibrium/time_slice/ggd/j_phi/values
    dd_path: equilibrium/time_slice/ggd/j_phi/values
    status: composed
- name: total_plasma_volume
  kind: scalar
  status: draft
  description: Total volume enclosed by the outermost closed magnetic flux surface
    (plasma boundary), representing the spatial extent of the confined plasma.
  documentation: 'The total plasma volume $V$ is the volume of the region bounded
    by the last closed flux surface (LCFS) or separatrix. It is a fundamental geometric
    parameter in tokamak and stellarator physics, appearing in volume-averaged quantities
    such as $

    _e\rangle = \frac{1}{V}\int n_e \, dV$ and in confinement scaling laws (e.g.,
    ITER IPB98(y)). The volume is computed from the equilibrium reconstruction by
    integrating the flux-surface geometry over the poloidal cross-section and the
    toroidal angle. Typical values range from $\sim 1\,\text{m}^3$ in small devices
    to $\sim 800\,\text{m}^3$ in ITER. The total plasma volume is a key input for
    global particle and power balances, and is used together with [plasma_volume](name:plasma_volume)
    and [volume_of_first_wall](name:volume_of_first_wall) for confinement assessments.


    Sign convention: Positive for the physically confined plasma region.


    Related quantities include [volume_at_pedestal](name:volume_at_pedestal) for the
    pedestal region and [major_radius_of_plasma_boundary](name:major_radius_of_plasma_boundary)
    for the boundary geometry.'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:plasma_volume
  - name:volume_of_first_wall
  - name:volume_at_pedestal
  - name:major_radius_of_plasma_boundary
  sources:
  - id: dd:summary/global_quantities/volume/value
    dd_path: summary/global_quantities/volume/value
    status: composed
- name: triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: Upper triangularity shape parameter of the plasma boundary at the last-closed
    flux surface, quantifying the vertical asymmetry of the poloidal cross-section.
  documentation: 'The upper triangularity $\delta_u$ characterizes the D-shape of
    the upper half of the plasma boundary, defined as $\delta_u = (R_{\mathrm{geo}}
    - R_u) / a$, where $R_{\mathrm{geo}}$ is the geometric-center major radius, $R_u$
    is the major-radius coordinate of the boundary at its uppermost vertical point,
    and $a$ is the minor radius. This shaping parameter strongly influences the H-mode
    power threshold, pedestal stability, and scrape-off-layer divertor geometry. Typical
    values range from $\delta_u = 0.2$ (moderate shaping) to $\delta_u = 0.5$ (strongly
    shaped, e.g., ITER-like configurations), and are routinely obtained from equilibrium
    reconstruction using external magnetics and polarimetry. See also the related
    global parameter [plasma boundary elongation](name:elongation_of_plasma_boundary)
    and the lower-half counterpart [lower triangularity of plasma boundary](name:lower_triangularity_of_plasma_boundary).


    Sign convention: Positive when the boundary flares inward at the top of the plasma
    relative to the geometric axis.


    For a flux-surface-resolved profile of the same quantity, see [upper triangularity
    of separatrix](name:triangularity_of_separatrix).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  - name:triangularity_of_separatrix
  sources:
  - id: dd:equilibrium/time_slice/boundary/triangularity
    dd_path: equilibrium/time_slice/boundary/triangularity
    status: composed
  - id: dd:summary/boundary/triangularity_upper/value
    dd_path: summary/boundary/triangularity_upper/value
    status: composed
- name: upper_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Elongation of the upper half of the plasma boundary, defined as the
    ratio of the upper vertical half-height to the horizontal minor radius.
  documentation: 'The upper elongation $\kappa_{\mathrm{upper}} = Z_{\mathrm{upper}}
    / a$ quantifies the vertical stretch of the poloidal cross-section above the geometric
    axis, where $Z_{\mathrm{upper}}$ is the vertical half-height of the boundary above
    the axis and $a$ is the horizontal minor radius at the midplane. It is the upper-half
    counterpart of [lower_elongation_of_plasma_boundary](name:lower_elongation_of_plasma_boundary);
    together with [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)
    they describe the full vertical asymmetry of the last-closed flux surface. Typical
    values in conventional tokamaks range from 1.2 to 2.0, with the upper elongation
    often exceeding the lower one in diverted plasmas due to the X-point geometry.
    This shaping parameter is extracted from equilibrium reconstruction (EFIT, LIUQE)
    using poloidal flux contours or visible/infrared camera images of the plasma boundary.


    Sign convention: Positive when the upper vertical half-height extends above the
    geometric axis.


    The product of upper and lower elongation determines the total elongation via
    $

    \kappa = (\kappa_{\mathrm{upper}} + \kappa_{\mathrm{lower}})/2$ for boundaries
    symmetric about the midplane. See also [upper_triangularity_of_plasma_boundary](name:upper_triangularity_of_plasma_boundary)
    for the complementary D-shape parameter describing the upper poloidal asymmetry.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_elongation_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  - name:upper_triangularity_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_upper
    dd_path: equilibrium/time_slice/boundary/elongation_upper
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation_upper
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation_upper
    status: attached
- name: vertical_coordinate_of_last_closed_flux_surface
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the last closed flux surface in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z_{\mathrm{lcfs}}$ marks the highest (or
    lowest) point of the last closed flux surface (LCFS) in the $\hat{Z}$ direction,
    defining the vertical extent of the confined plasma. This quantity is obtained
    from equilibrium reconstruction (e.g., EFIT, LIUQE) and locates the plasma boundary
    relative to the machine midplane. Typical values for medium-size tokamaks (DIII-D,
    ASDEX Upgrade) range from $-1.0$ to $+1.0$ m, while ITER''s LCFS extends to approximately
    $\pm 3.0$ m. See also [major_radius_of_last_closed_flux_surface](name:major_radius_of_last_closed_flux_surface)
    for the radial coordinate and [vertical_coordinate_of_magnetic_axis](name:vertical_coordinate_of_magnetic_axis)
    for the innermost nested flux surface. The last closed flux surface is synonymous
    with the separatrix in diverted configurations; compare with [vertical_coordinate_of_separatrix](name:vertical_coordinate_of_separatrix).


    Sign convention: Positive when the point lies above the machine midplane ($Z =
    0$) in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_last_closed_flux_surface
  - name:vertical_coordinate_of_magnetic_axis
  - name:vertical_coordinate_of_separatrix
  sources:
  - id: dd:equilibrium/time_slice/boundary/lcfs/z
    dd_path: equilibrium/time_slice/boundary/lcfs/z
    status: composed
- name: vertical_coordinate_of_limiter
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the point where the plasma boundary contacts
    the active limiter surface.
  documentation: 'The vertical coordinate $Z_{\rm lim}$ of the active limiter contact
    point defines the height (in the IMAS cylindrical $(R, \phi, Z)$ frame) where
    the plasma boundary first touches the limiter, establishing the outermost extent
    of the confined plasma. This point determines the plasma-limiter gap and is used
    in equilibrium reconstruction to constrain the boundary position; typical values
    range $-1$ to $+1\,\text{m}$ for medium-size tokamaks. The active limiter contact
    point complements the separatrix-defined boundary in limited plasmas and is paired
    with the corresponding $R$ coordinate [major_radius_at_limiter](name:major_radius_at_limiter)
    and the [vertical_coordinate_of_separatrix](name:vertical_coordinate_of_separatrix)
    for diverted configurations.


    Sign convention: Positive when the limiter contact point lies above the machine
    midplane $(Z=0)$ in the vertical direction.


    Typical values span $-1$ to $+1\,\text{m}$, varying with plasma elongation and
    vertical position control. The value is obtained from equilibrium codes using
    magnetic measurements and the known limiter geometry.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_at_limiter
  - name:vertical_coordinate_of_separatrix
