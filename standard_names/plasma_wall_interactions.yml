- name: neon_density_at_limiter
  kind: scalar
  status: active
  description: Neon ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all neon ionization stages.
  documentation: "Neon density at a limiter is the local number density of neon ions\
    \ in the boundary plasma immediately adjacent to a plasma-facing limiter surface.\
    \ The evaluation point is the plasma side of the magnetic presheath or sheath\
    \ entrance at the limiter contact, not the magnetic separatrix, consistent with\
    \ the parent [density_at_limiter](name:density_at_limiter).\n\nUnless a charge-state-resolved\
    \ quantity specifies a particular ionization stage, this density is summed over\
    \ all positive neon charge states ($\\mathrm{Ne}^{1+}$ through $\\mathrm{Ne}^{10+}$):\n\
    \n$$\nn_{\\mathrm{Ne}} = \\sum_{z=1}^{10} n_{\\mathrm{Ne}^{z+}}\n$$\n\nwhere $n_{\\\
    mathrm{Ne}^{z+}}$ is the partial number density of neon ions in charge state $z$.\n\
    \nNeon is introduced as a controlled radiative impurity for power exhaust and\
    \ divertor detachment. At the limiter, the local neon density governs recycling\
    \ fluxes, charge-exchange with neutral neon, and impurity-driven edge plasma cooling\
    \ near the wall. Edge Langmuir probes and vacuum ultraviolet or extreme ultraviolet\
    \ spectroscopy provide experimental access to this quantity.\n\nThe neon density\
    \ in the scrape-off layer at neon-seeded discharges spans roughly $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$, falling toward the lower end at low seeding rates and rising\
    \ with neon puff level. The corresponding quantity evaluated at the separatrix\
    \ is [neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary);\
    \ [xenon_density_at_limiter](name:xenon_density_at_limiter) is the analogous quantity\
    \ for xenon impurity injection."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  - name:xenon_density_at_limiter
