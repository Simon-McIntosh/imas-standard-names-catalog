- name: perpendicular_wave_vector
  kind: scalar
  status: active
  description: Perpendicular wave-vector component describing spatial phase variation
    transverse to the local equilibrium magnetic field and the cross-field scale of
    wave-plasma coupling.
  documentation: "The perpendicular wave vector is the part of the local wave vector\
    \ associated with phase variation transverse to the local equilibrium magnetic\
    \ field. Its magnitude sets the cross-field spatial scale relevant to wave\u2013\
    plasma coupling and density-fluctuation backscattering.\n\nFor wave vector $\\\
    mathbf{k}$ and unit vector $\\hat{\\mathbf{b}}$ parallel to the local equilibrium\
    \ magnetic field, the perpendicular wave-vector magnitude is defined by:\n\n$$\n\
    k_\\perp = \\left|\\mathbf{k} - (\\mathbf{k}\\cdot\\hat{\\mathbf{b}})\\hat{\\\
    mathbf{b}}\\right|\n$$\n\nwhere $k_\\perp$ is the perpendicular wavenumber, $\\\
    mathbf{k}$ is the wave vector, and $\\hat{\\mathbf{b}}$ is dimensionless. This\
    \ quantity excludes the component parallel to the equilibrium magnetic field.\
    \ It specializes the spatial phase-gradient information carried by the [wave vector](name:wave_vector);\
    \ the [perpendicular wave-vector magnitude](name:perpendicular_wave_vector_magnitude)\
    \ is its explicit magnitude form. It differs from the [vertical wave vector](name:vertical_wave_vector),\
    \ which is resolved along the geometric vertical direction rather than relative\
    \ to the magnetic field."
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_vector
  - name:perpendicular_wave_vector_magnitude
  arguments:
  - name: wave_vector
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
- name: perpendicular_wave_vector_magnitude
  kind: scalar
  status: active
  description: Non-negative magnitude of the wave vector transverse to the local equilibrium
    magnetic field, setting the inverse cross-field phase scale.
  documentation: 'The perpendicular wave-vector magnitude is the non-negative length
    of the part of a local electromagnetic wave vector transverse to the equilibrium
    magnetic field. It characterizes cross-field phase variation and is the scalar
    magnitude associated with the [perpendicular wave vector](name:perpendicular_wave_vector).


    For wave vector $\mathbf{k}$ and magnetic-field unit vector $\hat{\mathbf{b}}$,
    the perpendicular magnitude is defined by


    $$

    k_\perp = \left|\mathbf{k} - (\mathbf{k}\cdot\hat{\mathbf{b}})\hat{\mathbf{b}}\right|

    $$


    where $k_\perp$ and $\mathbf{k}$ have units of inverse length, and $\hat{\mathbf{b}}$
    is tangent to the local equilibrium magnetic-field direction. The quantity excludes
    the wave-vector component parallel to the magnetic field and is non-negative by
    definition.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_wave_vector
  arguments:
  - name: perpendicular_wave_vector
    operator: magnitude
    operator_kind: unary_postfix
  sources:
  - dd_path: reflectometer_fluctuation/channel/doppler/wavenumber
