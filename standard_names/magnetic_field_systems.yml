      parent_path: coils_non_axisymmetric/coil/conductor/cross_section/outline
      parent: Polygonal outline of the cross section in the (normal, binormal) coordinate
        system. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    enhanced_context:
