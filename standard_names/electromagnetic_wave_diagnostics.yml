    dd_path: reflectometer_fluctuation/channel/doppler/velocity_pol
    status: composed
- name: radial_wave_vector
  kind: scalar
  status: draft
  description: Radial component of the wave vector, representing the projection of
    the local wavenumber onto the major radius direction in the IMAS cylindrical $(R,
    \phi, Z)$ frame.
  documentation: 'The radial wave vector component $k_R$ is the projection of the
    local wave vector $\mathbf{k}$ onto the $\hat{R}$ direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It describes the spatial oscillation rate of
    the wave electric field along the major radius direction.


    For a wave propagating at an angle $\alpha$ to the radial direction in the poloidal
    plane, $k_R = k \cos \alpha$, where $k = |\mathbf{k}|$ is the local wavenumber.
    In terms of the perpendicular refractive index $N_\perp$ and the angular frequency
    $\omega$, the magnitude satisfies $|k_R| = (\omega/c) N_\perp |\cos \alpha|$,
    with $c$ the speed of light. The sign of $k_R$ indicates the direction of radial
    propagation: $k_R > 0$ for outward propagation (increasing $R$), and $k_R < 0$
    for inward propagation (decreasing $R$).


    Typical magnitudes in fusion-grade tokamaks range from $10^2$ to $10^4$ m$^{-1}$,
    depending on the electron cyclotron harmonic and local plasma parameters. Measurement
    of $k_R$ is central to beam-tracing analysis in electron cyclotron emission (ECE)
    diagnostics, where it characterizes the evolution of the probing wave spectrum
    along the ray path.


    Sign convention: Positive when the wave propagates in the direction of increasing
    major radius $R$ in the $(R, \phi, Z)$ frame.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_wave_vector
  - name:vertical_wave_vector
  - name:wave_vector
  arguments:
  - name: wave_vector
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:ece/channel/beam_tracing/beam/wave_vector/k_r
    dd_path: ece/channel/beam_tracing/beam/wave_vector/k_r
    status: composed
