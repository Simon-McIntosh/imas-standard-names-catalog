- name: fast_ion_power
  kind: scalar
  status: draft
  description: Total coherent-wave power absorbed by the suprathermal (fast) ion population,
    integrated over the plasma volume.
  documentation: 'Fast ion power is the volume-integrated rate of energy transfer
    from a coherent electromagnetic wave to the suprathermal (non-thermal) ion population.
    It isolates the non-Maxwellian fast-ion channel of wave absorption, complementing
    [thermal_ion_power](name:thermal_ion_power) and contributing to the species-summed
    [ion_power](name:ion_power). The dominant physical context is ion cyclotron resonance
    heating (ICRH), where minority ions driven to suprathermal energies absorb wave
    power through quasi-linear wave-particle interaction at the fundamental or harmonic
    cyclotron resonance.


    The power is given by the volume integral of the wave energy source:


    $$

    P_\mathrm{fast,ion} = \int \mathbf{E} \cdot \mathbf{J}_\mathrm{fast,ion} \, dV

    $$


    where $\mathbf{E}$ is the RF wave electric field, $\mathbf{J}_\mathrm{fast,ion}$
    is the current density carried by the suprathermal ion population, and $V$ is
    the plasma volume.


    This quantity is evaluated by full-wave or ray-tracing RF modeling codes that
    resolve the fast-ion contribution to the hot-plasma dielectric tensor. The charge-state-resolved
    counterpart is [fast_ion_state_power](name:fast_ion_state_power), and the spectral
    decomposition by toroidal mode number is provided by [per_toroidal_mode_fast_ion_power](name:per_toroidal_mode_fast_ion_power).
    When summed with [thermal_ion_power](name:thermal_ion_power), [thermal_electron_power](name:thermal_electron_power),
    and [fast_electron_power](name:fast_electron_power), the result recovers the total
    absorbed_power.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power
  - name:ion_power
  - name:fast_ion_state_power
  - name:per_toroidal_mode_fast_ion_power
  - name:thermal_electron_power
  - name:fast_electron_power
  arguments:
