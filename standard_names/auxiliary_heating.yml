    dd_path: lh_antennas/antenna/row/power_density_spectrum_2d
    status: composed
- name: lower_hybrid_wave_power_per_toroidal_refractive_index
  kind: scalar
  status: draft
  description: Marginal power spectral density dP/dn_tor of lower hybrid waves launched
    by an antenna row, giving the power per unit interval of toroidal refractive index
    n_tor = k_tor c / omega.
  documentation: "The toroidal refractive index $n_{\\mathrm{tor}} = k_\\phi c / \\\
    omega$, where $k_\\phi$ is the toroidal wavenumber, $c$ is the speed of light,\
    \ and $\\omega$ is the wave angular frequency, characterizes the parallel wave\
    \ momentum imparted to plasma electrons during lower hybrid current drive. This\
    \ quantity is the 1-D marginal power spectral density $dP/dn_{\\mathrm{tor}}$\
    \ obtained by integrating the full 2-D spectrum [d\xB2P/(dn_tor dn_pol)](name:lower_hybrid_wave_power_per_toroidal_and_poloidal_refractive_index)\
    \ over poloidal refractive index. Integrating $dP/dn_{\\mathrm{tor}}$ over the\
    \ launched $n_{\\mathrm{tor}}$ spectrum recovers the total launched power. The\
    \ spectrum peaks near the accessibility limit $n_{\\mathrm{tor,acc}} \\approx\
    \ (1 - \\omega_{pe}^2/\\omega^2)^{-1/2}$; for typical reactor-grade lower hybrid\
    \ current drive scenarios the spectral peak lies in the range $n_{\\mathrm{tor}}\
    \ \\approx 1.5$\u2013$3$. The spectral shape is determined by the phasing between\
    \ antenna rows and by the waveguide mouth dimensions; the discrete launched $n_{\\\
    mathrm{tor}}$ values are enumerated in [toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row](name:toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row)."
  unit: W
  physics_domain: auxiliary_heating
  links:
