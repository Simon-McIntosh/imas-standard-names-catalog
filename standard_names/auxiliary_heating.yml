- name: per_toroidal_mode_fast_electron_power_density
  kind: scalar
  status: active
  description: RF-wave power deposited per unit volume in suprathermal electrons for
    each toroidal Fourier mode, with the modal sum recovering total fast-electron
    power density.
  documentation: 'This quantity is the local RF-wave energy deposition rate assigned
    to the suprathermal electron population for an individual toroidal Fourier mode.
    It is a modal decomposition of [fast electron power density](name:fast_electron_power_density),
    excluding thermal-electron absorption and volume-integrated fast-electron power.


    The modal contributions are defined by their closure to the total local deposition
    rate:


    $$

    P_{e,\mathrm{fast}}(\mathbf{x}) = \sum_{n_\phi} P_{e,\mathrm{fast}}(\mathbf{x},
    n_\phi)

    $$


    where $P_{e,\mathrm{fast}}(\mathbf{x})$ is the total fast-electron power density
    at position $\mathbf{x}$, $P_{e,\mathrm{fast}}(\mathbf{x}, n_\phi)$ is its contribution
    from toroidal mode number $n_\phi$, and the sum spans all represented toroidal
    modes. The quantity is a local deposition rate, not the volume-integrated [fast
    electron absorbed wave power](name:fast_electron_absorbed_wave_power).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_density
