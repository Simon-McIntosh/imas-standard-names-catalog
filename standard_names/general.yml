    dd_documentation:
      leaf: 'Normalised toroidal flux coordinate. The normalizing value for rho_tor_norm,
        is the toroidal flux coordinate at the equilibrium boundary (LCFS or 99.x
        % of the LCFS in case of a fixed boundary equilibium calculation, see time_slice/boundary/b_flux_pol_norm
        in the equilibrium IDS) '
      parent_path: summary/local/pedestal/position
