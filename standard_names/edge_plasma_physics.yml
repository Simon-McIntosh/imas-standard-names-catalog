    \ increasing toroidal angle in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The carbon impurity-ion fluid velocity at the H-mode pedestal top
    is the density-weighted bulk-flow velocity of all contributing carbon ion charge
    states, evaluated at the core-side shoulder of the H-mode edge transport barrier.
    It is the toroidal component rather than the total three-dimensional speed, expressed
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    $$

    v_{\phi,C}=\frac{\sum_q n_{C^{q+}}v_{\phi,C^{q+}}}{\sum_q n_{C^{q+}}}

    $$


    Here, $q$ indexes the contributing carbon ion charge states, $n_{C^{q+}}$ is the
    corresponding number density in m$^{-3}$, and $v_{\phi,C^{q+}}$ is its toroidal
    velocity in m s$^{-1}$. Neutral carbon is excluded because this quantity is defined
    for impurity ions. The pedestal-top value is distinct from the [toroidal carbon
    velocity at the plasma boundary](name:toroidal_carbon_velocity_at_plasma_boundary).


    Sign convention: Positive when the carbon-ion flow has a component in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
