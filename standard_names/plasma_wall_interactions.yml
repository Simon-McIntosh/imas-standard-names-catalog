- name: lower_uncertainty_of_radial_component_of_magnetic_field
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the radial component $B_R$
    of the magnetic field near the wall.
  documentation: "This quantity (in T) gives the lower error bar on the radial component\
    \ $B_R = \\mathbf{B} \\cdot \\hat{R}$ of the magnetic field, defined on a generalized\
    \ grid description (GGD) of the wall region. The uncertainty is asymmetric: the\
    \ actual value of $B_R$ lies in the interval $[B_R - \\delta B_R^{\\text{lower}},\\\
    , B_R + \\delta B_R^{\\text{upper}}]$, and this standard name provides $\\delta\
    \ B_R^{\\text{lower}} \\geq 0$. Sources of uncertainty include measurement noise\
    \ in magnetic probes, interpolation error in equilibrium reconstruction, and non-axisymmetric\
    \ field components not captured by the axisymmetric model. Values are small compared\
    \ with the field itself\u2014on the order of $10^{-4}$\u2013$10^{-2}$ T for typical\
    \ fusion-grade diagnostics. See also [enclosed_volume_of_first_wall](name:enclosed_volume_of_first_wall)\
    \ for the geometric context and [electric_potential_on_wall_ggd](name:electric_potential_on_wall_ggd)\
    \ for another GGD-based wall quantity."
  unit: T
  tags:
  - reconstructed
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: surface_temperature
  kind: scalar
  status: draft
  description: Temperature of the plasma-facing surface as observed by infrared thermography
    or thermocouples.
  documentation: The surface temperature $T_s$ (in K) is the thermodynamic temperature
    of the outermost layer of a plasma-facing component (PFC). It is the primary observable
    of infrared (IR) camera diagnostics, which convert measured spectral radiance
    to temperature via Planck's law and material emissivity. Values range from ~300
    K (room temperature, between shots) to >2000 K on actively loaded divertor tiles
    during high-power H-mode operation. Sustained temperatures above ~1500 K on tungsten
    PFCs can trigger recrystallization and loss of mechanical integrity. The surface
    temperature drives the surface heat flux calculation via $q = -\kappa \nabla T|_{\text{surface}}$,
    where $\kappa$ is the thermal conductivity of the PFC material. It also determines
    chemical erosion yields and tritium retention rates. See also [wall_temperature](name:wall_temperature)
    for the bulk wall temperature and [first_wall_surface_area](name:first_wall_surface_area)
    for the geometric area over which this temperature is mapped.
  unit: K
  tags:
  - local-measurement
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_current_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Net toroidal electrical current flowing in the vacuum vessel structure,
    arising from inductively driven eddy currents during transient magnetic-field
    changes.
  documentation: "The toroidal vessel current $I_{\\phi,\\rm vessel}$ (in A) is the\
    \ integral of the toroidal current density $j_\\phi$ over the vessel cross-sectional\
    \ area. It is induced by time-varying poloidal magnetic flux during plasma ramp-up,\
    \ ramp-down, disruptions, and vertical displacement events. Typical peak values\
    \ during fast disruptions reach $10^5$\u2013$10^6$ A in large devices (JET, ITER),\
    \ decaying on an $L/R$ time constant of 5\u201350 ms set by vessel resistivity\
    \ and geometry. This current couples electromagnetically to the plasma equilibrium\
    \ and must be accounted for in real-time shape control and disruption force estimation.\
    \ Measured via Rogowski coils on the vessel or inferred from equilibrium reconstruction\
    \ including vessel elements. Positive when the current flows in the $+\\phi$ direction\
    \ (COCOS-11 convention). See also [first_wall_surface_area](name:first_wall_surface_area)\
    \ and [toroidal_component_of_electromagnetic_force_density](name:toroidal_component_of_electromagnetic_force_density)."
  unit: A
  tags:
  - equilibrium-reconstruction
  - global-quantity
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: wall_biasing_electric_potential
  kind: scalar
  status: draft
  description: Electric potential applied to a wall element for active biasing of
    the plasma-wall sheath.
  documentation: "The biasing potential $V_{\\text{bias}}$ (in V) is the externally\
    \ imposed electric potential on a wall or divertor tile element, used to modify\
    \ the local plasma sheath and control particle and energy fluxes to the surface.\
    \ Active wall biasing experiments apply potentials in the range of $\\pm$50\u2013\
    500 V relative to the vessel ground to influence edge transport, ELM mitigation,\
    \ or SOL flow patterns. The resulting sheath potential drop governs the kinetic\
    \ energy of ions striking the surface and therefore affects sputtering rates and\
    \ impurity production. One scalar value is specified per element in the generalized\
    \ grid description. See also [electric_potential_on_wall_ggd](name:electric_potential_on_wall_ggd)."
  unit: V
  tags:
  - local-measurement
  - real-time-control
  links: []
  validity_domain: ''
  constraints: []
- name: wall_power_density
  kind: scalar
  status: draft
  description: Power per unit area deposited onto the wall surface, provided per element
    of a GGD grid subset.
  documentation: "The wall power density $q_{\\rm wall}$ (W/m$^2$) quantifies the\
    \ local thermal load on plasma-facing components from all incident channels \u2014\
    \ conducted and convected plasma heat flux, radiation, and charge-exchange neutrals.\
    \ In tokamak divertors, peak steady-state power densities reach 5\u201320 MW/m$^2$\
    \ during H-mode operation, while transient loads during edge-localized modes (ELMs)\
    \ can exceed 1 GW/m$^2$ on sub-millisecond timescales. This quantity is central\
    \ to first-wall lifetime predictions and is inferred from infrared thermography,\
    \ calorimetry, or integrated plasma-edge transport codes such as SOLPS-ITER. On\
    \ the GGD mesh, one scalar value is assigned per grid element. See also [first_wall_surface_area](name:first_wall_surface_area)\
    \ and [electron_power_incident_on_inner_divertor_target](name:electron_power_incident_on_inner_divertor_target)."
  unit: W.m^-2
  tags:
  - energy-balance
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: wall_temperature
  kind: scalar
  status: draft
  description: Bulk or surface temperature of the plasma-facing wall, governing thermal
    loads, outgassing rates, and material erosion.
  documentation: "The wall temperature $T_{\\rm wall}$ (in K) characterizes the thermal\
    \ state of the first-wall and limiter structures exposed to plasma radiation,\
    \ neutral bombardment, and conducted heat flux. It directly affects hydrogen recycling\
    \ (desorption flux scales exponentially with temperature via the Arrhenius relation),\
    \ sputtering yields, and material fatigue lifetime. Steady-state values in actively\
    \ cooled metallic walls are 400\u2013700 K during inter-ELM phases, with transient\
    \ surface excursions up to 1500 K during ELMs. Measured by embedded thermocouples,\
    \ infrared cameras, or fiber-optic sensors. In integrated modeling, $T_{\\rm wall}$\
    \ sets the boundary condition for neutral transport codes (EIRENE) and fuel-retention\
    \ calculations. See also [first_wall_surface_area](name:first_wall_surface_area)\
    \ and [neutral_wall_inventory](name:neutral_wall_inventory)."
  unit: K
  tags:
  - energy-balance
  - global-quantity
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
