- name: toroidal_angle_of_conductor_element_center
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the geometric center of a coil conductor\
    \ element in the right-handed cylindrical $(R, \\phi, Z)$ frame, representing\
    \ the midpoint location between the element's start and end points."
  documentation: "The toroidal angle $\\phi$ locates the center of a conductor element\
    \ along the toroidal direction in the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame, where $\\phi$ increases counter-clockwise when viewed from above the\
    \ $+\\hat{Z}$ axis. For a discretized coil winding, the center point lies geometrically\
    \ between the start and end points of the element, making it the natural reference\
    \ for field-line integration methods that evaluate magnetic contributions at the\
    \ midpoint of each current-carrying segment. This quantity belongs to the family\
    \ of conductor-element geometric coordinates; [toroidal_angle_of_conductor_element_start_point](name:toroidal_angle_of_conductor_element_start_point)\
    \ and [toroidal_angle_of_conductor_element_end_point](name:toroidal_angle_of_conductor_element_end_point)\
    \ bound the element, while [toroidal_angle_of_conductor_element_intermediate_point](name:toroidal_angle_of_conductor_element_intermediate_point)\
    \ provides additional shape refinement along the arc. Typical values span $0$\
    \ to $2\\pi$ rad for a full toroidal coil set; non-axisymmetric coils occupy discrete\
    \ $\\phi$ ranges determined by the device geometry. The center-point coordinate\
    \ is used in Biot\u2013Savart summations to compute the magnetic field contribution\
    \ of finite conductor segments, and also describes the toroidal position of optical\
    \ and diagnostic aperture centers in instruments viewing the plasma.\n\nSign convention:\
    \ Positive when $\\phi$ is in the direction of increasing toroidal angle (counter-clockwise\
    \ viewed from above $+\\hat{Z}$)."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_angle_of_conductor_element_start_point
  - name:toroidal_angle_of_conductor_element_end_point
  - name:toroidal_angle_of_conductor_element_intermediate_point
