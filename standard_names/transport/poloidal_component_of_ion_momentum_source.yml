name: poloidal_component_of_ion_momentum_source
status: draft
description: Poloidal projection of the volumetric momentum source acting on an ion
  species in the transport equations.
documentation: The poloidal component of the ion momentum source $S_{m,\theta}$ (unit
  $\mathrm{kg\,m^{-1}\,s^{-2}}$) represents the net volumetric force density projected
  onto the poloidal direction $\hat{\theta}$ that drives or damps ion poloidal rotation.
  Contributing processes include neoclassical poloidal viscosity, charge-exchange
  friction with neutrals, $\mathbf{j} \times \mathbf{B}$ torque from auxiliary current
  drive, and turbulent Reynolds stress. In the poloidal momentum balance $\partial(m_i
  n_i v_{\theta})/\partial t + \nabla \cdot \boldsymbol{\Pi}_{\theta} = S_{m,\theta}$,
  where $m_i$ is the ion mass, $n_i$ the ion density, $v_{\theta}$ the poloidal velocity,
  and $\boldsymbol{\Pi}_{\theta}$ the poloidal stress tensor, this source determines
  the equilibrium poloidal flow. Positive $S_{m,\theta}$ drives flow in the $+\hat{\theta}$
  direction (increasing poloidal angle) under the chosen coordinate convention. Typical
  magnitudes are small compared to the toroidal momentum source; poloidal rotation
  is predominantly set by neoclassical damping in standard tokamak regimes.
