    operator_kind: qualifier
- name: parallel_heat_flux_at_divertor_target
  kind: scalar
  status: draft
  description: Parallel heat flux density incident on a divertor target is the power
    transported along magnetic field lines toward the target per unit area perpendicular
    to the local magnetic field.
  documentation: 'Parallel heat flux at a divertor target is the field-aligned heat-flow
    density evaluated where scrape-off-layer field lines intersect a plasma-facing
    target surface. It characterizes how much power is carried along the magnetic
    field toward the material surface before projection onto the surface normal.


    The field-aligned component of the heat-flux vector is


    $$

    q_\parallel = \mathbf{q}\cdot\hat{\mathbf{b}}

    $$


    where $\mathbf{q}$ is the heat-flux vector and $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field. The target-normal heat flux
    is related by a magnetic-incidence projection, commonly $q_n \simeq q_\parallel
    |\hat{\mathbf{b}}\cdot\hat{\mathbf{n}}|$, so $q_\parallel$ is generally larger
    than the heat flux per unit target surface area when field lines strike the surface
    at a grazing angle.


    In practice it is inferred from divertor target heat-load measurements, such as
    infrared thermography or embedded calorimetry, combined with surface geometry
    and magnetic equilibrium reconstruction to de-project the measured target-normal
    power density along the incident field line. Modeling may compute it from parallel
    electron and ion conduction, convection, sheath transmission, and volumetric power
    losses in the scrape-off layer and divertor plasma.


    Typical parallel values in present tokamak divertors are about $1\times10^7-1\times10^9$
    W m$^{-2}$ during attached or weakly detached operation, with lower values in
    strongly detached conditions. Because of grazing magnetic incidence, the corresponding
    target-normal surface heat flux is often smaller by factors of roughly $10-100$.


    Sign convention: Positive when net heat is transported along the incident magnetic-field
    line from the plasma into the divertor target surface.'
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:peak_power_density_at_divertor_target
  - name:radiated_power_over_scrape_off_layer
- name: peak_power_density_at_divertor_target
  kind: scalar
  status: draft
  description: Spatial maximum of the heat flux density deposited on the divertor
    target surface, equal to the most severe local thermal load per unit area at the
    point of highest power concentration in the strike zone.
  documentation: "The peak power flux density at the divertor target quantifies the\
    \ maximum local heat load per unit area deposited anywhere on the divertor target\
    \ surface under a given plasma condition. It is the spatial maximum of the heat\
    \ flux distribution across the strike zone and governs the thermal stress, erosion\
    \ rate, and component lifetime of divertor plasma-facing components.\n\nFor a\
    \ heat flux profile $q(\\mathbf{x})$ distributed over the target surface, the\
    \ peak value is:\n\n$$\nq_\\mathrm{peak} = \\max_{\\mathbf{x} \\in S_\\mathrm{target}}\
    \ q(\\mathbf{x})\n$$\n\nwhere $\\mathbf{x}$ denotes position on the target surface\
    \ $S_\\mathrm{target}$ and $q$ is the local power per unit area from combined\
    \ particle and radiation loads.\n\nThe spatial heat flux distribution on target\
    \ tiles is resolved primarily by infrared thermography, with the peak extracted\
    \ from the measured surface temperature rise and the known surface thermal diffusivity\
    \ of the tile material. In numerical simulations, the peak is determined as the\
    \ maximum over the computed deposition profile on the strike zone.\n\nSteady-state\
    \ peak heat flux values in H-mode operation range from 1-20 MW/m\xB2 in present-day\
    \ devices; reactor design limits for tungsten monoblock divertor components are\
    \ set near 10 MW/m\xB2 for continuous operation, with transient events exceeding\
    \ steady-state limits by large factors. Analogous peak loads on other plasma-facing\
    \ surfaces are captured by [peak power density at the limiter](name:peak_power_density_at_limiter),\
    \ [peak power density at the first wall](name:peak_power_density_at_first_wall),\
    \ and the device-level [peak power density at the wall](name:peak_power_density_at_wall),\
    \ while [power at the divertor target due to radiation] quantifies the integrated\
    \ radiative contribution to the total target heat load."
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:peak_power_density_at_limiter
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_wall
- name: power_at_divertor_target
  kind: scalar
  status: draft
  description: Power deposited on a single divertor target by the net electric currents
    crossing the plasma-sheath interface, carried by ion and electron particle fluxes
    through the electrostatic sheath and delivered as kinetic and sheath-potential
    energy.
  documentation: 'Power at a divertor target is the rate at which charged particles
    deposit energy on one specified divertor target after crossing the plasma-sheath
    interface. It is a target-resolved charged-particle power load and excludes radiative,
    neutral, or purely conductive heat loads unless those contributions are included
    in the charged-particle heat-flux density being evaluated.


    The deposited power is the surface integral of the charged-particle sheath heat-flux
    density over the material area of that target:


    $$

    P_t = \int_{A_t} q_{\mathrm{sh}}(\mathbf{x}) \, dA

    $$


    where $P_t$ is the target power in W, $A_t$ is the target surface area in m^2,
    $q_{\mathrm{sh}}$ is the charged-particle heat-flux density normal to the target
    in W m^-2, $\mathbf{x}$ labels position on the target surface, and $dA$ is a surface
    element in m^2. For non-overlapping targets, the aggregate [power_of_divertor](name:power_of_divertor)
    is the target sum $P_{\mathrm{div}}=\sum_t P_t$ over the targets included in the
    divertor definition.


    In practice, $P_t$ is obtained by integrating a measured or inferred target heat-flux
    distribution, commonly from infrared thermography, calorimetry, embedded probes,
    or edge plasma reconstruction constrained by target measurements. In sheath-physics
    estimates, $q_{\mathrm{sh}}$ is evaluated from ion and electron particle fluxes
    $\Gamma_s$ in m^-2 s^-1 and the energy per particle delivered through the sheath;
    equivalently, species charge-current densities may be written $j_s=Z_s e\Gamma_s$
    in A m^-2, where $Z_s$ is charge state and $e$ is the elementary charge in C.
    A heat-transmission coefficient $\gamma$ is often used as a dimensionless model
    parameter, with its value depending on sheath assumptions, temperature ratios,
    secondary-electron emission, collisionality, and magnetic incidence angle; it
    is not a universal property of the target.


    Typical integrated charged-particle power on a single target is about 10^3-10^5
    W in small laboratory devices, 10^5-10^7 W in medium and large tokamaks, and can
    exceed 10^7 W in high-power attached operation. Detached divertor conditions can
    reduce the charged-particle power reaching the target even when the upstream exhaust
    power remains large.


    Sign convention: Positive when charged particles transfer energy from the plasma
    across the plasma-sheath interface to the divertor target surface.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor
  - name:power_at_divertor_target_due_to_conduction
  - name:deposited_power_at_divertor_target_due_to_halo_current
- name: neutral_power_at_divertor_target
  kind: scalar
  status: draft
  description: Net power deposited on a single divertor target by incident neutral
    particles, including contributions from charge-exchange neutrals and volume-recombined
    ions.
  documentation: "Neutral particles reaching the divertor \u2014 primarily hydrogen\
    \ isotopes produced through charge exchange with the edge plasma and through volume\
    \ recombination \u2014 carry both kinetic and potential energy that is released\
    \ on the target surface upon impact. This quantity gives the net power deposited\
    \ by all such neutrals on a single divertor target, forming one component of the\
    \ total per-target heat load alongside the ion and electron contributions.\n\n\
    The net neutral power at the target is the surface integral of the incident neutral\
    \ energy flux density:\n\n$$\nP_{\\mathrm{n}} = \\int_A \\Gamma_{\\mathrm{n}}(\\\
    mathbf{r})\\,\\langle E_{\\mathrm{n}} \\rangle\\, dA\n$$\n\nwhere $\\Gamma_{\\\
    mathrm{n}}$ is the incident neutral particle flux density in m$^{-2}$ s$^{-1}$,\
    \ $\\langle E_{\\mathrm{n}} \\rangle$ is the mean energy per incident neutral\
    \ in J, and $A$ is the wetted target area in m$^2$.\n\nThis quantity is computed\
    \ from edge transport models that couple fluid plasma equations to Monte Carlo\
    \ neutral solvers, or estimated by subtracting ion and electron power contributions\
    \ from calorimetrically measured total heat loads. The neutral power contribution\
    \ grows most significant under detached divertor conditions, where the recombination\
    \ front approaches the target and the mechanism quantified by [neutral_power_at_divertor_target_due_to_recombination](name:neutral_power_at_divertor_target_due_to_recombination)\
    \ dominates. To obtain the neutral power summed over all divertor targets, see\
    \ [neutral_power_of_divertor](name:neutral_power_of_divertor). The conduction-dominated\
    \ plasma power channel at the same target is given by [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction).\n\
    \nSign convention: Positive when neutral particles deposit net energy on the target\
    \ surface, corresponding to power flow directed from the divertor plasma volume\
    \ toward the target."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_at_divertor_target_due_to_recombination
  - name:neutral_power_of_divertor
  - name:power_at_divertor_target_due_to_conduction
  arguments:
  - name: power_at_divertor_target
    operator: neutral
    operator_kind: qualifier
- name: power_at_divertor_target_due_to_conduction
  kind: scalar
  status: draft
  description: Thermal power deposited on a single divertor target by parallel conduction
    along magnetic field lines in the scrape-off layer, excluding convective, radiative,
    and neutral-particle power channels.
  documentation: "The power at divertor target due to conduction is the component\
    \ of the total divertor target heat load attributed to parallel thermal conduction\
    \ along open magnetic field lines in the scrape-off layer and divertor plasma.\
    \ It isolates the conductive channel of the plasma\u2013target power balance from\
    \ contributions by convective particle enthalpy flux, absorbed radiation, and\
    \ neutral-particle energy deposition, and is the single-target resolved contribution\
    \ of the global conducted power described by [power_due_to_conduction](name:power_due_to_conduction).\n\
    \nIn the scrape-off layer the electron conductive heat flux follows the Spitzer\u2013\
    H\xE4rm closure:\n\n$$\nq_{\\parallel,e} = -\\kappa_0 T_e^{5/2} \\nabla_\\parallel\
    \ T_e\n$$\n\nwhere $\\kappa_0 \\approx 2000\\ \\mathrm{W\\,m^{-1}\\,eV^{-7/2}}$\
    \ is the electron thermal conductivity prefactor, $T_e$ is the local electron\
    \ temperature, and $\\nabla_\\parallel T_e$ is the temperature gradient along\
    \ the magnetic field. The conducted power at the target is the surface integral\
    \ of this flux\u2014plus the smaller ion conductive contribution\u2014over the\
    \ wetted target area.\n\nIn attached divertor operation this quantity is obtained\
    \ from two-point model power balance calculations relating upstream scrape-off-layer\
    \ conditions to target heat fluxes, or from infrared thermography and calorimetric\
    \ inversion of target surface temperature measurements. In detached operation,\
    \ volumetric power dissipation by radiation and recombination in the divertor\
    \ volume substantially reduces the conducted power reaching the target, making\
    \ this quantity a sensitive diagnostic indicator of detachment depth. Together\
    \ with [power_at_divertor_target_due_to_convection](name:power_at_divertor_target_due_to_convection)\
    \ and power_at_divertor_target_due_to_radiation, it contributes to the total [power_at_divertor_target](name:power_at_divertor_target)."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_conduction
  - name:power_at_divertor_target_due_to_convection
  - name:power_at_divertor_target
- name: power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Total power deposited on the inner, high-field-side divertor target
    by all incident energy channels integrated over the wetted strike-zone surface.
    It represents a surface-integrated load in watts, not a local heat-flux density.
  documentation: 'Power at the inner divertor target is the total rate at which energy
    is deposited on the high-field-side divertor target surface. It includes the combined
    contribution of incident electrons, ions, neutrals, and radiation over the wetted
    strike-zone area, and represents the integrated thermal load relevant for target
    heat removal and material limits.


    A common definition is the surface integral of the deposited heat-flux density
    over the wetted inner target area:


    $$

    P_{\mathrm{inner}} = \int_{A_{\mathrm{wet,inner}}} q_{\mathrm{dep}}(\mathbf{x})\,dA

    $$


    where $A_{\mathrm{wet,inner}}$ is the part of the inner target receiving plasma
    or radiative power, $q_{\mathrm{dep}}$ is the total deposited heat-flux density
    including electron, ion, neutral, and radiative channels, and $dA$ is an element
    of target surface area.


    In practice this power is inferred by integrating measured or modeled target heat-flux
    distributions from diagnostics such as infrared thermography, calorimetry, embedded
    thermocouples, and Langmuir-probe measurements, with radiation and neutral contributions
    estimated from radiation diagnostics or edge-plasma modeling when needed. More
    specific quantities may isolate a channel, such as [electron power at the inner
    divertor target](name:electron_power_at_inner_divertor_target), or summarize a
    time interval, such as [maximum power at the inner divertor target](name:maximum_power_at_inner_divertor_target).


    Typical values range from about 10^4-10^6 W in small and medium experiments, 10^6-10^7
    W in high-power tokamak operation, and can exceed 10^7 W in reactor-scale scenarios
    depending on input power, detachment state, radiation fraction, and divertor configuration.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_inner_divertor_target
  - name:total_ion_power_at_inner_divertor_target
  - name:power_at_divertor_target_due_to_radiation
  - name:thermal_power_of_divertor
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Electron thermal power deposited on the inner divertor target.
  documentation: 'Electron power at the inner divertor target is the total rate at
    which electron thermal energy is deposited on the inner, high-field-side divertor
    target surface. It is the electron contribution to the deposited target power
    and is distinct from ion, neutral, radiative, or electromagnetic power contributions.


    The deposited electron power is the surface integral of the electron heat-flux
    density normal to the target and directed into the material:


    $$

    P_{e,\mathrm{inner}} = \int_{A_\mathrm{inner}} q_{e,n}^{\mathrm{dep}} \, dA

    $$


    where $A_\mathrm{inner}$ is the inner target surface area over which electron
    heat is deposited, $dA$ is an element of target area in m$^2$, and $q_{e,n}^{\mathrm{dep}}$
    is the deposited electron heat-flux density in W m$^{-2}$. If a vector electron
    heat flux is used, $q_{e,n}^{\mathrm{dep}}$ is its projection onto the unit normal
    pointing into the target material; only the into-surface electron thermal component
    is included.


    In practice this quantity is obtained by integrating local electron heat-flux
    estimates over the inner target. Those estimates may come from Langmuir probe
    measurements with a sheath heat-transmission model, from surface calorimetry or
    infrared thermography combined with a model that separates the electron channel,
    or from edge-plasma simulations constrained by divertor diagnostics.


    As a deposited power it is reported as a non-negative scalar; 0 W means that no
    resolved electron thermal power reaches the inner target. Values are strongly
    device- and scenario-dependent, ranging from near 0 W during highly detached or
    low-power phases to kilowatt or megawatt scales in powered divertor plasmas. The
    corresponding outer-target quantity is [electron_power_at_outer_divertor_target](name:electron_power_at_outer_divertor_target),
    while integrated divertor power balances are described by [thermal_power_of_divertor](name:thermal_power_of_divertor)
    and power_of_divertor.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_outer_divertor_target
  - name:thermal_power_of_divertor
  arguments:
  - name: power_at_inner_divertor_target
    operator: electron
    operator_kind: qualifier
- name: maximum_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Maximum power deposited on the inner high-field-side divertor target
    during a specified time interval. It is a non-negative surface-integrated power
    in watts, not a local heat-flux density, and supports assessment of target thermal
    margins.
  documentation: 'Maximum power at the inner divertor target is the largest total
    power deposited on the high-field-side divertor target over a specified time interval.
    It is a non-negative surface integral of deposited heat flux over the wetted target
    surface, expressed in watts, and is distinct from a local power-flux density expressed
    in W m^-2.


    The maximum deposited power is defined from the time-resolved surface heat-flux
    distribution as:


    $$

    P_{\mathrm{inner}}^{\max} = \max_{t \in [t_1,t_2]} \int_{A_{\mathrm{inner}}(t)}
    q_{\perp,\mathrm{dep}}(\mathbf{x}, t)\, dA

    $$


    where $[t_1,t_2]$ is the time interval of interest, $A_{\mathrm{inner}}(t)$ is
    the wetted area of the inner divertor target, $dA$ is a surface area element in
    m^2, and $q_{\perp,\mathrm{dep}}$ is the non-negative heat flux deposited through
    the target surface into the plasma-facing material in W m^-2. The subscript $\perp$
    refers to the normal to the material surface; this quantity should not be confused
    with field-parallel heat flux $q_\parallel$ carried along magnetic field lines
    before interception by the target.


    In practice this quantity is obtained by integrating time-resolved target heat-flux
    maps inferred from infrared thermography, embedded calorimetry, Langmuir probes,
    or boundary-plasma power-balance analysis. The definition concerns net power deposited
    at the target surface and does not require assigning the deposited energy to individual
    carrier channels; electron, ion, neutral, or radiative contributions may be treated
    separately when such resolved information is available.


    Typical magnitudes are strongly device- and scenario-dependent. Present tokamak
    discharges commonly span about $10^5-10^7$ W for an individual inner target, with
    lower values during detached or low-power phases and higher values possible in
    large, high-power plasmas.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_inner_divertor_target
  - name:maximum_power_at_outer_divertor_target
  - name:electron_power_at_inner_divertor_target
  - name:total_ion_power_at_inner_divertor_target
  arguments:
  - name: power_at_inner_divertor_target
    operator: maximum
    operator_kind: qualifier
- name: power_at_outer_divertor_target
  kind: scalar
  status: draft
  description: "Net power deposited on the outer divertor target, the divertor plate\
    \ located at larger major radius in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It is the integral of the net energy flux into the wetted target surface,\
    \ summed over all energy-deposition mechanisms."
  documentation: 'Power at the outer divertor target is the net rate at which energy
    is deposited on the material surface of the outer divertor target, the plate located
    at the larger major radius in the right-handed cylindrical $(R, \phi, Z)$ frame.
    It is an all-mechanism total integrated over the wetted strike-zone area of that
    single target, not a mechanism-resolved or per-channel contribution.


    The deposited power is defined by integrating the local net deposited energy-flux
    density normal to the target surface over the wetted area:


    $$

    P_\mathrm{out} = \int_{A_w} q_{\perp,\mathrm{dep}} \, dA

    $$


    where $q_{\perp,\mathrm{dep}}$ is the local net deposited energy-flux density
    in W m$^{-2}$, $dA$ is a target-surface area element in m$^2$, and $A_w$ is the
    wetted strike-zone area of the outer target in m$^2$. The flux density $q_{\perp,\mathrm{dep}}$
    is the net sum of all energy delivered to the surface by the plasma and associated
    channels arriving at that point.


    In experiments this quantity is commonly inferred from infrared thermography of
    the target tiles, embedded calorimetry, thermocouples, or heat-balance analysis.
    Langmuir probes, spectroscopy, and edge-plasma modeling can constrain the local
    flux profile and the underlying deposition channels. This target-specific quantity
    is distinct from the mechanism-resolved divertor-power quantities, which are aggregated
    over all divertor targets rather than resolved to the outer target alone.


    Typical values are strongly discharge- and device-dependent, spanning roughly
    $10^3-10^7$ W, with lower values under low-power or strongly detached conditions
    and higher values under high-power attached or partially detached conditions.


    Sign convention: Positive when net energy is deposited onto the outer divertor
    target surface.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:power_of_divertor_due_to_convection
  - name:neutral_power_of_divertor
  - name:plasma_power_of_divertor_due_to_recombination
- name: electron_power_at_outer_divertor_target
  kind: scalar
  status: draft
  description: Total rate at which the electron population deposits energy on the
    material outer divertor target.
  documentation: 'Electron power at the outer divertor target is the total rate at
    which electrons transfer energy to the material divertor surface on the larger-$R$
    side. Here $R$ is major radius in the right-handed cylindrical $(R, \phi, Z)$
    frame, with $Z$ the vertical height. It is a surface-integrated deposited-power
    quantity, distinct from a local heat-flux density.


    For an electron heat-flux density normal to the target surface, the deposited
    power is


    $$

    P_{e,\mathrm{outer}} = \int_{A_{\mathrm{outer}}} q_{e,n}(\mathbf{x})\, dA

    $$


    where $A_{\mathrm{outer}}$ is the wetted area of the outer divertor target, $q_{e,n}$
    is the electron contribution to the normal heat-flux density in W m$^{-2}$, $\mathbf{x}$
    labels position on the material surface, and $dA$ is a surface-area element. The
    integrand is counted as deposited heat flux when electron energy flows from the
    plasma into the material target.


    In experiments this quantity is inferred by integrating the electron-channel heat
    flux over the wetted strike-zone area. Target thermography or calorimetry can
    constrain the total deposited heat flux, while Langmuir probes, spectroscopic
    constraints, sheath physics, and edge-plasma transport modeling may be used to
    separate the electron contribution from ion and radiative components. The integration
    should follow the actual material-surface geometry and include the full wetted
    area associated with the outer strike zone.


    Typical magnitudes span about $10^4$-$10^6$ W in small or low-power tokamak plasmas
    and about $10^6$-$10^7$ W in medium-size high-heating plasmas; larger high-power
    scenarios can exceed $10^7$ W. The value depends on input power, radiated power,
    detachment state, magnetic balance, strike-zone spreading, and inner/outer target
    power sharing.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_outer_divertor_target
  - name:electron_power_at_inner_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:neutral_power_at_divertor_target
  arguments:
  - name: power_at_outer_divertor_target
    operator: electron
    operator_kind: qualifier
- name: maximum_power_at_outer_divertor_target
  kind: scalar
  status: draft
  description: "Maximum, over a specified time interval, of the total power deposited\
    \ on the outer divertor target. The outer target is the divertor target on the\
    \ larger-major-radius side in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Maximum power at the outer divertor target is the largest value,
    within a chosen time interval, of the total power deposited on the plasma-facing
    target surface at larger major radius. The outer target is identified in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The quantity is non-negative because it counts
    deposited energy flow into the target material.


    For a time interval $T$, it is obtained from the local deposited heat-flux density
    by integrating over the outer target surface and taking the temporal maximum:


    $$

    P_{\mathrm{max,OT}} = \max_{t \in T} \int_{S_{\mathrm{OT}}} q_{\perp,\mathrm{dep}}(\mathbf{r},
    t)\, dA

    $$


    where $P_{\mathrm{max,OT}}$ is this maximum power, $S_{\mathrm{OT}}$ is the plasma-facing
    surface of the outer divertor target, $q_{\perp,\mathrm{dep}}(\mathbf{r}, t)$
    is the local perpendicular deposited heat-flux density at surface position $\mathbf{r}$
    and time $t$, and $dA$ is the surface-area element. The deposited heat-flux density
    is defined as positive for heat flux into the target surface. The corresponding
    instantaneous integrated quantity is [power_at_outer_divertor_target](name:power_at_outer_divertor_target).


    In practice, the time-dependent outer-target power is inferred from infrared thermography
    with thermal modeling, embedded calorimetry, probe-based heat-flux estimates,
    and global power-balance constraints, or computed by integrating modeled loads
    over the target. Conductive, convective, and radiative contributions are related
    to [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction),
    [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection),
    and power_at_divertor_target_due_to_radiation. Comparison with [maximum_power_at_inner_divertor_target](name:maximum_power_at_inner_divertor_target)
    separates larger- and smaller-major-radius divertor loading, while [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target)
    describes the local peak heat-flux density rather than integrated power.


    Representative order-of-magnitude maxima are device and scenario dependent: $10^5-10^6$
    W in low-power or strongly detached cases, $10^6-10^7$ W in many diverted tokamak
    scenarios, and $10^7-10^8$ W in large high-heating-power cases. These ranges are
    indicative rather than definitional; the actual value depends on heating power,
    radiated fraction, detachment state, strike-point sharing, and wetted area.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_outer_divertor_target
  - name:power_of_divertor_due_to_conduction
  - name:power_of_divertor_due_to_convection
  - name:maximum_power_at_inner_divertor_target
  - name:peak_power_density_at_divertor_target
  arguments:
  - name: power_at_outer_divertor_target
    operator: maximum
    operator_kind: qualifier
- name: power_due_to_convection
  kind: scalar
  status: draft
  description: Power deposited on plasma-facing surfaces by convective plasma particle
    flux, comprising thermal enthalpy and directed kinetic energy carried by streaming
    ions and electrons from the scrape-off layer.
  documentation: "Convective power quantifies the energy transported to a plasma-facing\
    \ surface by the bulk flow of plasma particles \u2014 ions, electrons, and neutral\
    \ species \u2014 streaming along open magnetic field lines from the scrape-off\
    \ layer to bounding material surfaces. It represents the convective channel of\
    \ the total surface power balance, distinct from the conductive contribution driven\
    \ by parallel temperature gradients and from radiative deposition.\n\nThe local\
    \ convective heat-flux density summed over particle species $s$ is\n\n$$\nq_{\\\
    mathrm{conv}} = \\sum_s n_s v_{\\parallel,s} \\left( \\frac{\\gamma_s}{\\gamma_s\
    \ - 1} k_B T_s + \\frac{1}{2} m_s v_{\\parallel,s}^2 \\right)\n$$\n\nwhere $n_s$\
    \ is the number density, $v_{\\parallel,s}$ the parallel flow speed, $\\gamma_s$\
    \ the adiabatic index (5/3 for monatomic species), $T_s$ the temperature, and\
    \ $m_s$ the particle mass. Integrating $q_{\\mathrm{conv}}$ over the wetted surface\
    \ area yields the total convective power in watts.\n\nIn experiments the convective\
    \ power is inferred from Langmuir-probe measurements of particle flux and sheath-entrance\
    \ temperature, or decomposed from total calorimetric measurements by subtracting\
    \ the conductive fraction estimated via two-point model analysis. More specific\
    \ realizations include [power at a single divertor target due to convection](name:power_at_divertor_target_due_to_convection),\
    \ [convective power summed over all divertor targets](name:power_of_divertor_due_to_convection),\
    \ and [convective power at the first wall](name:power_at_wall_due_to_convection).\
    \ The full surface load integrating all channels is characterized by heat_flux_of_plasma_facing_component."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_convection
  - name:power_of_divertor_due_to_convection
  - name:power_at_wall_due_to_convection
  sources:
  - id: derived:power_due_to_convection
    status: composed
- name: power_at_divertor_target_due_to_convection
  kind: scalar
  status: draft
  description: Power deposited on a single divertor target by convective plasma particle
    flux, comprising thermal enthalpy and directed kinetic energy carried by streaming
    ions and electrons from the scrape-off layer.
  documentation: 'Convective power at a divertor target is the surface-integrated
    rate at which incident charged plasma particles deposit energy on one target surface
    by their bulk motion into the material. It includes thermal enthalpy and directed
    kinetic energy carried by ions and electrons flowing from the scrape-off layer,
    and it is the single-target member of the broader [power due to convection](name:power_due_to_convection)
    family. This channel is distinct from temperature-gradient-driven [conductive
    target power](name:power_at_divertor_target_due_to_conduction) and from radiative
    or neutral-particle deposition.


    The target-integrated convective power can be represented as the incident surface
    integral of the charged-species convective energy flux:


    $$

    P_{\mathrm{conv},t} = \int_{A_t} \sum_{s \in \mathrm{charged}} \left[\frac{\gamma_s}{\gamma_s-1}p_s
    + \frac{1}{2}m_s n_s u_{\parallel,s}^2\right] \max\!\left(0, u_{\parallel,s}\,\hat{b}\cdot\hat{n}_{\mathrm{mat}}\right)\,dA

    $$


    where $A_t$ is the wetted area of the target, $s$ labels charged species, $p_s$
    is the local thermal pressure, $\gamma_s$ is the adiabatic index, $m_s$ and $n_s$
    are particle mass and number density, $u_{\parallel,s}$ is the signed flow speed
    along the magnetic-field unit vector $\hat{b}$, and $\hat{n}_{\mathrm{mat}}$ is
    the unit normal directed from the plasma into the target material. The projection
    term gives the incident normal speed through the target surface; outward flow
    is excluded by the maximum operator. Pressures are in pascals, speeds in m s^-1,
    and the surface integral yields watts; for monatomic species $\gamma_s=5/3$, giving
    the familiar $5p_s/2$ enthalpy density.


    In experiments and simulations this quantity is obtained by integrating an inferred
    or modeled convective heat-flux density over the wetted strike region of a single
    target. Langmuir-probe measurements, sheath-entrance density and temperature estimates,
    flow information, and magnetic-incidence geometry can constrain the convective
    term, while infrared thermography or calorimetry usually measure the total target
    heat load; separating convection from conduction therefore requires a sheath or
    edge-transport model. Summing this quantity over all target surfaces gives [power
    of divertor due to convection](name:power_of_divertor_due_to_convection), and
    comparisons between [inner](name:power_at_inner_divertor_target) and [outer](name:power_at_outer_divertor_target)
    targets are used to study divertor power-sharing asymmetry.


    Representative single-target values are strongly device- and regime-dependent:
    less than $10^3$ W in small or strongly detached plasmas, $10^4-10^6$ W in many
    medium-size diverted tokamak discharges, and $10^6-10^7$ W or higher during high-power
    attached operation. The value depends on upstream scrape-off-layer density and
    temperature, particle flux, target wetted area, magnetic flux expansion, and the
    degree of detachment.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:electron_temperature_at_divertor_target
  - name:power_due_to_convection
  - name:thermal_power_of_divertor
  arguments:
  - name: power_due_to_convection
    operator: divertor_target
    operator_kind: locus
- name: power_due_to_fusion
  kind: scalar
  status: draft
  description: Power due to fusion is the rate at which energy originating in fusion
    reactions is deposited in, or assigned to, a specified plasma region or material
    component. It covers fusion-product and secondary nuclear energy deposition only,
    such as neutron and gamma heating, and excludes non-fusion heat loads.
  documentation: 'Power due to fusion is the power contribution whose ultimate energy
    source is nuclear fusion reactions. It is a generic parent quantity for fusion-origin
    power deposited in particular regions or structures, such as the [divertor fusion
    deposition power](name:power_of_divertor_due_to_fusion), and is distinct from
    total thermal, radiative, or particle heat loads not caused by fusion products.


    For a specified region or component $\Omega$, the deposited fusion power can be
    written as the volume integral of the local fusion-origin energy-deposition rate
    density:


    $$

    P_\mathrm{fusion,dep} = \int_\Omega S_\mathrm{fusion,dep} \, dV

    $$


    where $S_\mathrm{fusion,dep}$ is the local power density deposited by fusion reaction
    products and secondary nuclear radiation, and $dV$ is the volume element of the
    region or material considered.


    In practice this quantity is computed from fusion reaction rates, product energy
    spectra, and transport or attenuation of fusion neutrons, charged fusion products,
    and secondary gamma radiation. For material components, nuclear heating calculations
    account for neutron moderation, scattering, absorption, and gamma production;
    for plasma regions, charged-particle slowing-down and energy deposition may also
    contribute.


    Typical values range from near 0 W in non-fusing or very low-rate plasmas, through
    10^3-10^7 W for localized component nuclear heating in high-performance deuterium-tritium
    operation, to 10^8-10^9 W for total fusion power in reactor-scale plasmas. The
    value depends strongly on reaction rate, fuel mixture, geometry, shielding, and
    the region over which deposition is evaluated.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_fusion
  - name:deposited_power_at_divertor_target_due_to_halo_current
  sources:
  - id: derived:power_due_to_fusion
    status: composed
- name: power_due_to_radiation
  kind: scalar
  status: draft
  description: Net photon power absorbed by a divertor surface or assembly, equal
    to the incident radiative flux from impurity and hydrogenic plasma emission integrated
    over the surface area minus the reflected component.
  documentation: "Radiative power deposited on divertor plasma-facing surfaces arises\
    \ from photon emission by impurity and hydrogenic species in the scrape-off layer\
    \ and divertor volume \u2014 primarily line radiation from partially ionized impurity\
    \ ions, electron-ion bremsstrahlung, and radiative recombination continuum. The\
    \ net absorbed fraction depends on the incident photon spectrum and the photon\
    \ reflectivity of the plasma-facing material, which can be non-negligible for\
    \ metallic first-wall components.\n\nThe net radiative power deposited on a surface\
    \ $S$ is defined as:\n\n$$\nP_{\\rm rad} = \\int_S \\bigl(1 - \\rho_r(\\mathbf{r})\\\
    bigr)\\, q_{\\rm rad}(\\mathbf{r})\\, dA\n$$\n\nwhere $q_{\\rm rad}$ is the incident\
    \ radiative power flux density and $\\rho_r$ is the local photon reflectivity\
    \ of the surface material at position $\\mathbf{r}$.\n\nThis parent abstracts\
    \ over two geometric scopes: power_at_divertor_target_due_to_radiation gives the\
    \ net absorbed radiative power for a single divertor target, while [power_of_divertor_due_to_radiation](name:power_of_divertor_due_to_radiation)\
    \ sums the net radiative deposition over all divertor targets. In practice, the\
    \ radiative load is inferred from resistive or photodiode bolometric arrays that\
    \ integrate broad-spectrum emission, or from spectroscopic line-integrated measurements\
    \ combined with impurity transport modeling. In detached divertor regimes the\
    \ radiative component can account for a substantial fraction of the total divertor\
    \ heat exhaust captured by [thermal_power_of_divertor](name:thermal_power_of_divertor),\
    \ whereas in attached high-heat-flux conditions the conducted and convected plasma\
    \ channels dominate."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_radiation
  - name:thermal_power_of_divertor
- name: power_due_to_recombination
  kind: scalar
  status: draft
  description: Power deposited on plasma-facing materials by recombination processes,
    encompassing both plasma-ion recombination and surface recombination of neutral
    atoms, without restriction to a particular surface location.
  documentation: 'Recombination power is the heat load delivered to plasma-facing
    materials when ions recover electrons and transition to neutral states, releasing
    ionization potential energy and residual kinetic energy at or near material surfaces.
    Two principal channels contribute: sheath-accelerated plasma-ion recombination
    at target surfaces, and surface recombination of neutral atoms into molecules,
    which deposits the molecular binding energy directly into the wall or divertor
    plate material.


    The integrated power from recombination events over a wetted area $A$ is:


    $$P_\text{rec} = \sum_s \int_A \Gamma_s \, E_s \, dA$$


    where $\Gamma_s$ [m$^{-2}$ s$^{-1}$] is the incident particle flux density for
    species $s$ and $E_s$ [J] is the energy released per recombination event for that
    species, including ionization potential and kinetic contributions.


    This power channel is intrinsically non-negative and becomes particularly significant
    in detached and partially detached divertor regimes, where volumetric ion-electron
    recombination upstream of the strike point redistributes energy deposition away
    from the target. Location-specific realizations include [power deposited on a
    single divertor target](name:power_at_divertor_target_due_to_recombination), the
    [total over the full divertor assembly](name:power_of_divertor_due_to_recombination),
    and [power at first-wall surfaces](name:power_at_wall_due_to_recombination). The
    neutral recombination particle flux produced in these processes is characterized
    by [neutral_energy_flux_due_to_recombination](name:neutral_energy_flux_at_wall_due_to_recombination).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_recombination
  - name:power_of_divertor_due_to_recombination
  - name:power_at_wall_due_to_recombination
  - name:neutral_energy_flux_at_wall_due_to_recombination
  sources:
  - id: dd:divertors/divertor/power_recombination_plasma
    dd_path: divertors/divertor/power_recombination_plasma
    status: composed
- name: power_at_divertor_target_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on a divertor target by recombination processes,
    summing the plasma-ion and neutral-particle recombination channels at the plasma-material
    interface.
  documentation: 'This quantity captures the combined recombination power delivered
    to a single divertor target, encompassing two physically distinct contributions:
    energy released when plasma ions recombine at or near the target surface (the
    plasma channel, quantified by plasma_power_at_divertor_target_due_to_recombination)
    and energy deposited when neutral particles undergo recombination into lower-energy
    bound states at the material wall (the neutral channel, quantified by [neutral_power_at_divertor_target_due_to_recombination](name:neutral_power_at_divertor_target_due_to_recombination)).


    The total recombination power at the target decomposes additively:


    $$

    P_{\rm rec,target} = P_{\rm rec,plasma} + P_{\rm rec,neutral}

    $$


    where $P_{\rm rec,plasma}$ is the ion-recombination contribution and $P_{\rm rec,neutral}$
    is the neutral-particle recombination contribution, both in W.


    This target-localized quantity is a spatial specialization of the volume-integrated
    [power_due_to_recombination](name:power_due_to_recombination), which integrates
    recombination power over the full plasma domain. In attached divertor operation,
    recombination power at the target is a minor fraction of the total heat load;
    in detached or high-recycling regimes, surface and volumetric recombination become
    significant energy sinks that reduce the conducted and convected flux reaching
    the target. It is inferred from edge plasma simulations or from particle flux
    measurements combined with surface energy-release models, and is non-negative
    by definition.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_at_divertor_target_due_to_recombination
  - name:power_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: divertor_target
    operator_kind: locus
- name: neutral_power_at_divertor_target_due_to_recombination
  kind: scalar
  status: draft
  description: Thermal power deposited in a divertor target by neutral atoms, molecules,
    or fragments that recombine into lower-energy bound states, including molecule
    formation at the surface. It is the neutral-particle contribution to recombination
    heat load, distinct from plasma-ion recombination.
  documentation: 'Neutral recombination power at a divertor target is the thermal
    energy per unit time deposited in the target material by neutral-particle recombination
    at the surface or in the near-surface neutral layer. For hydrogenic plasmas, an
    important example is atomic hydrogen recombining to form molecules; only the fraction
    of released binding, internal, and kinetic energy that is accommodated by the
    target contributes to this quantity. This is the neutral-particle channel of recombination
    heating, distinct from plasma_power_at_divertor_target_due_to_recombination.


    The target-integrated neutral recombination power is obtained by integrating the
    corresponding heat-flux density over the wetted target area:


    $$

    P_{\mathrm{rec,n}} = \int_{\mathcal{A}_t} q_{\mathrm{rec,n}} \, dA

    $$


    where $P_{\mathrm{rec,n}}$ is the neutral recombination power, $q_{\mathrm{rec,n}}$
    is the local heat-flux density due only to neutral recombination in W m$^{-2}$,
    and $\mathcal{A}_t$ is the target area receiving that heat load.


    In practice this contribution is estimated from edge plasma-neutral transport
    and surface-interaction modeling using neutral fluxes, recombination rates, reaction
    energies, sticking probabilities, and energy-accommodation coefficients. It can
    be constrained indirectly by divertor calorimetry or infrared thermography together
    with spectroscopy, neutral-pressure measurements, and gas-balance analysis, but
    separating it from conduction, radiation, charge exchange, and plasma-ion recombination
    is generally model-dependent.


    Representative values range from nearly 0 W when neutral recombination at the
    target is weak to about $10^3$-$10^6$ W per target in high-recycling or detached
    divertor conditions, with strong dependence on device size, neutral density, target
    temperature, and plasma species. Together with plasma_power_at_divertor_target_due_to_recombination,
    it contributes to [power_at_divertor_target_due_to_recombination](name:power_at_divertor_target_due_to_recombination);
    summed over divertor targets it corresponds to [neutral_power_of_divertor_due_to_recombination](name:neutral_power_of_divertor_due_to_recombination)
    and forms part of [neutral_power_at_divertor_target](name:neutral_power_at_divertor_target)
    and [thermal_power_of_divertor](name:thermal_power_of_divertor).


    Sign convention: Positive when energy from neutral recombination is deposited
    into the divertor target material.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_recombination
  - name:neutral_power_of_divertor_due_to_recombination
  - name:neutral_power_at_divertor_target
  - name:thermal_power_of_divertor
  arguments:
  - name: power_at_divertor_target_due_to_recombination
    operator: neutral
    operator_kind: qualifier
- name: power_of_divertor
  kind: scalar
  status: draft
  description: "Power deposited on all divertor targets by net electric currents crossing\
    \ the plasma\u2013sheath interface, summed over all target surfaces in the divertor\
    \ assembly."
  documentation: 'Net charge currents crossing the plasma sheath transfer electrical
    power to divertor target surfaces in addition to the kinetic energy carried by
    streaming particles. For a net current $I_t$ flowing through a sheath potential
    drop $V_{s,t}$ at target surface $t$, the current-driven deposited power on that
    target is:


    $$

    P_t = I_t \, V_{s,t}

    $$


    where $V_{s,t}$ is the potential difference from the presheath edge to the solid
    surface, and the sum over all divertor targets yields the quantity reported here.
    This electrical power channel complements the kinetic heat loads from [parallel
    thermal conduction](name:power_of_divertor_due_to_conduction), [plasma ion recombination](name:plasma_power_of_divertor_due_to_recombination),
    and [neutral particle deposition](name:neutral_power_of_divertor); the [thermal
    heat-exhaust component](name:thermal_power_of_divertor) integrates all surface-incident
    thermal fluxes separately. The net electric current driving this deposition is
    quantified by [current_of_divertor](name:current_of_divertor).


    In practice this quantity is inferred from Langmuir probe or biased-tile measurements
    of local current density combined with floating-to-wall potential differences.
    In attached divertor operation the current-driven contribution is typically a
    minor fraction of the total heat load, but it becomes significant during transient
    events such as disruptions, where large halo currents traverse divertor surfaces,
    or in experiments with externally applied target biasing.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:plasma_power_of_divertor_due_to_recombination
  - name:neutral_power_of_divertor
  - name:thermal_power_of_divertor
  - name:current_of_divertor
- name: neutral_power_of_divertor
  kind: scalar
  status: draft
  description: Net power deposited on all divertor targets by neutral particles, aggregated
    over all targets in the divertor assembly.
  documentation: "Neutral particles \u2014 charge-exchange atoms, recycled hydrogen\
    \ atoms and molecules, and dissociation products \u2014 transport energy to divertor\
    \ target surfaces through thermal accommodation, dissociation, and recombination\
    \ processes. This quantity aggregates the neutral-particle heat load over all\
    \ individual divertor targets, capturing the total neutral-particle contribution\
    \ to the divertor power balance without resolving individual targets or specific\
    \ interaction processes.\n\nThe neutral power deposition arises from both the\
    \ kinetic energy and the internal (potential) energy carried by neutral particles\
    \ to the target surface. In attached divertor operation, this channel is typically\
    \ smaller than the electron and ion heat-flux contributions; in deeply detached\
    \ regimes, where volumetric recombination is strong and plasma recedes from the\
    \ target, the neutral component can grow substantially as energy is transported\
    \ to the surface via neutral atom and molecule flux rather than direct plasma\
    \ contact. The process-specific subset due to recombination is given by [neutral\
    \ power of divertor due to recombination](name:neutral_power_of_divertor_due_to_recombination),\
    \ while [neutral power at divertor target](name:neutral_power_at_divertor_target)\
    \ provides the same physical quantity resolved for an individual target. The electric-current\
    \ component of the divertor heat load is separately captured by [power of divertor].\
    \ This quantity is computed from edge-plasma transport modeling or inferred by\
    \ decomposing calorimetric measurements of total target heat load into species-resolved\
    \ channels.\n\nSign convention: Positive when net power is directed from the neutral\
    \ particles toward the divertor targets."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_of_divertor_due_to_recombination
  - name:neutral_power_at_divertor_target
  arguments:
  - name: power_of_divertor
    operator: neutral
    operator_kind: qualifier
- name: power_of_divertor_due_to_conduction
  kind: scalar
  status: draft
  description: Total thermal power deposited on all divertor targets by parallel conduction
    along magnetic field lines in the scrape-off layer, excluding convective particle
    enthalpy flux, absorbed radiation, recombination, and neutral-particle power channels.
  documentation: "The power of divertor due to conduction is the component of the\
    \ total divertor target heat load attributed to parallel thermal conduction along\
    \ open magnetic field lines in the scrape-off layer and divertor plasma. It isolates\
    \ the conductive channel of the plasma\u2013target power balance from contributions\
    \ by convective particle enthalpy flux, absorbed radiation, recombination, and\
    \ neutral-particle energy deposition, and is the all-target sum corresponding\
    \ to [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction).\n\
    \nThe all-target conducted power is the surface integral of the conductive heat-flux\
    \ density over the wetted divertor target surfaces:\n\n$$\nP_{\\mathrm{div,cond}}\
    \ = \\sum_{t \\in \\mathcal{T}_{\\mathrm{div}}} \\int_{A_t} \\mathbf{q}_{\\mathrm{cond}}\
    \ \\cdot \\hat{\\mathbf{n}}_{\\mathrm{mat}} \\, dA\n$$\n\nwhere $P_{\\mathrm{div,cond}}$\
    \ is the conducted divertor power in W, $\\mathcal{T}_{\\mathrm{div}}$ is the\
    \ set of divertor targets, $A_t$ is the wetted surface area of target $t$, $\\\
    mathbf{q}_{\\mathrm{cond}}$ is the conductive heat-flux density in W m$^{-2}$,\
    \ $\\hat{\\mathbf{n}}_{\\mathrm{mat}}$ is the unit normal directed from the plasma\
    \ into the target material, and $dA$ is the surface-area element. With this normal\
    \ choice, a positive integrand represents conductive heat entering the material.\
    \ In collisional scrape-off-layer conditions the dominant electron contribution\
    \ is commonly modeled by the Spitzer\u2013H\xE4rm closure $q_{\\parallel,e} =\
    \ -\\kappa_0 T_e^{5/2}\\nabla_\\parallel T_e$, where $\\kappa_0 \\approx 2000\\\
    \ \\mathrm{W\\,m^{-1}\\,eV^{-7/2}}$, $T_e$ is the electron temperature in eV,\
    \ and $\\nabla_\\parallel = \\hat{\\mathbf{b}}\\cdot\\nabla$ is the gradient along\
    \ the local magnetic-field unit vector $\\hat{\\mathbf{b}}$; the total conductive\
    \ flux also includes the ion conductive contribution.\n\nThis quantity is obtained\
    \ by integrating conductive estimates of the target heat-flux density over all\
    \ wetted target footprints and summing the targets. In practice it can be inferred\
    \ from two-point or scrape-off-layer power-balance modeling, from infrared thermography\
    \ or calorimetric inversion of target surface temperature measurements combined\
    \ with channel decomposition, and from Langmuir-probe measurements of target plasma\
    \ conditions used to constrain the conductive part of the heat flux. The flux-density\
    \ counterpart is [parallel_heat_flux_at_divertor_target](name:parallel_heat_flux_at_divertor_target);\
    \ together with [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection),\
    \ radiative, recombination, and neutral channels, it contributes to the total\
    \ divertor power exhaust balance.\n\nTypical values range from about $10^5$-$10^6$\
    \ W in small or strongly dissipative divertor plasmas, $10^6$-$10^7$ W in medium-power\
    \ attached operation, and up to several $10^7$ W in high-performance reactor-relevant\
    \ scenarios. The conducted component is generally largest in hot attached conditions\
    \ with steep parallel temperature gradients and is reduced as divertor detachment\
    \ develops, because volumetric radiation, ionization, charge exchange, and recombination\
    \ remove energy before it reaches the targets."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_conduction
  - name:total_lost_power_over_scrape_off_layer
  - name:radiated_power_over_scrape_off_layer
  - name:power_due_to_conduction
  - name:power_at_divertor_target_due_to_convection
  - name:parallel_heat_flux_at_divertor_target
- name: power_of_divertor_due_to_convection
  kind: scalar
  status: draft
  description: Convective power deposited on the divertor targets, summed over targets,
    by charged plasma particles flowing along open magnetic field lines. It includes
    thermal enthalpy and directed kinetic energy carried by incident species into
    the target surfaces.
  documentation: 'Convective divertor power is the all-target sum of energy deposited
    by incident plasma particles rather than by conductive heat flow. It includes
    the thermal enthalpy and directed kinetic energy carried by ions, electrons, and
    other charged species through the sheath to material divertor target surfaces.
    Only energy flux into the material surfaces is included, so this is a non-negative
    deposited-power magnitude rather than a signed surface-normal flux.


    A useful local expression is the surface integral of incident convective energy
    flux over each target:


    $$

    P_{\mathrm{conv}} = \sum_k \int_{A_k} \sum_s \Gamma_{s,k}^{\mathrm{inc}} \left(h_{s,k}
    + \frac{1}{2} m_s u_{\parallel s,k}^2\right)\, dA

    $$


    where $k$ labels divertor targets, $A_k$ is the wetted target area in $\mathrm{m^2}$,
    $s$ labels incident charged species, $\Gamma_{s,k}^{\mathrm{inc}}$ is the particle
    flux density into the target in $\mathrm{m^{-2}\,s^{-1}}$, $h_{s,k}$ is the thermal
    enthalpy per particle in $\mathrm{J}$, $m_s$ is the particle mass in $\mathrm{kg}$,
    and $u_{\parallel s,k}$ is the directed parallel flow speed in $\mathrm{m\,s^{-1}}$.
    The result is in watts.


    In practice this quantity is computed from edge plasma transport and sheath models,
    or inferred from target diagnostics that constrain incident particle fluxes, temperatures,
    and heat loads. It is distinct from conductive target power [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction),
    recombination-related power [plasma_power_of_divertor_due_to_recombination](name:plasma_power_of_divertor_due_to_recombination),
    and radiative deposition; the corresponding single-target quantity is [power_at_divertor_target_due_to_convection](name:power_at_divertor_target_due_to_convection).


    Typical magnitudes are strongly device and regime dependent and are best interpreted
    relative to the total divertor thermal power [thermal_power_of_divertor](name:thermal_power_of_divertor).
    Values may be near 0 W when detachment, radiation, recombination, or weak particle
    flux removes most parallel energy before the target, and may become a substantial
    fraction of the all-target thermal divertor power in attached, particle-flux-dominated
    conditions.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:power_at_divertor_target_due_to_convection
  - name:plasma_power_of_divertor_due_to_recombination
  arguments:
  - name: power_due_to_convection
    operator: divertor
    operator_kind: locus
- name: power_of_divertor_due_to_fusion
  kind: scalar
  status: draft
  description: Nuclear power deposited in the divertor structure through neutron moderation
    and gamma absorption from fusion reactions, distinct from the plasma thermal load
    conducted or convected to divertor surfaces along magnetic field lines.
  documentation: "In a deuterium-tritium burning plasma, fusion reactions generate\
    \ 14.1 MeV neutrons carrying approximately 80% of the 17.6 MeV reaction energy\
    \ per event. These electrically neutral particles stream freely into surrounding\
    \ structures, and the divertor assembly \u2014 comprising plasma-facing targets,\
    \ support structures, and cooling circuits \u2014 absorbs a fraction via elastic\
    \ and inelastic neutron scattering, radiative capture, and secondary gamma emission.\
    \ This nuclear heating contribution is structurally and thermally distinct from\
    \ [thermal_power_of_divertor](name:thermal_power_of_divertor), which quantifies\
    \ the plasma heat exhaust deposited at divertor surfaces by conductive and convective\
    \ transport along open field lines.\n\nThe nuclear power deposited in the divertor\
    \ is the volume integral of the local nuclear heating power density $\\dot{q}_{\\\
    rm nuc}$ over the divertor assembly:\n\n$$\nP_{\\rm nuc,div} = \\int_{V_{\\rm\
    \ div}} \\dot{q}_{\\rm nuc}(\\mathbf{r}) \\, dV\n$$\n\nwhere $\\mathbf{r}$ is\
    \ position within the divertor volume $V_{\\rm div}$, which encompasses all structural\
    \ and plasma-facing components.\n\nBecause neutrons cannot be directly calorimetrically\
    \ resolved from plasma heat loads during operation, this quantity is computed\
    \ via neutron transport calculations using divertor geometry and material nuclear\
    \ cross-section data. It represents a volumetric heat source relevant to divertor\
    \ coolant system design and structural integrity analysis. Analogous nuclear deposition\
    \ integrals for breeding zone components are defined by [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer)\
    \ and [nuclear_heating_power_of_breeder_blanket_shield](name:nuclear_heating_power_of_breeder_blanket_shield);\
    \ this divertor quantity is a sub-component of the total [power_due_to_fusion](name:power_due_to_fusion)."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:thermal_power_of_divertor
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket_shield
  - name:power_due_to_fusion
  arguments:
  - name: power_due_to_fusion
    operator: divertor
    operator_kind: locus
- name: power_of_divertor_due_to_radiation
  kind: scalar
  status: draft
  description: Total net radiative power deposited on the divertor, summed over all
    targets, from photon emission by impurity and hydrogenic species during plasma-wall
    interaction.
  documentation: "The total net radiative power deposited on the divertor is the aggregate\
    \ photon power absorbed across all divertor targets, contributed by line radiation\
    \ from impurity species (carbon, neon, argon, tungsten, and similar) and hydrogenic\
    \ Balmer and Lyman continuum emission. The net value equals the total incident\
    \ radiative flux integrated over all target surfaces minus the fraction reflected\
    \ by the plasma-facing materials, and is summed over all targets in the divertor\
    \ assembly.\n\n$$\nP_{\\mathrm{div,rad}} = \\sum_k \\int_{A_k} \\left(1 - \\rho_k\\\
    right) F_{\\mathrm{rad}}(\\mathbf{x})\\, dA\n$$\n\nwhere $k$ indexes individual\
    \ divertor targets, $A_k$ is the wetted surface area of target $k$, $\\rho_k$\
    \ is the effective surface reflectivity, and $F_{\\mathrm{rad}}$ is the local\
    \ incident radiative power flux density in W m$^{-2}$.\n\nThis aggregate is inferred\
    \ from bolometric tomography using fan-array or tangential bolometers that reconstruct\
    \ the radiated power distribution in the divertor volume, or estimated from integrated\
    \ impurity spectroscopy combined with impurity transport modeling.\n\nIn high-recycling\
    \ attached conditions, radiative losses to the divertor are a modest fraction\
    \ of the power crossing the separatrix; in detached or impurity-seeded regimes\
    \ they can constitute 30\u201380% of the total divertor heat load, substantially\
    \ reducing the conducted and convected channels quantified by [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction)\
    \ and [power_of_divertor_due_to_convection](name:power_of_divertor_due_to_convection).\
    \ The per-target counterpart is power_at_divertor_target_due_to_radiation, and\
    \ the analogous radiation to the main chamber wall is radiated_power_at_wall."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_conduction
  - name:power_of_divertor_due_to_convection
  arguments:
  - name: power_due_to_radiation
    operator: divertor
    operator_kind: locus
- name: power_of_divertor_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on all divertor target surfaces by recombination
    processes, comprising both the plasma-ion and neutral-particle recombination channels
    summed over the full divertor assembly.
  documentation: 'Total divertor recombination power is the combined rate at which
    recombination processes at or near the target surfaces of the divertor assembly
    release energy into the material, integrated over all targets. It is the divertor-surface
    counterpart of the volumetric [power_due_to_recombination](name:power_due_to_recombination)
    and unifies two physically distinct deposition channels:


    $$

    P_\mathrm{rec,div} = P_\mathrm{rec,div}^\mathrm{plasma} + P_\mathrm{rec,div}^\mathrm{neutral}

    $$


    where $P_\mathrm{rec,div}^\mathrm{plasma}$ is [plasma_power_of_divertor_due_to_recombination](name:plasma_power_of_divertor_due_to_recombination),
    the energy deposited when plasma ions recombine or neutralize at the material
    surface, and $P_\mathrm{rec,div}^\mathrm{neutral}$ is [neutral_power_of_divertor_due_to_recombination](name:neutral_power_of_divertor_due_to_recombination),
    the energy carried by neutral particles undergoing recombination reactions at
    the plasma-material interface.


    This quantity is computed in edge-plasma codes that track ion and neutral fluxes
    to the targets and apply sheath-energy coefficients along with recombination cross-sections
    to determine surface deposition. It represents one component of the total divertor
    heat load alongside conducted, convected, and radiative contributions, and becomes
    a more prominent fraction of that load in detached or partially detached divertor
    regimes where volumetric recombination upstream suppresses the ion current reaching
    the targets.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_recombination
  - name:plasma_power_of_divertor_due_to_recombination
  - name:neutral_power_of_divertor_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: divertor
    operator_kind: locus
- name: neutral_power_of_divertor_due_to_recombination
  kind: scalar
  status: draft
  description: Thermal power deposited on divertor targets by recombination reactions
    of neutral particles at the plasma-material interface, summed over all targets.
    It represents the neutral-surface recombination contribution to the total divertor
    heat load.
  documentation: 'Neutral recombination power of the divertor is the heat load delivered
    to divertor target surfaces when neutral particles undergo recombination reactions
    that form more tightly bound neutral species, such as atomic hydrogen isotopes
    forming molecules on a material surface. It is the contribution summed over the
    divertor targets and excludes heat carried by charged particles or photons unless
    that energy is deposited through the neutral recombination process at the target.


    The integrated divertor contribution can be written as a surface integral over
    target areas:


    $$

    P_{\mathrm{rec,n}}^{\mathrm{div}} = \sum_t \int_{A_t} \Gamma_{\mathrm{rec,n}}(\mathbf{x})\,\epsilon_{\mathrm{rec,n}}(\mathbf{x})\,dA

    $$


    where $A_t$ is the surface area of target $t$, $\Gamma_{\mathrm{rec,n}}$ is the
    neutral recombination event rate per unit target area in m$^{-2}$ s$^{-1}$, and
    $\epsilon_{\mathrm{rec,n}}$ is the mean energy deposited at the target per recombination
    event in J. The effective $\epsilon_{\mathrm{rec,n}}$ is reaction-, species-,
    and surface-dependent; it may include chemical binding energy released to the
    surface and kinetic energy accommodated by the material, and is not generally
    equal to an atomic ionization potential.


    In practice this quantity is estimated from a combination of target heat-flux
    measurements, neutral pressure and spectroscopy constraints, particle-balance
    analysis, and neutral transport with plasma-surface interaction modeling. The
    recombination contribution is separated from charged-particle, radiation, and
    other neutral heat-load channels using reaction rates, recycling coefficients,
    surface accommodation assumptions, and measured or reconstructed target conditions.


    Typical integrated values range from near 0-10^4 W in weakly recycling or attached
    divertor conditions to 10^4-10^6 W in strongly recycling or detached conditions
    on present experiments. In larger devices or high-power detached regimes, values
    of 10^6-10^7 W are possible when neutral recycling and surface recombination make
    a substantial contribution to the divertor heat balance.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:plasma_power_of_divertor_due_to_recombination
  - name:power_of_divertor_due_to_recombination
  - name:neutral_power_at_divertor_target_due_to_recombination
  arguments:
  - name: power_of_divertor_due_to_recombination
    operator: neutral
    operator_kind: qualifier
- name: plasma_power_of_divertor_due_to_recombination
  kind: scalar
  status: draft
  description: Power deposited on all divertor target surfaces by recombination or
    neutralization of plasma ions at the material surface. It is the plasma-ion component
    of the total divertor recombination heat load, complementary to the neutral-particle
    recombination contribution.
  documentation: 'Plasma recombination power of a divertor is the rate at which energy
    is deposited on all target surfaces of that divertor by plasma ions that recombine
    or neutralize at the material surface. It describes the plasma-ion recombination
    contribution to the target heat load, distinct from neutral-particle recombination
    and from conductive heat transport to the targets.


    The total divertor recombination heat load is commonly decomposed into plasma-ion
    and neutral-particle contributions:


    $$

    P_{\mathrm{rec,div}} = P_{\mathrm{rec,div}}^{\mathrm{plasma}} + P_{\mathrm{rec,div}}^{\mathrm{neutral}}

    $$


    where $P_{\mathrm{rec,div}}^{\mathrm{plasma}}$ is this quantity and $P_{\mathrm{rec,div}}^{\mathrm{neutral}}$
    is the complementary [neutral recombination contribution](name:neutral_power_of_divertor_due_to_recombination).
    The plasma-ion term can also be obtained by summing the corresponding [target-level
    plasma-ion recombination powers] over all target surfaces belonging to the divertor.


    In practice this power is inferred from divertor power accounting, surface-interaction
    modeling, and measurements such as target calorimetry, infrared thermography,
    Langmuir-probe ion fluxes, spectroscopy, and bolometry. Only energy delivered
    to the material targets by recombination or neutralization of plasma ions is included;
    radiated power, neutral-particle recombination power, and conductive heat-load
    components are accounted for separately.


    Typical values range from 10^3-10^6 W per divertor in many tokamak discharges.
    In strongly detached, high-density divertor conditions the contribution can approach
    10^6-10^7 W, while in attached low-recycling conditions it may be negligible compared
    with conductive and convective target heat loads.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_of_divertor_due_to_recombination
  arguments:
  - name: power_of_divertor_due_to_recombination
    operator: plasma
    operator_kind: qualifier
- name: radial_length_of_divertor_target
  kind: scalar
  status: draft
  description: "Non-negative span of a divertor target's plasma-facing surface projected\
    \ onto the major-radius R direction in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'Radial length of a divertor target is the non-negative geometric
    span of the target''s plasma-facing surface after projection onto the major-radius
    coordinate $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It characterizes
    the target dimension in major radius, not the wetted length along the inclined
    target surface or a distance along magnetic-field lines.


    If $S_t$ denotes the plasma-facing target surface, the projected radial length
    is


    $$

    L_R = \max_{\mathbf{x} \in S_t} R(\mathbf{x}) - \min_{\mathbf{x} \in S_t} R(\mathbf{x})

    $$


    where $R(\mathbf{x})$ is the major-radius coordinate of point $\mathbf{x}$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame. The result is a span $\Delta
    R$, so it is independent of whether the target contour is traversed from inner
    to outer radius or the reverse.


    In practice, $L_R$ is obtained from the divertor target contour or surface geometry
    by selecting the plasma-facing part of the target and taking the difference between
    the largest and smallest $R$ values. For comparison with strike-point quantities,
    the relevant object is the target major-radius interval $[R_{\min}, R_{\max}]$:
    major_inner_radius_of_strike_point and major_outer_radius_of_strike_point are
    coordinates of strike points in the right-handed cylindrical $(R, \phi, Z)$ frame,
    so they can be tested for lying on or near this interval but are not lengths to
    be compared directly with $L_R$.


    Typical radial spans are 0.02-0.2 m for small or narrow target tiles, 0.1-0.5
    m for medium-size tokamak divertor targets, and up to about 1 m in large or strongly
    extended divertor geometries. The value depends on target inclination, cassette
    design, baffling, and whether the full plasma-facing target or only an active
    wetted segment is being characterized.'
  unit: m
  physics_domain: divertor_physics
  links: []
- name: surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: Geometric surface area of the plasma-facing side of one divertor tile.
    It is a per-tile area used to convert integrated heat or particle loads on that
    tile into tile-averaged flux densities.
  documentation: 'Surface area of a divertor tile is the geometric area of the individual
    tile face exposed to the scrape-off-layer plasma and recycling neutrals. It is
    defined per tile, not as an aggregate over a divertor target, cassette, or full
    divertor, and represents the area used when tile-integrated loads are averaged
    over that specific component.


    For a plasma-facing tile surface $S_\mathrm{tile}$, the area is


    $$

    A_\mathrm{tile} = \int_{S_\mathrm{tile}} dA

    $$


    where $A_\mathrm{tile}$ is the tile surface area and $dA$ is the differential
    element of the actual exposed surface, including geometric shaping, bevels, or
    curvature when they are part of the plasma-facing face.


    The value is normally obtained from engineering geometry, metrology, or a surface
    mesh of the divertor component. It can be used with an integrated power or particle
    load on the same tile, for example as $q_\mathrm{tile}=P_\mathrm{tile}/A_\mathrm{tile}$,
    to form a tile-averaged heat flux density.


    Typical divertor-tile surface areas are about $10^{-3}$-$10^{-1}$ m^2, depending
    on tile size, segmentation, strike-point region coverage, and whether detailed
    shaped features are included.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:wetted_area_of_divertor_target
  - name:wetted_area_of_divertor
  sources:
  - id: dd:divertors/divertor/target/tile/surface_area
    dd_path: divertors/divertor/target/tile/surface_area
    status: attached
- name: temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Thermal energy per particle of a plasma species in the region immediately
    adjacent to a divertor target, evaluated at the sheath entrance where the Bohm
    criterion governs the minimum ion flow velocity.
  documentation: 'Temperature at the divertor target characterizes the kinetic energy
    scale of a plasma species in the narrow plasma layer immediately adjacent to the
    target surface, evaluated at the sheath entrance where ions must satisfy the Bohm
    condition. This parent quantity abstracts over the species-specific realizations:
    the electron and ion populations generally carry distinct temperatures and must
    be treated separately in two-temperature divertor plasma models.


    The electron and ion channels differ in how they acquire and exchange energy along
    the scrape-off layer. [Electron temperature at the divertor target](name:electron_temperature_at_divertor_target)
    quantifies the energy scale of the electron velocity distribution at the sheath
    edge, while [ion temperature at the divertor target](name:ion_temperature_at_divertor_target)
    represents the mean ion thermal energy averaged over species. Equality of the
    two temperatures requires sufficient collisional energy exchange; departures scale
    with the electron-ion equilibration time $\tau_{ei}^E \propto T_e^{3/2} / (n_e
    \ln\Lambda)$, where $n_e$ is the electron density and $\ln\Lambda$ is the Coulomb
    logarithm. The local [electron density at the divertor target](name:electron_density_at_divertor_target)
    therefore directly controls the degree of inter-species equilibration.


    Electron temperatures at the target are inferred from Langmuir probe current-voltage
    characteristics; ion temperatures are obtained from spectroscopic line-ratio analysis
    or charge-exchange recombination spectroscopy. In attached high-recycling divertor
    conditions, target electron temperatures typically fall in the range 10-50 eV;
    partial or full plasma detachment reduces them below about 5 eV. Ion temperatures
    can exceed electron temperatures in low-collisionality regimes.


    Sign convention: Positive when the plasma species carries finite thermal energy,
    a condition satisfied by all non-zero-temperature plasma states encountered in
    tokamak operation.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:ion_temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: derived:temperature_at_divertor_target
    status: composed
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Kinetic temperature of the electron population in the plasma immediately
    adjacent to a divertor target surface, typically evaluated at the sheath entrance.
    It represents the downstream scrape-off-layer electron energy scale at the target,
    distinct from upstream midplane or generic wall temperatures.
  documentation: 'Electron temperature at the divertor target is the kinetic temperature
    characterizing the electron energy distribution in the plasma immediately next
    to the divertor target surface, usually interpreted at the sheath entrance rather
    than inside the material or deep within the sheath. It is the downstream scrape-off-layer
    electron temperature where field-aligned plasma exhaust reaches the divertor plate;
    this distinguishes it from [electron_temperature_at_midplane](name:electron_temperature_at_midplane),
    which refers to an upstream location, and from [electron_temperature_at_wall](name:electron_temperature_at_wall),
    which is not specific to a divertor target.


    For an isotropic Maxwellian electron distribution, the electron temperature in
    eV is related to the mean random kinetic energy per electron by


    $$

    \langle E_e \rangle = \frac{3}{2}\, e\, T_e

    $$


    where $\langle E_e \rangle$ is the mean random kinetic energy in joules, $e$ is
    the elementary charge, and $T_e$ is the electron temperature in eV. Equivalently,
    if the mean kinetic energy is expressed in eV, $\langle E_e \rangle_\mathrm{eV}
    = 3T_e/2$.


    In practice this quantity is obtained from local divertor measurements such as
    target Langmuir probe current-voltage characteristics, divertor Thomson scattering,
    or spectroscopic inference, and may also be estimated from scrape-off-layer transport
    or two-point modeling constrained by upstream and target conditions. It is commonly
    interpreted together with [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    and [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target)
    when assessing sheath heat transmission, recycling, and divertor detachment state.
    In strongly non-Maxwellian or rapidly varying conditions, the reported value may
    represent a diagnostic- or model-dependent effective electron temperature.


    Typical values are about 10-100 eV in attached divertor conditions, 2-10 eV in
    high-recycling regimes, and 0.5-5 eV in detached or strongly cooled divertor plasma.
    Values below 1 eV can occur in deeply detached recombining plasmas, while transient
    or weakly cooled target conditions can exceed 100 eV.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:ion_temperature_at_divertor_target
  arguments:
  - name: temperature_at_divertor_target
    operator: electron
    operator_kind: qualifier
- name: ion_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Thermal energy per particle of the ion population at the divertor target
    surface, averaged over ion species and evaluated at the sheath entrance where
    the Bohm condition applies.
  documentation: 'Ion temperature at the divertor target is the temperature-equivalent
    mean thermal energy per ion for ions reaching the divertor target surface. The
    quantity is conventionally evaluated at the plasma side of the sheath, before
    sheath acceleration converts ion thermal and directed energy into impact energy
    at the material surface.


    For multiple ion species or charge states, the averaged value is the ion-density-weighted
    temperature at the sheath entrance:


    $$

    T_i = \frac{\sum_s n_s T_{i,s}}{\sum_s n_s}

    $$


    where $T_{i,s}$ is the temperature of ion species or charge state $s$ in eV, $n_s$
    is its number density in m^-3, and the denominator is the local total ion density.
    This weighting represents the mean ion thermal energy per ion in the local plasma
    population, not a particle-flux-weighted target impact average.


    Direct measurement is difficult and is commonly inferred from divertor spectroscopy,
    retarding-field or probe measurements where sheath models are applicable, or edge-plasma
    modeling constrained by target density, electron temperature, particle flux, and
    heat-flux measurements. For context, in a single-effective-ion sheath estimate
    the ion heat flux is often approximated by $q_i \simeq \gamma_i e n_i c_s T_i$,
    where $q_i$ is in W m^-2, $\gamma_i$ is a dimensionless ion sheath heat-transmission
    coefficient, $e$ is the elementary charge converting eV to joules, $n_i$ is the
    total ion density in m^-3, $T_i$ is this ion temperature in eV, and $c_s \simeq
    \sqrt{e(T_e+T_i)/m_i}$ for singly charged ions when $T_e$ and $T_i$ are in eV
    and $m_i$ is in kg.


    Typical values are 0.5-5 eV in cold detached or strongly recombining divertors,
    5-30 eV in partially detached or attached conditions, and up to 30-100 eV at hot
    attached targets with strong parallel heat flux.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  arguments:
  - name: temperature_at_divertor_target
    operator: ion
    operator_kind: qualifier
- name: total_ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of the total ion population at the divertor target,
    summed over all ionic species and charge states present in the local plasma.
  documentation: "The total ion number density at the divertor target is the sum of\
    \ all positive-ion contributions \u2014 fuel ions (hydrogen isotopes), helium\
    \ ash, and seeded or intrinsic impurities \u2014 evaluated locally at the plasma-facing\
    \ divertor surface. It characterizes the aggregate ion particle concentration\
    \ in the sheath-entrance region and governs plasma\u2013surface interaction processes\
    \ including sputtering, recycling, and heat load.\n\nThe total ion density $n_{i,\\\
    mathrm{total}}$ is defined as:\n\n$$\nn_{i,\\mathrm{total}} = \\sum_{s} n_{i,s}\n\
    $$\n\nwhere $s$ indexes all ion species and charge states present at the target.\
    \ By quasi-neutrality, $n_{i,\\mathrm{total}}$ closely approximates the [electron\
    \ density at the divertor target](name:electron_density_at_divertor_target), with\
    \ deviations scaling with the mean effective charge of the impurity mixture.\n\
    \nThis quantity is measured via Langmuir probe saturation-current analysis at\
    \ the divertor surface, or derived from edge-transport modeling constrained by\
    \ spectroscopic observations. In attached and high-recycling regimes, typical\
    \ values range from $10^{19}$ to $10^{21}$ m$^{-3}$, rising toward the upper end\
    \ near detachment onset. Species-resolved contributions are available from [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target),\
    \ [neon_density_at_divertor_target](name:neon_density_at_divertor_target), and\
    \ [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).\n\
    \nSign convention: Positive when ions are present at the divertor target surface."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:neon_density_at_divertor_target
  - name:carbon_density_at_divertor_target
- name: total_ion_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Total power deposited on the inner divertor target by incident ions,
    summed over all ion species and charge states and integrated over the wetted target
    surface. It is the ion contribution to the inner-target heat load.
  documentation: 'Total ion power at the inner divertor target is the surface-integrated
    rate at which incident ions deposit energy on the inner divertor target. It includes
    contributions from all ion species and charge states that strike the target and
    is distinct from electron heat deposition and current-driven electrical power
    deposition.


    A local incident ion energy flux density integrated over the inner target defines
    the total power:


    $$

    P_{\mathrm{ion,inner}} = \sum_{s,q} \int_{A_{\mathrm{inner}}} \Gamma_{s,q}^{\mathrm{in}}(\mathbf{x})\,\bar{E}_{s,q}^{\mathrm{in}}(\mathbf{x})\,dA

    $$


    where $A_{\mathrm{inner}}$ is the wetted inner divertor target area, $\Gamma_{s,q}^{\mathrm{in}}$
    is the incident normal ion particle flux density for species $s$ and charge state
    $q$ in m$^{-2}$ s$^{-1}$, $\bar{E}_{s,q}^{\mathrm{in}}$ is the mean energy delivered
    per incident ion in J, and $dA$ is a surface element in m$^2$. The product $\Gamma_{s,q}^{\mathrm{in}}\bar{E}_{s,q}^{\mathrm{in}}$
    is the local ion power flux density in W m$^{-2}$.


    In modeling, this quantity is computed by summing ion energy fluxes to the inner
    target and integrating over the wetted surface. Experimentally it can be constrained
    by combining target particle-flux measurements, such as Langmuir-probe ion saturation
    current interpreted with local plasma conditions, with calorimetry or infrared
    thermography; separating ion and electron channels generally requires sheath or
    edge-plasma modeling.


    Representative magnitudes are highly scenario dependent: about $10^3$-$10^5$ W
    in low-power or strongly detached conditions, $10^5$-$10^7$ W in attached high-power
    operation on present devices, and above $10^7$ W in reactor-scale studies without
    strong radiative or detachment mitigation. The [maximum_power_at_inner_divertor_target](name:maximum_power_at_inner_divertor_target)
    describes the corresponding peak local heat-load measure, total_electron_power_at_inner_divertor_target
    is the electron-channel counterpart, power_of_divertor refers to current-related
    power deposited on divertor targets, and [current_of_divertor](name:current_of_divertor)
    is related through the charged-particle flux reaching the targets.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:maximum_power_at_inner_divertor_target
  - name:current_of_divertor
- name: total_particle_flux_of_divertor_due_to_recycling
  kind: scalar
  status: draft
  description: Global rate at which particles are introduced into the plasma by recycling
    at all divertor targets, including neutral re-emission, molecular release, and
    ion reflection.
  documentation: 'Total divertor recycled particle flux is the whole-divertor particle-number
    source rate produced when particles incident on divertor targets are returned
    toward the plasma after surface interaction. It includes neutral re-emission,
    molecular release, and ion reflection from all divertor targets, expressed on
    a common particle-count basis for the species balance.


    The total rate can be written as the surface integral of the recycled flux density
    over the target surfaces:


    $$

    \Phi_\mathrm{rec}^\mathrm{div} = \sum_t \int_{S_t} \Gamma_\mathrm{rec}(\mathbf{r})
    \, dA

    $$


    where $S_t$ is the material surface of divertor target $t$, $dA$ is the surface
    area element, and $\Gamma_\mathrm{rec}$ is the local recycled particle flux density
    normal to the surface, in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$. Molecular, atomic,
    neutral, and ionic channels should be reduced to the same particle inventory before
    summation; the result is a particle-number rate, not an energy or power flux.


    In practice, this rate is inferred from a combination of target particle-flux
    measurements, divertor spectroscopy, neutral pressure measurements, pump-throughput
    and gas-balance constraints, and edge plasma/neutral transport modeling. It is
    the divertor-target recycling counterpart of the more general [surface-emission
    source rate], while associated energy channels are described separately by quantities
    such as [plasma power due to recombination](name:plasma_power_of_divertor_due_to_recombination)
    and [neutral power due to recombination](name:neutral_power_of_divertor_due_to_recombination).


    Typical values are strongly device- and scenario-dependent because the rate scales
    with incident target particle flux, recycling probability, detached or attached
    divertor state, and total wetted target area. As order-of-magnitude guidance for
    tokamak divertor analyzes, whole-divertor recycling rates commonly span about
    $10^{21}$-$10^{25}$ s^-1, with lower values in smaller or lower-density plasmas
    and upper-end values in high-density, strongly recycling divertor conditions.


    Sign convention: Positive when the local recycled particle flux density is directed
    from the divertor target material surface toward the plasma.'
  unit: s^-1
  physics_domain: divertor_physics
  links:
  - name:plasma_power_of_divertor_due_to_recombination
  - name:neutral_power_of_divertor_due_to_recombination
- name: tritium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tritium ions in the scrape-off-layer plasma immediately
    upstream of a divertor target surface.
  documentation: 'Tritium density at a divertor target is the local number density
    of ionized atomic tritium in the scrape-off-layer plasma immediately upstream
    of a material target surface. It excludes neutral tritium atoms and molecules,
    and is a species-resolved component of the local total ion density at the target.


    The local density is the tritium-ion particle count per plasma volume in the infinitesimal-volume
    limit:


    $$

    n_T(\mathbf{x}_t) = \lim_{\Delta V \to 0} \frac{\Delta N_T^{\mathrm{ion}}}{\Delta
    V}

    $$


    where $n_T$ is the tritium ion number density in m^-3, $\mathbf{x}_t$ denotes
    a point in the plasma immediately adjacent to the target, $\Delta V$ is a small
    plasma volume around that point, and $\Delta N_T^{\mathrm{ion}}$ is the number
    of tritium ions in that volume.


    In practice this quantity is inferred from isotope-resolved boundary-plasma analysis,
    particle-balance modeling, or diagnostics constrained by local electron and ion
    density measurements when tritium-sensitive measurements are available. It is
    the divertor-target counterpart of [tritium_density_at_plasma_boundary](name:tritium_density_at_plasma_boundary)
    and [tritium_density_at_limiter](name:tritium_density_at_limiter), and it relates
    to the local fuel mixture through ratios such as $n_T/n_i$, where $n_i$ is the
    total ion density.


    The physically allowed range is $0 \le n_T \le n_i$ when $n_i$ includes all local
    ion species. A tritium-free plasma has $n_T = 0$ m^-3; in a tritium-rich edge
    plasma the value is set by the local fuel-ion density and tritium fraction, for
    example $n_T \simeq f_T n_i$ when $f_T$ denotes the tritium ion fraction.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:tritium_density_at_plasma_boundary
  - name:deuterium_density_at_divertor_target
  - name:helium_4_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: tritium
    operator_kind: qualifier
- name: tungsten_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tungsten ions at the divertor target, summed over
    all ionization stages and excluding neutral tungsten atoms.
  documentation: 'Tungsten (atomic number $Z = 74$) is the primary plasma-facing material
    in the divertor regions of present-day and next-generation fusion devices, where
    ion bombardment causes physical sputtering and releases tungsten atoms that rapidly
    ionize in the scrape-off-layer plasma. The tungsten ion number density at the
    divertor target quantifies the total local concentration of tungsten ions per
    unit volume in the plasma immediately adjacent to the strike-zone surface, and
    is a key component of the broader [density_at_divertor_target](name:density_at_divertor_target)
    species set.


    When charge states are not individually resolved, this quantity represents the
    sum over all ionization stages:


    $$

    n_W = \sum_{q=1}^{74} n_{W^{q+}}

    $$


    where $n_{W^{q+}}$ is the number density of tungsten ions in charge state $q$
    at the target location. Neutral tungsten atoms are excluded from this sum.


    This quantity is inferred from optical emission spectroscopy of tungsten line
    radiation, charge-exchange recombination spectroscopy, or impurity transport codes
    constrained by global particle balance. It characterizes the local impurity source
    strength at the plasma-material interface and is a key input for assessing core
    contamination risk, since tungsten fractional concentrations above approximately
    $10^{-5}$ relative to the electron density can produce intolerable radiated power
    losses in the confined plasma. The boundary impurity content reaching the separatrix
    is tracked separately by [tungsten_density_at_plasma_boundary](name:tungsten_density_at_plasma_boundary).
    Co-seeded impurity densities at the same location, such as [nitrogen_density_at_divertor_target](name:nitrogen_density_at_divertor_target)
    and argon_density_at_divertor_target, are routinely compared with this quantity
    in divertor detachment control studies.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:tungsten_density_at_plasma_boundary
  - name:nitrogen_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: tungsten
    operator_kind: qualifier
- name: vertical_length_of_divertor_target
  kind: scalar
  status: draft
  description: "Non-negative vertical projection of the divertor target surface in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, equal to the difference between\
    \ the largest and smallest Z coordinate on the target."
  documentation: 'Vertical length of a divertor target is the non-negative geometric
    extent of the target surface projected onto the vertical $Z$ direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It is a projected height, not the
    arc length along a tilted or curved target surface.


    For a target surface $S_\mathrm{t}$ with vertical coordinate $Z(\mathbf{x})$,
    the projected vertical length is defined by the range of $Z$ over that surface:


    $$

    L_Z = \max_{\mathbf{x} \in S_\mathrm{t}} Z(\mathbf{x}) - \min_{\mathbf{x} \in
    S_\mathrm{t}} Z(\mathbf{x})

    $$


    where $\mathbf{x}$ denotes points on the plasma-facing target surface and $Z$
    is vertical height in the right-handed cylindrical $(R, \phi, Z)$ frame. If the
    target is represented only by two bounding endpoints and the intervening surface
    is monotonic in $Z$, this reduces to $L_Z = |Z_2 - Z_1|$.


    In practice, this quantity is computed from the surveyed or designed divertor
    target geometry by identifying the operational target surface and taking the maximum
    and minimum vertical coordinates over its bounded extent. It is used to characterize
    how much vertical space the target occupies independently of its radial projection
    or its surface length.


    Typical values range from about 0.05-1 m for compact to medium divertor targets,
    and can be larger in large devices or vertically extended divertor configurations.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:radial_length_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
- name: vertical_outline_of_divertor_tile
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the surface outline defining the geometric
    boundary of an individual divertor tile in the poloidal cross-section.
  documentation: 'The vertical height component of each point defining the surface
    outline of a divertor tile within the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius from the toroidal symmetry axis and $Z$ is
    the vertical coordinate measured from the machine midplane. Paired with the corresponding
    radial outline coordinate, this quantity fully specifies the cross-sectional geometry
    of the tile surface in any toroidally axisymmetric representation, enabling computation
    of wetted surface area, heat-load distribution, and geometric shadowing between
    adjacent plasma-facing components.


    Divertor tile outlines are obtained from engineering or CAD specifications of
    the first-wall assembly. The geometric boundary of the tile determines which surface
    elements intercept the scrape-off-layer heat flux in the vicinity of the magnetic
    strike-point. The outline is also used in optical and infrared camera line-of-sight
    calculations to monitor tile erosion and thermal response. For the analogous geometry
    of limiter tiles, see [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile);
    for the vacuum vessel boundary, see [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel).
    The center-point location of the divertor target surface is given by [vertical_coordinate_of_divertor_target](name:z_coordinate_of_divertor_target),
    which captures a single reference point rather than a full outline contour.


    Sign convention: Positive when the outline point is located above the machine
    midplane, in the direction of increasing $Z$.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:z_coordinate_of_divertor_target
- name: wetted_area_of_divertor_target
  kind: scalar
  status: draft
  description: Surface area of one divertor target over which the deposited heat-flux
    density is at least one e-folding below its peak on that target. It is a non-negative
    per-target footprint area; wetted_area_of_divertor is the sum over all target
    surfaces.
  documentation: 'The wetted area of a divertor target is the actual plasma-facing
    surface area on one target plate that receives the main heat-flux footprint, using
    a threshold one e-folding below the peak deposited heat-flux density on that same
    target. It is a non-negative scalar surface measure, not an oriented area. The
    corresponding all-target quantity is the sum over target surfaces, as in [wetted_area_of_divertor](name:wetted_area_of_divertor_target).


    A general definition is the surface integral over the parts of the target where
    the deposited target-surface heat-flux density exceeds the threshold:


    $$

    A_w = \int_{\mathcal{S}_t} H\!\left(q_t(\mathbf{x}) - \frac{q_{t,\max}}{e}\right)\,
    dA

    $$


    where $\mathcal{S}_t$ is the actual target surface, $dA$ is an element of actual
    surface area, $q_t(\mathbf{x})$ is the deposited heat-flux density crossing into
    the target surface in W m^-2, $q_{t,\max}$ is its maximum on that target, and
    $H$ is the Heaviside step function. The threshold is applied to deposited target-surface
    heat-flux density, not directly to parallel heat flux; if [parallel_heat_flux_at_divertor_target](name:parallel_heat_flux_at_divertor_target)
    is measured or modeled first, it is converted to deposited surface load using
    the local field-line incidence before selecting the footprint.


    In practice, the footprint is inferred from infrared thermography, calorimetry,
    embedded temperature sensors, or heat-transport modeling combined with magnetic
    equilibrium reconstruction and target geometry. For an axisymmetric annular footprint,
    a common estimate is $A_w \simeq 2\pi R_t w_t$, with $w_t \simeq (\lambda_q f_x
    + S)/\sin\alpha$; here $R_t$ is the strike-point major radius in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height, $\lambda_q$ and $S$ are lengths in meters,
    $f_x$ is dimensionless flux expansion, and $\alpha$ is the angle between the magnetic-field
    line and the target surface, so $\alpha=90^\circ$ corresponds to normal incidence
    and smaller $\alpha$ gives a larger projected footprint. This estimate assumes
    toroidal symmetry, a slowly varying footprint around the circumference, and nearly
    constant incidence over the selected region; the surface integral is the defining
    quantity.


    Typical per-target values range from about 0.01-0.3 m^2 in compact and medium-sized
    tokamaks, 0.1-1 m^2 in larger present devices, and several m^2 in large or deliberately
    broadened divertor scenarios. The value increases with strike-point circumference,
    flux expansion, cross-field heat spreading, surface roughness or shaping that
    increases actual area, and more grazing incidence as defined above. It provides
    the area scale that connects the spatial footprint to quantities such as [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target),
    without assuming a uniform heat-flux distribution.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:parallel_heat_flux_at_divertor_target
  - name:peak_power_density_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/wetted_area
    dd_path: divertors/divertor/target/wetted_area
    status: attached
- name: xenon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Xenon ion number density in the plasma immediately adjacent to a divertor
    target, summed over all ionized charge states of elemental xenon and excluding
    neutral xenon atoms.
  documentation: 'Xenon density at a divertor target is the local number density of
    ionized elemental xenon in the boundary plasma next to the target surface. It
    represents the total population of xenon ions, independent of charge state, and
    does not include neutral xenon atoms.


    When charge-state-resolved densities are available, the elemental xenon ion density
    is the charge-state sum:


    $$

    n_{\mathrm{Xe,ion}} = \sum_{q=1}^{54} n_{\mathrm{Xe}^{q+}}

    $$


    where $n_{\mathrm{Xe,ion}}$ is the total ionized xenon number density at the divertor
    target in $m^{-3}$, $n_{\mathrm{Xe}^{q+}}$ is the number density in xenon charge
    state $q+$ in $m^{-3}$, and the sum excludes the neutral state $q=0$.


    In practice this quantity may be obtained by summing modeled charge-state populations,
    by interpreting xenon line emission with atomic collisional-radiative data, or
    from boundary-plasma impurity transport calculations constrained by local diagnostics.
    It is used to quantify xenon seeding and impurity accumulation near plasma-facing
    divertor surfaces, where xenon affects radiative cooling and local power balance.


    A device-independent numerical range is not intrinsic to the definition. The value
    is 0 m^-3 when no ionized xenon is present and, in xenon-seeded divertor plasmas,
    is an experiment-dependent trace-impurity density that can vary by orders of magnitude
    with seeding rate, divertor temperature, ionization balance, and plasma detachment
    state.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:argon_density_at_divertor_target
  - name:neon_density_at_divertor_target
  - name:density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: xenon
    operator_kind: qualifier
- name: peak_power_density_at_wall
  kind: scalar
  status: draft
  description: Spatial maximum of the power flux density deposited across all plasma-facing
    wall surfaces, representing the most severe local thermal load on any wall component
    of the device.
  documentation: "The peak power density at the wall is the spatial maximum of the\
    \ total incident power flux density over all plasma-facing wall surfaces \u2014\
    \ encompassing first-wall panels, divertor targets, and limiter tiles \u2014 taken\
    \ as a single global extremum. As the device-level worst-case thermal load, it\
    \ sets the primary engineering design limit for plasma-facing component materials\
    \ and machine protection systems.\n\nThe defining relation is the spatial extremum\
    \ of the local surface power flux density $q(\\mathbf{s})$:\n\n$$\nq_\\mathrm{peak}\
    \ = \\max_{\\mathbf{s} \\in \\mathcal{W}} q(\\mathbf{s})\n$$\n\nwhere $\\mathbf{s}$\
    \ denotes position on the full plasma-facing surface set $\\mathcal{W}$ and $q$\
    \ is the local heat flux in W m$^{-2}$. Location-specific equivalents \u2014 [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target),\
    \ [peak_power_density_at_first_wall](name:peak_power_density_at_first_wall), and\
    \ [peak_power_density_at_limiter](name:peak_power_density_at_limiter) \u2014 maximize\
    \ over their respective sub-surfaces; the more general peak_power_density covers\
    \ the same concept without a locus qualifier.\n\nInfrared thermography is the\
    \ primary diagnostic for spatially resolved surface heat flux measurement; the\
    \ local power flux density is reconstructed from the measured surface temperature\
    \ transient via the surface heat conduction equation, with emissivity calibration\
    \ accounting for material surface properties. Embedded thermocouples and calorimetric\
    \ tiles provide complementary point-wise constraints.\n\nSteady-state peak values\
    \ range from 0.1\u20131 MW m$^{-2}$ on main-chamber first-wall panels and 5\u2013\
    20 MW m$^{-2}$ at attached divertor strike zones; transient events such as edge-localized\
    \ modes and disruptions can drive local peak loading far above these steady-state\
    \ values."
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:peak_power_density_at_divertor_target
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_limiter
  arguments:
  - name: power_density_at_wall
    operator: peak
    operator_kind: qualifier
