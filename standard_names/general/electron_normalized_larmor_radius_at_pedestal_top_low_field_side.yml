name: electron_normalized_larmor_radius_at_pedestal_top_low_field_side
status: draft
cocos_transformation_type: one_like
description: Ratio of the electron Larmor radius to the plasma minor radius, evaluated
  at pedestal-top conditions using the low-field-side magnetic field.
documentation: "The normalized electron Larmor radius $\\rho^*_e = \\rho_e / a$, evaluated\
  \ on the low-field side (LFS), where $\\rho_e = \\sqrt{m_e k_B T_{e,\\mathrm{ped}}}\
  \ / (e B_{\\mathrm{LFS}})$ with $m_e$ the electron mass, $T_{e,\\mathrm{ped}}$ the\
  \ pedestal-top electron temperature (in eV), $e$ the elementary charge, $B_{\\mathrm{LFS}}$\
  \ the total magnetic field on the LFS, and $a$ the plasma minor radius (in m). Due\
  \ to the $1/R$ variation of the toroidal field, $B_{\\mathrm{LFS}} < B_{\\mathrm{HFS}}$,\
  \ so $\\rho^*_{e,\\mathrm{LFS}}$ is the larger of the two midplane evaluations.\
  \ Dimensionless values are typically $10^{-4}$\u2013$10^{-3}$. The LFS evaluation\
  \ is often preferred in pedestal width scaling studies because ballooning-type instabilities\
  \ are most unstable on the LFS. Derived from mtanh or linear pedestal fits of $T_e$\
  \ combined with equilibrium field mapping. See also `electron_normalized_larmor_radius_at_pedestal_top_high_field_side`\
  \ and `electron_temperature_at_pedestal`."
