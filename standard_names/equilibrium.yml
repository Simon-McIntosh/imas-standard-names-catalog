- name: major_radius_of_primary_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the primary X-point, the dominant poloidal-field
    null point defining the separatrix vertex in a diverted tokamak equilibrium.
  documentation: "The primary X-point is the principal null of the poloidal magnetic\
    \ field on the plasma-bounding separatrix, where the poloidal flux gradient $\\\
    nabla\\psi = 0$ and the separatrix forms its characteristic figure-eight topology.\
    \ In single-null divertor configurations this is the sole X-point; in double-null\
    \ configurations it designates the geometrically dominant or actively controlled\
    \ null.\n\nThe major radius $R$ of the primary X-point locates this null in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the distance measured\
    \ outward from the machine toroidal symmetry axis. It directly sets the radial\
    \ entrance of the divertor throat and constrains the magnetic geometry of the\
    \ scrape-off layer. The companion major_radius_of_secondary_x_point locates the\
    \ secondary null in double-null configurations, while [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ gives the radial coordinate of the related divertor tile intersection. The generic\
    \ form [major_radius_of_x_point](name:major_radius_of_x_point) allows indexing\
    \ over multiple X-points when the primary/secondary distinction is not required.\n\
    \nThis coordinate is extracted from equilibrium reconstruction by identifying\
    \ the saddle point of the solved poloidal flux function $\\psi(R, Z)$. Typical\
    \ values scale with device major radius, ranging from approximately 0.5\u2013\
    2.0 m in present-day tokamaks.\n\nSign convention: Positive when $R$ is measured\
    \ radially outward from the toroidal symmetry axis, yielding $R \\geq 0$ by definition\
    \ of the cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:summary/boundary/x_point_main/r
    dd_path: summary/boundary/x_point_main/r
    status: composed
- name: major_radius_of_secondary_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the intersection of the secondary separatrix
    with the divertor target plate in a double-null or snowflake divertor configuration.
  documentation: "The secondary strike point is the location on the divertor target\
    \ plate where the secondary separatrix contacts the material surface. Its major-radius\
    \ coordinate $R$ locates this point in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is the perpendicular distance from the toroidal symmetry\
    \ axis and $Z$ is the vertical height.\n\nIn double-null configurations, two separatrices\
    \ bound separate divertor legs; the secondary separatrix intersects the target\
    \ at a distinct radial location from the primary. Equilibrium reconstruction traces\
    \ the boundary defined by the poloidal flux value $\\psi = \\psi_{\\mathrm{sep,2}}$\
    \ at the secondary X-point until the field line intersects the divertor plate\
    \ geometry, yielding this coordinate. Compare with [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ for the analogous primary separatrix intersection, and major_radius_of_secondary_x_point\
    \ for the corresponding upstream X-point. The full secondary separatrix outline\
    \ in the poloidal plane is characterized by [major_radius_of_secondary_separatrix](name:major_radius_of_secondary_separatrix).\n\
    \nAccurate knowledge of this coordinate is essential for divertor heat load management,\
    \ since the strike point position determines both the wetted area and the power\
    \ flux density reaching the target material. Typical values span roughly 0.3\u2013\
    3 m, depending on tokamak size and divertor geometry.\n\nSign convention: Positive\
    \ when the strike point radius is measured outward from the toroidal symmetry\
    \ axis in the $+R$ direction."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_secondary_separatrix
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    status: composed
- name: major_radius_of_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of an X-point, the poloidal-field null forming
    a separatrix vertex, in the cylindrical (R, phi, Z) frame.
  documentation: 'An X-point is a hyperbolic null of the poloidal magnetic field in
    a toroidally axisymmetric equilibrium, located at a saddle point of the poloidal
    magnetic flux away from the magnetic axis. The quantity $R_X$ is the major-radius
    coordinate of that null in the right-handed cylindrical $(R, \phi, Z)$ system,
    where $R$ is measured outward from the toroidal symmetry axis, $\phi$ is the toroidal
    angle, and $Z$ is vertical height. This is the generic, unqualified X-point radius;
    when a multi-null equilibrium distinguishes nulls by role, use [major_radius_of_primary_x_point](name:major_radius_of_primary_x_point)
    or [major_radius_of_secondary_x_point](name:major_radius_of_x_point).


    The X-point condition is expressed through the relation between poloidal magnetic
    flux and poloidal magnetic field:


    $$

    \mathbf{B}_p(R_X, Z_X) = \frac{1}{2\pi R_X}\nabla\psi(R_X, Z_X) \times \hat{\phi}
    = \mathbf{0}

    $$


    where $\mathbf{B}_p$ is the poloidal magnetic field, $\psi$ is the poloidal magnetic
    flux in webers, $R_X$ and $Z_X$ are the X-point coordinates in meters, and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ system. Since $R_X>0$ for a physical toroidal equilibrium,
    the null condition is equivalent to $\nabla\psi(R_X,Z_X)=\mathbf{0}$; the critical
    point has saddle character rather than the extremum character of the magnetic
    axis.


    In practice, $R_X$ is obtained by locating saddle points of the reconstructed
    poloidal-flux function or, equivalently, nulls of the reconstructed poloidal magnetic
    field in the meridional $(R,Z)$ cross-section of the cylindrical $(R, \phi, Z)$
    system. Magnetic measurements and direct geometric constraints on the X-point
    position can be used to constrain the reconstruction. The separatrix passing through
    the X-point is geometrically related to divertor strike-point coordinates such
    as [major_outer_radius_of_strike_point](name:major_outer_radius_of_strike_point),
    [major_inner_radius_of_strike_point](name:major_inner_radius_of_strike_point),
    and [major_radius_of_secondary_strike_point](name:major_radius_of_secondary_strike_point).


    Typical values are device-geometry dependent rather than universal: $R_X$ is a
    meter-scale coordinate comparable to the machine major radius, from sub-meter
    positions in compact devices to several meters in large tokamaks. The value is
    set by the separatrix geometry, plasma shape, and divertor configuration rather
    than by the X-point definition alone.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_primary_x_point
  - name:major_outer_radius_of_strike_point
  - name:major_inner_radius_of_strike_point
  - name:major_radius_of_secondary_strike_point
  sources:
