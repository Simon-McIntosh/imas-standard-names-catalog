- name: per_toroidal_mode_of_fast_ion_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power per unit volume deposited on the fast (suprathermal)
    ion population from a coherent wave, resolved per toroidal mode number.
  documentation: "The fast ion wave absorbed power density per toroidal mode, $dQ_{\\\
    rm fast,i}/dn_\\phi$, quantifies the local volumetric deposition rate of wave\
    \ energy onto the suprathermal ion population for each toroidal mode number $n_\\\
    phi$. Integrating $dQ_{\\rm fast,i}/dn_\\phi$ over all toroidal mode numbers $n_\\\
    phi$ recovers the total fast ion absorbed power density; further volume integration\
    \ yields [per_toroidal_mode_of_fast_ion_wave_absorbed_power](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power),\
    \ while the cumulative integral inside a flux surface is given by [per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface).\
    \ Fast ions (energies well above the thermal bulk) are accelerated primarily through\
    \ ion cyclotron resonance heating (ICRH) and neutral beam injection; resolving\
    \ the deposition per toroidal mode allows wave-heating codes to track which toroidal\
    \ Fourier harmonics of the launched spectrum dominate fast ion energization. The\
    \ companion quantity for thermal ions is [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density),\
    \ and the analogous fast electron quantity is [per_toroidal_mode_of_fast_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_density).\
    \ Typical magnitudes in ICRH-heated tokamak scenarios are $10^{4}$\u2013$10^{7}$\
    \ W m$^{-3}$ per mode number in the resonance layer, depending on the launched\
    \ power and minority concentration."
  unit: W.m^-3
