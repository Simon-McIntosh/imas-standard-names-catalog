- name: poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling
  kind: scalar
  status: draft
  description: Poloidal magnetic field per unit current coupling matrix from active
    poloidal field coils to poloidal field probe sensors.
  documentation: "Each entry $M^{B}_{ij}$ of this coupling matrix gives the poloidal\
    \ magnetic field $B_{\\mathrm{pol},i}$ sensed at probe $i$ per unit current $I_j$\
    \ flowing in active poloidal field coil $j$, so that $B_{\\mathrm{pol},i} = \\\
    sum_j M^{B}_{ij} I_j$ in the limit of no plasma or passive-structure response.\
    \ The matrix is determined entirely by the geometry of the active coil windings\
    \ and probe locations, and is computed analytically or numerically (e.g., via\
    \ Biot\u2013Savart integration) for a given machine configuration. It forms one\
    \ column of the complete field-response model: the total probe signal is the superposition\
    \ of contributions from active coils (this quantity), passive conducting structures\
    \ (see [passive coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling)),\
    \ plasma current filaments (see [plasma coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling)),\
    \ and equilibrium grid elements (see [grid coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_grid_coupling)).\
    \ The active-coil coupling matrix is used in real-time plasma control and post-shot\
    \ equilibrium reconstruction to subtract the vacuum field contribution, isolating\
    \ the plasma-driven signal. The analogous flux-linked quantity for poloidal flux\
    \ loops is the [mutual inductance of flux loop active coupling](name:mutual_inductance_of_flux_loop_active_coupling),\
    \ which carries the same geometric information but integrated over the loop winding\
    \ rather than evaluated at a point sensor."
  unit: A^-1.T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_grid_coupling
  - name:mutual_inductance_of_flux_loop_active_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/b_field_pol_probes_active
    dd_path: em_coupling/b_field_pol_probes_active
    status: composed
- name: poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_passive_coupling
  kind: scalar
  status: draft
  description: Poloidal magnetic field per unit current coupling matrix from passive
    conducting structures to poloidal field probe sensors, giving the field measured
    at each probe per unit current circulating in each passive loop.
  documentation: "Each element $M^{\\rm pas}_{ij}$ of this coupling matrix gives the\
    \ poloidal magnetic field $\\delta B_{\\rm pol}$ measured at probe $i$ per unit\
    \ current $I_j$ flowing in passive conducting structure $j$, so that $B_{\\rm\
    \ pol,i} = \\sum_j M^{\\rm pas}_{ij} I_j$. Passive conducting structures include\
    \ vacuum vessel segments, stabilizing shells, and other conducting loops that\
    \ are not actively driven but carry induced currents during transient events such\
    \ as disruptions, vertical displacement events, or resistive wall mode evolution.\
    \ This matrix is a key ingredient in equilibrium reconstruction and stability\
    \ analysis: it allows the contribution of induced passive-structure currents to\
    \ the measured probe signals to be separated from the active coil and plasma contributions\
    \ encoded in [active coil coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling)\
    \ and [plasma coupling](name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_plasma_coupling)\
    \ matrices. The elements are computed from the geometry of both the passive structures\
    \ and the probe locations using Biot\u2013Savart integration in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. For an analogous flux-based quantity linking\
    \ passive structures to flux loop diagnostics, see [mutual inductance of flux\
    \ loop passive coupling](name:mutual_inductance_of_flux_loop_passive_coupling)."
  unit: A^-1.T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_magnetic_field_coupling_of_poloidal_magnetic_field_probe_active_coupling
