- name: per_toroidal_mode_electric_field
  kind: vector
  status: active
  description: Local vector electric field phasor resolved into a single toroidal
    Fourier mode, retaining the coherent wave's amplitude, radio-frequency phase,
    and polarization.
  documentation: 'The per-toroidal-mode electric field is the complex vector Fourier
    coefficient of a coherent electromagnetic wave''s electric field, retaining its
    local amplitude, phase, and polarization for one toroidal mode. It is a mode-resolved
    component of the complete [electric field](name:electric_field) vector.


    For the right-handed cylindrical $(R,\phi,Z)$ frame, the coefficient is defined
    by


    $$

    \tilde{\mathbf{E}}_n(R,Z)=\frac{1}{2\pi}\int_0^{2\pi}\tilde{\mathbf{E}}(R,\phi,Z)e^{-in\phi}\,d\phi

    $$


    where $\tilde{\mathbf{E}}_n$ is the per-toroidal-mode coefficient, $\tilde{\mathbf{E}}$
    is the local [wave electric field](name:wave_electric_field) phasor, $n$ is the
    toroidal Fourier mode number, $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. The coefficient includes all vector projections; the [parallel
    per-toroidal-mode electric field](name:parallel_per_toroidal_mode_electric_field)
    is its field-parallel projection, while polarization-resolved quantities provide
    specialized components.


    Sign convention: Positive when a resolved cylindrical component points toward
    increasing $R$, $\phi$, or $Z$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:electric_field
  - name:wave_electric_field
  - name:parallel_per_toroidal_mode_electric_field
  arguments:
  - name: electric_field
    operator: per_toroidal_mode
    operator_kind: qualifier
- name: parallel_per_toroidal_mode_electric_field
  kind: scalar
  status: active
  description: Complex toroidal-mode Fourier coefficient of the wave electric field
    projected along the local equilibrium magnetic-field direction, retaining amplitude
    and radiofrequency phase.
  documentation: 'The per-toroidal-mode parallel wave electric field is the complex
    Fourier phasor obtained by projecting the mode-resolved wave electric-field vector
    onto the local equilibrium magnetic-field direction. It retains the signed parallel
    component and its radiofrequency phase.


    $$

    \tilde{E}_{\parallel,n}=\tilde{\mathbf{E}}_n\cdot\hat{\mathbf{b}},\qquad \hat{\mathbf{b}}=\frac{\mathbf{B}_0}{\lvert\mathbf{B}_0\rvert}

    $$


    Here $n$ is the toroidal Fourier mode number, $\tilde{\mathbf{E}}_n$ is the complex
    vector phasor defined by [per_toroidal_mode_electric_field](name:per_toroidal_mode_electric_field),
    $\mathbf{B}_0$ is the local equilibrium magnetic field, and $\hat{\mathbf{b}}$
    is its unit vector. This complex projection is distinct from the nonnegative modulus
    represented by [parallel_wave_electric_field_amplitude](name:parallel_wave_electric_field_amplitude).


    Sign convention: Positive when the projected electric-field component is directed
    along the local equilibrium magnetic-field unit vector $\hat{\mathbf{b}}$.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
