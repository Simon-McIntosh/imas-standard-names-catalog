- name: nitrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Nitrogen ion number density evaluated at the divertor target.
  documentation: 'Nitrogen ion number density at the divertor target quantifies the
    local concentration of ionized nitrogen in the plasma immediately adjacent to
    the divertor plate surface. Nitrogen is commonly seeded as an impurity into the
    divertor region to enhance radiative power dissipation through atomic line emission,
    promoting plasma detachment and reducing peak heat loads on the target.


    The ion number density $n_\mathrm{N}$ is defined as the zeroth velocity moment
    of the nitrogen ion velocity distribution:


    $$

    n_\mathrm{N} = \int f_\mathrm{N}(\mathbf{v}) \, d^3v

    $$


    where $f_\mathrm{N}(\mathbf{v})$ is the nitrogen ion phase-space distribution
    function and integration is over all velocities $\mathbf{v}$.


    This quantity is inferred from optical spectroscopy of nitrogen line emission
    in the divertor plasma, or from Langmuir probe measurements combined with spectroscopic
    impurity fraction estimates. It is a key parameter for characterizing impurity
    seeding scenarios and controlling plasma detachment. Analogous quantities for
    other seeded impurity species include [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    and [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    this quantity is the nitrogen-specific component of the parent [density_at_divertor_target](name:density_at_divertor_target).


    Sign convention: Positive when nitrogen ions are present at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
