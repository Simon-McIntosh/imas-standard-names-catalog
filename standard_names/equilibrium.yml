- name: poloidal_current_weighted_average_external_magnetic_flux
  kind: scalar
  status: draft
  description: Average poloidal magnetic flux produced by circuits external to the
    plasma (central solenoid, poloidal-field coils, in-vessel coils, passive structures,
    and eddy currents), with the average taken over the plasma poloidal cross-section
    weighted by the local toroidal current density. The plasma self-flux is excluded.
  documentation: 'Poloidal magnetic flux generated by all conductors external to the
    plasma, averaged over the plasma cross-section using the local toroidal current
    density as the weighting function. External sources comprise the central solenoid,
    poloidal-field coils, in-vessel coils, passive conducting structures, and induced
    eddy currents; the flux produced by the plasma current itself is not included.
    The qualifier refers to the poloidal magnetic flux being current-weighted by the
    toroidal current density, not to a poloidal-current weighting.


    For an axisymmetric equilibrium, the average over a poloidal cross-section at
    fixed toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ system
    is defined as the toroidal-current-density-weighted integral of the external flux
    divided by the total plasma current:


    $$

    \langle \psi_\mathrm{ext} \rangle = \frac{\int_{\Omega_p} \psi_\mathrm{ext}(R,Z)\,
    j_\phi(R,Z)\, dR\, dZ}{I_p}

    $$


    where $\Omega_p$ is the plasma poloidal cross-section in the $(R,Z)$ plane, $R$
    is the major radius in meters, $Z$ is the vertical height in meters, $\psi_\mathrm{ext}$
    is the external poloidal magnetic flux in Wb, $j_\phi$ is the toroidal current-density
    component in A m$^{-2}$, and $I_p = \int_{\Omega_p} j_\phi\, dR\, dZ$ is the signed
    total plasma current in A. The quantity is meaningful only when $I_p$ is nonzero.


    In practice it is obtained from an equilibrium reconstruction by evaluating the
    poloidal flux contribution of all external circuits across the plasma cross-section
    and combining it with the reconstructed toroidal current-density distribution.
    It characterizes how externally produced flux links the current-carrying plasma
    region and is used in flux-consumption and loop-voltage analyzes; its time derivative
    is the externally driven contribution to the loop voltage seen by the plasma current
    channel.


    Sign convention: Positive when the external-circuit vertical magnetic field threading
    the horizontal flux disks that define $\psi_\mathrm{ext}$ points in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:current_weighted_average_external_loop_voltage
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/psi_external_average
    dd_path: equilibrium/time_slice/global_quantities/psi_external_average
    status: attached
  - id: dd:pf_active/global_quantities/psi_coils_average
    dd_path: pf_active/global_quantities/psi_coils_average
    status: attached
- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Total magnetic flux threading a horizontal disk centered on the toroidal
    symmetry axis, serving as the canonical radial coordinate for labeling nested
    flux surfaces in axisymmetric plasma equilibria.
  documentation: "The poloidal magnetic flux $\\psi$ is the total magnetic flux threading\
    \ a horizontal disk of major radius $R$, centered on the toroidal symmetry axis\
    \ at height $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame. Because\
    \ $\\psi$ is constant on each nested magnetic-flux surface in an axisymmetric\
    \ equilibrium, it provides the natural radial coordinate for plasma profiles and\
    \ equilibrium analysis, ranging from [the magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ to the last-closed-flux-surface boundary.\n\nThe defining integral is:\n\n$$\n\
    \\psi(R, Z) = \\int_0^R B_Z(R', Z) \\, 2\\pi R' \\, dR'\n$$\n\nwhere $B_Z$ is\
    \ the vertical component of the magnetic field and $R'$ integrates from the symmetry\
    \ axis to major radius $R$. In MHD equilibrium, $\\psi$ satisfies the Grad-Shafranov\
    \ equation and all equilibrium quantities \u2014 plasma pressure $p(\\psi)$ and\
    \ the toroidal-field function $F(\\psi) = R B_\\phi$ \u2014 are functions of $\\\
    psi$ alone. The [gradient of the poloidal flux](name:radial_derivative_of_poloidal_magnetic_flux)\
    \ determines the local poloidal-field strength, and the [time derivative](name:time_derivative_of_poloidal_magnetic_flux)\
    \ is related to the inductive electric field by Faraday's law.\n\nEvaluated at\
    \ specific flux surfaces, $\\psi$ serves as a coordinate label; sampled values\
    \ such as [the pedestal value](name:poloidal_magnetic_flux_at_pedestal) provide\
    \ reference points for normalized flux coordinates. The profile is recovered from\
    \ external magnetic measurements \u2014 flux loop signals, pickup coil voltages,\
    \ and Rogowski-integrated coil currents \u2014 through MHD equilibrium reconstruction,\
    \ supplemented by internal constraints from motional Stark effect polarimetry\
    \ where available.\n\nSign convention: Positive when the net vertical magnetic\
    \ field $B_Z$ threading the horizontal integration disk points in the $+Z$ direction."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:radial_derivative_of_poloidal_magnetic_flux
  - name:time_derivative_of_poloidal_magnetic_flux
