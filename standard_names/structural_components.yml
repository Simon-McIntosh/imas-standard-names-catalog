  - id: dd:cryostat/description_2d/cryostat/unit/annular/resistivity
    dd_path: cryostat/description_2d/cryostat/unit/annular/resistivity
    status: attached
  - id: dd:cryostat/description_2d/cryostat/unit/element/resistivity
    dd_path: cryostat/description_2d/cryostat/unit/element/resistivity
    status: attached
  - id: dd:cryostat/description_2d/thermal_shield/unit/annular/resistivity
    dd_path: cryostat/description_2d/thermal_shield/unit/annular/resistivity
