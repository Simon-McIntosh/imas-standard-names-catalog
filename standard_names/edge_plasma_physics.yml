- name: toroidal_oxygen_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Toroidal component of the oxygen impurity ion fluid velocity at the\
    \ H-mode pedestal reference location, projected along increasing toroidal angle\
    \ \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal oxygen velocity at the pedestal is the toroidal component
    of the oxygen impurity ion fluid velocity evaluated at the edge pedestal reference
    location. In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, it is the projection
    of the oxygen ion flow onto $\hat{\phi}$. It is used to compare impurity rotation
    with main-ion and other impurity rotation at the steep-gradient edge region.


    For an oxygen ion charge state with charge number $Z_\mathrm{O}$, the toroidal
    velocity enters the radial force-balance relation:


    $$

    E_r = \frac{1}{Z_\mathrm{O} e n_\mathrm{O}} \frac{d p_\mathrm{O}}{d r} + v_{\phi,\mathrm{O}}
    B_\theta - v_{\theta,\mathrm{O}} B_\phi

    $$


    where $E_r$ is the radial electric field, $e$ is the elementary charge, $n_\mathrm{O}$
    and $p_\mathrm{O}$ are the oxygen density and pressure, $r$ is a local outward
    radial coordinate across the pedestal, $v_{\phi,\mathrm{O}}$ is the toroidal oxygen
    velocity, $v_{\theta,\mathrm{O}}$ is the poloidal oxygen velocity, and $B_\theta$
    and $B_\phi$ are the poloidal and toroidal magnetic-field components.


    In experiments, this quantity is commonly inferred from Doppler shifts of oxygen
    charge-exchange recombination emission using viewing geometry that resolves the
    toroidal velocity component. It can also be obtained from edge equilibrium or
    transport analysis using measured impurity temperature, density, poloidal rotation,
    magnetic geometry, and radial electric field. Comparisons with [toroidal_deuterium_velocity_at_pedestal](name:toroidal_deuterium_velocity_at_pedestal)
    and [toroidal_nitrogen_velocity_at_pedestal](name:toroidal_nitrogen_velocity_at_pedestal)
    help distinguish main-ion rotation from impurity rotation and species-dependent
    neoclassical effects; comparisons with magnetic-axis and flux-surface-averaged
    oxygen velocities give radial rotation context.


    Typical pedestal oxygen toroidal velocities are a few $10^3$ to $5 \times 10^4$
    m.s^-1 in many tokamak plasmas, and can approach $10^5$ m.s^-1 in strongly torque-driven
    or high-intrinsic-rotation regimes. The magnitude and direction depend on momentum
    input, radial electric field, collisional coupling to main ions, and pedestal
    gradients.


    Sign convention: Positive when the oxygen ion fluid velocity is directed along
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_pedestal
  - name:toroidal_deuterium_velocity_at_pedestal
  - name:toroidal_oxygen_velocity_at_plasma_boundary
- name: toroidal_oxygen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the oxygen impurity ion bulk flow velocity evaluated
    at the plasma boundary (last closed flux surface).
  documentation: 'The toroidal velocity of oxygen impurity ions at the plasma boundary
    quantifies the toroidal momentum carried by the oxygen ion population at the last
    closed flux surface, which separates the magnetically confined plasma from the
    open-field-line scrape-off layer. This local point value is distinct from the
    flux-surface-averaged quantity [toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary),
    which integrates the velocity weighted by the boundary flux-surface geometry.


    The toroidal component $v_\phi$ is the projection of the oxygen bulk flow velocity
    onto the toroidal direction:


    $$

    v_\phi = \mathbf{v}_\mathrm{O} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{O}$ is the oxygen ion bulk flow velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    Oxygen toroidal velocity at the boundary is primarily measured by charge exchange
    recombination spectroscopy (CXRS), exploiting the Doppler shift of oxygen emission
    lines to extract the ion flow velocity component along $\hat{\phi}$. Analogous
    boundary velocities for other impurity species include [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary)
    and [toroidal_neon_velocity_at_plasma_boundary](name:toroidal_neon_velocity_at_plasma_boundary).


    Sign convention: Positive when the oxygen ion flow is directed in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    in the $+\hat{Z}$ direction).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_plasma_boundary
