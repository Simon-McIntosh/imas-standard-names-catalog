- name: poloidal_magnetic_flux_at_minimum_safety_factor
  kind: scalar
  status: active
  description: Poloidal magnetic flux evaluated on the closed flux surface where the
    magnitude of the safety factor is minimized, providing a dimensional label for
    that surface.
  documentation: 'This quantity is the signed poloidal magnetic-flux function evaluated
    on the closed flux surface where the magnitude of the safety factor is smallest.
    It provides a dimensional, non-normalized flux label for that surface.


    The selected value is defined by


    $$

    \psi_{q_{\min}}=\psi(\chi_\ast),\qquad \chi_\ast\in\operatorname*{arg\,min}_{\chi\in\mathcal{D}}|q(\chi)|

    $$


    where $\psi$ is the poloidal magnetic-flux function, $q$ is the safety factor,
    $\chi$ is any monotonic label of the nested closed flux surfaces, and $\mathcal{D}$
    is the selected closed-flux-surface domain. In the right-handed cylindrical $(R,\phi,Z)$
    frame, $\psi(R,Z)=\int_0^R B_Z(R'',Z)\,2\pi R''\,dR''$, where $B_Z$ is the vertical
    magnetic-field component.


    The minimizing surface may be the magnetic axis, an interior surface, or the domain
    boundary. An additive constant in $\psi$ is a gage choice, so only flux differences
    are invariant; its normalized location is given by [normalized poloidal flux coordinate
    at minimum safety factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor).


    Sign convention: Positive when the poloidal magnetic flux through the enclosed
    horizontal disk centered on the toroidal symmetry axis is oriented along $+\hat{Z}$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-psi
    dd_documentation:
      leaf: Minimum q position in poloidal flux
      parent_path: equilibrium/time_slice/global_quantities/q_min
      parent: Minimum q value and position
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: "Poloidal magnetic flux (\u03C8) at the radial location of the\
        \ minimum safety factor (q_min). Provides the flux-surface coordinate label\
        \ for q_min, used in equilibrium analysis and MHD stability assessment."
      kind: llm
- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: active
  description: Poloidal magnetic flux assigned to the last closed magnetic flux surface,
    providing the outer reference for normalized radial flux coordinates.
  documentation: 'The boundary value of the poloidal flux function is the flux label
    of the last closed magnetic flux surface (LCFS), the outermost closed surface
    of the equilibrium. It is constant along the LCFS.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the boundary value is defined
    by


    $$

    \psi_b = \psi(R,Z) \quad \text{for } (R,Z) \in \mathrm{LCFS}

    $$


    where $\psi_b$ is the boundary poloidal magnetic flux, $\psi(R,Z)$ is the axisymmetric
    poloidal flux function, $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height.


    The value provides the outer endpoint for normalized poloidal-flux coordinates,
    together with the magnetic-axis value [poloidal magnetic flux at the magnetic
    axis](name:poloidal_magnetic_flux_at_magnetic_axis); it therefore defines the
    boundary reference used by the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate).


    Sign convention: Positive when the vertical magnetic field through the oriented
    horizontal disk points in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:normalized_poloidal_flux_coordinate
  sources:
  - dd_path: core_profiles/profiles_1d/grid/psi_boundary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-grid-psi_boundary
