name: parallel_component_of_fast_ion_stored_energy
description: Volume-integrated kinetic energy of fast (suprathermal) ions associated
  with motion parallel to the magnetic field.
documentation: 'The parallel fast-ion stored energy $W_{\mathrm{fast},\parallel}$
  (in J) is the integral over the plasma volume of the kinetic energy carried by suprathermal
  ions in the direction parallel to the local magnetic field: $W_{\mathrm{fast},\parallel}
  = \int \frac{1}{2} m_i v_\parallel^2 f_{\mathrm{fast}}\,d^3v\,dV$, where $m_i$ is
  the ion mass, $v_\parallel$ the velocity component along $\mathbf{B}$, and $f_{\mathrm{fast}}$
  the fast-ion distribution function. This quantity is important for assessing anisotropy
  of beam-driven or ICRH-accelerated ion populations; a large parallel-to-perpendicular
  energy ratio signals tangential neutral beam injection or passing-particle-dominated
  distributions. Typical values range from tens of kJ to several hundred kJ in large
  tokamaks. It is inferred from fast-ion diagnostics such as neutron emission spectroscopy,
  fast-ion D-alpha (FIDA), or from Monte Carlo orbit-following codes (e.g., NUBEAM,
  ASCOT). The total fast-ion energy is $W_{\mathrm{fast}} = W_{\mathrm{fast},\parallel}
  + W_{\mathrm{fast},\perp}$. See `perpendicular_component_of_fast_ion_stored_energy`
  for the complementary perpendicular contribution.'
kind: vector_component
unit: J
