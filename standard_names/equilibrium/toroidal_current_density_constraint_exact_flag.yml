name: toroidal_current_density_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the toroidal current density profile
  is treated as exact input (1) or fitted (0) in equilibrium reconstruction.
documentation: "This flag determines whether the toroidal current density $j_\\phi$\
  \ constraint is imposed exactly or included as a soft constraint in the least-squares\
  \ equilibrium fit. When set to 1, the provided $j_\\phi(R, Z)$ profile is taken\
  \ as a hard input, fixing the source term on the right-hand side of the Grad\u2013\
  Shafranov equation $\\Delta^* \\psi = -\\mu_0 R\\,j_\\phi$, where $\\Delta^*$ is\
  \ the toroidal elliptic operator and $\\psi$ the poloidal magnetic flux. When 0,\
  \ $j_\\phi$ is fitted against other measurements such as magnetic probes and MSE\
  \ data. Accurate specification of $j_\\phi$ is critical for MHD stability analysis\
  \ and sawtooth modeling. See related constraint weights and the reconstructed current\
  \ density profile."
validity_domain: ''
constraints: []
