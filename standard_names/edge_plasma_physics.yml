- name: poloidal_neutral_energy_diffusivity
  kind: scalar
  status: active
  description: "Effective poloidal diffusivity for neutral thermal-energy transport,\
    \ relating the diffusive energy flux tangent to constant-\u03C1 surfaces to the\
    \ local poloidal gradient of neutral energy density."
  documentation: 'Poloidal neutral energy diffusivity is the effective diagonal transport
    coefficient for diffusive transport of thermal energy carried by neutral atoms
    and molecules along the poloidal direction.


    In flux coordinates $(\rho,\theta,\phi)$, its defining constitutive relation is


    $$

    q_{n,\theta}^{\mathrm{diff}}=-D_{n,\theta}\frac{\partial u_n}{\partial s_\theta}

    $$


    where $q_{n,\theta}^{\mathrm{diff}}$ is the poloidal diffusive neutral-energy
    flux density, $D_{n,\theta}$ is the poloidal diffusivity, $u_n$ is neutral thermal-energy
    density, and $s_\theta$ is physical arclength along the poloidal tangent at fixed
    $\rho$ and $\phi$. The diffusivity has units of m$^2$ s$^{-1}$, while $s_\theta$
    is measured in m.


    This quantity is the poloidal specialization of [neutral energy diffusivity](name:neutral_energy_diffusivity).
    It aggregates the relevant neutral populations and is distinct from the state-resolved
    [poloidal neutral internal-state energy diffusivity](name:poloidal_neutral_internal_state_energy_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_energy_diffusivity
