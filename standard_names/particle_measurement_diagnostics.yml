      kind: llm
- name: solid_angle_of_neutron_detector
  kind: scalar
  status: active
  description: Geometric acceptance of a neutron detector aperture as viewed from
    a neutron emission point, independent of detector efficiency and material response.
  documentation: "The solid angle is the geometric measure of the aperture\u2019s\
    \ apparent extent from a neutron emission point. It is nonnegative and depends\
    \ only on the aperture geometry, its orientation, and the source-point location;\
    \ detector efficiency and converter response are excluded.\n\nFor a point source,\
    \ the solid angle is defined by\n\n$$\n\\Omega = \\int_A \\frac{\\cos\\theta}{r^2}\\\
    ,dA\n$$\n\nwhere $A$ is the aperture surface, $r$ is the distance from the source\
    \ point to an aperture element, and $\\theta$ is the angle between the aperture\
    \ normal and the line from the source point to that element. For a finite source\
    \ region, the quantity denotes the specified volume average of this point-source\
    \ solid angle; it does not imply weighting by the neutron emission profile. The\
    \ geometric aperture dimensions described by [area of neutron detector](name:area_of_neutron_detector)\
    \ and [radius of neutron detector](name:radius_of_neutron_detector) can determine\
    \ the acceptance but do not include detector efficiency, which is a separate quantity\
    \ described by [efficiency of neutron detector](name:efficiency_of_neutron_detector)."
  unit: sr
  physics_domain: particle_measurement_diagnostics
  links:
  - name:area_of_neutron_detector
  - name:radius_of_neutron_detector
  - name:efficiency_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/field_of_view/solid_angle
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-field_of_view-solid_angle
    dd_documentation:
      leaf: Average solid angle that the detector covers within the voxel
      parent_path: neutron_diagnostic/detector/field_of_view
      parent: Field of view associated to this detector. The field of view is described
        by a voxelized plasma volume. Each voxel, with indexes i_R, i_Z, and i_phi,
        has an associated solid angle scalar and a detector direction vector.
      data_type: FLT_3D
      unit: sr
      coordinates:
