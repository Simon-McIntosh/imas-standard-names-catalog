- name: coulomb_logarithm_at_pedestal_top
  kind: scalar
  status: active
  description: Dimensionless Coulomb logarithm at the H-mode pressure pedestal top,
    expressing the range of impact parameters contributing to cumulative small-angle
    Coulomb scattering.
  documentation: 'The Coulomb logarithm at the H-mode pressure pedestal top is the
    local dimensionless factor that represents the effective range of impact parameters
    contributing to cumulative small-angle Coulomb scattering. It is the pedestal-top
    specialization of the [coulomb logarithm](name:coulomb_logarithm).


    $$

    \ln\Lambda = \ln\left(\frac{b_{\max}}{b_{\min}}\right), \qquad b_{\max} \sim \lambda_D

    $$


    where $\Lambda$ is the impact-parameter ratio, $b_{\max}$ and $b_{\min}$ are the
    maximum and minimum effective impact parameters, respectively, and $\lambda_D$
    is the Debye screening length; these three quantities are lengths. Debye shielding
    limits the long-range contribution, while the short-range limit is set by the
    applicable classical or quantum scattering scale.


    This quantity is evaluated locally at the pressure pedestal top and is not a collision
    frequency, collisionality, or spatially averaged Coulomb logarithm.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:coulomb_logarithm
  arguments:
  - name: coulomb_logarithm
    operator: pedestal_top
    operator_kind: locus
  sources:
