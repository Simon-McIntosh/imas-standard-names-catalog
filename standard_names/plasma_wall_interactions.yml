- name: y_image_up_unit_vector_of_camera
  kind: scalar
  status: active
  description: Y-axis projection of the unit vector defining the image-up orientation
    direction of a camera, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The image-up unit vector of a camera specifies the spatial direction
    in three-dimensional space that corresponds to the upward direction within the
    camera''s image plane, defining the camera''s rotational orientation about its
    optical axis. The Y component gives the projection of this orientation vector
    onto the $\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where
    $\hat{x}$, $\hat{y}$, and $\hat{z}$ are mutually orthogonal basis vectors satisfying
    $\hat{x} \times \hat{y} = \hat{z}$.


    The three Cartesian components of the image-up unit vector satisfy the normalization
    constraint:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    where $u_x$, $u_y$, and $u_z$ are the X, Y, and Z projections respectively, each
    dimensionless and bounded in $[-1, 1]$.


    The image-up direction is perpendicular to the camera''s line-of-sight (optical
    axis) and lies in the image plane; it is determined by the physical mounting orientation
    of the camera on the diagnostic structure. Together with [x_image_up_unit_vector_of_camera](name:x_image_up_unit_vector_of_camera),
    the full image-up orientation can be reconstructed. The value is set at installation
    or calibration time from a survey of the camera geometry in the device coordinate
    frame.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links: []
  sources:
  - dd_path: camera_ir/channel/camera/up/y
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-up-y
