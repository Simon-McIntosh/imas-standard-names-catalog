- name: vertical_coordinate_of_measurement_position
  kind: scalar
  status: active
  description: "Signed vertical coordinate of a diagnostic measurement position in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, referenced to the machine\
    \ midplane."
  documentation: 'The vertical coordinate of a diagnostic measurement position is
    the signed location of that point along the vertical $Z$ direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, whose basis is $(\hat{R}, \hat{\phi}, \hat{Z})$.
    The coordinate origin is the machine midplane.


    $$

    Z_{\rm mp} = \mathbf{r}_{\rm mp} \cdot \hat{Z}

    $$


    where $Z_{\rm mp}$ is the vertical coordinate, $\mathbf{r}_{\rm mp}$ is the position
    vector from the frame origin to the measurement position, and $\hat{Z}$ is the
    vertical unit vector. The associated [poloidal angle of the measurement position](name:poloidal_angle_of_measurement_position)
    specifies angular location in the poloidal cross-section and does not replace
    this signed coordinate.


    This quantity applies to the measurement position itself, not to the geometric
    center of a diagnostic aperture, antenna, or optical element.


    Sign convention: Positive when the position lies above the machine midplane, in
    the direction of increasing $Z$.'
  unit: m
  physics_domain: equilibrium
  links:
