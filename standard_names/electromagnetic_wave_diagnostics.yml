- name: arc_length_along_electron_cyclotron_wave_beam
  kind: scalar
  status: draft
  description: Curvilinear arc length measured along the electron cyclotron wave beam
    or ray path from the antenna to a given point in the plasma.
  documentation: 'The arc length $s$ parameterizes position along the electron cyclotron
    wave beam trajectory as the beam propagates from the antenna through the plasma.
    It is computed by integrating the path element $ds = |d\mathbf{r}/d\tau|\,d\tau$
    along the ray or beam centerline, where $\mathbf{r}(\tau)$ is the ray position
    vector and $\tau$ is the integration parameter. This coordinate is essential for
    expressing beam-tracing results as functions of propagation distance, enabling
    spatial mapping of quantities such as [transverse_half_width_of_electron_cyclotron_wave_beam](name:transverse_half_width_of_electron_cyclotron_wave_beam)
    and [beam_spot_size](name:beam_spot_size) along the ray. Typical arc lengths from
    antenna to the electron cyclotron resonance layer range from fractions of a meter
    to several meters depending on machine size and launch geometry. The quantity
    is distinct from the straight-line chord length: in a refracting magnetized plasma
    the ray curves, so $s$ accumulates curvature corrections relative to the vacuum
    propagation distance. For the companion cumulative path coordinate defined on
    the full beam, see [length](name:length).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:transverse_half_width_of_electron_cyclotron_wave_beam
  - name:beam_spot_size
  - name:length
  constraints: []
  sources:
  - id: dd:ece/channel/beam_tracing/beam/length
    dd_path: ece/channel/beam_tracing/beam/length
    status: composed
- name: first_coordinate_of_aperture_outline
  kind: scalar
  status: draft
  description: First local coordinate (X1) of vertices defining the polygonal boundary
    of a diagnostic aperture in its local (X1, X2) instrument reference frame.
  documentation: 'The aperture outline is represented as a closed polygon whose vertices
    are specified in the local two-dimensional instrument frame $(X1, X2)$, where
    $X1$ and $X2$ are orthogonal axes lying in the plane of the aperture. This quantity
    gives the $X1$ component of each vertex position, with the full outline reconstructed
    by stepping through the ordered vertex sequence. Aperture geometry determines
    the solid angle subtended by each diagnostic channel and directly controls the
    line-of-sight integration weight used in signal inversion; typical aperture dimensions
    range from sub-millimeter to several centimeters depending on the diagnostic type.
    The companion coordinate [second_coordinate_of_aperture_outline](name:second_coordinate_of_aperture_outline)
    provides the $X2$ component of the same vertices, and together they fully define
    the aperture boundary polygon. Analogous outline coordinates for other optical
    elements in the same instrument are given by [first_coordinate_of_detector_outline](name:first_coordinate_of_detector_outline)
    and [first_coordinate_of_filter_window_outline](name:first_coordinate_of_filter_window_outline).


    Sign convention: Positive when the vertex position is displaced in the positive
    $X1$ direction of the local instrument reference frame.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:second_coordinate_of_aperture_outline
  - name:first_coordinate_of_detector_outline
  - name:first_coordinate_of_filter_window_outline
