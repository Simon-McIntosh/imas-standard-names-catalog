      kind: llm
- name: power_due_to_electron_cyclotron_heating
  kind: scalar
  status: active
  description: Net radiofrequency power absorbed by the plasma through electron cyclotron
    heating, with source aggregation determined by scope and excluding launched or
    reflected power.
  documentation: 'Electron-cyclotron heating power is the rate at which electron-cyclotron-range
    electromagnetic waves transfer energy to the plasma, principally through resonant
    electron absorption. It denotes deposited plasma heating power rather than generator,
    launched, transmitted, or reflected power.


    The absorbed power is defined by the volume integral of the local electron-cyclotron
    heating density:


    $$

    P_{\mathrm{EC}} = \int_{V_{\mathrm{plasma}}} Q_{\mathrm{EC}}(\mathbf{x})\,dV

    $$


    where $P_{\mathrm{EC}}$ is the absorbed power, $Q_{\mathrm{EC}}$ is the local
    power-transfer density, $\mathbf{x}$ is position, and $V_{\mathrm{plasma}}$ is
    the plasma volume. Source aggregation is scope-dependent; the [total electron-cyclotron
    heating power](name:total_power_due_to_electron_cyclotron_heating) sums the contributions
    from all electron-cyclotron wave sources. The quantity is non-negative for net
    absorption and is distinct from [electron absorbed wave power](name:electron_absorbed_wave_power)
    when that quantity includes wave absorption without restricting the mechanism
    to electron cyclotron heating.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_electron_cyclotron_heating
  sources:
  - dd_path: summary/heating_current_drive/ec/power/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-ec-power-value
    dd_documentation:
      leaf: Value
