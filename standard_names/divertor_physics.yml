    ref: summary/local/divertor_target/power_flux_peak/value
    version: 4.1.0
  roles:
  - quantity
- name: neon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of neon ions at the divertor target is the local particle
    count per volume at the sheath entrance, summed over Ne1+ through Ne10+ and excluding
    neutral neon.
  documentation: 'Number density of neon ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the neon-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local neon-ion number density is defined by


    $$

    n_{\mathrm{Ne}} = \sum_{q=1}^{10} \frac{dN_{\mathrm{Ne}^{q+}}}{dV}

    $$


    where $n_{\mathrm{Ne}}$ is the neon-ion number density, $N_{\mathrm{Ne}^{q+}}$
    is the number of neon ions in charge state $q+$ within the local plasma volume
    $V$, $V$ is the local plasma volume, and $q$ is the positive integer neon charge-state
    number. The upper limit 10 denotes fully stripped neon.


    This quantity applies to the free neon-ion population immediately adjacent to
    the divertor target on the plasma side of the electrostatic sheath. It is summed
    over all positive neon charge states from Ne1+ through Ne10+, counting each ion
    once; neutral neon atoms are excluded. It is not the density of all ion species
    or the free-electron population represented by [electron_density_at_divertor_target](name:electron_density_at_divertor_target).


    This member specializes [density_at_divertor_target](name:density_at_divertor_target)
    by selecting neon ions while retaining the same target-sheath evaluation locus.
    It is the species-specific counterpart of related quantities such as [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
