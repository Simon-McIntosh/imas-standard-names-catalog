name: tendency_of_diamagnetic_plasma_energy
status: draft
description: Time derivative of the plasma stored energy inferred from the diamagnetic
  measurement, $dW_{\mathrm{dia}}/dt$.
documentation: "The tendency of diamagnetic plasma energy $dW_{\\mathrm{dia}}/dt$\
  \ (in W) quantifies the instantaneous rate of change of the total plasma stored\
  \ energy as deduced from diamagnetic flux measurements. The diamagnetic energy $W_{\\\
  mathrm{dia}}$ is obtained from the perturbation of the toroidal magnetic flux caused\
  \ by the plasma pressure; diamagnetic loops wound around the vacuum vessel detect\
  \ this flux change, and $W_{\\mathrm{dia}} \\propto \\Delta\\Phi_{\\mathrm{tor}}$\
  \ after subtraction of the vacuum field and eddy-current contributions. In the global\
  \ power balance $P_{\\mathrm{heat}} = P_{\\mathrm{rad}} + P_{\\mathrm{loss}} + dW/dt$,\
  \ this quantity supplies the energy storage term when the diamagnetic measurement\
  \ is chosen over the equilibrium (MHD) stored energy. During steady-state H-mode\
  \ operation $dW_{\\mathrm{dia}}/dt \\approx 0$; during L\u2013H transitions, ELMs,\
  \ or disruptions, values of order $\\pm(0.1$\u2013$10)$ MW are typical. Note that\
  \ $W_{\\mathrm{dia}}$ differs from the MHD stored energy $W_{\\mathrm{MHD}}$ when\
  \ pressure anisotropy is significant ($p_\\perp \\neq p_\\parallel$). See also `total_radiated_power`\
  \ and `tendency_of_thermal_plasma_stored_energy` for companion power-balance terms."
