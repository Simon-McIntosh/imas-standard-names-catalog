- name: vertical_coordinate_of_plasma_current_element_outline_point
  kind: scalar
  status: draft
  description: Vertical Z coordinate of a point on the cross-sectional outline contour
    of a plasma current element, measured in meters in the right-handed cylindrical
    (R, phi, Z) frame. Z is positive upward from the machine midplane.
  documentation: "A plasma current element is a discrete filamentary or distributed\
    \ current source used in equilibrium reconstruction to represent the net toroidal\
    \ current distribution within the plasma. Its cross-sectional outline in the poloidal\
    \ plane is parameterized as an ordered sequence of $(R, Z)$ pairs; this quantity\
    \ gives the $Z$ coordinate \u2014 height along the machine symmetry axis \u2014\
    \ for one point in that sequence.\n\nIn the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, $Z$ is oriented vertically upward with $Z = 0$ at the machine midplane\
    \ by convention. Typical values range from roughly $-3\\,\\mathrm{m}$ to $+3\\\
    ,\\mathrm{m}$ for large tokamaks, depending on plasma elongation and vertical\
    \ position.\n\nSign convention: Positive when the point lies above the machine\
    \ midplane in the direction of increasing $Z$.\n\nThe cross-sectional outline\
    \ defines the spatial extent of each current element in the poloidal plane. The\
    \ companion radial coordinate for the same outline point is [major radius of plasma\
    \ current element outline point](name:major_radius_of_plasma_current_element_outline_point).\
    \ For the analogous coordinate on a plasma-facing component outline, see [vertical\
    \ coordinate of plasma-facing component outline point](name:vertical_coordinate_of_plasma_facing_component_outline_point).\
    \ For the generic outline-point vertical coordinate without object qualification,\
    \ see [vertical coordinate of outline point](name:vertical_coordinate_of_outline_point)."
  unit: m
  physics_domain: equilibrium
