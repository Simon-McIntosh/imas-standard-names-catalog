- name: vertical_coordinate_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the geometric center of a soft X-ray detector
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z$ specifies the height of the geometric
    center of a soft X-ray detector in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius, $\phi$ is the toroidal angle, and $Z$ increases
    upward along the machine symmetry axis with $Z = 0$ at the machine midplane.


    Together with the corresponding major-radius position, this coordinate fully determines
    the poloidal location of the detector center, which is required for computing
    line-of-sight geometry and for mapping chord-integrated soft X-ray signals onto
    the poloidal cross-section. The coordinate is obtained from engineering survey
    or CAD documentation of the diagnostic hardware rather than from in-situ plasma
    measurements.


    Detectors distributed at varying $Z$ heights across one or more poloidal viewing
    fans enable Abel inversion or tomographic reconstruction of the soft X-ray emissivity
    distribution. The analogous vertical position coordinates for other diagnostic
    components follow the same geometric convention, as in [vertical_coordinate_of_bolometer](name:vertical_coordinate_of_bolometer)
    and [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture).


    Sign convention: Positive when the detector center is located above the machine
    midplane in the direction of increasing $Z$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_bolometer
