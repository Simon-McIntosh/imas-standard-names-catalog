- name: poloidal_ion_diffusivity
  kind: scalar
  status: active
  description: Diffusion coefficient for total-ion particle transport along the poloidal
    direction in flux coordinates, relating poloidal particle flux to the metric-scaled
    gradient of total ion density.
  documentation: 'The poloidal ion diffusivity quantifies gradient-driven (Fickian)
    transport of the total ion population along the poloidal direction. It is the
    poloidal component of [ion diffusivity](name:ion_diffusivity), expressed as an
    effective scalar in flux coordinates rather than the field-aligned transport described
    by [parallel ion diffusivity](name:parallel_ion_diffusivity).


    The down-gradient poloidal ion particle flux obeys:


    $$

    \Gamma_{i,\theta}^{\mathrm{diff}} = -D_{\theta i}\frac{1}{h_\theta}\frac{\partial
    n_i}{\partial\theta}

    $$


    where $\Gamma_{i,\theta}^{\mathrm{diff}}$ is the poloidal particle flux in m$^{-2}$
    s$^{-1}$, $D_{\theta i}$ is the poloidal ion diffusivity in m$^2$ s$^{-1}$, $n_i$
    is total ion number density in m$^{-3}$, $\theta$ is poloidal angle, and $h_\theta$
    is the poloidal metric scale factor in m.


    The flux coordinates $(\rho,\theta,\phi)$ use $\rho$ as a radial flux label, $\theta$
    as poloidal angle, and $\phi$ as toroidal angle. This coefficient applies to total
    ion particle transport, not species- or charge-state-resolved transport or thermal-energy
    transport such as [poloidal ion energy diffusivity](name:poloidal_ion_energy_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_diffusivity
  - name:parallel_ion_diffusivity
  - name:poloidal_ion_energy_diffusivity
  arguments:
  - name: ion_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
