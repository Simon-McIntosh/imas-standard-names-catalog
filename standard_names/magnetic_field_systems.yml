      parent: Rectangular description of the element
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Vertical full height of the rectangular cross-section of an active
        PF coil element. Defines the vertical dimension of the conductor cross-section
        for electromagnetic and structural modelling.
      kind: llm
  - dd_path: pf_active/coil/geometry/rectangle/height
