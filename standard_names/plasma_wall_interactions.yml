      parent: Beryllium
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Beryllium.
      kind: template
- name: boron_density_at_limiter
  kind: scalar
  status: active
  description: Boron ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral boron atoms.
  documentation: 'Boron density at a limiter is the local number density of boron
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance.


    $$

    n_{\mathrm{B}}(\mathbf{r}_L)=\frac{dN_{\mathrm{B}}}{dV}=\sum_{q=1}^{5}n_{\mathrm{B}^{q+}}(\mathbf{r}_L)

    $$


    where $n_{\mathrm{B}}$ is the boron-ion number density in m$^{-3}$, $N_{\mathrm{B}}$
    is the number of counted boron ions, $V$ is volume in m$^3$, $n_{\mathrm{B}^{q+}}$
    is the density of boron charge state $q$, and $\mathbf{r}_L$ is the limiter-side
    evaluation position in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The sum includes boron ions from B$^{+}$ through fully stripped B$^{5+}$ and excludes
    neutral boron atoms. This is the boron-specific specialization of [density at
    a limiter](name:density_at_limiter); unlike [boron density at the plasma boundary](name:boron_density_at_plasma_boundary),
    it is evaluated specifically at the limiter-side location.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:boron_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
