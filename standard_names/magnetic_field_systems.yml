- name: vertical_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Upward-downward component of the net electromagnetic load on a poloidal-field
    coil, used to assess structural support requirements.
  documentation: 'The vertical force on a poloidal-field coil is the component of
    the net load acting along the $Z$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It is paired
    with the [radial force of a poloidal-field coil](name:radial_force_of_poloidal_field_coil)
    to describe the principal mechanical loads on the coil support structure.


    For an electromagnetic load, the coil force follows the volume integral of the
    Lorentz force density:


    $$

    F_Z = \int_V (\mathbf{J} \times \mathbf{B}) \cdot \hat{Z}\, dV

    $$


    where $F_Z$ is the vertical force, $\mathbf{J}$ is current density, $\mathbf{B}$
    is magnetic field, $\hat{Z}$ is the vertical unit vector, and $V$ is the conducting
    coil volume. The sign and magnitude depend on the [current of the poloidal-field
    coil](name:current_of_poloidal_field_coil), the magnetic field produced by other
    coils and plasma currents, and the coil position given by quantities such as [major
    radius of the poloidal-field coil](name:major_radius_of_poloidal_field_coil) and
    [vertical coordinate of the poloidal-field coil](name:vertical_coordinate_of_poloidal_field_coil).


    This force is computed from magnetostatic or transient electromagnetic models
    and can be checked indirectly using support reactions, strain gages, or load-cell
    measurements on coil supports. Representative values range from $10^4$-$10^7$
    N for medium-size shaping coils and can exceed $10^8$ N for large central-solenoid
    or high-current pulsed coils during rapid current changes or disruption scenarios.


    Sign convention: Positive when the net force on the coil points in the $+Z$ vertical
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
