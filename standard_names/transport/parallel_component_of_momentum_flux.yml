name: parallel_component_of_momentum_flux
status: draft
description: Projection of the momentum flux density tensor onto the magnetic-field-parallel
  direction, combining convective and viscous momentum transport along $\hat{b}$.
documentation: "The parallel momentum flux $\\Pi_{\\parallel}$ (kg\\,m$^{-1}$\\,s$^{-2}$)\
  \ is the component of the momentum flux density tensor along the local magnetic-field\
  \ direction $\\hat{b}$. It includes both the Reynolds stress (convective) contribution\
  \ $m n v_{\\parallel} v_{\\parallel}$ and the viscous stress contribution $-\\eta_{\\\
  parallel} \\nabla_{\\parallel} v_{\\parallel}$, where $m$ is the species mass (kg),\
  \ $n$ is the number density (m$^{-3}$), $v_{\\parallel}$ is the parallel flow velocity\
  \ (m\\,s$^{-1}$), and $\\eta_{\\parallel}$ is the parallel viscosity (kg\\,m$^{-1}$\\\
  ,s$^{-1}$). In the SOL, parallel momentum flux drives plasma flow toward the divertor\
  \ targets and governs the pressure balance between upstream and target; typical\
  \ values are of order $10^{-2}$\u2013$10^{2}$\\,Pa depending on density and temperature.\
  \ Evaluated in edge fluid codes (SOLPS-ITER, SOLEDGE2D) on GGD meshes or 1-D profiles.\
  \ Conservation of parallel momentum is fundamental to the two-point model relating\
  \ upstream and target conditions."
