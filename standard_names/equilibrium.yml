- name: major_radius_of_current_center
  kind: scalar
  status: draft
  description: Major-radius coordinate of the plasma current center, defined as the
    current-density-weighted centroid of the toroidal current distribution in the
    poloidal cross-section.
  documentation: 'The current center is the centroid of the tokamak plasma toroidal
    current density distribution projected onto the poloidal plane. Its major-radius
    coordinate $R_\mathrm{cc}$ quantifies the effective radial location from which
    the net plasma current appears to flow, and is a compact global descriptor of
    the equilibrium current profile.


    The defining relation is the current-density-weighted average of the major radius
    $R$ over the poloidal cross-section $A$:


    $$

    R_\mathrm{cc} = \frac{\displaystyle\int_A j_\phi \, R \, dA}{\displaystyle\int_A
    j_\phi \, dA}

    $$


    where $j_\phi$ is the toroidal component of the current density and $R$ is measured
    from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    In practice $R_\mathrm{cc}$ is obtained from equilibrium reconstruction constrained
    by external magnetic measurements; it is closely related to, but generally distinct
    from, the [major radius of the magnetic axis](name:major_radius_of_magnetic_axis),
    which is the locus of zero poloidal field. During sawteeth, off-axis current drive,
    or disruption precursors, $R_\mathrm{cc}$ can depart measurably from the magnetic
    axis position. The companion flux-surface average of $j_\phi$ is captured by flux_surface_averaged_current_density.


    Sign convention: Positive when $R_\mathrm{cc}$ is measured outward from the toroidal
    symmetry axis in the cylindrical $(R, \phi, Z)$ frame, consistent with $R > 0$
    for all physically realized plasma positions.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/r
    dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    status: composed
- name: major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Geometric major radius of a closed magnetic flux surface, defined as
    the midpoint in R between its high-field-side and low-field-side equatorial intersections
    in the right-handed cylindrical (R, phi, Z) frame. It provides a characteristic
    length scale for flux-surface geometry and gyrokinetic normalizations.
  documentation: 'The major radius of a flux surface is the representative distance
    of that surface from the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It is defined from the inboard and outboard equatorial
    intercepts of the same closed magnetic flux surface, so it is distinct from a
    flux-surface average of $R$.


    The defining relation is the midpoint between the low-field-side and high-field-side
    equatorial radii:


    $$

    R_\mathrm{fs} = \frac{R_\mathrm{out} + R_\mathrm{in}}{2}

    $$


    where $R_\mathrm{fs}$ is the major radius of the flux surface in m, $R_\mathrm{out}$
    is the [outer major radius of the flux surface](name:outer_major_radius_of_flux_surface)
    in m, and $R_\mathrm{in}$ is the [inner major radius of the flux surface](name:inner_major_radius_of_flux_surface)
    in m. The inner and outer radii are the equatorial high-field-side and low-field-side
    intersections, respectively, not arbitrary global extrema of $R$ on a strongly
    shaped contour.


    In practice this quantity is computed from an axisymmetric equilibrium by tracing
    a closed contour of constant poloidal flux in a poloidal cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame and locating its two equatorial
    intersections. Together with the [minor radius of a flux surface], it characterizes
    local surface geometry; in gyrokinetic normalizations it is often used as the
    macroscopic length scale in dimensionless ratios such as $\rho_i/R_\mathrm{fs}$
    or $R_\mathrm{fs}/L_X$, commonly alongside a [toroidal reference magnetic field](name:toroidal_reference_magnetic_field).


    Typical values follow the size of the device: about 0.3-1 m in compact or spherical
    tokamaks, 1-3 m in medium-sized tokamaks, and 3-6 m in large tokamaks. Within
    a plasma, the value can vary from one flux surface to another by centimeters to
    tens of centimeters because of Shafranov shift and shaping.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_major_radius_of_flux_surface
  - name:inner_major_radius_of_flux_surface
  - name:toroidal_reference_magnetic_field
  sources:
