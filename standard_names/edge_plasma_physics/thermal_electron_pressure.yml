name: thermal_electron_pressure
status: draft
cocos_transformation_type: one_like
description: Kinetic pressure of the thermal electron population arising from random
  (non-directed) motion, $p_{e,\mathrm{th}} = n_e k_B T_e$.
documentation: "The thermal electron pressure $p_{e,\\mathrm{th}}$ (in Pa) quantifies\
  \ the isotropic stress tensor trace associated with the random component of electron\
  \ velocities after subtraction of the mean flow: $p_{e,\\mathrm{th}} = n_e k_B T_e\
  \ = m_e n_e \\langle (\\mathbf{v}_e - \\langle \\mathbf{v}_e \\rangle)^2 \\rangle\
  \ / 3$, where $n_e$ is the electron number density, $T_e$ the electron temperature,\
  \ $m_e$ the electron mass, and $k_B$ is Boltzmann's constant. In tokamak core plasmas,\
  \ $p_{e,\\mathrm{th}}$ ranges from $\\sim 10^3$\u2013$10^5\\;\\mathrm{Pa}$ (H-mode\
  \ pedestal to burning-plasma core), while in the scrape-off layer values drop to\
  \ $\\sim 1$\u2013$100\\;\\mathrm{Pa}$. Thomson scattering provides simultaneous\
  \ $n_e$ and $T_e$ measurements from which $p_{e,\\mathrm{th}}$ is computed directly.\
  \ The thermal electron pressure is a key ingredient in the MHD force-balance equation\
  \ $\\nabla p = \\mathbf{j} \\times \\mathbf{B}$ (where $p$ includes both electron\
  \ and ion contributions) and in the kinetic-profile consistency check $\\beta_e\
  \ = 2 \\mu_0 p_{e,\\mathrm{th}} / B^2$. See also the ion counterpart and total pressure\
  \ quantities."
