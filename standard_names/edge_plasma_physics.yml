- name: poloidal_ion_charge_state_energy_diffusivity
  kind: scalar
  status: active
  description: "Poloidal ion charge-state energy diffusivity is the poloidal Fickian\
    \ diffusivity for thermal-energy transport of a specified ion charge state in\
    \ flux coordinates (\u03C1, \u03B8, \u03C6), defined so the diffusive energy flux\
    \ along increasing poloidal angle \u03B8 at fixed radial flux label \u03C1 and\
    \ toroidal angle \u03C6 is proportional to and opposite the corresponding gradient\
    \ of that state's thermal-energy density."
  documentation: 'Poloidal ion charge-state energy diffusivity is the effective transport
    coefficient for local diffusive smoothing of the thermal-energy density of one
    specified ion charge state along the poloidal direction in flux coordinates $(\rho,
    \theta, \phi)$. It represents the Fickian part of that charge state''s thermal-energy
    transport along the poloidal coordinate direction, distinct from convective transport
    and explicit energy sources, and is the poloidal component of [ion charge-state
    energy diffusivity](name:ion_charge_state_energy_diffusivity).


    The defining closure for the poloidal component is


    $$

    \mathbf{q}_{E,z}\cdot\hat{e}_{\mathrm{pol}} = -\chi_{E,z}^{\mathrm{pol}}\,\hat{e}_{\mathrm{pol}}\cdot\nabla
    w_z

    $$


    where $\mathbf{q}_{E,z}$ is the diffusive thermal-energy flux density of ion charge
    state $z$, $\hat{e}_{\mathrm{pol}}$ is the local unit tangent generated by increasing
    poloidal angle $\theta$ at fixed radial flux label $\rho$ and fixed toroidal angle
    $\phi$ in flux coordinates $(\rho, \theta, \phi)$, $\chi_{E,z}^{\mathrm{pol}}$
    is the poloidal ion charge-state energy diffusivity, $w_z$ is the thermal-energy
    density of that charge state, and $\hat{e}_{\mathrm{pol}}\cdot\nabla w_z$ is the
    corresponding poloidal gradient. The minus sign specifies down-gradient transport.


    This quantity applies to one specified ion charge state and is not summed over
    ion species or charge states, unlike [poloidal ion energy diffusivity](name:poloidal_ion_energy_diffusivity).
    The field-aligned directional counterpart is [parallel ion charge-state energy
    diffusivity](name:parallel_ion_charge_state_energy_diffusivity). A temperature-gradient
    form is equivalent only when the relevant density and heat-capacity factors are
    explicitly included in the coefficient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_charge_state_energy_diffusivity
