- name: ion_current_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Electrical current collected at a single mass-discriminated detector
    channel of a mass spectrometer, quantifying the ion abundance for the atomic mass
    species assigned to that channel.
  documentation: "In a mass spectrometer, each channel selects ions of a fixed mass-to-charge\
    \ ratio $m/z$ from an ionized sample of the plasma exhaust or vessel atmosphere.\
    \ When these ions strike the detector \u2014 a Faraday cup for higher-abundance\
    \ species or an electron multiplier for trace signals \u2014 they produce a measurable\
    \ electrical current that is directly proportional to the ion arrival rate at\
    \ that mass channel.\n\nThe collected current $I_\\text{ch}$ is related to the\
    \ ion arrival rate $\\dot{N}$ by:\n\n$$\nI_\\text{ch} = Z_i \\, e \\, \\dot{N}\n\
    $$\n\nwhere $Z_i$ is the ion charge state (typically unity for singly ionized\
    \ atoms or molecules), $e = 1.602 \\times 10^{-19}$ C is the elementary charge,\
    \ and $\\dot{N}$ is the number of ions collected per second.\n\nThe ion current\
    \ signal is subsequently converted to a partial pressure via the spectrometer's\
    \ sensitivity factor, which encodes the ionization cross-section, ion transmission\
    \ efficiency, and detector gain for each species; the resulting partial pressure\
    \ for the same channel is [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).\
    \ The detector bias voltage governing amplification efficiency is given by [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel).\n\
    \nTypical collected ion currents range from $10^{-12}$ A to $10^{-7}$ A depending\
    \ on the vessel gas composition, partial pressure level, and detector type. Faraday\
    \ cups are suitable for dominant fuel species such as hydrogen isotopes, while\
    \ electron multipliers extend sensitivity to low-abundance impurity or noble-gas\
    \ species."
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:neutral_pressure_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/channel/current
    dd_path: spectrometer_mass/channel/current
    status: attached
  - id: dd:spectrometer_mass/residual_spectrum/current
    dd_path: spectrometer_mass/residual_spectrum/current
    status: attached
- name: ion_saturated_current_density
  kind: scalar
  status: draft
  description: Ion saturation current density collected by a Langmuir probe when biased
    sufficiently negative to repel all electrons; a primary diagnostic for local plasma
    density and particle flux in the scrape-off layer.
  documentation: "The ion saturation current density $j_{i,sat}$ is the maximum ion\
    \ current per unit area collected at a probe surface when the probe potential\
    \ is driven sufficiently negative that the electron current is completely suppressed.\
    \ This saturation regime corresponds to the flat portion of the probe current\u2013\
    voltage (I\u2013V) characteristic at large negative bias, where all ions entering\
    \ the presheath are accelerated through the sheath and collected regardless of\
    \ further reduction in probe potential.\n\nIn the Bohm approximation, the ion\
    \ saturation current density is:\n\n$$\nj_{i,sat} = \\frac{1}{2} n_e e c_s\n$$\n\
    \nwhere $n_e$ is the electron density, $e$ is the elementary charge, and $c_s\
    \ = \\sqrt{e T_e / m_i}$ is the Bohm velocity with $T_e$ the electron temperature\
    \ (in eV) and $m_i$ the ion mass. Inverting this relation to obtain $n_e$ requires\
    \ independent knowledge of $T_e$ and the [effective_area_of_langmuir_probe](name:effective_area_of_langmuir_probe).\n\
    \nThis quantity is routinely measured by both embedded probes fixed in divertor\
    \ tiles or first-wall plasma-facing components and by reciprocating probes that\
    \ traverse the scrape-off layer to build radial profiles. Multiplying $j_{i,sat}$\
    \ by the effective collection area yields the total [ion_saturated_current](name:ion_saturated_current),\
    \ while turbulent fluctuations in this quantity are characterized by [ion_saturated_fluctuating_current_density](name:ion_saturated_fluctuating_current_density).\n\
    \nTypical values range from ~10\u2013100 A/m\xB2 in the far scrape-off layer to\
    \ ~1\u201350 kA/m\xB2 near divertor strike points during attached plasma operation.\n\
    \nSign convention: Positive when ions flow from the plasma toward the probe collector\
    \ surface."
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current
  - name:ion_saturated_fluctuating_current_density
  sources:
  - id: dd:langmuir_probes/embedded/j_i_saturation
    dd_path: langmuir_probes/embedded/j_i_saturation
    status: attached
  - id: dd:langmuir_probes/reciprocating/plunge/collector/j_i_saturation
    dd_path: langmuir_probes/reciprocating/plunge/collector/j_i_saturation
    status: composed
- name: ion_saturated_fluctuating_current_density
  kind: scalar
  status: draft
  description: Standard deviation of the ion saturation current density collected
    at a Langmuir-probe surface, representing the fluctuation amplitude of the ion-saturation
    signal.
  documentation: 'Ion saturated fluctuating current density is the root-mean-square
    amplitude of departures of ion saturation current density from its mean over a
    specified averaging interval. The underlying ion saturation current density is
    the current collected per effective collecting area when the probe is biased sufficiently
    negative to measure the ion-saturation branch. This quantity describes the fluctuation
    amplitude, not the signed mean current density.


    For a continuous time series, the fluctuation amplitude over an interval from
    $t_1$ to $t_2$ is defined by


    $$

    \sigma_{j_{i,\mathrm{sat}}} = \left[\frac{1}{t_2-t_1}\int_{t_1}^{t_2}\left(j_{i,\mathrm{sat}}(t)-\bar{j}_{i,\mathrm{sat}}\right)^2\,dt\right]^{1/2}

    $$


    where $\sigma_{j_{i,\mathrm{sat}}}$ is the ion saturated fluctuating current density,
    $j_{i,\mathrm{sat}}(t)$ is the instantaneous ion saturation current density in
    A m^-2, $\bar{j}_{i,\mathrm{sat}}$ is its mean over the same interval in A m^-2,
    and $t$, $t_1$, and $t_2$ are times in seconds. For sampled data, the integral
    is replaced by the corresponding average over the selected samples.


    It is obtained from fast Langmuir-probe current measurements after choosing an
    averaging interval, applying the relevant bandwidth or filtering, and dividing
    the measured current by the effective ion-collecting area. The underlying current
    density is evaluated along the local collector normal; reversing the arbitrary
    sign of the raw current time series does not change this standard deviation. In
    sheath interpretation, the mean ion saturation current density is approximately
    proportional to local plasma density and ion sound speed, so the fluctuation level
    is mainly sensitive to density turbulence, with additional dependence on electron
    and ion temperature, plasma potential, sheath expansion, magnetic-field incidence
    angle, and probe geometry.


    The quantity is non-negative and is zero only for a perfectly steady ion saturation
    current density over the averaging interval, apart from instrumental noise. Typical
    edge and scrape-off-layer values are about 10^2-10^5 A m^-2, often 0.05-1 times
    the local mean ion saturation current density; intermittent events, high-density
    conditions, or short averaging intervals can give larger values.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current_density
  - name:parallel_ion_fluctuating_current_density
  - name:fluctuating_electrostatic_potential
  sources:
  - id: dd:langmuir_probes/embedded/j_i_saturation_sigma
    dd_path: langmuir_probes/embedded/j_i_saturation_sigma
    status: attached
  - id: dd:langmuir_probes/reciprocating/plunge/collector/j_i_sigma
    dd_path: langmuir_probes/reciprocating/plunge/collector/j_i_sigma
    status: composed
- name: parallel_heat_flux
  kind: scalar
  status: draft
  description: Power per unit area transported along the local magnetic field direction,
    quantifying the dominant energy exhaust channel in the scrape-off layer and at
    plasma-facing surfaces.
  documentation: "The parallel heat flux $q_\\parallel$ is the component of the heat\
    \ flux vector aligned with the local magnetic field, representing the primary\
    \ energy transport mechanism in the scrape-off layer (SOL) where conduction along\
    \ field lines exceeds cross-field transport by orders of magnitude.\n\nIn Langmuir\
    \ probe diagnostics, $q_\\parallel$ is inferred from the sheath energy balance:\n\
    \n$$\nq_\\parallel = \\gamma_\\mathrm{sh} \\, \\frac{k_B T_e}{e} \\, j_\\mathrm{sat}\n\
    $$\n\nwhere $j_\\mathrm{sat}$ is the [ion saturation current density](name:ion_saturated_current_density),\
    \ $T_e$ is the local [electron temperature at the wall](name:electron_temperature_at_wall),\
    \ $\\gamma_\\mathrm{sh} \\approx 5$\u2013$8$ is the dimensionless sheath heat\
    \ transmission coefficient accounting for both ion and electron energy channels,\
    \ $k_B$ is Boltzmann's constant, and $e$ is the elementary charge.\n\nMeasurements\
    \ are performed using probes embedded in plasma-facing components such as divertor\
    \ tiles and limiters, or on reciprocating drives that plunge into the SOL. Accurate\
    \ conversion from raw probe signals to heat flux requires both the [effective\
    \ probe collection area](name:effective_area_of_langmuir_probe) and the local\
    \ magnetic field incidence angle described by [angle_of_langmuir_probe](name:angle_of_langmuir_probe).\n\
    \nTypical values in current tokamak SOLs range from 1\u2013100 MW m$^{-2}$, with\
    \ peak loads near the divertor strike points posing a primary challenge for plasma-facing\
    \ component design and lifetime.\n\nSign convention: Positive when heat flows\
    \ in the direction of the magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$ at the probe position."
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current_density
  - name:electron_temperature_at_wall
  - name:effective_area_of_langmuir_probe
  - name:angle_of_langmuir_probe
  sources:
