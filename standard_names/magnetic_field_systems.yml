        iron core. Together with the inner radius, defines the radial extent of this
        annular element in the iron core geometry description.
      kind: llm
- name: radius_of_passive_loop
  kind: scalar
  status: active
  description: Radius of the annular cross-section of a passive conducting loop element
    is the Euclidean distance from the cross-section center to a specified conducting
    boundary. It is nonnegative and does not denote the loop center's major-radius
    position.
  documentation: "Radius of the annular cross-section of a passive conducting loop\
    \ element is the Euclidean distance, in the $(R,Z)$ plane at fixed toroidal angle\
    \ $\x7Fphi$ of the right-handed cylindrical $(R, \x7Fphi, Z)$ frame, from the\
    \ center of the annular conductor cross-section to a specified conducting boundary\
    \ of that annulus. Here $R$ is major radius and $Z$ is vertical height.\n\nThe\
    \ boundary radius is defined by the poloidal-plane distance from the cross-section\
    \ center to the selected boundary point:\n\n$$\nr = \\sqrt{(R_b - R_c)^2 + (Z_b\
    \ - Z_c)^2}\n$$\n\nwhere $(R_c,Z_c)$ is the center position of the annular cross-section\
    \ and $(R_b,Z_b)$ is the selected boundary position in the same fixed-$\x7Fphi$\
    \ plane; all coordinate components in the equation are expressed in meters.\n\n\
    This parent quantity abstracts over [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)\
    \ and [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop). It satisfies\
    \ $r \\ge 0$ and is a size of the conductor cross-section, not a signed component\
    \ along $\\hat{R}$, $\\hat{\\phi}$, or $\\hat{Z}$ and not the major-radius coordinate\
    \ of the loop center. For a circular annulus, [area_of_passive_loop](name:area_of_passive_loop)\
    \ is related by $A=\\pi(r_\\mathrm{outer}^2-r_\\mathrm{inner}^2)$, and [thickness_of_passive_loop](name:thickness_of_passive_loop)\
    \ is $r_\\mathrm{outer}-r_\\mathrm{inner}$."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:area_of_passive_loop
- name: inner_radius_of_passive_loop
  kind: scalar
  status: active
  description: Inner radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance from the cross-section center to its inner conducting
    boundary. It is nonnegative.
  documentation: 'Inner radius of the annular cross-section of a passive conducting
    loop element is the Euclidean distance, in the $(R,Z)$ plane at fixed toroidal
    angle $phi$ of the right-handed cylindrical $(R,phi,Z)$ frame, from the center
    of the annular conductor cross-section to its inner conducting boundary. Here
    $R$ is major radius and $Z$ is vertical height.


    The inner boundary radius is defined by the poloidal-plane distance from the cross-section
    center to the selected inner-boundary point:


    $$

    r_\mathrm{inner} = \sqrt{(R_i - R_c)^2 + (Z_i - Z_c)^2}

    $$


    where $(R_c,Z_c)$ is the annular cross-section center and $(R_i,Z_i)$ is the inner-boundary
    position in the same fixed-$\phi$ plane; all coordinate components in the equation
    are expressed in meters.


    This quantity specializes [radius_of_passive_loop](name:radius_of_passive_loop)
    to the inner conducting boundary and complements [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop).
    For a circular annulus, the conductor thickness is the outer radius minus this
    inner radius, and [area_of_passive_loop](name:area_of_passive_loop) is determined
    by the difference of the squared outer and inner radii. It is a cross-sectional
    size, not the loop center''s major-radius coordinate or a signed cylindrical component.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:area_of_passive_loop
  arguments:
