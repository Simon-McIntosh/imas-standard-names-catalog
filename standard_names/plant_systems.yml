- name: thermal_power_of_divertor
  kind: scalar
  status: active
  description: Thermal power of divertor is the rate of thermal energy deposited on
    wetted divertor surfaces, integrated over included targets and divertor components.
  documentation: 'Thermal power of divertor is the total rate of thermal energy deposited
    on the wetted plasma-facing surfaces of the divertor assembly. It sums thermal
    deposition over all included divertor targets and other divertor plasma-facing
    components.


    The defining surface integral is


    $$

    P_{\mathrm{div,th}} = \int_{S_{\mathrm{div}}} q_{\mathrm{th}}\,\mathrm{d}A

    $$


    where $S_{\mathrm{div}}$ is the union of the included wetted divertor surfaces,
    $q_{\mathrm{th}}$ is the thermal deposited-energy flux density, and $\mathrm{d}A$
    is the surface-area element. The thermal contribution is a component of [power_of_divertor](name:power_of_divertor)
    and is distinct from neutral deposition represented by [neutral_power_of_divertor](name:neutral_power_of_divertor),
    as well as from electrical-current and other nonthermal contributions. Deposition
    on main-wall or other non-divertor plasma-facing components is excluded.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_divertor
  - name:neutral_power_of_divertor
