name: argon_ion_number_density_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Number density of ionized argon (summed over all charge states) evaluated
  at the pedestal top in H-mode plasmas.
documentation: "The argon ion number density $n_{\\rm Ar} = \\sum_{q=1}^{18} n_{\\\
  rm Ar^{q+}}$ at the pedestal top quantifies the total concentration of all argon\
  \ charge states at the inner edge of the H-mode transport barrier. Argon is routinely\
  \ injected as a radiative impurity to spread divertor heat loads; its pedestal density\
  \ (typically $10^{16}$\u2013$10^{18}\\;\\mathrm{m^{-3}}$) must be controlled to\
  \ avoid excessive core radiation and fuel dilution. The dominant charge states in\
  \ the pedestal ($T_e \\sim 0.3$\u20131 keV) are Ar$^{14+}$\u2013Ar$^{16+}$. The\
  \ quantity is inferred from CXRS or extreme-ultraviolet spectroscopy combined with\
  \ collisional-radiative modeling. See also `argon_number_density_at_magnetic_axis`\
  \ for the core evaluation and `boron_ion_number_density_at_pedestal` for a companion\
  \ impurity species at the same location."
