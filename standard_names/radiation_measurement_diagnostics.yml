- name: spectral_width_of_filter
  kind: scalar
  status: active
  description: "Full wavelength span of a filter\u2019s transmitted passband between\
    \ the two wavelengths where transmission reaches 90% of its peak value."
  documentation: "The 90%-transmission width is the edge-to-edge spectral span of\
    \ an optical filter\u2019s passband, using the two transmission crossings at 90%\
    \ of the maximum transmission. It is a specific boundary criterion for [width\
    \ of filter](name:width_of_filter), not the passband center or peak wavelength.\n\
    \nThe width is defined by\n\n$$\n\\Delta\\lambda_{90} = \\lambda_{\\mathrm{high},90}\
    \ - \\lambda_{\\mathrm{low},90}\n$$\n\nwhere $\\lambda_{\\mathrm{low},90}$ and\
    \ $\\lambda_{\\mathrm{high},90}$ are the lower and upper wavelengths satisfying\
    \ $T(\\lambda)=0.9T_{\\mathrm{max}}$, $T(\\lambda)$ is the filter transmission,\
    \ and $T_{\\mathrm{max}}$ is its peak transmission. The value is non-negative\
    \ and applies when two such passband crossings define the transmitted band."
  unit: m
