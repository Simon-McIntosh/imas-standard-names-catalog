- name: radial_coordinate_of_detector_pixel
  kind: scalar
  status: draft
  description: Major radius R of a single detector pixel, locating it along the radial
    direction from the machine symmetry axis in the right-handed cylindrical (R, phi,
    Z) frame.
  documentation: "The radial coordinate $R$ of a detector pixel gives the perpendicular\
    \ distance from the machine's toroidal symmetry axis to the pixel center in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major-radius\
    \ coordinate increasing outward from the symmetry axis, $\\phi$ is the toroidal\
    \ angle, and $Z$ is the vertical height.\n\nFor X-ray crystal spectrometer diagnostics,\
    \ pixel spatial coordinates are fixed by the mechanical geometry of the detector\
    \ camera assembly \u2014 the crystal mount, focusing optics, and detector array\
    \ \u2014 rather than by in-situ plasma measurements. Together with [vertical_coordinate_of_detector_pixel](name:vertical_coordinate_of_detector_pixel),\
    \ this coordinate fully specifies the two-dimensional position of the pixel in\
    \ the poloidal cross-section. The pixel radial position enters solid-angle and\
    \ Bragg-diffraction geometry calculations that map spectral channels to plasma\
    \ emission locations, and it is paired with [energy_of_detector_pixel](name:energy_of_detector_pixel)\
    \ when constructing the spatial-to-spectral mapping for each pixel. The analogous\
    \ quantity for a diagnostic aperture element is the [radial_coordinate_of_aperture](name:radial_coordinate_of_aperture).\n\
    \nTypical values range from approximately 1 m to 10 m, depending on machine size\
    \ and spectrometer mounting location.\n\nSign convention: Positive for all physical\
    \ detector positions, as $R$ measures the outward distance from the toroidal symmetry\
    \ axis in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
