- name: vertical_angle_of_detector_pixel
  kind: scalar
  status: active
  description: "Signed elevation angle of a camera pixel\u2019s line of sight relative\
    \ to the camera optical axis, specifying its vertical position within the field\
    \ of view."
  documentation: "The vertical viewing angle of a camera pixel is the signed elevation\
    \ offset of its line of sight from the camera optical axis. It specifies angular\
    \ position in the camera\u2019s vertical image direction, rather than the full\
    \ vertical field-of-view span described by [vertical angular width of camera](name:vertical_angular_width_of_camera).\n\
    \nIn the right-handed Cartesian $(\\hat{x},\\hat{y},\\hat{z})$ frame, let $\\\
    hat{\\ell}$ be the pixel line-of-sight unit vector, $\\hat{o}$ the optical-axis\
    \ unit vector, and $\\hat{v}$ the camera image-up unit vector. The angle is defined\
    \ by\n\n$$\n\\alpha_v = \\operatorname{atan2}(\\hat{\\ell}\\cdot\\hat{v},\\hat{\\\
    ell}\\cdot\\hat{o})\n$$\n\nwhere $\\alpha_v$ is the signed vertical viewing angle\
    \ and the three hatted quantities are dimensionless unit vectors. The image-up\
    \ orientation determines the vertical angular direction.\n\nSign convention: Positive\
    \ when the pixel line of sight has a positive projection onto the camera image-up\
    \ direction relative to the optical axis."
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_angular_width_of_camera
  sources:
  - dd_path: camera_visible/channel/detector/pixel_to_beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_visible.html#camera_visible-channel-detector-pixel_to_beta
