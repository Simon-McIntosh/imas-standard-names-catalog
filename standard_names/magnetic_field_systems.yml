    \hat{z})$ basis, with $\hat{z}=\hat{Z}$, and $R$ is the non-negative distance
    from the toroidal symmetry axis.


    The quantity applies to outline points and is distinct from the conductor [height](name:height_of_poloidal_field_coil),
    [cross-sectional area](name:area_of_poloidal_field_coil), and the analogous outline
    coordinate for a generic [coil conductor element](name:radial_outline_of_coil_conductor_element).'
