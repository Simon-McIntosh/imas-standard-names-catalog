name: trapped_fast_particle_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of fast (supra-thermal) particles confined to trapped
  (banana) orbits on a given flux surface.
documentation: "Trapped fast-particle density $n_{\\mathrm{t,fast}}$ counts particles\
  \ whose pitch angle $\\lambda = v_\\perp^2 / (v^2 B_{\\max})$ satisfies the trapping\
  \ condition $\\lambda > B(\\theta)/B_{\\max}$ at the low-field-side midplane, restricted\
  \ to kinetic energies well above the local thermal energy ($E \\gg k_B T$, typically\
  \ $E > 10\\,k_B T$). These particles execute banana orbits and can drive Alfv\xE9\
  nic and fishbone instabilities when their density or pressure gradient is sufficiently\
  \ large. Typical core values in NBI-heated tokamak plasmas range from $10^{16}$\
  \ to $10^{18}$ m$^{-3}$, depending on heating power and confinement. The quantity\
  \ is computed from Monte Carlo orbit-following codes (e.g., TRANSP/NUBEAM, ASCOT)\
  \ or analytic slowing-down distribution models. It is always non-negative and bounded\
  \ by the total fast-ion density."
