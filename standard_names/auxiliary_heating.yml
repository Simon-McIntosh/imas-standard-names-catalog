- name: absorbed_power_of_beam_tracing_beam
  description: |-
    Absorbed power of a beam-tracing beam is the total electromagnetic wave
    power transferred from one coherent beam to the plasma along its trajectory.
  documentation: |-
    Absorbed power of a beam-tracing beam is the total electromagnetic wave
    power transferred from a single coherent beam to plasma particles along the
    beam trajectory. It is summed over the contributing plasma species and is
    distinct from the residual wave power represented by
    power_of_beam_tracing_beam.

    Under the single-beam power balance, the absorbed power is defined by

    $$
    P_{\mathrm{abs}} = P_0 - P_{\mathrm{res}}
    $$

    where $P_{\mathrm{abs}}$ is this absorbed power, $P_0$ is the
    [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam),
    and $P_{\mathrm{res}}$ is the residual power of the same beam at the
    trajectory endpoint. The total includes contributions represented by
    species-resolved quantities such as
    [electron_absorbed_power_of_beam_tracing_beam](name:electron_absorbed_power_of_beam_tracing_beam)
    and
    [ion_charge_state_absorbed_power_of_beam_tracing_beam](name:ion_charge_state_absorbed_power_of_beam_tracing_beam).
    It excludes power remaining in the wave and power assigned at launch but not
    transferred along the traced trajectory.
  unit: W

- name: alpha_angle_of_antenna_strap
  description: |-
    Signed inclination of the alpha-side lateral face of an oblique trapezoidal
    ICRH antenna-strap cross-section relative to the directed strap base edge.
  documentation: |-
    The alpha angle is the oriented inclination of the alpha-side lateral face
    of an oblique trapezoidal ICRH antenna-strap cross-section, measured from
    the directed strap base edge. It specifies the alpha-side geometry
    complementary to the beta-side quantity represented by angle of antenna
    strap.

    $$
    \alpha = \operatorname{atan2}\!\left(\hat{n}\cdot(\hat{b}\times\hat{a}),\,\hat{b}\cdot\hat{a}\right)
    $$

    where $\hat{b}$ is the unit vector along the directed strap base edge,
    $\hat{a}$ is the unit vector along the alpha-side lateral face, and
    $\hat{n}$ is the positive normal to the oriented cross-sectional plane. The
    angle is restricted to the alpha-side face and is distinct from the
    beta-side inclination.

    Sign convention: Positive when rotation from the directed strap base edge
    toward the alpha-side lateral face follows the positive normal of the
    oriented strap cross-section.
  unit: rad

- name: back_surface_distance_of_antenna_strap
  description: |-
    Geometric rear-surface clearance between an ion-cyclotron heating antenna
    strap and the conducting wall or conductor behind it.
  documentation: |-
    This quantity is the geometric standoff between the rear surface of an
    ion-cyclotron heating antenna strap and the conducting wall or other
    conductor located behind that surface.

    The clearance is the shortest separation between the two relevant surfaces:

    $$
    d_{back} = \min_{\mathbf{r}_b \in S_b,\,\mathbf{r}_c \in S_c} \left\|\mathbf{r}_c - \mathbf{r}_b\right\|
    $$

    where $d_{\rm back}$ is the rear-surface clearance, $S_b$ is the strap back
    surface, $S_c$ is the facing conducting-wall or conductor surface, and
    $\mathbf{r}_b$ and $\mathbf{r}_c$ are position vectors on those surfaces.

    The quantity applies only to the rear-facing separation of the antenna strap
    and does not denote the strap thickness, the distance to its inner or outer
    cylindrical boundaries, or either oblique cross-sectional length. The
    related [inner radius of the antenna
    strap](name:inner_radius_of_antenna_strap), [outer radius of the antenna
    strap](name:outer_radius_of_antenna_strap), [major length of the antenna
    strap](name:major_length_of_antenna_strap), and [minor length of the antenna
    strap](name:minor_length_of_antenna_strap) describe other strap dimensions
    rather than this conductor clearance.

    This geometric clearance is an antenna-design parameter that influences the
    strap's loading resistance and radio-frequency coupling efficiency to the
    plasma; it is not itself an electrical resistance, coupling coefficient, or
    power quantity.
  unit: m

- name: binormal_wave_magnetic_field
  description: |-
    Signed component of the oscillatory electromagnetic-wave magnetic
    perturbation along the local binormal direction, distinct from the total
    binormal magnetic field.
  documentation: |-
    This quantity is the binormal component of the oscillatory magnetic
    perturbation carried by a coherent electromagnetic wave. It excludes
    equilibrium and other static magnetic-field contributions.

    For a harmonic-wave phasor representation, the component amplitude is
    defined by projection on the local binormal unit vector:

    $$
    \widetilde{B}_{\mathrm{wave,bi}}(\mathbf{r},\omega)=\widetilde{\mathbf{B}}_{\mathrm{wave}}(\mathbf{r},\omega)\cdot\hat{\mathbf{e}}_{\mathrm{bi}}(\mathbf{r})
    $$

    where $\mathbf{r}$ is position, $\omega$ is angular frequency,
    $\widetilde{\mathbf{B}}_{\mathrm{wave}}$ is the complex amplitude of the
    wave magnetic field, $\hat{\mathbf{e}}_{\mathrm{bi}}$ is the local binormal
    unit vector, and $\widetilde{B}_{\mathrm{wave,bi}}$ is the complex amplitude
    of the binormal component. The corresponding physical time-dependent
    component is obtained from the real part of the phasor convention; real- and
    imaginary-part quantities are phase-resolved representations, not alternate
    definitions of this field.

    The binormal direction is tangent to a magnetic flux surface and
    perpendicular to the equilibrium magnetic-field direction, distinguishing
    this quantity from the [parallel wave magnetic
    field](name:parallel_wave_magnetic_field). It is the magnetic-field analog
    of the [binormal wave electric field](name:binormal_wave_electric_field).

    Sign convention: Positive when the wave magnetic-field projection is along
    the declared positive binormal unit vector.
  unit: T

- name: capacitance_of_ion_cyclotron_heating_antenna
  description: |-
    Effective capacitance of an impedance-matching element in an ion-cyclotron
    heating antenna, relating stored charge to the RF voltage used for circuit
    tuning.
  documentation: |-
    This quantity is the non-negative lumped capacitance associated with an
    impedance-matching element in an ion-cyclotron heating antenna module. It
    represents the element's ability to store electric charge and participate in
    tuning the radio-frequency transmission circuit.

    For an ideal lumped capacitive element, the capacitance is defined by

    $$
    C = \frac{Q}{V}
    $$

    where $C$ is the capacitance, $Q$ is the charge stored on the element, and
    $V$ is the electric potential difference across the element.

    The quantity applies to the specified matching element of the antenna and
    does not represent the capacitance of an unrelated circuit component or the
    entire transmission system. It is a circuit parameter rather than a power,
    current, or operating-frequency quantity.

    Together with the [resistance of an ion-cyclotron heating
    antenna](name:resistance_of_ion_cyclotron_heating_antenna), it characterizes
    the antenna's effective RF impedance; the [frequency of an ion-cyclotron
    heating antenna](name:frequency_of_ion_cyclotron_heating_antenna) identifies
    the RF operating frequency at which the matching condition is evaluated.
  unit: F

- name: current_density_due_to_distribution_function_driven
  description: |-
    Net electric current-density vector obtained by summing signed charge fluxes
    from all particle populations in the full kinetic distribution, including
    fast-particle and thermal back-current contributions.
  documentation: |-
    This quantity is the net electric current-density vector generated by the
    charge-weighted particle motion represented in a full kinetic distribution.
    It includes the fast-particle contribution together with the electron and
    thermal-ion back-current contributions.

    The current-density vector is defined by

    $$
    \mathbf{J}(\mathbf{x}) = \sum_s q_s \int \mathbf{v}\, f_s(\mathbf{x},\mathbf{v})\,d^3v
    $$

    where $\mathbf{J}(\mathbf{x})$ is the current-density vector at position
    $\mathbf{x}$, $s$ indexes every included particle species or population,
    $q_s$ is the signed electric charge per particle of species or population
    $s$, $\mathbf{v}$ is particle velocity, $f_s(\mathbf{x},\mathbf{v})$ is its
    phase-space distribution function, and $d^3v$ is the velocity-space volume
    element.

    The quantity is local in space and aggregated over all represented particle
    species and kinetic populations. It is not restricted to fast particles and
    is not restricted to any single coordinate projection; the electron and
    thermal-ion back-current contributions remain part of the total.

    The toroidal component is the more specific [toroidal current density due to
    distribution-function-driven
    processes](name:toroidal_current_density_due_to_distribution_function_driven).
    In contrast, [fast current density](name:fast_current_density) contains only
    the selected fast-particle contribution and therefore does not represent
    this full-distribution total.

    Sign convention: Positive when the relevant component of $\mathbf{J}$ points
    along the corresponding positive basis direction $\hat{R}$, $\hat{\phi}$, or
    $\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: A.m^-2

- name: current_density_due_to_wave_driven_current_drive
  description: |-
    Vector conventional electric current density attributable to non-inductive
    wave–particle interactions, represented locally or after averaging over
    magnetic flux surfaces.
  documentation: |-
    Wave-driven current density is the conventional electric-current-density
    vector attributable to electromagnetic-wave–particle interactions that drive
    plasma current non-inductively. It represents charge transport in the plasma
    rather than the total current carried by an external circuit.

    Its population-resolved definition is

    $$
    \mathbf{J}_{\mathrm{w}} = \sum_s q_s\boldsymbol{\Gamma}_{s,\mathrm{w}}
    $$

    where $\mathbf{J}_{\mathrm{w}}$ is the wave-driven electric current-density
    vector, $s$ indexes the contributing charged plasma populations, $q_s$ is
    the signed charge of population $s$, and
    $\boldsymbol{\Gamma}_{s,\mathrm{w}}$ is that population's particle-flux
    vector attributable to wave-driven current drive.

    The species sum aggregates the charged plasma populations contributing to
    the wave-driven current, while spatial, flux-surface, or mode aggregation
    depends on the representation. The quantity excludes inductive current and
    current driven by non-wave mechanisms; it is a current density, not a
    volume-integrated net plasma current.

    The [current density per toroidal mode due to wave-driven current
    drive](name:current_density_per_toroidal_mode_due_to_wave_driven_current_drive)
    is a representation that retains toroidal-mode resolution, whereas the
    [flux-surface-averaged current density due to wave-driven current
    drive](name:flux_surface_averaged_current_density_due_to_wave_driven_current_drive)
    applies a magnetic flux-surface average. The related [current due to
    wave-driven current drive](name:current_due_to_wave_driven_current_drive)
    represents the corresponding net plasma-current quantity obtained from the
    appropriate integration or projection of this density.
  unit: A.m^-2

- name: current_density_per_toroidal_mode_due_to_wave_driven_current_drive
  description: |-
    Current density per toroidal mode due to wave-driven current drive is the
    vector non-inductive current-density contribution from one toroidal Fourier
    harmonic. It represents local charge transport produced by wave-particle
    interactions before summing over toroidal modes or projecting onto
    directions such as the magnetic-field-parallel direction.
  documentation: |-
    Current density per toroidal mode due to wave-driven current drive is the
    vector non-inductive current-density contribution associated with one
    toroidal Fourier harmonic of the wave-driven current-drive source. It
    represents the local conventional-current response produced by wave-particle
    interactions for that harmonic, retaining the vector direction rather than
    only a scalar projection.

    The toroidal mode number labels Fourier harmonics in toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height. The mode-summed wave-driven current
    density is related to the per-mode contributions by

    $$
    \mathbf{j}^{\mathrm{WCD}}(\mathbf{x},t) = \sum_n \mathbf{j}^{\mathrm{WCD}}_n(\mathbf{x},t)
    $$

    where $\mathbf{j}^{\mathrm{WCD}}$ is the [mode-summed wave-driven current
    density](name:current_density_due_to_wave_driven_current_drive),
    $\mathbf{j}^{\mathrm{WCD}}_n$ is this per-toroidal-mode vector current
    density for toroidal mode number $n$, $\mathbf{x}$ is spatial position, and
    $t$ is time.

    This quantity applies to the wave-driven non-inductive current-density
    contribution at a local plasma position and is resolved for a single
    toroidal mode. Its aggregation convention is mode-resolved:
    per-toroidal-mode means attributed to one harmonic index, not divided by the
    number of harmonics, and no sum over $n$ is included. It excludes inductive
    or ohmic current density, total plasma current, particle flux, and wave
    power.

    The [parallel per-toroidal-mode wave-driven current
    density](name:parallel_current_density_per_toroidal_mode_due_to_wave_driven_current_drive)
    is the magnetic-field-aligned projection of $\mathbf{j}^{\mathrm{WCD}}_n$
    for the same toroidal mode. Summing $\mathbf{j}^{\mathrm{WCD}}_n$ over mode
    numbers gives the [mode-summed wave-driven current
    density](name:current_density_due_to_wave_driven_current_drive); it does not
    give another per-toroidal-mode quantity.

    Sign convention: Positive when a resolved component represents conventional
    current flowing in the positive direction of the component's explicitly
    named basis vector or projection direction.
  unit: A.m^-2

- name: current_due_to_electron_cyclotron_current_drive
  description: |-
    Net toroidal plasma current generated non-inductively by electron-cyclotron
    wave absorption and resonant wave–particle interactions, summed over all
    wave sources.
  documentation: |-
    This quantity is the net toroidal plasma current attributable to
    electron-cyclotron wave-driven current generation. It excludes inductive
    current and current produced by other non-inductive mechanisms.

    The total driven current is the toroidal projection of the driven current
    density integrated over a poloidal cross-section:

    $$
    I_{\mathrm{EC}} = \int_A j_{\phi,\mathrm{EC}}(R,Z)\,dA
    $$

    where $j_{\phi,\mathrm{EC}}$ is the electron-cyclotron-driven
    current-density component in the direction of increasing toroidal angle
    $\phi$, $A$ is the plasma cross-sectional area in the right-handed
    cylindrical $(R,\phi,Z)$ frame, and $dA$ is its differential area. The
    quantity is a current contribution, not the absorbed electron-cyclotron wave
    power; its broader wave-driven-current counterpart is [current due to
    wave-driven current drive](name:current_due_to_wave_driven_current_drive).

    Sign convention: Positive when the driven current flows in the direction of
    increasing toroidal angle $\phi$.
  unit: A

- name: current_due_to_ion_cyclotron_current_drive
  description: |-
    Net toroidal plasma current generated non-inductively by ion-cyclotron wave
    absorption and integrated over the plasma cross-section.
  documentation: |-
    This quantity is the net plasma current driven by ion-cyclotron
    wave–particle interactions, excluding inductive and non-wave current
    contributions. It represents the toroidal component of the current generated
    by the absorbed ion-cyclotron power.

    The current is obtained by integrating the driven toroidal current density
    over the plasma cross-section:

    $$
    I_{\mathrm{ICCD}} = \int_A j_{\phi,\mathrm{ICCD}}\,dA
    $$

    where $I_{\mathrm{ICCD}}$ is the driven current, $j_{\phi,\mathrm{ICCD}}$ is
    the ion-cyclotron-driven toroidal current density in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $A$ is the plasma cross-sectional
    area. The quantity is a net current, so oppositely directed local
    contributions are algebraically summed. It is a source-specific component of
    [current_due_to_wave_driven_current_drive](name:current_due_to_wave_driven_current_drive)
    and is distinct from
    [current_due_to_electron_cyclotron_current_drive](name:current_due_to_electron_cyclotron_current_drive).

    Sign convention: Positive when the driven current flows in the direction of
    increasing toroidal angle $\phi$.
  unit: A

- name: current_due_to_lower_hybrid_current_drive
  description: |-
    Net toroidal plasma current driven non-inductively by lower-hybrid slow
    waves through wave–particle interactions, contributing to the total
    non-inductive current.
  documentation: |-
    This quantity is the net toroidal plasma current attributable to
    lower-hybrid current drive. It represents the lower-hybrid contribution to
    the plasma current and excludes inductive current and non-wave-driven
    non-inductive contributions.

    $$
    I_{\mathrm{LH}} = \int_{A_p} j_{\phi,\mathrm{LH}}\,\mathrm{d}A
    $$

    where $I_{\mathrm{LH}}$ is the lower-hybrid-driven current,
    $j_{\phi,\mathrm{LH}}$ is the toroidal component of the lower-hybrid-driven
    current density, and $A_p$ is a poloidal cross-sectional area of the plasma.
    The quantity is a whole-plasma net current, so oppositely directed local
    contributions may partially cancel. It is a wave-driven contribution within
    [current due to wave-driven current
    drive](name:current_due_to_wave_driven_current_drive) and is distinct from
    [current due to electron cyclotron current
    drive](name:current_due_to_electron_cyclotron_current_drive).

    Sign convention: Positive when the lower-hybrid-driven current flows in the
    direction of increasing toroidal angle $\phi$.
  unit: A

- name: current_due_to_neutral_beam_injection
  description: |-
    Net toroidal plasma current driven by neutral-beam injection, combining the
    fast-ion current and collisional electron return current after beam
    ionization.
  documentation: |-
    Neutral-beam-driven plasma current is the net toroidal current produced when
    injected neutrals ionize and their fast ions transfer momentum to the
    plasma. It includes both the directed fast-ion contribution and the
    associated collisional electron return-current contribution.

    The current is defined by integrating the net neutral-beam-driven toroidal
    current density over the plasma cross-sectional area:

    $$
    I_{\mathrm{NBI}} = \int_{\mathcal{A}_{p}} j_{\phi,\mathrm{NBI}}(R,Z)\,d\mathcal{A}
    $$

    where $I_{\mathrm{NBI}}$ is the neutral-beam-driven plasma current,
    $j_{\phi,\mathrm{NBI}}$ is its toroidal current-density contribution, and
    $\mathcal{A}_{p}$ is the plasma cross-sectional area in the right-handed
    cylindrical $(R,\phi,Z)$ frame.

    This source contribution is distinct from absorbed power of a neutral beam
    injector and is combined with other current sources, including plasma
    current due to ohmic induction and [current due to electron-cyclotron
    current drive](name:current_due_to_electron_cyclotron_current_drive).

    Sign convention: Positive when the net toroidal current flows in the
    direction of increasing toroidal angle $\phi$.
  unit: A

- name: current_due_to_wave_driven_current_drive
  description: |-
    Net toroidal plasma current generated non-inductively by wave–particle
    interactions, including cumulative and toroidal-mode-resolved
    representations.
  documentation: |-
    Wave-driven current is the toroidal plasma current attributable to momentum
    transfer from externally applied electromagnetic waves through wave–particle
    interactions. It excludes inductive current and non-wave non-inductive
    current sources.

    For a selected poloidal cross-sectional area, the current is defined by

    $$
    I_{\mathrm{wd}} = \int_A j_{\mathrm{wd},\phi}(R,Z)\,dA
    $$

    where $I_{\mathrm{wd}}$ is the wave-driven current, $A$ is the selected
    poloidal area, $j_{\mathrm{wd},\phi}$ is the toroidal component of the
    wave-driven current density, and $(R,\phi,Z)$ is the right-handed
    cylindrical frame. For a flux-surface-enclosed area, this gives the
    cumulative quantity represented by [toroidal current due to wave-driven
    current drive](name:toroidal_current_due_to_wave_driven_current_drive); the
    same current may be decomposed into per-toroidal-mode current.

    Sign convention: Positive when the wave-driven plasma current flows in the
    direction of increasing toroidal angle $\phi$.
  unit: A

- name: current_of_antenna_strap
  description: |-
    Current of antenna strap is the oscillatory electric current carried along
    an auxiliary-heating antenna strap during electromagnetic-wave coupling to a
    plasma.
  documentation: |-
    Current of antenna strap is the oscillatory electric current carried along
    an auxiliary-heating antenna strap during electromagnetic-wave coupling to a
    plasma. It is a scalar line-current quantity associated with the strap
    itself.

    The strap current is the current-density flux through an oriented
    cross-section of the same strap:

    $$
    I_s(t) = \int_{S_s} \mathbf{J}(\mathbf{x},t) \cdot d\mathbf{S}
    $$

    where $I_s(t)$ is the current of antenna strap at time $t$, $S_s$ is an
    oriented cross-section of that strap, $\mathbf{J}(\mathbf{x},t)$ is the
    electric current density in the strap at position $\mathbf{x}$ and time $t$,
    and $d\mathbf{S}$ is the vector area element whose orientation sets the
    positive strap direction.

    This quantity is scoped to an antenna strap, not to an arbitrary antenna
    conductor, feed line, matching network, or complete antenna system. It
    denotes current carried by the strap material and is not a voltage,
    impedance, launched power, absorbed power, or a sum over multiple distinct
    straps.

    [Wave current of antenna strap](name:wave_current_of_antenna_strap) is the
    radio-frequency-wave specialization of this strap current and characterizes
    the same strap-carried current with a specified wave-current representation,
    such as peak amplitude or root mean square. The parent quantity identifies
    the common antenna-strap current shared by such specialized names without
    replacing their representation qualifiers.

    Sign convention: Positive when conventional current has a net projection
    along the assigned positive direction of the antenna strap.
  unit: A

- name: curvature_of_electron_cyclotron_launcher_mirror
  description: |-
    Radius of curvature of an electron-cyclotron launcher mirror along a
    selected first or second local tangential direction, characterizing
    directional surface bending relevant to reflected-beam focusing or
    defocusing.
  documentation: |-
    Directional radius of curvature is the length scale of bending of the
    electron-cyclotron launcher mirror surface in a selected mirror-local
    tangential direction. It characterizes the direction-dependent geometric
    contribution of the mirror surface to reflected-beam focusing or defocusing.

    For direction $i$, the radius is the reciprocal of the magnitude of the
    surface's normal curvature in that direction:

    $$
    R_i = \frac{1}{|\kappa_i|}
    $$

    where $R_i$ is the radius of curvature, $\kappa_i$ is the normal curvature
    of the mirror surface in the normal section tangent to direction $i$, and
    $i$ identifies the selected first or second local tangential direction. A
    planar direction has zero normal curvature and an unbounded radius.

    The selected direction is the [first local tangential
    direction](name:first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror)
    or the [second local tangential
    direction](name:second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror).
    The radius applies only when curvature is specified in that direction:
    curvature types 2, 4, or 5 for the first direction, and types 3 or 5 for the
    second. It is directional, not an average over the two directions.

    The corresponding [first local tangential
    width](name:first_local_tangential_width_of_electron_cyclotron_launcher_mirror)
    and [second local tangential
    width](name:second_local_tangential_width_of_electron_cyclotron_launcher_mirror)
    describe surface extent rather than bending. This mirror-surface radius is
    distinct from the [wave curvature of an electron-cyclotron
    beam](name:wave_curvature_of_electron_cyclotron_beam), which describes the
    beam's phase-front curvature.
  unit: m

- name: fast_electron_absorbed_wave_power
  description: |-
    Fast electron power is the total coherent-wave power absorbed by the fast
    (non-thermal) electron population, integrated over the plasma volume.
  documentation: |-
    Fast electron absorbed wave power is the total coherent-wave power
    transferred to the fast, non-thermal electron population throughout the
    plasma volume. It is the fast-electron component of [electron absorbed wave
    power](name:electron_absorbed_wave_power).

    The volume-integrated power is defined by

    $$
    P_{e,\mathrm{fast}} = \int_V p_{e,\mathrm{fast}}(\mathbf{x})\,\mathrm{d}V
    $$

    where $P_{e,\mathrm{fast}}$ is the fast-electron absorbed wave power,
    $p_{e,\mathrm{fast}}(\mathbf{x})$ is the local coherent-wave power density
    absorbed by fast electrons at position $\mathbf{x}$, and $V$ is the plasma
    volume.

    This quantity excludes wave power absorbed by bulk thermal electrons, ions,
    and other populations, as well as wave power that is launched but not
    absorbed. Unlike [fast electron power at inside flux
    surface](name:fast_electron_power_at_inside_flux_surface), it represents the
    total plasma-volume integral rather than a cumulative value inside a
    specified flux surface. The population scope is complementary to [thermal
    electron absorbed wave power](name:thermal_electron_absorbed_wave_power).
  unit: W

- name: fast_electron_absorbed_wave_power_density
  description: |-
    Volumetric rate of coherent radio-frequency wave energy absorption by fast,
    nonthermal electrons, including its flux-surface-averaged form.
  documentation: |-
    Fast-electron absorbed wave power density is the rate at which coherent
    radio-frequency waves transfer energy directly to fast, nonthermal electrons
    per unit physical volume. It describes local deposition and its average over
    a magnetic flux surface.

    The flux-surface-averaged form is defined by

    $$
    \overline{p}_{e,f}^{\mathrm{abs}} = \left\langle p_{e,f}^{\mathrm{abs}} \right\rangle_{\mathrm{fs}} = \left\langle \frac{dP_{e,f}^{\mathrm{abs}}}{dV} \right\rangle_{\mathrm{fs}}
    $$

    where $\overline{p}_{e,f}^{\mathrm{abs}}$ is the flux-surface-averaged
    absorbed wave power density, $p_{e,f}^{\mathrm{abs}}$ is its local
    counterpart, $P_{e,f}^{\mathrm{abs}}$ is the wave power absorbed by fast
    electrons, $V$ is physical volume, and $\langle\cdot\rangle_{\mathrm{fs}}$
    denotes a flux-surface average. The subscripts $e$ and $f$ identify
    electrons and the fast population, respectively.

    The recipient population is restricted to fast electrons; thermal-electron
    and ion absorption are excluded. The averaging aggregates spatial deposition
    on the flux surface, not different recipient populations. The corresponding
    ion-recipient quantity is [fast-ion power
    density](name:fast_ion_power_density).

    This quantity excludes launched wave power and subsequent [collisional
    electron energy transfer](name:electron_power_density_due_to_collisions).
    Its volume integral gives the fast-electron contribution to [absorbed wave
    power](name:absorbed_wave_power); integrating the flux-surface-averaged form
    over the corresponding enclosed-volume intervals gives the same
    contribution.
  unit: W.m^-3

- name: fast_ion_charge_state_absorbed_wave_power
  description: |-
    Volume-integrated electromagnetic-wave power transferred directly to fast
    ions in one specified ion charge state, excluding collisional energy
    exchange.
  documentation: |-
    This quantity is the direct electromagnetic-wave energy transfer rate to the
    fast, non-thermal ions belonging to one specified charge state, integrated
    over the full plasma volume.

    The defining relation is

    $$
    P_{q,\mathrm{wave}} = \int_V p_{q,\mathrm{wave}}(\mathbf{r})\,dV
    $$

    where $P_{q,\mathrm{wave}}$ is the absorbed wave power for charge state $q$,
    $p_{q,\mathrm{wave}}(\mathbf{r})$ is its local wave-power deposition
    density, $\mathbf{r}$ is position, and $V$ is the full plasma volume.

    This is a charge-state-resolved component of ion charge-state absorbed wave
    power: it excludes power transferred subsequently through Coulomb collisions
    and is not the cumulative value inside a selected flux surface, which is
    represented by [fast ion charge-state power at inside flux
    surface](name:fast_ion_charge_state_power_at_inside_flux_surface).
  unit: W

- name: first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  description: |-
    First local tangential coordinate of a point on the closed outline of an
    electron-cyclotron launcher mirror is its signed displacement from the
    mirror-local origin along the first local tangential direction. That
    direction is the more horizontally directed in-plane mirror tangent oriented
    toward increasing toroidal angle φ in the right-handed cylindrical (R, φ, Z)
    frame, where R is major radius, φ is toroidal angle, and Z is vertical
    height.
  documentation: |-
    First local tangential coordinate of a point on the closed outline of an
    electron-cyclotron launcher mirror is the signed scalar projection of the
    point displacement from the mirror-local origin onto the mirror's first
    local tangential axis. The mirror-local orthonormal triad $(\hat{\mathbf
    t}_1, \hat{\mathbf t}_2, \hat{\mathbf n})$ has $\hat{\mathbf t}_1$ and
    $\hat{\mathbf t}_2$ tangent to the mirror outline plane and $\hat{\mathbf
    n}$ as the plasma-facing normal. The first local tangential axis
    $\hat{\mathbf t}_1$ is the more horizontally directed in-plane tangent,
    oriented toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The coordinate is defined by the Euclidean projection of the outline-point
    position relative to the mirror-local origin onto the first local tangential
    unit vector:

    $$
    \xi_1 = (\mathbf r - \mathbf r_0) \cdot \hat{\mathbf t}_1
    $$

    where $\xi_1$ is the first local tangential coordinate of the mirror outline
    point, $\mathbf r$ is the position vector of the outline point, $\mathbf
    r_0$ is the mirror-local origin, and $\hat{\mathbf t}_1$ is the first local
    tangential unit vector.

    This coordinate is paired with the [second local tangential coordinate of
    the electron-cyclotron launcher
    mirror](name:second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror),
    which uses $\hat{\mathbf t}_2$ in the same mirror-local tangential plane.
    The second local tangential direction is fixed by $\hat{\mathbf t}_2 =
    \hat{\mathbf n} \times \hat{\mathbf t}_1$, so $\hat{\mathbf t}_1 \times
    \hat{\mathbf t}_2 = \hat{\mathbf n}$. This local coordinate is distinct from
    locating the mirror in the right-handed cylindrical $(R, \phi, Z)$ frame
    through quantities such as the radial centroid of the electron-cyclotron
    launcher mirror and the [vertical coordinate of the electron-cyclotron
    launcher
    mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror).

    Sign convention: Positive when the displacement from the mirror-local origin
    to the outline point has a component in the direction of $\hat{\mathbf
    t}_1$.
  unit: m

- name: first_local_tangential_coordinate_of_neutral_beam_injector
  description: |-
    Signed coordinate of a neutral beam injector source-outline vertex along the
    injector’s first local tangential direction.
  documentation: |-
    This quantity is the signed first local tangential coordinate of a point on
    a neutral beam injector source outline. It belongs to the injector’s
    object-local frame and is paired with the [second local tangential
    coordinate](name:second_local_tangential_coordinate_of_neutral_beam_injector)
    to describe the outline in its tangent plane.

    The coordinate is defined by

    $$
    x_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_1
    $$

    where $x_1$ is the first local tangential coordinate, $\mathbf{r}$ is the
    position of the source-outline vertex, $\mathbf{r}_0$ is the origin of the
    injector-local frame, and $\hat{\mathbf{e}}_1$ is its positive first local
    tangential unit vector.

    The origin and orientation are determined by the neutral beam injector’s
    local geometric convention; this quantity is not a coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame and does not specify that
    convention by itself.

    Sign convention: Positive when the outline vertex lies in the direction of
    the positive first local tangential basis vector from the local-frame
    origin.
  unit: m

- name: first_local_tangential_width_of_electron_cyclotron_launcher_mirror
  description: |-
    Full physical extent of an electron-cyclotron launcher mirror along its
    first local tangential axis. This object-local axis is tangent to the mirror
    surface and is the axis parameterized by the first local tangential
    coordinate; the width applies to rectangular mirror geometry.
  documentation: |-
    Full physical extent of an electron-cyclotron launcher mirror along its
    first local tangential axis is the edge-to-edge span of the mirror surface
    in that object-local tangential direction. The first local tangential axis
    is the axis parameterized by the [first local tangential
    coordinate](name:first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror).

    For a rectangular mirror surface, let $u_1$ denote the first local
    tangential coordinate on the mirror surface $\mathcal{M}$. The width is the
    range of that coordinate over the mirror surface:

    $$
    w_1 = \max_{\mathbf{x}\in\mathcal{M}} u_1(\mathbf{x}) - \min_{\mathbf{x}\in\mathcal{M}} u_1(\mathbf{x})
    $$

    where $w_1$ is the first local tangential width and $\mathbf{x}$ is a point
    on the mirror surface.

    This quantity applies to rectangular mirror geometry and is distinct from
    both a coordinate value at a point and the [second local tangential
    width](name:second_local_tangential_width_of_electron_cyclotron_launcher_mirror).
    As a full extent rather than a signed displacement, it is unchanged by
    reversing the positive sense of the first local tangential coordinate.
  unit: m

- name: first_local_tangential_width_of_neutral_beam_injector
  description: |-
    Full transverse extent of the rectangular neutral-beam injector ion-source
    aperture along the first local tangential axis, defining one aperture
    dimension for beam extraction.
  documentation: |-
    Full transverse extent of the rectangular neutral-beam injector ion-source
    aperture along the first local tangential axis is the distance between the
    two opposite aperture edges in that object-local tangential direction. It
    defines one aperture dimension for beam extraction.

    The width is defined by the range of the first local tangential coordinate
    over the aperture surface:

    $$
    w_1 = \max_{\mathbf{r}\in A} \xi_1(\mathbf{r}) - \min_{\mathbf{r}\in A} \xi_1(\mathbf{r})
    $$

    where $w_1$ is the first local tangential width, $A$ is the rectangular
    ion-source aperture surface, $\mathbf{r}$ is a point on that aperture
    surface, and $\xi_1$ is the object-local coordinate along the first local
    tangential axis.

    This quantity applies to rectangular ion-source aperture geometry. It is
    distinct from the width along the second local tangential axis and from any
    beam envelope, divergence, or focal width away from the ion-source aperture.
    As a full width defined by a maximum minus a minimum, it is non-negative:
    $w_1 \ge 0$.
  unit: m

- name: forward_power_of_ion_cyclotron_heating_antenna
  description: |-
    Forward power of an ion-cyclotron heating antenna is the incident
    radio-frequency power arriving at its back from the source through the feed
    line.
  documentation: |-
    Forward power of an ion-cyclotron heating antenna denotes the incident
    radio-frequency traveling-wave power arriving at the back of the antenna
    through its feed line. It is the source-to-antenna component at the antenna
    reference plane, before reflected power is subtracted.

    For a single antenna, the power components referred to the same reference
    plane satisfy

    $$
    P_{\mathrm{fwd}} = P_{\mathrm{launched}} + P_{\mathrm{ref}}
    $$

    where $P_{\mathrm{fwd}}$ is the forward incident power,
    $P_{\mathrm{launched}}$ is the net [launched
    power](name:launched_power_of_ion_cyclotron_heating_antenna), and
    $P_{\mathrm{ref}}$ is the [reflected
    power](name:reflected_power_of_ion_cyclotron_heating_antenna) returning
    toward the source.

    This quantity applies to one ion-cyclotron heating antenna, not a sum over
    an antenna set. It includes only the forward-traveling component, excluding
    the backward-traveling reflected component. Subtracting reflected power
    gives net launched power; forward power is neither this net quantity nor the
    power subsequently absorbed by the plasma.
  unit: W

- name: forward_power_of_lower_hybrid_antenna
  description: |-
    Forward power of a lower-hybrid antenna is the incident RF power traveling
    from the transmission line toward the antenna input reference plane.
  documentation: |-
    Forward power of a lower-hybrid antenna is the nonnegative RF power
    propagating toward the antenna input reference plane from the transmission
    line. It is one per-antenna component of the wave-power budget represented
    by power of a lower-hybrid antenna.

    The per-antenna power components satisfy:

    $$
    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}
    $$

    where $P_\mathrm{forward}$ is the incident power arriving at the reference
    plane, $P_\mathrm{reflected}$ is the power returning toward the transmission
    line, and $P_\mathrm{launched}$ is the net power entering the vacuum vessel.
    Thus, forward power includes the portion subsequently reflected and is
    distinct from [reflected power of a lower-hybrid
    antenna](name:reflected_power_of_lower_hybrid_antenna) and [launched power
    of a lower-hybrid antenna](name:launched_power_of_lower_hybrid_antenna). The
    quantity applies to one antenna and is not an aggregate over multiple
    antennas.
  unit: W

- name: height_of_antenna_strap
  description: |-
    Full vertical extent of an ICRH antenna strap conductor cross-section,
    measured parallel to the Z direction in the right-handed cylindrical (R, φ,
    Z) frame.
  documentation: |-
    The antenna-strap height is the full vertical extent of the rectangular
    conductor cross-section, measured parallel to the $Z$ direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It is a geometric
    cross-section dimension, not the antenna elevation or its distance from the
    plasma.

    $$
    H = Z_{\max} - Z_{\min}
    $$

    where $H$ is the strap height and $Z_{\max}$ and $Z_{\min}$ are the vertical
    coordinates of the upper and lower cross-section boundaries. The dimension
    is non-negative and complements the toroidal width of the antenna strap and
    [thickness of the antenna strap](name:thickness_of_antenna_strap), which
    describe the other conductor extents. For an annular cross-section, the
    radial boundaries are specified by the [inner radius of the antenna
    strap](name:inner_radius_of_antenna_strap) and [outer radius of the antenna
    strap](name:outer_radius_of_antenna_strap).
  unit: m

- name: inner_radius_of_antenna_strap
  description: |-
    Inner radius of an antenna strap is the perpendicular distance from the
    strap conductor axis to the inner cylindrical boundary of its annular
    cross-section.
  documentation: |-
    Inner radius of an antenna strap is the perpendicular distance from the
    strap conductor axis to the inner cylindrical boundary of its annular
    cross-section. It identifies the inner boundary of the conductor material
    and is the smaller of the two annular boundary radii.

    Use [radius of antenna strap](name:radius_of_antenna_strap) for the
    boundary-radius concept without selecting a surface, and [outer radius of
    antenna strap](name:outer_radius_of_antenna_strap) for the larger boundary
    radius. If $r_\mathrm{in}$ and $r_\mathrm{out}$ denote the inner and outer
    radii, respectively, then $0 \le r_\mathrm{in} \le r_\mathrm{out}$. This
    quantity is distinct from the [height of antenna
    strap](name:height_of_antenna_strap), [toroidal width of antenna
    strap](name:toroidal_width_of_antenna_strap), and [thickness of antenna
    strap](name:thickness_of_antenna_strap).
  unit: m

- name: ion_absorbed_power_of_beam_tracing_beam
  description: |-
    Ion absorbed power of a beam-tracing beam is the electromagnetic wave power
    transferred from a single coherent beam to a selected ion species along its
    trajectory.
  documentation: |-
    The ion absorbed power of a beam-tracing beam is the total electromagnetic
    wave power transferred from a single coherent beam to one selected ion
    species along the beam trajectory. It is a species-resolved contribution to
    the [absorbed power of a beam-tracing
    beam](name:absorbed_power_of_beam_tracing_beam), distinct from the electron
    contribution represented by [electron absorbed power of a beam-tracing
    beam](name:electron_absorbed_power_of_beam_tracing_beam).

    The species partition of the beam power balance is defined by

    $$
    P_{\mathrm{abs}} = P_e + \sum_s P_{\mathrm{ion},s}
    $$

    where $P_{\mathrm{abs}}$ is the total absorbed beam power, $P_e$ is the
    electron contribution, $P_{\mathrm{ion},s}$ is the power absorbed by ion
    species $s$, and the sum is over the contributing ion species. This quantity
    denotes one term $P_{\mathrm{ion},s}$; its charge-state-resolved counterpart
    is [ion charge-state absorbed power of a beam-tracing
    beam](name:ion_charge_state_absorbed_power_of_beam_tracing_beam). It
    excludes residual wave power represented by power of a beam-tracing beam and
    differs from volume-integrated [ion absorbed wave
    power](name:ion_absorbed_wave_power).
  unit: W

- name: ion_charge_state_absorbed_power_of_beam_tracing_beam
  description: |-
    Wave power absorbed by ions of a specified charge state from a single
    coherent beam-tracing beam, giving the charge-state-resolved ion
    contribution to total path-integrated wave energy deposition for that beam.
  documentation: |-
    The ion charge-state absorbed power of a beam-tracing beam is the total wave
    power transferred from a single traced coherent electromagnetic beam to the
    ionic population in a specified charge state over its computed propagation
    path. It is the charge-state-resolved ion contribution to the species-summed
    [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam),
    complementing the electron channel provided by
    [electron_absorbed_power_of_beam_tracing_beam](name:electron_absorbed_power_of_beam_tracing_beam).

    For a ray arc length $s$ increasing along the direction of wave propagation,
    the absorbed power for ion charge state $z$ is

    $$
    P_{\mathrm{abs},z} = \int_{s_0}^{s_{\mathrm{end}}} 2\kappa_{i,z}(s)\,P(s)\,ds
    $$

    where $\kappa_{i,z}(s)$ is the spatial amplitude-damping coefficient for the
    specified ion charge state in m$^{-1}$, $P(s)$ is the remaining beam power
    in W at arc-length position $s$ in m, and $s_0$ and $s_{\mathrm{end}}$ are
    the start and end arc-length positions. The factor of 2 converts
    amplitude-damping to power-damping because wave power is proportional to
    squared wave-field amplitude, consistent with the parent formulation.

    Summing over all charge states of all ion species and adding the electron
    contribution recovers
    [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam)
    for that beam. The residual power_of_beam_tracing_beam at the beam end
    equals the entering power minus the sum of all species- and
    charge-state-resolved absorbed powers.
  unit: W

- name: ion_charge_state_power
  description: |-
    Volume-integrated power transferred from coherent electromagnetic waves to a
    selected ion population, with specializations resolving thermal populations
    and charge states.
  documentation: |-
    Volume-integrated ion power is the electromagnetic-wave power transferred to
    a selected ion population throughout the plasma. It denotes absorbed
    transfer to the ions rather than the power incident on, launched by, or
    remaining in the wave.

    The volume-integrated quantity is defined from the corresponding local
    transfer-power density:

    $$
    P_{\mathrm{ion}} = \int_{V_{\mathrm{plasma}}} p_{\mathrm{ion}}(\mathbf{r})\,dV
    $$

    where $P_{\mathrm{ion}}$ is the total power transferred to the selected ion
    population, $p_{\mathrm{ion}}(\mathbf{r})$ is the local power density
    transferred to that population at position $\mathbf{r}$,
    $V_{\mathrm{plasma}}$ is the plasma volume, and $dV$ is the differential
    volume element.

    The recipient population is selected by the specialization and may be
    resolved by thermal population and charge state; [thermal ion charge-state
    power](name:thermal_ion_charge_state_power) is the instance for bulk thermal
    ions in one specified charge state. The defining aggregation is over plasma
    volume, and a charge-state-resolved instance does not implicitly sum over
    other charge states.

    Power transferred to electrons, power not transferred from the wave, and
    wave-system generator or launched power are outside this quantity. It is
    distinct from the local power-density quantity, which describes the spatial
    distribution before volume integration.

    For a matching specialization, integrating [thermal ion charge-state power
    density](name:thermal_ion_charge_state_power_density) over the plasma volume
    gives the corresponding volume-integrated power. The broader [ion absorbed
    wave power](name:ion_absorbed_wave_power) describes coherent-wave power
    transferred directly to ion populations, while [total ion
    power](name:total_ion_power) is a broader ion-power aggregation that can
    include sources or sinks other than coherent electromagnetic-wave
    absorption.
  unit: W

- name: launched_power_of_electron_cyclotron_beam
  description: |-
    Power injected into the vacuum vessel by one electron-cyclotron beam after
    transmission losses and before plasma absorption or reflection.
  documentation: |-
    Launched power is the electromagnetic power carried by one specified
    electron-cyclotron beam into the vacuum vessel toward the plasma. It
    represents injected beam power rather than energy deposited in the plasma.

    The power is defined as the rate of electromagnetic energy transport:

    $$
    P_{\mathrm{launched}} = \frac{dE}{dt}
    $$

    where $P_{\mathrm{launched}}$ is the launched beam power, $E$ is the
    electromagnetic energy transported by the beam, and $t$ is time.

    This quantity applies to an individual electron-cyclotron beam and is not an
    aggregate over multiple beams or a complete launcher system. Transmission
    losses before launch are excluded from the launched value; plasma absorption
    and power reflected after launch are also excluded.

    The beam's carrier frequency, represented by the [electron-cyclotron beam
    frequency](name:frequency_of_electron_cyclotron_beam), determines its
    cyclotron-resonance condition, while launched power specifies the strength
    of the injected electromagnetic beam.
  unit: W

- name: launched_power_of_ion_cyclotron_heating_antenna
  description: |-
    Radio-frequency power launched toward the plasma by an ion-cyclotron heating
    antenna, equal to forward incident power minus reflected return power.
  documentation: |-
    The quantity denotes radio-frequency wave power launched toward the plasma
    by an ion-cyclotron resonance heating antenna at the antenna reference
    plane. It is the net launched component after accounting for the forward and
    reflected traveling-wave components.

    For a single antenna, the launched power is defined by

    $$
    P_{\mathrm{launched}} = P_{\mathrm{fwd}} - P_{\mathrm{ref}}
    $$

    where $P_{\mathrm{launched}}$ is the launched radio-frequency power,
    $P_{\mathrm{fwd}}$ is the forward incident power traveling from the
    generator toward the antenna, and $P_{\mathrm{ref}}$ is the reflected power
    traveling from the antenna toward the generator.

    This quantity applies to one ion-cyclotron heating antenna at its reference
    plane and represents a net directional power, not a sum over an antenna set.
    It excludes the reflected component and the power subsequently absorbed by
    the plasma.

    Within the broader power of an ion-cyclotron heating antenna quantity, this
    is the launched-power specialization. The [forward
    power](name:forward_power_of_ion_cyclotron_heating_antenna) and [reflected
    power](name:reflected_power_of_ion_cyclotron_heating_antenna) are the
    components combined by the defining relation, whereas power due to
    ion-cyclotron heating denotes power coupled from the waves into the plasma.
  unit: W

- name: launched_power_of_lower_hybrid_antenna
  description: |-
    Launched power of a lower-hybrid antenna is the net RF power coupled into
    the vacuum vessel toward the plasma, equal to the forward power minus the
    reflected power at the launching unit. The launching unit may be an antenna
    module, a single antenna, or the complete antenna set, for which the value
    is the sum over the constituent units.
  documentation: |-
    Launched power of a lower-hybrid antenna is the nonnegative net RF power
    coupled from the launching structure into the vacuum vessel toward the
    plasma. It is the net-transfer component of the wave-power budget
    represented by [power of a lower-hybrid
    antenna](name:power_of_lower_hybrid_antenna).

    The launched power is defined by the balance:

    $$
    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}
    $$

    where $P_\mathrm{forward}$ is the [forward power of a lower-hybrid
    antenna](name:forward_power_of_lower_hybrid_antenna) arriving at the antenna
    input reference plane from the transmission line, $P_\mathrm{reflected}$ is
    the [reflected power of a lower-hybrid
    antenna](name:reflected_power_of_lower_hybrid_antenna) returning toward the
    transmission line, and $P_\mathrm{launched}$ is the net power entering the
    vacuum vessel.

    The launching unit may be an antenna module, a single antenna, or the
    complete lower-hybrid antenna set. The quantity is extensive, so the
    launched power of a composite unit is the sum of the launched powers of its
    constituent units.

    Launched power excludes the reflected contribution and is distinct from
    forward power, which includes the portion subsequently reflected. It denotes
    the net power delivered across the launching aperture into the vessel, not
    the generator output on the transmission-line side of the reference plane,
    and it does not by itself resolve where the power is subsequently deposited
    within the plasma.

    The [toroidal-mode-resolved launched
    power](name:launched_power_per_toroidal_mode_of_lower_hybrid_antenna) and
    the [jointly toroidal- and poloidal-mode-resolved launched
    power](name:launched_power_per_toroidal_and_poloidal_mode_number_of_lower_hybrid_antenna)
    are distributions of this same quantity over refractive-index intervals;
    integrating them over those intervals recovers the launched power of the
    corresponding antenna row.
  unit: W

- name: maximum_angle_of_electron_cyclotron_launcher_mirror
  description: |-
    Maximum allowed value of the signed rotation angle of an electron-cyclotron
    launcher mirror within its mechanical travel range.
  documentation: |-
    The upper mechanical travel limit is the greatest permitted value of the
    mirror’s signed rotation angle, bounding the accessible steering range of
    the launcher. It is a limit of the mechanical actuator, not the mirror angle
    during a particular operating condition.

    Let $\theta$ denote the signed mirror angle defined by angle of
    electron-cyclotron launcher mirror. The upper limit $\theta_{\max}$ is
    defined by

    $$
    \theta_{\max} = \sup\{\theta \mid \theta\text{ is mechanically accessible}\}
    $$

    The quantity excludes the lower travel limit and does not describe the
    mirror’s position unless that position equals the upper boundary of the
    allowed range.

    Sign convention: Positive when the mirror rotates in the positive sense
    defined for angle of electron-cyclotron launcher mirror.
  unit: rad

- name: net_power_due_to_ion_cyclotron_heating
  description: |-
    Net ion-cyclotron heating power is the radio-frequency energy absorbed per
    unit time by the plasma from a specific launcher, excluding losses outside
    the plasma.
  documentation: |-
    Net ion-cyclotron heating power is the rate at which radio-frequency waves
    from a specific launcher transfer energy to the plasma. It includes
    absorption by all plasma particle populations, not only ions.

    The absorbed power is defined by

    $$
    P = \int_{V_{\mathrm{pl}}} p_{\mathrm{abs}}\,dV
    $$

    where $P$ is the net absorbed power attributable to the launcher,
    $V_{\mathrm{pl}}$ is the entire plasma volume, $p_{\mathrm{abs}}$ is the
    local radio-frequency energy-transfer rate per volume summed over all
    absorbing plasma populations and averaged over a radio-frequency cycle, and
    $dV$ is a volume element.

    This quantity applies to one launcher, not a sum over launchers. Unabsorbed
    wave power and dissipation outside the plasma are excluded.

    The [launched power of an ion-cyclotron heating
    antenna](name:launched_power_of_ion_cyclotron_heating_antenna) is the
    forward-minus-reflected power directed into the vessel before plasma
    absorption; it need not equal the absorbed power defined here. The [total
    power due to ion-cyclotron
    heating](name:total_power_due_to_ion_cyclotron_heating) sums launched power
    over all heating antennas and therefore differs in both absorption scope and
    launcher aggregation.
  unit: W

- name: ordinary_mode_fraction_of_electron_cyclotron_beam
  description: |-
    Fraction of the launched power of an electron-cyclotron beam carried by the
    ordinary polarization mode, ranging from pure X-mode to pure O-mode.
  documentation: |-
    The ordinary-mode power fraction quantifies the share of one launched
    electron-cyclotron beam carried by the ordinary (O) polarization mode rather
    than the extraordinary (X) mode.

    It is defined by the ratio

    $$
    f_O = \frac{P_O}{P_{\mathrm{EC}}}
    $$

    where $f_O$ is the ordinary-mode power fraction, $P_O$ is the launched power
    in the ordinary mode, and $P_{\mathrm{EC}}$ is the total launched power of
    the electron-cyclotron beam.

    The quantity applies to a single electron-cyclotron beam and uses launched
    beam power aggregated over the beam's ordinary-mode content. It excludes
    power from other beams and does not represent the total launched power
    itself. Values of $f_O=1$ and $f_O=0$ denote pure ordinary-mode and pure
    extraordinary-mode launch, respectively.

    This power partition is distinct from [polarization ellipticity of a
    polarimeter beam](name:polarization_ellipticity_of_polarimeter_beam), which
    describes the shape and handedness of a polarization ellipse rather than the
    O-mode fraction of an electron-cyclotron beam.
  unit: '1'

- name: outer_radius_of_antenna_strap
  description: |-
    Outer radius of an antenna strap is the perpendicular distance from the
    strap conductor axis to the outer cylindrical boundary of its annular
    cross-section.
  documentation: |-
    Outer radius of an antenna strap is the perpendicular distance from the
    strap conductor axis to the outer cylindrical boundary of its annular
    cross-section. It identifies the outer boundary of the conductor material
    and is the larger of the two annular boundary radii.

    Use [radius of antenna strap](name:radius_of_antenna_strap) for the
    boundary-radius concept without selecting a surface, and [inner radius of
    antenna strap](name:inner_radius_of_antenna_strap) for the smaller boundary
    radius. If $r_\mathrm{in}$ and $r_\mathrm{out}$ denote the [inner radius of
    antenna strap](name:inner_radius_of_antenna_strap) and the outer radius of
    antenna strap, respectively, then $0 \le r_\mathrm{in} \le r_\mathrm{out}$.
    This quantity is distinct from the [height of antenna
    strap](name:height_of_antenna_strap), [toroidal width of antenna
    strap](name:toroidal_width_of_antenna_strap), and [thickness of antenna
    strap](name:thickness_of_antenna_strap).
  unit: m

- name: parallel_peak_launched_refractive_index_of_lower_hybrid_antenna
  description: |-
    Peak value of the parallel refractive index in the lower-hybrid wave
    spectrum launched by an antenna. It is the signed value at the dominant
    spectral peak set by the measured phase difference between neighboring
    waveguide rows, not an algebraic maximum over all launched components.
  documentation: |-
    Peak value of the parallel refractive index in the lower-hybrid wave
    spectrum launched by an antenna is the signed parallel refractive-index
    coordinate of the dominant launched spectral peak. The parallel direction is
    taken along the local magnetic-field direction at the launcher aperture.

    The defining value is the refractive index associated with the peak parallel
    wave number of the launched spectrum:

    $$
    N_{\parallel,\mathrm{peak}} = \frac{c\,k_{\parallel,\mathrm{peak}}}{\omega}
    $$

    where $N_{\parallel,\mathrm{peak}}$ is the peak launched parallel refractive
    index, $c$ is the speed of light, $k_{\parallel,\mathrm{peak}}$ is the
    parallel wave number at the dominant peak of the launched lower-hybrid
    spectrum, and $\omega$ is the wave angular frequency.

    For this quantity, the dominant peak is the main spectral peak inferred from
    the measured phase difference between neighboring waveguide rows, through
    the row-to-row phase advance per projected row separation in the parallel
    phasing direction. This quantity is not the algebraic maximum of
    $N_\parallel$ over all launched components; if the main spectral peak lies
    at negative $N_\parallel$, the peak value is negative.
  unit: '1'

- name: parallel_wave_magnetic_field
  description: |-
    Signed component of the oscillatory electromagnetic-wave magnetic
    perturbation along the local equilibrium magnetic-field direction, distinct
    from the total parallel magnetic field.
  documentation: |-
    This quantity is the field-aligned component of the oscillatory magnetic
    perturbation carried by a coherent electromagnetic wave. It excludes
    equilibrium and other static magnetic-field contributions.

    The component is defined by

    $$
    B_{\rm parallel}^{\rm wave} = \delta\mathbf{B}_{\rm wave} \cdot \hat{\mathbf{b}}_{\rm eq}
    $$

    where $\delta\mathbf{B}_{\rm wave}$ is the wave magnetic-field perturbation
    and $\hat{\mathbf{b}}_{\rm eq} = \mathbf{B}_{\rm eq}/|\mathbf{B}_{\rm eq}|$
    is the local unit vector along the equilibrium magnetic field. It is a
    component of the parent wave magnetic field, not its magnitude or a
    complex-quadrature part. Unlike [parallel magnetic
    field](name:parallel_magnetic_field), it does not include the equilibrium
    field.

    Sign convention: Positive when the wave magnetic-field perturbation points
    in the direction of the local equilibrium magnetic-field unit vector.
  unit: T

- name: per_toroidal_mode_fast_electron_power_density
  description: |-
    Volumetric rate of coherent-wave energy absorption by fast, suprathermal
    electrons for each toroidal mode number, resolved across a poloidal
    cross-section or represented as a flux-surface average.
  documentation: |-
    Mode-resolved fast-electron absorbed wave power density is the rate at which
    coherent-wave energy is absorbed by fast, suprathermal electrons per unit
    physical volume for each toroidal mode number.

    For a toroidal mode number $n_\phi$, the local mode-resolved power density
    is defined as

    $$
    p_{e,\mathrm{fast}}^{(n_\phi)} = \frac{dP_{e,\mathrm{fast}}^{(n_\phi)}}{dV}
    $$

    where $p_{e,\mathrm{fast}}^{(n_\phi)}$ is the mode-resolved fast-electron
    power density, $P_{e,\mathrm{fast}}^{(n_\phi)}$ is the corresponding
    [mode-resolved fast-electron absorbed wave
    power](name:per_toroidal_mode_fast_electron_absorbed_wave_power), $V$ is
    physical volume, $n_\phi$ is the toroidal mode number, and the subscripts
    $e$ and $\mathrm{fast}$ identify the fast-electron recipient population.

    The recipient population is fast, suprathermal electrons; thermal-electron
    and ion absorption are distinct contributions. The quantity is specified
    separately for each toroidal mode number and may be given locally across a
    poloidal cross-section or as a flux-surface average over a magnetic flux
    surface.

    This is a volumetric absorption rate, not volume-integrated power or
    launched wave power. The toroidal mode number identifies the wave harmonic
    contributing to absorption, not a Fourier coefficient of the deposited-power
    field.

    Summing the mode contributions for the same spatial evaluation gives the
    [fast-electron absorbed wave power
    density](name:fast_electron_absorbed_wave_power_density). Integrating a
    mode-resolved density over physical volume gives its corresponding
    mode-resolved absorbed wave power. Fast-electron absorption is one recipient
    contribution to the [mode-resolved total absorbed wave power
    density](name:per_toroidal_mode_total_absorbed_wave_power_density), which
    includes other plasma populations.
  unit: W.m^-3

- name: per_toroidal_mode_thermal_ion_power_density
  description: |-
    Absorbed coherent-wave power density deposited in thermal ions of a selected
    species, resolved by toroidal mode number and represented locally across a
    poloidal cross-section or as a flux-surface average.
  documentation: |-
    Absorbed coherent-wave power density per toroidal mode is the rate at which
    energy from one toroidal Fourier component of a coherent wave is transferred
    directly to the thermal ions of a selected species per unit physical volume.
    It describes either the local spatial distribution across a poloidal
    cross-section or the flux-surface average of that density.

    For the local quantity, the mode-resolved deposition density is

    $$
    p_{i,\mathrm{th}}^{(n_\phi)}(\mathbf{x}) = \frac{dP_{i,\mathrm{th}}^{(n_\phi)}}{dV}(\mathbf{x})
    $$

    where $p_{i,\mathrm{th}}^{(n_\phi)}$ is the absorbed power density,
    $P_{i,\mathrm{th}}^{(n_\phi)}$ is the power transferred to the selected
    species' thermal ions by the coherent-wave harmonic with toroidal mode
    number $n_\phi$, $V$ is physical volume, and $\mathbf{x}$ is spatial
    position. The index $i$ identifies the selected ion species, and
    $\mathrm{th}$ identifies its thermal population.

    The quantity applies to the thermal-ion population of one selected species
    and one toroidal mode, and is summed over all charge states of that species,
    not over distinct ion species or modes. It may retain local variation across
    a poloidal cross-section or be averaged over a magnetic flux surface; the
    flux-surface average is not a pointwise value.

    It excludes absorption by electrons and nonthermal ions, as well as energy
    transfer through non-wave processes; it is not the net thermal-ion energy
    source from all processes. The [charge-state-resolved
    counterpart](name:per_toroidal_mode_thermal_ion_charge_state_power_density)
    resolves contributions by ion charge state, while [fast-ion power density
    per toroidal mode](name:per_toroidal_mode_fast_ion_power_density) describes
    deposition into nonthermal ions.

    Summing the modal contributions gives the mode-summed [thermal-ion absorbed
    wave power density](name:thermal_ion_absorbed_wave_power_density) for the
    same species and spatial averaging convention. Integrating the local density
    over the plasma volume gives the [thermal-ion absorbed wave power per
    toroidal mode](name:per_toroidal_mode_thermal_ion_absorbed_wave_power),
    which is a power rather than a power density.

    Sign convention: Positive when coherent-wave energy is transferred to the
    thermal ions of the selected species.
  unit: W.m^-3

- name: perpendicular_wave_vector_of_ion_cyclotron_heating_antenna
  description: |-
    Non-negative magnitude of the RF wave-vector component perpendicular to the
    local equilibrium magnetic field launched by an ion-cyclotron heating
    antenna.
  documentation: |-
    This quantity measures the transverse spatial variation of the
    radio-frequency wave launched by an ion-cyclotron heating antenna, relative
    to the local equilibrium magnetic field.

    The perpendicular wave-vector magnitude is defined by

    $$
    k_\perp = \left|\mathbf{k} - (\mathbf{k}\cdot\hat{\mathbf{b}})\hat{\mathbf{b}}\right|
    $$

    where $\mathbf{k}$ is the local RF wave vector,
    $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the unit vector along the
    local equilibrium magnetic field $\mathbf{B}$, and vertical bars denote
    vector magnitude.

    Only the component transverse to the magnetic field is included; the
    parallel component is excluded. The result is non-negative and has no
    propagation-direction sign. It is the antenna-specific counterpart of the
    general perpendicular wave-vector magnitude.
  unit: m^-1

- name: poloidal_angle_of_beam_tracing_beam
  description: |-
    Poloidal angle of a beam-tracing beam point is its angular position about
    the magnetic axis in the poloidal cross-section of the right-handed
    cylindrical (R, φ, Z) frame, measured clockwise from the outward +R
    direction.
  documentation: |-
    Poloidal angle of a beam-tracing beam point is the angular coordinate of
    that point about the magnetic axis in a poloidal cross-section of the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It is measured from
    the outward $+R$ direction and uses the clockwise poloidal-angle sense in
    the $(R,Z)$ plane.

    The clockwise branch of the angle is defined by the displacement of the beam
    point relative to the magnetic axis:

    $$
    \theta = \operatorname{atan2}\!\left[-(Z - Z_\mathrm{axis}),\, R - R_\mathrm{axis}\right]
    $$

    where $\theta$ is the poloidal angle of the beam-tracing beam point, $R$ and
    $Z$ are the beam point major radius and vertical height, and
    $R_\mathrm{axis}$ and $Z_\mathrm{axis}$ are the major radius and vertical
    height of the magnetic axis. The function $\operatorname{atan2}(y,x)$ is the
    quadrant-resolving arctangent; the negative first argument makes increasing
    $\theta$ clockwise when the cross-section is viewed with $R$ increasing to
    the right and $Z$ increasing upward.

    The scope is the position of beam-tracing beam trajectory points in the
    wave-propagation geometry. The value is pointwise for each trajectory point;
    no averaging over beam cross-section, path segment, or multiple beams is
    implied.

    This quantity is not the beam launch angle, propagation-direction angle,
    wave-vector pitch, toroidal angle $\phi$, or a flux-surface label. It is the
    beam-point locus counterpart of the [poloidal angle of a measurement
    position](name:poloidal_angle_of_measurement_position) and uses the same
    angular sense as the [poloidal angle of a flux
    surface](name:poloidal_angle_of_flux_surface); the distinction is the locus,
    not the angular convention.

    Sign convention: Positive when the displacement from the magnetic axis to
    the beam point is clockwise from the outward $+R$ direction in a poloidal
    cross-section of the right-handed cylindrical $(R, \phi, Z)$ frame viewed
    with $R$ increasing to the right and $Z$ increasing upward.
  unit: rad

- name: poloidal_launched_wave_index_of_lower_hybrid_antenna
  description: |-
    Signed dimensionless poloidal component of the launched lower-hybrid wave
    refractive-index vector, measured along increasing geometric poloidal angle
    about the antenna reference point.
  documentation: |-
    The poloidal launched-wave index is the projection of the lower-hybrid
    launched wave refractive-index vector onto the direction of increasing
    geometric poloidal angle about the antenna reference point. It describes the
    poloidal part of the launch spectrum and is distinct from the corresponding
    [toroidal launched-wave
    index](name:toroidal_launched_wave_index_of_lower_hybrid_antenna).

    The index is defined by

    $$
    N_\theta = \frac{\mathbf{k}\cdot\hat{\boldsymbol{e}}_\theta}{k_0} = \frac{k_\theta}{k_0}
    $$

    where $\mathbf{k}$ is the launched wave vector,
    $\hat{\boldsymbol{e}}_\theta$ is the unit vector in the direction of
    increasing geometric poloidal angle $\theta$, $k_\theta$ is the
    corresponding wave-vector projection, and $k_0 = \omega/c$ is the free-space
    wavenumber for angular frequency $\omega$ and speed of light $c$. The
    projection is defined in the right-handed cylindrical $(R, \phi, Z)$ frame.

    The quantity describes the launch condition only; it is not the local
    poloidal wave index after propagation or interaction with the plasma.

    Sign convention: Positive when the launched wave-vector projection points in
    the direction of increasing geometric poloidal angle $\theta$.
  unit: '1'

- name: poloidal_magnetic_flux_at_beam_tracing_point
  description: |-
    Signed poloidal magnetic flux function evaluated at a beam-tracing point,
    serving as the magnetic-surface label at that location.
  documentation: |-
    Poloidal magnetic flux at a beam-tracing point is the value of the
    equilibrium flux function at the point where the ray or beam path intersects
    the plasma. In an axisymmetric equilibrium, it labels the nested magnetic
    surface passing through that point and is distinct from the normalized
    coordinate derived from axis and boundary values.

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the flux function is
    defined by

    $$
    \psi(R,Z) = \int_0^R B_Z(R',Z)\,2\pi R'\,dR'
    $$

    where $R$ is major radius, $Z$ is vertical height, $R'$ is the integration
    radius, and $B_Z$ is the vertical magnetic-field component. The beam-tracing
    point supplies the coordinates at which $\psi$ is evaluated. Its value is
    related to [poloidal magnetic flux at a flux
    surface](name:poloidal_magnetic_flux_at_flux_surface), while [normalized
    poloidal flux coordinate](name:normalized_poloidal_flux_coordinate) uses the
    magnetic-axis and plasma-boundary flux values for normalization.

    Sign convention: Positive when $B_Z$ on the integration disk points in the
    $+Z$ direction.
  unit: Wb

- name: power_at_inside_flux_surface
  description: |-
    Cumulative power associated with a specified plasma heating or
    energy-transfer channel, integrated over the volume enclosed by a magnetic
    flux surface.
  documentation: |-
    This quantity is the cumulative power associated with one physically defined
    plasma heating or energy-transfer channel inside a specified magnetic flux
    surface. The parent does not by itself select a species, population, source,
    absorption mechanism, or whether the channel is absorbed power or net
    transferred power.

    For a volumetric channel power density, the cumulative power is

    $$
    P_{\mathrm{ch}}(\psi) = \int_{V(\psi)} p_{\mathrm{ch}}(\mathbf{r})\,\mathrm{d}V
    $$

    where $P_{\mathrm{ch}}(\psi)$ is the cumulative channel power, $\psi$ is the
    magnetic-flux-surface label, $V(\psi)$ is the volume enclosed by that
    surface, $p_{\mathrm{ch}}$ is the corresponding volumetric power density,
    $\mathbf{r}$ is position, and $\mathrm{d}V$ is the volume element.

    Species- and population-specific instances include [electron power at an
    inside flux surface](name:electron_power_at_inside_flux_surface), [ion power
    at an inside flux surface](name:ion_power_at_inside_flux_surface), and [ion
    charge-state power at an inside flux
    surface](name:ion_charge_state_power_at_inside_flux_surface). Absorbed-power
    channels count energy deposited in the recipient population, whereas
    net-transfer channels follow the specified transfer direction and may be
    signed.
  unit: W

- name: electron_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by all electron populations, thermal and
    fast, from a specified wave source or source set within the plasma volume
    enclosed by a magnetic flux surface.
  documentation: |-
    The electron power at inside flux surface is the cumulative rate at which
    wave energy from a specified source or source set is deposited into the
    electron population, spanning both thermal bulk electrons and fast
    suprathermal electrons, within the plasma volume bounded by a closed
    magnetic flux surface. It is an enclosed-volume channel quantity: each
    bounding surface includes all electron wave absorption inside that surface.

    For a local volumetric electron wave-power deposition density, the
    cumulative power is

    $$
    P_e(\psi_s) = \int_{V(\psi_s)} p_e^{\mathrm{wave}}(\mathbf{r})\,\mathrm{d}V
    $$

    where $P_e(\psi_s)$ is this cumulative electron wave power, $\psi_s$ is the
    magnetic-flux-surface label of the bounding surface, $V(\psi_s)$ is the
    plasma volume enclosed by that surface, $p_e^{\mathrm{wave}}$ is the local
    volumetric rate of wave energy deposition into the electron population,
    $\mathbf{r}$ is position, and $\mathrm{d}V$ is the volume element.

    For the same wave channel and enclosed volume, this quantity satisfies the
    population decomposition $P_e = P_{e,\mathrm{thermal}} +
    P_{e,\mathrm{fast}}$, with components [thermal electron power at inside flux
    surface](name:thermal_electron_power_at_inside_flux_surface) and [fast
    electron power at inside flux
    surface](name:fast_electron_power_at_inside_flux_surface). It is the
    electron counterpart of [ion power at inside flux
    surface](name:ion_power_at_inside_flux_surface) and a species-specific
    instance of [power at inside flux
    surface](name:power_at_inside_flux_surface); it excludes ion absorption and
    non-wave loss or exchange channels.

    Sign convention: Positive when wave energy is deposited into the electron
    population.
  unit: W

- name: fast_electron_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by the fast (suprathermal) electron
    population within the plasma volume enclosed by a specified magnetic flux
    surface.
  documentation: |-
    Fast electron power at an inside flux surface quantifies the total rate at
    which coherent wave energy is absorbed by the non-thermal fast electron
    population within the plasma volume bounded by a given magnetic flux
    surface. It is the fast-electron contribution to [electron power at an
    inside flux surface](name:electron_power_at_inside_flux_surface), distinct
    from the bulk thermal-electron contribution [thermal electron power at an
    inside flux surface](name:thermal_electron_power_at_inside_flux_surface).

    The quantity is obtained by integrating the flux-surface-averaged [fast
    electron power density](name:fast_electron_absorbed_wave_power_density)
    $p_{\mathrm{fast,e}}$ over the enclosed plasma volume:

    $$
    P_{\mathrm{fast,e}}(\rho) = \int_0^\rho p_{\mathrm{fast,e}}(\rho') \frac{dV}{d\rho'} \, d\rho'
    $$

    where $P_{\mathrm{fast,e}}(\rho)$ is the cumulative absorbed power, $\rho$
    labels the limiting flux surface, $\rho'$ is the integration variable,
    $p_{\mathrm{fast,e}}$ is the local fast-electron absorbed power density, and
    $dV/d\rho'$ is the differential enclosed volume per unit flux-surface label.
    Only absorption by fast electrons is included; thermal-electron and ion
    absorption, launched power, and power absorbed outside the enclosed volume
    are excluded. At the outermost closed flux surface, the quantity gives the
    total wave power absorbed by fast electrons.
  unit: W

- name: ion_charge_state_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by a specified ion charge state, integrated
    over the plasma volume enclosed by a selected magnetic flux surface.
  documentation: |-
    This quantity is the cumulative power associated with one physically defined
    plasma heating or energy-transfer channel inside a specified magnetic flux
    surface. Here, the channel is absorption of wave energy by one specified ion
    charge state, and the ion population may be thermal or fast.

    The cumulative absorbed power is

    $$
    P_{q,a}(\psi) = \int_{V(\psi)} p^{\mathrm{abs}}_{q,a}(\mathbf{r})\,\mathrm{d}V
    $$

    where $P_{q,a}(\psi)$ is the cumulative absorbed wave power, $q$ identifies
    the ion charge state, $a$ identifies the thermal or fast ion population,
    $\psi$ is the magnetic-flux-surface label, $V(\psi)$ is the enclosed plasma
    volume, $p^{\mathrm{abs}}_{q,a}$ is the corresponding volumetric wave-power
    absorption density, $\mathbf{r}$ is position, and $\mathrm{d}V$ is the
    volume element.

    This quantity is the charge-state-resolved specialization of [power at
    inside flux surface](name:power_at_inside_flux_surface). It excludes power
    absorbed by other charge states and power that is launched but not absorbed;
    corresponding thermal and fast instances are [thermal ion charge-state power
    at inside flux
    surface](name:thermal_ion_charge_state_power_at_inside_flux_surface) and
    [fast ion charge-state power at inside flux
    surface](name:fast_ion_charge_state_power_at_inside_flux_surface).
  unit: W

- name: ion_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by all ion populations — thermal and fast —
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: |-
    The ion power at inside flux surface is the cumulative rate at which wave
    energy is deposited into the ion population — spanning both thermal bulk
    ions and fast (non-thermal) ions — within the plasma volume bounded by a
    closed magnetic flux surface. It is the ion-channel component of the more
    general [power_at_inside_flux_surface](name:power_at_inside_flux_surface),
    separating ion energy absorption from the corresponding electron heating
    contribution.

    The quantity is the volume integral of the total ion wave-power density
    $p_i(\mathbf{r})$ over the plasma domain $V(\psi)$ enclosed by the flux
    surface labeled $\psi$:

    $$
    P_i(\psi) = \int_{V(\psi)} p_i(\mathbf{r}) \, dV
    $$

    where $p_i$ is the ion volumetric heating power density in W m$^{-3}$ and
    $\psi$ is the chosen flux-surface label, such as the normalized toroidal
    flux radius $\rho_\mathrm{tor,norm}$.

    The population-resolved breakdown is given by
    [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface)
    for the bulk ion channel and
    [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface)
    for non-thermal beam or fusion-born ions. This cumulative radial profile
    enables power-balance analysis and is inferred from combining absorbed-power
    density profiles computed via wave ray-tracing or Monte Carlo
    beam-deposition codes with equilibrium flux-surface geometry.
  unit: W

- name: fast_ion_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by the fast (non-thermal) ion population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: |-
    The fast-ion power at inside flux surface is the running volume integral of
    wave power deposited into the fast (non-thermal) ion population, giving the
    radial distribution of enclosed fast-ion wave absorption. It is the fast-ion
    component of the more general
    [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface),
    separating non-thermal ion energy absorption from the corresponding bulk
    thermal-ion contribution.

    The quantity is the volume integral of the fast-ion wave-power density
    $p_f(\mathbf{r})$ over the plasma domain $V(\psi)$ enclosed by the magnetic
    flux surface labeled $\psi$:

    $$
    P_f(\psi) = \int_{V(\psi)} p_f(\mathbf{r}) \, dV
    $$

    where $P_f(\psi)$ is the fast-ion power at inside flux surface, $p_f$ is the
    fast-ion volumetric wave-power density, $\mathbf{r}$ is position in physical
    space, $dV$ is the differential volume element, $V(\psi)$ is the enclosed
    plasma volume, and $\psi$ is the chosen magnetic flux-surface label.

    The scope is the plasma volume inside the selected closed magnetic flux
    surface and the fast, non-thermal ion population in that volume. Because
    this is an extensive population quantity, it is summed over the represented
    fast-ion species and over all their charge states; the charge-state-resolved
    counterpart is
    [fast_ion_charge_state_power_at_inside_flux_surface](name:fast_ion_charge_state_power_at_inside_flux_surface).
    It excludes wave energy deposited into the bulk thermal-ion population,
    represented by
    [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface),
    and excludes electron heating and wave power not absorbed by fast ions. For
    the same flux-surface label,
    [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface) is
    the sum of this fast-ion contribution and the thermal-ion contribution.
  unit: W

- name: power_due_to_electron_cyclotron_heating
  description: |-
    Net radiofrequency power absorbed by the plasma through electron cyclotron
    heating, with source aggregation determined by scope and excluding launched
    or reflected power.
  documentation: |-
    Electron-cyclotron heating power is the rate at which
    electron-cyclotron-range electromagnetic waves transfer energy to the
    plasma, principally through resonant electron absorption. It denotes
    deposited plasma heating power rather than generator, launched, transmitted,
    or reflected power.

    The absorbed power is defined by the volume integral of the local
    electron-cyclotron heating density:

    $$
    P_{\mathrm{EC}} = \int_{V_{\mathrm{plasma}}} Q_{\mathrm{EC}}(\mathbf{x})\,dV
    $$

    where $P_{\mathrm{EC}}$ is the absorbed power, $Q_{\mathrm{EC}}$ is the
    local power-transfer density, $\mathbf{x}$ is position, and
    $V_{\mathrm{plasma}}$ is the plasma volume. Source aggregation is
    scope-dependent; the [total electron-cyclotron heating
    power](name:total_power_due_to_electron_cyclotron_heating) sums the
    contributions from all electron-cyclotron wave sources. The quantity is
    non-negative for net absorption and is distinct from [electron absorbed wave
    power](name:electron_absorbed_wave_power) when that quantity includes wave
    absorption without restricting the mechanism to electron cyclotron heating.
  unit: W

- name: radial_offset_of_beamlet_group
  description: |-
    Signed major-radius displacement of a beamlet-group center from its nominal
    position, measured along the radial direction in the right-handed
    cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity is the signed radial displacement of a beamlet-group center
    from its nominal static position during a position variation. It describes
    only the major-radius component of the group's displacement, not the
    complete position vector or the injector's own reference position.

    In the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ frame, the
    offset is defined by:

    $$
    \Delta R_{\mathrm{bg}} = R_{\mathrm{bg}} - R_{\mathrm{bg},0}
    $$

    Here $R_{\mathrm{bg}}$ is the beamlet-group center's major-radius coordinate
    and $R_{\mathrm{bg},0}$ is its nominal static reference coordinate; $R$ is
    measured from the machine symmetry axis and increases outward.

    For dynamic beam tilting, the offset describes the group's positional
    variation and is distinct from the [radial coordinate of the neutral beam
    injector](name:radial_coordinate_of_neutral_beam_injector), which refers to
    the injector reference position. Related angular variation is described by
    the perturbed beam tilt angle of the neutral beam injector.

    Sign convention: Positive when the beamlet-group center lies at larger major
    radius than its nominal reference position.
  unit: m

- name: radius_of_neutral_beam_injector
  description: |-
    Radius of the circular ion-source surface from which neutral beams are
    extracted, defining the radial extent of its extraction aperture.
  documentation: |-
    This quantity is the radius of the circular ion-source surface from which a
    neutral-beam injector extracts its beam. It defines the radial extent of the
    extraction aperture.

    For a circular boundary, the radius is the distance from the surface center
    to any point on its circumference:

    $$
    r_s = \left\lVert \mathbf{x}-\mathbf{x}_c \right\rVert
    $$

    where $r_s$ is the ion-source-surface radius, $\mathbf{x}$ is the position
    of a point on the circular boundary, $\mathbf{x}_c$ is the position of the
    circle center, and the norm denotes Euclidean distance.

    The quantity applies to one neutral-beam injector unit and only to its
    circular ion-source geometry. It is not an aggregate over injector units and
    does not represent the radius of a beamlet-group tangency surface or another
    injector-associated aperture. For a rectangular ion-source aperture, the
    corresponding transverse dimensions are given by the [first local tangential
    width of the neutral-beam
    injector](name:first_local_tangential_width_of_neutral_beam_injector) and
    [second local tangential width of the neutral-beam
    injector](name:second_local_tangential_width_of_neutral_beam_injector),
    rather than by this radius.
  unit: m

- name: reflected_phase_of_ion_cyclotron_heating_antenna
  description: |-
    Relative phase angle of a reflected radio-frequency power-wave phasor at an
    antenna element in an ion-cyclotron heating launcher, measured relative to
    the forward power-wave phasor of that same element.
  documentation: |-
    This quantity is the relative phase of a complex reflected radio-frequency
    power-wave phasor at a selected antenna strap or module with respect to the
    complex forward radio-frequency power-wave phasor of the same strap or
    module. It specifies the element-local reflection phase of an ion-cyclotron
    heating launcher rather than an absolute phase or an inter-element phase.

    For element $i$, the reflected phase is defined by

    $$
    \phi_{\mathrm{ref},i} = \arg\!\left(b_i^{\mathrm{ref}} (a_i^{\mathrm{fwd}})^*\right) \pmod{2\pi}
    $$

    where $\phi_{\mathrm{ref},i}$ is this reflected phase, $b_i^{\mathrm{ref}}$
    is the complex reflected power-wave phasor at element $i$,
    $a_i^{\mathrm{fwd}}$ is the complex forward power-wave phasor at the same
    element, $(a_i^{\mathrm{fwd}})^*$ is its complex conjugate, and $\arg$
    extracts the phase angle. The phase is defined modulo $2\pi$.

    The scope is a single selected launcher strap or module and the pair of
    forward and reflected traveling power waves at the same element reference
    plane. The forward wave propagates toward the antenna element, and the
    reflected wave propagates away from the antenna element toward the feeding
    network. The first launcher element is not the phase reference for this
    quantity, and the quantity is not averaged or summed over launcher elements.

    This quantity is a reflected-wave member of the broader phase of the
    ion-cyclotron heating antenna family. It is distinct from the [wave phase of
    the ion-cyclotron heating
    antenna](name:wave_phase_of_ion_cyclotron_heating_antenna), which describes
    inter-element phasing, and together with the [reflected power of the
    ion-cyclotron heating
    antenna](name:reflected_power_of_ion_cyclotron_heating_antenna) it specifies
    the phase-and-magnitude state of the reflected power wave without including
    the magnitude itself.

    Sign convention: Positive when the reflected-wave phasor at the selected
    element leads the forward-wave phasor at the same element in phase under the
    adopted temporal phasor convention.
  unit: rad

- name: reflected_power_of_lower_hybrid_antenna
  description: |-
    Reflected power of a lower-hybrid antenna module is the RF power returning
    toward the source through the transmission line because of impedance
    mismatch at the plasma–antenna interface.
  documentation: |-
    Reflected power of a lower-hybrid antenna module is the nonnegative RF power
    propagating back toward the source because of impedance mismatch at the
    plasma–antenna interface. It is the returning-power component of the
    wave-power budget represented by [power of a lower-hybrid
    antenna](name:power_of_lower_hybrid_antenna), evaluated at the module input
    reference plane.

    The module power components satisfy:

    $$
    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}
    $$

    where $P_\mathrm{forward}$ is the [forward
    power](name:forward_power_of_lower_hybrid_antenna) arriving at the module
    input reference plane, $P_\mathrm{reflected}$ is the reflected power
    returning toward the source, and $P_\mathrm{launched}$ is the net [launched
    power](name:launched_power_of_lower_hybrid_antenna) entering the vacuum
    vessel from that module. All three components refer to the same module and
    reference plane.

    Reflected power is the portion of forward power returned toward the source,
    distinct from net launched power and power absorbed by the plasma. The
    quantity applies to one antenna module and is not a sum over modules or
    antennas.
  unit: W

- name: resistance_of_ion_cyclotron_heating_antenna
  description: |-
    Resistance of an ion-cyclotron heating antenna is the real part of the
    effective radio-frequency loading impedance at the antenna feed reference
    plane. It represents the resistive component associated with power coupled
    to the plasma and dissipative antenna losses.
  documentation: |-
    Resistance of an ion-cyclotron heating antenna is the real part of the
    effective radio-frequency loading impedance presented by the antenna at its
    feed reference plane. It characterizes the component of the antenna load
    that absorbs radio-frequency power, including plasma loading and intrinsic
    dissipative losses, distinct from the reactive energy storage represented by
    antenna capacitance or inductance.

    The antenna loading impedance is decomposed into resistive and reactive
    parts as:

    $$
    Z_\mathrm{ant} = R_\mathrm{ant} + i X_\mathrm{ant}
    $$

    where $Z_\mathrm{ant}$ is the complex antenna loading impedance,
    $R_\mathrm{ant}$ is the antenna resistance in ohms, $X_\mathrm{ant}$ is the
    antenna reactance in ohms, and $i^2=-1$.

    For a sinusoidal strap current, the resistive power associated with this
    load is $P_\mathrm{res}=R_\mathrm{ant} I_\mathrm{rms}^2$, where
    $P_\mathrm{res}$ is in watts and $I_\mathrm{rms}$ is the root-mean-square
    wave current of the antenna strap in amperes. This quantity is a feed-plane
    impedance component and is not itself a forward, reflected, or net power;
    those powers describe traveling-wave energy flow in the connected
    radio-frequency circuit.
  unit: ohm

- name: second_local_tangential_coordinate_of_aperture
  description: |-
    Signed coordinate of each aperture-outline vertex along the aperture’s
    second local tangential axis, defining its location in the object-local
    cross-sectional geometry.
  documentation: |-
    This quantity is the signed position of an aperture-outline vertex projected
    onto the second local tangential axis of the aperture’s object-local $(X_1,
    X_2)$ frame. Together with the first local tangential coordinate, it defines
    the boundary geometry of the aperture.

    The coordinate of vertex $v$ is defined by

    $$
    x_{2,v} = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{\mathbf{X}}_2
    $$

    where $\mathbf{r}_v$ is the position of the outline vertex, $\mathbf{r}_0$
    is the origin of the local frame, and $\hat{\mathbf{X}}_2$ is its second
    local tangential unit vector. This object-local axis is distinct from
    machine radial, toroidal, and vertical directions. The same ordinal-axis
    convention applies to the [second local tangential coordinate of diagnostic
    aperture](name:second_local_tangential_coordinate_of_diagnostic_aperture).
  unit: m

- name: second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  description: |-
    Signed coordinate of a point on the closed outline of an electron-cyclotron
    launcher mirror along its second local tangential axis in its object-local
    planar frame, measured from the mirror-local origin.
  documentation: |-
    Signed coordinate of a point on the closed outline of an electron-cyclotron
    launcher mirror along its second local tangential axis in its object-local
    planar frame, measured from the mirror-local origin, is the scalar
    projection of that point's displacement onto the mirror's second local
    tangential direction. The mirror-local triad is
    $(\hat{\mathbf{t}}_1,\hat{\mathbf{t}}_2,\hat{\mathbf{n}})$, where
    $\hat{\mathbf{t}}_1$ is the more-horizontal tangential direction directed
    toward increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, with $R$ the major radius and $Z$ the vertical height;
    $\hat{\mathbf{n}}$ is the plasma-facing unit normal; and
    $\hat{\mathbf{t}}_2=\hat{\mathbf{n}}\times\hat{\mathbf{t}}_1$ completes the
    right-handed triad.

    For an outline point with position vector $\mathbf{r}$ and mirror-local
    origin $\mathbf{r}_0$, the coordinate is defined by

    $$
    x_2 = \left(\mathbf{r}-\mathbf{r}_0\right)\cdot\hat{\mathbf{t}}_2
    $$

    where $x_2$ is the second local tangential coordinate of the outline point.

    This coordinate specifies the second in-plane component of the mirror
    outline and complements the [first local tangential
    coordinate](name:first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror).
    It is not the cylindrical radial coordinate $R$, toroidal angle $\phi$, or
    vertical coordinate $Z$ in the right-handed cylindrical $(R,\phi,Z)$ frame.

    Sign convention: Positive when the displacement from the mirror-local origin
    to the outline point has a component in the direction
    $\hat{\mathbf{t}}_2=\hat{\mathbf{n}}\times\hat{\mathbf{t}}_1$.
  unit: m

- name: second_local_tangential_coordinate_of_neutral_beam_injector
  description: |-
    Signed second local-tangential coordinate of a neutral beam injector outline
    vertex, measured in the injector-local frame and paired with the first
    coordinate to locate that vertex.
  documentation: |-
    The quantity is the signed position of an outline vertex along the neutral
    beam injector's second local tangential axis. It is paired with the [first
    local-tangential
    coordinate](name:first_local_tangential_coordinate_of_neutral_beam_injector)
    to locate the same vertex in the injector-local frame.

    The coordinate is defined by:

    $$
    x_2 = (\mathbf{r}_v-\mathbf{r}_0)\cdot\hat{\mathbf{e}}_2
    $$

    where $x_2$ is this coordinate, $\mathbf{r}_v$ is the vertex position,
    $\mathbf{r}_0$ is the local origin, and $\hat{\mathbf{e}}_2$ is the second
    local tangential unit vector. The local orthonormal basis
    $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$ is
    right-handed; $\hat{\mathbf{e}}_3$ is the plasma-facing normal, and
    $\hat{\mathbf{e}}_1$ points toward increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame.

    The coordinate applies to outline vertices associated with the neutral beam
    injector and is distinct from the first local-tangential coordinate and from
    global cylindrical coordinates.

    Sign convention: Positive when the vertex displacement has a positive
    projection along
    $\hat{\mathbf{e}}_2=\hat{\mathbf{e}}_3\times\hat{\mathbf{e}}_1$ from the
    local origin.
  unit: m

- name: second_local_tangential_width_of_neutral_beam_injector
  description: |-
    Full transverse extent of the rectangular ion-source aperture along the
    neutral beam injector’s second local tangential axis, defining one aperture
    dimension for beam extraction.
  documentation: |-
    This quantity is the full geometric width of the rectangular ion-source
    aperture measured along the neutral beam injector’s second local tangential
    axis. It is one of the two orthogonal aperture dimensions used to define the
    extraction opening.

    The width is defined by the extrema of the aperture boundary coordinate:

    $$
    w_2 = x_{2,\rm max} - x_{2,\rm min}
    $$

    where $x_2$ is the [second local-tangential coordinate of the neutral beam
    injector](name:second_local_tangential_coordinate_of_neutral_beam_injector),
    and $x_{2,\rm max}$ and $x_{2,\rm min}$ are its maximum and minimum values
    on the aperture boundary. This quantity applies to rectangular geometry and
    denotes the full width, not a half-width or the orthogonal first local
    tangential dimension represented by [first local tangential width of the
    neutral beam
    injector](name:first_local_tangential_width_of_neutral_beam_injector).
  unit: m

- name: straight_field_line_angle
  description: |-
    An angular coordinate that labels position along magnetic field lines after
    a straight-field-line transformation, making field-line trajectories linear
    on each magnetic flux surface.
  documentation: |-
    A straight-field-line angle is an angular coordinate for labeling position
    along magnetic field lines in a magnetic-flux coordinate description. The
    transformation is chosen so that field-line trajectories are straight, or
    have constant angular slope, on each flux surface.

    This quantity denotes the coordinate itself rather than a mechanical
    steering angle, wave phase, or physical distance along a field line. Its
    origin, angular orientation, and selected angular direction are defined by
    the associated straight-field-line coordinate convention.

    The [poloidal straight-field-line
    angle](name:poloidal_straight_field_line_angle) is the poloidal
    specialization of this general coordinate concept. Other specializations,
    when defined, differ by the angular direction or coordinate convention
    rather than by a different underlying physical quantity.

    Sign convention: Positive when position advances in the defined positive
    direction of the straight-field-line angular coordinate.
  unit: rad

- name: thermal_electron_absorbed_wave_power
  description: |-
    Thermal electron absorbed wave power is the total coherent-wave power
    absorbed by the bulk thermal electron population, integrated over the plasma
    volume.
  documentation: |-
    Thermal electron absorbed wave power is the plasma-volume integral of the
    local coherent-wave power deposition density into the bulk thermal electron
    population. It is the thermal-electron component of [electron absorbed wave
    power](name:electron_absorbed_wave_power), rather than the total absorbed
    power across all plasma channels.

    The defining volume integral is

    $$
    P_{\mathrm{abs},e}^{\mathrm{th}} = \int_{V_{\mathrm{plasma}}} p_{\mathrm{abs},e}^{\mathrm{th}}(\mathbf{r})\,\mathrm{d}V
    $$

    where $p_{\mathrm{abs},e}^{\mathrm{th}}$ is the [thermal electron power
    density](name:thermal_electron_power_density), $V_{\mathrm{plasma}}$ is the
    plasma volume, $\mathbf{r}$ is position, and $\mathrm{d}V$ is differential
    volume.

    The integral includes only power absorbed by bulk thermal electrons and
    excludes deposition into fast electrons, ions, and other channels. Unlike
    [thermal electron power at inside flux
    surface](name:thermal_electron_power_at_inside_flux_surface), it covers the
    complete plasma volume rather than a specified enclosed region.
  unit: W

- name: thermal_electron_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by the bulk thermal electron population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: |-
    Thermal electron power at an inside flux surface quantifies the total rate
    at which coherent wave energy is absorbed by the bulk thermal electron
    population within the plasma volume bounded by a given magnetic flux
    surface. It is the thermal-electron contribution to [electron power at an
    inside flux surface](name:electron_power_at_inside_flux_surface), distinct
    from the suprathermal contribution [fast electron power at an inside flux
    surface](name:fast_electron_power_at_inside_flux_surface).

    The quantity is obtained by integrating the flux-surface-averaged
    thermal-electron power density $p_{\mathrm{thermal,e}}$ over the enclosed
    plasma volume:

    $$
    P_{\mathrm{thermal,e}}(\rho) = \int_0^\rho p_{\mathrm{thermal,e}}(\rho') \frac{dV}{d\rho'} \, d\rho'
    $$

    where $P_{\mathrm{thermal,e}}(\rho)$ is the cumulative absorbed power,
    $\rho$ labels the limiting magnetic flux surface, $\rho'$ is the integration
    variable, $p_{\mathrm{thermal,e}}$ is the local thermal-electron absorbed
    power density, and $dV/d\rho'$ is the differential enclosed volume per unit
    flux-surface label. Only absorption by bulk thermal electrons is included;
    fast-electron and ion absorption, launched power, and absorption outside the
    enclosed volume are excluded. At the outermost closed flux surface, it gives
    the total wave power absorbed by thermal electrons.
  unit: W

- name: thermal_ion_absorbed_wave_power_density
  description: |-
    Volumetric rate of coherent-wave energy deposition into a selected thermal
    ion species, summed over all charge states and evaluated locally or as a
    flux-surface average.
  documentation: |-
    Thermal-ion absorbed wave power density is the rate at which coherent
    electromagnetic waves transfer energy directly to the thermal population of
    a selected ion species per unit physical volume. It encompasses the local
    deposition density and its average over a magnetic flux surface.

    The flux-surface-averaged quantity is defined by

    $$
    \overline{p}_{\mathrm{th},i}
    = \left\langle p_{\mathrm{th},i}\right\rangle_{\mathrm{fs}}
    = \left\langle \sum_z \frac{dP_{\mathrm{th},i,z}}{dV}\right\rangle_{\mathrm{fs}}
    $$

    where $p_{\mathrm{th},i}$ is the local thermal-ion absorbed wave power
    density, $\overline{p}_{\mathrm{th},i}$ is its flux-surface average, $i$
    identifies the selected ion species, $z$ identifies an ionic charge state,
    $P_{\mathrm{th},i,z}$ is the wave power deposited into that species' thermal
    population in charge state $z$, $V$ is physical volume, and
    $\langle\cdot\rangle_{\mathrm{fs}}$ denotes a flux-surface average.

    The recipient population is the thermal, Maxwellian component of the
    selected species, summed over all charge states; no sum over different ion
    species is implied. It excludes [fast-ion wave
    absorption](name:fast_ion_power_density), electron wave absorption, and
    subsequent collisional redistribution of absorbed energy. It is therefore
    distinct from a net ion-energy source that combines wave heating with other
    source and loss processes.

    Summing the flux-surface-averaged contributions from all recipient
    populations gives the [flux-surface-averaged total absorbed wave power
    density](name:flux_surface_averaged_total_absorbed_wave_power_density).
    Integrating this species' local deposition density over the plasma volume
    gives its thermal-ion contribution to [absorbed wave
    power](name:absorbed_wave_power), rather than another volumetric quantity.
  unit: W.m^-3

- name: thermal_ion_charge_state_power
  description: |-
    Power transferred from a coherent electromagnetic wave to the bulk thermal
    ions of a specified charge state, integrated over the plasma volume.
  documentation: |-
    This quantity is the volume-integrated power absorbed by the bulk thermal
    ion population in a specified charge state from a coherent electromagnetic
    wave. It is the thermal component of ion charge-state power and excludes
    nonthermal ions and collisional energy exchange between plasma populations.

    The total absorbed power is defined by

    $$
    P_{\mathrm{th},q} = \int_{V_{\mathrm{plasma}}} p_{\mathrm{abs},\mathrm{th},q}(\mathbf{x})\,dV
    $$

    where $P_{\mathrm{th},q}$ is the thermal-ion power for charge state $q$,
    $p_{\mathrm{abs},\mathrm{th},q}$ is the corresponding local coherent-wave
    power-transfer density, and $V_{\mathrm{plasma}}$ is the plasma volume. The
    total includes all toroidal Fourier modes; [per-toroidal-mode thermal ion
    charge-state power](name:per_toroidal_mode_thermal_ion_charge_state_power)
    resolves the same quantity by mode. It contributes to the broader [ion
    absorbed wave power](name:ion_absorbed_wave_power) and is a
    charge-state-resolved component of ion charge-state power.
  unit: W

- name: thermal_ion_charge_state_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by a specified thermal ion charge state
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: |-
    Cumulative wave power absorbed by a specified thermal ion charge state
    within the plasma volume enclosed by a specified magnetic flux surface. It
    is the portion of wave power transferred to thermal ions in that charge
    state, accumulated over the volume inside the chosen surface.

    The cumulative power is defined by integrating the local absorbed-wave-power
    density for that thermal ion charge state over the enclosed plasma volume:

    $$
    P_q^{\mathrm{th}}(\lambda) = \int_{V(\lambda)} p_q^{\mathrm{th}}(\mathbf{x}) \, dV
    $$

    where $P_q^{\mathrm{th}}(\lambda)$ is the cumulative absorbed wave power for
    thermal ion charge state $q$ inside the magnetic flux surface labeled by
    $\lambda$, $p_q^{\mathrm{th}}$ is the local absorbed-wave-power density for
    that thermal ion charge state, and $V(\lambda)$ is the plasma volume
    enclosed by that magnetic flux surface.

    This quantity is charge-state resolved and includes only absorption by the
    thermal ion population; it excludes absorption by electrons, fast or
    non-thermal ions, neutrals, and non-wave power exchange. Because power is
    extensive, the sum over all thermal-ion charge states gives
    [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface).
    It is the thermal-population contribution to
    [ion_charge_state_power_at_inside_flux_surface](name:ion_charge_state_power_at_inside_flux_surface);
    the corresponding fast-ion contribution is
    [fast_ion_charge_state_power_at_inside_flux_surface](name:fast_ion_charge_state_power_at_inside_flux_surface).
  unit: W

- name: thermal_ion_power_at_inside_flux_surface
  description: |-
    Cumulative wave power absorbed by the bulk thermal ion population within the
    plasma volume enclosed by a specified magnetic flux surface.
  documentation: |-
    The thermal-ion power at inside flux surface is the running volume integral
    of wave power deposited into the bulk thermal ion population, giving the
    radial distribution of enclosed thermal-ion wave absorption. It is the
    bulk-ion component of
    [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface),
    separated from both fast-ion and electron heating channels.

    The quantity is the volume integral of the thermal-ion wave-power density
    $p_{\mathrm{th},i}(\mathbf{r})$ over the plasma domain $V(\chi)$ enclosed by
    the flux surface labeled $\chi$:

    $$
    P_{\mathrm{th},i}(\chi) = \int_{V(\chi)} p_{\mathrm{th},i}(\mathbf{r}) \, dV
    $$

    where $p_{\mathrm{th},i}$ is the thermal-ion volumetric wave-power density
    in W m$^{-3}$, $dV$ is the volume element in m$^3$, $P_{\mathrm{th},i}$ is
    the enclosed thermal-ion wave power in W, and $\chi$ is the chosen
    flux-surface label, such as the normalized toroidal flux radius
    $\rho_\mathrm{tor,norm}$.

    This quantity includes only wave energy absorbed by bulk thermal ions inside
    the selected closed magnetic flux surface. Wave energy absorbed by thermal
    electrons is
    [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface),
    wave energy absorbed by suprathermal ions is
    [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface),
    and the sum over thermal and fast ion populations is
    [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface).
  unit: W

- name: thickness_of_antenna_strap
  description: |-
    Thickness of an ICRH antenna strap is the full, non-negative extent of the
    strap conductor cross-section perpendicular to the central segment of the
    strap rectangle in the thick-line geometric approximation. It is distinct
    from strap width, height, and length.
  documentation: |-
    Thickness of an ICRH antenna strap is the full, non-negative extent of the
    strap conductor cross-section in the direction perpendicular to the central
    segment of the strap rectangle in the thick-line geometric approximation. It
    is a geometric length of the strap conductor, not an oriented displacement.

    For a strap conductor cross-section $C$ and a unit vector $\hat{\mathbf{n}}$
    along the modeled thickness direction, the thickness $t$ is the range of
    projected positions:

    $$
    t = \max_{\mathbf{r}\in C}\left(\mathbf{r}\cdot\hat{\mathbf{n}}\right) - \min_{\mathbf{r}\in C}\left(\mathbf{r}\cdot\hat{\mathbf{n}}\right)
    $$

    where $t$ is the thickness of the antenna strap, $C$ is the conductor
    cross-section, $\mathbf{r}$ is a position vector for a point of that
    cross-section, and $\hat{\mathbf{n}}$ is a unit vector in the cross-section
    perpendicular to the central segment of the strap rectangle.

    The scope is a single ICRH antenna strap represented by the thick-line
    strap-rectangle geometry. The aggregation convention is the complete
    max-minus-min extent over the conductor cross-section along the modeled
    thickness direction; it is not an average thickness, a local surface
    separation, a half-thickness, or a signed offset.

    Thickness is an independent strap-geometry extent that complements the width
    of the antenna strap, [height of the antenna
    strap](name:height_of_antenna_strap), and length of the antenna strap. Those
    quantities describe separate geometric extents of the same strap rather than
    projections along the thickness direction.
  unit: m

- name: toroidal_angle_of_antenna_strap
  description: |-
    Toroidal angular coordinate of each antenna-strap outline point around the
    machine symmetry axis in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The toroidal angle is the azimuthal coordinate assigned to each point on the
    geometric outline of an antenna strap. It identifies the point’s
    circumferential location in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius measured from the machine symmetry axis, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    This quantity applies to individual strap-outline points and is not a mean,
    sum, nominal center coordinate, or mechanical orientation angle. No
    aggregation over the outline is implied; each point retains its own $\phi$
    value.

    Together with the other coordinates of the outline, this angle locates the
    strap geometry. It is distinct from the [radial coordinate of the antenna
    strap](name:radial_coordinate_of_antenna_strap), which locates a strap
    reference point, while [vertical outline of the antenna
    strap](name:vertical_outline_of_antenna_strap) provides the corresponding
    signed vertical coordinate for outline points. The same angular-coordinate
    concept is used for a different object by [toroidal angle of a coil
    conductor element](name:toroidal_angle_of_coil_conductor_element).

    Sign convention: Positive when the angular displacement from the chosen
    $\phi=0$ reference is toward increasing toroidal angle $\phi$,
    counter-clockwise when viewed from above $+Z$.
  unit: rad

- name: toroidal_angle_of_aperture
  description: |-
    Toroidal angular coordinate locating the geometric center of a collimating
    aperture around the machine symmetry axis in the right-handed cylindrical
    (R, φ, Z) frame.
  documentation: |-
    This quantity is the toroidal angular coordinate $\phi_c$ of an aperture's
    reference center, locating that center around the machine symmetry axis.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. Using the right-handed
    Cartesian basis $(\hat{x},\hat{y},\hat{z})$, with $\hat{x}$ and $\hat{y}$ as
    horizontal unit vectors and $\hat{z}$ aligned with the vertical cylindrical
    direction $\hat{Z}$, the coordinate is defined by:

    $$
    \phi_c = \operatorname{atan2}(Y_c, X_c)
    $$

    Here, $\phi_c$ is the toroidal angle of the aperture center, $X_c$ and $Y_c$
    are its horizontal Cartesian coordinate values along $\hat{x}$ and
    $\hat{y}$, and $\operatorname{atan2}$ is the two-argument azimuth function
    referenced to the chosen $\phi=0$ direction.

    The quantity applies to one aperture reference center. For a circular
    aperture, this reference is the circle's geometric center; for an aperture
    represented by a local plane, it is the origin of the local coordinate
    system located within the aperture area. It is not the toroidal angle of an
    arbitrary aperture point, the aperture orientation, the beam direction, or
    an aggregate over multiple apertures.

    This coordinate is the toroidal counterpart of the [vertical coordinate of
    an aperture](name:vertical_coordinate_of_aperture), which gives the $Z$
    location of the same center. The equivalent center-based convention is also
    represented by [toroidal coordinate of an
    aperture](name:toroidal_coordinate_of_aperture); neither coordinate
    specifies the aperture's radial location, size, or orientation.

    Sign convention: Positive when the aperture center lies in the direction of
    increasing toroidal angle $\phi$ from the chosen $\phi=0$ reference.
  unit: rad

- name: toroidal_angle_of_beamlet_group
  description: |-
    Toroidal angular coordinate of a beamlet-group center around the machine
    symmetry axis, using the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The quantity is the toroidal angular coordinate of the representative center
    position of a beamlet group about the machine symmetry axis. It locates the
    group in the toroidal direction and is distinct from the position of any
    individual beamlet.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the group-center
    position is represented by

    $$
    \mathbf{r}_c = R_c\hat{\mathbf{R}}(\phi_c) + Z_c\hat{\mathbf{Z}}
    $$

    where $\mathbf{r}_c$ is the beamlet-group center position, $R_c$ is its
    major-radius coordinate, $Z_c$ is its vertical coordinate, $\phi_c$ is its
    toroidal angle, $\hat{\mathbf{R}}(\phi_c)$ is the radial unit vector at that
    angle, and $\hat{\mathbf{Z}}$ is the vertical unit vector. The basis is
    $(\hat{R},\hat{\phi},\hat{Z})$, with $\hat{R}\times\hat{\phi}=\hat{Z}$.

    The scope is the defined center position of the beamlet group as a whole. No
    aggregation over the toroidal angles of individual beamlets is implied; the
    quantity does not represent an individual beamlet's location, direction,
    trajectory, radial coordinate, or vertical coordinate. Together with the
    center's radial and vertical coordinates, it specifies the group's
    cylindrical position. Its angular convention is the same as that used for
    the [toroidal angle of an antenna
    strap](name:toroidal_angle_of_antenna_strap), while the owning object is
    different.

    Sign convention: Positive when the center's angular displacement is in the
    $+\hat{\phi}$ direction, toward increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame.
  unit: rad

- name: toroidal_angle_of_launching_position
  description: |-
    Toroidal angle of launching position is the azimuthal coordinate of the
    physical point where a heating wave or particle beam is launched, measured
    in the right-handed cylindrical (R, φ, Z) frame with R major radius, φ
    toroidal angle, and Z vertical height.
  documentation: |-
    Toroidal angle of launching position is the azimuthal coordinate of the
    physical point where a heating wave or particle beam is launched. It is
    defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    For a launch point whose horizontal Cartesian coordinates are expressed in a
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with
    $\hat{z}=\hat{Z}$ and $+\hat{x}$ defining $\phi=0$, the toroidal angle is

    $$
    \phi_\mathrm{launch} = \operatorname{atan2}(y_\mathrm{launch}, x_\mathrm{launch}) \bmod 2\pi
    $$

    where $x_\mathrm{launch}$ and $y_\mathrm{launch}$ are the horizontal
    Cartesian coordinates of the launch point, in meters, and
    $\operatorname{atan2}$ returns the quadrant-resolved azimuth.

    This quantity specifies only the toroidal location of the launch point. The
    vertical coordinate of the same point is
    [vertical_coordinate_of_launching_position](name:vertical_coordinate_of_launching_position),
    while steering or propagation orientation is represented by direction
    quantities such as
    [toroidal_angle_of_electron_cyclotron_beam](name:toroidal_angle_of_electron_cyclotron_beam);
    this quantity is not a beam direction or wave-vector angle. Values differing
    by integer multiples of $2\pi$ identify the same toroidal locus.

    Sign convention: Positive when the angular displacement from the $\phi=0$
    direction is counter-clockwise as viewed from the $+\hat{Z}$ side looking
    toward decreasing $Z$.
  unit: rad

- name: toroidal_coordinate_of_electron_cyclotron_launcher_mirror
  description: |-
    Toroidal-angle coordinate of the geometric center of an electron-cyclotron
    launcher mirror in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    This quantity locates the geometric center used to define the
    electron-cyclotron launcher mirror surface in the toroidal direction. For a
    spherical mirror, the reference point is the sphere center.

    The toroidal angle is defined from the center coordinates in the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis:

    $$
    \phi_{\rm mir} = \operatorname{atan2}(y_{\rm mir}, x_{\rm mir})
    $$

    where $x_{\rm mir}$ and $y_{\rm mir}$ are the Cartesian coordinates of the
    mirror center, with $\hat{z}=\hat{Z}$ and the zero-angle direction fixed by
    the facility convention. This is the device-centered counterpart of the
    toroidal coordinate used for a
    [reflector](name:toroidal_coordinate_of_reflector).

    The coordinate describes the mirror geometry in its reference position and
    does not represent the mirror steering angle or the toroidal location of the
    launched beam.

    Sign convention: Positive when the mirror center lies at increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
  unit: rad

- name: toroidal_coordinate_of_lower_hybrid_antenna_row
  description: |-
    Toroidal-angle coordinate of the middle reference position of a lower-hybrid
    antenna row in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The toroidal coordinate $\phi$ locates the middle reference position of a
    lower-hybrid antenna row around the machine symmetry axis. It is the angular
    coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius and $Z$ is vertical height.

    This coordinate specifies the row's toroidal location and does not determine
    its radial or vertical location. The corresponding radial location is given
    by the radial coordinate of the lower-hybrid antenna row.

    Sign convention: Positive when $\phi$ increases counter-clockwise when
    viewed from above along the $+Z$ direction.
  unit: rad

- name: toroidal_launched_wave_index_of_lower_hybrid_antenna
  description: |-
    Signed toroidal component of the refractive-index vector for a lower-hybrid
    wave launched by a lower-hybrid antenna.
  documentation: |-
    The toroidal launched-wave index is the signed projection of the
    refractive-index vector of a wave launched by a lower-hybrid antenna onto
    the toroidal direction. It characterizes toroidal phase variation and is
    distinct from the dimensional [toroidal wave
    vector](name:toroidal_wave_vector_of_beam_tracing_beam).

    The index is defined by

    $$
    n_\phi = \frac{\mathbf{k}\cdot\hat{\phi}}{k_0} = \frac{k_\phi}{k_0}
    $$

    where $\mathbf{k}$ is the launched-wave vector, $\hat{\phi}$ is the unit
    vector in the direction of increasing toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $k_\phi$ is the toroidal projection of
    $\mathbf{k}$, and $k_0$ is the free-space wavenumber. The corresponding
    poloidal quantity is the [poloidal launched-wave
    index](name:poloidal_launched_wave_index_of_lower_hybrid_antenna).

    Sign convention: Positive when the launched-wave vector has a component in
    the direction of increasing toroidal angle $\phi$.
  unit: '1'

- name: toroidal_width_of_antenna_strap
  description: |-
    Toroidal width of the antenna strap is its full edge-to-edge physical extent
    in the direction around the toroidal symmetry axis.
  documentation: |-
    Width of antenna strap

    The width $w_\phi$ follows the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is distance
    from the symmetry axis and $Z$ is vertical position. It is a non-negative
    geometric length, not an angular span or a signed vector component.

    The quantity applies to an individual strap and denotes its full width, not
    a half-width or the combined span of multiple straps. It is distinct from
    the [height of the antenna strap](name:height_of_antenna_strap), which
    describes its vertical extent, and the [thickness of the antenna
    strap](name:thickness_of_antenna_strap), which describes a separate
    conductor dimension.
  unit: m

- name: total_external_heating_power
  description: |-
    Total non-inductive power coupled from external neutral-beam and
    radio-frequency heating systems to the plasma, summed over auxiliary sources
    and excluding Ohmic heating.
  documentation: |-
    Total external heating power is the aggregate non-inductive power coupled to
    the plasma by auxiliary heating systems. It includes neutral-beam injection
    and electron-cyclotron, ion-cyclotron, and lower-hybrid systems, while
    excluding power associated with Ohmic induction.

    The defining aggregate relation is

    $$
    P_{\mathrm{ext}} = \sum_{s \in \mathcal{S}_{\mathrm{aux}}} P_s
    $$

    where $P_{\mathrm{ext}}$ is the total external heating power,
    $\mathcal{S}_{\mathrm{aux}}$ is the set of included auxiliary heating
    systems, and $P_s$ is the power coupled to the plasma by auxiliary source
    $s$.

    The quantity applies to the whole plasma and is summed over all included
    auxiliary sources rather than resolved by source, species, or spatial
    region. It represents external power input that may contribute to both
    plasma heating and non-inductive current drive; it is distinct from Ohmic
    heating and from generator power that is not coupled to the plasma.
    Source-specific contributions include [total power due to electron-cyclotron
    heating](name:total_power_due_to_electron_cyclotron_heating), [total power
    due to ion-cyclotron
    heating](name:total_power_due_to_ion_cyclotron_heating), and power absorbed
    from a neutral-beam injector, whose aggregate forms contribute to the sum.
  unit: W

- name: total_power_due_to_electron_cyclotron_heating
  description: |-
    Total power due to electron cyclotron heating is the net radiofrequency
    power absorbed by the plasma from all electron-cyclotron wave sources
    through resonant electron-cyclotron interactions. It excludes launched,
    transmitted, reflected, and unabsorbed shine-through power.
  documentation: |-
    Total power due to electron cyclotron heating is the net radiofrequency
    power absorbed by the plasma from all electron-cyclotron wave sources
    through resonant interaction with electrons at the electron cyclotron
    frequency or its harmonics. It is an absorbed heating power, not the
    generated, launched, transmitted, reflected, or unabsorbed radiofrequency
    power.

    The total absorbed electron-cyclotron heating power is the sum of the net
    absorbed powers from the contributing electron-cyclotron sources:

    $$
    P_\mathrm{EC} = \sum_{s=1}^{N_\mathrm{EC}} P_{\mathrm{EC},s}
    $$

    where $N_\mathrm{EC}$ is the number of contributing electron-cyclotron
    sources, $P_{\mathrm{EC},s}$ is the net electron-cyclotron power absorbed by
    the plasma from source $s$ expressed in watts, and $P_\mathrm{EC}$ is the
    total absorbed electron-cyclotron heating power expressed in watts.

    The per-source contribution is
    [power_due_to_electron_cyclotron_heating](name:power_due_to_electron_cyclotron_heating).
    This quantity is non-negative and is zero when no electron-cyclotron power
    is absorbed by the plasma; it is a component of
    [total_external_heating_power](name:total_external_heating_power) when total
    external heating is formed over all auxiliary heating methods.
  unit: W

- name: vertical_coordinate_of_electron_cyclotron_launcher_mirror
  description: |-
    Vertical coordinate of the geometric center of an electron-cyclotron
    launcher mirror in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical coordinate of the geometric center of an electron-cyclotron
    launcher mirror is the $Z$ coordinate of that center in the right-handed
    cylindrical $(R, \phi, Z)$ frame. Here $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The coordinate is defined by projecting the mirror geometric-center position
    onto the vertical coordinate axis:

    $$
    z_m = Z(\mathbf{r}_{m,c})
    $$

    where $\mathbf{r}_{m,c}$ is the position of the electron-cyclotron launcher
    mirror geometric center and $Z(\mathbf{r}_{m,c})$ is its vertical
    coordinate.

    Together with the radial centroid of the electron-cyclotron launcher mirror
    and the [toroidal coordinate of the electron-cyclotron launcher
    mirror](name:toroidal_coordinate_of_electron_cyclotron_launcher_mirror),
    this quantity specifies the mirror geometric-center position in the
    right-handed cylindrical $(R, \phi, Z)$ frame. It is distinct from
    coordinates defined for other mirror reference points, such as a sphere
    center or a surface point.
  unit: m

- name: vertical_coordinate_of_launching_position
  description: |-
    Vertical Z coordinate of the physical point from which a heating beam or
    wave is launched, in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The vertical coordinate $Z$ of the launching position locates the spatial
    origin of a beam or electromagnetic wave's propagation trajectory within the
    tokamak vessel, in the right-handed cylindrical $(R, \phi, Z)$ frame where
    $Z$ is the height along the machine symmetry axis.

    For electron cyclotron heating systems, this coordinate specifies the height
    at which the EC beam exits the launcher and enters the plasma. Together with
    the major-radius and toroidal-angle components, it fully defines the
    three-dimensional launch-point geometry needed for beam-tracing and
    current-drive modeling. The angle_of_electron_cyclotron_launcher_mirror
    determines the beam injection direction from this spatial origin, while
    [vertical_coordinate_of_beam_tracing_point](name:vertical_coordinate_of_line_of_sight)
    gives $Z$ at discrete computed points along the propagating ray rather than
    at its origin.

    The launch height is set by the mechanical installation of the launcher on
    the vacuum vessel and is determined by engineering survey. For
    equatorial-port launchers, $Z$ is close to 0 m; upper-port or top-launch
    geometries place the origin at $Z \approx 0.5$–$1.5$ m in medium-to-large
    tokamaks.
  unit: m

- name: vertical_coordinate_of_lower_hybrid_antenna
  description: |-
    Vertical Z-coordinate of the reference point of a lower-hybrid antenna in
    the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The vertical coordinate locates the reference point of a lower-hybrid
    antenna along the vertical direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.

    The defining relation is:

    $$
    Z_{\mathrm{ant}} = Z(P_{\mathrm{ant}})
    $$

    where $P_{\mathrm{ant}}$ is the antenna reference point and
    $Z(P_{\mathrm{ant}})$ is its vertical coordinate. This quantity refers to
    the antenna reference point; the [vertical coordinate of a lower-hybrid
    antenna row](name:vertical_coordinate_of_lower_hybrid_antenna_row) refers
    instead to a row reference point.

    Sign convention: Positive when the antenna reference point lies in the
    direction of increasing $Z$.
  unit: m

- name: vertical_coordinate_of_lower_hybrid_antenna_row
  description: |-
    Vertical Z-coordinate of the reference point of a lower-hybrid antenna row
    in the right-handed cylindrical (R, φ, Z) frame, where R is major radius, φ
    is toroidal angle, and Z is vertical height.
  documentation: |-
    Vertical $Z$-coordinate of the reference point of a lower-hybrid antenna row
    is the projection of that row reference point onto $\hat{Z}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.

    For a row reference point with position vector
    $\mathbf{r}_{\mathrm{ref,row}}$, the coordinate is defined by:

    $$
    Z_{\mathrm{row}} = \mathbf{r}_{\mathrm{ref,row}} \cdot \hat{Z}
    $$

    where $\hat{Z}$ is the vertical basis vector of the right-handed cylindrical
    $(R, \phi, Z)$ frame.

    This is a row-level coordinate and is distinct from the antenna-level
    [vertical coordinate of the lower-hybrid
    antenna](name:vertical_coordinate_of_lower_hybrid_antenna). It is distinct
    from the row vertical extent.

    Sign convention: Positive when the row reference point lies in the
    $+\hat{Z}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame
    from the $Z=0$ plane.
  unit: m

- name: vertical_coordinate_of_neutral_beam_injector
  description: |-
    Vertical coordinate Z of the declared reference position of a neutral beam
    injector is the signed height of that point from the equatorial plane in the
    right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Vertical coordinate $Z$ of the declared reference position of a neutral beam
    injector is the signed height of that point relative to the equatorial plane
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It identifies only the
    vertical component of the injector reference-point position.

    The coordinate is the projection of the reference-point displacement onto
    the vertical basis vector:

    $$
    Z_\mathrm{NBI} = \mathbf{r}_\mathrm{ref} \cdot \hat{Z}
    $$

    where $\mathbf{r}_\mathrm{ref}$ is the displacement of the declared
    reference position from an origin on the symmetry axis in the equatorial
    plane, and $\hat{Z}$ is the vertical basis vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.

    For an extended injector, this quantity locates only the declared reference
    point; it does not define the injector aperture, beam-axis direction, beam
    footprint, or full beam geometry. A complementary position coordinate is
    [radial_coordinate_of_neutral_beam_injector](name:radial_coordinate_of_neutral_beam_injector)
    when defined for the same reference point.

    Sign convention: Positive when the declared reference position lies above
    the equatorial plane in the $+\hat{Z}$ direction.
  unit: m

- name: vertical_displacement_of_beamlet_group
  description: |-
    Signed vertical displacement of a neutral-beam-injection beamlet-group
    center from its static geometry during dynamic beam tilting.
  documentation: |-
    The quantity is the signed change in the vertical position of a
    beamlet-group center when the beamlet geometry is dynamically tilted away
    from its static configuration. It represents the group center as a geometric
    object, not the beamlet group's extent or focal length.

    The displacement is defined by

    $$
    \Delta Z = Z_{\mathrm{dynamic}} - Z_{\mathrm{static}}
    $$

    where $\Delta Z$ is the vertical displacement, $Z_{\mathrm{dynamic}}$ is the
    vertical coordinate of the beamlet-group center in the dynamically tilted
    configuration, and $Z_{\mathrm{static}}$ is its corresponding coordinate in
    the static geometry. These coordinates are expressed in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The scope is one beamlet group treated as a single geometric object during
    dynamic tilting; the quantity is a center displacement rather than a
    per-beamlet value, an absolute position, or a displacement summed over
    beamlet properties. It excludes the group's cross-sectional size, which is
    described by its [vertical width](name:vertical_width_of_beamlet_group), and
    its distance to a focal point, described by its [vertical focal
    length](name:vertical_focal_length_of_beamlet_group).

    The quantity is the vertical counterpart of a signed radial center
    displacement such as [radial offset of a beamlet
    group](name:radial_offset_of_beamlet_group). It differs from [perturbed
    major radius](name:perturbed_major_radius), which describes dynamic
    variation of a beam-line tangency radius rather than the vertical position
    of the beamlet-group center.

    Sign convention: Positive when the dynamically tilted beamlet-group center
    is displaced toward increasing $Z$.
  unit: m

- name: vertical_focal_length_of_beamlet_group
  description: |-
    Vertical focal length of a beamlet group is the distance along the
    neutral-beam line from the group’s ion source to the point where the group’s
    vertical extent is minimized.
  documentation: |-
    Vertical focal length of a beamlet group is the path length along the
    neutral-beam line from the beamlet group's ion source to the group vertical
    focus. The group vertical focus is the location at which the collective
    beamlet envelope has its minimum vertical extent, with vertical measured
    parallel to $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.

    Using an along-beam coordinate $s$ that increases from the ion source along
    the neutral-beam line, the focal length is defined by

    $$
    f_v = s_f - s_0, \qquad w_v(s_f) = \min_s w_v(s)
    $$

    where $f_v$ is the vertical focal length of the beamlet group, $s_0$ is the
    ion-source position on the along-beam coordinate, $s_f$ is the
    vertical-focus position, and $w_v(s)$ is the collective vertical envelope
    extent of the beamlet group at position $s$.

    The quantity applies to one beamlet group and aggregates all beamlets in
    that group through their collective vertical envelope. It is not a
    per-beamlet focal length and not a whole-unit focal length formed by
    combining multiple groups; the distance is along the beam-line path rather
    than a vertical separation.

    It is distinct from the source-surface vertical width of a beamlet group and
    from any vertical extent at locations other than the focus; those are
    transverse extents, whereas this quantity is the along-beam separation to
    the location of the minimum. It is the vertical counterpart of the
    horizontal focal length of a beamlet group, which uses the minimum
    horizontal extent instead of the minimum vertical extent.
  unit: m

- name: vertical_width_of_beamlet_group
  description: |-
    Full vertical cross-sectional extent of a neutral-beam-injection beamlet
    group at the injection unit’s source surface.
  documentation: |-
    The quantity is the full vertical geometric width occupied collectively by
    the beamlets in a neutral-beam-injection group at the injection unit’s
    grounded-grid source surface.

    The width is defined by the separation of the uppermost and lowermost
    beamlet-group boundaries:

    $$
    w_v = Z_{\mathrm{top}} - Z_{\mathrm{bottom}}
    $$

    where $w_v$ is the vertical beamlet-group width, $Z_{\mathrm{top}}$ and
    $Z_{\mathrm{bottom}}$ are the upper and lower vertical coordinates of the
    group boundary, and $Z$ is the vertical coordinate in the right-handed
    cylindrical $(R,\phi,Z)$ frame; $R$ is major radius and $\phi$ is toroidal
    angle.

    This quantity applies to the aggregate cross-sectional envelope of the
    beamlet group at the source surface, not to an individual beamlet. It
    represents the full width rather than a half-width, local spread, or width
    evaluated at another position along the beam line.

    The width changes along the beam line as the beamlets converge. It is
    therefore distinct from the [vertical focal length of the beamlet
    group](name:vertical_focal_length_of_beamlet_group), which is the distance
    to the point of minimum vertical width rather than the width itself.
  unit: m

- name: voltage_of_ion_cyclotron_heating_antenna
  description: |-
    Electrical potential difference associated with an ion-cyclotron-heating
    antenna, defined between the antenna conductor or feed and its reference
    conductor. It is the general antenna-voltage quantity; specialized names
    specify amplitude or another representation of the waveform.
  documentation: |-
    Electrical potential difference associated with an ion-cyclotron-heating
    antenna is the scalar electric potential of the specified antenna conductor
    or feed relative to its associated reference conductor or node. It
    represents the antenna voltage waveform before any child name specifies a
    particular reduction or representation of that waveform.

    The signed antenna voltage is defined by the potential difference between
    the antenna node and its reference node:

    $$
    V_\mathrm{ant}(t) = \Phi_\mathrm{ant}(t) - \Phi_\mathrm{ref}(t)
    $$

    where $V_\mathrm{ant}(t)$ is the antenna voltage, $\Phi_\mathrm{ant}(t)$ is
    the electric potential of the specified antenna conductor or feed,
    $\Phi_\mathrm{ref}(t)$ is the electric potential of its associated reference
    conductor or node, and $t$ is time.

    The scope is voltages intrinsic to ion-cyclotron-heating antenna hardware,
    including antenna conductors, straps, or feeds when they are the defined
    electrical node. The unqualified parent does not by itself specify an
    instantaneous value, phasor, peak amplitude, root-mean-square value, or any
    aggregation over antenna elements; those distinctions belong to qualified
    child names.

    The [voltage amplitude of an ion-cyclotron-heating
    antenna](name:voltage_amplitude_of_ion_cyclotron_heating_antenna) is a
    specialized reduction of this antenna voltage waveform to its peak
    magnitude. This parent is distinct from antenna current, generator voltage
    not defined at the antenna node, and launched or absorbed radio-frequency
    power.

    Sign convention: Positive when the electric potential of the specified
    antenna conductor or feed is greater than the electric potential of its
    associated reference conductor or node.
  unit: V

- name: voltage_amplitude_of_ion_cyclotron_heating_antenna
  description: |-
    Peak magnitude of the radio-frequency voltage waveform on a single
    transmission-line feed of an ion-cyclotron-heating antenna module.
  documentation: |-
    This quantity is the peak magnitude of the radio-frequency electrical
    potential difference on one transmission-line feed belonging to an
    ion-cyclotron-heating antenna module.

    For the feed voltage waveform $v(t)$, its amplitude is defined by

    $$
    V_{\mathrm{amp}} = \max_t |v(t)|
    $$

    where $V_{\mathrm{amp}}$ is the voltage amplitude, $v(t)$ is the
    instantaneous feed voltage, and $t$ is time. The absolute value removes
    instantaneous polarity, while the maximum selects the peak magnitude of the
    waveform.

    The quantity applies to one feed of one antenna module and is not a sum over
    feeds, antenna modules, or the complete heating system. It excludes the
    instantaneous signed voltage and its phase; it also does not represent
    forward or launched radio-frequency power. It is the amplitude
    transformation of the corresponding [ion-cyclotron-heating antenna
    voltage](name:voltage_of_ion_cyclotron_heating_antenna), retaining the feed
    voltage's peak level while discarding its instantaneous sign and phase.
  unit: V

- name: wave_current_of_antenna_strap
  description: |-
    Characterization of the radio-frequency current oscillating along an antenna
    strap, encompassing peak-amplitude and root-mean-square representations of
    the same wave current.
  documentation: |-
    Wave current of an antenna strap is the radio-frequency electric current
    oscillating along the strap conductor during electromagnetic-wave
    excitation. The quantity is represented by a non-negative measure of the
    oscillation rather than by the instantaneous signed waveform.

    The underlying single-frequency current can be represented as

    $$
    I_{\mathrm{RF}}(t) = \operatorname{Re}\{\widetilde{I}_{\mathrm{RF}} e^{i\omega t}\}
    $$

    where $I_{\mathrm{RF}}(t)$ is the instantaneous radio-frequency current,
    $\widetilde{I}_{\mathrm{RF}}$ is its complex phasor, $t$ is time, and
    $\omega$ is the angular frequency of the oscillation.

    This quantity applies to the radio-frequency current carried by an antenna
    strap and includes representations evaluated at a strap position or formed
    as an effective measure of the oscillation. It excludes the non-wave or
    total current represented by [current of an antenna
    strap](name:current_of_antenna_strap), as well as current density and plasma
    current.

    The accepted child quantities provide two representations of this common
    quantity: [wave current amplitude of an antenna
    strap](name:wave_current_amplitude_of_antenna_strap) gives the peak
    magnitude of the oscillation, while [root-mean-square wave current of an
    antenna strap](name:root_mean_square_wave_current_of_antenna_strap) gives
    its effective magnitude. For a sinusoidal waveform, the root-mean-square
    magnitude is the peak magnitude divided by $\sqrt{2}$.
  unit: A

- name: wave_current_amplitude_of_antenna_strap
  description: |-
    Peak magnitude of the radio-frequency current at a specified position along
    an ion-cyclotron-heating antenna strap.
  documentation: |-
    This quantity is the peak magnitude of the radio-frequency current on an
    ion-cyclotron-heating antenna strap at a specified position. It
    characterizes the local electromagnetic excitation of a strap fed through a
    single transmission line.

    The amplitude $I_{\mathrm{amp}}$ is defined from the local RF current
    waveform $i_{\mathrm{RF}}(t)$ by

    $$
    I_{\mathrm{amp}} = \max_t \left|i_{\mathrm{RF}}(t)\right|
    $$

    where $i_{\mathrm{RF}}(t)$ is the instantaneous radio-frequency current at
    the specified strap position and $t$ is time.

    The quantity applies locally along the antenna strap and represents the RF
    wave-current amplitude, not a current summed over the antenna system or over
    multiple straps. It is a non-negative magnitude and is distinct from the
    signed instantaneous current and from an RMS current measure.

    It is the amplitude transformation of the [wave current of an antenna
    strap](name:wave_current_of_antenna_strap): the parent denotes the
    oscillating current, whereas this quantity retains its peak magnitude at the
    specified position.
  unit: A

- name: wave_frequency
  description: |-
    Temporal carrier frequency of a coherent electromagnetic wave used to
    characterize its oscillation rate in plasma heating and current drive.
  documentation: |-
    Wave frequency is the non-negative temporal carrier frequency of a coherent
    electromagnetic wave interacting with a plasma. It describes the rate of
    phase oscillation and applies to waves at launch or during propagation,
    independent of the wave amplitude or absorbed power.

    The frequency $f$ is related to the angular frequency by

    $$
    f = \frac{\omega}{2\pi}
    $$

    where $f$ is frequency in hertz and $\omega$ is angular frequency in radians
    per second. The launch-specific quantity launched wave frequency uses this
    same definition as the absolute reference for a launched wave, while
    [frequency of electron cyclotron heating
    antenna](name:frequency_of_electron_cyclotron_beam) is a device-specific
    instance.
  unit: Hz

- name: wave_mode_number
  description: |-
    Dimensionless mode-number vector labeling the discrete Fourier periodicities
    of a coherent wave perturbation.
  documentation: |-
    This quantity is the collection of discrete mode labels that identifies a
    coherent wave perturbation through its periodic phase dependence. It is a
    mode-index vector, not a spatial wavevector, physical displacement vector,
    or full linear-MHD eigenmode label.

    For a coherent perturbation represented by a single Fourier phase in
    periodic coordinates, the wave mode-number vector is defined by

    $$
    \tilde{q}(\boldsymbol{\alpha}, t) = \hat{q}\,\exp\!\left[i\left(\mathbf{N}_w \cdot \boldsymbol{\alpha} - \omega t\right)\right]
    $$

    where $\tilde{q}$ is the coherent wave perturbation of a field quantity,
    $\hat{q}$ is its complex amplitude, $\boldsymbol{\alpha}$ is the set of
    periodic coordinates used to label the phase, $\mathbf{N}_w$ is the wave
    mode-number vector, and $\omega$ is the angular frequency.

    This parent covers Fourier harmonic labels of coherent waves, such as the
    [toroidal wave mode number](name:toroidal_wave_mode_number) associated with
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.
    It does not by itself assert a radial branch index or a poloidal harmonic;
    those belong only to more specific quantities when explicitly defined, and
    distinguish it from the broader linear-MHD mode number.

    Sign convention: Positive when increasing the associated periodic coordinate
    at fixed time increases the Fourier phase in the representation above.
  unit: '1'

- name: wave_phase_of_antenna_strap
  description: |-
    Phase angle of the radio-frequency current phasor carried by one
    ion-cyclotron-heating antenna strap, defined relative to a specified RF
    phase reference.
  documentation: |-
    Wave phase of an antenna strap is the phase angle of the oscillatory
    radio-frequency current phasor carried by that strap. It describes the
    strap-level excitation phase used in the antenna's toroidal phasing
    configuration.

    The complex strap-current phasor may be represented as

    $$
    I_s = |I_s|e^{i\phi_s}
    $$

    where $I_s$ is the complex radio-frequency current phasor, $|I_s|$ is its
    current amplitude, and $\phi_s$ is the wave phase represented by this
    quantity. The phase is defined modulo $2\pi$ relative to a specified RF
    reference phase.

    This quantity applies to one antenna strap and is not summed or averaged
    over multiple straps. It refers to the phase of the strap current, not the
    phase of a forward power-wave phasor, which is represented by [forward wave
    phase of an ion-cyclotron-heating
    antenna](name:forward_wave_phase_of_ion_cyclotron_heating_antenna), or the
    phase associated with a complete antenna element.

    The associated [wave current of antenna
    strap](name:wave_current_of_antenna_strap) provides the phasor whose phase
    is specified, while wave current of antenna strap amplitude determines its
    magnitude rather than its phase. Relative phases between straps determine
    the toroidal phasing of the antenna excitation and therefore influence the
    launched wave excitation spectrum. The phase-reference plane and any
    phase-unwrapping convention must be specified separately when comparing
    values.
  unit: rad

- name: wave_phase_of_ion_cyclotron_heating_antenna
  description: |-
    Wave phase at an ion-cyclotron heating antenna specifies the relative
    angular offset of coherent radio-frequency excitations at selected straps or
    modules.
  documentation: |-
    Wave phase at an ion-cyclotron heating antenna is the relative phase of a
    coherent radio-frequency excitation associated with a selected strap or
    module. It describes excitation phasing rather than an absolute phase
    independent of a reference.

    For selected and reference excitations, the relative phase is defined by

    $$
    \varphi = \arg\!\left(A_{\mathrm{sel}} A_{\mathrm{ref}}^*\right) \pmod{2\pi}
    $$

    where $\varphi$ is the wave phase, $A_{\mathrm{sel}}$ is the selected
    complex excitation phasor, $A_{\mathrm{ref}}$ is the coherent reference
    excitation phasor, the superscript $*$ denotes complex conjugation, and
    $\arg$ extracts the complex argument. Both phasors must be nonzero and refer
    to the same radio-frequency component. The phase is defined modulo $2\pi$.

    The scope includes relative phasing between antenna straps or modules,
    without summation or averaging over elements. The excitation quantity,
    reference excitation, reference planes, and temporal phasor convention must
    be specified. Feed-voltage phase and traveling power-wave phase are distinct
    realizations and are not interchangeable without their electrical
    relationship. Relative element phasing affects interference between
    excitations and therefore the launched wave spectrum and current-drive
    efficiency.

    The [forward-wave
    phase](name:forward_wave_phase_of_ion_cyclotron_heating_antenna) specializes
    this quantity to forward power-wave phasors referenced to the first module;
    that reference is not imposed on the general quantity. The [wave phase of an
    antenna strap](name:wave_phase_of_antenna_strap) specifically identifies the
    phase of its radio-frequency current phasor. Neither phase quantity includes
    excitation magnitude.

    Sign convention: Positive when the selected excitation phasor leads the
    reference excitation phasor in phase under the declared temporal phasor
    convention.
  unit: rad

- name: forward_wave_phase_of_ion_cyclotron_heating_antenna
  description: |-
    Relative phase of the forward radio-frequency power-wave phasor at an
    ion-cyclotron-heating antenna module, referenced to the first module for
    inter-module toroidal phasing.
  documentation: |-
    The forward-wave phase is the relative phase angle of the complex
    radio-frequency power-wave phasor associated with one ion-cyclotron-heating
    antenna module. It describes inter-module phasing rather than an absolute
    phase.

    For selected module $i$, the relative forward-wave phase is defined by

    $$
    \theta_i^{+} = \arg\left(\tilde{a}_i^{+}\right) - \arg\left(\tilde{a}_1^{+}\right)
    $$

    where $\theta_i^{+}$ is the relative forward-wave phase, $i$ identifies the
    selected antenna module, module $1$ is the first reference module,
    $\tilde{a}_i^{+}$ is the complex phasor of the forward radio-frequency power
    wave associated with module $i$, and $\arg$ returns a phasor's phase angle.

    The quantity applies only to the forward wave at an antenna module and is
    defined relative to the first module; no absolute phase relative to a
    generator or external reference is implied. It concerns the electromagnetic
    power-wave phasor, not a plasma-particle quantity or a spatially distributed
    plasma field.

    This is the forward-wave specialization of the relative antenna phasor phase
    defined by [wave phase of an ion-cyclotron-heating
    antenna](name:wave_phase_of_ion_cyclotron_heating_antenna). It is distinct
    from the relative phase of the reflected wave, [reflected phase of an
    ion-cyclotron-heating
    antenna](name:reflected_phase_of_ion_cyclotron_heating_antenna), and from
    the phase of the RF current carried by an antenna strap, [wave phase of an
    antenna strap](name:wave_phase_of_antenna_strap).

    Sign convention: Positive when the selected module's forward-wave phasor
    leads the first reference module in phase.
  unit: rad

- name: wave_power
  description: |-
    Rate at which electromagnetic-wave energy is transferred to a selected
    plasma particle population or charge state.
  documentation: |-
    This quantity is the net electromagnetic-wave power absorbed by plasma
    particles, representing energy transfer from the wave field to a selected
    population or charge state.

    $$
    P_{\rm abs} = \left.\frac{dE_{\rm particles}}{dt}\right|_{\rm waves}
    $$

    where $P_{\rm abs}$ is absorbed wave power and $E_{\rm particles}$ is the
    energy of the selected particle population; the subscript indicates that
    only energy transfer caused by the electromagnetic wave is included.

    The quantity excludes launched or generator power, unabsorbed wave power,
    and energy merely transported by the wave. Spatially cumulative instances,
    such as [ion charge-state power inside a flux
    surface](name:ion_charge_state_power_at_inside_flux_surface), apply this
    definition to a specified enclosed plasma volume.
  unit: W

- name: absorbed_wave_power
  description: |-
    Net electromagnetic-wave power transferred directly from coherent waves to a
    selected plasma particle population, integrated over the plasma volume and
    resolved by species or charge state.
  documentation: |-
    This quantity is the net rate at which coherent electromagnetic waves
    transfer energy directly to selected plasma particles. The selected
    population may be electrons, ions, or a specified ion charge state, with the
    result integrated over the plasma volume.

    $$
    P_{\rm abs} = \left.\frac{dE_{\rm particles}}{dt}\right|_{\rm waves}
    $$

    where $P_{\rm abs}$ is absorbed wave power, $E_{\rm particles}$ is the
    energy of the selected particle population, and the subscript “waves”
    restricts the energy-transfer rate to direct coupling from the
    electromagnetic wave field. This is the absorbed component of [wave
    power](name:wave_power), distinct from electromagnetic power that remains
    carried by the wave.

    The quantity includes direct wave-to-particle transfer and excludes
    subsequent collisional redistribution between particle populations.
    Species-resolved and charge-state-resolved instances include [electron
    absorbed wave power](name:electron_absorbed_wave_power) and ion charge-state
    absorbed wave power.
  unit: W

- name: ion_absorbed_wave_power
  description: |-
    Total coherent electromagnetic-wave power transferred directly to ion
    populations, integrated over the plasma volume and partitioned into thermal
    and fast-ion contributions.
  documentation: |-
    Ion absorbed wave power is the total rate of energy transfer from coherent
    electromagnetic waves to ion populations. It includes direct absorption by
    both bulk thermal ions and suprathermal fast ions.

    The volume-integrated ion power is defined by

    $$
    P_i^{\mathrm{abs}} = \int_V p_i^{\mathrm{abs}}(\mathbf{r})\,dV = P_{i,\mathrm{fast}}^{\mathrm{abs}} + P_{i,\mathrm{thermal}}^{\mathrm{abs}}
    $$

    where $P_i^{\mathrm{abs}}$ is the total ion absorbed wave power,
    $p_i^{\mathrm{abs}}(\mathbf{r})$ is the local wave power deposition density
    to ions, $V$ is the plasma volume, and the two terms are the [fast-ion
    absorbed wave power](name:fast_ion_absorbed_wave_power) and [thermal-ion
    absorbed wave power](name:thermal_ion_absorbed_wave_power). This quantity is
    the ion component of [absorbed wave power](name:absorbed_wave_power),
    excluding power transferred directly to electron populations; [electron
    absorbed wave power](name:electron_absorbed_wave_power) represents the
    corresponding electron channel.
  unit: W

- name: fast_ion_absorbed_wave_power
  description: |-
    Total coherent-wave power absorbed by the suprathermal ion population,
    integrated over the plasma volume and excluding thermal-ion absorption.
  documentation: |-
    The fast ion absorbed wave power is the volume-integrated power delivered by
    coherent electromagnetic waves to the suprathermal, nonthermal ion
    population through wave-particle interactions.

    $$
    P_{\mathrm{fast\,ion}} = \int_{V_{\mathrm{plasma}}} p_{\mathrm{abs,fast\,ion}}(\mathbf{r})\,\mathrm{d}V
    $$

    where $P_{\mathrm{fast\,ion}}$ is the total absorbed power,
    $p_{\mathrm{abs,fast\,ion}}(\mathbf{r})$ is the local power-absorption
    density for fast ions at position $\mathbf{r}$, and $V_{\mathrm{plasma}}$ is
    the plasma volume. This quantity is the fast-ion component of [ion absorbed
    wave power](name:ion_absorbed_wave_power), excluding power absorbed by
    thermal ions and electrons. It is aggregated over the coherent-wave channels
    and toroidal modes represented by the global quantity; [per-toroidal-mode
    fast-ion absorbed wave
    power](name:per_toroidal_mode_fast_ion_absorbed_wave_power) and [fast-ion
    power at an inside flux surface](name:fast_ion_power_at_inside_flux_surface)
    provide more resolved scopes.
  unit: W

- name: thermal_ion_absorbed_wave_power
  description: |-
    Total coherent-wave power absorbed by the bulk thermal (Maxwellian) ion
    population, integrated over the plasma volume.
  documentation: |-
    The thermal ion absorbed wave power is the volume-integrated power delivered
    by coherent electromagnetic waves to the bulk thermal (approximately
    Maxwellian) ion population via wave-particle resonance interactions. It is
    the thermal-ion component of
    [ion_absorbed_wave_power](name:ion_absorbed_wave_power), which spans all ion
    populations.

    $$
    P_{\mathrm{th,i}} = \int_{V} p_{\mathrm{th,i}}(\mathbf{r}) \, dV
    $$

    where $p_{\mathrm{th,i}}$ is the local wave power density absorbed by
    thermal ions and $V$ is the total plasma volume. The associated spatial
    deposition profile is described by
    [thermal_ion_power_density](name:thermal_ion_absorbed_wave_power_density).

    This quantity excludes power deposited into suprathermal (fast) ions. No
    ion-species qualifier is carried: it aggregates over all thermal ion species
    present in the plasma. Charge-state-resolved contributions are provided by
    [thermal_ion_charge_state_power](name:thermal_ion_charge_state_power);
    summing over all charge states and species recovers this global value.
  unit: W

- name: per_toroidal_mode_thermal_ion_absorbed_wave_power
  description: |-
    Absorbed coherent-wave power transferred directly to thermal ions of one
    species inside a magnetic flux surface, summed over charge states and
    resolved by toroidal Fourier mode.
  documentation: |-
    Thermal ion absorbed wave power per toroidal mode is the cumulative rate of
    direct energy transfer from coherent electromagnetic waves to the bulk,
    approximately Maxwellian ions of one selected species inside a closed
    magnetic flux surface. Each contribution corresponds to one toroidal Fourier
    harmonic.

    $$
    P_{i,\mathrm{th}}^{(n_\phi)}(\mathcal S) = \int_{V(\mathcal S)} q_{i,\mathrm{th}}^{(n_\phi)}\,dV
    $$

    where $P_{i,\mathrm{th}}^{(n_\phi)}$ is the cumulative absorbed power, $i$
    identifies the selected ion species, $\mathrm{th}$ denotes its thermal
    population, $n_\phi$ is the integer toroidal Fourier mode number, $\mathcal
    S$ is the selected magnetic flux surface, $V(\mathcal S)$ is its enclosed
    plasma volume, $q_{i,\mathrm{th}}^{(n_\phi)}$ is the local absorbed wave
    power density summed over all charge states of that species for the same
    harmonic, and $dV$ is a volume element.

    The quantity is summed over all charge states of the selected species, but
    not over ion species or toroidal modes. It is an enclosed-volume integral,
    not a local power density or necessarily a whole-plasma total. It excludes
    direct absorption by fast ions and electrons, energy remaining in the wave
    field, and energy subsequently redistributed between particle populations by
    collisions.

    Its charge-state-resolved contributions are represented by
    [per-toroidal-mode thermal ion charge-state
    power](name:per_toroidal_mode_thermal_ion_charge_state_power); summing those
    contributions over all charge states recovers this quantity. Summing over
    all toroidal-mode contributions at a flux surface enclosing the entire
    plasma recovers [thermal ion absorbed wave
    power](name:thermal_ion_absorbed_wave_power) for the same ion species and
    coherent-wave field.
  unit: W

- name: x_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  description: |-
    X-axis component of the unit vector defining an electron-cyclotron launcher
    mirror’s translation or rotation axis at its home position.
  documentation: |-
    This quantity is the Cartesian x projection of the unit vector that defines
    an electron-cyclotron launcher mirror’s translation direction or rotation
    axis at its home position.

    Let $\hat{d}$ denote this direction unit vector and $\hat{x}$ the x-axis
    unit vector in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis. The component is defined by

    $$
    d_x = \hat{d} \cdot \hat{x}
    $$

    where $d_x$ is the signed x-axis component and the unit-vector condition is
    $|\hat{d}|=1$.

    The component is dimensionless and is bounded by $-1 \leq d_x \leq 1$.
    Together with the [y-axis direction
    component](name:y_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [z-axis direction
    component](name:z_direction_unit_vector_of_electron_cyclotron_launcher_mirror),
    it specifies the mirror-axis orientation.
  unit: '1'

- name: y_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  description: |-
    Signed component along the y axis of the unit vector defining an
    electron-cyclotron launcher mirror’s translation direction or rotation axis
    at its home position, in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    The quantity is the signed y projection of the unit vector defining an
    electron-cyclotron launcher mirror’s translation direction or rotation axis
    at its home position.

    Let $d_y$ denote this component, $chat{\mathbf d}$ the defining unit
    direction vector, and $chat{\mathbf y}$ the unit vector along the positive y
    axis of the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis:

    $$
    d_y = \hat{\mathbf d} \cdot \hat{\mathbf y}
    $$

    The corresponding [x-axis
    component](name:x_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [z-axis
    component](name:z_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    complete the Cartesian components of the same unit vector. This quantity
    describes direction, not the mirror’s position or displacement.
  unit: '1'

- name: z_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  description: |-
    Signed component along the z axis of the unit vector defining an
    electron-cyclotron launcher mirror's translation direction or rotation axis
    at its home position, in the right-handed Cartesian (x, y, z) frame.
  documentation: |-
    Signed component along the z axis of the unit vector defining an
    electron-cyclotron launcher mirror's translation direction or rotation axis
    at its home position is the scalar projection of that mirror direction
    vector onto the z-axis basis direction in the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame. The $\hat{z}$ basis direction is
    vertical.

    For mirror direction unit vector $\mathbf{u}$, the component is defined by:

    $$
    u_z = \mathbf{u}\cdot\hat{\mathbf{z}}, \qquad \lVert\mathbf{u}\rVert = 1
    $$

    where $u_z$ is the z-axis component of the electron-cyclotron launcher
    mirror direction unit vector, $\mathbf{u}$ is the unit vector defining that
    mirror's translation direction or rotation axis at its home position,
    $\hat{\mathbf{z}}$ is the positive z-axis basis vector in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, and $\lVert\mathbf{u}\rVert$
    is the Euclidean norm of $\mathbf{u}$.

    The quantity applies to an individual electron-cyclotron launcher mirror at
    its home position. It is a single Cartesian component of the movement
    direction or rotation axis, not an aggregate over launchers or mirrors and
    not an average over a range of mirror motion.

    It is not a mirror position, displacement, the vertical coordinate of a
    point, or the angle of the electron-cyclotron launcher mirror. The
    corresponding [x-axis
    component](name:x_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [y-axis
    component](name:y_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    complete the same home-position unit vector; with $u_x$ and $u_y$ denoting
    those linked components, the components satisfy $u_x^2 + u_y^2 + u_z^2 = 1$.
  unit: '1'

- name: fast_ion_charge_state_power_density
  description: |-
    Volumetric rate of coherent radio-frequency wave energy absorption by fast
    ions of a specified species and charge state or bundle, locally or averaged
    over a magnetic flux surface.
  documentation: |-
    Fast-ion charge-state power density is the rate at which coherent
    radio-frequency waves transfer energy directly to nonthermal fast ions of a
    specified species and charge state or charge-state bundle per unit physical
    volume. It encompasses local absorption and its flux-surface average, which
    represents deposition averaged over a magnetic flux surface.

    The local absorption density and its flux-surface-averaged form are defined
    by

    $$
    p_{\mathrm{f},C}^{\mathrm{loc}} = \sum_{z\in C}\frac{dP_{\mathrm{f},z}^{\mathrm{abs}}}{dV},
    \qquad
    p_{\mathrm{f},C}^{\mathrm{fs}} = \left\langle p_{\mathrm{f},C}^{\mathrm{loc}}\right\rangle_{\mathrm{fs}}
    $$

    where $p_{\mathrm{f},C}^{\mathrm{loc}}$ is the local fast-ion absorption
    density, $p_{\mathrm{f},C}^{\mathrm{fs}}$ is its flux-surface average, $C$
    is the selected set of ionic charge states, $z$ identifies an included
    charge state, $P_{\mathrm{f},z}^{\mathrm{abs}}$ is the wave power absorbed
    by fast ions in that state, $V$ is physical volume, and
    $\langle\cdot\rangle_{\mathrm{fs}}$ denotes a flux-surface average.

    A single-state quantity includes only that charge state; a bundle is summed
    over its included states, not over every charge state of the species. The
    recipient population excludes thermal ions. The quantity describes direct
    wave absorption, not subsequent collisional redistribution, stored fast-ion
    energy, or volume-integrated absorbed power.

    This is the fast-population, direct-wave-absorption contribution to [ion
    charge-state power density](name:ion_charge_state_power_density), rather
    than its full net energy-source term. Summing nonoverlapping contributions
    over all ionic charge states gives [fast-ion power
    density](name:fast_ion_power_density) for the same species, wave content,
    and spatial averaging. The [toroidal-mode-resolved
    counterpart](name:per_toroidal_mode_fast_ion_charge_state_power_density)
    additionally separates this absorption by toroidal Fourier mode.
  unit: W.m^-3

- name: per_toroidal_mode_fast_ion_charge_state_power_density
  description: |-
    Volumetric rate of direct coherent-wave energy absorption by fast ions of a
    specified species and charge state or bundle, resolved by toroidal mode. It
    is expressed either locally or as an average over a magnetic flux surface.
  documentation: |-
    Mode-resolved fast-ion charge-state power density is the rate per physical
    volume at which coherent-wave energy is absorbed directly by fast ions of a
    specified species and charge state or charge-state bundle. The contribution
    from each toroidal mode is resolved separately, and the spatial quantity may
    be local or averaged over a magnetic flux surface.

    The local absorbed power density for a toroidal mode is defined by

    $$
    p_{s,q}^{(n_\phi)}(\mathbf{x}) = \frac{dP_{\mathrm{abs},s,q}^{(n_\phi)}}{dV}
    $$

    where $p_{s,q}^{(n_\phi)}(\mathbf{x})$ is the local power density absorbed
    from mode $n_\phi$, $P_{\mathrm{abs},s,q}^{(n_\phi)}$ is the power absorbed
    from that mode by the specified fast-ion population within volume $V$, $V$
    is physical volume, and $\mathbf{x}$ is spatial position. The index $s$
    identifies the ion species, $q$ identifies its charge state or charge-state
    bundle, and $n_\phi$ is the toroidal Fourier mode number. The
    flux-surface-averaged form is the average of the local quantity over the
    corresponding magnetic flux surface.

    The recipient population is the fast-ion population of the specified species
    and charge state or bundle; different species are not combined. A bundle
    includes the sum over its constituent charge states, while separate toroidal
    modes remain resolved. The quantity excludes absorption by thermal ions and
    electrons, as well as subsequent collisional redistribution of absorbed
    energy. It represents a mode's absorbed-power contribution, not a Fourier
    coefficient of the spatial power-density field.

    At fixed mode, summing over all charge states of the same species gives the
    [per-toroidal-mode fast-ion power
    density](name:per_toroidal_mode_fast_ion_power_density). Summing over
    toroidal modes and integrating over the plasma volume gives the [fast-ion
    charge-state absorbed wave
    power](name:fast_ion_charge_state_absorbed_wave_power) for the specified
    species and charge state or bundle.

    Sign convention: Positive when coherent-wave energy is transferred to the
    specified fast-ion population.
  unit: W.m^-3

- name: fast_ion_power_density
  description: |-
    Volumetric rate of energy transfer from coherent radio-frequency waves to
    nonthermal fast ions of a selected species, summed over all ionic charge
    states.
  documentation: |-
    Fast-ion power density is the rate at which coherent radio-frequency waves
    transfer energy directly to the nonthermal fast-ion population of a selected
    ion species per unit physical volume. It describes spatially resolved wave
    absorption and also encompasses its flux-surface-averaged form.

    The volumetric deposition rate is defined by

    $$
    Q_i^{\mathrm{fast}} = \frac{dP_i^{\mathrm{fast}}}{dV}
    $$

    where $Q_i^{\mathrm{fast}}$ is the fast-ion absorbed wave power density,
    $P_i^{\mathrm{fast}}$ is the wave power absorbed directly by the fast
    population of ion species $i$, and $V$ is physical plasma volume.

    The quantity is summed over all ionic charge states of the selected species,
    not over different ion species. The [fast-ion charge-state power
    density](name:fast_ion_charge_state_power_density) resolves the
    corresponding contributions by charge state or charge-state bundle. Direct
    absorption by thermal ions or electrons and subsequent collisional
    redistribution of the absorbed fast-ion energy are excluded.

    This quantity is the fast-ion direct-wave-absorption contribution to [ion
    power density](name:ion_power_density), rather than the full ion energy
    source from all processes. Flux-surface averaging preserves its recipient
    population and energy-transfer scope but is not required by this general
    definition. The [per-toroidal-mode fast-ion power
    density](name:per_toroidal_mode_fast_ion_power_density) further resolves the
    flux-surface-averaged deposition by toroidal Fourier harmonic.
  unit: W.m^-3

- name: per_toroidal_mode_fast_ion_power_density
  description: |-
    Flux-surface-averaged volumetric rate of coherent-wave energy transfer to
    fast, nonthermal ions of a selected species, summed over ionic charge states
    and resolved by toroidal Fourier mode.
  documentation: |-
    Toroidal-mode-resolved fast-ion power density is the flux-surface-averaged
    rate at which an individual toroidal wave harmonic transfers energy to the
    nonthermal fast-ion population of a selected species per unit physical
    volume. It describes direct coherent-wave absorption, not subsequent
    collisional redistribution of the absorbed energy.

    For each toroidal harmonic, the averaged deposition density is defined by

    $$
    p_{i,\mathrm{f}}(n_\phi) = \left\langle \frac{dE_{i,\mathrm{f}}(n_\phi)}{dt\,dV} \right\rangle_{\mathrm{fs}}
    $$

    where $p_{i,\mathrm{f}}(n_\phi)$ is the mode-resolved fast-ion power
    density, $i$ labels the selected ion species, $\mathrm{f}$ identifies its
    fast population, $n_\phi$ is the integer toroidal Fourier mode number, and
    $E_{i,\mathrm{f}}(n_\phi)$ is the energy transferred by that harmonic to
    this population. Here $t$ is time, $V$ is physical volume, and
    $\langle\cdot\rangle_{\mathrm{fs}}$ denotes averaging over the magnetic flux
    surface.

    The species contribution is summed over all ionic charge states, but not
    over different ion species or toroidal harmonics. The [charge-state-resolved
    counterpart](name:per_toroidal_mode_fast_ion_charge_state_power_density)
    separates the contributions whose sum gives this species-level quantity.
    Thermal ions and electrons are excluded. The flux-surface average is
    distinct from the unaveraged local deposition density and is not a
    volume-integrated power.

    Summing over a complete, consistently normalized set of toroidal harmonics
    recovers the flux-surface-averaged [fast-ion power
    density](name:fast_ion_power_density). Integrating the averaged density over
    an enclosed physical volume gives the corresponding [mode-resolved fast-ion
    absorbed wave power](name:per_toroidal_mode_fast_ion_absorbed_wave_power).
    Each harmonic contribution is an absorbed power density, not a Fourier
    amplitude of the deposited-power distribution.

    Sign convention: Positive when energy is transferred from the coherent wave
    to the fast-ion population.
  unit: W.m^-3

- name: left_hand_circularly_polarized_wave_electric_field_imaginary_part
  description: |-
    Signed imaginary quadrature of the left-hand circular E-plus wave
    electric-field phasor along a beam or ray path, relative to a specified
    phase reference.
  documentation: |-
    This quantity is the imaginary quadrature of the left-hand circularly
    polarized E-plus component of a wave [electric field](name:electric_field)
    phasor along its propagation path. It retains signed phase information and
    is not the field amplitude or the instantaneous physical electric field.

    The defining relation is:

    $$
    E_{+,I} = \operatorname{Im}(E_+)
    $$

    where $E_{+,I}$ is the signed imaginary quadrature, $E_+$ is the [left-hand
    circularly polarized wave electric-field
    phasor](name:left_hand_circularly_polarized_wave_electric_field), and
    $\operatorname{Im}$ selects its imaginary part.

    The parent polarization component is transverse to the local equilibrium
    magnetic field. This quadrature is evaluated locally along the beam or ray
    propagation path, including electron cyclotron emission paths; it is not
    integrated along that path. It inherits the circular-polarization basis and
    phase reference of the parent phasor.

    Together with the [left-hand circularly polarized real
    part](name:left_hand_circularly_polarized_wave_electric_field_real_part), it
    reconstructs the parent component through $E_+ = E_{+,R} + iE_{+,I}$, where
    $E_{+,R}$ is the real, in-phase quadrature and $i$ is the imaginary unit.
    Changing the phase reference mixes the two quadratures without changing the
    physical polarization.

    Sign convention: Positive when the E-plus phasor lies in the upper half of
    the complex plane defined by the specified phase reference.
  unit: V.m^-1

- name: perpendicular_fast_particle_energy
  description: |-
    Perpendicular fast-particle energy is the part of the suprathermal particle
    kinetic energy associated with motion perpendicular to the local magnetic
    field, integrated over the plasma volume.
  documentation: |-
    Perpendicular fast-particle energy is the part of the kinetic energy of the
    suprathermal particle population associated with motion perpendicular to the
    local magnetic field. It complements [parallel fast-particle
    energy](name:parallel_fast_particle_energy) within the total [fast-particle
    energy](name:fast_particle_energy).

    It is defined by

    $$
    W_{\perp,\mathrm{fast}} = \int_{\mathcal{V}} \int \frac{1}{2} m v_\perp^2 f_{\mathrm{fast}}(\mathbf{r},\mathbf{v})\,d^3v\,d^3r
    $$

    where $\mathcal{V}$ is the plasma volume,
    $f_{\mathrm{fast}}(\mathbf{r},\mathbf{v})$ is the fast-particle phase-space
    distribution, $m$ is particle mass, and $v_\perp$ is the speed component
    perpendicular to the local magnetic field. For a gyrotropic distribution,
    the corresponding energy density is the perpendicular pressure, so the
    quantity equals the volume integral of [perpendicular fast-particle
    pressure](name:perpendicular_fast_particle_pressure), summed over the
    included fast-particle species.
  unit: J

- name: radial_coordinate_of_electron_cyclotron_launcher_mirror
  description: |-
    Major-radius coordinate locating the sphere center that defines an
    electron-cyclotron launcher mirror in the right-handed cylindrical (R, φ, Z)
    frame.
  documentation: |-
    The quantity is the major-radius coordinate $R$ of the center of the sphere
    that defines an electron-cyclotron launcher mirror. It identifies the
    mirror's geometric reference point rather than a point on the reflecting
    surface.

    In the right-handed cylindrical $(R,\phi,Z)$ frame, the major-radius
    coordinate relates to right-handed Cartesian coordinates $(x,y,z)$ through

    $$
    R = \sqrt{x^2+y^2}
    $$

    where $R$ is the major-radius coordinate, $x$ and $y$ are the Cartesian
    coordinate values in the $(\hat{x},\hat{y},\hat{z})$ basis, $\phi$ is
    toroidal angle, and $Z$ is vertical height.

    The quantity applies to the electron-cyclotron launcher mirror's spherical
    defining geometry and represents one geometric point. It is not a plasma
    quantity, a surface coordinate, a mirror steering angle, or an average or
    integral over the mirror.

    The broader [radial coordinate](name:radial_coordinate) concept is
    specialized here to the sphere center of the mirror. Together with the
    [vertical coordinate of the electron-cyclotron launcher
    mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror) and
    [toroidal coordinate of the electron-cyclotron launcher
    mirror](name:toroidal_coordinate_of_electron_cyclotron_launcher_mirror), it
    locates the same geometric center.
  unit: m

- name: radial_coordinate_of_launching_position
  description: |-
    Major-radius coordinate of the beam launching position, measured from the
    toroidal symmetry axis in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    Major-radius coordinate of launching position

    In the right-handed cylindrical $(R, \phi, Z)$ frame, the coordinate is
    defined by

    $$
    R = \sqrt{x^2 + y^2}
    $$

    where $R$ is the major-radius coordinate at the launching position, $\phi$
    is toroidal angle, and $Z$ is vertical height. The quantities $x$ and $y$
    are the horizontal coordinates of the same position in a right-handed
    Cartesian $(x, y, z)$ frame, whose vertical $z$ axis coincides with the
    toroidal symmetry axis.

    This is a locus-specific specialization of
    [radial_coordinate](name:radial_coordinate): it applies pointwise to the
    specified beam launching position, rather than representing an average over
    beams or coordinates along a beam trajectory. It is distinct from the
    [radial coordinate of an electron-cyclotron launcher
    mirror](name:radial_coordinate_of_electron_cyclotron_launcher_mirror), which
    locates the mirror's reference geometry rather than the beam launching
    position.
  unit: m

- name: radial_coordinate_of_neutral_beam_injector
  description: |-
    Major-radius coordinate of the neutral beam injector center, measured from
    the toroidal symmetry axis in the right-handed cylindrical (R, φ, Z) frame.
  documentation: |-
    The radial coordinate of a neutral beam injector is the major-radius
    location of the injector unit center relative to the toroidal symmetry axis.
    It is a nonnegative geometric coordinate in the right-handed cylindrical
    $(R,\\phi,Z)$ frame, where $R$ is major radius, $\\phi$ is toroidal angle,
    and $Z$ is vertical height.

    For the injector center, the radial coordinate is related to its Cartesian
    coordinates by

    $$
    R = \\sqrt{x^2+y^2}
    $$

    where $x$ and $y$ are the horizontal Cartesian coordinates of the same
    injector center in the right-handed Cartesian $(\\hat{x},\\hat{y},\\hat{z})$
    basis.

    This quantity applies to one selected neutral beam injector unit and
    represents the unit-center position only. It is not an aggregate over
    multiple injectors and does not represent a beam trajectory, launch point,
    deposition location, or plasma response.

    It is the neutral-beam-injector specialization of the general [radial
    coordinate](name:radial_coordinate), with the geometric point fixed to the
    injector unit center.
  unit: m

- name: radial_wave_electric_field
  description: |-
    Complex phasor of the wave electric field projected onto the R direction of
    the right-handed cylindrical (R, φ, Z) frame, preserving local amplitude,
    phase, and radial polarization.
  documentation: |-
    The radial wave electric field is the complex phasor obtained by projecting
    the electromagnetic-wave electric-field phasor onto the cylindrical
    major-radius direction. It is a component of the [wave electric
    field](name:wave_electric_field) and retains the local wave amplitude and
    phase.

    For a wave with angular frequency $\omega$, the radial phasor is defined by

    $$
    \widetilde{E}_r(\mathbf{r},\omega)=\widetilde{\mathbf{E}}_{\mathrm{wave}}(\mathbf{r},\omega)\cdot\hat{R}
    $$

    where $\widetilde{\mathbf{E}}_{\mathrm{wave}}$ is the complex
    wave-electric-field phasor, $\mathbf{r}$ is position, and $\hat{R}$ is the
    major-radius unit vector in the right-handed cylindrical $(R,\phi,Z)$ frame.
    Unlike the [normal wave electric field](name:normal_wave_electric_field),
    this component follows the cylindrical $R$ direction and is not a projection
    normal to a magnetic flux surface. It complements the [vertical wave
    electric field](name:vertical_wave_electric_field) in describing cylindrical
    polarization.

    Sign convention: Positive when the corresponding electric-field component
    points toward increasing major radius $R$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.
  unit: V.m^-1

- name: thermal_electron_power_density
  description: |-
    Volumetric rate of coherent-wave energy deposition into bulk thermal
    electrons, including its average over a magnetic flux surface.
  documentation: |-
    Thermal-electron power density is the rate at which coherent electromagnetic
    waves transfer energy directly to the bulk thermal electron population per
    unit physical volume. Its flux-surface-averaged form describes the mean
    deposition on a magnetic flux surface; the underlying local quantity
    describes deposition within that surface.

    The flux-surface-averaged deposition is defined by

    $$
    \overline{p}_{\mathrm{e,th}} = \left\langle p_{\mathrm{e,th}} \right\rangle_{\mathrm{fs}} = \left\langle \frac{dP_{\mathrm{abs,e,th}}}{dV} \right\rangle_{\mathrm{fs}}
    $$

    where $\overline{p}_{\mathrm{e,th}}$ is the flux-surface-averaged
    thermal-electron power density, $p_{\mathrm{e,th}}$ is the local
    thermal-electron power density, $P_{\mathrm{abs,e,th}}$ is the coherent-wave
    power absorbed by thermal electrons within physical volume $V$, and
    $\langle\cdot\rangle_{\mathrm{fs}}$ denotes an average over the magnetic
    flux surface.

    The recipient population is restricted to bulk thermal electrons. Absorption
    by nonthermal electrons belongs to [fast-electron absorbed wave power
    density](name:fast_electron_absorbed_wave_power_density). This quantity is
    the direct wave-absorption contribution to [electron power
    density](name:electron_power_density), not the net sum of all electron
    heating and cooling channels; it excludes [collisional electron energy
    exchange](name:electron_power_density_due_to_collisions), including
    subsequent collisional redistribution of deposited energy.

    [Mode-resolved thermal-electron power
    density](name:per_toroidal_mode_thermal_electron_power_density) specializes
    this deposition by individual toroidal Fourier harmonic. Flux-surface
    averaging retains the volumetric normalization rather than integrating over
    the enclosed volume. Integrating that average with the enclosed-volume
    measure gives the [cumulative thermal-electron absorbed power inside the
    flux surface](name:thermal_electron_power_at_inside_flux_surface).
  unit: W.m^-3

- name: per_toroidal_mode_thermal_electron_power_density
  description: |-
    Thermal-electron absorbed wave power density per toroidal mode is the
    volumetric rate of coherent-wave energy absorption by bulk thermal electrons
    attributed to an individual toroidal mode number. It is represented locally
    across a poloidal cross-section or as a flux-surface average.
  documentation: |-
    Thermal-electron absorbed wave power density per toroidal mode is the rate
    at which coherent-wave energy is absorbed by the bulk thermal-electron
    population per unit physical volume, attributed to an individual toroidal
    mode number.

    For toroidal mode number $n_\phi$, the local absorbed power density is
    defined as

    $$
    p_{e,n_\phi}(\mathbf{x}) = \frac{dE^{\mathrm{abs}}_{e,n_\phi}}{dt\,dV}(\mathbf{x})
    $$

    where $p_{e,n_\phi}$ is the absorbed power density attributed to mode
    $n_\phi$, $E^{\mathrm{abs}}_{e,n_\phi}$ is the energy absorbed by thermal
    electrons from coherent waves attributed to that mode, $t$ is time, $V$ is
    physical volume, $dV$ is a volume element, $\mathbf{x}$ is position in a
    poloidal cross-section, $n_\phi$ is the toroidal mode number, and $e$
    identifies the electron population.

    The recipient population is bulk thermal electrons, and the mode index
    identifies an individual contribution to absorbed wave power. The quantity
    may describe the local deposition across a poloidal cross-section or its
    average over a magnetic flux surface. It excludes absorption by fast
    electrons and ions, as well as electron energy transfer from non-wave
    processes. The mode-resolved quantity is not a Fourier coefficient of the
    spatially varying deposition field or a volume-integrated power.

    For a complete modal decomposition, summing the contributions over mode
    numbers gives the mode-summed coherent-wave absorbed power density for bulk
    thermal electrons. This is one recipient-population component of the [total
    absorbed wave power density per toroidal
    mode](name:per_toroidal_mode_total_absorbed_wave_power_density), and
    contributes to the broader [thermal-electron power
    density](name:thermal_electron_power_density), which can include non-wave
    energy transfers. Integrating one mode's density over a physical volume
    gives the corresponding [thermal-electron absorbed wave power per toroidal
    mode](name:per_toroidal_mode_thermal_electron_absorbed_wave_power).
  unit: W.m^-3

- name: thermal_ion_charge_state_power_density
  description: |-
    Volumetric rate of coherent-wave power absorbed by bulk thermal ions of a
    selected species and charge state, or a selected bundle of charge states. It
    is represented as a local value or as an average over a magnetic flux
    surface.
  documentation: |-
    Thermal ion charge-state power density is the volumetric rate of
    coherent-wave power absorbed by bulk thermal ions associated with a selected
    ion species and charge state, or a selected bundle of charge states. It can
    be expressed as a local value or as an average over a magnetic flux surface.

    The local absorbed-power density is defined by

    $$
    p_{\mathrm{th},a} = \frac{dP_{\mathrm{abs,th},a}}{dV}
    $$

    where $p_{\mathrm{th},a}$ is the thermal ion charge-state power density,
    $P_{\mathrm{abs,th},a}$ is the coherent-wave power absorbed by the selected
    thermal-ion population, $V$ is physical volume, the subscript $\mathrm{th}$
    identifies the bulk thermal-ion population, and $a$ identifies the selected
    species and charge state or charge-state bundle.

    The recipient population is bulk thermal ions of the selected species. For a
    charge-state bundle, the value is summed over its constituent charge states;
    it is not summed over other charge states or species. The local value
    resolves spatial deposition, while the flux-surface-averaged value averages
    that deposition over a magnetic flux surface without changing the recipient
    population or energy-transfer channel.

    This quantity excludes absorption by nonthermal fast ions, described by
    [fast-ion charge-state power
    density](name:fast_ion_charge_state_power_density). It is the coherent-wave
    absorption contribution to [ion charge-state power
    density](name:ion_charge_state_power_density), which is the net
    energy-transfer rate across the included processes. Collisional energy
    transfer to thermal ions is distinct from wave absorption and is described
    by [thermal-ion charge-state power density due to
    collisions](name:thermal_ion_charge_state_power_density_due_to_collisions).

    The [toroidal-mode-resolved
    counterpart](name:per_toroidal_mode_thermal_ion_charge_state_power_density)
    resolves this deposition by toroidal Fourier harmonic. Integrating the
    flux-surface-averaged density over the volume enclosed by a magnetic flux
    surface gives the [thermal ion charge-state power at the enclosed flux
    surface](name:thermal_ion_charge_state_power_at_inside_flux_surface).
  unit: W.m^-3

- name: per_toroidal_mode_thermal_ion_charge_state_power_density
  description: |-
    Flux-surface-averaged volumetric rate of coherent radio-frequency wave
    energy absorption by thermal ions of a specified species and charge state,
    resolved by toroidal Fourier mode number.
  documentation: |-
    Toroidal-mode-resolved thermal-ion charge-state power density is the
    flux-surface-averaged rate at which coherent radio-frequency waves transfer
    energy directly to thermal ions of a specified species and charge state per
    unit physical volume. Each contribution corresponds to one toroidal Fourier
    harmonic.

    For a magnetic flux surface, the mode-resolved deposition is defined by

    $$
    p_{a,z}^{(n_\phi)} = \left\langle Q_{a,z}^{(n_\phi)} \right\rangle_{\mathrm{fs}}
    $$

    where $p_{a,z}^{(n_\phi)}$ is the flux-surface-averaged modal power density,
    $Q_{a,z}^{(n_\phi)}$ is the corresponding local volumetric rate of wave
    energy transfer to thermal ions, $a$ identifies the ion species, $z$
    identifies its charge state, $n_\phi$ is the integer toroidal Fourier mode
    number, and $\langle\cdot\rangle_{\mathrm{fs}}$ denotes averaging over that
    magnetic flux surface.

    The recipient population is restricted to bulk thermal ions of the selected
    species and charge state; neither charge states nor toroidal modes are
    summed. This quantity describes direct wave absorption, not subsequent
    collisional energy redistribution, a local deposition value before
    flux-surface averaging, or volume-integrated absorbed power. The [fast-ion
    counterpart](name:per_toroidal_mode_fast_ion_charge_state_power_density)
    instead describes absorption by nonthermal ions.

    Summing over all included toroidal harmonics recovers the flux-surface
    average of [thermal-ion charge-state power
    density](name:thermal_ion_charge_state_power_density), not its unaveraged
    local value.
  unit: W.m^-3
