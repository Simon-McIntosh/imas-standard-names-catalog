- name: vertical_coordinate_of_diagnostic_component_center
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the geometric center of a diagnostic component
    such as an aperture, filter window, reflector, or detector, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical coordinate $Z$ locates the center of a diagnostic optical\
    \ or radiation-sensitive element along the machine symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $Z = 0$ is the machine midplane. This\
    \ coordinate is part of the full three-dimensional position description given\
    \ by [coordinate_of_diagnostic_component_center](name:coordinate_of_diagnostic_component_center),\
    \ which also includes the major-radius and toroidal-angle components. It applies\
    \ to a broad range of hardware elements \u2014 apertures, filter windows, reflectors,\
    \ detectors, and antennas \u2014 and is used in line-of-sight ray tracing, solid-angle\
    \ calculations, and geometric calibration of particle and radiation diagnostics.\
    \ Typical values range from approximately $-2$ m to $+2$ m for components mounted\
    \ within or around a tokamak vacuum vessel; components on the outboard midplane\
    \ have $Z \\approx 0$, while upper or lower port components may reach $|Z| \\\
    approx 1$\u2013$2$ m. This quantity complements [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight)\
    \ and [vertical_coordinate_of_emission_grid_point](name:vertical_coordinate_of_emission_grid_point),\
    \ which define related geometric reference points along the diagnostic beam path.\n\
    \nSign convention: Positive when $Z$ is above the machine midplane in the direction\
    \ of increasing $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
