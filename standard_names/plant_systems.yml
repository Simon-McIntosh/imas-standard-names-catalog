- name: accumulated_carbon_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown carbon inventory from gas injection, expressed
    as six equivalent-electron counts for every injected neutral carbon atom.
  documentation: 'This quantity is the cumulative post-breakdown inventory of carbon
    atoms delivered by gas injection, represented as an equivalent-electron count.
    It excludes carbon introduced during the plasma prefill phase and does not represent
    an instantaneous source rate or a charge-state-resolved ion inventory.


    The equivalent-electron count is defined by


    $$

    N_{\mathrm{C,eq}}(t)=6N_{\mathrm{C}}(t)=6\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{C}}^{\mathrm{gas}}(t'')\,dt''

    $$


    where $N_{\mathrm{C,eq}}$ is the equivalent-electron count, $N_{\mathrm{C}}$ is
    the cumulative number of injected carbon atoms, $\dot{N}_{\mathrm{C}}^{\mathrm{gas}}$
    is the carbon injection rate, $t_{\mathrm{bd}}$ is the plasma breakdown time,
    and $t$ is the evaluation time. The factor 6 is carbon''s atomic number. This
    is the post-breakdown component of [carbon count due to gas injection](name:carbon_count_due_to_gas_injection)
    and is distinct from [carbon prefill count due to gas injection](name:carbon_prefill_count_due_to_gas_injection).'
