- name: toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted flux-surface average of the toroidal bulk-flow velocity
    of tritium ions on the last closed flux surface at the plasma boundary.
  documentation: 'The quantity is the toroidal component of the tritium-ion bulk-flow
    velocity, averaged over the separatrix, or last closed magnetic flux surface.
    The tritium value is the density-weighted mean over all tritium ion charge states
    and describes directed ion motion rather than thermal speed.


    The flux-surface average is defined by


    $$

    \left\langle v_\phi \right\rangle_{\mathrm{FS}} = \frac{\oint_{\mathrm{sep}} v_\phi\,
    dl/B_p}{\oint_{\mathrm{sep}} dl/B_p}

    $$


    where $v_\phi$ is the toroidal velocity, $dl$ is differential distance along the
    separatrix, and $B_p$ is the poloidal magnetic-field magnitude. The toroidal projection
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. Its charge-state
    aggregation complements [flux-surface-averaged tritium density at the plasma boundary](name:flux_surface_averaged_tritium_density_at_plasma_boundary);
    the corresponding total-ion quantity is [toroidal flux-surface-averaged ion velocity
    at the plasma boundary](name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary).


    Sign convention: Positive when the tritium bulk flow points in the direction of
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_tritium_density_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary
  sources:
