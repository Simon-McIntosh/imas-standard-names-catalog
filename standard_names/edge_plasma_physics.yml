- name: current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Magnitude of the net current density driven by the diamagnetic drift
    of the bulk plasma, arising from the pressure gradient perpendicular to the magnetic
    field.
  documentation: "The diamagnetic drift current density $\\mathbf{j}_{\\mathrm{dia}}\
    \ = \\left( \\mathbf{B} \\times \\nabla p \\right) / B^2$ arises from the imbalance\
    \ between the ion and electron diamagnetic drifts in the presence of a pressure\
    \ gradient $\\nabla p$ across the magnetic field $\\mathbf{B}$, where $p$ is the\
    \ total plasma pressure in Pa and $B$ is the magnetic field magnitude in T. This\
    \ scalar quantity gives the magnitude of the diamagnetic current density vector,\
    \ which contributes to the total current density in magnetized edge and scrape-off\
    \ layer (SOL) plasmas and plays a key role in the radial force balance. Typical\
    \ values in the tokamak edge region range from 0.1\u201310 MA\xB7m$^{-2}$ in H-mode\
    \ pedestals depending on the steepness of the pressure gradient. The diamagnetic\
    \ current density is related to the diamagnetic drift velocities of individual\
    \ species via $j_{\\mathrm{dia}} = e (n_i v_{i,\\mathrm{dia}} - n_e v_{e,\\mathrm{dia}})$,\
    \ where $n_i$ and $n_e$ are the ion and electron densities. For species-resolved\
    \ drift velocities, see [ion_diamagnetic_velocity](name:ion_diamagnetic_velocity)\
    \ and corresponding electron quantities. The directional components are available\
    \ as [radial_current_density_due_to_diamagnetic_drift](name:radial_current_density_due_to_diamagnetic_drift),\
    \ [poloidal_current_density_due_to_diamagnetic_drift](name:poloidal_current_density_due_to_diamagnetic_drift),\
    \ and [toroidal_current_density_due_to_diamagnetic_drift](name:toroidal_current_density_due_to_diamagnetic_drift).\
    \ This current density is distinct from the parallel viscous and perpendicular\
    \ viscous current densities [current_density_due_to_parallel_viscosity](name:current_density_due_to_parallel_viscosity)\
    \ and [current_density_due_to_perpendicular_viscosity](name:current_density_due_to_perpendicular_viscosity),\
    \ which originate from different momentum transport mechanisms.\n\nSign convention:\
    \ Positive when the diamagnetic current density vector points in the direction\
    \ of increasing poloidal angle relative to the right-handed $(R, \\phi, Z)$ cylindrical\
    \ frame, consistent with the sign of the pressure gradient driving the drift."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_diamagnetic_velocity
