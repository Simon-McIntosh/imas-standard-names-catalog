- name: radiated_power_over_core_region
  kind: scalar
  status: active
  description: Total electromagnetic power radiated by plasma inside the last closed
    flux surface, representing the core-region contribution to global radiative energy
    loss.
  documentation: 'Radiated power over the core region is the total electromagnetic
    energy-loss rate carried away by radiation emitted within the plasma volume inside
    the last closed flux surface (LCFS). It is a regional integral rather than a local
    radiated-power density.


    The defining volume integral is


    $$

    P_{\rm core} = \int_{V_{\rm core}} p_{\rm rad}(\mathbf{r})\,dV

    $$


    where $P_{\rm core}$ is the core-region radiated power, $p_{\rm rad}(\mathbf{r})$
    is the local volumetric radiated-power density at position $\mathbf{r}$, $V_{\rm
    core}$ is the plasma volume inside the LCFS, and $dV$ is the differential volume
    element.


    The quantity includes the aggregate electromagnetic radiation from all emission
    channels within the LCFS. It excludes radiation emitted in the scrape-off layer,
    divertor, and other plasma regions outside the LCFS; it is therefore distinct
    from [total plasma radiated power](name:total_plasma_radiated_power), which integrates
    radiation over the full plasma volume.


    The integrand is the local [power density due to radiation](name:power_density_due_to_radiation),
    and integration over the core region gives its corresponding regional total.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:total_plasma_radiated_power
  sources:
  - kind: imas-dd
    ref: bolometer/power_radiated_inside_lcfs
    version: 4.1.0
  - kind: imas-dd
    ref: summary/global_quantities/power_radiated_inside_lcfs/value
    version: 4.1.0
- name: ratio_of_neutral_density_of_isotope_to_difference_of_total_neutral_density_and_neutral_density_of_isotope
  kind: scalar
  status: active
  description: Odds ratio of the neutral density of a selected hydrogen isotope to
    the summed neutral density of all other hydrogen isotopes, distinguishing composition
    odds from total isotope fraction.
  documentation: 'This quantity is the neutral-population odds ratio for one selected
    hydrogen isotope relative to all other hydrogen isotopes. It characterizes isotope
    composition using neutral atoms only, with the comparison population aggregated
    across every other isotope.


    $$

    R_i = \frac{n_i}{\sum_{j \ne i} n_j}

    $$


    Here, $R_i$ is the isotope density ratio, $i$ identifies the selected hydrogen
    isotope, $n_i$ is its neutral number density, and $n_j$ is the neutral number
    density of another hydrogen isotope. The summation includes all hydrogen isotopes
    other than the selected isotope.


    The denominator is a total over the other neutral isotope populations, while the
    numerator contains only the selected isotope. This quantity excludes ionized populations
    and differs from [total_hydrogenic_density](name:total_hydrogenic_density), which
    includes the hydrogenic population across its applicable charge states and isotopes.
    It is an odds ratio rather than the selected isotope''s fraction of the total
    neutral population; if $f_i$ denotes that corresponding neutral isotope fraction,
    then $f_i = R_i/(1+R_i)$.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/isotope_ratios/isotope/density_ratio
    version: 4.1.0
- name: spectral_bremsstrahlung_radiance
  kind: scalar
  status: active
  description: Photon-number radiance of free-free plasma emission resolved per unit
    wavelength and viewing direction.
  documentation: 'Bremsstrahlung spectral radiance is the directional photon-number
    radiance of the free-free continuum emitted when plasma electrons accelerate in
    Coulomb fields of charged particles. It represents the continuum contribution
    to radiation resolved spectrally rather than a discrete emission transition.


    For wavelength-resolved photon radiance, the defining relation is:


    $$

    L^{\mathrm{ff}}_{\lambda} = \frac{dN_{\gamma}}{dA_{\perp}\,dt\,d\Omega\,d\lambda}

    $$


    where $L^{\mathrm{ff}}_{\lambda}$ is the bremsstrahlung spectral radiance, $N_{\gamma}$
    is the photon count, $A_{\perp}$ is area projected normal to the viewing direction,
    $t$ is time, $\Omega$ is solid angle, and $\lambda$ is wavelength. The superscript
    $\mathrm{ff}$ denotes free-free bremsstrahlung.


    This quantity applies to plasma bremsstrahlung accumulated along a viewing direction,
    with photon emission resolved by wavelength and solid angle. It is a continuum
    radiance and is not integrated over wavelength, summed over viewing directions,
    or restricted to a specified emitting species when no such restriction is stated.


    It is the mechanism-specific component of the broader [spectral radiance](name:spectral_radiance),
    which includes plasma emission resolved by wavelength and viewing direction without
    restricting the emission mechanism. Unlike [photon radiance at a spectral line](name:photon_radiance_at_spectral_line),
    it describes continuum emission rather than radiation integrated over a discrete
    spectral transition.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance
  - name:photon_radiance_at_spectral_line
  sources:
  - kind: imas-dd
    ref: bremsstrahlung_visible/channel/radiance_spectral
    version: 4.1.0
  - kind: imas-dd
    ref: charge_exchange/channel/spectrum/radiance_continuum
    version: 4.1.0
- name: spectral_flux_of_spectrometer_channel
  kind: scalar
  status: active
  description: Uncalibrated rate of detected photoelectrons representing spectrometer
    spectral intensity after electronic gain compensation and relative channel calibration,
    before absolute radiometric calibration.
  documentation: 'This quantity is the detected photoelectron event rate representing
    emission intensity from a spectrometer channel. It is a detector-response quantity
    rather than an absolute photon radiance.


    The rate is defined by


    $$

    I = \frac{dN_{\rm pe}}{dt}

    $$


    where $I$ is the detected photoelectron rate, $N_{\rm pe}$ is the accumulated
    number of detected photoelectrons, and $t$ is elapsed time.


    For wavelength-resolved emission, the quantity applies to a selected wavelength
    pixel. For an identified spectral line, it is integrated over the line profile.
    Electronic gain compensation and relative channel calibration are included, but
    absolute radiometric calibration is not; no background subtraction is implied
    where the underlying signal remains unprocessed.


    This rate must not be interpreted as incident photon flux or calibrated radiance.
    The distinct [photon radiance at a spectral line](name:photon_radiance_at_spectral_line)
    represents the absolutely calibrated photon emission rate per projected collecting
    area and solid angle, whereas this quantity remains detector-response dependent.'
  unit: s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:photon_radiance_at_spectral_line
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/grating_spectrometer/intensity_spectrum
    version: 4.1.0
- name: spectral_radiance
  kind: scalar
  status: active
  description: Calibrated photon-number spectral radiance of plasma emission, resolved
    by wavelength and viewing direction per projected area, solid angle, and wavelength
    interval.
  documentation: 'Spectral radiance is the calibrated photon-emission rate from plasma
    radiation resolved by wavelength and viewing direction. It represents the radiance
    density associated with an infinitesimal projected collecting area, solid angle,
    wavelength interval, and time interval.


    The photon-number spectral radiance is defined by


    $$

    L_\lambda = \frac{\mathrm{d}^3 N_\gamma}{\mathrm{d}A_{\mathrm{proj}}\,\mathrm{d}t\,\mathrm{d}\Omega\,\mathrm{d}\lambda}

    $$


    where $L_\lambda$ is spectral radiance, $N_\gamma$ is the number of emitted photons,
    $A_{\mathrm{proj}}$ is projected collecting area normal to the viewing direction,
    $t$ is time, $\Omega$ is solid angle, and $\lambda$ is wavelength.


    This quantity applies to plasma emission over the resolved wavelength and viewing-direction
    domains and is calibrated to an absolute photon-number radiance scale. It is a
    spectral density, not radiance integrated over a wavelength band or an identified
    emission line.


    Integrating $L_\lambda$ over the wavelength interval of an identified transition
    gives the corresponding [photon radiance at a spectral line](name:photon_radiance_at_spectral_line).
    The quantity remains generic with respect to the emission mechanism, whereas [spectral
    bremsstrahlung radiance](name:spectral_bremsstrahlung_radiance) is restricted
    to free-free emission.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:photon_radiance_at_spectral_line
  - name:spectral_bremsstrahlung_radiance
  sources:
  - kind: imas-dd
    ref: charge_exchange/channel/spectrum/radiance_spectral
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_uv/channel/radiance_spectral
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_visible/channel/grating_spectrometer/radiance_spectral
    version: 4.1.0
- name: spectral_signal_to_noise_ratio_of_spectrometer_channel
  kind: scalar
  status: active
  description: Spectral signal-to-noise ratio of a spectrometer channel is the channel-level
    logarithmic comparison between integrated spectral power in a selected signal
    band and integrated spectral power in a selected line-free reference band. It
    characterizes spectral signal quality independent of the particular spectroscopic
    application motivating the band selection.
  documentation: 'Spectral signal-to-noise ratio of a spectrometer channel is the
    channel-level logarithmic comparison between the integrated spectral power in
    a selected signal band containing spectral features of interest and the integrated
    spectral power in a selected line-free reference band. It characterizes the spectral
    signal quality of the channel as a whole, independent of the particular spectroscopic
    application motivating the band selection.


    The quantity is a base-ten logarithmically scaled power ratio:


    $$

    \mathrm{SNR} = 10 \log_{10}\!\left( \frac{P_{\mathrm{sig}}}{P_{\mathrm{ref}}}
    \right)

    $$


    where $P_{\mathrm{sig}}$ is the spectral power integrated over the selected signal
    band and $P_{\mathrm{ref}}$ is the spectral power integrated over the selected
    line-free reference band of the same channel.


    The quantity applies to a single spectrometer channel and to one selected pair
    of spectral bands. The signal and reference bands are a selection convention of
    the spectroscopic analysis and are not fixed by this name: any band pair chosen
    to compare feature-bearing spectral content against feature-free spectral content
    of the same channel yields an instance of this quantity. The value is positive
    when the signal-band integrated power exceeds the reference-band integrated power
    and negative when it is smaller.


    It is a band-integrated power ratio expressed on a logarithmic scale. It is not
    an amplitude ratio, which would carry a factor of twenty rather than ten before
    the base-ten logarithm; it is not a pointwise spectral-intensity ratio at a single
    wavelength; and it is not a noise variance, noise standard deviation, or detector
    time-domain signal-to-noise ratio.


    The [logarithm of spectral signal-to-noise ratio of a spectrometer channel](name:logarithm_of_spectral_signal_to_noise_ratio_of_spectrometer_channel)
    is the member of this family whose name makes the base-ten logarithmic transform
    explicit; it shares the defining relation above and is attested for band pairs
    selected for isotope-ratio analysis, where the signal band contains the isotope
    lines of interest. This parent subsumes that member together with any analogous
    logarithmically scaled band-pair comparison arising in other spectroscopic applications
    of the channel.'
  unit: dB
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/isotope_ratios/signal_to_noise
    version: 4.1.0
- name: temperature_of_soft_xray_detector
  kind: scalar
  status: active
  description: Thermodynamic temperature of the soft X-ray detector assembly, describing
    its physical thermal state for calibration and monitoring rather than a plasma
    temperature inferred from radiation.
  documentation: 'The quantity is the thermodynamic temperature of the physical soft
    X-ray detector assembly and describes the thermal state of its hardware.


    It applies to the detector object as a whole, with no implied plasma population,
    spatial subcomponent, or charge-state aggregation. It is distinct from the plasma
    electron temperature inferred from detected soft X-ray radiation and does not
    represent a photon-energy or spectral-response quantity.


    The temperature is the thermal operating state relevant to calibration and hardware-condition
    monitoring. It is conceptually analogous to [temperature of neutron detector](name:temperature_of_neutron_detector),
    while [spectral efficiency of soft X-ray detector](name:spectral_efficiency_of_soft_xray_detector)
    describes photon-registration probability rather than detector hardware temperature.'
  unit: K
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: camera_x_rays/detector_temperature
    version: 4.1.0
- name: thickness_of_filter
  kind: scalar
  status: active
  description: Geometric thickness of one diagnostic filter window, determining the
    amount of material available for photon attenuation and spectral selection.
  documentation: 'Filter thickness is the geometric separation of the two opposing
    surfaces of one filter window, measured locally along the material normal. It
    represents the material thickness itself rather than a photon path length through
    the window.


    For corresponding points on the opposing surfaces, the local thickness is defined
    by


    $$

    d = \left| (\mathbf{r}_2 - \mathbf{r}_1) \cdot \hat{\mathbf{n}} \right|

    $$


    where $d$ is the filter thickness, $\mathbf{r}_1$ and $\mathbf{r}_2$ are the position
    vectors of the corresponding surface points, and $\hat{\mathbf{n}}$ is the local
    unit normal to the filter surface.


    This quantity applies to the material of a single filter window used for X-ray
    spectral selection, including soft-X-ray, hard-X-ray, and crystal-spectrometer
    filter windows. It is not a sum over multiple windows, diagnostic channels, or
    detector elements, and it is distinct from the longer oblique photon path through
    the material.


    For homogeneous material at normal incidence, thickness enters the attenuation
    relation $T(E) = \exp[-\mu(E)d]$, where $T(E)$ is photon transmission at energy
    $E$, $E$ is photon energy, and $\mu(E)$ is the material attenuation coefficient.
    Thus, thickness is a geometric input to [spectral absorptivity of the filter](name:spectral_absorptivity_of_filter),
    whereas [filter width] describes the wavelength span of the transmitted passband
    rather than the material dimension.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: camera_x_rays/filter_window/thickness
    version: 4.1.0
  - kind: imas-dd
    ref: hard_x_rays/channel/filter_window/thickness
    version: 4.1.0
  - kind: imas-dd
    ref: soft_x_rays/channel/filter_window/thickness
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_x_ray_crystal/channel/filter_window/thickness
    version: 4.1.0
- name: toroidal_coordinate_of_camera
  kind: scalar
  status: active
  description: "Toroidal coordinate of a camera's geometric center in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, where \u03C6 is the toroidal angle about the\
    \ machine symmetry axis."
  documentation: 'Toroidal coordinate of a camera is the angular coordinate $\phi_c$
    of the camera''s geometric center in the right-handed cylindrical $(R, \phi, Z)$
    frame. It specifies the position of that center around the machine symmetry axis.


    The camera center has cylindrical coordinates $(R_c, \phi_c, Z_c)$:


    $$

    \mathbf{r}_c \leftrightarrow (R_c, \phi_c, Z_c)

    $$


    where $\mathbf{r}_c$ is the position vector of the camera''s geometric center,
    $R_c$ is the [radial coordinate of the camera](name:radial_coordinate_of_camera),
    and $Z_c$ is the [vertical coordinate of the camera](name:vertical_coordinate_of_camera).


    This quantity locates the camera center only; it is not an orientation angle,
    viewing direction, or field-of-view angle of the camera.


    Sign convention: Positive when the camera center is displaced in the direction
    of increasing toroidal angle $\phi$, counter-clockwise when viewed from above
    $+\hat{Z}$.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_camera
  - name:vertical_coordinate_of_camera
  sources:
  - kind: imas-dd
    ref: camera_x_rays/camera/centre/phi
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_x_ray_crystal/channel/camera/centre/phi
    version: 4.1.0
- name: toroidal_coordinate_of_line_of_sight
  kind: scalar
  status: active
  description: Toroidal angular coordinate of the first reference point on a diagnostic
    line of sight, locating that point around the machine symmetry axis.
  documentation: 'The toroidal coordinate of a line of sight is the azimuthal angle
    of its first reference point about the machine symmetry axis. It specifies the
    point''s circumferential location in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    For a point expressed in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis, the toroidal angle is defined by


    $$

    \phi = \operatorname{atan2}(y,x)

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates of the first reference
    point, and $\phi=0$ is the facility-defined toroidal reference direction.


    This quantity applies specifically to the first reference point of a diagnostic
    line of sight. It is a point coordinate, not an angle describing the line-of-sight
    direction, and it is not an aggregate over the line or over multiple reference
    points. Unlike [toroidal_coordinate_of_optical_element](name:toroidal_coordinate_of_optical_element),
    which locates an optical-element center, it locates the designated first line-of-sight
    point.


    Sign convention: Positive when the angular displacement from the $\phi=0$ reference
    direction is counter-clockwise when viewed from above the $+\hat{Z}$ axis.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: bolometer/camera/channel/line_of_sight/first_point/phi
    version: 4.1.0
