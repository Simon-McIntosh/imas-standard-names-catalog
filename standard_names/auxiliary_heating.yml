      kind: template
- name: vertical_coordinate_of_coil_conductor
  kind: scalar
  status: active
  description: "Signed vertical position of a point on a coil conductor, expressed\
    \ as the Z coordinate in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the signed vertical coordinate of a specified point
    on a coil conductor, rather than the coordinate of its geometric centroid. It
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, whose basis satisfies
    $\hat{R} \times \hat{\phi} = \hat{Z}$.


    $$

    Z_P = \mathbf{r}_P \cdot \hat{Z}

    $$


    where $\mathbf{r}_P$ is the position vector of point $P$ and $\hat{Z}$ is the
    vertical unit vector; $Z_P$ is the corresponding vertical coordinate. The point-specific
    quantity is distinct from the [vertical centroid of a coil conductor element](name:vertical_centroid_of_coil_conductor_element),
    which applies only to a defined conductor-element centroid.


    Sign convention: Positive when point $P$ is displaced in the direction of increasing
    $Z$, along $+\hat{Z}$.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_centroid_of_coil_conductor_element
  sources:
