    dd_path: hard_x_rays/channel/energy_band/upper_bound
    status: attached
  - id: dd:hard_x_rays/emissivity_profile_1d/upper_bound
    dd_path: hard_x_rays/emissivity_profile_1d/upper_bound
    status: attached
  - id: dd:soft_x_rays/channel/energy_band/upper_bound
    dd_path: soft_x_rays/channel/energy_band/upper_bound
