- name: tritium_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Tritium atom injection rate into the vacuum vessel from the gas injection
    system.
  documentation: 'The tritium injection rate $S_{\mathrm{T}}$ quantifies the number
    of tritium atoms injected per unit time into the vacuum vessel by the gas injection
    system, expressed in atoms per second. This rate directly controls the tritium
    fuel supply to the plasma and must be balanced against the tritium burn rate and
    exhaust for tritium inventory management, which is critical in deuterium-tritium
    (D-T) fusion devices. The injected tritium flow is typically regulated by piezoelectric
    valves and quantified by flow meters calibrated for tritium gas, with injection
    rates ranging from $10^{20} \, \mathrm{s}^{-1}$ to $10^{22} \, \mathrm{s}^{-1}$
    in large tokamaks. This quantity is closely related to the overall [gas_source_rate](name:gas_source_rate)
    and species-specific rates such as [argon_source_rate_due_to_injection](name:argon_source_rate_due_to_injection)
    and [lithium_source_rate_due_to_injection](name:lithium_source_rate_due_to_injection),
    which describe the injection of other species for plasma fueling, diagnostic calibration,
    or impurity control.


    Sign convention: Positive when tritium atoms flow from the gas injection system
    into the vessel.


    The injection rate is a scalar magnitude; the sign convention is established for
    consistency with similar source-rate quantities and denotes the direction of material
    addition.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:gas_source_rate
  - name:argon_source_rate_due_to_injection
  - name:lithium_source_rate_due_to_injection
  sources:
  - id: dd:summary/gas_injection_rates/tritium/value
    dd_path: summary/gas_injection_rates/tritium/value
    status: composed
- name: vertical_coordinate_of_pellet_path
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of points along the trajectory of an injected
    pellet in the IMAS cylindrical (R, phi, Z) frame.
  documentation: "The vertical coordinate $Z_{\\text{pellet}}$ specifies the height\
    \ of each point along the pellet injection path, measured relative to the machine\
    \ mid-plane ($Z=0$). This geometric quantity defines the trajectory of cryogenic\
    \ pellets used for core fueling or disruption mitigation, and is typically recorded\
    \ as a sequence of positions from the injector barrel through the guide tube to\
    \ the ablation region. The radial counterpart is `[radial_pellet_path_coordinate](name:radial_pellet_path_coordinate)`,\
    \ and the toroidal orientation is given by `[toroidal_angle_of_pellet_path](name:toroidal_angle_of_pellet_path)`.\
    \ \n\nSign convention: Positive when the pellet path point lies above the machine\
    \ mid-plane in the $+\\hat{Z}$ direction. \n\nVertical coordinates are inferred\
    \ from the injector geometry and guide-tube routing, with typical ranges spanning\
    \ from -1.0\u202Fm to +1.0\u202Fm for medium-size tokamaks, depending on the injection\
    \ port location. This quantity is a direct geometric input to pellet ablation\
    \ and deposition models."
  unit: m
  physics_domain: plant_systems
  links:
  - name:radial_pellet_path_coordinate
  - name:toroidal_angle_of_pellet_path
  sources:
  - id: dd:pellets/time_slice/pellet/path_profiles/position/z
    dd_path: pellets/time_slice/pellet/path_profiles/position/z
    status: composed
