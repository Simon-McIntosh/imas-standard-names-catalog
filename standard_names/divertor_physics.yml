    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_black_body
    dd_documentation:
      leaf: Black body radiated power emitted from the divertor targets (emissivity
        is included) (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
