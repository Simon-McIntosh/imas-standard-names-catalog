- name: perturbed_plasma_temperature_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex perturbed plasma temperature eigenfunction
    for a linear MHD mode.
  documentation: 'Perturbed plasma temperature imaginary part is the quadrature component
    of the complex first-order temperature perturbation eigenfunction of a linear
    MHD mode. Together with the [real part](name:perturbed_plasma_temperature_real_part),
    it forms the complex temperature eigenfunction; it sets the local phase relative
    to a chosen real reference and is not a separate thermodynamic temperature.


    For a toroidal Fourier harmonic, the convention used here represents the physical
    temperature perturbation in the right-handed cylindrical $(R, \phi, Z)$ system
    as:


    $$

    \delta T(R, \phi, Z, t) = \operatorname{Re}\left\{\left[\delta T_\mathrm{R}(R,
    Z) + i\,\delta T_\mathrm{I}(R, Z)\right]\exp\left[i(n\phi - \omega t)\right]\right\}

    $$


    where $\delta T_\mathrm{I}$ is this quantity, $\delta T_\mathrm{R}$ is the real
    part, $n$ is the integer toroidal mode number, and $\omega$ is the angular eigenfrequency.
    Here $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height. The local complex
    amplitude is $|\tilde{T}| = \sqrt{\delta T_\mathrm{R}^2 + \delta T_\mathrm{I}^2}$,
    and the local phase is $\alpha = \operatorname{atan2}(\delta T_\mathrm{I}, \delta
    T_\mathrm{R})$ radians; the quadrant-aware $\operatorname{atan2}$ form is required
    to distinguish all phases.


    In practice, $\delta T_\mathrm{I}$ is computed as one component of a linear MHD
    eigenvector, coupled to displacement, pressure, density, and electromagnetic perturbations.
    Temperature fluctuation measurements can constrain comparable amplitude and phase
    information when projected onto the same toroidal harmonic, but a phase reference
    is needed to separate real and imaginary components.


    A homogeneous linear eigenmode can be multiplied by an arbitrary complex constant,
    so the absolute eV scale and the split between real and imaginary parts are meaningful
    only after an amplitude normalization and global phase reference are fixed. For
    normalized perturbation levels $|\tilde{T}|/T_0$ of 10^-4-10^-1 and equilibrium
    temperatures of 100-20000 eV, component magnitudes of about 0.01-2000 eV are typical
    illustrative values; nodes and phase choices can make this component zero or change
    its sign.


    Sign convention: Positive when, for the Fourier convention above, the local eigenfunction
    phase returned by $\operatorname{atan2}(\delta T_\mathrm{I}, \delta T_\mathrm{R})$
    lies between $0$ and $\pi$ radians relative to the chosen real-axis phase reference
    after the eigenmode phase and normalization have been fixed.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    status: composed
- name: perturbed_plasma_temperature_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma temperature perturbation
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD stability
    analysis.
  documentation: 'In linear MHD stability analysis, plasma perturbations for a given
    toroidal mode number are expressed as complex spatial eigenfunctions. This quantity
    gives $\text{Re}[\tilde{T}]$, the real part of the complex temperature perturbation
    eigenfunction $\tilde{T}(\mathbf{r})$, encoding the in-phase spatial structure
    of the temperature mode relative to the chosen eigenmode normalization.


    The time-evolving perturbation field is reconstructed from the eigenfunction components
    as:


    $$

    \delta T(\mathbf{r}, t) = \text{Re}\!\left[\tilde{T}(\mathbf{r})\, e^{i(n\phi
    - \omega t)}\right]

    $$


    where $n$ is the toroidal mode number, $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $\omega$ is the complex eigenfrequency whose
    imaginary part gives the linear growth or damping rate.


    This component is computed by linear MHD stability solvers as one element of a
    complete set of perturbed field eigenfunctions; together with the [imaginary part](name:perturbed_plasma_temperature_imaginary_part),
    it fully specifies the complex eigenfunction $\tilde{T}$. Analogous decompositions
    apply to [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part).
    The absolute magnitude of $\text{Re}[\tilde{T}]$ is set by the eigenmode normalization
    convention and must be scaled by the physical mode amplitude to represent an actual
    temperature perturbation.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_imaginary_part
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_mass_density_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    status: composed
- name: radial_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the radial component of the complex perturbed plasma velocity
    eigenvector for a specified toroidal Fourier mode in linear magnetohydrodynamics.
    It gives the in-phase radial fluid-velocity amplitude relative to the chosen eigenmode
    phase and normalization.
  documentation: "Radial perturbed plasma velocity real part is the real, in-phase\
    \ amplitude of the radial component of the complex velocity perturbation $\\widetilde{\\\
    mathbf v}$ for a selected toroidal Fourier mode in a linear MHD eigenmode. The\
    \ radial component is taken along the outward flux-surface radial coordinate used\
    \ by the eigenmode representation, for example $(\\rho,\\theta,\\phi)$ or $(s,\\\
    theta,\\phi)$, with $\\phi$ the toroidal angle of the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame where $R$ is major radius and $Z$ is vertical height. Because\
    \ a complex eigenvector may be multiplied by an arbitrary phase factor, this real\
    \ part is meaningful together with the corresponding imaginary part and the chosen\
    \ eigenmode normalization.\n\nNeglecting equilibrium flow and viscosity, the complex\
    \ velocity perturbation is governed by the linearized ideal-MHD momentum balance\
    \ for a perturbation proportional to $\\exp[i(n\\phi-\\omega t)]$:\n\n$$\n-i\\\
    omega \\rho_0 \\widetilde{\\mathbf v} = -\\nabla \\widetilde{p} + \\widetilde{\\\
    mathbf j}\\times \\mathbf B_0 + \\mathbf j_0\\times \\widetilde{\\mathbf B}\n\
    $$\n\nwhere $n$ is the toroidal mode number, $\\omega$ is the angular eigenfrequency\
    \ in rad s$^{-1}$, $t$ is time in s, $\\rho_0$ is the equilibrium mass density\
    \ in kg m$^{-3}$, $\\widetilde{\\mathbf v}$ is the perturbed velocity in m s$^{-1}$,\
    \ $\\widetilde p$ is the perturbed pressure in Pa, $\\widetilde{\\mathbf j}$ and\
    \ $\\mathbf j_0$ are the perturbed and equilibrium current densities in A m$^{-2}$,\
    \ and $\\mathbf B_0$ and $\\widetilde{\\mathbf B}$ are the equilibrium and perturbed\
    \ magnetic fields in T. The documented quantity is $\\operatorname{Re}(\\widetilde{\\\
    mathbf v}\\cdot\\hat{\\mathbf e}_\\rho)$ for flux coordinates $(\\rho,\\theta,\\\
    phi)$, or the analogous projection onto $\\hat{\\mathbf e}_s$ for flux coordinates\
    \ $(s,\\theta,\\phi)$.\n\nThis quantity is normally computed from linear MHD eigenvalue\
    \ calculations using an equilibrium magnetic field, pressure, density, current\
    \ profile, and boundary conditions. Physical amplitudes may be inferred by fitting\
    \ the complex eigenfunction to diagnostics sensitive to plasma motion or mode\
    \ structure, such as spectroscopic velocity measurements, reflectometry, beam-emission\
    \ measurements, or magnetic perturbation measurements; the real part is the component\
    \ in phase with the selected phase reference.\n\nBecause linear eigenvectors are\
    \ often normalized arbitrarily, numerical amplitudes can reflect the chosen normalization\
    \ rather than an absolute fluctuation level. When scaled to measured mode amplitudes,\
    \ small coherent MHD perturbations commonly have radial velocity amplitudes of\
    \ 1-10^4 m.s^-1, while strongly driven Alfv\xE9nic activity or disruption-preceding\
    \ dynamics can reach 10^4-10^5 m.s^-1.\n\nSign convention: Positive when the perturbed\
    \ radial plasma velocity points outward, toward increasing flux-surface radial\
    \ coordinate $\\rho$ or $s$."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:radial_perturbed_plasma_velocity_imaginary_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    status: composed
- name: radial_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex radial component of the linearized magnetic-field
    perturbation eigenfunction in the current-free vacuum region outside the plasma,
    for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The imaginary part of the complex radial vacuum magnetic-field perturbation,
    $\delta B_R^{\rm im}$, is the quadrature component of the first-order linearized
    magnetic-field perturbation projected along $+\hat{R}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, in the current-free vacuum region surrounding the plasma.
    In linear MHD stability analysis, perturbed fields are cast as complex Fourier
    harmonics in the toroidal angle $\phi$; the imaginary part encodes the phase of
    the eigenmode relative to the normalization reference, together with the [real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part).


    In the vacuum region, $\delta\mathbf{B}$ satisfies $\nabla \times \delta\mathbf{B}
    = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The complex radial component decomposes
    as:


    $$

    \delta\tilde{B}_R^{\rm vac} = \delta B_R^{\rm re} + i\,\delta B_R^{\rm im}

    $$


    where $\delta B_R^{\rm re}$ is the [real part](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and $\delta B_R^{\rm im}$ is this imaginary part. The perturbation amplitude is
    $|\delta\tilde{B}_R^{\rm vac}| = \sqrt{(\delta B_R^{\rm re})^2 + (\delta B_R^{\rm
    im})^2}$ and the phase is $\theta = \mathrm{atan2}(\delta B_R^{\rm im},\,\delta
    B_R^{\rm re})$.


    This quantity is computed by linear MHD stability codes for a specified toroidal
    mode number $n$. Matching conditions at the plasma-vacuum interface link it to
    its plasma-region counterpart, [the radial plasma imaginary part](name:radial_perturbed_plasma_magnetic_field_imaginary_part).
    Alongside [the toroidal vacuum imaginary component](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part),
    it characterizes the helical spatial structure of the perturbed vacuum field.
    As with all linear eigenfunctions, the partition between real and imaginary parts
    depends on the phase normalization convention applied to the eigenmode.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    status: composed
- name: toroidal_perturbed_plasma_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex toroidal component of the first-order
    plasma magnetic-field perturbation eigenfunction for a single toroidal Fourier
    mode in linear MHD stability analysis.
  documentation: 'The toroidal component of the complex plasma magnetic-field perturbation
    eigenfunction $\delta\mathbf{B}$ is the projection $\delta B_\phi = \delta\mathbf{B}
    \cdot \hat{\phi}$ along the toroidal unit vector $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. This imaginary part, $\mathrm{Im}(\delta B_\phi)$,
    together with the [real part](name:toroidal_perturbed_plasma_magnetic_field_real_part),
    fully specifies the complex toroidal component of the [perturbed plasma magnetic-field](name:perturbed_plasma_magnetic_field)
    eigenfunction associated with a single toroidal mode number $n$ within the confined
    plasma region.


    The full complex toroidal amplitude is decomposed as:


    $$

    \delta B_\phi = \mathrm{Re}(\delta B_\phi) + i\,\mathrm{Im}(\delta B_\phi)

    $$


    where the ratio of imaginary to real parts encodes the spatial phase of the perturbation
    relative to the chosen eigenmode gage convention. The absolute magnitude of the
    eigenfunction is normalization-dependent and is set by the stability solver''s
    normalization choice.


    This quantity is defined within the confined plasma region and is computed alongside
    [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part)
    and [radial_perturbed_plasma_magnetic_field_imaginary_part](name:radial_perturbed_plasma_magnetic_field_imaginary_part)
    to fully characterize the phase-resolved perturbed magnetic-field vector inside
    the plasma. The vacuum-region counterpart for the same toroidal component is [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part).


    Sign convention: Positive when $\mathrm{Im}(\delta B_\phi)$ is directed along
    increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  - name:perturbed_plasma_magnetic_field
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/imaginary
    status: composed
- name: toroidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the phi-directed component, in the right-handed cylindrical
    (R, phi, Z) frame, of the complex first-order plasma velocity perturbation eigenfunction
    for a specified toroidal Fourier harmonic in linear MHD.
  documentation: 'Toroidal perturbed plasma velocity real part is the real component
    of the complex first-order plasma velocity perturbation eigenfunction projected
    along $\hat{\boldsymbol{\phi}}$, the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. It describes the oscillatory flow perturbation associated
    with a specified toroidal Fourier harmonic, not the equilibrium rotation.


    The component is defined by the projection of the complex velocity eigenfunction
    onto the toroidal basis direction:


    $$

    v_{\phi,\mathrm{Re}}(R,Z) = \operatorname{Re}\!\left[\widetilde{\mathbf v}(R,Z)\cdot\hat{\boldsymbol{\phi}}\right]

    $$


    where $v_{\phi,\mathrm{Re}}$ is in m.s^-1, $R$ and $Z$ are in m, $\widetilde{\mathbf
    v}$ is the complex perturbed velocity eigenfunction in m.s^-1, $\hat{\boldsymbol{\phi}}$
    is dimensionless, and $\operatorname{Re}$ denotes the real part. With toroidal
    dependence proportional to $\exp(i n\phi)$, $n$ is the dimensionless toroidal
    mode number, $\phi$ is in radians, and $i$ is the dimensionless imaginary unit.


    For a static ideal-MHD equilibrium and temporal factor $\exp(-i\omega t)$, the
    full complex vector is constrained by the linearized momentum balance $-i\omega\rho_0\widetilde{\mathbf
    v}= -\nabla\widetilde p + [(\nabla\times\widetilde{\mathbf B})\times\mathbf B_0
    + (\nabla\times\mathbf B_0)\times\widetilde{\mathbf B}]/\mu_0$, coupled to the
    induction and pressure equations. Here $\omega$ is the complex eigenfrequency
    in s^-1, $t$ is time in s, $\rho_0$ is equilibrium mass density in kg.m^-3, $\widetilde
    p$ is pressure perturbation in Pa, $\nabla$ is the spatial derivative operator
    in m^-1, $\widetilde{\mathbf B}$ and $\mathbf B_0$ are magnetic fields in T, and
    $\mu_0$ is magnetic permeability in H.m^-1.


    This quantity is normally computed from a linear MHD eigenmode calculation and
    compared with measurements only after choosing a mode amplitude and complex phase.
    Velocity fluctuations may be constrained directly by spectroscopic or imaging
    diagnostics, or indirectly through magnetic and density fluctuation measurements
    combined with a mode model. Because a complex eigenvector can be multiplied by
    an arbitrary complex constant, the real and imaginary parts depend on the chosen
    normalization and phase; if a local phase angle is needed, it should be formed
    with $\operatorname{atan2}(v_{\phi,\mathrm{Im}},v_{\phi,\mathrm{Re}})$ so that
    quadrant information is retained.


    Typical values are normalization-dependent. For eigenfunctions scaled to measured
    coherent fluctuations, $|v_{\phi,\mathrm{Re}}|$ is often 1-10^3 m.s^-1 for low-frequency
    tearing or kink-like activity and 10^2-10^5 m.s^-1 for faster Alfvenic perturbations;
    values outside these ranges can occur under different eigenvector normalizations.


    Sign convention: Positive when $v_{\phi,\mathrm{Re}}$ is directed toward increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_velocity
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    status: composed
- name: radial_mode_number
  kind: scalar
  status: draft
  description: Dimensionless non-negative integer labeling the radial branch of a
    linear MHD eigenmode by the number of radial nodes between the magnetic axis and
    the plasma boundary.
  documentation: 'Radial mode number is a non-negative integer that distinguishes
    radial branches of a linear magnetohydrodynamic eigenmode. It complements the
    toroidal mode number $n$ and poloidal mode number $m$: $n$ and $m$ describe angular
    harmonic content, while the radial mode number counts how many times the mode
    structure changes node in the radial direction.


    For a radial eigenfunction envelope $A(\rho)$ expressed on a monotonic flux coordinate
    $\rho$ such as normalized toroidal flux radius, with $\rho=0$ at the magnetic
    axis and $\rho=1$ at the plasma boundary, the radial mode number $l$ is the number
    of distinct interior radial nodes:


    $$

    l = \#\{\rho_i \in (0,1) \mid A(\rho_i)=0\}

    $$


    where $\#$ denotes the number of elements in the set and endpoint zeros imposed
    by regularity or boundary conditions are not counted.


    The value is obtained from the radial structure of a computed or inferred linear
    MHD eigenfunction after the relevant toroidal and poloidal harmonic content has
    been identified. It is not a directly measured local quantity; it is assigned
    by analyzing the spatial pattern of the perturbation from equilibrium-based mode
    calculations or from diagnostics capable of resolving the radial mode structure.


    Typical values are small integers. A node-free radial branch has $l=0$, successive
    radial overtones have $l=1,2,\ldots$, and practical mode classifications commonly
    use values from 0-10 depending on the equilibrium, boundary conditions, mode family,
    and radial resolution.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:mode_frequency
  - name:mode_phase
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/radial_mode_number
    dd_path: mhd_linear/time_slice/toroidal_mode/radial_mode_number
    status: composed
