- name: vertical_coordinate_of_closest_wall_point
  kind: scalar
  status: draft
  description: Height of the wall location nearest the plasma boundary, expressed
    as the Z coordinate in the right-handed cylindrical (R, phi, Z) geometry.
  documentation: 'The vertical coordinate of the closest wall point identifies the
    height of the first wall location with minimum separation from the plasma boundary
    or separatrix in the poloidal cross-section. Together with [major radius of the
    closest wall point](name:major_radius_of_closest_wall_point), it specifies the
    wall-side endpoint of the shortest boundary-to-wall gap used in equilibrium geometry
    and plasma-wall clearance analysis.


    A compact definition is obtained by minimizing the distance between the wall contour
    and the plasma boundary contour:


    $$

    Z_{\mathrm{cw}} = Z\!\left(\operatorname*{arg\,min}_{\mathbf{x}_w \in W,\,\mathbf{x}_b
    \in B} \left|\mathbf{x}_w - \mathbf{x}_b\right|\right)

    $$


    where $W$ is the wall contour, $B$ is the plasma boundary or separatrix contour,
    $\mathbf{x}_w$ and $\mathbf{x}_b$ are points in the right-handed cylindrical $(R,
    \phi, Z)$ frame, and $Z_{\mathrm{cw}}$ is the vertical coordinate of the minimizing
    wall point.


    This quantity is computed from an equilibrium boundary reconstruction and a device
    wall contour by geometric nearest-point search. It complements the [vertical coordinate
    of the plasma boundary](name:vertical_coordinate_of_plasma_boundary) and the [distance
    of the plasma boundary gap], which describe the plasma-side location and the separation
    length. Representative values span about -5-5 m in large tokamaks, with smaller
    devices often within -2-2 m.


    Sign convention: Positive when the closest wall point lies in the +Z direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_closest_wall_point
  - name:vertical_coordinate_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/closest_wall_point/z
    dd_path: equilibrium/time_slice/boundary/closest_wall_point/z
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/closest_wall_point/z
    dd_path: equilibrium/time_slice/boundary_separatrix/closest_wall_point/z
    status: attached
- name: vertical_coordinate_of_current_center
  kind: scalar
  status: draft
  description: Height of the toroidal-current centroid relative to the device midplane,
    obtained by weighting vertical position by toroidal plasma current density.
  documentation: 'The vertical coordinate of the current center locates the centroid
    of the toroidal plasma current distribution in the poloidal cross-section. It
    is the current-weighted companion to the horizontal centroid [major radius of
    current center](name:major_radius_of_current_center) and summarizes how the current
    channel is vertically displaced relative to the magnetic geometry.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $Z$ the vertical coordinate,
    the centroid is defined by


    $$

    Z_I = \frac{1}{I_p}\int_S j_\phi(R,Z)\,Z\,dS

    $$


    where $Z_I$ and $Z$ are in meters, $S$ is the plasma poloidal cross-section, $dS$
    is its area element, $j_\phi$ is the [toroidal plasma current density](name:toroidal_plasma_current_density),
    and $I_p = \int_S j_\phi dS$ is the [plasma current].


    This quantity is computed from equilibrium reconstruction using magnetic measurements
    and, when available, internal constraints such as polarimetry or motional-Stark-effect
    data that help determine the current-density distribution. In well centered tokamak
    plasmas it is often within a few centimeters of the geometric midplane; during
    vertical displacement or strong shaping it can differ by 0.1-0.5 m depending on
    device size and control state.


    Sign convention: Positive when the current-weighted centroid is displaced in the
    $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_current_center
  - name:toroidal_plasma_current_density
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/z
    dd_path: equilibrium/time_slice/global_quantities/current_centre/z
    status: composed
- name: vertical_coordinate_of_geometric_axis
  kind: scalar
  status: draft
  description: "Height of the equilibrium cross-section\u2019s shape-derived center\
    \ used to track the vertical position of the plasma."
  documentation: 'The vertical coordinate of the geometric axis locates the shape-derived
    center of the plasma cross-section in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is a geometric reference for plasma position and shape control, complementary
    to the flux-defined [vertical coordinate of the magnetic axis](name:vertical_coordinate_of_magnetic_axis).
    Together with the [major radius of the geometric axis](name:major_radius_of_geometric_axis),
    it specifies the geometric-axis point in the poloidal plane, while [vertical coordinate
    of the plasma boundary](name:vertical_coordinate_of_plasma_boundary) describes
    points on the boundary contour.


    The coordinate is the projection of the geometric-axis position vector onto the
    vertical basis direction:


    $$

    Z_{\mathrm{geom}} = \mathbf{x}_{\mathrm{geom}} \cdot \hat{Z}

    $$


    where $Z_{\mathrm{geom}}$ is the vertical coordinate, $\mathbf{x}_{\mathrm{geom}}$
    is the position vector of the geometric axis, and $\hat{Z}$ is the vertical unit
    vector of the cylindrical $(R, \phi, Z)$ frame.


    It is obtained from equilibrium reconstruction constrained by magnetic measurements,
    and may also be computed from fitted plasma-boundary or flux-surface geometry.
    In position-control applications it is compared with requested vertical plasma
    position and with boundary-derived references such as the [vertical coordinate
    of a plasma boundary gap reference point](name:vertical_coordinate_of_plasma_boundary_gap_reference_point).


    Typical values are near 0 m when the device midplane is the vertical origin and
    the discharge is vertically centered. Controlled offsets of a few centimeters
    are common, while large vertical excursions during loss-of-control events can
    reach 0.1-0.5 m in medium and large tokamaks.


    Sign convention: Positive when the geometric axis lies in the +Z direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame relative to the coordinate origin.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_magnetic_axis
  - name:major_radius_of_geometric_axis
  - name:vertical_coordinate_of_plasma_boundary
  - name:vertical_coordinate_of_plasma_boundary_gap_reference_point
  sources:
