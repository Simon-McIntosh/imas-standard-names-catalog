    version: 4.1.0
  - kind: imas-dd
    ref: summary/volume_average/n_e/value
    version: 4.1.0
- name: ratio_of_volume_averaged_argon_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Elemental abundance ratio of argon nuclei to free electrons inside
    the last closed flux surface, formed from the corresponding volume-averaged densities.
    The argon population is summed over all argon ion charge states and excludes neutral
    argon.
  documentation: 'Elemental abundance ratio of argon nuclei to free electrons inside
    the last closed flux surface is the confined-plasma composition fraction obtained
    by normalizing the volume-averaged argon density to the volume-averaged electron
    density. The argon population is the species-level ion population summed over
    all argon ion charge states.


    The ratio is defined as the quotient of the corresponding volume-averaged densities:


    $$

    C_{\mathrm{Ar}} = \frac{\langle n_{\mathrm{Ar}}\rangle_V}{\langle n_e\rangle_V}

    $$


    where $C_{\mathrm{Ar}}$ is this argon-to-electron abundance ratio, $\langle n_{\mathrm{Ar}}\rangle_V$
    is the [volume-averaged argon-ion number density](name:volume_averaged_argon_density),
    $\langle n_e\rangle_V$ is the [volume-averaged electron number density](name:volume_averaged_electron_density),
    and $V$ denotes the confined plasma volume bounded by the last closed flux surface.


    The scope is the confined plasma population inside the last closed flux surface,
    with the same volume-averaging operation applied to the argon and electron densities
    before forming the quotient. It excludes neutral argon, is not charge-state-resolved,
    and is a ratio of volume averages rather than the volume average of a local argon-to-electron
    density ratio.


    This quantity is related to [argon_density](name:argon_density) as its volume-averaged,
    electron-normalized elemental abundance; [argon_density](name:argon_density) denotes
    the argon density before normalization to the electron population.'
  unit: '1'
  physics_domain: transport
  links:
  - name:volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/argon/value
    version: 4.1.0
- name: ratio_of_volume_averaged_deuterium_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless volume-averaged deuterium abundance ratio is the quotient
    of the volume-averaged deuterium ion number density and the volume-averaged electron
    number density over the same plasma volume. The deuterium numerator is charge-state-summed
    over positive atomic ion charge states and excludes neutral or molecular deuterium.
  documentation: 'Dimensionless volume-averaged deuterium abundance ratio is the electron-density-normalized
    abundance of deuterium ions in a specified plasma volume. It is the quotient of
    the [volume-averaged deuterium density](name:volume_averaged_deuterium_density)
    and the [volume-averaged electron density](name:volume_averaged_electron_density)
    evaluated over that same volume.


    The ratio is defined by the quotient of volume averages:


    $$

    f_{D,V} = \frac{\langle n_D \rangle_V}{\langle n_e \rangle_V}

    $$


    where $f_{D,V}$ is this abundance ratio, $n_D$ is the [deuterium density](name:deuterium_density),
    $n_e$ is the electron density, $\langle n_D \rangle_V$ is the [volume-averaged
    deuterium density](name:volume_averaged_deuterium_density), $\langle n_e \rangle_V$
    is the [volume-averaged electron density](name:volume_averaged_electron_density),
    and the subscript $V$ denotes averaging over the common plasma volume.


    The numerator is the volume average of deuterium ion number density summed over
    all positive atomic ion charge states. It excludes neutral deuterium atoms, molecular
    deuterium, and deuterium bound in non-ion populations. The aggregation convention
    is a quotient of two volume-averaged densities, not the volume average of the
    pointwise ratio $n_D/n_e$.


    For non-negative number densities and positive $\langle n_e \rangle_V$, $f_{D,V}$
    is non-negative. It is not the fraction of deuterium among all fuel nuclei and
    does not represent the absolute deuterium particle inventory. It differs from
    the [volume-averaged deuterium-tritium abundance ratio](name:ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density),
    which uses the combined deuterium-tritium numerator, while this quantity uses
    deuterium alone.'
  unit: '1'
  physics_domain: transport
  links:
  - name:volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/deuterium/value
    version: 4.1.0
- name: ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Volume-averaged deuterium-tritium density divided by volume-averaged
    electron density for the combined deuterium-tritium fuel pseudo-species, treating
    deuterium and tritium as one effective species.
  documentation: 'Volume-averaged deuterium-tritium density divided by volume-averaged
    electron density for the combined deuterium-tritium fuel pseudo-species, treating
    deuterium and tritium as one effective species, is the electron-density-normalized
    abundance of that fuel species. It compares the fuel-ion population with the electron
    population after each density is averaged over the same plasma volume.


    The ratio is defined by:


    $$

    \mathcal{R}_{\mathrm{DT}/e} = \frac{\langle n_{\mathrm{DT}} \rangle_V}{\langle
    n_e \rangle_V}

    $$


    where $\mathcal{R}_{\mathrm{DT}/e}$ is this ratio, $\langle n_{\mathrm{DT}} \rangle_V$
    is the [volume-averaged deuterium-tritium density](name:volume_averaged_deuterium_tritium_density),
    $\langle n_e \rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_{\mathrm{DT}}$ is the local number density of the combined deuterium-tritium
    effective species, $n_e$ is the local electron number density, and $\langle\cdot\rangle_V$
    denotes averaging over the common plasma volume $V$.


    The scope is the plasma volume common to numerator and denominator; the value
    is a ratio of two volume averages, not the volume average of a pointwise density
    ratio. The numerator is a species-level extensive density for the effective deuterium-tritium
    fuel species and is summed over all charge states before averaging. It includes
    only that fuel species and excludes helium ash, impurity ions, and separate isotope-composition
    ratios such as the [tritium-to-deuterium density ratio](name:ratio_of_tritium_density_to_deuterium_density).


    Equivalently, this quantity is the [volume-averaged deuterium-tritium density](name:volume_averaged_deuterium_tritium_density)
    normalized by the [volume-averaged electron density](name:volume_averaged_electron_density);
    it is a normalized ratio, not a derivative of either density. When the combined
    deuterium-tritium density is resolved into deuterium and tritium contributions
    over the same volume and denominator, it equals the sum of the [volume-averaged
    deuterium-to-electron density ratio](name:ratio_of_volume_averaged_deuterium_density_to_volume_averaged_electron_density)
    and the [volume-averaged tritium-to-electron density ratio](name:ratio_of_volume_averaged_tritium_density_to_volume_averaged_electron_density).'
  unit: '1'
  physics_domain: transport
  links:
  - name:ratio_of_volume_averaged_deuterium_density_to_volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/deuterium_tritium/value
    version: 4.1.0
- name: ratio_of_volume_averaged_helium_3_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless composition ratio comparing the charge-state-summed helium-3
    ion density averaged over the confined plasma volume with the electron density
    averaged over the same volume. It is the helium-3 average divided by the electron
    average.
  documentation: 'Dimensionless composition ratio comparing the charge-state-summed
    helium-3 ion density averaged over the confined plasma volume with the electron
    density averaged over the same volume. It is the helium-3 average divided by the
    electron average and represents the global helium-3 ion composition relative to
    electrons.


    The ratio is defined by applying the volume average separately to each density
    over the same confined plasma volume before division:


    $$

    r_{{}^3\mathrm{He}/e} =

    \frac{\frac{1}{V_c}\int_{V_c} n_{{}^3\mathrm{He}}(\mathbf{x})\,dV}{\frac{1}{V_c}\int_{V_c}
    n_e(\mathbf{x})\,dV}

    $$


    where $r_{{}^3\mathrm{He}/e}$ is this composition ratio, $n_{{}^3\mathrm{He}}(\mathbf{x})$
    is the local helium-3 ion number density summed over all charged ionization states,
    $n_e(\mathbf{x})$ is the local electron number density, $\mathbf{x}$ denotes position,
    $dV$ is the volume element, and $V_c$ is the confined plasma volume, with the
    same symbol denoting its volume measure in the normalization factors.


    The scope is a species-level, volume-averaged, confined-plasma composition ratio.
    The helium-3 population includes charged helium-3 ions summed over charge states
    and excludes neutral helium-3 atoms; the electron population is the corresponding
    electron population in the same confined volume. No particular time within an
    evolution is part of the quantity definition.


    This quantity is not the confined-volume average of the local ratio $n_{{}^3\mathrm{He}}/n_e$;
    it equals that average only for special spatial distributions. Its numerator is
    the [volume-averaged helium-3 density](name:volume_averaged_helium_3_density),
    and its denominator is the [volume-averaged electron density](name:volume_averaged_electron_density).
    The [ratio of volume-averaged helium-4 density to volume-averaged electron density](name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density)
    is the analogous isotope composition ratio for helium-4.'
  unit: '1'
  physics_domain: transport
  links:
  - name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/helium_3/value
    version: 4.1.0
- name: ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Helium-4 abundance ratio formed from mean densities inside the last
    closed flux surface, comparing the charge-state-summed helium-4 ion density with
    the electron density after each density is volume averaged.
  documentation: 'Helium-4 abundance ratio formed from mean densities inside the last
    closed flux surface is the quotient of the volume-averaged helium-4 ion number
    density and the volume-averaged electron number density. It is a global isotope-abundance
    measure for ionized helium-4 relative to electrons in the plasma volume enclosed
    by the last closed flux surface.


    The ratio is defined from independent volume averages over the same enclosed plasma
    volume:


    $$

    f_{{}^4\mathrm{He},e}^{V} = \frac{\langle n_{{}^4\mathrm{He}}\rangle_V}{\langle
    n_e\rangle_V}, \qquad \langle n_s\rangle_V = \frac{1}{V_\mathrm{LCFS}}\int_{V_\mathrm{LCFS}}
    n_s(\mathbf{x})\,dV

    $$


    where $f_{{}^4\mathrm{He},e}^{V}$ is this helium-4 abundance ratio, the superscript
    $V$ denotes formation from volume averages, $\langle n_{{}^4\mathrm{He}}\rangle_V$
    is the [volume-averaged helium-4 density](name:volume_averaged_helium_4_density),
    $\langle n_e\rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_s(\mathbf{x})$ is the local number density of species $s$ at position $\mathbf{x}$,
    $V_\mathrm{LCFS}$ is the plasma volume enclosed by the last closed flux surface,
    and $dV$ is an element of that volume. For $s={}^4\mathrm{He}$, $n_s$ is the local
    helium-4 ion number density summed over all ion charge states; for $s=e$, $n_s$
    is the local electron number density.


    The semantic scope is species-level helium-4 ion density inside the last closed
    flux surface. The helium-4 numerator is summed over all ion charge states before
    averaging, while neutral helium-4 atoms and helium isotopes other than helium-4
    are excluded. Because the numerator and denominator are averaged separately, this
    quantity is not the volume average of the local ratio $n_{{}^4\mathrm{He}}/n_e$.


    For fully stripped helium-4 ions in a quasi-neutral plasma, $2 f_{{}^4\mathrm{He},e}^{V}$
    represents the helium-4 ion contribution to the electron charge balance, apart
    from contributions of other ions and departures from full stripping. The isotope
    analog is [ratio of volume-averaged helium-3 density to volume-averaged electron
    density](name:ratio_of_volume_averaged_helium_3_density_to_volume_averaged_electron_density),
    and the analogous elemental abundance quantity is [ratio of volume-averaged neon
    density to volume-averaged electron density](name:ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density).
    It is related to [ratio of volume-averaged helium-4 ion density to electron density](name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density)
    by the shared helium-4 numerator species, while this name explicitly normalizes
    by the independently volume-averaged electron density.'
  unit: '1'
  physics_domain: transport
  links:
  - name:volume_averaged_electron_density
  - name:ratio_of_volume_averaged_helium_3_density_to_volume_averaged_electron_density
  - name:ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/helium_4/value
    version: 4.1.0
- name: ratio_of_volume_averaged_tritium_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Ratio of volume-averaged tritium density to volume-averaged electron
    density is the volume-averaged tritium number density, summed over all charge
    states, divided by the volume-averaged electron number density.
  documentation: 'Ratio of volume-averaged tritium density to volume-averaged electron
    density is the volume-averaged tritium number density divided by the volume-averaged
    electron number density. It expresses the tritium contribution to plasma composition
    relative to the electron population after both densities have been averaged over
    the same plasma volume.


    The ratio is defined as:


    $$

    f_{T/e}^{V} = \frac{\langle n_T \rangle_V}{\langle n_e \rangle_V}

    $$


    where $f_{T/e}^{V}$ is this ratio, $\langle n_T \rangle_V$ is the [volume-averaged
    tritium density](name:volume_averaged_tritium_density), $\langle n_e \rangle_V$
    is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_T$ is the local [tritium density](name:tritium_density), $n_e$ is the local
    [electron density](name:electron_density), and $\langle q\rangle_V$ denotes $V^{-1}\int_V
    q\,dV$ for scalar field $q$ over the common plasma volume $V$.


    The scope is the specified plasma volume and the particle populations contained
    in that volume. The tritium density is a species-level per-volume amount and is
    therefore summed over all tritium charge states before volume averaging. The definition
    contains no selection by the time of peak electron density or by any other operating
    condition.


    This quantity is the ratio of volume averages, not the volume average of the local
    ratio $n_T/n_e$, and it is not normalized to the total hydrogenic-fuel density.
    It is the tritium-only counterpart of the [ratio of volume-averaged deuterium-tritium
    density to volume-averaged electron density](name:ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density),
    which uses the combined deuterium-plus-tritium numerator; it also differs from
    the local [ratio of tritium density to electron density].'
  unit: '1'
  physics_domain: transport
  links:
  - name:volume_averaged_electron_density
  - name:electron_density
  - name:ratio_of_volume_averaged_deuterium_tritium_density_to_volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/tritium/value
    version: 4.1.0
- name: volume_averaged_electron_temperature
  kind: scalar
  status: active
  description: Thermal energy of the bulk electron population expressed as an energy-equivalent
    temperature, averaged over the confined plasma volume inside the last closed flux
    surface.
  documentation: 'Volume-averaged electron temperature is the energy-equivalent measure
    of the mean random kinetic energy of the bulk electron population, averaged over
    the confined plasma volume inside the last closed flux surface.


    It is defined by the volume-weighted mean of the local electron temperature:


    $$

    \langle T_e\rangle_V = \frac{1}{V_p}\int_{V_p} T_e(\mathbf{x})\,dV

    $$


    where $\langle T_e\rangle_V$ is the volume-averaged electron temperature, $T_e(\mathbf{x})$
    is the local electron temperature at position $\mathbf{x}$, $V_p$ is the confined
    plasma volume enclosed by the last closed flux surface, and $dV$ is the differential
    volume element.


    This is an intensive volume-weighted mean for the bulk electron population, not
    a sum or a volume-integrated energy. It excludes ion populations and does not
    itself represent the total electron thermal energy.


    The quantity is the volume-averaged form of local [electron temperature](name:electron_temperature).
    It uses volume weighting throughout the confined plasma, unlike [line-averaged
    electron temperature](name:line_averaged_electron_temperature), which averages
    along a specified plasma chord. It is distinct from [thermal electron energy](name:thermal_electron_energy),
    which represents an extensive volume-integrated energy content rather than an
    intensive temperature.'
  unit: eV
  physics_domain: transport
  links:
  - name:electron_temperature
  - name:line_averaged_electron_temperature
  arguments:
  - name: electron_temperature
    operator: volume_averaged
    operator_kind: qualifier
