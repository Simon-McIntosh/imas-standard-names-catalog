    status: composed
- name: cold_neutral_velocity
  kind: scalar
  status: draft
  description: Line-of-sight projected velocity of the cold neutral atom population
    inferred from an emission-line Doppler shift.
  documentation: 'Cold neutral velocity is the scalar projection of the mean velocity
    of the cold neutral atom population along a specified spectrometer line of sight.
    The cold component is the relatively narrow, low-energy neutral emission component,
    complementary to [hot_neutral_velocity](name:hot_neutral_velocity), with the corresponding
    thermal width characterized by [cold_neutral_temperature](name:cold_neutral_temperature).


    For nonrelativistic Doppler shifts, the line-of-sight velocity is determined from
    the signed centroid shift of the cold spectral component:


    $$

    v_\mathrm{los} = c\,\frac{\Delta\lambda_\mathrm{los}}{\lambda_0}

    $$


    where $v_\mathrm{los}$ is the line-of-sight velocity in m.s^-1, $\Delta\lambda_\mathrm{los}$
    is the signed wavelength shift in meters after applying the line-of-sight orientation
    convention, $\lambda_0$ is the rest or central [wavelength_of_spectral_line](name:wavelength_of_spectral_line)
    in meters, and $c$ is the speed of light in m.s^-1. With this definition, $\Delta\lambda_\mathrm{los}>0$
    corresponds to motion from the first line-of-sight point toward the second; depending
    on viewing geometry, this may correspond to either the measured redshift or its
    negative.


    In practice this quantity is obtained from the calibrated centroid of the cold
    component of an atomic emission line. Spectral modeling separates this centroid
    shift from instrumental calibration offsets, line blending, thermal broadening,
    and any broader hot-neutral contribution; the result is only the velocity component
    projected along the observed line of sight, not the full neutral flow vector.


    Typical magnitudes in edge and divertor neutral spectroscopy are of order 1,000-30,000
    m.s^-1, with signed values near zero possible when the neutral flow is weak or
    nearly perpendicular to the line of sight.


    Sign convention: Positive when cold neutral atoms move from the first defining
    point of the line of sight toward the second defining point.'
  unit: m.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_velocity
  - name:hot_neutral_temperature
  - name:neutral_velocity
  - name:cold_neutral_temperature
  sources:
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/velocity_cold_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/velocity_cold_neutrals
    status: composed
- name: hot_neutral_temperature
  kind: scalar
  status: draft
  description: Kinetic temperature of the energetic (hot) component of the neutral
    atom population, inferred from the broad Doppler profile of visible spectral line
    emission.
  documentation: "The hot neutral temperature characterizes the energetic component\
    \ of the neutral atom population in the plasma edge and scrape-off layer, distinguished\
    \ from the thermal bulk described by [cold_neutral_temperature](name:cold_neutral_temperature).\
    \ Hot neutrals arise primarily from charge exchange reactions between thermal\
    \ ions and cold neutrals, or from energetic recycling at plasma-facing surfaces,\
    \ producing a fast atom population carrying significantly more kinetic energy\
    \ than the bulk.\n\nThe temperature is inferred by fitting the observed spectral\
    \ emission line profile to a two-Gaussian model. The broad Gaussian component\
    \ corresponds to the hot neutral sub-population, with its half-width governed\
    \ by the Doppler broadening relation:\n\n$$\n\\Delta\\lambda_D = \\frac{\\lambda_0}{c}\\\
    sqrt{\\frac{8\\ln 2 \\, k_B T_{\\rm hot}}{m_n}}\n$$\n\nwhere $\\lambda_0$ is the\
    \ rest-frame line center wavelength of the emission transition, $c$ is the speed\
    \ of light, $k_B$ is the Boltzmann constant, $T_{\\rm hot}$ is the hot neutral\
    \ temperature, and $m_n$ is the neutral atom mass.\n\nMeasurements are obtained\
    \ from visible spectrometer channels recording hydrogen isotope Balmer series\
    \ emission, where spectral line fitting resolves the hot and cold sub-populations\
    \ simultaneously. Polarization spectroscopy channels provide access to both the\
    \ temperature and the line-of-sight Doppler shift, the latter captured in [hot_neutral_velocity](name:hot_neutral_velocity).\n\
    \nTypical values for the hot component span a few eV to approximately 50 eV in\
    \ edge and scrape-off layer plasmas, substantially above the cold bulk neutral\
    \ temperature of approximately 0.1\u20131 eV, and bounded above by the local ion\
    \ temperature."
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_temperature
  - name:hot_neutral_velocity
  arguments:
  - name: neutral_state_temperature
    operator: hot
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    status: attached
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    status: composed
- name: hot_neutral_velocity
  kind: scalar
  status: draft
  description: Line-of-sight projected velocity of the energetic (hot) neutral atom
    population, inferred from the Doppler centroid shift of the broad emission component
    in visible polarization spectroscopy.
  documentation: "The hot neutral population consists of energetic neutral atoms \u2014\
    \ produced primarily by charge-exchange reactions between fast ions and cold neutrals\
    \ or by beam-neutral interactions \u2014 whose velocity distribution yields a\
    \ broad Doppler profile overlaid on the narrower thermal (cold) component. The\
    \ line-of-sight component $v_\\mathrm{hot}$ represents the bulk flow of this energetic\
    \ neutral ensemble along the diagnostic chord, distinguishing it from [cold_neutral_velocity](name:cold_neutral_velocity)\
    \ for the thermal population; the associated kinetic spread is captured by [hot_neutral_temperature](name:hot_neutral_temperature).\n\
    \nThe centroid velocity is extracted from the observed wavelength shift of the\
    \ emission line:\n\n$$\nv_\\mathrm{hot} = c \\, \\frac{\\lambda_\\mathrm{obs}\
    \ - \\lambda_0}{\\lambda_0}\n$$\n\nwhere $c$ is the speed of light, $\\lambda_\\\
    mathrm{obs}$ is the centroid wavelength of the hot neutral spectral component,\
    \ and $\\lambda_0$ is the rest wavelength of the observed line.\n\nMeasurement\
    \ requires fitting the observed line profile from a visible polarization spectrometer\
    \ with a multi-Gaussian model that separates the broad hot and narrow cold neutral\
    \ contributions; the centroid shift of the broad component yields $v_\\mathrm{hot}$.\
    \ Hot neutrals sourced from fast-ion charge exchange carry line-of-sight velocities\
    \ spanning tens to hundreds of km/s, substantially exceeding those of cold recycled\
    \ neutrals.\n\nSign convention: Positive when the hot neutral atoms are moving\
    \ from the first to the second point along the line of sight."
  unit: m.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_velocity
  - name:hot_neutral_temperature
  sources:
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/velocity_hot_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/velocity_hot_neutrals
    status: composed
- name: neutron_flux_due_to_beam_beam_fusion
  kind: scalar
  status: draft
  description: Total neutron emission rate from beam-beam fusion, summing the neutron-producing
    D(d,n) helium-3 branch, D-T reactions, and T-T reactions in which both reactants
    are energetic fast ions from neutral beam injection. The T-T contribution is a
    neutron count rate that includes its two-neutron final-state multiplicity.
  documentation: 'Neutron flux due to beam-beam fusion is the global neutron emission
    count rate produced by fusion reactions between two energetic fast ions born from
    neutral beam injection. It includes the neutron-producing deuterium-deuterium
    branch $\mathrm{D(d,n)^3He}$, deuterium-tritium reactions, and tritium-tritium
    reactions; it excludes beam-thermal and thermal-thermal reactions. Because the
    unit is Hz, this quantity is a neutron production rate in $\mathrm{s^{-1}}$ rather
    than an areal particle flux.


    The total beam-beam neutron emission rate is the sum of neutron count rates from
    the contributing fuel channels:


    $$

    \Gamma_{n,\mathrm{bb}} = \Gamma_{n,\mathrm{DD}(d,n),\mathrm{bb}} + \Gamma_{n,\mathrm{DT},\mathrm{bb}}
    + \Gamma_{n,\mathrm{TT},\mathrm{bb}}

    $$


    where $\Gamma_{n,\mathrm{bb}}$ is the total beam-beam neutron emission rate, $\Gamma_{n,\mathrm{DD}(d,n),\mathrm{bb}}$
    includes only the neutron-producing $\mathrm{D(d,n)^3He}$ branch of deuterium-deuterium
    fusion, $\Gamma_{n,\mathrm{DT},\mathrm{bb}}$ is the deuterium-tritium neutron
    count rate, and $\Gamma_{n,\mathrm{TT},\mathrm{bb}}$ is the tritium-tritium neutron
    count rate. The D-T channel produces one approximately 14 MeV neutron per reaction;
    the D-D neutron branch produces one approximately 2.45 MeV neutron per branch
    reaction; T-T fusion produces a continuum neutron spectrum and, for the dominant
    $\mathrm{T+T\to ^4He+2n}$ channel, contributes two emitted neutrons per reaction,
    so its neutron rate is a count rate rather than simply a reaction rate.


    In practice this quantity is computed from fast-ion distribution functions and
    energy-dependent fusion reactivity kernels integrated over the two fast-ion populations.
    It can also be inferred by combining neutron diagnostics with modeling or subtraction
    of beam-thermal and thermal-thermal components. It is sensitive to neutral beam
    power, injection energy, fast-ion slowing down, pitch-angle distribution, isotope
    mix, and spatial overlap of the energetic ion populations.


    Typical values are near 0 Hz when neutral beam injection is absent or when the
    relevant reacting isotope is absent. In neutral-beam-heated deuterium plasmas,
    beam-beam neutron rates are often in the range $10^{10}$-$10^{16}$ Hz; in high-power
    mixed deuterium-tritium or tritium-rich plasmas they can reach $10^{15}$-$10^{18}$
    Hz, depending strongly on beam energy and fast-ion confinement.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutron_flux_due_to_beam_thermal_fusion
  - name:deuterium_deuterium_flux_due_to_beam_beam_fusion
  - name:deuterium_tritium_flux_due_to_beam_beam_fusion
  - name:flux_due_to_beam_beam_fusion
  sources:
  - id: dd:summary/fusion/neutron_fluxes/dd/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/dd/beam_beam/value
    status: composed
  - id: dd:summary/fusion/neutron_fluxes/dt/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/dt/beam_beam/value
    status: composed
  - id: dd:summary/fusion/neutron_fluxes/tt/beam_beam/value
    dd_path: summary/fusion/neutron_fluxes/tt/beam_beam/value
    status: attached
  - id: dd:summary/fusion/neutron_rates/tt/beam_beam/value
    dd_path: summary/fusion/neutron_rates/tt/beam_beam/value
    status: attached
- name: neutron_flux_due_to_beam_thermal_fusion
  kind: scalar
  status: draft
  description: Beam-thermal neutron emission rate from fusion reactions between injected
    fast ions and thermal plasma ions, summed over DD, DT, and TT channels.
  documentation: 'Neutron flux due to beam-thermal fusion is the volume-integrated
    neutron emission rate produced when fast neutral-beam ions fuse with thermal ions
    in the plasma. It excludes purely thermal-thermal and beam-beam reactions, and
    counts emitted neutrons rather than fusion events, so DD branching and TT neutron
    multiplicity are included.


    A channel-resolved expression for the rate is:


    $$

    \Phi_n^{\mathrm{BT}} = \sum_{a,b\in\{D,T\}} \int_V dV \int d^3 v_a \int d^3 v_b\,
    f_a^{\mathrm{beam}}(\mathbf r,\mathbf v_a) f_b^{\mathrm{th}}(\mathbf r,\mathbf
    v_b)\, \sigma_{ab}(v_{\mathrm{rel}})\, v_{\mathrm{rel}}\, Y_{ab}(v_{\mathrm{rel}})

    $$


    where $\Phi_n^{\mathrm{BT}}$ is the neutron emission rate in s$^{-1}$, equivalent
    to Hz; $a$ is the fast beam isotope and $b$ is the thermal target isotope; $f_a^{\mathrm{beam}}$
    and $f_b^{\mathrm{th}}$ are velocity-space densities normalized to number density
    in m$^{-3}$; $\sigma_{ab}$ is the fusion cross-section in m$^2$; $v_{\mathrm{rel}}=|\mathbf
    v_a-\mathbf v_b|$ is the relative speed in m s$^{-1}$; and $Y_{ab}$ is the neutron
    yield per reaction. For DT, $Y_{DT}=1$; for TT, $Y_{TT}=2$ because two neutrons
    are emitted per reaction; for DD, $Y_{DD}$ is the energy-dependent branching fraction
    of the neutron-producing branch.


    In practice this rate is computed from fast-ion distributions, thermal ion densities
    and temperatures, isotope composition, and fusion reactivity data. It is constrained
    experimentally by neutron monitors, activation systems, neutron cameras, and neutron
    spectroscopy, often using beam modulation or transport modeling to separate beam-thermal
    emission from [thermal_neutron_flux](name:total_neutron_source_rate_due_to_thermal_fusion)
    and other neutron-producing components. The channel-resolved components include
    [deuterium_deuterium_flux_due_to_beam_thermal_fusion](name:deuterium_deuterium_flux_due_to_beam_thermal_fusion),
    [deuterium_tritium_flux_due_to_beam_thermal_fusion](name:deuterium_tritium_flux_due_to_beam_thermal_fusion),
    and the TT beam-thermal contribution; their sum contributes to total_neutron_flux.


    Typical beam-thermal neutron emission rates are about $10^{12}$-$10^{16}$ Hz in
    deuterium neutral-beam plasmas, $10^{16}$-$10^{19}$ Hz in high-power mixed deuterium-tritium
    operation, and can approach $10^{20}$ Hz in large burning-plasma scenarios with
    strong auxiliary beams. Values scale strongly with injected power, fast-ion confinement,
    target density, isotope mix, and ion temperature.'
