- name: flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of deuterium-tritium pseudo-species
    ions at the plasma boundary (separatrix).
  documentation: 'Flux-surface-averaged number density of deuterium-tritium pseudo-species
    ions at the plasma boundary (separatrix) is the particle density of the effective
    deuterium-tritium fuel species averaged over the last closed magnetic flux surface.
    The pseudo-species represents the deuterium-tritium fuel mixture as a single ion
    constituent with effective mass number 2.5; as a species-level density, it is
    summed over all charge states.


    Using the poloidal-contour representation of a flux-surface average in an axisymmetric
    equilibrium, the boundary value is defined by:


    $$

    \langle n_{\mathrm{DT}} \rangle_b =

    \frac{\oint_{\psi=\psi_b} n_{\mathrm{DT}}(l)\, dl / B_p(l)}

    {\oint_{\psi=\psi_b} dl / B_p(l)}

    $$


    where $\langle n_{\mathrm{DT}} \rangle_b$ is this boundary average, $\psi_b$ labels
    the plasma-boundary flux surface, $l$ is poloidal arc length along that surface,
    and $B_p$ is the [poloidal magnetic-field magnitude]. The local pseudo-species
    density is $n_{\mathrm{DT}} = n_{\mathrm{D}} + n_{\mathrm{T}}$, where $n_{\mathrm{D}}$
    and $n_{\mathrm{T}}$ are the corresponding charge-state-summed deuterium and tritium
    ion densities.


    This quantity is the plasma-boundary member of [flux-surface-averaged deuterium-tritium
    density](name:flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary)
    and the flux-surface-averaged counterpart of [deuterium-tritium density at the
    plasma boundary](name:flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary),
    which retains variation around the same boundary surface. The single-isotope boundary
    analog [flux-surface-averaged deuterium density at the plasma boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary)
    separates one isotope contribution, while [volume-averaged deuterium-tritium density](name:volume_averaged_deuterium_tritium_density)
    averages the same effective fuel population over the confined-plasma volume. It
    excludes scrape-off-layer and material-limiter densities, including [deuterium-tritium
    density at a limiter](name:deuterium_tritium_density_at_limiter).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
  - name:volume_averaged_deuterium_tritium_density
  - name:deuterium_tritium_density_at_limiter
  sources:
  - dd_path: summary/local/separatrix_average/n_i/deuterium_tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-deuterium_tritium-value
