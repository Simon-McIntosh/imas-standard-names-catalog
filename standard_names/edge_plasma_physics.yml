- name: poloidal_ion_energy_diffusivity
  kind: scalar
  status: active
  description: "Fickian diffusivity for poloidal thermal-energy transport of the ion\
    \ population, defining the down-gradient part of ion energy flux tangent to increasing\
    \ \u03B8 at fixed \u03C1 and \u03C6 in flux coordinates (\u03C1, \u03B8, \u03C6\
    )."
  documentation: 'Poloidal ion energy diffusivity is the effective transport coefficient
    for local diffusive smoothing of ion thermal-energy density in the poloidal direction.
    The poloidal direction is the tangent to increasing poloidal angle $\theta$ at
    fixed radial flux label $\rho$ and toroidal angle $\phi$ in flux coordinates $(\rho,\theta,\phi)$.
    It represents the Fickian part of ion energy transport, distinct from convective
    transport and explicit energy sources or sinks.


    The defining closure relates the physical diffusive ion thermal-energy flux component
    along the poloidal tangent to the metric poloidal gradient of ion thermal-energy
    density:


    $$

    q_{\theta,E,i}^{\mathrm{diff}} = -\chi_{\theta,E,i}\,\nabla_\theta w_i = -\chi_{\theta,E,i}\,\frac{1}{h_\theta}\left(\frac{\partial
    w_i}{\partial\theta}\right)_{\rho,\phi}

    $$


    where $q_{\theta,E,i}^{\mathrm{diff}}$ is the diffusive ion thermal-energy flux
    component in the direction of increasing $\theta$, $\chi_{\theta,E,i}$ is poloidal
    ion energy diffusivity, $w_i$ is ion thermal-energy density, $\nabla_\theta w_i$
    is the metric poloidal gradient, and $h_\theta=|\partial\mathbf{x}/\partial\theta|_{\rho,\phi}$
    is the poloidal metric scale factor for the position vector $\mathbf{x}(\rho,\theta,\phi)$.
    The minus sign specifies that positive $\chi_{\theta,E,i}$ gives down-gradient
    transport along poloidal arclength.


    For an unresolved ion population, $w_i$ and $q_{\theta,E,i}^{\mathrm{diff}}$ denote
    quantities summed over the included ion species and charge states before the effective
    coefficient is applied; the coefficient is not the arithmetic sum of charge-state
    diffusivities. Charge-state-resolved quantities such as [poloidal ion charge-state
    energy diffusivity](name:poloidal_ion_charge_state_energy_diffusivity) retain
    that resolution. This quantity is the poloidal directional form of [ion energy
    diffusivity](name:ion_energy_diffusivity) and is distinct from field-aligned [parallel
    ion energy diffusivity](name:parallel_ion_energy_diffusivity), from [poloidal
    ion diffusivity](name:poloidal_ion_diffusivity) for particle transport, and from
    [poloidal ion momentum diffusivity](name:poloidal_ion_momentum_diffusivity) for
    momentum transport.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
