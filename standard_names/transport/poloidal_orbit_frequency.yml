name: poloidal_orbit_frequency
status: draft
description: Angular frequency at which a charged particle completes one poloidal
  circuit of its guiding-center orbit in a toroidal magnetic configuration.
documentation: "The poloidal orbit frequency $\\omega_{\\theta}$ characterizes the\
  \ rate at which a particle's guiding center traverses the poloidal cross-section\
  \ of the torus. For a deeply trapped particle, $\\omega_{\\theta}$ equals the bounce\
  \ frequency $\\omega_b$, while for passing particles it corresponds to the poloidal\
  \ transit frequency. In a large-aspect-ratio tokamak with circular flux surfaces,\
  \ the passing-particle poloidal transit frequency is approximately $\\omega_{\\\
  theta} \\approx v_{\\parallel} / (q R_0)$, where $v_{\\parallel}$ is the parallel\
  \ velocity, $q$ is the safety factor, and $R_0$ is the major radius in meters. Typical\
  \ values range from $10^3$\u2013$10^5$ rad/s depending on particle energy and species.\
  \ The ratio of the toroidal to poloidal orbit frequencies determines the orbit topology\
  \ and resonance conditions important for neoclassical transport and wave\u2013particle\
  \ interaction. See also `toroidal_orbit_frequency` and `safety_factor`."
