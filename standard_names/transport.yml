  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/radial/d
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/radial/d
    status: composed
- name: radial_component_of_momentum_source
  kind: scalar
  status: draft
  description: Projection of the net plasma momentum source density vector onto the
    radial direction $\hat{R}$, giving the rate of radial momentum deposition per
    unit volume from all physical processes.
  documentation: 'The radial component $S_{p,R} = \mathbf{S}_p \cdot \hat{R}$ is the
    $R$-projection of the total momentum source density vector $\mathbf{S}_p$ appearing
    in the plasma fluid momentum equation


    $$\rho \frac{D\mathbf{u}}{Dt} = -\nabla p + \mathbf{J}\times\mathbf{B} + \nabla\cdot\boldsymbol{\pi}
    + \mathbf{S}_p$$


    where $\rho$ (kg m$^{-3}$) is mass density, $\mathbf{u}$ (m s$^{-1}$) is the bulk
    flow velocity, $p$ (Pa) is thermal pressure, $\mathbf{J}$ (A m$^{-2}$) is current
    density, $\mathbf{B}$ (T) is the magnetic field, and $\boldsymbol{\pi}$ is the
    viscous stress tensor. The radial component governs cross-field momentum transport
    and radial force balance, including contributions from neutral beam injection,
    charge-exchange friction, electromagnetic body forces, and neoclassical stresses.
    In strongly magnetized fusion plasmas the radial direction is the cross-field
    direction, so $S_{p,R}$ drives radial flow generation and is closely tied to the
    $E \times B$ velocity and poloidal rotation. It complements [toroidal_component_of_momentum_source](name:toroidal_component_of_momentum_source),
    which drives toroidal rotation, and together these components fully characterize
    the momentum deposition geometry. The diamagnetic contribution is separately identified
    in [momentum_source_due_to_diamagnetic_drift](name:momentum_source_due_to_diamagnetic_drift).
    Typical magnitudes in neutral-beam-heated tokamak plasmas range from $10^{3}$
    to $10^{5}$ kg m$^{-1}$ s$^{-2}$ in the core, depending on beam power and injection
    geometry.


    Sign convention: Positive when the net momentum deposition is directed in the
    direction of increasing major radius $R$.'
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_momentum_source
  - name:momentum_source_due_to_diamagnetic_drift
  constraints: []
  arguments:
  - name: momentum_source
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:plasma_sources/source/ggd/momentum/radial
    dd_path: plasma_sources/source/ggd/momentum/radial
    status: composed
- name: toroidal_component_of_co_passing_fast_ion_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the driven current density carried by co-passing
    fast (non-thermal) ions, evaluated locally at each spatial point rather than as
    a flux-surface average. Co-passing ions circulate around the torus in the same
    direction as the plasma current. Excludes electron and thermal ion back-currents
    (drag-currents).
  documentation: "The toroidal component of the fast-ion current density contributed\
    \ solely by the co-passing particle population. Co-passing fast ions are those\
    \ whose parallel velocity is aligned with the magnetic field such that they circulate\
    \ in the same toroidal direction as the net plasma current.\n\nAt each spatial\
    \ point $(R, Z)$ in the poloidal cross-section, the toroidal component is defined\
    \ by the projection\n$$j_{\\phi,\\mathrm{co}} = \\int_{v_\\parallel > 0} q\\,\
    \ v_\\phi\\, f_\\mathrm{fast}(\\mathbf{v})\\, d^3v,$$\nwhere the integration is\
    \ restricted to the co-passing portion of the fast-ion distribution function $f_\\\
    mathrm{fast}$, $q$ is the ion charge, and $v_\\phi$ is the toroidal velocity component\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame. The quantity is evaluated\
    \ locally \u2014 it is NOT a flux-surface average \u2014 so it retains full spatial\
    \ resolution within the poloidal plane.\n\nThe total toroidal fast-ion current\
    \ density is the sum of the co-passing and counter-passing contributions; separating\
    \ them is useful for diagnosing the asymmetry of the fast-ion distribution, e.g.\
    \ under neutral beam injection (NBI) with a preferred injection direction. Typical\
    \ magnitudes depend strongly on the heating scenario, ranging from tens of kA\
    \ m$^{-2}$ for moderate NBI power to several hundred kA m$^{-2}$ in high-performance\
    \ discharges.\n\nElectron and thermal ion return (drag) currents are explicitly\
    \ excluded; the quantity represents only the direct toroidal current carried by\
    \ the fast-ion species.\n\nSign convention: Positive when the co-passing fast-ion\
    \ current density is directed in the direction of increasing toroidal angle $\\\
    phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:co_passing_fast_ion_current_density
  - name:toroidal_component_of_counter_passing_fast_ion_current_density
  - name:toroidal_component_of_fast_ion_current_density
