      parent: The element is approximated by a rectangle defined by a central segment
        and a thickness in the direction perpendicular to the segment
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Thickness of the ICRH antenna strap cross-section in the thick-line
        geometric approximation, measured perpendicular to the central segment of
        the strap rectangle. A geometric parameter for antenna coupling modelling.
      kind: llm
- name: toroidal_angle_of_antenna_strap
  kind: scalar
  status: active
  description: "Toroidal angular coordinate locating points of an antenna strap around\
    \ the machine symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal angle of an antenna strap is the azimuthal coordinate
    of a point defining the strap geometry about the machine symmetry axis. It locates
    the strap around the torus and is distinct from the cross-sectional inclination
    [angle of the antenna strap](name:angle_of_antenna_strap).


    For Cartesian coordinates $x$ and $y$ in meters in the right-handed $(\hat{x},
    \hat{y}, \hat{z})$ basis, with $\hat{z}=\hat{Z}$ vertical, the toroidal angle
    is defined by


    $$

    \phi = \operatorname{atan2}(y,x)

    $$


    where $\phi$ is measured from the facility-defined zero-angle direction and increases
    in the toroidal direction. The quantity applies to the specified strap reference
    point or outline point; it is not the strap width or an inclination angle.


    Sign convention: Positive when the angular displacement follows increasing $\phi$
    about $+\hat{Z}$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
