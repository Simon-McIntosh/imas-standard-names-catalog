name: volume_averaged_krypton_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of krypton ions, a high-$Z$ noble
  gas used for radiative power dissipation.
documentation: "The volume-averaged krypton ion number density $\\langle n_{\\mathrm{Kr}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{Kr}}(\\mathbf{r})\\, dV$ where $n_{\\mathrm{Kr}}$\
  \ is the local krypton ion density in m$^{-3}$ summed over all charge states and\
  \ $V$ is the plasma volume in m$^3$. Krypton ($Z = 36$) is deliberately seeded as\
  \ a radiative coolant for divertor power exhaust; typical seeded concentrations\
  \ are $\\sim 10^{-4}$\u2013$10^{-3}$ of $n_e$, yielding $\\langle n_{\\mathrm{Kr}}\
  \ \\rangle_V \\sim 10^{15}$\u2013$10^{17}$ m$^{-3}$. VUV and soft X-ray spectroscopy\
  \ on Kr line emissions provide local density information, while the total krypton\
  \ content can be cross-checked against calibrated gas injection rates and particle\
  \ confinement modeling. Core krypton accumulation must be controlled to avoid excessive\
  \ core radiation and fuel dilution. See also `volume_averaged_neon_ion_number_density`\
  \ and `volume_averaged_argon_ion_number_density`."
