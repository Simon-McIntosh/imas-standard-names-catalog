- name: ammonia_count
  kind: scalar
  status: active
  description: Inventory of ammonia (NH3) in the plasma vessel expressed as an equivalent-electron
    count, where each NH3 molecule contributes 10 equivalent electrons equal to the
    total electron count of neutral ammonia.
  documentation: "The ammonia equivalent-electron count represents the NH3 inventory\
    \ in the plasma vessel using a species-neutral currency: each ammonia molecule\
    \ is assigned 10 equivalent electrons, the sum of the atomic numbers of its constituent\
    \ atoms \u2014 nitrogen ($Z_\\mathrm{N} = 7$) plus three hydrogen atoms each with\
    \ $Z_\\mathrm{H} = 1$.\n\nThe defining conversion is:\n\n$$\nN_\\mathrm{eq} =\
    \ 10 \\times N_\\mathrm{NH_3}\n$$\n\nwhere $N_\\mathrm{NH_3}$ is the number of\
    \ ammonia molecules and $N_\\mathrm{eq}$ is the dimensionless equivalent-electron\
    \ count.\n\nAmmonia is used in fusion devices as a controlled impurity for radiative\
    \ seeding, plasma termination, or disruption mitigation. The equivalent-electron\
    \ representation provides a unified basis for comparing the total electron contribution\
    \ across different injected species. This general count is partitioned by injection\
    \ phase: [accumulated_ammonia_count](name:accumulated_ammonia_count) tracks NH3\
    \ delivered since plasma breakdown, while [ammonia_prefill_count](name:ammonia_prefill_count)\
    \ captures the pre-breakdown prefill contribution. The closely related deuterated\
    \ variant is characterized by [ammonia_deuterated_count](name:ammonia_deuterated_count),\
    \ which applies the same 10-electron-per-molecule convention to ND3. Values are\
    \ inferred from calibrated valve-actuation and gas-flow records."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_count
  - name:ammonia_prefill_count
  - name:ammonia_deuterated_count
- name: accumulated_ammonia_count
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of ammonia molecules introduced
    into the plasma vessel, expressed as an equivalent-electron count with ten count
    units assigned to each neutral NH3 molecule.
  documentation: 'The accumulated ammonia count is the cumulative post-breakdown amount
    of NH3 introduced into the plasma vessel, represented using an equivalent-electron
    accounting convention. It is the post-breakdown component of the total [ammonia
    count](name:ammonia_count), not a direct count of free plasma electrons.


    $$

    C_{\mathrm{NH_3}}^{\mathrm{acc}} = (Z_\mathrm{N}+3Z_\mathrm{H})N_{\mathrm{NH_3}}^{\mathrm{acc}}
    = 10N_{\mathrm{NH_3}}^{\mathrm{acc}}

    $$


    Here, $C_{\mathrm{NH_3}}^{\mathrm{acc}}$ is the accumulated equivalent-electron
    count, $N_{\mathrm{NH_3}}^{\mathrm{acc}}$ is the cumulative number of ammonia
    molecules introduced after plasma breakdown, and $Z_\mathrm{N}=7$ and $Z_\mathrm{H}=1$
    are the atomic numbers of nitrogen and hydrogen. The quantity excludes ammonia
    introduced during prefill, which is represented by [ammonia prefill count](name:ammonia_prefill_count),
    and does not represent instantaneous injection rate, retained neutral inventory,
    ionization state, or actual free-electron content.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ammonia_count
  - name:ammonia_prefill_count
  arguments:
  - name: ammonia_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/ammonia/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-ammonia-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_accumulated/ammonia
      parent: Ammonia (NH3)
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Ammonia (NH3).
      kind: template
- name: ammonia_deuterated_count
  kind: scalar
  status: active
  description: Deuterated ammonia (ND3) count is the cumulative molecular inventory
    of ND3 expressed as an equivalent-electron count. Each molecule contributes 10
    equivalent electrons, from nitrogen plus three deuterium atoms.
  documentation: 'Deuterated ammonia (ND3) count is the cumulative molecular inventory
    of ND3 expressed as an equivalent-electron count. It is a bookkeeping count formed
    by weighting each ND3 molecule by the total atomic-number content of its constituent
    atoms.


    The defining relation is:


    $$

    N_{\mathrm{eq,ND_3}} = (Z_{\mathrm{N}} + 3 Z_{\mathrm{D}}) N_{\mathrm{ND_3}} =
    10 N_{\mathrm{ND_3}}

    $$


    where $N_{\mathrm{eq,ND_3}}$ is the deuterated-ammonia equivalent-electron count,
    $N_{\mathrm{ND_3}}$ is the number of ND3 molecules, $Z_{\mathrm{N}} = 7$ is the
    atomic number of nitrogen, and $Z_{\mathrm{D}} = 1$ is the atomic number of deuterium.


    The scope is restricted to the fixed molecular species ND3; it is not a sum over
    arbitrary injected gasses, ammonia isotopologues, fragments, ions, or reaction
    products. Time-window or phase qualifiers define specializations, such as [accumulated
    deuterated-ammonia count](name:accumulated_ammonia_deuterated_count), without
    changing the per-molecule weighting.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_deuterated_count
- name: accumulated_ammonia_deuterated_count
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of neutral deuterated ammonia (ND3),
    expressed as an equivalent-electron count with ten count units per molecule.
  documentation: 'This quantity is the cumulative number of neutral deuterated ammonia
    (ND3) molecules introduced after plasma breakdown, converted to an equivalent-electron
    count. It is the post-breakdown contribution to [ammonia_deuterated_count](name:ammonia_deuterated_count),
    distinct from the prefill contribution [ammonia_deuterated_prefill_count](name:ammonia_deuterated_prefill_count).


    The equivalent-electron count is defined by


    $$

    N_{\mathrm{eq,ND_3}}^{\mathrm{post}} = (Z_{\mathrm{N}} + 3Z_{\mathrm{D}})N_{\mathrm{ND_3}}^{\mathrm{post}}
    = 10N_{\mathrm{ND_3}}^{\mathrm{post}}

    $$


    where $N_{\mathrm{eq,ND_3}}^{\mathrm{post}}$ is the dimensionless equivalent-electron
    count, $N_{\mathrm{ND_3}}^{\mathrm{post}}$ is the cumulative neutral-molecule
    count after breakdown, and $Z_{\mathrm{N}}=7$ and $Z_{\mathrm{D}}=1$ are the atomic
    numbers of nitrogen and deuterium. This is a bookkeeping quantity, not the number
    of free electrons in the plasma and not an instantaneous injection rate.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ammonia_deuterated_count
  - name:ammonia_deuterated_prefill_count
  arguments:
  - name: ammonia_deuterated_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/ammonia_deuterated/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-ammonia_deuterated-value
    dd_documentation:
      leaf: Value
