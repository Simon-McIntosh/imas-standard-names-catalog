name: deuterium_deuterium_fusion_power_density
status: draft
description: "Volumetric power released by D\u2013D fusion reactions, quantifying\
  \ the local energy production rate per unit plasma volume."
documentation: "The deuterium\u2013deuterium fusion power density $P_{\\rm DD}(\\\
  mathbf{r})$ (in W m$^{-3}$) represents the thermal power deposited locally by D\u2013\
  D fusion reactions, combining both the D(d,p)T and D(d,n)$^3$He branches. It is\
  \ related to the local deuterium density $n_D$ and the Maxwellian-averaged reactivity\
  \ $\\langle \\sigma v \\rangle_{\\rm DD}$ via $P_{\\rm DD} = \\tfrac{1}{2} n_D^2\
  \ \\langle \\sigma v \\rangle_{\\rm DD} \\, E_{\\rm DD}$, where $E_{\\rm DD}$ is\
  \ the average energy released per reaction (~3.65 MeV combining both branches).\
  \ The profile is typically reconstructed from neutron emissivity measurements using\
  \ collimated neutron cameras or activation foils, with tomographic inversion providing\
  \ the spatial distribution. In present-day deuterium plasmas, $P_{\\rm DD}$ peaks\
  \ at $10^3$\u2013$10^5$ W m$^{-3}$ in the core, depending on density and temperature.\
  \ See also `deuterium_deuterium_neutron_emissivity` for the associated neutron source\
  \ strength and `deuterium_tritium_fusion_power_density` for the D\u2013T counterpart."
