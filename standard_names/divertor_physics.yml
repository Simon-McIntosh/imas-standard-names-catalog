    enhanced_context:
      description: Vertical (Z) coordinate of surface outline.
      kind: template
- name: wetted_area_of_divertor_target
  kind: scalar
  status: active
  description: Area of one divertor target receiving deposited heat flux at or above
    one e-folding below its peak, including flux expansion and spreading.
  documentation: 'The wetted area is the portion of one divertor target surface that
    receives deposited heat flux at least equal to the peak target heat flux divided
    by $e$. It characterizes the heat-load footprint produced by mapping the scrape-off-layer
    heat-flux decay length to the target surface.


    $$

    A_w = \int_{A_t} H\!\left(q_t(\mathbf{s}) - \frac{q_{t,\max}}{e}\right)\,\mathrm{d}A

    $$


    where $A_t$ is the plasma-facing area of the target, $q_t(\mathbf{s})$ is the
    deposited heat-flux density at target position $\mathbf{s}$, $q_{t,\max}$ is its
    maximum value on that target, $H$ is the Heaviside step function, and $\mathrm{d}A$
    is the surface-area element. The mapped footprint includes flux expansion and
    the spreading factor associated with the scrape-off-layer decay length.


    This is a per-target footprint area, distinct from the geometric area of a [divertor
    tile](name:surface_area_of_divertor_tile). The total over all targets is [wetted
    area of the divertor](name:wetted_area_of_divertor).'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:surface_area_of_divertor_tile
  sources:
  - dd_path: divertors/divertor/target/wetted_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-wetted_area
    dd_documentation:
      leaf: Wetted area of the target, defined by the SOL heat flux decay length (lambda_q)
        mapped to the target using flux expansion and spreading factor and the target
        toroidal circumference. In other words, this is the area getting heat flux
        from the maximum value down to one e-fold decay.
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: m^2
    enhanced_context:
      description: "Wetted area of the divertor target, defined by mapping the SOL\
        \ heat flux decay length (\u03BB_q) to the target plate using flux expansion\
        \ and spreading factor. Represents the region receiving heat flux down to\
        \ one e-folding decay from peak."
      kind: llm
- name: xenon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of xenon ions in the plasma immediately adjacent to
    a divertor target, summed over all ionization charge states Xe1+ through Xe54+
    and excluding neutral xenon atoms.
  documentation: 'Xenon density at the divertor target is the local number density
    of ionized xenon in the plasma immediately adjacent to the divertor target surface.
    It represents all occupied ionization stages in the thin plasma layer upstream
    of the electrostatic sheath entrance, excluding neutral xenon atoms, and is a
    species-resolved member of the [density_at_divertor_target](name:density_at_divertor_target)
    family.


    The total xenon ion density is the sum over all occupied charge states:


    $$

    n_{\mathrm{Xe}} = \sum_{q=1}^{54} n_{\mathrm{Xe}^{q+}}

    $$


    where $n_{\mathrm{Xe}^{q+}}$ is the local number density of xenon ions in charge
    state $q$, summed from singly ionized Xe$^{1+}$ through fully stripped Xe$^{54+}$.


    Xenon is introduced as a high-Z noble-gas seeding impurity to enhance radiative
    power dissipation in the divertor region, reducing peak target heat loads during
    high-power operation. At near-target plasma temperatures of a few to tens of eV,
    lower charge states dominate the local xenon ion population; higher charge states
    become significant only further upstream where the electron temperature is substantially
    greater. The near-target xenon density is inferred from spectroscopic line-emission
    measurements combined with impurity transport modeling.


    For comparison, [neon_density_at_divertor_target](name:neon_density_at_divertor_target)
    gives the analogous quantity for the lighter noble-gas seeding species neon, and
    [xenon_density_at_limiter](name:xenon_density_at_limiter) provides the corresponding
    xenon ion density at a limiter surface rather than a divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:neon_density_at_divertor_target
  - name:xenon_density_at_limiter
  arguments:
