name: neutral_beam_injector_launched_power
status: draft
description: Total power launched into the vessel by the neutral beam injection system
  before any plasma absorption or loss.
documentation: "The NBI launched power $P_{\\mathrm{launched}}$ (in W) is the kinetic\
  \ power carried by the neutral beam entering the vacuum vessel port, measured upstream\
  \ of any plasma interaction. It equals $P_{\\mathrm{launched}} = I_{\\mathrm{beam}}\
  \ E_{\\mathrm{beam}} \\eta_{\\mathrm{neut}}$, where $I_{\\mathrm{beam}}$ is the\
  \ accelerated ion current, $E_{\\mathrm{beam}}$ is the beam energy (typically 40\u2013\
  100 keV for present devices, 1 MeV for ITER), and $\\eta_{\\mathrm{neut}}$ is the\
  \ neutralization efficiency. Typical launched powers are 2\u20138 MW per injector\
  \ unit; multiple units can deliver 15\u201340 MW aggregate power. The value is obtained\
  \ from calorimetry on beam-line components and ion-source power measurements. The\
  \ difference between launched power and the deposited heating power quantifies the\
  \ total beam loss channels (shine-through, orbit, and charge-exchange losses)."
