    \ measurements, or design models of the diagnostic installation referenced to\
    \ the machine coordinate origin. Together with $R$ and $\\phi$, it fully specifies\
    \ the three-dimensional position of the camera center in the tokamak geometry.\
    \ The analogous vertical coordinate for general optical elements is given by [vertical_coordinate_of_optical_element](name:vertical_coordinate_of_optical_element),\
