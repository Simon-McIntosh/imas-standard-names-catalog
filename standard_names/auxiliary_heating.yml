      description: "Poloidal angle (\u03B8) coordinate at each point along a ray or\
        \ beam propagation path in the beam tracing calculation. Locates the beam\
        \ trace in poloidal space within the wave propagation geometry."
      kind: llm
- name: poloidal_angle_of_electron_cyclotron_beam
  kind: scalar
  status: active
  description: "Poloidal angle of an electron-cyclotron beam is the steering angular\
    \ coordinate of its mean wave-vector direction in the poloidal cross-section of\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, measured from inward radial\
    \ toward downward vertical."
  documentation: 'The poloidal angle of an electron-cyclotron beam is the steering
    angular coordinate of the beam mean wave-vector direction at launch, projected
    into a poloidal cross-section of the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It is the [poloidal angle](name:poloidal_angle) of the projected propagation direction,
    not the poloidal coordinate of a spatial point.


    For a beam mean wave vector with radial and vertical components $k_R$ and $k_Z$
    in the right-handed cylindrical $(R,\phi,Z)$ frame, the angle is


    $$

    \theta_\mathrm{pol}=\operatorname{atan2}(-k_Z,\,-k_R)

    $$


    where $\theta_\mathrm{pol}$ is the poloidal angle, $k_R$ is the [radial wave-vector
    component], $k_Z$ is the [vertical wave-vector component](name:vertical_wave_vector),
    and $\operatorname{atan2}(y,x)$ returns the quadrant-resolved principal value
    for the ordered pair $(x,y)$. The angle is zero for a projected beam direction
    along inward $-\hat{R}$ and equals $\pi/2$ for a projected beam direction along
    downward $-\hat{Z}$.


    This quantity describes the electron-cyclotron beam steering direction at the
    launch point and does not locate a point on the beam trajectory. It is distinct
    from [poloidal angle of a beam-tracing beam](name:poloidal_angle_of_beam_tracing_beam),
    which is the angular coordinate of successive trajectory positions, and complementary
    to [toroidal angle of the electron cyclotron beam](name:toroidal_angle_of_electron_cyclotron_beam),
    which describes the toroidal component of the same steering direction.


    Sign convention: Positive when the poloidal projection of the beam mean wave vector
    is rotated from the inward radial direction $-\hat{R}$ toward the downward vertical
    direction $-\hat{Z}$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_angle_of_beam_tracing_beam
  - name:toroidal_angle_of_electron_cyclotron_beam
  sources:
  - dd_path: ec_launchers/beam/steering_angle_pol
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-beam-steering_angle_pol
    dd_documentation:
      leaf: Steering angle of the EC beam in the R,Z plane (from the -R axis towards
        the -Z axis), angle_pol=atan2(-k_Z,-k_R), where k_Z and k_R are the Z and
        R components of the mean wave vector in the EC beam
      parent_path: ec_launchers/beam
      parent: Set of Electron Cyclotron beams
      data_type: FLT_1D
      unit: rad
      coordinates:
      - ec_launchers/beam/time
    enhanced_context:
      description: "Poloidal steering angle of the electron cyclotron (EC) beam in\
        \ the R\u2013Z plane, defined as atan2(\u2212k_Z, \u2212k_R) from the mean\
        \ wave vector. Controls the poloidal launch direction and determines the radial\
        \ deposition location of ECRH power."
      kind: llm
  - dd_path: summary/heating_current_drive/ec/angle_pol/value
