- name: beryllium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local non-negative number density of beryllium ions at the divertor
    target, summed over Be1+ through Be4+ charge states and excluding neutral beryllium
    atoms.
  documentation: 'Beryllium density at the divertor target is the local number of
    beryllium ions per unit volume in the plasma adjacent to the divertor target surface.
    It is a species-resolved, non-negative scalar density for atomic number 4 and
    excludes neutral beryllium unless a separate neutral-density quantity is specified.


    When individual charge states are not represented separately, the ion density
    is the sum over the bound-electron charge states of beryllium ions:


    $$

    n_{\mathrm{Be},\mathrm{tgt}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+},\mathrm{tgt}}

    $$


    where $n_{\mathrm{Be},\mathrm{tgt}}$ is the beryllium ion number density at the
    divertor target, $n_{\mathrm{Be}^{q+},\mathrm{tgt}}$ is the partial number density
    in m$^{-3}$ of ions in charge state Be$^{q+}$, and $q$ is the charge-state index;
    an ion in charge state $q$ carries charge $+q e$, with $e$ the elementary charge.
    The neutral state Be$^{0}$ is not included in this sum.


    In practice this quantity is inferred from beryllium line emission together with
    atomic population modeling, from impurity transport modeling constrained by edge
    and divertor measurements, or from edge-plasma simulations that evolve species-resolved
    ion densities. It is a beryllium-specific component of the local divertor-target
    ion population and should be interpreted relative to [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    when assessing impurity concentration.


    Typical absolute values are strongly dependent on wall material, erosion and recycling
    conditions, ionization balance, and divertor plasma state, so no device-independent
    numerical range is implied by the definition. Under trace-impurity conditions
    $n_{\mathrm{Be},\mathrm{tgt}}$ is much smaller than the total target ion density;
    in all cases it is constrained to be non-negative and not larger than the local
    total ion density. Related beryllium-density quantities include [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    [beryllium_density_at_limiter](name:beryllium_density_at_limiter), [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    and [line_averaged_beryllium_density](name:line_averaged_beryllium_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:boron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_pedestal
  - name:beryllium_density_at_limiter
  sources:
  - id: dd:summary/local/divertor_plate/n_i/beryllium/value
    dd_path: summary/local/divertor_plate/n_i/beryllium/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/beryllium/value
    dd_path: summary/local/divertor_target/n_i/beryllium/value
    status: composed
- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Effective charge (Zeff) of the plasma evaluated at the divertor target,
    a dimensionless composite indicator of impurity content equal to unity for a pure
    hydrogen plasma and rising above unity as high-charge impurity species accumulate.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the multi-species\
    \ ion composition at the divertor target by weighting each ion species by the\
    \ square of its charge number, normalized to the electron density. It reflects\
    \ the local impurity content arising from sputtering of plasma-facing components,\
    \ deliberate impurity seeding for power exhaust control, and recycling processes\
    \ at the divertor surface.\n\nThe quantity is defined under quasi-neutrality by:\n\
    \n$$\nZ_\\text{eff} = \\frac{\\sum_s n_s Z_s^2}{n_e}\n$$\n\nwhere $n_s$ is the\
    \ number density of ion species $s$ with charge number $Z_s$, and $n_e = \\sum_s\
    \ n_s Z_s$ is the electron number density enforced by quasi-neutrality. High-$Z$\
    \ impurities contribute disproportionately: a trace fraction of [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ or [argon_density_at_divertor_target](name:argon_density_at_divertor_target)\
    \ raises $Z_\\text{eff}$ far more than an equivalent density of [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target).\n\
    \n$Z_\\text{eff}$ at the divertor is inferred from spectroscopic impurity line\
    \ emission or from the Bremsstrahlung continuum, whose volumetric emissivity scales\
    \ as $n_e^2 Z_\\text{eff}$. Impurity seeding enhances radiative power dissipation\
    \ in detachment scenarios, thereby reducing the [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\
    \ This is the effective-charge component of the [charge_at_divertor_target](name:charge_at_divertor_target)\
    \ family.\n\nTypical values range from 1 for a pure hydrogen plasma to 2\u2013\
    8 in seeded or erosion-dominated divertor conditions.\n\nSign convention: Positive\
    \ when at least one ion species with nonzero charge number is present in the plasma,\
    \ as the numerator $\\sum_s n_s Z_s^2$ and denominator $n_e$ are both positive\
    \ under quasi-neutrality, ensuring $Z_\\text{eff} \\geq 1$."
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
  - name:charge_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/zeff/value
    dd_path: summary/local/divertor_plate/zeff/value
    status: composed
  - id: dd:summary/local/divertor_target/zeff/value
    dd_path: summary/local/divertor_target/zeff/value
    status: attached
- name: electron_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Electron thermal power deposited on the inner divertor target.
  documentation: 'Electron power at the inner divertor target is the total rate at
    which electron thermal energy is deposited on the inner, high-field-side divertor
    target surface. It is the electron contribution to the deposited target power
    and is distinct from ion, neutral, radiative, or electromagnetic power contributions.


    The deposited electron power is the surface integral of the electron heat-flux
    density normal to the target and directed into the material:


    $$

    P_{e,\mathrm{inner}} = \int_{A_\mathrm{inner}} q_{e,n}^{\mathrm{dep}} \, dA

    $$


    where $A_\mathrm{inner}$ is the inner target surface area over which electron
    heat is deposited, $dA$ is an element of target area in m$^2$, and $q_{e,n}^{\mathrm{dep}}$
    is the deposited electron heat-flux density in W m$^{-2}$. If a vector electron
    heat flux is used, $q_{e,n}^{\mathrm{dep}}$ is its projection onto the unit normal
    pointing into the target material; only the into-surface electron thermal component
    is included.


    In practice this quantity is obtained by integrating local electron heat-flux
    estimates over the inner target. Those estimates may come from Langmuir probe
    measurements with a sheath heat-transmission model, from surface calorimetry or
    infrared thermography combined with a model that separates the electron channel,
    or from edge-plasma simulations constrained by divertor diagnostics.


    As a deposited power it is reported as a non-negative scalar; 0 W means that no
    resolved electron thermal power reaches the inner target. Values are strongly
    device- and scenario-dependent, ranging from near 0 W during highly detached or
    low-power phases to kilowatt or megawatt scales in powered divertor plasmas. The
    corresponding outer-target quantity is [electron_power_at_outer_divertor_target](name:electron_power_at_outer_divertor_target),
    while integrated divertor power balances are described by [thermal_power_of_divertor](name:thermal_power_of_divertor)
    and [power_of_divertor](name:power_of_divertor).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_inner_divertor_target
  - name:electron_power_at_outer_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
  sources:
  - id: dd:wall/global_quantities/electrons/power_inner_target
    dd_path: wall/global_quantities/electrons/power_inner_target
    status: composed
- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of hydrogen ions evaluated locally in the plasma adjacent
    to the divertor target surface.
  documentation: 'Hydrogen density at the divertor target is the local number density
    of hydrogen ions in the plasma immediately adjacent to the target surface. It
    represents the hydrogen contribution to the ion population that enters the divertor
    sheath and participates in recycling, ionization balance, and target particle
    loading.


    For an attached sheath-limited target, the hydrogen ion particle flux to the surface
    is often related to the local density by the Bohm sheath estimate:


    $$

    \Gamma_H \simeq n_H c_s

    $$


    where $n_H$ is the hydrogen ion density in m$^{-3}$, $\Gamma_H$ is the hydrogen
    ion particle flux density in m$^{-2}$ s$^{-1}$, and $c_s$ is the ion sound speed
    at the sheath entrance in m s$^{-1}$. In collisional or detached conditions, the
    same density may require a more detailed treatment of ionization, recombination,
    charge exchange, and flow between the plasma and the material surface.


    This quantity is usually inferred rather than measured directly. Langmuir probes
    can constrain local electron density and ion saturation current, spectroscopy
    can constrain hydrogen emission and ionization sources through collisional-radiative
    analysis, and edge plasma modeling combines these observations with particle-balance
    assumptions to separate the hydrogen ion contribution from other ion species.


    A universal numerical range is not intrinsic to the quantity because divertor
    target density varies strongly with machine size, fueling, detachment state, impurity
    seeding, and isotope mix. In hydrogen-dominated, singly ionized target plasma,
    $n_H$ is typically of the same order as the local [electron density](name:electron_density_at_divertor_target);
    in mixed-species plasmas it is the hydrogen component of the local [ion density](name:ion_density_at_divertor_target)
    and is reduced by deuterium, tritium, helium, or impurity dilution.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:neon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/hydrogen/value
    dd_path: summary/local/divertor_plate/n_i/hydrogen/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/hydrogen/value
    dd_path: summary/local/divertor_target/n_i/hydrogen/value
    status: attached
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of iron ions at the divertor target, summed over all
    ionization stages, providing a local measure of this high-Z metallic impurity
    from erosion of iron-containing plasma-facing and structural materials.
  documentation: 'Iron is a high-Z metallic impurity in fusion plasmas, originating
    from sputtering and erosion of iron-containing structural components and plasma-facing
    materials. The iron number density at the divertor target represents the total
    number of iron ions per unit volume at the divertor target location, aggregated
    over all ionization states $z = 1, \ldots, 26$.


    The combined iron density is defined as:


    $$

    n_\text{Fe} = \sum_{z=1}^{26} n_{\text{Fe}^{z+}}

    $$


    where $n_{\text{Fe}^{z+}}$ is the local density of iron ions in charge state $z$,
    in m$^{-3}$.


    This quantity is a species-resolved component of the broader [density_at_divertor_target](name:density_at_divertor_target),
    characterizing how much high-Z impurity load reaches the divertor target from
    the scrape-off layer. Elevated iron concentrations at the divertor target indicate
    strong erosion or enhanced impurity transport toward the target, and can substantially
    increase radiated power through iron line emission. The density is inferred from
    spectroscopic analysis of iron emission lines in the divertor region, combined
    with collisional-radiative modeling to convert observed line intensities to absolute
    number densities.


    Comparison with [volume_averaged_iron_density](name:volume_averaged_iron_density)
    reveals the degree of impurity accumulation near the target relative to the bulk
    plasma, while [iron_density_at_pedestal](name:iron_density_at_pedestal) gives
    the corresponding local density at the pedestal. Analogous divertor-target densities
    for other impurity species include [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    [argon_density_at_divertor_target](name:argon_density_at_divertor_target), and
    [boron_density_at_divertor_target](name:boron_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:volume_averaged_iron_density
  - name:iron_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i/iron/value
    dd_path: summary/local/divertor_plate/n_i/iron/value
    status: composed
  - id: dd:summary/local/divertor_target/n_i/iron/value
    dd_path: summary/local/divertor_target/n_i/iron/value
