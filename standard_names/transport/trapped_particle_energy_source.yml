name: trapped_particle_energy_source
status: draft
description: Volumetric source rate of energy density for particles (thermal and fast)
  confined to trapped (banana) orbits.
documentation: "The trapped-particle energy source $S_{E,\\mathrm{trap}}$ (W m$^{-3}$)\
  \ quantifies the net rate at which energy density is deposited into (or lost from)\
  \ the trapped-orbit portion of the particle distribution function. Trapped particles\
  \ satisfy the magnetic mirror condition $v_\\parallel^2 / v^2 < 1 - B_{\\min}/B_{\\\
  max}$, where $B_{\\min}$ and $B_{\\max}$ are the minimum and maximum magnetic-field\
  \ magnitudes on the flux surface. Sources include collisional exchange with passing\
  \ populations, ICRH resonance heating (which preferentially heats trapped particles\
  \ at the low-field side), NBI deposition into trapped pitch angles, and loss processes\
  \ such as toroidal-field ripple transport. Positive values indicate net energy gain.\
  \ Typical magnitudes range from $10^3$ to $10^6$ W m$^{-3}$ in auxiliary-heated\
  \ tokamak plasmas. Computed via Fokker\u2013Planck or Monte Carlo orbit codes that\
  \ resolve the trapped/passing partition."
