- name: oxygen_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the oxygen species at the divertor target is the
    local particle count per volume for oxygen ions at the sheath entrance, summed
    over all positive ionization states and excluding neutral oxygen.
  documentation: 'Number density of the oxygen species at the divertor target is the
    local particle count per volume at the sheath entrance immediately upstream of
    the target-facing plasma boundary. It is the oxygen-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local oxygen-ion number density is defined by the differential particle count:


    $$

    n_{\rm O} = \frac{dN_{\rm O}}{dV}

    $$


    where $N_{\rm O}$ is the total number of oxygen ions in a small plasma volume
    $V$ centered at the sheath entrance on the plasma side of the divertor target.


    This quantity applies to the oxygen-ion population at the specified divertor target
    and sums the number densities of all positive oxygen ionization states, counting
    each ion once. Neutral oxygen atoms are excluded; therefore, it is distinct from
    [oxygen_density](name:oxygen_density), which includes neutral oxygen as well as
    charged oxygen states.


    The target-specific quantity has the same charge-state-summed convention as [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    while [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    represents the corresponding oxygen-ion density at the plasma boundary without
    this divertor-target locus.'
