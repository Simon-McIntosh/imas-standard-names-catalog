- name: radial_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: active
  description: "Nonnegative major-radius location of the geometric centroid of one\
    \ ferritic element in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the radial coordinate of the geometric centroid
    of one ferritic element, locating that centroid by its distance from the toroidal
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame. Here $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The centroid radial coordinate is defined by


    $$

    R_c = \sqrt{x_c^2+y_c^2}

    $$


    where $R_c$ is the radial coordinate of the ferritic-element centroid, and $x_c$
    and $y_c$ are its Cartesian coordinates in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$
    basis, with $\hat{z}=\hat{Z}$.


    This quantity applies independently to each ferritic element and is not summed
    or averaged over elements. It is distinct from the [radial outline coordinate
    of a ferritic element](name:radial_outline_of_ferritic_element), which locates
    contour points, and from the [vertical coordinate of a ferritic-element centroid](name:z_coordinate_of_ferritic_element_centroid),
    which provides the centroid''s $Z$ coordinate. It is the ferritic-element-centroid
    specialization of the general [radial coordinate](name:radial_coordinate).'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
