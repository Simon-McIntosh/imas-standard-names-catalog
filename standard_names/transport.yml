- name: electron_velocity
  kind: vector
  status: draft
  description: Mean fluid flow velocity of the electron population, defined by the
    first velocity-space moment of the electron distribution.
  documentation: 'Electron velocity is the bulk drift of the electron fluid obtained
    from the first moment of the electron distribution function, not the random thermal
    motion associated with [electron_temperature](name:electron_temperature). It enters
    charge, momentum, and current balance together with [ion_velocity], and its components
    are resolved relative to radial, poloidal, toroidal, and magnetic-field-aligned
    directions.


    The electron fluid velocity $\mathbf{v}_e$ is defined from the electron distribution
    function $f_e(\mathbf{x},\mathbf{v},t)$ by


    $$

    \mathbf{v}_e(\mathbf{x},t) = \frac{1}{n_e(\mathbf{x},t)} \int \mathbf{v}\, f_e(\mathbf{x},\mathbf{v},t)\,
    d^3v

    $$


    where $\mathbf{x}$ is position, $\mathbf{v}$ is particle velocity, and $n_e$ is
    the [electron_density](name:electron_density). In a quasineutral plasma, differences
    between electron and ion flow contribute to [plasma_current_density]; perpendicular
    components are often governed by drift motion driven by the [electric_field](name:electric_field)
    and [magnetic_field].


    Electron velocity is computed in fluid, kinetic, neoclassical, and turbulence
    transport models, and it can be inferred indirectly from current-density reconstruction
    combined with ion-flow measurements or from edge probes in sufficiently cool boundary
    plasmas. Direct core measurement is difficult because electron thermal speeds
    greatly exceed bulk flows.


    Representative bulk electron speeds in magnetically confined plasmas range from
    10^3-10^5 m.s^-1 for cross-field drift and turbulent transport velocities, and
    from 10^4-10^6 m.s^-1 for parallel current-carrying flow, depending on density
    and current density.


    Sign convention: Positive when a component of $\mathbf{v}_e$ points along the
    positive direction of its stated basis: outward for radial velocity, increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame for
    toroidal velocity, increasing poloidal angle for poloidal velocity, and along
    the local magnetic-field direction for parallel velocity.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_temperature
  - name:electron_density
  - name:electric_field
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity
    dd_path: core_profiles/profiles_1d/electrons/velocity
    status: composed
- name: fast_electron_density
  kind: scalar
  status: draft
  description: Number of suprathermal electrons per unit volume, separated from the
    bulk thermal population by an energy- or velocity-space criterion.
  documentation: 'Fast-electron density is the zeroth velocity-space moment of the
    nonthermal electron distribution over the part of phase space designated as fast.
    It complements the bulk [thermal electron density](name:thermal_electron_density)
    and contributes to the total [electron density](name:electron_density) when the
    suprathermal population is included.


    For an electron distribution function $f_e(\mathbf{x},\mathbf{v})$, where $\mathbf{x}$
    is position, $\mathbf{v}$ is velocity, and $f_e$ has units m$^{-3}$(m s$^{-1}$)$^{-3}$,
    the fast-electron density is


    $$

    n_{e,\mathrm{fast}}(\mathbf{x}) = \int_{\Omega_\mathrm{fast}} f_e(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $\Omega_\mathrm{fast}$ is the velocity-space region defining suprathermal
    electrons relative to the bulk distribution.


    It is inferred from diagnostics sensitive to energetic electrons, including hard-X-ray
    bremsstrahlung, electron cyclotron emission, synchrotron radiation, and kinetic
    modeling constrained by current-drive or runaway-electron measurements. The same
    population also sets anisotropic pressure components such as [parallel fast electron
    pressure](name:parallel_fast_electron_pressure), while [fast ion density](name:fast_ion_density)
    is the ion counterpart for energetic particles.


    Representative values span about 10^14-10^18 m^-3 for weak RF- or wave-driven
    tails, rising to 10^18-10^20 m^-3 in strong runaway-electron or high-power auxiliary-heating
    phases; the value remains below or comparable to the bulk electron density in
    most confined plasmas.


    Sign convention: Positive when the integrated fast-electron distribution function
    over the defined fast region is positive.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:thermal_electron_density
  - name:electron_density
  - name:parallel_fast_electron_pressure
  - name:fast_ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/density_fast
    dd_path: core_profiles/profiles_1d/electrons/density_fast
    status: composed
- name: fast_electron_pressure
  kind: vector
  status: draft
  description: Gyrotropic pressure of suprathermal electrons resolved into directions
    parallel and perpendicular to the local magnetic field.
  documentation: 'Fast-electron pressure describes the momentum flux carried by a
    suprathermal electron population whose distribution need not be thermally equilibrated
    with the bulk electrons. In magnetized plasmas it is commonly represented by parallel
    and perpendicular pressures relative to the local magnetic-field direction, connecting
    the shared physics behind [parallel fast-electron pressure](name:parallel_fast_electron_pressure)
    and the total [electron pressure](name:electron_pressure).


    For a gyrotropic fast-electron distribution, the pressure tensor is written as


    $$

    \mathbf{P}_{fe} = p_{\parallel,fe}\,\hat{b}\hat{b} + p_{\perp,fe}\,(\mathbf{I}-\hat{b}\hat{b})

    $$


    where $\mathbf{P}_{fe}$ is the fast-electron pressure tensor, $p_{\parallel,fe}$
    and $p_{\perp,fe}$ are the pressures parallel and perpendicular to the magnetic-field
    unit vector $\hat{b}=\mathbf{B}/|\mathbf{B}|$, and $\mathbf{I}$ is the identity
    tensor. The scalar contribution to an isotropized pressure is often formed from
    $(p_{\parallel,fe}+2p_{\perp,fe})/3$ when comparing with [electron pressure](name:electron_pressure).


    Fast-electron pressure is inferred from kinetic modeling constrained by hard-X-ray,
    electron-cyclotron-emission, synchrotron, or bremsstrahlung measurements, and
    from transport calculations using the fast-electron distribution function. It
    is most relevant in plasmas with electron cyclotron current drive, lower-hybrid
    current drive, runaway-electron populations, or strong auxiliary heating. Values
    can range from negligible compared with thermal pressure to $10^2$-$10^4$ Pa in
    localized energetic-electron populations, with larger values possible in disruption-generated
    runaway beams.


    Sign convention: Positive when the component represents compressive kinetic pressure
    from fast-electron random motion along its associated magnetic-field-aligned direction.'
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_fast_electron_pressure
  - name:electron_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/electrons
    dd_path: core_profiles/profiles_1d/electrons
    status: composed
- name: fast_ion_density
  kind: scalar
  status: draft
  description: Number of suprathermal ions per unit volume in the non-Maxwellian population
    with energies above the local thermal bulk.
  documentation: 'Fast-ion density measures the population of energetic ions that
    is not part of the thermal Maxwellian bulk. The boundary between fast and thermal
    ions is operational: it is set by the heating, fusion-product, or transport model,
    and the total ion population relates to [ion density](name:ion_density) while
    [thermal ion density] describes the complementary bulk population.


    A common kinetic definition integrates the fast-ion distribution function over
    the selected fast region of velocity space:


    $$

    n_{fi}(\mathbf{x},t) = \sum_Z \int_{\mathcal{V}_{fast}} f_{i,Z}(\mathbf{x},\mathbf{v},t)\,d^3v

    $$


    where $n_{fi}$ is the fast-ion density, $f_{i,Z}$ is the distribution function
    for ion charge state $Z$ at position $\mathbf{x}$ and time $t$, $\mathbf{v}$ is
    particle velocity, and $\mathcal{V}_{fast}$ is the model-defined suprathermal
    velocity-space domain. When charge states are resolved, [fast ion state density](name:fast_ion_state_density)
    gives the corresponding contribution for a charge-state bundle.


    Fast-ion density is inferred from fast-ion D-alpha spectroscopy, neutron emission,
    neutral-particle analysis, gamma-ray spectroscopy, collective Thomson scattering,
    and kinetic modeling of neutral-beam, ion-cyclotron, or fusion-born alpha populations.
    Representative core values in beam-heated or radio-frequency-heated tokamak plasmas
    span about $10^{15}$-$10^{18}$ m$^{-3}$, with burning-plasma alpha populations
    reaching higher fractions while remaining below the bulk [ion density](name:ion_density).
    Pressure anisotropy associated with the same population is described by [parallel
    fast ion pressure](name:parallel_fast_ion_pressure).


    Sign convention: Positive when the integrated fast-ion phase-space distribution
    function is nonnegative over the selected suprathermal velocity-space domain.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:ion_density
  - name:fast_ion_state_density
  - name:parallel_fast_ion_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/ion/density_fast
    dd_path: core_profiles/profiles_1d/ion/density_fast
    status: composed
  - id: dd:core_profiles/profiles_1d/ion/state/density_fast
    dd_path: core_profiles/profiles_1d/ion/state/density_fast
    status: composed
- name: fast_ion_pressure
  kind: vector
  status: draft
  description: Gyrotropic pressure of energetic ions resolved into components parallel
    and perpendicular to the local magnetic field.
  documentation: 'Fast-ion pressure is the kinetic stress carried by suprathermal
    ion populations produced by auxiliary heating, fusion reactions, or acceleration
    processes. Because these ions often have anisotropic velocity distributions, the
    pressure is represented by field-aligned parallel and perpendicular components
    rather than by a single isotropic value. It complements [fast-ion density](name:fast_ion_density)
    and should be distinguished from thermal-ion quantities such as [ion temperature](name:ion_temperature)
    and [ion density](name:ion_density).


    For a gyrotropic fast-ion distribution, the components are defined from velocity-space
    moments:


    $$

    p_{\parallel f}=m_i\int (v_\parallel-u_\parallel)^2 f_f\,d^3v,\qquad p_{\perp
    f}=\frac{m_i}{2}\int v_\perp^2 f_f\,d^3v

    $$


    where $m_i$ is the ion mass, $f_f$ is the fast-ion distribution function, $v_\parallel$
    and $v_\perp$ are particle velocities relative to the magnetic-field direction,
    and $u_\parallel$ is the parallel fast-ion flow velocity. The isotropic limit
    satisfies $p_{\parallel f}=p_{\perp f}$.


    Fast-ion pressure is inferred from kinetic modeling constrained by diagnostics
    such as fast-ion D-alpha spectroscopy, neutral-particle analyzers, collective
    Thomson scattering, neutron emission, gamma-ray spectroscopy, and charged-fusion-product
    measurements. Related anisotropic energetic-particle quantities include [fast-ion
    state pressure] and the electron counterpart [fast-electron pressure].


    Representative core values range from 10^2-10^5 Pa in neutral-beam-heated, ion-cyclotron-heated,
    or alpha-particle-producing plasmas; values are much lower near the plasma edge
    as energetic-ion confinement degrades.


    Sign convention: Positive when the fast-ion random kinetic stress is compressive,
    so the parallel and perpendicular pressure components add positive diagonal entries
    to the gyrotropic pressure tensor.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_ion_density
  - name:ion_temperature
  - name:ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion
    dd_path: core_profiles/profiles_1d/ion
    status: composed
- name: fast_ion_state_density
  kind: scalar
  status: draft
  description: Local number density of suprathermal ions belonging to a resolved ionization
    or charge-state population.
  documentation: 'Fast-ion state density is the phase-space zeroth moment of the suprathermal
    ion population for one resolved charge state. It separates energetic particles
    produced by neutral-beam injection, ion-cyclotron heating, fusion reactions, or
    strong acceleration from the thermal charge-state population described by [thermal
    ion state density](name:thermal_ion_state_density). Summing over resolved charge
    states gives the state-resolved contribution to [fast ion density](name:fast_ion_density),
    while combining thermal and fast populations contributes to [ion density](name:ion_density).


    For a charge state $Z$ and fast-particle velocity-space region $\Omega_f$, the
    density is


    $$

    n_{f,Z} = \int_{\Omega_f} f_{i,Z}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $n_{f,Z}$ is the fast-ion density for charge state $Z$, $f_{i,Z}$ is the
    ion distribution function for position $\mathbf{x}$ and velocity $\mathbf{v}$,
    and $\Omega_f$ is the part of velocity space above the local thermal bulk criterion.


    It is inferred from fast-ion diagnostics such as fast-ion D-alpha spectroscopy,
    neutron emission, gamma-ray spectroscopy, collective Thomson scattering, and neutral-particle
    analysis, often combined with kinetic orbit and Fokker-Planck modeling. Representative
    core values range from $10^{16}$-$10^{19}\;\mathrm{m^{-3}}$ in beam- or radio-frequency-heated
    tokamak plasmas, commonly a fraction of a percent to several percent of the bulk
    ion density. The related [parallel fast-ion state pressure](name:parallel_fast_ion_state_pressure)
    is the corresponding second velocity moment along the magnetic field.


    Sign convention: Positive when the charge-state-resolved fast-ion distribution
    function is non-negative over the velocity-space region defining the suprathermal
    population.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:thermal_ion_state_density
  - name:fast_ion_density
  - name:ion_density
  - name:parallel_fast_ion_state_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/density_fast
    dd_path: core_profiles/profiles_1d/ion/state/density_fast
    status: composed
- name: fast_ion_state_pressure
  kind: vector
  status: draft
  description: Directional kinetic pressure of a charge-state-resolved fast-ion population,
    resolved parallel and perpendicular to the local magnetic field.
  documentation: 'This quantity represents the anisotropic kinetic pressure carried
    by energetic ions within a specified charge-state bundle. It separates momentum-space
    pressure into components along and across the magnetic field, providing the charge-state-resolved
    counterpart of [fast ion pressure](name:fast_ion_pressure). It is closely tied
    to the energetic-particle population described by [fast ion density](name:fast_ion_density)
    and differs from thermal-ion pressure associated with [ion temperature](name:ion_temperature).


    For a gyrotropic fast-ion distribution, the directional pressures are defined
    from velocity-space moments:


    $$

    P_\parallel = m_i \int (v_\parallel-u_\parallel)^2 f_i\,d^3v, \qquad P_\perp =
    \frac{m_i}{2}\int v_\perp^2 f_i\,d^3v

    $$


    where $P_\parallel$ and $P_\perp$ are the parallel and perpendicular directional
    pressures, $m_i$ is ion mass, $f_i$ is the fast-ion distribution function, $v_\parallel$
    and $v_\perp$ are particle velocities relative to the magnetic field, and $u_\parallel$
    is the parallel mean flow.


    It is inferred from kinetic modeling constrained by neutral-particle analyzers,
    fast-ion D-alpha spectroscopy, neutron emission, gamma-ray measurements, collective
    Thomson scattering, and charge-exchange diagnostics. Core values in auxiliary-heated
    tokamaks span about 10^2-10^5 Pa, with larger anisotropy during neutral-beam injection
    or ion-cyclotron heating.


    Sign convention: Positive when the directional pressure component represents compressive
    kinetic momentum flux in the specified parallel or perpendicular direction.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_ion_pressure
  - name:fast_ion_density
  - name:ion_temperature
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state
    dd_path: core_profiles/profiles_1d/ion/state
    status: composed
- name: ion_average_charge
  kind: scalar
  status: draft
  description: Density-weighted mean ionization charge state of a specified ion species,
    averaged over its resolved charge-state populations.
  documentation: 'Ion average charge is the mean charge state of an ion species after
    weighting each ionization state by its particle density. It differs from the plasma-wide
    [effective charge], which weights charge states differently to characterize collisionality
    and impurity content, and it is tied directly to the species [ion_density](name:ion_density).


    The density-weighted charge-state average is


    $$

    \bar{Z}_i = \frac{\sum_{\zeta} \zeta\, n_{i,\zeta}}{\sum_{\zeta} n_{i,\zeta}}

    $$


    where $\bar{Z}_i$ is the mean charge state of ion species $i$, $\zeta$ is the
    integer ionization charge state, and $n_{i,\zeta}$ is the density of that charge
    state. The denominator is the total density of the species and corresponds to
    the species contribution to [ion_density](name:ion_density).


    This quantity is computed from resolved charge-state densities in transport or
    collisional-radiative modeling and can be constrained by spectroscopic measurements
    of line emission, recombination continua, and impurity charge-state balance. For
    fuel ions such as deuterium and tritium it is usually 1 in fully ionized core
    plasma, while helium is near 2; medium-Z impurities such as carbon or neon can
    span several charge states, and tungsten may have mean charge states from about
    10 to above 50 depending on electron temperature. The plasma-wide consequence
    of these charge states is summarized by [plasma_effective_ion_charge].


    Sign convention: Positive when the ion charge states represent net positive electric
    charge relative to neutral atoms.'
  unit: '1'
  physics_domain: transport
  links:
  - name:ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion/z_ion_1d
    dd_path: core_profiles/profiles_1d/ion/z_ion_1d
    status: composed
- name: ion_charge_state_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure carried by ions in one resolved ionization charge-state
    population, including thermal bulk and non-thermal contributions.
  documentation: 'Ion charge-state pressure is the scalar kinetic pressure associated
    with ions of a specified species and ionization state, before summing over other
    charge states. It is the charge-state-resolved contribution that can be accumulated
    into [ion_pressure](name:ion_pressure) or [total_ion_pressure](name:total_ion_pressure),
    while [thermal_ion_state_pressure](name:thermal_ion_state_pressure) denotes the
    thermal-only subset when such a separation is made.


    For an isotropic scalar pressure, it is one third of the trace of the kinetic
    pressure tensor for that charge state:


    $$

    p_{i,z} = \frac{1}{3}\,\mathrm{Tr}\left[m_i \int (\mathbf{v}-\mathbf{u}_{i,z})(\mathbf{v}-\mathbf{u}_{i,z})
    f_{i,z}(\mathbf{x},\mathbf{v})\,d^3v\right]

    $$


    where $p_{i,z}$ is in Pa, $i$ labels the ion species, $z$ is the integer ionization
    charge state, $m_i$ is ion mass in kg, $\mathbf{v}$ and $\mathbf{u}_{i,z}$ are
    particle and mean-flow velocities in m s$^{-1}$, and $f_{i,z}$ is the charge-state
    distribution function.


    It is inferred from charge-state-resolved spectroscopy, impurity transport analysis,
    collisional-radiative modeling, and kinetic calculations constrained by [ion_density](name:ion_density),
    [ion_temperature](name:ion_temperature), and [ion_average_charge](name:ion_average_charge).
    Representative core contributions span about 10^2-10^5 Pa for abundant main-ion
    or impurity charge states in heated tokamaks, while weak impurity states or edge
    populations can contribute below 1 Pa; energetic components are related to [fast_ion_state_pressure].'
  unit: Pa
  physics_domain: transport
  links:
  - name:ion_pressure
  - name:total_ion_pressure
  - name:thermal_ion_state_pressure
  - name:ion_density
  - name:ion_temperature
  - name:ion_average_charge
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/pressure
    dd_path: core_profiles/profiles_1d/ion/state/pressure
    status: composed
- name: ion_density
  kind: scalar
  status: draft
  description: Total ion number density for a species, including thermal and nonthermal
    populations and summing over charge states when they are resolved.
  documentation: 'Ion density is the local number of ions of a given species per unit
    volume, including both bulk thermal ions and nonthermal ion populations. When
    charge states are resolved, this quantity is the sum over those charge states
    rather than a single-state population. It is the ion counterpart of [electron
    density](name:electron_density) and separates into components such as [thermal
    ion density] and [fast ion density](name:fast_ion_density) when those populations
    are represented independently.


    For a kinetic description, the total ion density can be written as the velocity-space
    and charge-state sum:


    $$

    n_i(\mathbf{x}) = \sum_Z \int f_{i,Z}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $n_i$ is the ion number density in m$^{-3}$, $Z$ labels charge state, $f_{i,Z}$
    is the phase-space distribution function for that charge state, $\mathbf{x}$ is
    position, and $\mathbf{v}$ is particle velocity. Quasi-neutrality connects this
    quantity to electron density through $n_e \simeq \sum_i Z_i n_i$ when impurities
    and multiple ion species are included.


    Ion density is inferred from particle-balance modeling, charge-exchange recombination
    spectroscopy, beam-emission measurements, neutral-particle analysis, and consistency
    with interferometry or Thomson-scattering measurements of the electron channel.
    Core deuterium or hydrogen ion densities in tokamak plasmas commonly range from
    $10^{19}$ to $10^{20}$ m$^{-3}$, while edge and scrape-off-layer values are lower
    and energetic-ion densities are often a small fraction of the bulk population.


    Sign convention: Positive when the counted ion population exceeds the zero-density
    reference.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:fast_ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion/density
    dd_path: core_profiles/profiles_1d/ion/density
    status: composed
- name: ion_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure carried by the ion population, combining thermal
    and non-thermal contributions and summing charge states when unresolved.
  documentation: 'Ion pressure is the isotropic kinetic pressure associated with ions,
    including both random thermal motion and non-thermal energetic-ion contributions.
    It is distinct from [thermal ion pressure](name:thermal_ion_pressure), which excludes
    fast-particle pressure, and from [ion state pressure](name:ion_charge_state_pressure),
    which resolves a single charge state rather than the summed ion population.


    A common decomposition is


    $$

    p_i = \sum_Z \left(p_{i,Z}^{\rm th} + p_{i,Z}^{\rm nt}\right), \qquad p_{i,Z}^{\rm
    th}=n_{i,Z} k_B T_{i,Z}

    $$


    where $p_i$ is the ion pressure, $Z$ labels ion charge state, $p_{i,Z}^{\rm th}$
    is the thermal contribution, $p_{i,Z}^{\rm nt}$ is the non-thermal contribution,
    $n_{i,Z}$ is number density in m$^{-3}$, $T_{i,Z}$ is thermodynamic temperature
    in K, and $k_B$ is Boltzmann''s constant. If [ion temperature](name:ion_temperature)
    is expressed in electronvolts, $k_B T_{i,Z}$ is replaced by $eT_{i,Z}$, with $e$
    the elementary charge.


    Ion pressure is inferred by combining ion density, ion temperature, and energetic-particle
    information from diagnostics such as charge-exchange recombination spectroscopy,
    neutral-particle analysis, neutron measurements, and transport or equilibrium
    analysis. It contributes with [electron pressure](name:electron_pressure) to the
    total plasma pressure balance, while [total ion pressure](name:total_ion_pressure)
    clarifies the fully summed quantity across all ion species.


    Core thermal ion pressures in present tokamaks often span 1-100 kPa; high-performance
    or burning-plasma scenarios can reach 0.1-1 MPa, while edge and scrape-off-layer
    values can fall to 1-1000 Pa.


    Sign convention: Positive when the ion contribution is compressive, corresponding
    to positive isotropic normal stress in the plasma pressure tensor.'
  unit: Pa
  physics_domain: transport
  links:
  - name:thermal_ion_pressure
  - name:ion_charge_state_pressure
  - name:ion_temperature
  - name:electron_pressure
  - name:total_ion_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/ion/pressure
    dd_path: core_profiles/profiles_1d/ion/pressure
    status: composed
- name: ion_temperature
  kind: scalar
  status: draft
  description: Mean random kinetic energy per degree of freedom of the bulk ion population,
    averaged over charge states or species when the context combines them.
  documentation: 'Ion temperature is the kinetic temperature associated with random
    ion motion after subtracting the mean ion flow. It represents the thermal part
    of the ion energy distribution and is distinct from directed [ion_velocity], while
    combining with [ion_density](name:ion_density) to determine thermal pressure.


    For an ion species $s$ with distribution function $f_s(\mathbf{v})$, density $n_s$
    in m$^{-3}$, mass $m_s$ in kg, and mean flow velocity $\mathbf{u}_s$, the temperature
    expressed as energy is


    $$

    T_{i,s} = \frac{m_s}{3 n_s e}\int |\mathbf{v}-\mathbf{u}_s|^2 f_s(\mathbf{v})\,d^3v

    $$


    where $e$ is the elementary charge and $\mathbf{v}$ is particle velocity. When
    multiple charge states or ion species are represented by one value, the result
    is an appropriate population average.


    Ion temperature is measured most directly by charge-exchange recombination spectroscopy
    from Doppler broadening of impurity emission lines, and it can also be inferred
    from neutron spectroscopy or transport analysis. It is a key input to [thermal_ion_pressure](name:thermal_ion_pressure)
    and helps distinguish thermal-ion behavior from energetic components described
    by [fast_ion_density](name:fast_ion_density).


    Typical values range from 1-20 keV in tokamak cores, 100-1000 eV in pedestal and
    edge plasmas, and 1-100 eV in cold scrape-off-layer conditions.


    Sign convention: Positive when the ion velocity distribution has a positive second
    central moment relative to its mean flow.'
  unit: eV
  physics_domain: transport
  links:
  - name:ion_density
  - name:thermal_ion_pressure
  - name:fast_ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/temperature
    dd_path: core_profiles/profiles_1d/ion/state/temperature
    status: attached
  - id: dd:core_profiles/profiles_1d/ion/temperature
    dd_path: core_profiles/profiles_1d/ion/temperature
    status: composed
  - id: dd:core_profiles/profiles_1d/t_i_average
    dd_path: core_profiles/profiles_1d/t_i_average
    status: composed
- name: ion_velocity
  kind: vector
  status: draft
  description: Bulk flow velocity of the ion fluid, representing the first velocity
    moment of the ion distribution and coupling particle, momentum, and energy transport.
  documentation: 'Ion velocity is the bulk fluid motion of the ion population obtained
    from the first moment of the ion velocity distribution. It is distinct from thermal
    motion described by [ion_temperature](name:ion_temperature) and contributes to
    momentum transport, centrifugal effects, and convective particle flux together
    with [ion_density](name:ion_density).


    For an ion species or charge-state-averaged ion population, the fluid velocity
    $\mathbf{u}_i$ is defined by the ion particle flux density $\mathbf{\Gamma}_i$
    divided by the ion number density $n_i$:


    $$

    \mathbf{u}_i = \frac{\mathbf{\Gamma}_i}{n_i}

    $$


    where $\mathbf{\Gamma}_i$ is the ion particle flux density and $n_i$ is the ion
    number density. The velocity may be resolved into radial, poloidal, toroidal,
    or magnetic-field-parallel projections; comparison with [electron_velocity](name:electron_velocity)
    determines current-carrying relative motion and is related to [plasma_current_density](name:plasma_current_density).


    Ion flow is inferred from charge-exchange recombination spectroscopy, Doppler
    spectroscopy of impurity or main-ion emission, Mach probes in the scrape-off layer,
    and momentum-balance calculations constrained by equilibrium and transport modeling.
    Magnetic-field geometry from [magnetic_field](name:magnetic_field) sets the parallel
    direction and strongly influences neoclassical poloidal and toroidal rotation.


    Typical core toroidal and parallel ion velocities are 1e3-1e5 m.s^-1 in neutral-beam-heated
    tokamaks, while radial convective velocities are commonly 1-100 m.s^-1 except
    during transient events. Edge and scrape-off-layer flows can approach the ion
    sound speed, especially along open magnetic-field lines.


    Sign convention: Positive when a resolved velocity component is aligned with its
    positive basis direction: outward across flux surfaces for the radial component,
    along increasing poloidal angle for the poloidal component, along increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame for the toroidal
    component, and along the local magnetic-field direction for the parallel component.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:ion_temperature
  - name:ion_density
  - name:electron_velocity
  - name:plasma_current_density
  - name:magnetic_field
  sources:
  - id: dd:core_profiles/profiles_1d/ion/velocity
    dd_path: core_profiles/profiles_1d/ion/velocity
    status: composed
- name: normalized_electron_collisionality
  kind: scalar
  status: draft
  description: Dimensionless ratio of the electron collision frequency to the trapped-particle
    bounce frequency, separating neoclassical transport regimes.
  documentation: "Normalized electron collisionality, often denoted $\\nu_e^*$, measures\
    \ how many electron pitch-angle-scattering collisions occur during one trapped-particle\
    \ bounce period. It controls whether electron neoclassical transport lies in the\
    \ banana, plateau, or Pfirsch-Schl\xFCter regime and is closely tied to collisional\
    \ transport of [electron_density](name:electron_density), [electron_temperature](name:electron_temperature),\
    \ and [electron_pressure](name:electron_pressure).\n\nA common definition is\n\
    \n$$\n\\nu_e^* = \\frac{\\nu_e}{\\omega_b}\n$$\n\nwhere $\\nu_e$ is the effective\
    \ electron collision frequency in s$^{-1}$ and $\\omega_b$ is the bounce frequency\
    \ of trapped electrons in s$^{-1}$. The exact bounce-frequency model depends on\
    \ magnetic geometry and pitch-angle convention, so comparisons should use the\
    \ same normalization basis.\n\nThis quantity is computed from kinetic profiles,\
    \ magnetic geometry, and collisional transport formulas rather than measured directly.\
    \ Values below about 0.1 correspond to weakly collisional banana-regime behavior,\
    \ values near 0.1-1 mark the plateau transition, and values above 1 indicate increasingly\
    \ collisional Pfirsch-Schl\xFCter-like behavior, especially toward colder edge\
    \ plasma.\n\nSign convention: Positive when the electron collision frequency is\
    \ evaluated as a positive rate and divided by a positive bounce frequency."
  unit: '1'
  physics_domain: transport
  links:
  - name:electron_density
  - name:electron_temperature
  - name:electron_pressure
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/collisionality_norm
    dd_path: core_profiles/profiles_1d/electrons/collisionality_norm
    status: composed
- name: parallel_electric_field
  kind: scalar
  status: draft
  description: Field-aligned electric force per unit charge that accelerates particles
    along magnetic-field lines and drives parallel current.
  documentation: 'The parallel electric field is the projection of the [electric field](name:electric_field)
    onto the local magnetic-field direction. It is the component that performs work
    on charged particles along field lines, setting Ohmic current drive, runaway-electron
    acceleration, and field-aligned transport without being converted into an $E \times
    B$ drift.


    The field-aligned projection is defined by


    $$

    E_\parallel = \mathbf{E} \cdot \hat{\mathbf{b}} = \frac{\mathbf{E} \cdot \mathbf{B}}{|\mathbf{B}|}

    $$


    where $E_\parallel$ is the parallel electric field in V m$^{-1}$, $\mathbf{E}$
    is the electric-field vector in V m$^{-1}$, $\mathbf{B}$ is the magnetic-field
    vector in T, and $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the unit vector
    along the magnetic field. In resistive single-fluid transport it is closely related
    to [parallel plasma current density](name:parallel_plasma_current_density) through
    the [electrical conductivity], while kinetic treatments connect it to [parallel
    electron velocity](name:parallel_electron_velocity) through the electron momentum
    balance.


    It is inferred from magnetic-flux evolution, loop-voltage constraints, current-density
    reconstruction, and transport calculations based on generalized Ohm''s law; direct
    local measurement is uncommon because the field-aligned component is small and
    geometry dependent. The [poloidal electric field](name:poloidal_electric_field)
    is a coordinate projection, whereas this quantity follows the magnetic-field direction
    and therefore changes with magnetic pitch.


    Representative core values are about 0.01-1 V m$^{-1}$ during tokamak current
    ramp and flat-top phases, with much larger transient values, 1-100 V m$^{-1}$,
    possible during rapid current quench, reconnection, or strong runaway-electron
    drive.


    Sign convention: Positive when the electric-field vector points along the local
    magnetic-field direction.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:parallel_plasma_current_density
  - name:parallel_electron_velocity
  - name:poloidal_electric_field
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/parallel
    dd_path: core_profiles/profiles_1d/e_field/parallel
    status: composed
- name: parallel_electron_velocity
  kind: scalar
  status: draft
  description: Field-aligned projection of the bulk electron fluid velocity, describing
    electron flow along the local magnetic-field direction.
  documentation: 'The parallel electron velocity is the field-aligned component of
    the bulk electron fluid flow. It is the projection of [electron_velocity](name:electron_velocity)
    onto the local magnetic-field direction and is distinct from geometric projections
    such as [radial_electron_velocity](name:radial_electron_velocity), [poloidal_electron_velocity](name:poloidal_electron_velocity),
    and [toroidal_electron_velocity](name:toroidal_electron_velocity).


    The defining projection is


    $$

    v_{e\parallel} = \mathbf{v}_e \cdot \mathbf{b} = \mathbf{v}_e \cdot \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $v_{e\parallel}$ is the parallel electron velocity, $\mathbf{v}_e$ is the
    electron fluid velocity vector, $\mathbf{B}$ is the magnetic-field vector, and
    $\mathbf{b}$ is the unit vector along the magnetic field.


    This quantity is inferred from transport analysis, electron momentum balance,
    and current-density constraints combined with measurements of electron density,
    temperature, magnetic geometry, and plasma rotation. It is often compared with
    [parallel_ion_velocity](name:parallel_ion_velocity) because the difference between
    electron and ion parallel flows contributes directly to the parallel current carried
    by the plasma.


    Representative core tokamak values are about $10^3$-$10^5$ m s$^{-1}$, while edge
    and scrape-off-layer flows can reach $10^4$-$10^6$ m s$^{-1}$ near strong parallel
    pressure gradients or sheath-connected field lines.


    Sign convention: Positive when the electron fluid flow is aligned with the local
    magnetic-field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:radial_electron_velocity
  - name:poloidal_electron_velocity
  - name:toroidal_electron_velocity
  - name:parallel_ion_velocity
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity/parallel
    dd_path: core_profiles/profiles_1d/electrons/velocity/parallel
    status: composed
- name: parallel_fast_electron_pressure
  kind: scalar
  status: draft
  description: Field-aligned kinetic pressure of the non-thermal electron population,
    formed from the second velocity moment parallel to the local magnetic field.
  documentation: 'Parallel fast-electron pressure is the field-aligned component of
    the pressure tensor for suprathermal electrons, excluding the bulk thermal electron
    contribution. It distinguishes kinetic stress associated with motion along the
    local magnetic-field direction from the perpendicular component, [perpendicular_fast_electron_pressure](name:perpendicular_fast_electron_pressure),
    and together these components form [fast_electron_pressure].


    For a gyrotropic fast-electron distribution, the defining kinetic moment is


    $$

    p_{f e,\parallel} = m_e \int (v_\parallel - u_\parallel)^2 f_{f e}(\mathbf{v})\,d^3v

    $$


    where $p_{f e,\parallel}$ is the parallel fast-electron pressure, $m_e$ is the
    electron mass, $v_\parallel$ is particle velocity projected along the local magnetic
    field, $u_\parallel$ is the fast-electron mean parallel flow, and $f_{f e}$ is
    the fast-electron velocity distribution such that $\int f_{f e}\,d^3v$ gives [fast_electron_density](name:fast_electron_density).


    This quantity is computed from kinetic fast-electron distribution functions or
    inferred from diagnostics sensitive to suprathermal electrons, such as hard-X-ray
    emission, electron cyclotron emission, and RF-wave absorption analysis. It is
    compared with [parallel_fast_ion_pressure](name:parallel_fast_ion_pressure) when
    assessing anisotropic energetic-particle pressure balance and wave-particle momentum
    exchange.


    Representative values range from less than $10^2$ Pa in weakly heated plasmas
    to $10^3$-$10^5$ Pa in regions with strong electron cyclotron or lower-hybrid
    acceleration; the ratio to perpendicular pressure indicates pressure anisotropy
    and can affect stability and current-drive efficiency.


    Sign convention: Positive when the field-aligned random kinetic energy density
    of the fast-electron population is nonzero.'
  unit: Pa
  physics_domain: transport
  links:
  - name:perpendicular_fast_electron_pressure
  - name:fast_electron_density
  - name:parallel_fast_ion_pressure
  arguments:
  - name: fast_electron_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/electrons/pressure_fast_parallel
    status: composed
- name: parallel_fast_ion_pressure
  kind: scalar
  status: draft
  description: Pressure-tensor component from suprathermal ions associated with random
    particle motion along the local magnetic field direction.
  documentation: "Parallel fast-ion pressure is the projection of the energetic-ion\
    \ pressure tensor along the local magnetic-field direction. It isolates the part\
    \ of the suprathermal ion kinetic stress associated with velocity-space spread\
    \ parallel to the field, complementing [perpendicular fast-ion pressure](name:perpendicular_fast_ion_pressure)\
    \ and forming the directional content of [fast-ion pressure](name:fast_ion_pressure).\n\
    \nFor fast-ion species or charge-state populations $s$, the kinetic definition\
    \ is\n\n$$\np_{\\mathrm{fi},\\parallel} = \\sum_s \\int m_s \\left(v_\\parallel\
    \ - u_{\\parallel,s}\\right)^2 f_{\\mathrm{fi},s}(\\mathbf{v})\\,d^3v\n$$\n\n\
    where $m_s$ is the ion mass, $v_\\parallel$ is particle velocity along the magnetic\
    \ field, $u_{\\parallel,s}$ is the mean parallel flow of that fast-ion population,\
    \ and $f_{\\mathrm{fi},s}$ is the fast-ion velocity distribution function. The\
    \ parent [fast-ion pressure](name:fast_ion_pressure) is obtained from the corresponding\
    \ pressure-tensor components, while [fast-ion density](name:fast_ion_density)\
    \ constrains the zeroth moment of the same distribution.\n\nThis quantity is inferred\
    \ by combining energetic-particle diagnostics such as fast-ion D-alpha spectroscopy,\
    \ neutron emission, neutral-particle analysis, gamma-ray spectroscopy, or collective\
    \ Thomson scattering with kinetic modeling of neutral-beam, ion-cyclotron, or\
    \ fusion-born ion populations. It is compared with [thermal ion pressure](name:thermal_ion_pressure)\
    \ to assess energetic-particle contributions to equilibrium, Alfv\xE9nic stability,\
    \ and anisotropic transport.\n\nRepresentative core values span 10^2-10^4 Pa in\
    \ auxiliary-heated tokamak plasmas, with reactor-relevant fusion-alpha populations\
    \ reaching about 10^4-10^5 Pa in high-performance scenarios. Strong anisotropy,\
    \ with parallel and perpendicular components differing substantially, is common\
    \ when fast ions are created by directed neutral-beam injection or resonant wave\
    \ heating.\n\nSign convention: Positive when the parallel fast-ion kinetic stress\
    \ is compressive along the local magnetic-field direction."
  unit: Pa
  physics_domain: transport
  links:
  - name:perpendicular_fast_ion_pressure
  - name:fast_ion_pressure
  - name:fast_ion_density
  - name:thermal_ion_pressure
  arguments:
  - name: fast_ion_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/ion/pressure_fast_parallel
    status: composed
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/ion/state/pressure_fast_parallel
    status: composed
- name: parallel_fast_ion_state_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure from suprathermal ions in a resolved charge-state
    bundle associated with random motion along the local magnetic field.
  documentation: 'Parallel fast-ion state pressure is the gyrotropic pressure-tensor
    component carried by energetic ions in a specified charge-state bundle along the
    local magnetic field. It is the directional component of [fast-ion state pressure],
    complementing [perpendicular fast-ion state pressure](name:perpendicular_fast_ion_state_pressure)
    and distinguishing charge-state-resolved energetic-particle pressure from the
    charge-summed [parallel fast-ion pressure](name:parallel_fast_ion_pressure).


    For a charge-state bundle $a$, the kinetic definition is


    $$

    p_{\parallel,a}^{\mathrm{fast}} = m_a \int \left(v_\parallel - u_{\parallel,a}\right)^2
    f_a^{\mathrm{fast}}(\mathbf{v})\, d^3v

    $$


    where $m_a$ is the ion mass, $v_\parallel$ is particle velocity projected along
    the local magnetic field, $u_{\parallel,a}$ is the mean parallel flow of that
    fast-ion state, and $f_a^{\mathrm{fast}}$ is the suprathermal velocity-space distribution.
    The corresponding [fast-ion state density](name:fast_ion_state_density) sets the
    zeroth moment of the same distribution, while [thermal ion state pressure](name:thermal_ion_state_pressure)
    describes the bulk Maxwellian contribution.


    This quantity is computed from kinetic fast-ion distribution models or inferred
    by combining energetic-particle diagnostics such as neutron emission, fast-ion
    D-alpha spectroscopy, neutral-particle analysis, gamma-ray spectroscopy, and collective
    scattering with transport modeling. Representative core values range from about
    10^2-10^5 Pa in auxiliary-heated tokamaks, with the largest values in neutral-beam-heated
    or alpha-particle-dominated plasmas and much smaller values where suprathermal
    ion density is weak.


    Sign convention: Positive when the pressure component represents compressive random
    kinetic stress along the local magnetic-field direction.'
  unit: Pa
  physics_domain: transport
  links:
  - name:perpendicular_fast_ion_state_pressure
  - name:parallel_fast_ion_pressure
  - name:fast_ion_state_density
  - name:thermal_ion_state_pressure
  arguments:
  - name: fast_ion_state_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/ion/state/pressure_fast_parallel
    status: composed
- name: parallel_ion_velocity
  kind: scalar
  status: draft
  description: Field-aligned projection of the bulk ion flow velocity, distinguishing
    motion along magnetic field lines from cross-field drifts.
  documentation: 'Parallel ion velocity is the component of the ion fluid flow along
    the local magnetic-field direction. It is the field-aligned part of the full [ion
    velocity], complementary to cross-field components such as [radial ion velocity](name:radial_ion_velocity)
    and geometric flow components such as [toroidal ion velocity](name:toroidal_ion_velocity).


    The defining projection is


    $$

    v_{i\parallel} = \mathbf{v}_i \cdot \mathbf{b}, \qquad \mathbf{b}=\frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathbf{v}_i$ is the ion fluid velocity, $\mathbf{B}$ is the magnetic-field
    vector, $|\mathbf{B}|$ is its magnitude, and $\mathbf{b}$ is the unit vector along
    the local field. This component enters parallel momentum balance, neoclassical
    transport, impurity screening, and comparison with the [parallel electron velocity](name:parallel_electron_velocity)
    that helps determine field-aligned current.


    Parallel ion flow is inferred from charge-exchange recombination spectroscopy,
    Doppler spectroscopy, or transport modeling combined with magnetic-equilibrium
    geometry, because diagnostics often measure line-of-sight or toroidal/poloidal
    projections that must be projected onto $\mathbf{b}$. Representative core values
    range from $10^3$-$10^5$ m s$^{-1}$, with larger values possible in strongly rotating
    or neutral-beam-heated plasmas.


    Sign convention: Positive when the ion flow is along the local magnetic-field
    vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:radial_ion_velocity
  - name:toroidal_ion_velocity
  - name:parallel_electron_velocity
  arguments:
  - name: ion_velocity
    operator: component
    operator_kind: projection
