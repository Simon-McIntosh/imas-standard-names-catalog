- name: ion_power_at_inner_divertor_target
  kind: scalar
  status: active
  description: Ion power deposited on the inner, high-field-side divertor target is
    the rate at which incident ion energy is deposited over the wetted target surface.
  documentation: 'Ion power at the inner divertor target is the rate at which energy
    carried by incident ions is deposited on the high-field-side target surface. It
    is the ion-channel contribution to [power at the inner divertor target](name:power_at_inner_divertor_target),
    distinct from electron, neutral, and radiative contributions.


    A common definition is the surface integral of the ion-deposited heat-flux density
    over the wetted inner-target area:


    $$

    P_{i,\mathrm{inner}} = \int_{A_{\mathrm{wet,inner}}} q_{i,\mathrm{dep}}(\mathbf{x})\,dA

    $$


    where $A_{\mathrm{wet,inner}}$ is the wetted inner-target area, $q_{i,\mathrm{dep}}$
    is the ion contribution to the deposited heat-flux density, and $dA$ is an element
    of target surface area. When species resolution is not retained, the ion contribution
    is summed over the contributing ion species and charge states. The related [total
    ion power at the inner divertor target](name:total_ion_power_at_inner_divertor_target)
    is a concrete specialization, while [electron power at the inner divertor target](name:electron_power_at_inner_divertor_target)
    represents the complementary electron channel.'
