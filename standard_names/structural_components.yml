- name: nuclear_power_of_breeder_blanket
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited in the entire breeding blanket
    assembly by neutron and gamma radiation from the fusion plasma.
  documentation: This quantity represents the integral power deposited by neutron
    and gamma interactions across all components of the breeding blanket, including
    breeder zones, structural materials, and coolant channels. The nuclear heating
    arises primarily from neutron elastic and inelastic scattering, neutron capture
    reactions, and gamma-ray energy deposition, contributing directly to the blanket
    thermal power budget. Typical values for a DEMO-class reactor range from several
    hundred megawatts to over a gigawatt, depending on fusion power, blanket material
    composition, and neutron multiplication. This power load is a key input to thermal-hydraulic
    design and tritium breeding ratio calculations. For layer-specific partitioning,
    see [nuclear_power_of_breeder_blanket_layer](name:nuclear_power_of_breeder_blanket_layer);
    for the shield component, see [nuclear_power_of_breeder_blanket_shield](name:nuclear_power_of_breeder_blanket_shield).
    The total is distinct from the [neutron_flux_at_wall](name:neutron_flux_at_wall),
    which describes the incident neutron current rather than the deposited power.
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_of_breeder_blanket_layer
  - name:nuclear_power_of_breeder_blanket_shield
  - name:neutron_flux_at_wall
  sources:
  - id: dd:breeding_blanket/time_slice/power_nuclear_blanket
    dd_path: breeding_blanket/time_slice/power_nuclear_blanket
    status: composed
- name: nuclear_power_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited in a breeding blanket layer from
    neutron and gamma interactions.
  documentation: The nuclear power $P_{\text{nuc}}$ represents the total thermal power
    deposited within a specific layer of a breeding blanket module through neutron
    and gamma-ray energy deposition. This heating arises from nuclear reactions, including
    neutron scattering and capture, as well as gamma-ray absorption, and is a critical
    parameter for assessing the thermal load on the blanket layer. The power is typically
    computed from coupled neutronics and thermal-hydraulic simulations using Monte
    Carlo transport codes with nuclear cross-section libraries; deposited energy tallies
    provide the volumetric heating rate, which is integrated over the layer volume
    to obtain $P_{\text{nuc}}$. For DEMO-class breeder blanket designs, layer power
    loads range from 10 to 200 MW, depending on the layer's proximity to the plasma
    and neutron flux attenuation through the blanket structure. The layer nuclear
    power is closely related to [nuclear_power_of_breeder_blanket](name:nuclear_power_of_breeder_blanket),
    which sums the heating across all layers and the blanket shield, and [nuclear_power_of_breeder_blanket_shield](name:nuclear_power_of_breeder_blanket_shield),
    which captures the heating in the shield region. Local heating intensity is described
    by [nuclear_power_density_at_midplane](name:nuclear_power_density_at_midplane).
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_of_breeder_blanket
  - name:nuclear_power_of_breeder_blanket_shield
  - name:nuclear_power_density_at_midplane
  sources:
  - id: dd:breeding_blanket/module/layer/time_slice/power_nuclear
    dd_path: breeding_blanket/module/layer/time_slice/power_nuclear
    status: composed
- name: nuclear_power_of_breeder_blanket_shield
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited by neutrons and gamma rays in
    the neutron shield structures of the breeding blanket.
  documentation: "This quantity represents the integrated power from nuclear reactions\
    \ \u2014 primarily neutron and gamma interactions \u2014 that is deposited as\
    \ heat within the shield components surrounding the breeder blanket. The shield\
    \ structures absorb high-energy neutrons escaping the breeder zone, converting\
    \ their kinetic energy into thermal energy via elastic and inelastic scattering,\
    \ capture reactions, and subsequent gamma-ray absorption. This heating load must\
    \ be managed by the shield cooling system to maintain structural integrity and\
    \ is a key input for thermal-hydraulic design of the blanket shield. Typical values\
    \ for a fusion power plant range from tens to hundreds of megawatts depending\
    \ on the neutron wall loading and shield material composition. The total shield\
    \ power complements the nuclear heating in the breeder modules, which is tracked\
    \ by [nuclear_power_density_at_midplane](name:nuclear_power_density_at_midplane)\
    \ and is coupled to the incident neutron flux quantified by [neutron_flux_at_wall](name:neutron_flux_at_wall)."
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_at_midplane
  - name:neutron_flux_at_wall
  sources:
  - id: dd:breeding_blanket/time_slice/power_nuclear_shields
    dd_path: breeding_blanket/time_slice/power_nuclear_shields
    status: composed
- name: pressure_at_cooling_circuit_inlet
  kind: scalar
  status: draft
  description: Static pressure of the coolant at the inlet of a breeding blanket module
    cooling circuit. This pressure determines the hydraulic driving force for coolant
    flow through the blanket and affects the pumping power requirements.
  documentation: "The coolant static pressure at the blanket module cooling circuit\
    \ inlet sets the hydraulic boundary condition for the primary heat transport system.\
    \ In fusion breeding blankets, the coolant (typically pressurized water, helium,\
    \ or liquid metal) is pumped through the module to extract nuclear heating and\
    \ surface heat flux, with the inlet pressure designed to maintain single-phase\
    \ flow or suppress bulk boiling under nominal operating conditions. Typical inlet\
    \ pressures range from 15\u201325\u202FMPa for pressurized-water-cooled lithium\u2013\
    lead (WCLL) blankets and 2\u201310\u202FMPa for helium-cooled ceramic breeder\
    \ (HCPB) concepts. This quantity is closely tied to `temperature_at_cooling_circuit_inlet`\
    \ to define the coolant thermodynamic state, and together with `total_power_at_cooling_circuit_inlet`\
    \ it characterizes the module energy balance and pumping requirements.\n\nSign\
    \ convention: Positive when the coolant static pressure is greater than the local\
    \ saturation pressure, ensuring subcooled liquid conditions at the module entrance.\n\
    \nThe inlet pressure is also related to `pressure_of_port` in the balance-of-plant\
    \ context, where it interfaces with the primary coolant loop piping and pump discharge\
    \ conditions."
  unit: Pa
  physics_domain: structural_components
  links: []
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/pressure_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/pressure_inlet
    status: composed
- name: resistance_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a block element in the discretized vacuum
    vessel wall, governing eddy current dissipation during transient events.
  documentation: The electrical resistance $R$ of a discrete vacuum vessel wall element
    determines the resistive voltage drop $V = IR$ and ohmic power dissipation $P
    = I^2R$ when eddy currents are induced during plasma disruptions or fast coil
    current changes. In the 2D wall description, the vessel wall is discretized into
    toroidally axisymmetric conducting elements, each characterized by its resistance
    to toroidal current flow. Typical values for ITER-grade vacuum vessel segments
    are in the micro-ohm to milliohm range, depending on element geometry and the
    resistivity of the structural material (e.g., stainless steel at operating temperature).
    Accurate resistance values are essential for electromagnetic transient simulations
    that predict induced currents, electromagnetic forces, and structural heating.
    See also [resistivity_of_vacuum_vessel](name:resistivity_of_vacuum_vessel) for
    the material property that, combined with element geometry, yields this resistance,
    and [resistance_of_toroidal_field_coil](name:resistance_of_toroidal_field_coil)
    for a related coil-system quantity.
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_vacuum_vessel
  - name:resistance_of_toroidal_field_coil
  sources:
  - id: dd:wall/description_2d/vessel/unit/element/resistance
    dd_path: wall/description_2d/vessel/unit/element/resistance
    status: composed
- name: volume_of_breeder_blanket
  kind: scalar
  status: draft
  description: Total volume occupied by the liquid lead-lithium (PbLi) breeder material
    within the breeding blanket modules.
  documentation: 'The volume of the breeder blanket containing liquid lead-lithium
    (PbLi) determines the tritium breeding inventory and the total mass of the liquid
    breeder material. For a given neutron fluence, the tritium breeding rate scales
    with this volume, assuming the lithium enrichment and neutron multiplication are
    set. The PbLi volume is a key engineering parameter that couples with the [neutron_flux_at_wall](name:neutron_flux_at_wall)
    and the material''s lithium density to define the tritium production capacity
    of the blanket. In fusion reactor designs, typical PbLi volumes per module range
    from $0.1$ to $10\,\text{m}^3$, depending on the blanket radial build and the
    coverage of the first wall. This volume is derived from the CAD geometry of the
    breeder zone, excluding structural steel, cooling channels, and other internal
    components.


    Sign convention: Positive when the breeder blanket physical geometry occupies
    non-zero volume in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:neutron_flux_at_wall
  sources:
  - id: dd:breeding_blanket/pb_li_volume
    dd_path: breeding_blanket/pb_li_volume
    status: composed
