      description: "Normalised toroidal flux coordinate (\u03C1_tor_norm) of the pedestal\
        \ top position, normalised to the value at the last closed flux surface (LCFS).\
        \ Locates the pedestal top radially within the plasma profile."
      kind: llm
- name: normalized_toroidal_flux_coordinate_at_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless toroidal-flux surface label evaluated on the last closed
    magnetic surface, serving as the outer reference for the normalized flux coordinate.
  documentation: 'The normalized toroidal flux coordinate at the plasma boundary is
    the magnetic-surface label assigned to the last closed flux surface, also called
    the separatrix. It identifies the outer boundary of the nested closed-flux-surface
    region and is not a cylindrical distance or local vector component.


    The boundary value is defined by


    $$

    \left.\rho_{\mathrm{tor,norm}}\right|_{\mathrm{plasma\ boundary}} = 1

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate and
    the plasma boundary is the last closed magnetic flux surface.


    This quantity is evaluated at the boundary itself, rather than averaged over the
    boundary or assigned to an arbitrary spatial point. It is the boundary specialization
    of the parent [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    whose value increases outward from the magnetic axis; the corresponding unnormalized
    quantity is the [toroidal flux coordinate at the plasma boundary](name:toroidal_flux_coordinate_at_plasma_boundary).'
  unit: '1'
  physics_domain: general
  links:
  - name:normalized_toroidal_flux_coordinate
