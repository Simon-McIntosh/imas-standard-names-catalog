- name: vertical_coordinate_of_conductor_element_center
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the geometric center of a coil conductor
    element in the right-handed cylindrical $(R, \phi, Z)$ frame, locating the element
    midpoint along the machine symmetry axis.
  documentation: "The vertical coordinate $Z$ specifies the height of the geometric\
    \ center of a discretized coil conductor element above the machine midplane in\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius,\
    \ $\\phi$ is the toroidal angle, and $Z$ is the vertical height. Together with\
    \ the companion coordinates [major_radius_of_conductor_element_center](name:major_radius_of_conductor_element_center)\
    \ and [toroidal_angle_of_conductor_element_center](name:toroidal_angle_of_conductor_element_center),\
    \ it fully specifies the three-dimensional midpoint position of each conductor\
    \ element, which is required for computing the magnetic field produced by the\
    \ coil current via the Biot\u2013Savart law $d\\mathbf{B} = (\\mu_0 I / 4\\pi)\
    \ \\, d\\mathbf{l} \\times \\hat{r} / r^2$, where $d\\mathbf{l}$ is the element\
    \ vector, $r$ is the distance to the field point, and $\\mu_0 = 4\\pi \\times\
    \ 10^{-7}$ H m$^{-1}$. Typical values range from $-10$ m to $+10$ m for large\
    \ tokamak poloidal field and toroidal field coils. The center coordinate is the\
    \ midpoint between the element's start and end points and is used in filamentary\
    \ conductor models for non-axisymmetric coil systems. The parent quantity [coordinate_of_conductor_element_center](name:coordinate_of_conductor_element_center)\
    \ collects all three coordinate components into a single geometric descriptor.\n\
    \nSign convention: Positive when the conductor element center is located above\
    \ the machine midplane in the $+Z$ direction of the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_conductor_element_center
  - name:toroidal_angle_of_conductor_element_center
  - name:coordinate_of_conductor_element_center
  constraints: []
  arguments:
  - name: coordinate_of_conductor_element_center
    operator: coordinate
    operator_kind: coordinate
    axis: vertical
    shape: coordinate
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/elements/centres/z
    dd_path: coils_non_axisymmetric/coil/conductor/elements/centres/z
    status: composed
  - id: dd:tf/coil/conductor/elements/centres/z
    dd_path: tf/coil/conductor/elements/centres/z
    status: composed
- name: vertical_coordinate_of_ferritic_object_centroid
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the geometric centroid of a ferritic object
    in the right-handed cylindrical (R, phi, Z) frame, where Z is the height measured
    parallel to the machine symmetry axis.
  documentation: 'The vertical coordinate $Z_{\rm centroid}$ locates the geometric
    centroid of a ferritic object along the $\hat{Z}$ axis of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is the major radius from the machine symmetry
    axis, $\phi$ is the toroidal angle, and $Z$ is the height above the machine midplane.
    It is defined by the projection


    $$Z_{\rm centroid} = \hat{e}_Z \cdot \mathbf{r}_{\rm centroid},$$


    where $\mathbf{r}_{\rm centroid}$ is the volume-weighted centroid position vector
    of the ferritic object and $\hat{e}_Z$ is the unit vector in the $+Z$ direction.
    The unit is meters (m).


    Together with the major-radius coordinate $R_{\rm centroid}$ and the toroidal
    angle $\phi_{\rm centroid}$, this coordinate fully specifies the centroid location
    in the cylindrical $(R, \phi, Z)$ frame. Typical values lie within the vertical
    extent of the vacuum vessel, generally in the range $-5\,{\rm m} \lesssim Z_{\rm
    centroid} \lesssim 5\,{\rm m}$ depending on machine size, though no hard physical
    bound applies beyond the device geometry.


    Ferritic objects (e.g., ferritic steel inserts or shielding modules) perturb the
    magnetic field distribution; accurate knowledge of their centroid positions is
    required for equilibrium and error-field compensation calculations.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_ferritic_object_centroid
  - name:y_coordinate_of_ferritic_object_centroid
  - name:vertical_coordinate_of_conductor_element_center
  constraints: []
  arguments:
