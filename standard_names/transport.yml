- name: normalized_poloidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial coordinate derived from the square root of the
    normalized poloidal magnetic flux, mapping the magnetic axis to 0 and the last
    closed flux surface to 1.
  documentation: "The normalized poloidal flux coordinate $\\rho_{\\mathrm{pol,norm}}$\
    \ is a dimensionless radial label for nested flux surfaces derived from the poloidal\
    \ magnetic flux $\\psi$, providing a monotonic coordinate that equals zero at\
    \ the magnetic axis and one at the last closed flux surface.\n\n$$\n\\rho_{\\\
    mathrm{pol,norm}} = \\sqrt{\\frac{\\psi - \\psi_{\\mathrm{axis}}}{\\psi_{\\mathrm{LCFS}}\
    \ - \\psi_{\\mathrm{axis}}}}\n$$\n\nwhere $\\psi$ is the poloidal magnetic flux\
    \ on the flux surface of interest, $\\psi_{\\mathrm{axis}}$ is its value at the\
    \ magnetic axis, and $\\psi_{\\mathrm{LCFS}}$ is its value at the last closed\
    \ flux surface.\n\nThe coordinate is obtained from equilibrium reconstruction,\
    \ which solves for the poloidal flux distribution $\\psi(R, Z)$ over the poloidal\
    \ cross-section in the right-handed cylindrical $(R, \\phi, Z)$ frame using magnetic\
    \ diagnostic measurements. For point measurements, $\\rho_{\\mathrm{pol,norm}}$\
    \ is assigned the local value at the measurement position; for line-integrated\
    \ diagnostics, it is taken as the minimum value reached along the line of sight\
    \ within the closed flux surface region.\n\nTypical pedestal locations in H-mode\
    \ plasmas fall near $\\rho_{\\mathrm{pol,norm}} = 0.90$\u2013$0.98$. In nearly\
    \ circular, low-$\\beta$ plasmas, $\\rho_{\\mathrm{pol,norm}}$ closely approximates\
    \ the normalized minor radius $r/a$ (where $r$ is the local minor radius and $a$\
    \ is the separatrix minor radius); in strongly shaped or high-$\\beta$ configurations,\
    \ significant deviations arise. The closely related [normalized toroidal flux\
    \ coordinate] uses the enclosed toroidal flux and is often preferred for transport\
    \ calculations requiring a well-behaved Jacobian.\n\nSign convention: Positive\
    \ when the evaluation point lies on a flux surface between the magnetic axis and\
    \ the last closed flux surface; the coordinate is non-negative by construction\
    \ and equals zero only at the magnetic axis."
  unit: '1'
  physics_domain: transport
  links: []
  sources:
