- name: x2_coordinate_of_neutron_detector
  kind: scalar
  status: draft
  description: Signed coordinate along the X2 axis of a vertex on the neutron detector
    boundary in the detector-local Cartesian (X1, X2) frame, defining the detector's
    cross-sectional outline.
  documentation: 'The X2 coordinate, together with [x1_coordinate_of_neutron_detector](name:x1_coordinate_of_neutron_detector),
    traces the irregular polygonal boundary of the neutron detector element in its
    detector-local planar Cartesian $(X1, X2)$ frame. This local frame is rigidly
    attached to the detector''s physical orientation and position, and is distinct
    from the machine cylindrical $(R, \phi, Z)$ frame; the relationship between the
    two frames is determined by the detector mounting geometry. The complete ordered
    sequence of $(X1, X2)$ vertex pairs defines the detector''s active area or aperture
    cross-section, which enters computations of detection solid angle, geometric efficiency,
    and neutron-emission synthetic diagnostics. The analogous coordinate for hard
    X-ray detectors follows the same convention as [x2_coordinate_of_hard_xray_detector](name:x2_coordinate_of_hard_xray_detector),
    and the soft X-ray analog is [x2_coordinate_of_soft_xray_detector](name:x2_coordinate_of_soft_xray_detector).


    Sign convention: Positive when the vertex lies in the positive X2 direction of
    the detector-local Cartesian $(X1, X2)$ frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
