name: ion_scrape_off_layer_heat_flux_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the ion heat flux mapped to the outboard
  midplane in the scrape-off layer.
documentation: "The ion heat-flux decay length $\\lambda_{q,i}$ (in m) quantifies\
  \ the radial scale over which the parallel ion heat flux $q_{\\|,i}$ falls off exponentially\
  \ in the scrape-off layer (SOL), referenced to the outboard midplane. Because ion\
  \ orbits are wider than electron orbits, $\\lambda_{q,i}$ can exceed $\\lambda_{q,e}$\
  \ by a factor that depends on the ion Larmor radius and collisionality. Typical\
  \ midplane-mapped values range from 2\u201315 mm in current tokamaks. The quantity\
  \ is generally more difficult to measure directly than its electron counterpart;\
  \ it is often inferred from charge-exchange recombination spectroscopy, retarding-field\
  \ energy analyzers, or SOL transport modeling codes (e.g., SOLPS-ITER). Accurate\
  \ knowledge of $\\lambda_{q,i}$ is essential for predicting the total divertor heat\
  \ load and for assessing the role of ion-orbit losses. See also `electron_heat_flux_decay_length_in_scrape_off_layer`\
  \ and `ion_temperature_decay_length_in_scrape_off_layer`."
