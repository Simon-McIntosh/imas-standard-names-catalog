- name: electrostatic_potential
  kind: scalar
  status: active
  description: Voltage-valued electrostatic potential giving the electric potential
    energy per unit positive charge relative to a chosen electrical reference.
  documentation: 'Electrostatic potential is the electric potential energy per unit
    positive test charge at a specified plasma, probe, or surface location, relative
    to a chosen electrical reference. It includes equilibrium values, localized values
    such as the [midplane electrostatic potential](name:electrostatic_potential_at_midplane)
    and [wall electrostatic potential](name:electrostatic_potential_at_wall), floating
    values, and perturbations such as the [perturbed electrostatic potential](name:perturbed_electrostatic_potential).


    The electrostatic contribution to the electric field is defined by


    $$

    \mathbf{E}_{\rm es} = -\nabla \Phi

    $$


    where $\Phi$ is the electrostatic potential expressed in volts, $\mathbf{E}_{\rm
    es}$ is the electrostatic electric field expressed in volts per meter, and $\nabla$
    is the spatial gradient. The full [electric field](name:electric_field) may additionally
    contain an inductive contribution.


    Only potential differences are gage-independent. A floating value is distinguished
    by the zero-net-current condition at an electrically isolated probe or surface,
    and is not the material wall voltage or an applied wall bias.


    Sign convention: Positive when a positive test charge has greater electrostatic
    potential energy at the specified location than at the chosen electrical reference.'
  unit: V
  physics_domain: magnetohydrodynamics
  links:
  - name:electrostatic_potential_at_midplane
  - name:electrostatic_potential_at_wall
  - name:perturbed_electrostatic_potential
  - name:electric_field
  sources:
  - dd_path: core_profiles/profiles_1d/phi_potential
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-phi_potential
