name: argon_accumulated_gas_injection
status: draft
cocos_transformation_type: one_like
description: Time-integrated total number of argon atoms injected into the vacuum
  vessel from gas-puff systems since discharge initiation.
documentation: "The accumulated argon gas injection quantifies the cumulative particle\
  \ throughput $N_{\\mathrm{Ar}}(t) = \\int_0^t \\Gamma_{\\mathrm{Ar}}(t')\\,dt'$,\
  \ where $\\Gamma_{\\mathrm{Ar}}$ is the instantaneous argon injection rate in particles\
  \ per second. Argon is widely used as a radiative impurity seeding gas to promote\
  \ divertor detachment and distribute the exhaust power load over a larger radiating\
  \ volume; it is preferred over lighter species (e.g., nitrogen) in high-Z wall machines\
  \ because of its favorable radiation efficiency at edge temperatures of 5\u2013\
  50 eV. Typical accumulated values range from $10^{18}$ atoms for brief trace-injection\
  \ experiments to $10^{21}$ atoms for long-pulse, heavily seeded discharges. The\
  \ dimensionless unit (1) reflects a pure particle count. Measured by integrating\
  \ calibrated piezoelectric valve flow-rate signals or by mass-spectrometric partial-pressure\
  \ monitoring in the sub-divertor volume. See also the instantaneous rate `argon_gas_injection_rate`\
  \ and the pre-discharge fill `argon_prefill_gas_injection`."
