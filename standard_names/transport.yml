- name: toroidal_component_of_non_inductive_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the current density driven by all non-inductive
    mechanisms, evaluated from the full particle distribution function. This includes
    neutral-beam-driven, wave-driven (e.g., electron-cyclotron current drive, lower-hybrid
    current drive), and bootstrap contributions, together with the associated electron
    and thermal-ion back-currents. Positive when directed in the direction of increasing
    toroidal angle.
  documentation: "The non-inductive toroidal current density $J_{\\phi,\\mathrm{ni}}$\
    \ is the $\\hat{\\phi}$-component of the current density arising from all drive\
    \ mechanisms that do not depend on the inductive toroidal electric field, expressed\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ coordinate system where $\\\
    phi$ increases counter-clockwise when viewed from above ($+\\hat{Z}$).\n\nFrom\
    \ a kinetic perspective, the quantity is obtained by integrating the toroidal\
    \ projection of the particle flux over the full distribution function $f_s$ for\
    \ every species $s$:\n\n$$J_{\\phi,\\mathrm{ni}} = \\sum_s q_s \\int v_\\phi \\\
    , f_{s,\\mathrm{ni}}(\\mathbf{r}, \\mathbf{v}) \\, \\mathrm{d}^3 v$$\n\nwhere\
    \ $f_{s,\\mathrm{ni}}$ is the portion of the distribution function attributable\
    \ to non-inductive processes. This decomposition is defined such that the total\
    \ toroidal current density satisfies:\n\n$$J_\\phi = J_{\\phi,\\mathrm{Ohm}} +\
    \ J_{\\phi,\\mathrm{ni}}$$\n\nwith the Ohmic (inductive) component $J_{\\phi,\\\
    mathrm{Ohm}} = \\sigma_\\parallel E_\\phi$ driven by the parallel inductive electric\
    \ field.\n\nThe non-inductive contribution comprises:\n\n- **Neutral-beam-driven\
    \ current**: toroidal current carried by fast ions injected via NBI and the collisional\
    \ back-current (drag current) they induce on thermal electrons and ions.\n- **Wave-driven\
    \ current**: toroidal current produced by resonant wave\u2013particle interactions\
    \ in dedicated current-drive schemes (electron-cyclotron current drive, lower-hybrid\
    \ current drive, ion-cyclotron current drive, etc.).\n- **Bootstrap current**:\
    \ self-generated current arising from radial pressure gradients and trapped-particle\
    \ dynamics in toroidal geometry.\n\nEach contribution inherently includes the\
    \ back-currents (drag currents) of electrons and thermal ions that enforce ambipolarity\
    \ and momentum conservation.\n\nTypical magnitudes in auxiliary-heated tokamak\
    \ plasmas range from $\\sim 10^4$ A m$^{-2}$ in the periphery or weakly driven\
    \ scenarios to $\\sim 10^7$ A m$^{-2}$ near the deposition peak of high-power\
    \ current-drive experiments. The radial profile shape depends sensitively on the\
    \ deposition geometry and the pressure gradient profile.\n\nSign convention: Positive\
    \ when $J_{\\phi,\\mathrm{ni}}$ is directed in the direction of increasing toroidal\
    \ angle $\\phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_total_driven_current_density
  - name:toroidal_component_of_total_current_density_due_to_full_particle_distribution
  - name:toroidal_component_of_current_density
  constraints: []
  sources:
