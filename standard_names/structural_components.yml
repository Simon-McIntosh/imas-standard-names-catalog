- name: volume_fraction_of_structural_unit_material
  kind: scalar
  status: draft
  description: Volume fraction of each constituent material within a structural unit,
    used to compute homogenized material properties for neutronics and thermal analysis.
  documentation: "The volume fraction $f_i$ of the $i$-th material in a structural\
    \ unit is defined as $f_i = V_i / V_{\\rm unit}$, where $V_i$ is the volume occupied\
    \ by material $i$ and $V_{\\rm unit}$ is the total unit volume, with the constraint\
    \ $\\sum_i f_i = 1$. This quantity is essential for homogenizing material properties\
    \ \u2014 such as thermal conductivity, density, and neutron cross-sections \u2014\
    \ across heterogeneous structural zones in breeding blankets, shields, and cryostat\
    \ assemblies. Typical structural units in fusion reactor components contain two\
    \ to five distinct materials (e.g., steel, water coolant, tungsten, beryllium\
    \ multiplier, lithium ceramic breeder), with individual volume fractions spanning\
    \ the full range $(0, 1)$ depending on design. Volume fractions are generally\
    \ specified as engineering design inputs derived from computer-aided design models\
    \ or neutronic homogenization codes rather than measured directly. The closely\
    \ related quantity [material_volume_fraction](name:material_volume_fraction) captures\
    \ the same physical concept and should be consulted for context on the catalog\
    \ convention."
  unit: '1'
  physics_domain: structural_components
  links:
  - name:material_volume_fraction
  constraints: []
  sources:
  - id: dd:cryostat/description_2d/cryostat/unit/material_volume_fraction
    dd_path: cryostat/description_2d/cryostat/unit/material_volume_fraction
    status: composed
- name: volume_of_lead_lithium_in_breeding_blanket
  kind: scalar
  status: draft
  description: Total volume of liquid lead-lithium alloy contained within a breeding
    blanket, defined as the net interior volume of all PbLi-wetted cavities and flow
    channels bounded by the blanket structural envelope at a given operational state.
  documentation: "The volume $V_\\mathrm{PbLi}$ is defined by the scalar integral\n\
    $$V_\\mathrm{PbLi} = \\int_{\\Omega_\\mathrm{PbLi}} dV,$$\nwhere $\\Omega_\\mathrm{PbLi}$\
    \ is the union of all subdomains within the breeding blanket structural envelope\
    \ that are occupied by the PbLi alloy in its nominal liquid state. The integration\
    \ is performed in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$\
    \ is major radius from the machine symmetry axis and $Z$ is vertical height.\n\
    \n**Integration boundary.** The domain $\\Omega_\\mathrm{PbLi}$ is bounded by\
    \ the wetted inner surfaces of the blanket first wall, side walls, back plate,\
    \ and manifold structures up to the primary coolant or vacuum interfaces. It excludes\
    \ structural material volumes, coolant passages carrying a non-PbLi fluid, and\
    \ any external piping, ancillary loops, or storage vessels outside the blanket\
    \ module boundary.\n\n**Material context.** The PbLi alloy is a eutectic-composition\
    \ liquid metal (approximately Pb$_{83}$Li$_{17}$ in atomic fraction at the eutectic\
    \ point, though specific designs may deviate). Its density at typical operating\
    \ temperatures of 300\u2013550\xB0C is approximately 9,500\u20139,900 kg m$^{-3}$,\
    \ and its melting point is near 235\xB0C.\n\n**Coupled quantities.** Knowledge\
    \ of $V_\\mathrm{PbLi}$ is prerequisite for:\n\n1. *Fuel-cycle tritium inventory:*\
    \ The dissolved tritium content is\n$$N_T = c_T^\\mathrm{vol} \\, V_\\mathrm{PbLi},$$\n\
    where $c_T^\\mathrm{vol}$ (mol m$^{-3}$) is the volumetric tritium concentration\
    \ in the liquid PbLi.\n\n2. *Neutronics:* $V_\\mathrm{PbLi}$ determines the macroscopic\
    \ quantities of $^6$Li and Pb available for the breeding reaction $^6\\mathrm{Li}(n,\\\
    alpha)T$ and neutron multiplication, entering neutron transport calculations that\
    \ yield the tritium breeding ratio.\n\n3. *Thermal-hydraulics:* Integration of\
    \ the volumetric nuclear heating rate $\\dot{q}$ (W m$^{-3}$) over $\\Omega_\\\
    mathrm{PbLi}$ gives the total nuclear heating power deposited in the PbLi loop.\n\
    \n**Typical values.** For a single outboard blanket module in DEMO-class tokamak\
    \ designs, $V_\\mathrm{PbLi}$ ranges from approximately 0.1 m$^3$ to several cubic\
    \ meters depending on blanket concept and module geometry. A complete reactor\
    \ blanket (all modules summed) may contain on the order of 300\u2013400 m$^3$\
    \ of PbLi.\n\nThe quantity is a non-negative scalar representing the aggregate\
    \ PbLi-filled volume summed over all subregions of the blanket."
  unit: m^3
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio
  - name:nuclear_heating_power_of_breeding_blanket
  - name:volume_of_pb_li_in_breeding_blanket
  constraints: []
  sources:
  - id: dd:breeding_blanket/pb_li_volume
    dd_path: breeding_blanket/pb_li_volume
    status: composed
