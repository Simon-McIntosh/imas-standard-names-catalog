- name: z_component_of_shatter_cone_minor_unit_vector
  kind: scalar
  status: draft
  description: Vertical (Z-axis) component of the minor unit vector that defines the
    shatter cone orientation of a Shattered Pellet Injector in the right-handed Cartesian
    $(x, y, z)$ frame.
  documentation: 'The minor unit vector of the SPI shatter cone, $\hat{e}_{\rm minor}$,
    lies perpendicular to the cone axis and spans the minor semi-axis of the elliptical
    fragment distribution cross-section. Its $z$-component, $\hat{e}_{\rm minor} \cdot
    \hat{z}$, quantifies how much of this minor axis projects onto the vertical direction
    in the right-handed Cartesian $(x, y, z)$ frame, where $\hat{z}$ is the vertical
    unit vector. Together with [x_component_of_shatter_cone_minor_unit_vector](name:x_component_of_shatter_cone_minor_unit_vector)
    and [y_component_of_shatter_cone_minor_unit_vector](name:y_component_of_shatter_cone_minor_unit_vector),
    this component fully resolves the [shatter_cone_minor_unit_vector](name:shatter_cone_minor_unit_vector)
    into Cartesian coordinates. The trio of components must satisfy $\hat{e}_{\rm
    minor,x}^2 + \hat{e}_{\rm minor,y}^2 + \hat{e}_{\rm minor,z}^2 = 1$. The minor
    vector is orthogonal to both the cone axis direction and the [z_component_of_shatter_cone_major_unit_vector](name:z_component_of_shatter_cone_major_unit_vector)
    family; the two transverse unit vectors together parameterize the elliptical cone
    cross-section. Values are dimensionless and bounded within $[-1, 1]$.


    Sign convention: Positive when the minor unit vector has a component in the $+z$
    (upward vertical) direction.'
  unit: '1'
  physics_domain: plant_systems
  links:
