name: gyrokinetic_eigenmode_normalized_gyrocenter_parallel_current_density_moment_bessel_1
status: draft
cocos_transformation_type: one_like
description: Normalized parallel current density moment of the perturbed gyrocenter
  distribution weighted by $J_1(k_\perp \rho_s)$ for a gyrokinetic eigenmode.
documentation: "This quantity is the velocity-space integral $\\hat{j}_{\\parallel,J_1}\
  \ = \\int J_1(k_\\perp \\rho_s) \\, v_\\parallel \\, \\delta f_{\\mathrm{gc}} \\\
  , d^3v \\, / \\, (n_{\\mathrm{ref}} v_{\\mathrm{th,ref}})$, where $J_1$ is the first-order\
  \ Bessel function of the first kind, $k_\\perp$ is the perpendicular wavenumber,\
  \ $\\rho_s = v_\\perp / \\Omega_{c,s}$ the species Larmor radius, $v_\\parallel$\
  \ the parallel velocity, $\\delta f_{\\mathrm{gc}}$ the perturbed gyrocenter distribution,\
  \ $n_{\\mathrm{ref}}$ the reference density, and $v_{\\mathrm{th,ref}}$ the reference\
  \ thermal speed. The $J_1$ weighting captures the next-order finite-Larmor-radius\
  \ coupling between perturbed magnetic-field fluctuations (particularly $\\delta\
  \ B_\\parallel$) and the parallel current; it appears in the compressional Amp\xE8\
  re equation of electromagnetic gyrokinetics. Typical normalized amplitudes are small\
  \ compared with the $J_0$-weighted moment at low $k_\\perp \\rho_s$ but become significant\
  \ in short-wavelength regimes such as electron-temperature-gradient (ETG) turbulence.\
  \ See also the $J_0$-weighted and unweighted gyrocenter parallel current density\
  \ moments."
