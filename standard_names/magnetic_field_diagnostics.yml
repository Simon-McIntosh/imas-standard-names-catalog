- name: voltage_of_flux_loop
  kind: scalar
  status: active
  description: Voltage of a flux loop is the direct, unintegrated terminal voltage
    measured across the sensor. It is induced by the time rate of change of the oriented
    magnetic flux threading the loop and is related to that flux by Faraday's law.
  documentation: 'Voltage of a flux loop is the signed terminal potential difference
    produced when the magnetic flux linked by a conducting loop changes in time. It
    is the direct, unintegrated sensor output: the measured voltage itself, before
    conversion to magnetic flux by time integration, offset removal, or calibration.


    For an oriented surface $S$ bounded by the loop, the flux-loop voltage is defined
    by Faraday''s law:


    $$

    V(t) = -\frac{d\Phi(t)}{dt}, \qquad \Phi(t)=\int_S \mathbf{B}(\mathbf{x},t)\cdot\hat{\mathbf{n}}\,dA

    $$


    where $V$ is the terminal voltage in volts, $t$ is time in seconds, $\Phi$ is
    the oriented magnetic flux in webers, $\mathbf{B}$ is the magnetic flux density
    in tesla, $\mathbf{x}$ is position, $\hat{\mathbf{n}}$ is the chosen unit normal
    to the surface, and $dA$ is an area element in square meters. The chosen $\hat{\mathbf{n}}$
    defines positive flux; the corresponding positive circulation around the loop
    is given by the right-hand rule, and reversing $\hat{\mathbf{n}}$ or swapping
    the terminal polarity reverses the reported sign.


    The voltage is measured with a high-impedance differential input across the two
    loop terminals so that the sensor minimally loads the induced electromotive force.
    Recovering flux requires choosing the polarity and an integration constant: with
    the equation''s polarity, $\Phi(t)=\Phi(t_0)-\int_{t_0}^{t} V(t'')\,dt''$, where
    $t_0$ is the reference time and $\Phi(t_0)$ is the integration constant. For equilibrium
    or shape constraints, this integrated flux may be used as a local constraint on
    [poloidal magnetic flux at a sensor attachment point](name:poloidal_magnetic_flux_at_sensor_attachment_point);
    the [area of the flux loop](name:area_of_flux_loop) sets the scale for converting
    a flux change to an average normal-field change.


    The magnitude scales with linked area and field slew rate, approximately as $|V|\sim
    A_\mathrm{eff}|dB_n/dt|$ for a nearly uniform normal field over effective area
    $A_\mathrm{eff}$, where $A_\mathrm{eff}$ is in square meters and $B_n$ is the
    magnetic field component along $\hat{\mathbf{n}}$ in tesla. Representative operating
    amplitudes are often 10^-3-10 V, but near-zero values occur during slowly varying
    field intervals and larger voltages can occur for large loops or rapid magnetic
    changes; the usable range is normally set by sensor area, bandwidth, and digitizer
    range.


    Sign convention: Positive when the designated positive terminal is at higher electric
    potential than the designated negative terminal; with the chosen loop normal defining
    positive magnetic flux by the right-hand rule, this corresponds through $V=-d\Phi/dt$
    to a decreasing positive flux through the loop.'
  unit: V
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_flux_loop
  - name:voltage_of_poloidal_magnetic_field_probe
  - name:voltage_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: magnetics/flux_loop/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-flux_loop-voltage
    dd_documentation:
      leaf: Measured voltage between the loop terminals
      parent_path: magnetics/flux_loop
      parent: Flux loops; partial flux loops can be described
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: "Measured voltage between the terminals of a flux loop sensor in\
        \ the magnetics diagnostic. This raw signal is time-integrated to obtain the\
        \ magnetic flux (\u03A6) through the loop, used in equilibrium reconstruction\
        \ and plasma shape control."
      kind: llm
- name: voltage_of_poloidal_magnetic_field_probe
  kind: scalar
  status: active
  description: Terminal voltage induced at the terminals of a poloidal magnetic field
    probe coil by the time variation of the local poloidal magnetic field component
    threading the coil windings.
  documentation: 'The terminal voltage of a poloidal magnetic field probe is the raw
    inductive electrical signal generated when the poloidal magnetic field component
    at the sensor location changes with time. It is the primary electrical observable
    from which the local poloidal field is derived during post-processing.


    For a coil with $N$ turns and effective cross-sectional area $A$ per turn, Faraday''s
    law gives:


    $$

    V = -N A \frac{dB_p}{dt}

    $$


    where $B_p$ is the poloidal magnetic field component along the probe''s sensitive
    axis, $N$ is the algebraic turn count encoding the winding direction, and $A$
    is the effective [area of each turn](name:area_of_poloidal_magnetic_field_probe).


    The raw voltage is time-integrated in post-processing to recover the instantaneous
    $B_p$, with corrections for resistive losses and signal drift. Arrays of poloidal
    field probes distributed around the vacuum vessel provide the boundary field measurements
    essential for equilibrium reconstruction and real-time plasma shape control. The
    directly analogous signal for probes oriented to sense the toroidal field is [voltage_of_toroidal_magnetic_field_probe](name:voltage_of_toroidal_magnetic_field_probe);
    the complement for flux-enclosed measurements is [voltage_of_flux_loop](name:voltage_of_flux_loop).
    The probe''s spatial location entering the field derivation is given by major_radius_of_poloidal_magnetic_field_probe.


    Sign convention: Positive when the poloidal magnetic flux threading the coil in
    the direction of the probe''s positive sensitive-axis normal is decreasing with
    time.'
  unit: V
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_poloidal_magnetic_field_probe
  - name:voltage_of_toroidal_magnetic_field_probe
  - name:voltage_of_flux_loop
  sources:
  - dd_path: magnetics/b_field_pol_probe/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-b_field_pol_probe-voltage
    dd_documentation:
      leaf: Voltage on the coil terminals
      parent_path: magnetics/b_field_pol_probe
      parent: Poloidal field probes
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Voltage measured at the terminals of a poloidal field (Bp) probe
        coil. The raw electrical signal from which the local magnetic field is derived
        after accounting for coil geometry and turns.
      kind: llm
- name: voltage_of_toroidal_magnetic_field_probe
  kind: scalar
  status: active
  description: Terminal voltage of a toroidal magnetic field probe coil, induced by
    the time variation of the local toroidal magnetic field component threading the
    coil windings.
  documentation: 'A toroidal magnetic field probe is a pickup coil wound to sense
    the toroidal component of the magnetic field at a specific location. The terminal
    voltage is the raw inductive signal produced as the local toroidal field $B_\phi$
    evolves in time.


    The coil voltage follows from Faraday''s law of induction:


    $$

    V = -N A \frac{dB_\phi}{dt}

    $$


    where $N$ is the number of turns and $A$ is the effective cross-sectional area
    per turn. Time-integrating the voltage signal and dividing by the coil sensitivity
    $NA$ recovers the local toroidal field value; the geometric parameters are provided
    by count_of_toroidal_magnetic_field_probe and [area_of_toroidal_magnetic_field_probe](name:area_of_toroidal_magnetic_field_probe).


    Probes are mounted on the vacuum vessel wall or plasma-facing surfaces and sampled
    on fast analog-to-digital converters to capture the full temporal evolution of
    the toroidal field. The analogous measurement for the poloidal field component
    is given by [voltage_of_poloidal_magnetic_field_probe](name:voltage_of_poloidal_magnetic_field_probe).


    Sign convention: Positive when $dB_\phi/dt > 0$ for a coil wound in the direction
    of increasing toroidal angle $\phi$.'
  unit: V
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_toroidal_magnetic_field_probe
  - name:voltage_of_poloidal_magnetic_field_probe
  sources:
  - dd_path: magnetics/b_field_phi_probe/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-b_field_phi_probe-voltage
    dd_documentation:
      leaf: Voltage on the coil terminals
      parent_path: magnetics/b_field_phi_probe
      parent: Toroidal field probes
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: "Voltage measured at the terminals of a toroidal magnetic field\
        \ (B_\u03C6) probe coil in the magnetics diagnostic. The raw coil voltage\
        \ is integrated and calibrated to derive the local toroidal magnetic field\
        \ component."
      kind: llm
- name: poloidal_angle_of_toroidal_magnetic_field_probe
  kind: scalar
  status: active
  description: "Poloidal angle of a toroidal magnetic-field probe\u2019s sensitive-axis\
    \ normal in the poloidal cross-section of the right-handed cylindrical (R, \u03C6\
    , Z) frame, measured clockwise from the outward radial direction."
  documentation: 'The poloidal angle of a toroidal magnetic-field probe is the angular
    coordinate of its sensitive-axis normal in a poloidal cross-section of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is the orientation form of [poloidal angle](name:poloidal_angle),
    not the spatial angle of the probe location.


    For the probe''s sensitive-axis unit normal vector $\hat{\mathbf n}$, the angle
    is


    $$

    \theta_n=\operatorname{atan2}(-n_Z,n_R)\pmod{2\pi}

    $$


    where $\theta_n$ is the poloidal angle, and $n_R$ and $n_Z$ are the components
    of $\hat{\mathbf n}$ along the cylindrical $\hat{R}$ and $\hat{Z}$ directions.


    This quantity defines the coil orientation used to relate the probe''s normal
    to the local magnetic field. Unlike [poloidal angle of a measurement position](name:poloidal_angle_of_measurement_position),
    it does not locate the probe; together with [toroidal angle of a toroidal magnetic-field
    probe](name:toroidal_angle_of_toroidal_magnetic_field_probe), it specifies the
    angular orientation of the sensitive-axis normal.


    Sign convention: Positive when the sensitive-axis normal is tilted clockwise from
    the outward $+R$ direction toward $-Z$ when viewed from the $+\phi$ direction.'
  unit: rad
  physics_domain: magnetic_field_diagnostics
  links:
  - name:poloidal_angle_of_measurement_position
  - name:toroidal_angle_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: magnetics/b_field_phi_probe/poloidal_angle
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-b_field_phi_probe-poloidal_angle
    dd_documentation:
      leaf: Angle of the sensor normal vector (vector parallel to the the axis of
        the coil, n on the diagram) with respect to horizontal plane (clockwise theta-like
        angle). Zero if sensor normal vector fully in the horizontal plane and oriented
        towards increasing major radius. Values in [0 , 2Pi]
      parent_path: magnetics/b_field_phi_probe
      parent: Toroidal field probes
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "Poloidal angle of the normal vector of a toroidal field (B_\u03C6\
        ) probe sensor with respect to the horizontal plane, defining the coil orientation.\
        \ Used to project the measured magnetic signal onto the correct vector component\
        \ for equilibrium reconstruction."
      kind: llm
