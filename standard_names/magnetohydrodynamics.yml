- name: plasma_temperature
  kind: scalar
  status: draft
  description: Effective temperature of the plasma in a fluid or MHD description,
    representing the average thermal kinetic energy per degree of freedom of the combined
    charged particle population.
  documentation: 'The plasma temperature is a fundamental thermodynamic state variable
    in fluid and single-fluid MHD models, quantifying the mean random kinetic energy
    of the charged particle population. In a single-fluid description it is linked
    to [thermal pressure] via the equation of state


    $$

    p = n k_B T

    $$


    where $p$ is the scalar pressure, $n$ is the total particle number density, and
    $k_B$ is the Boltzmann constant.


    In multi-species plasmas an effective plasma temperature may be obtained as a
    density-weighted combination of electron and ion contributions; applications requiring
    species resolution use explicitly qualified forms such as particle_temperature
    or [neutral_temperature](name:neutral_state_temperature). This quantity also appears
    as the equilibrium background in linear MHD stability analysis, where its first-order
    perturbation is represented by the complex eigenfunction [perturbed_plasma_temperature](name:perturbed_plasma_temperature),
    encoding the amplitude and phase of the temperature fluctuation for a specified
    toroidal Fourier harmonic. The total isotropic pressure of the plasma, including
    contributions summed over all species, is captured by [plasma_pressure](name:plasma_pressure).'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:neutral_state_temperature
  - name:perturbed_plasma_temperature
  - name:plasma_pressure
  sources:
  - id: derived:plasma_temperature
    status: composed
- name: perturbed_plasma_temperature
  kind: scalar
  status: draft
  description: Complex first-order eigenfunction of the plasma temperature perturbation
    in linear MHD stability analysis, encoding the amplitude and phase of the temperature
    fluctuation for a specified toroidal Fourier harmonic.
  documentation: 'In linear MHD stability analysis, the plasma temperature is expanded
    about a background equilibrium as $T = T_0 + \delta T\,e^{i(n\phi - \omega t)}$,
    where $T_0$ is the equilibrium temperature, $n$ is the toroidal mode number, $\phi$
    is the toroidal angle, and $\omega$ is the complex eigenfrequency. The quantity
    $\delta T$ is a complex-valued eigenfunction that simultaneously encodes the local
    amplitude and spatial phase of the temperature fluctuation across the plasma cross-section.


    The principal decomposition is:


    $$

    T(\mathbf{r}, t) = T_0(\mathbf{r}) + \delta T(\mathbf{r})\,e^{i(n\phi - \omega
    t)}

    $$


    where $\delta T(\mathbf{r})$ is the complex position-dependent eigenfunction.
    Its in-phase and quadrature components are resolved by [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part)
    and [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part),
    respectively.


    Because eigenfunction normalization is arbitrary up to a complex scale factor,
    absolute magnitudes carry no independent physical significance; only ratios among
    perturbed-field components or the spatial mode structure are physically meaningful.
    The perturbation is evaluated from equilibrium-based linear MHD stability calculations
    using the background described by [plasma_temperature](name:plasma_temperature),
    with toroidal periodicity indexed by the [toroidal_mhd_mode_number](name:toroidal_mhd_mode_number).'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_real_part
  - name:perturbed_plasma_temperature_imaginary_part
  - name:plasma_temperature
  - name:toroidal_mhd_mode_number
  arguments:
  - name: plasma_temperature
    operator: perturbed
    operator_kind: qualifier
- name: perturbed_plasma_temperature_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex perturbed plasma temperature eigenfunction
    for a linear MHD mode.
  documentation: 'Perturbed plasma temperature imaginary part is the quadrature component
    of the complex first-order temperature perturbation eigenfunction of a linear
    MHD mode. Together with the [real part](name:perturbed_plasma_temperature_real_part),
    it forms the complex temperature eigenfunction; it sets the local phase relative
    to a chosen real reference and is not a separate thermodynamic temperature.


    For a toroidal Fourier harmonic, the convention used here represents the physical
    temperature perturbation in the right-handed cylindrical $(R, \phi, Z)$ system
    as:


    $$

    \delta T(R, \phi, Z, t) = \operatorname{Re}\left\{\left[\delta T_\mathrm{R}(R,
    Z) + i\,\delta T_\mathrm{I}(R, Z)\right]\exp\left[i(n\phi - \omega t)\right]\right\}

    $$


    where $\delta T_\mathrm{I}$ is this quantity, $\delta T_\mathrm{R}$ is the real
    part, $n$ is the integer toroidal mode number, and $\omega$ is the angular eigenfrequency.
    Here $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height. The local complex
    amplitude is $|\tilde{T}| = \sqrt{\delta T_\mathrm{R}^2 + \delta T_\mathrm{I}^2}$,
    and the local phase is $\alpha = \operatorname{atan2}(\delta T_\mathrm{I}, \delta
    T_\mathrm{R})$ radians; the quadrant-aware $\operatorname{atan2}$ form is required
    to distinguish all phases.


    In practice, $\delta T_\mathrm{I}$ is computed as one component of a linear MHD
    eigenvector, coupled to displacement, pressure, density, and electromagnetic perturbations.
    Temperature fluctuation measurements can constrain comparable amplitude and phase
    information when projected onto the same toroidal harmonic, but a phase reference
    is needed to separate real and imaginary components.


    A homogeneous linear eigenmode can be multiplied by an arbitrary complex constant,
    so the absolute eV scale and the split between real and imaginary parts are meaningful
    only after an amplitude normalization and global phase reference are fixed. For
    normalized perturbation levels $|\tilde{T}|/T_0$ of 10^-4-10^-1 and equilibrium
    temperatures of 100-20000 eV, component magnitudes of about 0.01-2000 eV are typical
    illustrative values; nodes and phase choices can make this component zero or change
    its sign.


    Sign convention: Positive when, for the Fourier convention above, the local eigenfunction
    phase returned by $\operatorname{atan2}(\delta T_\mathrm{I}, \delta T_\mathrm{R})$
    lies between $0$ and $\pi$ radians relative to the chosen real-axis phase reference
    after the eigenmode phase and normalization have been fixed.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_imaginary_part
  arguments:
  - name: perturbed_plasma_temperature
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/imaginary
    status: composed
- name: perturbed_plasma_temperature_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma temperature perturbation
    eigenfunction for a specified toroidal Fourier harmonic in linear MHD stability
    analysis.
  documentation: 'In linear MHD stability analysis, plasma perturbations for a given
    toroidal mode number are expressed as complex spatial eigenfunctions. This quantity
    gives $\text{Re}[\tilde{T}]$, the real part of the complex temperature perturbation
    eigenfunction $\tilde{T}(\mathbf{r})$, encoding the in-phase spatial structure
    of the temperature mode relative to the chosen eigenmode normalization.


    The time-evolving perturbation field is reconstructed from the eigenfunction components
    as:


    $$

    \delta T(\mathbf{r}, t) = \text{Re}\!\left[\tilde{T}(\mathbf{r})\, e^{i(n\phi
    - \omega t)}\right]

    $$


    where $n$ is the toroidal mode number, $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $\omega$ is the complex eigenfrequency whose
    imaginary part gives the linear growth or damping rate.


    This component is computed by linear MHD stability solvers as one element of a
    complete set of perturbed field eigenfunctions; together with the [imaginary part](name:perturbed_plasma_temperature_imaginary_part),
    it fully specifies the complex eigenfunction $\tilde{T}$. Analogous decompositions
    apply to [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part).
    The absolute magnitude of $\text{Re}[\tilde{T}]$ is set by the eigenmode normalization
    convention and must be scaled by the physical mode amplitude to represent an actual
    temperature perturbation.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_imaginary_part
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_mass_density_real_part
  arguments:
  - name: perturbed_plasma_temperature
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/temperature_perturbed/real
    status: composed
- name: plasma_velocity
  kind: vector
  status: draft
  description: Mass-weighted bulk center-of-mass velocity vector of the plasma fluid,
    whose projections onto the right-handed cylindrical (R, phi, Z) coordinate directions
    provide the radial, toroidal, vertical, and parallel flow components.
  documentation: 'The plasma velocity is the local center-of-mass (barycentric) flow
    velocity of the bulk plasma, representing the momentum per unit mass carried collectively
    by all plasma species. It is the primary kinematic quantity in single-fluid and
    multi-fluid magnetohydrodynamic descriptions of plasma transport, rotation, and
    momentum confinement.


    The center-of-mass velocity vector is defined as:


    $$

    \mathbf{v}_\mathrm{cm} = \frac{\sum_s m_s n_s \mathbf{v}_s}{\sum_s m_s n_s}

    $$


    where the sum runs over all contributing plasma species $s$, $m_s$ is the species
    mass, $n_s$ is the number density, and $\mathbf{v}_s$ is the mean fluid velocity
    of species $s$.


    The full velocity vector decomposes into projections along the right-handed cylindrical
    $(R, \phi, Z)$ frame: the [radial component](name:radial_plasma_velocity) along
    $\hat{R}$, the [toroidal component](name:toroidal_center_of_mass_velocity) along
    $\hat{\phi}$, the [vertical component](name:vertical_plasma_velocity) along $\hat{Z}$,
    and the [parallel component](name:parallel_plasma_velocity) along the local magnetic-field
    unit vector $\hat{b}$. Individual projections are inferred from Doppler spectroscopy,
    charge-exchange recombination spectroscopy, and motional-Stark-effect diagnostics;
    Mach probes provide parallel-flow access in the scrape-off layer.


    Sign convention: Positive when the velocity vector component points in the direction
    of increasing $R$ (outward), increasing $\phi$ (counter-clockwise viewed from
    above $+\hat{Z}$), or increasing $Z$ (upward) for the respective cylindrical projections.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_plasma_velocity
  - name:toroidal_center_of_mass_velocity
  - name:vertical_plasma_velocity
  - name:parallel_plasma_velocity
  sources:
  - id: derived:plasma_velocity
    status: composed
- name: parallel_plasma_velocity
  kind: scalar
  status: draft
  description: Signed component of the plasma bulk center-of-mass velocity along the
    local magnetic-field direction. The center-of-mass velocity is the mass-weighted
    mean of the contributing species velocities before projection.
  documentation: 'Parallel plasma velocity is the field-aligned component of the plasma
    center-of-mass velocity. The center-of-mass velocity is formed as the mass-weighted
    mean of the contributing species velocities, so this quantity describes bulk plasma
    flow along a magnetic field line rather than the velocity of one selected species.


    It is defined by projecting the center-of-mass velocity onto the local magnetic-field
    unit vector:


    $$

    v_\parallel = \mathbf{v}_{\rm cm}\cdot\hat{\mathbf{b}}, \qquad \hat{\mathbf{b}}
    = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathbf{v}_{\rm cm}$ is the plasma center-of-mass velocity in $\mathrm{m\,s^{-1}}$,
    $\mathbf{B}$ is the local magnetic field in tesla, and $\hat{\mathbf{b}}$ is the
    dimensionless unit vector in the direction of $\mathbf{B}$. Equivalently, $\mathbf{v}_{\rm
    cm}$ may be written as the mass-weighted species mean velocity before the projection
    is applied.


    In practice, this quantity is obtained by determining or modeling the plasma bulk
    velocity and the local magnetic-field direction, then applying the projection.
    Experimental interpretation generally requires a flow-sensitive measurement together
    with magnetic-geometry information, especially when species-resolved measurements
    must be converted into a center-of-mass flow.


    Typical magnitudes are strongly regime dependent: slowly flowing core or edge
    plasmas may have $10^2$-$10^4\ \mathrm{m\,s^{-1}}$, while strongly driven or transient
    field-aligned flows can reach $10^4$-$10^5\ \mathrm{m\,s^{-1}}$ or higher.


    Sign convention: Positive when the plasma center-of-mass velocity has a component
    in the direction of the local magnetic field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:radial_plasma_velocity
  - name:toroidal_plasma_velocity
  - name:vertical_plasma_velocity
  - name:parallel_center_of_mass_velocity
  - name:parallel_particle_velocity
  arguments:
  - name: plasma_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
