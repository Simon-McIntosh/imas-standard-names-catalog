- name: atomic_number
  kind: scalar
  status: active
  description: Nuclear charge number identifying an element by the number of protons
    in its nucleus, independent of isotope and ionization state.
  documentation: 'Atomic number is the intrinsic nuclear-charge identifier of an element
    constituent in an atomic or molecular species. It specifies the element regardless
    of whether the atom is neutral, ionized, or part of an isotope.


    $$

    Z = N_p

    $$


    where $Z$ is the atomic number and $N_p$ is the number of protons in the nucleus.


    This quantity applies to the specified element and is neither summed nor averaged
    over isotopes, ionization states, or molecular constituents. It is distinct from
    ionic charge, which describes the net charge state, and from [atomic mass](name:atomic_mass),
    which distinguishes isotope or constituent mass.


    The same nuclear charge identifies every isotope and ionization state of an element;
    a role-specific instance such as [fast-ion atomic number](name:fast_ion_atomic_number)
    represents this same property for a restricted fast-ion population. When a formula
    contains multiple atoms of the element, [atomic count](name:atomic_count) gives
    the stoichiometric multiplicity separately.'
  unit: '1'
  physics_domain: transport
  links:
  - name:atomic_mass
  - name:atomic_count
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/isotope_ratios/isotope/element/z_n
    version: 4.1.0
  - kind: imas-dd
    ref: spi/injector/fragmentation_gas/species/z_n
    version: 4.1.0
- name: beryllium_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the beryllium ion population evaluated at
    the magnetic axis is the local beryllium-ion count per physical volume there,
    summed over all beryllium ionization states.
  documentation: 'Particle number density of the beryllium ion population evaluated
    at the magnetic axis is the local beryllium-ion count per physical volume at that
    location, summed over all beryllium ionization states. It represents beryllium
    ions specifically, rather than neutral beryllium, electrons, or other ion species.


    The defining relation is


    $$

    n_{\mathrm{Be},\mathrm{axis}} = \sum_Z n_{\mathrm{Be}^{Z+},\mathrm{axis}} = \left.\frac{dN_{\mathrm{Be}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{Be},\mathrm{axis}}$ is the total beryllium-ion number density
    at the magnetic axis, $n_{\mathrm{Be}^{Z+},\mathrm{axis}}$ is the number density
    of beryllium ions in charge state $Z$, $Z$ is the ionic charge-state number, $N_{\mathrm{Be}}$
    is the number of beryllium ions included in the sum, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete beryllium-ion population at that location and is summed
    over all beryllium ionic charge states. It excludes neutral beryllium and is neither
    a flux-surface or volume integral nor the density of another species.


    This is the beryllium-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). Like [boron density at the
    magnetic axis](name:boron_density_at_magnetic_axis), it is species-resolved while
    retaining charge-state aggregation; it differs from [beryllium density at the
    plasma boundary](name:beryllium_density_at_plasma_boundary) only in its evaluation
    locus.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:boron_density_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/beryllium/value
    version: 4.1.0
- name: boron_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the boron ion population evaluated at the
    magnetic axis is the local boron-ion count per physical volume, summed over all
    boron ionic charge states.
  documentation: 'Particle number density of the boron ion population evaluated at
    the magnetic axis is the local boron-ion count per physical volume at that location.
    It represents boron ions specifically, rather than electrons, neutrals, or another
    plasma population, and is summed over all boron ionic charge states.


    The defining relation is


    $$

    n_{\mathrm{B,axis}} = \left.\frac{dN_{\mathrm{B}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{B,axis}}$ is the boron ion number density at the magnetic axis,
    $N_{\mathrm{B}}$ is the number of boron ions summed over all ionic charge states,
    and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete ionized boron population at that location and excludes
    neutral boron; it is neither a flux-surface or volume integral nor a density for
    another species.


    This is the boron-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It has the same locus and
    aggregation convention as [beryllium density at the magnetic axis](name:beryllium_density_at_magnetic_axis),
    but represents boron ions rather than beryllium ions. It differs from [boron density
    at the internal transport barrier](name:boron_density_at_internal_transport_barrier),
    which is evaluated at a different plasma location.'
  unit: m^-3
  physics_domain: transport
