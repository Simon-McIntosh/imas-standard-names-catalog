- name: flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Flux-surface average of the squared toroidal-flux-coordinate gradient
    magnitude divided by the squared local magnetic-field magnitude, a metric coefficient
    for equilibrium geometry.
  documentation: 'This coefficient describes the flux-surface-averaged geometric weighting
    of a toroidal-flux radial coordinate by the inverse square of the local magnetic-field
    magnitude.


    The defining relation is


    $$

    \mathcal{G}_B = \left\langle \frac{|\nabla \rho_{\mathrm{tor}}|^2}{|\mathbf{B}|^2}
    \right\rangle_{\mathrm{FS}}

    $$


    where $\mathcal{G}_B$ is the averaged metric coefficient, $\rho_{\mathrm{tor}}$
    is the toroidal-flux radial coordinate, $\nabla$ is the spatial gradient, $\mathbf{B}$
    is the magnetic-field vector, and $\langle\cdot\rangle_{\mathrm{FS}}$ denotes
    the average over a magnetic flux surface.


    The quantity applies to nested equilibrium magnetic flux surfaces and uses the
    average of the pointwise ratio, not the ratio of separately averaged numerator
    and denominator. It is nonnegative because both the gradient magnitude and magnetic-field
    magnitude are squared.


    It is the flux-surface-averaged form of the local [ratio of squared toroidal-flux-coordinate
    gradient magnitude to squared magnetic-field magnitude](name:ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_magnetic_field_magnitude).
    It shares the gradient-squared geometric factor with the [flux-surface-averaged
    squared toroidal-flux-coordinate gradient magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
    but additionally applies the pointwise inverse-square magnetic-field weighting
    before averaging. It is distinct from the corresponding major-radius denominator
    variant, [flux-surface-averaged ratio of squared toroidal-flux-coordinate gradient
    magnitude to squared major radius](name:flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius).'
  unit: T^-2
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude
  - name:flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius
