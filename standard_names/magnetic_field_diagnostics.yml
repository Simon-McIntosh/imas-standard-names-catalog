- name: area_of_flux_loop
  kind: scalar
  status: active
  description: The effective area of a flux loop is the non-negative field-to-flux
    sensitivity area of the sensor, including the aperture enclosed by each turn,
    the number of turns, and calibration factors. It converts a spatially averaged
    magnetic-field component normal to the loop aperture into total linked magnetic
    flux.
  documentation: 'The effective area of a flux loop is the non-negative field-to-flux
    sensitivity factor of the sensor. It represents the aperture area enclosed by
    each turn, the number of turns, and calibration corrections that make the total
    linked magnetic flux equivalent to a spatially averaged magnetic-field component
    normal to the loop aperture.


    The effective area $A_\mathrm{eff}$ is defined by the relation between linked
    flux and averaged normal field:


    $$

    A_\mathrm{eff} = \frac{\Phi}{\bar{B}_n}

    $$


    where $\Phi$ is the signed magnetic flux threading the loop and $\bar{B}_n$ is
    the spatial average of the magnetic-field component along the chosen loop normal.


    For a specified loop normal and terminal polarity, Faraday''s law gives $V = -d\Phi/dt
    = -A_\mathrm{eff}\,d\bar{B}_n/dt$ when $A_\mathrm{eff}$ is constant. Reversing
    the winding direction or terminal polarity reverses the signed quantities $\Phi$
    and $V$, not the non-negative effective area.


    This quantity is the flux-loop analog of [area_of_poloidal_magnetic_field_probe](name:area_of_poloidal_magnetic_field_probe)
    for magnetic-field probes. It differs from [area_of_rogowski_coil](name:area_of_rogowski_coil),
    which describes coupling to enclosed current rather than linked magnetic flux;
    the corresponding signed circuit response is [voltage_of_flux_loop](name:voltage_of_flux_loop).'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_poloidal_magnetic_field_probe
  - name:area_of_rogowski_coil
  - name:voltage_of_flux_loop
  sources:
  - dd_path: magnetics/flux_loop/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-flux_loop-area
    dd_documentation:
      leaf: Effective area (ratio between flux and average magnetic field over the
        loop)
      parent_path: magnetics/flux_loop
      parent: Flux loops; partial flux loops can be described
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Effective area of a flux loop sensor, defined as the ratio of the
        magnetic flux through the loop to the average magnetic field over the loop.
        Used to convert measured flux to equivalent field in magnetics diagnostics.
      kind: llm
- name: area_of_poloidal_magnetic_field_probe
  kind: scalar
  status: active
  description: "Geometric area enclosed by one turn of a poloidal magnetic-field probe\
    \ coil, setting the winding\u2019s flux sensitivity together with its turn count."
  documentation: 'The poloidal magnetic-field probe area is the geometric surface
    area enclosed by one sensing turn of the coil. It determines the magnetic flux
    coupled to that turn when the field is approximately uniform and normal to the
    enclosed surface.


    The area is defined by


    $$

    A_p = \int_{S_p} dS

    $$


    where $S_p$ is the surface bounded by one coil turn and $dS$ is its differential
    area element. For a uniform normal poloidal field, the linked flux is proportional
    to $N A_p B_p$, where $N$ is the dimensionless turn count and $B_p$ is the poloidal
    magnetic-field component normal to the turn surface.


    This is a one-turn geometric area and does not include the turn-count factor or
    other calibration factors. It is the area parameter underlying the induced [voltage
    of a poloidal magnetic field probe](name:voltage_of_poloidal_magnetic_field_probe)
    and is analogous to the one-turn area of a [toroidal magnetic field probe](name:area_of_toroidal_magnetic_field_probe).'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:voltage_of_poloidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: magnetics/b_field_pol_probe/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-b_field_pol_probe-area
    dd_documentation:
      leaf: Area of each turn of the coil
      parent_path: magnetics/b_field_pol_probe
      parent: Poloidal field probes
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of each turn of a poloidal field (Bp) probe
        coil. Used together with the number of turns to compute the effective flux-sensing
        area of the magnetic pick-up coil for converting measured voltage to magnetic
        field.
      kind: llm
- name: area_of_rogowski_coil
  kind: scalar
  status: active
  description: Area of a Rogowski coil is the effective cross-sectional area linked
    by one sensing turn of the closed winding. It is a geometric area factor; with
    winding turn density it determines the ideal current-sensing sensitivity.
  documentation: 'Area of a Rogowski coil is the effective cross-sectional area linked
    by one sensing turn of a closed Rogowski winding. It is a scalar geometry factor
    of the winding, not the signed current threaded by the coil or the measured coil
    voltage.


    In the ideal uniformly wound limit, the area appears as the non-negative sensitivity
    factor in the linear constitutive relation between coil voltage and enclosed-current
    time derivative:


    $$

    V_R(t) = \sigma \mu_0 n A \frac{d I_\mathrm{enc}}{dt}

    $$


    where $A$ is the Rogowski-coil area, $n$ is the winding turn density along the
    closed winding path, $\mu_0$ is the vacuum permeability, $I_\mathrm{enc}$ is the
    signed [Rogowski-coil current](name:current_of_rogowski_coil) threaded by the
    coil, $V_R$ is the [Rogowski-coil voltage], and $\sigma$ is the sign set by winding
    orientation and terminal polarity.


    The effective area may represent a calibrated equivalent for a real winding with
    finite pitch or nonuniform cross-section, but it remains a per-turn area factor.
    It is in the same geometric-coil-area family as [area of a poloidal magnetic field
    probe](name:area_of_poloidal_magnetic_field_probe) and [area of a toroidal magnetic
    field probe](name:area_of_toroidal_magnetic_field_probe); multiplying by turn
    density, turn number, or path length gives related sensitivity factors, not this
    quantity.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:current_of_rogowski_coil
  - name:area_of_poloidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: magnetics/rogowski_coil/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-rogowski_coil-area
    dd_documentation:
      leaf: Effective area of the loop wrapped around the guiding center. In case
        of multiple layers, sum of the areas of each layer
      parent_path: magnetics/rogowski_coil
      parent: Set of Rogowski coils
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Effective cross-sectional area of a Rogowski coil loop wound around
        a current-carrying conductor. For multi-layer coils, this is the sum of individual
        layer areas, determining the coil's sensitivity to enclosed current.
      kind: llm
- name: area_of_toroidal_magnetic_field_probe
  kind: scalar
  status: active
  description: Cross-sectional area enclosed by one turn of a toroidal magnetic-field
    probe coil, determining its flux sensitivity with the winding turn count.
  documentation: 'The per-turn cross-sectional area of a toroidal magnetic-field probe
    is the geometric area enclosed by one sensing turn and threaded by the local toroidal
    magnetic-field component. It is a non-negative geometric parameter, distinct from
    the total effective area of the complete winding.


    For $N$ identical turns, the ideal effective flux-pickup area is


    $$

    A_{\mathrm{eff}} = N A_{\mathrm{turn}}

    $$


    where $A_{\mathrm{turn}}$ is the area enclosed by one turn, $N$ is the dimensionless
    number of turns, and $A_{\mathrm{eff}}$ is the total linked area. The induced
    [voltage of the toroidal magnetic-field probe](name:voltage_of_toroidal_magnetic_field_probe)
    is proportional to the time derivative of the magnetic flux coupled through this
    effective area. The quantity is analogous to the per-turn area of a [poloidal
    magnetic-field probe](name:area_of_poloidal_magnetic_field_probe), but applies
    to toroidal-field sensing.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
  links:
  - name:voltage_of_toroidal_magnetic_field_probe
  - name:area_of_poloidal_magnetic_field_probe
  sources:
