- name: perpendicular_normalized_particle_perturbed_energy
  kind: scalar
  status: draft
  description: Dimensionless velocity-space moment of the perturbed particle distribution
    weighted by 0.5 times the species mass, the squared perpendicular speed, and the
    total speed squared. It measures the perpendicular-speed-weighted kinetic response
    of a linear gyrokinetic eigenmode relative to the chosen normalization.
  documentation: 'Perpendicular normalized particle perturbed energy is a dimensionless
    moment of the perturbed particle distribution for a species in a linear gyrokinetic
    eigenmode. Its weighting is the total kinetic-energy factor multiplied by squared
    speed perpendicular to the local magnetic field; it is not the product of perpendicular
    kinetic energy and total kinetic energy.


    The normalized moment may be written as


    $$

    M_{\perp E,s} = \frac{1}{N_{\perp E,s}} \int \frac{1}{2} m_s v_\perp^2 v^2 \,
    \delta f_s(\mathbf{v}) \, d^3v

    $$


    where $m_s$ is the species mass, $v_\perp$ is the particle speed perpendicular
    to the local magnetic field, $v^2 = v_\parallel^2 + v_\perp^2$ is the total speed
    squared, $\delta f_s$ is the perturbed particle distribution with units $s^3 m^{-6}$,
    and $d^3v$ has units $m^3 s^{-3}$. The normalization factor $N_{\perp E,s}$ has
    units $kg\,m\,s^{-4}$, matching the unnormalized integral, so that $M_{\perp E,s}$
    has unit 1.


    This quantity is computed from the velocity-space representation of the linear
    eigenfunction by numerical quadrature over $\delta f_s$. It is mainly used to
    compare how strongly different species or modes populate high-perpendicular-speed
    parts of velocity space, relative to the selected eigenmode normalization.


    No device-independent numerical range is physically meaningful for this normalized
    moment. A linear eigenmode can be multiplied by an arbitrary real or complex amplitude,
    and this moment scales by the same factor; therefore only comparisons made with
    the same normalization and eigenfunction phase convention are physically meaningful.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_energy
  - name:parallel_normalized_particle_perturbed_pressure
  - name:normalized_particle_perturbed_energy
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    status: composed
- name: perturbed_gyrocenter_pressure
  kind: scalar
  status: draft
  description: Second velocity-space moment of the perturbed gyrocenter distribution
    function, characterizing the departure of the gyrotropic pressure tensor from
    its equilibrium value in gyrokinetic turbulence. This parent generalizes over
    parallel and perpendicular components and over dimensional or normalized representations.
  documentation: "The perturbed gyrocenter pressure is the perturbed component of\
    \ the gyrotropic pressure tensor, obtained as the second-order velocity-space\
    \ moment of the perturbed gyrocenter distribution function \u03B4f. It represents\
    \ the local deviation of the gyrocenter pressure from the equilibrium pressure\
    \ profile due to electrostatic and electromagnetic fluctuations.\n\nThe dimensional\
    \ form of the pressure moment for a species s is defined by the integral over\
    \ velocity space:\n\n$$\n\\delta p_s = \\int m_s \\, v^2 \\, \\delta f_s \\, d^3v\n\
    $$\n\nwhere $m_s$ is the species mass, $v$ is the velocity magnitude, and $\\\
    delta f_s$ is the perturbed distribution. The moment may be taken along the parallel\
    \ direction ($v_\\parallel$) or perpendicular direction ($v_\\perp$), corresponding\
    \ to $\\delta p_{\\parallel,s}$ and $\\delta p_{\\perp,s}$ respectively. Specific\
    \ standard names provide normalized versions where the moment is divided by a\
    \ reference thermal pressure $n_\\mathrm{ref} T_\\mathrm{ref}$, yielding a dimensionless\
    \ quantity.\n\nThis moment is computed in gyrokinetic simulations and eigenmode\
    \ solvers as a diagnostic of the pressure response to turbulence. It complements\
    \ the perturbed gyrocenter density in the low-order moment hierarchy.\n\nTypical\
    \ values in the core of a medium-size tokamak range from 0.1\u201310% of the equilibrium\
    \ pressure for quasilinear turbulence levels, corresponding to $\\delta p / p_\\\
    mathrm{eq} \\sim 10^{-3}$\u2013$10^{-1}$ for dimensional forms, or equivalent\
    \ dimensionless values of $10^{-4}$\u2013$10^{-2}$ relative to the reference pressure.\n\
    \nSign convention: Positive when the perturbed gyrocenter pressure represents\
    \ a local enhancement above the equilibrium pressure profile."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_pressure
  - name:normalized_gyrocenter_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_density
  - name:effective_energy
  arguments:
  - name: gyrocenter_pressure
    operator: perturbed
    operator_kind: qualifier
  sources:
  - id: derived:perturbed_gyrocenter_pressure
    status: composed
- name: normalized_gyrocenter_perturbed_pressure
  kind: vector
  status: draft
  description: Two-component vector of the normalized pressure moment of the perturbed
    gyrocenter distribution, with components parallel and perpendicular to the local
    magnetic field, each normalized to a reference thermal pressure.
  documentation: 'The normalized gyrocenter perturbed pressure is a vector quantity
    collecting the dimensionless parallel and perpendicular thermal-pressure responses
    of the non-equilibrium part of the gyrocenter distribution function $\delta f_s$
    for a single plasma species, normalized to a reference thermal pressure $p_{\mathrm{ref}}
    = n_{\mathrm{ref}} T_{\mathrm{ref}}$. It generalizes the scalar gyrocenter_perturbed_pressure
    to the full anisotropic pressure decomposition along and across the local magnetic
    field direction $\hat{b}$.


    The two components are defined as velocity-space integrals:


    $$

    \hat{p}_{\parallel/\perp,\,s} = \frac{m_s}{p_{\mathrm{ref}}} \int w_{\parallel/\perp}\,
    \delta f_s\, d^3v

    $$


    where $m_s$ is the species mass, the weight $w_\parallel = v_\parallel^2$ defines
    the parallel component (see [parallel_normalized_gyrocenter_perturbed_pressure](name:parallel_normalized_gyrocenter_perturbed_pressure))
    and $w_\perp = v_\perp^2/2$ defines the perpendicular gyrotropic component (see
    [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)),
    with $v_\parallel$ and $v_\perp$ the velocity projections along and across $\hat{b}$
    respectively.


    This vector is computed in gyrokinetic simulations as part of the velocity-space
    moment hierarchy characterizing pressure anisotropy driven by electromagnetic
    fluctuations. Gyroaveraged variants incorporating finite-Larmor-radius corrections
    are provided by perpendicular_normalized_gyrocenter_gyroaveraged_pressure and
    parallel_normalized_gyrocenter_gyroaveraged_pressure.


    Sign convention: Positive when the perturbed gyrocenter distribution function
    increases the respective pressure moment above the equilibrium reference value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_gyrocenter_perturbed_pressure
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: perturbed_gyrocenter_pressure
    operator: normalized
    operator_kind: qualifier
  sources:
  - id: derived:normalized_gyrocenter_perturbed_pressure
    status: composed
- name: parallel_normalized_gyrocenter_perturbed_pressure
  kind: scalar
  status: draft
  description: Normalized parallel pressure moment of the perturbed gyrocenter distribution
    for a species, formed by weighting the perturbation with the square of velocity
    along the local magnetic field. It measures the dimensionless parallel thermal-pressure
    response of a gyrokinetic eigenmode.
  documentation: 'Parallel normalized gyrocenter perturbed pressure is the parallel
    component of the gyrotropic pressure perturbation obtained from the perturbed
    gyrocenter distribution. It measures the change in thermal pressure associated
    with gyrocenter motion along the local magnetic field, normalized to a reference
    scalar pressure.


    The defining moment is the full velocity-space integral of the parallel kinetic-energy
    weighting of the perturbed gyrocenter distribution:


    $$

    \tilde{p}_{\parallel,g} = \frac{1}{p_\mathrm{ref}} \int_{\mathbb{R}^3} m v_\parallel^2
    \, \delta\bar{f}(\mathbf{v}) \, d^3v

    $$


    where $m$ is the species mass, $v_\parallel$ is the gyrocenter velocity component
    along the local magnetic field, $\delta\bar{f}$ is the perturbed gyrocenter distribution,
    and $p_\mathrm{ref}=n_\mathrm{ref}T_\mathrm{ref}$ with $T_\mathrm{ref}$ expressed
    as an energy. The integral is over all three velocity components, not only over
    $v_\parallel$; $\delta\bar{f}$ has units of density per velocity-space volume,
    so $\int \delta\bar{f}\,d^3v$ has units of number density.


    In delta-f gyrokinetic calculations this moment is evaluated for each species
    and fluctuation or eigenmode to characterize the parallel thermal-energy part
    of the response. As a gyrocenter moment it is defined after gyroaveraging; the
    related particle-frame pressure moment also includes the transformation from gyrocenter
    to particle position. Together with [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure),
    it specifies the gyrotropic pressure perturbation in the gyrocenter frame.


    Typical absolute fluctuation levels in saturated core microturbulence are often
    $10^{-4}-10^{-2}$ when normalized to the equilibrium pressure, while edge or strongly
    driven cases can be larger. In linear eigenmode studies the absolute amplitude
    is set by the chosen eigenfunction normalization, so order-unity values may reflect
    normalization rather than a physical fluctuation level.


    Sign convention: Positive when the perturbed gyrocenter distribution increases
    the $m v_\parallel^2$ velocity-space moment above its equilibrium value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_density
  arguments:
  - name: normalized_gyrocenter_perturbed_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
