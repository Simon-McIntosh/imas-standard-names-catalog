- name: spectral_wavelength_of_optical_element
  kind: scalar
  status: draft
  description: Wavelength coordinate axis defining the spectral sampling grid at which
    the optical properties or instrument response of a diagnostic optical element
    are characterized.
  documentation: "This quantity specifies the set of photon wavelength values constituting\
    \ the spectral axis used to sample the wavelength-resolved properties of a diagnostic\
    \ optical element, such as its transmission, reflectivity, absorption, refractive\
    \ index, or instrument response function. It applies across a wide range of diagnostic\
    \ types, from crystal X-ray spectrometers and soft or hard X-ray filter windows\
    \ to visible-band filter spectrometers, wherever the element's spectral behavior\
    \ must be characterized on a defined wavelength grid.\n\nThe photon wavelength\
    \ $\\lambda$ relates to photon energy $E$ by\n\n$$\n\\lambda = \\frac{hc}{E}\n\
    $$\n\nwhere $h$ is Planck's constant and $c$ is the speed of light in vacuum.\
    \ For hard X-ray filter materials the grid spans roughly 0.001\u20130.1 nm; for\
    \ soft X-ray diagnostics, 0.1\u201350 nm; for visible-band spectrometers, 380\u2013\
    780 nm.\n\nThis spectral coordinate is the companion axis to wavelength-resolved\
    \ material properties such as [spectral_refractive_index_of_optical_element](name:spectral_refractive_index_of_optical_element)\
    \ and feeds into the derivation of quantities like [effective_spectral_width_of_spectrometer_channel](name:effective_spectral_width_of_spectrometer_channel).\
    \ For identifying individual spectral features resolved within this grid, the\
    \ central rest-frame vacuum wavelength of a transition is given by [wavelength_of_spectral_line](name:wavelength_of_spectral_line)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
