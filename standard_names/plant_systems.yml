- name: radial_component_of_shattered_pellet_velocity
  kind: scalar
  status: draft
  description: Projection of the shattered pellet injector (SPI) pellet center-of-mass
    velocity onto the major-radius direction $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame, isolating the inward or outward radial motion of the pellet.
  documentation: "The radial velocity component $v_R$ is the $R$-projection of the\
    \ full pellet center-of-mass velocity vector described by [shattered_pellet_velocity](name:shattered_pellet_velocity),\
    \ decomposed as $v_R = \\mathbf{v} \\cdot \\hat{R}$, where $\\hat{R}$ points away\
    \ from the machine symmetry axis. In shattered pellet injection (SPI), the pellet\
    \ is fired from an injector port toward the plasma, so $v_R$ is typically negative\
    \ (inward) during the injection phase, with magnitudes on the order of 50\u2013\
    500 m s$^{-1}$ depending on the injector geometry and gas pressure. Together with\
    \ [toroidal_component_of_shattered_pellet_velocity](name:toroidal_component_of_shattered_pellet_velocity)\
    \ and the vertical component, it fully resolves the pellet trajectory in the cylindrical\
    \ $(R, \\phi, Z)$ frame. The radial component governs how quickly the pellet penetrates\
    \ toward the plasma core and directly affects the deposition profile of the ablated\
    \ material during a disruption mitigation event. It is inferred from high-speed\
    \ imaging or from injector ballistic models, and the pre-shattering speed magnitude\
    \ is related to [shattered_pellet_speed_before_shattering](name:shattered_pellet_speed_before_shattering).\n\
    \nSign convention: Positive when the pellet center-of-mass moves in the direction\
    \ of increasing major radius $R$, i.e., away from the machine symmetry axis."
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_velocity
  - name:toroidal_component_of_shattered_pellet_velocity
  - name:shattered_pellet_speed_before_shattering
  validity_domain: ''
  constraints: []
  arguments:
  - name: shattered_pellet_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:spi/injector/pellet/velocity_r
    dd_path: spi/injector/pellet/velocity_r
    status: composed
- name: vertical_component_of_shattered_pellet_fragment_cloud_velocity
  kind: scalar
  status: draft
  description: Vertical (Z) component of the center-of-mass velocity of the shattered
    pellet fragment cloud, evaluated at the shattering cone origin in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical component $v_Z$ is defined as the projection of the
    fragment-cloud center-of-mass velocity vector $\mathbf{v}$ onto the vertical axis
    $\hat{Z}$:


    $$v_Z = \mathbf{v} \cdot \hat{Z}$$


    where $\hat{Z}$ points vertically upward in the right-handed cylindrical $(R,
    \phi, Z)$ frame with $R$ the major radius and $\phi$ the toroidal angle increasing
    counter-clockwise viewed from above $+\hat{Z}$. This quantity characterizes the
    net upward or downward drift of the post-shatter fragment ensemble at the moment
    the pellet exits the shattering cone. It is distinct from pellet-level quantities
    such as the pre-shatter pellet speed; it refers exclusively to the post-shatter
    fragment cloud kinematics.


    Typical magnitudes are $|v_Z| \lesssim$ a few hundred m/s, depending on injector
    geometry and shattering angle. For purely horizontal injectors aimed radially,
    $v_Z$ is close to zero; non-zero values arise from tilted injectors or asymmetric
    shattering.


    DD source path: `spi/injector/velocity_mass_center_fragments_z` (unit: m s$^{-1}$).


    Sign convention: Positive when the fragment cloud center-of-mass moves in the
    $+\hat{Z}$ direction (upward, away from the bottom of the vessel).'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_fragment_cloud_velocity
  - name:radial_component_of_shattered_pellet_velocity
  - name:toroidal_component_of_shattered_pellet_velocity
  - name:shattered_pellet_speed_before_shattering
  validity_domain: ''
  constraints: []
  arguments:
  - name: shattered_pellet_fragment_cloud_velocity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:spi/injector/velocity_mass_centre_fragments_z
    dd_path: spi/injector/velocity_mass_centre_fragments_z
    status: composed
