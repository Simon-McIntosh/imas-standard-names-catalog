name: radial_iron_core_segment_magnetization_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether the radial magnetization of an iron core
  segment is treated as exact input (1) or fitted (0) in equilibrium reconstruction.
documentation: This flag governs how the radial component of the iron core segment
  magnetization $M_R$ enters the equilibrium reconstruction. When set to 1, the measured
  $M_R$ is imposed as a hard constraint; when 0, it participates in the least-squares
  cost functional weighted by its companion weight parameter. Iron core segments in
  tokamaks (e.g., transformer yokes) carry significant magnetization that affects
  the poloidal flux distribution; their accurate treatment is essential for reconstructing
  the equilibrium in devices with ferromagnetic structures. The radial component refers
  to the $R$-direction in the cylindrical coordinate system $(R, \phi, Z)$. See the
  companion quantities for the vertical component and the associated weight.
