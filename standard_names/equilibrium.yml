- name: major_radius_of_x_point
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the secondary X-point of a double-null
    divertor configuration, where the poloidal magnetic field vanishes on the secondary
    separatrix.
  documentation: "The major radius of the secondary X-point, $R_{X2}$, locates the\
    \ poloidal-field null on the secondary separatrix in a double-null equilibrium.\
    \ Both the primary and secondary X-points satisfy $\\mathbf{B}_p = 0$, where $\\\
    mathbf{B}_p$ is the poloidal magnetic field. The secondary X-point is typically\
    \ the lower or upper null opposite the primary null, and its radial position affects\
    \ divertor heat-flux sharing and magnetic geometry. $R_{X2}$ is determined from\
    \ equilibrium reconstruction codes (e.g., EFIT) that solve the Grad--Shafranov\
    \ equation, with typical values of $1.5$\u2013$3.0\\,\\mathrm{m}$ in medium-size\
    \ tokamaks. Larger major radius of the secondary X-point shifts the outer divertor\
    \ leg outward, increasing the outer strike-point radius. See also [major radius\
    \ of magnetic axis](name:major_radius_of_magnetic_axis) for the innermost flux-surface\
    \ location and [major radius of strike point](name:major_radius_of_strike_point)\
    \ for the divertor-target intersection.\n\nSign convention: Positive when $R_{X2}$\
    \ increases in the direction of the geometric major radius $+R$ in the IMAS cylindrical\
    \ $(R, \\phi, Z)$ frame.\n\nMeasurement of $R_{X2}$ relies on magnetic probe arrays,\
    \ flux loops, and poloidal-field coil currents used as constraints in equilibrium\
    \ reconstruction. Typical uncertainty is $\\pm 0.01$\u2013$0.02\\,\\mathrm{m}$\
    \ in well-diagnosed plasmas. The secondary X-point may be absent in single-null\
    \ configurations, where the secondary separatrix lies entirely outside the plasma.\
    \ A matched quantity for the primary null is [major radius of X-point](name:major_radius_of_x_point)\
    \ (without the 'secondary' qualifier) \u2014 the present name is used only for\
    \ the second null in double-null or snowflake equilibria."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  - name:major_radius_of_strike_point
  - name:major_radius_of_x_point
