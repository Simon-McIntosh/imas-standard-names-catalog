- name: runaway_electron_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel current density carried by the runaway
    electron population in a magnetized plasma.
  documentation: "The runaway electron current density $j_{\\rm RE} = \\langle \\\
    mathbf{j}_{\\rm RE} \\cdot \\mathbf{B} \\rangle / B_0$ quantifies the electrical\
    \ current carried by suprathermal electrons undergoing runaway acceleration. It\
    \ controls the magnetic perturbation of the runaway beam and its impact on plasma\
    \ equilibrium stability. Typical values range from 0.1\u201310 MA\u202Fm$^{-2}$\
    \ in disruption beams, depending on the avalanche multiplication factor and the\
    \ available toroidal electric field. This quantity is reconstructed from synchrotron\
    \ radiation images, hard X-ray measurements, and magnetic diagnostics via equilibrium\
    \ solvers. It is related to the total beam current by $I_{\\rm RE} = \\int j_{\\\
    rm RE} \\, dA$, where $dA$ is the flux-surface cross-sectional area. See also\
    \ [volume_averaged_runaway_electron_current_density](name:volume_averaged_runaway_electron_current_density)\
    \ and [total_source_rate](name:total_source_rate) for the underlying generation\
    \ mechanisms.\n\nSign convention: Positive when the runaway current flows in the\
    \ direction of increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:volume_averaged_runaway_electron_current_density
  - name:total_source_rate
  sources:
  - id: dd:disruption/profiles_1d/j_runaways
    dd_path: disruption/profiles_1d/j_runaways
    status: composed
  - id: dd:runaway_electrons/ggd_fluid/current_density/values
    dd_path: runaway_electrons/ggd_fluid/current_density/values
    status: composed
  - id: dd:runaway_electrons/profiles_1d/current_density
    dd_path: runaway_electrons/profiles_1d/current_density
    status: composed
- name: runaway_electron_density
  kind: scalar
  status: draft
  description: Number density of electrons in the runaway regime, where the parallel
    electric field exceeds the critical field for collisional friction and relativistic
    effects reduce the effective collisionality.
  documentation: 'The runaway electron density $n_{\mathrm{RE}}$ quantifies the population
    of suprathermal electrons that undergo continuous acceleration by the toroidal
    electric field during tokamak disruptions, when the electric field $E_\parallel$
    exceeds the critical field $E_c = n_e e^3 \ln\Lambda/(4\pi \epsilon_0^2 m_e c^2)$.
    These electrons can reach multi-MeV energies and carry a significant fraction
    of the plasma current, posing a threat to plasma-facing components. Typical densities
    range from $10^{15}\,\mathrm{m^{-3}}$ to $10^{19}\,\mathrm{m^{-3}}$ in disruption
    scenarios, depending on the electron density, temperature evolution, and impurity
    content. The density is inferred from measurements of synchrotron radiation, bremsstrahlung
    emission by hard X-ray diagnostics, or through reconstruction of the post-disruption
    current profile using magnetic and kinetic constraints. In kinetic models, the
    runaway electron density is computed by integrating the distribution function
    $f_\mathrm{RE}(p)$ above the critical momentum $p_c = m_e c / \sqrt{E_\parallel/E_c
    - 1}$ over momentum space. The evolution of $n_{\mathrm{RE}}$ is governed by the
    competition between the Dreicer generation mechanism and avalanche multiplication,
    described by the source rate [runaway_electron_source_rate](name:runaway_electron_source_rate).
    The volume-averaged counterpart [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density)
    and the kinetic energy [runaway_electron_kinetic_energy](name:runaway_electron_kinetic_energy)
    complete the characterization of the runaway population.


    Sign convention: Positive when the number of runaway electrons per unit volume
    increases.


    The cross-reference rationale explains that the density of runaway electrons is
    intrinsically linked to the mechanisms that generate them (the source rate), the
    energy they carry (kinetic energy), and the global metric that aggregates them
    (volume-averaged density).'
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate
  - name:volume_averaged_runaway_electron_density
  - name:runaway_electron_kinetic_energy
  sources:
  - id: dd:runaway_electrons/ggd_fluid/density/values
    dd_path: runaway_electrons/ggd_fluid/density/values
    status: composed
  - id: dd:runaway_electrons/profiles_1d/density
    dd_path: runaway_electrons/profiles_1d/density
    status: composed
- name: time_of_neoclassical_tearing_mode_onset
  kind: scalar
  status: draft
  description: Time offset from a global reference marking the onset of a neoclassical
    tearing mode magnetic island.
  documentation: 'The onset time of a neoclassical tearing mode (NTM) is the time
    at which the magnetic island first reaches a detectable amplitude, usually identified
    from a threshold crossing in the mode amplitude or from the time derivative of
    the perturbed field. This time offset is referenced to an arbitrary global time
    origin, such as the beginning of a discharge simulation. The NTM onset time is
    a critical input for transport simulations and MHD stability analysis, as it determines
    when the island-driven degradation of confinement begins. It is related to the
    mode''s helical periodicity through the [$n$](name:toroidal_mode_number_of_neoclassical_tearing_mode)
    and [$m$](name:poloidal_mode_number_of_neoclassical_tearing_mode) numbers, which
    describe the island''s toroidal and poloidal structure.


    Sign convention: Positive when the onset occurs after the global time reference.


    Typical values in tokamak experiments range from 0.1 to 10 s after the start of
    the current flat-top. The onset time is usually determined from magnetic pickup
    coils (Mirnov probes) or from the mode signature in electron cyclotron emission
    measurements.'
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  - name:poloidal_mode_number_of_neoclassical_tearing_mode
  sources:
