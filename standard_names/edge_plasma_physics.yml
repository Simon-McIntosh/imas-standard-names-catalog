- name: iron_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of iron impurity ions at the H-mode pedestal top is
    the particle count per volume at the core-side shoulder of the H-mode edge transport
    barrier, summed over ionic charge states.
  documentation: 'Number density of iron impurity ions at the H-mode pedestal top
    is the local particle count per volume of iron ions evaluated on the flux surface
    marking the core-side shoulder of the H-mode edge transport barrier. It is the
    iron-specific child of [density at pedestal top](name:density_at_pedestal_top),
    where the steep pedestal gradient joins the flatter confined-core density variation.


    For iron ions, the defining local density is


    $$

    n_{\mathrm{Fe}} = \left.\frac{dN_{\mathrm{Fe}}}{dV}\right|_{\xi=\xi_{\mathrm{ped,top}}}

    $$


    where $n_{\mathrm{Fe}}$ is the iron-ion number density in m$^{-3}$, $N_{\mathrm{Fe}}$
    is the dimensionless count of iron ions, $V$ is physical volume in m$^{3}$, and
    $\xi_{\mathrm{ped,top}}$ is the radial label of the pedestal-top flux surface.


    The quantity is summed over ionic charge states from Fe$^{+}$ through fully stripped
    Fe$^{26+}$ and excludes other elements and the total ion mixture represented by
    [total ion density at pedestal top](name:total_ion_density_at_pedestal_top).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
