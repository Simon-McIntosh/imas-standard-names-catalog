name: gyrokinetic_eigenmode_normalized_gyrocenter_parallel_heat_flux_moment_gyroaveraged
status: draft
cocos_transformation_type: one_like
description: Gyroaveraged normalized parallel heat flux moment of the perturbed gyrocenter
  distribution for a gyrokinetic eigenmode.
documentation: The gyroaveraged (Bessel-function-weighted) dimensionless parallel
  heat flux moment $\hat{q}_{\parallel,\mathrm{ga}} \propto \int J_0(k_\perp \rho_s)
  \frac{1}{2} m v_\parallel v^2 \delta f_{\mathrm{gc}} \, d^3v$, where $J_0$ is the
  zeroth-order Bessel function of the first kind, $k_\perp$ is the perpendicular wavenumber,
  $\rho_s$ is the species Larmor radius, $m$ the species mass, $v_\parallel$ the parallel
  velocity, and $\delta f_{\mathrm{gc}}$ the perturbed gyrocenter distribution function.
  The gyroaveraging procedure accounts for finite-Larmor-radius (FLR) effects that
  reduce the effective moment at high $k_\perp \rho_s$. This quantity enters the particle-space
  (as opposed to gyrocenter-space) parallel heat flux and is needed for the self-consistent
  evaluation of electromagnetic transport fluxes. Normalized to reference thermal
  quantities to yield a dimensionless value. Produced alongside the non-gyroaveraged
  moment by gyrokinetic eigenvalue solvers.
