name: electron_scrape_off_layer_density_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the electron number density mapped
  to the outboard midplane in the scrape-off layer.
documentation: "The electron density decay length $\\lambda_{n_e}$ (in m) is the radial\
  \ e-folding distance of the electron number density $n_e$ in the scrape-off layer\
  \ (SOL), referenced to the outboard midplane. It characterizes particle transport\
  \ across the separatrix and affects fueling efficiency, impurity screening, and\
  \ divertor neutral compression. Typical values in H-mode range from 5\u201330 mm\
  \ at the midplane, and $\\lambda_{n_e}$ is generally broader than the heat-flux\
  \ decay length $\\lambda_{q,e}$ because convective blob transport widens the density\
  \ profile more effectively than the temperature profile. The quantity is measured\
  \ by Thomson scattering, Langmuir probes, lithium-beam emission spectroscopy, or\
  \ reflectometry in the SOL region. The ratio $\\lambda_{n_e} / \\lambda_{T_e}$ provides\
  \ insight into the relative roles of conductive and convective SOL transport. See\
  \ also `electron_temperature_decay_length_in_scrape_off_layer` and `ion_density_decay_length_in_scrape_off_layer`."
