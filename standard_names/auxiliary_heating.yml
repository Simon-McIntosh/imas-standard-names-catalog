- name: total_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed from a coherent RF wave, integrated over
    the entire plasma volume and summed over all absorbing plasma species (electrons,
    thermal ions, fast ions, and any minority populations). This is the global scalar
    power balance quantity for a single coherent wave.
  documentation: "The total absorbed wave power $P_{\\rm abs}$ is defined by the volume\
    \ integral\n\n$$P_{\\rm abs} = \\int_{V} \\mathbf{j} \\cdot \\mathbf{E}\\, dV$$\n\
    \nwhere $\\mathbf{j}$ (A m$^{-2}$) is the total plasma current density (including\
    \ both the real conductivity response and contributions from all absorbing populations\
    \ in the quasilinear framework), $\\mathbf{E}$ (V m$^{-1}$) is the wave electric\
    \ field, and $dV$ (m$^3$) is the plasma volume element. In the quasilinear picture\
    \ this expression is equivalently written using the anti-Hermitian part of the\
    \ dielectric tensor, $\\boldsymbol{\\epsilon}^a$, as\n\n$$P_{\\rm abs} = \\frac{\\\
    omega}{8\\pi} \\int_{V} \\mathbf{E}^* \\cdot \\boldsymbol{\\epsilon}^a \\cdot\
    \ \\mathbf{E}\\, dV$$\n\nThe summation spans all plasma species (bulk electrons,\
    \ thermal ions, fast ions, and minority ion populations). Both collisional (ohmic-like)\
    \ and collisionless (Landau damping, cyclotron damping) absorption mechanisms\
    \ contribute.\n\nSign convention: Positive when net power flows from the wave\
    \ into the plasma.\n\nTypical values range from tens of kilowatts in small research\
    \ devices to tens of megawatts in large tokamaks (e.g., 1 kW\u201320 MW for ICRF\
    \ or LH systems). The quantity is dimensionally consistent: A m$^{-2}$ $\\times$\
    \ V m$^{-1}$ $\\times$ m$^3$ = W.\n\nThis global scalar quantity is the single-wave\
    \ counterpart to species-resolved absorptions (e.g., electron or thermal-ion absorbed\
    \ power) and to the spatially resolved absorption profile. It represents a steady-state\
    \ or time-averaged power balance figure and does not resolve transient wave\u2013\
    plasma interactions on timescales shorter than the energy confinement time. In\
    \ full-wave codes it is obtained by integrating the volumetric power deposition\
    \ profile; in ray-tracing or beam-tracing codes it is accumulated along ray trajectories\
    \ as the wave damps. Experimentally, it may be inferred as the difference between\
    \ launched and reflected power measured at the antenna or waveguide coupler, corrected\
    \ for transmission-line losses."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_wave_absorbed_power
  - name:thermal_electron_wave_absorbed_power
  - name:fast_ion_wave_absorbed_power
  - name:wave_absorbed_power_inside_flux_surface
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/global_quantities/power
    dd_path: waves/coherent_wave/global_quantities/power
    status: composed
- name: vertical_coordinate_of_launching_position
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the electron cyclotron wave launching position,
    specifying the height of the launcher above or below the machine midplane in the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z_{\rm launch}$ locates the point at which
    an electron cyclotron (EC) beam enters the plasma in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z$ measures height relative to the machine midplane,
    $R$ is the major radius from the symmetry axis, and $\phi$ is the toroidal angle.
    Together with [major_radius_of_launching_position](name:major_radius_of_launching_position),
    it fully specifies the poloidal-plane position of the EC launcher aperture, which
    determines the initial ray trajectory used in beam-tracing or ray-tracing codes
    to model wave propagation and absorption in the plasma. Typical values range from
    approximately $-2$ m to $+2$ m for medium-to-large tokamaks, depending on launcher
    installation height and whether the beam is aimed from the low-field or high-field
    side. The launching position is usually defined at the antenna mirror or waveguide
    mouth and is provided as a fixed geometric parameter in the launcher design documentation
    or inferred from engineering surveys; it pairs with the mirror orientation angles
    described by [toroidal_angle_of_electron_cyclotron_launcher_mirror](name:toroidal_angle_of_electron_cyclotron_launcher_mirror)
    to fully characterize the beam injection geometry.


    Sign convention: Positive when the launching position lies above the machine midplane
    in the $+Z$ direction.'
  unit: m
  physics_domain: auxiliary_heating
  links:
