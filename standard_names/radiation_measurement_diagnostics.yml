- name: first_coordinate_width_of_filter_window
  kind: scalar
  status: draft
  description: Full width of a diagnostic filter window in the first local coordinate
    (X1) direction, applicable for rectangular filter geometry.
  documentation: 'The first coordinate width $w_{X1}$ defines the full extent of a
    rectangular diagnostic filter window along the X1 axis of the instrument''s local
    reference frame $(X1, X2)$. Filter windows attenuate or spectrally select the
    radiation reaching a detector; their precise dimensions determine the solid angle
    and spectral bandwidth accepted by the channel. This quantity applies only when
    the filter geometry is rectangular (as opposed to circular, for which [radius
    of filter window](name:radius_of_filter_window) is used instead). The complementary
    width along X2 is given by [second coordinate width of filter window](name:second_coordinate_width_of_filter_window),
    and the analogous detector dimension is [first coordinate width of detector](name:first_coordinate_width_of_detector).
    Typical values range from sub-millimeter to several centimeters depending on the
    diagnostic application (crystal X-ray spectrometers, hard or soft X-ray cameras).
    The polygonal outline of the filter window in the local frame is described by
    [first coordinate of filter window outline](name:first_coordinate_of_filter_window_outline).


    Sign convention: Positive when the width extends in the direction of increasing
    X1 coordinate.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
