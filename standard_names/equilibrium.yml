- name: elongation_of_plasma_boundary
  kind: scalar
  status: active
  description: "Dimensionless ratio of the plasma boundary\u2019s vertical half-height\
    \ to its minor radius, quantifying the elongation of its cross-sectional shape."
  documentation: 'Plasma-boundary elongation is the ratio of the vertical half-height
    to the minor radius of the outermost closed plasma cross-section, describing its
    vertical shaping relative to a circular cross-section.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the elongation is defined
    by


    $$

    \kappa = \frac{Z_{\max}-Z_{\min}}{2a}

    $$


    where $\kappa$ is the plasma-boundary elongation, $Z_{\max}$ and $Z_{\min}$ are
    the maximum and minimum vertical coordinates of the boundary, and $a$ is the minor
    radius, defined as the radial half-width of the boundary cross-section.


    This quantity applies specifically to the plasma boundary rather than to an arbitrary
    nested magnetic flux surface. Its geometric aggregation uses the full vertical
    extent and radial half-width of the boundary cross-section; it is not a local
    field value and is not averaged over the boundary. It therefore excludes the corresponding
    elongation of an interior flux surface.


    The quantity is the boundary-locus specialization of [elongation of a flux surface](name:elongation_of_flux_surface),
    which applies the same geometric ratio to a general nested magnetic flux-surface
    cross-section.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/boundary/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-elongation
    dd_documentation:
      leaf: Elongation of the plasma boundary
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Elongation (\u03BA) of the plasma boundary, defined as the ratio\
        \ of the plasma's vertical half-height to its minor radius. A key MHD shaping\
        \ parameter characterizing the plasma cross-sectional geometry at the boundary."
      kind: llm
