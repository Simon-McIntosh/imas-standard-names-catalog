      kind: template
- name: vertical_coordinate_of_current_center
  kind: scalar
  status: active
  description: "Signed vertical position of the plasma-current centroid, obtained\
    \ by weighting the toroidal current distribution by height in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of the plasma-current center is the current-density-weighted
    centroid height of the plasma current distribution in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    $$

    Z_{\mathrm{c}} = \frac{\int_{\mathcal{A}} Z\,j_{\phi}(R,Z)\,dA}{\int_{\mathcal{A}}
    j_{\phi}(R,Z)\,dA}

    $$


    where $Z_{\mathrm{c}}$ and $Z$ are vertical coordinates in m, $R$ is major radius
    in m, $j_{\phi}$ is toroidal current density in A m$^{-2}$, $dA$ is differential
    poloidal cross-sectional area in m$^{2}$, and $\mathcal{A}$ is the region carrying
    plasma current. The current-weighted center is distinct from the geometric axis;
    its radial counterpart is the [radial coordinate of the current center](name:radial_coordinate_of_current_center).


    Sign convention: Positive when the plasma-current centroid lies in the $+Z$ direction
    from the coordinate origin.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_current_center
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/current_centre/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-current_centre-z
    dd_documentation:
      leaf: Height of the current center, defined as integral over the poloidal cross
        section of (j_tor*z*dS) / Ip
      parent_path: equilibrium/time_slice/global_quantities/current_centre
      parent: Position and vertical velocity of the current centre
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Vertical (Z) coordinate of current centre.
      kind: template
- name: vertical_coordinate_of_geometric_axis
  kind: scalar
  status: active
  description: "Signed vertical coordinate of the geometric axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, defined as the midpoint of the last closed\
    \ flux surface\u2019s maximum and minimum Z positions."
  documentation: 'The geometric axis is the vertical shape center of the last closed
    flux surface, distinct from the magnetic axis. Its vertical coordinate is determined
    from the extrema of the plasma-boundary contour, whose vertical position is described
    by [vertical coordinate of plasma boundary](name:vertical_coordinate_of_plasma_boundary).


    The geometric-axis coordinate is defined by


    $$

    Z_{\mathrm{geo}} = \frac{Z_{\max} + Z_{\min}}{2}

    $$


    where $Z_{\mathrm{geo}}$, $Z_{\max}$, and $Z_{\min}$ are vertical coordinates
    in m, and $Z_{\max}$ and $Z_{\min}$ are respectively the maximum and minimum values
    of $Z$ on the last closed flux-surface boundary. Together with the [radial coordinate
    of geometric axis](name:radial_coordinate_of_geometric_axis), it locates the geometric
    axis in the poloidal cross-section.


    Sign convention: Positive when the geometric-axis coordinate points in the $+Z$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame, upward from the
    machine midplane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_plasma_boundary
