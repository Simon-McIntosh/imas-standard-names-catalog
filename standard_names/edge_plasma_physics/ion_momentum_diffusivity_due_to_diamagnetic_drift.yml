name: ion_momentum_diffusivity_due_to_diamagnetic_drift
status: draft
description: Effective diffusion coefficient for ion momentum transport arising from
  the diamagnetic drift mechanism.
documentation: "The diamagnetic ion momentum diffusivity $D_{\\mathrm{dia}}^{\\mathrm{mom}}$\
  \ (m$^2$ s$^{-1}$) parameterizes the diffusive part of the ion momentum flux driven\
  \ by the diamagnetic drift as $\\Gamma_{\\mathrm{mom}} = -D_{\\mathrm{dia}}^{\\\
  mathrm{mom}} \\nabla (n_i m_i v_i)$, where $n_i$ is the ion number density (m$^{-3}$),\
  \ $m_i$ the ion mass (kg), and $v_i$ the ion velocity (m s$^{-1}$). This coefficient\
  \ isolates the contribution of the diamagnetic mechanism\u2014arising from perpendicular\
  \ pressure gradients in the magnetized plasma\u2014to the overall momentum diffusivity.\
  \ In edge transport codes it is typically comparable to or smaller than the anomalous\
  \ momentum diffusivity, with values of order $10^{-2}$\u2013$10^{0}$ m$^2$ s$^{-1}$\
  \ in tokamak edge conditions. The quantity is defined per GGD element and can refer\
  \ either to a bundled ion species or a specific charge state. See `ion_momentum_flux_due_to_diamagnetic_drift`\
  \ for the corresponding flux and `electron_diffusivity_poloidal` for the electron\
  \ transport analogue."
