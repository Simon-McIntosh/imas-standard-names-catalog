name: volume_averaged_oxygen_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Volume-averaged number density of all oxygen ion charge states, summed
  over the confined plasma volume.
documentation: "The volume-averaged oxygen ion number density $\\langle n_{\\mathrm{O}}\\\
  rangle_V = V^{-1}\\int n_{\\mathrm{O}}(\\mathbf{r})\\,dV$ represents the total ionized\
  \ oxygen population (all charge states $\\mathrm{O}^{1+}$ through $\\mathrm{O}^{8+}$)\
  \ averaged over the plasma volume $V$ in m$^{-3}$. Oxygen is a common light impurity\
  \ in tokamak plasmas, originating from wall outgassing, water vapor, and residual\
  \ air; its concentration directly affects radiative power loss through line emission\
  \ and recombination radiation, especially in the edge and divertor regions. Typical\
  \ values range from $10^{15}$\u2013$10^{17}\\;\\mathrm{m}^{-3}$ in well-conditioned\
  \ discharges, corresponding to fractional concentrations $n_{\\mathrm{O}}/n_e \\\
  sim 0.1$\u2013$1\\%$. Inferred from charge-exchange recombination spectroscopy (CXRS),\
  \ vacuum ultraviolet (VUV) spectroscopy, or integrated modeling with impurity transport\
  \ codes such as STRAHL. The quantity enters the effective charge calculation $Z_{\\\
  mathrm{eff}} = \\sum_i n_i Z_i^2 / n_e$ and contributes to dilution of the fuel\
  \ ion species. See also `volume_averaged_electron_number_density` and `argon_ion_number_density_at_pedestal`\
  \ for related impurity diagnostics."
