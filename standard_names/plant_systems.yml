- name: shattered_pellet_fragment_density
  kind: scalar
  status: active
  description: Number density of atoms of a specified constituent species within one
    material fragment produced by a shattered pellet injector, summed over all charge
    states of that species.
  documentation: 'Number density of atoms of a specified constituent species within
    one material fragment produced by a shattered pellet injector is the count of
    atoms of that species in the fragment divided by the fragment physical volume.
    The species-level value is summed over all charge states of that atomic species.


    For species $s$ in a fragment of volume $V_f$, the density is defined by


    $$

    n_s = \frac{N_s}{V_f}

    $$


    where $n_s$ is the species number density, $N_s$ is the dimensionless count of
    atoms of species $s$ in the fragment, and $V_f$ is the physical volume of that
    fragment.


    This quantity applies to a single condensed shattered-pellet fragment and is resolved
    by constituent species. It differs from [density_of_pellet](name:density_of_pellet),
    which describes the atom number density of an intact pellet as a whole, and from
    [core_density_of_pellet](name:core_density_of_pellet), which describes the atom
    number density in the pellet core rather than in an individual shattered fragment.
    It also excludes the density of ablated gas or plasma produced after material
    leaves the condensed fragment.'
  unit: m^-3
  physics_domain: plant_systems
  links: []
  sources:
  - dd_path: spi/injector/fragment/species/density
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-fragment-species-density
    dd_documentation:
      leaf: Density of the species
