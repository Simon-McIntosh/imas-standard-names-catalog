- name: area_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Geometric area of the designated diagnostic aperture surface that admits
    or collects radiation or particles.
  documentation: 'Diagnostic aperture area is the geometric extent of the designated
    limiting surface through which radiation or particles are admitted or collected.
    It may describe a clear aperture opening or a collecting face when that face defines
    the aperture.


    The area is defined by the surface integral


    $$

    A = \int_S dS

    $$


    where $A$ is the diagnostic aperture area, $S$ is the designated aperture surface,
    and $dS$ is the differential area element on that surface.


    This quantity applies to the specified aperture surface of the diagnostic and
    is not an automatically aggregated area for unrelated apertures. It is a geometric
    area, excluding surrounding housing, supports, and other structures unless they
    form the designated aperture surface; it is not an effective area weighted by
    transmission, sensitivity, or angular response.


    The area is distinct from the [radius of a diagnostic aperture](name:radius_of_diagnostic_aperture)
    and the [width of a diagnostic aperture](name:width_of_diagnostic_aperture), which
    describe linear dimensions. For a circular aperture of radius $r$, where $r$ is
    the geometric distance from the aperture center to its boundary, the area satisfies
    $A = \pi r^2$, with $\pi$ denoting the circle constant.'
  unit: m^2
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: bolometer/camera/channel/aperture/surface
    dd_version: 4.1.0
