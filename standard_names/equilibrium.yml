- name: plasma_current
  kind: scalar
  status: active
  description: Net toroidal electric current carried by the entire plasma column,
    obtained by integrating toroidal current density over its enclosed poloidal cross-section.
  documentation: 'Plasma current is the net electric current carried by the full plasma
    population, represented as the toroidal current crossing a poloidal cross-section
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    $$

    I_p = \int_{A_p} j_\phi\,\mathrm{d}A

    $$


    where $I_p$ is the total plasma current, $A_p$ is the enclosed poloidal cross-sectional
    area, $j_\phi$ is the toroidal component of the electric current density, and
    $\mathrm{d}A$ is the differential area element.


    The quantity includes the algebraic sum of toroidal currents from all charged
    plasma species and charge states over the complete enclosed plasma cross-section.
    It is a global total rather than a local current density, a species-resolved contribution,
    or a current restricted to a particular physical mechanism.


    It is the area integral of the toroidal projection of [current density](name:current_density).
    The narrower [toroidal total runaway-electron current](name:toroidal_total_runaway_electron_current)
    represents only the runaway-electron contribution and is not the full plasma current.


    Sign convention: Positive when the net plasma current flows in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: A
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: core_profiles/global_quantities/ip
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-global_quantities-ip
    dd_documentation:
