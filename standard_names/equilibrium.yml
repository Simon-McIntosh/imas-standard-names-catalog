- name: vacuum_poloidal_current_function
  kind: scalar
  status: draft
  description: Vacuum poloidal current function is major radius multiplied by the
    vacuum toroidal magnetic-field component in the right-handed cylindrical (R, phi,
    Z) system. In a current-free vacuum subregion outside the plasma it is constant
    between current sources and represents the enclosed poloidal current that sets
    the vacuum toroidal field.
  documentation: 'The vacuum poloidal current function, $F_\mathrm{vac}$, is the vacuum
    contribution to the axisymmetric poloidal-current function that determines the
    toroidal magnetic field. It is defined in the right-handed cylindrical $(R,\phi,Z)$
    system, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. Within a connected vacuum subregion that contains no current density,
    $F_\mathrm{vac}$ is spatially constant; this constancy does not apply across external
    current sources.


    The defining relation is


    $$

    F_\mathrm{vac} = R B_{\phi,\mathrm{vac}} = \frac{\mu_0 I_\mathrm{pol,enc}}{2\pi}

    $$


    where $B_{\phi,\mathrm{vac}}$ is the vacuum toroidal magnetic-field component,
    $\mu_0$ is the permeability of free space, and $I_\mathrm{pol,enc}$ is the net
    enclosed [poloidal current] linked by the toroidal Amperian loop. The equality
    to enclosed current follows from Ampere''s law for an axisymmetric vacuum field.


    In Grad-Shafranov equilibrium the total function $F(\psi)=R B_\phi$ is specified
    together with the pressure function $p(\psi)$, related to [pressure at flux surface](name:pressure_at_flux_surface),
    and couples to the [poloidal magnetic flux at flux surface](name:poloidal_magnetic_flux_at_flux_surface)
    through the source term $-F\,dF/d\psi$. In a current-free vacuum subregion, the
    pressure gradient is absent and $dF/d\psi=0$, so the vacuum value is the constant
    limiting value of this function there.


    In practice $F_\mathrm{vac}$ is obtained from calibrated toroidal-field coil currents,
    vacuum magnetic-field measurements, or equilibrium reconstruction constrained
    by magnetic diagnostics. It is often numerically close to a reference product
    $R_\mathrm{ref} B_{\phi,\mathrm{vac}}(R_\mathrm{ref})$, but $R_\mathrm{ref}$ is
    the radius associated with the vacuum-field specification and need not be the
    magnetic-axis major radius.


    Typical magnitudes are device-dependent rather than a universal validity range
    because they scale with the specified reference major radius and vacuum toroidal
    field. In tokamak applications they are often of order 1-30 m.T, with sub-meter
    low-field devices below 1 m.T and large high-field devices reaching several tens
    of m.T.


    Sign convention: Positive when the vacuum toroidal magnetic field points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ system.'
  unit: T.m
  physics_domain: equilibrium
  links:
  - name:pressure_at_flux_surface
  - name:poloidal_magnetic_flux_at_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/constraints/b_field_tor_vacuum_r/measured
    dd_path: equilibrium/time_slice/constraints/b_field_tor_vacuum_r/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/b_field_tor_vacuum_r/reconstructed
