- name: major_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Major radius coordinate of the annular cross-section center of a transformer
    iron core segment.
  documentation: "The major radius $R_{\\mathrm{seg}}$ defines the radial position\
    \ of the center of a rectangular or trapezoidal iron core segment in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. This geometric parameter sets the centroid\
    \ of the segment's cross-section, which is critical for computing the magnetic\
    \ circuit properties of the iron core transformer, including its reluctance, saturation,\
    \ and flux linkage. The annular geometry is assumed to be axisymmetric, with the\
    \ major radius locating the annulus center. Typical values range from centimeters\
    \ to meters depending on the tokamak design (e.g., ~\u796D 1\u20132 m for medium-size\
    \ devices).\n\nSign convention: Positive when measured outward from the machine\
    \ symmetry axis.\n\nSee [height_of_iron_core_segment](name:height_of_iron_core_segment)\
    \ for the vertical extent and [major_radius_of_poloidal_field_coil](name:major_radius_of_poloidal_field_coil)\
    \ for a similar geometric quantity applied to PF coils."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_iron_core_segment
  - name:major_radius_of_poloidal_field_coil
  sources:
  - id: dd:iron_core/segment/geometry/annulus/r
    dd_path: iron_core/segment/geometry/annulus/r
    status: composed
  - id: dd:iron_core/segment/geometry/oblique/r
    dd_path: iron_core/segment/geometry/oblique/r
    status: composed
- name: major_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Cylindrical major radius coordinate of the second point defining a
    thick-line cross-section element of a passive loop.
  documentation: 'The major radius $R$ of the second point specifies the radial coordinate,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, of one endpoint of a straight-line
    segment describing the cross-section geometry of a passive loop conductor. This
    point pairs with the first point (stored in a sibling standard name) to define
    the radial and vertical extent of the loop element, which is essential for computing
    mutual inductances and induced eddy currents during plasma disruptions or fast
    transients. Passive loops are typically made of high-conductivity materials (e.g.,
    copper) and are used for passive stabilization and vertical control in tokamaks;
    their major radii range from several meters in large devices like JET to smaller
    values in compact experiments. The quantity is obtained from engineering design
    drawings or equilibrium reconstruction of the passive structure.


    Sign convention: Positive when the point is located at a larger major radius than
    the machine symmetry axis ($R=0$).


    See also [major_radius_of_poloidal_field_coil](name:major_radius_of_poloidal_field_coil)
    for the analogous geometric coordinate applied to active poloidal field coils,
    and [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil) for the
    vertical dimension of a coil cross-section.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/thick_line/second_point/r
    dd_path: pf_active/coil/element/geometry/thick_line/second_point/r
    status: composed
- name: major_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Major radius (R) coordinate defining a discrete element endpoint along
    the toroidal field coil conductor path in the cylindrical frame.
  documentation: "The major radius $R$ of a toroidal field coil conductor element\
    \ endpoint specifies the radial distance from the machine symmetry axis ($Z$)\
    \ to an individual turn segment within the winding pack. These $R$ coordinates,\
    \ together with the corresponding $Z$ and $\\phi$ values, define the full 3-dimensional\
    \ geometry of each coil element in the right-handed cylindrical $(R,\\phi,Z)$\
    \ frame. The positions are used to construct the conductor path for circuit analysis;\
    \ typical $R$ values for TF coils range from 0.5\u202Fm (inboard leg) to 9\u202F\
    m (outboard return leg) in large tokamaks. See also [major_radius_of_passive_loop](name:major_radius_of_passive_loop)\
    \ and [major_radius_of_poloidal_field_coil](name:major_radius_of_poloidal_field_coil)\
    \ for analogous geometry definitions.\n\nSign convention: Positive when the element\
    \ endpoint lies radially outward from the machine axis.\n\nMeasurement is direct\
    \ from coil design geometry; all coordinates are defined in the machine architectural\
    \ frame."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_passive_loop
  - name:major_radius_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/elements/end_points/r
    dd_path: tf/coil/conductor/elements/end_points/r
    status: composed
- name: maximum_magnetic_field_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: The maximum magnitude of the magnetic field on the conductor surface
    of a poloidal field coil, used to evaluate field-dependent current limits for
    the coil. This positive scalar quantifies the peak total magnetic field strength
    over the coil winding pack.
  documentation: 'The maximum magnetic field on the poloidal field coil conductor
    surface is defined as $B_{\mathrm{max}} = \max_{\mathbf{r} \in \mathcal{C}} |\mathbf{B}_{\mathrm{total}}(\mathbf{r})|$,
    where $\mathcal{C}$ denotes the conductor surface of the coil winding pack and
    $\mathbf{B}_{\mathrm{total}} = \mathbf{B}_{\mathrm{self}} + \mathbf{B}_{\mathrm{external}}$
    is the vector sum of the coil''s self-field and external fields from other coils,
    passive structures, and the plasma. The magnitude $|\mathbf{B}_{\mathrm{total}}|$
    is always non-negative; $B_{\mathrm{max}}$ carries no directional component.


    The quantity sets the operating point for superconducting strand performance,
    as the critical current density $J_c(B,T)$ degrades with increasing field. Typical
    values range from 2 T for outer shaping coils to 12 T for the central solenoid
    in ITER-class devices. The field magnitude is obtained from electromagnetic equilibrium
    reconstruction or finite-element coil models. This value is used as the parameter
    for evaluating field-dependent critical current limits in superconducting magnet
    design, serving as the abscissa for field-dependent current tables.


    Associated uncertainty depends on the reconstruction quality, coil geometry, and
    plasma scenario; for high-fidelity models, relative uncertainty can be a few percent.
    The relationship between $B_{\mathrm{max}}$ and plasma equilibrium is mediated
    by the poloidal flux, linking to [poloidal_magnetic_flux_at_magnetic_axis] for
    flux-surface geometry and [poloidal_magnetic_flux_at_separatrix] for boundary
    context.'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_magnetic_flux_at_separatrix
  - name:toroidal_magnetic_flux
  sources:
  - id: dd:pf_active/coil/b_field_max
    dd_path: pf_active/coil/b_field_max
    status: composed
- name: outer_radius_of_ferritic_element
  kind: scalar
  status: draft
  description: Outer radius of an annular cross-section ferritic element in the axisymmetric
    machine model.
  documentation: 'The outer radius $R_{\mathrm{out}}$ defines the radial extent of
    an annular cross-section ferritic element in the right-handed cylindrical $(R,
    \phi, Z)$ frame. Together with the inner radius, it determines the radial thickness
    of the annulus, which affects the magnetic circuit properties such as reluctance
    and saturation characteristics. This geometric parameter is used in electromagnetic
    modeling of axisymmetric ferritic components, including iron core segments and
    passive structural elements.


    Sign convention: Positive when the radius extends outward from the machine symmetry
    axis.


    Typical values range from centimeters to meters depending on the ferritic component,
    with larger values for transformer iron cores and smaller values for ferromagnetic
    inserts. This quantity is geometrically independent of the plasma state. See also
    [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop), [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop),
    and [major_radius_of_ferritic_element](name:major_radius_of_ferritic_element)
    for related radial definitions.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:major_radius_of_ferritic_element
  sources:
  - id: dd:ferritic/object/axisymmetric/annulus/radius_outer
    dd_path: ferritic/object/axisymmetric/annulus/radius_outer
    status: skipped
- name: outer_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a passive conducting loop
    element in the poloidal field system.
  documentation: 'The outer radius defines the outermost radial extent of the conducting
    path in a passive loop, such as a toroidally-continuous stabilizing shell or a
    saddle-loop structure. Together with the [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)
    it sets the radial thickness of the annulus, which directly governs the loop''s
    cross-sectional area $A = \pi (r_\text{out}^2 - r_\text{in}^2)$ and therefore
    its electrical resistance $R = \rho \ell / A$ (where $\rho$ is the resistivity
    and $\ell$ the total conductor length). Typical outer radii range from $0.2\,\text{m}$
    in compact spherical tokamaks to $2.0\,\text{m}$ in large conventional devices.
    The quantity is obtained from engineering design specifications and is a static
    geometric input for eddy-current and circuit models in plasma equilibrium and
    stability simulations.


    Sign convention: Positive when measured outward from the machine axis, increasing
    in the major-radius $R$ direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_outer
    dd_path: pf_passive/loop/element/geometry/annulus/radius_outer
    status: composed
- name: resistance_of_passive_loop
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a passive axisymmetric conducting loop,
    such as the vacuum vessel or stabilizing shell, that carries induced eddy currents.
  documentation: The resistance $R_{\text{loop}}$ of a passive axisymmetric conductor
    determines the resistive decay time $\tau = L / R_{\text{loop}}$ of eddy currents
    induced by transient magnetic fields, where $L$ is the loop inductance. This quantity
    governs the passive stabilization of plasma vertical displacements and the penetration
    of poloidal magnetic flux through conducting structures during plasma initiation
    and disruptions. Typical resistance values range from micro-ohms for thick copper
    stabilizing shells to milliohms for stainless-steel vacuum vessels in medium-size
    tokamaks. The resistance depends on the conductor material resistivity and cross-sectional
    area (see [resistivity_of_passive_loop](name:resistivity_of_passive_loop) and
    [area_of_passive_loop](name:area_of_passive_loop)) and is a key input to circuit
    models for electromagnetic analysis. For structural design studies, the ohmic
    power dissipation $P = I^2 R_{\text{loop}}$ in the loop is evaluated together
    with $[current\_of\_passive\_loop\_due\_to\_induction](name:current_of_passive_loop_due_to_induction)$.
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:resistivity_of_passive_loop
  - name:area_of_passive_loop
  - name:current_of_passive_loop_due_to_induction
  sources:
  - id: dd:pf_passive/loop/resistance
    dd_path: pf_passive/loop/resistance
    status: composed
- name: resistance_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a toroidal field coil winding pack,
    defining the resistive voltage drop and power dissipation for circuit analysis.
  documentation: The resistance $R_{\mathrm{TF}}$ of a toroidal field coil determines
    the resistive voltage drop $V = I R_{\mathrm{TF}}$ and ohmic power dissipation
    $P = I^{2} R_{\mathrm{TF}}$ for a given coil current $I$. In superconducting TF
    coils, the resistance is effectively zero under steady-state operation but becomes
    relevant during fast current ramps or quench events when the conductor transitions
    to the normal state. For normal-conducting coils, typical resistance values range
    from micro-ohms (large copper coils) to milliohms (compact water-cooled designs).
    This quantity is essential for coil power supply design, quench detection modeling,
    and estimates of resistive heating in the coil system. See also [current of passive
    loop due to induction](name:current_of_passive_loop_due_to_induction) for induced-current
    effects in conducting structures and [resistivity of plasma facing component](name:resistivity_of_plasma_facing_component)
    for the material-specific property of other tokamak components.
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_passive_loop_due_to_induction
  - name:resistivity_of_plasma_facing_component
