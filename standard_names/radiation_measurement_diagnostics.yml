- name: x1_coordinate_of_soft_xray_detector
  kind: scalar
  status: draft
  description: X1 coordinate of the soft X-ray detector outline vertices in the detector-local
    Cartesian (X1, X2) frame, used to define the polygonal detector boundary for etendue
    and line-of-sight calculations.
  documentation: "The X1 coordinate specifies the position of each vertex of the soft\
    \ X-ray detector's polygonal outline along the first axis of the detector-local\
    \ Cartesian (X1, X2) frame. Together with the companion [X2 coordinate](name:x2_coordinate_of_soft_xray_detector),\
    \ these vertex coordinates fully define the cross-sectional shape of the detector\
    \ aperture. The complete outline is required to compute the etendue \u2014 the\
    \ geometric throughput governing the detector's luminous acceptance \u2014 and\
    \ to trace the lines of sight that determine what fraction of plasma soft X-ray\
    \ emission reaches the channel.\n\nFor a polygonal detector with $N$ vertices,\
    \ the outline is the ordered sequence of $(X1_i,\\,X2_i)$ pairs for $i = 1,\\\
    ldots,N$, with the polygon closed by returning to the first vertex. The detector-local\
    \ (X1, X2) axes are attached to the detector face; their orientation relative\
    \ to the machine cylindrical $(R, \\phi, Z)$ frame is defined by the detector's\
    \ mounting geometry. Typical soft X-ray detector face dimensions range from a\
    \ few millimeters to several centimeters. The analogous first-axis coordinate\
    \ for a neutron detector is [x1_coordinate_of_neutron_detector](name:x1_coordinate_of_neutron_detector).\n\
    \nSign convention: Positive when the vertex is displaced in the positive X1 direction\
    \ from the origin of the detector-local Cartesian (X1, X2) frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x2_coordinate_of_soft_xray_detector
  - name:x1_coordinate_of_neutron_detector
