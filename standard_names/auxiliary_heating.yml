- name: absorbed_power_of_neutral_beam_injector
  kind: scalar
  status: active
  description: Power absorbed by the plasma from a single neutral beam injector after
    subtracting neutral-beam shine-through and fast-ion first-orbit losses from the
    launched injector power.
  documentation: 'Power absorbed by the plasma from a single neutral beam injector
    is the portion of its launched neutral-beam kinetic power deposited through interaction
    with the plasma. It is a non-negative per-injector quantity, distinct from the
    boundary-delivered [power of the neutral beam injector](name:power_of_neutral_beam_injector),
    which is defined before absorption and loss corrections.


    The absorbed power is defined by:


    $$

    P_{\mathrm{abs},j}=P_j-P_{\mathrm{ST},j}-P_{\mathrm{FO},j}

    $$


    where $P_{\mathrm{abs},j}$ is the absorbed power for injector $j$, $P_j$ is its
    launched power at the vessel boundary, $P_{\mathrm{ST},j}$ is the [neutral-beam
    shine-through power](name:power_due_to_neutral_beam_shinethrough), and $P_{\mathrm{FO},j}$
    is the power carried away by fast ions lost on their first orbit.


    This quantity excludes source electrical input, losses upstream of the vessel
    boundary, residual shine-through, and fast-ion first-orbit losses. The all-injector
    launched aggregate is [total power of neutral beam injectors](name:total_power_of_neutral_beam_injector),
    whereas this quantity applies the plasma-interaction corrections to one injector.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_neutral_beam_injector
  - name:power_due_to_neutral_beam_shinethrough
  - name:total_power_of_neutral_beam_injector
  arguments:
  - name: power_of_neutral_beam_injector
    operator: absorbed
    operator_kind: qualifier
- name: power_of_wave_beam
  kind: scalar
  status: active
  description: Power of a wave beam is the cycle-averaged electromagnetic energy-flow
    rate of a coherent RF or microwave beam at a specified propagation or interaction
    stage.
  documentation: 'Power of a wave beam is the cycle-averaged electromagnetic energy-flow
    rate of a coherent RF or microwave beam at a specified propagation or interaction
    stage. A carried-power instance is evaluated through an oriented beam cross-section
    whose positive normal is the local propagation direction; a transferred-power
    instance is the rate at which the beam loses energy to another physical system.


    For harmonic fields represented by peak-amplitude phasors, the carried and transferred
    forms are defined by


    $$

    P_\mathrm{wave\,beam} =

    \begin{cases}

    \displaystyle \int_A \operatorname{Re}\!\left(\tfrac{1}{2}\mathbf{E}\times\mathbf{H}^*\right)\cdot\hat{\mathbf{n}}\,dA,
    & \text{carried through } A,\\[1ex]

    \displaystyle P_\mathrm{in}-P_\mathrm{out}, & \text{transferred from the beam
    over an interaction region}

    \end{cases}

    $$


    where $P_\mathrm{wave\,beam}$ is the wave-beam power, $A$ is the beam cross-section,
    $\mathbf{E}$ is the complex electric-field phasor, $\mathbf{H}^*$ is the complex
    conjugate of the complex magnetic-field-strength phasor, $\operatorname{Re}$ takes
    the real part, and $\hat{\mathbf{n}}$ defines the positive oriented area element
    $d\mathbf{A}=\hat{\mathbf{n}}\,dA$. $P_\mathrm{in}$ and $P_\mathrm{out}$ are carried
    wave-beam powers at the entry and exit of the interaction region, with both surfaces
    oriented along local beam propagation. The factor $1/2$ applies to peak-amplitude
    phasors; for rms phasors the cycle-averaged Poynting vector is formed without
    that factor.


    The time integral over an interval is [wave-beam energy](name:wave_beam_energy).
    [Power of a beam-tracing beam](name:power_of_beam_tracing_beam) is the traced-beam
    specialization, with [initial power of a beam-tracing beam](name:initial_power_of_beam_tracing_beam)
    its value at the initial tracing surface. A staged quantity such as [launched
    power of a wave beam](name:launched_power_of_wave_beam) identifies a particular
    power-flow location, while absorbed or species-resolved deposition, such as [absorbed
    power of a beam-tracing beam](name:absorbed_power_of_beam_tracing_beam), [electron
    absorbed wave power](name:electron_absorbed_wave_power), or [electron absorbed
    power of a beam-tracing beam](name:electron_absorbed_power_of_beam_tracing_beam),
    is distinct from remaining carried power.


    Sign convention: Positive when the net cycle-averaged electromagnetic energy flux
    is in the direction of $\hat{\mathbf{n}}$ for carried power, or when $P_\mathrm{in}>P_\mathrm{out}$
    for transferred power.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_wave_beam
  - name:absorbed_power_of_beam_tracing_beam
  sources:
  - dd_path: ec_launchers/beam/power_launched
