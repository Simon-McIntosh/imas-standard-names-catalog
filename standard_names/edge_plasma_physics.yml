- name: total_momentum_flux
  kind: vector
  status: active
  description: Rate at which linear momentum crosses an oriented surface per unit
    area in the plasma, combining convective, pressure, viscous, and turbulent stress
    contributions.
  documentation: 'The momentum flux describes the rate at which linear momentum crosses
    a unit area of an oriented surface in the plasma. It encompasses convective ram
    pressure, isotropic pressure, and viscous or turbulent stress contributions.


    The momentum-flux tensor for a plasma fluid is:


    $$

    \boldsymbol{\Pi} = \rho\,\mathbf{v}\mathbf{v} + p\,\mathbf{I} + \boldsymbol{\pi}

    $$


    where $\rho$ is mass density, $\mathbf{v}$ is bulk flow velocity, $p$ is scalar
    pressure, $\mathbf{I}$ is the identity tensor, and $\boldsymbol{\pi}$ is viscous
    stress. The momentum current through an oriented surface is $\boldsymbol{\Pi}\cdot\hat{n}$,
    where $\hat{n}$ is its outward unit normal.


    This general quantity includes species- and direction-resolved forms of [momentum
    flux](name:momentum_flux); [toroidal total momentum flux](name:toroidal_total_momentum_flux)
    is one such projection. Its divergence supplies the momentum-transport term in
    fluid momentum balance.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_flux
  - name:toroidal_total_momentum_flux
  arguments:
  - name: momentum_flux
    operator: total
    operator_kind: qualifier
- name: toroidal_total_momentum_flux
  kind: scalar
  status: active
  description: Toroidal component of total edge-plasma momentum-flux density, combining
    advective, pressure, viscous, and turbulent stress contributions.
  documentation: 'This quantity is the toroidal component of the total edge-plasma
    momentum-flux density, representing transport of toroidal linear momentum rather
    than stored momentum or a torque source. It is the toroidal projection of [total
    momentum flux](name:total_momentum_flux).


    The total contribution is defined by


    $$

    \Pi_{\phi}^{\mathrm{tot}} = \Pi_{\phi}^{\mathrm{adv}} + \Pi_{\phi}^{\mathrm{pres}}
    + \Pi_{\phi}^{\mathrm{visc}} + \Pi_{\phi}^{\mathrm{turb}}

    $$


    where $\Pi_{\phi}^{\mathrm{tot}}$ is the total toroidal momentum-flux density
    and the terms represent advective, pressure, viscous, and turbulent-stress contributions,
    respectively. The toroidal direction is $\hat{\phi}$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, with $\hat{R} \times \hat{\phi} = \hat{Z}$.


    Sign convention: Positive when the toroidal momentum-flux component points along
    $\hat{\phi}$, toward increasing toroidal angle $\phi$.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_momentum_flux
  arguments:
