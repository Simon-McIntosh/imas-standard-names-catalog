name: radial_component_of_ion_momentum_flux_limiter
description: Dimensionless coefficient capping the radial ion momentum flux to prevent
  it from exceeding the kinetic free-streaming limit.
documentation: The radial ion momentum flux limiter $\alpha_r^{\rm mom} \in [0,1]$
  is a dimensionless multiplicative factor applied element-wise on a GGD mesh to bound
  the radial component of the ion viscous and convective momentum flux. Without limiting,
  the Braginskii fluid closure can overestimate transport in low-collisionality regions
  where the mean free path exceeds the gradient scale length. The effective flux is
  capped at $\alpha_r^{\rm mom}\, n_i m_i v_{\mathrm{th},i} c_{s,i}$, where $n_i$
  is the ion density ($\mathrm{m^{-3}}$), $m_i$ the ion mass (kg), $v_{\mathrm{th},i}
  = \sqrt{2 T_i / m_i}$ the thermal speed ($\mathrm{m\,s^{-1}}$), and $c_{s,i}$ the
  ion sound speed ($\mathrm{m\,s^{-1}}$). A value of 1 recovers unlimited classical
  transport; smaller values progressively restrict the radial momentum flux toward
  kinetically consistent levels. This limiter is essential in fluid edge codes (SOLPS-ITER,
  EDGE2D, SOLEDGE3X) and is resolved per ion species and, where applicable, per charge
  state. See also `toroidal_component_of_momentum_flux_limiter` and `parallel_component_of_momentum_flux_limiter`
  for the companion directional projections, and `radial_component_of_neutral_momentum_flux_limiter`
  for the neutral analog.
kind: vector_component
unit: '1'
status: draft
