- name: lower_fractional_bound_of_pre_disruptive_quantity_for_linear_decay_interval
  kind: scalar
  status: draft
  description: Lower fractional threshold of a pre-disruptive reference quantity defining
    the end point of a custom linear decay fit interval during a tokamak disruption.
    Expressed as a dimensionless fraction of the pre-disruptive value, with admissible
    range strictly between zero and the corresponding upper fractional threshold.
  documentation: '## Definition


    Let $Q_0$ denote the pre-disruptive value of a physical quantity $Q$ (e.g., plasma
    current, runaway electron current, thermal energy, electron temperature). Define
    the normalized quantity

    $$q(t) = \frac{Q(t)}{Q_0}.$$

    During a disruption, $q(t)$ decays from unity toward zero. This parameter, $X_1$,
    is the **lower** fractional threshold that defines the **end** of the custom linear
    decay fit interval in the $q$-domain.


    ## Fit interval specification


    The linear decay fit is performed over the time window $[t_2,\, t_1]$ defined
    by:

    $$q(t_2) = X_2, \quad q(t_1) = X_1,$$

    where $t_2 < t_1$ because $q$ first crosses $X_2$ (the upper threshold, closer
    to unity) before crossing $X_1$ (this quantity, farther from unity). The linear
    fit to $Q(t)$ over this window yields the user-customized linear decay time.


    ## Admissible range


    $$0 < X_1 < X_2 \leq 1$$


    Typical values for $X_1$ range from 0.1 to 0.8 depending on the observable and
    the disruption phase being characterized.


    ## Ordering clarification


    Although $X_1$ is numerically the smaller threshold, it corresponds to the later
    time $t_1 > t_2$ during monotonic decay. In cases where the decay is not strictly
    monotonic (e.g., due to measurement noise or transient re-heating), the crossing
    times are conventionally taken as the first instances at which $q(t)$ falls through
    each threshold level.


    ## Applicable quantities


    This parameter applies generically to any pre-disruptive reference quantity $Q_0$,
    including the plasma current $I_p$, the runaway electron current, the total thermal
    energy $W_{\mathrm{th}}$, the volume-averaged electron temperature $\langle T_e
    \rangle$, and the on-axis electron temperature $T_{e,\mathrm{axis}}$.'
  unit: '1'
  physics_domain: runaway_electrons
