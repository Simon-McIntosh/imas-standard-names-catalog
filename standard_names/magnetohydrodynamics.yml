- name: bootstrap_current_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Flux-surface-averaged bootstrap current density profile evaluated immediately
    after a sawtooth crash, representing the neoclassical current driven by the pressure
    gradient.
  documentation: 'The bootstrap current density $j_{\mathrm{bs}} = \langle \mathbf{j}_{\mathrm{bs}}
    \cdot \mathbf{B} \rangle / B_0$ is the neoclassical current driven by gradients
    in plasma pressure and temperature in a toroidally confined plasma. It arises
    from the asymmetry between trapped and passing particles in a magnetic field with
    non-uniform strength, and is a key component of the total plasma current in tokamaks,
    contributing to steady-state operation. After a sawtooth crash, the central pressure
    gradient is reduced, leading to a characteristic flattening of the bootstrap current
    profile inside the inversion radius. This quantity is routinely computed in transport
    simulations and equilibrium reconstructions, typically ranging from $0.1 \, \mathrm{A\,m^{-2}}$
    in the far edge to several $\mathrm{kA\,m^{-2}}$ in the core of high-performance
    H-mode plasmas. It is related to the total parallel current density through $j_{\parallel}
    = j_{\mathrm{ohmic}} + j_{\mathrm{bs}} + j_{\mathrm{CD}}$, where $j_{\mathrm{CD}}$
    is the current driven by external heating and current drive systems. See also
    [parallel_current_density_at_post_sawtooth_crash](name:parallel_current_density_at_post_sawtooth_crash)
    and [ohmic_current_density_at_post_sawtooth_crash](name:ohmic_current_density_at_post_sawtooth_crash).


    Sign convention: Positive when the bootstrap current density flows in the direction
    of the total plasma current (increasing toroidal angle $\phi$).'
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:parallel_current_density_at_post_sawtooth_crash
  - name:ohmic_current_density_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/j_bootstrap
    dd_path: sawteeth/profiles_1d/j_bootstrap
    status: composed
- name: current_density_at_post_sawtooth_crash_due_to_bootstrap
  kind: scalar
  status: draft
  description: Flux-surface-averaged neoclassical bootstrap current density profile
    evaluated immediately after a sawtooth crash.
  documentation: "The bootstrap current density $j_{\\rm bs} = \\langle \\mathbf{J}_{\\\
    rm bs} \\cdot \\mathbf{B} \\rangle / B_0$ is a neoclassical current driven by\
    \ the radial pressure gradient in a toroidal plasma, where $\\mathbf{J}_{\\rm\
    \ bs}$ is the bootstrap current density vector, $\\mathbf{B}$ is the magnetic\
    \ field, $B_0$ is the toroidal magnetic field on axis, and $\\langle \\cdot \\\
    rangle$ denotes the flux-surface average. This quantity represents $j_{\\rm bs}$\
    \ evaluated on the flux-surface grid immediately following a sawtooth crash, a\
    \ period when the core pressure gradient is strongly reduced by the internal reconnection\
    \ event)Skip\u2014typically $j_{\\rm bs}$ is small near the axis and rises with\
    \ the pressure gradient toward the pedestal region. After the crash, the bootstrap\
    \ current density profile reshapes as the pressure gradient rebuilds, and it is\
    \ closely linked to the total parallel current density $[\\text{parallel\\_current\\\
    _density\\_at\\_post\\_sawtooth\\_crash}]$ and the ohmic current density $[\\\
    text{ohmic\\_current\\_density\\_at\\_post\\_sawtooth\\_crash}]$.\n\nSign convention:\
    \ Positive when the bootstrap current flows in the same direction as the total\
    \ toroidal plasma current (counter-clockwise when viewed from above)."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - id: dd:sawteeth/profiles_1d/j_bootstrap
    dd_path: sawteeth/profiles_1d/j_bootstrap
    status: composed
- name: diffusion_coefficient_at_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Enhanced diffusion coefficient added to the transport equations to
    model the increased radial transport induced by a magnetic island at the center
    of a neoclassical tearing mode.
  documentation: 'The diffusion coefficient $D_{\mathrm{NTM}}$ represents the anomalous
    cross-field transport enhancement caused by a magnetic island in a neoclassical
    tearing mode (NTM). It appears in the 1-D radial diffusion equation for the electron
    density, $n_e$,


    \[

    \frac{\partial n_e}{\partial t} = \frac{1}{r} \frac{\partial}{\partial r} \left(
    r D_{\mathrm{total}} \frac{\partial n_e}{\partial r} \right),

    \]


    where $D_{\mathrm{total}} = D_{\mathrm{background}} + D_{\mathrm{NTM}}$, with
    $D_{\mathrm{background}}$ the neoclassical or turbulent diffusion in the absence
    of the mode. $D_{\mathrm{NTM}}$ is localized around the island''s O-point, typically
    following a Gaussian or top-hat radial profile with a full width proportional
    to the island width, $w_{\mathrm{island}}$. Typical values range from $10^{-2}\,\mathrm{m}^2/\mathrm{s}$
    in the outer plasma to $10^{1}\,\mathrm{m}^2/\mathrm{s}$ near the pedestal, depending
    on local island width and collisionality. The coefficient is derived from the
    modified Rutherford equation or from experimental fits to the electron density
    profile flattening observed by ECE or reflectometry.'
  unit: m^2.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:thermal_anomalous_diffusivity_at_neoclassical_tearing_mode_center
  - name:radial_neutral_momentum_diffusion_coefficient
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/delta_diff
    dd_path: ntms/time_slice/mode/detailed_evolution/delta_diff
    status: composed
- name: electron_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Total electron number density in the plasma core measured immediately
    after a sawtooth crash, including both thermal and non-thermal electrons.
  documentation: 'This quantity represents the total electron number density at the
    plasma core, evaluated within a few microseconds after a sawtooth crash. Sawtooth
    crashes, commonly observed in tokamak plasmas, are MHD instability events that
    periodically flatten the core profiles. During the crash, core particles and energy
    are redistributed outward. The post-crash electron density is determined from
    the flattening of the density profile after the sawtooth inversion radius, providing
    information on particle transport and confinement in the plasma core. The density
    includes all electron populations (thermal and non-thermal) and is referenced
    from the sawteeth data entry.


    Typical values in fusion-grade devices range from $10^{19}$ to $10^{20}$ m$^{-3}$,
    depending on plasma conditions such as density, current, and heating methods.
    The measurement relies on core diagnostics like Thomson scattering or interferometry,
    sampled at times immediately after sawtooth-induced crashes. The post-crash density
    is usually lower than the pre-crash peak due to the expulsion of particles from
    the core region.


    Sign convention: Positive when the measured electron density is real and non-negative
    (physical density).'
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:thermal_pressure_at_post_sawtooth_crash
  - name:effective_charge_at_post_sawtooth_crash
  - name:parallel_current_density_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/n_e
    dd_path: sawteeth/profiles_1d/n_e
    status: composed
- name: fast_electron_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Number density of suprathermal electrons in the plasma core immediately
    following a sawtooth crash, comprising only the non-thermal population.
  documentation: 'The fast electron number density $n_{\mathrm{e,fast}}$ quantifies
    the density of supra-thermal (non-Maxwellian) electrons generated by mechanisms
    such as lower-hybrid or electron-cyclotron current drive, avalanche processes,
    or runaway acceleration. In the post-sawtooth-crash phase, the reconnection event
    redistributes the current density and flattens the core profiles, leading to a
    transient evolution of $n_{\mathrm{e,fast}}$ that is critical for modeling the
    sawtooth cycle and the subsequent current profile relaxation. Typical values in
    the core of a sawtoothing tokamak range from $10^{17}$ to $10^{19}\ \mathrm{m}^{-3}$,
    depending on the auxiliary heating power and the efficiency of fast-electron generation.
    This quantity is closely related to the total electron density $[\text{electron\_density\_at\_post\_sawtooth\_crash}](name:electron_density_at_post_sawtooth_crash)$
    and to the anisotropic pressure carried by the fast population $[\text{parallel\_fast\_electron\_pressure\_at\_post\_sawtooth\_crash}](name:parallel_fast_electron_pressure_at_post_sawtooth_crash)$.


    Sign convention: Positive when the suprathermal electron density is greater than
    zero (physical number density is a non-negative scalar).'
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:electron_density_at_post_sawtooth_crash
  - name:parallel_fast_electron_pressure_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/n_e_fast
    dd_path: sawteeth/profiles_1d/n_e_fast
    status: composed
- name: frequency_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Rotation frequency of the magnetic island associated with a neoclassical
    tearing mode, measured in the laboratory frame.
  documentation: 'The frequency $f_{\mathrm{NTM}}$ of a neoclassical tearing mode
    (NTM) quantifies the rotation rate of the helical magnetic island in the laboratory
    frame. This rotation is driven primarily by the bulk plasma flow, including toroidal
    rotation and the $E \times B$ drift, and is Doppler shifted from the mode eigenfrequency
    in the plasma rest frame. Typical NTM frequencies range from a few kHz to tens
    of kHz in tokamaks, depending on the plasma toroidal rotation velocity and the
    radial location of the island. In the rotating frame of the island, the tearing
    mode is marginally unstable, governed by the modified Rutherford equation. The
    frequency is routinely inferred from magnetic pickup coils (Mirnov coils) or from
    electron cyclotron emission (ECE) radiometry, which modulate as the island rotates
    past fixed diagnostic lines of sight. The quantity is closely related to the $[\text{phase}](name:phase)$
    evolution of the detected signal and to the $[\text{toroidal mode number}](name:toroidal_mode_number_of_neoclassical_tearing_mode)$
    of the instability.


    Sign convention: Positive when the mode rotates in the direction of the ion diamagnetic
    drift (counter-clockwise viewed from above).'
  unit: Hz
  physics_domain: magnetohydrodynamics
  links:
  - name:phase
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/frequency
    dd_path: ntms/time_slice/mode/detailed_evolution/frequency
    status: attached
  - id: dd:ntms/time_slice/mode/frequency
    dd_path: ntms/time_slice/mode/frequency
    status: skipped
- name: major_radius_of_halo_boundary
  kind: scalar
  status: draft
  description: Major radius coordinate of the outboard boundary between the confined
    plasma and the halo region during a disruption.
  documentation: "The major radius of the halo boundary defines the radial coordinate\
    \ $R_{\\mathrm{halo}}$ of the interface separating the confined plasma from the\
    \ halo region, where open field lines carry large halo currents during the thermal\
    \ and current quench phases of a disruption. This interface is typically identified\
    \ as the outboard separatrix of the last closed flux surface at the time of the\
    \ peak halo current, and its radial position influences both the path length and\
    \ the inductance of the halo current circuit. Measured from equilibrium reconstructions\
    \ that resolve the evolving magnetic geometry during the disruption; typical $R_{\\\
    mathrm{halo}}$ values span 1.5\u20133.0 m in medium-size tokamaks, moving outward\
    \ as the plasma displaces vertically and contracts. Related geometric parameters\
    \ include the vertical coordinate of the same boundary and the major radius of\
    \ the strike point [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ on the divertor targets, together with the major radius of the first wall [major_radius_of_wall](name:major_radius_of_wall)\
    \ which bounds the halo region at the outer side.\n\nSign convention: Positive\
    \ when measured outward from the machine symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:major_radius_of_strike_point
  - name:major_radius_of_wall
  sources:
  - id: dd:disruption/halo_currents/area/end_point/r
    dd_path: disruption/halo_currents/area/end_point/r
    status: composed
  - id: dd:disruption/halo_currents/area/start_point/r
    dd_path: disruption/halo_currents/area/start_point/r
    status: composed
- name: major_radius_of_wall
  kind: scalar
  status: draft
  description: Major radius coordinate of a user-defined point on the tokamak wall,
    used in disruption halo current path analysis.
  documentation: 'The major radius $R_{\text{wall}}$ of an active wall point is the
    $R$ coordinate in the right-handed cylindrical $(R,\phi,Z)$ frame of a specific
    point on the tokamak wall. This point is used as a boundary for halo current path
    analysis during disruptions, where the plasma current continues to flow through
    the scrape-off layer and into the wall. The active wall point is typically one
    of a set of discrete points defining the wall contour, and its major radius is
    extracted for geometric calculations in disruption simulations. Typical $R$ values
    range from 0.5 to 5 m, depending on the tokamak''s inner and outer wall radii.
    Cross-reference with `[major_radius_of_current_center](name:major_radius_of_current_center)`
    for the plasma current centroid and `[poloidal_current_over_halo_region](name:poloidal_current_over_halo_region)`
    for the associated current.


    Sign convention: Positive when $R$ increases radially outward from the machine
    symmetry axis.


    Major radius coordinate of a user-defined point on the tokamak wall, used in disruption
    halo current path analysis.'
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:major_radius_of_current_center
  - name:poloidal_current_over_halo_region
  sources:
  - id: dd:disruption/halo_currents/active_wall_point/r
    dd_path: disruption/halo_currents/active_wall_point/r
    status: composed
- name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  kind: scalar
  status: draft
  description: Value of the normalized toroidal flux coordinate at the sawtooth inversion
    radius, the surface where the q profile equals unity and the reconnection event
    originates.
  documentation: 'The normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}
    = \sqrt{\Phi/\Phi_{\mathrm{sep}}}$ evaluated at the sawtooth inversion radius
    $r_{\mathrm{inv}}$. This radial position marks the location where the safety factor
    $q = 1$ in a tokamak plasma and defines the boundary between the sawtooth mixing
    region (inside) and the unaffected outer plasma. The inversion radius is identified
    from soft-X-ray or electron-cyclotron emission (ECE) measurements as the radius
    where the sawtooth perturbation changes sign. In typical H-mode plasmas, $r_{\mathrm{inv}}$
    lies at $\rho_{\mathrm{tor,norm}} \approx 0.3\!-\!0.5$, with the exact value depending
    on plasma current and internal inductance. See also [normalized_poloidal_flux_coordinate_at_pedestal](name:normalized_poloidal_flux_coordinate_at_pedestal).


    Sign convention: Positive when $\rho_{\mathrm{tor,norm}}$ increases radially outward
    from the magnetic axis to the separatrix.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_poloidal_flux_coordinate_at_pedestal
  sources:
  - id: dd:sawteeth/diagnostics/rho_tor_norm_inversion
    dd_path: sawteeth/diagnostics/rho_tor_norm_inversion
    status: composed
- name: ohmic_current_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Current density driven by the inductive toroidal electric field via
    Ohm's law, evaluated as radial profiles immediately after a sawtooth crash.
  documentation: "The ohmic current density is the component of the current density\
    \ driven by the inductive toroidal electric field generated during the current\
    \ ramp-up or decay. It is defined via Ohm's law as $j_\\mathrm{ohmic} = \\sigma\
    \ E_\\phi$, where $\\sigma$ is the parallel electrical conductivity and $E_\\\
    phi$ is the toroidal electric field. After a sawtooth crash, the central current\
    \ density is partially flattened, and this quantity captures the subsequent re-distribution\
    \ of the ohmic current. Typical values range from 0.1 to 10 MA/m\xB2 depending\
    \ on the plasma conditions. The radial profile is evaluated on a flux-surface\
    \ grid.\n\nSign convention: Positive when the current flows in the direction of\
    \ increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:parallel_electric_field_at_post_sawtooth_crash
  - name:radial_current_density_due_to_parallel_viscosity
  sources:
  - id: dd:sawteeth/profiles_1d/j_ohmic
    dd_path: sawteeth/profiles_1d/j_ohmic
    status: composed
- name: ohmic_energy_over_halo_region
  kind: scalar
  status: draft
  description: Cumulative ohmic dissipation energy deposited in the halo region during
    a disruption.
  documentation: The ohmic energy in the halo region is the time integral of the ohmic
    heating power dissipated resistively by the poloidal or toroidal halo current
    flowing through the halo plasma during a disruption. This energy contributes to
    the total disruption energy balance and is a key input for assessing heat loads
    on plasma-facing components. The total ohmic energy is related to the ohmic power
    via $E_{\text{ohm,halo}} = \int P_{\text{ohm,halo}} \, dt$, where $P_{\text{ohm,halo}}$
    is the instantaneous ohmic power. Typical values range from tens of kilojoules
    in small tokamaks to tens of megajoules in large devices like ITER. This quantity
    is estimated from resistive dissipation models using measured halo currents and
    estimated halo resistivity. See also [ohmic_power_over_halo_region_due_to_ohmic_dissipation](name:ohmic_power_over_halo_region_due_to_ohmic_dissipation)
    and the total [ohmic_energy](name:ohmic_energy) over the disruption.
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:ohmic_power_over_halo_region_due_to_ohmic_dissipation
  - name:ohmic_energy
  sources:
  - id: dd:disruption/global_quantities/energy_ohm_halo
    dd_path: disruption/global_quantities/energy_ohm_halo
    status: composed
- name: parallel_current_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Flux-surface-averaged projection of the plasma current density vector
    onto the local magnetic field direction, evaluated immediately after a sawtooth
    crash.
  documentation: "The parallel current density $j_\\parallel = \\langle \\mathbf{j}\
    \ \\cdot \\mathbf{B} \\rangle / B_0$ is the flux-surface-averaged component of\
    \ the electric current density along the equilibrium magnetic field, where $\\\
    langle \\cdot \\rangle$ denotes the flux-surface average, $\\mathbf{j}$ is the\
    \ current density vector, $\\mathbf{B}$ is the magnetic field vector, and $B_0$\
    \ is the on-axis vacuum toroidal field. This quantity drives the local safety-factor\
    \ evolution and determines the post-crash magnetic equilibrium. It is evaluated\
    \ immediately after a sawtooth crash, during which magnetic reconnection flattens\
    \ the core current profile, typically reducing the central current density. The\
    \ post-crash parallel current density is reconstructed from motional Stark effect\
    \ measurements or equilibrium codes such as EFIT and LIUQE. In tokamaks, the central\
    \ value is on the order of 1\u201310 MA/m\xB2, depending on plasma current and\
    \ size. This quantity complements the ohmic current density component at the same\
    \ time slice.\n\nSign convention: Positive when the flux-surface-averaged current\
    \ flows along the direction of the equilibrium magnetic field, i.e., in the $+\\\
    hat{\\phi}$ direction for a standard tokamak with positive toroidal field."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - id: dd:sawteeth/profiles_1d/j_total
    dd_path: sawteeth/profiles_1d/j_total
    status: composed
- name: parallel_electric_field_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Projection of the electric field vector onto the local magnetic field
    direction, evaluated immediately after a sawtooth crash.
  documentation: The parallel electric field $E_\parallel$ is given by $E_\parallel
    = (\mathbf{E} \cdot \mathbf{B}) / |\mathbf{B}|$, where $\mathbf{E}$ is the electric
    field vector, $\mathbf{B}$ is the local magnetic field vector, and $|\mathbf{B}|$
    is the magnitude of the local magnetic field. Evaluated at a time point immediately
    after a sawtooth crash, this quantity is typically derived from the loop voltage
    measurement and the local magnetic geometry. Typical values during the post-crash
    phase range from 0.01 to 0.1 V/m in present-day tokamaks. The local magnetic field
    is the total magnetic field at the measurement location, not a vacuum or reference
    field.
  unit: V.m^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:parallel_fast_electron_pressure_at_post_sawtooth_crash
  - name:parallel_electric_field
  sources:
  - id: dd:sawteeth/profiles_1d/e_field_parallel
    dd_path: sawteeth/profiles_1d/e_field_parallel
    status: composed
- name: parallel_pressure_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Parallel component of the total plasma pressure tensor, summing all
    thermal and suprathermal species, evaluated after a sawtooth crash.
  documentation: "The parallel pressure $p_\\parallel$ is the component of the anisotropic\
    \ pressure tensor along the local magnetic field direction. It is computed as\
    \ the sum of the parallel pressures of all thermal and suprathermal electron and\
    \ ion species, incorporating contributions from both the Maxwellian and fast-particle\
    \ populations. In the immediate aftermath of a sawtooth crash, the pressure anisotropy\
    \ $p_\\parallel - p_\\perp$ reveals the interplay between fast-particle redistribution\
    \ and MHD relaxation, with typical core values in the range 10\u2013100 kPa for\
    \ ITER-relevant scenarios. The quantity is reconstructed by combining equilibrium\
    \ solvers with kinetic-profile measurements from Thomson scattering and charge-exchange\
    \ recombination spectroscopy. Together with [perpendicular_pressure_at_post_sawtooth_crash](name:perpendicular_pressure_at_post_sawtooth_crash)\
    \ it forms the full pressure tensor, while [thermal_pressure_at_post_sawtooth_crash](name:thermal_pressure_at_post_sawtooth_crash)\
    \ gives the isotropic thermal component. \n\nSign convention: Positive when the\
    \ plasma pressure acts to expand the flux surface outward.\n\nThis scalar quantity\
    \ is always positive for a confined plasma; its sign convention references the\
    \ direction of the resulting diamagnetic current density."
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:perpendicular_pressure_at_post_sawtooth_crash
  - name:thermal_pressure_at_post_sawtooth_crash
  sources:
  - id: dd:plasma_profiles/ggd/pressure_parallel/values
    dd_path: plasma_profiles/ggd/pressure_parallel/values
    status: attached
  - id: dd:sawteeth/profiles_1d/pressure_parallel
    dd_path: sawteeth/profiles_1d/pressure_parallel
    status: composed
- name: perpendicular_pressure_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Perpendicular component of the total plasma pressure tensor, summed
    over all species, evaluated immediately after a sawtooth crash.
  documentation: 'The perpendicular pressure $p_\perp$ is the component of the anisotropic
    pressure tensor perpendicular to the local magnetic field direction, defined as
    $p_\perp = p_{\rm total} + (B^2/\mu_0)\Delta$ for a bi-Maxwellian distribution,
    where $\Delta$ measures the pressure anisotropy. This quantity sums the perpendicular
    contributions from thermal electrons, thermal ions, and suprathermal (fast) particle
    populations. Immediately after a sawtooth crash, the perpendicular pressure profile
    is flattened inside the mixing radius due to the magnetic reconnection event,
    with typical values ranging from tens of kPa on axis to a few kPa near the inversion
    radius. The perpendicular pressure is routinely inferred from equilibrium reconstruction
    constrained by magnetic and kinetic profile diagnostics, and together with the
    parallel pressure [parallel_pressure_at_post_sawtooth_crash](name:parallel_pressure_at_post_sawtooth_crash)
    it quantifies the degree of pressure anisotropy in the post-crash state.


    Sign convention: Positive for compressive stress, representing an outward force,
    by the standard pressure sign convention.'
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:parallel_pressure_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/pressure_perpendicular
    dd_path: sawteeth/profiles_1d/pressure_perpendicular
    status: composed
- name: poloidal_mode_number_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Poloidal mode number (m) characterizing the helicity of the magnetic
    island associated with a neoclassical tearing mode.
  documentation: 'The poloidal mode number $m$ is the integer Fourier harmonic index
    describing how many toroidal circuits a magnetic field line makes per single poloidal
    transit of the magnetic island. For a neoclassical tearing mode, $m$ and the toroidal
    mode number $n$ $(n = m/q)$ together specify the resonant rational surface where
    $q = m/n$. Typical NTM mode numbers in tokamaks range from $m = 2$ to $m = 5$,
    with $m/n = 2/1$, $3/2$, and $4/3$ being commonly observed. The mode number is
    inferred from Mirnov coil arrays or ECE radiometry through toroidal and poloidal
    array correlation analysis.


    Sign convention: Positive when $m$ increases with the poloidal harmonic index,
    with no dependence on the toroidal sign convention.


    See also [toroidal_mode_number_of_neoclassical_tearing_mode](name:toroidal_mode_number_of_neoclassical_tearing_mode)
    for the companion toroidal harmonic, and [frequency_of_neoclassical_tearing_mode](name:frequency_of_neoclassical_tearing_mode)
    for the island rotation frequency at the corresponding resonant surface.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  - name:frequency_of_neoclassical_tearing_mode
