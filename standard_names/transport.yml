    version: 4.1.0
- name: total_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume for the complete
    local population, combining thermal and fast electrons rather than selecting one
    population component.
  documentation: 'Number density of free electrons per physical volume for the complete
    local electron population is the local continuum count density of electrons not
    bound to atoms, molecules, or ions, including both thermal and fast nonthermal
    contributions.


    The complete local electron density is defined by:


    $$

    n_e^{\mathrm{total}} = n_e^{\mathrm{thermal}} + n_e^{\mathrm{fast}}

    $$


    where $n_e^{\mathrm{total}}$ is the complete local free-electron number density,
    $n_e^{\mathrm{thermal}}$ is the density of the local thermal electron population
    represented by [thermal electron density](name:thermal_electron_density), and
    $n_e^{\mathrm{fast}}$ is the density of the local fast, nonthermal electron population
    represented by [fast electron density](name:fast_electron_density).


    This quantity applies locally to the full free-electron population and is aggregated
    over its thermal and fast components. It excludes electrons bound in atoms, molecules,
    or ions, and it is not restricted to either population component. It is also distinct
    from [line-averaged electron density](name:line_averaged_electron_density) and
    [volume-averaged electron density](name:volume_averaged_electron_density), which
    apply spatial averaging rather than a local evaluation.


    As the complete-population form of [electron density](name:electron_density),
    it includes both thermal and nonthermal contributions. Integrating this local
    quantity over a specified plasma volume gives [volume-integrated total electron
    density](name:volume_integrated_total_electron_density), whereas the component
    names retain only one electron population.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:thermal_electron_density
  - name:fast_electron_density
  - name:line_averaged_electron_density
  - name:volume_averaged_electron_density
  - name:electron_density
