- name: y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Y-axis projection of the unit vector encoding the instantaneous movement
    direction of the steerable electron cyclotron (EC) launcher mirror in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.
  documentation: 'The quantity $d_y = \hat{d} \cdot \hat{y}$ is the $y$-component
    of the mirror direction unit vector $\hat{d} = (d_x, d_y, d_z)$, which specifies
    how the EC launcher mirror is currently moving as it steers the injected microwave
    beam toward its intended deposition location in the plasma. Together with [x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror),
    it completes the Cartesian triplet satisfying the unit-vector constraint $d_x^2
    + d_y^2 + d_z^2 = 1$. The parent quantity [direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    encodes the full three-dimensional movement direction; this component isolates
    the horizontal $y$-axis contribution in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ frame co-located with the launcher assembly. The component
    is dimensionless and bounded on $[-1, 1]$; a value of $\pm 1$ indicates movement
    purely along $\pm\hat{y}$, while zero means the mirror moves with no $y$-axis
    component. This quantity is used in beam-steering control systems and ray-tracing
    codes to compute the beam injection angle and the corresponding deposition location
    in the plasma, complementing the orientation frame defined by [first_unit_vector_of_electron_cyclotron_launcher_mirror](name:first_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [second_unit_vector_of_electron_cyclotron_launcher_mirror](name:second_unit_vector_of_electron_cyclotron_launcher_mirror).


    Sign convention: Positive when the mirror movement direction has a component along
    $+\hat{y}$ in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  - name:z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
