name: perturbed_electrostatic_potential_parity
status: draft
cocos_transformation_type: one_like
description: Parity label of the perturbed electrostatic potential eigenmode under
  reflection about the outboard midplane ($\theta = 0$).
documentation: In linear gyrokinetic eigenvalue problems the perturbed electrostatic
  potential $\delta\phi(\theta)$ along the field line can be classified by its symmetry
  under the transformation $\theta \to -\theta$, where $\theta$ is the ballooning-coordinate
  poloidal angle. A parity value of $+1$ denotes an even (ballooning) mode with $\delta\phi(-\theta)
  = \delta\phi(\theta)$, which is the dominant parity for ion-temperature-gradient
  (ITG) and trapped-electron-mode (TEM) instabilities that peak at the outboard midplane.
  A parity value of $-1$ denotes an odd (tearing) mode with $\delta\phi(-\theta) =
  -\delta\phi(\theta)$, relevant for microtearing and kinetic ballooning modes. This
  discrete label is used by gyrokinetic codes (e.g., GS2, GENE, CGYRO) to separate
  or filter eigenmodes in stability spectra. When mixed parity is present the quantity
  may take intermediate or code-specific flag values.
