name: tendency_of_electron_temperature
status: draft
cocos_transformation_type: one_like
description: Time derivative of the bulk electron temperature, $\partial T_e / \partial
  t$.
documentation: Represents $\partial T_e / \partial t$ (eV s$^{-1}$ effectively, though
  stored with unit eV as the temporal-derivative context is embedded in the 'tendency'
  transformation), quantifying how fast the electron thermal channel evolves at each
  radial location. The electron energy balance $\frac{3}{2} n_e \partial T_e/\partial
  t = -\nabla \cdot \mathbf{q}_e + Q_{\mathrm{heat}} - Q_{\mathrm{rad}} - Q_{ei}$
  couples this tendency to the divergence of the electron heat flux $\mathbf{q}_e$,
  external heating power density $Q_{\mathrm{heat}}$, radiated power density $Q_{\mathrm{rad}}$,
  and electron-ion energy exchange $Q_{ei}$. Transport solvers advance $T_e$ using
  this derivative; during sawtooth crashes $|\partial T_e/\partial t|$ can reach $\sim
  10^6$ eV s$^{-1}$, while steady-state phases yield near-zero values. Diagnostic
  validation relies on high-time-resolution Thomson scattering and ECE measurements.
  See `derivative_of_electron_temperature_with_respect_to_normalized_toroidal_flux_coordinate`
  for the spatial gradient.
