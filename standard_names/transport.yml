- name: co_passing_fast_particle_density
  kind: scalar
  status: draft
  description: Number density of suprathermal particles in the co-passing orbit class,
    from the fast-particle distribution function restricted to the co-passing region
    of velocity space.
  documentation: 'Co-passing fast particle density is the number of non-thermal particles
    per unit physical volume whose guiding-center orbits are passing and belong to
    the co-passing branch. It is a partial zeroth moment of the fast-particle distribution
    function, complementary to the counter-passing and trapped fast-particle contributions.


    The density at position $\mathbf{x}$ is defined by integrating the fast-particle
    distribution over the co-passing velocity-space domain:


    $$

    n_{\mathrm{fast}}^{\mathrm{co}}(\mathbf{x}) = \int_{\Omega_{\mathrm{co}}(\mathbf{x})}
    f_{\mathrm{fast}}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $f_{\mathrm{fast}}$ is the suprathermal distribution function with units
    $\mathrm{s^3\,m^{-6}}$, $\mathbf{x}$ is position in m, $\mathbf{v}$ is particle
    velocity in m s$^{-1}$, $d^3v$ has units m$^3$ s$^{-3}$, and $\Omega_{\mathrm{co}}(\mathbf{x})$
    is the subset of velocity space corresponding to co-passing orbits. The trapped-passing
    boundary is set by magnetic geometry and particle invariants such as energy and
    magnetic moment; in pitch coordinates it should be treated as the local trapped-passing
    separatrix rather than a universal pitch cutoff.


    In practice, this quantity is computed by applying an orbit-classification operator
    to a kinetic fast-particle distribution and taking the partial zeroth moment over
    the co-passing domain. The same definition applies whether the distribution is
    expressed in Cartesian velocity, energy-pitch, or guiding-center variables, provided
    the appropriate velocity-space Jacobian is included. When the orbit classes form
    a complete disjoint partition, the total fast-particle density is the sum of the
    co-passing, counter-passing, and trapped contributions.


    Typical values are strongly scenario dependent because fast-particle populations
    are set by sources, slowing-down, redistribution, and loss processes. Representative
    values can range from below $10^{14}$ m$^{-3}$ in weak suprathermal populations
    to $10^{17}$-$10^{19}$ m$^{-3}$ in strongly heated or fusion-product-rich plasmas,
    usually remaining below the bulk thermal particle density.'
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/density_fast
    dd_path: distributions/distribution/profiles_1d/co_passing/density_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/density_fast
    dd_path: distributions/distribution/profiles_2d/co_passing/density_fast
    status: attached
- name: co_passing_thermal_particle_source_rate
  kind: scalar
  status: draft
  description: Flux-surface-averaged volumetric source rate of thermal particle density
    for the co-passing orbit population. It represents the net rate at which particles
    are added to or removed from that orbit class.
  documentation: 'Co-passing thermal particle source rate is the rate per unit volume
    at which thermal particles enter or leave the co-passing passing-orbit population
    after averaging over a magnetic flux surface. Co-passing denotes the passing orbit
    class whose guiding-center motion is aligned with the reference plasma-current
    direction, complementary to counter-passing and trapped orbit classes.


    It is the source term in the flux-surface-averaged particle balance for the co-passing
    population:


    $$

    \frac{\partial \langle n_{\mathrm{cp}}\rangle_\rho}{\partial t}

    + \frac{1}{V''}\frac{\partial}{\partial \rho}\left(V''\left\langle \boldsymbol{\Gamma}_{\mathrm{cp}}\cdot\nabla\rho\right\rangle_\rho\right)

    = \langle S_{\mathrm{cp}}\rangle_\rho

    $$


    where $\langle\cdot\rangle_\rho$ denotes an average over the magnetic flux surface
    labeled by the dimensionless radial flux coordinate $\rho$, $V''=dV/d\rho$ is
    the differential volume in $\mathrm{m^3}$, $n_{\mathrm{cp}}$ is the co-passing
    thermal-particle density in $\mathrm{m^{-3}}$, $\boldsymbol{\Gamma}_{\mathrm{cp}}$
    is the particle flux density in $\mathrm{m^{-2}\,s^{-1}}$, and $S_{\mathrm{cp}}$
    is the volumetric source rate in $\mathrm{m^{-3}\,s^{-1}}$.


    In practice this quantity is obtained from kinetic or transport modeling by integrating
    the modeled collisional, wave-particle, and orbit-class transition terms over
    the co-passing part of velocity space and over the flux surface. It may also be
    inferred as the residual source required by a particle balance when the co-passing
    density evolution and radial particle flux are known.


    No device-independent typical magnitude follows from the definition alone, because
    the value depends on species, radial location, distribution function, wave fields,
    collision rates, and the chosen separation between passing and trapped orbit classes.
    A useful scale is the particle replacement time $\tau_{\mathrm{cp}}=\langle n_{\mathrm{cp}}\rangle_\rho/|\langle
    S_{\mathrm{cp}}\rangle_\rho|$; for example, $10^{20}\ \mathrm{m^{-3}\,s^{-1}}$
    changes a $10^{19}\ \mathrm{m^{-3}}$ co-passing population on a 0.1 s time scale.


    Sign convention: Positive when local processes add thermal particles to the co-passing
    orbit population.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/source/particles
    dd_path: distributions/distribution/profiles_1d/co_passing/source/particles
    status: composed
- name: counter_passing_fast_particle_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Local collisional power density for the counter-passing part of a fast-particle
    distribution. It is the rate at which Coulomb collisions with the included charged
    collision partners change the kinetic-energy density of counter-passing fast particles.
  documentation: 'Counter-passing fast-particle collisional power density is the local
    rate at which Coulomb collisions change the kinetic-energy density of fast particles
    in the counter-passing orbit class. The counter-passing class contains passing
    guiding-center trajectories whose parallel transit is opposite to the reference
    co-passing direction, and this quantity is a collisional source or sink for that
    class rather than its stored energy.


    For fast species $a$, it is commonly evaluated as the second velocity moment of
    the Coulomb collision operator restricted to counter-passing phase space:


    $$

    P_{\mathrm{cp}}^{\mathrm{coll}}(\mathbf{x}) = \sum_{a\in\mathrm{fast}} \sum_b
    \int_{\Omega_{\mathrm{cp}}} \frac{1}{2} m_a v^2 C_{ab}[f_a,f_b](\mathbf{x},\mathbf{v})
    \, d^3v

    $$


    where $P_{\mathrm{cp}}^{\mathrm{coll}}$ has units $W m^{-3}$, $\mathbf{x}$ is
    position in meters, $m_a$ is the fast-particle mass in kg, $v=|\mathbf{v}|$ is
    speed in $m s^{-1}$, $f_a$ has units $m^{-3}(m s^{-1})^{-3}$, and $C_{ab}$ has
    units $m^{-3}(m s^{-1})^{-3}s^{-1}$ and gives the time derivative of $f_a$ due
    to Coulomb collisions with partner species $b$. The index $b$ denotes the charged
    collision partners included in the kinetic model, typically thermal electrons,
    main ions, impurity ions, and other fast species only when fast-fast collisions
    are explicitly retained; for a partner-resolved quantity the corresponding single
    $b$ term is used instead of the full sum. The use of $C_{ab}$, not $f_a$, makes
    this an energy-transfer rate and not the kinetic-energy density of the counter-passing
    particles.


    This quantity is not measured directly. It is inferred by applying a Fokker-Planck
    or guiding-center collision operator to a fast-particle distribution constrained
    by diagnostics and by the local background plasma density, temperature, composition,
    and magnetic equilibrium.


    Typical magnitudes range from 10^2-10^5 W m^-3 for weak fast-particle tails or
    outer-plasma regions to 10^5-10^7 W m^-3 in core regions with strong neutral-beam,
    radio-frequency, or alpha-particle populations. Values can be close to zero where
    the counter-passing population is small or nearly collisionally equilibrated.


    Sign convention: Positive when Coulomb collisions increase the kinetic-energy
    density of the counter-passing fast-particle population.'
  unit: W.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/collisions/electrons/power_fast
    dd_path: distributions/distribution/profiles_1d/counter_passing/collisions/electrons/power_fast
    status: composed
- name: counter_passing_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged volumetric energy source rate for the counter-passing
    orbit population. It is the local power density transferred to or from that population
    by wave-particle interactions, collisions, or particle sources.
  documentation: 'Counter-passing power density is the flux-surface-averaged rate
    at which kinetic energy is added to the counter-passing orbit population per unit
    physical volume. Counter-passing refers to the passing part of velocity space
    whose guiding-center motion is opposite to the co-passing direction; it excludes
    trapped orbits.


    A kinetic definition is the energy moment of the net source operator over the
    counter-passing velocity-space domain, followed by a flux-surface average:


    $$

    S_{\mathrm{cp}}^{\varepsilon}(\rho,t) = \left\langle \int_{\Omega_{\mathrm{cp}}}
    \frac{1}{2} m_s v^2\, \mathcal{S}_s(\mathbf{x},\mathbf{v},t)\, d^3v \right\rangle_{\rho}

    $$


    where $S_{\mathrm{cp}}^{\varepsilon}$ has units W m$^{-3}$, $\rho$ is a radial
    flux-surface label in flux coordinates $(\rho,\theta,\phi)$, $\Omega_{\mathrm{cp}}$
    is the counter-passing velocity-space domain, $m_s$ is the species mass in kg,
    $v=|\mathbf{v}|$ is speed in m s$^{-1}$, and $d^3v$ has units m$^3$ s$^{-3}$.
    The operator $\mathcal{S}_s$ is the net time rate of change of the distribution
    function from sources, collisions, and wave interactions; if $\int f_s d^3v$ is
    a number density in m$^{-3}$, then $\mathcal{S}_s$ has units s$^2$ m$^{-6}$. The
    notation $\langle A\rangle_{\rho}$ denotes the flux-surface average at fixed $\rho$,
    equivalently the surface integral of $A$ weighted by $1/|\nabla\rho|$ divided
    by the corresponding weighted surface area.


    In practice this quantity is computed from kinetic or Fokker-Planck models by
    taking the velocity-space energy moment of the relevant collision, external source,
    and wave-particle operators over the counter-passing domain. It is constrained
    indirectly by deposited heating, fast-particle measurements, loss measurements,
    and power-balance analysis. Together with [co_passing_power_density](name:co_passing_power_density)
    and [trapped_power_density](name:trapped_power_density), it partitions the orbit-integrated
    [power_density](name:power_density).


    Typical magnitudes are 10$^3$-10$^6$ W m$^{-3}$ in auxiliary-heated tokamak plasmas,
    with localized radio-frequency or neutral-beam deposition reaching about 10$^7$
    W m$^{-3}$. Weakly driven regions can be near zero, and collisional drag or loss
    terms can give negative values with comparable magnitudes.


    Sign convention: Positive when the counter-passing orbit population gains kinetic
    energy from the net source operator.'
  unit: W.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/source/energy
    dd_path: distributions/distribution/profiles_1d/counter_passing/source/energy
    status: composed
- name: fast_electron_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Coulomb-collisional power density received by the fast electron population.
    It is the volumetric rate of kinetic-energy exchange between suprathermal electrons
    and other plasma species.
  documentation: 'Fast-electron collisional power density is the local rate per unit
    volume at which Coulomb collisions transfer kinetic energy to the suprathermal
    electron population. It represents the fast-electron channel of electron collisional
    energy exchange; together with the thermal-electron channel it forms the total
    electron collisional power density.


    The quantity is the kinetic-energy moment of the Fokker-Planck collision operator
    for the fast-electron distribution:


    $$

    P_{e,\mathrm{fast}}^{\mathrm{coll}} = \sum_s \int \frac{1}{2} m_e v^2\, C_{es}[f_{e,\mathrm{fast}},
    f_s](\mathbf{v})\, d^3v

    $$


    where the sum is over collision partners $s$, $f_{e,\mathrm{fast}}$ is normalized
    so that $\int f_{e,\mathrm{fast}}\,d^3v$ gives the fast-electron density, $f_s$
    is the distribution of species $s$, $m_e$ is the electron mass in kg, $v=|\mathbf{v}|$
    is speed in m/s, and $C_{es}$ has units of $f_{e,\mathrm{fast}}$ per second. With
    these definitions the integral has units of W m^-3. For relativistic fast electrons,
    the kinetic-energy weight is replaced by the appropriate relativistic kinetic
    energy.


    In practice this quantity is computed by applying a Coulomb collision operator
    to a modeled or reconstructed fast-electron distribution and integrating over
    velocity space. If the fast population is partitioned by orbit class, the co-passing,
    counter-passing, and trapped components sum to this quantity when the same collision
    model and phase-space partition are used.


    Typical local absolute magnitudes are scenario dependent: about 10^2-10^5 W m^-3
    for weak suprathermal tails, 10^5-10^7 W m^-3 in strongly driven electron-heating
    or current-drive cases, and up to 10^8 W m^-3 or more in localized runaway-electron
    regimes. During ordinary slowing down, the value is often negative because fast
    electrons transfer energy to the thermal plasma.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy to the
    fast electron population.'
  unit: W.m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/collisions/electrons/power_fast
    dd_path: distributions/distribution/profiles_1d/collisions/electrons/power_fast
    status: composed
- name: fast_electron_source_rate_due_to_dreicer
  kind: scalar
  status: draft
  description: Density source rate of fast electrons due to the Dreicer generation
    mechanism, in which a parallel electric field accelerates high-energy tail electrons
    faster than Coulomb collisions slow them. It refers to the fast-electron population;
    the analogous runaway-electron term uses runaway-electron nomenclature.
  documentation: 'Fast-electron source rate due to Dreicer generation is the local
    volumetric production rate of fast electrons created when the parallel electric
    field accelerates suprathermal tail electrons through collisional drag. It is
    a contribution to the total [fast_electron_source_rate](name:fast_electron_source_rate)
    and describes the same primary electric-field generation channel as [runaway_electron_source_rate_due_to_dreicer](name:runaway_electron_source_rate_due_to_dreicer),
    with the population labeled as fast electrons rather than specifically runaway
    electrons. It is distinct from avalanche multiplication and from hot-tail generation.


    The model-independent definition is the Dreicer contribution to the fast-electron
    density balance:


    $$

    S_\mathrm{D} = \left.\frac{\partial n_\mathrm{fast}}{\partial t}\right|_\mathrm{Dreicer}

    $$


    where $S_\mathrm{D}$ is the fast-electron source rate due to Dreicer generation
    in $\mathrm{m^{-3}\,s^{-1}}$, $n_\mathrm{fast}$ is the fast-electron number density
    in $\mathrm{m^{-3}}$, $t$ is time in $\mathrm{s}$, and the subscript denotes the
    part of the density time derivative caused by the Dreicer mechanism alone.


    The rate is usually inferred from analytic runaway-source formulas or kinetic
    Fokker-Planck modeling rather than measured as an isolated observable. Inputs
    typically include electron density $n_e$ in $\mathrm{m^{-3}}$, electron temperature
    $T_e$ in eV or J, effective charge $Z_\mathrm{eff}$ with unit 1, Coulomb logarithm
    $\ln\Lambda$ with unit 1, and the parallel electric field $E_\parallel$ in $\mathrm{V\,m^{-1}}$.
    The dependence is very sensitive to $E_\parallel/E_D$, where $E_D$ is the [electric_field_due_to_dreicer](name:electric_field_due_to_dreicer),
    while [critical_electric_field](name:critical_electric_field) sets the lower electric-field
    scale for sustained runaway acceleration.


    The quantity denotes a local scalar rate density. If used in a radial transport
    reduction with the flux coordinate $\rho_\mathrm{tor,norm}$, the corresponding
    value is the flux-surface average of the local $S_\mathrm{D}$ over that magnetic
    surface and retains the unit $\mathrm{m^{-3}\,s^{-1}}$. No component of the right-handed
    cylindrical $(R, \phi, Z)$ system is selected by the scalar rate itself; only
    $E_\parallel$ in the generation model refers to the local magnetic-field direction.


    Typical modeled values range from effectively 0 in weak-electric-field conditions
    to $10^{17}$-$10^{22}$ $\mathrm{m^{-3}\,s^{-1}}$ in strong-electric-field transients,
    with intermediate seed-production values spanning many orders of magnitude. Because
    Dreicer generation depends steeply on plasma temperature, density, collisionality,
    and electric field, quoted ranges are scenario and model dependent.


    Sign convention: Positive when Dreicer generation increases the fast-electron
    number density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:runaway_electrons/global_quantities/volume_average/ddensity_dt_dreicer
    dd_path: runaway_electrons/global_quantities/volume_average/ddensity_dt_dreicer
    status: composed
  - id: dd:runaway_electrons/profiles_1d/ddensity_dt_dreicer
    dd_path: runaway_electrons/profiles_1d/ddensity_dt_dreicer
    status: attached
- name: fast_ion_power_due_to_collisions
  kind: scalar
  status: draft
  description: Volume-integrated Coulomb collisional power transferred from background
    ions to the total fast ion population. It is summed over all fast ion species
    and charge states represented in that population.
  documentation: 'Fast-ion power due to collisions is the net rate at which Coulomb
    collisions with background ions change the kinetic energy of the total fast-ion
    population. The total includes all represented fast-ion species and charge states,
    so state-resolved contributions add to this population-integrated quantity.


    A kinetic definition is the energy moment of the fast-ion collision operator associated
    with background ions:


    $$

    P_{\mathrm{fi}\leftarrow i}^{\mathrm{coll}} = \sum_{a\in\mathrm{FI}} \int_V \int
    \frac{1}{2} m_a v^2\, C_{a\leftarrow i}^{\mathrm{coll}}[f_a,\{f_i\}]\, d^3v\,
    dV

    $$


    where $a$ labels fast-ion species or charge states, $m_a$ is the particle mass,
    $v$ is particle speed, $f_a$ is the fast-ion distribution, $\{f_i\}$ denotes the
    background-ion distributions, $C_{a\leftarrow i}^{\mathrm{coll}}$ is the part
    of the collision operator that changes $f_a$ through collisions with background
    ions, and $V$ is the plasma volume.


    In practice this quantity is computed by taking the collisional energy moment
    of a kinetic fast-ion distribution and integrating over velocity space and plasma
    volume. Equivalently, it is the volume integral of the corresponding fast-ion
    collisional power density. For the same interacting populations and volume, energy
    conservation gives the reciprocal balance $P_{\mathrm{fi}\leftarrow i}^{\mathrm{coll}}
    + P_{i\leftarrow\mathrm{fi}}^{\mathrm{coll}} \simeq 0$, where the second term
    is the matching contribution to thermal-ion power due to collisions, apart from
    numerical error or additional species partitions.


    Typical magnitudes range from 10^3-10^7 W in present-day auxiliary-heated experiments
    and can reach 10^7-10^8 W in reactor-scale plasmas. The signed value is often
    negative when energetic ions slow down on cooler background ions, because energy
    is then transferred from fast ions to the thermal-ion population.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy from
    the background ion population to the fast-ion population.'
  unit: W
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/ion/power_fast
    dd_path: distributions/distribution/global_quantities/collisions/ion/power_fast
    status: composed
- name: fast_ion_state_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Coulomb collisional power density for fast ions in a specified charge
    state, giving the local energy exchange rate per volume between that fast-ion
    population and the background plasma. It is positive when collisions add kinetic
    energy to the selected fast-ion state and negative when they remove it.
  documentation: 'Fast-ion state collisional power density is the local kinetic-energy
    exchange rate per unit volume between fast ions in a specified charge state and
    the surrounding plasma due to Coulomb collisions. It is a signed scalar source
    term in the fast-ion energy balance, resolved by charge state rather than summed
    over all charge states.


    The quantity is defined as the kinetic-energy moment of the Coulomb Fokker-Planck
    collision operator acting on the fast-ion distribution for charge state $q$:


    $$

    p_{\mathrm{fast},q}^{\mathrm{coll}}(\mathbf{x}) = \int \frac{1}{2} m_q v^2\, C_q^{\mathrm{coll}}[f_{\mathrm{fast},q},
    f_{\mathrm{bg}}](\mathbf{x},\mathbf{v})\, d^3v

    $$


    where $p_{\mathrm{fast},q}^{\mathrm{coll}}$ has units of W m$^{-3}$, $\mathbf{x}$
    is position, $\mathbf{v}$ is velocity, $v=|\mathbf{v}|$ in m s$^{-1}$, $m_q$ is
    the ion mass in kg, $f_{\mathrm{fast},q}$ is the fast-ion velocity distribution
    for charge state $q$, $f_{\mathrm{bg}}$ represents the background electron and
    ion distributions, and $C_q^{\mathrm{coll}}$ is the Coulomb Fokker-Planck collision
    operator with units of distribution function per second. For fast-ion slowing-down
    calculations this operator is commonly treated as a linearized test-particle operator
    with drag and diffusion coefficients expressible through Rosenbluth potentials.


    In practice this term is inferred from kinetic modeling constrained by measurements
    of the fast-ion population and by background density, temperature, and composition,
    which determine the Coulomb collision frequencies. Volume integration gives [fast_ion_state_power_due_to_collisions](name:fast_ion_state_power_due_to_collisions),
    summing over charge states gives [fast_ion_power_density_due_to_collisions](name:fast_ion_power_density_due_to_collisions),
    and orbit-topology partitions give [co_passing_fast_ion_state_power_density_due_to_collisions](name:co_passing_fast_ion_state_power_density_due_to_collisions),
    [counter_passing_fast_ion_state_power_density_due_to_collisions](name:counter_passing_fast_ion_state_power_density_due_to_collisions),
    and [trapped_fast_ion_state_power_density_due_to_collisions](name:trapped_fast_ion_state_power_density_due_to_collisions).


    Typical absolute magnitudes are about 10$^{3}$-10$^{7}$ W m$^{-3}$ in beam-heated,
    radio-frequency-heated, or fusion-alpha-heated tokamak plasmas. Values can be
    much smaller in weak-source or edge regions and larger locally in compact, high-power
    deposition regions.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy to the
    selected fast-ion charge-state population.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_fast_ion_state_power_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/collisions/ion/state/power_fast
    dd_path: distributions/distribution/profiles_1d/collisions/ion/state/power_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/collisions/ion/state/power_fast
    dd_path: distributions/distribution/profiles_2d/collisions/ion/state/power_fast
    status: composed
- name: counter_passing_fast_ion_state_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Volumetric Coulomb-collisional kinetic-energy transfer rate for a specified
    fast-ion charge state, restricted to counter-passing particles. Positive values
    mean that charge state gains kinetic energy from collisions; negative values mean
    it loses kinetic energy.
  documentation: 'Counter-passing fast ion state power density due to collisions is
    the local collisional source term in the kinetic-energy balance of a specified
    fast-ion charge state, evaluated only over the counter-passing part of velocity
    space. Counter-passing fast ions have guiding-center parallel motion whose toroidal
    circulation is opposite to the plasma-current direction. The charge-state label
    denotes one resolved ionization state of the fast-ion species.


    The quantity is the kinetic-energy moment of the Coulomb collision operator over
    the counter-passing velocity-space domain:


    $$

    P_{\mathrm{fast},z}^{\mathrm{counter}} = \int_{\Omega_{\mathrm{counter}}} \mathcal{E}_z(\mathbf{v})\,
    C_z[f_{\mathrm{fast},z}](\mathbf{v})\, d^3v

    $$


    where $P_{\mathrm{fast},z}^{\mathrm{counter}}$ is the counter-passing collisional
    power density for charge state $z$, $\Omega_{\mathrm{counter}}$ is the counter-passing
    region of velocity space, $\mathcal{E}_z$ is the particle kinetic energy in joules,
    and $C_z[f_{\mathrm{fast},z}]$ is the collisional part of the time derivative
    of the local fast-ion distribution function for that charge state. If $f_{\mathrm{fast},z}$
    is normalized so that $\int f_{\mathrm{fast},z}\,d^3v$ is the number density,
    then $C_z[f_{\mathrm{fast},z}]$ has units of number density per time per velocity-space
    volume, and $d^3v$ has units $(\mathrm{m}\,\mathrm{s}^{-1})^3$, giving $P_{\mathrm{fast},z}^{\mathrm{counter}}$
    in W m$^{-3}$.


    In practice this quantity is computed from a kinetic fast-ion distribution and
    a Coulomb collision operator, often constrained by measurements such as neutron
    emission, neutral-particle analysis, fast-ion loss signals, charge-exchange spectroscopy,
    or gamma-ray diagnostics. Orbit classification partitions the distribution into
    trapped, co-passing, and counter-passing domains; summing the orbit components
    gives [fast_ion_state_power_density_due_to_collisions](name:fast_ion_state_power_density_due_to_collisions),
    while summing over charge states gives [counter_passing_fast_ion_power_density_due_to_collisions](name:counter_passing_fast_ion_power_density_due_to_collisions).
    The complementary counter-current decomposition is [co_passing_fast_ion_state_power_density_due_to_collisions](name:co_passing_fast_ion_state_power_density_due_to_collisions),
    and a thermal-ion analog is [counter_passing_thermal_ion_state_power_density_due_to_collisions](name:counter_passing_thermal_ion_state_power_density_due_to_collisions).


    Typical magnitudes are highly regime dependent: orbit- and charge-state-resolved
    values can be below 1 W m$^{-3}$ in weakly populated regions, 10$^2$-10$^6$ W
    m$^{-3}$ in auxiliary-heated core plasmas, and locally approach 10$^7$ W m$^{-3}$
    in strongly driven fast-ion populations. Negative values occur where collisions
    remove kinetic energy from the specified fast-ion charge state and transfer it
    to other species or charge states.


    Sign convention: Positive when Coulomb collisions increase the kinetic energy
    density of the specified fast-ion charge state.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:fast_ion_state_power_density_due_to_collisions
  arguments:
  - name: fast_ion_state_power_density_due_to_collisions
    operator: counter_passing
    operator_kind: qualifier
  sources:
