  documentation: 'Number density of xenon impurity ions at the pedestal top is the
    local particle count per volume of xenon ions at the core-side shoulder of an
    H-mode pedestal. The pedestal top is the transition where the steep-gradient edge
    transport barrier meets the flatter confined-core density variation, distinct
    from a separatrix or plasma-boundary value. This quantity is summed over xenon
    ionization states; an explicitly named charge state denotes only that state.


    For xenon evaluated at the pedestal-top radial label, the defining density is


    $$

    n_{\mathrm{Xe}}(\xi_{\mathrm{ped,top}})=\sum_{Z=1}^{54} n_{\mathrm{Xe}^{Z+}}(\xi_{\mathrm{ped,top}})

    $$


    where $n_{\mathrm{Xe}}$ and $n_{\mathrm{Xe}^{Z+}}$ are number densities in m$^{-3}$,
    $Z$ is the xenon ionization charge state, and $\xi_{\mathrm{ped,top}}$ identifies
    the pedestal-top location. This xenon-specific member of [density at pedestal
    top](name:density_at_pedestal_top) is distinct from [xenon density at internal
    transport barrier](name:xenon_density_at_internal_transport_barrier), which refers
    to a different transport-barrier locus.'
