- name: radial_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Radial direction cosine of the electromagnetic wave vector along a
    beam-tracing ray, equal to the radial component k_R divided by the total wave-vector
    magnitude |k|.
  documentation: "The radial normalized wave vector is the direction cosine of the\
    \ local wave vector projected onto the major-radius direction $\\hat{R}$ of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, evaluated at each point along\
    \ the beam or ray path in beam-tracing calculations. It encodes what fraction\
    \ of the instantaneous wave propagation direction is oriented radially \u2014\
    \ outward from or inward toward the machine symmetry axis.\n\nThe quantity is\
    \ defined as:\n\n$$\nk_{R,\\text{norm}} = \\frac{k_R}{|\\mathbf{k}|}\n$$\n\nwhere\
    \ $k_R$ is the [radial wave-vector component](name:radial_wave_vector_of_beam_tracing_beam)\
    \ and $|\\mathbf{k}|$ is the total wave-vector magnitude. Together with the [toroidal\
    \ normalized wave vector](name:toroidal_normalized_wave_vector_of_beam_tracing_beam)\
    \ and the [vertical normalized wave vector](name:vertical_normalized_wave_vector_of_beam_tracing_beam),\
    \ this component forms a unit direction vector satisfying $k_{R,\\text{norm}}^2\
    \ + k_{\\phi,\\text{norm}}^2 + k_{Z,\\text{norm}}^2 = 1$.\n\nIn beam-tracing or\
    \ ray-tracing simulations for RF heating, the normalized wave-vector components\
    \ track the instantaneous wave propagation direction as the ray refracts through\
    \ an inhomogeneous magnetized plasma. Values are dimensionless and bounded to\
    \ the interval $[-1, 1]$.\n\nSign convention: Positive when $k_R$ points in the\
    \ direction of increasing major radius $R$, away from the machine symmetry axis."
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/k_r_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-wave_vector-k_r_norm
    dd_documentation:
      leaf: Normalized wave vector component in the major radius direction = k_r /
        norm(k)
      parent_path: waves/coherent_wave/beam_tracing/beam/wave_vector
      parent: Wave vector of the ray/beam along its path
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - waves/coherent_wave/beam_tracing/beam/length
    enhanced_context:
      description: Normalized radial component of the wave vector (k_r/|k|) along
        the beam or ray path in beam tracing calculations. Represents the fraction
        of the total wave vector directed along the major radius direction.
      kind: llm
- name: radial_offset_of_beamlet_group
  kind: scalar
  status: active
  description: "Signed major-radius displacement of a beamlet-group center from its\
    \ nominal position, measured along the radial direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'This quantity is the signed radial displacement of a beamlet-group
    center from its nominal static position during a position variation. It describes
    only the major-radius component of the group''s displacement, not the complete
    position vector or the injector''s own reference position.


    In the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ frame, the offset
    is defined by:


    $$

    \Delta R_{\mathrm{bg}} = R_{\mathrm{bg}} - R_{\mathrm{bg},0}

    $$


    Here $R_{\mathrm{bg}}$ is the beamlet-group center''s major-radius coordinate
    and $R_{\mathrm{bg},0}$ is its nominal static reference coordinate; $R$ is measured
    from the machine symmetry axis and increases outward.


    For dynamic beam tilting, the offset describes the group''s positional variation
    and is distinct from the [radial coordinate of the neutral beam injector](name:radial_coordinate_of_neutral_beam_injector),
    which refers to the injector reference position. Related angular variation is
    described by the [perturbed beam tilt angle of the neutral beam injector](name:perturbed_beam_tilt_angle_of_neutral_beam_injector).


    Sign convention: Positive when the beamlet-group center lies at larger major radius
    than its nominal reference position.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:radial_coordinate_of_neutral_beam_injector
  sources:
