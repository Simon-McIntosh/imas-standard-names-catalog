      kind: llm
- name: shattered_pellet_fragment_volume
  kind: scalar
  status: active
  description: Volume occupied by one solid fragment produced when a pellet is shattered
    for plasma fueling, excluding surrounding space and unincorporated gas.
  documentation: 'The fragment volume is the three-dimensional geometric volume occupied
    by the solid material of one shattered-pellet fragment.


    The defining relation is


    $$

    V_f = \int_{\Omega_f} dV

    $$


    where $V_f$ is the fragment volume, $\Omega_f$ is the region occupied by the fragment,
    and $dV$ is an infinitesimal volume element.


    This quantity excludes surrounding voids, carrier gas, and plasma volume. It is
    distinct from [shattered-pellet fragment density](name:shattered_pellet_fragment_density),
    which describes the number density of an atomic species within the fragment.'
  unit: m^3
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_fragment_density
  sources:
  - dd_path: spi/injector/fragment/volume
    dd_version: 4.1.0
