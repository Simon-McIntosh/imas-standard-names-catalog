- name: poloidal_plasma_beta
  kind: scalar
  status: draft
  description: Dimensionless equilibrium parameter comparing volume-integrated plasma
    pressure with the magnetic energy scale of the poloidal field generated by the
    plasma current.
  documentation: 'Poloidal plasma beta measures how strongly plasma pressure contributes
    to equilibrium force balance relative to the magnetic pressure associated with
    the poloidal field produced by the plasma current. It is the explicitly plasma-qualified
    form of [poloidal beta](name:poloidal_plasma_beta) and is often interpreted together
    with [internal inductance](name:internal_inductance), which measures current-density
    peaking.


    A common global definition is


    $$

    \beta_p = \frac{4 \int p\,dV}{R_0 \mu_0 I_p^2}

    $$


    where $p$ is the equilibrium plasma pressure in Pa, $dV$ is the volume element
    in m$^3$, $R_0$ is the reference major radius in m, $\mu_0$ is the vacuum permeability,
    and $I_p$ is the total toroidal plasma current in A. The pressure integral may
    include the pressure components used in the equilibrium force-balance model, so
    comparisons should use a consistent pressure convention.


    It is inferred from magnetic-equilibrium reconstruction constrained by external
    magnetics, pressure diagnostics such as Thomson scattering and charge-exchange
    spectroscopy, and stored-energy constraints from diamagnetic measurements. Representative
    values are 0.2-2 in conventional tokamak H-mode plasmas and can exceed 3 in spherical
    tokamak regimes. It complements [normalized toroidal plasma beta], while [magnetic
    field](name:magnetic_field) and [poloidal magnetic flux at plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary)
    provide related equilibrium magnetic constraints.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_plasma_beta
  - name:internal_inductance
  - name:magnetic_field
