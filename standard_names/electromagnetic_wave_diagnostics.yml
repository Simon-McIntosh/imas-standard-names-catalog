- name: toroidal_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Toroidal normalized wave vector of a beam-tracing beam is the signed\
    \ toroidal direction cosine k_phi/|k| of the electromagnetic wave vector at the\
    \ beam launch point in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal normalized wave vector of a beam-tracing beam is the signed
    toroidal direction cosine of the electromagnetic wave vector at the beam launch
    point. It is the projection of the local unit wave vector onto the toroidal basis
    direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The normalized toroidal component is defined by


    $$

    k_{\phi,\mathrm{norm}} = \frac{\mathbf{k}\cdot\hat{\phi}}{\lvert\mathbf{k}\rvert}
    = \frac{k_\phi}{\lvert\mathbf{k}\rvert}

    $$


    where $\mathbf{k}$ is the electromagnetic wave vector at the beam launch point,
    $\hat{\phi}$ is the toroidal unit vector in the right-handed cylindrical $(R,
    \phi, Z)$ basis with $\hat{R}\times\hat{\phi}=\hat{Z}$, $k_\phi=\mathbf{k}\cdot\hat{\phi}$
    is the [toroidal wave vector of a beam-tracing beam](name:toroidal_wave_vector_of_beam_tracing_beam),
    and $\lvert\mathbf{k}\rvert$ is the wave-vector magnitude.


    This is a launch-point quantity, not an integral or average over a beam path.
    It is distinct from the [normalized toroidal wave vector of a beam-tracing beam](name:normalized_toroidal_wave_vector_of_beam_tracing_beam),
    which denotes the same toroidal direction cosine evaluated along a traced beam
    rather than specifically at launch. For real nonzero $\mathbf{k}$ it satisfies
    $-1 \leq k_{\phi,\mathrm{norm}} \leq 1$; together with the [radial normalized
    wave vector of a beam-tracing beam](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    and the [vertical normalized wave vector of a beam-tracing beam](name:vertical_normalized_wave_vector_of_beam_tracing_beam),
    the cylindrical direction cosines obey $k_{R,\mathrm{norm}}^2+k_{\phi,\mathrm{norm}}^2+k_{Z,\mathrm{norm}}^2=1$.
    The [poloidal normalized wave vector of a beam-tracing beam] is instead a related
    projection in the meridional plane spanned by $\hat{R}$ and $\hat{Z}$.


    Sign convention: Positive when the projection of $\mathbf{k}$ onto $\hat{\phi}$
    is along the local $+\hat{\phi}$ direction, the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_wave_vector_of_beam_tracing_beam
  - name:normalized_toroidal_wave_vector_of_beam_tracing_beam
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - dd_path: ec_launchers/beam/direction/kphi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-beam-direction-kphi
    dd_documentation:
      leaf: Component along the toroidal direction
      parent_path: ec_launchers/beam/direction
      parent: Wavevector at launch point
      data_type: FLT_1D
      unit: m^-1
      coordinates:
      - ec_launchers/beam/time
    enhanced_context:
      description: "Toroidal component (k\u03C6) of the wavevector at the EC beam\
        \ launch point. Specifies the toroidal wave propagation direction, determining\
        \ toroidal injection geometry for ray-tracing and driven current calculations."
      kind: llm
- name: toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Signed projection of the electromagnetic wave vector of a beam-tracing\
    \ beam onto the toroidal direction in the right-handed cylindrical (R, \u03C6\
    , Z) frame at the evaluated point along the ray."
  documentation: 'Toroidal wave vector of a beam-tracing beam is the physical component
    of the local electromagnetic wave vector along $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It represents the local toroidal wave-number
    component of the propagating beam.


    The component is defined by the orthonormal projection of the local wave vector:


    $$

    k_\phi = \mathbf{k} \cdot \hat{\phi}

    $$


    where $k_\phi$ is the toroidal wave-vector component, $\mathbf{k}$ is the local
    electromagnetic wave vector, both have units of inverse length, and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    This is the orthonormal physical component along $\hat{\phi}$, not the canonical
    phase-gradient component conjugate to the toroidal angle; the corresponding canonical
    factor is $R k_\phi$. The corresponding normalized toroidal wave-vector component
    is the signed direction cosine $k_\phi / |\mathbf{k}|$, not a normalization by
    a vacuum wave number.


    Sign convention: Positive when the wave vector component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  sources:
