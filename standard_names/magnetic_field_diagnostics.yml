- name: area_of_flux_loop
  kind: scalar
  status: draft
  description: Effective area of a magnetic flux loop, defined as the ratio of the
    intercepted magnetic flux to the average magnetic field over the loop.
  documentation: 'The effective area $A_{\rm eff}$ (in $\mathrm{m^2}$) of a flux loop
    relates the measured flux $\Phi$ to the spatially averaged magnetic field component
    normal to the loop surface: $\Phi = A_{\rm eff} \langle B_n \rangle$. For a single-turn
    planar loop in a uniform field, $A_{\rm eff}$ equals the geometric area enclosed
    by the conductor; for multi-turn or non-planar loops it incorporates winding corrections.
    The effective area is a calibration parameter required to convert raw voltage
    signals $V = -d\Phi/dt$ into magnetic-flux measurements used as constraints in
    equilibrium reconstruction. For differential flux loops (where the loop type index
    equals 6) the effective area is not defined and the field should be left empty.
    Flux loops in tokamaks have effective areas ranging from $\sim$0.01 to several
    $\mathrm{m^2}$ depending on their size and geometry. See also [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for the analogous quantity on pickup coils.'
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: beat_length_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Linear beat length of a fiber optic current sensor, characterizing
    the spatial period over which intrinsic linear birefringence produces a full polarization
    cycle.
  documentation: "The beat length $L_B$ is defined as the fiber propagation distance\
    \ over which the phase difference between the two orthogonal linear polarization\
    \ eigenmodes accumulates $2\\pi$ radians: $L_B = \\lambda / \\Delta n$, where\
    \ $\\lambda$ is the probe wavelength and $\\Delta n$ is the effective birefringence.\
    \ A shorter beat length implies stronger intrinsic birefringence, which competes\
    \ with the Faraday rotation signal and must be suppressed by spinning the fiber.\
    \ For spun FOCS fibers deployed on tokamak vacuum vessels, beat lengths are on\
    \ the order of 1\u201310 mm. The ratio $L_B / L_s$ (where $L_s$ is the [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor))\
    \ determines the degree of birefringence suppression. This quantity is closely\
    \ related to [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre), which\
    \ refers to the fiber material property, whereas this name characterizes the sensor-level\
    \ parameter. See also [fibre_length_of_fiber_optic_current_sensor](name:fibre_length_of_fiber_optic_current_sensor)\
    \ for the total sensing length."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: beat_length_of_focs_fibre
  kind: scalar
  status: draft
  description: Linear beat length of the FOCS sensing fiber, characterizing the spatial
    period of polarization evolution due to intrinsic linear birefringence.
  documentation: "The beat length $L_B$ (in m) is the propagation distance along the\
    \ fiber over which the phase difference between the two orthogonal linear polarization\
    \ eigenmodes accumulates $2\\pi$ radians: $L_B = \\lambda / \\Delta n$, where\
    \ $\\lambda$ is the optical wavelength and $\\Delta n$ is the refractive-index\
    \ difference between the fast and slow axes. A shorter $L_B$ implies stronger\
    \ linear birefringence, which competes with the desired Faraday rotation. For\
    \ effective FOCS operation the [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor)\
    \ must satisfy $p_{\\rm spun} \\ll L_B$ so that spinning averages out the birefringence.\
    \ Standard single-mode fibers have $L_B$ in the range 1\u201330 m; specialty low-birefringence\
    \ fibers used in FOCS can exceed 50 m. See also [twist_period_of_fiber_optic_current_sensor](name:twist_period_of_fiber_optic_current_sensor)\
    \ and [fibre_length_of_fiber_optic_current_sensor](name:fibre_length_of_fiber_optic_current_sensor)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: coil_turn_count
  kind: scalar
  status: draft
  description: Number of conductor turns in a coil winding, where the sign encodes
    the winding direction for magnetic probes.
  documentation: "The turn count $N$ (dimensionless) specifies how many times the\
    \ conductor winds around the coil former. For magnetic-field probes (poloidal,\
    \ toroidal, or combined), the sign of $N$ indicates the winding sense relative\
    \ to the sensor normal vector $\\hat{n}$: a positive value means the induced voltage\
    \ $V = -N \\, dB/dt \\cdot A$ is positive when $\\partial B / \\partial t$ is\
    \ along $+\\hat{n}$, where $A$ is the area per turn given by [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element).\
    \ For power-supply coils such as TF and PF windings, $N$ is the total number of\
    \ turns (always positive) and may be fractional when describing parallel-connected\
    \ sub-coils. Probe coils have $|N|$ in the range 1\u20131000; TF coils have $N$\
    \ in the hundreds (e.g., 134 for ITER TF). See also [rogowski_coil_turns_per_unit_length](name:rogowski_coil_turns_per_unit_length)\
    \ and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: cross_sectional_area_of_coil_element
  kind: scalar
  status: draft
  description: Cross-sectional area of a single turn of a magnetic sensor or conductor
    coil element, yielding the effective sensing area when multiplied by the turn
    count.
  documentation: The cross-sectional area $A$ of a coil element defines the flux-linkage
    sensitivity of a single winding turn. The effective area of the full sensor is
    $A_{\mathrm{eff}} = N \cdot A$, where $N$ is the [coil_turn_count](name:coil_turn_count).
    For magnetic field probes (poloidal or toroidal), the induced voltage is $V =
    -N A \, dB_n/dt$, where $B_n$ is the magnetic field component along the sensor
    normal. For power-supply conductors (TF, PF coils), $A$ characterizes the conductor
    cross-section governing current density $j = I/A$. Values range from $\sim 10^{-5}\,\mathrm{m^2}$
    for small pickup coils to $\sim 10^{-3}\,\mathrm{m^2}$ for superconducting cable-in-conduit
    conductors. The area is determined from geometric design data (rectangular or
    circular cross-section dimensions). See also [area_of_flux_loop](name:area_of_flux_loop)
    for the enclosed loop area of a flux loop sensor and [cross_sectional_area_of_rogowski_coil](name:cross_sectional_area_of_rogowski_coil)
    for Rogowski coil windings.
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: cross_sectional_area_of_rogowski_coil
  kind: scalar
  status: draft
  description: Effective cross-sectional area of the sensing winding wrapped around
    the guiding center of a Rogowski coil.
  documentation: The effective area $A_{\mathrm{Rog}}$ (in m$^2$) of a Rogowski coil
    determines the sensitivity of the coil to the enclosed current through the relation
    $V = -\mu_0 n A_{\mathrm{Rog}} \, dI_{\mathrm{enc}}/dt$, where $\mu_0$ is the
    vacuum permeability, $n$ is the turn density (turns per meter), and $I_{\mathrm{enc}}$
    is the total enclosed current. For multi-layer Rogowski coils, the reported area
    is the sum of the cross-sectional areas of each winding layer. Values range from
    $10^{-5}$ to $10^{-2}$ m$^2$ depending on coil design. Accurate knowledge of $A_{\mathrm{Rog}}$
    is essential for absolute calibration of the plasma current measurement; calibration
    is performed using known test currents or electromagnetic modeling. See also [coil_turn_count](name:coil_turn_count)
    for the related winding parameter and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for the generic coil-element counterpart.
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - equilibrium-reconstruction
  - measured
  links: []
  validity_domain: ''
  constraints: []
- name: electrical_resistance_of_shunt
  kind: scalar
  status: draft
  description: DC electrical resistance of a shunt resistor used in the magnetics
    diagnostic circuit for current-to-voltage conversion.
  documentation: The shunt resistance $R_{\mathrm{sh}}$ (in $\Omega$) converts the
    current flowing through a magnetics diagnostic circuit element into a measurable
    voltage drop via Ohm's law, $V_{\mathrm{sh}} = I \, R_{\mathrm{sh}}$, where $V_{\mathrm{sh}}$
    is the terminal voltage and $I$ is the circuit current. Precision shunt resistors
    are used in flux-loop and Rogowski-coil readout chains; their values are selected
    to match the expected current range to the data-acquisition voltage span. For
    tokamak magnetics, shunt resistances range from $10^{-3}$ to $10^{1}$ $\Omega$.
    Long-term drift and temperature dependence of $R_{\mathrm{sh}}$ introduce systematic
    errors in the integrated flux or current measurement, necessitating periodic calibration.
    See also [area_of_flux_loop](name:area_of_flux_loop) and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for the sensor geometry parameters that complement the electrical readout chain.
  unit: ohm
  tags:
  - calibrated
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: fibre_length_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Total arc length of the spun sensing fiber deployed on the vacuum vessel
    of a fiber optic current sensor.
  documentation: The fiber length $L$ (in m) is the total physical path length of
    the spun sensing fiber from its input to its output coupler, as installed on the
    vacuum vessel. It determines the integration path for the Faraday rotation $\theta_F
    = V \int_0^L \mathbf{B} \cdot d\mathbf{l}$, where $V$ is the Verdet constant given
    by [verdet_constant_of_focs_fibre](name:verdet_constant_of_focs_fibre). The fiber
    length also sets the number of spun periods $N_{\rm spun} = L / p_{\rm spun}$,
    where $p_{\rm spun}$ is the [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor),
    and likewise the number of twist periods $N_{\rm twist} = L / p_{\rm twist}$ via
    [twist_period_of_fiber_optic_current_sensor](name:twist_period_of_fiber_optic_current_sensor).
    For current tokamak FOCS systems, fiber lengths range from a few meters to $\sim$30
    m depending on device size.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: initial_stokes_s1_parameter_of_focs_fibre
  kind: scalar
  status: draft
  description: Dimensionless $S_1$ component of the unit Stokes vector at the input
    end of a FOCS fiber, quantifying the linear polarization preference between horizontal
    and vertical axes.
  documentation: "The Stokes parameter $S_1$ is defined as the normalized difference\
    \ between intensities transmitted through horizontal and vertical linear polarizers:\
    \ $S_1 = (I_H - I_V) / I_{\\mathrm{tot}}$. For a unit Stokes vector ($S_0 = 1$),\
    \ the constraint $S_1^2 + S_2^2 + S_3^2 = 1$ holds for fully polarized light.\
    \ At the fiber input, $S_1$ together with [initial_stokes_s2_parameter_of_focs_fibre](name:initial_stokes_s2_parameter_of_focs_fibre)\
    \ and [initial_stokes_s3_parameter_of_focs_fibre](name:initial_stokes_s3_parameter_of_focs_fibre)\
    \ fully specifies the input polarization state on the Poincar\xE9 sphere. The\
    \ output polarization is obtained by propagating this initial state through the\
    \ fiber Mueller matrix, which depends on the [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre),\
    \ [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor),\
    \ Verdet constant, and the plasma current-induced Faraday rotation. The output\
    \ counterpart is [output_stokes_s1_parameter_of_focs_fibre](name:output_stokes_s1_parameter_of_focs_fibre).\
    \ Values range from $-1$ to $+1$."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: length_of_magnetic_field_probe_sensor
  kind: scalar
  status: draft
  description: Physical extent of the magnetic probe sensor along its normal axis
    $\hat{n}$, defining the averaging volume depth.
  documentation: The sensor length $L$ (in m) is the dimension of the pickup coil
    along its normal vector $\hat{n}$. Together with the [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    $A$ and [coil_turn_count](name:coil_turn_count) $N$, it defines the effective
    sensing volume $V_{\mathrm{eff}} = N \cdot A \cdot L$ over which the measured
    magnetic field component $B_n = \mathbf{B} \cdot \hat{n}$ is spatially averaged.
    Larger $L$ improves signal-to-noise at the cost of spatial resolution; values
    range from a few millimeters for compact Mirnov-type probes to several centimeters
    for equilibrium reconstruction probes. Accurate knowledge of $L$ is required for
    converting the induced voltage $V = N A (dB_n/dt)$ into the physical field. See
    also [poloidal_angle_of_magnetic_probe_coil](name:poloidal_angle_of_magnetic_probe_coil)
    and [toroidal_angle_of_magnetic_probe_coil](name:toroidal_angle_of_magnetic_probe_coil)
    for the orientation of $\hat{n}$.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: linear_calibration_magnetic_field_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Magnetic field grid values assuming a linear field-to-current relationship,
    serving as the abscissa for the non-linear response table of a poloidal magnetic
    field probe.
  documentation: "This array provides the reference magnetic field values $B_{\\rm\
    \ lin}$ (in T) computed under the assumption that the probe response is strictly\
    \ linear: $B_{\\rm lin} = k \\, I_{\\rm coil}$, where $k$ (T/A) is the linear\
    \ sensitivity and $I_{\\rm coil}$ (A) is the coil current. Each entry pairs with\
    \ a corrected value in [non_linear_response_magnetic_field_of_poloidal_magnetic_field_probe](name:non_linear_response_magnetic_field_of_poloidal_magnetic_field_probe),\
    \ enabling interpolation of non-linear calibration corrections. Such corrections\
    \ become important when probe core materials approach saturation or when eddy-current\
    \ heating modifies the effective permeability. The array spans the operational\
    \ field range at the probe location, from near-zero to the maximum expected poloidal\
    \ field (order 0.01\u20131 T for most tokamak poloidal probes). The effective\
    \ area determining probe sensitivity is described by [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ multiplied by [coil_turn_count](name:coil_turn_count)."
  unit: T
  tags:
  - calibrated
  - inverse-problem
  links: []
  validity_domain: ''
  constraints: []
- name: linear_response_magnetic_field_of_phi_magnetic_field_probe
  kind: scalar
  status: draft
  description: Magnetic field grid values assuming a linear relationship between field
    and coil current, used to tabulate the non-linear response of a toroidal (phi)
    magnetic field probe.
  documentation: "This quantity provides the abscissa array of magnetic field values\
    \ $B$ (in T) for which the corresponding non-linear probe response is tabulated.\
    \ Under the linear approximation, the measured field is proportional to the coil\
    \ current: $B_{\\rm lin} = k \\, I_{\\rm coil}$, where $k$ is the probe sensitivity\
    \ constant and $I_{\\rm coil}$ is the coil current. The non-linear correction\
    \ maps each $B_{\\rm lin}$ entry to a corrected value $B_{\\rm NL}$ stored in\
    \ [non_linear_response_magnetic_field_of_phi_magnetic_field_probe](name:non_linear_response_magnetic_field_of_phi_magnetic_field_probe).\
    \ This calibration is relevant for high-field or high-current regimes where core\
    \ saturation or non-linear permeability of the probe material becomes significant.\
    \ Field values in the array span the operational range of the probe, from near-zero\
    \ up to the maximum expected $B_\\phi$ at the probe location (order 0.01\u2013\
    6 T depending on device and probe position). See also [linear_response_magnetic_field_of_poloidal_magnetic_field_probe](name:linear_response_magnetic_field_of_poloidal_magnetic_field_probe)\
    \ for the poloidal counterpart."
  unit: T
  tags:
  - calibrated
  - inverse-problem
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_area_of_flux_loop
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on the effective
    enclosed area of a magnetic flux loop sensor.
  documentation: "This quantity represents the negative-side error bar on [area_of_flux_loop](name:area_of_flux_loop),\
    \ i.e., the true area $A$ satisfies $A - \\sigma_{\\mathrm{lower}} \\le A \\le\
    \ A + \\sigma_{\\mathrm{upper}}$. Asymmetric uncertainties arise when the loop\
    \ geometry deviates from nominal due to manufacturing tolerances or thermal deformation\
    \ of the mounting structure. The uncertainty enters error propagation for the\
    \ poloidal magnetic flux measurement via $\\delta\\Phi = \\delta A \\cdot \\langle\
    \ B \\rangle$. In practice, values are determined from metrology surveys or dimensional\
    \ tolerance analyses and are on the order of $10^{-4}$\u2013$10^{-3}\\,\\mathrm{m^2}$.\
    \ The companion upper bound is [upper_uncertainty_of_area_of_flux_loop](name:upper_uncertainty_of_area_of_flux_loop)."
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_time
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on a time measurement,
    expressed as a non-negative offset below the central value.
  documentation: "The lower uncertainty $\\delta t^{-}$ defines the downward extent\
    \ of an asymmetric error bar on a time quantity, such that the true value is expected\
    \ to lie within $[t - \\delta t^{-},\\, t + \\delta t^{+}]$ at the stated confidence\
    \ level, where $t$ is the reported time in seconds, $\\delta t^{-} \\geq 0$ is\
    \ this lower offset, and $\\delta t^{+}$ is the corresponding upper offset given\
    \ by [upper_uncertainty_of_time](name:upper_uncertainty_of_time). Asymmetric time\
    \ uncertainties arise, for example, when a Langmuir-probe plunge timing is reconstructed\
    \ from a non-symmetric position\u2013time trajectory or when event-detection algorithms\
    \ yield skewed timing distributions. In fusion diagnostics the central time is\
    \ usually known to $\\lesssim 1\\,\\mathrm{ms}$ for magnetics and $\\lesssim 0.1\\\
    ,\\mathrm{ms}$ for fast reciprocating probes, so the lower uncertainty is of comparable\
    \ magnitude."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - time-dependent
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_line_of_sight_second_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the second defining point of a diagnostic
    line of sight in the machine cylindrical coordinate system.
  documentation: "Diagnostic lines of sight are described by sequences of points in\
    \ the cylindrical system $(R, \\phi, Z)$. This quantity stores the major radius\
    \ $R$ (in meters) of the second point \u2014 conventionally the far-end or wall-exit\
    \ point of the chord. Combined with the $\\phi$ and $Z$ coordinates of both endpoints,\
    \ it defines the straight-line (or piecewise-linear) path through the plasma along\
    \ which line-integrated measurements are performed. It appears in magnetics (shunt\
    \ positions), iron-core segment geometry, ferritic-insert descriptions, and pulse-schedule\
    \ line-of-sight definitions. Values depend on machine size; for medium-size tokamaks,\
    \ $R$ ranges from approximately 1.0 m to 4.0 m. See also [toroidal_angle_of_line_of_sight_first_point](name:toroidal_angle_of_line_of_sight_first_point)\
    \ and [major_radius_of_line_of_sight_third_point](name:major_radius_of_line_of_sight_third_point)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cylindrical-coordinates
  - line-integrated
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_reference_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a diagnostic or device reference point
    in the tokamak cylindrical coordinate system.
  documentation: The major radius $R_{\rm ref}$ gives the radial distance (in meters)
    from the machine symmetry axis to a designated reference point. For magnetic diagnostics
    this is the spatial location of the probe, flux loop, or Rogowski coil; for the
    toroidal-field system it is the official device reference major radius (e.g.,
    the geometric center of the vacuum vessel). The coordinate is defined in the standard
    $(R, Z, \phi)$ cylindrical system. Representative values range from approximately
    0.3 m for small spherical tokamaks to 6.2 m for ITER. This quantity is essential
    for mapping diagnostic measurements into flux-surface geometry during equilibrium
    reconstruction. See also [cross_sectional_area_of_rogowski_coil](name:cross_sectional_area_of_rogowski_coil)
    and [area_of_flux_loop](name:area_of_flux_loop) for companion diagnostic geometry
    parameters.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cylindrical-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: non_linear_response_magnetic_field_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Corrected magnetic field value accounting for non-linear response of
    a poloidal magnetic field probe at a given linear-calibration field point.
  documentation: "This quantity provides the true magnetic field $B_{\\rm NL}$ (in\
    \ T) after applying the non-linear calibration correction for a poloidal probe.\
    \ It is paired element-wise with the linear-assumption field array [linear_response_magnetic_field_of_poloidal_magnetic_field_probe](name:linear_response_magnetic_field_of_poloidal_magnetic_field_probe).\
    \ The correction captures material non-linearities such as core saturation and\
    \ hysteresis in the probe's magnetic circuit, which become significant when the\
    \ local poloidal field approaches the saturation induction of the core material\
    \ (order 0.5\u20131.5 T for typical soft-magnetic alloys). In the linear regime\
    \ $B_{\\rm NL} \\approx B_{\\rm lin}$; departures increase with field magnitude\
    \ and can reach several percent near full-scale. The calibration table is determined\
    \ during ex-situ characterization using a Helmholtz coil or in-situ cross-calibration\
    \ against an independent diagnostic. See also the phi counterpart [non_linear_response_magnetic_field_of_phi_magnetic_field_probe](name:non_linear_response_magnetic_field_of_phi_magnetic_field_probe)\
    \ and the probe geometry parameters [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ and [coil_turn_count](name:coil_turn_count)."
  unit: T
  tags:
  - calibrated
  - inverse-problem
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_angle_of_magnetic_probe_coil
  kind: scalar
  status: draft
  description: Angle of the magnetic probe sensor normal vector with respect to the
    horizontal plane, defining its poloidal orientation.
  documentation: The poloidal angle (in rad) specifies the orientation of the sensor
    normal vector $\hat{n}$ (parallel to the coil axis) relative to the horizontal
    plane. A value of zero indicates that $\hat{n}$ lies entirely in the horizontal
    plane. The angle increases in a clockwise theta-like sense when viewed from outside
    the torus. This orientation, together with the [toroidal_angle_of_magnetic_probe_coil](name:toroidal_angle_of_magnetic_probe_coil),
    fully determines the direction of $\hat{n}$ and hence which magnetic-field component
    $B_n = \mathbf{B} \cdot \hat{n}$ the probe measures. The effective measurement
    is the volume-averaged $B_n$ over the sensor extent defined by [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    and [length_of_magnetic_field_probe_sensor](name:length_of_magnetic_field_probe_sensor).
    See also [coil_turn_count](name:coil_turn_count) for the winding information.
  unit: rad
  tags:
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_magnetic_field_coupling_of_grid_to_magnetic_field_probe
  kind: scalar
  status: draft
  description: Green's-function matrix element coupling a unit current in an equilibrium
    grid cell to the poloidal magnetic field at a magnetic field probe location.
  documentation: "Each element $G_{ij}$ of this coupling matrix gives the poloidal\
    \ magnetic field $B_{\\theta,j}$ (in T) produced at probe $j$ by a unit current\
    \ (1 A) flowing in grid element $i$: $B_{\\theta,j} = \\sum_i G_{ij} \\, I_i$.\
    \ The matrix is precomputed from Biot\u2013Savart or finite-element Green's functions\
    \ on the equilibrium reconstruction grid and is used in the forward model of Grad\u2013\
    Shafranov solvers such as EFIT and LIUQE to predict probe signals from a given\
    \ current distribution. The unit $\\mathrm{A^{-1}\\cdot T}$ reflects the definition\
    \ $G = B/I$. This coupling is the spatial counterpart of [poloidal_magnetic_field_coupling_of_plasma_to_magnetic_field_probe](name:poloidal_magnetic_field_coupling_of_plasma_to_magnetic_field_probe),\
    \ which describes coupling from plasma current elements specifically. Accuracy\
    \ of the matrix depends on grid resolution and the inclusion of iron-core permeability\
    \ corrections."
  unit: A^-1.T
  tags:
  - equilibrium-reconstruction
  - inverse-problem
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_magnetic_field_coupling_of_plasma_to_magnetic_field_probe
  kind: scalar
  status: draft
  description: Mutual coupling coefficient relating a unit plasma current element
    to the poloidal magnetic field measured at a magnetic field probe, in units of
    $\mathrm{A^{-1} \cdot T}$.
  documentation: "This coupling matrix element $M_{ij}$ (in $\\mathrm{A^{-1} \\, T}$)\
    \ gives the poloidal magnetic field contribution at probe $j$ per unit current\
    \ in plasma element $i$, i.e., $B_{\\rm pol,j} = \\sum_i M_{ij} \\, I_i$. It encodes\
    \ the Green's function relating discrete plasma current sources (filaments or\
    \ finite-element cells) to the sensor response and is central to equilibrium reconstruction\
    \ codes that invert external magnetic measurements for the plasma current distribution.\
    \ The matrix is computed from the Biot\u2013Savart law taking into account the\
    \ probe orientation (normal axis direction), effective area, and position relative\
    \ to each plasma element. Accurate knowledge of these coupling coefficients is\
    \ critical for constraining Grad\u2013Shafranov equilibrium solvers. See also\
    \ [linear_response_magnetic_field_of_toroidal_magnetic_field_probe](name:linear_response_magnetic_field_of_toroidal_magnetic_field_probe)\
    \ for the analogous toroidal probe response."
  unit: A^-1.T
  tags:
  - equilibrium-reconstruction
  - inverse-problem
  links: []
  validity_domain: ''
  constraints: []
- name: rogowski_coil_turns_per_unit_length
  kind: scalar
  status: draft
  description: Winding density of a Rogowski coil, defined as the number of turns
    per meter of the guiding center path for a single winding layer.
  documentation: "The turns-per-unit-length $n$ (in $\\mathrm{m^{-1}}$) characterizes\
    \ the sensitivity of a Rogowski coil to the enclosed current. The ideal coil output\
    \ voltage is $V = -\\mu_0 n A \\, dI_{\\mathrm{enc}}/dt$, where $A$ is the [cross_sectional_area_of_rogowski_coil](name:cross_sectional_area_of_rogowski_coil)\
    \ and $I_{\\mathrm{enc}}$ is the total current threading the coil loop. For multi-layer\
    \ windings, this parameter reports the single-layer density; the effective sensitivity\
    \ scales with the number of layers. Fusion-relevant Rogowski coils have winding\
    \ densities of 500\u20135000 $\\mathrm{m^{-1}}$, depending on the target bandwidth\
    \ and noise requirements. See also [coil_turn_count](name:coil_turn_count) for\
    \ the total number of discrete turns in a sensor coil."
  unit: m^-1
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: spun_fibre_initial_azimuth_angle
  kind: scalar
  status: draft
  description: Initial azimuthal orientation angle of the intrinsic birefringence
    axes at the input end of a spun FOCS sensing fiber.
  documentation: In a spun optical fiber, the local birefringence axes rotate along
    the fiber length with a period set by the [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor).
    The initial azimuth $\alpha_0$ (in rad) specifies the angular orientation of the
    fast birefringence axis at the fiber input with respect to a reference direction
    in the fiber cross-section plane. This parameter enters the Jones or Mueller transfer-matrix
    model of the fiber and affects the mapping between input polarization state and
    output Stokes parameters. For a linear input polarization aligned with the fast
    axis ($\alpha_0 = 0$), the polarization evolution along the fiber is symmetric;
    misalignment introduces additional modulation. See also [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre)
    for the birefringence spatial period and [initial_stokes_s1_parameter_of_focs_fibre](name:initial_stokes_s1_parameter_of_focs_fibre)
    for the input polarization state.
  unit: rad
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: spun_period_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Spatial period of the helical spin imparted to the sensing fiber of
    a FOCS during manufacturing, expressed as a length along the fiber axis.
  documentation: "The spun period $p_{\\rm spun}$ (in m) is the distance along the\
    \ fiber axis over which the intrinsic birefringence axes complete one full $360\xB0\
    $ rotation due to the spinning applied during fiber drawing. Spinning is the primary\
    \ technique to suppress linear birefringence in a FOCS fiber: when $p_{\\rm spun}\
    \ \\ll L_B$, where $L_B$ is the [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre),\
    \ the fiber behaves as an ideal Faraday-rotation medium with negligible residual\
    \ linear birefringence. The ratio $L_B / p_{\\rm spun}$ is a key figure of merit\
    \ for FOCS fiber design. For practical FOCS fibers $p_{\\rm spun}$ is on the order\
    \ of a few millimeters. See also [twist_period_of_fiber_optic_current_sensor](name:twist_period_of_fiber_optic_current_sensor)\
    \ for the externally applied twist and [fibre_length_of_fiber_optic_current_sensor](name:fibre_length_of_fiber_optic_current_sensor)\
    \ for the total fiber length."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_focs_outline_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of a point on the spatial outline of a fiber
    optic current sensor, expressed in radians.
  documentation: 'This coordinate specifies the toroidal position $\phi$ (in rad)
    of a discrete point along the three-dimensional outline of a FOCS sensing fiber
    as it wraps around the vacuum vessel. The outline is described by an ordered set
    of $(R, Z, \phi)$ points in cylindrical coordinates, where $R$ is given by [major_radius_of_focs_outline_point](name:major_radius_of_focs_outline_point).
    The toroidal angle follows the machine convention: counter-clockwise when viewed
    from above. Reconstructing the full fiber path from the outline is necessary to
    compute the line integral $\int \mathbf{B} \cdot d\mathbf{l}$ that determines
    the Faraday rotation signal. For tokamak installations the outline spans $0$ to
    $2\pi$ rad for a single toroidal turn.'
  unit: rad
  tags:
  - cylindrical-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_magnetic_probe_coil
  kind: scalar
  status: draft
  description: Toroidal angular position or orientation angle of a magnetic field
    probe coil in the tokamak coordinate system.
  documentation: 'This quantity serves a dual role depending on context: (1) the toroidal
    position $\phi$ of the probe in the cylindrical coordinate system $(R, \phi, Z)$,
    or (2) the angle of the projection of the sensor normal vector $\hat{n}$ onto
    the horizontal plane measured from the $+R$ direction (counter-clockwise from
    above). Both conventions use radians. A coil orientation angle of zero means $\hat{n}$
    has no toroidal component, i.e., the sensor lies fully in the poloidal plane.
    Combined with [poloidal_angle_of_magnetic_probe_coil](name:poloidal_angle_of_magnetic_probe_coil),
    the full 3-D direction of $\hat{n}$ is specified, determining the measured field
    component $B_n = \mathbf{B} \cdot \hat{n}$. Probe signals feed equilibrium reconstruction
    codes (EFIT, LIUQE) and real-time plasma-position control. See also [length_of_magnetic_field_probe_sensor](name:length_of_magnetic_field_probe_sensor)
    and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for the sensor volume parameters, and [coil_turn_count](name:coil_turn_count)
    for winding data.'
  unit: rad
  tags:
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_rogowski_coil
  kind: scalar
  status: draft
  description: Toroidal angular position $\phi$ of the Rogowski coil in the tokamak
    cylindrical coordinate system.
  documentation: The toroidal angle $\phi$ (in rad) specifies the azimuthal location
    of a Rogowski coil around the torus. The angle is measured counter-clockwise when
    viewed from above, consistent with the standard right-handed cylindrical coordinate
    system $(R, \phi, Z)$. Rogowski coils encircle the plasma cross-section at a given
    toroidal station and measure the enclosed plasma current $I_p$ via $V = M \, dI_p/dt$,
    where $V$ is the induced voltage and $M$ is the mutual inductance. Knowledge of
    the toroidal position is required for toroidal asymmetry analysis and for correlating
    Rogowski signals with other diagnostics at the same or different toroidal stations.
    See also [cross_sectional_area_of_rogowski_coil](name:cross_sectional_area_of_rogowski_coil)
    and [coil_turn_count](name:coil_turn_count) for related geometric parameters.
  unit: rad
  tags:
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: twist_period_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Spatial period of the mechanical twist externally applied to the sensing
    fiber of a FOCS, expressed as a length along the fiber axis.
  documentation: "The twist period $p_{\\rm twist}$ (in m) is the distance along the\
    \ fiber axis over which an externally applied torsion rotates the fiber's principal\
    \ birefringence axes by $360\xB0$. Unlike the intrinsic spin set during drawing\
    \ (see [spun_period_of_fiber_optic_current_sensor](name:spun_period_of_fiber_optic_current_sensor)),\
    \ twist is introduced during installation or by mechanical stress and modifies\
    \ the effective circular birefringence of the fiber. The combined effect of spin\
    \ and twist enters the Jones transfer matrix as a rotation rate $\\kappa_{\\rm\
    \ twist} = 2\\pi / p_{\\rm twist}$ (rad/m) added to the spin rate. Accurate knowledge\
    \ of $p_{\\rm twist}$ is required to deconvolve the Faraday rotation from spurious\
    \ polarization changes. For well-controlled installations, $p_{\\rm twist}$ ranges\
    \ from centimeters to meters. See also [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre)\
    \ and [fibre_length_of_fiber_optic_current_sensor](name:fibre_length_of_fiber_optic_current_sensor)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_area_of_flux_loop
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the effective enclosed
    area of a magnetic flux loop sensor.
  documentation: "The upper error bound on the flux-loop area $A_{\\mathrm{FL}}$ (in\
    \ m$^2$) quantifies the positive-side uncertainty arising from manufacturing tolerances,\
    \ installation deformations, and survey measurement errors. The effective area\
    \ enters the flux measurement via $\\Phi = \\int \\mathbf{B} \\cdot d\\mathbf{A}$,\
    \ so area uncertainty propagates directly into magnetic flux uncertainty and hence\
    \ into equilibrium reconstruction accuracy. For large tokamak flux loops, $A_{\\\
    mathrm{FL}}$ ranges from $10^{-3}$ to several m$^2$, with upper error bounds on\
    \ the order of $10^{-4}$\u2013$10^{-2}$ m$^2$ depending on loop geometry and installation\
    \ precision. This quantity is the positive (upper) half of an asymmetric error\
    \ bar; the corresponding lower bound is given by [lower_uncertainty_of_area_of_flux_loop](name:lower_uncertainty_of_area_of_flux_loop)\
    \ if available. See also [area_of_flux_loop](name:area_of_flux_loop) for the nominal\
    \ value."
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: verdet_constant_of_focs_fibre
  kind: scalar
  status: draft
  description: Verdet constant of the optical fiber used in a fiber-optic current
    sensor, relating Faraday rotation to the line-integrated magnetic field.
  documentation: "The Verdet constant $V$ (in rad\xB7T$^{-1}$\xB7m$^{-1}$) characterizes\
    \ the strength of the Faraday magneto-optic effect in the sensing fiber of a fiber-optic\
    \ current sensor (FOCS). The polarization rotation angle $\\theta_F$ accumulated\
    \ along the fiber is given by $\\theta_F = V \\int \\mathbf{B} \\cdot d\\mathbf{l}$,\
    \ where the integral is taken along the fiber path and $\\mathbf{B}$ is the local\
    \ magnetic field. For standard silica fibers at wavelengths near 1550 nm, $V \\\
    approx 0.7$\u2013$1.0$ rad\xB7T$^{-1}$\xB7m$^{-1}$; specialty fibers (e.g., flint\
    \ glass) can have values an order of magnitude larger. Accurate knowledge of $V$\
    \ is critical for absolute calibration of the enclosed-current measurement. The\
    \ Verdet constant is wavelength- and temperature-dependent, so in-situ calibration\
    \ or temperature compensation may be required. See also [beat_length_of_focs_fibre](name:beat_length_of_focs_fibre)\
    \ and [fibre_length_of_fiber_optic_current_sensor](name:fibre_length_of_fiber_optic_current_sensor)\
    \ for related fiber properties."
  unit: T^-1.m^-1.rad
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_line_of_sight_second_point
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of the second point defining the line of sight
    of a magnetics diagnostic component.
  documentation: In the tokamak cylindrical coordinate system $(R, \phi, Z)$, the
    line of sight of a diagnostic channel is specified by two spatial points. The
    vertical coordinate $Z$ of the second (far) point, together with the corresponding
    $R$ and $\phi$ coordinates and the first-point position, defines the viewing direction
    and chord geometry. For magnetics diagnostics such as shunt current monitors,
    this line of sight may describe the cable routing or the geometric alignment of
    the sensor housing rather than an optical path. Values are referenced to the machine
    midplane ($Z = 0$) and span the full vertical extent of the vacuum vessel, from
    approximately $-4\,\mathrm{m}$ to $+4\,\mathrm{m}$ for large devices. See also
    [electrical_resistance_of_shunt](name:electrical_resistance_of_shunt) for the
    companion shunt measurement parameter.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_path_geometry_first_point
  kind: scalar
  status: draft
  description: Vertical (height) coordinate $Z$ of the first point defining a diagnostic
    or injector path geometry.
  documentation: "This quantity specifies the vertical coordinate $Z$ (in m) of the\
    \ starting point of a geometric path\u2014such as a diagnostic line of sight,\
    \ a magnetic shunt position, or a pellet injection trajectory\u2014in the cylindrical\
    \ $(R, \\phi, Z)$ coordinate system of the device. The first point, together with\
    \ a second point, defines the direction and extent of the path segment. For magnetic\
    \ diagnostics, the shunt first-point position locates the measurement reference\
    \ in the poloidal cross section. For pellet injection, it marks the beginning\
    \ of the pellet trajectory inside the vacuum vessel. $Z$ is measured from the\
    \ machine midplane, with positive values above the midplane. Accurate specification\
    \ of path geometry is essential for synthetic diagnostic modeling, line-integrated\
    \ inversions, and pellet ablation calculations. See also [major_radius_of_divertor_tile_surface_outline_point](name:major_radius_of_divertor_tile_surface_outline_point)\
    \ for a related geometric position quantity in the divertor context."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
