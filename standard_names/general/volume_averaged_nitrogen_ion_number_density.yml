name: volume_averaged_nitrogen_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of nitrogen ions, a low-to-mid-$Z$
  seeded impurity for divertor radiation enhancement.
documentation: "The volume-averaged nitrogen ion number density $\\langle n_{\\mathrm{N}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{N}}(\\mathbf{r})\\, dV$ where $n_{\\mathrm{N}}$\
  \ is the local nitrogen ion density in m$^{-3}$ summed over all charge states ($\\\
  mathrm{N}^{1+}$ through $\\mathrm{N}^{7+}$) and $V$ is the plasma volume in m$^3$.\
  \ Nitrogen ($Z = 7$) is the most widely used seeded impurity for divertor detachment\
  \ and radiative power dissipation in tokamaks (ASDEX Upgrade, JET-ILW, ITER baseline);\
  \ seeded concentrations of $\\sim 1$\u2013$5\\%$ of $n_e$ yield $\\langle n_{\\\
  mathrm{N}} \\rangle_V \\sim 10^{17}$\u2013$10^{19}$ m$^{-3}$. Diagnostics include\
  \ VUV spectroscopy of N line emissions, CXRS on fully stripped N$^{7+}$, and calibrated\
  \ gas-puff rates combined with transport modeling. Nitrogen radiation peaks around\
  \ $T_e \\sim 10$\u2013$30$ eV, efficiently cooling the divertor; however, chemical\
  \ reactivity with tungsten surfaces produces ammonia, which must be managed for\
  \ tritium retention. See also `volume_averaged_neon_ion_number_density` and `volume_averaged_carbon_ion_number_density`."
