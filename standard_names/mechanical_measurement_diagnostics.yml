- name: area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Total geometric surface area of a Langmuir probe collector, characterizing
    the probe's physical extent independent of plasma exposure fraction or magnetic-field
    projection.
  documentation: "The area of a Langmuir probe is the total geometric surface area\
    \ of the probe collector, representing its full physical size as a fixed hardware\
    \ property independent of local plasma conditions or magnetic-field geometry.\
    \ It is the parent area concept from which two operationally distinct sub-areas\
    \ are derived: the [wetted area](name:wetted_area_of_langmuir_probe), which captures\
    \ only the portion of the collector surface directly exposed to plasma, and the\
    \ [effective collection area](name:effective_area_of_langmuir_probe), which is\
    \ the projection onto the plane perpendicular to the local magnetic field that\
    \ governs ion collection in a magnetized sheath.\n\nFor probes oriented at a grazing\
    \ angle to the magnetic field \u2014 quantified by the [field-aligned incident\
    \ angle] \u2014 the effective collection area can be substantially smaller than\
    \ the total geometric area. Conflating the two when normalizing the [ion saturation\
    \ current](name:ion_saturated_current) to obtain the [ion saturation current density](name:ion_saturated_current_density)\
    \ introduces systematic errors in the inferred plasma density and particle flux\
    \ at the probe surface.\n\nProbe areas are treated as fixed diagnostic geometry\
    \ parameters, determined from engineering drawings or direct measurement of the\
    \ fabricated collector prior to installation."
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:wetted_area_of_langmuir_probe
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current
  - name:ion_saturated_current_density
- name: coolant_temperature_at_inlet
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the entry point of a cooling loop
    or calorimetry component, used with the outlet temperature and mass flow rate
    to compute deposited thermal power via enthalpy balance.
  documentation: 'The coolant inlet temperature is the absolute temperature of the
    working fluid measured at the inlet port of a cooling circuit, before traversing
    the component and absorbing heat. It establishes the upstream thermal boundary
    condition for thermodynamic analysis of the cooling loop and is a primary input
    to heat load calculations.


    Combined with [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet)
    and the coolant mass flow rate from coolant_flow, the deposited thermal power
    $P$ is determined by:


    $$

    P = \dot{m} \, c_p \, (T_\mathrm{out} - T_\mathrm{in})

    $$


    where $\dot{m}$ is the mass flow rate in kg s$^{-1}$, $c_p$ is the specific heat
    capacity of the coolant in J kg$^{-1}$ K$^{-1}$, $T_\mathrm{in}$ is the inlet
    temperature, and $T_\mathrm{out}$ is the outlet temperature.


    Measured using calibrated resistance temperature detectors (RTDs) or thermocouples
    mounted at the inlet manifold of the cooling circuit. It applies to calorimetry
    components, cooling loops, and breeding blanket module circuits.


    Typical inlet temperatures in water-cooled tokamak circuits range from 290-330
    K; helium-cooled blanket systems may operate at inlet temperatures up to 550 K
    or higher depending on the thermal design point. The temperature difference $(T_\mathrm{out}
    - T_\mathrm{in})$ is the key diagnostic observable for computing [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port).'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:thermal_power_of_plant_component_port
- name: coolant_temperature_at_outlet
  kind: scalar
  status: draft
  description: Absolute temperature of the cooling fluid at the exit port of a cooling
    loop or calorimetry component, serving as the downstream thermal boundary condition
    in calorimetric heat-load assessment.
  documentation: 'The coolant outlet temperature is the absolute thermodynamic temperature
    of the working fluid leaving a cooling-loop channel or calorimetry component.
    Paired with [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and the [coolant mass flow rate], it supplies the thermodynamic data needed to
    close the first-law calorimetric enthalpy balance.


    The deposited thermal power $P_{th}$ is defined by:


    $$

    P_{th} = \dot{m} \, c_p \, (T_{\mathrm{out}} - T_{\mathrm{in}})

    $$


    where $\dot{m}$ is the coolant mass flow rate, $c_p$ is the specific heat capacity
    of the coolant at constant pressure (approximately 4180 J kg$^{-1}$ K$^{-1}$ for
    water), $T_{\mathrm{out}}$ is this outlet temperature, and $T_{\mathrm{in}}$ is
    the [inlet temperature](name:coolant_temperature_at_inlet). The resulting [deposited
    thermal power](name:thermal_power_of_plant_component_port) and [cumulative thermal
    energy](name:thermal_energy_of_plant_component_port) are derived from this relation.


    Outlet temperature is measured by resistance temperature detectors (RTDs) or calibrated
    thermocouples mounted at the component exit manifold. For water-cooled plasma-facing
    and structural components, outlet temperatures range from 300 to 400 K, with temperature
    rises of a few to tens of kelvins depending on the incident heat load.'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:thermal_power_of_plant_component_port
  - name:thermal_energy_of_plant_component_port
- name: displacement_of_passive_structure
  kind: scalar
  status: draft
  description: Signed linear displacement of a selected point or surface on a passive
    structural component relative to a reference configuration, projected along a
    specified measurement direction.
  documentation: 'Displacement of a passive structure is the scalar change in position
    of a specified material point, attachment point, or target surface on a passive
    structural component. It is the component of the local vector displacement along
    a chosen measurement direction, and is a passive-structure-specific use of the
    generic [displacement](name:displacement_of_passive_structure) concept.


    The signed projected displacement is defined by


    $$

    u(t) = \left[\mathbf{r}(t) - \mathbf{r}_0\right] \cdot \hat{\mathbf{e}}_u

    $$


    where $u(t)$ is the scalar displacement in m, $\mathbf{r}(t)$ is the current position
    vector of the selected point or surface reference point in m, $\mathbf{r}_0$ is
    its reference-configuration position vector in m, $t$ is time in s, and $\hat{\mathbf{e}}_u$
    is a dimensionless unit vector in the chosen positive measurement direction.


    In practice the quantity is obtained from displacement, proximity, or length measurements
    tied to a calibrated reference state. For a sensor viewing a surface, the reported
    value represents the change of the measured target position along the sensor direction
    after applying the reference offset and sign calibration; it should not be interpreted
    as the displacement of an entire component unless that reduction has been explicitly
    defined.


    Typical magnitudes are expressed in meters and are strongly dependent on component
    stiffness, support conditions, electromagnetic loading, thermal expansion, and
    the selected measurement point. No device-independent numerical range is intrinsic
    to the quantity; interpretation should be made relative to the component clearance,
    deformation limit, and measurement resolution.


    Sign convention: Positive when the selected point or surface moves in the chosen
    positive measurement direction $\hat{\mathbf{e}}_u$ relative to the reference
    configuration.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - id: dd:operational_instrumentation/sensor/length
    dd_path: operational_instrumentation/sensor/length
    status: composed
- name: effective_area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Effective ion collection area of a Langmuir probe, equal to the plasma-facing
    surface area projected onto the plane perpendicular to the local magnetic field.
  documentation: 'Effective area of a Langmuir probe is the collecting area presented
    to ions streaming along the local magnetic field. It is the projected part of
    the plasma-facing surface that intercepts field-aligned particle flux, and is
    smaller than the geometric area when the magnetic field strikes the surface obliquely.


    For a locally planar collector, the effective collection area is defined by the
    field-surface incidence angle:


    $$

    A_\mathrm{eff} = A \sin\alpha = A\,|\hat{\mathbf{b}}\cdot\hat{\mathbf{n}}|

    $$


    where $A_\mathrm{eff}$ is the effective collection area in m^2, $A$ is the geometric
    plasma-facing area in m^2, $\alpha$ is the angle_of_langmuir_probe in radians
    measured between the local magnetic field line direction and the plasma-facing
    surface, $\hat{\mathbf{b}}$ is the dimensionless unit vector along the magnetic
    field, and $\hat{\mathbf{n}}$ is the dimensionless unit normal to the collector
    surface. Thus $\alpha=0$ gives zero effective area for a field line tangent to
    the surface, while $\alpha=\pi/2$ gives the full geometric area for normal incidence.
    For a curved or segmented collector, the same projection is applied locally and
    summed over the exposed plasma-facing surface.


    In practice, this quantity is computed from the known exposed probe geometry and
    the local magnetic-field direction at the probe position. It is used when converting
    measured ion saturation current to [parallel_ion_current_density](name:parallel_ion_current_density),
    because that current density is defined per unit area perpendicular to the magnetic
    field.


    Typical effective areas for small embedded or flush-mounted Langmuir probes are
    about 10^-8-10^-5 m^2. Larger protruding tips or collector plates may reach about
    10^-4 m^2, while very grazing magnetic-field incidence can reduce the effective
    area by orders of magnitude relative to the geometric surface area.'
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_ion_current_density
  arguments:
  - name: area_of_langmuir_probe
    operator: effective
    operator_kind: qualifier
- name: electron_average_temperature_at_midplane
  kind: scalar
  status: draft
  description: Electron temperature averaged along a magnetic field line connecting
    the upstream midplane crossing to a downstream divertor target in the scrape-off
    layer. It is a parallel field-line mean, distinct from the local electron temperature
    at the midplane.
  documentation: 'Electron average temperature at midplane is the path-length-weighted
    mean electron temperature along a scrape-off-layer magnetic field line, assigned
    to the field line''s upstream midplane crossing. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height, the upstream endpoint is the intersection of the field
    line with the device midplane $Z=Z_\mathrm{mid}$; the downstream endpoint is the
    connected divertor target reached by following the same field line.


    With $l_\parallel$ the distance measured along the magnetic field line from the
    upstream midplane endpoint to the target, the average is defined by:


    $$

    \langle T_e \rangle_\parallel = \frac{1}{L_\parallel}\int_0^{L_\parallel} T_e(l_\parallel)\,dl_\parallel

    $$


    where $T_e(l_\parallel)$ is the local electron temperature in eV, $l_\parallel$
    and the connection length $L_\parallel$ are in meters, and $\langle T_e \rangle_\parallel$
    is in eV.


    In practice, this quantity is computed by tracing the magnetic field line and
    integrating an inferred or modeled electron-temperature distribution along it.
    A reciprocating Langmuir probe near the midplane can constrain the local upstream
    value, but it does not by itself measure the full upstream-to-target average unless
    combined with information or assumptions about the temperature variation along
    the connected field line. This quantity is therefore distinct from the local [electron_temperature_at_midplane](name:electron_temperature_at_midplane),
    from a volume mean such as [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature),
    and from radial scrape-off-layer scale lengths such as [thermal_electron_decay_length_over_scrape_off_layer](name:thermal_electron_decay_length_over_scrape_off_layer).


    Representative scrape-off-layer field-line averages are regime dependent and should
    be interpreted with the endpoint definition and diagnostic constraints in mind.
    Values are often a few eV to 100 eV: detached or cold-divertor conditions can
    give averages near 1-10 eV, while attached, hotter upstream conditions near the
    separatrix can give 10-100 eV or higher.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_midplane
- name: heat_flux
  kind: vector
  status: draft
  description: Power per unit area transported by plasma particles and fields across
    a reference surface, generalizing over field-aligned conduction, cross-field transport,
    and turbulence-driven energy flux.
  documentation: "Heat flux is the rate of energy transport per unit area across a\
    \ reference surface in a magnetized plasma, encompassing contributions from thermal\
    \ conduction, particle convection, and turbulent fluctuations. In tokamak and\
    \ stellarator geometries, the heat flux vector naturally decomposes into components\
    \ along and across the local magnetic field.\n\nThe total heat flux vector $\\\
    mathbf{q}$ may be written as:\n\n$$\n\\mathbf{q} = q_\\parallel \\hat{b} + \\\
    mathbf{q}_\\perp\n$$\n\nwhere $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit\
    \ vector along the equilibrium magnetic field $\\mathbf{B}$, $q_\\parallel$ is\
    \ the field-aligned component, and $\\mathbf{q}_\\perp$ collects cross-field contributions\
    \ from diffusion, convection, and turbulence.\n\nThe field-aligned component [parallel_heat_flux](name:parallel_heat_flux)\
    \ is the dominant energy exhaust channel in the scrape-off layer, where rapid\
    \ parallel transport carries power to plasma-facing surfaces. In gyrokinetic turbulence\
    \ calculations, the fluctuation-driven contribution is captured by the [perturbed\
    \ heat flux], quantifying energy carried by the non-adiabatic part of the gyrocenter\
    \ distribution function. The convective fraction is characterized by a dimensionless\
    \ factor relating heat flux to local particle flux and temperature.\n\nTypical\
    \ steady-state peak heat fluxes at divertor targets in diverted tokamaks range\
    \ from 1\u201320 MW m$^{-2}$, with transient excursions during edge-localized\
    \ modes reaching several times higher values."
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_heat_flux
- name: ion_current_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Electrical current collected at a single mass-discriminated detector
    channel of a mass spectrometer, quantifying the ion abundance for the atomic mass
    species assigned to that channel.
  documentation: "In a mass spectrometer, each channel selects ions of a fixed mass-to-charge\
    \ ratio $m/z$ from an ionized sample of the plasma exhaust or vessel atmosphere.\
    \ When these ions strike the detector \u2014 a Faraday cup for higher-abundance\
    \ species or an electron multiplier for trace signals \u2014 they produce a measurable\
    \ electrical current that is directly proportional to the ion arrival rate at\
    \ that mass channel.\n\nThe collected current $I_\\text{ch}$ is related to the\
    \ ion arrival rate $\\dot{N}$ by:\n\n$$\nI_\\text{ch} = Z_i \\, e \\, \\dot{N}\n\
    $$\n\nwhere $Z_i$ is the ion charge state (typically unity for singly ionized\
    \ atoms or molecules), $e = 1.602 \\times 10^{-19}$ C is the elementary charge,\
    \ and $\\dot{N}$ is the number of ions collected per second.\n\nThe ion current\
    \ signal is subsequently converted to a partial pressure via the spectrometer's\
    \ sensitivity factor, which encodes the ionization cross-section, ion transmission\
    \ efficiency, and detector gain for each species; the resulting partial pressure\
    \ for the same channel is [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).\
    \ The detector bias voltage governing amplification efficiency is given by [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel).\n\
    \nTypical collected ion currents range from $10^{-12}$ A to $10^{-7}$ A depending\
    \ on the vessel gas composition, partial pressure level, and detector type. Faraday\
    \ cups are suitable for dominant fuel species such as hydrogen isotopes, while\
    \ electron multipliers extend sensitivity to low-abundance impurity or noble-gas\
    \ species."
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:neutral_pressure_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer_channel
- name: ion_field_line_average_temperature_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Ion temperature averaged from upstream to downstream along an open
    magnetic field line in the scrape-off layer, between the upstream midplane region
    and a downstream divertor target. It represents the mean bulk-ion thermal state
    of the scrape-off-layer ion population over the open-field-line connection.
  documentation: 'Field-line-average ion temperature over the scrape-off layer is
    the mean bulk-ion temperature evaluated along a single open magnetic field line
    that connects the upstream midplane region to a downstream divertor target. It
    characterizes the thermal state of the dominant thermal ion population along the
    open-field-line connection length, complementing the analogous midplane-referenced
    quantity ion_average_temperature_at_midplane, which is likewise defined as an
    upstream-to-downstream field-line average. For a multi-species plasma it refers
    to the bulk (main) thermal ion species unless a specific ion is otherwise indicated.


    The parallel arclength-weighted average is defined as:


    $$

    \langle T_i \rangle_{\parallel} = \frac{1}{L_{\parallel}} \int_{\ell_u}^{\ell_t}
    T_i(\ell)\, d\ell

    $$


    where $\ell$ is the arclength coordinate along the magnetic field line in meters,
    $T_i(\ell)$ is the local ion temperature in eV, $\ell_u$ and $\ell_t$ mark the
    upstream and target endpoints, and $L_{\parallel}$ is the connection length between
    them in meters. The resulting average is expressed in eV.


    In practice the quantity is inferred from scrape-off-layer measurements that associate
    ion-temperature information with the field line connecting the upstream and downstream
    locations, for example from a reciprocating probe traversing the scrape-off layer
    during a plunge. The exact averaging procedure depends on the available measurements
    and modeling assumptions, but the intended quantity is the upstream-to-downstream
    ion temperature average along that field line.


    Being a temperature, this quantity is non-negative. Reported scrape-off-layer
    ion temperatures span a broad range depending on plasma regime, radial location
    in the scrape-off layer, and proximity to the divertor targets or the upstream
    region.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/t_i_average
    dd_path: langmuir_probes/reciprocating/plunge/t_i_average
    status: composed
- name: ion_saturated_current
  kind: scalar
  status: draft
  description: Ion saturated current is the limiting conventional current carried
    by positive ions collected by a Langmuir probe biased sufficiently negative to
    make electron collection negligible.
  documentation: 'Ion saturated current is the ion-collection plateau of a Langmuir-probe
    current-voltage characteristic at sufficiently negative probe bias. In this regime
    electrons are repelled, positive ions enter the sheath at approximately the Bohm
    speed, and the current is mainly controlled by the sheath-edge density, ion sound
    speed, and effective ion-collection area.


    For a singly charged plasma in the ideal ion-saturation limit, the collected current
    is commonly modeled as:


    $$

    I_{\mathrm{sat},i} = e\,n_{e,\mathrm{se}}\,c_s\,A_{\mathrm{eff}}

    $$


    where $I_{\mathrm{sat},i}$ is the ion saturated current in A, $e$ is the elementary
    charge in C, $n_{e,\mathrm{se}}$ is the sheath-edge electron density in m^-3,
    $c_s$ is the ion sound speed at the sheath edge in m s^-1, and $A_{\mathrm{eff}}$
    is the [effective collection area of the probe](name:effective_area_of_langmuir_probe)
    in m^2. The effective area is the projected ion-collection area relative to the
    local magnetic field and probe geometry; the simple form assumes a quasineutral
    presheath, Bohm ion entry, negligible residual electron collection, and negligible
    secondary electron emission, with sheath expansion or other collection effects
    absorbed into $A_{\mathrm{eff}}$ or a collection coefficient.


    In practice, the current is obtained either from a fixed negative-bias measurement
    or from the ion-saturation branch of a swept Langmuir-probe characteristic. It
    is used to infer local edge or scrape-off-layer plasma density when $c_s$ and
    $A_{\mathrm{eff}}$ are known or modeled. The area-normalized quantity is the [ion_saturated_current_density](name:ion_saturated_current_density).


    The expected scale follows from the collection relation: for $n_{e,\mathrm{se}}
    = 10^{18}-10^{20}$ m^-3, $c_s = 10^4-10^5$ m s^-1, and $A_{\mathrm{eff}} = 10^{-7}-10^{-5}$
    m^2, millimeter-scale probe collectors give currents of roughly $10^{-5}-1$ A.
    Values vary strongly with plasma density, electron temperature, magnetic-field
    incidence angle, probe size, and surface condition.


    Sign convention: Positive when conventional current associated with collected
    positive ions flows from the plasma into the probe collector.'
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current_density
- name: ion_saturated_current_density
  kind: scalar
  status: draft
  description: Ion saturation current density collected by a Langmuir probe when biased
    sufficiently negative to repel all electrons; a primary diagnostic for local plasma
    density and particle flux in the scrape-off layer.
  documentation: "The ion saturation current density $j_{i,sat}$ is the maximum ion\
    \ current per unit area collected at a probe surface when the probe potential\
    \ is driven sufficiently negative that the electron current is completely suppressed.\
    \ This saturation regime corresponds to the flat portion of the probe current\u2013\
    voltage (I\u2013V) characteristic at large negative bias, where all ions entering\
    \ the presheath are accelerated through the sheath and collected regardless of\
    \ further reduction in probe potential.\n\nIn the Bohm approximation, the ion\
    \ saturation current density is:\n\n$$\nj_{i,sat} = \\frac{1}{2} n_e e c_s\n$$\n\
    \nwhere $n_e$ is the electron density, $e$ is the elementary charge, and $c_s\
    \ = \\sqrt{e T_e / m_i}$ is the Bohm velocity with $T_e$ the electron temperature\
    \ (in eV) and $m_i$ the ion mass. Inverting this relation to obtain $n_e$ requires\
    \ independent knowledge of $T_e$ and the [effective_area_of_langmuir_probe](name:effective_area_of_langmuir_probe).\n\
    \nThis quantity is routinely measured by both embedded probes fixed in divertor\
    \ tiles or first-wall plasma-facing components and by reciprocating probes that\
    \ traverse the scrape-off layer to build radial profiles. Multiplying $j_{i,sat}$\
    \ by the effective collection area yields the total [ion_saturated_current](name:ion_saturated_current),\
    \ while turbulent fluctuations in this quantity are characterized by ion_saturated_fluctuating_current_density.\n\
    \nTypical values range from ~10\u2013100 A/m\xB2 in the far scrape-off layer to\
    \ ~1\u201350 kA/m\xB2 near divertor strike points during attached plasma operation.\n\
    \nSign convention: Positive when ions flow from the plasma toward the probe collector\
    \ surface."
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current
- name: fluctuating_ion_saturated_current_density
  kind: scalar
  status: draft
  description: Non-negative standard deviation of the ion-saturation current density
    about its time average, quantifying temporal fluctuations collected by a negatively
    biased Langmuir probe when electron collection is negligible.
  documentation: 'Fluctuating ion saturated current density is the non-negative RMS
    amplitude of temporal variations in the ion-saturation current density. The underlying
    ion-saturation current density is the limiting conventional current density of
    positive ions collected by a Langmuir probe biased sufficiently negative relative
    to the plasma potential that electron collection is negligible.


    For a sampling interval of duration $T$, the fluctuation amplitude is defined
    as the time-domain standard deviation:


    $$

    \sigma_{j_{i,\mathrm{sat}}} = \left[\frac{1}{T}\int_{t_0}^{t_0+T} \left(j_{i,\mathrm{sat}}(t)-\langle
    j_{i,\mathrm{sat}}\rangle_T\right)^2\,dt\right]^{1/2}

    $$


    where $\sigma_{j_{i,\mathrm{sat}}}$ and $j_{i,\mathrm{sat}}$ are in A m^-2, $t$
    and $t_0$ are times in s, $T$ is the averaging duration in s, and $\langle j_{i,\mathrm{sat}}\rangle_T$
    is the time average over the same interval. The physical range is $0 \le \sigma_{j_{i,\mathrm{sat}}}
    < \infty$; zero corresponds to no resolved temporal variation in the ion-saturation
    current-density signal.


    In practice, the signal is obtained from the ion-saturation branch of a Langmuir-probe
    characteristic or from a probe held at sufficiently negative bias, then divided
    by the effective collecting area. The averaging window and bandwidth determine
    which turbulence and transient components contribute; slow trends, electronic
    noise, and sheath-area corrections are usually treated before computing the standard
    deviation. Any derived relative fluctuation level should use the magnitude of
    the mean current density, $\sigma_{j_{i,\mathrm{sat}}}/|\langle j_{i,\mathrm{sat}}\rangle_T|$,
    so that it remains non-negative and independent of the electrical sign assigned
    to the collected current.


    Typical scrape-off-layer fluctuation amplitudes are about $10^2-10^5$ A m^-2 in
    tokamak edge measurements, ranging from small fractions of the mean ion-saturation
    current density in quiet conditions to order-unity relative fluctuations in intermittent
    blob-dominated transport.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current_density
  - name:parallel_fluctuating_ion_current_density
  arguments:
  - name: ion_saturated_current_density
    operator: fluctuating
    operator_kind: qualifier
- name: neutral_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure exerted by the neutral particle population in a tokamak
    plasma, arising from the second velocity moment of the neutral distribution function.
  documentation: 'Neutral pressure is the kinetic stress exerted by neutral particles
    in the plasma, defined as the scalar pressure derived from the second velocity
    moment of the neutral distribution function summed over all internal quantum states
    of the neutral species. It encompasses contributions from the [thermal neutral
    population](name:thermal_neutral_pressure), which exerts isotropic pressure from
    random thermal motion about the mean flow, and the [fast (suprathermal) neutral
    population](name:fast_neutral_pressure), generated primarily by charge-exchange
    reactions or beam-plasma interactions, which exhibits a gyrotropic pressure tensor
    with distinct parallel and perpendicular components relative to the local magnetic
    field. The sum of both contributions is expressed by [total_neutral_pressure](name:total_neutral_pressure).


    The scalar neutral pressure is related to the neutral distribution function $f_n(\mathbf{v})$
    by:


    $$

    p_n = \frac{m_n}{3} \int f_n(\mathbf{v})\,|\mathbf{v} - \mathbf{u}_n|^2\, d^3v

    $$


    where $m_n$ is the neutral particle mass and $\mathbf{u}_n$ is the mean neutral
    flow velocity. For the thermal neutral component this expression is exact as the
    isotropic pressure; for fast neutrals it represents one-third of the trace of
    the full gyrotropic pressure tensor.


    Neutral pressure is measured by barometry gages distributed over the vacuum vessel
    walls, providing local neutral gas inventory data relevant to plasma fueling,
    recycling, and neutral transport modeling. It may also be inferred from charge-exchange
    spectroscopy or computed by neutral transport codes solving the Boltzmann equation
    for the neutral species. A species-discriminated counterpart is given by [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).


    Typical values in tokamak divertors range from $10^{-4}$ Pa to several Pa during
    attached operation, rising toward tens of Pa near strike points under high-recycling
    or detached conditions.


    Sign convention: Positive for any neutral particle ensemble with a finite second
    velocity moment about the mean flow velocity.'
  unit: Pa
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:thermal_neutral_pressure
  - name:fast_neutral_pressure
  - name:total_neutral_pressure
  - name:neutral_pressure_of_mass_spectrometer_channel
- name: neutral_pressure_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Calibrated neutral pressure equivalent assigned to one mass-discriminated
    mass-spectrometer channel. It is a channel-resolved pressure contribution inferred
    from detected ions, not necessarily the partial pressure of a unique neutral species.
  documentation: 'Neutral pressure of a mass spectrometer channel is the calibrated
    partial-pressure equivalent associated with neutrals whose ionization products
    contribute to a selected mass-to-charge channel. Because ionization can produce
    fragments and because different isotopologues, charge states, or isobaric species
    can overlap in mass, the value is best interpreted as a channel-resolved neutral
    pressure contribution unless the calibration model resolves a unique species.


    A linear response model is commonly used to express the calibration and cross-sensitivity
    between neutral components and measured ion currents:


    $$

    I_j = \sum_k R_{jk}\,p_k

    $$


    where $I_j$ is the measured ion current in detector channel $j$ in A, $p_k$ is
    the calibrated neutral pressure equivalent for component or channel $k$ in Pa,
    and $R_{jk}$ is the response matrix in A Pa$^{-1}$. The reported quantity is one
    component $p_k$ obtained from a calibrated inverse or regularized inverse of this
    response relation; when cross-sensitivities are negligible this reduces to the
    scalar calibration $p_k = C_k I_k$, with $C_k$ in Pa A$^{-1}$ after background
    subtraction.


    In practice the quantity is inferred with a residual-gas or mass spectrometer
    by ionizing sampled neutrals, separating ions by mass-to-charge ratio, and applying
    calibrated sensitivities for the ionizer, analyzer, detector gain, fragmentation
    pattern, and sampling line. A physically meaningful calibrated pressure is non-negative
    and valid only within the calibration domain, including the gas mixture assumptions,
    mass resolution, linear detector response, pressure range, and operating settings
    used to determine the response matrix. Negative numerical estimates can occur
    after offset subtraction or noisy matrix inversion; these should be interpreted
    as below-quantification or invalid estimates, not as negative neutral pressure.


    The sum of calibrated, non-overlapping channel contributions estimates the corresponding
    [total neutral pressure](name:total_neutral_pressure) only when the channel set
    spans the neutral mixture and cross-sensitivities or unresolved overlaps have
    been treated consistently. If fragments, isobars, or isotopologues are not deconvolved,
    a channel pressure is a calibrated pressure equivalent for that channel rather
    than an additive thermodynamic partial pressure of a single species.


    Typical values are strongly dependent on sampling location and operating state.
    Calibrated channel pressures in fusion vacuum and exhaust measurements can span
    many decades, from about $10^{-8}$ Pa in clean high-vacuum residual-gas conditions
    to $10^{-1}$-$10^1$ Pa in exhaust-line, fueling, or pumping transients; values
    outside these illustrative ranges can be valid when covered by calibration.'
  unit: Pa
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_current_of_mass_spectrometer_channel
- name: parallel_fluctuating_ion_current_density
  kind: scalar
  status: draft
  description: Standard deviation of the signed ion electric-current density projected
    along the local magnetic-field direction at a plasma-facing probe. The ion current
    density is the total charge-weighted contribution from all ion species and charge
    states, so this non-negative quantity measures field-aligned ion-current fluctuations.
  documentation: 'Parallel fluctuating ion current density is the standard deviation
    of the signed ion electric-current density projected onto the local magnetic-field
    direction. The ion electric-current density is the total charge-weighted contribution
    from all ion species and charge states, and the standard deviation reports the
    fluctuation amplitude rather than the sign of the instantaneous projection.


    For samples over a specified averaging interval or ensemble, the fluctuation amplitude
    is defined as:


    $$

    \sigma_{j_{i\parallel}} = \sqrt{\left\langle \left[j_{i\parallel}(t) - \left\langle
    j_{i\parallel}\right\rangle\right]^2 \right\rangle}

    $$


    where $\sigma_{j_{i\parallel}}$ is the parallel fluctuating ion current density
    in A m^-2, $j_{i\parallel}(t)$ is the signed parallel ion current density in A
    m^-2, and $\left\langle j_{i\parallel}\right\rangle$ is its mean over the same
    interval or ensemble in A m^-2. The signed input $j_{i\parallel}$ is the projection
    $\mathbf{j}_i\cdot\hat{\mathbf{b}}$; $\hat{\mathbf{b}}$ is the unit vector along
    the local magnetic field, and $\mathbf{j}_i$ is the total charge-weighted ion
    current density summed over species and charge states.


    In practice, the signed samples are inferred from time-resolved plasma-facing
    probe measurements by converting collected ion current to current density using
    the effective collecting area and the local magnetic-field incidence. The standard
    deviation is evaluated over a stated time window, ensemble, or frequency band
    after subtracting the mean; instrumental noise and slow drifts are commonly treated
    separately when the intent is to quantify plasma turbulence.


    Typical fluctuation amplitudes in scrape-off-layer and divertor probe measurements
    are about $10^2$-$10^5$ A m^-2, with lower values in weakly ionized or shadowed
    conditions and higher values during intermittent filament impacts or near high-recycling
    divertor targets. The relevant range should be interpreted together with the averaging
    bandwidth and local plasma density and temperature.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_ion_current_density
  - name:fluctuating_ion_saturated_current_density
- name: parallel_heat_flux
  kind: scalar
  status: draft
  description: Power per unit area transported along the local magnetic field direction,
    quantifying the dominant energy exhaust channel in the scrape-off layer and at
    plasma-facing surfaces.
  documentation: "The parallel heat flux $q_\\parallel$ is the component of the heat\
    \ flux vector aligned with the local magnetic field, representing the primary\
    \ energy transport mechanism in the scrape-off layer (SOL) where conduction along\
    \ field lines exceeds cross-field transport by orders of magnitude.\n\nIn Langmuir\
    \ probe diagnostics, $q_\\parallel$ is inferred from the sheath energy balance:\n\
    \n$$\nq_\\parallel = \\gamma_\\mathrm{sh} \\, \\frac{k_B T_e}{e} \\, j_\\mathrm{sat}\n\
    $$\n\nwhere $j_\\mathrm{sat}$ is the [ion saturation current density](name:ion_saturated_current_density),\
    \ $T_e$ is the local [electron temperature at the wall](name:electron_temperature_at_wall),\
    \ $\\gamma_\\mathrm{sh} \\approx 5$\u2013$8$ is the dimensionless sheath heat\
    \ transmission coefficient accounting for both ion and electron energy channels,\
    \ $k_B$ is Boltzmann's constant, and $e$ is the elementary charge.\n\nMeasurements\
    \ are performed using probes embedded in plasma-facing components such as divertor\
    \ tiles and limiters, or on reciprocating drives that plunge into the SOL. Accurate\
    \ conversion from raw probe signals to heat flux requires both the [effective\
    \ probe collection area](name:effective_area_of_langmuir_probe) and the local\
    \ magnetic field incidence angle described by angle_of_langmuir_probe.\n\nTypical\
    \ values in current tokamak SOLs range from 1\u2013100 MW m$^{-2}$, with peak\
    \ loads near the divertor strike points posing a primary challenge for plasma-facing\
    \ component design and lifetime.\n\nSign convention: Positive when heat flows\
    \ in the direction of the magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$ at the probe position."
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current_density
  - name:electron_temperature_at_wall
  - name:effective_area_of_langmuir_probe
  arguments:
  - name: heat_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_ion_current_density
  kind: scalar
  status: draft
  description: Parallel ion current density is the projection of the total ion electric-current
    density onto the local magnetic-field direction. It is a charge-weighted sum over
    ion species and charge states, so each ion particle flux contributes in proportion
    to its charge state rather than as an unweighted particle count.
  documentation: 'Parallel ion current density is the component of ion electric-current
    density flowing along the local magnetic field. For an ion population with multiple
    species or charge states, the unqualified quantity represents the total ion contribution,
    obtained by charge-weighting and summing the parallel particle fluxes of the contributing
    ion populations.


    The projection and charge-weighted aggregation are


    $$

    j_{\parallel i} = \mathbf{j}_i \cdot \hat{\mathbf{b}} = e \sum_s Z_s \, \Gamma_{\parallel
    s}

    $$


    where $j_{\parallel i}$ is the parallel ion current density in A m$^{-2}$, $\mathbf{j}_i$
    is the total ion current-density vector in A m$^{-2}$, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field, $e$ is the elementary charge
    in C, $s$ indexes ion species and charge states, $Z_s$ is the ion charge state,
    and $\Gamma_{\parallel s}$ is the signed parallel particle flux of population
    $s$ in m$^{-2}$ s$^{-1}$. This distinguishes the current density from an unweighted
    ion particle flux: highly charged ions contribute proportionally more electric
    current for the same particle flux.


    In practice, this quantity may be inferred from charged-particle collection by
    Langmuir probes or other plasma-facing collectors using a sheath and collection-area
    model, local magnetic-field direction, and surface geometry. It may also be computed
    from kinetic or fluid descriptions by taking the first velocity moment of the
    ion distribution for each species and charge state, multiplying by charge, summing,
    and projecting along $\hat{\mathbf{b}}$.


    Representative boundary-plasma magnitudes vary strongly with density, temperature,
    magnetic-field incidence angle, and proximity to material surfaces. Edge and divertor
    measurements commonly span order-of-magnitude ranges such as $10^2$-$10^5$ A m$^{-2}$,
    with larger transient or near-sheath values possible in high-flux conditions.


    Sign convention: Positive when the net ion charge flux is in the local magnetic-field
    direction $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:effective_area_of_langmuir_probe
  - name:ion_saturated_current_density
- name: temperature_at_midplane
  kind: scalar
  status: draft
  description: Thermodynamic plasma temperature referenced to the outboard, low-field-side
    midplane of the scrape-off layer. This parent concept covers local species temperatures
    and spatial field-line averages anchored at that upstream midplane crossing.
  documentation: 'Temperature at midplane is the thermodynamic energy scale of a plasma
    population associated with the upstream outboard, low-field-side midplane in the
    scrape-off layer. As a parent concept, it includes species-specific local values
    such as [electron_temperature_at_midplane](name:electron_temperature_at_midplane)
    and [ion_temperature_at_midplane](name:ion_temperature_at_midplane), as well as
    spatial averages along open magnetic field lines such as average_temperature_at_midplane.
    It does not by itself specify an electron, ion, impurity, or species-combined
    temperature unless a more specific quantity states that choice.


    For a local plasma population $a$ represented by a scalar pressure relation, the
    temperature expressed in electronvolts is related to pressure by:


    $$

    p_a = e\, n_a\, T_a

    $$


    where $p_a$ is scalar pressure in Pa, $n_a$ is number density in m^-3, $T_a$ is
    the population temperature in eV, $e$ is the elementary-charge conversion factor
    from eV to joules, and the subscript $a$ labels the plasma population. A field-line-averaged
    midplane temperature is formed by averaging the corresponding local temperature
    along an open magnetic field line segment that starts at the upstream outboard
    midplane crossing and extends toward a divertor target, with the spatial weighting
    defined by the more specific quantity.


    Local midplane temperatures are measured with diagnostics sensitive to the relevant
    plasma population, such as Thomson scattering or Langmuir-probe current-voltage
    characteristics for electrons and charge-exchange spectroscopy or retarding-field
    analysis for ions. Field-line averages are computed by sampling or integrating
    the local temperature along reconstructed open magnetic field lines in scrape-off-layer
    transport analysis.


    Typical scrape-off-layer midplane temperatures in tokamak plasmas range from 1-20
    eV in the far scrape-off layer to 10-150 eV near the separatrix. Ion temperatures
    are often comparable to or several times higher than electron temperatures, and
    field-line averages between the midplane and a divertor target commonly fall within
    the same order of magnitude but depend strongly on parallel transport and detachment
    state.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_midplane
  - name:ion_temperature_at_midplane
- name: electron_temperature_at_midplane
  kind: scalar
  status: draft
  description: Local electron temperature at the outboard, low-field-side midplane
    in the scrape-off-layer plasma. It is the thermodynamic electron energy scale
    there, distinct from a flux-surface average or a field-line average.
  documentation: 'Electron temperature at the midplane is the local electron temperature
    at the outboard, low-field-side intersection of the plasma midplane with the scrape-off
    layer. It characterizes the thermal spread of the electron velocity distribution
    at that location, rather than a [flux-surface-averaged electron temperature](name:flux_surface_averaged_electron_temperature)
    or a field-line average such as [electron average temperature at midplane](name:electron_average_temperature_at_midplane).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the local evaluation can
    be written as:


    $$

    T_{e,\mathrm{mid}} = T_e(R_{\mathrm{OMP}}, \phi_0, Z_{\mathrm{mid}})

    $$


    where $T_e$ is the local electron temperature, $R_{\mathrm{OMP}}$ is the major
    radius of the outboard midplane point in the scrape-off layer, $\phi_0$ is the
    toroidal angle of that point, and $Z_{\mathrm{mid}}$ is the vertical height of
    the plasma midplane. Expressed in eV, $T_e$ is the electron thermal energy scale;
    for a Maxwellian distribution, the mean random thermal kinetic energy per electron
    is $\langle E_e\rangle = 3T_e/2$ when both are expressed as energies.


    It is commonly inferred from local edge measurements such as Langmuir-probe current-voltage
    characteristics, with interpretation depending on sheath physics, plasma potential,
    secondary emission, magnetization, and non-Maxwellian effects. Local sampling
    makes this quantity sensitive to radial position relative to the separatrix, turbulent
    fluctuations, and toroidal or poloidal asymmetries; separate measures such as
    [thermal electron decay length over the scrape-off layer](name:thermal_electron_decay_length_over_scrape_off_layer)
    describe radial falloff rather than this single local value.


    Typical values in tokamak scrape-off layers are 5-100 eV near the outboard midplane,
    with lower values common farther from the separatrix and higher values possible
    close to the separatrix in strongly heated plasmas. The value is governed by parallel
    heat conduction, sheath heat transmission, cross-field transport, ionization and
    radiation losses, and upstream power flow.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_average_temperature_at_midplane
  - name:electron_temperature_at_wall
  - name:thermal_electron_decay_length_over_scrape_off_layer
  arguments:
  - name: temperature_at_midplane
    operator: electron
    operator_kind: qualifier
- name: ion_temperature_at_midplane
  kind: scalar
  status: draft
  description: Local ion temperature at the outboard, low-field-side midplane of the
    scrape-off-layer plasma. It represents the ion thermal energy at that point, not
    a flux-surface or midplane-averaged value.
  documentation: 'Local ion temperature at the midplane is the thermal spread of the
    ion velocity distribution evaluated at the outboard, low-field-side crossing of
    the scrape-off-layer plasma. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height,
    it is a point quantity near the $Z$ position of the magnetic axis, distinct from
    the averaged comparator [ion_average_temperature_at_midplane](name:ion_field_line_average_temperature_over_scrape_off_layer).


    For a single ion species $s$, the numerical temperature reported in electronvolts
    is related to the second central moment of the ion distribution function by:


    $$

    T_{i,s}^{\mathrm{eV}}(\mathbf{x}_m) = \frac{m_s}{3 e\, n_s(\mathbf{x}_m)} \int
    |\mathbf{v}-\mathbf{u}_s(\mathbf{x}_m)|^2 f_s(\mathbf{x}_m,\mathbf{v})\, d^3v

    $$


    where $\mathbf{x}_m$ is the local midplane position, $m_s$ is the ion mass, $e$
    is the elementary charge, $n_s$ is the ion density, $\mathbf{u}_s$ is the mean
    ion flow velocity, and $f_s$ is normalized so that its velocity integral gives
    $n_s$. For unresolved mixtures, the unqualified ion temperature denotes an effective
    bulk-ion value, normally the density-weighted species average $\sum_s n_s T_{i,s}/\sum_s
    n_s$; species-specific temperatures require an explicit species qualifier.


    At the outboard midplane in the scrape-off layer, this quantity is commonly inferred
    from local electrostatic probe measurements, including reciprocating probe plunges,
    or from edge diagnostic analysis constrained by sheath and kinetic models. Because
    the measurement samples the plasma at the collector or viewing location, it should
    be interpreted as a local boundary-plasma value rather than as a flux-surface
    average.


    Representative local scrape-off-layer midplane ion temperatures are typically
    5-100 eV, with values of a few eV to 20 eV in cooler far-scrape-off-layer or detached
    conditions and 20-100 eV closer to the separatrix in attached, higher-power conditions.
    Core and pedestal ion temperatures can be much larger and should not be inferred
    from this local boundary quantity.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_field_line_average_temperature_over_scrape_off_layer
  arguments:
  - name: temperature_at_midplane
    operator: ion
    operator_kind: qualifier
- name: temperature_at_sensor_attachment_point
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the material at the point where a monitoring
    sensor is mechanically attached to a structural component. It is a calibrated
    absolute temperature of the attachment region, not the sensor's raw electrical
    response.
  documentation: 'Temperature at a sensor attachment point is the local thermodynamic
    temperature of the structural material at the mechanical contact or bonding location
    of a monitoring sensor. It represents the material state at that attachment region
    on the Kelvin scale, distinct from a temperature difference or from the uncalibrated
    electrical signal produced by the sensor.


    For a sufficiently small attachment region, the quantity is the material temperature
    field evaluated at the attachment location:


    $$

    T_\mathrm{attach}(t) = T_\mathrm{mat}(\mathbf{x}_a,t)

    $$


    where $T_\mathrm{attach}$ is the attachment-point temperature, $T_\mathrm{mat}$
    is the thermodynamic temperature field in the component material, $\mathbf{x}_a$
    is the position of the sensor attachment point, and $t$ is time.


    In practice this temperature is obtained from a calibrated sensor in thermal contact
    with the component, such as a thermocouple, resistance thermometer, or similar
    contact temperature monitor. The calibration converts the measured electrical
    response, together with any reference-junction or lead corrections, into an absolute
    temperature estimate for the attachment region; the raw voltage-type signal is
    a related but different quantity, for example [voltage_of_temperature_sensor](name:voltage_of_temperature_sensor).
    Nearby coolant temperatures such as [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet) may influence
    the local value but do not define it.


    Representative values for room-temperature structural monitoring are about 290-320
    K before strong local heating or cooling. Operational values are component-, attachment-,
    and sensor-specific, so allowable ranges should be determined from the material,
    thermal environment, and sensor calibration rather than inferred from the standard
    name alone.'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
  - name:voltage_of_temperature_sensor
  - name:temperature_of_neutron_detector
- name: temperature_at_wall
  kind: scalar
  status: draft
  description: Representative kinetic temperature of the boundary plasma immediately
    adjacent to a plasma-facing wall surface, encompassing both electron and ion populations
    and distinct from the solid wall material temperature.
  documentation: "The plasma temperature at the wall characterizes the thermal energy\
    \ scale of the boundary plasma in the thin layer immediately in front of plasma-facing\
    \ components. It forms the thermal boundary condition for plasma-wall interaction\
    \ models governing sheath formation, particle recycling, and surface heat loading.\
    \ The separate contributions from electrons and ions are resolved by [electron_temperature_at_wall](name:electron_temperature_at_wall)\
    \ and ion_temperature_at_wall, the latter representing a density-weighted average\
    \ over all ion species and charge states when no species is specified.\n\nThe\
    \ local electron and ion temperatures jointly determine the sheath potential $\\\
    phi_s$ at the wall, with the directed ion energy at the sheath edge approximated\
    \ as $E_i \\approx 2 k_B T_e + k_B T_i + e\\phi_s$, where $k_B$ is the Boltzmann\
    \ constant, $T_e$ is the electron temperature, $T_i$ is the ion temperature, and\
    \ $e$ is the elementary charge.\n\nThe wall-adjacent plasma temperature is inferred\
    \ from wall-embedded or near-wall Langmuir probes, retarding field analyzers,\
    \ or from scrape-off-layer transport models constrained by measured particle and\
    \ energy fluxes such as plasma_deposited_power_at_wall.\n\nTypical boundary plasma\
    \ temperatures range from approximately $10^4$ to $10^6$ K (1\u2013100 eV) in\
    \ tokamak devices, with higher values in the main scrape-off layer and lower values\
    \ near divertor targets and limiter surfaces."
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/temperature/values
    dd_path: wall/description_ggd/ggd/temperature/values
    status: composed
  - id: dd:wall/global_quantities/temperature
    dd_path: wall/global_quantities/temperature
    status: composed
- name: electron_temperature_at_wall
  kind: scalar
  status: draft
  description: Kinetic temperature of electrons in the plasma immediately adjacent
    to a plasma-facing wall surface, distinct from the material temperature of the
    solid wall. It represents the local electron thermal energy scale on the plasma
    side of the sheath.
  documentation: 'Electron temperature at the wall is the scalar kinetic temperature
    of electrons in the boundary plasma on the plasma side of a plasma-facing material
    surface. It describes the local random electron energy spread immediately adjacent
    to the wall and is distinct from the solid material temperature. As a second central
    moment of a velocity distribution, it is non-negative and equals zero only for
    an electron population with no thermal spread.


    For a local electron distribution, the kinetic definition is the second central
    moment of velocity about the mean flow:


    $$

    \mathcal{T}_e = \frac{m_e}{3 n_e}\int |\mathbf{v}-\mathbf{u}_e|^2 f_e(\mathbf{v})\,d^3v

    $$


    where $\mathcal{T}_e$ is the scalar electron thermal energy in joules, $m_e$ is
    the electron mass in kg, $n_e=\int f_e(\mathbf{v})\,d^3v$ is the electron density
    in m^-3, $\mathbf{v}$ and $\mathbf{u}_e$ are particle and mean electron velocities
    in m s^-1, and $f_e$ is normalized so that its velocity integral gives $n_e$ (units
    m^-6 s^3 when velocity is in m s^-1). The value in eV is $T_e=\mathcal{T}_e/E_\mathrm{eV}$,
    with $E_\mathrm{eV}=1.602176634\times10^{-19}\ \mathrm{J}$.


    In practice this quantity is inferred at plasma-facing surfaces from diagnostics
    and models sensitive to the near-wall electron distribution. Flush or embedded
    Langmuir probes estimate it from the electron retarding portion of a swept current-voltage
    characteristic, while analysis may use single- or multi-temperature effective
    fits when the distribution is not well represented by one Maxwellian. It can also
    be supplied by edge or sheath calculations that evaluate the local distribution
    function at the wall.


    Representative values are strongly regime dependent: detached or highly cooled
    divertor plasmas are often around 0.5-5 eV, attached divertor and limiter conditions
    commonly a few to several tens of eV, and hotter low-density boundary plasmas
    can approach 100 eV. This quantity is the electron counterpart of ion_temperature_at_wall
    and helps interpret total_incident_electron_particle_flux_at_wall and electron_incident_kinetic_energy_flux_at_wall;
    it should not be confused with upstream [electron_temperature_at_midplane](name:electron_temperature_at_midplane).'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_midplane
  arguments:
  - name: temperature_at_wall
    operator: electron
    operator_kind: qualifier
- name: thermal_energy_of_plant_component_port
  kind: scalar
  status: draft
  description: Cumulative thermal energy extracted through a cooling-loop port on
    a plant component since the start of the plasma pulse, obtained by time-integrating
    the measured coolant enthalpy balance.
  documentation: 'The thermal energy of a plant component port is the total heat removed
    by the cooling loop of that component, accumulated from pulse start to the current
    measurement time. It is the time-integral of the instantaneous [thermal power
    extracted at the port](name:thermal_power_of_plant_component_port), making it
    a running calorimetric total rather than a rate quantity.


    The defining relation is:


    $$

    E_\text{th}(t) = \int_0^t P_\text{th}(t'') \, dt''

    $$


    where $P_\text{th}$ is the instantaneous extracted thermal power (in W) and the
    lower integration limit is the start of the pulse.


    The integrand $P_\text{th}$ is itself derived from the coolant enthalpy balance
    $P_\text{th} = \dot{m} c_p (T_\text{out} - T_\text{in})$, where $\dot{m}$ is the
    coolant mass flow rate, $c_p$ is the specific heat capacity of the coolant, and
    $T_\text{out}$ and $T_\text{in}$ are the [outlet](name:coolant_temperature_at_outlet)
    and [inlet](name:coolant_temperature_at_inlet) coolant temperatures. This cumulative
    measure is used in pulse-integrated heat load accounting for plasma-facing components
    and cooling circuits, complementing the instantaneous power signal for assessing
    total energy deposition over a discharge.'
  unit: J
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:thermal_power_of_plant_component_port
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
- name: thermal_power_of_plant_component_port
  kind: scalar
  status: draft
  description: Thermal power transfer rate at a plant component port, obtained from
    the coolant enthalpy change along the associated flow path. It is positive when
    the coolant removes heat from the component, so the coolant enthalpy increases
    from inlet to outlet.
  documentation: 'Thermal power of a plant component port is the instantaneous rate
    of thermal energy transfer between a component and the coolant circuit connected
    through that port. It represents the port contribution to the component heat balance:
    positive values correspond to heat extraction by the coolant, while negative values
    correspond to heat delivered from the coolant to the component.


    For a port $p$, the enthalpy-balance definition is


    $$

    P_{\mathrm{th},p} = \dot{m}_p\left(h_{\mathrm{out},p}-h_{\mathrm{in},p}\right)
    \simeq \dot{m}_p c_{p,\mathrm{f}}\left(T_{\mathrm{out},p}-T_{\mathrm{in},p}\right)

    $$


    where $P_{\mathrm{th},p}$ is the port thermal power in W, $\dot{m}_p$ is the non-negative
    coolant mass-flow magnitude in kg s$^{-1}$ along the associated inlet-to-outlet
    path, $h_{\mathrm{in},p}$ and $h_{\mathrm{out},p}$ are coolant specific enthalpies
    in J kg$^{-1}$, $T_{\mathrm{in},p}$ and $T_{\mathrm{out},p}$ are the corresponding
    inlet and outlet coolant temperatures, and $c_{p,\mathrm{f}}$ is the coolant specific
    heat capacity in J kg$^{-1}$ K$^{-1}$ when the constant-property temperature form
    is adequate. If a signed [coolant flow](name:coolant_flow_of_plant_component_port)
    is used, its positive direction defines the inlet-to-outlet path for evaluating
    the [inlet](name:coolant_temperature_at_inlet) and [outlet](name:coolant_temperature_at_outlet)
    temperatures or enthalpies.


    In practice this quantity is computed calorimetrically from synchronized coolant
    flow, temperature, pressure, and fluid-property data. The full enthalpy form is
    preferred for compressible fluids, strong property variation, boiling, condensation,
    or mixtures; the $c_p\Delta T$ approximation is appropriate for single-phase coolant
    over a limited temperature range. Time integration gives the corresponding thermal
    energy transferred through the port.


    Typical magnitudes are strongly component dependent: values may be near 0 W when
    there is little flow or little temperature rise, kW scale for small actively cooled
    plant services, and MW scale for major heat-extraction ports. The sign and magnitude
    should be interpreted together with the associated coolant-flow direction and
    inlet/outlet temperature measurements.


    Sign convention: Positive when the coolant enthalpy increases along the associated
    inlet-to-outlet flow path, corresponding to heat removed from the component by
    the coolant.'
  unit: W
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
  - name:thermal_energy_of_plant_component_port
  - name:total_thermal_power_at_outlet
