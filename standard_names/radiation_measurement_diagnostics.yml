- name: cold_neutral_temperature
  kind: scalar
  status: draft
  description: Translational kinetic temperature of the low-energy neutral atom component,
    represented by the narrow Doppler-broadened contribution to visible spectral emission.
    It characterizes the cold population separately from hotter charge-exchange or
    beam-related neutrals.
  documentation: 'Cold neutral temperature is the translational kinetic temperature
    of the low-energy neutral atom population contributing to an observed emission
    line. In two-component Doppler models it corresponds to the narrow Gaussian component,
    while the broad component is associated with hotter neutrals described by [hot_neutral_temperature](name:hot_neutral_temperature).
    It is a component-resolved quantity and is distinct from a state- or population-averaged
    [neutral_state_temperature](name:neutral_state_temperature).


    For a non-relativistic Maxwellian neutral distribution with isotropic velocity
    spread along the line of sight, the Doppler full width at half maximum of a spectral
    line is related to the cold neutral temperature by:


    $$

    T_\mathrm{cold} = \frac{m c^2}{8 \ln 2\, e}\left(\frac{\Delta\lambda_\mathrm{D,FWHM}}{\lambda_0}\right)^2

    $$


    where $m$ is the neutral atom mass, $c$ is the speed of light, $e$ is the elementary
    charge, $\lambda_0$ is the rest wavelength, and $\Delta\lambda_\mathrm{D,FWHM}$
    is the Doppler contribution to the fitted narrow-line full width after other broadening
    mechanisms have been accounted for. The result is expressed in eV.


    In practice this quantity is inferred by fitting visible emission-line shapes
    with one or more components. Instrumental resolution, fine-structure effects,
    Zeeman or Stark broadening, and line blending must be modeled or deconvolved so
    that the remaining narrow width represents neutral thermal motion. If the neutral
    distribution is non-Maxwellian, strongly anisotropic, or sufficiently energetic
    for relativistic corrections to matter, the fitted value should be interpreted
    as an effective cold-component temperature rather than a true thermodynamic temperature.


    Typical cold neutral temperatures in edge and divertor spectroscopy are of order
    0.1-10 eV, depending on recycling conditions, isotope mass, ionization mean free
    path, and local coupling to the plasma. Values much smaller than the associated
    [hot_neutral_temperature](name:hot_neutral_temperature) indicate a clear separation
    between recycled thermal neutrals and hotter charge-exchange or beam-related populations.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_temperature
  - name:neutral_state_temperature
  - name:cold_neutral_velocity
  - name:cold_neutral_fraction
  arguments:
  - name: neutral_state_temperature
    operator: cold
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_temperature
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_temperature
    status: attached
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/temperature_cold_neutrals
