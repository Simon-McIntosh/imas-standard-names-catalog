- name: toroidal_velocity_of_pellet
  kind: scalar
  status: active
  description: "Toroidal component of the shattered-pellet center-of-mass velocity\
    \ along increasing toroidal angle in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The toroidal center-of-mass velocity is the signed translational
    velocity of the shattered pellet''s mass distribution projected onto the geometric
    toroidal direction. The center-of-mass velocity represents the mass-weighted motion
    of the pellet fragments, excluding their internal relative motions.


    $$

    v_{\phi,\mathrm{cm}} = \mathbf{v}_{\mathrm{cm}} \cdot \hat{\boldsymbol{\phi}}

    $$


    where $\mathbf{v}_{\mathrm{cm}}$ is the shattered-pellet center-of-mass velocity
    in m s$^{-1}$ and $\hat{\boldsymbol{\phi}}$ is the unit vector in the direction
    of increasing toroidal angle. The projection is defined in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It is distinct from the [radial shattered-pellet velocity](name:radial_velocity_of_pellet)
    and [vertical shattered-pellet velocity](name:vertical_velocity_of_pellet), which
    are the corresponding $R$ and $Z$ projections.


    Sign convention: Positive when the shattered-pellet center of mass moves in the
    direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:radial_velocity_of_pellet
  - name:vertical_velocity_of_pellet
  sources:
  - dd_path: spi/injector/pellet/velocity_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-pellet-velocity_phi
