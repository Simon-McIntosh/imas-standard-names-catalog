- name: vertical_coordinate_of_geometric_axis
  kind: scalar
  status: active
  description: "Signed vertical position of the plasma boundary\u2019s geometric axis,\
    \ defined as the midpoint of its maximum and minimum Z extents in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "The geometric-axis vertical coordinate is the midpoint of the plasma\
    \ boundary\u2019s maximum and minimum vertical positions in the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame. Here $R$ is the major-radius coordinate, $\\phi$ is the\
    \ toroidal angle, and $Z$ is the vertical coordinate. It characterizes the boundary\u2019\
    s vertical placement rather than the location of a magnetic-flux extremum.\n\n\
    For the specified plasma boundary, the defining relation is\n\n$$\nZ_{\\mathrm{axis}}\
    \ = \\frac{Z_{\\max}+Z_{\\min}}{2}\n$$\n\nwhere $Z_{\\mathrm{axis}}$ is the vertical\
    \ coordinate of the geometric axis, $Z_{\\max}$ is the boundary\u2019s maximum\
    \ vertical coordinate, and $Z_{\\min}$ is its minimum vertical coordinate.\n\n\
    The quantity applies to the complete plasma boundary and uses the global extrema\
    \ with equal weighting; it is not a local boundary coordinate, an arc-length average,\
    \ or a flux-surface average. It is distinct from the [vertical coordinate of the\
    \ magnetic axis](name:vertical_coordinate_of_magnetic_axis), which identifies\
    \ the vertical position of the interior poloidal-flux extremum rather than the\
    \ midpoint of the boundary extent."
  unit: m
  physics_domain: equilibrium
