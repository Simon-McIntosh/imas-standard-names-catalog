    where $N_{e,\mathrm{eq}}^{\mathrm{Ne,prefill}}$ is the neon equivalent-electron
    count and $N_{\mathrm{Ne,prefill}}$ is the accumulated neutral-neon atom count,
    both pure counts; $Z_{\mathrm{Ne}}=10$ is the atomic number of neon; $\dot{N}_{\mathrm{Ne}}$
    is the neutral-neon atom introduction rate in atoms s$^{-1}$; and $t_0$ and $t_{\mathrm{bd}}$
