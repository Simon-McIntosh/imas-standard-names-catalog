- name: toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted, flux-surface-averaged toroidal bulk-flow velocity
    of oxygen impurity ions, combined over all ionization states on the last closed
    flux surface.
  documentation: 'The quantity is the toroidal component of the oxygen impurity-ion
    bulk velocity on the last closed magnetic flux surface, with oxygen ionization
    states combined by density weighting. It is a surface average rather than the
    velocity at a particular poloidal location.


    The toroidal direction is $\hat{\phi}$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. The defining density-weighted average is:


    $$

    \overline{V}_{\phi,\mathrm{O}}^{\mathrm{LCFS}} = \frac{\left\langle \sum_q n_{\mathrm{O}^{q+}}
    V_{\phi,\mathrm{O}^{q+}} \right\rangle_{\mathrm{LCFS}}}{\left\langle \sum_q n_{\mathrm{O}^{q+}}
    \right\rangle_{\mathrm{LCFS}}}

    $$


    where $q$ indexes the included oxygen ionization states, $n_{\mathrm{O}^{q+}}$
    is the local number density of state $q$, $V_{\phi,\mathrm{O}^{q+}}$ is its toroidal
    bulk-flow velocity, and angle brackets denote flux-surface averaging on the last
    closed flux surface. The quantity excludes other ion species; the corresponding
    all-ion quantity is [toroidal flux-surface-averaged ion velocity at plasma boundary](name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary).
    The local, non-averaged counterpart is [toroidal oxygen velocity at plasma boundary](name:toroidal_oxygen_velocity_at_plasma_boundary).


    Sign convention: Positive when the oxygen-ion bulk flow has a component in the
    direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary
  - name:toroidal_oxygen_velocity_at_plasma_boundary
