- name: radial_non_axisymmetric_magnetic_field
  kind: scalar
  status: draft
  description: Radial (R) component of the non-axisymmetric vacuum magnetic field
    in the right-handed cylindrical (R, phi, Z) frame, representing toroidally non-uniform
    perturbations from error fields, resonant magnetic perturbations, and finite coil
    effects.
  documentation: 'The radial non-axisymmetric magnetic field $B_R^{\rm na}$ is the
    $\hat{R}$-projection of the vacuum magnetic-field perturbation that breaks toroidal
    symmetry, in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is the
    major radius measured from the machine symmetry axis and $Z$ is the vertical height.
    Physical sources include geometric imperfections in coil placement (error fields),
    current-lead feeds, and deliberately applied non-axisymmetric coil currents such
    as resonant magnetic perturbations (RMPs) used for ELM suppression and error-field
    correction.


    The field is defined by subtracting the toroidally averaged axisymmetric radial
    component from the full three-dimensional vacuum radial field:


    $$

    B_R^{\rm na}(R, \phi, Z) = B_R(R, \phi, Z) - \langle B_R \rangle_\phi(R, Z)

    $$


    where $\langle B_R \rangle_\phi$ denotes the average over toroidal angle $\phi$
    at fixed $(R, Z)$.


    This component is computed from three-dimensional vacuum field calculations using
    Biot-Savart integration over all non-axisymmetric coil elements, and evaluated
    on spatial field maps or at control surface points for error-field identification
    and feedback-correction algorithms. Together with [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field)
    and [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field),
    it provides the complete cylindrical decomposition of the non-axisymmetric vacuum
    field; non_axisymmetric_magnetic_field_at_control_surface gives the corresponding
    surface-normal projection. Typical perturbation amplitudes for RMP and error-field
    applications range from $10^{-5}$ to $10^{-2}$ T in medium- to large-scale tokamaks.


    Sign convention: Positive when $B_R$ points in the direction of increasing major
    radius $R$, away from the machine symmetry axis.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vertical_non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:b_field_non_axisymmetric/time_slice/control_surface/b_field_r
    dd_path: b_field_non_axisymmetric/time_slice/control_surface/b_field_r
    status: attached
  - id: dd:b_field_non_axisymmetric/time_slice/field_map/b_field_r
    dd_path: b_field_non_axisymmetric/time_slice/field_map/b_field_r
