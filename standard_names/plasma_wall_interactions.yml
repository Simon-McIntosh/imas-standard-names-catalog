- name: flux_due_to_recombination
  kind: scalar
  status: active
  description: Particle flux due to recombination is the surface-normal particle-number
    flux density across an oriented surface attributable to recombination processes.
    It covers recombined products such as neutral atoms or molecules without fixing
    the wall locus, species, incidence class, or internal state.
  documentation: 'Particle flux due to recombination is the surface-normal particle-number
    flux density across an oriented surface attributable to recombination processes.
    Recombination denotes the conversion of charged plasma particles into a lower-charge
    or neutral product, including electron-ion recombination in a volume and surface-assisted
    formation of neutral atoms or molecules when the counted population crosses the
    chosen surface.


    The local flux density is defined by the net signed recombination-attributable
    particle count crossing a differential surface element:


    $$

    \Gamma_{\mathrm{rec}} = \frac{dN_{\mathrm{rec}}}{dA\,dt}

    $$


    where $\Gamma_{\mathrm{rec}}$ is the recombination particle flux density, $dN_{\mathrm{rec}}$
    is the signed number of particles in the stated population whose crossing is attributed
    to recombination, $dA$ is the surface area in square meters, and $dt$ is the elapsed
    time in seconds.


    This quantity is process-resolved: it excludes particle transport not attributable
    to recombination, such as direct plasma impact, sputtering, evaporation, externally
    injected neutrals, and charge-exchange transport unless the counted particles
    are recombination products. The wall-specific realization is [particle_flux_at_wall_due_to_recombination](name:particle_flux_at_wall_due_to_recombination);
    internal-state-resolved and incident-neutral wall realizations are [internal_state_particle_flux_at_wall_due_to_recombination](name:internal_state_particle_flux_at_wall_due_to_recombination),
    [incident_neutral_particle_flux_at_wall_due_to_recombination](name:incident_neutral_particle_flux_at_wall_due_to_recombination),
    and [incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination).
    The corresponding transported energy is [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).


    Sign convention: Positive when recombination-attributable particles cross the
    oriented surface in the direction of the chosen unit normal.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:neutral_internal_state_particle_flux_at_wall_due_to_recombination
- name: flux_due_to_surface_emission
  kind: scalar
  status: active
  description: Flux of any physical quantity emanating from a material surface through
    emission processes such as particle recycling, sputtering, or secondary electron
    and photon emission.
  documentation: 'Surface emission encompasses the range of physical processes by
    which plasma-facing material surfaces re-emit particles, energy, or radiation
    into the plasma or surrounding environment. These include neutral recycling (incident
    ions reflected or thermally desorbed as neutrals), physical and chemical sputtering
    (wall atoms ejected by energetic ion bombardment), secondary electron emission
    (electrons liberated by ion or electron impact), and thermal or fluorescence photon
    emission from heated or excited surface atoms.


    The emitted flux $\Gamma_\mathrm{emit}$ at a surface element is related to the
    incident driving flux $\Gamma_\mathrm{incident}$ through a process-specific emission
    yield $Y$:


    $$

    \Gamma_\mathrm{emit} = Y \cdot \Gamma_\mathrm{incident}

    $$


    where $Y$ is the emission yield (dimensionless for particle emission, or carrying
    the appropriate units ratio for energy or photon emission), and $\Gamma_\mathrm{incident}$
    is the incident flux of the driving species.


    The specific instantiation of this flux at the first wall is described by [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission).
    For the total radiated thermal power emitted by wall material, see [thermal_power_of_wall_material_due_to_radiation_emission](name:thermal_power_of_wall_material_due_to_radiation_emission).
    General energy transport through a surface is captured by [energy_flux](name:energy_flux).'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_surface_emission
  - name:energy_flux
- name: flux_at_wall_due_to_surface_emission
  kind: scalar
  status: active
  description: Flux of any physical quantity emanating from a plasma-facing wall surface
    through emission processes such as sputtering, desorption, photon emission, and
    secondary-electron emission. The transported quantity may be particle number,
    energy, momentum, or radiative power in a more specific member.
  documentation: 'Flux of any physical quantity emanating from a plasma-facing wall
    surface through emission processes such as sputtering, desorption, thermal evaporation,
    photon emission, secondary-electron emission, or surface de-excitation. It is
    the surface-normal flux density generated by the material response at the wall
    and carried from the material side toward the plasma side.


    The emission flux is related to incident driving fluxes through surface-emission
    yield or response coefficients:


    $$

    F_Q^{\mathrm{emit}} = \sum_k Y_{Qk}^{\mathrm{emit}} F_k^{\mathrm{inc}}

    $$


    where $F_Q^{\mathrm{emit}}$ is the emitted flux density of physical quantity $Q$,
    $F_k^{\mathrm{inc}}$ is incident channel $k$ that drives surface emission, and
    $Y_{Qk}^{\mathrm{emit}}$ is the surface-emission coefficient for producing the
    emitted $Q$ flux.


    This quantity is the wall-specific member of [flux_due_to_surface_emission](name:flux_due_to_surface_emission)
    and is an abstraction over component channels. The energy channel is [energy_flux_at_wall_due_to_surface_emission](name:energy_flux_at_wall_due_to_surface_emission),
    while [energy_flux_at_wall](name:energy_flux_at_wall) denotes energy flux at the
    wall without specifying surface emission as the cause. It excludes flux incident
    on the wall from the plasma or radiation field except as a driver of emission;
    [flux_at_wall_due_to_radiation](name:flux_at_wall_due_to_radiation) denotes radiative
    flux at the wall rather than material emission generated by the wall.


    Sign convention: Positive when the net emitted flux is directed from the wall
    material into the plasma.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_due_to_surface_emission
  - name:energy_flux_at_wall
  - name:energy_flux_at_wall_due_to_surface_emission
  arguments:
  - name: flux_due_to_surface_emission
    operator: wall
    operator_kind: locus
- name: energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: active
  description: Total energy flux density at a plasma-facing wall surface due to surface
    emission processes, encompassing kinetic and potential energy carried by emitted
    particles and photons.
  documentation: "Surface emission at the plasma-facing wall encompasses secondary\
    \ electron emission, neutral and ion sputtering, particle reflection, and photon\
    \ emission stimulated by plasma\u2013wall interactions. Each emission channel\
    \ carries energy away from the wall surface, and this quantity represents their\
    \ aggregate energy flux per unit area. It is the energy-channel specialization\
    \ of [flux_at_wall_due_to_surface_emission](name:flux_at_wall_due_to_surface_emission),\
    \ which spans multiple transported quantities at the wall interface.\n\nThe total\
    \ emitted energy flux $Q_\\mathrm{em}$ is expressed by summing over all surface-emitted\
    \ species $s$ the energy-weighted flux of particles leaving the surface:\n\n$$\n\
    Q_\\mathrm{em} = \\sum_s \\int E_s \\, f_s(E_s) \\, v_{\\perp,s} \\, dE_s\n$$\n\
    \nwhere $E_s$ is the energy of emitted species $s$, $f_s$ is its energy distribution\
    \ function, and $v_{\\perp,s}$ is the wall-normal velocity component. The kinetic\
    \ contribution alone is resolved separately as [kinetic_energy_flux_at_wall_due_to_surface_emission](name:kinetic_energy_flux_at_wall_due_to_surface_emission).\n\
    \nContextualizing this emission flux against the incident plasma heat flux quantifies\
    \ the effective energy reflection coefficient of the plasma-facing surface, a\
    \ key parameter for thermal design of wall components. The net deposited power\
    \ density derives from the difference between the incident and emitted energy\
    \ fluxes and connects to aggregate quantities such as [energy_flux_at_wall](name:energy_flux_at_wall)\
    \ and plasma_deposited_power_at_wall."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_surface_emission
  - name:kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:energy_flux_at_wall
  arguments:
  - name: flux_at_wall_due_to_surface_emission
    operator: energy
    operator_kind: qualifier
- name: helium_3_density_at_limiter
  kind: scalar
  status: active
  description: Helium-3 ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral helium-3 atoms.
  documentation: 'Helium-3 density at a limiter is the local number density of helium-3
