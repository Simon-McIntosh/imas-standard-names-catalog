- name: per_toroidal_mode_fast_ion_absorbed_wave_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power density deposited on fast ions by auxiliary heating,
    resolved per toroidal mode number.
  documentation: The per-toroidal-mode absorbed wave power density on fast ions quantifies
    the volumetric power transferred from a coherent wave (e.g., ICRF or lower hybrid)
    to the fast-ion population through resonant wave-particle interactions, decomposed
    by toroidal mode number $n_\phi$. This quantity is essential for modeling the
    spatial distribution of heating in the poloidal cross-section and for understanding
    the radial deposition profile of auxiliary power onto fast ions. The power density
    is typically computed from full-wave or ray-tracing codes (e.g., TORIC, AORSA,
    GENRAY) that solve the wave equation in toroidal geometry, yielding the local
    absorption rate $P_\mathrm{abs}(\psi, n_\phi) = \langle \mathbf{J}_\mathrm{fast}
    \cdot \mathbf{E} \rangle$, where $\mathbf{J}_\mathrm{fast}$ is the fast-ion current
    density driven by the wave electric field $\mathbf{E}$ and $\langle \cdot \rangle$
    denotes a flux-surface average. Typical values in the plasma core range from $10^5$
    to $10^7$ W/m$^3$ for dominant mode numbers, with the total power integrated over
    $n_\phi$ matching the species-specific absorbed power. Integrating over toroidal
    mode number $n_\phi$ recovers the total fast-ion absorbed wave power density (e.g.,
    [fast_ion_absorbed_wave_power_density](name:fast_ion_absorbed_wave_power_density)),
    while the same decomposition for thermal ions is given by [per_toroidal_mode_thermal_ion_absorbed_wave_power_density](name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density).
    This quantity is sign-invariant as absorbed power is a positive-definite energy
    transfer.
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_absorbed_wave_power_density
  - name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density
