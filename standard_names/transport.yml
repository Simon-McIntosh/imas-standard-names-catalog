- name: fast_neutral_state_density
  kind: scalar
  status: draft
  description: Number density of fast (non-thermal) neutral particles occupying a
    specified internal quantum state of the neutral species.
  documentation: 'Fast neutral state density is the number of neutral particles per
    unit volume in a specified internal quantum state that belong to the fast, non-thermal
    part of the neutral population. It distinguishes energetic neutrals, such as charge-exchange
    atoms, beam neutrals, or wall-reflected neutrals, from the bulk thermal neutral
    gas while retaining the state identity needed for excitation, ionization, and
    radiation modeling.


    A common kinetic definition is the velocity-space integral of the state-resolved
    neutral distribution above a chosen fast-particle energy threshold:


    $$

    n_i^{\mathrm{fast}}(\mathbf{x}) = \int_{E(\mathbf{v}) \ge E_{\mathrm{th}}} f_i(\mathbf{x},\mathbf{v})\,
    d^3 v

    $$


    where $n_i^{\mathrm{fast}}$ is the fast density of internal state $i$, $\mathbf{x}$
    is position, $\mathbf{v}$ is particle velocity in m s$^{-1}$, $f_i$ is the state-resolved
    neutral velocity distribution in units s$^3$ m$^{-6}$ when integrated over velocity,
    $E(\mathbf{v})$ is kinetic energy in J, and $E_{\mathrm{th}}$ is the fast-particle
    threshold energy in J. In applications that use eV for neutral kinetic energy,
    $E$ and $E_{\mathrm{th}}$ must be converted consistently.


    In practice this quantity is computed with kinetic neutral transport or collisional-radiative
    models, often constrained by diagnostics sensitive to energetic neutrals such
    as neutral particle analyzers, charge-exchange measurements, or line emission
    from state-selective transitions. The separation between thermal and fast neutrals
    depends on the modeled distribution and on the selected energy threshold or non-thermal
    component definition.


    Typical values span a wide range: about $10^{10}$-$10^{16}$ m$^{-3}$ in hot confined
    plasma regions, and about $10^{14}$-$10^{18}$ m$^{-3}$ in edge, scrape-off-layer,
    divertor, or source-adjacent regions where recycling, neutral beams, or wall reflection
    can create stronger fast-neutral populations.'
  unit: m^-3
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_profiles/profiles_1d/neutral/state/density_fast
    dd_path: core_profiles/profiles_1d/neutral/state/density_fast
    status: attached
