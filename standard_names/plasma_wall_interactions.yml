- name: tritium_density_at_limiter
  kind: scalar
  status: active
  description: Local particle number density of tritium ions evaluated in the boundary
    plasma immediately adjacent to a plasma-facing limiter surface, on the plasma
    side of the magnetic presheath or sheath entrance.
  documentation: 'Tritium density at a limiter is the local number density of tritium
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, not inside limiter material or in neutral gas at the surface. The quantity
    excludes neutral tritium atoms.


    Because tritium is hydrogenic, its charge-state-summed ion density is the density
    of singly charged tritium ions:


    $$

    n_{\mathrm{T}} = n_{\mathrm{T}^{+}} = \int f_{\mathrm{T}^{+}}(\mathbf{v})\,d^{3}v

    $$


    where $n_{\mathrm{T}}$ is the tritium ion number density, $f_{\mathrm{T}^{+}}(\mathbf{v})$
    is the velocity distribution function of singly charged tritium ions, and $\mathbf{v}$
    is particle velocity.


    This isotope contribution is included in [density_at_limiter](name:density_at_limiter).
    It is evaluated at a limiter rather than at the separatrix, unlike [tritium_density_at_plasma_boundary](name:tritium_density_at_plasma_boundary),
    and is the tritium counterpart of [deuterium_density_at_limiter](name:deuterium_density_at_limiter).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:tritium_density_at_plasma_boundary
  - name:deuterium_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: tritium
    operator_kind: qualifier
  sources:
