- name: radial_centroid_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Major radius coordinate of the geometric center of an electron cyclotron
    launcher mirror, measured from the toroidal symmetry axis in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The radial centroid of an electron cyclotron launcher mirror is
    the perpendicular distance $R$ of the mirror''s geometric center from the machine
    toroidal symmetry axis, defined in the right-handed cylindrical $(R, \phi, Z)$
    frame where $R$ is the major radius in meters. Together with [vertical_coordinate_of_electron_cyclotron_launcher_mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror),
    it fully locates the mirror center in the meridional plane, establishing the geometric
    reference point from which EC beam injection angles and trajectories are computed.


    The centroid position in the machine frame combines with the mirror rotation [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror)
    and any mechanical offset_of_electron_cyclotron_launcher_mirror to define the
    complete launch geometry used in ray-tracing and beam-tracing models for electron
    cyclotron heating and current drive. The local boundary contour of the mirror
    surface is described separately in the mirror-fixed planar frame via [x1_coordinate_of_electron_cyclotron_launcher_mirror](name:x1_coordinate_of_electron_cyclotron_launcher_mirror)
    and [x2_coordinate_of_electron_cyclotron_launcher_mirror](name:x2_coordinate_of_electron_cyclotron_launcher_mirror).


    Sign convention: Positive when the mirror centroid lies at a finite major radius
    from the toroidal symmetry axis ($R > 0$), which holds for all physical in-vessel
    launcher positions.'
  unit: m
  physics_domain: auxiliary_heating
