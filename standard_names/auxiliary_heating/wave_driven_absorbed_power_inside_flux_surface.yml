name: wave_driven_absorbed_power_inside_flux_surface
status: draft
description: Cumulative volume integral of wave-absorbed power density (electrons,
  thermal ions, and fast ions) enclosed by a given flux surface.
documentation: 'This quantity gives the total wave power $P_{\mathrm{abs}}(\psi)$
  (in watts) absorbed inside the flux surface labeled by the poloidal magnetic flux
  $\psi$, computed as $$P_{\mathrm{abs}}(\psi) = \int_0^{V(\psi)} p_{\mathrm{abs}}(\psi'')\,
  dV'',$$ where $p_{\mathrm{abs}}$ is the local absorbed power density in $\mathrm{W\,m^{-3}}$
  and $V(\psi)$ is the plasma volume enclosed by $\psi$. It sums contributions from
  all absorption channels: thermal electrons, thermal ions, and fast (suprathermal)
  ions, providing the cumulative radial deposition profile for RF or microwave heating
  schemes (ECRH, ICRH, LHCD). The profile is monotonically non-decreasing with $\psi$;
  its value at the last closed flux surface equals the total absorbed wave power.
  Typical values range from a few kilowatts in low-power experiments to tens of megawatts
  for ITER-class heating systems. The profile is commonly compared with radiated power
  profiles (`neutral_radiated_power_inside_flux_surface`, `ion_radiated_power_inside_flux_surface`)
  when analyzing the plasma power balance. Related flux-surface-resolved quantities
  include the per-toroidal-mode breakdowns `electron_wave_heating_power_per_toroidal_mode`
  and `fast_ion_wave_absorbed_power_per_toroidal_mode`.'
validity_domain: ''
