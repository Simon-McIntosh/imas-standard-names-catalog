- name: width_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Width of a poloidal field coil is the non-negative scalar full radial
    extent of a rectangular conductor cross-section. It is a length measured along
    the major-radius direction, not a directed displacement.
  documentation: 'Width of a poloidal field coil is the full radial extent of a rectangular
    conductor cross-section. It is a non-negative scalar length in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    For a rectangular cross-section with radial bounds $R_\mathrm{in}$ and $R_\mathrm{out}$,
    the width is


    $$

    w = R_\mathrm{out} - R_\mathrm{in} = \max(R) - \min(R)

    $$


    where $w$ is the coil width, $R_\mathrm{out}$ and $R_\mathrm{in}$ are the larger
    and smaller radial bounds of the conductor cross-section, and all lengths are
    measured in meters.


    The width is determined from the conductor geometry, for example from the radial
    bounds represented by the [radial_outline_of_poloidal_field_coil](name:radial_outline_of_poloidal_field_coil).
    Together with the [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil),
    it defines the rectangular cross-section used in electromagnetic and structural
    calculations; for a rectangle, the [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)
    satisfies the inline relation $A = w h$, where $h$ is in meters and $A$ is in
    square meters.


    Valid values satisfy $w \ge 0$. A strictly positive value represents a finite
    conductor cross-section, while $w = 0$ is a degenerate geometric limit rather
    than a physical coil width.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/width
    dd_path: pf_active/coil/element/geometry/rectangle/width
    status: composed
  - id: dd:pf_active/coil/geometry/rectangle/width
    dd_path: pf_active/coil/geometry/rectangle/width
    status: attached
- name: width_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Non-negative transverse width of a toroidal field coil conductor cross-section,
    measured in the local normal direction of the conductor frame and perpendicular
    to the conductor path. It is the full normal-direction extent for rectangular
    or square sections and the outer diameter for circular or annular sections.
  documentation: 'The width of a toroidal field coil conductor is the non-negative
    length describing the normal-direction size of the conductor cross-section. At
    each point on the conductor centerline, use the local right-handed conductor frame
    $(\hat{t}, \hat{n}, \hat{b})$, where $\hat{t}$ follows the conductor path, $\hat{n}$
    is the cross-section normal direction, and $\hat{b}=\hat{t}\times\hat{n}$ is the
    binormal; the width is measured along $\hat{n}$, while [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil)
    is measured along $\hat{b}$. For rectangular or square conductors it is the full
    extent along $\hat{n}$; for circular sections it is the diameter, and for annular
    sections it is the outer diameter.


    For a rectangular conductor cross-section, the width and height determine the
    geometric cross-sectional area:


    $$

    A = w h

    $$


    where $A$ is the [area_of_toroidal_field_coil](name:area_of_toroidal_field_coil)
    in m^2, $w$ is the width in m, and $h$ is the [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil)
    in m.


    In practice, the width is taken from the coil conductor design definition, manufacturing
    survey, or a reconstructed conductor outline in the local cross-section plane
    $(\hat{n}, \hat{b})$. For an outline-based description, it corresponds to the
    full projected extent of the conductor boundary along $\hat{n}$, with the geometric
    model determining whether the same parameter represents a rectangular width, a
    circular diameter, or an annular outer diameter.


    Typical toroidal field coil conductor widths in medium-to-large tokamaks are about
    0.01-0.10 m, with larger values possible for heavily reinforced cases or winding
    packs in high-field devices.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_poloidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/width
    dd_path: tf/coil/conductor/cross_section/width
    status: composed
- name: x_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Signed x position of the geometric centroid of a ferritic element in
    the right-handed Cartesian (x, y, z) frame, with z along the vertical toroidal
    symmetry axis.
  documentation: 'The x coordinate of a ferritic element centroid is the signed Cartesian
    position of the element''s geometric center along the $\hat{x}$ direction. It
    is defined in the right-handed Cartesian $(x, y, z)$ coordinate frame with basis
    $(\hat{x}, \hat{y}, \hat{z})$, where $\hat{z}$ is vertical and coincides with
    $\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame, and $x=y=0$ lies
    on the toroidal symmetry axis.


    For a centroid with cylindrical position $(R_c, \phi_c, Z_c)$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, the Cartesian coordinate is


    $$

    x_c = R_c \cos \phi_c

    $$


    where $x_c$ is the centroid x coordinate, $R_c$ is the major radius of the centroid,
    and $\phi_c$ is its toroidal angle measured from the $+\hat{x}$ radial half-plane.


    The coordinate is obtained from the component geometry or metrology after fixing
    the machine Cartesian axes. Together with [y_centroid_of_ferritic_element](name:y_coordinate_of_ferritic_element_centroid)
    and [vertical_coordinate_of_ferritic_element](name:vertical_coordinate_of_ferritic_element_centroid),
    it specifies the centroid position used to describe the placement of passive ferritic
    structures in magnetic-field calculations.


    Typical values are set by the machine radius: compact devices commonly have centroid
    x coordinates from -1 m to +1 m, medium-sized tokamaks from -4 m to +4 m, and
    large devices can approach -10 m to +10 m.


    Sign convention: Positive when the centroid lies on the $+\hat{x}$ side of the
    $y$-$z$ plane in the right-handed Cartesian $(x, y, z)$ coordinate frame, toward
    the $\phi=0$ radial half-plane.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:y_coordinate_of_ferritic_element_centroid
  - name:vertical_coordinate_of_ferritic_element_centroid
  sources:
  - id: dd:ferritic/object/centroid/x
    dd_path: ferritic/object/centroid/x
    status: composed
