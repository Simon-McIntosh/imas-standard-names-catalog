- name: total_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: draft
  description: Total net radio-frequency power absorbed by the plasma through ion
    cyclotron resonance heating, summed over all ion-cyclotron launchers or antenna
    systems. It excludes power that is launched but reflected or lost before coupling
    to the plasma.
  documentation: 'Total power due to ion cyclotron heating is the aggregate rate at
    which radio-frequency electromagnetic energy in the ion-cyclotron frequency range
    is deposited in the plasma. It includes resonant and mode-converted wave absorption
    from all active ion-cyclotron launchers or antenna systems, and excludes reflected
    power and non-plasma losses.


    The total absorbed ion-cyclotron heating power is the sum of the absorbed powers
    from the individual contributing systems:


    $$

    P_{\mathrm{IC,tot}} = \sum_{k=1}^{N_{\mathrm{IC}}} P_{\mathrm{IC},k}

    $$


    where $N_{\mathrm{IC}}$ is the number of contributing ion-cyclotron launchers
    or antenna systems, $k$ indexes those systems, and $P_{\mathrm{IC},k}$ is the
    net power absorbed by the plasma from system $k$ in watts.


    In practice, this quantity is inferred from an RF power balance using measurements
    of forward, reflected, and coupled power together with estimates of transmission-line,
    matching-network, antenna, and other non-plasma losses when available. It may
    also be constrained by wave-heating analysis, modulation experiments, or global
    plasma energy-balance checks; it is not the generator output power or the purely
    launched RF power.


    Typical values are $1\times10^5-1\times10^7$ W in medium-sized tokamak experiments
    and can reach $2\times10^7-4\times10^7$ W in large high-power ion-cyclotron heating
    scenarios. The value is zero when no ion-cyclotron RF power is coupled to and
    absorbed by the plasma.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_ion_cyclotron_heating
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:total_power_due_to_electron_cyclotron_heating
  arguments:
  - name: power_due_to_ion_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
