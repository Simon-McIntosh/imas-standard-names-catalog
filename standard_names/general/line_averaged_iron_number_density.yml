name: line_averaged_iron_number_density
status: draft
cocos_transformation_type: one_like
description: Line-of-sight averaged iron ion number density obtained by integrating
  $n_{\mathrm{Fe}}$ along a chord and dividing by the chord length.
documentation: The line-averaged iron number density $\langle n_{\mathrm{Fe}} \rangle_L
  = L^{-1} \int n_{\mathrm{Fe}}(l)\, dl$ (in m$^{-3}$) is the iron ion density averaged
  along a diagnostic line of sight of path length $L$ (in m), where $n_{\mathrm{Fe}}(l)$
  is the local iron density at position $l$ along the chord. This integral quantity
  is directly accessible from VUV or soft-X-ray spectroscopic measurements without
  requiring full profile inversion, making it a convenient monitor of iron impurity
  content during plasma operation. Typical values range from $10^{14}$ to $10^{16}$
  m$^{-3}$ depending on wall material, plasma conditions, and viewing geometry. Converting
  to a local profile requires Abel inversion or tomographic reconstruction using multiple
  chords. See also `iron_number_density` for the spatially resolved quantity.
