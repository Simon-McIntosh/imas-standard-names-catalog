- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum
  kind: scalar
  status: active
  description: Signed derivative of fitted electron density with respect to normalized
    poloidal flux coordinate, evaluated at the H-mode pedestal location where the
    absolute derivative is largest.
  documentation: "Signed derivative of fitted electron density with respect to normalized\
    \ poloidal flux coordinate, evaluated at the H-mode pedestal location where the\
    \ absolute derivative is largest, is the algebraically signed slope of the fitted\
    \ electron-density function of $\x7F\\psi_N$. The normalized poloidal flux coordinate\
    \ $\x7F\\psi_N$ labels poloidal magnetic-flux surfaces and increases from the\
    \ magnetic axis toward the plasma boundary.\n\nThe pedestal-maximum derivative\
    \ is defined by\n\n$$\nG_{n_e,\\mathrm{ped,max}} =\n\\left.\\frac{d n_e}{d\\psi_N}\\\
    right|_{\\psi_N=\\xi_{\\max}},\n\\qquad\n\\xi_{\\max}=\\operatorname*{arg\\,max}_{\\\
    xi\\in P_{\\mathrm{ped}}}\n\\left|\\left.\\frac{d n_e}{d\\psi_N}\\right|_{\\psi_N=\\\
    xi}\\right|\n$$\n\nwhere $G_{n_e,\\mathrm{ped,max}}$ denotes this derivative,\
    \ $n_e$ is the fitted [electron density](name:electron_density), $\\psi_N=(\\\
    psi-\\psi_0)/(\\psi_b-\\psi_0)$ is the normalized poloidal flux coordinate, $\\\
    psi$ is [poloidal magnetic flux](name:poloidal_magnetic_flux), $\\psi_0$ is its\
    \ value at the magnetic axis, $\\psi_b$ is its value at the plasma boundary, $P_{\\\
    mathrm{ped}}$ is the H-mode pedestal interval in $\\psi_N$, and $\\xi_{\\max}$\
    \ is the coordinate value selected by the maximum absolute derivative.\n\nThe\
    \ maximum qualifier is a locus-selection rule based on absolute derivative, not\
    \ a statement that the reported derivative is non-negative and not the location\
    \ of maximum density. This quantity is distinct from [gradient_of_radial_electron_density](name:gradient_of_radial_electron_density),\
    \ which is the density-gradient quantity associated with the pedestal-top core-side\
    \ shoulder locus. It is the electron-density counterpart of [gradient_of_electron_pressure](name:gradient_of_electron_pressure),\
    \ and it differs from [electron-pressure pedestal-top derivative](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top)\
    \ and [electron-temperature pedestal-top derivative](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top),\
    \ which fix the evaluation point at the pedestal top rather than at the steepest\
    \ H-mode pedestal slope.\n\nSign convention: Positive when $n_e$ increases with\
    \ increasing normalized poloidal flux coordinate $\\psi_N$."
  unit: m^-3
  physics_domain: edge_plasma_physics
