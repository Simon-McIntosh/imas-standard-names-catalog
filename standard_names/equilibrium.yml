        a 1D radial profile in the MHD equilibrium. Always positive and used in trapped
        particle fraction calculations and bounce-averaged transport models.
      kind: llm
- name: minimum_safety_factor
  kind: scalar
  status: active
  description: "Signed safety-factor value on the closed magnetic flux surface where\
    \ the magnitude of field-line winding is smallest, distinct from that surface\u2019\
    s location."
  documentation: 'The minimum safety factor is the signed field-line winding number
    evaluated on the nested closed magnetic flux surface where the magnitude of the
    safety factor is smallest. It represents the extremal value of the safety-factor
    function within the confined closed-surface domain.


    The minimizing value is defined by


    $$

    q_{\min} = q(\rho_\ast), \qquad \rho_\ast \in \operatorname*{arg\,min}_{0 \leq
    \rho \leq 1} |q(\rho)|

    $$


    where $q(\rho)$ is the signed [safety factor](name:safety_factor) on the flux
    surface labeled by $\rho$, $\rho_\ast$ is the label of a surface at which the
    magnitude $|q(\rho)|$ is minimized, and $q_{\min}$ is the signed value evaluated
    there. The label $\rho$ is a monotonic flux-surface coordinate whose endpoints
    denote the magnetic axis and the last closed flux surface. In flux coordinates
    $(\rho,\theta,\phi)$, $\theta$ is the poloidal angle and $\phi$ is the toroidal
    angle of the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    The extremum is taken over all nested closed magnetic flux surfaces and is neither
    a flux-surface average nor a sum. The location-defining quantity is separate:
    [poloidal magnetic flux at minimum safety factor](name:poloidal_magnetic_flux_at_minimum_safety_factor)
    identifies the corresponding surface, while this quantity reports only the signed
    safety factor. It is also distinct from a safety factor evaluated at a prescribed
    locus, such as the magnetic axis.


    Sign convention: Positive when the toroidal angle advance of a magnetic field
    line is in the direction of increasing $\phi$ as the poloidal angle $\theta$ increases.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  arguments:
  - name: safety_factor
    operator: minimum
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/q_min/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-q_min-value
    dd_documentation:
