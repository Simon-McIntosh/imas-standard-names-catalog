- name: toroidal_neutral_momentum_diffusivity
  kind: scalar
  status: active
  description: "Toroidal neutral momentum diffusivity is the diagonal toroidal component\
    \ of an effective neutral-particle momentum diffusivity tensor in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, governing down-gradient redistribution of\
    \ aggregate neutral momentum along increasing toroidal angle \u03C6. The toroidal\
    \ qualifier identifies the flux and gradient direction, not the momentum component."
  documentation: 'Toroidal neutral momentum diffusivity is the diagonal toroidal component
    of an effective neutral-particle momentum diffusivity tensor. It parameterizes
    how aggregate neutral momentum density, summed over the neutral states represented
    in the neutral population, is smoothed by diffusive transport along increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius and $Z$ is vertical height.


    In a local diagonal diffusive closure, the toroidal component of the diffusive
    flux of a neutral momentum-density component is related to its toroidal gradient
    by:


    $$

    \Gamma_{\Pi_j,\phi}^{\mathrm{diff}} = -D_{\mathrm{mom},\phi}^{n}\,\frac{1}{R}\frac{\partial
    \Pi_j^{n}}{\partial \phi}

    $$


    where $D_{\mathrm{mom},\phi}^{n}$ is this quantity, $\Pi_j^{n}=\sum_s m_s n_s
    u_{j,s}$ is the aggregate neutral momentum-density component for momentum component
    $j$, $s$ labels neutral states, and $\Gamma_{\Pi_j,\phi}^{\mathrm{diff}}$ is the
    scalar flux component positive along $+\hat{\phi}$. The factor $R^{-1}\partial/\partial\phi$
    is the derivative with respect to arclength in the toroidal direction, and the
    minus sign gives down-gradient diffusion.


    The toroidal qualifier identifies the transport direction, namely the flux component
    and gradient direction, not the component $j$ of momentum being transported. This
    coefficient is one directional component of [neutral_momentum_diffusivity](name:neutral_momentum_diffusivity),
    complementary to [parallel_neutral_momentum_diffusivity](name:parallel_neutral_momentum_diffusivity),
    [poloidal_neutral_momentum_diffusivity](name:poloidal_neutral_momentum_diffusivity),
    and [vertical_neutral_momentum_diffusivity](name:vertical_neutral_momentum_diffusivity);
    it is distinct from the resulting toroidal_neutral_momentum_flux and from convective
    or source terms in the neutral momentum balance.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_diffusivity
  - name:parallel_neutral_momentum_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  - name:vertical_neutral_momentum_diffusivity
  arguments:
