- name: toroidal_xenon_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: Density-weighted toroidal bulk-flow velocity of xenon ions, averaged
    over all ionization states at the core-side shoulder of the H-mode edge transport
    barrier.
  documentation: 'This quantity is the toroidal component of the xenon-ion bulk-flow
    velocity at the H-mode pedestal top. It is the density-weighted mean over all
    xenon ionization states, rather than a sum of their velocities.


    $$

    V_{\phi,\mathrm{Xe}} = \frac{\sum_q n_{\mathrm{Xe},q} V_{\phi,\mathrm{Xe},q}}{\sum_q
    n_{\mathrm{Xe},q}}

    $$


    Here $q$ labels xenon ionization state, $n_{\mathrm{Xe},q}$ is the number density
    of that state, and $V_{\phi,\mathrm{Xe},q}$ is its toroidal bulk-flow component.
    The denominator is the total xenon ion density corresponding to [xenon density
    at the pedestal top](name:xenon_density_at_pedestal_top). The value is evaluated
    at the core-side shoulder of the H-mode edge transport barrier and is distinct
    from [toroidal xenon velocity at the internal transport barrier](name:toroidal_xenon_velocity_at_internal_transport_barrier)
    and [toroidal xenon velocity at the magnetic axis](name:toroidal_xenon_velocity_at_magnetic_axis).


    Sign convention: Positive when the velocity component along $\hat{\phi}$ is positive
    in the right-handed cylindrical $(R, \phi, Z)$ frame, in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
