- name: thermal_ion_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of wave power absorbed by the thermal ion
    population enclosed within a given flux surface, forming a radial power deposition
    profile.
  documentation: "This quantity gives the total wave power deposited into the thermal\
    \ ion population from the magnetic axis outward to a flux surface labeled by a\
    \ radial coordinate, computed as the cumulative volume integral $P_\\mathrm{th,i}(\\\
    psi) = \\int_0^\\psi p_\\mathrm{th,i}\\, dV$, where $p_\\mathrm{th,i}$ is the\
    \ thermal ion absorbed power density and $dV$ is the differential volume element.\
    \ The monotonically increasing radial profile allows direct identification of\
    \ the spatial region where wave\u2013ion coupling is most effective, which is\
    \ essential for designing heating scenarios with controlled deposition profiles\
    \ in ion cyclotron resonance heating (ICRH) and other RF schemes. Typical values\
    \ in ICRH-heated tokamaks range from tens of kilowatts in the core to several\
    \ megawatts at the plasma boundary, depending on the launched power and resonance\
    \ location. The mode-resolved counterpart [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_inside_flux_surface)\
    \ provides the same cumulative integral decomposed by toroidal mode number $n_\\\
    phi$, while the analogous fast ion quantity is given by [fast_ion_wave_absorbed_power_inside_flux_surface](name:fast_ion_wave_absorbed_power_inside_flux_surface).\
    \ The local absorbed power density per unit volume is the primary input; integrating\
    \ it yields this enclosed power. The thermal electron analog is documented under\
    \ [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface),\
    \ and the species-summed volumetric density is given by [wave_absorbed_power_density](name:wave_absorbed_power_density)."
  unit: W
