- name: vertical_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: Vertical (Z) component of the current density driven by the perpendicular
    component of the ion viscous stress tensor in the edge and scrape-off layer plasma.
  documentation: 'The vertical current density $j_{\perp\nu,Z}$ is the projection
    of the perpendicular viscosity-driven current density vector onto the vertical
    ($Z$) axis of the IMAS cylindrical $(R, \phi, Z)$ frame. It represents the rate
    of charge transport in the height direction resulting from gyroviscous and perpendicular
    viscous forces in the edge plasma, where strong radial gradients in the parallel
    ion flow generate a perpendicular viscous stress. This component is measured in
    Ampere per square meter and is particularly relevant for MHD stability and radial
    force balance in the pedestal and scrape-off layer, where poloidal asymmetries
    can produce significant vertical currents. It is the vertical complement to [radial_current_density_due_to_perpendicular_viscosity](name:radial_current_density_due_to_perpendicular_viscosity),
    together providing the full poloidal-plane component of the perpendicular viscosity-driven
    current. Typical edge values range from 0.1 to 10 kA per square meter in H-mode
    tokamak plasmas, with the vertical component peaking in regions of strong poloidal
    variation of the parallel flow.


    Sign convention: Positive when the current density flows in the direction of increasing
    vertical coordinate $Z$ (upward in the machine frame).


    See [current_density_due_to_perpendicular_viscosity](name:current_density_due_to_perpendicular_viscosity)
    for the parent magnitude vector, and [vertical_current_density_due_to_heat_viscosity](name:vertical_current_density_due_to_heat_viscosity)
    for the analogous component driven by heat viscosity.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:current_density_due_to_perpendicular_viscosity
  - name:vertical_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_perpendicular_viscosity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/j_perpendicular_viscosity/z
    dd_path: plasma_profiles/ggd/j_perpendicular_viscosity/z
