- name: ratio_of_iron_density_to_electron_density
  kind: scalar
  status: active
  description: Dimensionless abundance ratio of charge-state-summed iron-ion number
    density to local free-electron number density.
  documentation: 'This quantity is the local iron-to-electron abundance ratio in a
    plasma, comparing the population of iron ions with unbound free electrons.


    $$

    R_{\mathrm{Fe}/e} = \frac{n_{\mathrm{Fe}}}{n_e}

    $$


    where $R_{\mathrm{Fe}/e}$ is the iron-to-electron abundance ratio, $n_{\mathrm{Fe}}$
    is the total [iron-ion number density](name:iron_density), and $n_e$ is the local
    [free-electron number density](name:electron_density).


    The numerator is summed over all positive iron ionization states, while the denominator
    counts free electrons and excludes electrons bound in atoms, molecules, or ions.
    This is a local ratio with no volume averaging, maximum operation, or specified
    spatial locus.


    The ratio is the iron-specific counterpart of the general [ion-density-to-electron-density
    ratio](name:ratio_of_ion_density_to_electron_density); its numerator is the charge-state-summed
    iron density and its denominator is the electron-density parent quantity.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density
  - name:ratio_of_ion_density_to_electron_density
  sources:
  - dd_path: summary/composition/iron/value
