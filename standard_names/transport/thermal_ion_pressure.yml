name: thermal_ion_pressure
status: draft
cocos_transformation_type: one_like
description: Total kinetic pressure of the thermal (Maxwellian) ion population, summed
  over all ion species and charge states.
documentation: "The thermal ion pressure is defined as $p_i = \\sum_s n_{i,s}\\, k_B\\\
  , T_{i,s}$ ($\\mathrm{Pa}$), where $n_{i,s}$ ($\\mathrm{m^{-3}}$) and $T_{i,s}$\
  \ (K or equivalently eV $\\times\\, e / k_B$) are the thermal number density and\
  \ temperature of ion species $s$, and $k_B = 1.381 \\times 10^{-23}\\;\\mathrm{J\\\
  ,K^{-1}}$ is the Boltzmann constant. The sum runs over all ion species and their\
  \ thermalized charge states, explicitly excluding suprathermal populations such\
  \ as NBI-born or fusion-born fast ions. In the radial force balance, $\\nabla p_i\
  \ = n_i Z_i e (\\mathbf{E} + \\mathbf{v}_i \\times \\mathbf{B}) + \\mathbf{R}_i$,\
  \ where $Z_i$ is the charge number, $\\mathbf{E}$ the electric field ($\\mathrm{V\\\
  ,m^{-1}}$), $\\mathbf{v}_i$ the ion fluid velocity ($\\mathrm{m\\,s^{-1}}$), and\
  \ $\\mathbf{R}_i$ the collisional friction force ($\\mathrm{N\\,m^{-3}}$). In tokamak\
  \ H-mode plasmas, core thermal ion pressure typically ranges from $\\sim$10\u2013\
  200 kPa, comparable to or somewhat below the thermal electron pressure depending\
  \ on species composition and the ion-to-electron temperature ratio. The quantity\
  \ is inferred indirectly: charge-exchange recombination spectroscopy (CXRS) provides\
  \ $T_i$ while quasi-neutrality and interferometric or Thomson-scattering $n_e$ data\
  \ constrain ion densities. See also `thermal_electron_pressure` for the electron\
  \ counterpart and `total_thermal_ion_number_density` for the density sum."
