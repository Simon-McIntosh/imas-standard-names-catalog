    dd_path: langmuir_probes/probe/potential_plasma
    status: composed
- name: ion_temperature
  kind: scalar
  status: draft
  description: Ion temperature of the bulk ion population, defined as the parameter
    of the Maxwell-Boltzmann velocity distribution characterizing the mean thermal
    energy per particle. Expressed in electron volts, where 1 eV corresponds to approximately
    11 600 K. Applicable to a single ion species or an effective bulk ion mixture
    in a plasma.
  documentation: "The ion temperature $T_i$ is the parameter of the Maxwell-Boltzmann\
    \ velocity distribution function that characterizes the mean thermal kinetic energy\
    \ of the ion population. For a three-dimensional Maxwellian distribution, the\
    \ mean kinetic energy per particle is\n\n$$\\langle E_i \\rangle = \\tfrac{3}{2}\
    \ k_B T_i$$\n\nwhere $k_B$ is Boltzmann's constant. When $T_i$ is expressed in\
    \ electron volts, the conversion to SI temperature is $T_i \\,[\\mathrm{eV}] =\
    \ k_B T_i \\,[\\mathrm{K}] / e$, where $e$ is the elementary charge.\n\nIn a fully\
    \ ionized plasma, $T_i$ and the electron temperature $T_e$ are in general distinct.\
    \ Ion\u2013electron energy equilibration is governed by a collisional exchange\
    \ rate whose characteristic time scales as $\\tau_{ei} \\propto m_i T_e^{3/2}\
    \ / (n_e \\ln\\Lambda)$, where $m_i$ is the ion mass, $n_e$ is the electron density,\
    \ and $\\ln\\Lambda$ is the Coulomb logarithm. In low-density or weakly collisional\
    \ plasmas (e.g., the scrape-off layer), $T_i$ can substantially exceed $T_e$;\
    \ in the dense, collisional core, $T_i \\approx T_e$ is often satisfied.\n\nThe\
    \ ion thermal pressure is related to $T_i$ by $p_i = n_i T_i$, where $n_i$ is\
    \ the ion number density, making $T_i$ a fundamental input to transport and MHD\
    \ models.\n\n**Typical values:** In the scrape-off layer and divertor, $T_i$ typically\
    \ ranges from a few eV to ~50 eV. In the plasma core of a tokamak, $T_i$ may reach\
    \ several keV during high-performance operation.\n\n**Measurement context:** Ion\
    \ temperature is not directly accessible via Thomson scattering (which measures\
    \ electron temperature and density). Primary experimental diagnostics include\
    \ charge-exchange recombination spectroscopy (CXRS), which resolves the Doppler-broadened\
    \ emission line of a fully stripped impurity to yield $T_i$ of the bulk ion population,\
    \ and neutron emission spectroscopy in deuterium plasmas. At the plasma boundary,\
    \ Langmuir probes with multi-temperature fitting to the ion saturation current\
    \ can provide estimates of $T_i$ in the near-wall region."
  unit: eV
  physics_domain: plasma_measurement_diagnostics
  links:
  - name:electron_temperature
  constraints: []
  sources:
  - id: dd:langmuir_probes/probe/multi_temperature_fits/t_i
    dd_path: langmuir_probes/probe/multi_temperature_fits/t_i
    status: composed
  - id: dd:langmuir_probes/probe/t_i
    dd_path: langmuir_probes/probe/t_i
    status: composed
- name: parallel_component_of_ion_current_density
  kind: scalar
  status: draft
  description: Component of ion current density aligned with the local magnetic field
    direction at a given plasma location. Positive when the ion current flows in the
    direction of the local magnetic field unit vector. Relevant in edge and scrape-off
    layer physics, including Langmuir probe diagnostics.
  documentation: 'The parallel ion current density $j_{\parallel,i}$ is the projection
    of the ion current density vector $\mathbf{j}_i$ onto the local magnetic field
    unit vector $\hat{b} = \mathbf{B}/|\mathbf{B}|$:


    $$j_{\parallel,i} = \mathbf{j}_i \cdot \hat{b}$$


    For a plasma consisting of singly charged ions ($Z = 1$) with quasi-neutrality
    ($n_i \approx n_e$), the parallel ion particle flux density is related to the
    parallel current density by $\Gamma_{\parallel,i} = j_{\parallel,i}/e$, where
    $e$ is the elementary charge. This relation requires the singly charged and quasi-neutral
    assumptions; for higher charge states $Z$, the general relation is $\Gamma_{\parallel,i}
    = j_{\parallel,i}/(Ze)$.


    At a negatively biased or floating surface in contact with a magnetized plasma
    (e.g., a Langmuir probe), the ion saturation current density provides the Bohm-limited
    ion flux. Under the assumptions of singly charged ions and quasi-neutrality ($n_i
    \approx n_e = n_e$), the Bohm saturation value is:


    $$j_{\parallel,i}^{\rm sat} \approx e\, n_e\, c_s$$


    where $c_s = \sqrt{(T_e + \gamma_i T_i)/m_i}$ is the Bohm velocity (ion acoustic
    speed) at the magnetic presheath entrance. The factor $\gamma_i$ is the ion adiabatic
    index (often taken as 1 or 3). Typical saturation values in the scrape-off layer
    of a tokamak range from $10^2$ to $10^6\,\mathrm{A\,m^{-2}}$ depending on the
    upstream density and temperature.


    Sign convention: Positive when the ion current flows in the direction of the local
    magnetic field vector $\mathbf{B}$, i.e., along increasing arc length $s$ defined
    by $\hat{b}$.


    This quantity is closely related to the total parallel current density (ions plus
    electrons), the parallel electron current density, and the parallel heat flux
    carried by ions. In scrape-off layer modeling it appears as a source or sink term
    in the parallel momentum and energy balance equations.'
  unit: A.m^-2
  physics_domain: plasma_measurement_diagnostics
  links:
  - name:ion_current_density
