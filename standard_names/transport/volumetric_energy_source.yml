name: volumetric_energy_source
status: draft
description: Power density injected into or removed from a plasma species by external
  or internal processes, expressed as energy per unit volume per unit time.
documentation: "The volumetric energy source $S_E$ (in $\\mathrm{W\\,m^{-3}}$) appears\
  \ on the right-hand side of the energy transport equation $\\partial W / \\partial\
  \ t + \\nabla \\cdot \\mathbf{q} = S_E$, where $W$ is the energy density and $\\\
  mathbf{q}$ the energy flux. It aggregates contributions from ohmic heating, auxiliary\
  \ heating (NBI, ICRH, ECRH), radiation losses, and collisional exchange between\
  \ species. Typical core values range from $10^4$\u2013$10^7\\;\\mathrm{W\\,m^{-3}}$\
  \ depending on plasma regime and heating scenario; in the scrape-off layer the net\
  \ source is usually negative due to radiation. The quantity is species-resolved\
  \ when used for ions or electrons separately; see `total_ion_energy_source` for\
  \ the ion-specific variant and `electron_energy_flux` for the corresponding transport\
  \ channel."
validity_domain: ''
constraints: []
