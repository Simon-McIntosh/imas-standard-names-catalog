- name: toroidal_total_momentum_flux
  kind: scalar
  status: draft
  description: "Toroidal component, in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame, of the total edge-plasma momentum-flux density. It is a stress-like flux\
    \ per unit area for toroidal momentum transport, including advective, pressure,\
    \ viscous, and modeled turbulent stress contributions; it is not a momentum inventory\
    \ or torque source."
  documentation: 'Toroidal total momentum flux is the flux-density component associated
    with transport of toroidal momentum in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It has the dimensions of stress or pressure: momentum transported per
    unit time per unit area. "Total" means that all included particle species and
    modeled transport mechanisms are combined; it does not denote a volume-integrated
    momentum content or a momentum source.


    A useful continuum definition is the $\phi$-projected component of the total momentum-flux
    tensor across a surface whose positive normal is $+\hat{\phi}$:


    $$

    F_{\phi}^{\mathrm{tot}} = \hat{\phi}\cdot \left[\sum_s\left(\rho_s\mathbf{u}_s\mathbf{u}_s
    + p_s\mathbf{I} + \boldsymbol{\pi}_s + \boldsymbol{\tau}^{\mathrm{turb}}_s\right)\right]\cdot
    \hat{\phi}

    $$


    where $s$ labels species, $\rho_s$ is mass density in kg.m^-3, $\mathbf{u}_s$
    is fluid velocity in m.s^-1, $\mathbf{u}_s\mathbf{u}_s$ is a dyadic product, $p_s$
    is scalar pressure in kg.m^-1.s^-2, $\mathbf{I}$ is the identity tensor, and $\boldsymbol{\pi}_s$
    and $\boldsymbol{\tau}^{\mathrm{turb}}_s$ are viscous and modeled turbulent stress
    tensors in kg.m^-1.s^-2. The first $\hat{\phi}$ selects the transported toroidal
    momentum component and the second specifies the positive toroidal flux direction.
    A radial flux of toroidal momentum would instead use the $\hat{R}$ surface-normal
    projection, and is conceptually distinct from convective quantities such as toroidal_momentum_convection_velocity.


    In practice this quantity is computed from edge-plasma momentum balance models
    by summing species moments, pressure terms, collisional stresses, and closure-dependent
    turbulent stresses. It may be constrained indirectly by measurements of density,
    temperature, impurity content, neutral populations, and flow velocities, but it
    is rarely measured as a single direct diagnostic observable. It should not be
    confused with [toroidal_neutral_momentum](name:toroidal_neutral_momentum), which
    describes toroidal momentum carried by neutrals, or with torque/source terms such
    as [toroidal_neutral_torque_density](name:toroidal_neutral_torque_density).


    Order-of-magnitude values follow pressure and dynamic-pressure scales. In scrape-off-layer
    and divertor conditions, absolute magnitudes commonly span about $10^{-3}$-$10^{2}$
    kg.m^-1.s^-2, while pedestal or high-density edge regions can reach $10^{2}$-$10^{4}$
    kg.m^-1.s^-2. The exact value is strongly dependent on species composition, flow
    speed, temperature, collisionality, and the turbulent-stress closure used.


    Sign convention: Positive when $+\hat{\phi}$ toroidal momentum is transported
    across a surface of constant $\phi$ along the $+\hat{\phi}$ normal, toward increasing
    toroidal angle $\phi$, in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neutral_momentum
  - name:toroidal_neutral_torque_density
- name: toroidal_total_plasma_momentum_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Surface integral of the toroidal component of plasma linear momentum\
    \ at the last closed flux surface in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame, summed over all ion species and electrons. It is a signed total linear\
    \ momentum, not toroidal angular momentum."
  documentation: 'The total toroidal plasma momentum at the plasma boundary is the
    toroidal component of plasma linear momentum assigned to the separatrix or last
    closed flux surface, summed over all ion species and electrons. The toroidal component
    is taken along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    This is not toroidal angular momentum; no factor of $R$ multiplies the toroidal
    velocity.


    For a surface-integrated boundary value, the defining linear-momentum form is


    $$

    P_{\phi,b} = \int_{S_b} \sum_s \Sigma_s(\mathbf{x})\,u_{\phi,s}(\mathbf{x})\,dA

    $$


    where $S_b$ is the boundary flux surface, $dA$ is the area element on $S_b$ in
    m^2, $s$ labels plasma species, $\Sigma_s$ is the species mass per unit boundary-surface
    area in kg m^-2, and $u_{\phi,s}$ is the toroidal component of species flow velocity
    in m s^-1. If the value is derived from volume fields, $\Sigma_s$ represents the
    mass density $m_s n_s$ integrated through the boundary shell normal to $S_b$,
    with $m_s$ in kg and $n_s$ in m^-3.


    In analysis, this quantity is computed from edge species densities, composition,
    toroidal flow velocities, and the geometry of the boundary flux surface. It is
    the boundary counterpart of the radial quantity [toroidal_total_plasma_momentum](name:toroidal_total_plasma_momentum),
    while toroidal_flux_surface_average_total_plasma_momentum_at_plasma_boundary gives
    the corresponding flux-surface average rather than the surface-integrated total.
    Rotation measurements such as charge-exchange or Doppler spectroscopy are typically
    combined with density and impurity-content estimates to infer the ion contribution;
    the electron contribution is usually much smaller because of the electron mass.


    Typical absolute values for separatrix-associated boundary integrals are often
    about 10^-6-10^-2 kg.m.s^-1 in medium-size tokamak edge analyzes, but the value
    can be near zero for balanced rotation and can be larger in strongly torque-driven
    or larger plasmas. The magnitude scales with edge density, ion mass, toroidal
    flow speed, boundary surface area, and the thickness or surface measure used to
    assign mass to the boundary surface.


    Sign convention: Positive when the net toroidal plasma linear momentum points
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum
- name: toroidal_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the tritium ion fluid velocity evaluated at the
    plasma boundary, the last closed flux surface separating the magnetically confined
    plasma from the open-field-line scrape-off layer.
  documentation: 'The toroidal tritium velocity at the plasma boundary gives the bulk
    rotational flow of tritium ions projected onto the toroidal direction $\hat{\phi}$,
    evaluated at the last closed flux surface where the confined plasma meets the
    scrape-off layer. This boundary value constrains the outer edge of the radial
    tritium rotation profile and reflects the balance between momentum injection,
    viscous transport across the pedestal, and ion-neutral friction at the plasma
    edge.


    The defining relation is the projection of the tritium ion fluid velocity vector
    $\mathbf{v}_T$ onto $\hat{\phi}$ at the last closed flux surface:


    $$

    v_{\phi,T}^{\rm b} = \mathbf{v}_T \cdot \hat{\phi}\Big|_{\rm LCFS}

    $$


    where $\hat{\phi}$ is the unit vector in the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the
    major radius and $Z$ the vertical height.


    The toroidal ion velocity at the boundary is measured by charge exchange recombination
    spectroscopy (CXRS), inferring the flow from Doppler shifts of charge-exchange
    emission lines in the steep-gradient edge region. For tritium-containing plasmas,
    measurements carry additional constraints due to the radioactive nature of the
    fuel species. Edge toroidal ion velocities in tokamak plasmas range from ~1 km/s
    in L-mode to ~100 km/s in strongly heated H-mode discharges. Comparing this quantity
    with [toroidal tritium velocity at the pedestal] and [toroidal tritium velocity
    at the magnetic axis](name:toroidal_tritium_velocity_at_magnetic_axis) characterizes
    the full radial rotation profile; [toroidal helium-3 velocity at the plasma boundary](name:toroidal_helium_3_velocity_at_plasma_boundary)
    provides the analogous boundary quantity for the helium-3 species.


    Sign convention: Positive when tritium ions flow in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from the $+\hat{Z}$ direction).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_tritium_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_plasma_boundary
- name: toroidal_tungsten_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of the flow velocity of tungsten impurity ions evaluated
    at the H-mode pedestal top.
  documentation: "The toroidal velocity of tungsten impurity ions at the pedestal\
    \ top characterizes the $\\hat{\\phi}$-direction rotation of this high-Z impurity\
    \ species at the steep-gradient edge transport barrier. Tungsten enters the confined\
    \ plasma primarily through erosion of plasma-facing components in metal-wall devices,\
    \ and its toroidal rotation at the pedestal reflects neoclassical impurity transport,\
    \ ion\u2013impurity friction, and externally applied toroidal momentum.\n\nThe\
    \ radial force balance for the tungsten ion population links the toroidal velocity\
    \ to the local radial electric field $E_r$:\n\n$$\nE_r = \\frac{1}{Z_W e n_W}\
    \ \\frac{\\partial p_W}{\\partial r} + v_{\\phi,W} B_\\theta - v_{\\theta,W} B_\\\
    phi\n$$\n\nwhere $Z_W$ is the mean tungsten charge state, $e$ is the elementary\
    \ charge, $n_W$ is the tungsten number density (see [tungsten density at the pedestal](name:tungsten_density_at_pedestal)),\
    \ $p_W$ is the tungsten pressure, $B_\\theta$ and $B_\\phi$ are the poloidal and\
    \ toroidal magnetic field components, and $v_{\\theta,W}$ is the poloidal tungsten\
    \ velocity.\n\nThis quantity is measured by charge exchange recombination spectroscopy\
    \ (CXRS) from Doppler shifts of tungsten emission lines localized to the pedestal\
    \ region. Toroidal impurity rotation at the pedestal in H-mode plasmas reaches\
    \ magnitudes of order $10^3$\u2013$10^4$ m/s, with sign and magnitude determined\
    \ by the momentum input scenario. The same species velocity at other radial locations\
    \ is given by [toroidal tungsten velocity at the magnetic axis](name:toroidal_tungsten_velocity_at_magnetic_axis)\
    \ and [at the plasma boundary](name:toroidal_tungsten_velocity_at_plasma_boundary);\
    \ the analogous quantity for xenon is [toroidal xenon velocity at the pedestal](name:toroidal_xenon_velocity_at_pedestal).\n\
    \nSign convention: Positive when the tungsten ion flow is directed in the direction\
    \ of increasing toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:tungsten_density_at_pedestal
  - name:toroidal_tungsten_velocity_at_magnetic_axis
  - name:toroidal_tungsten_velocity_at_plasma_boundary
  - name:toroidal_xenon_velocity_at_pedestal
- name: toroidal_tungsten_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the tungsten impurity ion fluid velocity in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, evaluated at the last closed\
    \ flux surface separating confined plasma from the scrape-off layer."
  documentation: 'Toroidal tungsten velocity at the plasma boundary is the component
    of the tungsten impurity ion fluid velocity along the toroidal direction at the
    last closed flux surface, the surface separating confined plasma from the scrape-off
    layer. The component is defined in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    The defining projection is:


    $$

    v_{\phi,W}^{\mathrm{LCFS}} = \left.\mathbf{v}_W \cdot \hat{\phi}\right|_{\mathrm{LCFS}}

    $$


    where $\mathbf{v}_W$ is the tungsten ion fluid velocity, $\hat{\phi}$ is the unit
    vector in the direction of increasing toroidal angle, and LCFS denotes the last
    closed flux surface.


    Experimentally, this velocity is commonly inferred from Doppler shifts of tungsten
    spectral lines using edge spectroscopy or charge-exchange recombination spectroscopy
    when suitable tungsten emission is available. In modeling and equilibrium-coupled
    transport analysis, it is obtained by projecting the impurity fluid velocity onto
    $\hat{\phi}$ or by solving an impurity momentum balance including electric-field
    forces, pressure-gradient effects, collisional friction with the main ions, and
    momentum sources.


    Typical tokamak edge values are about $10^3-5 \times 10^4$ m.s^-1, with the sign
    and magnitude depending on bulk plasma rotation, radial electric field, collisionality,
    charge-state distribution, and pedestal conditions. This pointwise boundary quantity
    is distinguished from the flux-surface average [toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary),
    and it uses the same toroidal-component convention as related species velocities
    such as [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary),
    [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary),
    and [toroidal_electron_velocity](name:toroidal_electron_velocity).


    Sign convention: Positive when the tungsten ion fluid velocity points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:tungsten_density_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  - name:toroidal_tungsten_velocity_at_pedestal
- name: toroidal_xenon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Toroidal component of the xenon ion bulk flow velocity at the H-mode\
    \ pedestal-top reference location, resolved along increasing toroidal angle \u03C6\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal xenon velocity at the pedestal is the toroidal component
    of the xenon ion bulk fluid velocity in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise when
    viewed from the $+\hat{Z}$ side, and $Z$ is vertical height. The evaluation location
    is the H-mode pedestal-top reference flux surface, the core-side edge of the steep-gradient
    pedestal region inside the separatrix. The radial label for this reference location
    is typically a dimensionless normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$
    or normalized poloidal flux $\psi_N$, distinguishing it from the pedestal foot
    and the separatrix.


    The projection defining the toroidal component is


    $$

    v_\phi^{\mathrm{Xe}} = \mathbf{v}_{\mathrm{Xe}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{Xe}}$ is the xenon ion bulk velocity vector in m.s^-1,
    $v_\phi^{\mathrm{Xe}}$ is the resulting scalar component in m.s^-1, and $\hat{\phi}$
    is the dimensionless unit vector along increasing $\phi$.


    In practice, this quantity is obtained on the pedestal-top flux surface from spectroscopic
    velocity measurements when identifiable xenon lines and suitable viewing geometry
    are available, or from impurity momentum-balance calculations constrained by measured
    profiles. Charge-exchange or passive Doppler spectroscopy measures line-of-sight
    velocities; geometric projection and mapping to the pedestal-top flux-surface
    label separate the toroidal component.


    The same toroidal projection applies at other radial reference locations, such
    as [toroidal_xenon_velocity_at_magnetic_axis](name:toroidal_xenon_velocity_at_magnetic_axis)
    and [toroidal_xenon_velocity_at_plasma_boundary](name:toroidal_xenon_velocity_at_plasma_boundary).
    Pedestal comparisons with [toroidal_nitrogen_velocity_at_pedestal](name:toroidal_nitrogen_velocity_at_pedestal),
    [toroidal_neon_velocity_at_pedestal](name:toroidal_neon_velocity_at_pedestal),
    and [toroidal_krypton_velocity_at_pedestal](name:toroidal_krypton_velocity_at_pedestal)
    help distinguish species-dependent impurity rotation from common edge momentum
    flow.


    Typical pedestal impurity toroidal velocities are strongly scenario-dependent.
    Values near 0 m.s^-1 can occur in weakly rotating or braked plasmas, while rotating
    H-mode edge plasmas often have magnitudes of order 10^3-10^4 m.s^-1; stronger
    external momentum input can produce larger magnitudes. These values are order-of-magnitude
    context rather than a xenon-specific limit.


    Sign convention: Positive when the xenon ion bulk flow component points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_xenon_velocity_at_magnetic_axis
  - name:toroidal_xenon_velocity_at_plasma_boundary
  - name:toroidal_krypton_velocity_at_pedestal
  - name:toroidal_neon_velocity_at_pedestal
- name: toroidal_xenon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the xenon ion bulk flow velocity at the plasma
    boundary, the last closed flux surface separating the confined plasma from the
    open-field-line scrape-off layer.
  documentation: 'The toroidal xenon velocity at the plasma boundary is the $\hat{\phi}$-component
    of the xenon impurity ion fluid velocity, evaluated as a flux-surface average
    on the last closed flux surface (separatrix). It quantifies the net toroidal rotation
    of the xenon ion population at the transition between the closed-field-line confined
    region and the open-field-line scrape-off layer.


    The toroidal velocity component is defined as:


    $$

    v_\phi^{\rm Xe} = \mathbf{v}_{\rm Xe} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\rm Xe}$ is the xenon ion fluid velocity and $\hat{\phi}$ is
    the unit vector in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    Xenon impurity ion velocities at the plasma boundary are typically inferred from
    the Doppler shift of charge exchange recombination spectroscopy lines, or from
    passive spectroscopy of xenon ion emission at the plasma edge. Xenon is a heavy
    noble-gas impurity with atomic number $Z = 54$, used for radiative plasma cooling
    and seeding; its large mass and high charge states make the toroidal velocity
    measurement sensitive to local momentum balance and neoclassical transport at
    the separatrix. Analogous boundary toroidal velocities for other impurity species
    include [toroidal krypton velocity](name:toroidal_krypton_velocity_at_plasma_boundary),
    [toroidal neon velocity](name:toroidal_neon_velocity_at_plasma_boundary), and
    [toroidal carbon velocity](name:toroidal_carbon_velocity_at_plasma_boundary).


    Sign convention: Positive when xenon ions flow in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_krypton_velocity_at_plasma_boundary
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_plasma_boundary
- name: total_ion_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding length of the total ion number density in the scrape-off
    layer, defined as the inverse magnitude of its logarithmic gradient evaluated
    perpendicular to flux surfaces. The total ion density is the sum over all ion
    species and charge states, so this scale length is intrinsically non-negative.
  documentation: 'Total ion decay length over the scrape-off layer is the characteristic
    distance over which the total ion number density falls by a factor of $e$ moving
    outward across the open-field-line region beyond the last closed flux surface.
    The total ion number density is the sum of densities over all ion species and
    charge states, so this quantity describes how rapidly the combined ion population
    connected to open magnetic field lines decays toward the wall.


    The decay length is defined as the inverse magnitude of the logarithmic gradient
    of the total ion density along the local outward distance perpendicular to flux
    surfaces:


    $$

    \lambda_{n_i,\mathrm{tot}} = \left| \frac{d}{d r_\perp} \ln n_{i,\mathrm{tot}}
    \right|^{-1}

    $$


    where $r_\perp$ is the local distance measured perpendicular to the flux surfaces,
    increasing outward from the last closed flux surface toward the wall (in meters),
    and $n_{i,\mathrm{tot}}$ is the total ion number density (in $\mathrm{m^{-3}}$).
    The total ion density is $n_{i,\mathrm{tot}} = \sum_a \sum_Z n_{a,Z}$, where $n_{a,Z}$
    is the density of ion species $a$ in charge state $Z$. Taking the magnitude makes
    the scale length non-negative regardless of the chosen sign of the radial coordinate.


    In practice this quantity is obtained by reconstructing the total ion density
    across the scrape-off layer from charge-resolved ion measurements, edge plasma
    modeling, or quasineutrality and composition assumptions, then evaluating the
    local logarithmic gradient or fitting an exponential fall-off over a specified
    radial interval. A fitted value represents an effective decay length over that
    interval rather than a strictly local derivative.


    Representative scrape-off-layer ion density decay lengths in tokamak edge analyzes
    are commonly of order $0.001\text{--}0.05\ \mathrm{m}$, with the value depending
    on plasma current, connection length, collisionality, recycling, detachment state,
    and the radial interval used for evaluation.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:ion_heat_decay_length_over_scrape_off_layer
- name: total_ion_density_at_pedestal
  kind: scalar
  status: draft
  description: Total ion number density summed over all ion species and charge states,
    evaluated at the H-mode pedestal top.
  documentation: 'The total ion density at the pedestal is the combined number density
    of all ion species and charge states in the H-mode edge transport barrier, the
    steep-gradient region where pressure, temperature, and density rise sharply inward
    from the scrape-off layer toward the confined core.


    The quantity is defined as:


    $$

    n_{i,\text{tot}} = \sum_{s} n_s

    $$


    where $n_s$ is the number density of ion species $s$, summed over all its charge
    states, in m$^{-3}$. In a pure deuterium plasma this reduces to the electron density;
    in impurity-seeded discharges, $n_{i,\text{tot}}$ differs from $n_e$ according
    to the quasineutrality relation $n_e = \sum_s Z_s n_s$, where $Z_s$ is the charge
    number of species $s$.


    The pedestal ion density is inferred from charge-exchange recombination spectroscopy,
    Thomson scattering, or reflectometry, frequently combined with the quasineutrality
    constraint to partition contributions among individual species. It is a key parameter
    governing pedestal stability and ELM onset.


    Typical values in H-mode discharges range from $1 \times 10^{19}$ to $2 \times
    10^{20}$ m$^{-3}$, depending on machine size, fueling rate, and impurity content.
    Species-resolved contributions are captured by [deuterium_density_at_pedestal](name:deuterium_density_at_pedestal)
    and [carbon_density_at_pedestal](name:carbon_density_at_pedestal), while the radial
    context is provided by [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary)
    and [total_ion_density_at_magnetic_axis](name:total_ion_density_at_magnetic_axis).


    Sign convention: Positive when the total ion number density corresponds to a physically
    present, net positive ion population per unit volume.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_pedestal
  - name:carbon_density_at_pedestal
  - name:total_ion_density_at_plasma_boundary
  - name:total_ion_density_at_magnetic_axis
- name: total_ion_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Unweighted sum of number densities of all charged ion species evaluated
    locally at the plasma boundary or last closed flux surface. Neutral particles
    are excluded, and each ion population contributes by particle density rather than
    by charge.
  documentation: 'Total ion density at the plasma boundary is the local particle density
    obtained by summing the number densities of all charged ion species at the last
    closed flux surface. The sum is unweighted: each ion contributes one particle
    to the total regardless of charge state, while neutral atoms and molecules are
    excluded. This is a local boundary quantity, not a flux-surface average unless
    averaging is stated explicitly.


    The total ion density at the plasma boundary is defined by the species sum


    $$

    n_{i,\mathrm{tot},b} = \sum_s n_{i,s,b}

    $$


    where $n_{i,\mathrm{tot},b}$ is the total ion density at the boundary in $\mathrm{m}^{-3}$,
    $n_{i,s,b}$ is the number density of charged ion species $s$ at the boundary in
    $\mathrm{m}^{-3}$, and the sum runs over all charged ion species or charge-state-resolved
    ion populations included in the plasma composition.


    In practice this quantity is obtained from edge diagnostic interpretation or from
    boundary values in transport and equilibrium-coupled edge modeling. Electron density
    and quasi-neutrality can constrain the charge-weighted ion sum, but they do not
    by themselves define this unweighted total unless the ion composition and charge
    states are also known.


    Typical values at the last closed flux surface in tokamak plasmas are about $1
    \times 10^{18}-1 \times 10^{20}\ \mathrm{m}^{-3}$, depending on fueling, confinement
    regime, plasma current, and edge transport conditions.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_density_at_pedestal
  - name:total_ion_density_at_limiter
- name: tritium_density_at_pedestal
  kind: scalar
  status: draft
  description: Tritium ion number density evaluated at the H-mode pedestal top.
  documentation: 'Tritium density at the pedestal is the local number density of ionized
    tritium at the H-mode pedestal top. The pedestal top is the radial location where
    the steep-gradient edge transport barrier transitions to the flatter core density
    distribution, so this value characterizes the tritium content just inside the
    barrier.


    The local number-density definition evaluated at that location is:


    $$

    n_{T,\mathrm{ped}} = \left.\frac{dN_T}{dV}\right|_{\mathrm{ped}}

    $$


    where $dN_T$ is the number of tritium ions in the infinitesimal volume $dV$, $dV$
    is measured in $\mathrm{m}^3$, and the subscript $\mathrm{ped}$ means that the
    limit is taken at the pedestal-top location.


    In practice, this value is obtained by identifying the pedestal top from the edge
    density or pressure structure and evaluating the tritium ion density there. If
    the tritium component is not resolved independently, it may be inferred from the
    total ion density together with the local isotopic fraction, so $n_{T,\mathrm{ped}}$
    reflects both the pedestal density and the fuel mix.


    Typical values are zero in plasmas without tritium fueling or with negligible
    tritium inventory. In deuterium-tritium H-mode operation, representative pedestal-top
    tritium densities are about $10^{18}-5 \times 10^{19}\ \mathrm{m}^{-3}$, depending
    on total pedestal density, dilution by impurities and other fuel ions, and the
    tritium fraction.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:tritium_density_at_plasma_boundary
  - name:tritium_density_at_magnetic_axis
  - name:tritium_density_at_divertor_target
  - name:tritium_density_at_limiter
  - name:density_at_pedestal
  arguments:
  - name: density_at_pedestal
    operator: tritium
    operator_kind: qualifier
- name: tritium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of tritium ions at the plasma boundary (separatrix),
    the last closed magnetic flux surface separating the confined plasma from the
    scrape-off layer.
  documentation: 'Tritium density at the plasma boundary is the local number density
    of tritium ions evaluated on the separatrix. It characterizes the tritium component
    of the ion population at the outer edge of the closed-field-line plasma and is
    non-negative by definition.


    Using the normalized poloidal flux coordinate $\psi_N$, with $\psi_N=0$ at the
    magnetic axis and $\psi_N=1$ at the separatrix, the boundary value is


    $$

    n_{\mathrm{T},b} = n_{\mathrm{T}}(\psi_N=1)

    $$


    where $n_{\mathrm{T},b}$ is the tritium ion density at the plasma boundary in
    m^-3 and $n_{\mathrm{T}}$ is the tritium ion density as a function of $\psi_N$,
    also in m^-3.


    In practice this quantity is obtained by identifying the separatrix from magnetic-equilibrium
    reconstruction and evaluating or extrapolating the tritium ion density to that
    surface. The isotope-resolved value is commonly constrained from the total edge
    density together with an assumed, modeled, or independently inferred tritium fraction,
    rather than from the separatrix location alone.


    Typical values range from 0 m^-3 in plasmas without tritium to about 10^18-10^20
    m^-3 in deuterium-tritium edge plasmas, depending on the total separatrix density
    and isotope mix. Values below zero are unphysical for a number density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_plasma_boundary
  - name:tritium_density_at_pedestal
  - name:tritium_density_at_divertor_target
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: tritium
    operator_kind: qualifier
- name: flux_surface_averaged_tritium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of tritium ions at the plasma
    boundary (separatrix).
  documentation: 'Flux-surface-averaged tritium density at the plasma boundary is
    the average tritium ion number density over the last closed flux surface, also
    called the separatrix. It represents a single scalar boundary value after averaging
    local variations around that magnetic surface. The density counts ionized tritium
    nuclei, summed over tritium ion charge states if such states are distinguished,
    and excludes neutral tritium atoms and tritium-bearing molecules such as $T_2$
    and DT.


    The flux-surface average at the boundary poloidal-flux surface is defined by the
    weighted surface integral:


    $$

    \langle n_T \rangle_{\psi_b} = \frac{\oint_{\psi=\psi_b} n_T \, dS / |\nabla \psi|}{\oint_{\psi=\psi_b}
    dS / |\nabla \psi|}

    $$


    where $n_T$ is the local tritium ion number density in m^-3, $\psi$ is the poloidal
    magnetic flux in Wb, $\psi_b$ is the value of $\psi$ at the plasma boundary, $dS$
    is a surface-area element in m^2, and $|\nabla\psi|$ has units Wb m^-1. The factor
    $1/|\nabla\psi|$ is the geometric weighting associated with integration over a
    magnetic flux surface in toroidal geometry.


    In practice, this quantity is computed by mapping local or modeled tritium ion
    density values onto a reconstructed boundary flux surface and carrying out the
    flux-surface average. Tritium ion density may be constrained by isotope-resolved
    edge spectroscopy, neutral-particle measurements, fueling and recycling balance,
    and quasi-neutrality together with ion-composition modeling. The resulting boundary
    value is commonly used as an edge condition for fuel-ion transport, isotope balance,
    and scrape-off-layer coupling calculations.


    Typical values are 0 m^-3 in plasmas without tritium fueling. In deuterium-tritium
    edge plasmas, representative separatrix values are about $1 \times 10^{18}$-$1
    \times 10^{20}$ m^-3, depending on isotope fraction, fueling, recycling, confinement
    regime, and the total separatrix density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:tritium_density_at_plasma_boundary
  - name:flux_surface_averaged_boron_density
  - name:flux_surface_averaged_total_ion_density
  arguments:
  - name: tritium_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/tritium/value
    dd_path: summary/local/separatrix_average/n_i/tritium/value
    status: composed
- name: tungsten_density_at_pedestal
  kind: scalar
  status: draft
  description: Flux-surface-averaged tungsten ion number density at the H-mode pedestal
    top, summed over all ionization stages W1+ through W74+ and excluding neutral
    tungsten atoms.
  documentation: 'Tungsten density at the pedestal is the total number density of
    ionized tungsten on the flux surface identified with the top of the H-mode pedestal.
    The pedestal top is the inner edge of the steep edge pressure-gradient region,
    where pedestal profiles connect to the core plasma. Neutral tungsten atoms are
    not included.


    The charge-state-summed pedestal density is defined by summing all positive tungsten
    ionization stages:


    $$

    n_{\mathrm{W,ped}} = \sum_{q=1}^{74} \left\langle n_{\mathrm{W}^{q+}} \right\rangle_{\rho_{\mathrm{tor,norm}}=\rho_{\mathrm{ped}}}

    $$


    where $n_{\mathrm{W}^{q+}}$ is the number density of tungsten ions with charge
    $q$, 74 is the atomic number of tungsten, $\langle \cdot \rangle$ denotes a flux-surface
    average, $\rho_{\mathrm{tor,norm}}$ is the flux coordinate normalized toroidal
    flux radius, and $\rho_{\mathrm{ped}}$ labels the pedestal-top flux surface.


    In practice this quantity is obtained by evaluating an impurity-density reconstruction
    or radial impurity profile at the pedestal top. The pedestal location is commonly
    identified from electron pressure, density, or temperature gradients, while tungsten
    densities are constrained by visible, VUV, and soft-X-ray spectroscopy, bolometry
    or tomography, charge-exchange measurements where applicable, and collisional-radiative
    modeling of the charge-state distribution.


    Typical values in present H-mode tokamak plasmas are about $10^{13}-10^{16}$ m^-3
    in well-controlled conditions. Strong tungsten influx or poor impurity screening
    can raise pedestal values toward $10^{17}$ m^-3 or above; even small fractions
    relative to the electron density can produce substantial radiative losses because
    tungsten is a high-$Z$ impurity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:tungsten_density_at_magnetic_axis
  - name:tungsten_density_at_limiter
  - name:tungsten_density_at_divertor_target
  arguments:
  - name: density_at_pedestal
    operator: tungsten
    operator_kind: qualifier
- name: tungsten_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Separatrix-averaged number density of ionized tungsten at the plasma
    boundary, summed over charge states W1+ through W74+. Neutral tungsten atoms are
    excluded.
  documentation: 'Tungsten density at the plasma boundary is the charge-state-summed
    number density of tungsten ions on the last-closed flux surface or separatrix.
    It includes ionized tungsten charge states only, $W^{q+}$ with $q=1,\ldots,74$,
    and excludes neutral tungsten atoms $W^0$.


    A flux-surface average on the last-closed flux surface may be written as:


    $$

    n_{W,\mathrm{sep}} = \frac{\oint_{\mathrm{LCFS}} \left(\sum_{q=1}^{74} n_{W^{q+}}\right)
    B_p^{-1} \, dl}{\oint_{\mathrm{LCFS}} B_p^{-1} \, dl}

    $$


    where $n_{W^{q+}}$ is the number density of tungsten ions in charge state $q$
    in m^-3, $dl$ is the poloidal arc-length element in m along the last-closed flux
    surface, and $B_p$ is the poloidal magnetic-field magnitude in T. The $B_p^{-1}$
    weighting gives the usual magnetic-flux-surface average rather than a simple geometric
    contour average.


    This quantity is typically inferred from edge impurity modeling constrained by
    spectroscopy, bolometry, charge-exchange measurements where available, and equilibrium
    reconstruction of the separatrix geometry. It characterizes the tungsten ion content
    entering or residing at the confined-plasma boundary and is commonly compared
    with core, pedestal, divertor-target, and volume-averaged tungsten densities to
    assess impurity screening and transport.


    Typical values vary strongly with wall material, auxiliary heating, edge conditions,
    and impurity control. In tungsten-wall tokamaks, separatrix-averaged ionized tungsten
    densities are often in the range 10^10-10^15 m^-3, with transient events or poorly
    screened conditions producing larger excursions.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:tungsten_density_at_magnetic_axis
  - name:tungsten_density_at_divertor_target
  arguments:
  - name: density_at_plasma_boundary
    operator: tungsten
    operator_kind: qualifier
- name: volume_averaged_neutral_species_density
  kind: scalar
  status: draft
  description: Volume average of the number density of neutral particles over the
    plasma volume enclosed by the last closed flux surface.
  documentation: 'The volume-averaged neutral species density quantifies the mean
    number density of neutral atoms and molecules within the plasma volume bounded
    by the last closed flux surface (LCFS). Neutrals arise from edge recycling at
    plasma-facing walls, gas injection, and charge-exchange reactions, and their inventory
    affects ionization balance, fueling efficiency, and momentum exchange between
    the plasma and neutral background.


    The volume average is defined as:


    $$

    \langle n_0 \rangle = \frac{1}{V} \int_V n_0(\mathbf{r}) \, dV

    $$


    where $n_0(\mathbf{r})$ is the local neutral number density at position $\mathbf{r}$
    and $V$ is the volume enclosed by the LCFS.


    This global scalar condenses the spatially resolved neutral_species_density profile
    into a single quantity well suited for particle balance analysis and for monitoring
    the neutral inventory during plasma initiation and ramp-up. It is typically estimated
    from spectroscopic line emission or neutral pressure gage measurements combined
    with ionization balance modeling. As the neutral counterpart to [volume_averaged_total_ion_density](name:volume_averaged_total_ion_density),
    it contributes to total particle inventory alongside the ion and electron populations
    described by total_electron_ion_neutral_particle_number_density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:volume_averaged_total_ion_density
  sources:
  - id: dd:plasma_initiation/global_quantities/neutral/density_volume_average
    dd_path: plasma_initiation/global_quantities/neutral/density_volume_average
    status: composed
- name: vorticity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Signed field-parallel component of the curl of the diamagnetic drift
    velocity for a plasma species or effective fluid. It measures rotation of the
    pressure-gradient-driven cross-field drift and is distinct from radial, poloidal,
    and toroidal vorticity components.
  documentation: 'Vorticity due to diamagnetic drift is the signed field-parallel
    scalar component of the curl of the diamagnetic drift velocity. It represents
    local rotation of the pressure-gradient-driven cross-field drift about the magnetic-field
    direction for the species or effective fluid whose pressure gradient defines the
    drift. It is related to [parallel_vorticity](name:parallel_vorticity), [toroidal_vorticity](name:toroidal_vorticity),
    [poloidal_vorticity](name:poloidal_vorticity), and [radial_vorticity](name:radial_vorticity),
    but it identifies the diamagnetic-drift contribution rather than the total vorticity
    component.


    The field-parallel scalar is defined by projecting the curl of the diamagnetic
    drift velocity onto the local magnetic-field direction:


    $$

    \omega_{\mathrm{dia},s} = \hat{\mathbf{b}} \cdot \left(\nabla \times \mathbf{v}_{\mathrm{dia},s}\right)

    $$


    where $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$, $\mathbf{B}$ is the magnetic
    field, and $\mathbf{v}_{\mathrm{dia},s}$ is the diamagnetic drift velocity of
    species $s$. For a scalar-pressure fluid, $\mathbf{v}_{\mathrm{dia},s} = \mathbf{B}
    \times \nabla p_s /(q_s n_s |\mathbf{B}|^2)$, with $p_s$ the pressure, $n_s$ the
    number density, and $q_s$ the signed particle charge; electron and ion contributions
    therefore have opposite drift directions for the same pressure gradient.


    In practice this quantity is evaluated from pressure and density gradients together
    with the magnetic-field geometry, followed by spatial differentiation of the diamagnetic
    drift velocity and projection along $\hat{\mathbf{b}}$. It is sensitive to pressure-gradient
    length scale, magnetic-shear and curvature effects, and numerical smoothing because
    it contains derivatives of a drift velocity that is itself gradient-driven.


    Typical magnitudes in tokamak edge and scrape-off-layer plasmas are 10^4-10^6
    s^-1 in broad-gradient regions and 10^5-10^7 s^-1 in steep pedestal or filamentary
    structures. Values can pass through zero where the pressure gradient or its curvature
    is weak, and the sign may reverse across pressure-gradient extrema or when the
    magnetic-field direction is reversed.


    Sign convention: Positive when $\nabla \times \mathbf{v}_{\mathrm{dia},s}$ points
    along the local magnetic-field unit vector $\hat{\mathbf{b}}$.'
  unit: s^-1
  physics_domain: edge_plasma_physics
  links: []
- name: xenon_density_at_pedestal
  kind: scalar
  status: draft
  description: Xenon ion number density evaluated at the H-mode pedestal top, where
    the steep-gradient edge transport barrier meets the flatter core pressure profile.
  documentation: 'Xenon impurity ion number density at the pedestal top characterizes
    the local concentration of xenon at the shoulder of the H-mode edge transport
    barrier. As a heavy noble gas with atomic number $Z = 54$, xenon contributes substantially
    to the effective charge $Z_\mathrm{eff}$ and radiative power losses even at trace
    concentrations, making its pedestal value a key diagnostic of impurity accumulation,
    pedestal stability, and impurity transport modeling.


    The pedestal top is the radial location $\rho_\mathrm{ped}$ at which the steep-gradient
    barrier region joins the gentler core density profile. The xenon pedestal density
    $n_\mathrm{Xe,ped}$ is the value of the ion number density profile at that reference
    position:


    $$

    n_\mathrm{Xe,ped} = n_\mathrm{Xe}(\rho_\mathrm{ped})

    $$


    where $\rho_\mathrm{ped}$ is determined from the electron temperature or pressure
    profile pedestal fit, and $n_\mathrm{Xe}$ is the total xenon ion density summed
    over all ionization stages unless individual charge states are specified separately.


    Xenon is introduced into fusion plasmas for controlled radiative seeding to reduce
    divertor heat loads, for ELM suppression, and in disruption mitigation scenarios.
    Pedestal xenon density is typically inferred from charge-exchange recombination
    spectroscopy or soft X-ray emission spectroscopy, with the pedestal location identified
    from Thomson scattering or reflectometry profiles. This quantity is part of the
    [density_at_pedestal](name:density_at_pedestal) family; analogous pedestal densities
    for lighter noble gas seeding species include [neon_density_at_pedestal](name:neon_density_at_pedestal)
    and [argon_density_at_pedestal](name:argon_density_at_pedestal). For xenon density
    at other plasma reference locations see [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary)
    and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis).


    Sign convention: Positive when xenon ions are present at the pedestal top.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:neon_density_at_pedestal
  - name:argon_density_at_pedestal
  - name:xenon_density_at_plasma_boundary
  - name:xenon_density_at_magnetic_axis
  arguments:
  - name: density_at_pedestal
    operator: xenon
    operator_kind: qualifier
- name: xenon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of xenon ions at the plasma boundary (last closed flux
    surface), setting the outer boundary condition for xenon impurity transport between
    the confined plasma and the scrape-off layer.
  documentation: "Xenon ($Z = 54$) is a heavy noble-gas impurity that is either deliberately\
    \ seeded into the edge plasma for radiative power exhaust mitigation or present\
    \ as a trace contaminant. The xenon ion number density at the plasma boundary\
    \ is the local ion number density $n_{\\rm Xe}$ evaluated at the last closed flux\
    \ surface \u2014 the magnetic separatrix separating field-line-closed confinement\
    \ from the open-field-line scrape-off layer \u2014 constituting the outer boundary\
    \ condition for core impurity transport calculations. Unless a specific ionization\
    \ stage is resolved separately, it is summed over all charge states Xe$^{1+}$\
    \ through Xe$^{54+}$.\n\nThis boundary value connects the core inventory, quantified\
    \ by [volume_averaged_xenon_density](name:volume_averaged_xenon_density) and [line_averaged_xenon_density](name:line_averaged_xenon_density),\
    \ to scrape-off-layer impurity balance. The analogous on-axis value is [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis),\
    \ while xenon_fraction expresses the xenon ion content relative to electrons.\
    \ The boundary density is inferred from passive spectroscopy of high-charge-state\
    \ line emission near the separatrix or from two-dimensional edge transport modeling\
    \ benchmarked to spectroscopic line-ratios. The parent quantity [density_at_plasma_boundary](name:density_at_plasma_boundary)\
    \ defines the general species-agnostic framework.\n\nTypical separatrix xenon\
    \ densities in seeded tokamak discharges range from $10^{16}$ to $10^{18}$ m$^{-3}$,\
    \ depending on seeding rate and plasma conditions; trace-impurity backgrounds\
    \ may be two to three orders of magnitude lower.\n\nSign convention: Positive\
    \ when xenon ions are present at the last closed flux surface."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:volume_averaged_xenon_density
  - name:line_averaged_xenon_density
  - name:xenon_density_at_magnetic_axis
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: xenon
    operator_kind: qualifier
- name: bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude
  kind: scalar
  status: draft
  description: Scalar magnitude of the bulk plasma velocity component associated with
    diamagnetic drift. It represents the speed of the pressure-gradient-driven drift
    of the bulk fluid perpendicular to the magnetic field, independent of the drift
    direction.
  documentation: 'Bulk plasma velocity due to diamagnetic drift magnitude is the norm
    of the bulk-fluid velocity component associated with diamagnetic drift. Diamagnetic
    drift is a fluid drift caused by pressure gradients perpendicular to the magnetic
    field; for a bulk plasma quantity, the contributing species flows must be combined
    rather than treated as a single-species test-particle drift. The magnitude discards
    the orientation of the corresponding vector quantity bulk_plasma_velocity_due_to_diamagnetic_drift.


    In a multi-species fluid description, the mass-weighted bulk diamagnetic speed
    may be written as:


    $$

    v_{\mathrm{dia,bulk}} = \left|\frac{\sum_s m_s\,\mathbf{B}\times\nabla p_s /(q_s
    B^2)}{\sum_s m_s n_s}\right|

    $$


    where the sum is over species $s$, $m_s$ is species mass in kg, $q_s$ is species
    charge in C, $n_s$ is density in m$^{-3}$, $p_s$ is pressure in Pa, $\mathbf{B}$
    is the magnetic field in T, $B=|\mathbf{B}|$, and $v_{\mathrm{dia,bulk}}$ is in
    m.s$^{-1}$. This expression shows that ion and electron diamagnetic contributions
    have opposite charge dependence and that the bulk result depends on the chosen
    fluid averaging.


    In practice this quantity is computed from the diamagnetic component of a fluid
    momentum decomposition, or from pressure-gradient, density, species-composition,
    and magnetic-field information. It is usually inferred from reconstructed or modeled
    edge plasma states rather than measured directly as an isolated velocity component.


    Typical edge-plasma values are often 10$^2$-10$^4$ m.s$^{-1}$, with the largest
    values occurring where pressure gradients are steep and the magnetic field or
    density is relatively low. Weaker-gradient regions can have values below this
    range.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: bulk_plasma_velocity_due_to_diamagnetic_drift
    operator: magnitude
    operator_kind: unary_postfix
  sources:
  - id: dd:edge_transport/model/ggd/momentum/v/diamagnetic
    dd_path: edge_transport/model/ggd/momentum/v/diamagnetic
    status: composed
- name: coulomb_logarithm_at_pedestal_top
  kind: scalar
  status: draft
  description: Dimensionless Coulomb logarithm evaluated at the H-mode pressure pedestal
    top, characterizing Debye screening of binary Coulomb collisions in the pedestal
    plasma.
  documentation: 'The Coulomb logarithm at the pedestal top is the value of the plasma
    Coulomb logarithm evaluated at the radial location marking the top of the H-mode
    pressure pedestal. It measures the logarithmic separation between long-range Debye
    shielding and the shortest effective collision impact parameter, and is a key
    factor in collisional transport estimates near the edge transport barrier.


    The Coulomb logarithm is defined by the ratio of maximum to minimum effective
    impact parameters:


    $$

    \ln\Lambda = \ln\left(\frac{\lambda_D}{b_{\min}}\right)

    $$


    where $\lambda_D$ is the Debye length in meters and $b_{\min}$ is the minimum
    effective impact parameter in meters, usually taken as the larger of the classical
    distance of closest approach and the quantum de Broglie wavelength for the relevant
    colliding species.


    In practice this quantity is computed from local pedestal-top plasma conditions,
    primarily electron temperature and electron density, after identifying the pedestal
    top from fitted edge pressure or kinetic profiles. It is used as an input to collision
    frequencies, resistivity estimates, neoclassical transport coefficients, and derived
    quantities such as [normalized_electron_collisionality_at_pedestal_top](name:normalized_electron_collisionality_at_pedestal_top).


    Typical pedestal-top values in tokamak H-mode plasmas are about 15-20 for electron
    temperatures of roughly 200-1000 eV and electron densities of about $10^{19}$-$10^{20}$
    m^-3, with weak logarithmic dependence on the local plasma parameters.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:coulomb_logarithm
  arguments:
  - name: coulomb_logarithm
    operator: pedestal_top
    operator_kind: locus
- name: diamagnetic_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Heat-viscosity diamagnetic current density is the signed scalar projection
    of the electric current density driven by heat-viscous stress onto the local direction
    perpendicular to both the magnetic field and the poloidal-flux gradient.
  documentation: 'Heat-viscosity diamagnetic current density is the diamagnetic component
    of the electric current density produced by heat-viscous stress in a magnetized
    edge plasma. It is the signed coefficient of the heat-viscosity current vector
    along the local direction perpendicular to both the magnetic field and the poloidal-flux
    gradient.


    The scalar projection is


    $$

    j_{\mathrm{dia,hv}} = \mathbf{j}_{\mathrm{hv}} \cdot \hat{\mathbf e}_{\mathrm{dia}}

    $$


    where $j_{\mathrm{dia,hv}}$ is this scalar component in A m^-2, $\mathbf{j}_{\mathrm{hv}}$
    is the heat-viscosity electric-current-density vector in A m^-2, and $\hat{\mathbf
    e}_{\mathrm{dia}}$ is the dimensionless positive local diamagnetic unit direction
    satisfying $\hat{\mathbf e}_{\mathrm{dia}}\cdot\mathbf B=0$ and $\hat{\mathbf
    e}_{\mathrm{dia}}\cdot\nabla\psi=0$. Here $\mathbf B$ is magnetic flux density
    in T, $\psi$ is poloidal magnetic flux in Wb, and $\nabla\psi$ has units Wb m^-1.
    If $|\mathbf B|=0$ or the transverse direction defined by $\mathbf B$ and $\nabla\psi$
    is degenerate, the diamagnetic projection is not physically defined and should
    not be interpreted as a true zero.


    The vector $\mathbf{j}_{\mathrm{hv}}$ is generally obtained from edge transport
    modeling rather than direct measurement. In fluid closures, the divergence of
    the heat-viscous stress tensor $\boldsymbol{\Pi}_{\mathrm{hv}}$ contributes a
    force density to charged-particle momentum balance; schematically, this force-density
    contribution is balanced by the corresponding term in $\mathbf{j}_{\mathrm{hv}}\times\mathbf
    B$ together with electric-field, pressure-gradient, inertia, and collisional terms.
    After the vector current contribution is computed, this quantity is formed by
    projection onto $\hat{\mathbf e}_{\mathrm{dia}}$.


    Other projections of the same heat-viscosity electric-current contribution include
    [parallel_current_density_due_to_heat_viscosity](name:parallel_current_density_due_to_heat_viscosity),
    [radial_current_density_due_to_heat_viscosity](name:radial_current_density_due_to_heat_viscosity),
    [poloidal_current_density_due_to_heat_viscosity](name:poloidal_current_density_due_to_heat_viscosity),
    [toroidal_current_density_due_to_heat_viscosity](name:toroidal_current_density_due_to_heat_viscosity),
    and vertical_current_density_due_to_heat_viscosity. The same diamagnetic projection
    geometry is used for [diamagnetic_current_density_due_to_perpendicular_viscosity](name:diamagnetic_current_density_due_to_perpendicular_viscosity).
    The related [parallel_heat_current_density_due_to_viscosity](name:parallel_current_density_due_to_heat_viscosity)
    concerns heat-current transport associated with viscosity rather than electric-current
    density.


    No device-independent numerical range is implied by this closure component. Its
    magnitude depends on the heat-viscous closure, collisionality, local gradients,
    magnetic geometry, and edge region, and it may vanish in models that omit heat-viscous
    current terms; it is usually interpreted by comparison with [current_density_due_to_heat_viscosity](name:current_density_due_to_heat_viscosity)
    or with neighboring perpendicular current components.


    Sign convention: Positive when $\mathbf{j}_{\mathrm{hv}}$ has a component in the
    positive local diamagnetic direction $\hat{\mathbf e}_{\mathrm{dia}}$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
