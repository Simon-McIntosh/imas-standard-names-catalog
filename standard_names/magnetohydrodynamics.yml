- name: neoclassical_tearing_mode_phase
  kind: scalar
  status: active
  description: Angular phase of a neoclassical tearing-mode magnetic island, specifying
    its helical orientation on the resonant flux surface at a given time.
  documentation: 'The phase $\varphi(t)$ is the angular offset that specifies the
    instantaneous helical orientation of a neoclassical tearing-mode magnetic island
    on its resonant flux surface.


    The associated island rotation frequency is the time derivative of the phase:


    $$

    \omega_{\rm NTM}(t)=\frac{d\varphi(t)}{dt}

    $$


    where $\omega_{\rm NTM}$ is the angular rotation frequency and $t$ is time. The
    phase $\varphi$ is defined modulo $2\pi$; its zero and increasing direction must
    remain consistent with the adopted helical mode representation.


    This quantity denotes the island phase, not the [rotation frequency of the neoclassical
    tearing mode](name:rotation_frequency_of_neoclassical_tearing_mode), its radial
    width, or the torque acting on it.'
  unit: rad
  physics_domain: magnetohydrodynamics
  links:
  - name:rotation_frequency_of_neoclassical_tearing_mode
  sources:
