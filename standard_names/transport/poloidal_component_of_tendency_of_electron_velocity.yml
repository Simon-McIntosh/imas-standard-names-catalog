name: poloidal_component_of_tendency_of_electron_velocity
description: Partial time derivative of the poloidal component of the bulk electron
  fluid velocity.
documentation: "This quantity is $\\partial v_{\\theta,e} / \\partial t$, where $v_{\\\
  theta,e}$ (m s$^{-1}$) is the poloidal projection of the electron fluid velocity\
  \ on a given flux surface. The poloidal electron velocity arises from the combination\
  \ of $\\mathbf{E} \\times \\mathbf{B}$ drift, diamagnetic drift $v_{\\text{dia},e}\
  \ = -\\nabla p_e \\times \\mathbf{B} / (n_e e B^2)$, and neoclassical corrections.\
  \ Its time derivative enters the electron momentum equation used by transport solvers\
  \ to evolve the flow profile self-consistently. In tokamak plasmas, $|v_{\\theta,e}|$\
  \ is typically of order $10^2$\u2013$10^4$ m s$^{-1}$, and its temporal evolution\
  \ is governed by viscous damping, momentum sources, and changes in the radial electric\
  \ field. During transient events such as L\u2013H transitions the poloidal velocity\
  \ can change rapidly, making this tendency term significant for time-dependent transport\
  \ simulations."
kind: vector_component
unit: m.s^-1
