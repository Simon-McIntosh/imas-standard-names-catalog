- name: nitrogen_source_rate
  kind: scalar
  status: active
  description: Instantaneous rate of neutral molecular nitrogen admitted to the plasma
    vessel, expressed as equivalent-electron particles with fourteen counts assigned
    to each molecule.
  documentation: 'This quantity is the equivalent-electron source rate carried by
    neutral molecular nitrogen admitted to the plasma vessel. It represents delivered
    molecular inventory, not free-electron production, ionization rate, or nitrogen
    ions retained in the plasma.


    $$

    \dot{N}_{\mathrm{eq}} = 14\,\dot{N}_{\mathrm{N_2}}

    $$


    where $\dot{N}_{\mathrm{eq}}$ is the equivalent-electron source rate and $\dot{N}_{\mathrm{N_2}}$
    is the injection rate of nitrogen molecules. The factor 14 assigns seven equivalent-electron
    counts to each of the two nitrogen atoms in a molecule.


    This species-resolved rate is consistent with the aggregate [source rate due to
    gas injection](name:source_rate_due_to_gas_injection). Integrating it over a time
    interval gives the corresponding accumulated nitrogen inventory represented by
    [accumulated nitrogen count](name:accumulated_nitrogen_count).'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_gas_injection
