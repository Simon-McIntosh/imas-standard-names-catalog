- name: vertical_coordinate_of_launching_position
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the physical point from which a heating beam\
    \ or wave is launched, in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical coordinate $Z$ of the launching position locates the\
    \ spatial origin of a beam or electromagnetic wave's propagation trajectory within\
    \ the tokamak vessel, in the right-handed cylindrical $(R, \\phi, Z)$ frame where\
    \ $Z$ is the height along the machine symmetry axis.\n\nFor electron cyclotron\
    \ heating systems, this coordinate specifies the height at which the EC beam exits\
    \ the launcher and enters the plasma. Together with the major-radius and toroidal-angle\
    \ components, it fully defines the three-dimensional launch-point geometry needed\
    \ for beam-tracing and current-drive modeling. The [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror)\
    \ determines the beam injection direction from this spatial origin, while [vertical_coordinate_of_beam_tracing_point](name:vertical_coordinate_of_beam_tracing_point)\
    \ gives $Z$ at discrete computed points along the propagating ray rather than\
    \ at its origin.\n\nThe launch height is set by the mechanical installation of\
    \ the launcher on the vacuum vessel and is determined by engineering survey. For\
    \ equatorial-port launchers, $Z$ is close to 0 m; upper-port or top-launch geometries\
    \ place the origin at $Z \\approx 0.5$\u2013$1.5$ m in medium-to-large tokamaks.\n\
    \nSign convention: Positive when the launching position lies above the geometric\
    \ midplane ($Z > 0$) in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:angle_of_electron_cyclotron_launcher_mirror
