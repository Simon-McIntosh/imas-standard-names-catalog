      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Xenon.
      kind: template
- name: xenon_prefill_count
  kind: scalar
  status: active
  description: Equivalent-electron count of xenon gas introduced during the plasma
    prefill phase before breakdown, with each xenon atom contributing 54 equivalent
    electrons equal to its atomic number.
  documentation: "Xenon prefill count is the total amount of xenon introduced before\
    \ plasma breakdown, expressed as an equivalent-electron count. Each neutral xenon\
    \ atom contributes 54 equivalent electrons equal to the atomic number of xenon,\
    \ $Z_{Xe} = 54$.\n\nThe equivalent-electron count is accumulated over the prefill\
    \ interval:\n\n$$\nN_{e,\\mathrm{eq}}^{Xe,\\mathrm{prefill}} = Z_{Xe} \\, N_{Xe,\\\
    mathrm{prefill}} = Z_{Xe} \\int_{t_0}^{t_\\mathrm{bd}} \\dot{N}_{Xe}(t)\\,dt\n\
    $$\n\nwhere $N_{e,\\mathrm{eq}}^{Xe,\\mathrm{prefill}}$ is the equivalent-electron\
    \ count, $N_{Xe,\\mathrm{prefill}}$ is the accumulated xenon atom count, $\\dot{N}_{Xe}$\
    \ is the xenon atom injection rate, $t_0$ is the start of the prefill interval,\
    \ and $t_\\mathrm{bd}$ is the plasma-breakdown time.\n\nThe gas-injection contribution\
    \ is tracked by [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count).\
    \ Xenon's atomic number of 54 places it at the upper end of the prefill-species\
    \ family \u2014 compare [krypton_prefill_count](name:krypton_prefill_count) ($Z\
    \ = 36$) and [neon_prefill_count](name:neon_prefill_count) ($Z = 10$) \u2014 and\
    \ all are reported on the same dimensionless equivalent-electron basis under [prefill_count](name:prefill_count)."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_xenon_prefill_count
  - name:krypton_prefill_count
  - name:neon_prefill_count
  - name:prefill_count
  arguments:
  - name: prefill_count
    operator: xenon
    operator_kind: qualifier
- name: accumulated_xenon_prefill_count
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of neutral xenon introduced
    during plasma prefill, ending at plasma breakdown, with 54 count units per atom.
  documentation: 'This quantity is the equivalent-electron inventory of neutral xenon
    gas introduced between the start of prefill and plasma breakdown. It represents
    the accumulated prefill contribution, not an instantaneous injection rate.


    The defining accumulation is


    $$

    N_{\mathrm{Xe,eq}}^{\mathrm{prefill}} = Z_{\mathrm{Xe}} \int_{t_0}^{t_{\mathrm{bd}}}
    \dot{N}_{\mathrm{Xe}}(t)\,dt

    $$


    where $\dot{N}_{\mathrm{Xe}}(t)$ is the neutral xenon atom injection rate, $t_0$
    and $t_{\mathrm{bd}}$ are the prefill start and breakdown times, and $Z_{\mathrm{Xe}}=54$
    is xenon''s atomic number. The resulting count assigns 54 equivalent-electron
    units to each xenon atom.


    This quantity is the prefill component of [xenon_prefill_count](name:xenon_prefill_count)
    and excludes xenon introduced after breakdown, which is represented by [accumulated_xenon_count](name:accumulated_xenon_count).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:xenon_prefill_count
  - name:accumulated_xenon_count
  arguments:
  - name: xenon_prefill_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_prefill/xenon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_prefill-xenon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_prefill/xenon
      parent: Xenon
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: active
    enhanced_context:
      description: Xenon.
      kind: template
- name: xenon_source_rate
  kind: scalar
  status: active
  description: Instantaneous injection rate of xenon gas into the plasma vessel, where
    each xenon atom is counted as Z = 54 equivalent electrons.
  documentation: 'The xenon source rate quantifies the instantaneous flux of xenon
    gas delivered to the plasma vessel by gas injection systems. Xenon (atomic number
    Z = 54) is a heavy noble gas used as a high-radiating impurity for plasma control,
    impurity seeding, and disruption mitigation in fusion devices.


    The equivalent-electron rate $\dot{N}_\mathrm{Xe}$ is obtained by weighting the
    instantaneous atom injection rate by xenon''s atomic number:


    $$

    \dot{N}_\mathrm{Xe} = 54 \cdot \dot{n}_\mathrm{Xe}

    $$


    where $\dot{n}_\mathrm{Xe}$ is the xenon atom flux in atoms s$^{-1}$ and 54 is
    the atomic number of xenon.


    The injection rate is inferred from valve conductance and upstream gas pressure
    measurements. Integrating over time yields the cumulative xenon inventory. The
    [krypton_source_rate_due_to_gas_injection](name:krypton_source_rate_due_to_gas_injection)
    follows the same equivalent-electron convention for the neighboring noble gas
    krypton, while [electron_source_rate_due_to_injection](name:electron_source_rate_due_to_injection)
    aggregates equivalent-electron contributions across all injected species.


    Sign convention: Positive when xenon gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:krypton_source_rate_due_to_gas_injection
  - name:electron_source_rate_due_to_injection
  sources:
  - dd_path: summary/gas_injection_rates/xenon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-xenon-value
    dd_documentation:
      leaf: Value
