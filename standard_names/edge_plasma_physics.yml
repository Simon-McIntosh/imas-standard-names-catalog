- name: vertical_ion_momentum_convection_velocity
  kind: scalar
  status: active
  description: Effective vertical convection velocity that advects a chosen component
    of ion momentum density for a specified ion species, represented as the density-weighted
    mean over all charge states. The vertical label names the velocity direction,
    not the transported momentum component.
  documentation: 'The vertical ion momentum convection velocity is the vertical effective
    velocity that advects a chosen component of ion momentum density for a specified
    ion species. The vertical direction is the $Z$ projection in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height; the vertical label names the velocity direction,
    not the transported momentum component. Because this is an intensive species-level
    quantity, it is the density-weighted mean over all charge states of that species.


    The vertical convective flux density of an ion-momentum component is represented
    by:


    $$

    \Gamma^{\mathrm{conv}}_{p_{i,a},Z} = p_{i,a}\,V_{i,\mathrm{mom,conv},Z}

    $$


    where $p_{i,a}=n_i m_i u_{i,a}$ is the ion momentum density associated with ion
    flow component $u_{i,a}$, $n_i$ is the ion density, $m_i$ is the ion mass, $a$
    labels the momentum component being transported, $V_{i,\mathrm{mom,conv},Z}$ is
    the vertical ion momentum convection velocity, and $\Gamma^{\mathrm{conv}}_{p_{i,a},Z}$
    is the corresponding vertical convective flux density of that momentum component.


    This quantity is the convective coefficient multiplying local ion momentum density;
    it excludes diffusive viscosity, residual stress, and explicit momentum sources.
    It is not generally identical to the bulk [vertical ion velocity](name:vertical_ion_velocity),
    because it characterizes transport of momentum density rather than the mean particle
    flow. The unprojected coefficient is [ion momentum convection velocity](name:ion_momentum_convection_velocity);
    other projections specify their own directions.


    Sign convention: Positive when the effective convection carries the selected ion
    momentum density toward increasing vertical height $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_ion_velocity
  - name:parallel_ion_momentum_convection_velocity
  - name:ion_momentum_convection_velocity
  arguments:
