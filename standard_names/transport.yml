- name: implicit_part_of_toroidal_component_of_ion_momentum_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the toroidal ion momentum source,
    defined by decomposing the total source as S = S_exp + S_imp * p_i_phi, where
    p_i_phi is the flux-surface-averaged toroidal momentum density of the ion species
    and S_imp is this quantity. Units are inverse seconds, consistent with a rate-like
    coefficient.
  documentation: "In a linearized transport formulation the toroidal ion momentum\
    \ source $S_\\phi$ (units: $\\mathrm{kg\\,m^{-1}\\,s^{-2}}$) is split into two\
    \ parts:\n\n$$S_\\phi = S_\\mathrm{exp} + S_\\mathrm{imp} \\cdot p_{i,\\phi}$$\n\
    \nwhere $p_{i,\\phi}$ is the flux-surface-averaged toroidal momentum density of\
    \ the ion species (units: $\\mathrm{kg\\,m^{-1}\\,s^{-1}}$), defined as $p_{i,\\\
    phi} = m_i n_i \\langle u_{i,\\phi} \\rangle$ with $m_i$ the ion mass, $n_i$ the\
    \ ion number density, and $\\langle u_{i,\\phi} \\rangle$ the flux-surface-averaged\
    \ toroidal velocity component in the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame (toroidal angle $\\phi$ increasing counter-clockwise viewed from above\
    \ $+\\hat{Z}$). This quantity is the implicit part $S_\\mathrm{imp}$ (units: $\\\
    mathrm{s^{-1}}$).\n\nPhysical meaning: $S_\\mathrm{imp}$ captures the component\
    \ of the momentum source that is proportional to the current toroidal momentum\
    \ density, analogous to a momentum damping or growth rate. Collisional friction,\
    \ neoclassical damping, and charge-exchange losses typically yield a negative\
    \ (damping) contribution to $S_\\mathrm{imp}$, while wave-particle interactions\
    \ may yield either sign.\n\nSign convention: Positive when the implicit source\
    \ acts to amplify toroidal momentum density, and negative when it acts as a sink\
    \ (i.e., damps the toroidal momentum).\n\nTypical magnitude: in reactor-relevant\
    \ plasmas, $|S_\\mathrm{imp}|$ is of order $10^{-3}$\u2013$10^{0}\\,\\mathrm{s^{-1}}$,\
    \ depending on the dominant momentum-exchange mechanism.\n\nThe companion explicit\
    \ part $S_\\mathrm{exp}$ carries the momentum source contribution that is independent\
    \ of the instantaneous toroidal momentum density."
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_ion_energy_source
  - name:implicit_part_of_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/ion/momentum/toroidal_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/ion/momentum/toroidal_decomposed/implicit_part
    status: composed
- name: implicit_part_of_total_ion_energy_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the total ion energy source, summed
    over all ion species, used in transport solver time-stepping to enhance numerical
    stability.
  documentation: 'In a 1D core transport solver, the total ion energy source $Q_\mathrm{tot}$
    is decomposed as $Q_\mathrm{tot} = Q_\mathrm{exp} + S_\mathrm{imp} \cdot T_i$,
    where $T_i$ is the total ion temperature, $Q_\mathrm{exp}$ is the explicit part
    evaluated at the current time step, and $S_\mathrm{imp}$ (this quantity, in s$^{-1}$)
    is the implicit linearized coefficient. This decomposition stabilizes stiff energy-source
    terms by treating the temperature-dependent component implicitly; a negative $S_\mathrm{imp}$
    represents a damping (sink) term that improves solver convergence for collisional
    energy-exchange processes. The quantity is the species-summed analog of [implicit
    part of single-ion-species energy source](name:implicit_part_of_ion_energy_source),
    and the energy-source analog of [implicit part of total ion particle source](name:implicit_part_of_total_ion_particle_source).
    Typical magnitudes range from $-10^3$ to $10^1$ s$^{-1}$ depending on the dominant
    heating and loss mechanisms. The explicit counterpart carries the remainder of
    the source that is evaluated without implicit coupling to the primary transport
    variable.


    Sign convention: Positive when the implicit term acts as a net energy source (amplifying
    with increasing ion temperature) and negative when it acts as a net energy sink.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_ion_energy_source
  - name:implicit_part_of_total_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_energy_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/total_ion_energy_decomposed/implicit_part
    status: composed
- name: implicit_part_of_total_ion_particle_source
  kind: scalar
  status: draft
  description: Implicit linearized coefficient of the total ion particle source, summed
    over all ion species, for use in the transport solver's implicit time-stepping
    scheme.
  documentation: 'In 1D core transport solvers, source terms are commonly split into
    explicit and implicit parts to improve numerical stability. For the total ion
    particle balance equation, the source $S_{\mathrm{tot}}^{\mathrm{ion}}$ is decomposed
    as $S_{\mathrm{tot}}^{\mathrm{ion}} = S_{\mathrm{expl}} + \gamma_{\mathrm{impl}}
    \cdot n_{\mathrm{tot}}^{\mathrm{ion}}$, where $n_{\mathrm{tot}}^{\mathrm{ion}}$
    is the total ion density (summed over all species) and $\gamma_{\mathrm{impl}}$
    (with units $\mathrm{s}^{-1}$) is this quantity. This coefficient captures the
    linearized response of the net particle source to changes in ion density, encompassing
    physical processes such as ionization, recombination, charge exchange, and pellet
    injection, aggregated across all ion species. The total-ion sum distinguishes
    this quantity from the per-species analog [implicit part of ion particle source](name:implicit_part_of_ion_particle_source);
    the analogous energy-channel coefficient is [implicit part of total ion energy
    source](name:implicit_part_of_total_ion_energy_source). The corresponding electron-channel
    coefficient is [implicit part of electron particle source](name:implicit_part_of_electron_particle_source).


    Sign convention: Positive when the implicit term represents a net gain of total
    ion particles (source-like contribution), increasing the total ion density in
    the transport equation.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:implicit_part_of_ion_particle_source
  - name:implicit_part_of_total_ion_energy_source
  - name:implicit_part_of_electron_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_particles_decomposed/implicit_part
    dd_path: core_sources/source/profiles_1d/total_ion_particles_decomposed/implicit_part
    status: composed
- name: ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for ion energy transport across flux surfaces,
    characterizing the anomalous or neoclassical spreading of ion thermal energy in
    the radial direction.
  documentation: "The ion energy diffusivity $\\chi_i$ enters the flux-surface-averaged\
    \ ion energy transport equation as $q_i = -n_i \\chi_i \\nabla T_i$, where $q_i$\
    \ is the ion heat flux density, $n_i$ is the ion number density, and $T_i$ is\
    \ the ion temperature. It encapsulates all radial transport mechanisms \u2014\
    \ neoclassical, turbulent, and anomalous \u2014 that drive ion thermal energy\
    \ outward across nested flux surfaces. In conventional tokamak H-mode plasmas,\
    \ $\\chi_i$ in the core typically ranges from $0.1$ to $5\\;\\mathrm{m^2\\,s^{-1}}$,\
    \ with larger values in L-mode or near the plasma edge. It is inferred from power-balance\
    \ analysis using measured temperature profiles and heat deposition from neutral-beam\
    \ injection or ion cyclotron resonance heating; gyrokinetic codes also predict\
    \ $\\chi_i$ from first principles. The analogous quantity for electrons is [electron_energy_diffusivity](name:electron_energy_diffusivity),\
    \ and for neutral particles [neutral_energy_diffusivity](name:neutral_energy_diffusivity);\
    \ the corresponding ion particle transport coefficient is [ion_particle_diffusivity](name:ion_particle_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:electron_energy_diffusivity
  - name:neutral_energy_diffusivity
  - name:ion_particle_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/energy/d
    dd_path: core_transport/model/profiles_1d/ion/energy/d
    status: composed
- name: ion_mean_square_charge_number
  kind: scalar
  status: draft
  description: Density-weighted mean square ion charge number <Z^2> for a single ion
    species, defined as the sum over charge states of each state's squared charge
    number weighted by its fractional number density. Dimensionless quantity that
    governs resistivity, radiation, and collision frequency scaling in multi-charge-state
    plasmas.
  documentation: "The mean square charge number $\\langle Z^2 \\rangle$ for an ion\
    \ species is defined as\n\n$$\\langle Z^2 \\rangle = \\frac{\\sum_k Z_k^2\\, n_k}{\\\
    sum_k n_k},$$\n\nwhere $Z_k$ is the integer charge number of charge state $k$\
    \ and $n_k$ is the number density of that charge state. The sum runs over all\
    \ charge states present for the species, and the denominator equals the total\
    \ ion number density $n_i$.\n\nThis moment is dimensionless. For a fully stripped\
    \ hydrogen-like ion ($Z = 1$) one obtains $\\langle Z^2 \\rangle = 1$. For a species\
    \ whose charge states span a broad range \u2014 for example, partially to fully\
    \ stripped tungsten ($Z$ up to 74) \u2014 $\\langle Z^2 \\rangle$ can reach values\
    \ up to $Z_\\mathrm{max}^2 = 74^2 = 5476$, where $Z_\\mathrm{max}$ is the maximum\
    \ charge number accessible to the species (i.e., the atomic number, equal to `ion_charge_number`\
    \ in the fully stripped limit). In practice, for coronal or non-equilibrium distributions,\
    \ $\\langle Z^2 \\rangle$ is substantially lower than this upper bound and is\
    \ typically of order $\\bar{Z}^2$ or a modest multiple thereof, where $\\bar{Z}\
    \ = \\langle Z \\rangle$ is the mean charge number.\n\nPhysically, $\\langle Z^2\
    \ \\rangle$ enters the ion\u2013ion and electron\u2013ion collision frequencies,\
    \ the Ohmic resistivity (through the effective charge $Z_\\mathrm{eff} = \\sum_i\
    \ n_i \\langle Z^2 \\rangle_i / n_e$), Bremsstrahlung and line-radiation scaling,\
    \ and the momentum friction between ion species and electrons. It is also a key\
    \ input to neoclassical and gyrokinetic transport models that treat multi-species\
    \ plasmas.\n\nThe quantity is closely related to `ion_mean_charge_number` ($\\\
    langle Z \\rangle$) and to the effective charge `effective_charge_number`; for\
    \ a pure single-charge-state species, $\\langle Z^2 \\rangle = \\langle Z \\rangle^2$,\
    \ while for a broad charge-state distribution $\\langle Z^2 \\rangle > \\langle\
    \ Z \\rangle^2$ by Jensen's inequality."
  unit: '1'
  physics_domain: transport
  links:
  - name:ion_mean_square_charge
  - name:ion_charge_number
  constraints: []
  sources:
  - id: dd:plasma_profiles/profiles_1d/ion/z_ion_square_1d
    dd_path: plasma_profiles/profiles_1d/ion/z_ion_square_1d
    status: composed
- name: ion_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity governing radial ion particle transport across
    flux surfaces, quantifying the Fickian spreading of the ion density profile due
    to anomalous and neoclassical mechanisms.
  documentation: "The ion particle diffusivity $D_i$ appears in the flux-surface-averaged\
    \ ion continuity equation as the diffusive contribution to the radial particle\
    \ flux: $\\Gamma_i = -D_i \\nabla n_i$, where $n_i$ is the ion density and $\\\
    nabla n_i$ is its radial gradient. It encapsulates the combined effect of neoclassical\
    \ diffusion (driven by Coulomb collisions in toroidal geometry) and anomalous\
    \ transport (driven by micro-instabilities such as ion temperature gradient and\
    \ trapped-electron modes). In neoclassical theory, $D_i$ is of order the ion banana-regime\
    \ diffusivity $D_\\mathrm{neo} \\sim \\rho_i^2 \\nu_{ii} / \\epsilon^{3/2}$, where\
    \ $\\rho_i$ is the ion gyroradius, $\\nu_{ii}$ is the ion\u2013ion collision frequency,\
    \ and $\\epsilon$ is the inverse aspect ratio; typical core values in tokamak\
    \ plasmas range from $0.01$ to $10\\;\\mathrm{m^2\\,s^{-1}}$, with anomalous transport\
    \ often dominating by one to two orders of magnitude. The quantity is inferred\
    \ from interpretive transport analysis using measured density profiles (from Thomson\
    \ scattering or charge-exchange recombination spectroscopy) combined with particle-balance\
    \ codes. It is the ion counterpart of [electron_particle_diffusivity](name:electron_particle_diffusivity)\
    \ and [neutral_particle_diffusivity](name:neutral_particle_diffusivity), and complements\
    \ [ion_energy_diffusivity](name:ion_energy_diffusivity) for the ion energy channel."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:electron_particle_diffusivity
  - name:neutral_particle_diffusivity
  - name:ion_energy_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/particles/d
    dd_path: core_transport/model/profiles_1d/ion/particles/d
    status: composed
- name: ion_particle_source_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume-integrated ion particle source rate enclosed within
    a given flux surface, representing the net particle addition rate from all source
    processes acting on a single ion species (or a specified ion state) inside that
    surface.
  documentation: 'The ion particle source inside a flux surface is the cumulative
    volume integral $S_i^{\rm in}(\rho) = \int_0^\rho s_i(\rho'') \, dV''$, where
    $s_i$ is the local ion particle source density (m$^{-3}$ s$^{-1}$) and the integral
    extends over all volume enclosed by the flux surface labeled by $\rho$. This quantity
    appears directly as the right-hand side driving term in the 1D radial ion density
    transport equation, linking particle fueling, recycling, ionization, and charge-exchange
    processes to density evolution. Unlike [total_ion_particle_source_inside_flux_surface](name:total_ion_particle_source_inside_flux_surface),
    which sums over all ion species, this name refers to a single ion species or charge
    state; the companion [electron_particle_source_inside_flux_surface](name:electron_particle_source_inside_flux_surface)
    provides the analogous quantity for the electron population. Sources contributing
    to $S_i^{\rm in}$ include neutral-beam injection, pellet ablation, gas puffing,
    and atomic ionization; sinks include recombination and charge exchange. Typical
    magnitudes in a tokamak core range from $10^{19}$ to $10^{22}$ s$^{-1}$ depending
    on the fueling scenario and plasma volume.


    Sign convention: Positive when particles are added to the ion population inside
    the flux surface (net particle source).


    The volume-integrated form is preferred in transport solvers because it avoids
    numerical singularities at the magnetic axis and is directly comparable to particle
    flux measurements.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:total_ion_particle_source_inside_flux_surface
  - name:electron_particle_source_inside_flux_surface
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/ion/particles_inside
    dd_path: core_sources/source/profiles_1d/ion/particles_inside
    status: composed
  - id: dd:core_sources/source/profiles_1d/ion/state/particles_inside
    dd_path: core_sources/source/profiles_1d/ion/state/particles_inside
    status: composed
- name: ion_state_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for radial conductive heat transport of a specific
    ion charge state, relating the flux-surface-averaged radial ion heat flux to the
    local ion temperature gradient for that charge state. Combines anomalous and neoclassical
    contributions and is resolved by charge state rather than summed over the full
    ion species.
  documentation: 'The ion-state energy diffusivity $\chi_s$ characterizes the radial
    conductive transport of thermal energy for a single ion charge state $s$. It appears
    in the flux-surface-averaged heat flux through the constitutive relation


    $$q_{r,s} = -\tfrac{3}{2} n_s \chi_s \frac{\partial T_{i,s}}{\partial r},$$


    where $q_{r,s}$ (W m$^{-2}$) is the conductive heat flux in the radial direction
    $r$ normal to flux surfaces (positive outward, i.e., in the direction of increasing
    minor radius), $n_s$ is the number density of charge state $s$, and $T_{i,s}$
    is the ion temperature of that charge state. The factor $\tfrac{3}{2}$ follows
    from the thermal energy per particle for a monatomic ideal gas. The radial coordinate
    $r$ here is shorthand for any monotonic label of flux surfaces (e.g., normalized
    toroidal flux radius $\rho_{\mathrm{tor,norm}}$); the gradient is understood as
    the local flux-surface-normal gradient in the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    This coefficient encapsulates contributions from both neoclassical (collisional)
    and anomalous (turbulence-driven) heat transport mechanisms acting on charge state
    $s$. It is distinct from the charge-state-summed species quantity $\chi_i$ (see
    `name:ion_energy_diffusivity`) and from the total-ion counterpart that sums over
    all species (see `name:total_ion_energy_diffusivity`). The charge-state resolution
    is relevant for impurity species that exist in multiple ionization states, where
    different states may experience different effective transport.


    Note that $T_{i,s}$ is the temperature attributed to charge state $s$; in practice,
    when all charge states of a given species are assumed to be in thermal equilibrium,
    a single species temperature is used for all states, but the formalism allows
    per-state temperatures in non-equilibrium settings.


    Typical values in the tokamak core range from $0.1$ to $10\,\mathrm{m}^2\,\mathrm{s}^{-1}$,
    increasing toward the plasma edge and in high-confinement regimes with strong
    turbulence. Values are inferred from power-balance analysis using measured temperature
    and density profiles, typically through transport code simulations. The analogous
    charge-state-resolved particle transport coefficient is `name:ion_state_particle_diffusivity`,
    and the momentum transport counterpart is `name:ion_state_momentum_diffusivity`.
    The equivalent quantity for neutral charge states is `name:neutral_state_energy_diffusivity`.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:total_ion_energy_diffusivity
  - name:ion_state_particle_diffusivity
  - name:neutral_state_energy_diffusivity
  - name:ion_state_momentum_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/energy/d
    dd_path: core_transport/model/profiles_1d/ion/state/energy/d
    status: composed
- name: ion_state_momentum_diffusivity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Effective diffusivity for toroidal momentum transport of a specific
    ion charge state arising from the diamagnetic drift mechanism. Defined via the
    flux-gradient relation for the toroidal momentum flux, charge-state-resolved and
    flux-surface-averaged over a magnetic surface.
  documentation: 'This quantity is the effective diffusion coefficient $D_{\mathrm{dia},s}$
    for the toroidal momentum flux of a single ion charge state $s$ due to the diamagnetic
    drift. It enters the constitutive relation for the radial flux of toroidal angular
    momentum density,

    $$\Pi_{r,s}^{\mathrm{dia}} = -m_s n_s D_{\mathrm{dia},s}\,\frac{\partial v_{\phi,s}}{\partial
    r},$$

    where $m_s$ is the ion mass of charge state $s$, $n_s$ the number density, $v_{\phi,s}$
    the mean toroidal velocity, and $r$ a generalized radial coordinate. The quantity
    is flux-surface-averaged, so it represents the local transport coefficient on
    a given magnetic surface rather than a local point value. The diamagnetic drift
    for charge state $s$ arises from the pressure-gradient force in the presence of
    the magnetic field $\mathbf{B}$, with drift velocity $\mathbf{v}_{\mathrm{dia},s}
    = -(\nabla p_s \times \hat{\mathbf{b}})/(q_s n_s B)$, where $p_s = n_s T_s$ is
    the partial pressure, $q_s$ the charge, and $B = |\mathbf{B}|$ the field magnitude.
    The resulting effective diffusivity scales with the ion thermal pressure and magnetic
    geometry and is generally of neoclassical magnitude. Typical values in tokamak
    core plasmas range from $10^{-2}$ to $1\;\mathrm{m^2\,s^{-1}}$, comparable to
    neoclassical ion thermal diffusivities.


    This is the charge-state-resolved analog of [ion_momentum_diffusivity_due_to_diamagnetic_drift](name:ion_momentum_diffusivity_due_to_diamagnetic_drift),
    which integrates over all charge states of a given ion species. Resolving by charge
    state is important for impurity ions that occupy multiple ionization stages with
    distinct pressure profiles. The toroidal component of the total (all-mechanism)
    momentum diffusivity for the same charge state is given by [toroidal_component_of_ion_state_momentum_diffusivity](name:toroidal_component_of_ion_state_momentum_diffusivity),
    and the parallel-projected component by [parallel_component_of_ion_state_momentum_diffusivity](name:parallel_component_of_ion_state_momentum_diffusivity).
    Comparison with [ion_state_energy_diffusivity](name:ion_state_energy_diffusivity)
    and [ion_state_particle_diffusivity](name:ion_state_particle_diffusivity) quantifies
    the relative importance of momentum, energy, and particle transport for the same
    charge state.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_momentum_diffusivity_due_to_diamagnetic_drift
  - name:ion_state_energy_diffusivity
  - name:ion_state_particle_diffusivity
  - name:ion_state_momentum_diffusivity
  - name:parallel_component_of_ion_state_momentum_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/diamagnetic/d
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/diamagnetic/d
    status: composed
- name: ion_state_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for particle transport of a specific ion charge
    state across flux surfaces, resolving the charge-state-level detail absent from
    aggregate ion transport coefficients.
  documentation: "The ion-state particle diffusivity $D_{\\rm state}$ enters the flux-surface-averaged\
    \ radial particle transport equation for a specific ion charge state $z$ as $\\\
    Gamma_{\\rm state} = -D_{\\rm state}\\,\\nabla n_{\\rm state}$, where $n_{\\rm\
    \ state}$ is the density of that charge state and $\\Gamma_{\\rm state}$ is its\
    \ radial particle flux. This charge-state-resolved description is necessary when\
    \ ionization balance is not instantaneous relative to transport timescales \u2014\
    \ a condition common in the plasma edge and in heavy impurity species with many\
    \ partially ionized states. Typical values span $10^{-2}$\u2013$10\\,\\text{m}^2\\\
    text{s}^{-1}$ in tokamak core plasmas, with neoclassical estimates at the low\
    \ end and anomalous turbulent transport dominating in most experimental conditions.\
    \ The aggregate ion counterpart, which sums over all charge states, is [ion_particle_diffusivity](name:ion_particle_diffusivity);\
    \ the analogous quantity for neutral atomic or molecular states is [neutral_state_particle_diffusivity](name:neutral_state_particle_diffusivity).\
    \ For energy transport of the same ion charge state, see [ion_state_energy_diffusivity](name:ion_state_energy_diffusivity),\
    \ and for the momentum transport tensor of the same subject, see [ion_state_momentum_diffusivity](name:ion_state_momentum_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_particle_diffusivity
  - name:neutral_state_particle_diffusivity
  - name:ion_state_energy_diffusivity
  - name:ion_state_momentum_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/particles/d
    dd_path: core_transport/model/profiles_1d/ion/state/particles/d
    status: composed
- name: neutral_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity governing radial energy transport of the neutral
    particle population across flux surfaces in the core plasma.
  documentation: "The neutral energy diffusivity $\\chi_n$ characterizes how efficiently\
    \ thermal energy carried by neutral particles spreads radially, entering the 1D\
    \ radial transport equation for neutral energy as the diffusive coefficient in\
    \ $q_n = -n_n \\chi_n \\nabla T_n$, where $n_n$ is the neutral density and $T_n$\
    \ is the neutral temperature. Neutrals do not respond to magnetic confinement\
    \ and their transport is governed by atomic processes \u2014 charge exchange,\
    \ ionization, and elastic collisions with ions \u2014 so $\\chi_n$ typically reflects\
    \ mean-free-path physics rather than turbulent or neoclassical diffusion. Effective\
    \ values span a wide range depending on plasma density and neutral opacity: from\
    \ $\\sim 10^{-1}$ to $\\sim 10^2$ m$^2$s$^{-1}$ in the core, with higher values\
    \ in low-density, transparent plasmas. This quantity is the energy-channel counterpart\
    \ to [neutral particle diffusivity](name:neutral_particle_diffusivity), which\
    \ governs radial density transport, and belongs to the same diffusivity family\
    \ as [ion energy diffusivity](name:ion_energy_diffusivity) and [electron energy\
    \ diffusivity](name:electron_energy_diffusivity). It is evaluated by transport\
    \ codes using neutral Monte Carlo or fluid neutral models coupled to the core\
    \ transport solver."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:neutral_particle_diffusivity
  - name:ion_energy_diffusivity
  - name:electron_energy_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/neutral/energy/d
    dd_path: core_transport/model/profiles_1d/neutral/energy/d
    status: composed
- name: neutral_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for neutral particle transport across flux surfaces,
    governing the radial spreading of the neutral particle population in the core
    plasma.
  documentation: "The neutral particle diffusivity $D_n$ characterizes the rate at\
    \ which neutral atoms and molecules spread radially across magnetic flux surfaces,\
    \ entering the 1D radial transport equation for the neutral particle density $n_n$\
    \ as the diffusive flux $\\Gamma_n = -D_n \\nabla n_n$, where $\\nabla n_n$ is\
    \ the radial density gradient. Unlike charged-particle diffusivity, which arises\
    \ from Coulomb collisions and turbulent transport, neutral diffusion is primarily\
    \ governed by charge-exchange and ionization mean-free-path effects, with typical\
    \ values spanning $0.1$\u2013$10\\;\\mathrm{m^2\\,s^{-1}}$ in the core depending\
    \ on plasma density and neutral opacity. This quantity is closely related to [neutral_energy_diffusivity](name:neutral_energy_diffusivity),\
    \ which governs the corresponding radial energy transport of neutrals, and parallels\
    \ the analogous charged-particle coefficients [ion_particle_diffusivity](name:ion_particle_diffusivity)\
    \ and [electron_particle_diffusivity](name:electron_particle_diffusivity) in the\
    \ same transport model. When resolving transport by individual atomic charge or\
    \ excitation states, the state-resolved counterpart [neutral_state_particle_diffusivity](name:neutral_state_particle_diffusivity)\
    \ should be used instead. Values are typically inferred from neutral transport\
    \ codes coupled to fluid transport solvers, constrained by charge-exchange spectroscopy\
    \ and neutral-particle analyzer measurements."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:neutral_energy_diffusivity
  - name:ion_particle_diffusivity
  - name:electron_particle_diffusivity
  - name:neutral_state_particle_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/neutral/particles/d
    dd_path: core_transport/model/profiles_1d/neutral/particles/d
    status: composed
- name: neutral_state_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for energy transport of a specific neutral charge
    state across flux surfaces, distinct from the aggregate neutral population energy
    diffusivity.
  documentation: The neutral-state energy diffusivity $D_E$ characterizes the Fickian
    spreading of thermal energy carried by a specific neutral charge state in the
    radial direction across magnetic flux surfaces. It appears in the flux-surface-averaged
    energy transport equation for that state as $q_r = -n D_E \nabla_r T$, where $n$
    is the neutral state density and $T$ is its temperature, and $\nabla_r$ denotes
    the radial gradient across flux surfaces. This quantity is the neutral analog
    of [ion_state_energy_diffusivity](name:ion_state_energy_diffusivity), which plays
    the same role for a specific ion charge state; contrast with [neutral_energy_diffusivity](name:neutral_energy_diffusivity),
    which represents the aggregate over all neutral states. Values are supplied by
    transport models (anomalous, neoclassical, or kinetic neutral codes) and may span
    several orders of magnitude depending on the neutral opacity and background plasma
    conditions. The complementary particle transport coefficient for the same neutral
    state is [neutral_state_particle_diffusivity](name:neutral_state_particle_diffusivity).
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_state_energy_diffusivity
  - name:neutral_energy_diffusivity
  - name:neutral_state_particle_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/neutral/state/energy/d
    dd_path: core_transport/model/profiles_1d/neutral/state/energy/d
    status: composed
- name: neutral_state_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity for particle transport of a specific neutral
    state across flux surfaces, distinct from the aggregate neutral population diffusivity.
  documentation: "The neutral-state particle diffusivity $D$ characterizes anomalous\
    \ or neoclassical radial spreading of a particular neutral quantum state (e.g.,\
    \ a specific excited or ground state of a hydrogen isotope) in the core plasma,\
    \ entering the 1D radial transport equation $\\partial n / \\partial t = \\nabla\
    \ \\cdot (D \\nabla n) + S$, where $n$ is the state-resolved neutral density and\
    \ $S$ is the particle source density. Resolving diffusivity per neutral state\
    \ is important when charge-exchange, ionization, and recombination processes couple\
    \ different states with distinct transport properties, as occurs in multi-fluid\
    \ neutral models. Typical values fall in the range $10^{-2}$\u2013$10^{1}$ m$^2$\
    \ s$^{-1}$ in the core plasma, depending on the neutral mean-free path and background\
    \ density. This quantity complements [neutral_particle_diffusivity](name:neutral_particle_diffusivity),\
    \ which describes the aggregate neutral population, and mirrors the ion-state\
    \ analog [ion_state_particle_diffusivity](name:ion_state_particle_diffusivity).\
    \ The companion energy transport coefficient for the same neutral state is [neutral_state_energy_diffusivity](name:neutral_state_energy_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:neutral_particle_diffusivity
  - name:ion_state_particle_diffusivity
  - name:neutral_state_energy_diffusivity
  constraints: []
  sources:
  - id: dd:core_transport/model/profiles_1d/neutral/state/particles/d
    dd_path: core_transport/model/profiles_1d/neutral/state/particles/d
    status: composed
- name: parallel_component_of_co_passing_fast_particle_pressure
  kind: scalar
  status: draft
  description: Parallel component of the pressure tensor for co-passing fast (suprathermal)
    particles. Co-passing particles are those on untrapped orbits whose guiding-center
    parallel velocity is aligned with the magnetic field direction $\hat{b} = \mathbf{B}/|\mathbf{B}|$.
    This is a local scalar quantity evaluated at each point in the plasma.
  documentation: "The parallel pressure of the co-passing fast-particle population\
    \ is the second parallel-velocity moment of the co-passing distribution function\
    \ $f_{\\rm co}$:\n\n$$P_{\\parallel,\\rm co} = \\int m\\, v_\\parallel^2\\, f_{\\\
    rm co}(\\mathbf{v})\\, d^3v,$$\n\nwhere $m$ is the particle mass and $v_\\parallel\
    \ = \\mathbf{v}\\cdot\\hat{b}$ is the velocity component along the local magnetic\
    \ field unit vector $\\hat{b}$. The co-passing subset is restricted to guiding-center\
    \ orbits for which $v_\\parallel > 0$ when the field-aligned direction is taken\
    \ as the positive sense of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. As a second moment of a non-negative distribution\
    \ function, $P_{\\parallel,\\rm co}$ is non-negative everywhere.\n\nThis quantity\
    \ is local (not flux-surface-averaged) and varies across both the minor and major\
    \ radius of the plasma cross-section.\n\nThe co-passing and counter-passing parallel\
    \ pressures partition the total fast-particle parallel pressure:\n\n$$P_{\\parallel,\\\
    rm fast} = P_{\\parallel,\\rm co} + P_{\\parallel,\\rm ctr},$$\n\nwhere $P_{\\\
    parallel,\\rm ctr}$ is [parallel_component_of_counter_passing_fast_particle_pressure](name:parallel_component_of_counter_passing_fast_particle_pressure)\
    \ and $P_{\\parallel,\\rm fast}$ is [parallel_component_of_fast_particle_pressure](name:parallel_component_of_fast_particle_pressure).\
    \ The companion isotropic (trace) pressure of the co-passing population is [co_passing_fast_particle_pressure](name:co_passing_fast_particle_pressure),\
    \ and the full anisotropy $P_\\parallel - P_\\perp$ of the co-passing subset can\
    \ be obtained by comparing with the perpendicular co-passing pressure.\n\nThis\
    \ quantity enters the parallel momentum balance and anisotropic pressure tensor\
    \ in extended MHD and Fokker\u2013Planck transport models; pressure anisotropy\
    \ drives finite parallel viscosity that influences current profiles and plasma\
    \ rotation. It is computed from Monte Carlo or Fokker\u2013Planck guiding-center\
    \ solvers by integrating the distribution function over co-passing velocity space.\n\
    \nTypical values in neutral-beam-heated tokamak plasmas range from a few kPa to\
    \ tens of kPa in the plasma core, depending on injected beam power and geometry."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:parallel_component_of_counter_passing_fast_particle_pressure
  - name:parallel_component_of_fast_particle_pressure
  - name:co_passing_fast_particle_pressure
  constraints: []
  arguments:
  - name: co_passing_fast_particle_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure_fast_parallel
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_2d/co_passing/pressure_fast_parallel
    status: composed
- name: parallel_component_of_counter_passing_fast_particle_pressure
  kind: scalar
  status: draft
  description: Kinetic stress along the magnetic field direction for counter-passing
    fast (suprathermal) particles, whose guiding-center parallel velocity is directed
    opposite to the plasma current.
  documentation: 'The parallel pressure component $p_{\parallel,\mathrm{ctr}}$ of
    the counter-passing fast-particle population is defined by the second moment of
    the distribution function restricted to particles with guiding-center parallel
    velocity $v_\parallel < 0$ (directed opposite to the plasma current direction):
    $p_{\parallel,\mathrm{ctr}} = m \int_{v_\parallel < 0} v_\parallel^2 f(\mathbf{v})
    \, d^3v$, where $m$ is the particle mass and $f$ is the fast-particle distribution
    function. This quantity captures the anisotropic pressure contribution along $\mathbf{B}$
    from the counter-passing orbit population, which is distinct from the perpendicular
    stress and from the total isotropic [counter_passing_fast_particle_pressure](name:counter_passing_fast_particle_pressure).
    The pressure anisotropy $p_\parallel - p_\perp$ drives firehose-type instabilities
    and enters the parallel momentum balance and viscous stress tensor in extended
    MHD formulations. Counter-passing fast particles carry toroidal current opposite
    to the plasma current; their parallel pressure relates to the [toroidal_component_of_counter_passing_fast_ion_current_density](name:toroidal_component_of_counter_passing_fast_ion_current_density)
    through the pressure-anisotropy drive in the parallel force balance. Typical values
    range from tens to hundreds of kPa in neutral-beam-heated tokamak plasmas with
    significant fast-ion populations. This quantity is the counter-passing counterpart
    to [parallel_component_of_co_passing_fast_particle_pressure](name:parallel_component_of_co_passing_fast_particle_pressure);
    the sum over co- and counter-passing populations contributes to [parallel_component_of_fast_particle_pressure](name:parallel_component_of_fast_particle_pressure).'
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:counter_passing_fast_particle_pressure
  - name:toroidal_component_of_counter_passing_fast_ion_current_density
  - name:parallel_component_of_co_passing_fast_particle_pressure
  - name:parallel_component_of_fast_particle_pressure
  constraints: []
  arguments:
  - name: counter_passing_fast_particle_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/counter_passing/pressure_fast_parallel
    status: composed
