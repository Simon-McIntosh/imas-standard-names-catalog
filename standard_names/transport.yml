- name: toroidal_component_of_trapped_particle_current_density
  kind: scalar
  status: draft
  description: Toroidal component of current density carried by the bounce-trapped
    particle population, including electron and thermal ion back-currents driven by
    collisional drag on the trapped distribution.
  documentation: 'The toroidal current density from the trapped particle population
    arises because bounce-trapped particles, confined to banana orbits between magnetic
    mirror points, acquire a net toroidal drift when subject to collisional friction
    from the bulk plasma. The total contribution includes not only the primary driven
    current from the trapped species but also the back-currents (drag-currents) induced
    in the thermal electron and ion populations. Formally, this is the toroidal projection
    $J_\phi^\mathrm{trap} = \mathbf{J}^\mathrm{trap} \cdot \hat{\phi}$, where $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame. This quantity complements the co-
    and counter-passing particle contributions; summing [toroidal_component_of_co_passing_particle_current_density](name:toroidal_component_of_co_passing_particle_current_density),
    [toroidal_component_of_counter_passing_particle_current_density](name:toroidal_component_of_counter_passing_particle_current_density),
    and this quantity recovers the total [toroidal_component_of_current_density](name:toroidal_component_of_current_density)
    from the distribution. Trapped-particle current densities are typically small
    compared to passing-particle contributions but become significant for high collisionality
    or in neoclassical regimes; magnitudes range from $10^3$ to $10^6$ A m$^{-2}$
    depending on plasma conditions. It is evaluated at each point in the poloidal
    cross-section and is computed from kinetic or bounce-averaged distribution function
    models.


    Sign convention: Positive when the trapped-particle toroidal current flows in
    the direction of increasing toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_co_passing_particle_current_density
  - name:toroidal_component_of_counter_passing_particle_current_density
  - name:toroidal_component_of_current_density
  constraints: []
