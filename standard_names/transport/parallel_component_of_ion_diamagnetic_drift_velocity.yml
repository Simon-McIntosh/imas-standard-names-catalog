name: parallel_component_of_ion_diamagnetic_drift_velocity
status: draft
description: Field-aligned projection of the ion diamagnetic drift velocity arising
  from perpendicular pressure gradients in a magnetized plasma.
documentation: "The parallel component of the ion diamagnetic drift velocity $v_{\\\
  rm dia,\\parallel}^i$ (m\xB7s$^{-1}$) is the projection of the diamagnetic drift\
  \ $\\mathbf{v}_{\\rm dia}^i = (\\hat{b} \\times \\nabla p_i) / (Z_i e n_i B)$ onto\
  \ the magnetic-field direction $\\hat{b}$, where $p_i$ is the ion pressure (Pa),\
  \ $n_i$ the ion number density (m$^{-3}$), $Z_i$ the ion charge number, $e$ the\
  \ elementary charge (C), and $B$ the magnetic-field magnitude (T). In a purely homogeneous,\
  \ straight magnetic field the diamagnetic drift is exactly perpendicular to $\\\
  mathbf{B}$ and this component vanishes. A nonzero parallel projection appears when\
  \ the magnetic geometry introduces field-line curvature and $\\nabla B$ effects,\
  \ coupling perpendicular pressure gradients to parallel flows through the Pfirsch\u2013\
  Schl\xFCter mechanism. In tokamak edge plasmas typical magnitudes are $10^1$\u2013\
  $10^3$ m\xB7s$^{-1}$, depending on local $\\nabla p_i$ and $B$. The quantity is\
  \ computed by neoclassical and edge-fluid transport codes. See `ion_diamagnetic_drift_velocity`\
  \ for the full vector quantity and `poloidal_component_of_pfirsch_schlueter_current_density`\
  \ for the related return-current mechanism."
