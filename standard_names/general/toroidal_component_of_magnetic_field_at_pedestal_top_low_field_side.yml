name: toroidal_component_of_magnetic_field_at_pedestal_top_low_field_side
description: Toroidal projection of the magnetic field vector $B_\phi$ evaluated at
  the pedestal-top position on the HFS or LFS midplane.
documentation: "The toroidal magnetic field at the pedestal top $B_{\\phi,\\rm ped}\
  \ = \\mathbf{B}\\cdot\\hat{\\phi}$ is the dominant component of the total field\
  \ in a tokamak, evaluated at the radial position corresponding to the top of the\
  \ H-mode pedestal (T). Because $B_\\phi \\propto 1/R$, the HFS value exceeds the\
  \ LFS value by a factor $(R_{\\rm LFS}/R_{\\rm HFS})^{-1}$, where $R$ is the major\
  \ radius (m). Typical values at the outboard pedestal top are 1\u20135 T depending\
  \ on the device. The toroidal field determines the ion Larmor radius $\\rho_i =\
  \ m_i v_{\\rm th,i}/(Z_i e B_\\phi)$ and the electron cyclotron frequency $\\omega_{ce}\
  \ = eB_\\phi/m_e$, both of which influence pedestal transport physics. Obtained\
  \ from equilibrium reconstruction constrained by external magnetic measurements.\
  \ Positive when $B_\\phi$ is in the $+\\phi$ direction under COCOS-11."
kind: vector_component
unit: T
status: draft
