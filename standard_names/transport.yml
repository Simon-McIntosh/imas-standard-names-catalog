- name: fast_ion_power_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volumetric power density transferred from fast ions to the background
    plasma species via Coulomb collisions, representing collisional slowing and thermalization
    of the energetic particle population.
  documentation: "The fast ion collisional power density quantifies the volumetric\
    \ energy exchange rate between suprathermal ions and the thermal plasma through\
    \ small-angle Coulomb scattering. This term is the primary loss channel for fast\
    \ ion energy in the absence of anomalous transport, arising from the Fokker-Planck\
    \ collision operator and governing the slowing-down distribution. Typical values\
    \ in neutral-beam-heated tokamaks range from 0.1\u201310 MW/m\xB3 in the core,\
    \ depending on beam power and plasma density. The quantity is related to the thermal\
    \ ion heating rate via [thermal_ion_power_density_due_to_coulomb_collisions](name:thermal_ion_power_density_due_to_coulomb_collisions)\
    \ and to the electron channel via [thermal_electron_power_density_due_to_coulomb_collisions](name:thermal_electron_power_density_due_to_coulomb_collisions).\
    \ Measured indirectly through neutron emission spectroscopy or inferred from fast\
    \ particle slowing-down analysis in integrated modeling codes."
  unit: W.m^-3
  physics_domain: transport
