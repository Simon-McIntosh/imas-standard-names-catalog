- name: vertical_coordinate_of_geometric_axis
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the arithmetic mean of the plasma boundary's
    maximum and minimum Z coordinates, defining the vertical midpoint of the poloidal
    cross-section.
  documentation: 'The vertical coordinate of the geometric axis defines the midpoint
    of the plasma boundary in the $Z$ direction of the IMAS cylindrical $(R, \phi,
    Z)$ frame, computed as $Z_{\rm geo} = (Z_{\max} + Z_{\min}) / 2$ from the boundary
    contour. This geometric descriptor is independent of the magnetic equilibrium
    and provides a robust reference for plasma position control and shape analysis.
    In tokamak scenarios with a well-aligned plasma, $Z_{\rm geo}$ closely tracks
    the magnetic axis height $[Z_{\rm axis}](name:vertical_coordinate_of_magnetic_axis)$,
    but may deviate substantially during vertical displacement events or strong shaping.
    Typical core plasmas have $Z_{\rm geo}$ within $\pm 0.3$ m of the vacuum vessel
    midplane for medium-size devices. The companion radial coordinate is $[R_{\rm
    geo}](name:major_radius_of_geometric_axis)$.


    Sign convention: Positive when the geometric axis lies above the $Z = 0$ reference
    plane (the machine midplane).'
