- name: power_due_to_electron_cyclotron_heating
  kind: scalar
  status: draft
  description: Net RF wave energy absorbed per unit time by plasma electrons via electron
    cyclotron resonance from a single ECRH launcher. It is the coupled heating power,
    distinct from the RF power launched toward or into the vessel.
  documentation: 'Power due to electron cyclotron heating is the net rate at which
    RF wave energy from a single electron-cyclotron launcher is absorbed by plasma
    electrons through cyclotron-resonant interaction. It represents coupled electron
    heating power, not the launcher output power or the power merely entering the
    vacuum vessel.


    For a launcher-resolved absorbed power density, the total absorbed power is


    $$

    P_\mathrm{EC} = \int_{V_\mathrm{p}} p_{\mathrm{EC},e}(\mathbf{x}) \, dV

    $$


    where $P_\mathrm{EC}$ is the absorbed electron-cyclotron heating power in W, $p_{\mathrm{EC},e}$
    is the volumetric RF power density deposited in electrons in W m^-3, $\mathbf{x}$
    denotes position, $dV$ is a volume element in m^3, and $V_\mathrm{p}$ is the plasma
    volume over which the launcher-specific deposition is evaluated.


    In practice this quantity is inferred from calibrated launcher power, transmission-line
    losses, stray-radiation or unabsorbed-power estimates, ray or beam-tracing calculations,
    and power-balance constraints. It is therefore usually lower than or equal to
    the corresponding [launched_power_of_electron_cyclotron_launcher](name:launched_power_of_electron_cyclotron_launcher),
    with the difference accounting for propagation, coupling, reflection, shine-through,
    and other losses not deposited in the plasma electrons.


    Typical absorbed powers for one launcher range from about 0.1-2 MW in many present-day
    experiments, while large multi-megawatt systems can deliver several MW per launcher
    depending on frequency, injection geometry, plasma density, magnetic field, and
    optical depth.


    Sign convention: Positive when net RF wave energy is transferred from the electron-cyclotron
    wave field to plasma electrons.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_electron_cyclotron_heating
  - name:power_due_to_ion_cyclotron_heating
  - name:current_due_to_electron_cyclotron_current_drive
  sources:
  - id: dd:summary/heating_current_drive/ec/power/value
    dd_path: summary/heating_current_drive/ec/power/value
    status: composed
- name: power_due_to_first_orbit_loss
  kind: scalar
  status: draft
  description: Volume-integrated non-negative power carried out of the confined fast-ion
    population by particles whose first guiding-center orbit after birth or acceleration
    is unconfined. It is reported as a positive loss magnitude and enters fast-ion
    energy balances with a minus sign.
  documentation: 'First-orbit loss power is the global energy-removal rate associated
    with prompt escape of newly born or newly accelerated fast ions before they complete
    their first guiding-center orbit. A particle is counted only when its loss time
    after the source event is less than the time for its first complete orbit; particles
    that survive this cutoff and are lost later are not included. The quantity is
    a loss from the fast-ion population, not a spatially resolved heat-load distribution
    on plasma-facing components.


    The non-negative loss magnitude can be written as an energy-weighted loss-event
    rate:


    $$

    P_{\rm fol} = \int_V \int_0^\infty E_{\rm esc}\, \dot{n}_{\rm fol}^{(1)}(\mathbf{r},
    E_{\rm esc})\, dE_{\rm esc}\, dV

    $$


    where $P_{\rm fol}$ is the first-orbit loss power, $E_{\rm esc}$ is the particle
    kinetic energy at escape in joules, and $\dot{n}_{\rm fol}^{(1)}$ is the rate
    density of first-orbit loss events per source volume and per escape-energy interval,
    with units m^-3 J^-1 s^-1. The superscript $(1)$ denotes the first-orbit classification,
    $V$ is the source volume over which fast ions are created or accelerated, and
    using $E_{\rm esc}$ excludes energy already transferred to the background plasma
    before escape. In a fast-ion energy balance this loss enters as $-P_{\rm fol}$;
    if charge-exchange loss is treated as a disjoint channel, the combined contribution
    is $-(P_{\rm fol}+P_{\rm CX})$, where $P_{\rm CX}$ is represented by [fast_ion_power_due_to_charge_exchange](name:fast_ion_power_due_to_charge_exchange).


    It is usually computed from orbit-following or Monte Carlo fast-ion transport
    calculations. Markers are launched from a birth or acceleration distribution,
    advanced in the magnetic and electric fields, classified by whether they intersect
    a loss boundary before the first-orbit cutoff, and weighted by their escape energy
    and source rate. Prompt-loss probes, fast-ion loss detectors, and wall heat-load
    measurements can constrain the calculation, but the global value is generally
    inferred from modeling rather than measured directly.


    Typical values are 0 W when all prompt orbits are confined. For fast-ion source
    powers of 10^6-10^7 W, representative modeled losses are often 10^3-10^5 W for
    well-confined core sources and 10^5-10^6 W when percent-level first-orbit loss
    fractions occur near the edge or for large orbit widths. The value scales with
    source power and with the loss fraction set by birth position, pitch angle, particle
    energy, plasma shape, and the distance between the initial orbit and the material
    boundary.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_due_to_charge_exchange
  sources:
  - id: dd:distributions/distribution/global_quantities/power_first_orbit
    dd_path: distributions/distribution/global_quantities/power_first_orbit
    status: composed
- name: power_due_to_ion_cyclotron_heating
  kind: scalar
  status: draft
  description: Net ion cyclotron resonance heating power absorbed by the plasma from
    one ICRH launcher. It is the RF wave energy deposition rate in the plasma and
    is distinct from power launched by the antenna or lost in the RF system.
  documentation: 'Power due to ion cyclotron heating is the net rate at which radio-frequency
    wave energy from one ion cyclotron resonance heating launcher is absorbed by the
    plasma. It includes energy deposited into the plasma bulk through ion-cyclotron,
    harmonic, electron, and mode-conversion channels, and excludes reflected power
    and losses in transmission lines, antenna structures, or surrounding material.
    As a scalar absorbed power, it is not affected by magnetic-field or plasma-current
    sign conventions.


    The launcher-resolved absorbed power is the time rate of absorbed RF energy, equivalently
    the volume integral of the local RF absorption rate:


    $$

    P_{\mathrm{ICRH},a} = \frac{dE_{\mathrm{abs},a}}{dt} = \int_{V_p} p_{\mathrm{abs},a}(\mathbf{x})
    \, dV

    $$


    where $a$ labels the launcher, $E_{\mathrm{abs},a}$ is the RF energy absorbed
    in the plasma from that launcher, $p_{\mathrm{abs},a}$ is the local absorbed power
    density, and $V_p$ is the plasma volume.


    In practice this quantity is obtained from calibrated RF forward and reflected
    power measurements corrected for transmission and antenna losses, from wave-coupling
    and absorption calculations, or from plasma power-balance analysis. It differs
    from the launched antenna power because only the net energy absorbed by the plasma
    is counted. Summing this quantity over all ICRH launchers gives [total_power_due_to_ion_cyclotron_heating](name:total_power_due_to_ion_cyclotron_heating);
    spatially resolved absorption rates integrate to this launcher-resolved scalar
    value, and time-resolved values follow changes in RF drive, antenna loading, and
    plasma conditions.


    Typical values are $10^5$-$10^7$ W per launcher in present-day tokamak discharges,
    with high-power systems reaching several $10^7$ W. Values near 0 W occur when
    the launcher is off, poorly coupled, or when most injected RF power is reflected
    or lost before absorption.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_ion_cyclotron_heating_antenna
  - name:total_power_due_to_ion_cyclotron_heating
  - name:power_due_to_electron_cyclotron_heating
  sources:
  - id: dd:summary/heating_current_drive/ic/power/value
    dd_path: summary/heating_current_drive/ic/power/value
    status: composed
- name: power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Electromagnetic wave power associated with a single beam-tracing beam,
    encompassing both the initial launch power and the net power absorbed by the plasma
    along the beam trajectory.
  documentation: 'The electromagnetic power associated with a single coherent-wave
    beam propagated through the plasma by beam-tracing methods. This quantity spans
    the full lifecycle of wave energy in a beam: from the power assigned at the launch
    point to the net power deposited in the plasma species along the propagation path.


    The local power flux decreases along the beam arc length $s$ according to


    $$

    \frac{dP}{ds} = -\alpha(\mathbf{r})\, P(s)

    $$


    where $\alpha(\mathbf{r})$ is the local wave power absorption coefficient at position
    $\mathbf{r}$ and $P(s)$ is the beam power at arc length $s$ from the launch point.
    The value at $s = 0$ corresponds to [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam),
    which sets the normalization reference for absorption calculations along the trajectory.
    The cumulative attenuation integrated over the full path yields [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam),
    equal to the initial power minus the residual wave power at the end of the beam.


    Beam-tracing calculations for RF heating systems evaluate both the initial power
    setting and the cumulative deposited power to determine single-pass absorption
    efficiency and spatial deposition profiles. The beam arc length parameterizing
    propagation is tracked separately via [length_of_beam_tracing_beam](name:length_of_beam_tracing_beam).


    Initial beam powers range from tens of kilowatts to several megawatts per beam
    depending on the RF system type and number of beams modeled; absorbed fractions
    approach unity in strongly absorbing core plasmas.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:initial_power_of_beam_tracing_beam
  - name:absorbed_power_of_beam_tracing_beam
  - name:length_of_beam_tracing_beam
  sources:
  - id: dd:ece/channel/beam_tracing/beam/power_initial
    dd_path: ece/channel/beam_tracing/beam/power_initial
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/power_initial
    dd_path: waves/coherent_wave/beam_tracing/beam/power_initial
    status: composed
- name: absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Net coherent-wave power absorbed by the plasma from one beam-tracing
    beam over its computed trajectory. It is the final path-integrated, species-summed
    deposited power, equal to the beam power entering the path minus the residual
    wave power at the end.
  documentation: 'Absorbed power of a beam-tracing beam is the net coherent-wave power
    transferred from one traced beam to the plasma over its computed propagation path.
    It is the final path-integrated total for that single beam, summed over all absorbing
    species, and is distinct from scenario-level [absorbed power] obtained by summing
    over beams or launchers.


    For a ray arc length $s$ increasing along the direction of wave propagation, the
    endpoint absorbed power is


    $$

    P_{\mathrm{abs}} = P_0 - P_{\mathrm{end}} = P_0\left[1 - \exp\left(-2\int_{s_0}^{s_{\mathrm{end}}}
    \kappa_i^{\mathrm{tot}}(s)\,ds\right)\right]

    $$


    where $P_0$ is the [launched power] or entering beam power in W, $P_{\mathrm{end}}$
    is the residual [power of the beam-tracing beam](name:power_of_beam_tracing_beam)
    at the end of the path in W, $s_0$ and $s_{\mathrm{end}}$ are the start and end
    arc-length positions in m, and $\kappa_i^{\mathrm{tot}}$ is the species-summed
    spatial amplitude-damping coefficient along the ray in m^-1. The factor of 2 appears
    because wave power is proportional to squared wave-field amplitude; positive damping
    therefore makes the remaining beam power decrease along increasing $s$.


    In practice this quantity is computed by integrating local absorption along the
    beam-tracing trajectory using the plasma dielectric response and the wave dispersion
    relation. Species-resolved channels such as [electron absorbed power](name:electron_absorbed_power_of_beam_tracing_beam),
    [ion absorbed power], and [ion-state absorbed power](name:ion_state_absorbed_power_of_beam_tracing_beam)
    may be evaluated separately and summed to recover the total for the beam.


    Typical values are bounded by 0 W and the power assigned to the traced beam. They
    can be near 0 W for weak damping or missed resonance, and can approach the assigned
    launched or entering power for strongly absorbed paths; in weighted beam-tracing
    calculations this can span roughly 10^0-10^6 W per traced beam depending on launcher
    power and beam subdivision.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_beam_tracing_beam
  - name:electron_absorbed_power_of_beam_tracing_beam
  - name:ion_state_absorbed_power_of_beam_tracing_beam
  arguments:
  - name: power_of_beam_tracing_beam
    operator: absorbed
    operator_kind: qualifier
  sources:
  - id: derived:absorbed_power_of_beam_tracing_beam
    status: composed
- name: ion_state_absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Wave power absorbed by ions of a specified species and charge state
    along a coherent-wave beam-tracing beam path. It is the charge-state-resolved
    contribution to the total ion power absorbed from that beam.
  documentation: 'Ion-state absorbed power of a beam-tracing beam is the net power
    transferred from a coherent wave beam to ions of one specified species and ionization
    (charge) state along the traced beam path. It is the charge-state-resolved share
    of the ion power absorbed from that beam, and summing it over all charge states
    of a species recovers the species-level ion absorption.


    The absorbed power is the integral of the local absorption rate per unit path
    length over the beam representation:


    $$

    P_{i,z} = \int_{\mathcal{C}} \frac{dP_{i,z}}{d\ell} \, d\ell

    $$


    where $\mathcal{C}$ is the traced beam path, $\ell$ is distance along that path
    in meters, and $dP_{i,z}/d\ell$ is the local net power transferred to ion species
    $i$ in charge state $z$ per unit path length, expressed in W/m. The integral runs
    along the beam path used to represent the propagating field, not over the full
    plasma volume; the corresponding volumetric deposition rates per unit plasma volume
    are tracked separately.


    The quantity is evaluated by beam-tracing models, which extend geometrical optics
    to include finite beam-width effects by following a Gaussian wave packet through
    an inhomogeneous plasma. The local transfer follows from the wave field, plasma
    equilibrium, species composition, charge-state populations, and ion distribution
    functions, and may arise from any modeled wave-particle damping mechanism rather
    than only ion-cyclotron resonance. The species and charge state are fixed by the
    associated ion-state identifier.


    Typical per-beam ion-state absorbed power spans a broad range, from near zero
    on weakly damped paths or for trace charge states up to of order the total coupled
    beam power for strongly resonant states; the value is bounded above by the available
    beam power in a passively absorbing plasma.


    Sign convention: Positive when net wave energy is transferred from the beam to
    the specified ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_beam_tracing_beam
  - name:thermal_ion_state_power_density
  - name:fast_ion_state_power_density
  arguments:
  - name: absorbed_power_of_beam_tracing_beam
    operator: ion_state
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/ion/power
    dd_path: waves/coherent_wave/beam_tracing/beam/ion/power
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/ion/state/power
    dd_path: waves/coherent_wave/beam_tracing/beam/ion/state/power
    status: composed
- name: power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Net RF power launched from a single ion cyclotron resonance heating
    (ICRH) antenna into the vacuum vessel, equal to forward power minus reflected
    power at the antenna reference plane.
  documentation: "The power of an ion cyclotron heating antenna is the net RF power\
    \ delivered across the antenna aperture into the vacuum vessel, representing the\
    \ difference between the forward (incident) and reflected traveling-wave powers\
    \ at a defined reference plane on the transmission line. It quantifies how effectively\
    \ the antenna couples RF energy from the generator circuit into the plasma-facing\
    \ side of the antenna structure.\n\nThe net launched power is related to its directional\
    \ components by:\n\n$$\nP_\\mathrm{launched} = P_\\mathrm{forward} - P_\\mathrm{reflected}\n\
    $$\n\nwhere $P_\\mathrm{forward}$ is the [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)\
    \ carried by the incident traveling wave and $P_\\mathrm{reflected}$ is the [reflected\
    \ power](name:reflected_power_of_ion_cyclotron_heating_antenna) carried by the\
    \ backward wave, both evaluated at the same reference plane on the feed line.\n\
    \nThis quantity is measured using directional couplers installed on the coaxial\
    \ or waveguide transmission lines feeding each ICRH antenna port. Coupling efficiency\
    \ depends on plasma edge density, antenna-to-separatrix distance, and operating\
    \ frequency relative to the local ion cyclotron resonance layer.\n\nIndividual\
    \ ICRH antennas on medium-to-large tokamaks typically launch 1\u20135 MW; the\
    \ system-level sum over all antennas is [total_power_of_ion_cyclotron_heating_antenna](name:total_power_of_ion_cyclotron_heating_antenna).\
    \ The analogous per-injector quantity for neutral beam heating is power_of_neutral_beam_injector,\
    \ and the corresponding ECRH quantity is [launched_power_of_electron_cyclotron_launcher](name:launched_power_of_electron_cyclotron_launcher)."
  unit: W
  physics_domain: auxiliary_heating
  links:
