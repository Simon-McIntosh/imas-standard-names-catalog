- name: neutral_temperature
  kind: scalar
  status: active
  description: Translational kinetic temperature, expressed as energy per particle,
    of a neutral population, based on random translational motion after removal of
    bulk flow and averaged over represented charge states when applicable.
  documentation: 'The translational kinetic temperature quantifies the random motion
    of a neutral population after its bulk translational motion has been removed.
    It describes translational kinetic energy and excludes energy associated with
    internal excitation or other internal quantum states.


    For an isotropic translational distribution, the energy-equivalent temperature
    is defined by


    $$

    T_n = \frac{2}{3}\left\langle \frac{1}{2}m_n\left|\mathbf{v}-\mathbf{u}_n\right|^2
    \right\rangle

    $$


    where $T_n$ is the neutral translational temperature, $m_n$ is the mass of a neutral
    particle, $\mathbf{v}$ is its velocity, $\mathbf{u}_n$ is the bulk translational
    velocity of the neutral population, and the angle brackets denote an average over
    the selected particles.


    The quantity applies to the selected neutral population without restricting it
    to cold or energetic particles or to a particular spatial region. When multiple
    charge states are represented, it is the density-weighted mean over all represented
    charge states rather than their sum. The unqualified quantity has no spatial aggregation;
    [volume_averaged_neutral_temperature](name:volume_averaged_neutral_temperature)
    is the corresponding quantity after volume averaging inside the last closed flux
    surface.


    The [cold_neutral_temperature](name:cold_neutral_temperature) and [hot_neutral_temperature](name:hot_neutral_temperature)
    names restrict this common translational-temperature definition to distinct neutral
    populations. In contrast, [neutral_internal_state_temperature](name:neutral_internal_state_temperature)
    restricts the population to a specified internal quantum or excitation state.'
  unit: eV
  physics_domain: transport
  links:
  - name:volume_averaged_neutral_temperature
  - name:cold_neutral_temperature
