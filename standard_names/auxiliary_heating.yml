- name: toroidal_angle_of_antenna_element_center
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the geometric center of an antenna element\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ increases\
    \ counter-clockwise when viewed from above."
  documentation: 'The toroidal angle $\phi$ locates the center of an antenna element
    around the machine axis in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height. This coordinate is essential
    for specifying the toroidal placement of radio-frequency antenna structures, reflectometer
    antennas, and related hardware components with respect to the machine symmetry
    axis. Values span $[0, 2\pi)$ radians for a full toroidal circuit, with sub-elements
    of a multi-element antenna array distributed at discrete $\phi$ offsets around
    this range. The angle is determined from engineering drawings or in-vessel survey
    measurements and is used alongside the corresponding major-radius and vertical-height
    coordinates to fully specify element geometry. For the analogous coordinate of
    diagnostic components, see [toroidal angle of diagnostic component center](name:toroidal_angle_of_diagnostic_component_center);
    for coil conductor elements, see [toroidal angle of conductor element center](name:toroidal_angle_of_conductor_element_center).


    Sign convention: Positive when $\phi$ is in the direction of increasing toroidal
    angle, counter-clockwise when viewed from above the $+\hat{Z}$ axis.'
