name: gyrokinetic_eigenmode_normalized_perturbed_electrostatic_potential_real_part
description: Real part of the normalized perturbed electrostatic potential $\delta
  \hat{\phi}$ for a gyrokinetic eigenmode.
documentation: The real component $\mathrm{Re}(\delta \hat{\phi})$ of the dimensionless
  perturbed electrostatic potential eigenfunction at wavevector $(k_\theta, k_\phi)$.
  Normalization follows $\delta \hat{\phi} = e \delta \phi / T_e$, where $e$ is the
  elementary charge, $\delta \phi$ is the perturbation in V, and $T_e$ the reference
  electron temperature in eV. The real part typically peaks near the outboard midplane
  ($\theta = 0$) for ballooning-parity modes such as the ion-temperature-gradient
  (ITG) instability, while tearing-parity modes exhibit a zero crossing there. Combined
  with the imaginary part, the full eigenmode structure determines the turbulent cross-phase
  driving particle and heat transport. Generated by linear gyrokinetic eigenvalue
  solvers (GS2, GENE, GKW, GYRO) and resolved on the parallel-coordinate grid.
