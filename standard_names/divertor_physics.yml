- name: flux_of_divertor_due_to_recycling
  kind: scalar
  status: active
  description: Rate at which recycling at divertor plasma-facing surfaces returns
    a transported quantity to the plasma, with the channel specified by a more specific
    quantity.
  documentation: 'This quantity is the divertor-local contribution to the recycling
    flux: the rate at which recycling at divertor plasma-facing surfaces returns a
    channel-specific transported amount to the plasma. The channel may be particle
    content, energy, momentum, or another quantity defined by a more specific standard
    name such as [particle flux of divertor due to recycling](name:particle_flux_of_divertor_due_to_recycling).


    For a scalar transported amount $Q$, the divertor recycling rate is defined by


    $$

    \dot{Q}_{\mathrm{div,rec}} = \int_{S_{\mathrm{div}}} \mathbf{j}_{Q,\mathrm{return}}
    \cdot \hat{\mathbf{n}}_{\mathrm{plasma}}\,\mathrm{d}S

    $$


    where $S_{\mathrm{div}}$ is the divertor plasma-facing surface, $\mathbf{j}_{Q,\mathrm{return}}$
    is the returning surface flux of $Q$, and $\hat{\mathbf{n}}_{\mathrm{plasma}}$
    points from the surface toward the plasma. It is the divertor-specific component
    of [flux due to recycling](name:flux_due_to_recycling), and is distinct from a
    total recycling rate summed over all divertor targets.'
  unit: s^-1
  physics_domain: divertor_physics
  links: []
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of helium-3 ions in the plasma immediately adjacent
    to a divertor target, summed over both ionization stages (singly ionized and fully
    stripped) and excluding neutral helium-3 atoms.
  documentation: "Helium-3 density at a divertor target is the local number density\
    \ of ionized helium-3 in the plasma adjacent to a plasma-facing divertor surface.\
    \ It covers both helium-3 ionization stages \u2014 the singly ionized ($\\mathrm{He3}^{1+}$)\
    \ and the fully stripped ($\\mathrm{He3}^{2+}$) \u2014 and excludes neutral helium-3\
    \ atoms. This quantity is a species-resolved instance of the [density_at_divertor_target](name:density_at_divertor_target)\
    \ family, which abstracts over all species present at the target.\n\nThe total\
    \ helium-3 ion density is defined as:\n\n$$\nn_{\\mathrm{He3}} = \\sum_{z=1}^{2}\
    \ n_{\\mathrm{He3}}^{z+}\n$$\n\nwhere $n_{\\mathrm{He3}}^{z+}$ is the local density\
    \ of helium-3 in charge state $z+$ in the plasma layer immediately upstream of\
    \ the electrostatic sheath entrance at the target surface.\n\nThis quantity is\
    \ inferred from spectroscopic measurements of characteristic helium-3 line emission\
    \ combined with local ionization-balance calculations, or from edge-transport\
    \ simulations constrained by particle-balance diagnostics. Helium-3 reaches the\
    \ divertor target following transport through the scrape-off layer, originating\
    \ either from advanced D-He3 fuel-cycle scenarios or from injected tracer gas.\
    \ The helium-4 analog is [helium_4_density_at_divertor_target](name:helium_4_density_at_divertor_target);\
    \ the spatial profile of the same species across the confined plasma is represented\
    \ by [helium_3_density](name:helium_3_density)."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:helium_4_density_at_divertor_target
  - name:helium_3_density
  arguments:
  - name: density_at_divertor_target
    operator: helium_3
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/divertor_target/n_i/helium_3/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-n_i-helium_3-value
    dd_documentation:
