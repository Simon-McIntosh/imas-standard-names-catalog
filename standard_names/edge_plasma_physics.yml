- name: ratio_of_vertical_vorticity_to_major_radius
  kind: scalar
  status: active
  description: Vertical plasma vorticity divided by the local major radius, retaining
    the signed rotation rate about the vertical axis with inverse-length scaling.
  documentation: 'This quantity is the major-radius-scaled form of [vertical vorticity](name:vertical_vorticity),
    measuring local bulk-plasma rotation about the vertical direction per unit major
    radius. It is defined in the right-handed cylindrical $(R,\phi,Z)$ frame.


    $$

    \omega_Z^*(R,\phi,Z)=\frac{\omega_Z(R,\phi,Z)}{R},\qquad \omega_Z=(\nabla\times\mathbf{v})\cdot\hat{\mathbf{Z}}

    $$


    where $R$ is major radius measured from the toroidal symmetry axis, $\phi$ is
    toroidal angle, $Z$ is vertical height, $\mathbf{v}$ is the plasma bulk-velocity
    vector, $\nabla$ is the spatial gradient, and $\hat{\mathbf{Z}}$ is the vertical
    unit vector. The scaling applies to the vertical-vorticity component itself and
    does not represent the full [vorticity](name:vorticity) vector.


    Sign convention: Positive when the bulk-flow rotation is in the $+Z$ sense, namely
    counterclockwise in the $(R,\phi)$ plane when viewed from $+Z$.'
  unit: m^-1.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_vorticity
  - name:vorticity
  arguments:
  - name: vertical_vorticity
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: major_radius
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - dd_path: edge_profiles/ggd/vorticity_over_r/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_profiles.html#edge_profiles-ggd-vorticity_over_r-z
