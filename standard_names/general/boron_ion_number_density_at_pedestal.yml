name: boron_ion_number_density_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Number density of ionized boron (summed over all charge states) evaluated
  at the pedestal top in H-mode plasmas.
documentation: "The boron ion number density $n_{\\rm B} = \\sum_{q=1}^{5} n_{\\rm\
  \ B^{q+}}$ at the pedestal top accounts for all ionization stages of boron present\
  \ in the confined plasma edge. Boron is a common low-$Z$ impurity in devices with\
  \ boronized walls, where it replaces higher-$Z$ impurities like carbon and oxygen.\
  \ Pedestal boron densities are typically $10^{16}$\u2013$10^{18}\\;\\mathrm{m^{-3}}$;\
  \ even at these levels boron contributes to fuel dilution and modifies $Z_{\\rm\
  \ eff}$, influencing bootstrap current and pedestal stability. The quantity is measured\
  \ by charge-exchange recombination spectroscopy (CXRS) on B$^{5+}$ emission lines\
  \ combined with ionization balance modeling. See also `boron_ion_number_density`\
  \ for the radial profile quantity and `effective_charge_at_pedestal` for the related\
  \ impurity metric."
