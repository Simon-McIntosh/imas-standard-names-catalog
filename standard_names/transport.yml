- name: parallel_plasma_electrical_conductivity
  kind: scalar
  status: draft
  description: Magnetic-field-aligned electrical conductance of the plasma, relating
    parallel current density to the electric field through collisional electron momentum
    transport.
  documentation: 'Parallel plasma electrical conductivity is the magnetic-field-aligned
    component of the plasma conductivity tensor. It is the coefficient that converts
    a parallel electric field into [parallel plasma current density](name:parallel_plasma_current_density),
    and it is the plasma-specific form of [parallel electrical conductivity](name:parallel_plasma_electrical_conductivity).
    It is the relevant component of [plasma electrical conductivity] for resistive
    current diffusion along field lines.


    The defining local Ohm-law relation is


    $$

    j_{\parallel} = \sigma_{\parallel} E_{\parallel}

    $$


    where $j_{\parallel}$ is the current density along the magnetic field in A m$^{-2}$,
    $E_{\parallel}$ is the electric field projected along the magnetic field in V
    m$^{-1}$, and $\sigma_{\parallel}$ is the parallel plasma electrical conductivity
    in ohm$^{-1}$ m$^{-1}$.


    In transport analysis, this quantity is computed from collisional or neoclassical
    conductivity models and constrained by current diffusion, loop-voltage evolution,
    and magnetic equilibrium information. It depends mainly on [electron temperature](name:electron_temperature),
    effective charge through electron-ion collisions, and collisionality, with hotter
    and cleaner plasmas having larger conductivity.


    Typical core tokamak values range from about 10^6-10^8 ohm$^{-1}$ m$^{-1}$, while
    colder edge and scrape-off-layer plasmas can fall to about 10^3-10^5 ohm$^{-1}$
    m$^{-1}$. Low conductivity increases [plasma resistance](name:plasma_resistance)
    and enhances ohmic dissipation for a given [parallel plasma current].'
  unit: m^-1.ohm^-1
  physics_domain: transport
  links:
  - name:parallel_plasma_current_density
  - name:electron_temperature
  - name:plasma_resistance
  arguments:
  - name: plasma_electrical_conductivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/conductivity_parallel
    dd_path: core_profiles/profiles_1d/conductivity_parallel
    status: composed
- name: perpendicular_fast_electron_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure carried by suprathermal electrons in velocity components
    perpendicular to the local magnetic field, excluding the bulk thermal electron
    contribution.
  documentation: 'Perpendicular fast electron pressure is the gyrotropic pressure-tensor
    component associated with suprathermal electron motion transverse to the local
    magnetic field. It distinguishes magnetic-moment or cyclotron-motion energy from
    field-aligned kinetic energy and is paired with [parallel_fast_electron_pressure](name:parallel_fast_electron_pressure)
    as the anisotropic components of [fast_electron_pressure]. It is related to [fast_electron_density](name:fast_electron_density)
    through the velocity-space moment of the nonthermal electron distribution, not
    through a Maxwellian temperature assumption.


    For a gyrotropic fast electron distribution, the perpendicular pressure is the
    second velocity moment


    $$

    p_{\perp,fe} = \int \frac{m_e v_\perp^2}{2} f_{fe}(\mathbf{v}) \, d^3v

    $$


    where $p_{\perp,fe}$ is the perpendicular fast electron pressure, $m_e$ is the
    electron mass, $v_\perp$ is particle speed perpendicular to the magnetic field,
    and $f_{fe}(\mathbf{v})$ is the fast electron velocity distribution normalized
    so that its velocity integral gives the fast electron number density.


    This quantity is inferred by combining kinetic distribution modeling with diagnostics
    sensitive to suprathermal electrons, such as hard X-ray bremsstrahlung, electron
    cyclotron emission from nonthermal tails, synchrotron emission, and measurements
    of RF-driven current or wave absorption. Values depend strongly on heating and
    current-drive scenario; in present tokamak plasmas they can range from negligible
    levels to tens or hundreds of pascals, and in strongly driven nonthermal populations
    may become a significant fraction of the bulk electron pressure. The analogous
    ion quantity [perpendicular_fast_ion_pressure](name:perpendicular_fast_ion_pressure)
    is governed by the same pressure-tensor decomposition but by ion-orbit and slowing-down
    physics.


    Sign convention: Positive when the perpendicular kinetic energy density of the
    fast electron population is positive.'
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_fast_electron_pressure
  - name:fast_electron_density
  - name:perpendicular_fast_ion_pressure
  arguments:
  - name: fast_electron_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/pressure_fast_perpendicular
    dd_path: core_profiles/profiles_1d/electrons/pressure_fast_perpendicular
    status: composed
- name: perpendicular_fast_ion_pressure
  kind: scalar
  status: draft
  description: Nonthermal fast-ion kinetic pressure associated with gyromotion and
    random motion perpendicular to the local magnetic field.
  documentation: "Perpendicular fast-ion pressure is the part of the energetic-ion\
    \ pressure tensor carried by particle velocity components orthogonal to the local\
    \ magnetic field. Together with [parallel fast-ion pressure](name:parallel_fast_ion_pressure),\
    \ it describes pressure anisotropy within the parent [fast ion pressure](name:fast_ion_pressure)\
    \ and affects equilibrium force balance, Alfv\xE9nic stability, and energetic-particle\
    \ transport.\n\nFor a fast-ion distribution function, the perpendicular pressure\
    \ is the second velocity-space moment transverse to the magnetic-field direction:\n\
    \n$$\np_{f\\perp} = \\sum_i \\int \\frac{m_i v_\\perp^2}{2} f_{f,i}(\\mathbf{x},\\\
    mathbf{v})\\,d^3v\n$$\n\nwhere $p_{f\\perp}$ is the perpendicular fast-ion pressure\
    \ in Pa, $m_i$ is ion mass in kg, $v_\\perp$ is particle speed perpendicular to\
    \ the local magnetic field in m/s, and $f_{f,i}$ is the fast-ion velocity distribution\
    \ for ion species or charge state $i$. The related [fast ion density](name:fast_ion_density)\
    \ is the zeroth moment of the same distribution.\n\nThis quantity is computed\
    \ from kinetic fast-ion models or inferred by combining equilibrium constraints\
    \ with diagnostics sensitive to energetic ions, such as neutron emission, fast-ion\
    \ D-alpha spectroscopy, neutral particle analysis, gamma-ray measurements, and\
    \ collective Thomson scattering. It is also compared with [perpendicular fast-electron\
    \ pressure](name:perpendicular_fast_electron_pressure) when assessing nonthermal\
    \ pressure anisotropy across species.\n\nRepresentative values range from about\
    \ 10^2-10^4 Pa in neutral-beam-heated tokamak cores and can reach several 10^4\
    \ Pa in strongly heated or alpha-particle-dominated plasmas; values near the plasma\
    \ edge are usually far smaller because energetic-ion confinement weakens.\n\n\
    Sign convention: Positive when the fast-ion perpendicular stress is compressive\
    \ in directions orthogonal to the local magnetic field."
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_fast_ion_pressure
  - name:fast_ion_pressure
  - name:fast_ion_density
  - name:perpendicular_fast_electron_pressure
  arguments:
  - name: fast_ion_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/pressure_fast_perpendicular
    dd_path: core_profiles/profiles_1d/ion/pressure_fast_perpendicular
    status: composed
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    dd_path: core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    status: composed
- name: perpendicular_fast_ion_state_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure from charge-state-resolved energetic ions associated
    with random velocity components across the local magnetic field.
  documentation: 'This quantity is the perpendicular component of the gyrotropic pressure
    tensor for a fast-ion charge-state bundle. It represents the momentum flux carried
    by suprathermal ions in the two velocity-space directions transverse to the local
    magnetic field, complementing [parallel fast ion state pressure](name:parallel_fast_ion_state_pressure)
    within [fast ion state pressure].


    For a fast-ion distribution in charge state $q$, the perpendicular pressure is
    the second velocity moment averaged over the two perpendicular degrees of freedom:


    $$

    p_{\perp,f,q} = \frac{m_i}{2}\int v_\perp^2 f_{f,q}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $p_{\perp,f,q}$ is the perpendicular fast-ion state pressure, $m_i$ is the
    ion mass, $v_\perp$ is the particle speed perpendicular to the local magnetic
    field, $f_{f,q}$ is the fast-ion distribution for charge state $q$, and $d^3v$
    is the velocity-space volume element. Summing this quantity over resolved charge
    states gives the charge-state-summed [perpendicular fast ion pressure](name:perpendicular_fast_ion_pressure),
    while comparison with the parallel component measures pressure anisotropy.


    It is inferred from energetic-particle distribution modeling constrained by diagnostics
    such as neutron emission, gamma-ray spectroscopy, fast-ion D-alpha spectroscopy,
    neutral-particle analysis, collective Thomson scattering, and charge-exchange
    measurements. Charge-state resolution is obtained from ionization balance and
    charge-exchange modeling coupled to the fast-ion distribution.


    Representative core values range from about 10^2-10^5 Pa in neutral-beam or radio-frequency
    heated plasmas, with smaller values near the edge and larger values possible in
    burning-plasma alpha-particle populations. The pressure scales with [fast ion
    state density](name:fast_ion_state_density) and with the perpendicular energy
    content of the nonthermal distribution.


    Sign convention: Positive when the perpendicular second velocity moment represents
    compressive fast-ion momentum flux across the local magnetic field.'
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_fast_ion_state_pressure
  - name:perpendicular_fast_ion_pressure
  - name:fast_ion_state_density
  arguments:
  - name: fast_ion_state_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    dd_path: core_profiles/profiles_1d/ion/state/pressure_fast_perpendicular
    status: composed
- name: plasma_electrical_conductivity
  kind: vector
  status: draft
  description: Transport coefficient relating electric field to conductive current
    flow in a collisional, magnetized plasma.
  documentation: 'Plasma electrical conductivity is the effective transport coefficient
    that connects the electric field to conductive current carried mainly by electrons
    in a magnetized plasma. Because collisions and magnetic-field geometry make the
    response anisotropic, the [parallel component](name:parallel_plasma_electrical_conductivity)
    is often the dominant part and is closely related to the more general [electrical
    conductivity](name:electrical_conductivity).


    The local Ohmic response is expressed as


    $$

    \mathbf{j} = \boldsymbol{\sigma} \cdot \mathbf{E}

    $$


    where $\mathbf{j}$ is the [plasma current density](name:plasma_current_density)
    in A m$^{-2}$, $\mathbf{E}$ is the [electric field](name:electric_field) in V
    m$^{-1}$, and $\boldsymbol{\sigma}$ is the conductivity in ohm$^{-1}$ m$^{-1}$.
    In collisional theory, the magnitude is controlled primarily by electron-ion collision
    frequency, so it increases strongly with [electron temperature](name:electron_temperature)
    and depends on [electron density](name:electron_density), ion charge state, and
    [normalized electron collisionality](name:normalized_electron_collisionality).


    It is inferred from current diffusion analysis, loop-voltage response, equilibrium-constrained
    current-density reconstruction, or calculated from neoclassical and Spitzer-like
    transport models. Representative values range from about $10^4$-$10^6$ ohm$^{-1}$
    m$^{-1}$ in cool edge plasmas to $10^7$-$10^9$ ohm$^{-1}$ m$^{-1}$ in hot tokamak
    cores.'
  unit: m^-1.ohm^-1
  physics_domain: transport
  links:
  - name:parallel_plasma_electrical_conductivity
  - name:electrical_conductivity
  - name:plasma_current_density
  - name:electric_field
  - name:electron_temperature
  - name:electron_density
  - name:normalized_electron_collisionality
  sources:
  - id: dd:core_profiles/profiles_1d/conductivity_parallel
    dd_path: core_profiles/profiles_1d/conductivity_parallel
    status: composed
- name: poloidal_electric_field
  kind: scalar
  status: draft
  description: Projection of the electromagnetic force per unit charge onto the poloidal
    direction around magnetic flux surfaces.
  documentation: 'The poloidal electric field is the component of the plasma [electric
    field](name:electric_field) tangent to the poloidal circuit of a magnetic flux
    surface. It differs from the [radial electric field](name:radial_electric_field),
    which points across flux surfaces, and from the [toroidal electric field](name:toroidal_electric_field),
    which is associated with toroidal induction and loop voltage.


    For a local flux-coordinate basis $(\psi,\theta,\phi)$, with $\theta$ the poloidal
    angle and $\hat{e}_\theta$ the unit vector in the increasing-$\theta$ direction,
    the component is defined by


    $$

    E_\theta = \mathbf{E} \cdot \hat{e}_\theta

    $$


    where $\mathbf{E}$ is the electric-field vector and $E_\theta$ is its poloidal
    projection. In electrostatic descriptions this component is related to the poloidal
    variation of the potential, while in transient plasmas inductive contributions
    from the time-varying vector potential may also contribute.


    It is computed from electric-potential reconstructions, electromagnetic transport
    models, or constrained by measurements sensitive to flows and force balance. Direct
    measurement is difficult; charge-exchange spectroscopy, Doppler reflectometry,
    and comparisons with [poloidal electron velocity](name:poloidal_electron_velocity)
    can help constrain the associated drift physics.


    Representative magnitudes range from a few V m$^{-1}$ in slowly evolving core
    regions to $10^2$-$10^4$ V m$^{-1}$ near edges, transport barriers, or rapid MHD
    activity. The [parallel electric field](name:parallel_electric_field) is often
    treated separately because it controls field-aligned acceleration and Ohmic current
    drive.


    Sign convention: Positive when the electric-field projection points in the direction
    of increasing poloidal angle $\theta$ in flux coordinates $(\psi,\theta,\phi)$.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:radial_electric_field
  - name:toroidal_electric_field
  - name:poloidal_electron_velocity
  - name:parallel_electric_field
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/poloidal
    dd_path: core_profiles/profiles_1d/e_field/poloidal
    status: composed
- name: poloidal_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk electron fluid flow onto the poloidal direction
    around nested magnetic flux surfaces.
  documentation: 'Poloidal electron velocity is the component of the bulk electron
    fluid velocity tangent to the poloidal circuit of a magnetic flux surface. It
    distinguishes motion around the short way of the torus from toroidal rotation
    and radial transport, and is one component of the full [electron velocity](name:electron_velocity).
    It is interpreted together with [radial electron velocity](name:radial_electron_velocity),
    [toroidal electron velocity](name:toroidal_electron_velocity), and [parallel electron
    velocity](name:parallel_electron_velocity) to separate cross-field flow, field-aligned
    flow, and rotation.


    For a flux-coordinate description $(\rho, \theta, \phi)$, where $\rho$ labels
    flux surfaces, $\theta$ is the poloidal angle, and $\phi$ is the toroidal angle,
    the component is the projection of the electron fluid velocity onto the poloidal
    unit direction:


    $$

    v_{e\theta} = \mathbf{v}_e \cdot \hat{e}_\theta

    $$


    where $\mathbf{v}_e$ is the electron fluid velocity, $\hat{e}_\theta$ is the unit
    vector in the direction of increasing poloidal angle, and $v_{e\theta}$ is in
    m s$^{-1}$.


    Direct measurement of electron poloidal flow is difficult; it is commonly inferred
    from momentum balance, neoclassical transport calculations, radial force balance,
    and consistency with measured [electron density](name:electron_density), [electron
    temperature](name:electron_temperature), and electric-field information such as
    [poloidal electric field](name:poloidal_electric_field). In magnetized tokamak
    plasmas, values are often smaller than toroidal rotation, with core magnitudes
    from a few hundred to several thousand m s$^{-1}$ and edge or pedestal values
    reaching several km s$^{-1}$ depending on collisionality and radial electric-field
    shear.


    Sign convention: Positive when the electron fluid velocity has a component in
    the direction of increasing poloidal angle $\theta$ in the chosen flux-coordinate
    system $(\rho, \theta, \phi)$.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:radial_electron_velocity
  - name:toroidal_electron_velocity
  - name:parallel_electron_velocity
  - name:electron_density
  - name:electron_temperature
  - name:poloidal_electric_field
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
