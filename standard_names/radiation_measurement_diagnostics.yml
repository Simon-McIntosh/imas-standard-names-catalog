- name: vertical_angular_width_of_camera
  kind: scalar
  status: active
  description: "Angular extent of a camera\u2019s imaging coverage along the vertical\
    \ Z direction of the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "Vertical angular width is the total angular span covered by a camera\u2019\
    s imaging region in the detector plane along the physical vertical direction.\
    \ It is a non-negative field-of-view quantity, independent of the signs of the\
    \ individual viewing angles.\n\nThe width is defined by the difference between\
    \ the largest and smallest covered vertical viewing angles:\n\n$$\n\\Delta\\theta_{\\\
    mathrm{vert}} = \\theta_{\\mathrm{vert,max}} - \\theta_{\\mathrm{vert,min}}\n\
    $$\n\nwhere $\\Delta\\theta_{\\mathrm{vert}}$ is the vertical angular width and\
    \ $\\theta_{\\mathrm{vert,max}}$ and $\\theta_{\\mathrm{vert,min}}$ are the upper\
    \ and lower signed vertical viewing-angle limits, expressed in radians. The vertical\
    \ direction is $+Z$ in the right-handed cylindrical $(R,\\phi,Z)$ frame, where\
    \ $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height.\n\
    \nThis full-span quantity is distinct from the signed [vertical angle of a detector\
    \ pixel](name:vertical_angle_of_detector_pixel). Its directional counterpart is\
    \ the [toroidal angular width of a camera](name:toroidal_angular_width_of_camera)."
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_angle_of_detector_pixel
  - name:toroidal_angular_width_of_camera
  sources:
