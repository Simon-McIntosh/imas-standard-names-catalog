name: volume_averaged_carbon_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of carbon ions (all charge states),
  quantifying carbon impurity concentration.
documentation: "The volume-averaged carbon ion number density $\\langle n_{\\mathrm{C}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{C}}(\\mathbf{r})\\, dV$ where $V$ is the\
  \ total plasma volume in m$^3$ and $n_{\\mathrm{C}}$ is the local carbon ion density\
  \ in m$^{-3}$ summed over charge states $\\mathrm{C}^{1+}$ through $\\mathrm{C}^{6+}$.\
  \ Carbon is the dominant intrinsic impurity in machines with graphite plasma-facing\
  \ components; typical volume-averaged values range from $10^{16}$ to $10^{18}$ m$^{-3}$\
  \ (0.5\u20135% of $n_e$ in carbon-wall tokamaks such as JET-C or DIII-D). CXRS on\
  \ the C$^{6+}$ line (529.1 nm, n = 8\u21927) is the standard diagnostic, complemented\
  \ by VUV spectroscopy for lower charge states. Carbon strongly influences the effective\
  \ charge via $\\Delta Z_{\\mathrm{eff}} = n_{\\mathrm{C}} Z_{\\mathrm{C}}^2 / n_e$\
  \ and radiative cooling through line radiation. See also `volume_averaged_boron_ion_number_density`\
  \ and `electron_number_density`."
