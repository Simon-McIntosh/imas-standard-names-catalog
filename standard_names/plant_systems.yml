    dd_path: summary/gas_injection_prefill/ammonia/value
    status: composed
- name: atomic_count_of_pellet
  kind: scalar
  status: draft
  description: Total number of individual atoms in a pellet, with each atom counted
    once regardless of whether the propellant material is monatomic, diatomic, or
    molecular in form.
  documentation: "The atomic count of a pellet is the total discrete number of atoms\
    \ present throughout the entire pellet body, tallied individually without regard\
    \ to the molecular or bonding state of the constituent propellant material. A\
    \ diatomic fuel such as D$_2$ (frozen deuterium) contributes two atoms per molecule;\
    \ monatomic species contribute one atom per particle. This whole-pellet total\
    \ differs from spatially resolved counterparts such as [outer_atomic_count_of_pellet](name:outer_atomic_count_of_pellet),\
    \ and extends the general atom-counting convention of [count_of_pellet](name:count_of_pellet).\n\
    \nThe atomic count $N_\\mathrm{at}$ relates to the number of propellant molecules\
    \ $N_\\mathrm{mol}$ by:\n\n$$\nN_\\mathrm{at} = \\nu \\, N_\\mathrm{mol}\n$$\n\
    \nwhere $\\nu$ is the number of atoms per molecule of the propellant species (for\
    \ example, $\\nu = 2$ for D$_2$ or DT, and $\\nu = 1$ for a monatomic noble gas).\n\
    \nThe count is determined from the pellet geometry combined with the atomic number\
    \ density of the solid propellant at cryogenic storage temperature, or from pellet\
    \ mass measured immediately before injection. Fueling and disruption-mitigation\
    \ pellets for large tokamaks contain on the order of $10^{21}$\u2013$10^{23}$\
    \ atoms. The [normalized_atomic_count_of_pellet](name:normalized_atomic_count_of_pellet)\
    \ expresses this total scaled against a reference count for nondimensional comparison\
    \ across pellet types or injection scenarios."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:outer_atomic_count_of_pellet
  - name:count_of_pellet
  - name:normalized_atomic_count_of_pellet
- name: core_density_of_pellet
  kind: scalar
  status: draft
  description: Number density of a constituent atomic species in the inner core layer
    of a pellet used by a shattered-pellet injector.
  documentation: 'Core density of pellet is the number density of a specified atomic
    species within the pellet''s inner core layer. It represents how many atoms of
    that species are present per unit volume of the core material and is non-negative
    by physical definition.


    The density is defined by the species population in the core divided by the core
    volume:


    $$

    n_{s,\mathrm{core}} = \frac{N_{s,\mathrm{core}}}{V_\mathrm{core}}

    $$


    where $n_{s,\mathrm{core}}$ is the core species number density in m$^{-3}$, $N_{s,\mathrm{core}}$
    is the number of atoms of species $s$ in the core and is dimensionless, and $V_\mathrm{core}$
    is the core volume in m$^3$.


    In practice this quantity is obtained from the specified pellet composition and
    core geometry, or equivalently from the total core species inventory normalized
    by the core volume. It is species-resolved: different atomic constituents of the
    same core can have different values.


    No device-independent typical numerical range is implied by the standard name
    alone; values depend on the chosen pellet material, mixture, and core volume.'
  unit: m^-3
  physics_domain: plant_systems
  links:
  - name:density_of_pellet
  - name:core_atomic_count_of_pellet
  - name:outer_atomic_count_of_pellet
  sources:
  - id: dd:spi/injector/pellet/core/species/density
    dd_path: spi/injector/pellet/core/species/density
    status: composed
- name: deuterium_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of deuterium atoms delivered by gas injection after
    plasma breakdown, expressed as equivalent electrons. Each deuterium atom contributes
    one count; deuterium introduced during the prefill phase is excluded.
  documentation: 'Deuterium count due to gas injection is the accumulated amount of
    deuterium delivered by gas puffing or valve injection after plasma breakdown.
    It is expressed as an equivalent-electron particle count: because deuterium has
    atomic number one, each injected neutral deuterium atom contributes one count.
    Deuterium supplied before breakdown belongs to [deuterium_prefill_count](name:deuterium_prefill_count)
    rather than this quantity.


    The accumulated count is the time integral of the deuterium injection source rate
    from the breakdown time to the time of interest:


    $$

    N_D^\mathrm{inj}(t) = \int_{t_\mathrm{bd}}^{t} \dot{N}_D^\mathrm{inj}(t'') \,
    dt''

    $$


    where $N_D^\mathrm{inj}$ is the accumulated deuterium equivalent-electron count
    with unit $1$, $t_\mathrm{bd}$ is the plasma breakdown time in s, $t$ and $t''$
    are times in s, and $\dot{N}_D^\mathrm{inj}$ is the [deuterium source rate due
    to injection](name:deuterium_source_rate_due_to_injection) in atoms/s, equivalently
    counts/s for deuterium.


    In practice, the count is computed by integrating calibrated deuterium gas flow
    rates from injection valves, gas lines, or plenum pressure changes, with corrections
    for gas temperature, isotopic purity, valve calibration, and molecular composition
    when relevant. Contributions from all deuterium injection paths are summed, while
    prefill inventory and non-gas fueling sources are kept separate.


    Typical accumulated values are dimensionless counts of about $10^{20}$-$10^{23}$
    for short or medium tokamak pulses, and can reach $10^{24}$-$10^{25}$ in large-device
    or long-pulse operation depending on fueling demand, plasma density, and discharge
    duration.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_due_to_gas_injection
  - name:deuterium_source_rate_due_to_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:accumulated_helium_3_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/deuterium/value
    dd_path: summary/gas_injection_accumulated/deuterium/value
    status: composed
- name: deuterium_prefill_count
  kind: scalar
  status: draft
  description: Accumulated deuterium introduced by gas injection during the plasma
    prefill phase, expressed as an equivalent-electron count. Because deuterium has
    atomic charge Z = 1, each deuterium atom contributes one count; deuterium from
    wall recycling, neutral beams, pellets, or later fueling is excluded.
  documentation: 'Deuterium prefill count is the accumulated amount of deuterium introduced
    as neutral gas before plasma breakdown, expressed as the number of electrons that
    would be supplied by complete ionization. For deuterium, the atomic charge is
    $Z_D = 1$, so the equivalent-electron count is numerically equal to the number
    of injected deuterium atoms. The quantity is limited to the prefill gas-injection
    phase and excludes deuterium supplied later by fueling, wall recycling, pellets,
    or neutral beam injection.


    The accumulated count is obtained by integrating the injected atomic deuterium
    rate over the prefill interval:


    $$

    N_{D,\mathrm{prefill}} = \int_{t_\mathrm{start}}^{t_\mathrm{end}} Z_D\,\dot{N}_D(t)\,dt

    $$


    where $N_{D,\mathrm{prefill}}$ is the deuterium prefill count, $Z_D = 1$ is the
    deuterium atomic charge, $\dot{N}_D(t)$ is the atomic deuterium injection rate
    in atoms s$^{-1}$, and $t_\mathrm{start}$ and $t_\mathrm{end}$ are the start and
    end times of the prefill interval in s. If the measured gas throughput is a molecular
    $D_2$ rate, the corresponding atomic rate is twice the molecular rate.


    In practice this quantity is computed from calibrated gas-valve commands, mass-flow
    measurements, pressure-drop calibrations, or reservoir inventory changes, with
    corrections for line volume, gas temperature, valve conductance, and species purity
    when needed. It represents the requested or delivered neutral-gas inventory before
    breakdown, not the amount that remains confined after ionization.


    Typical prefill inventories are about $10^{20}-10^{23}$ equivalent-electron counts
    in small and medium tokamaks, and may approach $10^{24}$ in large devices or high-pressure
    prefill scenarios.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:tritium_prefill_count
  - name:accumulated_hydrogen_prefill_count
  - name:accumulated_xenon_prefill_count
  - name:deuterium_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/deuterium/value
    dd_path: summary/gas_injection_prefill/deuterium/value
    status: composed
- name: electron_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous electron-equivalent source rate supplied by plasma injection
    systems. It is the sum over injected atomic species of nuclear charge number times
    the atomic injection rate, representing the electron inventory that the injected
    material can contribute after ionization.
  documentation: 'Electron source rate due to injection is the electron-equivalent
    particle rate delivered to the plasma or vessel by fueling or material injection
    systems. It counts the number of electrons per second associated with the injected
    atoms after ionization, and is used for particle inventory and density-control
    accounting rather than as a local ionization-rate density.


    For a mixture of injected atomic species, the rate is defined by


    $$

    \dot{N}_{e,\mathrm{inj}} = \sum_s Z_s\,\dot{N}_{s,\mathrm{inj}}

    $$


    where $\dot{N}_{e,\mathrm{inj}}$ is the electron-equivalent injection rate, $s$
    indexes the injected atomic species, $Z_s$ is the nuclear charge number of species
    $s$, and $\dot{N}_{s,\mathrm{inj}}$ is its atomic injection rate. Molecular flows
    are converted to atomic rates before applying the sum; for example, each injected
    $\mathrm{D}_2$ molecule contributes two deuterium atoms and therefore two electron
    equivalents after complete ionization.


    In practice this quantity is computed from calibrated gas-valve throughput, pellet
    or compact-toroid particle content, or other injector flow measurements combined
    with the specified species composition. It may represent a single injector, a
    subsystem, or the total injected electron-equivalent rate, depending on the physical
    scope being described.


    Typical values span about $10^{19}$-$10^{23}$ s$^{-1}$ for ordinary gas fueling
    valves in present-day tokamaks. Short high-throughput events such as massive gas
    injection or pellet injection can reach about $10^{22}$-$10^{25}$ s$^{-1}$ for
    brief intervals.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:krypton_source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:accumulated_argon_count
  sources:
