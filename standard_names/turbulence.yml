- name: normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: active
  description: Normalized perturbed pressure Bessel-1 is the dimensionless total pressure
    response of a perturbed gyrocenter distribution in a linear gyrokinetic eigenmode,
    formed from parallel and perpendicular pressure moments weighted by the first-order
    Bessel function evaluated on the gyroaveraging argument and normalized to the
    equilibrium species pressure.
  documentation: 'Normalized perturbed pressure Bessel-1 is the dimensionless total
    pressure response of a perturbed gyrocenter distribution in a linear gyrokinetic
    eigenmode, formed from parallel and perpendicular pressure moments weighted by
    the first-order Bessel function evaluated on the gyroaveraging argument and normalized
    to the equilibrium species pressure. It is a species-resolved complex amplitude
    representing the finite-Larmor-radius part of the gyrocenter pressure response.


    For species $s$, it is defined by the sum of the first-order Bessel-weighted parallel
    and perpendicular pressure moments divided by the equilibrium species pressure:


    $$

    \widehat{P}^{(J_1)}_s = \frac{P_{\parallel s}^{(J_1)} + P_{\perp s}^{(J_1)}}{p_s},
    \qquad P_{\parallel s}^{(J_1)} = \int d^3v\, m_s v_\parallel^2 J_1(\lambda_s)\widetilde{F}_{g,s},
    \qquad P_{\perp s}^{(J_1)} = \int d^3v\, m_s \frac{v_\perp^2}{2} J_1(\lambda_s)\widetilde{F}_{g,s}

    $$


    where $P_{\parallel s}^{(J_1)}$ and $P_{\perp s}^{(J_1)}$ are pressure-moment
    amplitudes with pressure units, $p_s=n_sT_s$ is the equilibrium species pressure
    when $T_s$ is expressed as energy per particle, $m_s$ is the species mass, $v_\parallel$
    and $v_\perp$ are velocities parallel and perpendicular to the equilibrium magnetic
    field, $d^3v$ is the velocity-space volume element, and $\widetilde{F}_{g,s}$
    is the perturbation amplitude of the gyrocenter distribution. The first-order
    Bessel function $J_1$ is evaluated on the gyroaveraging argument $\lambda_s=k_\perp
    v_\perp/\Omega_s$, with $k_\perp$ the magnitude of the wave vector perpendicular
    to the equilibrium magnetic field and $\Omega_s=|q_s|B/m_s$ the positive cyclotron-frequency
    magnitude.


    The total moment is the sum of parallel_normalized_perturbed_pressure_bessel_1
    and [perpendicular_normalized_perturbed_pressure_bessel_1](name:perpendicular_normalized_perturbed_pressure_bessel_1).
    It is a gyrocenter-distribution moment with explicit $J_1(\lambda_s)$ weighting;
    it is distinct from [normalized_gyrocenter_perturbed_pressure](name:normalized_gyrocenter_perturbed_pressure),
    which lacks this Bessel-1 weighting, and from particle-distribution pressure perturbations
    such as [normalized_perturbed_pressure](name:normalized_perturbed_pressure) and
    [normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode](name:normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode).
    Because $J_1(0)=0$, this member vanishes at zero gyroaveraging argument.


    In a linear eigenmode, $\widetilde{F}_{g,s}$ is the complex coefficient multiplying
    the chosen harmonic phase factor. This moment inherits the same arbitrary global
    amplitude and phase normalization as the eigenmode; changing the reference phase
    multiplies all perturbation amplitudes by the same complex factor, so its sign
    and phase are defined only relative to that reference.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_perturbed_pressure_bessel_1
  - name:normalized_gyrocenter_perturbed_pressure
  - name:normalized_perturbed_pressure
  - name:normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode
  arguments:
  - name: normalized_perturbed_pressure
    operator: bessel_1
    operator_kind: unary_postfix
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-moments_norm_gyrocenter_bessel_1-pressure
    dd_documentation:
      leaf: Normalised pressure, defined as the sum of pressure_parallel and pressure_perpendicular
      parent_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1
