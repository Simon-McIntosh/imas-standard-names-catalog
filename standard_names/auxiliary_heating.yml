- name: per_toroidal_mode_of_thermal_electron_wave_absorbed_power
  kind: scalar
  status: draft
  description: Wave power absorbed by the thermal electron population from a coherent
    wave, resolved per toroidal mode number $n_\phi$ and integrated over the total
    plasma volume.
  documentation: 'The per-toroidal-mode thermal electron absorbed wave power quantifies
    how much power from a coherent wave (e.g., ECRH or LH waves) is transferred to
    the bulk (thermal) electron population for each discrete toroidal mode number
    $n_\phi$. The total thermal electron absorbed power is recovered by summing over
    all toroidal mode numbers: $P_{\rm th,e} = \sum_{n_\phi} P_{\rm th,e}(n_\phi)$,
    where $P_{\rm th,e}(n_\phi)$ is the contribution from mode $n_\phi$. This mode-resolved
    decomposition is essential for understanding the spectral selectivity of wave
    heating and for diagnosing which toroidal mode components drive the dominant energy
    transfer to thermal electrons. Typical values depend strongly on the launched
    wave spectrum, plasma density, and temperature, but relevant ranges for ECRH scenarios
    in present-day tokamaks span from a few kilowatts to several megawatts per dominant
    mode. The quantity is computed by wave-tracing or full-wave codes that resolve
    the toroidal spectrum of the wave field. It is the thermal-electron analog of
    [per-toroidal-mode fast electron absorbed power](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power)
    and the thermal-ion analog [per_toroidal_mode_of_thermal_ion_wave_absorbed_power](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power).
    The flux-surface-cumulative version of this quantity is available as [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface),
    and the volume-density form without mode resolution is [thermal_electron_wave_absorbed_power_density](name:thermal_electron_wave_absorbed_power_density).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power
  - name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power
  - name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface
  - name:thermal_electron_wave_absorbed_power_density
  constraints: []
  sources:
