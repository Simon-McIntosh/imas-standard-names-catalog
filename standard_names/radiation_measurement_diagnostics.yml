- name: vertical_coordinate_of_soft_xray_detector
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the geometric center of a soft X-ray detector\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Vertical Z coordinate of the geometric center of a soft X-ray detector
    is the height coordinate of that detector center in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. The origin of $Z$ is the machine midplane, so $Z=0$ lies
    on that midplane.


    Together with the corresponding major-radius and toroidal-angle coordinates, this
    quantity specifies the absolute geometric position of the detector center. It
    is distinct from a detector-pixel coordinate, an aperture position, a line-of-sight
    direction, and any measured soft-X-ray signal.


    Sign convention: Positive when the detector center is above the machine midplane
    in the $+\hat{Z}$ direction.'
