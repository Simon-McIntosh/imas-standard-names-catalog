name: electron_temperature
description: Thermal energy of the bulk electron population expressed as a temperature
  via $T_e = 2 \langle E_e \rangle / (3 k_B)$.
documentation: "The bulk electron temperature $T_e$ quantifies the second moment of\
  \ the electron velocity distribution under the assumption of a local Maxwellian.\
  \ It enters the electron pressure through $p_e = n_e k_B T_e$, where $n_e$ is the\
  \ electron number density (m$^{-3}$) and $k_B$ is the Boltzmann constant. $T_e$\
  \ is routinely inferred from Thomson scattering, electron cyclotron emission (ECE)\
  \ radiometry, and soft-X-ray diagnostics; Langmuir probes provide edge and scrape-off-layer\
  \ values. Typical core values span 1\u201320 keV in tokamak H-mode plasmas and 0.1\u2013\
  1 keV in the scrape-off layer; stellarator core values are typically 1\u201310 keV.\
  \ The electron temperature profile is a primary input to transport modeling and\
  \ equilibrium reconstruction through the pressure constraint. See also `electron_density`\
  \ for the companion kinetic profile and `ion_temperature` for the ion counterpart."
kind: scalar
unit: eV
