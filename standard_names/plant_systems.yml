- name: electron_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous electron-equivalent source rate supplied by plasma injection
    systems. It is the sum over injected atomic species of nuclear charge number times
    the atomic injection rate, representing the electron inventory that the injected
    material can contribute after ionization.
  documentation: 'Electron source rate due to injection is the electron-equivalent
    particle rate delivered to the plasma or vessel by fueling or material injection
    systems. It counts the number of electrons per second associated with the injected
    atoms after ionization, and is used for particle inventory and density-control
    accounting rather than as a local ionization-rate density.


    For a mixture of injected atomic species, the rate is defined by


    $$

    \dot{N}_{e,\mathrm{inj}} = \sum_s Z_s\,\dot{N}_{s,\mathrm{inj}}

    $$


    where $\dot{N}_{e,\mathrm{inj}}$ is the electron-equivalent injection rate, $s$
    indexes the injected atomic species, $Z_s$ is the nuclear charge number of species
    $s$, and $\dot{N}_{s,\mathrm{inj}}$ is its atomic injection rate. Molecular flows
    are converted to atomic rates before applying the sum; for example, each injected
    $\mathrm{D}_2$ molecule contributes two deuterium atoms and therefore two electron
    equivalents after complete ionization.


    In practice this quantity is computed from calibrated gas-valve throughput, pellet
    or compact-toroid particle content, or other injector flow measurements combined
    with the specified species composition. It may represent a single injector, a
    subsystem, or the total injected electron-equivalent rate, depending on the physical
    scope being described.


    Typical values span about $10^{19}$-$10^{23}$ s$^{-1}$ for ordinary gas fueling
    valves in present-day tokamaks. Short high-throughput events such as massive gas
    injection or pellet injection can reach about $10^{22}$-$10^{25}$ s$^{-1}$ for
    brief intervals.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:krypton_source_rate_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:accumulated_argon_count
  sources:
  - id: dd:gas_injection/pipe/valve/electron_rate
    dd_path: gas_injection/pipe/valve/electron_rate
    status: composed
  - id: dd:gas_injection/valve/electron_rate
    dd_path: gas_injection/valve/electron_rate
    status: attached
- name: ethane_prefill_count
  kind: scalar
  status: draft
  description: Accumulated ethane gas injected during the plasma prefill phase, expressed
    as an equivalent-electron count. Each C2H6 molecule contributes 18 equivalent
    electrons.
  documentation: 'Ethane prefill count is the accumulated amount of ethane introduced
    before plasma initiation, expressed as the number of electrons that would be supplied
    if the injected molecules were fully ionized. The quantity represents the ethane
    contribution to the initial neutral inventory in an equivalent-electron convention.


    The conversion from injected ethane molecules to equivalent-electron count is:


    $$

    N_{e,\mathrm{eq}} = 18\,N_{\mathrm{C}_2\mathrm{H}_6}

    $$


    where $N_{e,\mathrm{eq}}$ is the ethane prefill count, a dimensionless count of
    equivalent electrons, and $N_{\mathrm{C}_2\mathrm{H}_6}$ is the accumulated number
    of injected ethane molecules, a dimensionless molecule count. The factor 18 is
    the total nuclear charge of one ethane molecule: two carbon atoms with charge
    6 each plus six hydrogen atoms with charge 1 each.


    In practice, the value is obtained from calibrated gas-delivery accounting over
    the defined prefill interval and converted from delivered molecular amount to
    equivalent-electron count. It should include ethane delivered for the prefill
    phase only, not later gas injection used for fueling, impurity control, or other
    discharge phases.


    Typical values are strongly device- and scenario-dependent. They may be zero when
    ethane is not used for prefill, while intentional nonzero prefill amounts can
    span roughly $10^{19}$-$10^{23}$ equivalent electrons in small to medium devices
    and scale upward with vessel volume, target fill pressure, and delivered gas inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:ethylene_prefill_count
  - name:propane_prefill_count
  arguments:
  - name: accumulated_lithium_prefill_count_due_to_gas_injection
    operator: ethane
    operator_kind: qualifier
