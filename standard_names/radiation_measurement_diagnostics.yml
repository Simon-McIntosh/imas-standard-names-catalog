- name: optical_element_width
  kind: scalar
  status: active
  description: Full clear-aperture width of a rectangular optical-element aperture
    measured along its first local tangential axis.
  documentation: 'The clear-aperture width is the usable transverse extent of a rectangular
    optical-element aperture measured along its first local tangential axis. The local
    frame is right-handed $(\hat{X}_1,\hat{X}_2,\hat{X}_3)$, with $\hat{X}_3$ normal
    to the aperture surface and $\hat{X}_1$, $\hat{X}_2$ tangent to it.


    The width is defined by


    $$

    w_1 = x_{1,\max} - x_{1,\min}

    $$


    where $w_1$ is the aperture width and $x_{1,\max}$ and $x_{1,\min}$ are the maximum
    and minimum first local tangential coordinates of the clear aperture boundary.


    Only the unobstructed opening is included; the surrounding frame, mounting structure,
    and extent normal to the aperture are excluded. The corresponding second local
    tangential extent is the [height of the optical element](name:height_of_optical_element).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:height_of_optical_element
  sources:
