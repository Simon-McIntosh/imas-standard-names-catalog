    an equivalent-electron count. Each neutral deuterium atom contributes one equivalent
    electron.


    The equivalent-electron count is obtained by accumulating injected deuterium atoms
    over the prefill interval and weighting them by the deuterium atomic number:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{D,prefill}} = Z_{\mathrm{D}} N_{\mathrm{D,prefill}}
    = Z_{\mathrm{D}} \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{D}}(t)\,dt = \int_{t_0}^{t_{\mathrm{bd}}}
    \dot{N}_{\mathrm{D}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{D,prefill}}$ is the equivalent-electron count,
    $N_{\mathrm{D,prefill}}$ is the accumulated neutral-deuterium atom count, $Z_{\mathrm{D}}=1$
    is the deuterium atomic number, $\dot{N}_{\mathrm{D}}$ is the deuterium atom injection
    rate, $t_0$ is the prefill start time, and $t_{\mathrm{bd}}$ is the plasma-breakdown
    time.


    This quantity includes only deuterium introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and retained
    or ionized inventory. It is the deuterium-specific component of [prefill_count](name:prefill_count)
    and uses the same isotope-resolved convention as [tritium_prefill_count](name:tritium_prefill_count).'
