- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: Safety factor (q) at the magnetic axis, the innermost point of the
    nested flux surfaces where the poloidal magnetic field vanishes.
  documentation: "The safety factor at the magnetic axis, $q_0 = q(\\psi=0)$, is defined\
    \ as $q = d\\Phi_{\\text{tor}} / d\\Phi_{\\text{pol}}$ evaluated at the magnetic\
    \ axis, where $\\Phi_{\\text{tor}}$ is the toroidal magnetic flux (in Wb) and\
    \ $\\Phi_{\\text{pol}}$ is the poloidal magnetic flux (in Wb). $q_0$ is a critical\
    \ MHD stability parameter; in conventional tokamak H-mode plasmas $q_0$ is typically\
    \ near unity (0.9\u20131.2), and values below unity drive sawtooth instabilities.\
    \ It is routinely inferred from motional Stark effect (MSE) measurements or equilibrium\
    \ reconstruction codes, cross-referenced with [safety_factor](name:safety_factor)\
    \ at the edge and [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis).\
    \ The [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis) gives\
    \ the spatial location of this point.\n\nSign convention: Positive for conventional\
    \ tokamak operation with plasma current in the direction of increasing toroidal\
    \ angle."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:magnetic_shear_at_magnetic_axis
  - name:major_radius_of_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_axis
    dd_path: equilibrium/time_slice/global_quantities/q_axis
    status: composed
  - id: dd:summary/local/magnetic_axis/q/value
    dd_path: summary/local/magnetic_axis/q/value
    status: composed
- name: safety_factor_at_measurement_position
  kind: scalar
  status: draft
  description: Safety factor measured at a specific diagnostic location and used as
    a constraint in equilibrium reconstruction.
  documentation: "The safety factor $q(R,Z,\\phi) = d\\Phi_{\\mathrm{tor}}/d\\Phi_{\\\
    mathrm{pol}}$ quantifies the helicity of magnetic field lines on a flux surface\
    \ upto an arbitrary point. This particular instance records the value of $q$ at\
    \ a diagnostic measurement position, representing a measured constraint for equilibrium\
    \ reconstruction. The measured $q$ at a local position is typically obtained from\
    \ motional Stark effect (MSE) diagnostics, Zeeman polarimetry, or high-resolution\
    \ Thomson scattering, with typical core values of $q_0 \\sim 0.9$\u2013$1.1$ and\
    \ $q_{95} \\sim 3$\u2013$5$ in H-mode tokamak operation. The constraint contrasts\
    \ with the safety factor at the magnetic axis, $[\\mathrm{safety\\,factor\\,at\\\
    ,magnetic\\,axis}](name:safety_factor_at_magnetic_axis)$, which defines the innermost\
    \ limit.\n\nSign convention: Positive when the toroidal magnetic field and plasma\
    \ current directions produce a field-aligned coordinate system with $q > 0$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/constraints/q/measured
    dd_path: equilibrium/time_slice/constraints/q/measured
    status: composed
- name: toroidal_beta
  kind: scalar
  status: draft
  description: Ratio of the volume-averaged total plasma pressure to the toroidal
    magnetic field pressure, derived from MHD equilibrium reconstruction.
  documentation: "The toroidal beta $\\beta_t = 2\\mu_0 \\langle p \\rangle / B_{\\\
    phi,0}^2$ quantifies the efficiency of the magnetic confinement, where $\\langle\
    \ p \\rangle$ is the volume-averaged perpendicular plasma pressure and $B_{\\\
    phi,0}$ the toroidal magnetic field at the plasma center. This dimensionless ratio\
    \ is a key figure of merit for confinement quality, with typical values ranging\
    \ from 0.001 in early tokamaks to above 0.05 in modern high-performance regimes.\
    \ It is routinely computed from equilibrium reconstruction codes (e.g., EFIT)\
    \ that constrain the pressure profile using external magnetic measurements and\
    \ kinetic profile data. The quantity is the toroidal component of the vector beta,\
    \ defined as $[\\beta_t](name:poloidal_beta) \\equiv [\\beta](name:beta) \\cdot\
    \ \\hat{\\phi}$. \n\nSign convention: Positive when the volume-averaged pressure\
    \ is positive.\n\nFor a related measure using the poloidal field, see `[poloidal_beta](name:poloidal_beta)`.\
    \ The value is closely tied to the `[safety_factor](name:safety_factor)` profile\
    \ through the MHD equilibrium force balance."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_beta
