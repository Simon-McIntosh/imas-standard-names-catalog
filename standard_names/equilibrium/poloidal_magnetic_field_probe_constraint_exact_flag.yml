name: poloidal_magnetic_field_probe_constraint_exact_flag
status: draft
cocos_transformation_type: one_like
description: Integer flag indicating whether a poloidal-field probe measurement is
  treated as an exact input (1) or included in the least-squares fit (0) during equilibrium
  reconstruction.
documentation: When set to 1, the poloidal-field probe datum $B_{\rm pol}^{\rm meas}$
  is imposed as a hard equality constraint in the equilibrium solver, meaning the
  reconstructed field must match the measurement exactly at the probe location. When
  set to 0, the measurement enters the standard $\chi^2$ cost functional and is fitted
  within its uncertainty $\sigma_i$. Poloidal-field probes (pick-up coils) are typically
  mounted on the vacuum vessel wall and measure the local tangential component of
  $\mathbf{B}$ in the poloidal plane; their signals are among the primary inputs to
  free-boundary equilibrium reconstruction codes such as EFIT and LIUQE. Setting the
  exact flag to 1 is useful when a particular probe has exceptionally high accuracy
  and the reconstruction should be anchored to it, but overuse of exact constraints
  can render the inverse problem over-determined or mask systematic calibration errors.
  See `equilibrium_reconstruction_constraint_weight_of_diamagnetic_flux` for a related
  fitting control parameter.
