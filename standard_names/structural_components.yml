      parent_path: breeding_blanket/module/layer
      parent: Set of layers in the blanket module
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Thickness of a breeding blanket module layer evaluated at the midplane.
        Characterizes the physical dimension of individual material layers within
        the blanket module relevant to neutronics and shielding assessment.
      kind: llm
- name: thickness_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Non-negative geometric separation across a breeder blanket module or
    one of its structural subregions, measured along the specified thickness direction.
  documentation: 'Thickness is the non-negative geometric extent between two bounding
    surfaces or interfaces of a breeder blanket module or a defined module subregion.
    The direction is the local thickness direction appropriate to those boundaries,
    so the definition covers cap and other structural dimensions.


    For corresponding points on the bounding surfaces, the projected separation is
    defined by


    $$

    t = \left|\left(\mathbf{r}_2-\mathbf{r}_1\right)\cdot\hat{\mathbf{n}}\right|

    $$


    where $t$ is the thickness in m, $\mathbf{r}_1$ and $\mathbf{r}_2$ are position
    vectors of the corresponding boundary points, and $\hat{\mathbf{n}}$ is the specified
    unit thickness direction.


    The parent quantity includes the cap-specific dimensions represented by [lower
    thickness of a breeder blanket module](name:lower_thickness_of_breeder_blanket_module)
    and [upper thickness of a breeder blanket module](name:upper_thickness_of_breeder_blanket_module).
    It describes structural geometry, excluding the thickness of an individual breeder
    material layer when that layer is treated as a separate subcomponent.'
  unit: m
  physics_domain: structural_components
  links:
  - name:lower_thickness_of_breeder_blanket_module
  - name:upper_thickness_of_breeder_blanket_module
  sources:
  - dd_path: breeding_blanket/module/side_wall_thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-module-side_wall_thickness
    dd_documentation:
