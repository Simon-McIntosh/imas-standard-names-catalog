name: ion_temperature_peaking_factor
status: draft
cocos_transformation_type: one_like
description: Ratio of the on-axis ion temperature to its volume-averaged value inside
  the last closed flux surface, characterizing profile shape.
documentation: The ion temperature peaking factor is defined as $f_{T_i} = T_i(\rho=0)
  / \langle T_i \rangle_V$, where $T_i(\rho=0)$ is the ion temperature at the magnetic
  axis and $\langle T_i \rangle_V = \int T_i\, dV / V_{\mathrm{LCFS}}$ is the volume
  average taken over the plasma enclosed by the last closed flux surface (LCFS). It
  is a dimensionless global scalar that summarizes the radial peakedness of the ion
  temperature profile; values typically range from 1.5 to 4 in standard tokamak H-mode
  discharges, with higher values indicating more peaked profiles driven by strong
  central heating. The peaking factor is computed from charge-exchange recombination
  spectroscopy (CXRS) or neutron-emission-inferred $T_i$ profiles integrated over
  the equilibrium volume elements. It is used in confinement scaling analyses and
  integrated modeling to parameterize profile stiffness. See also the related electron
  quantity and kinetic profile entries.
