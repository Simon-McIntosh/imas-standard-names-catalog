- name: oxygen_density_at_limiter
  kind: scalar
  status: active
  description: Oxygen density at a limiter is the local number density of oxygen ions
    in the boundary plasma immediately adjacent to a plasma-facing limiter surface,
    summed over all oxygen ionization states from O+ through O8+ and excluding neutral
    oxygen atoms.
  documentation: 'Oxygen density at a limiter is the local number density of oxygen
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance at the limiter. It is summed over all oxygen ionization states from O$^+$
    through O$^{8+}$, and excludes neutral oxygen atoms.


    For oxygen ion charge states from singly ionized to fully stripped, the charge-state-summed
    limiter density is defined as:


    $$

    n_{\mathrm{O},\mathrm{lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{O},\mathrm{lim}}$ is the oxygen ion density at the limiter,
    $n_{\mathrm{O}^{q+},\mathrm{lim}}$ is the local density of oxygen ions with charge
    state $q$, and the upper limit is the nuclear charge of oxygen.


    This quantity is species-specific and charge-state-summed; it is not the neutral
    oxygen density, [electron_density_at_limiter](name:electron_density_at_limiter),
    or [total_ion_density_at_limiter](name:total_ion_density_at_limiter). At the sheath
    entrance, oxygen charge-state densities contribute to quasineutrality through
    their charge-weighted sum and to the local effective charge. The analogous oxygen
    density at divertor target surfaces is [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
