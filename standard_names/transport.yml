    dd_path: plasma_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    status: composed
- name: toroidal_lithium_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal (phi-directed) velocity of the lithium ion population at the
    radial position of an internal transport barrier.
  documentation: 'The toroidal component of the lithium ion velocity $v_{\phi,\mathrm{Li}}$
    at the internal transport barrier (ITB) location quantifies the rotation of the
    lithium impurity species in the direction of the toroidal angle $\phi$, measured
    in the IMAS cylindrical $(R, \phi, Z)$ frame. The ITB is a region of strongly
    reduced anomalous transport where steep gradients in plasma profiles form; the
    toroidal rotation velocity there is often intimately linked to the suppression
    of turbulence and the formation of the barrier. Typical values in ITB plasmas
    range from $10\,\mathrm{km\,s^{-1}}$ to $200\,\mathrm{km\,s^{-1}}$, depending
    on the auxiliary torque input and plasma conditions; the value is inferred from
    the Doppler shift of lithium charge-exchange recombination spectroscopy (CXRS)
    lines.


    Sign convention: Positive when $v_{\phi,\mathrm{Li}}$ points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above).


    Related quantities include the lithium density at the ITB, given by [lithium_density_at_internal_transport_barrier](name:lithium_density_at_internal_transport_barrier),
    and the toroidal velocity of other species at the same location, such as [toroidal_tungsten_velocity_at_internal_transport_barrier](name:toroidal_tungsten_velocity_at_internal_transport_barrier)
    and [toroidal_lithium_velocity_at_pedestal](name:toroidal_lithium_velocity_at_pedestal)
    at the pedestal position. This velocity is summed over all lithium charge states,
    consistent with the convention used for the sibling density name.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:lithium_density_at_internal_transport_barrier
  - name:toroidal_tungsten_velocity_at_internal_transport_barrier
  - name:toroidal_lithium_velocity_at_pedestal
  sources:
  - id: dd:summary/local/itb/velocity_phi/lithium/value
    dd_path: summary/local/itb/velocity_phi/lithium/value
    status: composed
- name: toroidal_lithium_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal fluid velocity of the lithium impurity ion population at the
    location of the magnetic axis.
  documentation: 'The toroidal velocity $v_{\phi,\mathrm{Li}}$ of lithium ions at
    the magnetic axis quantifies the rotation of the low-Z impurity species along
    the geometric toroidal direction $\hat{\phi}$ at the innermost flux surface. This
    quantity is routinely measured by charge exchange recombination spectroscopy (CXRS)
    using the Doppler shift of a lithium emission line, or inferred from equilibrium
    reconstruction and neoclassical transport codes. At the magnetic axis, the toroidal
    rotation of impurities is often closely coupled to the bulk plasma rotation through
    collisional momentum exchange, and serves as an indicator of intrinsic torque,
    momentum confinement, and impurity transport. Typical values in the core of neutral-beam-heated
    tokamaks range from tens to hundreds of km/s in the co-current direction. See
    also the radial profiles of lithium rotation at other flux surfaces such as `[toroidal_lithium_velocity_at_pedestal](name:toroidal_lithium_velocity_at_pedestal)`
    and `[toroidal_lithium_velocity_at_separatrix](name:toroidal_lithium_velocity_at_separatrix)`.


    Sign convention: Positive when $v_{\phi,\mathrm{Li}}$ points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_lithium_velocity_at_pedestal
  - name:toroidal_lithium_velocity_at_separatrix
  sources:
  - id: dd:summary/local/magnetic_axis/velocity_phi/lithium/value
    dd_path: summary/local/magnetic_axis/velocity_phi/lithium/value
    status: composed
- name: toroidal_thermal_ion_collisional_torque_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Toroidal component of the collisional torque density transferred to
    thermal ions from Coulomb collisions with counter-passing fast particles.
  documentation: "The toroidal component $\\tau_{\\phi,\\mathrm{CI}}$ of the collisional\
    \ torque density represents the rate of toroidal angular momentum transfer per\
    \ unit volume to the thermal ion population via Coulomb collisions with counter-passing\
    \ fast ions. This quantity isolates the toroidal projection of the torque density\
    \ vector, distinguishing it from the full vector quantity [thermal_ion_collisional_torque_density_due_to_coulomb_collisions](name:thermal_ion_collisional_torque_density_due_to_coulomb_collisions).\
    \ The torque density is a key source term in the toroidal angular momentum transport\
    \ equation, influencing the toroidal rotation profile of the thermal ion species.\
    \ Typical values in NBI-heated tokamak plasmas range from 0.1\u201310 N/m\xB2\
    \ in the core, decreasing toward the edge. This quantity is routinely inferred\
    \ from neutral beam injection and fast-ion distribution calculations, providing\
    \ the counter-passing contribution to the overall collisional torque transferred.\
    \ See also [toroidal_fast_ion_collisional_torque_density_due_to_coulomb_collisions](name:toroidal_fast_ion_collisional_torque_density_due_to_coulomb_collisions)\
    \ and [toroidal_thermal_electron_collisional_torque_density_due_to_coulomb_collisions](name:toroidal_thermal_electron_collisional_torque_density_due_to_coulomb_collisions)\
    \ for the corresponding torques on other species."
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:thermal_ion_collisional_torque_density_due_to_coulomb_collisions
  - name:toroidal_fast_ion_collisional_torque_density_due_to_coulomb_collisions
