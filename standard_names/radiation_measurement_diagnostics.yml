- name: time_derivative_of_bremsstrahlung_count_at_detector_pixel
  kind: scalar
  status: draft
  description: Rate at which visible bremsstrahlung continuum photons produce photoelectron-equivalent
    counts in a single detector pixel. It is the time derivative of the accumulated
    bremsstrahlung count and represents a detected count rate, not a source photon
    emission rate.
  documentation: 'The time derivative of bremsstrahlung count at a detector pixel
    is the detected photoelectron-equivalent count rate associated with visible bremsstrahlung
    continuum light incident on that pixel. The accumulated count is dimensionless;
    its time derivative has unit s^-1 and is distinct from the number of photons emitted
    by the plasma or the photon flux arriving at the detector, because it includes
    optical throughput, spectral response, quantum efficiency, and detector conversion
    to photoelectrons.


    For detector pixel $p$, the rate is defined from the accumulated bremsstrahlung
    count $N_{\mathrm{brem},p}$ as


    $$

    \dot{N}_{\mathrm{brem},p}(t) = \frac{dN_{\mathrm{brem},p}(t)}{dt}

    $$


    where $N_{\mathrm{brem},p}$ is the dimensionless accumulated photoelectron-equivalent
    bremsstrahlung count in pixel $p$, $t$ is time in s, and $\dot{N}_{\mathrm{brem},p}$
    is the detected count rate in s^-1. This quantity is conceptually the bremsstrahlung-specific
    form of tendency_of_count_at_detector_pixel and is closely related to [bremsstrahlung_rate](name:time_derivative_of_bremsstrahlung_count_at_detector_pixel).


    In practice, the rate is inferred from camera, photodiode, or photomultiplier
    signals viewing a selected visible-continuum spectral band. Raw electronic signals
    are converted to photoelectron-equivalent counts using the detector gain, exposure
    time or sampling interval, dark and offset subtraction, relative channel calibration,
    and, when needed, corrections for background line radiation or stray light. The
    resulting calibrated rate describes detected photoelectrons attributable to bremsstrahlung;
    it is not the plasma emissivity itself, which additionally requires line-of-sight
    geometry, spectral bandwidth, transmission, detector efficiency, and plasma parameters
    such as electron density, electron temperature, and effective charge.


    Typical calibrated count rates span about 10^3-10^8 s^-1 per pixel in visible
    bremsstrahlung systems. Edge or low-density views may be near 10^2-10^5 s^-1,
    while bright core views with large optical throughput can reach 10^7-10^9 s^-1
    before detector saturation or pile-up effects become important.'
  unit: s^-1
  physics_domain: radiation_measurement_diagnostics
  links: []
