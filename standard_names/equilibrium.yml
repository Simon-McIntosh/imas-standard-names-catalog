- name: toroidal_flux_coordinate_of_magnetic_axis
  kind: scalar
  status: active
  description: Value of the radius-like toroidal-flux label on the magnetic surface
    passing through the magnetic axis; it is zero because enclosed toroidal flux vanishes
    there.
  documentation: 'The toroidal flux coordinate at the magnetic axis is the value of
    the radius-like flux-surface label on the magnetic-axis reference surface. It
    identifies the origin of the toroidal-flux radial coordinate and is not a geometric
    distance from the machine symmetry axis.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor}} = \sqrt{\frac{\Phi_{\mathrm{tor}}}{\pi B_0}}

    $$


    where $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the magnetic surface, and $B_0$ is the
    positive reference vacuum toroidal magnetic-field strength. At the magnetic axis,
    the enclosed toroidal flux is zero, so this value is zero.


    The quantity applies to the single magnetic-axis locus and is neither a flux-surface
    average nor an integral over a finite region. It is the axis value of the parent
    [toroidal flux coordinate](name:toroidal_flux_coordinate), not the coordinate
    of an arbitrary flux surface or a geometric major- or minor-radius measurement.


    The [toroidal magnetic flux](name:toroidal_magnetic_flux) supplies the enclosed-flux
    quantity in the defining relation, while the corresponding normalized toroidal-flux
    coordinate uses axis and boundary values to form a dimensionless radial label.'
  unit: m
  physics_domain: equilibrium
