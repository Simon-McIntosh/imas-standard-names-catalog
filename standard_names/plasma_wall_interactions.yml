- name: neutral_internal_state_energy_flux_at_wall
  kind: scalar
  status: active
  description: Incident neutral-particle flux at a plasma-facing wall, resolved to
    a specified internal quantum state and kinetic-energy channel. It counts neutral
    atoms or molecules occupying that state, with kinetic energy within the channel,
    crossing from the plasma side into the material surface. It is an arrival-particle
    flux, not a kinetic-energy-weighted power flux.
  documentation: 'Incident neutral-particle flux at a plasma-facing wall, resolved
    to a specified internal quantum state and kinetic-energy channel, counts the neutral
    atoms or molecules occupying that state whose kinetic energy lies within the channel
    as they cross from the plasma-facing region into the material surface, per unit
    wall area per unit time. Because a bound internal quantum state belongs to a specific
    neutral species, the state identifier fixes the species; no species sum is implied
    at the state-resolved level.


    Let $\hat{\mathbf{n}}_w$ be the local unit normal directed from the wall into
    the plasma-facing domain, so incident velocities satisfy $\mathbf{v}\cdot\hat{\mathbf{n}}_w
    < 0$. For internal state $s$ and kinetic-energy channel $k$ with energy interval
    $\Delta_k$, the flux is defined by


    $$

    \Gamma_{s,k}^{w} = \int_{\substack{\mathbf{v}\cdot\hat{\mathbf{n}}_w < 0 \\ \tfrac{1}{2}
    m_s |\mathbf{v}|^2 \in \Delta_k}} \left(-\mathbf{v}\cdot\hat{\mathbf{n}}_w\right)
    f_{s}(\mathbf{v})\, d^3v

    $$


    where $f_{s}$ is the velocity distribution of neutral particles in internal state
    $s$ at the plasma side of the wall and $m_s$ is the mass of the neutral species
    carrying state $s$.


    The kinetic-energy channel resolves the arrival flux by energy without weighting
    the integrand by kinetic energy, so the quantity remains a particle flux and is
    distinct from a power flux onto the wall. Summing over all kinetic-energy channels
    yields the [neutral internal-state particle flux at the wall](name:neutral_internal_state_particle_flux_at_wall).
    Summing over all internal quantum states, and thereby over neutral species since
    each state belongs to one species, yields the species-summed [neutral energy flux
    at the wall](name:neutral_energy_flux_at_wall) in the corresponding kinetic-energy
    channel. The counterpart not restricted to neutrals is the [internal-state energy
    flux at the wall](name:internal_state_energy_flux_at_wall). Only the incident
    half-space contributes: neutrals leaving the surface, such as reflected, recycled,
    or desorbed particles, are excluded.


    Sign convention: Positive when neutral particles move from the plasma-facing region
    toward the wall surface, that is, when their velocity satisfies $\mathbf{v}\cdot\hat{\mathbf{n}}_w
    < 0$ with $\hat{\mathbf{n}}_w$ directed from the wall into the plasma-facing domain.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
