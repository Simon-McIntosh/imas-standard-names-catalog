- name: spectral_radiance_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Power radiance of hard X-ray emission received on a detector channel,
    equal to detected power per unit detector area per unit solid angle, resolved
    over one or more photon energy acceptance bands.
  documentation: "The spectral radiance of a hard X-ray detector channel is the detected\
    \ radiative power normalized by the product of detector area and acceptance solid\
    \ angle (the \xE9tendue), integrated within each photon energy band of the channel.\
    \ Hard X-ray emission in fusion plasmas is generated predominantly by bremsstrahlung\
    \ from suprathermal electrons and runaway electron populations, making this quantity\
    \ a key diagnostic for characterizing the high-energy tail of the electron distribution.\n\
    \nThe channel brightness $B$ is defined as:\n\n$$\nB = \\frac{P}{A \\cdot \\Omega}\n\
    $$\n\nwhere $P$ is the radiative power collected by the channel, $A$ is the effective\
    \ detector area, and $\\Omega$ is the solid angle subtended by the collection\
    \ optics; their product $A \\cdot \\Omega$ is the \xE9tendue.\n\nUnlike [hard_xray_brightness](name:hard_xray_brightness),\
    \ which expresses photon flux per unit area and solid angle, this quantity is\
    \ a power-based radiance, directly mirroring [spectral_radiance_of_soft_xray_detector](name:spectral_radiance_of_soft_xray_detector)\
    \ for the hard X-ray energy range. Multi-channel measurements along varied lines\
    \ of sight enable tomographic inversion to recover the spatially resolved hard\
    \ X-ray emissivity profile, from which the energy distribution and confinement\
    \ properties of suprathermal electron populations can be inferred."
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  - name:spectral_radiance_of_soft_xray_detector
  sources:
  - id: dd:hard_x_rays/channel/brightness
    dd_path: hard_x_rays/channel/brightness
    status: composed
- name: spectral_radiance_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Power radiance of soft X-ray emission incident on a detector channel,
    defined as detected power per unit area per unit solid angle and integrated over
    the detector energy band.
  documentation: "Soft X-ray spectral radiance is the detected electromagnetic power\
    \ from plasma emission per unit detector area per unit solid angle, integrated\
    \ over one or more energy bands defined by the detector channel's filter or spectral\
    \ response. It quantifies the power flux delivered along a specific line of sight\
    \ through the plasma and is distinct from photon radiance; the companion quantity\
    \ [brightness_of_soft_xray_detector](name:brightness_of_soft_xray_detector) expresses\
    \ the same measurement in photons per second rather than in power units.\n\nThe\
    \ defining relation is:\n\n$$\nL = \\frac{d^2 P}{dA \\, d\\Omega}\n$$\n\nwhere\
    \ $P$ is the detected power, $dA$ is the active detector area element, and $d\\\
    Omega$ is the solid-angle element subtended by the field of view; integration\
    \ over the detector energy passband is implicit in this band-integrated form.\n\
    \nSoft X-ray power radiance is measured with semiconductor photodiodes placed\
    \ behind metallic foil filters that select an effective energy passband, commonly\
    \ in the range 0.1\u201310 keV. Fan arrays of such channels enable tomographic\
    \ inversion to recover the volumetric soft X-ray emissivity profile, supporting\
    \ impurity transport studies, MHD mode tracking, and sawtooth monitoring. Multiplying\
    \ by the detector \xE9tendue (area times solid angle) recovers the total channel\
    \ power given by [power_of_soft_xray_detector](name:power_of_soft_xray_detector).\
    \ The hard X-ray power radiance analog following the same spatial radiance definition\
    \ at higher photon energies is [spectral_radiance_of_hard_xray_detector](name:spectral_radiance_of_hard_xray_detector)."
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:brightness_of_soft_xray_detector
  - name:power_of_soft_xray_detector
  - name:spectral_radiance_of_hard_xray_detector
  sources:
