- name: current_due_to_neutral_beam_injection
  kind: scalar
  status: draft
  description: Non-inductive toroidal plasma current produced by neutral beam injection
    through directed momentum transfer from fast beam ions to the background plasma
    during Coulomb-collision thermalization.
  documentation: 'Current due to neutral beam injection is the neutral-beam contribution
    to the total non-inductive plasma current, current_due_to_non_inductive_current_drive.
    Injected neutrals are ionized in the plasma, become energetic fast ions, and transfer
    directed momentum to electrons and ions as they slow down, producing a net driven
    current.


    At a global level, the driven current can be represented as the integral of a
    local NBI current-drive source density over the confined plasma volume:


    $$

    I_{\mathrm{NBI}} = \int_{V_p} S_{I,\mathrm{NBI}}(\mathbf{x})\, dV

    $$


    where $I_{\mathrm{NBI}}$ is the total NBI-driven current, $S_{I,\mathrm{NBI}}$
    is the local driven-current source density in $\mathrm{A\,m^{-3}}$, $\mathbf{x}$
    is position, $V_p$ is the plasma volume, and $dV$ is a volume element in $\mathrm{m^3}$.


    In practice this quantity is computed from neutral-beam deposition, ionization,
    fast-ion orbit and slowing-down physics, pitch-angle scattering, collisional momentum
    exchange, and the plasma equilibrium. It depends strongly on the injected and
    absorbed neutral-beam power, [power_due_to_neutral_beam_injection](name:power_due_to_neutral_beam_injection)
    and [absorbed_power_of_neutral_beam_injector](name:absorbed_power_of_neutral_beam_injector),
    as well as beam energy, tangency geometry, fast-ion confinement, electron temperature,
    density, and trapped-particle fraction.


    Typical values range from $1\times10^4$-$1\times10^6$ A in present-day tokamaks,
    with lower values for weak or poorly aligned beams and values near or above $1\times10^6$
    A in large, high-power, high-temperature plasmas.


    Sign convention: Positive when the toroidal projection of the driven parallel
    plasma current flows in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$,
    where $R$ is major radius, $\phi$ increases counter-clockwise when viewed from
    above $+\hat{Z}$, and $Z$ is vertical height.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_neutral_beam_injection
  - name:absorbed_power_of_neutral_beam_injector
  sources:
  - id: dd:summary/heating_current_drive/nbi/current/value
    dd_path: summary/heating_current_drive/nbi/current/value
    status: composed
- name: height_of_antenna_strap
  kind: scalar
  status: draft
  description: Full vertical height of the rectangular cross-section of an ICRH antenna
    strap conductor element, measured along the poloidal direction.
  documentation: 'The height of an antenna strap is the full vertical (poloidal) extent
    of the rectangular cross-section of the current-carrying strap conductor in an
    ion cyclotron resonance heating (ICRH) antenna system. In ICRH antennas, the strap
    is the active radiating element that launches electromagnetic waves near the ion
    cyclotron frequency; its cross-sectional geometry governs current distribution,
    RF resistance, and coupling efficiency to the plasma.


    For a rectangular strap cross-section, the three characteristic dimensions are
    height (this quantity), [width](name:width_of_antenna_strap) measured along the
    toroidal direction, and [thickness](name:thickness_of_antenna_strap) perpendicular
    to the strap plane. Height is measured along the vertical direction $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius,
    $\phi$ is the toroidal angle, and $Z$ is the vertical coordinate. For strap conductors
    with annular cross-sections, the analogous radial dimensions are the [outer radius](name:outer_radius_of_antenna_strap)
    and [inner radius](name:inner_radius_of_antenna_strap) of the conductor.


    Typical ICRH strap heights range from a few centimeters to approximately 50 cm
    depending on antenna design and machine geometry.


    Sign convention: Positive when measured in the direction of increasing $Z$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:outer_radius_of_antenna_strap
  - name:inner_radius_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/height
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/height
    status: composed
- name: inner_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of an ICRH antenna strap,
    measured from the strap conductor axis to the inner cylindrical boundary of the
    conductor.
  documentation: 'Inner radius of an antenna strap is the radial distance from the
    local strap conductor axis to the inner cylindrical surface of an annular strap
    cross-section. It applies to hollow or tubular ICRH strap conductors; straps with
    solid rectangular or otherwise non-annular cross-sections do not have this quantity.
    In a strap-local right-handed cylindrical $(r_s, \varphi_s, z_s)$ frame, $z_s$
    follows the strap centerline or long current-carrying direction and $r_s$ is measured
    perpendicular to that axis.


    The inner radius is the distance from the strap axis to the inner wall of the
    annulus:


    $$

    r_\mathrm{inner} = \left|\mathbf{x}_\perp - \mathbf{x}_\mathrm{axis}\right|

    $$


    where $\mathbf{x}_\perp$ is a point on the inner cylindrical boundary in a cross-section
    normal to the strap axis, $\mathbf{x}_\mathrm{axis}$ is the corresponding point
    on the strap centerline, and both positions are expressed in meters.


    This quantity is obtained from antenna mechanical design, CAD geometry, or direct
    metrology of the conductor cross-section. Together with [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap),
    it determines the annular conducting area, $A = \pi(r_\mathrm{outer}^2-r_\mathrm{inner}^2)$,
    and the wall thickness, $r_\mathrm{outer}-r_\mathrm{inner}$, which are important
    for cooling-channel design, RF current distribution, and impedance modeling at
    ion-cyclotron frequencies.


    Typical ICRH tubular copper strap inner radii are about 0.005-0.03 m, depending
    on RF power, cooling requirements, and mechanical constraints. Larger high-power
    antenna conductors may use somewhat larger inner radii to reduce hydraulic resistance
    and thermal loading.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:outer_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:width_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    status: composed
- name: launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power entering the vacuum vessel from a single lower-hybrid
    antenna, equal to forward power minus reflected power at the antenna aperture.
  documentation: 'The launched power of a lower-hybrid antenna is the net radio-frequency
    power injected into the vacuum vessel from one lower-hybrid antenna assembly per
    unit time. It quantifies the RF energy flux actually available to couple to plasma
    waves, distinguishing it from the gross input to the antenna system and from the
    fraction ultimately absorbed by the plasma.


    The net launched power is defined as:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the [forward power](name:forward_power_of_lower_hybrid_antenna)
    at the antenna aperture and $P_\mathrm{reflected}$ is the [reflected power](name:reflected_power_of_lower_hybrid_antenna)
    returning toward the transmission line. The coupling efficiency is $\eta = P_\mathrm{launched}/P_\mathrm{forward}$,
    which depends on the match between the antenna wave spectrum and the plasma density
    at the waveguide mouth.


    This quantity is measured by directional couplers on the transmission line feeding
    each antenna and serves as the primary input to ray-tracing and full-wave calculations
    for lower hybrid current drive power deposition. Launched powers in current experiments
    range from tens of kilowatts to several megawatts per antenna.


    The gross RF input to the antenna system before accounting for reflections is
    given by [power_of_lower_hybrid_antenna](name:power_of_lower_hybrid_antenna).
    The system-level aggregate over all launcher units is captured by [total_launched_power_of_lower_hybrid_antenna](name:total_launched_power_of_lower_hybrid_antenna),
    while the fraction deposited in the plasma is tracked by [total_absorbed_power_of_lower_hybrid_antenna](name:total_absorbed_power_of_lower_hybrid_antenna).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:power_of_lower_hybrid_antenna
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/antenna/power_launched
    dd_path: lh_antennas/antenna/power_launched
    status: composed
- name: outer_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Outer radial boundary of the annular cross-section of an ICRH antenna
    strap conductor, defining the larger of the two radii that bound the conductor
    annulus.
  documentation: 'The outer radius of an ICRH antenna strap is the radial distance
    from the central axis of the strap conductor to the outer cylindrical surface
    of the annular cross-section. It marks the external boundary of the conductor
    material and, together with the [inner radius](name:inner_radius_of_antenna_strap),
    fully specifies the radial extent of the annular conductor.


    For an annular cross-section, the radial conductor wall thickness follows $\Delta
    r = r_\mathrm{out} - r_\mathrm{in}$, where $r_\mathrm{out}$ is the outer radius
    and $r_\mathrm{in}$ is the inner radius. The nominal centerline radius reported
    by [radius_of_antenna_strap](name:radius_of_antenna_strap) is the mean $(r_\mathrm{out}
    + r_\mathrm{in})/2$.


    This geometric parameter enters electromagnetic wave-coupling calculations and
    RF impedance modeling for ion cyclotron resonance heating systems. Together with
    the [width](name:width_of_antenna_strap), [height](name:height_of_antenna_strap),
    and [thickness](name:thickness_of_antenna_strap) of the conductor, it provides
    the complete geometric description needed for antenna strap simulations.


    Sign convention: Positive when measured radially outward from the strap conductor
    axis.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:inner_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:width_of_antenna_strap
  - name:height_of_antenna_strap
  - name:thickness_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    status: composed
- name: reflected_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: RF power returning from a lower hybrid antenna back toward the transmission
    line, representing the portion of forward power not coupled into the plasma.
  documentation: "Reflected power from a lower hybrid antenna is the component of\
    \ incident RF power that fails to couple into the plasma and propagates back toward\
    \ the transmission line source. Poor coupling arises from unfavorable edge plasma\
    \ density gradients, suboptimal launcher\u2013plasma distance, or antenna phasing\
    \ conditions that mismatch the slow-wave accessibility window of the lower hybrid\
    \ wave.\n\nThe power reflection coefficient $|\\Gamma|^2$ relates reflected power\
    \ $P_\\text{ref}$ to forward power $P_\\text{fwd}$:\n\n$$\n|\\Gamma|^2 = \\frac{P_\\\
    text{ref}}{P_\\text{fwd}}\n$$\n\nwhere $P_\\text{fwd}$ is the total power delivered\
    \ to the antenna from the transmission line. The [launched power](name:launched_power_of_lower_hybrid_antenna)\
    \ into the vacuum vessel is the difference $P_\\text{fwd} - P_\\text{ref}$, and\
    \ the [total absorbed power](name:total_absorbed_power_of_lower_hybrid_antenna)\
    \ accounts for remaining waveguide and plasma losses. The gross RF input to the\
    \ antenna system is captured by the parent quantity `power_of_lower_hybrid_antenna`.\n\
    \nReflected power is monitored in real time using directional couplers embedded\
    \ in the transmission line feeding the lower hybrid launcher. In well-coupled\
    \ regimes, $P_\\text{ref}/P_\\text{fwd}$ is typically below 5\u201310%; transients\
    \ such as L\u2013H mode transitions or edge density fluctuations can briefly increase\
    \ the reflected fraction to 30\u201350%, triggering protection interlocks. The\
    \ analogous quantity for ion cyclotron systems is [reflected power of an IC antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:lh_antennas/antenna/power_reflected
    dd_path: lh_antennas/antenna/power_reflected
    status: composed
- name: thermal_ion_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the thermal ion population within
    the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal ion power at an inside flux surface is the cumulative rate
    at which wave energy is deposited in the bulk ion population inside the volume
    enclosed by that magnetic flux surface. It represents thermal-ion heating integrated
    from the magnetic axis to the chosen surface and excludes direct deposition to
    electrons and fast ions.


    The cumulative power for a flux surface labeled by the dimensionless radial coordinate
    $\rho$ in a flux coordinate system $(\rho,\theta,\phi)$ is defined from the local
    thermal-ion wave-power density:


    $$

    P_{\mathrm{th\,ion}}(\rho) = \int_{V(\rho)} p_{\mathrm{th\,ion}} \, dV''

    $$


    where $V(\rho)$ is the plasma volume enclosed by the flux surface, $p_{\mathrm{th\,ion}}$
    is the local net wave-power density for thermal ions in W m^-3, $dV''$ is a volume
    element in m^3, and $P_{\mathrm{th\,ion}}$ is the cumulative power.


    In practice this quantity is computed by integrating wave-power deposition densities
    from wave propagation and wave-particle absorption modeling over the reconstructed
    plasma volume. Experimental constraints include injected wave power, coupling
    losses, ion temperature evolution, species composition, and other heating and
    transport terms needed to separate thermal-ion absorption from electron or fast-ion
    channels.


    Typical values are near 0 W at the magnetic axis and increase toward the total
    thermal-ion absorbed wave power at the plasma boundary. Medium-size tokamak discharges
    commonly have 10^4-10^6 W, while high-power wave-heating scenarios in large devices
    can reach 10^6-2 x 10^7 W within the outer flux surfaces.


    Sign convention: Positive when wave energy is transferred to the thermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_power
  - name:thermal_electron_power_at_inside_flux_surface
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    status: composed
- name: total_absorbed_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power deposited into the plasma by the lower hybrid antenna
    system, aggregated over all individual antennas.
  documentation: 'The total absorbed power of the lower hybrid antenna system quantifies
    the net RF energy deposition rate from the LHCD launcher array into the confined
    plasma, summed over all individual antennas. It is the primary power accounting
    metric for lower hybrid current drive and supplemental electron heating, governing
    the wave energy available for driving non-inductive plasma current.


    The absorbed power is defined as the volume integral of the local LH wave power
    deposition density over the plasma volume:


    $$

    P_\text{abs} = \int_V q_\text{LH}(\mathbf{r}) \, dV

    $$


    where $q_\text{LH}(\mathbf{r})$ is the volumetric LH wave absorption density at
    position $\mathbf{r}$ within the plasma volume $V$.


    This quantity is distinct from the [total launched power](name:total_launched_power_of_lower_hybrid_antenna),
    which represents power entering the vacuum vessel and can exceed the absorbed
    power by any residual absorption in the edge region or scrape-off layer that does
    not reach the confined plasma. In practice, the absorbed power is estimated from
    directional-coupler measurements of the [forward power](name:forward_power_of_lower_hybrid_antenna)
    and [reflected power](name:reflected_power_of_lower_hybrid_antenna) on the high-power
    RF transmission lines, corrected for resistive dissipation in the launcher structure
    and waveguide network.


    In current LHCD systems on medium-to-large tokamaks, total absorbed power levels
    range from 1-10 MW.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/power
    dd_path: lh_antennas/power
    status: composed
- name: fast_ion_state_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power density deposited on fast (non-thermal) ions in
    a specified charge state, expressed per unit plasma volume. When averaged over
    a magnetic flux surface, it is the local radial source whose volume integral gives
    the cumulative absorbed power for that state.
  documentation: 'Fast-ion state power density is the volumetric rate at which wave
    energy is transferred to the non-thermal ion population in a specified charge
    state. It is a charge-state-resolved component of [fast_ion_power_density](name:fast_ion_power_density)
    and is distinct from heating of the thermal-ion population represented by [thermal_ion_power_density](name:thermal_ion_power_density).


    For nested magnetic flux surfaces labeled by a dimensionless radial label $\rho$,
    the flux-surface-averaged density is


    $$

    p_{\mathrm{fast},c}(\rho) = \frac{1}{V''(\rho)} \int_{S(\rho)} \frac{q_{\mathrm{fast},c}(\mathbf{x})}{|\nabla
    \rho|} \, dA

    $$


    where $p_{\mathrm{fast},c}$ is this power density in W m^-3, $c$ denotes the charge
    state, $q_{\mathrm{fast},c}$ is the local wave-to-fast-ion energy-transfer density
    in W m^-3, $S(\rho)$ is the magnetic flux surface, $dA$ is the area element in
    m^2, $|\nabla\rho|$ has units m^-1, and $V''(\rho)$ is the differential volume
    in m^3 per unit $\rho$. Integrating $p_{\mathrm{fast},c}(\rho)V''(\rho)$ from
    the magnetic axis to a chosen surface gives [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_state_power_at_inside_flux_surface)
    in W.


    In practice, this quantity is computed from wave absorption or energy-balance
    modeling that partitions deposited wave power among ion species, charge states,
    and thermal or fast components. Inputs typically include wave fields, resonance
    physics, the fast-ion distribution, charge-state populations, equilibrium geometry,
    and collisional energy exchange; no particular reconstruction or heating code
    is implied.


    Typical flux-surface-averaged magnitudes are 10^3-10^6 W m^-3 for charge-state-resolved
    fast-ion wave heating in present tokamaks. Strongly localized resonant absorption
    can approach 10^7 W m^-3, while regions with little matching fast-ion population
    are near 0 W m^-3.


    Sign convention: Positive when energy is transferred from the wave field to fast
    ions in the specified charge state.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_density
  - name:ion_state_power_density
  - name:thermal_ion_power_density
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_fast_ion_state_power_density
  sources:
