- name: per_toroidal_mode_fast_ion_power_density
  kind: scalar
  status: draft
  description: Absorbed coherent-wave power density deposited in the fast, non-thermal
    ion population, resolved by toroidal mode number and summed over fast-ion charge
    states. It quantifies each toroidal harmonic's contribution to volumetric energy
    transfer from the wave to energetic ions.
  documentation: 'Absorbed coherent-wave power density per toroidal mode is the rate
    per unit plasma volume at which one toroidal Fourier harmonic transfers energy
    to the fast, non-thermal ion population. It is summed over fast-ion charge states;
    the charge-state-resolved counterpart is [per_toroidal_mode_fast_ion_state_power_density](name:per_toroidal_mode_fast_ion_state_power_density).


    The corresponding volume-integrated per-mode fast-ion power is obtained from the
    volumetric density:


    $$

    P_\mathrm{fast}(n_\phi) = \int_V p_\mathrm{fast}(n_\phi, \mathbf{x})\,dV

    $$


    where $p_\mathrm{fast}(n_\phi, \mathbf{x})$ is this power density in W m^-3, $P_\mathrm{fast}(n_\phi)$
    is [per_toroidal_mode_fast_ion_power](name:per_toroidal_mode_fast_ion_power),
    $n_\phi$ is the toroidal mode number, $\mathbf{x}$ is spatial position, and $V$
    is the plasma volume considered. If expressed on a magnetic surface labeled by
    the flux coordinate $\rho_\mathrm{tor,norm}$, the quantity denotes the flux-surface
    average of the local volumetric density, still in W m^-3, not a volume-integrated
    power.


    In coherent-wave heating calculations, the wave field is decomposed into toroidal
    Fourier harmonics and the resonant wave-particle power transfer is evaluated against
    the fast-ion distribution. The total [fast_ion_power_density](name:fast_ion_power_density)
    is recovered by summing $p_\mathrm{fast}(n_\phi, \mathbf{x})$ over toroidal mode
    numbers, while $p_\mathrm{fast}(n_\phi, \mathbf{x}) = \sum_q p_{\mathrm{fast},q}(n_\phi,
    \mathbf{x})$ relates it to the charge-state-resolved density over fast-ion charge
    states $q$. Integrating the state-resolved densities gives [per_toroidal_mode_fast_ion_state_power](name:per_toroidal_mode_fast_ion_state_power).


    Large values occur where a toroidal harmonic has strong wave amplitude, satisfies
    the relevant resonance condition, and overlaps a substantial fast-ion phase-space
    density. The absolute scale is highly scenario dependent, so interpretation is
    usually made by comparing the integrated per-mode power, the absorbing volume,
    and the distribution of launched toroidal harmonics rather than by using a universal
    numerical range.


    Sign convention: Positive when coherent-wave energy is transferred to the fast,
    non-thermal ion population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_fast_ion_state_power_density
  - name:per_toroidal_mode_fast_electron_power_density
