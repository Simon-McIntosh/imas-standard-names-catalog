- name: vertical_coordinate_of_diagnostic_aperture
  kind: scalar
  status: active
  description: "Signed vertical coordinate of the geometric center of a diagnostic\
    \ aperture in the right-handed cylindrical (R, \u03C6, Z) frame, measured from\
    \ the machine midplane."
  documentation: 'This quantity is the vertical coordinate of the geometric center
    of a diagnostic aperture in the right-handed cylindrical $(R,phi,Z)$ frame, where
    $R$ is major radius, $phi$ is toroidal angle, and $Z$ is vertical height. The
    aperture is treated as a geometric opening rather than a plasma or wall surface.


    For an aperture region with geometric area $A$, the center coordinate is defined
    by the area centroid:


    $$

    Z_{\mathrm{c}} = \frac{1}{A}\int_A Z\,\mathrm{d}A

    $$


    where $Z_{\mathrm{c}}$ is the aperture-center coordinate, $Z$ is the vertical
    coordinate of each area element, and $\mathrm{d}A$ is the differential aperture
    area. This cylindrical-frame coordinate is distinct from the camera-frame [y coordinate
    of the diagnostic aperture](name:y_coordinate_of_diagnostic_aperture) and is the
    diagnostic-aperture-specific counterpart of [vertical coordinate of aperture](name:vertical_coordinate_of_aperture).


    Sign convention: Positive when the aperture center lies toward increasing $Z$,
    upward from the machine midplane.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_diagnostic_aperture
  - name:vertical_coordinate_of_aperture
