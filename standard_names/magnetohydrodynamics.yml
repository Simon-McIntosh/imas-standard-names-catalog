- name: poloidal_perturbed_plasma_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the poloidal projection of the first-order plasma
    magnetic-field perturbation eigenfunction for a single toroidal Fourier mode in
    linear MHD. It is the +i quadrature component relative to the specified normal-mode
    phase.
  documentation: 'This quantity is the imaginary part of the complex poloidal component
    of the first-order perturbed plasma magnetic-field eigenfunction. The component
    is the projection of the perturbation eigenfunction onto the local poloidal basis
    direction associated with the poloidal angle in flux coordinates $(s, \theta,
    \phi)$.


    Using the normal-mode convention with toroidal Fourier factor $\exp[i(n\phi -
    \omega t)]$, the poloidal component is represented by


    $$

    \delta\mathbf{B}(s,\theta,\phi,t)\cdot\hat e_\theta = \operatorname{Re}\left\{\tilde
    B_\theta(s,\theta)\exp[i(n\phi - \omega t)]\right\}, \qquad B_{\theta,\mathrm{Im}}(s,\theta)=\operatorname{Im}\{\tilde
    B_\theta(s,\theta)\}

    $$


    where $B_{\theta,\mathrm{Im}}$ is this quantity in T, $\tilde B_\theta$ is the
    complex poloidal magnetic-field perturbation eigenfunction in T, $\hat e_\theta$
    is the local poloidal unit basis direction, $n$ is a dimensionless integer toroidal
    mode number, $s$ is a dimensionless radial flux-surface label, $\theta$ is poloidal
    angle in rad, $\phi$ is toroidal angle in rad, $t$ is time in s, and $\omega$
    is the complex angular eigenfrequency in s^-1. The toroidal angle $\phi$ increases
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    In practice this quantity is computed by linear MHD stability or response calculations
    after selecting an equilibrium, a toroidal mode number, an eigenfunction normalization,
    and an overall complex phase. It is interpreted together with the corresponding
    real part, because changing the arbitrary eigenfunction phase rotates the real
    and imaginary parts into one another without changing the physical perturbation.


    There is no universal typical magnitude for this quantity: the amplitude of a
    linear eigenfunction is normalization dependent. Physically meaningful comparisons
    usually use ratios to an equilibrium magnetic-field scale, comparisons between
    components, or the reconstructed real-time perturbation obtained from the real
    and imaginary parts with the stated Fourier phase.


    Sign convention: Positive when the coefficient multiplying $+i$ in the projection
    of the complex eigenfunction onto the local $+\hat e_\theta$ poloidal basis direction
    is positive under the Fourier factor $\exp[i(n\phi - \omega t)]$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate2/imaginary
    status: composed
- name: poloidal_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex poloidal component of the vacuum magnetic-field
    perturbation eigenfunction for a specified toroidal Fourier mode in linear MHD
    stability analysis.
  documentation: 'The real part of the complex poloidal vacuum magnetic-field perturbation
    eigenfunction, $\mathrm{Re}(\delta B_\theta)$, is the in-phase component of $\delta\mathbf{B}$
    projected along the poloidal direction in the current-free vacuum region exterior
    to the plasma boundary, for a specified toroidal mode number $n$. Together with
    its companion [poloidal_perturbed_vacuum_magnetic_field_imaginary_part](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part),
    it fully specifies the complex-valued [poloidal_perturbed_vacuum_magnetic_field](name:poloidal_perturbed_vacuum_magnetic_field)
    via $\delta B_\theta = \mathrm{Re}(\delta B_\theta) + i\,\mathrm{Im}(\delta B_\theta)$.


    In the vacuum region, the perturbed field satisfies $\nabla \times \delta\mathbf{B}
    = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The poloidal component in flux coordinates
    $(\rho, \theta, \phi)$ is:


    $$

    \delta B_\theta = \delta\mathbf{B} \cdot \hat{e}_\theta

    $$


    where $\hat{e}_\theta$ is the covariant basis vector tangent to increasing poloidal
    angle $\theta$, and the toroidal dependence is carried by the Fourier factor $e^{in\phi}$.


    The vacuum eigenfunction is obtained from linear MHD stability codes that solve
    the interior plasma equations and match solutions at the plasma boundary by enforcing
    continuity of the normal field component. The decomposition into real and imaginary
    parts is phase-convention dependent; absolute magnitudes carry physical meaning
    only relative to other components within the same normalized eigenfunction. The
    sibling quantities [radial_perturbed_vacuum_magnetic_field_real_part](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    provide the other real-part projections in the vacuum, while [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part)
    is the analogous quantity inside the plasma.


    Sign convention: Positive when $\mathrm{Re}(\delta B_\theta)$ points in the direction
    of increasing poloidal angle $\theta$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  - name:poloidal_perturbed_vacuum_magnetic_field
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/real
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/real
    status: composed
- name: radial_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the radial component of the complex perturbed plasma velocity
    eigenvector for a specified toroidal Fourier mode in linear magnetohydrodynamics.
    It gives the in-phase radial fluid-velocity amplitude relative to the chosen eigenmode
    phase and normalization.
  documentation: "Radial perturbed plasma velocity real part is the real, in-phase\
    \ amplitude of the radial component of the complex velocity perturbation $\\widetilde{\\\
    mathbf v}$ for a selected toroidal Fourier mode in a linear MHD eigenmode. The\
    \ radial component is taken along the outward flux-surface radial coordinate used\
    \ by the eigenmode representation, for example $(\\rho,\\theta,\\phi)$ or $(s,\\\
    theta,\\phi)$, with $\\phi$ the toroidal angle of the right-handed cylindrical\
    \ $(R,\\phi,Z)$ frame where $R$ is major radius and $Z$ is vertical height. Because\
    \ a complex eigenvector may be multiplied by an arbitrary phase factor, this real\
    \ part is meaningful together with the corresponding imaginary part and the chosen\
    \ eigenmode normalization.\n\nNeglecting equilibrium flow and viscosity, the complex\
    \ velocity perturbation is governed by the linearized ideal-MHD momentum balance\
    \ for a perturbation proportional to $\\exp[i(n\\phi-\\omega t)]$:\n\n$$\n-i\\\
    omega \\rho_0 \\widetilde{\\mathbf v} = -\\nabla \\widetilde{p} + \\widetilde{\\\
    mathbf j}\\times \\mathbf B_0 + \\mathbf j_0\\times \\widetilde{\\mathbf B}\n\
    $$\n\nwhere $n$ is the toroidal mode number, $\\omega$ is the angular eigenfrequency\
    \ in rad s$^{-1}$, $t$ is time in s, $\\rho_0$ is the equilibrium mass density\
    \ in kg m$^{-3}$, $\\widetilde{\\mathbf v}$ is the perturbed velocity in m s$^{-1}$,\
    \ $\\widetilde p$ is the perturbed pressure in Pa, $\\widetilde{\\mathbf j}$ and\
    \ $\\mathbf j_0$ are the perturbed and equilibrium current densities in A m$^{-2}$,\
    \ and $\\mathbf B_0$ and $\\widetilde{\\mathbf B}$ are the equilibrium and perturbed\
    \ magnetic fields in T. The documented quantity is $\\operatorname{Re}(\\widetilde{\\\
    mathbf v}\\cdot\\hat{\\mathbf e}_\\rho)$ for flux coordinates $(\\rho,\\theta,\\\
    phi)$, or the analogous projection onto $\\hat{\\mathbf e}_s$ for flux coordinates\
    \ $(s,\\theta,\\phi)$.\n\nThis quantity is normally computed from linear MHD eigenvalue\
    \ calculations using an equilibrium magnetic field, pressure, density, current\
    \ profile, and boundary conditions. Physical amplitudes may be inferred by fitting\
    \ the complex eigenfunction to diagnostics sensitive to plasma motion or mode\
    \ structure, such as spectroscopic velocity measurements, reflectometry, beam-emission\
    \ measurements, or magnetic perturbation measurements; the real part is the component\
    \ in phase with the selected phase reference.\n\nBecause linear eigenvectors are\
    \ often normalized arbitrarily, numerical amplitudes can reflect the chosen normalization\
    \ rather than an absolute fluctuation level. When scaled to measured mode amplitudes,\
    \ small coherent MHD perturbations commonly have radial velocity amplitudes of\
    \ 1-10^4 m.s^-1, while strongly driven Alfv\xE9nic activity or disruption-preceding\
    \ dynamics can reach 10^4-10^5 m.s^-1.\n\nSign convention: Positive when the perturbed\
    \ radial plasma velocity points outward, toward increasing flux-surface radial\
    \ coordinate $\\rho$ or $s$."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:radial_perturbed_plasma_velocity_imaginary_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_real_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/real
    status: composed
- name: radial_perturbed_vacuum_magnetic_field
  kind: scalar
  status: draft
  description: Radial R component of the complex first-order vacuum magnetic-field
    perturbation eigenfunction in the current-free region outside the plasma, for
    a specified toroidal Fourier harmonic. The component is defined in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The radial perturbed vacuum magnetic field is the $R$ component
    of the first-order magnetic-field perturbation eigenfunction in the current-free
    vacuum region outside the plasma boundary. It describes the part of the external
    perturbation pointing along increasing major radius in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. For a toroidal harmonic, the physical perturbation is
    obtained from the real part of a complex eigenfunction with the chosen toroidal
    phase dependence.


    The component is defined by projection onto the radial basis vector:


    $$

    \delta B_R^{\mathrm{vac}} = \hat{R} \cdot \delta \mathbf{B}^{\mathrm{vac}}

    $$


    where $\delta \mathbf{B}^{\mathrm{vac}}$ is the vacuum magnetic-field perturbation
    eigenfunction in tesla, $\hat{R}$ is the unit vector in the direction of increasing
    $R$, and $\delta B_R^{\mathrm{vac}}$ is measured in tesla. In a current-free vacuum,
    $\delta \mathbf{B}^{\mathrm{vac}}$ satisfies $\nabla \times \delta \mathbf{B}^{\mathrm{vac}}
    = 0$ and $\nabla \cdot \delta \mathbf{B}^{\mathrm{vac}} = 0$, so it may be represented
    through a scalar magnetic potential satisfying Laplace''s equation.


    This quantity is usually computed as part of a linear MHD eigenvalue or response
    calculation by solving the external vacuum field problem, often using harmonic
    expansions or Green-function methods together with conducting-wall or open-boundary
    conditions. The boundary condition at the plasma-vacuum interface involves continuity
    of the normal magnetic perturbation, $\mathbf{n} \cdot \delta \mathbf{B}$; $\delta
    B_R^{\mathrm{vac}}$ contributes to that normal projection according to the local
    boundary geometry but is not itself generally the boundary-normal component.


    No intrinsic typical magnitude exists for this eigenfunction component, because
    linear MHD eigenfunctions have arbitrary overall normalization and phase. Reported
    values depend on the chosen normalization, such as a specified boundary displacement,
    a maximum perturbed field amplitude, or an imposed external perturbation; for
    a fixed normalization they may span many orders of magnitude in tesla.


    Sign convention: Positive when the vacuum magnetic-field perturbation points in
    the $+\hat{R}$ direction, toward increasing major radius $R$, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_vacuum_magnetic_field
  - name:radial_perturbed_vacuum_magnetic_field_real_part
