- name: atomic_mass_of_element
  kind: scalar
  status: draft
  description: Atomic mass of a chemical element expressed in atomic mass units (u),
    where 1 u is defined as 1/12 the mass of a carbon-12 atom. For a pure isotope,
    this equals approximately the integer mass number (total nucleon count). Together
    with the nuclear charge number, it fully specifies an isotopic species.
  documentation: "The atomic mass $A$ of a chemical element is the mass of a single\
    \ atom measured in atomic mass units ($\\mathrm{u}$), where $1\\,\\mathrm{u} =\
    \ \\tfrac{1}{12}\\,m({}^{12}\\mathrm{C}) \\approx 1.6605 \\times 10^{-27}\\,\\\
    mathrm{kg}$. For a pure isotope, $A$ is close to but not exactly equal to the\
    \ integer mass number $A_0 = Z + N$ (proton count plus neutron count), because\
    \ nuclear binding energy contributes a small fractional correction via the mass\u2013\
    energy relation.\n\nThe inertial mass of a particle of species $s$ is $m_s = A_s\
    \ \\cdot m_u$, so $A$ enters directly into the momentum $p = A\\,m_u\\,v$ and\
    \ kinetic energy $E_k = \\tfrac{1}{2}A\\,m_u\\,v^2$ of incident ions or neutrals\
    \ at material surfaces. An isotope is uniquely identified only by the pair $(A,\
    \ Z)$; $A$ alone is insufficient because different elements can share nearly identical\
    \ atomic masses.\n\nTypical values span from $A \\approx 1\\,\\mathrm{u}$ for\
    \ hydrogen isotopes (protium, deuterium $\\approx 2\\,\\mathrm{u}$, tritium $\\\
    approx 3\\,\\mathrm{u}$) through $A \\approx 4\\,\\mathrm{u}$ for helium-4, up\
    \ to $A \\approx 183\\,\\mathrm{u}$ for tungsten (the primary first-wall material\
    \ in many devices) and beyond $A > 200\\,\\mathrm{u}$ for heavy impurities. Values\
    \ are taken from standard nuclear data tables rather than measured in situ.\n\n\
    In plasma\u2013wall interaction models, $A$ is used together with [nuclear_charge_number_of_element](name:nuclear_charge_number_of_element)\
    \ to fully characterize an isotopic species, and with [atoms_per_molecule_of_element](name:atoms_per_molecule_of_element)\
    \ to compute the molecular mass of multi-atom gas species encountered in fuel\
    \ recycling and impurity injection scenarios."
  unit: u
  physics_domain: plasma_wall_interactions
  links:
