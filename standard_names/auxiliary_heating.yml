- name: per_toroidal_mode_thermal_ion_state_power_density
  kind: scalar
  status: draft
  description: Absorbed coherent-wave power density deposited on a specified thermal
    ion charge state, separated by toroidal mode number. It is the volumetric counterpart
    of per-mode charge-state thermal-ion power; summing over modes gives the total
    charge-state thermal-ion power density.
  documentation: 'Per-toroidal-mode thermal ion state power density is the volumetric
    rate at which a coherent wave deposits energy into a specified charge state of
    the thermal ion population, resolved by toroidal harmonic. The toroidal mode number
    $n_\phi$ labels the Fourier harmonic of the wave field in the toroidal angle $\phi$
    of the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. It is the density counterpart of [per_toroidal_mode_thermal_ion_state_power](name:per_toroidal_mode_thermal_ion_state_power).


    The per-mode deposited power density can be expressed as the wave-period-averaged
    electromagnetic work done on the charge-state current response by that harmonic:


    $$

    p_{i,s,n_\phi}(\mathbf{x}) = \left\langle \mathbf{J}_{i,s,n_\phi}(\mathbf{x},t)
    \cdot \mathbf{E}_{n_\phi}(\mathbf{x},t) \right\rangle_t

    $$


    where $p_{i,s,n_\phi}$ is in W m^-3, $s$ labels the ion charge state, $\mathbf{x}$
    is position, $\mathbf{E}_{n_\phi}$ is the electric field of harmonic $n_\phi$
    in V m^-1, $\mathbf{J}_{i,s,n_\phi}$ is the associated thermal-ion charge-state
    current density in A m^-2, and $\langle\cdot\rangle_t$ denotes averaging over
    the wave period. The total charge-state thermal-ion power density is $p_{i,s}=\sum_{n_\phi}
    p_{i,s,n_\phi}$; integrating $p_{i,s,n_\phi}$ over a chosen plasma volume gives
    the corresponding per-mode charge-state thermal-ion power.


    In practice, this quantity is computed from coherent-wave field solutions by separating
    the field into toroidal harmonics, evaluating resonant and collisional damping
    on the thermal ion distribution for each charge state, and assigning the resulting
    energy transfer to the local or flux-surface-averaged volumetric source term.
    Summing over charge states gives the thermal-ion per-mode power density, while
    analogous source terms describe fast-ion and thermal-electron absorption.


    Typical magnitudes are strongly scenario dependent. Values are near 0 W m^-3 outside
    absorbing regions and can reach order 10^3-10^7 W m^-3 in localized radio-frequency
    absorption regions; individual toroidal harmonics are usually smaller than the
    mode-summed charge-state value.


    Sign convention: Positive when electromagnetic work by the coherent wave increases
    the thermal energy of the specified ion charge state.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
