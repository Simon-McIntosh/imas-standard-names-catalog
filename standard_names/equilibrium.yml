- name: vertical_non_axisymmetric_magnetic_field
  kind: scalar
  status: active
  description: Vertical non-axisymmetric magnetic field is the signed Z component
    of the toroidally varying external-coil vacuum field after its toroidally averaged
    component is removed.
  documentation: 'Vertical non-axisymmetric magnetic field is the vertical component
    of the toroidally varying part of the external-coil vacuum magnetic field in the
    right-handed cylindrical $(R,\phi,Z)$ frame. It is the signed Z-directed projection
    of the [non-axisymmetric magnetic field](name:non_axisymmetric_magnetic_field),
    not the total magnetic field.


    At fixed major radius and vertical height, its defining toroidal-mean subtraction
    is


    $$

    B_{\mathrm{na},Z}(R,\phi,Z)=B_{\mathrm{vac},Z}(R,\phi,Z)-\frac{1}{2\pi}\int_{0}^{2\pi}B_{\mathrm{vac},Z}(R,\phi'',Z)\,d\phi''

    $$


    where $B_{\mathrm{na},Z}$ is the vertical non-axisymmetric component, $B_{\mathrm{vac},Z}$
    is the vertical vacuum-field component, $R$ and $Z$ are major-radius and vertical
    coordinates measured in meters, and $\phi$ and $\phi''$ are toroidal angles measured
    in radians.


    The quantity excludes the toroidally averaged vacuum field and any plasma-response
    field. It is distinct from the [radial non-axisymmetric magnetic field](name:radial_non_axisymmetric_magnetic_field),
    which is the corresponding radial projection.


    Sign convention: Positive when $B_{\mathrm{na},Z}$ points in the $+Z$ direction
    of the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ basis.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:non_axisymmetric_magnetic_field
  - name:radial_non_axisymmetric_magnetic_field
  arguments:
