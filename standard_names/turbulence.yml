- name: perpendicular_normalized_particle_perturbed_energy
  kind: scalar
  status: draft
  description: Dimensionless velocity-space moment of the perturbed particle distribution
    weighted by 0.5 times the species mass, the squared perpendicular speed, and the
    total speed squared. It measures the perpendicular-speed-weighted kinetic response
    of a linear gyrokinetic eigenmode relative to the chosen normalization.
  documentation: 'Perpendicular normalized particle perturbed energy is a dimensionless
    moment of the perturbed particle distribution for a species in a linear gyrokinetic
    eigenmode. Its weighting is the total kinetic-energy factor multiplied by squared
    speed perpendicular to the local magnetic field; it is not the product of perpendicular
    kinetic energy and total kinetic energy.


    The normalized moment may be written as


    $$

    M_{\perp E,s} = \frac{1}{N_{\perp E,s}} \int \frac{1}{2} m_s v_\perp^2 v^2 \,
    \delta f_s(\mathbf{v}) \, d^3v

    $$


    where $m_s$ is the species mass, $v_\perp$ is the particle speed perpendicular
    to the local magnetic field, $v^2 = v_\parallel^2 + v_\perp^2$ is the total speed
    squared, $\delta f_s$ is the perturbed particle distribution with units $s^3 m^{-6}$,
    and $d^3v$ has units $m^3 s^{-3}$. The normalization factor $N_{\perp E,s}$ has
    units $kg\,m\,s^{-4}$, matching the unnormalized integral, so that $M_{\perp E,s}$
    has unit 1.


    This quantity is computed from the velocity-space representation of the linear
    eigenfunction by numerical quadrature over $\delta f_s$. It is mainly used to
    compare how strongly different species or modes populate high-perpendicular-speed
    parts of velocity space, relative to the selected eigenmode normalization.


    No device-independent numerical range is physically meaningful for this normalized
    moment. A linear eigenmode can be multiplied by an arbitrary real or complex amplitude,
    and this moment scales by the same factor; therefore only comparisons made with
    the same normalization and eigenfunction phase convention are physically meaningful.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_energy
  - name:parallel_normalized_particle_perturbed_pressure
  - name:normalized_particle_perturbed_energy
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    status: composed
- name: perpendicular_normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: draft
  description: Dimensionless perpendicular pressure moment of the perturbed gyrocenter
    distribution for a linear gyrokinetic eigenmode, weighted by the first-order Bessel
    function J1 of the gyroaveraging argument. It is the Bessel-1 counterpart of the
    normalized perpendicular gyrocenter pressure perturbation.
  documentation: 'The perpendicular normalized perturbed pressure Bessel-1 moment
    is the perpendicular kinetic-energy moment of the perturbed gyrocenter distribution
    weighted by $J_1$. It represents the finite-Larmor-radius part of the perpendicular
    pressure response of a linear gyrokinetic eigenmode and is generally a complex
    eigenfunction amplitude.


    The normalized moment is defined by


    $$

    \hat{\delta p}_{\perp,J_1} = \frac{1}{n_\mathrm{ref} T_\mathrm{ref}} \int_{\mathbb{R}^3}
    \frac{m v_\perp^2}{2}\, J_1\!\left(k_\perp \rho(v_\perp)\right)\, \delta f_\mathrm{gc}(\mathbf{v})\,
    d^3v

    $$


    where $\hat{\delta p}_{\perp,J_1}$ is dimensionless, $n_\mathrm{ref}$ is the reference
    density in $\mathrm{m}^{-3}$, and $T_\mathrm{ref}$ is the reference particle energy
    so that $n_\mathrm{ref}T_\mathrm{ref}$ is a reference pressure. Here $m$ is the
    species mass in kg, $v_\perp$ is the speed perpendicular to the background magnetic
    field in $\mathrm{m\,s}^{-1}$, $J_1$ is the dimensionless first-order Bessel function,
    $k_\perp$ is the perpendicular wave-number magnitude in $\mathrm{m}^{-1}$, and
    $\rho(v_\perp)=v_\perp/|\Omega|$ is the velocity-dependent gyroradius in meters
    for cyclotron angular frequency $\Omega$ in $\mathrm{s}^{-1}$. The perturbed gyrocenter
    distribution $\delta f_\mathrm{gc}$ has units $\mathrm{s}^3\,\mathrm{m}^{-6}$,
    and the velocity-space measure $d^3v$ has units $\mathrm{m}^3\,\mathrm{s}^{-3}$;
    using velocity variables $(v_\parallel,v_\perp,\alpha)$, $d^3v = v_\perp\,dv_\perp\,d\alpha\,dv_\parallel$,
    with $v_\parallel$ the velocity along the background magnetic field and $\alpha$
    the gyroangle.


    This quantity is computed from the eigenmode distribution function by carrying
    out the velocity-space moment for each species and wave vector. It is not a directly
    measured thermodynamic pressure; experimental fluctuation measurements may constrain
    related density, temperature, or field perturbations, while this gyrocenter moment
    is obtained through gyrokinetic interpretation or simulation.


    The $J_1$ weighting separates a finite-Larmor-radius contribution from the unweighted
    or $J_0$-gyroaveraged perpendicular pressure moments, linking it to related quantities
    such as [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)
    and [perpendicular_normalized_gyrocenter_gyroaveraged_pressure](name:perpendicular_normalized_gyrocenter_gyroaveraged_pressure).
    The complementary parallel contribution is [parallel_normalized_perturbed_pressure_bessel_1](name:parallel_normalized_perturbed_pressure_bessel_1),
    and their combination gives the corresponding total Bessel-1 pressure moment.


    There is no normalization-independent typical magnitude for a linear eigenmode,
    because multiplying the eigenfunction by any nonzero complex constant rescales
    this moment. Values are therefore interpreted as relative complex amplitudes only
    after the eigenmode amplitude and phase have been fixed by the chosen normalization.


    Sign convention: Positive when, after the eigenmode phase has been fixed by the
    selected reference perturbation, the Bessel-weighted excess of perpendicular gyrocenter
    kinetic energy in the defining velocity-space integral is positive.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_perturbed_pressure
  - name:perpendicular_normalized_gyrocenter_gyroaveraged_pressure
  - name:parallel_normalized_perturbed_pressure_bessel_1
  - name:normalized_perturbed_pressure_bessel_1
  sources:
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure_perpendicular
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure_perpendicular
    status: composed
- name: radial_derivative_of_elongation_of_flux_surface
  kind: scalar
  status: draft
  description: Radial rate of change of the flux surface elongation kappa with respect
    to normalized minor radius, measuring how rapidly the poloidal cross-section aspect
    ratio varies across nested flux surfaces.
  documentation: 'The radial derivative of flux surface elongation quantifies how
    the vertical-to-horizontal shape of nested toroidal magnetic surfaces changes
    as a function of radial position. The flux surface elongation $\kappa$ equals
    the ratio of the vertical to horizontal semi-axis of the poloidal cross-section,
    so its radial derivative captures the rate at which flux surfaces become more
    (or less) vertically elongated moving outward from the magnetic axis.


    The quantity is defined as:


    $$

    \frac{d\kappa}{d\hat{r}}

    $$


    where $\kappa$ is the [elongation of the flux surface](name:elongation_of_flux_surface)
    and $\hat{r}$ is the normalized minor radius running from 0 at the magnetic axis
    to 1 at the plasma boundary. Both $\kappa$ and $\hat{r}$ are dimensionless, so
    the derivative is also dimensionless.


    This derivative is a required geometric input to local gyrokinetic flux-tube simulations,
    entering the metric coefficients that govern field-line curvature and grad-$B$
    drift terms within the flux-tube domain. It belongs to the broader family of radial
    flux surface shape coefficient derivatives that also includes the [radial derivative
    of flux surface shape coefficient](name:radial_derivative_of_elongation_of_flux_surface).
    In plasmas with significant edge shaping, this quantity grows in magnitude toward
    the separatrix, while remaining near zero for nearly circular flux surfaces where
    $\kappa \approx 1$ throughout the minor radius.


    Sign convention: Positive when the elongation $\kappa$ increases with increasing
    normalized minor radius $\hat{r}$, corresponding to flux surfaces that become
    more vertically elongated toward the plasma boundary.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:elongation_of_flux_surface
  arguments:
  - name: elongation_of_flux_surface
    operator: radial_derivative
    operator_kind: unary_prefix
  sources:
  - id: dd:gyrokinetics_local/flux_surface/delongation_dr_minor_norm
    dd_path: gyrokinetics_local/flux_surface/delongation_dr_minor_norm
    status: attached
