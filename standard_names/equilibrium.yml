- name: lower_triangularity
  kind: scalar
  status: draft
  description: Dimensionless measure of the inward or outward horizontal displacement
    of the lower plasma-boundary apex relative to the reference axis and minor radius.
  documentation: 'Lower triangularity describes the geometric shaping of the lower
    half of a tokamak plasma cross-section. It complements [upper triangularity](name:upper_triangularity)
    and contributes to the overall boundary distortion summarized by [triangularity](name:triangularity),
    with stronger positive values corresponding to a more D-shaped lower boundary.


    A common definition uses the right-handed cylindrical $(R, \phi, Z)$ system, where
    $R$ is major radius and $Z$ is vertical height:


    $$

    \delta_l = \frac{R_{\rm ref} - R_l}{a}

    $$


    where $R_{\rm ref}$ is the reference-axis major radius, $R_l$ is the major radius
    of the lower boundary apex, and $a$ is the minor radius used for the same flux
    surface or boundary. Alternative equilibrium conventions may choose the magnetic
    axis or geometric axis for $R_{\rm ref}$, but the quantity remains a dimensionless
    lower-boundary shaping parameter.


    Lower triangularity is computed from reconstructed magnetic equilibria by fitting
    or tracing the plasma boundary contour constrained by magnetic measurements, pressure
    information, and internal magnetic diagnostics when available. It is used with
    [inner triangularity](name:inner_triangularity) and [outer triangularity](name:outer_triangularity)
    to distinguish localized shaping from a single global boundary descriptor.


    Representative values in diverted tokamaks range from about -0.2 to 0.6, with
    advanced-shape plasmas often operating near 0.2-0.5 in the lower half. Near-zero
    values correspond to an approximately elliptical lower boundary, while negative
    values indicate outward displacement of the lower apex.


    Sign convention: Positive when the lower extremum of the plasma boundary lies
    at smaller major radius $R$ than the reference axis used in the triangularity
    definition.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity
  - name:triangularity
  - name:inner_triangularity
  - name:outer_triangularity
  sources:
