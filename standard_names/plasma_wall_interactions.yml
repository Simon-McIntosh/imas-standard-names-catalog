        energy type (cold, thermal, fast), expressed in equivalent electrons. Represents
        wall recycling and outgassing contributions to the global particle balance.
      kind: llm
- name: surface_area_of_optical_element
  kind: scalar
  status: active
  description: Geometric area of the specified optically active material surface of
    an optical element, measured on the physical surface rather than as its projected
    aperture.
  documentation: 'This quantity is the geometric area contributed by one specified
    optically active surface of an optical element. It is a component of the total
    [area of the optical element](name:area_of_optical_element), not the projected
    clear-aperture area.


    The component area is defined by


    $$

    A_c = \int_{\mathcal{S}_c} dA

    $$


    where $\mathcal{S}_c$ is the specified physical material surface and $dA$ is its
    differential surface-area element. The surface may be curved or planar. Inactive
    material regions and projected-area representations are excluded; when the active
    surfaces form a disjoint partition, their component areas sum to the total optical-element
    area.'
  unit: m^2
  physics_domain: plasma_wall_interactions
