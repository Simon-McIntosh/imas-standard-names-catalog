name: pulse_number
status: draft
cocos_transformation_type: one_like
description: Unique integer identifying a specific experimental discharge or simulation
  pulse within a facility's shot database.
documentation: "The pulse number is the primary key used by fusion facilities to catalog\
  \ individual plasma discharges. Together with the machine identifier and the run\
  \ number, it forms the minimal tuple (machine, pulse, run) that uniquely locates\
  \ any dataset in the archival system. Pulse numbers are monotonically increasing\
  \ within a given device campaign; typical tokamak databases contain $10^{4}$\u2013\
  $10^{5}$ pulses (e.g., JET exceeds 100 000, ASDEX Upgrade ~42 000 as of 2024). For\
  \ simulation entries, the pulse number may be assigned by convention or mirror the\
  \ reference experimental shot. See also `data_entry_run_number` for the associated\
  \ run identifier."
validity_domain: ''
constraints: []
tags:
