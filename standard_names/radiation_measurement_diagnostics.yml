      kind: template
- name: wavelength_of_camera
  kind: scalar
  status: active
  description: Spectral wavelength characterizing a camera detector channel's optical
    response band, encompassing characteristic wavelengths such as band-edge cutoffs
    that define the channel's sensitivity range.
  documentation: 'Wavelength of a camera is the spectral coordinate, expressed as
    vacuum wavelength, that identifies a characteristic position within a camera detector
    channel''s spectral sensitivity band. As a parent quantity, it encompasses any
    fiducial wavelength associated with the camera''s optical response, including
    upper and lower sensitivity cutoffs.


    For a monochromatic wave in vacuum, wavelength relates to optical frequency by


    $$

    \lambda = \frac{c}{\nu}

    $$


    where $\lambda$ is the vacuum wavelength in meters, $c$ is the speed of light
    in vacuum in meters per second, and $\nu$ is the optical frequency in hertz.


    The specific instance [upper_bound_wavelength_of_camera](name:upper_bound_wavelength_of_camera)
    identifies the long-wavelength (red-side) cutoff above which photons fall outside
    the detector response. This parallels [wavelength_of_filter](name:wavelength_of_filter),
    which similarly encompasses passband edge and center wavelengths for optical filters;
    both quantities share the same physical definition of vacuum wavelength but differ
    in the optical element and response characteristic they describe.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_bound_wavelength_of_camera
  - name:wavelength_of_filter
  arguments:
  - name: wavelength
    operator: camera
    operator_kind: locus
- name: upper_bound_wavelength_of_camera
  kind: scalar
  status: active
  description: "Long-wavelength boundary of a visible-camera detector channel\u2019\
    s spectral sensitivity band; photons at longer wavelengths fall outside the defined\
    \ response interval."
  documentation: "The red-side cutoff is the long-wavelength boundary of a visible-camera\
    \ detector channel\u2019s spectral sensitivity band. It identifies the upper endpoint\
    \ of the characteristic wavelength range represented by [wavelength of camera](name:wavelength_of_camera).\n\
    \nFor a band with short-wavelength boundary $\\lambda_{\\rm blue}$ and long-wavelength\
    \ boundary $\\lambda_{\\rm red}$, the sensitivity interval is represented by\n\
    \n$$\n\\Lambda_{\\rm camera} = [\\lambda_{\\rm blue},\\lambda_{\\rm red}]\n$$\n\
    \nwhere $\\Lambda_{\\rm camera}$ is the defined vacuum-wavelength sensitivity\
    \ interval and both boundary wavelengths are measured in m.\n\nThis quantity is\
    \ a band edge, not a central wavelength or bandwidth. Photons with vacuum wavelength\
    \ greater than $\\lambda_{\\rm red}$ lie beyond the defined detector response\
    \ interval."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_camera
