- name: z_component_of_second_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Projection of the second local unit vector of the electron cyclotron
    launcher mirror orientation frame onto the vertical axis $\hat{z}$ of the right-handed
    Cartesian frame, where $\hat{z}$ coincides with the machine vertical direction
    $\hat{Z}$.
  documentation: 'The Z component $\hat{e}_{2,z}$ is the projection of the second
    axis of the orthonormal triad $\{\hat{e}_1, \hat{e}_2, \hat{e}_3\}$ onto the vertical
    direction $\hat{z}$, which coincides with $\hat{Z}$ in the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame. Together with the Y component [y_component_of_second_unit_vector_of_electron_cyclotron_launcher_mirror](name:y_component_of_second_unit_vector_of_electron_cyclotron_launcher_mirror),
    this component fully specifies the second unit vector in the plane perpendicular
    to $\hat{x}$, completing the [second_unit_vector_of_electron_cyclotron_launcher_mirror](name:second_unit_vector_of_electron_cyclotron_launcher_mirror).
    Because $\hat{e}_2$ is a unit vector, the identity $\hat{e}_{2,x}^2 + \hat{e}_{2,y}^2
    + \hat{e}_{2,z}^2 = 1$ must hold; values of this component are therefore constrained
    to $[-1, 1]$. In conjunction with [z_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror](name:z_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [z_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror](name:z_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror),
    this quantity defines the full third row of the rotation matrix that transforms
    between the mirror local frame and the laboratory Cartesian frame, directly determining
    the vertical component of the beam steering geometry for electron cyclotron heating
    calculations.


    Sign convention: Positive when the second unit vector $\hat{e}_2$ has a component
    pointing in the $+\hat{z}$ (upward) direction of the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:y_component_of_second_unit_vector_of_electron_cyclotron_launcher_mirror
  - name:second_unit_vector_of_electron_cyclotron_launcher_mirror
