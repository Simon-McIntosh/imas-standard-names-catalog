- name: frequency_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Operating radio frequency of a lower-hybrid antenna is the non-negative
    carrier frequency assigned to that antenna. It sets the launched wave angular
    frequency and helps constrain lower-hybrid accessibility and electron parallel-resonance
    conditions.
  documentation: 'Operating radio frequency of a lower-hybrid antenna is the non-negative
    carrier frequency assigned to that antenna. It sets the temporal oscillation rate
    of the lower-hybrid electromagnetic wave at launch and is one of the quantities
    that determines the wave dispersion, accessibility, and resonant interaction with
    electrons.


    The frequency fixes the RF angular frequency and, with the launched parallel wave
    number, the parallel phase velocity sampled by Landau-resonant electrons:


    $$

    \omega_\mathrm{RF} = 2\pi f_\mathrm{LH,ant}, \qquad

    v_{\parallel,\mathrm{ph}} = \frac{\omega_\mathrm{RF}}{k_\parallel} = \frac{c}{n_\parallel}

    $$


    where $f_\mathrm{LH,ant}$ is this antenna frequency, $\omega_\mathrm{RF}$ is the
    launched wave angular frequency, $k_\parallel$ is the launched parallel wave number,
    $n_\parallel$ is the launched parallel refractive index, and $c$ is the speed
    of light.


    The lower-hybrid interpretation requires this carrier to be considered relative
    to the cold-plasma lower-hybrid resonance and accessibility conditions for the
    plasma composition, density, and magnetic field. It is distinct from launched
    wave-index components such as [toroidal launched wave index](name:toroidal_launched_wave_index_of_lower_hybrid_antenna)
    and [poloidal launched wave index](name:poloidal_launched_wave_index_of_lower_hybrid_antenna),
    which describe direction or phase spectrum, and from modulation, sideband, or
    bandwidth quantities.'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_lower_hybrid_antenna
  sources:
  - dd_path: lh_antennas/antenna/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-frequency
    dd_documentation:
      leaf: Frequency
      parent_path: lh_antennas/antenna
      parent: Set of Lower Hybrid antennas
      data_type: FLT_0D
      unit: Hz
    enhanced_context:
      description: Operating frequency of a lower hybrid (LH) antenna. Sets the wave
        frequency relative to the lower hybrid resonance, determining wave penetration
        depth and current drive efficiency in the plasma.
      kind: llm
  - dd_path: summary/heating_current_drive/lh/frequency/value
