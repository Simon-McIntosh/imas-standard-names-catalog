- name: tritium_breeding_ratio_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: 'Per-module contribution to blanket tritium breeding ratio: tritium
    atoms produced in a breeder blanket module divided by the common incident fusion-neutron
    count used for the blanket normalization. It is dimensionless and additive across
    modules when all modules use that same denominator.'
  documentation: 'The tritium breeding ratio of a breeder blanket module is the module-resolved
    contribution to blanket tritium production. It counts tritium atoms generated
    in one module per incident fusion neutron used for the overall blanket normalization,
    so it is not normalized separately to the neutrons entering only that module.


    The module contribution can be written using particle rates over a common time
    basis:


    $$

    \mathrm{TBR}_m = \frac{\dot{N}_{T,m}}{\dot{N}_{n,\mathrm{inc}}}

    $$


    where $\dot{N}_{T,m}$ is the tritium-atom production rate in module $m$, in s^-1,
    and $\dot{N}_{n,\mathrm{inc}}$ is the common incident fusion-neutron rate used
    to normalize the blanket tritium breeding ratio, in s^-1. Equivalent particle
    counts over the same time interval may be used instead; the numerator and denominator
    are then both counts, and the ratio has unit 1.


    In practice, $\dot{N}_{T,m}$ is obtained from neutronics transport and nuclear-response
    calculations by integrating tritium-producing reaction-rate densities over the
    breeder regions of the module. The same denominator must be used for every module,
    so summing module values gives the corresponding contribution to the overall [tritium_breeding_ratio](name:tritium_breeding_ratio).
    The value is commonly interpreted together with module nuclear-load quantities
    such as [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    because neutron power indicates source strength while material composition and
    neutron spectrum determine how effectively that source breeds tritium.


    Typical additive module values depend strongly on how the blanket is subdivided.
    Small replaceable modules may contribute about 10^-4-10^-2, larger sector-scale
    modules about 0.01-0.5, and the sum over a full breeding blanket is generally
    of order 1 in reactor design studies. Values are dimensionless and vary with module
    solid angle coverage, lithium enrichment, multiplier content, structural fraction,
    coolant, and neutron leakage.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio
  - name:nuclear_heating_power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/tritium_breeding_ratio
    dd_path: breeding_blanket/module/time_slice/tritium_breeding_ratio
    status: composed
- name: upper_thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Upper thickness of a breeder blanket module is the non-negative projected
    separation between the module's upper exterior end boundary and the interface
    where the upper cap joins the main module body, measured along the specified upper-cap
    thickness direction. It characterizes the geometric thickness of the upper end
    cap.
  documentation: 'Upper thickness of a breeder blanket module is the geometric thickness
    of the upper cap that closes the module at its upper end. The reference surfaces
    are the upper exterior end boundary of the cap and the cap-to-module interface
    where the cap joins the main blanket body; the thickness is measured as a projected
    separation along the specified upper-cap thickness direction, not as an arbitrary
    point-to-point distance between inner and outer surfaces.


    For a local cap-thickness direction $\hat{\mathbf{n}}_\mathrm{u}$, the projected
    thickness is


    $$

    t_\mathrm{u} = \left|\left(\mathbf{x}_\mathrm{end} - \mathbf{x}_\mathrm{int}\right)
    \cdot \hat{\mathbf{n}}_\mathrm{u}\right|

    $$


    where $t_\mathrm{u}$ is the upper cap thickness, $\mathbf{x}_\mathrm{end}$ is
    a point on the upper exterior end boundary, $\mathbf{x}_\mathrm{int}$ is the corresponding
    point on the cap-to-module interface, and $\hat{\mathbf{n}}_\mathrm{u}$ is the
    unit direction used to define the upper-cap thickness. The absolute value reflects
    that this scalar is a non-negative length.


    In engineering definitions the value is taken from the module geometry or design
    specification. For a tapered or spatially varying upper cap, the scalar denotes
    the specified nominal projected thickness, commonly the representative average
    over the cap region or the value at the design reference section; local maxima,
    minima, and detailed shape variations are separate geometric information.


    This quantity is related to the overall [breeder blanket module thickness](name:thickness_of_breeder_blanket_module),
    to the analogous [lower cap thickness](name:lower_thickness_of_breeder_blanket_module),
    and to individual [breeder blanket layer thicknesses](name:thickness_of_breeder_blanket_layer).
    It is reported in meters and is design-specific; no universal device-independent
    numerical range is implied.'
  unit: m
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio_of_breeder_blanket_module
  - name:thickness_of_breeder_blanket_module
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: upper
    operator_kind: qualifier
  sources:
  - id: dd:breeding_blanket/module/top_cap_thickness
    dd_path: breeding_blanket/module/top_cap_thickness
    status: composed
- name: vertical_outline_of_limiter_tile
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the contour points tracing the poloidal
    cross-sectional outline of a limiter tile.
  documentation: 'The vertical outline of a limiter tile provides the ordered set
    of $Z$ coordinates that, paired with the corresponding radial coordinates, trace
    the poloidal cross-sectional boundary of an individual limiter tile. Limiter tiles
    are plasma-facing solid components that can establish the last-closed flux surface
    in limited plasma configurations, physically protecting the first wall from direct
    high-heat-flux plasma contact.


    The outline is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is the major radius measured from the machine symmetry axis and $Z$ is the
    vertical height relative to the device midplane. Each point in the outline array
    corresponds to a vertex on the tile boundary contour in the poloidal plane, and
    the complete set of $(R, Z)$ pairs fully specifies the tile cross-section geometry.


    These coordinates are obtained from engineering drawings, CAD models, or in-vessel
    metrology, and are applied in heat load mapping, plasma-wall gap analysis, and
    geometric boundary modeling. The analogous outline coordinates for divertor components
    follow the same convention as [vertical_outline_of_divertor_tile](name:vertical_outline_of_divertor_tile),
    and the equivalent representation for mobile wall components is [vertical_outline_of_wall_material](name:vertical_outline_of_wall_material).
    The active contact point of a limited plasma with the limiter surface is tracked
    separately by [vertical_coordinate_of_active_limiter_point](name:vertical_coordinate_of_active_limiter_point).


    Typical $Z$ values for limiter tiles range from approximately $-3$ m to $+3$ m
    depending on the tile''s poloidal location and the machine size.


    Sign convention: Positive when $Z$ points upward in the $+\hat{Z}$ direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_divertor_tile
  - name:vertical_outline_of_wall_material
  - name:vertical_coordinate_of_active_limiter_point
  sources:
  - id: dd:wall/description_2d/limiter/unit/outline/z
    dd_path: wall/description_2d/limiter/unit/outline/z
    status: composed
- name: vertical_outline_of_wall_material
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the outline polygon that defines the poloidal
    cross-sectional boundary of a mobile wall material component.
  documentation: "The vertical $Z$-coordinate locates each vertex of the polygon that\
    \ traces the cross-sectional shape of a mobile wall material element in the poloidal\
    \ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the\
    \ major radius measured from the symmetry axis and $Z$ is the vertical height.\
    \ The complete poloidal outline is formed by a sequence of $(R, Z)$ vertex pairs;\
    \ this quantity captures the $Z$ component of those vertices, complementing the\
    \ corresponding major-radius component of the same outline. Mobile wall components\
    \ are plasma-facing structural elements \u2014 such as retractable limiters or\
    \ adjustable tiles \u2014 whose positions may vary, making accurate outline tracking\
    \ essential for equilibrium reconstruction and plasma-wall gap analysis. For fixed\
    \ structural elements, analogous $Z$ outline coordinates are provided by [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile),\
    \ [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel),\
    \ and [vertical_outline_of_divertor_tile](name:vertical_outline_of_divertor_tile).\
    \ Typical values span the vertical extent of the vacuum vessel, generally within\
    \ $\\pm 3$ m for medium-sized tokamaks.\n\nSign convention: Positive when the\
    \ outline vertex lies above the geometric midplane in the $+Z$ direction of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: structural_components
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:vertical_outline_of_divertor_tile
  sources:
  - id: dd:wall/description_2d/mobile/unit/outline/z
    dd_path: wall/description_2d/mobile/unit/outline/z
