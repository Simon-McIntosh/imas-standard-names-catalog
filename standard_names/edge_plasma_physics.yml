- name: neutral_state_effective_momentum_convection_velocity
  kind: vector
  status: draft
  description: Effective velocity vector used in a fluid closure for convective momentum
    transport of one resolved neutral state. It sets the transport direction and speed
    multiplying the neutral momentum density in the convective momentum-flux tensor.
  documentation: 'The neutral state effective momentum convection velocity is the
    vector velocity assigned to the convective transport of momentum for a single
    resolved neutral population state. It is a closure quantity: it need not be identical
    to the bulk neutral flow velocity, but it has the same physical dimensions and
    determines how that state''s momentum is carried through space in the model.


    A common dyadic closure for the convective momentum-flux tensor is


    $$

    \Pi^{(a)}_{\mathrm{conv},ij} = m_a n_a v^{(a)}_{\mathrm{mom},i} u^{(a)}_j

    $$


    where $a$ labels the resolved neutral state, $\Pi^{(a)}_{\mathrm{conv},ij}$ is
    the convective flux of the $j$-th momentum component across a surface normal to
    the $i$ direction in kg.m^-1.s^-2, $m_a$ is the neutral particle mass in kg, $n_a$
    is the neutral number density in m^-3, $v^{(a)}_{\mathrm{mom},i}$ is the $i$-th
    component of this effective momentum convection velocity in m.s^-1, and $u^{(a)}_j$
    is the $j$-th component of the neutral fluid velocity in m.s^-1. With this convention
    the dyadic product orders the transport direction first and the transported momentum
    component second.


    This quantity is generally obtained from a neutral-fluid or coupled edge-plasma
    transport closure rather than measured directly. The relation between this state-resolved
    velocity and an aggregate neutral effective momentum convection velocity is model-dependent;
    the aggregate represents a population-combined momentum-transport closure and
    is not necessarily a simple arithmetic average of the state-resolved values.


    No universal numerical range exists because the value depends on the neutral-state
    definition, collision rates, recycling source, and closure assumptions. In edge-plasma
    and divertor fluid modeling, component magnitudes are often of order 10^2-10^4
    m.s^-1, with larger values possible when the effective transport follows faster
    neutral drift or thermal motion.


    Sign convention: Positive when a component points along the positive basis direction
    used for that component; in the right-handed cylindrical $(R, \phi, Z)$ frame,
    positive components point toward increasing $R$, increasing toroidal angle $\phi$,
    or increasing $Z$, respectively.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:effective_momentum_convection_velocity
  - name:neutral_state_energy_convection_velocity
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/momentum/v_radial/values
    dd_path: edge_transport/model/ggd/neutral/state/momentum/v_radial/values
    status: composed
- name: nitrogen_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of nitrogen impurity ions at the H-mode pedestal top,
    where the steep-gradient edge transport barrier transitions to the flatter core
    plasma.
  documentation: 'Nitrogen density at the pedestal is the total number density of
    nitrogen impurity ions at the pedestal top of an H-mode plasma. Unless a charge
    state is specified separately, it represents the sum over all nitrogen ionization
    states at the location where the steep edge transport barrier joins the core plasma.


    The density is the zeroth velocity moment of the nitrogen ion distribution functions
    at the pedestal-top position:


    $$

    n_{\mathrm{N,ped}} = \sum_q \int f_{\mathrm{N}^{q+}}(\mathbf{x}_{\mathrm{ped}},\mathbf{v})\,d^3v

    $$


    where $n_{\mathrm{N,ped}}$ is in m^-3, $q$ indexes nitrogen ionization charge
    states, $f_{\mathrm{N}^{q+}}$ is the phase-space distribution function with units
    m^-6 s^3, $\mathbf{x}_{\mathrm{ped}}$ is the pedestal-top position, $\mathbf{v}$
    is particle velocity in m/s, and $d^3v$ has units m^3 s^-3. For a single resolved
    charge state, the summation is omitted.


    In practice this quantity is inferred from impurity spectroscopy, charge-exchange
    recombination measurements when available, and collisional-radiative modeling,
    often constrained by local electron density and temperature at the pedestal top.
    The pedestal top is identified from the transition between the steep edge gradient
    region and the core plasma, commonly using fitted electron pressure, density,
    or temperature behavior.


    Representative pedestal nitrogen densities span roughly 10^16-10^19 m^-3, depending
    strongly on nitrogen seeding level, edge transport, ionization balance, and plasma
    size. Trace or unseeded conditions are usually toward the lower end, while actively
    seeded H-mode plasmas can reach the upper part of this range locally.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:nitrogen_density_at_limiter
  - name:density_at_pedestal
  - name:neon_density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/nitrogen/value
    dd_path: summary/local/pedestal/n_i/nitrogen/value
    status: composed
- name: nitrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of nitrogen impurity ions evaluated at the plasma boundary
    (separatrix), representing the impurity concentration at the last closed flux
    surface separating confined plasma from the scrape-off layer.
  documentation: "Nitrogen ion number density at the plasma boundary quantifies the\
    \ concentration of nitrogen impurity ions at the separatrix \u2014 the last closed\
    \ flux surface demarcating the magnetically confined plasma from the open-field-line\
    \ scrape-off layer. This is the nitrogen-species instantiation of [density_at_plasma_boundary](name:density_at_plasma_boundary).\
    \ Nitrogen is routinely injected into tokamaks as a controlled impurity to enhance\
    \ radiative dissipation of exhaust power and reduce peak heat loads at divertor\
    \ targets.\n\nThe boundary value reflects the balance between impurity sources\
    \ (gas injection, ionization of recycled neutrals) and outward transport through\
    \ the scrape-off layer. Its magnitude relative to the main-ion density influences\
    \ the effective charge $Z_\\mathrm{eff}$ and the radiated power fraction at the\
    \ plasma edge. The toroidal flow of nitrogen at the same location is separately\
    \ captured by [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary).\n\
    \nThe quantity is inferred from spectroscopic measurements of nitrogen line emission\
    \ in the edge and divertor regions combined with collisional-radiative modeling,\
    \ or from fluid impurity transport simulations constrained by bolometric data.\
    \ Typical values range from $10^{16}$ to $10^{19}$ m$^{-3}$, depending on the\
    \ nitrogen injection rate and edge plasma density. Analogous separatrix densities\
    \ for other impurity species include [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),\
    \ [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary),\
    \ and [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary).\n\
    \nSign convention: Positive definite, as number density is a particle count per\
    \ unit volume and does not change sign under any coordinate transformation."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:oxygen_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/nitrogen/value
    dd_path: summary/local/separatrix/n_i/nitrogen/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/nitrogen/value
    dd_path: summary/local/separatrix_average/n_i/nitrogen/value
    status: composed
- name: normalized_poloidal_magnetic_flux_at_pedestal
  kind: scalar
  status: draft
  description: Dimensionless radial coordinate of the H-mode pedestal, defined as
    the normalized poloidal magnetic flux evaluated at the pedestal's flux surface.
  documentation: "The normalized poloidal magnetic flux coordinate $\\psi_N$ maps\
    \ the equilibrium poloidal flux function $\\psi$ to the interval $[0, 1]$ by subtracting\
    \ the on-axis value and dividing by the flux range from axis to boundary. Evaluated\
    \ at the pedestal, it provides a dimensionless, device-independent label for the\
    \ radial location of the H-mode edge transport barrier.\n\nThe defining relation\
    \ is:\n\n$$\n\\psi_N = \\frac{\\psi - \\psi_0}{\\psi_b - \\psi_0}\n$$\n\nwhere\
    \ $\\psi_0$ is [the poloidal flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis),\
    \ $\\psi_b$ is its value at the last closed flux surface, and $\\psi$ is the flux\
    \ at the flux surface of interest. The pedestal center in this coordinate marks\
    \ the inflection point of the steep-gradient region; combined with the pedestal\
    \ [full width], it fully characterizes the radial extent and location of the barrier.\n\
    \nIn H-mode operation, the pedestal position is found in the range $\\psi_N \\\
    approx 0.88$\u2013$0.99$, with the exact value depending on plasma shaping, current,\
    \ and heating power. It is extracted from analytic fits to edge profiles of electron\
    \ density, temperature, or pressure using methods such as modified hyperbolic-tangent\
    \ or piecewise-linear models. The companion quantity [poloidal magnetic flux at\
    \ the pedestal](name:poloidal_magnetic_flux_at_pedestal) gives the corresponding\
    \ absolute flux value without normalization.\n\nSign convention: Positive when\
    \ the pedestal flux surface lies outside the magnetic axis, so that $\\psi > \\\
    psi_0$."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_pedestal
  sources:
  - id: dd:summary/pedestal_fits/linear/n_e/pedestal_position/value
    dd_path: summary/pedestal_fits/linear/n_e/pedestal_position/value
    status: composed
- name: oxygen_density_at_pedestal
  kind: scalar
  status: draft
  description: Oxygen impurity ion number density at the H-mode pedestal top, where
    the steep-gradient edge transport barrier meets the flatter core profile.
  documentation: "The oxygen ion number density at the pedestal top characterizes\
    \ the volumetric concentration of oxygen impurities within the H-mode edge transport\
    \ barrier. Oxygen (atomic number $Z = 8$) enters tokamak plasmas primarily through\
    \ plasma-wall interactions and recycling; at the pedestal, its local density contributes\
    \ to fuel dilution, radiative heat losses, and the effective charge $Z_\\mathrm{eff}$.\n\
    \nThe quantity $n_\\mathrm{O}$ represents the total oxygen ion number density\
    \ summed over all ionization charge states at the pedestal-top flux surface. At\
    \ pedestal electron temperatures of 0.3\u20131 keV, oxygen approaches full ionization,\
    \ predominantly occupying the $\\mathrm{O}^{7+}$ and $\\mathrm{O}^{8+}$ charge\
    \ states. This is the oxygen-specific member of the [density_at_pedestal](name:density_at_pedestal)\
    \ family, using the same pedestal-top evaluation convention as [neon_density_at_pedestal](name:neon_density_at_pedestal),\
    \ [carbon_density_at_pedestal](name:carbon_density_at_pedestal), and [nitrogen_density_at_pedestal](name:nitrogen_density_at_pedestal).\n\
    \nOxygen pedestal density is inferred from charge-exchange recombination spectroscopy\
    \ or from impurity transport modeling constrained by soft X-ray and visible spectroscopy\
    \ data. Typical values in current tokamak experiments range from $10^{16}$ to\
    \ $10^{18}$ m$^{-3}$, representing a trace level relative to the main ion pedestal\
    \ density. The associated fluid velocity at the pedestal is captured by [toroidal_oxygen_velocity_at_pedestal](name:toroidal_oxygen_velocity_at_pedestal).\n\
    \nSign convention: Positive when oxygen ions are present at the pedestal location."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:neon_density_at_pedestal
  - name:carbon_density_at_pedestal
  - name:nitrogen_density_at_pedestal
  - name:toroidal_oxygen_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/oxygen/value
    dd_path: summary/local/pedestal/n_i/oxygen/value
    status: composed
- name: oxygen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of oxygen impurity ions at the
    plasma boundary, defined by the last closed flux surface separating the confined
    plasma from the scrape-off layer. It represents the sum over oxygen ion charge
    states, not neutral oxygen.
  documentation: 'Oxygen density at the plasma boundary is the elemental number density
    of ionized oxygen on the last closed flux surface, taken as a flux-surface average
    over that boundary. It is one impurity-species contribution to [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary);
    the quantity counts oxygen ions as particles and is not charge-weighted.


    The total oxygen ion density at the boundary is obtained by summing charge-state-resolved
    oxygen ion densities and applying the boundary flux-surface average:


    $$

    n_{\mathrm{O},b} = \left\langle \sum_{q=1}^{8} n_{\mathrm{O}^{q+}} \right\rangle_{\mathrm{LCFS}}

    $$


    where $n_{\mathrm{O}^{q+}}$ is the number density of oxygen ions with charge $q
    e$, $q=1$ to $8$ spans singly ionized through fully stripped oxygen, and $\langle\cdot\rangle_{\mathrm{LCFS}}$
    denotes the flux-surface average over the last closed flux surface, normally understood
    as the closed-surface limit approaching the separatrix.


    In practice this density is inferred from impurity spectroscopy combined with
    electron temperature, electron density, ionization balance, and impurity transport
    modeling. Line emission constrains charge states with bound electrons, while the
    fully stripped contribution is inferred indirectly from ionization balance or
    recombination-related information.


    Typical boundary oxygen ion densities are highly scenario dependent. In tokamak
    edge analyzes oxygen is usually a trace impurity, with representative values around
    10^14-10^18 m^-3, and should be interpreted relative to the local total ion and
    electron densities.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:nitrogen_density_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/oxygen/value
    dd_path: summary/local/separatrix/n_i/oxygen/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/oxygen/value
    dd_path: summary/local/separatrix_average/n_i/oxygen/value
    status: composed
- name: parallel_ion_heat_convection_velocity
  kind: scalar
  status: draft
  description: The effective velocity at which bulk ion thermal energy is advected
    along magnetic field lines in the edge plasma, used as a transport coefficient
    in the parallel ion energy equation.
  documentation: "The parallel ion heat convection velocity is the field-aligned component\
    \ of the effective velocity governing convective ion thermal-energy transport\
    \ in the edge plasma. It represents the aggregate ion population over all charge\
    \ states, in contrast to the per-charge-state quantity parallel_effective_ion_state_energy_convection_velocity,\
    \ which resolves a single ionization level.\n\nIn the ion energy equation, the\
    \ parallel convective heat flux density is:\n\n$$\nq_{\\parallel,i}^{\\text{conv}}\
    \ = \\frac{5}{2}\\, n_i T_i\\, v_{\\parallel,\\text{heat}}^{i}\n$$\n\nwhere $n_i$\
    \ is the total ion number density, $T_i$ is the ion temperature, and $v_{\\parallel,\\\
    text{heat}}^{i}$ is this convection velocity. The prefactor $5/2$ reflects the\
    \ enthalpy content per particle for a monatomic ideal gas.\n\nThis quantity is\
    \ computed from edge plasma fluid transport models solving the ion energy equation\
    \ in the scrape-off layer and divertor regions. Values range from order $10^2$\
    \ m/s in low-density far-SOL regions to near the ion acoustic speed ($\\sim 10^4$\u2013\
    $10^5$ m/s) approaching divertor target plates, depending on local ion density\
    \ and temperature.\n\nThe parent quantity [ion_heat_convection_velocity](name:ion_heat_convection_velocity)\
    \ defines the full vector; the parallel component dominates along open field lines\
    \ where parallel transport greatly exceeds cross-field transport. The analogous\
    \ transport coefficient for parallel momentum is [parallel_momentum_effective_convection_velocity](name:parallel_momentum_effective_convection_velocity).\n\
    \nSign convention: Positive when the ion heat convection is directed along the\
    \ local magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_heat_convection_velocity
  - name:parallel_momentum_effective_convection_velocity
  sources:
