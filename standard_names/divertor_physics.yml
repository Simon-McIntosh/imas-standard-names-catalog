  documentation: 'Number density of the lithium species at the divertor target is
    the local particle count per volume for ionized lithium at the sheath entrance
    immediately upstream of the target-facing plasma boundary. It is the lithium-specific
    member of [density_at_divertor_target](name:density_at_divertor_target).


    The local lithium-ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{Li}} = \frac{dN_{\mathrm{Li}}}{dV}

    $$


    where $N_{\mathrm{Li}}$ is the number of ionized lithium ions in the local plasma
    volume $V$, with the count summed over all positive lithium ionization states.


    This quantity applies to the ionized lithium population immediately adjacent to
    the divertor target and uses a charge-state-summed aggregation. Neutral lithium
    atoms, electrons, and ions of other elements are excluded.


    Unlike [lithium_density_at_limiter](name:lithium_density_at_limiter), which is
    evaluated at a limiter, this quantity is evaluated at the divertor-target sheath
    entrance. It therefore represents the divertor-target member of the lithium-density
    family rather than a limiter or general plasma-boundary value.'
  unit: m^-3
  physics_domain: divertor_physics
