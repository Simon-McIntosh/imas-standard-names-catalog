- name: parallel_electric_field_at_plasma_boundary
  kind: scalar
  status: active
  description: Signed projection of the local electric field along the local magnetic-field
    direction, evaluated at the last closed flux surface.
  documentation: 'The parallel electric field at the plasma boundary is the signed
    projection of the local [electric field](name:electric_field) vector onto the
    local magnetic-field direction at the last closed flux surface. It is a point-local
    boundary value, distinct from the [parallel flux-surface-averaged electric field](name:parallel_flux_surface_averaged_electric_field_at_plasma_boundary).


    The defining projection is


    $$

    E_\parallel = \mathbf{E} \cdot \hat{\mathbf{b}} = \mathbf{E} \cdot \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $E_\parallel$ and $\mathbf{E}$ are the parallel component and electric-field
    vector in V m$^{-1}$, $\mathbf{B}$ is the local magnetic-field vector, and $\hat{\mathbf{b}}$
    is its unit vector. All quantities are evaluated at the same boundary location.


    The plasma boundary is the separatrix or last closed flux surface; no flux-surface
    or regional averaging is implied.


    Sign convention: Positive when the electric field has a component in the direction
    of the local magnetic field.'
  unit: V.m^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electric_field
  - name:parallel_flux_surface_averaged_electric_field_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix/e_field_parallel/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-e_field_parallel-value
