- name: thickness_of_filter
  kind: scalar
  status: active
  description: Geometric thickness of one diagnostic filter window, determining the
    amount of material available for photon attenuation and spectral selection.
  documentation: 'Filter thickness is the geometric separation of the two opposing
    surfaces of one filter window, measured locally along the material normal. It
    represents the material thickness itself rather than a photon path length through
    the window.


    For corresponding points on the opposing surfaces, the local thickness is defined
    by


    $$

    d = \left| (\mathbf{r}_2 - \mathbf{r}_1) \cdot \hat{\mathbf{n}} \right|

    $$


    where $d$ is the filter thickness, $\mathbf{r}_1$ and $\mathbf{r}_2$ are the position
    vectors of the corresponding surface points, and $\hat{\mathbf{n}}$ is the local
    unit normal to the filter surface.


    This quantity applies to the material of a single filter window used for X-ray
    spectral selection, including soft-X-ray, hard-X-ray, and crystal-spectrometer
    filter windows. It is not a sum over multiple windows, diagnostic channels, or
    detector elements, and it is distinct from the longer oblique photon path through
    the material.


    For homogeneous material at normal incidence, thickness enters the attenuation
    relation $T(E) = \exp[-\mu(E)d]$, where $T(E)$ is photon transmission at energy
    $E$, $E$ is photon energy, and $\mu(E)$ is the material attenuation coefficient.
    Thus, thickness is a geometric input to [spectral absorptivity of the filter](name:spectral_absorptivity_of_filter),
    whereas [filter width](name:width_of_filter) describes the wavelength span of
    the transmitted passband rather than the material dimension.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: camera_x_rays/filter_window/thickness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_x_rays.html#camera_x_rays-filter_window-thickness
    dd_documentation:
      leaf: Thickness of the filter window
      parent_path: camera_x_rays/filter_window
