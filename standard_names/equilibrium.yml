- name: toroidal_flux_surface_averaged_current_density
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal current density is the toroidal conventional
    current density assigned to a closed magnetic-flux surface. It is the geometry-weighted
    total toroidal current-density component that acts as the effective toroidal current
    source for the equilibrium poloidal magnetic-flux distribution.
  documentation: 'Flux-surface-averaged toroidal current density is the toroidal conventional
    current density assigned to a closed magnetic-flux surface. It represents the
    total toroidal current-density component on that surface, expressed with the geometry
    weighting that provides the effective toroidal current source for the equilibrium
    poloidal magnetic-flux distribution.


    The defining flux-surface average is


    $$

    j_{\phi,\mathrm{FSA}} = \frac{\left\langle j_\phi/R \right\rangle}{\left\langle
    1/R \right\rangle}

    $$


    where $j_{\phi,\mathrm{FSA}}$ is the flux-surface-averaged toroidal current density,
    $j_\phi$ is the local toroidal component of the conventional current-density vector
    projected on $\hat{\phi}$, $R$ is the major-radius coordinate in the right-handed
    cylindrical $(R, \phi, Z)$ frame, and $\langle \cdot \rangle$ denotes an average
    over the closed magnetic-flux surface.


    The scope is closed magnetic-flux surfaces in an axisymmetric equilibrium, and
    the aggregation is over the total conventional current carried by the plasma unless
    a population-specific qualifier is present. This quantity is not the unweighted
    flux-surface average of $j_\phi$, not a local current-density component at a point,
    and not a field-aligned or parallel current density.


    It is the toroidal counterpart of the [parallel flux-surface-averaged current
    density](name:parallel_flux_surface_averaged_current_density_due_to_wave_driven_current_drive)
    and a member of the [flux-surface-averaged current density](name:parallel_flux_surface_averaged_current_density_due_to_wave_driven_current_drive)
    family. In equilibrium, this weighted toroidal average is the scalar source coupled
    to the [poloidal magnetic flux](name:poloidal_magnetic_flux) in the Grad-Shafranov
    balance.


    Sign convention: Positive when the conventional current-density vector has a positive
    projection on $\hat{\phi}$, the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/j_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-j_phi
    dd_documentation:
      leaf: Flux surface averaged toroidal current density = average(j_tor/R) / average(1/R)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Flux-surface averaged toroidal current density (j_phi), defined\
        \ as \u27E8j_tor/R\u27E9/\u27E81/R\u27E9. This quantity appears directly in\
        \ the Grad-Shafranov equation and represents the effective current density\
        \ driving the poloidal flux distribution."
      kind: llm
- name: toroidal_magnetic_field
  kind: scalar
  status: active
  description: "Toroidal magnetic-field component of the local total induction, resolved\
    \ along increasing toroidal angle in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The toroidal magnetic field $B_\\phi$ is the signed component of
    the local total [magnetic induction](name:magnetic_field) resolved along the toroidal
    direction. It represents directional field strength rather than the full magnetic-induction
    vector or its magnitude.


    The toroidal component is defined by


    $$

    B_\\phi = \\mathbf{B} \\cdot \\hat{\\phi}

    $$


    where $\\mathbf{B}$ is the local total magnetic induction, $\\hat{\\phi}$ is the
    unit vector in the direction of increasing toroidal angle, and $B_\\phi$ is the
    resulting toroidal component.


    This quantity is defined locally in the right-handed cylindrical $(R,\\phi,Z)$
    frame, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical
    height. It does not select a plasma, vacuum, perturbed, or other source contribution,
    and it has no restriction to a particular region or species. At a point it is
    the local projection; when a finite sensing volume defines the value, the corresponding
    projection is averaged over that volume along the sensor-normal direction associated
    with the toroidal measurement.


    It is distinct from the [radial magnetic field](name:radial_magnetic_field) and
    [vertical magnetic field](name:vertical_magnetic_field), which are projections
    onto the other cylindrical directions, and from the [poloidal magnetic field](name:poloidal_magnetic_field),
    which is the magnitude in the poloidal plane. Together, these component quantities
    resolve the local [magnetic field](name:magnetic_field) in the cylindrical frame.


    Sign convention: Positive when $B_\\phi$ points in the direction of increasing
    toroidal angle $\\phi$ in the right-handed cylindrical $(R,\\phi,Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:vertical_magnetic_field
  - name:poloidal_magnetic_field
