- name: hydrogen_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of hydrogen atoms delivered by
    gas injection, expressed as an equivalent-electron count; each hydrogen atom contributes
    one count, and prefill material is excluded.
  documentation: 'This quantity is the cumulative inventory of hydrogen atoms delivered
    by gas injection after plasma breakdown, expressed as an equivalent-electron count.
    Material introduced during the prefill phase is excluded.


    For hydrogen, the equivalent-electron count is defined by


    $$

    N_{\mathrm{eq},\mathrm{H}}(t) = Z_{\mathrm{H}} N_{\mathrm{H}}(t) = N_{\mathrm{H}}(t)

    $$


    where $N_{\mathrm{eq},\mathrm{H}}$ is the cumulative equivalent-electron count
    due to gas injection, $N_{\mathrm{H}}$ is the cumulative count of delivered hydrogen
    atoms at time $t$, and $Z_{\mathrm{H}}=1$ is the atomic number of hydrogen.


    The count increases by one for each delivered hydrogen atom and represents the
    delivered neutral atomic inventory, not an instantaneous injection rate, a prefill
    inventory, or a plasma ionization-state population. The [accumulated hydrogen
    count due to gas injection](name:accumulated_hydrogen_count_due_to_gas_injection)
    is a concrete accumulated specialization of this hydrogen-specific definition.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_due_to_gas_injection
  - name:deuterium_count_due_to_gas_injection
  - name:helium_4_count_due_to_gas_injection
  arguments:
  - name: count_due_to_gas_injection
    operator: hydrogen
    operator_kind: qualifier
- name: accumulated_hydrogen_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown equivalent-electron inventory of neutral
    hydrogen delivered by gas injection, with one count unit assigned to each hydrogen
    atom.
  documentation: 'This quantity is the cumulative inventory of neutral hydrogen atoms
    delivered by gas injection after plasma breakdown, expressed as an equivalent-electron
    count. Hydrogen contributes one equivalent electron per atom because its atomic
    number is one.


    $$

    N_{H,mathrm{gas}}(t)=Z_H\,\int_{t_{\mathrm{bd}}}^{t}\dot{N}_H(t'')\,dt''

    $$


    where $N_{H,\mathrm{gas}}$ is the accumulated equivalent-electron count, $Z_H=1$
    is hydrogen''s atomic number, $t_{\mathrm{bd}}$ is the plasma-breakdown time,
    and $\dot{N}_H$ is the neutral-hydrogen injection rate. The corresponding instantaneous
    rate is [hydrogen source rate due to gas injection](name:hydrogen_source_rate_due_to_gas_injection).


    The accumulation begins at breakdown and excludes hydrogen introduced during prefill;
    it represents delivered hydrogen inventory rather than the number of free plasma
    electrons or the ionization-state distribution. It is the post-breakdown component
    of [hydrogen count due to gas injection](name:hydrogen_count_due_to_gas_injection),
    distinct from [accumulated hydrogen prefill count](name:accumulated_hydrogen_prefill_count).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:hydrogen_count_due_to_gas_injection
  - name:accumulated_hydrogen_prefill_count
  arguments:
  - name: hydrogen_count_due_to_gas_injection
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/hydrogen/value
