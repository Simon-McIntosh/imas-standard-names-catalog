- name: sawtooth_period
  kind: scalar
  status: active
  description: Time interval between successive sawtooth crash events, representing
    the duration of one complete sawtooth oscillation cycle in a tokamak plasma.
  documentation: 'The sawtooth period is the elapsed time from one sawtooth crash
    to the next consecutive crash, including the intervening growth and relaxation
    phases.


    For successive crash times $t_k$ and $t_{k+1}$, the period is defined by


    $$

    T_{\mathrm{st}} = t_{k+1} - t_k

    $$


    where $T_{\mathrm{st}}$ is the sawtooth period and $t_k$ is the time of the $k$th
    crash. The quantity refers to the temporal spacing of consecutive crash events,
    not the duration of the crash itself or the duration of the preceding growth phase
    alone.'
  unit: s
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: sawteeth/diagnostics/previous_period
    dd_version: 4.1.0
