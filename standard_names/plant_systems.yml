- name: accumulated_oxygen_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown oxygen inventory delivered by gas injection,
    expressed as an equivalent-electron count with eight count units per neutral oxygen
    atom.
  documentation: 'This quantity is the cumulative inventory of oxygen atoms admitted
    after plasma breakdown through gas injection, converted to an equivalent-electron
    count. Each oxygen atom contributes eight equivalent electrons, corresponding
    to oxygen''s atomic number.


    $$

    N_{\mathrm{eq}}(t) = 8N_{\mathrm{O}}(t) = 8\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{O}}(t'')\,dt''

    $$


    where $N_{\mathrm{eq}}$ is the equivalent-electron count, $N_{\mathrm{O}}$ is
    the cumulative oxygen-atom count, $\dot{N}_{\mathrm{O}}$ is the oxygen-atom injection
    rate, $t_{\mathrm{bd}}$ is the plasma-breakdown time, and $t$ is the evaluation
    time. The count quantities are dimensionless and the injection rate has units
    of inverse seconds.


    Only oxygen delivered after plasma breakdown by gas injection is included; prefill
    oxygen is excluded and is represented by [accumulated_oxygen_prefill_count_due_to_gas_injection](name:accumulated_oxygen_prefill_count_due_to_gas_injection).
    The instantaneous counterpart is [oxygen_source_rate](name:oxygen_source_rate),
    while [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection)
    uses the corresponding atomic-number weighting for carbon.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_oxygen_prefill_count_due_to_gas_injection
  - name:oxygen_source_rate
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_accumulated/oxygen/value
    dd_version: 4.1.0
