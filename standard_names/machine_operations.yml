- name: ion_atomic_mass
  kind: scalar
  status: draft
  description: Mass of the dominant ion species element in atomic mass units (u).
  documentation: The ion atomic mass, typically expressed in unified atomic mass units
    (u), identifies the element of the primary ion species in a fusion plasma. For
    example, deuterium plasma has an atomic mass of approximately 2.014 u. This quantity
    is essential for calculating the ion thermal velocity, sound speed $c_s = \sqrt{Z_i
    k_B T_e / m_i}$, and the Larmor radius, where $m_i$ is the ion mass, $Z_i$ is
    the charge state, $k_B$ is the Boltzmann constant, and $T_e$ is the electron temperature.
    The atomic mass is directly related to the isotope, as seen in [atomic_mass_of_isotope](name:atomic_mass_of_isotope),
    and is typically determined by the plasma fueling or impurity content.
  unit: u
  physics_domain: machine_operations
  links:
  - name:atomic_mass_of_isotope
  sources:
