name: normalized_toroidal_flux_coordinate
description: Normalized toroidal flux coordinate for radial position.
documentation: |-
  Normalized toroidal flux coordinate $\rho_{tor,norm} = \rho_{tor}/\rho_{tor,boundary}$ providing a dimensionless radial coordinate ranging from 0 at the magnetic axis to 1 at the plasma boundary.

  Governing equation:
  $$\rho_{tor,norm} = \frac{\rho_{tor}}{\rho_{tor,boundary}} = \sqrt{\frac{\Phi_{tor}}{\Phi_{tor,boundary}}}$$

  where $\Phi_{tor}$ is the [toroidal_magnetic_flux](#toroidal_magnetic_flux) enclosed by the flux surface and $\Phi_{tor,boundary}$ is the toroidal flux at the [plasma_boundary](#plasma_boundary).

  Physical significance: This coordinate provides a standardized radial label for plasma profiles that is independent of machine size and magnetic field strength. It is the most commonly used radial coordinate for comparing profiles across different tokamaks and for transport modeling. Related to the dimensional [toroidal_flux_coordinate](#toroidal_flux_coordinate) through normalization by the boundary value.

  The normalized coordinate is used extensively in transport codes for profile parameterization and in equilibrium reconstruction for radial grid definition. It affects [safety_factor](#safety_factor) mapping and [mhd_stability](#mhd_stability) analysis through coordinate transformations.

  Measurement/Calculation methods: Computed from [magnetic_equilibrium](#magnetic_equilibrium) reconstruction using toroidal flux geometry. Available directly from IMAS equilibrium IDS as the standard radial coordinate for 1D profiles.

  Typical values: Ranges from 0 (magnetic axis) to 1 (plasma boundary). Values outside this range indicate extrapolation beyond the confined plasma region. Core plasma is typically $\rho_{tor,norm} < 0.3$, pedestal region is $0.9 < \rho_{tor,norm} < 1.0$.

  Sign convention: Positive definite quantity increasing from magnetic axis to plasma boundary.
