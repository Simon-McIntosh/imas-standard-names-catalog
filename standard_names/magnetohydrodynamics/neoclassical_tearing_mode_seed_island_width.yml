name: neoclassical_tearing_mode_seed_island_width
status: draft
cocos_transformation_type: one_like
description: Full width of the magnetic island at the onset (seeding) time of a neoclassical
  tearing mode (NTM).
documentation: "The NTM seed island width $w_{\\rm seed}$ (m) is the full radial extent\
  \ of the helical magnetic island present at the rational surface ($q = m/n$, where\
  \ $m$ and $n$ are the poloidal and toroidal mode numbers) at the moment the neoclassical\
  \ tearing mode is triggered. NTMs require a finite seed island to initiate the bootstrap-current-driven\
  \ growth described by the modified Rutherford equation $\\tau_R \\, dw/dt = r_s\
  \ \\Delta'(w) + r_s \\, a_{\\rm bs}(w)$, where $\\tau_R$ is the resistive time (s),\
  \ $r_s$ is the rational surface minor radius (m), $\\Delta'$ is the classical tearing\
  \ stability index (m$^{-1}$), and $a_{\\rm bs}$ is the bootstrap drive term. Typical\
  \ seed widths are of order 1\u20135 cm in present-day tokamaks and depend on the\
  \ amplitude of the triggering perturbation, such as sawteeth, ELMs, or fishbone\
  \ bursts. Determining $w_{\\rm seed}$ is crucial for predicting NTM onset thresholds\
  \ and designing preemptive electron cyclotron current drive (ECCD) stabilization\
  \ strategies."
