- name: parallel_ion_state_velocity
  kind: scalar
  status: draft
  description: Projection of the mean bulk fluid velocity of ions in a specific charge
    state onto the local magnetic field direction, resolved per ionization state rather
    than averaged over all charge states.
  documentation: 'The parallel ion state velocity is the scalar projection of the
    mean bulk flow of an ion population in a specific ionization charge state $Z$
    onto the local magnetic field unit vector $\hat{b} = \mathbf{B}/|\mathbf{B}|$.
    This charge-state-resolved quantity is distinct from the charge-state-averaged
    [parallel_ion_velocity](name:parallel_ion_velocity), making it essential for impurity
    transport modeling where individual ionization stages have different density profiles,
    temperatures, and flow patterns.


    The parallel component is defined as:


    $$

    v_{\parallel,i,Z} = \mathbf{v}_{i,Z} \cdot \hat{b}

    $$


    where $\mathbf{v}_{i,Z}$ is the [ion_state_velocity](name:ion_state_velocity)
    vector for charge state $Z$ and $\hat{b}$ is the unit vector along the local magnetic
    field $\mathbf{B}$.


    This velocity component governs parallel transport of charge-state density along
    field lines, parallel pressure balance, and inter-species collisional friction
    forces. It couples dynamically to [parallel_electron_velocity](name:parallel_electron_velocity)
    through the parallel current and ambipolarity constraints, and is structurally
    analogous to [parallel_neutral_state_velocity](name:parallel_neutral_state_velocity)
    for the neutral counterpart.


    In multi-fluid transport modeling, $v_{\parallel,i,Z}$ is evolved from the charge-state-resolved
    parallel momentum equation including pressure-gradient driving, collisional friction,
    and viscous forces. Experimental constraints can be obtained by projecting ion
    velocity components measured with charge exchange recombination spectroscopy onto
    $\hat{b}$ when multiple viewing geometries are available.


    Sign convention: Positive when the ion bulk flow is directed along $\hat{b}$,
    co-directional with the magnetic field vector $\mathbf{B}$.'
  unit: m.s^-1
  physics_domain: transport
  links:
