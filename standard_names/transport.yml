- name: xenon_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Xenon ion number density at the radial reference location of an internal
    transport barrier, where reduced cross-field transport allows steep radial gradients
    to form. Represents the local concentration of xenon impurity ions, summed over
    ionization states unless a charge-state-resolved quantity is specified.
  documentation: 'Xenon ion number density at the radial reference location of an
    internal transport barrier (ITB). An ITB is a region inside the confined plasma
    where turbulent cross-field transport is locally reduced, allowing steep radial
    gradients to form; this quantity is the local xenon ion density evaluated at the
    radial reference surface associated with that barrier.


    The quantity is the local value of the xenon density profile sampled at the barrier
    reference radius:


    $$

    n_{\mathrm{Xe,ITB}} = n_{\mathrm{Xe}}(r_{\mathrm{ITB}})

    $$


    where $n_{\mathrm{Xe}}$ is the xenon ion number density and $r_{\mathrm{ITB}}$
    is the radial reference location of the barrier, expressed in a flux-surface label
    such as the normalized toroidal flux radius $\rho_\mathrm{tor,norm}$.


    Xenon is a high-$Z$ impurity, so its local density is typically a small fraction
    of the main-ion density and depends strongly on fueling, edge screening, ionization
    balance, and transport across the barrier. Lighter impurity densities at the same
    location are given by [carbon_density_at_internal_transport_barrier](name:carbon_density_at_internal_transport_barrier)
    and [oxygen_density_at_internal_transport_barrier](name:oxygen_density_at_internal_transport_barrier),
    and the total ion density at the same reference surface is [total_ion_density_at_internal_transport_barrier](name:total_ion_density_at_internal_transport_barrier).'
  unit: m^-3
  physics_domain: transport
  links:
