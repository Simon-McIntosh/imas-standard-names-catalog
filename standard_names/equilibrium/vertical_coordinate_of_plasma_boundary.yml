name: vertical_coordinate_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of the geometric center of the plasma boundary
  cross-section.
documentation: 'The vertical coordinate $Z_{\mathrm{geo}}$ (in meters) of the geometric
  axis of the plasma boundary, defined as the centroid of the last closed flux surface
  (LCFS) outline in the poloidal plane: $Z_{\mathrm{geo}} = (Z_{\max} + Z_{\min})
  / 2$, where $Z_{\max}$ and $Z_{\min}$ are the uppermost and lowermost vertical extents
  of the boundary. This quantity characterizes the vertical position of the plasma
  and is a key input for vertical stability control. In well-controlled discharges
  $Z_{\mathrm{geo}}$ is held near the device midplane ($Z \approx 0$), but vertical
  displacement events can shift it by tens of centimeters. Obtained from equilibrium
  reconstruction or real-time magnetic diagnostics. See also `elongation_of_plasma_boundary`
  for the boundary shape and `vertical_coordinate_of_plasma_boundary_outline_point`
  for the discrete boundary contour.'
