    dd_path: summary/line_average/n_i/deuterium_tritium/value
    status: composed
- name: line_averaged_effective_charge
  kind: scalar
  status: draft
  description: Line-averaged effective ion charge Zeff of the plasma, obtained as
    the chord-path integral of the local effective charge divided by the chord length.
  documentation: "The line-averaged effective charge characterizes the mean impurity\
    \ content of the plasma as sampled along a diagnostic line of sight. The local\
    \ [effective charge](name:effective_charge) $Z_\\text{eff}$ is defined as $Z_\\\
    text{eff} = \\sum_i n_i Z_i^2 / n_e$, where $n_i$ is the number density of ion\
    \ species $i$, $Z_i$ is the integer charge number of species $i$, and $n_e$ is\
    \ the electron number density; deviations above unity indicate the presence of\
    \ impurity ions heavier than hydrogen.\n\nThe line average integrates the local\
    \ effective charge along a chord of length $L$:\n\n$$\n\\langle Z_\\text{eff}\
    \ \\rangle_L = \\frac{1}{L} \\int_0^L Z_\\text{eff}(l) \\, dl\n$$\n\nwhere $l$\
    \ is the coordinate along the chord.\n\nThis quantity is inferred from visible\
    \ or near-ultraviolet bremsstrahlung continuum emission along a chord, whose emissivity\
    \ scales as $\\varepsilon \\propto n_e^2 Z_\\text{eff} T_e^{-1/2}$, where $T_e$\
    \ is the electron temperature; combining this signal with a simultaneous line-integrated\
    \ electron density measurement yields $\\langle Z_\\text{eff} \\rangle_L$ without\
    \ requiring assumed spatial profile shapes. In a pure deuterium plasma $Z_\\text{eff}\
    \ = 1$; with typical light impurity content in reactor-relevant tokamak operation\
    \ values of 1.5\u20133 are common, while heavy impurity seeding scenarios can\
    \ yield values of 4\u20136. This chord-averaged quantity complements [volume_averaged_effective_charge](name:volume_averaged_effective_charge),\
    \ which weights by the full plasma volume, and differs from [effective_charge_at_limiter](name:effective_charge_at_limiter),\
    \ which is a boundary-localized evaluation.\n\nSign convention: Positive for any\
    \ plasma with nonzero electron density, since $Z_\\text{eff}$ equals the ratio\
    \ of the charge-weighted ion density second moment to $n_e$, both of which are\
    \ positive-definite quantities."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:effective_charge
  - name:volume_averaged_effective_charge
  - name:effective_charge_at_limiter
  arguments:
  - name: effective_charge
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/zeff/value
    dd_path: summary/line_average/zeff/value
    status: composed
- name: line_averaged_electron_temperature
  kind: scalar
  status: draft
  description: Electron temperature averaged along a diagnostic chord through the
    plasma, equal to the path integral of the local electron temperature divided by
    the chord length.
  documentation: 'The line-averaged electron temperature collapses the radial [electron
    temperature](name:electron_temperature) profile into a single chord-weighted scalar,
    providing a global measure of plasma electron thermal content that depends on
    the diagnostic viewing geometry.


    The defining relation is:


    $$

    \langle T_e \rangle_L = \frac{1}{L} \int_0^L T_e(s) \, ds

    $$


    where $T_e(s)$ is the local electron temperature at position $s$ along the chord
    and $L$ is the total chord length.


    This quantity is obtained by numerically integrating temperature profile measurements
    from multi-channel diagnostics such as Thomson scattering or electron cyclotron
    emission along the chord and normalizing to the chord length. Unlike the [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature),
    it is sensitive to the specific chord geometry rather than reflecting a global
    plasma volume moment; unlike the [flux_surface_averaged_electron_temperature](name:flux_surface_averaged_electron_temperature),
    it does not follow flux-surface topology, making its value dependent on the viewing
    angle and line-of-sight position relative to the plasma cross-section.


    Typical values for a core-viewing chord in H-mode tokamak plasmas range from 1-5
    keV; edge-chord geometries yield values of 0.1-1 keV.


    Sign convention: Positive when the electron population has finite thermal kinetic
    energy, consistent with temperature being a non-negative measure of the mean thermal
    energy per particle.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:electron_temperature
  - name:volume_averaged_electron_temperature
  - name:flux_surface_averaged_electron_temperature
  arguments:
  - name: electron_temperature
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/t_e/value
    dd_path: summary/line_average/t_e/value
    status: composed
- name: line_averaged_hydrogen_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the hydrogen ion number density over a specified
    chord through the plasma. It represents the path-length-normalized hydrogen ion
    content, not neutral hydrogen density and not electron density.
  documentation: 'Line-averaged hydrogen density is the path-length average of the
    local hydrogen ion number density along a chosen chord through the plasma. Hydrogen
    density here denotes the density of hydrogen ions, excluding neutral hydrogen
    atoms and excluding electrons.


    For a chord $C$ of averaging length $L$, the line average is defined by


    $$

    \langle n_\mathrm{H} \rangle_C = \frac{1}{L}\int_C n_\mathrm{H}(l)\,dl

    $$


    where $n_\mathrm{H}(l)$ is the local hydrogen ion number density at path-length
    coordinate $l$, and $L = \int_C dl$ is the chord length over which the average
    is taken.


    This quantity is generally inferred from a combination of constraints rather than
    measured directly by interferometric phase shift alone. Interferometry primarily
    constrains line-integrated electron density; hydrogen ion density is separated
    from electron density using quasineutrality together with composition information
    from spectroscopy, charge-exchange measurements, impurity modeling, particle balance,
    or transport analysis. In a nearly pure singly ionized hydrogen plasma it can
    be close to the line-averaged electron density, while impurity dilution, multiple
    ion species, and neutral populations make the hydrogen ion density distinct.


    Typical line-averaged hydrogen ion densities in magnetically confined plasmas
    range from $10^{18}$-$10^{20}\ \mathrm{m^{-3}}$, with lower values in weakly fueled
    or edge-dominated conditions and higher values in high-density core plasmas.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:hydrogen_density
  - name:volume_averaged_hydrogen_density
  - name:line_averaged_deuterium_density
  - name:hydrogen_fraction
  sources:
  - id: dd:summary/line_average/n_i/hydrogen/value
    dd_path: summary/line_average/n_i/hydrogen/value
    status: composed
- name: line_averaged_iron_density
  kind: scalar
  status: draft
  description: Chord-average of the iron impurity ion number density, equal to the
    path integral of the local iron density divided by the chord length, summed over
    all ionization states.
  documentation: 'The line-averaged iron density $\bar{n}_\mathrm{Fe}$ is the path-length-weighted
    average of the local iron impurity ion number density along a diagnostic chord,
    covering all ionization states from singly ionized to fully stripped iron. It
    provides a spatially integrated measure of iron contamination that is directly
    accessible to line-integrated spectroscopic diagnostics without requiring tomographic
    inversion of a local profile.


    The quantity is defined as:


    $$

    \bar{n}_\mathrm{Fe} = \frac{1}{L} \int_0^L n_\mathrm{Fe}(l) \, dl

    $$


    where $l$ is the coordinate along the line of sight and $L$ is the total chord
    length traversing the plasma. This chord average relates directly to the parent
    local quantity [iron_density](name:iron_density), which gives the volumetric concentration
    at each spatial point. In contrast, [volume_averaged_iron_density](name:volume_averaged_iron_density)
    weights contributions by plasma volume element rather than by chord path length.


    Iron enters magnetically confined plasmas primarily through sputtering and erosion
    of plasma-facing components, and elevated concentrations lead to significant radiative
    power losses. The line-averaged value is inferred from passive spectroscopy of
    iron line emission in the visible or vacuum ultraviolet range combined with ionization
    equilibrium modeling, or from impurity charge exchange spectroscopy on selected
    iron charge states. Typical line-averaged values range from $10^{14}$ to $10^{17}$
    m$^{-3}$ depending on iron source strength, impurity transport, and plasma conditions.
    The iron_fraction provides a related dimensionless indicator of iron contamination
    normalized to electron density, while [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)
    is a sibling quantity measured by the same chord-averaging technique for a lighter
    impurity species.


    Sign convention: Positive when iron ions are present along the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:iron_density
  - name:volume_averaged_iron_density
  - name:line_averaged_nitrogen_density
  sources:
  - id: dd:summary/line_average/n_i/iron/value
    dd_path: summary/line_average/n_i/iron/value
    status: composed
- name: line_averaged_total_ion_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the total ion number density, summed over
    all ion species, obtained by dividing the path integral of the local ion density
    by the chord length.
  documentation: 'The line-averaged total ion density is the chord-mean ion particle
    concentration measured along a diagnostic line of sight of length $L$. The local
    total ion density at each point along the chord is the sum of number densities
    of all ion species present in the plasma, and the line average collapses this
    spatial profile to a single scalar characterizing the bulk ion inventory of the
    plasma along that chord.


    The defining relation is:


    $$

    \bar{n}_{i,\text{tot}} = \frac{1}{L} \int_0^L \sum_s n_s(l) \, dl

    $$


    where $n_s(l)$ is the local number density of ion species $s$ at path coordinate
    $l$ (in m), the sum runs over all ion species, and $L$ is the chord length in
    m.


    In practice, far-infrared or microwave multi-chord interferometers measure the
    line-integrated electron density; the total ion line density is then recovered
    by applying quasi-neutrality ($\sum_s Z_s n_s \approx n_e$, where $Z_s$ is the
    charge state of species $s$) together with spectroscopic estimates of impurity
    content. The result is closely related to, but physically distinct from, the electron
    line density, differing by the effective charge $Z_\text{eff}$ weighting.


    Typical values in tokamak discharges span from $\sim 10^{18}\,\text{m}^{-3}$ in
    low-density L-mode operations to $\sim 10^{21}\,\text{m}^{-3}$ in high-density
    or pellet-fueled H-mode plasmas. The companion quantity [volume_averaged_total_ion_density](name:volume_averaged_total_ion_density)
    provides a flux-surface rather than chord-based global measure; species-resolved
    contributions are accessible from names such as [line_averaged_carbon_density](name:line_averaged_carbon_density)
    and [line_averaged_oxygen_density](name:line_averaged_oxygen_density).'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_total_ion_density
  - name:line_averaged_carbon_density
  - name:line_averaged_oxygen_density
  arguments:
  - name: total_ion_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i_total/value
    dd_path: summary/line_average/n_i_total/value
    status: composed
- name: line_averaged_tritium_density
  kind: scalar
  status: draft
  description: Tritium ion number density averaged along a measurement chord, computed
    as the path integral of local tritium density divided by the chord length.
  documentation: 'Line-averaged tritium density is the chord average of the local
    tritium ion number density through a plasma. It gives a path-weighted measure
    of the tritium fuel-species content along the chosen sight line, without resolving
    variation along that line.


    For a chord parameterized by path length $\ell$, the line average is defined by:


    $$

    \langle n_T \rangle_L = \frac{1}{L}\int_0^L n_T(\ell)\,d\ell

    $$


    where $n_T(\ell)$ is the local tritium ion number density in $\mathrm{m}^{-3}$,
    $\ell$ is distance along the chord in meters, $L$ is the chord length in meters,
    and $\langle n_T \rangle_L$ is in $\mathrm{m}^{-3}$.


    In practice, this quantity may be obtained by combining line-integrated density
    information with independent constraints on isotope composition; the diagnostic
    combination depends on plasma conditions and available measurements. It is conceptually
    analogous to [line_averaged_electron_density](name:line_averaged_electron_density),
    but refers only to tritium ions rather than all electrons.


    Typical values in deuterium-tritium plasmas are about $0.1-8 \times 10^{19}\ \mathrm{m}^{-3}$,
    depending on total fuel density, tritium fraction, chord geometry, and radial
    density variation. The value is non-negative and is zero for a chord containing
    no tritium ions. For related tritium-density measures, compare with [volume_averaged_tritium_density](name:volume_averaged_tritium_density)
    and [tritium_density_at_magnetic_axis](name:tritium_density_at_magnetic_axis).'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_tritium_density
  - name:tritium_density_at_magnetic_axis
  - name:line_averaged_deuterium_density
  - name:line_averaged_helium_3_density
  sources:
  - id: dd:summary/line_average/n_i/tritium/value
