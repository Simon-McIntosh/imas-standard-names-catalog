- name: wavelength_of_wave_beam
  kind: scalar
  status: active
  description: Wavelength of a wave beam is the spectral coordinate, expressed as
    vacuum wavelength, that identifies one phase period of a probing electromagnetic
    beam along its propagation direction.
  documentation: 'Wavelength of a wave beam is the spectral coordinate, expressed
    as vacuum wavelength, that identifies one phase period of a probing electromagnetic
    beam along its propagation direction. It is a property of the launched or incident
    wave component and not of a detector response that may observe radiation produced
    by the beam interaction.


    For a monochromatic plane-wave component in vacuum, wavelength is related to vacuum
    wave-vector magnitude and frequency by


    $$

    \lambda_0 = \frac{2\pi}{|\mathbf{k}_0|} = \frac{c}{\nu}

    $$


    where $\lambda_0$ is the vacuum wavelength, $\mathbf{k}_0$ is the vacuum wave
    vector, $|\mathbf{k}_0|$ is its magnitude, $c$ is the speed of light in vacuum,
    and $\nu$ is the ordinary frequency. The angular frequency satisfies $\omega =
    2\pi\nu = c|\mathbf{k}_0|$ for the same wave component.


    For finite-bandwidth or pulsed beams, this quantity denotes the specified central
    or carrier vacuum wavelength. Propagation through plasma or material media changes
    the local wavelength through the refractive index, but does not change this vacuum
    reference wavelength. It is the wavelength counterpart of [launched_wave_frequency](name:launched_wave_frequency),
    is related to [wave_vector](name:wave_vector) and [wave_phase_of_wave_beam](name:wave_phase_of_wave_beam),
    and is distinct from detection-side spectral coordinates such as [wavelength_of_spectrometer_channel](name:wavelength_of_spectrometer_channel).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
