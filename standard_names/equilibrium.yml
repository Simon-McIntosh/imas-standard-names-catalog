- name: minimum_safety_factor
  kind: scalar
  status: draft
  description: Smallest safety-factor value attained on closed magnetic flux surfaces,
    identifying the lowest-helicity region most relevant to MHD stability.
  documentation: 'The minimum safety factor is the lowest value of the magnetic-field-line
    winding number over the set of closed magnetic flux surfaces in an equilibrium.
    It summarizes the deepest low-q region of the plasma and complements local values
    such as the axis value [safety factor at the magnetic axis](name:safety_factor_at_magnetic_axis)
    and edge-relevant values such as [safety factor at normalized poloidal flux].


    A common definition is


    $$

    q_{\min} = \min_{\psi \in \Omega_{\rm closed}} q(\psi)

    $$


    where $q_{\min}$ is the minimum safety factor, $q(\psi)$ is the safety factor
    on the flux surface labeled by poloidal magnetic flux $\psi$, and $\Omega_{\rm
    closed}$ is the closed-flux-surface region. The location of this minimum can be
    identified by the [poloidal magnetic flux at minimum safety factor], while the
    radial variation that produces the minimum is characterized by [magnetic shear](name:magnetic_shear).


    The value is computed from magnetic equilibrium reconstruction using external
    magnetic measurements, pressure and current constraints, and internal pitch-angle
    information when available from polarimetry or motional-Stark-effect diagnostics.
    Representative values are near 0.7-1.2 in sawtoothing inductive tokamak plasmas,
    above 1 in sawtooth-free operation, and about 1.5-3 in reversed-shear or advanced
    scenarios.


    Sign convention: Positive when a magnetic field line advances in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame during a positive poloidal circuit around the magnetic axis.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:magnetic_shear
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/value
    dd_path: equilibrium/time_slice/global_quantities/q_min/value
    status: composed
- name: minor_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Half the radial width of the last closed flux surface, obtained from
    the outermost and innermost major-radius intersections of the boundary.
  documentation: 'The plasma-boundary minor radius is the effective horizontal half-width
    of the last closed flux surface in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It complements the [major radius of the plasma boundary](name:major_radius_of_plasma_boundary)
    in setting the boundary aspect ratio and is a basic size parameter for interpreting
    [area of the plasma boundary](name:area_of_plasma_boundary), [poloidal length
    of the plasma boundary](name:poloidal_length_of_plasma_boundary), and shape parameters
    such as [elongation](name:elongation).


    For an axisymmetric boundary contour, the minor radius $a_b$ is defined from the
    radial extrema of that contour:


    $$

    a_b = \frac{R_{\max} - R_{\min}}{2}

    $$


    where $R_{\max}$ and $R_{\min}$ are the largest and smallest major-radius coordinates
    reached by the plasma boundary.


    This quantity is computed from an equilibrium reconstruction after identifying
    the outermost closed flux contour or separatrix. The reconstruction is constrained
    by magnetic probes, flux loops, plasma current measurements, and, where available,
    internal magnetic diagnostics such as motional-Stark-effect polarimetry.


    Representative values are 0.2-0.8 m in compact tokamaks, 0.8-1.2 m in medium-size
    devices, and about 2 m in ITER-scale equilibria. The related [toroidal-flux radius
    of the plasma boundary](name:toroidal_flux_radius_of_plasma_boundary) gives a
    flux-surface-equivalent radial scale rather than the geometric radial half-width.


    Sign convention: Positive when the outer radial intersection of the plasma boundary
    has larger major radius than the inner radial intersection in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_plasma_boundary
  - name:area_of_plasma_boundary
  - name:poloidal_length_of_plasma_boundary
  - name:elongation
  - name:toroidal_flux_radius_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/minor_radius
    dd_path: equilibrium/time_slice/boundary/minor_radius
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/minor_radius
    dd_path: equilibrium/time_slice/boundary_separatrix/minor_radius
    status: attached
- name: normalized_poloidal_flux_coordinate_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless label of the flux surface selected as the plasma boundary,
    formed by scaling poloidal magnetic flux between the magnetic axis and boundary.
  documentation: 'The normalized poloidal flux coordinate of the plasma boundary identifies
    which equilibrium flux surface is being used as the boundary or last-closed-flux-surface
    reference. It is the boundary counterpart of the absolute [poloidal magnetic flux
    at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary) and is
    closely related to geometric boundary measures such as the [toroidal-flux radius
    of the plasma boundary](name:toroidal_flux_radius_of_plasma_boundary).


    A common definition is


    $$

    \psi_N = \frac{\psi - \psi_{\mathrm{axis}}}{\psi_{\mathrm{b}} - \psi_{\mathrm{axis}}}

    $$


    where $\psi$ is the poloidal magnetic flux at the selected surface, $\psi_{\mathrm{axis}}$
    is the magnetic-axis flux, and $\psi_{\mathrm{b}}$ is the boundary flux; these
    flux variables are in Wb. For a boundary-referenced equilibrium, this coordinate
    is expected to be close to 1 at the selected plasma boundary.


    The value is computed during magnetic equilibrium reconstruction from magnetic
    measurements, pressure and current constraints, and the inferred closed-flux-surface
    topology. Representative values are 1 for the adopted boundary surface, with small
    deviations used to document alternative fixed-boundary, limiter, or separatrix
    definitions.


    Sign convention: Positive when the selected boundary flux lies farther from the
    magnetic-axis flux in the outward flux-surface ordering.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:toroidal_flux_radius_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/b_flux_pol_norm
    dd_path: equilibrium/time_slice/boundary/b_flux_pol_norm
    status: skipped
- name: normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial label for nested equilibrium flux surfaces, formed
    from the square root of enclosed toroidal magnetic flux relative to its boundary
    value.
  documentation: 'The normalized toroidal flux coordinate is a flux-surface label
    that increases from the magnetic axis to the plasma boundary. It provides a geometry-based
    radial coordinate for comparing thermodynamic, current, and transport quantities
    on nested magnetic surfaces, and is closely related to the enclosed [toroidal
    magnetic flux](name:toroidal_magnetic_flux). Unlike [poloidal magnetic flux](name:poloidal_magnetic_flux),
    it is normalized to a boundary reference so that different equilibria can be compared
    on a common radial scale.


    A common definition is


    $$

    \rho_{\mathrm{tor,n}} = \sqrt{\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,b}}
    - \Phi_{\mathrm{tor,axis}}}}

    $$


    where $\rho_{\mathrm{tor,n}}$ is the normalized toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the flux surface in Wb, $\Phi_{\mathrm{tor,axis}}$
    is its magnetic-axis value in Wb, and $\Phi_{\mathrm{tor,b}}$ is the boundary
    reference value in Wb.


    It is computed from magnetic equilibrium reconstruction using magnetic measurements
    and, when available, internal constraints such as motional-Stark-effect or polarimetry
    data. Experimental measurement locations are mapped to this coordinate by finding
    the equilibrium flux surface passing through the measurement point or the minimum
    value along a line of sight.


    Representative values are 0 at the magnetic axis and about 1 at the last closed
    flux surface or chosen fixed-boundary reference. The coordinate is often used
    together with the [toroidal flux radius](name:toroidal_flux_radius), while [normalized
    poloidal flux coordinate of plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary)
    provides the analogous boundary normalization based on poloidal flux.


    Sign convention: Positive when enclosed toroidal magnetic flux increases from
    the magnetic axis toward the plasma boundary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_flux
  - name:poloidal_magnetic_flux
  - name:toroidal_flux_radius
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  sources:
  - id: dd:core_profiles/profiles_1d/grid/rho_tor_norm
    dd_path: core_profiles/profiles_1d/grid/rho_tor_norm
    status: attached
  - id: dd:equilibrium/time_slice/profiles_1d/rho_tor_norm
    dd_path: equilibrium/time_slice/profiles_1d/rho_tor_norm
    status: composed
- name: outer_major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Major-radius coordinate where a magnetic flux surface intersects the
    outboard midplane, measuring its farthest radial extent from the symmetry axis.
  documentation: 'The outer major radius of a flux surface is the outboard midplane
    intersection of a nested magnetic surface in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is distance from the toroidal symmetry axis, $\phi$
    is toroidal angle, and $Z$ is vertical height. It complements the [inner major
    radius of a flux surface](name:inner_major_radius_of_flux_surface) and, together
    with the [major radius of the magnetic axis](name:major_radius_of_magnetic_axis),
    determines the local horizontal half-width of that surface.


    For a flux surface labeled by poloidal magnetic flux value $\psi_s$, the outboard
    midplane radius is commonly defined by


    $$

    R_{\rm out}(\psi_s)=\max\{R:\psi(R,Z_{\rm axis})=\psi_s\}

    $$


    where $\psi(R,Z)$ is the equilibrium poloidal flux function and $Z_{\rm axis}$
    is the vertical coordinate of the magnetic axis.


    This quantity is computed from equilibrium reconstruction by locating the contour
    of constant flux and finding its outer intersection with the magnetic-axis midplane.
    Magnetic diagnostics, pressure constraints, and kinetic profile information can
    all constrain the reconstructed surface geometry. Typical values range from about
    1-3 m in medium-size tokamaks and about 6-9 m in reactor-scale devices, depending
    on plasma size and elongation; the related [major radius of the geometric axis](name:major_radius_of_geometric_axis)
    gives the midpoint reference for boundary shape.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the $+R$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_major_radius_of_flux_surface
  - name:major_radius_of_magnetic_axis
  - name:major_radius_of_geometric_axis
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/r_outboard
    dd_path: equilibrium/time_slice/profiles_1d/r_outboard
    status: composed
- name: outer_triangularity
  kind: scalar
  status: draft
  description: Dimensionless measure of the outboard-side indentation of the plasma
    boundary relative to an elliptical cross-section.
  documentation: 'Outer triangularity describes the shaping of the plasma boundary
    on the outboard, large-major-radius side in the right-handed cylindrical $(R,
    \phi, Z)$ frame. It is one member of the quadrant-resolved triangularity family,
    complementing [inner triangularity](name:inner_triangularity), [upper triangularity](name:upper_triangularity),
    and [lower triangularity](name:lower_triangularity), and reduces to the global
    [triangularity](name:triangularity) only when the boundary shape is represented
    by a single triangularity parameter.


    A common geometric estimate compares the outboard boundary to an elliptical reference
    with the same geometric center and minor radius:


    $$

    \delta_{\rm out} = \frac{R_{\rm ell}(Z_{\rm out}) - R_{\rm b,out}(Z_{\rm out})}{a}

    $$


    where $\delta_{\rm out}$ is the outer triangularity, $R_{\rm b,out}$ is the major
    radius of the outboard boundary at the chosen outboard-side shaping point, $R_{\rm
    ell}$ is the corresponding major radius of the reference ellipse, $Z_{\rm out}$
    is the vertical coordinate of that point, and $a$ is the boundary minor radius.


    It is obtained from an equilibrium boundary reconstruction by fitting the last
    closed flux-surface contour or separatrix in the poloidal plane. Representative
    tokamak boundary values are about -0.1-0.6; positive D-shaped plasmas often have
    outer triangularity in the 0.2-0.5 range, while nearly circular plasmas are close
    to zero. The related [minor triangularity](name:triangularity) is useful when
    the shape model separates quadrant-resolved triangularities from a minor-radius-based
    triangularity measure.


    Sign convention: Positive when the outboard boundary is indented toward smaller
    $R$ relative to the corresponding elliptical reference in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_triangularity
  - name:upper_triangularity
  - name:lower_triangularity
  - name:triangularity
  - name:triangularity
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/triangularity_outer
    dd_path: equilibrium/time_slice/boundary_separatrix/triangularity_outer
    status: composed
- name: parallel_plasma_current_density
  kind: scalar
  status: draft
  description: Field-aligned projection of the plasma current density, distinguishing
    current flowing along magnetic-field lines from geometric toroidal or poloidal
    components.
  documentation: 'The parallel plasma current density is the component of the plasma
    current-density vector along the local magnetic-field direction. It separates
    field-aligned conduction from geometric projections and is the local density underlying
    the integrated [parallel plasma current], while [plasma current density](name:plasma_current_density)
    denotes the full vector quantity.


    For a flux-surface-averaged equilibrium representation, the field-aligned current
    density can be written as


    $$

    j_\parallel = \frac{\langle \mathbf{J} \cdot \mathbf{B} \rangle}{B_0}

    $$


    where $\mathbf{J}$ is the plasma current-density vector in A m$^{-2}$, $\mathbf{B}$
    is the magnetic-field vector in T, $\langle\cdot\rangle$ denotes a flux-surface
    average, and $B_0$ is the reference toroidal magnetic-field magnitude in T. Locally,
    the same physics is expressed by the projection $\mathbf{J}\cdot\hat{b}$, where
    $\hat{b}=\mathbf{B}/|\mathbf{B}|$ is the unit vector along the magnetic field.


    This quantity is obtained from equilibrium reconstruction constrained by magnetic
    measurements, motional-Stark-effect or polarimetry information, and current-drive
    or pressure-profile modeling. It is closely related to [parallel plasma electrical
    conductivity](name:parallel_plasma_electrical_conductivity), because Ohmic and
    inductive current drive depend on the field-aligned electric field through the
    parallel conductivity.


    Core tokamak values span about 0.1-5 MA m$^{-2}$ in many present devices, with
    larger central values in high-current or strongly driven scenarios and much smaller
    values near the plasma edge. The radial structure reflects Ohmic drive, bootstrap
    current, externally driven current, and the safety-factor and magnetic-shear constraints
    of the reconstructed equilibrium.


    Sign convention: Positive when the projection of the plasma current-density vector
    onto the local magnetic-field direction is positive.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:plasma_current_density
  - name:parallel_plasma_electrical_conductivity
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/j_parallel
    dd_path: equilibrium/time_slice/profiles_1d/j_parallel
    status: composed
  - id: dd:equilibrium/time_slice/profiles_2d/j_parallel
    dd_path: equilibrium/time_slice/profiles_2d/j_parallel
    status: composed
- name: plasma_inductance
  kind: scalar
  status: draft
  description: Effective self-inductance of the toroidal plasma current channel inferred
    from its magnetic-field energy and total plasma current.
  documentation: 'Plasma inductance is the effective self-inductance associated with
    magnetic energy linked to the toroidal plasma current channel. It differs from
    the dimensionless [internal inductance](name:internal_inductance), which normalizes
    poloidal magnetic energy to describe current-profile peaking rather than giving
    an electrical inductance.


    A common energy definition is


    $$

    L_p = \frac{2 E_{\mathrm{mag}}}{I_p^2}, \qquad E_{\mathrm{mag}} = \frac{1}{2}\int_S
    \psi\, j_{\mathrm{tor}}\, dS

    $$


    where $L_p$ is the plasma inductance in H, $E_{\mathrm{mag}}$ is magnetic energy
    in J, $I_p$ is total plasma current in A, $\psi$ is poloidal magnetic flux in
    Wb, $j_{\mathrm{tor}}$ is toroidal current density in A m$^{-2}$, and $S$ is the
    plasma poloidal cross-section.


    It is computed from equilibrium reconstruction using magnetic diagnostics and
    current constraints; the same reconstruction also supplies related quantities
    such as [magnetic flux](name:magnetic_flux) and the current-profile information
    summarized by [internal inductance](name:internal_inductance). In circuit models,
    plasma inductance combines with [plasma resistance](name:plasma_resistance) to
    determine the inductive and resistive voltage response of the plasma current channel.


    Typical values range from about 0.1-5 microhenry in medium-size tokamaks and can
    reach several to tens of microhenry in larger, high-current devices, depending
    on plasma size, shape, and current distribution.'
  unit: H
  physics_domain: equilibrium
  links:
  - name:internal_inductance
  - name:magnetic_flux
  - name:plasma_resistance
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/plasma_inductance
    dd_path: equilibrium/time_slice/global_quantities/plasma_inductance
    status: composed
- name: plasma_resistance
  kind: scalar
  status: draft
  description: Effective resistance of the toroidal plasma current channel inferred
    from total Joule dissipation divided by the square of the plasma current.
  documentation: 'Plasma resistance is the global effective electrical resistance
    of the current-carrying plasma column. It compresses spatially varying resistivity,
    current-density structure, and electric-field alignment into a single dissipative
    circuit parameter, complementary to the stored-field response described by [plasma
    inductance](name:plasma_inductance).


    The defining relation is the ratio of total Ohmic power to the square of the total
    plasma current:


    $$

    R_p = \frac{\int_V \mathbf{E}\cdot\mathbf{J}\,dV}{I_p^2}

    $$


    where $R_p$ is the plasma resistance in ohm, $\mathbf{E}$ is the electric field
    in V m$^{-1}$, $\mathbf{J}$ is the current density in A m$^{-2}$, $dV$ is a volume
    element in m$^3$, and $I_p$ is the total plasma current in A.


    It is computed from equilibrium or transport analysis using reconstructed current
    density, electric field, and plasma current, or inferred from circuit voltage
    balance after separating inductive and externally driven voltage contributions.
    Its local physics is governed by collisional transport along magnetic-field lines,
    so [parallel plasma electrical conductivity](name:parallel_plasma_electrical_conductivity)
    and [parallel plasma current density](name:parallel_plasma_current_density) determine
    how strongly current concentrates in hot, well-conducting regions.


    Typical hot tokamak core values are about 10$^{-9}$-10$^{-6}$ ohm, while colder
    startup or edge-dominated phases can reach 10$^{-5}$-10$^{-3}$ ohm. Lower resistance
    corresponds to higher electron temperature and reduced Ohmic dissipation for a
    given plasma current.'
  unit: ohm
  physics_domain: equilibrium
  links:
  - name:plasma_inductance
  - name:parallel_plasma_electrical_conductivity
  - name:parallel_plasma_current_density
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/plasma_resistance
    dd_path: equilibrium/time_slice/global_quantities/plasma_resistance
    status: composed
- name: plasma_stored_energy
  kind: scalar
  status: draft
  description: Total confined plasma energy obtained from three-halves of the plasma-volume
    integral of total equilibrium kinetic pressure.
  documentation: 'Plasma stored energy is the global thermal and fast-particle energy
    content implied by the equilibrium pressure distribution. In this usage it corresponds
    to the equilibrium pressure-integral quantity, closely aligned with [stored plasma
    energy](name:plasma_stored_energy) and [MHD plasma stored energy](name:plasma_stored_energy),
    rather than the perpendicular-pressure interpretation used for [diamagnetic plasma
    stored energy](name:plasma_stored_energy).


    For an isotropic equilibrium pressure model, the defining relation is


    $$

    W = \frac{3}{2}\int_{V_p} p\,dV

    $$


    where $W$ is the stored plasma energy, $V_p$ is the plasma volume, $p$ is the
    total kinetic pressure including thermal and fast-particle contributions, and
    $dV$ is the volume element.


    The quantity is computed from equilibrium reconstruction constrained by magnetic
    measurements and, when available, kinetic-pressure information from diagnostics
    such as Thomson scattering, charge-exchange spectroscopy, and motional-Stark-effect
    measurements. It is a central confinement metric and is related to beta through
    the comparison of pressure energy with magnetic-field energy; [beta](name:beta),
    [total plasma kinetic pressure of flux surface], and [internal inductance](name:internal_inductance)
    provide complementary equilibrium constraints.


    Representative values range from about 1e4-1e6 J in small or medium tokamak plasmas,
    1e6-2e7 J in large present-day high-performance discharges, and above 1e8 J in
    reactor-scale scenarios.'
  unit: J
  physics_domain: equilibrium
  links:
  - name:plasma_stored_energy
  - name:plasma_stored_energy
  - name:plasma_stored_energy
  - name:beta
  - name:internal_inductance
  sources:
  - id: dd:core_profiles/global_quantities/energy_diamagnetic
    dd_path: core_profiles/global_quantities/energy_diamagnetic
    status: composed
  - id: dd:equilibrium/time_slice/global_quantities/energy_mhd
    dd_path: equilibrium/time_slice/global_quantities/energy_mhd
    status: composed
  - id: dd:equilibrium/time_slice/global_quantities/w_mhd
    dd_path: equilibrium/time_slice/global_quantities/w_mhd
    status: composed
- name: poloidal_angle
  kind: scalar
  status: draft
  description: Angular coordinate specifying position around a toroidal plasma cross-section
    in the poloidal plane.
  documentation: 'The poloidal angle $\theta$ labels position around a magnetic surface
    or plasma cross-section in the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It complements radial flux labels such as the [normalized
    poloidal flux coordinate of the plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary)
    when describing equilibrium geometry and field components on nested surfaces.


    For a geometric angle referenced to a center $(R_0,Z_0)$ in the poloidal plane,
    one common defining convention is


    $$

    \theta = \operatorname{atan2}\!\left[-(Z-Z_0),\, R-R_0\right]

    $$


    where $(R,Z)$ is the point being labeled and $(R_0,Z_0)$ is the chosen magnetic
    or geometric center. This definition sets the zero direction on the outboard midplane
    and fixes the positive direction by the sign convention below.


    Poloidal angle is computed from equilibrium reconstruction grids, magnetic-surface
    contour geometry, or probe-orientation surveys in the poloidal plane. It is used
    to map local quantities such as [poloidal electric field](name:poloidal_electric_field)
    around a surface and to parameterize boundary geometry associated with the [area
    of the plasma boundary](name:area_of_plasma_boundary) and the [poloidal magnetic
    flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).


    Typical values span one full turn, either $0$-$2\pi$ rad or an equivalent wrapped
    interval such as $-\pi$-$\pi$ rad.


    Sign convention: Positive when the angle increases clockwise in the $(R,Z)$ poloidal
    plane when viewed at fixed toroidal angle $\phi$, starting from the outboard midplane
    direction of increasing $R$.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  - name:poloidal_electric_field
  - name:area_of_plasma_boundary
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/profiles_2d/theta
    dd_path: equilibrium/time_slice/profiles_2d/theta
    status: composed
- name: poloidal_length_of_plasma_boundary
  kind: scalar
  status: draft
  description: Arc length of the closed plasma boundary contour in the poloidal cross-section
    of an equilibrium flux surface.
  documentation: 'The poloidal length of the plasma boundary is the perimeter of the
    last closed magnetic surface projected into the poloidal cross-section. In the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height, it measures the closed contour
    length in the $(R,Z)$ plane. Together with the enclosed [area of the plasma boundary](name:area_of_plasma_boundary),
    it characterizes boundary size and shaping.


    For a boundary contour parameterized by poloidal label $\theta$, the defining
    line integral is


    $$

    L_{\mathrm{pol}} = \oint_{\partial\Omega_p} ds = \oint_{\partial\Omega_p} \sqrt{\left(\frac{dR}{d\theta}\right)^2
    + \left(\frac{dZ}{d\theta}\right)^2}\, d\theta

    $$


    where $\partial\Omega_p$ is the closed plasma-boundary curve, $ds$ is the differential
    arc length, and $R(\theta)$ and $Z(\theta)$ describe the contour in the poloidal
    plane.


    This quantity is computed from equilibrium reconstruction by tracing the outermost
    closed flux contour, often constrained by magnetic measurements and kinetic pressure
    information. The same boundary contour sets the [poloidal magnetic flux at the
    plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary) and the [normalized
    poloidal flux coordinate of the plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary);
    comparisons with wall geometry use the [distance of the plasma boundary gap].


    Representative values are 5-8 m for medium-size tokamaks, 12-15 m for large present
    devices, and about 20-25 m for reactor-scale equilibria, increasing with major
    radius, elongation, and triangular shaping such as [upper elongation of the plasma
    boundary](name:upper_elongation_of_plasma_boundary).


    Sign convention: Positive when the boundary contour is traversed in the positive
    poloidal orientation used to evaluate the closed line integral.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:area_of_plasma_boundary
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  - name:upper_elongation_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/length_pol
    dd_path: equilibrium/time_slice/global_quantities/length_pol
    status: composed
- name: poloidal_magnetic_field
  kind: scalar
  status: draft
  description: Signed projection of the magnetic-field vector onto a specified local
    poloidal unit direction in the R-Z plane of the right-handed IMAS cylindrical
    (R, phi, Z) frame. It depends on the chosen poloidal angle and is distinct from
    the non-negative poloidal-field magnitude.
  documentation: 'Poloidal magnetic field is the signed component of the magnetic-field
    vector along a chosen local poloidal unit direction in the plane spanned by $\hat{R}$
    and $\hat{Z}$ of the right-handed IMAS cylindrical $(R, \phi, Z)$ frame. Unlike
    the radial component $B_R$ and vertical component $B_Z$, this scalar is not unique
    until the flux coordinate or poloidal angle that defines $\hat{\theta}$ is specified.


    For an axisymmetric equilibrium, the projection can be related to the cylindrical
    poloidal-plane components and to the gradient of poloidal magnetic flux:


    $$

    B_\theta = \mathbf{B}\cdot\hat{\theta} = B_R\,(\hat{R}\cdot\hat{\theta}) + B_Z\,(\hat{Z}\cdot\hat{\theta}),
    \qquad B_R = -\frac{1}{2\pi R}\frac{\partial\psi}{\partial Z}, \quad B_Z = \frac{1}{2\pi
    R}\frac{\partial\psi}{\partial R}

    $$


    where $\mathbf{B}$ is the magnetic-field vector, $\hat{\theta}$ is the selected
    positive poloidal unit direction, $B_R$ and $B_Z$ are the radial and vertical
    components in the right-handed cylindrical $(R, \phi, Z)$ frame, and $\psi$ is
    the poloidal magnetic flux.


    In equilibrium reconstruction, $B_\theta$ is computed by first determining $B_R$
    and $B_Z$ from the reconstructed field or flux gradient, then projecting those
    components onto the chosen local poloidal direction. Magnetic pickup coils and
    poloidal-field probes measure the component of $\mathbf{B}$ along their own sensitivity
    direction; they constrain $B_\theta$ only after the probe direction and the local
    definition of $\hat{\theta}$ are accounted for.


    Typical signed values in tokamak equilibria are about -1-1 T, with edge and wall-probe
    values often in the range -0.5-0.5 T. The magnitude generally increases with plasma
    current and decreases with increasing major radius, while the sign can change
    with the selected poloidal direction or with local field reversal.


    Sign convention: Positive when the magnetic-field vector has a component in the
    chosen $+\hat{\theta}$ poloidal direction in the flux coordinate $(\rho, \theta,
    \phi)$ within the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:radial_magnetic_field
  - name:vertical_magnetic_field
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:toroidal_magnetic_field
