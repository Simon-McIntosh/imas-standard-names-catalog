        Represents the total power emitted as radiation at the divertor surface during
        plasma-wall interaction.
      kind: llm
- name: power_of_divertor_due_to_recombination
  kind: scalar
  status: active
  description: Total power deposited on all divertor target surfaces by recombination
    processes, comprising both the plasma-ion and neutral-particle recombination channels
    summed over the full divertor assembly.
  documentation: 'Total divertor recombination power is the combined rate at which
    recombination processes at or near the target surfaces of the divertor assembly
    release energy into the material, integrated over all targets. It is the divertor-surface
    counterpart of the volumetric [power_due_to_recombination](name:power_due_to_recombination)
    and unifies two physically distinct deposition channels:


    $$

    P_\mathrm{rec,div} = P_\mathrm{rec,div}^\mathrm{plasma} + P_\mathrm{rec,div}^\mathrm{neutral}

    $$


    where $P_\mathrm{rec,div}^\mathrm{plasma}$ is [plasma_power_of_divertor_due_to_recombination](name:plasma_power_of_divertor_due_to_recombination),
    the energy deposited when plasma ions recombine or neutralize at the material
    surface, and $P_\mathrm{rec,div}^\mathrm{neutral}$ is [neutral_power_of_divertor_due_to_recombination](name:neutral_power_of_divertor_due_to_recombination),
    the energy carried by neutral particles undergoing recombination reactions at
    the plasma-material interface.


    This quantity is computed in edge-plasma codes that track ion and neutral fluxes
    to the targets and apply sheath-energy coefficients along with recombination cross-sections
    to determine surface deposition. It represents one component of the total divertor
    heat load alongside conducted, convected, and radiative contributions, and becomes
    a more prominent fraction of that load in detached or partially detached divertor
    regimes where volumetric recombination upstream suppresses the ion current reaching
    the targets.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_recombination
  - name:plasma_power_of_divertor_due_to_recombination
  - name:neutral_power_of_divertor_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: divertor
    operator_kind: locus
- name: neutral_power_of_divertor_due_to_recombination
  kind: scalar
  status: active
  description: Thermal power deposited on divertor targets by recombination reactions
    of neutral particles at the plasma-material interface, summed over all targets.
    It represents the neutral-particle surface recombination contribution to the total
    divertor heat load.
  documentation: 'Neutral recombination power of the divertor is the heat load delivered
    to divertor target surfaces when neutral particles undergo recombination reactions
    at the plasma-material interface. These reactions include surface association
    or recombination of neutral atoms, molecules, or molecular fragments into more
    tightly bound neutral species, such as molecule formation on a material surface.
    It is the neutral-particle surface-deposition channel of [total divertor recombination
    power](name:power_of_divertor_due_to_recombination).


    The full-divertor value is the sum of the corresponding per-target neutral recombination
    powers:


    $$

    P_\mathrm{rec,div}^\mathrm{neutral} = \sum_t P_{\mathrm{rec},t}^\mathrm{neutral}

    $$


    where $t$ indexes divertor target surfaces and $P_{\mathrm{rec},t}^\mathrm{neutral}$
    is [neutral_power_at_divertor_target_due_to_recombination](name:neutral_power_at_divertor_target_due_to_recombination)
    for target $t$.


    This quantity excludes heat delivered by plasma ions, electrons, photons, conducted
    or convected plasma energy, and non-recombination neutral interactions, except
    for energy deposited through the neutral recombination process at the target.
    It is a surface-deposition quantity integrated over the full divertor assembly,
    distinct from volumetric [power_due_to_recombination](name:power_due_to_recombination).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_recombination
  - name:plasma_power_of_divertor_due_to_recombination
  arguments:
  - name: power_of_divertor_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - dd_path: divertors/divertor/power_recombination_neutrals
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_recombination_neutrals
    dd_documentation:
      leaf: Power deposited on the divertor targets due to recombination of neutrals
        into a ground state (e.g. molecules) (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power deposited on divertor targets due to recombination of neutrals,
        summed over all divertor targets. Contributes to the total divertor heat load,
        particularly during detached plasma operation.
      kind: llm
- name: plasma_power_of_divertor_due_to_recombination
  kind: scalar
  status: active
  description: Thermal power deposited on divertor targets by recombination or neutralization
    of plasma ions at the plasma-material interface, summed over all targets. It represents
    the plasma-ion surface recombination contribution to the total divertor heat load.
  documentation: 'Plasma recombination power of the divertor is the heat load delivered
    to divertor target surfaces when plasma ions recombine or neutralize at the plasma-material
    interface. It is the plasma-ion surface-deposition channel of [total divertor
    recombination power](name:power_of_divertor_due_to_recombination), integrated
    over all divertor targets.


    It is defined as the surface integral of the local deposited-power density over
    the divertor target assembly:


    $$

    P_\mathrm{rec,div}^\mathrm{plasma} = \int_{A_\mathrm{div}} q_\mathrm{rec}^\mathrm{plasma}
    \, dA

    $$


    where $A_\mathrm{div}$ is the union of all divertor target surfaces, $dA$ is a
    target-surface element, and $q_\mathrm{rec}^\mathrm{plasma}$ is the local non-negative
    deposited-power density due only to recombination or neutralization of plasma
    ions incident from the plasma side.


    This quantity is the plasma-component counterpart of [power_of_divertor_due_to_recombination](name:power_of_divertor_due_to_recombination).
    The complementary neutral-particle channel is [neutral_power_of_divertor_due_to_recombination](name:neutral_power_of_divertor_due_to_recombination);
    conducted, convected, radiated, and other non-recombination heat-load contributions
    are excluded. It may be equivalently represented as the sum of [plasma_power_at_divertor_target_due_to_recombination](name:plasma_power_at_divertor_target_due_to_recombination)
    over the target surfaces included in $A_\mathrm{div}$.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_recombination
  - name:neutral_power_of_divertor_due_to_recombination
  arguments:
  - name: power_of_divertor_due_to_recombination
    operator: plasma
    operator_kind: qualifier
  sources:
  - dd_path: divertors/divertor/power_recombination_plasma
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_recombination_plasma
    dd_documentation:
      leaf: Power deposited on the divertor targets due to recombination of plasma
        ions (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power deposited on divertor targets due to recombination of plasma
        ions, summed over all targets of the divertor. Represents the energy released
        when ions recombine at the target surface, contributing to the total divertor
        heat load.
      kind: llm
- name: radial_length_of_divertor_target
  kind: scalar
  status: active
  description: "Non-negative span of a divertor target\u2019s plasma-facing surface\
    \ along the major-radius direction, measured between its minimum and maximum R\
    \ coordinates."
  documentation: 'The radial span of a divertor target is the extent of its plasma-facing
    surface along the major-radius direction. It is a geometric extent, not the distance
    along the target surface or a power-deposition width. The direction is defined
    in the right-handed cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$.


    For the plasma-facing surface $S$, the span is defined by


    $$

    L_R = \max_{\mathbf{x}\in S} R(\mathbf{x}) - \min_{\mathbf{x}\in S} R(\mathbf{x})

    $$


    where $\mathbf{x}$ is a point on $S$ and $R(\mathbf{x})$ is its major-radius coordinate.
    The quantity includes the full specified target surface and is non-negative. It
    complements the [vertical length of the divertor target](name:vertical_length_of_divertor_target),
    which uses the extrema of $Z$, while the [x coordinate of the divertor target](name:x_coordinate_of_divertor_target)
    identifies a Cartesian center rather than a surface span.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_length_of_divertor_target
  - name:x_coordinate_of_divertor_target
  sources:
  - dd_path: divertors/divertor/target/extension_r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-extension_r
    dd_documentation:
      leaf: Target length projected on the major radius axis
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Radial extent (projection on the major radius axis R) of a divertor
        target. A geometric parameter characterising the target dimensions in the
        major radius direction.
      kind: llm
- name: surface_area_of_divertor_tile
  kind: scalar
  status: active
  description: Geometric area of the plasma-facing surface of an individual divertor
    tile, defining the surface over which incident plasma loads are spatially integrated.
  documentation: 'The tile surface area is the geometric area of the plasma-facing
    wetted surface of one individual divertor tile. It is a property of the tile geometry,
    independent of the incident heat, particle, or current load.


    The area is defined by


    $$

    A_{\rm tile} = \int_{S_{\rm tile}} dA

    $$


    where $S_{\rm tile}$ is the plasma-facing tile surface and $dA$ is an elemental
    surface area. The result provides the geometric denominator for converting an
    integrated load into a tile-averaged surface density, such as the [energy flux
    at a divertor target](name:energy_flux_at_divertor_target).


    This quantity applies to one tile and must not be confused with the [wetted area
    of a divertor target](name:wetted_area_of_divertor_target), which characterizes
    a target-level deposited-flux region, or the total wetted area of the divertor
    summed over multiple targets.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:wetted_area_of_divertor_target
  sources:
  - dd_path: divertors/divertor/target/tile/surface_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-tile-surface_area
    dd_documentation:
      leaf: Area of the tile surface facing the plasma
      parent_path: divertors/divertor/target/tile
      parent: Set of divertor tiles belonging to this target
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Wetted surface area of an individual divertor tile facing the plasma.
        Geometric parameter used to compute incident heat and particle flux densities
        on divertor tiles.
      kind: llm
- name: temperature_at_divertor_target
  kind: scalar
  status: active
  description: Temperature at the divertor target is the thermal energy per particle
    of a specified plasma population evaluated at the plasma side of a divertor-target
    sheath, distinct from the target material temperature.
  documentation: 'Temperature at the divertor target is the thermal energy per particle
    of a specified plasma population evaluated at the plasma side of a divertor-target
    sheath. It is a plasma boundary quantity for particles adjacent to, or incident
    on, the divertor target, not a thermodynamic property of the solid target material.


    For a species or population $s$, the scalar target temperature is the one-third
    trace of the kinetic thermal-energy moment at the sheath edge:


    $$

    T_{s,t} = \frac{m_s}{3 n_{s,t}} \int |\mathbf{v} - \mathbf{u}_{s,t}|^2 f_{s,t}(\mathbf{v})\,d^3v

    $$


    where $T_{s,t}$ is the temperature at the divertor target for population $s$,
    $m_s$ is the particle mass, $n_{s,t}$ is the particle number density at the sheath
    edge, $\mathbf{u}_{s,t}$ is the mean flow velocity there, and $f_{s,t}$ is the
    velocity distribution of that population at the plasma side of the sheath.


    This generic quantity denotes the target temperature for the specified plasma
    population and is not an unqualified average over electrons and ions. For the
    electron population it corresponds to [electron temperature at divertor target](name:electron_temperature_at_divertor_target);
    for the ion population it corresponds to [ion temperature at divertor target](name:ion_temperature_at_divertor_target).
    It is the divertor-target counterpart of the more general [plasma temperature](name:plasma_temperature).'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:ion_temperature_at_divertor_target
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Electron temperature at the divertor target is the thermal energy per
    particle of the electron population at the sheath entrance adjacent to a divertor
    target. It is a plasma kinetic temperature, not the material surface temperature
    of the target.
  documentation: 'Electron temperature at the divertor target is the thermal energy
    per particle of the electron population at the sheath entrance adjacent to a divertor
    target. It is a plasma kinetic temperature on the plasma side of the sheath, not
    the material surface temperature of the target.


    For a scalar electron temperature, the defining pressure-density relation is:


    $$

    T_{e,t} = \frac{p_{e,t}}{e\,n_{e,t}}

    $$


    where $T_{e,t}$ is the electron temperature at the divertor target, $p_{e,t}$
    is the scalar electron kinetic pressure at the sheath entrance, $n_{e,t}$ is the
    [electron density at the divertor target](name:electron_density_at_divertor_target),
    and $e$ is the elementary charge used as the energy conversion factor.


    This quantity is population-resolved: it is the electron member of [temperature
    at the divertor target](name:temperature_at_divertor_target), and the corresponding
    ion quantity is [ion temperature at the divertor target](name:ion_temperature_at_divertor_target).
    It must not be interpreted as an electron-ion average, a target heat flux, or
    a full electron energy distribution; for a non-isotropic or non-Maxwellian electron
    population it denotes the scalar kinetic temperature associated with the electron
    pressure in the defining relation.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:temperature_at_divertor_target
  - name:ion_temperature_at_divertor_target
  - name:electron_temperature_at_wall
  arguments:
  - name: temperature_at_divertor_target
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: divertors/divertor/target/two_point_model/t_e_target
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-two_point_model-t_e_target
    dd_documentation:
      leaf: Electron temperature at divertor target
      parent_path: divertors/divertor/target/two_point_model
      parent: Description of SOL according to the two point model, the downstream
        point being on this target, for various time slices
      data_type: FLT_0D
      unit: eV
    enhanced_context:
      description: Electron temperature (Te) at the divertor target plate as estimated
        by the two-point model for the scrape-off layer. Characterizes the plasma
        conditions at the downstream end of the SOL.
      kind: llm
  - dd_path: summary/local/divertor_target/t_e/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-t_e-value
