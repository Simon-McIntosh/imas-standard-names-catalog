- name: magnetic_shear_at_pedestal
  kind: scalar
  status: draft
  description: "Dimensionless magnetic shear \u2014 the normalized logarithmic derivative\
    \ of the safety factor with respect to normalized toroidal flux radius \u2014\
    \ evaluated at the H-mode pedestal transport barrier."
  documentation: "Magnetic shear quantifies the spatial variation of field-line helicity\
    \ across nested flux surfaces, controlling the stability of MHD and drift-wave\
    \ modes. Evaluated at the pedestal \u2014 the steep pressure-gradient transport\
    \ barrier characteristic of H-mode confinement \u2014 it enters directly into\
    \ peeling-ballooning stability criteria governing edge-localized modes and sets\
    \ constraints on the maximum achievable pedestal pressure.\n\nThe pedestal magnetic\
    \ shear is defined as:\n\n$$\ns = \\frac{\\rho_\\mathrm{tor}}{q} \\frac{dq}{d\\\
    rho_\\mathrm{tor}}\n$$\n\nwhere $q$ is the local safety factor and $\\rho_\\mathrm{tor}$\
    \ is the normalized toroidal flux radius, equal to 0 at the magnetic axis and\
    \ 1 at the separatrix. This is the scalar pedestal-locus counterpart of the radial\
    \ profile [magnetic_shear](name:magnetic_shear_at_pedestal), and is analogous\
    \ in structure to [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis)\
    \ evaluated on axis and [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier)\
    \ evaluated at internal barriers.\n\nPedestal magnetic shear is inferred from\
    \ equilibrium reconstruction, combining external magnetic measurements with internal\
    \ profile constraints such as motional Stark effect polarimetry or pressure-profile\
    \ data. In conventional H-mode pedestals, $s$ spans 1\u20135, reflecting the rapid\
    \ increase in $q$ across the narrow pedestal width; reversed-shear configurations\
    \ can yield negative values near the pedestal foot.\n\nSign convention: Positive\
    \ when $q$ increases with increasing $\\rho_\\mathrm{tor}$, corresponding to outward-increasing\
    \ field-line helicity toward the plasma edge."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/pedestal/magnetic_shear/value
    dd_path: summary/local/pedestal/magnetic_shear/value
    status: composed
- name: neon_density_at_pedestal
  kind: scalar
  status: draft
  description: Neon ion number density at the H-mode pedestal top, summed over all
    ionization charge states of the neon element. It is a non-negative elemental impurity
    density at the transition from the steep edge transport barrier to the flatter
    core plasma.
  documentation: 'The neon density at the pedestal is the total number density of
    neon ions at the H-mode pedestal top, where the steep-gradient edge transport
    barrier joins the more weakly varying confined plasma. It is an elemental impurity
    density: ions in different neon charge states contribute to the same total. As
    a number density, it is non-negative and has units of $\mathrm{m}^{-3}$.


    The charge-state-summed elemental density is defined by


    $$

    n_{\mathrm{Ne,ped}} = \sum_{q=1}^{Z_\mathrm{Ne}} n_{\mathrm{Ne}^{q+},\mathrm{ped}}

    $$


    where $n_{\mathrm{Ne,ped}}$ is the neon ion number density at the pedestal top
    in $\mathrm{m}^{-3}$, $n_{\mathrm{Ne}^{q+},\mathrm{ped}}$ is the number density
    in $\mathrm{m}^{-3}$ of neon ions with charge state $q+$ at the pedestal top,
    and $Z_\mathrm{Ne}=10$ is the nuclear charge of neon.


    In practice, this quantity is obtained by summing resolved charge-state densities,
    or by inferring the elemental neon content from impurity measurements together
    with a pedestal-top location determined from plasma profiles and equilibrium information.
    It is commonly interpreted relative to [electron_density_at_pedestal](name:electron_density_at_pedestal)
    or main_ion_density_at_pedestal, for example through the concentration $n_{\mathrm{Ne,ped}}/n_{e,\mathrm{ped}}$,
    because neon is usually a trace or minor impurity rather than the dominant ion
    species.


    Typical values are strongly scenario-dependent, especially in plasmas with deliberate
    neon seeding for edge radiation control. No device-independent absolute range
    is implied by the definition; the physically useful scale is usually the neon
    concentration relative to the local pedestal electron or main-ion density.


    This quantity is the neon counterpart of pedestal impurity densities such as [nitrogen_density_at_pedestal](name:nitrogen_density_at_pedestal),
    [oxygen_density_at_pedestal](name:oxygen_density_at_pedestal), and [xenon_density_at_pedestal](name:xenon_density_at_pedestal).
    The same elemental neon density evaluated at an internal transport barrier is
    represented by [neon_density_at_internal_transport_barrier](name:neon_density_at_internal_transport_barrier).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_pedestal
  - name:nitrogen_density_at_pedestal
  - name:oxygen_density_at_pedestal
  - name:xenon_density_at_pedestal
  - name:neon_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/pedestal/n_i/neon/value
    dd_path: summary/local/pedestal/n_i/neon/value
    status: composed
- name: neon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of neon ions at the plasma boundary (separatrix), the
    last closed flux surface separating the magnetically confined plasma from the
    open-field-line scrape-off layer.
  documentation: 'The neon impurity density at the plasma boundary quantifies the
    concentration of neon ions at the separatrix, which marks the transition between
    the nested closed flux surfaces of the confined plasma and the open-field-line
    scrape-off layer. Neon (atomic number $Z = 10$) is a widely used medium-Z seeding
    species whose partially stripped ionization states radiate efficiently in the
    edge region and divertor, contributing to radiative power exhaust and reducing
    peak heat loads on plasma-facing components.


    The separatrix neon density $n_\mathrm{Ne}$ provides a key boundary condition
    for impurity transport models linking the core plasma to the exhaust region. It
    complements [neon_density_at_divertor_target](name:neon_density_at_divertor_target)
    in constraining the neon distribution between the separatrix and the divertor
    target, and belongs to the same species-resolved family as [nitrogen_density_at_plasma_boundary](name:nitrogen_density_at_plasma_boundary),
    [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary), and
    [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary),
    all components of [density_at_plasma_boundary](name:density_at_plasma_boundary).


    Boundary neon density is measured or inferred through charge-exchange recombination
    spectroscopy, emission spectroscopy from helium-like or hydrogen-like neon charge
    states, or estimated from integrated power balance coupled with edge transport
    modeling. The reported value is often a flux-surface average over the separatrix
    contour.


    In neon-seeded experiments, separatrix densities range from roughly $10^{17}$
    to $10^{19}$ m$^{-3}$, scaling with the gas injection throughput and local edge
    transport properties.


    Sign convention: Positive when neon ions are present at a nonzero concentration
    at the plasma boundary.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neon_density_at_divertor_target
  - name:nitrogen_density_at_plasma_boundary
  - name:xenon_density_at_plasma_boundary
  - name:deuterium_density_at_plasma_boundary
  - name:density_at_plasma_boundary
