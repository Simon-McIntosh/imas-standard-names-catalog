- name: parallel_normalized_gyrocenter_gyroaveraged_current_density
  kind: scalar
  status: draft
  description: Dimensionless parallel gyrocenter current-density moment for a linear
    gyrokinetic eigenmode, including finite-Larmor-radius gyroaveraging through the
    zeroth-order Bessel weighting. It represents the charge-weighted parallel flow
    response normalized by a reference current density.
  documentation: 'The parallel normalized gyrocenter gyroaveraged current density
    is the dimensionless parallel current-density moment of a perturbed gyrocenter
    distribution. The gyroaveraged qualifier denotes the finite-Larmor-radius weighting
    by the zeroth-order Bessel function, so this quantity differs from the ungyroaveraged
    [parallel_normalized_gyrocenter_perturbed_current_density](name:parallel_normalized_gyrocenter_perturbed_current_density)
    by including the Bessel-weighted response at the fluctuation perpendicular scale.


    For a species $s$ with dimensional perturbed gyrocenter distribution, a common
    form of the normalized moment is


    $$

    \hat{j}_{\parallel,J_0,s} = \frac{q_s}{j_{\mathrm{ref},s}} \int J_0(k_\perp \rho_s)\,
    v_\parallel\, \delta f_s(\mathbf{v})\, d^3v

    $$


    where $q_s$ is the species charge, $J_0$ is the zeroth-order Bessel function,
    $k_\perp$ is the perpendicular wave number, $\rho_s$ is the species gyroradius,
    $v_\parallel$ is velocity along $\hat{b}=\mathbf{B}/|\mathbf{B}|$, and $\delta
    f_s$ is the perturbed gyrocenter phase-space density with units $s^3 m^{-6}$ when
    SI velocity variables are used. The integral gives a particle flux density; multiplication
    by $q_s$ gives a current density in $A m^{-2}$. The reference current density
    $j_{\mathrm{ref},s}$ also has units $A m^{-2}$, often based on species-specific
    or gyro-Bohm reference quantities such as $e n_{\mathrm{ref}} v_{\mathrm{ref}}$,
    so the reported value is dimensionless.


    This quantity is computed from the linear gyrokinetic eigenfunction by velocity-space
    quadrature of the perturbed gyrocenter distribution. The Bessel factor suppresses
    contributions from structures with $k_\perp \rho_s \gtrsim 1$, representing gyroaveraging
    over the Larmor orbit; in the long-wavelength limit $k_\perp \rho_s \ll 1$, it
    approaches the corresponding non-gyroaveraged parallel current moment.


    Because the amplitude and phase of a linear eigenmode are arbitrary until an eigenfunction
    normalization is chosen, absolute values should be interpreted together with that
    normalization. With common dimensionless normalizations, magnitudes of $10^{-4}-1$
    are typical for weakly electromagnetic modes, while values of order $1-10$ can
    occur for strongly electromagnetic responses or for normalizations tied to small
    reference amplitudes.


    Sign convention: Positive when the charge-weighted gyrocenter parallel flow is
    along $\hat{b}=\mathbf{B}/|\mathbf{B}|$.'
  unit: '1'
  physics_domain: turbulence
