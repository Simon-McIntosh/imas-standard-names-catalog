- name: angular_width_of_bragg_crystal
  kind: scalar
  status: draft
  description: Vertical angular span subtended by the effective Bragg crystal aperture
    at the X-ray source, along the Z direction of the right-handed cylindrical (R,
    phi, Z) frame. It is a geometric acceptance angle, distinct from the Bragg diffraction
    angle, the rocking-curve width, and the toroidal angular span.
  documentation: 'The angular width of a Bragg crystal is the non-negative vertical
    angular span of the effective diffracting aperture as seen from the X-ray source
    or chosen source point. The vertical direction is the $Z$ direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, complementary to the toroidal $\phi$ angular
    span described by [toroidal_angle_of_bragg_crystal](name:toroidal_angle_of_bragg_crystal).
    This quantity is closely related to [angle_of_bragg_crystal](name:angular_width_of_bragg_crystal)
    when that name is used for the same vertical acceptance angle; it is not the Bragg
    diffraction angle $\theta_B$ that selects wavelength, and it is not the intrinsic
    rocking-curve width.


    For a flat aperture centered on the line from source to crystal, the vertical
    angular width is the angle subtended by the effective vertical aperture height:


    $$

    \alpha_v = 2 \tan^{-1}\!\left(\frac{a_v}{2L}\right) \simeq \frac{a_v}{L}

    $$


    where $\alpha_v$ is the angular width in rad, $a_v$ is the effective vertical
    aperture height in meters, and $L$ is the distance from the source point to the
    crystal center in meters. The approximation applies when $a_v \ll L$.


    In practice, the effective aperture may be set by the physical crystal height,
    masks, collimators, or the illuminated part of a curved focusing crystal. For
    curved or off-axis geometries, the same quantity is obtained from the angular
    envelope of rays from the source that intercept the active Bragg-diffracting surface,
    usually by geometric optics or ray tracing. Together with the toroidal angular
    span, it contributes to the collected solid angle and photon throughput, while
    spectral selection remains governed by Bragg diffraction.


    Typical vertical angular widths in tokamak X-ray crystal spectrometers are about
    0.001-0.05 rad. Compact or large-aperture systems can approach 0.1 rad, while
    high-resolution channels often use a few milliradians to a few tens of milliradians.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:toroidal_angle_of_bragg_crystal
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/angle_bragg
    dd_path: spectrometer_x_ray_crystal/channel/crystal/angle_bragg
    status: attached
  - id: dd:spectrometer_x_ray_crystal/crystal/angle_bragg
    dd_path: spectrometer_x_ray_crystal/crystal/angle_bragg
    status: attached
  - id: dd:spectrometer_x_ray_crystal/crystal/angular_span_vertical
    dd_path: spectrometer_x_ray_crystal/crystal/angular_span_vertical
    status: composed
- name: bragg_crystal_width
  kind: scalar
  status: draft
  description: Full width of the Bragg crystal in an X-ray crystal spectrometer along
    the first transverse (X1) axis, applicable only for rectangular crystal geometry.
  documentation: 'The Bragg crystal width specifies the physical extent of the diffracting
    crystal element along its first transverse coordinate axis (X1) in an X-ray crystal
    spectrometer channel. This dimension is only defined for rectangular crystal geometry;
    together with bragg_crystal_height along the orthogonal X2 axis and [thickness_of_bragg_crystal](name:thickness_of_bragg_crystal)
    through the crystal body, it fully parameterizes the three-dimensional rectangular
    crystal geometry required for solid-angle and acceptance calculations.


    The X1 width governs the acceptance aperture along the meridional or sagittal
    direction depending on the crystal mount orientation. A larger width intercepts
    a greater solid angle of X-ray emission from the plasma source, increasing photon
    throughput, but can introduce geometric aberrations in curved-crystal focusing
    arrangements such as Johann or Johansson geometries. The bragg_wavelength separately
    characterizes the diffraction condition, linking crystal orientation to the photon
    energies that satisfy Bragg''s law.


    Typical crystal widths for fusion-diagnostic X-ray spectrometers range from a
    few millimeters to a few tens of millimeters, depending on crystal material and
    spectrometer geometry.


    Sign convention: Positive when the extent is measured as a physical length from
    one edge of the crystal to the other along the X1 transverse axis of the crystal
    coordinate frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:thickness_of_bragg_crystal
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/x1_width
    dd_path: spectrometer_x_ray_crystal/channel/crystal/x1_width
    status: composed
- name: bremsstrahlung_power
  kind: scalar
  status: draft
  description: Total electromagnetic power radiated by the plasma via bremsstrahlung,
    the continuum emission arising from electron deceleration in the Coulomb fields
    of plasma ions.
  documentation: 'Bremsstrahlung (braking radiation) is continuum electromagnetic
    emission produced when free electrons are decelerated in the Coulomb fields of
    ions; this quantity is the plasma-volume-integrated total radiated power from
    that process, representing a global energy loss term in the plasma power balance.


    The total bremsstrahlung power is defined by:


    $$

    P_\text{brem} = C_\text{brem} \int n_e^2(\mathbf{r})\, Z_\text{eff}(\mathbf{r})\,
    T_e^{1/2}(\mathbf{r})\, dV

    $$


    where $n_e$ is the electron number density in m$^{-3}$, $Z_\text{eff}$ is the
    mean effective ion charge, $T_e$ is the electron temperature in eV, and $C_\text{brem}
    \approx 5.34 \times 10^{-37}$ W m$^3$ eV$^{-1/2}$ is the free-free emission coefficient.
    The strong $n_e^2$ and $Z_\text{eff}$ dependence means impurity content significantly
    amplifies bremsstrahlung losses.


    The global bremsstrahlung power is inferred from broadband bolometric measurements
    or by volumetrically integrating $n_e$, $T_e$, and $Z_\text{eff}$ profiles derived
    from Thomson scattering and spectroscopy. The local spectral counterpart [bremsstrahlung
    spectral radiance] additionally enables $Z_\text{eff}$ inference from visible
    continuum emission.


    Together with [power due to line radiation](name:power_due_to_line_radiation)
    from bound-bound atomic transitions and [power due to synchrotron radiation](name:power_due_to_synchrotron_radiation)
    from relativistic electron gyration, bremsstrahlung emission is one of the principal
    radiative power loss channels. In present-generation tokamaks, total bremsstrahlung
    losses range from approximately 0.5-10 MW; in high-density, high-$Z_\text{eff}$
    burning-plasma scenarios, losses can reach several tens of MW.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_due_to_line_radiation
  - name:power_due_to_synchrotron_radiation
  sources:
  - id: dd:summary/global_quantities/power_bremsstrahlung/value
    dd_path: summary/global_quantities/power_bremsstrahlung/value
    status: composed
- name: brightness_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Photon radiance of soft X-ray emission received on a detector channel,
    integrated over the detector's energy acceptance band.
  documentation: 'Soft X-ray (SXR) brightness is the number of soft-X-ray photons
    arriving at a detector channel per unit area, per unit time, and per unit solid
    angle, integrated over the instrument''s energy acceptance band. The emission
    originates from free-free (bremsstrahlung), free-bound (recombination), and bound-bound
    (line radiation) contributions from electrons and impurity ions in the sub-keV
    to few-keV photon energy range.


    The quantity is defined by the energy-band integral of the differential photon
    radiance:


    $$

    B = \int_{E_1}^{E_2} \frac{d^4 N}{dA \, dt \, d\Omega \, dE} \, dE

    $$


    where $E_1$ and $E_2$ are the lower and upper energy limits of the detector''s
    acceptance band, $N$ is the photon count, $A$ is the detector active area, $t$
    is time, and $\Omega$ is the solid angle subtended by the detection geometry.


    SXR detectors are arranged in multi-channel arrays covering the plasma cross-section
    with fan-beam line-of-sight geometries. Individual channel signals are combined
    via tomographic inversion to reconstruct the local emissivity, enabling plasma
    tomography, detection of MHD modes such as sawteeth and neoclassical tearing modes,
    and tracking of impurity transport. The companion power-radiance quantity [spectral_radiance_of_soft_xray_detector](name:spectral_radiance_of_soft_xray_detector)
    weights each photon by its energy rather than counting it. For the analogous photon-count
    brightness in the hard X-ray regime, see [hard_xray_brightness](name:hard_xray_brightness).'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance_of_soft_xray_detector
  - name:hard_xray_brightness
  sources:
  - id: dd:soft_x_rays/channel/intensity
    dd_path: soft_x_rays/channel/intensity
    status: composed
- name: brightness_of_visible_camera
  kind: scalar
  status: draft
  description: Photon radiance measured by a visible-band camera channel, giving the
    number of photons collected per unit detector area, per unit time, and per unit
    solid angle along a line of sight.
  documentation: 'Brightness of a visible camera is the photon radiance reaching the
    camera within its visible passband along a line of sight. It counts photons rather
    than radiant energy, normalized by collection area, observation time, and accepted
    solid angle, with the viewing-angle projection treated explicitly.


    The photon radiance can be defined from the photons collected by a small detector
    element viewing a small solid angle:


    $$

    B_\mathrm{vis} = \frac{dN_\gamma}{dt\,dA\,\cos\alpha\,d\Omega}

    $$


    where $B_\mathrm{vis}$ has unit m^-2.s^-1.sr^-1, $dN_\gamma$ is the photon count
    with unit 1, $dt$ is the exposure or integration time in s, $dA$ is the unprojected
    physical detector area in m^2, $\alpha$ is the [alpha angle] in rad between the
    detector surface normal and the incoming ray, and $d\Omega$ is the accepted solid
    angle in sr. The factor $dA\cos\alpha$ is the projected detector area normal to
    the ray.


    In practice this quantity is obtained from calibrated camera counts after dark-offset
    subtraction, flat-field and gain correction, detector quantum-efficiency calibration,
    exposure-time normalization, optical-transmission correction, and geometric calibration
    of the viewed solid angle. It can include visible line radiation, continuum bremsstrahlung,
    molecular-band emission, impurity radiation, and light from plasma-wall interactions
    within the camera response band.


    Typical magnitudes vary widely with wavelength band, viewing geometry, and plasma
    conditions. Faint continuum or wall-background signals may be about 10^15-10^18
    m^-2.s^-1.sr^-1, while bright edge or divertor line emission is often 10^18-10^22
    m^-2.s^-1.sr^-1; intense transient or saturated views can exceed 10^22 m^-2.s^-1.sr^-1.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:camera_visible/channel/detector/frame/radiance
    dd_path: camera_visible/channel/detector/frame/radiance
    status: composed
- name: calibration_factor_of_visible_camera
  kind: scalar
  status: draft
  description: Multiplicative calibration factor that converts a dark-corrected raw
    pixel count from a visible-band camera detector into absolute band-integrated
    photon radiance, expressed in inverse square meters per second per steradian.
    It aggregates relay optics transmission, detector quantum efficiency, electronic
    gain, pixel etendue, and exposure time, integrated over the camera's spectral
    bandpass, into a single per-pixel coefficient.
  documentation: 'The calibration factor of a visible camera is the multiplicative
    coefficient that converts a dark-corrected raw pixel count into the absolute band-integrated
    photon radiance incident on that pixel. It encapsulates the full end-to-end sensitivity
    of the detection channel: relay optics transmission, detector quantum efficiency,
    electronic gain, pixel etendue, and exposure time, all combined into a single
    per-pixel value. The dark-corrected radiance follows the linear relation $L =
    C\,I$, where $I$ is the dark-subtracted count and $C$ is this factor.


    Because $C$ inverts the detection chain, it equals the reciprocal of the channel
    throughput. For a pixel of area $A_\mathrm{pix}$ subtending solid angle $\Omega_\mathrm{pix}$,
    exposed for time $\tau$ with electronic gain $g$ and a bandpass-averaged product
    of quantum efficiency and optical transmission $\langle \eta T \rangle$:


    $$

    C = \frac{1}{A_\mathrm{pix}\,\Omega_\mathrm{pix}\,\tau\,g\,\langle \eta T \rangle}

    $$


    where $A_\mathrm{pix}$ is in m^2, $\Omega_\mathrm{pix}$ in sr, $\tau$ in s, and
    $g$ and $\langle \eta T \rangle$ are dimensionless. The denominator carries units
    of m^2 sr s, so $C$ has units of m^-2 s^-1 sr^-1, consistent with a band-integrated
    photon radiance per count. The factor therefore decreases as any element of the
    throughput increases: a more efficient optical path, higher quantum efficiency,
    or higher gain produces more counts per unit radiance and hence a smaller counts-to-radiance
    conversion factor.


    The factor is determined by laboratory or in-situ calibration against a source
    of known absolute spectral radiance, such as an integrating sphere or a calibrated
    tungsten-halogen lamp, operated under the same optical, spectral-filter, and electronic
    configuration used during plasma discharges. Because sensitivity varies from pixel
    to pixel, the factor is resolved across the detector and implicitly absorbs flat-field
    and vignetting non-uniformities.


    No universal value exists because $C$ depends strongly on the optics, detector
    type, gain setting, and spectral filter. For fast visible cameras on tokamaks,
    representative magnitudes span roughly $10^{10}$ to $10^{15}$ m^-2 s^-1 sr^-1
    per count; these are illustrative only, and the applicable measured calibration
    must be used for quantitative work.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:brightness_of_visible_camera
  - name:spectral_calibration_factor_of_spectrometer
  sources:
  - id: dd:camera_visible/channel/detector/counts_to_radiance
    dd_path: camera_visible/channel/detector/counts_to_radiance
    status: composed
- name: count_at_detector_pixel
  kind: scalar
  status: draft
  description: Detected photon count rate at a single pixel of an X-ray crystal spectrometer
    detector, giving the number of Bragg-diffracted X-ray photons registered at that
    pixel per unit time.
  documentation: 'The photon count rate at a detector pixel quantifies how many X-ray
    photons diffracted by the crystal arrive at one pixel element per second during
    a spectrometer acquisition frame. Each pixel samples a narrow photon-energy interval
    determined by the Bragg diffraction geometry; the characteristic photon energy
    assigned to a pixel is given by [energy_of_detector_pixel](name:energy_of_detector_pixel),
    with spectral bounds defined by [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).


    The mapping from pixel position to photon wavelength follows the Bragg condition


    $$

    2d\sin\theta = \lambda

    $$


    where $d$ is the crystal plane spacing, $\theta$ is the local diffraction angle
    at the pixel, and $\lambda$ is the corresponding photon wavelength.


    The count rate is recorded by solid-state detector arrays (CCDs, strip detectors,
    or pixel arrays) and constitutes the primary observable for X-ray crystal spectroscopy
    of highly charged impurity emission lines. The physical size of each pixel, relevant
    for geometric efficiency corrections, is described by [extent_of_detector_pixel](name:extent_of_detector_pixel).
    The count rate may be normalized to a reference value to form [normalized_count_at_detector_pixel](name:normalized_count_at_detector_pixel),
    and its temporal evolution is tracked by [time_derivative_of_count_at_detector_pixel](name:time_derivative_of_count_at_detector_pixel).'
  unit: count.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:energy_of_detector_pixel
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
  - name:extent_of_detector_pixel
  - name:normalized_count_at_detector_pixel
  - name:time_derivative_of_count_at_detector_pixel
- name: curvature_of_optical_element
  kind: scalar
  status: draft
  description: Radius of curvature of a diagnostic optical element surface, giving
    the signed distance from the surface vertex to its center of curvature and thereby
    determining the element's geometric focusing power.
  documentation: 'The radius of curvature $R$ of an optical element surface is the
    signed distance from the surface vertex to its center of curvature, controlling
    how the element focuses or defocuses incident radiation. As a parent quantity,
    it generalizes over the multiple distinct surfaces and functional curvature geometries
    of a complete optical element, including reflective entry and exit surfaces and
    spectral image surfaces.


    For a spherical surface, $R$ and the surface curvature $\kappa$ are related by:


    $$

    R = \frac{1}{\kappa}

    $$


    where $\kappa$ (in m$^{-1}$) is the principal curvature at the surface vertex.
    Smaller $|R|$ implies stronger focusing power; a flat surface corresponds to $R
    \to \infty$. Specific variants include [back_surface_curvature_of_optical_element](name:back_surface_curvature_of_optical_element),
    which characterizes the rear-surface radius along the local X1 axis for cylindrical
    and toroidal geometries, and [spectral_surface_curvature_of_optical_element](name:spectral_surface_curvature_of_optical_element),
    which gives the Rowland-circle radius of the spectral image surface in spectrometer
    channels. The primary dispersing surface geometry is described by [surface_curvature_of_optical_element](name:curvature_of_optical_element).
    Radii are determined by optical profilometry or interferometric metrology during
    element fabrication and calibration. Typical absolute values range from 0.1 m
    to a few meters for UV and X-ray spectrometer optics.


    Sign convention: Positive when the center of curvature lies on the same side as
    the incoming radiation (concave surface geometry).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:back_surface_curvature_of_optical_element
  - name:spectral_surface_curvature_of_optical_element
  sources:
  - id: dd:spectrometer_uv/channel/grating/curvature_radius
    dd_path: spectrometer_uv/channel/grating/curvature_radius
    status: composed
- name: back_surface_curvature_of_optical_element
  kind: scalar
  status: draft
  description: Radius of curvature of the rear surface of a diagnostic optical element
    along the local X1 axis, applicable to spherical, cylindrical, and toroidal surface
    geometries.
  documentation: 'The back-surface X1 radius of curvature $R_{\mathrm{back},X1}$ describes
    the curvature of the exit face of a diagnostic optical element in the X1 direction
    of the local surface frame $(X1, X2, X3)$, where $X1$ and $X2$ span the optical
    surface and $X3$ is the outward surface normal. This parameter is required by
    ray-tracing and Gaussian-optics models to compute the wavefront transformation
    induced by the rear surface of lenses, windows, and mirrors used in visible and
    infrared camera systems and visible spectrometer diagnostics. A finite value applies
    only when the surface curvature type permits non-planar geometry in X1: specifically,
    spherical (type 2), cylindrical along X1 (type 4), and toroidal (type 5) surface
    types.


    For a thick lens in air, the paraxial focal length $f$ is related to the front
    and back radii by the Lensmaker''s equation:


    $$

    \frac{1}{f} = (n-1)\left[\frac{1}{R_{\mathrm{front},X1}} - \frac{1}{R_{\mathrm{back},X1}}
    + \frac{(n-1)d}{n\,R_{\mathrm{front},X1}\,R_{\mathrm{back},X1}}\right]

    $$


    where $n$ is the refractive index of the element material, $d$ is the axial thickness,
    and $R_{\mathrm{front},X1}$ is the front-surface radius of curvature given by
    front_surface_curvature_of_optical_element. For toroidal or cylindrical elements
    the orthogonal principal curvature in X2 is an independent parameter given by
    [vertical_back_surface_curvature_of_optical_element](name:vertical_back_surface_curvature_of_optical_element);
    for a spherical surface both principal radii are equal.


    Absolute values range from a few millimeters for tightly curved condenser elements
    to hundreds of meters for near-flat windows and beam-splitters; a zero value conventionally
    represents an infinite radius (planar surface).


    Sign convention: Positive when the center of curvature of the back surface lies
    on the exit (transmitted-beam) side of the optical element.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_back_surface_curvature_of_optical_element
  arguments:
  - name: curvature_of_optical_element
    operator: back_surface
    operator_kind: qualifier
  sources:
