- name: toroidal_helium_4_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal component of the helium-4 ion fluid velocity evaluated at\
    \ the H-mode pressure pedestal top, resolved along the direction of increasing\
    \ toroidal angle in the right-handed cylindrical (R, \u03C6, Z) frame. For multiple\
    \ ionization states, it is the density-weighted mean over helium-4 ions."
  documentation: 'Toroidal component of the helium-4 ion fluid velocity evaluated
    at the H-mode pressure pedestal top is the projection of the helium-4 ion fluid
    velocity onto the toroidal basis direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The pedestal top is the inner shoulder of the H-mode pressure
    pedestal, adjacent to the confined plasma core. As a species-level ion velocity,
    it represents the density-weighted mean over all helium-4 charge states in the
    ion population.


    The defining projection is


    $$

    v_{\phi}^{\,{}^4\mathrm{He}} = \mathbf{v}^{\,{}^4\mathrm{He}} \cdot \hat{\phi}

    $$


    where $v_{\phi}^{\,{}^4\mathrm{He}}$ is the signed toroidal component in m.s^-1,
    $\mathbf{v}^{\,{}^4\mathrm{He}}$ is the local helium-4 ion fluid velocity vector
    in m.s^-1, and $\hat{\phi}$ is the dimensionless unit vector in the direction
    of increasing $\phi$.


    The pedestal-top value is determined by identifying the pedestal-top location
    from edge pressure or related kinetic profiles and evaluating the helium-4 toroidal
    flow there. The flow can be obtained from Doppler-spectroscopic ion-flow measurements
    when suitable helium emission is available, or inferred from edge momentum analysis
    constrained by available diagnostics.


    A broad order-of-magnitude guide for pedestal-top ion rotation is $-5\times 10^4$
    to $5\times 10^4$ m.s^-1; actual values can be much smaller when edge momentum
    drive is weak.


    Sign convention: Positive when the helium-4 ion flow is directed along increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_pedestal_top
  - name:toroidal_deuterium_velocity_at_pedestal_top
  - name:toroidal_hydrogen_velocity_at_pedestal_top
  - name:toroidal_neon_velocity_at_pedestal_top
- name: toroidal_helium_4_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal velocity of helium-4 ions at the plasma boundary.
  documentation: 'Toroidal helium-4 velocity at the plasma boundary is the local toroidal
    component of the helium-4 ion bulk flow evaluated on the last closed flux surface.
    It is a local boundary value at the evaluation point, not a flux-surface average;
    by contrast, [toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary](name:toroidal_helium_3_velocity_at_plasma_boundary)
    represents a boundary value averaged over a flux surface for helium-3.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the quantity is the projection
    of the helium-4 bulk velocity onto the toroidal basis direction:


    $$

    v_{\phi,{}^{4}\mathrm{He}}(\mathbf{x}_b) = \mathbf{u}_{{}^{4}\mathrm{He}}(\mathbf{x}_b)
    \cdot \hat{\phi}

    $$


    where $\mathbf{x}_b$ is a point on the plasma boundary, $\mathbf{u}_{{}^{4}\mathrm{He}}$
    is the helium-4 ion bulk velocity in m.s^-1, $\hat{\phi}$ is the dimensionless
    unit vector in the direction of increasing toroidal angle, and $v_{\phi,{}^{4}\mathrm{He}}$
    is in m.s^-1.


    In practice this velocity is obtained from local edge ion-flow measurements, such
    as Doppler shifts of helium emission where available, or from edge plasma modeling
    and interpolation to the last closed flux surface. The value may vary around the
    boundary, so it should not be interpreted as a flux-surface-averaged toroidal
    flow unless that averaging is explicitly part of the named quantity.


    Typical edge helium-ion toroidal velocities are often of order 10^3-10^5 m.s^-1,
    with values near 0 possible at flow reversal or stagnation points. The magnitude
    and sign depend on momentum input, collisional coupling to other ion species,
    neoclassical effects, and edge electric fields.


    Sign convention: Positive when the helium-4 ion bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/helium_4/value
