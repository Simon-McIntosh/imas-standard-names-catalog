name: poloidal_component_of_neutral_energy_flux
status: draft
description: Poloidal projection of the neutral-species energy flux density, quantifying
  energy transport by neutrals in the poloidal direction.
documentation: "The poloidal neutral energy flux $Q_{\\theta}^{\\rm n}$ (W m$^{-2}$)\
  \ represents the rate of energy carried by neutral particles per unit area along\
  \ the poloidal direction $\\hat{\\theta}$. It enters the neutral energy balance\
  \ equation $\\partial W_n/\\partial t + \\nabla \\cdot \\mathbf{Q}^{\\rm n} = S_E^{\\\
  rm n}$, where $W_n$ is the neutral energy density (J m$^{-3}$) and $S_E^{\\rm n}$\
  \ the volumetric energy source (W m$^{-3}$). Neutral energy transport is dominated\
  \ by free-streaming between charge-exchange events; in high-recycling divertors\
  \ the poloidal component can reach $10^{3}$\u2013$10^{5}$ W m$^{-2}$ depending on\
  \ neutral density and temperature. This quantity is evaluated on GGD grid elements\
  \ in edge transport codes. Positive values denote energy transport in the $+\\hat{\\\
  theta}$ direction under the adopted coordinate convention."
