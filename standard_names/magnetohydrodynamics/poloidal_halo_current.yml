name: poloidal_halo_current
status: draft
description: Total electric current flowing in the poloidal direction through the
  halo plasma during a disruption, closing through the vacuum vessel and plasma-facing
  components.
documentation: "The poloidal halo current $I_{\\mathrm{halo},\\theta}$ (A) flows along\
  \ poloidal paths in the scrape-off and halo plasma that develop when the plasma\
  \ column moves toward the wall during a disruption or vertical displacement event\
  \ (VDE). These currents close through conducting structures (vacuum vessel, divertor,\
  \ blanket modules), exerting large $\\mathbf{j} \\times \\mathbf{B}$ forces that\
  \ can exceed design limits if asymmetrically distributed. The halo current fraction\
  \ $f_{\\mathrm{halo}} = I_{\\mathrm{halo},\\theta} / I_p$ typically reaches 0.2\u2013\
  0.5 of the pre-disruption plasma current $I_p$ in major disruptions. Measurement\
  \ is performed using Rogowski coils embedded in divertor cassettes or shunt resistor\
  \ tiles. Poloidal asymmetry of the halo current, quantified by the toroidal peaking\
  \ factor, is a primary driver of localized mechanical loading on plasma-facing components."
