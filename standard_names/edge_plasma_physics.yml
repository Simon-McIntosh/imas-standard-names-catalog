    dd_path: plasma_profiles/ggd/neutral/state/velocity_diamagnetic/poloidal
    status: composed
- name: radial_convection_velocity
  kind: scalar
  status: draft
  description: Radial component of the bulk plasma velocity arising from convective
    transport processes.
  documentation: 'The radial convection velocity $v_{\mathrm{conv},r}$ represents
    the radial component of the bulk fluid velocity associated with advective transport.
    This quantity characterizes the radial movement of the bulk plasma due to convective
    processes, such as those driven by turbulent eddies or neoclassical flows. The
    radial convection velocity is related to the radial particle flux $\Gamma_r =
    n v_{\mathrm{conv},r}$, where $n$ is the bulk plasma density. In the edge and
    scrape-off layer, typical radial convection velocities range from 10 to 1000 m/s,
    driven by edge-localized modes (ELMs), blobs, and turbulence. Model-based transport
    codes infer $v_{\mathrm{conv},r}$ by combining measured density and particle flux
    profiles. The radial component is defined in the IMAS cylindrical $(R, \phi, Z)$
    frame, projected onto the direction of the outward major radius $R$.


    Sign convention: Positive when the convection velocity is directed outward in
    the major radius $R$.


    Cross-references: See the parent quantity [convection_velocity](name:convection_velocity)
    for the full vector definition. Compare with the charge-state-resolved [radial_ion_convection_velocity](name:radial_ion_convection_velocity)
    for ion-specific transport, and [poloidal_ion_velocity_due_to_convection](name:poloidal_ion_velocity_due_to_convection)
    for the poloidal component. For the transported energy, see [radial_total_ion_energy_flux](name:radial_total_ion_energy_flux).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:convection_velocity
