- name: toroidal_magnetic_field_at_magnetic_axis
  kind: scalar
  status: active
  description: Signed toroidal component of the total equilibrium magnetic field evaluated
    at the magnetic axis, including vacuum and plasma-current contributions.
  documentation: 'This quantity is the toroidal projection of the total equilibrium
    magnetic field at the magnetic-axis position in the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    $$

    B_{\phi,\mathrm{axis}} = \mathbf{B}_{\mathrm{total}}(\mathbf{x}_{\mathrm{axis}})
    \cdot \hat{\phi}

    $$


    where $B_{\phi,\mathrm{axis}}$ is the magnetic-field component at the axis, $\mathbf{B}_{\mathrm{total}}$
    is the equilibrium field including vacuum and plasma-current contributions, $\mathbf{x}_{\mathrm{axis}}$
    is the magnetic-axis position, and $\hat{\phi}$ is the unit vector in the direction
    of increasing toroidal angle. It is the axis-local counterpart of the general
    [toroidal magnetic field](name:toroidal_magnetic_field) and is distinct from the
    [toroidal reference magnetic field](name:toroidal_reference_magnetic_field) when
    that reference uses a separate prescribed location or convention.


    Sign convention: Positive when the total magnetic field at the magnetic axis points
    in the direction of increasing toroidal angle $\phi$.'
