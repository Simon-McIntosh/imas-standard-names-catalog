- name: bragg_crystal_width
  kind: scalar
  status: draft
  description: Full width of the Bragg crystal in an X-ray crystal spectrometer along
    the first transverse (X1) axis, applicable only for rectangular crystal geometry.
  documentation: 'The Bragg crystal width specifies the physical extent of the diffracting
    crystal element along its first transverse coordinate axis (X1) in an X-ray crystal
    spectrometer channel. This dimension is only defined for rectangular crystal geometry;
    together with bragg_crystal_height along the orthogonal X2 axis and [thickness_of_bragg_crystal](name:thickness_of_bragg_crystal)
    through the crystal body, it fully parameterizes the three-dimensional rectangular
    crystal geometry required for solid-angle and acceptance calculations.


    The X1 width governs the acceptance aperture along the meridional or sagittal
    direction depending on the crystal mount orientation. A larger width intercepts
    a greater solid angle of X-ray emission from the plasma source, increasing photon
    throughput, but can introduce geometric aberrations in curved-crystal focusing
    arrangements such as Johann or Johansson geometries. The bragg_wavelength separately
    characterizes the diffraction condition, linking crystal orientation to the photon
    energies that satisfy Bragg''s law.


    Typical crystal widths for fusion-diagnostic X-ray spectrometers range from a
    few millimeters to a few tens of millimeters, depending on crystal material and
    spectrometer geometry.


    Sign convention: Positive when the extent is measured as a physical length from
    one edge of the crystal to the other along the X1 transverse axis of the crystal
    coordinate frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:thickness_of_bragg_crystal
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/x1_width
    dd_path: spectrometer_x_ray_crystal/channel/crystal/x1_width
    status: composed
- name: bremsstrahlung_power
  kind: scalar
  status: draft
  description: Total electromagnetic power radiated by the plasma via bremsstrahlung,
    the continuum emission arising from electron deceleration in the Coulomb fields
    of plasma ions.
  documentation: 'Bremsstrahlung (braking radiation) is continuum electromagnetic
    emission produced when free electrons are decelerated in the Coulomb fields of
    ions; this quantity is the plasma-volume-integrated total radiated power from
    that process, representing a global energy loss term in the plasma power balance.


    The total bremsstrahlung power is defined by:


    $$

    P_\text{brem} = C_\text{brem} \int n_e^2(\mathbf{r})\, Z_\text{eff}(\mathbf{r})\,
    T_e^{1/2}(\mathbf{r})\, dV

    $$


    where $n_e$ is the electron number density in m$^{-3}$, $Z_\text{eff}$ is the
    mean effective ion charge, $T_e$ is the electron temperature in eV, and $C_\text{brem}
    \approx 5.34 \times 10^{-37}$ W m$^3$ eV$^{-1/2}$ is the free-free emission coefficient.
    The strong $n_e^2$ and $Z_\text{eff}$ dependence means impurity content significantly
    amplifies bremsstrahlung losses.


    The global bremsstrahlung power is inferred from broadband bolometric measurements
    or by volumetrically integrating $n_e$, $T_e$, and $Z_\text{eff}$ profiles derived
    from Thomson scattering and spectroscopy. The local spectral counterpart [bremsstrahlung
    spectral radiance] additionally enables $Z_\text{eff}$ inference from visible
    continuum emission.


    Together with [power due to line radiation](name:power_due_to_line_radiation)
    from bound-bound atomic transitions and [power due to synchrotron radiation](name:power_due_to_synchrotron_radiation)
    from relativistic electron gyration, bremsstrahlung emission is one of the principal
    radiative power loss channels. In present-generation tokamaks, total bremsstrahlung
    losses range from approximately 0.5-10 MW; in high-density, high-$Z_\text{eff}$
    burning-plasma scenarios, losses can reach several tens of MW.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_due_to_line_radiation
  - name:power_due_to_synchrotron_radiation
  sources:
  - id: dd:summary/global_quantities/power_bremsstrahlung/value
    dd_path: summary/global_quantities/power_bremsstrahlung/value
    status: composed
- name: brightness_of_soft_xray_detector
  kind: scalar
  status: draft
  description: Photon radiance of soft X-ray emission received on a detector channel,
    integrated over the detector's energy acceptance band.
  documentation: 'Soft X-ray (SXR) brightness is the number of soft-X-ray photons
    arriving at a detector channel per unit area, per unit time, and per unit solid
    angle, integrated over the instrument''s energy acceptance band. The emission
    originates from free-free (bremsstrahlung), free-bound (recombination), and bound-bound
    (line radiation) contributions from electrons and impurity ions in the sub-keV
    to few-keV photon energy range.


    The quantity is defined by the energy-band integral of the differential photon
    radiance:


    $$

    B = \int_{E_1}^{E_2} \frac{d^4 N}{dA \, dt \, d\Omega \, dE} \, dE

    $$


    where $E_1$ and $E_2$ are the lower and upper energy limits of the detector''s
    acceptance band, $N$ is the photon count, $A$ is the detector active area, $t$
    is time, and $\Omega$ is the solid angle subtended by the detection geometry.


    SXR detectors are arranged in multi-channel arrays covering the plasma cross-section
    with fan-beam line-of-sight geometries. Individual channel signals are combined
    via tomographic inversion to reconstruct the local emissivity, enabling plasma
    tomography, detection of MHD modes such as sawteeth and neoclassical tearing modes,
    and tracking of impurity transport. The companion power-radiance quantity [spectral_radiance_of_soft_xray_detector](name:spectral_radiance_of_soft_xray_detector)
    weights each photon by its energy rather than counting it. For the analogous photon-count
    brightness in the hard X-ray regime, see [hard_xray_brightness](name:hard_xray_brightness).'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance_of_soft_xray_detector
  - name:hard_xray_brightness
  sources:
  - id: dd:soft_x_rays/channel/intensity
    dd_path: soft_x_rays/channel/intensity
    status: composed
- name: brightness_of_visible_camera
  kind: scalar
  status: draft
  description: Photon radiance measured by a visible-band camera channel, giving the
    number of photons collected per unit detector area, per unit time, and per unit
    solid angle along a line of sight.
  documentation: 'Brightness of a visible camera is the photon radiance reaching the
    camera within its visible passband along a line of sight. It counts photons rather
    than radiant energy, normalized by collection area, observation time, and accepted
    solid angle, with the viewing-angle projection treated explicitly.


    The photon radiance can be defined from the photons collected by a small detector
    element viewing a small solid angle:


    $$

    B_\mathrm{vis} = \frac{dN_\gamma}{dt\,dA\,\cos\alpha\,d\Omega}

    $$


    where $B_\mathrm{vis}$ has unit m^-2.s^-1.sr^-1, $dN_\gamma$ is the photon count
    with unit 1, $dt$ is the exposure or integration time in s, $dA$ is the unprojected
    physical detector area in m^2, $\alpha$ is the [alpha angle] in rad between the
    detector surface normal and the incoming ray, and $d\Omega$ is the accepted solid
    angle in sr. The factor $dA\cos\alpha$ is the projected detector area normal to
    the ray.


    In practice this quantity is obtained from calibrated camera counts after dark-offset
    subtraction, flat-field and gain correction, detector quantum-efficiency calibration,
    exposure-time normalization, optical-transmission correction, and geometric calibration
    of the viewed solid angle. It can include visible line radiation, continuum bremsstrahlung,
    molecular-band emission, impurity radiation, and light from plasma-wall interactions
    within the camera response band.


    Typical magnitudes vary widely with wavelength band, viewing geometry, and plasma
    conditions. Faint continuum or wall-background signals may be about 10^15-10^18
    m^-2.s^-1.sr^-1, while bright edge or divertor line emission is often 10^18-10^22
    m^-2.s^-1.sr^-1; intense transient or saturated views can exceed 10^22 m^-2.s^-1.sr^-1.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:camera_visible/channel/detector/frame/radiance
    dd_path: camera_visible/channel/detector/frame/radiance
    status: composed
- name: cold_neutral_fraction
  kind: scalar
  status: draft
  description: Cold neutral fraction is the dimensionless fraction of a hydrogen-isotope
    neutral population assigned to the low-energy neutral component. It is defined
    relative to the cold and hot neutral components used in the analysis; the cold/hot
    boundary must be specified by the diagnostic or population model.
  documentation: 'The cold neutral fraction is the population fraction of neutral
    atoms of a specified hydrogen isotope that are classified as cold, meaning lower
    in kinetic energy than the corresponding hot neutral component. The classification
    boundary between cold and hot neutrals is not universal; it is set by the diagnostic
    interpretation, spectral decomposition, or population model used for the isotope
    being analyzed.


    For a two-component cold/hot decomposition, the cold neutral fraction is


    $$

    f_\mathrm{cold} = \frac{n_\mathrm{cold}}{n_\mathrm{cold} + n_\mathrm{hot}}

    $$


    where $n_\mathrm{cold}$ and $n_\mathrm{hot}$ are the cold and hot neutral number
    densities for the same isotope, typically in $\mathrm{m}^{-3}$. For nonnegative
    densities this gives $0 \le f_\mathrm{cold} \le 1$. If additional neutral populations
    are treated separately or excluded from the decomposition, the fraction applies
    only to the cold-plus-hot population used in the denominator.


    In visible spectroscopy, this fraction is commonly inferred by separating emission
    associated with low-energy recycled or thermal neutrals from emission associated
    with higher-energy neutrals, using line shapes, Doppler broadening, line ratios,
    and collisional-radiative modeling. The inferred value depends on the adopted
    cold/hot energy threshold and on corrections for atomic physics rates, viewing
    geometry, and instrument response.


    Typical values can span the full range 0-1. Values near 1 indicate that the represented
    neutral population is dominated by low-energy recycled or thermal neutrals, while
    values near 0 indicate dominance by the hot neutral component, for example from
    energetic charge-exchange populations or beam-related neutrals.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_fraction
  - name:neutral_fraction
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_fraction
    status: composed
- name: deuterium_deuterium_power_density_due_to_fusion
  kind: scalar
  status: draft
  description: Local fusion energy release rate per unit volume from deuterium-deuterium
    reactions. It includes energy released through the neutron-emitting and proton-emitting
    D-D branches, expressed as a volumetric power density.
  documentation: 'Deuterium-deuterium fusion power density is the local rate at which
    nuclear binding energy is released per unit plasma volume by reactions between
    deuterium ions. It is a source term for fusion product energy before any subsequent
    transport, slowing down, or wall losses. The quantity includes energy released
    in both principal D-D branches, not only the neutron-emitting branch.


    Using a total D-D reactivity summed over the neutron-emitting and proton-emitting
    branches, the local power density is


    $$

    p_{DD} = \frac{1}{2} n_D^2 \langle\sigma v\rangle_{DD} E_{DD} = \epsilon_{n,DD}\frac{E_{DD}}{f_n}

    $$


    where $n_D$ is deuterium ion density in $\mathrm{m}^{-3}$, $\langle\sigma v\rangle_{DD}$
    is the velocity-distribution-averaged total D-D reactivity in $\mathrm{m}^3\,\mathrm{s}^{-1}$,
    and $E_{DD}$ is the branch-weighted reaction energy in joules. The factor $1/2$
    avoids double counting pairs of identical deuterons. $\epsilon_{n,DD}$ is the
    neutron emissivity from the D-D neutron branch in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$
    and $f_n$ is that branch''s fraction of all D-D reactions, so neutron-branch emissivity
    is converted to total D-D power density by multiplying by $E_{DD}/f_n$. For nearly
    equal branch probabilities, $f_n \approx 0.5$; with branch energies of 3.27 MeV
    and 4.03 MeV, $E_{DD} \approx 3.65$ MeV = $5.85\times10^{-13}$ J per total D-D
    reaction, and $E_{DD}/f_n \approx 7.30$ MeV = $1.17\times10^{-12}$ J per emitted
    D-D neutron.


    In practice, this quantity may be computed from deuterium density, ion velocity
    distributions, and nuclear reactivity data, or inferred from neutron measurements.
    Tomographic inversion estimates the local D-D neutron emissivity, after which
    branch fractions and reaction energies provide the conversion to total fusion
    power density. Absolute calibration, scattered-neutron corrections, viewing geometry,
    fuel dilution, and nonthermal deuterium populations can all affect the inferred
    value.


    Typical core values in present deuterium plasmas range from 10-10^4 W m^-3 for
    thermal ion temperatures of a few to about 15 keV. Hotter plasmas or plasmas with
    strong fast-ion populations can reach 10^5-10^6 W m^-3 locally, while values near
    the cool plasma edge are often much smaller.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_power_density_due_to_fusion
  - name:power_density_due_to_fusion
  - name:deuterium_deuterium_flux_due_to_thermal_fusion
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fusion_power_dd
    dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dd
    status: composed
- name: deuterium_tritium_power_density_due_to_fusion
  kind: scalar
  status: draft
  description: Local volumetric power density from deuterium-tritium thermonuclear
    reactions, with each reaction yielding 17.6 MeV distributed between the alpha
    particle (3.5 MeV) and the neutron (14.1 MeV).
  documentation: "The D-T fusion power density is the local rate at which deuterium-tritium\
    \ reactions $D + T \\rightarrow {}^4\\mathrm{He} + n$ deposit energy per unit\
    \ plasma volume, with each event releasing $Q_\\mathrm{DT} = 17.6\\,\\mathrm{MeV}$,\
    \ partitioned as 3.5 MeV to the alpha particle and 14.1 MeV to the 14.1 MeV neutron.\n\
    \nThe volumetric power density is defined by:\n\n$$\nP_\\mathrm{DT} = n_D \\,\
    \ n_T \\, \\langle \\sigma v \\rangle_\\mathrm{DT} \\, Q_\\mathrm{DT}\n$$\n\n\
    where $n_D$ and $n_T$ are the local deuterium and tritium number densities, $\\\
    langle \\sigma v \\rangle_\\mathrm{DT}$ is the velocity-averaged D-T fusion reactivity\
    \ (maximized near ion temperature $T_i \\approx 65\\,\\mathrm{keV}$), and $Q_\\\
    mathrm{DT} = 17.6\\,\\mathrm{MeV}$ is the total energy released per reaction.\n\
    \nThe spatial distribution of $P_\\mathrm{DT}$ is inferred from neutron emissivity\
    \ tomography: multi-channel neutron detector signals are tomographically inverted\
    \ to yield the [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion)\
    \ (volumetric reaction rate), which is then scaled by $Q_\\mathrm{DT}$ to obtain\
    \ the power density. In a balanced D-T fuel mixture at reactor-relevant temperatures\
    \ of 10\u201320 keV, the D-T channel dominates the total [power_density_due_to_fusion](name:power_density_due_to_fusion),\
    \ exceeding the [deuterium_deuterium_power_density_due_to_fusion](name:deuterium_deuterium_power_density_due_to_fusion)\
    \ by roughly two orders of magnitude due to the much larger D-T reactivity at\
    \ these temperatures. Peak on-axis values in near-ignition plasmas are expected\
    \ to reach several MW m$^{-3}$."
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:power_density_due_to_fusion
  - name:deuterium_deuterium_power_density_due_to_fusion
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fusion_power_dt
    dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dt
    status: composed
- name: energy_of_detector_pixel
  kind: scalar
  status: draft
  description: Characteristic photon energy assigned to a detector pixel in an X-ray
    crystal spectrometer from the pixel's Bragg diffraction geometry.
  documentation: 'The energy of a detector pixel is the central photon energy represented
    by that pixel''s spectral channel in an X-ray crystal spectrometer. It is set
    by the pixel position relative to the diffracting crystal and detector surface,
    and is the energy counterpart of the pixel Bragg wavelength [wavelength_of_detector_pixel](name:wavelength_of_detector_pixel).
    The finite spectral acceptance of the pixel is bracketed by [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).


    For diffraction order $n$, the central pixel energy follows from Bragg''s law
    and the photon relation $E = hc/\lambda$:


    $$

    E_\mathrm{pix} = \frac{n h c}{2 e d \sin\theta_\mathrm{pix}}

    $$


    where $E_\mathrm{pix}$ is the photon energy in eV, $n$ is the dimensionless positive
    integer diffraction order, $h$ is Planck''s constant in J s, $c$ is the speed
    of light in vacuum in m s^-1, $e$ is the elementary charge used to convert joules
    to electronvolts, $d$ is the crystal-plane spacing in meters, and $\theta_\mathrm{pix}$
    is the Bragg angle for the pixel in radians.


    The energy-to-pixel mapping is obtained from the spectrometer geometry by ray
    tracing, from an optical model of the crystal and detector, or by calibration
    against emission lines with well-known photon energies. In fusion applications
    these lines often come from highly ionized impurities, such as He-like or H-like
    argon, krypton, or other injected species.


    Typical photon energies range from a few hundred eV for soft X-ray instruments
    to 5-20 keV for harder X-ray crystal spectrometers, depending on the chosen crystal
    spacing, diffraction order, viewing geometry, and target spectral lines.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_detector_pixel
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
- name: extent_of_detector_pixel
  kind: scalar
  status: draft
  description: Physical linear span of a detector pixel footprint along a specified
    direction in the detector plane. It supports pixel-index to physical-position
    calibration, but is distinct from optical resolution and from pixel pitch when
    inactive gaps or non-square pixels are present.
  documentation: 'Extent of a detector pixel is the linear span of one pixel footprint
    along a chosen detector-plane direction. The footprint may represent the active
    sensitive area for photon collection or the effective pixel cell used in a geometric
    calibration; it should not be confused with the center-to-center pitch unless
    neighboring pixels tile the detector plane without appreciable inactive gaps.
    For rectangular pixels, the horizontal and vertical extents are separate quantities;
    for square pixels they are equal.


    The extent along one local detector-plane axis is defined by the coordinate bounds
    of the pixel footprint:


    $$

    d_a = a_+ - a_-

    $$


    where $a \in \{u,v\}$ selects a coordinate of the local detector-plane frame $(\hat{u},\hat{v})$
    with coordinates $(u,v)$, $a_-$ and $a_+$ are the lower and upper footprint boundaries
    in meters, and the pixel center on that axis is $a_c=(a_-+a_+)/2$.


    Values are obtained from sensor design data, detector metrology, or calibration
    images of a target with known spacing. For index-to-position mappings, the origin
    and the center-versus-edge convention must be specified independently: if $u_0$
    is the lower edge of pixel $i=0$ in the local detector-plane frame $(\hat{u},\hat{v})$
    and $p_u$ is the pitch, the center of pixel $i$ lies at $u_0+(i+1/2)p_u$; $p_u=d_u$
    only for contiguous pixels with negligible gaps, with $u_0$, $p_u$, and $d_u$
    expressed in meters.


    Typical values are $5 \times 10^{-6}$-$2 \times 10^{-4}$ m. Infrared focal-plane
    sensors commonly use $1 \times 10^{-5}$-$5 \times 10^{-5}$ m pixel extents, while
    x-ray cameras and crystal-spectrometer detectors often use $1 \times 10^{-5}$-$1
    \times 10^{-4}$ m depending on sensor technology and required sampling.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_detector_pixel
  - name:extent_of_soft_xray_detector
  sources:
