- name: normalized_particle_mass
  kind: scalar
  status: active
  description: "Dimensionless ratio of a species\u2019 particle mass to a positive\
    \ reference mass, preserving relative inertial scales in normalized kinetic equations."
  documentation: 'This quantity expresses the inertial mass of one particle of a specified
    species relative to a strictly positive reference mass. It is the normalized counterpart
    of [particle mass](name:particle_mass), rather than an independent mass or mass
    density.


    The normalized particle mass is defined by


    $$

    \bar{m}_s = \frac{m_s}{m_{\mathrm{ref}}}

    $$


    where $m_s$ is the particle mass of species $s$ and $m_{\mathrm{ref}}$ is the
    positive reference mass used by the normalization. The result preserves the relative
    inertial ordering of species while removing the mass scale from normalized equations
    of motion.


    The reference mass must be kept fixed when comparing normalized masses; changing
    it rescales all such ratios by the same factor. This quantity excludes mass associated
    with a population or volume and does not represent a mass density.'
  unit: '1'
  physics_domain: turbulence
  links: []
  arguments:
  - name: particle_mass
    operator: normalized
    operator_kind: qualifier
  sources:
  - dd_path: gyrokinetics_local/species/mass_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-species-mass_norm
    dd_documentation:
      leaf: Normalised mass
      parent_path: gyrokinetics_local/species
      parent: Set of species (including electrons) used in the calculation and related
        quantities
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Normalised mass of a particle species in a local gyrokinetic simulation,
        expressed in units of the reference mass. Sets the species inertia entering
        the gyrokinetic equations and is used to determine the gyroradius and cyclotron
        frequency ratios.
      kind: llm
- name: normalized_particle_perturbed_pressure
  kind: vector
  status: active
  description: Normalized gyrotropic pressure-tensor moment of the perturbed particle
    distribution for a linear gyrokinetic eigenmode, decomposed into components parallel
    and perpendicular to the background magnetic field.
  documentation: 'The normalized particle perturbed pressure is a gyrotropic vector
    quantity representing the pressure fluctuation of the physical particle population
    in a linear gyrokinetic eigenmode, decomposed into components parallel and perpendicular
    to the equilibrium magnetic field $\mathbf{B}$, each expressed dimensionlessly
    as a ratio to a reference thermal pressure $p_\mathrm{ref}$.


    For species $s$, the parallel and perpendicular components are the second velocity-space
    moments of the perturbed particle distribution function $\delta f_s$:


    $$

    \hat{p}_{\parallel,s} = \frac{m_s}{p_\mathrm{ref}} \int v_\parallel^2 \, \delta
    f_s \, d^3v, \qquad \hat{p}_{\perp,s} = \frac{m_s}{2 \, p_\mathrm{ref}} \int v_\perp^2
    \, \delta f_s \, d^3v

    $$


    where $m_s$ is the species mass, $v_\parallel$ and $v_\perp$ are velocities parallel
    and perpendicular to $\mathbf{B}$, and $p_\mathrm{ref} = n_\mathrm{ref} T_\mathrm{ref}$
    is evaluated at the outboard midplane.


    Unlike the corresponding [gyroaveraged gyrocenter perturbed pressure], this quantity
    is built from the full particle distribution function, implicitly incorporating
    finite-Larmor-radius corrections through the particle-to-gyrocenter coordinate
    transformation. The isotropic scalar parent particle_perturbed_pressure is recovered
    as the trace average $\hat{p}_s = (\hat{p}_{\parallel,s} + 2\hat{p}_{\perp,s})/3$.
    The [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure)
    and [perpendicular_normalized_particle_perturbed_pressure](name:perpendicular_normalized_particle_perturbed_pressure)
    components together encode the pressure anisotropy of the eigenmode, with the
    ratio $\hat{p}_{\parallel,s}/\hat{p}_{\perp,s}$ quantifying deviation from local
    thermodynamic equilibrium relevant to mirror-mode and fire-hose stability.


    Sign convention: Positive when the species pressure perturbation corresponds to
    a local increase above the equilibrium background pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
- name: normalized_perturbed_current_density
  kind: vector
  status: active
  description: Dimensionless form of the perturbed current density vector, obtained
    by normalizing the deviation of current density from its equilibrium value to
    characterize finite-Larmor-radius current responses in gyrokinetic turbulence.
  documentation: 'The normalized perturbed current density is the dimensionless vector
    representation of the deviation of current density from its equilibrium value,
    derived as a charge-weighted velocity-space moment of the perturbed gyrocenter
    distribution function $\delta f$. Normalization by a reference current scale renders
    the quantity independent of bulk plasma parameters and enables direct comparison
    of fluctuation amplitudes across different equilibrium configurations.


    The normalization follows the gyrokinetic moment convention:


    $$

    \widetilde{\mathbf{J}} = \frac{\delta \mathbf{J}}{n_\mathrm{ref}\, e\, v_\mathrm{th,ref}}

    $$


    where $n_\mathrm{ref}$ is a reference number density, $e$ is the elementary charge,
    and $v_\mathrm{th,ref}$ is a reference thermal velocity. Finite-Larmor-radius
    effects enter through Bessel-function weighting of the velocity-space integrals,
    capturing the off-diagonal current response at wave scales comparable to the ion
    gyroradius.


    The parallel projection of this vector, [parallel_normalized_perturbed_current_density](name:parallel_normalized_perturbed_current_density),
    is the component most directly relevant to electromagnetic coupling in gyrokinetic
    eigenmode calculations. The dimensional counterpart [perturbed_current_density](name:perturbed_current_density)
    provides the species-resolved current deviation in physical units, to which this
    quantity reduces upon application of the inverse normalization scale.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_current_density
  arguments:
  - name: perturbed_current_density
    operator: normalized
    operator_kind: qualifier
- name: normalized_perturbed_magnetic_field
  kind: vector
  status: active
  description: Dimensionless vector form of the magnetic-field perturbation, obtained
    by dividing the deviation of the magnetic field from its equilibrium reference
    value by the equilibrium field magnitude.
  documentation: 'The normalized perturbed magnetic field $\delta\hat{\mathbf{B}}$
    is the pointwise dimensionless ratio of the magnetic-field deviation from the
    equilibrium background to the equilibrium field magnitude.


    $$

    \delta\hat{\mathbf{B}} = \frac{\delta\mathbf{B}}{B_0}

    $$


    where $\delta\mathbf{B} = \mathbf{B} - \mathbf{B}_0$ is the fluctuating component
    of the total magnetic field, $\mathbf{B}_0$ is the equilibrium background field,
    and $B_0 = |\mathbf{B}_0|$ is the equilibrium field magnitude used as the normalizing
    scale. This normalization is standard in gyrokinetic formulations for representing
    electromagnetic fluctuations in dimensionless form.


    This quantity is the dimensionless counterpart of [perturbed_magnetic_field](name:perturbed_magnetic_field).
    Its [parallel projection](name:parallel_normalized_perturbed_magnetic_field) along
    the equilibrium field direction isolates the compressional electromagnetic fluctuation
    channel, in which perturbations alter the local field strength rather than only
    bending field lines.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_magnetic_field
  arguments:
  - name: perturbed_magnetic_field
    operator: normalized
    operator_kind: qualifier
- name: normalized_perturbed_pressure
  kind: scalar
  status: active
  description: Dimensionless total isotropic pressure moment of the perturbed particle
    distribution function for a linear gyrokinetic eigenmode, normalized by the equilibrium
    species reference pressure.
  documentation: 'The normalized perturbed pressure is the dimensionless isotropic
    trace of the pressure tensor perturbation carried by the particle distribution
    function for a single plasma species in a linear gyrokinetic eigenmode. It captures
    the second velocity-space moment of the non-equilibrium part $\delta f_s$ combined
    symmetrically over parallel and perpendicular velocity directions and normalized
    to the equilibrium reference pressure. As the undifferentiated total, it is the
    parent abstraction for its directional decompositions; see [perturbed_pressure](name:perturbed_pressure)
    for the species-agnostic scalar concept.


    The normalized total pressure moment is:


    $$

    \tilde{p}_s = \frac{1}{p_\mathrm{ref}} \int \frac{m_s}{3}\left(v_\parallel^2 +
    v_\perp^2\right) \delta f_s \, d^3v

    $$


    where $m_s$ is the species mass, $v_\parallel$ is the velocity component along
    the equilibrium magnetic field, $v_\perp^2 = v_{\perp 1}^2 + v_{\perp 2}^2$ is
    the squared perpendicular speed summed over the two gyrophase directions, and
    $p_\mathrm{ref} = n_\mathrm{ref} T_\mathrm{ref}$ is the reference pressure. The
    factor $1/3$ imposes the isotropic trace average $\tilde{p}_s = (\tilde{p}_\parallel
    + 2\tilde{p}_\perp)/3$.


    This moment is computed in local linear gyrokinetic solvers as part of the perturbed-moment
    hierarchy. Its perpendicular projection is the [perpendicular_normalized_perturbed_pressure](name:perpendicular_normalized_perturbed_pressure)
    and the parallel particle-frame component is [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure);
    the corresponding gyrocenter-frame parent is parallel_normalized_gyrocenter_perturbed_pressure.
    For linear eigenmodes the quantity is generally complex-valued, with phase set
    by the eigenmode normalization convention; reported magnitudes are normalization-dependent.


    Sign convention: Positive when the velocity-space moment of the perturbed particle
    distribution yields a net pressure enhancement above the equilibrium reference
    pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_pressure
