- name: deuterium_density
  kind: scalar
  status: active
  description: Deuterium density is the number density of ionized deuterium in the
    fuel-ion population. It is the local density of deuterons, excluding neutral atoms,
    molecules, and line- or volume-averaged deuterium densities.
  documentation: 'Deuterium density is the number density of ionized deuterium in
    the fuel-ion population. As a species-level density it is charge-state-summed
    over ionized atomic charge states; for deuterium this reduces to the singly ionized
    deuteron population.


    The local deuterium density is defined by the charge-state sum


    $$

    n_D = \sum_{q>0} n_{\mathrm{D}^{q+}}

    $$


    where $n_D$ is the deuterium density, $q$ is the positive atomic charge state,
    and $n_{\mathrm{D}^{q+}}$ is the number density of deuterium ions in charge state
    $q$.


    Neutral deuterium atoms, molecular deuterium, and non-deuterium species are excluded.
    This quantity is local; spatial aggregations such as [line-averaged deuterium
    density](name:line_averaged_deuterium_density) and [volume-averaged deuterium
    density](name:volume_averaged_deuterium_density) are distinct quantities.'
  unit: m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:line_averaged_deuterium_density
  - name:volume_averaged_deuterium_density
  - name:ratio_of_tritium_density_to_deuterium_density
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/fuel_ratio
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-fuel_ratio
    dd_documentation:
