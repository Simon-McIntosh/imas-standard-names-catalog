name: tendency_of_particle_count
status: draft
cocos_transformation_type: one_like
description: Net time rate of change of the total particle number due to all source
  and sink processes, integrated over the plasma volume.
documentation: "The tendency of particle count $dN/dt$ (in s$^{-1}$) is the volume-integrated\
  \ net particle source rate: $dN/dt = \\int S_n(\\mathbf{r})\\, dV$, where $S_n$\
  \ (m$^{-3}$ s$^{-1}$) is the local volumetric particle source rate and the integral\
  \ extends over the full simulation or plasma domain. Contributing processes include\
  \ ionization of neutrals, recombination, charge exchange, pellet ablation, neutral\
  \ beam injection, and wall recycling. In steady-state conditions, $dN/dt = 0$ implies\
  \ exact balance between fueling and loss channels; transiently the quantity characterizes\
  \ the global fueling or depletion rate of a given species. Typical global fueling\
  \ rates are $10^{20}$\u2013$10^{22}$ s$^{-1}$ in medium-size tokamaks, while in\
  \ burning-plasma conditions the alpha-particle birth rate alone reaches $\\sim 10^{20}$\
  \ s$^{-1}$. The quantity is evaluated for kinetic distribution functions (markers\
  \ or physical particles) in Monte Carlo and Fokker\u2013Planck codes. See `flux_surface_averaged_particle_source_rate`\
  \ for the radially resolved source and `electron_particle_flux` for the local transport-level\
  \ analog."
