- name: normalized_internal_inductance_of_plasma
  kind: scalar
  status: draft
  description: Normalized internal inductance (li_3 definition) of the plasma, quantifying
    the radial peaking of the poloidal magnetic field profile. Defined as the volume-averaged
    poloidal magnetic field energy normalized by a reference energy constructed from
    the total plasma current and reference major radius, integrated over the plasma
    volume bounded by the last closed flux surface.
  documentation: "The normalized internal inductance $l_{i,3}$ characterizes the radial\
    \ peaking of the poloidal magnetic field $B_p$ within the plasma. It is defined\
    \ under the li_3 convention as\n\n$$l_{i,3} = \\frac{2}{R_0 \\, \\mu_0^2 \\, I_p^2}\
    \ \\int_{V_\\mathrm{p}} B_p^2 \\, dV$$\n\nwhere:\n- $R_0$ is the reference major\
    \ radius (geometric center of the last closed flux surface),\n- $\\mu_0 = 4\\\
    pi \\times 10^{-7}\\;\\text{H m}^{-1}$ is the permeability of free space,\n- $I_p$\
    \ is the total toroidal plasma current,\n- $B_p$ is the magnitude of the poloidal\
    \ magnetic field,\n- $V_\\mathrm{p}$ is the plasma volume bounded by the last\
    \ closed flux surface (LCFS).\n\nAll spatial quantities are defined in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius from the machine\
    \ symmetry axis, $\\phi$ is the toroidal angle increasing counter-clockwise viewed\
    \ from above, and $Z$ is the vertical coordinate.\n\nThe denominator $\\mu_0^2\
    \ I_p^2 R_0 / 2$ serves as a constructed reference energy scale formed from the\
    \ total plasma current and the reference major radius; it is not literally the\
    \ poloidal field energy evaluated at any particular surface. Because $I_p$ enters\
    \ squared, $l_{i,3}$ is positive definite regardless of the direction of plasma\
    \ current flow.\n\nThe li_3 convention differs from related normalizations: the\
    \ li_1 definition normalizes by the line-averaged $\\langle B_p \\rangle^2$ around\
    \ the LCFS contour multiplied by the plasma volume, while the li_2 definition\
    \ uses the poloidal circumference of the LCFS as the characteristic length. For\
    \ details on the unnormalized quantity, see the related standard name.\n\nTypical\
    \ values for tokamak discharges lie in the range $l_{i,3} \\approx 0.5$\u2013\
    $2.0$. A low value ($l_{i,3} \\lesssim 0.7$) indicates a broad or hollow current\
    \ profile; a high value ($l_{i,3} \\gtrsim 1.3$) indicates a strongly peaked current\
    \ density and correspondingly peaked poloidal field. The quantity provides a global\
    \ constraint on current profile shape and is closely linked to MHD stability margins\u2014\
    highly peaked profiles increase susceptibility to sawtooth oscillations and internal\
    \ kink modes.\n\nIn practice, $l_{i,3}$ is inferred from equilibrium reconstruction\
    \ codes that combine external magnetic measurements (flux loops, Rogowski coils)\
    \ with internal diagnostics (motional Stark effect, polarimetry). It is also used\
    \ as a real-time control parameter for plasma shape and vertical stability feedback."
  unit: '1'
  physics_domain: core_plasma_physics
  links:
  - name:internal_inductance
  constraints: []
  sources:
  - id: dd:core_profiles/global_quantities/li
    dd_path: core_profiles/global_quantities/li
    status: composed
- name: parallel_component_of_electric_field
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel electric field, defined as the average
    of the dot product of the electric field and magnetic field vectors divided by
    the reference vacuum toroidal field B0.
  documentation: "The parallel electric field $E_\\parallel$ is defined as the flux-surface\
    \ average\n\n$$E_\\parallel = \\frac{\\langle \\mathbf{E} \\cdot \\mathbf{B} \\\
    rangle}{B_0},$$\n\nwhere $\\langle \\cdot \\rangle$ denotes the flux-surface average,\
    \ $\\mathbf{E}$ is the electric field, $\\mathbf{B}$ is the total magnetic field,\
    \ and $B_0$ is the reference vacuum toroidal magnetic field strength (units T)\
    \ evaluated at a nominal major radius. The numerator $\\langle \\mathbf{E} \\\
    cdot \\mathbf{B} \\rangle$ carries units of V T m$^{-1}$, so dividing by $B_0$\
    \ in T yields the correct unit of V m$^{-1}$. This flux-surface-averaged definition\
    \ is distinct from the local field-aligned projection $\\mathbf{E} \\cdot \\hat{b}$;\
    \ the FSA form accounts for the variation of $|\\mathbf{B}|$ over the flux surface.\n\
    \nIn resistive magnetohydrodynamics, $E_\\parallel$ is related to the ohmic parallel\
    \ current density through\n\n$$E_\\parallel = \\eta_\\parallel \\, j_\\parallel^{\\\
    mathrm{ohm}},$$\n\nwhere $\\eta_\\parallel$ is the parallel electrical resistivity\
    \ (units $\\Omega\\,\\mathrm{m}$) and $j_\\parallel^{\\mathrm{ohm}}$ is the [parallel_component_of_current_density_due_to_ohmic](name:parallel_component_of_current_density_due_to_ohmic).\
    \ This relation enters the resistive diffusion equation for the poloidal magnetic\
    \ flux $\\psi$, with a characteristic timescale $\\tau_R \\sim \\mu_0 a^2 / \\\
    eta_\\parallel$ of order $10^1$\u2013$10^3$ s in present-day tokamaks.\n\nThe\
    \ total parallel current density is the sum of ohmic and non-inductive contributions;\
    \ the non-inductive part is described by [parallel_component_of_non_inductive_current_density](name:parallel_component_of_non_inductive_current_density).\n\
    \nTypical magnitudes of $E_\\parallel$ during the flat-top phase of a tokamak\
    \ discharge are in the range $10^{-3}$\u2013$10^{-1}$ V m$^{-1}$, with larger\
    \ values during current ramp-up or disruption precursors. During plasma initiation,\
    \ $E_\\parallel$ can reach several V m$^{-1}$.\n\nSign convention: Positive when\
    \ $\\langle \\mathbf{E} \\cdot \\mathbf{B} \\rangle > 0$, i.e., when the electric\
    \ field has a net component in the direction of $\\mathbf{B}$ averaged over the\
    \ flux surface."
  unit: V.m^-1
  physics_domain: core_plasma_physics
  links:
  - name:toroidal_component_of_electron_velocity
  - name:poloidal_component_of_ion_velocity
  - name:toroidal_component_of_ion_velocity
  constraints: []
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field_parallel
    dd_path: core_profiles/profiles_1d/e_field_parallel
    status: composed
  - id: dd:plasma_initiation/b_field_lines/e_field_parallel
    dd_path: plasma_initiation/b_field_lines/e_field_parallel
