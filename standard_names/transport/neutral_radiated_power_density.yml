name: neutral_radiated_power_density
status: draft
description: Electromagnetic power radiated per unit volume by neutral species, summing
  contributions from all neutral populations.
documentation: "The neutral radiated power density $P_{\\mathrm{rad},n}$ (unit $\\\
  mathrm{W\\,m^{-3}}$) captures the volumetric emissivity from neutral atoms and molecules,\
  \ including Lyman and Balmer series line emission from atomic hydrogen isotopes\
  \ and molecular band radiation. In the divertor and near-SOL, neutral densities\
  \ are high enough for $P_{\\mathrm{rad},n}$ to reach $10^4$\u2013$10^7\\;\\mathrm{W\\\
  ,m^{-3}}$, contributing significantly to power exhaust and detachment onset. Neutral\
  \ emissivity is computed from collisional-radiative models (e.g., AMJUEL, HYDHEL,\
  \ Yacora) driven by the local $n_e$, $T_e$, and neutral density $n_0$. Experimentally,\
  \ Balmer-$\\alpha$ ($D_\\alpha$) imaging and filtered cameras provide spatially-resolved\
  \ estimates after inversion. This quantity sums over all neutral species unless\
  \ a species-resolved value is stored separately (see `neutral_state_radiated_power_density`).\
  \ See also `electron_radiated_power_density` and `ion_radiated_power_density` for\
  \ the charged-particle emissivity channels."
