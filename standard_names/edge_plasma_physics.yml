- name: electron_density_at_pedestal
  kind: scalar
  status: draft
  description: Electron number density at the top of the H-mode pedestal, marking
    the radial location where the steep density gradient begins.
  documentation: "The electron density at the pedestal top, $n_{e,\\mathrm{ped}}$,\
    \ quantifies the electron density at the radial location where the steep gradient\
    \ region of the H-mode pedestal begins. This density is a critical parameter for\
    \ pedestal stability, as it directly sets the pedestal pressure and the bootstrap\
    \ current drive through $j_{\\mathrm{BS}} \\propto \\nabla p_e / B_p$. Typical\
    \ values range from $2 \\times 10^{19}$ m$^{-3}$ in present-day tokamaks to $>10^{20}$\
    \ m$^{-3}$ for ITER scenarios, and are routinely inferred from edge Thomson scattering\
    \ or reflectometry profiles. The pedestal top density is closely linked to the\
    \ profile shape parameters, such as the pedestal width and height, and is used\
    \ together with [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)\
    \ to compute the pedestal pressure. See also [electron_density_at_pedestal_maximum](name:electron_density_at_pedestal_maximum)\
    \ for the density at the point of maximum gradient, and [electron_density_at_separatrix](name:electron_density_at_separatrix)\
    \ for the density at the last closed flux surface.\n\nSign convention: Positive\
    \ when the number density of free electrons is greater than zero.\n\nThis quantity\
    \ is sign-invariant \u2014 electron density is always non-negative by definition."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
  - name:electron_density_at_pedestal_maximum
  - name:electron_density_at_separatrix
  sources:
  - id: dd:summary/local/pedestal/n_e/value
    dd_path: summary/local/pedestal/n_e/value
    status: composed
- name: electron_pedestal_width
  kind: scalar
  status: draft
  description: Width of the electron pressure pedestal in normalized poloidal flux,
    measured between the pedestal top and foot locations derived from a linear fit
    of the steep-gradient region.
  documentation: "The electron pedestal width characterizes the radial extent of the\
    \ steep-gradient region of the electron pressure profile in the H-mode pedestal.\
    \ It is defined as the difference in normalized poloidal flux between the pedestal\
    \ top and pedestal foot, obtained from a linear fit to the pressure gradient profile.\
    \ This width is a dimensionless quantity because it is expressed in normalized\
    \ poloidal flux coordinates. The pedestal width, together with the pressure at\
    \ the pedestal top, determines the edge pressure gradient $\\nabla p_e$, which\
    \ governs the stability of edge-localized modes (ELMs) through the peeling\u2013\
    ballooning model. Typical normalized widths range from $\\Delta \\psi_N \\approx\
    \ 0.01$\u2013$0.04$ in contemporary tokamaks. The width is derived from profile\
    \ fits to Thomson scattering or lithium-beam emission spectroscopy data; the linear\
    \ fit method assumes a constant gradient across the pedestal. Related quantities\
    \ include the [pedestal position](name:position_at_pedestal_maximum) and the [maximum\
    \ pressure gradient](name:gradient_of_electron_pressure_at_pedestal).\n\nSign\
    \ convention: Positive when the pedestal width is a finite positive interval (the\
    \ quantity is inherently non-negative)."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:position_at_pedestal_maximum
  - name:gradient_of_electron_pressure_at_pedestal
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/pedestal_width/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/pedestal_width/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/pressure_electron/pedestal_width/value
    dd_path: summary/pedestal_fits/mtanh/pressure_electron/pedestal_width/value
