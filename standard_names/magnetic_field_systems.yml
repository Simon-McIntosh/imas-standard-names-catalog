- name: saturated_permeability_of_ferritic_element
  kind: scalar
  status: draft
  description: Absolute tangent permeability assigned to the saturated high-field
    branch of a ferritic element's nonlinear B-H characteristic. It is the finite-field
    slope used after magnetization is mostly saturated, not the strict infinite-field
    limit of the material.
  documentation: 'Saturated permeability $\mu_\mathrm{sat}$ is the absolute scalar
    permeability assigned to the high-field saturated branch of a ferritic material
    model. It represents the residual slope of the nonlinear $B$-$H$ characteristic
    after the magnetization has largely approached its saturation value. As a scalar,
    it assumes an isotropic or isotropized material response for the ferritic element.


    The saturated permeability is defined as the tangent slope of the saturated branch,
    or in practice as the slope of a linear fit over the selected high-field interval:


    $$

    \mu_\mathrm{sat} = \left.\frac{dB}{dH}\right|_\mathrm{saturated\ branch} \approx
    \frac{\Delta B}{\Delta H}

    $$


    where $B$ is magnetic flux density in tesla, $H$ is magnetic field strength in
    A m$^{-1}$, and $\Delta B/\Delta H$ is evaluated only over the chosen saturated-field
    interval. This is a tangent or fit-slope permeability, not the secant ratio $B/H$
    unless a particular material model defines the fitted high-field line through
    the origin. For an ideal fully saturated material with constant magnetization,
    the collinear SI relation is $B=\mu_0(H+M_\mathrm{sat})$, so the limiting tangent
    slope tends to $\mu_0$ while the offset $\mu_0 M_\mathrm{sat}$ remains.


    The value is obtained from measured or specified $B$-$H$ curves by selecting the
    branch beyond the knee of the magnetization curve and fitting its local slope.
    It is used together with the general field-dependent permeability_of_ferritic_element
    and B-H characteristic quantities such as magnetic_field_of_iron_core_segment
    to model nonlinear ferritic inserts or steel structures. The resulting magnetization
    may be resolved into components such as [radial_magnetization_of_ferritic_element](name:radial_magnetization_of_ferritic_element),
    [toroidal_magnetization_of_ferritic_element](name:toroidal_magnetization_of_ferritic_element),
    and [vertical_magnetization_of_ferritic_element](name:vertical_magnetization_of_ferritic_element)
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    For soft ferromagnetic steels near saturation, $\mu_\mathrm{sat}/\mu_0$ commonly
    ranges from 2-100 over a finite high-field fitting interval, corresponding to
    about $2.5 \times 10^{-6}$-$1.3 \times 10^{-4}$ H m$^{-1}$. Values depend on alloy
    composition, temperature, mechanical processing, magnetic history, and the selected
    field interval; at sufficiently large field the ideal tangent limit approaches
    $\mu_0 = 1.26 \times 10^{-6}$ H m$^{-1}$.'
  unit: H.m^-1
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetization_of_ferritic_element
  - name:toroidal_magnetization_of_ferritic_element
  - name:vertical_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/saturated_relative_permeability
    dd_path: ferritic/object/saturated_relative_permeability
    status: composed
- name: temperature_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Bulk conductor temperature of an individual poloidal field coil.
  documentation: 'Bulk conductor temperature of a poloidal field coil is the representative
    thermodynamic temperature of the current-carrying winding material for one physically
    distinct PF coil. It determines temperature-dependent resistance in normal conductors
    and the thermal margin and allowable current density in superconducting windings.


    When internal temperature gradients are small, or when a single engineering temperature
    is required, the bulk value is commonly interpreted as a conductor-volume average:


    $$

    T_\mathrm{PF} = \frac{1}{V_c}\int_{V_c} T(\mathbf{x})\,dV

    $$


    where $T_\mathrm{PF}$ is the bulk coil temperature, $T(\mathbf{x})$ is the local
    conductor temperature, and $V_c$ is the volume of current-carrying conductor.
    In current-limit characterization, this temperature is an independent variable
    in relations such as $I_\max(T_\mathrm{PF}, B)$ or $J_c(T_\mathrm{PF}, B)$, where
    $B$ is magnetic flux density in tesla and $J_c$ is an allowable or critical current
    density in A m^-2.


    The temperature may be measured by embedded resistance thermometers, thermocouples,
    cryogenic temperature sensors, or inferred from conductor resistance and thermal
    models. Each value refers to a named or otherwise physically identified PF winding,
    such as a particular shaping, vertical-field, divertor-control, or central-solenoid
    module when that module is part of the poloidal-field coil system.


    Typical values are strongly design dependent: cryogenic superconducting windings
    are often operated in the range of a few K to several tens of K, while normal-conducting
    copper coils are commonly near 290-400 K during operation, with pulse heating
    and cooling conditions setting the detailed value.'
  unit: K
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/temperature
    dd_path: pf_active/coil/temperature
    status: composed
- name: thickness_of_iron_core_segment
  kind: scalar
  status: draft
  description: Face-to-face distance across an iron-core segment measured normal to
    its centerline; a non-negative transverse size of the segment cross-section.
  documentation: 'Thickness of an iron-core segment is the face-to-face distance across
    the segment measured along the local normal to its centerline; it is a non-negative
    geometric length. In a local right-handed segment basis $(\hat{s}, \hat{n}, \hat{b})$,
    $\hat{s}$ is tangent to the centerline, $\hat{n}$ is the transverse thickness
    direction, and $\hat{b}$ completes the triad. For axisymmetric poloidal-plane
    descriptions, $\hat{s}$ and $\hat{n}$ lie in the $(R,Z)$ plane of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise
    when viewed from above, and $Z$ is vertical height.


    For a rectangular cross-section normal to the centerline, the thickness sets the
    area together with the segment width:


    $$

    A_\perp = t\,w

    $$


    where $A_\perp$ is the cross-sectional area in m^2, $t$ is the segment thickness
    in m, and $w$ is the [width of the iron-core segment](name:width_of_iron_core_segment)
    in m.


    Thickness is obtained from engineering drawings, surveys, or magnetic-circuit
    geometry by taking the separation of the two bounding faces along $\hat{n}$. In
    electromagnetic calculations, increasing thickness increases cross-sectional area,
    reduces magnetic reluctance, and lowers the magnetic flux density for a given
    total flux, helping to avoid iron saturation.


    Typical values are about 0.05-0.5 m for small pole-piece or local insert segments,
    0.5-2 m for medium transformer-core limbs or return-yoke pieces, and 2-5 m for
    very large iron-core sectors. The selected value depends on required flux, allowable
    saturation, mechanical clearance, and segmentation.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:width_of_iron_core_segment
  - name:height_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  - name:major_length_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/oblique/thickness
    dd_path: iron_core/segment/geometry/oblique/thickness
    status: composed
  - id: dd:iron_core/segment/geometry/thick_line/thickness
    dd_path: iron_core/segment/geometry/thick_line/thickness
