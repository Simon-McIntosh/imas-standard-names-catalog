- name: normalized_poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless normalized poloidal magnetic flux evaluated on the flux
    surface selected as the plasma boundary. It is near unity when that surface coincides
    with, or lies close to, the outer reference flux surface such as the last-closed
    flux surface.
  documentation: 'Normalized poloidal magnetic flux at the plasma boundary is the
    value of the normalized poloidal magnetic-flux function on the flux surface selected
    to represent the plasma boundary. It identifies that boundary relative to the
    magnetic-axis flux and an outer reference flux, which is often the last-closed
    flux surface or separatrix.


    The normalized boundary value is defined by evaluating the normalized poloidal
    flux on the selected boundary surface:


    $$

    \psi_{N,\mathrm{b}} = \left. \frac{\psi - \psi_0}{\psi_\mathrm{ref} - \psi_0}
    \right|_{\psi=\psi_\mathrm{b}}

    $$


    where $\psi$ is the poloidal magnetic flux in Wb, $\psi_0$ is the magnetic-axis
    value in Wb, $\psi_\mathrm{b}$ is the poloidal flux on the selected plasma-boundary
    flux surface in Wb, and $\psi_\mathrm{ref}$ is the outer reference flux in Wb
    used for normalization. If the selected boundary is itself the normalization reference,
    then $\psi_{N,\mathrm{b}}=1$.


    In practice this value is obtained from an equilibrium reconstruction by evaluating
    the normalized poloidal-flux label on the reconstructed boundary contour or on
    the flux surface prescribed as the fixed boundary. This is the normalized flux
    value $\psi_N$ itself; it should not be confused with the square-root radial flux
    coordinate $\rho_\mathrm{pol}=\sqrt{\psi_N}$ represented by [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate).


    Typical values are close to 1 for boundaries chosen near the outer reference flux
    surface. With $\psi_N=0$ at the magnetic axis and $\psi_N=1$ at the reference
    boundary, values from 0 to 1 label closed flux surfaces between those two surfaces,
    and the selected plasma boundary has value 1 when it coincides with the reference
    boundary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
- name: normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label defined as the square root
    of the toroidal magnetic flux enclosed by a flux surface normalized to its value
    at the last closed flux surface, spanning 0 at the magnetic axis to 1 at the plasma
    boundary.
  documentation: "The normalized toroidal flux coordinate $\\rho_{\\rm tor,norm}$\
    \ is a dimensionless radial label identifying nested magnetic flux surfaces in\
    \ an axisymmetric toroidal equilibrium. It equals zero at the magnetic axis and\
    \ unity at the last closed flux surface (LCFS), providing a monotonically increasing\
    \ coordinate that spans the entire confined plasma region.\n\nThe defining relation\
    \ is:\n\n$$\n\\rho_{\\rm tor,norm} = \\sqrt{\\frac{\\Phi_{\\rm tor}}{\\Phi_{\\\
    rm tor,b}}}\n$$\n\nwhere $\\Phi_{\\rm tor}$ is the toroidal magnetic flux enclosed\
    \ within a given flux surface and $\\Phi_{\\rm tor,b}$ is the toroidal flux at\
    \ the plasma boundary.\n\nThe coordinate is obtained from magnetohydrodynamic\
    \ equilibrium reconstruction by integrating the toroidal magnetic field over poloidal\
    \ cross-sections of increasing enclosed area. Because it is rooted in toroidal\
    \ rather than poloidal flux, it is the natural abscissa for radial transport calculations\
    \ and differs from the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)\
    \ except in special limiting geometries. Specific physics events are located by\
    \ their value of this coordinate; for example, [the minimum-safety-factor surface](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor)\
    \ corresponds to a well-defined $\\rho_{\\rm tor,norm}$ that shifts with plasma\
    \ current profile.\n\nThe coordinate spans $[0, 1]$ for all confined flux surfaces.\
    \ In H-mode discharges the steep-gradient pedestal region typically spans $\\\
    rho_{\\rm tor,norm} \\approx 0.85$\u2013$0.95$.\n\nSign convention: Positive when\
    \ the toroidal magnetic flux $\\Phi_{\\rm tor}$ enclosed by the flux surface is\
    \ directed in the same toroidal sense as the flux at the plasma boundary."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/rho_tor_norm
    dd_path: equilibrium/time_slice/profiles_1d/rho_tor_norm
    status: composed
  - id: dd:plasma_profiles/profiles_1d/grid/rho_tor_norm
    dd_path: plasma_profiles/profiles_1d/grid/rho_tor_norm
    status: composed
- name: normalized_toroidal_flux_coordinate_at_constraint_position
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label of a toroidal current-density
    constraint position, equal to the normalized toroidal flux coordinate evaluated
    at that position. It is 0 at the magnetic axis and 1 at the plasma boundary.
  documentation: 'The normalized toroidal flux coordinate at a constraint position
    is the dimensionless radial label of the flux surface on which a toroidal current-density
    constraint is applied. It is the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    evaluated at that constraint position, with the magnetic axis mapped to 0 and
    the plasma boundary mapped to 1.


    The coordinate is defined from the toroidal magnetic flux enclosed between the
    magnetic axis and the flux surface containing the constraint position:


    $$

    \rho_{\mathrm{tor,norm}} = \sqrt{\frac{\Phi}{\Phi_b}}

    $$


    where $\Phi$ is the toroidal magnetic flux enclosed by that flux surface in Wb,
    $\Phi_b$ is the corresponding boundary value in Wb, and the non-negative square
    root is used.


    In equilibrium reconstruction, this quantity specifies where a toroidal current-density
    constraint is located in radial flux space. It is computed by identifying the
    flux surface associated with the constraint position and evaluating the normalized
    toroidal flux radius there; no diagnostic-specific projection mechanism is implied.


    Typical values for constraints on closed flux surfaces lie in the range 0-1. Values
    near 0 correspond to constraints close to the magnetic axis, while values near
    1 correspond to constraints close to the plasma boundary.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: constraint_position
    operator_kind: locus
  sources:
  - id: dd:equilibrium/time_slice/constraints/q/position/rho_tor_norm
    dd_path: equilibrium/time_slice/constraints/q/position/rho_tor_norm
    status: composed
- name: normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Dimensionless radial position of the minimum-safety-factor surface,
    expressed as the normalized toroidal flux coordinate rho_tor_norm, ranging from
    zero at the magnetic axis to unity at the plasma boundary.
  documentation: "The normalized toroidal flux coordinate $\\rho_{\\mathrm{tor,N}}$\
    \ evaluated at the minimum safety factor surface identifies the dimensionless\
    \ radial location of the $q_{\\min}$ surface within the plasma. This coordinate\
    \ ranges from 0 at the magnetic axis to 1 at the plasma boundary, so its value\
    \ distinguishes centrally located $q_{\\min}$ surfaces (near-axis, values close\
    \ to 0) from off-axis surfaces characteristic of reversed-shear plasmas (values\
    \ in the range 0.3\u20130.7).\n\nThe [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)\
    \ is defined as:\n\n$$\n\\rho_{\\mathrm{tor,N}} = \\sqrt{\\frac{\\Phi_{\\mathrm{tor}}}{\\\
    Phi_{\\mathrm{tor,b}}}}\n$$\n\nwhere $\\Phi_{\\mathrm{tor}}$ is the toroidal magnetic\
    \ flux enclosed by a given flux surface and $\\Phi_{\\mathrm{tor,b}}$ is the total\
    \ toroidal magnetic flux within the plasma boundary. This quantity is the value\
    \ of $\\rho_{\\mathrm{tor,N}}$ at the flux surface that globally minimizes $q(\\\
    rho_{\\mathrm{tor,N}})$.\n\nThe location of $q_{\\min}$ is extracted from equilibrium\
    \ reconstruction combining external magnetic measurements with internal diagnostics\
    \ such as motional Stark effect or polarimetry to resolve the $q$-profile shape.\
    \ In conventional H-mode plasmas with monotonically increasing $q$-profiles, $q_{\\\
    min}$ lies near the magnetic axis and this coordinate approaches 0; in reversed-shear\
    \ advanced-tokamak scenarios it is off-axis with values in the range 0.3\u2013\
    0.7. The analogous poloidal-flux-based label for the same surface is given by\
    \ [normalized_poloidal_flux_coordinate_at_minimum_safety_factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor),\
    \ while the corresponding location for the $q = 1$ sawtooth inversion surface\
    \ is [normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius).\n\
    \nSign convention: Positive when the toroidal magnetic flux enclosed within the\
    \ minimum safety factor surface has the same sign as the boundary toroidal flux,\
    \ which holds for all physically realizable nested-flux-surface equilibria."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: minimum_safety_factor
    operator_kind: locus
- name: parallel_flux_surface_averaged_current_density_at_constraint_position
  kind: scalar
  status: draft
  description: Flux-surface averaged current density parallel to the local magnetic
    field, evaluated on the magnetic surface at the constraint point's normalized
    toroidal flux radius.
  documentation: 'Flux-surface averaged parallel current density at a constraint position
    is the average, over a closed magnetic flux surface, of the local current density
    projected along the local magnetic-field direction. The constraint position is
    labeled by the flux coordinate $\rho_{\mathrm{tor,norm}}$, the normalized toroidal
    flux radius, with 0 at the magnetic axis and 1 at the last closed flux surface.


    For a constraint at $\rho_{\mathrm{tor,norm},c}$, the volume-based flux-surface
    average is


    $$

    \langle j_\parallel \rangle(\rho_{\mathrm{tor,norm},c}) =

    \frac{\oint_{\psi=\psi_c} \mathbf{j}\cdot\hat{\mathbf{b}} \, dS/|\nabla\psi|}

    {\oint_{\psi=\psi_c} dS/|\nabla\psi|}

    $$


    where $\mathbf{j}$ is the current-density vector, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field, $dS$ is a surface element on
    the magnetic surface, $\psi_c$ is the poloidal magnetic flux labeling the same
    surface as $\rho_{\mathrm{tor,norm},c}$, and the $dS/|\nabla\psi|$ weighting is
    the volume-derivative form of a flux-surface average. No reference magnetic field
    $B_0$ (a magnetic flux density in tesla) enters this definition; in particular,
    it is not the field-weighted quantity $\langle\mathbf{j}\cdot\mathbf{B}\rangle/B_0$.


    In practice the value is computed from an axisymmetric equilibrium by evaluating
    the reconstructed $\mathbf{j}$ and $\mathbf{B}$ on the flux surface selected by
    $\rho_{\mathrm{tor,norm},c}$ and carrying out the flux-surface average. Constraint
    values can come from consistency with magnetic measurements, polarimetry or motional
    Stark effect information, kinetic pressure and density information, and current-drive
    or transport modeling; comparison is made at the same flux coordinate.


    Typical magnitudes in tokamak equilibrium reconstructions are $10^4-5 \times 10^6$
    A m^-2; values near the magnetic axis in high-current plasmas often reach $0.5-5
    \times 10^6$ A m^-2, while edge constraints can be much smaller and may change
    sign if local current is driven opposite to the magnetic field.


    Sign convention: Positive when the flux-surface averaged projection of the current
    density is along the local magnetic-field direction, so $\langle\mathbf{j}\cdot\hat{\mathbf{b}}\rangle
    > 0$.'
  unit: A.m^-2
  physics_domain: equilibrium
  links: []
- name: plasma_current
  kind: scalar
  status: draft
  description: Net electric current of the plasma column, obtained by integrating
    toroidal current density over the poloidal cross-section; the primary global parameter
    governing poloidal field strength and MHD stability.
  documentation: 'The plasma current $I_p$ is the net toroidal electric current of
    the plasma column, obtained by integrating the toroidal [current density](name:current_density)
    $j_\phi$ over the entire poloidal cross-sectional area bounded by the last closed
    flux surface.


    $$

    I_p = \iint_{\mathcal{S}} j_\phi \, dA

    $$


    where $j_\phi$ is the toroidal component of the current density and $\mathcal{S}$
    is the full poloidal cross-section enclosed by the plasma boundary.


    $I_p$ sets the amplitude of the poloidal magnetic field and, together with the
    toroidal field, determines the safety factor profile that governs MHD stability
    and energy confinement. It incorporates contributions from ohmic induction, pressure-gradient-driven
    bootstrap current, and all non-inductive current-drive mechanisms. It is measured
    directly by Rogowski coils or fiber-optic current sensors exploiting the Faraday
    magneto-optic effect, and may also be inferred from equilibrium reconstruction
    using external magnetic flux loops and field probes. The purely toroidal projection
    is reported as [toroidal total plasma current](name:toroidal_plasma_current).
    Typical values range from a few hundred kA in compact devices to 15 MA in large-scale
    fusion experiments.


    Sign convention: Positive when the net current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from the $+\hat{Z}$ direction).'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:toroidal_plasma_current
- name: plasma_pressure
  kind: scalar
  status: draft
  description: Isotropic scalar pressure of the plasma fluid in a continuum description,
    serving as the parent concept for both the bulk thermal equilibrium pressure and
    first-order perturbative pressure deviations in linear MHD stability analysis.
  documentation: 'Plasma pressure in the fluid (MHD) description is the isotropic
    part of the pressure tensor, entering the radial force balance $\nabla p = \mathbf{j}
    \times \mathbf{B}$, where $\mathbf{j}$ is the current density and $\mathbf{B}$
    is the magnetic field. This parent abstracts over two physically distinct realizations:
    [thermal_plasma_pressure](name:thermal_plasma_pressure), which sums the kinetic
    contributions from bulk thermal electron and ion populations while excluding fast
    or suprathermal particles, and [perturbed_plasma_pressure](name:perturbed_plasma_pressure),
    which represents the complex-amplitude linear eigenfunction $\delta p$ arising
    in stability analysis about a magnetohydrostatic equilibrium.


    In the thermal regime the pressure is given by the equation of state:


    $$

    p = n_e k_B T_e + \sum_i n_i k_B T_i

    $$


    where $n_e$ and $n_i$ are the electron and ion number densities, $T_e$ and $T_i$
    are their respective temperatures, and $k_B$ is the Boltzmann constant. In linear
    MHD stability analysis the equilibrium profile $p_0$ is perturbed as $p = p_0
    + \delta p$, where $\delta p$ is the pressure eigenfunction resolved per toroidal
    Fourier mode.


    Pressure profiles are inferred from equilibrium reconstruction by enforcing the
    radial force-balance constraint against magnetic diagnostic data and a finite
    set of kinetic pressure measurements. The volume integral of the thermal pressure,
    scaled by $3/2$, yields the stored thermal energy [thermal_plasma_energy](name:thermal_plasma_energy),
    while a pointwise sum of electron and ion contributions is captured by [total_thermal_pressure](name:total_thermal_pressure).'
  unit: Pa
  physics_domain: equilibrium
  links:
  - name:thermal_plasma_pressure
  - name:perturbed_plasma_pressure
  - name:thermal_plasma_energy
  sources:
  - id: dd:equilibrium/time_slice/constraints/pressure/measured
    dd_path: equilibrium/time_slice/constraints/pressure/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/pressure/reconstructed
    dd_path: equilibrium/time_slice/constraints/pressure/reconstructed
    status: attached
  - id: dd:equilibrium/time_slice/profiles_1d/dpressure_dpsi
    dd_path: equilibrium/time_slice/profiles_1d/dpressure_dpsi
    status: vocab_gap
  - id: dd:equilibrium/time_slice/profiles_1d/pressure
    dd_path: equilibrium/time_slice/profiles_1d/pressure
    status: composed
  - id: derived:plasma_pressure
    status: composed
- name: plasma_resistance
  kind: scalar
  status: draft
  description: Effective non-negative electrical resistance of the plasma column,
    defined as the volume-integrated ohmic dissipation power divided by the square
    of the total plasma current. It represents the resistive part of the plasma circuit
    response, distinct from inductive voltage associated with changing current or
    magnetic stored energy.
  documentation: 'Plasma resistance is the effective scalar resistance associated
    with collisional ohmic dissipation in the conducting plasma column. It is a non-negative
    quantity for positive ohmic dissipation and characterizes how strongly the plasma
    converts current-driven electrical work into heat, separately from inductive effects
    described by total_plasma_inductance.


    The effective resistance is defined from the ohmic power dissipated in the plasma:


    $$

    R_\mathrm{plasma} = \frac{\int_{V_p} \mathbf{E}\cdot\mathbf{J}\,dV}{I_p^2} = \frac{P_\Omega}{I_p^2}

    $$


    where $R_\mathrm{plasma}$ is in ohm, $V_p$ is the plasma volume, $\mathbf{E}$
    is the electric field in V m$^{-1}$, $\mathbf{J}$ is the current density in A
    m$^{-2}$, $dV$ is a volume element in m$^3$, $P_\Omega$ is the volume-integrated
    ohmic heating power in W, and $I_p$ is the total plasma current in A. When a circuit
    representation is used, this corresponds to the resistive voltage component divided
    by $I_p$ for nonzero current; it should not be identified with the total loop
    voltage unless inductive and other non-resistive voltage contributions have been
    removed.


    In equilibrium and transport analysis, plasma resistance is computed from reconstructed
    current density together with an electrical resistivity or parallel conductivity
    model, or inferred from the resistive component of the plasma voltage balance.
    Its time integral is related to resistive magnetic-flux consumption, represented
    by poloidal_accumulated_resistive_magnetic_flux, while the inductive part of the
    voltage balance is associated with changes in current and magnetic energy through
    total_plasma_inductance.


    Typical values in tokamak plasmas are about 0.01-10 microohm, decreasing strongly
    as electron temperature rises and increasing with effective ion charge and collisionality.
    Cold startup, ramp-down, or low-temperature edge-dominated conditions can have
    substantially larger effective resistance than hot flattop conditions.'
  unit: ohm
  physics_domain: equilibrium
  links: []
- name: polarization_angle_at_constraint_position
  kind: scalar
  status: draft
  description: Motional Stark effect polarization angle evaluated at a discrete spatial
    location designated as a measurement constraint in tokamak equilibrium reconstruction.
  documentation: 'The polarization angle at a constraint position is the angle of
    linear polarization of Stark-split Balmer-alpha emission from fast neutral beam
    ions traversing the plasma, evaluated at a discrete spatial site where this measurement
    serves as an input constraint in equilibrium reconstruction. The motional Stark
    effect (MSE) diagnostic exploits the Lorentz electric field experienced by injected
    beam neutrals to align the polarization plane of the emitted light in a direction
    encoding the local magnetic-field pitch angle.


    The MSE polarization angle $\gamma$ is related to the local magnetic field components
    by:


    $$

    \tan(\gamma) = \frac{B_Z}{A_1 B_R + A_2 B_\phi}

    $$


    where $B_Z$ is the vertical field component, $B_R$ is the radial field component,
    $B_\phi$ is the toroidal field component, and $A_1$, $A_2$ are dimensionless geometric
    weighting factors determined by the beam trajectory and sightline orientation.


    During equilibrium reconstruction, the measured value at each constraint position
    is compared against the corresponding reconstructed [polarization_angle](name:polarization_angle_at_constraint_position)
    to form residuals that enter the least-squares cost functional. The motional_stark_radiance
    provides complementary spectral intensity data from the same beam-emission event.
    MSE polarization angles in conventional-aspect-ratio tokamak configurations span
    a few degrees to roughly 20 degrees, varying with local field pitch, beam geometry,
    and viewing-sightline angle.'
  unit: rad
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/constraints/faraday_angle/measured
    dd_path: equilibrium/time_slice/constraints/faraday_angle/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/mse_polarisation_angle/measured
    dd_path: equilibrium/time_slice/constraints/mse_polarisation_angle/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/mse_polarisation_angle/reconstructed
    dd_path: equilibrium/time_slice/constraints/mse_polarisation_angle/reconstructed
    status: composed
  - id: dd:equilibrium/time_slice/constraints/mse_polarization_angle/measured
    dd_path: equilibrium/time_slice/constraints/mse_polarization_angle/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/mse_polarization_angle/reconstructed
    dd_path: equilibrium/time_slice/constraints/mse_polarization_angle/reconstructed
    status: attached
- name: poloidal_angle
  kind: scalar
  status: draft
  description: "Geometric poloidal angle identifying position around a magnetic flux-surface\
    \ cross-section in the right-handed cylindrical (R, \u03C6, Z) frame. It is measured\
    \ from the outboard midplane about the surface's geometric center and is distinct\
    \ from a straight-field-line poloidal angle."
  documentation: 'Poloidal angle is the geometric angular coordinate of a point on
    a surface of constant [poloidal magnetic flux](name:poloidal_magnetic_flux) around
    the poloidal cross-section. It is defined in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height, with zero at the outboard low-field-side midplane relative to the flux-surface
    center. This quantity is the geometric poloidal angle, not a [straight-field-line
    poloidal angle].


    For a point on a closed flux-surface contour at fixed $\phi$, let $(R_c,Z_c)$
    be the geometric center of that same contour. A definite construction is


    $$

    \theta = \operatorname{atan2}(Z_c - Z,\; R - R_c)

    $$


    where $\theta$ is the poloidal angle in radians, $R$ and $Z$ are the point coordinates
    in meters, $R_c$ and $Z_c$ are center coordinates in meters, and $\operatorname{atan2}(y,x)$
    is the quadrant-aware arctangent. Here the center is defined from the contour
    extrema as $R_c=(R_\mathrm{out}+R_\mathrm{in})/2$ and $Z_c=(Z_\mathrm{top}+Z_\mathrm{bottom})/2$,
    with all extrema measured in meters in the same right-handed cylindrical $(R,\phi,Z)$
    frame.


    In equilibrium analysis, the angle is computed by reconstructing or specifying
    a flux-surface contour, determining its geometric center, and applying the construction
    above to points on that contour. A [straight-field-line poloidal angle] requires
    a separate remapping chosen so magnetic field lines satisfy $d\phi/d\theta^* =
    q(\psi)$, where $\phi$ and $\theta^*$ are angles in radians, $q$ is the dimensionless
    [safety factor](name:safety_factor), and $\psi$ labels the flux surface.


    Because it is periodic, values differing by $2\pi n$ for integer $n$ identify
    the same geometric direction from the chosen center. A single poloidal circuit
    spans $2\pi$ rad; common branch choices include $(-\pi,\pi]$ rad and $[0,2\pi)$
    rad, while unwrapped coordinates may extend beyond these intervals.


    Sign convention: Positive when the angle increases from the outboard midplane
    toward decreasing $Z$ at fixed toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  - name:safety_factor
  sources:
  - id: dd:magnetics/b_field_pol_probe/poloidal_angle
    dd_path: magnetics/b_field_pol_probe/poloidal_angle
    status: composed
- name: poloidal_beta
  kind: scalar
  status: draft
  description: Poloidal beta is the dimensionless ratio of total plasma pressure content
    to the magnetic-pressure scale of the poloidal field generated by the toroidal
    plasma current. It measures the pressure contribution to equilibrium force balance
    relative to the plasma current.
  documentation: 'Poloidal beta, $\beta_p$, is a global equilibrium measure of plasma
    pressure normalized to the magnetic-pressure scale associated with the plasma-current-driven
    poloidal magnetic field. It is used to compare pressure loading with the current
    needed to confine the plasma and is closely connected to Shafranov shift, bootstrap-current
    fraction, and equilibrium stability limits.


    The common volume-integral definition is:


    $$

    \beta_p = \frac{4 \int p \, dV}{R_0 \, \mu_0 \, I_p^2}

    $$


    where $p$ is the total kinetic plasma pressure in pascals, $dV$ is the volume
    element in cubic meters, $R_0$ is a reference major radius in meters measured
    from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, $\mu_0$ is the permeability of free space in H/m, and $I_p$ is the total
    toroidal plasma current in amperes. The squared current makes $\beta_p$ insensitive
    to the sign of $I_p$; unlike [toroidal beta], which is normalized to toroidal-field
    magnetic pressure, $\beta_p$ is normalized to the poloidal-field energy scale
    set by [plasma current](name:toroidal_plasma_current).


    In practice, $\beta_p$ is computed by integrating [plasma pressure](name:plasma_pressure)
    over reconstructed flux-surface volumes, with pressure obtained from density and
    temperature measurements such as Thomson scattering, interferometry, electron-cyclotron
    emission, and charge-exchange spectroscopy. Magnetic equilibrium analysis can
    also constrain $\beta_p$ through the Shafranov shift and external poloidal-field
    measurements. In large-aspect-ratio ordering, external magnetic constraints often
    involve a combined pressure and current-profile term such as $\beta_p + l_i/2$,
    where $l_i$ is the internal inductance, so $\beta_p$ and current-profile information
    are not always independently determined by magnetic measurements alone.


    Typical values are about 0.1-0.5 in Ohmic or L-mode plasmas and 0.3-1.5 in H-mode
    plasmas. Advanced high-bootstrap-current scenarios often target $\beta_p > 1$;
    the bootstrap-current fraction scales approximately with $\epsilon^{1/2}\beta_p$,
    where $\epsilon = a/R_0$ is the inverse aspect ratio.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:toroidal_plasma_current
  - name:plasma_pressure
- name: poloidal_cross_sectional_area_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Area enclosed by the plasma-boundary contour in the poloidal plane\
    \ at fixed toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It is a non-negative measure of the last closed flux surface cross-sectional\
    \ size."
  documentation: 'Poloidal cross-sectional area of the plasma boundary is the area
    of the closed region enclosed by the last closed flux surface in a poloidal plane
    at fixed toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius and $Z$ is vertical height. It characterizes
    the size of the plasma cross section and is non-negative by definition.


    Let $\Omega_p$ be the enclosed region and $\partial\Omega_p$ its boundary contour
    in the poloidal $(R,Z)$ plane of the right-handed cylindrical $(R, \phi, Z)$ frame.
    The area may be written as the plane integral, or equivalently by Green''s theorem
    as an orientation-independent contour integral:


    $$

    A_p = \int_{\Omega_p} dR\,dZ = \frac{1}{2}\left|\oint_{\partial\Omega_p} \left(R\,dZ
    - Z\,dR\right)\right|

    $$


    where $A_p$ is the poloidal cross-sectional area. The absolute value removes any
    dependence on the traversal direction of the boundary contour; reversing the order
    of contour points changes the sign of the line integral but not the physical area.


    In equilibrium analysis, this quantity is computed after identifying the last
    closed flux surface and evaluating the area of its fixed-$\phi$ boundary contour,
    often using a polygon-area or Green-theorem calculation. For axisymmetric equilibria
    the value is independent of $\phi$; for nonaxisymmetric boundaries it refers to
    the specified fixed-$\phi$ poloidal section.


    Typical values are best interpreted through geometric scaling rather than a universal
    device-independent range. For an approximately elliptical boundary, $A_p$ is of
    order $\pi \kappa a^2$, where $a$ is the horizontal minor radius and $\kappa$
    is the elongation, so the area scales quadratically with plasma size and linearly
    with elongation.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:length_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/area
    dd_path: equilibrium/time_slice/global_quantities/area
    status: attached
- name: poloidal_current_function
  kind: scalar
  status: draft
  description: Diamagnetic function equal to the product of major radius and toroidal
    magnetic field, constant on each nested magnetic flux surface in an axisymmetric
    ideal-MHD equilibrium and one of the two free flux-function profiles entering
    the Grad-Shafranov equation.
  documentation: "The poloidal current function $F(\\psi) = R B_\\phi$ is the product\
    \ of the major radius $R$ (distance from the toroidal symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame) and the toroidal magnetic field component\
    \ $B_\\phi$. In axisymmetric ideal-MHD equilibrium, the solenoidal condition $\\\
    nabla \\cdot \\mathbf{J} = 0$ combined with axisymmetry forces $F$ to be constant\
    \ on each nested poloidal flux surface, making it a function solely of the poloidal\
    \ magnetic flux $\\psi$.\n\nThe profile $F(\\psi)$ is one of the two free functions\
    \ of the Grad-Shafranov equation governing axisymmetric magnetohydrostatic equilibrium:\n\
    \n$$\n\\Delta^* \\psi = -\\mu_0 R^2 \\frac{dp}{d\\psi} - F \\frac{dF}{d\\psi}\n\
    $$\n\nwhere $\\Delta^*$ is the elliptic Shafranov differential operator, $p(\\\
    psi)$ is the pressure flux function, and $\\mu_0$ is the permeability of free\
    \ space. The product $F \\, dF/d\\psi$ constitutes the toroidal-field-gradient\
    \ source term and is represented explicitly by the [associated product quantity](name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function).\
    \ In vacuum, $F$ reduces to the constant [vacuum poloidal current function](name:vacuum_poloidal_current_function)\
    \ $F_\\mathrm{vac} = R B_{\\phi,\\mathrm{vac}}$.\n\nThe $F(\\psi)$ profile is\
    \ recovered through equilibrium reconstruction using external magnetic measurements,\
    \ optionally supplemented by internal diagnostic constraints such as motional\
    \ Stark effect polarimetry or q-profile data. Typical magnitudes range from approximately\
    \ 1 to 35 m\xB7T across present-day tokamaks, scaling approximately as $R_0 B_{\\\
    phi,0}$ where $R_0$ is the reference major radius and $B_{\\phi,0}$ is the on-axis\
    \ toroidal field strength.\n\nSign convention: Positive when $B_\\phi$ points\
    \ in the direction of increasing toroidal angle $\\phi$."
  unit: T.m
  physics_domain: equilibrium
  links:
  - name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  - name:vacuum_poloidal_current_function
- name: poloidal_current_weighted_average_external_magnetic_flux
  kind: scalar
  status: draft
  description: Average poloidal magnetic flux produced by circuits external to the
    plasma (central solenoid, poloidal-field coils, in-vessel coils, passive structures,
    and eddy currents), with the average taken over the plasma poloidal cross-section
    weighted by the local toroidal current density. The plasma self-flux is excluded.
  documentation: 'Poloidal magnetic flux generated by all conductors external to the
    plasma, averaged over the plasma cross-section using the local toroidal current
    density as the weighting function. External sources comprise the central solenoid,
    poloidal-field coils, in-vessel coils, passive conducting structures, and induced
    eddy currents; the flux produced by the plasma current itself is not included.
    The qualifier refers to the poloidal magnetic flux being current-weighted by the
    toroidal current density, not to a poloidal-current weighting.


    For an axisymmetric equilibrium, the average over a poloidal cross-section at
    fixed toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ system
    is defined as the toroidal-current-density-weighted integral of the external flux
    divided by the total plasma current:


    $$

    \langle \psi_\mathrm{ext} \rangle = \frac{\int_{\Omega_p} \psi_\mathrm{ext}(R,Z)\,
    j_\phi(R,Z)\, dR\, dZ}{I_p}

    $$


    where $\Omega_p$ is the plasma poloidal cross-section in the $(R,Z)$ plane, $R$
    is the major radius in meters, $Z$ is the vertical height in meters, $\psi_\mathrm{ext}$
    is the external poloidal magnetic flux in Wb, $j_\phi$ is the toroidal current-density
    component in A m$^{-2}$, and $I_p = \int_{\Omega_p} j_\phi\, dR\, dZ$ is the signed
    total plasma current in A. The quantity is meaningful only when $I_p$ is nonzero.


    In practice it is obtained from an equilibrium reconstruction by evaluating the
    poloidal flux contribution of all external circuits across the plasma cross-section
    and combining it with the reconstructed toroidal current-density distribution.
    It characterizes how externally produced flux links the current-carrying plasma
    region and is used in flux-consumption and loop-voltage analyzes; its time derivative
    is the externally driven contribution to the loop voltage seen by the plasma current
    channel.


    Sign convention: Positive when the external-circuit vertical magnetic field threading
    the horizontal flux disks that define $\psi_\mathrm{ext}$ points in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: Wb
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/psi_external_average
    dd_path: equilibrium/time_slice/global_quantities/psi_external_average
    status: attached
  - id: dd:pf_active/global_quantities/psi_coils_average
    dd_path: pf_active/global_quantities/psi_coils_average
    status: attached
- name: poloidal_magnetic_field_at_constraint_position
  kind: scalar
  status: draft
  description: "Signed projection of the poloidal magnetic field at a specified constraint\
    \ position onto the local poloidal sensitive direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'Poloidal magnetic field at a constraint position is the signed component
    of the magnetic field in the meridional $(R,Z)$ plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame, evaluated at a specified spatial point. It is a direction-resolved
    form of poloidal_magnetic_field: the [radial_magnetic_field](name:radial_magnetic_field)
    and vertical component contribute to it, while the [toroidal_magnetic_field](name:toroidal_magnetic_field)
    is excluded.


    The defining projection is


    $$

    B_{\mathrm{pol},c} = \mathbf{B}_{\mathrm{pol}}(R_c,\phi_c,Z_c)\cdot\hat{\mathbf{s}}_{\mathrm{pol},c}
    = B_R(R_c,\phi_c,Z_c)s_R + B_Z(R_c,\phi_c,Z_c)s_Z

    $$


    where $(R_c,\phi_c,Z_c)$ is the constraint position, with $R_c$ and $Z_c$ in meters
    and $\phi_c$ in radians; $\mathbf{B}_{\mathrm{pol}}=B_R\hat{R}+B_Z\hat{Z}$ is
    the local poloidal magnetic-field vector in tesla; and $\hat{\mathbf{s}}_{\mathrm{pol},c}=s_R\hat{R}+s_Z\hat{Z}$
    is the dimensionless unit vector defining the positive local sensitive direction
    in the poloidal plane. For axisymmetric equilibria the field components do not
    depend on $\phi_c$, but the point and the sensitive direction still define the
    signed scalar value.


    In equilibrium calculations, $B_R$ and $B_Z$ may be obtained from a poloidal magnetic-flux
    function $\psi(R,Z)$. The relations $B_R=-(1/R)\partial\psi/\partial Z$ and $B_Z=(1/R)\partial\psi/\partial
    R$ assume the Grad-Shafranov flux normalization in which $\psi$ is the poloidal
    flux per radian, commonly reported in Wb because the radian is dimensionless;
    if a full $2\pi$ flux convention is used, the corresponding $1/(2\pi R)$ factor
    must be included. Only derivatives of $\psi$ enter, so an additive reference such
    as [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    does not change the field.


    The quantity is obtained by evaluating a magnetic-field model at the constraint
    position and projecting it onto the specified sensitive direction, or by calibrating
    a local magnetic probe whose orientation defines that direction. Calibration sets
    the scale in tesla and the positive orientation, while geometric alignment determines
    the coefficients $s_R$ and $s_Z$.


    Representative absolute magnitudes for tokamak wall or near-wall magnetic constraints
    are strongly device- and position-dependent, often spanning roughly 0.001-0.3
    T. The value depends on distance from plasma and coils, enclosed toroidal current,
    plasma shape, and the chosen sensitive direction.


    Sign convention: Positive when the local poloidal magnetic field points along
    the chosen local poloidal sensitive direction at the constraint position.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field
  - name:poloidal_magnetic_flux_at_magnetic_axis
- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Total magnetic flux threading a horizontal disk centered on the toroidal
    symmetry axis, serving as the canonical radial coordinate for labeling nested
    flux surfaces in axisymmetric plasma equilibria.
  documentation: "The poloidal magnetic flux $\\psi$ is the total magnetic flux threading\
    \ a horizontal disk of major radius $R$, centered on the toroidal symmetry axis\
    \ at height $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame. Because\
    \ $\\psi$ is constant on each nested magnetic-flux surface in an axisymmetric\
    \ equilibrium, it provides the natural radial coordinate for plasma profiles and\
    \ equilibrium analysis, ranging from [the magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ to the last-closed-flux-surface boundary.\n\nThe defining integral is:\n\n$$\n\
    \\psi(R, Z) = \\int_0^R B_Z(R', Z) \\, 2\\pi R' \\, dR'\n$$\n\nwhere $B_Z$ is\
    \ the vertical component of the magnetic field and $R'$ integrates from the symmetry\
    \ axis to major radius $R$. In MHD equilibrium, $\\psi$ satisfies the Grad-Shafranov\
    \ equation and all equilibrium quantities \u2014 plasma pressure $p(\\psi)$ and\
    \ the toroidal-field function $F(\\psi) = R B_\\phi$ \u2014 are functions of $\\\
    psi$ alone. The [gradient of the poloidal flux](name:radial_derivative_of_poloidal_magnetic_flux)\
    \ determines the local poloidal-field strength, and the [time derivative](name:time_derivative_of_poloidal_magnetic_flux)\
    \ is related to the inductive electric field by Faraday's law.\n\nEvaluated at\
    \ specific flux surfaces, $\\psi$ serves as a coordinate label; sampled values\
    \ such as [the pedestal value](name:poloidal_magnetic_flux_at_pedestal) provide\
    \ reference points for normalized flux coordinates. The profile is recovered from\
    \ external magnetic measurements \u2014 flux loop signals, pickup coil voltages,\
    \ and Rogowski-integrated coil currents \u2014 through MHD equilibrium reconstruction,\
    \ supplemented by internal constraints from motional Stark effect polarimetry\
    \ where available.\n\nSign convention: Positive when the net vertical magnetic\
    \ field $B_Z$ threading the horizontal integration disk points in the $+Z$ direction."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:time_derivative_of_poloidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_pedestal
  arguments:
  - name: magnetic_flux
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_magnetic_flux_at_flux_surface
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated on a specified closed magnetic flux
    surface in an axisymmetric equilibrium. It is constant over that surface and labels
    its radial position between the magnetic axis and the plasma boundary.
  documentation: 'Poloidal magnetic flux at a flux surface is the value of the equilibrium
    flux function on one specified closed magnetic surface. In an axisymmetric equilibrium,
    nested surfaces of constant poloidal magnetic flux provide the natural radial
    labeling of the confined plasma between the magnetic axis and the plasma boundary.


    Using the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, a flux-surface value can
    be defined by evaluating the disk flux at any point $(R_s, Z_s)$ on that surface:


    $$

    \psi_s = \psi(R_s, Z_s) = \int_0^{R_s} B_Z(R'', Z_s)\, 2\pi R''\, dR''

    $$


    where $\psi_s$ is the poloidal magnetic flux at the selected surface in Wb, $R''$
    and $R_s$ are major radii in m, $Z_s$ is vertical position in m, and $B_Z$ is
    the vertical magnetic-field component in T. The disk is centered on the toroidal
    symmetry axis and lies in the horizontal plane $Z=Z_s$.


    The disk integral fixes one possible additive reference by assigning zero flux
    at $R=0$ for that height. Equilibrium flux functions are otherwise meaningful
    only up to a common additive constant: the same offset must be used for $\psi_s$,
    the [magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis), and the
    [plasma-boundary value](name:poloidal_magnetic_flux_at_plasma_boundary). With
    this common reference, the normalized poloidal flux is $(\psi_s-\psi_0)/(\psi_b-\psi_0)$,
    equal to 0 at the magnetic axis and to the [boundary normalization](name:normalized_poloidal_magnetic_flux_at_plasma_boundary)
    at the plasma boundary.


    In practice, $\psi_s$ is obtained from an axisymmetric equilibrium reconstruction
    or forward equilibrium calculation. The selected surface is identified as a contour
    of the reconstructed poloidal magnetic flux function; because the flux is constant
    on that contour, the evaluated value is independent of which point on the surface
    is used, within reconstruction accuracy.


    Because the additive constant is arbitrary, the meaningful scale is usually a
    flux difference. Typical absolute differences $|\psi_s-\psi_0|$ are about 0.01-1
    Wb in small tokamaks and 1-20 Wb in medium to large tokamaks, depending on the
    selected surface, plasma current, magnetic field strength, and plasma shape.


    Sign convention: Positive when $B_Z$ on the horizontal integration disk points
    in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_constraint_position
- name: poloidal_magnetic_flux_at_magnetic_axis
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the magnetic axis is the value of the equilibrium
    flux function at the innermost closed-flux-surface point where its gradient vanishes.
    It provides the inner reference for normalized poloidal-flux coordinates.
  documentation: 'Poloidal magnetic flux at the magnetic axis, $\psi_0$, is the value
    of the equilibrium poloidal-flux function at the magnetic axis, the innermost
    point of the nested closed-flux-surface family where the poloidal-flux gradient
    vanishes. It is an extremal reference value for radial flux labeling; the absolute
    offset of $\psi$ is gage dependent, so physically meaningful radial labels use
    flux differences such as $\psi - \psi_0$.


    The dimensionless normalized poloidal flux coordinate anchored at the axis is
    commonly defined by:


    $$

    \psi_N = \frac{\psi - \psi_0}{\psi_b - \psi_0}

    $$


    where $\psi_N$ is dimensionless, $\psi$ is the local poloidal magnetic flux in
    Wb, $\psi_0$ is the magnetic-axis value in Wb, and $\psi_b$ is the plasma-boundary
    value in Wb from [poloidal_magnetic_flux_at_plasma_boundary](name:poloidal_magnetic_flux_at_plasma_boundary).
    With this normalization, $\psi_N = 0$ at the magnetic axis and $\psi_N = 1$ at
    the plasma boundary, matching [normalized_poloidal_magnetic_flux_at_plasma_boundary](name:normalized_poloidal_magnetic_flux_at_plasma_boundary).


    Equilibrium reconstruction obtains $\psi_0$ by locating the extremum of the reconstructed
    poloidal-flux map inside the last closed flux surface. The same axis reference
    is used when interpreting flux values at internal features such as an [internal
    transport barrier](name:poloidal_magnetic_flux_at_internal_transport_barrier),
    a [secondary separatrix](name:poloidal_magnetic_flux_at_secondary_separatrix),
    or a pedestal position expressed by [normalized_poloidal_flux_coordinate_of_pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).


    Because an additive gage can be chosen for $\psi$, a universal absolute range
    for $\psi_0$ is not physically meaningful; many equilibria set the axis value
    to 0 Wb. The physically relevant separation $|\psi_b - \psi_0|$ is often 0.1-10
    Wb in small and medium tokamaks and 10-100 Wb in large high-current plasmas.


    Sign convention: Positive when $\psi$ increases outward from the magnetic axis
    toward the plasma boundary.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
- name: poloidal_magnetic_flux_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Poloidal magnetic flux on the closed flux surface where the safety
    factor profile attains its minimum value. It is a dimensional flux given in webers
    that labels that surface, not the dimensionless normalized flux coordinate of
    the same surface.
  documentation: 'Poloidal magnetic flux at minimum safety factor is the value of
    the poloidal magnetic flux on the closed flux surface where the safety factor
    profile reaches its minimum. It provides an absolute, dimensional flux label (in
    webers) for that surface, as opposed to the dimensionless normalized poloidal
    flux coordinate of the same surface.


    The quantity is defined by selecting the flux surface that minimizes the safety
    factor and reading off its poloidal flux:


    $$

    \psi_{q_{\min}} = \psi(\chi_\ast), \qquad \chi_\ast \in \operatorname*{arg\,min}_{\chi
    \in \mathcal{D}} q(\chi)

    $$


    where $\psi$ is the poloidal magnetic flux in Wb, $q$ is the dimensionless safety
    factor, $\chi$ is any monotonic label ordering the nested closed flux surfaces
    of the domain $\mathcal{D}$, and $\chi_\ast$ labels a surface on which $q = q_\mathrm{min}$.
    The argmin form makes no assumption that the minimum is an interior extremum:
    it may occur at the magnetic axis, at an interior surface, or near the plasma
    boundary. The poloidal flux itself is the magnetic flux through a horizontal disk
    centered on the toroidal symmetry axis, $\psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi
    R''\,dR''$, and is defined only up to an arbitrary additive gage constant; only
    flux differences (for example relative to the magnetic axis or boundary) are physically
    meaningful.


    In practice the quantity is obtained from an equilibrium reconstruction by evaluating
    $q$ over the nested closed flux surfaces, identifying the surface that attains
    $q_\mathrm{min}$, and interpolating the corresponding $\psi$ value. The same surface
    can be expressed in dimensionless form by [normalized_poloidal_flux_coordinate_at_minimum_safety_factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor)
    via a normalization such as $\psi_N = (\psi - \psi_\mathrm{axis})/(\psi_\mathrm{boundary}
    - \psi_\mathrm{axis})$, where $\psi_\mathrm{axis}$ and $\psi_\mathrm{boundary}$
    are the magnetic-axis and boundary fluxes; this removes the gage ambiguity inherent
    in the dimensional value.


    Typical magnitudes scale with device size, plasma current, toroidal field, and
    the gage chosen for $\psi$, so absolute values are reported as flux differences
    from the magnetic axis. Monotonic-shear equilibria place the minimum at or near
    the magnetic axis, while reversed-shear configurations move it to mid-radius or
    farther out.


    Sign convention: Positive when the poloidal magnetic flux through the enclosed
    horizontal disk centered on the toroidal symmetry axis is oriented along $+\hat{Z}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$ is vertical height.'
  unit: Wb
  physics_domain: equilibrium
  links: []
- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the plasma boundary is the value of the axisymmetric
    equilibrium flux function on the last closed flux surface. It is paired with the
    magnetic-axis flux to define normalized poloidal-flux coordinates.
  documentation: 'Poloidal magnetic flux at the plasma boundary, denoted $\psi_b$,
    is the value of the equilibrium poloidal-flux function on the last closed flux
    surface (LCFS), the outermost closed magnetic surface enclosing confined plasma.
    In diverted configurations the LCFS passes through an X-point; in limited configurations
    it contacts the limiter. This boundary value is the outer endpoint paired with
    [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    for flux-coordinate normalization.


    For an axisymmetric equilibrium, the poloidal magnetic flux at a boundary point
    can be written as the flux of the vertical magnetic-field component through a
    horizontal disk centered on the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ system:


    $$

    \psi_b = \int_0^{R_b} B_Z(R'', Z_b)\,2\pi R''\,dR''

    $$


    where $B_Z$ is the vertical magnetic-field component in tesla, $R_b$ and $Z_b$
    are the coordinates of a point on the LCFS, and $R''$ is the integration radius.
    In an exact axisymmetric equilibrium, $\psi$ is constant on the LCFS, so any point
    on that surface gives the same boundary value; the resulting $\psi_b$ is in webers.


    This quantity is obtained from equilibrium reconstruction by determining the poloidal-flux
    function and locating its outermost closed contour. Together with the axis value
    $\psi_0$, it defines the [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)
    through the endpoint relation $\psi_N=(\psi-\psi_0)/(\psi_b-\psi_0)$, so that
    the magnetic axis maps to 0 and the plasma boundary maps to 1.


    Typical absolute magnitudes are 0.1-5 Wb in small to medium tokamaks and several
    to tens of Wb in large, high-current devices, depending mainly on plasma current,
    toroidal magnetic field, and plasma size.


    Sign convention: Positive when $B_Z$ on the horizontal integration disk is directed
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: Wb
  physics_domain: equilibrium
  links: []
- name: poloidal_magnetic_flux_at_secondary_separatrix
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the secondary separatrix is the value of
    the equilibrium poloidal flux function on the flux surface that passes through
    the secondary X-point. It distinguishes the secondary separatrix from the primary
    separatrix in double-null, near-double-null, or snowflake magnetic topologies.
  documentation: 'Poloidal magnetic flux at the secondary separatrix, denoted $\psi_\mathrm{sec}$,
    is the value of the equilibrium poloidal flux function on the flux surface passing
    through the secondary X-point. The secondary X-point is a saddle of $\psi$ distinct
    from the primary X-point. Flux differences relative to the magnetic axis, plasma
    boundary, or primary separatrix carry the physical information because the absolute
    value of $\psi$ includes an arbitrary additive reference.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    in meters, $\phi$ is toroidal angle in radians, and $Z$ is vertical height in
    meters, radial differences of the flux function at fixed $Z$ are determined by
    the vertical magnetic field:


    $$

    \psi(R_2,Z)-\psi(R_1,Z) = \int_{R_1}^{R_2} B_Z(R'',Z)\,2\pi R''\,dR''

    $$


    where $\psi$ is in Wb, $R_1$, $R_2$, and $R''$ are major radii in meters, and
    $B_Z$ is the vertical magnetic-field component in tesla. This relation fixes flux
    differences; an additive reference such as the [magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis)
    is chosen separately.


    In practice, $\psi_\mathrm{sec}$ is obtained from an equilibrium reconstruction
    or magnetohydrodynamic equilibrium calculation by locating X-points as saddle
    points of $\psi$ in the poloidal $(R,Z)$ plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame. After the primary X-point and associated [plasma-boundary
    flux](name:poloidal_magnetic_flux_at_plasma_boundary) are identified, the distinct
    secondary saddle gives the secondary separatrix value. In an exactly balanced
    double-null configuration, the primary and secondary separatrix flux values coincide;
    otherwise their difference is the flux width of the inter-separatrix region. The
    related [normalized boundary flux label](name:normalized_poloidal_magnetic_flux_at_plasma_boundary)
    is formed from the magnetic-axis and boundary flux values, and the secondary separatrix
    can be compared using the same normalization.


    Typical reported values are strongly affected by device size and by the chosen
    additive reference. With the magnetic-axis value used as the zero reference, separatrix
    flux values are commonly of the order of the axis-to-boundary flux span, about
    0.1-100 Wb across tokamak-scale equilibria; the primary-secondary separation in
    near-balanced configurations is usually much smaller than that span.


    Sign convention: Positive when the vertical magnetic field contributing to a positive
    radial flux increment is directed along $+\hat{Z}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:poloidal_magnetic_flux_at_magnetic_axis
- name: poloidal_magnetic_flux_at_sensor_attachment_point
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at the physical attachment point of
    a flux-loop sensor. It is the local value of the equilibrium flux function at
    that position, using the same additive reference offset as the global poloidal-flux
    definition.
  documentation: 'Poloidal magnetic flux at a sensor attachment point is the value
    of the equilibrium [poloidal_magnetic_flux](name:poloidal_magnetic_flux) function
    at the physical point where a flux-loop conductor is fixed to the vessel or support
    structure. For axisymmetric interpretation, the flux function is independent of
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, so the
    point value is determined by major radius and vertical height. The absolute value
    is meaningful only with the same additive reference offset as the equilibrium
    flux function; flux differences relative to the magnetic axis or another reference
    surface are independent of that offset.


    The point value is the evaluation of the flux function at the sensor attachment
    coordinates:


    $$

    \psi_\mathrm{sensor} = \psi(R_s, Z_s)

    $$


    where $\psi_\mathrm{sensor}$ is the sensor-attachment-point poloidal magnetic
    flux in Wb, $\psi(R,Z)$ is the equilibrium poloidal magnetic flux in Wb, $R_s$
    is the attachment-point major radius in m, and $Z_s$ is the attachment-point vertical
    height in m, all in the right-handed cylindrical $(R,\phi,Z)$ frame.


    Flux loops measure the voltage induced by a changing magnetic flux; time integration
    with calibration gives a flux signal that can be compared with the local equilibrium
    value at the attachment point. This localized interpretation assumes that the
    loop geometry and the axisymmetric equilibrium allow the measured signal to be
    represented by a point evaluation; the corresponding whole-loop observable is
    described by [poloidal_magnetic_flux_of_flux_loop](name:poloidal_magnetic_flux).
    When the attachment point is associated with a reconstructed flux contour, the
    value can also be related to [poloidal_magnetic_flux_at_flux_surface](name:poloidal_magnetic_flux_at_flux_surface).


    Typical absolute values depend strongly on device size, plasma current, toroidal
    field, sensor location, and the chosen reference offset. Flux differences relevant
    to vessel-mounted loops are commonly 0.01-5 Wb in small and medium devices and
    1-50 Wb in large tokamaks.


    Sign convention: Positive when $\psi$ increases outward from the magnetic axis.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_flux_surface
- name: product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  kind: scalar
  status: draft
  description: "Product F dF/dpsi of the poloidal current function F = R B_phi, with\
    \ R and B_phi defined in the right-handed cylindrical (R, \u03C6, Z) frame, and\
    \ its derivative with respect to poloidal magnetic flux psi. It is the toroidal-field-gradient\
    \ contribution to the flux-function source in the Grad-Shafranov equation."
  documentation: 'This quantity is $F\,dF/d\psi$, the product of the poloidal current
    function and its derivative with respect to the poloidal magnetic flux $\psi$.
    In an axisymmetric equilibrium, $F=R B_\phi$ is a flux-surface function representing
    the toroidal magnetic-field contribution in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The product measures how the toroidal-field contribution changes
    between magnetic flux surfaces.


    The defining relation is


    $$

    Q_F(\psi) = F(\psi)\frac{dF}{d\psi}

    $$


    where $Q_F$ denotes this quantity, $F=R B_\phi$ has units $\mathrm{m\,T}$, $R$
    is major radius in $\mathrm{m}$, $B_\phi$ is the toroidal magnetic-field component
    in $\mathrm{T}$, $\psi$ is poloidal magnetic flux in $\mathrm{Wb}$, $dF/d\psi$
    has units $\mathrm{m\,T\,Wb^{-1}}$, and $Q_F$ has units $\mathrm{m^2\,T^2\,Wb^{-1}}$.
    Equivalently, $Q_F=(1/2)d(F^2)/d\psi$.


    In the SI Grad-Shafranov force-balance equation, $F\,dF/d\psi$ appears alongside
    the pressure-gradient contribution $\mu_0 R^2 dp/d\psi$ in $\Delta^*\psi = -\mu_0
    R^2 dp/d\psi - F\,dF/d\psi$, where $\mu_0$ is the vacuum permeability, $p$ is
    scalar pressure, and $\Delta^*$ is the Grad-Shafranov elliptic operator. Through
    $\mu_0 R j_\phi=-\Delta^*\psi$, these terms determine the $R$-weighted toroidal
    current density $Rj_\phi$; this magnetic term is therefore related to, but not
    identical to, the direct toroidal-current source quantity.


    In practice, this quantity is obtained by reconstructing an axisymmetric equilibrium,
    representing $F$ as a smooth function of $\psi$ on nested magnetic surfaces, and
    differentiating with respect to $\psi$. Because numerical differentiation can
    amplify noise, smoothing and consistency with the reconstructed pressure gradient
    and toroidal current density are important when interpreting it.


    Typical values are close to 0 m^2.T^2.Wb^-1 when $F$ is nearly constant across
    the confined plasma. Medium-size tokamak equilibria often have absolute values
    of 0.01-5 m^2.T^2.Wb^-1, while high-field or strong-gradient cases can reach 10-50
    m^2.T^2.Wb^-1.


    Sign convention: Positive when $F^2=(R B_\phi)^2$ increases with increasing poloidal
    magnetic flux $\psi$.'
  unit: T^2.Wb^-1.m^2
  physics_domain: equilibrium
  links: []
  arguments:
  - name: poloidal_current_function
    operator: product
    operator_kind: binary
    role: a
    separator: and
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/f_df_dpsi
    dd_path: equilibrium/time_slice/profiles_1d/f_df_dpsi
    status: composed
- name: radial_coordinate_of_active_limiter_point
  kind: scalar
  status: draft
  description: Major radius (R) coordinate of the active limiter contact point, where
    the outermost closed flux surface of a limited plasma makes tangential contact
    with the limiter surface.
  documentation: 'The active limiter point is the specific location on the limiter
    surface where the last closed flux surface of a limited plasma makes tangential
    contact with the physical wall. The radial coordinate $R_{\rm lim}$ is the perpendicular
    distance from the toroidal symmetry axis to that contact point, measured in the
    right-handed cylindrical $(R, \phi, Z)$ frame where $R$ increases outward from
    the symmetry axis.


    In limited plasma configurations, this coordinate defines the radial extent of
    the confined plasma region and serves as a primary geometric constraint in equilibrium
    reconstruction. Reconstruction procedures reconcile external magnetic measurements
    with the known limiter geometry to identify the tangency point of the last closed
    flux surface on the limiter.


    Typical values range from 0.5 m to 8 m across current and planned tokamak devices,
    spanning the full scale from small research machines to ITER-class reactors. The
    [radial_coordinate_of_closest_wall_point](name:radial_coordinate_of_closest_wall_point)
    gives the major radius of the nearest wall location for gap calculations, while
    [gap_at_plasma_boundary](name:gap_at_plasma_boundary) expresses the signed separation
    between the plasma boundary and the wall at prescribed reference points.


    Sign convention: Positive when $R_{\rm lim}$ is measured radially outward from
    the toroidal symmetry axis in the $+\hat{R}$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_closest_wall_point
  - name:gap_at_plasma_boundary
- name: radial_coordinate_of_closest_wall_point
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the first-wall point closest to the plasma\
    \ boundary or separatrix in a poloidal cross-section, measured in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The radial coordinate of the closest wall point is the major radius
    $R$ of the first-wall point nearest to the reconstructed plasma boundary or separatrix
    in a poloidal cross-section. The coordinate is measured in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is distance from the toroidal symmetry axis and
    $Z$ is vertical height.


    For a first-wall contour $W$ and a plasma boundary or separatrix contour $B$ in
    the poloidal $(R,Z)$ plane of the right-handed cylindrical $(R, \phi, Z)$ frame,
    the closest-wall radial coordinate is the $R$ coordinate of a wall point minimizing
    the distance to $B$:


    $$

    R_{\mathrm{cw}} = R_w \quad \text{for} \quad (R_w,Z_w) \in \operatorname*{arg\,min}_{(R,Z)\in
    W}\,\min_{(R_b,Z_b)\in B}\sqrt{(R-R_b)^2+(Z-Z_b)^2}

    $$


    where $(R_w,Z_w)$ is the closest wall point and $(R_b,Z_b)$ runs over points on
    the plasma boundary or separatrix. If several wall points have the same minimum
    distance, the geometry alone defines a unique value only when those points share
    the same $R$; otherwise the chosen representative requires an additional selection
    convention.


    In equilibrium analysis this quantity is computed from the reconstructed boundary
    or separatrix and the first-wall geometry. Together with the [vertical coordinate
    of the closest wall point](name:vertical_coordinate_of_closest_wall_point), it
    locates the nearest wall position in the poloidal cross-section and is closely
    related to plasma-wall clearance quantities such as the [gap at the plasma boundary](name:gap_at_plasma_boundary).


    For a given device the physically relevant range is bounded by the first-wall
    radial extent, $R_{\min} \le R_{\mathrm{cw}} \le R_{\max}$, with $R_{\min}$ and
    $R_{\max}$ expressed in meters. The value may correspond to an inboard wall, outboard
    wall, limiter, or divertor-region surface depending on which part of the wall
    is nearest to the plasma boundary or separatrix.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_closest_wall_point
  - name:gap_at_plasma_boundary
- name: radial_coordinate_of_current_center
  kind: scalar
  status: draft
  description: Major radius (R) of the plasma current centroid, defined as the first
    moment of the toroidal current density distribution over the poloidal cross-section.
  documentation: 'The radial coordinate of the current center identifies the major
    radius at which the plasma toroidal current density is effectively concentrated,
    treating the distributed toroidal current as a weighted ensemble whose centroid
    is obtained from the first spatial moment of $j_\phi$ over the poloidal cross-section.


    The current center major radius is formally defined as:


    $$

    R_{\mathrm{cc}} = \frac{\iint j_\phi(R, Z)\, R\, dR\, dZ}{\iint j_\phi(R, Z)\,
    dR\, dZ}

    $$


    where $j_\phi$ is the toroidal component of the plasma current density and the
    integrals span the confined plasma cross-section in the right-handed cylindrical
    $(R, \phi, Z)$ frame, with $R$ the major radius measured from the toroidal symmetry
    axis.


    This global scalar is obtained from equilibrium reconstruction using external
    magnetic diagnostics, and is sensitive to the radial peaking and any off-axis
    structure of the current profile. It is conceptually distinct from the [radial
    coordinate of the magnetic axis](name:radial_coordinate_of_magnetic_axis), which
    is located at the extremum of the poloidal flux function, and from the [radial
    coordinate of the geometric axis](name:radial_coordinate_of_geometric_axis), which
    is determined purely by the plasma boundary shape. In conventional H-mode discharges
    the current center lies close to the magnetic axis, but can shift outward during
    off-axis current drive or inward during peaked current profiles.


    Sign convention: Positive when the current centroid is located at a nonzero major
    radius $R$ from the toroidal symmetry axis in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_magnetic_axis
  - name:radial_coordinate_of_geometric_axis
- name: radial_coordinate_of_dr_dz_zero_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the point on a plasma boundary or flux surface
    where dR/dZ = 0, locating the inboard or outboard midplane extremity of the contour
    in the poloidal plane.
  documentation: "The dR/dZ = 0 point marks the poloidal location on a plasma boundary\
    \ or flux-surface contour in the poloidal cross-section where the boundary tangent\
    \ is vertical \u2014 equivalently, where the major radius $R$ reaches a local\
    \ extremum as the height $Z$ varies along the contour. For a convex, simply connected\
    \ tokamak boundary, two such points exist per flux surface: the outboard (maximum\
    \ $R$) and inboard (minimum $R$) extremes, both situated near the magnetic midplane.\n\
    \nThe defining geometric condition is\n\n$$\\left.\\frac{dR}{dZ}\\right|_{\\text{contour}}\
    \ = 0$$\n\nwhere $R$ is the major radius measured from the machine symmetry axis\
    \ and $Z$ is the vertical coordinate in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, with $\\phi$ the toroidal angle.\n\nThis coordinate is obtained from\
    \ equilibrium reconstruction by numerically locating the $R$ extremum on the reconstructed\
    \ last-closed flux surface or separatrix contour. It provides a compact boundary-shape\
    \ descriptor complementary to the X-point geometry described by [radial_coordinate_of_x_point](name:radial_coordinate_of_x_point),\
    \ and is geometrically paired with its vertical counterpart [vertical_coordinate_of_dr_dz_zero_point](name:vertical_coordinate_of_dr_dz_zero_point).\n\
    \nSign convention: Positive when the dR/dZ = 0 point lies at a positive major\
    \ radius measured outward from the machine symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, which is satisfied everywhere in the plasma-accessible\
    \ region where $R > 0$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_x_point
  - name:vertical_coordinate_of_dr_dz_zero_point
- name: radial_coordinate_of_geometric_axis
  kind: scalar
  status: draft
  description: Major radius coordinate of the plasma geometric axis, defined as the
    midpoint between the maximum and minimum radial extents of the last closed flux
    surface.
  documentation: "The geometric axis of the plasma cross-section marks the horizontal\
    \ center of the outermost closed flux surface boundary, providing a fundamental\
    \ reference for characterizing plasma shape and radial position. It is distinct\
    \ from the [magnetic axis](name:radial_coordinate_of_magnetic_axis), which is\
    \ the point of extremal poloidal magnetic flux; the separation between the two\
    \ radial positions quantifies the Shafranov shift, an inward displacement of the\
    \ flux surfaces toward the high-field side driven by finite plasma pressure and\
    \ toroidal current.\n\nThe radial coordinate of the geometric axis is defined\
    \ using the plasma boundary extrema:\n\n$$\nR_{\\rm geom} = \\frac{R_{\\rm max}\
    \ + R_{\\rm min}}{2}\n$$\n\nwhere $R_{\\rm max}$ and $R_{\\rm min}$ are the outermost\
    \ and innermost major radii of the plasma boundary in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, with $R$ measured from the toroidal symmetry axis.\n\n\
    This coordinate is obtained from equilibrium reconstruction by tracing the plasma\
    \ boundary contour or separatrix. Typical values range from 1.5\u20133.5 m for\
    \ medium-sized tokamaks and approach 6 m for large devices.\n\nSign convention:\
    \ Positive when $R_{\\rm geom}$ is measured outward from the toroidal symmetry\
    \ axis in the right-handed cylindrical $(R, \\phi, Z)$ frame; major radius coordinates\
    \ are non-negative for any physical plasma location."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_magnetic_axis
- name: radial_coordinate_of_magnetic_axis
  kind: scalar
  status: draft
  description: Major radius R of the magnetic axis, the singular point in the poloidal
    cross-section where the poloidal magnetic field vanishes and all nested magnetic
    flux surfaces converge.
  documentation: "The magnetic axis is the topological center of the nested magnetic\
    \ flux surfaces in the plasma \u2014 the unique locus in the poloidal cross-section\
    \ where the poloidal magnetic field $B_p = 0$ and the poloidal magnetic flux $\\\
    psi$ attains its on-axis extremum. The radial coordinate $R_\\mathrm{axis}$ locates\
    \ this axis along the major-radial direction of the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is the perpendicular distance from the toroidal\
    \ symmetry axis.\n\nThis coordinate enters the definition of the plasma minor\
    \ radius $a$ and the inverse aspect ratio $\\epsilon = a / R_\\mathrm{axis}$,\
    \ where $a$ is the plasma half-width. It differs from the [geometric axis major\
    \ radius](name:radial_coordinate_of_geometric_axis) $R_\\mathrm{geom} = (R_\\\
    mathrm{max} + R_\\mathrm{min})/2$; the outward displacement $R_\\mathrm{axis}\
    \ - R_\\mathrm{geom}$ is the Shafranov shift, which is positive under finite plasma\
    \ pressure. The [radial coordinate of the X-point](name:radial_coordinate_of_x_point)\
    \ is a related equilibrium position marker defined at the poloidal-field null\
    \ on the separatrix rather than at the flux-surface center.\n\nThe magnetic axis\
    \ position is determined from equilibrium reconstruction, combining external magnetic\
    \ measurements with pressure and current profile information. Typical values range\
    \ from about 0.6 m in small tokamaks to approximately 1.65 m in JET-scale devices.\n\
    \nSign convention: Positive when $R_\\mathrm{axis}$ is measured outward from the\
    \ toroidal symmetry axis in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ as holds for all physical plasma configurations."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_geometric_axis
  - name:radial_coordinate_of_x_point
- name: radial_coordinate_of_measurement_position
  kind: scalar
  status: draft
  description: "Major-radius coordinate of a measurement position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, equal to its perpendicular distance from the\
    \ toroidal symmetry axis."
  documentation: 'The radial coordinate of a measurement position is the major radius
    $R$ locating that point in the right-handed cylindrical $(R, \phi, Z)$ frame.
    Here $R$ is the perpendicular distance from the toroidal symmetry axis in meters,
    $\phi$ is the toroidal angle, and $Z$ is vertical height.


    For a point described by horizontal Cartesian coordinates $x$ and $y$ in a right-handed
    Cartesian $(x, y, z)$ frame with $z$ vertical and the origin on the toroidal symmetry
    axis, the corresponding major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$, $x$, and $y$ are measured in meters.


    In practice, this coordinate is obtained from the surveyed, designed, or reconstructed
    position of the measurement point by projecting the point onto the horizontal
    plane and measuring its distance from the toroidal symmetry axis. It is independent
    of the toroidal angle and does not specify the vertical location of the same point.


    Values are non-negative and are bounded by the radial extent of the relevant device
    geometry or modeled measurement region. There is no universal device-independent
    numerical range; the coordinate should be interpreted in meters relative to the
    same toroidal symmetry axis used for the associated position coordinates.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_constraint_position
  - name:radial_coordinate_of_aperture
  - name:radial_coordinate_of_active_limiter_point
- name: radial_coordinate_of_strike_point
  kind: scalar
  status: draft
  description: Major radius R of a magnetic strike point, where the plasma separatrix
    intersects a divertor target or first-wall surface in the poloidal cross-section.
  documentation: "A strike point is the location in the poloidal cross-section where\
    \ the plasma separatrix \u2014 or, in double-null and snowflake configurations,\
    \ the secondary separatrix \u2014 contacts a material target surface such as a\
    \ divertor tile or limiter wall. Its major-radius coordinate $R$ is measured perpendicularly\
    \ from the toroidal symmetry axis in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R > 0$ by construction.\n\nThe radial position of the strike\
    \ point governs the spatial distribution of the parallel heat flux deposited on\
    \ the divertor target and is central to power exhaust management. The separatrix\
    \ is the flux surface threading the magnetic X-point; the strike point is where\
    \ this surface meets the first-wall geometry. For reference, the [radial_coordinate_of_x_point](name:radial_coordinate_of_x_point)\
    \ locates the null of the poloidal field from which the separatrix originates,\
    \ while the [radial_coordinate_of_magnetic_axis](name:radial_coordinate_of_magnetic_axis)\
    \ marks the innermost reference. In double-null configurations, primary and secondary\
    \ separatrices produce distinct inner and outer strike points whose $R$ coordinates\
    \ differ and whose relative positions affect the heat-load sharing between divertor\
    \ legs.\n\nThe strike-point radial coordinate is inferred during equilibrium reconstruction,\
    \ with constraints supplied by Langmuir probe signals, infrared thermography of\
    \ divertor tiles, or other plasma-facing-component diagnostics that detect the\
    \ plasma-wall contact location. It also serves as a real-time position-control\
    \ target during divertor operation.\n\nTypical major-radius values range from\
    \ approximately 1.0\u20131.5 m on the inner divertor to 1.8\u20132.5 m on the\
    \ outer divertor in medium-sized tokamaks.\n\nSign convention: Positive when $R$\
    \ is directed outward from the toroidal symmetry axis, consistent with all major-radius\
    \ coordinates in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_x_point
  - name:radial_coordinate_of_magnetic_axis
- name: radial_coordinate_of_x_point
  kind: scalar
  status: draft
  description: Major radius R coordinate of the magnetic X-point, the null of the
    poloidal magnetic field at which the separatrix forms and the confined plasma
    meets the scrape-off layer.
  documentation: 'The X-point is the location in the poloidal $(R, Z)$ plane where
    the poloidal magnetic field vanishes, creating the degenerate separatrix topology
    that separates the closed-field-line confined plasma region from the open-field-line
    scrape-off layer. Its radial coordinate $R_X$ is the major-radius distance from
    the toroidal symmetry axis to this null, measured in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $R$ is the horizontal distance from the machine symmetry
    axis.


    The null condition defining the X-point is:


    $$

    \left.\nabla\psi\right|_{(R_X,\, Z_X)} = 0

    $$


    where $\psi(R, Z)$ is the poloidal magnetic flux function and $Z_X$ is the companion
    vertical X-point coordinate.


    The X-point location is inferred from equilibrium reconstruction constrained by
    external magnetic diagnostics including flux loops, Rogowski coils, and magnetic
    pickup probes. The X-point radial position is displaced from the [radial coordinate
    of the magnetic axis](name:radial_coordinate_of_magnetic_axis) by an amount that
    reflects the poloidal asymmetry of the diverted plasma configuration; in single-null
    geometries, $R_X$ shifts inboard or outboard depending on the divertor target
    orientation and plasma shaping. The [current center radial coordinate](name:radial_coordinate_of_current_center)
    provides a complementary moment-based measure of the current distribution centroid,
    distinct from the X-point null.


    Sign convention: Positive when the X-point lies outward from the toroidal symmetry
    axis in the direction of increasing major radius $R$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_magnetic_axis
  - name:radial_coordinate_of_current_center
- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: "Projection of the magnetic field vector onto the outward major-radius\
    \ direction in the right-handed cylindrical (R, \u03C6, Z) frame, forming the\
    \ radial part of the poloidal field in tokamak geometry."
  documentation: "The radial magnetic field $B_R = \\mathbf{B} \\cdot \\hat{R}$ is\
    \ the component of the magnetic induction resolved along $\\hat{R}$, the unit\
    \ vector pointing away from the toroidal symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. In an axisymmetric tokamak equilibrium, $B_R$ is entirely\
    \ a poloidal-field quantity and is generally much smaller in magnitude than the\
    \ dominant toroidal component; it encodes information about flux-surface shape\
    \ and poloidal field structure.\n\nIn axisymmetric equilibrium, $B_R$ is related\
    \ to the poloidal magnetic flux function $\\psi(R, Z)$ by:\n\n$$\nB_R = -\\frac{1}{R}\\\
    frac{\\partial \\psi}{\\partial Z}\n$$\n\nwhere $R$ is the major radius in meters\
    \ and $Z$ is the vertical coordinate in meters. Together with $B_Z = \\frac{1}{R}\\\
    partial\\psi/\\partial R$, this satisfies the solenoidal constraint $\\nabla \\\
    cdot \\mathbf{B} = 0$ in axisymmetric form. The companion [parallel_magnetic_field](name:parallel_magnetic_field)\
    \ gives the field-aligned projection, while [radial_magnetic_vector_potential](name:radial_magnetic_vector_potential)\
    \ provides the corresponding vector-potential component in the same radial direction.\n\
    \n$B_R$ is obtained by differentiating the reconstructed poloidal flux on a computational\
    \ grid, or evaluated directly on generalized geometry description grids for complex\
    \ wall and boundary regions. Magnitudes in the core plasma are typically 0.001\u2013\
    0.1 T, increasing near the X-point and divertor where the poloidal field changes\
    \ direction rapidly.\n\nSign convention: Positive when $B_R$ points in the direction\
    \ of increasing major radius $R$, away from the toroidal symmetry axis."
  unit: T
  physics_domain: equilibrium
  links:
  - name:parallel_magnetic_field
  - name:radial_magnetic_vector_potential
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/b_field/radial
    dd_path: plasma_profiles/ggd/b_field/radial
    status: composed
- name: radial_magnetization_of_iron_core_segment
  kind: scalar
  status: draft
  description: "Radial component, in the right-handed cylindrical (R, \u03C6, Z) frame,\
    \ of the magnetic-flux-density-equivalent magnetization of an iron core segment.\
    \ It equals the permeability of free space times the textbook radial magnetization\
    \ component, so it is expressed in tesla rather than amperes per meter."
  documentation: 'Radial magnetization of an iron core segment is the radial component
    of the segment magnetization vector in the right-handed cylindrical $(R, \phi,
    Z)$ system, where $R$ is the major radius measured from the toroidal symmetry
    axis and $Z$ is vertical height. The documented quantity is the magnetic-flux-density-equivalent
    component, equal to the permeability of free space times the textbook magnetization
    component, so it is expressed in tesla rather than amperes per meter.


    The conversion from the textbook material magnetization to this iron-core quantity
    is


    $$

    M_R = \mu_0\,\mathbf{M}\cdot\hat{R}

    $$


    where $\mathbf{M}$ is the material magnetization vector in A/m, $\hat{R}$ is the
    outward radial unit vector of the right-handed cylindrical $(R, \phi, Z)$ system,
    and $\mu_0 = 4\pi \times 10^{-7}$ T m/A is the permeability of free space.


    In equilibrium analysis, this quantity is inferred from magnetic measurements
    together with a ferromagnetic model of the iron core. The segment model treats
    the magnetization as uniform within each iron segment, while the fitted value
    can depend on nonlinear permeability, hysteresis, remanent magnetization, demagnetization
    effects, and the approach to magnetic saturation.


    Typical values range from near 0 T in weakly magnetized or demagnetized regions
    to about 1.5-2.2 T in magnitude near saturation in soft iron. The radial component
    may be much smaller than the total magnetization if the material is magnetized
    mainly in another direction.


    Sign convention: Positive when the magnetization vector has a component in the
    $+\hat{R}$ direction, outward from the toroidal symmetry axis, in the right-handed
    cylindrical $(R, \phi, Z)$ system.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vertical_magnetization_of_iron_core_segment
- name: radial_non_axisymmetric_magnetic_field
  kind: scalar
  status: draft
  description: "Radial (R) component of the non-axisymmetric vacuum magnetic field\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, representing toroidally\
    \ non-uniform perturbations from error fields, resonant magnetic perturbations,\
    \ and finite coil effects."
  documentation: 'The radial non-axisymmetric magnetic field $B_R^{\rm na}$ is the
    $\hat{R}$-projection of the vacuum magnetic-field perturbation that breaks toroidal
    symmetry, in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is the
    major radius measured from the machine symmetry axis and $Z$ is the vertical height.
    Physical sources include geometric imperfections in coil placement (error fields),
    current-lead feeds, and deliberately applied non-axisymmetric coil currents such
    as resonant magnetic perturbations (RMPs) used for ELM suppression and error-field
    correction.


    The field is defined by subtracting the toroidally averaged axisymmetric radial
    component from the full three-dimensional vacuum radial field:


    $$

    B_R^{\rm na}(R, \phi, Z) = B_R(R, \phi, Z) - \langle B_R \rangle_\phi(R, Z)

    $$


    where $\langle B_R \rangle_\phi$ denotes the average over toroidal angle $\phi$
    at fixed $(R, Z)$.


    This component is computed from three-dimensional vacuum field calculations using
    Biot-Savart integration over all non-axisymmetric coil elements, and evaluated
    on spatial field maps or at control surface points for error-field identification
    and feedback-correction algorithms. Together with [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field)
    and [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field),
    it provides the complete cylindrical decomposition of the non-axisymmetric vacuum
    field; non_axisymmetric_magnetic_field_at_control_surface gives the corresponding
    surface-normal projection. Typical perturbation amplitudes for RMP and error-field
    applications range from $10^{-5}$ to $10^{-2}$ T in medium- to large-scale tokamaks.


    Sign convention: Positive when $B_R$ points in the direction of increasing major
    radius $R$, away from the machine symmetry axis.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vertical_non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Curvature radius of an arc-of-circle segment used to represent the
    cross-sectional contour of a plasma current filament; it is the non-negative radius
    of the circle from which the arc is drawn.
  documentation: 'Radius of a plasma filament segment is the curvature radius of one
    circular arc in an idealized cross-sectional contour of a current-carrying plasma
    filament. It is the non-negative distance from every point on that arc to its
    center of curvature; smaller values correspond to sharper boundary bending, while
    a straight segment is the limiting case of infinite radius.


    For a circular segment, the arc length is related to the curvature radius by:


    $$

    \ell = R_c |\Delta\alpha|

    $$


    where $\ell$ is the arc length in meters, $R_c$ is the curvature radius in meters,
    and $\Delta\alpha$ is the signed central angle subtended by the arc in radians,
    treated as dimensionless in the product.


    This quantity is usually specified or fitted as part of a piecewise geometric
    approximation to a filament cross-section for equilibrium and electromagnetic
    calculations, rather than measured directly by a diagnostic. Together with width_of_plasma_filament,
    [height_of_plasma_filament](name:height_of_plasma_filament), and the general radius,
    it helps define the idealized filament geometry; it is conceptually analogous
    to [radius_of_iron_core_segment](name:radius_of_iron_core_segment) and [radius_of_poloidal_field_coil](name:radius_of_poloidal_field_coil)
    for other piecewise circular contours.


    Finite curved segments require $R_c > 0$ and normally have values comparable to,
    or larger than, the local contour scale. Typical practical values range from 0.001-1
    m, with millimeter-to-centimeter radii representing rounded corners in compact
    filament models and decimeter-to-meter radii representing gently curved, large-scale
    contours.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:height_of_plasma_filament
  - name:radius_of_iron_core_segment
  - name:radius_of_poloidal_field_coil
- name: inner_radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a plasma current-carrying
    filament element, marking the boundary between the hollow central region and the
    conducting annular zone.
  documentation: 'The inner radius $r_\mathrm{inner}$ specifies the radial position
    of the inner wall of an annular plasma filament cross-section, defining the boundary
    between the hollow (non-current-carrying) core and the conducting annular region.
    In filamentary models of distributed plasma current, individual elements may be
    assigned annular geometries bounded at the outer wall by [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)
    $r_\mathrm{outer}$, with current flowing only in the region $r_\mathrm{inner}
    \leq r \leq r_\mathrm{outer}$.


    The conducting cross-sectional area of the annular element is:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $A$ is the geometric cross-sectional area corresponding to area_of_plasma_filament.
    A valid annular geometry requires $0 \leq r_\mathrm{inner} < r_\mathrm{outer}$;
    setting $r_\mathrm{inner} = 0$ recovers a solid circular cross-section with no
    hollow core.


    This parameter is a geometric input to the filamentary discretization of the plasma
    current distribution and is always specified alongside [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament).
    For rectangular filament cross-sections the analogous spatial parameters are [height_of_plasma_filament](name:height_of_plasma_filament)
    and width_of_plasma_filament.


    Sign convention: Positive when the inner boundary of the annular cross-section
    is measured outward from the local geometric center of the filament element.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_radius_of_plasma_filament
  - name:height_of_plasma_filament
  arguments:
  - name: radius_of_plasma_filament
    operator: inner
    operator_kind: qualifier
- name: outer_radius_of_plasma_filament
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a discrete plasma current-carrying
    filament element, marking the external radial boundary of the hollow-disk geometry.
  documentation: 'The outer radius defines the external boundary of an annular cross-section
    when a plasma current filament element is represented as a hollow cylinder. Together
    with [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),
    it fully characterizes the annular geometry, which contrasts with the rectangular
    cross-section model parametrized by [height_of_plasma_filament](name:height_of_plasma_filament)
    and width_of_plasma_filament.


    For an annular cross-section, the cross-sectional area relates to both radii by:


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $r_\mathrm{outer}$ is this outer radius, $r_\mathrm{inner}$ is the inner
    radius, and $A$ is the area_of_plasma_filament.


    The outer radius is specified as input geometry when constructing discrete filamentary
    representations of plasma current distributions used in equilibrium reconstruction
    and mutual-inductance computations. The constraint $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$ must be satisfied to define a valid non-degenerate annular region.


    Sign convention: Positive when measured as a radial distance from the cross-section
    center to the outer boundary, satisfying $r_\mathrm{outer} > r_\mathrm{inner}
    \geq 0$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:inner_radius_of_plasma_filament
  - name:height_of_plasma_filament
  arguments:
  - name: radius_of_plasma_filament
    operator: outer
    operator_kind: qualifier
- name: reference_major_radius
  kind: scalar
  status: draft
  description: "Fixed major-radius coordinate in the right-handed cylindrical (R,\
    \ \u03C6, Z) system at which the vacuum toroidal magnetic field is specified.\
    \ It is a non-negative geometric radius; the sign of the toroidal field is carried\
    \ by the associated field value, not by the radius."
  documentation: 'Reference major radius $R_0$ is the major-radius coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ system at which the [toroidal vacuum magnetic
    field](name:toroidal_vacuum_magnetic_field) value $B_0$ is defined. It is a geometric
    distance from the toroidal symmetry axis and is therefore non-negative; it does
    not carry the sign of the magnetic field.


    For an axisymmetric vacuum toroidal field in a current-free region, the toroidal
    field scales inversely with major radius:


    $$

    B_\phi^\mathrm{vac}(R) = B_0\,\frac{R_0}{R}

    $$


    where $B_\phi^\mathrm{vac}(R)$ is the toroidal vacuum magnetic-field component
    in tesla at major radius $R$ in meters, $B_0$ is the signed toroidal vacuum magnetic
    field in tesla at $R_0$, and $R_0$ is the reference major radius in meters. The
    factor $R_0/R$ is positive; the field direction is determined by the sign of $B_0$.


    In practice, $R_0$ is specified from the device geometry or equilibrium reference
    setup rather than measured by an independent diagnostic. It identifies where $B_0$
    is quoted, and quantities that use the same vacuum-field reference, including
    flux-radius definitions such as [toroidal flux radius of the magnetic axis](name:toroidal_flux_radius_of_magnetic_axis),
    should use a consistent $B_0$ and $R_0$ pair.


    Representative tokamak values are about 0.3-7 m, ranging from compact or spherical
    devices to large conventional devices; the appropriate value is facility and configuration
    dependent.'
  unit: m
  physics_domain: equilibrium
  links: []
  arguments:
  - name: major_radius
    operator: reference
    operator_kind: qualifier
- name: rotational_transform
  kind: scalar
  status: draft
  description: Rotational transform is the average poloidal winding of a magnetic
    field line for each toroidal circuit on a magnetic flux surface. It is dimensionless
    and equals the inverse of the safety factor.
  documentation: 'Rotational transform $\iota$ characterizes the helical pitch of
    magnetic field lines on a magnetic flux surface. It gives the average number of
    poloidal turns made by a field line during one toroidal turn and is related to
    the [safety factor](name:safety_factor) by $\iota = 1/q$.


    In straight-field-line flux coordinates $(\psi, \theta, \phi)$, where $\psi$ labels
    the flux surface, $\theta$ is a poloidal angle, and $\phi$ is the toroidal angle
    of the right-handed cylindrical $(R, \phi, Z)$ frame with $R$ the major radius
    and $Z$ the vertical height, the field-line equation is:


    $$

    \frac{d\theta}{d\phi} = \iota(\psi)

    $$


    where $d\theta/d\phi$ is evaluated along a magnetic field line on the flux surface
    labeled by $\psi$. Rational values such as $\iota = m/n$ mark surfaces where a
    field line closes after $n$ toroidal circuits and $m$ poloidal circuits, making
    them important for resonant magnetic perturbations and island formation.


    In tokamak equilibria, rotational transform is obtained from magnetic equilibrium
    reconstruction using external magnetic measurements and, when available, internal
    constraints on magnetic pitch. In stellarators and other three-dimensional configurations,
    it is commonly computed from equilibrium calculations or magnetic field-line tracing.


    Typical magnitudes in tokamak plasmas range from about 0.2-1, with edge values
    near $\iota = 0.2$-$0.33$ corresponding to $q = 3$-$5$. Stellarator configurations
    commonly use values around 0.3-1.5, depending on magnetic geometry and the intended
    avoidance or placement of low-order rational surfaces.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
- name: squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient for nested magnetic flux surfaces,
    measuring corner deviation from a reference ellipse; positive values indicate
    a boxy super-elliptical shape and negative values a concave diamond-like shape.
  documentation: 'The squareness of a flux surface is a dimensionless geometric shape
    parameter, following Luce (Plasma Phys. Control. Fusion 55, 095009, 2013), that
    characterizes the corner geometry of nested poloidal cross-sections. The coefficient
    $\zeta$ quantifies the deviation of each quadrant of the flux-surface contour
    from a co-centered reference ellipse: $\zeta > 0$ corresponds to a super-elliptical
    (boxy) corner that bulges outward relative to the reference ellipse, while $\zeta
    < 0$ characterizes a sub-elliptical (diamond-like or concave) corner.


    Resolved by machine side, this general quantity separates into [inner_squareness_of_flux_surface](name:inner_squareness_of_flux_surface),
    capturing the high-field-side (inboard) corners, and [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface),
    capturing the low-field-side (outboard) corners. A finer decomposition into four
    independent quadrant coefficients is available through dedicated names such as
    [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)
    and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface).


    Squareness profiles are determined from equilibrium reconstruction by fitting
    a parameterized boundary shape to magnetic diagnostic measurements. Typical magnitudes
    range from approximately $-0.5$ to $+0.5$ in tokamak operation; the sign and spatial
    distribution of corner squareness influence edge stability margins and divertor
    geometry. The quantity complements [elongation_of_flux_surface](name:elongation_of_flux_surface)
    and the general coefficient_of_flux_surface in the complete parameterization of
    nested flux-surface geometry.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_flux_surface
  - name:outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  - name:elongation_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_upper_outer
    dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_outer
    status: composed
  - id: derived:squareness_of_flux_surface
    status: composed
- name: inner_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient quantifying how much the high-field-side
    (inner) corners of a nested magnetic flux surface deviate from a reference ellipse;
    positive values indicate a boxier corner, negative values a more diamond-like
    or indented corner.
  documentation: 'The inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how much the high-field-side (inboard,
    smaller major radius) corners of a nested toroidal magnetic flux surface depart
    from a reference ellipse sharing the same center, horizontal half-width, and [elongation](name:elongation_of_flux_surface).
    It is the inboard counterpart within the [squareness_of_flux_surface](name:squareness_of_flux_surface)
    family, complementing the outboard variants [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)
    and [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface).
    This parent quantity abstracts over the quadrant-resolved coefficients [upper_inner_squareness_of_flux_surface](name:upper_inner_squareness_of_flux_surface)
    and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),
    which independently describe the upper and lower high-field-side corners.


    The coefficient $\zeta$ enters the parametric flux-surface shape model as an additional
    harmonic beyond elongation $\kappa$ and triangularity $\delta$, evaluated at the
    high-field-side corners of the poloidal cross-section in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. A
    value of zero recovers the reference ellipse precisely; deviations capture corner
    shaping not expressible through $\kappa$ and $\delta$ alone.


    The inner squareness is inferred from equilibrium reconstruction by fitting closed
    flux-surface contours to a multi-parameter shape model. Asymmetry between upper
    and lower inner quadrants can arise in vertically asymmetric or diverted configurations,
    motivating the quadrant-resolved child quantities.


    Sign convention: Positive when the high-field-side corner of the flux-surface
    cross-section extends outward beyond the reference ellipse (boxy shape); negative
    when the corner is indented inward relative to the reference ellipse (diamond-like
    shape).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  arguments:
  - name: squareness_of_flux_surface
    operator: inner
    operator_kind: qualifier
- name: lower_inner_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient zeta_li for the lower high-field-side
    quadrant of a nested magnetic flux surface, relative to a reference ellipse with
    the same center, horizontal half-width, and elongation. It quantifies the quadrant's
    non-elliptical flattening, boxiness, or indentation.
  documentation: 'Lower inner squareness of a flux surface is the dimensionless Luce
    coefficient $\zeta_\mathrm{li}$ for the quadrant that is both on the high-field
    side and below the flux-surface center in the right-handed cylindrical $(R,\phi,Z)$
    frame. The qualifier lower is relative to the surface center, not to an absolute
    condition such as $Z<0$. The reference shape is an ellipse with the same center,
    horizontal half-width, and elongation as the flux surface; the coefficient measures
    the residual non-elliptical deformation of that quadrant.


    In the Luce quadrant construction, the signed departure from the reference ellipse
    may be written as


    $$

    \Delta_\perp(\theta) = a\,\zeta_\mathrm{li}\,\sin^2(2\theta)

    $$


    where $\Delta_\perp(\theta)$ is the normal displacement from the reference ellipse
    to the flux surface in meters, positive along the outward normal of the ellipse,
    $a$ is the horizontal half-width in meters, $\zeta_\mathrm{li}$ is dimensionless,
    and $\theta$ is a dimensionless parametric segment angle in radians. For the lower-inner
    segment, $\theta$ runs from the inner midplane point to the lower vertical extremum;
    the reference ellipse has center $(R_c,Z_c)$ in meters, horizontal half-width
    $a$ in meters, and dimensionless elongation $\kappa$, and may be written on this
    segment as $R_\mathrm{ell}=R_c-a\cos\theta$ and $Z_\mathrm{ell}=Z_c-\kappa a\sin\theta$
    in the right-handed cylindrical $(R,\phi,Z)$ frame. A zero coefficient corresponds
    to an exactly elliptical lower-inner quadrant for this reference ellipse.


    The coefficient is obtained from an equilibrium reconstruction by tracing the
    selected nested flux surface, determining its center, horizontal half-width, and
    elongation, constructing the reference ellipse, and fitting the Luce form over
    only the lower-inner segment. It separates local boxiness or indentation of the
    lower high-field-side quadrant from global elongation and triangularity.


    Typical values are close to 0 for nearly elliptical core surfaces, commonly within
    -0.1 to 0.1. Strongly shaped edge or boundary surfaces often lie within -0.3 to
    0.3, with larger magnitudes indicating pronounced local squaring or indentation.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  arguments:
  - name: inner_squareness_of_flux_surface
    operator: lower
    operator_kind: qualifier
- name: outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the outboard corners
    of nested magnetic flux surfaces, measuring departure from a co-centered reference
    ellipse; abstracts over both upper-outer and lower-outer quadrants in the poloidal
    cross-section.
  documentation: "The outer squareness of a flux surface is the Luce (2013) dimensionless\
    \ shape coefficient that quantifies how much the outboard (low-field-side, larger-$R$)\
    \ corners of a poloidal cross-section deviate from a reference ellipse sharing\
    \ the same geometric center, horizontal half-width, and elongation. It is a component\
    \ of the [squareness_of_flux_surface](name:squareness_of_flux_surface) family,\
    \ restricted to the outer ($R > R_\\text{geo}$) portion of the cross-section defined\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius,\
    \ $\\phi$ is toroidal angle, and $Z$ is vertical height.\n\nBecause a flux surface\
    \ has two outboard corners \u2014 one above and one below the magnetic midplane\
    \ \u2014 this quantity generalizes over both: in up-down symmetric equilibria\
    \ the upper-outer and lower-outer values coincide, whereas in asymmetric configurations\
    \ (such as single-null divertor plasmas) they differ and are resolved individually\
    \ as [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)\
    \ and [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface).\
    \ The squareness is evaluated at a reference corner angle of approximately $45\xB0\
    $ within each outer quadrant, measuring the signed displacement of the actual\
    \ flux-surface contour from the reference ellipse normalized by the local ellipse\
    \ scale.\n\nOuter squareness is inferred from equilibrium reconstruction by fitting\
    \ an analytic shape parameterization to magnetic diagnostic data and extracting\
    \ the Luce shape coefficients. It complements [upper_inner_squareness_of_flux_surface](name:upper_inner_squareness_of_flux_surface)\
    \ and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),\
    \ which characterize the inboard (high-field-side) corners. Typical magnitudes\
    \ in H-mode tokamak plasmas satisfy $|\\zeta_o| \\lesssim 0.2$, with positive\
    \ values corresponding to box-like protrusions beyond the reference ellipse and\
    \ negative values to inward-indented, star-shaped cross-sections.\n\nSign convention:\
    \ Positive when the outboard corner of the flux surface extends beyond the reference\
    \ ellipse (box-like cross-section), and negative when the corner is indented inward\
    \ relative to the reference ellipse (diamond-like or star-shaped cross-section)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  arguments:
  - name: squareness_of_flux_surface
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_upper_outer
    dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_outer
    status: composed
- name: lower_outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the lower outer quadrant
    of each flux surface, measuring the deviation of that corner from a reference
    ellipse sharing the same center, horizontal half-width, and elongation.
  documentation: "The lower outer squareness $\\zeta_{lo}$ is the quadrant-specific\
    \ Luce (2013) shape parameter describing how the lower outboard corner of a poloidal\
    \ flux-surface cross-section departs from a reference ellipse sharing the same\
    \ center, horizontal half-width $a$, and elongation $\\kappa$. As one of four\
    \ independent corner squareness coefficients, it captures asymmetries \u2014 both\
    \ up-down and in-out \u2014 that a single symmetric squareness value cannot resolve.\n\
    \nIn the Luce parametric form, the lower outer quadrant shape is governed by:\n\
    \n$$\nZ(\\theta) = Z_0 + a\\,\\kappa\\sin\\!\\bigl(\\theta + \\zeta_{lo}\\sin\
    \ 2\\theta\\bigr)\n$$\n\nwhere $\\theta \\in (-\\pi/2,\\,0)$ parameterizes the\
    \ lower outer quadrant, $Z_0$ is the geometric center height of the flux surface,\
    \ $a$ is the horizontal minor half-width, and $\\kappa$ is the local [elongation_of_flux_surface](name:elongation_of_flux_surface).\
    \ Setting $\\zeta_{lo} = 0$ recovers a pure ellipse in that quadrant.\n\nThis\
    \ quantity is obtained from equilibrium reconstruction by fitting the Luce parametric\
    \ contour to each nested flux surface computed from magnetics and internal measurements.\
    \ At the outermost closed flux surface the value reduces to [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary).\
    \ The upper-outer analog is [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface),\
    \ the lower inner counterpart is [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),\
    \ and the up-down symmetric outer combination is [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface).\n\
    \nSign convention: Positive when the lower outer corner of the flux-surface cross-section\
    \ bulges outward beyond the reference ellipse, increasing the cross-sectional\
    \ area of the lower outer quadrant relative to the elliptic baseline."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:lower_outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  - name:outer_squareness_of_flux_surface
  arguments:
  - name: outer_squareness_of_flux_surface
    operator: lower
    operator_kind: qualifier
- name: squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the plasma boundary,
    measuring the signed departure of the boundary corners from the reference ellipse
    defined by the elongation and triangularity shape parameters.
  documentation: 'The squareness of the plasma boundary is a dimensionless Luce shape
    coefficient that quantifies how much the corners of the poloidal cross-section
    depart from the reference ellipse parameterized by size, [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary),
    and triangularity. A positive value indicates corners that bulge outward beyond
    the reference ellipse, giving a more rectangular cross-section; a negative value
    indicates corners that indent inward, producing a more rounded, over-elliptic
    shape. This general quantity subsumes the [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)
    characterizing the high-field-side boundary and the [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    characterizing the low-field-side corners.


    In the Luce boundary parameterization, the squareness $\zeta$ enters as the coefficient
    of a $\sin(2\theta)$ angular distortion term in the poloidal angle mapping:


    $$

    \theta_b(\theta) = \theta + \arcsin(\delta)\sin\theta + \zeta\sin(2\theta)

    $$


    where $\theta$ is the poloidal parameter angle, $\delta$ is the triangularity,
    and $\theta_b$ is the effective angle determining the boundary coordinates in
    the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius and
    $Z$ the vertical height. The $\sin(2\theta)$ factor peaks at the corner positions
    ($\theta = \pi/4, 3\pi/4, 5\pi/4, 7\pi/4$), concentrating the squareness effect
    at the corners while leaving the outboard midplane and top/bottom extrema unaffected.


    The squareness is inferred from equilibrium reconstruction by fitting the parametric
    boundary form to measured plasma shape data; quadrant-resolved values are accessible
    as [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and upper_inner_squareness_of_plasma_boundary. Typical values in shaped tokamak
    plasmas range from approximately $-0.5$ to $+0.5$.


    Sign convention: Positive when the plasma boundary corner regions lie outside
    the reference ellipse defined by the elongation and triangularity, corresponding
    to a more rectangularly squared cross-sectional shape.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:inner_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  sources:
  - id: derived:squareness_of_plasma_boundary
    status: composed
- name: inner_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness parameter for the inboard (high-field-side)
    plasma boundary, measuring the departure of the inner corners from the reference
    ellipse set by minor radius, elongation, and triangularity; parent of the upper-inner
    and lower-inner quadrant components.
  documentation: 'The inner squareness of the plasma boundary is the dimensionless
    Luce shape coefficient quantifying how much the inboard (smaller major-radius)
    portion of the last-closed flux surface deviates from the reference ellipse determined
    by the boundary minor radius, the inner-side elongation, and the inner-side triangularity.
    It is the high-field-side counterpart to the outer squareness and serves as the
    parent quantity encompassing the quadrant-specific upper_inner_squareness_of_plasma_boundary
    (above-midplane, inboard) and [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    (below-midplane, inboard).


    In the Luce higher-order boundary parameterization, the inboard boundary contour
    in a poloidal cross-section at fixed toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame is described by a $\sin(2\theta)$ correction
    to the standard elliptical shape:


    $$

    R(\theta) = R_0 - a\cos\!\bigl(\theta + \arcsin(\delta_{\mathrm{i}})\sin\theta
    - \zeta_{\mathrm{i}}\sin(2\theta)\bigr)

    $$


    where $R_0$ is the major radius of the magnetic axis, $a$ is the boundary minor
    radius, $\delta_{\mathrm{i}}$ is the inner triangularity, $\theta$ is the poloidal
    parametric angle, and $\zeta_{\mathrm{i}}$ is the inner squareness. An analogous
    form $Z(\theta) = a\kappa_{\mathrm{i}}\sin(\theta + \zeta_{\mathrm{i}}\sin(2\theta))$
    governs the vertical extent with inner elongation $\kappa_{\mathrm{i}}$.


    This parameter is inferred from equilibrium reconstruction by fitting the Luce
    boundary representation to the geometry of the last-closed flux surface. It extends
    [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary) and complements
    [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary) for complete
    higher-order boundary characterization. Typical values of $\zeta_{\mathrm{i}}$
    lie in the range $-0.5$ to $0.5$ for conventional tokamak configurations.


    Sign convention: Positive when the inboard boundary corners are more rectangular
    than the reference ellipse; negative when the corners are more pointed (diamond-like).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_inner_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: inner
    operator_kind: qualifier
- name: lower_inner_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless shape parameter quantifying the deviation of the lower
    inner quadrant of the plasma cross-section from a reference ellipse, as part of
    the higher-order Luce boundary parameterization.
  documentation: "The lower inner squareness $\\zeta_{LI}$ characterizes how much\
    \ the plasma boundary in the lower inner quadrant \u2014 below the equatorial\
    \ plane and on the high-field inboard side \u2014 departs from the reference ellipse\
    \ defined by the plasma elongation $\\kappa$ and triangularity $\\delta$. It is\
    \ a higher-order geometric shape descriptor that refines the plasma boundary representation\
    \ beyond what elongation and triangularity alone can capture.\n\nIn the Luce boundary-shape\
    \ framework, the plasma cross-section is divided into four quadrants, each assigned\
    \ an independent squareness coefficient $\\zeta$ to represent up-down and inner-outer\
    \ asymmetries. A value of zero indicates that the boundary in the lower inner\
    \ quadrant coincides exactly with the local reference ellipse; positive values\
    \ indicate the boundary extends beyond the ellipse (producing a squarer, more\
    \ rectangular profile in that quadrant), while negative values indicate the boundary\
    \ lies inward of the ellipse (a more rounded profile).\n\nThis coefficient is\
    \ inferred from equilibrium reconstruction by fitting the reconstructed plasma\
    \ boundary contour \u2014 derived primarily from magnetic diagnostics and boundary\
    \ position measurements \u2014 to the higher-order shape parameterization. It\
    \ is the lower-half counterpart of upper_inner_squareness_of_plasma_boundary,\
    \ and together with [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary)\
    \ and [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),\
    \ provides the complete quadrant-resolved squareness description of the plasma\
    \ boundary, complementing the [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)\
    \ aggregate.\n\nTypical values in diverted tokamak plasmas range from approximately\
    \ $-0.4$ to $0.4$, with the sign and magnitude sensitive to X-point position,\
    \ divertor geometry, and poloidal field coil configuration.\n\nSign convention:\
    \ Positive when the lower inner quadrant of the plasma boundary extends outward\
    \ beyond the reference ellipse, producing a squarer cross-section profile in that\
    \ region."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  - name:inner_squareness_of_plasma_boundary
  arguments:
  - name: inner_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
- name: outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient measuring how both outboard (low-field-side)
    corners of the plasma boundary depart from the reference ellipse defined by minor
    radius, elongation, and triangularity.
  documentation: 'The outer squareness of the plasma boundary is the Luce (2013) dimensionless
    shape coefficient characterizing how the low-field-side (large-$R$) corners of
    the last-closed flux surface poloidal cross-section depart from the reference
    ellipse defined by the boundary minor radius $a$, elongation $\kappa$, and triangularity
    $\delta$. It is the parent quantity for [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    which resolve the upper-outboard and lower-outboard corner contributions separately.


    A positive outer squareness indicates the outboard corners of the plasma cross-section
    lie outside the reference ellipse (a more rectangular boundary), while a negative
    value indicates inward concavity at the outboard corners. The outer squareness
    is particularly sensitive to X-point geometry and the configuration of low-field-side
    shaping coils, making it relevant to heat-load distribution and edge stability.


    Outer squareness is inferred from equilibrium reconstruction by fitting the poloidal
    boundary contour $\{R(\xi), Z(\xi)\}$, where $\xi$ is a poloidal parameter, to
    external magnetic measurements and internal constraints. The global single-coefficient
    summary is provided by [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary),
    while the high-field-side corner contributions are captured by [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    and upper_inner_squareness_of_plasma_boundary.


    Sign convention: Positive when the outer boundary corner lies outside the reference
    ellipse at the corner poloidal angle, i.e., the outboard boundary is displaced
    toward larger minor radius relative to the inscribed ellipse in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is vertical
    height.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_outer_squareness_of_plasma_boundary
  - name:lower_outer_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: outer
    operator_kind: qualifier
- name: lower_outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Shape parameter for the lower outer quadrant of the plasma cross-section
    boundary measuring its deviation from an inscribed ellipse, following the Luce
    (2013) four-corner squareness decomposition.
  documentation: 'The lower outer squareness $\zeta_{lo}$ is one of four corner-specific
    shape parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the lower outer quadrant of the plasma cross-section boundary deviates
    from an inscribed ellipse with the same elongation and triangularity. The lower
    outer quadrant spans the outboard lower region of the cross-section, characterized
    by increasing major radius $R$ and decreasing height $Z$ from the geometric midplane.


    In the Luce framework the boundary near each corner is locally fitted by a superellipse
    whose exponent $n_{lo}$ controls the corner curvature:


    $$

    \zeta_{lo} = 1 - \frac{2}{n_{lo}}

    $$


    where $n_{lo} = 2$ corresponds to a pure ellipse ($\zeta_{lo} = 0$), $n_{lo} >
    2$ produces more rectangular corners ($\zeta_{lo} > 0$), and $n_{lo} < 2$ produces
    more rounded corners ($\zeta_{lo} < 0$). The squareness parameters capture fourth-order
    boundary shaping effects that are independent of elongation and triangularity.


    The squareness parameters are obtained from equilibrium reconstructions by fitting
    the reconstructed last-closed flux surface or separatrix boundary contour. They
    are particularly relevant for diverted configurations where divertor geometry
    shapes the lower boundary region.


    Typical values of $\zeta_{lo}$ in tokamak plasmas range from approximately $-0.3$
    to $+0.3$. Together with [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    and upper_inner_squareness_of_plasma_boundary, it completes the four-corner boundary
    shape decomposition; the parent quantity [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    describes outer-quadrant squareness without the upper/lower distinction.


    Sign convention: Positive when the lower outer quadrant of the boundary protrudes
    further outward than the ellipse inscribed at the same elongation and triangularity.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
  arguments:
  - name: outer_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
- name: surface_area_of_flux_surface
  kind: scalar
  status: draft
  description: "Total geometric surface area of a closed toroidal magnetic flux surface,\
    \ computed by revolving the poloidal boundary contour through the full 2\u03C0\
    \ toroidal angle around the machine symmetry axis."
  documentation: 'The surface area of a magnetic flux surface is the total area of
    the two-dimensional toroidal shell swept out when a closed poloidal flux contour
    is revolved through the full toroidal angle. It characterizes the geometric extent
    of each nested flux surface and enters flux-surface-averaged transport equations
    as a weighting factor relating cross-field particle and energy fluxes to radial
    gradients along the flux coordinate.


    For an axisymmetric magnetic equilibrium, the surface area of the flux surface
    at poloidal flux label $\psi$ is:


    $$

    S(\psi) = 2\pi \oint_{\psi} R \, d\ell_p

    $$


    where $R$ is the major radius (distance from the toroidal symmetry axis in the
    right-handed cylindrical $(R, \phi, Z)$ frame) and $d\ell_p$ is the arc-length
    element along the closed poloidal contour at constant $\psi$.


    The surface area profile is obtained from magnetic equilibrium reconstruction,
    which determines the flux-surface geometry across the plasma cross-section as
    a function of the flux label. This quantity is geometrically distinct from the
    [cross-sectional area of a flux surface], which is the poloidal area enclosed
    by the contour rather than the revolving-surface area. The full radial profile
    of this quantity shares the same physical concept as [area_of_flux_surface](name:surface_area_of_flux_surface),
    and its value at the outermost closed flux surface equals flux_surface_area_at_plasma_boundary.


    Surface area increases monotonically from near zero at the magnetic axis to a
    maximum at the plasma boundary, reaching tens of square meters in medium-sized
    tokamaks and several hundred square meters in large high-field devices.'
  unit: m^2
  physics_domain: equilibrium
  links: []
