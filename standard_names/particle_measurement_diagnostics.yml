- name: line_averaged_carbon_density
  kind: scalar
  status: active
  description: Line-averaged total number density of elemental carbon along a specified
    plasma chord, summed over neutral carbon and all ionic charge states through C6+.
  documentation: 'Line-averaged carbon density is the chord average of the total number
    density of elemental carbon, encompassing neutral carbon atoms and all ionic charge
    states from singly ionized C+ through fully stripped C6+.


    It is defined from the local [carbon density](name:carbon_density) along the chord:


    $$

    \bar n_C = \frac{1}{L}\int_0^L n_C(\ell)\,d\ell = \frac{1}{L}\int_0^L \sum_{z=0}^{6}
    n_{C^{z+}}(\ell)\,d\ell

    $$


    where $\bar n_C$ is the line-averaged carbon density, $n_C(\ell)$ is the local
    carbon density in m$^{-3}$, $n_{C^{z+}}(\ell)$ is the local density of carbon
    charge state $z+$ in m$^{-3}$, $\ell$ is distance along the chord in m, and $L$
    is the chord length in m. This chord average is distinct from [volume-averaged
    carbon density](name:volume_averaged_carbon_density), which averages over the
    confined plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:carbon_density
  - name:volume_averaged_carbon_density
  arguments:
  - name: carbon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/carbon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-carbon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/n_i/carbon
      parent: Carbon
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Carbon.
      kind: template
- name: line_averaged_deuterium_density
  kind: scalar
  status: active
  description: Deuterium ion density averaged along a plasma chord is the mean local
    number density of ionized deuterium in the fuel-ion population. It is charge-state-summed
    over ionized deuterium and excludes neutral or molecular deuterium and non-deuterium
    species.
  documentation: 'Deuterium ion density averaged along a plasma chord is the mean
    local number density of ionized deuterium in the fuel-ion population. It represents
    the path-length mean of the local deuterium density along the specified chord,
    with deuterium treated as a species-level ion density.


    The line average is defined by the path-length average of the local [deuterium
    density](name:deuterium_density):


    $$

    \langle n_D \rangle_\ell = \frac{1}{L} \int_{\ell_0}^{\ell_1} n_D(\ell) \, d\ell

    $$


    where $\langle n_D \rangle_\ell$ is the line-averaged deuterium density, $\ell$
    is arclength along the chord, $\ell_0$ and $\ell_1$ are the endpoints of the averaging
    interval, $L = \ell_1 - \ell_0$ is the chord path length, and $n_D(\ell)$ is the
    local [deuterium density](name:deuterium_density) at position $\ell$.


    The local deuterium density entering the integral is charge-state-summed over
    ionized atomic charge states; for deuterium this reduces to the singly ionized
    deuteron population. Neutral deuterium atoms, molecular deuterium, and non-deuterium
    species are excluded. This quantity is a path average; local [deuterium density](name:deuterium_density)
    and [deuterium ion density averaged over the total plasma volume](name:volume_averaged_deuterium_density)
    are distinct quantities.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_density
  - name:volume_averaged_deuterium_density
  - name:line_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/deuterium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-deuterium-value
    dd_documentation:
      leaf: Value
