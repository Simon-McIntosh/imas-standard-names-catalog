- name: poloidal_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Dimensionless coefficient that scales the collisionless free-streaming
    upper bound on poloidal momentum-flux density in multi-fluid edge plasma transport
    closures, capping the flux magnitude while leaving its sign direction unchanged.
    It is the momentum-specific poloidal flux limiter, not a particle-, heat-, or
    energy-flux limiter.
  documentation: 'The poloidal momentum coefficient is a dimensionless flux-limiter
    parameter for gradient-driven momentum transport in the poloidal tangent direction
    associated with increasing $\theta$ at fixed $\rho$ and $\phi$ in a specified
    flux-coordinate system $(\rho, \theta, \phi)$, embedded in the right-handed cylindrical
    $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi}, \hat{Z})$. Here $\rho$
    is a flux-surface label, $\theta$ is the poloidal angle, and $\phi$ is the toroidal
    angle. It scales the collisionless free-streaming bound used to limit modeled
    poloidal momentum-flux density in multi-fluid edge plasma transport closures;
    the associated signed flux component is positive for transport toward increasing
    $\theta$.


    The coefficient defines the upper bound enforced on the limited poloidal momentum-flux
    density:


    $$

    |\Pi_\theta^{\mathrm{lim}}| \le \alpha_\theta \, \Pi^{\mathrm{FS}}

    $$


    where $\Pi_\theta^{\mathrm{lim}}$ is the signed limited poloidal momentum-flux
    density, $\alpha_\theta$ is the poloidal momentum coefficient, and $\Pi^{\mathrm{FS}}$
    is the positive collisionless free-streaming momentum-flux reference scale for
    the transported particle population. For an underlying collisional diffusive estimate
    $\Pi_\theta^{\mathrm{diff}}$, the limiter changes magnitude only as needed to
    satisfy the bound and leaves the sign direction of the flux set by $\Pi_\theta^{\mathrm{diff}}$.


    This quantity is the poloidal specialization of [momentum flux limiter coefficient](name:momentum_flux_limiter_coefficient).
    The shorter [poloidal flux limiter coefficient](name:poloidal_flux_limiter_coefficient)
    is conceptually identical only when its limited quantity is the poloidal momentum-flux
    density; the momentum qualifier here excludes limiters for particle, heat, energy,
    or current flux. The coefficient is non-negative; reversal of poloidal transport
    is represented by the sign of the limited momentum-flux density, not by a negative
    coefficient.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_flux_limiter_coefficient
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: radial_ion_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Radial component of the dimensionless ion momentum flux-limiter coefficient
    that scales the free-streaming bound on radial ion momentum-flux density.
  documentation: 'The radial component of the dimensionless ion momentum-flux limiter
    coefficient scales the free-streaming upper bound imposed on ion momentum-flux
    density in the cylindrical radial direction. It is the radial member of the vector
    quantity [ion momentum flux limiter coefficient](name:ion_momentum_flux_limiter_coefficient),
    with radial referring to the $\hat{R}$ component in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The limiting relation is


    $$

    \left|\Pi_{R,i}\right| \leq C_{R,i}\,\Pi_{R,\mathrm{fs}}

    $$


    where $C_{R,i}$ is this coefficient, $\Pi_{R,i}$ is the signed radial ion momentum-flux
    density, and $\Pi_{R,\mathrm{fs}}$ is the nonnegative radial free-streaming bound;
    the two flux densities have the same pressure-equivalent units.


    As a magnitude-limiter coefficient, $C_{R,i}$ is nonnegative and has no independent
    sign; the sign of any limited radial ion momentum flux is inherited from the associated
    signed momentum-flux density. The ion-level coefficient applies to charge-state-summed
    radial ion momentum-flux density and is distinct from the [parallel ion momentum
    flux limiter coefficient](name:parallel_ion_momentum_flux_limiter_coefficient),
    the [poloidal ion momentum flux limiter coefficient](name:poloidal_ion_momentum_flux_limiter_coefficient),
    and the charge-state-resolved [ion charge-state momentum flux limiter coefficient](name:ion_charge_state_momentum_flux_limiter_coefficient).'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
