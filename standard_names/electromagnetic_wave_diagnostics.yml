- name: area_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Cross-sectional aperture area of the reflectometer detection antenna,
    defining the incident beam footprint for microwave reflectometry measurements.
  documentation: 'The area of the reflectometer antenna aperture determines the spatial
    resolution and power collection efficiency of the microwave reflectometry diagnostic.
    For a circular aperture of radius $r_a$, the effective area is approximately $A
    = \pi r_a^2$, with typical values ranging from $10^{-4}$ to $10^{-2}\ \mathrm{m}^2$
    in fusion devices. The aperture area couples directly to the antenna gain and
    beam divergence through the relationship $G = 4\pi A / \lambda^2$, where $\lambda$
    is the probing wavelength. This quantity is closely related to [radius_of_reflectometer_antenna](name:radius_of_reflectometer_antenna),
    which describes the aperture radius, and to [area_of_bolometer](name:area_of_bolometer),
    which follows the same geometric convention for a different diagnostic.


    Sign convention: Positive when the aperture is oriented to face the plasma, with
    the area normal vector directed toward the probed measurement region.'
  unit: m^2
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radius_of_reflectometer_antenna
  - name:area_of_bolometer
  sources:
  - id: dd:reflectometer_fluctuation/channel/antenna_detection_static/surface
    dd_path: reflectometer_fluctuation/channel/antenna_detection_static/surface
    status: composed
  - id: dd:reflectometer_fluctuation/channel/antenna_emission_static/surface
    dd_path: reflectometer_fluctuation/channel/antenna_emission_static/surface
    status: composed
  - id: dd:reflectometer_profile/channel/antenna_detection/surface
    dd_path: reflectometer_profile/channel/antenna_detection/surface
    status: composed
- name: major_radius_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Major-radius coordinate of the center of an electron cyclotron launcher
    mirror in the tokamak frame.
  documentation: "The major radius $R_{\\rm mirror}$ locates the center of the microwave\
    \ mirror in the IMAS cylindrical $(R, \\phi, Z)$ frame. This coordinate is essential\
    \ for aligning the launched or received ECCD/ECRH beam with the plasma equilibrium.\
    \ The mirror is typically motorized to steer the beam and is characterized by\
    \ a circular aperture; see [radius_of_electron_cyclotron_launcher_mirror](name:radius_of_electron_cyclotron_launcher_mirror)\
    \ for the beam footprint size. Typical major radii for ECCD mirrors in medium-size\
    \ tokamaks are 2\u20134 m, with precise values set by the port geometry and steering\
    \ range.\n\nSign convention: Positive when the mirror center is located at increasing\
    \ major radius $R$ from the machine symmetry axis.\n\nCross-reference: [major_radius_of_diagnostic_aperture](name:major_radius_of_diagnostic_aperture)\
    \ follows the same convention for other diagnostic apertures; [radius_of_optical_element](name:radius_of_optical_element)\
    \ describes a comparable aperture radius for infrared optics."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radius_of_electron_cyclotron_launcher_mirror
  - name:major_radius_of_diagnostic_aperture
  - name:radius_of_optical_element
  sources:
  - id: dd:ece/polarizer/radius
    dd_path: ece/polarizer/radius
    status: composed
- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Poloidal magnetic flux per radian of toroidal angle, serving as the
    fundamental flux-surface label for mapping plasma profiles and measurements in
    tokamak equilibrium.
  documentation: 'The poloidal magnetic flux $\psi$ is defined as $\psi = \frac{1}{2\pi}
    \int_{\rho(\psi)} \mathbf{B} \cdot d\mathbf{S}_{\text{pol}}$, where, for an axisymmetric
    tokamak geometry, the integral is over a surface of constant toroidal angle and
    $\mathbf{B}$ is the magnetic field. It increases monotonically from the magnetic
    axis to the plasma boundary for positive plasma current, providing a unique radial
    coordinate for ordering nested flux surfaces. This flux coordinate is routinely
    derived from equilibrium reconstruction codes (e.g., EFIT, LIUQE) using external
    magnetic measurements and internal constraints, with typical values ranging from
    $\psi = 0$ Wb at the magnetic axis to $\psi \approx 10$ Wb at the separatrix in
    a medium-size tokamak like DIII-D. The quantity [magnetic_flux](name:magnetic_flux)
    comprises both poloidal and toroidal components; the pair [toroidal_magnetic_flux](name:toroidal_magnetic_flux)
    and [poloidal_magnetic_flux_at_measurement_position](name:poloidal_magnetic_flux_at_measurement_position)
    share the same mathematical structure as $\psi$ evaluated at specific spatial
    locations.


    Sign convention: Positive when $I_p > 0$, i.e., plasma current flows in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    $+\hat{Z}$); $\psi$ then increases from the magnetic axis toward the plasma boundary.'
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:magnetic_flux
  - name:toroidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_measurement_position
  arguments:
  - name: magnetic_flux
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
