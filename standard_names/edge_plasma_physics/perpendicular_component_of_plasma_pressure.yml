name: perpendicular_component_of_plasma_pressure
status: draft
description: Total plasma pressure (electrons + ions, thermal + non-thermal) in the
  direction perpendicular to the local magnetic field.
documentation: "The perpendicular pressure $p_\\perp$ is the component of the plasma\
  \ pressure tensor acting in directions orthogonal to the local magnetic field $\\\
  mathbf{B}$. In an anisotropic plasma the pressure tensor separates into parallel\
  \ and perpendicular components, $\\overleftrightarrow{P} = p_\\perp \\mathbf{I}\
  \ + (p_\\parallel - p_\\perp)\\hat{b}\\hat{b}$, where $\\hat{b} = \\mathbf{B}/|\\\
  mathbf{B}|$ is the magnetic field unit vector, $p_\\parallel$ is the parallel pressure,\
  \ and $\\mathbf{I}$ is the identity tensor. The perpendicular pressure includes\
  \ contributions from both electrons and ions, thermal and non-thermal populations\
  \ (e.g., energetic particles from neutral beam injection or ICRH). In isotropic\
  \ Maxwellian plasmas $p_\\perp = p_\\parallel = nk_BT$, where $n$ is the number\
  \ density and $T$ the temperature; anisotropy ratios $p_\\perp/p_\\parallel$ can\
  \ reach 1.5\u20133 in the presence of strong auxiliary heating. The quantity is\
  \ obtained from kinetic equilibrium reconstructions or from multi-diagnostic fits\
  \ combining Thomson scattering ($T_e$, $n_e$) and charge-exchange recombination\
  \ spectroscopy ($T_i$). Typical core values in tokamaks range from $10^3$ to $10^6\\\
  ;\\mathrm{Pa}$."
