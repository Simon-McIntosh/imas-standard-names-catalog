- name: helium_3_density
  kind: scalar
  status: draft
  description: Local number density of helium-3 ions per unit plasma volume, summed
    over all ionization states from singly ionized to fully stripped and excluding
    neutral helium-3 atoms.
  documentation: 'Helium-3 density is the local number density of ionized helium-3
    nuclei in the plasma. It includes both singly ionized $^3\mathrm{He}^{+}$ and
    fully stripped $^3\mathrm{He}^{2+}$ ions, while excluding neutral helium-3 atoms.


    The total helium-3 ion density is the sum over the two possible ion charge states:


    $$

    n_{^3\mathrm{He}} = \sum_{q=1}^{2} n_{^3\mathrm{He},q}

    $$


    where $n_{^3\mathrm{He}}$ is the total helium-3 ion density in $\mathrm{m}^{-3}$,
    $n_{^3\mathrm{He},q}$ is the density in $\mathrm{m}^{-3}$ of helium-3 ions with
    charge state $q$, $q=1$ denotes singly ionized helium-3, and $q=2$ denotes fully
    stripped helium-3.


    In practice, helium-3 density can be inferred from charge-exchange recombination
    spectroscopy, passive helium spectroscopy, neutral-particle measurements, or integrated
    particle-balance analysis. Interpretation usually requires collisional-radiative
    modeling and knowledge of the ionization balance; in hot plasma cores helium-3
    is typically dominated by the fully stripped charge state, while singly ionized
    helium-3 is more important in cooler edge regions.


    Typical local densities range from $10^{17}$-$10^{19}\ \mathrm{m}^{-3}$ for trace
    or minority helium-3 populations, and can reach $10^{19}$-$10^{20}\ \mathrm{m}^{-3}$
    when helium-3 is a major fuel or dilution species. The corresponding fraction
    relative to electron density depends on fueling, isotope mix, wall recycling,
    and transport.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_helium_3_density
  - name:line_averaged_helium_3_density
  - name:helium_3_density_at_plasma_boundary
  - name:helium_3_fraction
- name: helium_4_density
  kind: scalar
  status: draft
  description: Local number density of helium-4 ions per unit plasma volume, the principal
    measure of fusion ash concentration in deuterium-tritium burning plasmas.
  documentation: "The helium-4 ion number density $n_{{}^4\\text{He}}$ quantifies\
    \ the local concentration of ${}^4\\text{He}$ nuclei at a given point in the plasma.\
    \ At fusion-relevant temperatures (several keV), helium-4 is fully stripped to\
    \ He$^{2+}$, and in deuterium-tritium burning plasmas it accumulates as the primary\
    \ fusion ash product of the reaction ${}^2\\text{H} + {}^3\\text{H} \\rightarrow\
    \ {}^4\\text{He} + n$; its buildup dilutes the fuel and reduces the fusion reaction\
    \ rate if not exhausted by the divertor system.\n\nThe time evolution of $n_{{}^4\\\
    text{He}}$ is governed by the particle continuity equation\n\n$$\n\\frac{\\partial\
    \ n_{{}^4\\text{He}}}{\\partial t} + \\nabla \\cdot \\boldsymbol{\\Gamma}_{{}^4\\\
    text{He}} = S_{{}^4\\text{He}}\n$$\n\nwhere $\\boldsymbol{\\Gamma}_{{}^4\\text{He}}$\
    \ is the helium-4 particle flux and $S_{{}^4\\text{He}}$ is the volumetric source\
    \ rate from fusion reactions and ionization of recycled helium neutrals at the\
    \ plasma edge.\n\nThe helium-4 density is measured primarily via charge exchange\
    \ recombination spectroscopy, where injected neutral beam atoms undergo charge\
    \ exchange with He$^{2+}$ ions to produce line emission from excited helium atoms;\
    \ passive spectroscopy of edge recycling emission provides a complementary approach.\
    \ Chord-averaged and volume-averaged forms are provided by [line_averaged_helium_4_density](name:line_averaged_helium_4_density)\
    \ and [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density)\
    \ respectively, while [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)\
    \ gives the boundary value.\n\nIn D-T burning plasmas, central He-4 densities\
    \ are in the range $10^{18}$-$10^{19}$ m$^{-3}$, with the helium-to-electron density\
    \ ratio \u2014 captured by [fraction](name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density)\
    \ \u2014 kept below approximately 5-10% in steady state to avoid excessive fuel\
    \ dilution."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_helium_4_density
  - name:volume_averaged_helium_4_density
  - name:helium_4_density_at_plasma_boundary
  - name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density
- name: krypton_density
  kind: scalar
  status: draft
  description: Local number density of krypton impurity summed over all ionization
    states, giving the total krypton particle concentration per unit plasma volume.
  documentation: "The krypton number density is the volumetric concentration of krypton\
    \ impurity at a given point in the plasma, encompassing all ionization states\
    \ from neutral krypton Kr$^0$ through fully stripped Kr$^{36+}$. It is the primary\
    \ local measure of krypton seeding level and the parent quantity from which spatially\
    \ averaged forms are derived.\n\nThe total krypton particle density $n_\\mathrm{Kr}$\
    \ at a given location is defined as:\n\n$$\nn_\\mathrm{Kr} = \\sum_{q=0}^{36}\
    \ n_\\mathrm{Kr}^{(q)}\n$$\n\nwhere $n_\\mathrm{Kr}^{(q)}$ is the number density\
    \ of krypton ions in charge state $q$. The [chord-averaged form](name:line_averaged_krypton_density)\
    \ integrates this local quantity along a line of sight, while [volume_averaged_krypton_density](name:volume_averaged_krypton_density)\
    \ provides a global mean. The concentration relative to electron density is tracked\
    \ by krypton_fraction, and the pedestal-region value by [krypton_density_at_pedestal](name:krypton_density_at_pedestal).\n\
    \nKrypton (atomic number $Z=36$) is injected as a high-$Z$ seeding gas for radiative\
    \ power exhaust and divertor detachment control. Its local density is inferred\
    \ from passive spectroscopy of charge-state emission lines, active charge-exchange\
    \ recombination spectroscopy, or tomographic inversion of multi-chord line-integrated\
    \ measurements. Typical seeded-discharge values in tokamak edge and divertor regions\
    \ range from $10^{16}$ to $10^{18}$ m$^{-3}$, corresponding to 0.01\u20131% of\
    \ the local electron density.\n\nSign convention: Positive when krypton particles\
    \ are present in the plasma volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_krypton_density
  - name:volume_averaged_krypton_density
  - name:krypton_density_at_pedestal
- name: line_averaged_beryllium_density
  kind: scalar
  status: draft
  description: Chord-average of the beryllium ion number density along a diagnostic
    line of sight, equal to the path integral of the local beryllium density divided
    by the chord length.
  documentation: 'The line-averaged beryllium ion number density quantifies the mean
    beryllium ion content along a plasma diagnostic chord, normalized by chord length.
    It is the chord-integrated analog of the local [beryllium_density](name:beryllium_density)
    and is the most directly accessible measure of beryllium impurity concentration
    from line-of-sight diagnostics.


    The quantity is defined as:


    $$

    \bar{n}_{Be} = \frac{1}{L} \int_0^L n_{Be}(l) \, dl

    $$


    where $n_{Be}(l)$ is the local beryllium ion number density at path coordinate
    $l$ along the chord and $L$ is the total chord length.


    Inferred from passive spectroscopy of beryllium emission lines by inverting chord-integrated
    emission intensities using atomic emissivity coefficients; the result aggregates
    contributions from all beryllium ionization states present along the chord. The
    [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density) provides
    a complementary global volume average, while [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    gives the local on-axis value.


    Sign convention: Positive when beryllium ions populate the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:beryllium_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_magnetic_axis
  arguments:
  - name: beryllium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/beryllium/value
    dd_path: summary/line_average/n_i/beryllium/value
    status: composed
- name: line_averaged_helium_3_density
  kind: scalar
  status: draft
  description: Line-averaged helium-3 density is the chord-length average of the local
    charged helium-3 ion number density. It sums singly ionized and fully stripped
    helium-3 ions, excludes neutral helium-3 atoms, and is independent of deuterium
    or tritium background densities except through separately defined composition
    fractions.
  documentation: 'Line-averaged helium-3 density is the mean charged helium-3 ion
    number density along a specified sightline through the plasma. The local density
    being averaged includes $^3\mathrm{He}^{+}$ and $^3\mathrm{He}^{2+}$ ions and
    excludes neutral $^3\mathrm{He}$ atoms.


    The chord average is defined by integrating the local charged helium-3 ion density
    along the path and dividing by the chord length:


    $$

    \bar{n}_{{}^3\mathrm{He},i} = \frac{1}{L}\int_0^L \left[n_{{}^3\mathrm{He}^{+}}(s)
    + n_{{}^3\mathrm{He}^{2+}}(s)\right] \, ds

    $$


    where $s$ is distance along the chord, $L$ is the total chord length, $n_{{}^3\mathrm{He}^{+}}$
    is the singly ionized helium-3 density, and $n_{{}^3\mathrm{He}^{2+}}$ is the
    fully stripped helium-3 density. Deuterium and tritium background densities do
    not enter this path integral; they only affect related composition quantities
    such as a helium-3 fraction.


    In practice this quantity is inferred from diagnostics or analysis methods that
    determine the helium-3 ion concentration along a line of sight, often combined
    with independent density measurements. Isotope-sensitive spectroscopy, charge-exchange
    measurements, neutral-particle analysis, or reconstructed species-density distributions
    can provide the local or path-integrated helium-3 contribution.


    Typical line-averaged helium-3 densities are $10^{16}$-$10^{19}$ m$^{-3}$ for
    trace or minority-species operation in tokamaks. In plasmas using helium-3 as
    a substantial fuel component, values can approach $10^{19}$-$10^{20}$ m$^{-3}$
    depending on total density and mixture fraction.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_3_density
  - name:volume_averaged_helium_3_density
  - name:line_averaged_helium_4_density
  arguments:
  - name: helium_3_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/helium_3/value
    dd_path: summary/line_average/n_i/helium_3/value
    status: composed
- name: line_averaged_helium_4_density
  kind: scalar
  status: draft
  description: Chord-averaged helium-4 ion number density, equal to the path integral
    of the local helium-4 density divided by the measurement chord length.
  documentation: 'The line-averaged helium-4 density gives the spatial mean of the
    local [helium_4_density](name:helium_4_density) along a diagnostic chord through
    the plasma. As the principal ash product of deuterium-tritium fusion, helium-4
    accumulates in the plasma core and its line-integrated concentration must be monitored
    to prevent fuel dilution and degradation of energy confinement.


    The chord average is defined as:


    $$

    \bar{n}_{\mathrm{He4}} = \frac{1}{L} \int_0^L n_{\mathrm{He4}}(\ell) \, d\ell

    $$


    where $n_{\mathrm{He4}}(\ell)$ is the local helium-4 ion number density at position
    $\ell$ along the chord (in m$^{-3}$) and $L$ is the total chord length in m.


    This quantity is a natural output of line-integrated optical diagnostics such
    as charge-exchange recombination spectroscopy and helium spectral-line emission
    measurements, prior to any spatial inversion. It complements [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    which integrates over the full plasma volume, and is directly analogous to [line_averaged_helium_3_density](name:line_averaged_helium_3_density)
    for the lighter helium isotope. Typical values in deuterium-tritium burning plasmas
    range from $10^{17}$ to $10^{19}$ m$^{-3}$, depending on fusion power and helium
    exhaust efficiency.


    Sign convention: Positive when helium-4 ions occupy the measurement chord at finite
    density; number density is orientation-independent and cannot take negative values.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_4_density
  - name:volume_averaged_helium_4_density
  - name:line_averaged_helium_3_density
  arguments:
  - name: helium_4_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/helium_4/value
    dd_path: summary/line_average/n_i/helium_4/value
    status: composed
- name: line_averaged_krypton_density
  kind: scalar
  status: draft
  description: Chord-average of the krypton number density, equal to the path integral
    of the local krypton particle density divided by the measurement chord length.
  documentation: 'Krypton ($Z = 36$) is a noble-gas impurity that may be seeded into
    fusion plasmas for edge radiative cooling and power exhaust control. The line-averaged
    krypton density $\bar{n}_\mathrm{Kr}$ gives the krypton particle concentration
    averaged along a measurement chord, providing a line-of-sight integrated measure
    of impurity content rather than a local point value.


    The defining relation is:


    $$

    \bar{n}_\mathrm{Kr} = \frac{1}{L} \int_0^L n_\mathrm{Kr}(\ell) \, d\ell

    $$


    where $n_\mathrm{Kr}(\ell)$ is the local krypton number density at position $\ell$
    along the chord and $L$ is the total chord length in meters.


    This quantity is typically inferred from chord-integrated optical or vacuum-ultraviolet
    emission spectroscopy of krypton line radiation, combined with emissivity modeling
    along the line of sight. It provides a path-integrated measure complementary to
    the local [krypton_density](name:krypton_density) and to the global [volume_averaged_krypton_density](name:volume_averaged_krypton_density).
    For comparison, [line_averaged_argon_density](name:line_averaged_argon_density)
    follows the same chord-average definition for argon seeding. Local concentrations
    at specific plasma regions are captured by [krypton_density_at_pedestal](name:krypton_density_at_pedestal)
    and [krypton_density_at_limiter](name:krypton_density_at_limiter).


    Typical line-averaged krypton densities in power-exhaust seeding scenarios range
    from $10^{16}$ to $10^{18}$ m$^{-3}$, depending on seeding rate and plasma confinement
    regime.


    Sign convention: Positive when krypton particles are present along the measurement
    chord, consistent with the intrinsically non-negative character of particle number
    density.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:krypton_density
  - name:volume_averaged_krypton_density
  - name:line_averaged_argon_density
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_limiter
  arguments:
  - name: krypton_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/krypton/value
    dd_path: summary/line_average/n_i/krypton/value
    status: composed
- name: lithium_density
  kind: scalar
  status: draft
  description: Number density of lithium impurity ions per unit plasma volume, summed
    over all ionization states from singly ionized to fully stripped, excluding neutral
    lithium atoms.
  documentation: 'Lithium impurity ion number density quantifies the concentration
    of ionized lithium (atomic number $Z = 3$) within the plasma, summing contributions
    from all charge states $\text{Li}^{1+}$, $\text{Li}^{2+}$, and $\text{Li}^{3+}$
    while excluding neutral lithium atoms. This total is related to the partial charge-state
    densities by


    $$

    n_\text{Li} = \sum_{z=1}^{3} n_{\text{Li}^{z+}}

    $$


    where $n_{\text{Li}^{z+}}$ is the local number density of lithium ions in charge
    state $z+$.


    Lithium impurity concentrations are measured locally via charge exchange recombination
    spectroscopy or inferred from spectroscopic inversion of lithium-line emission;
    spatially averaged forms include [line_averaged_lithium_density](name:line_averaged_lithium_density),
    obtained by integrating along a diagnostic chord, and [volume_averaged_lithium_density](name:volume_averaged_lithium_density),
    which characterizes global impurity content within the confined plasma volume.
    Lithium is introduced into fusion devices through wall conditioning, pellet injection,
    or gas puffing, and its concentration influences impurity radiation losses and
    fuel dilution. The ratio of lithium ion density to electron density is tracked
    by lithium_fraction, which indicates the impurity burden on plasma performance.


    Sign convention: Positive when lithium ions are present in the plasma; this quantity
    is non-negative by physical definition.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_lithium_density
  - name:volume_averaged_lithium_density
- name: line_averaged_lithium_density
  kind: scalar
  status: draft
  description: Path-length average of the lithium impurity ion number density along
    a diagnostic line of sight. It sums all ionized lithium charge states and excludes
    neutral lithium.
  documentation: 'Line-averaged lithium density is the path-length average of the
    lithium impurity ion number density along a specified line of sight. The local
    lithium ion density is the sum over ionized lithium charge states, $n_{\mathrm{Li,ion}}
    = n_{\mathrm{Li}^+} + n_{\mathrm{Li}^{2+}} + n_{\mathrm{Li}^{3+}}$, and excludes
    neutral lithium atoms.


    For a chord of length $L$, the line average is defined by


    $$

    \langle n_{\mathrm{Li}} \rangle_{\mathrm{line}} = \frac{1}{L}\int_0^L n_{\mathrm{Li,ion}}(\ell)\,d\ell

    $$


    where $\ell$ is distance along the line of sight in meters, $L$ is the chord length
    in meters, $n_{\mathrm{Li,ion}}$ is the local summed ionized-lithium density in
    m^-3, and $\langle n_{\mathrm{Li}} \rangle_{\mathrm{line}}$ is in m^-3.


    In practice, this quantity may be inferred from a line-integrated lithium-sensitive
    measurement divided by the relevant chord length, or computed by integrating a
    reconstructed local lithium ion density along the same path. It provides a bulk
    chord measure of lithium impurity content and does not by itself resolve where
    along the line of sight the lithium ions are located.


    The value is non-negative and is typically interpreted relative to electron density
    or to other impurity densities, because lithium content depends strongly on wall
    conditioning, fueling, transport, and plasma scenario. No universal numerical
    range is implied by the definition.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:lithium_density
  - name:volume_averaged_lithium_density
  - name:lithium_fraction
  arguments:
  - name: lithium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/lithium/value
    dd_path: summary/line_average/n_i/lithium/value
    status: composed
- name: lower_bound_energy_of_neutron_detector
  kind: scalar
  status: draft
  description: Lower energy threshold of a neutron detector energy band, defining
    the minimum neutron kinetic energy for which the detector registers counts in
    that spectral interval.
  documentation: "The lower bound energy specifies the minimum neutron kinetic energy\
    \ at which detection events are counted within a given energy band of the neutron\
    \ detector. Energy bands partition the detected neutron spectrum into discrete\
    \ acceptance intervals, with this lower threshold paired with a corresponding\
    \ upper threshold to define the full accepted energy range for a single measurement\
    \ channel.\n\nThe acceptance condition for a neutron with kinetic energy $E_n$\
    \ to be counted in the band is:\n\n$$\nE_\\mathrm{lower} \\leq E_n < E_\\mathrm{upper}\n\
    $$\n\nwhere $E_\\mathrm{lower}$ is this lower bound and $E_\\mathrm{upper}$ is\
    \ the upper threshold of the same band. This half-open interval convention ensures\
    \ each neutron is assigned to exactly one spectral interval when bands are contiguous\
    \ and non-overlapping.\n\nThe threshold value is set by hardware discriminator\
    \ levels, pulse-height analysis electronics, or time-of-flight gating, and forms\
    \ part of the detector energy calibration. For spectroscopic systems, the lower\
    \ bound may be adjusted to suppress electronic noise or to isolate specific fusion\
    \ reaction channels.\n\nFor bands targeting D-D fusion neutrons at 2.45 MeV, lower\
    \ bounds typically range from 0.1 to 2.5 MeV. For D-T neutron bands centered on\
    \ 14.1 MeV, lower bounds lie in the range 10\u201314 MeV."
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  - name:lower_energy
  - name:energy_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/energy_band/lower_bound
    dd_path: neutron_diagnostic/detector/energy_band/lower_bound
    status: composed
- name: lower_energy
  kind: scalar
  status: draft
  description: Minimum neutron energy threshold that defines the low-energy edge of
    a detector energy band; neutrons below this threshold are excluded from that spectral
    interval.
  documentation: 'Lower energy is the minimum neutron energy included in a neutron
    detector energy band. It defines the low-energy edge of the interval paired with
    the corresponding [upper-energy threshold](name:neutron_maximum_energy_of_neutron_detector);
    neutrons below this edge are outside that band, while neutrons within the interval
    may be registered according to the detector response.


    For a sharp nominal energy band, a dimensionally complete band counting-rate model
    uses an effective energy-dependent acceptance:


    $$

    \dot{N}_{\mathrm{band}} = \int_{E_{\mathrm{low}}}^{E_{\mathrm{high}}} \Phi_E(E)\,
    \mathcal{G}(E)\, dE

    $$


    where $\dot{N}_{\mathrm{band}}$ is the detector counting rate in s$^{-1}$, $E$,
    $E_{\mathrm{low}}$, and $E_{\mathrm{high}}$ are neutron energies in eV, $\Phi_E(E)$
    is the differential directional neutron flux at the detector in m$^{-2}$ s$^{-1}$
    sr$^{-1}$ eV$^{-1}$, $\mathcal{G}(E)$ is the effective detector acceptance in
    m$^2$ sr including active area, geometric acceptance, transmission, and [detection
    efficiency](name:efficiency_of_neutron_detector), and $dE$ is an energy interval
    in eV. The physical constraints are $E_{\mathrm{low}} \ge 0$ and, for a nonempty
    band, $E_{\mathrm{low}} < E_{\mathrm{high}}$.


    In practice, the lower threshold is determined by detector hardware settings,
    pulse-height or time-of-flight calibration, response-matrix definitions, and analysis
    selections used to assign events to spectral intervals. Because real detectors
    have finite energy resolution, the threshold is often a nominal band edge rather
    than an abrupt step in registration probability.


    Typical values in fusion neutron diagnostics span about $10^3$-$2 \times 10^7$
    eV. Bands used around D-D neutrons near $2.45 \times 10^6$ eV or D-T neutrons
    near $1.41 \times 10^7$ eV may have narrow separations of $10^3$-$10^6$ eV for
    spectroscopy or broader thresholds across $10^5$-$10^7$ eV for rate-oriented measurements.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_maximum_energy_of_neutron_detector
  - name:efficiency_of_neutron_detector
- name: neutral_beam_mass
  kind: scalar
  status: draft
  description: Atomic mass per particle of the injected neutral beam species, identifying
    the beam composition for diagnostic applications such as beam emission spectroscopy
    and charge exchange recombination spectroscopy.
  documentation: "The neutral beam mass specifies the atomic mass of the injected\
    \ neutral beam particle on a per-atom basis. This property identifies the beam\
    \ species and is an essential input for modeling spectroscopic observables \u2014\
    \ including Doppler line shapes and Lorentz-field motional Stark effects \u2014\
    \ in beam emission spectroscopy (BES) and charge exchange recombination spectroscopy\
    \ (CXRS).\n\nThis quantity is a fixed hardware parameter determined by the choice\
    \ of injected gas species. In fusion diagnostic applications the beam species\
    \ is a hydrogen isotope; typical masses are 1 u (hydrogen), 2 u (deuterium), or\
    \ 3 u (tritium), with deuterium the most widely used owing to its favorable penetration\
    \ depth and clear spectral separation from plasma impurity lines.\n\nTogether\
    \ with neutral_beam_charge and [neutral_beam_energy](name:neutral_beam_energy),\
    \ this mass fully characterizes the diagnostic beam species for spectral modeling.\
    \ The analogous per-particle mass of the observed fast ion population detected\
    \ via charge exchange emission is [fast_ion_mass](name:ion_atomic_mass), while\
    \ the general ionic species mass is [ion_mass](name:ion_atomic_mass)."
  unit: u
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutral_beam_energy
  - name:ion_atomic_mass
  sources:
  - id: dd:charge_exchange/channel/bes/a
    dd_path: charge_exchange/channel/bes/a
    status: composed
- name: neutron_flux_of_neutron_detector
  kind: scalar
  status: draft
  description: Fusion-neutron number flux incident on the active surface of a neutron
    detector, expressed as the number of neutrons crossing unit detector area per
    unit time.
  documentation: 'Neutron flux of a neutron detector is the incident fusion-neutron
    number flux through the detector''s active surface. It is a surface rate density
    for neutrons entering the detector, distinct from both the total plasma neutron
    emission rate and the detector count rate.


    Using a local right-handed detector-surface frame $(\hat{u}, \hat{v}, \hat{n})$,
    where $\hat{u}$ and $\hat{v}$ are tangent to the active surface and $\hat{n}$
    points from the plasma-facing front face into the sensitive volume, the surface-averaged
    incident neutron flux is


    $$

    \Phi_n = \frac{1}{A}\int_A \int_{\mathbf{v}\cdot\hat{n} > 0} (\mathbf{v}\cdot\hat{n})\,
    f_n(\mathbf{x}_s,\mathbf{v})\, d^3v\, dA

    $$


    where $\Phi_n$ is the neutron flux, $A$ is the active detector surface area, $\mathbf{x}_s$
    is a point on that surface, $\mathbf{v}$ is neutron velocity, and $f_n$ is the
    neutron phase-space density at the surface. The condition $\mathbf{v}\cdot\hat{n}
    > 0$ selects neutrons crossing the front face toward the sensitive volume.


    In practice this quantity is inferred from the neutron count rate after corrections
    such as background subtraction, dead-time correction, attenuation, scattering,
    collimation, and the detector response to neutron energy and angle. For a simple
    calibrated response coefficient $C_n$, an area-averaged estimate may be written
    inline as $\Phi_n \simeq \dot{N}_\mathrm{det}/(A_\mathrm{eff} C_n)$, where $\dot{N}_\mathrm{det}$
    is the neutron count rate and $A_\mathrm{eff}$ is the effective detector area.
    Fusion-neutron spectra are commonly dominated by 2.45 MeV neutrons from deuterium-deuterium
    reactions or 14.1 MeV neutrons from deuterium-tritium reactions, with broadening
    and scattering depending on plasma and surrounding material conditions.


    Typical incident fluxes at neutron detectors range from about 10^4-10^17 m^-2
    s^-1, spanning low-yield or heavily shielded measurements through high-yield deuterium-tritium
    operation. The value at a particular detector depends strongly on plasma neutron
    source strength, viewing geometry, distance, shielding, collimation, and detector
    calibration.'
  unit: m^-2.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:surface_area_of_neutron_detector
  - name:efficiency_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/mode/neutron_flux
    dd_path: neutron_diagnostic/detector/mode/neutron_flux
    status: composed
- name: neutron_maximum_energy_of_neutron_detector
  kind: scalar
  status: draft
  description: Maximum neutron energy threshold of a neutron detector energy band.
  documentation: 'Maximum neutron energy of a neutron detector is the upper kinetic-energy
    threshold of a detector energy band. Together with the corresponding minimum neutron
    energy, it defines the neutron-energy interval associated with that band.


    The detector band is represented by the allowed neutron kinetic energies:


    $$

    E_\mathrm{lower} \le E_n \le E_\mathrm{upper}

    $$


    where $E_n$ is the neutron kinetic energy in eV, $E_\mathrm{lower}$ is the minimum
    neutron energy threshold in eV, and $E_\mathrm{upper}$ is this maximum neutron
    energy threshold in eV. By definition $E_\mathrm{upper}$ is non-negative and must
    satisfy $E_\mathrm{upper} \ge E_\mathrm{lower}$.


    The threshold is determined by the detector response model, hardware settings,
    filters, moderators, time-of-flight selection, or the calibrated energy binning
    used to interpret neutron counts. It is a band definition rather than the measured
    energy of an individual neutron.


    Typical upper thresholds for fusion neutron diagnostics range from about $10^5$-$2
    \times 10^7$ eV for fast-neutron measurements. Bands centered on D-D and D-T fusion
    neutrons are commonly placed around the 2.45 MeV and 14.1 MeV neutron features,
    respectively, with upper thresholds chosen according to the desired bandwidth
    and detector resolution.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:lower_neutron_energy
  - name:efficiency_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:neutron_energy_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/energy_band/upper_bound
    dd_path: neutron_diagnostic/detector/energy_band/upper_bound
    status: attached
  - id: dd:neutron_diagnostic/detectors/energy_band/upper_bound
    dd_path: neutron_diagnostic/detectors/energy_band/upper_bound
    status: attached
- name: neutron_rate_of_neutron_detector
  kind: scalar
  status: draft
  description: Number of individual neutron detection events registered per unit time
    by a neutron detector operating in pulse-counting mode.
  documentation: 'Neutron rate of a neutron detector is the count rate of resolved
    neutron-induced pulses recorded by the detector. It is a detector response quantity,
    not the total neutron emission rate of the plasma source and not the incident
    neutron flux at the detector location.


    The rate is defined from the cumulative number of accepted neutron detection events:


    $$

    R_n(t) = \frac{dN_\mathrm{det}(t)}{dt}

    $$


    where $R_n(t)$ is the neutron detection rate and $N_\mathrm{det}(t)$ is the cumulative
    number of neutron events that pass the detector pulse-height, timing, and discrimination
    criteria.


    In practice, the rate is obtained by counting pulses in a finite time bin and
    dividing by the bin duration, with corrections as needed for dead time, background,
    pile-up, and neutron-gamma discrimination. For a given neutron field it depends
    on detector efficiency, active area or volume, shielding, collimation, and the
    neutron energy and angular response; at high rates, unresolved pile-up can make
    pulse counting unreliable and motivate current-mode or other integrating operation.


    Typical pulse-counting rates range from about 10^0-10^7 s^-1, depending on detector
    type, distance from the plasma, shielding, and fusion power. Rates above roughly
    10^6-10^7 s^-1 often require careful dead-time correction or a change of operating
    mode.'
  unit: s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  - name:flux_of_neutron_detector
  - name:rate_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/mode/counting
    dd_path: neutron_diagnostic/detector/mode/counting
    status: composed
  - id: dd:neutron_diagnostic/detector/mode/spectrum
    dd_path: neutron_diagnostic/detector/mode/spectrum
    status: attached
  - id: dd:neutron_diagnostic/detectors/mode/counting
    dd_path: neutron_diagnostic/detectors/mode/counting
    status: attached
- name: nitrogen_density
  kind: scalar
  status: draft
  description: Local number density of all nitrogen nuclei per unit plasma volume,
    summed over all ionization states from neutral nitrogen through fully stripped
    ions.
  documentation: 'Local number density of all nitrogen nuclei per unit plasma volume,
    totaling contributions from every ionization state of the species.


    The total nitrogen density is the sum over all charge states:


    $$

    n_N = \sum_{z=0}^{7} n_{N^{z+}}

    $$


    where $n_{N^{z+}}$ is the number density of nitrogen ions in charge state $z+$,
    with $z = 0$ for neutral nitrogen and $z = 7$ for fully stripped N$^{7+}$ (atomic
    number $Z_N = 7$).


    Nitrogen is commonly seeded into fusion plasmas as a radiative impurity to dissipate
    excess divertor heat flux; the local $n_N$ directly determines the radiative cooling
    power and the nitrogen contribution to the effective charge $Z_\mathrm{eff}$.
    It is inferred from vacuum-ultraviolet or extreme-ultraviolet emission spectroscopy
    analyzed with collisional-radiative models, or from active charge-exchange recombination
    spectroscopy.


    During active nitrogen seeding, core concentrations in present-day tokamaks range
    from $10^{17}$ to $5 \times 10^{18}$ m$^{-3}$, with elevated values near the plasma
    edge. The [line-averaged nitrogen density](name:line_averaged_nitrogen_density)
    and [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density)
    provide chord-integrated and globally averaged measures of the nitrogen particle
    inventory; [nitrogen_fraction](name:nitrogen_fraction) normalizes $n_N$ to the
    electron density.


    Sign convention: Positive when nitrogen nuclei are present in the plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_nitrogen_density
  - name:volume_averaged_nitrogen_density
  - name:nitrogen_fraction
- name: line_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Line-averaged number density of nitrogen nuclei along a plasma diagnostic
    chord, summed over all ionization states. It equals the path integral of the local
    nitrogen density divided by the chord length.
  documentation: 'Line-averaged nitrogen density is the chord-average of the local
    nitrogen number density sampled along a diagnostic line of sight. The nitrogen
    density includes nitrogen nuclei in all ionization states, so different charge
    states contribute according to their local abundance along the chord.


    For a chord path $\Gamma$, the line-averaged nitrogen density is defined by:


    $$

    \langle n_N \rangle_L = \frac{1}{L}\int_{\Gamma} n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local nitrogen number density in m^-3, summed over all
    ionization states, $\ell$ is arclength along the chord in meters, and $L=\int_{\Gamma}d\ell$
    is the chord length in meters over the sampled plasma region.


    In practice this quantity is inferred from diagnostics and analysis methods that
    constrain nitrogen content along a line of sight, often using spectroscopic signals,
    atomic physics modeling, plasma background parameters, and the known viewing geometry.
    Because many measurements are sensitive to emissivity or to particular charge-state
    populations rather than directly to total nitrogen density, the conversion to
    all-ionization-state nitrogen density is model dependent and is not simply a geometric
    division of a raw signal by chord length.


    Typical line-averaged nitrogen densities in tokamak plasmas range from about 1e15-1e18
    m^-3 for trace-seeded conditions and can reach 1e19 m^-3 in strongly seeded or
    detached-edge regimes, depending on fueling, impurity seeding rate, transport,
    and ionization balance.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  - name:line_averaged_carbon_density
  - name:nitrogen_density
  arguments:
  - name: nitrogen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/nitrogen/value
    dd_path: summary/line_average/n_i/nitrogen/value
    status: composed
- name: nuclear_density_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Number density of target nuclei in a neutron detector converter material
    for the nuclear species involved in the neutron-induced detection reaction.
  documentation: 'Nuclear density of a neutron detector converter is the number of
    target atomic nuclei per unit volume of converter material for the nuclear species
    that participates in the neutron-induced detection reaction. It is a material-and-composition
    property, distinct from converter volume or neutron flux, and sets the number
    of reaction centers available to incident neutrons.


    For a converter made from one or more compounds or phases $c$, the target-nucleus
    density can be computed from the bulk material density and composition as:


    $$

    n_i = \rho_m N_A \sum_c f_c \frac{\nu_{i,c} a_{i,c}}{M_c}

    $$


    where $n_i$ is the target nuclear density in $\mathrm{m}^{-3}$, $\rho_m$ is the
    bulk mass density of the converter material in $\mathrm{kg\,m}^{-3}$, $N_A$ is
    Avogadro''s constant in $\mathrm{mol}^{-1}$, $f_c$ is the dimensionless mass fraction
    of compound or phase $c$, $M_c$ is its molar mass in $\mathrm{kg\,mol}^{-1}$,
    $\nu_{i,c}$ is the number of atoms of the relevant parent element per formula
    unit, and $a_{i,c}$ is the dimensionless isotopic abundance or enrichment of target
    isotope $i$. For a pure elemental or pure isotopic converter this reduces to the
    familiar single-component density relation.


    In practice this quantity is derived from material specifications, density measurements,
    stoichiometry, isotopic assay, enrichment certificates, and corrections for porosity
    or inactive binder fraction when those affect the active converter volume. In
    response calculations it is combined with the microscopic reaction cross section
    and the converter-level neutron flux, such as neutron_flux_of_neutron_detector_converter;
    this is the flux at or within the converter and is distinct from a detector-level
    incident or averaged [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).


    Typical dense solid converter materials have total atomic densities of about $10^{28}-10^{29}\
    \mathrm{m}^{-3}$. Target isotope densities are commonly $10^{26}-10^{29}\ \mathrm{m}^{-3}$
    depending on stoichiometry, enrichment, and loading, while gas or low-density
    converter media can be much lower, around $10^{20}-10^{25}\ \mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_nuclear_density
    dd_path: neutron_diagnostic/detectors/radiation/converter_nuclear_density
    status: composed
- name: oxygen_density
  kind: scalar
  status: draft
  description: Total number density of oxygen atoms and ions across all charge states,
    from neutral to fully stripped, giving the local oxygen impurity concentration
    at a point in the plasma.
  documentation: "The local oxygen number density $n_\\mathrm{O}$ quantifies the total\
    \ concentration of oxygen impurity per unit plasma volume, encompassing neutral\
    \ atomic oxygen and all ionic charge states up to fully stripped O$^{8+}$. Oxygen\
    \ is a ubiquitous low-Z impurity in fusion devices, entering through wall outgassing\
    \ and vessel conditioning; it contributes to radiative power losses and dilutes\
    \ the hydrogenic fuel inventory.\n\nThe total oxygen density is defined as the\
    \ sum over all ionization states:\n\n$$\nn_\\mathrm{O} = \\sum_{Z=0}^{8} n_{\\\
    mathrm{O}^{Z+}}\n$$\n\nwhere $n_{\\mathrm{O}^{Z+}}$ is the number density of oxygen\
    \ in charge state $Z^+$, with $Z$ ranging from 0 (neutral) to 8 (fully stripped).\n\
    \nThe local density is inferred from passive extreme-ultraviolet spectroscopy,\
    \ charge-exchange recombination spectroscopy, and soft X-ray emission tomography.\
    \ Spatially averaged forms include [line_averaged_oxygen_density](name:line_averaged_oxygen_density)\
    \ (chord integral divided by chord length) and [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ (integral over the plasma volume). The dimensionless [oxygen_fraction](name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density)\
    \ relates this local density to the electron density as an impurity concentration\
    \ measure.\n\nIn well-conditioned fusion plasmas the core oxygen density is a\
    \ small fraction of the electron density; edge concentrations of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ are representative of limiter and divertor configurations.\n\
    \nSign convention: Positive when oxygen atoms or ions are present in the plasma\
    \ volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_oxygen_density
  - name:volume_averaged_oxygen_density
