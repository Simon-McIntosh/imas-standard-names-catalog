- name: toroidal_hydrogen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Local toroidal component of the hydrogen species bulk-flow velocity
    evaluated at a point on the plasma boundary, meaning the last-closed flux surface
    or separatrix. It is not a flux-surface average and is signed in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal hydrogen velocity at the plasma boundary is the local component
    of the hydrogen species bulk-flow velocity tangent to the toroidal direction at
    a specified point on the last-closed flux surface or separatrix. The component
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is distinct
    from flux-surface-averaged boundary quantities such as [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    which average around the boundary rather than retaining the local value.


    The local projection is


    $$

    v_{\phi,\mathrm{H}}(\mathbf{x}_b) = \mathbf{v}_{\mathrm{H}}(\mathbf{x}_b) \cdot
    \hat{\phi}

    $$


    where $\mathbf{x}_b$ is the selected boundary position, specified by $R$ and $Z$
    in meters and $\phi$ in radians; $\mathbf{v}_{\mathrm{H}}$ is the hydrogen bulk
    velocity in m.s^-1; $\hat{\phi}$ is the dimensionless toroidal unit vector; and
    $v_{\phi,\mathrm{H}}$ is the toroidal component in m.s^-1.


    In practice this quantity may be inferred from edge flow diagnostics, spectroscopic
    velocity measurements when applicable, or transport calculations constrained by
    edge plasma observations. Because it is local, it can vary with poloidal position
    along the separatrix and should not be substituted for a flux-surface average
    without an explicit averaging operation.


    No universal numerical range applies at the separatrix because the value depends
    strongly on plasma current, toroidal field, collisionality, rotation sources,
    and edge momentum transport. Representative edge main-species toroidal speeds
    are often of order 10^3-10^4 m.s^-1, with values that may be near zero or may
    reverse sign locally.


    Sign convention: Positive when the hydrogen bulk flow has a component in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
