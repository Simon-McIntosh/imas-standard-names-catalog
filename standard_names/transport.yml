  - id: dd:summary/local/magnetic_axis/n_i/oxygen/value
    dd_path: summary/local/magnetic_axis/n_i/oxygen/value
    status: composed
- name: parallel_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Field-aligned component of the electric current density driven by frictional
    momentum exchange between plasma ions and background neutral particles in partially
    ionized edge and divertor plasmas.
  documentation: "In partially ionized plasmas \u2014 found in the edge, scrape-off\
    \ layer, and divertor regions of a tokamak \u2014 collisions between plasma ions\
    \ and coexisting neutral atoms transfer momentum between the two fluids, producing\
    \ an ion-neutral friction force $\\mathbf{R}_{in} = m_i n_i \\nu_{in}(\\mathbf{v}_n\
    \ - \\mathbf{v}_i)$, where $m_i$ is the ion mass, $n_i$ is the ion number density,\
    \ $\\nu_{in}$ is the ion-neutral collision frequency, and $\\mathbf{v}_i$, $\\\
    mathbf{v}_n$ are the ion and neutral fluid velocities respectively. This friction\
    \ force drives an electric current whose full vector form is given by [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction);\
    \ the present quantity is the projection of that vector onto the local magnetic\
    \ field direction.\n\nThe parallel component is defined as:\n\n$$\nj_{\\parallel,\\\
    text{in}} = \\mathbf{j}_{\\text{in}} \\cdot \\hat{b}\n$$\n\nwhere $\\hat{b} =\
    \ \\mathbf{B}/B$ is the unit vector along the local magnetic field and $\\mathbf{j}_{\\\
    text{in}}$ is the full ion-neutral friction current density vector.\n\nThis component\
    \ enters the parallel momentum balance and the generalized Ohm's law for partially\
    \ ionized plasmas, and is most significant in regions of high neutral density\
    \ such as the divertor target and scrape-off layer. It is computed from fluid\
    \ or kinetic simulations of edge plasmas that resolve neutral transport. The complete\
    \ set of geometric projections includes [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction),\
    \ [poloidal_current_density_due_to_ion_neutral_friction](name:poloidal_current_density_due_to_ion_neutral_friction),\
    \ [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction),\
    \ and [vertical_current_density_due_to_ion_neutral_friction](name:vertical_current_density_due_to_ion_neutral_friction).\n\
    \nSign convention: Positive when the ion-neutral friction current flows in the\
    \ direction of the magnetic field vector $\\mathbf{B}$."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:poloidal_current_density_due_to_ion_neutral_friction
  - name:toroidal_current_density_due_to_ion_neutral_friction
  - name:vertical_current_density_due_to_ion_neutral_friction
  sources:
