    dd_path: plasma_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    status: composed
- name: toroidal_ion_state_rotation_frequency
  kind: scalar
  status: draft
  description: Toroidal angular rotation frequency of a specific ion charge state,
    equal to the toroidal bulk velocity divided by the local major radius.
  documentation: 'The toroidal rotation frequency of an ion charge state quantifies
    the angular velocity at which ions belonging to a given ionization level revolve
    around the machine symmetry axis. It characterizes the toroidal spin of a charge-state-resolved
    ion population, providing finer kinetic detail than species-averaged quantities.


    The defining relation is:


    $$

    \Omega_\mathrm{tor} = \frac{v_\mathrm{tor}}{R}

    $$


    where $v_\mathrm{tor}$ is the bulk toroidal velocity of the charge-state population
    and $R$ is the local major radius measured from the symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    This charge-state-resolved quantity distinguishes specific ionization levels of
    an ion species, in contrast to [toroidal_ion_rotation_frequency](name:toroidal_ion_rotation_frequency),
    which averages over all charge states. Different ionization states can rotate
    at distinct rates owing to their differing charge-to-mass ratios, neoclassical
    poloidal asymmetries, and differential collisional coupling to the bulk plasma.
    The corresponding linear velocity is [toroidal_ion_state_velocity](name:toroidal_ion_state_velocity),
    related by $v_\mathrm{tor} = \Omega_\mathrm{tor} R$.


    Toroidal rotation is measured by charge-exchange recombination spectroscopy, which
    resolves Doppler-shifted emission from specific charge states and, combined with
    the local major-radius profile, yields $\Omega_\mathrm{tor}$ directly. In tokamak
    H-mode core plasmas, values typically range from $10^3$ to a few times $10^5$
    rad/s, with impurity charge states occasionally showing rotation rates distinct
    from the hydrogenic bulk.


    Sign convention: Positive when the ion charge state rotates in the direction of
    increasing toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: rad.s^-1
  physics_domain: transport
  links:
  - name:toroidal_ion_rotation_frequency
  - name:toroidal_ion_state_velocity
  sources:
