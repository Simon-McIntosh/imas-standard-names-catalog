- name: neutral_momentum_flux_limiter_coefficient
  kind: vector
  status: draft
  description: Dimensionless vector flux-limiter coefficient that scales the free-streaming
    upper bound on neutral-particle momentum-flux density component-by-component in
    edge-plasma transport closures.
  documentation: 'The neutral momentum coefficient is the neutral-particle specialization
    of the general momentum_coefficient vector, providing one dimensionless limiter
    factor per spatial direction for neutral momentum transport in multi-fluid edge
    plasma models. Each directional component independently bounds the corresponding
    neutral momentum flux density, preventing unphysical exceedance of the free-streaming
    limit when the neutral mean free path is large relative to macroscopic gradient
    scales.


    The component $\alpha_\alpha$ in direction $\hat{e}_\alpha$ is defined as the
    ratio of the modeled flux to its free-streaming upper bound:


    $$

    \alpha_\alpha = \frac{\Pi_\alpha}{\Pi_\alpha^{\rm free}}

    $$


    where $\Pi_\alpha$ is the modeled neutral momentum flux density in direction $\hat{e}_\alpha$
    and $\Pi_\alpha^{\rm free} = m_n n_n u_\alpha^{\rm free}$ is the free-streaming
    estimate, with $m_n$ the neutral particle mass, $n_n$ the neutral number density,
    and $u_\alpha^{\rm free}$ the direction-$\alpha$ free-streaming reference speed.
    The constraint $\alpha_\alpha \in [0, 1]$ ensures the closure preserves the sign
    of the momentum flux while bounding its magnitude. The field-aligned component
    is analogous to parallel_neutral_state_momentum_coefficient, which resolves the
    same quantity by internal neutral state.


    Components are computed within edge-plasma transport closures as a function of
    local collisionality; values near 1 characterize the collision-dominated limit,
    while values near 0 indicate strongly free-streaming conditions where the limiter
    actively constrains the flux.


    Sign convention: Positive when the neutral momentum flux in the corresponding
    direction is in the same sense as the free-streaming estimate along the respective
    axis of the right-handed cylindrical $(R, \phi, Z)$ frame or along the magnetic-field
    direction.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: neutral
    operator_kind: qualifier
- name: nitrogen_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density at the pedestal top is the particle count per volume
    for nitrogen impurity ions evaluated at the core-side shoulder of the H-mode edge
    transport barrier, where steep edge gradients transition toward flatter confined-core
    variation. For bare nitrogen, it is summed over all ionization charge states unless
    a specific charge state is named.
  documentation: 'Number density at the pedestal top is the particle count per volume
    for nitrogen impurity ions evaluated at the core-side shoulder of an H-mode pedestal.
    The pedestal top is the transition where the steep-gradient edge transport barrier
    meets the flatter confined-core density variation, distinct from a separatrix
    or plasma-boundary value. For bare nitrogen, the density is summed over all ionic
    charge states from N$^+$ through fully stripped N$^{7+}$ unless a particular charge
    state is explicitly named; each contribution is non-negative, so the elemental
    sum is non-negative.


    For nitrogen on the pedestal-top flux surface, the defining local density is


    $$

    n_{\mathrm{N}}(\rho_{\mathrm{ped,top}}) = \sum_{q=1}^{7} \left.\frac{dN_{\mathrm{N}^{q+}}}{dV}\right|_{\rho=\rho_{\mathrm{ped,top}}}

    $$


    where $n_{\mathrm{N}}$ is the charge-state-summed nitrogen ion number density
    in $\mathrm{m^{-3}}$, $q$ indexes the nitrogen ion charge state, $N_{\mathrm{N}^{q+}}$
    is the dimensionless particle count for charge state $q$, $V$ is physical volume
    in $\mathrm{m^3}$, and $\rho_{\mathrm{ped,top}}$ is the pedestal-top value of
    the chosen radial flux label, for example normalized toroidal flux radius $\rho_\mathrm{tor,norm}$
    or normalized poloidal flux $\psi_N$.


    In practice, the pedestal-top nitrogen density is obtained by fitting edge impurity-density
    estimates across the pedestal and evaluating the fitted value at the top location,
    often identified from the change in gradient. Nitrogen densities are inferred
    from species-sensitive line emission, charge-exchange recombination spectroscopy
    when accessible, collisional-radiative modeling, ionization balance, impurity
    transport constraints, and consistency with local electron density, electron temperature,
    and quasineutrality. This quantity is the nitrogen-specific member of [number
    density at the pedestal top](name:density_at_pedestal_top), related to [electron
    density at the pedestal top](name:electron_density_at_pedestal_top) and [ion density
    at the pedestal top](name:ion_density_at_pedestal_top).


    Representative H-mode pedestal-top nitrogen densities are typically about $10^{16}$-$10^{18}$
    m^-3 in trace or moderately seeded conditions and may approach $10^{19}$ m^-3
    in strongly seeded edge plasmas, depending on fueling, nitrogen injection, ionization
    balance, and pedestal transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  - name:boron_density_at_pedestal_top
  - name:krypton_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: nitrogen
    operator_kind: qualifier
- name: nitrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of nitrogen impurity ions evaluated at the plasma boundary
    (separatrix), representing the impurity concentration at the last closed flux
    surface separating confined plasma from the scrape-off layer.
  documentation: "Nitrogen ion number density at the plasma boundary quantifies the\
    \ concentration of nitrogen impurity ions at the separatrix \u2014 the last closed\
    \ flux surface demarcating the magnetically confined plasma from the open-field-line\
    \ scrape-off layer. This is the nitrogen-species instantiation of [density_at_plasma_boundary](name:density_at_plasma_boundary).\
    \ Nitrogen is routinely injected into tokamaks as a controlled impurity to enhance\
    \ radiative dissipation of exhaust power and reduce peak heat loads at divertor\
    \ targets.\n\nThe boundary value reflects the balance between impurity sources\
    \ (gas injection, ionization of recycled neutrals) and outward transport through\
    \ the scrape-off layer. Its magnitude relative to the main-ion density influences\
    \ the effective charge $Z_\\mathrm{eff}$ and the radiated power fraction at the\
    \ plasma edge. The toroidal flow of nitrogen at the same location is separately\
    \ captured by [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary).\n\
    \nThe quantity is inferred from spectroscopic measurements of nitrogen line emission\
    \ in the edge and divertor regions combined with collisional-radiative modeling,\
    \ or from fluid impurity transport simulations constrained by bolometric data.\
    \ Typical values range from $10^{16}$ to $10^{19}$ m$^{-3}$, depending on the\
    \ nitrogen injection rate and edge plasma density. Analogous separatrix densities\
    \ for other impurity species include [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),\
    \ [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary),\
    \ and [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary).\n\
    \nSign convention: Positive definite, as number density is a particle count per\
    \ unit volume and does not change sign under any coordinate transformation."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:oxygen_density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: nitrogen
    operator_kind: qualifier
- name: flux_surface_averaged_nitrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of nitrogen ions at the plasma
    boundary (separatrix), summed over ion charge states from N+ through N7+ and excluding
    neutral nitrogen.
  documentation: 'Flux-surface-averaged number density of nitrogen ions at the plasma
    boundary (separatrix) is the flux-surface average of the local nitrogen ion density
    on the last closed flux surface. Because this is a species-level number density,
    the local nitrogen density entering the average is summed over ion charge states
    from singly ionized through fully stripped nitrogen; neutral nitrogen is excluded.


    For a closed poloidal circuit at the separatrix, the charge-state-summed flux-surface
    average can be written as:


    $$

    \langle n_N \rangle_{\mathrm{sep}} = \frac{\oint_{\mathrm{sep}} \left(\sum_{q=1}^{7}
    n_{\mathrm{N}^{q+}}(\ell)\right) \, d\ell / B_p(\ell)}{\oint_{\mathrm{sep}} d\ell
    / B_p(\ell)}

    $$


    where the summation is the local species-level nitrogen ion density, $n_{\mathrm{N}^{q+}}$
    is the density of nitrogen charge state $q$, $\ell$ is poloidal arc length around
    the closed curve formed by the separatrix in a poloidal cross-section of the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$ is toroidal angle,
    $Z$ is vertical height, and $B_p$ is the local poloidal magnetic-field magnitude.
    If the separatrix contains an X-point, the value is understood as the limiting
    flux-surface average from neighboring closed flux surfaces inside the plasma boundary.


    This quantity is the flux-surface-averaged counterpart of [nitrogen_density_at_plasma_boundary](name:nitrogen_density_at_plasma_boundary)
    and a nitrogen-specific member of [flux_surface_averaged_ion_species_density_at_plasma_boundary].
    It is inferred from edge spectroscopy combined with collisional-radiative modeling,
    line-integrated radiation constraints, and edge transport analysis, with equilibrium
    reconstruction providing the separatrix location and magnetic-field weighting.


    Typical values in nitrogen-seeded tokamak edge plasmas are roughly 10^15-10^18
    m^-3 at the separatrix. Strong seeding or detached-divertor conditions can approach
    or exceed 10^18 m^-3, while unseeded plasmas may be below 10^15 m^-3.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:nitrogen_density_at_plasma_boundary
