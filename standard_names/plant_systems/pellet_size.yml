name: pellet_size
status: draft
cocos_transformation_type: one_like
description: Characteristic linear dimension of a fuel or impurity pellet, encoding
  the radius for spherical pellets or radius and height for cylindrical pellets.
documentation: "The pellet size (in m) specifies the geometric dimensions of a cryogenic\
  \ or impurity pellet used for plasma fueling or disruption mitigation. For a spherical\
  \ pellet, the single entry gives the pellet radius $r_p$; for a cylindrical pellet,\
  \ the first entry is the radius and the second is the cylinder height $h_p$. The\
  \ pellet volume follows as $V = \\frac{4}{3}\\pi r_p^3$ (sphere) or $V = \\pi r_p^2\
  \ h_p$ (cylinder). Typical pellet radii for tokamak fueling are 1\u20134 mm; disruption-mitigation\
  \ pellets can be significantly larger, up to 10\u201315 mm in radius. Pellet dimensions\
  \ are set during pellet formation in the cryostat and verified by shadow imaging\
  \ or micrometers before injection. Together with the pellet composition and velocity,\
  \ the size determines the total particle inventory delivered and the ablation profile\
  \ inside the plasma. See also `diameter_of_pellet` for an alternative geometric\
  \ descriptor and `shattered_pellet_fragment_volume` for post-shatter fragment sizes."
