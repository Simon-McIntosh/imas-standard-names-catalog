name: poloidal_component_of_magnetic_field
description: Projection of the magnetic-field vector onto the poloidal direction within
  a flux-surface cross section.
documentation: "The poloidal magnetic field $B_\\theta = \\mathbf{B} \\cdot \\hat{e}_\\\
  theta$ is the in-plane component of $\\mathbf{B}$ in the poloidal cross section,\
  \ perpendicular to the toroidal direction $\\hat{\\phi}$. It is generated primarily\
  \ by the toroidal plasma current $I_p$ via Amp\xE8re's law: $\\oint B_\\theta \\\
  , dl = \\mu_0 I_{\\mathrm{enc}}$, where $\\mu_0 = 4\\pi \\times 10^{-7}$ H\xB7m$^{-1}$\
  \ is the permeability of free space and $I_{\\mathrm{enc}}$ the enclosed current.\
  \ Typical values range from 0.1\u20130.5 T on the outboard midplane in medium-size\
  \ tokamaks (DIII-D, ASDEX Upgrade) to ~0.7 T at the ITER outboard midplane, roughly\
  \ an order of magnitude smaller than the toroidal field. Measured by magnetic pick-up\
  \ coils, motional Stark effect (MSE) polarimetry, or inferred from equilibrium reconstruction\
  \ codes. Positive when $B_\\theta$ points in the $+\\theta$ direction consistent\
  \ with the chosen COCOS convention (e.g., upward on the outboard midplane under\
  \ COCOS-11 with positive $I_p$). Related to the safety factor via $q = r B_\\phi\
  \ / (R B_\\theta)$ on circular flux surfaces, where $r$ is the minor radius (m)\
  \ and $R$ the major radius (m)."
kind: vector_component
unit: T
