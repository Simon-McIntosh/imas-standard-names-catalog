- name: vertical_coordinate_of_annular_outer_outline_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of a point on the outer outline polygon of
    an annular cross-section structural element, measured in the right-handed cylindrical
    (R, phi, Z) frame. Together with the corresponding major-radius coordinate, each
    (R, Z) pair defines one vertex of the closed outer boundary contour of the annular
    region.
  documentation: 'Each annular cross-section element is bounded by two closed polygonal
    contours: an inner boundary and an outer boundary. This standard name gives the
    $Z$ coordinate (vertical height in the right-handed cylindrical $(R, \phi, Z)$
    frame, with $Z$ measured upward from the machine midplane) of a single vertex
    on the **outer** boundary polygon.


    The outer-outline contour is the set of $(R_i, Z_i)$ vertex pairs that, taken
    together, trace the outer edge of the annular region. The companion radial coordinate
    is `major_radius_of_annular_outer_outline_point`; together, one $(R_i, Z_i)$ pair
    fully locates the $i$-th vertex of the outer outline.


    Typical values lie in the range $Z \in [-10, +10]$ m for tokamak cryostat and
    ferritic-insert components, with the exact range determined by the geometry of
    the device.


    The outer outline is geometrically distinct from the inner outline: the inner
    boundary polygon encloses the hollow interior of the annulus, while the outer
    boundary polygon bounds the annular solid from the outside. Do not confuse the
    center or reference point of the annulus with either outline polygon.


    Sign convention: Positive when the point is above the machine midplane ($Z = 0$),
    i.e., in the direction of increasing $Z$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_annular_outer_outline_point
  - name:vertical_coordinate_of_annulus
