    dd_path: core_profiles/profiles_1d/electrons/velocity/radial
    status: composed
- name: radial_ion_velocity
  kind: scalar
  status: draft
  description: Outward flux-surface-normal component of the ion fluid motion, carrying
    ion particles across nested magnetic surfaces in transport analyzes.
  documentation: 'Radial ion velocity is the projection of the ion fluid velocity
    onto the outward direction normal to nested magnetic flux surfaces. It is the
    cross-field convective motion of an ion population and is the component of [ion_velocity]
    most directly associated with particle transport, unlike the field-aligned [parallel
    ion velocity](name:parallel_ion_velocity) or rotational [toroidal ion velocity](name:toroidal_ion_velocity).


    The component is defined by the projection


    $$

    v_{i,r} = \mathbf{v}_i \cdot \hat{\mathbf{e}}_r

    $$


    where $\mathbf{v}_i$ is the ion fluid velocity vector, $\hat{\mathbf{e}}_r$ is
    the outward unit vector normal to the chosen flux surface, and $v_{i,r}$ is the
    radial component. In transport modeling it enters the ion particle flux through
    the relation $\Gamma_i = n_i v_{i,r}$, where $n_i$ is the [ion density](name:ion_density).


    Direct measurement of this component is difficult because cross-field flows are
    small compared with toroidal and parallel rotation. It is commonly inferred from
    particle balance, ion continuity analysis, transport modeling, or consistency
    with measured charge-exchange flow components and equilibrium geometry; comparison
    with [radial electron velocity](name:radial_electron_velocity) is used in ambipolar
    transport studies.


    Representative core values are much smaller than thermal speeds, often from fractions
    of 1 m s^-1 to tens of m s^-1 in quiescent core conditions, with larger transient
    values during strong fueling, pellets, edge relaxation events, or rapid profile
    evolution.


    Sign convention: Positive when the ion fluid motion is outward from the magnetic
    axis toward larger flux-surface radius.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:parallel_ion_velocity
  - name:toroidal_ion_velocity
  - name:ion_density
  - name:radial_electron_velocity
  arguments:
  - name: ion_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/velocity/radial
    dd_path: core_profiles/profiles_1d/ion/velocity/radial
    status: composed
- name: thermal_electron_density
  kind: scalar
  status: draft
  description: Number of Maxwellian bulk electrons per unit volume, excluding suprathermal
    electrons treated as a fast population.
  documentation: 'Thermal electron density is the number density associated with the
    bulk, near-Maxwellian electron population that participates in collisional transport
    and quasineutral force balance. It is the thermal-population contribution to [electron
    density](name:electron_density), distinct from the suprathermal contribution described
    by [fast electron density](name:fast_electron_density).


    A kinetic definition is the velocity-space integral of the thermal part of the
    electron distribution function:


    $$

    n_{e,\mathrm{th}}(\mathbf{x}) = \int_{\mathcal{V}_\mathrm{th}} f_e(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $n_{e,\mathrm{th}}$ is the thermal electron density, $f_e$ is the electron
    distribution function, $\mathbf{x}$ is position, $\mathbf{v}$ is particle velocity,
    and $\mathcal{V}_\mathrm{th}$ denotes the velocity-space region assigned to the
    thermal population.


    It is inferred from Thomson scattering, interferometry, reflectometry, and transport
    analysis; when energetic electrons are present, the thermal component is obtained
    by separating or subtracting the contribution associated with [fast electron density](name:fast_electron_density).
    Through quasineutrality, it is closely coupled to [thermal ion density], and together
    with electron temperature it determines the thermal part of [electron pressure](name:electron_pressure).


    Typical core values in magnetic-confinement plasmas span $0.1-2 \times 10^{20}\;\mathrm{m^{-3}}$,
    while edge and scrape-off-layer values are lower and vary strongly with fueling,
    recycling, and confinement regime.


    Sign convention: Positive when the velocity-space integral of the thermal electron
    distribution function is positive.'
  unit: m^-3
  physics_domain: transport
