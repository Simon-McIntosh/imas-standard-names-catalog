- name: parallel_diamagnetic_current_density
  kind: scalar
  status: draft
  description: Field-aligned component of the diamagnetic current density, projected
    onto the local magnetic field direction in the edge plasma.
  documentation: 'The parallel diamagnetic current density is the projection of the
    total [diamagnetic_current_density](name:diamagnetic_current_density) onto the
    local magnetic field direction at each point in the edge plasma. The diamagnetic
    current arises from the gyration of magnetized particles in a pressure-gradient
    field; in an isotropic ideal plasma, $\mathbf{j}_\mathrm{dia} = (\mathbf{B} \times
    \nabla p)/B^2$ is purely perpendicular to $\mathbf{B}$, so its parallel component
    vanishes in that limit. In more complete descriptions including pressure anisotropy,
    finite Larmor radius corrections, or the inhomogeneous magnetic geometry of the
    tokamak edge, a field-aligned component emerges and must be tracked separately.


    The parallel projection is defined as:


    $$

    j_{\parallel,\mathrm{dia}} = \mathbf{j}_\mathrm{dia} \cdot \hat{b}

    $$


    where $\mathbf{j}_\mathrm{dia}$ is the diamagnetic current density vector and
    $\hat{b} = \mathbf{B}/B$ is the unit vector along the magnetic field of magnitude
    $B$.


    In edge plasma current decompositions, this component is closely related to [parallel_current_density_due_to_diamagnetic_drift](name:parallel_current_density_due_to_diamagnetic_drift),
    which encodes the same physical mechanism through the explicit drift formalism.
    The toroidal_diamagnetic_current_density provides the complementary geometric
    projection of the same vector field onto the toroidal direction.


    Sign convention: Positive when the current flows in the direction of the local
    magnetic field unit vector $\hat{b} = \mathbf{B}/B$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:edge_profiles/ggd/j_diamagnetic/parallel
    dd_path: edge_profiles/ggd/j_diamagnetic/parallel
    status: composed
- name: thermal_plasma_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure of the bulk thermal plasma, equal to the sum
    of electron and bulk-ion thermal pressure contributions and excluding fast, suprathermal,
    or runaway populations.
  documentation: 'Thermal plasma pressure is the isotropic kinetic pressure associated
    with particle populations close to local thermodynamic equilibrium. It includes
    the thermal electron contribution and the contributions from bulk thermal ion
    species, but excludes nonthermal populations such as fast ions, suprathermal tails,
    and runaway electrons. It is the thermal component of the more general [plasma_pressure](name:plasma_pressure)
    and is closely related to [thermal_pressure](name:thermal_pressure), [total_electron_pressure](name:total_electron_pressure),
    and [total_ion_pressure](name:total_ion_pressure).


    For Maxwellian or near-Maxwellian thermal species, the pressure is defined by
    the species density-temperature sum:


    $$

    p_\mathrm{th} = n_e k_B T_e + \sum_i n_i k_B T_i

    $$


    where $n_e$ and $n_i$ are electron and bulk-ion number densities in m$^{-3}$,
    $T_e$ and $T_i$ are thermodynamic temperatures in K, $k_B$ is Boltzmann''s constant,
    and the sum is over thermal ion species. When temperatures are tabulated in eV,
    the equivalent SI pressure is obtained by replacing $k_B T_s$ with $e T_s$, where
    $e$ is the elementary charge and $T_s$ is the temperature value in eV; this gives
    $p_\mathrm{th}$ in Pa.


    In practice, thermal plasma pressure is computed from measured or modeled density
    and temperature for electrons and bulk ions, with quasineutrality often used to
    constrain the ion density composition when not all ion species are independently
    measured. It enters fluid and magnetohydrodynamic force balance through the pressure-gradient
    term and sets the thermal part of quantities such as beta, sound speed, and parallel
    pressure balance.


    Representative edge-plasma values span a wide range because both density and temperature
    vary strongly across confined, near-separatrix, and scrape-off-layer regions.
    For densities of about $10^{18}$-$10^{20}$ m$^{-3}$ and electron-plus-ion thermal
    temperatures of about 1-200 eV, thermal plasma pressure is typically of order
    0.1-$10^4$ Pa.'
