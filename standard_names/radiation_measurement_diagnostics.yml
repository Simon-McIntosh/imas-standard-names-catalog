- name: vertical_coordinate_of_filter_window
  kind: scalar
  status: active
  description: "Signed vertical coordinate of the geometric center of a diagnostic\
    \ filter window in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate identifies the height of the geometric center
    of the filter window in the right-handed cylindrical $(R, \phi, Z)$ frame. It
    is a geometric location, not a photon-interaction or optical-response quantity.


    For a window surface $S$ with area $A$, the centroidal vertical coordinate is
    defined by


    $$

    Z_c = \frac{1}{A}\int_S Z\,dA

    $$


    where $Z_c$ and $Z$ are vertical coordinates measured in m, $dA$ is the surface-area
    element, and $A=\int_S dA$ is the window area. The corresponding radial location
    is given by [radial coordinate of filter window](name:radial_coordinate_of_filter_window);
    this quantity is distinct from the vertical coordinate of a diagnostic aperture,
    such as [vertical coordinate of diagnostic aperture](name:vertical_coordinate_of_diagnostic_aperture).


    Sign convention: Positive when the window center lies in the $+Z$ direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_filter_window
  - name:vertical_coordinate_of_diagnostic_aperture
  sources:
