- name: electron_energy_equation_convergence_iteration_count
  kind: scalar
  status: draft
  description: Count of iterations performed in the convergence loop for the electron
    energy equation within a single transport solver cycle. A value of zero indicates
    either no iterations were attempted or that the initial guess satisfied the convergence
    criterion before any iterative update was applied. Non-negative integer.
  documentation: "The electron energy equation convergence iteration count $n_\\mathrm{iter}^{e,E}$\
    \ records the number of iterative solver steps executed for the electron energy\
    \ equation during a single transport solver time step or coupling cycle.\n\nIn\
    \ implicit transport solvers the electron energy equation is advanced by solving\
    \ a residual equation of the form $\\mathcal{R}^{e,E}(T_e^{(k)}) = 0$, where $T_e^{(k)}$\
    \ is the electron temperature at iteration $k$ and $\\mathcal{R}^{e,E}$ is the\
    \ residual functional associated with the discretized electron energy balance.\
    \ The solver increments $n_\\mathrm{iter}^{e,E}$ by one for each Newton, Picard,\
    \ or equivalent update step applied to this equation. Iteration ceases when $\\\
    |\\mathcal{R}^{e,E}\\|$ falls below the prescribed convergence tolerance $\\varepsilon^{e,E}$,\
    \ or when the maximum iteration limit $n_\\mathrm{iter,max}$ is reached, whichever\
    \ occurs first.\n\nA value of zero is returned when no iterative update is applied\
    \ \u2014 this may occur when the electron energy equation is not active in a given\
    \ cycle, or according to solver-specific conventions regarding the counting of\
    \ a pure-check step. A value equal to $n_\\mathrm{iter,max}$ indicates that the\
    \ prescribed tolerance was not achieved within the allowed number of steps (non-convergence).\
    \ Typical well-converged transport simulations yield $n_\\mathrm{iter}^{e,E}$\
    \ in the range 1\u201320 per time step; values near $n_\\mathrm{iter,max}$ may\
    \ signal numerical stiffness, excessively tight tolerances, or challenging plasma\
    \ conditions such as steep electron temperature gradients or rapid transients.\n\
    \nThis quantity is the electron-energy-equation-specific instance of the generic\
    \ solver convergence iteration count, which covers all solver equations collectively.\
    \ Related quantities include the electron energy equation convergence residual\
    \ and the electron energy equation convergence tolerance, which together define\
    \ the convergence criterion against which this count is measured."
  unit: '1'
  physics_domain: computational_workflow
  links:
  - name:solver_convergence_iteration_count
  constraints: []
  sources:
  - id: dd:transport_solver_numerics/convergence/equations/electrons/energy/iterations_n
    dd_path: transport_solver_numerics/convergence/equations/electrons/energy/iterations_n
    status: composed
- name: simulation_current_time
  kind: scalar
  status: draft
  description: The instantaneous simulation clock time at the moment of data output,
    expressed as an absolute time on the simulation time axis. This quantity identifies
    the current position within a simulation run and is not necessarily monotonically
    increasing across concatenated or restarted outputs.
  documentation: "The simulation current time $t_\\mathrm{curr}$ is the value of the\
    \ simulation clock recorded at the moment a data snapshot is written. It is measured\
    \ in seconds and represents an absolute time on the simulation time axis \u2014\
    \ not elapsed time relative to any run origin \u2014 so that $t_\\mathrm{curr}$\
    \ can be directly compared with the run start time $t_\\mathrm{start}$ and run\
    \ end time $t_\\mathrm{end}$ without additional offset corrections.\n\nIn a continuous\
    \ single-segment run one generally has $t_\\mathrm{start} \\leq t_\\mathrm{curr}\
    \ \\leq t_\\mathrm{end}$, but in checkpoint/restart workflows the simulation may\
    \ be rewound or branched so that successive output records do not form a strictly\
    \ monotonically increasing sequence. The current time should therefore be interpreted\
    \ as the simulation clock value at the instant of output rather than as a cumulative\
    \ counter.\n\nTypical values range from fractions of a millisecond to several\
    \ seconds of simulated physical time for tokamak transport or MHD simulations,\
    \ but the permissible range is fully determined by the physics being modeled and\
    \ the duration of the run. The time step $\\Delta t$ used to advance the simulation\
    \ from one output to the next is recorded separately as the simulation time step\
    \ quantity.\n\nRelated quantities in the same workflow family include the run\
    \ start time, run end time, restart time, and time step, which together fully\
    \ characterize the temporal structure of a simulation run."
  unit: s
  physics_domain: computational_workflow
  links:
  - name:simulation_start_time
  - name:simulation_end_time
  - name:simulation_restart_time
  - name:simulation_time_step
  constraints: []
  sources:
  - id: dd:dataset_description/simulation/time_current
    dd_path: dataset_description/simulation/time_current
    status: composed
- name: simulation_end_time
  kind: scalar
  status: draft
  description: Terminal time boundary of a numerical simulation interval, marking
    the point beyond which no further time advancement is performed in a workflow
    execution.
  documentation: 'The simulation end time $t_{\mathrm{end}}$ specifies the upper boundary
    of the temporal domain over which a plasma simulation is advanced. Together with
    [simulation_start_time](name:simulation_start_time), it defines the total simulated
    duration $\Delta t = t_{\mathrm{end}} - t_{\mathrm{start}}$, which governs the
    extent of physical phenomena that can be captured. In multi-step workflows, $t_{\mathrm{end}}$
    may correspond to the end of a single workflow execution segment rather than the
    full pulse duration; the distinction from [simulation_restart_time](name:simulation_restart_time)
    is that the end time terminates advancement whereas a restart time resumes it.
    The [simulation_time_step](name:simulation_time_step) $\Delta t_{\mathrm{step}}$
    determines how many computational steps are taken to span the interval $[t_{\mathrm{start}},
    t_{\mathrm{end}}]$. Typical values range from milliseconds for fast MHD simulations
    to tens of seconds for transport-timescale calculations, depending on the physics
    resolved.


    Sign convention: Positive when the simulation end time is later than the reference
    origin of the simulation time axis (i.e., $t_{\mathrm{end}} > 0$ for runs starting
    after the time origin).'
  unit: s
  physics_domain: computational_workflow
  links:
  - name:simulation_start_time
  - name:simulation_restart_time
  - name:simulation_time_step
  constraints: []
  sources:
  - id: dd:numerics/time_end
    dd_path: numerics/time_end
    status: composed
  - id: dd:summary/simulation/time_end
    dd_path: summary/simulation/time_end
    status: composed
