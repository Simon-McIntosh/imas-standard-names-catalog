- name: x2_coordinate_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Signed coordinate of a hard X-ray detector outline vertex along the
    X2 axis in the detector-local Cartesian (X1, X2) frame.
  documentation: 'The X2 coordinate of a hard X-ray detector is the signed position
    of a detector-outline vertex along the second axis of the detector-local Cartesian
    $(X_1, X_2)$ frame. Together with the companion x1_coordinate_of_hard_xray_detector,
    it defines the detector outline in the local plane; the value is relative to the
    detector-local origin and axis orientation, not to an absolute machine position.


    For a vertex displacement from the detector-local origin, the coordinate is the
    scalar projection onto the local X2 direction:


    $$

    x_2 = \Delta \mathbf{r}_v \cdot \hat{\mathbf{e}}_2

    $$


    where $x_2$ is the X2 coordinate in meters, $\Delta \mathbf{r}_v$ is the vector
    from the detector-local origin to the vertex in meters, and $\hat{\mathbf{e}}_2$
    is the dimensionless unit vector along the positive X2 axis of the detector-local
    Cartesian $(X_1, X_2)$ frame.


    In practice, X2 vertex coordinates are obtained from the detector mechanical design,
    survey information, or geometry model. Paired with X1 coordinates, they specify
    the polygonal detector outline used in geometric area, etendue, and sight-line
    acceptance calculations. The same local-outline concept is used for related diagnostic
    aperture and detector coordinates such as [x2_coordinate_of_diagnostic_aperture](name:x2_coordinate_of_diagnostic_aperture)
    and [x2_coordinate_of_soft_xray_detector](name:x2_coordinate_of_soft_xray_detector).


    Typical magnitudes are set by the physical detector face and the chosen local
    origin. Compact hard-X-ray detector outlines are often millimeter-to-centimeter
    scale, with representative coordinate magnitudes around 0.001-0.1 m; exact values
    are device-specific and may be positive or negative within the local outline.


    Sign convention: Positive when the vertex displacement from the detector-local
    origin has a component in the positive X2 direction of the detector-local Cartesian
    $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:hard_x_rays/channel/detector/outline/x2
    dd_path: hard_x_rays/channel/detector/outline/x2
    status: composed
- name: x2_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: Coordinate of a point on an optical element measured along the second
    axis of the element's local planar (X1, X2) frame. It is the signed in-plane displacement
    from the local origin resolved on the X2 basis direction.
  documentation: 'The x2 coordinate of an optical element is the signed distance,
    within the element''s local plane, from the element''s local origin to a specified
    point resolved along the second local in-plane axis. The coordinate is defined
    in a local planar $(X_1,X_2)$ frame with origin $O$ and basis $(\hat{\mathbf{X}}_1,\hat{\mathbf{X}}_2)$
    attached to the optical element, rather than in a global laboratory frame.


    For an orthonormal local planar basis, the coordinate is the projection of the
    point displacement onto the second basis direction:


    $$

    x_2 = (\mathbf{r}-\mathbf{r}_O) \cdot \hat{\mathbf{X}}_2

    $$


    where $\mathbf{r}$ is the position vector of the point, $\mathbf{r}_O$ is the
    position vector of the local origin, and $\hat{\mathbf{X}}_2$ is the unit vector
    along the local $X_2$ axis.


    In practice, this coordinate is obtained from mechanical drawings, optical metrology,
    or calibration fits by expressing measured point positions in the element''s local
    planar $(X_1,X_2)$ frame. The same definition applies whether the point represents
    a fiber center, an aperture-outline vertex, a detector-face point, or another
    geometrical feature of an optical component.


    There is no universal physical range because the value is set by the transverse
    size of the particular optical element and by the chosen local origin. Meaningful
    values normally lie within the element''s active or mechanical aperture; compact
    diagnostic optics may have absolute coordinates of order $10^{-4}$-$10^{-1}$ m,
    while larger optical elements can extend beyond this range.


    Sign convention: Positive when the displacement from the local origin to the point
    has a component in the $+\hat{\mathbf{X}}_2$ direction of the optical element''s
    local planar $(\hat{\mathbf{X}}_1,\hat{\mathbf{X}}_2)$ basis.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x1_coordinate_of_optical_element
