- name: squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient for nested magnetic flux surfaces,
    measuring corner deviation from a reference ellipse; positive values indicate
    a boxy super-elliptical shape and negative values a concave diamond-like shape.
  documentation: 'The squareness of a flux surface is a dimensionless geometric shape
    parameter, following Luce (Plasma Phys. Control. Fusion 55, 095009, 2013), that
    characterizes the corner geometry of nested poloidal cross-sections. The coefficient
    $\zeta$ quantifies the deviation of each quadrant of the flux-surface contour
    from a co-centered reference ellipse: $\zeta > 0$ corresponds to a super-elliptical
    (boxy) corner that bulges outward relative to the reference ellipse, while $\zeta
    < 0$ characterizes a sub-elliptical (diamond-like or concave) corner.


    Resolved by machine side, this general quantity separates into [inner_squareness_of_flux_surface](name:inner_squareness_of_flux_surface),
    capturing the high-field-side (inboard) corners, and [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface),
    capturing the low-field-side (outboard) corners. A finer decomposition into four
    independent quadrant coefficients is available through dedicated names such as
    [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)
    and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface).


    Squareness profiles are determined from equilibrium reconstruction by fitting
    a parameterized boundary shape to magnetic diagnostic measurements. Typical magnitudes
    range from approximately $-0.5$ to $+0.5$ in tokamak operation; the sign and spatial
    distribution of corner squareness influence edge stability margins and divertor
    geometry. The quantity complements [elongation_of_flux_surface](name:elongation_of_flux_surface)
    and the general coefficient_of_flux_surface in the complete parameterization of
    nested flux-surface geometry.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_flux_surface
  - name:outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  - name:elongation_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_upper_outer
    dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_outer
    status: composed
  - id: derived:squareness_of_flux_surface
    status: composed
- name: inner_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce shape coefficient quantifying how much the high-field-side
    (inner) corners of a nested magnetic flux surface deviate from a reference ellipse;
    positive values indicate a boxier corner, negative values a more diamond-like
    or indented corner.
  documentation: 'The inner squareness of a flux surface is the dimensionless Luce
    (2013) shape coefficient that characterizes how much the high-field-side (inboard,
    smaller major radius) corners of a nested toroidal magnetic flux surface depart
    from a reference ellipse sharing the same center, horizontal half-width, and [elongation](name:elongation_of_flux_surface).
    It is the inboard counterpart within the [squareness_of_flux_surface](name:squareness_of_flux_surface)
    family, complementing the outboard variants [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)
    and [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface).
    This parent quantity abstracts over the quadrant-resolved coefficients [upper_inner_squareness_of_flux_surface](name:upper_inner_squareness_of_flux_surface)
    and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),
    which independently describe the upper and lower high-field-side corners.


    The coefficient $\zeta$ enters the parametric flux-surface shape model as an additional
    harmonic beyond elongation $\kappa$ and triangularity $\delta$, evaluated at the
    high-field-side corners of the poloidal cross-section in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. A
    value of zero recovers the reference ellipse precisely; deviations capture corner
    shaping not expressible through $\kappa$ and $\delta$ alone.


    The inner squareness is inferred from equilibrium reconstruction by fitting closed
    flux-surface contours to a multi-parameter shape model. Asymmetry between upper
    and lower inner quadrants can arise in vertically asymmetric or diverted configurations,
    motivating the quadrant-resolved child quantities.


    Sign convention: Positive when the high-field-side corner of the flux-surface
    cross-section extends outward beyond the reference ellipse (boxy shape); negative
    when the corner is indented inward relative to the reference ellipse (diamond-like
    shape).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  arguments:
  - name: squareness_of_flux_surface
    operator: inner
    operator_kind: qualifier
- name: lower_inner_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient zeta_li for the lower high-field-side
    quadrant of a nested magnetic flux surface, relative to a reference ellipse with
    the same center, horizontal half-width, and elongation. It quantifies the quadrant's
    non-elliptical flattening, boxiness, or indentation.
  documentation: 'Lower inner squareness of a flux surface is the dimensionless Luce
    coefficient $\zeta_\mathrm{li}$ for the quadrant that is both on the high-field
    side and below the flux-surface center in the right-handed cylindrical $(R,\phi,Z)$
    frame. The qualifier lower is relative to the surface center, not to an absolute
    condition such as $Z<0$. The reference shape is an ellipse with the same center,
    horizontal half-width, and elongation as the flux surface; the coefficient measures
    the residual non-elliptical deformation of that quadrant.


    In the Luce quadrant construction, the signed departure from the reference ellipse
    may be written as


    $$

    \Delta_\perp(\theta) = a\,\zeta_\mathrm{li}\,\sin^2(2\theta)

    $$


    where $\Delta_\perp(\theta)$ is the normal displacement from the reference ellipse
    to the flux surface in meters, positive along the outward normal of the ellipse,
    $a$ is the horizontal half-width in meters, $\zeta_\mathrm{li}$ is dimensionless,
    and $\theta$ is a dimensionless parametric segment angle in radians. For the lower-inner
    segment, $\theta$ runs from the inner midplane point to the lower vertical extremum;
    the reference ellipse has center $(R_c,Z_c)$ in meters, horizontal half-width
    $a$ in meters, and dimensionless elongation $\kappa$, and may be written on this
    segment as $R_\mathrm{ell}=R_c-a\cos\theta$ and $Z_\mathrm{ell}=Z_c-\kappa a\sin\theta$
    in the right-handed cylindrical $(R,\phi,Z)$ frame. A zero coefficient corresponds
    to an exactly elliptical lower-inner quadrant for this reference ellipse.


    The coefficient is obtained from an equilibrium reconstruction by tracing the
    selected nested flux surface, determining its center, horizontal half-width, and
    elongation, constructing the reference ellipse, and fitting the Luce form over
    only the lower-inner segment. It separates local boxiness or indentation of the
    lower high-field-side quadrant from global elongation and triangularity.


    Typical values are close to 0 for nearly elliptical core surfaces, commonly within
    -0.1 to 0.1. Strongly shaped edge or boundary surfaces often lie within -0.3 to
    0.3, with larger magnitudes indicating pronounced local squaring or indentation.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  arguments:
  - name: inner_squareness_of_flux_surface
    operator: lower
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_lower_inner
    dd_path: equilibrium/time_slice/profiles_1d/squareness_lower_inner
    status: composed
- name: outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the outboard corners
    of nested magnetic flux surfaces, measuring departure from a co-centered reference
    ellipse; abstracts over both upper-outer and lower-outer quadrants in the poloidal
    cross-section.
  documentation: "The outer squareness of a flux surface is the Luce (2013) dimensionless\
    \ shape coefficient that quantifies how much the outboard (low-field-side, larger-$R$)\
    \ corners of a poloidal cross-section deviate from a reference ellipse sharing\
    \ the same geometric center, horizontal half-width, and elongation. It is a component\
    \ of the [squareness_of_flux_surface](name:squareness_of_flux_surface) family,\
    \ restricted to the outer ($R > R_\\text{geo}$) portion of the cross-section defined\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius,\
    \ $\\phi$ is toroidal angle, and $Z$ is vertical height.\n\nBecause a flux surface\
    \ has two outboard corners \u2014 one above and one below the magnetic midplane\
    \ \u2014 this quantity generalizes over both: in up-down symmetric equilibria\
    \ the upper-outer and lower-outer values coincide, whereas in asymmetric configurations\
    \ (such as single-null divertor plasmas) they differ and are resolved individually\
    \ as [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface)\
    \ and [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface).\
    \ The squareness is evaluated at a reference corner angle of approximately $45\xB0\
    $ within each outer quadrant, measuring the signed displacement of the actual\
    \ flux-surface contour from the reference ellipse normalized by the local ellipse\
    \ scale.\n\nOuter squareness is inferred from equilibrium reconstruction by fitting\
    \ an analytic shape parameterization to magnetic diagnostic data and extracting\
    \ the Luce shape coefficients. It complements [upper_inner_squareness_of_flux_surface](name:upper_inner_squareness_of_flux_surface)\
    \ and [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),\
    \ which characterize the inboard (high-field-side) corners. Typical magnitudes\
    \ in H-mode tokamak plasmas satisfy $|\\zeta_o| \\lesssim 0.2$, with positive\
    \ values corresponding to box-like protrusions beyond the reference ellipse and\
    \ negative values to inward-indented, star-shaped cross-sections.\n\nSign convention:\
    \ Positive when the outboard corner of the flux surface extends beyond the reference\
    \ ellipse (box-like cross-section), and negative when the corner is indented inward\
    \ relative to the reference ellipse (diamond-like or star-shaped cross-section)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:squareness_of_flux_surface
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_outer_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  arguments:
  - name: squareness_of_flux_surface
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_upper_outer
    dd_path: equilibrium/time_slice/profiles_1d/squareness_upper_outer
    status: composed
- name: lower_outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the lower outer quadrant
    of each flux surface, measuring the deviation of that corner from a reference
    ellipse sharing the same center, horizontal half-width, and elongation.
  documentation: "The lower outer squareness $\\zeta_{lo}$ is the quadrant-specific\
    \ Luce (2013) shape parameter describing how the lower outboard corner of a poloidal\
    \ flux-surface cross-section departs from a reference ellipse sharing the same\
    \ center, horizontal half-width $a$, and elongation $\\kappa$. As one of four\
    \ independent corner squareness coefficients, it captures asymmetries \u2014 both\
    \ up-down and in-out \u2014 that a single symmetric squareness value cannot resolve.\n\
    \nIn the Luce parametric form, the lower outer quadrant shape is governed by:\n\
    \n$$\nZ(\\theta) = Z_0 + a\\,\\kappa\\sin\\!\\bigl(\\theta + \\zeta_{lo}\\sin\
    \ 2\\theta\\bigr)\n$$\n\nwhere $\\theta \\in (-\\pi/2,\\,0)$ parameterizes the\
    \ lower outer quadrant, $Z_0$ is the geometric center height of the flux surface,\
    \ $a$ is the horizontal minor half-width, and $\\kappa$ is the local [elongation_of_flux_surface](name:elongation_of_flux_surface).\
    \ Setting $\\zeta_{lo} = 0$ recovers a pure ellipse in that quadrant.\n\nThis\
    \ quantity is obtained from equilibrium reconstruction by fitting the Luce parametric\
    \ contour to each nested flux surface computed from magnetics and internal measurements.\
    \ At the outermost closed flux surface the value reduces to [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary).\
    \ The upper-outer analog is [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface),\
    \ the lower inner counterpart is [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),\
    \ and the up-down symmetric outer combination is [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface).\n\
    \nSign convention: Positive when the lower outer corner of the flux-surface cross-section\
    \ bulges outward beyond the reference ellipse, increasing the cross-sectional\
    \ area of the lower outer quadrant relative to the elliptic baseline."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:lower_outer_squareness_of_plasma_boundary
