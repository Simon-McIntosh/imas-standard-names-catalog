        of the vaccuum chamber.
      kind: template
- name: total_particle_source_rate_at_wall_due_to_gas_injection
  kind: scalar
  status: active
  description: Total rate at which neutral particles are supplied through wall gas-injection
    sources, summed over the included injection channels and particle species.
  documentation: 'This quantity is the incoming neutral-particle source rate produced
    by gas injection at the wall. It represents injected particles, not particles
    recycled from or incident on the wall.


    The total rate is defined by


    $$

    \dot{N}_{\mathrm{wall,gas}}(t)=\sum_i \dot{N}_i(t)

    $$


    where $\dot{N}_{\mathrm{wall,gas}}$ is the total wall gas-injection particle source
    rate, and $\dot{N}_i$ is the injection rate for included particle species and
    gas-injection sources indexed by $i$. The aggregation uses particle counts on
    the selected species basis and does not apply charge-state or electron-equivalent
    weighting.


    This incoming source is distinct from the [neutral particle flux at the wall](name:neutral_particle_flux_at_wall),
    which describes particles arriving at the wall per unit area, and from the [total
    gas source rate at the midplane due to gas injection](name:total_gas_source_rate_at_midplane_due_to_gas_injection),
    which has a different injection locus.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:neutral_particle_flux_at_wall
  - name:total_gas_source_rate_at_midplane_due_to_gas_injection
  sources:
  - dd_path: wall/global_quantities/electrons/gas_puff
    dd_version: 4.1.0
