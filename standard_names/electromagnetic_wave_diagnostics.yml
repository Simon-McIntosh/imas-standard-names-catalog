    dd_path: ece/channel/beam_tracing/beam/wave_vector/k_phi_norm
    status: attached
  - id: dd:ece/channel/beam_tracing/beam/wave_vector/k_tor_norm
    dd_path: ece/channel/beam_tracing/beam/wave_vector/k_tor_norm
    status: attached
