    enhanced_context:
      description: Line-averaged electron density (ne), the electron density averaged
        along a representative chord through the plasma. A standard global density
        measure used for density feedback control and confinement scaling.
      kind: template
- name: normalized_poloidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: active
  description: Dimensionless radial label that maps a physical measurement position
    to a nested magnetic surface using the square root of normalized poloidal magnetic
    flux.
  documentation: 'The normalized poloidal flux coordinate at a measurement position
    assigns the physical point to a nested closed magnetic surface through its radial
    position between the magnetic axis and the last closed flux surface. It is the
    pointwise value of the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)
    at that measurement location.


    The defining normalization is


    $$

    \rho_{\mathrm{pol,norm}}(\mathbf{x}_{\mathrm{meas}})=\sqrt{\frac{\psi(\mathbf{x}_{\mathrm{meas}})-\psi_{\mathrm{axis}}}{\psi_{\mathrm{LCFS}}-\psi_{\mathrm{axis}}}}

    $$


    where $\rho_{\mathrm{pol,norm}}$ is the normalized poloidal flux coordinate, $\mathbf{x}_{\mathrm{meas}}$
    is the physical measurement position, $\psi(\mathbf{x}_{\mathrm{meas}})$ is the
    poloidal magnetic flux at that position, $\psi_{\mathrm{axis}}$ is the poloidal
    magnetic flux at the magnetic axis, and $\psi_{\mathrm{LCFS}}$ is the poloidal
    magnetic flux at the last closed flux surface.


    This quantity applies to one physical measurement position and has no population
    or region aggregation: it is evaluated pointwise rather than averaged along a
    path or over a region. It is a normalized surface label, not a poloidal magnetic-flux
    value or a toroidal-flux coordinate.


    The transformation preserves the parent coordinate''s normalization: it is zero
    at the magnetic axis and one at the last closed flux surface, with intermediate
    values identifying nested surfaces between those boundaries.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: reflectometer_fluctuation/channel/doppler/position/rho_pol_norm
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/reflectometer_fluctuation.html#reflectometer_fluctuation-channel-doppler-position-rho_pol_norm
    dd_documentation:
      leaf: Normalised poloidal flux coordinate = sqrt((psi(rho)-psi(magnetic_axis))
        / (psi(LCFS)-psi(magnetic_axis)))
      parent_path: reflectometer_fluctuation/channel/doppler/position
      parent: Measurement position
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - reflectometer_fluctuation/channel/doppler/time
    enhanced_context:
      description: "Normalised poloidal flux coordinate (\u03C1_pol_norm = sqrt((\u03C8\
        \u2212\u03C8_axis)/(\u03C8_LCFS\u2212\u03C8_axis))) of the Doppler reflectometer\
        \ measurement position. Maps the backscattering location to a flux surface\
        \ coordinate."
      kind: llm
  - dd_path: reflectometer_fluctuation/channel/fluctuations_level/position/rho_pol_norm
