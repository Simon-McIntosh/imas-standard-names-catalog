- name: radial_coordinate_of_current_center
  kind: scalar
  status: active
  description: Major-radius coordinate of the plasma-current centroid, obtained by
    normalizing the toroidal-current first moment over the poloidal plasma cross-section
    by total plasma current.
  documentation: 'The radial coordinate of the current center is the major-radius
    location of the centroid of the toroidal plasma-current distribution. It identifies
    a current-weighted position and is distinct from the geometric centroid or the
    magnetic axis.


    The coordinate is defined by the toroidal-current first moment:


    $$

    R_c = \frac{\displaystyle\int_{D_p} R\,j_\phi\,dS}{I_p}

    $$


    where $R_c$ is the major-radius coordinate of the current center, $R$ is the major-radius
    coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame, $j_\phi$ is the
    toroidal component of the plasma [current density](name:current_density), $dS$
    is an element of poloidal cross-sectional area, $D_p$ is the plasma current-carrying
    poloidal cross-section, and $I_p$ is the total toroidal plasma current, equal
    to the corresponding integral of $j_\phi$ over $D_p$.


    The quantity applies to the full plasma-current distribution and uses a current-weighted
    first-moment aggregation over the poloidal cross-section. It excludes weighting
    by particle density, pressure, magnetic-field strength, or geometric area alone;
    the resulting position is therefore not a generic geometric center.


    This quantity is a locus-specific instance of the general [radial coordinate](name:radial_coordinate),
    evaluated at the current center. Its vertical counterpart, [vertical coordinate
    of the current center](name:vertical_coordinate_of_current_center), supplies the
    corresponding vertical position needed to locate the current centroid in the cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-current_centre-r
    dd_documentation:
      leaf: Major radius of the current center, defined as integral over the poloidal
        cross section of (j_tor*r*dS) / Ip
      parent_path: equilibrium/time_slice/global_quantities/current_centre
      parent: Position and vertical velocity of the current centre
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of current centre.
      kind: template
- name: radial_coordinate_of_dr_dz_zero_point
  kind: scalar
  status: active
  description: "Radial coordinate of the dR/dZ zero point is the R coordinate, in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame, of a plasma-boundary or separatrix\
    \ point where R is locally stationary with respect to Z."
  documentation: 'Radial coordinate of the dR/dZ zero point is the $R$ coordinate,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, of a specified point on
    a plasma-boundary or separatrix contour where $R$ is locally stationary with respect
    to $Z$. In this frame, $R$ is major radius measured from the toroidal symmetry
    axis, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The coordinate is defined by the stationary-radius condition on the specified
    contour:


    $$

    R_{\mathrm{dR/dZ=0}} = R(P_0), \qquad \left.\frac{dR}{dZ}\right|_{C,P_0} = 0

    $$


    where $R_{\mathrm{dR/dZ=0}}$ is the radial coordinate of the dR/dZ zero point,
    $P_0$ is the specified dR/dZ zero point, $C$ is the plasma-boundary or separatrix
    contour on which $P_0$ lies, $R(P_0)$ is the major-radius coordinate of $P_0$,
    $Z$ is the vertical-height coordinate, and $dR/dZ$ is the derivative of the contour
    coordinate $R$ with respect to $Z$ along $C$.


    The scope is a single specified geometric point on the contour; the value is not
    an average over the contour, over toroidal angle $\phi$, or over all stationary
    points. If several points on the contour satisfy $dR/dZ=0$, the definition does
    not by itself impose an inboard, outboard, upper, or lower selection rule; each
    specified zero point has its own radial-coordinate value.


    This quantity is only the cylindrical $R$ coordinate of the point, not a flux-surface-normal
    displacement or a flux-label coordinate. Together with the [vertical coordinate
    of the dR/dZ zero point], it locates the point in the poloidal $(R, Z)$ cross-section
    at fixed $\phi$ of the right-handed cylindrical $(R, \phi, Z)$ frame. It is distinct
    from the [radial coordinate of an X-point](name:radial_coordinate_of_x_point),
    which locates a magnetic null on a separatrix rather than a radial extremum of
    a boundary or separatrix contour.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_x_point
  sources:
  - dd_path: equilibrium/time_slice/boundary/dr_dz_zero_point/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-dr_dz_zero_point-r
    dd_documentation:
      leaf: Major radius
      parent_path: equilibrium/time_slice/boundary/dr_dz_zero_point
      parent: 'Outboard point on the separatrix on which dr/dz = 0 (local maximum
        of the major radius of the separatrix). In case of multiple local maxima,
        the closest one from z=z_magnetic_axis is chosen. '
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of dr dz zero point.
      kind: template
- name: radial_coordinate_of_geometric_axis
  kind: scalar
  status: active
  description: Major-radius coordinate locating the midpoint of the plasma boundary's
    radial extrema, thereby specifying the horizontal position of its geometric axis.
  documentation: 'The radial coordinate of the geometric axis is the major-radius
    position of the plasma cross-section''s geometric center, defined from the extrema
    of the plasma boundary in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The geometric-axis coordinate is defined by


    $$

    R_{\mathrm{geo}} = \frac{R_{\max} + R_{\min}}{2}

    $$


    where $R_{\mathrm{geo}}$ is the major-radius coordinate of the geometric axis,
    and $R_{\max}$ and $R_{\min}$ are the maximum and minimum major-radius coordinates
    of the plasma boundary, respectively.


    This quantity applies specifically to the geometric axis of the plasma cross-section
    and uses the midpoint aggregation of the boundary''s radial extrema. It is distinct
    from the [radial_coordinate](name:radial_coordinate) of an arbitrary point or
    reference position and from the radial coordinate of the magnetic axis; its vertical
    counterpart is the [vertical coordinate of the geometric axis](name:vertical_coordinate_of_geometric_axis).'
  unit: m
  physics_domain: equilibrium
