- name: deuterium_density_at_limiter
  kind: scalar
  status: active
  description: Deuterium ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, evaluated on the plasma side of the magnetic
    presheath or sheath entrance.
  documentation: "Deuterium density at a limiter is the local number density of deuterium\
    \ ions in the boundary plasma immediately adjacent to a plasma-facing limiter\
    \ surface. The evaluation point is on the plasma side of the magnetic presheath\
    \ or sheath entrance, where open scrape-off-layer field lines terminate on the\
    \ limiter material. Because deuterium carries only a single ionization state ($\\\
    mathrm{D}^+$, charge number $Z = 1$), no charge-state summation is required, in\
    \ contrast to impurity-species counterparts such as [carbon_density_at_limiter](name:carbon_density_at_limiter)\
    \ or [argon_density_at_limiter](name:argon_density_at_limiter).\n\nThis density,\
    \ together with [electron_temperature_at_limiter](name:electron_temperature_at_limiter),\
    \ determines the ion saturation current flux to the limiter and governs local\
    \ deuterium recycling and redeposition. In two-point model analyzes of the scrape-off\
    \ layer, the limiter-side density is linked to the upstream separatrix density\
    \ through parallel momentum and energy balance along magnetic field lines, with\
    \ the Bohm sheath criterion $v_s = c_s = \\sqrt{(T_e + T_i)/m_i}$ setting the\
    \ flow speed at the sheath entrance, where $T_e$ and $T_i$ are the electron and\
    \ ion temperatures and $m_i$ is the deuterium ion mass.\n\nMeasurement methods\
    \ include flush-mounted Langmuir probes that yield the ion saturation current\
    \ density from which the density is extracted, spectroscopic observation of deuterium\
    \ Balmer emission combined with collisional-radiative modeling, and edge transport\
    \ simulations constrained by upstream density profiles. Representative scrape-off-layer\
    \ values at the limiter span $10^{17}$\u2013$10^{19}$ m$^{-3}$, depending on global\
    \ plasma density, fueling, and limiter geometry.\n\nAs a member of the [density_at_limiter](name:density_at_limiter)\
    \ parent family, this quantity complements the tritium fuel-ion counterpart [tritium_density_at_limiter](name:tritium_density_at_limiter)\
    \ and [hydrogen_density_at_limiter](name:hydrogen_density_at_limiter). The corresponding\
    \ quantity at the magnetic separatrix is [deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary)."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:carbon_density_at_limiter
  - name:argon_density_at_limiter
  - name:electron_temperature_at_limiter
  - name:density_at_limiter
  - name:tritium_density_at_limiter
  - name:hydrogen_density_at_limiter
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
    operator: deuterium
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/n_i/deuterium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-n_i-deuterium-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/limiter/n_i/deuterium
      parent: Deuterium
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Deuterium.
      kind: template
- name: deuterium_tritium_density_at_limiter
  kind: scalar
  status: active
  description: Number density of the deuterium-tritium fuel pseudo-species in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface, equal
    to the sum of the local deuterium and tritium ion densities.
  documentation: 'Deuterium-tritium density at the limiter is the local number density
    of the combined DT fuel ion pseudo-species in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface, evaluated on the plasma side of the
    magnetic presheath or sheath entrance. The DT pseudo-species represents deuterium
    and tritium ions as a single fictitious fuel constituent with an effective per-ion
    mass of $\bar{m} \approx 2.5\,m_u$ (where $m_u$ is the unified atomic mass unit)
    for an equimolar D-T mixture.


    The quantity equals the sum of the separate deuterium and tritium ion densities
    at the limiter contact point:


    $$

    n_{DT} = n_D + n_T

    $$


    where $n_D$ is the local deuterium ion number density and $n_T$ is the local tritium
    ion number density at the same evaluation point.


    This quantity is the limiter-contact analog of [deuterium_tritium_density](name:deuterium_tritium_density)
    and the DT-fuel counterpart of [deuterium_density_at_limiter](name:deuterium_density_at_limiter)
    at the same locus. It differs from [deuterium_tritium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary)
    in evaluation geometry: the limiter contact lies in the scrape-off layer on open
    field lines, not at the last-closed flux surface. As a member of the [density_at_limiter](name:density_at_limiter)
    parent family, the presheath evaluation convention and locus definition follow
    those of [electron_density_at_limiter](name:electron_density_at_limiter) and other
    sibling fuel-species densities.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:deuterium_tritium_density
  - name:deuterium_density_at_limiter
  - name:flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary
  - name:density_at_limiter
  - name:electron_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: deuterium_tritium
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/n_i/deuterium_tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-n_i-deuterium_tritium-value
    dd_documentation:
