- name: magnetic_shear_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Normalized logarithmic derivative of the safety factor with respect
    to normalized toroidal flux radius, evaluated at the internal transport barrier
    location.
  documentation: "The magnetic shear at the internal transport barrier is the normalized\
    \ logarithmic derivative of the safety factor $q$ with respect to the normalized\
    \ toroidal flux radius $\\rho_{tor}$, evaluated at the radial position of the\
    \ internal transport barrier. The sign and magnitude of this quantity govern the\
    \ stability of microinstabilities at the barrier, with reversed (negative) shear\
    \ strongly associated with ITB formation in advanced tokamak scenarios.\n\nThe\
    \ defining relation is:\n\n$$\ns = \\frac{\\rho_{tor}}{q} \\frac{dq}{d\\rho_{tor}}\n\
    $$\n\nwhere $q$ is the safety factor \u2014 the number of toroidal field-line\
    \ transits per single poloidal circuit \u2014 and $\\rho_{tor}$ is the normalized\
    \ toroidal flux radius, equal to zero at the magnetic axis and unity at the last\
    \ closed flux surface.\n\nThe safety-factor profile needed to evaluate this quantity\
    \ is obtained from equilibrium reconstruction, often constrained by motional Stark\
    \ effect polarimetry or Faraday rotation measurements resolving the internal $q$-profile.\
    \ The full radial context is provided by the [magnetic shear](name:magnetic_shear_at_pedestal)\
    \ profile; analogous point evaluations are defined at [the magnetic axis](name:magnetic_shear_at_magnetic_axis)\
    \ and [the pedestal top](name:magnetic_shear_at_pedestal).\n\nIn reversed-shear\
    \ configurations the value is negative near the $q$-minimum, commonly ranging\
    \ from $-2$ to $0$; in conventional positive-shear ITB scenarios values are small\
    \ and positive, in the range $0$ to $1$.\n\nSign convention: Positive when the\
    \ safety factor $q$ increases with the normalized toroidal flux radius $\\rho_{tor}$,\
    \ i.e., when $dq/d\\rho_{tor} > 0$."
  unit: '1'
  physics_domain: transport
  links:
  - name:magnetic_shear_at_pedestal
  - name:magnetic_shear_at_magnetic_axis
  sources:
  - id: dd:summary/local/itb/magnetic_shear/value
    dd_path: summary/local/itb/magnetic_shear/value
    status: composed
- name: neutral_source_rate
  kind: scalar
  status: draft
  description: Net volumetric production rate of neutral particles, equal to creation
    minus loss processes per unit volume. It enters the neutral particle density balance
    as a source term, with positive values representing a net gain of neutral particles.
  documentation: 'Neutral source rate is the local net rate at which neutral particles
    of a given species are produced or removed by atomic, molecular, and plasma interaction
    processes. It represents creation minus loss per unit physical volume and directly
    changes the neutral number density.


    A common local neutral continuity equation is


    $$

    \frac{\partial n_n}{\partial t} + \nabla \cdot \left(n_n \mathbf{u}_n\right) =
    S_n

    $$


    where $n_n$ is the neutral number density in $\mathrm{m}^{-3}$, $\mathbf{u}_n$
    is the neutral flow velocity in $\mathrm{m}\,\mathrm{s}^{-1}$, and $S_n$ is the
    neutral source rate in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$. The equation is coordinate
    independent; when expressed in the IMAS cylindrical $(R, \phi, Z)$ frame, $S_n$
    is the net rate per physical volume at position $(R, \phi, Z)$.


    In practice, $S_n$ is computed from neutral transport and collisional-radiative
    models using rates for ionization, recombination, charge exchange, molecular dissociation,
    recycling, gas fueling, pellet ablation, and neutral beam deposition when relevant.
    It can also be constrained indirectly by particle balance, spectroscopy, pressure
    gages, and neutral particle diagnostics, with volume or flux-surface averaging
    applied only after the local volumetric rate has been defined.


    Typical magnitudes vary strongly with plasma region and fueling conditions: core
    values with weak neutral penetration may be $10^{16}$-$10^{20}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$,
    edge and scrape-off-layer recycling regions are commonly $10^{20}$-$10^{23}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$,
    and highly localized pellet, gas-puff, or beam-related sources can locally exceed
    $10^{24}\ \mathrm{m}^{-3}\,\mathrm{s}^{-1}$.


    Sign convention: Positive when the net processes add neutral particles to the
    neutral population, increasing the neutral number density.'
  unit: m^-3.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_sources/source/profiles_1d/neutral/particles
    dd_path: core_sources/source/profiles_1d/neutral/particles
    status: composed
  - id: dd:edge_sources/source/ggd/neutral/particles/values
    dd_path: edge_sources/source/ggd/neutral/particles/values
    status: attached
  - id: dd:plasma_sources/source/ggd/neutral/particles/values
    dd_path: plasma_sources/source/ggd/neutral/particles/values
    status: attached
