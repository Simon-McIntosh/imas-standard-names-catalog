- name: maximum_force_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Upper allowable value of a signed electromagnetic force resultant for
    a poloidal-field coil, with magnitude and sign defined by one force-combination-matrix
    row.
  documentation: 'Maximum force of a poloidal-field coil is the upper allowable value
    of a signed electromagnetic force resultant acting on the coil. It bounds the
    resultant derived from radial and vertical Lorentz-force components and is distinct
    from the actual [force of a poloidal-field coil](name:force_of_poloidal_field_coil).


    For matrix row $m$, the associated force resultant is defined by


    $$

    F_m = a_m F_R + b_m F_Z

    $$


    where $F_R$ is the [radial force of a poloidal-field coil](name:radial_force_of_poloidal_field_coil),
    $F_Z$ is the [vertical force of a poloidal-field coil](name:vertical_force_of_poloidal_field_coil),
    and $a_m$ and $b_m$ are the row-specific force-combination weights. The maximum-force
    quantity is the upper allowable value assigned to the selected resultant; it is
    not a separate Lorentz-force component.


    Sign convention: Positive when the weighted combination of outward radial force
    and upward vertical force, resolved in the right-handed cylindrical $(R, \phi,
    Z)$ frame, is positive.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:force_of_poloidal_field_coil
  - name:radial_force_of_poloidal_field_coil
  - name:vertical_force_of_poloidal_field_coil
  arguments:
  - name: force_of_poloidal_field_coil
    operator: maximum
    operator_kind: qualifier
  sources:
  - dd_path: pf_active/force_limits/limit_max
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-force_limits-limit_max
    dd_documentation:
      leaf: Maximum force limit, for each limit (line of the combination matrix).
        EMPTY_FLT value means unbounded
      parent_path: pf_active/force_limits
      parent: Description of force limits on the axisymmetric PF coil system
      data_type: FLT_1D
      unit: N
      coordinates:
      - 1...N
    enhanced_context:
      description: Maximum force limit for each constraint in the PF coil force combination
        matrix. An unbounded limit is indicated by the EMPTY_FLT sentinel value. Used
        in coil current optimisation to enforce structural integrity of the PF system.
      kind: llm
- name: minimum_force_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Lower allowable value of a signed electromagnetic force resultant for
    poloidal-field coils, with its magnitude and sign defined by one row of the force-combination
    matrix.
  documentation: 'Minimum force of a poloidal-field coil is the lower allowable value
    of a signed electromagnetic force resultant acting on the poloidal-field coil
    system. Each row of the force-combination matrix defines one resultant by weighting
    the radial and vertical components of the [force of a poloidal-field coil](name:force_of_poloidal_field_coil).


    For combination row $k$, the resultant is defined by


    $$

    F_{\mathrm{comb},k}=w_{kR}F_R+w_{kZ}F_Z

    $$


    where $F_R$ and $F_Z$ are the radial and vertical electromagnetic-force components,
    $w_{kR}$ and $w_{kZ}$ are the row weights, and $k$ identifies the combination
    row. The minimum value satisfies $F_{\min,k}\leq F_{\mathrm{comb},k}$ for the
    applicable row. Unlike the [maximum force of a poloidal-field coil](name:maximum_force_of_poloidal_field_coil),
    this quantity specifies the lower structural bound rather than the upper bound.


    Sign convention: Positive when the vertical force component is directed upward
    along $+Z$ and the radial force component is directed outward along increasing
    major radius $R$.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:force_of_poloidal_field_coil
  - name:maximum_force_of_poloidal_field_coil
  arguments:
  - name: force_of_poloidal_field_coil
    operator: minimum
    operator_kind: qualifier
  sources:
  - dd_path: pf_active/force_limits/limit_min
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-force_limits-limit_min
    dd_documentation:
      leaf: Minimum force limit, for each limit (line of the combination matrix).
        EMPTY_FLT value means unbounded
      parent_path: pf_active/force_limits
      parent: Description of force limits on the axisymmetric PF coil system
      data_type: FLT_1D
      unit: N
      coordinates:
      - pf_active/force_limits/limit_max
    enhanced_context:
      description: Minimum allowable force on the poloidal field (PF) coil system
        for each constraint defined in the force combination matrix. An unbounded
        lower limit is indicated by an EMPTY_FLT value.
      kind: llm
- name: neutron_flux_of_correction_coil
  kind: scalar
  status: active
  description: Neutron number flux incident on a correction-coil surface, measuring
    the rate at which neutrons cross each unit area.
  documentation: 'Neutron number flux is the local rate of neutron crossings through
    a surface on a correction coil. It quantifies the incident neutron radiation field
    at the coil surface and provides the neutron-specific content of the broader [correction-coil
    flux](name:flux_of_correction_coil).


    The differential neutron flux is defined by


    $$

    \Phi_n = \frac{dN_n}{dA\,dt}

    $$


    where $N_n$ is the number of neutrons crossing surface area $A$ and $t$ is time.
    The unqualified quantity includes the neutron population without an energy selection;
    [fast-neutron flux of a correction coil](name:fast_neutron_flux_of_correction_coil)
    is its energy-restricted instance. Flux is distinct from neutron fluence, which
    is the time integral of flux.'
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_correction_coil
  arguments:
  - name: flux_of_correction_coil
    operator: neutron
    operator_kind: qualifier
- name: fast_neutron_flux_of_correction_coil
  kind: scalar
  status: active
  description: Incident crossing rate of fast neutrons per unit area on the inboard-facing
    surface of a non-axisymmetric correction coil.
  documentation: 'Fast neutron number flux is the incident crossing rate of the fast-neutron
    population per unit area on the inboard-facing surface of a non-axisymmetric correction
    coil. It is the fast-neutron component of [neutron flux of correction coil](name:neutron_flux_of_correction_coil).


    The differential number flux is defined by


    $$

    \Phi_{\mathrm{fast}} = \frac{dN_{\mathrm{fast}}}{dA\,dt}

    $$


    where $N_{\mathrm{fast}}$ is the number of fast neutrons incident on surface area
    $A$ and $t$ is time; $A$ is measured in m$^2$ and $t$ in s.


    The inboard-facing surface is the side directed toward decreasing major radius
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame. This quantity includes
    only incident fast-neutron crossings and excludes outgoing crossings and the energy-integrated
    neutron flux.'
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:neutron_flux_of_correction_coil
  arguments:
  - name: neutron_flux_of_correction_coil
    operator: fast
    operator_kind: qualifier
  sources:
  - dd_path: coils_non_axisymmetric/coil/neutron_fast_flux_inboard
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-neutron_fast_flux_inboard
    dd_documentation:
      leaf: 'Fast neutron flux arriving on the inboard side of this coil '
      parent_path: coils_non_axisymmetric/coil
      parent: Set of coils
      data_type: STRUCTURE
      unit: m^-2.s^-1
    enhanced_context:
      description: Fast neutron flux incident on the inboard side of a non-axisymmetric
        coil. A time-resolved quantity used to assess radiation exposure and material
        degradation of coil components.
      kind: llm
- name: neutron_flux_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Total neutron flux incident on a toroidal field coil, giving the number
    of neutrons from all energy groups crossing a unit area of the coil structure
    per unit time.
  documentation: 'The neutron flux $\Phi_n$ at a toroidal field coil quantifies the
    total radiation loading from all fusion-born neutrons on the coil structure, expressed
    as the number of neutrons of all energies crossing a unit surface area per unit
    time. This encompasses both thermal and fast neutron components and provides the
    broadest measure of radiation exposure relevant to activation inventory, cumulative
    dose, and gas-production in coil structural materials and superconducting windings.


    The energy-integrated flux is defined as


    $$

    \Phi_n = \int_0^\infty n_n(\mathbf{r}, E)\, v_n(E)\, dE

    $$


    where $n_n(\mathbf{r}, E)$ is the energy-dependent neutron number density at position
    $\mathbf{r}$ and $v_n(E)$ is the neutron speed at kinetic energy $E$. The fast-neutron
    sub-spectrum, which governs atomic displacement damage and insulation degradation,
    is resolved separately by [fast_neutron_flux_of_toroidal_field_coil](name:fast_neutron_flux_of_toroidal_field_coil).


    Flux levels are estimated from neutronics transport calculations driven by the
    fusion plasma neutron source distribution, and can be benchmarked against activation
    foil or dosimetry measurements on coil structural samples. The parent concept
    covering general particle flux on the toroidal field coil is defined in [flux_of_toroidal_field_coil](name:flux_of_toroidal_field_coil);
    a corresponding quantity for non-axisymmetric correction coils is given by [neutron_flux_of_correction_coil](name:neutron_flux_of_correction_coil).'
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_toroidal_field_coil
  - name:flux_of_toroidal_field_coil
  - name:neutron_flux_of_correction_coil
  arguments:
  - name: flux_of_toroidal_field_coil
    operator: neutron
    operator_kind: qualifier
- name: fast_neutron_flux_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Fast neutron flux incident on the inboard side of a toroidal field
    coil, providing a measure of radiation exposure relevant to material activation,
    radiation damage, and conductor insulation lifetime assessment.
  documentation: "Fast neutron flux at a toroidal field coil quantifies the number\
    \ of energetic neutrons crossing unit area per unit time at the inboard-facing\
    \ surface of the coil structure. In deuterium-tritium burning plasmas, 14.1 MeV\
    \ fusion neutrons are the dominant source; these are attenuated and scattered\
    \ by the blanket and shield, but a residual fast population reaches the coil and\
    \ constitutes the primary radiation load on the superconducting windings and their\
    \ organic insulation.\n\nThe quantity is the energy-integrated fluence rate above\
    \ a fast-neutron threshold:\n\n$$\n\\Phi_n = \\int_{E_\\mathrm{th}}^{\\infty}\
    \ \\Phi(E)\\, dE\n$$\n\nwhere $\\Phi(E)$, in m$^{-2}$ s$^{-1}$ eV$^{-1}$, is the\
    \ differential neutron flux spectrum and $E_\\mathrm{th}$ is the fast-neutron\
    \ energy threshold adopted in the transport model.\n\nThis flux drives radiation\
    \ damage processes including atomic displacement damage in conductor structural\
    \ materials, helium bubble formation, and degradation of organic insulation resins\
    \ \u2014 all of which set operational lifetime limits for the coil. It is assessed\
    \ using Monte Carlo or deterministic neutron transport codes, validated against\
    \ activation foil and threshold detector measurements. The analogous quantity\
    \ for non-axisymmetric correction coils is [fast_neutron_flux_of_correction_coil](name:fast_neutron_flux_of_correction_coil)."
  unit: m^-2.s^-1
  physics_domain: magnetic_field_systems
  links:
  - name:fast_neutron_flux_of_correction_coil
  arguments:
  - name: neutron_flux_of_toroidal_field_coil
    operator: fast
    operator_kind: qualifier
  sources:
  - dd_path: tf/coil/neutron_fast_flux_inboard
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-coil-neutron_fast_flux_inboard
    dd_documentation:
      leaf: 'Fast neutron flux arriving on the inboard side of this coil '
      parent_path: tf/coil
      parent: Set of coils around the tokamak
      data_type: STRUCTURE
      unit: m^-2.s^-1
    enhanced_context:
      description: Fast neutron flux incident on the inboard side of a toroidal field
        (TF) coil. Quantifies the neutron radiation load relevant for radiation damage,
        material activation, and insulation lifetime assessment.
      kind: llm
- name: normal_coordinate_of_correction_coil
  kind: scalar
  status: active
  description: "Coordinate of the correction-coil conductor cross-section outline\
    \ vertices along the normal axis of the local Frenet\u2013Serret frame."
  documentation: "The normal coordinate locates each vertex of the polygonal outline\
    \ bounding a correction-coil conductor cross-section along the principal normal\
    \ basis vector $\\hat{n}$ of the Frenet\u2013Serret moving frame. In that frame,\
    \ $\\hat{t}$ is the unit tangent along the conductor centerline, $\\hat{n}$ points\
    \ toward the instantaneous center of curvature, and $\\hat{b} = \\hat{t} \\times\
    \ \\hat{n}$ is the binormal. Paired with the complementary [binormal coordinate](name:binormal_coordinate_of_correction_coil),\
    \ the two coordinates fully specify each outline vertex in the plane perpendicular\
    \ to the centerline.\n\nFor an outline vertex at position $\\mathbf{r}$ relative\
    \ to the centerline reference point $\\mathbf{r}_0$, the normal coordinate is:\n\
    \n$$\nn = (\\mathbf{r} - \\mathbf{r}_0) \\cdot \\hat{n}\n$$\n\nwhere $\\hat{n}$\
    \ is the Frenet\u2013Serret principal normal unit vector at the corresponding\
    \ centerline location.\n\nThe outline vertices are defined from engineering drawings\
    \ or CAD models of the correction-coil winding pack. The closed polygon formed\
    \ by the normal and binormal vertex pairs encloses the [cross-sectional area]\
    \ of the conductor. The analogous quantity for toroidal field coils is [normal_coordinate_of_toroidal_field_coil](name:normal_coordinate_of_toroidal_field_coil).\n\
    \nSign convention: Positive when the vertex displacement is in the direction of\
    \ the principal normal $\\hat{n}$, pointing toward the center of curvature of\
    \ the conductor centerline."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_correction_coil
  - name:normal_coordinate_of_toroidal_field_coil
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-conductor-cross_section-outline-normal
    dd_documentation:
      leaf: Coordinate along the normal axis
      parent_path: coils_non_axisymmetric/coil/conductor/cross_section/outline
      parent: Polygonal outline of the cross section in the (normal, binormal) coordinate
        system. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: "Coordinate of the conductor cross-section outline vertices along\
        \ the normal axis of the local Frenet\u2013Serret frame. Defines normal-direction\
        \ positions of the polygonal cross-section boundary for a non-axisymmetric\
        \ coil conductor."
      kind: llm
- name: normal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: active
  description: "Signed coordinate of each toroidal-field-coil conductor cross-section\
    \ outline vertex along the local Frenet\u2013Serret normal, perpendicular to the\
    \ conductor centerline and binormal directions."
  documentation: "The normal coordinate is the signed location of a toroidal-field-coil\
    \ conductor cross-section outline vertex along the local Frenet\u2013Serret normal.\
    \ The cross-section lies in the plane perpendicular to the conductor centerline,\
    \ so this coordinate resolves displacement along one local transverse direction.\n\
    \nFor a vertex at centerline position $s$, the defining relation is:\n\n$$\nx_n(s)\
    \ = \\left[\\mathbf{r}_v - \\mathbf{r}_c(s)\\right] \\cdot \\hat{\\mathbf{n}}(s)\n\
    $$\n\nwhere $x_n$ is the normal coordinate in m, $s$ is centerline arc length\
    \ in m, $\\mathbf{r}_v$ and $\\mathbf{r}_c(s)$ are the vertex and centerline position\
    \ vectors in m, and $\\hat{\\mathbf{n}}(s)$ is the local Frenet\u2013Serret normal\
    \ unit vector.\n\nTogether with the [binormal coordinate of the toroidal field\
    \ coil](name:binormal_coordinate_of_toroidal_field_coil), this coordinate specifies\
    \ the conductor outline in the local cross-sectional plane. It is distinct from\
    \ a radial coordinate in the right-handed cylindrical $(R, \\phi, Z)$ frame and\
    \ has the same geometric role as the [normal coordinate of the correction coil](name:normal_coordinate_of_correction_coil).\n\
    \nSign convention: Positive when the vertex displacement has a positive projection\
    \ onto the local Frenet\u2013Serret normal unit vector $\\hat{\\mathbf{n}}(s)$."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:normal_coordinate_of_correction_coil
  sources:
