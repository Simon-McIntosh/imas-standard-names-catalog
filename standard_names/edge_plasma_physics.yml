- name: electron_temperature_at_wall
  kind: scalar
  status: active
  description: "Kinetic temperature of the electron population evaluated immediately\
    \ on the plasma side of a plasma-facing wall surface, distinct from the solid\
    \ wall\u2019s material temperature."
  documentation: 'Electron temperature at the wall is the scalar kinetic temperature
    of electrons in the plasma-side limit adjacent to a plasma-facing wall. It is
    a population-specific component of [temperature at wall](name:temperature_at_wall),
    not the temperature of the wall material.


    For an isotropic electron velocity distribution, the temperature in energy units
    is defined by


    $$

    T_e = \frac{2}{3}\langle E_e\rangle

    $$


    where $T_e$ is the electron temperature and $\langle E_e\rangle$ is the mean random
    kinetic energy per electron, both expressed in energy units. The value applies
    to the electron population at the plasma-side wall interface and excludes sheath
    potential energy and solid-material thermal energy. A divertor-specific instance
