- name: source_rate_due_to_injection
  kind: scalar
  status: active
  description: Source rate due to injection is the instantaneous rate of electron-equivalent
    particles supplied by active injection, formed by nuclear-charge weighting of
    the injected species. It represents the injection-only material source and excludes
    particle production or loss after injection.
  documentation: 'Source rate due to injection is the instantaneous rate of electron-equivalent
    particles supplied by active injection. It is an additive material source for
    the plasma particle inventory, formed by weighting each injected particle by the
    total nuclear charge associated with that injected particle.


    The electron-equivalent aggregate is defined by


    $$

    S_\mathrm{inj}(t) = \sum_j Z_j \frac{dN_{j,\mathrm{inj}}}{dt}

    $$


    where $S_\mathrm{inj}$ is this source rate, $N_{j,\mathrm{inj}}$ is the cumulative
    count of injected particles of species $j$, $Z_j$ is the total nuclear charge
    number carried by one injected particle of species $j$, and $t$ is time.


    The sum is over active injection only and excludes changes to free-particle populations
    caused after injection by ionization, recombination, charge exchange, recycling,
    pumping, or plasma reactions. For an elemental species not resolved by charge
    state, the contribution is charge-state-summed before the nuclear-charge weighting
    is applied; species-resolved injected source rates such as [deuterium source rate
    due to injection](name:deuterium_source_rate_due_to_injection) are unweighted
    summands until this weighting relation is applied. The electron-equivalent convention
    makes [electron source rate due to injection](name:electron_source_rate_due_to_injection)
    the nearest electron-population counterpart, while [electron source rate](name:electron_source_rate)
    is broader because it is not restricted to active injection. A [gas source rate
    at wall](name:total_particle_source_rate_at_wall_due_to_gas_injection) is wall-referenced
    rather than a species-weighted aggregate; a [total particle source rate] includes
    additional source mechanisms when defined with a compatible counting convention.


    Sign convention: Positive when active injection adds electron-equivalent particles
    to the plasma particle inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:deuterium_source_rate_due_to_injection
  - name:electron_source_rate_due_to_injection
  - name:electron_source_rate
  - name:total_particle_source_rate_at_wall_due_to_gas_injection
- name: deuterium_source_rate_due_to_injection
  kind: scalar
  status: active
  description: Instantaneous rate of deuterium particles supplied by active injection,
    expressed on a common equivalent-electron basis.
  documentation: 'This quantity is the instantaneous particle supply from active injection
    systems for deuterium, expressed on an equivalent-electron basis. Because each
    deuterium atom has nuclear charge number one, the equivalent-electron rate equals
    the deuterium particle rate.


    The defining relation is


    $$

    \dot{N}_{\mathrm{D,eq}}(t)=Z_{\mathrm{D}}\dot{N}_{\mathrm{D}}(t)=\dot{N}_{\mathrm{D}}(t)

    $$


    where $\dot{N}_{\mathrm{D,eq}}$ is the equivalent-electron source rate, $\dot{N}_{\mathrm{D}}$
    is the injected deuterium particle rate, and $Z_{\mathrm{D}}=1$ is the dimensionless
    deuterium nuclear charge number. This is a component of the multi-species [source
    rate due to injection](name:source_rate_due_to_injection) and is distinct from
    the charge-weighted [electron source rate due to injection](name:electron_source_rate_due_to_injection).
    It represents injected inventory supply, not a local volumetric particle source
    or a net plasma production-minus-loss rate.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:electron_source_rate_due_to_injection
  arguments:
  - name: source_rate_due_to_injection
    operator: deuterium
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_rates/deuterium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-deuterium-value
    dd_documentation:
      leaf: Value
