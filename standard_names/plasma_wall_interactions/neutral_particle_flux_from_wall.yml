name: neutral_particle_flux_from_wall
status: draft
cocos_transformation_type: one_like
description: Total rate of neutral particles released from the wall surface into the
  plasma volume, covering cold, thermal, and fast recycled neutrals.
documentation: "The neutral particle flux from the wall $\\Gamma_{n,\\mathrm{wall}}$\
  \ (in s$^{-1}$) quantifies the global rate at which neutral atoms or molecules are\
  \ emitted from plasma-facing surfaces into the vessel volume. Three kinetic populations\
  \ are typically distinguished: cold neutrals ($E \\lesssim 1$ eV) from molecular\
  \ dissociation at the surface, thermal neutrals ($E \\sim k_B T_{\\mathrm{wall}}\
  \ \\approx 0.03$ eV at room temperature) from Franck\u2013Condon processes, and\
  \ fast neutrals ($E \\gtrsim 10$ eV) from energetic reflection of incident ions.\
  \ Recycling coefficients $R$ close to unity imply that $\\Gamma_{n,\\mathrm{wall}}$\
  \ nearly balances the incident ion flux. Typical integrated values are $10^{20}$\u2013\
  $10^{22}$ s$^{-1}$ for medium and large tokamaks. The quantity is estimated from\
  \ calibrated $D_\\alpha$ or $H_\\alpha$ emission measurements, or from neutral-transport\
  \ Monte Carlo codes (EIRENE, DEGAS-2). See `neutral_particle_flux_from_plasma` for\
  \ the complementary outward flux and `neutral_gas_puff_rate` for the externally\
  \ controlled neutral source."
