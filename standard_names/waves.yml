- name: per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of total absorbed wave power (summed over
    all species) enclosed within a given flux surface, resolved per toroidal mode
    number $n_{\mathrm{tor}}$.
  documentation: 'This quantity gives the running integral of wave energy deposition
    from the plasma core out to a specified flux surface, decomposed by toroidal mode
    number $n_{\mathrm{tor}}$. Formally, it is defined as


    $$P_{\mathrm{abs,inside}}(n_{\mathrm{tor}}, \rho) = \int_0^\rho p_{\mathrm{abs}}(n_{\mathrm{tor}},
    \rho'') \, dV(\rho'')$$


    where $p_{\mathrm{abs}}$ is the absorbed power density per toroidal mode number
    (see [per_toroidal_mode_of_wave_absorbed_power_density](name:per_toroidal_mode_of_wave_absorbed_power_density))
    and $dV$ is the volume element of the flux surface labeled by the flux coordinate
    $\rho$. The sum over all species (thermal electrons, thermal ions, and fast ions)
    is included. Integrating this profile from core to plasma boundary recovers the
    globally absorbed power per mode, [per_toroidal_mode_of_wave_absorbed_power](name:per_toroidal_mode_of_wave_absorbed_power);
    removing the mode resolution yields the all-modes cumulative profile [wave_absorbed_power_inside_flux_surface](name:wave_absorbed_power_inside_flux_surface).
    This quantity is central to understanding the radial deposition profile of each
    wave mode during ion cyclotron resonance heating (ICRH) or electron cyclotron
    resonance heating (ECRH), and is computed by wave-solving codes such as full-wave
    or ray-tracing solvers. Typical values range from a few kilowatts to several megawatts
    depending on the injected power level and plasma scenario.'
  unit: W
  physics_domain: waves
  links:
  - name:per_toroidal_mode_of_wave_absorbed_power_density
