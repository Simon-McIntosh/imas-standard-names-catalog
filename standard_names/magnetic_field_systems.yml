- name: toroidal_angle_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of a toroidal-field-coil conductor cross-section
    contour point, expressed relative to the cross-section reference point in the
    right-handed cylindrical (R, phi, Z) frame. It is used with major radius and vertical
    height to locate the contour point.
  documentation: 'The toroidal angle of a toroidal-field-coil conductor cross section
    is the angular coordinate of a conductor-contour point measured relative to a
    designated reference point on that cross section. It is the toroidal component
    of the point location in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height.


    For contour point $i$, the relative toroidal angle is defined as the difference
    between the point and reference toroidal coordinates:


    $$

    \phi_{\mathrm{rel},i} = \phi_i - \phi_{\mathrm{ref}}

    $$


    where $\phi_i$ is the toroidal coordinate of the contour point, $\phi_{\mathrm{ref}}$
    is the toroidal coordinate of the reference point, and $\phi_{\mathrm{rel},i}$
    is expressed in radians. Because toroidal angle is periodic, values that differ
    by $2\pi n$, with integer $n$, represent the same toroidal direction; the physical
    definition does not impose a device-independent wrapping interval.


    In practice, this coordinate is computed from the engineered conductor geometry
    by evaluating the toroidal coordinate of each contour point and subtracting the
    reference-point toroidal coordinate. Together with the radial coordinate [major_radius_of_toroidal_field_coil](name:major_radius_of_toroidal_field_coil)
    and vertical height [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil),
    it locates the contour point in the cylindrical $(R, \phi, Z)$ frame. The corresponding
    generic conductor quantity is [toroidal_angle_of_conductor_cross_section](name:toroidal_angle_of_toroidal_field_coil).


    Typical numerical values are design-specific and depend on the chosen reference
    point and conductor cross-section geometry. The relevant universal scale is the
    angular periodicity $2\pi$ rad, so the values should be interpreted as relative
    toroidal coordinates rather than as absolute toroidal positions of the coil.


    Sign convention: Positive when the contour point is displaced from the reference
    point in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_toroidal_field_coil
  - name:height_of_toroidal_field_coil
  sources:
