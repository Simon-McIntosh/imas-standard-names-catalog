- name: poloidal_current_density_due_to_inertial
  kind: scalar
  status: draft
  description: Poloidal component of the electrical current density driven by plasma
    inertia.
  documentation: "The poloidal inertial current density $j_{\\mathrm{in}, \\theta}$\
    \ is the projection $\\mathbf{j}_{\\mathrm{in}} \\cdot \\hat{\\theta}$ of the\
    \ inertial current density vector $\\mathbf{j}_{\\mathrm{in}} = \\rho_m \\mathbf{v}\
    \ \\times \\boldsymbol{\\omega}$ onto the geometric poloidal direction $\\hat{\\\
    theta}$, where $\\rho_m$ is the mass density, $\\mathbf{v}$ is the fluid velocity,\
    \ and $\\boldsymbol{\\omega}$ is the angular velocity. This component arises from\
    \ the centrifugal and Coriolis contributions to plasma rotation and modifies the\
    \ poloidal field structure through Amp\xE8re's law. Typical poloidal inertial\
    \ current densities in the core of neutral-beam-heated tokamaks are $0.1\\!-\\\
    !1\\ \\mathrm{M\\,A\\,m^{-2}}$. The quantity complements $j_{\\mathrm{in}, \\\
    phi}$, the toroidal counterpart described in [toroidal_current_density_due_to_inertial](name:toroidal_current_density_due_to_inertial),\
    \ and together with [poloidal_current_density](name:poloidal_current_density)\
    \ separates the inertial contribution from the total poloidal current density.\
    \ \n\nSign convention: Positive when the poloidal projection of the inertial current\
    \ density vector points in the direction of increasing poloidal angle $\\theta$."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_current_density_due_to_inertial
  - name:poloidal_current_density
  arguments:
  - name: current_density_due_to_inertial
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/j_inertial/poloidal
    dd_path: plasma_profiles/ggd/j_inertial/poloidal
    status: composed
- name: poloidal_electric_field
  kind: scalar
  status: draft
  description: Poloidal component of the electric field vector, representing the field
    component along the poloidal direction in a flux surface.
  documentation: "The poloidal electric field $E_\\theta = \\mathbf{E} \\cdot \\hat{\\\
    theta}$ is the projection of the total electric field vector onto the local poloidal\
    \ direction (perpendicular to both the radial and toroidal directions). Together\
    \ with the radial and toroidal components, it completes the decomposition of the\
    \ electric field in the tokamak coordinate system. The poloidal electric field\
    \ plays a role in the force balance of the plasma edge, influencing the $E \\\
    times B$ drift velocity and thus the radial transport. It is typically obtained\
    \ from equilibrium reconstruction or from measurements using Langmuir probes and\
    \ spectroscopic diagnostics of poloidal flow. Typical values range from 0.1\u2013\
    10 kV/m in the edge and scrape-off layer, depending on the plasma regime. The\
    \ poloidal electric field is the poloidal component of the [electric_field](name:electric_field),\
    \ and is related to the poloidal current density via Ohm's law: $E_\\theta = \\\
    eta_\\parallel j_\\theta$ in the resistive approximation, where $\\eta_\\parallel$\
    \ is the parallel resistivity."
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/e_field/poloidal
    dd_path: edge_profiles/ggd/e_field/poloidal
    status: composed
  - id: dd:edge_profiles/profiles_1d/e_field/poloidal
    dd_path: edge_profiles/profiles_1d/e_field/poloidal
    status: composed
  - id: dd:plasma_profiles/profiles_1d/e_field/poloidal
    dd_path: plasma_profiles/profiles_1d/e_field/poloidal
    status: composed
- name: poloidal_ion_momentum_flux
  kind: scalar
  status: draft
  description: Poloidal component of the ion momentum flux density, describing the
    rate of poloidal momentum transport per unit area across magnetic flux surfaces.
  documentation: "The poloidal ion momentum flux density $\boldsymbol{\\Pi}_i$ is\
    \ the component of the [ion_momentum_flux](name:ion_momentum_flux) vector projected\
    \ onto the poloidal ($\\theta$) direction. This flux quantifies the transport\
    \ of poloidal angular momentum per unit area, including both convective contributions\
    \ ($m_i n_i v_i^\\theta \\mathbf{v}_i$) and viscous (stress-tensor) terms. In\
    \ tokamak plasmas, the poloidal momentum flux plays a key role in determining\
    \ the cross-surface momentum balance and is intimately linked to the generation\
    \ of poloidal rotation via neoclassical and turbulent processes. This quantity\
    \ is typically inferred from gyrokinetic simulations or measured through spectroscopic\
    \ diagnostics of poloidal impurity rotation. The poloidal momentum flux is distinct\
    \ from the radial component \u2014 represented by [radial_ion_state_momentum_flux](name:radial_ion_state_momentum_flux)\
    \ \u2014 which governs the radial transport of toroidal angular momentum. Together\
    \ with the particle flux [poloidal_ion_flux](name:poloidal_ion_flux), this momentum\
    \ flux enters the poloidal force balance equation and determines the poloidal\
    \ flow profile."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_momentum_flux
  - name:radial_ion_state_momentum_flux
  - name:poloidal_ion_flux
  arguments:
  - name: ion_momentum_flux
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/poloidal/flux
    dd_path: core_transport/model/profiles_1d/ion/momentum/poloidal/flux
    status: composed
- name: poloidal_ion_state_damping_rate
  kind: scalar
  status: draft
  description: Collisional damping rate for the poloidal component of momentum flow
    of a single ion charge state.
  documentation: 'The poloidal ion state damping rate quantifies the rate at which
    the poloidal component of the momentum flux for a specific ion charge state relaxes
    due to neoclassical collisions. In the neoclassical transport framework, the damping
    rate $\nu_{\text{damp}}$ determines the characteristic time $\tau_{\text{damp}}
    = 1/\nu_{\text{damp}}$ over which poloidal momentum perturbations are dissipated,
    acting as a sink term in the poloidal momentum balance equation. This quantity
    is calculated from neoclassical models that account for ion-ion and ion-impurity
    collisions, and is essential for predicting poloidal rotation profiles and intrinsic
    rotation dynamics. Typical values in the plasma core range from $10^3$ s$^{-1}$
    to $10^5$ s$^{-1}$, depending on the ion species, charge state, and local plasma
    parameters such as density and temperature. See also the parent quantity [ion_state_damping_rate](name:ion_state_damping_rate)
    and the corresponding damping rates for the [toroidal](name:toroidal_ion_state_damping_rate),
    [radial](name:radial_ion_state_damping_rate), and [parallel](name:parallel_ion_state_damping_rate)
    components.


    Sign convention: Positive when the damping rate contributes to the decay of poloidal
    momentum perturbations in the direction of the poloidal flow.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_state_damping_rate
  - name:toroidal_ion_state_damping_rate
  - name:radial_ion_state_damping_rate
  - name:parallel_ion_state_damping_rate
  arguments:
  - name: ion_state_damping_rate
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    status: composed
  - id: dd:plasma_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    dd_path: plasma_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    status: composed
- name: poloidal_ion_state_energy_diffusion_coefficient
  kind: scalar
  status: draft
  description: Poloidal thermal energy diffusivity for ions of a specific charge state
    in the generalized grid geometry transport model.
  documentation: "The poloidal ion-state energy diffusion coefficient $\\tilde{D}_{E,\
    \ h}^{\\mathrm{pol}}$ governs the rate of radial energy transport due to turbulence\
    \ and collisions for ions of ionization level $h$ in the poloidal direction. It\
    \ is the poloidal component of the full tensor $\\tilde{D}_{E, h}$ and enters\
    \ the ion energy transport equation as the diffusive coefficient for the poloidal\
    \ heat flux density. Typical values for this coefficient span $0.1$\u2013$10\\\
    ,\\mathrm{m}^2\\mathrm{s}^{-1}$ in the edge and scrape-off layer of diverted tokamaks,\
    \ varying with charge state and local plasma parameters. This quantity is related\
    \ to the total [ion_state_energy_diffusion_coefficient](name:ion_state_energy_diffusion_coefficient)\
    \ and to the poloidal electron and neutral counterparts [poloidal_electron_energy_diffusion_coefficient](name:poloidal_electron_energy_diffusion_coefficient)\
    \ and [poloidal_neutral_state_energy_diffusion_coefficient](name:poloidal_neutral_state_energy_diffusion_coefficient)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:ion_state_energy_diffusion_coefficient
  - name:poloidal_electron_energy_diffusion_coefficient
  - name:poloidal_neutral_state_energy_diffusion_coefficient
  arguments:
  - name: ion_state_energy_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:plasma_transport/model/ggd/ion/state/energy/d_pol/values
    dd_path: plasma_transport/model/ggd/ion/state/energy/d_pol/values
    status: composed
- name: poloidal_ion_state_momentum_flux
  kind: scalar
  status: draft
  description: Poloidal component of the momentum transport flux for a specific ion
    charge state, quantifying momentum flow across flux surfaces in the poloidal direction.
  documentation: "This quantity represents the poloidal projection $\boldsymbol{\\\
    Pi}_{Z} \\cdot \\hat{\\theta}$ of the momentum flux density tensor for ions of\
    \ a given charge state $Z$, where $\boldsymbol{\\Pi}_{Z}$ is the total ion-state\
    \ momentum flux. In the edge and scrape-off layer, the poloidal component captures\
    \ momentum transport driven by poloidal asymmetries in plasma parameters, such\
    \ as those arising from strong edge-localized modes or ballooning-mode turbulence.\
    \ Typical values for $\boldsymbol{\\Pi}_{Z,\\theta}$ in the pedestal region of\
    \ L-mode or H-mode tokamak plasmas range from 0.1 to 10 kg\xB7m$^{-1}$\xB7s$^{-2}$,\
    \ depending on charge state and collisionality. This flux is inferred from edge\
    \ transport models that solve coupled continuity and momentum balance equations\
    \ for multispecies impurity transport.\n\nSign convention: Positive when the poloidal\
    \ momentum flux is directed in the direction of increasing poloidal angle $\\\
    theta$ (counter-clockwise when viewing the poloidal cross-section from the outboard\
    \ midplane).\n\nThe defining relation $\\boldsymbol{\\Pi}_{Z,\\theta} = \\boldsymbol{\\\
    Pi}_{Z} \\cdot \\hat{\\theta}$ links this quantity to its parent [ion\\_state\\\
    _momentum\\_flux](name:ion_state_momentum_flux), and its radial counterpart is\
    \ given by [radial\\_ion\\_state\\_momentum\\_flux](name:radial_ion_state_momentum_flux).\
    \ Comparisons across charge states are standard when evaluating impurity entrainment\
    \ and screening in the SOL."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_state_momentum_flux
  - name:radial_ion_state_momentum_flux
  arguments:
  - name: ion_state_momentum_flux
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/poloidal/flux
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/poloidal/flux
    status: composed
- name: radial_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Radial (cylindrical $R$) component of the current density driven by
    heat-viscosity momentum exchange in the edge plasma.
  documentation: "This quantity isolates the radial projection of the heat-viscosity\
    \ contribution to the current density vector, $j_{hv} = \\nabla \\cdot \\boldsymbol{\\\
    Pi}^{\\mathrm{heat}} / (en_e)$, where $\\boldsymbol{\\Pi}^{\\mathrm{heat}}$ is\
    \ the heat-viscosity stress tensor, $e$ is the elementary charge, and $n_e$ is\
    \ the electron density. The radial component $j_{hv,R}$ arises from the divergence\
    \ of the radial heat-momentum flux and plays a role in edge momentum balance and\
    \ poloidal flow damping. Typical values in the edge region of a diverted tokamak\
    \ range from 1\u2013100 kA\xB7m$^{-2}$, depending on the local temperature gradient\
    \ and collisionality. This quantity is used alongside [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction)\
    \ and [current_density_due_to_heat_viscosity](name:current_density_due_to_heat_viscosity)\
    \ to decompose the radial current balance in the scrape-off layer and pedestal.\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ major radius $R$."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_heat_viscosity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/j_heat_viscosity/r
    dd_path: edge_profiles/ggd/j_heat_viscosity/r
    status: composed
  - id: dd:plasma_profiles/ggd/j_heat_viscosity/r
    dd_path: plasma_profiles/ggd/j_heat_viscosity/r
    status: composed
  - id: dd:plasma_profiles/ggd/j_heat_viscosity/radial
    dd_path: plasma_profiles/ggd/j_heat_viscosity/radial
    status: composed
- name: radial_current_density_due_to_inertial
  kind: scalar
  status: draft
  description: Radial component of the current density arising from plasma mass motion
    and rotation, including centrifugal and Coriolis effects.
  documentation: "The radial component $j_{\\mathrm{in},r}$ of the inertial current\
    \ density vector $\\mathbf{j}_{\\mathrm{in}} = \\rho_m \\mathbf{v} \\times \\\
    boldsymbol{\\omega}$ represents charge transport driven by plasma rotation in\
    \ the plane perpendicular to the radial direction. Here $\\rho_m$ is the mass\
    \ density, $\\mathbf{v}$ is the fluid velocity, and $\\boldsymbol{\\omega}$ is\
    \ the angular velocity vector. This component is non-zero in rotating plasmas\
    \ with poloidal flows and contributes to the radial force balance captured in\
    \ the extended Grad\u2013Shafranov equation. Typical values range from $10^3$\u202F\
    A\u202Fm$^{-2}$ in the core to $10^5$\u202FA\u202Fm$^{-2}$ in the edge of NBI-heated\
    \ tokamaks. The radial inertial current is inferred from rotation profiles measured\
    \ by charge-exchange recombination spectroscopy (CXRS) and equilibrium reconstruction.\
    \ The total inertial current density is the vector sum of the radial, poloidal,\
    \ and toroidal components: [current_density_due_to_inertial](name:current_density_due_to_inertial),\
    \ [poloidal_current_density_due_to_inertial](name:poloidal_current_density_due_to_inertial),\
    \ and [toroidal_current_density_due_to_inertial](name:toroidal_current_density_due_to_inertial).\n\
    \nSign convention: Positive when the radial component points outward (increasing\
    \ major radius $R$) in the right-handed cylindrical $(R, \\phi, Z)$ system."
  unit: A.m^-2
  physics_domain: transport
  links:
