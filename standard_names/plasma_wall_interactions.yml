    dd_path: summary/composition/boron/value
    status: composed
- name: ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Ratio of volume-averaged total oxygen ion number density to volume-averaged
    electron density, expressing the global oxygen impurity concentration as a dimensionless
    plasma composition fraction.
  documentation: 'The oxygen fraction $f_O$ measures the global oxygen impurity burden
    in a fusion plasma as the ratio of the volume-averaged oxygen ion density to the
    volume-averaged electron density, where both averages are taken over the plasma
    volume enclosed by the last closed flux surface.


    $$

    f_O = \frac{\langle n_O \rangle}{\langle n_e \rangle}

    $$


    where $\langle n_O \rangle = \sum_{q=1}^{8} \langle n_{O^{q+}} \rangle$ is the
    volume-averaged oxygen ion number density summed over all ionization stages from
    $O^{1+}$ to $O^{8+}$, and $\langle n_e \rangle$ is the [volume-averaged electron
    density](name:volume_averaged_electron_density).


    The quantity is inferred from vacuum ultraviolet or soft X-ray spectroscopy of
    oxygen emission lines combined with collisional-radiative or coronal equilibrium
    modeling; it is the normalized complement to [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density),
    which carries the absolute density, while [line_averaged_oxygen_density](name:line_averaged_oxygen_density)
    provides a routinely measured chord-integrated cross-check.


    In clean, well-conditioned tokamak discharges $f_O$ remains below 0.01; values
    of several percent can occur during commissioning, after disruptions, or with
    intentional oxygen seeding. Because each fully-stripped oxygen ion contributes
    eight electrons, even modest $f_O$ values measurably dilute fuel ion density and
    enhance radiative power losses through oxygen line emission.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:volume_averaged_electron_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_oxygen_density
  arguments:
  - name: volume_averaged_electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/oxygen/value
    dd_path: summary/composition/oxygen/value
    status: composed
- name: reference_wavelength_of_filter
  kind: scalar
  status: draft
  description: Reference wavelength of an optical filter is the nominal center or
    peak wavelength of its passband, usually the wavelength at which the nominal transmission
    is maximal. It identifies the spectral location of the filter response, not the
    full passband shape or width.
  documentation: 'Reference wavelength of a filter, $\lambda_\mathrm{ref}$, is the
    nominal spectral position assigned to an optical bandpass filter. For a single-peaked
    bandpass it is normally the wavelength at which the nominal spectral transmittance
    is largest; for asymmetric or structured responses it is a manufacturer- or calibration-defined
    reference point for the passband center.


    For a peak-defined filter reference, the defining relation is


    $$

    \lambda_\mathrm{ref} = \operatorname*{arg\,max}_{\lambda} T_\mathrm{nom}(\lambda)

    $$


    where $T_\mathrm{nom}(\lambda)$ is the nominal spectral transmittance as a function
    of wavelength $\lambda$.


    The value is obtained from the filter specification or from laboratory spectral-transmission
    calibration. It is used together with the passband width and, when available,
    lower and upper wavelength bounds to describe the spectral region transmitted
    by the filter; the reference wavelength alone does not fully determine the filter
    response.


    Typical values for visible and infrared plasma diagnostics are about $4\times10^{-7}$-$1.5\times10^{-5}$
    m, with narrow line filters often centered near specific atomic or molecular emission
    wavelengths and thermal-infrared filters commonly in the micrometer range.'
