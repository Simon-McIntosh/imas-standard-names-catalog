- name: electron_critical_temperature_at_pedestal_top
  kind: scalar
  status: draft
  description: Electron critical temperature at the pedestal top is the threshold
    pedestal-top electron temperature at which an H-mode edge pedestal is marginal
    to ideal magnetohydrodynamic peeling-ballooning stability. It represents a stability-limit
    temperature, not necessarily the measured pedestal-top temperature.
  documentation: 'Electron critical temperature at the pedestal top is the electron
    temperature threshold for marginal ideal magnetohydrodynamic stability of the
    H-mode edge pedestal. It is the value of the pedestal-top electron temperature
    at which the pedestal pressure-gradient drive reaches the peeling-ballooning stability
    boundary. It should be compared with the actual [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)
    to assess proximity to the stability limit.


    In pedestal stability calculations the threshold is commonly identified by a marginality
    condition:


    $$

    \alpha_\mathrm{ped}(T_{e,\mathrm{crit}}, n_{e,\mathrm{ped}}, \Delta_\mathrm{ped},
    q, \hat{s}, j_\mathrm{bs}) = \alpha_\mathrm{crit}(q, \hat{s}, j_\mathrm{bs}, \kappa,
    \delta)

    $$


    where $T_{e,\mathrm{crit}}$ is the critical pedestal-top electron temperature
    in eV, $n_{e,\mathrm{ped}}$ is the pedestal-top electron density in m$^{-3}$,
    $\Delta_\mathrm{ped}$ is the pedestal width in m, $q$ is the safety factor, $\hat{s}$
    is the magnetic shear, $j_\mathrm{bs}$ is the bootstrap current density in A m$^{-2}$,
    and $\kappa$ and $\delta$ are dimensionless shape parameters. The quantities $\alpha_\mathrm{ped}$
    and $\alpha_\mathrm{crit}$ are dimensionless measures of the pedestal pressure-gradient
    drive and its ideal MHD stability limit.


    This quantity is not measured directly. It is inferred by varying the assumed
    pedestal-top electron temperature, with other pedestal and equilibrium quantities
    held fixed or evolved according to a specified model, until an ideal MHD stability
    calculation finds marginal peeling-ballooning stability. Bootstrap current effects
    may be included self-consistently because the current profile changes the stability
    boundary, but no particular pedestal-shape parameterization, bootstrap-current
    closure, or scan procedure is implied by the standard name.


    Typical values in present tokamak H-mode pedestals are about 300-3000 eV. Lower-current
    or smaller devices may have thresholds near 100-800 eV, while high-field or high-performance
    plasmas can have critical pedestal-top temperatures of 3000-8000 eV or higher
    depending on density, pedestal width, shaping, magnetic shear, and bootstrap current.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:alpha_parameter
  - name:critical_electron_temperature_at_pedestal_top_due_to_magnetohydrodynamic
  - name:electron_temperature_at_pedestal_top
  - name:critical_temperature_at_pedestal_top
