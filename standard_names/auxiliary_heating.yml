- name: voltage_amplitude
  kind: scalar
  status: active
  description: Maximum absolute instantaneous radio-frequency voltage at the transmission-line
    feed of an ion-cyclotron heating antenna module during one waveform cycle.
  documentation: 'This quantity is the peak magnitude of the radio-frequency voltage
    applied at the transmission-line feed of an ion-cyclotron heating antenna module.
    It describes the voltage waveform amplitude at the module interface, not the voltage
    at the generator or along the antenna strap.


    $$

    V_{\mathrm{peak}} = \max_{t \in \mathcal{T}} \left|v_{\mathrm{RF}}(t)\right|

    $$


    where $v_{\mathrm{RF}}(t)$ is the instantaneous feed voltage in volts, $t$ is
    time, and $\mathcal{T}$ spans one complete radio-frequency waveform cycle. The
    magnitude is non-negative and is independent of the voltage polarity. It is distinct
    from [forward power of the ion-cyclotron heating antenna](name:forward_power_of_ion_cyclotron_heating_antenna),
    which describes traveling power toward the antenna, and from the antenna''s [resistance](name:resistance_of_ion_cyclotron_heating_antenna),
    which describes its resistive RF loading.'
  unit: V
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  - name:resistance_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/module/voltage/amplitude
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-voltage-amplitude
    dd_documentation:
      leaf: Amplitude of the measurement
      parent_path: ic_antennas/antenna/module/voltage
      parent: Set of voltage measurements
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Amplitude of the voltage signal on an IC antenna module transmission
        line feed. Represents the peak voltage magnitude used for power and reflection
        analysis of the ICRH system.
      kind: llm
- name: wave_frequency
  kind: scalar
  status: active
  description: Temporal carrier frequency of a coherent electromagnetic wave used
    to characterize its oscillation rate in plasma heating and current drive.
  documentation: 'Wave frequency is the non-negative temporal carrier frequency of
    a coherent electromagnetic wave interacting with a plasma. It describes the rate
    of phase oscillation and applies to waves at launch or during propagation, independent
    of the wave amplitude or absorbed power.


    The frequency $f$ is related to the angular frequency by


    $$

    f = \frac{\omega}{2\pi}

    $$


    where $f$ is frequency in hertz and $\omega$ is angular frequency in radians per
    second. The launch-specific quantity [launched wave frequency](name:launched_wave_frequency)
    uses this same definition as the absolute reference for a launched wave, while
    [frequency of electron cyclotron heating antenna](name:frequency_of_electron_cyclotron_heating_antenna)
    is a device-specific instance.'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:launched_wave_frequency
  - name:frequency_of_electron_cyclotron_heating_antenna
  sources:
  - dd_path: waves/coherent_wave/global_quantities/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-global_quantities-frequency
    dd_documentation:
      leaf: Wave frequency
      parent_path: waves/coherent_wave/global_quantities
      parent: Global quantities for various time slices
      data_type: FLT_0D
      unit: Hz
    enhanced_context:
      description: Wave frequency (f) of a coherent electromagnetic wave in the plasma.
        Determines resonance conditions for wave-particle interactions and selects
        the relevant heating regime (EC, IC, LH).
      kind: llm
- name: wave_phase_of_antenna_strap
  kind: scalar
  status: active
  description: Relative RF wave phase assigned to one ion-cyclotron heating antenna
    strap, used with other strap phases to determine the launcher's toroidal wave
    spectrum.
  documentation: 'The wave phase of an antenna strap is the phase offset of its RF
    excitation relative to a defined launcher reference signal or reference strap.
    It describes relative phasing between straps rather than the strap''s geometric
    location or RF amplitude.


    $$

    \phi_s = \arg\left(\frac{C_s}{C_{\mathrm{ref}}}\right)

    $$


    where $C_s$ is the complex RF phasor associated with the strap, $C_{\mathrm{ref}}$
    is the complex phasor of the reference signal, and $\phi_s$ is the resulting phase
    angle in radians. The phase origin and positive phase direction are set by the
    launcher phase-reference convention; an absolute phase has no meaning without
    that convention. Phase differences between straps determine the launched wave
    spectral content, while the [toroidal angle of the antenna strap](name:toroidal_angle_of_antenna_strap)
    describes geometric position and [voltage amplitude](name:voltage_amplitude) describes
    excitation magnitude.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_antenna_strap
