- name: normalized_linear_growth_rate_of_gyrokinetic_eigenmode
  kind: scalar
  status: draft
  description: Dimensionless linear growth rate of a gyrokinetic eigenmode at a given
    wavevector, with positive values indicating exponential instability and negative
    values indicating mode damping.
  documentation: "The normalized growth rate $\\gamma_\\text{norm}$ is the imaginary\
    \ part of the dimensionless complex eigenfrequency of a linear gyrokinetic mode,\
    \ characterizing whether a plasma micro-instability \u2014 such as the ion-temperature-gradient\
    \ (ITG), trapped-electron (TEM), or electron-temperature-gradient (ETG) mode \u2014\
    \ grows or decays exponentially at a specified perpendicular wavevector.\n\nThe\
    \ normalization divides the physical growth rate by the reference frequency $v_\\\
    text{th,ref}/L_\\text{ref}$:\n\n$$\n\\gamma_\\text{norm} = \\frac{\\gamma \\,\
    \ L_\\text{ref}}{v_\\text{th,ref}}\n$$\n\nwhere $\\gamma$ is the physical growth\
    \ rate, $L_\\text{ref}$ is the reference length scale (typically the ion-temperature\
    \ gradient scale length or minor radius), and $v_\\text{th,ref} = \\sqrt{T_\\\
    text{ref}/m_\\text{ref}}$ is the thermal speed of the reference species.\n\nThis\
    \ quantity is a primary output of linear gyrokinetic stability solvers, obtained\
    \ by solving the linearized gyrokinetic equation as an eigenvalue problem at each\
    \ wavevector and extracting $\\gamma_\\text{norm}$ from the dominant eigenvalue.\
    \ It is used alongside the [real normalized frequency](name:normalized_frequency_of_gyrokinetic_eigenmode)\
    \ to identify mode type, determine onset thresholds, and input quasilinear transport\
    \ models. Unstable ITG and TEM modes in tokamak core plasmas yield $\\gamma_\\\
    text{norm} \\sim 0.1-1.5$ near the peak of the wavevector spectrum; values near\
    \ zero mark marginal stability, and negative values identify subdominant damped\
    \ eigenmodes.\n\nSign convention: Positive when the eigenmode grows exponentially\
    \ in time (linearly unstable mode); negative for a damped or stable mode."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_frequency_of_gyrokinetic_eigenmode
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/growth_rate_norm
    dd_path: gyrokinetics/wavevector/eigenmode/growth_rate_norm
    status: attached
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/growth_rate_norm
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/growth_rate_norm
    status: composed
- name: parallel_momentum_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Parallel-channel (magnetic-flutter) component of the normalized toroidal
    momentum flux driven by the perturbed parallel electromagnetic vector potential
    in gyrokinetic turbulence.
  documentation: 'In electromagnetic gyrokinetic turbulence, the radial flux of toroidal
    angular momentum from the perturbed parallel vector potential $\delta A_\parallel$
    is carried by two distinct channels: a perpendicular ($E \times B$-like drift)
    channel and a parallel (magnetic-flutter) channel. This quantity captures the
    magnetic-flutter contribution, in which particles streaming along radially displaced
    field lines induced by $\delta A_\parallel$ carry toroidal momentum across flux
    surfaces. The complementary perpendicular channel is [perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential](name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential),
    and the combined $\delta A_\parallel$ momentum flux is given by [momentum_flux_due_to_perturbed_parallel_vector_potential](name:momentum_flux_due_to_perturbed_parallel_vector_potential).


    In the normalized gyrokinetic framework, the flutter-driven toroidal momentum
    flux is defined as:


    $$

    \Pi_{\mathrm{tor},\parallel}^{\delta A_\parallel} = \sum_s \left\langle \int d^3v
    \; m_s v_\mathrm{tor} \frac{v_\parallel \delta B_r}{B_0} \, g_s \right\rangle_\psi

    $$


    where $m_s$ is the mass of species $s$, $v_\mathrm{tor}$ is the toroidal particle
    velocity, $v_\parallel$ is the parallel velocity, $\delta B_r$ is the radial magnetic
    perturbation induced by $\delta A_\parallel$, $B_0$ is the equilibrium magnetic
    field magnitude, $g_s$ is the non-adiabatic part of the perturbed distribution
    function, and $\langle \cdots \rangle_\psi$ denotes flux-surface averaging; the
    result is normalized to dimensionless gyrokinetic units.


    This flux is evaluated in nonlinear gyrokinetic simulations by summing over the
    wavevector spectrum in the rotating frame. The flutter contribution becomes significant
    at high plasma $\beta = 2\mu_0 p / B_0^2$ (where $p$ is total pressure and $\mu_0$
    is the permeability of free space), when magnetic fluctuations are large. The
    analogous quantity for compressional magnetic fluctuations is [parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field](name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field).


    Sign convention: Positive when the parallel-channel toroidal momentum flux is
    directed radially outward from the magnetic axis, representing net outward transport
    of toroidal angular momentum.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field
