- name: waste_thermal_power_of_plant
  kind: scalar
  status: draft
  description: Total thermal power rejected from the power conversion cycle to external
    heat sinks, representing the thermodynamic losses and low-grade heat that cannot
    be converted to useful electricity.
  documentation: "In a fusion power plant, the thermal power balance is governed by\
    \ the first law of thermodynamics: $P_{\\rm input} = P_{\\rm electric} + P_{\\\
    rm rejected}$, where $P_{\\rm input}$ is the [fusion thermal power input](name:fusion_thermal_power_input)\
    \ delivered to the conversion cycle, $P_{\\rm electric}$ is the [net electrical\
    \ power output](name:net_electric_power_output), and $P_{\\rm rejected}$ is the\
    \ total heat rejected to external sinks such as cooling towers or heat exchangers.\
    \ The thermodynamic efficiency of the plant is therefore $\\eta = 1 - P_{\\rm\
    \ rejected} / P_{\\rm input}$. For a Rankine steam cycle operating at fusion-relevant\
    \ temperatures, rejected heat fractions of 50\u201370% of thermal input are expected,\
    \ corresponding to hundreds of megawatts in reactor-scale designs. This quantity\
    \ encompasses all low-grade heat discharged from condensers, auxiliary cooling\
    \ loops, and shield cooling circuits. It is distinct from plasma-facing thermal\
    \ loads such as the [thermal power load of the divertor](name:thermal_power_load_of_divertor),\
    \ which describes power deposited on in-vessel components rather than the plant-level\
    \ heat rejection budget. The quantity is computed from plant thermal-hydraulic\
    \ models or inferred from cooling-system calorimetry."
  unit: W
  physics_domain: plant_systems
  links:
  - name:fusion_thermal_power_input
  - name:net_electric_power_output
  - name:thermal_power_load_of_divertor
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/total_heat_rejected
    dd_path: balance_of_plant/power_plant/total_heat_rejected
    status: composed
- name: x_component_of_shatter_cone_direction_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the unit vector defining the central
    axis direction of the SPI shatter cone, forming the x element of the right-handed
    Cartesian $(x, y, z)$ trio.
  documentation: 'The shatter cone direction unit vector $\hat{n}_{\rm cone}$ specifies
    the central axis along which SPI pellet fragments are directed after impact with
    the shattering target. Its X-axis component is $n_x = \hat{n}_{\rm cone} \cdot
    \hat{x}$, where $\hat{x}$ is the first basis vector of the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame. Together with [y_component_of_shatter_cone_direction_unit_vector](name:y_component_of_shatter_cone_direction_unit_vector)
    and [z_component_of_shatter_cone_direction_unit_vector](name:z_component_of_shatter_cone_direction_unit_vector),
    these three scalar components fully reconstruct [shatter_cone_direction_unit_vector](name:shatter_cone_direction_unit_vector),
    which satisfies $|\hat{n}_{\rm cone}|^2 = n_x^2 + n_y^2 + n_z^2 = 1$. Values are
    bounded to $[-1, 1]$; a value of $\pm 1$ indicates the cone axis is aligned exactly
    with or opposite to the X-axis. The geometry is specified at injector commissioning
    or design and is used alongside [x_component_of_shatter_cone_major_unit_vector](name:x_component_of_shatter_cone_major_unit_vector)
    to fully characterize the cone orientation.


    Sign convention: Positive when $\hat{n}_{\rm cone}$ has a component in the $+\hat{x}$
    direction of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.'
  unit: '1'
  physics_domain: plant_systems
