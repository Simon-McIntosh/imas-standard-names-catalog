- name: parity_of_gyrokinetic_eigenmode
  kind: scalar
  status: active
  description: Dimensionless symmetry label of a gyrokinetic eigenmode's perturbed
    eigenfunction under reflection of poloidal angle about the outboard midplane.
  documentation: 'Parity of a gyrokinetic eigenmode is the discrete symmetry class
    of its perturbed eigenfunction under reflection across the outboard-midplane poloidal
    coordinate. It distinguishes even and odd mode structure and does not describe
    the equilibrium field.


    The defining relation is


    $$

    \widetilde{f}(\rho,-\theta,\phi)=\mathcal{P}\,\widetilde{f}(\rho,\theta,\phi),
    \qquad \mathcal{P}\in\{+1,-1\}

    $$


    where $\widetilde{f}$ is a perturbed eigenfunction component, $(\rho,\theta,\phi)$
    are flux coordinates, $\theta=0$ is the outboard midplane, and $\mathcal{P}$ is
    the parity label. The value $+1$ denotes even symmetry and $-1$ denotes odd symmetry.
    The more specific [perturbed parity of a gyrokinetic eigenmode](name:perturbed_parity_of_gyrokinetic_eigenmode)
    is an instance of this shared eigenmode-symmetry definition.'
  unit: '1'
  physics_domain: turbulence
  links: []
- name: particle_charge
  kind: scalar
  status: active
  description: Particle charge is the signed charge number assigned to a particle
    species, defining the direction and relative strength of that species' coupling
    to electric and magnetic fields.
  documentation: 'Particle charge is the signed charge number assigned to a particle
    species, identifying the electric charge carried by one particle of that species
    for electromagnetic coupling. It determines the sign and relative strength with
    which the species responds to electric and magnetic fields.


    For a resolved charge state, particle charge denotes the charge of that state.
    For a species represented as an aggregate over ionization states, it denotes the
    density-weighted mean over all charge states; it is not a charge-state population,
    number density, or electric current. A [normalized particle charge](name:normalized_particle_charge)
    is a particular normalized representation of this same signed charge concept,
    rather than a different physical property.


    Sign convention: Positive when the particle carries electric charge with the same
    sign as a proton.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_charge
  - name:average_charge_number
  - name:ion_charge
- name: normalized_particle_charge
  kind: scalar
  status: active
  description: Dimensionless charge number of a particle species, obtained by dividing
    its physical charge by the positive reference charge used for normalization.
  documentation: 'This quantity is the normalized form of [particle charge](name:particle_charge)
    for a particle species. It preserves the sign of the physical charge and expresses
    its magnitude relative to a common positive reference charge.


    The normalized charge is defined by


    $$

    q_{\rm n} = \frac{q}{q_{\rm ref}}

    $$


    where $q$ is the species'' physical electric charge and $q_{\rm ref}$ is the strictly
    positive reference charge, both expressed in the same charge units.


    The result is dimensionless and is used as the charge-coupling coefficient in
    normalized electromagnetic and electrostatic equations. Its sign distinguishes
    positive and negative charge, while its magnitude gives the charge relative to
    the selected reference.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_charge
  arguments:
  - name: particle_charge
    operator: normalized
    operator_kind: qualifier
  sources:
  - dd_path: gyrokinetics_local/species/charge_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-species-charge_norm
    dd_documentation:
