- name: target_atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: active
  description: Target atomic fraction of a neutron detector converter is the fraction
    of all atoms in the converter material that are atoms of the target species for
    the primary neutron-induced detection reaction.
  documentation: 'Target atomic fraction of a neutron detector converter is the fraction
    of all atoms in the converter material that are atoms of the target species for
    the primary neutron-induced detection reaction. It identifies the converter composition
    factor associated with the active target nuclide, not the total amount of converter
    material.


    For a representative amount of converter material, the fraction is defined by
    the atom-count ratio:


    $$

    f_t = \frac{N_t}{N_\mathrm{tot}}

    $$


    where $N_t$ is the count of target-species atoms, $N_\mathrm{tot}$ is the count
    of all atoms in the same converter material amount, and $N_\mathrm{tot} > 0$.
    The admissible range is $0 \le f_t \le 1$.


    This quantity is the target-species specialization of [atomic fraction of a neutron
    detector converter](name:atomic_fraction_of_neutron_detector_converter) and is
    equivalent in scope to [nuclear target atomic fraction of a neutron detector converter](name:nuclear_target_atomic_fraction_of_neutron_detector_converter).
    In compounds or mixtures, $N_\mathrm{tot}$ includes chemically bound and non-target
    atoms, so the value is not the isotopic enrichment of the target element alone
    unless the converter material contains only atoms of that element. If $n_\mathrm{tot}$
    denotes the total atomic number density of the converter material, then $f_t n_\mathrm{tot}$
    is the target-species number density relevant to [nuclear density of a neutron
    detector converter] and to the normalized converter nuclear-response quantity
    [nuclear rate of a neutron detector converter].'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:atomic_fraction_of_neutron_detector_converter
  - name:nuclear_target_atomic_fraction_of_neutron_detector_converter
  arguments:
  - name: atomic_fraction_of_neutron_detector_converter
    operator: target
    operator_kind: qualifier
- name: nuclear_target_atomic_fraction_of_neutron_detector_converter
  kind: scalar
  status: active
  description: Dimensionless fraction of all converter atoms that are nuclei of the
    target species for the primary neutron-induced detection reaction.
  documentation: 'This quantity is the normalized composition factor for target nuclei
    in the converter material of a neutron detector. It identifies the share of converter
    atoms belonging to the nuclear species that produces the intended neutron-induced
    detection reaction.


    The target atomic fraction is defined by


    $$

    f_{\mathrm{target}} = \frac{N_{\mathrm{target}}}{N_{\mathrm{all}}}

    $$


    where $N_{\mathrm{target}}$ is the number of target-species nuclei and $N_{\mathrm{all}}$
    is the total number of atoms in the converter material. It is the nuclear-target
    realization of [target atomic fraction of a neutron detector converter](name:target_atomic_fraction_of_neutron_detector_converter),
    rather than a fraction based on converter volume, mass, or detector efficiency.
    The fraction is bounded between zero and one.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:target_atomic_fraction_of_neutron_detector_converter
  arguments:
  - name: target_atomic_fraction_of_neutron_detector_converter
    operator: nuclear
    operator_kind: qualifier
  sources:
