  - id: dd:edge_sources/source/ggd/ion/state/momentum/toroidal
    dd_path: edge_sources/source/ggd/ion/state/momentum/toroidal
    status: composed
- name: toroidal_neon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Time-averaged toroidal flow velocity of neon impurity ions at the top
    of the pedestal region in the plasma edge, consistent with the right-handed cylindrical
    $(R,\phi,Z)$ frame.
  documentation: 'The toroidal velocity of neon impurity ions at the pedestal top
    is defined as $v_{\phi,\mathrm{Ne}} = \mathbf{v}_{\mathrm{Ne}} \cdot \hat{\phi}$,
    where $\mathbf{v}_{\mathrm{Ne}}$ is the neon ion velocity vector and $\hat{\phi}$
    is the unit vector in the toroidal direction of the right-handed cylindrical $(R,\phi,Z)$
    system. This velocity is typically inferred from spectroscopic measurements of
    Doppler shifts in neon spectral lines, assuming the neon ions are thermalized
    with the bulk deuterium plasma. Typical values in the pedestal region of tokamaks
    range from a few tens to several hundred km/s in the co-current or counter-current
    direction, depending on the plasma rotation state and the injection of neutral
    beams. The measurement context includes edge charge-exchange recombination spectroscopy
    (CXRS) or passive spectroscopy using neon lines (e.g., Ne X at 12.13 nm).


    Sign convention: Positive when the toroidal component of the neon velocity vector
    is in the direction of increasing toroidal angle $\phi$ (counter-clockwise when
    viewed from above the machine).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neon_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/neon/value
    dd_path: summary/local/pedestal/velocity_phi/neon/value
    status: composed
- name: vertical_current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Vertical component of the current density arising from the diamagnetic
    drift of the bulk plasma, driven by the pressure gradient perpendicular to the
    magnetic field.
  documentation: 'The vertical current density $j_{Z,\mathrm{dia}} = \mathbf{j}_{\mathrm{dia}}
    \cdot \hat{Z}$ is the projection of the diamagnetic drift current density $\mathbf{j}_{\mathrm{dia}}
    = (\mathbf{B} \times \nabla p)/B^2$ onto the vertical $Z$-axis of the right-handed
    cylindrical $(R, \phi, Z)$ coordinate system, where $\mathbf{B}$ is the magnetic
    field and $p$ is the total plasma pressure. This component is physically relevant
    in the edge and scrape-off-layer (SOL) regions where poloidal asymmetry in the
    pressure gradient and magnetic geometry can produce a net vertical current, contributing
    to the radial force balance and influencing divertor heat flux distribution. The
    vertical current density is typically inferred from edge equilibrium reconstructions
    or kinetic profile measurements combined with the local magnetic field geometry.
    It is closely related to the parent quantity [current_density_due_to_diamagnetic_drift](name:current_density_due_to_diamagnetic_drift)
    and complements other component-specific quantities such as [radial_neutral_velocity_due_to_diamagnetic_drift](name:radial_neutral_velocity_due_to_diamagnetic_drift).


    Sign convention: Positive when the diamagnetic current density vector has a component
    in the direction of increasing vertical coordinate $Z$ (upward).'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_diamagnetic_drift
  - name:radial_neutral_velocity_due_to_diamagnetic_drift
  arguments:
