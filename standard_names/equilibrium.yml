- name: flux_surface_averaged_toroidal_flux_coordinate_gradient_magnitude
  kind: scalar
  status: active
  description: Geometric metric coefficient formed by averaging the local magnitude
    of the toroidal-flux-coordinate gradient over each nested magnetic flux surface.
  documentation: 'This quantity is the flux-surface average of the local geometric
    rate at which the toroidal flux coordinate changes through physical space. It
    is a scalar metric coefficient associated with nested magnetic surfaces.


    The defining relation is


    $$

    \mathcal{G}(\mathcal{S}) = \left\langle \left|\nabla \rho_{\mathrm{tor}}\right|
    \right\rangle_{\mathcal{S}}

    $$


    where $\mathcal{G}(\mathcal{S})$ is the averaged metric coefficient, $\mathcal{S}$
    is a magnetic flux surface, $\rho_{\mathrm{tor}}$ is the toroidal flux coordinate
    labeling nested magnetic surfaces, $\nabla$ is the spatial gradient, and the angle
    brackets with subscript $\mathcal{S}$ denote averaging over that surface.


    The quantity applies to the complete nested magnetic flux surface and is aggregated
    over the surface rather than evaluated at a point, along a line, or over a volume.
    It represents the average of the gradient magnitude, not a directional component
    and not the local unaveraged value.


    It is obtained by applying flux-surface averaging to the local [toroidal flux
    coordinate gradient magnitude](name:toroidal_flux_coordinate_gradient_magnitude).
    Unlike [flux-surface-averaged square of toroidal flux coordinate gradient magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
    it averages the magnitude itself rather than its square.'
  unit: '1'
