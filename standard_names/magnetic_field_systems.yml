- name: outer_radius_of_passive_loop
  kind: scalar
  status: active
  description: Outer radius of the annular cross-section of a passive conducting loop
    element is the Euclidean distance from the cross-section center to its outer conducting
    boundary.
  documentation: 'Outer radius of the annular cross-section of a passive conducting
    loop element is the Euclidean distance, in the $(R,Z)$ plane at fixed toroidal
    angle $phi$ of the right-handed cylindrical $(R, phi, Z)$ frame, from the center
    of the annular conductor cross-section to its outer conducting boundary. Here
    $R$ is major radius and $Z$ is vertical height.


    The outer boundary radius is defined by the poloidal-plane distance from the cross-section
    center to the selected outer-boundary point:


    $$

    r_\mathrm{outer} = \sqrt{(R_\mathrm{outer} - R_c)^2 + (Z_\mathrm{outer} - Z_c)^2}

    $$


    where $(R_c,Z_c)$ is the annulus-center position and $(R_\mathrm{outer},Z_\mathrm{outer})$
    is the outer-boundary position in the same fixed-$\phi$ plane; all coordinate
    components in the equation are measured in meters.


    This quantity is the outer member of the [radius of a passive loop](name:radius_of_passive_loop)
    family. Together with the [inner radius of a passive loop](name:inner_radius_of_passive_loop),
    it defines the conducting annulus; for a circular annulus, the cross-sectional
    area is $A=\pi(r_\mathrm{outer}^2-r_\mathrm{inner}^2)$ and the radial thickness
    is $r_\mathrm{outer}-r_\mathrm{inner}$. It is nonnegative and is not the loop
    center''s major-radius coordinate or a signed cylindrical component.'
  unit: m
