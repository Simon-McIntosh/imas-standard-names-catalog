- name: volume_of_breeder_blanket
  kind: scalar
  status: active
  description: Geometric volume occupied by a defined material constituent or structural
    subregion within a breeder blanket assembly, bounded by the specified blanket
    scope.
  documentation: 'This quantity is the geometric volume occupied by a specified constituent
    or structural subregion of a breeder blanket assembly. It is an extensive measure
    of the portion of the assembly assigned to that entity.


    The volume is defined by integrating the differential volume element over the
    specified domain:


    $$

    V_{\Omega} = \int_{\Omega} dV

    $$


    where $V_{\Omega}$ is the occupied volume, $\Omega$ is the defined material or
    structural domain within the breeder blanket assembly, and $dV$ is the differential
    volume element.


    The domain excludes regions outside the stated blanket scope and does not represent
    a part-to-whole volume ratio, which is defined by [fraction of breeder blanket
    layer](name:fraction_of_breeder_blanket_layer). [Coolant volume of breeder blanket](name:coolant_volume_of_breeder_blanket)
    is a constituent-specific specialization for the coolant or breeder material and
    excludes external coolant loops and other blanket materials.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:fraction_of_breeder_blanket_layer
  - name:coolant_volume_of_breeder_blanket
- name: coolant_volume_of_breeder_blanket
  kind: scalar
  status: active
  description: Total geometric volume occupied by lead-lithium coolant/breeder throughout
    the breeder blanket assembly, excluding external coolant loops and other blanket
    materials.
  documentation: 'The quantity is the total volume occupied by the lead-lithium coolant/breeder
    constituent within the complete breeder blanket assembly. It is a material-specific
    component of the broader [volume of breeder blanket](name:volume_of_breeder_blanket)
    and is distinct from the volume of an individual module or layer.


    $$

    V_{\mathrm{PbLi}} = \int_{\Omega_{\mathrm{blanket}}} \chi_{\mathrm{PbLi}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $V_{\mathrm{PbLi}}$ is the PbLi volume, $\Omega_{\mathrm{blanket}}$ is the
    volume of the complete breeder blanket assembly, $\chi_{\mathrm{PbLi}}$ is one
    inside the PbLi region and zero elsewhere, and $\mathrm{d}V$ is an elemental volume.
    The integral excludes external coolant loops, structural materials, voids, and
    other non-PbLi constituents.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:volume_of_breeder_blanket
  arguments:
  - name: volume_of_breeder_blanket
    operator: coolant
    operator_kind: qualifier
  sources:
  - dd_path: breeding_blanket/pb_li_volume
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-pb_li_volume
    dd_documentation:
      leaf: Volume of PbLi contained in the blanket
      data_type: FLT_0D
      unit: m^3
      lifecycle_status: alpha
    enhanced_context:
      description: Volume of lead-lithium (PbLi) coolant/breeder contained within
        the breeding blanket. A key engineering parameter for tritium breeding and
        nuclear heating assessments in fusion reactor design.
      kind: llm
- name: volume_of_first_wall
  kind: scalar
  status: active
  description: Volume enclosed by the first-wall surface, representing the interior
    region inside the innermost plasma-facing boundary rather than the wall material
    itself.
  documentation: 'The first-wall volume is the total interior volume enclosed by the
    innermost plasma-facing surface of the vacuum vessel. It includes the space available
    to the confined plasma, edge and scrape-off-layer regions, and neutral gas, but
    excludes the material volume of the wall.


    For an axisymmetric first-wall contour in the right-handed cylindrical $(R,\phi,Z)$
    frame, the volume is defined by


    $$

    V_{\rm FW}=2\pi\iint_A R\,dR\,dZ

    $$


    where $A$ is the poloidal cross-sectional area enclosed by the first-wall contour,
    $R$ is major radius in meters, and $Z$ is vertical height in meters. For non-axisymmetric
    geometry, the complete three-dimensional enclosed region, including bounded ports
    and recesses, defines the volume.


    This enclosed volume is distinct from [volume enclosed by the plasma boundary](name:volume_of_flux_surface),
    which is limited by the last closed flux surface, and from [area of the first
    wall](name:area_of_first_wall), which measures the wall''s material surface rather
    than an enclosed region.'
  unit: m^3
  physics_domain: structural_components
  links:
  - name:volume_of_flux_surface
  - name:area_of_first_wall
  sources:
  - dd_path: wall/first_wall_enclosed_volume
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-first_wall_enclosed_volume
    dd_documentation:
      leaf: Volume available to gas or plasma enclosed by the first wall contour
      data_type: FLT_0D
      unit: m^3
    enhanced_context:
      description: Volume enclosed by the first wall contour, representing the space
        available to gas or plasma within the vacuum vessel. A key geometric device
        parameter for global particle balance and fuelling calculations.
      kind: llm
- name: volumetric_force
  kind: vector
  status: active
  description: "Electromagnetic Lorentz body-force density vector acting locally on\
    \ plasma, conducting wall, or structural material, with components resolved in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The volumetric force is the local electromagnetic Lorentz force\
    \ density acting on plasma and current-carrying conducting or structural material.\
    \ Its projections include the [radial volumetric force](name:radial_volumetric_force),\
    \ [toroidal volumetric force](name:toroidal_volumetric_force), and [vertical volumetric\
    \ force](name:vertical_volumetric_force).\n\nThe electromagnetic force density\
    \ is defined by\n\n$$\n\\mathbf{f}_{\\mathrm{vol}} = \\rho_e \\mathbf{E} + \\\
    mathbf{J} \\times \\mathbf{B}\n$$\n\nwhere $\\mathbf{f}_{\\mathrm{vol}}$ is the\
    \ volumetric force vector, $\\rho_e$ is charge density, $\\mathbf{E}$ is electric\
    \ field, $\\mathbf{J}$ is current density, and $\\mathbf{B}$ is magnetic field.\
    \ The quantity is local and is distinct from the net force obtained by integrating\
    \ it over a material volume.\n\nSign convention: Positive when a force component\
    \ points along its corresponding positive basis direction\u2014increasing $R$,\
    \ increasing toroidal angle $\\phi$, or increasing $Z$\u2014in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:radial_volumetric_force
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
- name: radial_volumetric_force
  kind: scalar
  status: active
  description: "Radial component of the electromagnetic body-force density vector,\
    \ projected onto the direction of increasing major radius R in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The radial volumetric force is the $\hat{R}$-projection of the local
    electromagnetic body-force density $\mathbf{f} = \mathbf{J} \times \mathbf{B}$
    acting on plasma volumes or conducting wall and structural elements. It characterizes
    the net radial push or pull arising from the interaction of local current density
    with the magnetic field, driving stress and displacement in the major-radial direction.


    The defining relation is the radial projection of the Lorentz force density in
    the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$:


    $$

    f_R = (\mathbf{J} \times \mathbf{B}) \cdot \hat{R} = J_\phi B_Z - J_Z B_\phi

    $$


    where $\mathbf{J}$ is the current density vector, $\mathbf{B}$ is the magnetic
    field, and $J_\phi$, $J_Z$, $B_\phi$, $B_Z$ are the toroidal and vertical components
    respectively.


    This component is computed in magnetohydrodynamic equilibrium analyzes and disruption-load
    assessments to quantify radial electromagnetic stresses on plasma-facing components,
    wall tiles, and blanket structures. Together with [toroidal_volumetric_force](name:toroidal_volumetric_force)
    and [vertical_volumetric_force](name:vertical_volumetric_force), it resolves the
    complete local electromagnetic body-force density vector described by [volumetric_force](name:volumetric_force).


    Sign convention: Positive when the electromagnetic force points in the direction
    of increasing major radius $R$.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:toroidal_volumetric_force
  - name:vertical_volumetric_force
  - name:volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - dd_path: wall/description_ggd/ggd/em_force_density/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-em_force_density-r
    dd_documentation:
      leaf: Component along the major radius axis, one scalar value is provided per
        element in the grid subset.
      parent_path: wall/description_ggd/ggd/em_force_density
      parent: Electromagnetic force density computed by the cross-product of j_total
        x b_field and given on various grid subsets
      data_type: FLT_1D
      unit: N.m^-3
      coordinates:
      - 1...N
    enhanced_context:
      description: Major radius (R) coordinate of em force density.
      kind: template
- name: toroidal_volumetric_force
  kind: scalar
  status: active
  description: "Toroidal component of the electromagnetic body-force density vector\
    \ acting on plasma volumes or conducting wall and structural elements, projected\
    \ onto increasing toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The toroidal volumetric force is the $\hat{\phi}$-projection of
    the local electromagnetic body-force density vector acting on plasma volumes or
    conducting wall and structural elements. It characterizes the local mechanical
    load per unit volume directed around the torus in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    For the magnetic Lorentz body force, the toroidal projection is:


    $$

    f_\phi = \mathbf{f}\cdot\hat{\phi} = (\mathbf{J}\times\mathbf{B})\cdot\hat{\phi}
    = J_Z B_R - J_R B_Z

    $$


    where $f_\phi$ is the toroidal volumetric force, $\mathbf{f}$ is the electromagnetic
    body-force density vector, $\mathbf{J}$ is current density, $\mathbf{B}$ is magnetic
    field, and $J_R$, $J_Z$, $B_R$, and $B_Z$ are the corresponding projections in
    the same right-handed cylindrical $(R, \phi, Z)$ frame. The magnetic-field vector
    entering this relation is the quantity represented by [magnetic field](name:magnetic_field).


    This quantity is one signed projection of [volumetric force](name:volumetric_force),
    complementary to [radial volumetric force](name:radial_volumetric_force) and [vertical
    volumetric force](name:vertical_volumetric_force). It excludes the magnitude of
    the body-force density vector and any force integrated over a finite volume.


    Sign convention: Positive when the force density points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:volumetric_force
  - name:vertical_volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
