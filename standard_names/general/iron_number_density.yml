name: iron_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of iron ions (all charge states) in the plasma, quantifying
  the local concentration of this high-$Z$ impurity.
documentation: "The iron ion number density $n_{\\mathrm{Fe}}$ (in m$^{-3}$) represents\
  \ the volumetric concentration of iron ions summed over all ionization stages present\
  \ in the plasma. Iron ($Z = 26$) enters the plasma predominantly through physical\
  \ and chemical sputtering of stainless-steel vacuum-vessel components, diagnostics,\
  \ and antenna structures. Even at low fractional abundance ($n_{\\mathrm{Fe}} /\
  \ n_e \\sim 10^{-5}$\u2013$10^{-3}$), iron contributes substantially to radiative\
  \ cooling through unresolved transition arrays and strong line emission in the soft-X-ray\
  \ and VUV spectral ranges, influencing the overall power balance and $Z_{\\mathrm{eff}}$.\
  \ The quantity is derived from spectroscopic inversion of Fe emission lines using\
  \ atomic databases such as ADAS, or from bolometric tomography combined with impurity\
  \ transport codes (e.g., STRAHL). See also `iron_composition_fraction` for the relative\
  \ abundance and `iron_number_density_at_magnetic_axis` for the on-axis value."
