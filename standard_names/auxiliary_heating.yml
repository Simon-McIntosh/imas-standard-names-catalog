- name: frequency_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Radio-frequency drive frequency of an ion-cyclotron heating antenna,
    averaged over its modules. This non-negative scalar sets the ion-cyclotron resonance
    layer locations and the ion species and harmonics accessible for wave absorption.
  documentation: 'Radio-frequency drive frequency of an ion-cyclotron heating antenna
    is the non-negative cycle frequency of the electromagnetic drive applied to the
    antenna. It is an antenna-level setting that enters the ion-cyclotron resonance
    condition for wave absorption by ions in the plasma.


    For an ion species resonating at harmonic $n$, the defining resonance relation
    is:


    $$

    2\pi f = n\Omega_{ci} = n\frac{Z_i e B}{m_i}

    $$


    where $f$ is this radio-frequency drive frequency, $n$ is the positive integer
    ion-cyclotron harmonic number, $i$ labels the resonant ion species, $\Omega_{ci}$
    is the ion cyclotron angular frequency of species $i$, $Z_i$ is the charge number
    of species $i$, $e$ is the elementary charge, $B$ is the magnetic-field magnitude
    at the resonant location, and $m_i$ is the mass of species $i$.


    This quantity applies to a complete ion-cyclotron heating antenna, not to a single
    antenna module; if module frequencies differ, its aggregation convention is the
    arithmetic mean over the modules. It is the ordinary cycle frequency $f$, not
    the angular frequency $2\pi f$, and it is distinct from the spatially varying
    local ion cyclotron frequency in the plasma.


    The frequency, together with the selected ion species, harmonic number, and magnetic-field
    magnitude, determines which resonance layers are accessible, but it does not by
    itself identify a unique absorption channel when several species or harmonics
    satisfy the resonance relation. It is separate from total_power_of_ion_cyclotron_heating_antenna,
    from the RF-circuit quantity [resistance_of_ion_cyclotron_heating_antenna](name:resistance_of_ion_cyclotron_heating_antenna),
    and from voltage_amplitude_of_ion_cyclotron_heating_antenna; the analogous electron-cyclotron
    quantity is [frequency_of_electron_cyclotron_heating_antenna](name:frequency_of_electron_cyclotron_beam).'
  unit: Hz
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ic_antennas/antenna/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-frequency
    dd_documentation:
      leaf: Frequency (average over modules)
      parent_path: ic_antennas/antenna
      parent: Set of Ion Cyclotron antennas
      data_type: STRUCTURE
      unit: Hz
    enhanced_context:
      description: Operating frequency of an ion cyclotron resonance heating (ICRH)
        antenna, averaged over its modules. Determines the resonance layer location
        and the target ion species for wave absorption in the plasma.
      kind: llm
  - dd_path: ic_antennas/antenna/module/frequency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-frequency
    dd_documentation:
