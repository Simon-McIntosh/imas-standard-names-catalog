- name: vertical_coordinate_of_antenna_strap
  kind: scalar
  status: active
  description: "Vertical location of an antenna strap\u2019s geometric center, expressed\
    \ as the Z coordinate in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The quantity is the vertical coordinate of the geometric center\
    \ of an antenna strap, locating the strap relative to the machine midplane. It\
    \ is a geometric position, not the strap\u2019s height, thickness, or vertical\
    \ extent.\n\nFor a strap occupying volume $V$, its geometric-center coordinate\
    \ is defined by\n\n$$\nZ_c = \\frac{1}{V}\\int_V Z\\,dV\n$$\n\nwhere $Z_c$ is\
    \ the center coordinate, $Z$ is vertical height in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, $V$ is the strap volume, and $dV$ is the volume element.\
    \ This quantity is analogous to the [vertical coordinate of a diagnostic antenna](name:vertical_coordinate_of_diagnostic_antenna),\
    \ but applies specifically to the antenna strap.\n\nSign convention: Positive\
    \ when the strap\u2019s geometric center lies in the $+Z$ direction, above the\
    \ machine midplane."
  unit: m
