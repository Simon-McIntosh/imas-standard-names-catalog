- name: toroidal_helium_3_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of the bulk helium-3 ion flow velocity at the H-mode
    pressure pedestal, resolved along the toroidal direction in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'Toroidal helium-3 velocity at the pedestal is the component of the
    bulk flow velocity of $^3\mathrm{He}$ ions along the toroidal basis direction
    at the H-mode pressure pedestal. The pedestal denotes the steep-gradient edge
    region just inside the last-closed flux surface, where flows strongly affect radial
    electric field balance, impurity and isotope transport, and edge stability.


    The toroidal component is the projection of the helium-3 bulk velocity onto the
    toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,^3\mathrm{He}} = \mathbf{v}_{^3\mathrm{He}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{^3\mathrm{He}}$ is the bulk helium-3 ion flow velocity and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    $\phi$.


    In practice this quantity is inferred from charge-exchange recombination spectroscopy,
    passive spectroscopy when applicable, or edge-plasma modeling constrained by diagnostics.
    The pedestal value is obtained by evaluating the reconstructed helium-3 toroidal
    flow at the pedestal location, commonly identified from the steep-gradient region
    of pressure, density, or temperature.


    Typical pedestal toroidal ion velocities range from about $-1\times10^5$ to $1\times10^5$
    m.s^-1 in tokamak H-mode plasmas, with isotope-specific values depending on neutral-beam
    momentum input, collisional coupling, radial electric field shear, and edge rotation
    damping.


    Sign convention: Positive when the helium-3 bulk flow is in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_pedestal
