- name: counter_passing_particle_density
  kind: scalar
  status: draft
  description: Total particle number density of the counter-passing population (thermal
    plus non-thermal), comprising particles whose guiding-center parallel velocity
    is directed opposite to the plasma current along the magnetic field. The orbit-class
    boundary is defined by the local pitch angle at the trapping-passing boundary,
    typically |v_parallel/v| > lambda_crit, and is model-dependent.
  documentation: "The counter-passing particle density $n_{\\mathrm{ctr}}$ is the\
    \ number density of all particles (thermal and non-thermal combined) whose guiding-center\
    \ parallel velocity $v_\\|$ is directed antiparallel to the net plasma current\
    \ $I_p$ along the magnetic-field line.\n\nMore precisely, the passing\u2013trapping\
    \ boundary is set at the critical pitch-angle cosine $\\lambda_c = v_{\\|}/v$\
    \ for which the particle orbit just closes without mirroring; particles with $|\\\
    lambda| > \\lambda_c$ are passing, and among those the counter-passing subset\
    \ satisfies $\\mathrm{sgn}(v_\\|) = -\\mathrm{sgn}(B_\\phi \\cdot I_p / |B_\\\
    phi \\cdot I_p|)$, i.e. their parallel velocity opposes the field-aligned component\
    \ of the current. The precise value of $\\lambda_c$ depends on the magnetic geometry\
    \ and the distribution-function model used; it is not a universal constant.\n\n\
    The total particle density partitions as\n$$n = n_{\\mathrm{co}} + n_{\\mathrm{ctr}}\
    \ + n_{\\mathrm{trapped}},$$\nwhere $n_{\\mathrm{co}}$ is the co-passing density,\
    \ $n_{\\mathrm{ctr}}$ is this quantity, and $n_{\\mathrm{trapped}}$ is the trapped-particle\
    \ density. This bookkeeping identity holds by construction for any distribution-function\
    \ discretization that assigns each marker to exactly one orbit class.\n\nTypical\
    \ values range from $10^{17}$ m$^{-3}$ (low-density auxiliary-heated plasmas)\
    \ to $\\sim 10^{20}$ m$^{-3}$ (high-density core). Counter-passing fractions relative\
    \ to $n$ depend on collisionality regime and heating geometry; in a banana-regime\
    \ tokamak at moderate aspect ratio the trapped fraction is $\\sim \\epsilon^{1/2}$\
    \ ($\\epsilon = r/R$ local inverse aspect ratio), so $n_{\\mathrm{ctr}} \\approx\
    \ n_{\\mathrm{co}} \\approx (1 - \\epsilon^{1/2}) n / 2$ under isotropic conditions.\n\
    \nIMS Data Dictionary provenance: mapped from `distributions/distribution/profiles_2d/counter_passing/density`\
    \ (IDS `distributions`), which stores the sum of thermal and non-thermal contributions\
    \ on the 2-D $(R, Z)$ grid in the cylindrical $(R, \\phi, Z)$ frame where $R$\
    \ is major radius, $\\phi$ is the toroidal angle increasing counter-clockwise\
    \ viewed from above $+\\hat{Z}$, and $Z$ is vertical height."
  unit: m^-3
  physics_domain: transport
  links:
  - name:co_passing_particle_density
  - name:trapped_particle_density
  - name:counter_passing_fast_particle_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_2d/counter_passing/density
    dd_path: distributions/distribution/profiles_2d/counter_passing/density
    status: composed
- name: derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: First radial derivative of the total electron number density (thermal
    plus non-thermal) with respect to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}$,
    capturing how electron density varies across flux surfaces.
  documentation: "The quantity $\\partial n_e / \\partial \\rho_{\\mathrm{tor,norm}}$\
    \ gives the radial gradient of the total electron number density \u2014 including\
    \ both thermal and non-thermal (fast) contributions \u2014 with respect to the\
    \ normalized toroidal flux coordinate $\\rho_{\\mathrm{tor,norm}} \\in [0, 1]$,\
    \ where $\\rho_{\\mathrm{tor,norm}} = 0$ at the magnetic axis and $\\rho_{\\mathrm{tor,norm}}\
    \ = 1$ at the last closed flux surface. Because $\\rho_{\\mathrm{tor,norm}}$ is\
    \ dimensionless, the derivative carries the same dimensions as density itself.\
    \ This gradient appears directly in the electron particle transport equation,\n\
    $$\\frac{\\partial n_e}{\\partial t} + \\nabla \\cdot \\boldsymbol{\\Gamma}_e\
    \ = S_e,$$\nwhere $\\boldsymbol{\\Gamma}_e$ is the electron particle flux and\
    \ $S_e$ is the source term; the Fickian diffusive flux is proportional to this\
    \ gradient via the [electron particle diffusion coefficient](name:electron_particle_diffusion_coefficient).\
    \ In transport solver codes, the derivative is evaluated numerically on the 1-D\
    \ radial grid in $\\rho_{\\mathrm{tor,norm}}$ from density profiles obtained via\
    \ Thomson scattering, interferometry, or reflectometry. Typical core gradients\
    \ in H-mode tokamaks range from $-10^{20}$ to $-10^{19}$ m$^{-3}$ per unit $\\\
    rho_{\\mathrm{tor,norm}}$, with steeper pedestals approaching $-10^{21}$ m$^{-3}$.\
    \ The second-order analog is [second_derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate](name:second_derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate),\
    \ and the corresponding ion-species quantity is [derivative_of_ion_density_with_respect_to_normalized_toroidal_flux_coordinate](name:derivative_of_ion_density_with_respect_to_normalized_toroidal_flux_coordinate).\n\
    \nSign convention: Positive when electron density increases in the direction of\
    \ increasing $\\rho_{\\mathrm{tor,norm}}$, i.e. toward the plasma boundary."
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_particle_diffusion_coefficient
  - name:second_derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  - name:derivative_of_ion_density_with_respect_to_normalized_toroidal_flux_coordinate
  constraints: []
