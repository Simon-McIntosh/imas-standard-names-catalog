      kind: llm
- name: normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: active
  description: "Gyro-Bohm-normalized turbulent energy-flux contribution from the perturbed\
    \ parallel electromagnetic vector potential is the dimensionless flux-surface-normal\
    \ energy transport channel caused by \u03B4A\u2225 magnetic flutter in a rotating-frame\
    \ gyrokinetic description."
  documentation: 'Gyro-Bohm-normalized turbulent energy-flux contribution from the
    perturbed parallel electromagnetic vector potential is the dimensionless signed
    flux-surface-normal transport of gyrocenter energy caused by magnetic flutter
    from $\delta A_\parallel$ in a rotating-frame gyrokinetic description. Gyrocenters
    streaming along field-line perturbations associated with $\delta A_\parallel$
    carry energy across neighboring magnetic flux surfaces.


    The normalized channel is the energy moment of the perturbed gyrocenter distribution
    coupled to the $\delta A_\parallel$ magnetic-flutter velocity, divided by the
    positive gyro-Bohm reference energy flux:


    $$

    \widehat{Q}_{A_\parallel}

    =

    \frac{1}{Q_\mathrm{gB}}

    \left\langle

    \sum_s \int d^3v \; \mathcal{E}_s \, \operatorname{Re}\!\left[\delta f_s^{*} v_{\psi,A_\parallel,s}\right]

    \right\rangle

    $$


    where $\widehat{Q}_{A_\parallel}$ is this normalized energy-flux contribution,
    $Q_\mathrm{gB}$ is the gyro-Bohm reference energy flux, $s$ indexes species, $d^3v$
    denotes integration over velocity space, $\mathcal{E}_s$ is the gyrocenter energy
    for species $s$, $\delta f_s$ is the perturbed gyrocenter distribution, $v_{\psi,A_\parallel,s}$
    is the flux-surface-normal magnetic-flutter velocity generated by $\delta A_\parallel$,
    and $\langle\cdots\rangle$ denotes the turbulence and magnetic-flux-surface averaging
    that defines the scalar flux. For complex spectral amplitudes, the product is
    the real part of the complex-conjugate correlation. The reference flux has the
    gyro-Bohm form $Q_\mathrm{gB}=n_\mathrm{ref}T_\mathrm{ref}v_{\mathrm{th,ref}}(\rho_\mathrm{ref}/L_\mathrm{ref})^2$,
    where $n_\mathrm{ref}$ is a reference density, $T_\mathrm{ref}$ is a reference
    temperature, $v_{\mathrm{th,ref}}$ is a reference thermal speed, $\rho_\mathrm{ref}$
    is a reference gyroradius, and $L_\mathrm{ref}$ is a reference gradient scale
    length.


    This quantity identifies only the $\delta A_\parallel$ field-channel contribution
    to gyrocenter-energy transport; it is not the total turbulent energy flux, the
    [particle-flux counterpart](name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential),
    the [parallel-momentum-flux counterpart](name:normalized_parallel_momentum_flux_due_to_perturbed_parallel_vector_potential),
    or electromagnetic Poynting flux. It is distinct from the electrostatic $\delta\phi$
    and compressional magnetic $\delta B_\parallel$ energy-flux channels; resolving
    or summing perpendicular-wavevector content changes the aggregation, not the underlying
    channel. The [flux-surface-resolved gyrocenter energy-flux counterpart](name:normalized_radial_gyrocenter_energy_flux_at_flux_surface_due_to_perturbed_parallel_vector_potential)
    retains the local flux-surface dependence before the same channel is aggregated.
    The normalized magnitude is interpreted relative to $Q_\mathrm{gB}$, so a magnitude
    near unity denotes an $A_\parallel$ channel comparable to the gyro-Bohm reference
    scale.


    Sign convention: Positive when the perturbed-parallel-vector-potential contribution
    carries gyrocenter energy in the flux-surface-normal direction toward increasing
    flux coordinate $\rho_\mathrm{tor,norm}$ (normalized toroidal-flux radius).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_radial_gyrocenter_energy_flux_at_flux_surface_due_to_perturbed_parallel_vector_potential
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/linear_weights/energy_a_field_parallel
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-linear_weights-energy_a_field_parallel
