        repetition frequency and validate sawtooth trigger models.
      kind: llm
- name: thermal_energy_decay_time_due_to_disruption
  kind: scalar
  status: active
  description: Thermal energy decay time due to disruption is the effective linear
    time scale for loss of thermal plasma energy between two normalized-energy thresholds
    during the thermal quench, with X2 the upper fraction and X1 the lower fraction.
    It is not an exponential e-folding time.
  documentation: 'Thermal energy decay time due to disruption is the threshold-normalized
    linear time scale for the decrease of thermal plasma energy during the thermal
    quench of a disruption. It is defined from the elapsed time required for the normalized
    thermal energy to fall from an upper fraction to a lower fraction of its pre-disruptive
    value.


    Let $W_\mathrm{th}(t)$ be the thermal plasma energy and $W_{\mathrm{th},0}$ its
    pre-disruptive reference value. For dimensionless thresholds $X_2$ and $X_1$ satisfying
    $0 \le X_1 < X_2 \le 1$, with $X_2$ the upper fraction and $X_1$ the lower fraction,
    let $t(X)$ be the earliest downward crossing time on the thermal-quench interval
    at which $W_\mathrm{th}(t)/W_{\mathrm{th},0}$ reaches $X$. The decay time is defined
    by


    $$

    \tau_{W_\mathrm{th}} = \frac{t(X_1)-t(X_2)}{X_2-X_1}

    $$


    where $\tau_{W_\mathrm{th}}$ and $t(X)$ are times in seconds, $W_\mathrm{th}$
    and $W_{\mathrm{th},0}$ are thermal energies in joules, and $X_1$ and $X_2$ are
    dimensionless fractions. For a monotonic decrease, $t(X_1) \ge t(X_2)$, so the
    defined decay time is non-negative; if both thresholds are not crossed in this
    order, the quantity is undefined for that event.


    The threshold pair is part of the definition of a particular value: energy_upper_fraction_due_to_disruption
    specifies $X_2$ and energy_lower_fraction_due_to_disruption specifies $X_1$ when
    custom thresholds are used; an 80-to-20 convention has $X_2=0.8$ and $X_1=0.2$.
    Here $W_\mathrm{th}$ is [thermal_plasma_energy](name:thermal_plasma_energy), which
    for an isotropic plasma is related to [thermal_plasma_pressure](name:thermal_plasma_pressure)
    by the volume integral of $3p_\mathrm{th}/2$. This quantity applies only to the
    thermal-energy component and excludes magnetic-energy, kinetic-energy, radiated-energy,
    and total-disruption energy decay times such as energy_decay_time_due_to_disruption.'
  unit: s
  physics_domain: magnetohydrodynamics
  links:
  - name:thermal_plasma_energy
  - name:thermal_plasma_pressure
  sources:
  - dd_path: summary/disruption/decay_times/energy_thermal/linear_20_80/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-disruption-decay_times-energy_thermal-linear_20_80-value
    dd_documentation:
