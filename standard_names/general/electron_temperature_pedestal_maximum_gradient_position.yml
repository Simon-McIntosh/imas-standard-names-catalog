name: electron_temperature_pedestal_maximum_gradient_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate $\psi_N$ at which the electron temperature
  gradient is steepest in the pedestal.
documentation: "This quantity gives the $\\psi_N$ location where $|dT_e/d\\psi_N|$\
  \ is maximum within the H-mode edge barrier, corresponding to the inflection point\
  \ of the mtanh fit to the $T_e(\\psi_N)$ profile. It may differ from the analogous\
  \ electron pressure maximum gradient position because the density and temperature\
  \ pedestals can be radially offset. Typical values are $\\psi_N \\approx 0.94$\u2013\
  $0.98$ in conventional tokamak H-modes; the position moves inward with increasing\
  \ triangularity or in high-density scenarios. Measured via high-resolution Thomson\
  \ scattering or ECE radiometry, this parameter constrains local heat-transport models\
  \ and the electron thermal channel contribution to edge stability. See also `electron_pressure_pedestal_maximum_gradient_position`,\
  \ `electron_temperature_pedestal_position`."
validity_domain: ''
