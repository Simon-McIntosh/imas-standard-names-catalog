- name: toroidal_launched_wave_index_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Toroidal launched wave index for a lower hybrid antenna is the signed
    dimensionless projection of the launched wave refractive-index vector on the toroidal
    phi direction in the right-handed cylindrical (R, phi, Z) frame. It equals the
    toroidal wave-vector component divided by the free-space wave number and sets
    the launched parallel phase velocity relevant to current drive.
  documentation: 'The toroidal launched wave index $n_\phi$ is the toroidal component
    of the refractive-index vector of a lower hybrid wave at launch. It is the signed
    projection on $\hat{\phi}$ in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    In tokamak lower hybrid launch geometry, this component is commonly used as the
    launched parallel refractive index controlling the resonant electron parallel
    velocity.


    The quantity is defined by normalizing the physical toroidal wave-vector component
    by the free-space wave number:


    $$

    n_\phi = \frac{k_\phi}{k_0} = \frac{c\,k_\phi}{\omega}

    $$


    where $n_\phi$ is dimensionless, $k_\phi = \mathbf{k}\cdot\hat{\phi}$ is the toroidal
    projection of the launched wave vector in m$^{-1}$, $k_0$ is the free-space wave
    number in m$^{-1}$, $\omega$ is the wave angular frequency in rad s$^{-1}$, and
    $c$ is the speed of light in m s$^{-1}$.


    In practice, $n_\phi$ is set by the relative phase and spacing of the powered
    waveguides or multijunction elements in the lower hybrid launcher. A real launcher
    produces a finite spectrum of toroidal indices; each spectral component corresponds
    to a different parallel phase velocity, with larger $|n_\phi|$ resonating with
    slower electrons and affecting current-drive efficiency and wave accessibility.


    Typical lower hybrid current-drive launch spectra have dominant $|n_\phi|$ values
    of about 1.5-3.5, although values outside this range can be used depending on
    plasma density, magnetic field, frequency, and launcher phasing. The sign distinguishes
    launch in the co- or counter-toroidal direction relative to the chosen plasma-current
    direction.


    Sign convention: Positive when the launched wave-vector projection on $\hat{\phi}$
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_lower_hybrid_antenna
  - name:current_due_to_lower_hybrid_current_drive
  - name:poloidal_launched_wave_index_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/antenna/row/n_phi
    dd_path: lh_antennas/antenna/row/n_phi
    status: composed
- name: toroidal_width_of_antenna_strap
  kind: scalar
  status: draft
  description: Full edge-to-edge arc length of an ICRH antenna strap conductor measured
    along the toroidal direction. It is a non-negative geometric width of the current-carrying
    strap, not a half-width or a signed coordinate difference.
  documentation: 'Toroidal width of an antenna strap is the full physical arc length
    between the two toroidally separated edges of the current-carrying strap conductor,
    measured along the toroidal direction in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $\phi$ is the toroidal angle increasing counter-clockwise viewed
    from above. It is a non-negative geometric length: not a half-width, not a signed
    coordinate difference, and distinct from the poloidal height (see [length_of_antenna_strap](name:length_of_antenna_strap))
    or the radial thickness ([thickness_of_antenna_strap](name:thickness_of_antenna_strap))
    of the strap.


    For a strap represented at a characteristic major radius, the toroidal arc length
    relates to the angular span of the strap edges by


    $$

    w_\phi = R_\mathrm{strap}\,|\phi_2 - \phi_1|

    $$


    where $w_\phi$ is the toroidal width in meters, $R_\mathrm{strap}$ is the representative
    major radius of the strap surface in meters, and $\phi_1$ and $\phi_2$ are the
    toroidal angles of the two strap edges in radians. The angular span $|\phi_2 -
    \phi_1|$ is taken as the smaller, physically contiguous separation between the
    edges, so it never wraps across the $2\pi$ branch cut and always satisfies $0
    \le |\phi_2 - \phi_1| \le \pi$ for a single strap.


    In practice this width is obtained from antenna mechanical design, survey, or
    electromagnetic geometry models by measuring the active conductor face from one
    toroidal edge to the other along the toroidal arc. If the geometry is specified
    by angular extent, multiplication by the local major radius gives the physical
    arc length; for curved or tilted straps, a consistent representative radius or
    surface path should be used. Together with the strap''s poloidal length and radial
    thickness, this dimension sets the finite toroidal aperture of the strap, which
    influences the launched toroidal wave-number spectrum.


    This width complements the orthogonal strap dimensions ([width_of_antenna_strap](name:width_of_antenna_strap),
    [length_of_antenna_strap](name:length_of_antenna_strap), [thickness_of_antenna_strap](name:thickness_of_antenna_strap))
    and the radial placement of the conductor face ([inner_radius_of_antenna_strap](name:inner_radius_of_antenna_strap),
    [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap)).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:height_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:width_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/width_phi
    dd_path: ic_antennas/antenna/module/strap/width_phi
    status: composed
- name: total_absorbed_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power deposited into the plasma by the lower hybrid antenna
    system, aggregated over all individual antennas.
  documentation: 'The total absorbed power of the lower hybrid antenna system quantifies
    the net RF energy deposition rate from the LHCD launcher array into the confined
    plasma, summed over all individual antennas. It is the primary power accounting
    metric for lower hybrid current drive and supplemental electron heating, governing
    the wave energy available for driving non-inductive plasma current.


    The absorbed power is defined as the volume integral of the local LH wave power
    deposition density over the plasma volume:


    $$

    P_\text{abs} = \int_V q_\text{LH}(\mathbf{r}) \, dV

    $$


    where $q_\text{LH}(\mathbf{r})$ is the volumetric LH wave absorption density at
    position $\mathbf{r}$ within the plasma volume $V$.


    This quantity is distinct from the [total launched power](name:launched_power_of_lower_hybrid_antenna),
    which represents power entering the vacuum vessel and can exceed the absorbed
    power by any residual absorption in the edge region or scrape-off layer that does
    not reach the confined plasma. In practice, the absorbed power is estimated from
    directional-coupler measurements of the [forward power](name:forward_power_of_lower_hybrid_antenna)
    and [reflected power](name:reflected_power_of_lower_hybrid_antenna) on the high-power
    RF transmission lines, corrected for resistive dissipation in the launcher structure
    and waveguide network.


    In current LHCD systems on medium-to-large tokamaks, total absorbed power levels
    range from 1-10 MW.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/power
    dd_path: lh_antennas/power
    status: composed
- name: total_external_heating_power
  kind: scalar
  status: draft
  description: Total non-inductive auxiliary heating power absorbed or deposited in
    the plasma, combining neutral beam, electron cyclotron, ion cyclotron, lower hybrid,
    and similar systems. It excludes ohmic inductive heating and source power not
    coupled to the plasma.
  documentation: 'Total external heating power is the aggregate non-inductive auxiliary
    power absorbed or deposited in the plasma. It includes coupled contributions from
    neutral beam injection and radiofrequency heating systems such as electron cyclotron,
    ion cyclotron, and lower hybrid heating, and excludes ohmic inductive heating.
    As a sum of absorbed heating powers, it is non-negative; 0 W indicates that no
    external auxiliary heating power is coupled to the plasma.


    The aggregate power is commonly defined as the sum of the plasma-coupled absorbed
    powers from the active auxiliary systems:


    $$

    P_\mathrm{ext} = P_\mathrm{NBI,abs} + P_\mathrm{EC} + P_\mathrm{IC} + P_\mathrm{LH}
    + \cdots

    $$


    where $P_\mathrm{NBI,abs}$ is the absorbed neutral-beam power, and $P_\mathrm{EC}$,
    $P_\mathrm{IC}$, and $P_\mathrm{LH}$ are the plasma-coupled electron-cyclotron,
    ion-cyclotron, and lower-hybrid powers, respectively.


    In practice, each contribution is evaluated with source-specific accounting. Neutral-beam
    absorbed power is inferred from beam energy and current together with corrections
    for shine-through, reionization, prompt losses, and fast-ion deposition. Radiofrequency
    contributions are inferred from launched power corrected for transmission-line,
    matching, reflection, and coupling losses, together with absorption estimates
    from diagnostics or wave-deposition modeling. The total should include only power
    coupled to the plasma, not source inefficiency, unabsorbed radiation, or power
    lost before reaching the plasma.


    Typical values range from 0 W when auxiliary systems are inactive to about $10^5$-$10^7$
    W in small and medium experiments, with large high-power scenarios reaching $10^7$-$10^8$
    W depending on the active heating mix and plasma conditions.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_plasma_heating_power
  - name:total_plasma_radiated_power
  sources:
  - id: dd:summary/heating_current_drive/power_additional/value
    dd_path: summary/heating_current_drive/power_additional/value
    status: composed
- name: total_power_due_to_electron_cyclotron_heating
  kind: scalar
  status: draft
  description: Total radiofrequency power absorbed in the plasma by electron cyclotron
    heating, summed over all electron cyclotron wave sources. It represents deposited
    heating power, not launched, transmitted, or reflected power, and is zero or positive.
  documentation: 'Total power due to electron cyclotron heating is the aggregate rate
    at which electron cyclotron waves transfer electromagnetic energy to the plasma
    through resonant interaction with electrons at the cyclotron frequency or its
    harmonics. It is an absorbed heating power: it counts only the power that is actually
    deposited in the plasma, excluding power that remains in transmission paths, is
    reflected, or shines through without absorption.


    The total absorbed electron cyclotron heating power is the sum of the absorbed
    powers from the individual electron cyclotron wave sources:


    $$

    P_\mathrm{EC} = \sum_{i=1}^{N_\mathrm{EC}} P_{\mathrm{EC},i}

    $$


    where $N_\mathrm{EC}$ is the number of contributing electron cyclotron wave sources,
    $P_{\mathrm{EC},i}$ (in W) is the heating power absorbed in the plasma from source
    $i$, and $P_\mathrm{EC}$ (in W) is the total deposited power. The per-source contribution
    is reported by [power_due_to_electron_cyclotron_heating](name:power_due_to_electron_cyclotron_heating).


    In practice this quantity is obtained from power-balance and wave-deposition analysis
    that combines the launched radiofrequency power with absorption estimates from
    ray-tracing or beam-tracing calculations, accounting for single-pass absorption
    efficiency and shine-through losses. It enters the electron energy balance as
    a heating source term and is therefore closely related to [total_electron_power](name:total_electron_deposited_power).


    Representative integrated values range from a few hundred kilowatts to several
    megawatts in present-day auxiliary-heated experiments, and reach tens of megawatts
    in high-power systems, with the exact value depending on source power, coupling
    efficiency, plasma density and temperature, magnetic field, and the absorption
    location. The value is zero when no electron cyclotron heating is applied.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_electron_cyclotron_heating
  - name:total_electron_deposited_power
  arguments:
  - name: power_due_to_electron_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
  - id: dd:summary/heating_current_drive/power_ec/value
    dd_path: summary/heating_current_drive/power_ec/value
    status: composed
- name: total_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: draft
  description: Total net radio-frequency power absorbed by the plasma through ion
    cyclotron resonance heating, summed over all ion-cyclotron launchers or antenna
    systems. It excludes power that is launched but reflected or lost before coupling
    to the plasma.
  documentation: 'Total power due to ion cyclotron heating is the aggregate rate at
    which radio-frequency electromagnetic energy in the ion-cyclotron frequency range
    is deposited in the plasma. It includes resonant and mode-converted wave absorption
    from all active ion-cyclotron launchers or antenna systems, and excludes reflected
    power and non-plasma losses.


    The total absorbed ion-cyclotron heating power is the sum of the absorbed powers
    from the individual contributing systems:


    $$

    P_{\mathrm{IC,tot}} = \sum_{k=1}^{N_{\mathrm{IC}}} P_{\mathrm{IC},k}

    $$


    where $N_{\mathrm{IC}}$ is the number of contributing ion-cyclotron launchers
    or antenna systems, $k$ indexes those systems, and $P_{\mathrm{IC},k}$ is the
    net power absorbed by the plasma from system $k$ in watts.


    In practice, this quantity is inferred from an RF power balance using measurements
    of forward, reflected, and coupled power together with estimates of transmission-line,
    matching-network, antenna, and other non-plasma losses when available. It may
    also be constrained by wave-heating analysis, modulation experiments, or global
    plasma energy-balance checks; it is not the generator output power or the purely
    launched RF power.


    Typical values are $1\times10^5-1\times10^7$ W in medium-sized tokamak experiments
    and can reach $2\times10^7-4\times10^7$ W in large high-power ion-cyclotron heating
    scenarios. The value is zero when no ion-cyclotron RF power is coupled to and
    absorbed by the plasma.'
  unit: W
  physics_domain: auxiliary_heating
