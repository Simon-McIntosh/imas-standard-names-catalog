- name: normalized_total_momentum_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: active
  description: Normalized toroidal momentum flux from the perturbed parallel electromagnetic
    vector potential in gyrokinetic turbulence, restricted to the parallel velocity-space
    channel. Total denotes aggregation over species and fluctuation contributions
    within that channel.
  documentation: 'Normalized toroidal momentum flux from the perturbed parallel electromagnetic
    vector potential in gyrokinetic turbulence, restricted to the parallel velocity-space
    channel, is the gyro-Bohm-normalized flux-surface-normal transport of toroidal
    angular momentum associated with magnetic-flutter correlations from $\delta A_\parallel$.
    Toroidal angular momentum is referenced to motion in the direction of increasing
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$,
    and $Z$ is vertical height.


    The normalized total parallel-channel contribution is defined by the aggregate
    gyrokinetic flux moment normalized by the gyro-Bohm momentum-flux scale:


    $$

    \widehat{\Pi}^{\mathrm{tot}}_{\phi,\delta A_\parallel;\parallel}

    =

    \frac{1}{\Pi_{\mathrm{gB}}}

    \sum_s \sum_{\mathbf{k}}

    \left\langle

    \int m_s R v_\parallel b_\phi\,

    v^{\mathrm{fl}}_{\chi,\delta A_\parallel}\,

    \delta f_{s,\mathbf{k}}\,d^3v

    \right\rangle

    $$


    where $s$ labels species, $\mathbf{k}$ labels fluctuation-wavevector contributions,
    $m_s$ is species mass, $v_\parallel$ is gyrocenter velocity parallel to the magnetic
    field, $b_\phi$ is the toroidal component of the magnetic-field unit vector, $v^{\mathrm{fl}}_{\chi,\delta
    A_\parallel}$ is the flux-surface-normal magnetic-flutter velocity produced by
    $\delta A_\parallel$ for magnetic-flux label $\chi$, $\delta f_{s,\mathbf{k}}$
    is the perturbed gyrocenter distribution contribution, and angle brackets denote
    the flux-surface and turbulence average. The gyro-Bohm scale is $\Pi_{\mathrm{gB}}=n_{\mathrm{ref}}T_{\mathrm{ref}}R_{\mathrm{ref}}(\rho_{\mathrm{ref}}/a_{\mathrm{ref}})^2$,
    with $n_{\mathrm{ref}}$ the reference density, $T_{\mathrm{ref}}$ the reference
    temperature, $R_{\mathrm{ref}}$ the reference major radius, $\rho_{\mathrm{ref}}$
    the reference gyroradius, and $a_{\mathrm{ref}}$ the reference minor radius.


    This quantity has the same parallel velocity-space projection as the [normalized
    parallel momentum flux due to the perturbed parallel vector potential](name:normalized_parallel_momentum_flux_due_to_perturbed_parallel_vector_potential),
    while the word total denotes aggregation over species and fluctuation contributions
    within that projection. It excludes the [normalized perpendicular momentum flux
    due to the perturbed parallel vector potential](name:normalized_perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential),
    whose velocity-space projection is perpendicular to the magnetic-field direction,
    and is not the algebraic sum of the parallel and perpendicular projections.


    Sign convention: Positive when toroidal angular momentum for motion in the direction
    of increasing toroidal angle $\phi$ is transported in the flux-surface-normal
    direction toward increasing magnetic-flux label in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: '1'
