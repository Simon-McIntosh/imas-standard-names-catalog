- name: boron_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of boron ions in the plasma at the radial location of
    the pedestal maximum pressure gradient.
  documentation: 'The boron ion number density at the pedestal location quantifies
    the boron concentration in the edge transport barrier region. The pedestal is
    defined by the steep-gradient region of the radial pressure profile, typically
    at the top of the H-mode edge transport barrier. This quantity is derived from
    spectroscopic measurements of boron line emission combined with charge-exchange
    recombination spectroscopy (CXRS) or from collisional-radiative modeling of impurity
    transport. Typical values in H-mode plasmas range from $10^{16}$ to $10^{19}\,\mathrm{m}^{-3}$,
    depending on the boron source rate from wall conditioning (e.g., boronization)
    and on the plasma edge conditions. The pedestal boron density is closely related
    to the main-ion confinement and to the radiation losses in the divertor and scrape-off
    layer. See also [boron_density_at_separatrix](name:boron_density_at_separatrix)
    and [boron_density_at_limiter](name:boron_density_at_limiter).


    Sign convention: Positive when the boron ion density is defined as a volume number
    density, always non-negative.


    Cross-references: [electron_density_at_separatrix](name:electron_density_at_separatrix),
    [helium_4_density_at_pedestal](name:helium_4_density_at_pedestal), [deuterium_tritium_velocity_at_pedestal](name:deuterium_tritium_velocity_at_pedestal).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density_at_separatrix
  - name:boron_density_at_limiter
  - name:electron_density_at_separatrix
  - name:helium_4_density_at_pedestal
  - name:deuterium_tritium_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/boron/value
    dd_path: summary/local/pedestal/n_i/boron/value
    status: composed
- name: current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Electric current density arising from the diamagnetic drift of charged
    species in a magnetized plasma, driven by the ion pressure gradient.
  documentation: 'The diamagnetic drift current density $

    mathbf{j}_{\rm dia} = ( \mathbf{B} \times \nabla p_i ) / B^2$ arises from the
    gyromotion of ions in the presence of a pressure gradient perpendicular to the
    magnetic field. This current is a fundamental component of the total current density
    in the edge plasma, where large pressure gradients drive significant diamagnetic
    flows. Typical edge values for the ion diamagnetic current density magnitude range
    from $10^4$ to $10^6$ A/m$^{-2}$, scaling with the product of the local pressure
    gradient and the inverse magnetic field strength. This quantity is closely related
    to the ion diamagnetic drift velocity described in `ion_velocity_due_to_diamagnetic_drift`,
    and it forms part of the broader ion-neutral friction current density system alongside
    `current_density_due_to_ion_neutral_friction` and its projected components `radial_current_density_due_to_diamagnetic_drift`
    and `vertical_current_density_due_to_diamagnetic_drift`.


    Sign convention: Positive when the diamagnetic current flows in the direction
    of $\mathbf{B} \times \nabla p_i$, following the right-handed cylindrical $(R,
    \phi, Z)$ convention.


    Measurement techniques include direct inference from kinetic-profile gradients
    via equilibrium reconstruction, or from probe arrays in the scrape-off layer.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:plasma_profiles/ggd/j_ion_neutral_friction/diamagnetic
    dd_path: plasma_profiles/ggd/j_ion_neutral_friction/diamagnetic
    status: composed
  - id: sn:current_density_due_to_diamagnetic_drift
    status: composed
- name: deuterium_tritium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal rotation velocity of the deuterium-tritium thermal ion population
    at the top of the edge pedestal.
  documentation: "The deuterium-tritium velocity at the pedestal top characterizes\
    \ the toroidal rotation of the main fuel-ion mixture at the outermost region of\
    \ steep pressure gradient in H-mode plasmas. This velocity is typically inferred\
    \ from charge-exchange recombination spectroscopy (CXRS) measurements of the Doppler\
    \ shift of a suitable impurity line, which is then mapped to the main-ion rotation\
    \ through neoclassical corrections. In the edge pedestal, toroidal rotation velocities\
    \ can reach 20\u2013100 km/s in conventional tokamaks, with the sign indicating\
    \ the direction of co- or counter-current rotation relative to the plasma current.\
    \ The pedestal rotation plays a critical role in determining the $E \\times B$\
    \ shearing rate, which suppresses edge turbulence and regulates pedestal height;\
    \ it is closely related to flux-surface-averaged rotation quantities such as [flux_surface_averaged_deuterium_tritium_velocity](name:flux_surface_averaged_deuterium_tritium_velocity).\
    \ Rotation at the pedestal top also provides a boundary condition for core rotation\
    \ profile evolution and is often compared with the rotation at the magnetic axis\
    \ ([deuterium_tritium_velocity_at_magnetic_axis](name:deuterium_tritium_velocity_at_magnetic_axis))\
    \ and at the separatrix ([deuterium_tritium_velocity_at_separatrix](name:deuterium_tritium_velocity_at_separatrix))\
    \ to infer the radial electric field structure.\n\nSign convention: Positive when\
    \ the toroidal velocity is in the direction of increasing toroidal angle $\\phi$\
    \ (counter-clockwise viewed from above), typically aligned with the plasma current\
    \ direction."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_deuterium_tritium_velocity
  - name:deuterium_tritium_velocity_at_magnetic_axis
  - name:deuterium_tritium_velocity_at_separatrix
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/deuterium_tritium/value
    dd_path: summary/local/pedestal/velocity_phi/deuterium_tritium/value
    status: composed
- name: deuterium_tritium_velocity_at_separatrix
  kind: scalar
  status: draft
  description: Toroidal velocity of the deuterium-tritium fuel ion population at the
    outermost closed flux surface.
  documentation: 'The toroidal velocity $v_{\phi,\mathrm{DT}}$ of deuterium-tritium
    ions at the separatrix quantifies the bulk rotation of the fusion fuel species
    at the plasma edge. Rotation is a key parameter for MHD stability, confinement
    mode transitions, and pedestal dynamics, with typical values ranging from 10 to
    100 km/s in the H-mode edge of medium-size tokamaks, depending on neutral beam
    torque input. This quantity is primarily measured via charge exchange recombination
    spectroscopy (CXRS) on the intrinsic or injected DT population, leveraging the
    Doppler shift of emission lines from the $n=8\to7$ transition in the visible spectrum.


    Sign convention: Positive when $v_{\phi}$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).


    Related standard names include the velocity at other radial positions, such as
    [deuterium_tritium_velocity_at_magnetic_axis](name:deuterium_tritium_velocity_at_magnetic_axis)
    and [deuterium_tritium_velocity_at_pedestal](name:deuterium_tritium_velocity_at_pedestal),
    as well as the flux-surface-averaged counterpart [flux_surface_averaged_deuterium_tritium_velocity](name:flux_surface_averaged_deuterium_tritium_velocity).
    The impurity companion [toroidal_tungsten_velocity_at_separatrix](name:toroidal_tungsten_velocity_at_separatrix)
    is used for comparison between main-ion and impurity rotation profiles.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_tritium_velocity_at_magnetic_axis
  - name:deuterium_tritium_velocity_at_pedestal
  - name:flux_surface_averaged_deuterium_tritium_velocity
  - name:toroidal_tungsten_velocity_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/velocity_phi/deuterium_tritium/value
    dd_path: summary/local/separatrix/velocity_phi/deuterium_tritium/value
    status: composed
- name: electron_density_at_separatrix
  kind: scalar
  status: draft
  description: Electron number density at the separatrix, the outermost closed flux
    surface of the confined plasma.
  documentation: 'The electron number density at the separatrix characterizes the
    plasma density at the LCFS boundary separating the confined core from the scrape-off
    layer. It serves as a key pedestal parameter, often used as the offset value in
    modified hyperbolic tangent (mtanh) fits to edge density profiles. Typical values
    in H-mode tokamak plasmas range from $10^{18}$ to $10^{20}$ m$^{-3}$, depending
    on fueling, confinement regime, and divertor conditions. The separatrix density
    is inferred from Thomson scattering or lithium beam diagnostics and is related
    to the pedestal gradient and the upstream density for divertor detachment control.
    See also [electron_pressure_at_separatrix](name:electron_pressure_at_separatrix)
    for the corresponding pressure boundary parameter and [lithium_density_at_separatrix](name:lithium_density_at_separatrix)
    for an impurity density at the same location.


    Sign convention: Positive when the number density is above zero.


    The value is always non-negative.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_separatrix
  - name:lithium_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/n_e/value
    dd_path: summary/local/separatrix/n_e/value
    status: composed
  - id: dd:summary/pedestal_fits/linear/n_e/separatrix/value
    dd_path: summary/pedestal_fits/linear/n_e/separatrix/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/n_e/separatrix/value
    dd_path: summary/pedestal_fits/mtanh/n_e/separatrix/value
    status: composed
- name: electron_energy_diffusivity
  kind: scalar
  status: draft
  description: Cross-field thermal diffusivity of the electron population in the edge
    plasma, governing the radial transport of electron thermal energy via a diffusive
    closure.
  documentation: The electron energy diffusivity $\chi_e$ is the coefficient in the
    Fick's-law closure $Q_e = -n_e \chi_e \nabla T_e$ relating the radial electron
    heat flux $Q_e$ to the gradient of the electron temperature $T_e$, where $n_e$
    is the electron density. It parameterizes the dominant turbulent transport channel
    for electron thermal energy in the outer region of confined plasmas, including
    the pedestal and scrape-off layer. Typical values range from $0.1\,\text{m}^2\text{s}^{-1}$
    in the H-mode pedestal to $10\,\text{m}^2\text{s}^{-1}$ in the scrape-off layer.
    The quantity is inferred from power-balance analysis or interpreted from gyrokinetic
    simulations of microturbulence (e.g., electron-temperature-gradient modes). It
    complements the [ion energy diffusivity](name:ion_energy_diffusivity) and the
    [electron particle diffusivity](name:particle_diffusivity) in the set of anomalous
    transport coefficients. The electron energy diffusivity is sign-invariant (inherently
    non-negative) and is defined per grid element on the transport grid.
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_energy_diffusivity
  - name:particle_diffusivity
  sources:
  - id: dd:core_transport/model/profiles_1d/electrons/energy/d
    dd_path: core_transport/model/profiles_1d/electrons/energy/d
    status: attached
  - id: dd:edge_transport/model/ggd/electrons/energy/d/values
    dd_path: edge_transport/model/ggd/electrons/energy/d/values
    status: composed
- name: electron_particle_flux
  kind: scalar
  status: draft
  description: Incident particle flux of electrons onto the wall surface in a tokamak
    plasma.
  documentation: The incident electron particle flux $\Gamma_e$ quantifies the rate
    at which electrons from the scrape-off layer (SOL) impinge on the plasma-facing
    wall surface. It is defined as $\Gamma_e = n_e v_{\perp,e}$, where $n_e$ is the
    local electron density and $v_{\perp,e}$ is the component of the electron velocity
    directed towards the wall. This flux is a key quantity for determining the net
    wall particle balance, which is the difference between the incident flux and the
    emitted flux due to processes such as reflection and surface emission, as captured
    by [electron_particle_flux_of_wall_due_to_surface_emission](name:electron_particle_flux_of_wall_due_to_surface_emission).
    Typical values in the SOL of a magnetically confined plasma range from $10^{21}$
    to $10^{24}$ m$^{-2}$s$^{-1}$, depending on the discharge conditions and proximity
    to the separatrix. The net electron particle flux at the wall is a critical input
    for models of plasma-wall interactions, erosion, and material migration. See also
    [neutral_state_particle_flux](name:neutral_state_particle_flux) for the corresponding
    neutral particle flux at the wall and [ion_state_particle_flux](name:ion_state_particle_flux)
    for the ion flux in a specific charge state.
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_particle_flux_of_wall_due_to_surface_emission
  - name:neutral_state_particle_flux
  - name:ion_state_particle_flux
  sources:
  - id: dd:edge_transport/model/ggd/electrons/particles/flux/values
    dd_path: edge_transport/model/ggd/electrons/particles/flux/values
    status: composed
  - id: dd:wall/description_ggd/ggd/particle_fluxes/electrons/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/electrons/incident/values
    status: composed
- name: electron_pressure_at_separatrix
  kind: scalar
  status: draft
  description: Electron pressure at the separatrix, serving as the offset parameter
    in a modified hyperbolic tangent (mtanh) fit to the edge pedestal pressure profile.
  documentation: "The electron pressure at the separatrix, $p_e(\\psi_{\\rm sep})$,\
    \ is the value obtained from the offset parameter of a modified hyperbolic tangent\
    \ (mtanh) function fitted to the edge pedestal electron pressure profile. This\
    \ offset represents the electron pressure on the outermost closed flux surface,\
    \ which is a critical boundary condition for scrape-off layer (SOL) and divertor\
    \ modeling. The separatrix electron pressure is typically inferred from Thomson\
    \ scattering or electron cyclotron emission measurements, combined with equilibrium\
    \ reconstruction, and is related to the upstream density and temperature via $p_e\
    \ = n_e k_B T_e$ where $n_e$ is the electron density, $k_B$ is the Boltzmann constant,\
    \ and $T_e$ is the electron temperature. Typical values in H-mode plasmas range\
    \ from 0.1\u20135 kPa, strongly depending on plasma current, heating power, and\
    \ fueling conditions.\n\nSign convention: Positive when the electron pressure\
    \ at the separatrix exceeds the local neutral gas pressure, as is typical in confined\
    \ plasma conditions.\n\nSee also [electron_density_at_separatrix](name:electron_density_at_separatrix)\
    \ and [electron_temperature_at_divertor_plate](name:electron_temperature_at_divertor_plate)\
    \ for related edge plasma parameters."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_separatrix
  - name:electron_temperature_at_divertor_plate
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/offset/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/offset/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/pressure_electron/offset/value
    dd_path: summary/pedestal_fits/mtanh/pressure_electron/offset/value
    status: composed
- name: fast_neutral_density
  kind: scalar
  status: draft
  description: Number density of suprathermal neutral particles that are not in thermal
    equilibrium with the background plasma.
  documentation: 'The fast neutral density $n_\mathrm{fast}$ represents the population
    of neutral particles with kinetic energies significantly above the thermal energy
    of the bulk neutral gas, typically generated by charge-exchange recombination
    of hot ions or by neutral beam injection. In the edge and scrape-off layer, fast
    neutrals are an important channel for momentum and energy transport, as they can
    travel long distances before undergoing ionization or charge-exchange collisions.
    Typical values range from $10^{15}\,\mathrm{m}^{-3}$ in the far SOL to $10^{18}\,\mathrm{m}^{-3}$
    near the separatrix, depending on the plasma density and neutral source rate.
    This quantity is inferred from collisional-radiative models constrained by spectroscopic
    measurements of Balmer and Lyman line emission. See also [neutral_state_density](name:neutral_state_density)
    for the total neutral density and [perpendicular_fast_neutral_pressure](name:perpendicular_fast_neutral_pressure)
    for the anisotropic pressure of this population.


    Sign convention: Positive when the fast neutral particle count per unit volume
    is greater than zero.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_density
  - name:perpendicular_fast_neutral_pressure
  sources:
  - id: dd:edge_profiles/ggd/neutral/state/density_fast/values
    dd_path: edge_profiles/ggd/neutral/state/density_fast/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/neutral/density_fast
    dd_path: edge_profiles/profiles_1d/neutral/density_fast
    status: composed
- name: flux_surface_averaged_helium_4_density_at_separatrix
  kind: scalar
  status: draft
  description: Flux-surface-averaged volume number density of helium-4 (alpha particle)
    ions at the last closed flux surface.
  documentation: "The flux-surface-averaged helium-4 ion density at the separatrix\
    \ provides the boundary condition for alpha particle transport models in the pedestal\
    \ and scrape-off layer. This quantity is obtained by averaging the local alpha\
    \ density $n_{\\alpha}(R, \\phi, Z)$ over a flux surface at the separatrix radius,\
    \ resolving the $\\left\\langle n_{\\alpha} \\right\\rangle_{\\psi}$ value that\
    \ sets the alpha-particle density entering the SOL. Typical values in ITER-relevant\
    \ H-mode plasmas range from $10^{16}\\,\\text{m}^{-3}$ to $10^{18}\\,\text{m}^{-3}$,\
    \ depending on fusion power and fast particle confinement. It is measured by charge-exchange\
    \ recombination spectroscopy (CXRS) on He II emission (468.6 nm) or inferred from\
    \ neutron yield and neutral particle analyzer data, and paired with the local\
    \ flux-surface-resolved electron temperature to compute the alpha thermal pressure.\
    \ See also the non-averaged local quantity at this surface via [helium_4_density_at_separatrix](name:helium_4_density_at_separatrix)\
    \ and flux-surface-averaged quantities for other species in [flux_surface_averaged_lithium_density_at_separatrix](name:flux_surface_averaged_lithium_density_at_separatrix).\n\
    \nSign convention: Positive when the local alpha density is positive at each point\
    \ on the separatrix flux surface.\n\nTypical values: $10^{16}$\u2013$10^{18}\\\
    text{ m}^{-3}$ in high-power H-mode discharges on present devices and ITER baseline\
    \ scenarios."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_4_density_at_separatrix
  - name:flux_surface_averaged_lithium_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix_average/n_i/helium_4/value
    dd_path: summary/local/separatrix_average/n_i/helium_4/value
    status: composed
- name: flux_surface_averaged_lithium_density_at_separatrix
  kind: scalar
  status: draft
  description: Flux-surface-averaged volume number density of lithium ions at the
    separatrix, the outermost closed flux surface.
  documentation: 'The quantity represents the toroidally and poloidally averaged lithium
    ion number density on the last closed flux surface, quantifying the lithium impurity
    content in the plasma edge. This average is computed as $\langle n_{\mathrm{Li}}
    \rangle_{\psi} = \oint n_{\mathrm{Li}} \, dl / \oint dl$, where $\langle \cdot
    \rangle_{\psi}$ denotes the flux-surface average, $n_{\mathrm{Li}}$ is the local
    lithium density in m$^{-3}$, and $dl$ is the poloidal arc length. The separatrix
    value serves as a key boundary condition for impurity transport modeling and for
    assessing the screening efficiency of the scrape-off layer. It is typically inferred
    from spectroscopic measurements combined with equilibrium reconstruction, or from
    interpretive codes like SOLPS. Typical values in lithium-seeded tokamaks range
    from $10^{15}$ to $10^{18}$ m$^{-3}$, depending on the seeding rate and plasma
    conditions. This quantity is closely related to $[\text{lithium density at separatrix}](name:lithium_density_at_separatrix)$,
    which gives the local value without flux-surface averaging, and to $[\text{line-averaged
    lithium density}](name:line_averaged_lithium_density)$, which reflects the core
    content.


    Sign convention: Positive when the lithium ion density is non-zero, as particle
    density is a non-negative scalar quantity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:lithium_density_at_separatrix
  - name:line_averaged_lithium_density
  sources:
  - id: dd:summary/local/separatrix_average/n_i/lithium/value
    dd_path: summary/local/separatrix_average/n_i/lithium/value
    status: composed
- name: gradient_of_electron_pressure
  kind: scalar
  status: draft
  description: Maximum radial gradient of the electron pressure in the pedestal region,
    quantifying the steepest rate of pressure decrease across the edge transport barrier.
  documentation: "The gradient of the electron pressure $\\nabla p_e$ in the radial\
    \ direction characterizes the drive for the diamagnetic current and is a key parameter\
    \ determining the pedestal height and height in H-mode plasmas. The maximum radial\
    \ gradient $|\\nabla p_e|_{\\mathrm{max}}$ occurs at the location of steepest\
    \ pressure fall, typically near the pedestal top or separatrix, and sets the bootstrap\
    \ current magnitude via the relation $j_{\\mathrm{BS}} \\propto -\\nabla p_e$.\
    \ Measured profile fits (modified hyperbolic tangent or linear) to Thomson scattering\
    \ or lithium-beam emission data yield values of $|\\nabla p_e|_{\\mathrm{max}}$\
    \ in the range $10^5$\u2013$10^7$ Pa/m for typical tokamaks. The sign of $\\nabla\
    \ p_e$ is negative (pressure decreasing radially outward) in standard confinement;\
    \ the reported magnitude is taken as the maximum of this negative gradient.\n\n\
    Sign convention: Positive when the electron pressure decreases radially outward,\
    \ giving a positive $|\\nabla p_e|_{\\mathrm{max}}$.\n\nSee also [gradient_of_electron_density](name:gradient_of_electron_density)\
    \ and [gradient_of_electron_temperature_at_pedestal](name:gradient_of_electron_temperature_at_pedestal)\
    \ for the component gradient profiles, and [electron_pressure](name:electron_pressure)\
    \ for the base pressure field."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:gradient_of_electron_density
  - name:gradient_of_electron_temperature_at_pedestal
  - name:electron_pressure
  arguments:
  - name: electron_pressure
    operator: gradient
    operator_kind: unary_prefix
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm_max/value
    status: composed
