- name: area_of_optical_element
  kind: scalar
  status: active
  description: Total geometric surface area of the optically active surface of a device
    component, equal to the actual material area capable of interacting with radiation
    rather than the projected aperture area.
  documentation: "Geometric surface area is the integral of the differential area\
    \ element $dA$ over the full extent of the optically active material surface:\n\
    \n$$\nA = \\int_{\\mathcal{S}} dA\n$$\n\nwhere $\\mathcal{S}$ denotes the physical\
    \ surface of the component. This quantity measures the actual curved or planar\
    \ material area, not the projected cross-sectional aperture seen from a particular\
    \ viewing direction.\n\nThe scope of integration is the optically active region\
    \ \u2014 the surface or surfaces that participate in radiation interaction (reflection,\
    \ transmission, absorption, or scattering). For a component with multiple optically\
    \ active faces, all contributing faces are included in the total. The [surface\
    \ area of an optical element](name:surface_area_of_optical_element) is a concrete\
    \ instance of this quantity, where the surface is the optically active face of\
    \ a diagnostic or beam-line optical component. This quantity is intrinsically\
    \ non-negative and is independent of the orientation of any illuminating beam."
  unit: m^2
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_area_of_optical_element
- name: charge_at_limiter
  kind: scalar
  status: active
  description: Charge at a limiter is a charge-number-related scalar characterizing
    the ion charge-state composition of plasma immediately adjacent to a plasma-facing
    limiter surface. This parent quantity covers specifically defined limiter charge
    measures without fixing a particular charge-state weighting or averaging convention.
  documentation: 'Charge at a limiter is a charge-number-related scalar for the local
    ion charge-state composition of plasma immediately adjacent to a plasma-facing
    limiter surface. It is the parent concept for specifically defined charge measures
    evaluated at that limiter-adjacent plasma locus.


    This parent does not prescribe a charge-state weighting, species aggregation,
    or normalization; those are defined by its concrete children. For example, [effective
    charge at limiter](name:effective_charge_at_limiter) is the charge-squared-weighted
    mean charge number at the same locus, whereas this parent denotes only the shared
    charge-at-limiter abstraction.


    It is not the electrical charge deposited on, stored by, or flowing into the limiter
    material, and it is not a particle, heat, or current flux to the surface.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:effective_charge_at_limiter
  - name:charge_at_plasma_boundary
- name: density_at_limiter
  kind: scalar
  status: active
  description: Local number density of a selected charged plasma population evaluated
    immediately on the plasma-facing side of a limiter surface.
  documentation: "This quantity is the local number density of a selected charged\
    \ plasma population at the plasma-facing side of a limiter. The selection may\
    \ be electrons, an ion species summed over its ionization states, or a defined\
    \ fuel pseudo-species formed by combining constituent ion populations.\n\n$$\n\
    n_s(\\mathbf{r}_L)=\\frac{dN_s}{dV}\n$$\n\nwhere $n_s$ is the selected population\
    \ number density in m$^{-3}$, $N_s$ is the number of counted particles, $V$ is\
    \ volume in m$^3$, and $\\mathbf{r}_L$ is the limiter-side evaluation position\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame. The position is immediately\
    \ adjacent to the plasma-facing limiter, on the plasma side of the magnetic presheath\
    \ or sheath entrance.\n\nPopulation aggregation is part of the specialization:\
    \ ion species quantities may be summed over positive ionization states while excluding\
    \ neutrals, electrons count the electron population, and the deuterium\u2013tritium\
    \ pseudo-species combines the corresponding ion densities. Concrete members include\
    \ [electron density at a limiter](name:electron_density_at_limiter), [ion density\
    \ at a limiter](name:ion_density_at_limiter), and [deuterium-tritium density at\
    \ a limiter](name:deuterium_tritium_density_at_limiter). The bare quantity does\
    \ not imply a sum over all charged populations.\n\nSign convention: Positive when\
    \ the selected charged population is present at the limiter-side evaluation location."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density_at_limiter
  - name:ion_density_at_limiter
  - name:deuterium_tritium_density_at_limiter
- name: argon_density_at_limiter
  kind: scalar
  status: active
  description: Argon ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all positive ionization states
    and excluding neutral argon atoms.
  documentation: 'Argon density at a limiter is the local number density of argon
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, and neutral argon atoms are excluded.


    The charge-state-summed density is defined by


    $$

    n_{\mathrm{Ar}}(\mathbf{r}_L)=\sum_{q>0} n_{\mathrm{Ar}^{q+}}(\mathbf{r}_L)

    $$


    where $n_{\mathrm{Ar}}$ and $n_{\mathrm{Ar}^{q+}}$ are number densities in m$^{-3}$,
    $q$ is the positive argon ionization state, and $\mathbf{r}_L$ is the limiter-side
    position in the right-handed cylindrical $(R, \phi, Z)$ frame.


    This is the argon-specific member of [density at a limiter](name:density_at_limiter).
    It counts argon ions rather than the electrons represented by [electron density
    at a limiter](name:electron_density_at_limiter), and is local rather than the
    flux-surface average represented by [flux-surface-averaged argon density at the
    plasma boundary](name:flux_surface_averaged_argon_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:electron_density_at_limiter
  - name:flux_surface_averaged_argon_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
    operator: argon
    operator_kind: qualifier
  sources:
