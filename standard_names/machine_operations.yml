    dd_path: plasma_initiation/global_quantities/ion/element/a
    status: composed
- name: plasma_duration
  kind: scalar
  status: draft
  description: Duration of the confined plasma phase within a pulse. Starts at plasma
    breakdown and ends at loss of confinement, defined as the interval of measurable
    plasma current.
  documentation: 'Plasma duration is the total time from the moment of plasma breakdown
    (formation of the first closed flux surfaces with significant ionization) to the
    instant when the plasma loses confinement and transitions into a non-confined
    state. The end of the interval is determined by a rapid decrease in plasma current
    or stored energy below a diagnostic threshold, marking the loss of magnetic or
    kinetic confinement. Typical values for tokamaks range from hundreds of milliseconds
    to several minutes, while stellarators may sustain steady-state plasmas for many
    minutes. This quantity is fundamental for assessing energy confinement time, pulse
    reliability, and operational limits. It is derived from diagnostics such as plasma
    current ($I_p$) and diamagnetic stored energy ($W_\mathrm{dia}$), which provide
    unambiguous markers of confinement termination. The duration corresponds to the
    interval where $I_p(t) > I_\mathrm{thresh}$ or $W_\mathrm{dia}(t) > 0$, with thresholds
    set according to facility-specific criteria.


    Sign convention: Positive when the confined phase interval is measured in forward
    chronological time.'
  unit: s
  physics_domain: machine_operations
  links:
  - name:plasma_time
  - name:toroidal_electric_field
  sources:
  - id: dd:summary/plasma_duration/value
    dd_path: summary/plasma_duration/value
    status: composed
- name: plasma_volume
  kind: scalar
  status: draft
  description: Total spatial volume enclosed by the plasma boundary surface, encompassing
    the confined plasma region.
  documentation: "The total plasma volume is the 3D spatial region bounded by the\
    \ last closed flux surface (LCFS) or the plasma-facing wall. It is a fundamental\
    \ geometric parameter derived from equilibrium reconstruction, computed by integrating\
    \ the volume element $dV = 2\\pi R\\, dR\\, dZ$ over the poloidal cross-section\
    \ within the boundary. Typical volumes range from $1\\text{\u2013}100\\,\\text{m}^3$\
    \ for medium-size tokamaks to $840\\,\\text{m}^3$ for ITER. This quantity relates\
    \ to [volume_of_flux_surface](name:volume_of_flux_surface), which gives the volume\
    \ enclosed by each magnetic flux surface rather than the total confined region.\n\
    \nSign convention: Positive when the enclosed spatial region is finite and oriented\
    \ in the standard right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m^3
  physics_domain: machine_operations
  links:
  - name:volume_of_flux_surface
  sources:
