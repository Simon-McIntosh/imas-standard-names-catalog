- name: volume_averaged_neutral_species_density
  kind: scalar
  status: draft
  description: Volume average of the number density of neutral particles over the
    plasma volume enclosed by the last closed flux surface.
  documentation: 'The volume-averaged neutral species density quantifies the mean
    number density of neutral atoms and molecules within the plasma volume bounded
    by the last closed flux surface (LCFS). Neutrals arise from edge recycling at
    plasma-facing walls, gas injection, and charge-exchange reactions, and their inventory
    affects ionization balance, fueling efficiency, and momentum exchange between
    the plasma and neutral background.


    The volume average is defined as:


    $$

    \langle n_0 \rangle = \frac{1}{V} \int_V n_0(\mathbf{r}) \, dV

    $$


    where $n_0(\mathbf{r})$ is the local neutral number density at position $\mathbf{r}$
    and $V$ is the volume enclosed by the LCFS.


    This global scalar condenses the spatially resolved neutral_species_density profile
    into a single quantity well suited for particle balance analysis and for monitoring
    the neutral inventory during plasma initiation and ramp-up. It is typically estimated
    from spectroscopic line emission or neutral pressure gage measurements combined
    with ionization balance modeling. As the neutral counterpart to [volume_averaged_total_ion_density](name:volume_averaged_total_ion_density),
    it contributes to total particle inventory alongside the ion and electron populations
    described by total_electron_ion_neutral_particle_number_density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:volume_averaged_total_ion_density
  sources:
  - id: dd:plasma_initiation/global_quantities/neutral/density_volume_average
    dd_path: plasma_initiation/global_quantities/neutral/density_volume_average
    status: composed
- name: vorticity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Signed field-parallel component of the curl of the diamagnetic drift
    velocity for a plasma species or effective fluid. It measures rotation of the
    pressure-gradient-driven cross-field drift and is distinct from radial, poloidal,
    and toroidal vorticity components.
  documentation: 'Vorticity due to diamagnetic drift is the signed field-parallel
    scalar component of the curl of the diamagnetic drift velocity. It represents
    local rotation of the pressure-gradient-driven cross-field drift about the magnetic-field
    direction for the species or effective fluid whose pressure gradient defines the
    drift. It is related to [parallel_vorticity](name:parallel_vorticity), [toroidal_vorticity](name:toroidal_vorticity),
    [poloidal_vorticity](name:poloidal_vorticity), and [radial_vorticity](name:radial_vorticity),
    but it identifies the diamagnetic-drift contribution rather than the total vorticity
    component.


    The field-parallel scalar is defined by projecting the curl of the diamagnetic
    drift velocity onto the local magnetic-field direction:


    $$

    \omega_{\mathrm{dia},s} = \hat{\mathbf{b}} \cdot \left(\nabla \times \mathbf{v}_{\mathrm{dia},s}\right)

    $$


    where $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$, $\mathbf{B}$ is the magnetic
    field, and $\mathbf{v}_{\mathrm{dia},s}$ is the diamagnetic drift velocity of
    species $s$. For a scalar-pressure fluid, $\mathbf{v}_{\mathrm{dia},s} = \mathbf{B}
    \times \nabla p_s /(q_s n_s |\mathbf{B}|^2)$, with $p_s$ the pressure, $n_s$ the
    number density, and $q_s$ the signed particle charge; electron and ion contributions
    therefore have opposite drift directions for the same pressure gradient.


    In practice this quantity is evaluated from pressure and density gradients together
    with the magnetic-field geometry, followed by spatial differentiation of the diamagnetic
    drift velocity and projection along $\hat{\mathbf{b}}$. It is sensitive to pressure-gradient
    length scale, magnetic-shear and curvature effects, and numerical smoothing because
    it contains derivatives of a drift velocity that is itself gradient-driven.


    Typical magnitudes in tokamak edge and scrape-off-layer plasmas are 10^4-10^6
    s^-1 in broad-gradient regions and 10^5-10^7 s^-1 in steep pedestal or filamentary
    structures. Values can pass through zero where the pressure gradient or its curvature
    is weak, and the sign may reverse across pressure-gradient extrema or when the
    magnetic-field direction is reversed.


    Sign convention: Positive when $\nabla \times \mathbf{v}_{\mathrm{dia},s}$ points
    along the local magnetic-field unit vector $\hat{\mathbf{b}}$.'
  unit: s^-1
  physics_domain: edge_plasma_physics
  links: []
- name: xenon_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Xenon density at the pedestal top is the particle count per volume
    for xenon impurity ions at the core-side shoulder of the H-mode edge transport
    barrier, where the steep density gradient transitions to the flatter confined-core
    variation, summed over all ionization charge states unless a particular charge
    state is named.
  documentation: 'Xenon density at the pedestal top is the particle count per volume
    for xenon impurity ions evaluated at the core-side shoulder of an H-mode pedestal.
    The pedestal top is the transition where the steep-gradient edge transport barrier
    meets the flatter confined-core density variation, distinct from a separatrix
    or plasma-boundary value. Unless a particular charge state is explicitly named,
    the species-level xenon density is summed over all ionization charge states from
    singly ionized Xe$^+$ through fully stripped Xe$^{54+}$; neutral xenon atoms are
    not included, and $n_{\mathrm{Xe}} \ge 0$.


    For xenon on the pedestal-top flux surface, the defining local charge-state sum
    is


    $$

    n_{\mathrm{Xe}}(\xi_{\mathrm{ped,top}}) = \sum_{k=1}^{54} n_{\mathrm{Xe}^{k+}}(\xi_{\mathrm{ped,top}})

    $$


    where $n_{\mathrm{Xe}}$ is the charge-state-summed xenon ion number density in
    $\mathrm{m^{-3}}$, $n_{\mathrm{Xe}^{k+}}$ is the number density of xenon ions
    with charge $+k$ in $\mathrm{m^{-3}}$, and $\xi_{\mathrm{ped,top}}$ is the explicitly
    chosen radial label of the pedestal-top flux surface, for example normalized toroidal
    flux radius $\rho_\mathrm{tor,norm}$ or normalized poloidal flux $\psi_N$.


    In practice, pedestal-top xenon density is inferred by fitting species-sensitive
    edge measurements across the pedestal and evaluating the charge-state-summed density
    at the top location, often identified from the change in gradient. Constraints
    can come from soft X-ray spectroscopy, vacuum-ultraviolet or extreme-ultraviolet
    line emission, bolometry combined with impurity-radiation modeling, charge-exchange
    spectroscopy when suitable lines are available, and collisional-radiative charge-balance
    calculations. Related pedestal-top quantities include [electron density at pedestal
    top](name:electron_density_at_pedestal_top), [ion density at pedestal top](name:ion_density_at_pedestal_top),
    [argon density at pedestal top](name:argon_density_at_pedestal_top), and [iron
    density at pedestal top](name:iron_density_at_pedestal_top).


    Typical seeded H-mode tokamak pedestal-top xenon densities are 10^15-10^18 m^-3,
    usually several orders of magnitude below the bulk electron density and often
    about 10^-5-10^-2 of it. Even at trace concentration, xenon can strongly affect
    radiated power and effective charge because of its large nuclear charge and many
    bound-electron transitions; unseeded background levels may be below spectroscopic
    detectability.'
  unit: m^-3
  physics_domain: edge_plasma_physics
