- name: requested_voltage_of_neutron_detector
  kind: scalar
  status: active
  description: Commanded bias potential difference applied between a neutron-detector
    module's bias terminal and electrical return, not its raw output signal.
  documentation: 'The commanded bias voltage is the electrical potential difference
    specified for energizing a neutron-detector module between its bias terminal and
    return or reference terminal. It is a setpoint, distinct from the instantaneous
    detector waveform represented by [voltage of neutron detector].


    $$

    V_{\mathrm{bias,set}} = \phi_{\mathrm{bias}} - \phi_{\mathrm{ref}}

    $$


    where $V_{\mathrm{bias,set}}$ is the commanded bias voltage, and $\phi_{\mathrm{bias}}$
    and $\phi_{\mathrm{ref}}$ are the electrical potentials of the bias and return/reference
    terminals, respectively, expressed in volts.


    The quantity specifies the intended applied potential and excludes the measured
    supply output, detector signal amplitude, pulse waveform, and derived neutron
    count rate. Its setpoint meaning distinguishes it from the detector bias voltage
    represented by [voltage of mass spectrometer](name:voltage_of_mass_spectrometer)
    and the spectrometer supply command [requested voltage of spectrometer](name:requested_voltage_of_spectrometer).


    Sign convention: Positive when the bias terminal is at higher electrical potential
    than the return or reference terminal.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:voltage_of_mass_spectrometer
  - name:requested_voltage_of_spectrometer
  sources:
  - dd_path: neutron_diagnostic/detector/supply_high_voltage/voltage_set
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-supply_high_voltage-voltage_set
    dd_documentation:
