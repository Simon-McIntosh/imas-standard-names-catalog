- name: tilt_angle_of_passive_loop
  kind: scalar
  status: draft
  description: Tilt angle of the directed reference axis for the oblique cross-section
    of a passive conducting loop element. It is measured in the poloidal plane of
    the right-handed cylindrical (R, phi, Z) frame, with zero along +R and positive
    rotation from +R toward +Z.
  documentation: 'The tilt angle of a passive conducting loop is the orientation of
    the directed reference axis used to describe an oblique cross-section, such as
    a parallelogram or trapezoid, in the poloidal plane. The reference axis is the
    cross-section side or side-family direction associated with the oblique tilt parameter,
    not the toroidal direction of the loop itself.


    Let $\hat{e}_\beta$ be the unit vector along this directed cross-section reference
    axis in the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame.
    The tilt angle $\beta$ is defined by


    $$

    \beta = \operatorname{atan2}(\hat{e}_\beta \cdot \hat{Z},\, \hat{e}_\beta \cdot
    \hat{R})

    $$


    where $\hat{R}$ is the outward major-radius basis vector and $\hat{Z}$ is the
    vertical basis vector. Thus $\beta=0$ corresponds to a reference axis parallel
    to $+R$, and the principal branch is usually taken as $-\pi < \beta \le \pi$;
    angles differing by $2\pi$ describe the same directed orientation.


    In practice the angle is obtained from engineering geometry, a CAD description,
    or a reconstructed polygonal outline of the passive conductor cross-section. It
    is distinct from the overall toroidal placement angle of a loop and from other
    oblique-shape angles that may describe a second side inclination or another local
    edge direction.


    Typical values are near 0 rad for cross-section axes approximately radial, around
    $\pm 1.57$ rad for nearly vertical axes, and commonly within about -0.8-0.8 rad
    for mildly skewed passive-conductor elements.


    Sign convention: Positive when the directed cross-section reference axis is rotated
    counter-clockwise from the $+R$ direction toward the $+Z$ direction in the poloidal
    plane of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:alpha_angle_of_iron_core_segment
  - name:area_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/oblique/beta
    dd_path: pf_passive/loop/element/geometry/oblique/beta
    status: composed
- name: tilt_angle_of_plasma_filament
  kind: scalar
  status: draft
  description: Tilt angle of a plasma filament is the signed inclination of the oblique
    side of a parallelogram cross-section in a poloidal section of the right-handed
    cylindrical (R, phi, Z) frame. It is measured counterclockwise from the upward
    vertical +Z direction in an R-Z plot with R increasing to the right.
  documentation: 'The tilt angle of a plasma filament is the signed geometric inclination
    of the oblique side of a parallelogram cross-section used to represent an extended
    filamentary plasma current element. The angle is defined in a poloidal cross-section
    of the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    For a unit vector $\mathbf{u}=u_R\hat{R}+u_Z\hat{Z}$ along the oblique side in
    that cross-section, the angle $\beta$ can be written as:


    $$

    \beta = \operatorname{atan2}(-u_R, u_Z)

    $$


    where $u_R$ and $u_Z$ are the radial and vertical components of the side direction.
    This gives $\beta=0$ for an upward vertical side, $\beta=+\pi/2$ for a side pointing
    toward decreasing $R$, and $\beta=-\pi/2$ for a side pointing toward increasing
    $R$.


    In practice, the tilt is obtained from the prescribed or reconstructed filament
    geometry by fitting or selecting the oblique side vector of the parallelogram
    cross-section in the $(R,Z)$ plane. Together with related geometric parameters
    such as [length of plasma filament](name:thickness_of_plasma_filament), [tangential
    length of plasma filament](name:thickness_of_plasma_filament), and [thickness
    of plasma filament](name:thickness_of_plasma_filament), it fixes the shape and
    orientation of the finite current element used in magnetic-field calculations.


    Typical values are often kept within the principal interval $-\pi/2$ to $+\pi/2$
    rad for non-overturned cross-sections. Nearly vertical filaments have values close
    to $0$ rad, while strongly slanted cross-sections may approach magnitudes of about
    $1.57$ rad.


    Sign convention: Positive when the oblique side is rotated counterclockwise from
    the upward vertical $+Z$ direction in an $(R,Z)$ plot of the right-handed cylindrical
    $(R,\phi,Z)$ frame with $R$ increasing to the right.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:thickness_of_plasma_filament
  sources:
  - id: dd:pf_plasma/element/geometry/oblique/beta
    dd_path: pf_plasma/element/geometry/oblique/beta
    status: composed
- name: toroidal_angle_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Toroidal angle of a coil conductor element in the right-handed cylindrical
    (R, phi, Z) frame. It gives the element's azimuthal location about the machine
    symmetry axis.
  documentation: 'The toroidal angle of a coil conductor element is the azimuthal
    coordinate of a geometric point on that element in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. It locates the point around the toroidal symmetry axis relative
    to the facility-defined $\phi=0$ radial half-plane. Because it is an angular coordinate,
    values separated by a full turn represent the same physical direction.


    Given Cartesian coordinates $(x,y,z)$ of the same point in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ frame, with $\hat{z}=\hat{Z}$ and the $+\hat{x}$ direction
    lying in the $\phi=0$ half-plane, the toroidal angle is defined by:


    $$

    \phi = \operatorname{atan2}(y,x)

    $$


    where $\operatorname{atan2}$ returns the signed angle from $+\hat{x}$ to the horizontal
    projection of the point. In this definition the principal branch is $(-\pi,\pi]$;
    an equivalent representative on $[0,2\pi)$ is obtained by adding $2\pi$ to negative
    principal values.


    In practice, this angle is computed from coil-design geometry, survey geometry,
    or transformed Cartesian coordinates of points used to describe the conductor
    element, such as endpoints, center points, or interpolation points. A common zero
    reference and branch should be used consistently, and angles may be unwrapped
    only to follow a continuous conductor without artificial jumps at the branch cut.
    This absolute cylindrical coordinate is distinct from the [toroidal angle of a
    conductor cross-section](name:toroidal_angle_of_toroidal_field_coil), which is
    a relative orientation angle referenced to a local cross-section reference point
    or direction.


    Typical representative values span a full torus: -3.14-3.14 rad on the $(-\pi,\pi]$
    branch, or 0-6.28 rad on the $[0,2\pi)$ branch. In devices with $N$ repeated coil
    sectors, corresponding element locations are often separated by about $2\pi/N$
    rad.


    Sign convention: Positive when the radial direction from the toroidal symmetry
    axis to the conductor-element point is rotated from the $\phi=0$ half-plane toward
    increasing $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, counter-clockwise
    when viewed from above $+\hat{Z}$.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_angle_of_toroidal_field_coil
  sources:
