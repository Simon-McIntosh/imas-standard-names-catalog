      kind: llm
- name: extent_of_detector_pixel
  kind: scalar
  status: active
  description: Extent of a detector pixel is the nonnegative linear size of one pixel
    footprint along either the first or second local tangential axis in the right-handed
    local detector frame (first local tangential, second local tangential, detector
    normal). It excludes optical resolution and spacing or inactive gaps between neighboring
    pixels.
  documentation: 'Extent of a detector pixel is the nonnegative linear size of one
    pixel footprint along a specified in-plane axis of the right-handed local detector
    frame $(\hat{t}_1,\hat{t}_2,\hat{n})$, where $\hat{t}_1$ and $\hat{t}_2$ are the
    first and second local tangential directions in the detector plane and $\hat{n}$
    is the detector-plane normal. The footprint is the area assigned to that pixel
    for geometric mapping or active collection, independent of the optical point-spread
    function.


    For a coordinate $s_a$ along the selected local tangential axis, the extent is
    the separation of the footprint boundaries:


    $$

    r_a = s_{a,+} - s_{a,-}

    $$


    where $a$ is either $1$ or $2$ and selects the axis $\hat{t}_a$, $r_a$ is the
    detector-pixel extent in meters, $s_{a,-}$ and $s_{a,+}$ are the lower and upper
    footprint-boundary coordinates in meters along $\hat{t}_a$, and $s_{a,+} \ge s_{a,-}$.
    Consequently $r_a \ge 0$.


    This quantity is a footprint-edge separation, not the detector-pixel center location,
    the center-to-center pitch, the optical point-spread width, or the spacing or
    inactive gap between neighboring pixels. The detector-pixel center location is
    described by separate coordinate quantities, such as [horizontal coordinate of
    detector pixel] and [vertical coordinate of detector pixel](name:vertical_coordinate_of_detector_pixel).
    The extent equals the pitch along the same selected axis only when adjacent pixel
    footprints tile the detector plane contiguously with negligible inactive gap;
    this condition is independent of whether the footprint is square or non-square.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_detector_pixel
  sources:
  - dd_path: camera_ir/channel/camera/pixel_size
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-pixel_size
