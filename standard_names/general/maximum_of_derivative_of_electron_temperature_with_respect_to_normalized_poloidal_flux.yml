name: maximum_of_derivative_of_electron_temperature_with_respect_to_normalized_poloidal_flux
status: draft
cocos_transformation_type: one_like
description: Peak magnitude of the electron temperature gradient $|dT_e/d\psi_N|$
  across the profile, typically occurring in the H-mode pedestal.
documentation: "This scalar records the maximum absolute value of $dT_e/d\\psi_N$\
  \ over the radial electron temperature profile, where $T_e$ is in eV and $\\psi_N$\
  \ is the normalized poloidal flux. In H-mode, the maximum is located in the steep-gradient\
  \ pedestal region ($\\psi_N \\approx 0.9$\u20131.0) and directly governs the edge\
  \ bootstrap current density $j_{\\rm BS} \\propto dp/d\\psi$, which in turn controls\
  \ peeling\u2013ballooning stability. Typical values range from a few $10^3$ eV/$\\\
  psi_N$ in small devices to $10^5$ eV/$\\psi_N$ in high-performance H-mode discharges.\
  \ Extracted from mtanh or linear pedestal fits applied to high-resolution Thomson\
  \ scattering data. See also `derivative_of_electron_temperature_with_respect_to_normalized_poloidal_flux_at_pedestal`\
  \ for the pedestal-localized value and `electron_temperature_at_plasma_boundary`\
  \ for the boundary temperature."
validity_domain: ''
