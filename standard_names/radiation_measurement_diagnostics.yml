      - hard_x_rays/emissivity_profile_1d/rho_tor_norm
    enhanced_context:
      description: Radial profile of plasma hard X-ray (HXR) emissivity in a specific
        energy band, reconstructed from multi-channel brightness measurements. Characterizes
        the spatial distribution of suprathermal electrons producing bremsstrahlung
        emission.
      kind: llm
- name: height_of_hard_xray_detector
  kind: scalar
  status: active
  description: Full physical extent of a hard X-ray detector aperture along the local
    X2 axis of the detector coordinate frame, applicable to rectangular aperture geometry.
  documentation: "The height of a hard X-ray detector is the full dimension of the\
    \ detector aperture measured along the local X2 axis of the detector coordinate\
    \ frame (X1, X2, X3), where X1 and X2 lie in the nominal aperture plane and X3\
    \ is normal to the detector surface. This geometric parameter is defined for rectangular\
    \ aperture geometries and represents one of two orthogonal in-plane dimensions\
    \ required to fully characterize the aperture opening.\n\nTogether with [width_of_hard_xray_detector](name:width_of_hard_xray_detector),\
    \ which gives the X1 extent, the height defines the total aperture area $A = h\
    \ \\times w$, where $h$ is the X2 extent and $w$ is the X1 extent. The aperture\
    \ area enters the \xE9tendue calculation that determines the photon collection\
    \ efficiency of the diagnostic channel. The analogous X2 dimension for X-ray diagnostic\
    \ filter windows is filter_window_height, which follows the same local-frame X2\
    \ convention.\n\nSign convention: Positive when the aperture extent is measured\
    \ in the direction of increasing X2 coordinate in the local detector frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:width_of_hard_xray_detector
  sources:
