    dd_path: spectrometer_visible/channel/polarization_spectroscopy/temperature_cold_neutrals
    status: composed
- name: cold_neutral_velocity
  kind: scalar
  status: draft
  description: Line-of-sight projected velocity of the cold neutral atom population
    inferred from an emission-line Doppler shift.
  documentation: 'Cold neutral velocity is the scalar projection of the mean velocity
    of the cold neutral atom population along a specified spectrometer line of sight.
    The cold component is the relatively narrow, low-energy neutral emission component,
    complementary to [hot_neutral_velocity](name:hot_neutral_velocity), with the corresponding
    thermal width characterized by [cold_neutral_temperature](name:cold_neutral_temperature).


    For nonrelativistic Doppler shifts, the line-of-sight velocity is determined from
    the signed centroid shift of the cold spectral component:


    $$

    v_\mathrm{los} = c\,\frac{\Delta\lambda_\mathrm{los}}{\lambda_0}

    $$


    where $v_\mathrm{los}$ is the line-of-sight velocity in m.s^-1, $\Delta\lambda_\mathrm{los}$
    is the signed wavelength shift in meters after applying the line-of-sight orientation
    convention, $\lambda_0$ is the rest or central [wavelength_of_spectral_line](name:wavelength_of_spectral_line)
    in meters, and $c$ is the speed of light in m.s^-1. With this definition, $\Delta\lambda_\mathrm{los}>0$
    corresponds to motion from the first line-of-sight point toward the second; depending
    on viewing geometry, this may correspond to either the measured redshift or its
    negative.


    In practice this quantity is obtained from the calibrated centroid of the cold
    component of an atomic emission line. Spectral modeling separates this centroid
    shift from instrumental calibration offsets, line blending, thermal broadening,
    and any broader hot-neutral contribution; the result is only the velocity component
    projected along the observed line of sight, not the full neutral flow vector.


    Typical magnitudes in edge and divertor neutral spectroscopy are of order 1,000-30,000
    m.s^-1, with signed values near zero possible when the neutral flow is weak or
    nearly perpendicular to the line of sight.


    Sign convention: Positive when cold neutral atoms move from the first defining
    point of the line of sight toward the second defining point.'
  unit: m.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hot_neutral_velocity
  - name:hot_neutral_temperature
  - name:neutral_velocity
  - name:cold_neutral_temperature
  arguments:
  - name: neutral_velocity
    operator: cold
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/velocity_cold_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/velocity_cold_neutrals
    status: composed
- name: hot_neutral_temperature
  kind: scalar
  status: draft
  description: Kinetic temperature of the energetic (hot) component of the neutral
    atom population, inferred from the broad Doppler profile of visible spectral line
    emission.
  documentation: "The hot neutral temperature characterizes the energetic component\
    \ of the neutral atom population in the plasma edge and scrape-off layer, distinguished\
    \ from the thermal bulk described by [cold_neutral_temperature](name:cold_neutral_temperature).\
    \ Hot neutrals arise primarily from charge exchange reactions between thermal\
    \ ions and cold neutrals, or from energetic recycling at plasma-facing surfaces,\
    \ producing a fast atom population carrying significantly more kinetic energy\
    \ than the bulk.\n\nThe temperature is inferred by fitting the observed spectral\
    \ emission line profile to a two-Gaussian model. The broad Gaussian component\
    \ corresponds to the hot neutral sub-population, with its half-width governed\
    \ by the Doppler broadening relation:\n\n$$\n\\Delta\\lambda_D = \\frac{\\lambda_0}{c}\\\
    sqrt{\\frac{8\\ln 2 \\, k_B T_{\\rm hot}}{m_n}}\n$$\n\nwhere $\\lambda_0$ is the\
    \ rest-frame line center wavelength of the emission transition, $c$ is the speed\
    \ of light, $k_B$ is the Boltzmann constant, $T_{\\rm hot}$ is the hot neutral\
    \ temperature, and $m_n$ is the neutral atom mass.\n\nMeasurements are obtained\
    \ from visible spectrometer channels recording hydrogen isotope Balmer series\
    \ emission, where spectral line fitting resolves the hot and cold sub-populations\
    \ simultaneously. Polarization spectroscopy channels provide access to both the\
    \ temperature and the line-of-sight Doppler shift, the latter captured in [hot_neutral_velocity](name:hot_neutral_velocity).\n\
    \nTypical values for the hot component span a few eV to approximately 50 eV in\
    \ edge and scrape-off layer plasmas, substantially above the cold bulk neutral\
    \ temperature of approximately 0.1\u20131 eV, and bounded above by the local ion\
    \ temperature."
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_temperature
  - name:hot_neutral_velocity
  arguments:
  - name: neutral_temperature
    operator: hot
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_temperature
    status: attached
  - id: dd:spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    dd_path: spectrometer_visible/channel/polarization_spectroscopy/temperature_hot_neutrals
    status: composed
- name: hot_neutral_velocity
  kind: scalar
  status: draft
  description: Line-of-sight projected velocity of the energetic (hot) neutral atom
    population, inferred from the Doppler centroid shift of the broad emission component
    in visible polarization spectroscopy.
  documentation: "The hot neutral population consists of energetic neutral atoms \u2014\
    \ produced primarily by charge-exchange reactions between fast ions and cold neutrals\
    \ or by beam-neutral interactions \u2014 whose velocity distribution yields a\
    \ broad Doppler profile overlaid on the narrower thermal (cold) component. The\
    \ line-of-sight component $v_\\mathrm{hot}$ represents the bulk flow of this energetic\
    \ neutral ensemble along the diagnostic chord, distinguishing it from [cold_neutral_velocity](name:cold_neutral_velocity)\
    \ for the thermal population; the associated kinetic spread is captured by [hot_neutral_temperature](name:hot_neutral_temperature).\n\
    \nThe centroid velocity is extracted from the observed wavelength shift of the\
    \ emission line:\n\n$$\nv_\\mathrm{hot} = c \\, \\frac{\\lambda_\\mathrm{obs}\
    \ - \\lambda_0}{\\lambda_0}\n$$\n\nwhere $c$ is the speed of light, $\\lambda_\\\
    mathrm{obs}$ is the centroid wavelength of the hot neutral spectral component,\
    \ and $\\lambda_0$ is the rest wavelength of the observed line.\n\nMeasurement\
    \ requires fitting the observed line profile from a visible polarization spectrometer\
    \ with a multi-Gaussian model that separates the broad hot and narrow cold neutral\
    \ contributions; the centroid shift of the broad component yields $v_\\mathrm{hot}$.\
    \ Hot neutrals sourced from fast-ion charge exchange carry line-of-sight velocities\
    \ spanning tens to hundreds of km/s, substantially exceeding those of cold recycled\
    \ neutrals.\n\nSign convention: Positive when the hot neutral atoms are moving\
    \ from the first to the second point along the line of sight."
  unit: m.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
