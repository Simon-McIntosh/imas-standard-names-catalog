- name: poloidal_neutral_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Poloidal component of the diamagnetic drift velocity for neutral species,
    driven by the pressure gradient perpendicular to the magnetic field.
  documentation: 'The poloidal component $v_{\theta, \rm dia} = \mathbf{v}_{\rm dia}
    \cdot \hat{\theta}$ of the neutral diamagnetic drift velocity $\mathbf{v}_{\rm
    dia}$. For neutral particles coupled to the plasma through collisions or charge
    exchange, the diamagnetic drift arises from the force balance $\nabla p_n = \mathbf{j}_n
    \times \mathbf{B}$, where $p_n$ is the neutral pressure in Pa, $\mathbf{j}_n$
    is the equivalent current density in A/m$^2$, and $\mathbf{B}$ is the magnetic
    field in T. In the edge plasma, this poloidal component contributes to the cross-field
    transport of neutral particles and influences the rotation dynamics of the neutral
    background. Typical poloidal diamagnetic velocities for neutrals range from $10^{-2}$
    to $10^{1}$ m/s in the scrape-off layer, depending on the neutral pressure gradient
    and magnetic geometry. This quantity is the neutral counterpart of [$\text{poloidal\_ion\_velocity\_due\_to\_diamagnetic\_drift}$](name:poloidal_ion_velocity_due_to_diamagnetic_drift)
    and the poloidal projection of the parent quantity [$\text{neutral\_velocity\_due\_to\_diamagnetic\_drift}$](name:neutral_velocity_due_to_diamagnetic_drift).


    Sign convention: Positive when the drift points in the direction of increasing
    poloidal angle $\theta$ (clockwise in the poloidal plane when viewed from above
    for standard tokamak coordinates).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_velocity_due_to_diamagnetic_drift
  - name:neutral_velocity_due_to_diamagnetic_drift
  arguments:
