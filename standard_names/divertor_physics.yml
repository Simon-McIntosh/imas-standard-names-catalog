- name: electron_density_at_divertor_target
  kind: scalar
  status: active
  description: Electron density at the divertor target is the local number density
    of free electrons in the plasma immediately upstream of the electrostatic sheath.
  documentation: 'Electron density at the divertor target is the local number density
    of free electrons in the plasma immediately adjacent to a divertor target surface,
    evaluated at the entrance to the electrostatic sheath. It is the electron-specific
    member of [density_at_divertor_target](name:density_at_divertor_target).


    The local electron number density is defined by the differential particle count:


    $$

    n_e = \frac{dN_e}{dV}

    $$


    where $N_e$ is the number of free electrons and $V$ is the enclosing plasma volume.
    The volume approaches the sheath entrance from the plasma side.


    This quantity includes free electrons in the plasma and excludes electrons bound
    in neutral atoms or molecules and electrons in the target material. It complements
    [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target),
    which characterizes the electron energy distribution at the same sheath entrance.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: electron
    operator_kind: qualifier
  sources:
