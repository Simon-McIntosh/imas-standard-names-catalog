- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Signed core-side slope of the electron temperature versus normalized
    poloidal flux at the H-mode pedestal top.
  documentation: 'This quantity is the signed local slope of the electron temperature
    at the core-side shoulder of the H-mode edge transport barrier. It represents
    the derivative extracted from the modified hyperbolic-tangent characterization
    of the pedestal and complements the value [electron temperature at the pedestal
    top](name:electron_temperature_at_pedestal_top).


    The derivative is defined as


    $$

    \left.\frac{\mathrm{d}T_e}{\mathrm{d}\psi_N}\right|_{\mathrm{pedestal\ top}}

    $$


    where $T_e$ is the electron temperature, $\psi_N$ is the normalized poloidal flux
    coordinate, and the subscript denotes evaluation at the pedestal top.


    This is the signed local slope at the pedestal top, not the maximum absolute gradient
    over the pedestal. Its sign is retained rather than replaced by a magnitude.


    Sign convention: Positive when the electron temperature increases toward increasing
    normalized poloidal flux, from the magnetic axis toward the plasma boundary.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
