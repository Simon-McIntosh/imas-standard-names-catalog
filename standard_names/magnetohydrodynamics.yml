- name: radial_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: active
  description: "Imaginary part of the complex amplitude of the radial plasma-velocity\
    \ perturbation for toroidal harmonic index n in linear MHD stability analysis.\
    \ Radial denotes the component along the R direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'Imaginary part of the complex amplitude of the radial plasma-velocity
    perturbation is the quadrature component of the cylindrical $R$ projection of
    the first-order plasma velocity eigenfunction for a specified toroidal harmonic
    index $n$. The radial projection is along $\hat{R}$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The complex radial perturbation amplitude and its contribution to the single-mode
    physical perturbation are represented by


    $$

    \delta v_R^{\mathrm{phys},(n)}(\mathbf{x},t)

    =

    \operatorname{Re}\!\left[

    \left(\delta v_{R,\mathrm{re}}^{(n)}(\mathbf{x})

    +i\,\delta v_{R,\mathrm{im}}^{(n)}(\mathbf{x})\right)

    e^{i(n\phi-\omega t)}

    \right]

    $$


    where $\delta v_{R,\mathrm{im}}^{(n)}$ is this quantity, $\delta v_{R,\mathrm{re}}^{(n)}$
    is [radial_perturbed_plasma_velocity_real_part](name:radial_perturbed_plasma_velocity_real_part),
    $\delta v_R^{\mathrm{phys},(n)}$ is the corresponding real physical perturbation
    component, $\mathbf{x}$ is position, $\phi$ is the toroidal angle of that position,
    $t$ is time, $\omega$ is the complex mode angular frequency under the chosen temporal
    phase convention, $n$ is the integer toroidal harmonic index, and $i$ is the imaginary
    unit.


    The real and imaginary parts together reconstruct the complex radial amplitude
    [radial_perturbed_plasma_velocity](name:radial_perturbed_plasma_velocity). A change
    of the arbitrary global eigenmode phase rotates these two parts, so this imaginary
    part is meaningful only with the same phase reference and eigenfunction normalization
    as the other perturbation components. It is the cylindrical $R$ component, not
    a flux-surface-normal component and not a component perpendicular to the magnetic
    field.


    Sign convention: Positive when $\delta v_{R,\mathrm{im}}^{(n)}$ points in the
    $+\hat{R}$ direction of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-velocity_perturbed-coordinate1-imaginary
    dd_documentation:
      leaf: Imaginary part
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate1
      parent: First coordinate (radial)
      data_type: FLT_2D
      unit: m.s^-1
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim2
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
    enhanced_context:
      description: "Imaginary part of the first (radial) component of the perturbed\
        \ velocity eigenfunction (\u1E7D) in linear MHD stability analysis. Together\
        \ with the real part, defines the complex-valued radial velocity perturbation\
        \ for a given toroidal mode number."
      kind: llm
- name: radial_plasma_velocity
  kind: scalar
  status: active
  description: "Radial component of the bulk plasma center-of-mass velocity, projected\
    \ onto the outward major-radius direction in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The radial plasma velocity $v_R$ is the projection of the [plasma_velocity](name:plasma_velocity)
    vector onto the $\hat{R}$ unit vector of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the major radius measured from the machine symmetry axis.
    It represents the inward or outward bulk mass flow of the plasma and is a key
    quantity for radial transport analysis in MHD descriptions of magnetized plasmas.


    The defining relation is:


    $$

    v_R = \mathbf{v}_\mathrm{plasma} \cdot \hat{R}

    $$


    where $\mathbf{v}_\mathrm{plasma}$ is the mass-weighted mean velocity of all plasma
    species and $\hat{R}$ points in the direction of increasing major radius $R$.


    Radial flows arise from pressure-gradient-driven forces, $\mathbf{E}\times\mathbf{B}$
    convection, and MHD instability dynamics. The quantity is evaluated from time-dependent
    MHD simulations on unstructured spatial grids and can be inferred experimentally
    through charge exchange recombination spectroscopy combined with magnetic equilibrium
    reconstruction. The complementary cylindrical velocity components are [toroidal_plasma_velocity](name:toroidal_impurity_ion_velocity_at_measurement_position)
    and [vertical_plasma_velocity](name:vertical_plasma_velocity); for the projection
    along the local magnetic-field direction, see [parallel_plasma_velocity](name:parallel_plasma_velocity).


    Sign convention: Positive when directed in the direction of increasing major radius
    $R$, i.e., outward from the machine symmetry axis.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_velocity
  - name:toroidal_impurity_ion_velocity_at_measurement_position
  - name:vertical_plasma_velocity
  - name:parallel_plasma_velocity
  arguments:
