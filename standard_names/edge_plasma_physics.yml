- name: toroidal_helium_3_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the helium-3 ion bulk flow velocity at the plasma
    boundary, resolved along the phi direction in the right-handed cylindrical (R,
    phi, Z) frame. It characterizes rotation or flow of helium-3 ions where closed
    magnetic flux surfaces meet the scrape-off layer.
  documentation: 'Toroidal helium-3 velocity at the plasma boundary is the toroidal
    component of the bulk flow velocity of $^3\mathrm{He}$ ions evaluated on the last
    closed flux surface. It describes the directed motion of the helium-3 ion population
    around the torus at the interface between confined plasma and the open-field-line
    scrape-off layer.


    The component is defined by projecting the helium-3 ion bulk velocity onto the
    toroidal basis direction of the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,^3\mathrm{He}} = \mathbf{v}_{^3\mathrm{He}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{^3\mathrm{He}}$ is the helium-3 ion bulk velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    In practice, this quantity may be inferred from Doppler shifts of helium spectral
    lines, charge-exchange measurements when suitable active neutrals are available,
    or from edge plasma modeling constrained by spectroscopy and equilibrium reconstruction.
    The boundary value is obtained by evaluating or interpolating the helium-3 flow
    to the last closed flux surface.


    Typical boundary values are often in the range $-5 \times 10^4$ to $5 \times 10^4$
    m.s^-1, with larger magnitudes approaching $1 \times 10^5$ m.s^-1 possible when
    strong momentum input, edge electric fields, or ion-temperature-gradient-driven
    flows are present.


    Sign convention: Positive when the helium-3 ion bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
