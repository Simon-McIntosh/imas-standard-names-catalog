- name: toroidal_angle_of_spectrometer_grating_apex
  kind: scalar
  status: draft
  description: Toroidal angle of the apex point of a spectrometer diffraction grating
    in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The toroidal angle $\phi$ locates the apex (summit) of a spectrometer
    diffraction grating around the machine axis, measured in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $R$ is the major radius, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is the vertical height. This geometric
    coordinate is used to reconstruct the three-dimensional position of the grating
    within the spectrometer optical assembly, which is essential for calibrating line-of-sight
    geometry and spectral response. It is closely related to [toroidal_angle_of_grating_summit](name:toroidal_angle_of_grating_summit),
    which captures the same concept under a more concise naming convention; the two
    names are semantically equivalent. Typical values span $0$ to $2\pi$ rad depending
    on the toroidal port location of the spectrometer, and are determined from as-built
    metrology or CAD surveys of the diagnostic installation. The corresponding major-radius
    and vertical coordinates complement this angle to fully specify the grating apex
    position, analogous to the endpoint coordinates used for [toroidal_angle_of_first_point_of_line_of_sight](name:toroidal_angle_of_first_point_of_line_of_sight)
    and [toroidal_angle_of_second_point_of_line_of_sight](name:toroidal_angle_of_second_point_of_line_of_sight).


    Sign convention: Positive when $\phi$ increases counter-clockwise when viewed
    from above in the $+\hat{Z}$ direction.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:toroidal_angle_of_grating_summit
  - name:toroidal_angle_of_first_point_of_line_of_sight
  - name:toroidal_angle_of_second_point_of_line_of_sight
  constraints: []
  sources:
  - id: dd:spectrometer_uv/channel/grating/summit/phi
    dd_path: spectrometer_uv/channel/grating/summit/phi
    status: composed
- name: vertical_coordinate_of_grating_summit
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the summit (apex) point of a spectrometer
    diffraction grating or crystal in the right-handed cylindrical $(R, \phi, Z)$
    frame.
  documentation: 'The vertical coordinate $Z_{\rm summit}$ locates the apex of a spectrometer
    diffraction grating or crystal along the machine symmetry axis direction $\hat{Z}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    and $\phi$ is the toroidal angle. Together with [major_radius_of_grating_summit](name:major_radius_of_grating_summit)
    and [toroidal_angle_of_grating_summit](name:toroidal_angle_of_grating_summit),
    it fully specifies the three-dimensional position of the grating summit, which
    is the reference point for computing Bragg-reflection geometry and optical path
    lengths in crystal and grating spectrometers. Typical values range from $-2$ m
    to $+2$ m in current tokamak devices, depending on the diagnostic port location;
    X-ray crystal spectrometers are often mounted near the midplane ($Z \approx 0$)
    while UV grating instruments may be positioned at varying heights. The coordinate
    is established by engineering survey or photogrammetric metrology of the spectrometer
    assembly and is treated as a static configuration parameter that enters the instrument
    line-of-sight and dispersion calculations. The full three-component position vector
    is described by the parent quantity [coordinate_of_grating_summit](name:coordinate_of_grating_summit).


    Sign convention: Positive when the grating summit lies above the tokamak midplane
    in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
