name: fast_electron_wave_absorbed_power_per_toroidal_mode
status: draft
description: Total wave power absorbed by the fast (suprathermal) electron population,
  resolved per toroidal mode number $n_{\phi}$.
documentation: "This scalar quantity $P_{\\mathrm{fast,e}}(n_{\\phi})$ (in W) gives\
  \ the volume-integrated power transferred from a coherent wave to the suprathermal\
  \ (non-Maxwellian) tail of the electron distribution function for a specific toroidal\
  \ mode number $n_{\\phi}$. It is obtained by integrating the fast-electron absorbed\
  \ power density over the plasma volume: $P_{\\mathrm{fast,e}}(n_{\\phi}) = \\int\
  \ p_{\\mathrm{fast,e}}(n_{\\phi})\\,dV$. Summing over all $n_{\\phi}$ yields the\
  \ total fast-electron absorbed power. In ECRH- or LH-heated plasmas, Landau damping\
  \ and cyclotron absorption by energetic electrons can channel a significant fraction\
  \ of injected power into the suprathermal tail, modifying current drive efficiency.\
  \ Full-wave and Fokker\u2013Planck coupled codes (e.g., TORIC-CQL3D, AORSA-CQL3D)\
  \ compute this quantity self-consistently. Typical values range from tens of kW\
  \ to several MW per toroidal mode in high-power heating scenarios. See `fast_electron_wave_absorbed_power_density_per_toroidal_mode`\
  \ for the spatially resolved profile and `electron_wave_heating_power_per_toroidal_mode`\
  \ for the thermal electron counterpart."
