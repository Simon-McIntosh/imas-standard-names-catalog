        \ growth of micro-instabilities such as ITG, TEM, or ETG modes."
      kind: llm
- name: normalized_momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: active
  description: Gyro-Bohm-normalized parallel component of the toroidal momentum flux
    driven by perturbed parallel magnetic-field fluctuations in gyrokinetic turbulence.
  documentation: 'Normalized parallel momentum flux due to the perturbed parallel
    magnetic field is the dimensionless, parallel-velocity-weighted electromagnetic
    contribution to turbulent radial transport of toroidal angular momentum.


    The normalized quantity is defined by


    $$

    \widehat{\Pi}_{\phi,\parallel}^{\delta B_\parallel} = \frac{\Pi_{\phi,\parallel}^{\delta
    B_\parallel}}{\Pi_{\mathrm{GB}}}

    $$


    where $\Pi_{\phi,\parallel}^{\delta B_\parallel}$ is the toroidal momentum flux
    in the parallel velocity-space channel driven by the perturbed parallel magnetic
    field, and $\Pi_{\mathrm{GB}}$ is the gyro-Bohm reference momentum-flux scale.
    The perturbation $\delta B_\parallel$ is the magnetic-field-magnitude fluctuation
    along the equilibrium magnetic-field unit vector $\hat{b}$.


    This is the parallel component of the aggregate [momentum flux due to the perturbed
    parallel magnetic field](name:normalized_momentum_flux_due_to_perturbed_parallel_magnetic_field),
    complementary to the [normalized perpendicular momentum flux due to the perturbed
    parallel magnetic field](name:normalized_perpendicular_momentum_flux_due_to_perturbed_parallel_magnetic_field).
    It excludes contributions attributed to the electrostatic potential and the perturbed
    parallel vector potential, including the [normalized parallel momentum flux due
    to the perturbed parallel vector potential](name:normalized_parallel_momentum_flux_due_to_perturbed_parallel_vector_potential).
    The normalization follows the gyrokinetic reference based on outboard-midplane
    electron density and temperature.


    Sign convention: Positive when the toroidal angular momentum flux is directed
    outward across magnetic flux surfaces, away from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links: []
