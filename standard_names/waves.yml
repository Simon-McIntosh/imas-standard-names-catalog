- name: lower_uncertainty_of_toroidal_component_of_wave_vector
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the toroidal component
    of the wave vector.
  documentation: This quantity provides the lower error bar on the toroidal wave-vector
    component $k_\phi$ (in m$^{-1}$) along a beam-tracing ray. Asymmetric uncertainty
    bounds allow for non-symmetric error distributions arising from nonlinear mappings
    in ray propagation through spatially varying plasma parameters. Combined with
    the upper bound, the pair defines the full uncertainty envelope. See also [toroidal_component_of_wave_vector](name:toroidal_component_of_wave_vector)
    and [upper_uncertainty_of_toroidal_component_of_wave_vector](name:upper_uncertainty_of_toroidal_component_of_wave_vector).
  unit: m^-1
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_wave_vector
  kind: vector
  status: draft
  description: Projection of the wave vector $\mathbf{k}$ onto the geometric toroidal
    direction $\hat{\phi}$, quantifying the toroidal spatial periodicity of the wave.
  documentation: "The toroidal wave-vector component $k_\\phi = \\mathbf{k} \\cdot\
    \ \\hat{\\phi}$ characterizes the toroidal wavelength $\\lambda_\\phi = 2\\pi\
    \ / k_\\phi$ and is related to the toroidal mode number by $n_\\phi = R \\, k_\\\
    phi$, where $R$ is the major radius in meters. In beam-tracing codes this component\
    \ evolves along each ray according to the local dispersion relation and equilibrium\
    \ geometry. For electron cyclotron (EC) waves launched at ~170 GHz, $|k_\\phi|$\
    \ is of order 10\u2013100 m$^{-1}$; for ion cyclotron range of frequencies (ICRF)\
    \ waves at ~50 MHz, values are of order 1\u201310 m$^{-1}$. See also [normalized_toroidal_component_of_wave_vector](name:normalized_toroidal_component_of_wave_vector)\
    \ and [lower_uncertainty_of_toroidal_component_of_wave_vector](name:lower_uncertainty_of_toroidal_component_of_wave_vector)."
  unit: m^-1
  tags:
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_toroidal_component_of_wave_vector
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on the toroidal component
    of the wave vector.
  documentation: This quantity provides the upper error bar on the toroidal wave-vector
    component $k_\phi$ (in m$^{-1}$) along a beam-tracing ray. Uncertainties in $k_\phi$
    arise from errors in equilibrium reconstruction (especially the $q$-profile),
    antenna geometry, and the paraxial approximation inherent in beam-tracing methods.
    The asymmetric error envelope (upper vs. lower) captures non-Gaussian propagation
    of input uncertainties through the dispersion-relation solver. See also [toroidal_component_of_wave_vector](name:toroidal_component_of_wave_vector)
    and [lower_uncertainty_of_toroidal_component_of_wave_vector](name:lower_uncertainty_of_toroidal_component_of_wave_vector).
  unit: m^-1
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
