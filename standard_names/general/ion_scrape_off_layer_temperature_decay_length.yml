name: ion_scrape_off_layer_temperature_decay_length
status: draft
cocos_transformation_type: one_like
description: Characteristic e-folding length of the ion temperature mapped to the
  outboard midplane in the scrape-off layer.
documentation: "The ion temperature decay length $\\lambda_{T_i}$ (in m) is the radial\
  \ e-folding distance of $T_i$ in the scrape-off layer (SOL), referenced to the outboard\
  \ midplane. Ion temperature profiles in the SOL are typically broader than electron\
  \ temperature profiles due to the larger ion Larmor radius and finite-orbit effects;\
  \ $\\lambda_{T_i}$ values of 10\u201340 mm are common in H-mode tokamaks. Direct\
  \ measurement is challenging and relies on charge-exchange recombination spectroscopy\
  \ with edge-optimized views, retarding-field energy analyzers at the divertor, or\
  \ coherence-imaging spectroscopy. Together with $\\lambda_{n_i}$, $\\lambda_{T_i}$\
  \ determines the ion pressure gradient that drives parallel Mach flows to the divertor\
  \ targets. The quantity feeds SOL transport models (e.g., SOLPS-ITER, UEDGE) and\
  \ is important for assessing ion heat loads on plasma-facing components. See also\
  \ `electron_temperature_decay_length_in_scrape_off_layer` and `ion_heat_flux_decay_length_in_scrape_off_layer`."
