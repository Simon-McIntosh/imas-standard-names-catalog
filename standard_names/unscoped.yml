- name: flux_surface_averaged_effective_charge_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface average of the ion-mixture effective charge over the entire
    plasma-boundary surface, distinct from the local boundary value.
  documentation: 'This quantity is the flux-surface average of the ion-mixture effective
    charge over the plasma boundary, identified with the last closed flux surface.
    It summarizes the charge composition across the complete boundary surface rather
    than at a single location.


    $$

    \left\langle Z_{\mathrm{eff}} \right\rangle_{\psi_b} = \frac{\oint_{\psi_b} Z_{\mathrm{eff}}\,d\ell/B_p}{\oint_{\psi_b}
    d\ell/B_p}, \qquad Z_{\mathrm{eff}} = \frac{\sum_i n_i Z_i^2}{n_e}

    $$


    Here $\psi_b$ labels the plasma-boundary flux surface, $d\ell$ is poloidal arc
    length, $B_p$ is the poloidal magnetic-field magnitude, $n_i$ and $Z_i$ are the
    number density and charge number of ion population $i$, and $n_e$ is the electron
    number density. The linked [effective charge at the plasma boundary](name:effective_charge_at_plasma_boundary)
    denotes the corresponding local boundary quantity; this entry denotes its flux-surface
    average.'
  unit: '1'
  physics_domain: ''
  links:
  - name:effective_charge_at_plasma_boundary
  arguments:
  - name: effective_charge_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix_average/zeff/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-zeff-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix_average/zeff
      parent: Effective charge
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Effective charge.
      kind: template
- name: ratio_of_line_averaged_hydrogen_density_to_line_averaged_total_hydrogenic_density
  kind: scalar
  status: active
  description: Line-averaged hydrogen density divided by line-averaged total hydrogenic
    density, giving the line-averaged protium fraction among hydrogen, deuterium,
    and tritium ions along the same line.
  documentation: 'Line-averaged hydrogen density divided by line-averaged total hydrogenic
    density is the isotope fraction of the line-averaged hydrogenic ion density contributed
    by hydrogen (protium). It is formed from hydrogen, deuterium, and tritium ion
    number densities averaged along the same line.


    The fraction $f_H$ is defined from path-length averages along line $C$:


    $$

    f_H = \frac{\overline{n}_H}{\overline{n}_H + \overline{n}_D + \overline{n}_T}
    = \frac{\frac{1}{L_C}\int_C n_H(l)\,dl}{\frac{1}{L_C}\int_C \left[n_H(l)+n_D(l)+n_T(l)\right]
    \, dl}

    $$


    where $L_C$ is the path length of $C$, $l$ is distance along $C$, $n_H$, $n_D$,
    and $n_T$ are the local hydrogen (protium), deuterium, and tritium ion number
    densities, and the overbar denotes the corresponding line-averaged density along
    the same line.


    The numerator is the [line-averaged hydrogen density](name:line_averaged_hydrogen_density),
    and the denominator is the sum of the line-averaged hydrogen, deuterium, and tritium
    ion densities along the same line. Hydrogenic density includes only hydrogen,
    deuterium, and tritium ions, with each isotope density summed over all ion charge
    states; neutral atoms, molecules, electrons, and non-hydrogenic ions are excluded.
    For non-negative isotope densities and a nonzero denominator, $0 \le f_H \le 1$;
    this line-averaged isotope fraction is distinct from the corresponding [volume-averaged
    isotope fraction](name:ratio_of_volume_averaged_hydrogen_density_to_volume_averaged_total_hydrogenic_density).'
  unit: '1'
  physics_domain: ''
  links:
  - name:line_averaged_hydrogen_density
  - name:ratio_of_volume_averaged_hydrogen_density_to_volume_averaged_total_hydrogenic_density
  arguments:
  - name: line_averaged_hydrogen_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  sources:
  - dd_path: summary/line_average/isotope_fraction_hydrogen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-isotope_fraction_hydrogen-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/isotope_fraction_hydrogen
      parent: Fraction of hydrogen density among the hydrogenic species (nH/(nH+nD+nT))
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Fraction of hydrogen density among the hydrogenic species (nH/(nH+nD+nT)).
      kind: template
- name: ratio_of_volume_averaged_hydrogen_density_to_volume_averaged_total_hydrogenic_density
  kind: scalar
  status: active
  description: Dimensionless hydrogen-isotope fraction equal to the volume-averaged
    protium-ion density divided by the volume-averaged density of all hydrogenic ions.
  documentation: 'This quantity is the fraction of the hydrogenic ion population attributable
    to protium, evaluated from volume-averaged densities over the same plasma volume.
    The numerator is the [volume-averaged hydrogen density](name:volume_averaged_hydrogen_density),
    while the denominator includes the corresponding hydrogen, deuterium, and tritium
    ion populations.


    $$

    f_H = \frac{\overline{n}_H}{\overline{n}_H + \overline{n}_D + \overline{n}_T}

    $$


    Here $f_H$ is the hydrogen-isotope fraction; $\overline{n}_H$, $\overline{n}_D$,
    and $\overline{n}_T$ are the volume-averaged densities of protium, deuterium,
    and tritium ions, respectively. The quantity is a ratio of separately volume-averaged
    densities, not a local isotope fraction or a fraction restricted to a single charge
    state.'
  unit: '1'
  physics_domain: ''
  links:
  - name:volume_averaged_hydrogen_density
  arguments:
  - name: volume_averaged_hydrogen_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  sources:
  - dd_path: summary/volume_average/isotope_fraction_hydrogen/value
    dd_version: 4.1.0
