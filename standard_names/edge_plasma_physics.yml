      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Power radiated from the scrape-off layer (SOL). Quantifies the
        radiation loss from the open field-line region outside the separatrix, relevant
        to power exhaust and divertor heat load management.
      kind: template
- name: temperature_at_midplane
  kind: scalar
  status: active
  description: Local kinetic temperature of a plasma population at the outboard, low-field-side
    midplane in the scrape-off layer.
  documentation: 'Local kinetic temperature of a plasma population at the outboard,
    low-field-side midplane is the scalar kinetic temperature of the specified population
    evaluated locally at the upstream low-field-side equatorial crossing of the scrape-off-layer
    plasma. In the right-handed cylindrical $(R, \phi, Z)$ frame, this locus is on
    the larger-$R$ side of the magnetic midplane.


    For a plasma population $a$ described by a scalar pressure relation, the temperature
    $T_a$ is defined through the local pressure-density relation:


    $$

    p_a = e\, n_a\, T_a

    $$


    where $p_a$ is the scalar pressure of population $a$, $n_a$ is its number density,
    $T_a$ is its temperature measured in electronvolts, and $e$ is the elementary
    charge that converts electronvolts to energy.


    This population-generic quantity does not by itself specify electrons, ions, impurities,
    charge state, or a species-combined temperature. More specific quantities select
    the population, such as [electron_temperature_at_midplane](name:electron_temperature_at_midplane)
    and [ion_temperature_at_midplane](name:ion_temperature_at_midplane). It is a pointwise
    local temperature, not a flux-surface average, poloidal average, or field-line
    average; the related local temperature at a limiter contact locus is [temperature_at_limiter](name:temperature_at_limiter).
    When the specified population is a species spanning multiple charge states, the
    species temperature is the density-weighted mean over all charge states.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_midplane
  - name:ion_temperature_at_midplane
- name: electron_temperature_at_midplane
  kind: scalar
  status: active
  description: Local kinetic temperature of the electron population at the outboard,
    low-field-side midplane in the scrape-off layer.
  documentation: 'Local kinetic temperature of the electron population at the outboard,
    low-field-side midplane is the thermal spread of the electron velocity distribution
    evaluated at the outboard, low-field-side crossing of the scrape-off-layer plasma.
    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    measured from the machine symmetry axis, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height, this locus is the
    larger-$R$ intersection of the scrape-off layer with the magnetic midplane on
    the low-field side of the magnetic axis.


    For electrons described by a scalar pressure relation, the electron temperature
    $T_e$ at this locus is defined through the local pressure-density relation:


    $$

    p_e = e\, n_e\, T_e

    $$


    where $p_e$ is the scalar electron pressure, $n_e$ is the electron number density,
    $T_e$ is the electron temperature measured in electronvolts, and $e$ is the elementary
    charge that converts electronvolts to energy.


    This quantity specializes [temperature_at_midplane](name:temperature_at_midplane)
    for the electron population. It is a pointwise local electron temperature, not
    a flux-surface average, poloidal average, midplane average, or field-line average
    such as [electron_average_temperature_at_midplane](name:electron_average_temperature_at_midplane).
    The corresponding ion quantity is [ion_temperature_at_midplane](name:ion_temperature_at_midplane).'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:temperature_at_midplane
  - name:ion_temperature_at_midplane
  - name:electron_average_temperature_at_midplane
  arguments:
  - name: temperature_at_midplane
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: langmuir_probes/reciprocating/plunge/collector/t_e
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-plunge-collector-t_e
    dd_documentation:
      leaf: Electron temperature
      parent_path: langmuir_probes/reciprocating/plunge/collector
      parent: Set of probe collectors including measurements specific to each collector
      data_type: STRUCTURE
      unit: eV
    enhanced_context:
      description: Electron temperature (Te) measured by a reciprocating Langmuir
        probe collector during a plunge into the scrape-off layer. Characterizes the
        local thermal energy of electrons in the SOL or near-divertor region.
      kind: llm
- name: ion_temperature_at_midplane
  kind: scalar
  status: active
  description: Local kinetic temperature of the ion population at the outboard, low-field-side
    midplane in the scrape-off layer.
  documentation: 'Local kinetic temperature of the ion population at the outboard,
    low-field-side midplane is the scalar kinetic temperature of the specified ion
    population evaluated locally at the upstream low-field-side equatorial crossing
    of the scrape-off-layer plasma. In the right-handed cylindrical $(R, \phi, Z)$
    frame, this locus is on the larger-$R$ side of the magnetic midplane.


    For an ion population $i$ described by a scalar pressure relation, its temperature
    $T_i$ is defined through the local pressure-density relation:


    $$

    p_i = e\, n_i\, T_i

    $$


    where $p_i$ is the scalar ion pressure, $n_i$ is the ion number density, $T_i$
    is the temperature measured in electronvolts, and $e$ is the elementary charge
    that converts electronvolts to energy.


    This ion-specific quantity is a member of the population-generic [temperature_at_midplane](name:temperature_at_midplane)
    family and is distinct from [electron_temperature_at_midplane](name:electron_temperature_at_midplane).
    It is a pointwise local temperature, not a flux-surface, poloidal, or field-line
    average; [temperature_at_limiter](name:temperature_at_limiter) applies at a different
    locus. For an ion species spanning multiple charge states, the temperature is
    the density-weighted mean over all charge states.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:temperature_at_midplane
  - name:electron_temperature_at_midplane
  - name:temperature_at_limiter
  arguments:
