name: parallel_component_of_electron_velocity
status: draft
description: Projection of the bulk electron fluid velocity onto the local magnetic
  field direction, $v_{e\parallel} = \mathbf{v}_e \cdot \hat{b}$.
documentation: "The parallel electron velocity $v_{e\\parallel} = \\mathbf{v}_e \\\
  cdot \\hat{b}$ ($\\mathrm{m\\,s^{-1}}$), where $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$\
  \ is the unit vector along the magnetic field, characterizes the electron flow that\
  \ carries the bulk of the parallel current density $j_\\parallel = -e n_e v_{e\\\
  parallel} + \\sum_s Z_s e n_s v_{s\\parallel}$, with $e$ the elementary charge ($1.602\
  \ \\times 10^{-19}$ C), $n_e$ the electron number density ($\\mathrm{m^{-3}}$),\
  \ and $n_s$, $Z_s$ the density and charge number of ion species $s$. In the plasma\
  \ core, $v_{e\\parallel}$ is governed by Ohmic and bootstrap current contributions,\
  \ typically $10^4$\u2013$10^6\\;\\mathrm{m\\,s^{-1}}$ in tokamak H-mode conditions.\
  \ In the scrape-off layer the parallel electron flow accelerates toward divertor\
  \ targets, reaching the ion sound speed $c_s = \\sqrt{(T_e + T_i)/m_i}$ at the sheath\
  \ entrance, where $T_e$ and $T_i$ are electron and ion temperatures (J) and $m_i$\
  \ the ion mass (kg). Positive $v_{e\\parallel}$ is defined in the direction of $\\\
  mathbf{B}$; the absolute orientation of $\\mathbf{B}$ depends on the COCOS convention\
  \ in use. Inferred from Langmuir probe analysis, spectroscopic Doppler measurements,\
  \ or kinetic neoclassical and gyrokinetic modeling. See also `parallel_component_of_ion_velocity`\
  \ and `electron_number_density`."
