- name: toroidal_flux_coordinate_at_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionful toroidal-flux radius labeling the outermost closed magnetic
    flux surface and setting the boundary value for this radial coordinate.
  documentation: 'The toroidal flux coordinate at the plasma boundary is the non-negative,
    radius-like label assigned to the outermost closed magnetic flux surface. It represents
    an effective flux radius rather than a geometric minor-radius measurement.


    At the plasma boundary, the coordinate is defined by


    $$

    \rho_{\mathrm{tor,b}} = \sqrt{\frac{\Phi_{\mathrm{tor,b}}}{\pi B_0}}

    $$


    where $\rho_{\mathrm{tor,b}}$ is the toroidal flux coordinate at the boundary,
    $\Phi_{\mathrm{tor,b}}$ is the toroidal magnetic flux enclosed by the boundary,
    $B_0$ is the positive reference vacuum toroidal magnetic field, and $\pi$ is the
    mathematical constant.


    The quantity applies specifically to the plasma boundary, identified with the
    outermost closed magnetic flux surface or last-closed flux surface in a closed-boundary
    equilibrium. It is a single evaluation at that locus; no spatial averaging, boundary
    integration, or summation over particle populations is implied.


    This boundary value is distinct from the [normalized toroidal flux coordinate
    at the plasma boundary](name:normalized_toroidal_flux_coordinate_at_plasma_boundary),
    which is dimensionless, and from the [toroidal magnetic flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary),
    which is the enclosed flux rather than its radius-like transformation.


    The quantity is the boundary evaluation of the parent [toroidal flux coordinate](name:toroidal_flux_coordinate)
    and supplies the outer radial reference for flux-coordinate labels based on toroidal
    magnetic flux.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_plasma_boundary
  - name:toroidal_flux_coordinate
  arguments:
  - name: toroidal_flux_coordinate
