- name: major_radius
  kind: scalar
  status: draft
  description: Perpendicular distance from the machine's toroidal symmetry axis to
    a point in the right-handed cylindrical (R, phi, Z) frame, used as the fundamental
    radial coordinate in equilibrium grids, MHD geometry, and device cross-section
    calculations.
  documentation: "The major radius $R$ is the perpendicular distance from the machine's\
    \ toroidal symmetry axis to a given spatial point, measured in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above $+\\hat{Z}$ and $Z$ is the vertical\
    \ height. It is the primary radial coordinate of axisymmetric plasma geometry,\
    \ entering metric factors in cylindrical differential operators, the ion gyroradius\
    \ $\\rho_i = m_i v_{\\perp} / (Z_i e B)$, and the geometric weighting of current\
    \ and pressure distributions.\n\nIn axisymmetric equilibrium, the poloidal magnetic\
    \ flux $\\psi(R, Z)$ satisfies the Grad-Shafranov equation:\n\n$$\nR\\frac{\\\
    partial}{\\partial R}\\!\\left(\\frac{1}{R}\\frac{\\partial\\psi}{\\partial R}\\\
    right) + \\frac{\\partial^2\\psi}{\\partial Z^2} = -\\mu_0 R^2\\frac{dp}{d\\psi}\
    \ - F\\frac{dF}{d\\psi}\n$$\n\nwhere $p(\\psi)$ is the plasma kinetic pressure,\
    \ $F(\\psi) = RB_\\phi$ is the poloidal current function, and $\\mu_0$ is the\
    \ permeability of free space. Coordinate grids in $R$ are constructed for equilibrium\
    \ reconstruction, MHD linear stability analysis, and the geometric description\
    \ of device structures including halo-current wall boundaries and injector positions.\n\
    \nThe [flux-surface-averaged major radius](name:flux_surface_averaged_major_radius)\
    \ provides the flux-surface mean of $R$, weighted by the inverse poloidal field\
    \ strength, and is used in transport modeling. The quantity [major_radius_of_geometric_axis](name:major_radius_of_geometric_axis)\
    \ specializes $R$ to the plasma geometric center, and [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ gives $R$ at the divertor heat-load footprint. Typical values span roughly 0.3\u2013\
    1.5 m on the high-field side to 1.5\u20136 m at the outer midplane for present-day\
    \ tokamaks.\n\nSign convention: Positive when measured outward from the toroidal\
    \ symmetry axis in the direction of increasing $R$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_major_radius
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_strike_point
- name: flux_surface_averaged_major_radius
  kind: scalar
  status: draft
  description: Flux-surface average of the major radius coordinate R on each nested
    magnetic flux surface, yielding the mean distance from the toroidal symmetry axis
    weighted by the inverse poloidal field strength.
  documentation: 'The flux-surface averaged major radius $\langle R \rangle$ is the
    mean value of the cylindrical major radius coordinate $R$ over a closed toroidal
    magnetic flux surface, weighted by the local inverse poloidal magnetic field magnitude.
    It belongs to the family of geometric metric coefficients (sometimes denoted $gm8$
    in neoclassical transport literature) that enter the flux-surface-averaged forms
    of transport and equilibrium equations, and is the flux-surface-averaging transformation
    of the parent quantity [major_radius](name:major_radius_of_flux_surface).


    The defining expression is:


    $$

    \langle R \rangle = \frac{\oint R \, \frac{dl}{B_p}}{\oint \frac{dl}{B_p}}

    $$


    where $l$ is the poloidal arc length along the flux surface and $B_p$ is the poloidal
    magnetic field magnitude, with integrals taken over one complete poloidal circuit.
    Because $B_p$ is smaller on the outboard low-field side, field lines dwell longer
    there, and $\langle R \rangle$ is shifted toward larger $R$ relative to a simple
    geometric centroid; it lies between the [inner_major_radius_of_flux_surface](name:inner_major_radius_of_flux_surface)
    and the [outer_major_radius_of_flux_surface](name:outer_major_radius_of_flux_surface).


    This coefficient is computed directly from the magnetic geometry obtained in equilibrium
    reconstruction, and is closely related to flux_surface_average_magnetic_field
    and flux_surface_averaged_curvature, which are derived from the same surface-averaging
    procedure.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_flux_surface
  - name:inner_major_radius_of_flux_surface
  - name:outer_major_radius_of_flux_surface
  arguments:
  - name: major_radius
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/gm8
    dd_path: equilibrium/time_slice/profiles_1d/gm8
    status: composed
- name: major_radius_of_active_limiter_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the active limiter point in the right-handed
    cylindrical (R, phi, Z) frame. It gives the radial distance from the machine symmetry
    axis to the material contact point that sets the outermost closed flux surface
    in a limited plasma.
  documentation: 'The major radius of the active limiter point is the $R$ coordinate
    of the limiter contact point in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is distance from the machine symmetry axis, $\phi$ is toroidal angle,
    and $Z$ is vertical height. The active limiter point is the material point at
    which a limited plasma boundary contacts the surrounding structure; this coordinate
    identifies its radial location only.


    For an active limiter point with Cartesian coordinates $(x_a, y_a, z_a)$ in a
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame whose $\hat{z}$ direction
    is vertical, the corresponding major radius is


    $$

    R_a = \sqrt{x_a^2 + y_a^2}

    $$


    where $x_a$ and $y_a$ are measured from the toroidal symmetry axis and $R_a$ is
    the major-radius coordinate of the active limiter point.


    In equilibrium interpretation, this value is determined from the limiter geometry
    and the reconstructed last-closed flux surface for a limited configuration. It
    is distinct from the major radius of a general plasma-boundary point, from the
    major radius of the closest wall point, and from the wall gap, which describes
    a separation distance rather than the contact coordinate.


    Typical values range from about 0.2-8 m across present and planned tokamaks, depending
    on machine size and whether the active contact is on an inboard, outboard, upper,
    or lower limiter surface.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/active_limiter_point/r
    dd_path: equilibrium/time_slice/boundary/active_limiter_point/r
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/active_limiter_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/active_limiter_point/r
    status: attached
- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major-radius R coordinate of the first-wall point that is geometrically
    closest to the plasma boundary or magnetic separatrix.
  documentation: 'The major-radius coordinate $R$ of the closest wall point locates,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, the position on the first
    wall at minimum Euclidean distance from the plasma boundary or magnetic separatrix.
    This proximity measure characterizes the tightest clearance between the confined
    plasma and the surrounding vessel structure, directly relevant to heat-load assessment,
    disruption halo-current modeling, and plasma-shape control.


    The closest wall point $(R_{cw}, Z_{cw})$ is the element of the first-wall contour
    $\mathcal{W}$ in the poloidal $(R, Z)$ cross-section that minimizes the distance
    to the plasma boundary contour $\partial\Omega$:


    $$

    (R_{cw}, Z_{cw}) = \underset{(R_w,\,Z_w)\,\in\,\mathcal{W}}{\arg\min}\; d\bigl((R_w,
    Z_w),\,\partial\Omega\bigr)

    $$


    where $d$ is the Euclidean distance in the poloidal $(R, Z)$ plane. The reported
    quantity is the $R$ component of this minimizing wall point.


    The closest wall point is identified during equilibrium reconstruction by comparing
    the reconstructed plasma boundary contour against the stored first-wall geometry.
    In limited plasmas, [major_radius_of_active_limiter_point](name:major_radius_of_active_limiter_point)
    often coincides with this quantity, since the active limiter contact point is
    by definition the nearest wall element. For diverted plasmas, the closest approach
    is frequently near the divertor target as characterized by [major_radius_of_strike_point](name:major_radius_of_strike_point).
    The radial position of the geometric center is given by [major_radius_of_geometric_axis](name:major_radius_of_geometric_axis),
    providing a central reference against which wall clearances can be contextualized.


    Sign convention: Positive when the closest wall point lies at a radial distance
    from the toroidal symmetry axis measured in the $+\hat{R}$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_active_limiter_point
  - name:major_radius_of_strike_point
  - name:major_radius_of_geometric_axis
  sources:
  - id: dd:disruption/halo_currents/active_wall_point/r
    dd_path: disruption/halo_currents/active_wall_point/r
    status: attached
  - id: dd:equilibrium/time_slice/boundary/closest_wall_point/r
    dd_path: equilibrium/time_slice/boundary/closest_wall_point/r
    status: composed
