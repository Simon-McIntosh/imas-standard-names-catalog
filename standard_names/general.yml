- name: oxygen_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of oxygen ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface and summed over all charged oxygen ionization states.
  documentation: 'Number density of oxygen ions at the plasma boundary is the local,
    intensive particle count per physical volume for the oxygen-ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local charge-state-summed oxygen ion density at a boundary point is the zeroth
    velocity moment of the oxygen-ion distribution functions:


    $$

    n_{\mathrm{O}}(\mathbf{x}_b,t)=\sum_{z=1}^{8}\int f_{\mathrm{O}^{z+}}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{\mathrm{O}}$ is the oxygen-ion number density, $\mathbf{x}_b$ is a point
    on the last closed magnetic flux surface, $t$ is time, $z$ is the positive oxygen
    ionization state, $f_{\mathrm{O}^{z+}}$ is the phase-space distribution function
    for that state, $\mathbf{v}$ is particle velocity, and $d^3v$ is the velocity-space
    volume element.


    This quantity applies specifically to oxygen ions and sums the populations from
    singly ionized through fully stripped oxygen. It excludes neutral oxygen and other
    ion species, and it is a local boundary value with no averaging over the boundary
    surface or over a volume.


    It is the oxygen-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary).
    The [flux-surface-averaged oxygen density at the plasma boundary](name:flux_surface_averaged_oxygen_density_at_plasma_boundary)
    represents the same charge-state-summed oxygen-ion content averaged over the last
    closed magnetic flux surface rather than evaluated locally.'
  unit: m^-3
  physics_domain: general
  links: []
  sources:
  - dd_path: summary/local/separatrix/n_i/oxygen/value
    dd_version: 4.1.0
