- name: major_radius_of_plasma_boundary_gap_reference_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the reference point that defines the gap
    between the plasma boundary and a nominated wall or limiter element.
  documentation: "The plasma boundary gap reference point is a nominated geometric\
    \ location used to measure the gap \u2014 the separation between the last closed\
    \ flux surface or separatrix and a specific wall or limiter element at that poloidal\
    \ position. The major radius $R$ of this reference point is its radial coordinate\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ denotes horizontal\
    \ distance from the toroidal symmetry axis.\n\nIn equilibrium reconstruction and\
    \ real-time position control, an array of gap reference points distributed around\
    \ the poloidal cross-section defines the plasma shape constraints. The major radius\
    \ $R$ locates each reference point radially; paired with the corresponding vertical\
    \ $Z$ coordinate, it fully specifies the reference point in the poloidal plane.\
    \ This coordinate follows the same pattern as [major_radius_of_x_point](name:major_radius_of_x_point),\
    \ [major_radius_of_strike_point](name:major_radius_of_strike_point), and [major_radius_of_active_limiter_point](name:major_radius_of_active_limiter_point),\
    \ which locate other equilibrium boundary features. It is the $R$-component of\
    \ the full position described by radius_of_plasma_boundary_gap_reference_point.\n\
    \nTypical values span the inner-wall to outer-wall major radius of the device,\
    \ roughly 0.5\u201310 m depending on machine size.\n\nSign convention: Positive\
    \ when the reference point is located at a positive radial distance from the toroidal\
    \ symmetry axis in the right-handed cylindrical $(R, \\phi, Z)$ frame, which is\
    \ satisfied by all physical plasma-boundary gap reference points."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_x_point
  - name:major_radius_of_strike_point
  - name:major_radius_of_active_limiter_point
  sources:
  - id: dd:equilibrium/time_slice/boundary/gap/r
    dd_path: equilibrium/time_slice/boundary/gap/r
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/gap/r
    dd_path: equilibrium/time_slice/boundary_separatrix/gap/r
    status: attached
  - id: dd:pulse_schedule/position_control/gap/r
    dd_path: pulse_schedule/position_control/gap/r
    status: attached
- name: major_radius_of_primary_x_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the primary X-point, the dominant poloidal-field
    null point defining the separatrix vertex in a diverted tokamak equilibrium.
  documentation: "The primary X-point is the principal null of the poloidal magnetic\
    \ field on the plasma-bounding separatrix, where the poloidal flux gradient $\\\
    nabla\\psi = 0$ and the separatrix forms its characteristic figure-eight topology.\
    \ In single-null divertor configurations this is the sole X-point; in double-null\
    \ configurations it designates the geometrically dominant or actively controlled\
    \ null.\n\nThe major radius $R$ of the primary X-point locates this null in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the distance measured\
    \ outward from the machine toroidal symmetry axis. It directly sets the radial\
    \ entrance of the divertor throat and constrains the magnetic geometry of the\
    \ scrape-off layer. The companion major_radius_of_secondary_x_point locates the\
    \ secondary null in double-null configurations, while [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ gives the radial coordinate of the related divertor tile intersection. The generic\
    \ form [major_radius_of_x_point](name:major_radius_of_x_point) allows indexing\
    \ over multiple X-points when the primary/secondary distinction is not required.\n\
    \nThis coordinate is extracted from equilibrium reconstruction by identifying\
    \ the saddle point of the solved poloidal flux function $\\psi(R, Z)$. Typical\
    \ values scale with device major radius, ranging from approximately 0.5\u2013\
    2.0 m in present-day tokamaks.\n\nSign convention: Positive when $R$ is measured\
    \ radially outward from the toroidal symmetry axis, yielding $R \\geq 0$ by definition\
    \ of the cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:summary/boundary/x_point_main/r
    dd_path: summary/boundary/x_point_main/r
    status: composed
- name: major_radius_of_secondary_separatrix
  kind: scalar
  status: draft
  description: Major-radius coordinate R, measured from the toroidal symmetry axis
    in the right-handed cylindrical (R, phi, Z) frame, of a point on the secondary
    separatrix. Paired with the vertical coordinate, it traces the separatrix contour
    in a poloidal cross-section.
  documentation: 'The major radius of the secondary separatrix is the $R$ coordinate
    of a point on the magnetic-flux contour that passes through the secondary X point.
    The coordinate is measured in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is distance from the toroidal symmetry axis and $Z$ is vertical height;
    together, $R$ and $Z$ locate the contour in a poloidal cross-section.


    Using a contour parameter $s$, the secondary-separatrix curve is defined by the
    flux-level condition:


    $$

    \psi(R(s), Z(s)) = \psi_{\mathrm{sec}}, \qquad \psi_{\mathrm{sec}} = \psi(R_{\mathrm{X,sec}},
    Z_{\mathrm{X,sec}})

    $$


    where $\psi$ is poloidal magnetic flux in Wb, $\psi_{\mathrm{sec}}$ is the [poloidal
    magnetic flux at the secondary separatrix](name:poloidal_magnetic_flux_at_secondary_separatrix)
    in Wb, $R(s)$ is this major radius in m, $Z(s)$ is the companion vertical coordinate
    in m, $s$ labels position along the contour, and $(R_{\mathrm{X,sec}}, Z_{\mathrm{X,sec}})$
    is the secondary-X-point position in m.


    In practice, $R$ values are obtained from an equilibrium reconstruction by locating
    the secondary magnetic null, evaluating the flux there, and tracing the corresponding
    $\psi=\psi_{\mathrm{sec}}$ level set in the poloidal plane. Portions of this contour
    that intersect a divertor target define the secondary strike point, whose radial
    coordinate is [major_radius_of_secondary_strike_point](name:major_radius_of_secondary_strike_point).
    The distance between inner and outer secondary separatrices is described separately
    by inner_outer_separatrix_distance.


    Typical numerical values are device-specific because $R$ is set mainly by machine
    size and by the segment of the contour being considered. In magnetic-confinement
    equilibria, values are commonly of order the device major radius, roughly 0.2-10
    m across compact to large devices, with the variation along one contour ranging
    from much less than 1 m to several m depending on plasma shape and divertor geometry.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_secondary_separatrix
  - name:major_radius_of_secondary_strike_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/outline/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/outline/r
    status: composed
- name: major_radius_of_secondary_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the intersection of the secondary separatrix
    with the divertor target plate in a double-null or snowflake divertor configuration.
  documentation: "The secondary strike point is the location on the divertor target\
    \ plate where the secondary separatrix contacts the material surface. Its major-radius\
    \ coordinate $R$ locates this point in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, where $R$ is the perpendicular distance from the toroidal symmetry\
    \ axis and $Z$ is the vertical height.\n\nIn double-null configurations, two separatrices\
    \ bound separate divertor legs; the secondary separatrix intersects the target\
    \ at a distinct radial location from the primary. Equilibrium reconstruction traces\
    \ the boundary defined by the poloidal flux value $\\psi = \\psi_{\\mathrm{sep,2}}$\
    \ at the secondary X-point until the field line intersects the divertor plate\
    \ geometry, yielding this coordinate. Compare with [major_radius_of_strike_point](name:major_radius_of_strike_point)\
    \ for the analogous primary separatrix intersection, and major_radius_of_secondary_x_point\
    \ for the corresponding upstream X-point. The full secondary separatrix outline\
    \ in the poloidal plane is characterized by [major_radius_of_secondary_separatrix](name:major_radius_of_secondary_separatrix).\n\
    \nAccurate knowledge of this coordinate is essential for divertor heat load management,\
    \ since the strike point position determines both the wetted area and the power\
    \ flux density reaching the target material. Typical values span roughly 0.3\u2013\
    3 m, depending on tokamak size and divertor geometry.\n\nSign convention: Positive\
    \ when the strike point radius is measured outward from the toroidal symmetry\
    \ axis in the $+R$ direction."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_secondary_separatrix
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/strike_point/r
    status: composed
- name: major_radius_of_strike_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the point where the magnetic separatrix
    intersects the divertor plate, locating the heat-load footprint on the plasma-facing
    target.
  documentation: 'The major-radius coordinate $R$ of a divertor strike point is the
    distance from the toroidal symmetry axis to the intersection of the magnetic separatrix
    with a plasma-facing target element, measured in the right-handed cylindrical
    $(R, \phi, Z)$ frame where $R$ is the horizontal distance from the machine axis.
    Together with the vertical $Z$ coordinate, it fully specifies the poloidal position
    of the separatrix footprint and determines the geometry of the heat-load deposition
    zone on the divertor plate.


    In single-null and double-null configurations, the strike-point $R$ value controls
    the divertor wetted area and the angle at which field lines impinge on the target
    material. The position is inferred by tracing the last closed flux surface, obtained
    from equilibrium reconstruction constrained by external magnetic measurements,
    to its intersection with the target geometry; it may also be cross-checked against
    infrared thermography or tile-based thermal diagnostics.


    For resolved inner and outer divertor geometries, [major_inner_radius_of_strike_point](name:major_inner_radius_of_strike_point)
    and [major_outer_radius_of_strike_point](name:major_outer_radius_of_strike_point)
    give the inboard and outboard strike-point radii respectively. In double-null
    equilibria, the secondary separatrix produces an additional footprint whose radial
    location is described by [major_radius_of_secondary_strike_point](name:major_radius_of_secondary_strike_point).
    This quantity is the radial component of radius_of_strike_point.


    Sign convention: Positive when $R$ is directed outward from the toroidal symmetry
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame, which holds for all
    physical strike-point locations where $R > 0$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_inner_radius_of_strike_point
  - name:major_outer_radius_of_strike_point
  - name:major_radius_of_secondary_strike_point
