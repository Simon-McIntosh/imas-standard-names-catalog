- name: perpendicular_normalized_gyrocenter_gyroaveraged_perturbed_energy
  kind: scalar
  status: draft
  description: Dimensionless gyrocenter moment of the perturbed distribution weighted
    by perpendicular kinetic energy times total speed squared and by the zeroth-order
    gyroaverage factor J0. It describes the perpendicular-energy-weighted response
    of a linear gyrokinetic eigenmode.
  documentation: 'This quantity is a normalized velocity-space moment of the gyrocenter
    perturbed distribution for a linear gyrokinetic eigenmode. The weighting emphasizes
    particles with large perpendicular kinetic energy and large total speed, while
    the zeroth-order Bessel factor represents the finite-Larmor-radius gyroaverage
    of the perturbation at fixed gyrocenter.


    For one species and a specified normalization, the moment is commonly written
    as


    $$

    M_{\perp E,J_0} = \frac{1}{\mathcal{E}_{\mathrm{ref}}} \int J_0(k_\perp \rho)\,\frac{1}{2}
    m v_\perp^2 v^2\,\delta f(\mathbf{v})\,d^3v

    $$


    where $m$ is the species mass, $v_\perp$ is velocity perpendicular to the equilibrium
    magnetic field, $v^2 = v_\parallel^2 + v_\perp^2$, $k_\perp$ is the perpendicular
    wavenumber, $\rho$ is the particle Larmor radius, and $J_0$ is the Bessel function
    of the first kind of order zero. The perturbation $\delta f$ has units of number
    density per velocity-space volume, $\mathrm{m}^{-3}(\mathrm{m}\,\mathrm{s}^{-1})^{-3}$,
    and $d^3v$ has units $(\mathrm{m}\,\mathrm{s}^{-1})^3$. The reference factor $\mathcal{E}_{\mathrm{ref}}$
    has the same units as the unnormalized integral; a common gyrokinetic choice is
    $n_{\mathrm{ref}} T_{\mathrm{ref}} v_{\mathrm{ref}}^2$, with $n_{\mathrm{ref}}$
    in $\mathrm{m}^{-3}$, $T_{\mathrm{ref}}$ expressed as energy per particle in joules,
    and $v_{\mathrm{ref}}$ in $\mathrm{m}\,\mathrm{s}^{-1}$.


    In practice this moment is computed by velocity-space quadrature of the eigenmode
    distribution function, using the local value of $k_\perp \rho$ for the species
    and wavevector of interest. For linear eigenmodes, $\delta f$ and therefore $M_{\perp
    E,J_0}$ are generally complex amplitudes; the kernel is real, but the eigenfunction
    phase is arbitrary, so magnitudes, phases relative to other moments, and ratios
    are usually more meaningful than an absolute sign.


    Typical dimensionless magnitudes depend strongly on the eigenmode normalization.
    With a Maxwellian-sized perturbation and normalization by $n_{\mathrm{ref}} T_{\mathrm{ref}}
    v_{\mathrm{ref}}^2$, values are commonly of order 0.1-10; finite-Larmor-radius
    averaging can reduce the magnitude through cancelation when $k_\perp \rho$ is
    not small. If the eigenfunction is normalized so that $|\delta f|/f_0$ is 10^-4-10^-2,
    the moment scales linearly and typically lies in the same 10^-4-10^-2 fraction
    of its calibration value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_energy
  - name:normalized_gyrocenter_gyroaveraged_perturbed_energy
  - name:perpendicular_normalized_gyrocenter_perturbed_energy_bessel_1
  - name:normalized_perpendicular_gyroaveraged_gyrocenter_perturbed_pressure
