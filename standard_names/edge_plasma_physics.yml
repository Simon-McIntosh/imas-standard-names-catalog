- name: helium_3_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of helium-3 ions at the plasma boundary, evaluated as
    the local particle count per physical volume on the last closed magnetic flux
    surface and summed over charge states.
  documentation: 'Number density of helium-3 ions at the plasma boundary is the local,
    intensive particle count per physical volume for the helium-3 ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface, or separatrix, separating confined plasma from the
    open-field-line scrape-off-layer region.


    The local charge-state-summed helium-3 number density is the zeroth velocity moment
    of the helium-3 ion distribution functions at a boundary point:


    $$

    n_{{}^{3}\mathrm{He}}(\mathbf{x}_b,t) = \sum_{q=1}^{2} \int f_{{}^{3}\mathrm{He},q}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{{}^{3}\mathrm{He}}$ is the helium-3 ion number density, $\mathbf{x}_b$
    is a point on the last closed magnetic flux surface, $t$ is time, $q$ is the helium-3
    ionic charge state, $f_{{}^{3}\mathrm{He},q}$ is the phase-space distribution
    function for that charge state, $\mathbf{v}$ is ion velocity, and $d^3v$ is the
    velocity-space volume element.


    This quantity applies specifically to helium-3 ions, whose nuclei contain three
    nucleons, and includes all ionized charge states from singly charged through fully
    stripped helium-3. It excludes neutral helium-3, other helium isotopes, and other
    plasma species. The value is local at the boundary and is not averaged over the
    boundary surface or over a volume.


    It is the helium-3-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_helium_3_density_at_plasma_boundary](name:flux_surface_averaged_helium_3_density_at_plasma_boundary)
    represents the average of this local helium-3 ion density over the same last closed
    magnetic flux surface rather than its value at a boundary point.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - dd_path: summary/local/separatrix/n_i/helium_3/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-n_i-helium_3-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix/n_i/helium_3
      parent: Helium isotope with 3 nucleons
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Helium isotope with 3 nucleons.
      kind: template
- name: flux_surface_averaged_helium_3_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of helium-3 ions at the plasma
    boundary (separatrix), summed over all charge states.
  documentation: "The flux-surface-averaged helium-3 ion number density at the plasma\
    \ boundary is the mean particle concentration of \xB3He ions across the last closed\
    \ flux surface (separatrix), summed over all ionization states \u2014 singly ionized\
    \ He\xB3\u207A through fully stripped He\xB3\xB2\u207A. This quantity forms the\
    \ explicit flux-surface-averaged counterpart of [helium_3_density_at_plasma_boundary](name:flux_surface_averaged_helium_3_density_at_plasma_boundary),\
    \ anchoring the helium-3 inventory to the outermost magnetically confined flux\
    \ surface that separates the confined plasma from the open-field-line scrape-off\
    \ layer.\n\nThe flux-surface average is defined as:\n\n$$\n\\langle n_{\\mathrm{He3}}\
    \ \\rangle_{\\mathrm{FS}} = \\frac{\\oint_{\\psi_b} n_{\\mathrm{He3}} \\, dA}{\\\
    oint_{\\psi_b} dA}\n$$\n\nwhere $n_{\\mathrm{He3}}$ is the local helium-3 number\
    \ density at the boundary flux surface identified by poloidal magnetic flux value\
    \ $\\psi_b$, and the surface integrals are evaluated over the full last closed\
    \ flux surface.\n\nHelium-3 (nuclear charge $Z = 2$, mass number $A = 3$) arises\
    \ as a D\u2013D fusion product and is used as a minority ion-cyclotron resonance\
    \ heating species. The boundary density characterizes the helium-3 content available\
    \ for recycling into the scrape-off layer and informs edge particle balance assessments.\
    \ It is inferred from edge charge-exchange recombination spectroscopy or line-emission\
    \ spectroscopy, combined with equilibrium reconstruction to locate and integrate\
    \ over the separatrix geometry. The sibling quantity [flux_surface_averaged_helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary)\
    \ provides the corresponding value for the \u2074He isotope, while [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary)\
    \ gives the main-fuel boundary density at the same locus.\n\nSign convention:\
    \ Positive when helium-3 ions are present at the plasma boundary."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_helium_4_density_at_plasma_boundary
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
  arguments:
  - name: helium_3_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix_average/n_i/helium_3/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-helium_3-value
    dd_documentation:
