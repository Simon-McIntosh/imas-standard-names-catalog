- name: thermal_efficiency_of_plant_system
  kind: scalar
  status: active
  description: Dimensionless ratio quantifying how effectively a plant system converts
    total thermal input into gross useful electrical output across its heat-conversion
    system.
  documentation: 'The thermal efficiency of a plant system is the dimensionless ratio
    of gross useful electrical power produced to total thermal power supplied to the
    heat-conversion system over the same accounting interval. It is a specific conversion
    metric within the broader [efficiency of a plant system](name:efficiency_of_plant_system)
    concept.


    The defining relation is:


    $$

    \eta_{\mathrm{th}} = \frac{P_{\mathrm{gross}}}{P_{\mathrm{th,in}}} = 1 - \frac{P_{\mathrm{th,out}}}{P_{\mathrm{th,in}}}

    $$


    where $\eta_{\mathrm{th}}$ is thermal efficiency, $P_{\mathrm{gross}}$ is gross
    useful electrical power, $P_{\mathrm{th,in}}$ is total thermal power entering
    the conversion cycle as represented by [total thermal power at inlet](name:total_thermal_power_at_inlet),
    and $P_{\mathrm{th,out}}$ is rejected thermal power represented by [total thermal
    power at outlet](name:total_thermal_power_at_outlet).


    Thermal efficiency accounts for thermal-to-electric conversion and excludes subtraction
    of internal electrical consumption from gross output. That recirculating-power
    accounting distinguishes it from [net efficiency of a plant system](name:net_efficiency_of_plant_system).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:efficiency_of_plant_system
  - name:total_thermal_power_at_inlet
  - name:total_thermal_power_at_outlet
  - name:net_efficiency_of_plant_system
  arguments:
  - name: efficiency_of_plant_system
    operator: thermal
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_plant/generator_conversion_efficiency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-generator_conversion_efficiency
