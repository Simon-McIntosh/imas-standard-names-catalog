name: electron_poloidal_beta_at_pedestal_top_low_field_side
status: draft
cocos_transformation_type: one_like
description: Electron poloidal beta at the pedestal top evaluated on the low-field
  side of the flux surface.
documentation: "The electron poloidal beta on the low-field side (LFS) at the pedestal\
  \ top is $\\beta_{\\mathrm{pol},e}^{\\mathrm{LFS}} = 2\\mu_0 n_e T_e / B_{\\theta,\\\
  mathrm{LFS}}^2$, where $n_e$ is the electron density (m$^{-3}$), $T_e$ is the electron\
  \ temperature (eV), $B_{\\theta,\\mathrm{LFS}}$ is the poloidal magnetic field at\
  \ the outboard midplane (T), and $\\mu_0$ is the vacuum permeability. The LFS value\
  \ is typically larger than the HFS counterpart because $B_{\\theta}$ is weaker on\
  \ the outboard side, making this location most relevant for ballooning-mode stability\
  \ analysis. Extracted from mtanh pedestal fits and equilibrium reconstruction, typical\
  \ H-mode values span 0.1\u20131.0 depending on shaping and collisionality. The LFS\
  \ pedestal beta is a primary input for peeling-ballooning stability codes such as\
  \ ELITE and MISHKA. See also `electron_beta_poloidal_at_pedestal_top_high_field_side`\
  \ and `electron_poloidal_beta_at_pedestal_top_flux_surface_averaged`."
