      description: Total radiated power (Prad) from the plasma, a key global energy
        balance quantity. Represents power lost from the plasma via electromagnetic
        radiation across all spectral ranges and emission processes.
      kind: template
- name: tritium_density
  kind: scalar
  status: active
  description: Local number density of tritium ions in the plasma, the foundational
    fuel-ion parameter underlying chord-averaged, volume-averaged, and isotopic ratio
    child quantities.
  documentation: 'Tritium ion number density $n_T$ quantifies the local concentration
    of hydrogen-3 fuel ions in the plasma. It serves as the common physical basis
    for a family of derived quantities: the chord-integrated mean [line_averaged_tritium_density](name:line_averaged_tritium_density),
    the confined-volume mean [volume_averaged_tritium_density](name:volume_averaged_tritium_density),
    and dimensionless isotopic ratios such as ratio_of_tritium_density_to_electron_density
    and [ratio_of_tritium_density_to_deuterium_density](name:ratio_of_tritium_density_to_deuterium_density).


    In deuterium-tritium (DT) fusion plasmas the local volumetric reaction rate is:


    $$

    R_{DT} = n_T \, n_D \langle \sigma v \rangle_{DT}

    $$


    where $n_D$ is the deuterium ion number density and $\langle \sigma v \rangle_{DT}$
    is the Maxwellian-averaged DT fusion reactivity. The combined DT fuel-ion purity
    relative to the electron population is tracked by ratio_of_deuterium_tritium_density_to_electron_density.


    Tritium density is inferred from active charge-exchange recombination spectroscopy,
    neutron emission measurements in DT plasmas, or pellet injection and fueling diagnostics.


    Sign convention: Positive when tritium ions are present in the plasma.'
  unit: m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:line_averaged_tritium_density
  - name:volume_averaged_tritium_density
  - name:ratio_of_tritium_density_to_deuterium_density
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/fuel_ratio
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-fuel_ratio
    dd_documentation:
