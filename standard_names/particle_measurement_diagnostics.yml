      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Ion saturation current (I_sat) measured by an embedded Langmuir
        probe. Proportional to the product of electron density and the Bohm velocity,
        used to infer local plasma density and heat flux at the plasma-facing target
        surface.
      kind: llm
  - dd_path: langmuir_probes/reciprocating/plunge/collector/ion_saturation_current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-plunge-collector-ion_saturation_current
