      kind: llm
- name: bremsstrahlung_power
  kind: scalar
  status: active
  description: Total electromagnetic power emitted by free-free bremsstrahlung as
    electrons accelerate in the Coulomb fields of plasma ions.
  documentation: 'Bremsstrahlung power is the total electromagnetic power emitted
    by free-free radiation from electron acceleration in the Coulomb fields of plasma
    ions. It is integrated over the emitting plasma volume and the full photon-frequency
    range.


    $$

    P_{\mathrm{brem}} = \int_V \int_0^\infty \varepsilon_{\mathrm{brem}}(\mathbf{x},\omega)\,d\omega\,d^3\mathbf{x}

    $$


    where $P_{\mathrm{brem}}$ is the total bremsstrahlung power, $V$ is the emitting
    plasma volume, $\mathbf{x}$ is position, $\omega$ is photon angular frequency,
    and $\varepsilon_{\mathrm{brem}}$ is the spectral volumetric bremsstrahlung emissivity.
    This quantity is a contribution to [total plasma radiated power](name:total_plasma_radiated_power)
    and excludes discrete [line radiation](name:power_due_to_line_radiation) and [synchrotron
    radiation](name:power_due_to_synchrotron_radiation).'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:total_plasma_radiated_power
  - name:power_due_to_line_radiation
  - name:power_due_to_synchrotron_radiation
  sources:
  - dd_path: summary/global_quantities/power_bremsstrahlung/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_bremsstrahlung-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/power_bremsstrahlung
      parent: Radiated power from Bremsstrahlung
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: "Total radiated power from Bremsstrahlung emission, the continuum\
        \ radiation arising from electron-ion Coulomb collisions in the plasma. Scales\
        \ as ne\xB2 Zeff Te^(1/2) and represents a key power loss channel."
      kind: template
- name: brightness_of_visible_camera
  kind: scalar
  status: active
  description: Visible-camera brightness is band-integrated photon radiance along
    a specified viewing direction over the wavelengths admitted by a visible passband.
    It gives the photon rate per projected collecting area and accepted solid angle,
    with the spectral dependence integrated over that band.
  documentation: 'Visible-camera brightness is the photon radiance of a radiation
    field along a specified viewing direction after integration over a visible wavelength
    interval or passband. It is normalized to projected collecting area, observation
    time, and accepted solid angle, and counts photons rather than radiant energy.


    The band-integrated photon radiance is defined by integrating the spectral photon
    radiance over the visible passband:


    $$

    B_\mathrm{vis} = \int_{\lambda_1}^{\lambda_2} L_\lambda^{(\gamma)}(\lambda)\,
    d\lambda

    $$


    where $B_\mathrm{vis}$ is the visible-camera brightness, $L_\lambda^{(\gamma)}(\lambda)$
    is the spectral photon radiance at wavelength $\lambda$, and $[\lambda_1,\lambda_2]$
    is the wavelength interval defining the visible passband.


    The quantity is non-negative because spectral photon radiance is non-negative
    over the passband. It is distinct from [spectral radiance](name:spectral_radiance),
    which retains wavelength dependence, and from [radiance at spectral line](name:radiance_at_spectral_line),
    which refers to an individual spectral line or narrow line interval; it also differs
    from energy radiance because photons are counted without weighting by photon energy.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance
  - name:radiance_at_spectral_line
  sources:
  - dd_path: camera_visible/channel/detector/frame/radiance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_visible.html#camera_visible-channel-detector-frame-radiance
    dd_documentation:
      leaf: 'Radiance image. First dimension : line index (horizontal axis). Second
        dimension: column index (vertical axis).'
      parent_path: camera_visible/channel/detector/frame
      parent: Set of frames
      data_type: FLT_2D
      unit: m^-2.s^-1.sr^-1
      coordinates:
      - 1...N
    enhanced_context:
      description: Spectral radiance image from a visible camera channel, giving the
        radiance as a 2D pixel array indexed by line and column. Used for plasma emission
        monitoring including line radiation, bremsstrahlung, and plasma-wall interactions.
      kind: llm
- name: curvature_of_optical_element
  kind: scalar
  status: active
  description: Signed local radius of curvature of an optical-element surface, defined
    along a specified tangent direction and applicable to spherical, cylindrical,
    and toroidal geometries.
  documentation: 'The signed local radius of curvature characterizes how an optical-element
    surface bends in a specified tangent direction at a surface point. It is a surface-shape
    property, distinct from the aperture size represented by [radius of optical element](name:radius_of_optical_element).


    For unit tangent direction $\hat{t}$, the radius is defined by the reciprocal
    of the signed normal curvature:


    $$

    R_c(\hat{t}) = \frac{1}{\kappa_n(\hat{t})}

    $$


    where $R_c$ is the signed radius of curvature and $\kappa_n(\hat{t})$ is the signed
    normal curvature in direction $\hat{t}$. A spherical surface has equal directional
    curvatures, whereas cylindrical and toroidal surfaces can have direction-dependent
    curvature. The radius of a spectral image surface is a distinct quantity described
    by [spectral surface curvature of optical element](name:spectral_surface_curvature_of_optical_element).


    Sign convention: Positive when the center of curvature lies on the designated
    positive side of the surface normal.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: spectrometer_uv/channel/grating/curvature_radius
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_uv.html#spectrometer_uv-channel-grating-curvature_radius
    dd_documentation:
      leaf: Curvature radius of the spherical grating
      parent_path: spectrometer_uv/channel/grating
      parent: Description of the grating
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Curvature radius of a spherical diffraction grating in a UV spectrometer
        channel. Determines the optical focusing properties of the grating and characterises
        the spectrometer optical geometry.
      kind: llm
- name: back_surface_curvature_of_optical_element
  kind: scalar
  status: active
  description: "Signed radius of curvature of a diagnostic optical element\u2019s\
    \ rear surface measured along its first local tangential aperture direction."
  documentation: "This quantity is the rear-surface component of [curvature of optical\
    \ element](name:curvature_of_optical_element), resolved along the first local\
    \ tangential direction of the aperture frame. It describes surface shape rather\
    \ than the optical element\u2019s aperture size or the curvature of a spectral\
    \ image surface.\n\nThe signed radius is defined from the signed normal curvature\
    \ of the rear-surface curve:\n\n$$\nR_1 = \\frac{1}{\\kappa_1}, \\qquad \\kappa_1\
    \ = \\frac{d^2\\mathbf{r}}{ds^2} \\cdot \\hat{\\mathbf{n}}\n$$\n\nwhere $R_1$\
    \ is the signed radius of curvature in m, $\\kappa_1$ is the signed normal curvature\
    \ in m$^{-1}$, $\\mathbf{r}$ is the surface-curve position in m, $s$ is arc length\
    \ in m along the first local tangential direction, and $\\hat{\\mathbf{n}}$ is\
    \ the chosen unit surface normal. This component is distinct from the corresponding\
    \ second local tangential direction represented by [vertical back-surface curvature\
    \ of optical element](name:vertical_back_surface_curvature_of_optical_element).\n\
    \nSign convention: Positive when the rear-surface curve bends toward the chosen\
    \ positive surface-normal side."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
