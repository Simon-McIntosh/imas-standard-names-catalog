name: toroidal_component_of_current_density_at_wall
status: draft
description: Toroidal projection of the total current density vector evaluated at
  or within wall structural elements.
documentation: "The toroidal current density component $j_\\phi$ (in A\xB7m$^{-2}$)\
  \ at the wall represents the projection $\\mathbf{j} \\cdot \\hat{\\phi}$ of the\
  \ total current density onto the geometric toroidal direction within conducting\
  \ wall elements. Currents flowing in the vessel wall arise from time-varying poloidal\
  \ magnetic flux (eddy currents via Faraday's law, $\\nabla \\times \\mathbf{E} =\
  \ -\\partial \\mathbf{B}/\\partial t$) and from halo currents during vertical displacement\
  \ events (VDEs) or disruptions. Typical magnitudes range from $10^3$ to $10^6$ A\xB7\
  m$^{-2}$ depending on the wall resistivity, disruption timescale, and proximity\
  \ to the plasma. This quantity is provided per element on a generalized grid description\
  \ (GGD) mesh and is used in electromagnetic force calculations, wall heating assessments,\
  \ and resistive wall mode stability analyses. Positive when $j_\\phi$ is in the\
  \ $+\\phi$ direction under COCOS-11 (counter-clockwise viewed from above)."
validity_domain: ''
