name: nitrogen_accumulated_gas_injection
status: draft
cocos_transformation_type: one_like
description: Time-integrated total number of nitrogen molecules injected into the
  vacuum vessel since the start of the discharge.
documentation: "The accumulated nitrogen gas injection counts the total number of\
  \ N$_2$ molecules (dimensionless, unit 1) delivered through gas injection valves\
  \ up to the current time, computed as $N_{\\mathrm{acc}}(t) = \\int_0^t \\Gamma_{\\\
  mathrm{N}_2}(t')\\,dt'$, where $\\Gamma_{\\mathrm{N}_2}$ is the nitrogen molecular\
  \ injection rate in s$^{-1}$. Nitrogen seeding is widely employed to enhance radiative\
  \ power exhaust in the divertor and promote detachment; typical accumulated inventories\
  \ reach $10^{20}$\u2013$10^{22}$ molecules per discharge depending on machine size\
  \ and seeding strategy. The quantity is derived from calibrated piezoelectric valve\
  \ flow measurements or pressure-drop estimates in the plenum volume. Monitoring\
  \ accumulated injection is essential for particle-balance accounting, wall-retention\
  \ studies, and real-time feedback control of radiated power fractions."
