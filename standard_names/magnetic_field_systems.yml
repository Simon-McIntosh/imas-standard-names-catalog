- name: width_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Full horizontal extent of a rectangular poloidal-field-coil conductor
    cross-section measured between its inner and outer radial faces.
  documentation: 'The width of a poloidal-field coil is the horizontal dimension of
    a rectangular conductor or winding-pack cross-section in the machine cross-section.
    It complements the [height of the poloidal field coil](name:height_of_poloidal_field_coil),
    and together these dimensions determine the rectangular area represented by [area
    of the poloidal field coil](name:area_of_poloidal_field_coil).


    For a rectangular cross-section aligned with the right-handed cylindrical $(R,
    \phi, Z)$ system, where $R$ is major radius and $Z$ is vertical height, the width
    is defined by the separation of the two radial faces:


    $$

    w = R_{\mathrm{outer}} - R_{\mathrm{inner}}

    $$


    where $w$ is the coil width, $R_{\mathrm{outer}}$ is the major-radius coordinate
    of the radially outer face, and $R_{\mathrm{inner}}$ is the major-radius coordinate
    of the radially inner face.


    This engineering geometry is obtained from coil design drawings, conductor-stack
    dimensions, or as-built metrology, and it is used in electromagnetic models that
    also require the [major radius of the poloidal field coil](name:major_radius_of_poloidal_field_coil)
    and [vertical coordinate of the poloidal field coil](name:vertical_coordinate_of_poloidal_field_coil).
    Fusion-device PF coil widths range from about 0.05-0.5 m for compact shaping coils
    to 0.5-2 m for large central-solenoid or outer PF coil winding packs.


    Sign convention: Positive when the outer radial face of the rectangular poloidal-field-coil
    cross-section lies at larger major radius $R$ than the inner radial face in the
    right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  - name:vertical_coordinate_of_poloidal_field_coil
  sources:
