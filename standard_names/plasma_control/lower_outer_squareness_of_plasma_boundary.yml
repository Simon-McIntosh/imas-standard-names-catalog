name: lower_outer_squareness_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Squareness shape parameter of the lower-outer quadrant of the plasma
  last closed flux surface boundary.
documentation: The lower-outer squareness quantifies the deviation of the plasma boundary
  shape from an ideal ellipse in the lower-outer quadrant (below the midplane, on
  the outboard side). A squareness of 0 corresponds to a pure elliptical cross-section,
  positive values produce a more rectangular shape, and negative values yield a more
  pointed (diamond-like) contour. The parameter is defined via a Fourier decomposition
  of the boundary $R(\theta), Z(\theta)$ relative to parametric angle, with the squareness
  capturing higher-order ($\cos 2\theta$-type) deviations localized to the relevant
  quadrant. Typical values range from $-0.3$ to $+0.4$ in shaped tokamak plasmas.
  The lower-outer squareness is adjusted via the poloidal field coil currents and
  is a target in plasma shape control. Quadrant-resolved squareness is particularly
  important for divertor geometry optimization, where the lower boundary shape determines
  the flux expansion and strike-point footprint.
