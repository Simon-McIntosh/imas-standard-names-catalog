name: volume_averaged_tritium_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Volume-averaged number density of tritium ions integrated over the confined
  plasma volume.
documentation: "The volume-averaged tritium ion number density $\\langle n_{\\mathrm{T}}\\\
  rangle_V = V^{-1}\\int n_{\\mathrm{T}}(\\mathbf{r})\\,dV$ quantifies the total tritium\
  \ fuel-ion content (T$^+$, i.e. ${}^3\\mathrm{H}^+$) averaged over the plasma volume\
  \ $V$ in m$^{-3}$. In deuterium-tritium (D-T) fusion plasmas the tritium density\
  \ is a primary performance parameter because the fusion reaction rate scales as\
  \ $\\langle\\sigma v\\rangle_{\\mathrm{DT}} n_D n_T$; an optimal D-T mix typically\
  \ targets $n_T / n_D \\approx 1$ to maximize power output. Typical core-averaged\
  \ values in burning-plasma scenarios (e.g., ITER Q = 10) are $3$\u2013$5 \\times\
  \ 10^{19}\\;\\mathrm{m}^{-3}$. The quantity is inferred from neutron yield measurements,\
  \ charge-exchange recombination spectroscopy with dedicated tritium beam injection,\
  \ or deduced via quasi-neutrality $n_T = n_e - Z_{\\mathrm{eff}} n_e + n_D + \\\
  ldots$ when other species are known. Fuel dilution by helium ash and impurities\
  \ reduces $n_T$ at fixed $n_e$, making this quantity critical for burn control.\
  \ See also `volume_averaged_electron_number_density` and `volume_averaged_oxygen_ion_number_density`."
