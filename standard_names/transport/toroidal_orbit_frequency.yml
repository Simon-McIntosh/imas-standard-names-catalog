name: toroidal_orbit_frequency
status: draft
description: Angular frequency at which a charged particle completes one toroidal
  circuit of its guiding-center orbit in a toroidal magnetic configuration.
documentation: "The toroidal orbit frequency $\\omega_{\\phi}$ quantifies the rate\
  \ at which a particle's guiding center advances in the toroidal angle $\\phi$. For\
  \ passing particles in a tokamak, $\\omega_{\\phi} \\approx v_{\\parallel} / R_0$,\
  \ where $v_{\\parallel}$ is the parallel velocity and $R_0$ is the major radius.\
  \ Trapped (banana) particles exhibit a toroidal precession frequency $\\omega_{\\\
  phi} \\approx q v_d / r$, where $v_d$ is the curvature-gradient drift speed, $q$\
  \ the safety factor, and $r$ the minor radius. Typical values span $10^4$\u2013\
  $10^7$ rad/s for thermal ions through energetic (MeV-range) fast ions. The toroidal\
  \ orbit frequency is central to resonance conditions in Alfv\xE9n eigenmode stability\
  \ analysis ($\\omega = n \\omega_{\\phi} + p \\omega_{\\theta}$, with $n$ and $p$\
  \ integers and $\\omega_{\\theta}$ the poloidal orbit frequency). Computed from\
  \ guiding-center orbit integration or analytic bounce-averaging. See also `poloidal_orbit_frequency`\
  \ and `safety_factor`."
