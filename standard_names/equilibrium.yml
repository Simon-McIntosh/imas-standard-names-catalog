- name: vertical_coordinate_of_plasma_boundary
  kind: scalar
  status: active
  description: "Signed vertical Z coordinate of points on the plasma-boundary contour\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the vertical position coordinate of a point on the
    plasma-boundary contour, evaluated in a poloidal cross-section at the specified
    toroidal angle. It locates the boundary relative to the machine midplane and is
    distinct from the boundary''s total vertical extent or elongation.


    The coordinate is defined by the vertical projection of the boundary position:


    $$

    Z_{\mathrm{b}}(\theta,\phi)=\mathbf{r}_{\mathrm{b}}(\theta,\phi)\cdot\hat{Z}

    $$


    where $\mathbf{r}_{\mathrm{b}}$ is the boundary position vector, $\theta$ parameterizes
    the contour, $\phi$ is the toroidal angle, and $\hat{Z}$ is the vertical unit
    vector of the right-handed cylindrical $(R, \phi, Z)$ frame. The associated boundary
    geometry includes the [length of the plasma boundary](name:length_of_plasma_boundary)
    and [elongation of the plasma boundary](name:elongation_of_plasma_boundary).


    Sign convention: Positive when the point lies in the direction of increasing vertical
    coordinate $Z$, above the machine midplane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:length_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  sources:
  - dd_path: b_field_non_axisymmetric/time_slice/control_surface/outline/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/b_field_non_axisymmetric.html#b_field_non_axisymmetric-time_slice-control_surface-outline-z
    dd_documentation:
      leaf: Height
      parent_path: b_field_non_axisymmetric/time_slice/control_surface/outline
      parent: Set of points defining the surface in a poloidal plane. The surface
        then extends in the toroidal direction in an axisymmetric way
      data_type: FLT_1D
      unit: m
      coordinates:
      - b_field_non_axisymmetric/time_slice/control_surface/outline/r
    enhanced_context:
      description: Vertical (Z) coordinate of outline.
      kind: template
  - dd_path: equilibrium/time_slice/boundary/outline/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-outline-z
