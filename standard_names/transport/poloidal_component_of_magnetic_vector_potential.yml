name: poloidal_component_of_magnetic_vector_potential
description: Poloidal projection of the magnetic vector potential $\mathbf{A}$, related
  to the magnetic field via $\mathbf{B} = \nabla \times \mathbf{A}$.
documentation: "The poloidal component $A_\\theta = \\mathbf{A} \\cdot \\hat{e}_\\\
  theta$ of the magnetic vector potential contributes to the toroidal magnetic field\
  \ through the curl relation; in axisymmetric geometry $B_\\phi$ depends on the poloidal\
  \ derivatives of $A_\\theta$ and $A_R$. The unit m\xB7T is equivalent to Wb\xB7\
  m$^{-1}$ (weber per meter). In MHD stability analysis, perturbed components $\\\
  delta A_\\theta$ appear in the linearized induction equation and are decomposed\
  \ in Fourier harmonics $(m, n)$ where $m$ is the poloidal mode number and $n$ the\
  \ toroidal mode number. Typical magnitudes of the equilibrium $A_\\theta$ are of\
  \ order $B_\\phi \\times a \\sim 1$\u2013$10$ m\xB7T for tokamak parameters, where\
  \ $a$ is the minor radius (m). Computed from equilibrium reconstruction or MHD eigenvalue\
  \ solvers (CASTOR, MARS-F, JOREK). The gauge choice (typically Coulomb gauge $\\\
  nabla \\cdot \\mathbf{A} = 0$) must be specified for the absolute value to be meaningful.\
  \ See also `radial_component_of_magnetic_vector_potential` and `poloidal_component_of_magnetic_field`."
kind: vector_component
unit: m.T
