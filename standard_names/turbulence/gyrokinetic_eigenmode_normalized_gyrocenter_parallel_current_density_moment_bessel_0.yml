name: gyrokinetic_eigenmode_normalized_gyrocenter_parallel_current_density_moment_bessel_0
status: draft
cocos_transformation_type: one_like
description: Normalized parallel current density moment of the perturbed gyrocenter
  distribution weighted by $J_0(k_\perp \rho_s)$ for a gyrokinetic eigenmode.
documentation: "This quantity is the velocity-space integral $\\hat{j}_{\\parallel,J_0}\
  \ = \\int J_0(k_\\perp \\rho_s) \\, v_\\parallel \\, \\delta f_{\\mathrm{gc}} \\\
  , d^3v \\, / \\, (n_{\\mathrm{ref}} v_{\\mathrm{th,ref}})$, where $J_0$ is the zeroth-order\
  \ Bessel function, $k_\\perp$ is the perpendicular wavenumber, $\\rho_s = v_\\perp\
  \ / \\Omega_{c,s}$ is the species Larmor radius, $v_\\parallel$ the parallel velocity,\
  \ $\\delta f_{\\mathrm{gc}}$ the perturbed gyrocenter distribution, $n_{\\mathrm{ref}}$\
  \ the reference density, and $v_{\\mathrm{th,ref}}$ the reference thermal speed.\
  \ The $J_0$ weighting performs the gyroaveraging that maps gyrocenter quantities\
  \ to particle space, so this moment directly enters the parallel Amp\xE8re equation\
  \ in gyrokinetic formulations; it represents the leading finite-Larmor-radius-corrected\
  \ current drive by an eigenmode. Computed by linear gyrokinetic eigenvalue solvers\
  \ (GS2, GENE, GKW) and stored as a dimensionless complex amplitude. See also the\
  \ $J_1$-weighted and unweighted counterparts."
