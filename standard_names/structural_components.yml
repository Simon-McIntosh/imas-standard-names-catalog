- name: toroidal_current_of_cryostat
  kind: scalar
  status: active
  description: "Net electric current carried by a conducting cryostat element in the\
    \ toroidal direction of the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the signed net electric current carried by a conducting
    cryostat element along the toroidal direction. It represents current in the passive
    cryostat structure, including induced eddy current, rather than current carried
    by the plasma or another component.


    $$

    I_\phi = \int_{S_\perp} J_\phi\,\mathrm{d}S

    $$


    where $I_\phi$ is the net toroidal current in A, $J_\phi = \mathbf{J}\cdot\hat{\phi}$
    is the toroidal component of the local electric current density in A m$^{-2}$,
    $\mathbf{J}$ is the current-density vector, and $S_\perp$ is the cryostat element
    cross-section normal to the toroidal direction. The unit vector $\hat{\phi}$ belongs
    to the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    This quantity is distinct from [toroidal current of vacuum vessel](name:toroidal_current_of_vacuum_vessel),
    which is confined to the vacuum vessel, and from [toroidal halo current](name:toroidal_halo_current),
    which is carried by halo plasma. It is a component of the broader current represented
    by [current of passive structure](name:current_of_passive_structure).


    Sign convention: Positive when the electric current flows in the direction of
    increasing toroidal angle $\phi$.'
  unit: A
  physics_domain: structural_components
  links:
  - name:toroidal_current_of_vacuum_vessel
  - name:toroidal_halo_current
  - name:current_of_passive_structure
  sources:
