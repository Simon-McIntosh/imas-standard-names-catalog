name: electron_number_density_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Electron number density at the top of the H-mode pedestal, characterizing
  the high-gradient transport barrier.
documentation: "The electron density at the pedestal $n_{e,\\rm ped}$ is the value\
  \ of $n_e$ at the pedestal top, conventionally defined as the location where the\
  \ steep-gradient region transitions to the core profile. It is a key scalar for\
  \ pedestal stability analysis via the peeling\u2013ballooning model and for empirical\
  \ confinement scaling laws such as the EPED model. Typical values span $2 \\times\
  \ 10^{19}$\u2013$1 \\times 10^{20}\\;\\mathrm{m^{-3}}$ in medium-size tokamaks and\
  \ up to $8 \\times 10^{19}\\;\\mathrm{m^{-3}}$ projected for ITER. The quantity\
  \ is extracted from Thomson scattering or reflectometry profiles, often via an mtanh\
  \ fit (see `mtanh_pedestal_fit_coefficients`). Related quantities include `electron_density_at_separatrix`\
  \ and `volume_averaged_electron_density`."
