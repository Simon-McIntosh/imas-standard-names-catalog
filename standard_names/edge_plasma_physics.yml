- name: toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal bulk-flow velocity of elemental argon
    ions at the plasma boundary, combining charge states through a density-weighted
    mean.
  documentation: 'Flux-surface-averaged toroidal bulk-flow velocity of elemental argon
    ions describes the toroidal component of their collective motion over the plasma-boundary
    flux surface. It includes the argon ion population rather than a single charge
    state.


    The boundary flux-surface average is defined by:


    $$

    \left\langle v_{\phi,\mathrm{Ar}}\right\rangle_{\psi_b}

    = \frac{\displaystyle\int_{S_{\psi_b}} v_{\phi,\mathrm{Ar}}\,dS/|\nabla\psi|}{\displaystyle\int_{S_{\psi_b}}
    dS/|\nabla\psi|}

    $$


    where $\psi$ is a scalar magnetic-flux label, $\psi_b$ is its value on the plasma
    boundary, $S_{\psi_b}$ is the complete boundary flux surface, $dS$ is its surface-area
    element, and $\nabla\psi$ is the spatial gradient of the flux label. The component
    $v_{\phi,\mathrm{Ar}}$ is defined in the right-handed cylindrical $(R,\phi,Z)$
    frame, with $\hat{R}\times\hat{\phi}=\hat{Z}$; $R$ is major radius, $\phi$ is
    toroidal angle, and $Z$ is vertical height.


    For charge-state index $z$, with density $n_{\mathrm{Ar},z}$ and bulk velocity
    $\mathbf{v}_{\mathrm{Ar},z}$, the local elemental-argon velocity is the density-weighted
    mean $\mathbf{v}_{\mathrm{Ar}}=\sum_z n_{\mathrm{Ar},z}\mathbf{v}_{\mathrm{Ar},z}/\sum_z
    n_{\mathrm{Ar},z}$. Thus, this quantity differs from the local, unaveraged [toroidal
    argon velocity at the plasma boundary](name:toroidal_argon_velocity_at_plasma_boundary)
    and parallels the charge-state aggregation used for [toroidal flux-surface-averaged
    deuterium velocity at the plasma boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary).


    Sign convention: Positive when the argon bulk-flow component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_argon_velocity_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  sources:
