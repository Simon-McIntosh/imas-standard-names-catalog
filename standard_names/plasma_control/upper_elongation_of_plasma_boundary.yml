name: upper_elongation_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Elongation of the upper half of the plasma boundary cross-section, measured
  with respect to the geometric axis.
documentation: The upper elongation is defined as $\kappa_{\mathrm{up}} = (Z_{\max}
  - Z_{\mathrm{geo}}) / a$, where $Z_{\max}$ is the vertical coordinate of the highest
  point on the plasma boundary (m), $Z_{\mathrm{geo}}$ is the vertical coordinate
  of the geometric center of the boundary (m), and $a = (R_{\max} - R_{\min}) / 2$
  is the plasma minor radius (m). Together with `lower_elongation_of_plasma_boundary`
  it fully characterizes the up-down asymmetry of the plasma cross-section; in up-down
  symmetric equilibria $\kappa_{\mathrm{up}} = \kappa_{\mathrm{low}}$. Typical values
  range from 1.4 to 2.0 in shaped tokamak discharges, with single-null divertor configurations
  generally exhibiting slight up-down asymmetry ($\kappa_{\mathrm{up}} \neq \kappa_{\mathrm{low}}$).
  The quantity is derived from equilibrium reconstruction and serves as a real-time
  control target in shape-control algorithms to maintain vertical stability and divertor
  strike-point geometry. See also `elongation_of_plasma_boundary` for the full (symmetric)
  elongation and `upper_triangularity_of_plasma_boundary` for the complementary shaping
  parameter.
