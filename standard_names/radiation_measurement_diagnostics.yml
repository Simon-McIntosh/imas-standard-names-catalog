- name: y_coordinate_of_detector_pixel
  kind: scalar
  status: draft
  description: Second of two orthogonal local coordinates (X2) defining the position
    of a detector pixel outline vertex in the diagnostic reference frame.
  documentation: "The y-coordinate (X2) forms a right-handed local Cartesian pair\
    \ with the X1 coordinate, locating outline vertices of a detector pixel aperture\
    \ in the detector plane. This 2-D local frame is referenced to the diagnostic's\
    \ optical axis and is independent of the global machine coordinates (R, \u03C6\
    , Z). The outline vertices define the shape of the pixel's sensitive area, which\
    \ is used to compute the effective collection area and field-of-view weighting\
    \ for synthetic diagnostic modeling. Typical pixel dimensions range from 10 \u03BC\
    m to 100 \u03BCm for CCD and CMOS detectors in spectrometer channels. See also\
    \ [x_coordinate_of_detector_pixel](name:x_coordinate_of_detector_pixel) for the\
    \ X1 counterpart and [area_of_optical_element](name:area_of_optical_element) for\
    \ the area derived from outline coordinates.\n\nSign convention: Positive when\
    \ the coordinate increases along the local diagnostic Y-axis direction in the\
    \ detector plane.\n\nLocal coordinate conventions are determined by the diagnostic\
    \ calibration; see the associated [y_coordinate_of_optical_element](name:y_coordinate_of_optical_element)\
    \ for consistency with the optical element reference frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x_coordinate_of_detector_pixel
  - name:area_of_optical_element
  - name:y_coordinate_of_optical_element
  sources:
  - id: dd:spectrometer_visible/channel/detector/outline/x2
    dd_path: spectrometer_visible/channel/detector/outline/x2
    status: composed
- name: y_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: Second of two orthogonal local coordinates (X2) defining the position
    of an optical element outline vertex in the diagnostic reference frame.
  documentation: 'The X2 coordinate is a local Cartesian coordinate within the diagnostic
    reference system, used together with the X1 coordinate to describe the 2D boundary
    shape of an optical element such as a lens, mirror, or aperture. The outline is
    typically represented as a polygon of vertices, with X1 and X2 coordinates specifying
    each vertex position in the diagnostic plane. Typical coordinate ranges span tens
    of millimeters for spectrometer and camera optics. This quantity is geometrically
    paired with [x_coordinate_of_optical_element](name:x_coordinate_of_optical_element)
    to define complete outline geometry. The orientation of the X1-X2 plane relative
    to the global cylindrical $(R, \phi, Z)$ frame is defined by the diagnostic layout
    and may vary between channels.


    Sign convention: Positive when the vertex lies in the direction of increasing
    X2 axis in the diagnostic reference frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x_coordinate_of_optical_element
  sources:
  - id: dd:spectrometer_visible/channel/optical_element/geometry/outline/x2
    dd_path: spectrometer_visible/channel/optical_element/geometry/outline/x2
    status: composed
