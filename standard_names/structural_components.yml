- name: vertical_volumetric_force
  kind: scalar
  status: active
  description: "Vertical (Z) component of the electromagnetic body-force density vector,\
    \ giving the net upward or downward force per unit volume on current-carrying\
    \ material in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical volumetric force is the $Z$-component of the local\
    \ electromagnetic body-force density vector, expressing the net mechanical load\
    \ per unit volume directed along the vertical axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. It is the vertical projection of the full [volumetric_force](name:volumetric_force)\
    \ vector, completing the cylindrical triad alongside the [radial_volumetric_force](name:radial_volumetric_force)\
    \ and [toroidal_volumetric_force](name:toroidal_volumetric_force) components.\n\
    \nIn electromagnetic contexts \u2014 the dominant application in tokamak structural\
    \ engineering \u2014 the vertical component is the $Z$-projection of the Lorentz\
    \ body force:\n\n$$\nf_Z = (\\mathbf{J} \\times \\mathbf{B}) \\cdot \\hat{Z}\n\
    $$\n\nwhere $\\mathbf{J}$ is the local current density, $\\mathbf{B}$ is the magnetic\
    \ field, and $\\hat{Z}$ is the unit vector pointing in the $+Z$ direction. Integrating\
    \ $f_Z$ over a conductor or blanket volume yields the total vertical force on\
    \ that component, analogous to the globally integrated vertical_force.\n\nThe\
    \ vertical force density is evaluated from electromagnetic field solutions by\
    \ computing the local cross product of the current density and magnetic field\
    \ distributions across the material domain. In tokamak structural components subject\
    \ to disruption-induced halo currents, electromagnetic force densities can reach\
    \ $10^6$\u2013$10^8$ N m$^{-3}$ near highly loaded conductor regions.\n\nSign\
    \ convention: Positive when the force points in the $+Z$ direction (vertically\
    \ upward in the right-handed cylindrical $(R, \\phi, Z)$ frame)."
  unit: N.m^-3
  physics_domain: structural_components
  links:
  - name:volumetric_force
  - name:radial_volumetric_force
  - name:toroidal_volumetric_force
  arguments:
  - name: volumetric_force
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - dd_path: wall/description_ggd/ggd/em_force_density/z
