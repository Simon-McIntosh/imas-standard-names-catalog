    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-centroid-x
    dd_documentation:
      leaf: List of X coordinates
      parent_path: ferritic/object/centroid
