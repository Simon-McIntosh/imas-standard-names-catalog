- name: helium_3_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of helium-3 atom delivery into the plasma vessel
    by gas injection, where each He-3 atom counts as two equivalent electrons due
    to its atomic number Z = 2.
  documentation: 'The helium-3 source rate due to gas injection is the instantaneous
    equivalent-electron count rate for helium-3 ($^3$He, $Z = 2$) delivered by external
    gas injection systems into the plasma vessel. In the equivalent-electron counting
    convention, each injected helium-3 atom contributes 2 count units to the rate,
    so the reported value equals twice the physical atom delivery rate.


    The equivalent-electron rate $\dot{N}_{\text{He-3}}$ is the time derivative of
    the cumulative helium-3 inventory:


    $$

    \dot{N}_{\text{He-3}} = \frac{d N_{\text{He-3}}}{dt}

    $$


    where $N_{\text{He-3}}$ is the [accumulated helium-3 count since plasma breakdown](name:accumulated_helium_3_count_due_to_gas_injection).


    The injection rate is inferred from calibrated gas feed diagnostics such as piezoelectric
    or solenoid valves with integrated flow metering. Helium-3 is employed for minority-species
    ion cyclotron heating, specialized fueling experiments, and impurity studies requiring
    a light noble gas. The analogous hydrogen rate is [hydrogen_source_rate_due_to_gas_injection](name:hydrogen_source_rate_due_to_gas_injection),
    and the species-summed total across all injected gasses is given by [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection).


    Sign convention: Positive when helium-3 gas is being delivered into the plasma
    vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_count_due_to_gas_injection
  - name:hydrogen_source_rate_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_rates/helium_3/value
    dd_path: summary/gas_injection_rates/helium_3/value
    status: composed
- name: helium_4_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Total neutral helium-4 gas injected during the prefill phase, expressed
    as an equivalent-electron count with two electrons per helium-4 atom.
  documentation: 'Helium-4 prefill count due to gas injection is the total equivalent-electron
    inventory supplied by externally injected neutral helium-4 during the prefill
    phase. Each helium-4 atom contributes two electron equivalents for complete ionization,
    so this is a gas-inventory bookkeeping count rather than a count of free electrons
    before breakdown.


    The total over the selected prefill interval is obtained by integrating the neutral
    helium-4 atom injection rate and multiplying by the helium electron yield:


    $$

    N_{\mathrm{e,eq}}^{{}^{4}\mathrm{He}} = 2 \int_{t_\mathrm{start}}^{t_\mathrm{end}}
    \Gamma_{{}^{4}\mathrm{He}}(t)\,dt

    $$


    where $\Gamma_{{}^{4}\mathrm{He}}$ is the neutral helium-4 atom injection rate
    in atoms s$^{-1}$, $t_\mathrm{start}$ is the start of helium-4 prefill gas admission,
    and $t_\mathrm{end}$ is the evaluation endpoint of the prefill interval, commonly
    just before plasma breakdown. The related [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)
    is the same integral retained as a function of its upper time limit; evaluating
    it at $t_\mathrm{end}$ gives this total.


    In practice, the count is inferred from calibrated helium-4 gas throughput, isotopic
    mixture fraction, valve-flow calibration, or an equivalent gas balance over the
    prefill interval. Only the injected helium-4 component is included; helium-3,
    other gas species, wall-released or recycled neutrals, and postbreakdown fueling
    are excluded. A helium-4 atom count, as opposed to this equivalent-electron count,
    is smaller by a factor of 2.


    Typical values range from $10^{18}$-$10^{22}$ equivalent electrons in small and
    medium devices and from $10^{22}$-$10^{24}$ equivalent electrons in large tokamak
    prefill scenarios, depending on vessel volume, target neutral pressure, gas temperature,
    and prefill duration.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/helium_4/value
    dd_path: summary/gas_injection_prefill/helium_4/value
    status: composed
- name: helium_4_source_rate_due_to_gas_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of helium-4 atom delivery into the plasma vessel
    by gas injection, where each He-4 atom with atomic number Z = 2 contributes two
    equivalent electrons to particle inventory accounting.
  documentation: 'The helium-4 source rate due to gas injection quantifies the instantaneous
    number of $^4$He atoms introduced per unit time into the plasma vessel through
    externally controlled gas injection valves. Helium-4, comprising two protons and
    two neutrons, is used in fusion devices for plasma heating studies, alpha-particle
    ash simulation, and wall conditioning scenarios.


    The source rate $\dot{N}_{\mathrm{He4}}$ is the time derivative of the cumulative
    helium-4 atom count tracked by [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection):


    $$

    \dot{N}_{\mathrm{He4}} = \frac{d N_{\mathrm{He4}}}{dt}

    $$


    where $N_{\mathrm{He4}}$ is the total helium-4 atom count since plasma breakdown.
    For electron-equivalent particle accounting, the contribution to the total inventory
    rate is $Z\,\dot{N}_{\mathrm{He4}} = 2\dot{N}_{\mathrm{He4}}$, reflecting helium''s
    atomic number. This species-resolved rate is one component of the total [source_rate_due_to_gas_injection](name:source_rate_due_to_gas_injection)
    summed over all injected species, and is directly analogous to [helium_3_source_rate_due_to_gas_injection](name:helium_3_source_rate_due_to_gas_injection)
    for the lighter helium isotope.


    The rate is determined from calibrated mass-flow controllers or conductance-based
    gas metering on the injection lines. Typical values range from $10^{20}$ to $10^{22}$
    s$^{-1}$ for seeding and fueling applications in present-day tokamaks.


    Sign convention: Positive when helium-4 gas is actively flowing into the plasma
    vessel, increasing the helium-4 atom inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:source_rate_due_to_gas_injection
  - name:helium_3_source_rate_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_rates/helium_4/value
    dd_path: summary/gas_injection_rates/helium_4/value
    status: composed
- name: krypton_prefill_count
  kind: scalar
  status: draft
  description: Equivalent electrons from krypton injected during the prefill phase;
    it is 36 times the number of krypton atoms delivered and is not the raw atom count.
  documentation: 'Krypton prefill count is a bookkeeping measure of the neutral krypton
    inventory introduced before plasma breakdown, expressed as an equivalent-electron
    count. It converts the number of krypton atoms delivered during the prefill phase
    into the number of electrons those atoms would contain if fully counted by atomic
    number, enabling comparison with other species inventories.


    The equivalent-electron count is defined from the injected krypton atom count
    as:


    $$

    N_{\mathrm{eq,e}}^{\mathrm{Kr,prefill}} = Z_{\mathrm{Kr}} N_{\mathrm{Kr,prefill}}
    = 36 N_{\mathrm{Kr,prefill}}

    $$


    where $N_{\mathrm{Kr,prefill}}$ is the number of krypton atoms injected during
    the prefill phase and $Z_{\mathrm{Kr}}=36$ is the atomic number of krypton. Both
    $N_{\mathrm{eq,e}}^{\mathrm{Kr,prefill}}$ and $N_{\mathrm{Kr,prefill}}$ are dimensionless
    counts.


    In practice, $N_{\mathrm{Kr,prefill}}$ is obtained by integrating a calibrated
    krypton flow over the prefill time interval. For particle flow $\dot{N}_{\mathrm{Kr}}$
    in atoms s$^{-1}$, $N_{\mathrm{Kr,prefill}}=\int \dot{N}_{\mathrm{Kr}}(t)\,dt$;
    for molar flow $\dot{n}_{\mathrm{Kr}}$ in mol s$^{-1}$, $N_{\mathrm{Kr,prefill}}=N_A\int
    \dot{n}_{\mathrm{Kr}}(t)\,dt$; and for gas throughput $Q$ in Pa m$^3$ s$^{-1}$
    at gas temperature $T$ in K, the ideal-gas estimate is $\dot{N}_{\mathrm{Kr}}\approx
    Q/(k_B T)$, where $N_A$ is Avogadro''s constant and $k_B$ is Boltzmann''s constant.
    The same equivalent-electron inventory convention is used for related prefill
    or gas-injection quantities such as [argon_prefill_count](name:argon_prefill_count),
    [neon_prefill_count](name:neon_prefill_count), [tritium_prefill_count](name:tritium_prefill_count),
    [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count), [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),
    and [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection);
    [accumulated_krypton_count](name:accumulated_krypton_count) denotes the krypton
    inventory accumulated beyond the prefill-only interval.


    Typical values are strongly device- and recipe-dependent. Trace or calibration
    prefills may be about $10^{18}$-$10^{20}$ equivalent electrons, while larger high-atomic-number
    gas puffs can reach $10^{21}$-$10^{24}$ equivalent electrons, corresponding to
    approximately $3\times10^{16}$-$3\times10^{22}$ krypton atoms after division by
    36.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_prefill_count
  - name:neon_prefill_count
  - name:tritium_prefill_count
  - name:accumulated_xenon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:carbon_prefill_count_due_to_gas_injection
  - name:accumulated_krypton_count
  arguments:
  - name: accumulated_lithium_prefill_count_due_to_gas_injection
    operator: krypton
    operator_kind: qualifier
  sources:
  - id: dd:summary/gas_injection_prefill/krypton/value
    dd_path: summary/gas_injection_prefill/krypton/value
    status: composed
- name: length_of_pellet
  kind: scalar
  status: draft
  description: Axial length of the intact cylindrical pellet before injection or shattering,
    measured end to end along the pellet symmetry axis.
  documentation: 'Pellet length is the end-to-end axial extent of an intact cylindrical
    pellet before injection or shattering. It specifies the pellet geometry together
    with the pellet diameter and is independent of the later fragment distribution
    produced during shattering.


    For an ideal right circular cylindrical pellet, the geometric volume is related
    to length and diameter by:


    $$

    V = \frac{\pi}{4} d^2 L

    $$


    where $V$ is the initial pellet volume in m$^3$, $d$ is the pellet diameter in
    m, and $L$ is the pellet length in m. This volume characterizes the initial geometry;
    the delivered material inventory also depends on pellet density, composition,
    shape fidelity, and losses or changes during injection, shattering, ablation,
    and transport.


    In practice, pellet length is determined from the fabrication or injector geometry
    and may be checked by mechanical, optical, or cryogenic metrology before launch.
    It is used with diameter to estimate initial pellet volume and, when combined
    with material density and isotopic or impurity composition, the initial mass and
    particle content.


    Typical lengths for cryogenic pellets used in shattered pellet injection are about
    0.003-0.05 m, depending on injector bore, pellet material, and disruption-mitigation
    requirements.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:diameter_of_pellet
  - name:normalized_atomic_count_of_pellet
  sources:
  - id: dd:spi/injector/pellet/length
    dd_path: spi/injector/pellet/length
    status: composed
- name: major_radius_of_pellet_path_point
  kind: scalar
  status: draft
  description: "Major radius (R) coordinate of a point along the pellet injection\
    \ path, giving the radial distance from the machine toroidal symmetry axis in\
    \ the cylindrical (R, \u03C6, Z) frame."
  documentation: "The major radius of a pellet path point is the radial distance $R$\
    \ from the toroidal symmetry axis to a discrete location along the trajectory\
    \ of an injected pellet or shattered pellet injector (SPI) fragment, expressed\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame where $R$ increases outward\
    \ from the machine axis.\n\nTogether with [vertical_coordinate_of_pellet_path_point](name:vertical_coordinate_of_pellet_path_point)\
    \ (the $Z$ component) and toroidal_angle_of_along_pellet_path (the $\\phi$ component),\
    \ this coordinate fully specifies the three-dimensional position of a point on\
    \ the pellet or SPI fragment trajectory. The radial coordinate determines how\
    \ far from the plasma center the injected material deposits fuel or impurity species,\
    \ directly governing the radial deposition profile.\n\nPellet path geometry is\
    \ defined by discrete anchor points \u2014 such as the injector exit and, for\
    \ SPI systems, the shattering position \u2014 with the trajectory reconstructed\
    \ from optical pellet diagnostics or injection geometry specifications. For SPI\
    \ applications, the shattering-position $R$ value locates where the intact pellet\
    \ transitions into a dispersing fragment cloud.\n\nTypical values range from about\
    \ 1.5 m in compact tokamaks to beyond 6 m in large devices, bounded below by the\
    \ first-wall major radius and above by the outer vessel radius.\n\nSign convention:\
    \ Positive when $R$ is measured radially outward from the machine toroidal symmetry\
    \ axis, as defined in the right-handed cylindrical $(R, \\phi, Z)$ frame; $R \\\
    geq 0$ for all physically realizable positions."
  unit: m
  physics_domain: plant_systems
  links:
  - name:vertical_coordinate_of_pellet_path_point
  sources:
  - id: dd:spi/injector/shattering_position/r
    dd_path: spi/injector/shattering_position/r
    status: composed
- name: maximum_gas_flow
  kind: scalar
  status: draft
  description: Operational upper limit on pressure-weighted gas throughput through
    a gas injection valve, expressed as gas pressure times volumetric flow rate in
    the injection direction.
  documentation: 'Maximum gas flow $Q_{\max}$ is the upper engineering limit on pressure-weighted
    volumetric gas throughput deliverable by a gas injection valve. It bounds the
    instantaneous [gas_flow](name:gas_flow) in the positive injection direction and,
    together with [minimum_gas_flow](name:minimum_gas_flow), defines the usable valve
    throughput range.


    The pressure-throughput limit is defined from the product of gas pressure and
    volumetric flow rate over the allowed operating states of the valve:


    $$

    Q_{\max} = \max_{\mathrm{allowed}} \left(p\,\dot{V}\right)

    $$


    where $p$ is the gas pressure in Pa at the specified reference section, $\dot{V}$
    is the volumetric flow rate in m$^3$ s$^{-1}$ for the same gas state, and $Q_{\max}$
    is in Pa m$^3$ s$^{-1}$.


    The value is usually obtained from valve specifications, calibrated flow-bench
    measurements, or pressure-decay tests under specified gas species, temperature,
    and upstream/downstream pressure conditions. It is a pressure-throughput limit,
    not directly a particle source rate: for an ideal gas at gas temperature $T_g$,
    the molecule rate is $\dot{N}=Q/(k_B T_g)$ and the molar rate is $\dot{n}=Q/(R
    T_g)$, so comparison with total_upper_source_rate requires the gas temperature
    and composition.


    Typical maximum throughputs range from $0.01-10\ \mathrm{Pa\,m^3\,s^{-1}}$ for
    small fueling or impurity-seeding valves, $10-10^3\ \mathrm{Pa\,m^3\,s^{-1}}$
    for high-capacity gas puffing valves, and $10^3-10^6\ \mathrm{Pa\,m^3\,s^{-1}}$
    for fast disruption-mitigation injection systems.


    Sign convention: Positive when gas is transported from the upstream supply side
    of the valve toward the injection outlet.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
