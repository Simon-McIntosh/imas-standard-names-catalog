- name: toroidal_xenon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Toroidal component of the xenon-ion bulk-flow velocity evaluated on
    the plasma boundary, the last closed flux surface.
  documentation: 'This quantity is the local xenon-ion bulk-flow velocity projected
    onto the geometric toroidal direction at the plasma boundary. The xenon-ion bulk
    velocity is the density-weighted mean over all xenon ion charge states and excludes
    thermal random motion.


    $$

    v_\phi = \mathbf{v}_{\mathrm{Xe}} \cdot \hat{\boldsymbol{\phi}}

