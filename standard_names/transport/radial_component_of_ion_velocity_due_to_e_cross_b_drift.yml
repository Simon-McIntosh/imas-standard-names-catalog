name: radial_component_of_ion_velocity_due_to_e_cross_b_drift
description: Radial projection of the ion fluid velocity arising from the $\mathbf{E}
  \times \mathbf{B}$ drift in a magnetized plasma.
documentation: "The radial $\\mathbf{E} \\times \\mathbf{B}$ drift velocity component\
  \ is $v_{E \\times B, r} = [(\\mathbf{E} \\times \\mathbf{B}) / B^2] \\cdot \\hat{r}$,\
  \ where $\\mathbf{E}$ is the electric field, $\\mathbf{B}$ the magnetic field with\
  \ magnitude $B$, and $\\hat{r}$ the outward radial unit vector. Because the $\\\
  mathbf{E} \\times \\mathbf{B}$ drift is species-independent to lowest order, the\
  \ ion and electron radial components are identical; however, this name is resolved\
  \ per species to allow higher-order corrections in edge transport models. In the\
  \ tokamak edge and scrape-off layer, the radial $E \\times B$ drift is a primary\
  \ driver of convective particle and energy transport, with magnitudes on the order\
  \ of $10^{1}$\u2013$10^{3}\\;\\mathrm{m\\,s^{-1}}$. Computed in edge fluid codes\
  \ (SOLPS-ITER, UEDGE, EMC3-EIRENE) using the self-consistent electrostatic potential\
  \ and the magnetic equilibrium. See `parallel_component_of_ion_e_cross_b_drift_velocity`\
  \ and `diamagnetic_component_of_ion_e_cross_b_drift_velocity` for companion projections."
kind: vector_component
unit: m.s^-1
