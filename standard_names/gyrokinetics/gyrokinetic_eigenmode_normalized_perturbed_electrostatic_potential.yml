name: gyrokinetic_eigenmode_normalized_perturbed_electrostatic_potential
status: draft
cocos_transformation_type: one_like
description: Normalized perturbed electrostatic potential $\delta \hat{\phi}$ of a
  gyrokinetic eigenmode, encoding the full complex amplitude along the field line.
documentation: The dimensionless complex perturbed electrostatic potential $\delta
  \hat{\phi}$ for a gyrokinetic eigenmode at wavevector $(k_\theta, k_\phi)$. Normalization
  follows the convention $\delta \hat{\phi} = e \delta \phi / T_e$, where $e$ is the
  elementary charge, $\delta \phi$ is the electrostatic potential perturbation in
  V, and $T_e$ is the reference electron temperature in eV. This is the dominant field
  variable in electrostatic gyrokinetic simulations and remains important in electromagnetic
  formulations where it couples to $\delta A_\parallel$ and $\delta B_\parallel$ through
  the gyrokinetic Poisson equation $\sum_s q_s \int \langle \delta f_s \rangle_{\mathbf{R}}
  \, d^3v = 0$ (quasi-neutrality). Typical eigenmode amplitudes are arbitrary up to
  a global normalization; relative mode structure along the ballooning angle $\theta$
  reveals trapped-electron or ion-temperature-gradient character. Produced by linear
  gyrokinetic solvers (GS2, GENE, GYRO, GKW) as the primary eigenfunction output.
  The real and imaginary parts are stored separately as companion quantities.
