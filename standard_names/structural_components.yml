        Alternatively, the layer can be described by a centreline and thickness. '
      data_type: FLT_0D
      unit: ohm.m
    enhanced_context:
      description: Electrical resistivity of the cryostat vessel unit in its annular
        cross-section representation. A material property relevant to electromagnetic
        analyses of eddy currents induced in the cryostat structure.
      kind: llm
  - dd_path: cryostat/description_2d/cryostat/unit/element/resistivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/cryostat.html#cryostat-description_2d-cryostat-unit-element-resistivity
    dd_documentation:
