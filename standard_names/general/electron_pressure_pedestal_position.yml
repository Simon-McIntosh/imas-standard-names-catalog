name: electron_pressure_pedestal_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate $\psi_N$ at the center of the electron
  pressure pedestal in H-mode plasmas.
documentation: "The electron pressure pedestal position identifies the $\\psi_N$ location\
  \ (normalized poloidal flux, dimensionless, ranging from 0 at the magnetic axis\
  \ to 1 at the separatrix) at the midpoint of the steep-gradient region in the $p_e$\
  \ profile. It is typically extracted from a modified hyperbolic tangent (mtanh)\
  \ or piecewise-linear fit to composite Thomson scattering and interferometry data.\
  \ In standard H-mode tokamak discharges, the pedestal center sits at $\\psi_N \\\
  approx 0.92$\u2013$0.98$; shifts toward lower $\\psi_N$ are observed with increased\
  \ triangularity or higher density. Together with the pedestal width and height,\
  \ this parameter fully characterizes the pedestal shape and feeds peeling\u2013\
  ballooning MHD stability analysis. See also `electron_pressure_pedestal_width`,\
  \ `electron_temperature_pedestal_position`."
