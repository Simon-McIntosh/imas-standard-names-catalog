    status: composed
- name: ion_kinetic_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident kinetic energy flux per unit wall area carried by plasma ions,
    summed over ion species and charge states, as they strike the plasma-facing wall.
  documentation: 'Ion kinetic energy flux at the wall is the incident component of
    kinetic power carried by ions crossing a plasma-facing material surface per unit
    area. It includes the translational kinetic energy of ions at impact, summed over
    all ion species and charge states, and is the ionic contribution to the total
    [kinetic_energy_flux_at_wall](name:kinetic_energy_flux_at_wall). It excludes ion
    potential energy, radiation, and energy transported by particles emitted or reflected
    from the wall.


    For a kinetic ion distribution evaluated at a wall point, the local incident flux
    can be written as:


    $$

    Q_{i,\mathrm{kin}}^{\mathrm{inc}}(\mathbf{x}_w) = \sum_{s,z} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w
    < 0} \frac{1}{2} m_s |\mathbf{v}|^2 |\mathbf{v}\cdot\hat{\mathbf{n}}_w| f_{s,z}(\mathbf{x}_w,\mathbf{v})\,d^3v

    $$


    where $Q_{i,\mathrm{kin}}^{\mathrm{inc}}$ is in W m^-2, $\mathbf{x}_w$ is the
    wall-surface position in meters, $s$ labels ion species, $z$ labels charge state,
    $m_s$ is the ion mass in kg, $\mathbf{v}$ is ion velocity in m s^-1, $\hat{\mathbf{n}}_w$
    is the unit normal directed from the wall material into the plasma, and $f_{s,z}$
    is the ion distribution function in m^-3 (m s^-1)^-3. The integration domain selects
    ions moving toward the wall.


    In practice this quantity is estimated from ion particle fluxes and impact energies
    using boundary plasma diagnostics, sheath or edge-plasma modeling, kinetic simulations,
    or wall heat-flux measurements combined with a decomposition of the total heat
    load. Separating the ion kinetic contribution from electron heat flux, neutral
    heat flux, potential-energy terms, radiation, and emitted-particle losses generally
    requires model assumptions.


    Typical magnitudes are strongly dependent on wall location and plasma regime.
    Main-chamber surfaces may receive values from about 10^2-10^5 W m^-2, while divertor
    or limiter strike regions in attached or partially detached operation can reach
    about 10^5-10^7 W m^-2; short transient events can be substantially larger.


    Sign convention: Positive when the wall-normal ion kinetic energy flux is directed
    from the plasma into the wall material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:kinetic_energy_flux_at_wall
  - name:electron_kinetic_energy_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident/values
    status: composed
- name: ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Kinetic energy flux density carried by ions leaving the plasma-facing
    wall through surface emission processes such as physical sputtering and ion backscattering.
  documentation: "The kinetic energy flux density at the plasma-facing wall surface\
    \ carried by ions emitted outward via surface emission \u2014 the family of plasma\u2013\
    wall interaction processes, including physical sputtering, chemical sputtering,\
    \ and ion backscattering, that return ionic species from the wall to the plasma.\
    \ The `kinetic` qualifier restricts this to translational kinetic energy of the\
    \ emitted ion velocity distribution, excluding potential energy stored in electronic\
    \ excitation or residual ionization charge, which is captured separately by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).\n\
    \nThe emitted kinetic energy flux $\\Phi_{\\mathrm{kin,emit}}$ sums over all emitted\
    \ ion species $s$:\n\n$$\n\\Phi_{\\mathrm{kin,emit}} = \\sum_s \\int_{v_n > 0}\
    \ \\tfrac{1}{2} m_s v^2 \\, v_n \\, f_{s,\\mathrm{emit}}(\\mathbf{v}) \\, d^3v\n\
    $$\n\nwhere $m_s$ is the ion mass of species $s$, $v = |\\mathbf{v}|$ is the ion\
    \ speed, $v_n > 0$ is the outward surface-normal velocity component at the wall,\
    \ and $f_{s,\\mathrm{emit}}(\\mathbf{v})$ is the velocity distribution function\
    \ of emitted ions.\n\nIn plasma\u2013surface interaction modeling, this flux is\
    \ evaluated by convolving incident plasma conditions with energy-resolved surface\
    \ emission yields and backscattering coefficients from binary-collision approximation\
    \ databases. It is the mechanism-attributed form of [ion_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission)\
    \ and the emitted counterpart to [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),\
    \ which captures the incident kinetic flux. Charge-state-resolved contributions\
    \ are tracked by ion_state_energy_flux_at_wall, and the electron analog is [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_kinetic_energy_flux_at_wall
  - name:electron_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    status: composed
- name: ion_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Aggregate incident particle flux of ions, summed over all charge states,
    arriving at the plasma-facing wall surface.
  documentation: 'The ion particle flux at the wall is the aggregate rate at which
    ions from the plasma impinge on a unit area of plasma-facing material, summed
    over all ion charge states. As the ion-species component of the total [particle_flux_at_wall](name:particle_flux_at_wall),
    it does not include contributions from neutral particles (see [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall))
    or electrons.


    In fluid plasma models, the incident flux $\Gamma_i^{\rm wall}$ at a wall surface
    element with inward surface normal $\hat{n}$ is:


    $$

    \Gamma_i^{\rm wall} = \sum_z n_{i,z} \, \mathbf{u}_{i,z} \cdot \hat{n}

    $$


    where $n_{i,z}$ is the number density of ions in charge state $z$ and $\mathbf{u}_{i,z}$
    is the corresponding bulk ion flow velocity, with the summation running over all
    charge states $z$. The charge-state-resolved analog is given by [ion_state_particle_flux_at_wall](name:ion_state_particle_flux_at_wall).


    This flux is computed as a surface boundary output of edge plasma fluid simulations
    or estimated from experimental ion saturation current density measurements via
    the Bohm sheath criterion. Together with [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),
    it characterizes the particle and energy loading on plasma-facing components and
    serves as a key input to sputtering yield and fuel-retention models.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall
  - name:neutral_particle_flux_at_wall
  - name:ion_state_particle_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/particle_fluxes/ion/emitted/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/ion/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/particle_fluxes/ion/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/ion/incident/values
    status: composed
- name: ion_state_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Energy flux density emitted from a plasma-facing wall by recombination
    of a specified ion charge state. It gives the charge-state-resolved contribution
    to the recombination energy released per unit wall area.
  documentation: 'Ion-state recombination energy flux at the wall is the power per
    unit plasma-facing surface area emitted at the surface when ions of a specified
    species and charge state recombine. It represents only that initial charge-state
    contribution; summing over charge states for one ion species gives [ion_energy_flux_at_wall_due_to_recombination](name:ion_energy_flux_at_wall_due_to_recombination),
    and summing over ion species gives [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).
    This quantity refers to recombination energy release, not to the incident ion
    kinetic or thermal energy flux.


    For ions of species $s$ arriving in charge state $z$, a local estimate is the
    recombining particle flux multiplied by the total ionization energy recovered
    during neutralization:


    $$

    q^{\mathrm{rec}}_{s,z} = \Gamma_{s,z} \, e \sum_{k=1}^{z} I_{s,k}

    $$


    where $q^{\mathrm{rec}}_{s,z}$ is the recombination energy flux density in W m$^{-2}$,
    $\Gamma_{s,z}$ is the flux of recombining ions of species $s$ and charge state
    $z$ to the wall in m$^{-2}$ s$^{-1}$, $I_{s,k}$ is the $k$th ionization potential
    of species $s$ in eV, and $e$ converts eV to joule. More detailed surface models
    may partition this released energy among photons, emitted neutrals, electrons,
    and solid-surface heating, but the charge-state-resolved energy scale is set by
    the sum of ionization potentials.


    In practice this quantity is computed from charge-state-resolved ion fluxes to
    plasma-facing components together with atomic ionization energies and surface
    recombination or neutralization models. It may also be constrained indirectly
    by combining particle-flux estimates from probes, spectroscopy, or particle balance
    with atomic data, while keeping it separate from incident kinetic heat flux, radiation
    absorbed at the wall, and chemical or sputtering energy terms.


    Typical charge-state-resolved values range from less than 10$^{2}$ W m$^{-2}$
    on weakly wetted wall regions to 10$^{4}$-10$^{6}$ W m$^{-2}$ in recycling divertor
    or limiter regions. Local values can approach 10$^{6}$-10$^{7}$ W m$^{-2}$ for
    very large particle fluxes or high charge states, but the summed recombination
    contribution is usually below the total plasma heat load.


    Sign convention: Positive when recombination energy is emitted from the wall surface
    into the adjacent plasma or vacuum.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:ion_state_kinetic_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    status: composed
- name: ion_state_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident particle flux of ions in a specific charge state at the plasma-facing
    wall surface.
  documentation: 'Ions bombarding plasma-facing surfaces arrive in a range of charge
    states whose individual contributions govern sputtering thresholds, energy deposition,
    and fuel recycling. This quantity gives the local incident particle flux from
    ions in a single specified charge state $z$, the charge-state-resolved building
    block of the total ion bombardment.


    The incident flux from ions in charge state $z$ is:


    $$

    \Gamma_{\mathrm{ion},z} = n_{\mathrm{ion},z} \, v_{\perp,z}

    $$


    where $n_{\mathrm{ion},z}$ is the local number density of ions in charge state
    $z$ (m$^{-3}$) and $v_{\perp,z}$ is their mean velocity component directed toward
    the wall surface (m s$^{-1}$).


    Summing over all charge states recovers [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall);
    including all particle species (neutrals, electrons) gives [particle_flux_at_wall](name:particle_flux_at_wall).
    The structurally analogous quantity for neutral particles resolved by quantum
    state is [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).
    Charge-state resolution is essential for computing state-dependent sputtering
    yields and surface chemistry reactions in plasma-wall interaction models.


    Typical incident ion fluxes in tokamak boundary plasmas range from $10^{19}$ to
    $10^{22}$ m$^{-2}$ s$^{-1}$, with peak values near divertor strike points on plasma-facing
    components.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_particle_flux_at_wall
  - name:particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/particle_fluxes/ion/state/emitted/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/ion/state/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/particle_fluxes/ion/state/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/ion/state/incident/values
    status: composed
- name: iron_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of iron (Fe) impurity ions in the plasma immediately
    adjacent to a limiter surface, excluding neutral iron atoms.
  documentation: 'Iron density at the limiter is the local number density of ionized
    iron in the plasma-side region next to a limiter surface. It represents iron impurity
    ions only; neutral Fe atoms are excluded from this quantity.


    When charge states are resolved, the total iron ion density is the sum over all
    positive ionization states:


    $$

    n_{\mathrm{Fe}} = \sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}}

    $$


    where $n_{\mathrm{Fe}}$ is the total iron ion number density in m$^{-3}$, $q$
    is the ion charge state, and $n_{\mathrm{Fe}^{q+}}$ is the number density in m$^{-3}$
    of iron ions with charge $+q e$. The sum starts at $q=1$, so neutral iron, $\mathrm{Fe}^0$,
    is not included.


    In practice this quantity is obtained from local or modeled impurity-ion densities
    evaluated at the plasma-facing limiter boundary. If only charge-state-resolved
    densities are available, they are summed over ionized charge states; if a total
    iron ion density is available directly, it should correspond to the same ion-only
    definition.


    Typical values are highly device-, discharge-, material-, and plasma-edge dependent,
    and no universal range is implied by the definition. The value is non-negative
    and is expressed in m$^{-3}$.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:iron_density_at_divertor_target
  - name:iron_density_at_pedestal
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/limiter/n_i/iron/value
    dd_path: summary/local/limiter/n_i/iron/value
    status: composed
- name: krypton_density_at_limiter
  kind: scalar
  status: draft
  description: Local krypton ion number density evaluated at the plasma-facing limiter
    surface, where impurity sputtering and recycling connect edge plasma composition
    to the wall material.
  documentation: 'The krypton number density at the limiter is the local volumetric
    count of krypton ions per unit volume at the plasma-side limiter contact point,
    near the sheath entrance of this plasma-facing component. It is the krypton-species-resolved
    component of the total [density_at_limiter](name:density_at_limiter). When individual
    ionization stages are resolved, this quantity equals their sum:


    $$

    n_\mathrm{Kr}(x_\mathrm{lim}) = \sum_{q=1}^{36} n_{\mathrm{Kr}^{q+}}(x_\mathrm{lim})

    $$


    where $n_{\mathrm{Kr}^{q+}}$ is the number density of krypton ions in charge state
    $q+$ at the limiter evaluation point $x_\mathrm{lim}$; when charge states are
    not individually resolved, this sum is implicit.


    Krypton ($Z = 36$) is a high-atomic-number noble gas that can be seeded into the
    edge plasma for radiative cooling of the scrape-off layer, disruption mitigation
    studies, or impurity transport experiments near plasma-facing components. Its
    local concentration at the limiter is governed by sputtering sources, charge-exchange
    recycling, and cross-field impurity transport from the confined region. Spatial
    counterparts at other poloidal positions include [krypton_density_at_pedestal](name:krypton_density_at_pedestal),
    [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    and [krypton_density_at_magnetic_axis](name:krypton_density_at_magnetic_axis);
    the [volume_averaged_krypton_density](name:volume_averaged_krypton_density) characterizes
    the global impurity inventory.


    Sign convention: Positive when krypton ions are present at the limiter location,
    consistent with particle number density being a non-negative definite quantity.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:krypton_density_at_magnetic_axis
  - name:volume_averaged_krypton_density
  sources:
  - id: dd:summary/local/limiter/n_i/krypton/value
    dd_path: summary/local/limiter/n_i/krypton/value
    status: composed
- name: lithium_density_at_limiter
  kind: scalar
  status: draft
  description: Lithium ion number density in the plasma immediately adjacent to the
    limiter surface, where lithium impurities originate from wall conditioning, sputtering,
    or deliberate injection.
  documentation: 'Lithium ion number density at the limiter quantifies the local concentration
    of lithium ions in the plasma at the limiter contact region, evaluated near the
    sheath entrance on the plasma side rather than within the solid wall material.
    It is the lithium-species contribution to the total [density_at_limiter](name:density_at_limiter),
    isolating lithium impurities arising from sputtering, desorption, or intentional
    wall conditioning from contributions by other ion species present at the same
    location.


    The number density is defined as the lithium ion count per unit volume adjacent
    to the limiter surface, $n_{\mathrm{Li}} = N_{\mathrm{Li}} / V$, where $N_{\mathrm{Li}}$
    is the number of lithium ions within the volume element $V$.


    Measurement relies on passive or active optical emission spectroscopy detecting
    characteristic lithium line emission from the plasma edge, or on edge transport
    models constrained by spectroscopic observations of the limiter vicinity. In lithium
    wall-conditioning experiments, elevated values at the limiter reflect recycled
    and re-ionized lithium returning from the plasma-facing surface. Typical edge
    lithium densities in conditioning regimes range from $10^{15}$ to $10^{18}\ \mathrm{m^{-3}}$,
    depending on conditioning intensity and plasma parameters.


    For the same species at other spatial locations, [lithium_density_at_pedestal](name:lithium_density_at_pedestal)
    and [lithium_density_at_divertor_target](name:lithium_density_at_divertor_target)
    provide analogous localized quantities, while [line_averaged_lithium_density](name:line_averaged_lithium_density)
    gives the chord-integrated complement useful for global impurity inventory estimates.


    Sign convention: Positive for any finite concentration of lithium ions at the
    limiter position, consistent with number density being a non-negative particle
    count per unit volume.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:lithium_density_at_pedestal
  - name:lithium_density_at_divertor_target
  - name:line_averaged_lithium_density
  sources:
  - id: dd:summary/local/limiter/n_i/lithium/value
    dd_path: summary/local/limiter/n_i/lithium/value
    status: composed
- name: neon_density_at_limiter
  kind: scalar
  status: draft
  description: Neon ion number density in the boundary plasma immediately adjacent
    to a limiter surface, evaluated at the plasma-side sheath entrance. It is summed
    over neon ionization stages unless a charge-state-resolved quantity is specified.
  documentation: 'Neon density at the limiter is the local number density of neon
    ions in the boundary plasma just outside a limiter surface, at the plasma-side
    sheath entrance. It is the limiter-surface analog of [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),
    restricted to the plasma-wall interaction region rather than the global plasma
    boundary.


    For a small plasma volume adjacent to the limiter, the charge-state-summed neon
    ion density is the count of neon ions per unit volume:


    $$

    n_\mathrm{Ne} = \frac{N_\mathrm{Ne}}{V}

    $$


    where $N_\mathrm{Ne}=\sum_z N_{\mathrm{Ne}^{z+}}$ is the total number of neon
    ions over all included ionization stages and $V$ is the sampled plasma volume
    in m^3, giving $n_\mathrm{Ne}$ in m^-3.


    In practice this quantity is inferred from limiter-viewing spectroscopy with collisional-radiative
    modeling, from edge impurity transport analysis constrained by local electron
    density and temperature, or from plasma-wall interaction simulations. It counts
    neon ions in the plasma, not neutral neon at the wall and not a charge-weighted
    quantity such as an effective charge contribution.


    Typical limiter-adjacent neon ion densities are about 10^14-10^18 m^-3 in trace
    to moderately seeded boundary plasmas, with local values approaching 10^19 m^-3
    during strong neon puffing or very dense, cool edge conditions.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_pedestal
  - name:xenon_density_at_limiter
  - name:argon_density_at_limiter
  - name:nitrogen_density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/neon/value
    dd_path: summary/local/limiter/n_i/neon/value
    status: composed
- name: neutral_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident wall-normal arrival flux density of neutral atoms and molecules
    in the kinetic-energy channel reaching a plasma-facing wall, summed over neutral
    species and internal quantum states. It counts particle arrivals per unit wall
    area and time, expressed in arrivals per square meter per second, and is not a
    heat flux in watts per square meter.
  documentation: 'Neutral energy flux at the wall is the incident arrival flux density
    of neutral atoms and molecules associated with the kinetic-energy channel at a
    plasma-facing surface, summed over all neutral species and internal quantum states.
    Despite the term "energy flux" in the name, its canonical unit is particle arrivals
    per square meter per second, so it is a particle-rate quantity and not an energy-weighted
    heat flux in watts per square meter.


    For a point on the wall it is defined from the inward-directed part of the neutral
    velocity distribution as the wall-normal arrival rate per unit area:


    $$

    \Gamma^{\mathrm{inc}} = \sum_{\alpha} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_p<0}
    \left(-\mathbf{v}\cdot\hat{\mathbf{n}}_p\right) f_{\alpha}^{0}(\mathbf{x}_w,\mathbf{v})\,
    d^3v

    $$


    where $\Gamma^{\mathrm{inc}}$ has units $\mathrm{m^{-2}\,s^{-1}}$, $\alpha$ labels
    neutral species and internal states, $\hat{\mathbf{n}}_p$ is the unit normal pointing
    from the material wall toward the plasma, $\mathbf{x}_w$ is the wall position
    in meters, $\mathbf{v}$ is the neutral velocity in meters per second, and $f_{\alpha}^{0}$
    is the neutral distribution function with units $\mathrm{s^3\,m^{-6}}$. No factor
    of kinetic energy multiplies the integrand: an energy-weighted neutral heat flux
    would require weighting by $E_k = m_{\alpha} v^2 / 2$ and would instead carry
    units $\mathrm{W\,m^{-2}}$.


    This quantity is obtained from neutral transport modeling and kinetic wall tallies
    that accumulate inward-crossing neutral trajectories, with contributions summed
    over atomic, molecular, and excited populations. It is the species- and state-summed
    counterpart of [neutral_state_energy_flux_at_wall](name:neutral_state_energy_flux_at_wall);
    the analogous quantity without the kinetic-channel qualifier is [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),
    whose state-resolved form is [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).
    It should be distinguished from [energy_flux_at_wall](name:energy_flux_at_wall_due_to_eddy_current),
    which is an energy-weighted wall loading rather than a particle-rate flux.


    Typical values are about $10^{18}-10^{21}\ \mathrm{m^{-2}\,s^{-1}}$ on main-chamber
    surfaces and $10^{21}-10^{24}\ \mathrm{m^{-2}\,s^{-1}}$ in strongly recycling
    divertor or limiter regions, depending on plasma density, recycling coefficient,
    fueling rate, and wall geometry.


    Sign convention: Positive when neutral particles cross the wall surface from the
    plasma side toward the material wall.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_energy_flux_at_wall
  - name:neutral_particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  - name:energy_flux_at_wall_due_to_eddy_current
  arguments:
  - name: energy_flux_at_wall_due_to_eddy_current
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/incident/values
    status: composed
- name: neutral_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident flux of neutral particles (atoms and molecules) arriving at
    the plasma-facing wall per unit area per unit time, summed over all quantum states
    of the neutral species.
  documentation: 'The neutral particle flux at the wall is the local rate per unit
    area at which neutral atoms and molecules impinge on plasma-facing material from
    the plasma-boundary region. It is the total neutral contribution to [particle_flux_at_wall](name:particle_flux_at_wall),
    summed over all quantum states of the neutral species. Neutrals reaching the wall
    arrive primarily through charge-exchange reactions and recombination in the scrape-off
    layer, gas injection, and desorption from the surface.


    The incident neutral flux density is defined by integrating the wall-directed
    component of the neutral velocity distribution:


    $$

    \Gamma_n = \int_{v_\perp > 0} v_\perp \, f_n(\mathbf{v}) \, d^3v

    $$


    where $v_\perp$ is the velocity component directed toward the wall surface and
    $f_n(\mathbf{v})$ is the neutral particle velocity distribution function.


    This flux is a primary driver of fuel recycling, hydrogenic implantation, and
    physical sputtering of plasma-facing components. The quantum-state-resolved analog
    [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall)
    decomposes this total by individual electronic excitation state, while [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall)
    gives the associated kinetic energy carried by the same neutral population. The
    species counterparts [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall)
    and [electron_particle_flux_at_wall](name:electron_particle_flux_at_wall) complete
    the particle-species decomposition of the total wall loading.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  - name:neutral_energy_flux_at_wall
  - name:ion_particle_flux_at_wall
  - name:electron_particle_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/emitted/values
    status: composed
  - id: dd:wall/description_ggd/ggd/particle_fluxes/neutral/emitted/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/neutral/emitted/values
    status: attached
  - id: dd:wall/description_ggd/ggd/particle_fluxes/neutral/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/neutral/incident/values
    status: composed
- name: neutral_state_energy_flux_due_to_recombination
  kind: scalar
  status: draft
  description: Incident energy-resolved flux density of neutral particles in a specified
    quantum state produced by recombination and directed toward a plasma-facing wall
    surface.
  documentation: 'Neutral state energy flux due to recombination is the incident,
    energy-resolved flux density of neutral particles in a specified quantum state
    that are produced by recombination and cross a plasma-facing surface toward the
    material. It counts the neutral particle flow associated with a kinetic-energy
    channel and internal state, so its canonical unit is m^-2 s^-1 rather than power
    per unit area.


    For a surface element with unit normal $\hat{\mathbf n}_w$ directed from the material
    toward the plasma, the incident flux in state $q$ and energy interval $\Delta
    E$ may be written as


    $$

    \Gamma_{q,\Delta E}^{\mathrm{rec,inc}} = \int_{\mathbf v\cdot\hat{\mathbf n}_w
    < 0,\ E(\mathbf v)\in\Delta E} \left(-\mathbf v\cdot\hat{\mathbf n}_w\right) f_q^{\mathrm{rec}}(\mathbf
    x_w,\mathbf v)\,d^3v

    $$


    where $f_q^{\mathrm{rec}}$ is the velocity distribution of recombination-produced
    neutrals in quantum state $q$ at wall position $\mathbf x_w$, $E(\mathbf v)$ is
    their kinetic energy, and $-\mathbf v\cdot\hat{\mathbf n}_w$ is the positive speed
    component into the wall. Integrating over energy intervals and summing over neutral
    states gives the corresponding total recombination-produced incident neutral flux.


    In practice this quantity is obtained from edge-plasma and plasma-wall interaction
    modeling, neutral transport calculations, or diagnostics combined with a collisional-radiative
    model that resolves recombination channels and neutral-state populations. It is
    non-negative because only particles crossing toward the surface are included;
    neutrals moving away from the surface are part of the outgoing flux, not the incident
    flux.


    Typical values depend strongly on plasma density, electron temperature near the
    surface, recycling, and detached-divertor conditions. Representative incident
    state-resolved recombination fluxes can range from 10^16-10^22 m^-2 s^-1, with
    the largest values usually occurring in cold, dense recombining boundary plasmas.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_due_to_recombination
  - name:energy_flux_due_to_recombination
  - name:neutral_state_energy_flux_at_wall
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:ion_state_energy_flux_at_wall_due_to_recombination
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/incident/values
    status: composed
- name: neutral_state_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident particle flux at the plasma-facing wall for neutral particles
    in a specified quantum state, such as a particular electronic energy level or
    molecular internal state.
  documentation: "The particle flux at the wall for a neutral species in a given quantum\
    \ state quantifies the local arrival rate of neutrals \u2014 carrying a specific\
    \ electronic excitation level, charge state, or internal molecular state \u2014\
    \ per unit area of plasma-facing material. It provides finer resolution than [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),\
    \ which sums over all neutral states, enabling plasma-wall interaction models\
    \ to track contributions from individual neutral populations such as ground-state\
    \ atoms, excited neutrals, or molecular dissociation products.\n\nThe incident\
    \ flux in quantum state $s$ is defined as:\n\n$$\n\\Gamma_{\\rm wall}^{(s)} =\
    \ \\int_{v_n > 0} v_n \\, f_s(\\mathbf{v}) \\, d^3v\n$$\n\nwhere $f_s(\\mathbf{v})$\
    \ is the velocity distribution function of neutrals in state $s$ and $v_n$ is\
    \ the component of particle velocity normal to the wall surface, with the integral\
    \ restricted to particles directed toward the wall.\n\nThis quantity is evaluated\
    \ in plasma-edge neutral-transport codes that resolve neutral populations by quantum\
    \ state using collisional-radiative models describing excitation, ionization,\
    \ and recombination transitions. Summing over all neutral quantum states yields\
    \ [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall), while including\
    \ all particle species gives the total incident loading captured in [particle_flux_at_wall](name:particle_flux_at_wall).\
    \ The corresponding kinetic energy flux for the same quantum state is given by\
    \ [neutral_state_energy_flux_at_wall](name:neutral_state_energy_flux_at_wall)."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall
  - name:particle_flux_at_wall
  - name:neutral_state_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/state/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/state/emitted/values
    status: composed
