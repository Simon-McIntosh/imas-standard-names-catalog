name: mass_spectrometer_collected_ion_current
status: draft
description: Electrical current collected at the detector of a mass spectrometer channel,
  proportional to the partial pressure of the selected mass-to-charge ratio.
documentation: The collected ion current $I_{\rm col}$ (in amperes) is the raw electrical
  signal at the Faraday cup or secondary-electron multiplier of a residual gas analyzer
  (RGA) or quadrupole mass spectrometer. For a given mass-to-charge ratio $m/z$, $I_{\rm
  col}$ is proportional to the partial pressure $p_i$ of the corresponding species
  via $I_{\rm col} = S_i \, p_i$, where $S_i$ is the species-dependent sensitivity
  factor (A Pa$^{-1}$) that accounts for ionization cross-section and transmission
  efficiency. Typical collected currents range from $10^{-14}$ A (ultra-high vacuum
  background) to $10^{-6}$ A (during gas injection or wall outgassing events). Mass
  spectrometry is a primary diagnostic for monitoring fuel composition (H, D, T),
  impurity species (He, N$_2$, O$_2$, H$_2$O), and wall conditioning efficiency in
  fusion devices. See `partial_pressure_of_isotope` for the calibrated partial pressure
  derived from this current and `atomic_mass` for species identification.
