      kind: llm
- name: toroidal_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: active
  description: "Imaginary part of the complex amplitude of the mode-n toroidal plasma-velocity\
    \ perturbation in the right-handed cylindrical (R, \u03C6, Z) frame. It is the\
    \ \u03C6 component of a single toroidal Fourier harmonic and is not the equilibrium\
    \ toroidal flow."
  documentation: 'The imaginary part of the complex amplitude of the mode-$n$ toroidal
    plasma-velocity perturbation is the coefficient of $i$ in the toroidal component
    of the first-order plasma velocity perturbation for a single toroidal Fourier
    harmonic. The toroidal component is the projection onto $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is a perturbation eigenfunction component,
    not the equilibrium toroidal flow.


    For a harmonic with phase dependence proportional to $e^{i(n\phi-\omega t)}$,
    the full complex toroidal component combines this quantity with the matched real
    part [toroidal_perturbed_plasma_velocity_real_part](name:toroidal_perturbed_plasma_velocity_real_part):


    $$

    \delta \hat{v}_{\phi,n}(R,Z) = \delta \hat{\mathbf{v}}_n(R,Z)\cdot\hat{\phi} =
    \operatorname{Re}\!\left[\delta \hat{v}_{\phi,n}(R,Z)\right] + i\,\operatorname{Im}\!\left[\delta
    \hat{v}_{\phi,n}(R,Z)\right]

    $$


    where $\delta \hat{\mathbf{v}}_n$ is the complex first-order velocity amplitude
    for toroidal mode number $n$, $\delta \hat{v}_{\phi,n}$ is its toroidal projection,
    $\omega$ is the mode angular frequency in the phase factor, and $i$ is the imaginary
    unit.


    This quantity is defined for one specified toroidal mode number $n$; contributions
    from other toroidal harmonics are excluded. A global phase rotation of the eigenfunction
    changes the split between real and imaginary parts, so this component must be
    interpreted with the matched real part and the chosen eigenfunction phase reference.


    Sign convention: Positive when the imaginary coefficient of the toroidal velocity
    perturbation is directed along $\hat{\phi}$, the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-velocity_perturbed-coordinate3-imaginary
