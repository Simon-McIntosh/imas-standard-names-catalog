- name: edge_localized_mode_frequency
  kind: scalar
  status: draft
  description: Repetition rate of edge-localized mode bursts during an ELMing H-mode
    phase. It quantifies how often pedestal relaxation events occur and sets the cadence,
    not the size, of transient particle and energy exhaust to the scrape-off layer
    and divertor.
  documentation: 'Edge-localized mode frequency is the rate at which discrete ELM
    bursts occur during an ELMing H-mode phase. It characterizes the temporal spacing
    of pedestal relaxation events; the energy or particle loss per burst must be specified
    separately from this rate.


    For an analysis window of duration $\Delta t$, the frequency is defined by counting
    ELM onsets within that window:


    $$

    f_\mathrm{ELM} = \frac{N_\mathrm{ELM}}{\Delta t} \simeq \frac{1}{\langle \tau_\mathrm{ELM}
    \rangle}

    $$


    where $N_\mathrm{ELM}$ is the number of accepted ELM events, $\Delta t$ is measured
    in seconds, $f_\mathrm{ELM}$ is in Hz ($\mathrm{s}^{-1}$), $\tau_\mathrm{ELM}$
    is the time between consecutive ELM onsets in seconds, and $\langle \tau_\mathrm{ELM}
    \rangle$ is the mean inter-ELM interval over the same window. The reciprocal-interval
    form is equivalent to the count rate when the same events and boundary treatment
    are used.


    In practice, ELM onsets are identified from correlated transient signatures such
    as edge light emission, divertor heat-flux pulses, magnetic fluctuations, density
    bursts, or pedestal profile drops. The averaging window should be chosen so that
    it is short enough to follow slow discharge evolution but long enough to contain
    representative events; intervals with no ELMing H-mode, ambiguous compound events,
    pacing triggers, or deliberately selected ELM classes should be treated by a consistent
    event-selection rule.


    Typical values span about 0.5-1000 Hz. Large, infrequent ELM regimes are often
    below 10 Hz, many routinely ELMing H-mode plasmas are in the 10-100 Hz range,
    and small-ELM or actively paced regimes can reach 100-1000 Hz; a value of 0 Hz
    indicates that no accepted ELM events occurred in the averaging window.'
  unit: Hz
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
- name: effective_charge_at_pedestal
  kind: scalar
  status: draft
  description: Effective charge (Zeff) at the H-mode pedestal, measuring impurity
    content through the charge-weighted mean squared ion charge near the edge transport
    barrier.
  documentation: 'Effective charge at the pedestal is the local plasma effective charge
    evaluated in the H-mode edge transport barrier. It is a dimensionless measure
    of impurity content: hydrogenic fuel ions alone give a value close to one, while
    impurity ions increase the value in proportion to both their density and the square
    of their charge state.


    The effective charge is the electron-density-normalized, charge-squared weighted
    ion density sum:


    $$

    Z_\mathrm{eff} = \frac{\sum_s n_s Z_s^2}{n_e}

    $$


    where the sum is over ion species $s$, $n_s$ is the ion density of species $s$
    in m^-3, $Z_s$ is its mean ionization state, and $n_e$ is the electron density
    in m^-3; for a quasineutral plasma, $n_e = \sum_s n_s Z_s$.


    Pedestal effective charge is inferred from impurity spectroscopy, visible or soft-X-ray
    bremsstrahlung, charge-exchange measurements, and edge transport or equilibrium
    analysis constrained by electron density and temperature. Optically thin bremsstrahlung
    emissivity scales approximately with $n_e^2 Z_\mathrm{eff} T_e^{1/2}$, making
    the pedestal value important for radiation, collisionality, resistivity, and bootstrap-current
    estimates in the edge transport barrier.


    Typical pedestal values in H-mode tokamak plasmas are about 1.2-3.5. Values close
    to 1 indicate a nearly pure hydrogenic plasma, while larger values occur with
    impurity seeding, enhanced wall influx, or accumulation of high-charge-state impurities.


    This quantity complements the generic [effective_charge](name:effective_charge),
    location-specific values such as [effective_charge_at_magnetic_axis](name:effective_charge_at_magnetic_axis),
    [effective_charge_at_internal_transport_barrier](name:effective_charge_at_internal_transport_barrier),
    and [effective_charge_at_limiter](name:effective_charge_at_limiter), and global
    measures such as [volume_averaged_effective_charge](name:volume_averaged_effective_charge).'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_magnetic_axis
  - name:effective_charge_at_internal_transport_barrier
- name: effective_charge_at_plasma_boundary
  kind: scalar
  status: draft
  description: Effective charge number of the ion mixture at the plasma boundary (separatrix),
    equal to the charge-squared-weighted sum of ionic densities normalized to electron
    density.
  documentation: "The effective charge $Z_\\text{eff}$ at the plasma boundary captures\
    \ the aggregate charge state of all ion species at the last closed flux surface,\
    \ where the magnetically confined plasma transitions to the open-field-line scrape-off\
    \ layer. In a pure hydrogenic plasma $Z_\\text{eff} = 1$; impurity ions with charge\
    \ state $Z_i > 1$ raise $Z_\\text{eff}$ above unity, increasing resistivity and\
    \ impurity radiation losses.\n\n$$\nZ_\\text{eff} = \\frac{\\sum_i n_i Z_i^2}{n_e}\n\
    $$\n\nwhere $n_i$ is the number density of ion species $i$, $Z_i$ is the charge\
    \ state of species $i$, and $n_e$ is the electron number density, with the sum\
    \ running over all ion species and charge states present at the boundary.\n\n\
    At the separatrix, $Z_\\text{eff}$ is sensitive to plasma-wall interactions, impurity\
    \ seeding, and edge transport processes that concentrate high-$Z$ ions near the\
    \ boundary. It governs local Spitzer resistivity ($\\eta \\propto Z_\\text{eff}$)\
    \ and modifies neoclassical transport coefficients in the edge region. The [electron_pressure_at_plasma_boundary](name:electron_pressure_at_plasma_boundary)\
    \ and [hydrogen_density_at_plasma_boundary](name:hydrogen_density_at_plasma_boundary)\
    \ characterize the thermodynamic state at the same boundary location; the analogous\
    \ pedestal quantity is [effective_charge_at_pedestal](name:effective_charge_at_pedestal).\
    \ It is inferred from visible bremsstrahlung spectroscopy or from consistency\
    \ between line-integrated electron density and charge-exchange spectroscopy.\n\
    \nTypical values range from 1 in near-pure hydrogen plasmas to 2\u20135 in impurity-seeded\
    \ or metallic-wall discharges.\n\nSign convention: Positive when ions are present,\
    \ as $Z_\\text{eff}$ is defined as a ratio of positive-definite charge-weighted\
    \ ion densities to electron density."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_plasma_boundary
  - name:hydrogen_density_at_plasma_boundary
  - name:effective_charge_at_pedestal
- name: electron_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Positive radial e-folding length of electron number density in the
    scrape-off layer, defined as the inverse magnitude of the outward logarithmic
    radial gradient. It measures how rapidly electron density falls with distance
    outside the confined plasma.
  documentation: 'Electron decay length in the scrape-off layer is the positive e-folding
    length for the falloff of electron number density with outward distance across
    the scrape-off layer. It characterizes the radial width of the electron-density
    decay region; a larger value means a more gradual decrease of density outside
    the confined plasma.


    For a local outward distance coordinate $x$, the decay length is defined by the
    inverse magnitude of the logarithmic density gradient:


    $$

    \lambda_{n_e} = \left|\frac{d\ln n_e}{dx}\right|^{-1} = \frac{n_e}{\left|d n_e/dx\right|}

    $$


    where $n_e$ is electron number density in $m^{-3}$, $x$ is outward distance in
    m across the scrape-off layer, and $\lambda_{n_e}$ is the decay length in m. The
    absolute value makes the quantity non-negative for the usual outward density decrease
    and for local gradients of either sign.


    In practice, $\lambda_{n_e}$ is obtained by fitting or differentiating electron-density
    measurements in the scrape-off layer, commonly using Langmuir probes, Thomson
    scattering, reflectometry, or equilibrium-mapped edge measurements over a specified
    radial interval. It is conceptually equivalent to [radial_electron_decay_length_over_scrape_off_layer](name:electron_decay_length_over_scrape_off_layer)
    when the decay direction is the outward radial direction; the explicitly radial
    name is useful when distinguishing this scale from parallel, poloidal, or other
    directional decay lengths.


    Typical values in tokamak scrape-off-layer analyzes are about 0.001-0.05 m, depending
    on plasma conditions, magnetic geometry, density, fueling, recycling, and the
    radial interval used for the fit.'
  unit: m
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
- name: electron_density_at_launching_position
  kind: scalar
  status: draft
  description: Electron number density in the edge plasma immediately adjacent to
    a wave launcher aperture or waveguide mouth.
  documentation: 'Electron density at the launching position is the local number density
    of free electrons in the plasma that a launched electromagnetic wave first encounters.
    The launching position denotes the small plasma volume immediately in front of
    the launcher face, grill, or waveguide mouth, typically in the scrape-off-layer
    or limiter-shadow region. It is the electron-specific form of density_at_launching_position;
    unlike a total particle density, it counts free electrons only, and in a quasineutral
    plasma is approximately balanced by the charge-weighted ion density rather than
    by neutral density.


    A key wave-coupling scale set by this density is the electron plasma angular frequency:


    $$

    \omega_{pe} = \left(\frac{n_e e^2}{\varepsilon_0 m_e}\right)^{1/2}

    $$


    where $n_e$ is the electron density in m$^{-3}$, $e$ is the elementary charge
    in coulombs, $\varepsilon_0$ is the vacuum permittivity in F m$^{-1}$, $m_e$ is
    the electron mass in kg, and $\omega_{pe}$ is in rad s$^{-1}$. For lower-hybrid
    coupling estimates, $n_e$ also enters the approximate cold-plasma accessibility
    condition $n_\parallel^2 \ge 1 + \omega_{pe}^2/\omega_{ce}^2$, where $n_\parallel$
    is the dimensionless parallel refractive index, $\omega_{ce}=eB/m_e$ is the electron
    cyclotron angular frequency in rad s$^{-1}$ for magnetic-field magnitude $B$ in
    tesla, and launched-wave angular frequencies are in rad s$^{-1}$ or equivalently
    $f=\omega/(2\pi)$ in Hz.


    In practice this density is measured or inferred from edge diagnostics viewing
    the launcher vicinity, such as Langmuir probes, microwave reflectometry, interferometry,
    or analysis of wave coupling behavior. The reported value should represent the
    plasma immediately outside the launching structure, not a core density or a distant
    separatrix value; comparisons with electron_density_at_separatrix and [electron_density_at_limiter](name:electron_density_at_limiter)
    help distinguish launcher-local conditions from other edge reference locations.


    Typical values near wave launchers in tokamak edge plasmas are about $10^{17}$-$10^{19}$
    m$^{-3}$, with lower-hybrid launcher coupling often sensitive in the $10^{17}$-$10^{18}$
    m$^{-3}$ range. The value can vary strongly with gas puffing, recycling from plasma-facing
    components, launcher-plasma gap, magnetic geometry near the edge, and transient
    edge events.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_limiter
- name: electron_density_at_pedestal
  kind: scalar
  status: draft
  description: Electron number density at the H-mode pedestal top, the core-side transition
    where the steep-gradient edge transport barrier meets the flatter core density
    variation.
  documentation: 'Electron density at the pedestal is the local [electron density](name:electron_density)
    at the H-mode pedestal top. The pedestal top is the core-side transition of the
    edge transport barrier, where the steep edge density gradient connects to the
    flatter core density variation, and is distinct from the separatrix or scrape-off-layer
    density.


    The quantity is the velocity-space density moment of the electron distribution
    evaluated at the pedestal-top location:


    $$

    n_{e,\mathrm{ped}} = n_e(\rho_{\mathrm{ped}}) = \int f_e(\mathbf{x}_{\mathrm{ped}},
    \mathbf{v})\, d^3v

    $$


    where $n_e(\rho)$ is electron density as a function of radial flux-surface label
    $\rho$ in a flux-coordinate system $(\rho,\theta,\phi)$, with $\rho$ labeling
    flux surfaces, $\theta$ the poloidal angle, and $\phi$ the toroidal angle. Here
    $\rho_{\mathrm{ped}}$ is the pedestal-top location, $\mathbf{x}_{\mathrm{ped}}$
    is a position on that flux surface, $f_e$ is the electron phase-space distribution
    with SI units $\mathrm{m^{-6}\,s^3}$, and $d^3v$ is a velocity-space volume element
    with units $\mathrm{m^3\,s^{-3}}$, giving $n_{e,\mathrm{ped}}$ in $\mathrm{m^{-3}}$.


    In practice, this value is inferred from high-resolution edge density measurements
    such as Thomson scattering, interferometry, reflectometry, or beam-emission methods,
    combined with equilibrium mapping to a radial flux label. The pedestal-top location
    is commonly identified by fitting the radial density variation with a modified
    hyperbolic tangent or piecewise linear form, or by locating where the [gradient
    of electron density] changes from the large edge-pedestal value to the smaller
    core value. Together with [electron temperature at the pedestal top](name:electron_temperature_at_pedestal_top),
    this quantity determines [electron pressure at the pedestal top]; when $T_e$ is
    expressed in eV, the pressure relation is $p_{e,\mathrm{ped}} = e\,n_{e,\mathrm{ped}}T_{e,\mathrm{ped}}$,
    where $e$ is the elementary charge, while $n_e k_B T_e$ applies only when $T_e$
    is in kelvin.


    Typical pedestal-top electron densities in H-mode tokamaks are $1 \times 10^{19}$-$1
    \times 10^{20}\ \mathrm{m^{-3}}$; low-density or small devices can be below this
    range, while high-performance or reactor-relevant plasmas can approach $2 \times
    10^{20}\ \mathrm{m^{-3}}$. The value influences edge collisionality, bootstrap
    current, impurity screening, and peeling-ballooning stability, and generally increases
    with fueling and confinement quality.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density
  - name:electron_temperature_at_pedestal_top
  arguments:
  - name: density_at_pedestal
    operator: electron
    operator_kind: qualifier
- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal
  kind: scalar
  status: draft
  description: Local derivative of electron number density with respect to the normalized
    poloidal flux coordinate, evaluated at the H-mode pedestal location in the steep
    edge transport barrier.
  documentation: "The derivative $dn_e/d\\psi_N$ at the pedestal quantifies the radial\
    \ steepness of the electron density profile across the H-mode transport barrier,\
    \ where $\\psi_N$ is the normalized poloidal flux coordinate increasing from 0\
    \ at the magnetic axis to 1 at the plasma boundary.\n\nThe quantity is defined\
    \ as:\n\n$$\n\\left.\\frac{dn_e}{d\\psi_N}\\right|_{\\text{pedestal}}\n$$\n\n\
    where $n_e$ is the electron number density and $\\psi_N = (\\psi - \\psi_0)/(\\\
    psi_b - \\psi_0)$, with $\\psi_0$ denoting the poloidal magnetic flux at the magnetic\
    \ axis and $\\psi_b$ its value at the plasma boundary.\n\nThis derivative is extracted\
    \ from profile fits \u2014 modified hyperbolic tangent (mtanh) or piecewise-linear\
    \ models \u2014 applied to Thomson scattering or reflectometry measurements parameterized\
    \ as a function of $\\psi_N$. For the maximum gradient over the full pedestal\
    \ region rather than a single reference point, see [the pedestal-region maximum\
    \ gradient](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal).\
    \ The analogous derivative for electron pressure is given by [derivative of electron\
    \ pressure at pedestal](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal).\n\
    \nTypical magnitudes in H-mode pedestals range from $10^{19}$ to $10^{21}$ m$^{-3}$\
    \ per unit $\\psi_N$, with steeper gradients associated with higher pedestal pressures\
    \ and stronger edge transport barriers.\n\nSign convention: Positive when electron\
    \ density increases with increasing $\\psi_N$ (in the radially outward direction\
    \ toward the plasma boundary); in standard H-mode operation the derivative is\
    \ negative as density decreases across the pedestal from the confinement interior\
    \ toward the separatrix."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal
