- name: vertical_coordinate_of_flux_loop
  kind: scalar
  status: active
  description: "Signed vertical position of the flux-loop reference point in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, measured relative to the machine midplane."
  documentation: 'The vertical coordinate of a flux loop is the height of its reference
    point along the machine symmetry axis in the right-handed cylindrical $(R, \phi,
    Z)$ frame. It locates the loop geometrically and does not describe its enclosed
    area, orientation, or induced voltage.


    $$

    Z_{\mathrm{loop}} = \mathbf{r}_{\mathrm{loop}} \cdot \hat{Z}

    $$


    where $Z_{\mathrm{loop}}$ is the vertical coordinate, $\mathbf{r}_{\mathrm{loop}}$
    is the position vector of the flux-loop reference point relative to the coordinate
    origin, and $\hat{Z}$ is the upward vertical unit vector. The corresponding radial
    location is given by the [radial coordinate of the flux loop](name:radial_coordinate_of_flux_loop).


    Sign convention: Positive when the flux-loop reference point lies in the $+Z$
    direction, above the machine midplane.'
  unit: m
  physics_domain: magnetic_field_diagnostics
