name: normalized_poloidal_magnetic_flux_of_minimum_safety_factor
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal magnetic flux $\psi_N$ at the radial location where
  the safety factor $q$ reaches its minimum value.
documentation: "The normalized poloidal flux $\\psi_N = (\\psi - \\psi_{\\rm axis})\
  \ / (\\psi_{\\rm edge} - \\psi_{\\rm axis})$ at which $q(\\psi)$ attains its global\
  \ minimum, $q_{\\min}$. In monotonic $q$-profiles (conventional scenarios), $q_{\\\
  min}$ occurs on axis ($\\psi_N = 0$) and equals $q_0$. In advanced tokamak or reversed-shear\
  \ scenarios with an internal transport barrier, the $q$-profile develops a local\
  \ minimum at an off-axis location (typically $\\psi_N \\approx 0.3$\u2013$0.6$),\
  \ and this position marks the foot of the reversed-shear region where magnetic shear\
  \ $s = (\\rho/q)(dq/d\\rho) = 0$. Knowledge of this location is essential for predicting\
  \ the onset of double-tearing modes and internal kink instabilities. The value is\
  \ extracted from equilibrium reconstruction, often constrained by motional Stark\
  \ effect (MSE) polarimetry. See `safety_factor` for the full radial profile, `magnetic_shear`\
  \ for the derivative quantity, and `normalized_toroidal_flux_coordinate_of_minimum_safety_factor`\
  \ for the equivalent position in $\\rho_{\\rm tor,N}$ coordinates."
