name: perpendicular_component_of_fast_ion_pressure
description: Pressure of the supra-thermal (fast) ion population in the direction
  perpendicular to the magnetic field.
documentation: "The perpendicular fast-ion pressure is defined as $p_{\\perp,\\rm\
  \ fast} = \\int \\frac{1}{2} m_i v_\\perp^2 f_{\\rm fast}(\\mathbf{v})\\, d^3v$,\
  \ where $m_i$ is the ion mass, $v_\\perp$ is the velocity component perpendicular\
  \ to the local magnetic field $\\mathbf{B}$, and $f_{\\rm fast}$ is the supra-thermal\
  \ part of the ion distribution function. Fast-ion distributions are typically anisotropic:\
  \ tangential NBI produces $p_{\\parallel} > p_{\\perp}$, while ICRH-accelerated\
  \ minority tails yield $p_{\\perp} > p_{\\parallel}$. The pressure anisotropy $\\\
  Delta p = p_{\\perp} - p_{\\parallel}$ enters the modified MHD equilibrium through\
  \ the anisotropic force balance and can destabilize fishbone and internal kink modes.\
  \ In large tokamaks with strong NBI or ICRH, $p_{\\perp,\\rm fast}$ can reach $5$\u2013\
  $50\\;\\mathrm{kPa}$ in the core, representing a significant fraction of the total\
  \ plasma $\\beta$. Computed by orbit-following codes (NUBEAM, ASCOT, HAGIS) and\
  \ constrained experimentally by FIDA spectroscopy and neutron diagnostics. See also\
  \ the parallel counterpart and the total fast-ion pressure."
kind: vector_component
unit: Pa
