      unit: W
    enhanced_context:
      description: Reflected RF power from a lower hybrid (LH) antenna, representing
        the fraction of forward power not coupled into the plasma. High reflected
        power indicates poor coupling efficiency and is monitored for antenna coupling
        optimisation.
      kind: llm
- name: resistance_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Resistance of an ion-cyclotron heating antenna is the real part of
    the effective radio-frequency loading impedance at the antenna feed reference
    plane. It represents the resistive component associated with power coupled to
    the plasma and dissipative antenna losses.
  documentation: 'Resistance of an ion-cyclotron heating antenna is the real part
    of the effective radio-frequency loading impedance presented by the antenna at
    its feed reference plane. It characterizes the component of the antenna load that
    absorbs radio-frequency power, including plasma loading and intrinsic dissipative
    losses, distinct from the reactive energy storage represented by antenna capacitance
    or inductance.


    The antenna loading impedance is decomposed into resistive and reactive parts
    as:


    $$

    Z_\mathrm{ant} = R_\mathrm{ant} + i X_\mathrm{ant}

    $$


    where $Z_\mathrm{ant}$ is the complex antenna loading impedance, $R_\mathrm{ant}$
    is the antenna resistance in ohms, $X_\mathrm{ant}$ is the antenna reactance in
    ohms, and $i^2=-1$.


    For a sinusoidal strap current, the resistive power associated with this load
    is $P_\mathrm{res}=R_\mathrm{ant} I_\mathrm{rms}^2$, where $P_\mathrm{res}$ is
    in watts and $I_\mathrm{rms}$ is the [root-mean-square wave current of the antenna
    strap](name:root_mean_square_of_wave_current_of_antenna_strap) in amperes. This
    quantity is a feed-plane impedance component and is not itself a forward, reflected,
    or net power; those powers describe traveling-wave energy flow in the connected
    radio-frequency circuit.'
  unit: ohm
  physics_domain: auxiliary_heating
