- name: radial_neutral_velocity
  kind: scalar
  status: draft
  description: Radial component of the charge-state-averaged bulk fluid velocity of
    neutral particles, describing net radial transport due to pressure gradients and
    collisional processes.
  documentation: "This quantity represents the mass-weighted mean flow velocity of\
    \ neutral particles projected onto the radial ($R$) direction in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame.  It captures the net radial motion of the\
    \ neutral ensemble, arising from charge-exchange momentum exchange with the ion\
    \ population, pressure gradients, and thermal diffusion, averaged over all charge\
    \ states.  The radial neutral velocity is a key input for edge and scrape-off\
    \ layer transport modeling, where neutrals from recycling and fueling sources\
    \ penetrate the confined plasma and carry momentum.  It is typically inferred\
    \ from fluid or kinetic neutral transport codes (e.g., EIRENE, UEDGE) or from\
    \ spectroscopic measurements of neutral line emission.  Typical values range from\
    \ $10^2$\u2013$10^4$ m/s in the edge and SOL, increasing toward the separatrix\
    \ as neutrals are accelerated by charge-exchange collisions with the ion population.\n\
    \nSign convention: Positive when the neutral velocity points in the direction\
    \ of increasing major radius $R$.\n\nThis scalar component is derived from the\
    \ full velocity vector [neutral_velocity](name:neutral_velocity)."
  unit: m.s^-1
  physics_domain: transport
