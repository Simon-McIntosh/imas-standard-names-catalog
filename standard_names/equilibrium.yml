- name: vertical_coordinate_of_secondary_strike_point
  kind: scalar
  status: draft
  description: Height of the secondary divertor strike point relative to the device
    midplane, locating where the secondary separatrix intersects a divertor target.
  documentation: 'The vertical coordinate of the secondary strike point gives the
    height of the intersection between the secondary separatrix and a divertor target.
    Together with [major radius of secondary strike point](name:major_radius_of_secondary_strike_point),
    it specifies the strike-point position in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. The non-secondary counterpart [vertical coordinate of strike point](name:vertical_coordinate_of_strike_point)
    describes the corresponding strike point on the primary separatrix.


    For a strike-point position vector $\mathbf{x}_{\rm sp,2}$, the coordinate is
    the projection onto the vertical basis direction:


    $$

    Z_{\rm sp,2} = \mathbf{x}_{\rm sp,2} \cdot \hat{Z}

    $$


    where $Z_{\rm sp,2}$ is the secondary strike-point height and $\hat{Z}$ is the
    vertical unit vector of the cylindrical frame.


    The value is computed from magnetic-equilibrium reconstruction by tracing the
    secondary separatrix until it intersects the divertor target contour. External
    magnetic measurements, flux loops, and plasma-boundary constraints determine the
    reconstructed separatrix geometry; [vertical coordinate of secondary plasma boundary]
    provides the related boundary-height information.


    Representative values range from about -4 to 4 m in large tokamaks, with lower-divertor
    strike points commonly below the midplane and upper-divertor strike points above
    it.


    Sign convention: Positive when the strike-point position lies in the +Z direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_secondary_strike_point
  - name:vertical_coordinate_of_strike_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/strike_point/z
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/strike_point/z
    status: composed
- name: vertical_coordinate_of_secondary_x_point
  kind: scalar
  status: draft
  description: Vertical height of the secondary magnetic separatrix null point relative
    to the device midplane in the right-handed cylindrical (R, phi, Z) geometry.
  documentation: 'The secondary X-point is the magnetic null associated with a secondary
    separatrix, where the poloidal magnetic field vanishes and the boundary topology
    changes. Its vertical coordinate locates that null in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It complements the radial location given by [major radius
    of secondary X-point](name:major_radius_of_secondary_x_point) and can be compared
    with the primary [vertical coordinate of X-point](name:vertical_coordinate_of_x_point).


    For the secondary X-point position vector $\mathbf{r}_{X2}$, the coordinate is
    the projection onto the vertical basis direction:


    $$

    Z_{X2} = \mathbf{r}_{X2} \cdot \hat{Z}

    $$


    where $Z_{X2}$ is the secondary X-point vertical coordinate, $\mathbf{r}_{X2}$
    is measured from the device coordinate origin, and $\hat{Z}$ is the vertical unit
    vector.


    The value is computed in equilibrium reconstruction by finding the saddle point
    of the poloidal magnetic flux, equivalently the point where the local poloidal
    field components vanish. Magnetic probe and flux-loop constraints, supplemented
    by divertor imaging or strike-point observations, help determine the separatrix
    geometry including the linked [vertical coordinate of the secondary strike point](name:vertical_coordinate_of_secondary_strike_point)
    and [vertical coordinate of the secondary plasma boundary]. Typical values span
    about -2 to 2 m in present tokamaks, with lower-null configurations negative and
    upper-null configurations positive relative to the midplane.


    Sign convention: Positive when the secondary X-point lies in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame relative to the device midplane.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_secondary_x_point
  - name:vertical_coordinate_of_x_point
  - name:vertical_coordinate_of_secondary_strike_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_secondary_separatrix/x_point/z
    dd_path: equilibrium/time_slice/boundary_secondary_separatrix/x_point/z
    status: composed
- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: draft
  description: Height of the divertor contact point where the separatrix intersects
    a material target, measured along the device vertical axis.
  documentation: 'The strike-point vertical coordinate gives the height of the point
    where a separatrix field line intersects a divertor target or other plasma-facing
    surface. Together with the horizontal location given by [major_radius_of_strike_point](name:major_radius_of_strike_point),
    it fixes the strike-point position in the poloidal cross-section and is used to
    assess divertor heat-load placement and plasma-shape control.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius,
    $\phi$ the toroidal angle, and $Z$ the vertical height, the coordinate is the
    projection of the strike-point position vector onto the vertical basis direction:


    $$

    Z_{\mathrm{sp}} = \mathbf{x}_{\mathrm{sp}} \cdot \hat{Z}

    $$


    where $\mathbf{x}_{\mathrm{sp}}$ is the position vector of the strike point and
    $\hat{Z}$ is the vertical unit vector.


    The value is obtained from magnetic-equilibrium reconstruction by locating the
    separatrix and finding its intersection with the modeled divertor target surface;
    it may also be constrained by magnetic diagnostics, divertor imaging, and heat-flux
    measurements. If multiple separatrix intersections exist, this name denotes the
    generic strike point, while [vertical_coordinate_of_secondary_strike_point](name:vertical_coordinate_of_secondary_strike_point)
    distinguishes a secondary one.


    Typical values span about -2 to 2 m in medium and large tokamaks, with lower-divertor
    strike points below the midplane and upper-divertor strike points above it. Related
    boundary geometry is described by [vertical_coordinate_of_plasma_boundary](name:vertical_coordinate_of_plasma_boundary)
    and controlled relative to reference locations such as [vertical_coordinate_of_plasma_boundary_gap_reference_point](name:vertical_coordinate_of_plasma_boundary_gap_reference_point).


    Sign convention: Positive when the strike-point position lies in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_strike_point
  - name:vertical_coordinate_of_secondary_strike_point
  - name:vertical_coordinate_of_plasma_boundary
  - name:vertical_coordinate_of_plasma_boundary_gap_reference_point
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/strike_point/z
    dd_path: equilibrium/time_slice/boundary_separatrix/strike_point/z
    status: composed
- name: vertical_coordinate_of_x_point
  kind: scalar
  status: draft
  description: Vertical height of the magnetic X-point in the right-handed cylindrical
    (R, phi, Z) frame used to locate the diverted separatrix.
  documentation: 'The vertical coordinate of the X-point gives the $Z$ position of
    the magnetic saddle point where separatrix branches meet in a diverted equilibrium.
    In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. This coordinate fixes the up-down
    placement of the divertor null and is interpreted together with strike-point locations
    such as the [divertor strike-point vertical coordinate](name:vertical_coordinate_of_strike_point)
    and [divertor strike-point major radius](name:major_radius_of_strike_point).


    For an axisymmetric equilibrium, the X-point is identified as a saddle point of
    the poloidal magnetic flux $\psi(R,Z)$:


    $$

    \nabla_{R,Z}\psi(R_X,Z_X)=0

    $$


    where $R_X$ and $Z_X$ are the major-radius and vertical coordinates of the X-point,
    and $\nabla_{R,Z}$ is the gradient in the poloidal plane. The reported quantity
    is $Z_X$.


    It is obtained from equilibrium reconstruction using magnetic probes, flux loops,
    boundary constraints, and, where available, internal profile or polarimetric information.
    The value is also used in plasma shape control because shifts of the X-point modify
    connection lengths and the mapping to the divertor target, complementing global
    geometry markers such as the [geometric-axis vertical coordinate](name:vertical_coordinate_of_geometric_axis)
    and [magnetic-axis major radius](name:major_radius_of_magnetic_axis).


    Representative diverted tokamak equilibria place the X-point from about -2 to
    2 m relative to the machine midplane in medium-size devices, while large devices
    or strongly elongated configurations can reach several meters of vertical displacement.
    Lower single-null plasmas have negative values when the null is below the midplane,
    and upper single-null plasmas have positive values when the null is above it.


    Sign convention: Positive when the X-point lies in the $+Z$ direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_strike_point
  - name:major_radius_of_strike_point
  - name:vertical_coordinate_of_geometric_axis
  - name:major_radius_of_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/x_point/z
    dd_path: equilibrium/time_slice/boundary_separatrix/x_point/z
    status: composed
- name: vertical_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic-field vector onto the vertical Z direction
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical magnetic field is the component of the local [magnetic
    field](name:magnetic_field) along the vertical coordinate of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. Together with the [radial magnetic field](name:radial_magnetic_field),
    it forms the poloidal-plane field whose magnitude is represented by the [poloidal
    magnetic field](name:poloidal_magnetic_field).


    The component is defined by projection onto the vertical basis direction:


    $$

    B_Z(R,\phi,Z) = \mathbf{B}(R,\phi,Z) \cdot \hat{Z}

    $$


    where $B_Z$ is the vertical component, $\mathbf{B}$ is the magnetic-field vector,
    and $\hat{Z}$ is the upward vertical unit vector. In axisymmetric equilibrium,
    this component is closely related to the radial gradient of the [poloidal magnetic
    flux](name:poloidal_magnetic_flux).


    It is computed in equilibrium reconstruction from magnetic measurements, force-balance
    constraints, and flux-surface geometry; local values may also be constrained by
    magnetic probes, polarimetry, or motional-Stark-effect information. Representative
    absolute values range from 0.01-1 T in the confined plasma region, with larger
    values near shaping coils or close to the plasma boundary in strongly shaped discharges.


    Sign convention: Positive when the magnetic-field vector points toward increasing
    vertical coordinate $Z$ along $+\hat{Z}$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:radial_magnetic_field
  - name:poloidal_magnetic_field
  - name:poloidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/profiles_2d/b_field_z
    dd_path: equilibrium/time_slice/profiles_2d/b_field_z
    status: composed
- name: volume_of_flux_surface
  kind: scalar
  status: draft
  description: Volume enclosed by a nested equilibrium magnetic flux surface, used
    as a radial geometric measure for flux-surface averages and integrated plasma
    quantities.
  documentation: 'The volume of a flux surface is the geometric measure of the plasma
    region bounded by a chosen closed magnetic-flux surface. It provides the radial
    volume coordinate used to convert flux-surface-local quantities into shell or
    total integrals, and it reduces to [volume of the plasma boundary](name:volume_of_plasma_boundary)
    at the last closed flux surface.


    For an axisymmetric equilibrium, the enclosed volume for a surface labeled by
    $\psi_s$ is


    $$

    V(\psi_s) = \int_{\Omega(\psi_s)} d^3x = \int_{\Omega(\psi_s)} R\,dR\,d\phi\,dZ

    $$


    where $\Omega(\psi_s)$ is the spatial region inside the flux surface, and $(R,\phi,Z)$
    is the right-handed cylindrical coordinate system with $R$ the major radius, $\phi$
    the toroidal angle, and $Z$ the vertical height.


    This quantity is computed from magnetic-equilibrium reconstruction by integrating
    the volume element over the region bounded by the reconstructed flux contour.
    Its radial derivative gives the volume of a thin flux shell and is closely related
    to the [surface area of a flux surface](name:surface_area_of_flux_surface), which
    enters flux-surface averaging and transport-volume factors.


    Typical enclosed volumes range from about 0.01-1 m^3 in compact experiments, 10-100
    m^3 in medium-size tokamaks, and several hundred to over 1000 m^3 in reactor-scale
    plasmas; at the outermost closed surface it is comparable to the [plasma volume](name:volume_of_plasma_boundary).


    Sign convention: Positive when the ordinary unsigned geometric volume is assigned
    to the region enclosed by the flux surface.'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:volume_of_plasma_boundary
  - name:surface_area_of_flux_surface
  - name:volume_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/volume
    dd_path: equilibrium/time_slice/profiles_1d/volume
    status: composed
- name: volume_of_plasma_boundary
  kind: scalar
  status: draft
  description: Space enclosed by the last closed flux surface or separatrix, giving
    the geometric size of the confined plasma region.
  documentation: 'The volume of the plasma boundary is the region enclosed by the
    last closed flux surface, or by the separatrix in diverted equilibria. It is the
    boundary-explicit form of [plasma volume](name:volume_of_plasma_boundary) and
    complements the meridional [area of the plasma boundary](name:area_of_plasma_boundary)
    and the enclosing [surface area of the plasma boundary](name:surface_area_of_plasma_boundary).


    For an axisymmetric equilibrium, the volume can be written as the toroidal sweep
    of the poloidal cross-sectional area:


    $$

    V = 2\pi \int_{A_p} R\, dA

    $$


    where $V$ is the enclosed volume, $A_p$ is the poloidal cross-section inside the
    plasma boundary, $R$ is the major radius in the right-handed cylindrical $(R,
    \phi, Z)$ frame, and $dA$ is an area element in the $(R, Z)$ plane.


    This quantity is computed from equilibrium reconstruction after identifying the
    outermost closed flux contour or separatrix, using magnetic measurements and,
    where available, kinetic or polarimetric constraints. It is also related to the
    enclosed [volume of a flux surface](name:volume_of_flux_surface), evaluated at
    the boundary rather than at an interior flux surface.


    Representative values range from about 10-100 m^3 in medium-size tokamaks and
    several hundred to more than 1000 m^3 in reactor-scale devices, depending mainly
    on major radius, [minor radius of the plasma boundary](name:minor_radius_of_plasma_boundary),
    and shaping.'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:volume_of_plasma_boundary
  - name:area_of_plasma_boundary
  - name:surface_area_of_plasma_boundary
  - name:volume_of_flux_surface
  - name:minor_radius_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/volume
    dd_path: equilibrium/time_slice/global_quantities/volume
    status: composed
