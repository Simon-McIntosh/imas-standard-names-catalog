- name: angle_of_antenna_strap
  kind: scalar
  status: active
  description: "Second inclination angle (\u03B2) of the oblique trapezoidal cross-section\
    \ of an ICRH antenna strap, giving the signed tilt of the beta-side lateral face\
    \ relative to the directed strap base edge."
  documentation: "The oblique trapezoidal cross-section of an ICRH antenna strap is\
    \ geometrically characterized by two lateral-face inclination angles, alpha (\u03B1\
    ) and beta (\u03B2). The beta angle is the signed inclination of the beta-side\
    \ lateral face relative to the directed base edge of the trapezoid, complementing\
    \ [alpha_angle_of_antenna_strap](name:alpha_angle_of_antenna_strap), which describes\
    \ the inclination of the opposite lateral face.\n\nTogether with shape parameters\
    \ such as length_of_antenna_strap and [height_of_antenna_strap](name:height_of_antenna_strap),\
    \ the pair of inclination angles (\u03B1, \u03B2) fully specifies the oblique\
    \ trapezoidal cross-sectional geometry used to model the conducting strap element\
    \ in RF antenna simulations. This angle is a fixed mechanical design parameter\
    \ derived from engineering drawings and does not vary with plasma conditions.\n\
    \nThe analogous second-inclination angle for passive structures is [angle_of_passive_loop](name:tilt_angle_of_passive_loop),\
    \ which encodes the \u03B2 angle of the passive loop cross-section in the same\
    \ geometric convention."
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:alpha_angle_of_antenna_strap
  - name:height_of_antenna_strap
  - name:tilt_angle_of_passive_loop
  sources:
  - dd_path: ic_antennas/antenna/module/strap/geometry/oblique/beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-geometry-oblique-beta
    dd_documentation:
      leaf: Inclination of second angle TBD
      parent_path: ic_antennas/antenna/module/strap/geometry/oblique
      parent: Trapezoidal description of the element
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "Second inclination angle (beta, \u03B2) of the oblique trapezoidal\
        \ cross-section of an ICRH antenna strap. Defines part of the strap geometry\
        \ for use in wave coupling and antenna modelling."
      kind: llm
- name: alpha_angle_of_antenna_strap
  kind: scalar
  status: active
  description: Signed inclination of the alpha-side lateral face of an oblique trapezoidal
    ICRH antenna-strap cross-section relative to the directed strap base edge.
  documentation: 'The alpha angle is the oriented inclination of the alpha-side lateral
    face of an oblique trapezoidal ICRH antenna-strap cross-section, measured from
    the directed strap base edge. It specifies the alpha-side geometry complementary
    to the beta-side quantity represented by [angle of antenna strap](name:angle_of_antenna_strap).


    $$

    \alpha = \operatorname{atan2}\!\left(\hat{n}\cdot(\hat{b}\times\hat{a}),\,\hat{b}\cdot\hat{a}\right)

    $$


    where $\hat{b}$ is the unit vector along the directed strap base edge, $\hat{a}$
    is the unit vector along the alpha-side lateral face, and $\hat{n}$ is the positive
    normal to the oriented cross-sectional plane. The angle is restricted to the alpha-side
    face and is distinct from the beta-side inclination.


    Sign convention: Positive when rotation from the directed strap base edge toward
    the alpha-side lateral face follows the positive normal of the oriented strap
    cross-section.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:angle_of_antenna_strap
  arguments:
  - name: angle_of_antenna_strap
    operator: alpha
    operator_kind: qualifier
  sources:
  - dd_path: ic_antennas/antenna/module/strap/geometry/oblique/alpha
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-geometry-oblique-alpha
    dd_documentation:
      leaf: Inclination of first angle TBD
      parent_path: ic_antennas/antenna/module/strap/geometry/oblique
      parent: Trapezoidal description of the element
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "First inclination angle (alpha, \u03B1) of the oblique trapezoidal\
        \ cross-sectional geometry of an ICRH antenna strap. Part of the geometric\
        \ description used in antenna modelling and wave coupling calculations."
      kind: llm
- name: angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: Signed rotation angle of an electron-cyclotron launcher mirror about
    its mechanical steering axis, measured from the launcher reference orientation
    and controlling the EC microwave beam injection direction.
  documentation: 'The mirror angle quantifies the angular position of the steering
    mirror on an electron-cyclotron launcher, which redirects the millimeter-wave
    beam along the desired injection path into the plasma. By adjusting this angle,
    the beam can be directed at different magnetic flux surfaces, enabling localized
    electron heating or non-inductive current drive at a chosen plasma radius.


    The accessible angular range is bounded by the mechanical travel limits of the
    actuator system: the lower bound is given by minimum_angle_of_electron_cyclotron_launcher_mirror
    and the upper bound by [maximum_angle_of_electron_cyclotron_launcher_mirror](name:maximum_angle_of_electron_cyclotron_launcher_mirror),
    together defining the full range of injection directions available for the microwave
    beam. The resulting beam orientation after the mirror reflection is further characterized
    by angle_of_electron_cyclotron_beam, which describes the beam direction in the
    plane transverse to propagation.


    Mirror positioning is achieved through motorized actuators with angular position
    encoders; real-time feedback enables precise beam aiming during plasma operation.
    The spatial location of the mirror center is complemented by [radial_centroid_of_electron_cyclotron_launcher_mirror](name:radial_centroid_of_electron_cyclotron_launcher_mirror)
    and [vertical_coordinate_of_electron_cyclotron_launcher_mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror),
    which together define the mirror center position in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:maximum_angle_of_electron_cyclotron_launcher_mirror
  - name:radial_centroid_of_electron_cyclotron_launcher_mirror
  - name:vertical_coordinate_of_electron_cyclotron_launcher_mirror
- name: area_of_neutral_beam_injector
  kind: scalar
  status: active
  description: Area of a neutral beam injector is the source cross-section of the
    active ion-source emission face that forms the extracted beam before neutralization.
    For a multi-aperture source, it is the sum of the contributing aperture areas.
  documentation: 'Area of a neutral beam injector is the source cross-section of the
    active ion-source emission face that forms the extracted beam before neutralization.
    It represents the open or emitting part of the ion-extraction face through which
    extracted ions enter the beamline; for a multi-aperture source it aggregates only
    apertures that contribute to the extracted beam.


    The area is defined as the projected geometric area of the active emitting or
    open aperture set onto the plane normal to the nominal extracted-beam direction:


    $$

    A_\mathrm{NBI} = \int_{S_\mathrm{open}} \left|\hat{\mathbf{b}} \cdot \hat{\mathbf{n}}(\mathbf{r})\right|
    \, dS

    $$


    where $S_\mathrm{open}$ is the active open or emitting aperture surface on the
    ion-source extraction face, $\hat{\mathbf{b}}$ is the unit vector along the nominal
    extracted-beam direction, $\hat{\mathbf{n}}(\mathbf{r})$ is the local unit normal
    of that aperture surface, and $dS$ is the surface-area element.


    This quantity is the geometric source area used to normalize extracted beam current
    density to total extracted current, as in $I_\mathrm{ext}=\langle j_\mathrm{ext}\rangle
    A_\mathrm{NBI}$ for area-averaged extracted current density $\langle j_\mathrm{ext}\rangle$
    and extracted current $I_\mathrm{ext}$. It is not a downstream neutral-beam cross-section,
    propagated beam footprint, or an area of a neutralizer, duct, collimator, or target.
    The related [beam area of neutral beam injector](name:beam_area_of_neutral_beam_injector)
    denotes the same active beam-forming source cross-section from the beam side of
    the source, while aperture dimensions such as [neutral-beam aperture width](name:neutral_beam_width_of_aperture)
    specify component geometry rather than the aggregate active area.'
  unit: m^2
  physics_domain: auxiliary_heating
  links:
  - name:beam_area_of_neutral_beam_injector
  sources:
  - dd_path: nbi/unit/source/surface
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/nbi.html#nbi-unit-source-surface
    dd_documentation:
      leaf: Surface of the detector/aperture, derived from the above geometric data
      parent_path: nbi/unit/source
      parent: Description of the surface of the ion source from which the beam is
        extracted
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Surface specification of source.
      kind: template
- name: beam_area_of_neutral_beam_injector
  kind: scalar
  status: active
  description: Geometric area of the ion-source emission surface from which a neutral
    beam injector extracts ions before downstream neutralization.
  documentation: 'This quantity is the geometric area of the ion-source emission surface
    that contributes to formation of the extracted neutral beam. It refers specifically
    to the source surface, not to downstream neutralization, transport, or beam-interception
    surfaces.


    The area is defined by the surface integral


    $$

    A_{\mathrm{source}} = \int_{S_{\mathrm{open}}} dS

    $$


    where $A_{\mathrm{source}}$ is the source-surface area and $dS$ is an infinitesimal
    surface element on the open emitting region $S_{\mathrm{open}}$.


    For a multi-aperture source, the area is the sum of the open emitting aperture
    areas. It is the source-surface component of the geometric quantity [area of a
    neutral beam injector](name:area_of_neutral_beam_injector), whose definition uses
    the same pre-neutralization emission surface.'
  unit: m^2
  physics_domain: auxiliary_heating
  links:
  - name:area_of_neutral_beam_injector
  arguments:
  - name: area_of_neutral_beam_injector
    operator: beam
    operator_kind: qualifier
  sources:
