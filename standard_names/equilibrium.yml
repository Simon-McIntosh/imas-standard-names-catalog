- name: vertical_coordinate_of_closest_wall_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the point on the first wall that lies closest
    to the plasma boundary.
  documentation: 'The vertical coordinate $Z_{\mathrm{wall,min}}$ of the first-wall
    point nearest to the plasma boundary defines the closest approach of the wall
    in the poloidal plane. This geometric quantity is used to assess plasma-wall clearance,
    evaluate heat-flux deposition patterns, and constrain halo-current paths during
    disruptions. The coordinate is measured in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $Z$ increases vertically upward.


    Sign convention: Positive when the closest wall point lies above the midplane
    ($Z=0$).


