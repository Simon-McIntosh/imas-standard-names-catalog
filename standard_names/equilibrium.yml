- name: inner_major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Major radius of the high-field-side intersection of a nested magnetic
    flux surface with the equatorial plane in the right-handed cylindrical (R, phi,
    Z) frame. It is the smaller midplane radius of the surface, which together with
    the outer major radius defines the surface's horizontal width and geometric center.
  documentation: 'The inner major radius of a flux surface is the smaller-$R$ intersection
    of that surface with the midplane in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius measured from the toroidal symmetry axis and
    $Z$ is vertical height. It is the high-field-side equatorial radius of the surface;
    as the surface shrinks toward the innermost flux surface it approaches the [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis).
    Each surface is identified by a monotonic flux-surface label such as normalized
    poloidal flux $\psi_N$ or normalized toroidal flux radius $\rho_\mathrm{tor,norm}$.


    For an axisymmetric equilibrium, the closed flux-surface contour $\mathcal{C}_\lambda$
    labeled by a radial coordinate $\lambda$ lies in the poloidal plane, and the inner
    major radius is the minimum $R$ at the magnetic-axis height:


    $$

    R_\mathrm{in}(\lambda) = \min\left\{R : (R, Z_\mathrm{axis}) \in \mathcal{C}_\lambda\right\}

    $$


    where $Z_\mathrm{axis}$ is the vertical coordinate of the magnetic axis. Axisymmetry
    ensures the surface''s two midplane crossings lie on the horizontal line $Z =
    Z_\mathrm{axis}$; in strongly up-down asymmetric equilibria the relevant midplane
    height may differ from the axis height. Together with the [outer_major_radius_of_flux_surface](name:outer_major_radius_of_flux_surface),
    it gives the midplane geometric center $R_\mathrm{geo} = (R_\mathrm{out} + R_\mathrm{in})/2$
    and the midplane half-width $a_\mathrm{mid} = (R_\mathrm{out} - R_\mathrm{in})/2$;
    the radial variation of $R_\mathrm{geo}$ across surfaces is a common measure of
    the Shafranov shift. The [flux_surface_averaged_major_radius](name:flux_surface_averaged_major_radius)
    is a surface-average quantity and need not equal this midplane geometric center
    when shaping and toroidal weighting are significant.


    In equilibrium reconstruction, $R_\mathrm{in}$ is obtained by tracing a closed
    constant-flux contour and interpolating its intersection with the horizontal line
    through the magnetic axis. At the last closed flux surface it corresponds to the
    inboard midplane boundary radius, but the definition applies to any nested closed
    magnetic surface.


    Values are largest near the magnetic axis, where they approach the magnetic-axis
    major radius, and decrease monotonically toward the inboard plasma boundary as
    surfaces expand outward. The overall magnitude scales with the major radius of
    the device, ranging from well below a meter in compact machines to several meters
    in large tokamaks.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_major_radius_of_flux_surface
  - name:flux_surface_averaged_major_radius
  arguments:
  - name: major_radius_of_flux_surface
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/r_inboard
    dd_path: equilibrium/time_slice/profiles_1d/r_inboard
    status: composed
- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate of the plasma geometric axis in the right-handed
    cylindrical (R, phi, Z) frame, where R is measured in meters from the toroidal
    symmetry axis. It is the radial midpoint of the plasma boundary contour, equal
    to the arithmetic mean of the outermost and innermost boundary major radii.
  documentation: 'The major radius of the geometric axis is the $R$ coordinate of
    the radial midpoint of a plasma boundary or flux-surface contour in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It describes the horizontal geometric center
    of the cross-section and is distinct from the [major radius of the magnetic axis](name:major_radius_of_magnetic_axis),
    which is set by the extremum of poloidal magnetic flux.


    The geometric-axis major radius is defined from the innermost and outermost major
    radii of the same contour:


    $$

    R_\mathrm{geom} = \frac{R_\mathrm{max} + R_\mathrm{min}}{2}

    $$


    where $R_\mathrm{max}$ and $R_\mathrm{min}$ are the maximum and minimum $R$ coordinates
    of the contour. The related radial half-width is the [minor radius of the plasma
    boundary](name:minor_radius_of_plasma_boundary), $a = (R_\mathrm{max}-R_\mathrm{min})/2$,
    while $R_\mathrm{max}$ itself is a limiting value of the [major radius of the
    plasma boundary](name:major_radius_of_plasma_boundary).


    In practice this quantity is obtained from an equilibrium boundary or from nested
    flux-surface geometry by locating the outermost and innermost intersections in
    $R$ and averaging them. In tokamak equilibria the magnetic axis is often displaced
    toward larger $R$ relative to this geometric midpoint by finite-pressure and current-profile
    effects, so the two axes should not be used interchangeably.


    Typical values scale with device size: about 1-4 m in many present-day tokamaks
    and about 5-7 m in large reactor-scale devices.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/boundary/geometric_axis/r
    dd_path: equilibrium/time_slice/boundary/geometric_axis/r
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/geometric_axis/r
    dd_path: equilibrium/time_slice/boundary_separatrix/geometric_axis/r
    status: attached
  - id: dd:equilibrium/time_slice/profiles_1d/geometric_axis/r
    dd_path: equilibrium/time_slice/profiles_1d/geometric_axis/r
    status: attached
  - id: dd:summary/boundary/geometric_axis_r/value
    dd_path: summary/boundary/geometric_axis_r/value
    status: attached
- name: major_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate of the magnetic axis, the degenerate innermost
    point about which all closed magnetic flux surfaces are nested and at which the
    gradient of the poloidal magnetic flux vanishes.
  documentation: "The magnetic axis is the singular point in the plasma poloidal cross-section\
    \ at which the gradient of the poloidal magnetic flux vanishes, $\\nabla\\psi\
    \ = 0$, forming the innermost degenerate flux surface about which all closed nested\
    \ surfaces are organized. Its major-radius coordinate $R_\\mathrm{axis}$ measures\
    \ the distance from the toroidal symmetry axis to this point in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is measured outward from the machine\
    \ symmetry axis.\n\nThe magnetic axis satisfies\n\n$$\n\\left.\\nabla\\psi(R,\
    \ Z)\\right|_{(R_\\mathrm{axis},\\, Z_\\mathrm{axis})} = 0\n$$\n\nwhere $\\psi(R,\
    \ Z)$ is the poloidal magnetic flux function and $Z_\\mathrm{axis}$ is the corresponding\
    \ vertical coordinate. The outward displacement $R_\\mathrm{axis} - R_\\mathrm{geo}$,\
    \ where $R_\\mathrm{geo}$ is the [major radius of the geometric axis](name:major_radius_of_geometric_axis),\
    \ constitutes the Shafranov shift, which increases with plasma pressure and current.\n\
    \nThe axis position is determined by equilibrium reconstruction, which locates\
    \ the extremum of the poloidal flux function on the $(R, Z)$ poloidal plane. It\
    \ serves as the inner normalization reference for radial flux coordinates and\
    \ is a key input to plasma position control. It differs from [major_radius_of_current_center](name:major_radius_of_current_center)\
    \ when the current profile is poloidally asymmetric. Typical values range from\
    \ 1.6\u20133.0 m for medium-sized tokamaks to approximately 6.2 m for ITER-class\
    \ devices.\n\nSign convention: Positive when $R_\\mathrm{axis}$ is directed outward\
    \ from the toroidal symmetry axis in the $+\\hat{R}$ direction of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_current_center
  sources:
