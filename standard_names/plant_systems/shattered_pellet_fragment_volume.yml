name: shattered_pellet_fragment_volume
status: draft
cocos_transformation_type: one_like
description: Volume of an individual ice fragment produced by the shattering of a
  cryogenic pellet in a shattered pellet injection system.
documentation: "The fragment volume $V_{\\mathrm{frag}}$ (in m$^3$) describes the\
  \ solid-material volume of a single ice shard resulting from pellet shattering in\
  \ an SPI system. Assuming roughly spherical fragments, $V_{\\mathrm{frag}} = \\\
  frac{4}{3}\\pi r_{\\mathrm{frag}}^3$, where $r_{\\mathrm{frag}}$ is the effective\
  \ fragment radius. Fragment volumes span a broad distribution, typically $10^{-12}$\u2013\
  $10^{-7}$ m$^3$, depending on the shattering geometry, fragmentation gas pressure,\
  \ and original pellet size. The fragment size distribution critically determines\
  \ the material deposition profile inside the plasma: smaller fragments ablate earlier\
  \ in the edge while larger ones penetrate deeper into the core, which is essential\
  \ for disruption mitigation efficiency. Fragment sizes are characterized experimentally\
  \ by fast-framing cameras or laser-sheet illumination at the shatter point. See\
  \ also `diameter_of_pellet` for the pre-shatter pellet dimension and `shattered_pellet_injector_fragmentation_gas_flow_rate`\
  \ for the shattering driver."
