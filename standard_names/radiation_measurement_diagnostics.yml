- name: temperature_of_camera
  kind: scalar
  status: draft
  description: Apparent temperature of a surface observed by a camera, derived from
    calibrated digital counts via Planck's law inversion under an assumed emissivity.
  documentation: "The apparent temperature $T_{\\mathrm{app}}$ is obtained by inverting\
    \ the integrated Planck law:\n\n$$\nL(\\lambda_1,\\lambda_2; T_{\\mathrm{app}})\
    \ = \\int_{\\lambda_1}^{\\lambda_2} \\frac{2hc^2}{\\lambda^5}\\,\\frac{1}{\\exp\\\
    left(\\frac{hc}{\\lambda k_B T_{\\mathrm{app}}}\\right)-1}\\,d\\lambda\n$$\n\n\
    where $L$ is the measured radiance integrated over the camera's spectral bandpass\
    \ $[\\lambda_1,\\lambda_2]$, $h$ is Planck's constant, $c$ the speed of light,\
    \ and $k_B$ Boltzmann's constant. The inversion assumes a uniform surface emissivity\
    \ $\\varepsilon$ (usually set to 1.0 for blackbody or a user-provided value).\
    \ The resulting $T_{\\mathrm{app}}$ equals the true thermodynamic temperature\
    \ only when $\\varepsilon = 1$ and the radiation originates from a single surface;\
    \ in practice, corrections for varying emissivity, reflected background, and transmission\
    \ losses are required. Typical values in fusion devices range from 200\u2009K\
    \ (cool vessel walls) to over 1500\u2009K (divertor strike points during heat\
    \ loads)."
  unit: K
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:thermal_temperature
  - name:major_radius_of_optical_element
  - name:etendue_of_spectrometer
  sources:
  - id: dd:camera_ir/channel/camera/frame/apparent_temperature
    dd_path: camera_ir/channel/camera/frame/apparent_temperature
    status: composed
- name: toroidal_angle_of_camera
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of the camera center in the cylindrical (R,
    phi, Z) frame.
  documentation: 'The toroidal angle $\phi_{\text{cam}}$ of the camera center defines
    the camera position and is measured from a reference direction in the right-handed
    cylindrical $(R, \phi, Z)$ coordinate system. This angle locates the camera in
    the toroidal direction and is essential for accurate tomographic reconstruction
    and line-of-sight geometry registration. Typical values range from 0 to $2\pi$
    radians. This quantity is analogous to [toroidal_angle_of_reflectometer_antenna](name:toroidal_angle_of_reflectometer_antenna)
    and complements the vertical coordinate [vertical_coordinate_of_camera](name:vertical_coordinate_of_camera).


    Sign convention: Positive when increasing in the counter-clockwise direction viewed
    from above (along $+\hat{Z}$).'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:toroidal_angle_of_reflectometer_antenna
