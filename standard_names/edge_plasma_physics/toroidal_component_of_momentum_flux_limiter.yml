name: toroidal_component_of_momentum_flux_limiter
description: Dimensionless limiter coefficient that caps the toroidal component of
  the ion momentum flux to prevent unphysical free-streaming transport.
documentation: The toroidal momentum flux limiter $\alpha_{\phi}^{(m)}$ is a dimensionless
  coefficient ($0 < \alpha_{\phi}^{(m)} \le 1$) applied to the toroidal projection
  of the ion momentum flux, $\Gamma_{m,\phi}^{\mathrm{lim}} = \alpha_{\phi}^{(m)}
  \, \Gamma_{m,\phi}^{\mathrm{free}}$. It constrains the collisional flux estimate
  to remain below the kinetic free-streaming limit in low-collisionality edge regions.
  A value of 1 implies no limiting, and smaller values progressively reduce the toroidal
  momentum transport. This parameter is commonly tuned in edge fluid transport solvers
  (SOLPS-ITER, SOLEDGE2D) and is defined per grid element. See also `parallel_component_of_momentum_flux_limiter`
  and `diamagnetic_component_of_ion_momentum_flux_limiter` for sibling components.
