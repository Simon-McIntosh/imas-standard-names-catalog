name: volume_averaged_lithium_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of lithium ions, relevant to wall
  conditioning and liquid-metal divertor concepts.
documentation: The volume-averaged lithium ion number density $\langle n_{\mathrm{Li}}
  \rangle_V = V^{-1} \int n_{\mathrm{Li}}(\mathbf{r})\, dV$ where $n_{\mathrm{Li}}$
  is the local lithium ion density in m$^{-3}$ (summed over $\mathrm{Li}^{1+}$, $\mathrm{Li}^{2+}$,
  $\mathrm{Li}^{3+}$) and $V$ is the plasma volume in m$^3$. Lithium enters the plasma
  from lithium-wall conditioning (pellet injection, evaporation), lithium granule
  injection for edge-localized mode (ELM) pacing, or liquid-lithium plasma-facing
  components; typical volume-averaged densities range from $10^{15}$ to $10^{18}$
  m$^{-3}$ depending on the source intensity. CXRS on the Li$^{3+}$ line and laser-induced
  fluorescence are diagnostic pathways. As a low-$Z$ species ($Z = 3$), lithium contributes
  modestly to $Z_{\mathrm{eff}}$ but can improve particle confinement and edge stability.
  See also `volume_averaged_boron_ion_number_density` and `electron_number_density`.
