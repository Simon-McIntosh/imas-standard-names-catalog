- name: radial_neutral_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Radial component of the diamagnetic drift velocity for neutral species,
    driven by the coupling of neutral particles to the plasma pressure gradient across
    the magnetic field.
  documentation: "The radial component $v_{\\text{dia},R}^{\\text{neutral}}$ of the\
    \ neutral diamagnetic drift velocity arises from collisional or charge-exchange\
    \ coupling between the neutral population and the magnetized plasma. The diamagnetic\
    \ drift is perpendicular to both the magnetic field $\\mathbf{B}$ and the pressure\
    \ gradient $\\nabla p$, and its radial projection quantifies cross-field advection\
    \ of neutral particles in the edge and scrape-off layer. The full velocity vector\
    \ is given by $\\mathbf{v}_\\text{dia} = (\\mathbf{B} \\times \\nabla p_\\text{neutral})\
    \ / (Z_i e n_\\text{neutral} B^2)$ in SI, where $p_\\text{neutral}$ is the neutral\
    \ pressure and $n_\\text{neutral}$ the neutral density; the radial component $v_R$\
    \ isolates the $R$-directed contribution in the $(R,\\phi,Z)$ frame. This quantity\
    \ is related to the parent [neutral_velocity_due_to_diamagnetic_drift](name:neutral_velocity_due_to_diamagnetic_drift)\
    \ and parallels the [toroidal_neutral_diamagnetic_velocity](name:toroidal_neutral_diamagnetic_velocity)\
    \ for the poloidal component. Typical radial neutral drift velocities range from\
    \ 10\u2013100 m/s in the SOL to 1\u201310 km/s near the separatrix, strongly influencing\
    \ fueling and impurity transport. Cross-referencing the radial profiles with [ion_diamagnetic_velocity](name:ion_diamagnetic_velocity)\
    \ reveals the differential neutral\u2013ion drift that drives charge-exchange\
    \ momentum transfer.\n\nSign convention: Positive when the velocity points in\
    \ the direction of increasing major radius $R$.\n\nThis quantity is obtained from\
    \ gyrofluid or kinetic neutral models that solve the coupled neutral\u2013plasma\
    \ transport equations, or diagnosed via charge-exchange recombination spectroscopy\
    \ on neutral beams coupled to collisional\u2013radiative modeling."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_velocity_due_to_diamagnetic_drift
  - name:toroidal_neutral_diamagnetic_velocity
  - name:ion_diamagnetic_velocity
