name: electron_cyclotron_beam_launched_power_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-trace of the power to be launched by an individual electron
  cyclotron beam.
documentation: This reference waveform defines the target launched power for a single
  EC beam as a function of time during a plasma discharge. The plasma control system
  commands the gyrotron output to track this waveform, enabling programmed heating
  and current-drive scenarios. Typical per-beam launched powers range from 0.3 to
  1.5 MW for present-day tokamaks and up to 2 MW per beam for ITER EC systems. The
  unit is dimensionless (normalized) when used within the pulse-schedule framework;
  the actual physical power in watts is recovered by multiplying by the beam's nominal
  rating. This waveform is coordinated with steering-angle and deposition-location
  references to achieve the desired spatial heating profile. See also the system-level
  total launched power reference.
