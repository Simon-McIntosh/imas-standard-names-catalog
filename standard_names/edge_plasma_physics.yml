- name: vertical_neutral_state_momentum
  kind: scalar
  status: draft
  description: Vertical (Z) component of the volumetric momentum source density for
    a neutral species charge state, representing the net rate of vertical momentum
    exchange with the background plasma via atomic processes.
  documentation: "The vertical momentum source density for a neutral species charge\
    \ state describes the rate of change of vertical momentum per unit volume due\
    \ to plasma-neutral interactions such as charge-exchange and elastic collisions.\
    \ This quantity is the Z-axis component of the vector [neutral_state_momentum](name:neutral_state_momentum),\
    \ with positive values indicating momentum gain in the +Z direction (upward, aligned\
    \ with the vertical axis of the cylindrical $(R, \\phi, Z)$ frame). The total\
    \ momentum source density for a neutral state can be expressed as $\\mathbf{S}_{\\\
    mathrm{mom}} = m_n n_n \\mathbf{F}_{\\mathrm{exch}}$, where $m_n$ is the neutral\
    \ mass (in kg), $n_n$ is the neutral density (in m$^{-3}$), and $\\mathbf{F}_{\\\
    mathrm{exch}}$ is the net momentum exchange rate per particle from atomic collisions\
    \ (in m/s$^2$). Typical vertical source contributions in the edge plasma are on\
    \ the order of 0.01\u20131 kg\xB7m$^{-1}$\xB7s$^{-2}$ for ITER-relevant conditions,\
    \ inferred from neutral transport codes or measured indirectly via spectroscopy\
    \ of Doppler-shifted line emission. This component is paired with the radial and\
    \ toroidal components of the same neutral state, such as the vertical component\
    \ for all neutral species [vertical_neutral_momentum](name:vertical_neutral_momentum)\
    \ and the vertical component for ionized states [vertical_ion_state_momentum](name:vertical_ion_state_momentum)."
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
