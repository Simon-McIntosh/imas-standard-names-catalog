        when going from first point to second point of the line of sight
      parent_path: spectrometer_visible/channel/polarization_spectroscopy
      parent: Physics quantities measured from polarized light spectroscopy
      data_type: FLT_1D
      unit: m.s^-1
      coordinates:
      - spectrometer_visible/channel/polarization_spectroscopy/time
    enhanced_context:
      description: Line-of-sight projected velocity of hot neutral atoms measured
        by polarization spectroscopy on a visible spectrometer channel. Positive values
        correspond to motion from the first to the second point along the line of
        sight.
      kind: llm
- name: neutron_flux_due_to_beam_beam_fusion
  kind: scalar
  status: active
  description: Total neutron count rate from neutron-producing beam-beam fusion reactions,
    summed over represented fast-ion fuel channels in which both reactants are nonthermal
    ions from neutral beam injection.
  documentation: 'This quantity is the volume-integrated neutron count rate from fusion
    reactions between two nonthermal fast fuel ions generated by neutral beam injection.
    It includes only neutron-producing reaction branches and aggregates the represented
    isotope channels. It is the neutron-count component of [beam-beam fusion flux](name:flux_due_to_beam_beam_fusion),
    distinct from beam-thermal and thermonuclear neutron production.


    $$

    \dot{N}_{n}^{\mathrm{bb}} = \sum_{(a,b)\in\mathcal{C}} \int_{V} \nu_{ab}^{(n)}(\mathbf{r})\,R_{ab}^{\mathrm{bb}}(\mathbf{r})\,\mathrm{d}V

    $$


    Here $\dot{N}_{n}^{\mathrm{bb}}$ is the total neutron count rate, $\mathcal{C}$
    is the set of included fast-ion reaction channels, $a$ and $b$ label the fast-ion
    fuel species, $R_{ab}^{\mathrm{bb}}(\mathbf{r})$ is the local beam-beam reaction
    rate density, $\nu_{ab}^{(n)}$ is the neutron multiplicity of the reaction branch,
    $V$ is the active plasma volume, and $\mathbf{r}$ is position. Channel-specific
    entries such as [deuterium-deuterium neutron flux due to beam-beam fusion](name:deuterium_deuterium_neutron_flux_due_to_beam_beam_fusion)
    and [deuterium-tritium neutron flux due to beam-beam fusion](name:deuterium_tritium_neutron_flux_due_to_beam_beam_fusion)
    resolve the aggregate by fuel channel.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:flux_due_to_beam_beam_fusion
  - name:deuterium_deuterium_neutron_flux_due_to_beam_beam_fusion
  - name:deuterium_tritium_neutron_flux_due_to_beam_beam_fusion
