- name: toroidal_component_of_trapped_particle_torque_density_due_to_radial_current
  kind: scalar
  status: draft
  description: Toroidal component of the electromagnetic kinetic-moment density exerted
    on the bounce-trapped particle population by the Lorentz force arising from a
    radial current density. Trapped particles satisfy the mirror condition $\mu B_\mathrm{max}
    \geq \tfrac{1}{2}mv^2$ and are confined to banana orbits. This quantity is a flux-surface-averaged
    torque density per unit volume.
  documentation: "When a radial current density $\\mathbf{J}_r = J_r \\hat{R}$ flows\
    \ through a magnetized plasma, the Lorentz body force $\\mathbf{f} = \\mathbf{J}_r\
    \ \\times \\mathbf{B}$ has a toroidal component that transfers angular momentum\
    \ to the plasma. This standard name isolates the contribution from the bounce-trapped\
    \ particle population \u2014 those satisfying the mirror confinement condition\
    \ $\\mu B_\\mathrm{max} \\geq \\tfrac{1}{2}mv^2$, where $\\mu = mv_\\perp^2 /\
    \ 2B$ is the magnetic moment and $B_\\mathrm{max}$ is the maximum field strength\
    \ along the field line. Trapped particles follow banana orbits and do not complete\
    \ full poloidal circuits, making their response to radial currents qualitatively\
    \ different from that of passing particles.\n\nFormally, this quantity is the\
    \ flux-surface average of the toroidal projection of the first velocity moment\
    \ of the electromagnetic acceleration restricted to the trapped region of phase\
    \ space:\n$$\\tau_\\phi^\\mathrm{trap} = \\left\\langle \\int_{\\mathrm{trapped}}\
    \ m v_\\phi \\, (\\mathbf{J}_r \\times \\mathbf{B}) \\cdot \\nabla v \\, f \\\
    , d^3v \\right\\rangle_{\\mathrm{FSA}}$$\nwhere $f$ is the particle distribution\
    \ function and $\\langle \\cdots \\rangle_\\mathrm{FSA}$ denotes the flux-surface\
    \ average. The toroidal projection is onto the $\\hat{\\phi}$ direction of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame.\n\nThe total torque density\
    \ from radial currents decomposes as\n$$\\tau_\\phi^\\mathrm{tot} = \\tau_\\phi^\\\
    mathrm{trap} + \\tau_\\phi^\\mathrm{co} + \\tau_\\phi^\\mathrm{ctr}$$\nwhere the\
    \ co-passing and counter-passing contributions are given by [toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current](name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current)\
    \ and [toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current](name:toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current),\
    \ with the full sum given by [toroidal_component_of_torque_density_due_to_radial_current](name:toroidal_component_of_torque_density_due_to_radial_current).\
    \ The trapped-particle contribution is also related to the total trapped-particle\
    \ torque density [toroidal_component_of_trapped_particle_torque_density](name:toroidal_component_of_trapped_particle_torque_density),\
    \ which includes all force channels, not only radial currents.\n\nThis quantity\
    \ arises naturally in neoclassical transport theory and in the analysis of neoclassical\
    \ toroidal viscosity (NTV), where non-resonant magnetic perturbations drive radial\
    \ currents that selectively brake or accelerate different particle classes. The\
    \ trapped population typically carries a large fraction of the NTV torque because\
    \ of their enhanced drift-orbit width and asymmetric bounce motion. Typical magnitudes\
    \ in a tokamak are of order $10^{-3}$\u2013$10^{1}$ N m$^{-2}$ depending on collisionality\
    \ regime, trapped fraction $f_t \\sim \\sqrt{2\\epsilon}$ (where $\\epsilon =\
    \ r/R_0$ is the inverse aspect ratio), and the amplitude of the driving radial\
    \ current.\n\nSign convention: Positive when the net toroidal force on the trapped\
    \ population points in the direction of increasing toroidal angle $\\phi$ in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_co_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_counter_passing_particle_torque_density_due_to_radial_current
  - name:toroidal_component_of_torque_density_due_to_radial_current
  constraints: []
  arguments:
  - name: trapped_particle_torque_density_due_to_radial_current
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/torque_phi_j_radial
    dd_path: distributions/distribution/profiles_1d/trapped/torque_phi_j_radial
    status: composed
  - id: dd:distributions/distribution/profiles_1d/trapped/torque_tor_j_radial
    dd_path: distributions/distribution/profiles_1d/trapped/torque_tor_j_radial
    status: composed
