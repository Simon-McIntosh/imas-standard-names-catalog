    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/density
    status: composed
- name: fast_ion_pressure
  kind: vector
  status: draft
  description: Anisotropic kinetic pressure of the fast (non-thermal) ion population,
    capturing the full pressure tensor arising from non-Maxwellian velocity distributions
    of energetic ions in a magnetized plasma.
  documentation: "Fast ions \u2014 alpha particles, neutral-beam-injected ions, and\
    \ ICRH-accelerated ions \u2014 develop strongly anisotropic velocity distributions\
    \ that cannot be characterized by a single scalar pressure. The fast-ion pressure\
    \ tensor is most naturally decomposed along and perpendicular to the local magnetic\
    \ field $\\mathbf{B}$, yielding two independent scalar components: the parallel\
    \ pressure $p_{\\parallel,f} = m_f \\int v_{\\parallel}^2 f_f \\, d^3v$ and the\
    \ perpendicular pressure $p_{\\perp,f} = \\frac{m_f}{2} \\int v_{\\perp}^2 f_f\
    \ \\, d^3v$, where $m_f$ is the fast-ion mass and $f_f$ is the fast-ion distribution\
    \ function. The isotropic (trace) contribution to the total pressure balance is\
    \ $p_f = (p_{\\parallel,f} + 2\\,p_{\\perp,f})/3$. In ITER-class deuterium\u2013\
    tritium plasmas, fast-ion pressures can reach $10^4$\u2013$10^5$ Pa in the core,\
    \ representing a significant fraction of the total MHD pressure and thus affecting\
    \ equilibrium reconstruction and stability analysis. The distribution function\
    \ is computed from Fokker\u2013Planck or Monte Carlo codes (e.g., using distributions\
    \ of particle populations), and validated against fast-ion diagnostics such as\
    \ neutral-particle analyzers and collective Thomson scattering. The directional\
    \ components are accessed individually as [parallel_component_of_fast_ion_pressure](name:parallel_component_of_fast_ion_pressure)\
    \ and [perpendicular_component_of_fast_ion_pressure](name:perpendicular_component_of_fast_ion_pressure);\
    \ the analogous quantity for fast neutrals arising from charge-exchange reactions\
    \ is [fast_neutral_pressure](name:fast_neutral_pressure).\n\nSign convention:\
    \ Positive when the fast-ion kinetic energy density is positive, which is always\
    \ the case for a physical distribution function."
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_component_of_fast_ion_pressure
  - name:perpendicular_component_of_fast_ion_pressure
  - name:fast_neutral_pressure
