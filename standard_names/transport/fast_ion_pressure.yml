name: fast_ion_pressure
status: draft
description: Scalar pressure exerted by suprathermal (fast) ions whose energy significantly
  exceeds the bulk thermal energy $E \gg k_B T_i$.
documentation: "The fast ion pressure $p_{\\mathrm{fast}}$ is the second velocity-moment\
  \ of the suprathermal ion distribution function, $p_{\\mathrm{fast}} = \\frac{1}{3}\
  \ \\int m_i |\\mathbf{v} - \\mathbf{u}|^2 f_{\\mathrm{fast}}(\\mathbf{v})\\,d^3v$,\
  \ where $m_i$ is the ion mass, $\\mathbf{u}$ the bulk flow velocity, and $f_{\\\
  mathrm{fast}}$ the fast-ion distribution. This population is generated primarily\
  \ by neutral beam injection (NBI) and ion cyclotron resonance heating (ICRH), with\
  \ birth energies of order 50\u2013500 keV; the resulting fast-ion pressure can reach\
  \ 10\u2013100 kPa in high-performance tokamak discharges, contributing a non-negligible\
  \ fraction ($\\beta_{\\mathrm{fast}}/\\beta_{\\mathrm{total}} \\sim 5$\u201330%)\
  \ of the total plasma beta. Fast ion pressure gradients modify the MHD equilibrium\
  \ and can drive or stabilize Alfv\xE9nic instabilities such as toroidal Alfv\xE9\
  n eigenmodes (TAEs). It is typically inferred from fast-ion D-alpha (FIDA) spectroscopy,\
  \ neutron emission profiles, or Monte Carlo orbit-following codes (e.g., NUBEAM,\
  \ ASCOT). See also the thermal pressure components and the fast-particle energy\
  \ source."
