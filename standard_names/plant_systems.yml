- name: outer_atomic_count_of_pellet
  kind: scalar
  status: active
  description: Outer atomic count of a pellet is the total inventory of atomic nuclei
    in its outer material layer, independent of molecular bonding, phase, or species.
  documentation: 'Outer atomic count of a pellet is the total inventory of atomic
    nuclei contained in the pellet''s outer material layer. Molecules, compounds,
    and mixtures are converted to their constituent atoms before summation, regardless
    of molecular bonding or phase.


    For constituent entity types indexed by $i$, the outer-layer atomic inventory
    is defined by


    $$

    N_{\mathrm{outer}} = \sum_i a_i N_i

