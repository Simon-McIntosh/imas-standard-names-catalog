- name: radial_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume resolved with
    respect to radial position, retaining the local density rather than a line- or
    volume-averaged value.
  documentation: 'Number density of free electrons per physical volume resolved with
    respect to radial position is the local continuum count density of electrons not
    bound to atoms, molecules, or ions. It describes the unqualified free-electron
    population rather than a selected thermal or fast component.


    For a representative physical volume associated with radial position label $\xi$,
    the defining ratio is:


    $$

    n_e(\xi) = \frac{N_e(\xi)}{V(\xi)}

    $$


    where $n_e(\xi)$ is the local electron density, $N_e(\xi)$ is the number of free
    electrons in the representative volume, $V(\xi)$ is that physical volume, and
    $\xi$ labels radial position. The volume is small on macroscopic plasma scales
    but contains enough particles for a continuum quantity.


    This is the radial specialization of [electron_density](name:electron_density),
    not a line- or volume-averaged density. A derivative such as [gradient of radial
    electron density](name:gradient_of_radial_electron_density) describes the signed
    radial variation of this density and is distinct from the density itself.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density
  - name:gradient_of_radial_electron_density
  arguments:
  - name: electron_density
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: gradient_of_radial_electron_density
  kind: scalar
  status: active
  description: Gradient of radial electron density is the signed local derivative
    of electron number density with respect to normalized poloidal magnetic flux,
    evaluated at the fitted core-side shoulder of an H-mode pedestal. It describes
    the density slope at that pedestal-top locus, not the maximum pedestal density
    gradient.
  documentation: 'Gradient of radial electron density is the signed local derivative
    of electron number density with respect to the normalized poloidal magnetic flux
    coordinate $\psi_N$, evaluated at the fitted core-side shoulder of an H-mode pedestal.
    The fitted core-side shoulder is the pedestal-top locus associated with the density
    value [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top).


    The derivative is defined by


    $$

    G_{n_e,\mathrm{core}} = \left.\frac{d n_e}{d\psi_N}\right|_{\psi_N = \psi_{N,\mathrm{core}}}

    $$


    where $G_{n_e,\mathrm{core}}$ is this quantity, $n_e(\psi_N)$ is electron number
    density as a function of $\psi_N$, $\psi_N$ is the dimensionless normalized poloidal
    magnetic flux coordinate, and $\psi_{N,\mathrm{core}}$ is the fitted core-side
    shoulder location.


    This is a local first derivative at the fitted core-side shoulder, not the electron
    density value at that location, an average change across the pedestal, or the
    maximum-gradient pedestal slope [derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum).


    Sign convention: Positive when electron number density increases with increasing
    normalized poloidal magnetic flux coordinate $\psi_N$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:radial_electron_density
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum
  arguments:
  - name: radial_electron_density
    operator: gradient
    operator_kind: unary_prefix
  sources:
