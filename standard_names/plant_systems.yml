- name: ethylene_prefill_count
  kind: scalar
  status: active
  description: Ethylene prefill count is the total amount of neutral ethylene (C2H4)
    introduced before plasma breakdown, expressed as an equivalent-electron count
    with 16 equivalent electrons per molecule.
  documentation: 'Ethylene prefill count is the total amount of neutral ethylene (C2H4)
    introduced during the prefill phase before plasma breakdown, expressed as an equivalent-electron
    count. Each neutral ethylene molecule contributes sixteen equivalent electrons:
    twelve from two carbon atoms and four from four hydrogen atoms.


    The equivalent-electron count is defined by


    $$

    N_{e,\mathrm{eq}}^{\mathrm{C_2H_4,prefill}} = (2Z_{\mathrm{C}}+4Z_{\mathrm{H}})N_{\mathrm{C_2H_4,prefill}}
    = 16N_{\mathrm{C_2H_4,prefill}} = \int_{t_0}^{t_{\mathrm{bd}}}16\dot{N}_{\mathrm{C_2H_4}}(t)\,dt

    $$


    where $Z_{\mathrm{C}}=6$ and $Z_{\mathrm{H}}=1$ are the atomic numbers of carbon
    and hydrogen, $N_{\mathrm{C_2H_4,prefill}}$ is the accumulated ethylene-molecule
    count, $\dot{N}_{\mathrm{C_2H_4}}$ is the ethylene introduction rate, and $t_0$
    and $t_{\mathrm{bd}}$ are the prefill start and plasma-breakdown times.


    This quantity includes only neutral ethylene introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and retained
    or ionized inventory. It is the ethylene component of [prefill_count](name:prefill_count);
    [accumulated_ethylene_count](name:accumulated_ethylene_count) represents the distinct
    post-breakdown accumulation, while [ethane_prefill_count](name:ethane_prefill_count)
    applies the same convention to a different molecule.'
