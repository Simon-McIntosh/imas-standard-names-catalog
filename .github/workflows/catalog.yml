name: Catalog Site

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "catalog-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - id: version
        run: |
          ref_name="${{ github.ref_name }}"
          clean_name="${ref_name#v}"

          if [[ $clean_name =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="v$(echo $clean_name | cut -d. -f1-2)"
            tagged=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}"
            tagged=false
          else
            version=${{ github.ref_name }}
            tagged=false
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tagged=$tagged" >> $GITHUB_OUTPUT

      - name: Build and deploy catalog site
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch yet"
          VERSION="${{ steps.version.outputs.version }}"
          TAGGED="${{ steps.version.outputs.tagged }}"
          if [[ "$TAGGED" == "true" ]]; then
            uv run standard-names site-deploy standard_names/ \
              --version "$VERSION" --push --set-default
          else
            uv run standard-names site-deploy standard_names/ \
              --version "$VERSION" --push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
