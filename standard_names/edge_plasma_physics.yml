    \ confined plasma from the scrape-off layer.\n\nThe toroidal projection is defined\
    \ as:\n\n$$\nv_\\phi^{DT} = \\mathbf{v}_{DT} \\cdot \\hat{\\phi}\n$$\n\nwhere\
    \ $\\mathbf{v}_{DT}$ is the bulk-flow velocity of the fictitious deuterium-tritium\
    \ species and $\\hat{\\phi}$ is the unit vector in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame.\n\
    \nThis quantity is a local point evaluation at the plasma boundary, distinct from\
