    dd_path: reflectometer_fluctuation/channel/antenna_detection_static/surface
    status: attached
  - id: dd:reflectometer_fluctuation/channel/antenna_emission_static/surface
    dd_path: reflectometer_fluctuation/channel/antenna_emission_static/surface
    status: attached
  - id: dd:reflectometer_profile/channel/antenna_detection/surface
