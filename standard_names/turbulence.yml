    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-moments_norm_gyrocenter_bessel_1-j_parallel
