- name: spectral_absorptivity_of_filter
  kind: scalar
  status: draft
  description: Dimensionless wavelength-dependent probability that an incident photon
    is absorbed in a diagnostic filter material rather than transmitted or redirected
    by other loss channels. It ranges from 0 for no absorption to 1 for complete absorption
    at the specified wavelength.
  documentation: 'Spectral absorptivity of a filter is the fraction of incident photons
    at wavelength $\lambda$ that are absorbed within the filter material. It is dimensionless,
    bounded by $0 \le A_\lambda \le 1$, and describes the wavelength dependence of
    filter attenuation rather than a wavelength-integrated response.


    For a monochromatic photon population, the absorptivity can be written as a photon
    balance:


    $$

    A_\lambda = \frac{N_\mathrm{abs}(\lambda)}{N_\mathrm{inc}(\lambda)} = 1 - T_\lambda
    - R_\lambda - S_\lambda

    $$


    where $\lambda$ is wavelength in meters, $N_\mathrm{inc}$ and $N_\mathrm{abs}$
    are the incident and absorbed photon counts, $T_\lambda$ is the transmitted photon
    fraction, $R_\lambda$ is the reflected fraction, and $S_\lambda$ represents other
    nonabsorbed losses such as scattering out of the accepted beam or escaping fluorescence.
    For a homogeneous slab of thickness $d$ in meters with linear attenuation coefficient
    $\mu(\lambda)$ in m$^{-1}$, the unscattered transmitted fraction is often approximated
    by $T_\lambda \simeq \exp[-\mu(\lambda)d]$; then $A_\lambda \simeq 1-\exp[-\mu(\lambda)d]$
    only when reflection, scattering, and escaping secondary radiation are negligible
    or are intentionally included in the lost-photon category.


    Spectral absorptivity is obtained from tabulated or measured optical constants,
    mass attenuation coefficients, material composition, layer thicknesses, and surface
    coatings, and may be verified by calibration with known photon spectra. It is
    defined only over the wavelength interval for which those material properties
    and calibration data are valid; outside that interval, extrapolated values should
    be treated as model assumptions rather than measured filter behavior. The corresponding
    transmission relation is $T_\lambda = 1 - A_\lambda - R_\lambda - S_\lambda$,
    reducing to $T_\lambda \simeq 1-A_\lambda$ only when the additional nonabsorbed
    loss channels are negligible.


    Typical values span nearly the full range 0-1: thin filters may have absorptivity
    below 0.01 in their pass band, intermediate attenuation often gives 0.1-0.9, and
    wavelengths near strong absorption edges or below the filter cutoff can approach
    1. Sharp spectral structure can occur near material absorption edges, so neighboring
    wavelengths may have substantially different absorptivity.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
