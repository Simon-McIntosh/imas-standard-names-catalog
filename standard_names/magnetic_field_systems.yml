- name: radial_magnetization_of_ferritic_element
  kind: scalar
  status: active
  description: "Signed radial component of the effective magnetization vector assigned\
    \ to a ferritic element in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial magnetization of a ferritic element is the projection of
    its effective magnetization vector onto the cylindrical major-radius direction.
    It describes the element''s magnetization, not the radial component of the surrounding
    magnetic field.


    $$

    M_R = \mathbf{M} \cdot \hat{R}

    $$


    where $M_R$ is the radial magnetization, $\mathbf{M}$ is the effective magnetization
    vector assigned to the ferritic element, and $\hat{R}$ is the outward radial unit
    vector in the right-handed cylindrical $(R, \phi, Z)$ frame. The [vertical magnetization
    of the ferritic element](name:vertical_magnetization_of_ferritic_element) and
    [toroidal magnetization of the ferritic element](name:toroidal_magnetization_of_ferritic_element)
    are the corresponding projections onto the other cylindrical directions. This
    quantity is distinct from the [radial magnetic field at the ferritic element centroid](name:radial_magnetic_field_at_ferritic_element_centroid),
    which describes magnetic flux density rather than magnetization.


    Sign convention: Positive when the effective magnetization points toward increasing
    major radius $R$.'
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_magnetization_of_ferritic_element
  - name:toroidal_magnetization_of_ferritic_element
  - name:radial_magnetic_field_at_ferritic_element_centroid
  sources:
