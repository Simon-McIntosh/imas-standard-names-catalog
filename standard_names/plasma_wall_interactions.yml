    status: composed
- name: hydrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of hydrogen (protium) ions in the boundary plasma adjacent
    to a limiter surface. It characterizes the local ion population interacting with
    the plasma-facing limiter material.
  documentation: 'Hydrogen density at a limiter is the local number density of hydrogen
    ions in the boundary plasma next to a limiter surface. It describes the plasma
    population available for particle flux, recycling, charge exchange, and plasma-material
    interaction at the limiter location, without implying a universal relation to
    upstream or pedestal densities.


    As a number density, it is defined by the local particle content per unit volume:


    $$

    n_{\mathrm{H}^+} = \frac{dN_{\mathrm{H}^+}}{dV}

    $$


    where $N_{\mathrm{H}^+}$ is the number of hydrogen ions in a small plasma volume
    $V$ near the limiter. The value is non-negative and is expressed in $m^{-3}$.


    In practice this quantity is inferred from boundary-plasma diagnostics and modeling,
    such as Langmuir probes, spectroscopic measurements combined with collisional-radiative
    interpretation, or edge plasma simulations constrained by measurements. Its value
    depends on local ionization, recycling from the limiter, cross-field transport,
    magnetic connection length, plasma fueling, and the limiter geometry.


    Typical values in tokamak boundary plasmas are about $10^{17}$-$10^{20}$ m$^{-3}$,
    with lower values in tenuous scrape-off-layer conditions and higher values near
    dense, strongly recycling limiter plasmas.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_density_at_limiter
  - name:hydrogen_density_at_pedestal
  - name:hydrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/hydrogen/value
