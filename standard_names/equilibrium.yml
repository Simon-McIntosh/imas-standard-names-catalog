- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: draft
  description: Vertical coordinate of the magnetic axis, the poloidal-field null which
    defines the innermost flux surface in a toroidal plasma.
  documentation: 'The magnetic axis is the poloidal-field null ($\nabla \psi = 0$)
    that identifies the innermost nested flux surface in a tokamak or stellarator
    equilibrium. Its vertical position $Z_{\rm axis}$ is measured from the machine
    midplane in the right-handed cylindrical $(R, \phi, Z)$ frame, where $\hat{Z}$
    is the upward vertical direction. The axis position is a fundamental output of
    equilibrium reconstruction codes and constrains the plasma shape and stored energy;
    the major-radius counterpart is [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis).
    Typical values range from $-0.5\,\mathrm{m}$ to $+0.5\,\mathrm{m}$ for medium-size
    tokamaks, with the axis usually near the midplane ($Z=0$) in symmetric double-null
    configurations.


    Sign convention: Positive when the magnetic axis lies above the midplane ($Z>0$).


    See also [vertical_coordinate_of_plasma_boundary](name:vertical_coordinate_of_plasma_boundary)
    for the Z-coordinate of the outermost flux surface, and [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    for the flux reference value at the axis.'
