- name: radial_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Radial direction cosine of the electromagnetic wave vector along a
    beam-tracing ray, equal to the radial component $k_R$ divided by the total wave-vector
    magnitude $|\mathbf{k}|$.
  documentation: "The radial normalized wave vector is the direction cosine of the\
    \ local wave vector projected onto the major-radius direction $\\hat{R}$ of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, evaluated at each point along\
    \ the beam or ray path in beam-tracing calculations. It encodes what fraction\
    \ of the instantaneous wave propagation direction is oriented radially \u2014\
    \ outward from or inward toward the machine symmetry axis.\n\nThe quantity is\
    \ defined as:\n\n$$\nk_{R,\\text{norm}} = \\frac{k_R}{|\\mathbf{k}|}\n$$\n\nwhere\
    \ $k_R$ is the [radial wave-vector component](name:radial_wave_vector_of_beam_tracing_beam)\
    \ and $|\\mathbf{k}|$ is the total wave-vector magnitude. Together with the [toroidal\
    \ normalized wave vector](name:toroidal_normalized_wave_vector_of_beam_tracing_beam)\
    \ and the [vertical normalized wave vector](name:vertical_normalized_wave_vector_of_beam_tracing_beam),\
    \ this component forms a unit direction vector satisfying $k_{R,\\text{norm}}^2\
    \ + k_{\\phi,\\text{norm}}^2 + k_{Z,\\text{norm}}^2 = 1$.\n\nIn beam-tracing or\
    \ ray-tracing simulations for RF heating, the normalized wave-vector components\
    \ track the instantaneous wave propagation direction as the ray refracts through\
    \ an inhomogeneous magnetized plasma. Values are dimensionless and bounded to\
    \ the interval $[-1, 1]$.\n\nSign convention: Positive when $k_R$ points in the\
    \ direction of increasing major radius $R$, away from the machine symmetry axis."
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/wave_vector/k_r_norm
    dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/k_r_norm
    status: composed
- name: radial_offset_of_beamlet_group
  kind: scalar
  status: draft
  description: Radial displacement of a beamlet group centroid from its nominal reference
    position within a neutral beam injector, measured along the major-radius direction
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Radial offset of a beamlet group is the signed displacement of the
    beamlet-group centroid from its nominal reference position along the major-radius
    coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    distance from the toroidal symmetry axis and $Z$ is vertical height. The nominal
    reference position is the unperturbed centroid specified by the injector design
    geometry or by an alignment datum established for the assembled injector. This
    offset describes static mechanical or alignment displacement of the group, not
    the change in beam tangency radius caused by beam steering or tilting.


    The radial offset is defined by the difference between the actual and reference
    centroid major radii:


    $$

    \Delta R = R_{\mathrm{group}} - R_{\mathrm{ref}}

    $$


    where $R_{\mathrm{group}}$ is the measured or reconstructed major radius of the
    beamlet-group centroid and $R_{\mathrm{ref}}$ is the nominal reference major radius;
    both are expressed in meters.


    In practice, $R_{\mathrm{group}}$ is obtained from mechanical survey, optical
    metrology, or beam-based alignment of the apertures or grids that form the beamlet
    group. The centroid should be formed using the same geometric or intensity-weighted
    convention used to define $R_{\mathrm{ref}}$, so that the offset isolates a displacement
    rather than a change of reference definition.


    Typical signed offsets for well-aligned injector hardware are about -0.005 to
    0.005 m, while commissioning adjustments or deliberately displaced configurations
    can be about -0.02 to 0.02 m. Larger magnitudes usually indicate a significant
    alignment error or a configuration intentionally far from the nominal reference.


    Sign convention: Positive when the beamlet-group centroid is displaced toward
    increasing major radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:nbi/unit/beamlets_group/tilting/delta_position/r
    dd_path: nbi/unit/beamlets_group/tilting/delta_position/r
    status: composed
- name: reflected_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Reflected power of an ion cyclotron heating antenna is the non-negative
    RF power carried by the backward-traveling wave from the antenna toward the feed
    line at a specified reference plane. It quantifies antenna matching and coupling
    shortfall, but equals forward power minus plasma-coupled power only when losses
    and reference-plane effects are excluded.
  documentation: 'Reflected power of an ion cyclotron heating antenna is the RF power
    in the wave traveling back from the antenna load toward the transmission line
    source. It is reported as a non-negative power-flow magnitude at a specified antenna
    or feed-line reference plane, not as a signed net power.


    At the same reference plane, the reflected power is related to the forward and
    net powers by the local power balance:


    $$

    P_{\mathrm{refl}} = P_{\mathrm{fwd}} - P_{\mathrm{net}}

    $$


    where $P_{\mathrm{refl}}$, $P_{\mathrm{fwd}}$, and $P_{\mathrm{net}}$ are powers
    in W; $P_{\mathrm{fwd}}$ is the incident power traveling toward the antenna, and
    $P_{\mathrm{net}}$ is the net RF power crossing the reference plane toward the
    antenna-plasma load. Only when losses between the reference plane and the plasma
    are negligible does $P_{\mathrm{net}}$ approximate the power coupled to the plasma.


    In practice, reflected power is obtained from calibrated directional couplers
    or from a voltage-current traveling-wave decomposition in the antenna feed system.
    The reference plane should be specified because standing waves, impedance transformations,
    and transmission-line or antenna losses can change the apparent reflected power
    measured at different locations.


    Typical reflected powers range from near 0 W in well-matched conditions to 10^3-10^6
    W in high-power ion-cyclotron operation. Well-matched systems commonly aim for
    reflected fractions $P_{\mathrm{refl}}/P_{\mathrm{fwd}}$ below about 0.05-0.2,
    while poor coupling or rapid load changes can produce much larger fractions approaching
    unity.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_ion_cyclotron_heating
  - name:reflected_power_of_lower_hybrid_antenna
  arguments:
  - name: power_of_ion_cyclotron_heating_antenna
    operator: reflected
    operator_kind: qualifier
  sources:
  - id: dd:ic_antennas/antenna/module/power_reflected
    dd_path: ic_antennas/antenna/module/power_reflected
    status: attached
  - id: dd:ic_antennas/antenna/power_reflected
    dd_path: ic_antennas/antenna/power_reflected
    status: composed
- name: reflected_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: RF power returning from a lower hybrid antenna back toward the transmission
    line, representing the portion of forward power not coupled into the plasma.
  documentation: "Reflected power from a lower hybrid antenna is the component of\
    \ incident RF power that fails to couple into the plasma and propagates back toward\
    \ the transmission line source. Poor coupling arises from unfavorable edge plasma\
    \ density gradients, suboptimal launcher\u2013plasma distance, or antenna phasing\
    \ conditions that mismatch the slow-wave accessibility window of the lower hybrid\
    \ wave.\n\nThe power reflection coefficient $|\\Gamma|^2$ relates reflected power\
    \ $P_\\text{ref}$ to forward power $P_\\text{fwd}$:\n\n$$\n|\\Gamma|^2 = \\frac{P_\\\
    text{ref}}{P_\\text{fwd}}\n$$\n\nwhere $P_\\text{fwd}$ is the total power delivered\
    \ to the antenna from the transmission line. The [launched power](name:launched_power_of_lower_hybrid_antenna)\
    \ into the vacuum vessel is the difference $P_\\text{fwd} - P_\\text{ref}$, and\
    \ the [total absorbed power](name:total_absorbed_power_of_lower_hybrid_antenna)\
    \ accounts for remaining waveguide and plasma losses. The gross RF input to the\
    \ antenna system is captured by the parent quantity `power_of_lower_hybrid_antenna`.\n\
    \nReflected power is monitored in real time using directional couplers embedded\
    \ in the transmission line feeding the lower hybrid launcher. In well-coupled\
    \ regimes, $P_\\text{ref}/P_\\text{fwd}$ is typically below 5\u201310%; transients\
    \ such as L\u2013H mode transitions or edge density fluctuations can briefly increase\
    \ the reflected fraction to 30\u201350%, triggering protection interlocks. The\
    \ analogous quantity for ion cyclotron systems is [reflected power of an IC antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  arguments:
  - name: power_of_lower_hybrid_antenna
    operator: reflected
    operator_kind: qualifier
  sources:
  - id: dd:lh_antennas/antenna/power_reflected
    dd_path: lh_antennas/antenna/power_reflected
    status: composed
- name: resistance_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Resistive component of the RF loading impedance of an ion cyclotron
    heating antenna module, setting how much power is transferred from the transmission
    line into the plasma.
  documentation: "The coupling resistance $R_c$ is the real part of the complex RF\
    \ loading impedance $Z = R_c + jX$ presented by the antenna module to the transmission\
    \ line, where $X$ is the antenna reactance. It captures both the radiation resistance\
    \ \u2014 power radiated into plasma ion cyclotron waves \u2014 and ohmic losses\
    \ in the antenna conductors themselves.\n\nThe RF power $P$ launched from the\
    \ antenna into the plasma is given by:\n\n$$\nP = \\frac{1}{2} R_c \\, |I_0|^2\n\
    $$\n\nwhere $I_0$ is the peak current amplitude on the antenna strap. This relation\
    \ makes $R_c$ the central efficiency parameter linking the [antenna current amplitude]\
    \ to the coupled RF power.\n\nThe coupling resistance is determined from transmission-line\
    \ measurements at the antenna port by extracting the real part of the load impedance\
    \ from the complex reflection coefficient or from simultaneous forward and reflected\
    \ power and phase measurements. Its value increases with plasma density and decreasing\
    \ antenna\u2013plasma gap, and depends on the [operating frequency](name:frequency_of_ion_cyclotron_heating_antenna)\
    \ and strap geometry.\n\nIn tokamak ICRH systems, values range from approximately\
    \ 0.5 to 10 ohm depending on plasma conditions, scrape-off layer density, and\
    \ antenna proximity. Together with the [capacitance_of_ion_cyclotron_heating_antenna](name:capacitance_of_ion_cyclotron_heating_antenna),\
    \ it determines the reactive matching condition of the antenna circuit and sets\
    \ the effective loaded quality factor."
  unit: ohm
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_ion_cyclotron_heating_antenna
  - name:capacitance_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:ic_antennas/antenna/module/coupling_resistance
    dd_path: ic_antennas/antenna/module/coupling_resistance
    status: composed
- name: thermal_electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the bulk thermal electron population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal electron power at an inside flux surface quantifies the
    total rate at which coherent wave energy is absorbed by the bulk (Maxwellian)
    thermal electron population within the plasma volume bounded by a given flux surface.
    It represents the radially cumulative wave deposition profile for the thermal
    electron channel, complementing the fast-electron contribution [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface)
    to form the total [electron_power_at_inside_flux_surface](name:electron_power_at_inside_flux_surface).


    The quantity is obtained by integrating the flux-surface-averaged [thermal_electron_power_density](name:thermal_electron_power_density)
    $p_{\mathrm{th,e}}$ over the enclosed plasma volume:


    $$

    P_{\mathrm{th,e}}(\rho) = \int_0^\rho p_{\mathrm{th,e}}(\rho'') \frac{dV}{d\rho''}
    \, d\rho''

    $$


    where $\rho$ labels the flux surface and $dV/d\rho''$ is the differential volume
    element per unit radial coordinate.


    This profile is computed by RF wave propagation and absorption solvers; the value
    at the outermost closed flux surface gives the total wave power absorbed by thermal
    electrons. The analogous quantity for thermal ions is [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface),
    and the charge-state-resolved thermal ion analog is [thermal_ion_state_power_at_inside_flux_surface](name:thermal_ion_state_power_at_inside_flux_surface).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
  - name:electron_power_at_inside_flux_surface
  - name:thermal_electron_power_density
  - name:thermal_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  arguments:
  - name: electron_power_at_inside_flux_surface
    operator: thermal
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    status: composed
- name: thermal_ion_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the thermal ion population within
    the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal ion power at an inside flux surface is the cumulative rate
    at which wave energy is deposited in the bulk ion population inside the volume
    enclosed by that magnetic flux surface. It represents thermal-ion heating integrated
    from the magnetic axis to the chosen surface and excludes direct deposition to
    electrons and fast ions.


    The cumulative power for a flux surface labeled by the dimensionless radial coordinate
    $\rho$ in a flux coordinate system $(\rho,\theta,\phi)$ is defined from the local
    thermal-ion wave-power density:


    $$

    P_{\mathrm{th\,ion}}(\rho) = \int_{V(\rho)} p_{\mathrm{th\,ion}} \, dV''

    $$


    where $V(\rho)$ is the plasma volume enclosed by the flux surface, $p_{\mathrm{th\,ion}}$
    is the local net wave-power density for thermal ions in W m^-3, $dV''$ is a volume
    element in m^3, and $P_{\mathrm{th\,ion}}$ is the cumulative power.


    In practice this quantity is computed by integrating wave-power deposition densities
    from wave propagation and wave-particle absorption modeling over the reconstructed
    plasma volume. Experimental constraints include injected wave power, coupling
    losses, ion temperature evolution, species composition, and other heating and
    transport terms needed to separate thermal-ion absorption from electron or fast-ion
    channels.


    Typical values are near 0 W at the magnetic axis and increase toward the total
    thermal-ion absorbed wave power at the plasma boundary. Medium-size tokamak discharges
    commonly have 10^4-10^6 W, while high-power wave-heating scenarios in large devices
    can reach 10^6-2 x 10^7 W within the outer flux surfaces.


    Sign convention: Positive when wave energy is transferred to the thermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_power
  - name:thermal_electron_power_at_inside_flux_surface
  arguments:
  - name: ion_power_at_inside_flux_surface
    operator: thermal
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    status: composed
- name: thermal_ion_state_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative radio-frequency wave power absorbed by a specified thermal
    ion charge state inside the plasma volume enclosed by a selected magnetic flux
    surface. It is the volume integral of the charge-state-resolved absorbed power
    density.
  documentation: 'Thermal ion state power at an inside flux surface is the cumulative
    radio-frequency wave power transferred to one specified thermal ion species and
    charge state within the volume bounded by that magnetic flux surface. It is the
    charge-state-resolved contribution to cumulative thermal-ion RF absorption.


    The cumulative absorbed power for charge state $z$ of ion species $s$ inside the
    flux surface labeled by $\rho$ is defined by the volume integral of the local
    absorbed power density:


    $$

    P_{\mathrm{th},s,z}(\rho) = \int_{V(\rho)} p_{\mathrm{th},s,z}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{th},s,z}$ is in W, $p_{\mathrm{th},s,z}$ is the local RF power
    density transferred to that thermal ion charge state in W m$^{-3}$, $dV$ is the
    differential volume element in m$^3$, and $V(\rho)$ is the plasma volume enclosed
    by the magnetic flux surface labeled by the dimensionless normalized flux-surface
    coordinate $\rho$.


    In practice this quantity is computed from wave propagation and wave-particle
    interaction models by integrating the charge-state-resolved absorption over nested
    equilibrium volumes. Summing over all relevant charge states and all thermal ion
    species gives the total cumulative RF power absorbed by thermal ions inside the
    same flux surface; summing over charge states for only one species gives the species-resolved
    contribution.


    Typical values for an individual thermal ion charge state range from near 0 W
    for weakly absorbing states to 10^5-10^7 W when the state is a dominant RF absorber.
    The value depends on coupled RF power, resonance location, ion composition, charge-state
    population, temperature, density, and the chosen flux surface.


    Sign convention: Positive when net RF energy is transferred from the wave field
    to the specified thermal ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_state_power_density
  arguments:
  - name: ion_state_power_at_inside_flux_surface
    operator: thermal
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    status: composed
- name: thickness_of_antenna_strap
  kind: scalar
  status: draft
  description: Thickness of an ICRH antenna strap is the full, non-negative depth
    of the strap conductor cross-section, measured along the local normal to its broad
    plasma-facing surface. It is a length distinct from the in-plane strap width,
    height, or length.
  documentation: 'Thickness of an ICRH antenna strap is the geometric extent of the
    strap conductor in the direction normal to its broad plasma-facing surface. It
    is a full separation distance across the conductor cross-section, so it is non-negative
    and is not an oriented displacement.


    For a conductor cross-section $C$ and a dimensionless unit normal vector $\hat{\mathbf{n}}$
    to the broad plasma-facing surface, the thickness $t$ may be defined by the range
    of projected positions:


    $$

    t = \max_{\mathbf{r}\in C}\left(\mathbf{r}\cdot\hat{\mathbf{n}}\right) - \min_{\mathbf{r}\in
    C}\left(\mathbf{r}\cdot\hat{\mathbf{n}}\right)

    $$


    where $\mathbf{r}$ is a position vector with components of length, so each projection
    $\mathbf{r}\cdot\hat{\mathbf{n}}$ has units of meters. This definition is independent
    of the arbitrary origin used for $\mathbf{r}$ and returns the complete non-negative
    depth of the conductor along the local normal direction.


    In antenna geometry models, the thickness is taken from the physical strap design
    or from a simplified cross-section used for electromagnetic and engineering calculations.
    It helps determine conductor volume, surface placement, self-inductance, resistance,
    thermal capacity, and the geometric clearance between the strap and neighboring
    antenna structures. It complements in-plane dimensions such as [width_of_antenna_strap](name:width_of_antenna_strap),
    [height_of_antenna_strap](name:height_of_antenna_strap), and [length_of_antenna_strap](name:length_of_antenna_strap).


    For order-of-magnitude checks, ICRH strap thicknesses are usually millimeter-to-centimeter
    engineering dimensions, roughly 0.001-0.1 m, but the appropriate value is design-specific
    and the standard name imposes no universal numerical bounds.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:height_of_antenna_strap
  - name:length_of_antenna_strap
  sources:
