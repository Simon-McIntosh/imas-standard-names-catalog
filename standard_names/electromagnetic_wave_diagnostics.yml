  - name:temperature_at_magnetic_axis
  arguments:
  - name: temperature_at_magnetic_axis
    operator: radiative
    operator_kind: qualifier
- name: wave_electric_field
  kind: vector
  status: draft
  description: Complex vector phasor of the electric field of an electromagnetic wave
    propagating in a magnetized plasma. It encodes the local field amplitude, phase,
    and polarization state from which the real time-dependent electric field is recovered.
  documentation: 'The wave electric field $\mathbf{E}_w$ is the complex vector phasor
    representing the electric oscillation of an electromagnetic wave in a magnetized
    plasma. It contains the relative amplitudes and phases of the vector components,
    so it determines whether the wave is linearly, elliptically, or circularly polarized
    and how much field is parallel or perpendicular to the background magnetic field.


    Using the negative-time-harmonic phasor convention, in which the physical field
    is obtained by multiplying the phasor by $\exp(-i\omega t)$ and taking the real
    part, a homogeneous cold-plasma normal mode satisfies:


    $$

    \left[n^2\left(\hat{\mathbf{k}}\hat{\mathbf{k}}-\mathbf{I}\right)+\boldsymbol{\epsilon}(\omega,\mathbf{B}_0)\right]\cdot\mathbf{E}_w=\mathbf{0}

    $$


    where $\mathbf{E}_w$ has units V m^-1, $n=c|\mathbf{k}|/\omega$ is the dimensionless
    [refractive index](name:refractive_index), $c$ is the speed of light in vacuum
    in m s^-1, $\mathbf{k}=|\mathbf{k}|\hat{\mathbf{k}}$ is the wave vector in m^-1,
    $\omega$ is the angular frequency in rad s^-1, $\mathbf{I}$ is the identity tensor,
    $\boldsymbol{\epsilon}$ is the dimensionless plasma dielectric tensor, and $\mathbf{B}_0$
    is the background magnetic field in T. Nonzero solutions determine the allowed
    dispersion and polarization.


    Components of $\mathbf{E}_w$ must be interpreted with the basis used for the vector.
    In a right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis the components
    are projections on $\hat{x}$, $\hat{y}$, and $\hat{z}$; in a right-handed field-aligned
    $(\hat{e}_1, \hat{e}_2, \hat{b}_0)$ basis, where $\hat{b}_0=\mathbf{B}_0/|\mathbf{B}_0|$
    and $\hat{e}_1\times\hat{e}_2=\hat{b}_0$, the parallel projection gives the complex
    quantity whose parts are represented by [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).
    The transverse projections may be combined as $E_\pm=(\mathbf{E}_w\cdot\hat{e}_1\pm
    i\mathbf{E}_w\cdot\hat{e}_2)/\sqrt{2}$; these circular components are related
    to [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude)
    and [right_hand_circularly_polarized_wave_electric_field](name:right_hand_circularly_polarized_wave_electric_field).


    Wave electric fields are usually computed from antenna launching models, cold-
    or hot-plasma full-wave calculations, ray tracing with polarization evolution,
    or local dispersion calculations normalized to launched power. Measurements infer
    them indirectly from calibrated edge probes, microwave polarimetry, reflectometry,
    scattering, or absorbed-power and current-drive constraints; phase and polarization
    are often determined more robustly than absolute local amplitude.


    Typical phasor magnitudes are strongly power-normalization dependent. Weak probing
    waves can be 10^-1-10^2 V m^-1, while RF and microwave heating or current-drive
    fields are often 10^3-10^5 V m^-1 for local power fluxes of about 0.01-10 MW m^-2;
    evanescent layers, resonances, and near-antenna regions can fall outside these
    ranges.


    Sign convention: Positive when a real component of $\mathbf{E}_w$ points along
    the corresponding positive basis vector, such as $+\hat{x}$, $+\hat{y}$, or $+\hat{z}$
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electric_field
  - name:parallel_wave_electric_field_real_part
  - name:parallel_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:perpendicular_refractive_index
  - name:parallel_refractive_index
  arguments:
  - name: electric_field
    operator: wave
    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Complex phasor of the left-hand circularly polarized component of the
    wave electric field along a beam-tracing path. It is the E+ projection in the
    local transverse basis (x, y, b), with x cross y in the b direction and b parallel
    to the local background magnetic field.
  documentation: 'The left-hand circularly polarized wave electric field, $E_+$, is
    the complex phasor obtained by projecting the transverse wave electric-field vector
    onto the circular polarization that follows positive-ion gyration about the local
    background magnetic field. It represents the rotating electric-field component
    relevant for ion-cyclotron resonant coupling, while actual damping and species
    heating also depend on resonance location, wave frequency, composition, and the
    plasma dielectric response.


    In the local orthonormal triad $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$,
    $\hat{x}\perp\hat{b}$, $\hat{y}\perp\hat{b}$, and $\hat{x}\times\hat{y}=\hat{b}$,
    the phasor is defined by


    $$

    E_+ = \frac{E_x + iE_y}{\sqrt{2}}

    $$


    where $E_x$ and $E_y$ are the complex phasor components of the transverse wave
    electric field along $\hat{x}$ and $\hat{y}$, $i$ is the imaginary unit, and $E_+$,
    $E_x$, and $E_y$ have unit $\mathrm{V\,m^{-1}}$. The physical time-dependent field
    is recovered with the convention $\operatorname{Re}[(E_x\hat{x}+E_y\hat{y})\exp(-i\omega
    t)]$, where $\omega$ is the wave angular frequency. With the complementary right-hand
    component $E_-=(E_x-iE_y)/\sqrt{2}$, the transverse phasor is reconstructed as
    $E_x=(E_+ + E_-)/\sqrt{2}$ and $E_y=-i(E_+ - E_-)/\sqrt{2}$; the real and imaginary
    quadratures are [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    and left_hand_circularly_polarized_wave_electric_field_imaginary_part, and the
    envelope is [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude).


    Along a beam-tracing ray, $E_+$ is computed by solving the wave propagation equations
    using the cold- or warm-plasma dielectric response, expressing the resulting [wave_electric_field](name:wave_electric_field)
    in the local basis $(\hat{x}, \hat{y}, \hat{b})$, and applying the circular-polarization
    projection. It is usually a derived complex quantity rather than a directly measured
    observable; boundary conditions may come from antenna, launcher, or polarization-sensitive
    diagnostic information.


    Typical magnitudes depend strongly on launched power, focusing, absorption, and
    normalization, but values of about $10^1$-$10^5\ \mathrm{V\,m^{-1}}$ are common
    in radio-frequency wave-heating calculations. The ratio $|E_+|/|E_-|$ and the
    relative phase between the two circular components characterize the polarization
    ellipticity and influence resonant absorption, but they do not by themselves determine
    preferential ion-species heating.


    Sign convention: Positive when the real amplitude of a purely left-hand, zero-phase
    phasor makes the physical electric field point along $+\hat{x}$ at $t=0$ and rotate
    from $+\hat{x}$ toward $-\hat{y}$ about $+\hat{b}$ in the local orthonormal basis
    $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{x}\times\hat{y}=\hat{b}$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field_real_part
  kind: complex
  status: draft
  description: Real part of the E+ left-hand circular wave electric-field projection
    onto the polarization basis perpendicular to the local magnetic field along a
    beam-tracing ray path. It is a signed phasor component; together with the E- and
    parallel components it determines local wave polarization and coupling, not the
    field modulus.
  documentation: 'The left-hand circularly polarized wave electric-field real part
    is the in-phase component of the complex scalar coefficient $E_+$ obtained by
    projecting the wave electric-field phasor onto the normalized left-hand circular
    basis perpendicular to the local background magnetic field. It describes phase
    and polarization state, so it can be positive, negative, or zero and should not
    be confused with the non-negative modulus $|E_+|$.


    Let $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$ be the local magnetic-field
    direction and choose an orthonormal transverse triad $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{b}})$
    with $\hat{\mathbf{e}}_1\times\hat{\mathbf{e}}_2=\hat{\mathbf{b}}$. With the phasor
    convention $\mathbf{E}(\mathbf{r},t)=\operatorname{Re}[\tilde{\mathbf{E}}(\mathbf{r})\exp(-i\omega
    t)]$ and $\hat{\mathbf{e}}_+=(\hat{\mathbf{e}}_1+i\hat{\mathbf{e}}_2)/\sqrt{2}$,
    this quantity is defined by


    $$

    E_{+,\mathrm{re}} = \operatorname{Re}\!\left[\hat{\mathbf{e}}_+^{\,*}\cdot\tilde{\mathbf{E}}\right]

    $$


    where $\tilde{\mathbf{E}}$ is the complex electric-field phasor, the star denotes
    complex conjugation in the Hermitian projection, and $E_{+,\mathrm{re}}$ has the
    electric-field unit $\mathrm{V\,m^{-1}}$. The companion coefficient $E_-$ uses
    $\hat{\mathbf{e}}_-=(\hat{\mathbf{e}}_1-i\hat{\mathbf{e}}_2)/\sqrt{2}$ for the
    opposite circular polarization.


    In beam-tracing and ray-tracing calculations, the local wave polarization is propagated
    along the ray and then decomposed into left-hand circular, right-hand circular,
    and parallel components with respect to $\hat{\mathbf{b}}$. The complete local
    phasor in this basis is reconstructed as $\tilde{\mathbf{E}}=E_+\hat{\mathbf{e}}_+
    + E_-\hat{\mathbf{e}}_- + E_\parallel\hat{\mathbf{b}}$, using the real and imaginary
    parts of $E_+$, $E_-$, and $E_\parallel$; relevant sibling quantities include
    left_hand_circularly_polarized_wave_electric_field_imaginary_part, [right_hand_circularly_polarized_wave_electric_field_real_part](name:right_hand_circularly_polarized_wave_electric_field_real_part),
    and [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part).


    Absolute numerical values are normalization-dependent because a phasor may be
    scaled to launched power, unit power, or a local eigenvector normalization. In
    a fixed SI normalization, $E_{+,\mathrm{re}}$ lies between $-|E_+|$ and $+|E_+|$
    in $\mathrm{V\,m^{-1}}$; values near zero indicate either weak left-hand circular
    content or a quadrature phase relative to the chosen phasor reference, while values
    comparable to $|E_+|$ indicate an almost purely in-phase left-hand component.


    Sign convention: Positive when the reference-phase left-hand circularly polarized
    phasor corresponds, for $E_-=E_\parallel=0$, to an electric field pointing along
    $+\hat{\mathbf{e}}_1$ while subsequently rotating toward $+\hat{\mathbf{e}}_2$
    about $+\hat{\mathbf{b}}$ under the $\exp(-i\omega t)$ time dependence.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:parallel_wave_electric_field_real_part
  arguments:
  - name: left_hand_circularly_polarized_wave_electric_field
    operator: real_part
    operator_kind: unary_postfix
- name: parallel_wave_electric_field
  kind: scalar
  status: draft
  description: Complex scalar phasor of the oscillatory (time-harmonic) wave electric
    field projected onto the local equilibrium magnetic-field direction. Its modulus
    gives the magnitude of the parallel component and its argument gives the phase
    relative to the chosen time convention.
  documentation: 'The parallel wave electric field is the component of a time-harmonic
    wave electric-field phasor resolved along the local equilibrium magnetic-field
    direction. As a complex scalar it carries both the magnitude and the phase of
    the parallel oscillation: its modulus is the parallel phasor magnitude and its
    argument is the phase relative to a fixed time-harmonic reference.


    The projection is defined by


    $$

    E_{\parallel} = \hat{b} \cdot \tilde{\mathbf{E}}

    $$


    where $\tilde{\mathbf{E}}$ is the complex wave electric-field phasor in $\mathrm{V\,m^{-1}}$
    and $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$ is the dimensionless unit vector along
    the local equilibrium magnetic field $\mathbf{B}_0$. The complex phasor is reconstructed
    from its in-phase and quadrature parts as $E_{\parallel} = \mathrm{Re}[E_{\parallel}]
    + i\,\mathrm{Im}[E_{\parallel}]$, held respectively by [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).
    If the physical field is written as $\mathrm{Re}[\tilde{\mathbf{E}}\exp(-i\omega
    t)]$, the real and imaginary parts are the in-phase and quadrature amplitudes;
    adopting the opposite time convention complex-conjugates the phasor describing
    the same physical field.


    In practice $E_{\parallel}$ is obtained by projecting a measured, reconstructed,
    or beam/ray-traced complex wave electric field onto the local magnetic-field direction.
    It vanishes only where the electric-field phasor is exactly orthogonal to $\hat{b}$;
    a wave vector perpendicular to $\mathbf{B}_0$ does not by itself force $E_{\parallel}=0$,
    because the wave polarization can still retain a field component along the magnetic
    field.


    Magnitudes span a very wide range that depends strongly on wave frequency, launched
    power, coupling efficiency, and plasma location: weak diagnostic or probing fields
    are small, while radio-frequency heating and current-drive fields can be locally
    much larger. Quantitative values should be taken from the specific scenario rather
    than assumed.


    Sign convention: Positive when the in-phase component of the wave electric-field
    phasor points along the local equilibrium magnetic-field unit vector $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_wave_electric_field_real_part
  - name:parallel_wave_electric_field_imaginary_part
  - name:parallel_refractive_index
  - name:parallel_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_wave_electric_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary quadrature coefficient of the complex wave electric field
    projected along the local equilibrium magnetic-field direction for a beam or ray
    path. It is the quadrature counterpart of parallel_wave_electric_field_real_part
    and, with that real part, determines the complex parallel field amplitude and
    phase; it is not the field magnitude.
  documentation: 'The imaginary part of the parallel wave electric field is the quadrature
    coefficient of a monochromatic complex electric-field phasor after projection
    onto the direction of the local equilibrium magnetic field. It is one scalar component
    of the complex parallel polarization; together with the [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    it determines the phase and the [parallel_wave_electric_field_amplitude](name:parallel_wave_electric_field_amplitude),
    but it is not itself the magnitude.


    Using a phasor convention with time dependence $\exp(-i\omega t)$, the complex
    parallel electric field is decomposed as


    $$

    \tilde{E}_\parallel = \tilde{\mathbf{E}}\cdot\hat{\mathbf{b}} = E_{\parallel,\mathrm{r}}
    + i E_{\parallel,\mathrm{i}}, \qquad \mathbf{E}(t)=\operatorname{Re}\!\left[\tilde{\mathbf{E}}e^{-i\omega
    t}\right]

    $$


    where $\tilde{\mathbf{E}}$ is the complex wave electric-field phasor, $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$
    is the unit vector along the local equilibrium magnetic field $\mathbf{B}_0$,
    $\omega$ is the angular frequency, $i$ is the imaginary unit, $E_{\parallel,\mathrm{r}}$
    is the real parallel coefficient, and $E_{\parallel,\mathrm{i}}$ is this quantity.
    Both scalar coefficients have units of V m$^{-1}$.


    In practice this quantity is obtained from wave-propagation, beam-tracing, ray-tracing,
    or full-wave polarization calculations by projecting the computed complex electric-field
    phasor onto $\hat{\mathbf{b}}$ along the propagation trajectory. It is used with
    the real parallel coefficient to reconstruct the complex longitudinal polarization;
    analogous transverse quadrature coefficients include the [left-hand] and [right-hand](name:right_hand_circularly_polarized_wave_electric_field_imaginary_part)
    circularly polarized wave electric-field imaginary parts, whose corresponding
    real parts are also required to reconstruct the full complex circular-basis polarization.


    There is no universal numerical range independent of wave normalization, launch
    power, propagation model, and absorption. For a specified parallel amplitude $A_\parallel$,
    the physically allowed range is $-A_\parallel$ to $+A_\parallel$ in V m$^{-1}$;
    values are near zero when the chosen phasor phase makes the parallel component
    nearly real, and the parallel component is often small for nearly transverse electromagnetic
    propagation.


    Sign convention: Positive when $\operatorname{Im}(\tilde{\mathbf{E}}\cdot\hat{\mathbf{b}})>0$
    for $\hat{\mathbf{b}}$ directed along the local equilibrium magnetic field and
    the phasor time dependence $\mathbf{E}(t)=\operatorname{Re}[\tilde{\mathbf{E}}e^{-i\omega
    t}]$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_wave_electric_field_real_part
  - name:parallel_wave_electric_field_amplitude
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  arguments:
  - name: parallel_wave_electric_field
    operator: imaginary_part
    operator_kind: unary_postfix
- name: parallel_wave_electric_field_real_part
  kind: complex
  status: draft
  description: Real, in-phase coefficient of the complex wave electric-field phasor
    projected along the local equilibrium magnetic-field direction. Together with
    the imaginary part, it specifies the signed parallel polarization relevant to
    resonant wave-particle interactions.
  documentation: 'The real part of the parallel wave electric field is the in-phase
    scalar component of a complex wave electric-field phasor along the local equilibrium
    magnetic field. It is one quadrature of the complex parallel field; the complementary
    quadrature is [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).


    The scalar phasor component is defined by projecting the complex wave electric-field
    phasor onto the unit vector along the equilibrium magnetic field:


    $$

    E_{\parallel,r} = \operatorname{Re}\!\left(\mathbf{E}_w \cdot \hat{\mathbf{b}}\right),\qquad
    \hat{\mathbf{b}} = \frac{\mathbf{B}_0}{|\mathbf{B}_0|}

    $$


    where $E_{\parallel,r}$ is this quantity, $\mathbf{E}_w$ is the complex wave electric-field
    phasor, $\mathbf{B}_0$ is the equilibrium magnetic field, and all electric-field
    quantities are measured in V m$^{-1}$. The full complex scalar is $E_\parallel
    = E_{\parallel,r} + iE_{\parallel,i}$, where $E_{\parallel,i}$ is the companion
    imaginary part. The associated real time-domain field is interpreted as $\operatorname{Re}\{E_\parallel
    e^{-i\omega t}\}$, so $E_{\parallel,r}$ is the component in phase with the selected
    phasor reference.


    This quantity is computed in wave, ray, or beam-tracing calculations from the
    local complex polarization state and the equilibrium magnetic-field direction.
    It is physically important because parallel electric fields couple directly to
    charged-particle motion along magnetic field lines, contributing to resonant energy
    exchange such as Landau damping and current drive; it should therefore be interpreted
    together with the companion imaginary part and with transverse polarization components
    such as [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    and [right_hand_circularly_polarized_wave_electric_field_real_part](name:right_hand_circularly_polarized_wave_electric_field_real_part).


    Typical magnitudes are normalization-dependent because the absolute phasor scale
    is set by the chosen wave-power or field-amplitude normalization. Relative to
    the local total wave-field amplitude $|\mathbf{E}_w|$, the signed real part is
    bounded between $-|\mathbf{E}_w|$ and $+|\mathbf{E}_w|$; it is often small for
    predominantly transverse electromagnetic polarization and can become comparable
    to $|\mathbf{E}_w|$ for waves with strong longitudinal or electrostatic character.
    For a reference normalization $|\mathbf{E}_w|=1$ V m$^{-1}$, the corresponding
    signed range is from $-1$ to $+1$ V m$^{-1}$.


    Sign convention: Positive when the in-phase vector component represented by $E_{\parallel,r}$
    points along $\hat{\mathbf{b}}=\mathbf{B}_0/|\mathbf{B}_0|$ rather than opposite
    to the equilibrium magnetic-field direction, with the phasor decomposition $E_\parallel=E_{\parallel,r}+iE_{\parallel,i}$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  arguments:
  - name: parallel_wave_electric_field
    operator: real_part
    operator_kind: unary_postfix
- name: right_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Complex phasor of the right-hand circularly polarized (E-minus) component
    of the wave electric field, projected onto the circular polarization basis constructed
    from the transverse plane perpendicular to the local equilibrium magnetic field.
  documentation: 'The right-hand circularly polarized wave electric field is the E-minus
    component of the transverse wave electric field in a magnetized plasma, obtained
    by projecting the full [wave electric field](name:left_hand_circularly_polarized_wave_electric_field)
    phasor onto the right-hand circular polarization basis. In the local orthonormal
    frame $(\hat{x}, \hat{y}, \hat{b})$, where $\hat{b}$ is the unit vector along
    the equilibrium magnetic field and $\hat{x} \times \hat{y} = \hat{b}$, the component
    is defined as


    $$

    E_- = \frac{E_x - i E_y}{\sqrt{2}}

    $$


    where $E_x$ and $E_y$ are the complex transverse Cartesian components of the wave
    electric field phasor.


    The full complex phasor encodes both amplitude and phase. Its real and imaginary
    quadrature components are individually given by [right_hand_circularly_polarized_wave_electric_field_real_part](name:right_hand_circularly_polarized_wave_electric_field_real_part)
    and [right_hand_circularly_polarized_wave_electric_field_imaginary_part](name:right_hand_circularly_polarized_wave_electric_field_imaginary_part),
    while the nonnegative modulus $|E_-|$ is provided by right_hand_circularly_polarized_wave_electric_field_amplitude.
    The complementary left-hand circular component (E+) is documented under [left_hand_circularly_polarized_wave_electric_field](name:left_hand_circularly_polarized_wave_electric_field).
    In ion-cyclotron-range-of-frequencies heating, the relative magnitude of $E_-$
    characterizes the right-hand polarization fraction of the wave and governs coupling
    to electron-cyclotron and right-hand-cutoff resonances along the wave propagation
    path.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:left_hand_circularly_polarized_wave_electric_field
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  arguments:
  - name: wave_electric_field
    operator: right_hand_circularly_polarized
    operator_kind: qualifier
- name: right_hand_circularly_polarized_wave_electric_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the right-hand circularly polarized wave electric-field
    phasor. It is the quadrature component of the E-minus polarization and, together
    with the real part, determines the amplitude and phase of that complex field component.
  documentation: 'The imaginary part of the right-hand circularly polarized wave electric
    field is the quadrature coefficient of the complex scalar phasor for the E-minus
    polarization component. This component describes the part of the transverse wave
    electric field that has right-hand circular polarization about the local background
    magnetic-field direction $\hat{b}$. It is meaningful only together with the corresponding
    [real part](name:right_hand_circularly_polarized_wave_electric_field_real_part),
    because the two components jointly specify the complex phase.


    The right-hand circular component is defined by projecting the complex wave electric-field
    phasor onto the right-hand circular polarization basis:


    $$

    E_-(s) = \mathbf{e}_-^*(s) \cdot \tilde{\mathbf{E}}(s) = E_{-,r}(s) + i\,E_{-,i}(s)

    $$


    where $s$ is distance along the ray or beam path, $\tilde{\mathbf{E}}$ is the
    complex wave electric-field phasor, $\mathbf{e}_-$ is the right-hand circular
    polarization unit vector about $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$, the superscript
    $*$ denotes complex conjugation, $E_{-,r}$ is the real part, $E_{-,i}$ is this
    imaginary part, and $i$ is the imaginary unit. The phasor is interpreted with
    the harmonic time dependence $\operatorname{Re}[\tilde{\mathbf{E}}\exp(-i\omega
    t)]$; no particular spatial phase factor along the ray is required by this definition.
    The electric-field unit is volts per meter, equivalently $\mathrm{V\,m^{-1}}$
    or $\mathrm{m^{-1}\,V}$.


    In electromagnetic wave and beam-tracing calculations, the full wave field is
    commonly decomposed into right-hand circular, left-hand circular, and field-aligned
    polarization components relative to $\hat{b}$. This quantity is computed from
    the complex field solution by applying the circular-basis projection at each point
    of interest, and it is used with [right_hand_circularly_polarized_wave_electric_field](name:right_hand_circularly_polarized_wave_electric_field),
    left_hand_circularly_polarized_wave_electric_field_imaginary_part, and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part)
    to characterize the polarization state relevant to wave-plasma coupling.


    No universal absolute range applies, because the value scales with wave power,
    focusing, propagation normalization, and the chosen phase reference. It may be
    zero when the E-minus component is purely real or absent, and otherwise its magnitude
    can be comparable to the [right-hand circularly polarized wave electric-field
    amplitude]; the amplitude and phase are obtained from the real and imaginary parts
    through $|E_-|=\sqrt{E_{-,r}^2+E_{-,i}^2}$ and $\arg(E_-)=\operatorname{atan2}(E_{-,i},E_{-,r})$.


    Sign convention: Positive when $E_{-,i}$ is the positive $+i$ quadrature coefficient
    in $E_- = E_{-,r} + iE_{-,i}$ for the right-hand circular polarization basis about
    $\hat{b}$ with physical time dependence $\operatorname{Re}[\tilde{\mathbf{E}}\exp(-i\omega
    t)]$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field
  - name:parallel_wave_electric_field_imaginary_part
  arguments:
  - name: right_hand_circularly_polarized_wave_electric_field
    operator: imaginary_part
    operator_kind: unary_postfix
- name: right_hand_circularly_polarized_wave_electric_field_real_part
  kind: complex
  status: draft
  description: Real, in-phase component of the complex right-hand circularly polarized
    electric-field phasor of an electromagnetic wave. Together with the imaginary
    component, it specifies the phase and amplitude of the E-minus polarization that
    couples to the right-hand wave branch in a magnetized plasma.
  documentation: 'The real part of the right-hand circularly polarized wave electric
    field is the in-phase quadrature of the complex $E^-$ phasor. $E^-$ is the component
    of the transverse electric-field phasor that rotates in the electron-cyclotron
    sense about the local equilibrium magnetic-field direction and couples to the
    right-hand electromagnetic wave branch in a magnetized plasma.


    With the physical field represented as $\mathrm{Re}[\tilde{\mathbf E}\exp(-i\omega
    t)]$, and using a local right-handed orthonormal polarization basis $(\hat{\mathbf
    e}_1,\hat{\mathbf e}_2,\hat{\mathbf b})$ with $\hat{\mathbf e}_1\times\hat{\mathbf
    e}_2=\hat{\mathbf b}$ and $\hat{\mathbf b}$ along the local equilibrium magnetic
    field, the right-hand circular component is defined by:


    $$

    E^- = \tilde{\mathbf E}_\perp \cdot \hat{\mathbf e}_-^{*} = E^-_\mathrm{R} + i
    E^-_\mathrm{I}, \qquad \hat{\mathbf e}_- = \frac{\hat{\mathbf e}_1 - i\hat{\mathbf
    e}_2}{\sqrt{2}}

    $$


    where $\tilde{\mathbf E}_\perp$ is the transverse electric-field phasor, $\hat{\mathbf
    e}_-^{*}$ is the complex-conjugate projection vector, $E^-_\mathrm{R}$ is this
    real part, and $E^-_\mathrm{I}$ is the quadrature component [right_hand_circularly_polarized_wave_electric_field_imaginary_part](name:right_hand_circularly_polarized_wave_electric_field_imaginary_part).
    All electric-field quantities in this relation are in $\mathrm{V\,m^{-1}}$. The
    corresponding right_hand_circularly_polarized_wave_electric_field_amplitude is
    $|E^-|=\sqrt{(E^-_\mathrm{R})^2+(E^-_\mathrm{I})^2}$, and the phase is determined
    by the two quadratures.


    This quantity is computed by decomposing a complex wave electric-field solution
    from full-wave, ray-tracing, or beam-tracing analysis into circular polarization
    components. Together with the left-hand circular counterpart [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    and the parallel component [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part),
    it characterizes the local polarization state relevant to absorption, emission,
    and mode coupling in magnetized plasmas.


    Typical absolute amplitudes of right-hand circular electric-field components are
    about $10^3$-$10^6\ \mathrm{V\,m^{-1}}$ for externally launched microwave or RF
    heating waves, depending on launched power, focusing, and propagation. The signed
    real part can range from $-|E^-|$ to $+|E^-|$; passive emission calculations or
    normalized polarization calculations may have much smaller absolute scaling while
    retaining the same phase and polarization meaning.


    Sign convention: Positive when the in-phase right-hand circular component gives
    an electric-field contribution along $+\hat{\mathbf e}_1$ at the phasor reference
    phase for the convention $\mathrm{Re}[\tilde{\mathbf E}\exp(-i\omega t)]$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:parallel_wave_electric_field_real_part
  arguments:
  - name: right_hand_circularly_polarized_wave_electric_field
    operator: real_part
    operator_kind: unary_postfix
- name: toroidal_wave_electric_field
  kind: scalar
  status: draft
  description: "Signed toroidal component of the wave electric field at a point, equal\
    \ to the projection of the local wave electric-field vector onto the toroidal\
    \ unit direction in the right-handed cylindrical (R, \u03C6, Z) frame. Its unit\
    \ m^-1.V is equivalent to volts per meter."
  documentation: 'Toroidal wave electric field is the component of an oscillatory
    electric field along the toroidal direction. It describes the signed projection
    of the local wave electric-field vector onto $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The component is defined by projecting the wave electric-field vector onto the
    toroidal unit vector:


    $$

    E_\phi(\mathbf{x}, t) = \mathbf{E}_\mathrm{wave}(\mathbf{x}, t) \cdot \hat{\phi}

    $$


    where $\mathbf{E}_\mathrm{wave}$ is the local wave electric field and $\hat{\phi}$
    points in the direction of increasing toroidal angle. For harmonic waves the same
    projection applies to a phase-referenced phasor or amplitude; the physical dimension
    is volts per meter, written here as m^-1.V.


    In practice this quantity may be obtained from electromagnetic-wave modeling,
    probe measurements where available, or spectroscopic inference of wave-induced
    Stark effects. In polarization-resolved spectroscopy, fits to line positions,
    widths, intensities, and polarization-dependent Stark components can constrain
    the local oscillatory electric-field vector, which is then projected onto $\hat{\phi}$
    using the viewing geometry and magnetic-field geometry.


    Typical radio-frequency or lower-hybrid wave-field amplitudes range from about
    10^2-10^5 m^-1.V in plasma-facing or edge regions, with locally stronger fields
    near launch structures sometimes approaching 10^6 m^-1.V and weaker fields in
    poorly coupled or far-field regions falling below 10^2 m^-1.V.


    Sign convention: Positive when the real toroidal component of the wave electric
    field points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_electric_field
  - name:vertical_wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: vertical_wave_electric_field
  kind: scalar
  status: draft
  description: "Complex phasor component of the electromagnetic-wave electric field\
    \ projected onto the vertical Z direction at the measurement position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame. It represents the signed vertical polarization\
    \ component, not an instantaneous field value."
  documentation: 'The vertical wave electric field $E_Z$ is the complex phasor component
    of an electromagnetic-wave electric-field vector along $\hat{Z}$, the vertical
    basis vector of the right-handed cylindrical $(R, \phi, Z)$ frame. It is a coordinate
    projection, not a separate wave mode; together with [radial_wave_electric_field](name:radial_wave_electric_field)
    and [toroidal_wave_electric_field](name:toroidal_wave_electric_field), it describes
    the polarization of [wave_electric_field](name:wave_electric_field) in that frame.


    The component is defined by the scalar projection of the complex wave electric-field
    phasor onto the vertical basis vector:


    $$

    E_Z = \mathbf{E}_w \cdot \hat{Z}

    $$


    where $\mathbf{E}_w$ is the complex wave electric-field phasor in $\mathrm{V\,m^{-1}}$,
    $\hat{Z}$ is a dimensionless unit vector, and $E_Z$ has units $\mathrm{V\,m^{-1}}$.
    The phasor represents time dependence as $\exp(-i\omega t)$, so the observable
    vertical field is $\operatorname{Re}[E_Z\exp(-i\omega t)]$; the real and imaginary
    parts of $E_Z$ are the in-phase and quadrature vertical components.


    In practice, $E_Z$ is obtained by determining the complex wave electric-field
    vector from diagnostic measurements or electromagnetic-wave modeling and then
    projecting it onto $\hat{Z}$. The definition is independent of wave branch: for
    a lower-hybrid, electron-cyclotron, ion-cyclotron, or other electromagnetic wave,
    it is the vertical component of that same wave phasor. Parallel components such
    as [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    instead project onto the magnetic-field direction, while circularly polarized
    components use a rotating polarization basis.


    No branch-independent absolute range is intrinsic to this component; amplitudes
    depend on launched power, plasma conditions, position, and diagnostic calibration.
    The value may be zero for a purely horizontal electric-field polarization and
    may approach $|\mathbf{E}_w|$ when the wave electric field is predominantly vertical;
    the ratio $|E_Z|/|\mathbf{E}_w|$ lies between 0 and 1 when the orthonormal cylindrical
    components are complete.


    Sign convention: Positive when a real-valued phasor coefficient for this component,
    such as its real or imaginary part, represents an electric-field vector contribution
    in the $+\hat{Z}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_electric_field
  - name:toroidal_wave_electric_field
  - name:wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: wavelength_of_wave_beam
  kind: scalar
  status: draft
  description: Vacuum wavelength of a probing electromagnetic wave beam, the spatial
    period corresponding to one complete cycle of its field phase.
  documentation: 'The wavelength of a wave beam is the vacuum spatial period of the
    probing electromagnetic field along its propagation direction. It refers to the
    incident or launch radiation itself, not to the detection-side spectral coordinate
    used to label measured scattered or emitted light, such as [spectral_wavelength](name:spectral_wavelength_of_optical_element).


    For a monochromatic component in vacuum, the defining relation is


    $$

    \lambda_0 = \frac{c_0}{f}

    $$


    where $\lambda_0$ is the vacuum wavelength in meters, $c_0$ is the speed of light
    in vacuum in meters per second, and $f$ is the wave frequency in hertz ($\mathrm{s}^{-1}$).
    If angular frequency $\omega$ is used, $f = \omega/(2\pi)$.


    In practice, the wavelength is set by the electromagnetic source, for example
    a laser line or microwave oscillator, and may be determined from the source frequency
    or by spectroscopic calibration. For finite-bandwidth or pulsed beams, the quoted
    value is usually the central vacuum wavelength. Plasma propagation changes the
    local wavelength through the refractive index, but this quantity remains the vacuum
    reference wavelength used to specify the launched beam.


    The wavelength enters diagnostic sensitivity and calibration. In cold-plasma interferometry,
    the magnitude of the plasma phase shift relative to vacuum scales as $\lambda_0
    \int n_e\,dl$, linking this quantity to the spectral_calibration_factor_of_interferometer_beam;
    in polarimetry, Faraday rotation scales as $\lambda_0^2 \int n_e B_\parallel\,dl$,
    where $n_e$ is electron number density, $B_\parallel$ is the magnetic-field component
    along the beam path, and $l$ is path length. In Thomson scattering, the probe
    wavelength sets the spectral location of the scattered signal and affects the
    scattering geometry and calibration.


    Typical values are $5.32 \times 10^{-7}$ m and $1.064 \times 10^{-6}$ m for common
    Thomson-scattering lasers, $1.06 \times 10^{-5}$ m for CO2 interferometers, $1
    \times 10^{-4}$-$1 \times 10^{-3}$ m for far-infrared interferometry or polarimetry,
    and $1 \times 10^{-3}$-$1 \times 10^{-2}$ m for millimeter-wave systems.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:spectral_wavelength_of_optical_element
  arguments:
  - name: wavelength
    operator: wave_beam
    operator_kind: locus
