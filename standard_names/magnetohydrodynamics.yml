      kind: llm
- name: perturbed_vacuum_magnetic_field
  kind: vector
  status: active
  description: Complex first-order magnetic-field perturbation vector in the current-free
    vacuum region outside the plasma, forming a single-toroidal-mode eigenfunction
    in linear MHD stability analysis.
  documentation: "The perturbed vacuum magnetic field $\\delta\\mathbf{B}_\\mathrm{vac}$\
    \ is the complex first-order perturbation of the magnetic-field vector in the\
    \ exterior current-free domain surrounding the plasma, arising in linear MHD stability\
    \ analysis when the plasma undergoes a small displacement from equilibrium relative\
    \ to the background [vacuum_magnetic_field](name:vacuum_magnetic_field). In this\
    \ region all plasma currents are absent, so the perturbation obeys the source-free\
    \ Maxwell conditions $\\nabla \\times \\delta\\mathbf{B}_\\mathrm{vac} = 0$ and\
    \ $\\nabla \\cdot \\delta\\mathbf{B}_\\mathrm{vac} = 0$.\n\nBecause the vacuum\
    \ perturbation is curl-free, it derives from a scalar magnetic potential $\\delta\\\
    Phi$:\n\n$$\n\\delta\\mathbf{B}_\\mathrm{vac} = -\\nabla\\delta\\Phi\n$$\n\nwhere\
    \ $\\nabla^2\\delta\\Phi = 0$ in the vacuum domain, expanded for a single toroidal\
    \ harmonic of mode number $n$ (see [toroidal_mhd_mode_number](name:toroidal_mhd_mode_number)).\
    \ The eigenfunction is obtained by matching the normal component of the perturbation\
    \ at the plasma\u2013vacuum interface, with $|\\delta\\mathbf{B}_\\mathrm{vac}|\
    \ \\to 0$ in the far field.\n\nThe full complex vector is resolved in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame into the [radial](name:radial_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_R$, [poloidal](name:poloidal_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_\\theta$, and [toroidal](name:toroidal_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_\\phi$. The complex representation encodes both amplitude\
    \ and spatial phase of the mode; the real and imaginary parts of each component\
    \ form two orthogonal phase quadratures, accessible via quantities such as the\
    \ [real part of the toroidal component](name:toroidal_perturbed_vacuum_magnetic_field_real_part).\n\
    \nSign convention: Positive for each cylindrical component when directed along\
    \ $+R$, $+\\phi$, or $+Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $\\phi$ increases counter-clockwise viewed from above $+\\hat{Z}$."
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:vacuum_magnetic_field
  - name:toroidal_mhd_mode_number
  - name:radial_perturbed_vacuum_magnetic_field
  arguments:
  - name: vacuum_magnetic_field
    operator: perturbed
    operator_kind: qualifier
- name: radial_perturbed_vacuum_magnetic_field
  kind: scalar
  status: active
  description: Complex first-order radial component of the magnetic-field perturbation
    eigenfunction in the current-free vacuum outside the plasma, forming part of a
    single-toroidal-mode linear MHD perturbation.
  documentation: 'The radial component of the perturbed vacuum magnetic field is the
    projection of the complex first-order magnetic-field eigenfunction onto the cylindrical
    radial direction in the current-free exterior region. It is one component of the
    full [perturbed vacuum magnetic field](name:perturbed_vacuum_magnetic_field),
    which satisfies source-free Maxwell conditions in the vacuum.


    The component is defined by


    $$

    \delta B_R = \delta\mathbf{B}_\mathrm{vac} \cdot \hat{R}

    $$


    where $\delta\mathbf{B}_\mathrm{vac}$ is the perturbed vacuum magnetic-field vector,
    $\hat{R}$ is the radial unit vector, and $\delta B_R$ is its radial projection
    in the right-handed cylindrical $(R,\phi,Z)$ frame. The radial direction means
    increasing major radius $R$, not the normal to a magnetic flux surface.


    The complex value retains the eigenfunction amplitude and phase; its in-phase
    and quadrature coefficients are represented by the [real radial component](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and [imaginary radial component](name:radial_perturbed_vacuum_magnetic_field_imaginary_part).
    In the current-free vacuum, the perturbation obeys $\nabla\times\delta\mathbf{B}_\mathrm{vac}=0$
    and $\nabla\cdot\delta\mathbf{B}_\mathrm{vac}=0$.


    Sign convention: Positive when the radial component is directed along increasing
    major radius $R$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_vacuum_magnetic_field
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  arguments:
  - name: perturbed_vacuum_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: active
  description: "Real part of the radial perturbed vacuum magnetic field is the in-phase\
    \ coefficient of the R component in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame for a complex vacuum magnetic-field perturbation eigenfunction of one\
    \ toroidal Fourier harmonic."
  documentation: 'Real part of the radial perturbed vacuum magnetic field is the in-phase
    coefficient of the radial component of a complex magnetic-field perturbation eigenfunction
    in the current-free vacuum region outside the plasma for one toroidal Fourier
    harmonic. Radial means projection onto $\hat R$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height; it is not projection onto the equilibrium flux-surface-normal
    direction.


    For a complex harmonic amplitude $\delta\tilde{\mathbf B}^{\mathrm{vac}}_n(\mathbf{x})$,
    with physical perturbation represented by $\operatorname{Re}\{\delta\tilde{\mathbf
    B}^{\mathrm{vac}}_n(\mathbf{x}) e^{i(n\phi-\omega t)}\}$, this quantity is defined
    by:


    $$

    \delta B^{\mathrm{vac,Re}}_{R,n}(\mathbf{x}) = \operatorname{Re}\!\left[\delta\tilde{\mathbf
    B}^{\mathrm{vac}}_n(\mathbf{x}) \cdot \hat R\right]

    $$


    where $\operatorname{Re}$ denotes real part, $n$ is the toroidal mode number,
    $\omega$ is the angular frequency associated with the chosen complex representation,
    $\mathbf{x}$ is position, and $\hat R$ is the radial basis vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The [imaginary counterpart](name:radial_perturbed_vacuum_magnetic_field_imaginary_part)
    is the quadrature coefficient of the same complex radial component, and the two
    together specify the [complex radial vacuum perturbation amplitude](name:radial_perturbed_vacuum_magnetic_field)
    for the chosen eigenfunction phase. This vacuum-region quantity is distinct from
    the corresponding plasma-region perturbation; a linear eigenfunction amplitude
    is defined only up to an overall complex normalization unless a separate normalization
    condition is imposed.


    Sign convention: Positive when, at Fourier phase $n\phi-\omega t=0$ for the representation
    above, the vacuum magnetic-field perturbation has a component in the $+\hat R$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_vacuum_magnetic_field
  arguments:
  - name: radial_perturbed_vacuum_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-vacuum-b_field_perturbed-coordinate1-real
    dd_documentation:
      leaf: Real part
      parent_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1
      parent: First coordinate (radial)
      data_type: FLT_2D
      unit: T
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/vacuum/grid/dim1
      - mhd_linear/time_slice/toroidal_mode/vacuum/grid/dim2
    enhanced_context:
      description: "Real part of the first coordinate component of the perturbed magnetic\
        \ field (\u03B4B) eigenfunction in the vacuum region, from linear MHD stability\
        \ analysis. Part of the complex representation of the radial magnetic perturbation\
        \ for a given toroidal mode number."
      kind: llm
- name: plasma_magnetic_field
  kind: scalar
  status: active
  description: Magnetic field in the confined plasma interior, generalizing over equilibrium
    and perturbed configurations arising from MHD modes or non-axisymmetric fields,
    and distinct from equivalent field definitions in the surrounding vacuum region.
  documentation: 'The plasma magnetic field designates the magnetic-field vector evaluated
    within the confined plasma volume, where both the equilibrium field from external
    coil systems and plasma-current-driven contributions are present, together with
    first-order departures driven by MHD instabilities or applied non-axisymmetric
    perturbations. This quantity serves as the conceptual parent for field quantities
    that are explicitly localized to the plasma interior, as opposed to vacuum-region
    counterparts that satisfy $\nabla \times \mathbf{B} = 0$.


    In the linearized MHD framework the total field decomposes as


    $$

    \mathbf{B} = \mathbf{B}_0 + \delta\mathbf{B}

    $$


    where $\mathbf{B}_0$ is the axisymmetric equilibrium field and $\delta\mathbf{B}$
    is the first-order perturbation. Inside the plasma, $\delta\mathbf{B}$ couples
    to the perturbed current density $\delta\mathbf{J}$ and pressure gradient through
    the linearized MHD force balance, a physical constraint absent in the vacuum region.


    The concrete vector realization of the first-order plasma-interior perturbation
    is [perturbed_plasma_magnetic_field](name:perturbed_plasma_magnetic_field), which
    carries the eigenfunction field in tesla and is explicitly distinguished from
    perturbation fields defined in the vacuum region. For the scalar amplitude of
    the equilibrium departure without the plasma-interior qualification, the sibling
    quantity perturbed_magnetic_field applies. Measurement of the perturbation field
    inside the plasma relies on Mirnov coil arrays for edge fluctuations, polarimetry
    for line-integrated signals, and MHD eigenfunction reconstruction from equilibrium
    data.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  arguments:
  - name: magnetic_field
    operator: plasma
    operator_kind: qualifier
- name: perturbed_plasma_magnetic_field
  kind: vector
  status: active
  description: Perturbed plasma magnetic field is the complex linear-MHD eigenfunction,
    or corresponding real perturbation, of the magnetic-field deviation carried by
    the confined-plasma response about an equilibrium field. It excludes externally
    imposed vacuum perturbations when those are represented separately.
  documentation: 'Perturbed plasma magnetic field is the complex linear-MHD eigenfunction,
    or corresponding real perturbation, of the magnetic-field deviation carried by
    the confined-plasma response about an equilibrium magnetic field. It represents
    magnetic-field bending and current perturbations inside the confined plasma and
    excludes any externally imposed vacuum perturbation that is retained as a separate
    field.


    The plasma-response perturbation is defined by subtracting the equilibrium field
    and any separately represented vacuum perturbation from the total field in the
    confined plasma region:


    $$

    \delta\mathbf{B}_\mathrm{pl}(\mathbf{x},t) = \mathbf{B}(\mathbf{x},t) - \mathbf{B}_0(\mathbf{x})
    - \delta\mathbf{B}_\mathrm{vac}(\mathbf{x},t)

    $$


    where $\delta\mathbf{B}_\mathrm{pl}$ is this quantity, $\mathbf{x}$ is position,
    $t$ is time, $\mathbf{B}$ is the total magnetic field, $\mathbf{B}_0$ is the equilibrium
    magnetic field, and $\delta\mathbf{B}_\mathrm{vac}$ is the externally imposed
    vacuum magnetic perturbation that would exist without plasma response. If no separate
    vacuum perturbation is present or retained, set $\delta\mathbf{B}_\mathrm{vac}=0$;
    the field satisfies $\nabla\cdot\delta\mathbf{B}_\mathrm{pl}=0$.


    Externally imposed vacuum-field quantities, including [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field),
    [radial_non_axisymmetric_magnetic_field](name:radial_non_axisymmetric_magnetic_field),
    and non_axisymmetric_magnetic_field_at_control_surface, can drive the plasma response
    but are not included in $\delta\mathbf{B}_\mathrm{pl}$ when represented separately.
    Fourier harmonic amplitudes, eigenfunction components, and spatial projections
    must carry their stated phase, harmonic, and direction definitions; they are not
    interchangeable with the unrestricted vector. The related component quantities
    [radial_perturbed_plasma_magnetic_field](name:radial_perturbed_plasma_magnetic_field),
    [poloidal_perturbed_plasma_magnetic_field](name:poloidal_perturbed_plasma_magnetic_field),
    and [toroidal_perturbed_plasma_magnetic_field](name:toroidal_perturbed_plasma_magnetic_field)
    describe resolved quantities: radial is the $\hat{R}$ projection in the right-handed
    cylindrical $(R,\phi,Z)$ frame, poloidal requires an explicitly defined poloidal
    projection direction such as the tangent to increasing $\theta$ in flux coordinates
    $(\rho,\theta,\phi)$, and the toroidal entry denotes the single-harmonic $\hat{\phi}$-resolved
    quantity specified by that standard name.


    Sign convention: Positive when a real resolved component of $\delta\mathbf{B}_\mathrm{pl}$,
    or the real part of a complex resolved component after applying its stated phase
    convention, is directed along the positive basis direction; in the right-handed
    cylindrical $(R,\phi,Z)$ frame with $\hat{R}\times\hat{\phi}=\hat{Z}$, $+\hat{R}$
    is toward increasing major radius $R$, $+\hat{\phi}$ is toward increasing toroidal
    angle $\phi$ counter-clockwise when viewed from above $+\hat{Z}$, and $+\hat{Z}$
    is toward increasing vertical height $Z$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_vacuum_magnetic_field
  - name:radial_non_axisymmetric_magnetic_field
  - name:radial_perturbed_plasma_magnetic_field
