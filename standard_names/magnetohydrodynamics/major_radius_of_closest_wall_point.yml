name: major_radius_of_closest_wall_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the first-wall point nearest to the last
  closed flux surface, used for plasma-wall clearance monitoring.
documentation: "The major radius $R_{\\mathrm{wall}}$ of the closest wall point identifies\
  \ the radial position in the $(R, Z)$ poloidal cross-section of the first-wall or\
  \ limiter surface element with the minimum Euclidean distance to the last closed\
  \ flux surface (LCFS) or separatrix. This quantity is central to plasma-wall clearance\
  \ monitoring: a shrinking gap signals proximity to a limiter strike or to disruption-induced\
  \ wall loading and halo-current formation. It is computed during equilibrium reconstruction\
  \ by sweeping the discretized wall contour against the reconstructed boundary and\
  \ selecting the element with minimal distance. In medium to large tokamaks $R_{\\\
  mathrm{wall}}$ spans roughly 1.0\u20138.5 m depending on device geometry; for ITER\
  \ the first-wall panels are located at $R \\approx 4.0$\u20138.5 m. The vertical\
  \ counterpart provides the full $(R, Z)$ location. During disruptions the closest\
  \ wall point may coincide with the halo-current contact area; see also `major_radius_of_halo_current_area_end_point`.\
  \ The quantity is also used in real-time shape control to maintain prescribed outer\
  \ gaps."
