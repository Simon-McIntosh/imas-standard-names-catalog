- name: voltage_of_diagnostic_antenna
  kind: scalar
  status: active
  description: Voltage of a diagnostic antenna is the signed electrical potential
    difference at the antenna port between its signal terminal and reference conductor.
    It denotes the antenna terminal quantity, not a downstream receiver, detector,
    spectrometer-channel, or calibrated radiometric signal.
  documentation: 'Voltage of a diagnostic antenna is the electrical terminal voltage
    across the antenna port. The antenna port is the pair of conductors forming the
    antenna feed connection to external circuitry; the voltage is the potential difference
    between the signal terminal and the reference conductor at that port.


    The terminal voltage is defined by the port potential difference:


    $$

    V_\mathrm{ant}(t) = \Phi_\mathrm{sig}(t) - \Phi_\mathrm{ref}(t)

    $$


    where $V_\mathrm{ant}$ is the antenna terminal voltage in volts, $t$ is time,
    and $\Phi_\mathrm{sig}$ and $\Phi_\mathrm{ref}$ are the signal-terminal and reference-conductor
    potentials in volts.


    This quantity is bounded at the antenna electrical port. It excludes voltages
    produced after transmission-line propagation, receiver gain, frequency conversion,
    detection, digitization, or spectrometer-channel processing, which are distinct
    channel or electronics quantities such as [voltage_of_spectrometer_channel](name:voltage_of_spectrometer_channel)
    and [measured_voltage_of_spectrometer_channel](name:measured_voltage_of_spectrometer_channel).
    It is also not the electromagnetic electric-field waveform in space.


    Sign convention: Positive when the signal-terminal potential is greater than the
    reference-conductor potential.'
  unit: V
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:voltage_of_spectrometer_channel
  sources:
  - dd_path: ece/channel/voltage_t_radiation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-voltage_t_radiation
    dd_documentation:
      leaf: Raw voltage measured on each channel, from which the calibrated temperature
        data is then derived
      parent_path: ece/channel
      parent: Set of channels (frequency)
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Raw voltage signal on an ECE channel associated with radiation
        temperature measurement, prior to calibration. Subsequently converted to electron
        temperature (Te) using the channel calibration factor and offset.
      kind: llm
- name: voltage_of_reflectometer_antenna
  kind: scalar
  status: active
  description: Voltage of a reflectometer antenna is the peak amplitude of a calibrated
    narrow-band microwave voltage at a reflectometer antenna terminal or specified
    electrical reference plane. It is the generic terminal amplitude, not only the
    plasma-reflected component.
  documentation: 'Voltage of a reflectometer antenna is the peak amplitude of a narrow-band
    microwave voltage associated with a reflectometer antenna terminal or specified
    electrical reference plane. It is a calibrated voltage amplitude, meaning the
    value is referred to that terminal or reference plane after applying the gain,
    attenuation, and reference-plane convention that define the reported electrical
    amplitude.


    For a narrow-band waveform represented by the complex voltage phasor $\tilde V(t)$
    through $v(t)=\Re\{\tilde V(t)e^{-i\omega_0 t}\}$, the antenna voltage is defined
    by:


    $$

    V_\mathrm{ant}(t)=|\tilde V(t)|

    $$


    where $v(t)$ is the real microwave voltage waveform in volts, $\tilde V(t)$ is
    the slowly varying complex voltage phasor in volts at the reference plane, $\omega_0$
    is the carrier angular frequency in radians per second, and $V_\mathrm{ant}(t)$
    is the reported peak voltage amplitude in volts. For a pure sinusoid, the corresponding
    root-mean-square voltage is $V_\mathrm{ant}/\sqrt{2}$; this standard name denotes
    the peak amplitude.


    As a generic reflectometer-antenna terminal amplitude, this quantity can include
    launched-wave leakage, plasma-reflected or scattered components, antenna coupling,
    standing-wave effects, and receiver-chain response unless a component has been
    separated by definition. It is the reflectometer-specific counterpart of [voltage
    of a diagnostic antenna](name:voltage_of_diagnostic_antenna) and is broader than
    [reflected voltage of a reflectometer antenna](name:reflected_voltage_of_reflectometer_antenna),
    which denotes only the reflected-wave component; it is not a reflection coefficient,
    cutoff position, or plasma density.'
  unit: V
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: reflectometer_fluctuation/channel/amplitude
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/reflectometer_fluctuation.html#reflectometer_fluctuation-channel-amplitude
    dd_documentation:
      leaf: Measured amplitude of the detected probing wave for each frequency and
        time slice (corresponding to the begin time of a sweep)
      parent_path: reflectometer_fluctuation/channel
      parent: Set of channels, e.g. different reception antennas or frequency bandwidths
        of the reflectometer
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Measured amplitude of the detected probing wave as a function of
        swept frequency and time slice. Records the signal strength of the reflected
        wave returned to the fluctuation reflectometer antenna.
      kind: llm
