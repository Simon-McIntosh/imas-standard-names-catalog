- name: total_neutron_source_rate_due_to_thermal_fusion
  kind: scalar
  status: active
  description: Total neutron production rate from thermonuclear neutron-producing
    deuterium-deuterium, deuterium-tritium, and tritium-tritium reaction branches
    among Maxwellian bulk ions, excluding beam-target and beam-beam fast-ion contributions.
  documentation: 'The total neutron source rate due to thermal fusion is the number
    of neutrons produced per unit time by the neutron-producing thermal deuterium-deuterium,
    deuterium-tritium, and tritium-tritium reaction branches between bulk ions with
    locally Maxwellian velocity distributions. It is the channel-summed member of
    [neutron source rate due to thermal fusion](name:neutron_source_rate_due_to_thermal_fusion),
    equal to the sum of [deuterium-deuterium neutron source rate due to thermal fusion](name:deuterium_deuterium_neutron_source_rate_due_to_thermal_fusion),
    [deuterium-tritium neutron source rate due to thermal fusion], and [tritium-tritium
    neutron source rate due to thermal fusion](name:tritium_tritium_neutron_source_rate_due_to_thermal_fusion).


    The channel-summed thermal neutron source rate is defined by


    $$

    S_{n,\mathrm{tot}}^{\mathrm{th}} = \int_V \sum_{c \in \{DD,DT,TT\}} \nu_{n,c}\,\frac{n_{a_c}
    n_{b_c}}{1+\delta_{a_c b_c}}\,\langle\sigma v\rangle_c(T_{a_c},T_{b_c})\,dV

    $$


    where $S_{n,\mathrm{tot}}^{\mathrm{th}}$ is the total source rate, $V$ is the
    emitting plasma volume, $c$ labels a neutron-producing thermal fusion branch,
    $\nu_{n,c}$ is the neutron multiplicity of branch $c$, $a_c$ and $b_c$ are its
    reactant ion species, $n_{a_c}$ and $n_{b_c}$ are their local bulk number densities,
    $\delta_{a_c b_c}$ is one for identical reactants and zero otherwise, $\langle\sigma
    v\rangle_c$ is the Maxwellian-averaged reactivity, $T_{a_c}$ and $T_{b_c}$ are
    the local reactant temperatures, and $dV$ is a volume element. The denominator
    prevents double counting of identical reactant pairs.


    Only reactions among locally Maxwellian bulk ions are included; beam-target, beam-beam,
    fusion-product, and other nonthermal fast-ion contributions are excluded. For
    deuterium-deuterium fusion, only the D(d,n)$^3\mathrm{He}$ neutron branch contributes;
    the D(d,p)T proton branch is not counted. For deuterium-deuterium and deuterium-tritium
    neutron branches $\nu_{n,c}=1$, while for tritium-tritium fusion $\nu_{n,c}=2$.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutron_source_rate_due_to_thermal_fusion
  - name:deuterium_deuterium_neutron_source_rate_due_to_thermal_fusion
  - name:tritium_tritium_neutron_source_rate_due_to_thermal_fusion
  arguments:
  - name: neutron_source_rate_due_to_thermal_fusion
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: summary/fusion/neutron_rates/thermal/value
    dd_version: 4.1.0
