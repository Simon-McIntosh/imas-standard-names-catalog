- name: wave_phase_of_wave_beam
  kind: scalar
  status: active
  description: "Fringe-jump-corrected phase angle of a probing electromagnetic signal\
    \ at a selected wavelength, referenced to the channel\u2019s defined launch phase."
  documentation: "This quantity is the continuous phase angle of a probing electromagnetic\
    \ signal at one selected wavelength, with integer-cycle discontinuities caused\
    \ by fringe jumps removed. It represents the phase accumulated along the signal\u2019\
    s propagation chord relative to the channel\u2019s defined launch-phase reference.\n\
    \nThe corrected phase is related to the measured wrapped phase by\n\n$$\n\\phi_{\\\
    mathrm{corr}} = \\phi_{\\mathrm{meas}} + 2\\pi N_{\\mathrm{fj}}\n$$\n\nwhere $\\\
    phi_{\\mathrm{corr}}$ is the fringe-jump-corrected phase, $\\phi_{\\mathrm{meas}}$\
    \ is the measured wrapped phase, and $N_{\\mathrm{fj}}$ is the signed integer\
    \ number of full-cycle fringe-jump corrections. The factor $2\\pi$ represents\
    \ one complete phase revolution.\n\nThe quantity applies to a single probing wavelength\
    \ and represents the phase accumulated over the complete propagation chord, rather\
    \ than a local phase at one point. It is referenced to the channel\u2019s defined\
    \ launch phase; it is not an absolute electromagnetic phase and does not include\
    \ an uncorrected fringe discontinuity.\n\nThe corrected phase is the phase observable\
    \ used to obtain the [line-integrated electron number density](name:line_integrated_electron_number_density)\
    \ through the wavelength-dependent plasma refractive index. It is distinct from\
    \ the general [reference phase](name:reference_phase), which establishes a phase\
    \ origin without specifying fringe-jump correction or a propagation chord."
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_integrated_electron_number_density
  sources:
  - dd_path: interferometer/channel/wavelength/phase_corrected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-wavelength-phase_corrected
    dd_documentation:
      leaf: Phase measured for this wavelength, corrected from fringe jumps
      parent_path: interferometer/channel/wavelength
      parent: Set of wavelengths used for interferometry
      data_type: STRUCTURE
      unit: rad
    enhanced_context:
      description: "Phase (\u03C6) measured for a specific interferometer wavelength\
        \ channel, corrected for fringe jumps. Fringe-jump-corrected phase is used\
        \ to derive accurate line-integrated electron density (ne\xB7dl) along the\
        \ chord."
      kind: llm
  - dd_path: refractometer/channel/bandwidth/phase
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/refractometer.html#refractometer-channel-bandwidth-phase
    dd_documentation:
      leaf: Phase of the envelope of the probing signal, relative to the phase at
        launch
      parent_path: refractometer/channel/bandwidth
      parent: Set of frequency bandwidths
      data_type: FLT_1D
      unit: rad
      coordinates:
      - refractometer/channel/bandwidth/time
    enhanced_context:
      description: Phase of the envelope of the probing microwave signal in a refractometer
        channel, measured relative to the launch phase. This accumulated phase shift
        is proportional to the line-integrated refractive index and is used to derive
        the line-integrated electron density.
      kind: llm
- name: width_of_reflectometer_antenna
  kind: scalar
  status: active
  description: Width of a reflectometer antenna is the full non-negative transverse
    extent of a rectangular antenna aperture along the X1 direction of the local aperture
    frame (X1, X2, X3), where X1 and X2 lie in the aperture plane and X3 is normal
    to it.
  documentation: 'Width of a reflectometer antenna is the full non-negative transverse
    extent of a rectangular antenna aperture along the $X_1$ direction of the local
    aperture frame $(X_1, X_2, X_3)$, where $X_1$ and $X_2$ are tangent to the aperture
    plane and $X_3$ is normal to that plane. It describes the physical aperture size,
    not the antenna position, pointing direction, or orientation of the aperture frame.


    For an aperture region $A$ expressed in the local aperture frame $(X_1, X_2, X_3)$,
    the width $w$ is the span of the $X_1$ coordinate over the aperture:


    $$

    w = \max_{\mathbf{r} \in A} X_1(\mathbf{r}) - \min_{\mathbf{r} \in A} X_1(\mathbf{r})

    $$


    where $\mathbf{r}$ is a point of the aperture and $X_1(\mathbf{r})$ is its coordinate
    along the $X_1$ axis.


    Only the span parallel to $X_1$ is the width; the span parallel to $X_2$ is the
    orthogonal aperture-plane dimension when the two local tangential directions are
    distinguished. The quantity is a full side-to-side extent, not a half-width, radius,
    aperture area, or individual boundary coordinate such as the [first local tangential
    coordinate of a reflectometer antenna](name:first_local_tangential_coordinate_of_reflectometer_antenna).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:width_of_diagnostic_aperture
  sources:
  - dd_path: reflectometer_fluctuation/channel/antenna_detection_static/x1_width
