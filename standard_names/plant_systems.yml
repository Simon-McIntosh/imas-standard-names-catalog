    dd_path: gas_injection/pipe/valve/electron_rate
    status: composed
  - id: dd:gas_injection/valve/electron_rate
    dd_path: gas_injection/valve/electron_rate
    status: attached
- name: ethane_prefill_count
  kind: scalar
  status: draft
  description: Accumulated ethane gas injected during the plasma prefill phase, expressed
    as an equivalent-electron count. Each C2H6 molecule contributes 18 equivalent
    electrons.
  documentation: 'Ethane prefill count is the accumulated amount of ethane introduced
    before plasma initiation, expressed as the number of electrons that would be supplied
    if the injected molecules were fully ionized. The quantity represents the ethane
    contribution to the initial neutral inventory in an equivalent-electron convention.


    The conversion from injected ethane molecules to equivalent-electron count is:


    $$

    N_{e,\mathrm{eq}} = 18\,N_{\mathrm{C}_2\mathrm{H}_6}

    $$


    where $N_{e,\mathrm{eq}}$ is the ethane prefill count, a dimensionless count of
    equivalent electrons, and $N_{\mathrm{C}_2\mathrm{H}_6}$ is the accumulated number
    of injected ethane molecules, a dimensionless molecule count. The factor 18 is
    the total nuclear charge of one ethane molecule: two carbon atoms with charge
    6 each plus six hydrogen atoms with charge 1 each.


    In practice, the value is obtained from calibrated gas-delivery accounting over
    the defined prefill interval and converted from delivered molecular amount to
    equivalent-electron count. It should include ethane delivered for the prefill
    phase only, not later gas injection used for fueling, impurity control, or other
    discharge phases.


    Typical values are strongly device- and scenario-dependent. They may be zero when
    ethane is not used for prefill, while intentional nonzero prefill amounts can
    span roughly $10^{19}$-$10^{23}$ equivalent electrons in small to medium devices
    and scale upward with vessel volume, target fill pressure, and delivered gas inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:ethylene_prefill_count
  - name:propane_prefill_count
  sources:
  - id: dd:summary/gas_injection_prefill/ethane/value
    dd_path: summary/gas_injection_prefill/ethane/value
    status: composed
- name: gas_flow
  kind: scalar
  status: draft
  description: Volumetric throughput rate of gas in an injection or pumping system,
    expressed as the product of local gas pressure and volumetric flow speed.
  documentation: "The gas flow $Q$ characterizes the pressure-weighted volumetric\
    \ throughput of gas in a plasma-facing gas handling system, encompassing injection\
    \ valves, injection pipes, and pumping ducts. It is the primary quantity governing\
    \ particle delivery to and removal from the plasma vessel, directly linking hardware\
    \ actuator settings to the plasma particle inventory.\n\nThe defining relation\
    \ is:\n\n$$\nQ = p \\cdot \\dot{V}\n$$\n\nwhere $p$ is the local gas pressure\
    \ and $\\dot{V}$ is the volumetric flow rate. This standard vacuum-engineering\
    \ throughput convention yields a quantity proportional to particle flux that remains\
    \ well-defined independent of downstream pressure variations, making it the natural\
    \ actuator variable for density control systems.\n\nIn gas injection applications,\
    \ $Q$ acts as the primary actuator for plasma fueling, impurity seeding, and density\
    \ control. In pumping ducts, it quantifies the particle exhaust rate entering\
    \ the plasma particle balance as a sink. The operational dynamic range of a given\
    \ valve or duct is bounded by [maximum_gas_flow](name:maximum_gas_flow) as the\
    \ upper limit and [minimum_gas_flow](name:minimum_gas_flow) as the lower limit.\
    \ The species-resolved pumping counterpart is [neutral_species_flow](name:neutral_species_flow).\n\
    \nFlow rates are inferred from calibrated mass flow controllers, pressure transducers\
    \ combined with valve conductance models, or response-curve look-up tables that\
    \ map control voltage to throughput. Typical injection rates range from $10^{-3}$\
    \ to $10$ Pa\xB7m\xB3\xB7s\u207B\xB9 for trace impurity valves through high-throughput\
    \ fueling manifolds; pumping duct rates in large-scale devices can exceed $10$\
    \ Pa\xB7m\xB3\xB7s\u207B\xB9 during high-density operation."
  unit: Pa.m^3.s^-1
