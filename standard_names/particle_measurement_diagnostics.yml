- name: area_of_langmuir_probe
  kind: scalar
  status: active
  description: Total geometric surface area of a Langmuir probe collector, characterizing
    the probe's physical extent independent of plasma exposure fraction or magnetic-field
    projection.
  documentation: "The area of a Langmuir probe is the total geometric surface area\
    \ of the probe collector, representing its full physical size as a fixed hardware\
    \ property independent of local plasma conditions or magnetic-field geometry.\
    \ It is the parent area concept from which two operationally distinct sub-areas\
    \ are derived: the [wetted area](name:wetted_area_of_langmuir_probe), which captures\
    \ only the portion of the collector surface directly exposed to plasma, and the\
    \ [effective collection area](name:effective_area_of_langmuir_probe), which is\
    \ the projection onto the plane perpendicular to the local magnetic field that\
    \ governs ion collection in a magnetized sheath.\n\nFor probes oriented at a grazing\
    \ angle to the magnetic field \u2014 quantified by the [field-aligned incident\
    \ angle] \u2014 the effective collection area can be substantially smaller than\
    \ the total geometric area. Conflating the two when normalizing the [ion saturation\
    \ current] to obtain the [ion saturation current density] introduces systematic\
    \ errors in the inferred plasma density and particle flux at the probe surface.\n\
    \nProbe areas are treated as fixed diagnostic geometry parameters, determined\
    \ from engineering drawings or direct measurement of the fabricated collector\
    \ prior to installation."
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:wetted_area_of_langmuir_probe
  - name:effective_area_of_langmuir_probe
  sources:
  - dd_path: langmuir_probes/embedded/surface_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-surface_area
    dd_documentation:
      leaf: Area of the probe surface exposed to the plasma
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Area of the probe surface exposed to the plasma for an embedded
        Langmuir probe. Used to convert ion saturation current to current density,
        directly affecting derived quantities such as electron density (ne) and parallel
        heat flux.
      kind: llm
  - dd_path: langmuir_probes/reciprocating/surface_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-surface_area
    dd_documentation:
      leaf: Area of the surface exposed to the plasma of each collector (constant
        assuming negligible dependence on e.g. the magnetic field line angle)
      parent_path: langmuir_probes/reciprocating
      parent: Set of reciprocating probes or probe pins
      data_type: FLT_1D
      unit: m^2
      coordinates:
      - langmuir_probes/reciprocating/plunge/collector
    enhanced_context:
      description: Area of the collector surface exposed to the plasma for each reciprocating
        Langmuir probe pin. Used for computing current density and ion saturation
        current density from raw probe current measurements.
      kind: llm
- name: area_of_neutron_detector
  kind: scalar
  status: active
  description: Geometric area of a particle-detector sensitive surface that can intercept
    the relevant particles, independent of projection, solid-angle weighting, and
    detector response.
  documentation: 'Geometric surface area is the physical extent of the detector surface
    designated as sensitive to the relevant particles. It applies to planar, curved,
    or segmented sensitive surfaces, with segmented areas combined into one total.


    $$

    A = \int_{S_{\mathrm{sens}}} dS

    $$


    where $A$ is the geometric surface area, $S_{\mathrm{sens}}$ is the sensitive-surface
    domain, and $dS$ is its differential area element. The area includes only the
    sensitive surface and excludes passive housing, shielding, supports, and electronics.
    It is not projected area, solid-angle-weighted area, or response-weighted effective
    area. The representative [neutron-detector surface area](name:surface_area_of_neutron_detector)
    is an instance of this quantity.'
  unit: m^2
  physics_domain: particle_measurement_diagnostics
  links:
  - name:surface_area_of_neutron_detector
- name: beryllium_density
  kind: scalar
  status: active
  description: Local number density of beryllium impurity ions per unit plasma volume,
    summed over all ionization states from singly ionized to fully stripped (Be1+
    through Be4+), excluding neutral beryllium atoms.
  documentation: 'Beryllium (atomic number $Z = 4$) enters the plasma primarily through
    sputtering or evaporation from beryllium first-wall surfaces. The local beryllium
    ion number density $n_\mathrm{Be}$ aggregates contributions from all four charged
    ionization stages:


    $$

    n_\mathrm{Be} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}

    $$


    where $n_{\mathrm{Be}^{z+}}$ is the number density of beryllium ions in charge
    state $z+$, with $z$ running from 1 (singly ionized) to 4 (fully stripped). Neutral
    beryllium atoms are excluded from this sum.


    Beryllium impurity content is inferred from passive spectroscopy of beryllium
    emission lines or from active charge-exchange recombination spectroscopy, with
    spatially resolved profiles reconstructed by tomographic inversion of chord-integrated
    measurements. Spatially averaged representations include [line_averaged_beryllium_density](name:line_averaged_beryllium_density)
    along a diagnostic chord and [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density)
    integrated over the confined plasma volume. The relative impurity abundance with
    respect to the electron population is characterized by the ratio_of_beryllium_density_to_electron_density.


    Sign convention: Positive when beryllium ions are present in the plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_beryllium_density
  - name:volume_averaged_beryllium_density
- name: current_of_mass_spectrometer_channel
  kind: scalar
  status: active
  description: Electric current generated by transport or collection of positive ions
    across a defined surface or through a circuit element.
  documentation: 'This quantity is the conventional electric current associated with
    positive-ion charge transport or collection. It represents the net rate at which
    ion charge crosses a defined surface or enters a circuit element.


    $$

    I = \frac{dQ}{dt}

    $$


    where $I$ is electric current, $Q$ is the net positive-ion charge transported,
    and $t$ is time. The aggregation over ion species, charge states, or mass-selected
    populations is determined by the physical boundary or collection process; detector
    gain and voltage are not part of the current itself.


    The mass-discriminated detector measurement [ion current of a mass spectrometer
    channel](name:ion_current_of_mass_spectrometer_channel) is a specialized instance
    of this quantity, while [ion current](name:ion_current) expresses the broader
    ion-charge transport concept.


    Sign convention: Positive when positive ion charge crosses the chosen surface
    in the defined positive direction.'
  unit: A
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_current_of_mass_spectrometer_channel
  - name:ion_current
- name: diameter_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Full transverse diameter of a circular diagnostic aperture, measured
    across its center between opposite points on the circumferential boundary.
  documentation: 'This quantity is the full transverse extent of the clear circular
    opening at the diagnostic entrance pupil, measured between opposite points on
    its circumferential boundary.


    The diameter is defined by


    $$

    D = 2r

    $$


    where $D$ is the aperture diameter and $r$ is the geometric radius given by the
    [radius of the diagnostic aperture](name:radius_of_diagnostic_aperture).


    The quantity describes the opening geometry only; it excludes aperture thickness,
    housing dimensions, and the width of a noncircular aperture. The diameter determines
    the geometric area and contributes to the solid-angle acceptance together with
    the aperture-to-source distance.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
  sources:
  - dd_path: charge_exchange/channel/cone_diameter
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-cone_diameter
    dd_documentation:
