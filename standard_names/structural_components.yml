- name: resistivity_of_limiter_tile
  kind: scalar
  status: active
  description: Nonnegative electrical resistivity of limiter-tile material, relating
    the local electric field to current density and governing ohmic losses in the
    tile.
  documentation: 'Electrical resistivity of a limiter tile is the intrinsic material
    property that measures opposition to electrical current and determines the electric
    field required to sustain a current density. For this scalar quantity, the material
    response is represented as isotropic or as an effective value for the specified
    material state.


    The defining local constitutive relation is:


    $$

    \mathbf{E} = \rho\,\mathbf{J}

    $$


    where $\mathbf{E}$ is electric field in V/m, $\mathbf{J}$ is current density in
    A/m$^2$, and $\rho$ is electrical resistivity in $\Omega\,\mathrm{m}$. The corresponding
    volumetric ohmic heating is $\mathbf{J}\cdot\mathbf{E}$.


    This quantity describes the limiter-tile material itself and excludes contact
    resistance, geometric resistance, and the integrated resistance of the complete
    tile. It is the limiter-tile counterpart of [resistivity of a plasma-facing component](name:resistivity_of_plasma_facing_component)
    and is distinct from [power density of a limiter tile](name:power_density_of_limiter_tile),
    which describes deposited energy rather than material resistance.'
  unit: m.ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_plasma_facing_component
  - name:power_density_of_limiter_tile
  sources:
  - dd_path: wall/description_2d/limiter/unit/resistivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-limiter-unit-resistivity
    dd_documentation:
