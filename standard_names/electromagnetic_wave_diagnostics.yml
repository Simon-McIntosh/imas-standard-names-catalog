- name: toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Signed projection of the electromagnetic wave vector of a beam-tracing\
    \ beam onto the toroidal direction in the right-handed cylindrical (R, \u03C6\
    , Z) frame at the evaluated point along the ray."
  documentation: 'Toroidal wave vector of a beam-tracing beam is the physical component
    of the local electromagnetic wave vector along $\hat{\phi}$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It represents the local toroidal wave-number
    component of the propagating beam.


    The component is defined by the orthonormal projection of the local wave vector:


    $$

    k_\phi = \mathbf{k} \cdot \hat{\phi}

    $$


    where $k_\phi$ is the toroidal wave-vector component, $\mathbf{k}$ is the local
    electromagnetic wave vector, both have units of inverse length, and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    This is the orthonormal physical component along $\hat{\phi}$, not the canonical
    phase-gradient component conjugate to the toroidal angle; the corresponding canonical
    factor is $R k_\phi$. The corresponding normalized toroidal wave-vector component
    is the signed direction cosine $k_\phi / |\mathbf{k}|$, not a normalization by
    a vacuum wave number.


    Sign convention: Positive when the wave vector component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  sources:
