- name: maximum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Maximum value of the total magnetic field magnitude on a nested toroidal
    magnetic flux surface. It is a non-negative scalar that characterizes the strongest
    field encountered on that surface.
  documentation: 'Maximum magnetic field magnitude is the largest value of $|\mathbf{B}|$
    over a single nested toroidal magnetic flux surface. It is paired with [minimum_magnetic_field_magnitude](name:minimum_magnetic_field_magnitude)
    and, together with that minimum, characterizes the magnetic-field variation experienced
    by guiding-center orbits on the surface.


    For a surface labeled by poloidal flux $\psi$, the quantity is defined by


    $$

    B_{\max}(\psi) = \max_{\mathbf{x} \in S(\psi)} \left|\mathbf{B}(\mathbf{x})\right|

    $$


    where $S(\psi)$ is the magnetic flux surface with label $\psi$, $\mathbf{x}$ is
    position, $\mathbf{B}$ is the magnetic field vector, and both $|\mathbf{B}|$ and
    $B_{\max}$ are measured in T.


    In equilibrium analysis it is computed by evaluating the full magnetic field magnitude
    on each flux surface and taking the surface maximum, usually with interpolation
    between reconstructed equilibrium points. In axisymmetric tokamaks the maximum
    often occurs toward the inboard, higher-field side because the toroidal field
    usually increases there, but this location is not part of the definition and can
    be affected by shaping and poloidal-field contributions.


    For trapped-passing physics, $B_{\max}$ gives the largest field strength a particle
    must access to circulate around the surface. For a particle with kinetic energy
    $E$ and magnetic moment $\mu$, full access to the surface requires $\mu B_{\max}
    < E$; equality gives the trapped-passing boundary, while $\mu B_{\max} > E$ implies
    reflection before the particle reaches the highest-field region.


    Typical values are about 1-8 T in many present tokamak plasmas and can exceed
    10 T in compact high-field devices; low-field or spherical tokamak plasmas can
    be below 1 T. The value depends mainly on external toroidal field strength, plasma
    geometry, and the poloidal-field contribution.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:flux_surface_average_magnetic_field
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_max
    dd_path: equilibrium/time_slice/profiles_1d/b_field_max
    status: composed
  - id: dd:equilibrium/time_slice/profiles_1d/b_max
    dd_path: equilibrium/time_slice/profiles_1d/b_max
    status: attached
  - id: dd:pf_active/coil/b_field_max
    dd_path: pf_active/coil/b_field_max
    status: composed
  - id: dd:pf_active/coil/b_field_max_timed
    dd_path: pf_active/coil/b_field_max_timed
    status: attached
- name: minimum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Smallest value of total magnetic field magnitude on each nested toroidal
    flux surface, used in determining the magnetic trapping condition for charged
    particles in bounce motion.
  documentation: 'The minimum magnetic field magnitude $B_\mathrm{min}(\psi)$ is the
    smallest value of $|\mathbf{B}|$ over all points on the flux surface labeled by
    poloidal flux $\psi$. In tokamaks with a dominant toroidal field satisfying $B_\phi
    \propto 1/R$, the minimum occurs near the outboard (low-field-side) midplane,
    where the major radius $R$ reaches its largest value on the flux surface.


    The ratio $B_\mathrm{min}/B_\mathrm{max}$ governs magnetic trapping of charged
    particles bouncing along field lines. A particle with normalized parallel velocity
    $\xi = v_\parallel/v$ is magnetically trapped when


    $$

    \xi^2 < 1 - \frac{B_\mathrm{min}}{B_\mathrm{max}}

    $$


    where $v_\parallel$ is the velocity component along the magnetic field and $v$
    is the total particle speed. The resulting trapped particle fraction enters neoclassical
    transport coefficients, bootstrap current models, and bounce-averaged kinetic
    equations.


    $B_\mathrm{min}$ is obtained from MHD equilibrium reconstruction by minimizing
    the total field strength $|\mathbf{B}(\psi, \theta)|$ over the poloidal angle
    $\theta$ on each flux surface. Together with [maximum_magnetic_field_magnitude](name:maximum_magnetic_field_magnitude)
    and flux_surface_average_magnetic_field, it fully characterizes the field-strength
    variation on a flux surface that is relevant for classifying particle orbits.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:maximum_magnetic_field_magnitude
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_min
    dd_path: equilibrium/time_slice/profiles_1d/b_field_min
    status: composed
  - id: dd:equilibrium/time_slice/profiles_1d/b_min
    dd_path: equilibrium/time_slice/profiles_1d/b_min
    status: attached
- name: minimum_safety_factor
  kind: scalar
  status: draft
  description: Minimum safety factor is the lowest signed value attained by the safety-factor
    function q across closed magnetic flux surfaces. It is the value of the minimum,
    not the flux-surface location, and is used to assess access to low-order rational-q
    MHD thresholds.
  documentation: 'Minimum safety factor is the global minimum value of the signed
    safety factor on the nested closed magnetic flux surfaces. The safety factor on
    a surface is the field-line pitch, equal to the toroidal angle advance per poloidal
    circuit in flux coordinates $(\rho,\theta,\phi)$, with $\phi$ the toroidal angle
    of the right-handed cylindrical $(R,\phi,Z)$ frame where $R$ is major radius and
    $Z$ is vertical height. This quantity is the scalar value of that minimum; the
    corresponding surface location is represented by [poloidal_magnetic_flux_at_minimum_safety_factor](name:poloidal_magnetic_flux_at_minimum_safety_factor).


    The minimum is defined by taking the minimum of the safety-factor function over
    the closed-surface domain:


    $$

    q_{\min} = \min_{0 \le \rho \le 1} q(\rho)

    $$


    where $\rho$ is a dimensionless monotonic flux-surface label normalized to 0 at
    the magnetic axis and 1 at the last closed flux surface, $q(\rho)$ is the signed
    safety factor (dimensionless), and $q_{\min}$ is dimensionless. The result is
    independent of the particular monotonic label used, provided the same set of closed
    flux surfaces is covered.


    In practice, $q_{\min}$ is obtained from an equilibrium reconstruction by computing
    $q$ on closed flux surfaces from the magnetic-field geometry and locating the
    global minimum, with interpolation between evaluated surfaces when needed. Magnetic
    measurements constrain the reconstruction, and kinetic or polarimetric constraints
    may improve the inferred current density and field-line pitch. The related point
    value [safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95)
    samples $q$ near the edge rather than taking a global minimum.


    Typical tokamak values are about 0.7-2.5 for conventional or weakly reversed-shear
    plasmas. Values near 1 are important for internal-kink and sawtooth thresholds;
    crossing low-order rational values such as $3/2$ or $2$ can mark changes in resonant
    surfaces relevant to tearing and other MHD modes. Advanced or high-safety-factor
    scenarios may have $q_{\min}$ above 2.


    Sign convention: Positive when the toroidal angle advance of a magnetic field
    line is in the direction of increasing $\phi$ as the poloidal angle $\theta$ increases
    in flux coordinates $(\rho,\theta,\phi)$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_minimum_safety_factor
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/value
    dd_path: equilibrium/time_slice/global_quantities/q_min/value
    status: skipped
- name: non_axisymmetric_magnetic_field
  kind: vector
  status: draft
  description: Non-axisymmetric part of the vacuum magnetic field vector, obtained
    by removing the toroidally averaged component, representing toroidally varying
    perturbations such as error fields, resonant magnetic perturbations, and finite
    coil geometry effects.
  documentation: 'The non-axisymmetric magnetic field is the vector magnetic induction
    formed by subtracting the axisymmetric (toroidally averaged) component from the
    total vacuum magnetic field, retaining only the part that varies with toroidal
    angle $\phi$. It encompasses both intrinsic error fields arising from coil misalignment
    and discrete conductor geometry, and deliberately applied perturbation fields
    from coil systems used in resonant magnetic perturbation (RMP) experiments targeting
    edge-localized mode suppression.


    The decomposition into non-axisymmetric and axisymmetric parts is defined as:


    $$

    \mathbf{B}_\mathrm{na}(R,\phi,Z) = \mathbf{B}_\mathrm{vac}(R,\phi,Z) - \frac{1}{2\pi}\int_0^{2\pi}\mathbf{B}_\mathrm{vac}(R,\phi'',Z)\,d\phi''

    $$


    where $\mathbf{B}_\mathrm{vac}$ is the total vacuum magnetic field and the integral
    extracts its toroidal average. The vector is expressed in the right-handed cylindrical
    $(R, \phi, Z)$ frame with $\hat{R} \times \hat{\phi} = \hat{Z}$.


    The field is computed by Biot-Savart integration over each conductor''s geometry
    followed by subtraction of the axisymmetric component; it represents the vacuum
    perturbation only and does not include plasma shielding or amplification, which
    require magnetohydrodynamic or kinetic modeling. The individual cylindrical components
    are [radial_non_axisymmetric_magnetic_field](name:radial_non_axisymmetric_magnetic_field),
    [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field),
    and [vertical_non_axisymmetric_magnetic_field](name:vertical_non_axisymmetric_magnetic_field).
    The normal projection onto prescribed control surfaces is given by non_axisymmetric_magnetic_field_at_control_surface,
    commonly used as an equilibrium reconstruction constraint.


    Typical perturbation amplitudes at the plasma boundary range from $10^{-5}$ to
    $10^{-2}$ T, with deliberately applied RMP systems at the upper end and residual
    intrinsic error fields around $10^{-4}$ T for well-corrected devices.


    Sign convention: Positive when each cylindrical component points in the direction
    of its respective basis vector, $+\hat{R}$, $+\hat{\phi}$, or $+\hat{Z}$, in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  arguments:
  - name: magnetic_field
    operator: non_axisymmetric
    operator_kind: qualifier
- name: normalized_minor_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless minor-radius label of a magnetic flux surface. It is
    half the difference between the surface's maximum and minimum major radii, divided
    by a specified positive reference length L_ref.
  documentation: 'The normalized minor radius of a flux surface is a geometric radial
    coordinate based on the inboard-to-outboard extent of that surface in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height. It labels how far the surface lies from the magnetic axis by using the
    surface half-width in major radius, normalized by a separately specified positive
    reference length.


    The defining relation is


    $$

    r_{\mathrm{minor,norm}} = \frac{R_{\max} - R_{\min}}{2 L_{\mathrm{ref}}}

    $$


    where $R_{\max}$ and $R_{\min}$ are the maximum and minimum major radii of the
    flux surface in meters, and $L_{\mathrm{ref}}$ is the positive reference length
    in meters used for the normalization. The reference length is part of the normalization
    definition and must be stated consistently; for a whole-plasma radial coordinate
    it is commonly the minor radius of a reference boundary flux surface, so the boundary
    value is approximately 1, whereas other modeling contexts may choose a different
    positive reference length.


    In practice the quantity is computed from an equilibrium flux surface by finding
    the extrema of $R$ on the closed surface or on its poloidal cross-section in an
    axisymmetric equilibrium. It is a geometric flux-surface label and should be distinguished
    from flux-based radial coordinates such as the toroidal flux radius, which are
    derived from enclosed magnetic flux rather than from the major-radius half-width.


    Typical values are 0 at the magnetic axis, about 0.1-0.9 for core to near-edge
    flux surfaces when $L_{\mathrm{ref}}$ is the boundary minor radius, and approximately
    1 at the reference boundary surface. Values greater than 1 can occur if the chosen
    reference length is smaller than the surface minor radius or if surfaces outside
    the reference boundary are considered.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_major_radius
  - name:toroidal_reference_magnetic_field
  - name:normalized_particle_mass
  sources:
  - id: dd:gyrokinetics/flux_surface/r_minor_norm
    dd_path: gyrokinetics/flux_surface/r_minor_norm
    status: composed
  - id: dd:gyrokinetics_local/flux_surface/r_minor_norm
    dd_path: gyrokinetics_local/flux_surface/r_minor_norm
    status: attached
- name: normalized_poloidal_flux_coordinate_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Normalized poloidal flux coordinate evaluated on the flux surface where
    the safety factor reaches its global minimum within the confined plasma. It gives
    the radial flux-surface location of the minimum-q surface on the 0-to-1 poloidal-flux
    scale.
  documentation: 'Normalized poloidal flux coordinate at minimum safety factor is
    the value of the normalized poloidal flux coordinate $\psi_N$ on the flux surface
    where the [safety factor](name:safety_factor) $q$ is globally smallest inside
    the last-closed flux surface. It locates the minimum-$q$ surface relative to the
    magnetic axis and plasma boundary, independent of the dimensional scale of [poloidal
    magnetic flux](name:poloidal_magnetic_flux).


    The quantity is defined by minimizing the safety factor as a function of normalized
    poloidal flux coordinate and applying the axis-to-boundary normalization of poloidal
    magnetic flux:


    $$

    \psi_{N,q_{\min}} = \operatorname*{arg\,min}_{0 \le \psi_N \le 1} q(\psi_N), \qquad

    \psi_N = \frac{\psi - \psi_\mathrm{axis}}{\psi_\mathrm{b} - \psi_\mathrm{axis}}

    $$


    where $\psi_{N,q_{\min}}$ is the coordinate of the minimum-safety-factor surface,
    $q(\psi_N)$ is the safety factor on a closed flux surface, $\psi$ is the poloidal
    magnetic flux of that surface, $\psi_\mathrm{axis}$ is the value at the magnetic
    axis, and $\psi_\mathrm{b}$ is the value at the plasma boundary. The minimization
    is over closed flux surfaces in the confined plasma; if several surfaces share
    the same minimum value, the arg-min is mathematically non-unique.


    In practice this coordinate is computed from an equilibrium reconstruction by
    evaluating the safety-factor radial behavior on nested closed flux surfaces, identifying
    the global minimum, and converting the corresponding surface to $\psi_N$. The
    corresponding dimensional flux on the same surface is [poloidal_magnetic_flux_at_minimum_safety_factor](name:poloidal_magnetic_flux_at_minimum_safety_factor);
    a toroidal-flux-radius analog is [normalized_toroidal_flux_coordinate_at_minimum_safety_factor](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor).


    Typical values lie in the interval 0-1. Values near 0 indicate that the minimum
    safety factor is on or very close to the magnetic axis, while values around 0.2-0.6
    are common for reversed-shear or otherwise non-monotonic equilibria with an off-axis
    minimum; values approaching 1 indicate a minimum near the plasma boundary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
  - name:normalized_poloidal_flux_coordinate
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/psi_norm
    dd_path: equilibrium/time_slice/global_quantities/q_min/psi_norm
    status: composed
- name: normalized_poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless normalized poloidal magnetic flux evaluated on the flux
    surface selected as the plasma boundary. It is near unity when that surface coincides
    with, or lies close to, the outer reference flux surface such as the last-closed
    flux surface.
  documentation: 'Normalized poloidal magnetic flux at the plasma boundary is the
    value of the normalized poloidal magnetic-flux function on the flux surface selected
    to represent the plasma boundary. It identifies that boundary relative to the
    magnetic-axis flux and an outer reference flux, which is often the last-closed
    flux surface or separatrix.


    The normalized boundary value is defined by evaluating the normalized poloidal
    flux on the selected boundary surface:


    $$

    \psi_{N,\mathrm{b}} = \left. \frac{\psi - \psi_0}{\psi_\mathrm{ref} - \psi_0}
    \right|_{\psi=\psi_\mathrm{b}}

    $$


    where $\psi$ is the poloidal magnetic flux in Wb, $\psi_0$ is the magnetic-axis
    value in Wb, $\psi_\mathrm{b}$ is the poloidal flux on the selected plasma-boundary
    flux surface in Wb, and $\psi_\mathrm{ref}$ is the outer reference flux in Wb
    used for normalization. If the selected boundary is itself the normalization reference,
    then $\psi_{N,\mathrm{b}}=1$.


    In practice this value is obtained from an equilibrium reconstruction by evaluating
    the normalized poloidal-flux label on the reconstructed boundary contour or on
    the flux surface prescribed as the fixed boundary. This is the normalized flux
    value $\psi_N$ itself; it should not be confused with the square-root radial flux
    coordinate $\rho_\mathrm{pol}=\sqrt{\psi_N}$ represented by [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate).


    Typical values are close to 1 for boundaries chosen near the outer reference flux
    surface. With $\psi_N=0$ at the magnetic axis and $\psi_N=1$ at the reference
    boundary, values from 0 to 1 label closed flux surfaces between those two surfaces,
    and the selected plasma boundary has value 1 when it coincides with the reference
    boundary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/b_flux_pol_norm
    dd_path: equilibrium/time_slice/boundary/b_flux_pol_norm
    status: composed
- name: normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label defined as the square root
    of the toroidal magnetic flux enclosed by a flux surface normalized to its value
    at the last closed flux surface, spanning 0 at the magnetic axis to 1 at the plasma
    boundary.
  documentation: "The normalized toroidal flux coordinate $\\rho_{\\rm tor,norm}$\
    \ is a dimensionless radial label identifying nested magnetic flux surfaces in\
    \ an axisymmetric toroidal equilibrium. It equals zero at the magnetic axis and\
    \ unity at the last closed flux surface (LCFS), providing a monotonically increasing\
    \ coordinate that spans the entire confined plasma region.\n\nThe defining relation\
    \ is:\n\n$$\n\\rho_{\\rm tor,norm} = \\sqrt{\\frac{\\Phi_{\\rm tor}}{\\Phi_{\\\
    rm tor,b}}}\n$$\n\nwhere $\\Phi_{\\rm tor}$ is the toroidal magnetic flux enclosed\
    \ within a given flux surface and $\\Phi_{\\rm tor,b}$ is the toroidal flux at\
    \ the plasma boundary.\n\nThe coordinate is obtained from magnetohydrodynamic\
    \ equilibrium reconstruction by integrating the toroidal magnetic field over poloidal\
    \ cross-sections of increasing enclosed area. Because it is rooted in toroidal\
    \ rather than poloidal flux, it is the natural abscissa for radial transport calculations\
    \ and differs from the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate)\
    \ except in special limiting geometries. Specific physics events are located by\
    \ their value of this coordinate; for example, [the minimum-safety-factor surface](name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor)\
    \ corresponds to a well-defined $\\rho_{\\rm tor,norm}$ that shifts with plasma\
    \ current profile.\n\nThe coordinate spans $[0, 1]$ for all confined flux surfaces.\
    \ In H-mode discharges the steep-gradient pedestal region typically spans $\\\
    rho_{\\rm tor,norm} \\approx 0.85$\u2013$0.95$.\n\nSign convention: Positive when\
    \ the toroidal magnetic flux $\\Phi_{\\rm tor}$ enclosed by the flux surface is\
    \ directed in the same toroidal sense as the flux at the plasma boundary."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_minimum_safety_factor
