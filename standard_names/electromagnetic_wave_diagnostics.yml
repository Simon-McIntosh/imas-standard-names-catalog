- name: wavelength_of_wave_beam
  kind: scalar
  status: active
  description: Vacuum spatial period of a probing electromagnetic wave propagating
    as a diagnostic beam, defining its spectral wavelength.
  documentation: "Vacuum wavelength of a wave beam is the spatial period of its electromagnetic\
    \ phase in vacuum, assigned to the beam\u2019s carrier radiation. It characterizes\
    \ the beam itself rather than a spectral transition or an instrument-response\
    \ feature.\n\nThe vacuum wavelength $\\lambda_0$ is related to the beam\u2019\
    s temporal frequency $f$ by:\n\n$$\n\\lambda_0 = \\frac{c}{f}\n$$\n\nwhere $c$\
    \ is the speed of light in vacuum and $f$ is the temporal oscillation frequency\
    \ of the electromagnetic wave.\n\nThis quantity applies to a probing electromagnetic\
    \ wave beam and describes its vacuum propagation property, independent of plasma-induced\
    \ changes in phase velocity. It is assigned to the beam as a whole and is not\
    \ a sum, average, or integral over beams, paths, channels, or spectral components.\
    \ It excludes the in-medium wavelength and wavelengths associated with filters,\
    \ detector pixels, or spectral transitions.\n\nThis beam-specific specialization\
    \ of [vacuum electromagnetic wavelength] supplies the wavelength used to characterize\
    \ the beam\u2019s propagation and its interaction with plasma. For a vacuum plane\
    \ wave, the magnitude of its [wave vector] satisfies the equivalent relation $|\\\
    mathbf{k}| = 2\\pi/\\lambda_0$, where $\\mathbf{k}$ is the vacuum wave vector."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links: []
  sources:
  - dd_path: interferometer/channel/wavelength/value
