- name: thermal_electron_density
  kind: scalar
  status: draft
  description: Number density of thermal (Maxwellian) electrons, excluding the non-thermal
    population.
  documentation: "The thermal electron density $n_{\\mathrm{e},\\mathrm{th}}$ quantifies\
    \ the number of electrons per unit volume whose velocities follow a Maxwell\u2013\
    Boltzmann distribution, distinguishing them from supra-thermal or runaway electrons.\
    \ In tokamak turbulence simulations, this quantity is evolved self-consistently\
    \ by gyrokinetic or fluid codes and directly determines the electron contribution\
    \ to the quasi-neutrality condition $\\sum_s Z_s n_s \\approx n_{\\mathrm{e},\\\
    mathrm{th}}$.\n\nSign convention: Positive when the number of thermal electrons\
    \ per unit volume is greater than zero.\n\nTypical values range from $10^{19}\\\
    ;\\mathrm{m}^{-3}$ in the scrape-off layer to $10^{20}\\;\\mathrm{m}^{-3}$ in\
    \ the core of a fusion plasma. The thermal electron density is measured directly\
    \ via Thomson scattering or interferometry, and is distinguished from the total\
    \ [electron_density](name:electron_density) by subtracting the fast-electron contribution.\
    \ See also [thermal_ion_density](name:thermal_ion_density) and [thermal_neutral_density](name:thermal_neutral_density)\
    \ for the corresponding species densities in the same simulation framework."
  unit: m^-3
  physics_domain: turbulence
  links:
  - name:electron_density
  - name:thermal_ion_density
  - name:thermal_neutral_density
  sources:
  - id: dd:turbulence/profiles_2d/electrons/density_thermal
    dd_path: turbulence/profiles_2d/electrons/density_thermal
    status: composed
- name: toroidal_momentum_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Normalized toroidal component of the turbulent momentum flux driven
    by the perturbed parallel vector potential in gyrokinetic simulations.
  documentation: 'This scalar quantity represents the toroidal projection of the time-averaged
    turbulent momentum flux vector arising from the perturbed parallel component of
    the magnetic vector potential ($\delta A_\parallel$) in local gyrokinetic flux-tube
    simulations. It isolates the toroidal contribution to the electromagnetic momentum
    transport, complementing the perpendicular and parallel components documented
    in $[\text{perpendicular\_momentum\_flux\_due\_to\_perturbed\_parallel\_vector\_potential}](\text{name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential})$
    and $[\text{parallel\_momentum\_flux\_due\_to\_perturbed\_parallel\_vector\_potential}](\text{name:parallel_momentum_flux_due_to_perturbed_parallel_vector_potential})$.
    The quantity is normalized to the gyrokinetic reference units, making it dimensionless,
    and is typically computed from nonlinear turbulence simulations by summing over
    the perpendicular wavenumber spectrum.


    Sign convention: Positive when the toroidal momentum flux is directed outward
    in the radial coordinate.


    Typical values range from $10^{-3}$ to $10^{2}$ in normalized gyrokinetic units
    depending on the strength of electromagnetic fluctuations and plasma beta. This
    flux component is a key input for predicting toroidal rotation profiles and intrinsic
    rotation in burning plasmas, and it is often compared with the electrostatic contribution
    $[\text{momentum\_flux\_due\_to\_perturbed\_parallel\_vector\_potential}](\text{name:momentum_flux_due_to_perturbed_parallel_vector_potential})$
    to assess the relative importance of electromagnetic versus electrostatic turbulent
    transport.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:parallel_momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  arguments:
  - name: momentum_flux_due_to_perturbed_parallel_vector_potential
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
