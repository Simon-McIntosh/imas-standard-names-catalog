- name: volume_of_flux_surface
  kind: scalar
  status: active
  description: Geometric volume contained within a nested magnetic flux surface, cumulative
    from the magnetic axis toward the outermost closed surface.
  documentation: 'The quantity is the three-dimensional volume enclosed inside a nested
    magnetic flux surface. It characterizes the geometry of the region interior to
    that magnetic surface.


    The enclosed volume is defined by


    $$

    V(\chi) = \int_{\Omega_\chi} d^3x

    $$


    where $V(\chi)$ is the volume associated with flux-surface label $\chi$, $\Omega_\chi$
    is the region inside the corresponding magnetic surface $S_\chi$, and $d^3x$ is
    the three-dimensional volume element.


    The quantity applies to each nested magnetic surface across the modeled plasma
    region, including confined-plasma and scrape-off-layer surfaces where such surfaces
    are defined. It is a cumulative volume over the complete interior of the surface,
    increasing outward from the magnetic axis; it is not the volume of an infinitesimal
    shell.


    It is distinct from [surface area of a flux surface](name:surface_area_of_flux_surface)
    and from [poloidal-plane cross-sectional area of a flux surface](name:poloidal_plane_cross_sectional_area_of_flux_surface).
    The [volume of the plasma boundary](name:volume_of_plasma_boundary) is the boundary
    value of this enclosed-volume function, while [the derivative with respect to
    poloidal magnetic flux coordinate of volume of flux surface](name:derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_volume_of_flux_surface)
    and [the derivative with respect to toroidal flux coordinate of volume of flux
    surface](name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface)
    describe its local change with different flux labels.'
  unit: m^3
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  - name:poloidal_plane_cross_sectional_area_of_flux_surface
  - name:volume_of_plasma_boundary
  - name:derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_volume_of_flux_surface
  - name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
