- name: normalized_plasma_internal_inductance
  kind: scalar
  status: active
  description: Dimensionless li_3 parameter measuring poloidal magnetic-field peaking
    through a plasma-volume integral normalized by total plasma current and a reference
    major radius.
  documentation: 'The quantity is the normalized internal inductance of the plasma
    current distribution. It characterizes the peaking of the poloidal magnetic field
    generated by the total plasma current, rather than a ratio formed only from a
    boundary field.


    Under the li_3 definition,


    $$

    l_i = \frac{2}{R_0\mu_0^2 I_p^2} \int_{V_p} B_p^2\,dV

    $$


    where $l_i$ is the normalized internal inductance, $R_0$ is the reference major
    radius, $\mu_0$ is the vacuum permeability, $I_p$ is the total signed plasma current,
    $B_p$ is the magnitude of the poloidal magnetic field, $V_p$ is the plasma volume,
    and $dV$ is a differential volume element.


    This is a global equilibrium quantity. The aggregation is a volume integral of
    the squared poloidal-field magnitude over the entire plasma volume, normalized
    by the square of the total plasma current; it does not select a separate species,
    charge state, orbit class, or localized position.


    It is distinct from the dimensional [plasma inductance]: the present quantity
    includes the reference-radius and vacuum-permeability normalization in the defining
    expression and is not a local inductance, a flux-surface average, or a boundary-field
    ratio.


    If $L_p$ denotes the [plasma inductance], the normalized quantity is related by
    $l_i = 2L_p/(R_0\mu_0)$. Thus, under the same reference normalization, a larger
    value indicates a more strongly concentrated poloidal-field energy distribution
    associated with the plasma current.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: core_profiles/global_quantities/li_3
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-global_quantities-li_3
    dd_documentation:
      leaf: Internal inductance. The li_3 definition is used, i.e. li_3 = 2/R0/mu0^2/Ip^2
        * int(Bp^2 dV).
      parent_path: core_profiles/global_quantities
