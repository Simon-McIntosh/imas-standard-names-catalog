name: gyrokinetic_eigenmode_normalized_perturbed_electrostatic_potential_imaginary_part
description: Imaginary part of the normalized perturbed electrostatic potential $\delta
  \hat{\phi}$ for a gyrokinetic eigenmode.
documentation: "The imaginary component $\\mathrm{Im}(\\delta \\hat{\\phi})$ of the\
  \ dimensionless perturbed electrostatic potential eigenfunction at a given wavevector\
  \ $(k_\\theta, k_\\phi)$. The normalization convention is $\\delta \\hat{\\phi}\
  \ = e \\delta \\phi / T_e$, where $e$ is the elementary charge, $\\delta \\phi$\
  \ the perturbation in V, and $T_e$ the reference electron temperature in eV. Together\
  \ with the real part, the complex eigenfunction encodes the full spatial structure\u2014\
  amplitude and phase\u2014of the electrostatic perturbation along the field-line-following\
  \ coordinate. A nonzero imaginary part at ballooning angle $\\theta = 0$ signals\
  \ a tilt of the mode away from the outboard midplane, which is characteristic of\
  \ finite-flow-shear effects or non-up-down-symmetric equilibria. Produced by linear\
  \ eigenvalue gyrokinetic solvers such as GS2, GENE, or GKW."
kind: complex_part
unit: '1'
