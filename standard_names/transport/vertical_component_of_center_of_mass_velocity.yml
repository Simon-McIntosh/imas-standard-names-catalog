name: vertical_component_of_center_of_mass_velocity
description: Projection of the plasma center-of-mass velocity onto the vertical ($Z$)
  axis in cylindrical coordinates.
documentation: Defined as $v_{\rm cm,Z} = \mathbf{v}_{\rm cm} \cdot \hat{Z}$, where
  $\mathbf{v}_{\rm cm} = \sum_s n_s m_s \mathbf{v}_s / \sum_s n_s m_s$ is the mass-weighted
  mean velocity of all plasma species ($n_s$ is number density in m$^{-3}$, $m_s$
  mass in kg, $\mathbf{v}_s$ fluid velocity in m/s). The vertical component captures
  the up-down directed bulk plasma motion, which is particularly important in divertor
  geometries and during vertical displacement events (VDEs). In quiescent discharges
  the vertical center-of-mass velocity is small ($\lesssim$10 m/s), but during VDEs
  or disruptions it can exceed $10^3$ m/s. This quantity is evaluated on a GGD mesh
  and enters the vertical momentum balance relevant for plasma position control. It
  is dominated by the main-ion species contribution.
kind: vector_component
unit: m.s^-1
