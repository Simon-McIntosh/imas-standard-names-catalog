      kind: llm
- name: magnetic_field
  kind: vector
  status: active
  description: Magnetic induction vector representing the local magnetic field before
    specifying its physical contribution, perturbation, spatial projection, or magnitude.
  documentation: 'The magnetic induction vector $\mathbf{B}$ is the local magnetic
    flux density, carrying both field strength and direction. This parent quantity
    does not by itself select an equilibrium state, source region, perturbation, component,
    or evaluation locus.


    In terms of the [magnetic vector potential](name:magnetic_vector_potential) $\mathbf{A}$,
    the field is defined by


    $$

    \mathbf{B} = \nabla \times \mathbf{A}

    $$


    where $\mathbf{A}$ is the magnetic vector potential and $\nabla \times$ is the
    curl operator. The potential representation is gage-dependent, whereas the resulting
    magnetic induction vector is physical.


    Qualifiers distinguish contributions such as the [vacuum magnetic field](name:vacuum_magnetic_field),
    [plasma magnetic field](name:plasma_magnetic_field), and [perturbed magnetic field](name:perturbed_magnetic_field).
    Projections such as the [toroidal magnetic field](name:toroidal_magnetic_field)
    are signed components, while field-strength extrema such as the [maximum magnetic
    field](name:maximum_magnetic_field) are scalar reductions rather than vector fields.


    Sign convention: Positive when a resolved component of $\mathbf{B}$ points along
    the corresponding positive direction of the right-handed cylindrical $(R,\phi,Z)$
    frame: increasing $R$, increasing $\phi$, or increasing $Z$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_vector_potential
  - name:vacuum_magnetic_field
  - name:plasma_magnetic_field
  - name:maximum_magnetic_field
  sources:
