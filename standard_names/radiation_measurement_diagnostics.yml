- name: radius_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Geometric radius of the circular filter window aperture used in a hard
    X-ray diagnostic channel.
  documentation: "The filter window radius defines the physical size of the circular\
    \ aperture through which hard X-ray radiation passes before reaching the detector.\
    \ For a circular window geometry, the radius $r_w$ determines the window area\
    \ $A_w = \\pi r_w^2$, which directly affects the photon throughput and the field\
    \ of view of the diagnostic channel. Typical values range from 1\u201350 mm depending\
    \ on the diagnostic design and the energy range of the hard X-ray measurement.\n\
    \nSign convention: Positive when the radius is measured outward from the center\
    \ of the circular aperture.\n\nThe radius is a purely geometric parameter used\
    \ together with the window thickness and material properties to model the transmission\
    \ and attenuation of hard X-ray photons. This quantity is related to [area_of_diagnostic_aperture](name:area_of_diagnostic_aperture)\
    \ for the corresponding aperture component."
  unit: m
  physics_domain: radiation_measurement_diagnostics
