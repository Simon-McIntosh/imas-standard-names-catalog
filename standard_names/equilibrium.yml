- name: elongation_of_flux_surface
  kind: scalar
  status: active
  description: "Ratio of the vertical to horizontal semi-axes of a nested magnetic\
    \ flux surface\u2019s poloidal cross-section, independent of its overall size."
  documentation: 'Elongation is the shape ratio of an individual nested magnetic flux
    surface, describing how extended its poloidal cross-section is vertically relative
    to horizontally.


    For a given flux surface, the elongation is defined by


    $$

    \kappa = \frac{a_v}{a_h}

    $$


    where $\kappa$ is the elongation, $a_v$ is the vertical semi-axis of the poloidal
    cross-section, and $a_h$ is its horizontal semi-axis.


    The quantity applies separately to each nested magnetic flux surface and is a
    shape ratio rather than an integrated, summed, or averaged quantity. It is not
    restricted to the outermost surface; the distinct [elongation of the plasma boundary](name:elongation_of_plasma_boundary)
    refers specifically to the last closed plasma boundary.


    The [radial derivative of elongation of a flux surface] describes the change of
    $\kappa$ across nested surfaces, whereas this quantity gives the elongation at
    one surface.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-elongation
    dd_documentation:
      leaf: Elongation
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Elongation (\u03BA) of nested magnetic flux surfaces as a 1D radial\
        \ profile in the MHD equilibrium, defined as the ratio of the vertical to\
        \ horizontal semi-axis of each flux surface. Characterizes plasma shape as\
        \ a function of the poloidal flux coordinate."
      kind: llm
  - dd_path: gyrokinetics_local/flux_surface/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-flux_surface-elongation
    dd_documentation:
