- name: width_of_spectrometer_entrance_slit
  kind: scalar
  status: draft
  description: Physical width of the entrance slit of a spectrometer, measured edge-to-edge
    perpendicular to the slit length in the plane of the optical aperture. This non-negative
    quantity controls the trade-off between spectral resolution and photon throughput.
  documentation: 'The entrance slit of a spectrometer is a rectangular aperture placed
    at the object focal plane of the dispersing optical system. Its width $w_s$ is
    measured edge-to-edge in the direction perpendicular to the slit length (i.e.,
    in the dispersion plane), in meters. The quantity is non-negative: $w_s \geq 0$.


    The slit width governs the geometric contribution to the instrument function.
    For a dispersing element with angular dispersion $d\theta/d\lambda$ and a focusing
    element of focal length $f$, the geometric full-width contribution to the instrument
    function in wavelength units is


    $$\Delta\lambda_\mathrm{geom} = \frac{w_s}{f \cdot (d\theta/d\lambda)},$$


    where $f$ is the focal length of the camera (or focusing) optic in meters and
    $d\theta/d\lambda$ is the angular dispersion of the grating or crystal in radians
    per meter. For a grating spectrometer operating near diffraction order $m$ with
    grating constant $d$, $d\theta/d\lambda \approx m/(d\cos\theta_d)$ where $\theta_d$
    is the diffraction angle. Thus $\Delta\lambda_\mathrm{geom}$ carries units of
    meters (wavelength), as expected.


    In practice, the total instrument-function width is a convolution of the geometric
    slit image, aberrations, and detector pixel response. Narrowing $w_s$ improves
    spectral resolution at the cost of reduced photon flux, a trade-off particularly
    critical in tokamak VUV and X-ray spectroscopy (e.g., charge-exchange recombination
    spectroscopy, crystal spectrometers) where signal-to-noise constraints are severe.
    Typical slit widths range from tens of micrometers to several hundred micrometers
    depending on the application.


    This quantity is synonymous with `spectrometer_entrance_slit_width` and is distinct
    from the width of a dispersing crystal element (`width_of_crystal`) or the fitted
    Gaussian width of the instrument function (`instrument_function_gaussian_width`).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:instrument_function_gaussian_width
  - name:spectrometer_entrance_slit_width
  - name:width_of_crystal
  constraints: []
  sources:
  - id: dd:charge_exchange/channel/spectrum/slit_width
    dd_path: charge_exchange/channel/spectrum/slit_width
    status: composed
