name: tritium_breeding_ratio
status: draft
cocos_transformation_type: one_like
description: Number of tritium atoms produced per fusion neutron absorbed in the breeding
  blanket, quantifying tritium self-sufficiency of the reactor.
documentation: "The tritium breeding ratio (TBR) $= N_T / N_n$ is the ratio of tritium\
  \ atoms $N_T$ generated by neutron-lithium reactions to the number of 14.1 MeV fusion\
  \ neutrons $N_n$ incident on the blanket. A TBR > 1 is required for tritium self-sufficiency\
  \ in a D\u2013T fusion power plant; design targets typically range from 1.05 to\
  \ 1.15 to compensate for radioactive decay, processing losses, and startup inventory.\
  \ Tritium is bred primarily via the reactions $^6\\mathrm{Li} + n \\to \\alpha +\
  \ T + 4.8\\,\\mathrm{MeV}$ and $^7\\mathrm{Li} + n \\to \\alpha + T + n' - 2.5\\\
  ,\\mathrm{MeV}$, the latter also serving as a neutron multiplier. TBR is computed\
  \ by Monte Carlo neutronics codes (MCNP, Serpent, TRIPOLI) applied to the three-dimensional\
  \ blanket geometry, integrating tritium production over all modules. See also `blanket_energy_multiplication_factor`\
  \ for the companion energy accounting quantity."
