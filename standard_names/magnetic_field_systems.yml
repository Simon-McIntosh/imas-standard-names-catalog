    status: composed
- name: toroidal_angle_of_conductor_element_end_point
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the end point of a coil conductor element\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, completing the element's\
    \ geometric extent alongside its start point."
  documentation: "The toroidal angle $\\phi$ locates the end point of a conductor\
    \ element along the azimuthal direction in the right-handed cylindrical $(R, \\\
    phi, Z)$ frame, where $R$ is the major radius from the machine symmetry axis and\
    \ $Z$ is the vertical height. Together with [toroidal_angle_of_conductor_element_start_point](name:toroidal_angle_of_conductor_element_start_point),\
    \ it defines the toroidal span of the element; the midpoint between the two is\
    \ captured by [toroidal_angle_of_conductor_element_center](name:toroidal_angle_of_conductor_element_center).\
    \ For non-axisymmetric coils such as toroidal-field or error-field correction\
    \ coils, $\\phi$ may range across $[0, 2\\pi)$ radians, and the arc $\\Delta\\\
    phi = \\phi_{\\rm end} - \\phi_{\\rm start}$ determines the element's toroidal\
    \ extent, which enters inductance and field-map calculations. The end-point coordinate\
    \ is obtained from coil-geometry descriptions provided by engineering drawings\
    \ or 3-D conductor models and is used by Biot\u2013Savart integrators to compute\
    \ the magnetic field contribution of each finite conductor element.\n\nSign convention:\
    \ Positive when $\\phi$ increases in the counter-clockwise direction when viewed\
    \ from above along $+\\hat{Z}$."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
