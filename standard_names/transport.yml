- name: toroidal_co_passing_torque_density
  kind: scalar
  status: draft
  description: Toroidal torque density contributed by the co-passing particle population.
    It is the local source rate of toroidal angular momentum per unit volume for that
    orbit class, distinct from counter-passing and trapped contributions.
  documentation: 'Toroidal co-passing torque density is the local rate at which toroidal
    angular momentum is added to, or removed from, particles in the co-passing passing-orbit
    class. In the right-handed cylindrical $(R, \phi, Z)$ system, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height; the quantity refers to the
    toroidal component of angular momentum associated with that coordinate convention.


    A kinetic source moment for one or more represented species can be written as


    $$

    \tau_{\phi,\mathrm{co}}(\mathbf{x}) = \sum_{s \in \mathcal{S}} \int_{\mathcal{V}_{\mathrm{co}}}
    m_s R v_\phi S_s(\mathbf{x},\mathbf{v}) \, d^3v

    $$


    where $\tau_{\phi,\mathrm{co}}$ is the co-passing toroidal torque density, $\mathbf{x}$
    is position, $\mathbf{v}$ is particle velocity, $\mathcal{V}_{\mathrm{co}}$ is
    the co-passing region of velocity space, $s$ labels the included species, $m_s$
    is particle mass in kg, $R$ is major radius in meters, $v_\phi$ is toroidal velocity
    in m s$^{-1}$, and $S_s = \partial f_s/\partial t|_\mathrm{src}$ is the distribution-function
    source rate. Equivalently, it is the source part of $\partial \ell_{\phi,\mathrm{co}}/\partial
    t$, where $\ell_{\phi,\mathrm{co}} = \sum_s \int_{\mathcal{V}_{\mathrm{co}}} m_s
    R v_\phi f_s d^3v$ has units kg m$^{-1}$ s$^{-1}$; therefore $\tau_{\phi,\mathrm{co}}$
    has units N m$^{-2}$.


    In practice this quantity is computed by taking the toroidal angular-momentum
    moment of kinetic or transport source terms over the co-passing orbit class. It
    is combined with related orbit-class contributions such as [toroidal_counter_passing_torque_density](name:toroidal_counter_passing_torque_density)
    and [toroidal_trapped_torque_density](name:toroidal_trapped_torque_density); force-resolved
    components such as [toroidal_co_passing_torque_density_due_to_j_cross_b_force](name:toroidal_co_passing_torque_density_due_to_j_cross_b_force)
    represent specific physical mechanisms within the same co-passing momentum balance.


    Typical values are strongly scenario dependent because this is a local source
    term tied to momentum deposition, collisional exchange, and electromagnetic forces.
    It is often close to 0 N m$^{-2}$ outside active source or sink regions, and its
    magnitude is best interpreted relative to the local [toroidal_plasma_momentum](name:toroidal_plasma_momentum)
    and momentum transport time.


    Sign convention: Positive when toroidal angular momentum is added to the co-passing
    population in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ system.'
  unit: N.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/source/momentum_phi
    dd_path: distributions/distribution/profiles_1d/co_passing/source/momentum_phi
    status: composed
- name: toroidal_electric_field
  kind: scalar
  status: draft
  description: Toroidal component of the electric field in the IMAS cylindrical (R,
    phi, Z) frame. It is the signed projection of the electric field along increasing
    toroidal angle phi.
  documentation: 'The toroidal electric field is the component of the electric-field
    vector along the toroidal basis direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. In tokamak plasmas it is the component most directly associated
    with inductive electron acceleration, plasma initiation, toroidal current drive,
    and ohmic dissipation.


    The component is defined by projection onto the toroidal unit vector:


    $$

    E_\phi = \mathbf{E} \cdot \hat{\phi}

    $$


    where $E_\phi$ is the toroidal electric field in $\mathrm{V\,m^{-1}}$, $\mathbf{E}$
    is the electric-field vector in $\mathrm{V\,m^{-1}}$, and $\hat{\phi}$ is the
    unit vector in the direction of increasing toroidal angle.


    In practice, $E_\phi$ is inferred from loop-voltage measurements, magnetic-flux
    evolution, transport analysis, or local electric-field estimates. For an axisymmetric
    field that is approximately uniform along a circular contour of major radius $R$
    in the cylindrical $(R, \phi, Z)$ frame, the local relation is commonly interpreted
    as $E_\phi \approx V_\mathrm{loop}/(2\pi R)$, where $V_\mathrm{loop}$ is the voltage
    around that contour in volts and $R$ is in meters; this approximation should not
    be treated as a general pointwise equality when the field varies poloidally or
    toroidally. During plasma initiation, $E_\phi$ is considered together with [prefill
    pressure] and [perpendicular magnetic field] because these affect ionization avalanche
    and electron confinement. During ohmic operation, the product of toroidal electric
    field and toroidal current density contributes to Joule heating and is related
    to [plasma resistance].


    Representative magnitudes are typically about $0.01-0.2\ \mathrm{V\,m^{-1}}$ during
    established ohmic current sustainment, and about $0.1-10\ \mathrm{V\,m^{-1}}$
    during startup, breakdown, or rapid current ramp phases. The value depends on
    device size, applied loop voltage, plasma resistivity, gas conditions, and magnetic-field
    error levels.


    Sign convention: Positive when the electric-field component points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: V.m^-1
  physics_domain: transport
