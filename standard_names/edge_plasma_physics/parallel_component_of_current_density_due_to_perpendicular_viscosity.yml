name: parallel_component_of_current_density_due_to_perpendicular_viscosity
description: Parallel projection of the current density generated by perpendicular
  viscous stress in the plasma momentum balance.
documentation: "The parallel current density due to perpendicular viscosity $j_{\\\
  parallel,\\pi_\\perp}$ quantifies the component of current density along the magnetic\
  \ field $\\mathbf{B}$ that is driven by the divergence of the perpendicular viscous\
  \ stress tensor $\\pi_\\perp$. In the Braginskii fluid framework, the viscous stress\
  \ tensor has parallel ($\\pi_\\parallel$) and perpendicular ($\\pi_\\perp$, also\
  \ called gyroviscous) contributions; the perpendicular piece generates a current\
  \ when its divergence has a component along $\\hat{b}$. This term is particularly\
  \ important in edge and scrape-off layer modeling where steep gradients and strong\
  \ flow shear make viscous contributions non-negligible compared with the pressure-gradient-driven\
  \ and Ohmic currents. Typical magnitudes are $10^1$\u2013$10^4\\;\\mathrm{A\\,m^{-2}}$\
  \ in the edge plasma, smaller than the total parallel current but significant for\
  \ accurate current closure in 2D/3D edge transport codes. The quantity is provided\
  \ per element on a generalized grid description (GGD)."
kind: vector_component
unit: A.m^-2
