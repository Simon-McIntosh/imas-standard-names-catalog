name: Validate Catalog

on:
  pull_request:
    paths:
      - 'standard_names/**/*.yml'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - name: Validate catalog
        run: uv run validate_catalog standard_names/ --summary text
