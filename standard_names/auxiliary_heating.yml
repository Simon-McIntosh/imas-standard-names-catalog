- name: wave_driven_current_density
  kind: vector
  status: draft
  description: Local electric current density vector generated by directed momentum
    transfer from resonant electromagnetic waves to charged particles. It is the wave-driven
    contribution to the total current density, distinct from Ohmic and bootstrap currents.
  documentation: 'Wave-driven current density is the local vector current carried
    by charged particles whose distribution functions are altered by resonant electromagnetic
    waves. It represents the current-drive contribution of auxiliary heating waves
    to the total [current_density](name:current_density), distinct from Ohmic, inductive,
    and bootstrap current. It is not a flux-surface average, volume average, or integrated
    current; those operations produce derived quantities such as [parallel_wave_driven_current_density](name:parallel_wave_driven_current_density)
    or contributions to [toroidal_plasma_current](name:toroidal_plasma_current).


    In quasilinear kinetic descriptions, the wave-driven contribution is the first
    velocity moment of the wave-induced perturbation to the distribution function:


    $$

    \mathbf{j}_\mathrm{wave}(\mathbf{x}) = \sum_s q_s \int \mathbf{v}\,\delta f_s^\mathrm{wave}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $\mathbf{x}$ is position, $s$ labels particle species, $q_s$ is the species
    charge in C, $\mathbf{v}$ is particle velocity in $\mathrm{m\,s^{-1}}$, $d^3v$
    is the velocity-space volume element, and $\delta f_s^\mathrm{wave}$ is the wave-induced
    perturbation to the distribution function in $\mathrm{s^3\,m^{-6}}$. The sign
    of $q_s$ makes electron current opposite to the resonant electron drift velocity.


    In practice, wave-driven current density is computed from injected wave spectra
    and polarization, wave propagation and absorption, quasilinear diffusion, and
    collisional relaxation of the resonant distribution function. It is constrained
    experimentally by magnetic equilibrium reconstruction, loop-voltage balance, current-drive
    efficiency estimates, and wave or emission diagnostics, but direct point measurements
    are uncommon. Integrating or projecting this vector over space and over launched
    modes yields mode-resolved or global current-drive quantities such as [per_toroidal_mode_current_due_to_wave_driven_current_drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive).


    Typical local magnitudes in auxiliary-heated tokamaks are $10^3$-$10^5$ A.m^-2
    over broad wave-absorption regions and can reach $10^5$-$10^6$ A.m^-2 in strongly
    localized current-drive regions. Flux-surface-averaged parallel values and volume-averaged
    values are generally smaller because regions of weak or oppositely directed drive
    contribute to the average.


    Sign convention: Positive when the conventional-current component of $\mathbf{j}_\mathrm{wave}$
    points in the positive direction of its stated basis vector; in the right-handed
    cylindrical $(R, \phi, Z)$ frame, a positive toroidal component flows in the direction
    of increasing toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:current_density
  - name:parallel_wave_driven_current_density
  - name:per_toroidal_mode_current_due_to_wave_driven_current_drive
  - name:toroidal_plasma_current
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/current_parallel_density
    dd_path: waves/coherent_wave/profiles_1d/current_parallel_density
    status: composed
- name: parallel_wave_driven_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel current density produced by resonant
    wave-particle interactions, giving the net RF-driven current per unit area along
    the magnetic field direction.
  documentation: 'The parallel wave-driven current density is the flux-surface average
    of the wave-driven current projected along the equilibrium magnetic field, capturing
    the RF current-drive contribution to the parallel current profile from a single
    coherent wave. Resonant electromagnetic waves transfer directed momentum to the
    plasma, altering the particle velocity distribution in a way that produces a net
    current preferentially aligned with the magnetic field direction.


    The defining relation is:


    $$

    j_{\parallel,\mathrm{wave}} = \frac{\langle \mathbf{j}_\mathrm{wave} \cdot \mathbf{B}
    \rangle}{B_0}

    $$


    where $\langle \cdots \rangle$ denotes the flux-surface average, $\mathbf{j}_\mathrm{wave}$
    is the local wave-driven current density vector of the parent [wave_driven_current_density](name:wave_driven_current_density),
    $\mathbf{B}$ is the magnetic field, and $B_0$ is the on-axis reference magnetic
    field magnitude.


    This quantity is computed by quasi-linear or wave-kinetic RF solvers that determine
    the non-Maxwellian perturbation to the particle distribution induced by resonant
    wave absorption, then flux-surface-average the resulting driven current. The per-toroidal-mode
    resolved version is [parallel_per_toroidal_mode_wave_driven_current_density](name:parallel_per_toroidal_mode_wave_driven_current_density).
    Summed over all wave contributions, this quantity constitutes the wave-current-drive
    component of [parallel_non_inductive_current_density](name:parallel_non_inductive_current_density),
    alongside parallel_current_density_due_to_bootstrap and in contrast to the resistively
    driven [parallel_ohmic_current_density](name:parallel_ohmic_current_density).


    Sign convention: Positive when the wave-driven parallel current flows in the direction
    of the equilibrium magnetic field $\mathbf{B}$.'
  unit: A.m^-2
  physics_domain: auxiliary_heating
  links:
  - name:wave_driven_current_density
  - name:parallel_per_toroidal_mode_wave_driven_current_density
  - name:parallel_non_inductive_current_density
  - name:parallel_ohmic_current_density
  arguments:
  - name: wave_driven_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/current_parallel_density
    dd_path: waves/coherent_wave/profiles_1d/current_parallel_density
    status: composed
