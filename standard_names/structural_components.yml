      parent_path: breeding_blanket/module/time_slice
      parent: Dynamic quantities at various time slices
      data_type: FLT_0D
      unit: W
    enhanced_context:
      description: Total incident neutron power on a single breeding blanket module.
        Quantifies the nuclear power load delivered by fusion neutrons to the blanket,
        a key input for tritium breeding and thermal design.
      kind: llm
- name: power_of_limiter_tile
  kind: scalar
  status: active
  description: Component-integrated rate at which energy is deposited in a limiter
    tile, with the physical power channel and deposition mechanism specified by each
    specialization.
  documentation: 'Power of a limiter tile is the total energy-deposition rate attributed
    to the material of the complete tile for a specified physical channel. It is a
    component-integrated quantity rather than a local value.


    For volume-deposited power, the defining relation is


    $$

    P = \int_{V} q(\mathbf{r})\,dV

    $$


    where $P$ is the tile power, $V$ is the tile-material volume, and $q(\mathbf{r})$
    is the local volumetric power-deposition rate at position $\mathbf{r}$. The nuclear
    specialization [nuclear power of limiter tile](name:nuclear_power_of_limiter_tile)
    applies this relation to energy deposited by neutron and photon interactions;
    its local counterpart is [nuclear power density of limiter tile](name:nuclear_power_density_of_limiter_tile).'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_of_limiter_tile
  - name:nuclear_power_density_of_limiter_tile
- name: nuclear_power_of_limiter_tile
  kind: scalar
  status: active
  description: Total nuclear energy-deposition rate within limiter-tile material from
    neutron interactions and absorption of primary and secondary gamma radiation.
  documentation: 'Nuclear heating power of a limiter tile is the volume-integrated
    rate at which neutron and gamma interactions deposit energy as heat throughout
    the tile material. It is the nuclear component of the complete tile power, rather
    than a local heating density or incident radiation power.


    $$

    P_{\mathrm{nuc}} = \int_{V_{\mathrm{tile}}} q_{\mathrm{nuc}}(\mathbf{r})\,dV

    $$


    where $P_{\mathrm{nuc}}$ is the tile nuclear heating power, $V_{\mathrm{tile}}$
    is the volume occupied by tile material, $q_{\mathrm{nuc}}(\mathbf{r})$ is the
    local nuclear heating power density at position $\mathbf{r}$, and $dV$ is a material-volume
    element. The deposition includes energy from elastic and inelastic neutron scattering,
    neutron capture, and absorption of primary and secondary gamma radiation. It is
    the volume integral of [nuclear power density of a limiter tile](name:nuclear_power_density_of_limiter_tile)
    and specializes [power of a limiter tile](name:power_of_limiter_tile) to the nuclear-heating
    channel; incident energy that is not deposited in the tile is excluded.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_limiter_tile
  - name:power_of_limiter_tile
  arguments:
