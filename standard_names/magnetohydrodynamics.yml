      kind: llm
- name: perturbed_plasma_temperature_real_part
  kind: complex
  status: active
  description: In-phase component of the complex first-order plasma-temperature eigenfunction
    for a specified toroidal Fourier harmonic in linear MHD stability analysis.
  documentation: 'The quantity is the real, in-phase component of the first-order
    plasma-temperature perturbation associated with one toroidal Fourier harmonic.
    It is a component of the complex eigenfunction represented by [perturbed plasma
    temperature](name:perturbed_plasma_temperature).


    The in-phase component is defined from the complex perturbation amplitude by


    $$

    \delta T_{\mathrm{R}} = \operatorname{Re}\!\left(\delta T\right)

    $$


    where $\delta T_{\mathrm{R}}$ is the real temperature-perturbation component and
    $\delta T$ is the full complex first-order temperature eigenfunction. The result
    depends on the phase reference chosen for the harmonic and excludes the quadrature
    component represented by the imaginary part. It is not the equilibrium temperature
    or the complete complex perturbation.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature
  arguments:
