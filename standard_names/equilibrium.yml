    the toroidal symmetry axis.


    This is a point value evaluated at the magnetic axis in the plasma poloidal cross-section;
    it is not a flux-surface average, region integral, or coordinate of an arbitrary
    magnetic or physical contour. It is distinct from [radial_coordinate_at_inboard_midplane](name:radial_coordinate_at_inboard_midplane),
