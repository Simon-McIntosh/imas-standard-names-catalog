- name: second_local_tangential_coordinate_of_reflectometer_antenna
  kind: scalar
  status: active
  description: "Coordinate of each reflectometer antenna aperture-outline vertex along\
    \ the second local tangential axis of the antenna\u2019s orthogonal (X1, X2) frame."
  documentation: 'This quantity is the signed position of a reflectometer antenna
    aperture-outline vertex along the second local tangential direction in the antenna-local
    orthogonal $(X_1, X_2)$ frame.


    $$

    x_2 = \mathbf{r} \cdot \hat{\mathbf{e}}_2

    $$


    where $x_2$ is the second local tangential coordinate, $\mathbf{r}$ is the vertex
    displacement from the local frame origin, and $\hat{\mathbf{e}}_2$ is the second
    local tangential unit vector. The local orientation is defined by $\hat{\mathbf{e}}_2
    = \hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$, with $\hat{\mathbf{e}}_1$ the
    first local tangential unit vector and $\hat{\mathbf{e}}_3$ the plasma-facing
    normal.


    Together with the [first local tangential coordinate of the reflectometer antenna](name:first_local_tangential_coordinate_of_reflectometer_antenna),
    this coordinate specifies the aperture-outline geometry. It is not a vertical
    coordinate or a coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the vertex displacement has a positive projection
    onto the second local tangential direction $\hat{\mathbf{e}}_2$.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_reflectometer_antenna
