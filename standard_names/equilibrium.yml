- name: maximum_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Largest magnitude of the magnetic-field vector over a specified evaluation
    domain, distinguishing total field strength from any signed field component.
  documentation: 'The maximum magnetic-field magnitude is the greatest total field
    strength attained within the physical evaluation domain associated with the quantity.


    The defining extremum is


    $$

    B_{\max} = \max_{\mathbf{x}\in D} \left\lVert \mathbf{B}(\mathbf{x}) \right\rVert

    $$


    where $B_{\max}$ is the maximum magnetic-field magnitude, $\mathbf{B}(\mathbf{x})$
    is the magnetic-field vector at spatial point $\mathbf{x}$, and $D$ is the specified
    evaluation domain.


    The domain may be a nested magnetic flux surface or a coil-conductor surface,
    as established by the physical context. The maximum operation aggregates the field
    magnitude over all points in $D$ and returns its largest value; it does not represent
    a spatial average or a particular field component.


    This quantity selects the modulus of the magnetic-field vector before applying
    the maximum operation. It is therefore the magnitude-specific child of [maximum
    magnetic field](name:maximum_magnetic_field), whose parent concept leaves the
    scalar field being maximized unspecified. It excludes maxima of signed toroidal,
    poloidal, radial, or other individual magnetic-field components.'
  unit: T
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/b_field_max
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-b_field_max
    dd_documentation:
      leaf: Maximum(modulus(B)) on the flux surface (always positive, irrespective
        of the sign convention for the B-field direction)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: Maximum magnetic field modulus (|B|_max) on each flux surface as
        a 1D radial profile, always positive. A key quantity for trapped particle
