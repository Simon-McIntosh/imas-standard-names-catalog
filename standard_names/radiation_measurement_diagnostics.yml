- name: spectral_width_of_filter
  kind: scalar
  status: draft
  description: Full wavelength extent of the spectral passband of a diagnostic optical
    filter, measured between the pair of wavelengths at which the filter transmission
    falls to 90% of its peak value.
  documentation: 'The spectral width of a diagnostic optical filter quantifies the
    range of wavelengths the filter transmits, defined as the wavelength interval
    between the long- and short-wavelength points at which transmission equals 90%
    of its peak value. This 90%-transmission convention provides a conservative estimate
    of the effective passband and distinguishes the quantity from a full-width-at-half-maximum
    measure. A narrower spectral width improves rejection of background continuum
    and neighboring spectral lines, while a broader passband increases photon throughput
    for faint emission features.


    The passband full width at the 90%-transmission level is


    $$

    \Delta\lambda_{90} = \lambda_+ - \lambda_-

    $$


    where $\lambda_+$ is the long-wavelength 90%-transmission edge, reported independently
    as [upper_wavelength_of_filter](name:upper_wavelength_of_filter), and $\lambda_-$
    is the corresponding short-wavelength edge, reported as [lower_wavelength_of_filter](name:lower_wavelength_of_filter).


    The spectral width is determined by calibrated laboratory transmission measurements
    using a monochromator, or taken directly from manufacturer filter specifications.
    It is conceptually distinct from the physical aperture dimension described by
    [width_of_filter](name:width_of_filter), which characterizes the geometric extent
    of the filter window rather than its wavelength selectivity.


    Typical spectral widths range from less than 1 nm for narrow-line filters isolating
    specific plasma emission lines to several tens of nanometers for broadband infrared
    filters used in thermal imaging of plasma-facing components.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_wavelength_of_filter
  - name:lower_wavelength_of_filter
  - name:width_of_filter
