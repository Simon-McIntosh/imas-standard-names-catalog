      parent_path: balance_of_plant/power_electric_plant_operation
      parent: Electric plant operation
      data_type: FLT_1D
      unit: W
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Total electrical power consumed to operate the plant (P_plant_op),
        encompassing all auxiliary systems. Subtracted from generated electrical power
        to obtain the net electricity output of the fusion power plant.
      kind: llm
- name: total_thermal_coolant_absorbed_power_at_wall
  kind: scalar
  status: active
  description: Thermal power extracted by active coolant circuits from cooled plasma-facing
    wall surfaces, representing energy removal from the wall rather than incident
    plasma power.
  documentation: 'This quantity is the total heat-transfer rate from cooled plasma-facing
    wall structures into their active coolant circuits. It represents energy removed
    from the wall and is distinct from [total incident power at the wall](name:total_incident_power_at_wall),
    which measures plasma power arriving at wall surfaces.


    $$

    P_{\mathrm{cool}} = \sum_i \dot{Q}_{i}

    $$


    where $P_{\mathrm{cool}}$ is the total coolant-absorbed thermal power and $\dot{Q}_{i}$
    is the heat-transfer rate from the wall into coolant circuit $i$. The sum includes
    all active cooling circuits serving the cooled plasma-facing surfaces and excludes
    heat deposited on uncooled structures or power merely incident on the wall.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_incident_power_at_wall
  sources:
  - dd_path: wall/global_quantities/power_to_cooling
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-power_to_cooling
    dd_documentation:
