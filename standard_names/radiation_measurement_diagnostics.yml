- name: toroidal_angle_of_bragg_crystal
  kind: scalar
  status: draft
  description: Angular span subtended by a Bragg diffracting crystal in the toroidal
    direction of the right-handed cylindrical (R, phi, Z) frame. It defines the horizontal
    acceptance angle over which the crystal can intercept X-ray radiation for Bragg
    diffraction.
  documentation: 'The toroidal angle of a Bragg crystal is the angular extent of the
    crystal projection in the toroidal direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. It describes the horizontal acceptance arc over which a curved
    or cylindrical diffracting crystal can intercept X-ray radiation for Bragg diffraction.


    The span is obtained from the crystal-edge toroidal coordinates in the same right-handed
    cylindrical $(R, \phi, Z)$ frame on a continuous angular branch:


    $$

    \Delta\phi_\mathrm{crystal} = \phi_{\max}^{\mathrm{unwrapped}} - \phi_{\min}^{\mathrm{unwrapped}}

    $$


    where $\phi_{\min}^{\mathrm{unwrapped}}$ and $\phi_{\max}^{\mathrm{unwrapped}}$
    are the lower and upper toroidal edge angles in radians after placing both edges
    on the same continuous branch, with $\Delta\phi_\mathrm{crystal} \ge 0$. If the
    physical crystal crosses the $2\pi$ branch cut in $\phi$, one edge angle is shifted
    by an integer multiple of $2\pi$ before evaluating the difference.


    During design or calibration, this quantity is computed from the known crystal
    edge locations, from the crystal arc length and [toroidal_curvature_of_bragg_crystal](name:toroidal_curvature_of_bragg_crystal),
    or from metrology of the mounted crystal. Together with radial_coordinate_of_bragg_crystal,
    [radius_of_bragg_crystal](name:radius_of_bragg_crystal), and [vertical_curvature_of_bragg_crystal](name:vertical_curvature_of_bragg_crystal),
    it helps determine the ray directions accepted by the crystal aperture and the
    range of Bragg incidence angles sampled at once.


    Typical values are set by crystal size, curvature, and spectrometer layout; the
    definition itself only requires a non-negative span not exceeding a full turn.
    For finite curved-crystal X-ray spectrometers, representative engineering values
    are often about 0.001-0.1 rad, with high-resolution narrow-aperture designs generally
    toward the lower end.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:toroidal_curvature_of_bragg_crystal
  - name:radius_of_bragg_crystal
  - name:vertical_curvature_of_bragg_crystal
