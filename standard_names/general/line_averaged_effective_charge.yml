name: line_averaged_effective_charge
status: draft
cocos_transformation_type: one_like
description: Line-averaged effective ion charge $\langle Z_{\mathrm{eff}} \rangle_\ell$,
  quantifying the mean impurity dilution along an integrated line of sight.
documentation: "The line-averaged effective charge $\\langle Z_{\\mathrm{eff}} \\\
  rangle_\\ell$ (dimensionless) is the chord-integrated mean of $Z_{\\mathrm{eff}}\
  \ = \\sum_s n_s Z_s^2 / n_e$ along a diagnostic line of sight, where $n_s$ and $Z_s$\
  \ are the density and charge number of ion species $s$ and $n_e$ is the electron\
  \ density. It is the primary figure of merit for impurity content: $Z_{\\mathrm{eff}}\
  \ = 1$ for a pure hydrogen plasma, and values of 1.5\u20133.0 are typical in tokamak\
  \ H-mode conditions depending on wall material and boronization history. The measurement\
  \ is most commonly obtained from visible bremsstrahlung ($\\lambda \\approx 523\\\
  ;\\mathrm{nm}$) continuum emission, which is proportional to $\\int n_e^2 Z_{\\\
  mathrm{eff}}\\,dl$, after normalization by the line-integrated electron density\
  \ from interferometry. $Z_{\\mathrm{eff}}$ impacts resistive dissipation through\
  \ the neoclassical resistivity $\\eta \\propto Z_{\\mathrm{eff}}$, bootstrap current\
  \ fraction, and radiative power loss. See also `electron_number_density` for the\
  \ normalizing quantity and `boron_number_density` for a common impurity contributor."
