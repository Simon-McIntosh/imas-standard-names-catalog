- name: electron_density_over_scrape_off_layer
  kind: scalar
  status: active
  description: Volume-averaged electron number density in the scrape-off layer, the
    open-field-line plasma region outside the last closed flux surface. In analytic
    H-mode pedestal representations it is the scrape-off-layer-side density offset,
    not a density at the boundary or pedestal top.
  documentation: 'Volume-averaged electron number density over the scrape-off layer
    is the electron count per volume assigned to the open-field-line plasma region
    outside the last closed flux surface. The conventional symbol is $n_{e,\mathrm{SOL}}$.


    For a resolved electron-density field, the scrape-off-layer value is the volume
    average over the scrape-off-layer volume:


    $$

    n_{e,\mathrm{SOL}} = \frac{1}{V_{\mathrm{SOL}}}\int_{V_{\mathrm{SOL}}} n_e(\mathbf{x})\,dV

    $$


    where $n_e(\mathbf{x})$ is the local electron number density, $V_{\mathrm{SOL}}$
    is the scrape-off-layer volume, and $dV$ is the volume element.


    When used as a parameter of an analytic H-mode pedestal representation, the same
    quantity denotes the scrape-off-layer-side density offset or floor that represents
    this regional low-density baseline. It is distinct from [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    which is evaluated at the last closed flux surface, and from electron_density_at_pedestal,
    which is evaluated at the pedestal reference location.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
  arguments:
  - name: density_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
  sources:
