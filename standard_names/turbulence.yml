- name: perturbed_particle_pressure
  kind: scalar
  status: draft
  description: Abstract parent for the normalized gyrotropic pressure-tensor moment
    of the perturbed particle distribution in gyrokinetic turbulence, encompassing
    the parallel and perpendicular components of the pressure decomposition.
  documentation: 'This parent quantity represents the dimensionless pressure perturbation
    carried by the particle distribution function $\delta f_s$ for a given species
    in linear gyrokinetic eigenmode analysis. The full pressure tensor of the perturbed
    distribution is gyrotropic, decomposing into two independent scalar components
    along and perpendicular to the equilibrium magnetic field $\mathbf{B}$. Normalization
    by a reference thermal pressure $p_{\rm ref} = n_{\rm ref} T_{\rm ref}$ makes
    the moment dimensionless and enables direct comparison across species and plasma
    parameters.


    The defining kinetic moment is:


    $$

    \delta \hat{p}_s = \frac{1}{n_{\rm ref} T_{\rm ref}} \int m_s v^2 \, \delta f_s
    \, d^3v

    $$


    where $m_s$ is the species mass, $v$ is the particle speed, $n_{\rm ref}$ is a
    reference number density, and $T_{\rm ref}$ is a reference temperature. The directional
    decomposition into parallel and perpendicular gyrotropic components is carried
    by [normalized_particle_perturbed_pressure](name:normalized_particle_perturbed_pressure).
    The analogous gyrocenter quantity [normalized_gyrocenter_perturbed_pressure](name:normalized_gyrocenter_perturbed_pressure)
    differs from the particle moment by finite-Larmor-radius corrections that become
    significant when the perturbation wavelength is comparable to the thermal gyroradius.
    For a linear eigenmode, the complex phase of $\delta f_s$ is arbitrary; only relative
    amplitudes between moments evaluated at the same wavevector carry physical meaning.


    Sign convention: Positive when the perturbation corresponds to a local enhancement
    of particle pressure above the equilibrium background value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: particle_pressure
    operator: perturbed
    operator_kind: qualifier
  sources:
  - id: derived:perturbed_particle_pressure
    status: composed
- name: normalized_particle_perturbed_pressure
  kind: vector
  status: draft
  description: Normalized gyrotropic pressure-tensor moment of the perturbed particle
    distribution for a linear gyrokinetic eigenmode, decomposed into components parallel
    and perpendicular to the background magnetic field.
  documentation: 'The normalized particle perturbed pressure is a gyrotropic vector
    quantity representing the pressure fluctuation of the physical particle population
    in a linear gyrokinetic eigenmode, decomposed into components parallel and perpendicular
    to the equilibrium magnetic field $\mathbf{B}$, each expressed dimensionlessly
    as a ratio to a reference thermal pressure $p_\mathrm{ref}$.


    For species $s$, the parallel and perpendicular components are the second velocity-space
    moments of the perturbed particle distribution function $\delta f_s$:


    $$

    \hat{p}_{\parallel,s} = \frac{m_s}{p_\mathrm{ref}} \int v_\parallel^2 \, \delta
    f_s \, d^3v, \qquad \hat{p}_{\perp,s} = \frac{m_s}{2 \, p_\mathrm{ref}} \int v_\perp^2
    \, \delta f_s \, d^3v

    $$


    where $m_s$ is the species mass, $v_\parallel$ and $v_\perp$ are velocities parallel
    and perpendicular to $\mathbf{B}$, and $p_\mathrm{ref} = n_\mathrm{ref} T_\mathrm{ref}$
    is evaluated at the outboard midplane.


    Unlike the corresponding [gyroaveraged gyrocenter perturbed pressure], this quantity
    is built from the full particle distribution function, implicitly incorporating
    finite-Larmor-radius corrections through the particle-to-gyrocenter coordinate
    transformation. The isotropic scalar parent particle_perturbed_pressure is recovered
    as the trace average $\hat{p}_s = (\hat{p}_{\parallel,s} + 2\hat{p}_{\perp,s})/3$.
    The [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure)
    and [perpendicular_normalized_particle_perturbed_pressure](name:perpendicular_normalized_particle_perturbed_pressure)
    components together encode the pressure anisotropy of the eigenmode, with the
    ratio $\hat{p}_{\parallel,s}/\hat{p}_{\perp,s}$ quantifying deviation from local
    thermodynamic equilibrium relevant to mirror-mode and fire-hose stability.


    Sign convention: Positive when the species pressure perturbation corresponds to
    a local increase above the equilibrium background pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
  arguments:
  - name: perturbed_particle_pressure
    operator: normalized
    operator_kind: qualifier
  sources:
  - id: derived:normalized_particle_perturbed_pressure
    status: composed
- name: parallel_normalized_particle_perturbed_pressure
  kind: scalar
  status: draft
  description: Normalized parallel pressure moment of the perturbed particle distribution
    function for a linear gyrokinetic eigenmode. It is the complex parallel component
    of the particle pressure perturbation, normalized to a reference pressure, and
    is distinct from the corresponding gyrocenter moment.
  documentation: 'The parallel normalized particle perturbed pressure is a dimensionless
    complex eigenmode moment of the perturbed particle distribution function. It represents
    the fluctuation of the pressure associated with random particle motion along the
    local magnetic-field direction, evaluated in particle variables rather than gyrocenter
    variables.


    For species $s$, using reference density $n_{\mathrm{ref},s}$ and reference temperature
    $T_{\mathrm{ref},s}$ expressed as an energy, a common normalization is


    $$

    \widehat{p}_{\parallel s}^{\,\mathrm{part}} = \frac{m_s}{n_{\mathrm{ref},s} T_{\mathrm{ref},s}}
    \int v_\parallel^2\,\delta f_s^{\,\mathrm{part}}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $m_s$ is the particle mass, $v_\parallel$ is the particle velocity component
    along the magnetic field in $\mathrm{m\,s^{-1}}$, $\delta f_s^{\,\mathrm{part}}$
    is the perturbed particle distribution function in $\mathrm{m^{-6}\,s^3}$, and
    $d^3v$ is the velocity-space volume element in $\mathrm{m^3\,s^{-3}}$. The denominator
    $n_{\mathrm{ref},s}T_{\mathrm{ref},s}$ is a reference pressure; if temperature
    is supplied in eV it must be converted to joules for this expression.


    In linear gyrokinetic analysis this moment is computed by applying the parallel-pressure
    velocity-space weight to the particle perturbed distribution eigenfunction and
    integrating over velocity space. When the same reference pressure and particle
    distribution are used, the scalar normalized perturbed pressure is related to
    the gyrotropic components by $\widehat{p}_s^{\mathrm{part}}=(\widehat{p}_{\parallel
    s}^{\mathrm{part}}+2\widehat{p}_{\perp s}^{\mathrm{part}})/3$; this trace relation
    does not specify nongyrotropic or off-diagonal pressure-tensor moments. The particle
    moment should not be assumed equal to the gyrocenter parallel pressure moment,
    because the variables used in the velocity-space moment are different.


    Typical magnitudes are normalization dependent. With unit-amplitude eigenfunction
    normalizations, values from about $10^{-3}$ to $10$ are common, while ratios between
    species, radial locations, or pressure components and the relative complex phase
    usually carry more physical meaning than the absolute magnitude.


    For a linear eigenmode the overall complex amplitude and phase are arbitrary.
    A self-contained convention is obtained by choosing one reference eigenfunction
    component to be real with a fixed positive value; changing that choice multiplies
    all complex moments by the same complex constant, leaving relative phases and
    normalized ratios invariant.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_gyrocenter_perturbed_pressure
  - name:perpendicular_normalized_perturbed_pressure
  - name:normalized_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_current_density
  arguments:
  - name: normalized_particle_perturbed_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_particle/pressure_parallel
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_particle/pressure_parallel
    status: attached
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/pressure_parallel
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/pressure_parallel
    status: composed
- name: perpendicular_normalized_particle_perturbed_pressure
  kind: scalar
  status: draft
  description: Dimensionless perpendicular-pressure moment of the perturbed particle
    distribution of a linear gyrokinetic eigenmode, normalized by a reference thermal
    pressure. It is the second velocity-space moment in perpendicular kinetic energy
    of the perturbed distribution rather than an independent thermodynamic pressure.
  documentation: 'Perpendicular normalized particle perturbed pressure is the dimensionless
    perpendicular-pressure moment of the perturbed particle distribution function
    for a linear gyrokinetic eigenmode. It measures the fluctuating perpendicular
    thermal energy density carried by the perturbed distribution, expressed in particle
    (laboratory) velocity variables and scaled by a reference thermal pressure. It
    is a velocity-space moment of the perturbation, not an independent thermodynamic
    state variable.


    For species $s$, the normalized perpendicular pressure moment is


    $$

    \delta \hat{p}^{\mathrm{particle}}_{\perp s} = \frac{1}{n_{\mathrm{ref}} T_{\mathrm{ref}}}
    \int \frac{m_s v_\perp^2}{2}\, \delta f^{\mathrm{particle}}_s(\mathbf{x},\mathbf{v},t)\,
    d^3v

    $$


    where $m_s$ is the particle mass in kg, $v_\perp$ is the speed perpendicular to
    the equilibrium magnetic field in m s$^{-1}$, $\delta f^{\mathrm{particle}}_s$
    is the perturbed particle distribution in units m$^{-3}$ (m s$^{-1}$)$^{-3}$,
    and the velocity-space element $d^3v$ has units (m s$^{-1}$)$^3$. The reference
    density $n_{\mathrm{ref}}$ is in m$^{-3}$ and the reference temperature $T_{\mathrm{ref}}$
    is an energy per particle in J; a temperature given in eV must be multiplied by
    the elementary charge before forming the reference pressure $n_{\mathrm{ref}}
    T_{\mathrm{ref}}$.


    The perpendicular and parallel particle pressure moments combine into the total
    particle pressure moment of the eigenmode. With the perpendicular component counting
    the two degrees of freedom orthogonal to $\mathbf{B}$ and the parallel component
    the single field-aligned degree of freedom, the trace-weighted combination $\delta
    \hat{p}^{\mathrm{particle}}_s = (2\,\delta \hat{p}^{\mathrm{particle}}_{\perp
    s} + \delta \hat{p}^{\mathrm{particle}}_{\parallel s})/3$ recovers normalized_total_perturbed_particle_pressure_of_gyrokinetic_eigenmode,
    where $\delta \hat{p}^{\mathrm{particle}}_{\parallel s}$ is [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure).
    The difference between this particle-frame moment and its gyrocenter counterpart
    [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)
    reflects the coordinate transformation between particle and gyrocenter velocity
    variables.


    The moment is obtained by integrating the eigenmode perturbed distribution over
    velocity space in particle variables; the reference density and temperature defining
    the normalization are part of the prescribed normalization convention of the calculation.
    Because a linear eigenmode has an arbitrary overall amplitude, no absolute magnitude
    range is meaningful: the quantity scales with the chosen eigenfunction normalization
    and is generally complex.


    The complex value carries both magnitude and phase relative to the arbitrary global
    phase of the eigenmode, which is itself set by the eigenfunction normalization
    convention. Only relative magnitudes and phase differences between moments of
    the same eigenmode are physically meaningful; the sign of the real part by itself
    is not an invariant quantity.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: normalized_particle_perturbed_pressure
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_particle/pressure_perpendicular
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_particle/pressure_perpendicular
    status: attached
