name: elongation_of_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Ratio of the vertical to horizontal half-widths of the plasma boundary
  cross section, $\kappa = b/a$ where $b$ and $a$ are the vertical and horizontal
  extents.
documentation: "The elongation $\\kappa$ characterizes the vertical stretching of\
  \ the plasma boundary in the poloidal plane, defined as $\\kappa = (Z_{\\max} -\
  \ Z_{\\min}) / (R_{\\max} - R_{\\min})$ where $Z_{\\max,\\min}$ and $R_{\\max,\\\
  min}$ are the extremal vertical and radial coordinates of the last closed flux surface\
  \ (or separatrix). Typical values range from 1.0 (circular cross section) to 1.6\u2013\
  2.0 in shaped tokamak plasmas such as DIII-D ($\\kappa \\approx 1.8$) and ITER ($\\\
  kappa \\approx 1.85$). Higher elongation increases the plasma cross-sectional area\
  \ at fixed minor radius $a$, raising the achievable plasma current and fusion power\
  \ density, but also drives vertical instability requiring active feedback control.\
  \ The quantity is obtained from equilibrium reconstruction codes (EFIT, LIUQE) or\
  \ direct parametric fitting of the boundary shape. See `upper_elongation_of_plasma_boundary`\
  \ and `lower_elongation_of_plasma_boundary` for the half-plane decomposition, and\
  \ `minor_radius` for the horizontal half-width."
