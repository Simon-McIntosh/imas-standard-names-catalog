- name: launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Net RF power entering the vacuum vessel from one lower-hybrid antenna
    after reflected power is subtracted from incident forward power.
  documentation: 'Launched power of a lower-hybrid antenna is the nonnegative net
    RF power entering the vacuum vessel at the antenna interface. It is the per-antenna
    component of the wave-power budget represented by [power of a lower-hybrid antenna](name:power_of_lower_hybrid_antenna).


    The launched power is defined by:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the incident RF power propagating toward the antenna
    input reference plane and $P_\mathrm{reflected}$ is the RF power returning toward
    the transmission line from that plane. The resulting quantity is distinct from
    [forward power of a lower-hybrid antenna](name:forward_power_of_lower_hybrid_antenna)
    and is not summed over multiple antennas.'
  unit: W
  physics_domain: auxiliary_heating
