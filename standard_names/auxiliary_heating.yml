- name: radius_of_antenna_strap
  kind: scalar
  status: active
  description: Radius of an antenna strap is the perpendicular distance from the strap
    conductor axis to a circular cylindrical boundary of its annular cross-section.
    The unqualified parent covers either boundary; inner and outer radii are the boundary-specific
    quantities.
  documentation: 'Radius of an antenna strap is the perpendicular distance from the
    strap conductor axis to a circular cylindrical boundary of its annular cross-section.
    The unqualified quantity identifies the common boundary-radius concept without
    selecting the inner or outer surface.


    Use [inner radius of antenna strap](name:inner_radius_of_antenna_strap) and [outer
    radius of antenna strap](name:outer_radius_of_antenna_strap) when the selected
    annular boundary is part of the meaning; if $r_\mathrm{in}$ and $r_\mathrm{out}$
    denote those two boundary radii, then $0 \le r_\mathrm{in} \le r_\mathrm{out}$.
    This quantity is distinct from [height of antenna strap](name:height_of_antenna_strap),
    [toroidal width of antenna strap](name:toroidal_width_of_antenna_strap), and the
    major-radius coordinate $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.'
