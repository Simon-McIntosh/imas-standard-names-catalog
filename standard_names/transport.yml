- name: radial_neutral_state_energy_flux
  kind: scalar
  status: draft
  description: Radial component of the energy flux density for neutral atoms in a
    specific charge state.
  documentation: The radial component $Q_{n,z}^{(r)}$ of the neutral energy flux density
    for a given charge state quantifies the outward transport of kinetic energy carried
    by neutral atoms across flux surfaces in the radial direction. It is governed
    by the velocity distribution moments of the neutral population and serves as a
    closure term in the neutral energy transport equation. In edge-plasma codes, this
    flux is typically computed from kinetic neutral transport models or fluid approximations.
    Cross-reference the parent vector quantity [neutral_state_energy_flux](name:neutral_state_energy_flux)
    and the related parallel projection [parallel_neutral_state_energy_flux](name:parallel_neutral_state_energy_flux).
    See also the momentum counterpart [radial_neutral_state_momentum_flux](name:radial_neutral_state_momentum_flux)
    and the single-state neutral energy flux [radial_neutral_energy_flux](name:radial_neutral_energy_flux).
  unit: W.m^-2
  physics_domain: transport
