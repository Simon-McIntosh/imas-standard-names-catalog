- name: xenon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of xenon impurity ions in the plasma layer incident
    on the divertor target surface.
  documentation: 'Xenon is injected as a radiating impurity to mitigate divertor heat
    fluxes, and its local density at the target determines the ionization balance
    and radiative losses in the divertor region. The density is typically inferred
    from spectroscopic measurements of Xe emission lines combined with collisional-radiative
    modeling, or from Langmuir probe data with appropriate impurity fractions. Typical
    values range from $10^{16}$ to $10^{19}\,\text{m}^{-3}$ in detached divertor conditions,
    depending on the seeding rate and plasma transport. This quantity is linked to
    the total divertor impurity content via the relation to the electron density,
    with $n_{\text{Xe}} \ll n_e$ in most operational scenarios. See also [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target)
    and [tungsten_density_at_divertor_target](name:tungsten_density_at_divertor_target)
    for comparisons with other impurity species.


    Sign convention: Positive when the number density of xenon ions is defined as
    a non-negative real number (density is a nonnegative scalar field).


    $n_{\text{Xe}}$ is a scalar density, always nonnegative; no sign variation applies.'
  unit: m^-3
  physics_domain: divertor_physics
