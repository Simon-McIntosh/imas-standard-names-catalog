name: radial_component_of_neutral_momentum_flux
description: Radial projection of the neutral-species momentum flux density, capturing
  both convective and viscous neutral momentum transport.
documentation: "The radial neutral momentum flux $\\Pi_{r}^{n}$ (unit $\\mathrm{kg\\\
  ,m^{-1}\\,s^{-2}}$) represents the rate of momentum transfer per unit area in the\
  \ radial direction carried by neutral particles, combining convective streaming\
  \ $n_n m_n v_{r,n} \\mathbf{v}_n$ and pressure/viscous contributions, where $n_n$\
  \ is the neutral number density, $m_n$ the neutral mass, and $v_{r,n}$ the radial\
  \ velocity component. In edge plasma codes this flux is evaluated on a GGD mesh\
  \ and governs the neutral momentum balance that couples to the ion momentum equation\
  \ through charge-exchange and ionization reactions. Typical magnitudes depend strongly\
  \ on the neutral penetration depth; in high-recycling divertor conditions values\
  \ of order $10^{-2}$\u2013$1\\;\\mathrm{Pa}$ (equivalently $\\mathrm{kg\\,m^{-1}\\\
  ,s^{-2}}$) are common near the target plates. Accurate modeling of this flux is\
  \ essential for predicting divertor detachment and momentum removal. See also `fast_neutral_number_density`\
  \ for the supra-thermal neutral population that can dominate the high-energy tail\
  \ of this flux."
kind: vector_component
unit: kg.m^-1.s^-2
status: draft
