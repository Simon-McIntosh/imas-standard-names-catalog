      kind: llm
- name: thermal_power_of_plant_component_port
  kind: scalar
  status: active
  description: Rate of heat removed from a plant component by coolant, determined
    by the coolant enthalpy increase between the associated inlet and outlet.
  documentation: 'Thermal power at a plant-component port is the rate of heat energy
    transferred from the component into the coolant circuit. It is the thermal component
    of [power of a plant component port](name:power_of_plant_component_port).


    The defining relation is


    $$

    P_\mathrm{th} = \dot{m}\left(h_\mathrm{out}-h_\mathrm{in}\right)

    $$


    where $P_\mathrm{th}$ is thermal power, $\dot{m}$ is coolant mass flow rate in
    kg s$^{-1}$, and $h_\mathrm{in}$ and $h_\mathrm{out}$ are the coolant specific
    enthalpies at the inlet and outlet in J kg$^{-1}$, respectively.


    Positive values mean that the coolant gains enthalpy along the flow path and therefore
    removes heat from the plant component. This quantity excludes electrical, radiative,
    and other non-coolant-mediated power transfers.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_component_port
  arguments:
  - name: power_of_plant_component_port
    operator: thermal
    operator_kind: qualifier
  sources:
