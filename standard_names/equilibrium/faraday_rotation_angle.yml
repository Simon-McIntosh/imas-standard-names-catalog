name: faraday_rotation_angle
status: draft
description: Rotation of the plane of polarization of a probing electromagnetic wave
  caused by the magneto-optic Faraday effect in the plasma.
documentation: The Faraday rotation angle $\alpha_F$ quantifies the cumulative rotation
  of the polarization plane of a linearly polarized beam (typically a far-infrared
  or CO$_2$ laser) traversing the plasma along a chord $L$. It is given by $\alpha_F
  = \frac{e^3 \lambda^2}{8 \pi^2 \epsilon_0 m_e^2 c^3} \int_L n_e(l)\, B_\parallel(l)\,
  dl$, where $\lambda$ is the probe wavelength, $n_e$ the local electron density,
  $B_\parallel$ the magnetic field component parallel to the beam path, $e$ and $m_e$
  the electron charge and mass, $\epsilon_0$ the vacuum permittivity, and $c$ the
  speed of light. Because $\alpha_F$ depends on the product $n_e B_\parallel$, polarimetry
  combined with independent density measurements (e.g., interferometry) provides internal
  magnetic-field information used in equilibrium reconstruction. Measured values typically
  range from a few milliradians to several degrees depending on wavelength, path length,
  and plasma parameters. The companion constraint weight controls the influence of
  this measurement in the $\chi^2$ fit. See `equilibrium_reconstruction_constraint_weight_of_faraday_angle`
  and `poloidal_magnetic_flux`.
