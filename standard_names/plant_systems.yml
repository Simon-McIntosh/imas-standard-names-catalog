      unit: J
    enhanced_context:
      description: Cumulative thermal energy extracted from a calorimetry component
        since the start of the pulse. Derived from the time-integral of the measured
        coolant enthalpy balance over the measurement interval.
      kind: llm
- name: thermal_power_at_inlet
  kind: scalar
  status: active
  description: Thermal power delivered to the heat-input side of a power conversion
    system, representing the rate of recoverable heat entering the cycle prior to
    thermal-to-electric conversion.
  documentation: "The thermal power at inlet quantifies the rate of thermal energy\
    \ crossing the inlet boundary of a power conversion system. It represents the\
    \ total recoverable heat flowing into the cycle from primary heat-transfer circuits\
    \ \u2014 such as blanket coolant loops and divertor circuits in a fusion plant\
    \ \u2014 before any conversion into electrical work. This quantity is the thermal\
    \ specialization of the more general [power_at_inlet](name:power_at_inlet), which\
    \ encompasses all power forms at the system inlet.\n\nThe thermodynamic conversion\
    \ efficiency $\\eta_{th}$ links this quantity to the gross electrical output $P_{elec}$\
    \ via:\n\n$$\n\\eta_{th} = \\frac{P_{elec}}{P_{th,in}}\n$$\n\nwhere $P_{th,in}$\
    \ is the thermal power at inlet and $P_{elec}$ is the gross electrical power delivered\
    \ by the conversion cycle.\n\nThe child quantity [total_thermal_power_at_inlet](name:total_thermal_power_at_inlet)\
    \ gives the gross aggregate thermal input summed over all heat sources entering\
    \ the cycle. The rejected heat leaving the cycle is captured by [thermal_power_at_outlet](name:thermal_power_at_outlet),\
    \ and together these quantities constrain the [thermal_efficiency_of_plant_system](name:thermal_efficiency_of_plant_system).\
    \ In fusion power plant studies, the thermal power at inlet from blanket and divertor\
    \ circuits is expected to reach the multi-gigawatt range for reactor-scale devices."
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_at_inlet
  - name:total_thermal_power_at_inlet
  - name:thermal_power_at_outlet
  - name:thermal_efficiency_of_plant_system
  arguments:
  - name: power_at_inlet
    operator: thermal
    operator_kind: qualifier
- name: thermal_power_at_outlet
  kind: scalar
  status: active
  description: Thermal power rejected through a system outlet as waste heat rather
    than converted into useful electrical output.
  documentation: 'Thermal outlet power is the rate at which energy leaves a power-conversion
    system through its outlet as rejected heat. It is the thermal-waste component
    of [power at outlet](name:power_at_outlet), distinct from energy converted into
    useful electrical output.


    $$

    P_{\mathrm{th,out}} = \frac{dE_{\mathrm{waste}}}{dt}

    $$


    where $P_{\mathrm{th,out}}$ is the thermal outlet power, $E_{\mathrm{waste}}$
    is cumulative rejected thermal energy, and $t$ is time.


    The quantity is a rate, not cumulative thermal energy, and includes the common
    physical meaning represented by [total thermal power at outlet](name:total_thermal_power_at_outlet).'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_outlet
  arguments:
  - name: power_at_outlet
    operator: thermal
    operator_kind: qualifier
- name: thermal_power_of_breeder_blanket
  kind: scalar
  status: active
  description: Thermal power of the breeder blanket is the integrated non-nuclear
    heat load entering the blanket through its plasma-facing surface, excluding volumetric
    neutron and photon heating. It is a blanket-level surface-deposition power, distinct
    from module-level coolant heat removal.
  documentation: 'Thermal power of the breeder blanket is the total rate at which
    non-nuclear thermal energy enters the breeder blanket through its plasma-facing
    surface. It represents an integrated surface heat load on the blanket, not a local
    heat-flux density.


    For a surface heat-load representation, the integrated power is defined by the
    area integral of the local non-nuclear heat flux entering the blanket:


    $$

    P_{\mathrm{th,bb}} = \int_{A_{\mathrm{pf,bb}}} q_{\mathrm{th}} \, dA

    $$


    where $P_{\mathrm{th,bb}}$ is the thermal power of the breeder blanket, $A_{\mathrm{pf,bb}}$
    is the plasma-facing surface area of the breeder blanket included in the blanket-level
    total, $q_{\mathrm{th}}$ is the local non-nuclear heat-flux density directed into
    the blanket, and $dA$ is the surface element.


    This quantity excludes volumetric neutron and photon energy deposition in blanket
    material, which is represented by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket).
    It also differs from [thermal_power_of_breeder_blanket_module](name:thermal_power_of_breeder_blanket_module),
    which denotes module-level thermal power associated with an individual breeder-blanket
    module rather than the blanket-level plasma-facing surface load.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_breeder_blanket
  - name:nuclear_heating_power_of_breeder_blanket
  arguments:
  - name: power_of_breeder_blanket
    operator: thermal
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_plant/heat_load_breeder
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-heat_load_breeder
    dd_documentation:
