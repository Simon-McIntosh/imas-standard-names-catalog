name: electron_density_pedestal_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate of the electron density pedestal
  top from an mtanh profile fit.
documentation: "The electron density pedestal position $\\psi_{N,\\mathrm{ped}}$ identifies\
  \ the inner boundary of the steep-gradient pedestal region in the electron density\
  \ profile, as extracted from a modified hyperbolic tangent (mtanh) fit. In the mtanh\
  \ parameterization, this corresponds to the location where the profile transitions\
  \ from the flat pedestal-top value to the steep gradient zone. Typical values fall\
  \ in the range $\\psi_N \\approx 0.90$\u2013$0.97$, shifting inward with increasing\
  \ triangularity and heating power. The pedestal position, together with the pedestal\
  \ width and height, constitutes the essential set of parameters characterizing the\
  \ H-mode transport barrier. It is derived from Thomson scattering or lithium-beam\
  \ emission profile data. See also `electron_density_pedestal_width` and `electron_density_pedestal_maximum_gradient_position`."
