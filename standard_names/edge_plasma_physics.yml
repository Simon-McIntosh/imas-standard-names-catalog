- name: radial_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: "Dimensionless momentum-flux-density limiter that scales the collisionless\
    \ free-streaming bound for gradient-driven radial momentum transport in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame. It caps the modeled radial momentum-flux density\
    \ while leaving its direction set by the underlying transport closure."
  documentation: 'The radial momentum coefficient is a dimensionless flux-limiter
    parameter for gradient-driven momentum transport in the cylindrical $\hat{R}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R},
    \hat{\phi}, \hat{Z})$, where $R$ is major radius measured from the symmetry axis,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It scales the collisionless
    free-streaming bound used to limit the modeled radial momentum-flux density without
    determining whether the flux is inward or outward.


    The bound imposed by the coefficient is:


    $$

    |\Pi_R^{\mathrm{lim}}| \le C_R \, \Pi_R^{\mathrm{FS}}

    $$


    where $C_R$ is the radial momentum coefficient, $\Pi_R^{\mathrm{lim}}$ is the
    limited radial momentum-flux density, and $\Pi_R^{\mathrm{FS}}$ is the non-negative
    collisionless free-streaming reference scale; both $\Pi_R^{\mathrm{lim}}$ and
    $\Pi_R^{\mathrm{FS}}$ are expressed in pascals.


    This coefficient specifies only the multiplier on the free-streaming bound; the
    algebraic limiter used to approach the bound is a separate transport-closure choice.
    It is the radial-direction specialization of [momentum_flux_limiter_coefficient](name:momentum_flux_limiter_coefficient)
    and the component-family counterpart of [poloidal_momentum_flux_limiter_coefficient](name:poloidal_momentum_flux_limiter_coefficient).
    Here radial means projection onto $\hat{R}$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame, not projection along the normal to a magnetic flux surface; any
    inward or outward sign belongs to the limited momentum-flux density, not to the
    coefficient.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_flux_limiter_coefficient
  - name:radial_ion_momentum_flux_limiter_coefficient
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: toroidal_neutral_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Dimensionless toroidal momentum flux-limiter coefficient that scales
    the free-streaming upper bound on neutral-particle momentum-flux density in edge-plasma
    transport closures.
  documentation: 'The toroidal neutral momentum flux-limiter coefficient is the toroidal
    component of the neutral-particle specialization of the general momentum flux-limiter
    coefficient vector, providing the dimensionless limiter factor for neutral momentum
    transport along $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame
    with basis $(\hat{R}, \hat{\phi}, \hat{Z})$, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It bounds the toroidal neutral
    momentum-flux density, preventing unphysical exceedance of the free-streaming
    upper limit when the neutral mean free path is large relative to macroscopic gradient
    scales.


    The toroidal component $\alpha_\phi$ is defined as the nonnegative limiter multiplying
    the positive free-streaming upper bound on the magnitude of the toroidal neutral
    momentum-flux density:


    $$

    |\Pi_\phi| \le \alpha_\phi \, \Pi_{\phi,\max}^{\rm free}, \qquad 0 \le \alpha_\phi
    \le 1

    $$


    where $\Pi_\phi$ is the modeled toroidal neutral momentum-flux density and $\Pi_{\phi,\max}^{\rm
    free}$ is the free-streaming upper bound for the magnitude of the same component.


    This coefficient applies to neutral-particle momentum aggregated over internal
    neutral states. It is the toroidal projection of the [neutral momentum flux-limiter
    coefficient](name:neutral_momentum_flux_limiter_coefficient), distinct from the
    [parallel neutral momentum flux-limiter coefficient](name:parallel_neutral_momentum_flux_limiter_coefficient),
    the [vertical neutral momentum flux-limiter coefficient](name:vertical_neutral_momentum_flux_limiter_coefficient),
    and the [toroidal neutral internal-state momentum flux-limiter coefficient](name:toroidal_neutral_internal_state_momentum_flux_limiter_coefficient).
    The coefficient limits only the magnitude of the $\hat{\phi}$ component and does
    not define the direction of the momentum flux itself.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neutral_internal_state_momentum_flux_limiter_coefficient
  - name:neutral_momentum_flux_limiter_coefficient
  arguments:
