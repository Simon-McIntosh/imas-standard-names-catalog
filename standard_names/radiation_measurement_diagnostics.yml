    enhanced_context:
      description: Calibrated and background-subtracted spectral radiance integrated
        over a specific emission line, as measured by a grating spectrometer channel.
        Used for passive emission spectroscopy and quantitative line intensity analysis.
      kind: llm
- name: radiated_power_over_core_region
  kind: scalar
  status: active
  description: Total electromagnetic power radiated by plasma inside the last closed
    flux surface, representing the core-region contribution to global radiative energy
    loss.
  documentation: 'Radiated power over the core region is the total electromagnetic
    energy-loss rate carried away by radiation emitted within the plasma volume inside
    the last closed flux surface (LCFS). It is a regional integral rather than a local
    radiated-power density.


    The defining volume integral is


    $$

    P_{\rm core} = \int_{V_{\rm core}} p_{\rm rad}(\mathbf{r})\,dV

    $$


    where $P_{\rm core}$ is the core-region radiated power, $p_{\rm rad}(\mathbf{r})$
    is the local volumetric radiated-power density at position $\mathbf{r}$, $V_{\rm
    core}$ is the plasma volume inside the LCFS, and $dV$ is the differential volume
    element.


    The quantity includes the aggregate electromagnetic radiation from all emission
    channels within the LCFS. It excludes radiation emitted in the scrape-off layer,
    divertor, and other plasma regions outside the LCFS; it is therefore distinct
    from [total plasma radiated power](name:total_plasma_radiated_power), which integrates
    radiation over the full plasma volume.


    The integrand is the local [power density due to radiation](name:power_density_due_to_radiation),
    and integration over the core region gives its corresponding regional total.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:total_plasma_radiated_power
  sources:
  - dd_path: bolometer/power_radiated_inside_lcfs
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/bolometer.html#bolometer-power_radiated_inside_lcfs
    dd_documentation:
      leaf: Radiated power from the plasma inside the Last Closed Flux Surface, reconstructed
        from bolometry data
      data_type: FLT_1D
      unit: W
      coordinates:
      - bolometer/time
    enhanced_context:
      description: Total radiated power (Prad) from the plasma inside the last closed
        flux surface (LCFS), reconstructed from multi-channel bolometer data. A key
        global power balance quantity for energy transport and impurity radiation
        analysis.
      kind: llm
  - dd_path: summary/global_quantities/power_radiated_inside_lcfs/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_radiated_inside_lcfs-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/power_radiated_inside_lcfs
      parent: Radiated power from the plasma inside the Last Closed Flux Surface
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Total power radiated from the plasma inside the last closed flux
        surface (LCFS), a key global energy loss channel. Used to compute the power
        balance and assess the fraction of heating power lost to radiation before
        reaching the scrape-off layer.
      kind: template
- name: ratio_of_neutral_density_of_isotope_to_difference_of_total_neutral_density_and_neutral_density_of_isotope
  kind: scalar
  status: active
  description: Odds ratio of the neutral density of a selected hydrogen isotope to
    the summed neutral density of all other hydrogen isotopes, distinguishing composition
    odds from total isotope fraction.
  documentation: 'This quantity is the neutral-population odds ratio for one selected
    hydrogen isotope relative to all other hydrogen isotopes. It characterizes isotope
    composition using neutral atoms only, with the comparison population aggregated
    across every other isotope.


    $$

    R_i = \frac{n_i}{\sum_{j \ne i} n_j}

    $$


    Here, $R_i$ is the isotope density ratio, $i$ identifies the selected hydrogen
    isotope, $n_i$ is its neutral number density, and $n_j$ is the neutral number
    density of another hydrogen isotope. The summation includes all hydrogen isotopes
    other than the selected isotope.


    The denominator is a total over the other neutral isotope populations, while the
    numerator contains only the selected isotope. This quantity excludes ionized populations
    and differs from [total_hydrogenic_density](name:total_hydrogenic_density), which
    includes the hydrogenic population across its applicable charge states and isotopes.
    It is an odds ratio rather than the selected isotope''s fraction of the total
    neutral population; if $f_i$ denotes that corresponding neutral isotope fraction,
    then $f_i = R_i/(1+R_i)$.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: spectrometer_visible/channel/isotope_ratios/isotope/density_ratio
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-isotope_ratios-isotope-density_ratio
    dd_documentation:
      leaf: Ratio of the density of neutrals of this isotope over the summed neutral
        densities of all other isotopes described in the ../isotope array
      parent_path: spectrometer_visible/channel/isotope_ratios/isotope
      parent: Set of isotopes
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - spectrometer_visible/channel/isotope_ratios/isotope/time
    enhanced_context:
      description: Ratio of the neutral density of a given hydrogen isotope to the
        summed neutral densities of all other isotopes in the measurement channel.
        Used to quantify the hydrogen fuel isotope composition from visible spectroscopy.
      kind: llm
- name: spectral_bremsstrahlung_radiance
  kind: scalar
  status: active
  description: Photon-number radiance of free-free plasma emission resolved per unit
    wavelength and viewing direction.
  documentation: 'Bremsstrahlung spectral radiance is the directional photon-number
    radiance of the free-free continuum emitted when plasma electrons accelerate in
    Coulomb fields of charged particles. It represents the continuum contribution
    to radiation resolved spectrally rather than a discrete emission transition.


    For wavelength-resolved photon radiance, the defining relation is:


    $$

    L^{\mathrm{ff}}_{\lambda} = \frac{dN_{\gamma}}{dA_{\perp}\,dt\,d\Omega\,d\lambda}

    $$


    where $L^{\mathrm{ff}}_{\lambda}$ is the bremsstrahlung spectral radiance, $N_{\gamma}$
    is the photon count, $A_{\perp}$ is area projected normal to the viewing direction,
    $t$ is time, $\Omega$ is solid angle, and $\lambda$ is wavelength. The superscript
    $\mathrm{ff}$ denotes free-free bremsstrahlung.


    This quantity applies to plasma bremsstrahlung accumulated along a viewing direction,
    with photon emission resolved by wavelength and solid angle. It is a continuum
    radiance and is not integrated over wavelength, summed over viewing directions,
    or restricted to a specified emitting species when no such restriction is stated.


    It is the mechanism-specific component of the broader [spectral radiance](name:spectral_radiance),
    which includes plasma emission resolved by wavelength and viewing direction without
    restricting the emission mechanism. Unlike [photon radiance at a spectral line](name:photon_radiance_at_spectral_line),
    it describes continuum emission rather than radiation integrated over a discrete
    spectral transition.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance
