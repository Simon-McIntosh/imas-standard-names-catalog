- name: radial_current_density_due_to_inertial
  kind: scalar
  status: draft
  description: Radial component of the plasma current density arising from the ion
    polarization drift, representing the inertial response of the plasma to time-varying
    electric fields. Defined in the cylindrical (R, phi, Z) frame, it is a key term
    in radial force balance and toroidal angular momentum transport.
  documentation: 'This quantity is the radial ($R$) component of the inertial current
    density $\mathbf{j}_{\text{inertial}}$. In the MHD framework it is the leading-order
    term from the momentum equation, neglecting displacement current, and is expressed
    as $j_{\text{inertial}}^r \simeq (n_i m_i / B^2) \partial E_\perp / \partial t$,
    where $n_i$ is ion density, $m_i$ ion mass, $B$ magnetic field magnitude, and
    $E_\perp$ the perpendicular electric field. This current arises from the ion polarization
    drift in time-varying electric fields and is distinct from the diamagnetic drift
    current, which originates from pressure gradients. Typical magnitudes range from
    $10^3$ to $10^5$ A/m$^2$ in the core and $10$ to $100$ kA/m$^2$ in the edge of
    H-mode tokamak plasmas. It constrains the radial electric field via quasi-neutrality
    and is routinely derived from experimental profiles or gyrokinetic simulations.\n\nSign
    convention: Positive when the radial component points outward from the magnetic
    axis in the $(R, \phi, Z)$ cylindrical system.'
  unit: A.m^-2
  physics_domain: transport
  links:
