- name: vertical_coordinate_of_beamlet_group
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the beamlet group centroid for a neutral\
    \ beam injector unit in the cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z_{\mathrm{bg}}$ defines the height of
    the neutral beam injector beamlet group centroid relative to the machine midplane
    ($Z=0$) in the right-handed cylindrical $(R, \phi, Z)$ system. This geometric
    quantity positions the beamlet group along the machine symmetry axis and is used
    together with [major_radius_of_beamlet_group](name:major_radius_of_beamlet_group)
    to locate the beamlet group in the poloidal plane. Typical values for medium-size
    tokamaks range from $-2$ m to $+2$ m, depending on the port and injector geometry;
    for ITER, the NBI beamlet groups lie near $Z\approx \pm 1.5$ m. The vertical coordinate
    is obtained from CAD models or engineering drawings of the neutral beam injector
    assembly.


    Sign convention: Positive when the beamlet group centroid lies above the $Z=0$
    midplane (in the direction of $+\hat{Z}$).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:major_radius_of_beamlet_group
  sources:
  - id: dd:nbi/unit/beamlets_group/beamlets/positions/z
    dd_path: nbi/unit/beamlets_group/beamlets/positions/z
    status: composed
  - id: dd:nbi/unit/beamlets_group/position/z
    dd_path: nbi/unit/beamlets_group/position/z
    status: composed
- name: vertical_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: "Vertical height (Z) coordinate of the neutral-beam-injector diagnostic\
    \ aperture center in the right-handed cylindrical (R, \u03C6, Z) reference frame."
  documentation: 'The vertical coordinate $Z_{\rm ap}$ defines the height of the neutral
    beam aperture center relative to the tokamak midplane in the IMAS cylindrical
    $(R, \phi, Z)$ frame. This aperture sets the beam footprint and collimation geometry
    for the injected neutral beam. Typical vertical positions range from $-2$ m to
    $+2$ m depending on the injection port height, and are measured during facility
    commissioning or alignment. The quantity pairs with $R_{\rm ap}$ (`major_radius_of_neutral_beam_injector`)
    to locate the aperture in 2-D, and is part of the same beamline characterisation
    family as `vertical_coordinate_of_beamlet_group` and `vertical_coordinate_of_neutral_beam_injector`.


    Sign convention: Positive when the aperture center lies above the $Z=0$ midplane
    of the machine.


    In tokamaks with multiple NBI ports, each aperture has a distinct vertical coordinate;
    this quantity identifies the specific one referenced by the `diagnostic_aperture`
    object in the standard-name grammar.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:nbi/unit/aperture/centre/z
    dd_path: nbi/unit/aperture/centre/z
    status: composed
- name: vertical_coordinate_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the neutral beam injector source center in\
    \ the cylindrical (R, \u03C6, Z) reference frame."
  documentation: 'The vertical coordinate $Z_{\text{source}}$ of the neutral beam
    injector source center defines the height of the beam extraction point relative
    to the tokamak midplane. This geometric parameter is essential for determining
    the beam line of sight and the intersection of the injected beam with the magnetic
    flux surfaces. The vertical position is measured in the IMAS right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z$ is the vertical height above the tokamak midplane
    in meters.


    Sign convention: Positive when the source center lies above the tokamak midplane
    ($Z = 0$).


    Typical values range from $Z \approx -1$ m to $+1.5$ m for medium-sized tokamaks
    such as DIII-D or JET, and up to several meters for larger devices like ITER.
    The vertical coordinate is obtained from engineering CAD models or alignment surveys
    of the neutral beam injector assembly. This quantity pairs with the major radius
    coordinate to give the full two-dimensional source position in the poloidal plane,
    as seen in [major_radius_of_neutral_beam_injector](name:major_radius_of_neutral_beam_injector).
    Closely related geometric descriptors for beam components include [vertical_coordinate_of_beamlet_group](name:vertical_coordinate_of_beamlet_group)
    and [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:major_radius_of_neutral_beam_injector
  - name:vertical_coordinate_of_beamlet_group
  - name:vertical_coordinate_of_diagnostic_aperture
  sources:
  - id: dd:nbi/unit/source/centre/z
    dd_path: nbi/unit/source/centre/z
    status: composed
- name: vertical_width_of_beamlet_group
  kind: scalar
  status: draft
  description: Vertical width of a neutral beam injector beamlet group measured at
    the exit plane of the ion source.
  documentation: "The vertical width $w_v$ of a beamlet group characterizes the spatial\
    \ extent of the array of beamlets in the vertical direction at the exit surface\
    \ of the neutral beam injector ion source. This geometric parameter, together\
    \ with the major radius $R$ of the beamlet group, defines the injection aperture\
    \ and influences beam divergence and power deposition profiles in the plasma.\
    \ Typical values for medium-size tokamaks are in the range 0.1\u20130.5 m, depending\
    \ on the number of beamlets and source design. The quantity is measured during\
    \ factory acceptance tests or inferred from beamline alignment surveys.\n\nSign\
    \ convention: Positive when the vertical coordinate increases upward in the tokamak\
    \ frame.\n\nSee also [major_radius_of_beamlet_group](name:major_radius_of_beamlet_group)\
    \ for the radial position and [vertical_minimum_width_of_beamlet_group](name:vertical_minimum_width_of_beamlet_group)\
    \ for the focused minimum width at the focal plane."
  unit: m
  physics_domain: auxiliary_heating
  links:
