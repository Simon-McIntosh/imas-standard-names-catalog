name: total_neutron_flux
status: draft
cocos_transformation_type: one_like
description: Total rate of neutron emission from the plasma integrated over all energies
  and solid angles, expressed in neutrons per second.
documentation: "The total neutron flux $\\Phi_n$ (s$^{-1}$) is the volume-integrated\
  \ neutron emission rate summing contributions from all fusion channels, principally\
  \ $\\mathrm{D}(\\mathrm{D},n){}^3\\mathrm{He}$ (2.45\\,MeV neutrons) in deuterium\
  \ plasmas and $\\mathrm{D}(\\mathrm{T},n){}^4\\mathrm{He}$ (14.1\\,MeV neutrons)\
  \ in D-T operation. It is related to the fusion power by $P_{\\mathrm{fus}} = E_{\\\
  mathrm{fus}} \\, \\Phi_n$, where $E_{\\mathrm{fus}}$ is the energy released per\
  \ fusion reaction. Typical values range from $10^{13}$\u2013$10^{16}$\\,s$^{-1}$\
  \ in present-day D-D experiments to $\\sim 10^{20}$\\,s$^{-1}$ projected for ITER\
  \ D-T operation. The quantity is measured by calibrated fission chambers, activation\
  \ foils, and scintillation detectors positioned around the vacuum vessel. See `fusion_power`\
  \ for the derived thermal power and `neutron_detector_spectrum_sampling_time` for\
  \ the spectral acquisition cadence."
