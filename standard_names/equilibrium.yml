- name: major_radius_of_current_center
  kind: scalar
  status: draft
  description: Major radius coordinate of the current centroid, defined by the toroidal
    current density-weighted average over the poloidal cross-section.
  documentation: "The major radius of the current center, $R_{\\mathrm{cc}}$, locates\
    \ the centroid of the toroidal plasma current distribution. It is computed as\
    \ $R_{\\mathrm{cc}} = (\\iint j_\\phi R\\, dS) / I_p$, where $j_\\phi$ is the\
    \ toroidal current density, $R$ is the major radius coordinate, and $I_p$ is the\
    \ total plasma current. This quantity often lies close to the magnetic axis in\
    \ equilibrium configurations but can differ during strong shaping or non-axisymmetric\
    \ perturbations. It is determined from magnetic equilibrium reconstruction (e.g.\
    \ EFIT, LIUQE) using external magnetic measurements and internal profile constraints.\
    \ Typical values range from 1.6\u20133.0 m in medium-size tokamaks to 6.2 m in\
    \ ITER. See [major_radius](name:major_radius) for the general grid geometry and\
    \ [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis) for the\
    \ related axis position.\n\nSign convention: Positive when the centroid lies in\
    \ the direction of increasing $R$ from the machine symmetry axis."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius
  - name:safety_factor_at_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/current_centre/r
    dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    status: composed
- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Major radius coordinate of the centroid of the poloidal plasma cross-section.
  documentation: "The geometric axis is the area centroid of the poloidal plasma boundary\
    \ cross-section, defining the geometric center of the plasma column. This major\
    \ radius coordinate $R_{\\mathrm{geo}}$ is distinct from the magnetic axis, which\
    \ is defined by the extremum of the poloidal magnetic flux. $R_{\\mathrm{geo}}$\
    \ is computed from the boundary shape and is used in shaping parameter definitions\
    \ such as elongation and triangularity. Typical values range from 1.5\u20133.0\
    \ m for medium-size tokamaks (e.g., DIII-D, JET) to 6.2 m for ITER. The geometric\
    \ axis is determined from the plasma boundary as reconstructed by equilibrium\
    \ codes (e.g., EFIT, LIUQE) and is a fundamental reference for the plasma position.\n\
    \nSign convention: Positive when the geometric center lies at a major radius greater\
    \ than the machine symmetry axis (i.e., outboard of the machine center).\n\nSee\
    \ also [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis) for\
    \ the magnetic equivalent, and [vertical_coordinate_of_geometric_axis](name:vertical_coordinate_of_geometric_axis)\
    \ for the vertical coordinate of this center."
  unit: m
  physics_domain: equilibrium
  links:
