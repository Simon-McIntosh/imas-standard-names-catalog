name: electron_temperature_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Electron temperature evaluated at the top of the H-mode pedestal, characterizing
  the edge transport barrier strength.
documentation: "The pedestal-top electron temperature $T_{e,\\mathrm{ped}}$ (in eV)\
  \ marks the inner boundary of the steep-gradient region formed during high-confinement\
  \ (H-mode) operation. It is a key parameter in pedestal stability analysis (peeling-ballooning\
  \ model) and strongly influences the overall energy confinement via the pedestal\
  \ pressure. Typical values range from 0.3\u20131.5 keV in medium-size tokamaks and\
  \ can exceed 4 keV in ITER-like scenarios. $T_{e,\\mathrm{ped}}$ is commonly extracted\
  \ from Thomson scattering or electron cyclotron emission (ECE) profiles, often fitted\
  \ with a modified hyperbolic-tangent (mtanh) or linear pedestal model. The pedestal\
  \ temperature, together with the pedestal electron density, determines the pedestal\
  \ electron pressure $p_{e,\\mathrm{ped}} = n_{e,\\mathrm{ped}} k_B T_{e,\\mathrm{ped}}$.\
  \ See also `electron_temperature`, `electron_number_density_at_pedestal`, and `electron_pressure`."
