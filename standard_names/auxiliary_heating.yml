- name: vertical_coordinate_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: "Vertical Z-coordinate of the reference point of a lower-hybrid antenna\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate locates the reference point of a lower-hybrid
    antenna along the vertical direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The defining relation is:


    $$

    Z_{\mathrm{ant}} = Z(P_{\mathrm{ant}})

    $$


    where $P_{\mathrm{ant}}$ is the antenna reference point and $Z(P_{\mathrm{ant}})$
    is its vertical coordinate. This quantity refers to the antenna reference point;
    the [vertical coordinate of a lower-hybrid antenna row](name:vertical_coordinate_of_lower_hybrid_antenna_row)
    refers instead to a row reference point.


    Sign convention: Positive when the antenna reference point lies in the direction
    of increasing $Z$.'
