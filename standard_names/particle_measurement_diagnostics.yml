    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-mode-counting
    dd_documentation:
      leaf: Detected counts per second as a function of time
      parent_path: neutron_diagnostic/detector/mode
      parent: Set of Measuring Modes simultaneously used by the detector
      data_type: STRUCTURE
      unit: s^-1
    enhanced_context:
      description: Detected neutron count rate as a function of time for a neutron
        detector channel operating in pulse counting mode. Used for real-time neutron
        flux monitoring and fusion performance assessment.
      kind: llm
  - dd_path: neutron_diagnostic/detector/mode/spectrum
