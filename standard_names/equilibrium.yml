- name: poloidal_magnetic_flux_at_magnetic_axis
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the magnetic axis is the value of the equilibrium
    flux function at the innermost closed-flux-surface point where its gradient vanishes.
    It provides the inner reference for normalized poloidal-flux coordinates.
  documentation: 'Poloidal magnetic flux at the magnetic axis, $\psi_0$, is the value
    of the equilibrium poloidal-flux function at the magnetic axis, the innermost
    point of the nested closed-flux-surface family where the poloidal-flux gradient
    vanishes. It is an extremal reference value for radial flux labeling; the absolute
    offset of $\psi$ is gage dependent, so physically meaningful radial labels use
    flux differences such as $\psi - \psi_0$.


    The dimensionless normalized poloidal flux coordinate anchored at the axis is
    commonly defined by:


    $$

    \psi_N = \frac{\psi - \psi_0}{\psi_b - \psi_0}

    $$


    where $\psi_N$ is dimensionless, $\psi$ is the local poloidal magnetic flux in
    Wb, $\psi_0$ is the magnetic-axis value in Wb, and $\psi_b$ is the plasma-boundary
    value in Wb from [poloidal_magnetic_flux_at_plasma_boundary](name:poloidal_magnetic_flux_at_plasma_boundary).
    With this normalization, $\psi_N = 0$ at the magnetic axis and $\psi_N = 1$ at
    the plasma boundary, matching [normalized_poloidal_magnetic_flux_at_plasma_boundary](name:normalized_poloidal_magnetic_flux_at_plasma_boundary).


    Equilibrium reconstruction obtains $\psi_0$ by locating the extremum of the reconstructed
    poloidal-flux map inside the last closed flux surface. The same axis reference
    is used when interpreting flux values at internal features such as an [internal
    transport barrier](name:poloidal_magnetic_flux_at_internal_transport_barrier),
    a [secondary separatrix](name:poloidal_magnetic_flux_at_secondary_separatrix),
    or a pedestal position expressed by [normalized_poloidal_flux_coordinate_of_pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).


    Because an additive gage can be chosen for $\psi$, a universal absolute range
    for $\psi_0$ is not physically meaningful; many equilibria set the axis value
    to 0 Wb. The physically relevant separation $|\psi_b - \psi_0|$ is often 0.1-10
    Wb in small and medium tokamaks and 10-100 Wb in large high-current plasmas.


    Sign convention: Positive when $\psi$ increases outward from the magnetic axis
    toward the plasma boundary.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_plasma_boundary
