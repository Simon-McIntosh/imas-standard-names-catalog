- name: reference_wavelength_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Reference wavelength of a spectrometer channel is the wavelength at
    which that channel's spectral instrument function has maximum response. It is
    a peak-position parameter of the channel response, distinct from a calibration
    reference wavelength and from the wavelength of a physical spectral line.
  documentation: 'Reference wavelength of a spectrometer channel is the wavelength
    coordinate at which that channel''s spectral instrument function reaches its maximum
    response. It is an instrument-response property for the channel, not the wavelength
    of an observed spectral line and not the reference wavelength used to define or
    check a wavelength calibration. As a wavelength, it is a non-negative spectral
    coordinate rather than a signed direction-dependent quantity.


    Let $G_c(\lambda)$ denote the spectral instrument function of channel $c$ as a
    function of wavelength $\lambda$. The reference wavelength $\lambda_{\mathrm{ref},c}$
    is the peak location:


    $$

    \lambda_{\mathrm{ref},c} = \operatorname*{arg\,max}_{\lambda} G_c(\lambda)

    $$


    where $G_c$ may be normalized or unnormalized, because the peak position is unchanged
    by an overall response scaling. If the response model has multiple local maxima,
    the reference wavelength denotes the designated principal response peak used to
    define the channel center.


    In practice, $\lambda_{\mathrm{ref},c}$ is obtained from wavelength calibration
    measurements, an optical or diffraction geometry model, or spectral fitting of
    known features to a channel response model. For crystal X-ray spectrometers, the
    nominal wavelength is constrained by the Bragg relation $n\lambda = 2d\sin\theta_B$,
    where $d$ is the lattice-plane spacing, $\theta_B$ is the Bragg angle, and $n$
    is the diffraction order. The related [spectral_width_of_spectrometer_channel](name:spectral_width_of_spectrometer_channel)
    describes response broadening, while [spectral_instrument_function_of_spectrometer_channel](name:spectral_instrument_function_of_spectrometer_channel)
    describes the full wavelength-dependent response shape.


    This quantity should be distinguished from [reference_calibration_wavelength](name:reference_calibration_wavelength),
    which is a fiducial wavelength used to establish or validate a wavelength scale,
    and from [wavelength_of_spectral_line](name:wavelength_of_spectral_line), which
    is a physical photon wavelength associated with an atomic, molecular, or ionic
    transition.


    Typical values depend on the spectral band: crystal X-ray spectrometer channels
    commonly lie in the range $10^{-11}$-$10^{-9}$ m, with many impurity-line measurements
    near $10^{-10}$-$10^{-9}$ m, while ultraviolet and visible spectrometer channels
    are typically about $10^{-7}$-$10^{-6}$ m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_width_of_spectrometer_channel
  - name:wavelength_of_spectrometer_channel
  - name:bragg_wavelength
  sources:
