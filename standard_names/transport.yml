- name: krypton_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of krypton ions at the radial location of an internal
    transport barrier, where anomalous transport is suppressed and steep gradients
    form.
  documentation: "The krypton density at the internal transport barrier $n_{\\text{Kr}}(\\\
    rho_{\\text{ITB}})$ quantifies the local impurity ion concentration at the barrier\
    \ location, where strong $E \\times B$ shear reduces turbulent transport and creates\
    \ steep density gradients. This quantity is typically inferred from charge-exchange\
    \ recombination spectroscopy (CXRS) or passive spectroscopy on krypton emission\
    \ lines, with values in the range $10^{16}$\u2013$10^{19}\\,\\text{m}^{-3}$ depending\
    \ on seeding rate and plasma conditions. The barrier location $\nho_{\\text{ITB}}$\
    \ is identified by a local minimum in the gyro-Bohm normalized heat diffusivity\
    \ and separates the core region of improved confinement from the outer plasma.\
    \ See also [krypton_density_at_pedestal](name:krypton_density_at_pedestal) for\
    \ the density at the edge transport barrier and [helium_4_density_at_internal_transport_barrier](name:helium_4_density_at_internal_transport_barrier)\
    \ for a similar quantity for helium ash.\n\nSign convention: Positive when the\
    \ krypton ion number density is measured, being zero in the absence of seeded\
    \ impurities.\n\nTypical values in ITB plasmas range from $10^{17}\\,\\text{m}^{-3}$\
    \ for trace seeding to $10^{19}\\,\\text{m}^{-3}$ for strong radiative cooling,\
    \ with the density peaking inside the barrier due to the suppressed outward transport."
  unit: m^-3
  physics_domain: transport
  links:
  - name:krypton_density_at_pedestal
  - name:helium_4_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/krypton/value
    dd_path: summary/local/itb/n_i/krypton/value
    status: composed
- name: line_averaged_helium_4_density
  kind: scalar
  status: draft
  description: Line-averaged number density of helium-4 ions along a diagnostic chord
    through the plasma.
  documentation: 'The line-averaged density of helium-4 ions is defined as $\langle
    n_{\mathrm{He}} \rangle = \frac{1}{L} \int_L n_{\mathrm{He}}(\ell) \, d\ell$,
    where $L$ is the chord length and $n_{\mathrm{He}}(\ell)$ is the local density
    along the path. This quantity is routinely derived from charge-exchange recombination
    spectroscopy (CXRS) or beam-emission spectroscopy (BES) and provides a robust,
    chord-integrated measure of alpha-particle or recycling helium content. Typical
    core line-averaged densities for helium-4 range $10^{17}$--$10^{19}~\mathrm{m}^{-3}$
    in NBI-heated tokamak plasmas. The line-averaged value serves as a lower-resolution
    complement to local measurements such as [helium_4_density_at_magnetic_axis](name:helium_4_density_at_magnetic_axis)
    and is more directly comparable to interferometric estimates of total ion density.
    For a volume-integrated alternative, see [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density).


    Sign convention: Positive when the integral of the helium-4 ion density over the
    chord yields a positive value.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:helium_4_density_at_magnetic_axis
  - name:volume_averaged_helium_4_density
  sources:
  - id: dd:summary/line_average/n_i/helium_4/value
    dd_path: summary/line_average/n_i/helium_4/value
    status: composed
- name: line_averaged_lithium_density
  kind: scalar
  status: draft
  description: Line-integrated average of the lithium impurity number density along
    a line of sight through the plasma.
  documentation: 'The line-averaged lithium density $\langle n_{\mathrm{Li}} \rangle$
    is the chord-integrated ion density $\int n_{\mathrm{Li}}\,dl$ divided by the
    chord length $L$, providing a measurement of the lithium impurity density along
    a single line-of-sight through the plasma. It is routinely inferred from passive
    or active spectroscopy of lithium emission lines (e.g., Li I at 670.8 nm or Li
    II at 548.5 nm) and is used to monitor impurity screening, wall erosion, or lithium
    seeding efficiency. Typical values range from $10^{16}\,\mathrm{m}^{-3}$ in the
    scrape-off layer to $10^{18}\,\mathrm{m}^{-3}$ in the core of heavily seeded discharges.
    The line-averaged density complements local measurements such as $[\mathrm{lithium\,density\,at\,separatrix}](name:lithium_density_at_separatrix)$
    and $[\mathrm{volume\,averaged\,lithium\,density}](name:volume_averaged_lithium_density)$
    by providing a global chord-average without spatial resolution.


    Sign convention: Positive when representing a physical particle density in the
    plasma volume.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:lithium_density_at_separatrix
  - name:volume_averaged_lithium_density
  sources:
  - id: dd:summary/line_average/n_i/lithium/value
    dd_path: summary/line_average/n_i/lithium/value
    status: composed
- name: line_averaged_neon_density
  kind: scalar
  status: draft
  description: Line-integrated average of the neon impurity number density along a
    chord through the plasma.
  documentation: 'The line-averaged neon density is the mean neon impurity number
    density obtained by integrating the local density $n_{\text{Ne}}(\ell)$ along
    a diagnostic line of sight of total length $L$: $\bar{n}_{\text{Ne}} = \frac{1}{L}
    \int_L n_{\text{Ne}}(\ell) \, d\ell$. This quantity is routinely inferred from
    visible or VUV spectroscopy of neon emission lines, from which the absolute line-integrated
    emissivity is inverted to yield the average density. Typical values range from
    $10^{16}\text{ m}^{-3}$ in low-neon-seeded plasmas to $10^{19}\text{ m}^{-3}$
    in strongly radiating divertor scenarios. The line-averaged value provides a complementary
    measure to the volume-averaged density, [volume_averaged_neon_density](name:volume_averaged_neon_density),
    and to local measurements such as [neon_density_at_limiter](name:neon_density_at_limiter).


    Sign convention: Positive when the neon impurity density is positive along the
    line of sight.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:volume_averaged_neon_density
  - name:neon_density_at_limiter
  sources:
  - id: dd:summary/line_average/n_i/neon/value
    dd_path: summary/line_average/n_i/neon/value
    status: composed
- name: lithium_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of lithium ions at the internal transport barrier location,
    summed over all charge states.
  documentation: 'The lithium number density $n_{\mathrm{Li}}$ represents the concentration
    of lithium impurity ions at the internal transport barrier (ITB), a radial region
    where turbulent transport is suppressed and plasma confinement improves. The ITB
    is identified by a steepening of the density or temperature profiles and is a
    key feature in advanced tokamak scenarios. Lithium is commonly injected as a wall
    conditioning agent or as a diagnostic impurity tracer. The density is measured
    via charge exchange recombination spectroscopy (CXRS) or passive spectroscopy
    of line emission, with typical values ranging from $10^{16}$ to $10^{18}$ $\mathrm{m}^{-3}$
    in the ITB region of present-day tokamaks. The quantity is related to the total
    impurity density through summation with other impurity species and complements
    the electron density to determine the effective ion charge $Z_{\mathrm{eff}}$.
    See also [lithium_density_at_pedestal](name:lithium_density_at_pedestal), [lithium_density_at_separatrix](name:lithium_density_at_separatrix),
    [neon_density_at_internal_transport_barrier](name:neon_density_at_internal_transport_barrier),
    and [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier).


    Sign convention: Positive when the number of lithium ions per unit volume is non-negative,
    as density is a positive-definite scalar quantity.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:lithium_density_at_pedestal
  - name:lithium_density_at_separatrix
  - name:neon_density_at_internal_transport_barrier
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/lithium/value
    dd_path: summary/local/itb/n_i/lithium/value
    status: composed
- name: magnetic_shear_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Magnetic shear at the location of the internal transport barrier, defined
    as the normalized radial gradient of the safety factor.
  documentation: 'The magnetic shear $s = (\rho_{\mathrm{tor}} / q) \, (dq / d\rho_{\mathrm{tor}})$
    where $q$ is the safety factor and $\rho_{\mathrm{tor}}$ is the normalized toroidal
    flux coordinate, evaluated at the radial position of the internal transport barrier
    (ITB). This parameter governs the pitch-angle variation of magnetic field lines
    between neighboring flux surfaces and is a critical MHD stability indicator. Negative
    magnetic shear (reversed shear) is a well-known condition for ITB formation, suppressing
    turbulent transport and improving confinement. The value is typically obtained
    from equilibrium reconstruction codes using magnetic and kinetic profile constraints.
    Positive magnetic shear is the usual monotonic tokamak scenario, while strongly
    negative values (e.g., $s < -0.5$) can trigger resistive wall modes. This quantity
    is closely related to the [magnetic shear of the magnetic axis](name:magnetic_shear_of_magnetic_axis)
    and [magnetic shear at the pedestal](name:magnetic_shear_at_pedestal), which are
    evaluated at other characteristic radial locations.


    Sign convention: Positive when $q$ increases with $\rho_{\mathrm{tor}}$ (normal
    monotonic $q$-profile).'
  unit: '1'
  physics_domain: transport
  links:
  - name:magnetic_shear_of_magnetic_axis
  - name:magnetic_shear_at_pedestal
  sources:
  - id: dd:summary/local/itb/magnetic_shear/value
    dd_path: summary/local/itb/magnetic_shear/value
    status: composed
- name: momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Effective scalar diffusion coefficient for the turbulent transport
    of plasma toroidal angular momentum in the poloidal plane, parameterizing the
    diffusive flux that flattens the rotation profile.
  documentation: The momentum diffusion coefficient $\chi_\phi$ quantifies the radial
    diffusive transport of toroidal angular momentum in the plasma, appearing in the
    flux-gradient relation $\langle \tilde{v}_r \tilde{p}_\phi \rangle = -\chi_\phi
    \, \partial \langle p_\phi \rangle / \partial r$, where $p_\phi$ is the toroidal
    angular momentum density and $r$ is the minor radius. This scalar represents the
    net isotropic diffusivity summed over all species and torque sources; its anisotropic
    components are resolved by directional standard names. In tokamak cores, $\chi_\phi$
    typically ranges from $0.1$ to $10\,\text{m}^2\text{s}^{-1}$ and is comparable
    to the ion thermal diffusivity in the absence of strong momentum sources. It is
    inferred from the measured toroidal rotation profile through interpretive transport
    analysis (e.g., TRANSP, ONETWO). See the [radial momentum diffusion coefficient](name:radial_momentum_diffusion_coefficient)
    for the component driving the dominant inward transport, and the [momentum diamagnetic
    diffusion coefficient](name:momentum_diamagnetic_diffusion_coefficient) for the
    additional nondiffusive contribution from diamagnetic effects.
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_momentum_diffusion_coefficient
  - name:momentum_diamagnetic_diffusion_coefficient
  sources:
  - id: dd:plasma_transport/model/profiles_1d/momentum_phi/d
    dd_path: plasma_transport/model/profiles_1d/momentum_phi/d
    status: composed
  - id: sn:momentum_diffusion_coefficient
    status: composed
- name: neon_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of neon impurity ions at the internal transport barrier,
    expressed in inverse cubic meters. The value represents the total neon ion density
    summed over all charge states at the spatial location corresponding to the internal
    transport barrier.
  documentation: 'The neon density at the internal transport barrier (ITB) quantifies
    the local concentration of neon impurity ions (all charge states combined) at
    the radial location where an internal transport barrier is identified. The ITB
    is a region of reduced anomalous radial transport, typically characterized by
    a steep gradient in the ion temperature or toroidal rotation profile, often associated
    with reversed or strongly sheared magnetic shear.


    The local number density $n_{\mathrm{Ne}}$ is defined as the number of neon ions
    per unit volume at the ITB location:


    $$n_{\mathrm{Ne}} = \sum_{q=1}^{10} n_{\mathrm{Ne}^{q+}}$$


    where $n_{\mathrm{Ne}^{q+}}$ is the density of neon ions in the $q$-th charge
    state. This quantity is evaluated at the radial position of the ITB, which is
    commonly identified as the location of maximum pressure gradient or maximum $E
    \times B$ shearing rate in the core plasma region.


    Typical values range from $10^{16}$ to $10^{19}$ m$^{-3}$, depending on the neon
    seeding rate, plasma confinement regime, and core transport properties. In advanced
    tokamak scenarios with strong ITBs (e.g., reversed shear operation), neon can
    accumulate significantly inside the barrier due to the reduced outward particle
    transport.


    Diagnostically, neon density at the ITB is commonly inferred from charge exchange
    recombination spectroscopy (CXRS) using neutral beam injection, or from vacuum
    ultraviolet (VUV) spectroscopy of neon line emission, combined with impurity transport
    modeling to reconstruct local density profiles.


    This quantity is always non-negative, representing a physical particle number
    density.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:neon_density_of_magnetic_axis
  - name:line_averaged_neon_density
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/neon/value
    dd_path: summary/local/itb/n_i/neon/value
    status: composed
- name: neon_density_of_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of neon impurity ions at the location of the magnetic
    axis.
  documentation: "The neon impurity density evaluated at the magnetic axis characterizes\
    \ the central accumulation of this trace species snapshot. Measured as $n_{\\\
    mathrm{Ne}}(R_{\\mathrm{axis}}, Z_{\\mathrm{axis}})$ in the cylindrical $(R, \\\
    phi, Z)$ frame. Typical values in neon-seeded H-mode plasmas range from $10^{16}$\
    \ to $10^{18}\\,\\mathrm{m}^{-3}$ depending on the radiative-divertor seeding\
    \ rate. The magnetic axis value constrains the core impurity source and is used\
    \ as a boundary condition for transport simulations. In discharges with neoclassical\
    \ impurity accumulation this density can exceed that at the pedestal top by a\
    \ factor of 2\u201310. Positive when the impurity number density is measured or\
    \ calculated as a positive definite count of particles per unit volume. Related\
    \ profiles include [neon_density_of_pedestal](name:neon_density_of_pedestal) and\
    \ the line-averaged [line_averaged_neon_density](name:line_averaged_neon_density)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:neon_density_of_pedestal
  - name:line_averaged_neon_density
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/neon/value
    dd_path: summary/local/magnetic_axis/n_i/neon/value
    status: composed
- name: neutral_state_convected_velocity
  kind: scalar
  status: draft
  description: Convective velocity for the energy or particle transport of neutral
    atoms in a specific charge state.
  documentation: 'The neutral state convective velocity is the transport velocity
    $v_{\mathrm{conv},z}$ for neutral atoms of a specified charge state $z$, appearing
    in the convective flux term $\Gamma_{\mathrm{conv}} = n_z v_{\mathrm{conv},z}$,
    where $n_z$ is the neutral density of that charge state. This velocity encodes
    the net advection of neutral mass, momentum, or energy across the plasma, driven
    by pressure gradients, friction with the background ion flow, or charge-exchange
    momentum transfer. In the scrape-off layer, neutral convective velocities typically
    range from $10^3$ to $10^4$ m/s, comparable to the ion sound speed, and are inferred
    from kinetic neutral transport codes or from measurements of neutral pressure
    and flow.


    Sign convention: Positive when the convective flow is directed radially outward
    (toward the plasma boundary).


    See related quantities [neutral_convected_velocity](name:neutral_convected_velocity)
    for the charge-state-summed neutral transport and [ion_state_convected_velocity](name:ion_state_convected_velocity)
    for the corresponding ion channel.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:neutral_convected_velocity
  - name:ion_state_convected_velocity
  sources:
  - id: dd:plasma_transport/model/ggd/neutral/state/energy/v/values
    dd_path: plasma_transport/model/ggd/neutral/state/energy/v/values
    status: composed
  - id: dd:plasma_transport/model/ggd/neutral/state/particles/v/values
    dd_path: plasma_transport/model/ggd/neutral/state/particles/v/values
    status: composed
- name: neutral_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Neutral particle velocity arising from the diamagnetic drift driven
    by the neutral pressure gradient in a magnetized plasma.
  documentation: 'The neutral particle diamagnetic drift velocity is defined as $\mathbf{v}_{n,\mathrm{dia}}
    = (\nabla p_n \times \mathbf{B}) / (m_n n_n B^2)$, where $p_n$ is the neutral
    particle pressure, $\mathbf{B}$ is the magnetic field vector, $m_n$ is the neutral
    mass density, $n_n$ is the neutral number density, and $B = |\mathbf{B}|$. This
    drift arises from the gyromotion of neutrals in a pressure gradient within a magnetized
    plasma and contributes to the total neutral momentum transport. The quantity is
    typically computed in edge-plasma transport simulations where neutral populations
    are significant, such as in the scrape-off layer and divertor regions. It is related
    to the [bulk plasma velocity due to diamagnetic drift](name:bulk_plasma_velocity_due_to_diamagnetic_drift)
    and the [neutral momentum due to diamagnetic drift](name:neutral_momentum_due_to_diamagnetic_drift),
    which provides the momentum source density. Typical neutral diamagnetic drift
    velocities in the tokamak edge range from $10^2$ to $10^4$ m/s depending on the
    neutral pressure gradient strength and magnetic field magnitude.


    Sign convention: Positive when the drift velocity points in the direction of $\mathbf{B}
    \times \nabla p_n$ for a positive pressure gradient.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:bulk_plasma_velocity_due_to_diamagnetic_drift
  - name:neutral_momentum_due_to_diamagnetic_drift
  sources:
  - id: dd:plasma_profiles/ggd/neutral/state/velocity_diamagnetic/diamagnetic
    dd_path: plasma_profiles/ggd/neutral/state/velocity_diamagnetic/diamagnetic
    status: attached
  - id: dd:plasma_transport/model/ggd/neutral/momentum/v/diamagnetic
    dd_path: plasma_transport/model/ggd/neutral/momentum/v/diamagnetic
    status: composed
- name: parallel_counter_passing_fast_pressure
  kind: scalar
  status: draft
  description: Parallel component of the fast particle pressure from the counter-passing
    distribution in velocity space.
  documentation: "The parallel fast particle pressure from counter-passing ions, $p_{||,\\\
    mathrm{counter}} = \\int m_i v_\\parallel^2 f_\\mathrm{counter}(\\mathbf{r}, \\\
    mathbf{v}) \\, d^3\\mathbf{v}$, quantifies the kinetic stress along the local\
    \ magnetic field direction carried by suprathermal particles whose parallel velocity\
    \ is opposite to the plasma current. This component is one of the two anisotropic\
    \ pressures that, together with the perpendicular component $p_\\perp$, determine\
    \ the full pressure tensor in the Chew-Goldberger-Low (CGL) description. Typical\
    \ values for counter-passing fast ion pressure in NBI-heated tokamak plasmas range\
    \ from several hundred Pa in the core to tens of Pa at the edge, depending on\
    \ beam geometry, injection energy, and orbit losses. The anisotropy between this\
    \ parallel component and the perpendicular component $[\\mathrm{perpendicular\\\
    _counter\\_passing\\_fast\\_pressure}](name:perpendicular_counter_passing_fast_pressure)$\
    \ influences MHD stability and Alfv\xE9n eigenmode drive. For the total pressure\
    \ (sum of both components), see $[\\mathrm{counter\\_passing\\_fast\\_pressure}](name:counter_passing_fast_pressure)$.\
    \ The companion quantity for particles moving parallel to the current is $[\\\
    mathrm{parallel\\_co\\_passing\\_fast\\_pressure}](name:parallel_co_passing_fast_pressure)$."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:perpendicular_counter_passing_fast_pressure
  - name:counter_passing_fast_pressure
  - name:parallel_co_passing_fast_pressure
  arguments:
  - name: counter_passing_fast_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/counter_passing/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/counter_passing/pressure_fast_parallel
    status: composed
  - id: dd:distributions/distribution/profiles_2d/counter_passing/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_2d/counter_passing/pressure_fast_parallel
    status: composed
- name: parallel_electron_energy_flux
  kind: scalar
  status: draft
  description: Projection of the electron energy flux onto the magnetic field direction,
    describing thermal energy transported along field lines per unit area per unit
    time.
  documentation: "The parallel electron energy flux $Q_{\\parallel,e} = \\mathbf{Q}_e\
    \ \\cdot \\hat{b}$ represents the component of the total electron energy flux\
    \ $\\mathbf{Q}_e$ aligned with the magnetic field unit vector $\\hat{b}$. This\
    \ quantity governs heat transport along the field line in the scrape-off layer\
    \ and pedestal, where parallel conduction and convection dominate the energy balance.\
    \ The parallel electron energy flux is typically inferred from upstream profile\
    \ measurements combined with the two-point SOL model, or computed by edge transport\
    \ codes that solve the parallel energy balance equation. Typical values in the\
    \ SOL of H-mode tokamaks range from 1 to 100 MW/m\xB2, depending on the power\
    \ crossing the separatrix and the SOL width. See also the total [electron_energy_flux](name:electron_energy_flux)\
    \ and the ion counterpart [parallel_ion_energy_flux](name:parallel_ion_energy_flux)."
  unit: W.m^-2
  physics_domain: transport
  links:
  - name:electron_energy_flux
  - name:parallel_ion_energy_flux
  arguments:
  - name: electron_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:plasma_transport/model/ggd/electrons/energy/flux_parallel/values
    dd_path: plasma_transport/model/ggd/electrons/energy/flux_parallel/values
    status: composed
- name: parallel_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the electron fluid velocity vector onto the direction
    parallel to the local magnetic field.
  documentation: 'The parallel electron velocity $v_{\|,e} = \mathbf{v}_e \cdot \hat{b}$
    describes the bulk flow of the electron population along magnetic field lines.
    In a tokamak, this component is critical for determining the parallel current
    density through $j_\| = -e n_e v_{\|,e}$ and governs parallel heat transport.
    The full velocity vector is defined in the [electron_velocity](name:electron_velocity)
    parent quantity. Parallel electron flow is routinely measured by Doppler reflectometry
    or inferred from equilibrium reconstruction; typical values range from subsonic
    ($\sim 10$ km/s) in the core to supersonic flows in the scrape-off layer. The
    sign of $v_{\|,e}$ is determined by the direction of $\hat{b}$ relative to the
    toroidal direction.


    Sign convention: Positive when $v_{\|,e}$ points in the direction of the local
    magnetic field vector $\mathbf{B}$.


    See also [parallel_ion_velocity](name:parallel_ion_velocity) for the corresponding
    ion flow, and [toroidal_electron_velocity](name:toroidal_electron_velocity) for
    the geometric toroidal projection.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:parallel_ion_velocity
  - name:toroidal_electron_velocity
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity/parallel
    dd_path: core_profiles/profiles_1d/electrons/velocity/parallel
    status: composed
  - id: dd:plasma_profiles/ggd/electrons/velocity/parallel
    dd_path: plasma_profiles/ggd/electrons/velocity/parallel
    status: composed
- name: parallel_fast_electron_pressure
  kind: scalar
  status: draft
  description: Component of the fast electron pressure tensor projected onto the local
    magnetic field direction, capturing anisotropy in the suprathermal electron population.
  documentation: "The parallel fast electron pressure $p_{\\parallel,\\text{fast}}$\
    \ is the component of the fast (suprathermal) electron pressure tensor along the\
    \ local magnetic field. It quantifies the directional kinetic energy density of\
    \ non-thermal electrons with velocities primarily parallel to $\\mathbf{B}$, arising\
    \ from mechanisms such as lower hybrid current drive or runaway electron beams.\
    \ The total anisotropic fast electron pressure is given by $p_{\\text{fast}} =\
    \ (p_{\\parallel} + 2p_{\\perp})/3$, with the perpendicular component provided\
    \ by [perpendicular_fast_electron_pressure](name:perpendicular_fast_electron_pressure).\
    \ Values typically range from 0.1\u201310 kPa in the core of strongly RF-heated\
    \ or disruption-relevant plasmas, measured indirectly via hard X-ray bremsstrahlung\
    \ and synchrotron radiation spectra. This quantity is related to the parent vector\
    \ [fast_electron_pressure](name:fast_electron_pressure) and is a key input for\
    \ MHD stability calculations and transport modeling during fast electron events.\n\
    \nSign convention: Positive when the parallel component contributes to the total\
    \ pressure tensor in the direction of the local magnetic field.\n\nTypical values\
    \ in fusion plasmas are 0.1\u201310 kPa for NBI-heated or disruption scenarios;\
    \ these are inferred via hard X-ray bremsstrahlung and synchrotron radiation spectra\
    \ combined with kinetic modeling."
  unit: Pa
  physics_domain: transport
  links:
  - name:perpendicular_fast_electron_pressure
  - name:fast_electron_pressure
  arguments:
  - name: fast_electron_pressure
    operator: component
