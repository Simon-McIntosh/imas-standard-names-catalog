- name: argon_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Rate at which argon atoms are introduced into the vessel by the gas
    injection system.
  documentation: 'The argon source rate quantifies the number of neutral argon atoms
    per second injected into the vacuum vessel, typically through a piezoelectric
    or fast gas valve. This rate directly controls the local neutral density and influences
    the plasma edge cooling, radiative power loss, and the effective plasma charge
    $Z_{\mathrm{eff}}$. The instantaneous rate is a function of the valve plenum pressure
    and the driving voltage waveform; integrated over time it yields the total number
    of argon atoms introduced during a discharge. Typical injection rates range from
    $10^{19}$ to $10^{22}$ atoms/s for fueling, radiative seeding, or diagnostic purposes.
    See also [neon_gas_source_rate_due_to_injection](name:neon_gas_source_rate_due_to_injection)
    for the analogous neon rate and [krypton_source_rate](name:krypton_source_rate)
    for krypton injection.


    Sign convention: Positive when argon atoms flow into the vessel from the injection
    valve.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:neon_gas_source_rate_due_to_injection
  - name:krypton_source_rate
  sources:
  - id: dd:summary/gas_injection_rates/argon/value
    dd_path: summary/gas_injection_rates/argon/value
    status: composed
- name: beryllium_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which beryllium atoms are introduced into the
    vacuum vessel by a gas injection system.
  documentation: 'The beryllium source rate characterizes the introduction of beryllium
    atoms into the plasma edge for wall conditioning, impurity seeding, or fusion
    performance studies. The injection rate $\Gamma_{\mathrm{Be}} = N_{\mathrm{Be}}
    / \Delta t$ describes the number of beryllium atoms per unit time delivered to
    the vessel, typically controlled via a piezoelectric or solenoid valve. Typical
    values range from $10^{19}$ to $10^{22}$ atoms per second depending on the conditioning
    scenario and vessel size. Measurement is inferred from the calibrated gas valve
    flow rate and the known beryllium content of the injection mixture. This quantity
    is closely related to [tritium_source_rate_due_to_injection](name:tritium_source_rate_due_to_injection)
    and [neon_gas_source_rate_due_to_injection](name:neon_gas_source_rate_due_to_injection)
    for other species used in plasma-facing component conditioning.


    Sign convention: Positive when beryllium atoms are added to the vacuum vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:tritium_source_rate_due_to_injection
  - name:neon_gas_source_rate_due_to_injection
  sources:
  - id: dd:summary/gas_injection_rates/beryllium/value
    dd_path: summary/gas_injection_rates/beryllium/value
    status: composed
- name: hydrogen_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous rate at which hydrogen atoms are introduced into the
    vacuum vessel by a gas injection system.
  documentation: 'The hydrogen source rate quantifies the number of hydrogen atoms
    per second injected into the plasma chamber via the gas injection system. This
    rate, combined with the fueling efficiency, determines the core neutral density
    and influences edge plasma conditions. Typical values range from $10^{19}$ to
    $10^{22}$ s$^{-1}$ for fusion devices, depending on the desired plasma density
    and operational phase. The nominal source rate is the commanded flow rate at the
    gas valve, which may differ from the actual throughput due to finite conductance
    and wall pumping.


    Sign convention: Positive when hydrogen atoms are flowing into the vacuum vessel
    from the injection system.


    This quantity is analogous to [tritium_source_rate_due_to_injection](name:tritium_source_rate_due_to_injection)
    and [carbon_source_rate_due_to_injection](name:carbon_source_rate_due_to_injection),
    which use the same atomic injection model for other species.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:tritium_source_rate_due_to_injection
  - name:carbon_source_rate_due_to_injection
  sources:
  - id: dd:summary/gas_injection_rates/hydrogen/value
    dd_path: summary/gas_injection_rates/hydrogen/value
    status: composed
- name: lithium_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Rate at which lithium atoms are introduced into the vacuum vessel by
    a gas injection system.
  documentation: 'The lithium source rate due to injection quantifies the number of
    lithium atoms injected per second into the vacuum vessel. This rate is used to
    control fueling and wall-conditioning processes, where lithium deposition can
    improve plasma performance by reducing recycling and impurity influx. Typical
    injection rates range from $10^{18}$ to $10^{21}$ atoms/s for fusion devices.
    The injected lithium may be measured by flow controllers or inferred from pressure
    rise in the vessel. This quantity is distinguished from the net lithium wall inventory
    by accounting for losses due to pumping and plasma transport. See [argon_source_rate_due_to_injection](name:argon_source_rate_due_to_injection)
    and [lithium_density_at_divertor_target](name:lithium_density_at_divertor_target)
    for related source and transport quantities.


    Sign convention: Positive when lithium atoms flow into the vacuum vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:argon_source_rate_due_to_injection
  - name:lithium_density_at_divertor_target
  sources:
  - id: dd:summary/gas_injection_rates/lithium/value
    dd_path: summary/gas_injection_rates/lithium/value
    status: composed
- name: source_rate_at_midplane_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous gas injection rate from valves located at the equatorial
    midplane of the vacuum vessel.
  documentation: 'This quantity quantifies the total particle source rate introduced
    by gas injection valves positioned at the tokamak midplane (typically in the torus
    equatorial plane). It is the sum of the atomic fluxes from all midplane valves
    and is a key actuator for controlling edge density and fueling. Typical values
    range from $10^{19}$ to $10^{22}$ s$^{-1}$ in present-day devices, set by valve
    plenum pressure, conductance, and pulse duration. The midplane source rate complements
    the top-valve rate captured by [gas_source_rate](name:gas_source_rate), and together
    with [carbon_source_rate_due_to_injection](name:carbon_source_rate_due_to_injection)
    forms the total fueling budget. Measured via flow meters or inferred from pressure
    rise in a calibrated volume.


    Sign convention: Positive when gas flows into the vessel (increasing particle
    inventory).


    The rate is positive for net injection into the plasma-facing region. A zero value
    indicates no active midplane fueling.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:gas_source_rate
  - name:carbon_source_rate_due_to_injection
  sources:
  - id: dd:summary/gas_injection_rates/midplane/value
    dd_path: summary/gas_injection_rates/midplane/value
    status: composed
- name: toroidal_angle_of_pellet_path
  kind: scalar
  status: draft
  description: Toroidal angle coordinate in the right-handed cylindrical frame of
    the path traced by a pellet during injection and ablation.
  documentation: "The toroidal angle $\u03C6$ of the pellet path defines the azimuthal\
    \ location of the pellet trajectory in the IMAS cylindrical $(R, \u03C6, Z)$ frame.\
    \ This coordinate together with the major radius $R$ and vertical height $Z$ from\
    \ [major_radius_of_pellet_path](name:major_radius_of_pellet_path) and [vertical_coordinate_of_pellet_path](name:vertical_coordinate_of_pellet_path)\
    \ fully specifies the geometry of the injection path. The pellet path $\u03C6\
    $ is used to relate diagnostic measurements along the trajectory to the toroidal\
    \ positions of in-vessel components or other injectors.\n\nSign convention: Positive\
    \ when the angular displacement is measured counter-clockwise when viewed from\
    \ above $+\\hat{Z}$.\n\nTypical values span 0 to $2\u03C0$ rad; for disruption\
    \ mitigation studies the toroidal location of the pellet relative to the plasma\
    \ current direction is critical for ablation and deposition efficiency."
  unit: rad
  physics_domain: plant_systems
  links:
