name: nuclear_heating_power_of_breeding_blanket
status: draft
description: Total thermal power deposited by nuclear reactions (neutron interactions
  and secondary gamma absorption) within a breeding blanket layer or module.
documentation: "The nuclear heating power $P_{\\mathrm{nuc}}$ (in W) represents the\
  \ integral of volumetric nuclear energy deposition over a blanket layer or module\
  \ volume, $P_{\\mathrm{nuc}} = \\int_V \\dot{q}_{\\mathrm{nuc}}\\,dV$, where $\\\
  dot{q}_{\\mathrm{nuc}}$ is the local nuclear heating power density in $\\mathrm{W\\\
  ,m^{-3}}$. Energy sources include neutron scattering, neutron capture, and secondary\
  \ photon absorption in structural, breeding, and multiplier materials. For a single\
  \ ITER test blanket module, $P_{\\mathrm{nuc}}$ is of order 0.1\u20131 MW; for a\
  \ full DEMO blanket the aggregate reaches several GW. The quantity is computed by\
  \ neutronics transport codes (MCNP, TRIPOLI, Serpent) and validated against activation-foil\
  \ and calorimetric measurements where available. Related quantities include `blanket_nuclear_heating_power_density_at_midplane`\
  \ for the spatially resolved density and `blanket_energy_multiplication_factor`\
  \ for the ratio to incident neutron power."
