- name: x_direction_unit_vector_of_neutron_detector
  kind: scalar
  status: active
  description: X component of the neutron-detector direction unit vector is the direction
    cosine along the x axis of the right-handed Cartesian (x, y, z) frame, from a
    field-of-view voxel center toward the detector center. It is a component of a
    normalized pointing direction, not a position coordinate.
  documentation: 'X component of the neutron-detector direction unit vector is the
    projection of the normalized direction from a field-of-view voxel center to the
    neutron-detector center onto the positive $\hat{x}$ axis. The component is resolved
    in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis and is a direction
    cosine, not a Cartesian position coordinate.


    The normalized pointing component is defined by


    $$

    d_x = \left(\frac{\mathbf r_{\rm det}-\mathbf r_{\rm vox}}{\left\lVert \mathbf
    r_{\rm det}-\mathbf r_{\rm vox}\right\rVert}\right)\cdot\hat{\mathbf x}

    $$


    where $d_x$ is the x component of the neutron-detector direction unit vector,
    $\mathbf r_{\rm det}$ is the detector-center position, $\mathbf r_{\rm vox}$ is
    the voxel-center position, and $\hat{\mathbf x}$ is the positive x basis vector.


    Together with the [y component](name:y_direction_unit_vector_of_neutron_detector)
    and [z component](name:z_direction_unit_vector_of_neutron_detector), $d_x$ specifies
    the full normalized direction from the voxel center toward the detector center;
    for nonzero separation the components satisfy $d_x^2+d_y^2+d_z^2=1$.


    Sign convention: Positive when the normalized direction from the voxel center
    to the detector center has a component in the $+\hat{x}$ direction.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:y_direction_unit_vector_of_neutron_detector
  - name:z_direction_unit_vector_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/field_of_view/direction_to_detector/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-field_of_view-direction_to_detector-x
    dd_documentation:
      leaf: Components along X axis for each voxel
      parent_path: neutron_diagnostic/detector/field_of_view/direction_to_detector
      parent: Vector that points from the centre of the voxel to the centre of the
        detector, described in the (X,Y,Z) coordinate system, where X is the major
        radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z
        is the height axis.
      data_type: FLT_3D
      unit: m
      coordinates:
      - neutron_diagnostic/detector/field_of_view/emission_grid/z
      - neutron_diagnostic/detector/field_of_view/emission_grid/phi
      - neutron_diagnostic/detector/field_of_view/emission_grid/r
    enhanced_context:
      description: X coordinate of direction to detector.
      kind: template
- name: xenon_density
  kind: scalar
  status: active
  description: Number density of xenon ions at a given point in the plasma, summed
    over all ionization states from singly ionized through fully stripped xenon, excluding
    neutral xenon atoms.
  documentation: 'Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe}
    = 54$) introduced into fusion plasmas for radiative-mantle experiments, impurity-transport
    studies, and disruption mitigation. The xenon ion number density $n_\mathrm{Xe}$
    quantifies the local concentration of all charged xenon species and enters the
    plasma effective charge through $Z_\mathrm{eff} = \sum_i Z_i^2 n_i / n_e$, where
    $n_i$ is the partial density of ion species $i$ and $n_e$ is the electron density.


    The total xenon ion density is the sum over all ionic charge states:


    $$

    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}

    $$


    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions carrying
    charge $ze$. The charge-state distribution is determined by coronal equilibrium
    or collisional-radiative modeling at the local electron temperature and density.


    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray line
    emission via spectroscopy and tomographic inversion, or from charge-exchange recombination
    spectroscopy using neutral-beam injection. Spatially resolved forms include [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)
    at the innermost flux surface and xenon_density_at_pedestal in the edge transport
    barrier, while [volume_averaged_xenon_density](name:volume_averaged_xenon_density)
    provides the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by xenon_fraction.


    Sign convention: Positive when ionized xenon is present in the plasma.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density_at_magnetic_axis
  - name:volume_averaged_xenon_density
- name: line_averaged_xenon_density
  kind: scalar
  status: active
  description: Line-averaged number density of xenon ions along a chord through the
    plasma, obtained by dividing the path integral of the local xenon ion density
    by the chord length.
  documentation: "The line-averaged xenon ion number density is the chord-path mean\
    \ of the local [xenon_density](name:xenon_density), which sums all charged xenon\
    \ ionization states from Xe$^{1+}$ through Xe$^{54+}$, normalized by the measurement\
    \ chord length through the plasma.\n\nThe defining relation is:\n\n$$\n\\bar{n}_\\\
    mathrm{Xe} = \\frac{1}{L} \\int_0^L n_\\mathrm{Xe}(\\ell) \\, d\\ell\n$$\n\nwhere\
    \ $n_\\mathrm{Xe}(\\ell)$ is the local xenon ion number density at arc-length\
    \ position $\\ell$ along the chord and $L$ is the total chord length.\n\nThis\
    \ quantity is inferred from line-integrated emission diagnostics sensitive to\
    \ xenon spectral lines \u2014 including soft X-ray arrays and visible-range spectrometers\
    \ \u2014 combined with knowledge of the chord geometry. The [volume_averaged_xenon_density](name:volume_averaged_xenon_density)\
    \ provides the spatial mean over the full plasma volume, and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)\
    \ captures the on-axis value. The analogous chord-averaged quantity for argon\
    \ is documented as [line_averaged_argon_density](name:line_averaged_argon_density).\n\
    \nIn trace impurity transport experiments, xenon concentrations yield $\\bar{n}_\\\
    mathrm{Xe} \\sim 10^{14}$\u2013$10^{16}$ m$^{-3}$; during disruption-mitigation\
    \ massive gas injection or shattered-pellet scenarios, values can reach $10^{17}$\u2013\
    $10^{19}$ m$^{-3}$.\n\nSign convention: Positive when xenon ions are present along\
    \ the measurement chord."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density
  - name:volume_averaged_xenon_density
  - name:xenon_density_at_magnetic_axis
  - name:line_averaged_argon_density
  arguments:
  - name: xenon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/xenon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-xenon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/n_i/xenon
      parent: Xenon
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Xenon.
      kind: template
- name: y_direction_unit_vector_of_neutron_detector
  kind: scalar
  status: active
  description: Y direction unit-vector component of a neutron detector is the y direction
    cosine, in the right-handed Cartesian (x, y, z) basis, of the unit vector from
    a field-of-view voxel center toward the detector center.
  documentation: 'Y direction unit-vector component of a neutron detector is the signed
    projection, in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis,
    of the unit vector directed from a field-of-view voxel center toward the detector
    center. It is the y direction cosine of that line-of-sight direction.


    The component is defined by projecting the detector-directed unit vector onto
    the $\hat{y}$ basis vector:


    $$

    u_y = \hat{\mathbf{u}}_{\mathrm{det}} \cdot \hat{y} = \frac{(\mathbf{r}_{\mathrm{det}}
    - \mathbf{r}_{\mathrm{vox}}) \cdot \hat{y}}{\lVert \mathbf{r}_{\mathrm{det}} -
    \mathbf{r}_{\mathrm{vox}} \rVert}

    $$


    where $\hat{\mathbf{u}}_{\mathrm{det}}$ is the unit vector from the field-of-view
    voxel center to the detector center, $\mathbf{r}_{\mathrm{det}}$ is the detector-center
    position, $\mathbf{r}_{\mathrm{vox}}$ is the field-of-view voxel-center position,
    and $\hat{y}$ is the y basis vector of the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.


    This quantity is a signed direction-cosine component, not a position coordinate,
    distance, or unnormalized displacement component. Together with the corresponding
    x and z components it satisfies $u_x^2 + u_y^2 + u_z^2 = 1$ when the field-of-view
    voxel center and detector center are distinct.


    Sign convention: Positive when the direction from the field-of-view voxel center
    toward the detector center has a component in the $+\hat{y}$ direction of the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:x_direction_unit_vector_of_neutron_detector
  - name:z_direction_unit_vector_of_neutron_detector
  sources:
  - dd_path: neutron_diagnostic/detector/field_of_view/direction_to_detector/y
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-detector-field_of_view-direction_to_detector-y
    dd_documentation:
      leaf: Component along Y axis  for each voxel
      parent_path: neutron_diagnostic/detector/field_of_view/direction_to_detector
      parent: Vector that points from the centre of the voxel to the centre of the
        detector, described in the (X,Y,Z) coordinate system, where X is the major
        radius axis for phi = 0, Y is the major radius axis for phi = pi/2, and Z
        is the height axis.
      data_type: FLT_3D
      unit: m
      coordinates:
      - neutron_diagnostic/detector/field_of_view/emission_grid/z
      - neutron_diagnostic/detector/field_of_view/emission_grid/r
      - neutron_diagnostic/detector/field_of_view/emission_grid/phi
    enhanced_context:
      description: Y coordinate of direction to detector.
      kind: template
- name: z_direction_unit_vector_of_neutron_detector
  kind: scalar
  status: active
  description: "Z component in the right-handed Cartesian (x\u0302, y\u0302, z\u0302\
    ) basis of the unit direction vector from each field-of-view voxel to the neutron\
    \ detector center, with z\u0302 vertical. It is the vertical direction cosine,\
    \ not a position coordinate."
  documentation: 'Z component in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis of the unit direction vector from each field-of-view voxel to the neutron
    detector center is the projection of that voxel-to-detector direction onto the
    vertical basis vector $\hat{z}$. It represents the vertical direction cosine of
    the ray from the voxel toward the detector center.


    The component is defined by the normalized displacement from the voxel position
    to the detector-center position:


    $$

    u_z = \frac{(\mathbf{r}_d - \mathbf{r}_v) \cdot \hat{z}}{\lVert \mathbf{r}_d -
    \mathbf{r}_v \rVert}

    $$


    where $u_z$ is the z component of the direction unit vector, $\mathbf{r}_v$ is
    the field-of-view voxel position, $\mathbf{r}_d$ is the neutron detector-center
    position, and $\hat{z}$ is the vertical basis vector of the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ basis.


    Together with [x_direction_unit_vector_of_neutron_detector](name:x_direction_unit_vector_of_neutron_detector)
    and [y_direction_unit_vector_of_neutron_detector](name:y_direction_unit_vector_of_neutron_detector),
    it forms the direction-cosine triplet of the same voxel-to-detector ray, so $u_x^2
    + u_y^2 + u_z^2 = 1$ and $-1 \le u_z \le 1$. This quantity is a direction cosine,
    not a vertical position coordinate or displacement magnitude; it is the neutron-detector
    analog of [z_direction_unit_vector_of_camera](name:z_direction_unit_vector_of_camera).


    Sign convention: Positive when the direction from the field-of-view voxel toward
    the neutron detector center has a component in the $+\hat{z}$ direction of the
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:x_direction_unit_vector_of_neutron_detector
  - name:y_direction_unit_vector_of_neutron_detector
  sources:
