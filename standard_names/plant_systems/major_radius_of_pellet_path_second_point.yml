name: major_radius_of_pellet_path_second_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the second (remote) point defining the
  geometric path of a fuel pellet through the plasma.
documentation: "The major radius $R_2$ (in m) specifies the $R$ coordinate of the\
  \ second endpoint of the straight-line segment used to represent a pellet trajectory\
  \ inside the vacuum vessel. Together with the first-point major radius $R_1$, this\
  \ pair of points defines the injection geometry in the $(R, Z, \\phi)$ cylindrical\
  \ coordinate system, from which the pellet path length through the plasma cross-section\
  \ is computed. Typical values depend on machine size: 1.0\u20132.5 m for medium-size\
  \ tokamaks, and $\\sim$4\u20138 m for ITER-scale devices. The path geometry determines\
  \ the deposition profile via ablation models such as the neutral-gas-shielding (NGS)\
  \ model. See also `major_radius_of_pellet_path_first_point` for the entry point\
  \ and `pellet_initial_velocity` for the pellet speed along this path."
