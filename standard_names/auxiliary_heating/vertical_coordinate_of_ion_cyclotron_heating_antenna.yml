name: vertical_coordinate_of_ion_cyclotron_heating_antenna
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of the ICRH antenna reference point in the
  machine cylindrical coordinate system.
documentation: "The vertical coordinate $Z_{\\mathrm{IC}}$ locates the reference point\
  \ of an ion cyclotron resonance heating (ICRH) antenna in the tokamak cylindrical\
  \ coordinate system $(R, \\phi, Z)$. This position anchors the geometric model of\
  \ the antenna structure \u2014 including current straps, Faraday screen, and feed-through\
  \ \u2014 used in full-wave and coupling codes (e.g., TOPICA, RAPLICASOL) to compute\
  \ the launched power spectrum. Typical values depend on machine size: $Z_{\\mathrm{IC}}\
  \ \\approx 0\\;\\mathrm{m}$ for midplane-mounted antennas on JET or ASDEX Upgrade,\
  \ while off-midplane designs may place the reference at $|Z| \\lesssim 0.5\\;\\\
  mathrm{m}$. On ITER the ICRH antenna is located near the outboard midplane with\
  \ $Z \\approx 0\\;\\mathrm{m}$. The companion major-radius coordinate completes\
  \ the poloidal-plane location. See also `ion_cyclotron_heating_antenna_phase_reference_waveform`\
  \ for the associated phase control signal."
