  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the center of a camera in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "The vertical coordinate $Z$ locates the geometric center of a camera\
    \ \u2014 encompassing visible, X-ray, and UV imaging instruments \u2014 along\
    \ the machine symmetry axis in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is the major radius from the symmetry axis, $\\phi$ is the toroidal\
