- name: radial_ion_charge_state_diffusivity
  kind: scalar
  status: active
  description: Radial ion charge-state diffusivity is the effective Fickian particle
    diffusivity for ions in a specified ionization state along the radial direction.
  documentation: 'Radial ion charge-state diffusivity is the effective Fickian particle
    diffusivity for ions in a specified ionization state along the radial direction.
    It is the scalar transport coefficient that relates the radial diffusive particle
    flux density of that charge state to the negative radial gradient of its number
    density.


    For the radial projection in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height,
    the defining Fickian relation is:


    $$

    \Gamma^{\mathrm{diff}}_{s,R} = -D_{s,R}\,\nabla_R n_s

    $$


    where $\Gamma^{\mathrm{diff}}_{s,R}$ is the radial diffusive particle flux density
    of charge state $s$, $D_{s,R}$ is this diffusivity, $n_s$ is the number density
    of charge state $s$, and $\nabla_R n_s = \hat{\mathbf{R}}\cdot\nabla n_s$ is its
    derivative along increasing $R$.


    This quantity is charge-state-resolved and applies to one ionization state, unlike
    the charge-state-averaged [ion diffusivity](name:ion_diffusivity). It is the radial
    counterpart of [ion charge-state diffusivity](name:ion_charge_state_diffusivity)
    and is equivalent to [radial ion charge-state diffusion coefficient](name:radial_ion_charge_state_diffusion_coefficient)
    when the same Fickian closure is used. Radial denotes the cylindrical $\hat{\mathbf{R}}$
    projection and is not synonymous with a flux-surface-normal projection; convective
    transport and particle sources or sinks are excluded.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_diffusivity
  - name:ion_charge_state_diffusivity
  - name:radial_ion_charge_state_diffusion_coefficient
  arguments:
  - name: ion_charge_state_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
