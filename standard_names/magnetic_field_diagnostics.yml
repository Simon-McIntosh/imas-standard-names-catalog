- name: vertical_coordinate_of_flux_loop
  kind: scalar
  status: draft
  description: Vertical Z coordinate of a flux loop diagnostic in the right-handed
    cylindrical (R, phi, Z) frame, giving the height of the loop above or below the
    machine midplane.
  documentation: "The vertical coordinate $Z$ locates a flux loop diagnostic along\
    \ the direction parallel to the toroidal symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $R$ is the major radius, $\\phi$ is the toroidal\
    \ angle increasing counter-clockwise when viewed from above $+\\hat{Z}$, and $Z$\
    \ increases upward from the geometric midplane. Together with the [radial coordinate](name:radial_coordinate_of_flux_loop)\
    \ $R$, it fixes the poloidal-plane position of the loop, which is essential for\
    \ mapping the induced voltage signal to the local poloidal magnetic flux distribution\
    \ used in equilibrium reconstruction.\n\nThe $Z$ coordinate is determined during\
    \ installation by precision engineering surveys and is fixed hardware metadata\
    \ characterizing the diagnostic geometry. Knowing the full $(R, Z)$ position enables\
    \ forward-model calculations of the expected flux threading each loop for a given\
    \ equilibrium, which are compared against [measured voltage signals](name:voltage_of_flux_loop)\
    \ integrated over time; the [effective sensing area](name:area_of_flux_loop) must\
    \ also be known to complete this calibration.\n\nTypical $Z$ values span from\
    \ the machine midplane ($Z = 0$) to $\\pm 1$\u2013$\\pm 4$ m in medium to large\
    \ tokamaks, placing flux loops on the inboard wall, outboard wall, and top or\
    \ bottom regions of the vacuum vessel. The analogous vertical-position quantity\
    \ for Rogowski coil diagnostics is [vertical coordinate of the Rogowski coil](name:vertical_coordinate_of_rogowski_coil).\n\
    \nSign convention: Positive when the flux loop position is located above the machine\
    \ midplane in the $+Z$ direction of the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame."
