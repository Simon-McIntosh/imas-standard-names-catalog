- name: normalized_toroidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at the physical position sampled by a diagnostic measurement.
    It identifies the corresponding nested flux surface, with 0 at the magnetic axis
    and approximately 1 at the last closed flux surface.
  documentation: 'The normalized toroidal flux coordinate at a measurement position
    is the dimensionless radial label assigned to the point or localized region sampled
    by a diagnostic measurement. It is derived from the toroidal magnetic flux enclosed
    by nested magnetic flux surfaces, with the origin at the magnetic axis and the
    outer normalization reference at the plasma boundary or last closed flux surface.


    The coordinate is defined from the toroidal flux difference between the flux surface
    through the measurement position and the magnetic-axis flux:


    $$

    \rho_{\mathrm{tor,norm}}(\mathbf{x}_m) = \sqrt{\frac{\Phi_m - \Phi_0}{\Phi_b -
    \Phi_0}}

    $$


    where $\mathbf{x}_m$ is the measurement position, $\Phi_m$ is the toroidal magnetic
    flux in Wb of the flux surface passing through that position, $\Phi_0$ is the
    magnetic-axis toroidal flux in Wb, and $\Phi_b$ is the boundary toroidal flux
    in Wb. The square root makes this a nonnegative radial coordinate; for a valid
    nested-flux-surface mapping the numerator and denominator have the same flux orientation,
    so the ratio is nonnegative and increases outward from the magnetic axis.


    In practice, the value is obtained by combining the diagnostic measurement geometry
    with an equilibrium reconstruction that maps the sampled position to a flux surface.
    For measurements with finite spatial extent, the value represents the effective
    or representative measurement position used in the diagnostic interpretation,
    rather than a property of the diagnostic signal itself.


    Typical values for measurements inside the confined plasma are 0-1, with values
    near 0 corresponding to the core, 0.2-0.8 to the plasma interior, and 0.8-1 to
    the edge region near the last closed flux surface. Values greater than 1 can occur
    for positions mapped outside the last closed flux surface or when an equilibrium
    mapping is extrapolated beyond the confined region.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
  - name:normalized_toroidal_flux_coordinate_at_constraint_position
  sources:
  - id: dd:ece/t_radiation_central_x/rho_tor_norm
    dd_path: ece/t_radiation_central_x/rho_tor_norm
    status: composed
- name: parallel_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Dimensionless signed fraction of the beam power flow parallel to the
    local magnetic field along a beam-tracing ray path, normalized to the initial
    launched power. It is based on the time-averaged wave power flow; positive values
    indicate local propagation along the magnetic field.
  documentation: 'The parallel normalized power of a beam-tracing beam is the field-aligned
    component of the beam power flow divided by the initial launched power. It describes
    how much of the surviving wave power is transported along the local magnetic field
    direction at each point on the ray path, with the sign retained.


    For an arc-length coordinate $s$ along the beam path, the quantity is defined
    by


    $$

    p_{\parallel,\mathrm{norm}}(s) = \frac{\mathbf{P}(s) \cdot \hat{\mathbf{b}}(s)}{P_0}

    $$


    where $\mathbf{P}(s)$ is the time-averaged beam power-flow vector obtained from
    the electromagnetic Poynting flux integrated over the local beam cross-section
    and has unit W, $P_0$ is the initial launched power and has unit W, and $\hat{\mathbf{b}}(s)=\mathbf{B}(s)/|\mathbf{B}(s)|$
    is the dimensionless unit vector along the local magnetic field.


    In beam tracing, this quantity is computed from the ray direction, wave amplitude
    or wave-action evolution, and the local magnetic-field direction. Absorption,
    mode conversion, or other power-loss mechanisms reduce the magnitude as the beam
    propagates; the sign is evaluated locally throughout propagation relative to $\hat{\mathbf{b}}(s)$,
    not fixed by the initial launch direction. It complements the perpendicular normalized
    power by separating field-aligned and cross-field transport of the time-averaged
    wave power.


    Typical values are between -1 and 1 for passive propagation without gain. Values
    near 1 indicate power flow nearly parallel to the local magnetic field, values
    near -1 indicate power flow nearly antiparallel to it, and values near 0 indicate
    predominantly perpendicular power flow or a strongly attenuated beam.


    Sign convention: Positive when the time-averaged beam power flow at the evaluated
    point has a component in the direction of the local magnetic field.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_normalized_power_of_beam_tracing_beam
  - name:length_of_electron_cyclotron_beam
  - name:parallel_refractive_index
  - name:electron_absorbed_power_of_beam_tracing_beam
  sources:
  - id: dd:ece/channel/beam_tracing/beam/power_flow_norm/parallel
    dd_path: ece/channel/beam_tracing/beam/power_flow_norm/parallel
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/power_flow_norm/parallel
    dd_path: waves/coherent_wave/beam_tracing/beam/power_flow_norm/parallel
    status: attached
- name: perpendicular_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Non-negative fraction of the beam power-flow vector lying in the plane
    perpendicular to the local magnetic field, normalized to the initial launch power.
    It is a magnitude, not a signed projection onto a chosen perpendicular direction.
  documentation: 'Perpendicular normalized power of a beam-tracing beam is the magnitude
    of the beam power flow across the local magnetic-field direction, divided by the
    initial launched beam power. The perpendicular direction is the plane normal to
    the local magnetic field, so this scalar does not choose or encode a signed direction
    within that plane.


    A dimensionally consistent definition uses the beam power-flow vector, not a Poynting
    flux density:


    $$

    p_{\perp,N}(s) = \frac{P_\perp(s)}{P_0} = \frac{\left|\mathbf{P}(s) - \left[\mathbf{P}(s)\cdot\hat{\mathbf{b}}(s)\right]\hat{\mathbf{b}}(s)\right|}{P_0}

    $$


    where $s$ parameterizes position along the ray path, $\mathbf{P}(s)$ is the local
    beam power-flow vector integrated over the beam cross-section, $P_0$ is the initial
    launch power, and $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the unit vector
    along the local magnetic field. Both $\mathbf{P}$ and $P_0$ represent powers in
    W, making $p_{\perp,N}$ dimensionless.


    In beam tracing, this quantity is computed from the local group-velocity or power-flow
    direction together with the remaining beam power after absorption, emission, or
    gain processes included in the model. It is used to distinguish cross-field transport
    of wave energy from power flow along the magnetic field.


    Typical values range from 0-1 in passive calculations normalized to the launched
    power. Values near 0 indicate propagation nearly along the magnetic field, while
    values near the local normalized remaining beam power indicate predominantly cross-field
    propagation; values above 1 require net amplification or a source term in the
    modeled beam power.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:initial_power_of_beam_tracing_beam
  - name:parallel_normalized_power_of_beam_tracing_beam
  sources:
  - id: dd:ece/channel/beam_tracing/beam/power_flow_norm/perpendicular
    dd_path: ece/channel/beam_tracing/beam/power_flow_norm/perpendicular
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/power_flow_norm/perpendicular
    dd_path: waves/coherent_wave/beam_tracing/beam/power_flow_norm/perpendicular
    status: attached
- name: perpendicular_wave_vector_magnitude
  kind: scalar
  status: draft
  description: Magnitude of the wave vector component perpendicular to the local equilibrium
    magnetic field, setting the cross-field spatial scale of wave-plasma coupling
    and turbulent density fluctuation backscattering.
  documentation: 'The perpendicular wave vector magnitude $k_\perp$ is the modulus
    of the wave propagation vector projected onto the plane perpendicular to the local
    equilibrium magnetic field $\mathbf{B}_0$. It governs the cross-field spatial
    periodicity of the wave and is fundamental to both electromagnetic wave propagation
    calculations and fluctuation turbulence diagnostics. This scalar quantity is the
    magnitude of [perpendicular_wave_vector](name:perpendicular_wave_vector).


    $$

    k_\perp = |\mathbf{k} - (\mathbf{k} \cdot \hat{b})\hat{b}|

    $$


    where $\hat{b} = \mathbf{B}_0 / |\mathbf{B}_0|$ is the unit vector along the equilibrium
    magnetic field and $\mathbf{k}$ is the full wave vector.


    In Doppler reflectometry, the Bragg backscattering condition selects density fluctuations
    at $k_\perp \approx 2 k_0 \sin\theta$, where $k_0 = \omega/c$ is the vacuum wavenumber
    and $\theta$ is the beam tilt angle. The doppler_frequency shift of the backscattered
    signal is proportional to $k_\perp$ times the perpendicular plasma flow velocity,
    enabling turbulence wavenumber spectra to be resolved across the spectral_frequency
    grid. In wave beam tracing, $k_\perp$ characterizes the cross-field propagation
    scale relevant for finite Larmor radius effects and mode conversion, complementing
    the field-aligned scale encoded in the [parallel_refractive_index](name:parallel_refractive_index).


    Typical values in Doppler reflectometry range from a few to several hundred m$^{-1}$,
    probing turbulent density fluctuations from the plasma minor-radius scale down
    toward the ion gyroradius.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:perpendicular_wave_vector
  - name:parallel_refractive_index
  sources:
  - id: dd:reflectometer_fluctuation/channel/doppler/wavenumber
    dd_path: reflectometer_fluctuation/channel/doppler/wavenumber
    status: composed
  - id: dd:waves/coherent_wave/full_wave/k_perpendicular/values
    dd_path: waves/coherent_wave/full_wave/k_perpendicular/values
    status: attached
  - id: dd:waves/coherent_wave/profiles_1d/k_perpendicular
    dd_path: waves/coherent_wave/profiles_1d/k_perpendicular
    status: attached
- name: poloidal_angle_of_measurement_position
  kind: scalar
  status: draft
  description: Poloidal angle of a diagnostic measurement position in the poloidal
    cross-section of the right-handed cylindrical (R, phi, Z) frame. The zero direction
    is outward major radius +R from the magnetic axis, and positive angles increase
    clockwise when viewed from the +phi direction.
  documentation: 'The poloidal angle of a measurement position is the angular coordinate
    of that point about the magnetic axis in a poloidal cross-section of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It identifies where around the magnetic axis
    a diagnostic samples, separate from any radial coordinate or absolute position
    coordinates.


    For a measurement position $(R_\mathrm{m},Z_\mathrm{m})$ and magnetic-axis position
    $(R_\mathrm{ax},Z_\mathrm{ax})$ in that cross-section, the clockwise-positive
    angle from the outward radial direction can be written as:


    $$

    \theta \equiv \operatorname{atan2}(Z_\mathrm{ax}-Z_\mathrm{m},\, R_\mathrm{m}-R_\mathrm{ax})
    \pmod{2\pi}

    $$


    where $R_\mathrm{m}$ and $Z_\mathrm{m}$ are the measurement-position major radius
    and vertical height in meters, $R_\mathrm{ax}$ and $Z_\mathrm{ax}$ are the magnetic-axis
    major radius and vertical height in meters, and $\operatorname{atan2}(y,x)$ returns
    a quadrant-resolved angle in radians. Values that differ by $2\pi n$ with integer
    $n$ represent the same physical direction; the branch, such as $(-\pi,\pi]$ or
    $[0,2\pi)$, is a representation choice rather than part of the physical definition.


    In practice this angle is computed from the reconstructed measurement position
    and magnetic-axis location, or from an equivalent ray, beam, or scattering-point
    geometry for electromagnetic-wave diagnostics. It is commonly used together with
    measurement-position major radius, vertical height, or a radial flux coordinate
    to describe the diagnostic sampling location without implying a unique spatial
    position by the angle alone.


    A full poloidal coverage spans any interval of length $2\pi$ rad. With the convention
    above, outboard-midplane positions have $\theta$ near 0 rad, lower positions have
    $\theta$ near $+1.57$ rad, upper positions have $\theta$ near $-1.57$ rad, and
    inboard-midplane positions lie near $\pm 3.14$ rad depending on the chosen branch.


    Sign convention: Positive when the angular displacement from the outward radial
    $+R$ direction toward the measurement position is clockwise in the poloidal cross-section
    of the right-handed cylindrical $(R,\phi,Z)$ frame when viewed from the $+\hat{\phi}$
    direction.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
