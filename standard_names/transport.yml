- name: loop_voltage_at_plasma_boundary
  kind: scalar
  status: active
  description: Toroidal electromotive force evaluated on the last closed flux surface
    that drives the conventionally signed ohmic plasma current.
  documentation: 'The loop voltage at the plasma boundary is the toroidal electromotive
    force associated with the inductive electric field around the last closed magnetic-flux
    surface. It is the net voltage available to drive the ohmic component of the confined
    plasma current.


    For a closed toroidal contour $C$ on the last closed flux surface, the loop voltage
    is defined by


    $$

    V_{\mathrm{loop}} = \oint_C \mathbf{E} \cdot d\boldsymbol{\ell}

    $$


    where $V_{\mathrm{loop}}$ is the loop voltage, $\mathbf{E}$ is the electric-field
    vector, $d\boldsymbol{\ell}$ is the directed line element, and $C$ is oriented
    in the direction of increasing toroidal angle. The quantity is a contour-integrated
    scalar evaluated at the plasma boundary, not a local electric-field component
    or an external-coil terminal voltage.


    This boundary quantity represents the total loop voltage driving plasma current,
    including the inductive contribution associated with changing poloidal magnetic
    flux. It excludes no plasma-current-driving contribution merely because it is
    externally generated; the narrower [external loop voltage](name:external_loop_voltage)
    denotes only the externally generated contribution and is therefore not equivalent
    to the total boundary loop voltage.


    The loop voltage is related to the ohmic plasma-current drive through the toroidal
    component of the electric field and the plasma conductivity. The right-handed
    cylindrical $(R,\phi,Z)$ frame uses $R$ for major radius, $\phi$ for toroidal
    angle, and $Z$ for vertical height.


    Sign convention: Positive when the electromotive force drives conventional plasma
    current in the direction of increasing toroidal angle $\phi$, counter-clockwise
    when viewed from above along $+\hat{Z}$.'
  unit: V
  physics_domain: transport
  links: []
  sources:
  - kind: imas-dd
    ref: core_profiles/global_quantities/v_loop
    version: 4.1.0
  - kind: imas-dd
    ref: plasma_profiles/global_quantities/v_loop
    version: 4.1.0
  - kind: imas-dd
    ref: summary/global_quantities/v_loop/value
    version: 4.1.0
- name: neon_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the neon ion population evaluated at the
    magnetic axis is the local neon-ion count per physical volume at that location,
    summed over all ionic charge states.
  documentation: 'Particle number density of the neon ion population evaluated at
    the magnetic axis is the local neon-ion count per physical volume at that location,
    summed over all neon ionic charge states. It represents neon ions specifically,
    rather than neutral neon, electrons, or another plasma population.


    The defining relation is


    $$

    n_{\mathrm{Ne,axis}} = \sum_{q=1}^{Z_{\mathrm{Ne}}} n_{\mathrm{Ne}^{q+},\mathrm{axis}}

    $$


    where $n_{\mathrm{Ne,axis}}$ is the total neon-ion number density at the magnetic
    axis, $n_{\mathrm{Ne}^{q+},\mathrm{axis}}$ is the number density of neon ions
    with charge state $q$ at that location, $q$ is the positive ionic charge-state
    index, and $Z_{\mathrm{Ne}}$ is the atomic number of neon.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the neon-ion population at that location and is summed over ionic charge
    states; neutral neon is excluded, and the quantity is neither a flux-surface nor
    a volume integral.


    This is the neon-specific realization of the population-independent [density at
    the magnetic axis](name:density_at_magnetic_axis). It has the same locus and charge-state
    aggregation convention as [oxygen density at the magnetic axis](name:oxygen_density_at_magnetic_axis),
    but counts neon ions rather than oxygen ions.'
  unit: m^-3
