    dd_path: edge_profiles/ggd/ion/state/velocity_exb/poloidal
    status: composed
- name: poloidal_magnetic_field
  kind: scalar
  status: draft
  description: Poloidal component of the magnetic field vector in the edge plasma,
    representing the magnetic field in the direction of increasing poloidal angle.
  documentation: 'The poloidal magnetic field $B_\theta$ is the projection of the
    magnetic field vector $\mathbf{B}$ onto the poloidal direction (the direction
    of increasing poloidal angle $\theta$ on a flux surface). It is a fundamental
    quantity in tokamak plasmas, as the plasma current $I_p$ generates the poloidal
    field that, combined with the toroidal field $B_\phi$, produces the helical field-line
    structure. The poloidal field strength is typically an order of magnitude smaller
    than the toroidal field in conventional tokamaks, with values ranging from 0.01
    to 0.1 T in the edge plasma of medium-size devices.


    The poloidal field is measured indirectly through external magnetic coils (pickup
    coils or flux loops) and reconstructed via equilibrium codes that solve the Grad-Shafranov
    equation. It is directly related to the safety factor $q = r B_\phi / (R B_\theta)$
    and the poloidal flux $\psi$ through $B_\theta = |\nabla \psi| / (2\pi R)$.


    Sign convention: Positive when $B_\theta$ points in the direction of increasing
    poloidal angle $\theta$ (from the inboard to the outboard side).


    See also [toroidal_magnetic_field](name:toroidal_magnetic_field), [radial_magnetic_field](name:radial_magnetic_field),
    and [magnetic_field](name:magnetic_field).'
  unit: T
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_magnetic_field
  - name:radial_magnetic_field
  - name:magnetic_field
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/b_field/poloidal
    dd_path: edge_profiles/ggd/b_field/poloidal
    status: composed
- name: poloidal_magnetic_flux_at_pedestal
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the pedestal top, defining the radial location
    of the edge transport barrier maximum pressure gradient.
  documentation: 'The poloidal magnetic flux at the pedestal top, $\psi_{\text{ped}}$,
    is a key flux-surface label that identifies the radial position of the steep-gradient
    region in the edge transport barrier (H-mode pedestal). This location corresponds
    to the maximum of the pressure gradient, typically near the top of the pedestal,
    and separates the core plasma from the scrape-off layer. $\psi_{\text{ped}}$ is
    obtained from equilibrium reconstruction and provides the outer normalization
    reference for confined flux in the pedestal region, complementing the poloidal
    flux at the magnetic axis $\psi_{\text{axis}}$ and the poloidal flux at the separatrix
    $\psi_{\text{sep}}$. In conventional H-mode tokamaks, $\psi_{\text{ped}}$ typically
    lies between 80% and 95% of the total poloidal flux from axis to separatrix, and
    its value is critical for pedestal stability analyzes and energy confinement scaling.
    This quantity, like all poloidal flux variants, is sign-sensitive to the magnetic
    field direction convention.


    Sign convention: Positive when the poloidal magnetic flux decreases from the magnetic
    axis to the plasma boundary for positive plasma current $I_p$.


    See also [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)
    and [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal) for related
    pedestal diagnostics.'
  unit: Wb
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_magnetic_flux_of_magnetic_axis
  - name:magnetic_shear_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/position/psi
    dd_path: summary/local/pedestal/position/psi
    status: composed
- name: radial_anomalous_current_density
  kind: scalar
  status: draft
  description: Radial component of the electric current density driven by anomalous
    or turbulent transport processes in the edge plasma.
  documentation: 'The radial anomalous current density $j_{r,\mathrm{an}}$ represents
    the radial component of the electric current arising from non-classical, turbulence-driven
    transport, distinct from neoclassical or inductive current contributions. This
    quantity is part of the vector [anomalous_current_density](name:anomalous_current_density)
    and is typically evaluated from gyrokinetic or fluid turbulence simulations that
    capture the effect of fluctuating fields and flows on radial current transport.
    In the edge and scrape-off layer, typical values range from $10^3$ to $10^5$ A/m$^2$,
    depending on the turbulent drive and plasma collisionality, as inferred from Braginskii-based
    modeling or measured indirectly through reciprocating probe arrays.


    Sign convention: Positive when the radial current flows outward from the magnetic
    axis.


    The radial component is complementary to the [poloidal_anomalous_current_density](name:poloidal_anomalous_current_density)
    and [toroidal_anomalous_current_density](name:toroidal_anomalous_current_density)
    components, and is distinguished from the [radial_total_current_density](name:radial_total_current_density)
    by its exclusive attribution to anomalous transport processes.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:anomalous_current_density
  - name:poloidal_anomalous_current_density
  - name:toroidal_anomalous_current_density
  - name:radial_total_current_density
  arguments:
  - name: anomalous_current_density
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/j_anomalous/radial
    dd_path: plasma_profiles/ggd/j_anomalous/radial
    status: composed
- name: radial_electron_particle_flux
  kind: scalar
  status: draft
  description: Radial component of the electron particle flux density across magnetic
    flux surfaces, describing cross-field electron transport in the edge plasma.
  documentation: 'The radial electron particle flux density $\Gamma_{e,r} = n_e v_{e,r}$
    quantifies the net cross-field transport rate of electrons across flux surfaces
    in the edge and scrape-off layer, where $n_e$ is the local electron density and
    $v_{e,r}$ is the radial component of the electron fluid velocity. Positive values
    indicate outward (radially increasing major radius) transport, while negative
    values indicate inward transport. This quantity directly enters the electron density
    continuity equation: $\partial n_e/\partial t + \nabla \cdot \Gamma_e = S_e$,
    where $S_e$ represents particle sources from ionization and recombination. Radial
    electron particle flux is typically inferred from reciprocating Langmuir probe
    measurements in the scrape-off layer or from interpretive transport codes that
    combine profile data with a diffusive-convective ansatz. Typical outward flux
    magnitudes range from $10^{20}$ to $10^{22}$ m$^{-2}$s$^{-1}$ in the edge region
    of diverted tokamaks. The radial component is distinguished from the total [electron_particle_flux](name:electron_particle_flux)
    by isolating only the cross-field transport channel. Sibling quantities include
    [radial_electron_energy_flux](name:radial_electron_energy_flux), [radial_ion_state_particle_flux](name:radial_ion_state_particle_flux),
    and [radial_neutral_state_particle_flux](name:radial_neutral_state_particle_flux).'
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_particle_flux
  - name:radial_electron_energy_flux
  - name:radial_ion_state_particle_flux
  - name:radial_neutral_state_particle_flux
  arguments:
  - name: electron_particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/electrons/particles/flux_radial/values
    dd_path: edge_transport/model/ggd/electrons/particles/flux_radial/values
    status: composed
- name: radial_ion_state_particle_flux
  kind: scalar
  status: draft
  description: Radial component of the particle flux for an ion charge state in the
    edge transport model, positive when directed away from the magnetic axis.
  documentation: 'The radial ion state particle flux $\Gamma_{\text{radial},Z}$ represents
    the net outward transport of ions in a specific charge state $Z$ across radial
    surfaces in the edge plasma. This flux is governed by the radial transport equation,
    combining diffusive and convective contributions: $\Gamma_{\text{radial},Z} =
    -D_Z \, \partial n_Z / \partial r + v_Z \, n_Z$, where $D_Z$ is the diffusion
    coefficient, $v_Z$ is the convective velocity, $n_Z$ is the charge-state density,
    and $r$ is the radial coordinate. In the edge region, typical particle fluxes
    for impurity charge states range from $10^{17}$ to $10^{20}$ m$^{-2}$s$^{-1}$,
    depending on the source rate and screening efficiency. This quantity is a key
    input to edge transport simulations and is inferred from spectroscopic measurements
    of line emission from individual charge states. The radial component is distinguished
    from the total particle flux by its projection onto the radial coordinate of the
    IMAS cylindrical $(R, \phi, Z)$ frame. Related quantities include the radial particle
    flux for the total ion population (`[radial_ion_particle_flux](name:radial_ion_particle_flux)`)
    and the radial energy flux for the same charge state (`[radial_ion_state_energy_flux](name:radial_ion_state_energy_flux)`).
    The parent quantity `[ion_state_particle_flux](name:ion_state_particle_flux)`
    gives the total flux magnitude without directional decomposition.


    Sign convention: Positive when the flux vector points along the outward radial
    direction, away from the magnetic axis.'
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_particle_flux
  - name:radial_ion_state_energy_flux
  - name:ion_state_particle_flux
  arguments:
  - name: ion_state_particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/flux_radial/values
    dd_path: edge_transport/model/ggd/ion/state/particles/flux_radial/values
    status: composed
- name: radial_momentum_diffusivity
  kind: scalar
  status: draft
  description: Radial component of the effective momentum diffusivity governing cross-field
    transport of toroidal angular momentum in the edge plasma.
  documentation: "The radial momentum diffusivity $\\chi_{\\phi}^{\\mathrm{(rad)}}$\
    \ quantifies the radial transport of toroidal angular momentum in the edge plasma\
    \ via the diffusive closure $\\Pi_{r\\phi} = -\\chi_{\\phi}^{\\mathrm{(rad)}}\
    \ \\, \\partial (m_i n_i v_\\phi) / \\partial r$, where $\\Pi_{r\\phi}$ is the\
    \ radial-toroidal component of the momentum flux density, $m_i$ and $n_i$ are\
    \ the main ion mass and density, and $v_\\phi$ is the toroidal rotation velocity.\
    \ In the edge pedestal, the radial momentum diffusivity is typically $0.1$\u2013\
    $10\\,\\mathrm{m}^2\\mathrm{s}^{-1}$, significantly larger than neoclassical predictions\
    \ due to turbulent transport driven by ion-scale instabilities such as ion temperature\
    \ gradient (ITG) and trapped electron modes (TEM). This quantity is inferred from\
    \ experimental rotation profiles measured by charge-exchange recombination spectroscopy\
    \ (CXRS) combined with neoclassical and gyrokinetic transport modeling. The sign\
    \ of $\\chi_{\\phi}^{\\mathrm{(rad)}}$ is always positive for a physically meaningful\
    \ diffusive flux down the rotation gradient. See also the related radial transport\
    \ coefficients [radial_ion_energy_diffusivity](name:radial_ion_energy_diffusivity)\
    \ and [radial_particle_diffusivity](name:radial_particle_diffusivity), and the\
    \ full vector [momentum_diffusivity](name:momentum_diffusivity)."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_diffusivity
  - name:radial_particle_diffusivity
  - name:momentum_diffusivity
  arguments:
  - name: momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/momentum/d_radial/values
    dd_path: edge_transport/model/ggd/momentum/d_radial/values
    status: composed
- name: toroidal_argon_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal fluid velocity of the argon impurity ion population at the
    top of the edge pedestal.
  documentation: "The toroidal velocity $v_{\\phi,\\mathrm{Ar}}$ quantifies the bulk\
    \ toroidal rotation of argon impurity ions at the pedestal top, defined as $v_{\\\
    phi,\\mathrm{Ar}} = \\mathbf{v}_{\\mathrm{Ar}} \\cdot \\hat{\\phi}$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. This velocity is a key boundary condition\
    \ for neoclassical and turbulent impurity transport models, influencing the screening\
    \ of argon from the core plasma in tokamak H-mode operation. Typical pedestal-top\
    \ values range from 20\u2013100 km/s in medium-size tokamaks like DIII-D and ASDEX\
    \ Upgrade, measured via charge exchange recombination spectroscopy (CXRS) on argon\
    \ emission lines. The toroidal rotation of intrinsic impurities like argon is\
    \ closely linked to the main-ion rotation through neoclassical friction, as described\
    \ by the force balance relation $\\mathbf{E} + \\mathbf{v} \\times \\mathbf{B}\
    \ = \\nabla p_i / (n_i Z_i e)$.\n\nSign convention: Positive when $v_{\\phi,\\\
    mathrm{Ar}}$ points in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ when viewed from above $+\\hat{Z}$).\n\nCompare with [toroidal_argon_velocity_at_magnetic_axis](name:toroidal_argon_velocity_at_magnetic_axis)\
    \ for the core rotation and [toroidal_argon_velocity_at_separatrix](name:toroidal_argon_velocity_at_separatrix)\
    \ for the outermost closed flux surface. The associated poloidal rotation is described\
    \ by [charge_exchange/channel/ion/velocity_pol/data](name:charge_exchange/channel/ion/velocity_pol/data)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_separatrix
  - name:charge_exchange
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/argon/value
    dd_path: summary/local/pedestal/velocity_phi/argon/value
    status: composed
- name: toroidal_argon_velocity_at_separatrix
  kind: scalar
  status: draft
  description: Toroidal component of the argon impurity ion fluid velocity at the
    separatrix, the outermost closed flux surface of the confined plasma.
  documentation: 'The toroidal argon velocity $v_{\phi,\mathrm{Ar}}$ at the separatrix
    describes the rotation of the argon impurity ion population in the geometric toroidal
    direction $\hat{\phi}$ at the last closed flux surface. This quantity is a direct
    measurement of the edge impurity ion toroidal rotation and is routinely inferred
    from the Doppler shift of charge-exchange recombination spectroscopy (CXRS) emission
    lines. Typical separatrix values for argon ions range from 0 to several tens of
    km/s in H-mode plasmas, where the toroidal rotation is largely determined by the
    main-ion rotation via collisional momentum exchange. The velocity is oriented
    parallel to the toroidal magnetic field $B_\phi$ and contributes to the radial
    electric field $E_r$ through the force balance equation $E_r = v_{\phi,\mathrm{Ar}}
    B_\theta - v_{\theta,\mathrm{Ar}} B_\phi + (1/n_{\mathrm{Ar}} e Z_{\mathrm{Ar}})
    \nabla p_{\mathrm{Ar}}$, where $B_\theta$ is the poloidal magnetic field and $p_{\mathrm{Ar}}$
    is the argon pressure. See also the same quantity at the magnetic axis [toroidal_argon_velocity_at_magnetic_axis](name:toroidal_argon_velocity_at_magnetic_axis)
    and at the pedestal top [toroidal_argon_velocity_at_pedestal](name:toroidal_argon_velocity_at_pedestal),
    as well as the toroidal velocity of tungsten impurities [toroidal_tungsten_velocity_at_separatrix](name:toroidal_tungsten_velocity_at_separatrix)
    and of the fuel species [deuterium_tritium_velocity_at_separatrix](name:deuterium_tritium_velocity_at_separatrix)
    at the same radial location.


    Sign convention: Positive when the toroidal argon velocity points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    the machine).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_pedestal
  - name:toroidal_tungsten_velocity_at_separatrix
  - name:deuterium_tritium_velocity_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/velocity_phi/argon/value
    dd_path: summary/local/separatrix/velocity_phi/argon/value
    status: composed
- name: toroidal_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Toroidal component of the current density arising from collisional
    momentum exchange between ions and neutral particles in the partially ionized
    edge plasma.
  documentation: "The toroidal current density $j_{i-n}^{\\phi}$ is the projection\
    \ of the ion-neutral friction current density vector onto the geometric toroidal\
    \ direction $\\hat{\\phi}$. This component arises from the collisional momentum\
    \ transfer between ions and neutral particles in the partially ionized edge and\
    \ scrape-off layer plasma; the friction force density is $\\mathbf{f}_{i-n} =\
    \ m_i n_i \\nu_{i-n} (\\mathbf{v}_n - \\mathbf{v}_i)$, where $m_i$ is the ion\
    \ mass, $n_i$ is the ion density, $\\nu_{i-n}$ is the ion-neutral collision frequency,\
    \ and $\\mathbf{v}_n$, $\\mathbf{v}_i$ are the neutral and ion velocities, respectively.\
    \ The resulting current density is $\\mathbf{j}_{i-n} = (n_i Z_i e / m_i \\nu_{i-n})\
    \ \\mathbf{f}_{i-n}$, with $Z_i$ the ion charge state and $e$ the elementary charge.\
    \ In the tokamak edge, this current contributes to the force balance in the toroidal\
    \ direction and couples the neutral and ion momentum equations, influencing plasma\
    \ rotation and edge transport. Typical values in the scrape-off layer range from\
    \ 1 to 100 kA/m\xB2 depending on the neutral density and the relative toroidal\
    \ velocity between ions and neutrals. See also the poloidal and radial components\
    \ [poloidal_current_density_due_to_ion_neutral_friction](name:poloidal_current_density_due_to_ion_neutral_friction)\
    \ and [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction),\
    \ as well as the parent quantity [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above)."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/j_ion_neutral_friction/toroidal
    dd_path: edge_profiles/ggd/j_ion_neutral_friction/toroidal
    status: composed
- name: toroidal_electron_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the electron fluid bulk velocity in the edge
    plasma.
  documentation: 'The toroidal electron velocity $v_{\phi,e} = \mathbf{v}_e \cdot
    \hat{\phi}$ represents the mean convective flow of the electron population in
    the direction of increasing toroidal angle $\phi$ within the IMAS cylindrical
    $(R, \phi, Z)$ frame. This quantity is a projection of the [electron_velocity](name:electron_velocity)
    vector onto the geometric toroidal axis. In the edge pedestal of H-mode tokamaks,
    the toroidal electron velocity typically ranges from 10 to 100 km/s, co-current
    with the plasma current direction, and is closely coupled to the main ion toroidal
    rotation via neoclassical friction. Measurements are obtained from charge exchange
    recombination spectroscopy (CXRS) of impurity ions, from which the electron velocity
    is inferred, or from direct Doppler spectroscopy of electron cyclotron emission
    features. The sign of $v_{\phi,e}$ follows the right-handed cylindrical convention.


    Sign convention: Positive when $\mathbf{v}_e$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).


    See also [radial_electron_velocity](name:radial_electron_velocity) and [poloidal_electron_velocity](name:poloidal_electron_velocity)
    for the other components of the electron flow.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
