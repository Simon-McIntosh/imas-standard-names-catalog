- name: resistance_of_passive_loop
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a passive conducting loop, which together
    with its self-inductance sets the L/R time constant governing eddy-current decay
    during plasma transients.
  documentation: 'The resistance of a passive conducting loop quantifies the ohmic
    opposition to current flow in an axisymmetric conductor that is inductively coupled
    to the plasma but not connected to an external power supply. Passive loops carry
    eddy currents induced by changes in plasma current or equilibrium position, and
    their resistance governs how quickly those induced currents decay.


    The resistance $R$ and self-inductance $L$ together determine the characteristic
    decay time constant:


    $$

    \tau = \frac{L}{R}

    $$


    where $\tau$ is the e-folding time for eddy-current decay, $L$ is the self-inductance,
    and $R$ is this resistance. A smaller resistance extends $\tau$, prolonging the
    stabilizing influence of the eddy currents during vertical displacement events
    or plasma disruptions.


    For a loop of uniform cross-section, $R = \rho \ell / A$, where $\rho$ is the
    material resistivity (see [resistivity_of_passive_structure](name:resistivity_of_passive_structure)),
    $\ell$ is the mean conductor path length, and $A$ is the cross-sectional area
    determined by [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)
    and [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop). Values
    range from sub-milliohm for low-resistivity conductors to tens of milliohms for
    higher-resistivity materials, depending on geometry. This quantity follows the
    established resistance-of-object pattern alongside [resistance_of_toroidal_field_coil](name:resistance_of_toroidal_field_coil)
    and [resistance_of_correction_coil](name:resistance_of_correction_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:resistivity_of_passive_structure
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:resistance_of_toroidal_field_coil
  - name:resistance_of_correction_coil
  sources:
  - id: dd:pf_passive/loop/resistance
    dd_path: pf_passive/loop/resistance
    status: composed
- name: resistance_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a poloidal field coil winding. It relates
    coil current to resistive voltage drop and Joule heating at the specified operating
    state.
  documentation: 'Resistance of a poloidal field coil is the effective series ohmic
    resistance of the coil winding at its operating state. It represents conversion
    of electrical energy into heat in the conductor, joints, and other series elements
    included in the coil definition, and it sets the resistive part of the terminal
    voltage demand.


    In a lumped circuit model for coil $k$, the terminal-voltage balance is commonly
    written after choosing branch-current and terminal-voltage reference directions:


    $$

    V_k = R_k I_k + L_k \frac{dI_k}{dt} + \sum_{j \ne k} \epsilon_{kj} M_{kj} \frac{dI_j}{dt}

    $$


    where $V_k$ is the terminal voltage in V, $R_k$ is the coil resistance in ohm,
    $I_k$ and $I_j$ are currents in A, $L_k$ is self-inductance in H, $M_{kj}$ is
    mutual inductance in H, $dI/dt$ is in A/s, $j$ labels coupled circuits or conductors,
    and $\epsilon_{kj}$ is a dimensionless factor equal to $+1$ or $-1$ for the chosen
    mutual-reference orientation. The equation assumes the passive reference for the
    resistive drop, with $V_k$ positive as a voltage drop along the chosen positive
    $I_k$ direction; reversing a current reference or terminal-voltage polarity changes
    the algebraic signs of the inductive and mutual terms consistently, but does not
    change the non-negative value of $R_k$.


    The value is computed from conductor material resistivity, winding length, cross-sectional
    area, cooling state, and the temperature distribution of the winding. It may be
    measured by four-terminal DC injection or inferred from slow current ramps after
    subtracting inductive and mutual voltage contributions. For normal-conducting
    coils the resistance increases with temperature; for superconducting coils the
    effective series resistance depends on whether joints, current-sharing regions,
    or quench behavior are included in the coil model.


    Typical effective resistances are $10^{-4}$-$10^{-1}$ ohm for large normal-conducting
    poloidal field coils and $10^{-3}$-1 ohm for smaller shaping or laboratory coils.
    Superconducting poloidal field windings in steady superconducting operation are
    often represented as 0-$10^{-6}$ ohm effective series resistance when only persistent
    or joint losses are included; during current sharing or a quench, the apparent
    resistance can rise to $10^{-4}$-1 ohm and becomes strongly time dependent.'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:resistance_of_toroidal_field_coil
  - name:resistance_of_correction_coil
  - name:resistance_of_passive_loop
  sources:
  - id: dd:pf_active/coil/resistance
    dd_path: pf_active/coil/resistance
    status: composed
- name: resistance_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a toroidal field coil conductor, determining
    resistive power dissipation and voltage drop during coil operation.
  documentation: 'The resistance of a toroidal field coil is the ohmic impedance of
    its conductor winding at a given temperature and operational state, governing
    how the coil dissipates energy and sustains a voltage drop when carrying current.


    The resistive power deposited in the coil is defined by:


    $$

    P_\mathrm{ohm} = I^2 R_\mathrm{TF}

    $$


    where $I$ is the coil current and $R_\mathrm{TF}$ is the coil resistance. The
    resistance depends on conductor geometry and material electrical resistivity $\rho_e$
    through $R_\mathrm{TF} = \rho_e L / A_c$, where $L$ is the total conductor length
    and $A_c$ is the conductor cross-sectional area.


    Coil resistance is determined by direct four-wire (Kelvin) electrical measurements
    or from conductor material properties and geometry as a function of temperature.
    For superconducting TF coils operated below the critical temperature, the effective
    resistance is negligible; for normal-conducting (resistive) TF coils, values range
    from a few milliohms to tens of milliohms depending on device scale and conductor
    material.


    The resistive voltage drop $V_R = I \cdot R_\mathrm{TF}$ contributes to the total
    terminal voltage captured by [voltage_of_toroidal_field_coil](name:voltage_of_toroidal_field_coil).
    Analogous quantities for other coil systems include [resistance_of_poloidal_field_coil](name:resistance_of_poloidal_field_coil)
    and [resistance_of_correction_coil](name:resistance_of_correction_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:voltage_of_toroidal_field_coil
  - name:resistance_of_poloidal_field_coil
  - name:resistance_of_correction_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/resistance
    dd_path: coils_non_axisymmetric/coil/conductor/resistance
    status: composed
  - id: dd:tf/coil/conductor/resistance
    dd_path: tf/coil/conductor/resistance
    status: composed
  - id: dd:tf/coil/resistance
    dd_path: tf/coil/resistance
    status: composed
- name: toroidal_angle_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of a toroidal-field-coil conductor cross-section
    contour point, expressed relative to the cross-section reference point in the
    right-handed cylindrical (R, phi, Z) frame. It is used with major radius and vertical
    height to locate the contour point.
  documentation: 'The toroidal angle of a toroidal-field-coil conductor cross section
    is the angular coordinate of a conductor-contour point measured relative to a
    designated reference point on that cross section. It is the toroidal component
    of the point location in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height.


    For contour point $i$, the relative toroidal angle is defined as the difference
    between the point and reference toroidal coordinates:


    $$

    \phi_{\mathrm{rel},i} = \phi_i - \phi_{\mathrm{ref}}

    $$


    where $\phi_i$ is the toroidal coordinate of the contour point, $\phi_{\mathrm{ref}}$
    is the toroidal coordinate of the reference point, and $\phi_{\mathrm{rel},i}$
    is expressed in radians. Because toroidal angle is periodic, values that differ
    by $2\pi n$, with integer $n$, represent the same toroidal direction; the physical
    definition does not impose a device-independent wrapping interval.


    In practice, this coordinate is computed from the engineered conductor geometry
    by evaluating the toroidal coordinate of each contour point and subtracting the
    reference-point toroidal coordinate. Together with the radial coordinate [major_radius_of_toroidal_field_coil](name:major_radius_of_toroidal_field_coil)
    and vertical height [height_of_toroidal_field_coil](name:height_of_toroidal_field_coil),
    it locates the contour point in the cylindrical $(R, \phi, Z)$ frame. The corresponding
    generic conductor quantity is [toroidal_angle_of_conductor_cross_section](name:toroidal_angle_of_conductor_cross_section).


    Typical numerical values are design-specific and depend on the chosen reference
    point and conductor cross-section geometry. The relevant universal scale is the
    angular periodicity $2\pi$ rad, so the values should be interpreted as relative
    toroidal coordinates rather than as absolute toroidal positions of the coil.


    Sign convention: Positive when the contour point is displaced from the reference
    point in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:normal_coordinate_of_toroidal_field_coil
  - name:toroidal_angle_of_conductor_cross_section
  sources:
  - id: dd:tf/coil/conductor/cross_section/delta_phi
    dd_path: tf/coil/conductor/cross_section/delta_phi
    status: attached
- name: vertical_angle_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Inclination angle beta of the second oblique side of a poloidal field
    coil parallelogram cross-section, measured counter-clockwise from the vertically
    upward direction in the poloidal plane.
  documentation: 'The vertical angle $\beta$ parameterizes the tilt of the second
    inclined side of the oblique parallelogram cross-section of a poloidal field coil
    conductor element, specified in the poloidal $R$-$Z$ plane of the right-handed
    cylindrical $(R, \phi, Z)$ frame. Together with the [radial angle $\alpha$](name:radial_angle_of_poloidal_field_coil)
    (measured counter-clockwise from the outward $\hat{R}$ direction), $\beta$ fully
    defines the oblique orientation of the non-rectangular conductor winding-pack
    geometry.


    The angle is defined by the dot-product relation:


    $$

    \hat{e}_{\beta} \cdot \hat{Z} = \cos\beta

    $$


    where $\hat{e}_{\beta}$ is the unit vector along the beta-side inclined edge and
    $\hat{Z}$ is the vertically upward unit vector; the signed direction is determined
    by measuring $\beta$ counter-clockwise from $+\hat{Z}$ in the poloidal $R$-$Z$
    plane.


    This geometric parameter is derived from engineering design data for the coil
    winding pack and is used in electromagnetic analysis to compute conductor self-
    and mutual inductances and Lorentz forces on the cross-section. The extent of
    the beta-side edge is given by [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil),
    while [major_length_of_poloidal_field_coil](name:major_length_of_poloidal_field_coil)
    gives the alpha-side edge extent.


    Sign convention: Positive when the beta-side edge direction $\hat{e}_{\beta}$
    is rotated counter-clockwise from $+\hat{Z}$ in the poloidal $R$-$Z$ plane.'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:radial_angle_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  - name:major_length_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/oblique/beta
    dd_path: pf_active/coil/element/geometry/oblique/beta
    status: attached
  - id: dd:pf_active/coil/geometry/oblique/beta
    dd_path: pf_active/coil/geometry/oblique/beta
    status: attached
- name: vertical_coordinate_of_passive_structure
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of a geometric reference point on the cross-section\
    \ of a passive conducting structure, measured in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame from the machine midplane."
  documentation: "The vertical coordinate $Z$ locates a geometric point defining the\
    \ cross-sectional shape of a passive conducting structure element in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius, $\\phi$ is\
    \ the toroidal angle increasing counter-clockwise when viewed from above $+\\\
    hat{Z}$, and $Z$ is the height above the machine midplane. Passive structures\
    \ are unpowered conducting elements \u2014 such as stabilizing loops, conducting\
    \ shells, or vacuum vessel segments \u2014 that respond to time-varying magnetic\
    \ fields through induced eddy currents, influencing plasma vertical stability\
    \ and equilibrium evolution.\n\nCross-sections of passive elements are described\
    \ by parametric shapes: polygon outlines (sequences of vertices), arcs of circles,\
    \ oblique trapezoids, or thick-line segments defined by two endpoint coordinates.\
    \ This $Z$ coordinate specifies one such geometric vertex or endpoint, and must\
    \ be paired with the corresponding major-radius coordinate to fully define a point\
    \ in the poloidal plane. Geometry is typically specified from engineering drawings\
    \ or as-built surveys of the device. Analogous coordinates for active coil elements\
    \ are given by [vertical_coordinate_of_coil_conductor](name:vertical_coordinate_of_coil_conductor)\
    \ and [vertical_coordinate_of_conductor_cross_section](name:vertical_coordinate_of_conductor_cross_section).\n\
    \nTypical values span the vertical extent of the machine, ranging from approximately\
    \ $-2$ to $+2$ m in medium-sized tokamaks and up to $\\pm 4$ m in larger devices.\n\
    \nSign convention: Positive when the point lies above the machine midplane in\
    \ the $+Z$ direction."
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
