name: toroidal_magnetic_flux
status: draft
cocos_transformation_type: b0_like
description: Total magnetic flux $\Phi$ through a toroidal cross-section enclosed
  by a given flux surface.
documentation: "The toroidal magnetic flux $\\Phi(\\psi)$ is defined as $\\Phi = \\\
  int_S \\mathbf{B} \\cdot d\\mathbf{S}$, where $S$ is the poloidal cross-sectional\
  \ area enclosed by the flux surface labeled by $\\psi$ (the poloidal magnetic flux).\
  \ It is one of the two fundamental flux labels of nested magnetic surfaces, and\
  \ the safety factor is defined as $q = d\\Phi / d\\psi$. Positive $\\Phi$ corresponds\
  \ to $\\mathbf{B}_\\phi$ in the $+\\phi$ direction under COCOS-11 conventions. In\
  \ tokamak plasmas with on-axis fields of 1\u20136 T and plasma cross-sections of\
  \ 1\u201310 m$^2$, typical $\\Phi$ ranges from a few Wb at the magnetic axis (where\
  \ it is conventionally set to zero) to tens of Wb at the separatrix. The profile\
  \ $\\Phi(\\psi)$ is computed during equilibrium reconstruction and serves as the\
  \ radial coordinate for transport codes that use the $\\rho_{\\rm tor} = \\sqrt{\\\
  Phi / \\Phi_{\\rm edge}}$ normalization. See `poloidal_magnetic_flux` for the conjugate\
  \ flux coordinate and `safety_factor` for their ratio."
