name: normalized_perturbed_parallel_magnetic_field_weight
status: draft
cocos_transformation_type: one_like
description: Fractional amplitude of the perturbed parallel magnetic field relative
  to the total perturbed field amplitude in a gyrokinetic eigenmode.
documentation: "In gyrokinetic eigenvalue analyses the total fluctuation is decomposed\
  \ into three field components: the electrostatic potential perturbation $\\delta\\\
  phi$, the parallel magnetic vector potential perturbation $\\delta A_\\parallel$,\
  \ and the parallel magnetic field perturbation $\\delta B_\\parallel$. The normalized\
  \ perturbed parallel magnetic field weight is defined as $w_{B_\\parallel} = |\\\
  delta B_\\parallel| / (|\\delta\\phi| + |\\delta A_\\parallel| + |\\delta B_\\parallel|)$,\
  \ where each amplitude is evaluated in normalized (gyro-Bohm) units. A significant\
  \ $w_{B_\\parallel}$ indicates compressional magnetic fluctuations, which become\
  \ important at high plasma $\\beta$ (e.g., in mirror or compressional Alfv\xE9n\
  \ eigenmodes). For most core tokamak micro-instabilities at moderate $\\beta$, $w_{B_\\\
  parallel} \\ll 1$; values approaching $0.1$\u2013$0.3$ may arise in spherical tokamaks\
  \ or near the $\\beta$ limit. The three field weights ($w_{\\delta\\phi}$, $w_{A_\\\
  parallel}$, $w_{B_\\parallel}$) sum to unity by construction. See `normalized_perturbed_parallel_magnetic_field_real_part`\
  \ for the eigenfunction and `normalized_perturbed_electrostatic_potential_weight`\
  \ for the electrostatic fraction."
