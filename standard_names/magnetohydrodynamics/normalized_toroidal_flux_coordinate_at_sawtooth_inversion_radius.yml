name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
status: draft
cocos_transformation_type: one_like
description: Normalized toroidal flux coordinate $\rho_{\mathrm{tor,N}}$ evaluated
  at the radial location where the sawtooth crash inverts the temperature profile.
documentation: "The sawtooth inversion radius marks the boundary between the core\
  \ region that loses energy during a sawtooth crash and the surrounding region that\
  \ gains energy. It is identified as the flux surface where the temperature perturbation\
  \ changes sign, $\\delta T_e(\\rho_{\\mathrm{inv}}) = 0$. The normalized toroidal\
  \ flux coordinate is defined as $\\rho_{\\mathrm{tor,N}} = \\sqrt{\\Phi / \\Phi_{\\\
  mathrm{LCFS}}}$, where $\\Phi$ is the toroidal magnetic flux enclosed by the flux\
  \ surface and $\\Phi_{\\mathrm{LCFS}}$ is the value at the last closed flux surface.\
  \ Typical values lie in the range 0.3\u20130.5 for standard tokamak H-mode scenarios,\
  \ roughly coinciding with the $q = 1$ surface where the internal kink mode drives\
  \ the sawtooth instability. The inversion radius is commonly determined from electron\
  \ cyclotron emission (ECE) radiometry or soft X-ray tomography by locating the sign\
  \ change in the sawtooth oscillation amplitude. See also `safety_factor` and `electron_temperature`\
  \ for the quantities that govern the sawtooth dynamics."
