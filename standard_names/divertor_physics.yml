- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local number density of hydrogen ions evaluated in the plasma adjacent
    to the divertor target surface, summed over all positive hydrogen ionization charge
    states, which reduces to the single H+ state, and excluding neutral hydrogen atoms
    and molecules.
  documentation: 'Hydrogen density at the divertor target is the local number density
    of hydrogen (protium) ions in the plasma immediately adjacent to a divertor target
    surface, evaluated at the entrance to the electrostatic sheath. It is summed over
    all positive hydrogen ionization charge states, which for protium reduces to the
    single $\mathrm{H}^+$ state; neutral hydrogen atoms and molecules are excluded.
    It is the hydrogen member of [density_at_divertor_target](name:density_at_divertor_target),
    analogous to [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)
    and related to [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    and [helium_4_density_at_divertor_target](name:helium_4_density_at_divertor_target);
    the corresponding aggregate over ionic species is [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).


    At an attached target sheath, the hydrogen ion flux to the material surface is
    commonly related to the sheath-entrance density by the Bohm-flux relation:


    $$

    \Gamma = n c_s

    $$


    where $n$ is the hydrogen density at the sheath entrance, $\Gamma$ is the hydrogen
    ion particle flux density (m$^{-2}$ s$^{-1}$), and $c_s$ is the Bohm acoustic
    speed (m s$^{-1}$) determined by local temperatures and the hydrogen ion mass.
    In high-recycling and detached conditions, ionization, recombination, charge exchange,
    and momentum losses modify the relation between upstream plasma conditions, target
    density, and the net particle flux.


    Hydrogen target density is usually inferred by combining Langmuir-probe measurements
    of ion saturation current and electron density with Balmer-line spectroscopy interpreted
    through collisional-radiative modeling. Particle-balance or edge-plasma modeling
    is often needed to separate the $\mathrm{H}^+$ component from deuterium, tritium,
    helium, and impurity ions in mixed-species divertor plasmas.


    Typical values range from $10^{18}$ to $10^{21}$ m$^{-3}$, with the lower end
    associated with attached, low-recycling targets and the upper end with high-recycling
    or detached divertor conditions. In a nearly pure hydrogen plasma, this density
    is generally comparable to [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    through quasineutrality; in mixed-species plasmas it is a diluted component of
    [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:nitrogen_density_at_divertor_target
  - name:density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: hydrogen
    operator_kind: qualifier
- name: ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: "Local number density of ionic plasma species \u2014 fuel ions, impurity\
    \ ions, or aggregate ion populations \u2014 evaluated in the plasma adjacent to\
    \ the divertor target surface, with species-level densities summed over all ionization\
    \ charge states and neutral atoms excluded."
  documentation: 'Ion density at the divertor target is the local number density of
    ionic plasma species or ion aggregates in the plasma immediately adjacent to a
    divertor target surface, evaluated at the entrance to the electrostatic sheath.
    Species-level ion densities are summed over all ionization charge states present
    at that location unless a specific charge state is separately resolved, and neutral
    atoms or molecules are excluded. The aggregate child [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    sums all ionic species, while concrete species examples include [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target)
    and [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).


    For any chosen ion set $\mathcal{I}$, the charge-state-summed target ion density
    is defined by summing the local densities of its positive ion charge states:


    $$

    n_{\mathcal{I},t} = \sum_{a \in \mathcal{I}} \sum_{q=1}^{Z_a} n_{a,q,t}

    $$


    where $a$ labels an atomic or isotope species, $q$ is the positive ion charge
    state, $Z_a$ is the nuclear charge of species $a$, and $n_{a,q,t}$ is the local
    density of charge state $q$ at the target sheath entrance. Choosing one species
    gives a species-resolved ion density; choosing all ion species gives the total
    ion density.


    Target ion densities are inferred from embedded Langmuir probes, divertor Thomson
    scattering, passive spectroscopy, and edge plasma modeling. Langmuir probes relate
    ion saturation current density to a Bohm-sheath flux using an order-unity sheath
    and collection factor; the relevant acoustic speed includes electron and ion temperature
    contributions and, for multispecies plasmas, depends on the effective ion mass
    and charge-state composition. In simple attached high-recycling two-point models,
    pressure balance gives the qualitative scaling $n_{i,t} \sim n_{i,u} T_u/T_t$,
    so the target density rises as the target temperature falls toward detachment.


    Typical aggregate or main-fuel ion densities adjacent to divertor targets span
    $10^{18}$-$10^{21}$ m$^{-3}$ from low-recycling attached conditions through high-recycling
    and detached regimes. Species-resolved impurity ion densities are often lower
    than the aggregate fuel-ion density, but can become a substantial fraction of
    it in seeded, strongly radiating, or material-eroding divertor conditions.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:effective_charge_at_divertor_target
  - name:electron_temperature_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: ion
    operator_kind: qualifier
  sources:
  - id: derived:ion_density_at_divertor_target
    status: composed
- name: ion_fluence_at_divertor_target
  kind: scalar
  status: draft
  description: Cumulative ion particle dose delivered to a divertor target surface
    over a specified time interval. It is the time integral of the incident normal
    ion particle flux density, summed over all ion species and charge states, with
    each ion counted once as a particle.
  documentation: 'Ion fluence at a divertor target is the cumulative number of ions
    crossing into a unit area of the plasma-facing target surface during a specified
    exposure interval. It is a local surface dose summed over all ion species and
    charge states unless a species-qualified quantity is specified, and each ion is
    counted once as a particle rather than weighted by charge.


    For a target-surface point $\mathbf{x}_s$ and interval $[t_0,t_1]$, the ion fluence
    $\Phi_\mathrm{ion}$ is defined by:


    $$

    \Phi_\mathrm{ion}(\mathbf{x}_s; t_0,t_1) = \int_{t_0}^{t_1} \sum_{\alpha}\sum_z
    \Gamma_{\alpha z,\perp}^{\mathrm{inc}}(\mathbf{x}_s,t)\,dt

    $$


    where $\Phi_\mathrm{ion}$ has unit m^-2, $\Gamma_{\alpha z,\perp}^{\mathrm{inc}}$
    is the incident normal particle flux density in m^-2 s^-1 for ion species $\alpha$
    and charge state $z$, and $t_0$ and $t_1$ bound the accumulation interval. The
    value is zero at $t_0$ by convention for that interval, includes only ions incident
    during the interval, and adds linearly over successive intervals.


    In practice, local target fluence is often obtained by time-integrating a measured
    or reconstructed incident ion flux density. Embedded or surface Langmuir probes
    can provide an ion saturation current density, but conversion to particle fluence
    requires assumptions or corrections for effective charge state, collection area,
    magnetic-field incidence angle, sheath transmission, secondary emission, and the
    probe interpretation model. Integrated divertor particle-transport calculations
    or particle balance estimates can also provide the incident flux density when
    direct measurements are unavailable.


    Typical local fluences in present tokamak discharges are about $10^{21}$-$10^{25}$
    m^-2 for a single plasma exposure, with the lower end in weakly wetted or detached
    regions and the upper end near sustained strike-point or high-recycling conditions.
    Multi-pulse or campaign-integrated exposure of a fixed target location can accumulate
    $10^{26}$-$10^{30}$ m^-2.


    Sign convention: Positive when ions cross the divertor target surface from the
    plasma into the material.'
  unit: m^-2
  physics_domain: divertor_physics
  links:
  - name:parallel_heat_flux_at_divertor_target
  - name:current_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Iron density at the divertor target is the local number density of
    iron ions in the plasma immediately adjacent to a divertor target surface, summed
    over all ionization states from Fe1+ through fully stripped Fe26+ and excluding
    neutral iron atoms.
  documentation: 'Iron density at the divertor target is the local number density
    of iron ions in the plasma immediately adjacent to the divertor target surface,
    evaluated upstream of the electrostatic sheath entrance. It is summed over all
    ionization states from Fe$^{1+}$ through fully stripped Fe$^{26+}$; neutral iron
    atoms are excluded. This species-resolved impurity density is a component of [density_at_divertor_target](name:density_at_divertor_target)
    and contributes to charge balance, impurity radiation, and [effective_charge_at_divertor_target](name:effective_charge_at_divertor_target).


    The charge-state-summed target density is defined by summing the local densities
    of all ionic iron charge states:


    $$

    n_{\mathrm{Fe},t} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+},t}

    $$


    where $n_{\mathrm{Fe},t}$ is the iron density at the target, $n_{\mathrm{Fe}^{z+},t}$
    is the local density of iron in charge state $z$ at the sheath entrance, and $z=1,\ldots,26$
    spans all ionic charge states of iron.


    Iron target density is usually inferred from divertor spectroscopy of Fe line
    emission combined with collisional-radiative modeling and impurity transport analysis.
    Edge and divertor simulations compute it by resolving iron charge-state populations
    along scrape-off-layer field lines and summing the ionic charge states at the
    target-adjacent plasma location. Iron reaching the divertor can originate from
    erosion of iron-containing components, transport from main-chamber sources, redeposition,
    and transient material-release events, so interpretation is strongly material-
    and discharge-dependent.


    Typical values are trace-impurity densities far below the bulk plasma density;
    representative target-adjacent values are often $10^{14}$-$10^{17}$ m$^{-3}$,
    with localized erosion events or strong impurity transport producing higher transient
    values.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:effective_charge_at_divertor_target
  - name:iron_density_at_plasma_boundary
