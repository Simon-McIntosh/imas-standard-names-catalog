  documentation: 'The optical-element width is the full clear-aperture extent of a
    rectangular optical element along the first local tangential axis $X_1$. The aperture
    plane is spanned by $X_1$ and $X_2$, while $X_3$ is its normal in the right-handed
    local frame $(X_1, X_2, X_3)$.


