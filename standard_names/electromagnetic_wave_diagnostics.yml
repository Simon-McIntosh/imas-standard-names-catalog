    status: composed
- name: major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Major radius coordinate of a point on a flux surface used to define
    a diagnostic line of sight.
  documentation: 'The major radius $R$ coordinate, in the right-handed cylindrical
    $(R, \phi, Z)$ frame, of a point lying on a specified flux surface that defines
    a diagnostic line of sight. This geometric coordinate locates the diagnostic sightline
    endpoint with respect to the tokamak symmetry axis. It is used together with the
    vertical coordinate $Z$ and toroidal angle $\phi$ to fully specify the three-dimensional
    measurement path for diagnostics such as interferometry, polarimetry, and ECE.
    Typical values range from 1.0 to 1.2 m in the plasma core of ASDEX Upgrade to
    4.0-8.0 m in ITER. See [major_radius_of_diagnostic_antenna](name:major_radius_of_diagnostic_antenna)
    and [major_radius_of_strike_point](name:major_radius_of_strike_point) for related
    geometric definitions.


    Sign convention: Positive when the point lies at a larger major radius than the
    machine symmetry axis.


    Related standard names include [major_radius_of_x_point](name:major_radius_of_x_point)
    for the separatrix X-point and [major_radius_of_sensor_attachment_point](name:major_radius_of_sensor_attachment_point)
    for sensor line-of-sight endpoints.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:major_radius_of_diagnostic_antenna
  - name:major_radius_of_strike_point
  - name:major_radius_of_x_point
  - name:major_radius_of_sensor_attachment_point
  sources:
  - id: dd:polarimeter/channel/line_of_sight/third_point/r
    dd_path: polarimeter/channel/line_of_sight/third_point/r
    status: composed
- name: major_radius_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Major radius coordinate of the center of the detection antenna aperture
    in a fluctuation reflectometer.
  documentation: 'The major radius $R_{\rm ant}$ (cylindrical $R$ coordinate) locates
    the center of the aperture of the antenna that receives the reflected millimeter-wave
    beam in a fluctuation reflectometer. This coordinate is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame of the tokamak, where $R$ is the major radius
    measured from the machine symmetry axis. Typical values range from $R_{\rm ant}
    \approx 1.5\,\text{m}$ to $3.0\,\text{m}$, depending on the radial position of
    the reflectometer chord. The antenna position is a fixed geometric property of
    the diagnostic and is used together with the toroidal angle coordinate, given
    by [toroidal_angle_of_reflectometer_antenna](name:toroidal_angle_of_reflectometer_antenna),
    to define the full spatial location of the antenna. The aperture area is quantified
    by [area_of_reflectometer_antenna](name:area_of_reflectometer_antenna).


    Sign convention: Positive when $R$ increases outward from the machine symmetry
    axis.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_angle_of_reflectometer_antenna
  - name:area_of_reflectometer_antenna
  sources:
  - id: dd:reflectometer_fluctuation/channel/antenna_detection_static/centre/r
    dd_path: reflectometer_fluctuation/channel/antenna_detection_static/centre/r
    status: composed
- name: minor_radius_of_ece_channel
  kind: scalar
  status: draft
  description: Radial location of the cold resonance layer in the tokamak midplane
    for an electron cyclotron emission (ECE) channel, defined as the major radius
    where the electron cyclotron frequency matches the channel center frequency.
  documentation: "The minor radius of an ECE channel represents the radial position\
    \ of the cold resonance layer in the poloidal plane, measured along the midplane\
    \ from the magnetic axis to the cold resonance point. It is defined in the cylindrical\
    \ (R, \u03C6, Z) frame as the distance from the magnetic axis to the intersection\
    \ of the resonance layer with the outboard midplane, projected onto the Z = 0\
    \ plane. This quantity is computed from the magnetic field strength B (typically\
    \ toroidal) and the ECE channel center frequency f via the cold resonance condition:\
    \ f = e B / (2\u03C0 m\u2091), where e is the elementary charge and m\u2091 is\
    \ the electron mass. Typical values range from a few centimeters to several tens\
    \ of centimeters, depending on the machine size and the magnetic field profile.\
    \ The minor radius is always positive and increases monotonically from the magnetic\
    \ axis (\u03C1 = 0) to the plasma boundary (\u03C1 = a)."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:polarization_angle_of_ece_channel
  sources:
  - id: dd:ece/polarizer/radius
    dd_path: ece/polarizer/radius
    status: composed
- name: normalized_perpendicular_wave_vector
  kind: scalar
  status: draft
  description: Dimensionless component of the normalized wave vector perpendicular
    to the background magnetic field along an electron cyclotron emission (ECE) beam
    path.
  documentation: "The normalized perpendicular wave vector $k_{\\perp,\\mathrm{norm}}\
    \ = (k_{\\perp})/(k_0)$ gives the component of the wave vector transverse to the\
    \ magnetic field direction $\\mathbf{B}$, scaled to the vacuum wavenumber $k_0\
    \ = \\omega/c$. Here $\\omega$ is the ECE channel center angular frequency and\
    \ $c$ the speed of light. This quantity governs the perpendicular refractive index\
    \ $N_\\perp = k_{\\perp,\\mathrm{norm}}$ and controls the beam width evolution\
    \ via diffraction in the cold-plasma dispersion relation. Typical values for ECE\
    \ channels in tokamaks range from $10^{-2}$ to $0.5$, increasing with poloidal\
    \ field shear and beam divergence. Evaluated along the ray path from beam-tracing\
    \ codes, it determines the spatial resolution of the ECE measurement perpendicular\
    \ to the flux surfaces. The sibling quantity [normalized_parallel_wave_vector](name:normalized_parallel_wave_vector)\
    \ describes the parallel component; together they satisfy $k_{\\parallel,\\mathrm{norm}}^2\
    \ + k_{\\perp,\\mathrm{norm}}^2 = N^2$ (where $N$ is the total refractive index).\
    \ \n\nSign convention: Positive when the perpendicular wave vector component points\
    \ in the direction of increasing minor radius projected onto the plane perpendicular\
    \ to $\\mathbf{B}$."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_parallel_wave_vector
  arguments:
  - name: wave_vector
    operator: component
    operator_kind: projection
    axis: normalized_perpendicular
    shape: component
  sources:
  - id: dd:ece/channel/beam_tracing/beam/power_flow_norm/perpendicular
    dd_path: ece/channel/beam_tracing/beam/power_flow_norm/perpendicular
    status: composed
- name: normalized_poloidal_flux_coordinate_of_measurement_position
  kind: scalar
  status: draft
  description: Normalized poloidal flux coordinate of the Doppler reflectometer measurement
    position, identifying the flux surface probed by the channel.
  documentation: "The normalized poloidal flux coordinate $\rho_{\\mathrm{pol,norm}}$\
    \ maps the Doppler reflectometer measurement position onto the magnetic equilibrium,\
    \ indicating which flux surface the probed cut-off layer lies on. It is defined\
    \ as $\\rho_{\\mathrm{pol,norm}} = \\sqrt{(\\psi(R,Z) - \\psi_0) / (\\psi_b -\
    \ \\psi_0)}$, where $\\psi(R,Z)$ is the poloidal magnetic flux at the measurement\
    \ location, $\\psi_0$ is the flux at the magnetic axis, and $\\psi_b$ is the flux\
    \ at the last closed flux surface. This coordinate is dimensionless and ranges\
    \ from 0 on the magnetic axis to 1 at the plasma boundary. The measurement position\
    \ is determined from the frequency-dependent cold resonance condition and ray\
    \ tracing of the Doppler reflectometer probing beam. Typical probed values span\
    \ $\\rho_{\\mathrm{pol,norm}} \\sim 0.2$\u2013$0.9$ for turbulence measurements.\n\
    \nSign convention: Positive when the measurement position lies on a flux surface\
    \ with poloidal flux increasing away from the magnetic axis.\n\nRelated quantities\
    \ include [normalized_toroidal_flux_coordinate_of_ece_channel_emission_position](name:normalized_toroidal_flux_coordinate_of_ece_channel_emission_position)\
    \ for ECE diagnostics and [poloidal_angle_of_reflectometer_antenna](name:poloidal_angle_of_reflectometer_antenna)\
    \ for the antenna orientation."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate_of_ece_channel_emission_position
  - name:poloidal_angle_of_reflectometer_antenna
  sources:
  - id: dd:reflectometer_fluctuation/channel/doppler/position/rho_pol_norm
    dd_path: reflectometer_fluctuation/channel/doppler/position/rho_pol_norm
    status: composed
  - id: dd:reflectometer_fluctuation/channel/fluctuations_level/position/rho_pol_norm
    dd_path: reflectometer_fluctuation/channel/fluctuations_level/position/rho_pol_norm
    status: composed
- name: normalized_toroidal_flux_coordinate_of_ece_channel_emission_position
  kind: scalar
  status: draft
  description: Normalized toroidal flux coordinate at the cold-resonance emission
    position of an ECE diagnostic channel, mapping the measurement location onto the
    equilibrium flux-surface grid.
  documentation: "The normalized toroidal flux coordinate $\rho_{\\mathrm{tor,norm}}\
    \ = \\sqrt{\\Phi_{\\mathrm{tor}} / \\Phi_{\\mathrm{tor,LCFS}}}$ evaluated at the\
    \ cold-resonance layer where the ECE channel center frequency matches the local\
    \ electron cyclotron frequency $\u03C9 = e B / m_e$. This coordinate locates the\
    \ emission position within the plasma on the flux-surface grid that spans $\r\
    ho = 0$ at the magnetic axis to $\rho = 1$ at the last closed flux surface (LCFS).\
    \ For optically thick second-harmonic X-mode ECE in conventional tokamaks, the\
    \ emission position shifts outward in $\rho_{\\mathrm{tor,norm}}$ as the toroidal\
    \ magnetic field increases. The radial resolution is typically $\u0394 \\rho_{\\\
    mathrm{tor,norm}} \\approx 0.01$ to 0.05. See `[normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)`\
    \ for the definition of the coordinate itself and `[normalized_poloidal_flux_coordinate_of_ece_channel_emission_position](name:normalized_poloidal_flux_coordinate_of_ece_channel_emission_position)`\
    \ for the poloidal counterpart.\n\nSign convention: Positive when the normalized\
    \ toroidal flux coordinate increases outward from the magnetic axis toward the\
    \ LCFS."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_poloidal_flux_coordinate_of_ece_channel_emission_position
  sources:
  - id: dd:ece/channel/beam_tracing/beam/position/rho_tor_norm
    dd_path: ece/channel/beam_tracing/beam/position/rho_tor_norm
    status: composed
  - id: dd:hard_x_rays/emissivity_profile_1d/peak_position
    dd_path: hard_x_rays/emissivity_profile_1d/peak_position
    status: attached
- name: normalized_toroidal_wave_vector_of_ece_channel
  kind: scalar
  status: draft
  description: Dimensionless toroidal component of the wave vector, normalized to
    its magnitude, along an electron cyclotron emission beam path.
  documentation: 'The normalized toroidal wave vector component is defined as $k_\phi
    / |\mathbf{k}|$, where $k_\phi$ is the toroidal wavenumber and $|\mathbf{k}|$
    is the magnitude of the wave vector. This quantity characterizes the fraction
    of wave propagation directed along the toroidal direction $\hat{\phi}$, providing
    information on the directional structure of the beam or ray. It is computed from
    beam tracing calculations for electron cyclotron emission (ECE) diagnostics to
    model wave propagation through the plasma. Typical values range from near zero
    for predominantly radial propagation to unity for purely toroidal propagation.


    Sign convention: Positive when $k_\phi$ points in the direction of increasing
    toroidal angle $\phi$.


    See also [toroidal_wave_vector](name:toroidal_wave_vector) for the unnormalized
    component and [normalized_perpendicular_wave_vector](name:normalized_perpendicular_wave_vector)
    for the perpendicular counterpart.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_wave_vector
  - name:normalized_perpendicular_wave_vector
  sources:
  - id: dd:ece/channel/beam_tracing/beam/wave_vector/k_phi_norm
    dd_path: ece/channel/beam_tracing/beam/wave_vector/k_phi_norm
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/wave_vector/k_phi_norm
    dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/k_phi_norm
    status: attached
- name: toroidal_angle_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of the center of the reflectometer detection
    antenna in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The toroidal angle $\phi$ of the reflectometer antenna defines the
    toroidal position of the measurement location used for profile or fluctuation
    reflectometry. In the IMAS cylindrical $(R, \phi, Z)$ system, the angle is measured
    from a reference toroidal direction, increasing counter-clockwise when viewed
    from above along $+\hat{Z}$. The antenna center is typically the geometric center
    of the aperture or waveguide opening that couples the probing millimeter-wave
    beam into or out of the plasma.


    Sign convention: Positive when the angle increases counter-clockwise when viewed
    from above along $+\hat{Z}$.


    The toroidal coordinate is a key geometric parameter for the reflectometer channel,
    alongside the [poloidal\_angle\_of\_reflectometer\_antenna](name:poloidal_angle_of_reflectometer_antenna)
    and the major radius, which together define the beam''s launch or detection point.
    Combined with the antenna beam pattern, this coordinate determines the toroidal
    localization of the reflectometer measurement and is used in ray-tracing or beam-tracing
    codes to model the probing wave propagation.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:poloidal_angle_of_reflectometer_antenna
