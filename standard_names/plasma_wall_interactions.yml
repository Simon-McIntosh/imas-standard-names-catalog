- name: tungsten_density_at_limiter
  kind: scalar
  status: active
  description: Local particle number density of tungsten ions evaluated in the boundary
    plasma immediately adjacent to the plasma-facing limiter surface, summed over
    ionization states and excluding neutral tungsten.
  documentation: "Number density of tungsten ions evaluated at the plasma-limiter\
    \ interface on the plasma side of the magnetic presheath or sheath entrance. The\
    \ limiter terminates open magnetic field lines in the scrape-off layer, so this\
    \ quantity describes the tungsten impurity population participating in limiter-adjacent\
    \ plasma\u2013surface interactions.\n\nThe charge-state sum is defined by\n\n\
    $$\nn_{\\mathrm W} = \\sum_{Z\\ge 1} n_{\\mathrm{W}^{Z+}} = \\sum_{Z\\ge 1}\\\
    int f_{\\mathrm{W}^{Z+}}(\\mathbf{v})\\,d^3v\n$$\n\nwhere $n_{\\mathrm W}$ is\
    \ the total tungsten-ion number density, $Z$ is the positive tungsten charge number,\
    \ $n_{\\mathrm{W}^{Z+}}$ is the density of charge state $Z$, and $f_{\\mathrm{W}^{Z+}}(\\\
    mathbf{v})$ is its velocity distribution function. The sum includes all tungsten\
    \ ionization states and excludes neutral tungsten.\n\nThis quantity specializes\
