- name: spectral_efficiency_of_filter
  kind: scalar
  status: active
  description: Wavelength-resolved probability that a photon incident on a diagnostic
    filter produces a registered detection event after wavelength-dependent transmission
    and detection losses.
  documentation: 'The wavelength-resolved filter efficiency is the conditional probability
    that a photon arriving at the filter input with wavelength $\lambda$ produces
    a registered detection event. It includes the wavelength-dependent transmission
    and conversion losses of the filter, optical path, detector, and readout chain,
    and is distinct from material absorptivity alone.


    $$

    \eta_{\mathrm{filter}}(\lambda)=P(\mathrm{registered\ detection}\mid\mathrm{photon\
    incident\ at\ wavelength\ }\lambda)

    $$


    Here, $\lambda$ is the photon wavelength and $P$ denotes a conditional probability.
    The parent [efficiency of filter](name:efficiency_of_filter) is the incident-spectrum-weighted
    average of this response, with weighting supplied by the [incident spectral flux](name:incident_spectral_flux)
    over the relevant wavelength range. Consequently, this quantity is dimensionless
    and bounded from 0 to 1.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:efficiency_of_filter
  arguments:
  - name: efficiency_of_filter
    operator: spectral
    operator_kind: qualifier
  sources:
  - dd_path: bremsstrahlung_visible/channel/filter/detection_efficiency
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/bremsstrahlung_visible.html#bremsstrahlung_visible-channel-filter-detection_efficiency
    dd_documentation:
      leaf: 'Probability of detection of a photon impacting the detector as a function
        of its wavelength '
      parent_path: bremsstrahlung_visible/channel/filter
      parent: Filter wavelength range and detection efficiency
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - bremsstrahlung_visible/channel/filter/wavelengths
    enhanced_context:
      description: Detection efficiency of the visible bremsstrahlung diagnostic filter
        as a function of photon wavelength. Gives the probability that an incident
        photon is registered, characterizing the spectral sensitivity of the detection
        system.
      kind: llm
- name: spectral_etendue_of_spectrometer_channel
  kind: scalar
  status: active
  description: "Response-weighted linear optical phase-space acceptance of a spectrometer\
    \ channel, retaining its aperture extent and accepted ray directions while incorporating\
    \ the channel\u2019s wavelength response."
  documentation: "Spectral etendue is the wavelength-response-weighted linear optical\
    \ phase-space acceptance of a spectrometer channel. It extends the parent [etendue\
    \ of a spectrometer channel](name:etendue_of_spectrometer_channel) by incorporating\
    \ the channel\u2019s spectral response without changing the linear-aperture basis.\n\
    \n$$\nG_{\\mathrm{spec}} = \\frac{\\int G(\\lambda)\\,R(\\lambda)\\,d\\lambda}{\\\
    int R(\\lambda')\\,d\\lambda'}\n$$\n\nwhere $G(\\lambda)$ is the channel etendue\
    \ at wavelength $\\lambda$, $R(\\lambda)$ is the spectral response, and $\\lambda'$\
    \ is a dummy wavelength variable used for normalization. This response-weighted\
    \ quantity is distinct from [effective spectral etendue of a spectrometer channel](name:effective_spectral_etendue_of_spectrometer_channel),\
    \ which represents the corresponding area-solid-angle acceptance."
  unit: m.sr
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:etendue_of_spectrometer_channel
  arguments:
  - name: etendue_of_spectrometer_channel
    operator: spectral
    operator_kind: qualifier
- name: spectral_flux_of_spectrometer_channel
  kind: scalar
  status: active
  description: Uncalibrated rate of detected photoelectrons representing spectrometer
    spectral intensity after electronic gain compensation and relative channel calibration,
    before absolute radiometric calibration.
  documentation: 'This quantity is the detected photoelectron event rate representing
    emission intensity from a spectrometer channel. It is a detector-response quantity
    rather than an absolute photon radiance.


    The rate is defined by


    $$

    I = \frac{dN_{\rm pe}}{dt}

    $$


    where $I$ is the detected photoelectron rate, $N_{\rm pe}$ is the accumulated
    number of detected photoelectrons, and $t$ is elapsed time.


    For wavelength-resolved emission, the quantity applies to a selected wavelength
    pixel. For an identified spectral line, it is integrated over the line profile.
    Electronic gain compensation and relative channel calibration are included, but
    absolute radiometric calibration is not; no background subtraction is implied
    where the underlying signal remains unprocessed.


    This rate must not be interpreted as incident photon flux or calibrated radiance.
    The distinct [photon radiance at a spectral line](name:photon_radiance_at_spectral_line)
    represents the absolutely calibrated photon emission rate per projected collecting
    area and solid angle, whereas this quantity remains detector-response dependent.'
  unit: s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:photon_radiance_at_spectral_line
  sources:
