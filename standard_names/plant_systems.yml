    unit vector component specifies the horizontal cross-machine orientation of the
    SPI shatter cone axis, which determines the angular distribution of pellet fragments
    delivered to the plasma for disruption mitigation. The full parent vector [shatter_cone_direction_unit_vector](name:shatter_cone_direction_unit_vector)
    is determined from the injector geometry and shattering target configuration;
    its Cartesian components are typically computed from engineering alignment measurements
    or geometric surveys. Values lie in the range $[-1, 1]$, with typical magnitudes
    well below unity for injectors aimed primarily along the radial or vertical directions.
    The orientation is geometrically related to the shatter cone cross-section described
