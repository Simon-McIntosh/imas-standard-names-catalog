- name: inner_radius_of_iron_core_segment
  kind: scalar
  status: active
  description: Non-negative radial distance from the toroidal symmetry axis to the
    inner boundary of an annular iron-core segment. Together with the outer radius,
    it fixes the radial extent of the hollow cross section.
  documentation: 'The inner radius of an iron-core segment is the non-negative major-radius
    distance from the toroidal symmetry axis to the inner boundary of an annular iron
    region. It is expressed in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius and $Z$ is vertical height.


    For an annular cross-section, the inner radius $R_{\rm in}$ is the radial location
    of the inner boundary, and it is smaller than the corresponding outer radius $R_{\rm
    out}$:


    $$

    0 \le R_{\rm in} < R_{\rm out}

    $$


    The quantity specifies the hollow-bore boundary and radial extent, not the position
    along the toroidal direction, vertical height, boundary thickness, or local curvature
    of an arc. Unlike the curvature radius represented by [radius of an iron-core
    segment](name:radius_of_iron_core_segment), it is a radial boundary dimension.
    Together with the [outer radius of an iron-core segment](name:outer_radius_of_iron_core_segment),
    it defines the annular radial interval.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_iron_core_segment
