- name: current_at_divertor_target
  kind: scalar
  status: draft
  description: Net conventional electric current delivered by the plasma to one divertor
    target surface, integrated over the wetted strike zone.
  documentation: 'Current at a divertor target is the net conventional electric current
    delivered to one divertor target by charged particles crossing the plasma sheath
    and striking the wetted strike zone. It is a surface-integrated signed charge
    flux, not a local current density, and represents the per-target contribution
    to the divertor and wall-current balance.


    For a local target surface normal chosen from the plasma toward the material surface,
    the sheath-edge current integrated over the wetted area can be written as:


    $$

    I_{\mathrm{div,target}} = \int_{A_{\mathrm{wet}}} \left(j_{i,n} - j_{e,n}\right)\,dA

    $$


    where $j_{i,n}$ is the ion conventional-current density normal to the target surface
    in A m$^{-2}$, $j_{e,n}$ is the magnitude of the electron collection current density
    normal to the target surface in A m$^{-2}$, $dA$ is the differential target area
    in m$^2$, and $A_{\mathrm{wet}}$ is the wetted strike-zone area in m$^2$. The
    resulting integrated current is in A; the electron term is subtracted because
    electrons moving from the plasma to the target carry conventional current opposite
    to their particle motion.


    The current may be measured with embedded Langmuir probes, segmented target current
    shunts, or Rogowski-coil arrangements around target structures, and may also be
    inferred from sheath models using local target plasma conditions such as [electron
    density at divertor target](name:electron_density_at_divertor_target) and [electron
    temperature at divertor target](name:electron_temperature_at_divertor_target).
    It is closely related to deposited divertor power because the same sheath and
    strike-zone conditions govern both charge and energy fluxes, as represented by
    [power at divertor target](name:deposited_power_at_divertor_target_due_to_halo_current)
    and [power of divertor].


    For an electrically floating target in steady conditions, the net integrated current
    is expected to be near 0 A because ion and electron current contributions balance
    through the sheath. Non-zero values occur with target biasing, transient edge
    events, current-sharing between conducting structures, or disruption halo-current
    phases; the single-target value is not the total plasma current $I_p$ but may
    be assessed relative to $|I_p|$ when evaluating global current closure. No device-independent
    numerical range is implied, because the magnitude depends strongly on target geometry,
    electrical connection, plasma regime, and transient scenario.


    Sign convention: Positive when the net conventional current flows from the plasma
    into the divertor target surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:deposited_power_at_divertor_target_due_to_halo_current
- name: current_of_divertor
  kind: scalar
  status: draft
  description: Total net electric current carried by charged particles striking the
    divertor assembly, summed over all divertor target surfaces. It is positive for
    conventional current into the material and can be negative when the electron contribution
    dominates.
  documentation: 'Current of a divertor is the net electric current delivered to the
    divertor by incident charged particles. It represents the charge transport associated
    with ions and electrons striking the plasma-facing divertor targets, summed over
    all relevant target surfaces.


    The net incident current can be expressed as a surface integral of the signed
    particle charge flux:


    $$

    I_\mathrm{div} = \int_{A_\mathrm{div}} \sum_s q_s\,\boldsymbol{\Gamma}_s \cdot
    \hat{\mathbf{n}}_\mathrm{mat}\, dA

    $$


    where $A_\mathrm{div}$ is the union of divertor target surfaces, $q_s$ is the
    signed charge of species $s$, $\boldsymbol{\Gamma}_s$ is the incident particle
    flux density of that species, and $\hat{\mathbf{n}}_\mathrm{mat}$ is the local
    unit normal directed from the plasma-facing side into the material.


    In practice this current may be inferred from embedded target current sensors,
    biased divertor circuits, Langmuir-probe measurements combined with sheath models,
    or plasma-edge simulations that integrate ion and electron fluxes over the target
    surfaces. Care is needed to distinguish the net signed current from separate ion
    and electron current components, which can be much larger before cancelation.


    Typical net summed currents are often near 0 A for electrically floating, quasi-ambipolar
    target conditions. During biased operation, strong sheath asymmetry, detachment
    transients, or disruption-related wall loading, absolute values from 1-10000 A
    can occur, with larger values possible in large devices or off-normal events.


    Sign convention: Positive when the net conventional current carried by incident
    charged particles is directed from the plasma into the divertor material.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:current_of_divertor_tile
- name: current_of_divertor_tile
  kind: scalar
  status: draft
  description: Net electric current flowing from the plasma across the electrostatic
    sheath onto the plasma-facing surface of an individual divertor tile.
  documentation: 'The current of a divertor tile is the net electric current flowing
    from the plasma across the electrostatic sheath onto the plasma-facing surface
    of a single tile. It provides tile-resolved resolution of the current distribution
    across the divertor strike zone, complementing the target-integrated quantity
    [current_at_divertor_target](name:current_at_divertor_target).


    The tile current integrates the local net sheath current density $j_s$ over the
    plasma-facing tile area $A_\mathrm{tile}$:


    $$

    I_\mathrm{tile} = \int_{A_\mathrm{tile}} j_s \, dA

    $$


    where $j_s$ depends on the local ion saturation current density, the tile-to-plasma
    sheath potential, and the local [electron temperature at the divertor target](name:electron_temperature_at_divertor_target).
    Dividing by the tile area, available from [surface_area_of_divertor_tile](name:surface_area_of_divertor_tile),
    converts this quantity to a mean incident current density.


    Tile currents are measured using isolated tile circuits or embedded Langmuir probes
    whose signals are routed through the mechanical tile support structure, enabling
    time-resolved acquisition during plasma operation including transient ELM events.


    Summing contributions from all tiles on a given target recovers [current_at_divertor_target](name:current_at_divertor_target),
    and summing over all targets gives [current_of_divertor](name:current_of_divertor).
    Tile-level current data are used to diagnose thermoelectric current loops, local
    erosion hot spots, and strike-zone asymmetries driven by 3D magnetic perturbations.


    Sign convention: Positive when net electric current flows from the plasma onto
    the tile surface.'
  unit: A
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:surface_area_of_divertor_tile
  - name:current_of_divertor
- name: density_at_divertor_target
  kind: scalar
  status: draft
  description: Local number density of a given plasma species in the plasma immediately
    adjacent to a divertor target surface; for ionic species the density is summed
    over all ionization stages, and neutral atoms are excluded.
  documentation: 'The number density of a plasma species at the divertor target quantifies
    the local particle count per unit volume in the thin plasma layer immediately
    upstream of the electrostatic sheath entrance at the plasma-material interface.
    This parent quantity abstracts over species-specific children covering electrons,
    fuel ions such as [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target),
    helium ash, low-Z wall materials such as [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target),
    and noble-gas seeding impurities. For all ionic children the density is summed
    over all positive charge states and excludes neutral atoms; [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    is treated as a separate species.


    Near-target densities are inferred by Langmuir-probe arrays for the electron species
    and by spectroscopic line-ratio analysis combined with multi-fluid edge-transport
    simulations for ion species. Quasi-neutrality provides a cross-species consistency
    constraint: the sum of species ion densities weighted by their respective charge
    numbers must equal the local electron density. The [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    aggregates all ion species contributions without charge-state weighting.


    Near-target electron densities range from roughly $10^{19}$ to $10^{21}$ m$^{-3}$,
    increasing from the low-recycling to the high-recycling and detached regimes;
    individual ion-species densities depend on fuel mix, impurity seeding fraction,
    and plasma-facing-material composition.


    Sign convention: Positive when particles of the specified species are present
    in the plasma at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:beryllium_density_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: derived:density_at_divertor_target
    status: composed
- name: beryllium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local non-negative number density of beryllium ions at the divertor
    target, summed over Be1+ through Be4+ charge states and excluding neutral beryllium
    atoms.
  documentation: 'Beryllium density at the divertor target is the local number of
    beryllium ions per unit volume in the plasma adjacent to the divertor target surface.
    It is a species-resolved, non-negative scalar density for atomic number 4 and
    excludes neutral beryllium unless a separate neutral-density quantity is specified.


    When individual charge states are not represented separately, the ion density
    is the sum over the bound-electron charge states of beryllium ions:


    $$

    n_{\mathrm{Be},\mathrm{tgt}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+},\mathrm{tgt}}

    $$


    where $n_{\mathrm{Be},\mathrm{tgt}}$ is the beryllium ion number density at the
    divertor target, $n_{\mathrm{Be}^{q+},\mathrm{tgt}}$ is the partial number density
    in m$^{-3}$ of ions in charge state Be$^{q+}$, and $q$ is the charge-state index;
    an ion in charge state $q$ carries charge $+q e$, with $e$ the elementary charge.
    The neutral state Be$^{0}$ is not included in this sum.


    In practice this quantity is inferred from beryllium line emission together with
    atomic population modeling, from impurity transport modeling constrained by edge
    and divertor measurements, or from edge-plasma simulations that evolve species-resolved
    ion densities. It is a beryllium-specific component of the local divertor-target
    ion population and should be interpreted relative to [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    when assessing impurity concentration.


    Typical absolute values are strongly dependent on wall material, erosion and recycling
    conditions, ionization balance, and divertor plasma state, so no device-independent
    numerical range is implied by the definition. Under trace-impurity conditions
    $n_{\mathrm{Be},\mathrm{tgt}}$ is much smaller than the total target ion density;
    in all cases it is constrained to be non-negative and not larger than the local
    total ion density. Related beryllium-density quantities include [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    [beryllium_density_at_limiter](name:beryllium_density_at_limiter), [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    and [line_averaged_beryllium_density](name:line_averaged_beryllium_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:boron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_pedestal
  - name:beryllium_density_at_limiter
  arguments:
  - name: density_at_divertor_target
    operator: beryllium
    operator_kind: qualifier
- name: carbon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of carbon ions in the plasma immediately adjacent to
    a divertor target surface, summed over charge states C+ through C6+. Neutral carbon
    atoms and molecules are excluded unless a neutral-inclusive quantity is explicitly
    specified.
  documentation: 'Carbon density at a divertor target is the local number density
    of carbon ions in the plasma immediately adjacent to a divertor target surface.
    It is a charge-state-summed impurity ion density, so neutral carbon atoms and
    molecules are treated as separate species and are not included.


    The charge-state-summed carbon ion density is obtained by summing over the ionization
    stages of carbon:


    $$

    n_{C,\mathrm{ion}} = \sum_{q=1}^{6} n_{C^{q+}}

    $$


    where $n_{C,\mathrm{ion}}$ is the total carbon ion density in m^-3, $n_{C^{q+}}$
    is the density of carbon ions in charge state $q$ in m^-3, and $q$ is the dimensionless
    positive ion charge state ranging from $1$ up to the nuclear charge $6$.


    This density is commonly inferred from divertor spectroscopy of carbon emission
    lines combined with local electron density and temperature estimates and a collisional-radiative
    model, or evolved per charge state in edge-plasma transport calculations and then
    summed.


    Typical values near divertor targets span a wide range depending on plasma-facing
    material composition, recycling regime, and detachment state, and are generally
    a fraction of the local total ion density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:neon_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: carbon
    operator_kind: qualifier
- name: deposited_power_at_divertor_target_due_to_halo_current
  kind: scalar
  status: draft
  description: Power deposited on a single divertor target by the halo-current component
    crossing the target surface. It is the current-driven halo contribution to target
    loading.
  documentation: 'Deposited power at a divertor target due to halo current is the
    rate at which electrical work associated with halo current crossing a single target
    surface is converted to energy in that target. Halo current denotes current in
    the edge or scrape-off-layer plasma that closes through conducting plasma-facing
    structures; this quantity isolates that current-driven contribution from conducted,
    convected, radiative, neutral, and recombination heat loads.


    For a resolved target surface, the deposited halo-current power can be written
    as the surface integral of normal halo-current density times the local plasma-to-target
    potential drop:


    $$

    P_{\mathrm{halo},t} = \int_{A_t} j_{\mathrm{halo},\perp}(\mathbf{r})\,\Delta\Phi_t(\mathbf{r})\,dA

    $$


    where $P_{\mathrm{halo},t}$ is in W, $A_t$ is the wetted area of the target surface,
    $j_{\mathrm{halo},\perp}$ is the halo-current density normal to that surface in
    A m$^{-2}$, positive for conventional current from the plasma into the target,
    $\Delta\Phi_t = \Phi_{\mathrm{plasma}} - \Phi_{\mathrm{target}}$ is the local
    plasma-to-target potential drop in V, and $dA$ is a surface area element in m$^2$.


    In practice, this quantity is obtained by combining the halo-current incident
    on the target with the relevant potential drop, or by separating the halo-current
    part from the total current-driven target power. The associated surface-integrated
    current is the halo-current contribution to [current_at_divertor_target](name:current_at_divertor_target);
    the corresponding current-driven target power is related to [power_at_divertor_target](name:deposited_power_at_divertor_target_due_to_halo_current),
    and target contributions combine in divertor power accounting such as power_of_divertor.


    Typical values are approximately 0 W when no halo current intercepts the target.
    During transients with halo current closing through plasma-facing structures,
    finite values are strongly device-, geometry-, and event-dependent and can range
    from small corrections to values comparable with the total current-driven power
    on that target.


    Sign convention: Positive when conventional halo current crosses from the plasma
    into the target across a positive plasma-to-target potential drop, so the integrated
    electrical work deposits net energy in the target material.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:current_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/power_currents
    dd_path: divertors/divertor/target/power_currents
    status: composed
  - id: dd:divertors/divertor/target/power_incident
    dd_path: divertors/divertor/target/power_incident
    status: composed
- name: deuterium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of deuterium ions in the plasma immediately adjacent
    to a divertor target. It is the species-resolved fuel-ion population at the plasma-material
    interface in deuterium-fueled operation.
  documentation: 'Deuterium density at the divertor target is the local number density
    of deuterium ions, usually singly ionized $D^+$, in the plasma next to a divertor
    target surface. It is a species-resolved ion density, distinct from the species-agnostic
    [density at divertor target](name:density_at_divertor_target) and from [total
    ion density at divertor target](name:total_ion_density_at_divertor_target), which
    sums over all ion species present.


    For a small volume element adjacent to the target, the deuterium ion density is
    defined by the local particle population per unit volume:


    $$

    n_D = \frac{dN_D}{dV}

    $$


    where $N_D$ is the number of deuterium ions in the volume element $dV$ and $n_D$
    is the corresponding number density.


    In practice, this quantity is inferred from local divertor plasma measurements
    and modeling, such as target-region probe analysis, spectroscopic interpretation
    of deuterium emission, or divertor Thomson scattering when available. The inferred
    value depends strongly on recycling, ionization balance, cross-field transport,
    sheath-edge conditions, and whether the divertor is attached, partially detached,
    or detached.


    Typical values are about $10^{18}-10^{20}$ m^-3 in attached divertor conditions
    and can reach $10^{20}-10^{21}$ m^-3 in high-recycling or detached divertor conditions,
    depending on fueling, target heat flux, and divertor geometry.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:tritium_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: deuterium
    operator_kind: qualifier
- name: deuterium_tritium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density at a divertor target of an effective single ion species
    representing a deuterium-tritium plasma mixture with mean mass 2.5 amu.
  documentation: 'Deuterium-tritium density at the divertor target is the number density
    of the effective DT ion constituent in the plasma adjacent to a divertor target
    surface. The constituent is a fictitious single species with mean ion mass 2.5
    amu, used to represent a combined deuterium-tritium ion population; it is distinct
    from neutral atomic or molecular density.


    When separate deuterium and tritium ion populations are replaced by this effective
    constituent, the target density represents the combined DT ion population and
    contributes to the [total ion density at the divertor target](name:total_ion_density_at_divertor_target)
    together with any other ion species and impurities. It is analogous to [deuterium
    density at the divertor target](name:deuterium_density_at_divertor_target), but
    for the DT pseudo-species rather than a pure deuterium ion constituent.


    Target values are computed directly in edge-plasma models or inferred from target
    diagnostics through sheath models. A common approximate relation for singly charged
    ions is the Bohm-sheath ion-saturation current density:


    $$

    j_{\mathrm{sat}} \simeq e\, n_{\mathrm{DT}}\, c_s

    $$


    where $j_{\mathrm{sat}}$ is the ion saturation current density in $\mathrm{A\,m^{-2}}$,
    $e$ is the elementary charge in C, $n_{\mathrm{DT}}$ is the effective DT ion density
    in $\mathrm{m^{-3}}$, and $c_s$ is the ion sound speed in $\mathrm{m\,s^{-1}}$.
    If $c_s$ is evaluated from electron and ion temperatures, $T_e$ and $T_i$ must
    be used consistently as temperature energies, commonly in eV with the conversion
    to joules included in the sound-speed expression.


    Typical magnitudes are highly scenario dependent because the target plasma changes
    with recycling, detachment, magnetic geometry, and strike-point conditions. As
    a broad order-of-magnitude guide for tokamak divertor modeling, effective DT target
    ion densities may span about $10^{18}-10^{21}\ \mathrm{m^{-3}}$; this range is
    contextual rather than a validity bound.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:deuterium_tritium_density_at_plasma_boundary
  - name:deuterium_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: deuterium_tritium
    operator_kind: qualifier
- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Effective charge (Zeff) of the plasma evaluated at the divertor target,
    a dimensionless composite indicator of impurity content equal to unity for a pure
    hydrogen plasma and rising above unity as high-charge impurity species accumulate.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the multi-species\
    \ ion composition at the divertor target by weighting each ion species by the\
    \ square of its charge number, normalized to the electron density. It reflects\
    \ the local impurity content arising from sputtering of plasma-facing components,\
    \ deliberate impurity seeding for power exhaust control, and recycling processes\
    \ at the divertor surface.\n\nThe quantity is defined under quasi-neutrality by:\n\
    \n$$\nZ_\\text{eff} = \\frac{\\sum_s n_s Z_s^2}{n_e}\n$$\n\nwhere $n_s$ is the\
    \ number density of ion species $s$ with charge number $Z_s$, and $n_e = \\sum_s\
    \ n_s Z_s$ is the electron number density enforced by quasi-neutrality. High-$Z$\
    \ impurities contribute disproportionately: a trace fraction of [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ or argon_density_at_divertor_target raises $Z_\\text{eff}$ far more than an\
    \ equivalent density of [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target).\n\
    \n$Z_\\text{eff}$ at the divertor is inferred from spectroscopic impurity line\
    \ emission or from the Bremsstrahlung continuum, whose volumetric emissivity scales\
    \ as $n_e^2 Z_\\text{eff}$. Impurity seeding enhances radiative power dissipation\
    \ in detachment scenarios, thereby reducing the [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\
    \ This is the effective-charge component of the charge_at_divertor_target family.\n\
    \nTypical values range from 1 for a pure hydrogen plasma to 2\u20138 in seeded\
    \ or erosion-dominated divertor conditions.\n\nSign convention: Positive when\
    \ at least one ion species with nonzero charge number is present in the plasma,\
    \ as the numerator $\\sum_s n_s Z_s^2$ and denominator $n_e$ are both positive\
    \ under quasi-neutrality, ensuring $Z_\\text{eff} \\geq 1$."
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
- name: electron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Electron number density in the plasma immediately adjacent to the divertor
    target surface. It is the downstream scrape-off-layer electron density at the
    target and is distinct from the electron density at the plasma boundary or separatrix.
  documentation: 'Electron density at the divertor target is the local number of free
    electrons per unit volume in the plasma adjacent to the plasma-facing target,
    usually interpreted as a sheath-entrance or near-target plasma density rather
    than a property inside the solid surface. It characterizes downstream scrape-off-layer
    conditions at the material boundary and should not be identified with the separatrix
    value [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    which is evaluated upstream at the plasma boundary.


    As a local number density it is defined by


    $$

    n_{e,t} = \left.\frac{dN_e}{dV}\right|_{\mathrm{target}}

    $$


    where $N_e$ is the number of free electrons in a small plasma volume $V$ adjacent
    to the target and $n_{e,t}$ is expressed in m$^{-3}$.


    In practice, $n_{e,t}$ is obtained from near-target diagnostics and edge-plasma
    modeling. Flush or embedded Langmuir probes infer it from ion-saturation current
    using sheath assumptions, effective ion mass, and local electron and ion temperatures;
    divertor Thomson scattering and spectroscopic analysis can provide independent
    constraints where available. Reduced two-point scrape-off-layer estimates may
    infer $n_{e,t}$ from upstream or separatrix conditions and target temperature
    using quasineutrality and parallel pressure or momentum balance, but the coefficient
    relating upstream and target quantities depends on ion temperature, Mach number,
    sheath boundary conditions, volumetric momentum losses, radiation, recycling,
    and detachment state. Therefore a fixed electron-only pressure-balance factor
    is not a general definition; in such formulas both $n_{e,t}$ and any upstream
    density $n_{e,u}$ are electron number densities in m$^{-3}$.


    Typical values are about $10^{18}$-$10^{20}$ m$^{-3}$ in sheath-limited or attached
    divertor conditions and $10^{20}$-$10^{21}$ m$^{-3}$ in high-recycling conditions.
    During detachment, the near-target density may rise before rollover and then decrease
    as the ionization front moves away from the target, so the range is strongly dependent
    on fueling, magnetic geometry, and power exhaust regime.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: electron
    operator_kind: qualifier
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of helium-3 ions in the plasma immediately adjacent
    to a divertor target. It is summed over the singly ionized and fully stripped
    (doubly ionized) helium-3 charge states and excludes neutral helium-3 atoms.
  documentation: 'Helium-3 density at the divertor target is the local number density
    of ionized helium with mass number 3 in the plasma next to the material target
    surface. It accounts for the helium-3 ion population per unit volume and excludes
    neutral helium-3 atoms.


    Helium-3 has atomic number 2, so its accessible positive charge states are the
    singly ionized state and the fully stripped doubly ionized state. The ion density
    is the sum over these two charge states:


    $$

    n_{{}^{3}\mathrm{He},\,\mathrm{ion}} = n_{{}^{3}\mathrm{He}^{+}} + n_{{}^{3}\mathrm{He}^{2+}}

    $$


    where $n_{{}^{3}\mathrm{He}^{+}}$ is the singly ionized helium-3 density, $n_{{}^{3}\mathrm{He}^{2+}}$
    is the fully stripped helium-3 density, and $n_{{}^{3}\mathrm{He},\,\mathrm{ion}}$
    is the total ion density, all in m^-3. The neutral density $n_{{}^{3}\mathrm{He}^{0}}$
    is not part of this quantity.


    In practice this density is inferred from diagnostics or modeling that can distinguish
    helium-3 from other ion species and separate ionized helium from neutral helium.
    Common approaches include isotope-resolved spectroscopy interpreted with atomic
    physics models, mass-sensitive particle measurements where available, and edge
    or divertor transport analysis tied to local electron density and species composition.


    The value is strongly scenario dependent: without deliberate helium-3 fueling
    it may be negligible or below diagnostic sensitivity, whereas in helium-3 fueled
    or seeded divertor plasmas it becomes a significant fraction of the local ion
    inventory.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:helium_4_density_at_divertor_target
  - name:helium_3_density_at_plasma_boundary
  - name:helium_3_density_at_pedestal
  arguments:
  - name: density_at_divertor_target
    operator: helium_3
    operator_kind: qualifier
- name: helium_4_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of helium-4 ions in the plasma immediately adjacent
    to a divertor target. It is summed over all helium-4 ionization charge states
    up to fully ionized helium and excludes neutral helium atoms.
  documentation: 'Helium-4 density at a divertor target is the local number density
    of ionized helium-4 in the plasma next to a plasma-facing divertor surface. It
    represents the charge-state-summed helium-4 ion population at that location, excluding
    neutral helium atoms, and is relevant to helium ash accumulation and exhaust.


    The charge-state-summed density is defined as the sum over ionized charge states:


    $$

    n_{\mathrm{He4,target}} = \sum_{q=1}^{2} n_{{}^{4}\mathrm{He}^{q+},\mathrm{target}}

    $$


    where $n_{\mathrm{He4,target}}$ is the helium-4 ion density in m^-3, $q$ is the
    ion charge state, $q=1$ is singly ionized helium-4, $q=2$ is fully ionized helium-4,
    and each charge-state density $n_{{}^{4}\mathrm{He}^{q+},\mathrm{target}}$ is
    in m^-3. The neutral state $q=0$ is not included.


    In practice this quantity is inferred from measurements and analysis sensitive
    to helium ion populations near the divertor target, together with local plasma
    conditions and atomic-physics interpretation. It is commonly compared with upstream
    or global helium-4 measures such as [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)
    and [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    and with the total ion population [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).


    Typical order-of-magnitude values can span $10^{16}$-$10^{20}$ m^-3, from trace
    helium concentrations to helium-rich divertor conditions. The value depends strongly
    on helium source rate, ionization balance, recycling, pumping, parallel transport,
    and divertor plasma density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:helium_3_density_at_divertor_target
  - name:helium_4_density_at_plasma_boundary
  - name:density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: helium_4
    operator_kind: qualifier
- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of hydrogen ions evaluated locally in the plasma adjacent
    to the divertor target surface.
  documentation: 'Hydrogen density at the divertor target is the local number density
    of hydrogen ions in the plasma immediately adjacent to the target surface. It
    represents the hydrogen contribution to the ion population that enters the divertor
    sheath and participates in recycling, ionization balance, and target particle
    loading.


    For an attached sheath-limited target, the hydrogen ion particle flux to the surface
    is often related to the local density by the Bohm sheath estimate:


    $$

    \Gamma_H \simeq n_H c_s

    $$


    where $n_H$ is the hydrogen ion density in m$^{-3}$, $\Gamma_H$ is the hydrogen
    ion particle flux density in m$^{-2}$ s$^{-1}$, and $c_s$ is the ion sound speed
    at the sheath entrance in m s$^{-1}$. In collisional or detached conditions, the
    same density may require a more detailed treatment of ionization, recombination,
    charge exchange, and flow between the plasma and the material surface.


    This quantity is usually inferred rather than measured directly. Langmuir probes
    can constrain local electron density and ion saturation current, spectroscopy
    can constrain hydrogen emission and ionization sources through collisional-radiative
    analysis, and edge plasma modeling combines these observations with particle-balance
    assumptions to separate the hydrogen ion contribution from other ion species.


    A universal numerical range is not intrinsic to the quantity because divertor
    target density varies strongly with machine size, fueling, detachment state, impurity
    seeding, and isotope mix. In hydrogen-dominated, singly ionized target plasma,
    $n_H$ is typically of the same order as the local [electron density](name:electron_density_at_divertor_target);
    in mixed-species plasmas it is the hydrogen component of the local [ion density]
    and is reduced by deuterium, tritium, helium, or impurity dilution.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: hydrogen
    operator_kind: qualifier
- name: ion_fluence_at_divertor_target
  kind: scalar
  status: draft
  description: Cumulative ion particle dose delivered to a divertor target surface
    over a specified time interval. It is the time integral of the incident normal
    ion particle flux density, summed over all ion species and charge states, with
    each ion counted once as a particle.
  documentation: 'Ion fluence at a divertor target is the cumulative number of ions
    crossing into a unit area of the plasma-facing target surface during a specified
    exposure interval. It is a local surface dose summed over all ion species and
    charge states unless a species-qualified quantity is specified, and each ion is
    counted once as a particle rather than weighted by charge.


    For a target-surface point $\mathbf{x}_s$ and interval $[t_0,t_1]$, the ion fluence
    $\Phi_\mathrm{ion}$ is defined by:


    $$

    \Phi_\mathrm{ion}(\mathbf{x}_s; t_0,t_1) = \int_{t_0}^{t_1} \sum_{\alpha}\sum_z
    \Gamma_{\alpha z,\perp}^{\mathrm{inc}}(\mathbf{x}_s,t)\,dt

    $$


    where $\Phi_\mathrm{ion}$ has unit m^-2, $\Gamma_{\alpha z,\perp}^{\mathrm{inc}}$
    is the incident normal particle flux density in m^-2 s^-1 for ion species $\alpha$
    and charge state $z$, and $t_0$ and $t_1$ bound the accumulation interval. The
    value is zero at $t_0$ by convention for that interval, includes only ions incident
    during the interval, and adds linearly over successive intervals.


    In practice, local target fluence is often obtained by time-integrating a measured
    or reconstructed incident ion flux density. Embedded or surface Langmuir probes
    can provide an ion saturation current density, but conversion to particle fluence
    requires assumptions or corrections for effective charge state, collection area,
    magnetic-field incidence angle, sheath transmission, secondary emission, and the
    probe interpretation model. Integrated divertor particle-transport calculations
    or particle balance estimates can also provide the incident flux density when
    direct measurements are unavailable.


    Typical local fluences in present tokamak discharges are about $10^{21}$-$10^{25}$
    m^-2 for a single plasma exposure, with the lower end in weakly wetted or detached
    regions and the upper end near sustained strike-point or high-recycling conditions.
    Multi-pulse or campaign-integrated exposure of a fixed target location can accumulate
    $10^{26}$-$10^{30}$ m^-2.


    Sign convention: Positive when ions cross the divertor target surface from the
    plasma into the material.'
  unit: m^-2
  physics_domain: divertor_physics
  links:
  - name:parallel_heat_flux_at_divertor_target
  - name:current_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of iron ions at the divertor target, summed over all
    ionization stages, providing a local measure of this high-Z metallic impurity
    from erosion of iron-containing plasma-facing and structural materials.
  documentation: 'Iron is a high-Z metallic impurity in fusion plasmas, originating
    from sputtering and erosion of iron-containing structural components and plasma-facing
    materials. The iron number density at the divertor target represents the total
    number of iron ions per unit volume at the divertor target location, aggregated
    over all ionization states $z = 1, \ldots, 26$.


    The combined iron density is defined as:


    $$

    n_\text{Fe} = \sum_{z=1}^{26} n_{\text{Fe}^{z+}}

    $$


    where $n_{\text{Fe}^{z+}}$ is the local density of iron ions in charge state $z$,
    in m$^{-3}$.


    This quantity is a species-resolved component of the broader [density_at_divertor_target](name:density_at_divertor_target),
    characterizing how much high-Z impurity load reaches the divertor target from
    the scrape-off layer. Elevated iron concentrations at the divertor target indicate
    strong erosion or enhanced impurity transport toward the target, and can substantially
    increase radiated power through iron line emission. The density is inferred from
    spectroscopic analysis of iron emission lines in the divertor region, combined
    with collisional-radiative modeling to convert observed line intensities to absolute
    number densities.


    Comparison with [volume_averaged_iron_density](name:volume_averaged_iron_density)
    reveals the degree of impurity accumulation near the target relative to the bulk
    plasma, while [iron_density_at_pedestal](name:iron_density_at_pedestal) gives
    the corresponding local density at the pedestal. Analogous divertor-target densities
    for other impurity species include [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    argon_density_at_divertor_target, and boron_density_at_divertor_target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:volume_averaged_iron_density
  - name:iron_density_at_pedestal
  - name:krypton_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: iron
    operator_kind: qualifier
- name: krypton_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of krypton ions in the near-target divertor plasma,
    summed over all krypton charge states unless a specific charge state is identified
    separately.
  documentation: 'Krypton density at the divertor target is the local number density
    of krypton ions in the plasma adjacent to a divertor target. It includes all ionized
    krypton charge states and excludes neutral krypton atoms unless a neutral density
    is defined separately. As a number density, it is non-negative.


    The charge-state-summed krypton ion density is defined by


    $$

    n_{\mathrm{Kr},t} = \sum_{q=1}^{36} n_{\mathrm{Kr}^{q+},t}

    $$


    where $q$ is the krypton charge state, 36 is the atomic number of krypton, and
    each partial density $n_{\mathrm{Kr}^{q+},t}$ is in m^-3. The quantity satisfies
    $0 \le n_{\mathrm{Kr},t}$ and, at a fixed near-target location, is bounded by
    the part of the [total ion density at the divertor target](name:total_ion_density_at_divertor_target)
    not contributed by non-krypton ion species.


    In experiments, this density is inferred mainly from krypton line emission observed
    near the divertor target, interpreted with collisional-radiative atomic physics
    using local electron temperature and density. In modeling, it is obtained by summing
    the charge-state-resolved krypton ion populations from edge, scrape-off-layer,
    or divertor plasma calculations.


    Typical values are 0 m^-3 when krypton is absent or not injected. In seeded divertor
    scenarios, krypton is usually a trace or minor impurity, so its density is best
    interpreted as a species fraction of the local [total ion density at the divertor
    target](name:total_ion_density_at_divertor_target); unusually large fractions
    indicate impurity accumulation, strong local radiation, or detachment-relevant
    impurity enrichment. This is the krypton-specific counterpart of the parent [density
    at divertor target](name:density_at_divertor_target) and is closely related to
    other seeded noble-gas impurity densities such as [argon density at divertor target]
    and [xenon density at divertor target](name:xenon_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:total_ion_density_at_divertor_target
  - name:density_at_divertor_target
  - name:xenon_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: krypton
    operator_kind: qualifier
- name: neon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of ionized neon immediately adjacent to the divertor
    target, summed over all neon charge states Ne1+ through Ne10+ and excluding neutral
    neon atoms.
  documentation: 'Neon density at the divertor target is the local number density
    of ionized neon in the plasma directly next to the material target surface. It
    represents the total population of neon ions over all bound-electron configurations,
    excluding neutral neon, and is used to quantify impurity content, radiative cooling,
    and dilution in the divertor plasma.


    The total ionized neon density is the sum over neon charge-state densities:


    $$

    n_{\mathrm{Ne}} = \sum_{q=1}^{10} n_{\mathrm{Ne}^{q+}}

    $$


    where $n_{\mathrm{Ne}^{q+}}$ is the number density of neon ions with charge $q$
    and the upper limit corresponds to fully stripped neon.


    In practice this quantity is inferred from impurity emission measurements combined
    with atomic-physics modeling, or obtained from edge and divertor plasma simulations
    that evolve impurity ionization, recombination, radiation, and transport. The
    ratio to [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    gives the local neon ionic fraction; interpretation is also coupled to local [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    and [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target).


    Typical values range from about $10^{15}$-$10^{20}$ m$^{-3}$, depending strongly
    on neon seeding level, divertor detachment state, plasma density, and impurity
    transport. In trace-seeded attached conditions the value may be far below the
    main-ion density, while in strongly radiating or detached divertor plasmas it
    can approach percent-level fractions of the local ion density.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
