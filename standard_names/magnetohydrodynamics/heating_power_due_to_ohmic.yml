name: heating_power_due_to_ohmic
status: draft
description: Volume-integrated power deposited in the plasma through resistive (ohmic)
  dissipation of the current.
documentation: Ohmic heating power is given by $P_{\Omega} = \int \eta\, j^2 \,dV$,
  where $\eta$ is the Spitzer (or neoclassical) resistivity in $\Omega\cdot$m, $j$
  is the current density in A/m$^2$, and the integral spans the plasma volume. It
  is the dominant heating mechanism in ohmically heated discharges and remains significant
  during auxiliary-heated scenarios at low temperature. In standard tokamak operation
  $P_{\Omega}$ ranges from tens of kilowatts (hot, low-resistivity core) to several
  megawatts during current ramp-up or disruption current quenches when resistivity
  rises sharply. The quantity can be inferred from the loop voltage and plasma current
  ($P_{\Omega} \approx V_{\mathrm{loop}} I_p$ minus inductive contributions) or computed
  self-consistently by equilibrium and transport codes. See also `time_integrated_heating_power_due_to_ohmic_dissipation`
  for the cumulative energy and `flux_surface_averaged_toroidal_current_density` for
  the current density profile.
