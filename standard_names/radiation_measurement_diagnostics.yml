- name: first_local_tangential_coordinate_of_optical_element
  kind: scalar
  status: active
  description: "Signed position of an optical-element outline vertex along the first\
    \ local tangential coordinate of the optical-element object-local frame. The positive\
    \ first tangent is the more-horizontal in-surface direction selected toward increasing\
    \ toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame,\
    \ where R is major radius and Z is vertical height."
  documentation: 'Signed position of an optical-element outline vertex along the first
    local tangential coordinate of the optical-element object-local frame is the scalar
    coordinate obtained by projecting the vertex displacement from the local origin
    onto the first tangent. The object-local frame is the right-handed triad $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$
    with $\hat{\mathbf{e}}_3$ the plasma-facing surface normal; $\hat{\mathbf{e}}_1$
    is the more-horizontal surface tangent directed toward increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $Z$ is vertical height, and $\phi$ increases counter-clockwise when viewed
    from above $+\hat{Z}$.


    The coordinate is defined by the projection


    $$

    q_1 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_1

    $$


    where $q_1$ is the first local tangential coordinate of the optical element, $\mathbf{r}_v$
    is the position vector of the outline vertex, $\mathbf{r}_0$ is the optical-element
    local origin, and $\hat{\mathbf{e}}_1$ is the first local tangential unit vector.


    It applies only to the in-surface outline of the optical element and excludes
    displacement along the plasma-facing normal. The companion [second local tangential
    coordinate](name:second_local_tangential_coordinate_of_optical_element) gives
    the coordinate along $\hat{\mathbf{e}}_2$, the other surface tangent that completes
    the right-handed local triad.


    Sign convention: Positive when the vertex displacement from the optical-element
    local origin has a component along $+\hat{\mathbf{e}}_1$, the more-horizontal
    surface tangent directed toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: m
