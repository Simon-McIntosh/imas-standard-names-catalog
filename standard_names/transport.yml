- name: thermal_neutral_density
  kind: scalar
  status: draft
  description: Number density of neutral atoms in thermal equilibrium with the background
    plasma, summed over all internal states.
  documentation: 'The thermal neutral density $n_\mathrm{n,th}$ describes neutral
    atoms whose kinetic energy distribution is Maxwellian at the local background
    temperature, in contrast to the fast (suprathermal) neutral population arising
    from charge-exchange or neutral-beam injection. This quantity sums over all atomic
    quantum states (ground and excited) and charge states, providing the total thermal
    neutral density per unit volume. The density is typically inferred from collisional-radiative
    models constrained by spectroscopic measurements of Balmer-alpha or Lyman-alpha
    emission; in the plasma core, $n_\mathrm{n,th}$ ranges from $10^{14}$ to $10^{17}\,\mathrm{m^{-3}}$
    for typical divertor tokamaks, while in the scrape-off layer it can approach $10^{19}\,\mathrm{m^{-3}}$.
    The thermal neutral population dominates the edge neutral pressure and influences
    fueling, radiation losses, and pedestal structure. See also [neutral_state_density](name:neutral_state_density)
    for the per-state density, [thermal_density](name:thermal_density) for a per-state
    thermal component, and [neutral_pressure](name:neutral_pressure) for the associated
    neutral pressure.


    Sign convention: Positive when $n_\mathrm{n,th}$ is finite; the quantity is positive
    semi-definite by definition.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:neutral_state_density
  - name:thermal_density
  - name:neutral_pressure
  sources:
  - id: dd:edge_profiles/profiles_1d/neutral/density_thermal
