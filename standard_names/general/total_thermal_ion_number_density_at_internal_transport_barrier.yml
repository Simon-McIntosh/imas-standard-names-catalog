name: total_thermal_ion_number_density_at_internal_transport_barrier
status: draft
cocos_transformation_type: one_like
description: Total number density of all thermal ion species evaluated at the internal
  transport barrier, representing the sum over main and impurity ions.
documentation: The total thermal ion number density $n_i^{\rm tot} = \sum_s n_s$ at
  the internal transport barrier (ITB) sums the densities of all thermalized ion species
  $s$ (main fuel ions such as D and T, plus impurities like He, C, W). This quantity
  is central to the local pressure balance $p_i = n_i^{\rm tot} k_B T_i$ (where $T_i$
  is the ion temperature and $k_B$ the Boltzmann constant) and to quasi-neutrality
  $n_e = \sum_s Z_s n_s$, where $Z_s$ is the charge number of species $s$. At the
  ITB, steep density gradients can develop, with typical total thermal ion densities
  of order $3 \times 10^{19}$ to $1 \times 10^{20}\;\mathrm{m^{-3}}$ in conventional
  tokamaks. The quantity is derived from charge-exchange recombination spectroscopy
  for individual species or from the electron density profile combined with $Z_{\rm
  eff}$ measurements. See also `electron_number_density`, `carbon_number_density_at_internal_transport_barrier`,
  and `effective_charge_at_magnetic_axis`.
