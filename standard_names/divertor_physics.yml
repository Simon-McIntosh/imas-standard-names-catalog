- name: xenon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the xenon species at the divertor target is the local
    particle count per volume for xenon ions at the sheath entrance immediately upstream
    of the target-facing plasma boundary.
  documentation: 'Number density of the xenon species at the divertor target is the
    local particle count per volume for xenon ions at the sheath entrance immediately
    upstream of the target-facing plasma boundary. It is the xenon-specific member
    of [density_at_divertor_target](name:density_at_divertor_target).


    The local xenon ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{Xe}} = \frac{dN_{\mathrm{Xe}}}{dV}

    $$


    where $n_{\mathrm{Xe}}$ is the xenon ion number density, $N_{\mathrm{Xe}}$ is
    the number of included xenon ions, and $V$ is a local plasma volume whose center
    approaches the sheath entrance from the plasma side.


    This quantity applies to the xenon-ion population immediately adjacent to one
    divertor target and is summed over all positive xenon ionization states, from
    singly ionized through fully stripped xenon. Neutral xenon atoms are excluded;
    this is a local sheath-entrance density, not a volume-averaged density or a density
    at a general plasma location.


    Compared with [xenon_density](name:xenon_density), which denotes xenon ion density
    at a general plasma point, this quantity is specialized to the divertor-target
    sheath entrance. Its charge-state-summed species convention parallels [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    with xenon replacing oxygen.'
