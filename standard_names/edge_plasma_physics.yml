- name: diamagnetic_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: active
  description: Diamagnetic component of the electric current density driven by frictional
    momentum exchange between plasma ions and neutral particles in a partially ionized
    plasma, projected along the local unit vector parallel to the magnetic field crossed
    with the ion-pressure gradient. Positive values correspond to current in that
    direction.
  documentation: 'Diamagnetic current density due to ion-neutral friction is the component
    of the ion-neutral-friction current density in the local ion-diamagnetic direction.
    The local ion-diamagnetic unit vector is directed parallel to $\mathbf{B}\times\nabla
    p_i$, where $\mathbf{B}$ is the magnetic field and $p_i$ is the ion pressure.


    The scalar projection is defined by


    $$

    j_{\mathrm{dia,in}} = \mathbf{j}_{\mathrm{in}}\cdot\hat{\mathbf{d}}_{\mathrm{dia}},
    \qquad \hat{\mathbf{d}}_{\mathrm{dia}} = \frac{\mathbf{B}\times\nabla p_i}{|\mathbf{B}\times\nabla
    p_i|}

    $$


    where $j_{\mathrm{dia,in}}$ is this scalar component, $\mathbf{j}_{\mathrm{in}}$
    is the [ion-neutral-friction current density](name:current_density_due_to_ion_neutral_friction),
    and $\hat{\mathbf{d}}_{\mathrm{dia}}$ is defined where $\mathbf{B}\times\nabla
    p_i$ is nonzero.


    This quantity is a directional projection of the current driven by ion-neutral
    friction, not the full pressure-gradient diamagnetic current density. It complements
    the [parallel](name:parallel_current_density_due_to_ion_neutral_friction), [radial](name:radial_current_density_due_to_ion_neutral_friction)
    in the right-handed cylindrical $(R, \phi, Z)$ frame, [poloidal](name:poloidal_current_density_due_to_ion_neutral_friction)
    in flux coordinates $(\rho, \theta, \phi)$, [toroidal](name:toroidal_current_density_due_to_ion_neutral_friction)
    in the right-handed cylindrical $(R, \phi, Z)$ frame, and [vertical](name:vertical_current_density_due_to_ion_neutral_friction)
    in the right-handed cylindrical $(R, \phi, Z)$ frame projections of the same parent
    vector.


    Sign convention: Positive when the ion-neutral-friction current density has a
    positive projection along $\hat{\mathbf{d}}_{\mathrm{dia}}$, directed parallel
    to $\mathbf{B}\times\nabla p_i$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
