  documentation: 'Number density of the nitrogen species at the divertor target is
    the local particle count per volume for nitrogen ions at the sheath entrance immediately
    upstream of the target-facing plasma boundary. It is the nitrogen-specific member
    of [density_at_divertor_target](name:density_at_divertor_target).


    The local nitrogen-ion number density is defined by the differential particle
    count:


    $$

    n_N = \frac{dN_N}{dV}

    $$


    where $N_N$ is the number of nitrogen ions in a small plasma volume $V$ whose
    center approaches the sheath entrance from the plasma side at the divertor target.


    This quantity applies to the nitrogen-ion population immediately adjacent to the
    divertor target and is summed over all positive nitrogen ionization states. The
    aggregation counts each nitrogen ion once, regardless of its charge state.


    Neutral nitrogen atoms are excluded, as are nitrogen-bearing particles that are
    not represented as nitrogen ions. This quantity is distinct from [electron_density_at_divertor_target](name:electron_density_at_divertor_target),
    which counts free electrons, and from [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    which applies the same target-local density definition to neon ions.


    As a species-specific component, this quantity is one member of [density_at_divertor_target](name:density_at_divertor_target);
    the parent represents the same target-local number-density concept for a specified
    species or species group.'
