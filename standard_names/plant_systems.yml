      kind: template
- name: argon_count
  kind: scalar
  status: active
  description: Count of argon atoms expressed as an equivalent-electron inventory,
    where each argon atom contributes 18 equivalent electrons equal to its atomic
    number.
  documentation: 'The argon count quantifies the number of argon atoms in terms of
    a dimensionless equivalent-electron inventory. Each argon atom is assigned a contribution
    equal to its atomic number $Z_\mathrm{Ar} = 18$, giving:


    $$

    N_\mathrm{eq} = Z_\mathrm{Ar} \cdot N_\mathrm{Ar}

    $$


    where $N_\mathrm{Ar}$ is the number of argon atoms and $N_\mathrm{eq}$ is the
    dimensionless equivalent-electron count. This normalization places argon on a
    common electron-equivalent basis with other injected species, enabling direct
    comparison across impurity inventories.


    The [accumulated_argon_count](name:accumulated_argon_count) is a specific instance
    representing the cumulative argon delivered by gas injection since plasma breakdown.
    For the local particle density of argon ions in the plasma, see [argon_density](name:argon_density).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:argon_density
- name: accumulated_argon_count
  kind: scalar
  status: active
  description: Accumulated argon count is the cumulative equivalent-electron inventory
    of argon atoms delivered by gas injection after plasma breakdown. Each argon atom
    contributes 18 equivalent electrons, equal to its atomic number; this is delivered
    inventory, not plasma electron content or ionization state.
  documentation: 'Accumulated argon count is the cumulative equivalent-electron inventory
    of argon atoms delivered by gas injection after plasma breakdown. Each delivered
    argon atom contributes $Z_{\mathrm{Ar}}=18$ equivalent electrons, equal to the
    atomic number of argon.


    The accumulated count is defined by integrating the delivered argon atom injection
    rate from the plasma-breakdown time:


    $$

    N_{\mathrm{Ar,eq}}(t) = Z_{\mathrm{Ar}} \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Ar}}(t'')\,dt'',
    \qquad Z_{\mathrm{Ar}} = 18

    $$


    where $N_{\mathrm{Ar,eq}}$ is the dimensionless equivalent-electron argon count,
    $Z_{\mathrm{Ar}}$ is the dimensionless atomic number of argon, $\dot{N}_{\mathrm{Ar}}$
    is the argon atom injection rate in atoms per second, $t$ is time in seconds,
    and $t_{\mathrm{bd}}$ is the plasma-breakdown time in seconds.


    This quantity includes only argon delivered after breakdown. Argon introduced
    before breakdown belongs to the pre-breakdown inventory represented by [argon_count](name:argon_count);
    the accumulated value is not a measure of free electrons, plasma argon content,
    retained argon, or argon ionization state, and is not reduced by subsequent pumping,
    exhaust, wall retention, ionization, radiation, or redistribution.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_count
  - name:argon_source_rate_due_to_gas_injection
  - name:argon_prefill_count
  arguments:
  - name: argon_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/argon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-argon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_accumulated/argon
      parent: Argon
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Argon.
      kind: template
- name: beryllium_source_rate
  kind: scalar
  status: active
  description: "Electron-equivalent beryllium particle-source rate, obtained by weighting\
    \ the net beryllium-nucleus rate by beryllium\u2019s atomic number of four."
  documentation: "This quantity is the electron-equivalent particle-source rate associated\
    \ with beryllium. It counts each beryllium nucleus as four electron-equivalent\
    \ particles rather than as one nucleus.\n\nThe defining conversion is:\n\n$$\n\
    S_{\\mathrm{Be}}^{(e)} = Z_{\\mathrm{Be}} S_{\\mathrm{Be}} = 4S_{\\mathrm{Be}}\n\
    $$\n\nwhere $S_{\\mathrm{Be}}^{(e)}$ is the electron-equivalent beryllium source\
    \ rate, $S_{\\mathrm{Be}}$ is the net beryllium-nucleus source rate, and $Z_{\\\
    mathrm{Be}}=4$ is beryllium\u2019s atomic number.\n\nThe weighting is a nuclear-charge\
    \ bookkeeping convention, not a statement that four free electrons are created\
    \ or removed. The quantity is distinct from the actual [electron source rate](name:electron_source_rate)\
    \ and from the [beryllium density](name:beryllium_density); a positive rate denotes\
    \ net beryllium supply, while a negative rate denotes net removal."
