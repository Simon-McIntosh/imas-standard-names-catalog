- name: upper_wavelength_of_filter
  kind: scalar
  status: active
  description: Upper wavelength of a filter is the vacuum-wavelength coordinate marking
    the long-wavelength, low-frequency edge of its transmitted spectral band.
  documentation: 'Upper wavelength of a filter is the spectral coordinate, expressed
    as vacuum wavelength, that identifies the long-wavelength boundary of a filter''s
    transmitted spectral band. It is a property of the filter transmission response,
    rather than the rest-frame wavelength of a spectral line or the wavelength inside
    a material medium.


    For the upper boundary associated with the lower temporal frequency, the vacuum
    wavelength is defined by:


    $$

    \lambda_{\mathrm{upper}} = \frac{c}{\nu_{\mathrm{low}}}

    $$


    where $\lambda_{\mathrm{upper}}$ is the upper boundary vacuum wavelength, $c$
    is the speed of light in vacuum, and $\nu_{\mathrm{low}}$ is the lower temporal
    frequency corresponding to that boundary.


    This quantity applies specifically to the long-wavelength boundary of the transmitted
    passband and is not a band-average or a full transmission function. It complements
    the [lower wavelength of a filter](name:lower_wavelength_of_filter), which marks
    the short-wavelength boundary; together, the two boundaries determine the [width
    of a filter](name:width_of_filter). The parent [wavelength of a filter](name:wavelength_of_filter)
    also includes nominal characteristic wavelengths such as a reference wavelength.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_wavelength_of_filter
  - name:wavelength_of_filter
  arguments:
  - name: wavelength_of_filter
    operator: upper
    operator_kind: qualifier
  sources:
