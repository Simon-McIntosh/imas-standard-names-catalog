- name: major_radius_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Cylindrical major radius coordinate of the lower hybrid antenna reference
    point in the tokamak frame.
  documentation: "The major radius $R_{\\rm LH}$ defines the radial position of the\
    \ lower hybrid antenna's reference point in the IMAS right-handed $(R, \\phi,\
    \ Z)$ cylindrical frame. This coordinate is used to locate the antenna relative\
    \ to the plasma boundary and to align the launched wave spectrum with the intended\
    \ resonance layer. The reference point is typically the geometric center or mounting\
    \ flange of the antenna structure, with typical values ranging from $R = 2.0\\\
    text{\u2013}3.0\\,\\text{m}$ for medium-size tokamaks (e.g., JET, DIII-D) and\
    \ up to $R \\approx 6.2\\,\\text{m}$ for ITER. The quantity is specified during\
    \ antenna design and used in ray-tracing or full-wave codes to compute the launched\
    \ wave spectrum; see also [major_radius_of_neutral_beam_injector](name:major_radius_of_neutral_beam_injector)\
    \ and [radius_of_electron_cyclotron_launcher_mirror](name:radius_of_electron_cyclotron_launcher_mirror)\
    \ for analogous antenna-position quantities.\n\nSign convention: Positive when\
    \ $R$ increases outward from the machine symmetry axis.\n\nIn [absorbed_power_due_to_lower_hybrid_current_drive](name:absorbed_power_due_to_lower_hybrid_current_drive)\
    \ simulations the antenna major radius sets the radial launch position and thus\
    \ the poloidal location of the wave cutoff and resonance layers."
  unit: m
  physics_domain: auxiliary_heating
