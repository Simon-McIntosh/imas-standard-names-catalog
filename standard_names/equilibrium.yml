- name: poloidal_cross_sectional_area_of_plasma_boundary
  kind: scalar
  status: active
  description: Geometric area enclosed by the last closed magnetic-flux-surface contour
    in a fixed-toroidal-angle poloidal cross-section.
  documentation: 'This quantity is the area enclosed by the last closed magnetic-flux-surface
    contour in a poloidal cross-section at fixed toroidal angle. It characterizes
    the plasma cross-sectional size in the right-handed cylindrical $(R,\phi,Z)$ coordinate
    frame with basis $(\hat{R},\hat{\phi},\hat{Z})$.


    The enclosed area is defined by


    $$

    A = \iint_{\Omega_{\rm LCFS}} dR\,dZ

    $$


    where $A$ is the cross-sectional area, $\Omega_{\rm LCFS}$ is the region inside
    the last closed flux-surface contour, $R$ is major radius measured in meters,
    and $Z$ is vertical height measured in meters; $\phi$ is the fixed toroidal angle.


    This poloidal area is distinct from the boundary perimeter, given by the [length
    of the plasma boundary](name:length_of_plasma_boundary), and from the three-dimensional
    [surface area of a flux surface](name:surface_area_of_flux_surface).'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:length_of_plasma_boundary
  - name:surface_area_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-area
    dd_documentation:
      leaf: Area of the LCFS poloidal cross section
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: m^2
    enhanced_context:
      description: Cross-sectional area of the last closed flux surface (LCFS) in
        the poloidal plane. A global equilibrium scalar characterizing the plasma
        cross-sectional size, used in confinement scaling and geometric normalizations.
      kind: llm
- name: poloidal_current_function
  kind: scalar
  status: active
  description: Poloidal current function is the signed product of major radius and
    the toroidal magnetic-field component in an axisymmetric equilibrium. It is a
    flux function associated with the net poloidal current linked by magnetic flux
    surfaces.
  documentation: "The poloidal current function is the flux-surface quantity equal\
    \ to the major-radius-weighted toroidal magnetic field in an axisymmetric equilibrium.\
    \ It is constant on nested surfaces of constant [poloidal_magnetic_flux](name:poloidal_magnetic_flux),\
    \ so it may be expressed as a function of that flux label.\n\nThe defining relationship\
    \ is\n\n$$\nF(\\psi) = R B_\\phi\n$$\n\nwhere $F$ is the poloidal current function,\
    \ $\\psi$ is [poloidal_magnetic_flux](name:poloidal_magnetic_flux), $R$ is major\
    \ radius measured from the toroidal symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, and $B_\\phi$ is the toroidal magnetic-field component\
    \ in that frame.\n\nBy Amp\xE8re's law, $F$ is proportional to the net poloidal\
    \ current linked by a toroidal Amperian contour on the same magnetic flux surface;\
    \ this proportionality gives the quantity its current-function interpretation.\
    \ It is distinct from $B_\\phi$, which equals $F/R$ and therefore generally varies\
    \ around a flux surface; in vacuum it reduces to [vacuum_poloidal_current_function](name:vacuum_poloidal_current_function).\
    \ In the Grad-Shafranov equation its current-gradient contribution appears through\
    \ [product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function](name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function).\n\
    \nSign convention: Positive when $B_\\phi$ points in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: T.m
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:vacuum_poloidal_current_function
  - name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/f
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-f
    dd_documentation:
      leaf: Diamagnetic function (F=R B_Phi)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T.m
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Diamagnetic function (F = R\xB7B\u03C6), the poloidal current\
        \ function constant on flux surfaces in ideal MHD equilibrium. Relates the\
        \ toroidal magnetic field to radial position and is a fundamental equilibrium\
        \ profile quantity."
      kind: llm
- name: poloidal_current_weighted_average_external_magnetic_flux
  kind: scalar
  status: active
  description: "Current-density-weighted mean of external poloidal magnetic flux over\
    \ the plasma cross-section, including active and passive circuits but excluding\
    \ the plasma\u2019s self-generated flux."
  documentation: 'External poloidal magnetic flux is the flux generated by all external
    circuits, including central-solenoid and poloidal-field coils, eddy currents,
    and in-vessel coils; the plasma self-flux is excluded. This quantity is its toroidal-current-density-weighted
    mean over the plasma poloidal cross-section.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, the defining average is


    $$

    \psi_{\mathrm{ext,avg}} = \frac{\displaystyle\int_A \psi_{\mathrm{ext}}(R,Z)\,j_\phi(R,Z)\,dS}{I_p}

    $$


    where $A$ is the plasma poloidal cross-section, $\psi_{\mathrm{ext}}$ is the external
    poloidal magnetic flux, $j_\phi$ is the toroidal plasma-current-density component,
    $dS$ is the poloidal area element, and $I_p=\int_A j_\phi\,dS$ is the signed total
    plasma current. The quantity is an externally generated member of the [magnetic
    flux](name:magnetic_flux) family and is distinct from a total poloidal flux that
    includes the plasma contribution.


    Sign convention: Positive when the external vertical magnetic-field component
    $B_Z$ through the defining horizontal disk points in the $+Z$ direction of the
    right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/psi_external_average
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-psi_external_average
    dd_documentation:
      leaf: 'Average (over the plasma poloidal cross section) plasma poloidal magnetic
        flux produced by all external circuits (CS and PF coils, eddy currents, VS
        in-vessel coils), given by the following formula : int(psi_external.j_tor.dS)
        / Ip'
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: "Average poloidal magnetic flux (\u03C8_ext) produced by all external\
        \ circuits (CS, PF coils, eddy currents, in-vessel coils), weighted over the\
        \ plasma cross-section by toroidal current density and normalised by plasma\
        \ current (Ip)."
      kind: llm
- name: poloidal_magnetic_field_at_constraint_position
  kind: scalar
  status: active
  description: "Poloidal magnetic field at a constraint position is the signed projection\
    \ of the magnetic field's component in the R-Z poloidal plane onto a specified\
    \ unit direction in that plane at the constraint point, using the right-handed\
    \ cylindrical (R, \u03C6, Z) frame. It excludes the toroidal \u03C6 component."
  documentation: 'Poloidal magnetic field at a constraint position is the signed projection
    of the magnetic field''s poloidal component at a specified constraint position
    onto a specified unit direction in the poloidal plane. The poloidal plane is the
    plane spanned by $(\hat{R},\hat{Z})$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, with basis $(\hat{R},\hat{\phi},\hat{Z})$ and $\hat{R}\times\hat{\phi}=\hat{Z}$,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height;
    the magnetic-field component along $\hat{\phi}$ is excluded.


    The projection is defined by first constructing the positive poloidal-plane direction
    from a nonzero direction vector at the constraint position and then taking the
    magnetic-field dot product:


    $$

    B_{\mathrm{pol},c} = \mathbf{B}(R_c,\phi_c,Z_c)\cdot\hat{\mathbf{s}}_{\mathrm{pol},c}

    = B_R(R_c,\phi_c,Z_c)s_R + B_Z(R_c,\phi_c,Z_c)s_Z,\qquad

    \hat{\mathbf{s}}_{\mathrm{pol},c}=\frac{\mathbf{q}_c}{|\mathbf{q}_c|}

    =s_R\hat{R}+s_Z\hat{Z}

    $$


    where $B_{\mathrm{pol},c}$ is this signed scalar; $(R_c,\phi_c,Z_c)$ is the constraint
    position, with $R_c$ and $Z_c$ in meters and $\phi_c$ in radians; $\mathbf{B}$
    is the magnetic-field vector in tesla; $B_R$ and $B_Z$ are its $\hat{R}$ and $\hat{Z}$
    components in tesla; $\mathbf{q}_c=q_R\hat{R}+q_Z\hat{Z}$ is any nonzero vector
    in the poloidal plane, $|\mathbf{q}_c|$ is its Euclidean norm, and $\hat{\mathbf{s}}_{\mathrm{pol},c}$
    is the resulting dimensionless positive unit direction. The coefficients $s_R$
    and $s_Z$ are dimensionless, satisfy $s_R^2+s_Z^2=1$, and have no $\hat{\phi}$
    component.


    The constraint position identifies only the locus at which this scalar is evaluated;
    it does not by itself define a probe, diagnostic, optimization method, or numerical
    representation. This quantity is the direction-resolved counterpart of poloidal_magnetic_field;
    it reduces to [radial_magnetic_field](name:radial_magnetic_field) for $\hat{\mathbf{s}}_{\mathrm{pol},c}=\hat{R}$
    and to [vertical_magnetic_field](name:vertical_magnetic_field) for $\hat{\mathbf{s}}_{\mathrm{pol},c}=\hat{Z}$.
    It differs from [parallel_magnetic_field](name:parallel_magnetic_field), whose
    projection direction is the magnetic-field-line unit vector, from [toroidal_magnetic_field](name:toroidal_magnetic_field),
    which uses the $\hat{\phi}$ component, and from [vertical_magnetic_field_at_wall](name:vertical_magnetic_field_at_wall),
    which fixes a wall locus and the $\hat{Z}$ component rather than a constraint-position
    projection direction.


    Sign convention: Positive when the local poloidal magnetic field has a component
    in the specified positive poloidal-plane unit direction at the constraint position.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vertical_magnetic_field
  - name:parallel_magnetic_field
  - name:vertical_magnetic_field_at_wall
  sources:
  - dd_path: equilibrium/time_slice/constraints/b_field_pol_probe/reconstructed
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-b_field_pol_probe-reconstructed
    dd_documentation:
