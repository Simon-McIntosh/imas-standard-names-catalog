      coordinates:
      - summary/time
    enhanced_context:
      description: Helium isotope with 3 nucleons (3He).
      kind: template
- name: helium_4_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of helium-4 ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile,
    summed over all ionization states.
  documentation: "Helium-4 density at the pedestal is the local number density of\
    \ helium-4 ions ($Z=2$, $A=4$) at the top of the H-mode edge transport barrier,\
    \ the radial position where the steep edge density gradient transitions to the\
    \ more weakly varying confined-plasma core. Helium-4 is the primary fusion-product\
    \ ash in deuterium\u2013tritium burning plasmas and may also serve as a minority\
    \ working gas; it is summed over all ionization stages (He$^+$ and He$^{2+}$)\
    \ unless a specific charge state is specified.\n\nThe total helium-4 number density\
    \ at the pedestal top is:\n\n$$\nn_{\\mathrm{He\\text{-}4}} = \\sum_{q=1}^{2}\
    \ n_{\\mathrm{He\\text{-}4},\\, q+}\n$$\n\nwhere $n_{\\mathrm{He\\text{-}4},\\\
    , q+}$ is the local number density of helium-4 ions in charge state $q+$.\n\n\
    Pedestal-top values are inferred from charge-exchange recombination spectroscopy,\
    \ wherein fully stripped helium-4 captures an electron from a diagnostic neutral\
    \ beam and emits measurable line radiation; the pedestal-top radial position is\
    \ identified from electron pressure profiles as for all members of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family.\n\nHelium-4 concentrations at the pedestal top span a few percent up\
    \ to 10\u201320% of the local electron density, depending on divertor pumping\
    \ efficiency and helium recycling. The companion [helium_3_density_at_pedestal_top](name:helium_3_density_at_pedestal_top)\
    \ captures the minority mass-3 helium isotope at the same location, enabling comparative\
    \ helium-isotope transport studies."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:helium_3_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: helium_4
    operator_kind: qualifier
- name: ion_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Characteristic outward distance over which ion number density decreases
    by one e-folding in the scrape-off layer, equal to the positive inverse magnitude
    of its outward logarithmic gradient normal to magnetic flux surfaces.
  documentation: 'This quantity is the e-folding distance for ion number density that
    decreases outward from the confined plasma into the open-field-line scrape-off
    layer. It represents the ion-density member of the scrape-off-layer decay-length
    family; the operand is an ion number density, not an electron number density or
    heat-flux magnitude.


    The local ion decay length is the positive inverse magnitude of the outward logarithmic
    gradient of the ion density:


    $$

    L_\mathrm{ion} = \left|\frac{d\ln n_\mathrm{ion}}{dx}\right|^{-1}

    $$


    where $L_\mathrm{ion}$ is the ion e-folding length, $n_\mathrm{ion}$ is the positive
    ion number density being characterized, and $x$ is outward distance from the confined
    plasma in the direction normal to magnetic flux surfaces toward the scrape-off
    layer. The scale is defined locally where the logarithmic gradient is nonzero;
    for an ion species aggregated over charge states, $n_\mathrm{ion}$ is summed over
    all charge states before the gradient is taken.


    The attested total-ion specialization [total ion decay length](name:total_ion_decay_length_over_scrape_off_layer)
    applies this definition to total ion number density. This quantity remains a specialization
    of the fully generic [scrape-off-layer decay length](name:decay_length_over_scrape_off_layer)
    and is not the parent of electron-density or heat-flux decay lengths.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_decay_length_over_scrape_off_layer
  - name:electron_decay_length_over_scrape_off_layer
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: ion
    operator_kind: qualifier
- name: ion_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of ions evaluated at the H-mode pedestal top, the radial
    location where the steep edge transport barrier transitions toward the flatter
    core plasma.
  documentation: "Ion number density at the pedestal top is the local number of ions\
    \ per unit volume at the top of the H-mode edge transport barrier. The pedestal\
    \ top marks the inner shoulder of the steep-gradient region where the edge density\
    \ gradient relaxes toward the more weakly varying confined-plasma core profile,\
    \ and is a primary characterization point for H-mode confinement quality.\n\n\
    As the parent entry in the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family, this quantity generalizes over any ion population evaluated at that\
    \ locus. The primary concrete specialization is [total_ion_density_at_pedestal_top](name:total_ion_density_at_pedestal_top),\
    \ which sums contributions over all ion species and charge states. Species-resolved\
    \ siblings such as [deuterium_density_at_pedestal_top](name:deuterium_density_at_pedestal_top)\
    \ and [hydrogen_density_at_pedestal_top](name:hydrogen_density_at_pedestal_top)\
    \ provide single-species values at the same radial location.\n\nThe ion densities\
    \ at the pedestal top are related to the local electron density through the quasi-neutrality\
    \ condition:\n\n$$\nn_e = \\sum_s Z_s \\, n_s\n$$\n\nwhere $n_e$ is the electron\
    \ number density, $Z_s$ is the charge number of ion species $s$, and $n_s$ is\
    \ its number density at the pedestal top.\n\nIon pedestal densities are inferred\
    \ from Thomson scattering electron density profiles combined with quasi-neutrality,\
    \ from charge-exchange recombination spectroscopy for individual species, or from\
    \ neutral beam diagnostics. In H-mode tokamaks, pedestal-top number densities\
    \ span roughly $1$\u2013$10 \\times 10^{19}$ m$^{-3}$, depending on plasma current,\
    \ magnetic field, and fueling."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:total_ion_density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: ion
    operator_kind: qualifier
- name: ion_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of ions at the plasma boundary, the last closed flux
    surface separating magnetically confined plasma from the open-field-line scrape-off
    layer. It may be species-resolved or aggregated over charged ion species, and
    excludes electrons and neutrals.
  documentation: 'Ion density at the plasma boundary is the number density of charged
    ions evaluated on the last closed flux surface (LCFS), which separates nested
    closed-field-line plasma from open-field-line scrape-off-layer plasma. It is the
    ion-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary),
    not the broader all-particle boundary density.


    The defining local relation for an ion population or aggregate $i$ is


    $$

    n_{i,\mathrm{b}} = \left.\frac{dN_i}{dV}\right|_{\mathrm{LCFS}}

    $$


    where $N_i$ is the number of charged ions in the selected species, charge-state
    set, or ion aggregate, $V$ is volume, and the subscript $\mathrm{b}$ denotes evaluation
    at the LCFS.


    This parent spans species-resolved and aggregate ion boundary densities. A species-level
    ion density that is not explicitly charge-state-resolved is a charge-state-summed
    per-volume amount over ionized charge states; examples include [hydrogen density
    at the plasma boundary](name:hydrogen_density_at_plasma_boundary) and charge-state-summed
    impurity densities such as [iron density at the plasma boundary](name:iron_density_at_plasma_boundary).
    An aggregate such as [total ion density at the plasma boundary](name:total_ion_density_at_plasma_boundary)
    sums charged ion species and charge states, while [flux-surface-averaged ion density
    at the plasma boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary)
    applies an additional average over the LCFS. Electrons and neutral particles are
    excluded; as a number density, $n_{i,\mathrm{b}} \ge 0$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:total_ion_density_at_plasma_boundary
  - name:flux_surface_averaged_ion_density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: ion
    operator_kind: qualifier
- name: flux_surface_averaged_ion_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of ions at the plasma boundary, averaged over the last
    closed flux surface to represent the separatrix population rather than a single
    local value.
  documentation: 'Ion density at the plasma boundary is the flux-surface-averaged
    number density of charged ions on the last closed flux surface (LCFS), which separates
    confined closed-field-line plasma from open-field-line scrape-off-layer plasma.
    It is the averaged component of [ion density at the plasma boundary](name:ion_density_at_plasma_boundary),
    rather than the broader all-particle [density at the plasma boundary](name:density_at_plasma_boundary).


    For the selected ion population $i$, the boundary flux-surface average is defined
    by


    $$

    \langle n_i\rangle_{\mathrm{b}} = \frac{\displaystyle\int_{\psi=\psi_b} n_i\,\frac{dS}{|\nabla\psi|}}{\displaystyle\int_{\psi=\psi_b}\frac{dS}{|\nabla\psi|}}

    $$


    where $n_i$ is the local number density of the selected charged-ion population,
    $\psi$ is the poloidal magnetic-flux label, $\psi_b$ labels the LCFS, and $dS$
    is the surface-area element. Species-level values are summed over ionized charge
    states unless a charge state is explicitly selected; electrons and neutrals are
    excluded. Unlike the local parent quantity, this value averages variation around
    the LCFS, as in [flux-surface-averaged hydrogen density at the plasma boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary).


    Sign convention: Positive when the selected charged-ion population contributes
    positively to the number density on the LCFS.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:ion_density_at_plasma_boundary
  - name:density_at_plasma_boundary
  - name:flux_surface_averaged_hydrogen_density_at_plasma_boundary
  arguments:
  - name: ion_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix_average/n_i
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i
    dd_documentation:
      leaf: Ion density per species
      parent_path: summary/local/separatrix_average
      parent: Flux surface averaged parameters at separatrix (flux-surface average
        over the entire core-SOL boundary separatrix)
      data_type: STRUCTURE
      unit: m^-3
      lifecycle_status: active
    enhanced_context:
      description: Ion density (ni) per species, flux-surface averaged at the separatrix,
        with entries for individual ion species. Represents the particle density at
        the core-SOL boundary and serves as a key input for edge plasma and divertor
        modelling.
      kind: llm
- name: ion_diffusivity
  kind: vector
  status: active
  description: Ion diffusivity is the vector of directional effective Fickian coefficients
    for particle transport of the ion population summed over all charge states. A
    positive component corresponds to diffusive ion flux opposite to the total-ion
    density gradient in the same direction.
  documentation: 'Ion diffusivity is the vector of directional effective Fickian coefficients
    for particle transport of the ion population summed over all charge states. Each
    component relates the diffusive total-ion particle flux projected along one resolved
    physical direction to the physical gradient of the total ion number density along
    that direction.


    The component definition is


    $$

    \Gamma_{i,a}^{\mathrm{diff}} = -D_{i,a}\left(\hat{e}_a \cdot \nabla n_i\right)

    $$


    where $a$ labels one resolved physical direction, $\hat{e}_a$ is the normalized
    direction vector, $D_{i,a}$ is the corresponding ion diffusivity component, $\Gamma_{i,a}^{\mathrm{diff}}$
    is the diffusive total-ion particle flux component, and $n_i$ is the total ion
    number density. The projection $\hat{e}_a \cdot \nabla n_i$ is the metric-scaled
    physical gradient along $a$, not a bare derivative with respect to a coordinate
    label.


    The charge-state aggregation is defined through the flux-gradient relation: $n_i$
    and $\Gamma_{i,a}^{\mathrm{diff}}$ are sums over all ion charge states before
    the effective coefficient is formed. Therefore $D_{i,a}$ is not generally a density-weighted
    mean of [charge-state-resolved ion diffusivities](name:ion_charge_state_diffusivity).
    The quantity includes only the diffusive, gradient-driven coefficient; it excludes
    advective or convective particle transport, source terms, and off-diagonal cross-gradient
    elements of a rank-two tensor. It differs from the scalar [ion diffusion coefficient](name:ion_diffusion_coefficient)
    by preserving resolved directional components; examples of such components are
    [poloidal ion diffusion coefficient](name:poloidal_ion_diffusion_coefficient)
    and [radial ion diffusion coefficient](name:radial_ion_diffusion_coefficient).


    Sign convention: Positive when the diffusive ion particle flux component is opposite
    to the total-ion density gradient along the same resolved direction.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_diffusivity
  - name:parallel_ion_diffusivity
  - name:ion_momentum_diffusivity
- name: ion_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Radial e-folding decay length of the ion heat flux in the scrape-off
    layer, defined by its outward logarithmic decrease.
  documentation: 'The ion heat decay length in the scrape-off layer (SOL) is the radial
    distance over which the ion heat-flux profile falls to $1/e$ of its separatrix
    value, characterizing the spatial scale of ion heat exhaust across the open-field-line
    region.


    The decay length is defined by the inverse magnitude of the outward logarithmic
    radial gradient of the ion heat flux $q_i$:


    $$

    \lambda_{q,i} = \left| \frac{\partial \ln q_i}{\partial r} \right|^{-1}

    $$


    where $r$ is radial distance measured outward from the separatrix and $q_i$ is
    the ion contribution to the heat flux. This species-resolved quantity is the ion-channel
    specialization of [heat_decay_length_over_scrape_off_layer](name:heat_decay_length_over_scrape_off_layer);
    the corresponding electron channel is [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer).
    It excludes the electron heat contribution and any unspecified total heat-flux
    combination.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:heat_decay_length_over_scrape_off_layer
  - name:electron_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: heat_decay_length_over_scrape_off_layer
    operator: ion
    operator_kind: qualifier
  sources:
  - dd_path: summary/scrape_off_layer/heat_flux_i_decay_length/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-scrape_off_layer-heat_flux_i_decay_length-value
    dd_documentation:
      leaf: Value
      parent_path: summary/scrape_off_layer/heat_flux_i_decay_length
      parent: Ion heat flux radial decay length inv(grad qi/qi)
      data_type: FLT_1D
      unit: m
      coordinates:
      - summary/time
    enhanced_context:
      description: "Ion heat flux radial decay length (\u03BB_qi) in the scrape-off\
        \ layer, defined as the inverse logarithmic gradient of the ion heat flux:\
        \ [grad(qi)/qi]^-1. Characterizes the spatial scale of ion power exhaust across\
        \ the SOL."
      kind: template
- name: iron_density
  kind: scalar
  status: active
  description: Total number density of iron impurity ions in the plasma, summed over
    all ionization states from singly to fully ionized iron (atomic number Z = 26).
  documentation: 'Iron density is the total number density of iron ions present in
    the plasma, aggregated over all charge states from Fe$^{1+}$ through Fe$^{26+}$
    (atomic number $Z = 26$). It characterizes the iron impurity content without resolving
    the per-charge-state distribution, and may refer to a local point value or a spatially
    averaged quantity depending on the sampling convention.


    The total iron ion number density $n_\mathrm{Fe}$ is defined as:


    $$

    n_\mathrm{Fe} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}

    $$


    where $n_{\mathrm{Fe}^{z+}}$ is the number density of iron in charge state $z$.


    Iron enters confined plasmas primarily through physical sputtering of high-$Z$
    plasma-facing components. Spectroscopic measurements in the vacuum-ultraviolet
    and soft X-ray ranges resolve individual charge-state emission lines; the total
    iron density is reconstructed by summing ionization-state-resolved densities derived
    from ionization balance calculations.


    This general quantity is concretized by spatial-sampling variants: [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density_at_plasma_boundary)
    averages the local density over a magnetic flux surface, [line_averaged_iron_density](name:line_averaged_iron_density)
    represents a chord-integrated value divided by path length, and [volume_averaged_iron_density](name:volume_averaged_iron_density)
    integrates over the full plasma volume. Position-specific forms are available
    at key radial locations such as [iron_density_at_magnetic_axis](name:iron_density_at_magnetic_axis),
    iron_density_at_pedestal, and [iron_density_at_limiter](name:iron_density_at_limiter).


    Sign convention: Positive when iron ions are present in the sampled plasma volume;
    the quantity is intrinsically non-negative as a particle number density.'
  unit: m^-3
