    operator_kind: qualifier
- name: nitrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Nitrogen ion number density evaluated at the divertor target.
  documentation: 'Nitrogen ion number density at the divertor target quantifies the
    local concentration of ionized nitrogen in the plasma immediately adjacent to
    the divertor plate surface. Nitrogen is commonly seeded as an impurity into the
    divertor region to enhance radiative power dissipation through atomic line emission,
    promoting plasma detachment and reducing peak heat loads on the target.


    The ion number density $n_\mathrm{N}$ is defined as the zeroth velocity moment
    of the nitrogen ion velocity distribution:


    $$

    n_\mathrm{N} = \int f_\mathrm{N}(\mathbf{v}) \, d^3v

    $$


    where $f_\mathrm{N}(\mathbf{v})$ is the nitrogen ion phase-space distribution
    function and integration is over all velocities $\mathbf{v}$.


    This quantity is inferred from optical spectroscopy of nitrogen line emission
    in the divertor plasma, or from Langmuir probe measurements combined with spectroscopic
    impurity fraction estimates. It is a key parameter for characterizing impurity
    seeding scenarios and controlling plasma detachment. Analogous quantities for
    other seeded impurity species include [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    argon_density_at_divertor_target, [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    and [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    this quantity is the nitrogen-specific component of the parent [density_at_divertor_target](name:density_at_divertor_target).


    Sign convention: Positive when nitrogen ions are present at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:neon_density_at_divertor_target
  - name:oxygen_density_at_divertor_target
  - name:xenon_density_at_divertor_target
  - name:density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: nitrogen
    operator_kind: qualifier
- name: oxygen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local plasma volume number density of oxygen impurity ions adjacent
    to the divertor target, summed over all ionized oxygen charge states.
  documentation: 'Oxygen density at the divertor target is the local volume number
    density of ionized oxygen impurity species in the near-target divertor plasma.
    It counts oxygen ions by particle number, not by charge density, and excludes
    neutral oxygen atoms and oxygen retained in or adsorbed on the target material.


    The all-charge-state oxygen ion density is defined as the sum of the local charge-state
    densities:


    $$

    n_\mathrm{O}^{\mathrm{target}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+}}^{\mathrm{target}}

    $$


    where $q$ is the oxygen ion charge state, $n_{\mathrm{O}^{q+}}^{\mathrm{target}}$
    is the local volume number density of oxygen ions in charge state $q$ in m^-3,
    and $n_\mathrm{O}^{\mathrm{target}}$ is the summed oxygen ion density in m^-3.
    The neutral state $q=0$ is not included.


    In practice, this quantity is inferred from divertor spectroscopy of oxygen emission
    lines combined with electron temperature, electron density, and collisional-radiative
    or ionization-balance modeling, or from edge plasma simulations constrained by
    such measurements. Because different emission lines sample different charge states
    and plasma conditions, evaluating the all-charge-state sum requires an estimate
    of the local oxygen charge-state distribution.


    Useful value checks are non-negativity and consistency with the local total ion
    density: $0 \le n_\mathrm{O}^{\mathrm{target}} \le$ [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).
    A universal numerical range is not intrinsic to the definition because the value
    depends strongly on divertor plasma conditions, oxygen sources, and ionization
    balance; normalized comparisons are often expressed using [oxygen_fraction](name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density).
    Related oxygen densities at other spatial scopes include [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    and [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:total_ion_density_at_divertor_target
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  - name:oxygen_density_at_plasma_boundary
