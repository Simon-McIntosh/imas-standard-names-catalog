- name: toroidal_flux_surface_averaged_nitrogen_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal velocity of nitrogen ions at the plasma
    boundary (separatrix), with charge states combined by a density-weighted mean.
  documentation: 'Flux-surface-averaged toroidal nitrogen-ion velocity is the density-weighted
    mean of the toroidal bulk-flow velocities of nitrogen ions over the separatrix,
    the plasma boundary between closed and open magnetic field lines. Nitrogen ion
    charge states are combined as one intensive species quantity; their velocities
    are averaged, not summed.


    The defining charge-state and flux-surface average is


    $$

    \langle v_{\phi,N}\rangle_{\mathrm{sep}}

    =

    \frac{\displaystyle\oint_{\mathcal S_{\mathrm{sep}}}

    \left(\frac{\sum_{q=1}^{7} n_{N^{q+}}v_{\phi,N^{q+}}}{\sum_{q=1}^{7} n_{N^{q+}}}\right)

    \frac{dS}{|\nabla\psi|}}

    {\displaystyle\oint_{\mathcal S_{\mathrm{sep}}}\frac{dS}{|\nabla\psi|}}

    $$


    where $n_{N^{q+}}$ is the number density of nitrogen charge state $q$ in m$^{-3}$,
    $v_{\phi,N^{q+}}$ is its toroidal velocity component in m s$^{-1}$, $q$ ranges
    from 1 through 7, $dS$ is a surface-area element, and $\psi$ is a flux-surface
    label. The toroidal component uses the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    This quantity excludes neutral nitrogen. The related [flux-surface-averaged nitrogen
    density](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary) is the
    corresponding charge-state-summed extensive quantity, while [toroidal flux-surface-averaged
    ion velocity](name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary)
    combines ion species rather than isolating nitrogen.


    Sign convention: Positive when the density-weighted nitrogen-ion flow is directed
    toward increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
