- name: toroidal_magnetic_field_at_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Toroidal component of the magnetic field evaluated at the geometric
    centroid of each ferritic in-vessel element, giving the local phi-direction field
    strength experienced by the ferromagnetic material.
  documentation: "The toroidal magnetic field at a ferritic element centroid is the\
    \ projection of the total magnetic field vector onto the toroidal direction $\\\
    hat{\\phi}$ at the geometric center of a ferromagnetic in-vessel structural component.\
    \ Ferritic elements are ferromagnetic inserts installed inside the vacuum vessel;\
    \ the field value at their centroid provides a representative local field for\
    \ each discrete element in thin-shell or equivalent-circuit magnetic models of\
    \ ferromagnetic in-vessel hardware.\n\nThe toroidal component is defined by:\n\
    \n$$\nB_\\phi = \\mathbf{B} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\hat{\\phi}$ is\
    \ the unit vector in the direction of increasing toroidal angle $\\phi$ in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, with $R$ the major radius and\
    \ $Z$ the vertical coordinate.\n\nIn magnetostatic models of ferromagnetic in-vessel\
    \ components, $B_\\phi$ at the centroid enters the material's $B$\u2013$H$ constitutive\
    \ relation to determine the element's toroidal magnetization state, captured by\
    \ [toroidal magnetization](name:toroidal_magnetization_of_ferritic_element). Together\
    \ with [radial_magnetic_field_at_ferritic_element_centroid](name:radial_magnetic_field_at_ferritic_element_centroid)\
    \ and [vertical_magnetic_field_at_ferritic_element_centroid](name:vertical_magnetic_field_at_ferritic_element_centroid),\
    \ it reconstructs the full field vector at each ferritic centroid, enabling assessment\
    \ of the element's magnetization state under operational conditions. In tokamak\
    \ configurations the toroidal field dominates, with values of order 1\u20136 T\
    \ near in-vessel components depending on the device and radial position.\n\nSign\
    \ convention: Positive when $B_\\phi$ points in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_magnetization_of_ferritic_element
  - name:radial_magnetic_field_at_ferritic_element_centroid
  - name:vertical_magnetic_field_at_ferritic_element_centroid
