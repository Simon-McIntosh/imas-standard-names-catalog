- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Flux of the poloidal magnetic-field component through an oriented toroidal
    surface, used as a radial label for nested equilibrium surfaces.
  documentation: 'Poloidal magnetic flux is the [magnetic flux](name:magnetic_flux)
    associated with the poloidal component of the equilibrium magnetic field. In an
    axisymmetric confinement device it labels nested flux surfaces, while differences
    in this quantity between surfaces carry the physical content independent of any
    arbitrary offset. The complementary [toroidal magnetic flux](name:toroidal_magnetic_flux)
    measures toroidal-field flux through a poloidal cross-section, and their radial
    variation determines field-line helicity and magnetic shear.


    A common definition is the flux of the poloidal magnetic field through an oriented
    toroidal surface spanning from the magnetic axis to the flux surface of interest:


    $$

    \psi = \int_{S_\mathrm{tor}} \mathbf{B}_\mathrm{pol} \cdot d\mathbf{S}_\mathrm{tor}

    $$


    where $\psi$ is the poloidal magnetic flux, $\mathbf{B}_\mathrm{pol}$ is the poloidal
    magnetic-field component, and $d\mathbf{S}_\mathrm{tor}$ is the oriented area
    element of the toroidal integration surface in the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    It is inferred from magnetic-equilibrium reconstruction constrained by external
    magnetic probes, flux loops, polarimetry, motional-Stark-effect measurements,
    and kinetic pressure information. The value at the magnetic axis, [poloidal magnetic
    flux at magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis), provides
    a common inner reference for flux-surface coordinates.


    Representative axis-to-boundary flux differences are about 0.1-5 Wb in small and
    medium tokamaks and 10-100 Wb in reactor-scale equilibria, depending mainly on
    plasma current, size, and shaping.


    Sign convention: Positive when the poloidal magnetic field threads the toroidal
    integration surface in the positive surface-normal direction defined by outward
    motion in the poloidal cross-section followed by increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux
  - name:toroidal_magnetic_flux
  - name:poloidal_magnetic_flux_at_magnetic_axis
  sources:
  - id: dd:core_profiles/profiles_1d/grid/psi
    dd_path: core_profiles/profiles_1d/grid/psi
    status: composed
