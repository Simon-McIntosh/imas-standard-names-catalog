name: tendency_of_fast_electron_number_density
status: draft
cocos_transformation_type: one_like
description: Partial time derivative of the non-thermal (fast) electron number density,
  $\partial n_{e,\mathrm{fast}} / \partial t$.
documentation: The tendency $\partial n_{e,\mathrm{fast}} / \partial t$ describes
  the local rate of change of the fast (supra-thermal) electron population. Fast electrons
  are generated by auxiliary heating schemes such as electron cyclotron resonance
  heating (ECRH) and lower hybrid current drive (LHCD), and they slow down via Coulomb
  collisions on a characteristic time $\tau_s$ that depends on the background plasma
  parameters. The fast-electron continuity equation reads $\partial n_{e,\mathrm{fast}}
  / \partial t = S_{e,\mathrm{fast}} - n_{e,\mathrm{fast}} / \tau_s - \nabla \cdot
  \Gamma_{e,\mathrm{fast}}$, where $S_{e,\mathrm{fast}}$ is the source rate from RF
  acceleration and $\Gamma_{e,\mathrm{fast}}$ is the spatial transport flux. Note
  that the unit is m$^{-3}$, consistent with the transport-solver convention in which
  the time step normalization is applied externally. Typical fast-electron densities
  are a small fraction ($\lesssim 1\%$) of the bulk $n_e$, so the tendency is correspondingly
  smaller than the total electron density tendency except during strong ECRH injection
  transients. See `tendency_of_electron_number_density` for the total electron tendency
  and `electron_number_density` for the base quantity.
