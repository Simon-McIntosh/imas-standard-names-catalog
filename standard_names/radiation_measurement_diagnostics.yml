- name: spectral_radiance_of_soft_xray_detector
  kind: scalar
  status: active
  description: Power radiance of soft X-ray emission incident on a detector channel,
    defined as detected power per unit area per unit solid angle and integrated over
    the detector energy band.
  documentation: "Soft X-ray spectral radiance is the detected electromagnetic power\
    \ from plasma emission per unit detector area per unit solid angle, integrated\
    \ over one or more energy bands defined by the detector channel's filter or spectral\
    \ response. It quantifies the power flux delivered along a specific line of sight\
    \ through the plasma and is distinct from photon radiance; the companion quantity\
    \ brightness_of_soft_xray_detector expresses the same measurement in photons per\
    \ second rather than in power units.\n\nThe defining relation is:\n\n$$\nL = \\\
    frac{d^2 P}{dA \\, d\\Omega}\n$$\n\nwhere $P$ is the detected power, $dA$ is the\
    \ active detector area element, and $d\\Omega$ is the solid-angle element subtended\
    \ by the field of view; integration over the detector energy passband is implicit\
    \ in this band-integrated form.\n\nSoft X-ray power radiance is measured with\
    \ semiconductor photodiodes placed behind metallic foil filters that select an\
    \ effective energy passband, commonly in the range 0.1\u201310 keV. Fan arrays\
    \ of such channels enable tomographic inversion to recover the volumetric soft\
    \ X-ray emissivity profile, supporting impurity transport studies, MHD mode tracking,\
    \ and sawtooth monitoring. Multiplying by the detector \xE9tendue (area times\
    \ solid angle) recovers the total channel power given by [power_of_soft_xray_detector](name:power_of_soft_xray_detector).\
    \ The hard X-ray power radiance analog following the same spatial radiance definition\
    \ at higher photon energies is spectral_radiance_of_hard_xray_detector."
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_of_soft_xray_detector
  arguments:
  - name: radiance_of_soft_xray_detector
    operator: spectral
    operator_kind: qualifier
  sources:
  - dd_path: soft_x_rays/channel/brightness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-brightness
    dd_documentation:
      leaf: Power flux received by the detector, per unit solid angle and per unit
        area (i.e. power divided by the etendue), in multiple energy bands if available
        from the detector
      parent_path: soft_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: STRUCTURE
      unit: W.m^-2.sr^-1
    enhanced_context:
      description: "Soft X-ray (SXR) brightness, defined as detected power flux per\
        \ unit solid angle and per unit detector area (power divided by \xE9tendue),\
        \ measured in one or more energy bands. Used for plasma tomography and MHD\
        \ mode analysis."
      kind: llm
- name: spectral_wavelength_of_optical_element
  kind: scalar
  status: active
  description: Wavelength coordinate axis defining the spectral sampling grid at which
    the optical properties or instrument response of a diagnostic optical element
    are characterized.
  documentation: "This quantity specifies the set of photon wavelength values constituting\
    \ the spectral axis used to sample the wavelength-resolved properties of a diagnostic\
    \ optical element, such as its transmission, reflectivity, absorption, refractive\
    \ index, or instrument response function. It applies across a wide range of diagnostic\
    \ types, from crystal X-ray spectrometers and soft or hard X-ray filter windows\
    \ to visible-band filter spectrometers, wherever the element's spectral behavior\
    \ must be characterized on a defined wavelength grid.\n\nThe photon wavelength\
    \ $\\lambda$ relates to photon energy $E$ by\n\n$$\n\\lambda = \\frac{hc}{E}\n\
    $$\n\nwhere $h$ is Planck's constant and $c$ is the speed of light in vacuum.\
    \ For hard X-ray filter materials the grid spans roughly 0.001\u20130.1 nm; for\
    \ soft X-ray diagnostics, 0.1\u201350 nm; for visible-band spectrometers, 380\u2013\
    780 nm.\n\nThis spectral coordinate is the companion axis to wavelength-resolved\
    \ material properties such as [spectral_refractive_index_of_optical_element](name:spectral_refractive_index_of_optical_element)\
    \ and feeds into the derivation of quantities like [effective_spectral_width_of_spectrometer_channel](name:effective_spectral_width_of_spectrometer_channel).\
    \ For identifying individual spectral features resolved within this grid, the\
    \ central rest-frame vacuum wavelength of a transition is given by [wavelength_of_spectral_line](name:wavelength_of_spectral_line)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_refractive_index_of_optical_element
  - name:effective_spectral_width_of_spectrometer_channel
  - name:wavelength_of_spectral_line
  sources:
