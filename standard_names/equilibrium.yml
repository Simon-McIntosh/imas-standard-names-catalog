- name: rotational_transform
  kind: scalar
  status: active
  description: Dimensionless field-line winding number on a magnetic flux surface,
    equal to the number of poloidal turns per toroidal circuit and the inverse of
    the safety factor.
  documentation: 'Rotational transform is the field-line winding number on a magnetic
    flux surface, measuring poloidal winding relative to toroidal winding. It can
    vary from one nested magnetic flux surface to another.


    The rotational transform is defined by


    $$

    \iota(\psi) = \frac{d\Phi_{\mathrm{pol}}}{d\Phi_{\mathrm{tor}}} = \frac{1}{q(\psi)}

    $$


    where $\iota$ is the rotational transform, $\psi$ labels the magnetic flux surface,
    $\Phi_{\mathrm{pol}}$ is poloidal magnetic flux, $\Phi_{\mathrm{tor}}$ is toroidal
    magnetic flux, and $q(\psi)$ is the [safety factor](name:safety_factor). The relation
    is differential, so the flux increments are evaluated on neighboring surfaces
    rather than as a ratio of total fluxes.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  sources:
  - dd_path: summary/local/r_eff_norm_2_3/iota/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-r_eff_norm_2_3-iota-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/r_eff_norm_2_3/iota
      parent: Rotational transform (1/q)
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Rotational transform (1/q).
      kind: template
- name: squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: Squareness of the plasma boundary is a dimensionless Luce shape coefficient
    quantifying the whole-boundary corner deviation of the last closed flux surface
    from the reference ellipse set by the boundary minor radius, elongation, and triangularity.
    Positive values make the corner regions boxier, approaching the circumscribing
    rectangle; negative values make them more diamond-like.
  documentation: 'Squareness of the plasma boundary is a dimensionless Luce shape
    coefficient quantifying the deviation of the corner regions of the last closed
    flux surface from the reference ellipse whose semi-axes are set by the boundary
    minor radius, elongation, and triangularity. It is the whole-boundary summary
    of the quadrant-level squareness values, characterizing whether the poloidal cross-section
    corners bulge outward toward the circumscribing rectangle or are pinched inward
    relative to the elliptical reference contour.


    In a poloidal cross-section at fixed toroidal angle $\phi$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, each quadrant of the boundary is bounded by
    its radial extremum (innermost or outermost major-radius point) and its vertical
    extremum (topmost or bottommost point), and a reference ellipse is constructed
    through these two extrema; the semi-axes of this ellipse are fixed by the boundary
    minor radius, elongation, and triangularity. Along the diagonal from the ellipse
    center $O$ toward the corner $F$ of the rectangle circumscribing the quadrant,
    the quadrant squareness is


    $$

    \zeta = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}

    $$


    where $D$ is the intersection of the diagonal with the plasma boundary, $E$ its
    intersection with the reference ellipse, and $\overline{OD}$, $\overline{OE}$,
    $\overline{OF}$ are distances from the ellipse center. With this construction
    $\zeta = 0$ when the boundary follows the elliptical arc, $\zeta = 1$ when it
    passes through the rectangle corner, and $\zeta < 0$ when the corner is indented
    inside the ellipse (diamond- or bean-like).


    This whole-boundary quantity summarizes the four quadrant-resolved members [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    and [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    and decomposes into [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary)
    on the high-field side (smaller major radius $R$) and [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    on the low-field side (larger $R$). Use the quadrant- or side-resolved members
    when the boundary corners are shaped asymmetrically; this quantity carries no
    information about up-down or in-out asymmetry of the corner shaping.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:inner_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
- name: inner_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: Inner squareness of the plasma boundary is the Luce shape coefficient
    for the high-field-side corner pair, referenced to an ellipse defined by boundary
    size and shaping.
  documentation: 'Inner squareness of the plasma boundary is a dimensionless Luce
    shape coefficient characterizing how the high-field-side corners of the last closed
    flux surface depart from a reference ellipse. It covers the inner corner behavior
    represented separately by the [upper-inner squareness](name:upper_inner_squareness_of_plasma_boundary)
    and [lower-inner squareness](name:lower_inner_squareness_of_plasma_boundary) quantities,
    rather than selecting one vertical quadrant.


    In a poloidal cross-section at fixed toroidal angle $\phi$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, the coefficient for an inner quadrant is


    $$

    \zeta = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}

    $$


    where $O$ is the reference-ellipse center, $D$ is the boundary intersection along
    the corner diagonal, $E$ is the corresponding ellipse intersection, and $F$ is
    the corner of the circumscribing rectangle; the overbars denote distances. The
    reference ellipse is set by the boundary minor radius, elongation, and triangularity.
    This component refines the whole-boundary [squareness of the plasma boundary](name:squareness_of_plasma_boundary)
    to its high-field-side corners.


    Sign convention: Positive when the inner boundary corner lies outward from the
    reference ellipse toward the circumscribing rectangle.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_inner_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: inner
    operator_kind: qualifier
- name: lower_inner_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: "Dimensionless Luce squareness parameter for the lower-inner (below-midplane,\
    \ high-field-side) plasma boundary in a poloidal cross-section at fixed toroidal\
    \ angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame, measuring\
    \ its departure from the reference ellipse set by boundary minor radius, elongation,\
    \ and triangularity."
  documentation: 'The lower-inner squareness of the plasma boundary is the dimensionless
    Luce shape coefficient quantifying how much the lower-inboard quadrant of the
    last-closed flux surface deviates from the reference ellipse determined by the
    boundary minor radius, elongation, and triangularity. The lower-inboard quadrant
    is the part of the boundary at smaller major radius and below the reference-ellipse
    center in a poloidal cross-section.


    In the Luce higher-order boundary parameterization, the lower-inner boundary contour
    at fixed toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame is represented over the lower-inboard interval of the poloidal angle $\theta$
    by the coefficient $\zeta_{\mathrm{LI}}$:


    $$

    \begin{aligned}

    R(\theta) &= R_{\mathrm{geo}} + a\cos\!\left[\theta + \arcsin(\delta_{\mathrm{ref}})\sin\theta
    - \zeta_{\mathrm{LI}}\sin(2\theta)\right],\\

    Z(\theta) &= Z_{\mathrm{geo}} + a\kappa_{\mathrm{ref}}\sin\!\left[\theta + \zeta_{\mathrm{LI}}\sin(2\theta)\right]

    \end{aligned}

    $$


    where $R(\theta)$ and $Z(\theta)$ are the major-radius and vertical coordinates
    of the boundary point, $R_{\mathrm{geo}}$ and $Z_{\mathrm{geo}}$ are the coordinates
    of the geometric center of the reference ellipse, $a$ is the boundary minor radius,
    $\kappa_{\mathrm{ref}}$ and $\delta_{\mathrm{ref}}$ are the elongation and triangularity
    entering the same reference boundary description, and $\theta=0$ labels the outboard
    midplane with increasing $\theta$ first moving toward $+Z$. The geometric center
    of the reference ellipse is not the magnetic-axis position unless those points
    coincide for the chosen boundary geometry.


    This quantity is restricted to the lower-inboard quadrant and excludes the upper-inboard
    quadrant represented by [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary).
    It is a quadrant-resolved component of [inner_squareness_of_plasma_boundary](name:inner_squareness_of_plasma_boundary),
    distinct from the outer-side squareness components, and complements [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)
    and [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary)
    in describing boundary shape beyond the reference ellipse. With the sign shown
    in the Luce representation, positive $\zeta_{\mathrm{LI}}$ moves the lower-inboard
    corner toward smaller $R$ and lower $Z$ relative to the reference ellipse, making
    that corner more rectangular; negative values make it rounder.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_flux_surface
  arguments:
  - name: inner_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/boundary/squareness_lower_inner
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-squareness_lower_inner
    dd_documentation:
      leaf: Lower inner squareness of the plasma boundary (definition from T. Luce,
        Plasma Phys. Control. Fusion 55 (2013) 095009)
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: alpha
      lifecycle_version: 3.18.0
    enhanced_context:
      description: "Lower inner squareness (\u03B6_LI) of the plasma boundary shape\
        \ parameter, defined following the T. Luce convention. Quantifies the deviation\
        \ of the lower inner quadrant of the plasma cross-section from an elliptical\
        \ shape."
      kind: llm
- name: outer_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless Luce shape coefficient measuring how both outboard (low-field-side)
    corners of the plasma boundary depart from the reference ellipse defined by minor
    radius, elongation, and triangularity.
  documentation: 'The outer squareness of the plasma boundary is the Luce (2013) dimensionless
    shape coefficient characterizing how the low-field-side (large-$R$) corners of
    the last-closed flux surface poloidal cross-section depart from the reference
    ellipse defined by the boundary minor radius $a$, elongation $\kappa$, and triangularity
    $\delta$. It is the parent quantity for [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary)
    and [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    which resolve the upper-outboard and lower-outboard corner contributions separately.


    A positive outer squareness indicates the outboard corners of the plasma cross-section
    lie outside the reference ellipse (a more rectangular boundary), while a negative
    value indicates inward concavity at the outboard corners. The outer squareness
    is particularly sensitive to X-point geometry and the configuration of low-field-side
    shaping coils, making it relevant to heat-load distribution and edge stability.


    Outer squareness is inferred from equilibrium reconstruction by fitting the poloidal
    boundary contour $\{R(\xi), Z(\xi)\}$, where $\xi$ is a poloidal parameter, to
    external magnetic measurements and internal constraints. The global single-coefficient
    summary is provided by [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary),
    while the high-field-side corner contributions are captured by [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary)
    and upper_inner_squareness_of_plasma_boundary.


    Sign convention: Positive when the outer boundary corner lies outside the reference
    ellipse at the corner poloidal angle, i.e., the outboard boundary is displaced
    toward larger minor radius relative to the inscribed ellipse in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is vertical
    height.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_outer_squareness_of_plasma_boundary
  - name:lower_outer_squareness_of_plasma_boundary
  - name:squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  arguments:
  - name: squareness_of_plasma_boundary
    operator: outer
    operator_kind: qualifier
- name: lower_outer_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless Luce shape coefficient measuring how the lower outboard
    (low-field-side) corner of the plasma boundary departs from the reference ellipse
    defined by boundary minor radius, lower elongation, and lower triangularity.
  documentation: 'The lower outer squareness $\zeta_{lo}$ is one of four corner-specific
    shape parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the lower outer quadrant of the plasma cross-section boundary deviates
    from the reference ellipse defined by the boundary minor radius $a$, lower elongation
    $\kappa_l$, and lower triangularity $\delta_l$. The lower outer quadrant is the
    low-field-side, large-$R$ corner below the magnetic-axis height in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height.


    Within the Luce corner parameterization, the coefficient is related to the lower-outer
    superellipse exponent $n_{lo}$ by


    $$

    \zeta_{lo} = 1 - \frac{2}{n_{lo}}

    $$


    where $n_{lo}$ controls the local corner curvature of the lower-outboard boundary
    segment. The reference ellipse corresponds to $n_{lo}=2$.


    Positive values indicate that the lower-outboard boundary corner lies outside
    the reference ellipse at the corresponding corner location, giving a more rectangular
    boundary; $\zeta_{lo}=0$ indicates the reference ellipse; negative values indicate
    that the corner lies inside the reference ellipse, giving inward concavity relative
    to that ellipse. This coefficient excludes the upper-outboard and high-field-side
    corner contributions represented by [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    and [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary);
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    combines the outboard corner behavior, and [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary)
    is the global single-coefficient summary.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  arguments:
  - name: outer_squareness_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/boundary/squareness_lower_outer
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-squareness_lower_outer
    dd_documentation:
      leaf: Lower outer squareness of the plasma boundary (definition from T. Luce,
        Plasma Phys. Control. Fusion 55 (2013) 095009)
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: alpha
      lifecycle_version: 3.18.0
    enhanced_context:
      description: "Lower outer squareness (\u03B6_lo) of the plasma boundary shape,\
        \ defined following the convention of T. Luce (PPCF 2013). Characterises the\
        \ deviation of the lower outer quadrant of the plasma cross-section from an\
        \ elliptical shape."
      kind: llm
- name: surface_area_of_flux_surface
  kind: scalar
  status: active
  description: Total geometric area of a closed toroidal magnetic flux surface, obtained
    by revolving its poloidal contour through one complete toroidal revolution about
    the symmetry axis.
  documentation: 'The quantity is the total geometric area of a closed toroidal magnetic
    flux surface in an axisymmetric equilibrium. It measures the magnetic surface
    itself, rather than the area enclosed by its poloidal cross-section.


    For an axisymmetric surface in the right-handed cylindrical $(R,\phi,Z)$ frame,
    the area is defined by


    $$

    A_{\mathrm{s}} = \oint_{\mathcal{C}} 2\pi R\,\mathrm{d}l_{\mathrm{p}}

    $$


    where $A_{\mathrm{s}}$ is the surface area, $R$ is the major-radius coordinate
    in meters, $\phi$ is the toroidal angle in radians, $Z$ is the vertical coordinate
    in meters, $\mathcal{C}$ is the closed poloidal contour, and $\mathrm{d}l_{\mathrm{p}}$
    is its differential arc length in meters. The related [area of a flux surface]
    is the enclosed poloidal cross-sectional area and must not be confused with this
    toroidal surface area.'
  unit: m^2
  physics_domain: equilibrium
  links: []
  sources:
