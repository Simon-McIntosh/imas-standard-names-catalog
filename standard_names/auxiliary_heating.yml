      kind: llm
- name: thermal_electron_power_at_inside_flux_surface
  kind: scalar
  status: active
  description: Cumulative wave power absorbed by the bulk thermal electron population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal electron power at an inside flux surface quantifies the
    total rate at which coherent wave energy is absorbed by the bulk thermal electron
    population within the plasma volume bounded by a given magnetic flux surface.
    It is the thermal-electron contribution to [electron power at an inside flux surface](name:electron_power_at_inside_flux_surface),
    distinct from the suprathermal contribution [fast electron power at an inside
    flux surface](name:fast_electron_power_at_inside_flux_surface).


    The quantity is obtained by integrating the flux-surface-averaged thermal-electron
    power density $p_{\mathrm{thermal,e}}$ over the enclosed plasma volume:


    $$

    P_{\mathrm{thermal,e}}(\rho) = \int_0^\rho p_{\mathrm{thermal,e}}(\rho'') \frac{dV}{d\rho''}
    \, d\rho''

    $$


    where $P_{\mathrm{thermal,e}}(\rho)$ is the cumulative absorbed power, $\rho$
    labels the limiting magnetic flux surface, $\rho''$ is the integration variable,
    $p_{\mathrm{thermal,e}}$ is the local thermal-electron absorbed power density,
    and $dV/d\rho''$ is the differential enclosed volume per unit flux-surface label.
    Only absorption by bulk thermal electrons is included; fast-electron and ion absorption,
    launched power, and absorption outside the enclosed volume are excluded. At the
    outermost closed flux surface, it gives the total wave power absorbed by thermal
    electrons.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
  sources:
  - dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-electrons-power_inside_thermal
    dd_documentation:
      leaf: Absorbed wave power on thermal species inside a flux surface (cumulative
        volume integral of the absorbed power density)
      parent_path: waves/coherent_wave/profiles_1d/electrons
      parent: Quantities related to the electrons
      data_type: FLT_1D
      unit: W
      coordinates:
      - waves/coherent_wave/profiles_1d/grid/rho_tor_norm
    enhanced_context:
      description: Cumulative absorbed wave power on thermal electrons inside a flux
        surface (volume integral of absorbed power density), as a 1D radial profile.
        Represents the total thermal electron wave power deposition profile.
      kind: llm
- name: thermal_ion_power_at_inside_flux_surface
  kind: scalar
  status: active
  description: Cumulative wave power absorbed by the bulk thermal ion population within
    the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'The thermal-ion power at inside flux surface is the running volume
    integral of wave power deposited into the bulk thermal ion population, giving
    the radial distribution of enclosed thermal-ion wave absorption. It is the bulk-ion
    component of [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface),
    separated from both fast-ion and electron heating channels.


    The quantity is the volume integral of the thermal-ion wave-power density $p_{\mathrm{th},i}(\mathbf{r})$
    over the plasma domain $V(\chi)$ enclosed by the flux surface labeled $\chi$:


    $$

    P_{\mathrm{th},i}(\chi) = \int_{V(\chi)} p_{\mathrm{th},i}(\mathbf{r}) \, dV

    $$


    where $p_{\mathrm{th},i}$ is the thermal-ion volumetric wave-power density in
    W m$^{-3}$, $dV$ is the volume element in m$^3$, $P_{\mathrm{th},i}$ is the enclosed
    thermal-ion wave power in W, and $\chi$ is the chosen flux-surface label, such
    as the normalized toroidal flux radius $\rho_\mathrm{tor,norm}$.


    This quantity includes only wave energy absorbed by bulk thermal ions inside the
    selected closed magnetic flux surface. Wave energy absorbed by thermal electrons
    is [thermal_electron_power_at_inside_flux_surface](name:thermal_electron_power_at_inside_flux_surface),
    wave energy absorbed by suprathermal ions is [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface),
    and the sum over thermal and fast ion populations is [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  arguments:
  - name: ion_power_at_inside_flux_surface
    operator: thermal
    operator_kind: qualifier
  sources:
  - dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-ion-power_inside_thermal
    dd_documentation:
      leaf: Absorbed wave power on thermal species inside a flux surface (cumulative
        volume integral of the absorbed power density)
