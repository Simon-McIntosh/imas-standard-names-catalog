- name: per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase
  kind: scalar
  status: draft
  description: "Phase angle of the right-hand circularly polarized (RHC, E+) component\
    \ of the wave electric field, resolved per toroidal mode number n. It is the argument\
    \ of the complex spectral amplitude of the E+ polarization in the poloidal cross-section.\
    \ The physically meaningful unit is radians (dimensionless); m^-1\xB7V is the\
    \ unit of the parent phasor family."
  documentation: 'The right-hand circularly polarized electric field component $E_+$
    is defined in the plane perpendicular to the background equilibrium magnetic field
    $\mathbf{B}_0$. In a local orthonormal frame where $\hat{e}_1$ points in the poloidal
    direction and $\hat{e}_2 = \hat{b} \times \hat{e}_1$ (with $\hat{b} = \mathbf{B}_0/|\mathbf{B}_0|$),
    the RHC basis vector is $\hat{e}_+ = (\hat{e}_1 + i\hat{e}_2)/\sqrt{2}$, rotating
    in the same sense as positive ions gyrating around $\mathbf{B}_0$ (for singly
    charged positive ions with $\mathbf{B}_0$ in the $+\hat{Z}$ direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame). For a toroidal mode number $n_\phi$, the complex
    spectral amplitude is written $\tilde{E}_+(n_\phi) = |\tilde{E}_+|\,e^{i\varphi_+}$,
    so that the phase documented here is

    $$\varphi_+ = \arg\bigl(\tilde{E}_+(n_\phi)\bigr) \in (-\pi, \pi].$$

    The phase $\varphi_+$ governs the spatial coherence of the wave pattern around
    the torus and determines interference between launched and reflected wave packets.
    In ion cyclotron resonance heating (ICRH), $E_+$ is the polarization component
    that drives resonant power absorption at the ion cyclotron frequency; accurate
    tracking of $\varphi_+$ per toroidal mode number is therefore essential for computing
    resonant power deposition profiles.


    The physically meaningful unit is radians (dimensionless). The dimensional unit
    $\text{m}^{-1}\cdot\text{V}$ is inherited from the parent complex phasor amplitude
    $\tilde{E}_+$ and is carried for bookkeeping consistency within the spectral field
    amplitude family; for a pure phase angle, only the argument (radians) is physically
    significant.


    Sign convention: Positive when the phase of $\tilde{E}_+(n_\phi)$ is in the upper
    half of the complex plane, i.e., when the imaginary part of the normalized phasor
    is positive.


    Typical values span the full range $(-\pi, \pi]$ depending on the wave-launching
    geometry, antenna phasing, and plasma loading conditions. The companion amplitude
    is documented in [per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_amplitude](name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_amplitude),
    which provides $|\tilde{E}_+|$. The corresponding left-hand circularly polarized
    phase $\varphi_-$ for the $E_-$ component is documented in [per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase](name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase).
    The phase of the field component parallel to $\mathbf{B}_0$ is documented in [per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase](name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase).'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_amplitude
  - name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase
  constraints: []
