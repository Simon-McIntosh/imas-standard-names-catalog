- name: normalized_collisionality
  kind: scalar
  status: draft
  description: Dimensionless ratio of an interspecies collision frequency to the characteristic
    streaming, transit, or bounce frequency used by a gyrokinetic model. It measures
    the relative strength of collisional relaxation compared with collisionless motion
    along magnetic-field trajectories.
  documentation: 'Normalized collisionality is a dimensionless measure of how rapidly
    two particle species are collisionally scattered relative to a characteristic
    collisionless motion frequency. The reference frequency is model dependent: it
    may represent thermal streaming, transit motion, or trapped-particle bounce motion,
    so the numerical value must be interpreted together with that normalization choice.


    A common generic definition is


    $$

    \nu^*_{ij} = \frac{\nu_{ij}}{\omega_\mathrm{ref}}

    $$


    where $\nu_{ij}$ is the collision frequency between species $i$ and $j$ in s$^{-1}$,
    and $\omega_\mathrm{ref}$ is the chosen reference frequency in s$^{-1}$. For a
    thermal-transit choice, $\omega_\mathrm{ref}$ is often of order $v_{\mathrm{th},s}/(qR)$,
    where $v_{\mathrm{th},s}$ is the thermal speed in m s$^{-1}$, $q$ is the dimensionless
    safety factor, and $R$ is the major radius in meters in the right-handed cylindrical
    $(R, \phi, Z)$ frame. If the species temperature $T_s$ is used to compute $v_{\mathrm{th},s}$,
    $T_s$ is an energy in joules in SI formulas, or $eT_s$ when $T_s$ is specified
    in eV.


    In practice, $\nu_{ij}$ is computed from local density, temperature, charge state,
    particle masses, and the Coulomb logarithm, while $\omega_\mathrm{ref}$ is computed
    from the equilibrium geometry and species thermal speed. This quantity sets the
    strength of collision operators in gyrokinetic modeling and should not be assumed
    to use the same bounce-frequency denominator as [normalized_electron_collisionality](name:normalized_electron_collisionality),
    which is commonly used for neoclassical regime classification.


    Typical core-turbulence values are about $10^{-4}$-$10^{-1}$ for hot, weakly collisional
    plasmas. Cooler edge, pedestal, or high-density conditions can give values of
    $0.1$-$10$, where collisional relaxation becomes comparable to or faster than
    the reference collisionless motion.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_mass
  - name:normalized_particle_charge
  sources:
