- name: deuterium_tritium_density_at_divertor_target
  kind: scalar
  status: active
  description: Deuterium-tritium density at the divertor target is the local number
    density of deuterium and tritium fuel ions in the plasma immediately adjacent
    to a divertor target surface, evaluated at the entrance to the electrostatic sheath.
    It is summed over the positive atomic ionization states of both isotopes, D+ and
    T+, and excludes neutral atoms and molecules.
  documentation: 'Deuterium-tritium density at the divertor target is the local number
    density of deuterium and tritium fuel ions in the plasma immediately adjacent
    to a divertor target surface, evaluated at the entrance to the electrostatic sheath.
    It is the deuterium-tritium-specific member of [density at the divertor target](name:density_at_divertor_target)
    and the corresponding species-group instance of [ion density at the divertor target](name:ion_density_at_divertor_target).


    The combined target fuel-ion density is defined by the differential particle count
    of the deuterium and tritium atomic ion populations at the same target location:


    $$

    n_{\mathrm{DT},t} = \frac{d\left(N_{\mathrm{D}^+}+N_{\mathrm{T}^+}\right)}{dV}
    = n_{\mathrm{D}^+,t}+n_{\mathrm{T}^+,t}

    $$


    where $N_{\mathrm{D}^+}$ and $N_{\mathrm{T}^+}$ are the numbers of deuterium and
    tritium atomic ions in a small plasma volume $V$ whose center approaches the sheath
    entrance from the plasma side at the divertor target, $n_{\mathrm{D}^+,t}$ is
    the [deuterium density at the divertor target](name:deuterium_density_at_divertor_target),
    and $n_{\mathrm{T}^+,t}$ is the [tritium density at the divertor target](name:tritium_density_at_divertor_target).


    For the atomic deuterium and tritium species, summing over all positive ionization
    states reduces to the singly ionized states $\mathrm{D}^+$ and $\mathrm{T}^+$.
    Neutral deuterium or tritium atoms, neutral molecules, and explicitly molecule-specific
    populations are excluded. This quantity contributes additively to [total ion density
    at the divertor target](name:total_ion_density_at_divertor_target) together with
    other positive-ion species, and it is a particle number density rather than a
    charge density. Its limiter counterpart is [deuterium-tritium density at the limiter](name:deuterium_tritium_density_at_limiter).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:tritium_density_at_divertor_target
  - name:ion_density_at_divertor_target
  arguments:
