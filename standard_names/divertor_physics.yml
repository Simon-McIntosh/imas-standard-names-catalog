- name: total_particle_flux_of_divertor_due_to_recycling
  kind: scalar
  status: active
  description: Rate at which particles are returned to the edge plasma by recycling
    on all divertor target surfaces, summed over every recycled carrier channel. For
    this total quantity, molecular and compound-particle multiplicity is applied so
    that each carrier contributes the number of individual particles it returns before
    summation.
  documentation: 'Rate at which particles are returned to the edge plasma by recycling
    on all divertor target surfaces, expressed on a particle-number basis. For this
    total quantity, molecular and compound-particle carriers are resolved to their
    constituent-particle multiplicity before summation, so a released molecule contributes
    the number of atoms it delivers rather than a single carrier count, and the contributions
    of neutral, atomic, molecular, and ionic recycled products are then summed over
    the divertor target set.


    The total recycled particle rate is the plasma-ward surface integral of the recycled
    particle flux density, summed over all divertor targets:


    $$

    \Phi_\mathrm{rec,tot}^\mathrm{div} = \sum_{t} \int_{S_t} m(\mathbf{r}) \, \boldsymbol{\Gamma}_\mathrm{rec}(\mathbf{r})
    \cdot \hat{\mathbf{n}}_{p,t}(\mathbf{r}) \, dA

    $$


    where $S_t$ is the material surface of divertor target $t$, $dA$ is its surface
    area element, $\boldsymbol{\Gamma}_\mathrm{rec}$ is the local recycled carrier
    flux-density vector (in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$), $m$ is the particle
    multiplicity of each carrier that converts carrier count to returned-particle
    count, and $\hat{\mathbf{n}}_{p,t}$ is the unit normal directed from the target
    material surface toward the plasma.


    This is the multiplicity-resolved, particle-number specialization of the recycling
    return rate [particle flux of divertor due to recycling](name:particle_flux_of_divertor_due_to_recycling),
    and it is a component of the general recycling return rate [flux of divertor due
    to recycling](name:flux_of_divertor_due_to_recycling). It excludes non-recycling
    sources such as external gas injection, sputtered impurity production, and pumping
    removal, and it is distinct from the energy, power, and momentum fluxes associated
    with the same surface processes.


    Sign convention: Positive when the local recycled particle flux density is directed
    from the divertor target material surface toward the plasma.'
  unit: s^-1
  physics_domain: divertor_physics
  links:
  - name:particle_flux_of_divertor_due_to_recycling
  arguments:
  - name: particle_flux_of_divertor_due_to_recycling
    operator: total
    operator_kind: qualifier
