- name: vertical_coordinate_of_shattered_pellet_position
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of the shattered pellet injector (SPI) pellet
    center-of-mass position in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $Z$ is the height above the machine midplane.
  documentation: "The vertical coordinate $Z_{\\rm pellet}$ locates the center of\
    \ mass of the SPI pellet along the machine symmetry axis direction at any instant\
    \ during its transit from the injector port to the plasma. Together with the major-radius\
    \ coordinate (part of [shattered_pellet_position](name:shattered_pellet_position))\
    \ and the toroidal angle, it fully specifies the three-dimensional pellet trajectory\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major\
    \ radius and $Z$ is the vertical height measured from the machine midplane. This\
    \ coordinate is distinct from [vertical_coordinate_of_shattered_pellet_fragment_position](name:vertical_coordinate_of_shattered_pellet_fragment_position),\
    \ which tracks individual post-shattering fragments rather than the intact pellet\
    \ as a whole. The temporal derivative of this coordinate yields [vertical_component_of_shattered_pellet_velocity](name:vertical_component_of_shattered_pellet_velocity).\
    \ Typical $Z$ excursions span from the injector port height (up to $\\pm 1$\u2013\
    $2$ m from the midplane on large tokamaks) to the plasma deposition region near\
    \ $Z = 0$. The position is tracked optically or inferred from the injector geometry\
    \ and pellet speed.\n\nSign convention: Positive when the pellet center of mass\
    \ is located above the machine midplane in the $+Z$ direction."
