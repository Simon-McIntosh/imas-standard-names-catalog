- name: poloidal_angle_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Poloidal angle of a beam-tracing beam point in the poloidal cross-section\
    \ of the right-handed cylindrical (R, \u03C6, Z) frame, locating each trajectory\
    \ position angularly about the magnetic axis."
  documentation: 'The poloidal angle of a beam-tracing beam is the geometric angular
    coordinate of each successive point along a wave propagation trajectory in the
    poloidal $(R, Z)$ plane of the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    This spatial position angle locates where the beam lies in the poloidal cross-section
    at each step along its path, in contrast to [poloidal_angle_of_electron_cyclotron_beam](name:poloidal_angle_of_electron_cyclotron_beam),
    which encodes the wave-vector propagation direction rather than the geometric
    beam location.


    For a beam-tracing point at coordinates $(R, Z)$ with the magnetic axis at $(R_\mathrm{axis},
    Z_\mathrm{axis})$, the angle follows the general [poloidal_angle](name:poloidal_angle_of_flux_surface)
    construction:


    $$

    \theta = \operatorname{atan2}(Z - Z_\mathrm{axis},\; R - R_\mathrm{axis})

    $$


    where $R$, $Z$, $R_\mathrm{axis}$, and $Z_\mathrm{axis}$ are in meters and $\operatorname{atan2}(y,
    x)$ is the quadrant-aware arctangent.


    In beam-tracing calculations, $\theta$ is evaluated at each discrete point along
    the computed ray path, allowing the beam deposition profile to be mapped onto
    poloidal-angle coordinates for comparison with profiles sampled at similar [poloidal_angle_of_measurement_position](name:poloidal_angle_of_measurement_position)
    values. Values span $(-\pi, \pi]$ rad, with $\theta = 0$ at the outboard midplane,
    $\theta = \pi/2$ rad at the top of the plasma, and $\theta = \pm\pi$ rad at the
    inboard midplane.


    Sign convention: Positive when the beam-tracing point is above the horizontal
    plane through the magnetic axis ($Z > Z_\mathrm{axis}$).'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_angle_of_electron_cyclotron_beam
  - name:poloidal_angle_of_flux_surface
  - name:poloidal_angle_of_measurement_position
  sources:
  - dd_path: waves/coherent_wave/beam_tracing/beam/position/theta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-position-theta
    dd_documentation:
      leaf: Poloidal angle
