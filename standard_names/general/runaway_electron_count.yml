name: runaway_electron_count
status: draft
cocos_transformation_type: one_like
description: Total number of runaway electrons present in the plasma at a given time.
documentation: "Runaway electrons are suprathermal electrons that undergo continuous\
  \ acceleration by the parallel electric field $E_\\parallel$ when the Dreicer field\
  \ condition $E_\\parallel > E_D = n_e e^3 \\ln\\Lambda / (4\\pi\\epsilon_0^2 m_e\
  \ c^2)$ is approached, where $n_e$ is the electron density (m$^{-3}$), $e$ the elementary\
  \ charge, $\\ln\\Lambda$ the Coulomb logarithm, $\\epsilon_0$ the vacuum permittivity,\
  \ $m_e$ the electron mass, and $c$ the speed of light. This scalar gives the instantaneous\
  \ total population of such electrons in the confined plasma. Runaway populations\
  \ are inferred from hard X-ray (HXR) emission, synchrotron radiation imaging, or\
  \ neutron diagnostics; during disruptions the count can exceed $10^{16}$\u2013$10^{18}$\
  \ in ITER-scale plasmas. Controlling the runaway population is critical for disruption\
  \ mitigation, as a localized loss of runaways can deposit multi-MJ energies on plasma-facing\
  \ components. The quantity is dimensionless (unit 1) since it represents a particle\
  \ count."
