- name: count_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Signed turn count of a poloidal magnetic field probe coil, encoding
    both the number of turns and the winding direction via sign.
  documentation: 'The signed turn count of a poloidal magnetic field probe coil combines
    the absolute number of wire turns with a sign that encodes the winding sense relative
    to the probe''s orientation. This sign convention is essential for correctly reconstructing
    the poloidal magnetic field from the measured induced voltage via $V = -N \, d\Phi/dt$,
    where $N$ is the turn count (including sign) and $\Phi$ is the poloidal magnetic
    flux through the coil''s effective area. Typical absolute turn counts range from
    tens to hundreds for in-vessel poloidal field probes; the sign is set during installation
    or calibration. The sign convention directly mirrors that of $[\text{count\_of\_toroidal\_magnetic\_field\_probe}](name:count_of_toroidal_magnetic_field_probe)$
    and serves as a key calibration parameter for equilibrium reconstruction and plasma
    shape control.


    Sign convention: Positive when the winding direction follows the right-hand rule
    about the probe''s positive normal direction as defined by the right-handed cylindrical
    $(R, \phi, Z)$ system.'
  unit: '1'
  physics_domain: magnetic_field_diagnostics
  links:
  - name:count_of_toroidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_pol_probe/turns
    dd_path: magnetics/b_field_pol_probe/turns
    status: composed
  - id: dd:magnetics/bpol_probe/turns
    dd_path: magnetics/bpol_probe/turns
    status: composed
- name: count_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Signed turn count of a toroidal magnetic field probe coil, encoding
    both the number of turns and the winding direction via sign
  documentation: 'A poloidal array of localized induction coils oriented to measure
    the local toroidal component of the magnetic field. Each probe records the loop
    integral $\oint \vec{A} \cdot d\vec{l}$ around its open area, but the measured
    voltage is proportional to $N \cdot \frac{d\Phi}{dt}$, where $N$ is the signed
    number of turns. The sign convention arises from the right-hand rule: a positive
    $N$ means that a positive rate of change of toroidal flux ($\Phi_\phi$) produces
    a positive electromotive force (voltage) in the probe. Typical turn counts range
    from 1 to 100 for individual probes, with larger $|N|$ increasing signal strength
    but also loading the circuit. A change in winding direction flips the sign, encoding
    the physical orientation of the coil relative to the $(R, \phi, Z)$ cylindrical
    basis.


    Sign convention: Positive when the winding direction yields a positive voltage
    for increasing $\Phi_\phi$ in the $+\hat{\phi}$ direction.'
  unit: '1'
  physics_domain: magnetic_field_diagnostics
  links:
  - name:count_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_phi_probe/turns
    dd_path: magnetics/b_field_phi_probe/turns
    status: composed
  - id: dd:magnetics/b_field_tor_probe/turns
    dd_path: magnetics/b_field_tor_probe/turns
    status: composed
- name: perpendicular_magnetic_field
  kind: scalar
  status: draft
  description: Magnetic field component perpendicular to a reference direction, typically
    the local equilibrium field. Computed as the root-sum-square of contributing field
    components, assuming orthogonality.
  documentation: "The perpendicular magnetic field $B_{\\perp}$ is the component of\
    \ the total magnetic field orthogonal to a specified reference direction, most\
    \ often the local equilibrium magnetic field. It arises from stray magnetic fields\
    \ and eddy currents induced in conducting structures, and is computed as $B_{\\\
    perp} = \\sqrt{B_{\\text{stray}}^2 + B_{\\text{eddy}}^2}$, under the assumption\
    \ that the stray and eddy contributions are mutually orthogonal. In plasma initiation,\
    \ $B_{\\perp}$ influences electron magnetization and avalanche ionization; typical\
    \ acceptable values during breakdown are below 1\u20135 mT in large tokamaks.\
    \ This quantity complements the toroidal and poloidal magnetic field components.\n\
    \nSign convention: Positive when the component points in the direction of increasing\
    \ coordinate in the right-handed $(R, \\phi, Z)$ system."
  unit: T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:toroidal_magnetic_field
  - name:poloidal_magnetic_field
  - name:parallel_electric_field
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:plasma_initiation/global_quantities/b_field_perpendicular
    dd_path: plasma_initiation/global_quantities/b_field_perpendicular
    status: composed
  - id: dd:plasma_initiation/global_quantities/b_field_perpendicular/data
    dd_path: plasma_initiation/global_quantities/b_field_perpendicular/data
    status: composed
- name: poloidal_magnetic_field_due_to_passive_structure
  kind: scalar
  status: draft
  description: Poloidal magnetic field response at each probe location due to a unit
    current in a passive conducting loop, used for electromagnetic coupling analysis.
  documentation: 'The poloidal magnetic field coupling from passive axisymmetric conductor
    loops to poloidal field probe measurements quantifies the linear response of the
    poloidal field probes to currents induced in passive structures. This quantity
    forms a coupling matrix $M_{ij}$ where each element gives the poloidal field at
    probe $i$ per unit current in passive loop $j$, defined as $B_{\text{pol},i} =
    M_{ij} I_{\text{passive},j}$. The coupling matrices encode the electromagnetic
    mutual inductance between passive structures and poloidal field probes, typically
    computed from vacuum field solutions or direct inductance calculations, and are
    essential for real-time plasma position control and equilibrium reconstruction.
    This quantity differs from [mutual_inductance_of_flux_loop](name:mutual_inductance_of_flux_loop)
    by directly providing poloidal field values rather than flux linkages, and complements
    [current_of_passive_loop_due_to_induction](name:current_of_passive_loop_due_to_induction)
    by specifying the resulting fields.


    Sign convention: Positive when the poloidal magnetic field produced by a positive
    passive loop current points in the direction of increasing poloidal angle in the
    $(R, \phi, Z)$ reference frame.


    The coupling values are geometry-dependent and typically range from $10^{-8}$
    to $10^{-4}$ T/A for medium-scale tokamaks, depending on probe proximity and loop
    size, with larger values for probes near passive structures. See [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    and [poloidal_magnetic_flux_at_separatrix](name:poloidal_magnetic_flux_at_separatrix)
    for related poloidal magnetic flux quantities.'
  unit: A^-1.T
  physics_domain: magnetic_field_diagnostics
  links:
  - name:mutual_inductance_of_flux_loop
  - name:current_of_passive_loop_due_to_induction
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_separatrix
  arguments:
