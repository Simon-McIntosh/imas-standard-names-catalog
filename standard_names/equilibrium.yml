- name: poloidal_beta
  kind: scalar
  status: draft
  description: Poloidal beta is the dimensionless ratio of total plasma pressure content
    to the magnetic-pressure scale of the poloidal field generated by the toroidal
    plasma current. It measures the pressure contribution to equilibrium force balance
    relative to the plasma current.
  documentation: 'Poloidal beta, $\beta_p$, is a global equilibrium measure of plasma
    pressure normalized to the magnetic-pressure scale associated with the plasma-current-driven
    poloidal magnetic field. It is used to compare pressure loading with the current
    needed to confine the plasma and is closely connected to Shafranov shift, bootstrap-current
    fraction, and equilibrium stability limits.


    The common volume-integral definition is:


    $$

    \beta_p = \frac{4 \int p \, dV}{R_0 \, \mu_0 \, I_p^2}

    $$


    where $p$ is the total kinetic plasma pressure in pascals, $dV$ is the volume
    element in cubic meters, $R_0$ is a reference major radius in meters measured
    from the toroidal symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, $\mu_0$ is the permeability of free space in H/m, and $I_p$ is the total
    toroidal plasma current in amperes. The squared current makes $\beta_p$ insensitive
    to the sign of $I_p$; unlike [toroidal beta], which is normalized to toroidal-field
    magnetic pressure, $\beta_p$ is normalized to the poloidal-field energy scale
    set by [plasma current](name:toroidal_plasma_current).


    In practice, $\beta_p$ is computed by integrating [plasma pressure](name:plasma_pressure)
    over reconstructed flux-surface volumes, with pressure obtained from density and
    temperature measurements such as Thomson scattering, interferometry, electron-cyclotron
    emission, and charge-exchange spectroscopy. Magnetic equilibrium analysis can
    also constrain $\beta_p$ through the Shafranov shift and external poloidal-field
    measurements. In large-aspect-ratio ordering, external magnetic constraints often
    involve a combined pressure and current-profile term such as $\beta_p + l_i/2$,
    where $l_i$ is the internal inductance, so $\beta_p$ and current-profile information
    are not always independently determined by magnetic measurements alone.


    Typical values are about 0.1-0.5 in Ohmic or L-mode plasmas and 0.3-1.5 in H-mode
    plasmas. Advanced high-bootstrap-current scenarios often target $\beta_p > 1$;
    the bootstrap-current fraction scales approximately with $\epsilon^{1/2}\beta_p$,
    where $\epsilon = a/R_0$ is the inverse aspect ratio.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:toroidal_plasma_current
  - name:plasma_pressure
  sources:
