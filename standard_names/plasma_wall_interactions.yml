    enhanced_context:
      description: Xenon.
      kind: template
- name: y_coordinate_of_diagnostic_aperture
  kind: scalar
  status: active
  description: Signed y coordinate of the geometric center of a diagnostic aperture
    in the right-handed camera Cartesian (x, y, z) frame.
  documentation: 'The quantity is the signed Cartesian y coordinate of a diagnostic
    aperture''s geometric center, measured from the origin of the right-handed camera
    basis $(\hat{x}, \hat{y}, \hat{z})$. It locates the aperture along the camera-frame
    y axis.


    The coordinate is defined by projection of the center position vector:


    $$

    y_{\rm ap} = \mathbf{r}_{\rm ap} \cdot \hat{\mathbf{y}}

    $$


    where $y_{\rm ap}$ is the coordinate value, $\mathbf{r}_{\rm ap}$ is the aperture-center
    position relative to the camera-frame origin, and $\hat{\mathbf{y}}$ is the positive
    y-axis unit vector; the length quantities are expressed in m.


    This camera-frame coordinate is distinct from the radial and vertical coordinates
    in the right-handed cylindrical $(R, \phi, Z)$ frame. Together with the [x coordinate
    of the diagnostic aperture](name:x_coordinate_of_diagnostic_aperture), it locates
    the aperture center in the camera frame.


    Sign convention: Positive when the aperture center lies in the positive y direction
    from the camera-frame origin.'
  unit: m
