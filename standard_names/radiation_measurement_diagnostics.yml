- name: reference_calibration_wavelength_of_spectrometer_channel
  kind: scalar
  status: active
  description: Reference calibration wavelength of a spectrometer channel is the vacuum-wavelength
    intercept of the channel's linear detector-pixel dispersion relation at pixel
    coordinate k = 0.
  documentation: 'Reference calibration wavelength of a spectrometer channel is the
    vacuum wavelength assigned by a linear wavelength calibration to detector-pixel
    coordinate $k=0$. It is the intercept term of the affine relation between detector-pixel
    coordinate and vacuum wavelength for that channel.


    The linear calibration relation is


    $$

    \lambda(k) = g k + \lambda_0

    $$


    where $\lambda(k)$ is the vacuum wavelength at detector-pixel coordinate $k$,
    $k$ is a dimensionless detector-pixel coordinate, $g$ is the signed dispersion
    coefficient in $\mathrm{m}$ per pixel-coordinate unit, and $\lambda_0$ is the
    reference calibration wavelength.


    This quantity is the intercept $\lambda_0$, not the dispersion coefficient $g$
    and not the wavelength evaluated at any nonzero detector-pixel coordinate. The
    sign of $g$ encodes whether vacuum wavelength increases or decreases with increasing
    $k$; the reference calibration wavelength itself is a wavelength value at the
    chosen coordinate origin.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_spectrometer_channel
  sources:
  - dd_path: spectrometer_uv/channel/wavelength_calibration/offset
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_uv.html#spectrometer_uv-channel-wavelength_calibration-offset
    dd_documentation:
      leaf: Offset
      parent_path: spectrometer_uv/channel/wavelength_calibration
      parent: 'Wavelength calibration data. The wavelength is obtained from the pixel
        index k by: wavelength =  k * gain + offset. k is starting from 1.'
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: "Wavelength calibration offset for a UV spectrometer channel, giving\
        \ the zero-pixel intercept of the linear pixel-to-wavelength mapping: wavelength\
        \ = k \xD7 gain + offset. Analogous to the intercept term in visible grating\
        \ spectrometer calibrations."
      kind: llm
  - dd_path: spectrometer_visible/channel/grating_spectrometer/wavelength_calibration/offset
