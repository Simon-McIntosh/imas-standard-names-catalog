- name: radial_coordinate_of_ferritic_element
  kind: scalar
  status: active
  description: "Non-negative major-radius coordinate of the second point in a ferritic\
    \ element\u2019s axisymmetric thick-line geometry, expressed in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the major-radius coordinate of the second point
    in the axisymmetric thick-line geometric representation of a ferritic element.
    It locates that endpoint by its distance from the toroidal symmetry axis, rather
    than describing the element centroid or cross-sectional extent.


    The major radius is related to the point''s horizontal Cartesian coordinates by


    $$

    R = \sqrt{X^2 + Y^2}

    $$


    where $R$ is the major-radius coordinate, and $X$ and $Y$ are orthogonal horizontal
    Cartesian coordinates measured from the toroidal symmetry axis. The result is
    the $R$ coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $\phi$ is toroidal angle and $Z$ is vertical height.


    This quantity applies specifically to the second point of each ferritic element
    represented by an axisymmetric thick-line geometry. It is a per-point coordinate
    and is neither averaged nor summed over the element set. It is distinct from the
    first point, the oblique reference point, the geometric centroid represented by
    [radial coordinate of ferritic element centroid](name:radial_coordinate_of_ferritic_element_centroid),
    and an outline coordinate represented by [radial outline of ferritic element](name:radial_outline_of_ferritic_element).


    It is a point-specific specialization of [radial coordinate](name:radial_coordinate),
    obtained by evaluating the parent coordinate at the second point of the ferritic
    element rather than at a general geometric point or reference position.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_coordinate_of_ferritic_element_centroid
  sources:
  - dd_path: ferritic/object/axisymmetric/oblique/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-axisymmetric-oblique-r
