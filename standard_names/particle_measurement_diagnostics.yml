- name: peak_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Peak voltage of a neutron detector is the baseline-referenced pulse
    height of the processed detector signal, evaluated at the pulse extremum after
    applying the channel pulse-polarity convention. It represents the voltage amplitude
    assigned to an individual detector response.
  documentation: 'Peak voltage of a neutron detector is the pulse height assigned
    to the processed voltage waveform from a detector module. It is referenced to
    the local pre-pulse baseline and uses the channel pulse-polarity convention, so
    it is not simply the raw algebraic maximum of the unprocessed waveform or an absolute
    value over the full record.


    For a pulse-search window, the baseline-referenced peak voltage can be written
    as the maximum polarity-corrected excursion:


    $$

    V_{\mathrm{peak}} = \max_{t \in W}\left[p\left(V_{\mathrm{proc}}(t)-V_{\mathrm{base}}\right)\right]

    $$


    where $V_{\mathrm{peak}}$, $V_{\mathrm{proc}}(t)$, and $V_{\mathrm{base}}$ are
    in volts, $W$ is the time window associated with the pulse, and $p$ is the pulse-polarity
    factor: $p=+1$ for positive-going processed pulses and $p=-1$ for negative-going
    processed pulses.


    In practice, the digitized detector output is conditioned by shaping, filtering,
    or other signal-processing steps before the peak is found. The baseline is usually
    estimated from pre-pulse samples or a nearby quiet interval, and pulse pileup,
    saturation, and electronic noise determine whether the extracted peak is reliable.
    This quantity is distinct from the instantaneous [detector voltage](name:voltage_of_neutron_detector),
    which denotes the voltage signal itself before the peak-height reduction.


    Representative processed pulse heights are strongly instrument-dependent, but
    neutron detector electronics commonly report values from about 0.001-5 V for resolved
    pulses. Values near the noise floor are threshold-dependent, while values approaching
    the acquisition full scale may indicate saturation rather than a proportional
    neutron response.


    Sign convention: Positive when the pulse excursion is in the channel''s configured
    pulse-polarity direction relative to the local baseline; for a positive-going
    channel this means the processed voltage at the pulse peak exceeds the baseline,
    and for a negative-going channel it means it is below the baseline before polarity
    correction.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:voltage_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  - name:requested_upper_voltage_of_neutron_detector
  arguments:
  - name: voltage_of_neutron_detector
    operator: peak
    operator_kind: qualifier
  sources:
  - id: dd:neutron_diagnostic/detectors/amplitude_peak
    dd_path: neutron_diagnostic/detectors/amplitude_peak
    status: composed
- name: voltage_of_temperature_sensor
  kind: scalar
  status: draft
  description: Electrical potential difference output by a temperature sensor that
    monitors the thermal environment of a neutron detector module. It is the sensor
    signal measured relative to a designated electronics reference, normally before
    conversion to calibrated temperature.
  documentation: 'Voltage of a temperature sensor is the electrical potential difference
    generated by, or produced from, the sensor element and read by the acquisition
    electronics as the thermal-monitor signal for a neutron detector module. It is
    an electrical signal in volts, not a temperature; conversion to detector or sensor
    temperature requires the applicable calibration, baseline, and electronics gain
    information.


    The temperature calibration is commonly represented as a mapping from the corrected
    sensor voltage:


    $$

    T_s = f_\mathrm{cal}\!\left(\frac{V_s - V_0}{G}\right)

    $$


    where $T_s$ is the inferred sensor temperature, $V_s$ is this measured voltage,
    $V_0$ is the voltage offset or baseline associated with the reference condition
    and readout chain, $G$ is the dimensionless electronics gain, and $f_\mathrm{cal}$
    is the calibration function for the sensor type. For a locally linear calibration,
    the sensitivity $S_T = dV/dT$ has units of V/K and is distinct from the voltage
    value $V_s$ itself.


    In practice the voltage is obtained by digitizing the potential difference between
    the sensor signal terminal and the electronics reference or return terminal. The
    sensor may be a thermocouple, resistance thermometer, thermistor, or integrated
    temperature monitor, with appropriate excitation, cold-junction compensation,
    amplification, filtering, and offset correction applied according to the measurement
    chain.


    Typical recorded voltages depend strongly on sensor type and conditioning. Unamplified
    thermocouple signals are commonly in the $10^{-4}$-$10^{-2}$ V range over practical
    temperature excursions, with sensitivities of order $10^{-5}$-$10^{-4}$ V/K; conditioned
    resistive or semiconductor temperature channels are often scaled to about $0$-$5$
    V or $-10$-$10$ V. These voltage ranges should not be interpreted as temperature
    sensitivities unless a calibration slope in V/K is specified.


    Sign convention: Positive when the sensor signal terminal is at higher electric
    potential than the designated electronics reference or return terminal.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:temperature_of_neutron_detector
  - name:voltage_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/temperature_sensor/amplitude
    dd_path: neutron_diagnostic/detector/temperature_sensor/amplitude
    status: composed
  - id: dd:neutron_diagnostic/detectors/temperature_sensor/amplitude
    dd_path: neutron_diagnostic/detectors/temperature_sensor/amplitude
    status: attached
- name: volume_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Physical volume occupied by the converter material in a neutron detector.
    It excludes inactive supports, housings, and voids unless they are part of the
    neutron-converting medium.
  documentation: 'Converter volume is the physical volume occupied by material that
    produces the detectable secondary signal from incident neutrons, such as a gas
    fill, scintillator, fission deposit, or neutron-converting coating. It is a geometrical
    property of the active converter medium, distinct from its nuclear number density
    or reaction rate per unit volume.


    The converter volume is defined by integrating over the region occupied by the
    active converter material:


    $$

    V_\mathrm{conv} = \int_{\Omega_\mathrm{conv}} d^3x

    $$


    where $\Omega_\mathrm{conv}$ is the physical region containing converter material
    and $d^3x$ is the local volume element.


    In practice, $V_\mathrm{conv}$ is obtained from the detector geometry: the measured
    or specified dimensions of gas cells, scintillator blocks, converter foils, coatings,
    or deposits. For segmented or multilayer converters, the total volume is the sum
    over active converter regions; for porous, patterned, or partially filled media,
    only the fraction actually occupied by converter material is included. For thin
    coatings, the volume is often computed as active coated area times effective converter
    thickness.


    Representative values are highly detector-dependent: thin fission or boron/lithium
    coatings can be about $10^{-11}$-$10^{-7}$ m$^3$, compact solid scintillator converters
    about $10^{-7}$-$10^{-4}$ m$^3$, and gas-filled converter regions about $10^{-5}$-$10^{-2}$
    m$^3$. The detection probability also depends on the [nuclear number density](name:nuclear_density_of_neutron_detector_converter)
    and microscopic cross sections, while the local conversion rate is represented
    by the [nuclear reaction rate per unit volume](name:nuclear_rate_of_neutron_detector_converter).'
  unit: m^3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:nuclear_rate_of_neutron_detector_converter
  - name:neutron_flux_of_neutron_detector_converter
  - name:surface_area_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_volume
    dd_path: neutron_diagnostic/detectors/radiation/converter_volume
    status: composed
- name: xenon_density
  kind: scalar
  status: draft
  description: Number density of xenon ions at a given point in the plasma, summed
    over all ionization states from singly ionized through fully stripped xenon, excluding
    neutral xenon atoms.
  documentation: 'Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe}
    = 54$) introduced into fusion plasmas for radiative-mantle experiments, impurity-transport
    studies, and disruption mitigation. The xenon ion number density $n_\mathrm{Xe}$
    quantifies the local concentration of all charged xenon species and enters the
    plasma effective charge through $Z_\mathrm{eff} = \sum_i Z_i^2 n_i / n_e$, where
    $n_i$ is the partial density of ion species $i$ and $n_e$ is the electron density.


    The total xenon ion density is the sum over all ionic charge states:


    $$

    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}

    $$


    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions carrying
    charge $ze$. The charge-state distribution is determined by coronal equilibrium
    or collisional-radiative modeling at the local electron temperature and density.


    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray line
    emission via spectroscopy and tomographic inversion, or from charge-exchange recombination
    spectroscopy using neutral-beam injection. Spatially resolved forms include [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)
    at the innermost flux surface and [xenon_density_at_pedestal](name:xenon_density_at_pedestal)
    in the edge transport barrier, while [volume_averaged_xenon_density](name:volume_averaged_xenon_density)
    provides the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by [xenon_fraction](name:xenon_fraction).


    Sign convention: Positive when ionized xenon is present in the plasma.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density_at_magnetic_axis
  - name:xenon_density_at_pedestal
  - name:volume_averaged_xenon_density
  - name:xenon_fraction
- name: line_averaged_xenon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of xenon ions along a chord through the
    plasma, obtained by dividing the path integral of the local xenon ion density
    by the chord length.
  documentation: "The line-averaged xenon ion number density is the chord-path mean\
    \ of the local [xenon_density](name:xenon_density), which sums all charged xenon\
    \ ionization states from Xe$^{1+}$ through Xe$^{54+}$, normalized by the measurement\
    \ chord length through the plasma.\n\nThe defining relation is:\n\n$$\n\\bar{n}_\\\
    mathrm{Xe} = \\frac{1}{L} \\int_0^L n_\\mathrm{Xe}(\\ell) \\, d\\ell\n$$\n\nwhere\
    \ $n_\\mathrm{Xe}(\\ell)$ is the local xenon ion number density at arc-length\
    \ position $\\ell$ along the chord and $L$ is the total chord length.\n\nThis\
    \ quantity is inferred from line-integrated emission diagnostics sensitive to\
    \ xenon spectral lines \u2014 including soft X-ray arrays and visible-range spectrometers\
    \ \u2014 combined with knowledge of the chord geometry. The [volume_averaged_xenon_density](name:volume_averaged_xenon_density)\
    \ provides the spatial mean over the full plasma volume, and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)\
    \ captures the on-axis value. The analogous chord-averaged quantity for argon\
    \ is documented as [line_averaged_argon_density](name:line_averaged_argon_density).\n\
    \nIn trace impurity transport experiments, xenon concentrations yield $\\bar{n}_\\\
    mathrm{Xe} \\sim 10^{14}$\u2013$10^{16}$ m$^{-3}$; during disruption-mitigation\
    \ massive gas injection or shattered-pellet scenarios, values can reach $10^{17}$\u2013\
    $10^{19}$ m$^{-3}$.\n\nSign convention: Positive when xenon ions are present along\
    \ the measurement chord."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density
  - name:volume_averaged_xenon_density
  - name:xenon_density_at_magnetic_axis
  - name:line_averaged_argon_density
  arguments:
  - name: xenon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/xenon/value
    dd_path: summary/line_average/n_i/xenon/value
    status: composed
- name: line_averaged_argon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of argon ions along a chord through the
    plasma, obtained by dividing the path integral of the local argon ion density
    by the chord length.
  documentation: 'Line-averaged argon density is the chord-averaged number density
    of argon ions along a line of sight through the plasma. The local argon ion density
    is understood as the sum over argon ionization stages, so the line average represents
    the effective argon ion content sampled by the chord.


    The line average is defined by normalizing the line-integrated density by the
    chord length through the plasma:


    $$

    \langle n_{\mathrm{Ar}} \rangle_L = \frac{1}{L}\int_{\mathrm{chord}} n_{\mathrm{Ar}}(l)\,dl

    $$


    where $l$ is distance along the chord in meters, $L$ is the chord length through
    the plasma in meters, and $n_{\mathrm{Ar}}(l)$ is the local argon ion number density
    in $m^{-3}$. The integral has units of $m^{-2}$, and division by $L$ gives a line-averaged
    density in $m^{-3}$.


    In practice this quantity is obtained by first converting calibrated diagnostic
    signals to an argon density line integral, using the appropriate atomic physics,
    instrument response, and plasma-parameter modeling for the measurement. Raw brightness,
    spectral intensity, or other chord-integrated signals are not themselves line-averaged
    density; they must be interpreted as or transformed into $\int n_{\mathrm{Ar}}
    dl$ before normalization by the effective chord length.


    Typical values are about $10^{14}-10^{16}\ m^{-3}$ for trace argon concentrations,
    $10^{16}-10^{18}\ m^{-3}$ during deliberate argon seeding or impurity transport
    studies, and can approach $10^{19}\ m^{-3}$ transiently during strong gas injection
    or disruption-mitigation scenarios.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:argon_density
  - name:volume_averaged_argon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_effective_charge
  sources:
  - id: dd:summary/line_average/n_i/argon/value
    dd_path: summary/line_average/n_i/argon/value
    status: composed
- name: line_averaged_deuterium_density
  kind: scalar
  status: draft
  description: Chord-average of the deuterium ion number density along a diagnostic
    line of sight, equal to the path integral of the local deuterium density divided
    by the chord length.
  documentation: 'The line-averaged deuterium ion number density gives the mean deuterium
    particle density along a diagnostic chord through the plasma, providing a chord-path-weighted
    scalar measure of absolute deuterium content distinct from the isotopic fraction
    described by [volume_averaged_deuterium_fraction](name:volume_averaged_deuterium_fraction).


    The quantity is defined as:


    $$

    \bar{n}_D = \frac{1}{L} \int_0^L n_D(\ell) \, d\ell

    $$


    where $n_D(\ell)$ is the local deuterium ion number density in m$^{-3}$ at chord
    position $\ell$ and $L$ is the total chord length in m.


    It is typically inferred from interferometric phase-shift measurements combined
    with isotope-resolved spectroscopy sensitive to deuterium Balmer emission. It
    complements the volume-based [volume_averaged_deuterium_density](name:volume_averaged_deuterium_density)
    and analogous chord-averaged fuel densities such as [line_averaged_hydrogen_density](name:line_averaged_hydrogen_density)
    for protium and [line_averaged_helium_4_density](name:line_averaged_helium_4_density)
    for helium-4.


    Typical values range from $5 \times 10^{18}$ to $5 \times 10^{20}$ m$^{-3}$ in
    tokamak deuterium plasmas, scaling with the line-averaged electron density and
    the deuterium fuel fraction of the isotopic mix.


    Sign convention: Positive when deuterium ions are present in the plasma along
    the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_deuterium_fraction
  - name:volume_averaged_deuterium_density
  - name:line_averaged_hydrogen_density
  - name:line_averaged_helium_4_density
  sources:
  - id: dd:summary/line_average/n_i/deuterium/value
    dd_path: summary/line_average/n_i/deuterium/value
    status: composed
- name: line_averaged_effective_charge
  kind: scalar
  status: draft
  description: Line-averaged effective ion charge Zeff of the plasma, obtained as
    the chord-path integral of the local effective charge divided by the chord length.
  documentation: "The line-averaged effective charge characterizes the mean impurity\
    \ content of the plasma as sampled along a diagnostic line of sight. The local\
    \ [effective charge](name:effective_charge) $Z_\\text{eff}$ is defined as $Z_\\\
    text{eff} = \\sum_i n_i Z_i^2 / n_e$, where $n_i$ is the number density of ion\
    \ species $i$, $Z_i$ is the integer charge number of species $i$, and $n_e$ is\
    \ the electron number density; deviations above unity indicate the presence of\
    \ impurity ions heavier than hydrogen.\n\nThe line average integrates the local\
    \ effective charge along a chord of length $L$:\n\n$$\n\\langle Z_\\text{eff}\
    \ \\rangle_L = \\frac{1}{L} \\int_0^L Z_\\text{eff}(l) \\, dl\n$$\n\nwhere $l$\
    \ is the coordinate along the chord.\n\nThis quantity is inferred from visible\
    \ or near-ultraviolet bremsstrahlung continuum emission along a chord, whose emissivity\
    \ scales as $\\varepsilon \\propto n_e^2 Z_\\text{eff} T_e^{-1/2}$, where $T_e$\
    \ is the electron temperature; combining this signal with a simultaneous line-integrated\
    \ electron density measurement yields $\\langle Z_\\text{eff} \\rangle_L$ without\
    \ requiring assumed spatial profile shapes. In a pure deuterium plasma $Z_\\text{eff}\
    \ = 1$; with typical light impurity content in reactor-relevant tokamak operation\
    \ values of 1.5\u20133 are common, while heavy impurity seeding scenarios can\
    \ yield values of 4\u20136. This chord-averaged quantity complements [volume_averaged_effective_charge](name:volume_averaged_effective_charge),\
    \ which weights by the full plasma volume, and differs from [effective_charge_at_limiter](name:effective_charge_at_limiter),\
    \ which is a boundary-localized evaluation.\n\nSign convention: Positive for any\
    \ plasma with nonzero electron density, since $Z_\\text{eff}$ equals the ratio\
    \ of the charge-weighted ion density second moment to $n_e$, both of which are\
    \ positive-definite quantities."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:effective_charge
  - name:volume_averaged_effective_charge
  - name:effective_charge_at_limiter
  sources:
  - id: dd:summary/line_average/zeff/value
    dd_path: summary/line_average/zeff/value
    status: composed
- name: line_averaged_hydrogen_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the hydrogen ion number density over a specified
    chord through the plasma. It represents the path-length-normalized hydrogen ion
    content, not neutral hydrogen density and not electron density.
  documentation: 'Line-averaged hydrogen density is the path-length average of the
    local hydrogen ion number density along a chosen chord through the plasma. Hydrogen
    density here denotes the density of hydrogen ions, excluding neutral hydrogen
    atoms and excluding electrons.


    For a chord $C$ of averaging length $L$, the line average is defined by


    $$

    \langle n_\mathrm{H} \rangle_C = \frac{1}{L}\int_C n_\mathrm{H}(l)\,dl

    $$


    where $n_\mathrm{H}(l)$ is the local hydrogen ion number density at path-length
    coordinate $l$, and $L = \int_C dl$ is the chord length over which the average
    is taken.


    This quantity is generally inferred from a combination of constraints rather than
    measured directly by interferometric phase shift alone. Interferometry primarily
    constrains line-integrated electron density; hydrogen ion density is separated
    from electron density using quasineutrality together with composition information
    from spectroscopy, charge-exchange measurements, impurity modeling, particle balance,
    or transport analysis. In a nearly pure singly ionized hydrogen plasma it can
    be close to the line-averaged electron density, while impurity dilution, multiple
    ion species, and neutral populations make the hydrogen ion density distinct.


    Typical line-averaged hydrogen ion densities in magnetically confined plasmas
    range from $10^{18}$-$10^{20}\ \mathrm{m^{-3}}$, with lower values in weakly fueled
    or edge-dominated conditions and higher values in high-density core plasmas.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:hydrogen_density
  - name:volume_averaged_hydrogen_density
  - name:line_averaged_deuterium_density
  - name:hydrogen_fraction
  sources:
  - id: dd:summary/line_average/n_i/hydrogen/value
    dd_path: summary/line_average/n_i/hydrogen/value
    status: composed
- name: line_averaged_iron_density
  kind: scalar
  status: draft
  description: Chord-average of the iron impurity ion number density, equal to the
    path integral of the local iron density divided by the chord length, summed over
    all ionization states.
  documentation: 'The line-averaged iron density $\bar{n}_\mathrm{Fe}$ is the path-length-weighted
    average of the local iron impurity ion number density along a diagnostic chord,
    covering all ionization states from singly ionized to fully stripped iron. It
    provides a spatially integrated measure of iron contamination that is directly
    accessible to line-integrated spectroscopic diagnostics without requiring tomographic
    inversion of a local profile.


    The quantity is defined as:


    $$

    \bar{n}_\mathrm{Fe} = \frac{1}{L} \int_0^L n_\mathrm{Fe}(l) \, dl

    $$


    where $l$ is the coordinate along the line of sight and $L$ is the total chord
    length traversing the plasma. This chord average relates directly to the parent
    local quantity [iron_density](name:iron_density), which gives the volumetric concentration
    at each spatial point. In contrast, [volume_averaged_iron_density](name:volume_averaged_iron_density)
    weights contributions by plasma volume element rather than by chord path length.


    Iron enters magnetically confined plasmas primarily through sputtering and erosion
    of plasma-facing components, and elevated concentrations lead to significant radiative
    power losses. The line-averaged value is inferred from passive spectroscopy of
    iron line emission in the visible or vacuum ultraviolet range combined with ionization
    equilibrium modeling, or from impurity charge exchange spectroscopy on selected
    iron charge states. Typical line-averaged values range from $10^{14}$ to $10^{17}$
    m$^{-3}$ depending on iron source strength, impurity transport, and plasma conditions.
    The [iron_fraction](name:iron_fraction) provides a related dimensionless indicator
    of iron contamination normalized to electron density, while [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)
    is a sibling quantity measured by the same chord-averaging technique for a lighter
    impurity species.


    Sign convention: Positive when iron ions are present along the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:iron_density
  - name:volume_averaged_iron_density
  - name:iron_fraction
  - name:line_averaged_nitrogen_density
  sources:
  - id: dd:summary/line_average/n_i/iron/value
    dd_path: summary/line_average/n_i/iron/value
    status: composed
- name: line_averaged_tritium_density
  kind: scalar
  status: draft
  description: Tritium ion number density averaged along a measurement chord, computed
    as the path integral of local tritium density divided by the chord length.
  documentation: 'Line-averaged tritium density is the chord average of the local
    tritium ion number density through a plasma. It gives a path-weighted measure
    of the tritium fuel-species content along the chosen sight line, without resolving
    variation along that line.


    For a chord parameterized by path length $\ell$, the line average is defined by:


    $$

    \langle n_T \rangle_L = \frac{1}{L}\int_0^L n_T(\ell)\,d\ell

    $$


    where $n_T(\ell)$ is the local tritium ion number density in $\mathrm{m}^{-3}$,
    $\ell$ is distance along the chord in meters, $L$ is the chord length in meters,
    and $\langle n_T \rangle_L$ is in $\mathrm{m}^{-3}$.


    In practice, this quantity may be obtained by combining line-integrated density
    information with independent constraints on isotope composition; the diagnostic
    combination depends on plasma conditions and available measurements. It is conceptually
    analogous to [line_averaged_electron_density](name:line_averaged_electron_density),
    but refers only to tritium ions rather than all electrons.


    Typical values in deuterium-tritium plasmas are about $0.1-8 \times 10^{19}\ \mathrm{m}^{-3}$,
    depending on total fuel density, tritium fraction, chord geometry, and radial
    density variation. The value is non-negative and is zero for a chord containing
    no tritium ions. For related tritium-density measures, compare with [volume_averaged_tritium_density](name:volume_averaged_tritium_density)
    and [tritium_density_at_magnetic_axis](name:tritium_density_at_magnetic_axis).'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_tritium_density
  - name:tritium_density_at_magnetic_axis
  - name:line_averaged_deuterium_density
  - name:line_averaged_helium_3_density
  sources:
  - id: dd:summary/line_average/n_i/tritium/value
    dd_path: summary/line_average/n_i/tritium/value
