- name: ion_state_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Diamagnetic drift velocity of an ion species in a specific charge state,
    resulting from the pressure gradient perpendicular to the magnetic field direction.
    This quantity is a scalar magnitude defined per charge state, independent of the
    storage representation.
  documentation: 'The diamagnetic drift velocity for an ion species in a particular
    charge state is given by $\mathbf{v}_{\mathrm{dia},z} = \frac{\nabla p_{z} \times
    \mathbf{B}}{n_z q_z B^2}$, where $p_z$ is the pressure of ions in charge state
    $z$, $n_z$ is their density, $q_z = z e$ is their charge, and $\mathbf{B}$ is
    the magnetic field. In a fluid description, this drift arises from the balance
    of the pressure gradient and the Lorentz force and does not directly transport
    particles across flux surfaces in the absence of collisions or parallel dynamics.
    Typical diamagnetic drift speeds in the edge and scrape-off layer range from $10^2$
    to $10^5$ m/s, depending on the local pressure gradient and magnetic field strength.
    The magnitude is measured in the rest frame of the bulk plasma.


    Sign convention: Positive when the local pressure gradient points radially inward
    (i.e., $\partial p_z / \partial R > 0$) and the magnetic field is in the $+\phi$
    direction, consistent with the right-handed cylindrical $(R,\phi,Z)$ basis.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_diamagnetic_velocity
  - name:neutral_state_velocity_due_to_diamagnetic_drift
  sources:
  - id: dd:edge_profiles/ggd/ion/state/velocity_diamagnetic/diamagnetic
    dd_path: edge_profiles/ggd/ion/state/velocity_diamagnetic/diamagnetic
    status: composed
- name: iron_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of iron impurity ions at the pedestal location in the
    plasma edge.
  documentation: "The iron impurity ion density at the pedestal characterizes the\
    \ concentration of sputtered or injected iron atoms in the steep-gradient edge\
    \ transport barrier. In tokamak plasmas, iron is a common high-Z impurity originating\
    \ from plasma-facing components; its accumulation at the pedestal increases radiative\
    \ losses and can degrade confinement through fuel dilution. The density is measured\
    \ via spectroscopic line ratios (e.g., from extreme ultraviolet spectroscopy)\
    \ or inferred from filtered soft X-ray tomography, with typical pedestal values\
    \ in the range of $10^{15}$\u2013$10^{17}$ m$^{-3}$ for medium-size devices. Spatial\
    \ profiles of this quantity are closely linked to [iron density at the separatrix](name:iron_density_at_separatrix)\
    \ and the pedestal transport modeled via neoclassical and anomalous impurity fluxes.\
    \ The pedestal iron density also directly impacts the core impurity dynamics described\
    \ by [iron density at the magnetic axis](name:iron_density_at_magnetic_axis).\n\
    \nSign convention: Positive when the local iron impurity ion concentration exceeds\
    \ zero, as physically required for a number density.\n\nThe iron density is a\
    \ positive-definite scalar quantity and carries no sign reversal under the standard\
    \ IMAS coordinate conventions; the sign convention is stated for completeness."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_separatrix
  - name:iron_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/pedestal/n_i/iron/value
    dd_path: summary/local/pedestal/n_i/iron/value
    status: composed
- name: magnetic_shear_at_pedestal
  kind: scalar
  status: draft
  description: Magnetic shear at the top of the pedestal region, quantifying the local
    radial variation of the safety factor.
  documentation: "The magnetic shear $s = (\\rho_\\mathrm{tor}/q)\\,dq/d\\rho_\\mathrm{tor}$\
    \ is evaluated at the pedestal top, where $\\rho_\\mathrm{tor}$ is the normalized\
    \ toroidal flux radius and $q$ is the safety factor. This dimensionless parameter\
    \ governs the local pitch-angle variation of magnetic field lines and is a critical\
    \ stability parameter for edge-localized modes (ELMs) via the peeling-ballooning\
    \ model. The pedestal magnetic shear is typically in the range $s \\approx 1$\u2013\
    $3$ in H-mode tokamak plasmas, with values inferred from equilibrium reconstruction\
    \ constrained by profile and magnetic measurements. Positive magnetic shear ($s\
    \ > 0$) corresponds to the safety factor increasing with radius, which is the\
    \ usual monotonic $q$-profile case in tokamaks; negative shear ($s < 0$) indicates\
    \ a non-monotonic $q$-profile with a reversed central region. See also [magnetic_shear](name:magnetic_shear)\
    \ for the radial profile, [magnetic_shear_at_separatrix](name:magnetic_shear_at_separatrix)\
    \ for the value at the last closed flux surface, and [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis)\
    \ for the core value.\n\nSign convention: Positive when the safety factor increases\
    \ with increasing radial coordinate (normal monotonic $q$-profile)."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear
  - name:magnetic_shear_at_separatrix
  - name:magnetic_shear_at_magnetic_axis
  sources:
  - id: dd:summary/local/pedestal/magnetic_shear/value
    dd_path: summary/local/pedestal/magnetic_shear/value
    status: composed
- name: neutral_state_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Drift velocity of neutral particles in a specific charge state driven
    by the diamagnetic current arising from the perpendicular pressure gradient.
  documentation: 'The diamagnetic drift velocity $\mathbf{v}_{\mathrm{dia}} = (\mathbf{B}
    \times \nabla p) / (q n B^2)$ arises from the pressure gradient perpendicular
    to the magnetic field when the gyroradius is finite, even for neutral species
    coupled to the plasma via charge-exchange or ionization collisions. Here $p$ is
    the neutral partial pressure, $n$ the neutral density, $q$ the effective charge,
    and $B$ the magnetic field magnitude. This quantity is the magnitude of the diamagnetic
    drift for neutral particles in a specified charge state, computed on the generalized
    Gaussian decomposition (GGD) grid in the edge plasma. Typical drift velocities
    range from 0.1 to 10 km/s in the scrape-off layer and pedestal, depending on the
    local pressure gradient and magnetic field strength. It is distinct from the [radial_neutral_velocity_due_to_diamagnetic_drift](name:radial_neutral_velocity_due_to_diamagnetic_drift)
    which isolates the radial component, and from the [ion_state_velocity_due_to_diamagnetic_drift](name:ion_state_velocity_due_to_diamagnetic_drift)
    for charged species. The sign convention follows the diamagnetic drift direction
    relative to the magnetic field gradient.


    Sign convention: Positive when the drift velocity points in the direction of $\mathbf{B}
    \times \nabla p$.


    In the edge plasma, this drift contributes to the radial transport of neutral
    particles and affects the fueling efficiency, neutral penetration depth, and the
    overall particle balance. It is typically inferred from kinetic neutral transport
    codes (e.g., EIRENE) or from fluid models that solve the neutral momentum equation
    including diamagnetic effects.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_neutral_velocity_due_to_diamagnetic_drift
  - name:ion_state_velocity_due_to_diamagnetic_drift
  sources:
  - id: dd:edge_profiles/ggd/neutral/state/velocity_diamagnetic/diamagnetic
    dd_path: edge_profiles/ggd/neutral/state/velocity_diamagnetic/diamagnetic
    status: composed
- name: normalized_poloidal_flux_coordinate_at_pedestal
  kind: scalar
  status: draft
  description: Normalized poloidal flux coordinate at the top of the pedestal region,
    marking the radial position of the steep gradient zone onset.
  documentation: "The normalized poloidal flux coordinate $\rho_{\\mathrm{tor,norm}}$\
    \ at the pedestal top (the radial location where the edge density and temperature\
    \ gradients steepen into the H-mode pedestal) is defined as $\rho_{\\mathrm{tor,norm}}\
    \ = \\sqrt{\\Phi_{\\mathrm{tor}} / \\Phi_{\\mathrm{tor,LCFS}}}$, where $\\Phi_{\\\
    mathrm{tor}}$ is the toroidal magnetic flux and $\\Phi_{\\mathrm{tor,LCFS}}$ is\
    \ the flux at the last closed flux surface. This dimensionless radial marker typically\
    \ falls in the range 0.92\u20130.98 in conventional H-mode tokamaks and is routinely\
    \ determined from equilibrium reconstruction codes such as EFIT or LIUQE. The\
    \ pedestal top position, where $\rho_{\\mathrm{tor,norm}}$ is evaluated, is the\
    \ outermost region of steep gradient that governs edge transport and core-confinement\
    \ coupling, and is cross-referenced with [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal)\
    \ to characterize stability limits.\n\nSign convention: Positive when $\rho_{\\\
    mathrm{tor,norm}}$ increases from the magnetic axis ($\\rho_{\\mathrm{tor,norm}}\
    \ = 0$) toward the last closed flux surface ($\\rho_{\\mathrm{tor,norm}} = 1$)."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/position/rho_tor_norm
    dd_path: summary/local/pedestal/position/rho_tor_norm
    status: composed
  - id: dd:summary/local/separatrix/position/rho_tor
    dd_path: summary/local/separatrix/position/rho_tor
    status: composed
- name: parallel_current_density_due_to_ohmic
  kind: scalar
  status: draft
  description: Flux-surface-averaged component of the ohmic current density parallel
    to the magnetic field, representing the inductive current driven by the toroidal
    electric field and limited by plasma resistivity.
  documentation: "The ohmic parallel current density $j_{\\parallel,\\mathrm{ohmic}}$\
    \ is defined as the flux-surface average $j_{\\parallel,\\mathrm{ohmic}} = \\\
    langle \\mathbf{J}_{\\mathrm{ohmic}} \\cdot \\mathbf{B} \\rangle / B_0$, where\
    \ $\\mathbf{J}_{\\mathrm{ohmic}}$ is the ohmic current density vector, $\\mathbf{B}$\
    \ is the total magnetic field, $B_0$ is the flux-surface-averaged magnetic field\
    \ magnitude, and $\\langle \\cdot \\rangle$ denotes the flux-surface average.\
    \ This quantity represents the inductive component of the parallel current density,\
    \ driven by the toroidal electric field via Ohm's law and limited by the plasma\
    \ resistivity (Spitzer or neoclassical). In tokamak H-mode plasmas, the ohmic\
    \ current density typically peaks in the core (order 0.1\u20131 MA/m\xB2) and\
    \ decreases towards the edge, where it becomes small compared to the bootstrap\
    \ current. This value range is consistent with typical JET and DIII-D H-mode discharges.\
    \ It is a critical input for current-drive calculations, resistive MHD stability\
    \ analysis, and sawtooth modeling.\n\nSign convention: Positive when the ohmic\
    \ current flows in the direction of increasing toroidal angle $\\phi$ aligned\
    \ with the plasma current.\n\nMeasured indirectly from equilibrium reconstruction\
    \ (e.g., EFIT) combined with resistivity profiles, or from polarimetry and MSE\
    \ diagnostic data. Typical uncertainties are 10\u201320% depending on diagnostic\
    \ constraints. In the scrape-off layer, the ohmic parallel current dominates and\
    \ determines the divertor heat-flux width."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:non_inductive_current_density
  - name:current_density_due_to_ohmic
  arguments:
  - name: current_density_due_to_ohmic
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_profiles/profiles_1d/j_ohmic
    dd_path: edge_profiles/profiles_1d/j_ohmic
    status: composed
- name: parallel_fast_ion_state_pressure
  kind: scalar
  status: draft
  description: The component of the fast ion pressure tensor parallel to the local
    magnetic field for a specific charge state.
  documentation: "The parallel fast ion state pressure $p_{ \\parallel , f, z}$ is\
    \ the field-aligned element of the anisotropic pressure tensor for suprathermal\
    \ ions in a given charge state $z$. It arises from the parallel kinetic energy\
    \ of the fast-ion population and contributes to the total pressure balance via\
    \ $p_{f,z} = (p_{\\parallel ,f,z} + 2p_{\\perp ,f,z})/3$. In the edge plasma,\
    \ this quantity is typically derived from neutral-beam or ICRH fast-ion distributions,\
    \ with core values reaching tens of kilopascals. Measurement combines neutron\
    \ spectrometry, fast-ion D-alpha (FIDA) diagnostics, and equilibrium reconstruction.\
    \ The parent quantity is [fast_ion_state_pressure](name:fast_ion_state_pressure),\
    \ which is the isotropic (kinetic) pressure for that charge state. The perpendicular\
    \ counterpart is the parallel pressure contribution from fast electrons [parallel_fast_electron_pressure](name:parallel_fast_electron_pressure).\
    \ The parallel and perpendicular components quantify the pressure anisotropy of\
    \ suprathermal populations.\n\nSign convention: Positive when the field-aligned\
    \ component of the pressure tensor acts to expand the plasma along the magnetic\
    \ field direction.\n\nTypical values in H-mode tokamak pedestals range from 1\u2013\
    10 kPa for beam-injected fast ions, diminishing with charge state due to confinement\
    \ and slowing-down. The parallel component can exceed the perpendicular in strongly\
    \ anisotropic distributions (e.g., co-injected beam ions)."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:fast_ion_state_pressure
  - name:parallel_fast_electron_pressure
  arguments:
  - name: fast_ion_state_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
