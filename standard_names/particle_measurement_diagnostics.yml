- name: vertical_coordinate_of_neutron_detector
  kind: scalar
  status: draft
  description: Vertical height coordinate Z of a neutron detector in the right-handed
    cylindrical (R, phi, Z) frame, measured from the horizontal midplane of the machine.
  documentation: 'The vertical coordinate $Z$ specifies the position of a neutron
    detector along the machine symmetry axis in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius measured from the toroidal symmetry
    axis, $\phi$ is the toroidal angle, and $Z$ is the vertical height measured from
    the geometric midplane.


    Together with the [major-radius coordinate], this quantity fully locates the detector
    in the poloidal cross-section, determining the chord geometry through the plasma
    and the emission region sampled. The transverse aperture dimensions are separately
    characterized by [width_of_neutron_detector](name:width_of_neutron_detector) and
    [height_of_neutron_detector](name:height_of_neutron_detector).


    The coordinate is established from engineering survey data or design drawings
    of the diagnostic port geometry and enters the line-of-sight integrals used in
    neutron emission tomography and absolute neutron yield calibration. The same vertical-coordinate
    convention is applied to [vertical_coordinate_of_bolometer](name:vertical_coordinate_of_bolometer)
    and [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector),
    ensuring geometric consistency across diagnostic systems. Typical $Z$ values range
    from approximately $-2$ m to $+2$ m in medium-sized tokamaks, depending on machine
    height and port allocation.


    Sign convention: Positive when the detector is located above the geometric midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:width_of_neutron_detector
  - name:height_of_neutron_detector
  - name:vertical_coordinate_of_bolometer
  - name:vertical_coordinate_of_neutral_beam_injector
  sources:
  - id: dd:neutron_diagnostic/detectors/position/z
    dd_path: neutron_diagnostic/detectors/position/z
    status: composed
- name: voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Instantaneous or sampled raw electrical output voltage of a neutron
    detector module, measured relative to its electronics reference or baseline before
    pulse extraction, filtering, calibration, or conversion to neutron rate.
  documentation: 'Voltage of a neutron detector is the signed electrical potential
    difference produced at the detector output at a specified instant or sample of
    the raw waveform. It represents the direct analog signal relative to an electronics
    reference level or baseline, not a calibrated neutron flux, count rate, pulse
    height, or integrated charge.


    For an output node with electric potential $\Phi_\mathrm{out}(t)$ and a reference
    or baseline potential $\Phi_\mathrm{ref}(t)$, the raw detector voltage is defined
    by:


    $$

    V_\mathrm{raw}(t) = \Phi_\mathrm{out}(t) - \Phi_\mathrm{ref}(t)

    $$


    where $t$ is the sampling time, $\Phi_\mathrm{out}$ is the detector or front-end
    electronics output potential, and $\Phi_\mathrm{ref}$ is the chosen electronics
    ground, bias reference, or estimated baseline.


    In practice this quantity is obtained from the uncalibrated detector readout before
    pulse finding, shaping correction, pile-up rejection, energy calibration, efficiency
    correction, or conversion to neutron rate. For pulsed detectors it is the waveform
    sample value; derived quantities such as pulse maximum, pulse integral, or discriminator
    counts should be treated separately.


    Typical raw amplitudes range from 1e-3-10 V depending on detector type, biasing,
    preamplifier gain, termination, and neutron intensity. Baseline fluctuations and
    electronic noise are often in the 1e-4-1e-2 V range, while large pulses may approach
    the dynamic range or saturation limit of the acquisition electronics.


    Sign convention: Positive when the detector output potential is above the chosen
    electronics reference or baseline potential.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:peak_voltage_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/amplitude_raw
    dd_path: neutron_diagnostic/detectors/amplitude_raw
    status: composed
- name: peak_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Peak voltage of a neutron detector is the baseline-referenced pulse
    height of the processed detector signal, evaluated at the pulse extremum after
    applying the channel pulse-polarity convention. It represents the voltage amplitude
    assigned to an individual detector response.
  documentation: 'Peak voltage of a neutron detector is the pulse height assigned
    to the processed voltage waveform from a detector module. It is referenced to
    the local pre-pulse baseline and uses the channel pulse-polarity convention, so
    it is not simply the raw algebraic maximum of the unprocessed waveform or an absolute
    value over the full record.


    For a pulse-search window, the baseline-referenced peak voltage can be written
    as the maximum polarity-corrected excursion:


    $$

    V_{\mathrm{peak}} = \max_{t \in W}\left[p\left(V_{\mathrm{proc}}(t)-V_{\mathrm{base}}\right)\right]

    $$


    where $V_{\mathrm{peak}}$, $V_{\mathrm{proc}}(t)$, and $V_{\mathrm{base}}$ are
    in volts, $W$ is the time window associated with the pulse, and $p$ is the pulse-polarity
    factor: $p=+1$ for positive-going processed pulses and $p=-1$ for negative-going
    processed pulses.


    In practice, the digitized detector output is conditioned by shaping, filtering,
    or other signal-processing steps before the peak is found. The baseline is usually
    estimated from pre-pulse samples or a nearby quiet interval, and pulse pileup,
    saturation, and electronic noise determine whether the extracted peak is reliable.
    This quantity is distinct from the instantaneous [detector voltage](name:voltage_of_neutron_detector),
    which denotes the voltage signal itself before the peak-height reduction.


    Representative processed pulse heights are strongly instrument-dependent, but
    neutron detector electronics commonly report values from about 0.001-5 V for resolved
    pulses. Values near the noise floor are threshold-dependent, while values approaching
    the acquisition full scale may indicate saturation rather than a proportional
    neutron response.


    Sign convention: Positive when the pulse excursion is in the channel''s configured
    pulse-polarity direction relative to the local baseline; for a positive-going
    channel this means the processed voltage at the pulse peak exceeds the baseline,
    and for a negative-going channel it means it is below the baseline before polarity
    correction.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:voltage_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  - name:requested_upper_voltage_of_neutron_detector
  arguments:
  - name: voltage_of_neutron_detector
    operator: peak
    operator_kind: qualifier
  sources:
  - id: dd:neutron_diagnostic/detectors/amplitude_peak
    dd_path: neutron_diagnostic/detectors/amplitude_peak
    status: composed
- name: voltage_of_temperature_sensor
  kind: scalar
  status: draft
  description: Electrical potential difference output by a temperature sensor that
    monitors the thermal environment of a neutron detector module. It is the sensor
    signal measured relative to a designated electronics reference, normally before
    conversion to calibrated temperature.
  documentation: 'Voltage of a temperature sensor is the electrical potential difference
    generated by, or produced from, the sensor element and read by the acquisition
    electronics as the thermal-monitor signal for a neutron detector module. It is
    an electrical signal in volts, not a temperature; conversion to detector or sensor
    temperature requires the applicable calibration, baseline, and electronics gain
    information.


    The temperature calibration is commonly represented as a mapping from the corrected
    sensor voltage:


    $$

    T_s = f_\mathrm{cal}\!\left(\frac{V_s - V_0}{G}\right)

    $$


    where $T_s$ is the inferred sensor temperature, $V_s$ is this measured voltage,
    $V_0$ is the voltage offset or baseline associated with the reference condition
    and readout chain, $G$ is the dimensionless electronics gain, and $f_\mathrm{cal}$
    is the calibration function for the sensor type. For a locally linear calibration,
    the sensitivity $S_T = dV/dT$ has units of V/K and is distinct from the voltage
    value $V_s$ itself.


    In practice the voltage is obtained by digitizing the potential difference between
    the sensor signal terminal and the electronics reference or return terminal. The
    sensor may be a thermocouple, resistance thermometer, thermistor, or integrated
    temperature monitor, with appropriate excitation, cold-junction compensation,
    amplification, filtering, and offset correction applied according to the measurement
    chain.


    Typical recorded voltages depend strongly on sensor type and conditioning. Unamplified
    thermocouple signals are commonly in the $10^{-4}$-$10^{-2}$ V range over practical
    temperature excursions, with sensitivities of order $10^{-5}$-$10^{-4}$ V/K; conditioned
    resistive or semiconductor temperature channels are often scaled to about $0$-$5$
    V or $-10$-$10$ V. These voltage ranges should not be interpreted as temperature
    sensitivities unless a calibration slope in V/K is specified.


    Sign convention: Positive when the sensor signal terminal is at higher electric
    potential than the designated electronics reference or return terminal.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:temperature_of_neutron_detector
  - name:voltage_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/temperature_sensor/amplitude
    dd_path: neutron_diagnostic/detector/temperature_sensor/amplitude
    status: composed
  - id: dd:neutron_diagnostic/detectors/temperature_sensor/amplitude
    dd_path: neutron_diagnostic/detectors/temperature_sensor/amplitude
    status: attached
- name: volume_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Physical volume occupied by the converter material in a neutron detector.
    It excludes inactive supports, housings, and voids unless they are part of the
    neutron-converting medium.
  documentation: 'Converter volume is the physical volume occupied by material that
    produces the detectable secondary signal from incident neutrons, such as a gas
    fill, scintillator, fission deposit, or neutron-converting coating. It is a geometrical
    property of the active converter medium, distinct from its nuclear number density
    or reaction rate per unit volume.


    The converter volume is defined by integrating over the region occupied by the
    active converter material:


    $$

    V_\mathrm{conv} = \int_{\Omega_\mathrm{conv}} d^3x

    $$


    where $\Omega_\mathrm{conv}$ is the physical region containing converter material
    and $d^3x$ is the local volume element.


    In practice, $V_\mathrm{conv}$ is obtained from the detector geometry: the measured
    or specified dimensions of gas cells, scintillator blocks, converter foils, coatings,
    or deposits. For segmented or multilayer converters, the total volume is the sum
    over active converter regions; for porous, patterned, or partially filled media,
    only the fraction actually occupied by converter material is included. For thin
    coatings, the volume is often computed as active coated area times effective converter
    thickness.


    Representative values are highly detector-dependent: thin fission or boron/lithium
    coatings can be about $10^{-11}$-$10^{-7}$ m$^3$, compact solid scintillator converters
    about $10^{-7}$-$10^{-4}$ m$^3$, and gas-filled converter regions about $10^{-5}$-$10^{-2}$
    m$^3$. The detection probability also depends on the [nuclear number density](name:nuclear_density_of_neutron_detector_converter)
    and microscopic cross sections, while the local conversion rate is represented
    by the [nuclear reaction rate per unit volume](name:nuclear_rate_of_neutron_detector_converter).'
  unit: m^3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:nuclear_rate_of_neutron_detector_converter
  - name:neutron_flux_of_neutron_detector_converter
  - name:surface_area_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_volume
    dd_path: neutron_diagnostic/detectors/radiation/converter_volume
    status: composed
- name: wave_beam_energy
  kind: scalar
  status: draft
  description: Total electromagnetic energy carried by a coherent wave-beam pulse
    through a specified transverse beam cross-section at a specified position along
    its propagation path. It is the time integral of the instantaneous beam power
    at that location over the pulse duration.
  documentation: 'Wave-beam energy is the electromagnetic pulse energy transported
    by a coherent beam through a chosen transverse surface at a specified location
    along the beam path. It is a pulse-integrated quantity in joules, distinct from
    instantaneous or time-averaged beam power in watts. Because absorption, scattering,
    reflection, or optical losses can change the beam energy along the path, the location
    of the evaluated cross-section is part of the physical definition.


    For a pulse crossing a transverse surface labeled by path position $s$, the beam
    energy is defined by the time integral of the instantaneous beam power through
    that surface:


    $$

    E_\mathrm{beam}(s) = \int_{t_1}^{t_2} P_\mathrm{beam}(s,t)\,dt

    $$


    where $P_\mathrm{beam}(s,t)$ is the electromagnetic power crossing the specified
    surface, $t_1$ and $t_2$ bound the pulse, and $s$ labels position along the beam
    centerline. Energy in joules equals power in watts integrated over time, so this
    quantity should not be confused with absorbed or deposited power, which describes
    a rate of energy transfer.


    In practice, wave-beam energy is measured with calibrated energy meters, photodiodes
    combined with pulse-shape calibration, calorimeters, or inferred from independently
    calibrated optical diagnostics. Comparing energies at two positions gives the
    pulse transmission $T = E_\mathrm{out}/E_\mathrm{in}$, while the energy loss $E_\mathrm{in}-E_\mathrm{out}$
    may include plasma absorption, scattering, reflection, aperture clipping, and
    optical attenuation.


    Typical values depend strongly on the diagnostic and source technology. Thomson-scattering
    laser pulses commonly carry about 0.1-10 J per pulse, while smaller alignment
    or probe beams may be in the 10^-6-10^-2 J range and high-energy pulsed laser
    systems can exceed 10 J.'
  unit: J
  physics_domain: particle_measurement_diagnostics
  links:
  - name:wave_beam_energy_at_launching_position
  - name:ion_state_absorbed_power_of_beam_tracing_beam
  sources:
  - id: dd:thomson_scattering/laser/energy_out
    dd_path: thomson_scattering/laser/energy_out
    status: composed
- name: wave_beam_energy_at_launching_position
  kind: scalar
  status: draft
  description: Energy carried by a wave beam pulse at the position where it is launched
    into the experimental region, before interaction with the plasma or other target
    medium. It is the incident pulse energy at that reference position.
  documentation: 'Wave-beam energy at launching position is the total electromagnetic
    energy carried by a single launched wave-beam pulse at the launch reference position,
    before absorption, scattering, or other interaction in the experimental region.
    It is a nonnegative pulse-integrated quantity and is the launch-position specialization
    of [wave_beam_energy](name:wave_beam_energy).


    The launch-position pulse energy is the time integral of the beam power crossing
    the launch reference surface during the pulse:


    $$

    E_\mathrm{in} = \int_{t_1}^{t_2} P_\mathrm{in}(t)\,dt

    $$


    where $E_\mathrm{in}$ is the launch-position energy in joules, $P_\mathrm{in}(t)$
    is the instantaneous beam power in watts at that position, and $t_1$ and $t_2$
    are the pulse start and end times in seconds. If the beam is described by an intensity
    distribution, $P_\mathrm{in}(t)$ is the area integral of that intensity over the
    beam cross-section at the launch reference surface.


    In practice, the quantity is measured with a calibrated energy meter, calorimeter,
    fast photodiode with known response, or a monitored pick-off of the launched beam.
    Measurements are corrected for known transmission and attenuation between the
    monitor and the launch reference position. Together with [wavelength_of_wave_beam](name:wavelength_of_wave_beam),
    the energy gives photon number for a monochromatic beam, for example $N_\gamma
    = E_\mathrm{in}\lambda/(hc)$; photon flux also requires the pulse duration, and
    photon-flux density requires both pulse duration and beam area.


    The physical range is $E_\mathrm{in} \ge 0$ J. Operational diagnostic pulses are
    commonly $10^{-3}$-10 J: millijoule-scale for weak probing or alignment pulses
    and 0.1-5 J for many pulsed laser scattering systems, with larger systems reaching
    tens of joules.'
  unit: J
  physics_domain: particle_measurement_diagnostics
  links:
  - name:wavelength_of_wave_beam
  - name:energy_at_launching_position
  - name:wave_beam_energy
  sources:
  - id: dd:thomson_scattering/laser/energy_in
    dd_path: thomson_scattering/laser/energy_in
    status: composed
- name: wavelength
  kind: scalar
  status: draft
  description: Vacuum optical wavelength used as the spectral sampling coordinate
    for a Thomson scattering polychromator detection band. It identifies where the
    channel or filter spectral response is evaluated when modeling scattered light
    for electron-temperature inference.
  documentation: 'Wavelength is the spatial period of an optical electromagnetic wave,
    expressed here as vacuum wavelength. In a Thomson scattering polychromator, it
    is the spectral coordinate used to evaluate filter transmission, detector efficiency,
    and the scattered-light spectrum within a detection band.


    For a monochromatic wave in vacuum, wavelength is related to optical frequency
    by


    $$

    \lambda = \frac{c}{\nu}

    $$


    where $\lambda$ is the vacuum wavelength in meters, $c$ is the speed of light
    in vacuum in meters per second, and $\nu$ is the optical frequency in hertz.


    In practice, wavelength values are obtained from optical calibration of filters,
    spectrometers, or polychromator channels and are used when integrating the product
    of the Thomson-scattered spectrum and the channel spectral response. If a calibration
    is specified in air or another medium, it should be converted to vacuum wavelength
    using the refractive index, for example $\lambda_\mathrm{vac} = n\lambda_\mathrm{medium}$
    with dimensionless refractive index $n$. Several wavelength values may be chosen
    to represent one detection band; the number of sampling positions is an instrumentation
    and numerical-integration choice rather than a separate physical convention.


    Typical optical wavelengths relevant to Thomson scattering diagnostics lie from
    about $0.3\times10^{-6}$ m to $2.0\times10^{-6}$ m. Common laser wavelengths include
    approximately $1.064\times10^{-6}$ m for Nd:YAG systems and $6.94\times10^{-7}$
    m for ruby systems, with polychromator detection bands selected around the laser
    wavelength and its thermally broadened scattered spectrum.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:spectral_wavelength
  - name:reference_calibration_wavelength_of_spectrometer_channel
- name: width_of_neutron_detector
  kind: scalar
  status: draft
  description: Full width of a rectangular neutron detector aperture along the first
    local coordinate direction (X1), defining the collimation boundary on that transverse
    axis.
  documentation: 'The width of a neutron detector specifies the full linear extent
    of its rectangular aperture along the first transverse local coordinate direction,
    X1, of the detector assembly. This geometric parameter governs the collimation
    acceptance in the X1 direction and is defined only when the aperture cross-section
    is rectangular.


    Together with [height_of_neutron_detector](name:height_of_neutron_detector), which
    gives the corresponding aperture extent along the orthogonal X2 local coordinate,
    these two dimensions fully characterize the rectangular aperture geometry. Their
    product yields the total aperture area captured by [surface_area_of_neutron_detector](name:surface_area_of_neutron_detector),
    which enters the solid-angle computation and flux normalization underpinning the
    measured [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).
    The spatial location of the detector in the machine frame is described by major_radius_of_neutron_detector
    and [vertical_coordinate_of_neutron_detector](name:vertical_coordinate_of_neutron_detector).


    Typical aperture widths in tokamak neutron diagnostics range from a few millimeters
    to several centimeters, balancing spatial resolution against counting-rate requirements
    and detection efficiency.


    Sign convention: Positive when the aperture extent is measured from the lower
    X1 boundary to the upper X1 boundary of the detector geometry.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:height_of_neutron_detector
  - name:surface_area_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:vertical_coordinate_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/geometry/x1_width
    dd_path: neutron_diagnostic/detector/geometry/x1_width
    status: composed
  - id: dd:neutron_diagnostic/detectors/detector/x1_width
    dd_path: neutron_diagnostic/detectors/detector/x1_width
    status: attached
- name: width_of_wave_beam
  kind: scalar
  status: draft
  description: Width of a wave beam is a transverse linear size of its field or intensity
    envelope measured perpendicular to the propagation direction. For an elliptical
    beam, the convention must distinguish a center-to-contour semi-axis from a full-width
    measure such as FWHM.
  documentation: 'The width of a wave beam is a linear measure of the transverse extent
    of the beam envelope in the plane normal to the local propagation direction. It
    describes one direction across the beam spot, not the enclosed cross-sectional
    area, and its numerical value depends on the stated intensity-contour or beam-edge
    convention.


    For an elliptical contour described by principal semi-axis widths, the enclosed
    area is related to the two widths by


    $$

    A = \pi w_1 w_2

    $$


    where $A$ is the enclosed beam area in $\mathrm{m^2}$ and $w_1$ and $w_2$ are
    centerline-to-contour semi-axis widths in m for the same contour. This relation
    does not apply directly to full-width quantities such as FWHM unless they are
    first converted to the corresponding semi-axis widths; for example, a full width
    across an ellipse gives a semi-axis equal to one half of that full width.


    Beam width is determined from optical or microwave beam measurements such as camera
    imaging, knife-edge scans, moving-wire scans, or from ray and beam propagation
    calculations. Together with [tilt_angle_of_wave_beam](name:tilt_angle_of_beam_tracing_beam),
    it can specify the orientation and size of an elliptical spot, while [area_of_wave_beam](name:width_of_wave_beam)
    describes the total enclosed cross-section. In diagnostic applications, beam width
    contributes to spatial resolution, but the final resolution also depends on collection
    geometry, scattering volume, refraction, diffraction, and signal integration.


    Typical values range from $1 \times 10^{-4}$-$5 \times 10^{-3}$ m for tightly
    focused optical laser waists, $1 \times 10^{-3}$-$3 \times 10^{-2}$ m for broader
    optical or millimeter-wave diagnostic beams, and $1 \times 10^{-2}$-$2 \times
    10^{-1}$ m for lower-frequency microwave or RF beams and launcher spots.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:tilt_angle_of_beam_tracing_beam
  sources:
  - id: dd:ec_launchers/beam/spot/size
    dd_path: ec_launchers/beam/spot/size
    status: composed
  - id: dd:thomson_scattering/laser/area
    dd_path: thomson_scattering/laser/area
    status: attached
  - id: dd:waves/coherent_wave/beam_tracing/beam/spot/size
    dd_path: waves/coherent_wave/beam_tracing/beam/spot/size
    status: attached
- name: x1_coordinate_of_neutron_detector
  kind: scalar
  status: draft
  description: Coordinate of a neutron detector or aperture outline vertex along the
    X1 axis of the detector-local Cartesian (X1, X2) frame with basis (X1-hat, X2-hat).
    Together with the matching X2 coordinate, it defines the boundary of the detector
    sensitive face or aperture.
  documentation: 'The $x_1$ coordinate of a neutron detector is the signed local-position
    coordinate of one outline vertex along the $X_1$ axis of the detector-local Cartesian
    $(X_1, X_2)$ frame with unit basis $(\hat{\mathbf{X}}_1, \hat{\mathbf{X}}_2)$.
    Paired with the corresponding [x2 coordinate](name:x2_coordinate_of_neutron_detector),
    it defines the planar boundary of the detector sensitive face, collimator opening,
    or aperture.


    The coordinate is the scalar projection of the displacement from the local origin
    to the outline vertex onto the first local basis direction:


    $$

    x_{1,i} = (\mathbf{r}_i - \mathbf{r}_0) \cdot \hat{\mathbf{X}}_1

    $$


    where $i$ labels a vertex, $x_{1,i}$ is the coordinate in meters, $\mathbf{r}_i$
    is the vertex position, $\mathbf{r}_0$ is the per-detector local origin, and $\hat{\mathbf{X}}_1$
    is the unit vector along the $+X_1$ axis of the detector-local Cartesian $(X_1,
    X_2)$ frame.


    In practice, the outline vertices are obtained from the mechanical design, survey,
    or alignment model of the neutron detector, collimator, or aperture. The per-detector
    origin is fixed at the reference point where the nominal sightline intersects
    the detector or aperture plane; when no sightline is defined, it is fixed at the
    chosen geometric center of the sensitive face or opening. The vertex index $i$
    labels successive points around the boundary polygon, with neighboring indices
    defining boundary segments and the final vertex connecting back to the first;
    the same ordering applies to the paired $x_2$ coordinate.


    Typical values are -0.05-0.05 m for small collimator apertures, -0.5-0.5 m for
    compact detector faces, and up to about -1-1 m for large neutron-camera or shielding-aperture
    outlines, measured relative to the detector-local origin.


    Sign convention: Positive when the vertex displacement from the detector-local
    origin has a positive projection along the $+X_1$ direction of the detector-local
    Cartesian $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:x2_coordinate_of_neutron_detector
  - name:efficiency_of_neutron_detector
  - name:x1_coordinate_of_soft_xray_detector
