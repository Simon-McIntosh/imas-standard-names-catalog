    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/real
    status: composed
- name: toroidal_perturbed_vacuum_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the complex first-order magnetic-field perturbation
    eigenfunction in the current-free vacuum region outside the plasma, resolved for
    a single toroidal Fourier mode number in linear MHD stability analysis.
  documentation: 'The toroidal projection $\delta B_\phi = \delta\mathbf{B} \cdot
    \hat{\phi}$ of the linearized magnetic-field perturbation in the current-free
    vacuum surrounding the plasma constitutes one scalar component of the full perturbed
    vacuum magnetic-field vector. In the vacuum exterior, $\nabla \times \delta\mathbf{B}
    = 0$, so $\delta\mathbf{B}$ is derivable from a scalar magnetic potential satisfying
    Laplace''s equation; the toroidal component is determined by matching conditions
    at the plasma-vacuum interface and at any conducting wall boundaries. The eigenfunction
    is complex-valued, and this parent quantity abstracts over its two real-valued
    projections: [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    and [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part),
    which carry the in-phase and quadrature contributions of the mode structure relative
    to the toroidal reference angle $\phi$. This projection is one component of the
    full [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field) vector,
    alongside the poloidal and radial components captured by [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part)
    and [radial_perturbed_vacuum_magnetic_field_real_part](name:radial_perturbed_vacuum_magnetic_field_real_part).
    Computed by solving the vacuum Maxwell equations exterior to the plasma boundary
    in linear MHD stability analysis; the absolute amplitude is normalization-dependent,
    while the relative phase between vacuum and plasma regions carries reconnection
    information relevant to resistive and resistive-wall modes.


    Sign convention: Positive when $\delta B_\phi$ points in the direction of increasing
    toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
