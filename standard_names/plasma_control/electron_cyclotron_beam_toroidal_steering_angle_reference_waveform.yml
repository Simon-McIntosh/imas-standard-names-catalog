name: electron_cyclotron_beam_toroidal_steering_angle_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-trace of the toroidal steering angle for an individual
  electron cyclotron launcher mirror.
documentation: "This reference waveform specifies the target toroidal steering angle\
  \ of the movable mirror in an EC launcher as a function of time. The toroidal steering\
  \ angle $\\alpha_{\\rm tor}$ determines the toroidal injection direction of the\
  \ microwave beam and, together with the poloidal steering angle, sets both the deposition\
  \ location and the driven-current direction. Adjusting $\\alpha_{\\rm tor}$ is the\
  \ primary mechanism for controlling co- vs. counter-current drive efficiency. Typical\
  \ ranges are $\\pm 25\xB0$ for upper-launcher systems on ITER. The real-time control\
  \ system commands the mirror actuator to follow this waveform, which may be updated\
  \ by feedback loops targeting specific MHD mode suppression. See also the poloidal\
  \ steering angle and deposition location references."
