    dd_path: ic_antennas/antenna/module/strap/geometry/thick_line/thickness
    status: composed
- name: toroidal_angle_of_antenna_strap
  kind: scalar
  status: draft
  description: Toroidal angle of an ICRH antenna strap, specifying its angular position
    around the torus in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The toroidal angle $\phi$ of an ICRH antenna strap is its angular
    coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    the major radius measured from the toroidal symmetry axis, $\phi$ increases counter-clockwise
    when viewed from the $+Z$ direction, and $Z$ is the vertical height. This coordinate
    locates the strap toroidally around the vacuum vessel and, together with $R$ and
    $Z$, fully reconstructs the 3D outline geometry of the strap for antenna design,
    electromagnetic modeling, and RF wave coupling calculations.


    For the outline contour of a single strap, the variation in $\phi$ across the
    conductor cross-section is small (typically a few milliradians to tens of milliradians),
    while the nominal center angle is set by the port location on the machine. ICRH
    systems on large tokamaks are typically installed at two to six toroidal ports,
    with strap center angles separated by roughly $2\pi / N$ rad for an $N$-port configuration.


    The toroidal angle is determined from engineering design drawings and verified
    through in-situ metrology surveys of the assembled antenna structure. This quantity
    follows the same geometric convention used for other conducting components, such
    as [toroidal_angle_of_coil_conductor_element](name:toroidal_angle_of_coil_conductor_element)
    and [toroidal_angle_of_toroidal_field_coil](name:toroidal_angle_of_toroidal_field_coil).
    The cross-sectional shape of the strap is further characterized by angular parameters
    such as [alpha_angle_of_antenna_strap](name:alpha_angle_of_antenna_strap).'
  unit: rad
  physics_domain: auxiliary_heating
