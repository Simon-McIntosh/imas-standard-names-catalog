- name: surface_area_of_flux_surface
  kind: scalar
  status: active
  description: "Geometric area of a closed toroidal magnetic flux surface formed by\
    \ revolving its poloidal contour through one complete toroidal revolution in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the geometric area of a complete closed toroidal
    magnetic flux surface. It includes the full surface swept out by the corresponding
    poloidal contour during one toroidal revolution.


    For an axisymmetric surface, the area is defined by


    $$

    A_{\mathrm{surf}}(\xi) = \oint_{C(\xi)} 2\pi R\,dl_p

    $$


    where $A_{\mathrm{surf}}(\xi)$ is the toroidal-surface area, $\xi$ is the magnetic
    flux-surface label, $C(\xi)$ is the closed poloidal contour for that surface,
    $R$ is the major radius, $dl_p$ is differential arc length along the contour,
    and $\pi$ is the circular constant. The contour is expressed in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The scope is one selected nested magnetic flux surface, with local surface elements
    aggregated over the complete toroidal revolution. This is distinct from the area
    enclosed by a poloidal contour, represented by the [poloidal-plane cross-sectional
    area of a flux surface](name:poloidal_plane_cross_sectional_area_of_flux_surface),
    and from the enclosed [volume of a flux surface](name:volume_of_flux_surface).


    As a specialization of the broader [area measure associated with a flux surface],
    this quantity selects the total toroidal-surface area rather than a poloidal cross-sectional
    area or an area derivative with respect to a flux coordinate.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:poloidal_plane_cross_sectional_area_of_flux_surface
  - name:volume_of_flux_surface
  sources:
