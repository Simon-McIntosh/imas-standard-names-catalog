name: gyrokinetic_eigenmode_normalized_perturbed_parallel_vector_potential_imaginary_part
status: draft
description: Imaginary part of the normalized perturbed parallel magnetic vector potential
  $\delta \hat{A}_\parallel$ for a gyrokinetic eigenmode.
documentation: "This quantity stores the imaginary component of the Fourier-mode amplitude\
  \ of the perturbed parallel vector potential $\\delta A_\\parallel$ associated with\
  \ a single gyrokinetic eigenmode at wavevector $\\mathbf{k}_\\perp$, normalized\
  \ to code reference quantities (typically $B_{\\mathrm{ref}} \\rho_{\\mathrm{ref}}$\
  \ so the result is dimensionless). The perturbed $\\delta A_\\parallel$ enters the\
  \ gyrokinetic system through Amp\xE8re's law, $k_\\perp^2 \\delta A_\\parallel =\
  \ -(4\\pi / c) \\delta j_\\parallel$, coupling electromagnetic fluctuations to parallel\
  \ current density perturbations and enabling the description of finite-$\\beta$\
  \ effects such as kinetic ballooning modes (KBM) and microtearing instabilities.\
  \ In electrostatic limits ($\\beta \\to 0$), $\\delta A_\\parallel \\to 0$ and this\
  \ field vanishes. The imaginary part, together with the real part stored separately,\
  \ reconstructs the full complex amplitude whose magnitude and phase determine the\
  \ mode's electromagnetic energy content and its contribution to magnetic flutter\
  \ transport. Gyrokinetic codes (GENE, GS2, CGYRO) output this field as a standard\
  \ eigenmode diagnostic. See also the perturbed electrostatic potential and their\
  \ respective amplitude weights."
