      kind: llm
- name: lower_inner_squareness_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless Luce (2013) squareness coefficient for the lower-inner,
    high-field-side quadrant of a nested magnetic flux surface, measuring signed departure
    from a reference ellipse.
  documentation: 'The lower-inner squareness of a flux surface is the dimensionless
    Luce (2013) shape coefficient that characterizes how the lower, high-field-side
    quadrant of a nested toroidal magnetic flux surface departs from a reference ellipse
    sharing the same center, horizontal half-width, and [elongation](name:elongation_of_flux_surface).
    It is the lower-quadrant component of [inner squareness of a flux surface](name:inner_squareness_of_flux_surface),
    complementary to [upper-inner squareness of a flux surface](name:upper_inner_squareness_of_flux_surface).


    The reference ellipse is parameterized in the right-handed cylindrical $(R, \phi,
    Z)$ frame by


    $$

    \mathbf{r}_{\mathrm{ref}}(\theta)=\left(R_0+a\cos\theta,\;Z_0+\kappa a\sin\theta\right)

    $$


    where $R$ is major radius, $Z$ is vertical height, $\theta$ is a poloidal parameter,
    $(R_0,Z_0)$ is the ellipse center, $a$ is its horizontal half-width, and $\kappa$
    is its elongation. Within the Luce model, $\zeta_{\mathrm{li}}=0$ represents no
    additional lower-inner corner shaping; positive values indicate an outward, boxier
    corner and negative values an inward, more indented corner.


    This coefficient describes only the lower high-field-side quadrant and is not
    an average of the upper and lower inner coefficients.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:inner_squareness_of_flux_surface
  - name:upper_inner_squareness_of_flux_surface
  arguments:
