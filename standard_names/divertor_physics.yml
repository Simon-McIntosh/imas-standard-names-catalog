- name: argon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of argon ions at the divertor target is the local particle
    count per volume at the sheath entrance, summed over positive ionization states
    and excluding neutral argon.
  documentation: 'Number density of argon ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the argon-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The charge-state-summed argon number density is defined by


    $$

    n_{\mathrm{Ar}} = \sum_{q=1}^{18} n_{\mathrm{Ar}^{q+}}

    $$


    where $n_{\mathrm{Ar}}$ is the total argon-ion number density, $n_{\mathrm{Ar}^{q+}}$
    is the local number density of argon ions with positive charge state $q$, and
    $q$ is the integer argon charge-state index.


    This quantity applies to the argon-ion population immediately upstream of the
    electrostatic sheath at a divertor target and is summed over all positive argon
    charge states from singly ionized through fully stripped argon. Neutral argon
    atoms and other neutral argon forms are excluded, as are electrons and ions of
    other elements.


    This is a local species density rather than a density integrated over the target
    surface or summed over all plasma species. The corresponding argon quantity at
    a limiter, [argon density at the limiter](name:argon_density_at_limiter), has
    the same charge-state aggregation but a different evaluation locus; unlike [electron
    density at the divertor target](name:electron_density_at_divertor_target), this
    quantity describes argon ions rather than free electrons.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/argon/value
    version: 4.1.0
  roles:
  - quantity
- name: beryllium_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of beryllium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary, summed over all positive ionization states.
  documentation: 'Number density of beryllium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the beryllium-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local beryllium-ion number density is defined by the differential particle
    count:


    $$

    n_{\mathrm{Be}} = \frac{dN_{\mathrm{Be}}}{dV}

    $$


    where $n_{\mathrm{Be}}$ is the beryllium-ion number density, $N_{\mathrm{Be}}$
    is the number of beryllium ions in the volume, and $V$ is a small plasma volume
    centered at the sheath entrance.


    This quantity applies to the ionized beryllium population immediately adjacent
    to the divertor target and is summed over all positive beryllium ionization states,
    with each ion counted once regardless of charge state. Neutral beryllium atoms
    are excluded; the quantity is a local number density, not an areal particle flux,
    integrated inventory, or charge density.


    Compared with [beryllium_density](name:beryllium_density), this quantity specifies
    the divertor-target sheath-entrance locus. It is distinct from [electron_density_at_divertor_target](name:electron_density_at_divertor_target),
    which counts free electrons rather than beryllium ions.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/beryllium/value
    version: 4.1.0
  roles:
  - quantity
- name: boron_density_at_divertor_target
  kind: scalar
  status: active
  description: Boron density at the divertor target is the local number density of
    boron ions immediately upstream of the electrostatic sheath at the target-facing
    plasma boundary.
  documentation: 'Boron density at the divertor target is the local number density
    of boron ions in the plasma immediately adjacent to the divertor target surface,
    evaluated at the entrance to the electrostatic sheath. It is the boron-specific
    member of [density_at_divertor_target](name:density_at_divertor_target).


    The charge-state-summed boron ion density is defined by


    $$

    n_{\mathrm{B}} = \sum_{q=1}^{5} n_{\mathrm{B}^{q+}}

    $$


    where $n_{\mathrm{B}}$ is the boron ion number density and $n_{\mathrm{B}^{q+}}$
    is the number density of boron ions with positive charge state $q$.


    This quantity applies to the boron-ion population immediately upstream of the
    sheath at a divertor target and aggregates all positive boron ionization states,
    from singly ionized through fully stripped boron. Each boron ion is counted once;
    neutral boron atoms are excluded.


    Relative to the parent [density_at_divertor_target](name:density_at_divertor_target),
    this quantity selects boron ions rather than an unspecified species or species
    group. It is parallel to [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target),
    differing in the selected ion species and its allowed charge states.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:beryllium_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/boron/value
    version: 4.1.0
  roles:
  - quantity
- name: carbon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the carbon species at the divertor target is the
    local particle count per volume for carbon ions at the sheath entrance immediately
    upstream of the target-facing plasma boundary.
  documentation: 'Number density of the carbon species at the divertor target is the
    local particle count per volume at the sheath entrance immediately upstream of
    the target-facing plasma boundary. It is the carbon-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local carbon-ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{C}^{+}} = \frac{dN_{\mathrm{C}^{+}}}{dV}

    $$


    where $n_{\mathrm{C}^{+}}$ is the carbon-ion number density, $N_{\mathrm{C}^{+}}$
    is the number of carbon ions in all positive ionization states, and $V$ is a small
    plasma volume whose center approaches the sheath entrance from the plasma side.


    This quantity applies to carbon ions immediately upstream of the electrostatic
    sheath at a divertor target and is summed over all positive carbon ionization
    states, from singly ionized through fully stripped carbon. Neutral carbon atoms,
    carbon-bearing neutral molecules, electrons, and ions of other elements are excluded.


    Unlike [carbon_density](name:carbon_density), which has the broader elemental-carbon
    scope including neutral carbon, this quantity is restricted to the charge-state-summed
    positive-ion population at the divertor target.'
  unit: m^-3
  physics_domain: divertor_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/carbon/value
    version: 4.1.0
  roles:
  - quantity
- name: deuterium_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of deuterium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary.
  documentation: 'Number density of deuterium ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the deuterium-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local deuterium number density is defined by the differential particle count:


    $$

    n_D = \frac{dN_D}{dV}

    $$


    where $N_D$ is the number of deuterium ions in a small plasma volume $V$ whose
    center approaches the sheath entrance from the plasma side at the divertor target.


    This quantity applies to the deuterium-ion population immediately adjacent to
    the divertor target and is summed over all positive atomic deuterium ionization
    states, counting each ion once regardless of charge state. Neutral deuterium atoms
    and molecules, electrons, and ions of other species are excluded.


    Unlike [deuterium_tritium_density_at_divertor_target](name:deuterium_tritium_density_at_divertor_target),
    which includes both fuel-ion species, this quantity contains deuterium ions only.
    It is the divertor-target-localized counterpart of [deuterium_density](name:deuterium_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_tritium_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/deuterium/value
    version: 4.1.0
  roles:
  - quantity
- name: deuterium_tritium_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the effective deuterium-tritium fuel-ion pseudo-species
    at the divertor target is the local particle count per volume at the plasma-side
    sheath entrance.
  documentation: 'Number density of the deuterium-tritium fuel-ion pseudo-species
    at the divertor target is the local particle count per volume at the sheath entrance
    immediately upstream of the target-facing plasma boundary. It is the deuterium-tritium-specific
    member of [density_at_divertor_target](name:density_at_divertor_target).


    The local deuterium-tritium number density is defined by the differential particle
    count:


    $$

    n_{DT} = \frac{dN_{DT}}{dV}

    $$


    where $N_{DT}$ is the number of particles represented by the effective deuterium-tritium
    fuel-ion pseudo-species, and $V$ is a small plasma volume whose center approaches
    the sheath entrance from the plasma side at the divertor target.


    This quantity applies to the ion population represented as one effective deuterium-tritium
    fuel species, rather than to separately resolved deuterium and tritium populations.
    It includes the positive ionic states represented by that pseudo-species and excludes
    neutral deuterium-tritium atoms or molecules, electrons, and other ion species.


    The localized quantity is the divertor-target counterpart of [deuterium_tritium_density](name:deuterium_tritium_density).
    Unlike [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)
    and [tritium_density_at_divertor_target](name:tritium_density_at_divertor_target),
    which describe the separately resolved isotope populations, this quantity uses
    the prescribed effective deuterium-tritium pseudo-species.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:tritium_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/deuterium_tritium/value
    version: 4.1.0
  roles:
  - quantity
- name: electron_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the electron species at the divertor target is the
    local particle count per volume for free electrons at the sheath entrance immediately
    upstream of the target-facing plasma boundary.
  documentation: 'Number density of the electron species at the divertor target is
    the local particle count per volume at the sheath entrance immediately upstream
    of the target-facing plasma boundary. It is the electron-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local electron number density is defined by the differential particle count:


    $$

    n_e = \frac{dN_e}{dV}

    $$


    where $N_e$ is the number of free electrons in a small plasma volume $V$ whose
    center approaches the sheath entrance from the plasma side at the divertor target.


    This quantity applies to the free-electron population immediately adjacent to
    the divertor target and counts each free electron once, without charge-state weighting.
    Electrons bound in atoms or molecules, ions, and other neutral particles are excluded.


    Unlike [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target),
    which sums positive-ion densities over ion species and charge states, this quantity
    describes the electron population and is not an ionic density or a charge density.'
  unit: m^-3
  physics_domain: divertor_physics
  links: []
  sources:
  - kind: imas-dd
    ref: divertors/divertor/target/two_point_model/n_e_target
    version: 4.1.0
  - kind: imas-dd
    ref: summary/local/divertor_target/n_e/value
    version: 4.1.0
  roles:
  - quantity
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Electron temperature at the divertor target is the thermal energy per
    particle of the electron population evaluated at the plasma side of a divertor-target
    sheath, distinct from the target material temperature.
  documentation: 'Electron temperature at the divertor target is the thermal energy
    per particle of the electron population evaluated at the plasma side of a divertor-target
    sheath. It is a plasma boundary quantity for electrons at the downstream end of
    the scrape-off layer, not a thermodynamic property of the solid target material.


    For the electron population, the target temperature is the one-third trace of
    the kinetic thermal-energy moment at the sheath edge:


    $$

    T_{e,t} = \frac{m_e}{3 n_{e,t}} \int |\mathbf{v} - \mathbf{u}_{e,t}|^2 f_{e,t}(\mathbf{v})\,d^3v

    $$


    where $T_{e,t}$ is the electron temperature at the divertor target, $m_e$ is the
    electron mass, $n_{e,t}$ is the free-electron number density at the sheath edge,
    $\mathbf{v}$ is electron velocity, $\mathbf{u}_{e,t}$ is the mean electron flow
    velocity at the sheath edge, $f_{e,t}(\mathbf{v})$ is the electron velocity distribution
    there, and $d^3v$ is the velocity-space volume element.


    This quantity applies exclusively to the free-electron population at a specified
    divertor target and represents a density-weighted per-particle thermal energy
    scale rather than an extensive sum. It excludes ion, neutral-particle, and solid-target
    temperatures, and it is not an average over multiple plasma populations.


    It is the electron-specific component of [temperature at the divertor target](name:temperature_at_divertor_target).
    The electron density at the same locus, [electron density at divertor target](name:electron_density_at_divertor_target),
    supplies the local population density appearing in the defining moment but is
    a distinct quantity.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: divertors/divertor/target/two_point_model/t_e_target
    version: 4.1.0
  - kind: imas-dd
    ref: summary/local/divertor_target/t_e/value
    version: 4.1.0
  roles:
  - quantity
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of helium-3 ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary, summed over positive ionization states and excluding neutral
    helium-3 atoms.
  documentation: 'Number density of helium-3 ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the helium-3-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local helium-3 number density is defined by the differential particle count:


    $$

    n_3 = \frac{dN_3}{dV}

    $$


    where $n_3$ is the helium-3 ion number density, $N_3$ is the number of helium-3
    ions in a small plasma volume, and $V$ is that plasma volume. The count $N_3$
    includes singly ionized and fully stripped helium-3 ions.


    This quantity applies to the helium-3 ion population immediately upstream of the
    electrostatic sheath at a divertor target. It is summed over the positive ionization
    states of helium-3, excludes neutral helium-3 atoms, and excludes electrons and
    all other ion species.


    Unlike [helium_4_density_at_divertor_target](name:helium_4_density_at_divertor_target),
    this quantity describes the isotope with three nucleons. Unlike [helium_3_density_at_limiter](name:helium_3_density_at_limiter),
    it is evaluated at a divertor target rather than at a limiter surface.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:helium_4_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/helium_3/value
    version: 4.1.0
  roles:
  - quantity
- name: helium_4_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of helium-4 ions at the divertor target is the local
    particle count per volume at the sheath entrance, summed over singly and doubly
    ionized states and excluding neutral helium-4.
  documentation: 'Number density of helium-4 ions at the divertor target is the local
    particle count per volume at the sheath entrance immediately upstream of the target-facing
    plasma boundary. It is the helium-4-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The helium-4 ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{He4}} = \frac{dN_{\mathrm{He4}}}{dV}

    $$


    where $n_{\mathrm{He4}}$ is the helium-4 ion number density, $N_{\mathrm{He4}}$
    is the number of helium-4 ions, and $V$ is a small plasma volume whose center
    approaches the sheath entrance from the plasma side.


    This quantity applies to the ionized helium-4 population immediately adjacent
    to the divertor target and is summed over the singly and doubly ionized charge
    states, with each ion counted once. Neutral helium-4 atoms are excluded, so this
    quantity is not the total helium-4 particle density including neutrals or a charge
    density.


    As a species-specific specialization, this quantity contributes to the broader
    [density_at_divertor_target](name:density_at_divertor_target) family without including
    other ion species. The isotope distinction from [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target)
    is maintained; the two quantities describe different helium isotopes.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:helium_3_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/helium_4/value
    version: 4.1.0
  roles:
  - quantity
- name: hydrogen_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the hydrogen species at the divertor target is the
    local particle count per volume for hydrogen ions at the sheath entrance, summed
    over positive charge states and excluding neutral hydrogen atoms and molecules.
  documentation: 'Number density of the hydrogen species at the divertor target is
    the local particle count per volume at the sheath entrance immediately upstream
    of the target-facing plasma boundary. It is the hydrogen-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local hydrogen-ion number density is defined by the differential particle
    count:


    $$

    n_{\mathrm{H}} = \frac{dN_{\mathrm{H}}}{dV}

    $$


    where $N_{\mathrm{H}}$ is the number of free hydrogen ions in a small plasma volume
    $V$ whose center approaches the sheath entrance from the plasma side at the divertor
    target, and $n_{\mathrm{H}}$ is the corresponding local hydrogen-ion number density.


    This quantity applies to the free hydrogen-ion population immediately adjacent
    to the divertor target. It is summed over all positive hydrogen ionization charge
    states, counting each ion once without charge weighting; neutral hydrogen atoms
    and molecules, electrons, and other ion species are excluded.


    As a species-specific local component, it uses the same sheath-entrance locus
    and charge-state-summed convention as [deuterium density at the divertor target](name:deuterium_density_at_divertor_target),
    but represents hydrogen ions rather than deuterium ions. Unlike the flux-surface-averaged
    [hydrogen density at the plasma boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary),
    it is evaluated locally at the divertor target rather than averaged over a flux
    surface.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/n_i/hydrogen/value
    version: 4.1.0
  roles:
  - quantity
- name: ion_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Ion temperature at the divertor target is the thermal energy per particle
    of the ion population averaged over ion species and evaluated at the plasma side
    of a divertor-target sheath, distinct from the target material temperature.
  documentation: 'Ion temperature at the divertor target is the thermal energy per
    particle of the ion population averaged over ion species and evaluated at the
    plasma side of a divertor-target sheath. It is a plasma boundary quantity for
    ions at the downstream end of the scrape-off layer, not a thermodynamic property
    of the solid target material.


    For the ion population, the species-averaged target temperature is defined from
    the ion kinetic thermal-energy moments by:


    $$

    T_{i,t} = \left\langle \frac{m_s}{3 n_{s,t}} \int \lvert \mathbf{v} - \mathbf{u}_{s,t}
    \rvert^2 f_{s,t}(\mathbf{v})\,d^3v \right\rangle_s

    $$


    where $T_{i,t}$ is the ion temperature at the divertor target, $i$ identifies
    the ion population, $t$ identifies the divertor-target sheath-edge locus, $s$
    indexes the included ion species, $m_s$ is the mass of species $s$, $n_{s,t}$
    is its number density at the target sheath edge, $\mathbf{v}$ is ion velocity,
    $\mathbf{u}_{s,t}$ is the mean flow velocity of species $s$ there, $f_{s,t}(\mathbf{v})$
    is its velocity distribution, $d^3v$ is the velocity-space volume element, and
    angle brackets denote averaging over the included ion species.


    This quantity applies exclusively to the ion population immediately upstream of
    a specified divertor target and represents an intensive, per-particle thermal-energy
    scale averaged over ion species. It is not an extensive sum of ion energies or
    densities, and it excludes electron, neutral-particle, and solid-target temperatures.


    It is the ion-specific component of [temperature at the divertor target](name:temperature_at_divertor_target).
    Unlike [electron temperature at the divertor target](name:electron_temperature_at_divertor_target),
    it describes ion kinetic thermal energy at the same plasma-side target locus.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  sources:
  - kind: imas-dd
    ref: summary/local/divertor_target/t_i_average/value
    version: 4.1.0
  roles:
  - quantity
- name: iron_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the iron species at the divertor target is the particle
    count per volume for iron ions at the sheath entrance immediately upstream of
    the target-facing plasma boundary. Positive charge states are summed; neutral
    iron is excluded.
  documentation: 'Number density of the iron species at the divertor target is the
    local particle count per volume at the sheath entrance immediately upstream of
    the target-facing plasma boundary. It is the iron-specific member of [density_at_divertor_target](name:density_at_divertor_target).


    The local iron-ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{Fe}} = \frac{dN_{\mathrm{Fe}}}{dV}

    $$


    where $n_{\mathrm{Fe}}$ is the iron-ion number density, $\mathrm{Fe}$ denotes
    iron, $N_{\mathrm{Fe}}$ is the number of free iron ions, and $V$ is a small plasma
    volume whose center approaches the sheath entrance from the plasma side.


    This quantity applies to the free iron-ion population immediately adjacent to
    the divertor target and is summed over all positive iron charge states, counting
    each iron ion once without charge-state weighting. Neutral iron atoms, electrons,
    other ion species, and charge density are excluded.


    It is a species-resolved component of [density_at_divertor_target](name:density_at_divertor_target),
    whereas [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    describes the free-electron population and [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)
    applies the same target-locus and charge-state-summed convention to carbon ions.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
