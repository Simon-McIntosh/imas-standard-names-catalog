- name: vertical_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Vertical electromagnetic force acting on an individual poloidal field
    coil, positive when directed upward along the machine symmetry axis.
  documentation: 'The vertical force on a poloidal field coil is the net Lorentz body
    force integrated over the full coil conductor volume in the direction parallel
    to the machine symmetry axis $\hat{Z}$ of the right-handed cylindrical $(R, \phi,
    Z)$ frame. It arises from the interaction of the coil current with the combined
    magnetic field produced by the plasma current, all active poloidal field coils,
    and any passive conducting structures present in the device.


    The defining integral is:


    $$

    F_Z = \int_V (\mathbf{J} \times \mathbf{B}) \cdot \hat{Z} \, dV

    $$


    where $\mathbf{J}$ is the coil current density, $\mathbf{B}$ is the total local
    magnetic flux density, and the integral is taken over the coil conductor volume
    $V$.


    In practice this force is computed from electromagnetic equilibrium models using
    the coil geometry and reconstructed current distribution rather than measured
    directly on the conductor. It is a key input for structural analysis of coil support
    systems, as large vertical forces develop during plasma current ramp-up, steady-state
    operation, and especially at disruptions.


    The orthogonal in-plane component is given by [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil),
    while the system-level sum over all PF coils is captured by vertical_force. Operating
    bounds on the aggregate system are characterized by [vertical_minimum_force](name:vertical_minimum_force).


    Sign convention: Positive when the net force is directed in the $+Z$ direction
    (upward along the machine symmetry axis).'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:radial_force_of_poloidal_field_coil
  - name:vertical_minimum_force
  sources:
  - id: dd:pf_active/coil/force_vertical
    dd_path: pf_active/coil/force_vertical
    status: composed
- name: vertical_magnetic_field_at_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Vertical component of the magnetic field at the centroid of a ferritic
    element, measuring the Z-directed field contribution to the local magnetic state
    of the ferromagnetic in-vessel component.
  documentation: 'Ferritic elements are ferromagnetic in-vessel components, such as
    ferritic steel inserts, installed in some tokamaks to reduce toroidal field ripple
    and manage magnetic loads. The magnetic field sampled at each element''s centroid
    serves as the representative local field vector used to evaluate the element''s
    magnetization state and compute its back-reaction on the global equilibrium.


    The vertical component $B_Z = \mathbf{B} \cdot \hat{Z}$ is the projection of the
    total magnetic field onto the $\hat{Z}$ axis of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $Z$ is the vertical height measured from the device midplane.
    Together with the [radial component](name:radial_magnetic_field_at_ferritic_element_centroid)
    $B_R$ and the [toroidal component](name:toroidal_magnetic_field_at_ferritic_element_centroid)
    $B_\phi$, it fully specifies the local field vector that drives the element''s
    [vertical magnetization](name:vertical_magnetization_of_ferritic_element) $M_Z$.


    In magnetostatic modeling, the centroid field is obtained from the self-consistent
    equilibrium solution or from a reduced thick-line approximation of the ferromagnetic
    element, where the centroid value represents the spatially averaged field over
    the element''s cross-section.


    Sign convention: Positive when $B_Z$ points in the $+Z$ direction (upward along
    the machine symmetry axis).'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_at_ferritic_element_centroid
  - name:toroidal_magnetic_field_at_ferritic_element_centroid
  - name:vertical_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_z
    dd_path: ferritic/object/time_slice/b_field_z
    status: composed
- name: vertical_magnetization_of_ferritic_element
  kind: scalar
  status: draft
  description: Vertical component of the magnetization assigned to a ferritic element,
    resolved along Z in the right-handed cylindrical (R, phi, Z) frame. It follows
    an element convention with unit A m^-2, distinct from ordinary bulk magnetization.
  documentation: 'The vertical magnetization of a ferritic element is the $Z$ component
    of the magnetization assigned to that element, resolved in the right-handed cylindrical
    $(R, \phi, Z)$ frame. It represents the part of the ferritic material response
    associated with vertical magnetic polarization when the element is magnetized
    by the surrounding field. The quantity uses an element convention with dimensions
    $A\,m^{-2}$, so it should not be interpreted as the ordinary bulk magnetization
    component commonly denoted $M_Z$ with dimensions $A\,m^{-1}$.


    If $\mathbf{M}^{\mathrm{elem}}$ denotes the magnetization vector assigned to the
    ferritic element using this $A\,m^{-2}$ convention, the vertical component is
    its projection onto the vertical basis direction:


    $$

    M_Z^{\mathrm{elem}} = \mathbf{M}^{\mathrm{elem}} \cdot \hat{Z}

    $$


    where $M_Z^{\mathrm{elem}}$ is the vertical component, $\mathbf{M}^{\mathrm{elem}}$
    has components defined for the same element convention, and $\hat{Z}$ is the vertical
    unit vector of the right-handed cylindrical $(R, \phi, Z)$ frame.


    In practice this component is computed from a magnetic material-response model
    for the ferritic structure, driven by the local magnetic field at the element,
    including contributions from coils, plasma currents, and other magnetized material.
    A linear susceptibility model may be adequate only at low fields; ferromagnetic
    steels can show nonlinear saturation and hysteresis, so the component is model
    dependent and is usually constrained indirectly through magnetic-field reconstruction.
    Together with the [radial magnetization of ferritic element](name:radial_magnetization_of_ferritic_element)
    and [toroidal magnetization of ferritic element](name:toroidal_magnetization_of_ferritic_element),
    it specifies the magnetization vector assigned to the element.


    No device-independent numerical range is implied, because the $A\,m^{-2}$ magnitude
    depends on the element convention, element geometry, material magnetization curve,
    and local field. Typical signed values are bounded by the model''s element saturation
    magnitude, ranging from $-M_{\mathrm{sat}}^{\mathrm{elem}}$ to $+M_{\mathrm{sat}}^{\mathrm{elem}}$
    for that element; near-zero values occur for weakly driven or demagnetized material.


    Sign convention: Positive when the element magnetization component points in the
    $+Z$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_magnetic_field_at_ferritic_element_centroid
  - name:radial_magnetization_of_ferritic_element
  - name:toroidal_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/magnetic_moment_z
    dd_path: ferritic/object/time_slice/magnetic_moment_z
    status: composed
- name: vertical_maximum_force
  kind: scalar
  status: draft
  description: Vertical maximum force is the upper allowable value of the net electromagnetic
    force component along Z in the right-handed cylindrical (R, phi, Z) frame acting
    on an axisymmetric poloidal-field coil system. It is a design-defined hard constraint
    for coil-current scenario optimization.
  documentation: 'Vertical maximum force is the upper structural limit on the net
    electromagnetic force component in the $Z$ direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z$ is vertical height, acting on the complete axisymmetric
    poloidal-field coil system. It defines the positive side of the vertical force
    envelope: admissible operating points require the instantaneous vertical_force
    to satisfy $F_Z \le F_{Z,\max}$ while also respecting [vertical_minimum_force](name:vertical_minimum_force).


    The instantaneous force constrained by this limit is the sum of Lorentz forces
    on the coil conductors:


    $$

    F_Z = \sum_k I_k \oint_{\mathcal{C}_k} \left(d\boldsymbol{\ell}_k \times \mathbf{B}_{\mathrm{ext},k}\right)
    \cdot \hat{Z}

    $$


    where $F_Z$ is the net vertical force in N, $k$ indexes coil windings or current
    circuits, $I_k$ is the circuit current in A, $d\boldsymbol{\ell}_k$ is the conductor
    line element in m oriented with the current, and $\mathbf{B}_{\mathrm{ext},k}$
    is the magnetic field in T at that conductor due to sources external to the same
    current element.


    The limit value is a design and structural-analysis quantity, not a scenario-dependent
    response. It is set from support loads, stress allowables, load combinations,
    margins, and protection requirements; scenario optimization treats it as a fixed
    upper bound while the actual $F_Z$ varies with coil currents, plasma current,
    equilibrium shape, and induced currents in nearby conductors.


    Typical upper limits range from $10^5$-$10^7$ N for small and medium devices and
    from $10^7$-$10^8$ N or more for large high-field devices, depending on coil size,
    field strength, support stiffness, and allowable mechanical stress.


    Sign convention: Positive when the net vertical electromagnetic force on the coil
    system points in the $+Z$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_minimum_force
  sources:
  - id: dd:pf_active/vertical_force/limit_max
    dd_path: pf_active/vertical_force/limit_max
    status: composed
- name: vertical_minimum_force
  kind: scalar
  status: draft
  description: Minimum allowable net vertical electromagnetic force on the axisymmetric
    PF coil system, defining the lower bound of the structural force envelope within
    which plasma operations must remain.
  documentation: 'The vertical minimum force is the lower structural limit on the
    combined net vertical electromagnetic force that the axisymmetric poloidal field
    coil system can safely sustain. This limit, together with [vertical_maximum_force](name:vertical_maximum_force),
    defines the allowable force window that the mechanical support structure must
    accommodate across all plasma scenarios without mechanical failure or loss of
    coil positional stability.


    The net vertical electromagnetic force on the coil assembly is the $Z$-component
    of the Lorentz body force integrated over all coil volumes:


    $$

    F_z = \sum_k \int_{V_k} (\mathbf{J}_k \times \mathbf{B}) \cdot \hat{Z} \, dV

    $$


    where $\mathbf{J}_k$ is the current density in the $k$-th coil, $\mathbf{B}$ is
    the total magnetic field, and $\hat{Z}$ is the vertical unit vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The instantaneous vertical_force must remain between this lower limit and [vertical_maximum_force](name:vertical_maximum_force)
    throughout operation. The analogous lower radial limit is provided by [radial_total_minimum_force_of_poloidal_field_coil](name:radial_minimum_force_of_poloidal_field_coil).
    These limits are determined from structural analysis of the coil support system
    and are specified as design constraints for the tokamak electromagnetic load envelope.


    Sign convention: Positive when the net vertical force acts in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_maximum_force
  - name:radial_minimum_force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/vertical_force/limit_min
    dd_path: pf_active/vertical_force/limit_min
    status: composed
- name: vertical_outline_of_conductor_cross_section
  kind: scalar
  status: draft
  description: Vertical coordinate of a boundary point, typically the start of a circular-arc
    segment, on a conductor cross-section outline. It is measured in meters from the
    machine midplane along Z in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical outline of a conductor cross-section is the $Z$ coordinate
    of a point on the conductor boundary, commonly the start point of a circular-arc
    segment in a piecewise-circular contour. In the right-handed cylindrical $(R,
    \phi, Z)$ frame, $R$ is major radius in meters, $\phi$ is toroidal angle, and
    $Z$ is vertical height in meters measured from the machine midplane.


    A boundary point in a meridional cross-section can be identified by its major-radius
    and vertical coordinates:


    $$

    p_i = (R_i, Z_i)

    $$


    where $p_i$ is the outline point, $R_i$ is the corresponding major-radius coordinate,
    and this quantity is $Z_i$. For a circular-arc outline, the point coordinates
    alone specify only the arc start point; the arc radius, curvature or sweep information,
    and ordering of neighboring points are also required to define the local boundary
    segment.


    This quantity is obtained from conductor engineering geometry, magnetic-field-system
    design models, or geometry reconstruction of the cross-section contour. It is
    used together with the corresponding [major-radius outline] and [arc radius] to
    build the conductor boundary used in field and structural calculations.


    Typical local outline offsets are 0.01-0.5 m for many coil conductors, while absolute
    vertical coordinates of conductors and passive magnetic structures commonly span
    -10-10 m in medium-sized devices and may reach -20-20 m in larger devices.


    Sign convention: Positive when the outline point lies above the machine midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
