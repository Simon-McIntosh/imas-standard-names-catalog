name: normalized_toroidal_velocity_gradient
status: draft
cocos_transformation_type: one_like
description: Dimensionless radial gradient of the toroidal velocity with respect to
  the normalized minor radius $r/a$, used as a gyrokinetic equilibrium input.
documentation: 'The normalized toroidal velocity gradient $R_0 / v_{\mathrm{th},s}
  \cdot d V_\phi / d (r/a)$, where $R_0$ is the major radius in m, $v_{\mathrm{th},s}$
  is the thermal speed of the reference species in m/s, $V_\phi$ is the toroidal rotation
  velocity in m/s, and $r/a$ is the normalized minor radius (dimensionless). This
  quantity parameterizes the equilibrium toroidal flow shear entering gyrokinetic
  simulations and is a key driver of the perpendicular flow shear stabilization of
  turbulent transport. Typical values range from 0 to several units depending on the
  level of neutral beam injection or intrinsic rotation; values above $\sim$1 in gyro-Bohm
  units can significantly suppress ITG turbulence. Derived from charge-exchange recombination
  spectroscopy measurements of the toroidal rotation profile or from integrated modeling
  codes. The sign indicates the direction of shear: positive for increasing co-current
  rotation with radius.'
validity_domain: ''
