- name: second_radial_derivative_of_total_ion_density
  kind: scalar
  status: draft
  description: Second derivative of total ion number density (thermal plus non-thermal,
    summed over all charge states) with respect to the normalized toroidal flux coordinate,
    quantifying the radial curvature of the ion density profile.
  documentation: 'The second radial derivative of total ion density describes the
    curvature of the ion density profile along the normalized toroidal flux coordinate
    $\rho_\mathrm{tor,norm}$. The total ion density $n_i$ encompasses both thermal
    and non-thermal (fast) ion contributions, summed over all charge states, providing
    a complete representation of the ion population''s radial structure as required
    by 1D transport equations.


    The quantity is defined as:


    $$

    \frac{d^2 n_i}{d\rho_\mathrm{tor,norm}^2}

    $$


    where $n_i$ is the total ion density and $\rho_\mathrm{tor,norm} \in [0, 1]$ is
    the normalized toroidal flux coordinate, with $\rho_\mathrm{tor,norm} = 0$ at
    the magnetic axis and $\rho_\mathrm{tor,norm} = 1$ at the last closed flux surface.
    Because $\rho_\mathrm{tor,norm}$ is dimensionless, this second derivative carries
    the same unit as the density itself.


    This curvature term arises in second-order spatial discretization of radial ion
    transport equations, where both first- and second-order derivatives are needed
    to evaluate diffusive flux terms accurately. It is computed numerically from the
    total ion density profile during transport solver iterations, complementing the
    [first radial derivative of total ion density](name:radial_derivative_of_total_ion_density).
    Analogous second-derivative quantities are defined for the fast-ion sub-population
    in [second_radial_derivative_of_fast_ion_density](name:second_radial_derivative_of_fast_ion_density)
    and for individual charge states in [second_radial_derivative_of_total_ion_state_density](name:second_radial_derivative_of_total_ion_state_density).


    Sign convention: Positive when the total ion density profile is concave upward
    as a function of increasing $\rho_\mathrm{tor,norm}$, i.e., when the local profile
    curvature $d^2 n_i / d\rho_\mathrm{tor,norm}^2 > 0$.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:radial_derivative_of_total_ion_density
  - name:second_radial_derivative_of_fast_ion_density
  - name:second_radial_derivative_of_total_ion_state_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density
    dd_path: transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density
    status: composed
- name: thermal_neutral_density
  kind: scalar
  status: draft
  description: Local number density of thermal (Maxwellian) neutral particles, summed
    over all internal quantum states of the neutral species.
  documentation: "Thermal neutral density is the local volumetric concentration of\
    \ neutral atoms or molecules with a Maxwellian velocity distribution, summed over\
    \ all internal quantum states of the neutral species. It represents the equilibrium-thermalized\
    \ component of the neutral population, distinct from fast non-Maxwellian neutrals\
    \ generated by charge exchange with energetic ions or neutral beam interactions.\n\
    \nThe quantity $n_{\\rm th,neutral}$ is defined as the zeroth velocity moment\
    \ of the Maxwellian distribution summed over internal states $s$:\n\n$$\nn_{\\\
    rm th,neutral} = \\sum_s \\int f_{{\\rm th},s}(\\mathbf{v}) \\, d^3v\n$$\n\nwhere\
    \ $f_{{\\rm th},s}(\\mathbf{v})$ is the Maxwellian velocity distribution function\
    \ for internal state $s$. The state-resolved quantity [thermal_neutral_state_density](name:thermal_neutral_state_density)\
    \ gives the contribution from each individual quantum level; summing over all\
    \ such states recovers $n_{\\rm th,neutral}$.\n\nThis population arises principally\
    \ from plasma recycling at plasma-facing surfaces, radiative recombination, and\
    \ molecular dissociation in the edge and scrape-off layer. Densities in this thermal\
    \ component are inferred from Balmer-series and Lyman-series emission spectroscopy\
    \ or neutral pressure gages, and computed by edge plasma transport codes coupling\
    \ fluid or kinetic neutral solvers with atomic physics databases.\n\nTypical values\
    \ range from $10^{16}$\u2013$10^{18}$ m$^{-3}$ in the scrape-off layer and divertor\
    \ to below $10^{15}$ m$^{-3}$ in the core of a fusion-grade tokamak plasma. The\
    \ complementary non-Maxwellian neutral population is described by [fast_neutral_density](name:fast_neutral_density);\
    \ their sum constitutes the full [neutral_density](name:neutral_density)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_neutral_density
  - name:neutral_density
  sources:
