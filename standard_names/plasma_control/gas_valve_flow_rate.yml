name: gas_valve_flow_rate
status: draft
cocos_transformation_type: one_like
description: Prescribed volumetric or particle flow rate through a gas injection valve
  used for plasma fueling or density control.
documentation: "The gas valve flow rate quantifies the rate at which neutral gas (typically\
  \ deuterium, but also impurity species for diagnostic or radiative-mantle purposes)\
  \ is injected into the vacuum vessel through a piezoelectric or pneumatic valve.\
  \ In the pulse-schedule context this is the reference waveform that the density-control\
  \ system commands; the actual flow rate is measured by calibrated pressure transducers\
  \ or thermal mass-flow meters downstream of the valve. Typical flow rates for main\
  \ fueling range from $10^{20}$ to $10^{22}$ particles per second (or equivalently\
  \ 1\u2013100 Pa\xB7m\xB3/s in throughput units). The unit here is dimensionless\
  \ (normalized to the valve's rated capacity). Feedback on line-integrated electron\
  \ density or Greenwald fraction adjusts this waveform in real time to maintain the\
  \ target density. See also line-integrated density references used as feedback signals."
