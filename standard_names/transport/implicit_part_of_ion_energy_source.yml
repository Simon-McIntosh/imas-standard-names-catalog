name: implicit_part_of_ion_energy_source
status: draft
cocos_transformation_type: one_like
description: Implicit coefficient of the ion energy source term, to be multiplied
  by the local ion energy to form the full source contribution.
documentation: In semi-implicit time-advance schemes for the ion energy transport
  equation, the source is split as $S_E = S_{\rm explicit} + S_{\rm implicit} \cdot
  E_i$, where $E_i$ is the primary energy variable (e.g. ion temperature or energy
  density) and $S_{\rm implicit}$ (unit $\mathrm{s^{-1}}$) is a linearized coefficient
  capturing the local sensitivity of the source to the solution. This decomposition
  improves numerical stability by moving stiff response terms to the left-hand side
  of the matrix equation. The implicit part is typically provided by heating and radiation
  models (NBI, ICRH, radiation loss) or by collision operators coupling ions and electrons.
  Values are problem-dependent and may be negative (energy sinks). See also the explicit
  counterpart and the total ion energy source profile.
