- name: poloidal_magnetic_flux_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at the radial location of the internal
    transport barrier (ITB), which defines the flux surface at the foot of the barrier.
  documentation: 'The poloidal magnetic flux $\psi_{\rm ITB}$ is the value of $\psi$
    on the flux surface that marks the onset of the internal transport barrier, a
    region of reduced turbulent transport in the plasma core. It is obtained from
    equilibrium reconstruction and serves as a radial coordinate reference for profiling
    transport coefficients and gradients across the barrier. Typical values in a tokamak
    with an ITB range from 0.2 to 0.8 of the poloidal flux at the separatrix, depending
    on barrier strength and heating power. This quantity is the natural companion
    to [poloidal_magnetic_flux_at_separatrix](name:poloidal_magnetic_flux_at_separatrix)
    and [normalized_poloidal_flux_coordinate_at_internal_transport_barrier](name:normalized_poloidal_flux_coordinate_at_internal_transport_barrier)
    for barrier characterisation, and relates to the magnetic shear via [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier).


    Sign convention: Positive when the poloidal flux $\psi$ increases radially outward
    from the magnetic axis across the barrier.'
  unit: Wb
  physics_domain: transport
