        structure.
      kind: llm
- name: voltage_of_correction_coil
  kind: scalar
  status: active
  description: Signed terminal voltage of a correction coil, including the resistive
    voltage drop and the inductive voltage associated with changes in coil currents.
  documentation: 'Signed terminal voltage of a correction coil is the electric potential
    difference across the terminals of a correction-coil winding, evaluated with a
    specified terminal polarity. A correction coil is a winding used to correct or
    control magnetic-field errors or perturbations; this quantity does not assume
    a particular spatial symmetry or toroidal mode number.


    For a lumped coupled-circuit representation, the terminal voltage of coil $k$
    is


    $$

    V_k = R_k I_k + L_k \frac{d I_k}{dt} + \sum_{j \ne k} M_{kj} \frac{d I_j}{dt}

    $$


    where $V_k$ is the terminal voltage, $R_k$ is the [resistance of the correction
    coil](name:resistance_of_correction_coil), $I_k$ and $I_j$ are coil currents,
    $L_k$ is the self-inductance of coil $k$, $M_{kj}$ is the signed mutual inductance
    coupling circuit $j$ to coil $k$, and $t$ is time.


    This quantity is a circuit terminal voltage, not a magnetic-field amplitude or
    a measure of the imposed perturbation. It excludes voltage drops in external leads,
    feedthroughs, or power-supply elements unless the reference terminals are defined
    to include those elements.


    Sign convention: Positive when the electric potential at the terminal where positive
    current enters the coil in the chosen winding orientation is greater than the
    electric potential at the terminal where it leaves.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_correction_coil
  - name:voltage_of_poloidal_field_coil
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-conductor-voltage
    dd_documentation:
      leaf: Voltage on the conductor terminals
      parent_path: coils_non_axisymmetric/coil/conductor
      parent: Set of conductors inside the coil. The structure can be used with size
        1 for a simplified description as a single conductor. A conductor is composed
        of several elements, serially connected, i.e. transporting the same current.
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Voltage measured across the terminals of a non-axisymmetric coil
        conductor. Time-resolved electrical parameter used to characterise the coil
        drive circuit and cross-check current waveforms in 3D field-shaping coil systems.
      kind: llm
  - dd_path: coils_non_axisymmetric/coil/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-voltage
    dd_documentation:
