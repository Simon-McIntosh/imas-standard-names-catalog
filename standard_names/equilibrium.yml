- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: Safety factor at the magnetic axis is the limiting value of the field-line
    pitch on the innermost closed magnetic flux surface, where the poloidal magnetic-flux
    gradient vanishes.
  documentation: 'Safety factor at the magnetic axis, often denoted $q_0$ or $q_\mathrm{axis}$,
    is the on-axis limit of the safety factor $q$. The safety factor expresses the
    field-line pitch on a closed magnetic flux surface: the number of toroidal turns
    made by a magnetic field line per poloidal circuit.


    For nested closed flux surfaces, the on-axis value can be defined from the flux-surface
    safety factor as


    $$

    q_0 = \lim_{\psi \to \psi_\mathrm{axis}} \frac{d\Phi_\mathrm{tor}}{d\psi}

    $$


    where $\Phi_\mathrm{tor}$ is the toroidal magnetic flux in Wb, $\psi$ is the poloidal
    magnetic flux in Wb, and $\psi_\mathrm{axis}$ is the poloidal magnetic flux at
    the magnetic axis.


    In practice, $q_0$ is obtained from equilibrium reconstruction by evaluating the
    reconstructed flux geometry and current distribution near the magnetic axis, then
    taking the innermost closed-flux-surface limit. It is sensitive to the central
    current density and is therefore less directly constrained by external magnetic
    measurements than edge or volume-integrated equilibrium quantities.


    Typical dimensionless values in tokamak equilibria are of order unity to several,
    rather than being fixed by a universal bound. Values close to low-order rational
    numbers, especially near one, are important for core magnetohydrodynamic stability.


    Sign convention: Positive when magnetic field lines advance in the direction of
    increasing toroidal angle $\phi$ for an advance in the positive poloidal angle
    $\theta$ in flux coordinates $(\psi, \theta, \phi)$, with $\phi$ increasing counter-clockwise
    when viewed from above $+\hat{Z}$.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_axis
    dd_path: equilibrium/time_slice/global_quantities/q_axis
    status: attached
  - id: dd:summary/local/magnetic_axis/q/value
    dd_path: summary/local/magnetic_axis/q/value
    status: attached
- name: safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  kind: scalar
  status: draft
  description: Safety factor evaluated on the closed flux surface where normalized
    poloidal magnetic flux is 0.95, commonly called q95.
  documentation: 'Safety factor at normalized poloidal magnetic flux equal to 0.95,
    commonly denoted $q_{95}$, is the value of the safety factor on the closed flux
    surface whose flux coordinate $\psi_N$ is 0.95. It measures how many toroidal
    turns a magnetic field line makes per poloidal turn near the plasma edge, while
    remaining inside the separatrix where X-point geometry can make the boundary value
    more sensitive. It is an edge-near complement to [safety_factor_at_plasma_boundary](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95)
    and [safety_factor_at_pedestal](name:safety_factor_at_pedestal).


    Using the safety-factor function as a function of normalized poloidal magnetic
    flux, the defining relation is


    $$

    q_{95} = q(\psi_N = 0.95) = \left.\frac{d\Phi_\mathrm{tor}}{d\psi}\right|_{\psi_N=0.95}

    $$


    where $\Phi_\mathrm{tor}$ is toroidal magnetic flux, $\psi$ is poloidal magnetic
    flux, and $\psi_N$ is normalized poloidal magnetic flux, equal to 0 at the magnetic
    axis and 1 at the boundary of closed flux surfaces. The derivative is dimensionless
    because both fluxes are measured in webers.


    In practice, $q_{95}$ is obtained from an axisymmetric magnetic equilibrium reconstruction
    constrained by magnetic diagnostics and, when available, pressure and current-distribution
    information. The reconstruction determines the relevant closed flux surface and
    the flux functions; $q(\psi_N)$ is then evaluated or interpolated at $\psi_N=0.95$.


    Typical tokamak values are about 2-8; H-mode and baseline scenarios often lie
    around 3-6, while low-current or high-safety-factor scenarios can exceed 8. Values
    close to low-order rational numbers, especially near 2 or 3, are important for
    global kink, tearing, and edge-stability limits.


    Sign convention: Positive when, moving outward across neighboring closed flux
    surfaces at $\psi_N=0.95$, the signed toroidal magnetic flux changes in the same
    sense as the signed poloidal magnetic flux.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_pedestal
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_95
    dd_path: equilibrium/time_slice/global_quantities/q_95
    status: attached
  - id: dd:summary/global_quantities/q_95/value
    dd_path: summary/global_quantities/q_95/value
    status: composed
