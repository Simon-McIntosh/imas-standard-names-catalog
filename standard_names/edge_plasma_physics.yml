  documentation: "Toroidal flux radius at the pedestal top is the non-negative, radius-like\
    \ label of the magnetic flux surface identified as the H-mode pedestal\u2019s\
    \ core-side shoulder. It is the pedestal-top value of the [toroidal flux radius](name:toroidal_flux_radius)\
    \ coordinate and provides an effective minor-radius scale rather than a cylindrical\
    \ major-radius coordinate.\n\nThe pedestal-top coordinate is defined by\n\n$$\n\
    \\rho_{\\mathrm{tor,ped}} = \\sqrt{\\frac{\\Phi_{\\mathrm{tor,ped}}}{\\pi B_0}}\n\
    $$\n\nwhere $\\Phi_{\\mathrm{tor,ped}}$ is the toroidal magnetic flux enclosed\
    \ by the pedestal-top flux surface, $B_0$ is the reference toroidal magnetic field,\
    \ and \u201Cped\u201D denotes evaluation at the pedestal top. The principal square\
    \ root is used.\n\nThis quantity is the value of the dimensional toroidal-flux\
    \ radial coordinate at the surface located by the [normalized poloidal flux coordinate\
    \ of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal). It differs\
    \ from [toroidal flux radius at the magnetic axis](name:toroidal_flux_radius_of_magnetic_axis)\
    \ and [toroidal flux radius at the plasma boundary](name:toroidal_flux_radius_at_plasma_boundary)\
    \ by its evaluation surface."
  unit: m
  physics_domain: edge_plasma_physics
  links:
