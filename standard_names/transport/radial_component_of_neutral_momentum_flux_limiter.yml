name: radial_component_of_neutral_momentum_flux_limiter
description: Dimensionless limiter coefficient that caps the radial component of the
  neutral momentum flux to prevent unphysical free-streaming transport.
documentation: "The radial neutral momentum flux limiter $\\alpha_n^{\\rm rad}$ (dimensionless)\
  \ multiplies the classical radial neutral momentum flux to enforce an upper bound\
  \ at the free-streaming limit $\\Pi_{\\rm fs} = n_n m_n c_n$, where $n_n$ is the\
  \ neutral density (m$^{-3}$), $m_n$ is the neutral mass (kg), and $c_n = \\sqrt{k_B\
  \ T_n / m_n}$ is the neutral thermal speed (m\\,s$^{-1}$). Values range from 0 (fully\
  \ suppressed transport) to 1 (no limitation); in practice, typical edge-code settings\
  \ use $\\alpha \\approx 0.1$\u2013$0.5$ to avoid artificial steepening of gradients\
  \ in regions of steep neutral density profiles. The limiter is particularly important\
  \ in fluid neutral models (e.g., SOLPS-ITER, SOLEDGE2D) where diffusive approximations\
  \ break down at low collisionality. See the corresponding ion flux limiter and parallel\
  \ momentum flux limiter for analogous quantities."
kind: vector_component
unit: '1'
status: draft
