- name: vertical_coordinate_of_second_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the second defining endpoint of a diagnostic
    line-of-sight chord, measured in the right-handed cylindrical $(R, \phi, Z)$ frame
    where $Z$ increases vertically upward.
  documentation: "The vertical coordinate $Z_2$ specifies the height of the second\
    \ endpoint that, together with the first endpoint, geometrically defines a diagnostic\
    \ line-of-sight chord through the plasma. The chord direction vector $\\hat{\\\
    ell} = (\\mathbf{r}_2 - \\mathbf{r}_1)/|\\mathbf{r}_2 - \\mathbf{r}_1|$ is fully\
    \ determined once both endpoints are known in the cylindrical $(R, \\phi, Z)$\
    \ frame, where $R$ is the major radius from the machine symmetry axis, $\\phi$\
    \ is the toroidal angle, and $Z$ is the vertical height. This coordinate is used\
    \ across a broad range of plasma diagnostics \u2014 including interferometers,\
    \ reflectometers, bolometers, and visible-light cameras \u2014 to specify the\
    \ chord geometry required for line-integrated signal inversion. The complementary\
    \ first-endpoint height is given by [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight),\
    \ and the toroidal orientation of the same second endpoint is encoded in [toroidal_angle_of_second_point_of_line_of_sight](name:toroidal_angle_of_second_point_of_line_of_sight).\
    \ Typical values span roughly $-2$ m to $+2$ m for medium-size tokamaks, covering\
    \ the full vertical extent of the plasma cross-section.\n\nSign convention: Positive\
    \ when $Z_2$ is above the machine midplane, i.e., in the direction of increasing\
    \ $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
