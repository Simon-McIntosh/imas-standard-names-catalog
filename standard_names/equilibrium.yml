- name: total_plasma_thermal_pressure
  kind: scalar
  status: draft
  description: Thermodynamic pressure entering equilibrium force balance, obtained
    by summing the thermal pressure contributions of all plasma particle species.
  documentation: 'Total plasma thermal pressure is the isotropic kinetic pressure
    carried by the thermal particle populations that enters magnetohydrodynamic force
    balance. It represents the species-summed nonmagnetic pressure term in the equilibrium
    relation $\nabla p = \mathbf{j} \times \mathbf{B}$, and corresponds closely to
    [total thermal plasma pressure] and its flux-surface form [total thermal plasma
    pressure of a flux surface].


    A common kinetic definition is


    $$

    p_{\mathrm{th}} = \sum_s p_s = \sum_s n_s k_B T_s

    $$


    where $p_{\mathrm{th}}$ is the total thermal pressure in Pa, $s$ labels thermal
    plasma species, $n_s$ is the species number density in m$^{-3}$, $T_s$ is the
    species temperature in K, and $k_B$ is Boltzmann''s constant. If temperatures
    are expressed as energy per particle, the factor $k_B T_s$ is replaced by that
    energy.


    It is inferred by combining kinetic measurements such as Thomson scattering, charge-exchange
    spectroscopy, interferometry, and ion-temperature diagnostics with equilibrium
    reconstruction constrained by magnetic measurements. The volume integral of this
    pressure contributes to [plasma stored energy](name:plasma_stored_energy), while
    its ratio to magnetic pressure is represented by [beta](name:beta).


    Representative core values are about $10^3$-$10^5$ Pa in present medium-size tokamaks
    and can approach $10^6$ Pa in high-performance reactor-scale scenarios; edge and
    scrape-off-layer pressures are much smaller.'
  unit: Pa
  physics_domain: equilibrium
