name: neutral_pumping_speed
status: draft
cocos_transformation_type: one_like
description: Rate of neutral particles of a given species permanently removed from
  the vessel volume by the pumping system.
documentation: 'The neutral pumping speed $\Gamma_{\mathrm{pump}}$ (in s$^{-1}$) is
  the effective particle exhaust rate achieved by cryopumps, turbomolecular pumps,
  or other vacuum systems. It represents the product of the effective pumping speed
  $S_{\mathrm{eff}}$ (in m$^3$ s$^{-1}$) and the neutral density at the pump duct
  entrance $n_{\mathrm{duct}}$ (in m$^{-3}$): $\Gamma_{\mathrm{pump}} = S_{\mathrm{eff}}
  \, n_{\mathrm{duct}}$. In the global particle balance, it is the primary exhaust
  term: $dN/dt = \Gamma_{\mathrm{puff}} + \Gamma_{n,\mathrm{wall}} - \Gamma_{n,\mathrm{plasma}}
  - \Gamma_{\mathrm{pump}}$, where $N$ is the total particle content. Typical values
  range from $10^{19}$ to $10^{22}$ s$^{-1}$ depending on plasma density and pump
  configuration; ITER''s cryopumps are designed for a deuterium throughput of order
  $200$ Pa m$^3$ s$^{-1}$ ($\sim 5 \times 10^{22}$ molecules s$^{-1}$). The quantity
  is measured from sub-divertor pressure gauges combined with calibrated pump-duct
  conductance. See `neutral_gas_puff_rate` for the complementary fueling rate and
  `neutral_particle_flux_from_wall` for the recycling contribution.'
