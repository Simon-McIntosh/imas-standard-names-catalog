name: radial_component_of_ion_momentum_flux_due_to_diamagnetic_drift
description: Radial projection of the ion momentum flux tensor arising from diamagnetic
  drift, driven by perpendicular pressure gradients in the ion fluid.
documentation: "The radial component of the ion momentum flux due to diamagnetic drift\
  \ represents the stress-tensor element $\\Pi_{r}^{\\mathrm{dia}}$ associated with\
  \ the diamagnetic flow $\\mathbf{v}_{\\mathrm{dia},i} = (\\mathbf{B} \\times \\\
  nabla p_i) / (Z_i e n_i B^2)$, where $p_i$ is the ion pressure in Pa, $n_i$ the\
  \ ion number density in m$^{-3}$, $Z_i$ the charge state, $e$ the elementary charge\
  \ in C, and $\\mathbf{B}$ the magnetic field in T. This flux quantifies the radial\
  \ transport of toroidal or poloidal momentum carried by the diamagnetic current\
  \ and enters the momentum balance equation alongside neoclassical, turbulent, and\
  \ viscous contributions. It is typically evaluated by neoclassical or gyrokinetic\
  \ transport codes on each flux surface, with values of order $10^{-3}$\u2013$10^{0}$\
  \ kg m$^{-1}$ s$^{-2}$ depending on the pressure gradient steepness. Related quantities\
  \ include the ion pressure gradient, ion diamagnetic velocity, and the total radial\
  \ momentum flux. The unit kg m$^{-1}$ s$^{-2}$ is equivalent to Pa, consistent with\
  \ a stress-tensor element."
kind: vector_component
unit: kg.m^-1.s^-2
status: draft
