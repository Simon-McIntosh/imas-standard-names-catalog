- name: wavelength_of_spectral_line
  kind: scalar
  status: active
  description: Characteristic vacuum wavelength assigned to an atomic, ionic, molecular,
    or nuclear spectral transition, identifying its central line position.
  documentation: 'The wavelength of a spectral line is the characteristic vacuum spectral
    coordinate of an emission or absorption transition. It identifies the central
    line position associated with the transition or processed spectral feature.


    For an unshifted transition, the vacuum wavelength is related to the transition
    energy by:


    $$

    \lambda_0 = \frac{hc}{\Delta E}

    $$


    where $\lambda_0$ is the unshifted vacuum wavelength, $h$ is Planck''s constant,
    $c$ is the speed of light in vacuum, and $\Delta E$ is the energy difference between
    the transition''s quantum states.


    The quantity applies to one identified atomic, ionic, molecular, or nuclear spectral
    line and is a central wavelength, not a wavelength interval, spectral width, or
    aggregate over multiple lines. Depending on the spectral-line definition, it may
    denote the unshifted transition reference or a central wavelength that includes
    a physical shift of the observed feature; it is not inherently a wavelength displacement.


    This quantity specializes the broader wavelength concept by locating a spectral
    transition. A displacement from a specified reference wavelength is represented
    separately by [difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line](name:difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: charge_exchange/channel/bes/transition_wavelength
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-bes-transition_wavelength
