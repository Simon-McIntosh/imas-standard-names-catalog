name: perpendicular_component_of_tendency_of_fast_electron_pressure
description: Time derivative of the fast (non-thermal) electron pressure projected
  perpendicular to the magnetic-field direction.
documentation: "This quantity is $\\partial p_{e,\\mathrm{fast},\\perp}/\\partial\
  \ t$, where $p_{e,\\mathrm{fast},\\perp}$ (Pa) is the perpendicular element of the\
  \ fast-electron pressure tensor relative to the local magnetic field $\\hat{b}$.\
  \ For anisotropic fast-electron distributions created by directed auxiliary heating\
  \ schemes (ECRH, LHCD), $p_{\\perp}$ and $p_{\\parallel}$ evolve on different time\
  \ scales due to pitch-angle scattering and collisional isotropization with characteristic\
  \ time $\\tau_{\\mathrm{iso}} \\sim \\tau_{ee} (v/v_{\\mathrm{th}})^3$, where $\\\
  tau_{ee}$ is the electron-electron collision time and $v_{\\mathrm{th}}$ is the\
  \ thermal speed. Transport solvers use this derivative to advance the perpendicular\
  \ pressure channel; values are typically $10^2$\u2013$10^4$ Pa s$^{-1}$ in auxiliary-heated\
  \ scenarios. The companion parallel component is `parallel_component_of_tendency_of_fast_electron_pressure`."
kind: vector_component
unit: Pa
status: draft
