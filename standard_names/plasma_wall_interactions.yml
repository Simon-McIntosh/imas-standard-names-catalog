- name: z_coordinate_of_divertor_target
  kind: scalar
  status: active
  description: Vertical Cartesian coordinate of the geometric center of a divertor
    target surface, identifying its location along the facility's vertical axis.
  documentation: 'The quantity is the vertical coordinate of the geometric center
    of a divertor target surface. It identifies the center point rather than the target''s
    vertical extent or surface outline.


    In the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, the coordinate
    is defined by


    $$

    z_{\mathrm{target}} = \mathbf{r}_{\mathrm{target}} \cdot \hat{\mathbf{z}}

    $$


    where $\mathbf{r}_{\mathrm{target}}$ is the position vector of the target surface
    center relative to the frame origin and $\hat{\mathbf{z}}$ is the vertical unit
    vector. The $z$ direction corresponds to $Z$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    Together with the [x coordinate of the divertor target](name:x_coordinate_of_divertor_target)
    and [y coordinate of the divertor target](name:y_coordinate_of_divertor_target),
    this quantity locates the target surface center. It is distinct from the [vertical
    length of the divertor target](name:vertical_length_of_divertor_target) and the
    [vertical outline of the divertor tile](name:vertical_outline_of_divertor_tile),
    which describe extent and boundary geometry rather than the center position.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:y_coordinate_of_divertor_target
  - name:vertical_length_of_divertor_target
