- name: thermal_plasma_pressure
  kind: scalar
  status: active
  description: Thermal plasma pressure is the equilibrium isotropic kinetic pressure
    of thermal electrons and ions, summed over represented ion species and excluding
    fast-particle contributions.
  documentation: 'Thermal plasma pressure is the isotropic kinetic pressure of thermal
    electron and ion populations in a fluid or magnetohydrodynamic description. It
    represents equilibrium mechanical stress from these populations and is not a perturbation
    amplitude.


    For the included thermal populations, the pressure is defined by


    $$

    p_{\rm th} = p_{e,\rm th} + \sum_{s \in \mathcal{I}} p_{s,\rm th}

    $$


    where $p_{\rm th}$ is the thermal plasma pressure, $p_{e,\rm th}$ is the thermal
    electron pressure, $p_{s,\rm th}$ is the thermal pressure of ion species $s$,
    and $\mathcal{I}$ is the set of represented ion species.


    The quantity applies to the thermal electron population and all represented thermal
    ion species, with ion contributions aggregated over the included species and charge
    states. It excludes fast-particle and other nonthermal contributions, neutral-particle
    pressure, magnetic pressure, dynamic ram pressure, anisotropic pressure components,
    and first-order pressure perturbations.


    Thermal plasma pressure is the thermal specialization of [plasma pressure](name:plasma_pressure),
    obtained by restricting the parent quantity to thermal electrons and ions. [Thermal
    ion pressure](name:thermal_ion_pressure) supplies the ion contribution in the
    defining sum, while the electron contribution is included separately.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_pressure
  arguments:
  - name: plasma_pressure
    operator: thermal
    operator_kind: qualifier
  sources:
