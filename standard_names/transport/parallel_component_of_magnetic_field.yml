name: parallel_component_of_magnetic_field
status: draft
description: Projection of the magnetic-field vector onto the direction parallel to
  the local field line, i.e. the magnetic-field magnitude $B = |\mathbf{B}|$.
documentation: "The parallel component of the magnetic field $B_\\parallel = \\mathbf{B}\
  \ \\cdot \\hat{b}$ (T), where $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$, is by definition\
  \ equal to the total magnetic-field magnitude $B = |\\mathbf{B}|$. In fusion-relevant\
  \ tokamak and stellarator plasmas, typical values range from 1\u20136 T on axis\
  \ for present-day devices and up to 12 T or more in high-field designs. This representation\
  \ is useful in field-aligned coordinate systems employed by edge transport codes\
  \ (e.g., SOLPS-ITER, EMC3-EIRENE), where grid-aligned decompositions separate parallel\
  \ and perpendicular dynamics. Because $B_\\parallel \\equiv |\\mathbf{B}|$ it is\
  \ non-negative by construction. The quantity is obtained from equilibrium reconstruction\
  \ or directly from magnetic diagnostics (Hall probes, pick-up coils). See `toroidal_component_of_magnetic_field`\
  \ and `poloidal_component_of_magnetic_field` for the cylindrical decomposition,\
  \ and `magnetic_field_magnitude` for the scalar equivalent."
validity_domain: ''
