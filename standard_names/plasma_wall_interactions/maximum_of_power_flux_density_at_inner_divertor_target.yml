name: maximum_of_power_flux_density_at_inner_divertor_target
status: draft
description: Maximum power flux density incident on the inner divertor target plate,
  characterizing the peak thermal load at the high-field-side strike zone.
documentation: "The peak power flux density $q_{\\rm peak,\\,inner}$ quantifies the\
  \ highest surface heat load on the inner (high-field-side) divertor target and is\
  \ a critical engineering constraint for plasma-facing component design and lifetime\
  \ assessment. Note: the DD unit is listed as W, which is inconsistent with a power\
  \ density (expected W\xB7m$^{-2}$); users should verify the unit against the source\
  \ data. In attached H-mode plasmas, typical peak values at the inner target range\
  \ from 1 to 10 MW\xB7m$^{-2}$, generally lower than the outer target due to the\
  \ in-out asymmetry of scrape-off layer (SOL) power sharing driven by $\\nabla B$\
  \ drift effects. This quantity is usually derived from infrared thermography, Langmuir\
  \ probe arrays, or integrated SOL transport codes such as SOLPS-ITER. The ratio\
  \ of inner-to-outer target peak heat flux is an important figure of merit for divertor\
  \ optimization; see the outer target counterpart for comparison."
