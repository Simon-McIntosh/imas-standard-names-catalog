- name: major_radius_of_third_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the third defining point of a diagnostic
    line-of-sight chord, defined as the perpendicular distance from the machine symmetry
    axis in the right-handed cylindrical (R, phi, Z) frame. Together with the corresponding
    vertical coordinate Z and toroidal angle phi of the same point, it fully specifies
    the third point of the chord geometry.
  documentation: "The major radius $R$ of the third point of a line of sight is defined\
    \ as\n$$R = \\sqrt{x^2 + y^2}$$\nwhere $x$ and $y$ are the Cartesian coordinates\
    \ in the horizontal plane. $R$ is intrinsically non-negative ($R \\geq 0$), measured\
    \ as the perpendicular distance from the machine symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above $+\\hat{Z}$, and $Z$ is the vertical\
    \ height.\n\nA three-point line-of-sight definition is used in diagnostic systems\
    \ such as polarimetry, interferometry, and bolometry to specify a chord geometry\
    \ with a third reference point beyond the first and second endpoints. This third\
    \ point may serve as an auxiliary reference for non-planar chords or to describe\
    \ the chord geometry in greater detail. Together with the vertical coordinate\
    \ $Z_3$ and toroidal angle $\\phi_3$ of the same third point, this coordinate\
    \ fully locates the third point in the machine frame.\n\nTypical values of $R$\
    \ for in-vessel chord points range from approximately 0.5 m to 10 m depending\
    \ on device size; for ITER-class machines the range is roughly 4\u20139 m.\n\n\
    The companion coordinates of the first and second line-of-sight points are given\
    \ by [major_radius_of_first_point_of_line_of_sight](name:major_radius_of_first_point_of_line_of_sight)\
    \ and [major_radius_of_second_point_of_line_of_sight](name:major_radius_of_second_point_of_line_of_sight).\
    \ The corresponding vertical coordinates are described by [vertical_coordinate_of_third_point_of_line_of_sight](name:vertical_coordinate_of_third_point_of_line_of_sight),\
    \ and the toroidal angle by [toroidal_angle_of_third_point_of_line_of_sight](name:toroidal_angle_of_third_point_of_line_of_sight)."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:toroidal_angle_of_first_point_of_line_of_sight
  - name:toroidal_angle_of_second_point_of_line_of_sight
  - name:major_radius_of_diagnostic_antenna_reference_point
