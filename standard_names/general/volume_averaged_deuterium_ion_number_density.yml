name: volume_averaged_deuterium_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of deuterium ions, a primary fuel-ion
  metric for fusion performance assessment.
documentation: "The volume-averaged deuterium ion number density $\\langle n_{\\mathrm{D}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{D}}(\\mathbf{r})\\, dV$ where $V$ is the\
  \ plasma volume in m$^3$ and $n_{\\mathrm{D}}$ is the local D$^+$ density in m$^{-3}$.\
  \ Deuterium is the dominant fuel species in present-day tokamak experiments; typical\
  \ volume-averaged densities are $2 \\times 10^{19}$\u2013$1 \\times 10^{20}$ m$^{-3}$\
  \ in standard H-mode operation. The quantity can be inferred from the electron density\
  \ profile (interferometry, Thomson scattering) corrected for impurity contributions\
  \ using $n_{\\mathrm{D}} = n_e - \\sum_j Z_j n_j$ (quasi-neutrality), or from neutron\
  \ rate analysis in D-D plasmas. For D-T operation, the D-to-T fuel ratio $n_{\\\
  mathrm{D}} / n_{\\mathrm{T}}$ directly controls the fusion power output via the\
  \ $\\langle \\sigma v \\rangle_{\\mathrm{DT}}$ reactivity. See also `volume_averaged_tritium_ion_number_density`\
  \ and `volume_averaged_deuterium_tritium_ion_number_density`."
