name: electron_density_pedestal_maximum_gradient_position
status: draft
cocos_transformation_type: one_like
description: Normalized poloidal flux coordinate at which the electron density gradient
  is steepest in the pedestal region.
documentation: "This quantity gives the position $\\psi_{N,\\mathrm{max\\_grad}}$\
  \ in normalized poloidal flux coordinates where $|\\partial n_e / \\partial \\psi_N|$\
  \ reaches its maximum within the pedestal, as determined by a modified hyperbolic\
  \ tangent (mtanh) fit to the electron density profile. For a standard mtanh parameterization\
  \ $n_e(\\psi_N) = n_{\\mathrm{ped}} \\cdot \\mathrm{mtanh}(\\alpha, z) + n_{\\mathrm{offset}}$,\
  \ this position corresponds approximately to the inflection point of the fit. Typical\
  \ values lie in the range $\\psi_N \\approx 0.94$\u2013$0.99$, with the exact location\
  \ depending on plasma shape, heating power, and fueling. It is an important input\
  \ for peeling-ballooning stability analysis, as the gradient location relative to\
  \ the separatrix affects the edge current density profile. Measured via Thomson\
  \ scattering or reflectometry profile fits. See also `electron_density_pedestal_position`\
  \ and `electron_density_pedestal_width`."
validity_domain: ''
