- name: temperature_at_limiter
  kind: scalar
  status: active
  description: Kinetic temperature of a specified plasma population or density-weighted
    local mixture evaluated on the plasma-facing side of a limiter.
  documentation: 'This quantity is the kinetic temperature of a plasma population
    or local population mixture at the plasma-facing side of a limiter, where open
    scrape-off-layer field lines terminate. It includes species-specific quantities
    such as [electron temperature at the limiter](name:electron_temperature_at_limiter)
    and density-weighted mixture quantities such as [average temperature at the limiter](name:average_temperature_at_limiter).


    For an isotropic population, the kinetic temperature is defined by


    $$

    \frac{3}{2} k_B T = \langle E_{\mathrm{rand}} \rangle

    $$


    where $k_B$ is Boltzmann''s constant, $T$ is the kinetic temperature, and $\langle
    E_{\mathrm{rand}} \rangle$ is the mean random kinetic energy per particle. For
    a mixture, the average temperature is density-weighted over the included populations.


    The quantity refers to the plasma side of the limiter and excludes the temperature
    of the solid limiter material. It is a local boundary-plasma quantity, distinct
    from [temperature at the plasma boundary](name:temperature_at_plasma_boundary)
    when that boundary is not the limiter.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_temperature_at_limiter
  - name:average_temperature_at_limiter
  - name:temperature_at_plasma_boundary
- name: average_temperature_at_limiter
  kind: scalar
  status: active
  description: Local density-weighted average temperature at the plasma-wall interface
    on the plasma-facing side of a limiter, where open scrape-off-layer field lines
    terminate on material surfaces.
  documentation: "Average temperature at the limiter is the local density-weighted\
    \ mean temperature of the plasma population on the plasma-facing side of a limiter\
    \ surface, at the plasma-wall interface where open scrape-off-layer magnetic field\
    \ lines intersect material structures. It characterizes the effective thermal\
    \ energy of the mixed plasma at the sheath edge, accounting for contributions\
    \ weighted by the local species densities, and is not the temperature of the solid\
    \ limiter material.\n\nThe density-weighted average temperature $T_\\text{avg}$\
    \ is defined as:\n\n$$\nT_\\text{avg} = \\frac{\\sum_s n_s T_s}{\\sum_s n_s}\n\
    $$\n\nwhere the sum runs over all plasma species $s$ in scope (ion species across\
    \ charge states, and potentially electrons), $n_s$ is the local number density\
    \ of species $s$ at the limiter-side plasma, and $T_s$ is the corresponding local\
    \ temperature of species $s$. The summation scope defines the sub-variant: [ion\
    \ average temperature at the limiter](name:ion_average_temperature_at_limiter)\
    \ restricts the average to ion species and charge states only.\n\nIn experiments\
    \ this quantity is inferred from combinations of Langmuir-probe current\u2013\
    voltage characteristics, edge spectroscopy, and scrape-off-layer transport modeling\
    \ constrained by edge and wall measurements, with corrections for sheath physics,\
    \ magnetic-field incidence angle, secondary electron emission, and collisionality.\n\
    \nTogether with [density_at_limiter](name:density_at_limiter), the average temperature\
    \ supports local pressure estimates at the limiter. It is one component of the\
    \ broader [temperature_at_limiter](name:temperature_at_limiter) family, which\
    \ also encompasses species-resolved temperatures such as [electron_temperature_at_limiter](name:electron_temperature_at_limiter)."
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_average_temperature_at_limiter
  - name:density_at_limiter
  - name:temperature_at_limiter
  - name:electron_temperature_at_limiter
  arguments:
  - name: temperature_at_limiter
    operator: average
    operator_kind: qualifier
- name: electron_temperature_at_limiter
  kind: scalar
  status: active
  description: Kinetic temperature of the electron population evaluated at the plasma-facing
    side of a limiter, where open scrape-off-layer field lines terminate.
  documentation: 'This quantity is the local kinetic temperature of the electron population
    at the plasma-wall interface on the plasma-facing side of a limiter, where open
    scrape-off-layer field lines terminate. It is the electron-specific member of
    [temperature at limiter](name:temperature_at_limiter).


    For an isotropic electron population, its temperature expressed in energy units
    is defined by


    $$

    T_e = \frac{2}{3}\langle E_{\mathrm{kin},e} \rangle

    $$


    where $T_e$ is the electron kinetic temperature and $\langle E_{\mathrm{kin},e}
    \rangle$ is the mean random kinetic energy per electron.


    The quantity refers to electrons on the plasma-facing side of the limiter interface
    and does not denote the temperature of the limiter material. It is distinct from
    the density-weighted population average [average temperature at limiter](name:average_temperature_at_limiter),
    which combines the relevant plasma populations.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:temperature_at_limiter
  - name:average_temperature_at_limiter
  arguments:
  - name: temperature_at_limiter
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/t_e/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-t_e-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/limiter/t_e
      parent: Electron temperature
      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: "Electron temperature (Te) at the limiter location. Provides a\
        \ local measure of the electron thermal energy at the plasma\u2013limiter\
        \ interface as part of the discharge summary."
      kind: template
- name: ion_average_temperature_at_limiter
  kind: scalar
  status: active
  description: Density-weighted mean kinetic temperature of all ion species and charge
    states on the plasma-facing side of a limiter, providing the ion component of
    the local average plasma temperature.
  documentation: 'The ion component of the local plasma temperature at a limiter is
    the density-weighted mean kinetic temperature of all positive ion species and
    charge states on the plasma-facing side of the limiter. It is the ion-specific
    component of [average temperature at the limiter](name:average_temperature_at_limiter).


    $$

    T_{i,\mathrm{avg}} = \frac{\sum_s \sum_q n_{s,q} T_{s,q}}{\sum_s \sum_q n_{s,q}}

    $$


    where $s$ indexes ion species, $q$ indexes their positive charge states, $n_{s,q}$
    is the corresponding ion number density, and $T_{s,q}$ is its kinetic temperature.
    The denominator is the [total ion density at the limiter](name:total_ion_density_at_limiter).


    This quantity includes all ion species and charge states in the local plasma population
    and excludes electrons, neutral particles, and the solid limiter material. It
    is distinct from [temperature at the limiter](name:temperature_at_limiter), which
    may denote a specified population or a different population aggregation.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:average_temperature_at_limiter
  - name:total_ion_density_at_limiter
  - name:temperature_at_limiter
  arguments:
  - name: average_temperature_at_limiter
    operator: ion
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/t_i_average/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-t_i_average-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/limiter/t_i_average
      parent: Ion temperature (average over ion species)
      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: Ion temperature (Ti) averaged over ion species at the limiter location.
        Groups the value, source, and uncertainty for this local plasma parameter
        summary quantity.
      kind: template
- name: toroidal_current_of_vacuum_vessel
  kind: scalar
  status: active
  description: Net conduction current circulating around the vacuum vessel, induced
    by time-varying magnetic flux linked with the vessel.
  documentation: 'This quantity is the net conduction current carried by the vacuum-vessel
    material in the toroidal direction. It represents an induced eddy current driven
    by changing magnetic flux linked with the conducting vessel, excluding currents
    in the plasma, external coils, and other conductors.


    The net current is the signed cross-sectional integral of the toroidal conduction-current
    density:


    $$

    I_{\mathrm{vessel}} = \int_S j_\phi\,\mathrm{d}S

    $$


    where $j_\phi$ is the toroidal component of the conduction-current density, $S$
    is a cross section of the vessel material normal to the toroidal direction, and
    $\mathrm{d}S$ is its area element. The toroidal direction is the direction of
    increasing $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$
    is major radius and $Z$ is vertical height. Faraday induction drives the current
    through the changing linked magnetic flux; its response is determined by the vessel''s
    electromagnetic impedance. This is a vessel-specific instance of [current of passive
    structure](name:current_of_passive_structure) and is distinct from [toroidal current
    of cryostat](name:toroidal_current_of_cryostat).


    Sign convention: Positive when the net conduction current points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.'
  unit: A
  physics_domain: plasma_wall_interactions
  links:
  - name:current_of_passive_structure
  - name:toroidal_current_of_cryostat
  sources:
  - dd_path: wall/description_2d/vessel/unit/element/j_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_2d-vessel-unit-element-j_phi
    dd_documentation:
      leaf: Toroidal current induced in this block element
      parent_path: wall/description_2d/vessel/unit/element
      parent: Set of block elements
      data_type: STRUCTURE
      unit: A
      lifecycle_status: obsolescent
      lifecycle_version: 4.1.0
    enhanced_context:
      description: Toroidal current (j_phi) induced in a block element of the vacuum
        vessel structure, representing eddy or inductively driven currents in the
        toroidal direction. Relevant for electromagnetic load analysis and disruption
        studies.
      kind: llm
  - dd_path: wall/global_quantities/current_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-global_quantities-current_phi
    dd_documentation:
      leaf: Toroidal current flowing in the vacuum vessel
      parent_path: wall/global_quantities
