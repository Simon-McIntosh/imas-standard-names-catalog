- name: radial_outline_of_antenna_strap
  kind: scalar
  status: active
  description: "Major-radius coordinate locating points on an ion-cyclotron antenna-strap\
    \ outline in the right-handed cylindrical (R, \u03C6, Z) frame; it is the non-negative\
    \ perpendicular distance from the toroidal symmetry axis."
  documentation: 'Major-radius coordinate locating points on an ion-cyclotron antenna-strap
    outline is the cylindrical coordinate $R$ of a point on the strap boundary in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It is the non-negative perpendicular
    distance from the toroidal symmetry axis to that outline point, not a vector component
    or a signed displacement.


    For an outline point with Cartesian coordinates $(x, y, z)$ in the right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame, with $\hat{z}$ vertical and $\hat{x}$
    and $\hat{y}$ horizontal, the major-radius coordinate is defined by:


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$ is the major-radius coordinate of the outline point, $x$ and $y$ are
    its horizontal Cartesian coordinates, and $z$ is its vertical Cartesian coordinate.


    The domain is $R \ge 0$, with $R = 0$ only on the toroidal symmetry axis. The
    quantity applies pointwise to the geometric outline of an antenna strap and specifies
    only the major-radius coordinate of the boundary; no averaging or aggregation
    over outline points is implied. It differs from the [radial coordinate of the
    antenna strap](name:radial_coordinate_of_antenna_strap), which locates the strap
    geometric center rather than each outline point.


    Together with the [toroidal angle of the antenna strap](name:toroidal_angle_of_antenna_strap)
    and the [vertical coordinate of the antenna-strap outline](name:vertical_outline_of_antenna_strap),
    it gives the cylindrical-coordinate location of the same outline point.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_antenna_strap
  sources:
  - dd_path: ic_antennas/antenna/module/strap/outline/r
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-outline-r
    dd_documentation:
      leaf: Major radius
      parent_path: ic_antennas/antenna/module/strap/outline
      parent: Strap outline
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: Major radius (R) coordinate of outline.
      kind: template
- name: reflected_phase_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Relative phase angle of a reflected radio-frequency power-wave phasor
    at an antenna element in an ion-cyclotron heating launcher, measured relative
    to the forward power-wave phasor of that same element.
  documentation: 'This quantity is the relative phase of a complex reflected radio-frequency
    power-wave phasor at a selected antenna strap or module with respect to the complex
    forward radio-frequency power-wave phasor of the same strap or module. It specifies
    the element-local reflection phase of an ion-cyclotron heating launcher rather
    than an absolute phase or an inter-element phase.


    For element $i$, the reflected phase is defined by


    $$

    \phi_{\mathrm{ref},i} = \arg\!\left(b_i^{\mathrm{ref}} (a_i^{\mathrm{fwd}})^*\right)
    \pmod{2\pi}

    $$


    where $\phi_{\mathrm{ref},i}$ is this reflected phase, $b_i^{\mathrm{ref}}$ is
    the complex reflected power-wave phasor at element $i$, $a_i^{\mathrm{fwd}}$ is
    the complex forward power-wave phasor at the same element, $(a_i^{\mathrm{fwd}})^*$
    is its complex conjugate, and $\arg$ extracts the phase angle. The phase is defined
    modulo $2\pi$.


    The scope is a single selected launcher strap or module and the pair of forward
    and reflected traveling power waves at the same element reference plane. The forward
    wave propagates toward the antenna element, and the reflected wave propagates
    away from the antenna element toward the feeding network. The first launcher element
    is not the phase reference for this quantity, and the quantity is not averaged
    or summed over launcher elements.


    This quantity is a reflected-wave member of the broader [phase of the ion-cyclotron
    heating antenna](name:phase_of_ion_cyclotron_heating_antenna) family. It is distinct
    from the [wave phase of the ion-cyclotron heating antenna](name:wave_phase_of_ion_cyclotron_heating_antenna),
    which describes inter-element phasing, and together with the [reflected power
    of the ion-cyclotron heating antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)
    it specifies the phase-and-magnitude state of the reflected power wave without
    including the magnitude itself.


    Sign convention: Positive when the reflected-wave phasor at the selected element
    leads the forward-wave phasor at the same element in phase under the adopted temporal
    phasor convention.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:forward_wave_phase_of_ion_cyclotron_heating_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  - name:wave_phase_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/module/phase_reflected
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/ic_antennas.html#ic_antennas-antenna-module-phase_reflected
    dd_documentation:
      leaf: Phase of the reflected power with respect to the forward power of this
        module
      parent_path: ic_antennas/antenna/module
      parent: Set of antenna modules (each module is fed by a single transmission
        line)
      data_type: STRUCTURE
      unit: rad
    enhanced_context:
      description: Phase of the reflected RF power wave relative to a reference for
        an individual ICRH antenna module. Used to characterise reflection and impedance
        matching in the antenna transmission line.
      kind: llm
- name: reflected_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Reflected power of an ion-cyclotron heating antenna is the backward-traveling
    radio-frequency power returned from one antenna toward the transmission-line source
    rather than coupled into the plasma.
  documentation: 'Reflected power of an ion-cyclotron heating antenna is the backward-traveling
    radio-frequency wave power at a defined reference plane on the feed line, directed
    away from the antenna toward the source. It is the returned component of the antenna-associated
    power and represents incident power rejected by antenna-plasma coupling.


    At a common reference plane, the reflected and forward traveling-wave powers are
    related by


    $$

    P_{\mathrm{ref}} = |\Gamma|^2 P_{\mathrm{fwd}}

    $$


    where $P_{\mathrm{ref}}$ is the reflected power, $\Gamma$ is the complex wave
    reflection coefficient, and $P_{\mathrm{fwd}}$ is the [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)
    traveling toward the antenna.


    This quantity applies to one ion-cyclotron heating antenna and represents the
    aggregate returned power associated with that antenna at the defined reference
    plane. When an antenna contains multiple modules, it is distinct from reflected
    power assigned to an individual module; it also excludes forward power, power
    coupled into the plasma, and source power not present at the reference plane.


    It complements [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)
    as the opposite traveling-wave component at the feed-line reference plane. The
    [launched power] is power delivered from the antenna into the plasma, so it is
    physically distinct from returned reflected power; the two quantities must not
    be identified or substituted for one another.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/module/power_reflected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-power_reflected
    dd_documentation:
      leaf: Reflected power
      parent_path: ic_antennas/antenna/module
      parent: Set of antenna modules (each module is fed by a single transmission
        line)
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Reflected RF power at an ICRH antenna module, i.e. the power travelling
        back from the antenna toward the transmission line source. A key quantity
        for assessing coupling efficiency and antenna matching.
      kind: llm
  - dd_path: ic_antennas/antenna/power_reflected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-power_reflected
    dd_documentation:
      leaf: Reflected power
      parent_path: ic_antennas/antenna
      parent: Set of Ion Cyclotron antennas
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Reflected power from an ion cyclotron (IC) antenna, representing
        the fraction of forward power not coupled into the plasma. Used to assess
        ICRH antenna-plasma coupling efficiency alongside forward and launched power
        measurements.
      kind: llm
- name: root_mean_square_of_wave_current_of_antenna_strap
  kind: scalar
  status: active
  description: Effective non-negative magnitude of the radio-frequency current oscillating
    along a single ion-cyclotron-heating antenna strap.
  documentation: 'The root-mean-square wave current is the effective magnitude of
    the oscillatory radio-frequency current carried by one ion-cyclotron-heating antenna
    strap during wave excitation. It is a non-negative scalar that represents the
    current waveform over an RF cycle.


    For an RF period, the RMS current is defined by


    $$

    I_{\mathrm{RMS}} = \sqrt{\frac{1}{T_{\mathrm{RF}}}\int_{0}^{T_{\mathrm{RF}}} i^2(t)\,dt}

    $$


    where $I_{\mathrm{RMS}}$ is the RMS wave current, $i(t)$ is the instantaneous
    wave current in the strap, $t$ is time, and $T_{\mathrm{RF}}$ is the RF period.
    The time origin is arbitrary within the period.


    The quantity applies to a single antenna strap and averages over one RF period;
    it is not a sum over straps or antenna modules. It describes the strap-conductor
    current associated with the launched wave and excludes plasma current and non-wave
    direct current.


    It is the RMS transformation of the underlying [wave current of antenna strap](name:wave_current_of_antenna_strap).
    Unlike that parent quantity, it does not retain instantaneous sign or phase. For
    sinusoidal excitation, it equals the peak current magnitude divided by the square
    root of two and therefore differs from the [wave current of antenna strap amplitude](name:wave_current_of_antenna_strap_amplitude).'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:wave_current_of_antenna_strap_amplitude
  sources:
  - dd_path: ic_antennas/antenna/module/strap/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-current
    dd_documentation:
      leaf: Root mean square current flowing along the strap
      parent_path: ic_antennas/antenna/module/strap
      parent: Set of IC antenna straps
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Root mean square (RMS) current flowing along an ion cyclotron resonance
        heating (ICRH) antenna strap, characterizing the RF current amplitude used
        to excite the electromagnetic wave field for plasma heating.
      kind: llm
- name: toroidal_angle_of_antenna_strap
  kind: scalar
  status: active
  description: "Toroidal angular coordinate of each antenna-strap outline point around\
    \ the machine symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The toroidal angle is the azimuthal coordinate assigned to each\
    \ point on the geometric outline of an antenna strap. It identifies the point\u2019\
    s circumferential location in the right-handed cylindrical $(R,\\phi,Z)$ frame,\
    \ where $R$ is major radius measured from the machine symmetry axis, $\\phi$ is\
    \ toroidal angle, and $Z$ is vertical height.\n\nThis quantity applies to individual\
    \ strap-outline points and is not a mean, sum, nominal center coordinate, or mechanical\
    \ orientation angle. No aggregation over the outline is implied; each point retains\
    \ its own $\\phi$ value.\n\nTogether with the other coordinates of the outline,\
    \ this angle locates the strap geometry. It is distinct from the [radial coordinate\
    \ of the antenna strap](name:radial_coordinate_of_antenna_strap), which locates\
    \ a strap reference point, while [vertical outline of the antenna strap](name:vertical_outline_of_antenna_strap)\
    \ provides the corresponding signed vertical coordinate for outline points. The\
    \ same angular-coordinate concept is used for a different object by [toroidal\
    \ angle of a coil conductor element](name:toroidal_angle_of_coil_conductor_element).\n\
    \nSign convention: Positive when the angular displacement from the chosen $\\\
    phi=0$ reference is toward increasing toroidal angle $\\phi$, counter-clockwise\
    \ when viewed from above $+Z$."
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:radial_coordinate_of_antenna_strap
  - name:vertical_outline_of_antenna_strap
  sources:
  - dd_path: ic_antennas/antenna/module/strap/outline/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-outline-phi
    dd_documentation:
