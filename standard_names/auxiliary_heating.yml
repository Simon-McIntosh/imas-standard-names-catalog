    $Z$ is the height above or below the machine midplane.
  documentation: "The vertical coordinate $Z$ specifies the height of a measurement\
    \ position in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is\
    \ the major radius from the machine symmetry axis, $\\phi$ is the toroidal angle\
    \ increasing counter-clockwise when viewed from above, and $Z$ is the vertical\
    \ height in meters. This generic locus token applies across multiple diagnostic\
    \ systems \u2014 including reflectometers, interferometers, ECE radiometers, flux\
    \ loops, and barometry gages \u2014 where the measurement position is defined\
    \ by a single spatial point rather than an endpoint of a line of sight. Typical\
    \ values range from approximately $-2$ m to $+2$ m for medium-to-large tokamaks,\
    \ with $Z = 0$ at the machine midplane. For more precisely defined geometric loci\
    \ on diagnostic lines of sight, see [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight),\
