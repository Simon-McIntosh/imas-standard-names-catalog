- name: flux_surface_averaged_ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius
  kind: scalar
  status: active
  description: Flux-surface-averaged magnetic-geometry coefficient measuring the squared
    toroidal-flux-coordinate gradient relative to the squared major radius.
  documentation: 'This quantity is a magnetic-geometry metric coefficient that characterizes
    how a toroidal-flux radial coordinate varies across nested magnetic surfaces,
    with the variation weighted by inverse squared major radius.


    It is defined by


    $$

    g_2 = \left\langle \frac{|\nabla \rho|^2}{R^2} \right\rangle_{\mathrm{FS}}

    $$


    where $g_2$ is the flux-surface-averaged metric coefficient, $\rho$ is the toroidal-flux
    radial coordinate, $\nabla\rho$ is its spatial gradient, $|\nabla\rho|$ is the
    gradient magnitude, $R$ is the major radius, and the subscript $\mathrm{FS}$ denotes
    the prescribed average over a complete magnetic flux surface.


    The quantity applies to an equilibrium magnetic flux surface and represents an
    aggregate over that surface rather than a pointwise local value. It has no species,
    population, or transport-channel restriction.


    It is the flux-surface average of the local ratio defined by [ratio of square
    of toroidal flux coordinate gradient magnitude to square of major radius](name:ratio_of_square_of_toroidal_flux_coordinate_gradient_magnitude_to_square_of_major_radius).
    Unlike [flux-surface-averaged square of toroidal flux coordinate gradient magnitude](name:flux_surface_averaged_square_of_toroidal_flux_coordinate_gradient_magnitude),
