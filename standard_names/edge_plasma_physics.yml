- name: helium_3_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of helium-3 ions evaluated at the pedestal top, where
    the steep-gradient edge transport barrier transitions toward the flatter core
    plasma.
  documentation: "Helium-3 density at the pedestal is the local number density of\
    \ helium-3 ions evaluated at the pedestal top, the core-side shoulder of the H-mode\
    \ edge transport barrier where the steep edge density gradient transitions toward\
    \ the flatter confined core plasma. This quantity is summed over all ionization\
    \ states of helium-3 (He$^{1+}$ through He$^{2+}$) unless a specific charge state\
    \ is explicitly identified, and is a member of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ species family.\n\nThe charge-state-summed number density is:\n\n$$\nn_{\\mathrm{He3,ped}}\
    \ = \\sum_{q=1}^{2} n_{\\mathrm{He3}^{q+}}(\\psi_{\\mathrm{ped}})\n$$\n\nwhere\
    \ $n_{\\mathrm{He3}^{q+}}$ is the local number density of helium-3 ions in charge\
    \ state $q$, evaluated on the pedestal-top flux surface $\\psi_{\\mathrm{ped}}$\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame.\n\nHelium-3 appears in\
    \ fusion plasmas as a minority ion cyclotron resonance heating (ICRH) species,\
    \ as a deliberate fuel constituent in D\u2013He3 experiments, or as a product\
    \ of tritium decay ($^3\\mathrm{H} \\to {^3}\\mathrm{He}$). Its pedestal-top concentration\
    \ influences $Z_\\mathrm{eff}$, fuel dilution, and edge impurity transport modeling.\
    \ The analogous quantity for helium-4 ash is [helium_4_density_at_pedestal_top](name:helium_4_density_at_pedestal_top),\
    \ and the helium-3 density at the internal transport barrier is tracked separately\
    \ as [helium_3_density_at_internal_transport_barrier](name:helium_3_density_at_internal_transport_barrier).\
    \ Measurement is achieved via active charge-exchange recombination spectroscopy\
    \ or passive helium-line emission spectroscopy."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:helium_4_density_at_pedestal_top
  - name:helium_3_density_at_internal_transport_barrier
  arguments:
  - name: density_at_pedestal_top
    operator: helium_3
    operator_kind: qualifier
- name: helium_3_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of helium-3 ions (the stable helium isotope with mass
    number 3) evaluated at the plasma boundary, the last closed flux surface separating
    the magnetically confined plasma from the scrape-off layer.
  documentation: "Helium-3 ($^3$He) is the stable helium isotope with two protons\
    \ and one neutron (mass number 3, charge number 2). This quantity gives the number\
    \ of $^3$He ions per unit volume evaluated at the plasma boundary, defined as\
    \ the last closed flux surface (separatrix) that divides the closed-field-line\
    \ confined region from the open-field-line scrape-off layer. It is the helium-3\
    \ specialization of [density_at_plasma_boundary](name:density_at_plasma_boundary).\n\
    \nHelium-3 enters tokamak plasmas either as a minority heating species in ion\
    \ cyclotron resonance heating schemes, where a small $^3$He fraction resonates\
    \ efficiently with the ICRH wave, or as a fuel ion in D-$^3$He burn scenarios.\
    \ In both cases, the boundary density is a key parameter for edge particle balance\
    \ and fuel-purity assessment. Boundary values are inferred from charge-exchange\
    \ recombination spectroscopy using $^3$He spectral lines or from edge transport\
    \ modeling constrained by particle flux boundary conditions.\n\nTypical $^3$He\
    \ boundary densities in minority-heating scenarios lie in the range $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$, well below the separatrix electron density of $10^{19}$\u2013\
    $10^{20}$ m$^{-3}$. The corresponding core value is captured by [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis),\
    \ the pedestal-top value by [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal_top),\
    \ and the downstream target value by [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target),\
    \ together forming a complete radial survey of $^3$He ion density from core to\
    \ divertor."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:helium_3_density_at_magnetic_axis
  - name:helium_3_density_at_divertor_target
