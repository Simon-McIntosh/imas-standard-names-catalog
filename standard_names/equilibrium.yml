- name: elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Elongation (\u03BA) of the plasma boundary cross-section, defined\
    \ as the ratio of the vertical half-height to the minor radius of the last closed\
    \ flux surface."
  documentation: "The elongation $\\kappa$ at the plasma boundary quantifies the vertical\
    \ stretching of the last closed flux surface (LCFS), defined as $\\kappa = b/a$\
    \ where $b$ is the vertical half-height (semi-axis) and $a$ is the horizontal\
    \ minor radius of the plasma cross-section. This dimensionless shaping parameter\
    \ is fundamental to tokamak design: higher $\\kappa$ (typically 1.5\u20132.0 in\
    \ modern H-mode devices, reaching up to 2.2 in advanced configurations) improves\
    \ energy confinement and MHD stability by increasing plasma volume at fixed minor\
    \ radius. The boundary elongation is distinguished from profile-averaged elongation\
    \ since it characterizes the outermost flux surface, which directly influences\
    \ the divertor geometry and scrape-off-layer topology. It is extracted from equilibrium\
    \ reconstruction codes using external magnetic measurements and, where available,\
    \ motional Stark effect or polarimetry data; the reconstructed plasma boundary\
    \ contour in the cylindrical $(R, \\phi, Z)$ frame yields $b$ and $a$ directly.\
    \ Asymmetric configurations (single-null divertor) may exhibit upper and lower\
    \ elongation components that together characterize the full boundary shape, complementing\
    \ the global [elongation](name:elongation) and shaping parameters such as [minimum_triangularity_of_plasma_boundary](name:minimum_triangularity_of_plasma_boundary).\n\
    \nSign convention: Positive when the vertical half-height $b$ exceeds zero, which\
    \ holds for any physically realizable plasma cross-section."
  unit: '1'
  physics_domain: equilibrium
  links:
