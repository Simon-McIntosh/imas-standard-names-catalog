- name: vertical_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic field vector onto the vertical (Z) axis
    in the right-handed cylindrical frame.
  documentation: The vertical magnetic field $B_Z = \mathbf{B} \cdot \hat{Z}$ is the
    component of the total magnetic field along the vertical axis, completing the
    cylindrical decomposition alongside the radial ($B_R$) and toroidal ($B_\phi$)
    components. In a tokamak equilibrium, $B_Z$ contributes to the poloidal field
    and is essential for reconstructing the poloidal flux surfaces that confine the
    plasma. The quantity is typically inferred from external magnetic measurements
    (poloidal field coils, flux loops) combined with equilibrium reconstruction codes,
    and it varies across the poloidal cross-section. On the 2D equilibrium grid, $B_Z$
    is computed at every spatial point, reflecting the shaping effect of external
    poloidal field coils. See also the radial and toroidal components, [radial_magnetic_field](name:radial_magnetic_field)
