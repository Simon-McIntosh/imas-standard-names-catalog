- name: lithium_density_at_limiter
  kind: scalar
  status: active
  description: Local number density of lithium ions in the boundary plasma immediately
    adjacent to a plasma-facing limiter surface, summed over all positive ionization
    states and excluding neutral lithium atoms.
  documentation: 'Lithium density at a limiter is the local number density of lithium
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance.


    $$

    n_{\mathrm{Li}}(\mathbf{r}_L)=\frac{dN_{\mathrm{Li}}}{dV}

    $$


    where $n_{\mathrm{Li}}$ is the lithium-ion number density in m$^{-3}$, $N_{\mathrm{Li}}$
    is the counted number of lithium ions, $V$ is volume in m$^3$, and $\mathbf{r}_L$
    is the evaluation position in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius in m, $\phi$ is toroidal angle in radians, and $Z$ is
    vertical height in m.


    The quantity is summed over all positive lithium ionization states and excludes
    neutral lithium atoms. It is the lithium-specific specialization of [density at
    a limiter](name:density_at_limiter) and differs from the broader [ion density
    at a limiter](name:ion_density_at_limiter), which does not select lithium.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
