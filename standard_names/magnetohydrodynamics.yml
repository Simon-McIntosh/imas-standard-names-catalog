    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/runaway_electrons.html#runaway_electrons-global_quantities-volume_average-ddensity_dt_tritium
    dd_documentation:
