  kind: scalar
  status: active
  description: Toroidal bulk-flow velocity of beryllium ions at the core-side shoulder
    of the H-mode edge transport barrier, density-weighted over all ionization states.
  documentation: 'This quantity is the toroidal component of the beryllium impurity-ion
    bulk-flow velocity at the core-side shoulder of the H-mode edge transport barrier,
    conventionally called the pedestal top.


    The charge-state aggregation is defined by


    $$

    V_{\mathrm{Be},\phi} = \frac{\sum_z n_{\mathrm{Be},z} v_{\mathrm{Be},z,\phi}}{\sum_z
    n_{\mathrm{Be},z}}

    $$


    where $z$ indexes the included beryllium ion charge states, $n_{\mathrm{Be},z}$
    is the corresponding number density in m$^{-3}$, and $v_{\mathrm{Be},z,\phi}$
    is the charge-state-resolved toroidal velocity in m s$^{-1}$. The result is a
    density-weighted intensive mean, not a sum of charge-state velocities; the corresponding
    elemental concentration is represented by [beryllium density at the pedestal top](name:beryllium_density_at_pedestal_top).
    It is evaluated at the pedestal top rather than at the magnetic axis, as in [toroidal
    beryllium velocity at the magnetic axis](name:toroidal_beryllium_velocity_at_magnetic_axis).


    Sign convention: Positive when the beryllium bulk flow has a component in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
