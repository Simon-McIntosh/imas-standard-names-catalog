- name: gap_at_plasma_boundary
  kind: scalar
  status: active
  description: Gap at the plasma boundary is the geometric distance from the closest-wall
    point to the plasma boundary. It quantifies the clearance between the nearest
    wall location and the outermost closed flux surface.
  documentation: 'Gap at the plasma boundary is the geometric distance from the closest-wall
    point to the plasma boundary. The plasma boundary is the outermost closed flux
    surface that bounds the confined plasma.


    Let $W$ be the wall surface from which the closest-wall point is selected and
    let $\Gamma_b$ denote the plasma-boundary surface. The gap $g$ is defined as the
    minimum Euclidean separation between these surfaces:


    $$

    g = \min_{\mathbf{x}_w \in W,\ \mathbf{x}_b \in \Gamma_b} \left\lVert \mathbf{x}_w
    - \mathbf{x}_b \right\rVert

    $$


    where $\mathbf{x}_w$ and $\mathbf{x}_b$ are physical position vectors on the wall
    and plasma-boundary surfaces, respectively, and the norm is the Euclidean distance
    in physical space. A minimizing point on $W$ is the closest-wall point, and the
    corresponding line segment to $\Gamma_b$ is the geometric separation whose length
    is $g$.


    The value is non-negative and is zero only when the closest-wall point lies on
    the plasma boundary. It denotes wall-plasma clearance, not the coordinates of
    the closest-wall point, a flux-coordinate difference, a prescribed wall-normal
    or flux-surface-normal projection, or the [radius of plasma boundary](name:radius_of_plasma_boundary).'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radius_of_plasma_boundary
  - name:electron_density_at_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/boundary/closest_wall_point/distance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-closest_wall_point-distance
    dd_documentation:
