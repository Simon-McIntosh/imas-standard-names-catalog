name: vertical_component_of_current_density_due_to_perpendicular_viscosity
status: draft
description: Vertical ($Z$) projection of the current density driven by the perpendicular
  component of the viscosity tensor.
documentation: This quantity gives the $Z$-component of the current density $\mathbf{j}_{\perp,\mathrm{visc}}$
  originating from perpendicular (cross-field) viscous stress in the plasma. Perpendicular
  viscosity arises from ion Larmor-radius effects and anomalous cross-field momentum
  transport; the associated stress tensor component $\pi_{\perp}$ generates a current
  density of order $j_{\perp,\mathrm{visc}} \sim \nabla \cdot \boldsymbol{\pi}_{\perp}
  / (n_e e)$, where $n_e$ is the electron density and $e$ is the elementary charge.
  In the collisional Braginskii framework, perpendicular viscosity coefficients scale
  as $\eta_{\perp} \propto n_i T_i \tau_i \rho_i^2 / \tau_i^2 \Omega_i^2$ (with $\rho_i$
  the ion gyroradius and $\Omega_i$ the ion cyclotron frequency), making this term
  subdominant in well-magnetized regions but potentially important in low-field zones
  near null points. Edge transport codes compute this on generalized grids; typical
  magnitudes remain below those of the parallel viscosity contribution except locally
  near the X-point and outer divertor target. See also the parallel and heat-flux
  viscosity companion components for the complete decomposition.
