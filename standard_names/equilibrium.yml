- name: safety_factor
  kind: scalar
  status: draft
  description: Field-line helicity on nested magnetic flux surfaces, giving the toroidal
    winding per poloidal circuit and controlling resonant MHD behavior.
  documentation: "The safety factor $q$ measures the helicity of magnetic field lines\
    \ on nested equilibrium flux surfaces. It is the toroidal winding number per single\
    \ poloidal circuit and identifies rational surfaces where $q=m/n$ can resonate\
    \ with tearing, kink, or Alfv\xE9nic perturbations. Its extrema are often analyzed\
    \ together with [poloidal magnetic flux at minimum safety factor].\n\nA common\
    \ flux definition is\n\n$$\nq = \\frac{d\\Phi_{\\mathrm{tor}}}{d\\Phi_{\\mathrm{pol}}}\n\
    $$\n\nwhere $\\Phi_{\\mathrm{tor}}$ is toroidal magnetic flux and $\\Phi_{\\mathrm{pol}}$\
    \ is poloidal magnetic flux linked to the same family of flux surfaces. Equivalently,\
    \ $q$ is obtained from the field-line pitch determined by the equilibrium [magnetic\
    \ field](name:magnetic_field) and the geometry of each flux surface.\n\nSafety\
    \ factor values are reconstructed from magnetic equilibrium analysis constrained\
    \ by external magnetic sensors, polarimetry, motional-Stark-effect measurements,\
    \ and pressure information. In tokamak cores, $q$ near the magnetic axis is often\
    \ 0.7-2, while edge values used for stability assessment are commonly 3-7; reversed-shear\
    \ scenarios may have an off-axis minimum.\n\nSign convention: Positive when a\
    \ magnetic field line advances in the direction of increasing toroidal angle $\\\
    phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame during one circuit\
    \ in the positive poloidal direction around the magnetic axis."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/q
    dd_path: equilibrium/time_slice/profiles_1d/q
    status: composed
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: Field-line winding number in the infinitesimal flux-surface limit at
    the magnetic axis, governing central magnetic helicity and kink stability.
  documentation: 'The safety factor at the magnetic axis is the limiting value of
    the field-line winding number on nested equilibrium flux surfaces as the surface
    shrinks to the magnetic axis. It is the central value of the broader [safety factor](name:safety_factor)
    distribution and strongly influences sawtooth behavior, internal kink stability,
    and the relation to [minimum safety factor](name:minimum_safety_factor).


    For nested flux surfaces, the safety factor is defined by the signed flux derivative


    $$

    q = \frac{d\Phi_{\mathrm{tor}}}{d\Phi_{\mathrm{pol}}}

    $$


    where $\Phi_{\mathrm{tor}}$ is toroidal magnetic flux and $\Phi_{\mathrm{pol}}$
    is poloidal magnetic flux; the magnetic-axis value is the limit of this expression
    as the enclosed flux surface area tends to zero.


    It is computed from magnetohydrodynamic equilibrium reconstruction constrained
    by external magnetic measurements and, when available, internal pitch-angle information
    from polarimetry or motional-Stark-effect diagnostics. Its radial variation connects
    directly to [magnetic shear](name:magnetic_shear), while edge stability studies
    often compare the axis value with [safety factor at normalized poloidal flux].


    Typical central values range from 0.7-1.2 in sawtoothing tokamak plasmas and from
    1.2-3 in reversed-shear or advanced scenarios.


    Sign convention: Positive when the field-line helicity advances in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame for a positive poloidal circuit around the magnetic axis.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:minimum_safety_factor
  - name:magnetic_shear
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_axis
    dd_path: equilibrium/time_slice/global_quantities/q_axis
    status: composed
- name: safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  kind: scalar
  status: draft
  description: Field-line helicity evaluated on the near-edge closed flux surface
    whose normalized poloidal magnetic flux is 0.95.
  documentation: 'This quantity is the edge-near value of the [safety factor](name:safety_factor),
    evaluated on the closed flux surface where the normalized poloidal magnetic flux
    coordinate has value 0.95. It is commonly denoted $q_{95}$ and summarizes magnetic-field-line
    winding close to the last closed flux surface, where it strongly affects kink,
    peeling-ballooning, and edge-localized-mode stability. The equivalent surface
    is referenced by [safety factor of the ninety-five percent normalized poloidal
    magnetic flux surface].


    The defining evaluation is


    $$

    q_{95} = q(\psi_N = 0.95) = \left.\frac{d\Phi_{\rm tor}}{d\Phi_{\rm pol}}\right|_{\psi_N=0.95}

    $$


    where $q$ is the field-line safety factor, $\psi_N$ is normalized poloidal magnetic
    flux with axis value 0 and boundary value 1, and $\Phi_{\rm tor}$ and $\Phi_{\rm
    pol}$ are toroidal and poloidal magnetic fluxes.


    In practice, $q_{95}$ is obtained from magnetic-equilibrium reconstruction constrained
    by external magnetic probes and, when available, internal constraints such as
    motional Stark effect polarimetry or Faraday rotation. Its radial variation is
    linked to [magnetic shear](name:magnetic_shear), while flux-surface locations
    such as [poloidal magnetic flux at minimum safety factor] help identify the broader
    $q$ structure.


    Representative values are 3-6 in conventional H-mode tokamak operation and 4-8
    in higher-edge-safety-factor advanced scenarios; values near or below 2 at the
    edge are associated with stronger global MHD constraints.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
  - name:magnetic_shear
- name: surface_area_of_flux_surface
  kind: scalar
  status: draft
  description: Surface area of a closed magnetic flux surface in an equilibrium plasma,
    equal to the geometric area swept out by that nested surface. It is non-negative
    and independent of the coordinates used to parameterize the surface.
  documentation: 'Surface area of a flux surface is the total geometric area of a
    closed nested magnetic surface in an equilibrium plasma. It is an invariant property
    of the surface itself: different choices of flux label, poloidal angle, toroidal
    angle, or mesh parameterization describe the same area when they trace the same
    physical surface.


    For a surface $\\Sigma$ parameterized by coordinates $u$ and $v$ with position
    vector $\\mathbf{x}(u,v)$, the area is


    $$

    A = \\int_\\Sigma dA = \\int \\left| \\frac{\\partial \\mathbf{x}}{\\partial u}
    \\times \\frac{\\partial \\mathbf{x}}{\\partial v} \\right| \, du \, dv

    $$


    where $dA$ is the physical surface element and the absolute value makes the result
    independent of the orientation of the parameterization. In an axisymmetric equilibrium
    described in the right-handed cylindrical $(R, \\phi, Z)$ system, where $R$ is
    major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height, this can
    be evaluated by rotating the poloidal contour about the symmetry axis, equivalently
    using the local element $2\\pi R\,dl$ along the contour. In a fully three-dimensional
    equilibrium, the same definition is evaluated from the metric of the closed surface
    in explicitly chosen flux coordinates such as $(\\rho, \\theta, \\phi)$ or from
    a triangulated geometric representation.


    The area is computed from equilibrium reconstructions or magnetic-surface geometry
    by integrating the surface metric on each flux surface. It is commonly used with
    enclosed volume and flux-surface averages to characterize radial geometry, transport
    normalization, and the mapping between flux coordinates and physical space.


    Typical values range from about 1-50 m^2 for compact tokamak plasmas, 50-500 m^2
    for medium and large tokamaks, and can exceed 1000 m^2 for very large or highly
    shaped configurations.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:area_of_flux_surface
  - name:volume_of_flux_surface
  - name:normalized_toroidal_flux_coordinate
  - name:surface_area_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/surface
    dd_path: equilibrium/time_slice/profiles_1d/surface
    status: composed
- name: surface_area_of_plasma_boundary
  kind: scalar
  status: draft
  description: Total area of the toroidal last-closed flux surface that separates
    confined plasma from the surrounding open-field-line region.
  documentation: 'The plasma-boundary surface area is the geometric area of the closed
    toroidal surface that encloses the confined plasma. It differs from the [poloidal
    cross-sectional area](name:area_of_plasma_boundary), which measures the area inside
    the boundary contour in a poloidal plane, and it is closely related to the enclosed
    [plasma volume](name:volume_of_plasma_boundary).


    For an axisymmetric boundary described by a closed poloidal contour in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height, the surface area is


    $$

    A_{\mathrm{surf}} = 2\pi \oint_{\partial\Omega} R\, dl

    $$


    where $A_{\mathrm{surf}}$ is the boundary surface area in m$^2$, $\partial\Omega$
    is the plasma-boundary contour, and $dl$ is the poloidal arc-length element in
    meters.


    The quantity is computed from equilibrium reconstruction by identifying the outermost
    closed flux surface and integrating its reconstructed contour. Magnetic measurements,
    pressure constraints, and internal magnetic diagnostics constrain the boundary
    shape; shape parameters such as [inner triangularity](name:inner_triangularity),
    [outer triangularity](name:outer_triangularity), and [elongation](name:elongation)
    influence the resulting area.


    Typical values range from about 20-80 m$^2$ in medium-size tokamaks and can exceed
    600 m$^2$ in reactor-scale devices, depending mainly on major radius, minor radius,
    elongation, and triangularity.


    Sign convention: Positive when the boundary surface element is counted with the
    outward normal enclosing the confined plasma.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:area_of_plasma_boundary
  - name:volume_of_plasma_boundary
  - name:inner_triangularity
  - name:outer_triangularity
  - name:elongation
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/surface
    dd_path: equilibrium/time_slice/global_quantities/surface
    status: composed
- name: toroidal_beta
  kind: scalar
  status: draft
  description: Ratio of volume-averaged perpendicular plasma pressure to the magnetic
    pressure of the reference toroidal field.
  documentation: 'Toroidal beta measures how strongly the plasma pressure loads the
    equilibrium compared with the magnetic pressure associated with the reference
    toroidal field. It is the toroidal-field-referenced component of [beta](name:beta),
    distinct from [normalized beta], which rescales beta by plasma current and size
    for stability comparisons.


    A common equilibrium definition uses the volume average of the total perpendicular
    pressure over the confined plasma volume:


    $$

    \beta_{\mathrm{tor}} = \frac{2\mu_0}{B_0^2 V}\int_V p_\perp\,dV

    $$


    where $p_\perp$ is the total perpendicular plasma pressure in Pa, $V$ is the confined
    plasma volume in m$^3$, $B_0$ is the reference toroidal magnetic field in T, and
    $\mu_0$ is the vacuum permeability. The reference field is associated with the
    toroidal direction of the right-handed cylindrical $(R, \phi, Z)$ system, where
    $R$ is major radius and $Z$ is vertical height.


    Toroidal beta is computed from pressure profiles combined with an equilibrium
    reconstruction that supplies the plasma volume and reference magnetic field. The
    pressure input is constrained by kinetic diagnostics such as Thomson scattering,
    charge-exchange spectroscopy, interferometry, and bremsstrahlung or soft-X-ray
    measurements, while the equilibrium geometry is constrained by magnetic measurements.


    Representative tokamak values are about 0.005-0.05 in many L-mode and H-mode plasmas,
    with high-performance scenarios reaching 0.05-0.10. Larger values indicate stronger
    pressure loading relative to the toroidal magnetic pressure and are closely tied
    to global MHD stability limits.


    Sign convention: Positive when the volume-averaged perpendicular plasma pressure
    is positive relative to the positive magnetic-pressure reference $B_0^2/(2\mu_0)$.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:beta
  sources:
  - id: dd:core_profiles/global_quantities/beta_tor
    dd_path: core_profiles/global_quantities/beta_tor
    status: attached
  - id: dd:equilibrium/time_slice/global_quantities/beta_tor
    dd_path: equilibrium/time_slice/global_quantities/beta_tor
    status: composed
- name: toroidal_flux_radius
  kind: scalar
  status: draft
  description: Minor-radius-like coordinate that labels nested equilibrium flux surfaces
    by the square root of enclosed toroidal magnetic flux.
  documentation: 'The toroidal flux radius is a radial flux-surface label proportional
    to the square root of the [toroidal magnetic flux](name:toroidal_magnetic_flux)
    enclosed by a nested equilibrium surface. It behaves like a minor radius for nearly
    circular tokamak plasmas and is the dimensional counterpart of the [normalized
    toroidal flux coordinate](name:normalized_toroidal_flux_coordinate).


    A common definition is


    $$

    \rho_{\mathrm{tor}} = \sqrt{\frac{\Phi_{\mathrm{tor}}}{\pi B_{0}}}

    $$


    where $\rho_{\mathrm{tor}}$ is the toroidal flux radius, $\Phi_{\mathrm{tor}}$
    is the enclosed toroidal magnetic flux in Wb, and $B_{0}$ is the reference vacuum
    toroidal magnetic field in T used for the conversion to a length scale.


    The quantity is computed from magnetic-equilibrium reconstruction by integrating
    the toroidal magnetic field over the poloidal cross-section bounded by each flux
    surface. At the outer plasma edge it corresponds to the [toroidal flux radius
    of the plasma boundary](name:toroidal_flux_radius_of_plasma_boundary); core values
    range from near 0 at the magnetic axis to about 0.5-2 m at the boundary in present
    tokamaks.


    Sign convention: Positive when the coordinate increases outward from the magnetic
    axis as the enclosed toroidal magnetic flux has the same sign as the reference
    toroidal magnetic field.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_flux
  - name:normalized_toroidal_flux_coordinate
  - name:toroidal_flux_radius_of_plasma_boundary
  sources:
  - id: dd:core_profiles/profiles_1d/grid/rho_tor
    dd_path: core_profiles/profiles_1d/grid/rho_tor
    status: composed
  - id: dd:equilibrium/time_slice/profiles_1d/rho_tor
    dd_path: equilibrium/time_slice/profiles_1d/rho_tor
    status: composed
- name: toroidal_flux_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Minor-radius-like flux coordinate locating the selected plasma boundary
    by the square root of enclosed toroidal magnetic flux.
  documentation: 'The toroidal flux radius at the plasma boundary is the radial-like
    coordinate assigned to the last closed flux surface from the toroidal magnetic
    flux enclosed by that surface. It is a flux-surface label rather than a direct
    geometric half-width, so it complements the shape-based [minor radius of the plasma
    boundary](name:minor_radius_of_plasma_boundary).


    A common definition relates the boundary value $\rho_{\rm tor,b}$ to the enclosed
    toroidal flux $\Phi_{\rm tor,b}$:


    $$

    \rho_{\rm tor,b} = \sqrt{\frac{|\Phi_{\rm tor,b}|}{\pi B_{\rm ref}}}

    $$


    where $\Phi_{\rm tor,b}$ is the [toroidal magnetic flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary),
    and $B_{\rm ref}$ is a reference toroidal magnetic-field magnitude used to convert
    flux to a length scale. The same boundary surface can also be labeled by [poloidal
    magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary)
    or by the [normalized poloidal flux coordinate of the plasma boundary](name:normalized_poloidal_flux_coordinate_of_plasma_boundary).


    It is computed from magnetic equilibrium reconstruction after identifying the
    selected plasma boundary, using magnetic measurements and, when available, internal
    constraints such as polarimetry or motional-Stark-effect data. Representative
    boundary values range from about 0.2-1.0 m in compact or spherical tokamaks to
    1-3 m in large tokamak plasmas.


    Sign convention: Positive when the toroidal flux radius increases outward from
    the magnetic axis to the selected plasma boundary.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  - name:toroidal_magnetic_flux_at_plasma_boundary
  - name:poloidal_magnetic_flux_at_plasma_boundary
  - name:normalized_poloidal_flux_coordinate_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/rho_tor
    dd_path: equilibrium/time_slice/boundary/rho_tor
    status: attached
  - id: dd:equilibrium/time_slice/global_quantities/rho_tor_boundary
    dd_path: equilibrium/time_slice/global_quantities/rho_tor_boundary
    status: composed
- name: toroidal_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic-field vector onto the toroidal direction
    encircling the machine symmetry axis.
  documentation: 'The toroidal magnetic field is the component of the [magnetic field](name:magnetic_field)
    parallel to the toroidal basis direction in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. In axisymmetric tokamaks it is usually the dominant magnetic-field
    component and sets the main gyrofrequency scale, while [radial magnetic field](name:radial_magnetic_field)
    represents a perpendicular component relevant to field errors and equilibrium
    force balance.


    The component is defined by projection of the vector field onto the toroidal unit
    vector:


    $$

    B_\phi = \mathbf{B} \cdot \hat{\phi}

    $$


    where $B_\phi$ is the toroidal magnetic-field component, $\mathbf{B}$ is the full
    magnetic-field vector, and $\hat{\phi}$ points in the direction of increasing
    toroidal angle.


    It is computed from equilibrium reconstruction, magnetic-field models, toroidal-field
    coil currents, and magnetic diagnostics such as pickup coils, flux loops, polarimetry,
    and motional-Stark-effect constraints. The value at a special location is distinguished
    by [toroidal magnetic field at magnetic axis](name:toroidal_magnetic_field_at_magnetic_axis),
    while flux-surface quantities such as [toroidal magnetic flux](name:toroidal_magnetic_flux)
    integrate magnetic field over an area rather than projecting the local vector
    field.


    Representative values are 1-6 T in present tokamaks and may approach higher fields
    in compact high-field devices; away from strong plasma-current corrections the
    vacuum contribution scales approximately as $1/R$ with major radius.


    Sign convention: Positive when $B_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field_at_magnetic_axis
  - name:toroidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/profiles_2d/b_field_phi
    dd_path: equilibrium/time_slice/profiles_2d/b_field_phi
    status: composed
- name: toroidal_magnetic_field_at_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal component of the equilibrium magnetic field at the magnetic
    axis, setting the signed on-axis field direction and strength for nested flux
    surfaces.
  documentation: 'This quantity is the value of the toroidal magnetic-field component
    on the magnetic axis, the innermost point of the nested equilibrium flux surfaces.
    It is the on-axis evaluation of the broader [toroidal magnetic field](name:toroidal_magnetic_field)
    and is tied geometrically to the axis location described by [major radius of magnetic
    axis](name:major_radius_of_magnetic_axis).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ major radius, $\phi$
    toroidal angle, and $Z$ vertical height, the defining projection is


    $$

    B_{\phi,\mathrm{axis}} = \mathbf{B}(R_{\mathrm{axis}}, Z_{\mathrm{axis}}) \cdot
    \hat{\phi}

    $$


    where $\mathbf{B}$ is the magnetic-field vector and $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle.


    It is obtained from equilibrium reconstruction constrained by magnetic probes,
    flux loops, polarimetry, motional-Stark-effect measurements, and the imposed toroidal-field-coil
    current. It helps set the normalization and helicity of flux-surface quantities
    such as [poloidal magnetic flux at magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    and [toroidal magnetic flux](name:toroidal_magnetic_flux).


    Representative on-axis tokamak values are 1-6 T in present devices and about 5
    T in reactor-scale scenarios, with reversed-field operation carrying the opposite
    sign.


    Sign convention: Positive when the toroidal magnetic field points in the direction
    of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_field
  - name:major_radius_of_magnetic_axis
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:toroidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/magnetic_axis/b_field_phi
    dd_path: equilibrium/time_slice/global_quantities/magnetic_axis/b_field_phi
    status: composed
- name: toroidal_magnetic_flux
  kind: scalar
  status: draft
  description: Magnetic flux of the toroidal field through the poloidal cross-section
    enclosed by an equilibrium flux surface.
  documentation: 'Toroidal magnetic flux is the part of the [magnetic-flux vector](name:magnetic_flux)
    associated with magnetic field crossing a poloidal cross-section of a nested equilibrium
    flux surface. It is an integrated quantity, unlike the local [toroidal magnetic
    field](name:toroidal_magnetic_field), and it provides the dimensional basis for
    the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate).


    For an axisymmetric equilibrium in the right-handed cylindrical $(R, \phi, Z)$
    basis, it can be written as


    $$

    \Phi_{\mathrm{tor}}(\psi)=\int_{S_p(\psi)} \mathbf{B}\cdot\hat{\phi}\,dA

    $$


    where $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux in Wb, $S_p(\psi)$ is
    the poloidal cross-section bounded by the flux surface labeled by poloidal flux
    $\psi$, $\mathbf{B}$ is the magnetic-field vector, $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle, and $dA$ is an area element in
    the poloidal plane. Its radial variation is closely related to field-line pitch
    and therefore to the [safety factor](name:safety_factor).


    The quantity is computed from equilibrium reconstructions by integrating the reconstructed
    toroidal field over the flux-surface cross-section, using magnetic diagnostics
    and internal constraints such as polarimetry or motional-Stark-effect measurements
    when available. Representative absolute values are about 1-20 Wb in medium-size
    tokamaks and can exceed 100 Wb in reactor-scale devices, depending mainly on toroidal
    field strength and [area of the flux surface](name:area_of_flux_surface). A separated
    contribution, when needed, is described by [toroidal magnetic flux due to poloidal
    current](name:toroidal_magnetic_flux_due_to_poloidal_current).


    Sign convention: Positive when the magnetic field crossing a constant-toroidal-angle
    poloidal cross-section points in the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ basis.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux
  - name:toroidal_magnetic_field
  - name:normalized_toroidal_flux_coordinate
  - name:safety_factor
  - name:area_of_flux_surface
  - name:toroidal_magnetic_flux_due_to_poloidal_current
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/phi
    dd_path: equilibrium/time_slice/profiles_1d/phi
    status: composed
  - id: dd:equilibrium/time_slice/profiles_2d/phi
    dd_path: equilibrium/time_slice/profiles_2d/phi
    status: composed
- name: toroidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux of the toroidal magnetic field through the poloidal cross-section
    enclosed by the plasma boundary.
  documentation: 'Toroidal magnetic flux at the plasma boundary is the total flux
    associated with the toroidal magnetic field through the poloidal cross-section
    enclosed by the boundary surface. In equilibrium analysis this boundary is commonly
    interpreted as the last closed flux surface or separatrix, and the value provides
    the outer reference for the [toroidal flux radius of the plasma boundary](name:toroidal_flux_radius_of_plasma_boundary).


    For an axisymmetric plasma in the right-handed cylindrical $(R, \phi, Z)$ frame,
    the boundary value may be written as an area integral over a poloidal cross-section
    $S_b$ enclosed by the boundary:


    $$

    \Phi_{\mathrm{tor},b} = \int_{S_b} \mathbf{B} \cdot d\mathbf{S}_{\phi}

    $$


    where $\Phi_{\mathrm{tor},b}$ is the boundary toroidal magnetic flux, $\mathbf{B}$
    is the magnetic-field vector, and $d\mathbf{S}_{\phi}$ is the directed surface
    element normal to the toroidal direction. It is complementary to the [poloidal
    magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary),
    which labels nested magnetic surfaces and is often used for radial equilibrium
    coordinates.


    The value is obtained from magnetic-equilibrium reconstruction constrained by
    external magnetic probes, flux loops, plasma current measurements, and internal
    constraints when available. Typical magnitudes range from a few Wb in compact
    devices to several hundred Wb in large, high-field tokamaks, scaling approximately
    with toroidal field strength and the cross-sectional area enclosed by the plasma
    boundary.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:toroidal_flux_radius_of_plasma_boundary
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/phi
    dd_path: equilibrium/time_slice/boundary/phi
    status: composed
- name: toroidal_magnetic_flux_due_to_poloidal_current
  kind: scalar
  status: draft
  description: Toroidal flux threading the plasma-boundary poloidal cross-section
    from the magnetic field generated by plasma poloidal current.
  documentation: 'This quantity is the toroidal component of the magnetic flux contribution
    produced by plasma poloidal current. It isolates the part of the flux budget associated
    with the poloidal-current source, in contrast to total boundary fluxes or flux
    contributions from external conductors. It is the toroidal projection of [magnetic_flux_due_to_poloidal_current](name:magnetic_flux_due_to_poloidal_current)
    and is closely related to the field component described by [toroidal_magnetic_field](name:toroidal_magnetic_field).


    For a poloidal cross-section $S_p$ bounded by the selected plasma boundary, the
    toroidal flux contribution may be written as


    $$

    \Phi_{\mathrm{tor}}^{(J_p)} = \int_{S_p} B_{\phi}^{(J_p)} \, dS_p

    $$


    where $\Phi_{\mathrm{tor}}^{(J_p)}$ is the toroidal flux contribution, $B_{\phi}^{(J_p)}$
    is the toroidal magnetic-field component generated by plasma poloidal current,
    and $dS_p$ is the oriented poloidal-area element whose normal is $+\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.


    It is computed in equilibrium reconstruction from the inferred current distribution
    and magnetic boundary geometry, constrained by magnetic probes, flux loops, polarimetry,
    and pressure-profile information. Boundary shape quantities such as [area_of_plasma_boundary](name:area_of_plasma_boundary)
    affect the integration surface, while magnetic structure quantities such as [magnetic_shear](name:magnetic_shear)
    and [internal_inductance](name:internal_inductance) constrain the current and
    field distribution that generate the flux.


    Typical absolute magnitudes range from fractions of a Wb in small tokamaks to
    several tens of Wb in large, high-current devices, depending on plasma current,
    pressure, shaping, and the selected boundary surface.


    Sign convention: Positive when the poloidal-current-generated magnetic field threads
    the oriented poloidal cross-section in the direction of increasing toroidal angle
    $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux_due_to_poloidal_current
  - name:toroidal_magnetic_field
  - name:area_of_plasma_boundary
  - name:magnetic_shear
  - name:internal_inductance
  sources:
  - id: dd:equilibrium/time_slice/boundary/phi_poloidal_current
    dd_path: equilibrium/time_slice/boundary/phi_poloidal_current
    status: composed
- name: toroidal_plasma_current
  kind: scalar
  status: draft
  description: Net electric current carried by charged particles around the torus,
    obtained by integrating the toroidal current density over the plasma cross-section.
  documentation: 'Toroidal plasma current is the net charge flow circulating in the
    toroidal direction of a magnetically confined plasma. It is the integrated counterpart
    of [toroidal plasma current density](name:toroidal_plasma_current_density) and
    is closely related to [plasma current], which is often used for the same global
    equilibrium current.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius,
    $\phi$ the toroidal angle, and $Z$ the vertical coordinate, it is defined by integrating
    the toroidal component of the current density over the poloidal plasma cross-section:


    $$

    I_\phi = \int_{S_p} \mathbf{j}(R,Z) \cdot \hat{\phi}\, dR\,dZ

    $$


    where $I_\phi$ is the toroidal plasma current, $\mathbf{j}$ is the electric-current-density
    vector, $\hat{\phi}$ is the toroidal unit vector, and $S_p$ is the plasma cross-section
    bounded by the last closed flux surface or separatrix.


    It is measured directly by Rogowski coils and constrained in equilibrium reconstruction
    by magnetic probes, flux loops, polarimetry, and motional-Stark-effect measurements.
    The radial distribution of the current affects [internal inductance](name:internal_inductance),
    and its centroid is summarized by [major radius of current center](name:major_radius_of_current_center).


    Representative values range from 0.1-2 MA in medium-size tokamaks, several MA
    in large present devices, and about 10-15 MA in reactor-scale scenarios.


    Sign convention: Positive when the plasma current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:toroidal_plasma_current_density
  - name:internal_inductance
  - name:major_radius_of_current_center
- name: toroidal_plasma_current_density
  kind: scalar
  status: draft
  description: Projection of the plasma charge-flow density onto the toroidal direction,
    separating the current that circulates around the device from poloidal or field-aligned
    flow.
  documentation: 'Toroidal plasma current density is the $\\hat{\\phi}$ projection
    of the local current-density vector carried by charged particles in the plasma.
    It is the component of [plasma current density](name:plasma_current_density) that
    drives the equilibrium poloidal magnetic field and controls current-profile effects
    such as [internal inductance](name:internal_inductance) and the [major radius
    of the current center](name:major_radius_of_current_center).


    The local projection in the right-handed cylindrical $(R, \\phi, Z)$ frame, where
    $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height, is


    $$

    j_\\phi = \\mathbf{J} \\cdot \\hat{\\phi}

    $$


    where $\\mathbf{J}$ is the plasma current-density vector and $\\hat{\\phi}$ is
    the unit vector in the direction of increasing toroidal angle. For flux-surface
    quantities, this component is often represented by an appropriate flux-surface
    average of the toroidal projection.


    It is inferred from equilibrium reconstruction constrained by magnetic probes,
    flux loops, motional-Stark-effect polarimetry, and kinetic pressure information;
    consistency with [magnetic field](name:magnetic_field) follows from Ampere''s
    law. Ohmic current drive relates it to the [toroidal electric field](name:toroidal_electric_field)
    through the plasma conductivity, while bootstrap and auxiliary current drive modify
    its radial distribution.


    Typical core values are about $10^5$-$10^7$ A m$^{-2}$ in present tokamaks, with
    higher values in compact high-field plasmas and lower values near the plasma edge.


    Sign convention: Positive when positive charge current density points in the direction
    of increasing toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi,
    Z)$ frame.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:plasma_current_density
  - name:internal_inductance
  - name:major_radius_of_current_center
  - name:magnetic_field
  - name:toroidal_electric_field
