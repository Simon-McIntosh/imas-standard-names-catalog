- name: tungsten_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the tungsten ion population evaluated at
    the magnetic axis is the local tungsten-ion count per physical volume at that
    location, summed over all positive ionic charge states.
  documentation: 'Particle number density of the tungsten ion population evaluated
    at the magnetic axis is the local tungsten-ion count per physical volume at that
    location, summed over all positive ionic charge states. It represents tungsten
    ions specifically, rather than electrons, other ion species, or neutral tungsten.


    The charge-state aggregation is defined by


    $$

    n_{W,\mathrm{axis}} = \sum_{q=1}^{q_{\max}} n_{W^{q+},\mathrm{axis}}

    $$


    where $n_{W,\mathrm{axis}}$ is the tungsten ion number density at the magnetic
    axis, $W$ denotes tungsten, $q$ is the positive integer ionic charge state, $q_{\max}$
    is the highest included tungsten charge state, and $n_{W^{q+},\mathrm{axis}}$
    is the number density of tungsten ions in charge state $q$ at the magnetic axis.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete positively charged tungsten-ion population at that location,
    summed over charge states; it is neither a flux-surface or volume integral nor
    the density of neutral tungsten or one individual charge state.


    This is the tungsten-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It differs from [xenon density
    at the magnetic axis](name:xenon_density_at_magnetic_axis), which applies the
    same local, charge-state-summed convention to xenon ions instead of tungsten ions.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:xenon_density_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/tungsten/value
    version: 4.1.0
- name: xenon_density_at_magnetic_axis
  kind: scalar
  status: active
  description: Particle number density of the xenon ion population evaluated at the
    magnetic axis is the local xenon-ion count per physical volume at that location,
    summed over all xenon ionization states.
  documentation: 'Particle number density of the xenon ion population evaluated at
    the magnetic axis is the local xenon-ion count per physical volume at that location.
    It represents xenon ions specifically, rather than neutral xenon, electrons, or
    another ion species.


    The defining relation is


    $$

    n_{\mathrm{Xe,axis}} = \left.\frac{dN_{\mathrm{Xe}}}{dV}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{Xe,axis}}$ is the xenon-ion number density at the magnetic axis,
    $N_{\mathrm{Xe}}$ is the number of xenon ions summed over all xenon ionization
    states, and $V$ is physical volume.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete xenon-ion population at that location and is charge-state-summed;
    it is neither a density of neutral xenon nor an integral over a flux surface or
    volume.


    This is the xenon-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It is the on-axis counterpart
    of [xenon density](name:xenon_density), which applies at a general plasma location,
    and it is distinguished from [argon density at the magnetic axis](name:argon_density_at_magnetic_axis),
    which counts a different ion species.'
  unit: m^-3
  physics_domain: transport
  links:
