- name: time_derivative_of_bremsstrahlung_count_at_detector_pixel
  kind: scalar
  status: active
  description: Detected visible-bremsstrahlung count rate accumulated by a single
    detector pixel, representing photoelectron-equivalent events rather than plasma
    photon emissivity.
  documentation: 'This quantity is the detected visible-bremsstrahlung count rate
    associated with one detector pixel. It represents photoelectron-equivalent detection
    events produced by the accepted bremsstrahlung continuum, not the local photon
    emissivity of the plasma.


    The rate is defined from the accumulated bremsstrahlung count by


    $$

    r_{\mathrm{brem}} = \frac{dN_{\mathrm{brem}}}{dt}

    $$


    where $N_{\mathrm{brem}}$ is the accumulated photoelectron-equivalent count, $t$
    is elapsed time measured in seconds, and $r_{\mathrm{brem}}$ is the corresponding
    detection rate. The count is the accumulated quantity being differentiated; this
    name does not denote the derivative of an already defined rate.


    The pixel-local detected rate is distinct from the plasma source quantity [bremsstrahlung
    spectral emissivity](name:bremsstrahlung_spectral_emissivity), which describes
    photon emission per volume, spectral interval, and solid angle. It is analogous
    in detection semantics to the [photon-equivalent count rate](name:flux_of_spectrometer_channel)
    of a spectrometer channel.'
  unit: s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:flux_of_spectrometer_channel
  sources:
  - dd_path: bremsstrahlung_visible/channel/intensity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/bremsstrahlung_visible.html#bremsstrahlung_visible-channel-intensity
    dd_documentation:
      leaf: Intensity, i.e. number of photoelectrons detected by unit time, taking
        into account electronic gain compensation and channels relative calibration
      parent_path: bremsstrahlung_visible/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: STRUCTURE
      unit: s^-1
    enhanced_context:
      description: Photoelectron detection rate (intensity) for a visible bremsstrahlung
        channel, corrected for electronic gain and relative channel calibration. Used
        as input to derive line-averaged effective charge (Zeff) from continuum emission.
      kind: llm
- name: toroidal_angular_width_of_camera
  kind: scalar
  status: active
  description: "Full angular span of a camera field of view in the toroidal direction\
    \ of the right-handed cylindrical (R, \u03C6, Z) frame, equal to the non-negative\
    \ difference between the largest and smallest unwrapped toroidal viewing angles."
  documentation: 'Full angular span of a camera field of view in the toroidal direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame is the non-negative difference
    between the largest and smallest limiting signed toroidal viewing angles subtended
    by the camera acceptance. In this frame $R$ is major radius, $\phi$ increases
    counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    Let $\phi_{\min}$ and $\phi_{\max}$ be the minimum and maximum unwrapped signed
    toroidal viewing angles of the limiting accepted rays. The toroidal angular width
    is defined by:


    $$

    \Delta\phi_\mathrm{cam} = \phi_{\max} - \phi_{\min}

    $$


    where $\Delta\phi_\mathrm{cam}$ is the toroidal angular width of the camera and
    the extrema are taken over the camera field-of-view boundary after choosing a
    continuous branch of $\phi$.


    This quantity describes only the toroidal extent of the field of view. It excludes
    the central toroidal pointing angle, the detailed field-of-view footprint or optical
    distortion, and the complementary [vertical angular width](name:vertical_angular_width_of_camera).'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
