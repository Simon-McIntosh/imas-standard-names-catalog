- name: neutron_flux_due_to_beam_thermal_fusion
  kind: scalar
  status: draft
  description: Beam-thermal neutron emission rate from fusion reactions between injected
    fast ions and thermal plasma ions, summed over DD, DT, and TT channels.
  documentation: 'Neutron flux due to beam-thermal fusion is the volume-integrated
    neutron emission rate produced when fast neutral-beam ions fuse with thermal ions
    in the plasma. It excludes purely thermal-thermal and beam-beam reactions, and
    counts emitted neutrons rather than fusion events, so DD branching and TT neutron
    multiplicity are included.


    A channel-resolved expression for the rate is:


    $$

    \Phi_n^{\mathrm{BT}} = \sum_{a,b\in\{D,T\}} \int_V dV \int d^3 v_a \int d^3 v_b\,
    f_a^{\mathrm{beam}}(\mathbf r,\mathbf v_a) f_b^{\mathrm{th}}(\mathbf r,\mathbf
    v_b)\, \sigma_{ab}(v_{\mathrm{rel}})\, v_{\mathrm{rel}}\, Y_{ab}(v_{\mathrm{rel}})

    $$


    where $\Phi_n^{\mathrm{BT}}$ is the neutron emission rate in s$^{-1}$, equivalent
    to Hz; $a$ is the fast beam isotope and $b$ is the thermal target isotope; $f_a^{\mathrm{beam}}$
    and $f_b^{\mathrm{th}}$ are velocity-space densities normalized to number density
    in m$^{-3}$; $\sigma_{ab}$ is the fusion cross-section in m$^2$; $v_{\mathrm{rel}}=|\mathbf
    v_a-\mathbf v_b|$ is the relative speed in m s$^{-1}$; and $Y_{ab}$ is the neutron
    yield per reaction. For DT, $Y_{DT}=1$; for TT, $Y_{TT}=2$ because two neutrons
    are emitted per reaction; for DD, $Y_{DD}$ is the energy-dependent branching fraction
    of the neutron-producing branch.


    In practice this rate is computed from fast-ion distributions, thermal ion densities
    and temperatures, isotope composition, and fusion reactivity data. It is constrained
    experimentally by neutron monitors, activation systems, neutron cameras, and neutron
    spectroscopy, often using beam modulation or transport modeling to separate beam-thermal
    emission from [thermal_neutron_flux](name:total_neutron_source_rate_due_to_thermal_fusion)
    and other neutron-producing components. The channel-resolved components include
    [deuterium_deuterium_flux_due_to_beam_thermal_fusion](name:deuterium_deuterium_flux_due_to_beam_thermal_fusion),
    [deuterium_tritium_flux_due_to_beam_thermal_fusion](name:deuterium_tritium_flux_due_to_beam_thermal_fusion),
    and the TT beam-thermal contribution; their sum contributes to total_neutron_flux.


    Typical beam-thermal neutron emission rates are about $10^{12}$-$10^{16}$ Hz in
    deuterium neutral-beam plasmas, $10^{16}$-$10^{19}$ Hz in high-power mixed deuterium-tritium
    operation, and can approach $10^{20}$ Hz in large burning-plasma scenarios with
    strong auxiliary beams. Values scale strongly with injected power, fast-ion confinement,
    target density, isotope mix, and ion temperature.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:total_neutron_source_rate_due_to_thermal_fusion
  - name:deuterium_deuterium_flux_due_to_beam_thermal_fusion
  - name:deuterium_tritium_flux_due_to_beam_thermal_fusion
  arguments:
  - name: flux_due_to_beam_thermal_fusion
    operator: neutron
    operator_kind: qualifier
