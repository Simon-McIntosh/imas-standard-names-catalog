- name: parallel_fast_neutral_pressure
  kind: scalar
  status: draft
  description: Fast (non-thermal) neutral pressure component parallel to the local
    magnetic field, summed over charge states.
  documentation: "The parallel fast neutral pressure $p_{\\parallel,\\mathrm{fn}}\
    \ = \\hat{\\mathbf{b}} \\cdot \\mathbf{P}_{\\mathrm{fn}} \\cdot \\hat{\\mathbf{b}}$\
    \ is the component of the anisotropic fast neutral pressure tensor along the magnetic\
    \ field direction $\\hat{\\mathbf{b}}$.  It quantifies the kinetic energy density\
    \ associated with suprathermal neutral particles (e.g., from charge-exchange or\
    \ beam injection) moving predominantly along the field lines.  This quantity is\
    \ a key input to momentum balance, neutral transport models, and fast-particle\
    \ physics simulations.  In neutral-beam-heated tokamaks, $p_{\\parallel,\\mathrm{fn}}$\
    \ can reach 1\u201310% of the thermal plasma pressure in the core and is assessed\
    \ using fast-ion D-alpha (FIDA) measurements or neutral particle analyzers (NPA)\
    \ combined with TRANSP or NUBEAM modeling.  Together with its perpendicular counterpart,\
    \ it defines the full [fast_neutral_pressure](name:fast_neutral_pressure) tensor,\
    \ which is itself related to the [parallel_fast_ion_pressure](name:parallel_fast_ion_pressure)\
    \ of the charge-exchange source population and the state-resolved [parallel_state_pressure](name:parallel_state_pressure).\n\
    \nSign convention: Positive when the pressure contributes positively to the total\
    \ stress in the direction parallel to $\\mathbf{B}$."
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_neutral_pressure
  - name:parallel_fast_ion_pressure
  - name:parallel_state_pressure
  arguments:
  - name: fast_neutral_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
