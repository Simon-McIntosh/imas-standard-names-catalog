- name: mutual_inductance_of_flux_loop_passive_coupling
  kind: scalar
  status: draft
  description: Mutual inductance matrix element coupling passive conducting structures
    to poloidal flux loop diagnostics, giving the poloidal flux linked in each flux
    loop per unit current in each passive conductor.
  documentation: 'The mutual inductance $M_{lp}$ between passive conducting structures
    and poloidal flux loop diagnostics is defined by $\Psi_l = M_{lp}\, I_p$, where
    $\Psi_l$ (Wb) is the poloidal flux linked by flux loop $l$ and $I_p$ (A) is the
    current circulating in passive conductor $p$. This coupling is essential for equilibrium
    reconstruction and for modeling the electromagnetic response of the machine during
    transients: eddy currents induced in passive structures by changing plasma or
    coil currents produce additional flux contributions at the diagnostic sensors
    that must be accounted for. The matrix is computed from the geometry of the passive
    conductors and flux loops using the Neumann formula $M_{lp} = (\mu_0/4\pi)\oint_l\oint_p
    (d\mathbf{l}_l \cdot d\mathbf{l}_p)/|\mathbf{r}_l - \mathbf{r}_p|$, where $\mu_0$
    is the permeability of free space, and the line integrals are taken around each
    circuit. Typical matrix entries range from nH to tens of $\mu$H depending on the
    geometric proximity and area of the coupled circuits. This quantity complements
    [mutual inductance of flux loop to active coils](name:mutual_inductance_of_flux_loop_active_coupling),
    which captures the direct coil-to-sensor coupling, and [mutual inductance of plasma
    to passive structures](name:mutual_inductance_of_plasma_passive_coupling), which
    captures the plasma filament contribution; together they form the complete inductive
    coupling model used in real-time plasma control and post-shot equilibrium reconstruction.'
  unit: H
  physics_domain: magnetic_field_systems
  links:
  - name:mutual_inductance_of_flux_loop_active_coupling
  - name:mutual_inductance_of_plasma_passive_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_loops_passive
    dd_path: em_coupling/mutual_loops_passive
    status: composed
- name: mutual_inductance_of_passive_active_coupling
  kind: scalar
  status: draft
  description: Mutual inductance matrix between active poloidal field coils and passive
    conducting structures, giving the poloidal flux linked in each passive conductor
    per unit current in each active coil.
  documentation: "The mutual inductance $M_{pa}$ between active coils and passive\
    \ conductors quantifies the electromagnetic coupling that drives eddy currents\
    \ in vessel walls, stabilizing shells, and other passive structures when the active\
    \ coil currents change. The governing relation is $\\Psi_{\\text{passive},i} =\
    \ \\sum_j M_{pa,ij} I_{\\text{active},j}$, where $\\Psi_{\\text{passive},i}$ is\
    \ the poloidal flux linked by passive conductor $i$ and $I_{\\text{active},j}$\
    \ is the current in active coil $j$. This coupling is central to modeling the\
    \ inductive response of passive structures during fast transients such as disruptions\
    \ and vertical displacement events, where the induced currents generate forces\
    \ on the vessel. Typical values span $10^{-9}$\u2013$10^{-5}$ H depending on the\
    \ geometric proximity and size of the coupled elements. The matrix is computed\
    \ from the conductor geometry using Neumann's formula or finite-element electromagnetic\
    \ codes, and appears alongside [mutual_inductance_of_active_coupling](name:mutual_inductance_of_active_coupling)\
    \ (active\u2013active self/mutual inductances) and [mutual_inductance_of_plasma_passive_coupling](name:mutual_inductance_of_plasma_passive_coupling)\
    \ (plasma\u2013passive coupling) in full circuit models. The complementary [mutual_inductance_of_flux_loop_active_coupling](name:mutual_inductance_of_flux_loop_active_coupling)\
    \ gives the analogous coupling to diagnostic flux loops rather than passive structural\
    \ conductors."
  unit: H
  physics_domain: magnetic_field_systems
  links:
  - name:mutual_inductance_of_active_coupling
  - name:mutual_inductance_of_plasma_passive_coupling
  - name:mutual_inductance_of_flux_loop_active_coupling
  constraints: []
  sources:
  - id: dd:em_coupling/mutual_passive_active
    dd_path: em_coupling/mutual_passive_active
    status: composed
- name: normal_coordinate_of_conductor_cross_section_outline
  kind: scalar
  status: draft
  description: Normal-axis coordinate of vertices of the polygonal outline of a coil
    conductor cross-section in the local Frenet-Serret (normal, binormal) frame attached
    to the conductor centerline.
  documentation: "The normal-axis coordinate $n$ is one of the two perpendicular components\
    \ locating each vertex of the closed polygonal outline of a coil conductor cross-section.\
    \ Together with the binormal-axis counterpart $b$, it forms the two-component\
    \ position vector $\\mathbf{r}_{\\perp} = (n, b)$ in the local Frenet-Serret frame\
    \ that co-moves with the conductor centerline, where the normal direction $\\\
    hat{n}$ points toward the center of curvature of the centerline and the binormal\
    \ direction $\\hat{b} = \\hat{t} \\times \\hat{n}$ completes the right-handed\
    \ triad with the tangent $\\hat{t}$. The full outline is defined by [coordinate_of_conductor_cross_section_outline](name:coordinate_of_conductor_cross_section_outline),\
    \ and the companion coordinate along the perpendicular axis is [binormal_coordinate_of_conductor_cross_section_outline](name:binormal_coordinate_of_conductor_cross_section_outline).\
    \ Typical values depend on conductor geometry: rectangular conductors in tokamak\
    \ poloidal-field or TF coil systems have cross-section half-widths of order 1\u2013\
    100 mm, so normal coordinates span roughly $-0.05$ m to $+0.05$ m about the centerline.\
    \ The outline polygon is used to compute the conductor's self-inductance, eddy-current\
    \ distribution, and magnetic-field integrals along the winding path.\n\nSign convention:\
    \ Positive when the coordinate is displaced in the direction of $\\hat{n}$, pointing\
    \ toward the center of curvature of the conductor centerline."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_conductor_cross_section_outline
  - name:binormal_coordinate_of_conductor_cross_section_outline
  constraints: []
  arguments:
  - name: coordinate_of_conductor_cross_section_outline
    operator: coordinate
    operator_kind: coordinate
    axis: normal
    shape: coordinate
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    status: composed
- name: radial_offset_of_conductor_cross_section_contour_point
  kind: scalar
  status: draft
  description: Radial displacement $\Delta R$ of a conductor cross-section contour
    point relative to the local reference point, specifying the radial extent of the
    coil conductor shape.
  documentation: 'The radial offset $\Delta R$ is the $R$-component of the two-dimensional
    displacement vector $\boldsymbol{\Delta} = (\Delta R, \Delta Z)$ that maps each
    boundary point of a coil conductor cross-section away from a local reference position
    in the right-handed cylindrical $(R, \phi, Z)$ frame. Together with the vertical
    complement [vertical_offset_of_conductor_cross_section_contour_point](name:vertical_offset_of_conductor_cross_section_contour_point),
    it fully parameterizes the cross-sectional shape of the conductor, which governs
    current distribution, self-inductance, and mechanical stress in the coil winding
    pack. The full displacement vector is described by [offset_of_conductor_cross_section_contour_point](name:offset_of_conductor_cross_section_contour_point).
    Typical magnitudes range from a few millimeters to tens of centimeters depending
    on conductor geometry, spanning both circular cable-in-conduit conductors and
    rectangular busbars. Values are determined from engineering drawings or metrology
    surveys of the as-built coil geometry.


    Sign convention: Positive when the contour point is displaced in the direction
    of increasing major radius $R$ relative to the local reference point.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_offset_of_conductor_cross_section_contour_point
  - name:offset_of_conductor_cross_section_contour_point
  constraints: []
  arguments:
  - name: offset_of_conductor_cross_section_contour_point
    operator: coordinate
    operator_kind: coordinate
    axis: radial
    shape: coordinate
