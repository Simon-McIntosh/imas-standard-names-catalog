name: neutral_physical_sputtering_coefficient_at_wall
status: draft
cocos_transformation_type: one_like
description: Effective physical sputtering yield due to a given neutral incident species,
  assuming sputtered atoms leave the wall at the local wall temperature.
documentation: "The physical sputtering coefficient $Y_{\\rm phys}$ (dimensionless)\
  \ gives the mean number of wall-material atoms ejected per incident neutral projectile\
  \ via ballistic momentum transfer in the near-surface collision cascade. Above the\
  \ threshold energy $E_{\\rm th}$ (typically 20\u201350 eV for D on W), $Y_{\\rm\
  \ phys}$ rises with projectile energy, following semi-empirical Bohdansky or Eckstein\
  \ formulas, and depends on the angle of incidence $\\theta$ relative to the surface\
  \ normal. For deuterium on tungsten, typical peak yields are $Y \\sim 10^{-2}$\u2013\
  $10^{-1}$ at energies of a few hundred eV. All sputtered neutrals are assumed to\
  \ emerge at the wall temperature (cold neutral approximation), providing a simplified\
  \ source term for edge impurity transport codes. This coefficient, together with\
  \ the chemical sputtering yield (`neutral_chemical_sputtering_coefficient_at_wall`),\
  \ determines the total erosion source for lifetime and impurity assessments."
