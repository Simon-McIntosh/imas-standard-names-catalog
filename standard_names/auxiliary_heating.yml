- name: per_toroidal_mode_fast_ion_state_power_density
  kind: scalar
  status: draft
  description: Absorbed coherent radio-frequency wave power density deposited on the
    fast, nonthermal ion population of a specified charge state, decomposed by toroidal
    Fourier mode number. It resolves charge-state-specific fast-ion wave absorption
    harmonic by harmonic, expressed per unit plasma volume.
  documentation: 'Per-toroidal-mode fast-ion-state power density is the absorbed coherent
    radio-frequency wave power, per unit plasma volume, deposited on a fast (nonthermal)
    ion population of a specified charge state and attributed to a single toroidal
    Fourier harmonic of the wave field. It isolates how much each toroidal mode contributes
    to the energization of that particular fast-ion charge-state population.


    The mode-resolved components sum to the total absorbed power density on that fast-ion
    charge state:


    $$

    P_{\mathrm{fast},s} = \sum_{n} P_{\mathrm{fast},s,n}

    $$


    where $P_{\mathrm{fast},s,n}$ is this mode-resolved power density for charge state
    $s$ and toroidal mode number $n$, and $P_{\mathrm{fast},s}$ is the corresponding
    total absorbed power density for that charge state, both in $\mathrm{W\,m^{-3}}$.
    Summing instead over all charge states of the species recovers the species-level
    mode-resolved [per_toroidal_mode_fast_ion_power_density](name:per_toroidal_mode_fast_ion_power_density).


    The quantity is obtained from coherent-wave absorption calculations that expand
    the electromagnetic field into toroidal harmonics and evaluate the wave-particle
    energy exchange with the fast-ion distribution function for each charge state.
    Resolving by charge state is important in multi-species or impurity-laden plasmas,
    where distinct charge states absorb on different toroidal harmonics at the same
    location.


    Sign convention: Positive when net coherent-wave electromagnetic energy is transferred
    from the wave field to the specified fast-ion charge-state population for that
    toroidal harmonic.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_state_power_density
  - name:per_toroidal_mode_thermal_ion_state_power_density
  - name:per_toroidal_mode_fast_ion_power_density
  arguments:
  - name: fast_ion_state_power_density
    operator: per_toroidal_mode
    operator_kind: qualifier
  sources:
