  description: Flux-surface-averaged number density of nitrogen impurity ions at the
    last closed flux surface, summed over all ionization stages from N+ through fully
    stripped N7+.
  documentation: 'This quantity is the flux-surface average of the nitrogen impurity-ion
    number density on the plasma boundary, or last closed magnetic flux surface. The
    local density is summed over nitrogen ions from singly ionized N+ through fully
