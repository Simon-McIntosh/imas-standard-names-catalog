  - name: density_at_plasma_boundary
    operator: helium_3
    operator_kind: qualifier
- name: helium_4_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of helium-4 ions evaluated at the pedestal top, where
    the steep-gradient edge transport barrier transitions toward the flatter core
    plasma.
  documentation: 'Helium-4 density at the pedestal is the local number density of
    helium-4 ions evaluated at the pedestal top. In deuterium-tritium plasmas this
    species includes thermalized alpha-particle ash, while in other plasmas it may
    also represent helium introduced for fueling, wall conditioning, or impurity studies.


    The pedestal value is the local helium-4 ion number density evaluated at the pedestal-top
    location:


    $$

    n_{\mathrm{He4,ped}} = n_{\mathrm{He4}}\big|_{\mathrm{ped}} = \lim_{\Delta V \to
    0} \frac{\Delta N_{\mathrm{He4}}}{\Delta V}

    $$


    where $\Delta N_{\mathrm{He4}}$ is the number of helium-4 ions contained in a
    small volume $\Delta V$ around the pedestal-top location, and $\Delta V$ is expressed
    in m^3 so that $n_{\mathrm{He4,ped}}$ is in m^-3.


    The pedestal top is identified from the break between the steep-gradient edge
    region and the flatter core-side behavior of edge plasma quantities. The helium-4
    density there may be inferred from helium-sensitive spectroscopy or charge-exchange
    measurements when available, and is often constrained together with other ion
    densities by quasineutrality, transport analysis, and particle-balance modeling.


    Physical values are non-negative: $n_{\mathrm{He4,ped}} \ge 0$. Representative
    values can range from effectively 0 m^-3 in plasmas with no helium source to trace
    or minority-ion levels in helium-seeded or deuterium-tritium plasmas, commonly
    spanning about 10^15-10^19 m^-3 depending on helium production, external injection,
    confinement, and exhaust.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_4_density_at_magnetic_axis
  - name:helium_4_density_at_plasma_boundary
  - name:helium_4_density_at_limiter
  - name:helium_4_density_at_divertor_target
  - name:density_at_pedestal
  arguments:
  - name: density_at_pedestal
    operator: helium_4
    operator_kind: qualifier
- name: helium_4_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of helium-4 ions evaluated on the plasma boundary, the
    last closed flux surface separating the magnetically confined plasma from the
    scrape-off layer.
  documentation: 'Helium-4 density at the plasma boundary is the number density of
    ions whose nuclei are the isotope $^{4}\mathrm{He}$, evaluated on the last closed
    flux surface. The plasma boundary is the separatrix between the closed-field-line
    region and the scrape-off layer. The quantity is non-negative and is a species
    density, not a charge density.


    Using a flux-coordinate system $(\rho,\theta,\phi)$ with normalized radial label
    $\rho$ chosen so that the plasma boundary is at $\rho=1$, the local boundary value
    is


    $$

    n_{^{4}\mathrm{He},b} = n_{^{4}\mathrm{He}}(\rho=1)

    $$


    where $n_{^{4}\mathrm{He}}$ is the helium-4 ion number density field and the subscript
    $b$ denotes evaluation at the boundary. This definition specifies boundary evaluation
    only; it does not by itself imply a flux-surface average over $(\theta,\phi)$.
    If an averaged boundary value is used, that averaging is an additional reduction
    of the local boundary density.


    In practice the value is obtained by evaluating a species-resolved edge plasma
    model or reconstruction at the separatrix, often constrained by spectroscopic,
    charge-exchange, divertor, or edge-profile measurements when available. In a fully
    ionized plasma, helium-4 is typically present as $\mathrm{He}^{2+}$, so its electron-density
    contribution is $2 n_{^{4}\mathrm{He}}$; charge-state effects should be treated
    consistently when partial ionization is important near the edge.


    Typical values can range from near 0 m^-3 when helium-4 is absent or weakly retained
    to about $10^{16}$-$10^{19}$ m^-3 in plasmas with helium ash, helium fueling,
    or dedicated helium operation. The upper range is limited by the local edge electron
    density and the helium concentration.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:helium_3_density_at_plasma_boundary
  - name:helium_4_density_at_magnetic_axis
  - name:helium_4_density_at_limiter
  arguments:
  - name: density_at_plasma_boundary
    operator: helium_4
    operator_kind: qualifier
- name: hydrogen_density_at_pedestal
  kind: scalar
  status: draft
  description: Hydrogen (protium) ion number density evaluated at the H-mode pedestal
    top.
  documentation: 'Hydrogen density at pedestal is the local number density of protium
    ions at the pedestal top of an H-mode plasma. The pedestal top is the inner edge
    of the steep-gradient edge transport barrier, where the edge density gradient
    relaxes toward the core plasma behavior.


    In practice, this quantity is inferred from edge density measurements together
    with ion-species composition information and an identification of the pedestal-top
    location. It represents the protium ion contribution only; deuterium, tritium,
    and impurity ions are separate species contributions to the total ion population.


    Representative values are scenario dependent. In majority-hydrogen H-mode plasmas,
    pedestal-top protium ion densities are commonly of order $1-10 \times 10^{19}\
    \mathrm{m^{-3}}$; in mixed-isotope or trace-hydrogen plasmas they can be substantially
    lower depending on fueling, isotope mix, and edge transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_pedestal
  - name:hydrogen_density_at_plasma_boundary
  - name:hydrogen_density_at_limiter
  arguments:
  - name: density_at_pedestal
    operator: hydrogen
    operator_kind: qualifier
- name: hydrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of hydrogen (protium) ions at the plasma boundary, the
    last closed flux surface separating the magnetically confined plasma from the
    open-field-line scrape-off layer.
  documentation: "Hydrogen ion number density at the plasma boundary is the count\
    \ of protium (H+) ions per unit volume at the separatrix, the last closed flux\
    \ surface (LCFS) that bounds magnetically confined plasma against the open-field-line\
    \ scrape-off layer. As the hydrogen-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary),\
    \ it characterizes the local protium population at the edge transport boundary,\
    \ governing ionization balance, recycling flux, and neutral penetration depth.\n\
    \nThe boundary value is obtained as the flux-surface average of the local hydrogen\
    \ ion density over the LCFS:\n\n$$\nn_H^{\\rm sep} = \\frac{1}{S_{\\rm LCFS}}\
    \ \\oint_{\\rm LCFS} n_H \\, dS\n$$\n\nwhere $S_{\\rm LCFS}$ is the total area\
    \ of the last closed flux surface and $n_H$ is the local hydrogen ion number density\
    \ on the surface.\n\nThis quantity is inferred from edge Thomson scattering, Balmer-series\
    \ hydrogen spectroscopy (H$\\alpha$ emission), or Langmuir-probe measurements\
    \ combined with ionization-balance modeling in edge fluid codes.\n\nIn deuterium-dominated\
    \ discharges, protium (hydrogen-1) is a minority main-ion species due to wall\
    \ outgassing; separatrix hydrogen ion densities lie in the range $10^{17}$\u2013\
    $10^{18}$ m$^{-3}$, rising toward $10^{19}$ m$^{-3}$ in hydrogen-fueled or heavy-recycling\
    \ scenarios. The analogous density for the dominant fuel isotope is [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary),\
    \ while heavier impurity boundary densities include [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)\
    \ and [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:deuterium_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:helium_4_density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: hydrogen
    operator_kind: qualifier
- name: ion_average_temperature_at_pedestal_top
  kind: scalar
  status: draft
  description: Ion average temperature at the pedestal top is the density-weighted
    temperature of all ion species and charge states evaluated at the core-side shoulder
    of the H-mode pedestal. The pedestal top is distinct from the pedestal foot near
    the separatrix and scrape-off layer.
  documentation: 'Ion average temperature at the pedestal top is the ion_average_temperature
    evaluated at the core-side shoulder of the H-mode edge transport barrier. Moving
    outward from the plasma center, this location marks the transition from the central
    plasma to the steep-gradient pedestal region; it is distinct from the pedestal
    foot on the separatrix and scrape-off-layer side.


    For ion populations indexed by $j$, where each population corresponds to a species
    and charge state, the pedestal-top average is commonly defined as a density-weighted
    mean:


    $$

    \langle T_i \rangle_{\mathrm{top}} = \frac{\sum_j n_{j,\mathrm{top}} T_{j,\mathrm{top}}}{\sum_j
    n_{j,\mathrm{top}}}

    $$


    where $T_{j,\mathrm{top}}$ is the temperature of ion population $j$ in eV, $n_{j,\mathrm{top}}$
    is its number density in m^-3, and the subscript $\mathrm{top}$ denotes evaluation
    at the pedestal-top radial location. If the value is used to estimate SI ion thermal
    pressure, the eV-valued temperature must be converted by the elementary charge:
    $p_i = e\,n_i\langle T_i\rangle_{\mathrm{top}}$, with $n_i = \sum_j n_{j,\mathrm{top}}$.


    In practice, this quantity is inferred from edge ion-temperature measurements
    such as charge-exchange recombination spectroscopy, neutral-particle analysis,
    or integrated kinetic analysis, combined with an identification of the pedestal-top
    location from the measured radial variation of temperature, density, or pressure.
    When only impurity-ion temperatures are measured, main-ion temperature estimates
    require collisional equilibration or transport assumptions.


    Typical pedestal-top ion average temperatures range from 100-1000 eV in smaller
    or moderate-performance H-mode plasmas and from 1000-5000 eV in large, high-performance
    H-mode plasmas. The value varies with heating power, pedestal density, isotope
    mix, collisionality, and edge-localized-mode phase.'
  unit: eV
  physics_domain: edge_plasma_physics
  links: []
- name: ion_diffusivity
  kind: vector
  status: draft
  description: Diffusion coefficient for total ion particle transport in a magnetized
    plasma, relating the ion particle flux to the local ion number density gradient
    across field-aligned and poloidal directions.
  documentation: 'Ion diffusivity quantifies gradient-driven (Fickian) transport of
    the total ion population in a magnetized plasma, relating the ion particle flux
    to the ion number density gradient. Strong magnetic confinement makes ion transport
    intrinsically anisotropic, so the diffusivity is a directional quantity whose
    magnitude differs by orders of magnitude between field-aligned and cross-field
    directions.


    The diffusive ion particle flux $\boldsymbol{\Gamma}_i$ is governed by Fick''s
    law:


    $$

    \boldsymbol{\Gamma}_i = -\mathbf{D}_i \cdot \nabla n_i

    $$


    where $\mathbf{D}_i$ is the ion diffusivity tensor and $n_i$ is the local total
    ion number density in m$^{-3}$. The physically resolved projections of this tensor
    are the [parallel ion diffusivity](name:parallel_ion_diffusivity), which characterizes
    field-aligned transport governed by collisional dynamics and can exceed cross-field
    values by many orders of magnitude, and the [poloidal ion diffusivity](name:poloidal_ion_diffusivity),
    which captures transport along the poloidal direction in flux coordinates $(\rho,
    \theta, \phi)$ where $\rho$ is a radial flux label, $\theta$ is the poloidal angle,
    and $\phi$ is the toroidal angle.


    Ion diffusivity is inferred from experimental density profiles by fitting gradient-flux
    relationships, or computed from neoclassical theory and turbulence simulations.
    Anomalous (turbulence-driven) contributions typically dominate over neoclassical
    values in the core and pedestal. Typical cross-field values range from $10^{-2}$
    to $1\;\text{m}^2\text{s}^{-1}$ in the confined core, increasing sharply toward
    the scrape-off layer. The analogous quantity for the electron population is [electron
    diffusivity](name:electron_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_ion_diffusivity
  - name:poloidal_ion_diffusivity
  - name:electron_diffusivity
- name: ion_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of the ion heat flux in the scrape-off
    layer, equal to the inverse magnitude of its outward logarithmic radial gradient.
    It is non-negative by definition and characterizes how rapidly ion heat exhaust
    falls away from the separatrix.
  documentation: 'The ion heat decay length over the scrape-off layer is the radial
    e-folding scale over which the ion heat flux decreases outside the confined plasma.
    It characterizes the width of the ion heat exhaust channel and complements the
    electron-channel quantity [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer)
    in determining the overall heat-exhaust fall-off described by [heat_decay_length_over_scrape_off_layer](name:heat_decay_length_over_scrape_off_layer).


    The local decay length is the inverse magnitude of the outward logarithmic gradient
    of the ion heat flux:


    $$

    \lambda_{q_i} = \left|\frac{\partial \ln q_i}{\partial r_\perp}\right|^{-1}

    $$


    where $q_i(r_\perp)$ is the positive ion heat-flux density in W m^-2, $r_\perp$
    is distance in meters measured locally outward from the separatrix approximately
    normal to magnetic flux surfaces, and $\lambda_{q_i}$ is in meters. For an exponential
    dependence $q_i \propto \exp(-r_\perp/\lambda_{q_i})$, the ion heat flux decreases
    by a factor $e$ over one decay length.


    In practice, this quantity is inferred by fitting or differentiating the radial
    dependence of ion heat-flux estimates in the scrape-off layer. Those estimates
    may come from target heat measurements, probe-based ion energy and particle flux
    measurements, edge power balance, or transport modeling with magnetic mapping
    between divertor and upstream locations. It is distinct from ion temperature decay
    lengths such as radial_average_ion_temperature_decay_length_over_scrape_off_layer
    and ion_average_decay_length_over_scrape_off_layer, because it describes heat-flux
    fall-off rather than temperature fall-off.


    Typical magnitudes in present tokamak scrape-off layers are on the order of 0.001-0.03
    m, ranging from millimeter-scale widths in narrow high-confinement conditions
    to centimeter-scale widths in broader low-confinement or high-collisionality conditions.
    The value depends on plasma density, power crossing the separatrix, magnetic geometry,
    collisionality, and whether the quoted location is upstream or mapped to the divertor
    target.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_heat_decay_length_over_scrape_off_layer
  - name:heat_decay_length_over_scrape_off_layer
  arguments:
  - name: heat_decay_length_over_scrape_off_layer
    operator: ion
    operator_kind: qualifier
- name: iron_density
  kind: scalar
  status: draft
  description: Total number density of iron impurity ions in the plasma, summed over
    all ionization states from singly to fully ionized iron (atomic number Z = 26).
  documentation: 'Iron density is the total number density of iron ions present in
    the plasma, aggregated over all charge states from Fe$^{1+}$ through Fe$^{26+}$
    (atomic number $Z = 26$). It characterizes the iron impurity content without resolving
    the per-charge-state distribution, and may refer to a local point value or a spatially
    averaged quantity depending on the sampling convention.


    The total iron ion number density $n_\mathrm{Fe}$ is defined as:


    $$

    n_\mathrm{Fe} = \sum_{z=1}^{26} n_{\mathrm{Fe}^{z+}}

    $$


    where $n_{\mathrm{Fe}^{z+}}$ is the number density of iron in charge state $z$.


    Iron enters confined plasmas primarily through physical sputtering of high-$Z$
    plasma-facing components. Spectroscopic measurements in the vacuum-ultraviolet
    and soft X-ray ranges resolve individual charge-state emission lines; the total
    iron density is reconstructed by summing ionization-state-resolved densities derived
    from ionization balance calculations.


    This general quantity is concretized by spatial-sampling variants: [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density)
    averages the local density over a magnetic flux surface, [line_averaged_iron_density](name:line_averaged_iron_density)
    represents a chord-integrated value divided by path length, and [volume_averaged_iron_density](name:volume_averaged_iron_density)
    integrates over the full plasma volume. Position-specific forms are available
    at key radial locations such as [iron_density_at_magnetic_axis](name:iron_density_at_magnetic_axis),
    [iron_density_at_pedestal](name:iron_density_at_pedestal), and [iron_density_at_limiter](name:iron_density_at_limiter).


    Sign convention: Positive when iron ions are present in the sampled plasma volume;
    the quantity is intrinsically non-negative as a particle number density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_iron_density
  - name:line_averaged_iron_density
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  - name:iron_density_at_pedestal
  - name:iron_density_at_limiter
- name: flux_surface_averaged_iron_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total iron impurity ion number density,
    summed over all iron ionization states. It represents the density assigned to
    a magnetic flux surface after averaging local variation around that surface, not
    a statement that iron is spatially uniform there.
  documentation: 'Flux-surface-averaged iron density is the average of the total iron
    impurity ion number density on a magnetic flux surface. The total iron density
    is summed over all iron ionization states. It is a representative density for
    the surface and does not imply that the local iron density is uniform on that
    surface.


    The flux-surface average can be written using a poloidal magnetic flux label $\psi$:


    $$

    \langle n_{\mathrm{Fe}}\rangle_{\psi} = \frac{\int_{\psi=\mathrm{const}} n_{\mathrm{Fe}}\,
    dA/|\nabla\psi|}{\int_{\psi=\mathrm{const}} dA/|\nabla\psi|}

    $$


    where $n_{\mathrm{Fe}}$ is the local total iron ion density in $\mathrm{m}^{-3}$,
    $n_{\mathrm{Fe}}=\sum_q n_{\mathrm{Fe}^{q+}}$ over iron ionization states $q$,
    $dA$ is a surface-area element in $\mathrm{m}^2$, and $|\nabla\psi|$ is in $\mathrm{Wb}\,\mathrm{m}^{-1}$
    when $\psi$ is in $\mathrm{Wb}$. The weighting corresponds to averaging over the
    thin volume between neighboring flux surfaces.


    In practice, this quantity is obtained by combining an equilibrium reconstruction
    that supplies the magnetic flux surfaces with local or modeled iron charge-state
    densities. These densities may be inferred from extreme-ultraviolet, x-ray, or
    visible line emission with collisional-radiative modeling, and may be constrained
    by impurity transport, radiation, electron density, and electron temperature measurements.
    Strong edge gradients and localized sources can make the local iron density vary
    strongly on a surface, so the flux-surface average should be interpreted as an
    averaged abundance rather than a local value.


    Typical values for trace iron contamination are $10^{12}-10^{16}\ \mathrm{m}^{-3}$
    in confined plasmas. During strong wall influx, impurity accumulation, disruptions,
    or deliberate impurity injection, edge or separatrix averages can reach $10^{17}\
    \mathrm{m}^{-3}$ or higher.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_carbon_density
  - name:iron_density
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  - name:iron_density_at_divertor_target
  arguments:
  - name: iron_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: iron_density_at_pedestal
  kind: scalar
  status: draft
  description: Charge-state-summed number density of iron impurity ions at the H-mode
    pedestal top, where the steep edge transport barrier joins the flatter confined
    plasma.
  documentation: 'Iron density at the pedestal is the total number density of iron
    impurity ions on the pedestal-top flux surface. It is summed over all ionized
    charge states of iron and is non-negative as a particle number density. The pedestal
    top is the shoulder of the H-mode edge transport barrier, often identified consistently
    with quantities such as [density_at_pedestal](name:density_at_pedestal), electron_density_at_pedestal_top,
    and [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top).


    The charge-state-summed pedestal density is defined by


    $$

    n_{\mathrm{Fe,ped}} = \sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}}(\rho_\mathrm{ped})

    $$


    where $n_{\mathrm{Fe,ped}}$ is the total iron ion density at the pedestal top
    in m$^{-3}$, $n_{\mathrm{Fe}^{q+}}$ is the density of iron ions with charge state
    $q+$ in m$^{-3}$, and $\rho_\mathrm{ped}$ denotes the pedestal-top flux surface.


    Iron is a high-Z metallic impurity commonly produced by sputtering or erosion
    of steel components, ferritic materials, and other iron-containing plasma-facing
    structures. At the pedestal, iron can contribute strongly to line radiation and
    bremsstrahlung losses, so this local density is important for interpreting pedestal
    energy balance, impurity screening, and edge confinement degradation. It complements
    [volume_averaged_iron_density](name:volume_averaged_iron_density), [iron_density_at_divertor_target](name:iron_density_at_divertor_target),
    and [iron_density_at_internal_transport_barrier](name:iron_density_at_internal_transport_barrier).


    In practice, the pedestal iron density is inferred from spectroscopic measurements
    of selected iron emission lines, typically in the vacuum ultraviolet, soft X-ray,
    or charge-exchange wavelength ranges, together with collisional-radiative or ionization-balance
    modeling to recover the total charge-state-summed density. The pedestal-top location
    is usually obtained from fitted edge profiles, commonly near the transition between
    the steepest-gradient pedestal region and the flatter core plasma.


    Representative pedestal values are highly device-, wall-condition-, and scenario-dependent:
    clean discharges may have about $10^{12}$-$10^{14}$ m$^{-3}$, while stronger metallic
    source conditions or impurity-accumulation phases can reach $10^{15}$-$10^{16}$
    m$^{-3}$. Related seeded-impurity pedestal densities include [nitrogen_density_at_pedestal](name:nitrogen_density_at_pedestal)
    and [argon_density_at_pedestal](name:argon_density_at_pedestal).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:electron_temperature_at_pedestal_top
  - name:volume_averaged_iron_density
  - name:iron_density_at_divertor_target
  - name:iron_density_at_internal_transport_barrier
  - name:nitrogen_density_at_pedestal
  - name:argon_density_at_pedestal
  arguments:
  - name: density_at_pedestal
    operator: iron
    operator_kind: qualifier
- name: iron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of iron impurity ions summed over all ionization stages,
    evaluated at the last closed flux surface separating the magnetically confined
    plasma from the scrape-off layer.
  documentation: "Iron (atomic number $Z = 26$) is a metallic impurity that can enter\
    \ the plasma from iron-containing plasma-facing components or structural materials.\
    \ At the plasma boundary \u2014 the last closed flux surface between the confined\
    \ core and the open-field-line scrape-off layer \u2014 this density characterizes\
    \ the iron impurity concentration at the innermost edge of the scrape-off layer\
    \ and serves as a boundary condition for edge impurity transport modeling.\n\n\
    Unless a specific charge state is stated, the density sums over all ionization\
    \ stages:\n\n$$\nn_\\mathrm{Fe} = \\sum_{q=1}^{26} n_{\\mathrm{Fe}^{q+}}\n$$\n\
    \nwhere $n_{\\mathrm{Fe}^{q+}}$ is the partial number density of iron ions in\
    \ charge state $q^+$.\n\nThe boundary iron density can be inferred from VUV or\
    \ soft X-ray spectroscopy of iron line emission or from impurity transport simulations\
    \ constrained by edge diagnostics. Elevated concentrations at the plasma boundary\
    \ signal strong metallic impurity sourcing from plasma-facing components and can\
    \ lead to significant radiative cooling and hydrogenic fuel dilution. The species-agnostic\
    \ parent concept is defined by [density_at_plasma_boundary](name:density_at_plasma_boundary);\
    \ the iron impurity distribution inside the separatrix is further characterized\
    \ at the pedestal by [iron_density_at_pedestal](name:iron_density_at_pedestal)\
    \ and at the divertor plate by [iron_density_at_divertor_target](name:iron_density_at_divertor_target).\
    \ The analogous boundary density for another seeded impurity species is given\
    \ by [nitrogen_density_at_plasma_boundary](name:nitrogen_density_at_plasma_boundary)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
