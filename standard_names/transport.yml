- name: toroidal_thermal_torque_density_due_to_thermalization_of_fast_particles
  kind: scalar
  status: draft
  description: Toroidal component of the torque density deposited into the thermal
    particle population due to the collisional thermalization of fast particles.
  documentation: 'This quantity represents the rate of transfer of toroidal angular
    momentum density from the fast-particle population to the thermal plasma through
    collisional slowing-down and thermalization processes. It is the toroidal projection
    of the total thermal torque density vector: $\tau_{\mathrm{tor,th}}^{\mathrm{thrm}}
    = ( \boldsymbol{\tau}_{\mathrm{th}}^{\mathrm{thrm}} \cdot \hat{\phi} )$, where
    $\boldsymbol{\tau}_{\mathrm{th}}^{\mathrm{thrm}}$ is the torque density transferred
    to thermal species and $\hat{\phi}$ is the toroidal unit vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame. The thermalization process converts free energy
    from fast ions into thermal momentum through pitch-angle scattering and energy
    exchange, driving toroidal plasma rotation in the direction of the injected beam
    or fusion-product motion. Typical values in NBI-heated tokamaks range from $0.01\,\text{Nm}^{-2}$
    to $1\,\text{Nm}^{-2}$ in the plasma core, depending on beam power and density.
    This quantity is diagnosed through neutron emission spectroscopy, fast-ion D-alpha
    (FIDA) measurements, and inferred from neutral beam injection (NBI) modeling codes
    that compute the collisional power and momentum deposition profiles. It is the
    toroidal-specific counterpart of [thermal_torque_density_due_to_thermalization_of_fast_particles](name:thermal_torque_density_due_to_thermalization_of_fast_particles),
    and complements the collisional torque density described by [toroidal_thermal_torque_density](name:toroidal_thermal_torque_density).


    Sign convention: Positive when the thermal torque drives rotation in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:thermal_torque_density_due_to_thermalization_of_fast_particles
  - name:toroidal_thermal_torque_density
  arguments:
  - name: thermal_torque_density_due_to_thermalization_of_fast_particles
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/thermalisation/momentum_tor
    dd_path: distributions/distribution/profiles_1d/thermalisation/momentum_tor
    status: composed
- name: toroidal_tungsten_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal component of the tungsten impurity ion velocity at the radial
    location of the internal transport barrier.
  documentation: "This quantity quantifies the rotation of fully ionized tungsten\
    \ ($W^{q+}$) impurities in the toroidal direction at the internal transport barrier\
    \ (ITB) radius. The toroidal velocity $v_{\u03C6}$ is the projection of the tungsten\
    \ ion fluid velocity vector onto the geometric toroidal direction $\\hat{\\phi}$\
    \ in the IMAS cylindrical $(R, \\phi, Z)$ frame. It is typically measured by charge\
    \ exchange recombination spectroscopy (CXRS) using the Doppler shift of impurity\
    \ emission lines from tungsten, or inferred through equilibrium rotation models.\
    \ At the ITB, where steep gradients in rotation and temperature develop, $v_{\u03C6\
    }$ can reach values of tens to hundreds of km/s in rotating H-mode plasmasdoctor.\
    \ The ITB location is defined by a local minimum in the radial correlation length\
    \ or a sharp increase in the toroidal rotation gradient. For spatial context,\
    \ see the related velocities at other radial locations: [toroidal_tungsten_velocity_at_pedestal](name:toroidal_tungsten_velocity_at_pedestal),\
    \ [toroidal_tungsten_velocity_at_separatrix](name:toroidal_tungsten_velocity_at_separatrix),\
    \ and [toroidal_tungsten_velocity_at_magnetic_axis](name:toroidal_tungsten_velocity_at_magnetic_axis).\n\
    \nSign convention: Positive when $v_{\u03C6}$ points in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above along $+Z$)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_tungsten_velocity_at_pedestal
  - name:toroidal_tungsten_velocity_at_separatrix
  - name:toroidal_tungsten_velocity_at_magnetic_axis
  sources:
  - id: dd:summary/local/itb/velocity_phi/tungsten/value
    dd_path: summary/local/itb/velocity_phi/tungsten/value
    status: composed
- name: toroidal_tungsten_velocity_at_magnetic_axis
  kind: scalar
  status: draft
  description: "Toroidal component of the tungsten impurity ion fluid velocity at\
    \ the magnetic axis, measured in the direction of increasing toroidal angle \u03C6\
    . This quantity captures the toroidal flow of tungsten impurities at the center\
    \ of the confined plasma."
  documentation: 'The toroidal tungsten velocity at the magnetic axis is the $\phi$-component
    of the tungsten impurity ion fluid velocity evaluated at the innermost flux surface
    where the poloidal magnetic field vanishes. It quantifies the directed motion
    of tungsten ions along the toroidal direction at the plasma center, distinct from
    the bulk plasma rotation. Measured in meters per second (m/s), typical values
    at the magnetic axis range from a few km/s to several tens of km/s, depending
    on plasma conditions and confinement regime. This velocity is derived from spectroscopic
    measurements of tungsten spectral line shifts (e.g., from X-ray or VUV spectrometers),
    with the line-of-sight sensitivity projected onto the toroidal direction.


    Sign convention: Positive when the velocity is in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above the machine, along
    $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:ion_temperature_at_magnetic_axis
  sources:
  - id: dd:summary/local/magnetic_axis/velocity_phi/tungsten/value
    dd_path: summary/local/magnetic_axis/velocity_phi/tungsten/value
    status: composed
- name: total_ion_source_rate
  kind: scalar
  status: draft
  description: Total particle source rate summed over all ion species, integrated
    over the entire plasma volume.
  documentation: "The total ion particle source rate $S_{\\mathrm{ion}}$ is the volume\
    \ integral of the net production rate of all ion species, including contributions\
    \ from ionization, recombination, charge exchange, and external particle sources\
    \ such as neutral beam injection and pellet fueling. The quantity is defined as\
    \ $S_{\\mathrm{ion}} = \\int_V \\left( \\sum_i \\dot{n}_i \\right) dV$, where\
    \ $\\dot{n}_i$ is the net particle source density for ion species $i$ in m$^{-3}$\u202F\
    s$^{-1}$. In tokamak plasmas, the total ion source rate balances the particle\
    \ confinement time and determines the global particle throughput; typical values\
    \ range from $10^{19}$ to $10^{22}$\u202Fs$^{-1}$ depending on device size and\
    \ fueling conditions. This quantity is inferred from spectroscopic measurements\
    \ of neutral particle fluxes and from the particle balance equation, often in\
    \ combination with [electron_source_rate](name:electron_source_rate). The profile-resolved\
    \ counterpart is [total_ion_source_rate_at_inside_flux_surface](name:total_ion_source_rate_at_inside_flux_surface).\n\
    \nSign convention: Positive when there is a net production of ions in the plasma\
    \ volume."
  unit: s^-1
  physics_domain: transport
  links:
  - name:electron_source_rate
  - name:total_ion_source_rate_at_inside_flux_surface
  sources:
  - id: dd:core_sources/source/global_quantities/total_ion_particles
    dd_path: core_sources/source/global_quantities/total_ion_particles
    status: composed
  - id: dd:distributions/distribution/global_quantities/source/particles
    dd_path: distributions/distribution/global_quantities/source/particles
    status: attached
  - id: dd:plasma_sources/source/global_quantities/total_ion_particles
    dd_path: plasma_sources/source/global_quantities/total_ion_particles
    status: composed
- name: total_ion_source_rate_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Total ion particle source rate, summed over all ion species, cumulatively
    integrated from the magnetic axis out to a flux surface.
  documentation: 'The total ion source rate inside a flux surface $S_{\mathrm{n, tot}}(\psi)$
    is the volume integral of the net ion particle source term $s_{\mathrm{n, tot}}$
    from the magnetic axis out to the poloidal magnetic flux surface labeled by $\psi$:
    $$S_{\mathrm{n, tot}}(\psi) = \int_{V(\psi)} s_{\mathrm{n, tot}}\, dV,$$ where
    $s_{\mathrm{n, tot}}$ is the net volumetric particle source rate (in m$^{-3}$
    s$^{-1}$) summed over all ion species. This cumulative source profile enters the
    total ion density transport equation as the volume-integrated particle throughput.
    Typical values in tokamak plasmas range from $10^{20}$ to $10^{22}$ s$^{-1}$ at
    the separatrix, depending on fueling method (gas puff, neutral beam injection,
    pellet injection) and particle confinement. It is inferred from the integrated
    source terms in transport codes or measured indirectly via Abel inversion of spectroscopic
    line emission. The per-species equivalent is [$ion\_source\_rate\_at\_inside\_flux\_surface$](name:ion_source_rate_at_inside_flux_surface),
    while the volume-integrated whole-plasma total is [$total\_ion\_source\_rate$](name:total_ion_source_rate).


    Sign convention: Positive when particles are net added inside the flux surface,
    i.e., source rate exceeds sink rate within the enclosed volume.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_source_rate_at_inside_flux_surface
  - name:total_ion_source_rate
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_particles_inside
    dd_path: core_sources/source/profiles_1d/total_ion_particles_inside
    status: composed
  - id: dd:plasma_sources/source/profiles_1d/total_ion_particles_inside
    dd_path: plasma_sources/source/profiles_1d/total_ion_particles_inside
    status: composed
- name: trapped_fast_pressure
  kind: scalar
  status: draft
  description: Isotropic pressure contribution from suprathermal particles in the
    trapped (banana) orbit population, summed over charge states.
  documentation: "The trapped fast particle pressure quantifies the kinetic energy\
    \ density of suprathermal particles whose orbits are magnetically confined to\
    \ the low-field side of the tokamak, forming banana orbits. For a population with\
    \ distribution function $f_t(v,\\mu,\\theta)$ in gyrocenter coordinates, the pressure\
    \ is $p_t = \\frac23 \\int \\frac12 m v^2 f_t \\, d^3v$ under the isotropic assumption.\
    \ This quantity contributes to the total plasma pressure that enters the Grad\u2013\
    Shafranov equilibrium force balance $\\nabla p = \\mathbf{j} \\times \\mathbf{B}$.\
    \ In NBI-heated and ICRH-heated plasmas, trapped fast particles typically contribute\
    \ 0.1\u201315% of the total stored energy density (0.1\u201350 kJ\xB7m$^{-3}$).\
    \ The pressure is inferred from fast-ion diagnostics (FIDA, NPA, neutron rate)\
    \ combined with orbit modeling codes. The trapped fast pressure is related to\
    \ the total fast pressure via $p_\\text{fast} = p_\\text{trapped} + p_\\text{co-passing}\
    \ + p_\\text{counter-passing}$. See also [parallel_trapped_fast_pressure](name:parallel_trapped_fast_pressure)\
    \ for the anisotropic component and [trapped_pressure](name:trapped_pressure)\
    \ for the thermal trapped population."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:parallel_trapped_fast_pressure
  - name:trapped_pressure
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/pressure_fast
    dd_path: distributions/distribution/profiles_1d/trapped/pressure_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/pressure_fast
    dd_path: distributions/distribution/profiles_2d/trapped/pressure_fast
    status: composed
- name: volume_averaged_boron_density
  kind: scalar
  status: draft
  description: The plasma-volume- and charge-state-averaged number density of the
    boron impurity species (summed over all ionization stages, isotopes, and fast
    and thermal populations).
  documentation: "The volume-averaged boron density $\bar n_{\text{B}} = V^{-1} \n\
    _\text{B}(\boldsymbol{r})\\,\text{d}^3r$ quantifies the average boron content\
    \ in the plasma core, where $n_\text{B}$ is the local boron density (summed over\
    \ all charge states) and $V$ is the plasma volume. Boron is routinely injected\
    \ via glow-discharge boronization or pellet injection to reduce oxygen and carbon\
    \ impurities and to lower the effective ion charge; typical core values range\
    \ from $10^{16}\\,\text{m}^{-3}$ in low\u2011density L\u2011mode to several $10^{18}\\\
    ,\text{m}^{-3}$ in H\u2011mode with active boron seeding. The density is inferred\
    \ from spectroscopic measurements (e.g., charge\u2011exchange recombination spectroscopy\
    \ on B\u202FV lines) or from impurity transport modeling constrained by bolometric\
    \ and VUV line\u2011intensity data.\n\nSign convention: Positive when the number\
    \ of boron ions per unit volume increases relative to a reference state.\n\nThe\
    \ volume\u2011averaged density complements the [boron density at the magnetic\
    \ axis](name:boron_density_at_magnetic_axis) and [line\u2011averaged boron density](name:line_averaged_boron_density),\
    \ which resolve the radial gradient and line\u2011integrated content. It is related\
    \ to the total plasma density via $\\bar n_e \\approx \\sum_j Z_j \\bar n_j$ and\
    \ contributes to the effective charge $Z_{\\text{eff}}$ that sets the resistivity\
    \ and radiated power of the discharge."
  unit: m^-3
  physics_domain: transport
  links:
  - name:boron_density_at_magnetic_axis
  - name:line_averaged_boron_density
  sources:
  - id: dd:summary/volume_average/n_i/boron/value
    dd_path: summary/volume_average/n_i/boron/value
    status: composed
- name: volume_averaged_helium_4_density
  kind: scalar
  status: draft
  description: Volume-averaged number density of helium-4 ions in the plasma, summing
    over all charge states.
  documentation: 'The volume-averaged helium-4 density is the mean number of helium-4
    (alpha) ions per unit volume within a specified plasma region, integrated over
    the volume and divided by the total volume. It represents the bulk accumulation
    of helium-4 in the plasma, which serves as a fusion ash in deuterium-tritium burning
    plasmas. The quantity is obtained by integrating the local helium-4 density profile
    over the plasma volume and normalizing to the total volume. Typical values range
    from $10^{17}$ to $10^{19}\ \mathrm{m^{-3}}$ in present-day tokamaks, rising with
    fusion power and confinement time. This quantity is closely related to the local
    density at specific locations such as [helium_4_density_at_magnetic_axis](name:helium_4_density_at_magnetic_axis)
    and the line-averaged version [line_averaged_helium_4_density](name:line_averaged_helium_4_density).


    Sign convention: Positive when the helium-4 ion number density contributes positively
    to the total ion density.


    Helium-4 density impacts plasma dilution, fuel mixture control, and overall fusion
    performance; a high value may indicate insufficient ash removal by the divertor
    and exhaust systems.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:helium_4_density_at_magnetic_axis
  - name:line_averaged_helium_4_density
  sources:
  - id: dd:summary/volume_average/n_i/helium_4/value
    dd_path: summary/volume_average/n_i/helium_4/value
    status: composed
- name: volume_averaged_ion_temperature
  kind: scalar
  status: draft
  description: Spatial average of the ion temperature over the plasma volume enclosed
    by the last closed flux surface.
  documentation: "The volume-averaged ion temperature $\\langle T_i \\rangle = V^{-1}\
    \ \\int_V T_i \\, dV$ quantifies the mean thermal energy of the bulk ion population\
    \ within the confined region, where $V$ is the plasma volume bounded by the last\
    \ closed flux surface (LCFS) and $T_i$ is the local ion temperature in eV. This\
    \ global confinement metric directly influences the fusion reaction rate $\\langle\
    \ \\sigma v \\rangle$, the ion thermal energy content $W_i = \\frac{3}{2} \\int\
    \ n_i T_i \\, dV$, and the Lawson parameter through the triple product $n_i T_i\
    \ \\tau_E$. It is routinely derived from charge-exchange recombination spectroscopy\
    \ (CXRS) or neutral-particle analysis and is a standard figure of merit for energy\
    \ confinement scaling, with typical core values of 1\u201320 keV in H-mode tokamaks.\
    \ Complementary quantities include [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature)\
    \ and [ion_temperature_at_magnetic_axis](name:ion_temperature_at_magnetic_axis).\n\
    \nSign convention: Positive when the ion temperature is above absolute zero."
  unit: eV
  physics_domain: transport
  links:
  - name:volume_averaged_electron_temperature
  - name:ion_temperature_at_magnetic_axis
  sources:
  - id: dd:plasma_profiles/global_quantities/ion/t_i_volume_average
    dd_path: plasma_profiles/global_quantities/ion/t_i_volume_average
    status: composed
- name: volume_averaged_lithium_density
  kind: scalar
  status: draft
  description: Volume-averaged number density of lithium ions, summed over all charge
    states, within the plasma confined region.
  documentation: 'The volume-averaged lithium ion density is defined as the integral
    of the total lithium ion density over the confined plasma volume, divided by that
    volume:


    \[

    \langle n_{\mathrm{Li}} \rangle = \frac{1}{V} \int_V n_{\mathrm{Li}}(R, \phi,
    Z) \, dV

    \]


    where $n_{\mathrm{Li}}(R, \phi, Z)$ is the sum of the densities of neutral lithium
    (Li$^0$) through helium-like lithium (Li$^{2+}$), and $V$ is the volume of the
    region inside the last closed flux surface (LCFS). The full ionization to Li$^{3+}$
    is not included because in typical fusion plasmas (electron temperature $\gtrsim
    10^8$ K) neutral lithium is rapidly stripped down to Li$^{2+}$, but removal of
    the final electron requires energies above ~200 eV (roughly $2 \times 10^6$ K),
    which is not reached in the core or edge of most confined plasmas. This quantity
    characterizes the gross lithium content and is relevant for assessing impurity
    screening, radiative losses, and plasma dilution. Typical values range from $10^{14}$
    to $10^{18}\,\mathrm{m^{-3}}$ depending on the method of lithium introduction
    (e.g., pellet injection, laser ablation, or wall conditioning).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:lithium_density_at_magnetic_axis
  - name:lithium_density_at_separatrix
  - name:flux_surface_averaged_lithium_density_at_separatrix
  - name:line_averaged_lithium_density
  sources:
  - id: dd:summary/volume_average/n_i/lithium/value
    dd_path: summary/volume_average/n_i/lithium/value
    status: composed
- name: volume_averaged_neon_density
  kind: scalar
  status: draft
  description: Volume-averaged density of neon impurity species.
  documentation: The volume-averaged density of neon impurity $\bar{n}_{\text{Ne}}$
    is defined as the total number of neon atoms (or ions) in the plasma divided by
    the plasma volume $V$, i.e. $\bar{n}_{\text{Ne}} = \frac{1}{V} \int_V n_{\text{Ne}}
    \, dV$. This quantity characterizes the overall impurity content in the plasma
    and is used to assess impurity screening, accumulation, and radiative power balance.
    Typical values range from $10^{15}$ m$^{-3}$ in low-Z, ohmic plasmas to $10^{19}$
    m$^{-3}$ in seeded impurity scenarios for radiative divertor operation. It is
    derived from spectroscopic measurements (e.g., visible or VUV line emission) combined
    with collisional-radiative modeling. For variations at specific locations, see
    [line_averaged_neon_density](name:line_averaged_neon_density) for the line-integrated
    equivalent and [flux_surface_averaged_neon_density_of_separatrix](name:flux_surface_averaged_neon_density_of_separatrix)
    for the edge value.
  unit: m^-3
  physics_domain: transport
  links:
  - name:line_averaged_neon_density
  - name:flux_surface_averaged_neon_density_of_separatrix
  sources:
  - id: dd:summary/volume_average/n_i/neon/value
    dd_path: summary/volume_average/n_i/neon/value
    status: composed
- name: volume_averaged_tritium_density
  kind: scalar
  status: draft
  description: Volume-averaged number density of tritium ions, obtained by integrating
    the tritium density profile over the plasma volume and dividing by that volume.
  documentation: "The volume-averaged tritium density $\\langle n_{\\mathrm{T}} \\\
    rangle = \\frac{1}{V} \\int_V n_{\\mathrm{T}}(\\mathbf{r})\\, dV$ quantifies the\
    \ overall tritium fuel inventory in the plasma.  This quantity is used in global\
    \ particle balance analyzes, fusion burn-rate calculations ($P_{\\mathrm{fusion}}\
    \ \\propto n_{\\mathrm{T}} n_{\\mathrm{D}} \\langle \\sigma v \\rangle$), and\
    \ assessments of tritium retention and recycling.  Typical values in D-T tokamak\
    \ experiments range from $10^{19}\\,\\mathrm{m}^{-3}$ to $10^{20}\\,\\mathrm{m}^{-3}$,\
    \ depending on fueling rate, plasma confinement, and tritium breeding.  The volume\
    \ average is computed from density profiles measured by charge-exchange recombination\
    \ spectroscopy or inferred from neutral-particle analyzers, and is distinct from\
    \ the line-averaged density $[\\bar n_e](name:line_averaged_tritium_density)$\
    \ obtained along a single chord.  \n\nSign convention: Positive when the tritium\
    \ ion number density is positive-definite; the volume average is inherently non-negative.\n\
    \nThe volume-averaged tritium density is related to local determinations such\
    \ as $[n_{\\mathrm{T}}](name:tritium_density_at_separatrix)$ at the separatrix\
    \ or $[n_{\\mathrm{T}}](name:tritium_density_at_magnetic_axis)$ at the magnetic\
    \ axis, but it provides a single figure of merit for the global tritium content."
  unit: m^-3
  physics_domain: transport
  links:
  - name:line_averaged_tritium_density
  - name:tritium_density_at_separatrix
  - name:tritium_density_at_magnetic_axis
  sources:
  - id: dd:summary/volume_average/n_i/tritium/value
    dd_path: summary/volume_average/n_i/tritium/value
    status: composed
