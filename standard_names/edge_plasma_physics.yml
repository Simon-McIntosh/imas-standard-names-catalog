- name: hydrogen_density_at_pedestal
  kind: scalar
  status: draft
  description: Hydrogen (protium) ion number density evaluated at the H-mode pedestal
    top.
  documentation: 'Hydrogen density at pedestal is the local number density of protium
    ions at the pedestal top of an H-mode plasma. The pedestal top is the inner edge
    of the steep-gradient edge transport barrier, where the edge density gradient
    relaxes toward the core plasma behavior.


    In practice, this quantity is inferred from edge density measurements together
    with ion-species composition information and an identification of the pedestal-top
    location. It represents the protium ion contribution only; deuterium, tritium,
    and impurity ions are separate species contributions to the total ion population.


    Representative values are scenario dependent. In majority-hydrogen H-mode plasmas,
    pedestal-top protium ion densities are commonly of order $1-10 \times 10^{19}\
    \mathrm{m^{-3}}$; in mixed-isotope or trace-hydrogen plasmas they can be substantially
    lower depending on fueling, isotope mix, and edge transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_pedestal
  - name:hydrogen_density_at_plasma_boundary
  - name:hydrogen_density_at_limiter
  sources:
  - id: dd:summary/local/pedestal/n_i/hydrogen/value
    dd_path: summary/local/pedestal/n_i/hydrogen/value
    status: composed
- name: hydrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of hydrogen (protium) ions at the plasma boundary, the
    last closed flux surface separating the magnetically confined plasma from the
    open-field-line scrape-off layer.
  documentation: "Hydrogen ion number density at the plasma boundary is the count\
    \ of protium (H+) ions per unit volume at the separatrix, the last closed flux\
    \ surface (LCFS) that bounds magnetically confined plasma against the open-field-line\
    \ scrape-off layer. As the hydrogen-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary),\
    \ it characterizes the local protium population at the edge transport boundary,\
    \ governing ionization balance, recycling flux, and neutral penetration depth.\n\
    \nThe boundary value is obtained as the flux-surface average of the local hydrogen\
    \ ion density over the LCFS:\n\n$$\nn_H^{\\rm sep} = \\frac{1}{S_{\\rm LCFS}}\
    \ \\oint_{\\rm LCFS} n_H \\, dS\n$$\n\nwhere $S_{\\rm LCFS}$ is the total area\
    \ of the last closed flux surface and $n_H$ is the local hydrogen ion number density\
    \ on the surface.\n\nThis quantity is inferred from edge Thomson scattering, Balmer-series\
    \ hydrogen spectroscopy (H$\\alpha$ emission), or Langmuir-probe measurements\
    \ combined with ionization-balance modeling in edge fluid codes.\n\nIn deuterium-dominated\
    \ discharges, protium (hydrogen-1) is a minority main-ion species due to wall\
    \ outgassing; separatrix hydrogen ion densities lie in the range $10^{17}$\u2013\
    $10^{18}$ m$^{-3}$, rising toward $10^{19}$ m$^{-3}$ in hydrogen-fueled or heavy-recycling\
    \ scenarios. The analogous density for the dominant fuel isotope is [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary),\
    \ while heavier impurity boundary densities include [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)\
    \ and [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:deuterium_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:helium_4_density_at_plasma_boundary
