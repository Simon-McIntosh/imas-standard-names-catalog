- name: accumulated_ammonia_count
  kind: scalar
  status: draft
  description: Accumulated ammonia count is the total NH3 injected into the plasma
    vessel since plasma breakdown, expressed as an equivalent-electron count. Each
    ammonia molecule contributes 10 equivalent electrons, equal to the total number
    of electrons in neutral NH3.
  documentation: 'Accumulated ammonia count is the time-integrated amount of ammonia
    gas injected into the plasma vessel after plasma breakdown, represented as an
    equivalent-electron count rather than as a molecule count or particle inventory.
    For neutral ammonia, each $\mathrm{NH_3}$ molecule contains 10 electrons: 7 from
    nitrogen and 1 from each of the 3 hydrogen atoms.


    The equivalent-electron count is related to the injected molecular amount by:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{NH_3}}(t) = 10 \int_{t_\mathrm{bd}}^{t} \dot{N}_{\mathrm{NH_3}}(t'')\,dt''

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{NH_3}}$ is the accumulated equivalent-electron
    count, $\dot{N}_{\mathrm{NH_3}}$ is the ammonia molecular injection rate, and
    $t_\mathrm{bd}$ is the plasma breakdown time. The factor 10 is stoichiometric
    and does not imply that the molecule is fully ionized at the point of injection.


    In practice, this quantity is computed from calibrated gas-injection valve commands,
    flow-meter signals, reservoir pressure drops, or gas-box models, with corrections
    for line conductance, temperature, and valve response where available. It is an
    injected-source measure and may differ from the number of ammonia-derived particles
    that enter the confined plasma because of wall retention, dissociation, pumping,
    and edge neutral transport.


    Typical values depend strongly on device size and gas-injection purpose. Small
    diagnostic or impurity-seeding puffs may correspond to about $10^{18}$-$10^{20}$
    equivalent electrons, while larger fueling or disruption-mitigation injections
    can reach $10^{21}$-$10^{23}$ equivalent electrons.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_nitrogen_count
  - name:ammonia_prefill_count
  - name:accumulated_ammonia_deuterated_count
  - name:ammonia_source_rate
- name: accumulated_ammonia_deuterated_count
  kind: scalar
  status: draft
  description: 'Accumulated deuterated ammonia (ND3) introduced after plasma breakdown,
    expressed as an equivalent-electron count. Each neutral ND3 molecule contributes
    10 equivalent electrons: 7 from nitrogen and 1 from each of the three deuterium
    atoms.'
  documentation: 'Accumulated deuterated ammonia count is the cumulative amount of
    neutral ND3 gas injected after plasma breakdown, expressed as the number of electrons
    associated with those neutral molecules in complete ionization accounting. It
    tracks delivered deuterated-ammonia inventory, not net plasma electron density
    or electric charge, and is the deuterated-isotopologue counterpart of [accumulated_ammonia_count](name:accumulated_ammonia_count).


    The conversion from molecular injection to equivalent-electron count is


    $$

    N_\mathrm{eq}(t) = 10 \int_{t_\mathrm{bd}}^{t} \Gamma_{\mathrm{ND}_3}(t'')\, dt''

    $$


    where $N_\mathrm{eq}$ is a dimensionless equivalent-electron count, $t_\mathrm{bd}$
    is the plasma-breakdown time, and $\Gamma_{\mathrm{ND}_3}$ is the neutral ND3
    molecular injection rate in molecules per second. The factor 10 is the neutral-molecule
    electron inventory, $7+1+1+1$, from nitrogen plus three deuterium atoms.


    In practice this quantity is computed by integrating a calibrated ND3 molecular
    flow rate, commonly inferred from gas-injection hardware such as mass-flow controllers,
    pulsed valves, plenum pressure and temperature evolution, and calibrated line
    conductance. The accumulation starts at breakdown, increases during ND3 delivery,
    and remains unchanged when no deuterated ammonia is injected.


    Typical values are strongly device- and scenario-dependent. Small calibrated impurity
    puffs may correspond to $10^{18}-10^{21}$ equivalent electrons, routine radiative-seeding
    injections to $10^{21}-10^{23}$ equivalent electrons, and large cooling or mitigation
    injections to $10^{23}-10^{25}$ equivalent electrons or higher.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_count
  - name:ammonia_prefill_count
  - name:ammonia_source_rate
- name: accumulated_argon_count
  kind: scalar
  status: draft
  description: Cumulative count of argon delivered by gas injection since plasma breakdown,
    expressed as an equivalent-electron inventory. The count increases by 18 for each
    argon atom, using the atomic number of argon.
  documentation: 'The accumulated argon count is the time-integrated amount of argon
    delivered by gas injection after plasma breakdown, represented as a dimensionless
    equivalent-electron inventory. It counts injected argon atoms with a weighting
    equal to the argon atomic number, so one argon atom contributes 18 count units.
    This is an injected inventory measure, not a measure of free electrons, plasma
    content, retained argon, or ionization state.


    The accumulated count is defined by integrating the argon atom injection rate
    from breakdown time:


    $$

    N_{\mathrm{Ar,eq}}(t) = 18 \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{Ar}}(t'')\,dt''

    $$


    where $N_{\mathrm{Ar,eq}}$ is the dimensionless equivalent-electron argon count,
    $\dot{N}_{\mathrm{Ar}}$ is the argon atom injection rate in atoms per second,
    $t$ is time in seconds, and $t_{\mathrm{bd}}$ is the plasma-breakdown time in
    seconds. Argon introduced before breakdown belongs to the prefill contribution
    represented by argon_count, not to this accumulated post-breakdown quantity.


    In practice, the injection rate is obtained from calibrated gas-valve systems,
    reservoir pressure drops, conductance models, or mass-flow measurements, and then
    integrated from the breakdown reference time. Because this quantity represents
    delivered gas, it is not decremented by subsequent ionization, radiation, pumping,
    exhaust, wall retention, or redistribution within the vessel. It is analogous
    to [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_xenon_count](name:accumulated_xenon_count),
    with the numerical weighting set by the atomic number of each species, and can
    contribute to a total injected-particle inventory such as [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).


    Typical values are about $10^{19}$-$10^{22}$ count units for routine argon puffs
    or impurity seeding, corresponding to roughly $6 \times 10^{17}$-$6 \times 10^{20}$
    argon atoms. Larger disruption-mitigation injections can reach about $10^{22}$-$10^{24}$
    count units, depending on the valve system, reservoir pressure, and mitigation
    strategy.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_neon_count
  - name:accumulated_xenon_count
  - name:accumulated_total_particle_count_due_to_gas_injection
- name: accumulated_carbon_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative carbon injected by gas injection after plasma breakdown,
    expressed as an equivalent-electron count with six counts per carbon atom.
  documentation: 'The accumulated carbon count due to gas injection is the running
    total of carbon introduced after plasma breakdown by gas injection, expressed
    as an equivalent-electron count. Each injected carbon atom contributes 6 to the
    dimensionless count, corresponding to the atomic number of carbon, so the value
    is non-negative and increases only when carbon-bearing gas is injected.


    The accumulated equivalent-electron count is related to the carbon atom source
    rate by


    $$

    N_{C,\mathrm{acc}}(t) = 6 \int_{t_\mathrm{bd}}^{t} \Gamma_{C,\mathrm{gas}}(t'')\,dt''

    $$


    where $N_{C,\mathrm{acc}}$ is the accumulated dimensionless equivalent-electron
    count, $t_\mathrm{bd}$ is the plasma-breakdown time, $t$ and $t''$ are times in
    seconds, and $\Gamma_{C,\mathrm{gas}}$ is the injected carbon atom rate in atoms
    per second. The corresponding physical number of injected carbon atoms is $N_{C,\mathrm{acc}}/6$.


    In practice this quantity is computed by integrating calibrated gas-injection
    flow rates from breakdown onward, converting molecular flow to carbon atom flow
    using the gas stoichiometry, and applying the factor of 6. It is the time integral
    of [carbon_rate_due_to_gas_injection](name:carbon_source_rate_due_to_gas_injection)
    and excludes the pre-breakdown inventory represented by [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection).


    Typical values are 0 for pulses without deliberate carbon-bearing gas injection
    and about $10^{18}$-$10^{22}$ for trace or impurity-gas injection cases, depending
    on injected gas species, calibrated valve throughput, and injection duration.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:carbon_source_rate_due_to_gas_injection
  - name:carbon_prefill_count_due_to_gas_injection
- name: accumulated_deuterated_methane_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: 'Cumulative deuterated methane (CD4) admitted by gas injection after
    plasma breakdown, expressed as an equivalent-electron count. Each CD4 molecule
    contributes 10 equivalent electrons: 6 from carbon and 1 from each of the four
    deuterium atoms.'
  documentation: 'Accumulated deuterated methane count due to gas injection is the
    time-integrated dose of neutral deuterated methane, $\mathrm{CD}_4$, admitted
    into the plasma vessel after plasma breakdown, expressed as a dimensionless equivalent-electron
    count. The factor of 10 comes from the electron content of a neutral $\mathrm{CD}_4$
    molecule: 6 electrons from the carbon atom (atomic number $Z = 6$) and 1 from
    each of the four deuterium atoms (atomic number $Z = 1$). Gas present in the vessel
    before breakdown, such as prefill gas, is excluded unless it is actively injected
    during the post-breakdown interval.


    The accumulated equivalent-electron count is defined by integrating the molecular
    injection rate from the breakdown time $t_\mathrm{bd}$ to time $t$:


    $$

    N_{\mathrm{CD}_4,e}(t) = 10 \int_{t_\mathrm{bd}}^{t} \dot{N}_{\mathrm{CD}_4}(t'')
    \, dt''

    $$


    where $N_{\mathrm{CD}_4,e}$ is the accumulated equivalent-electron count, $t_\mathrm{bd}$
    is the plasma-breakdown time, and $\dot{N}_{\mathrm{CD}_4}$ is the neutral $\mathrm{CD}_4$
    molecular injection rate in molecules per second. By construction the quantity
    is non-decreasing in time and resets to zero at each new plasma breakdown, so
    it tracks the running total over a single discharge. It is the time-accumulated
    form of deuterated_methane_count_due_to_gas_injection.


    In practice this quantity is inferred from calibrated gas-injection diagnostics
    such as valve flow calibrations, reservoir pressure and temperature evolution
    (PVT), commanded valve-opening histories, or downstream mass-flow measurements.
    The measured molecular dose is converted to equivalent electrons by multiplying
    the number of injected $\mathrm{CD}_4$ molecules by 10. The equivalent-electron
    convention enables direct comparison and summation across injected species, with
    the carbon contribution feeding [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection),
    the deuterium contribution feeding [deuterium_count_due_to_gas_injection](name:deuterium_count_due_to_gas_injection),
    and the molecule contributing to [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection).


    Molecular injection rates for gas-injection valves typically span $10^{18}$-$10^{21}$
    molecules per second during active puffing. Integrated over a discharge, accumulated
    values range from about $10^{18}$-$10^{21}$ equivalent electrons for small diagnostic
    or impurity-seeding puffs, rising to $10^{21}$-$10^{23}$ equivalent electrons
    for larger cumulative doses.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_carbon_count_due_to_gas_injection
  - name:deuterium_count_due_to_gas_injection
  - name:accumulated_total_particle_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/beryllium/value
    dd_path: summary/gas_injection_accumulated/beryllium/value
    status: composed
