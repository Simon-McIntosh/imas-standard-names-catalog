- name: neon_fraction
  kind: scalar
  status: draft
  description: Neon fraction is the ratio of the volume-averaged total neon particle
    density, summed over all ionization states, to the volume-averaged electron density.
    It is dimensionless and represents the plasma-wide neon concentration relative
    to electrons.
  documentation: 'Neon fraction is a dimensionless impurity concentration measuring
    how much neon is present in the plasma relative to electrons. The neon density
    includes neutral and ionized neon populations summed over all charge states before
    the plasma-volume average is formed.


    The volume-averaged neon fraction is defined by


    $$

    f_{\mathrm{Ne}} = \frac{\left\langle \sum_{q=0}^{10} n_{\mathrm{Ne}^{q+}} \right\rangle_V}{\langle
    n_e \rangle_V}

    $$


    where $n_{\mathrm{Ne}^{q+}}$ is the number density of neon in charge state $q$
    in m^-3, $n_e$ is the electron density in m^-3, and $\langle \cdot \rangle_V =
    V^{-1}\int_V (\cdot)\,dV$ denotes a plasma-volume average over volume $V$. The
    numerator is the [volume-averaged neon density](name:volume_averaged_neon_density),
    and the denominator is the volume-averaged electron density.


    In practice, neon fraction is inferred from plasma composition analysis using
    impurity spectroscopy, radiation measurements, charge-state balance modeling,
    and electron-density information. It should be interpreted as a global composition
    measure, not as a local impurity abundance at a particular radius or viewing chord.


    Typical values are much less than unity. Background neon levels in plasmas without
    deliberate neon injection are often below $10^{-4}$-$10^{-3}$, while neon-seeded
    radiating plasmas can reach about $10^{-3}$-$10^{-2}$ depending on fueling, confinement,
    and exhaust conditions.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_neon_density
  - name:nitrogen_fraction
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  sources:
  - id: dd:summary/composition/neon/value
    dd_path: summary/composition/neon/value
    status: composed
- name: neutron_energy
  kind: scalar
  status: draft
  description: Kinetic energy of a fusion-born neutron, used as the energy variable
    for neutron emission spectra, transport, and detector response calculations.
  documentation: 'Neutron energy $E_n$ is the kinetic energy carried by a neutron
    emitted or transported in a fusion plasma. It is the spectral variable for neutron
    emission spectra and detector response functions, and it separates reaction channels
    such as DD and DT fusion by their characteristic birth energies. Broad distributions
    arise from ion thermal motion, energetic-ion reactions, scattering, and transport
    effects.


    Detector response calculations often fold an incident neutron spectrum with an
    energy-dependent response over $E_n$:


    $$

    C_k = \int R_k(E_n)\, \frac{d\Phi_n}{dE_n}(E_n)\, dE_n

    $$


    where $C_k$ is the predicted signal in detector channel $k$, in counts for a fluence
    calculation or counts s$^{-1}$ for a flux calculation; $R_k(E_n)$ is the channel
    response, with units counts m$^2$ for this normalization; and $d\Phi_n/dE_n$ is
    the incident differential fluence spectrum in m$^{-2}$ eV$^{-1}$ or differential
    flux spectrum in m$^{-2}$ s$^{-1}$ eV$^{-1}$.


    The birth spectrum is computed from two-body fusion kinematics folded with reactant
    velocity distributions, then modified by scattering and transport before detection.
    Measurements infer the spectrum using time-of-flight systems, recoil-particle
    spectrometers, scintillators, activation thresholds, or other energy-sensitive
    diagnostics together with response-function unfolding. Energy-resolved neutron
    emission is represented by neutron_energy_spectrum, with reaction-specific fluxes
    such as [deuterium_deuterium_flux_due_to_thermal_fusion](name:deuterium_deuterium_flux_due_to_thermal_fusion),
    deuterium_tritium_flux_due_to_thermal_fusion, and [deuterium_tritium_flux_due_to_beam_beam_fusion](name:deuterium_tritium_flux_due_to_beam_beam_fusion).


    Typical diagnostic coverage is $1 \times 10^3$-$2 \times 10^7$ eV. Primary thermal
    DD neutrons occur near $2.45 \times 10^6$ eV, and primary thermal DT neutrons
    near $1.41 \times 10^7$ eV; thermal broadening is often $10^4$-$10^5$ eV, while
    energetic-ion populations can produce broader asymmetric tails.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_flux_due_to_thermal_fusion
  - name:deuterium_tritium_flux_due_to_beam_beam_fusion
  sources:
  - id: dd:neutron_diagnostic/detector/energy_band/energies
    dd_path: neutron_diagnostic/detector/energy_band/energies
    status: attached
  - id: dd:neutron_diagnostic/detector/green_functions/source_neutron_energies
    dd_path: neutron_diagnostic/detector/green_functions/source_neutron_energies
    status: attached
