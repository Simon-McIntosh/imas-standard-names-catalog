name: equilibrium_reconstruction_constraint_weight_of_diamagnetic_flux
status: draft
cocos_transformation_type: one_like
description: Relative weight assigned to the diamagnetic flux measurement in the least-squares
  equilibrium reconstruction cost functional.
documentation: "Standard $\\chi^2$ weight controlling the relative importance of the\
  \ diamagnetic flux measurement in the equilibrium reconstruction. The diamagnetic\
  \ flux $\\Delta\\Phi_{\\mathrm{dia}}$ is the difference between the toroidal flux\
  \ threading the plasma cross-section and the vacuum value, related to the total\
  \ plasma stored energy via $W_{\\mathrm{MHD}} \\approx \\Delta\\Phi_{\\mathrm{dia}}\
  \ \\cdot I_p / \\mu_0$ in simplified form. Constraining it helps pin the pressure\
  \ profile in the Grad\u2013Shafranov solution. A weight of 1 applies the nominal\
  \ measurement variance from the diamagnetic loop diagnostic; larger values emphasize\
  \ this global energy constraint. See also `diamagnetic_flux_constraint_exact_flag`\
  \ for flagging whether this constraint is treated as an exact match."
