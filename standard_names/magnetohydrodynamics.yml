- name: toroidal_magnetic_flux_at_halo_boundary
  kind: scalar
  status: active
  description: Signed toroidal magnetic flux through the poloidal cross-section bounded
    by the outermost flux surface of the halo-current region during a disruption.
  documentation: 'The toroidal magnetic flux function evaluated on the outermost flux
    surface bounding the halo-current region during a disruption is the net toroidal
    magnetic-field flux through the enclosed poloidal cross-section. It is distinct
    from the [toroidal halo current](name:toroidal_halo_current), which describes
    current rather than magnetic flux.


    The flux is defined by


    $$

    \Phi_{\mathrm{tor}}(\mathcal{A}_h)=\int_{\mathcal{A}_h}\mathbf{B}\cdot\hat{\phi}\,dA=\int_{\mathcal{A}_h}B_{\phi}\,dA

    $$


    where $\mathcal{A}_h$ is the poloidal area enclosed by the halo boundary, $\mathbf{B}$
    is the magnetic field in tesla, $\hat{\phi}$ is the toroidal unit vector, $B_{\phi}$
    is its toroidal component, and $dA$ is the poloidal area element. The boundary
    value is the halo-region counterpart of [toroidal magnetic flux at the plasma
    boundary](name:toroidal_magnetic_flux_at_plasma_boundary).


    Sign convention: Positive when the toroidal magnetic field points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_halo_current
  - name:toroidal_magnetic_flux_at_plasma_boundary
  sources:
  - dd_path: disruption/global_quantities/phi_halo_boundary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-phi_halo_boundary
