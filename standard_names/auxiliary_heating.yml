- name: forward_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Incident RF power carried by the wave propagating toward a lower hybrid
    antenna at its input reference plane. It is a per-antenna quantity, not a sum
    over multiple antennas.
  documentation: 'Forward power of a lower hybrid antenna is the nonnegative RF power
    carried by the incident traveling wave at the antenna input reference plane. It
    represents power propagating from the generator and transmission-line side toward
    the antenna structure; "forward" specifies this propagation direction rather than
    a signed power convention. The quantity applies to one antenna, so totals over
    several antennas are separate quantities.


    The launched RF power is the part of the forward power that remains after subtracting
    the oppositely propagating reflected power:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the forward power, $P_\mathrm{reflected}$ is the
    reflected power, and $P_\mathrm{launched}$ is the launched power for the same
    antenna and the same reference plane. If a complex voltage-wave reflection coefficient
    $\Gamma$ is used, $\Gamma$ is dimensionless and $|\Gamma|^2$ gives the reflected-to-forward
    power ratio under the corresponding calibration convention.


    In practice, forward power is inferred from calibrated RF measurements that separate
    waves traveling toward and away from the antenna, commonly using directional RF
    measurements or equivalent network measurements near the antenna input. Corrections
    may account for transmission-line attenuation, calibration factors, and the chosen
    reference plane. Forward power can exceed launched power when antenna-plasma mismatch
    or loading changes produce reflected power.


    Typical per-antenna values in lower-hybrid heating or current-drive operation
    are about $10^5$-$5 \times 10^6$ W, while commissioning, conditioning, or low-power
    phases can use $10^3$-$10^5$ W.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:frequency_of_lower_hybrid_antenna
  - name:electron_density_at_launching_position
  sources:
  - id: dd:lh_antennas/antenna/power_forward
    dd_path: lh_antennas/antenna/power_forward
    status: composed
- name: frequency_of_electron_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Operating microwave frequency of an electron cyclotron heating antenna.
    It is a non-negative scalar that selects the cyclotron harmonic and constrains
    where resonance can occur in the magnetic field.
  documentation: 'The frequency of an electron cyclotron heating antenna is the electromagnetic
    wave frequency produced by the antenna for electron cyclotron heating or current
    drive. It is a non-negative scalar; physically active heating uses $f>0$. The
    frequency helps select the electron cyclotron harmonic, while the actual absorption
    location and deposition width also depend on magnetic-field geometry, launch angle,
    wave polarization, density, temperature, and relativistic and Doppler effects.


    In the simple cold, non-relativistic, Doppler-free resonance estimate, the antenna
    frequency matches an integer harmonic of the local electron cyclotron frequency:


    $$

    f \simeq n\,\frac{e B}{2\pi m_e}

    $$


    where $f$ is the antenna frequency in Hz, $n$ is the positive integer harmonic
    number, $e$ is the elementary charge in C, $B$ is the local magnetic flux density
    magnitude in T, and $m_e$ is the electron rest mass in kg. More complete resonance
    calculations include the parallel Doppler shift, relativistic mass correction,
    finite-temperature effects, and wave propagation constraints.


    The frequency is normally set by the microwave source and transmission system
    and is verified by radio-frequency or millimeter-wave instrumentation. In scenario
    design it is compared with equilibrium magnetic-field values to identify accessible
    resonance surfaces, but it should not be interpreted by itself as fixing a unique
    radial power-deposition location.


    Typical electron cyclotron heating frequencies are in the millimeter-wave range,
    about $3 \times 10^{10}$-$2 \times 10^{11}$ Hz for many magnetic-confinement applications,
    with the appropriate value set by the magnetic-field strength and chosen harmonic.
    Related antenna-frequency quantities include [ion cyclotron heating antenna frequency](name:frequency_of_ion_cyclotron_heating_antenna)
    and [lower-hybrid antenna frequency](name:frequency_of_lower_hybrid_antenna).'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
