- name: momentum_flux_limiter_coefficient
  kind: vector
  status: active
  description: Dimensionless coefficient that scales the collisionless free-streaming
    upper bound on momentum-flux density in multi-fluid edge plasma transport closures,
    capping the flux magnitude while leaving its sign direction unchanged.
  documentation: "In multi-fluid edge plasma transport models, gradient-driven diffusive\
    \ closures can produce momentum-flux densities that exceed the physically realizable\
    \ collisionless free-streaming limit in steep-gradient regions such as the scrape-off\
    \ layer and divertor. A flux-limiter coefficient $\\alpha_m$ is introduced to\
    \ bound the effective flux: the limited momentum-flux density magnitude cannot\
    \ exceed $\\alpha_m$ times a free-streaming reference scale, while the sign follows\
    \ the underlying diffusive flux direction.\n\nThe limited momentum-flux density\
    \ $\\Pi^{\\mathrm{lim}}$ is formed by the harmonic-mean combination:\n\n$$\n\\\
    Pi^{\\mathrm{lim}} = \\frac{\\alpha_m \\, \\Pi^{\\mathrm{FS}} \\cdot \\Pi^{\\\
    mathrm{diff}}}{|\\Pi^{\\mathrm{diff}}| + \\alpha_m \\, \\Pi^{\\mathrm{FS}}}\n\
    $$\n\nwhere $\\Pi^{\\mathrm{diff}}$ is the collisional diffusive momentum-flux\
    \ estimate, $\\Pi^{\\mathrm{FS}} = m n v_{\\mathrm{th}}^2$ is the free-streaming\
    \ scale with $m$ the particle mass, $n$ the number density, and $v_{\\mathrm{th}}$\
    \ the thermal speed. When $|\\Pi^{\\mathrm{diff}}| \\gg \\alpha_m \\Pi^{\\mathrm{FS}}$\
    \ the flux saturates at $\\pm \\alpha_m \\Pi^{\\mathrm{FS}}$; when $|\\Pi^{\\\
    mathrm{diff}}| \\ll \\alpha_m \\Pi^{\\mathrm{FS}}$ the diffusive value is recovered\
    \ unchanged.\n\nSpecializations target individual projection directions, such\
    \ as parallel_momentum_coefficient for field-aligned transport, and individual\
    \ particle populations, such as ion_state_momentum_coefficient for specific ion\
    \ charge states or parallel_neutral_state_momentum_coefficient for neutral-particle\
    \ parallel transport. The coefficient is intrinsically non-negative; values in\
    \ the range 0.1\u20131 are common in edge-plasma simulations, selected by calibration\
    \ against experimental separatrix and divertor data."
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: flux_limiter_coefficient
    operator: momentum
    operator_kind: qualifier
- name: ion_momentum_flux_limiter_coefficient
  kind: vector
  status: active
  description: Dimensionless ion momentum-flux limiter coefficient that scales the
    collisionless free-streaming bound component-by-component, capping flux magnitude
    while preserving its sign.
  documentation: 'The ion momentum coefficient is a dimensionless flux-limiter parameter
    for gradient-driven momentum transport, providing one limiter factor for each
    selected spatial transport component. It is the ion specialization of [momentum_flux_limiter_coefficient](name:momentum_flux_limiter_coefficient),
    scaling the collisionless free-streaming bound while preserving the direction
    supplied by the underlying diffusive closure.


    For each selected component, the limited momentum-flux density is defined by the
    harmonic-mean closure:


    $$

    \Pi^{\mathrm{lim}} = \frac{\alpha_m \, \Pi^{\mathrm{FS}} \cdot \Pi^{\mathrm{diff}}}{|\Pi^{\mathrm{diff}}|
    + \alpha_m \, \Pi^{\mathrm{FS}}}

    $$


    where $\alpha_m$ is the momentum-flux limiter coefficient, $\Pi^{\mathrm{FS}}$
    is the collisionless free-streaming reference momentum-flux density, $\Pi^{\mathrm{diff}}$
    is the collisional diffusive momentum-flux estimate, and $\Pi^{\mathrm{lim}}$
    is the resulting limited flux density.


    The shared quantity spans parallel, poloidal, and radial ion components; [parallel
    ion momentum-flux limiter coefficient](name:parallel_ion_momentum_flux_limiter_coefficient)
    and [poloidal ion momentum-flux limiter coefficient](name:poloidal_ion_momentum_flux_limiter_coefficient)
    are concrete instances. It applies to momentum flux rather than particle, heat,
    or energy flux, and the coefficient is non-negative.


    Sign convention: Positive when the associated limited momentum-flux density points
    along the selected positive transport direction: along the magnetic field for
    parallel transport, along increasing poloidal angle $\theta$ in flux coordinates
    $(\rho,\theta,\phi)$ for poloidal transport, or toward increasing $R$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame for radial transport; the coefficient does not
    reverse that direction.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_flux_limiter_coefficient
  - name:parallel_ion_momentum_flux_limiter_coefficient
  - name:poloidal_ion_momentum_flux_limiter_coefficient
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: ion
    operator_kind: qualifier
- name: neutral_momentum_flux_limiter_coefficient
  kind: vector
  status: active
  description: Dimensionless vector flux-limiter coefficient that scales the free-streaming
    upper bound on neutral-particle momentum-flux density component-by-component in
    edge-plasma transport closures.
  documentation: 'The neutral momentum coefficient is the neutral-particle specialization
    of the general momentum_coefficient vector, providing one dimensionless limiter
    factor per spatial direction for neutral momentum transport in multi-fluid edge
    plasma models. Each directional component independently bounds the corresponding
    neutral momentum flux density, preventing unphysical exceedance of the free-streaming
    limit when the neutral mean free path is large relative to macroscopic gradient
    scales.


    The component $\alpha_\alpha$ in direction $\hat{e}_\alpha$ is defined as the
    ratio of the modeled flux to its free-streaming upper bound:


    $$

    \alpha_\alpha = \frac{\Pi_\alpha}{\Pi_\alpha^{\rm free}}

    $$


    where $\Pi_\alpha$ is the modeled neutral momentum flux density in direction $\hat{e}_\alpha$
    and $\Pi_\alpha^{\rm free} = m_n n_n u_\alpha^{\rm free}$ is the free-streaming
    estimate, with $m_n$ the neutral particle mass, $n_n$ the neutral number density,
    and $u_\alpha^{\rm free}$ the direction-$\alpha$ free-streaming reference speed.
    The constraint $\alpha_\alpha \in [0, 1]$ ensures the closure preserves the sign
    of the momentum flux while bounding its magnitude. The field-aligned component
    is analogous to parallel_neutral_state_momentum_coefficient, which resolves the
    same quantity by internal neutral state.


    Components are computed within edge-plasma transport closures as a function of
    local collisionality; values near 1 characterize the collision-dominated limit,
    while values near 0 indicate strongly free-streaming conditions where the limiter
    actively constrains the flux.


    Sign convention: Positive when the neutral momentum flux in the corresponding
    direction is in the same sense as the free-streaming estimate along the respective
    axis of the right-handed cylindrical $(R, \phi, Z)$ frame or along the magnetic-field
    direction.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: momentum_flux_limiter_coefficient
    operator: neutral
    operator_kind: qualifier
- name: parallel_ion_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Parallel component of the dimensionless ion momentum flux-limiter coefficient
    that scales the free-streaming bound on parallel ion momentum-flux density.
  documentation: 'The parallel component of the dimensionless ion momentum-flux limiter
    coefficient scales the free-streaming upper bound imposed on ion momentum-flux
    density along the local magnetic-field direction. It is the parallel member of
    the vector quantity [ion momentum flux limiter coefficient](name:ion_momentum_flux_limiter_coefficient).


    The limiting relation is


    $$

    \left|\Pi_{\parallel,i}\right| \leq C_{\parallel,i}\,\Pi_{\parallel,\mathrm{fs}}

    $$


    where $C_{\parallel,i}$ is this dimensionless coefficient, $\Pi_{\parallel,i}$
    is the signed parallel ion momentum-flux density, and $\Pi_{\parallel,\mathrm{fs}}$
    is the nonnegative free-streaming bound; the two flux densities have pressure-equivalent
    units. The coefficient applies to the parallel direction and is distinct from
    the [radial ion momentum flux limiter coefficient](name:radial_ion_momentum_flux_limiter_coefficient)
    and from charge-state-resolved parallel coefficients.


    Sign convention: Positive when the associated parallel ion momentum flux is co-directed
    with the local magnetic-field vector.'
  unit: '1'
