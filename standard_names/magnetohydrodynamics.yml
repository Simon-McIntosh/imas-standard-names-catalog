- name: electron_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure of the electron population, including both thermal
    and suprathermal contributions.
  documentation: 'The electron pressure $p_e = n_e k_B T_e$ represents the total kinetic
    pressure exerted by the electron population, encompassing both the bulk thermal
    component and any suprathermal (non-thermal) electrons present. In fusion plasmas,
    the electron pressure contributes significantly to the total plasma pressure,
    which balances the magnetic pressure in equilibrium. Typical core values range
    from 10 to 1000 kPa in tokamak plasmas, depending on the density and temperature
    profiles. The electron pressure is commonly inferred from the electron density
    and temperature measured by Thomson scattering or electron cyclotron emission
    diagnostics, combined with equilibrium reconstruction. For the thermal component
    alone, see [thermal_electron_density](name:thermal_electron_density) and [electron_temperature](name:electron_temperature).
    The total pressure typically also includes contributions from [thermal_ion_pressure](name:thermal_ion_pressure)
    and [parallel_fast_ion_pressure](name:parallel_fast_ion_pressure) when fast ions
    are present.


    Sign convention: Positive when the electron population exerts an outward force
    normal to a flux surface.'
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:thermal_electron_density
  - name:electron_temperature
  - name:thermal_ion_pressure
  - name:parallel_fast_ion_pressure
  sources:
  - id: dd:plasma_profiles/ggd/electrons/pressure/values
    dd_path: plasma_profiles/ggd/electrons/pressure/values
    status: composed
  - id: dd:sawteeth/profiles_1d/p_e
    dd_path: sawteeth/profiles_1d/p_e
    status: composed
- name: electron_radiated_energy_over_halo_region_due_to_impurity_radiation
  kind: scalar
  status: draft
  description: Cumulative energy radiated by electrons through interactions with impurity
    ions within the halo region during a tokamak disruption.
  documentation: "This quantity quantifies the total energy lost by the electron population\
    \ to electromagnetic radiation emitted by impurity ions (e.g., carbon, tungsten,\
    \ or argon) within the halo region \u2014 the open-field-line plasma region outside\
    \ the last closed flux surface that forms during a disruption. The radiated energy\
    \ is the time integral of the radiated power over the disruption duration: $E_{\\\
    mathrm{rad}} = \\int P_{\\mathrm{rad}}(t)\\,dt$, where $P_{\\mathrm{rad}}$ is\
    \ the [electron radiated power over the halo region due to impurity radiation](name:electron_radiated_power_over_halo_region_due_to_impurity_radiation).\
    \ This energy contributes to the global disruption energy balance, alongside the\
    \ ohmic energy dissipated in the halo by current decay, captured by [ohmic energy\
    \ over halo region](name:ohmic_energy_over_halo_region). The impurity radiation\
    \ in the halo region is a critical loss channel that can cool the plasma, reduce\
    \ halo current magnitude, and mitigate wall damage. Typical radiated energy fractions\
    \ range from 10\u201370% of the total magnetic energy stored in the plasma before\
    \ the disruption, depending on impurity seeding and plasma conditions."
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:electron_radiated_power_over_halo_region_due_to_impurity_radiation
  - name:ohmic_energy_over_halo_region
  sources:
  - id: dd:disruption/global_quantities/energy_radiated_electrons_impurities_halo
    dd_path: disruption/global_quantities/energy_radiated_electrons_impurities_halo
    status: composed
- name: electron_temperature_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Electron temperature measured shortly after a sawtooth crash, capturing
    the flattened core profile during the post-crash relaxation phase.
  documentation: "The electron temperature $T_e$ after a sawtooth crash quantifies\
    \ the core thermal energy redistribution following the internal kink instability\
    \ that flattens the $q=1$ surface. During the sawtooth crash, magnetic reconnection\
    \ expels hot core plasma, reducing the central $T_e$ by 10\u201340% in conventional\
    \ tokamaks; the post-crash profile then recovers via Ohmic heating and transport\
    \ on longer timescales. This quantity is measured by electron cyclotron emission\
    \ (ECE) radiometry or Thomson scattering with high time resolution ($\\sim$10\u2013\
    100 $\\mu$s) to resolve the crash dynamics. Typical core values range from 0.1\u2013\
    0.5 keV in Ohmic L-mode plasmas to 2\u201310 keV in auxiliary-heated H-mode discharges.\n\
    \nSign convention: Positive when the electron thermal energy exceeds the reference\
    \ zero-point (absolute temperature scale).\n\nCross-references to related quantities\
    \ include [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target)\
    \ for the boundary value and [electron_pressure](name:electron_pressure) for the\
    \ associated pressure evolution. The companion [total_plasma_density_at_post_sawtooth_crash](name:total_plasma_density_at_post_sawtooth_crash)\
    \ provides the post-crash density."
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:electron_temperature_at_divertor_target
  - name:electron_pressure
  - name:total_plasma_density_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/t_e
    dd_path: sawteeth/profiles_1d/t_e
    status: composed
- name: fast_electron_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Number density of suprathermal (fast) electrons in the plasma core
    immediately following a sawtooth crash event.
  documentation: 'The fast electron number density $n_{e,\mathrm{fast}}$ quantifies
    the suprathermal electron population (energies well above the thermal bulk, typically
    10--100~keV) that persists or is redistributed after a sawtooth crash. During
    the crash, the central safety factor rises above unity and magnetic reconnection
    expels or redistributes fast electrons from the core, transiently modifying the
    fast-electron profile. Typical core values in tokamak sawtoothing regimes range
    from $10^{16}$~m$^{-3}$ to $10^{18}$~m$^{-3}$, depending on auxiliary heating
    (e.g., electron cyclotron current drive) and the fast-electron source strength.


    The density is inferred from electron cyclotron emission (ECE) measurements, hard
    X-ray tomography, or fast-electron bremsstrahlung diagnostics, often combined
    with equilibrium reconstruction to unfold the thermal background.


    Sign convention: Positive when $n_{e,\mathrm{fast}}$ represents the number of
    fast electrons per unit volume.


    The definition of fast electron density in general (i.e., not specifically post-crash)
    is given by the sibling `fast_electron_density`.'
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:total_plasma_density_at_post_sawtooth_crash
  - name:electron_temperature_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/n_e_fast
    dd_path: sawteeth/profiles_1d/n_e_fast
    status: composed
- name: magnetic_shear_at_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Normalized radial gradient of the safety factor, quantifying the divergence
    of magnetic field lines between adjacent flux surfaces, evaluated at the center
    of a neoclassical tearing mode island.
  documentation: 'The magnetic shear $s = (\rho/q)\,dq/d\rho$ (with $\rho$ the normalized
    toroidal flux radius) measures the rate at which the field-line pitch changes
    between neighboring flux surfaces. At the center of a neoclassical tearing mode
    (NTM) island, the shear is modified from its unperturbed profile due to the presence
    of the magnetic island, influencing the mode stability through the bootstrap current
    perturbation. The quantity is dimensionless and evaluated at the O-point of the
    NTM island; typical core values in tokamaks range from $s\approx0.5$\textendash$2.0$
    in the absence of strong shear reversal. Reconstruction from equilibrium codes
    (e.g., EFIT, LIUQE) constrained by magnetic diagnostics provides the equilibrium
    $q$ profile from which $s$ is derived.


    Sign convention: Positive when the safety factor increases with minor radius,
    corresponding to monotonic $q$ profiles.


    See [magnetic_shear](name:magnetic_shear) for the profile quantity, [magnetic_shear_of_separatrix](name:magnetic_shear_of_separatrix)
    for evaluation at the last-closed flux surface, and [toroidal_mode_number_of_neoclassical_tearing_mode](name:toroidal_mode_number_of_neoclassical_tearing_mode)
    for the mode helicity.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:magnetic_shear
  - name:magnetic_shear_of_separatrix
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  sources:
  - id: dd:sawteeth/diagnostics/magnetic_shear_q1
    dd_path: sawteeth/diagnostics/magnetic_shear_q1
    status: composed
- name: ohmic_energy_over_halo_region
  kind: scalar
  status: draft
  description: Cumulative ohmic energy dissipated by resistive current decay within
    the halo region during a tokamak disruption.
  documentation: This quantity represents the time-integrated ohmic heating energy
    deposited in the halo region during a disruption, arising from the resistive dissipation
    of the halo current. The halo region is the region of open field lines near the
    plasma boundary that carries a significant fraction of the toroidal plasma current
    during the current quench. The ohmic energy deposition is given by $E_{\mathrm{ohm,halo}}
    = \int_0^{t_{\mathrm{dis}}} I_{\mathrm{halo}}^2(t) \, R_{\mathrm{halo}}(t) \,
    dt$, where $I_{\mathrm{halo}}$ is the halo current (in A), $R_{\mathrm{halo}}$
    is the halo region resistance (in $\Omega$), and $t_{\mathrm{dis}}$ is the disruption
    duration. Typical values in large tokamaks range from several hundred kJ to a
    few MJ, depending on the disruption severity and the halo current magnitude and
    duration. This quantity is inferred from magnetic measurements of the halo current
    combined with models of the halo region resistivity. The cumulative ohmic energy
    over the halo region complements the broader [ohmic_energy](name:ohmic_energy)
    dissipated in the entire plasma. Also closely related are the total halo current
    described by [toroidal_halo_current_of_halo_boundary](name:toroidal_halo_current_of_halo_boundary)
    and the parallel conductive energy deposition from [energy_over_halo_region_due_to_conduction](name:energy_over_halo_region_due_to_conduction).
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:ohmic_energy
  - name:toroidal_halo_current_of_halo_boundary
  - name:energy_over_halo_region_due_to_conduction
  sources:
  - id: dd:disruption/global_quantities/energy_ohm_halo
    dd_path: disruption/global_quantities/energy_ohm_halo
    status: composed
- name: poloidal_halo_current_of_halo_boundary
  kind: scalar
  status: draft
  description: Poloidal component of the halo current evaluated at the outer boundary
    of the halo region during a tokamak disruption.
  documentation: "The poloidal halo current $I_{\\mathrm{halo}}^{\\theta}$ is the\
    \ poloidal component of the electrical current flowing in the halo region \u2014\
    \ the plasma volume outside the last closed flux surface \u2014 during a disruption.\
    \ This current results from the poloidal decay of the plasma current after the\
    \ thermal quench and contributes directly to the electromagnetic forces acting\
    \ on the vessel and in-vessel components. The total halo current is composed of\
    \ a poloidal and a toroidal component; the poloidal component closes the current\
    \ path through the halo plasma and structures. Typical peak values in large tokamaks\
    \ range from 100 kA to several MA depending on the disruption severity and the\
    \ plasma current. The poloidal halo current is measured by segmented magnetic\
    \ probes installed at the first wall or divertor and is reconstructed as part\
    \ of disruption equilibrium analysis. For a consistent description of the halo\
    \ current system, see also [toroidal_halo_current_of_halo_boundary](name:toroidal_halo_current_of_halo_boundary)\
    \ and [poloidal_magnetic_flux_of_halo_boundary](name:poloidal_magnetic_flux_of_halo_boundary).\n\
    \nSign convention: Positive when the poloidal halo current flows in the direction\
    \ of increasing poloidal angle in the right-handed $(R, \\phi, Z)$ cylindrical\
    \ frame."
  unit: A
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_halo_current_of_halo_boundary
  - name:poloidal_magnetic_flux_of_halo_boundary
  sources:
  - id: dd:disruption/global_quantities/current_halo_pol
    dd_path: disruption/global_quantities/current_halo_pol
    status: composed
  - id: dd:disruption/halo_currents/area/current_halo_pol
    dd_path: disruption/halo_currents/area/current_halo_pol
    status: composed
- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux per radian of toroidal angle evaluated at the
    last closed flux surface, providing the outer boundary value for normalized flux
    surface labels.
  documentation: "The value $\\psi_b$ of the poloidal magnetic flux $\\(\\psi)$ at\
    \ the last closed flux surface (LCFS) defines the outer reference for normalized\
    \ flux coordinates such as $\\psi_N = (\\psi - \\psi_0) / (\\psi_b - \\psi_0)$,\
    \ where $\\psi_0$ is the poloidal flux at the magnetic axis ([poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)).\
    \ In tokamak equilibrium reconstruction, $\\psi_b$ is determined from the plasma\
    \ boundary identified by magnetic measurements or equilibrium codes (EFIT, LIUQE).\
    \ Typical values range from 0.5\u201310 Wb for present-day tokamaks, scaling with\
    \ plasma current and major radius. The companion quantity [poloidal_magnetic_flux_of_separatrix](name:poloidal_magnetic_flux_of_separatrix)\
    \ serves the same role in diverted configurations where the LCFS is the separatrix.\n\
    \nSign convention: Positive when the plasma current flows in the direction of\
    \ increasing toroidal angle $\\(\\phi)$ (counter-clockwise viewed from above $+\\\
    hat{Z}$)."
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_of_separatrix
  sources:
  - id: dd:sawteeth/profiles_1d/grid/psi_boundary
    dd_path: sawteeth/profiles_1d/grid/psi_boundary
    status: composed
- name: poloidal_magnetic_flux_of_halo_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at the outer boundary of the halo
    current region during a tokamak disruption.
  documentation: 'The poloidal magnetic flux $\psi_{\text{halo}}$ at the halo boundary
    defines the magnetic surface that separates the confined plasma from the halo
    region, a partially ionized, current-carrying plasma that forms during a disruption
    when the last closed flux surface is lost. This quantity is a key input for halo
    current modeling and disruption mitigation studies, as the poloidal flux at the
    boundary determines the radial extent and toroidal current drive in the halo.
    Typical values range from 0.1 to 10 Wb in medium-size tokamaks, depending on the
    disruption severity and plasma current. It is commonly computed from equilibrium
    reconstruction codes that track the evolving magnetic topology during the disruption.
    See also [toroidal_magnetic_flux_of_halo_boundary](name:toroidal_magnetic_flux_of_halo_boundary)
    for the corresponding toroidal flux and [poloidal_magnetic_flux_of_separatrix](name:poloidal_magnetic_flux_of_separatrix)
    for the pre-disruption confined boundary.


    Sign convention: Positive when the poloidal flux function $\psi$ increases radially
    outward from the magnetic axis.


    For a tokamak with positive plasma current $I_p > 0$, the poloidal flux decreases
    monotonically from the magnetic axis to the boundary, so the halo boundary flux
    is less than the axis flux.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_magnetic_flux_of_halo_boundary
  - name:poloidal_magnetic_flux_of_separatrix
  sources:
  - id: dd:disruption/global_quantities/psi_halo_boundary
    dd_path: disruption/global_quantities/psi_halo_boundary
    status: composed
- name: poloidal_mode_number_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Poloidal mode number $m$ of the magnetic island produced by a neoclassical
    tearing mode, characterizing its poloidal periodicity.
  documentation: 'The poloidal mode number $m$ describes the number of poloidal wavelengths
    of the helical magnetic perturbation around a flux surface for a neoclassical
    tearing mode (NTM). It is defined by the integer $m$ in the Fourier decomposition
    of the perturbed poloidal magnetic field, $\delta B^r \propto \cos(m\theta - n\phi
    + \omega t)$, where $\theta$ and $\phi$ are poloidal and toroidal angles. The
    mode number determines the poloidal structure of the magnetic island chain and
    is quantized by the poloidal periodicity of the plasma equilibrium. For typical
    NTMs in tokamaks, low poloidal mode numbers $m = 2, 3, 4$ are most common, often
    coupling with toroidal mode numbers $n = 1$ (e.g., the $(3,1)$ and $(2,1)$ modes).
    The sign of $m$ indicates the direction of the poloidal phase velocity of the
    perturbation. Measured via magnetic pickup coils (Mirnov probes) or inferred from
    electron cyclotron emission (ECE) imaging that resolves the island''s poloidal
    structure. See also [toroidal_mode_number_of_neoclassical_tearing_mode](name:toroidal_mode_number_of_neoclassical_tearing_mode),
    which together with $m$ fully specifies the mode periodicity.


    Sign convention: Positive when the perturbation rotates in the direction of increasing
    poloidal angle $\theta$ (ion diamagnetic drift direction in the lab frame).'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/m_pol
    dd_path: ntms/time_slice/mode/detailed_evolution/m_pol
    status: attached
  - id: dd:ntms/time_slice/mode/m_pol
    dd_path: ntms/time_slice/mode/m_pol
    status: attached
