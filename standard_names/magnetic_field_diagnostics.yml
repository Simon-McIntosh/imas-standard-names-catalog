- name: twist_period_of_optical_fiber
  kind: scalar
  status: draft
  description: Axial period of the intrinsic helical twist imparted to an optical
    fiber, controlling the evolution of the fiber's birefringence axes along its length.
  documentation: "The twist period $L_t$ is the axial distance along the optical fiber\
    \ over which the intrinsic (or mechanically applied) twist completes one full\
    \ $2\\pi$ rotation of the fiber's birefringence axes. It is distinct from the\
    \ [spun period](name:spun_period_of_optical_fiber), which characterizes the manufacturing-induced\
    \ spin of the fast axis: the spun period arises from drawing the fiber while rotating\
    \ the preform, whereas the twist period describes a separate torsional deformation\
    \ applied to the fiber after drawing. Together these two length scales govern\
    \ the polarization-holding behavior of the fiber \u2014 specifically the rate\
    \ at which linear birefringence is converted to circular birefringence \u2014\
    \ and must both be known to model polarization evolution accurately in Faraday-effect\
    \ current sensors. The [beat length](name:beat_length_of_optical_fiber) sets the\
    \ third characteristic scale: when $L_t \\ll L_B$ (beat length), the twist dominates\
    \ polarization rotation, whereas $L_t \\gg L_B$ leaves linear birefringence intact.\
    \ Typical twist periods in spun high-birefringence fibers range from a few millimeters\
    \ to tens of millimeters, depending on fiber design and intended sensing application.\
    \ The [total fiber length](name:length_of_optical_fiber) wound on the vacuum vessel\
    \ determines how many twist periods contribute to the integrated Faraday rotation\
    \ measurement.\n\nSign convention: Positive when the twist advances the birefringence\
    \ axes in the right-handed sense relative to the fiber propagation direction."
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:spun_period_of_optical_fiber
  - name:beat_length_of_optical_fiber
  - name:length_of_optical_fiber
