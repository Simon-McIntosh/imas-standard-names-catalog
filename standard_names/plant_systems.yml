- name: z_direction_unit_vector_of_pellet_injector
  kind: scalar
  status: active
  description: Vertical component of the unit vector along the unshattered pellet
    velocity immediately before shattering, resolved in the right-handed Cartesian
    (x, y, z) frame.
  documentation: 'This quantity is the z-direction projection of the pellet injector''s
    direction unit vector, representing the direction of the unshattered pellet velocity
    immediately before shattering. It is resolved in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis, where $\hat{z}$ is the vertical unit vector.


    The component is defined by


    $$

    u_z = \hat{\mathbf{u}} \cdot \hat{\mathbf{z}}

    $$


    where $\hat{\mathbf{u}}$ is the unit vector along the unshattered pellet velocity
    and $\hat{\mathbf{z}}$ is the Cartesian z-axis unit vector. The complete injection
    direction is specified jointly with the [x component](name:x_unit_vector_of_pellet_injector)
    and [y component](name:y_unit_vector_of_pellet_injector), subject to $\lVert\hat{\mathbf{u}}\rVert=1$.


    Sign convention: Positive when the injection direction points toward increasing
    $z$ in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ basis.'
  unit: '1'
  physics_domain: plant_systems
  links: []
  sources:
