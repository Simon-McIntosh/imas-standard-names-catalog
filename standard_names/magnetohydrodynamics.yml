      - 1...N
    enhanced_context:
      description: Array of values for velocity r.
      kind: template
- name: radial_vector_potential
  kind: scalar
  status: active
  description: "R-component of the magnetic vector potential in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, where R is major radius directed outward from the symmetry\
    \ axis."
  documentation: 'R-component of the magnetic vector potential is the projection of
    the magnetic vector potential onto the outward major-radius direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It is a signed scalar component of the vector
    potential whose curl gives the magnetic field.


    The component is defined by the vector projection:


    $$

    A_R = \mathbf{A} \cdot \hat{R}

    $$


    where $A_R$ is the R-component of the magnetic vector potential, $\mathbf{A}$
    is the magnetic vector potential, and $\hat{R}$ is the outward major-radius basis
    vector of the right-handed cylindrical $(R, \phi, Z)$ frame.


    This quantity is gage-dependent: a transformation $\mathbf{A} \mapsto \mathbf{A}
    + \nabla\chi$, where $\chi$ is a scalar gage function, can change $A_R$ without
    changing the magnetic field. It is a vector-potential component, not the [R-component
    of the magnetic field](name:radial_magnetic_field).


    Sign convention: Positive when the magnetic vector potential has a component in
    the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T.m
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_diamagnetic_current_density
  sources:
