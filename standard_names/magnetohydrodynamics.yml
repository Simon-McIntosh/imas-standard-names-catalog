- name: volume_averaged_runaway_electron_source_rate
  kind: scalar
  status: draft
  description: Volume average over the confined plasma of the local runaway-electron
    number-density production rate. It includes production from mechanisms such as
    Dreicer, hot-tail, avalanche, Compton, and tritium beta-decay channels, and does
    not include loss terms.
  documentation: 'The volume-averaged runaway electron source rate is the confined-plasma
    average of the local production rate density for runaway electrons. It is a particle-production
    term for the runaway population, not a net balance including losses, transport,
    or deconfinement.


    The volume average is defined by integrating the local runaway-electron production
    rate density over the confined plasma volume:


    $$

    \left\langle \dot{n}_{\mathrm{RE,src}} \right\rangle_V = \frac{1}{V} \int_V \dot{n}_{\mathrm{RE,src}}(\mathbf{r},
    t) \, dV

    $$


    where $\dot{n}_{\mathrm{RE,src}}(\mathbf{r}, t)$ is the local runaway-electron
    production rate density in $\mathrm{m^{-3}\,s^{-1}}$, $dV$ is a differential volume
    element in $\mathrm{m^3}$, and $V$ is the confined plasma volume in $\mathrm{m^3}$.
    The resulting average has units of $\mathrm{m^{-3}\,s^{-1}}$.


    In a volume-averaged runaway-electron density balance, this quantity contributes
    to $d\langle n_{\mathrm{RE}}\rangle_V/dt$ as a source term, while losses and transport
    appear as separate terms. Local mechanism-specific source rates, such as Dreicer
    and hot-tail production rates, may be computed first as volumetric fields and
    then integrated over the confined volume; their volume averages can be summed
    with other local channels such as avalanche multiplication, Compton scattering,
    and tritium beta decay when those processes are included.


    This quantity is usually obtained from kinetic or reduced runaway-electron models
    using plasma parameters such as electric field, electron density, temperature,
    effective charge, magnetic geometry, and seed population. It is most important
    during rapid cooling, current quench, or high-electric-field phases, where small
    seed production can be amplified by avalanche multiplication.


    Typical values are strongly scenario- and model-dependent. They are effectively
    0 m^-3.s^-1 when no runaway-production channel is active, can be finite but small
    for weak seed channels, and can rise by many orders of magnitude during disruption
    phases with strong electric fields and avalanche amplification.'
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_density
  - name:volume_integrated_runaway_electron_density
  - name:parallel_volume_averaged_runaway_electron_current_density
  arguments:
  - name: runaway_electron_source_rate
    operator: volume_averaged
    operator_kind: qualifier
  sources:
  - id: dd:runaway_electrons/global_quantities/volume_average/ddensity_dt_tritium
    dd_path: runaway_electrons/global_quantities/volume_average/ddensity_dt_tritium
    status: composed
- name: volume_integrated_runaway_electron_density
  kind: scalar
  status: draft
  description: Total number of runaway electrons in the confined plasma, obtained
    by integrating the local runaway electron number density over the entire plasma
    volume.
  documentation: "The volume-integrated runaway electron density is the total count\
    \ of runaway electrons present in the plasma at a given instant. Runaway electrons\
    \ are suprathermal electrons whose high momentum renders collisional drag ineffective\
    \ compared with continued electric-field acceleration; their total count is the\
    \ primary global scalar measure of runaway population severity during disruptions\
    \ and current quenches.\n\nThe quantity is defined as:\n\n$$\nN_\\mathrm{RE} =\
    \ \\int_V n_\\mathrm{RE}(\\mathbf{r}) \\, dV\n$$\n\nwhere $n_\\mathrm{RE}$ is\
    \ the [local runaway electron number density](name:runaway_electron_density) and\
    \ $V$ is the confined plasma volume. Because $n_\\mathrm{RE}$ is non-negative\
    \ everywhere, $N_\\mathrm{RE}$ is also non-negative and dimensionless \u2014 a\
    \ pure particle count with unit 1.\n\n$N_\\mathrm{RE}$ rises sharply when the\
    \ induced electric field during a disruption drives avalanche multiplication,\
    \ which is the dominant generation mechanism in large-device scenarios. It is\
    \ inferred from hard X-ray emission intensity, synchrotron radiation imaging,\
    \ or from the [parallel runaway electron current density](name:parallel_runaway_electron_current_density)\
    \ integrated over the runaway beam cross-section. The companion quantity [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density)\
    \ normalizes this count by the plasma volume, while [volume_averaged_runaway_electron_source_rate](name:volume_averaged_runaway_electron_source_rate)\
    \ provides the corresponding volumetric generation rate governing the time evolution\
    \ of $N_\\mathrm{RE}$."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_density
  - name:parallel_runaway_electron_current_density
  - name:volume_averaged_runaway_electron_density
  - name:volume_averaged_runaway_electron_source_rate
  arguments:
  - name: runaway_electron_density
    operator: volume_integrated
    operator_kind: qualifier
  sources:
