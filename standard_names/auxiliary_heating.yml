- name: toroidal_component_of_wave_vector
  kind: scalar
  status: draft
  description: Projection of the wave vector onto the toroidal direction $\hat{\phi}$,
    giving the toroidal wavenumber $k_\phi$ of a coherent electromagnetic wave along
    a beam or ray path.
  documentation: "The toroidal component $k_\\phi$ of the [wave vector](name:wave_vector)\
    \ characterizes how rapidly the wave phase advances in the toroidal direction\
    \ $\\hat{\\phi}$ of the right-handed cylindrical $(R, \\phi, Z)$ frame. For a\
    \ locally plane wave with wave vector $\\mathbf{k}$, it is defined as $k_\\phi\
    \ = \\mathbf{k} \\cdot \\hat{\\phi}$, where $\\hat{\\phi}$ is the unit vector\
    \ in the direction of increasing toroidal angle. The toroidal refractive index\
    \ is related by $N_\\phi = c\\,k_\\phi / \\omega$, where $c$ is the speed of light\
    \ and $\\omega$ is the angular frequency; $N_\\phi$ governs wave accessibility\
    \ and absorption in electron cyclotron and lower-hybrid heating schemes. In beam\
    \ tracing and ray tracing calculations, $k_\\phi$ evolves along the ray according\
    \ to the toroidal ray equation $dk_\\phi/ds = -\\partial \\mathcal{H}/\\partial\
    \ \\phi / |\\nabla_k \\mathcal{H}|$, where $\\mathcal{H}$ is the local dispersion\
    \ relation and $s$ is the arc length. For EC waves in tokamaks, typical magnitudes\
    \ are $|k_\\phi| \\sim 10$\u2013$200\\;\\text{m}^{-1}$, depending on launch geometry\
    \ and plasma parameters. The complementary [vertical_component_of_wave_vector](name:vertical_component_of_wave_vector)\
    \ $k_Z$ completes the cylindrical decomposition of $\\mathbf{k}$."
  unit: m^-1
  physics_domain: auxiliary_heating
  links:
  - name:wave_vector
  - name:vertical_component_of_wave_vector
  constraints: []
