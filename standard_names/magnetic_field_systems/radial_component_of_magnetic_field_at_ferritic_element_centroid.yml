name: radial_component_of_magnetic_field_at_ferritic_element_centroid
description: Radial ($R$) component of the magnetic field evaluated at the centroid
  of a ferritic insert element.
documentation: "The radial magnetic field component $B_R = \\mathbf{B} \\cdot \\hat{R}$\
  \ at the volumetric centroid of each ferritic element quantifies the major-radius-directed\
  \ field driving the element's radial magnetization. In an ideal axisymmetric tokamak\
  \ equilibrium $B_R$ vanishes on the midplane; non-zero values arise from the poloidal\
  \ field structure, field ripple, and the perturbation introduced by the ferritic\
  \ inserts themselves. Typical magnitudes at the insert locations are of order $10^{-2}$\u2013\
  $10^{-1}\\;\\mathrm{T}$, much smaller than the toroidal component but critical for\
  \ accurate ripple compensation modeling. Self-consistent equilibrium codes compute\
  \ $B_R$ at each centroid, feed it through the material $B$-$H$ curve, and iterate\
  \ until the total field (vacuum + ferritic response) converges. Positive when directed\
  \ in the $+R$ (outward) direction of the machine cylindrical coordinate system.\
  \ See also the toroidal and vertical field components at the same centroid and `radial_component_of_magnetic_field`\
  \ for the general radial field."
kind: vector_component
unit: T
