    dd_documentation:
      leaf: 'Processed image in apparent temperature. First dimension : row index
        (horizontal orientation). Second dimension: column index (vertical orientation).
        The size of this matrix is assumed to be constant over time'
      parent_path: camera_ir/channel/camera/frame
      parent: Set of frames
      data_type: FLT_2D
      unit: K
      coordinates:
      - 1...N
    enhanced_context:
      description: Processed 2D image of apparent surface temperature from an infrared
        camera frame, representing the surface temperature distribution of plasma-facing
        components (PFCs). Used for heat load characterisation and machine protection.
      kind: llm
- name: maximum_surface_temperature
  kind: scalar
  status: active
  description: Peak apparent temperature of the exposed plasma-facing surface over
    all valid points within a defined infrared-camera region of interest.
  documentation: 'This quantity is the largest apparent temperature assigned to the
    exposed material surface of a plasma-facing component within a specified infrared-camera
    region of interest. It is an extremum of the local [surface temperature](name:surface_temperature),
    not a local value, area average, or heat-flux measure.


    $$

    T_{\mathrm{max,ROI}} = \max_{\mathbf{x} \in V_{\mathrm{ROI}}} T_s(\mathbf{x})

    $$


    where $T_s(\mathbf{x})$ is the surface temperature at surface position $\mathbf{x}$,
    and $V_{\mathrm{ROI}}$ is the set of valid surface positions in the defined region
    of interest. Points excluded from the valid set do not contribute to the maximum.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  arguments:
  - name: surface_temperature
    operator: maximum
