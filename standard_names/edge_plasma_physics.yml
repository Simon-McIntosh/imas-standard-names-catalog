- name: boron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of boron at the plasma boundary, evaluated as the local,
    intensive particle count per physical volume on the last closed magnetic flux
    surface, summed over neutral atoms and all ionization states.
  documentation: 'Number density of boron at the plasma boundary is the local, intensive
    particle count per physical volume for elemental boron evaluated on the last closed
    magnetic flux surface. The plasma boundary is the limiting closed magnetic flux
    surface separating confined plasma from the open-field-line scrape-off-layer region.


    The local elemental-boron number density at a boundary point is the zeroth velocity
    moment summed over neutral boron and all ionic charge states:


    $$

    n_{\mathrm B}(\mathbf{x}_b,t) = \sum_{z=0}^{5} \int f_{\mathrm B,z}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{\mathrm B}$ is the elemental-boron number density, $\mathrm B$ denotes
    boron, $\mathbf{x}_b$ is a point on the last closed magnetic flux surface, $t$
    is time, $z$ is the boron charge-state index with $z=0$ denoting neutral boron
    and $z=1$ through $5$ denoting the ionic states, $f_{\mathrm B,z}$ is the phase-space
    distribution function for that state, $\mathbf{v}$ is particle velocity, and $d^3v$
    is the velocity-space volume element.


    This quantity applies specifically to elemental boron and includes neutral atoms
    together with all ionic charge states through fully stripped B5+. It is a local
    value at the plasma boundary, with no averaging over the boundary surface or over
    a volume, and excludes densities of other elements and electrons. Unlike [ion_density_at_plasma_boundary](name:ion_density_at_plasma_boundary),
    it is not restricted to charged ions.


    It is the boron-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_boron_density_at_plasma_boundary](name:flux_surface_averaged_boron_density_at_plasma_boundary)
    applies the same neutral-plus-ionic boron aggregation but averages the density
    over the last closed magnetic flux surface rather than giving the local boundary
    value.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/boron/value
    version: 4.1.0
- name: deuterium_tritium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of the effective deuterium-tritium fuel pseudo-species
    at the plasma boundary, evaluated as the local, intensive particle count per physical
    volume on the last closed magnetic flux surface.
  documentation: 'Number density of the effective deuterium-tritium fuel pseudo-species
    at the plasma boundary is the local, intensive particle count per physical volume
    for that effective species evaluated on the last closed magnetic flux surface.
    The plasma boundary is the limiting closed magnetic flux surface separating confined
    plasma from the open-field-line scrape-off-layer region.


    The local effective deuterium-tritium number density is the zeroth velocity moment
    of its distribution function at a boundary point:


    $$

    n_{DT}(\mathbf{x}_b,t) = \int f_{DT}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{DT}$ is the effective deuterium-tritium fuel-pseudo-species number density,
    $\mathbf{x}_b$ is a point on the last closed magnetic flux surface, $t$ is time,
    $\mathbf{v}$ is the velocity of the effective pseudo-species, $f_{DT}$ is its
    phase-space distribution function, and $d^3v$ is the velocity-space volume element.


    This quantity applies to the deuterium-tritium fuel mixture represented as one
    effective pseudo-species, rather than to separate deuterium and tritium populations.
    It is a local boundary value with no averaging over the boundary surface or over
    a volume, and no additional charge-state aggregation is implied by the effective-species
    representation.


    It is the deuterium-tritium-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    Unlike [flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_tritium_density_at_plasma_boundary),
    it denotes the local value at the plasma boundary rather than an average over
    that last closed magnetic flux surface.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - kind: imas-dd
    ref: summary/local/separatrix/n_i/deuterium_tritium/value
    version: 4.1.0
- name: electron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of electrons at the plasma boundary, evaluated as the
    local, intensive particle count per physical volume on the last closed magnetic
    flux surface.
  documentation: 'Number density of electrons at the plasma boundary is the local,
    intensive particle count per physical volume for the electron population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local electron number density is the zeroth velocity moment of the electron
    distribution function at a boundary point:


    $$

    n_e(\mathbf{x}_b,t) = \int f_e(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_e$ is the electron number density, $\mathbf{x}_b$ is a point on the last
    closed magnetic flux surface, $t$ is time, $\mathbf{v}$ is electron velocity,
    $f_e$ is the electron phase-space distribution function, and $d^3v$ is the velocity-space
    volume element.


    This quantity applies specifically to electrons and is not an ion or neutral-particle
    density. It is a local boundary value, with no averaging over the boundary surface
    or over a volume; because electrons are not resolved here into atomic ionization
    states, no charge-state aggregation is applied.


    It is the electron-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_electron_density_at_plasma_boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary)
    instead represents the average of electron density over the same last closed magnetic
    flux surface, rather than the local value.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  sources:
