- name: vertical_magnetic_field
  kind: scalar
  status: draft
  description: Component of the magnetic field vector along the vertical (Z) axis
    in the right-handed cylindrical $(R, \phi, Z)$ coordinate system.
  documentation: 'The vertical magnetic field $B_Z$ is the projection $\mathbf{B}
    \cdot \hat{Z}$ of the total magnetic field vector onto the geometric vertical
    direction. In a tokamak, the poloidal field is the sum of the vertical and radial
    components; $B_Z$ is essential for determining the flux-surface geometry and plasma
    equilibrium, as the poloidal flux function $\psi$ satisfies $\nabla \psi \times
    \nabla \phi \cdot \hat{Z} = R B_Z$. Typical values range from $\pm 0.1-1\,\mathrm{T}$
    in the poloidal plane of medium-size tokamaks, reaching zero at the magnetic axis
    (where $\nabla \psi = 0$) and extremal values near the X-point. The vertical field
    provides the restoring force that maintains plasma position; it is measured by
    magnetic pick-up coils or inferred from equilibrium reconstruction codes. The
    sign of $B_Z$ is tied to the plasma current direction and the orientation of the
    toroidal field. See also [radial_magnetic_field](name:radial_magnetic_field),
    [toroidal_magnetic_field](name:toroidal_magnetic_field), and the full vector quantity
    [magnetic_field](name:magnetic_field).


    Sign convention: Positive when $B_Z$ points in the $+\hat{Z}$ direction (upward
    along the machine vertical axis).'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field
  - name:magnetic_field
