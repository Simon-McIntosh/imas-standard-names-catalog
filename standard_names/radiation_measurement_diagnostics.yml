- name: surface_area_of_filter
  kind: scalar
  status: draft
  description: Total true geometric area of the filter window surface that intercepts
    incoming radiation. For curved windows, this is the material surface area, not
    merely the planar projected aperture.
  documentation: 'Surface area of a filter is the true geometric area of the filter-window
    face exposed to the accepted radiation beam. It describes the size of the intercepting
    surface and is distinct from [thickness_of_filter](name:thickness_of_filter),
    which governs attenuation through the material.


    For an arbitrarily shaped or curved window, the surface area can be defined by
    integrating over the exposed surface:


    $$

    A = \int_U \left| \frac{\partial \mathbf{r}}{\partial u} \times \frac{\partial
    \mathbf{r}}{\partial v} \right|\,du\,dv

    $$


    where $A$ is the surface area in m^2, $\mathbf{r}(u,v)$ is the position vector
    of the window surface in meters, and $u$ and $v$ are dimensionless surface parameters
    spanning the exposed region $U$. For a flat window this reduces to the planar
    aperture area; for a rectangular clear aperture with side lengths $a$ and $b$
    in meters, the area is $ab$.


    In practice, the value is obtained from mechanical design dimensions, aperture-mask
    geometry, optical or mechanical metrology, or a surface model of the installed
    window. For curved filter windows, the true surface area should be computed from
    the measured or specified curvature rather than from the projected outline alone.
    The area scales the intercepted photon rate for a given incident flux density,
    while the energy-dependent transmission is set primarily by material composition
    and filter thickness.


    Typical values range from 10^{-6}-10^{-4} m^2 for small channel filters and from
    10^{-4}-10^{-2} m^2 for larger camera or spectrometer filter windows.'
  unit: m^2
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:thickness_of_filter
  - name:filter_window_width
  - name:filter_window_height
  - name:area_of_filter
  sources:
