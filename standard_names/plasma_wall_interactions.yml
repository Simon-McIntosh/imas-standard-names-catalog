- name: neutral_internal_state_particle_flux_at_wall
  kind: scalar
  status: active
  description: Incident number flux density of neutral particles arriving at a plasma-facing
    wall, resolved by a specified electronic, vibrational, or rotational internal
    state.
  documentation: 'Incident number flux density of neutral particles arriving at a
    plasma-facing wall is the rate at which neutral particles in a specified electronic,
    vibrational, or rotational internal state cross a local wall surface from the
    plasma-facing side, per surface area. It is an incident scalar at the wall and
    is not a signed transport-flux component.


    The incident flux density is the normal velocity moment of the neutral velocity
    distribution over the wall-incident half-space:


    $$

    \Gamma_{\alpha,w}^{\mathrm{inc}} = -\int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w <
    0} \left(\mathbf{v}\cdot\hat{\mathbf{n}}_w\right) f_{\alpha}(\mathbf{x}_w,\mathbf{v})\,d^3\mathbf{v}

    $$


    where $\Gamma_{\alpha,w}^{\mathrm{inc}}$ is this incident number flux density
    for internal state $\alpha$ at wall point $\mathbf{x}_w$, $f_{\alpha}$ is the
    neutral-particle velocity distribution function for that internal state, $\mathbf{v}$
    is particle velocity, and $\hat{\mathbf{n}}_w$ is the local inward unit normal
    of the plasma-facing region, directed from the wall into that region. The condition
    $\mathbf{v}\cdot\hat{\mathbf{n}}_w < 0$ selects particles moving toward the wall,
    so the leading minus sign makes the incident scalar nonnegative.


    This quantity includes wall-incident neutral particles in the specified internal
    state without separating the physical process that produced them before impact.
    Process-resolved contributions, such as [incident neutral internal-state particle
    flux at wall due to recombination](name:incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination),
    are distinct components; [neutral internal-state particle flux](name:neutral_internal_state_particle_flux)
    is the corresponding flux quantity not restricted to wall incidence.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall
  sources:
  - dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/state/emitted/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-energy_fluxes-kinetic-neutral-state-emitted-values
