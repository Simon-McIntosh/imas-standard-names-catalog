- name: line_averaged_tritium_density
  kind: scalar
  status: active
  description: Chord-averaged number density of tritium ions, obtained by averaging
    local tritium ion density along a specified chord.
  documentation: 'Chord-averaged tritium ion density is the path-length mean of the
    local tritium ion number density along a specified chord. It is derived from the
    local [tritium_density](name:tritium_density) and represents the chord-integrated
    fuel content normalized by chord length.


    $$

    \overline{n}_T = \frac{1}{L} \int_0^L n_T(\ell)\,d\ell

    $$


    where $\overline{n}_T$ is the chord-averaged density, $n_T(\ell)$ is the local
    tritium ion density at path coordinate $\ell$, and $L$ is the chord length. The
    average includes the specified chord segment and is distinct from the confined-volume
    mean [volume_averaged_tritium_density](name:volume_averaged_tritium_density) and
    from the corresponding helium-4 quantity [line_averaged_helium_4_density](name:line_averaged_helium_4_density).'
  unit: m^-3
