- name: width_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Full physical width of a hard X-ray detector aperture measured along
    the local X1 direction of the detector frame (X1, X2, X3). It is one rectangular-aperture
    dimension used with the orthogonal height.
  documentation: 'Width of a hard X-ray detector is the full clear aperture extent
    along the local detector-frame axis $\hat{X}_1$ in the detector frame $(\hat{X}_1,
    \hat{X}_2, \hat{X}_3)$. Together with the orthogonal height along $\hat{X}_2$,
    it defines the rectangular detector opening used in geometric acceptance calculations.
    As a length, it is a non-negative scalar and does not encode the orientation sign
    of the local axis.


    For two small, planar, mutually visible rectangular apertures separated in free
    space, the detector width enters the usual small-aperture etendue approximation
    through the detector area:


    $$

    G \simeq \frac{(w_\mathrm{det} h_\mathrm{det})(w_\mathrm{ap} h_\mathrm{ap})}{L^2}\cos\alpha_\mathrm{det}\cos\alpha_\mathrm{ap}

    $$


    where $G$ is the geometric etendue in m$^2$ sr, $w_\mathrm{det}$ is this detector
    width in m, $h_\mathrm{det}$ is the detector height in m, $w_\mathrm{ap}$ and
    $h_\mathrm{ap}$ are the corresponding opposing-aperture dimensions in m, $L$ is
    the center-to-center separation in m, and $\alpha_\mathrm{det}$ and $\alpha_\mathrm{ap}$
    are the angles between each aperture normal and the connecting ray in radians.
    The approximation assumes aperture dimensions are small compared with $L$, the
    apertures are approximately planar, the centers and normals are sufficiently aligned
    that one representative separation and angle can be used, and vignetting or other
    obstructions are negligible.


    In practice the value is taken from the mechanical design, metrology, or detector
    calibration geometry as the distance between the clear inner aperture edges projected
    onto $\hat{X}_1$. If edge chamfers, masks, or partial obstructions are present,
    the relevant value is the effective clear width used by the line-of-sight or acceptance
    model.


    Typical hard-X-ray detector aperture widths are 0.001-0.05 m, with millimeter-scale
    values common for tightly collimated channels and centimeter-scale values used
    for larger scintillator or camera openings.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:height_of_hard_xray_detector
  - name:filter_window_width
  sources:
  - id: dd:hard_x_rays/channel/detector/x1_width
    dd_path: hard_x_rays/channel/detector/x1_width
    status: composed
- name: x1_coordinate_of_filter
  kind: scalar
  status: draft
  description: X1 coordinate of a vertex or sampled point on a diagnostic filter boundary
    in the local planar (X1, X2) frame. It gives the projection of that boundary point
    along the first in-plane basis direction and is distinct from quantities that
    specifically name a separate filter-window component.
  documentation: 'The $x_1$ coordinate of a filter is the signed in-plane position
    of a point on the boundary of the filtering element or its transmissive footprint,
    expressed in a local planar $(X_1, X_2)$ frame with basis $(\hat{X}_1, \hat{X}_2)$.
    It describes the filter boundary itself; [x1_coordinate_of_filter_window](name:x1_coordinate_of_filter_window)
    should be used when the intended object is a separately identified filter-window
    component.


    For a boundary point at position $\mathbf{r}_v$ and a filter-frame origin at $\mathbf{r}_0$,
    the coordinate is the projection onto the first local basis direction:


    $$

    x_1 = (\mathbf{r}_v - \mathbf{r}_0) \cdot \hat{X}_1

    $$


    where $\hat{X}_1$ is the first in-plane unit vector of the local planar $(X_1,
    X_2)$ frame. The origin is normally a defined reference point of the filter plane,
    such as a geometric center or mechanical fiducial, while $\hat{X}_1$ and $\hat{X}_2$
    span the plane and are fixed by the diagnostic mechanical definition or calibration
    fiducials.


    The coordinate is obtained from mechanical drawings, CAD geometry, survey metrology,
    or calibration of the filter aperture used in the X-ray diagnostic line of sight.
    Together with the corresponding [x2_coordinate_of_filter](name:x2_coordinate_of_filter),
    it defines a polygonal or sampled boundary used to compute geometric transmission,
    vignetting, and ray intersections through the filter.


    Typical absolute coordinate excursions are about $10^{-4}$-$10^{-2}$ m for compact
    soft-X-ray filter apertures and can reach a few $10^{-2}$ m for larger spectrometer
    filter openings.


    Sign convention: Positive when the boundary point lies in the $+\hat{X}_1$ direction
    from the origin of the local planar $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:x2_coordinate_of_filter
  - name:x1_coordinate_of_filter_window
  sources:
