- name: x_first_measurement_direction_unit_vector_of_strain_gauge
  kind: scalar
  status: active
  description: X-axis component of the unit vector along the first measurement direction
    of a strain gage, giving the signed direction cosine in the right-handed Cartesian
    (x, y, z) basis.
  documentation: 'Signed x-axis direction cosine of the first measurement-direction
    unit vector of a strain gage is the scalar projection of that unit vector onto
    the positive $\hat{x}$ basis vector of the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame. The first measurement direction is one sensing axis of the strain
    gage, distinct from its second measurement direction.


    The direction cosine is defined by the dot product:


    $$

    u_{1x} = \hat{\mathbf{u}}_{1} \cdot \hat{x}

    $$


    where $\hat{\mathbf{u}}_{1}$ is the unit vector along the first measurement direction
    of the strain gage, $\hat{x}$ is the positive x-axis basis vector of that frame,
    and $u_{1x}$ is this signed direction cosine.


    Together with the direction cosines along the remaining two axes it fixes the
    orientation of the first measurement direction, satisfying $u_{1x}^2 + u_{1y}^2
    + u_{1z}^2 = 1$, with each value bounded between $-1$ and $1$. It is not a strain
    reading, a gage factor, or a spatial coordinate of the gage.


    Sign convention: Positive when the first measurement-direction unit vector projects
    onto the positive $\hat{x}$ direction of the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ frame.'
  unit: '1'
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - dd_path: operational_instrumentation/sensor/direction/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/operational_instrumentation.html#operational_instrumentation-sensor-direction-x
