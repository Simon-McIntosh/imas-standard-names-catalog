- name: toroidal_helium_4_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal velocity of helium-4 ions at the plasma boundary.
  documentation: 'Toroidal helium-4 velocity at the plasma boundary is the local toroidal
    component of the helium-4 ion bulk flow evaluated on the last closed flux surface.
    It is a local boundary value at the evaluation point, not a flux-surface average;
    by contrast, [toroidal_flux_surface_averaged_helium_3_velocity_at_plasma_boundary](name:toroidal_helium_3_velocity_at_plasma_boundary)
    represents a boundary value averaged over a flux surface for helium-3.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the quantity is the projection
    of the helium-4 bulk velocity onto the toroidal basis direction:


    $$

    v_{\phi,{}^{4}\mathrm{He}}(\mathbf{x}_b) = \mathbf{u}_{{}^{4}\mathrm{He}}(\mathbf{x}_b)
    \cdot \hat{\phi}

    $$


    where $\mathbf{x}_b$ is a point on the plasma boundary, $\mathbf{u}_{{}^{4}\mathrm{He}}$
    is the helium-4 ion bulk velocity in m.s^-1, $\hat{\phi}$ is the dimensionless
    unit vector in the direction of increasing toroidal angle, and $v_{\phi,{}^{4}\mathrm{He}}$
    is in m.s^-1.


    In practice this velocity is obtained from local edge ion-flow measurements, such
    as Doppler shifts of helium emission where available, or from edge plasma modeling
    and interpolation to the last closed flux surface. The value may vary around the
    boundary, so it should not be interpreted as a flux-surface-averaged toroidal
    flow unless that averaging is explicitly part of the named quantity.


    Typical edge helium-ion toroidal velocities are often of order 10^3-10^5 m.s^-1,
    with values near 0 possible at flow reversal or stagnation points. The magnitude
    and sign depend on momentum input, collisional coupling to other ion species,
    neoclassical effects, and edge electric fields.


    Sign convention: Positive when the helium-4 ion bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_plasma_boundary
- name: toroidal_hydrogen_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Local toroidal component of the hydrogen ion fluid velocity at the\
    \ pedestal reference location, not a pedestal-region average, resolved along increasing\
    \ toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame where\
    \ R is major radius and Z is vertical height."
  documentation: 'The toroidal hydrogen velocity at the pedestal is the scalar toroidal
    component of the hydrogen ion fluid velocity evaluated at a single local pedestal
    reference location. That reference location is set by the pedestal characterization
    used for the discharge, for example a fitted pedestal-top point or another declared
    point within the steep-gradient pedestal, so this quantity is not an average over
    the whole pedestal region. Comparisons with [toroidal deuterium velocity at the
    pedestal](name:toroidal_deuterium_velocity_at_pedestal) and [toroidal nitrogen
    velocity at the pedestal](name:toroidal_nitrogen_velocity_at_pedestal) should
    use the same local pedestal reference location.


    The projection onto the toroidal basis direction is


    $$

    v_{\phi,\mathrm{H}} = \mathbf{v}_{\mathrm{H}} \cdot \hat{\phi}

    $$


    where $v_{\phi,\mathrm{H}}$ is the toroidal hydrogen velocity in $\mathrm{m\,s^{-1}}$,
    $\mathbf{v}_{\mathrm{H}}$ is the hydrogen ion fluid velocity in $\mathrm{m\,s^{-1}}$,
    and $\hat{\phi}$ is the unit vector along increasing toroidal angle $\phi$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius,
    $\phi$ increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    the vertical height.


    The local value is obtained by evaluating a measured or modeled hydrogen flow
    at the chosen pedestal reference location. Experimental determinations generally
    use Doppler-shift information from hydrogen emission or other edge-flow constraints
    together with viewing geometry and magnetic-equilibrium geometry; modeling obtains
    the quantity from the hydrogen species momentum balance and samples the same pedestal
    point. The companion [hydrogen density at the pedestal](name:hydrogen_density_at_pedestal)
    is often needed to interpret the corresponding hydrogen momentum density and particle
    flow.


    Typical pedestal hydrogen toroidal velocities are signed and strongly scenario
    dependent: weakly rotating edges may be close to 0 m.s^-1, while rotating pedestal
    plasmas often have magnitudes of order 10^3-10^4 m.s^-1 and can be larger under
    strong momentum input. The value should be compared across species only when the
    same pedestal reference location and the same right-handed cylindrical $(R, \phi,
    Z)$ frame are used.


    Sign convention: Positive when the hydrogen ion fluid velocity has a component
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_pedestal
  - name:toroidal_helium_3_velocity_at_pedestal
  - name:toroidal_tungsten_velocity_at_pedestal
  - name:toroidal_nitrogen_velocity_at_pedestal
- name: toroidal_hydrogen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Local toroidal component of the hydrogen species bulk-flow velocity\
    \ evaluated at a point on the plasma boundary, meaning the last-closed flux surface\
    \ or separatrix. It is not a flux-surface average and is signed in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal hydrogen velocity at the plasma boundary is the local component
    of the hydrogen species bulk-flow velocity tangent to the toroidal direction at
    a specified point on the last-closed flux surface or separatrix. The component
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is distinct
    from flux-surface-averaged boundary quantities such as [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    which average around the boundary rather than retaining the local value.


    The local projection is


    $$

    v_{\phi,\mathrm{H}}(\mathbf{x}_b) = \mathbf{v}_{\mathrm{H}}(\mathbf{x}_b) \cdot
    \hat{\phi}

    $$


    where $\mathbf{x}_b$ is the selected boundary position, specified by $R$ and $Z$
    in meters and $\phi$ in radians; $\mathbf{v}_{\mathrm{H}}$ is the hydrogen bulk
    velocity in m.s^-1; $\hat{\phi}$ is the dimensionless toroidal unit vector; and
    $v_{\phi,\mathrm{H}}$ is the toroidal component in m.s^-1.


    In practice this quantity may be inferred from edge flow diagnostics, spectroscopic
    velocity measurements when applicable, or transport calculations constrained by
    edge plasma observations. Because it is local, it can vary with poloidal position
    along the separatrix and should not be substituted for a flux-surface average
    without an explicit averaging operation.


    No universal numerical range applies at the separatrix because the value depends
    strongly on plasma current, toroidal field, collisionality, rotation sources,
    and edge momentum transport. Representative edge main-species toroidal speeds
    are often of order 10^3-10^4 m.s^-1, with values that may be near zero or may
    reverse sign locally.


    Sign convention: Positive when the hydrogen bulk flow has a component in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_plasma_boundary
- name: toroidal_iron_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Toroidal component of the iron impurity ion fluid velocity evaluated\
    \ at the H-mode pedestal reference location. It represents the mean iron ion flow\
    \ along the toroidal direction in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Toroidal iron velocity at the pedestal is the toroidal component
    of the mean fluid velocity of iron impurity ions at a reference position in the
    H-mode pedestal region. The pedestal is the narrow edge transport-barrier region
    where density, temperature, pressure, and rotation can vary rapidly across flux
    surfaces.


    The component is defined by projecting the iron ion fluid velocity onto the toroidal
    basis direction in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,\mathrm{Fe}} = \mathbf{u}_{\mathrm{Fe}} \cdot \hat{\phi}

    $$


    where $\mathbf{u}_{\mathrm{Fe}}$ is the mean iron ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    In practice this quantity is commonly inferred from Doppler shifts of iron spectral
    lines, with corrections for viewing geometry, charge-state selection, and any
    modeled separation between toroidal and poloidal flow contributions. It may also
    be obtained from transport or equilibrium-constrained rotation analysis evaluated
    at the pedestal reference location.


    Typical pedestal toroidal impurity velocities range from $-100$ to $100$ km.s$^{-1}$,
    equivalent to $-1 \times 10^5$ to $1 \times 10^5$ m.s$^{-1}$, depending on plasma
    current, torque input, collisional coupling, radial electric field, and edge transport
    conditions.


    Sign convention: Positive when the iron ion fluid velocity component is in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
