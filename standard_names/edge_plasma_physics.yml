- name: poloidal_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective scalar poloidal component of the ion momentum diffusivity
    tensor; it governs diffusive transport tangent to increasing poloidal angle on
    a magnetic surface. In a Fick-law closure, positive values make the signed diffusive
    momentum flux oppose the gradient of the scalar ion momentum-density component.
  documentation: 'Poloidal ion momentum diffusivity is the effective scalar coefficient
    for diffusive transport of ion momentum along the poloidal direction. The poloidal
    direction is tangent to increasing poloidal angle $\theta$ on a magnetic surface,
    for example in flux coordinates $(\rho, \theta, \phi)$ with $\rho$ a radial flux
    label and $\phi$ the toroidal angle. When a tensor momentum-diffusion model is
    reduced to directional scalar components, this quantity corresponds to the poloidal
    diagonal component for the combined ion population rather than a single ionization
    state.


    In a local Fick-law closure written along poloidal arc length $l_\theta$, the
    signed diffusive flux of the scalar poloidal ion momentum-density component is


    $$

    \Gamma_{M_i,\theta}^{\mathrm{diff}} = - D_{M_i,\theta} \frac{\partial M_{i,\theta}}{\partial
    l_\theta}

    $$


    where $D_{M_i,\theta}$ is the poloidal ion momentum diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Gamma_{M_i,\theta}^{\mathrm{diff}}$ is the signed poloidal diffusive flux of
    poloidal ion momentum in $\mathrm{N\,m^{-2}}$, $M_{i,\theta}$ is the scalar poloidal
    ion momentum-density component in $\mathrm{kg\,m^{-2}\,s^{-1}}$, and $l_\theta$
    is distance in meters increasing with $\theta$. For multiple ionization states,
    $M_{i,\theta}$ represents the summed ion momentum-density projection used by the
    fluid closure.


    This coefficient is inferred or prescribed in edge momentum-transport modeling
    from momentum balance, ion flow measurements, density and temperature constraints,
    source terms, and closures for turbulent, neoclassical, and collisional transport.
    It is the diffusivity counterpart to the signed [poloidal_ion_momentum_flux](name:poloidal_ion_momentum_flux),
    and it is distinct from charge-state-resolved coefficients such as [poloidal_ion_state_momentum_diffusivity](name:poloidal_ion_state_momentum_diffusivity)
    and from neutral momentum transport represented by [poloidal_neutral_momentum_diffusivity](name:poloidal_neutral_momentum_diffusivity).


    Representative effective values in edge transport applications are often of order
    0.01-10 m^2 s^-1, but the appropriate value is highly dependent on turbulence
    level, collisionality, magnetic geometry, and the chosen closure. Non-negative
    finite values represent ordinary down-gradient diffusion; negative fitted values
    indicate an up-gradient effective closure and require explicit physical or modeling
    justification.


    Sign convention: Positive when, in flux coordinates $(\rho, \theta, \phi)$, the
    signed diffusive poloidal ion momentum flux is opposite to the gradient of the
    scalar poloidal ion momentum-density component along increasing poloidal angle
    $\theta$.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_diffusivity
  - name:poloidal_ion_state_momentum_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_ion_diffusivity
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_state_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal ion-state diffusivity is the scalar diagonal transport coefficient\
    \ for diffusive particle transport of a specified ion charge state along increasing\
    \ poloidal angle in a chosen flux-coordinate system (\u03C1, \u03B8, \u03C6).\
    \ It multiplies the charge-state density gradient to give the down-gradient poloidal\
    \ particle flux."
  documentation: 'Poloidal ion-state diffusivity is the scalar diagonal component
    of charge-state-resolved ion particle diffusion in the physical poloidal direction
    associated with increasing $\theta$ in a specified flux-coordinate system $(\rho,\theta,\phi)$.
    It applies to one ionization state $z$ and is the charge-state-resolved counterpart
    of [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity), with analogous role
    to momentum transport coefficients such as [poloidal_ion_state_momentum_diffusivity](name:poloidal_ion_state_momentum_diffusivity).


    The local down-gradient closure for the poloidal particle flux component is


    $$

    \Gamma_{\mathrm{pol},z} = -D_{\mathrm{pol},z}\,\nabla_{\mathrm{pol}} n_z

    $$


    where $\Gamma_{\mathrm{pol},z}$ is the charge-state particle flux density along
    the poloidal direction in $m^{-2}\,s^{-1}$, $D_{\mathrm{pol},z}$ is the poloidal
    ion-state diffusivity in $m^2\,s^{-1}$, $n_z$ is the ion number density for charge
    state $z$ in $m^{-3}$, and $\nabla_{\mathrm{pol}} n_z$ is the physical poloidal
    component of the density gradient in $m^{-4}$. The minus sign means that, for
    $D_{\mathrm{pol},z}>0$, the diffusive flux is opposite to the density gradient;
    if density increases along increasing $\theta$, the diffusive flux component points
    toward decreasing $\theta$.


    In edge plasma particle-balance modeling, this coefficient is used when ionization
    states are evolved separately and poloidal redistribution of each charge-state
    population must be represented. It may be prescribed as an effective transport
    parameter or constrained by comparisons with charge-state-sensitive density measurements,
    together with ionization, recombination, parallel losses, and boundary conditions.


    There is no device-independent numerical range fixed by the definition. In a purely
    diffusive closure it is normally treated as non-negative: $D_{\mathrm{pol},z}=0$
    removes this diffusive channel, while larger values more strongly smooth poloidal
    variations of the charge-state density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_state_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  arguments:
  - name: ion_state_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal diagonal component of the ion charge-state momentum diffusivity,\
    \ governing diffusive transport of that state\u2019s ion momentum density in the\
    \ poloidal direction."
  documentation: 'Poloidal ion state momentum diffusivity is the diagonal transport
    coefficient for diffusive transport of momentum density associated with a specified
    ion charge state along the poloidal direction on a magnetic flux surface. It is
    distinct from a charge-state-summed ion momentum diffusion coefficient, which
    represents transport of total ion momentum density over all ion charge states.


    In flux coordinates $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$
    is a poloidal angle, and $\phi$ is the toroidal angle of the right-handed cylindrical
    $(R,\phi,Z)$ frame with $R$ major radius and $Z$ vertical height, the diffusive
    poloidal flux of poloidal momentum density for charge state $s$ may be written
    as:


    $$

    \Pi_\theta^{(s)} = -D_\theta^{(s)}\,\nabla_\theta\left(n_s m_s u_\theta^{(s)}\right)

    $$


    where $D_\theta^{(s)}$ is the poloidal ion state momentum diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Pi_\theta^{(s)}$ is the diffusive poloidal flux of poloidal momentum density
    in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $n_s$ is the ion density of charge state $s$
    in $\mathrm{m^{-3}}$, $m_s$ is the ion mass in $\mathrm{kg}$, and $u_\theta^{(s)}$
    is the physical poloidal flow velocity in $\mathrm{m\,s^{-1}}$. The metric convention
    is $\nabla_\theta f = h_\theta^{-1}\partial f/\partial\theta$, where $h_\theta
    = |\partial\mathbf{x}/\partial\theta|$ is the poloidal metric scale factor in
    meters, so $\nabla_\theta f$ is a derivative per unit distance along the poloidal
    coordinate line.


    This diffusivity is inferred from poloidal momentum balance, charge-state-resolved
    flow measurements, and theoretical or reduced descriptions of collisional and
    turbulent momentum mixing. It represents only the diffusive contribution; convective
    transport, external torques, ionization and recombination sources, and interspecies
    momentum exchange are separate terms in a full momentum balance.


    Typical edge-plasma values are about $0.01-10\ \mathrm{m^2\,s^{-1}}$. Values below
    $0.1\ \mathrm{m^2\,s^{-1}}$ indicate weak poloidal momentum mixing, while values
    of $1-10\ \mathrm{m^2\,s^{-1}}$ are representative of stronger effective transport
    in turbulent or highly collisional edge regions.


    Sign convention: Positive when a positive $\nabla_\theta(n_s m_s u_\theta^{(s)})$
    in flux coordinates $(\rho,\theta,\phi)$ produces a diffusive poloidal momentum
    flux in the negative $\theta$ direction, so the flux flows down the poloidal gradient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_ion_state_diffusivity
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_energy_diffusivity
  kind: scalar
  status: draft
  description: "Effective diagonal diffusivity for neutral-particle energy transport\
    \ in the poloidal direction of flux coordinates (\u03C1, \u03B8, \u03C6), tangent\
    \ to a flux surface at fixed \u03C1 and \u03C6. It relates the length-normalized\
    \ poloidal gradient of neutral energy density to the diffusive poloidal energy\
    \ flux."
  documentation: 'Poloidal neutral energy diffusivity is the effective diagonal diffusion
    coefficient for transport of neutral-particle energy along the poloidal direction
    in flux coordinates $(\rho,\theta,\phi)$. The direction is tangent to a flux surface
    at fixed $\rho$ and $\phi$, and the coefficient represents how rapidly neutral
    thermal or internal energy is smoothed along that direction.


    A Fick-law closure for the poloidal neutral energy flux density is


    $$

    q_\theta^{\mathrm{n},E} = -D_\theta^{\mathrm{n},E}\,\frac{1}{h_\theta}\,\frac{\partial
    u_n}{\partial \theta}

    $$


    where $q_\theta^{\mathrm{n},E}$ is the neutral energy flux density taken positive
    in the direction of increasing poloidal angle $\theta$, $D_\theta^{\mathrm{n},E}$
    is the poloidal neutral energy diffusivity, $u_n$ is the neutral energy density
    in $\mathrm{J\,m^{-3}}$, and $h_\theta$ is the poloidal metric scale factor in
    meters so that $(1/h_\theta)\partial u_n/\partial\theta$ is a length-normalized
    gradient in $\mathrm{J\,m^{-4}}$. For a Maxwellian neutral population, $u_n$ is
    commonly evaluated from the neutral density and temperature; for example, $u_n=3
    n_n T_n/2$ when $T_n$ is expressed as energy per particle.


    This coefficient is used in reduced neutral-fluid or transport closures for edge
    and scrape-off-layer plasmas when the full neutral energy transport tensor is
    represented by direction-resolved effective diffusivities. Its value may represent
    collisional scattering, charge-exchange mediated redistribution, atomic and molecular
    processes, and unresolved turbulent or kinetic effects. It is the energy-transport
    analog of [poloidal neutral momentum diffusivity](name:poloidal_neutral_momentum_diffusivity),
    and it complements orthogonal-direction quantities such as [radial neutral energy
    diffusion coefficient](name:radial_neutral_energy_diffusion_coefficient).


    Typical effective values range from $0.1-10^4\ \mathrm{m^2\,s^{-1}}$. Smaller
    values are expected for cold, dense, highly collisional divertor neutrals, while
    larger effective values can occur in hotter or more rarefied edge regions, or
    when unresolved kinetic transport is represented by an enhanced diffusive closure.
    A true diffusive coefficient is expected to be non-negative; negative fitted values
    indicate an anti-diffusive effective closure or a convention-dependent model artifact
    rather than ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  arguments:
  - name: neutral_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_momentum_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal component of the effective neutral-particle momentum diffusivity\
    \ tensor in flux coordinates (\u03C1, \u03B8, \u03C6), governing diffusive redistribution\
    \ of neutral momentum along increasing poloidal angle \u03B8."
  documentation: 'Poloidal neutral momentum diffusivity is the diagonal poloidal component
    of an effective neutral-particle momentum diffusivity tensor. It parameterizes
    how neutral momentum density is smoothed along the poloidal direction, tangent
    to increasing $\theta$ at fixed $\rho$ and $\phi$ in flux coordinates $(\rho,\theta,\phi)$,
    locally lying in a meridional plane of the right-handed cylindrical $(R,\phi,Z)$
    frame where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    In a local Fick-type closure, the poloidal diffusive flux of neutral poloidal
    momentum is written as:


    $$

    \Pi_{\theta,n} = -D_\theta\,\frac{\partial}{\partial l_\theta}\left(m_n n_n u_{\theta,n}\right)

    $$


    where $\Pi_{\theta,n}$ is the poloidal neutral-momentum flux in kg m$^{-1}$ s$^{-2}$,
    taken positive in the direction of increasing $\theta$; $D_\theta$ is the poloidal
    neutral momentum diffusivity in m$^2$ s$^{-1}$; $m_n$ is neutral particle mass
    in kg; $n_n$ is neutral number density in m$^{-3}$; and $u_{\theta,n}$ is the
    neutral fluid velocity component along increasing $\theta$ in m s$^{-1}$. The
    poloidal arclength $l_\theta$ follows the coordinate line of increasing $\theta$,
    with metric relation $dl_\theta=h_\theta d\theta$ and $h_\theta=|\partial\mathbf{x}/\partial\theta|_{\rho,\phi}$
    in meters when $\theta$ is dimensionless; the minus sign means that positive diffusivity
    drives neutral poloidal momentum down its arclength gradient.


    This coefficient is usually obtained indirectly from neutral-transport modeling,
    reduced fluid closures, or interpretation of edge and divertor measurements sensitive
    to neutral flow and momentum exchange. As an effective coefficient, it may include
    neutral-neutral collisions, charge-exchange coupling to ions, and unresolved kinetic
    or geometric effects represented in a diffusive approximation.


    Typical effective values in tokamak edge and divertor neutral-momentum closures
    are about 0.01-10 m$^2$ s$^{-1}$, with values up to roughly 100 m$^2$ s$^{-1}$
    possible in highly diffusive reduced descriptions or regions where long neutral
    mean-free paths are represented by an effective fluid diffusivity.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_neutral_energy_diffusivity
  arguments:
  - name: neutral_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_state_energy_diffusivity
  kind: scalar
  status: draft
  description: "Effective diagonal diffusivity for neutral-state energy transport\
    \ along the poloidal tangent in flux coordinates (\u03C1, \u03B8, \u03C6), at\
    \ fixed \u03C1 and \u03C6, in the edge plasma."
  documentation: 'Poloidal neutral state energy diffusivity is the effective diagonal
    transport coefficient for diffusive spreading of the thermal energy density of
    a specified neutral state along the poloidal tangent. In flux coordinates $(\rho,\theta,\phi)$,
    where $\rho$ is a radial flux-surface label, $\theta$ is poloidal angle, and $\phi$
    is toroidal angle, it applies to transport along the physical tangent to changing
    $\theta$ at fixed $\rho$ and $\phi$.


    A length-normalized Fick-law closure for the diffusive poloidal energy flux is


    $$

    q_{\theta,E}^{s} = -D_{\mathrm{pol},E}^{s}\,\frac{\partial \mathcal{E}^{s}}{\partial
    \ell_\theta}

    $$


    where $q_{\theta,E}^{s}$ is the diffusive energy-flux density of neutral state
    $s$ along the poloidal tangent in $W\,m^{-2}$, $\mathcal{E}^{s}$ is the thermal
    energy density of that state in $J\,m^{-3}$, $\ell_\theta$ is physical arc length
    in meters along increasing $\theta$ at fixed $\rho$ and $\phi$, and $D_{\mathrm{pol},E}^{s}$
    is this diffusivity in $m^2\,s^{-1}$. If $h_\theta=|\partial\mathbf{x}/\partial\theta|$
    is the poloidal metric factor for $(\rho,\theta,\phi)$, the gradient in this closure
    is the metric-corrected derivative $h_\theta^{-1}\partial\mathcal{E}^{s}/\partial\theta$.
    The minus sign makes the diffusive flux point down the length-normalized energy-density
    gradient.


    This quantity is usually prescribed, inferred, or calibrated within edge neutral
    transport modeling rather than measured directly. It is the state-resolved counterpart
    of [poloidal_neutral_energy_diffusivity](name:poloidal_neutral_energy_diffusivity),
    the poloidal component of [neutral_state_energy_diffusivity](name:neutral_state_energy_diffusivity),
    and is analogous to directional energy-transport coefficients such as [parallel_energy_diffusivity](name:parallel_energy_diffusivity)
    and [radial_energy_diffusion_coefficient](name:radial_neutral_energy_diffusion_coefficient).
    It may be constrained indirectly by comparison with neutral temperature, radiation,
    particle-balance, or heat-flux observations, depending on the model closure.


    Representative modeling values are highly problem dependent. Reduced edge-neutral
    calculations often explore values of about 0.01-10 m^2 s^-1, while sensitivity
    studies for strong unresolved poloidal mixing may extend toward 100 m^2 s^-1.
    Values near zero represent negligible diffusive poloidal energy spreading for
    the selected neutral state.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_energy_diffusivity
  - name:neutral_state_energy_diffusivity
  - name:parallel_energy_diffusivity
  - name:radial_neutral_energy_diffusion_coefficient
  arguments:
  - name: neutral_state_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_total_current_density
  kind: scalar
  status: draft
  description: Poloidal total current density is the signed component of the total
    edge-plasma current density along the local poloidal direction, summing ohmic,
    bootstrap, and externally driven contributions over all plasma species and charge
    states.
  documentation: 'The poloidal total current density is the component of the aggregated
    current density vector [total_current_density](name:total_current_density) resolved
    along the local poloidal direction in a flux-coordinate system such as $(\rho,
    \theta, \phi)$. It represents the net conventional positive charge flux per unit
    area along increasing poloidal angle after summing ohmic, bootstrap, and externally
    driven current mechanisms over all resolved plasma species and charge states.
    The poloidal unit vector $\hat{\boldsymbol{\theta}}$ is tangent to changing $\theta$
    at fixed radial flux coordinate and toroidal angle $\phi$, embedded in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is vertical
    height.


    The projection is defined by:


    $$

    j_{\theta,\mathrm{total}} = \mathbf{J}_\mathrm{total}\cdot\hat{\boldsymbol{\theta}}
    = \left(\mathbf{J}_\mathrm{ohmic} + \mathbf{J}_\mathrm{bootstrap} + \mathbf{J}_\mathrm{drive}\right)\cdot\hat{\boldsymbol{\theta}}

    $$


    where $j_{\theta,\mathrm{total}}$ is the scalar poloidal total current density
    in A m$^{-2}$, $\mathbf{J}_\mathrm{total}$ and each contribution vector are in
    A m$^{-2}$, and $\hat{\boldsymbol{\theta}}$ is dimensionless. $\mathbf{J}_\mathrm{drive}$
    collects externally driven current sources, while the bootstrap and ohmic terms
    represent neoclassical pressure-gradient drive and inductive electric-field drive,
    respectively.


    In practice this quantity is obtained by projecting a reconstructed or simulated
    total current-density vector onto the local poloidal direction defined by the
    chosen $(\rho, \theta, \phi)$ flux coordinates. It is a directional sibling of
    [radial_total_current_density](name:radial_total_current_density), [toroidal_total_current_density](name:toroidal_total_current_density),
    [vertical_total_current_density](name:vertical_total_current_density), and [parallel_total_current_density](name:parallel_total_current_density);
    the parallel component is field-aligned and is not generally identical to the
    poloidal projection. The related [poloidal_pfirsch_schlueter_current_density](name:poloidal_pfirsch_schlueter_current_density)
    is a specific neoclassical contribution rather than the full summed current.


    Typical edge-plasma magnitudes are highly device- and scenario-dependent. Transport
    and edge simulations commonly give $10^2$-$10^5$ A m$^{-2}$ for steady poloidal
    total current density, with localized source regions, steep-gradient regions,
    or transient events reaching about $10^6$ A m$^{-2}$.


    Sign convention: Positive when conventional current flows in the direction of
    increasing poloidal angle $\theta$ in the explicitly chosen flux-coordinate system
    $(\rho, \theta, \phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_current_density
  - name:radial_total_current_density
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: radial_current_density_due_to_viscosity
  kind: scalar
  status: draft
  description: "Radial component of the viscosity-driven current density in the edge\
    \ plasma, formed from viscous stress contributions and directed along the major-radius\
    \ direction of the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial current density due to viscosity is the major-radius component
    of the electric current density produced by viscous momentum transport in the
    edge plasma. It represents the part of the current associated with viscous stress
    closures, including perpendicular, parallel, and heat-viscous contributions, projected
    onto the $\hat{R}$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.


    A useful defining relation is the projection of the aggregate viscosity-driven
    current density onto the major-radius basis vector:


    $$

    j_R^{\mathrm{visc}} = \left(\mathbf{j}_{\perp}^{\mathrm{visc}} + \mathbf{j}_{\parallel}^{\mathrm{visc}}
    + \mathbf{j}_{q}^{\mathrm{visc}}\right) \cdot \hat{R}

    $$


    where $j_R^{\mathrm{visc}}$ is the radial viscosity-driven current density, $\mathbf{j}_{\perp}^{\mathrm{visc}}$
    is the contribution associated with perpendicular viscous stress, $\mathbf{j}_{\parallel}^{\mathrm{visc}}$
    is the contribution associated with parallel viscous stress, $\mathbf{j}_{q}^{\mathrm{visc}}$
    is the heat-viscous contribution, and $\hat{R}$ is the outward major-radius unit
    vector.


    This quantity is usually computed from edge fluid, gyrofluid, or kinetic transport
    models rather than measured directly. It depends on plasma collisionality, magnetization,
    density and temperature gradients, flow shear, magnetic geometry, and the closure
    used for the viscous stress tensor; it contributes to cross-field current closure
    and to the evolution of electric fields in the edge and scrape-off layer.


    Typical magnitudes are often about 0.01-100 A.m^-2 in quiescent edge conditions,
    with localized or transient values reaching 1000 A.m^-2 when gradients, flows,
    or turbulent structures are strong.


    Sign convention: Positive when the viscosity-driven current density points in
    the direction of increasing major radius $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:radial_current_density_due_to_heat_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  arguments:
  - name: current_density_due_to_viscosity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_electron_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for electron particle transport.
    It is the advective coefficient multiplying electron density in a radial particle-flux
    closure at the plasma edge.
  documentation: 'Radial electron convection velocity is the effective advective speed
    associated with cross-field electron particle transport at the plasma edge. It
    represents the convective, or pinch, part of the radial electron particle flux
    after diffusive transport has been separated from the closure.


    A common particle-flux closure writes the radial electron particle flux as:


    $$

    \Gamma_{e,r} = -D_{e,r}\,\frac{\partial n_e}{\partial r} + v_{e,r}\,n_e

    $$


    where $\Gamma_{e,r}$ is the radial electron particle flux in $\mathrm{m^{-2}\,s^{-1}}$,
    $D_{e,r}$ is an effective radial diffusivity in $\mathrm{m^2\,s^{-1}}$, $n_e$
    is the electron density in $\mathrm{m^{-3}}$, $r$ is an outward radial coordinate
    in meters, and $v_{e,r}$ is the radial electron convection velocity.


    This quantity is usually inferred from edge transport analysis, reduced transport
    modeling, or fits to electron-density evolution using sources, sinks, and radial
    gradients. It is an effective closure coefficient: it need not identify a single
    microscopic drift mechanism and may summarize turbulence, neoclassical effects,
    and geometry-dependent transport into one advective term.


    Typical effective values in the confined edge are from about -50 to 50 m.s^-1.
    Larger apparent values, up to several hundred m.s^-1, can occur in the scrape-off
    layer or during strong transient edge transport, depending on the chosen transport
    closure and averaging interval.


    Sign convention: Positive when the effective electron particle convection is directed
    outward across magnetic flux surfaces from the confined plasma toward the plasma-facing
    material surfaces.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
- name: radial_ion_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for ion particle transport in
    the edge plasma. It is the coefficient multiplying ion density in the cross-field
    ion particle flux, not necessarily a literal ion fluid velocity.
  documentation: 'The radial ion convection velocity $v_{r,i}$ is the effective advective
    coefficient for ion particle transport across magnetic flux surfaces in the edge
    plasma. The radial direction is the outward normal direction associated with an
    increasing radial flux label $\rho$ in a flux-surface coordinate system $(\rho,\theta,\phi)$,
    where $\theta$ is poloidal angle and $\phi$ is toroidal angle. This quantity represents
    the particle-transport channel and need not equal the radial component of the
    ion bulk flow.


    The convective contribution to the radial ion particle flux density is defined
    by:


    $$

    \Gamma_{r,i}^{\mathrm{conv}} = n_i v_{r,i}

    $$


    where $\Gamma_{r,i}^{\mathrm{conv}}$ is the convective radial ion particle flux
    density in m$^{-2}$ s$^{-1}$, $n_i$ is the local ion number density in m$^{-3}$,
    and $v_{r,i}$ is the radial ion convection velocity in m s$^{-1}$. In a full transport
    model this term is commonly combined with diffusive and source terms; the convection
    velocity is the coefficient of the density-proportional part of the cross-field
    particle flux.


    In edge-plasma modeling, $v_{r,i}$ is obtained from transport closures, reduced
    fluid or kinetic models, or inference from particle balance after separating density-gradient-driven
    diffusion from density-proportional advection. It may represent the net effect
    of mean drifts, turbulent transport, intermittent filament motion, ion-neutral
    coupling, and other unresolved processes. Analogous effective convection velocities
    are used for ion energy and momentum channels, including charge-state-resolved
    variants.


    Typical absolute values for background effective radial convection in scrape-off-layer
    and divertor transport studies are about 0.1-100 m s$^{-1}$, depending strongly
    on plasma regime, collisionality, turbulence level, and proximity to material
    surfaces. Local transient or filament-associated effective radial speeds can be
    larger, often 10-1000 m s$^{-1}$, but these may not correspond to a steady flux-surface-averaged
    coefficient.


    Sign convention: Positive when $v_{r,i}$ is directed outward across magnetic flux
    surfaces, toward increasing radial flux label $\rho$ in the flux-surface coordinate
    system $(\rho,\theta,\phi)$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_convection_velocity
  - name:radial_ion_state_momentum_convection_velocity
- name: radial_ion_energy_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for the convective part of ion
    energy transport in the edge plasma. It is an energy-transport coefficient, not
    necessarily the ion particle flow velocity.
  documentation: 'Radial ion energy convection velocity is the signed transport coefficient
    that multiplies the ion pressure or thermal-energy scale in the convective radial
    ion energy flux. It characterizes advective transport of ion thermal energy across
    magnetic flux surfaces in the edge plasma, separate from diffusive or conductive
    transport driven by gradients.


    The defining transport relation can be written as:


    $$

    q^{\mathrm{conv}}_{i,E,r} = p_i v_r

    $$


    where $q^{\mathrm{conv}}_{i,E,r}$ is the convective radial ion energy flux density
    in W m$^{-2}$, $p_i$ is the ion pressure or energy-density scale in J m$^{-3}$,
    and $v_r$ is this velocity in m s$^{-1}$. When $p_i=n_i T_i$ is used, $n_i$ is
    in m$^{-3}$ and $T_i$ must be in joules; if $T_i$ is represented in eV, it is
    converted using the elementary charge.


    In practice, $v_r$ is inferred from edge transport analysis by separating the
    convective part of the ion energy flux from conductive or diffusive terms and
    from local sources and sinks. It differs from [radial_ion_convection_velocity](name:radial_ion_convection_velocity),
    which refers to particle advection, and from [radial_ion_effective_energy_convection_velocity](name:radial_ion_energy_convection_velocity)
    when additional non-convective mechanisms are intentionally absorbed into a model-equivalent
    velocity.


    Typical edge-plasma values are often of order -10-50 m s$^{-1}$ on closed edge
    flux surfaces, with larger effective values of order 100 m s$^{-1}$ possible near
    strong pedestal gradients or in scrape-off-layer transport analyzes. Values near
    zero indicate little convective contribution compared with diffusion or conduction.


    Sign convention: Positive when directed outward across magnetic flux surfaces,
    from the confined plasma toward the scrape-off layer and wall.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
- name: radial_ion_state_diffusivity
  kind: scalar
  status: draft
  description: Radial particle diffusion coefficient for a specific ion charge state,
    relating the cross-field diffusive particle flux to the radial gradient of that
    charge-state's number density in the edge plasma.
  documentation: 'The radial ion state diffusivity $D_r^{(z)}$ quantifies cross-field
    particle diffusion for ions in a specific ionization stage $z$ in the edge plasma.
    It is the radial projection of the full [ion_state_diffusivity](name:ion_state_diffusivity)
    tensor, representing how efficiently that charge state diffuses across magnetic
    flux surfaces perpendicular to the field.


    The quantity enters the charge-state continuity equation through Fick''s law:


    $$

    \Gamma_r^{(z)} = -D_r^{(z)} \nabla_r n_z

    $$


    where $\Gamma_r^{(z)}$ is the radial diffusive particle flux density of the charge
    state (in m$^{-2}$s$^{-1}$) and $\nabla_r n_z$ is the radial component of the
    number density gradient of that charge state (in m$^{-4}$).


    In practice, $D_r^{(z)}$ is either prescribed from turbulent-transport models
    or fitted to experimental edge density profiles by matching computed and measured
    charge-state distributions. It may vary spatially across the edge grid depending
    on local turbulence and plasma conditions.


    Cross-field particle diffusivities in edge plasmas are anomalously enhanced above
    neoclassical levels by turbulence, with values commonly in the range $10^{-2}$
    to $10^1$ m$^2$s$^{-1}$ in the scrape-off layer and pedestal region. The companion
    coefficients [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity)
    and [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity)
    govern radial energy and momentum transport for the same charge state, while [parallel_ion_charge_state_diffusivity](name:parallel_ion_charge_state_diffusivity)
    captures diffusion along the magnetic field.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_diffusivity
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_state_momentum_diffusivity
  - name:parallel_ion_charge_state_diffusivity
  arguments:
  - name: ion_state_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Radial ion-state momentum diffusivity is the cross-field diffusion
    coefficient for the directed momentum density of a specified ion charge state.
    It parameterizes the Fickian part of radial momentum transport, with nonnegative
    values driving momentum flux down outward radial gradients.
  documentation: 'Radial ion-state momentum diffusivity is a scalar transport coefficient
    relating the outward radial gradient of directed momentum density for a specified
    ion charge state to the diffusive radial flux of that momentum. The radial label
    used here increases outward across magnetic flux surfaces, from the core side
    toward the scrape-off-layer and material boundary, and the coefficient represents
    charge-state-resolved collisional or turbulent redistribution rather than convective
    momentum transport.


    The local Fickian closure for the diffusive radial momentum flux density is


    $$

    \Pi_{r,\mathrm{diff}}^{(z)} = -D_{p,r}^{(z)} \frac{\partial}{\partial r}\left(m_i
    n^{(z)} u^{(z)}\right)

    $$


    where $D_{p,r}^{(z)}$ is the radial momentum diffusivity for ion charge state
    $z$, $r$ is an outward-increasing cross-field radial label, $m_i$ is ion mass,
    $n^{(z)}$ is the charge-state density, and $u^{(z)}$ is the directed flow speed
    of the transported momentum component. The product $m_i n^{(z)} u^{(z)}$ is the
    directed momentum density with units kg m^-2 s^-1, and $\Pi_{r,\mathrm{diff}}^{(z)}$
    is the radial flux density of directed momentum with units kg m^-1 s^-2, taken
    as positive for outward transport. The minus sign means that a nonnegative diffusivity
    carries momentum from larger to smaller momentum density along the outward radial
    direction.


    In practice this quantity is an effective closure parameter in edge momentum-balance
    modeling. It may be inferred or chosen together with particle, energy, and convective
    momentum-transport coefficients so that modeled charge-state densities and flows
    are consistent with available constraints; it should not be confused with a momentum
    pinch velocity or with a source of momentum.


    Typical numerical values are not universal because the coefficient depends strongly
    on the radial region, turbulence level, collisionality, charge state, and the
    chosen momentum-transport closure. Physically, larger values imply faster smoothing
    of charge-state momentum-density gradients, with a characteristic diffusive time
    scale of order $L^2/D_{p,r}^{(z)}$ across a cross-field length $L$, while zero
    represents no diffusive radial momentum transport in this closure.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_momentum_diffusivity
  - name:radial_ion_state_diffusivity
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_charge_state_momentum_diffusivity
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_ion_state_particle_flux
  kind: scalar
  status: draft
  description: Radial component of the particle flux for ions in a specified ionization
    charge state. It is the signed rate at which those ions cross a unit area per
    unit time in the outward radial direction.
  documentation: 'Radial ion state particle flux is the radial component of the particle
    flux for ions of a given species and ionization charge state. It measures cross-field
    particle transport through a surface normal to the radial direction, with the
    radial direction taken locally outward from the confined plasma toward the scrape-off
    layer and plasma-facing surfaces. The analogous poloidal component is [poloidal_ion_charge_state_particle_flux](name:poloidal_ion_charge_state_particle_flux).


    A general kinetic definition is the first velocity moment of the charge-state-resolved
    distribution function projected onto the radial direction:


    $$

    \Gamma_{i,q,r} = \int v_r f_{i,q}(\mathbf{x}, \mathbf{v}, t)\, d^3v

    $$


    where $\Gamma_{i,q,r}$ is the radial particle flux in m^-2.s^-1, $i$ labels the
    ion species, $q$ labels the ionization charge state, $v_r$ is the radial velocity
    component in m.s^-1, $f_{i,q}$ is the distribution function in s^3.m^-6, and $d^3v$
    is the velocity-space volume element in m^3.s^-3.


    In practice this quantity is inferred from particle balance, probe measurements,
    spectroscopy combined with ionization-recombination modeling, or edge transport
    calculations. Fluid closures often decompose the same total flux into convective,
    diffusive, pinch, collisional, and turbulent-correlation contributions, but the
    quantity denotes their net radial particle transport for the selected ion charge
    state.


    Typical values are strongly regime- and species-dependent and can be close to
    zero where inward and outward contributions balance. Representative edge and scrape-off-layer
    charge-state-resolved radial fluxes span about 10^16-10^22 m^-2.s^-1, with trace
    impurity charge states generally toward the lower end and abundant main-ion states
    toward the higher end.


    Sign convention: Positive when directed outward from the confined plasma toward
    the scrape-off layer and plasma-facing surfaces.'
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_particle_flux
  - name:radial_ion_state_diffusivity
  - name:radial_ion_convection_velocity
  arguments:
  - name: ion_state_particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_total_current_density
  kind: scalar
  status: draft
  description: Radial total current density is the component of the total electric
    current density resolved normal to magnetic flux surfaces, summing ohmic, bootstrap,
    and externally driven contributions over all plasma species and charge states.
  documentation: "The radial total current density is the component of the aggregated\
    \ current density vector [total_current_density](name:total_current_density) resolved\
    \ in the direction normal to magnetic flux surfaces. It sums all current-carrying\
    \ mechanisms \u2014 ohmic induction, bootstrap, and externally driven currents\
    \ \u2014 over all resolved species and charge states. This cross-flux-surface\
    \ radial direction is distinct from the cylindrical major-radius $\\hat{R}$ direction\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius\
    \ and $Z$ is vertical height.\n\nThe aggregate radial current density satisfies:\n\
    \n$$\nJ_r = J_{\\mathrm{ohmic},r} + J_{\\mathrm{bootstrap},r} + J_{\\mathrm{drive},r}\n\
    $$\n\nwhere $J_{\\mathrm{ohmic},r}$, $J_{\\mathrm{bootstrap},r}$, and $J_{\\mathrm{drive},r}$\
    \ are the ohmic, bootstrap, and externally driven contributions projected onto\
    \ the flux-surface-normal direction, each in A m$^{-2}$.\n\nIn edge plasma models,\
    \ the radial current density is resolved on generalized geometry grids spanning\
    \ the pedestal, scrape-off layer, and divertor region. It appears in current continuity\
    \ equations and the perpendicular Ohm's law governing cross-field charge transport,\
    \ complementing the field-aligned [parallel_total_current_density](name:parallel_total_current_density)\
    \ and azimuthal [toroidal_total_current_density](name:toroidal_total_current_density)\
    \ projections of the same total current.\n\nSign convention: Positive when conventional\
    \ current flows outward along the flux-surface normal, away from the magnetic\
    \ axis."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_current_density
  - name:parallel_total_current_density
  - name:toroidal_total_current_density
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: ratio_of_vertical_vorticity_to_major_radius
  kind: scalar
  status: draft
  description: The vertical component of the plasma vorticity vector divided by the
    local major radius. It is the major-radius-scaled form of vertical vorticity used
    in toroidal edge-fluid operators and has units of inverse meter-second.
  documentation: 'Ratio of vertical vorticity to major radius is the vertical projection
    of plasma vorticity divided by the local major radius. Vorticity is the curl of
    the plasma flow velocity, and its vertical component measures signed local rotation
    in planes perpendicular to the vertical direction. Dividing by $R$ gives the major-radius-scaled
    form of the unscaled [vertical vorticity](name:vertical_vorticity).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height, the quantity is defined by:


    $$

    \frac{\omega_Z}{R} = \frac{(\nabla \times \mathbf{v}) \cdot \hat{Z}}{R}

    $$


    where $\mathbf{v}$ is the plasma flow velocity, $\boldsymbol{\omega}=\nabla\times\mathbf{v}$
    is the vorticity, $\omega_Z=\boldsymbol{\omega}\cdot\hat{Z}$ is the vertical vorticity
    component, and $R>0$ is the local major radius.


    In practice this quantity is computed from measured, reconstructed, or modeled
    velocity fields by evaluating the vertical component of the curl and dividing
    pointwise by $R$. In toroidal edge-fluid and turbulence formulations it may appear
    when divergence, polarization, or curvature-related operators are written with
    major-radius metric factors; this use does not change its definition as scaled
    vertical vorticity.


    Representative edge-plasma magnitudes depend on flow shear, turbulent length scale,
    and machine size. Vorticity magnitudes of about $10^4-10^7$ s$^{-1}$ at major
    radii of $0.5-3$ m correspond to roughly $10^4-10^7$ m$^{-1}$ s$^{-1}$, with intermittent
    turbulent structures sometimes outside this range.


    Sign convention: Positive when the vertical component of the vorticity vector
    points in the $+\hat{Z}$ direction, since $R$ is positive.'
  unit: m^-1.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_vorticity
  - name:poloidal_vorticity
  - name:toroidal_vorticity
  arguments:
  - name: vertical_vorticity
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: major_radius
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
- name: safety_factor_at_pedestal
  kind: scalar
  status: draft
  description: "Safety factor at the H-mode pedestal; it is the toroidal-to-poloidal\
    \ magnetic-flux increment ratio on the edge transport-barrier flux surface and\
    \ gives the number of toroidal turns in the right-handed cylindrical (R, \u03C6\
    , Z) frame per poloidal turn."
  documentation: 'The safety factor at the pedestal, often denoted $q_\mathrm{ped}$,
    is the value of the [safety factor](name:safety_factor) on the flux surface associated
    with the H-mode pedestal. It characterizes magnetic-field-line winding: the number
    of toroidal turns in the right-handed cylindrical $(R, \phi, Z)$ frame per poloidal
    turn around the inner plasma region on the steep-gradient edge transport-barrier
    flux surface.


    The formal definition is inherited from the flux-increment definition of $q$ and
    evaluated at the pedestal flux surface:


    $$

    q_\mathrm{ped} = \left. \frac{d\Phi_{\rm tor}}{d\Phi_{\rm pol}/(2\pi)} \right|_{\rm
    pedestal}

    $$


    where $\Phi_{\rm tor}$ is the toroidal magnetic flux in Wb enclosed by the flux
    surface, $\Phi_{\rm pol}$ is the poloidal magnetic flux in Wb encircled by the
    flux-surface boundary, and the subscript denotes evaluation on the pedestal flux
    surface. Rational values $q_\mathrm{ped}=m/n$ align the pedestal with perturbations
    of poloidal mode number $m$ and toroidal mode number $n$, influencing edge magnetohydrodynamic
    stability and edge-localized-mode thresholds.


    The pedestal flux surface is identified from the location of the strongest edge
    gradients in electron pressure, temperature, or density, with the pedestal top
    often near the normalized poloidal flux $\psi_N \approx 0.95$. The value is computed
    from magnetic equilibrium reconstruction constrained by magnetic measurements
    and, when available, internal current-profile constraints such as motional Stark
    effect polarimetry or Faraday rotation. Because the pedestal top is often close
    to $\psi_N=0.95$, $q_\mathrm{ped}$ is closely related to [safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95](name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95)
    but is tied to the measured pedestal location rather than to the fixed normalized
    poloidal flux value $\psi_N=0.95$.


    In conventional H-mode tokamak plasmas, $q_\mathrm{ped}$ is commonly 3-6, with
    higher values in lower-current or deliberately high-$q$ operating points and lower
    values in high-current scenarios. It complements [safety_factor_at_internal_transport_barrier](name:safety_factor_at_internal_transport_barrier),
    [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis), and [minimum_safety_factor](name:minimum_safety_factor)
    by locating the safety-factor function at the edge transport barrier.


    Sign convention: Positive when the toroidal magnetic field $B_\phi$ and the plasma
    current $I_p$ are both directed toward increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$
    is vertical height.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:safety_factor
  - name:edge_localized_mode_frequency
  - name:safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  - name:magnetic_shear_at_plasma_boundary
  arguments:
  - name: safety_factor
    operator: pedestal
    operator_kind: locus
- name: thermal_plasma_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure of the bulk thermal plasma, equal to the sum
    of electron and bulk-ion thermal pressure contributions and excluding fast, suprathermal,
    or runaway populations.
  documentation: 'Thermal plasma pressure is the isotropic kinetic pressure associated
    with particle populations close to local thermodynamic equilibrium. It includes
    the thermal electron contribution and the contributions from bulk thermal ion
    species, but excludes nonthermal populations such as fast ions, suprathermal tails,
    and runaway electrons. It is the thermal component of the more general [plasma_pressure](name:plasma_pressure)
    and is closely related to thermal_pressure, [total_electron_pressure](name:total_electron_pressure),
    and [total_ion_pressure](name:total_ion_pressure).


    For Maxwellian or near-Maxwellian thermal species, the pressure is defined by
    the species density-temperature sum:


    $$

    p_\mathrm{th} = n_e k_B T_e + \sum_i n_i k_B T_i

    $$


    where $n_e$ and $n_i$ are electron and bulk-ion number densities in m$^{-3}$,
    $T_e$ and $T_i$ are thermodynamic temperatures in K, $k_B$ is Boltzmann''s constant,
    and the sum is over thermal ion species. When temperatures are tabulated in eV,
    the equivalent SI pressure is obtained by replacing $k_B T_s$ with $e T_s$, where
    $e$ is the elementary charge and $T_s$ is the temperature value in eV; this gives
    $p_\mathrm{th}$ in Pa.


    In practice, thermal plasma pressure is computed from measured or modeled density
    and temperature for electrons and bulk ions, with quasineutrality often used to
    constrain the ion density composition when not all ion species are independently
    measured. It enters fluid and magnetohydrodynamic force balance through the pressure-gradient
    term and sets the thermal part of quantities such as beta, sound speed, and parallel
    pressure balance.


    Representative edge-plasma values span a wide range because both density and temperature
    vary strongly across confined, near-separatrix, and scrape-off-layer regions.
    For densities of about $10^{18}$-$10^{20}$ m$^{-3}$ and electron-plus-ion thermal
    temperatures of about 1-200 eV, thermal plasma pressure is typically of order
    0.1-$10^4$ Pa.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_pressure
  - name:total_electron_pressure
  - name:total_ion_pressure
  arguments:
  - name: plasma_pressure
    operator: thermal
    operator_kind: qualifier
- name: toroidal_current_density_due_to_parallel_viscosity
  kind: scalar
  status: draft
  description: "Toroidal current density driven by parallel viscous stress in a plasma\
    \ fluid, projected along the direction of increasing toroidal angle \u03C6 in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal current density due to parallel viscosity is the toroidal
    component of the current-density contribution associated with field-aligned viscous
    stress. Parallel viscous stress damps velocity shear and anisotropic strain along
    the magnetic field, and its force density can contribute to current closure and
    drift-current balance in a magnetized plasma.


    The toroidal component is the projection of the parallel-viscous current-density
    contribution. For the part determined by perpendicular momentum balance, the same
    contribution is constrained by the Lorentz force associated with the parallel-viscous
    force density:


    $$

    j_{\phi,\parallel\mathrm{visc}} = \hat{\boldsymbol{\phi}} \cdot \mathbf{j}_{\parallel\mathrm{visc}},
    \qquad \mathbf{j}_{\parallel\mathrm{visc},\perp} \times \mathbf{B} = -\mathbf{F}_{\parallel\mathrm{visc},\perp}

    $$


    where $\hat{\boldsymbol{\phi}}$ is the toroidal basis direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $\mathbf{j}_{\parallel\mathrm{visc}}$ is the
    current-density contribution in A m$^{-2}$, $\mathbf{B}$ is the magnetic field
    in T, $\mathbf{F}_{\parallel\mathrm{visc}}$ is the force density exerted on the
    fluid by parallel viscous stress in N m$^{-3}$, and the subscript $\perp$ denotes
    the component perpendicular to $\mathbf{B}$. The force-balance relation constrains
    the perpendicular part; any field-aligned current closure is determined by the
    broader plasma current balance.


    In practice, this quantity is inferred by decomposing the viscous stress into
    field-aligned and other viscous parts, evaluating the force density associated
    with the field-aligned part from plasma flows and thermodynamic gradients, and
    projecting the resulting current-density contribution onto $\hat{\boldsymbol{\phi}}$.
    It should be distinguished from [toroidal_current_density_due_to_perpendicular_viscosity](name:toroidal_current_density_due_to_perpendicular_viscosity)
    and [toroidal_current_density_due_to_heat_viscosity](name:toroidal_current_density_due_to_heat_viscosity);
    together, such mechanism-separated terms contribute to [toroidal_current_density_due_to_viscosity](name:toroidal_current_density_due_to_parallel_viscosity)
    when the same decomposition is used.


    No device-independent typical magnitude is implied for this signed contribution.
    Its size and sign depend on local velocity shear, collisionality, magnetic geometry,
    and current-closure conditions, so it is usually interpreted relative to the total
    toroidal current density or to other viscous current-density contributions for
    the same plasma state.


    Sign convention: Positive when the viscosity-driven current density points in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_heat_viscosity
  arguments:
  - name: current_density_due_to_parallel_viscosity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_flux_radius_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal flux radius at the H-mode pedestal top is the square-root
    radial label derived from enclosed toroidal magnetic flux and expressed in meters.
    It gives the physical radial position of the steep-gradient edge transport barrier.
  documentation: 'Toroidal flux radius at the pedestal top is the value of the physical
    toroidal-flux radial coordinate on the flux surface identified as the top of the
    H-mode pedestal. The pedestal top marks the transition from the core plasma to
    the steep-gradient edge transport barrier, so this quantity locates that transition
    in length units rather than as a normalized radius.


    For a flux surface enclosing toroidal magnetic flux $\Phi_{\mathrm{tor}}$, the
    toroidal flux radius is defined by:


    $$

    \rho_{\mathrm{tor}} = \sqrt{\frac{\Phi_{\mathrm{tor}}}{\pi B_0}}

    $$


    where $\Phi_{\mathrm{tor}}$ is the toroidal magnetic flux enclosed relative to
    the magnetic axis and $B_0$ is the reference toroidal magnetic field evaluated
    at the reference major radius $R_0$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame. The reference point is a finite major radius, often associated with
    the geometric center of the plasma or device, not the singular symmetry axis at
    $R=0$.


    In practice, the pedestal top is identified from edge measurements or fitted radial
    variation of quantities such as electron pressure, density, temperature, or their
    gradients, and then mapped to an equilibrium flux surface. The value of $\rho_{\mathrm{tor}}$
    at that surface is computed from the reconstructed toroidal flux and the chosen
    reference field $B_0$.


    Typical magnitudes are device-dependent. Modern medium and large tokamaks often
    have pedestal-top toroidal flux radii of about 0.5-1.5 m, with compact devices
    below this range and larger devices sometimes approaching 2 m or more. The value
    is usually close to the plasma edge in normalized radius, but it remains a dimensional
    length coordinate.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_radius
  - name:toroidal_flux_radius_of_magnetic_axis
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  arguments:
  - name: toroidal_flux_radius
    operator: pedestal_top
    operator_kind: locus
- name: toroidal_ion_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: "Diffusion coefficient for transport of bulk-ion momentum projected\
    \ along the toroidal direction in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It relates the diffusive flux vector of ion toroidal momentum density\
    \ to the spatial gradient of that density."
  documentation: 'Toroidal ion momentum diffusion coefficient is the scalar diffusivity
    for transport of bulk ion momentum projected on $\hat{\phi}$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle increasing counterclockwise when viewed from above $+\hat{Z}$, and $Z$ is
    vertical height. It parameterizes the down-gradient part of transport of the toroidal
    ion momentum density, distinct from convection, sources, sinks, and residual stresses.


    The Fick''s-law closure for the diffusive flux vector is


    $$

    \boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}} = -D_{\phi,i}\,\nabla\!\left(m_i n_i
    v_{\phi,i}\right)

    $$


    where $D_{\phi,i}$ is the toroidal ion momentum diffusion coefficient in $\mathrm{m^2\,s^{-1}}$,
    $\boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}}$ is the vector flux of toroidal ion
    momentum density in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $m_i$ is ion mass in $\mathrm{kg}$,
    $n_i$ is bulk ion density in $\mathrm{m^{-3}}$, and $v_{\phi,i}$ is the ion flow
    velocity component along $\hat{\phi}$ in $\mathrm{m\,s^{-1}}$, positive in the
    direction of increasing $\phi$. A scalar flux through a surface with unit normal
    $\hat{n}$ is $\hat{n}\cdot\boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}}$ and is positive
    along $\hat{n}$; for the toroidal spatial component, use $\hat{n}=\hat{\phi}$
    so the driving gradient is $\hat{\phi}\cdot\nabla(m_i n_i v_{\phi,i})$. The minus
    sign means that a positive coefficient gives transport down the projected gradient
    of $m_i n_i v_{\phi,i}$.


    In practice this effective coefficient is obtained by solving or fitting the ion
    toroidal-momentum balance using measurements or reconstructions of ion density,
    ion composition, toroidal rotation, and momentum sources and sinks. Spectroscopic
    flow measurements, including charge-exchange recombination spectroscopy where
    available, can constrain $v_{\phi,i}$; the inferred $D_{\phi,i}$ can include collisional
    and turbulence-driven transport that is not represented separately by convective
    pinch or residual-stress terms.


    Typical edge-plasma effective values are 0.1-10 m^2 s^-1 in confined-edge transport
    analyzes, with smaller values around 0.01-1 m^2 s^-1 possible for predominantly
    collisional estimates and larger apparent values, 10-100 m^2 s^-1, sometimes used
    in highly turbulent scrape-off-layer or transient-edge modeling. Negative fitted
    values usually signal that the assumed purely diffusive closure is inadequate
    rather than a physical diffusion coefficient with reversed sign.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_ion_charge_state_momentum_diffusivity
  arguments:
  - name: ion_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_ion_state_momentum
  kind: scalar
  status: draft
  description: "Area-normalized toroidal momentum source term acting on a single ion\
    \ charge state in the edge plasma. It is the \u03C6 projection in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame and represents transfer of toroidal linear\
    \ momentum by ionization, recombination, charge exchange, and related collisions."
  documentation: 'Toroidal ion state momentum is the area-normalized source term for
    the toroidal component of linear momentum of a single ion charge state in the
    edge plasma. The toroidal direction is the $\hat{\phi}$ direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame, not the angular-momentum moment arm $R\hat{\phi}$.


    The area-normalized definition relates the reported source to a local volumetric
    toroidal force density by integrating over the physical region where the source
    acts and dividing by the associated normalizing area:


    $$

    S_{\phi,s}^{A} = \frac{1}{A}\int_V f_{\phi,s}(\mathbf{x})\,dV

    $$


    where $S_{\phi,s}^{A}$ is the area-normalized toroidal momentum source for ion
    charge state $s$, $f_{\phi,s}$ is the local force density projected along $\hat{\phi}$,
    $V$ is the contributing volume, and $A$ is the corresponding surface area used
    for the momentum balance. Integrating $S_{\phi,s}^{A}$ over that area gives a
    net toroidal force; a torque about the symmetry axis would require an additional
    factor of major radius $R$.


    In practice this quantity is computed from the momentum carried by particles created
    or removed by ionization and recombination, plus momentum exchange from charge
    exchange, elastic collisions, and other collisional processes. The relative importance
    of these mechanisms is scenario-dependent and is evaluated from local densities,
    temperatures, mean velocities, and atomic or molecular rate coefficients. The
    charge-state-summed counterpart is [toroidal_ion_momentum](name:toroidal_ion_momentum),
    while toroidal_ion_charge_state_momentum_flux describes transport of the same
    toroidal momentum component rather than its source.


    Typical absolute values in edge and divertor momentum balances span about $10^{-6}-10^{2}$
    kg.m^-1.s^-2, with values near the lower end in weakly rotating or weakly recycling
    regions and larger localized values where ionization, recombination, or charge
    exchange is strong. The analogous neutral-particle source is [toroidal_neutral_state_momentum](name:toroidal_neutral_state_momentum).


    Sign convention: Positive when the momentum source acts in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_ion_momentum
  - name:toroidal_neutral_state_momentum
  arguments:
  - name: ion_state_momentum
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_neutral_momentum
  kind: scalar
  status: draft
  description: Toroidal component of the area-normalized momentum source acting on
    the neutral population in an edge plasma, summed over all neutral states.
  documentation: 'Toroidal neutral momentum is the toroidal component of the area-normalized
    momentum-source vector acting on neutral atoms and molecules in an edge plasma.
    It quantifies the rate at which toroidal momentum is added to or removed from
    the neutral population per unit surface area, after summing over all neutral states;
    the state-resolved analog is [toroidal_neutral_state_momentum](name:toroidal_neutral_state_momentum).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, let $\mathbf{S}^{n}$ be
    the neutral momentum-source vector per unit area, with units $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    and let $\hat{\phi}$ be the unit vector in the direction of increasing toroidal
    angle. The toroidal component is


    $$

    S_\phi^{n} = \mathbf{S}^{n} \cdot \hat{\phi}

    $$


    where $S_\phi^{n}$ is this quantity. Related component projections include [radial_neutral_momentum](name:radial_neutral_state_momentum_flux)
    and [parallel_neutral_momentum](name:parallel_neutral_momentum).


    This quantity is usually inferred from neutral-transport or edge-plasma modeling
    constrained by measurements such as spectroscopy, neutral pressure, recycling
    flux, and plasma rotation or flow data. Relevant mechanisms include charge exchange,
    ionization, recombination, elastic collisions, molecular dissociation pathways,
    and wall recycling; each channel contributes according to its rate and the momenta
    of reactants and products, so no single process has a fixed sign.


    For a local interaction that only transfers momentum between neutrals and charged
    particles, Newton''s third law gives an equal and opposite contribution in the
    charged-particle toroidal momentum balance. After summing all interacting species,
    net toroidal momentum changes arise from external forces, electromagnetic torques
    on charged particles, boundary losses, or recycling sources, so the neutral component
    is one term in the total toroidal_momentum balance rather than its universal negative.


    Typical modeled magnitudes in tokamak edge plasmas span roughly $10^{-6}-10^{-1}\
    \mathrm{kg\,m^{-1}\,s^{-2}}$ in weakly rotating or weakly recycled regions, and
    can approach $1\ \mathrm{kg\,m^{-1}\,s^{-2}}$ locally in dense divertor or strong
    recycling conditions. Values near zero are common where counteracting processes
    or nearly equal toroidal neutral and plasma flows cancel.


    Sign convention: Positive when the neutral momentum-source vector points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_neutral_state_momentum
  - name:radial_neutral_state_momentum_flux
  - name:parallel_neutral_momentum
  arguments:
  - name: neutral_momentum
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_neutral_state_momentum
  kind: scalar
  status: draft
  description: "Area-normalized toroidal momentum source acting on a specified neutral\
    \ state in the edge plasma, projected along the \u03C6 direction in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal neutral state momentum is the toroidal component of the
    area-normalized linear momentum source acting on a specified neutral state in
    the edge plasma. It represents the rate per unit area at which interactions add
    or remove neutral momentum along the toroidal direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Unlike [toroidal_neutral_momentum](name:toroidal_neutral_momentum),
    it is resolved by neutral state rather than summed over all neutral states.


    For a surface element, the area-normalized toroidal projection can be written
    as:


    $$

    S_{\phi,q}^{\mathrm{n}} = \hat{\phi} \cdot \mathbf{S}_{q}^{\mathrm{n}} = \hat{\phi}
    \cdot \frac{1}{A}\frac{d\mathbf{P}_{q}^{\mathrm{n}}}{dt}

    $$


    where $S_{\phi,q}^{\mathrm{n}}$ is the toroidal neutral-state momentum source
    in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $\hat{\phi}$ is the dimensionless unit vector
    in the direction of increasing toroidal angle $\phi$, $\mathbf{S}_{q}^{\mathrm{n}}$
    is the area-normalized vector momentum source for neutral state $q$ in $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    $A$ is the surface area in $\mathrm{m^2}$, $t$ is time in $\mathrm{s}$, and $\mathbf{P}_{q}^{\mathrm{n}}$
    is the linear momentum in $\mathrm{kg\,m\,s^{-1}}$ transferred to that neutral
    state.


    This quantity is usually obtained from neutral and edge-plasma source calculations
    rather than from a direct measurement of toroidal neutral force. The contributing
    terms depend on the physics model and species represented; common momentum-transfer
    mechanisms include charge exchange, ionization, recombination, scattering, and
    recycling at material surfaces. Spectroscopy, neutral-pressure measurements, recycling
    observations, and plasma-background diagnostics can constrain the inputs used
    to compute the state-resolved source.


    Typical magnitudes are highly localized and model dependent. Values may be close
    to $0\,\mathrm{kg\,m^{-1}\,s^{-2}}$ where toroidal momentum transfer is weak or
    balanced between processes, while order-of-magnitude edge estimates in active
    recycling or charge-exchange regions can span roughly $10^{-4}-10^{2}\,\mathrm{kg\,m^{-1}\,s^{-2}}$
    depending on neutral flux, toroidal velocity difference, interaction rates, and
    the chosen area normalization.


    Sign convention: Positive when the net momentum source acts in the $+\hat{\phi}$
    direction, the direction of increasing toroidal angle $\phi$, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_momentum
  - name:toroidal_neutral_momentum
  - name:toroidal_ion_state_momentum
  arguments:
  - name: neutral_state_momentum
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_neutral_state_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: "Toroidal component, in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame, of the momentum diffusion coefficient for neutral particles in a specified\
    \ state. It parameterizes diffusive transport of neutral momentum along the toroidal\
    \ direction."
  documentation: 'The toroidal neutral-state momentum diffusion coefficient is the
    effective diffusion coefficient associated with transport of neutral-particle
    momentum along the toroidal direction in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is the momentum-transport counterpart of [toroidal neutral-state diffusivity](name:toroidal_neutral_momentum_diffusivity),
    with the transported quantity being neutral momentum rather than particle density
    or another scalar moment.


    For a local Fick-law closure, the projected toroidal diffusive momentum flux is
    commonly written as:


    $$

    \Gamma^{\mathrm{diff}}_{p,\phi} = -D_{p,\phi}\,\nabla_\phi p_n = -D_{p,\phi}\,\frac{1}{R}\frac{\partial
    p_n}{\partial \phi}

    $$


    where $D_{p,\phi}$ is the toroidal momentum diffusion coefficient in $m^2.s^{-1}$,
    $p_n$ is the neutral-state momentum density of the transported momentum component
    in $kg.m^{-2}.s^{-1}$, $R$ is in $m$, $\phi$ is in radians, and $\Gamma^{\mathrm{diff}}_{p,\phi}$
    is the toroidal diffusive momentum flux density in $kg.m^{-1}.s^{-2}$. A positive
    $\Gamma^{\mathrm{diff}}_{p,\phi}$ denotes transport in the direction of increasing
    $\phi$; for positive $D_{p,\phi}$ the diffusive flux opposes the toroidal gradient
    of $p_n$.


    This coefficient is usually not measured directly. It is inferred or prescribed
    in neutral momentum-balance models from kinetic neutral transport, momentum-exchange
    collision rates, closure fits, or reduced transport assumptions; when neutral
    mean free paths are comparable to plasma-gradient scale lengths, it should be
    interpreted as an effective local parameter rather than a fundamental material
    property.


    Typical effective values in edge and scrape-off-layer neutral transport modeling
    span about $0.01-100\ m^2.s^{-1}$, with smaller values in dense, highly collisional
    recycling regions and values of $10^2-10^3\ m^2.s^{-1}$ possible in coarse-grained
    or weakly collisional closures.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: neutral_state_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: vertical_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Vertical (Z-direction) component of the electric current density driven
    by frictional momentum exchange between plasma ions and background neutral particles
    in the edge or divertor plasma.
  documentation: 'The vertical component of [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction)
    is the projection of the ion-neutral friction current density vector onto the
    $\hat{Z}$ axis of the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$
    is the coordinate perpendicular to the tokamak midplane. In partially ionized
    edge and divertor plasmas, collisions between the ion fluid and background neutrals
    produce a frictional force that drives charge flow in all spatial directions,
    including the vertical.


    The component is defined as


    $$

    j_Z^{\rm in} = \mathbf{j}_{\rm in} \cdot \hat{Z}

    $$


    where $\mathbf{j}_{\rm in}$ is the full ion-neutral friction current density vector,
    arising from momentum exchange between the ion fluid and neutrals at a rate governed
    by the ion-neutral collision frequency $\nu_{in}$, and $\hat{Z}$ is the vertical
    unit vector.


    This component is obtained from edge and divertor plasma transport simulations
    that resolve neutral fluid dynamics in the scrape-off layer and divertor volume.
    The vertical direction gains significance where recycled neutrals stream vertically
    from plasma-facing surfaces, making the vertical ion-neutral coupling non-negligible.
    Together with the [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction),
    [poloidal_current_density_due_to_ion_neutral_friction](name:poloidal_current_density_due_to_ion_neutral_friction),
    and [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction)
    siblings, it fully specifies the ion-neutral friction current density vector in
    the right-handed cylindrical $(R, \phi, Z)$ frame.


    Sign convention: Positive when the ion-neutral friction current density flows
    in the $+Z$ direction, toward increasing vertical height in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:poloidal_current_density_due_to_ion_neutral_friction
  - name:toroidal_current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: vertical_ion_momentum_convection_velocity
  kind: scalar
  status: draft
  description: "Vertical component of the effective convection velocity that advects\
    \ ion momentum in the right-handed cylindrical (R, \u03C6, Z) frame. It is defined\
    \ per ion species without resolving charge states."
  documentation: 'The vertical ion momentum convection velocity is the $Z$ component
    of an effective transport velocity for advective ion-momentum transport in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. It applies to an ion species as
    a whole, without separating individual charge states.


    The convective contribution to the vertical flux of an ion momentum density is
    written as


    $$

    \Pi^{\mathrm{conv}}_{i,Z} = M_i V^{\mathrm{conv}}_{i,Z}

    $$


    where $V^{\mathrm{conv}}_{i,Z}$ is the vertical ion momentum convection velocity
    in $\mathrm{m\,s^{-1}}$, $M_i$ is the transported ion momentum density in $\mathrm{kg\,m^{-2}\,s^{-1}}$,
    and $\Pi^{\mathrm{conv}}_{i,Z}$ is the corresponding vertical convective momentum
    flux in $\mathrm{kg\,m^{-1}\,s^{-2}}$.


    In practice this effective velocity is obtained from momentum-transport analysis
    by isolating the advective part of the ion momentum flux and dividing by the associated
    ion momentum density. It is a transport coefficient for momentum convection and
    need not be identical to the ion fluid velocity component.


    Typical values are strongly case-dependent and may be positive, negative, or close
    to zero; they are interpreted in $\mathrm{m\,s^{-1}}$ relative to the local vertical
    momentum flux balance rather than by a universal device-independent range.


    Sign convention: Positive when the effective convection carries ion momentum toward
    increasing vertical height $Z$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_ion_state_momentum_convection_velocity
  - name:ion_momentum_convection_velocity
  arguments:
  - name: ion_momentum_convection_velocity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: vertical_total_current_density
  kind: scalar
  status: draft
  description: "Vertical total current density is the Z component of the total electric\
    \ current density vector in the right-handed cylindrical (R, \u03C6, Z) frame.\
    \ It is the net conventional charge flux per unit area in the vertical direction\
    \ after summing all resolved species and transport contributions."
  documentation: 'The vertical total current density is the component along the vertical
    basis direction of the total electric current density vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It represents the net conventional positive
    charge flux per unit area carried vertically after all contributing species and
    current-driving mechanisms are summed, so cancelations can make the total smaller
    than individual partial contributions.


    The component is defined by projecting the total current density vector onto the
    vertical unit vector:


    $$

    j_{Z,\mathrm{tot}} = \mathbf{j}_{\mathrm{tot}} \cdot \hat{Z}

    $$


    where $\mathbf{j}_{\mathrm{tot}}$ and $j_{Z,\mathrm{tot}}$ are in A m^-2, and
    $\hat{Z}$ is the dimensionless unit vector in the vertical direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame. For particle flows, a species contribution has
    the form $q_s n_s \mathbf{u}_s$, where $q_s$ is charge, $n_s$ is number density,
    and $\mathbf{u}_s$ is flow velocity, yielding A m^-2.


    In practice this quantity is usually inferred from modeling rather than measured
    directly. Edge-plasma and MHD descriptions compute it by summing resolved vertical
    contributions from particle motion, pressure-gradient, collisional-friction, inertial,
    neutral-friction, anomalous, and other transport terms; examples of related partial
    terms include [vertical_current_density_due_to_ion_neutral_friction](name:vertical_current_density_due_to_ion_neutral_friction)
    and vertical_anomalous_current_density. Magnetic-field constraints may use the
    full Maxwell-Ampere relation including displacement current; the simpler magnetoquasistatic
    curl-to-current estimate is an approximation valid when displacement current is
    negligible.


    Typical edge and scrape-off-layer values of $|j_{Z,\mathrm{tot}}|$ are often 1-10^4
    A m^-2, with localized sheath-connected structures, steep-gradient regions, or
    strong transient events reaching 10^4-10^5 A m^-2. Values near zero are also common
    where upward and downward partial currents nearly cancel.


    Sign convention: Positive when the total conventional current density points in
    the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_current_density_due_to_ion_neutral_friction
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
- name: volume_averaged_neutral_temperature
  kind: scalar
  status: draft
  description: Volume-averaged translational kinetic temperature of a specified neutral
    species or neutral state over the plasma volume enclosed by the last closed flux
    surface. When multiple neutral states are treated together, the local neutral
    temperature is the particle-density-weighted translational temperature of the
    included neutral population.
  documentation: 'Volume-averaged neutral temperature is the geometric volume average
    of the local neutral translational kinetic temperature over the plasma volume
    enclosed by the last closed flux surface. The local quantity being averaged is
    the [neutral temperature](name:neutral_state_temperature) for the specified neutral
    species or state; if several neutral states are grouped, it represents the particle-density-weighted
    local temperature of the included neutral population. As a thermodynamic temperature
    it is non-negative, with zero corresponding only to the idealized limit of no
    translational kinetic energy.


    The volume average is defined by


    $$

    \langle T_n \rangle_V = \frac{1}{V_\mathrm{LCFS}} \int_{V_\mathrm{LCFS}} T_n(\mathbf{x})\,
    dV

    $$


    where $T_n(\mathbf{x})$ is the local neutral temperature in eV, $dV$ is a differential
    volume element in m^3, and $V_\mathrm{LCFS}$ is the volume enclosed by the last
    closed flux surface in m^3. The resulting average $\langle T_n \rangle_V$ is expressed
    in eV.


    In practice, local neutral temperatures may be inferred from Doppler broadening
    of neutral spectral lines, from kinetic neutral transport calculations, or from
    coupled plasma-neutral models constrained by measurements. The volume average
    is then obtained by integrating that local temperature over the closed-flux-surface
    plasma volume.


    Representative neutral translational temperatures in magnetic-confinement plasmas
    range from about 0.03-1 eV for cold or warm gas populations to several eV when
    faster neutral components contribute. The LCFS-volume average depends strongly
    on neutral penetration, species composition, and the definition of the neutral
    states included in the averaged population.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_temperature
  arguments:
  - name: neutral_temperature
    operator: volume_averaged
    operator_kind: qualifier
