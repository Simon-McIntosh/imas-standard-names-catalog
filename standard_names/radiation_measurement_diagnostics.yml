- name: width_of_filter
  kind: scalar
  status: active
  description: "Wavelength span between the two selected boundaries of an optical\
    \ filter\u2019s transmitted passband, independent of the boundary criterion used."
  documentation: "Spectral passband width is the full wavelength extent between the\
    \ lower and upper boundaries selected to define an optical filter\u2019s transmitted\
    \ band. It describes an edge-to-edge span rather than the passband center or peak\
    \ wavelength.\n\nThe width is defined by\n\n$$\n\\Delta\\lambda = \\lambda_{\\\
    rm high} - \\lambda_{\\rm low}\n$$\n\nwhere $\\Delta\\lambda$ is the passband\
    \ width, $\\lambda_{\\rm high}$ is the higher-wavelength boundary, and $\\lambda_{\\\
    rm low}$ is the lower-wavelength boundary.\n\nThe boundary criterion is part of\
    \ the quantity\u2019s definition and must be stated when the boundaries are not\
    \ intrinsic. For example, [spectral_width_of_filter](name:spectral_width_of_filter)\
    \ uses the wavelengths at which transmission falls to 90% of its peak. This edge-to-edge\
    \ width is distinct from the [reference_wavelength_of_filter](name:reference_wavelength_of_filter),\
    \ which characterizes the passband center or peak."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_width_of_filter
  - name:reference_wavelength_of_filter
  sources:
  - dd_path: camera_x_rays/filter_window/x1_width
