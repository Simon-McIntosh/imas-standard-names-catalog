name: parallel_component_of_fast_electron_pressure
status: draft
description: Pressure tensor component of the supra-thermal (non-Maxwellian) electron
  population projected along the magnetic-field direction $\hat{b}$.
documentation: 'The fast electron parallel pressure $p_{e,\parallel}^{\mathrm{fast}}$
  quantifies the second velocity-moment of the non-thermal electron distribution function
  in the direction parallel to the local magnetic field: $p_{e,\parallel}^{\mathrm{fast}}
  = m_e \int (v_\parallel - u_\parallel)^2 f_e^{\mathrm{fast}}\, d^3v$, where $m_e$
  is the electron mass, $v_\parallel$ is the velocity component along $\hat{b} = \mathbf{B}/B$,
  $u_\parallel$ is the mean parallel drift, and $f_e^{\mathrm{fast}}$ is the fast-electron
  distribution function. Supra-thermal electrons are generated by electron cyclotron
  resonance heating (ECRH), lower-hybrid current drive (LHCD), or runaway acceleration
  during disruptions. The anisotropy $p_{e,\parallel}^{\mathrm{fast}} / p_{e,\perp}^{\mathrm{fast}}$
  modifies the MHD equilibrium through anisotropic pressure contributions and can
  destabilize fishbone or energetic-particle modes. Typical values range from negligible
  up to several kPa in strongly ECRH-heated plasmas. This quantity is relevant for
  sawtooth crash modeling, where the fast electron pressure redistribution determines
  the post-crash profile.'
