- name: line_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Line-averaged number density of nitrogen nuclei along a plasma diagnostic
    chord, summed over all ionization states. It equals the path integral of the local
    nitrogen density divided by the chord length.
  documentation: 'Line-averaged nitrogen density is the chord-average of the local
    nitrogen number density sampled along a diagnostic line of sight. The nitrogen
    density includes nitrogen nuclei in all ionization states, so different charge
    states contribute according to their local abundance along the chord.


    For a chord path $\Gamma$, the line-averaged nitrogen density is defined by:


    $$

    \langle n_N \rangle_L = \frac{1}{L}\int_{\Gamma} n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local nitrogen number density in m^-3, summed over all
    ionization states, $\ell$ is arclength along the chord in meters, and $L=\int_{\Gamma}d\ell$
    is the chord length in meters over the sampled plasma region.


    In practice this quantity is inferred from diagnostics and analysis methods that
    constrain nitrogen content along a line of sight, often using spectroscopic signals,
    atomic physics modeling, plasma background parameters, and the known viewing geometry.
    Because many measurements are sensitive to emissivity or to particular charge-state
    populations rather than directly to total nitrogen density, the conversion to
    all-ionization-state nitrogen density is model dependent and is not simply a geometric
    division of a raw signal by chord length.


    Typical line-averaged nitrogen densities in tokamak plasmas range from about 1e15-1e18
    m^-3 for trace-seeded conditions and can reach 1e19 m^-3 in strongly seeded or
    detached-edge regimes, depending on fueling, impurity seeding rate, transport,
    and ionization balance.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
