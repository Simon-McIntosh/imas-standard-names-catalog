        wall which is the closest to plasma boundary
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Distance from the nearest first-wall point to the reconstructed
        plasma boundary. Quantifies the plasma-wall gap at the closest wall location,
        a key geometric parameter for limiter and confinement margin assessment.
      kind: llm
- name: height_of_plasma_filament
  kind: scalar
  status: active
  description: "Full vertical extent of the rectangular cross-section of a discrete\
    \ plasma current-carrying filament element, measured along the machine\u2019s\
    \ vertical axis."
  documentation: 'This quantity is the full vertical dimension of the rectangular
    cross-section associated with one discrete plasma current-carrying filament. It
    is a geometric extent, not the filament current or its current density.


    The height $H$ is defined by the difference between the upper and lower vertical
    coordinates:


    $$

    H = Z_{\mathrm{upper}} - Z_{\mathrm{lower}}

    $$


    where $Z_{\mathrm{upper}}$ and $Z_{\mathrm{lower}}$ are the upper and lower coordinates
    in the right-handed cylindrical $(R,\phi,Z)$ frame, with $Z$ denoting vertical
    height and $\hat{Z}$ the vertical basis direction.


    This quantity applies only to the vertical dimension of the rectangular filament
    cross-section. The horizontal full width is defined separately by [plasma filament
    width](name:plasma_filament_width), while the in-plane thickness is defined by
    [thickness of plasma filament](name:thickness_of_plasma_filament).'
  unit: m
