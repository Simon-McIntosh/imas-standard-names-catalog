- name: ratio_of_upper_bound_plasma_current_to_initial_plasma_current_due_to_disruption
  kind: scalar
  status: active
  description: Ratio of upper-bound plasma current to initial plasma current during
    a disruption is the higher-current fractional threshold used with a lower threshold
    to define a custom linear current-quench decay interval.
  documentation: 'Ratio of upper-bound plasma current to initial plasma current during
    a disruption is the higher-current threshold $X_2$ formed from the signed [plasma
    current](name:plasma_current) relative to its signed pre-disruption reference
    value. It identifies the earlier, higher-current crossing that bounds a custom
    linear plasma-current quench interval.


    Let $t_2$ be the earlier crossing time selected for the upper endpoint of that
    interval. The threshold is defined by:


    $$

    X_2 = \frac{I_p(t_2)}{I_{p,0}}

    $$


    where $I_p(t_2)$ is the signed [plasma current](name:plasma_current) at the upper-endpoint
    crossing and $I_{p,0}$ is the signed pre-disruption reference [plasma current](name:plasma_current).


    Together with the corresponding lower-bound threshold $X_1$, [ratio of lower-bound
    plasma current to initial plasma current during a disruption], the valid ordering
    for a decreasing-current interval is $0 < X_1 < X_2 \le 1$. The reference current
    must be nonzero, and the threshold applies to intervals in which the current at
    the crossings has the same sign as the pre-disruption reference current. The associated
    [linear plasma-current decay time during a disruption] uses $\tau_\mathrm{lin}
    = (t_2 - t_1)/(X_1 - X_2)$, where $t_1$ is the lower-threshold crossing time;
    for monotonic decay across the interval, $t_2 < t_1$ and the decay time is positive.
    This plasma-current threshold is distinct from analogous disruption-quench definitions
    for other current populations, such as the [linear runaway-electron decay time
    during a disruption](name:linear_runaway_electron_decay_time_due_to_disruption).'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_current
  sources:
  - dd_path: summary/disruption/decay_times/ip/linear_custom/x2
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-disruption-decay_times-ip-linear_custom-x2
    dd_documentation:
