- name: radial_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: Radial component of the current density driven by perpendicular viscosity
    in the edge plasma, arising from radial gradients in the parallel ion flow.
  documentation: 'This quantity represents the radial current density $j_{r,\text{visc},\perp}$
    that arises from perpendicular viscosity in the edge plasma. In the IMAS cylindrical
    $(R, \phi, Z)$ frame, the radial component is along the $\hat{R}$ direction (the
    direction of increasing major radius). Perpendicular viscosity, associated with
    collisional transport across the magnetic field, generates a radial current when
    there are radial gradients in the parallel ion flow velocity $v_{\|}$ or in the
    plasma rotation. The current density appears in the radial force balance and can
    play a role in edge plasma rotation braking and momentum transport. Typical magnitudes
    in the edge region of tokamaks range from $10^{-3}$ to $10^{2}\,\text{A}\,\text{m}^{-2}$,
    depending on the steepness of edge gradients and the collisionality regime. It
    is measured indirectly via analysis of edge flow profiles or modeled using neoclassical
    or gyro-viscous theory. The radial component is part of the perpendicular viscosity
    current density tensor; see also the toroidal counterpart.


    Sign convention: Positive when the current flows in the direction of increasing
    major radius $R$ in the IMAS cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
