- name: upper_wavelength_of_filter
  kind: scalar
  status: draft
  description: Upper wavelength limit of the passband transmitted by a diagnostic
    filter window. It is the long-wavelength, low-photon-energy cutoff of the filter-window
    transmission band.
  documentation: 'The upper wavelength of a filter is the long-wavelength boundary
    of the passband transmitted by a filter window. It is the largest wavelength included
    by the filter-window transmission criterion and therefore corresponds to the lowest
    photon energy admitted by that filter passband. Together with [lower_wavelength_of_filter](name:lower_wavelength_of_filter),
    it defines the wavelength interval of the transmitted band, normally with $\lambda_{\mathrm{lower}}
    \le \lambda_{\max}$.


    The corresponding minimum photon energy is related to the cutoff wavelength by


    $$

    E_{\min} = \frac{hc}{\lambda_{\max}}

    $$


    where $\lambda_{\max}$ is the upper wavelength cutoff in meters, $E_{\min}$ is
    the corresponding photon energy in joules, $h$ is Planck''s constant in joule
    seconds, and $c$ is the speed of light in meters per second.


    For a real filter window the spectral transmission edge is gradual rather than
    perfectly sharp, so the upper wavelength should be interpreted using the stated
    passband criterion, such as a specified transmission threshold or calibrated edge
    definition. It is obtained from the filter-window transmission curve, computed
    from material optical properties and thickness or measured by spectral transmission
    calibration.


    Representative X-ray and soft-X-ray filter-window upper cutoffs are commonly in
    the range $10^{-11}$-$10^{-8}$ m, depending on filter material, thickness, and
    the selected transmission criterion. The wavelength-dependent attenuation within
    and outside the passband is described by [spectral_absorptivity_of_filter](name:spectral_absorptivity_of_filter).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
