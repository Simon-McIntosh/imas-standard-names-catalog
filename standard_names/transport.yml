- name: vertical_component_of_ion_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk ion fluid velocity onto the vertical $Z$-axis
    of the right-handed cylindrical $(R, \phi, Z)$ frame, representing the net upward
    or downward motion of the ion population at each point in the plasma.
  documentation: 'The vertical velocity component $v_{Z,i} = \mathbf{v}_i \cdot \hat{Z}$
    measures the ion fluid motion along the $Z$-axis (height direction) of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height. It is one component of the full [ion_velocity](name:ion_velocity) vector
    and is required in multi-fluid transport models to capture poloidal and cross-field
    ion dynamics on unstructured plasma-boundary grids. In the edge and scrape-off
    layer, $v_{Z,i}$ enters the ion continuity equation $\partial n_i/\partial t +
    \nabla \cdot (n_i \mathbf{v}_i) = S_i$, where $n_i$ (m$^{-3}$) is ion density
    and $S_i$ is the particle source, and contributes to the divergence of the ion
    particle flux. Typical magnitudes range from tens to hundreds of m s$^{-1}$ in
    the edge plasma and can reach $\sim 10^4$ m s$^{-1}$ near the divertor targets.
    It is computed in fluid transport codes and can be compared against the analogous
    [vertical_component_of_electron_velocity](name:vertical_component_of_electron_velocity)
    and [vertical_component_of_neutral_velocity](name:vertical_component_of_neutral_velocity)
    to characterize inter-species flow differences. The [vertical_component_of_center_of_mass_velocity](name:vertical_component_of_center_of_mass_velocity)
    provides the mass-weighted average over all species for comparison with the ion-specific
    component.


    Sign convention: Positive when the ion fluid velocity is directed in the $+Z$
    direction (upward, away from the machine midplane).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:ion_velocity
  - name:vertical_component_of_electron_velocity
  - name:vertical_component_of_neutral_velocity
  - name:vertical_component_of_center_of_mass_velocity
