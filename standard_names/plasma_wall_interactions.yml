- name: maximum_of_energy_flux_at_limiter
  kind: scalar
  status: active
  description: Peak plasma energy deposition per unit area on the plasma-facing surface
    of a limiter.
  documentation: 'The quantity is the largest local plasma energy flux deposited on
    the plasma-facing material surface of a limiter. It represents the peak heat load
    over the limiter surface rather than an area-integrated power.


    $$

    q_{E,\mathrm{max}}^{L} = \max_{\mathbf{x} \in S_L} q_E(\mathbf{x})

