- name: vertical_coordinate_of_primary_x_point
  kind: scalar
  status: active
  description: "Vertical coordinate of the primary X-point is the signed Z position\
    \ of the boundary-defining poloidal magnetic null where separatrix branches meet,\
    \ expressed in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Vertical coordinate of the primary X-point is the $Z$ coordinate
    of the boundary-defining poloidal magnetic null at which separatrix branches meet
    in an axisymmetric equilibrium. The coordinate is expressed in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The primary X-point position is the saddle point of the poloidal magnetic flux
    in the poloidal plane of the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    \nabla_{R,Z}\psi(R_{X,\mathrm{p}}, Z_{X,\mathrm{p}}) = \left(\frac{\partial \psi}{\partial
    R}, \frac{\partial \psi}{\partial Z}\right)_{(R_{X,\mathrm{p}}, Z_{X,\mathrm{p}})}
    = (0,0)

    $$


    where $\psi(R,Z)$ is the axisymmetric poloidal magnetic flux, and $R_{X,\mathrm{p}}$
    and $Z_{X,\mathrm{p}}$ are the major-radius and vertical coordinates of the primary
    X-point. The saddle topology distinguishes an X-point from the magnetic axis.


    This quantity is the primary-X-point specialization of [vertical coordinate of
    an X-point](name:vertical_coordinate_of_x_point). When more than one X-point exists,
    primary denotes the null whose separatrix branches define the principal plasma-boundary
    separatrix; vertical coordinates of secondary X-points or nulls not assigned to
    that primary separatrix are excluded.


    Sign convention: Positive when the primary X-point lies in the $+\hat{Z}$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame relative to the chosen vertical
    origin.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: summary/boundary/x_point_main/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-boundary-x_point_main-z
    dd_documentation:
      leaf: Height
      parent_path: summary/boundary/x_point_main
      parent: RZ position of the main X-point
      data_type: FLT_1D
      unit: m
      coordinates:
      - summary/time
    enhanced_context:
      description: Vertical (Z) coordinate of x point main.
      kind: template
- name: vertical_coordinate_of_strike_point
  kind: scalar
  status: active
  description: "Signed vertical (Z) coordinate of the strike point, where the plasma\
    \ separatrix intersects a divertor target plate or limiter surface in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The strike-point vertical coordinate is the signed height of the
    intersection between the plasma separatrix and a divertor target plate or limiter
    surface. It identifies the strike-point location along the vertical direction,
    while excluding its radial coordinate.


    The coordinate is defined by


    $$

    Z_{\mathrm{sp}} = \mathbf{r}_{\mathrm{sp}} \cdot \hat{\mathbf{Z}}

    $$


    where $\mathbf{r}_{\mathrm{sp}}$ is the strike-point position vector and $\hat{\mathbf{Z}}$
    is the vertical unit vector of the right-handed cylindrical $(R, \phi, Z)$ frame.
    The upstream null is represented separately by the [vertical coordinate of the
    X point](name:vertical_coordinate_of_x_point), while limiter-contact geometry
    is represented by the [vertical coordinate of the active limiter point](name:vertical_coordinate_of_active_limiter_point).


    Sign convention: Positive when the strike point lies in the direction of increasing
    $Z$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_x_point
  - name:vertical_coordinate_of_active_limiter_point
  sources:
