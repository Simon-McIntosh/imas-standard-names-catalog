- name: ammonia_deuterated_prefill_count
  kind: scalar
  status: active
  description: Deuterated ammonia prefill count is the total amount of neutral ND3
    introduced before plasma breakdown, expressed as an equivalent-electron count
    with 10 count units per molecule.
  documentation: 'Deuterated ammonia prefill count is the total amount of neutral
    deuterated ammonia (ND3) introduced during the prefill phase before plasma breakdown,
    expressed as an equivalent-electron count. Each neutral ND3 molecule contributes
    ten equivalent electrons: seven from nitrogen and one from each of its three deuterium
    atoms.


    The equivalent-electron count is defined by


    $$

    N_{e,\mathrm{eq}}^{\mathrm{ND_3,prefill}} = (Z_{\mathrm{N}} + 3Z_{\mathrm{D}})N_{\mathrm{ND_3,prefill}}
    = 10\int_{t_0}^{t_{\mathrm{bd}}}\dot{N}_{\mathrm{ND_3}}(t)\,dt

    $$


    where $Z_{\mathrm{N}}=7$ and $Z_{\mathrm{D}}=1$ are atomic numbers, $N_{\mathrm{ND_3,prefill}}$
    is the accumulated molecule count, $\dot{N}_{\mathrm{ND_3}}$ is the molecule injection
    rate, and $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and breakdown times.


    This quantity includes only ND3 introduced before breakdown and excludes wall
    recycling, neutral-beam or pellet fueling, later gas injection, and retained or
    ionized inventory. It is the deuterated-ammonia component of [prefill_count](name:prefill_count),
    distinct from [ammonia_prefill_count](name:ammonia_prefill_count) and post-breakdown
    [accumulated_ammonia_deuterated_count](name:accumulated_ammonia_deuterated_count).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:prefill_count
  - name:ammonia_prefill_count
  - name:accumulated_ammonia_deuterated_count
  arguments:
  - name: prefill_count
    operator: ammonia_deuterated
    operator_kind: qualifier
