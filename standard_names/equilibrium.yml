- name: lower_outer_squareness
  kind: scalar
  status: draft
  description: Dimensionless lower-outboard plasma-boundary shape parameter measuring
    how the lower outer quadrant departs from an ellipse toward a squarer or rounder
    contour.
  documentation: 'Lower outer squareness describes the fourth-order shape of the plasma
    boundary in the lower outboard quadrant. It complements triangularity and elongation
    by resolving whether the lower outer corner of the last closed flux surface is
    more rectangular or more rounded than an ellipse with the same main size and triangularity.
    The other quadrants are described by [upper outer squareness](name:upper_outer_squareness),
    [lower inner squareness](name:lower_inner_squareness), and [upper inner squareness](name:upper_inner_squareness).


    A practical geometric definition compares the actual boundary position with a
    reference ellipse in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius and $Z$ is vertical height:


    $$

    \zeta_{lo} = \frac{R_{lo} - R_{\mathrm{ell},lo}}{a}

    $$


    where $\zeta_{lo}$ is lower outer squareness, $R_{lo}$ is the boundary major radius
    at the lower outer shaping point, $R_{\mathrm{ell},lo}$ is the corresponding reference-ellipse
    major radius, and $a$ is the plasma minor radius; the three length variables are
    expressed consistently.


    It is obtained from equilibrium reconstruction or boundary fitting using magnetic
    measurements, flux-surface constraints, and plasma shape control targets. Representative
    values in tokamak equilibria are about -0.2 to 0.2 for modest shaping and can
    approach -0.4 to 0.4 in strongly shaped scenarios. It is often interpreted together
    with [outer triangularity](name:outer_triangularity), which controls the outboard
    midplane indentation rather than the quadrant squareness.


    Sign convention: Positive when the lower outer boundary point lies at larger major
    radius than the corresponding reference ellipse.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_outer_squareness
  - name:lower_inner_squareness
  - name:upper_inner_squareness
  - name:outer_triangularity
  sources:
