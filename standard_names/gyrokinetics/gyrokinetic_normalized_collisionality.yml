name: gyrokinetic_normalized_collisionality
status: draft
cocos_transformation_type: one_like
description: Dimensionless collision frequency between two plasma species, normalized
  to a gyrokinetic reference rate such as $c_s / a$ or $v_{\mathrm{th}} / R$.
documentation: "The normalized collisionality $\\nu^* = \\nu_{ss'} / \\nu_{\\mathrm{ref}}$\
  \ measures the importance of Coulomb collisions between species $s$ and $s'$ relative\
  \ to the characteristic drift or streaming timescale used in a gyrokinetic simulation,\
  \ where $\\nu_{ss'}$ is the dimensional inter-species collision frequency and $\\\
  nu_{\\mathrm{ref}}$ is the code reference rate (commonly $c_s / a$ with $c_s = \\\
  sqrt{T_e / m_i}$ the ion sound speed and $a$ the minor radius, or alternatively\
  \ $v_{\\mathrm{th},s} / R_0$ with $R_0$ the major radius). In tokamak core plasmas,\
  \ $\\nu^*$ typically ranges from $10^{-3}$ (hot, low-density, nearly collisionless\
  \ regime relevant to ITG turbulence) to $\\mathcal{O}(1)$ (high-density or edge\
  \ conditions where collisional effects become important). This parameter controls\
  \ the transition between collisionless (banana), plateau, and Pfirsch\u2013Schl\xFC\
  ter transport regimes and is a key input to gyrokinetic codes (GENE, GS2, CGYRO,\
  \ GYRO) for setting the collision operator strength. The specific normalization\
  \ convention varies by code and must be documented alongside the numerical value."
