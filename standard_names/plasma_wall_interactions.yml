- name: ion_density_at_limiter
  kind: scalar
  status: active
  description: Local particle number density of an ion population evaluated in the
    boundary plasma immediately adjacent to a plasma-facing limiter surface, on the
    plasma side of the magnetic presheath or sheath entrance.
  documentation: 'Ion density at a limiter is the local number density of an ion population
    in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is on the plasma side of the magnetic presheath or sheath
    entrance, where open scrape-off-layer field lines terminate on the limiter material.
    The ion population may be a specified set of ionic species or an aggregate over
    species and charge states; electrons and neutral atoms are excluded.


    For an aggregated ion population, the extensive number density is summed over
    the included ion species and over all their ionized charge states:


    $$

    n_i = \sum_{s \in \mathcal{I}} \sum_{q \in \mathcal{Q}_s} n_{s,q}

    $$


    where $\mathcal{I}$ is the included set of ion species, $\mathcal{Q}_s$ is the
    set of positive charge states of species $s$, and $n_{s,q}$ is the local number
    density of ions of species $s$ in charge state $q$ at the limiter evaluation point.


    This quantity is an ion-only specialization of [density_at_limiter](name:density_at_limiter).
    The species-and-charge-state-summed realization is [total_ion_density_at_limiter](name:total_ion_density_at_limiter).
    It remains distinct from [electron_density_at_limiter](name:electron_density_at_limiter):
    quasineutrality at the sheath entrance relates $n_e$ to the charge-weighted ion
    sum, $n_e \approx \sum_{s,q} q\,n_{s,q}$, whereas $n_i$ is the unweighted ion
    particle count density.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:total_ion_density_at_limiter
  - name:electron_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: ion
    operator_kind: qualifier
- name: ion_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Outgoing energy flux per unit plasma-facing wall area produced when
    incident plasma ions recombine at the surface, restricted to the ion-associated
    channel and summed over incident-ion species and charge states.
  documentation: 'Ion energy flux at the wall due to recombination quantifies the
    rate at which recombination-associated energy from incident plasma ions leaves
    a plasma-facing surface per unit area. It is the ion-associated component summed
    over incident-ion species and charge states, not the incident plasma energy flux
    or energy deposited in the wall material.


    The aggregate is defined from charge-state-resolved components by:


    $$

    Q_{\mathrm{rec,ion}}(\mathbf{x}_w) = \sum_{s,q} Q_{\mathrm{rec},s,q}(\mathbf{x}_w)

    $$


    where $\mathbf{x}_w$ is the wall location, $s$ identifies an incident-ion species,
    $q$ identifies its charge state, and $Q_{\mathrm{rec},s,q}$ is the corresponding
    [ion charge-state energy flux at the wall due to recombination](name:ion_charge_state_energy_flux_at_wall_due_to_recombination).
    The sum includes all represented incident-ion species and charge states.


    As a component of [energy flux at the wall due to recombination](name:energy_flux_at_wall_due_to_recombination),
    this quantity retains only the ion-associated energy channel. Unlike [particle
    flux at the wall due to recombination](name:particle_flux_at_wall_due_to_recombination),
    it weights the outgoing recombination contribution by carried energy; it is distinct
    from incident [ion kinetic energy flux at the wall](name:ion_kinetic_energy_flux_at_wall).'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_charge_state_energy_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
