- name: vertical_coordinate_of_first_point_of_thick_line
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the first endpoint of a thick-line cross-section
    geometry element in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The thick-line geometry element approximates a conductor or structural
    component cross-section as a finite-width line segment; this scalar gives the
    $Z$ coordinate (height along the machine symmetry axis) of its first endpoint,
    completing the two-point specification together with [vertical_coordinate_of_second_point_of_thick_line](name:vertical_coordinate_of_second_point_of_thick_line).
    Combined with the corresponding major-radius coordinate from [coordinate_of_first_point_of_thick_line](name:coordinate_of_first_point_of_thick_line),
    the point is fully located in the poloidal $(R, Z)$ plane. Typical values span
    roughly $-5$ m to $+5$ m for tokamak geometries, determined by the physical extent
    of coils, passive structures, or ferritic elements along the vertical axis. The
    geometry is used in axisymmetric equilibrium and eddy-current modeling to represent
    the cross-sectional shape of conductors. The companion endpoint coordinate is
    [vertical_coordinate_of_second_point_of_thick_line](name:vertical_coordinate_of_second_point_of_thick_line),
    and analogous start-point definitions for other geometry types include [vertical_coordinate_of_arcs_of_circle_start_point](name:vertical_coordinate_of_arcs_of_circle_start_point).


    Sign convention: Positive when the first endpoint lies above the machine midplane
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
