name: radial_component_of_diamagnetic_current_density
status: draft
description: Radial projection of the diamagnetic current density arising from the
  perpendicular pressure gradient in the plasma.
documentation: The diamagnetic current density $\mathbf{j}_{\mathrm{dia}} = (\mathbf{B}
  \times \nabla p) / B^2$, where $\mathbf{B}$ is the magnetic field (T) and $\nabla
  p$ is the total pressure gradient (Pa/m), is a fundamental MHD equilibrium current.
  Its radial component $j_{\mathrm{dia},r} = \hat{r} \cdot \mathbf{j}_{\mathrm{dia}}$
  quantifies the portion of this current directed along the local radial (minor-radius)
  direction. In axisymmetric equilibria, $j_{\mathrm{dia},r}$ is typically small compared
  with the poloidal and toroidal components but becomes important for accurate force-balance
  closures and transport modeling in shaped plasmas. Typical magnitudes range from
  $10^3$ to $10^5$ A m$^{-2}$ depending on the pressure-gradient scale length and
  magnetic-field strength. The quantity is computed from equilibrium reconstruction
  or kinetic profile data combined with magnetic geometry. See also the poloidal and
  toroidal diamagnetic current components and the full pressure profile.
