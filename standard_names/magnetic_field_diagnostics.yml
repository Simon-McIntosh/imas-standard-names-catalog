- name: vertical_coordinate_of_toroidal_magnetic_field_probe
  kind: scalar
  status: active
  description: "Vertical coordinate of a toroidal magnetic-field probe is the Z position\
    \ of the probe in the right-handed cylindrical (R, \u03C6, Z) frame, measured\
    \ above or below the machine midplane."
  documentation: 'Vertical coordinate of a toroidal magnetic-field probe is the $Z$
    position of the probe in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    locates the probe along the vertical direction relative to the machine midplane.


    For a probe position vector $\mathbf{r}_{\mathrm{probe}}$ and the vertical unit
    vector $\hat{Z}$, the coordinate is the signed projection onto $\hat{Z}$:


    $$

    Z_{\mathrm{probe}} = \mathbf{r}_{\mathrm{probe}} \cdot \hat{Z}

    $$


    where $Z_{\mathrm{probe}}$ is the vertical coordinate of the toroidal magnetic-field
    probe.


    Together with the [radial coordinate of a toroidal magnetic-field probe] and the
    [toroidal angle of a toroidal magnetic-field probe](name:toroidal_angle_of_toroidal_magnetic_field_probe),
    this coordinate specifies the probe position in the right-handed cylindrical $(R,
    \phi, Z)$ frame. This quantity is a position coordinate, not a magnetic-field
    component or a probe response; the corresponding coordinate for a poloidal magnetic-field
    probe is [vertical coordinate of a poloidal magnetic-field probe](name:vertical_coordinate_of_poloidal_magnetic_field_probe).


    Sign convention: Positive when the probe is located above the machine midplane
    in the $+Z$ direction.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:toroidal_angle_of_toroidal_magnetic_field_probe
