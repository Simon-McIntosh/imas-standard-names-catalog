- name: width_of_filter
  kind: scalar
  status: draft
  description: Full wavelength extent of a diagnostic filter transmission passband,
    expressed as a positive scalar span between two defined passband-edge wavelengths.
  documentation: 'Width of filter is the positive scalar extent of the wavelength
    interval transmitted by a diagnostic filter according to a specified passband-edge
    criterion. It abstracts the spectral passband span represented more specifically
    by [spectral width of filter](name:spectral_width_of_filter).


    For a passband bounded by lower and upper edge wavelengths, the width is


    $$

    \Delta \lambda = \lambda_2 - \lambda_1

    $$


    where $\lambda_1 < \lambda_2$ are the two wavelengths defining the passband edges.
    The edge criterion may be a specified fraction of the peak transmission, such
    as the 90% level used for [spectral width of filter](name:spectral_width_of_filter).


    In practice the width is obtained from a measured or manufacturer-specified filter
    transmission curve by locating the two wavelengths that satisfy the chosen edge
    criterion and taking their separation. It is used to characterize spectral selectivity,
    photon throughput, and the wavelength range contributing to a radiation measurement.


    Typical values depend strongly on filter type and diagnostic band: narrow interference
    filters may have widths of 1e-10-1e-8 m, while broader optical or X-ray bandpass
    filters can have widths of 1e-8-1e-6 m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_width_of_filter
  - name:filter_window_width
  - name:filter_window_height
