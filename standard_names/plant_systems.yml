- name: radial_coordinate_of_shattering_position
  kind: scalar
  status: active
  description: "Major-radius coordinate of the shatter-cone origin, defined as its\
    \ perpendicular distance from the toroidal symmetry axis in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The radial coordinate of the shatter-cone origin is the major-radius
    location of the pellet shattering position, measured perpendicular to the toroidal
    symmetry axis. It locates the origin independently of its toroidal angle and vertical
    height, using the same radial-coordinate meaning as [radial coordinate of a measurement
    position](name:radial_coordinate_of_measurement_position).


    $$

    R_{\mathrm{sc}} = \sqrt{x_{\mathrm{sc}}^2 + y_{\mathrm{sc}}^2}

    $$


    where $R_{\mathrm{sc}}$ is the shatter-cone origin''s radial coordinate, and $x_{\mathrm{sc}}$
    and $y_{\mathrm{sc}}$ are its horizontal Cartesian coordinates in the right-handed
    Cartesian $(x,y,z)$ frame, with $z=Z$. The resulting coordinate is the nonnegative
    perpendicular distance from the toroidal symmetry axis.'
  unit: m
  physics_domain: plant_systems
  links:
