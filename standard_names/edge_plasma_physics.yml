- name: toroidal_iron_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Density-weighted toroidal bulk-flow velocity of ionized iron at the\
    \ core-side shoulder of the H-mode edge transport barrier, resolved along increasing\
    \ toroidal angle in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal iron velocity at the pedestal top is the density-weighted
    mean bulk-flow velocity of ionized iron ions at the core-side shoulder of the
    H-mode edge transport barrier. It includes all populated iron charge states from
    Fe+ through fully stripped iron and excludes neutral iron.


    For charge states $q=1,\ldots,26$, the velocity is defined by


    $$

    v_\phi^{\mathrm{Fe}} = \frac{\sum_{q=1}^{26} n_q u_{\phi,q}}{\sum_{q=1}^{26} n_q}

    $$


    where $n_q$ is the number density of iron charge state $q$ in m$^{-3}$, $u_{\phi,q}$
    is its toroidal bulk-flow component in m s$^{-1}$, and $v_\phi^{\mathrm{Fe}}$
    is the resulting density-weighted velocity. This charge-state aggregation is distinct
    from a charge-state-resolved velocity and is analogous to [toroidal krypton velocity
    at the pedestal top](name:toroidal_krypton_velocity_at_pedestal_top); its locus
    differs from [toroidal iron velocity at the internal transport barrier](name:toroidal_iron_velocity_at_internal_transport_barrier).


    Sign convention: Positive when the density-weighted iron-ion flow points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_krypton_velocity_at_pedestal_top
  - name:toroidal_iron_velocity_at_internal_transport_barrier
  sources:
