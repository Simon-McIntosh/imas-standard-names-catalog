- name: parallel_normalized_perturbed_vector_potential
  kind: scalar
  status: active
  description: Dimensionless field-aligned component of the perturbed electromagnetic
    vector potential in gyrokinetic turbulence, retaining its signed or complex value
    rather than its modulus.
  documentation: 'This quantity is the parallel projection of the fluctuating electromagnetic
    vector potential, normalized consistently with the [normalized perturbed vector
    potential](name:normalized_perturbed_vector_potential). It represents the field-aligned
    electromagnetic fluctuation itself rather than its amplitude.


    $$

    a_\parallel = \frac{\delta\mathbf{A}\cdot\hat{\mathbf{b}}}{B_{\mathrm{ref}}\rho_{\mathrm{ref}}}
    = \frac{\delta A_\parallel}{B_{\mathrm{ref}}\rho_{\mathrm{ref}}}

    $$


    where $\delta\mathbf{A}$ is the perturbed electromagnetic vector potential, $\hat{\mathbf{b}}$
    is the unit vector along the equilibrium magnetic field, $\delta A_\parallel$
    is its field-aligned projection, $B_{\mathrm{ref}}$ is a reference magnetic-field
    strength, and $\rho_{\mathrm{ref}}$ is a reference length.


    The value retains the signed real component or complex eigenfunction coefficient
    and is distinct from the modulus defined by [parallel normalized perturbed vector
    potential amplitude](name:parallel_normalized_perturbed_vector_potential_amplitude).
    Its value depends on the selected electromagnetic gage and, for a linear eigenmode,
    on the arbitrary overall eigenfunction phase.'
  unit: '1'
  physics_domain: turbulence
