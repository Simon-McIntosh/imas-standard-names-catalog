name: parallel_component_of_tendency_of_fast_electron_pressure
description: Time derivative of the fast (non-thermal) electron pressure projected
  along the magnetic-field direction $\hat{b}$.
documentation: "The parallel component of the tendency of fast electron pressure represents\
  \ $\\partial p_{e,\\mathrm{fast},\\parallel}/\\partial t$, where $p_{e,\\mathrm{fast},\\\
  parallel}$ (Pa) is the pressure tensor element of suprathermal electrons along the\
  \ local magnetic-field line $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$. Fast electrons\
  \ arise from auxiliary heating (electron cyclotron resonance heating, lower-hybrid\
  \ current drive) and fusion-born runaway populations; their pressure tensor is generally\
  \ anisotropic, requiring separate parallel and perpendicular components. This time\
  \ derivative is used internally by transport solvers to advance the anisotropic\
  \ fast-electron pressure equation in time; typical magnitudes are of order $10^2$\u2013\
  $10^4$ Pa s$^{-1}$ depending on heating power and confinement time. See also `perpendicular_component_of_tendency_of_fast_electron_pressure`\
  \ for the orthogonal component and `tendency_of_electron_temperature` for the bulk\
  \ thermal channel."
kind: vector_component
unit: Pa
status: draft
