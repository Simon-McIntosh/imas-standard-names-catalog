- name: thickness_of_optical_element
  kind: scalar
  status: draft
  description: Physical thickness of an optical element is the perpendicular separation
    between its opposing optical surfaces. It is a non-negative geometric length of
    the element, normally defined along the element normal or another stated thickness
    reference.
  documentation: 'The thickness of an optical element is the physical distance between
    its two opposing optical surfaces, measured perpendicular to the reference surface
    or along the specified element normal. It is a non-negative geometric length of
    the component itself, independent of the direction in which light is propagated.
    For curved, wedged, or nonparallel elements, the value corresponds to the stated
    thickness convention, such as center thickness, edge thickness, or local normal
    separation.


    Thickness is obtained from mechanical design, metrology, or optical modeling.
    Common measurements include calipers or micrometers for accessible plane-parallel
    elements, coordinate measurement or profilometry for curved or wedged optics,
    and interferometry or ellipsometry for thin films. In optical calculations for
    a homogeneous element at normal incidence, $\mathrm{OPL}=n d$, where $\mathrm{OPL}$
    is optical path length in meters, $d$ is thickness in meters, and $n$ is the dimensionless
    refractive index at the relevant wavelength; more general calculations also require
    surface curvatures, wedge, aperture, coatings, roughness, and refractive-index
    dispersion.


    Representative order-of-magnitude values depend strongly on the component type:
    coatings and very thin filters may be about 10^-8-10^-5 m, filter plates and small
    windows about 10^-4-10^-2 m, and robust protective windows or large optical elements
    can be thicker. The appropriate value is set by material strength, absorption
    length, thermal loading, wavelength range, and optical design.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:back_surface_curvature_of_optical_element
  - name:surface_roughness_of_optical_element
  sources:
