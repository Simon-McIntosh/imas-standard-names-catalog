- name: toroidal_angle_of_line_of_sight
  kind: scalar
  status: active
  description: "Toroidal angle locating the designated point on a diagnostic line\
    \ of sight in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the toroidal angular coordinate of the point designated
    on a line of sight. It locates that point azimuthally around the symmetry axis
    and is the line-of-sight-specific counterpart of the general [toroidal angle](name:toroidal_angle).


    For Cartesian coordinates of the designated point, with the $chat{x}$ axis along
    the $phi=0$ reference and $hat{z}=hat{Z}$, the toroidal angle is defined by:


    $$

    \phi = \operatorname{atan2}(y,x) \pmod{2\pi}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates and $\operatorname{atan2}$
    returns the azimuthal angle. This is the $\phi$ coordinate in the right-handed
    cylindrical $(R,\phi,Z)$ frame, whose basis $(\hat{R},\hat{\phi},\hat{Z})$ satisfies
    $\hat{R}\times\hat{\phi}=\hat{Z}$.


    The value applies to the designated point of the line of sight, not to the line-of-sight
    direction, angular width, or an integral along the path. For a multi-point path,
    the designated point is the one specified by the associated geometry.


    Sign convention: Positive when measured counter-clockwise about $+\hat{Z}$ from
    the $\phi=0$ reference direction when viewed from above $+\hat{Z}$.'
  unit: rad
  physics_domain: general
  links: []
  sources:
