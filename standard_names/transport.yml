- name: toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons
  kind: scalar
  status: draft
  description: Toroidal component of the collisional torque density acting on the
    fast particle population due to Coulomb collisions with background thermal electrons,
    quantifying the local rate of toroidal angular momentum exchange per unit volume
    between fast particles and electrons.
  documentation: "The toroidal collisional torque density $\\tau_\\phi^{\\rm fp,e}$\
    \ (units: N m$^{-2}$) represents the local rate at which toroidal angular momentum\
    \ is exchanged between the fast (suprathermal) particle population and the thermal\
    \ electron background through Coulomb collisions. Formally, it is the toroidal\
    \ projection of the collisional friction force density integrated over the fast-particle\
    \ velocity distribution:\n\n$$\\tau_\\phi^{\\rm fp,e} = \\int m\\, v_\\phi\\,\
    \ C^{\\rm fp/e}[f_{\\rm fp}]\\, d^3v$$\n\nwhere $C^{\\rm fp/e}$ is the Coulomb\
    \ collision operator acting on the fast-particle distribution $f_{\\rm fp}$ due\
    \ to electrons, $v_\\phi = R\\, v \\cdot \\hat{\\phi}$ is the toroidal velocity\
    \ component in the right-handed cylindrical $(R, \\phi, Z)$ frame, $R$ is the\
    \ major radius, and the integral is taken over the full fast-particle velocity\
    \ space. Equivalently, $\\tau_\\phi^{\\rm fp,e} = R\\, (\\mathbf{F}_{\\rm coll}^{\\\
    rm fp,e} \\cdot \\hat{\\phi})$, where $\\mathbf{F}_{\\rm coll}^{\\rm fp,e}$ is\
    \ the local collisional friction force density (N m$^{-3}$) exerted on fast particles\
    \ by electrons, and $R$ carries units of meters, giving the volume-local toroidal\
    \ torque density in N m$^{-2}$.\n\nThis quantity is intrinsically local: it is\
    \ defined per unit plasma volume at each spatial point, and its integral over\
    \ a flux-surface volume yields the total electron-channel collisional torque on\
    \ the fast particles contained within that volume.\n\nThe electron-drag channel\
    \ dominates the slowing-down of fast particles at high velocities $v \\gg v_{\\\
    rm crit}$, where the critical velocity $v_{\\rm crit} \\approx \\left(\\frac{3\\\
    sqrt{\\pi}}{4}\\right)^{1/3}\\left(\\frac{m_e}{\\bar{m}_i}\\right)^{1/3} v_{\\\
    rm te}$ (with $\\bar{m}_i$ a mass-averaged ion parameter and $v_{\\rm te}$ the\
    \ thermal electron speed) marks the transition between electron-dominated and\
    \ ion-dominated drag regimes. Below $v_{\\rm crit}$, collisions with thermal ions\
    \ \u2014 described by related quantities \u2014 become the dominant momentum-exchange\
    \ channel. In neutral-beam-heated tokamaks, typical magnitudes of this torque\
    \ density range from $10^2$ to $10^5$ N m$^{-2}$ in the plasma core, depending\
    \ on beam energy, injection geometry, and plasma density.\n\nSeparating the electron\
    \ and ion collisional channels enables detailed validation of drift-kinetic, Fokker\u2013\
    Planck, or Monte Carlo slowing-down models. The sum of the electron and ion fast-particle\
    \ torque density channels equals the total collisional torque density acting on\
    \ the fast particle population.\n\nSign convention: Positive when the collisional\
    \ torque acts on the fast particle population in the direction of increasing toroidal\
    \ angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame (counter-clockwise\
    \ viewed from above $+\\hat{Z}$)."
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons
  - name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
