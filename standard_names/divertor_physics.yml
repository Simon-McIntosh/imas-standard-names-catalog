- name: ion_density_at_divertor_plate
  kind: scalar
  status: draft
  description: Total number density of ions of all species incident on the divertor
    plate.
  documentation: 'The total ion density $n_{i,\text{total}}$ at the divertor plate
    is the sum of the number densities of all ion species present in the plasma flux
    incident on the surface. It is a key parameter for determining the plasma pressure
    and particle flux at the divertor, which govern target erosion, heat loads, and
    detachment conditions. Typical values range from $10^{19}\,\text{m}^{-3}$ in attached
    regimes to below $10^{18}\,\text{m}^{-3}$ in detached divertor operation. The
    density is commonly measured by Langmuir probes or inferred from spectroscopic
    line-ratio analysis. This quantity is the ion counterpart of [electron_density_at_divertor_plate](name:electron_density_at_divertor_plate)
    and is closely related to the total particle flux through the [ion_temperature_at_divertor_plate](name:ion_temperature_at_divertor_plate).


    Sign convention: Positive for all physical conditions, as ion density is a non-negative
    scalar field.


    The quantity is derived from a total ion density measurement (usually a sum over
    species), mirroring [ion_density_at_divertor_target](name:ion_density_at_divertor_target)
    but at the plate location.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_plate
  - name:ion_temperature_at_divertor_plate
  - name:ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/n_i_total/value
    dd_path: summary/local/divertor_plate/n_i_total/value
    status: composed
- name: ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: Total ion number density summed over all charged species at the divertor
    target.
  documentation: 'The total ion density $n_{\text{i,total}}$ at the divertor target
    is the sum of the number densities of all positive ion species incident on the
    plasma-facing surface. It is a key parameter in determining the total particle
    flux to the target, which drives the sheathed plasma potential and the incident
    ion impact energy. In typical divertor conditions, $n_{\text{i,total}}$ ranges
    from $10^{18}$ to $10^{21}\,\text{m}^{-3}$, with lower values in the far scrape-off
    layer and higher values near the strike point under attached regimes. This quantity
    is often inferred from Langmuir probe ion saturation current measurements or from
    spectroscopic line ratios of individual species combined with the total ion current
    measured by target-mounted probes. The total ion density can be compared to the
    [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    to assess quasi-neutrality. The quantity is measured as a volume density at the
    target surface plane.


    Sign convention: Positive when particles are present; the density is inherently
    non-negative.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i_total/value
    dd_path: summary/local/divertor_target/n_i_total/value
    status: composed
- name: ion_power_at_inner_divertor_target
  kind: scalar
  status: draft
  description: Total thermal power carried by all incident ion species onto the inner
    divertor target, integrated over the target area.
  documentation: "The ion power at the inner divertor target represents the sum over\
    \ all incoming ion species of the convective heat flux deposited on the inner\
    \ divertor plasma-facing components (PFCs). This power is the integrated product\
    \ of the ion particle flux and the ion energy per particle arriving at the target\
    \ surface, $P_{\\text{ion,inner}} = \\int_S \\Gamma_i \\, E_i \\, dS$, where $\\\
    Gamma_i$ is the total ion flux density and $E_i$ is the mean incident ion energy.\
    \ It is a key quantity for assessing divertor heat loads, target erosion rates,\
    \ and the effectiveness of detachment and impurity seeding in reducing peak power\
    \ fluxes. Typical values in present-day tokamaks like JET and DIII-D range from\
    \ 0.1\u20135 MW during attached conditions, dropping to less than 0.1 MW under\
    \ strong detachment. The ion contribution often dominates the inner target heat\
    \ flux in attached regimes, while electron power may become comparable during\
    \ detachment. See also [electron_power_at_inner_divertor_target](name:electron_power_at_inner_divertor_target)\
    \ for the companion electron component and [electron_power_at_outer_divertor_target](name:electron_power_at_outer_divertor_target)\
    \ for the outer target."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_inner_divertor_target
  - name:electron_power_at_outer_divertor_target
  sources:
  - id: dd:wall/global_quantities/power_inner_target_ion_total
    dd_path: wall/global_quantities/power_inner_target_ion_total
    status: composed
- name: ion_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Mean thermal energy of all ion species incident on the divertor target
    surface, averaged over the ion population reaching the target.
  documentation: "The ion temperature at the divertor target $T_i^{\\text{div}}$ is\
    \ the density-weighted average kinetic temperature of all ion species (e.g., D,\
    \ He, impurities) incident on the target surface. It governs plasma-surface interaction\
    \ processes such as sputtering yields and heat flux via $q_\\parallel = \\gamma\
    \ n_i T_i c_s$, where $\\gamma$ is the sheath heat transmission coefficient (typically\
    \ 5\u20138), $n_i$ is the ion density, and $c_s$ is the sound speed. For consistency,\
    \ $T_i$ must be expressed in joules ($T_i [\\mathrm{J}] = e \\cdot T_i [\\mathrm{eV}]$,\
    \ with $e$ the elementary charge) when used in such power balance equations. This\
    \ quantity is typically inferred from Langmuir probe measurements of ion saturation\
    \ current and floating potential, or from spectroscopic line ratios of neutral\
    \ atoms recycling at the target. Typical values range from 1\u201310 eV in detached\
    \ divertor conditions to 50\u2013100 eV in attached regimes. The temperature represents\
    \ a thermal average; non-thermal or multi-species distributions may contribute\
    \ to the mean. Related quantities include [ion_density_at_divertor_target](name:ion_density_at_divertor_target),\
    \ [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target),\
    \ and the position-specific counterpart [ion_temperature_at_divertor_plate](name:ion_temperature_at_divertor_plate).\n\
    \nSign convention: Positive when the measured ion energy distribution corresponds\
    \ to a finite thermal temperature."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:ion_temperature_at_divertor_plate
  sources:
  - id: dd:summary/local/divertor_target/t_i_average/value
    dd_path: summary/local/divertor_target/t_i_average/value
    status: composed
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of singly- or multiply-ionized iron atoms at the divertor
    target plate.
  documentation: 'The iron density at the divertor target $n_{Fe,t}$ describes the
    volumetric number density of singly- or multiply-ionized iron atoms incident on
    or near the target plate surface. Iron is a metallic impurity originating from
    plasma-facing component erosion, such as from steel or tungsten alloys, and can
    significantly affect divertor power balance and core plasma contamination through
    line radiation. The density is typically inferred from spectroscopic measurements
    of iron line emission combined with collisional-radiative modeling, or from direct
    probe measurements. Typical values range from $10^{15}\,\text{m}^{-3}$ in low-erosion
    conditions to $10^{18}\,\text{m}^{-3}$ in devices with strong metallic wall sources.
    The charge state distribution of iron depends strongly on the local electron temperature:
    at $T_e \sim 10\,\text{eV}$, Fe$^{2+}$ and Fe$^{3+}$ dominate; at $T_e \sim 100\,\text{eV}$,
    Fe$^{8+}$ through Fe$^{14+}$ are prevalent; above $1\,\text{keV}$, bare Fe$^{26+}$
    can exist. As a density, the quantity is inherently non-negative. Local variations
    influence the electron density through quasi-neutrality and the total radiated
    power via iron line emission.


    Sign convention: Positive when the number density of iron ions at the divertor
    target is measured, representing ion count per unit volume.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:argon_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/iron/value
    dd_path: summary/local/divertor_target/n_i/iron/value
    status: composed
- name: lithium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of lithium ions in the plasma incident on the divertor
    target surface.
  documentation: 'The lithium density at the divertor target quantifies the local
    concentration of lithium ions ($\text{Li}^{q+}$) striking the target plate. Lithium
    is a common wall coating material and impurity species in tokamaks; its density
    at the target is a key input for erosion, redeposition, and tritium retention
    models. This quantity is typically inferred from spectroscopy of the Li-I or Li-II
    line emission, combined with collisional-radiative models and S/XB (ionization
    per photon) coefficients. At the target, the density is strongly sensitive to
    the divertor plasma conditions and the source rate from the main chamber walls.
    Typical values in a lithium-coated divertor range from $10^{14}$ to $10^{18}$
    m$^{-3}$, depending on the divertor regime (attached vs. detached) and the upstream
    lithium influx. A related quantity is the integral of the density along the divertor
    leg, captured by the [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target),
    which provides a reference for the main-ion density.


    Sign convention: Positive when the quantity is non-negative, as density is inherently
    positive.


    This quantity is sign-invariant (density is always non-negative) and therefore
    the sign convention is not applicable.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/lithium/value
    dd_path: summary/local/divertor_target/n_i/lithium/value
    status: composed
- name: major_radius_of_divertor_target
  kind: scalar
  status: draft
  description: Major-radius coordinate of the divertor target tile's plasma-facing
    surface outline in the poloidal plane.
  documentation: 'The major-radius (cylindrical $R$) coordinate of a divertor target
    tile''s surface outline specifies the radial position of the plasma-facing boundary
    in the poloidal cross-section, measured from the machine symmetry axis. This coordinate,
    together with the vertical coordinate $Z$, defines the target geometry used in
    heat-flux modeling and equilibrium reconstruction. The outline is typically measured
    during tile installation or derived from engineering CAD drawings; its accuracy
    affects the magnetic field line incidence angle calculation. Typical $R$ values
    range from 0.5 m to 2.0 m for inboard targets and 1.5 m to 3.5 m for outboard
    targets in medium-size tokamaks, with larger values for ITER (up to 5.0 m). Compare
    with [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target)
    for the orthogonal spatial component and [major_radius_of_strike_point](name:major_radius_of_strike_point)
    for the specific radial location of the separatrix intersection.


    Sign convention: Positive when the coordinate lies outward from the machine axis.


    The value is always non-negative in the IMAS cylindrical $(R, \phi, Z)$ system.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_coordinate_of_divertor_target
  - name:major_radius_of_strike_point
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/r
    dd_path: divertors/divertor/target/tile/surface_outline/r
    status: composed
- name: neon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Volumetric number density of neon impurity ions, summed over all charge
    states, incident upon the divertor target surface.
  documentation: "The neon density at the divertor target represents the volumetric\
    \ concentration of neon impurity particles in the plasma flux contacting the target\
    \ surface. Neon is often injected as a radiating impurity to mitigate divertor\
    \ heat loads by dissipating power through line radiation; $n_{\\text{Ne}}$ therefore\
    \ governs the local radiative loss rate $P_{\\text{rad}} \\propto n_{\\text{Ne}}\
    \ n_e L_z(T_e)$, where $n_e$ is the electron density and $L_z$ is the cooling\
    \ rate coefficient. Typical values range from $10^{16}\\,\\text{m}^{-3}$ in low-density,\
    \ attached divertor regimes to $10^{19}\\,\text{m}^{-3}$ in detached, high-recycling\
    \ conditions, as inferred from spectroscopic line emission or Langmuir probe measurements\
    \ combined with collisional-radiative modeling. The density is always non-negative\
    \ and exists simultaneously with other species densities at the same location;\
    \ its interplay with [electron_density_at_divertor_target](name:electron_density_at_divertor_target)\
    \ determines the effective ion charge $Z_{\\text{eff}}$ and the parallel momentum\
    \ balance in the scrape-off layer. See also [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)\
    \ for the main-ion species and [nitrogen_density_at_divertor_target](name:nitrogen_density_at_divertor_target)\
    \ for an alternative radiating impurity.\n\nSign convention: Positive when neon\
    \ particles are present at the divertor target."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:deuterium_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/neon/value
    dd_path: summary/local/divertor_target/n_i/neon/value
    status: composed
- name: nitrogen_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of singly ionized nitrogen atoms in the divertor strike-point
    region, derived from spectroscopic or probe measurements.
  documentation: 'The nitrogen ion density at the divertor target $n_{\mathrm{N^+}}$
    quantifies the local concentration of nitrogen impurity ions impacting the target
    surface. It is determined from passive spectroscopy (e.g., N II line emission)
    or Langmuir probe ion saturation current combined with local $T_e$ measurements,
    assuming a single ionization state. Typical values range from $10^{17}\,\mathrm{m^{-3}}$
    in low-recycling attached regimes to $10^{20}\,\mathrm{m^{-3}}$ in dense, detached
    divertor conditions. Nitrogen seeding is routinely applied to reduce divertor
    heat loads via radiative dissipation, making this density a key actuator in divertor
    power balance. The quantity is closely linked to [nitrogen_flux_at_divertor_target](name:nitrogen_flux_at_divertor_target)
    through the incident particle velocity and to the local [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    via quasi-neutrality. The target ion density also evolves with the [divertor_plasma_temperature](name:divertor_plasma_temperature)
    because of volumetric recombination and ionization balance.


    Sign convention: Positive when the local ion number density is measured in the
    reference frame of the divertor target surface.


    Cross-references: [argon_density_at_divertor_target](name:argon_density_at_divertor_target),
    [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:nitrogen_flux_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:divertor_plasma_temperature
  - name:argon_density_at_divertor_target
  - name:carbon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/nitrogen/value
    dd_path: summary/local/divertor_target/n_i/nitrogen/value
    status: composed
- name: surface_area_of_divertor_target
  kind: scalar
  status: draft
  description: Total surface area of the divertor target tile face that is directly
    exposed to the incident plasma flux.
  documentation: 'The surface area $A_{\mathrm{target}}$ of the divertor target tile
    defines the wetted area over which plasma particles deposit their energy and momentum.
    It is a key geometric parameter for interpreting Langmuir probe measurements,
    infrared thermography, and for calculating the local power flux density $q_{\parallel}
    = P_{\mathrm{target}} / A_{\mathrm{target}}$, where $P_{\mathrm{target}}$ is the
    total deposited power. Typical values for individual tokamak divertor tiles range
    from $10^{-2}$ to $10^{-1}\,\mathrm{m}^2$, depending on tile design and poloidal
    location. This quantity is distinct from the projected lengths described by [vertical_length_of_divertor_target](name:vertical_length_of_divertor_target)
    and [radial_length_of_divertor_target](name:radial_length_of_divertor_target),
    which characterize the target extent along specific coordinate axes.


    Sign convention: Positive when the tile surface faces the plasma and contributes
    to the wetted area.


    The surface area is used in combination with measured power loads to compute the
    peak heat flux for engineering assessments of plasma-facing component lifetime.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:vertical_length_of_divertor_target
  - name:radial_length_of_divertor_target
  sources:
  - id: dd:divertors/divertor/target/tile/surface_area
    dd_path: divertors/divertor/target/tile/surface_area
    status: composed
- name: tritium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tritium ions incident on the divertor target surface.
  documentation: 'The tritium density at the divertor target determines the tritium
    fuel flux to the plasma-facing surface and is a key input for fuel retention and
    tritium inventory studies. This quantity is measured in the strike-point region
    using optical spectroscopy (Balmer-alpha or molecular band emission) combined
    with collisional-radiative models, or inferred from Langmuir probe data coupled
    to the ion saturation current. Typical target densities range from $10^{18}$ to
    $10^{21}$ m$^{-3}$ in detached to attached divertor regimes. The tritium density
    is related to the total ion flux density via $\Gamma_{\mathrm{T}} = n_{\mathrm{T}}
    c_s \sin\theta$, where $c_s$ is the ion sound speed and $\theta$ the magnetic
    field incidence angle. Cross-comparison with [deuterium_density_at_divertor_target](name:deuterium_density_at_divertor_target)
    and [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target)
    provides the isotopic mix for fuel-cycle analysis.


    Sign convention: Positive when the density is a real non-negative number describing
    particle count per unit volume.


    Measured alongside [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target)
    and [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    to characterize the divertor plasma state.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:deuterium_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/tritium/value
    dd_path: summary/local/divertor_target/n_i/tritium/value
    status: composed
- name: tungsten_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tungsten ions at the divertor target surface.
  documentation: 'The tungsten density characterizes the erosion and transport of
    tungsten atoms from plasma-facing components into the divertor plasma. Tungsten
    ions at the target originate from sputtering of high-Z tungsten divertor tiles,
    predominantly by impacting deuterium, tritium, or impurity ions. The density $n_W$
    at the target sheath edge governs the tungsten source rate for subsequent core
    transport and is a key input for understanding high-Z impurity accumulation. Representative
    tungsten densities at the divertor target range from $10^{14}\,\text{m}^{-3}$
    in low-erosion L-mode plasmas to $10^{18}\,\text{m}^{-3}$ in strong-ELMing H-mode
    scenarios where sputtering is enhanced. This quantity is related to the total
    ion density through quasineutrality: $n_e \approx \sum_i Z_i n_i$, where $n_e$
    is the electron density and $Z_i$ is the charge state of each species. See also
    [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    for the compensating charge density, and [ion_density_at_divertor_target](name:ion_density_at_divertor_target)
    for the sum over all species.


    Local spectroscopic measurements of tungsten line emission (e.g., W I, W II) combined
    with collisional-radiative modeling or molecular-band analysis can infer $n_W$
    at the target. This standard name is analogous to similar density measurements
    for other divertor-relevant species, such as [nitrogen_density_at_divertor_target](name:nitrogen_density_at_divertor_target)
    and [argon_density_at_divertor_target](name:argon_density_at_divertor_target).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:ion_density_at_divertor_target
  - name:nitrogen_density_at_divertor_target
  - name:argon_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/tungsten/value
    dd_path: summary/local/divertor_target/n_i/tungsten/value
    status: composed
- name: vertical_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Vertical (Z-axis) coordinate of a point on the plasma-facing surface
    outline of a divertor target tile in the poloidal plane.
  documentation: 'This quantity provides the height (Z-coordinate) of points defining
    the poloidal outline of a divertor target tile surface, typically used to describe
    the tile geometry for heat-flux modeling and engineering design. The outline is
    represented as a set of $(R, Z)$ points in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $Z$ increases upward. The vertical coordinate is measured from
    a reference plane (typically the machine midplane), with units of meters. It is
    commonly extracted from CAD models or magnetic equilibrium reconstructions and
    is paired with the major radius coordinate `[major_radius_of_divertor_target](name:major_radius_of_divertor_target)`
    to define the full poloidal contour. The vertical extent influences the magnetic
    field line incidence angle and the resulting heat flux distribution, making it
    a key parameter in divertor design and assessment. Typical $Z$ values for divertor
    targets in medium-size tokamaks range from $-1$ to $+1$ m relative to the midplane,
    depending on the divertor configuration.


    Sign convention: Positive when the point is above the machine midplane in the
    direction of increasing $Z$.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:major_radius_of_divertor_target
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/z
    dd_path: divertors/divertor/target/tile/surface_outline/z
    status: composed
