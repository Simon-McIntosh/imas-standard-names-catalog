- name: temperature_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Temperature of the poloidal field coil conductor, used to evaluate
    the temperature-dependent current limits for quench protection and superconducting
    operation.
  documentation: "The conductor temperature of a poloidal field (PF) coil determines\
    \ the critical current density of the superconducting strands and the resistive\
    \ margin against quench. In operation, the temperature must remain below the current-sharing\
    \ temperature $T_{cs}$ to avoid flux flow and normal zone propagation. Typical\
    \ operating temperatures range from 4.5 K for Nb$_3$Sn and NbTi coils up to 80\
    \ K for high-temperature superconductors, with allowable temperature rises of\
    \ 1\u20133 K during a plasma pulse. This quantity is applied as the lookup coordinate\
    \ for the maximum coil current limit, together with the peak magnetic field described\
    \ in [maximum_magnetic_field_of_poloidal_field_coil](name:maximum_magnetic_field_of_poloidal_field_coil)."
  unit: K
  physics_domain: magnetic_field_systems
  links:
  - name:maximum_magnetic_field_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/temperature
    dd_path: pf_active/coil/temperature
    status: composed
- name: vertical_coordinate_of_iron_core_segment
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of an outline point defining the cross-sectional
    geometry of a transformer iron core segment.
  documentation: 'The vertical coordinate $Z$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame specifies the height of a vertex on the polygonal outline of an
    iron core segment''s cross-section. This coordinate, together with the corresponding
    [major radius](name:major_radius_of_iron_core_segment) and [height](name:height_of_iron_core_segment),
    defines the 2-D shape used to compute magnetic circuit properties such as reluctance
    and saturation. Outline points are typically stored in ordered pairs $(R, Z)$
    and trace the closed boundary of the segment cross-section, providing the geometric
    input for axisymmetric finite-element models of the transformer core.


    Sign convention: Positive when the point lies above the equatorial plane ($Z >
