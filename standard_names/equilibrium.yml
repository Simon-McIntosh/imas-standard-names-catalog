- name: triangularity_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless shape parameter for the plasma-boundary poloidal cross-section,
    expressing the aggregate inward radial displacement of its upper and lower extrema
    relative to the geometric center.
  documentation: "Plasma-boundary triangularity is a dimensionless shaping parameter\
    \ describing the asymmetry of the boundary\u2019s poloidal cross-section through\
    \ the inward displacement of its upper and lower radial extrema relative to the\
    \ geometric center. It characterizes the complete boundary rather than either\
    \ half-plane extremum alone.\n\nFor the upper and lower boundary extrema, the\
    \ aggregate triangularity is defined as\n\n$$\n\\delta = \\frac{1}{2}\\left(\\\
    frac{R_0-R_u}{a}+\\frac{R_0-R_l}{a}\\right)\n$$\n\nwhere $\\delta$ is the plasma-boundary\
    \ triangularity, $R_0$ is the major-radius coordinate of the geometric center,\
    \ $R_u$ and $R_l$ are the major-radius coordinates of the upper and lower boundary\
    \ extrema, and $a$ is the boundary minor radius. The coordinates refer to the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame.\n\nThis quantity applies to\
    \ the entire plasma boundary and aggregates the upper and lower extremal displacements\
    \ into one shape parameter. It excludes the separately resolved [upper triangularity\
    \ of the plasma boundary](name:upper_triangularity_of_plasma_boundary) and [lower\
    \ triangularity of the plasma boundary](name:lower_triangularity_of_plasma_boundary),\
    \ which retain only one extremum. It also differs from [triangularity of a flux\
    \ surface](name:triangularity_of_flux_surface), which describes an individual\
    \ nested magnetic flux surface rather than the outer plasma boundary."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/boundary/triangularity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-triangularity
    dd_documentation:
      leaf: Triangularity of the plasma boundary
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Triangularity (\u03B4) of the plasma boundary, a shape parameter\
        \ quantifying the asymmetry of the poloidal cross-section relative to the\
        \ midplane. A key geometric descriptor for plasma confinement and MHD stability\
        \ characterisation."
      kind: llm
- name: lower_triangularity_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless shaping parameter equal to the normalized inward radial
    displacement of the lower plasma-boundary extremum from the geometric center.
  documentation: 'Lower triangularity of the plasma boundary is a signed dimensionless
    measure of the horizontal displacement of its lower poloidal extremum relative
    to the geometric center. This component selects the lower extremum rather than
    averaging the upper and lower contributions.


    $$

    \delta_l = \frac{R_0-R_l}{a}

    $$


    Here, $\delta_l$ is the lower triangularity; $R_0$ is the major-radius coordinate
    of the geometric center; $R_l$ is the major-radius coordinate of the lower vertical
    extremum; and $a$ is the minor radius of the plasma boundary. These coordinates
    are defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    This quantity applies only to the lower extremum of the plasma boundary and represents
    one term in the boundary-shaping description. It is not the upper contribution
    or an average over both extrema; the corresponding upper contribution is [upper
    triangularity](name:upper_triangularity_of_plasma_boundary).


    The parent [triangularity of the plasma boundary](name:triangularity_of_plasma_boundary)
    is the arithmetic mean of the upper and lower contributions: $\delta=(\delta_u+\delta_l)/2$,
    where $\delta$ is the parent triangularity and $\delta_u$ is the upper triangularity.


    Sign convention: Positive when the lower extremum is displaced inward, toward
    decreasing major radius $R$, relative to the geometric center.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  arguments:
  - name: triangularity_of_plasma_boundary
    operator: lower
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/boundary/triangularity_lower
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-triangularity_lower
    dd_documentation:
      leaf: Lower triangularity of the plasma boundary
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Lower triangularity (\u03B4_lower) of the plasma boundary, describing\
        \ the asymmetric shaping of the lower half of the plasma cross-section. A\
        \ key plasma shape parameter for MHD stability and confinement optimization."
      kind: llm
  - dd_path: summary/boundary/triangularity_lower/value
    dd_version: 4.1.0
