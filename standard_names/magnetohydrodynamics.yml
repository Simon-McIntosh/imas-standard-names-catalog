- name: effective_charge
  kind: scalar
  status: draft
  description: Effective ionic charge Z_eff of the plasma, equal to the density-weighted
    mean-squared ion charge normalized to electron density, governing resistivity,
    bremsstrahlung emission, and neoclassical transport coefficients.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the net ionic\
    \ charge state of the full plasma mixture, replacing the multi-species ion distribution\
    \ with a single equivalent charge that reproduces the electron\u2013ion collision\
    \ frequency. It is dimensionless and always at least unity for any quasi-neutral\
    \ plasma, with values exceeding 1 indicating the presence of impurity species.\n\
    \nThe defining relation is:\n\n$$\nZ_\\text{eff} = \\frac{\\sum_i n_i Z_i^2}{n_e}\n\
    $$\n\nwhere $n_i$ is the number density of ion species $i$, $Z_i$ is the charge\
    \ number of species $i$, and $n_e = \\sum_i n_i Z_i$ is the electron density obtained\
    \ from quasi-neutrality. For a pure hydrogen plasma $Z_\\text{eff} = 1$; high-$Z$\
    \ impurities drive it substantially above unity.\n\n$Z_\\text{eff}$ enters the\
    \ Spitzer resistivity $\\eta \\propto Z_\\text{eff} \\ln\\Lambda / T_e^{3/2}$,\
    \ the bremsstrahlung radiation power $P_\\text{brem} \\propto n_e^2 Z_\\text{eff}\
    \ T_e^{1/2}$, and neoclassical transport coefficients. It is most commonly inferred\
    \ from visible or near-infrared bremsstrahlung continuum emissivity, which scales\
    \ as $n_e^2 Z_\\text{eff}$, or estimated from resistive flux consumption during\
    \ the ohmic heating phase.\n\nTypical values range from 1 in clean hydrogen plasmas\
    \ to 2\u20135 in H-mode discharges with moderate impurity seeding, and can exceed\
    \ 5 near the plasma edge in impurity-rich regimes. The [line-averaged effective\
    \ charge](name:line_averaged_effective_charge) is obtained from a spectroscopic\
    \ chord integral, while the [volume-averaged effective charge](name:volume_averaged_effective_charge)\
    \ provides a single global impurity metric; radial profiles capture the local\
    \ $Z_\\text{eff}$ variation across the plasma.\n\nSign convention: Positive for\
    \ all physically realizable plasmas, since $Z_\\text{eff} \\geq 1$ follows from\
    \ quasi-neutrality and the positivity of all ion charge-state densities."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
