name: electron_particle_flux
status: draft
description: Net number of electrons transported per unit area per unit time, combining
  diffusive, convective, and turbulent contributions.
documentation: "The electron particle flux $\\Gamma_e$ (in m$^{-2}$ s$^{-1}$) quantifies\
  \ the rate at which electrons cross a unit area in the plasma. In the fluid picture\
  \ it decomposes as $\\Gamma_e = n_e v_e = -D_e \\nabla n_e + n_e V_{\\mathrm{conv}}$,\
  \ where $n_e$ is the electron number density (m$^{-3}$), $D_e$ is the electron particle\
  \ diffusivity (m$^2$ s$^{-1}$), and $V_{\\mathrm{conv}}$ is the convective (pinch)\
  \ velocity (m s$^{-1}$). This quantity is a primary output of edge and core transport\
  \ codes (SOLPS-ITER, SOLEDGE, UEDGE, JINTRAC) evaluated on generalized grids and\
  \ is essential for particle balance analysis and fueling studies. Typical radial\
  \ values in the scrape-off layer of medium-size tokamaks are $10^{19}$\u2013$10^{21}$\
  \ m$^{-2}$ s$^{-1}$, increasing toward the divertor targets; in the core, $\\Gamma_e$\
  \ is generally lower and can reverse sign due to the Ware or turbulent pinch. Experimentally,\
  \ $\\Gamma_e$ can be inferred from Langmuir probe measurements of $n_e$ and Mach\
  \ number, or from interferometry-constrained transport modeling. In steady state\
  \ the divergence of $\\Gamma_e$ must balance ionization sources and recombination\
  \ sinks: $\\nabla \\cdot \\Gamma_e = S_{\\mathrm{ion}} - S_{\\mathrm{rec}}$. See\
  \ `electron_energy_flux` for the energy transport analog and `electron_particle_radial_diffusivity`\
  \ for the diffusive transport coefficient."
validity_domain: ''
