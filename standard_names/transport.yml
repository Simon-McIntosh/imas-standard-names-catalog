    dd_path: edge_transport/model/ggd/electrons/energy/flux_parallel/values
    status: composed
  - id: dd:plasma_transport/model/ggd/electrons/energy/flux_parallel/values
    dd_path: plasma_transport/model/ggd/electrons/energy/flux_parallel/values
    status: composed
- name: parallel_fast_neutral_state_pressure
  kind: scalar
  status: draft
  description: Parallel component of the kinetic pressure tensor for fast (suprathermal)
    neutral particles in a specified internal quantum or excitation state, directed
    along the local magnetic field.
  documentation: "The parallel fast neutral state pressure is the field-aligned component\
    \ of the kinetic pressure tensor for suprathermal neutral particles occupying\
    \ a resolved internal quantum or excitation state $s$. It captures the anisotropic\
    \ pressure that fast neutrals \u2014 particles whose energy significantly exceeds\
    \ the local thermal equilibrium \u2014 exert along the magnetic field direction\
    \ $\\hat{b}$, and is the state-resolved counterpart of [parallel_fast_neutral_pressure](name:parallel_fast_neutral_pressure).\n\
    \nThe quantity is defined as the second central velocity moment of the state-resolved\
    \ fast-neutral distribution function $f_{\\mathrm{fast},s}(\\mathbf{v})$ projected\
    \ onto the magnetic field unit vector $\\hat{b}$:\n\n$$\nP_{\\parallel,\\mathrm{fast},s}\
    \ = m_n \\int \\left(v_\\parallel - u_{\\parallel,s}\\right)^2 f_{\\mathrm{fast},s}(\\\
    mathbf{v}) \\, d^3v\n$$\n\nwhere $m_n$ is the neutral particle mass, $v_\\parallel\
    \ = \\mathbf{v} \\cdot \\hat{b}$ is the velocity component along the local field\
    \ direction, and $u_{\\parallel,s}$ is the mean parallel flow speed of neutrals\
    \ in state $s$.\n\nThis quantity arises primarily in edge plasma and scrape-off\
    \ layer modeling, where charge exchange and recycling processes generate suprathermal\
    \ neutrals with inherently anisotropic velocity distributions. Resolving by internal\
    \ state allows neutral transport models to track pressure contributions from distinct\
    \ excitation or ionization levels separately. The perpendicular counterpart is\
    \ [perpendicular_fast_neutral_state_pressure](name:perpendicular_fast_neutral_state_pressure);\
    \ combining the two components via $P = (P_\\parallel + 2P_\\perp)/3$ yields the\
    \ scalar isotropic fast neutral state pressure.\n\nSign convention: Positive when\
    \ fast neutral particles in state $s$ carry a non-zero parallel velocity spread\
    \ about their mean flow along the local magnetic field direction $\\hat{b}$."
  unit: Pa
  physics_domain: transport
  links:
  - name:parallel_fast_neutral_pressure
  - name:perpendicular_fast_neutral_state_pressure
