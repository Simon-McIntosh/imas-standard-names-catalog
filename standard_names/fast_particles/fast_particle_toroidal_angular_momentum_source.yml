name: fast_particle_toroidal_angular_momentum_source
status: draft
description: Total volumetric source rate of toroidal angular momentum density from
  all fast-particle contributions summed over orbit classes.
documentation: "The fast-particle toroidal angular momentum source $S_{L_\\phi}^{\\\
  rm fp}$ (in N/m\xB2) is the sum of all mechanisms by which fast particles inject\
  \ toroidal angular momentum into the plasma per unit volume: collisional drag, $\\\
  mathbf{j} \\times \\mathbf{B}$ torque from radial currents, and any residual stress\
  \ or orbit-loss channels. It is related to the toroidal torque density by $S_{L_\\\
  phi}^{\\rm fp} = R\\, f_\\phi^{\\rm fp}$, where $R$ is the major radius (in m) and\
  \ $f_\\phi^{\\rm fp}$ the toroidal force density (in N/m\xB3). This source enters\
  \ the toroidal angular momentum balance of the thermal plasma and is the primary\
  \ driver of intrinsic and driven rotation in beam- or alpha-heated discharges. In\
  \ tangential NBI-heated H-mode plasmas, peak values are of order $10^{-1}$\u2013\
  $10^{0}$ N/m\xB2 in the core. Computed by fast-ion orbit codes (NUBEAM, ASCOT, TRANSP).\
  \ See also the orbit-resolved components `co_passing_fast_particle_toroidal_angular_momentum_source`\
  \ and `counter_passing_fast_particle_toroidal_angular_momentum_source`, and the\
  \ $\\mathbf{j} \\times \\mathbf{B}$ channel `fast_particle_toroidal_torque_density_due_to_j_cross_b_force`."
