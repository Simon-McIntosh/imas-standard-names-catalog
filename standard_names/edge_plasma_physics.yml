- name: particle_diffusivity
  kind: vector
  status: active
  description: Effective particle diffusivity of a generic particle population, whose
    directional components relate the diffusive particle flux to the local number-density
    gradient along flux-coordinate directions.
  documentation: "Particle diffusivity is the transport coefficient quantifying how\
    \ readily particles spread in response to number-density gradients in a magnetized\
    \ plasma. In the anisotropic geometry of a toroidal device, the diffusivity is\
    \ resolved into components along the flux-coordinate directions $(\\rho, \\theta,\
    \ \\phi)$, where $\\rho$ is a radial flux-surface label, $\\theta$ is the poloidal\
    \ angle, and $\\phi$ is the toroidal angle.\n\nThe component diffusivity $D_i$\
    \ along coordinate direction $x^i$ enters the diffusive particle flux via:\n\n\
    $$\n\\Gamma_i = -D_i \\, g^{ii} \\frac{\\partial n}{\\partial x^i}\n$$\n\nwhere\
    \ $\\Gamma_i$ is the local particle flux along $x^i$, $g^{ii}$ is the contravariant\
    \ metric element for that direction, and $n$ is the number density.\n\nThese coefficients\
    \ are inferred in edge transport modeling by fitting experimental profiles \u2014\
    \ measured by Thomson scattering, reflectometry, or interferometry \u2014 against\
    \ solutions of the particle continuity equation with the diffusive flux parametrized\
    \ as above. Effective particle diffusivities in the tokamak edge span roughly\
    \ 0.1\u201310 m$^2$ s$^{-1}$, with anomalous turbulence-driven values dominating\
    \ over neoclassical estimates in most regimes. The [poloidal_particle_diffusivity](name:poloidal_particle_diffusivity)\
    \ is the primary attested directional component, resolved along $\\hat{\\theta}$;\
    \ related transport coefficients include [neutral_diffusivity](name:neutral_diffusivity)\
    \ for neutral particle transport and [ion_charge_state_diffusivity](name:ion_charge_state_diffusivity)\
    \ for charge-state-resolved ion populations."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_particle_diffusivity
  - name:neutral_diffusivity
  - name:ion_charge_state_diffusivity
- name: poloidal_flux_surface_averaged_electron_beta_at_pedestal_top
  kind: scalar
  status: active
  description: Poloidal flux-surface-averaged electron beta at the pedestal top is
    the dimensionless ratio of flux-surface-averaged electron kinetic pressure to
    the magnetic pressure associated with the flux-surface-averaged poloidal magnetic
    field, evaluated at the fitted core-side shoulder of the H-mode edge transport
    barrier.
  documentation: 'Poloidal flux-surface-averaged electron beta at the pedestal top
    is the electron contribution to poloidal beta on the flux surface at the fitted
    core-side shoulder of the H-mode edge transport barrier. It compares the flux-surface-averaged
    electron kinetic pressure with the magnetic pressure formed from the flux-surface-averaged
    magnitude of the poloidal magnetic field on the same surface.


    The defining relation is:


    $$

    \beta_{p,e}^{\mathrm{fs}}(\psi_{\mathrm{top}}) = \frac{2\mu_0\,\langle p_e\rangle_{\psi_{\mathrm{top}}}}{\left(\langle
    |B_p|\rangle_{\psi_{\mathrm{top}}}\right)^2}

    $$


    where $\psi_{\mathrm{top}}$ is the poloidal magnetic flux coordinate labeling
    the pedestal-top flux surface, $\langle\cdot\rangle_{\psi_{\mathrm{top}}}$ denotes
    a flux-surface average on that surface using the normalized measure $dS/|\nabla\psi|$,
    $p_e$ is the electron kinetic pressure in pascals, $|B_p|$ is the magnitude of
    the poloidal magnetic field in tesla, and $\mu_0$ is the magnetic permeability
    of free space in henries per meter. The denominator uses the square of the averaged
    field magnitude, not the flux-surface average of $B_p^2$.


    The pressure term is the pedestal-top electron kinetic pressure represented by
    [electron_pressure_at_pedestal_top](name:electron_pressure_at_pedestal_top), with
    averaging over the same pedestal-top flux surface. Ion pressure and total thermal
    pressure contributions are excluded. The flux-surface-averaged denominator distinguishes
    this quantity from [poloidal_electron_beta_at_pedestal_top_low_field_side](name:poloidal_electron_beta_at_pedestal_top_low_field_side)
    and [poloidal_electron_beta_at_pedestal_top_high_field_side](name:poloidal_electron_beta_at_pedestal_top_high_field_side),
    which use local poloidal-field values at specified poloidal locations, and from
    [poloidal_electron_beta_at_pedestal_top](name:poloidal_electron_beta_at_pedestal_top_high_field_side),
    which does not specify flux-surface averaging of the poloidal field.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_pedestal_top
  sources:
  - dd_path: summary/pedestal_fits/linear/beta_pol_pedestal_top_electron_average/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-linear-beta_pol_pedestal_top_electron_average-value
