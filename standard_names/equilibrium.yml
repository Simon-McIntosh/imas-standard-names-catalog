- name: radial_coordinate_of_x_point
  kind: scalar
  status: active
  description: Major-radius coordinate locating the main X-point, the poloidal magnetic-field
    null that defines the separatrix in an equilibrium.
  documentation: 'The major-radius coordinate of the main X-point is the perpendicular
    distance from the toroidal symmetry axis to the poloidal magnetic-field null that
    defines the separatrix. It identifies the radial location of this specific equilibrium
    feature in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The coordinate is defined geometrically by


    $$

    R_{\mathrm{X}} = \sqrt{x_{\mathrm{X}}^2 + y_{\mathrm{X}}^2}

    $$


    where $R_{\mathrm{X}}$ is the major-radius coordinate of the main X-point, and
    $x_{\mathrm{X}}$ and $y_{\mathrm{X}}$ are its horizontal Cartesian coordinates
    in the right-handed $(\hat{x}, \hat{y}, \hat{z})$ basis, with $\hat{z}$ aligned
    with the vertical direction $\hat{Z}$. The subscript $\mathrm{X}$ identifies the
    main X-point.


    This quantity applies specifically to the main X-point and represents one coordinate
    of that point rather than its complete position. It is a single geometric value,
    not an average, integral, or sum over a flux surface or region; it excludes coordinates
    of secondary X-points and other equilibrium features.


    It is a locus-specific specialization of the [radial coordinate](name:radial_coordinate),
    which assigns the same major-radius concept to arbitrary geometric positions.
    The X-point condition distinguishes it from the [radial coordinate of the magnetic
    axis](name:radial_coordinate_of_magnetic_axis), which locates the poloidal-field
    O-point rather than the separatrix-defining null.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_magnetic_axis
  sources:
  - dd_path: equilibrium/time_slice/constraints/x_point/position_measured/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-x_point-position_measured-r
    dd_documentation:
      leaf: Major radius
      parent_path: equilibrium/time_slice/constraints/x_point/position_measured
      parent: Measured or estimated position
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of position measured.
      kind: template
