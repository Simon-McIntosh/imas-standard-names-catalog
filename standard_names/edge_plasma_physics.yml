- name: toroidal_deuterium_tritium_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Toroidal component of the bulk flow velocity assigned to the effective\
    \ deuterium\u2013tritium fuel species at the core-side shoulder of the H-mode\
    \ edge pedestal."
  documentation: "The quantity is the bulk-flow velocity of deuterium and tritium\
    \ treated as one effective fuel species, evaluated at the core-side shoulder of\
    \ the H-mode edge transport barrier. It is distinct from the velocity of deuterium\
    \ alone, such as [toroidal deuterium velocity at the pedestal top](name:toroidal_deuterium_velocity_at_pedestal_top).\n\
    \nThe effective toroidal velocity is the mass-density-weighted mean of the isotope\
    \ flow components:\n\n$$\nv_{\\mathrm{DT},\\phi} = \\frac{m_D n_D v_{D,\\phi}\
    \ + m_T n_T v_{T,\\phi}}{m_D n_D + m_T n_T}\n$$\n\nwhere $m_D$ and $m_T$ are the\
    \ deuterium and tritium masses in kg, $n_D$ and $n_T$ are their number densities\
    \ in m$^{-3}$, and $v_{D,\\phi}$ and $v_{T,\\phi}$ are their toroidal velocity\
    \ components in m.s$^{-1}$. The effective species uses the deuterium\u2013tritium\
    \ fuel convention with mean atomic mass 2.5; this local quantity is not a flux-surface\
    \ average or a value at the plasma boundary, such as [toroidal deuterium\u2013\
    tritium velocity at the plasma boundary](name:toroidal_deuterium_tritium_velocity_at_plasma_boundary).\n\
    \nSign convention: Positive when the velocity points in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
