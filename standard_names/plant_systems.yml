- name: accumulated_total_particle_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Accumulated total particle count due to gas injection is the cumulative
    equivalent-electron inventory of neutral gas introduced by gas injection over
    the prefill interval or since plasma breakdown, summed over all species as a vessel-wide
    total.
  documentation: 'Accumulated total particle count due to gas injection is the vessel-wide
    cumulative inventory of neutral gas introduced by gas injection over a defined
    accumulation window, summed over all injected species using the equivalent-electron
    convention. Post-breakdown accumulation starts at plasma breakdown, while prefill
    accumulation covers gas introduced before plasma breakdown. It counts the electrons
    that the injected neutral particles would contribute if fully ionized, rather
    than the unweighted number of neutral atoms or molecules.


    The accumulated count over an interval beginning at $t_0$ is defined by the species-weighted
    time integral of the injection rates:


    $$

    N_\mathrm{eq}(t;t_0)=\sum_s z_s^\mathrm{eq} N_s(t;t_0)=\sum_s z_s^\mathrm{eq}\int_{t_0}^{t}\Gamma_s(t'')\,dt''

    $$


    where $N_\mathrm{eq}$ is the dimensionless total equivalent-electron count, $s$
    indexes all injected neutral species, $z_s^\mathrm{eq}$ is the dimensionless number
    of bound electrons in one neutral injected particle of species $s$ when fully
    ionized, $N_s$ is the dimensionless accumulated injected-particle count for species
    $s$, $\Gamma_s$ is the injection rate of species $s$ with dimensions of count
    per time, $t''$ is integration time, and $t$ is the evaluation time. For post-breakdown
    accumulation, $t_0$ is the plasma-breakdown time; for prefill accumulation, $t_0$
    is the start of the prefill interval and $t$ is no later than plasma breakdown.


    This quantity is a vessel-wide total over injection locations and species. It
    excludes gas not introduced by gas injection and excludes location-resolved partial
    sums unless those partial sums are explicitly combined over a complete injector
    partition. Species-resolved accumulated counts, such as [accumulated neon count](name:accumulated_neon_count)
    and [accumulated carbon count due to gas injection](name:accumulated_carbon_count_due_to_gas_injection),
    are contributions to the sum over $s$ before forming the total.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_total_gas_count_at_midplane_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_accumulated/total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-total-value
    dd_documentation:
