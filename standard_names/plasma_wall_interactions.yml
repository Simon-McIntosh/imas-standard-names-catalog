  - dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/ion/state/incident/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-energy_fluxes-recombination-ion-state-incident-values
