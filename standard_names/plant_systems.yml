- name: helium_4_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of helium-4 atoms delivered by
    gas injection, expressed as an equivalent-electron count weighted by the helium-4
    atomic number. This name fixes the species and its equivalent-electron weighting;
    temporal specializations select how the running total is reported in time.
  documentation: "This quantity is the cumulative inventory of helium-4 atoms delivered\
    \ by gas injection after plasma breakdown, expressed using equivalent-electron\
    \ count units. Material introduced during the prefill phase is excluded.\n\nFor\
    \ helium-4, the equivalent-electron count is defined by\n\n$$\nN_{\\mathrm{eq},{}^4\\\
    mathrm{He}}(t) = 2\\,N_{{}^4\\mathrm{He}}(t)\n$$\n\nwhere $N_{\\mathrm{eq},{}^4\\\
    mathrm{He}}$ and $N_{{}^4\\mathrm{He}}$ are dimensionless cumulative counts and\
    \ the factor 2 is the atomic number of helium. The count increases by two for\
    \ every delivered atom and represents an atomic inventory, not an instantaneous\
    \ injection rate and not an ionization-state population. Both helium isotopes\
    \ share the same atomic-number weighting; this name is distinguished from a helium-3\
    \ counterpart by the delivered isotope, not by the weighting factor.\n\nWithin\
    \ the broader [count due to gas injection](name:count_due_to_gas_injection) convention,\
    \ this name fixes only the species and its equivalent-electron weighting; it does\
    \ not prescribe how the running total is reported in time. Temporal specializations\
    \ such as [accumulated helium-4 count due to gas injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ select a specific reporting of that total \u2014 the time-integrated inventory\
    \ from breakdown to the evaluation time \u2014 while inheriting the weighting\
    \ and post-breakdown gas-injection scope defined here."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_due_to_gas_injection
  - name:accumulated_helium_4_count_due_to_gas_injection
  arguments:
  - name: count_due_to_gas_injection
    operator: helium_4
    operator_kind: qualifier
- name: accumulated_helium_4_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Time-integrated equivalent-electron inventory of helium-4 atoms delivered
    by gas injection after plasma breakdown, using atomic number Z = 2 so each atom
    contributes two equivalent electrons. It is an accumulated inventory, not an instantaneous
    injection rate.
  documentation: 'Time-integrated equivalent-electron inventory of helium-4 atoms
    delivered by gas injection after plasma breakdown is the cumulative amount of
    helium-4 added through gas-injection fueling, counted with atomic number $Z=2$
    so each atom contributes two equivalent electrons. The accumulation starts at
    plasma breakdown and includes only helium-4 gas injected after that time.


    The accumulated equivalent-electron count is defined from the equivalent-electron
    injection rate, or equivalently from the neutral helium-4 atom injection rate:


    $$

    N_{\mathrm{He4,eq}}(t) = \int_{t_0}^{t} \dot{N}_{\mathrm{He4,eq}}(t'')\,dt'' =
    2\int_{t_0}^{t} \dot{N}_{\mathrm{He4,atom}}(t'')\,dt''

    $$


    where $N_{\mathrm{He4,eq}}$ is the accumulated equivalent-electron count (dimensionless),
    $t$ and $t_0$ are times in seconds, $t_0$ is the plasma-breakdown time, $\dot{N}_{\mathrm{He4,eq}}$
    is the equivalent-electron gas-injection rate in $\mathrm{s}^{-1}$, and $\dot{N}_{\mathrm{He4,atom}}$
    is the corresponding neutral helium-4 atom injection rate in $\mathrm{s}^{-1}$.
    The factor of 2 is the helium atomic number and must not be applied again when
    the integrated rate is already expressed as an equivalent-electron rate.


    This quantity is distinct from an instantaneous [helium-4 source rate due to gas
    injection](name:helium_4_source_rate_due_to_gas_injection). It has the same post-breakdown
    equivalent-electron counting convention as [helium-4 count due to gas injection](name:helium_4_count_due_to_gas_injection);
    the explicit accumulated name denotes the time integral over the gas-injection
    history rather than a rate or an atomic-particle count.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:helium_4_source_rate_due_to_gas_injection
  - name:helium_4_count_due_to_gas_injection
  arguments:
  - name: helium_4_count_due_to_gas_injection
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/helium_4/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-helium_4-value
    dd_documentation:
