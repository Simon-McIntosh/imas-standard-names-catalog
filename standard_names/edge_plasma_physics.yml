- name: normalized_electron_collisionality_at_pedestal_top
  kind: scalar
  status: active
  description: Normalized electron collisionality at the pedestal top is the local
    electron-ion collision frequency divided by the trapped-electron bounce frequency,
    evaluated at the fitted core-side shoulder of the H-mode edge transport barrier.
  documentation: 'Normalized electron collisionality at the pedestal top is the local
    electron-ion collision frequency divided by the characteristic trapped-electron
    bounce frequency, evaluated at the fitted core-side shoulder of the H-mode edge
    transport barrier. It quantifies the relative importance of collisional detrapping
    and trapped-electron bounce motion on the pedestal-top flux surface.


    The pedestal-top value is defined by the trapped-electron neoclassical normalization:


    $$

    \nu^*_{e,\mathrm{ped}} = \frac{q_{\mathrm{ped}} R_{\mathrm{ped}} \, \nu_{ei,\mathrm{ped}}}{v_{\mathrm{th},e,\mathrm{ped}}
    \, \epsilon_{\mathrm{ped}}^{3/2}}

    $$


    where $q_{\mathrm{ped}}$ is the dimensionless safety factor of the pedestal-top
    flux surface, $R_{\mathrm{ped}}$ is its major radius in m measured from the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame, $\nu_{ei,\mathrm{ped}}$
    is the local electron-ion collision frequency in s$^{-1}$, $v_{\mathrm{th},e,\mathrm{ped}}
    = \sqrt{2 T_e / m_e}$ is the electron thermal speed in m/s with $T_e$ the local
    electron temperature expressed as an energy in J and $m_e$ the electron mass in
    kg, and $\epsilon_{\mathrm{ped}} = r_{\mathrm{ped}} / R_{\mathrm{ped}}$ is the
    local inverse aspect ratio, with $r_{\mathrm{ped}}$ the minor radius of the pedestal-top
    flux surface in m. The denominator $v_{\mathrm{th},e}\,\epsilon^{3/2}/(qR)$ is
    the effective trapped-electron bounce frequency, so values well below unity indicate
    that trapped electrons complete many banana orbits between collisions.


    This name denotes the same dimensionless collision-to-bounce-frequency ratio as
    [electron_collisionality_at_pedestal_top](name:electron_collisionality_at_pedestal_top);
    the two are equivalent quantities, this entry merely carrying the normalization
    explicitly in its name rather than designating a physically distinct measure.
    It is the pedestal-top evaluation of the local quantity [electron_collisionality](name:electron_collisionality).
    It is not the unnormalized electron-ion collision frequency $\nu_{ei}$.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_collisionality_at_pedestal_top
  arguments:
  - name: electron_collisionality_at_pedestal_top
    operator: normalized
    operator_kind: qualifier
  sources:
  - dd_path: summary/pedestal_fits/mtanh/nustar_pedestal_top_electron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-mtanh-nustar_pedestal_top_electron-value
    dd_documentation:
      leaf: Value
      parent_path: summary/pedestal_fits/mtanh/nustar_pedestal_top_electron
      parent: Normalised collisionality at pressure pedestal top for electrons
      data_type: FLT_1D
      unit: '1'
