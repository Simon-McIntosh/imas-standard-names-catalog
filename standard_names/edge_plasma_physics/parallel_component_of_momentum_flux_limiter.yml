name: parallel_component_of_momentum_flux_limiter
description: Dimensionless limiter coefficient that caps the parallel component of
  the ion momentum flux to avoid exceeding the free-streaming limit.
documentation: The parallel momentum flux limiter $\alpha_{\parallel}^{(m)}$ is a
  dimensionless parameter ($0 < \alpha_{\parallel}^{(m)} \le 1$) applied to the parallel
  contribution to the ion momentum flux, $\Gamma_{m,\parallel}^{\mathrm{lim}} = \alpha_{\parallel}^{(m)}
  \, \Gamma_{m,\parallel}^{\mathrm{free}}$. It prevents the collisional fluid expression
  from exceeding the kinetic free-streaming limit in regions of long mean-free path,
  such as the far scrape-off layer and divertor legs. A value of 1 means no limiting,
  while values approaching 0 severely restrict parallel momentum transport. This coefficient
  is a standard tuning parameter in edge fluid codes (SOLPS-ITER, SOLEDGE2D, UEDGE)
  and is specified per grid element. See also `diamagnetic_component_of_ion_momentum_flux_limiter`
  and `toroidal_component_of_momentum_flux_limiter` for sibling flux limiter components.
