    enhanced_context:
      description: "Imaginary part of the toroidal component (coordinate 3) of the\
        \ perturbed velocity eigenvector (\u1E7D) in the confined plasma, from linear\
        \ MHD stability analysis for a given toroidal mode number."
      kind: llm
- name: toroidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: active
  description: "Toroidal perturbed plasma velocity real part is the real part of the\
    \ complex amplitude of the toroidal component of the first-order plasma velocity\
    \ perturbation for a single toroidal Fourier harmonic with mode number n in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame. It is the in-phase eigenfunction\
    \ component relative to the chosen complex phase, not the equilibrium toroidal\
    \ flow."
  documentation: 'Toroidal perturbed plasma velocity real part is the real part of
    the complex amplitude of the toroidal component of the first-order plasma velocity
    perturbation for a single toroidal Fourier harmonic with mode number $n$. The
    toroidal component is the projection along $\hat{\boldsymbol{\phi}}$, the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It represents
    the in-phase part of the linear magnetohydrodynamic perturbation eigenfunction
    relative to the chosen complex phase, not the equilibrium toroidal flow.


    The component is defined by projecting the complex velocity eigenfunction for
    the selected harmonic onto the toroidal basis direction and taking the real part:


    $$

    v_{\phi,\mathrm{Re},n}(R,Z) = \operatorname{Re}\!\left[\widetilde{\mathbf v}_n(R,Z)\cdot\hat{\boldsymbol{\phi}}\right]

    $$


    where $v_{\phi,\mathrm{Re},n}$ is this quantity, $\widetilde{\mathbf v}_n$ is
    the complex first-order plasma velocity eigenfunction for toroidal mode number
    $n$, $\hat{\boldsymbol{\phi}}$ is the toroidal unit vector, and $\operatorname{Re}$
    denotes the real part. With toroidal dependence proportional to $\exp(i n\phi)$,
    $i$ is the imaginary unit.


    Together with [toroidal perturbed plasma velocity imaginary part](name:toroidal_perturbed_plasma_velocity_imaginary_part),
    this quantity forms the complex toroidal perturbed velocity amplitude. Because
    a linear eigenfunction may be multiplied by an arbitrary complex constant, the
    division into real and imaginary parts depends on the selected normalization and
    phase; the quadrature component is the linked imaginary part, not a separate physical
    velocity direction.


    Sign convention: Positive when the real toroidal velocity component points in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-velocity_perturbed-coordinate3-real
    dd_documentation:
      leaf: Real part
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3
      parent: Third coordinate (toroidal)
      data_type: FLT_2D
      unit: m.s^-1
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim2
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
    enhanced_context:
      description: "Real part of the toroidal (coordinate 3) component of the perturbed\
        \ plasma velocity eigenvector (\u1E7D) from linear MHD stability analysis.\
        \ Part of the complex velocity perturbation field associated with a given\
        \ toroidal MHD mode."
      kind: llm
- name: toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: active
  description: Imaginary part of the complex toroidal component of the first-order
    magnetic-field perturbation eigenfunction in the current-free vacuum region, for
    a specified toroidal mode number in linear MHD stability analysis.
  documentation: "In linear MHD stability analysis for a specified toroidal mode number\
    \ $n$, the first-order magnetic-field perturbation $\\delta\\mathbf{B}$ in the\
    \ current-free vacuum region surrounding the plasma is a complex eigenfunction\
    \ satisfying $\\nabla \\times \\delta\\mathbf{B} = 0$ and $\\nabla \\cdot \\delta\\\
    mathbf{B} = 0$. This name gives the imaginary part of the toroidal projection\
    \ of that eigenfunction:\n\n$$\n\\delta B_\\phi^\\mathrm{vac} = \\delta\\mathbf{B}^\\\
    mathrm{vac} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\hat{\\phi}$ is the unit vector\
    \ in the direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, so that $\\delta B_\\phi^\\mathrm{vac} = \\mathrm{Re}(\\\
    delta B_\\phi^\\mathrm{vac}) + i\\,\\mathrm{Im}(\\delta B_\\phi^\\mathrm{vac})$.\n\
    \nThe real part is given by [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part),\
    \ and together they constitute the parent complex eigenfunction [toroidal_perturbed_vacuum_magnetic_field](name:toroidal_perturbed_vacuum_magnetic_field).\
    \ Boundary conditions at the plasma\u2013vacuum interface link this vacuum eigenfunction\
    \ to the corresponding plasma-region toroidal component [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part);\
    \ the radial vacuum counterpart is [radial_perturbed_vacuum_magnetic_field_imaginary_part](name:radial_perturbed_vacuum_magnetic_field_imaginary_part).\
    \ Absolute eigenfunction amplitudes are normalization-convention-dependent in\
    \ linear stability calculations.\n\nSign convention: Positive when $\\mathrm{Im}(\\\
    delta B_\\phi^\\mathrm{vac})$ is directed in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: T
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate3/imaginary
