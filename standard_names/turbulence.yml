- name: parallel_normalized_perturbed_vector_potential_amplitude
  kind: scalar
  status: draft
  description: Modulus of the complex normalized perturbed parallel vector potential
    eigenfunction for a gyrokinetic mode. It quantifies the dimensionless electromagnetic
    fluctuation amplitude associated with field-aligned current and magnetic flutter.
  documentation: 'Parallel normalized perturbed vector potential amplitude is the
    non-negative modulus of the complex dimensionless perturbation $\delta \tilde{A}_\parallel$,
    where the parallel component is taken along the local equilibrium magnetic field.
    It characterizes the electromagnetic part of a gyrokinetic fluctuation and vanishes
    for a purely electrostatic perturbation.


    For a complex normalized eigenfunction $\delta \tilde{A}_\parallel = \delta A_\parallel/A_\mathrm{ref}$,
    the amplitude is defined by:


    $$

    |\delta \tilde{A}_\parallel| = \left|\frac{\delta A_\parallel}{A_\mathrm{ref}}\right|
    = \sqrt{\left(\Re\,\delta \tilde{A}_\parallel\right)^2 + \left(\Im\,\delta \tilde{A}_\parallel\right)^2}

    $$


    where $\delta A_\parallel$ is the physical perturbed parallel vector potential
    with units of T m, $A_\mathrm{ref}$ is the reference vector-potential scale with
    the same units, and $\delta \tilde{A}_\parallel$ is dimensionless. The exact reference
    scale is set by the gyrokinetic normalization; common choices include a magnetic
    scale such as $\rho_\mathrm{ref} B_\mathrm{ref}$, with $\rho_\mathrm{ref}$ in
    meters and $B_\mathrm{ref}$ in tesla, or an equivalent potential-based scale specified
    by the chosen nondimensionalization.


    In gyrokinetic modeling, $\delta A_\parallel$ is computed from the electromagnetic
    field solve and is constrained by parallel Ampere''s law. In Fourier representation,
    this relates $k_\perp^2 \delta A_\parallel$ to the perturbed parallel-current
    moment, for example $\mu_0 \sum_s q_s \int v_\parallel g_s\,d^3v$, where $k_\perp$
    is the perpendicular wavenumber in m^-1, $q_s$ is species charge, $v_\parallel$
    is parallel velocity, and $g_s$ is the non-adiabatic distribution perturbation.
    For linear eigenmodes the overall complex scale may be arbitrary, so this amplitude
    is most meaningful together with the stated eigenmode normalization, relative
    variation, or ratios to other fluctuating fields.


    Typical dimensionless amplitudes are strongly normalization dependent. With equilibrium-scale
    normalizations, electrostatic drift-wave cases are often near 0, weakly electromagnetic
    microturbulence commonly gives about 1e-6-1e-3, and kinetic-ballooning or shear-Alfvenic
    cases can reach 1e-3-1; eigenfunctions rescaled to unit maximum can have peak
    amplitude of order 1 by construction.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential_real_part
  - name:parallel_normalized_perturbed_magnetic_field_amplitude
