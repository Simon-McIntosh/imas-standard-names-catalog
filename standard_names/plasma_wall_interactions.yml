      kind: template
- name: beryllium_density_at_limiter
  kind: scalar
  status: active
  description: Beryllium ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all beryllium ionization states
    from Be1+ through Be4+.
  documentation: 'Beryllium density at a limiter is the local number density of beryllium
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is the plasma side of the magnetic presheath or sheath entrance,
    where open scrape-off-layer field lines terminate on the material surface. Unless
    a specific ionization stage is resolved, this quantity is summed over all charged
    beryllium states; neutral beryllium atoms are excluded.


    The charge-state-summed density is defined as:


    $$

    n_\mathrm{Be} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}

    $$


    where $n_{\mathrm{Be}^{z+}}$ is the number density of beryllium ions in ionization
    state $z$, spanning all four stages accessible under edge-plasma conditions.


    Beryllium is used as a plasma-facing material in several tokamak devices; sputtering
    of beryllium limiter surfaces introduces impurity ions into the scrape-off layer,
    where they contribute to fuel dilution and raise the effective charge $Z_\mathrm{eff}$.
    This limiter-edge density sets the impurity source boundary condition in edge
    transport models and is inferred from spectroscopic line-emission measurements
    of beryllium charge states combined with sheath or presheath models, or computed
    self-consistently in coupled plasma-fluid and impurity-continuity solvers.


    This quantity is the limiter-surface analog of [beryllium_density_at_plasma_boundary](name:flux_surface_averaged_beryllium_density_at_plasma_boundary)
    at the last-closed flux surface and of [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target)
    at the divertor target. The parent [density_at_limiter](name:density_at_limiter)
    defines the evaluation locus shared by all species-resolved limiter density quantities,
    including the fuel-ion member [deuterium_density_at_limiter](name:deuterium_density_at_limiter).
    The volumetric profile away from the limiter is given by [beryllium_density](name:beryllium_density).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_surface_averaged_beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_divertor_target
  - name:density_at_limiter
  - name:deuterium_density_at_limiter
  - name:beryllium_density
  arguments:
  - name: density_at_limiter
    operator: beryllium
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/n_i/beryllium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-limiter-n_i-beryllium-value
    dd_documentation:
      leaf: Value
