- name: reflected_power_of_lower_hybrid_antenna
  kind: scalar
  status: active
  description: Reflected power of a lower-hybrid antenna is the nonnegative RF power
    returning from the antenna input reference plane toward the transmission line
    because of incomplete coupling to the plasma load.
  documentation: 'Reflected power of a lower-hybrid antenna is the nonnegative RF
    power propagating from the antenna input reference plane back toward the transmission
    line because of incomplete coupling to the antenna-plasma load. It is one per-antenna
    component of the RF power budget, distinct from [forward power](name:forward_power_of_lower_hybrid_antenna)
    and [launched power](name:launched_power_of_lower_hybrid_antenna).


    For a single antenna, the net launched power is defined by:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the incident power arriving at the antenna input
    reference plane, $P_\mathrm{reflected}$ is the power returning toward the transmission
    line, and $P_\mathrm{launched}$ is the net power entering the vacuum vessel. The
    quantity is per antenna and is not a system-wide sum; its role within the complete
    RF budget is given by [power of a lower-hybrid antenna](name:power_of_lower_hybrid_antenna).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_lower_hybrid_antenna
  - name:launched_power_of_lower_hybrid_antenna
  - name:power_of_lower_hybrid_antenna
  arguments:
  - name: power_of_lower_hybrid_antenna
    operator: reflected
    operator_kind: qualifier
  sources:
