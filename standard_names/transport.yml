- name: fast_particle_collisional_power_density_to_thermal_ion
  kind: scalar
  status: draft
  description: Volumetric power density transferred from the total fast (suprathermal)
    particle population to bulk thermal ions via Coulomb collisions, summed over all
    orbit classes (co-passing, counter-passing, and trapped).
  documentation: "This quantity gives the net collisional energy exchange rate per\
    \ unit volume from the entire fast-particle distribution \u2014 encompassing co-passing,\
    \ counter-passing, and trapped orbit classes \u2014 to the bulk thermal ion population.\
    \ It appears as a source term $S_{fi}$ in the ion energy balance equation\n\n\
    $$\\frac{\\partial}{\\partial t}\\left(\\frac{3}{2} n_i T_i\\right) + \\nabla\
    \ \\cdot \\mathbf{q}_i = S_{fi} + \\ldots$$\n\nwhere $n_i$ is the thermal ion\
    \ density, $T_i$ is the thermal ion temperature, and $\\mathbf{q}_i$ is the ion\
    \ heat flux. The exchange rate arises from Coulomb drag: energetic particles slow\
    \ down on the background plasma, depositing power preferentially to ions when\
    \ the fast-particle velocity $v_f$ is below the critical slowing-down velocity\
    \ $v_c \\approx (3\\sqrt{\\pi}/4)^{1/3}(m_i/m_e)^{1/6}v_{\\mathrm{th},e}$, where\
    \ $m_i$ and $m_e$ are the ion and electron masses and $v_{\\mathrm{th},e}$ is\
    \ the electron thermal velocity.\n\nIn neutral-beam-injected or ICRH-heated plasmas,\
    \ this power density governs the fraction of auxiliary heating that goes to the\
    \ ions rather than electrons; typical values range from $10^5$ to $10^8$ W m$^{-3}$\
    \ in the core of medium-to-large tokamaks. It is computed from Fokker\u2013Planck\
    \ or Monte Carlo distribution-function codes applied to the fast-particle distribution\
    \ function $f(\\mathbf{r}, \\mathbf{v})$.\n\nOrbit-class-resolved contributions\
    \ are captured by [co-passing fast particle collisional power density to thermal\
    \ ion](name:co_passing_fast_particle_collisional_power_density_to_thermal_ion)\
    \ and [counter-passing fast particle collisional power density to thermal ion](name:counter_passing_fast_particle_collisional_power_density_to_thermal_ion),\
    \ while [trapped fast particle collisional power density transferred to thermal\
    \ ions](name:trapped_fast_particle_collisional_power_density_transferred_to_thermal_ions)\
    \ covers the trapped sub-population. The analogous transfer to the electron channel\
    \ is described by [fast particle collisional power density due to Coulomb collisions\
    \ with electrons](name:fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons).\
    \ For the charge-state-resolved version, see [fast particle collisional power\
    \ density to thermal ion state due to Coulomb collisions](name:fast_particle_collisional_power_density_to_thermal_ion_state_due_to_coulomb_collisions)."
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:co_passing_fast_particle_collisional_power_density_to_thermal_ion
  - name:counter_passing_fast_particle_collisional_power_density_to_thermal_ion
  - name:trapped_fast_particle_collisional_power_density_transferred_to_thermal_ions
  - name:fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons
  - name:fast_particle_collisional_power_density_to_thermal_ion_state_due_to_coulomb_collisions
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_2d/collisions/ion/power_thermal
    dd_path: distributions/distribution/profiles_2d/collisions/ion/power_thermal
    status: composed
- name: fast_particle_density
  kind: scalar
  status: draft
  description: Number density of fast (suprathermal) particles on a given flux surface,
    summed over all orbit classes and velocity-space pitch angles, representing the
    total non-thermal contribution to the local particle inventory.
  documentation: 'The fast-particle number density $n_\mathrm{fast}$ is defined as
    the zeroth velocity-space moment of the suprathermal distribution function $f_\mathrm{fast}(\mathbf{v})$,
    integrated over all velocities above the suprathermal threshold $v_\mathrm{th,cut}$
    and over all pitch angles $\xi = v_\parallel/v$:


    $$n_\mathrm{fast} = \int_{v > v_\mathrm{th,cut}} \int_{-1}^{1} f_\mathrm{fast}(v,
    \xi)\, 2\pi v^2\, d\xi\, dv$$


    The quantity reported on a flux surface is the flux-surface average


    $$\langle n_\mathrm{fast} \rangle = \frac{\oint n_\mathrm{fast}\, dA / |\nabla
    \psi|}{\oint dA / |\nabla \psi|}$$


    where the surface integral is taken at constant normalized poloidal flux $\psi$.


    The suprathermal threshold $v_\mathrm{th,cut}$ is typically defined as a multiple
    of the local thermal speed $v_\mathrm{th} = \sqrt{2 k_B T / m}$, often taken as
    $v_\mathrm{th,cut} \approx 2\text{--}3\, v_\mathrm{th}$, but its precise definition
    is model- and code-dependent. When the fast-particle population is anisotropic
    (e.g., beam-injected ions or ICRH-heated minority species), the threshold should
    be understood as applying to the total speed $v = |\mathbf{v}|$ and includes contributions
    from all pitch angles; no assumption of isotropy is made.


    Typical values range from $\sim 10^{16}\,\mathrm{m}^{-3}$ for weakly heated discharges
    to $\sim 10^{18}\,\mathrm{m}^{-3}$ in strongly NBI- or ICRH-driven plasmas. Fast
    particles from fusion-born alpha particles contribute at the upper end of this
    range in burning plasmas.


    This quantity is non-negative by definition (it is a number density).


    In IMAS, this quantity is stored under `distributions/distribution/profiles_1d/density_fast`
    within the `distributions` IDS family. It encompasses all orbit classes (passing,
    trapped, potato orbits) without distinction.


    Related quantities include the thermal bulk density `particle_density`, the total
    (thermal plus fast) density `total_particle_density`, and the orbit-class-resolved
    `trapped_fast_particle_density`.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:trapped_fast_particle_density
  - name:counter_passing_fast_particle_density
  - name:particle_density
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/density_fast
    dd_path: distributions/distribution/profiles_1d/density_fast
    status: composed
- name: momentum_convection_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Effective scalar radial convective velocity in the momentum transport
    equation arising from the diamagnetic drift of a charged species. Represents the
    net radial advection speed of momentum density across flux surfaces due to pressure-gradient-driven
    cross-field drifts.
  documentation: "In fluid descriptions of magnetized plasma transport, the momentum\
    \ flux across flux surfaces contains a convective contribution proportional to\
    \ a radial convective velocity $v_\\mathrm{dia}$. This quantity is defined as\
    \ the effective radial projection of the diamagnetic drift that enters the radial\
    \ momentum transport equation:\n\n$$\\frac{\\partial}{\\partial t}(m_s n_s u_{s,\\\
    parallel}) + \\frac{1}{V'} \\frac{\\partial}{\\partial \\rho} \\left[ V' \\left(\
    \ -D \\frac{\\partial (m_s n_s u_{s,\\parallel})}{\\partial \\rho} + v_\\mathrm{dia}\
    \ \\, m_s n_s u_{s,\\parallel} \\right) \\right] = \\ldots$$\n\nwhere $\\rho$\
    \ is a radial flux-surface label (e.g., $\\rho_\\mathrm{tor,norm}$), $V'= \\partial\
    \ V/\\partial\\rho$ is the flux-surface volume derivative, $m_s$ is the species\
    \ mass, $n_s$ the density, $u_{s,\\parallel}$ the parallel flow velocity, and\
    \ $D$ is the diffusion coefficient.\n\nThe stored scalar $v_\\mathrm{dia}$ (in\
    \ m/s) is the effective radial convective speed extracted from the full vector\
    \ diamagnetic drift. The underlying vector diamagnetic drift velocity for a charged\
    \ species with charge $q_s$ is:\n\n$$\\mathbf{v}_{\\mathrm{dia},s} = \\frac{-\\\
    nabla p_s \\times \\mathbf{B}}{q_s n_s B^2}$$\n\nwhere $p_s$ is the species pressure\
    \ and $\\mathbf{B}$ is the magnetic field. The scalar $v_\\mathrm{dia}$ stored\
    \ in the transport IDS is the flux-surface-averaged radial component of this drift\
    \ projected onto the minor-radius direction $\\hat{\\rho}$ (outward from the magnetic\
    \ axis in the poloidal plane of the right-handed cylindrical $(R, \\phi, Z)$ frame):\n\
    \n$$v_\\mathrm{dia} = \\langle \\mathbf{v}_{\\mathrm{dia},s} \\cdot \\hat{\\rho}\
    \ \\rangle$$\n\nwhere the angle brackets denote the flux-surface average. The\
    \ precise numerical value depends on geometry and the transport model performing\
    \ the flux-surface averaging.\n\nTypical magnitudes for ion species in tokamak\
    \ plasmas are $10^1$\u2013$10^4$ m/s, with larger values in steep-gradient regions\
    \ such as the edge pedestal.\n\nNote: The linked DD path `plasma_transport/model/profiles_1d/neutral/state/momentum/v/diamagnetic`\
    \ stores this quantity for neutral states. In standard physics, neutral particles\
    \ do not experience the magnetic diamagnetic drift. When a value appears under\
    \ a neutral species path, it represents an effective convective velocity assigned\
    \ by the transport model's fluid closure (e.g., from charge-exchange coupling\
    \ or an effective neutral fluid approximation), not a direct magnetic drift of\
    \ the neutrals themselves.\n\nThe quantity is evaluated at each radial location\
    \ on the transport grid associated with the plasma transport IDS.\n\nSign convention:\
    \ Positive when the effective radial convective velocity is directed outward,\
    \ away from the magnetic axis along the direction of increasing minor radius."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:poloidal_component_of_ion_momentum_diffusion_coefficient
  - name:poloidal_component_of_neutral_momentum_diffusion_coefficient
  constraints: []
  sources:
  - id: dd:plasma_transport/model/profiles_1d/neutral/state/momentum/v/diamagnetic
    dd_path: plasma_transport/model/profiles_1d/neutral/state/momentum/v/diamagnetic
    status: composed
- name: parallel_component_of_ion_momentum_flow_damping_rate
  kind: scalar
  status: draft
  description: Rate at which the component of ion fluid momentum flow along the local
    magnetic field direction is dissipated by collisional friction or neoclassical
    viscosity in the plasma transport model.
  documentation: "The parallel component of the ion momentum flow damping rate, $\\\
    nu_{\\parallel,\\rm damp}$, is the scalar coefficient appearing in the parallel\
    \ projection of the ion momentum sink term:\n\n$$\\left(\\frac{\\partial (m_i\
    \ n_i u_{i\\parallel})}{\\partial t}\\right)_{\\rm damp} = -\\nu_{\\parallel,\\\
    rm damp}\\, m_i n_i u_{i\\parallel}$$\n\nwhere $m_i$ is the ion mass, $n_i$ is\
    \ the ion number density, and $u_{i\\parallel} = \\mathbf{u}_i \\cdot \\hat{b}$\
    \ is the ion fluid velocity projected onto the unit vector $\\hat{b}$ along the\
    \ magnetic field. The parallel direction is special in magnetized plasmas because\
    \ parallel momentum transport is governed predominantly by ion\u2013ion collisions\
    \ and parallel viscosity, whereas perpendicular components are additionally regulated\
    \ by neoclassical poloidal-flow damping (Stringer spin-up and neoclassical flow\
    \ damping). Physically, $\\nu_{\\parallel,\\rm damp}$ encapsulates contributions\
    \ from ion\u2013ion collisional friction, parallel viscous damping, and any neoclassical\
    \ effects projected onto the field-aligned direction. Typical values in the tokamak\
    \ core range from $10^2$ to $10^5\\,\\mathrm{s^{-1}}$ depending on collisionality\
    \ and plasma density; in the high-collisionality (Pfirsch\u2013Schl\xFCter) regime\
    \ the rate approaches the ion\u2013ion collision frequency $\\nu_{ii}$. This quantity\
    \ is a member of the directional decomposition family of [ion_momentum_flow_damping_rate](name:ion_momentum_flow_damping_rate),\
    \ which also includes the [radial_component_of_ion_momentum_flow_damping_rate](name:radial_component_of_ion_momentum_flow_damping_rate),\
    \ [poloidal_component_of_ion_momentum_flow_damping_rate](name:poloidal_component_of_ion_momentum_flow_damping_rate),\
    \ and [toroidal_component_of_ion_momentum_flow_damping_rate](name:toroidal_component_of_ion_momentum_flow_damping_rate).\
    \ In transport codes it is computed from neoclassical models (e.g. NCLASS, NEO)\
    \ or from collisional closure schemes applied along flux surfaces.\n\nSign convention:\
    \ Positive when the damping acts to reduce the parallel ion momentum, i.e. when\
    \ $u_{i\\parallel}$ and the resulting momentum sink have the same sign as $u_{i\\\
    parallel}$ itself (damping coefficient positive definite)."
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_momentum_flow_damping_rate
  - name:radial_component_of_ion_momentum_flow_damping_rate
  - name:poloidal_component_of_ion_momentum_flow_damping_rate
  - name:toroidal_component_of_ion_momentum_flow_damping_rate
  constraints: []
  arguments:
  - name: ion_momentum_flow_damping_rate
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:plasma_transport/model/profiles_1d/ion/state/momentum/parallel/flow_damping_rate
    dd_path: plasma_transport/model/profiles_1d/ion/state/momentum/parallel/flow_damping_rate
    status: composed
- name: poloidal_component_of_electric_field
  kind: scalar
  status: draft
  description: Projection of the plasma electric field onto the local poloidal direction,
    defined as the dot product of the electric field vector with the poloidal unit
    vector at each point on a flux surface. This component appears in the poloidal
    projection of the generalized Ohm's law and in flux-surface-averaged force balance
    along the poloidal direction.
  documentation: "The poloidal component of the electric field is defined by\n\n$$E_\\\
    theta = \\mathbf{E} \\cdot \\hat{\\theta}$$\n\nwhere $\\hat{\\theta}$ is the unit\
    \ vector in the poloidal direction, tangent to the flux surface and lying in the\
    \ meridional $(R, Z)$ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame.\
    \ Note that $\\hat{\\theta}$ is **not** a basis vector of the cylindrical $(R,\
    \ \\phi, Z)$ frame; it is defined by the geometry of the specific flux surface\
    \ and the choice of poloidal angle $\\theta$ increasing counter-clockwise in the\
    \ $(R, Z)$ poloidal cross-section when viewed with $\\phi$ increasing out of the\
    \ page.\n\nIn the poloidal projection of the generalized Ohm's law, $E_\\theta$\
    \ balances resistive, inductive, and electron-pressure-gradient contributions.\
    \ It participates in the parallel electric field through the decomposition $E_\\\
    parallel = E_\\theta \\sin\\alpha + E_\\phi \\cos\\alpha$, where $\\alpha$ is\
    \ the pitch angle of the magnetic field.\n\n**Typical values:** In a standard\
    \ tokamak discharge, $|E_\\theta|$ is typically in the range $10^{-3}$\u2013$10^{-1}$\
    \ V m$^{-1}$ in the bulk plasma, with larger values possible near transport barriers\
    \ or during transient events.\n\n**Units:** V m$^{-1}$ (stored as `V.m^-1` in\
    \ the IMAS data dictionary).\n\n**IMAS data path:** `core_profiles/profiles_1d/e_field/poloidal`\
    \ (IDS: `core_profiles`).\n\nSign convention: Positive when the electric field\
    \ vector points in the direction of increasing poloidal angle $\\theta$, where\
    \ $\\theta$ increases counter-clockwise in the $(R, Z)$ poloidal cross-section."
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:toroidal_component_of_electric_field
  - name:radial_component_of_electric_field
  constraints: []
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/poloidal
    dd_path: core_profiles/profiles_1d/e_field/poloidal
    status: composed
- name: radial_component_of_electric_field
  kind: scalar
  status: draft
  description: "Component of the plasma electric field along the major-radius direction\
    \ R in the right-handed cylindrical (R, phi, Z) frame. It is the projection E_R\
    \ = E \xB7 R-hat, obtained from the negative radial gradient of the electrostatic\
    \ potential. This component drives cross-field drifts and is central to radial\
    \ force balance in magnetized plasmas."
  documentation: "The radial electric field $E_R$ is the component of the total electric\
    \ field $\\mathbf{E}$ along the major-radius unit vector $\\hat{R}$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius measured from\
    \ the machine symmetry axis and $Z$ is the vertical height.\n\nIt is defined by\
    \ the projection\n$$E_R = \\mathbf{E} \\cdot \\hat{R} = -\\frac{\\partial \\Phi}{\\\
    partial R},$$\nwhere $\\Phi$ is the electrostatic potential. This quantity is\
    \ stored in the IMAS IDS at `core_profiles/profiles_1d/e_field/radial` and is\
    \ typically provided as a function of a radial flux-surface coordinate such as\
    \ $\\rho_\\mathrm{tor,norm}$ (normalized toroidal flux radius).\n\nNote that in\
    \ a general shaped equilibrium, the direction $\\hat{R}$ is not identical to the\
    \ direction perpendicular to a flux surface; the flux-surface-normal direction\
    \ acquires contributions from both $\\hat{R}$ and $\\hat{Z}$. The quantity $E_R$\
    \ therefore represents the laboratory-frame cylindrical projection and should\
    \ not be equated directly with the flux-surface-perpendicular electric field $E_\\\
    perp$ except in the limit of circular, concentric flux surfaces.\n\n**Radial force\
    \ balance.** For a given ion species $s$ with charge $q_s$, the radial force-balance\
    \ relation reads\n$$q_s E_R = \\frac{1}{n_s}\\frac{\\partial p_s}{\\partial R}\
    \ - v_{\\phi,s} B_Z + v_{Z,s} B_\\phi,$$\nwhere $n_s$ is the species density,\
    \ $p_s$ is the pressure, and $v_{\\phi,s}$, $v_{Z,s}$ are the toroidal and vertical\
    \ flow components respectively, with $B_\\phi$ and $B_Z$ the corresponding magnetic-field\
    \ components.\n\n**$E\\times B$ rotation.** The $E\\times B$ drift velocity in\
    \ the poloidal plane, which drives toroidal plasma rotation, involves a combination\
    \ of field components and is geometry-dependent; it cannot in general be reduced\
    \ to $E_R / B$ alone. A correct expression for the $E\\times B$ toroidal angular\
    \ frequency requires the full poloidal-field geometry.\n\n**Typical values.**\
    \ In tokamak core plasmas, $|E_R|$ is typically in the range $10^2$\u2013$10^4$\
    \ V m$^{-1}$. In the edge and pedestal region, sharp $E_R$ wells of order $10^4$\u2013\
    $10^5$ V m$^{-1}$ are observed, associated with the L\u2013H transition and suppression\
    \ of turbulence.\n\nSign convention: Positive when the electric field points in\
    \ the direction of increasing major radius $R$ (i.e., outward from the machine\
    \ symmetry axis)."
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:poloidal_component_of_electric_field
  - name:toroidal_component_of_electric_field
  - name:electric_field
  constraints: []
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/radial
    dd_path: core_profiles/profiles_1d/e_field/radial
    status: composed
  - id: dd:plasma_profiles/ggd/e_field/radial
    dd_path: plasma_profiles/ggd/e_field/radial
    status: attached
  - id: dd:plasma_profiles/profiles_1d/e_field/radial
    dd_path: plasma_profiles/profiles_1d/e_field/radial
    status: attached
- name: second_derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  kind: scalar
  status: draft
  description: Second derivative of the fast (suprathermal) electron number density
    with respect to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}$,
    characterizing the radial curvature of the non-thermal electron density profile
    across nested flux surfaces.
  documentation: 'The fast electron population consists of suprathermal electrons
    whose kinetic energy substantially exceeds the bulk thermal energy, arising from
    sources such as runaway electron generation, radio-frequency heating, or beam
    injection. This quantity is the second derivative $\partial^2 n_{\mathrm{fe}}
    / \partial \rho_{\mathrm{tor,norm}}^2$, where $n_{\mathrm{fe}}$ is the fast electron
    number density and $\rho_{\mathrm{tor,norm}} = \sqrt{\Phi_{\mathrm{tor}} / \Phi_{\mathrm{tor,edge}}}$
    is the normalized toroidal flux coordinate (dimensionless, ranging from 0 at the
    magnetic axis to 1 at the plasma boundary). Although the coordinate $\rho_{\mathrm{tor,norm}}$
    is dimensionless, differentiating a density quantity twice with respect to it
    preserves the units of number density. The second derivative quantifies the local
    concavity of the fast electron density profile and appears as a higher-order term
    in transport solver discretizations, entering the radial diffusion operator for
    the fast electron continuity equation alongside the first derivative captured
    by [first derivative of fast electron density](name:derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate).
    The analogous quantity for the total electron population is [second derivative
    of electron density](name:second_derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate),
    and the corresponding fast ion quantity is the [second derivative of fast ion
    density](name:second_derivative_of_ion_fast_particle_density_with_respect_to_normalized_toroidal_flux_coordinate).
    Typical fast electron densities in auxiliary-heated tokamak plasmas range from
    $10^{16}$ to $10^{18}$ m$^{-3}$; the magnitude of the second derivative depends
    sensitively on source localization and transport properties. This quantity is
    not directly measured but is computed numerically from the radial fast electron
    density profile during transport solver iterations.


    Sign convention: Positive when the fast electron density profile is concave upward
    (i.e., the profile curves away from the magnetic axis) with respect to increasing
    $\rho_{\mathrm{tor,norm}}$.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  - name:second_derivative_of_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  - name:second_derivative_of_ion_fast_particle_density_with_respect_to_normalized_toroidal_flux_coordinate
  constraints: []
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d2_drho_tor_norm2/density_fast
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d2_drho_tor_norm2/density_fast
    status: composed
- name: tendency_of_fast_electron_density
  kind: scalar
  status: draft
  description: Rate of change of the suprathermal (non-thermal) electron number density
    with respect to time, representing the net source minus sink of fast electrons
    at each flux surface in the transport solver.
  documentation: "The tendency of fast electron density, $\\partial n_{\\rm fast,e}\
    \ / \\partial t$, where $n_{\\rm fast,e}$ is the number density of suprathermal\
    \ electrons (those with energies substantially exceeding the thermal energy $k_B\
    \ T_e$), quantifies how the non-thermal electron population evolves in time. This\
    \ quantity appears as the left-hand side of the fast electron continuity equation\
    \ in transport codes, balancing sources such as runaway generation, beam injection,\
    \ and wave-driven acceleration against sinks including collisional slowing-down\
    \ (thermalization), radial transport, and orbit losses. It is distinct from [tendency_of_electron_density](name:tendency_of_electron_density),\
    \ which covers the total electron population (thermal plus non-thermal), and complements\
    \ [tendency_of_ion_state_fast_particle_density](name:tendency_of_ion_state_fast_particle_density),\
    \ the analogous quantity for non-thermal ions. Radial profiles are resolved in\
    \ the normalized toroidal flux coordinate $\\rho_{\\rm tor,norm}$; the [derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate](name:derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate)\
    \ provides the spatial gradient used alongside this tendency in implicit time-advance\
    \ schemes. Typical magnitudes during sawtooth-driven fast electron redistribution\
    \ or NBI injection are of order $10^{16}$\u2013$10^{19}$ m$^{-3}$ s$^{-1}$ depending\
    \ on plasma density and auxiliary heating power.\n\nSign convention: Positive\
    \ when the fast electron density is increasing in time (net source exceeds net\
    \ sink)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:tendency_of_electron_density
  - name:tendency_of_ion_state_fast_particle_density
  - name:derivative_of_fast_electron_density_with_respect_to_normalized_toroidal_flux_coordinate
  constraints: []
  arguments:
  - name: electron_fast_density
    operator: tendency
    operator_kind: unary_prefix
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d_dt/density_fast
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_dt/density_fast
    status: composed
- name: tendency_of_ion_state_density
  kind: scalar
  status: draft
  description: Time derivative of total ion number density (thermal plus non-thermal)
    for a specific ionic charge state, representing the local rate of change of charge-state
    population in the transport solver continuity equation.
  documentation: 'The tendency of ion charge-state density quantifies $\partial n_{z,s}
    / \partial t$, where $n_{z,s}$ is the total (thermal plus non-thermal) number
    density of ions of species $z$ in charge state $s$. This quantity appears as the
    time-advance term in the per-charge-state ion continuity equation solved by transport
    codes, capturing sources and sinks from ionization, recombination, charge exchange,
    and cross-field transport simultaneously. It differs from [tendency of ion density](name:tendency_of_ion_density),
    which sums over all charge states to give the species-integrated continuity source,
    and from [tendency of ion state fast particle density](name:tendency_of_ion_state_fast_particle_density),
    which isolates only the non-thermal (fast) component for the same charge state.
    Typical magnitudes in core tokamak transport simulations range from $10^{16}$
    to $10^{20}$ m$^{-3}$ s$^{-1}$ depending on plasma density, heating power, and
    the charge state considered, with higher charge states of impurity ions exhibiting
    sharper transients during pellet injection or disruption precursors. The second
    radial derivative of the same density profile is documented under [second derivative
    of ion state density with respect to normalized toroidal flux coordinate](name:second_derivative_of_ion_state_density_with_respect_to_normalized_toroidal_flux_coordinate),
    which enters the diffusive term of the same continuity equation. Analogous electron-side
    quantities include [tendency of electron density](name:tendency_of_electron_density)
    and [tendency of fast electron density](name:tendency_of_fast_electron_density).


    Sign convention: Positive when the ion charge-state population is increasing with
    time (net particle source exceeds sink for the given charge state).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:tendency_of_ion_density
  - name:tendency_of_ion_state_fast_particle_density
  - name:second_derivative_of_ion_state_density_with_respect_to_normalized_toroidal_flux_coordinate
  - name:tendency_of_electron_density
  - name:tendency_of_fast_electron_density
  constraints: []
  arguments:
  - name: ion_state_density
    operator: tendency
    operator_kind: unary_prefix
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/state/d_dt/density
    dd_path: transport_solver_numerics/derivatives_1d/ion/state/d_dt/density
    status: composed
- name: toroidal_component_of_electric_field
  kind: scalar
  status: draft
  description: Projection of the plasma electric field onto the toroidal direction
    $\hat{\phi}$, governing the parallel current drive and Ohmic heating in the toroidal
    circuit.
  documentation: 'The toroidal electric field component $E_\phi = \mathbf{E} \cdot
    \hat{\phi}$ is the component of the total [electric field](name:electric_field)
    aligned with the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It is the primary driver of Ohmic plasma current
    via $\mathbf{j} = \sigma \mathbf{E}$, where $\sigma$ is the parallel plasma conductivity,
    and enters the toroidal loop voltage equation $V_{\rm loop} = 2\pi R \, E_\phi$,
    where $R$ is the major radius. In the presence of a changing poloidal magnetic
    flux $\psi$, Faraday''s law gives $E_\phi = -(2\pi R)^{-1} \partial \psi / \partial
    t$, directly linking the toroidal field to flux-surface evolution during current
    ramp-up or ramp-down. Typical magnitudes range from a few tens of mV/m during
    steady H-mode to several V/m during disruptions or aggressive current ramps. It
    is inferred from magnetic loop measurements and equilibrium reconstruction, or
    computed self-consistently in transport codes from the current diffusion equation.
    The companion components [poloidal_component_of_electric_field](name:poloidal_component_of_electric_field)
    and [radial_component_of_electric_field](name:radial_component_of_electric_field)
    complete the decomposition of the full field vector.


    Sign convention: Positive when $E_\phi$ points in the direction of increasing
    toroidal angle $\phi$.'
  unit: V.m^-1
  physics_domain: transport
  links:
  - name:electric_field
  - name:poloidal_component_of_electric_field
  - name:radial_component_of_electric_field
  constraints: []
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/e_field/toroidal
    dd_path: core_profiles/profiles_1d/e_field/toroidal
    status: composed
- name: trapped_fast_particle_collisional_power_density_to_thermal_electron
  kind: scalar
  status: draft
  description: Volumetric power density deposited into the thermal electron population
    via Coulomb collisions with trapped fast (non-thermal) particles. This is the
    locally evaluated energy exchange rate per unit volume attributable exclusively
    to the trapped-orbit subset of the fast-particle distribution, and is positive
    when net energy flows from fast particles to thermal electrons.
  documentation: "## Trapped Fast-Particle Collisional Power Density to Thermal Electrons\n\
    \n### Physical definition\n\nThis quantity gives the local volumetric power density\
    \ $Q_{\\mathrm{trap},e}^{\\mathrm{coll}}$ (units: $\\mathrm{W\\,m^{-3}}$) transferred\
    \ from the trapped-orbit subset of the fast-particle distribution to the thermal\
    \ electron population through Coulomb collisions (electron drag and pitch-angle\
    \ scattering). It is defined as\n\n$$Q_{\\mathrm{trap},e}^{\\mathrm{coll}}(\\\
    mathbf{x}) = \\int_{\\mathrm{trapped}} \\nu_{se}(v)\\, E_k\\, f_f(\\mathbf{x},\
    \ \\mathbf{v})\\, d^3v,$$\n\nwhere the integration is restricted to trapped-orbit\
    \ phase-space (i.e., particles whose guiding-center bounce trajectory does not\
    \ complete a full toroidal transit), $\\nu_{se}(v)$ is the velocity-dependent\
    \ slowing-down frequency on electrons, $E_k = \\tfrac{1}{2}m_f v^2$ is the fast-particle\
    \ kinetic energy, and $f_f(\\mathbf{x}, \\mathbf{v})$ is the fast-particle distribution\
    \ function in units of $\\mathrm{m^{-6}\\,s^3}$ (number of particles per unit\
    \ phase-space volume). The integral therefore carries units of $\\mathrm{W\\,m^{-3}}$\
    \ \u2014 power per unit real-space volume, evaluated at position $\\mathbf{x}$\
    \ in the IMAS cylindrical $(R, \\phi, Z)$ frame.\n\n### Orbit-class partitioning\n\
    \nThe trapped subset is distinguished from the passing subsets (co-passing and\
    \ counter-passing) by the trapping condition on the pitch-angle variable $\\xi\
    \ = v_\\parallel / v$: a particle at position $\\mathbf{x}$ is classified as trapped\
    \ when $|\\xi| < \\xi_{\\mathrm{trap}}(\\mathbf{x})$, where $\\xi_{\\mathrm{trap}}\
    \ = \\sqrt{1 - B(\\mathbf{x})/B_{\\mathrm{max}}}$ and $B_{\\mathrm{max}}$ is the\
    \ maximum magnetic field along the flux surface. Summing the trapped, co-passing,\
    \ and counter-passing contributions exactly reconstructs the total collisional\
    \ power density to thermal electrons: $Q_{\\mathrm{total},e}^{\\mathrm{coll}}\
    \ = Q_{\\mathrm{trap},e}^{\\mathrm{coll}} + Q_{\\mathrm{co},e}^{\\mathrm{coll}}\
    \ + Q_{\\mathrm{ctr},e}^{\\mathrm{coll}}$.\n\n### Sign convention\n\nSign convention:\
    \ Positive when net energy flows from the trapped fast-particle population into\
    \ the thermal electrons (heating). A negative value would indicate anomalous back-transfer,\
    \ which is unphysical under classical Coulomb collisions but may appear as a numerical\
    \ artifact.\n\n### IMAS / DD provenance\n\nThis scalar is sourced from the IMAS\
    \ `distributions` IDS at the path\n\n```\ndistributions/distribution/profiles_2d/trapped/collisions/electrons/power_thermal\n\
    ```\n\n(unit: $\\mathrm{W\\,m^{-3}}$, annotated as \"Collisional power density\
    \ to the thermal particle population\"). The `trapped` node in the DD path explicitly\
    \ identifies the orbit-class; the sibling nodes `co_passing` and `counter_passing`\
    \ hold the corresponding passing-orbit contributions.\n\n### Typical values and\
    \ context\n\nIn NBI- or ICRH-heated tokamak plasmas, the total fast-electron collisional\
    \ power density peaks on axis at $10^3$\u2013$10^6\\,\\mathrm{W\\,m^{-3}}$ depending\
    \ on heating power and plasma density. The trapped fraction depends strongly on\
    \ inverse aspect ratio $\\epsilon = r/R$: at low $\\epsilon$ the trapped fraction\
    \ $f_{\\mathrm{trap}} \\approx 2\\sqrt{\\epsilon}$ is small, while near the plasma\
    \ edge it can approach 50 %. Consequently $Q_{\\mathrm{trap},e}^{\\mathrm{coll}}$\
    \ is typically smaller than the co-passing contribution on axis but becomes comparable\
    \ at mid-radius and beyond.\n\nThis quantity is used in transport solvers (e.g.,\
    \ as a source term in the electron energy equation) and in RF/NBI power balance\
    \ analysis."
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:trapped_fast_particle_collisional_power_density_transferred_to_thermal_ions
  - name:fast_particle_collisional_power_density_due_to_coulomb_collisions_with_electrons
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_2d/trapped/collisions/electrons/power_thermal
    dd_path: distributions/distribution/profiles_2d/trapped/collisions/electrons/power_thermal
    status: composed
- name: trapped_fast_particle_collisional_power_density_to_thermal_ion
  kind: scalar
  status: draft
  description: Collisional power density transferred from trapped fast particles to
    thermal ions via Coulomb collisions, giving the local volumetric heating rate
    of the bulk ion fluid attributable to the trapped suprathermal population. Positive
    values indicate net energy deposition into the thermal ions.
  documentation: '## Trapped Fast-Particle Collisional Power Density to Thermal Ions


    This quantity is the local volumetric rate at which energy is transferred from
    the trapped suprathermal (fast) particle population to the thermal ion fluid through
    Coulomb collisions. It is defined as the velocity-space moment of the collisional
    energy-exchange operator $C[f_\mathrm{fast}]$ weighted by the particle kinetic
    energy $\tfrac{1}{2}m v^2$:


    $$p_\mathrm{coll} = \int \frac{1}{2}m v^2\, C[f_\mathrm{fast}, f_\mathrm{ion}]\,
    d^3v \quad [\mathrm{W\,m^{-3}}]$$


    where $f_\mathrm{fast}$ is the trapped fast-particle distribution function, $f_\mathrm{ion}$
    is the thermal ion distribution function, and the integral is performed over the
    trapped portion of velocity space. The result is a scalar field resolved locally
    in the plasma volume (or along a flux-surface-averaged profile, depending on the
    IDS context), stored with units W m$^{-3}$.


    In the slowing-down picture, energy is transferred from suprathermal particles
    to the thermal ions at a rate proportional to the ion-drag friction force $F_\mathrm{drag}^\mathrm{ion}(v)$
    integrated over the fast-particle velocity distribution. The fraction of power
    deposited on ions (as opposed to electrons) depends strongly on the fast-particle
    injection energy relative to the critical energy $E_c = \tfrac{1}{2}m_f v_c^2$,
    where $v_c$ is the critical velocity separating ion-dominated and electron-dominated
    slowing-down regimes. For $E_\mathrm{fast} \gg E_c$, the majority of fast-particle
    energy flows to electrons; for $E_\mathrm{fast} \ll E_c$, energy flows predominantly
    to ions.


    Typical values in reactor-relevant scenarios range from $10^4$ to $10^7$ W m$^{-3}$,
    depending on plasma density, fast-particle source strength (e.g., neutral beam
    or fusion alpha), and radial location.


    This quantity is sourced from the `distributions` IDS, specifically from:

    - `distributions/distribution/profiles_1d/trapped/collisions/ion/power_thermal`
    (flux-surface-averaged profile, W m$^{-3}$)

    - `distributions/distribution/profiles_2d/trapped/collisions/ion/power_thermal`
    (2-D poloidal-plane resolved, W m$^{-3}$)


    Sign convention: Positive when energy is deposited from the trapped fast-particle
    population into the thermal ion fluid (net heating of the ion species).'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:co_passing_fast_particle_collisional_power_density_to_thermal_ion
  - name:counter_passing_fast_particle_collisional_power_density_to_thermal_ion
  - name:fast_particle_collisional_power_density_to_thermal_ion
  - name:trapped_fast_particle_collisional_power_density_due_to_coulomb_collisions_with_ion
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/collisions/ion/power_thermal
    dd_path: distributions/distribution/profiles_1d/trapped/collisions/ion/power_thermal
    status: composed
  - id: dd:distributions/distribution/profiles_1d/trapped/collisions/ion/state/power_thermal
    dd_path: distributions/distribution/profiles_1d/trapped/collisions/ion/state/power_thermal
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/collisions/ion/power_thermal
    dd_path: distributions/distribution/profiles_2d/trapped/collisions/ion/power_thermal
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/collisions/ion/state/power_thermal
