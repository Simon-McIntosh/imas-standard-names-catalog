name: counter_passing_fast_particle_energy_source
status: draft
description: Volumetric source rate of energy density for supra-thermal particles
  on counter-current passing orbits, aggregating heating, collisional, and loss contributions.
documentation: "The counter-passing fast-particle energy source $S_{E,\\mathrm{ctr,fast}}$\
  \ (W m$^{-3}$) quantifies the net rate at which energy density is added to the supra-thermal\
  \ ion (or electron) population whose guiding-center parallel velocity opposes the\
  \ plasma current direction and whose orbits remain untrapped. Contributions include\
  \ neutral beam injection (NBI) at counter-tangency radii, ion-cyclotron resonance\
  \ heating (ICRH) acceleration of counter-passing particles, Coulomb collisional\
  \ drag against the bulk plasma, pitch-angle scattering that redistributes particles\
  \ between orbit classes, and prompt orbit losses. Positive values denote net energy\
  \ gain of the counter-passing fast population. In balanced-NBI scenarios the co-\
  \ and counter-passing sources are comparable, whereas in co-dominated injection\
  \ the counter-passing source is smaller by roughly an order of magnitude. Typical\
  \ core values span $10^3$\u2013$10^6$ W m$^{-3}$ depending on heating power and\
  \ plasma density. The quantity is evaluated by Fokker\u2013Planck or Monte Carlo\
  \ orbit-following codes (e.g., NUBEAM, ASCOT) that partition the distribution function\
  \ into co-passing, counter-passing, and trapped subsets. See `co_passing_fast_particle_energy_source`\
  \ for the co-current counterpart and `trapped_particle_energy_source` for the trapped\
  \ orbit class."
