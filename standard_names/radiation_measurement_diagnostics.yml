- name: normalized_count_at_detector_pixel
  kind: scalar
  status: draft
  description: Dimensionless detector-pixel signal formed by dividing the pixel photon
    count rate by a positive reference photon count rate associated with the same
    acquisition frame. A value of 1 means the pixel count rate equals the reference
    rate.
  documentation: 'Normalized count at detector pixel is a relative photon count-rate
    signal for one detector pixel of an X-ray crystal spectrometer. The underlying
    detector signal is the photon count rate at that pixel, while the normalization
    reference is a positive count-rate scale applied consistently within the same
    acquisition frame.


    The normalized value is defined by the ratio


    $$

    C_n(p) = \frac{\dot{N}(p)}{\dot{N}_{\mathrm{ref}}}

    $$


    where $C_n(p)$ is the dimensionless normalized count for detector pixel $p$, $\dot{N}(p)$
    is the photon count rate at that pixel in $\mathrm{count}\,\mathrm{s}^{-1}$, and
    $\dot{N}_{\mathrm{ref}}$ is the positive reference photon count rate for the same
    frame in $\mathrm{count}\,\mathrm{s}^{-1}$. The quantity is undefined if $\dot{N}_{\mathrm{ref}}
    = 0$.


    In practice, $\dot{N}(p)$ is obtained from the detector counts after applying
    the relevant exposure-time and detector-response corrections used for the measurement.
    The same $\dot{N}_{\mathrm{ref}}$ must be used for all detector pixels that are
    compared within a frame; otherwise the relative scale changes. The spectral interpretation
    of pixel $p$ is set by its energy bandpass, bounded by the [lower-bound photon
    energy](name:lower_bound_energy_of_detector_pixel) and [upper-bound photon energy](name:upper_bound_energy_of_detector_pixel).


    Values are non-negative because both count rates are non-negative. A value of
    0 indicates no detected photon count rate at that pixel after the applied corrections,
    a value of 1 indicates equality with the reference count rate, and values greater
    than 1 are possible when the pixel count rate exceeds the reference rate. The
    standard name specifies a relative count-rate ratio; it does not by itself imply
    total-frame, peak, or average-count normalization.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:extent_of_detector_pixel
  - name:energy_of_detector_pixel
  arguments:
  - name: count_at_detector_pixel
    operator: normalized
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/frame/counts_bin_n
    dd_path: spectrometer_x_ray_crystal/channel/frame/counts_bin_n
    status: composed
  - id: dd:spectrometer_x_ray_crystal/channel/frame/counts_n
    dd_path: spectrometer_x_ray_crystal/channel/frame/counts_n
    status: composed
- name: nuclear_rate_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Volumetric nuclear-reaction response of a neutron detector converter
    to incident neutrons from a unit source. It gives the number of converter reactions
    per unit converter volume per emitted source neutron, so it becomes a physical
    rate density only after scaling by the source emission rate.
  documentation: 'This quantity is a local response kernel for neutron-induced nuclear
    reactions in a detector converter material. It represents reaction yield per converter
    volume for a unit neutron source, not a time rate by itself.


    For an effective monoenergetic or spectrum-averaged response, the local kernel
    can be written as:


    $$

    k_R = n_t \, \sigma_\mathrm{eff} \, F_n

    $$


    where $k_R$ is the converter nuclear-reaction response per unit volume in $m^{-3}$,
    $n_t$ is the target-nucleus number density in $m^{-3}$ as represented by [nuclear_density_of_neutron_detector_converter](name:nuclear_density_of_neutron_detector_converter),
    $\sigma_\mathrm{eff}$ is the microscopic reaction cross-section averaged over
    the incident neutron energy spectrum in $m^2$, and $F_n$ is the incident neutron
    fluence per emitted source neutron in $m^{-2}$ as represented by incident_neutron_fluence_of_neutron_detector_converter.
    The emitted source neutron is a counting normalization, so the resulting unit
    is $m^{-3}$.


    The kernel is usually computed by neutron transport from a unit source to the
    converter, followed by folding the local neutron fluence spectrum with the converter
    material composition and reaction cross-sections. To obtain a physical detector
    reaction rate, multiply the kernel by the neutron emission rate of the corresponding
    source element, integrate over the converter volume represented by [volume_of_neutron_detector_converter](name:volume_of_neutron_detector_converter),
    and then sum or integrate over all source elements contributing to the detector
    response.


    Typical magnitudes vary by many orders of magnitude because they depend on source-converter
    distance, shielding, collimation, converter material, and reaction threshold.
    Values can range from less than $10^{-12}$ m^-3 in weakly coupled or heavily shielded
    views to about $10^{-1}$ m^-3 for strongly coupled converter regions per emitted
    source neutron.'
  unit: m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:nuclear_density_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  sources:
  - id: dd:neutron_diagnostic/unit_source/radiation/reaction/reaction_rate
    dd_path: neutron_diagnostic/unit_source/radiation/reaction/reaction_rate
    status: composed
- name: optical_element_width
  kind: scalar
  status: draft
  description: Full width of an optical-element aperture along X1 in the right-handed
    local element frame (X1, X2, X3), where X3 is normal to the aperture surface.
    It applies to rectangular aperture geometry.
  documentation: "Optical element width is the usable aperture extent along the first\
    \ transverse axis $X_1$ of a right-handed local element frame $(X_1, X_2, X_3)$.\
    \ The axes $X_1$ and $X_2$ span the aperture surface, while $X_3$ is normal to\
    \ that surface; for a rectangular aperture this width is one side length, paired\
    \ with [height_of_optical_element](name:height_of_optical_element) along $X_2$.\n\
    \nFor an aperture bounded by minimum and maximum positions along $X_1$, the width\
    \ is\n\n$$\nW = X_{1,\\max} - X_{1,\\min}\n$$\n\nwhere $W$ is the optical element\
    \ width in meters, and $X_{1,\\max}$ and $X_{1,\\min}$ are the largest and smallest\
    \ local $X_1$ positions of the usable aperture boundary, also in meters. The result\
    \ is a non-negative geometric extent.\n\nThe width is obtained from the optical\
    \ design, clear-aperture specification, or dimensional metrology of the fabricated\
    \ element. Together with the $X_2$ height it determines the geometric aperture\
    \ area $W H$ for an unobscured rectangle, which affects solid angle, photon throughput,\
    \ and \xE9tendue; [width_of_diagnostic_aperture](name:width_of_diagnostic_aperture)\
    \ is the analogous width for a diagnostic aperture not specifically tied to an\
    \ optical element.\n\nTypical values for X-ray crystal spectrometer reflectors\
    \ and similar diagnostic optical elements are 0.001-0.1 m, with smaller widths\
    \ favored for compact or high-resolution optics and larger widths used when photon\
    \ throughput is limiting."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:height_of_optical_element
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/x1_width
    dd_path: spectrometer_x_ray_crystal/channel/reflector/x1_width
    status: composed
- name: power_density_due_to_fusion
  kind: scalar
  status: draft
  description: Local thermonuclear fusion energy release rate per unit volume, encompassing
    contributions from all fuel-ion reaction channels including deuterium-deuterium
    and deuterium-tritium.
  documentation: 'Volumetric power density deposited by thermonuclear fusion reactions
    in the plasma, representing the total local energy released per unit volume per
    unit time across all contributing fuel-ion reaction channels. This parent quantity
    generalizes over channel-specific instances such as [deuterium-deuterium fusion
    power density](name:deuterium_deuterium_power_density_due_to_fusion) and [deuterium-tritium
    fusion power density](name:deuterium_tritium_power_density_due_to_fusion).


    The volumetric fusion power density for a reaction channel between species $i$
    and $j$ is defined as:


    $$

    p_{\mathrm{fus},ij}(\mathbf{r}) = n_i(\mathbf{r})\, n_j(\mathbf{r})\, \langle
    \sigma v \rangle_{ij}(T)\, Q_{ij}

    $$


    where $n_i$ and $n_j$ are the reactant number densities in m$^{-3}$, $\langle
    \sigma v \rangle_{ij}(T)$ is the thermally averaged reaction-rate coefficient
    at local ion temperature $T$, and $Q_{ij}$ is the total energy released per reaction.
    For DT reactions, $Q_{DT} = 17.6\;\text{MeV}$; for the two DD branches combined,
    the effective energy yield is approximately 3.65 MeV per reaction.


    In practice this quantity is computed from local fuel-ion density and ion temperature
    profiles using tabulated reaction-rate coefficients, or inferred from neutron
    emission diagnostics combined with reaction-rate models. The particle-channel
    counterparts [deuterium-deuterium neutron emissivity] and [deuterium-tritium emissivity](name:deuterium_tritium_emissivity_due_to_fusion)
    track neutron production rates rather than total energy release.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_power_density_due_to_fusion
  - name:deuterium_tritium_power_density_due_to_fusion
  - name:deuterium_tritium_emissivity_due_to_fusion
- name: deuterium_deuterium_power_density_due_to_fusion
  kind: scalar
  status: draft
  description: Local fusion energy release rate per unit volume from deuterium-deuterium
    reactions. It includes energy released through the neutron-emitting and proton-emitting
    D-D branches, expressed as a volumetric power density.
  documentation: 'Deuterium-deuterium fusion power density is the local rate at which
    nuclear binding energy is released per unit plasma volume by reactions between
    deuterium ions. It is a source term for fusion product energy before any subsequent
    transport, slowing down, or wall losses. The quantity includes energy released
    in both principal D-D branches, not only the neutron-emitting branch.


    Using a total D-D reactivity summed over the neutron-emitting and proton-emitting
    branches, the local power density is


    $$

    p_{DD} = \frac{1}{2} n_D^2 \langle\sigma v\rangle_{DD} E_{DD} = \epsilon_{n,DD}\frac{E_{DD}}{f_n}

    $$


    where $n_D$ is deuterium ion density in $\mathrm{m}^{-3}$, $\langle\sigma v\rangle_{DD}$
    is the velocity-distribution-averaged total D-D reactivity in $\mathrm{m}^3\,\mathrm{s}^{-1}$,
    and $E_{DD}$ is the branch-weighted reaction energy in joules. The factor $1/2$
    avoids double counting pairs of identical deuterons. $\epsilon_{n,DD}$ is the
    neutron emissivity from the D-D neutron branch in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$
    and $f_n$ is that branch''s fraction of all D-D reactions, so neutron-branch emissivity
    is converted to total D-D power density by multiplying by $E_{DD}/f_n$. For nearly
    equal branch probabilities, $f_n \approx 0.5$; with branch energies of 3.27 MeV
    and 4.03 MeV, $E_{DD} \approx 3.65$ MeV = $5.85\times10^{-13}$ J per total D-D
    reaction, and $E_{DD}/f_n \approx 7.30$ MeV = $1.17\times10^{-12}$ J per emitted
    D-D neutron.


    In practice, this quantity may be computed from deuterium density, ion velocity
    distributions, and nuclear reactivity data, or inferred from neutron measurements.
    Tomographic inversion estimates the local D-D neutron emissivity, after which
    branch fractions and reaction energies provide the conversion to total fusion
    power density. Absolute calibration, scattered-neutron corrections, viewing geometry,
    fuel dilution, and nonthermal deuterium populations can all affect the inferred
    value.


    Typical core values in present deuterium plasmas range from 10-10^4 W m^-3 for
    thermal ion temperatures of a few to about 15 keV. Hotter plasmas or plasmas with
    strong fast-ion populations can reach 10^5-10^6 W m^-3 locally, while values near
    the cool plasma edge are often much smaller.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_power_density_due_to_fusion
