      parent_path: summary/gas_injection_accumulated/total
      parent: Total accumulated injected gas (sum over species)
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Total accumulated injected gas (sum over species).
      kind: template
  - dd_path: summary/gas_injection_prefill/total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_prefill-total-value
    dd_documentation:
