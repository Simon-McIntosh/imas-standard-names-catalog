      unit: Pa.m^3.s^-1
    enhanced_context:
      description: Gas flow rate at the exit of a gas injection pipe, representing
        the particle flux delivered to the vacuum vessel. A primary actuator quantity
        for plasma density and impurity control.
      kind: llm
