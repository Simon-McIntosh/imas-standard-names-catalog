- name: toroidal_flux_surface_averaged_lithium_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Charge-state-aggregated toroidal bulk-flow velocity of lithium ions,
    averaged over the last closed magnetic flux surface at the plasma boundary.
  documentation: 'This quantity is the toroidal component of the lithium-ion bulk-flow
    velocity, flux-surface averaged over the separatrix, which is the last closed
    magnetic flux surface at the plasma boundary. Lithium ions comprise Li+ through
    Li3+, combined using their particle densities.


    $$

    \left\langle v_{\phi,\mathrm{Li}}\right\rangle_{\mathrm{FS}} = \frac{\sum_{q=1}^{3}\left\langle
    n_{\mathrm{Li}^{q+}}v_{\phi,\mathrm{Li}^{q+}}\right\rangle_{\mathrm{FS}}}{\sum_{q=1}^{3}\left\langle
    n_{\mathrm{Li}^{q+}}\right\rangle_{\mathrm{FS}}}

    $$


    Here, $v_{\phi,\mathrm{Li}^{q+}}$ is the toroidal bulk-flow velocity of lithium
    charge state $q$, $n_{\mathrm{Li}^{q+}}$ is its number density, and $\langle\cdot\rangle_{\mathrm{FS}}$
    denotes averaging over the separatrix. The toroidal component is defined in the
    right-handed cylindrical $(R,\phi,Z)$ frame. The related [flux-surface-averaged
    lithium density at the plasma boundary](name:flux_surface_averaged_lithium_density_at_plasma_boundary)
    supplies the corresponding charge-state-summed density, not a velocity.


    Sign convention: Positive when the lithium-ion flow points in the direction of
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
