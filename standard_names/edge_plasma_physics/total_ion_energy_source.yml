name: total_ion_energy_source
status: draft
description: Volumetric source rate of total ion energy (thermal + kinetic) from all
  contributing processes, expressed as power per unit volume.
documentation: "The total ion energy source $S_{E_i}$ (in $\\mathrm{W\\,m^{-3}}$)\
  \ aggregates all volumetric contributions to the ion energy equation, including\
  \ ionization heating, charge-exchange energy transfer, recombination, ion\u2013\
  electron collisional equipartition, and external heating (NBI, ICRH). It enters\
  \ the ion energy conservation equation as $\\partial(\\frac{3}{2}n_i k_B T_i)/\\\
  partial t + \\nabla \\cdot \\mathbf{q}_i = S_{E_i}$, where $n_i$ is the ion number\
  \ density, $T_i$ the ion temperature, and $\\mathbf{q}_i$ the ion heat flux. In\
  \ edge transport codes (SOLPS-ITER, SOLEDGE2D, EMC3-EIRENE), this source is evaluated\
  \ per grid element in a generalized grid description and may reach $10^4$\u2013\
  $10^8\\;\\mathrm{W\\,m^{-3}}$ depending on proximity to the separatrix and divertor\
  \ targets. The quantity is essential for closing the energy balance in the scrape-off\
  \ layer and divertor region."
