- name: fast_ion_state_power
  kind: scalar
  status: draft
  description: Total RF wave power absorbed by the fast (suprathermal) ion population
    of a specified charge state, volume-integrated over the entire plasma and excluding
    collisional energy exchange between populations.
  documentation: 'Fast-ion-state power is the total electromagnetic-wave energy per
    unit time deposited into the fast (suprathermal) ion component of a single, specified
    ion charge state, integrated over the entire plasma volume. It is the charge-state-resolved
    fast-ion contribution to [ion_state_power](name:ion_state_power), which also includes
    the thermal population''s absorbed wave power; collisional energy exchange between
    the fast and thermal ion populations is excluded by definition. Fast ions typically
    absorb RF energy through direct wave-particle resonance mechanisms such as minority-species
    fundamental resonance or second-harmonic absorption in ion cyclotron resonance
    heating schemes.


    The quantity is the volume integral of the fast-ion absorbed power density $p_{\mathrm{fast},s}(\mathbf{r})$
    for charge state $s$:


    $$

    P_{\mathrm{fast},s} = \int_V p_{\mathrm{fast},s}(\mathbf{r}) \, dV

    $$


    where $V$ is the total plasma volume and $p_{\mathrm{fast},s}$ is the local deposition
    rate given by [fast_ion_state_power_density](name:fast_ion_state_power_density).


    In RF wave modeling, the local deposition profile is obtained from quasi-linear
    wave-particle interaction calculations, then integrated over all flux surfaces.
    Summing over all charge states of a given ion species recovers [fast_ion_power](name:fast_ion_power),
    the total fast-ion absorbed wave power without charge-state resolution. The toroidal-mode-resolved
    cumulative variant is available via [per_toroidal_mode_fast_ion_state_power](name:per_toroidal_mode_fast_ion_state_power).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_state_power
  - name:fast_ion_state_power_density
  - name:fast_ion_power
  - name:per_toroidal_mode_fast_ion_state_power
