- name: toroidal_angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Toroidal angular coordinate of the spherical mirror center of an electron
    cyclotron heating launcher.
  documentation: 'The toroidal angle $\phi_{\mathrm{mirror}}$ specifies the angular
    position of the center of the spherical mirror surface within an electron cyclotron
    (EC) heating launcher assembly, measured in the right-handed cylindrical $(R,
    \phi, Z)$ frame. This angle determines the toroidal aiming direction of the microwave
    beam launched by the mirror, which in turn sets the poloidal location of the resonance
    layer and the toroidal injection angle for current drive. The mirror center is
    distinct from the beam launching point; the latter is given by [toroidal_angle_of_launching_position](name:toroidal_angle_of_launching_position).
    Typical values range from $0$ to $2\pi$ depending on the toroidal position of
    the launcher port. The mirror radius is given by [radius_of_electron_cyclotron_launcher_mirror](name:radius_of_electron_cyclotron_launcher_mirror).


    Sign convention: Positive when the mirror center lies at an angle increasing counter-clockwise
    when viewed from above the $(R, \phi, Z)$ frame.


    The angle is obtained from engineering design drawings of the launcher assembly
    or from in-situ metrology after installation, and is used as input to beam-tracing
    codes for power deposition and current-drive calculations.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_launching_position
  - name:radius_of_electron_cyclotron_launcher_mirror
  sources:
  - id: dd:ec_launchers/mirror/geometry/centre/phi
    dd_path: ec_launchers/mirror/geometry/centre/phi
    status: composed
  - id: dd:ec_launchers/mirror/geometry/sphere_centre/phi
    dd_path: ec_launchers/mirror/geometry/sphere_centre/phi
    status: composed
- name: toroidal_angle_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of each beamlet position within a neutral
    beam injector beamlets group.
  documentation: 'The toroidal angle $\phi$ of a beamlet position defines its azimuthal
    coordinate in the IMAS right-handed cylindrical $(R, \phi, Z)$ frame, measured
    counter-clockwise when viewed from above. This angle specifies the location of
    individual beamlets within a multi-beamlet NBI source, enabling the reconstruction
    of the injection geometry for beam deposition and shine-through calculations.
    Typical NBI systems in present tokamaks, such as JET (500 kW per source) or DIII-D,
    have beamlet groups distributed over toroidal sectors of order a few degrees at
    major radii differing by centimeters. The quantity is obtained from engineering
    CAD models or alignment surveys and is routinely paired with [major_radius_of_neutral_beam_injector](name:major_radius_of_neutral_beam_injector)
    and [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector)
    to form the full three-dimensional injection point. See also [toroidal_angle_of_lower_hybrid_antenna](name:toroidal_angle_of_lower_hybrid_antenna)
    for a similarly defined quantity for LH antenna rows.


    Sign convention: Positive when the angle increases in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:major_radius_of_neutral_beam_injector
  - name:vertical_coordinate_of_neutral_beam_injector
  - name:toroidal_angle_of_lower_hybrid_antenna
