name: poloidal_component_of_center_of_mass_velocity
description: Poloidal projection of the mass-averaged velocity of the multi-species
  plasma fluid.
documentation: The poloidal center-of-mass velocity $v_{\theta,\mathrm{cm}} = (\sum_s
  m_s n_s v_{\theta,s}) / (\sum_s m_s n_s)$ is the mass-weighted average of the poloidal
  velocities $v_{\theta,s}$ over all plasma species $s$ with mass $m_s$ and number
  density $n_s$. This single-fluid velocity characterizes the net poloidal mass flow
  and enters the momentum balance and energy transport equations in multi-fluid edge
  codes such as SOLPS-ITER. In the edge and scrape-off layer, poloidal flows are driven
  by $E \times B$ drifts, diamagnetic drifts, and parallel flows projected onto the
  poloidal plane; typical magnitudes range from $10^2$ to $10^4\;\mathrm{m\,s^{-1}}$.
  The quantity is resolved per element on a generalized grid description (GGD). It
  is complementary to the toroidal and radial center-of-mass velocity components for
  a full description of the bulk plasma motion.
kind: vector_component
unit: m.s^-1
