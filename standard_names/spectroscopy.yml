- name: bragg_angle_of_crystal_spectrometer
  kind: scalar
  status: draft
  description: Angle between the incident X-ray beam and the crystal lattice planes
    at which constructive diffraction occurs, satisfying $n\lambda = 2d\sin\theta_B$.
  documentation: "The Bragg angle $\\theta_B$ is the glancing angle at which X-rays\
    \ of wavelength $\\lambda$ satisfy the Bragg condition $n\\lambda = 2d\\sin\\\
    theta_B$, where $d$ is the crystal lattice spacing (m) and $n$ is the diffraction\
    \ order (integer). This angle determines the central wavelength\u2014and hence\
    \ the photon energy\u2014accepted by the spectrometer crystal, establishing the\
    \ spectral range of the instrument. For fusion-relevant He-like and H-like impurity\
    \ lines (Ar, Fe, Kr), Bragg angles range from approximately 0.2 rad to 1.2 rad\
    \ depending on the crystal cut and target emission line. The angle is set during\
    \ instrument design and verified via alignment calibration using known spectral\
    \ lines. See also [bragg_wavelength_of_x_ray_crystal_spectrometer](name:bragg_wavelength_of_x_ray_crystal_spectrometer)\
    \ and [horizontal_radius_of_curvature_of_crystal](name:horizontal_radius_of_curvature_of_crystal)."
  unit: rad
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: diagnostic_integration_time
  kind: scalar
  status: draft
  description: Duration over which the detector accumulates signal for a single measurement
    frame.
  documentation: The integration time $\tau_{\mathrm{int}}$ (s) is the exposure interval
    during which photons or charge are collected on the detector before readout. It
    directly affects the signal-to-noise ratio (SNR $\propto \sqrt{\tau_{\mathrm{int}}}$
    in the photon-noise-limited regime) and the temporal resolution of the measurement.
    For X-ray crystal spectrometers on tokamaks, integration times range from $10^{-4}$
    s (fast transient studies) to $10^{-1}$ s (steady-state phase). The choice balances
    photon statistics against the requirement to resolve plasma dynamics such as sawtooth
    crashes or MHD activity. When the integration time varies from channel to channel,
    a per-channel value overrides the global instrument setting. See also [photon_count_rate](name:photon_count_rate).
  unit: s
  cocos_transformation_type: one_like
  tags:
  - raw-data
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: horizontal_angular_span_of_x_ray_crystal_spectrometer_crystal
  kind: scalar
  status: draft
  description: Full angular extent of the spectrometer crystal in the horizontal (dispersive)
    direction.
  documentation: "The horizontal angular span $\\Delta\\alpha_h$ (rad) is the angular\
    \ coverage of the crystal as seen from its horizontal center of curvature and\
    \ defines the wavelength bandwidth captured in a single exposure. A larger span\
    \ increases the spectral range $\\Delta\\lambda \\approx 2d\\cos\\theta_B\\,\\\
    Delta\\alpha_h / n$ (where $d$ is lattice spacing in m, $\\theta_B$ the Bragg\
    \ angle in rad, and $n$ the diffraction order) but may introduce geometric aberrations\
    \ at the detector edges. This quantity applies only to crystal geometry types\
    \ with horizontal curvature (index 2, 3, or 4). For fusion X-ray crystal spectrometers\
    \ imaging He-like and H-like emission, horizontal angular spans are on the order\
    \ of 0.05\u20130.4 rad. See also [horizontal_radius_of_curvature_of_crystal](name:horizontal_radius_of_curvature_of_crystal)\
    \ and [bragg_angle_of_crystal_spectrometer](name:bragg_angle_of_crystal_spectrometer)."
  unit: rad
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_angular_span_of_crystal
  kind: scalar
  status: draft
  description: Full angular extent of the spectrometer crystal surface in the sagittal
    (vertical) direction.
  documentation: The vertical angular span $\Delta\alpha_v$ (rad) quantifies the angular
    coverage of the crystal as seen from its center of curvature in the sagittal plane.
    It determines the vertical collection solid angle and hence the luminosity of
    the spectrometer for spatially resolved measurements. This parameter is relevant
    only for certain crystal geometry types (e.g., spherically or toroidally bent
    crystals, geometry_type index 4). Larger $\Delta\alpha_v$ increases photon throughput
    but may degrade vertical spatial resolution due to astigmatic aberrations. Values
    for fusion X-ray crystal spectrometers range from roughly 0.01 rad to 0.3 rad
    depending on crystal bending radius and plasma viewing requirements. See also
    [vertical_radius_of_curvature_of_crystal](name:vertical_radius_of_curvature_of_crystal)
    and [height_of_x_ray_crystal_spectrometer_crystal](name:height_of_x_ray_crystal_spectrometer_crystal).
  unit: rad
  tags:
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
