    status: composed
- name: surface_area_of_optical_element
  kind: scalar
  status: draft
  description: Total geometric surface area of the optically active surface or surfaces
    of an optical element. It is the actual surface area of the material region that
    can interact with radiation, not the projected aperture area.
  documentation: 'Surface area of an optical element is the total geometric area of
    the surface portions that are optically active, such as a coated mirror face,
    crystal face, polarizer face, or fiber-bundle end face. If more than one surface
    of the element is active, the areas of those surfaces are included; inactive supports,
    edges, backs, or masked regions are excluded unless they are part of the active
    optical surface.


    For an active surface region $S$, the area is defined by the surface integral:


    $$

    A = \int_S dA

    $$


    where $A$ is the surface area in m^2, $S$ is the union of the active surface patches,
    and $dA$ is the differential surface-area element in m^2.


    The value is normally obtained from the element geometry, mechanical drawings,
    metrology, or optical design models. For a flat rectangular or circular face it
    is the actual face area; for a curved mirror, lens, or crystal it is the integrated
    curved-surface area. This quantity differs from projected aperture area, which
    is the area of the element projected onto a plane normal to a chosen viewing direction
    and can be smaller than the actual surface area for tilted or curved surfaces.


    Surface area is non-negative, with physical range $A \ge 0$. Typical optical diagnostic
    elements range from about $1 \times 10^{-8}$-$1 \times 10^{-4}$ m^2 for individual
    fiber cores or small fiber-bundle faces, $1 \times 10^{-6}$-$1 \times 10^{-2}$
    m^2 for filters, polarizers, crystals, and small mirrors, and up to $10^{-1}$
    m^2 for large collection mirrors or window-like elements.'
  unit: m^2
  physics_domain: plasma_wall_interactions
  links:
