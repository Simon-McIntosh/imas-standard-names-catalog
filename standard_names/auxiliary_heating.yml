- name: fast_ion_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume-integrated absorbed wave power deposited on the fast
    ion population enclosed within a given flux surface.
  documentation: "The fast ion wave absorbed power inside a flux surface is the cumulative\
    \ volume integral $P_\\mathrm{fast}(\\psi) = \\int_0^\\psi p_\\mathrm{abs,fast}\\\
    , dV$, where $p_\\mathrm{abs,fast}$ (W m$^{-3}$) is the local absorbed wave power\
    \ density on the fast ion population and the integral runs over all plasma volume\
    \ enclosed within the flux surface labeled by $\\psi$. Fast ions \u2014 suprathermal\
    \ ions created by neutral beam injection or ion cyclotron resonance heating \u2014\
    \ absorb wave energy through resonant interaction mechanisms such as cyclotron\
    \ damping; this quantity tracks the cumulative power flowing into that suprathermal\
    \ population as a function of minor radius. In tokamak wave-heating scenarios\
    \ the fast ion channel can carry a significant fraction of the total absorbed\
    \ power, particularly near the ion cyclotron resonance layer, with values ranging\
    \ from tens of kilowatts in current experiments to multi-megawatt levels in reactor-grade\
    \ plasmas. This quantity is the fast-ion counterpart to [thermal ion wave absorbed\
    \ power inside flux surface](name:thermal_ion_wave_absorbed_power_inside_flux_surface)\
    \ and [thermal electron wave absorbed power inside flux surface](name:thermal_electron_wave_absorbed_power_inside_flux_surface);\
    \ summing all three species contributions yields the total [wave absorbed power\
    \ inside flux surface](name:wave_absorbed_power_inside_flux_surface). The toroidal-mode-resolved\
    \ variant is [per toroidal mode of fast ion wave absorbed power inside flux surface](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_inside_flux_surface),\
    \ and the local volumetric deposition rate is given by [fast ion wave absorbed\
    \ power density](name:fast_ion_wave_absorbed_power_density)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
  - name:thermal_electron_wave_absorbed_power_inside_flux_surface
  - name:wave_absorbed_power_inside_flux_surface
