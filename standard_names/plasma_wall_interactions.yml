- name: total_electron_incident_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Surface-integrated rate at which electrons from the confined plasma
    arrive at all plasma-facing wall surfaces, obtained by integrating the local incident
    electron particle flux density over the full exposed wall area.
  documentation: 'The total incident electron particle flux at the wall is the global
    rate at which electrons from the confined plasma reach all plasma-facing material
    surfaces. It represents the primary electron particle sink in the global plasma
    particle balance, governing recycling, fueling efficiency, and wall particle loading.


    The quantity is defined as:


    $$

    \Phi_e = \oint_{\text{wall}} \Gamma_e \, dA

    $$


    where $\Gamma_e$ is the local incident electron particle flux density and the
    surface integral spans all plasma-exposed wall area $A$. This integral is the
    global counterpart of the local flux density given by [electron_particle_flux_at_wall](name:electron_particle_flux_at_wall).


    In the plasma particle balance, this flux accounts for electrons leaving the confined
    plasma toward the wall via parallel transport along open field lines in the scrape-off
    layer. The complementary electron source returned to the plasma from the wall,
    including recycling and secondary emission, is described by [electron_source_rate_due_to_surface_emission](name:electron_source_rate_due_to_surface_emission).
    This quantity is computed from edge transport simulations resolving the scrape-off
    layer particle balance or from global particle balance diagnostics combining neutral
    fueling rates, pumping fluxes, and plasma density evolution. The analogous globally
    integrated energy load on the wall is given by [plasma_deposited_power_at_wall](name:plasma_deposited_power_at_wall).'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_particle_flux_at_wall
  - name:electron_source_rate_due_to_surface_emission
  - name:plasma_deposited_power_at_wall
  sources:
  - id: dd:wall/global_quantities/electrons/particle_flux_from_plasma
    dd_path: wall/global_quantities/electrons/particle_flux_from_plasma
    status: composed
- name: total_ion_density_at_limiter
  kind: scalar
  status: draft
  description: Total ion number density summed over all ion species and charge states,
    evaluated at the plasma-facing limiter surface.
  documentation: 'The total ion density at the limiter is the unweighted sum of number
    densities of all ion species and charge states present in the boundary plasma
    immediately adjacent to the limiter plasma-facing surface. It aggregates contributions
    from bulk hydrogenic fuel ions and all impurity ion populations, characterizing
    the net ion particle inventory at the plasma-material contact zone.


    The defining sum is:


    $$

    n_i^{\rm total} = \sum_s n_{i,s}

    $$


    where $n_{i,s}$ is the number density of ion species $s$ (summed over all charge
    states of that species) evaluated at the limiter location. Under quasi-neutrality,
    the local electron density satisfies $n_e \approx \sum_s \bar{Z}_s n_{i,s}$, where
    $\bar{Z}_s$ is the mean charge of species $s$, directly linking the total ion
    density to electron density diagnostics at the boundary.


    This quantity is the aggregate form of ion_density_at_limiter, which resolves
    the same density by individual species. It is closely related to [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary),
    which evaluates the equivalent species sum at the last closed flux surface, and
    to [total_ion_density_at_pedestal](name:total_ion_density_at_pedestal) for the
    pedestal region. It is typically inferred from Langmuir probe arrays mounted on
    the limiter structure, from recycling spectroscopy, or from edge transport modeling
    constrained by particle-balance measurements.


    Sign convention: Positive when ions are present at the limiter surface; number
    density is non-negative by definition for all physical plasma states.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:total_ion_density_at_plasma_boundary
  - name:total_ion_density_at_pedestal
  sources:
  - id: dd:summary/local/limiter/n_i_total/value
    dd_path: summary/local/limiter/n_i_total/value
    status: composed
- name: total_neutral_particle_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Total rate at which neutral atoms and molecules are emitted from plasma-facing
    material surfaces into the adjacent plasma-facing region by surface processes
    such as recycling of incident particles and outgassing, summed over the relevant
    wall area.
  documentation: 'Total neutral particle flux at the wall due to surface emission
    is the globally counted rate at which neutral atoms or molecules leave plasma-facing
    material surfaces and enter the adjacent plasma-facing region. It represents wall-related
    neutral production dominated by recycling of incident plasma particles neutralized
    at the surface and by thermally activated outgassing, accumulated over all participating
    wall area.


    The total emission rate is the surface integral of the local emitted neutral particle
    flux density:


    $$

    \Gamma_{\mathrm{em}} = \int_{A_{\mathrm{wall}}} \gamma_{\mathrm{em}}(\mathbf{x})
    \, dA

    $$


    where $\Gamma_{\mathrm{em}}$ is the total neutral emission rate in s^-1, $A_{\mathrm{wall}}$
    is the plasma-facing wall area included in the sum, $\gamma_{\mathrm{em}}(\mathbf{x})$
    is the local outward neutral particle flux density in m^-2 s^-1 at surface position
    $\mathbf{x}$, and $dA$ is a surface area element.


    This quantity is the neutral-species, wall-integrated counterpart of the local
    emitted flux density carried by [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall).
    It is numerically equivalent to the global emission term [neutral_particle_source_rate_at_wall_due_to_surface_emission](name:total_neutral_particle_flux_at_wall_due_to_surface_emission),
    which expresses the same surface-integrated neutral release as a plasma source
    term, and it is the neutral-specific case of the species-general integrated rate
    particle_flux_due_to_surface_emission.


    In practice the quantity is computed by integrating local wall-emission estimates
    from particle-balance analysis or plasma-wall interaction models. Experimental
    constraints come indirectly from neutral pressure measurements, spectroscopic
    neutral line emission, fueling and exhaust balance, and estimates of incident
    particle fluxes combined with recycling yields.


    Typical integrated rates range from 10^20-10^22 s^-1 in small or low-density plasmas
    and from 10^22-10^24 s^-1 in medium and large tokamak discharges, with short recycling
    or outgassing transients producing larger instantaneous rates.


    Sign convention: Positive when neutral particles are emitted away from the material
    wall surface into the plasma-facing region.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall
  sources:
  - id: dd:wall/global_quantities/neutral/particle_flux_from_wall
    dd_path: wall/global_quantities/neutral/particle_flux_from_wall
    status: composed
- name: tritium_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of tritium ions in the plasma immediately adjacent to
    a plasma-facing limiter surface.
  documentation: 'Tritium density at a limiter is the local number density of tritium
    ions $T^+$ in the scrape-off-layer plasma immediately adjacent to a plasma-facing
    limiter surface. It is a species-resolved ion density, not a neutral tritium density,
    surface inventory, or particle flux. As a number density it is a non-negative
    scalar measured per unit volume.


    The local density is the tritium-ion particle count per infinitesimal plasma volume
    at the limiter-adjacent location:


    $$

    n_T = \frac{dN_T}{dV}

    $$


    where $dN_T$ is the number of tritium ions in the volume element $dV$, and $n_T$
    has units of $\mathrm{m}^{-3}$. If an electron-normalized isotope fraction is
    used, [tritium_fraction](name:ratio_of_tritium_density_to_electron_density) corresponds
    to $n_T/n_e$, where $n_e$ is the electron density in $\mathrm{m}^{-3}$; it is
    not a fraction of total ion density unless that convention is stated separately.


    In practice this quantity is inferred from isotope-resolved edge spectroscopy,
    neutral and ion source modeling, probe-constrained scrape-off-layer analysis,
    or edge transport simulations. Its value reflects the local balance between parallel
    transport along open field lines, ionization of recycled tritium neutrals, cross-field
    transport, and ion loss to the material surface. It should not be assumed to have
    a fixed ordering relative to [tritium_density_at_plasma_boundary](name:tritium_density_at_plasma_boundary),
    [tritium_density_at_pedestal](name:tritium_density_at_pedestal), or [tritium_density_at_divertor_target](name:tritium_density_at_divertor_target),
    because recycling strength, fueling mix, geometry, and plasma conditions can change
    the local limiter-adjacent density.


    Representative limiter scrape-off-layer tritium-ion densities can span roughly
    $10^{17}-10^{20}\ \mathrm{m}^{-3}$ in deuterium-tritium operation, with the tritium
    component set by both the local plasma density and the isotope composition. Values
    may be much lower in low-tritium or trace-tritium plasmas and can vary strongly
    over the limiter surface and during transient plasma-wall interaction events.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_tritium_density_to_electron_density
  - name:tritium_density_at_plasma_boundary
  - name:tritium_density_at_pedestal
  - name:tritium_density_at_divertor_target
  arguments:
  - name: density_at_limiter
    operator: tritium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/tritium/value
    dd_path: summary/local/limiter/n_i/tritium/value
    status: composed
- name: tungsten_density
  kind: scalar
  status: draft
  description: Total number density of tungsten ions in the plasma, summed over all
    ionization states from W$^{1+}$ through W$^{74+}$, excluding neutral tungsten
    atoms.
  documentation: "Tungsten density is the local number density of ionized tungsten\
    \ in a plasma, aggregated across all charge states from W$^{1+}$ through W$^{74+}$,\
    \ without including neutral tungsten atoms. Tungsten is introduced into the plasma\
    \ primarily through sputtering and erosion of plasma-facing components; because\
    \ of its high atomic number, even trace concentrations can increase radiative\
    \ losses substantially and degrade energy confinement.\n\nThe total tungsten ion\
    \ density is defined as:\n\n$$\nn_W = \\sum_{q=1}^{74} n_{W^{q+}}\n$$\n\nwhere\
    \ $n_{W^{q+}}$ is the number density of tungsten ions in charge state $q$.\n\n\
    At concentrations $n_W/n_e \\sim 10^{-5}$\u2013$10^{-4}$, partially ionized tungsten\
    \ radiates copiously in the vacuum ultraviolet and soft X-ray ranges, driving\
    \ hollow temperature profiles and degrading H-mode performance. The [ratio of\
    \ tungsten density to electron density](name:ratio_of_tungsten_density_to_electron_density)\
    \ is the standard dimensionless measure of tungsten contamination, while the [volume-averaged\
    \ tungsten density](name:volume_averaged_tungsten_density) characterizes the total\
    \ confined tungsten inventory. In experiments, $n_W$ is inferred from spectroscopic\
    \ measurement of tungsten line emission \u2014 typically in the vacuum ultraviolet\
    \ or soft X-ray spectral range \u2014 combined with atomic data for the charge-state\
    \ distribution.\n\nSign convention: Positive when tungsten ions are present in\
    \ the plasma region of interest."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_tungsten_density_to_electron_density
  - name:volume_averaged_tungsten_density
  sources:
  - id: dd:summary/line_average/n_i/tungsten/value
    dd_path: summary/line_average/n_i/tungsten/value
