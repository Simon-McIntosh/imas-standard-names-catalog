name: parallel_ion_momentum_diffusivity
status: draft
description: Effective diffusion coefficient for ion momentum transport along the
  magnetic field direction, parameterizing collisional and turbulent parallel viscosity.
documentation: "The parallel ion momentum diffusivity $D_{\\parallel,i}^{\\mathrm{mom}}$\
  \ (in $\\mathrm{m^2\\,s^{-1}}$) characterizes the diffusive transport of ion parallel\
  \ momentum along the magnetic field line direction $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$.\
  \ The parallel momentum flux is modeled as $\\Pi_{\\parallel}^{\\mathrm{mom}} =\
  \ -n_i m_i D_{\\parallel,i}^{\\mathrm{mom}} \\nabla_{\\parallel} v_{\\parallel,i}$,\
  \ where $n_i$ is the ion number density, $m_i$ the ion mass, and $v_{\\parallel,i}$\
  \ the parallel ion flow velocity. In classical Braginskii theory the parallel viscosity\
  \ coefficient scales as $\\eta_0 \\propto n_i T_i \\tau_i$, with $\\tau_i$ the ion\u2013\
  ion collision time, yielding $D_{\\parallel,i}^{\\mathrm{mom}} \\sim 0.1$\u2013\
  $10\\;\\mathrm{m^2\\,s^{-1}}$ under typical scrape-off layer conditions ($T_i \\\
  sim 1$\u2013$100\\;\\mathrm{eV}$, $n_i \\sim 10^{18}$\u2013$10^{20}\\;\\mathrm{m^{-3}}$).\
  \ Anomalous contributions from turbulence can exceed the neoclassical value, especially\
  \ near the separatrix. This quantity is used in GGD-based edge fluid codes (SOLPS-ITER,\
  \ SOLEDGE2D, UEDGE) to close the momentum equation along $\\mathbf{B}$. See `ion_momentum_radial_diffusivity`\
  \ for the cross-field counterpart and `parallel_ion_particle_diffusivity` for the\
  \ particle transport analog."
