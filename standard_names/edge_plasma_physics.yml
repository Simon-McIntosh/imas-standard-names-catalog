- name: radial_total_current_density
  kind: scalar
  status: active
  description: Radial total current density is the component of the total electric
    current density resolved normal to magnetic flux surfaces, summing ohmic, bootstrap,
    and externally driven contributions over all plasma species and charge states.
  documentation: "The radial total current density is the component of the aggregated\
    \ current density vector [total_current_density](name:total_current_density) resolved\
    \ in the direction normal to magnetic flux surfaces. It sums all current-carrying\
    \ mechanisms \u2014 ohmic induction, bootstrap, and externally driven currents\
    \ \u2014 over all resolved species and charge states. This cross-flux-surface\
    \ radial direction is distinct from the cylindrical major-radius $\\hat{R}$ direction\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius\
    \ and $Z$ is vertical height.\n\nThe aggregate radial current density satisfies:\n\
    \n$$\nJ_r = J_{\\mathrm{ohmic},r} + J_{\\mathrm{bootstrap},r} + J_{\\mathrm{drive},r}\n\
    $$\n\nwhere $J_{\\mathrm{ohmic},r}$, $J_{\\mathrm{bootstrap},r}$, and $J_{\\mathrm{drive},r}$\
    \ are the ohmic, bootstrap, and externally driven contributions projected onto\
    \ the flux-surface-normal direction, each in A m$^{-2}$.\n\nIn edge plasma models,\
    \ the radial current density is resolved on generalized geometry grids spanning\
    \ the pedestal, scrape-off layer, and divertor region. It appears in current continuity\
    \ equations and the perpendicular Ohm's law governing cross-field charge transport,\
    \ complementing the field-aligned [parallel_total_current_density](name:parallel_total_current_density)\
    \ and azimuthal toroidal_total_current_density projections of the same total current.\n\
    \nSign convention: Positive when conventional current flows outward along the\
    \ flux-surface normal, away from the magnetic axis."
  unit: A.m^-2
