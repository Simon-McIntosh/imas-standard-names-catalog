    enhanced_context:
      description: Oxygen (O).
      kind: template
- name: flux_surface_averaged_tungsten_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of positively charged tungsten
    ions on the last closed magnetic flux surface, summed over all ionization states.
  documentation: 'This quantity is the number density of tungsten ions averaged over
    the last closed magnetic flux surface, with all positive ionization states included
    and neutral tungsten excluded. It is the surface-averaged counterpart of the local
    [tungsten density at the plasma boundary](name:flux_surface_averaged_tungsten_density_at_plasma_boundary).


    The flux-surface average at the plasma-boundary flux label is defined by


    $$

    \langle n_{\mathrm{W}} \rangle_{\psi_b} = \frac{\oint_{\psi=\psi_b} n_{\mathrm{W}}\,d\ell_p/B_p}{\oint_{\psi=\psi_b}
    d\ell_p/B_p}

    $$


    where $\psi_b$ is the flux label of the plasma boundary, $n_{\mathrm{W}}$ is the
    local summed tungsten-ion density, $d\ell_p$ is poloidal contour length, and $B_p$
    is the poloidal magnetic-field magnitude. The quantity is distinct from [volume-averaged
    tungsten density](name:volume_averaged_tungsten_density), which averages over
    the enclosed plasma volume.


    Sign convention: Positive when the flux-surface average represents a positive
    count of tungsten ions on the boundary, rather than a signed perturbation.'
  unit: m^-3
  physics_domain: edge_plasma_physics
