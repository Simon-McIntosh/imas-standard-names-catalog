    operator_kind: qualifier
- name: left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Complex phasor of the left-hand circularly polarized component of the
    wave electric field along a beam-tracing path. It is the E+ projection in the
    local transverse basis (x, y, b), with x cross y in the b direction and b parallel
    to the local background magnetic field.
  documentation: 'The left-hand circularly polarized wave electric field, $E_+$, is
    the complex phasor obtained by projecting the transverse wave electric-field vector
    onto the circular polarization that follows positive-ion gyration about the local
    background magnetic field. It represents the rotating electric-field component
    relevant for ion-cyclotron resonant coupling, while actual damping and species
    heating also depend on resonance location, wave frequency, composition, and the
    plasma dielectric response.


    In the local orthonormal triad $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$,
    $\hat{x}\perp\hat{b}$, $\hat{y}\perp\hat{b}$, and $\hat{x}\times\hat{y}=\hat{b}$,
    the phasor is defined by


    $$

    E_+ = \frac{E_x + iE_y}{\sqrt{2}}

    $$


    where $E_x$ and $E_y$ are the complex phasor components of the transverse wave
    electric field along $\hat{x}$ and $\hat{y}$, $i$ is the imaginary unit, and $E_+$,
    $E_x$, and $E_y$ have unit $\mathrm{V\,m^{-1}}$. The physical time-dependent field
    is recovered with the convention $\operatorname{Re}[(E_x\hat{x}+E_y\hat{y})\exp(-i\omega
    t)]$, where $\omega$ is the wave angular frequency. With the complementary right-hand
    component $E_-=(E_x-iE_y)/\sqrt{2}$, the transverse phasor is reconstructed as
    $E_x=(E_+ + E_-)/\sqrt{2}$ and $E_y=-i(E_+ - E_-)/\sqrt{2}$; the real and imaginary
    quadratures are [left_hand_circularly_polarized_wave_electric_field_real_part](name:left_hand_circularly_polarized_wave_electric_field_real_part)
    and [left_hand_circularly_polarized_wave_electric_field_imaginary_part](name:left_hand_circularly_polarized_wave_electric_field_imaginary_part),
    and the envelope is [left_hand_circularly_polarized_wave_electric_field_amplitude](name:left_hand_circularly_polarized_wave_electric_field_amplitude).


    Along a beam-tracing ray, $E_+$ is computed by solving the wave propagation equations
    using the cold- or warm-plasma dielectric response, expressing the resulting [wave_electric_field](name:wave_electric_field)
    in the local basis $(\hat{x}, \hat{y}, \hat{b})$, and applying the circular-polarization
    projection. It is usually a derived complex quantity rather than a directly measured
    observable; boundary conditions may come from antenna, launcher, or polarization-sensitive
    diagnostic information.


    Typical magnitudes depend strongly on launched power, focusing, absorption, and
    normalization, but values of about $10^1$-$10^5\ \mathrm{V\,m^{-1}}$ are common
    in radio-frequency wave-heating calculations. The ratio $|E_+|/|E_-|$ and the
    relative phase between the two circular components characterize the polarization
    ellipticity and influence resonant absorption, but they do not by themselves determine
    preferential ion-species heating.


    Sign convention: Positive when the real amplitude of a purely left-hand, zero-phase
    phasor makes the physical electric field point along $+\hat{x}$ at $t=0$ and rotate
    from $+\hat{x}$ toward $-\hat{y}$ about $+\hat{b}$ in the local orthonormal basis
    $(\hat{x}, \hat{y}, \hat{b})$ with $\hat{x}\times\hat{y}=\hat{b}$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:left_hand_circularly_polarized_wave_electric_field_real_part
  - name:left_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  - name:right_hand_circularly_polarized_wave_electric_field_real_part
  - name:right_hand_circularly_polarized_wave_electric_field_imaginary_part
  - name:wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: left_hand_circularly_polarized
    operator_kind: qualifier
- name: parallel_wave_electric_field
  kind: scalar
  status: draft
  description: Complex scalar phasor of the oscillatory (time-harmonic) wave electric
    field projected onto the local equilibrium magnetic-field direction. Its modulus
    gives the magnitude of the parallel component and its argument gives the phase
    relative to the chosen time convention.
  documentation: 'The parallel wave electric field is the component of a time-harmonic
    wave electric-field phasor resolved along the local equilibrium magnetic-field
    direction. As a complex scalar it carries both the magnitude and the phase of
    the parallel oscillation: its modulus is the parallel phasor magnitude and its
    argument is the phase relative to a fixed time-harmonic reference.


    The projection is defined by


    $$

    E_{\parallel} = \hat{b} \cdot \tilde{\mathbf{E}}

    $$


    where $\tilde{\mathbf{E}}$ is the complex wave electric-field phasor in $\mathrm{V\,m^{-1}}$
    and $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$ is the dimensionless unit vector along
    the local equilibrium magnetic field $\mathbf{B}_0$. The complex phasor is reconstructed
    from its in-phase and quadrature parts as $E_{\parallel} = \mathrm{Re}[E_{\parallel}]
    + i\,\mathrm{Im}[E_{\parallel}]$, held respectively by [parallel_wave_electric_field_real_part](name:parallel_wave_electric_field_real_part)
    and [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part).
    If the physical field is written as $\mathrm{Re}[\tilde{\mathbf{E}}\exp(-i\omega
    t)]$, the real and imaginary parts are the in-phase and quadrature amplitudes;
    adopting the opposite time convention complex-conjugates the phasor describing
    the same physical field.


    In practice $E_{\parallel}$ is obtained by projecting a measured, reconstructed,
    or beam/ray-traced complex wave electric field onto the local magnetic-field direction.
    It vanishes only where the electric-field phasor is exactly orthogonal to $\hat{b}$;
    a wave vector perpendicular to $\mathbf{B}_0$ does not by itself force $E_{\parallel}=0$,
    because the wave polarization can still retain a field component along the magnetic
    field.


    Magnitudes span a very wide range that depends strongly on wave frequency, launched
    power, coupling efficiency, and plasma location: weak diagnostic or probing fields
    are small, while radio-frequency heating and current-drive fields can be locally
    much larger. Quantitative values should be taken from the specific scenario rather
    than assumed.


    Sign convention: Positive when the in-phase component of the wave electric-field
    phasor points along the local equilibrium magnetic-field unit vector $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$.'
  unit: V.m^-1
