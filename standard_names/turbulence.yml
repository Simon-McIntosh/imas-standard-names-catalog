- name: normalized_energy_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Gyro-Bohm-normalized contribution of perturbed parallel magnetic field
    fluctuations to the total turbulent radial energy flux, obtained by summing over
    the full wavevector spectrum in a nonlinear gyrokinetic simulation. The result
    is dimensionless and directly comparable across devices and plasma conditions.
  documentation: 'In nonlinear gyrokinetic turbulence simulations, the total turbulent
    energy flux across a flux surface is decomposed into three electromagnetic channel
    contributions driven by the electrostatic potential $\delta\phi$, the perturbed
    parallel vector potential $\delta A_\parallel$, and the perturbed parallel magnetic
    field $\delta B_\parallel$. This quantity is the $\delta B_\parallel$ channel
    contribution, normalized to the gyro-Bohm energy flux reference $Q_\mathrm{gB}$:


    $$\hat{Q}_{\delta B_\parallel} = \frac{Q_{\delta B_\parallel}}{Q_\mathrm{gB}}$$


    where the gyro-Bohm reference is $Q_\mathrm{gB} = n_\mathrm{ref}\, T_\mathrm{ref}\,
    v_{\mathrm{th,ref}}\, (\rho_\mathrm{ref}/L_\mathrm{ref})^2$, with $v_\mathrm{th,ref}
    = \sqrt{T_\mathrm{ref}/m_\mathrm{ref}}$ the thermal speed of the reference species,
    $\rho_\mathrm{ref} = v_\mathrm{th,ref}/\Omega_\mathrm{ref}$ the gyroradius, and
    $L_\mathrm{ref}$ a macroscopic reference length (commonly the minor radius). The
    physical energy flux $Q_{\delta B_\parallel}$ is computed as a flux-surface and
    time average of the radial energy-flow density driven by the $\delta B_\parallel$
    perturbation in the frame co-rotating with the plasma, summed over all species.


    The decomposition of the total normalized energy flux reads:


    $$\hat{Q}_\mathrm{total} = \hat{Q}_{\delta\phi} + \hat{Q}_{\delta A_\parallel}
    + \hat{Q}_{\delta B_\parallel}$$


    and this quantity represents the third (magnetic compressibility) term. In the
    local flux-tube limit, the wavevector-space average $\langle \cdots \rangle_{k_x,
    k_y}$ is performed over the full two-dimensional spectrum in the plane perpendicular
    to the magnetic field before the result is reported as a single scalar per flux
    surface. The species contributions may be stored individually or summed, depending
    on the simulation context; where stored at the integrated level the sum over all
    simulated species is understood.


    The $\delta B_\parallel$ channel is typically small compared with the electrostatic
    or $\delta A_\parallel$ channels in low-to-moderate $\beta$ plasmas. In high-$\beta$
    regimes where magnetic compressibility is significant, it can reach several percent
    of the total energy flux and can even exceed the $\delta A_\parallel$ contribution.
    Normalized values typically lie in the range $\hat{Q}_{\delta B_\parallel} \in
    [-0.5, 2]$ in standard tokamak core conditions, with larger values possible in
    high-$\beta$ or reversed-shear scenarios.


    Sign convention: Positive when the net energy flux driven by $\delta B_\parallel$
    is directed radially outward, away from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_flux_due_to_perturbed_parallel_magnetic_field
  - name:parallel_component_of_toroidal_momentum_flux_due_to_perturbed_parallel_magnetic_field
  - name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential
