- name: transverse_half_width_of_electron_cyclotron_wave_beam
  kind: scalar
  status: draft
  description: Transverse half-width of the electron cyclotron wave beam at a given
    point along the ray path, defined as the distance from the central ray to the
    boundary of the beam spot along one principal axis of the elliptical cross-section
    perpendicular to the local propagation direction.
  documentation: "In beam-tracing formalism, the cross-section of an electron cyclotron\
    \ (EC) wave beam perpendicular to its local propagation direction is approximated\
    \ as an ellipse with two principal half-widths. This quantity is one such half-width\
    \ \u2014 the distance from the central ray to the $1/e$ amplitude (or equivalently\
    \ $1/e^2$ intensity) boundary of the Gaussian-profile beam spot along a specified\
    \ principal axis. The two principal half-widths $w_1$ and $w_2$ together fully\
    \ characterize the elliptical beam spot; their product $w_1 w_2$ is proportional\
    \ to the spot area.\n\nIn standard beam-tracing theory, the complex beam width\
    \ evolves along the ray according to the paraxial wave equation. The real part\
    \ of the curvature tensor $\\mathbf{\\Pi}$ governs focusing and defocusing of\
    \ the phase front, while the imaginary part governs the Gaussian amplitude envelope.\
    \ The half-width $w$ along a given principal axis satisfies\n$$w(s) = w_0 \\sqrt{1\
    \ + \\left(\\frac{s - s_0}{z_R}\\right)^2}$$\nin free space, where $s$ is the\
    \ arc length along the central ray, $s_0$ is the beam waist position, $w_0$ is\
    \ the minimum half-width, and $z_R = \\pi w_0^2 / \\lambda$ is the Rayleigh range.\
    \ In a magnetized plasma, refraction and diffraction modify this evolution, but\
    \ the $1/e$ amplitude convention defining the boundary remains the same.\n\nTypical\
    \ values range from a few millimeters near the antenna aperture to several centimeters\
    \ deeper in the plasma for heating and current-drive scenarios in medium-size\
    \ tokamaks. The arc-length coordinate along the beam at which this half-width\
    \ is evaluated is given by [arc_length_along_electron_cyclotron_wave_beam](name:arc_length_along_electron_cyclotron_wave_beam).\
    \ The companion quantity [beam_spot_size](name:beam_spot_size) encodes both principal\
    \ half-widths of the elliptical cross-section at each position, with the first\
    \ index corresponding to the horizontal principal axis and the second to the vertical\
    \ principal axis."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:arc_length_along_electron_cyclotron_wave_beam
  - name:beam_spot_size
  constraints: []
  sources:
  - id: dd:ece/channel/beam_tracing/beam/spot/size
    dd_path: ece/channel/beam_tracing/beam/spot/size
    status: composed
- name: vertical_component_of_wave_vector
  kind: scalar
  status: draft
  description: Vertical (Z) component of the wave vector along a beam or ray path
    in beam-tracing calculations for electromagnetic waves propagating in a magnetized
    plasma.
  documentation: "The vertical wave-vector component $k_Z$ is the projection of the\
    \ local [wave vector](name:wave_vector) onto the $\\hat{Z}$ axis of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $Z$ is the vertical height coordinate.\
    \ Together with the radial and toroidal components, $k_Z$ fully characterizes\
    \ the local propagation direction and phase advance of a wave beam; the dispersion\
    \ relation $D(\\omega, \\mathbf{k}, \\mathbf{r}) = 0$ links all three components\
    \ to the local plasma dielectric properties. In beam-tracing or ray-tracing formalisms,\
    \ $k_Z$ evolves along the ray according to $dk_Z/d\\tau = -\\partial D/\\partial\
    \ Z$, where $\\tau$ is the ray path parameter and $Z$-gradients of the equilibrium\
    \ (density, temperature, magnetic field) drive the refraction. Typical magnitudes\
    \ span $10^{0}$\u2013$10^{3}$ m$^{-1}$ depending on wave frequency and plasma\
    \ conditions; electron cyclotron beams near the plasma core tend to have smaller\
    \ $|k_Z|$ than microwave reflectometry probing the edge. The complementary propagation\
    \ component is the [toroidal_component_of_wave_vector](name:toroidal_component_of_wave_vector),\
    \ and the spatial position along the beam is tracked by [arc_length_along_electron_cyclotron_wave_beam](name:arc_length_along_electron_cyclotron_wave_beam)."
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_vector
  - name:toroidal_component_of_wave_vector
  - name:arc_length_along_electron_cyclotron_wave_beam
  constraints: []
  arguments:
  - name: wave_vector
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:ece/channel/beam_tracing/beam/wave_vector/k_z
    dd_path: ece/channel/beam_tracing/beam/wave_vector/k_z
    status: composed
- name: vertical_coordinate_of_delta_position
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the suprathermal electron emission position
    offset relative to the nominal ECE channel measurement position, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical coordinate $Z$ of the delta position quantifies the\
    \ spatial offset in the $Z$-direction (vertical height) of the suprathermal electron\
    \ emission location from the nominal electron cyclotron emission (ECE) channel\
    \ measurement position. Suprathermal electrons \u2014 those with energies well\
    \ above the bulk thermal energy \u2014 emit ECE radiation at shifted spatial positions\
    \ due to their non-Maxwellian velocity distribution and relativistic downshift\
    \ of the cyclotron resonance frequency, causing their apparent emission locus\
    \ to differ from the bulk thermal resonance layer. This vertical offset $\\Delta\
    \ Z$ is used together with the companion [major radius offset](name:major_radius_of_delta_position)\
    \ to fully characterize the displacement of the suprathermal emission position\
    \ from the nominal channel position in the poloidal plane. The offset is determined\
    \ by forward modeling of the relativistic resonance condition $\\omega = n \\\
    Omega_{ce} / \\gamma$, where $\\omega$ is the wave angular frequency, $n$ is the\
    \ harmonic number, $\\Omega_{ce} = eB/m_e$ is the non-relativistic electron cyclotron\
    \ frequency, and $\\gamma$ is the Lorentz factor of the emitting electrons. Typical\
    \ offsets are of order millimeters to a few centimeters depending on the suprathermal\
    \ tail energy and the magnetic field geometry. The [radial displacement of the\
    \ suprathermal emission position](name:radial_displacement_of_suprathermal_emission_position)\
    \ provides the equivalent quantity expressed as a radial displacement rather than\
    \ an absolute coordinate.\n\nSign convention: Positive when the suprathermal emission\
    \ position is displaced upward, in the direction of increasing $Z$ (vertical height\
    \ above the midplane)."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:major_radius_of_delta_position
  - name:radial_displacement_of_suprathermal_emission_position
  constraints: []
  sources:
  - id: dd:ece/channel/delta_position_suprathermal/z
    dd_path: ece/channel/delta_position_suprathermal/z
    status: composed
- name: vertical_coordinate_of_third_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the third defining point of a diagnostic
    line-of-sight chord in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z$ of the third point of a diagnostic line-of-sight,
    measured in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is the
    major radius and $Z$ is the height above the midplane. Together with the corresponding
    major-radius coordinate [major_radius_of_third_point_of_line_of_sight](name:major_radius_of_third_point_of_line_of_sight)
    and toroidal angle, this coordinate fully specifies the spatial location of the
    third waypoint used to define a piecewise-linear diagnostic chord. Such chords
    are employed by bolometers, interferometers, polarimeters, and density-control
    systems to trace the geometric path of radiation or microwave beams through the
    plasma. The three-point representation allows non-straight or refracted line-of-sight
    geometries to be approximated; together with [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight)
    and [vertical_coordinate_of_second_point_of_line_of_sight](name:vertical_coordinate_of_second_point_of_line_of_sight),
    it completes the $Z$-coordinate set for the full chord definition given by the
    parent [coordinate_of_third_point_of_line_of_sight](name:coordinate_of_third_point_of_line_of_sight).
    Typical values range from roughly $-2$ m to $+2$ m for medium-size tokamaks, spanning
    the vertical extent of the plasma cross-section.


    Sign convention: Positive when the point lies above the geometric midplane of
    the device, in the direction of increasing $Z$.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:major_radius_of_third_point_of_line_of_sight
