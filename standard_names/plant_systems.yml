- name: temperature_of_port
  kind: scalar
  status: draft
  description: Bulk fluid temperature at the inlet or outlet port of a balance-of-plant
    component.
  documentation: "The fluid temperature at a balance-of-plant component port defines\
    \ the thermal state of the working fluid (coolant) as it enters or exits the component,\
    \ such as a heat exchanger, pump, or valve. This temperature is a key thermodynamic\
    \ state variable, used together with the fluid pressure to determine the specific\
    \ enthalpy and, combined with the mass flow rate, to compute the thermal power\
    \ transferred across the port. In the power-plant thermal cycle, the port temperature\
    \ is measured by thermocouples or resistance temperature detectors (RTDs) at the\
    \ pipe flange or manifold. Typical fluid temperatures range from 30\u201360\xB0\
    C in the low-pressure side of the heat rejection loop to 300\u2013500\xB0C in\
    \ the primary coolant loop of a fusion power plant. The port temperature is closely\
    \ related to the [pressure_of_port](name:pressure_of_port), which together define\
    \ the fluid equation of state, and to the [thermal_power_of_port](name:thermal_power_of_port)\
    \ calculated from the temperature difference across the component."
  unit: K
  physics_domain: plant_systems
  links:
  - name:pressure_of_port
  - name:thermal_power_of_port
  sources:
  - id: dd:balance_of_plant/power_plant/system/component/port/temperature
    dd_path: balance_of_plant/power_plant/system/component/port/temperature
    status: composed
- name: toroidal_angle_of_pellet
  kind: scalar
  status: draft
  description: "Toroidal angle coordinate of a pellet's position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, defining the poloidal-plane location of any\
    \ point along its injection trajectory."
  documentation: "The toroidal angle $\\phi$ specifies the azimuthal position of a\
    \ pellet relative to the machine symmetry axis in the cylindrical $(R, \\phi,\
    \ Z)$ coordinate system. This coordinate is used to define the location of the\
    \ pellet at its launch point, during flight, or at the shattering position along\
    \ the injection path, depending on the context. The toroidal angle is a critical\
    \ geometric parameter for shattered pellet injectors and other fueling systems,\
    \ as it determines the toroidal alignment of the injected material with the plasma\
    \ and affects the resulting deposition and mixing. Typical values span the full\
    \ $0$\u2013$2\\pi$ range toroidally, with the injection launch point often located\
    \ on the low-field side or a specific sector. This quantity is related to the\
    \ full position vector and can be paired with the [major_radius_of_pellet](name:major_radius_of_pellet)\
    \ coordinate to locate the pellet in the poloidal plane. See also the [toroidal_angle_of_pellet_path](name:toroidal_angle_of_pellet_path)\
    \ for the launch-point-specific variant.\n\nSign convention: Positive when $\\\
    phi$ increases counter-clockwise when viewed from above the torus (along the $+\\\
    hat{Z}$ direction)."
  unit: rad
  physics_domain: plant_systems
  links:
  - name:major_radius_of_pellet
  - name:toroidal_angle_of_pellet_path
  sources:
  - id: dd:spi/injector/pellet/position/phi
    dd_path: spi/injector/pellet/position/phi
    status: composed
