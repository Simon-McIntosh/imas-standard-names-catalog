  kind: scalar
  status: active
  description: Ethane prefill count is the total amount of neutral ethane (C2H6) introduced
    before plasma breakdown, expressed as an equivalent-electron count with 18 equivalent
    electrons per molecule.
  documentation: 'Ethane prefill count is the total amount of neutral ethane (C2H6)
    introduced during the prefill phase before plasma breakdown, expressed as an equivalent-electron
    count. Each neutral ethane molecule contributes 18 equivalent electrons: 12 from
    its two carbon atoms and 6 from its six hydrogen atoms.


    The equivalent-electron count is defined by


    $$

    N_{e,\mathrm{eq}}^{\mathrm{C_2H_6,prefill}} = 18N_{\mathrm{C_2H_6,prefill}} =
    \int_{t_0}^{t_{\mathrm{bd}}}18\dot{N}_{\mathrm{C_2H_6}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{C_2H_6,prefill}}$ and $N_{\mathrm{C_2H_6,prefill}}$
    are pure counts, $\dot{N}_{\mathrm{C_2H_6}}$ is the neutral-ethane introduction
    rate in molecules s$^{-1}$, and $t_0$, $t_{\mathrm{bd}}$, and $t$ are the prefill
    start, plasma-breakdown, and time variables in seconds.


    This quantity includes only neutral ethane introduced before breakdown and excludes
    wall recycling, neutral-beam or pellet fueling, later gas injection, and retained
    or ionized inventory. It is the ethane component of [prefill_count](name:prefill_count);
    [accumulated_ethane_count](name:accumulated_ethane_count) represents distinct
    post-breakdown accumulation, while [ethylene_prefill_count](name:ethylene_prefill_count)
    applies the same convention to a different hydrocarbon.'
