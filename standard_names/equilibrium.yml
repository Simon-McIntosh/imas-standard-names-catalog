- name: vertical_coordinate_of_plasma_boundary
  kind: scalar
  status: draft
  description: Vertical position of points on the plasma-boundary contour in the right-handed
    cylindrical (R, phi, Z) frame, defining boundary height in the poloidal cross-section.
  documentation: 'This quantity gives the height coordinate of a point on the plasma
    boundary, the outer closed contour separating confined plasma from the surrounding
    scrape-off or vacuum region. Because a boundary is a contour rather than a single
    point, an individual value is defined together with a contour parameter or ordered
    boundary point; global shape measures such as [elongation](name:elongation) and
    [area of the plasma boundary](name:area_of_plasma_boundary) summarize the same
    contour.


    A boundary point can be written in the right-handed cylindrical $(R, \phi, Z)$
    frame as


    $$

    \mathbf{x}_b(s) = R_b(s)\,\hat{R} + Z_b(s)\,\hat{Z}

    $$


    where $s$ labels position along the poloidal boundary contour, $R_b(s)$ is the
    major-radius coordinate, and $Z_b(s)$ is the vertical coordinate. The related
    [vertical coordinate of the geometric axis](name:vertical_coordinate_of_geometric_axis)
    provides a central reference for interpreting the upper and lower boundary heights.


    The boundary height is computed from equilibrium reconstruction using magnetic
    measurements, pressure and current constraints, and, when available, internal
    magnetic-field diagnostics. Representative values span about -3 to 3 m in medium-size
    tokamaks and a wider range in reactor-scale devices; gap-control applications
    compare this coordinate with the [vertical coordinate of the closest wall point](name:vertical_coordinate_of_closest_wall_point)
    or a [plasma boundary gap reference point](name:vertical_coordinate_of_plasma_boundary_gap_reference_point).


    Sign convention: Positive when the boundary point lies in the $+Z$ direction of
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:elongation
  - name:area_of_plasma_boundary
  - name:vertical_coordinate_of_geometric_axis
  - name:vertical_coordinate_of_closest_wall_point
