- name: coolant_transit_time_of_plant_component_port
  kind: scalar
  status: active
  description: Elapsed time for coolant to traverse the associated plant component
    from inlet to outlet, defining the thermal delay between the two coolant states.
  documentation: 'Coolant transit time is the elapsed travel time for the coolant
    stream to pass through the plant component associated with the specified port,
    from its inlet to its outlet. It represents the transport delay between the inlet
    and outlet thermal states.


    The transit time is defined as


    $$

    \tau_{\mathrm{c}} = t_{\mathrm{out}} - t_{\mathrm{in}}

    $$


    where $\tau_{\mathrm{c}}$ is the coolant transit time, $t_{\mathrm{in}}$ is the
    instant when the coolant crosses the component inlet, and $t_{\mathrm{out}}$ is
    the instant when the same coolant stream crosses the component outlet.


    The quantity applies to the coolant path through one associated plant component
    and uses the inlet-to-outlet interval as its aggregation convention. It is not
    a plant-wide sum over components or ports, and it excludes transport outside the
    component, instrumentation or network latency, and a thermal time constant of
    the component material.


    The transit time establishes the temporal correspondence between inlet conditions
    and the delayed outlet state represented by the [coolant temperature at outlet](name:coolant_temperature_at_outlet).
    It is distinct from the [coolant mass flow rate](name:ratio_of_coolant_mass_to_time),
    which describes transported mass per time rather than travel duration, and it
    provides the thermal-delay correction relevant to [total thermal coolant absorbed
    power at wall](name:total_thermal_coolant_absorbed_power_at_wall).'
  unit: s
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_outlet
  - name:ratio_of_coolant_mass_to_time
  sources:
  - dd_path: calorimetry/group/component/transit_time
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/calorimetry.html#calorimetry-group-component-transit_time
    dd_documentation:
      leaf: Transit time for the coolant to go from the input to the output of the
        component
      parent_path: calorimetry/group/component
      parent: Set of components on which calorimetry measurements are carried out
      data_type: STRUCTURE
      unit: s
    enhanced_context:
      description: Transit time for coolant to travel from the inlet to the outlet
        of a calorimetry component. Used to account for thermal delay in power balance
        calculations from inlet and outlet temperature measurements.
      kind: llm
- name: ratio_of_coolant_mass_to_time
  kind: scalar
  status: active
  description: Net coolant mass throughput per unit time across a flow boundary, applicable
    to cooling loops and plant-component fluid ports.
  documentation: 'Coolant mass flow rate is the net rate at which coolant crosses
    a defined flow boundary. It represents fluid throughput rather than a thermodynamic
    state or an energy-transfer quantity.


    The instantaneous rate is defined by


    $$

    \dot{m}_c(t) = \frac{dM_c(t)}{dt}

    $$


    where $\dot{m}_c(t)$ is the coolant mass flow rate, $M_c(t)$ is the cumulative
    net coolant mass that has crossed the boundary, $t$ is time, and the subscript
    $c$ denotes coolant.


    The quantity applies to the coolant stream as a whole, with its mass contributions
    aggregated into one net rate. It is generic with respect to the flow boundary:
    no particular inlet, outlet, cooling loop, or plant component is implied. It excludes
    coolant temperature, enthalpy change, transit time, and deposited thermal power.


    This quantity is the time-rate derivative of [coolant mass](name:coolant_mass),
    so it describes transport of mass rather than the amount of coolant present. When
    inlet and outlet states are specified, [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet) provide
    the corresponding thermal states for an enthalpy balance; the mass flow rate itself
    is not that balance or its resulting power.


    Sign convention: Positive when net coolant transport is in the adopted positive
    flow direction across the defined boundary.'
  unit: kg.s^-1
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
  sources:
  - dd_path: balance_of_plant/power_plant/system/component/port/mass_flow
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-system-component-port-mass_flow
    dd_documentation:
      leaf: Mass flow rate of the fluid
      parent_path: balance_of_plant/power_plant/system/component/port
      parent: Set of ports (input or output) of the component
      data_type: FLT_1D
      unit: kg.s^-1
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: "Mass flow rate of fluid at a component port in the balance-of-plant\
        \ power conversion system (\u1E41). Characterizes the fluid throughput at\
        \ system boundaries, used with temperature data to compute thermal power."
      kind: llm
  - dd_path: calorimetry/cooling_loop/mass_flow
