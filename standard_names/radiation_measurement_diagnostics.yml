- name: neutron_flux_due_to_beam_thermal_fusion
  kind: scalar
  status: active
  description: Neutron flux due to beam-thermal fusion is the global neutron emission
    rate from fusion reactions in which fast injected beam ions react with thermal
    plasma ions. It is the channel-summed beam-thermal neutron flux, excluding thermal-thermal
    and beam-beam fusion.
  documentation: 'Neutron flux due to beam-thermal fusion is the global neutron emission
    rate from fusion reactions in which fast ions originating from injected neutral
    beams react with thermal plasma ions. It is integrated over the plasma volume
    and summed over all neutron-emitting beam-thermal reaction channels.


    For resolved fast-ion and thermal-ion velocity distributions, the channel-summed
    neutron emission rate is defined by:


    $$

    \Phi_n^{\mathrm{BT}} = \sum_{(a,b)\in \mathcal{C}_n} \int_V \int \int f_a^{\mathrm{beam}}(\mathbf{r},\mathbf{v}_a)
    f_b^{\mathrm{th}}(\mathbf{r},\mathbf{v}_b) \sigma_{ab}(v_{\mathrm{rel}}) v_{\mathrm{rel}}
    Y_{ab}(v_{\mathrm{rel}}) \, d^3v_a \, d^3v_b \, dV

    $$


    where $\Phi_n^{\mathrm{BT}}$ is the beam-thermal neutron emission rate, $V$ is
    the plasma volume over which the reactions are counted, $\mathcal{C}_n$ is the
    set of ordered neutron-emitting beam-thermal reaction pairs, $a$ labels the fast
    beam-ion isotope, $b$ labels the thermal target isotope, $f_a^{\mathrm{beam}}$
    and $f_b^{\mathrm{th}}$ are velocity-space density distributions normalized so
    that velocity integration gives the corresponding number density, $\sigma_{ab}$
    is the fusion cross-section, $v_{\mathrm{rel}}=|\mathbf{v}_a-\mathbf{v}_b|$ is
    the relative speed, and $Y_{ab}$ is the neutron yield per reaction.


    This quantity is the neutron-yield-weighted sum of channel-resolved beam-thermal
    fusion rates, including [deuterium-deuterium beam-thermal neutron flux](name:deuterium_deuterium_neutron_flux_due_to_beam_thermal_fusion)
    and [deuterium-tritium beam-thermal neutron flux](name:deuterium_tritium_neutron_flux_due_to_beam_thermal_fusion)
    when those channels are present. It excludes thermal-thermal fusion, beam-beam
    fusion, and non-fusion neutron sources. It counts emitted neutrons rather than
    reaction events, so neutron-branching fractions and neutron multiplicities are
    included in $Y_{ab}$.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_neutron_flux_due_to_beam_thermal_fusion
  - name:deuterium_tritium_neutron_flux_due_to_beam_thermal_fusion
  - name:flux_due_to_beam_thermal_fusion
