- name: perturbed_beam_major_radius_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Dynamic variation of the tangency major radius of a neutral beam injector
    during beam tilting, equal to the signed change in the major radius at which the
    beam centerline is tangent to a toroidal circle.
  documentation: 'The perturbed beam major radius $\delta R_\mathrm{tan}$ is the time-varying
    deviation of the tangency radius from its nominal value during dynamic steering
    of a neutral beam injector beamlet group. The tangency radius is defined in the
    right-handed cylindrical $(R, \phi, Z)$ frame as the major radius $R$ at which
    the beam centerline is tangent to a toroidal circle centered on the machine symmetry
    axis; this quantity records its signed departure from the static injection geometry
    given by [beam_major_radius_of_neutral_beam_injector](name:beam_major_radius_of_neutral_beam_injector).


    The instantaneous tangency radius during tilting is decomposed as:


    $$

    R_\mathrm{tan}(t) = R_\mathrm{tan}^0 + \delta R_\mathrm{tan}(t)

    $$


    where $R_\mathrm{tan}^0$ is the nominal (unperturbed) tangency radius and $\delta
    R_\mathrm{tan}(t)$ is this perturbed component.


    Dynamic NBI tilting is employed in beam emission spectroscopy applications, where
    the beam is periodically steered to sweep the measurement volume radially across
    the plasma cross-section. The radial extent of this steering is quantified by
    the perturbed tangency radius, complementing [perturbed_angle_of_neutral_beam_injector](name:perturbed_angle_of_neutral_beam_injector),
    which captures the simultaneous change in vertical inclination angle of the beam.


    Sign convention: Positive when $\delta R_\mathrm{tan}$ shifts the beam''s tangent
    point outward to a larger major radius $R$ relative to the nominal injection geometry.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:beam_major_radius_of_neutral_beam_injector
  - name:perturbed_angle_of_neutral_beam_injector
  sources:
  - id: dd:nbi/unit/beamlets_group/tilting/delta_tangency_radius
    dd_path: nbi/unit/beamlets_group/tilting/delta_tangency_radius
    status: composed
- name: power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: Net RF power launched from a single ion cyclotron resonance heating
    (ICRH) antenna into the vacuum vessel, equal to forward power minus reflected
    power at the antenna reference plane.
  documentation: "The power of an ion cyclotron heating antenna is the net RF power\
    \ delivered across the antenna aperture into the vacuum vessel, representing the\
    \ difference between the forward (incident) and reflected traveling-wave powers\
    \ at a defined reference plane on the transmission line. It quantifies how effectively\
    \ the antenna couples RF energy from the generator circuit into the plasma-facing\
    \ side of the antenna structure.\n\nThe net launched power is related to its directional\
    \ components by:\n\n$$\nP_\\mathrm{launched} = P_\\mathrm{forward} - P_\\mathrm{reflected}\n\
    $$\n\nwhere $P_\\mathrm{forward}$ is the [forward power](name:forward_power_of_ion_cyclotron_heating_antenna)\
    \ carried by the incident traveling wave and $P_\\mathrm{reflected}$ is the [reflected\
    \ power](name:reflected_power_of_ion_cyclotron_heating_antenna) carried by the\
    \ backward wave, both evaluated at the same reference plane on the feed line.\n\
    \nThis quantity is measured using directional couplers installed on the coaxial\
    \ or waveguide transmission lines feeding each ICRH antenna port. Coupling efficiency\
    \ depends on plasma edge density, antenna-to-separatrix distance, and operating\
    \ frequency relative to the local ion cyclotron resonance layer.\n\nIndividual\
    \ ICRH antennas on medium-to-large tokamaks typically launch 1\u20135 MW; the\
    \ system-level sum over all antennas is [total_power_of_ion_cyclotron_heating_antenna](name:total_power_of_ion_cyclotron_heating_antenna).\
    \ The analogous per-injector quantity for neutral beam heating is [power_of_neutral_beam_injector](name:power_of_neutral_beam_injector),\
    \ and the corresponding ECRH quantity is [launched_power_of_electron_cyclotron_launcher](name:launched_power_of_electron_cyclotron_launcher)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
