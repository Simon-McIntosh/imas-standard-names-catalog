name: carbon_prefill_gas_injection
status: draft
cocos_transformation_type: one_like
description: Number of carbon atoms (or carbon-containing molecules) injected into
  the vessel as a prefill before plasma breakdown.
documentation: The carbon prefill gas injection records the total count of carbon
  particles introduced into the vacuum vessel prior to plasma initiation, expressed
  as a dimensionless particle number. Prefill gas sets the initial neutral density
  that influences breakdown conditions and early current ramp-up; typical prefill
  counts range from $10^{17}$ to $10^{20}$ particles depending on device volume and
  target density. Carbon prefill may be used in wall-conditioning or carbon-seeding
  discharges where early impurity presence is desired. The quantity complements the
  accumulated injection (full-discharge integral) and the instantaneous injection
  rate.
