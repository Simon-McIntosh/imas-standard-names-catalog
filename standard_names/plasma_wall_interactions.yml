- name: kinetic_energy_flux_at_wall
  kind: scalar
  status: active
  description: Total kinetic power per unit area incident on a plasma-facing wall
    surface from plasma particles, excluding radiative and electromagnetic contributions.
  documentation: 'Kinetic energy flux at the wall is the power per unit area incident
    on a plasma-facing boundary surface from plasma particles, carried by their translational
    kinetic energy. It is the particle-kinetic contribution to [energy_flux_at_wall](name:energy_flux_at_wall),
    independent of whether the particles are ions, electrons, or neutrals.


    For contributing particle populations $s$, the incident kinetic-energy flux is


    $$

    Q_{\mathrm{kin}} = \sum_s \int_{\mathbf{v}\cdot\hat{n}<0} \frac{1}{2}m_s v^2 f_s(\mathbf{v})\,|\mathbf{v}\cdot\hat{n}|\,d^3v

    $$


    where $f_s(\mathbf{v})$ is the velocity distribution of population $s$, $m_s$
    is its particle mass, $\mathbf{v}$ is particle velocity relative to the wall,
    and $\hat{n}$ is the inward-pointing wall-normal unit vector. The sum and any
    internal-state aggregation follow the defined particle population; [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall)
    is one species-aggregated instance, while [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall)
    represents a neutral-particle instance. Radiative, electromagnetic, and outgoing
    surface-emission contributions are excluded.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall
  - name:neutral_energy_flux_at_wall
  arguments:
  - name: energy_flux_at_wall
    operator: kinetic
    operator_kind: qualifier
- name: ion_kinetic_energy_flux_at_wall
  kind: scalar
  status: active
  description: Incident kinetic-energy power flux delivered by all plasma ions striking
    a plasma-facing wall, summed over ion species and charge states and excluding
    electrons and neutrals.
  documentation: 'This quantity is the ion-resolved component of the incident kinetic-energy
    flux at a plasma-facing wall. It contributes to the parent [kinetic energy flux
    at wall](name:kinetic_energy_flux_at_wall) and includes all incident ion species
    and charge states, but excludes electron, neutral-particle, radiative, and electromagnetic
    contributions.


    For an outward wall normal $\hat{n}$ directed from the material into the plasma,
    the flux is defined by


    $$

    q_{i}^{\mathrm{kin}} = \sum_s \int_{\mathbf{v}\cdot\hat{n}<0} \frac{1}{2}m_s |\mathbf{v}|^2
    (-\mathbf{v}\cdot\hat{n}) f_s(\mathbf{v})\,d^3\mathbf{v}

    $$


    where $s$ indexes ion species and charge states, $m_s$ is the ion mass, $\mathbf{v}$
    is particle velocity, and $f_s$ is the incident velocity distribution. The minus
    sign converts the inward particle velocity into a positive arrival flux; the resulting
    quantity is non-negative.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:kinetic_energy_flux_at_wall
  arguments:
  - name: kinetic_energy_flux_at_wall
    operator: ion
    operator_kind: qualifier
  sources:
  - dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/wall.html#wall-description_ggd-ggd-energy_fluxes-kinetic-ion-incident-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
      parent_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/incident
      parent: Incident fluxes for various wall components (grid subsets)
      data_type: FLT_1D
      unit: W.m^-2
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for incident.
      kind: template
- name: kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: active
  description: Kinetic-energy power flux density carried away from a plasma-facing
    surface by emitted particles, including ions and electrons and aggregated over
    species.
  documentation: 'This quantity is the outward kinetic-energy flux density carried
    by particles emitted from a plasma-facing surface through sputtering, reflection,
    secondary emission, or related surface-emission processes. It includes all emitted
    particle species and charge states, rather than selecting a particular ion or
    charge state.


    The kinetic-energy flux density is defined by


    $$

    q_{\mathrm{kin}} = \sum_s \int_{\mathbf{v}\cdot\mathbf{n}>0} \frac{1}{2}m_s v^2\,(\mathbf{v}\cdot\mathbf{n})
    f_s(\mathbf{v})\,d^3v

    $$


    where $s$ indexes emitted particle species and charge states, $m_s$ is particle
    mass in kg, $\mathbf{v}$ is particle velocity in m/s, $v=|\mathbf{v}|$, $\mathbf{n}$
    is the outward surface-normal unit vector, and $f_s$ is the emitted-particle velocity
    distribution. The outward condition excludes particles incident on the surface.
    This is the kinetic component of [energy flux at wall due to surface emission](name:energy_flux_at_wall_due_to_surface_emission),
    excluding particle potential-energy contributions and photon or other radiative
    energy; [ion charge-state kinetic energy flux at wall due to surface emission](name:ion_charge_state_kinetic_energy_flux_at_wall_due_to_surface_emission)
    is a charge-state-resolved instance.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_surface_emission
  - name:ion_charge_state_kinetic_energy_flux_at_wall_due_to_surface_emission
  arguments:
  - name: energy_flux_at_wall_due_to_surface_emission
    operator: kinetic
    operator_kind: qualifier
- name: ion_charge_state_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: active
  description: Kinetic-energy power flux density carried by ions in a specified charge
    state leaving a plasma-facing surface through sputtering, reflection, or related
    surface-emission processes.
  documentation: 'This quantity is the outward kinetic-energy flux density carried
    by ions in a specified species and charge state emitted from a plasma-facing surface
    through sputtering, reflection, or related surface-emission processes.


    The charge-state-resolved kinetic-energy flux density is defined by


    $$

    q_{\mathrm{kin},s} = \int_{\mathbf{v}\cdot\mathbf{n}>0} \frac{1}{2}m_s v^2\,(\mathbf{v}\cdot\mathbf{n})
    f_s(\mathbf{v})\,d^3v

    $$


    where $s$ identifies the selected ion species and charge state, $m_s$ is its particle
    mass, $\mathbf{v}$ is particle velocity, $v=|\mathbf{v}|$, $\mathbf{n}$ is the
    outward surface-normal unit vector, and $f_s$ is its emitted-particle velocity
    distribution. The outward condition excludes particles incident on the surface.


    This is one charge-state contribution to [kinetic-energy flux at wall due to surface
    emission](name:kinetic_energy_flux_at_wall_due_to_surface_emission), excluding
    other ion charge states, electrons, particle potential energy, photons, and other
    radiative energy. The ion-aggregated quantity [ion kinetic-energy flux at wall
    due to surface emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission)
    sums this contribution over ion species and charge states.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission
