name: effective_charge_at_divertor_target
status: draft
cocos_transformation_type: one_like
description: Plasma effective ion charge $Z_{\mathrm{eff}}$ evaluated at the divertor
  target plate, characterizing the local impurity content.
documentation: "The effective charge $Z_{\\mathrm{eff}} = \\sum_i n_i Z_i^2 / \\sum_i\
  \ n_i Z_i$ (where $n_i$ is the number density and $Z_i$ the charge number of ion\
  \ species $i$) quantifies the mean squared charge state of the ion population weighted\
  \ by density. At the divertor target, $Z_{\\mathrm{eff}}$ reflects the local impurity\
  \ mix resulting from sputtering, recycling, and upstream impurity transport; typical\
  \ values range from 1.0 (pure deuterium) to 3\u20136 in high-recycling or detached\
  \ divertor conditions with significant carbon or tungsten erosion. It is inferred\
  \ from visible spectroscopy (e.g., bremsstrahlung continuum or line-ratio techniques)\
  \ viewing the divertor strike point, or from Langmuir probe data combined with spectroscopic\
  \ impurity fractions. Elevated $Z_{\\mathrm{eff}}$ increases resistive power losses\
  \ via $P_{\\mathrm{rad}} \\propto Z_{\\mathrm{eff}}$ and modifies sheath heat transmission\
  \ coefficients. See also the core-averaged counterpart and related divertor diagnostics."
