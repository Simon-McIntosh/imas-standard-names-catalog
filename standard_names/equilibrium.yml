- name: major_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate of the magnetic axis, the degenerate innermost
    point about which all closed magnetic flux surfaces are nested and at which the
    gradient of the poloidal magnetic flux vanishes.
  documentation: "The magnetic axis is the singular point in the plasma poloidal cross-section\
    \ at which the gradient of the poloidal magnetic flux vanishes, $\\nabla\\psi\
    \ = 0$, forming the innermost degenerate flux surface about which all closed nested\
    \ surfaces are organized. Its major-radius coordinate $R_\\mathrm{axis}$ measures\
    \ the distance from the toroidal symmetry axis to this point in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is measured outward from the machine\
    \ symmetry axis.\n\nThe magnetic axis satisfies\n\n$$\n\\left.\\nabla\\psi(R,\
    \ Z)\\right|_{(R_\\mathrm{axis},\\, Z_\\mathrm{axis})} = 0\n$$\n\nwhere $\\psi(R,\
    \ Z)$ is the poloidal magnetic flux function and $Z_\\mathrm{axis}$ is the corresponding\
    \ vertical coordinate. The outward displacement $R_\\mathrm{axis} - R_\\mathrm{geo}$,\
    \ where $R_\\mathrm{geo}$ is the [major radius of the geometric axis](name:major_radius_of_geometric_axis),\
    \ constitutes the Shafranov shift, which increases with plasma pressure and current.\n\
    \nThe axis position is determined by equilibrium reconstruction, which locates\
    \ the extremum of the poloidal flux function on the $(R, Z)$ poloidal plane. It\
    \ serves as the inner normalization reference for radial flux coordinates and\
    \ is a key input to plasma position control. It differs from [major_radius_of_current_center](name:major_radius_of_current_center)\
    \ when the current profile is poloidally asymmetric. Typical values range from\
    \ 1.6\u20133.0 m for medium-sized tokamaks to approximately 6.2 m for ITER-class\
    \ devices.\n\nSign convention: Positive when $R_\\mathrm{axis}$ is directed outward\
    \ from the toroidal symmetry axis in the $+\\hat{R}$ direction of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_current_center
  sources:
