- name: toroidal_plasma_momentum_at_pedestal_top
  kind: scalar
  status: active
  description: Toroidal plasma momentum at the pedestal top is the volume-integrated
    toroidal linear momentum of the confined plasma inside the pedestal-top flux surface,
    summed over electrons and all ion species. It is the pedestal-top endpoint of
    total toroidal plasma momentum, not a local momentum density or toroidal angular
    momentum.
  documentation: 'Toroidal plasma momentum at the pedestal top is the cumulative toroidal
    component of plasma linear momentum contained inside the flux surface located
    at the top of the H-mode pedestal, summed over electrons and all ion species.
    The toroidal component is taken in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    Let $\rho_{\mathrm{ped}}$ denote the radial flux-surface label of the pedestal-top
    flux surface and let $V(\rho_{\mathrm{ped}})$ be the plasma volume enclosed by
    that surface. The quantity is the radial cumulative [toroidal_total_plasma_momentum](name:toroidal_total_plasma_momentum)
    evaluated at the pedestal-top endpoint:


    $$

    P_{\phi,\mathrm{ped}} = P_\phi(\rho_{\mathrm{ped}}) = \int_{V(\rho_{\mathrm{ped}})}
    \sum_s m_s n_s(\mathbf{x}) v_{\phi,s}(\mathbf{x})\, dV

    $$


    where $P_\phi(\rho)$ is the cumulative toroidal plasma momentum inside the flux
    surface labeled by $\rho$, $s$ indexes electrons and all ion species, $m_s$ is
    the species particle mass, $n_s$ is the species number density, $v_{\phi,s}$ is
    the signed toroidal velocity component, $\mathbf{x}$ is position, and $dV$ is
    the volume element.


    This quantity is an endpoint value of a volume-integrated radial function: it
    is not the local toroidal momentum density $\sum_s m_s n_s v_{\phi,s}$ on the
    pedestal-top surface, and it is not a flux-surface average. It is also not toroidal
    angular momentum; the angular-momentum integral would include the moment arm $R$
    multiplying the toroidal linear-momentum density. The same cumulative quantity
    has related endpoint values at the [magnetic axis](name:toroidal_plasma_momentum_at_magnetic_axis)
    and at the [plasma boundary].


    Sign convention: Positive when the net toroidal plasma momentum points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum
  - name:toroidal_plasma_momentum_at_magnetic_axis
  sources:
  - dd_path: summary/local/pedestal/momentum_phi/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-pedestal-momentum_phi-value
    dd_documentation:
