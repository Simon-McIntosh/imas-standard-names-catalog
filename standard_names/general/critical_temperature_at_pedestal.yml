name: critical_temperature_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Marginal-stability electron temperature at the pedestal top, above which
  peeling-ballooning or kinetic-ballooning modes are predicted to trigger an ELM.
documentation: The critical pedestal-top electron temperature $T_{e,\mathrm{ped}}^{\mathrm{crit}}$
  (in eV) is the threshold value at which the pedestal pressure gradient reaches the
  marginal stability boundary, typically set by peeling-ballooning or kinetic-ballooning
  mode analysis. When the measured $T_{e,\mathrm{ped}}$ approaches or exceeds $T_{e,\mathrm{ped}}^{\mathrm{crit}}$,
  edge-localized modes (ELMs) are expected to be triggered. This critical value depends
  on the bootstrap current profile; common models use the Sauter or Hager bootstrap
  current formulations to compute the edge current density that feeds back into the
  stability boundary. Typical critical temperatures range from 0.2 keV to several
  keV depending on shaping, density, and collisionality. The quantity is usually obtained
  from pedestal stability codes (e.g., ELITE, MISHKA) combined with mtanh pedestal
  profile fits. See also `electron_temperature_at_pedestal` for the measured counterpart.
