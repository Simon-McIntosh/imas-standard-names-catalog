- name: gradient_of_electron_pressure
  kind: scalar
  status: draft
  description: Signed derivative of electron pressure with respect to normalized poloidal
    magnetic flux, evaluated at the H-mode pedestal location of greatest absolute
    pressure steepness. The selection uses the largest magnitude of the derivative,
    while the reported value retains its algebraic sign.
  documentation: 'The gradient of electron pressure is the signed slope of [electron_pressure](name:electron_pressure)
    with respect to the normalized poloidal magnetic flux coordinate $\psi_N$ in the
    H-mode pedestal. It is evaluated at the pedestal location where the absolute value
    of that slope is greatest, so a steep outward pressure drop is selected by magnitude
    but reported with its negative sign.


    The defining value is


    $$

    G_{p_e} = \left.\frac{d p_e}{d\psi_N}\right|_{\psi_N=\psi_*}, \qquad \psi_* =
    \operatorname*{arg\,max}_{\psi_N \in \mathrm{pedestal}} \left|\frac{d p_e}{d\psi_N}\right|

    $$


    where $p_e$ is electron pressure, $\psi_N$ is normalized poloidal magnetic flux
    increasing from 0 at the magnetic axis to 1 at the last closed flux surface, and
    $\psi_*$ is the pedestal location of maximum absolute slope. Electron pressure
    is $p_e=n_e k_B T_e$ when $T_e$ is thermodynamic temperature in K, equivalently
    $p_e=n_e e T_e$ when $T_e$ is reported in eV; $n_e$ is electron density in m$^{-3}$,
    $k_B$ is the Boltzmann constant, and $e$ is the elementary charge.


    In practice this quantity is obtained by fitting the radial dependence of electron
    pressure across the pedestal, often from electron density and temperature measurements
    such as Thomson scattering, and then differentiating the fitted function with
    respect to $\psi_N$. Modified hyperbolic-tangent and piecewise-linear fits are
    common ways to locate the steepest pedestal segment. This normalized-flux derivative
    complements [gradient_of_electron_temperature](name:gradient_of_electron_temperature)
    and [gradient_of_electron_density](name:gradient_of_electron_density), and differs
    from [gradient_of_radial_electron_pressure](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal),
    which is a spatial derivative requiring a local conversion between $\psi_N$ and
    a chosen radial distance.


    Typical signed values are usually negative in ordinary H-mode pedestals. Absolute
    magnitudes are about $10^4$-$10^6$ Pa in present tokamaks; small or low-pressure
    pedestals can be near $10^3$ Pa, while high-performance pedestals can reach several
    $10^6$ Pa.


    Sign convention: Positive when electron pressure increases as the normalized poloidal
    magnetic flux coordinate $\psi_N$ increases from the magnetic axis toward the
    last closed flux surface.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure
  - name:gradient_of_electron_temperature
  - name:gradient_of_electron_density
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal
  arguments:
  - name: electron_pressure
    operator: gradient
    operator_kind: unary_prefix
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm_max/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/pressure_electron/d_dpsi_norm_max/value
    dd_path: summary/pedestal_fits/mtanh/pressure_electron/d_dpsi_norm_max/value
    status: attached
- name: parallel_diamagnetic_current_density
  kind: scalar
  status: draft
  description: Field-aligned component of the diamagnetic current density, projected
    onto the local magnetic field direction in the edge plasma.
  documentation: 'The parallel diamagnetic current density is the projection of the
    total [diamagnetic_current_density](name:diamagnetic_current_density) onto the
    local magnetic field direction at each point in the edge plasma. The diamagnetic
    current arises from the gyration of magnetized particles in a pressure-gradient
    field; in an isotropic ideal plasma, $\mathbf{j}_\mathrm{dia} = (\mathbf{B} \times
    \nabla p)/B^2$ is purely perpendicular to $\mathbf{B}$, so its parallel component
    vanishes in that limit. In more complete descriptions including pressure anisotropy,
    finite Larmor radius corrections, or the inhomogeneous magnetic geometry of the
    tokamak edge, a field-aligned component emerges and must be tracked separately.


    The parallel projection is defined as:


    $$

    j_{\parallel,\mathrm{dia}} = \mathbf{j}_\mathrm{dia} \cdot \hat{b}

    $$


    where $\mathbf{j}_\mathrm{dia}$ is the diamagnetic current density vector and
    $\hat{b} = \mathbf{B}/B$ is the unit vector along the magnetic field of magnitude
    $B$.


    In edge plasma current decompositions, this component is closely related to [parallel_current_density_due_to_diamagnetic_drift](name:parallel_current_density_due_to_diamagnetic_drift),
    which encodes the same physical mechanism through the explicit drift formalism.
    The toroidal_diamagnetic_current_density provides the complementary geometric
    projection of the same vector field onto the toroidal direction.


    Sign convention: Positive when the current flows in the direction of the local
    magnetic field unit vector $\hat{b} = \mathbf{B}/B$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:edge_profiles/ggd/j_diamagnetic/parallel
    dd_path: edge_profiles/ggd/j_diamagnetic/parallel
    status: composed
- name: parallel_ion_state_convection_velocity
  kind: scalar
  status: draft
  description: Parallel component of the effective convective velocity used for particle
    transport of a specified ion charge state in the edge plasma. It is a transport
    coefficient along the local magnetic-field direction and need not equal the bulk
    ion fluid velocity.
  documentation: 'The parallel ion-state convection velocity is the coefficient multiplying
    the density of one ion charge state in the convective part of its parallel particle
    transport. It describes transport along the local magnetic-field direction in
    the edge plasma and is an effective balance-equation coefficient, not necessarily
    the literal mean fluid velocity of that ion state.


    A common particle-flux decomposition defines the named quantity as:


    $$

    \Gamma_{\parallel,s} = n_s v_{\parallel,s}^{\mathrm{conv}} + \Gamma_{\parallel,s}^{\mathrm{nonconv}}

    $$


    where $\Gamma_{\parallel,s}$ is the total parallel particle flux of charge state
    $s$ along $\hat{b}=\mathbf{B}/|\mathbf{B}|$, $n_s$ is the charge-state density,
    $v_{\parallel,s}^{\mathrm{conv}}$ is this effective convection velocity, and $\Gamma_{\parallel,s}^{\mathrm{nonconv}}$
    contains diffusive, drift-ordering, turbulent, and source-related contributions
    that are not represented as density times a convective coefficient. Equivalently,
    where $n_s$ is nonzero, the effective coefficient is the residual parallel flux
    per particle after those nonconvective contributions have been separated; it can
    differ from the bulk ion fluid parallel velocity.


    In practice it is obtained from charge-state particle-balance analysis or transport
    modeling using density evolution, parallel flux constraints, and atomic source
    terms such as ionization, recombination, charge exchange, neutral fueling, and
    recycling. Direct charge-state-resolved parallel flux measurements are uncommon,
    so the coefficient is usually constrained by a combination of spectroscopy, edge
    or divertor probes, and consistency with modeled sources and sinks. The same effective-coefficient
    interpretation underlies related radial convection-velocity quantities such as
    [radial_ion_convection_velocity](name:radial_ion_convection_velocity) and [radial_ion_state_effective_momentum_convection_velocity](name:radial_ion_state_momentum_convection_velocity).


    Typical signed values in the confined edge are about $-10^4$ to $10^4\ \mathrm{m\,s^{-1}}$,
    while scrape-off-layer and divertor values often reach $-10^5$ to $10^5\ \mathrm{m\,s^{-1}}$.
    Magnitudes comparable to a fraction of the local ion sound speed are common near
    material boundaries or strong source regions.


    Sign convention: Positive when the effective convective particle flux for the
    ion charge state is directed along the local magnetic-field unit vector $\hat{b}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
  - name:radial_ion_state_momentum_convection_velocity
  arguments:
  - name: ion_charge_state_effective_convection_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/v_parallel/values
    dd_path: edge_transport/model/ggd/ion/state/particles/v_parallel/values
    status: composed
- name: parallel_ion_state_momentum
  kind: scalar
  status: draft
  description: Parallel ion state momentum is the component, along the local magnetic-field
    direction, of the momentum source term for a specified ion species and charge
    state in an edge plasma. It has unit kg m^-1 s^-2 and represents addition or removal
    of that state's parallel momentum.
  documentation: 'Parallel ion state momentum is the signed projection of a charge-state-resolved
    ion momentum source term along the local magnetic-field direction. It applies
    to one ion species and one ion charge state, and has unit $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    the same dimensional unit as pressure or momentum flux.


    The signed parallel projection is defined by:


    $$

    S_{p,\parallel}^{(a,q)} = \mathbf{S}_p^{(a,q)} \cdot \hat{\mathbf{b}}

    $$


    where $S_{p,\parallel}^{(a,q)}$ is the parallel momentum source term for ion species
    $a$ and charge state $q$ with unit $\mathrm{kg\,m^{-1}\,s^{-2}}$, $\mathbf{S}_p^{(a,q)}$
    is the corresponding vector momentum source term with the same unit, $\hat{\mathbf{b}}
    = \mathbf{B}/|\mathbf{B}|$ is the dimensionless unit vector along the local magnetic
    field, and $\mathbf{B}$ is the magnetic field measured in tesla.


    In practice this quantity is usually inferred or computed as part of a momentum
    balance for the selected ion state rather than measured directly. Contributing
    mechanisms can include ion-neutral momentum exchange, charge exchange, ionization
    and recombination momentum transfer, collisional friction, and externally applied
    momentum sources. Complementary projections of the same charge-state-resolved
    ion momentum source are represented by [poloidal_ion_state_momentum](name:poloidal_ion_state_momentum),
    [toroidal_ion_state_momentum](name:toroidal_ion_state_momentum), and radial_ion_state_momentum.


    Typical absolute magnitudes are strongly case dependent: they range from near
    $0\ \mathrm{kg\,m^{-1}\,s^{-2}}$ where net parallel momentum transfer cancels
    to values comparable with local edge ion pressure $p_i$ or dynamic momentum-flux
    scales such as $m_i n_i u_\parallel^2$, where $m_i$, $n_i$, and $u_\parallel$
    are ion mass, ion density, and parallel flow speed. The relevant scale can vary
    by orders of magnitude between weak-source edge regions and localized divertor
    or recycling regions.


    Sign convention: Positive when the momentum source acts in the direction of the
    local magnetic field $\mathbf{B}$.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_state_momentum
  - name:toroidal_ion_state_momentum
  sources:
  - id: dd:edge_sources/source/ggd/ion/state/momentum/parallel
    dd_path: edge_sources/source/ggd/ion/state/momentum/parallel
    status: composed
- name: parallel_total_ion_energy_convection_velocity
  kind: scalar
  status: draft
  description: Parallel effective convection velocity for total ion energy transport
    in edge plasma. It is the signed field-aligned speed associated with the convective
    part of the total ion energy flux.
  documentation: 'Parallel total ion energy convection velocity is the signed effective
    field-aligned speed that multiplies a total ion energy density to give the convective
    part of the parallel ion-energy flux density. It represents advection of the ion
    energy variable used in an edge-plasma transport model and need not be identical
    to the bulk ion particle velocity.


    The defining relation is the flux-density ratio:


    $$

    v_{\parallel,E_i}^{\mathrm{conv}} = \frac{q_{\parallel,E_i}^{\mathrm{conv}}}{\mathcal{E}_i}

    $$


    where $q_{\parallel,E_i}^{\mathrm{conv}}$ is the signed parallel convective flux
    density of total ion energy in W.m^-2 and $\mathcal{E}_i$ is the total ion energy
    density in J.m^-3, so the ratio has units m.s^-1. The denominator must be consistent
    with the energy variable used by the transport model; for a thermal-ion contribution,
    $T_i$ is treated as energy per ion, so $3 n_i T_i/2$ is in J.m^-3 when $T_i$ is
    in joules, while $3 n_i e T_i/2$ is used when the numerical temperature is in
    eV.


    In practice, this velocity is specified by a transport closure or recovered from
    modeled energy flux density and energy density. It is the field-aligned analog
    of [radial_total_ion_effective_energy_convection_velocity](name:radial_ion_energy_convection_velocity),
    with the direction taken along magnetic field lines rather than across magnetic
    surfaces. Because enthalpy factors, species sums, or other closure choices may
    be included in either the flux or energy variable, values should be compared only
    when the same total-ion-energy definition is used.


    Typical values are model dependent rather than universal. Magnitudes may be near
    0 m.s^-1 when explicit parallel energy convection is absent and can range up to
    the local field-aligned transport-speed scale, often order 10^2-10^5 m.s^-1 in
    edge-plasma modeling; the chosen value should be interpreted with the same energy-density
    convention used in the defining ratio.


    Sign convention: Positive when the effective convection of total ion energy is
    along the local magnetic-field direction $\hat{b}=\mathbf{B}/|\mathbf{B}|$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_convection_velocity
  sources:
  - id: dd:edge_transport/model/ggd/total_ion_energy/v_parallel/values
    dd_path: edge_transport/model/ggd/total_ion_energy/v_parallel/values
    status: composed
- name: poloidal_ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective scalar diffusion coefficient for poloidal transport of ion
    thermal energy. In a diffusive closure, it multiplies the poloidal gradient of
    ion energy density to give the down-gradient ion energy flux.
  documentation: 'Poloidal ion energy diffusivity is an effective scalar transport
    coefficient for diffusive redistribution of ion thermal energy along the poloidal
    direction. The poloidal direction is tangent to increasing poloidal angle $\theta$
    at fixed radial flux coordinate $\rho$ and toroidal angle $\phi$ in a flux-coordinate
    representation $(\rho, \theta, \phi)$. It characterizes the ion energy channel
    and should be distinguished from aggregate total-ion or total-plasma energy transport
    coefficients when those channels are defined separately.


    A common local down-gradient closure for the diffusive poloidal ion energy flux
    is:


    $$

    q_{\theta,i}^{E,\mathrm{diff}} = -D_{\theta,i}^{E}\,\frac{\partial \varepsilon_i}{\partial
    l_\theta}

    $$


    where $q_{\theta,i}^{E,\mathrm{diff}}$ is the poloidal diffusive ion energy flux
    density in W.m^-2, $D_{\theta,i}^{E}$ is the poloidal ion energy diffusivity in
    m^2.s^-1, $\varepsilon_i$ is the ion thermal energy density in J.m^-3, and $l_\theta$
    is poloidal arclength in meters. For a Maxwellian ion population, $\varepsilon_i
    = 3p_i/2$, where $p_i$ is ion pressure; equivalently, $\varepsilon_i = 3n_iT_i/2$
    when $T_i$ is expressed as energy per particle. The minus sign means that a positive
    diffusivity drives the diffusive contribution from higher toward lower ion thermal
    energy density.


    In practice this coefficient is usually specified, fitted, or inferred within
    edge-plasma transport modeling from ion temperature, density, pressure, and heat-flux
    constraints rather than measured directly as a material property. It is the poloidal
    ion-energy analog of radial transport quantities such as radial_total_energy_diffusion_coefficient,
    [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity),
    and [radial_diffusion_coefficient](name:radial_ion_particle_diffusivity), and
    it is related to [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity) and
    [poloidal_ion_momentum_diffusivity](name:poloidal_ion_momentum_diffusivity) for
    particle and momentum transport in the same direction. Use [poloidal_total_ion_energy_diffusivity](name:poloidal_ion_energy_diffusivity)
    when the modeled coefficient applies to an aggregate total-ion energy channel.


    Typical effective values are strongly model and region dependent, with no universal
    range. Edge transport studies commonly explore broad values such as 0.01-100 m^2.s^-1;
    values near zero suppress modeled poloidal energy diffusion, while larger values
    more rapidly smooth poloidal variations of ion energy density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_particle_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/ion/energy/d_pol/values
    dd_path: edge_transport/model/ggd/ion/energy/d_pol/values
    status: composed
  - id: dd:edge_transport/model/ggd/total_ion_energy/d_pol/values
    dd_path: edge_transport/model/ggd/total_ion_energy/d_pol/values
    status: composed
- name: poloidal_ion_state_diffusivity
  kind: scalar
  status: draft
  description: Poloidal ion-state diffusivity is the scalar diagonal transport coefficient
    for diffusive particle transport of a specified ion charge state along increasing
    poloidal angle in a chosen flux-coordinate system (rho, theta, phi). It multiplies
    the charge-state density gradient to give the down-gradient poloidal particle
    flux.
  documentation: 'Poloidal ion-state diffusivity is the scalar diagonal component
    of charge-state-resolved ion particle diffusion in the physical poloidal direction
    associated with increasing $\theta$ in a specified flux-coordinate system $(\rho,\theta,\phi)$.
    It applies to one ionization state $z$ and is the charge-state-resolved counterpart
    of [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity), with analogous role
    to momentum transport coefficients such as [poloidal_ion_state_momentum_diffusivity](name:poloidal_ion_state_momentum_diffusivity).


    The local down-gradient closure for the poloidal particle flux component is


    $$

    \Gamma_{\mathrm{pol},z} = -D_{\mathrm{pol},z}\,\nabla_{\mathrm{pol}} n_z

    $$


    where $\Gamma_{\mathrm{pol},z}$ is the charge-state particle flux density along
    the poloidal direction in $m^{-2}\,s^{-1}$, $D_{\mathrm{pol},z}$ is the poloidal
    ion-state diffusivity in $m^2\,s^{-1}$, $n_z$ is the ion number density for charge
    state $z$ in $m^{-3}$, and $\nabla_{\mathrm{pol}} n_z$ is the physical poloidal
    component of the density gradient in $m^{-4}$. The minus sign means that, for
    $D_{\mathrm{pol},z}>0$, the diffusive flux is opposite to the density gradient;
    if density increases along increasing $\theta$, the diffusive flux component points
    toward decreasing $\theta$.


    In edge plasma particle-balance modeling, this coefficient is used when ionization
    states are evolved separately and poloidal redistribution of each charge-state
    population must be represented. It may be prescribed as an effective transport
    parameter or constrained by comparisons with charge-state-sensitive density measurements,
    together with ionization, recombination, parallel losses, and boundary conditions.


    There is no device-independent numerical range fixed by the definition. In a purely
    diffusive closure it is normally treated as non-negative: $D_{\mathrm{pol},z}=0$
    removes this diffusive channel, while larger values more strongly smooth poloidal
    variations of the charge-state density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_state_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/d_pol/values
    dd_path: edge_transport/model/ggd/ion/state/particles/d_pol/values
    status: composed
- name: poloidal_neutral_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective diagonal diffusivity for neutral-particle energy transport
    in the poloidal direction of flux coordinates (rho, theta, phi), tangent to a
    flux surface at fixed rho and phi. It relates the length-normalized poloidal gradient
    of neutral energy density to the diffusive poloidal energy flux.
  documentation: 'Poloidal neutral energy diffusivity is the effective diagonal diffusion
    coefficient for transport of neutral-particle energy along the poloidal direction
    in flux coordinates $(\rho,\theta,\phi)$. The direction is tangent to a flux surface
    at fixed $\rho$ and $\phi$, and the coefficient represents how rapidly neutral
    thermal or internal energy is smoothed along that direction.


    A Fick-law closure for the poloidal neutral energy flux density is


    $$

    q_\theta^{\mathrm{n},E} = -D_\theta^{\mathrm{n},E}\,\frac{1}{h_\theta}\,\frac{\partial
    u_n}{\partial \theta}

    $$


    where $q_\theta^{\mathrm{n},E}$ is the neutral energy flux density taken positive
    in the direction of increasing poloidal angle $\theta$, $D_\theta^{\mathrm{n},E}$
    is the poloidal neutral energy diffusivity, $u_n$ is the neutral energy density
    in $\mathrm{J\,m^{-3}}$, and $h_\theta$ is the poloidal metric scale factor in
    meters so that $(1/h_\theta)\partial u_n/\partial\theta$ is a length-normalized
    gradient in $\mathrm{J\,m^{-4}}$. For a Maxwellian neutral population, $u_n$ is
    commonly evaluated from the neutral density and temperature; for example, $u_n=3
    n_n T_n/2$ when $T_n$ is expressed as energy per particle.


    This coefficient is used in reduced neutral-fluid or transport closures for edge
    and scrape-off-layer plasmas when the full neutral energy transport tensor is
    represented by direction-resolved effective diffusivities. Its value may represent
    collisional scattering, charge-exchange mediated redistribution, atomic and molecular
    processes, and unresolved turbulent or kinetic effects. It is the energy-transport
    analog of [poloidal neutral momentum diffusivity](name:poloidal_neutral_momentum_diffusivity),
    and it complements orthogonal-direction quantities such as [radial neutral energy
    diffusion coefficient](name:radial_neutral_energy_diffusion_coefficient).


    Typical effective values range from $0.1-10^4\ \mathrm{m^2\,s^{-1}}$. Smaller
    values are expected for cold, dense, highly collisional divertor neutrals, while
    larger effective values can occur in hotter or more rarefied edge regions, or
    when unresolved kinetic transport is represented by an enhanced diffusive closure.
    A true diffusive coefficient is expected to be non-negative; negative fitted values
    indicate an anti-diffusive effective closure or a convention-dependent model artifact
    rather than ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_momentum_diffusivity
  - name:effective_neutral_energy_diffusivity
  - name:poloidal_ion_energy_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/neutral/energy/d_pol/values
    dd_path: edge_transport/model/ggd/neutral/energy/d_pol/values
    status: composed
- name: poloidal_neutral_momentum_diffusivity
  kind: scalar
  status: draft
  description: Poloidal component of the effective neutral-particle momentum diffusivity
    tensor in flux coordinates (rho, theta, phi), governing diffusive redistribution
    of neutral momentum along increasing poloidal angle theta.
  documentation: 'Poloidal neutral momentum diffusivity is the diagonal poloidal component
    of an effective neutral-particle momentum diffusivity tensor. It parameterizes
    how neutral momentum density is smoothed along the poloidal direction, tangent
    to increasing $\theta$ at fixed $\rho$ and $\phi$ in flux coordinates $(\rho,\theta,\phi)$,
    locally lying in a meridional plane of the right-handed cylindrical $(R,\phi,Z)$
    frame where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    In a local Fick-type closure, the poloidal diffusive flux of neutral poloidal
    momentum is written as:


    $$

    \Pi_{\theta,n} = -D_\theta\,\frac{\partial}{\partial l_\theta}\left(m_n n_n u_{\theta,n}\right)

    $$


    where $\Pi_{\theta,n}$ is the poloidal neutral-momentum flux in kg m$^{-1}$ s$^{-2}$,
    taken positive in the direction of increasing $\theta$; $D_\theta$ is the poloidal
    neutral momentum diffusivity in m$^2$ s$^{-1}$; $m_n$ is neutral particle mass
    in kg; $n_n$ is neutral number density in m$^{-3}$; and $u_{\theta,n}$ is the
    neutral fluid velocity component along increasing $\theta$ in m s$^{-1}$. The
    poloidal arclength $l_\theta$ follows the coordinate line of increasing $\theta$,
    with metric relation $dl_\theta=h_\theta d\theta$ and $h_\theta=|\partial\mathbf{x}/\partial\theta|_{\rho,\phi}$
    in meters when $\theta$ is dimensionless; the minus sign means that positive diffusivity
    drives neutral poloidal momentum down its arclength gradient.


    This coefficient is usually obtained indirectly from neutral-transport modeling,
    reduced fluid closures, or interpretation of edge and divertor measurements sensitive
    to neutral flow and momentum exchange. As an effective coefficient, it may include
    neutral-neutral collisions, charge-exchange coupling to ions, and unresolved kinetic
    or geometric effects represented in a diffusive approximation.


    Typical effective values in tokamak edge and divertor neutral-momentum closures
    are about 0.01-10 m$^2$ s$^{-1}$, with values up to roughly 100 m$^2$ s$^{-1}$
    possible in highly diffusive reduced descriptions or regions where long neutral
    mean-free paths are represented by an effective fluid diffusivity.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_neutral_energy_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/neutral/momentum/d_pol/values
    dd_path: edge_transport/model/ggd/neutral/momentum/d_pol/values
    status: composed
- name: poloidal_particle_diffusivity
  kind: scalar
  status: draft
  description: Effective particle diffusion coefficient for transport along the poloidal
    direction in flux coordinates (rho, theta, phi). It relates particle flux in the
    direction of increasing poloidal angle to the metric-scaled gradient of particle
    number density for a generic particle population.
  documentation: 'Poloidal particle diffusivity $D_\mathrm{pol}$ is an effective scalar
    transport coefficient for particle mixing along the poloidal direction in a flux-coordinate
    system $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$ is poloidal
    angle, and $\phi$ is toroidal angle. It applies to a generic particle population
    and represents the net effect of collisional, turbulent, or modeled unresolved
    transport along increasing or decreasing $\theta$.


    The local Fick-law closure for the poloidal particle flux density is


    $$

    \Gamma_\theta = -D_\mathrm{pol}\,\nabla_\theta n

    $$


    where $\Gamma_\theta$ is the particle flux density along increasing poloidal angle
    $\theta$ in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$, $D_\mathrm{pol}$ is in $\mathrm{m}^2\,\mathrm{s}^{-1}$,
    $n$ is the particle number density in $\mathrm{m}^{-3}$, and $\nabla_\theta n$
    is the physical component of $\nabla n$ along increasing $\theta$ at fixed $\rho$
    and $\phi$. For an orthogonal metric this component is $h_\theta^{-1}\partial
    n/\partial\theta$, where $h_\theta$ is the poloidal arc-length scale factor. For
    $D_\mathrm{pol} > 0$, the minus sign gives down-gradient transport: flux in the
    direction of increasing $\theta$ occurs when density decreases with increasing
    $\theta$.


    This coefficient is usually prescribed or inferred in edge particle-balance and
    transport calculations rather than measured directly. It may be adjusted to reproduce
    measured density evolution, particle balance, or poloidal density asymmetries,
    and its interpretation should follow the particle population being modeled; species-resolved
    counterparts are used when electron, ion, or ion-state transport must be distinguished.


    Typical prescribed edge-plasma values are model-dependent and are commonly of
    order 0.01-10 m^2.s^-1 for anomalous particle mixing. Reduced closures or effective
    neutral-particle treatments may use values up to about 100 m^2.s^-1, while values
    near zero represent negligible poloidal diffusive mixing. A passive diffusion
    coefficient is normally non-negative; negative values would represent an anti-diffusive
    closure rather than ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_electron_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_state_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  arguments:
  - name: radial_ion_state_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/particles/d_pol/values
    dd_path: edge_transport/model/ggd/neutral/state/particles/d_pol/values
    status: composed
- name: radial_current_density_due_to_viscosity
  kind: scalar
  status: draft
  description: Radial component of the viscosity-driven current density in the edge
    plasma, formed from viscous stress contributions and directed along the major-radius
    direction of the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Radial current density due to viscosity is the major-radius component
    of the electric current density produced by viscous momentum transport in the
    edge plasma. It represents the part of the current associated with viscous stress
    closures, including perpendicular, parallel, and heat-viscous contributions, projected
    onto the $\hat{R}$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.


    A useful defining relation is the projection of the aggregate viscosity-driven
    current density onto the major-radius basis vector:


    $$

    j_R^{\mathrm{visc}} = \left(\mathbf{j}_{\perp}^{\mathrm{visc}} + \mathbf{j}_{\parallel}^{\mathrm{visc}}
    + \mathbf{j}_{q}^{\mathrm{visc}}\right) \cdot \hat{R}

    $$


    where $j_R^{\mathrm{visc}}$ is the radial viscosity-driven current density, $\mathbf{j}_{\perp}^{\mathrm{visc}}$
    is the contribution associated with perpendicular viscous stress, $\mathbf{j}_{\parallel}^{\mathrm{visc}}$
    is the contribution associated with parallel viscous stress, $\mathbf{j}_{q}^{\mathrm{visc}}$
    is the heat-viscous contribution, and $\hat{R}$ is the outward major-radius unit
    vector.


    This quantity is usually computed from edge fluid, gyrofluid, or kinetic transport
    models rather than measured directly. It depends on plasma collisionality, magnetization,
    density and temperature gradients, flow shear, magnetic geometry, and the closure
    used for the viscous stress tensor; it contributes to cross-field current closure
    and to the evolution of electric fields in the edge and scrape-off layer.


    Typical magnitudes are often about 0.01-100 A.m^-2 in quiescent edge conditions,
    with localized or transient values reaching 1000 A.m^-2 when gradients, flows,
    or turbulent structures are strong.


    Sign convention: Positive when the viscosity-driven current density points in
    the direction of increasing major radius $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:radial_current_density_due_to_parallel_viscosity
  - name:radial_current_density_due_to_heat_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  sources:
  - id: dd:edge_profiles/ggd/j_perpendicular_viscosity/r
    dd_path: edge_profiles/ggd/j_perpendicular_viscosity/r
    status: composed
- name: radial_electron_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for electron particle transport.
    It is the advective coefficient multiplying electron density in a radial particle-flux
    closure at the plasma edge.
  documentation: 'Radial electron convection velocity is the effective advective speed
    associated with cross-field electron particle transport at the plasma edge. It
    represents the convective, or pinch, part of the radial electron particle flux
    after diffusive transport has been separated from the closure.


    A common particle-flux closure writes the radial electron particle flux as:


    $$

    \Gamma_{e,r} = -D_{e,r}\,\frac{\partial n_e}{\partial r} + v_{e,r}\,n_e

    $$


    where $\Gamma_{e,r}$ is the radial electron particle flux in $\mathrm{m^{-2}\,s^{-1}}$,
    $D_{e,r}$ is an effective radial diffusivity in $\mathrm{m^2\,s^{-1}}$, $n_e$
    is the electron density in $\mathrm{m^{-3}}$, $r$ is an outward radial coordinate
    in meters, and $v_{e,r}$ is the radial electron convection velocity.


    This quantity is usually inferred from edge transport analysis, reduced transport
    modeling, or fits to electron-density evolution using sources, sinks, and radial
    gradients. It is an effective closure coefficient: it need not identify a single
    microscopic drift mechanism and may summarize turbulence, neoclassical effects,
    and geometry-dependent transport into one advective term.


    Typical effective values in the confined edge are from about -50 to 50 m.s^-1.
    Larger apparent values, up to several hundred m.s^-1, can occur in the scrape-off
    layer or during strong transient edge transport, depending on the chosen transport
    closure and averaging interval.


    Sign convention: Positive when the effective electron particle convection is directed
    outward across magnetic flux surfaces from the confined plasma toward the plasma-facing
    material surfaces.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:particle_convection_velocity
  - name:radial_electron_energy_convection_velocity
  - name:radial_ion_convection_velocity
  sources:
  - id: dd:edge_transport/model/ggd/electrons/particles/v_radial/values
    dd_path: edge_transport/model/ggd/electrons/particles/v_radial/values
    status: composed
- name: radial_ion_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for ion particle transport in
    the edge plasma. It is the coefficient multiplying ion density in the cross-field
    ion particle flux, not necessarily a literal ion fluid velocity.
  documentation: 'The radial ion convection velocity $v_{r,i}$ is the effective advective
    coefficient for ion particle transport across magnetic flux surfaces in the edge
    plasma. The radial direction is the outward normal direction associated with an
    increasing radial flux label $\rho$ in a flux-surface coordinate system $(\rho,\theta,\phi)$,
    where $\theta$ is poloidal angle and $\phi$ is toroidal angle. This quantity represents
    the particle-transport channel and need not equal the radial component of the
    ion bulk flow.


    The convective contribution to the radial ion particle flux density is defined
    by:


    $$

    \Gamma_{r,i}^{\mathrm{conv}} = n_i v_{r,i}

    $$


    where $\Gamma_{r,i}^{\mathrm{conv}}$ is the convective radial ion particle flux
    density in m$^{-2}$ s$^{-1}$, $n_i$ is the local ion number density in m$^{-3}$,
    and $v_{r,i}$ is the radial ion convection velocity in m s$^{-1}$. In a full transport
    model this term is commonly combined with diffusive and source terms; the convection
    velocity is the coefficient of the density-proportional part of the cross-field
    particle flux.


    In edge-plasma modeling, $v_{r,i}$ is obtained from transport closures, reduced
    fluid or kinetic models, or inference from particle balance after separating density-gradient-driven
    diffusion from density-proportional advection. It may represent the net effect
    of mean drifts, turbulent transport, intermittent filament motion, ion-neutral
    coupling, and other unresolved processes. Analogous effective convection velocities
    are used for ion energy and momentum channels, including charge-state-resolved
    variants.


    Typical absolute values for background effective radial convection in scrape-off-layer
    and divertor transport studies are about 0.1-100 m s$^{-1}$, depending strongly
    on plasma regime, collisionality, turbulence level, and proximity to material
    surfaces. Local transient or filament-associated effective radial speeds can be
    larger, often 10-1000 m s$^{-1}$, but these may not correspond to a steady flux-surface-averaged
    coefficient.


    Sign convention: Positive when $v_{r,i}$ is directed outward across magnetic flux
    surfaces, toward increasing radial flux label $\rho$ in the flux-surface coordinate
    system $(\rho,\theta,\phi)$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_convection_velocity
  - name:radial_ion_state_momentum_convection_velocity
  sources:
  - id: dd:edge_transport/model/ggd/ion/particles/v_radial/values
    dd_path: edge_transport/model/ggd/ion/particles/v_radial/values
    status: composed
- name: radial_ion_energy_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for the convective part of ion
    energy transport in the edge plasma. It is an energy-transport coefficient, not
    necessarily the ion particle flow velocity.
  documentation: 'Radial ion energy convection velocity is the signed transport coefficient
    that multiplies the ion pressure or thermal-energy scale in the convective radial
    ion energy flux. It characterizes advective transport of ion thermal energy across
    magnetic flux surfaces in the edge plasma, separate from diffusive or conductive
    transport driven by gradients.


    The defining transport relation can be written as:


    $$

    q^{\mathrm{conv}}_{i,E,r} = p_i v_r

    $$


    where $q^{\mathrm{conv}}_{i,E,r}$ is the convective radial ion energy flux density
    in W m$^{-2}$, $p_i$ is the ion pressure or energy-density scale in J m$^{-3}$,
    and $v_r$ is this velocity in m s$^{-1}$. When $p_i=n_i T_i$ is used, $n_i$ is
    in m$^{-3}$ and $T_i$ must be in joules; if $T_i$ is represented in eV, it is
    converted using the elementary charge.


    In practice, $v_r$ is inferred from edge transport analysis by separating the
    convective part of the ion energy flux from conductive or diffusive terms and
    from local sources and sinks. It differs from [radial_ion_convection_velocity](name:radial_ion_convection_velocity),
    which refers to particle advection, and from [radial_ion_effective_energy_convection_velocity](name:radial_ion_energy_convection_velocity)
    when additional non-convective mechanisms are intentionally absorbed into a model-equivalent
    velocity.


    Typical edge-plasma values are often of order -10-50 m s$^{-1}$ on closed edge
    flux surfaces, with larger effective values of order 100 m s$^{-1}$ possible near
    strong pedestal gradients or in scrape-off-layer transport analyzes. Values near
    zero indicate little convective contribution compared with diffusion or conduction.


    Sign convention: Positive when directed outward across magnetic flux surfaces,
    from the confined plasma toward the scrape-off layer and wall.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
  sources:
  - id: dd:edge_transport/model/ggd/ion/energy/v_radial/values
    dd_path: edge_transport/model/ggd/ion/energy/v_radial/values
    status: composed
  - id: dd:edge_transport/model/ggd/total_ion_energy/v_radial/values
    dd_path: edge_transport/model/ggd/total_ion_energy/v_radial/values
    status: composed
- name: radial_ion_state_diffusivity
  kind: scalar
  status: draft
  description: Radial particle diffusion coefficient for a specific ion charge state,
    relating the cross-field diffusive particle flux to the radial gradient of that
    charge-state's number density in the edge plasma.
  documentation: 'The radial ion state diffusivity $D_r^{(z)}$ quantifies cross-field
    particle diffusion for ions in a specific ionization stage $z$ in the edge plasma.
    It is the radial projection of the full [ion_state_diffusivity](name:ion_state_diffusivity)
    tensor, representing how efficiently that charge state diffuses across magnetic
    flux surfaces perpendicular to the field.


    The quantity enters the charge-state continuity equation through Fick''s law:


    $$

    \Gamma_r^{(z)} = -D_r^{(z)} \nabla_r n_z

    $$


    where $\Gamma_r^{(z)}$ is the radial diffusive particle flux density of the charge
    state (in m$^{-2}$s$^{-1}$) and $\nabla_r n_z$ is the radial component of the
    number density gradient of that charge state (in m$^{-4}$).


    In practice, $D_r^{(z)}$ is either prescribed from turbulent-transport models
    or fitted to experimental edge density profiles by matching computed and measured
    charge-state distributions. It may vary spatially across the edge grid depending
    on local turbulence and plasma conditions.


    Cross-field particle diffusivities in edge plasmas are anomalously enhanced above
    neoclassical levels by turbulence, with values commonly in the range $10^{-2}$
    to $10^1$ m$^2$s$^{-1}$ in the scrape-off layer and pedestal region. The companion
    coefficients [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity)
    and [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity)
    govern radial energy and momentum transport for the same charge state, while [parallel_ion_charge_state_diffusivity](name:parallel_ion_charge_state_diffusivity)
    captures diffusion along the magnetic field.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_diffusivity
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_state_momentum_diffusivity
  - name:parallel_ion_charge_state_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/d_radial/values
    dd_path: edge_transport/model/ggd/ion/state/particles/d_radial/values
    status: composed
- name: ratio_of_vertical_vorticity_to_major_radius
  kind: scalar
  status: draft
  description: The vertical component of the plasma vorticity vector divided by the
    local major radius. It is the major-radius-scaled form of vertical vorticity used
    in toroidal edge-fluid operators and has units of inverse meter-second.
  documentation: 'Ratio of vertical vorticity to major radius is the vertical projection
    of plasma vorticity divided by the local major radius. Vorticity is the curl of
    the plasma flow velocity, and its vertical component measures signed local rotation
    in planes perpendicular to the vertical direction. Dividing by $R$ gives the major-radius-scaled
    form of the unscaled [vertical vorticity](name:vertical_vorticity).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height, the quantity is defined by:


    $$

    \frac{\omega_Z}{R} = \frac{(\nabla \times \mathbf{v}) \cdot \hat{Z}}{R}

    $$


    where $\mathbf{v}$ is the plasma flow velocity, $\boldsymbol{\omega}=\nabla\times\mathbf{v}$
    is the vorticity, $\omega_Z=\boldsymbol{\omega}\cdot\hat{Z}$ is the vertical vorticity
    component, and $R>0$ is the local major radius.


    In practice this quantity is computed from measured, reconstructed, or modeled
    velocity fields by evaluating the vertical component of the curl and dividing
    pointwise by $R$. In toroidal edge-fluid and turbulence formulations it may appear
    when divergence, polarization, or curvature-related operators are written with
    major-radius metric factors; this use does not change its definition as scaled
    vertical vorticity.


    Representative edge-plasma magnitudes depend on flow shear, turbulent length scale,
    and machine size. Vorticity magnitudes of about $10^4-10^7$ s$^{-1}$ at major
    radii of $0.5-3$ m correspond to roughly $10^4-10^7$ m$^{-1}$ s$^{-1}$, with intermittent
    turbulent structures sometimes outside this range.


    Sign convention: Positive when the vertical component of the vorticity vector
    points in the $+\hat{Z}$ direction, since $R$ is positive.'
  unit: m^-1.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:vertical_vorticity
  - name:ratio_of_plasma_vorticity_to_major_radius
  - name:poloidal_vorticity
  - name:toroidal_vorticity
  sources:
  - id: dd:edge_profiles/ggd/vorticity_over_r/z
    dd_path: edge_profiles/ggd/vorticity_over_r/z
    status: composed
- name: thermal_plasma_pressure
  kind: scalar
  status: draft
  description: Total kinetic pressure of the bulk thermal plasma, equal to the sum
    of electron and bulk-ion thermal pressure contributions and excluding fast, suprathermal,
    or runaway populations.
  documentation: 'Thermal plasma pressure is the isotropic kinetic pressure associated
    with particle populations close to local thermodynamic equilibrium. It includes
    the thermal electron contribution and the contributions from bulk thermal ion
    species, but excludes nonthermal populations such as fast ions, suprathermal tails,
    and runaway electrons. It is the thermal component of the more general [plasma_pressure](name:plasma_pressure)
    and is closely related to thermal_pressure, [total_electron_pressure](name:total_electron_pressure),
    and [total_ion_pressure](name:total_ion_pressure).


    For Maxwellian or near-Maxwellian thermal species, the pressure is defined by
    the species density-temperature sum:


    $$

    p_\mathrm{th} = n_e k_B T_e + \sum_i n_i k_B T_i

    $$


    where $n_e$ and $n_i$ are electron and bulk-ion number densities in m$^{-3}$,
    $T_e$ and $T_i$ are thermodynamic temperatures in K, $k_B$ is Boltzmann''s constant,
    and the sum is over thermal ion species. When temperatures are tabulated in eV,
    the equivalent SI pressure is obtained by replacing $k_B T_s$ with $e T_s$, where
    $e$ is the elementary charge and $T_s$ is the temperature value in eV; this gives
    $p_\mathrm{th}$ in Pa.


    In practice, thermal plasma pressure is computed from measured or modeled density
    and temperature for electrons and bulk ions, with quasineutrality often used to
    constrain the ion density composition when not all ion species are independently
    measured. It enters fluid and magnetohydrodynamic force balance through the pressure-gradient
    term and sets the thermal part of quantities such as beta, sound speed, and parallel
    pressure balance.


    Representative edge-plasma values span a wide range because both density and temperature
    vary strongly across confined, near-separatrix, and scrape-off-layer regions.
    For densities of about $10^{18}$-$10^{20}$ m$^{-3}$ and electron-plus-ion thermal
    temperatures of about 1-200 eV, thermal plasma pressure is typically of order
    0.1-$10^4$ Pa.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_pressure
  - name:total_electron_pressure
  - name:total_ion_pressure
  sources:
  - id: dd:edge_profiles/ggd/pressure_thermal/values
    dd_path: edge_profiles/ggd/pressure_thermal/values
    status: composed
- name: toroidal_ion_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Diffusion coefficient for transport of bulk-ion momentum projected
    along the toroidal direction in the right-handed cylindrical (R, phi, Z) frame.
    It relates the diffusive flux vector of ion toroidal momentum density to the spatial
    gradient of that density.
  documentation: 'Toroidal ion momentum diffusion coefficient is the scalar diffusivity
    for transport of bulk ion momentum projected on $\hat{\phi}$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle increasing counterclockwise when viewed from above $+\hat{Z}$, and $Z$ is
    vertical height. It parameterizes the down-gradient part of transport of the toroidal
    ion momentum density, distinct from convection, sources, sinks, and residual stresses.


    The Fick''s-law closure for the diffusive flux vector is


    $$

    \boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}} = -D_{\phi,i}\,\nabla\!\left(m_i n_i
    v_{\phi,i}\right)

    $$


    where $D_{\phi,i}$ is the toroidal ion momentum diffusion coefficient in $\mathrm{m^2\,s^{-1}}$,
    $\boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}}$ is the vector flux of toroidal ion
    momentum density in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $m_i$ is ion mass in $\mathrm{kg}$,
    $n_i$ is bulk ion density in $\mathrm{m^{-3}}$, and $v_{\phi,i}$ is the ion flow
    velocity component along $\hat{\phi}$ in $\mathrm{m\,s^{-1}}$, positive in the
    direction of increasing $\phi$. A scalar flux through a surface with unit normal
    $\hat{n}$ is $\hat{n}\cdot\boldsymbol{\Pi}_{\phi,i}^{\mathrm{diff}}$ and is positive
    along $\hat{n}$; for the toroidal spatial component, use $\hat{n}=\hat{\phi}$
    so the driving gradient is $\hat{\phi}\cdot\nabla(m_i n_i v_{\phi,i})$. The minus
    sign means that a positive coefficient gives transport down the projected gradient
    of $m_i n_i v_{\phi,i}$.


    In practice this effective coefficient is obtained by solving or fitting the ion
    toroidal-momentum balance using measurements or reconstructions of ion density,
    ion composition, toroidal rotation, and momentum sources and sinks. Spectroscopic
    flow measurements, including charge-exchange recombination spectroscopy where
    available, can constrain $v_{\phi,i}$; the inferred $D_{\phi,i}$ can include collisional
    and turbulence-driven transport that is not represented separately by convective
    pinch or residual-stress terms.


    Typical edge-plasma effective values are 0.1-10 m^2 s^-1 in confined-edge transport
    analyzes, with smaller values around 0.01-1 m^2 s^-1 possible for predominantly
    collisional estimates and larger apparent values, 10-100 m^2 s^-1, sometimes used
    in highly turbulent scrape-off-layer or transient-edge modeling. Negative fitted
    values usually signal that the assumed purely diffusive closure is inadequate
    rather than a physical diffusion coefficient with reversed sign.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_ion_charge_state_momentum_diffusivity
  - name:toroidal_momentum_diffusion_coefficient
  - name:toroidal_neutral_momentum_diffusion_coefficient
  - name:parallel_momentum_diffusion_coefficient
  sources:
  - id: dd:edge_transport/model/ggd/ion/momentum/d/toroidal
    dd_path: edge_transport/model/ggd/ion/momentum/d/toroidal
    status: composed
