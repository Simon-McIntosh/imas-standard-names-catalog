- name: alfven_time
  kind: scalar
  status: active
  description: "Characteristic shear-Alfv\xE9n transit time across the magnetic-axis\
    \ major-radius scale, set by local ion inertia and the reference magnetic-field\
    \ strength."
  documentation: "The Alfv\xE9n time is the characteristic shear-Alfv\xE9n propagation\
    \ time across a reference major-radius scale in the confined plasma. It is a physical\
    \ MHD timescale, not an event timestamp or a growth rate.\n\nIts defining relation\
    \ is\n\n$$\n\\tau_A(\\rho) = \\frac{R_0\\sqrt{m_i n_i(\\rho)}}{B_0}\n$$\n\nwhere\
    \ $\\tau_A(\\rho)$ is the local Alfv\xE9n time, $R_0$ is the magnetic-axis major-radius\
    \ scale, $m_i$ is the mass of the reference ion population, $n_i(\\rho)$ is its\
    \ number density at radial coordinate $\\rho$, and $B_0$ is the reference magnetic-field\
    \ strength.\n\nThe quantity applies locally at each radial coordinate in the confined\
    \ plasma; it is not a radial average or radial integral, and it does not represent\
    \ a charge-state-resolved time unless the reference ion population is so specified.\
    \ As a timescale, it is distinct from the frequency represented by [alfven_frequency](name:alfven_frequency)\
    \ and from the general temporal quantity [time](name:time). It provides the characteristic\
    \ time used to normalize MHD growth rates and other dynamical rates."
  unit: s
  links: []
  sources:
  - kind: imas-dd
    ref: mhd_linear/time_slice/toroidal_mode/plasma/tau_alfven
    version: 4.1.0
- name: effective_charge
  kind: scalar
  status: active
  description: Dimensionless effective ionic charge of a plasma mixture, given by
    the second ionic charge moment divided by free-electron density and indicating
    impurity content.
  documentation: 'Effective charge $Z_\mathrm{eff}$ is the charge-weighted mean ionic
    charge of a plasma mixture, formed from the second moment of the ionic charge
    distribution and normalized by the free-electron density.


    The defining relation is


    $$

    Z_\mathrm{eff} = \frac{\sum_s n_s Z_s^2}{n_e}

    $$


    where $n_s$ is the number density of ions in species and charge-state category
    $s$, $Z_s$ is the positive ionic charge number for that category, and $n_e$ is
    the free-electron number density. For a quasineutral mixture, $n_e$ equals the
    sum of $n_s Z_s$ over the same ion population.


    This quantity applies to the complete included ion mixture, with contributions
    summed over all represented ion species and charge states; it is not restricted
    to one species, charge state, plasma region, or spatial averaging geometry. A
    local value and a prescribed spatially averaged value share this same charge aggregation
    convention.


    Effective charge is distinct from the charge number of an individual ion and from
    the [square of an ion charge number](name:square_of_ion_charge_number), which
    describes a single-species charge moment rather than the mixture-level ratio.
    Spatially averaged instances retain the local definition: [line-averaged effective
    charge](name:line_averaged_effective_charge) averages this quantity along a line,
    whereas [volume-averaged effective charge](name:volume_averaged_effective_charge)
    averages it over a plasma volume.'
  unit: '1'
  links:
  - name:line_averaged_effective_charge
  - name:volume_averaged_effective_charge
