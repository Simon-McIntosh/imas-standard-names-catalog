name: equilibrium_reconstruction_constraint_weight_of_passive_loop_current
status: draft
cocos_transformation_type: one_like
description: Relative weight assigned to the passive-loop current measurement in the
  least-squares equilibrium reconstruction cost functional.
documentation: Standard $\chi^2$ weight controlling the relative importance of the
  passive-loop current measurement in the equilibrium reconstruction. A value of 1
  applies the nominal measurement variance $\sigma_i^2$; values greater than 1 up-weight
  the constraint when the raw variance underestimates modeling error. Passive-loop
  (vessel) currents are induced in conducting structures surrounding the plasma and
  measured via Rogowski coils or shunt resistors; their inclusion in the reconstruction
  improves the accuracy of the reconstructed current-density profile near the plasma
  edge. See also `passive_loop_current` for the underlying physical observable and
  `equilibrium_reconstruction_constraint_weight_of_diamagnetic_flux` for an analogous
  constraint weight.
