- name: radial_current_density_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Radial current density due to diamagnetic drift is the major-radius
    component of the pressure-gradient-driven diamagnetic current in the right-handed
    cylindrical (R, phi, Z) frame. It represents current associated with species diamagnetic
    drifts, not radial bulk particle flow.
  documentation: "Radial current density due to diamagnetic drift is the $\0\\hat{R}$\
    \ projection of the macroscopic diamagnetic current density caused by cross-field\
    \ gradients of total scalar plasma pressure. In the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, $R$ is major radius measured from the toroidal symmetry axis,\
    \ $\\phi$ increases counterclockwise when viewed from above $+\\hat{Z}$, and $Z$\
    \ is vertical height. This quantity describes an electrical current associated\
    \ with opposing ion and electron diamagnetic drifts, not a center-of-mass radial\
    \ plasma velocity.\n\nThe defining relation for a scalar-pressure plasma description\
    \ is:\n\n$$\nj_{\\mathrm{dia},R} = \\hat{R} \\cdot \\frac{\\mathbf{B} \\times\
    \ \\nabla p}{|\\mathbf{B}|^2}\n$$\n\nwhere $\\mathbf{B}$ is the magnetic field\
    \ in T, $|\\mathbf{B}|$ is its magnitude, $p = \\sum_s p_s$ is the total scalar\
    \ plasma pressure summed over species in Pa, $\\nabla p$ is the pressure gradient\
    \ in Pa m$^{-1}$, and $j_{\\mathrm{dia},R}$ is the radial diamagnetic current\
    \ density in A m$^{-2}$. If a pressure tensor rather than scalar pressure is retained,\
    \ this scalar expression represents the isotropic-pressure limit.\n\nIn practice,\
    \ this component is evaluated from reconstructed or modeled magnetic fields and\
    \ pressure gradients, followed by projection onto $\\hat{R}$. It is closely related\
    \ to [radial_diamagnetic_current_density](name:radial_diamagnetic_current_density);\
    \ [vertical_current_density_due_to_diamagnetic_drift](name:vertical_current_density_due_to_diamagnetic_drift)\
    \ is the corresponding projection along $+\\hat{Z}$.\n\nRepresentative magnitudes\
    \ are strongly device- and regime-dependent because $|\\mathbf{j}_\\mathrm{dia}|$\
    \ scales approximately as $|\\nabla p|/|\\mathbf{B}|$. Order-of-magnitude radial\
    \ components can be below 1 A m$^{-2}$ in weak-gradient regions and can reach\
    \ 10$^2$-10$^5$ A m$^{-2}$ where pressure gradients are steep; the radial projection\
    \ may be much smaller than the full diamagnetic current density if the current\
    \ is nearly tangential to flux surfaces.\n\nSign convention: Positive when the\
    \ diamagnetic drift current density has a component in the direction of increasing\
    \ major radius $R$ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_profiles/ggd/j_diamagnetic/r
    dd_path: plasma_profiles/ggd/j_diamagnetic/r
    status: composed
- name: radial_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: Radial component of the current density due to perpendicular viscous
    stress, projected along the major-radius direction in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'The radial current density due to perpendicular viscosity is the
    $\hat{R}$ projection of the plasma current-density contribution associated with
    the divergence of the perpendicular viscous stress tensor. It represents the part
    of that viscosity-driven current flowing along increasing or decreasing major
    radius in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is measured
    outward from the toroidal symmetry axis.


    A component-level definition is


    $$

    j_R^{(\Pi_\perp)} = \hat{R}\cdot\mathbf{j}^{(\Pi_\perp)}, \qquad (\mathbf{j}^{(\Pi_\perp)}\times\mathbf{B})_\perp
    \simeq -\left(\nabla\cdot\boldsymbol{\Pi}_\perp\right)_\perp

    $$


    where $j_R^{(\Pi_\perp)}$ is this radial component in $\mathrm{A\,m^{-2}}$, $\mathbf{j}^{(\Pi_\perp)}$
    is the current-density contribution attributed to perpendicular viscosity, $\mathbf{B}$
    is the magnetic field, and $\boldsymbol{\Pi}_\perp$ is the perpendicular viscous
    stress tensor whose divergence is a force density in $\mathrm{N\,m^{-3}}$. The
    force-balance relation identifies the part of the current constrained by the perpendicular
    Lorentz balance; any field-aligned contribution associated with the same stress
    source is treated separately, for example by [parallel_current_density_due_to_perpendicular_viscosity](name:parallel_current_density_due_to_perpendicular_viscosity).


    This quantity is usually computed from a transport or edge-plasma model using
    a closure for perpendicular viscosity, the magnetic equilibrium, and spatial gradients
    of flow and pressure. It is not normally measured directly; it is inferred as
    one term in current balance and can be compared with [radial_current_density_due_to_viscosity](name:radial_current_density_due_to_viscosity),
    [radial_current_density_due_to_parallel_viscosity](name:radial_current_density_due_to_parallel_viscosity),
    and other contributions to [radial_current_density](name:radial_current_density).
    The related [poloidal_current_density_due_to_perpendicular_viscosity](name:poloidal_current_density_due_to_perpendicular_viscosity)
    describes the projection of the same viscosity-driven current onto a poloidal
    direction.


    Representative magnitudes are highly regime- and closure-dependent, so there is
    no universal device-independent range in $\mathrm{A\,m^{-2}}$. The value is expected
    to be near zero where perpendicular viscous stress gradients are weak and can
    become localized in edge, scrape-off-layer, or strongly sheared-flow regions;
    interpretation is usually made relative to the total radial current density and
    to the other modeled current-density channels in the same calculation.


    Sign convention: Positive when the current flows in the direction of increasing
    major radius $R$, outward from the toroidal symmetry axis.'
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_profiles/ggd/j_perpendicular_viscosity/radial
    dd_path: edge_profiles/ggd/j_perpendicular_viscosity/radial
    status: attached
  - id: dd:plasma_profiles/ggd/j_perpendicular_viscosity/r
    dd_path: plasma_profiles/ggd/j_perpendicular_viscosity/r
    status: composed
  - id: dd:plasma_profiles/ggd/j_perpendicular_viscosity/radial
    dd_path: plasma_profiles/ggd/j_perpendicular_viscosity/radial
    status: composed
- name: radial_derivative_of_fast_electron_density
  kind: scalar
  status: draft
  description: First-order radial derivative of the fast (non-thermal) electron number
    density with respect to the normalized toroidal flux coordinate.
  documentation: 'The radial derivative of fast electron density quantifies how the
    suprathermal (non-thermal) electron number density $n_\mathrm{fast}$ varies with
    the normalized toroidal flux coordinate $\rho_\mathrm{tor,norm}$, which parameterizes
    nested flux surfaces from 0 at the magnetic axis to 1 at the separatrix. This
    gradient characterizes the spatial structure of the non-thermal electron population
    as distinct from the bulk thermal electrons.


    The quantity is defined as:


    $$

    \frac{dn_\mathrm{fast}}{d\rho_\mathrm{tor,norm}}

    $$


    where $n_\mathrm{fast}$ is the [fast electron density](name:fast_electron_density)
    and $\rho_\mathrm{tor,norm}$ is the normalized toroidal flux radius ranging from
    0 at the magnetic axis to 1 at the last closed flux surface.


    This derivative is evaluated numerically within transport solvers from the radial
    distribution of fast electron density, serving as input to the discretized transport
    equations governing non-thermal electron evolution. The [second radial derivative
    of fast electron density](name:second_radial_derivative_of_fast_electron_density)
    provides higher-order curvature information for the same population. The analogous
    gradient for the total electron population is [radial_derivative_of_total_electron_density](name:radial_derivative_of_total_electron_density),
    and for non-thermal ions, [radial_derivative_of_fast_ion_density](name:radial_derivative_of_fast_ion_density)
    provides a direct parallel.


    Sign convention: Positive when the fast electron density $n_\mathrm{fast}$ increases
    with increasing $\rho_\mathrm{tor,norm}$, corresponding to a suprathermal electron
    population concentrated toward the plasma boundary rather than the magnetic axis.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_electron_density
  - name:second_radial_derivative_of_fast_electron_density
  - name:radial_derivative_of_total_electron_density
  - name:radial_derivative_of_fast_ion_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/density_fast
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/density_fast
    status: composed
- name: radial_derivative_of_fast_ion_state_density
  kind: scalar
  status: draft
  description: First derivative of the fast (non-thermal) ion number density for a
    specified charge state with respect to normalized toroidal flux radius rho_tor,norm.
  documentation: 'The radial derivative of fast-ion state density is the change of
    the number density of non-thermal ions in a specified charge state with respect
    to the normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$. It is the radial-gradient
    counterpart of [fast_ion_state_density](name:fast_ion_state_density) and is distinct
    from the charge-state-summed [radial_derivative_of_fast_ion_density](name:radial_derivative_of_fast_ion_density).


    It is defined by differentiating the charge-state-resolved fast-ion density with
    respect to $\rho_{\mathrm{tor,norm}}$:


    $$

    g_s(\rho_{\mathrm{tor,norm}}) = \frac{\partial n_{\mathrm{fast},s}}{\partial \rho_{\mathrm{tor,norm}}}

    $$


    where $g_s$ is the radial derivative, $n_{\mathrm{fast},s}$ is the fast-ion state
    density for charge state $s$ in m$^{-3}$, and $\rho_{\mathrm{tor,norm}}$ is the
    dimensionless normalized toroidal flux radius, with $\rho_{\mathrm{tor,norm}}=0$
    at the magnetic axis and $\rho_{\mathrm{tor,norm}}=1$ at the plasma boundary.


    In practice this derivative is computed numerically from charge-state-resolved
    fast-ion density estimates obtained from fast-ion modeling, transport analysis,
    or diagnostic-constrained reconstruction. Finite-difference, spline, or other
    differentiation methods may be used, so the value is sensitive to radial grid
    resolution, smoothing, and boundary treatment, especially near localized sources,
    loss regions, or steep transport barriers. It enters gradient-driven transport
    terms, for example diffusive particle flux contributions proportional to $-D_s\,\partial
    n_{\mathrm{fast},s}/\partial \rho_{\mathrm{tor,norm}}$, where $D_s$ is an effective
    diffusivity for charge state $s$.


    Typical absolute magnitudes are often $10^{16}$-$10^{20}$ m$^{-3}$ in neutral-beam-
    or radio-frequency-heated tokamak plasmas, with values approaching $10^{21}$ m$^{-3}$
    in sharply localized deposition, ionization, or loss regions. Weakly heated or
    nearly flat fast-ion populations can have gradients close to zero.


    Sign convention: Positive when the fast-ion density of the specified charge state
    increases with increasing normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$,
    outward from the magnetic axis toward the plasma boundary.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_ion_state_density
  - name:radial_derivative_of_fast_ion_density
  - name:second_radial_derivative_of_fast_ion_state_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/state/d_drho_tor_norm/density_fast
    dd_path: transport_solver_numerics/derivatives_1d/ion/state/d_drho_tor_norm/density_fast
    status: composed
- name: radial_derivative_of_ion_pressure
  kind: scalar
  status: draft
  description: First radial derivative of total ion pressure with respect to normalized
    toroidal flux coordinate, summed over all ion charge states.
  documentation: 'The radial derivative of total [ion_pressure](name:ion_pressure)
    quantifies how the aggregate ion pressure $P_i$, summed over all charge states,
    varies across nested flux surfaces. This pressure gradient drives neoclassical
    and anomalous transport fluxes, contributes to the radial force balance, and appears
    as a source term in the ion energy transport equation.


    The quantity is defined as:


    $$

    \frac{dP_i}{d\rho_\mathrm{tor,norm}}

    $$


    where $P_i$ is the total ion pressure in Pa and $\rho_\mathrm{tor,norm}$ is the
    normalized toroidal flux radius, equal to 0 at the magnetic axis and 1 at the
    separatrix.


    In transport solvers, this derivative is evaluated numerically from the ion pressure
    profile and used in the discretization of the radial transport equations. The
    [second_radial_derivative_of_ion_pressure](name:second_radial_derivative_of_ion_pressure)
    complements this quantity for higher-order finite-difference stencils. For charge-state-resolved
    calculations, the analogous quantity is [radial_derivative_of_ion_state_pressure](name:radial_derivative_of_ion_state_pressure);
    the electron counterpart is [radial_derivative_of_electron_pressure](name:radial_derivative_of_electron_pressure).


    In typical H-mode plasmas the ion pressure peaks at the core and decreases toward
    the edge, so this derivative takes negative values throughout most of the profile,
    with the largest magnitudes occurring in the steep pedestal region.


    Sign convention: Positive when ion pressure increases with increasing normalized
    toroidal flux coordinate $\rho_\mathrm{tor,norm}$, that is, in the outward direction
    from the magnetic axis toward the plasma boundary.'
  unit: Pa
  physics_domain: transport
  links:
  - name:ion_pressure
  - name:second_radial_derivative_of_ion_pressure
  - name:radial_derivative_of_ion_state_pressure
  - name:radial_derivative_of_electron_pressure
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/d_drho_tor_norm/pressure
    dd_path: transport_solver_numerics/derivatives_1d/ion/d_drho_tor_norm/pressure
    status: composed
- name: radial_derivative_of_toroidal_electron_velocity
  kind: scalar
  status: draft
  description: Radial derivative of the signed toroidal electron fluid velocity, the
    phi component in the right-handed cylindrical (R, phi, Z) frame, with respect
    to the normalized toroidal flux radius rho_tor,norm.
  documentation: 'This quantity is the flux-coordinate derivative of the signed toroidal
    component of the electron fluid velocity in the right-handed cylindrical $(R,
    \phi, Z)$ frame. It describes how the toroidal electron flow changes between neighboring
    magnetic surfaces as the normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$
    increases from the magnetic axis toward the last closed flux surface.


    The derivative is defined by differentiating the toroidal electron velocity with
    respect to $\rho_{\mathrm{tor,norm}}$:


    $$

    \frac{\partial v_{\phi,e}}{\partial \rho_{\mathrm{tor,norm}}}

    $$


    where $v_{\phi,e}$ is the [toroidal electron velocity](name:toroidal_electron_velocity)
    in m.s^-1 and $\rho_{\mathrm{tor,norm}}$ is a dimensionless flux coordinate equal
    to 0 at the magnetic axis and 1 at the last closed flux surface. Because the differentiation
    coordinate is dimensionless, the derivative has the same unit as the velocity.


    In practice the quantity is obtained from the radial dependence of $v_{\phi,e}$
    on magnetic surfaces, using a smooth fitted representation or local numerical
    differentiation with respect to $\rho_{\mathrm{tor,norm}}$. It is the first-derivative
    counterpart of [second_radial_derivative_of_toroidal_electron_velocity](name:second_radial_derivative_of_toroidal_electron_velocity),
    and uses the same flux-coordinate differentiation concept as [radial_derivative_of_electron_pressure](name:radial_derivative_of_electron_pressure).


    Representative magnitudes in tokamak transport analysis are often of order 10^3-10^5
    m.s^-1 per unit $\rho_{\mathrm{tor,norm}}$, with values near zero where the toroidal
    electron velocity is radially flat. Larger local magnitudes can occur where the
    signed electron flow changes rapidly over a narrow interval in $\rho_{\mathrm{tor,norm}}$.


    Sign convention: Positive when the signed toroidal electron velocity component
    $v_{\phi,e}$, taken positive in the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, increases as $\rho_{\mathrm{tor,norm}}$
    increases from the magnetic axis toward the last closed flux surface.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_electron_velocity
  - name:radial_derivative_of_toroidal_ion_velocity
  - name:radial_derivative_of_poloidal_electron_velocity
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/velocity_phi
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/velocity_phi
    status: composed
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/velocity_tor
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/velocity_tor
    status: composed
- name: radial_derivative_of_total_electron_density
  kind: scalar
  status: draft
  description: First radial derivative of the total (thermal plus non-thermal) electron
    number density with respect to the normalized toroidal flux coordinate, used to
    evaluate electron density gradient terms in particle transport equations.
  documentation: 'The radial derivative of [total_electron_density](name:total_electron_density)
    quantifies how rapidly the combined thermal and non-thermal electron density changes
    along the normalized toroidal flux radius $\rho_\mathrm{tor,norm}$, where $\rho_\mathrm{tor,norm}
    = 0$ at the magnetic axis and $\rho_\mathrm{tor,norm} = 1$ at the last closed
    flux surface.


    The quantity is defined as:


    $$

    \frac{dn_e^\mathrm{tot}}{d\rho_\mathrm{tor,norm}}

    $$


    where $n_e^\mathrm{tot}$ is the total electron number density (thermal plus non-thermal
    contributions, in m$^{-3}$) and $\rho_\mathrm{tor,norm}$ is the dimensionless
    normalized toroidal flux coordinate.


    This gradient term enters directly into the discretized radial particle transport
    equation for electrons and is evaluated numerically from the density profile during
    transport solver iterations. The [second_radial_derivative_of_total_electron_density](name:second_radial_derivative_of_total_electron_density)
    provides the curvature term needed for higher-order discretization schemes. The
    corresponding quantity for the non-thermal electron sub-population is [radial_derivative_of_fast_electron_density](name:radial_derivative_of_fast_electron_density),
    while the ion-species analog is [radial_derivative_of_total_ion_density](name:radial_derivative_of_total_ion_density).


    Sign convention: Positive when total electron density increases in the direction
    of increasing $\rho_\mathrm{tor,norm}$, i.e., outward from the magnetic axis toward
    the plasma boundary.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:total_electron_density
  - name:second_radial_derivative_of_total_electron_density
  - name:radial_derivative_of_fast_electron_density
  - name:radial_derivative_of_total_ion_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/density
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d_drho_tor_norm/density
    status: composed
- name: radial_electron_energy_diffusion_coefficient
  kind: scalar
  status: draft
  description: Cross-field diffusivity for electron thermal energy transport in the
    radial, flux-surface-normal direction, appearing as the Fickian coefficient in
    the electron energy flux.
  documentation: 'Radial electron energy diffusion coefficient is the effective cross-field
    diffusivity for electron thermal energy transported normal to magnetic flux surfaces.
    It parameterizes the part of electron energy transport driven by gradients of
    electron thermal energy density, distinct from convective transport, sources,
    sinks, and exchange terms.


    In an energy-density formulation, the radial diffusive electron energy flux is
    commonly written as:


    $$

    q_{r,e}^{\mathrm{diff}} = -D_{r,e}^{E}\,\frac{\partial w_e}{\partial r}

    $$


    where $q_{r,e}^{\mathrm{diff}}$ is the outward radial diffusive electron energy
    flux in W m$^{-2}$, $D_{r,e}^{E}$ is the radial electron energy diffusion coefficient,
    $w_e$ is the electron thermal energy density in J m$^{-3}$, and $r$ is an outward-increasing
    radial distance variable normal to magnetic flux surfaces. The minus sign expresses
    down-gradient diffusion. For a nonrelativistic Maxwellian electron population,
    $w_e=3p_e/2$; if temperature is used instead, it must be converted consistently
    to energy density, for example through $p_e=n_e k_B T_e$ when $T_e$ is in kelvin.


    This coefficient is inferred from power-balance analysis, perturbative heat-pulse
    experiments, or transport modeling by separating diffusive transport from convection,
    local heating, radiation, and electron-ion energy exchange. It is an effective
    transport coefficient, so turbulent, neoclassical, and unresolved cross-field
    processes may all contribute.


    Typical core values in magnetically confined plasmas range from 0.1-1 m$^2$.s$^{-1}$
    in weakly turbulent or near-neoclassical regimes to 1-50 m$^2$.s$^{-1}$ in strongly
    turbulent or edge transport regions; larger effective values can occur during
    transients or in poorly confined plasmas.'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_ion_energy_diffusion_coefficient
  sources:
  - id: dd:plasma_transport/model/ggd/electrons/energy/d_radial/values
    dd_path: plasma_transport/model/ggd/electrons/energy/d_radial/values
    status: composed
- name: radial_ion_diffusion_coefficient
  kind: scalar
  status: draft
  description: Effective cross-field diffusivity relating the total ion particle flux
    to the outward radial gradient of total ion density across magnetic flux surfaces.
    It applies to the sum over ion charge states and is local to the radial position
    or flux surface used in the transport model.
  documentation: 'Radial ion diffusion coefficient is the effective particle diffusivity
    for total ions moving across nested magnetic flux surfaces. It parameterizes collisional,
    stochastic, and turbulent cross-field mixing of ion density and is summed over
    all ion charge states rather than resolving a specific ionization state. The quantity
    is local to the radial position or magnetic flux surface where the transport balance
    is evaluated; when densities and fluxes are flux-surface averaged, it represents
    the corresponding flux-surface-averaged effective coefficient.


    In a flux-coordinate description $(r, \theta, \phi)$, where $r$ is a physical
    radial distance increasing outward from the magnetic axis toward the separatrix
    and wall, $\theta$ is poloidal angle, and $\phi$ is toroidal angle, the diffusive
    part of the ion particle flux is commonly written as:


    $$

    \Gamma_{i,r}^{\mathrm{diff}} = -D_{i,r}\,\frac{\partial n_i}{\partial r}

    $$


    where $\Gamma_{i,r}^{\mathrm{diff}}$ is the radial diffusive ion particle flux,
    $D_{i,r}$ is the radial ion diffusion coefficient, and $n_i$ is the total ion
    density summed over charge states. The minus sign expresses down-gradient diffusion:
    for a density that decreases outward, a positive diffusivity gives an outward
    diffusive flux. If a dimensionless flux coordinate such as $\rho_{\mathrm{tor,norm}}$
    is used in $(\rho_{\mathrm{tor,norm}}, \theta, \phi)$, metric factors convert
    derivatives with respect to $\rho_{\mathrm{tor,norm}}$ into a physical radial
    gradient so that $D_{i,r}$ retains units of m^2.s^-1.


    The coefficient is obtained from interpretive particle-balance analysis, inferred
    effective transport modeling, or predictive neoclassical and turbulence calculations.
    It describes the diffusive component of radial ion particle transport and is distinct
    from convective pinch terms; for charge-state-resolved transport use [radial_ion_state_diffusion_coefficient](name:radial_ion_state_diffusion_coefficient),
    and for electron particle transport use [radial_electron_diffusion_coefficient](name:radial_electron_diffusion_coefficient).


    Typical effective values are about 0.01-1 m^2.s^-1 in well-confined core plasmas,
    0.1-10 m^2.s^-1 in edge and scrape-off-layer conditions, and may be smaller for
    nearly neoclassical transport or larger during strong turbulence and transient
    events.'
  unit: m^2.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_transport/model/ggd/ion/particles/d_radial/values
    dd_path: plasma_transport/model/ggd/ion/particles/d_radial/values
    status: composed
- name: radial_ion_energy_diffusion_coefficient
  kind: scalar
  status: draft
  description: Radial component of the diffusion coefficient governing cross-field
    transport of total ion thermal energy across magnetic flux surfaces, aggregating
    all ion species and charge states.
  documentation: 'The radial ion energy diffusion coefficient quantifies the diffusive
    transport of total ion thermal energy in the direction perpendicular to magnetic
    flux surfaces, combining contributions from all ion species and charge states
    into a single aggregate transport parameter.


    In the radial ion energy transport equation, the diffusive energy flux $q_{E}^{\rm
    rad}$ is proportional to the radial gradient of the ion energy density:


    $$

    q_{E}^{\rm rad} = -D_{E,\rm ion}^{\rm rad} \, \nabla_r \!\left(\tfrac{3}{2} n_i
    T_i\right)

    $$


    where $n_i$ is the total ion number density, $T_i$ is the ion temperature, and
    $\nabla_r$ denotes the gradient in the radial direction perpendicular to flux
    surfaces.


    This coefficient encapsulates both neoclassical contributions from collisional
    ion dynamics and anomalous contributions arising from plasma turbulence; in edge
    plasma regions the anomalous component typically dominates by one to two orders
    of magnitude. It is inferred from transport power balance analysis or prescribed
    in edge transport models. Typical magnitudes lie between $10^{-2}$ and $10$ m$^2$
    s$^{-1}$ in the edge plasma.


    For charge-state-resolved ion energy transport, the analogous quantity is [radial_ion_state_energy_diffusion_coefficient](name:radial_ion_state_energy_diffusion_coefficient).
    The radial ion particle transport analog is [radial_ion_diffusion_coefficient](name:radial_ion_diffusion_coefficient),
    and the radial momentum transport analog is [radial_ion_momentum_diffusion_coefficient](name:radial_ion_momentum_diffusion_coefficient).'
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:radial_ion_diffusion_coefficient
  sources:
  - id: dd:plasma_transport/model/ggd/ion/energy/d_radial/values
    dd_path: plasma_transport/model/ggd/ion/energy/d_radial/values
    status: composed
  - id: dd:plasma_transport/model/ggd/total_ion_energy/d_radial/values
    dd_path: plasma_transport/model/ggd/total_ion_energy/d_radial/values
    status: composed
- name: radial_neutral_particle_flux
  kind: scalar
  status: draft
  description: 'Radial component of the neutral particle flux density: the net number
    of neutral particles crossing a flux surface per unit area per unit time. It quantifies
    outward or inward neutral transport across magnetic surfaces.'
  documentation: 'Radial neutral particle flux is the flux-surface-normal component
    of the neutral particle flux density. In flux coordinates $(\rho,\theta,\phi)$,
    with $\rho$ increasing from the magnetic axis toward the plasma boundary, it represents
    the signed rate at which neutral particles cross a surface of constant $\rho$
    per unit area.


    The local constitutive definition is


    $$

    \Gamma_{n,r} = n_n \langle v_r \rangle

    $$


    where $\Gamma_{n,r}$ is the radial neutral particle flux density in m$^{-2}$ s$^{-1}$,
    $n_n$ is the neutral particle density in m$^{-3}$, and $\langle v_r \rangle$ is
    the mean neutral velocity component in m s$^{-1}$ along the outward radial direction.
    Equivalently, $\Gamma_{n,r}$ is the radial first velocity moment of the neutral
    distribution function.


    In transport analysis this quantity is obtained from neutral kinetic or fluid
    models, particle balance inversions, or coupled plasma-neutral simulations. It
    enters the neutral density continuity equation as the radial transport term and
    is affected by ionization, recombination, charge exchange, recycling, and wall
    or divertor sources.


    Typical magnitudes in the edge and scrape-off-layer range from $10^{18}$-$10^{22}$
    m$^{-2}$ s$^{-1}$, with the largest values usually occurring near recycling regions,
    gas sources, and steep neutral density gradients. Core values are often much smaller
    because neutral penetration is limited by ionization and charge exchange.


    Sign convention: Positive when the neutral particle flow is in the direction of
    increasing radial coordinate $\rho$ in flux coordinates $(\rho,\theta,\phi)$,
    outward from the magnetic axis toward the plasma boundary.'
  unit: m^-2.s^-1
  physics_domain: transport
  links: []
