  kind: scalar
  status: active
  description: Modulus of the complex normalized perturbed vector-potential component
    parallel to the equilibrium magnetic field for a gyrokinetic mode.
  documentation: 'This quantity is the non-negative amplitude of the normalized perturbed
    electromagnetic vector potential projected parallel to the equilibrium magnetic
    field. It describes the magnitude of the field-aligned electromagnetic fluctuation
    without retaining its phase or signed complex value.


    For a specified gyrokinetic mode, the amplitude is defined by


    $$

    \mathcal{A}_{\parallel,\mathrm{amp}} = \left|\widetilde{\mathcal{A}}_\parallel\right|

    $$


    where $\widetilde{\mathcal{A}}_\parallel$ is the complex normalized perturbed
    vector-potential eigenfunction parallel to the equilibrium magnetic field, and
    $|\cdot|$ denotes its complex modulus.


    This quantity is the modulus of [parallel normalized perturbed vector potential](name:parallel_normalized_perturbed_vector_potential),
    so it excludes the phase information and signed or complex value retained by that
    parent quantity. It is distinct from [parallel normalized perturbed magnetic field
    amplitude](name:parallel_normalized_perturbed_magnetic_field_amplitude), which
    represents a magnetic-field fluctuation rather than a vector-potential fluctuation.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential
  - name:parallel_normalized_perturbed_magnetic_field_amplitude
