- name: radial_coordinate_of_measurement_position
  kind: scalar
  status: active
  description: "Major-radius coordinate locating a measurement position by perpendicular\
    \ distance from the toroidal symmetry axis in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The radial coordinate of a measurement position is the major-radius
    location of that position, defined by its perpendicular separation from the toroidal
    symmetry axis. It identifies a single generic measurement location, independent
    of the instrument or plasma quantity associated with that location.


    The defining geometric relation is


    $$

    R_{\mathrm{meas}} = \left|\mathbf{r}_{\perp,\mathrm{meas}}\right|

    $$


    where $R_{\mathrm{meas}}$ is the major-radius coordinate of the measurement position,
    $\mathbf{r}_{\perp,\mathrm{meas}}$ is its perpendicular displacement from the
    toroidal symmetry axis, and the vertical bars denote the magnitude of that displacement.
    The coordinate is expressed in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The scope is one measurement position; no averaging, summation, or integration
    over positions is implied. This quantity applies to a generic measurement position
    and does not identify a particular diagnostic object, line of sight, toroidal
    angle, or vertical coordinate. Unlike [radial_coordinate_of_line_of_sight](name:radial_coordinate_of_line_of_sight),
    it is not restricted to a line-of-sight reference point.


    This quantity is the measurement-position specialization of the broader [radial_coordinate](name:radial_coordinate);
    the same perpendicular-distance definition is used, with the locus narrowed to
    a measurement position.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_line_of_sight
  sources:
  - dd_path: barometry/gauge/position/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/barometry.html#barometry-gauge-position-r
    dd_documentation:
      leaf: Major radius
      parent_path: barometry/gauge/position
      parent: Position of the measurements
