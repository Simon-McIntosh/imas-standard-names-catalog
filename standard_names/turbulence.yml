    dd_path: gyrokinetics/flux_surface/r_minor_norm
    status: composed
- name: parallel_gyrocenter_pressure
  kind: scalar
  status: draft
  description: Normalized parallel pressure moment of the perturbed gyrocenter distribution
    for a gyrokinetic eigenmode.
  documentation: 'The parallel gyrocenter pressure $p_{\parallel}$ is the second-order
    parallel velocity moment $\int \frac{1}{2} m v_{\parallel}^2 \delta f\, \mathrm{d}^3v$
    of the perturbed gyrocenter distribution function $\delta f$, representing the
    parallel thermal energy density of the fluctuation. This normalized quantity is
    a component of the pressure vector $[\text{gyrocenter\_pressure}](name:gyrocenter\_pressure)$
    evaluated at a specific wavevector $(k_x, k_y)$ in a linear gyrokinetic eigenvalue
    problem. In gyrokinetic simulations of microinstabilities, $p_{\parallel}$ together
    with $[\text{perpendicular\_gyrocenter\_pressure}](name:perpendicular\_gyrocenter\_pressure)$
    characterizes the anisotropy of the pressure perturbation, which governs the linear
    stability through the curvature and $\nabla B$ drifts. Typical values for ion-temperature-gradient
    (ITG) or trapped-electron-mode (TEM) instabilities are of order $10^{-3}$--$10^{-1}$
    relative to the background pressure, with the parallel component often smaller
    than the perpendicular component for electromagnetic modes. The cross-phase with
    the electrostatic potential determines the turbulent heat flux from thermodynamic
    forces.


    Sign convention: Positive when the parallel pressure perturbation is in phase
    with the density perturbation.


    Referred to the $[\text{normalized\_gyrocenter\_pressure}](name:normalized\_gyrocenter\_pressure)$
    base quantity, $p_{\parallel}$ isolates the field-aligned component of the pressure
    tensor, enabling separate analysis of parallel and perpendicular energy transfer
    in gyrokinetic flux-tube simulations.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter
  - name:perpendicular
  - name:normalized
  arguments:
  - name: gyrocenter_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
