- name: vertical_front_surface_radius_of_optical_element
  kind: scalar
  status: active
  description: Radius of curvature of an optical element's beam-entry front surface
    along the local second tangential direction (X2, the optical-element vertical
    direction) in the right-handed local optical-element frame (X1, X2, z).
  documentation: 'Radius of curvature of an optical element''s beam-entry front surface
    along the local second tangential ($X_2$, optical-element vertical) direction
    is the signed radius of the front-surface normal section spanned by $\hat{X}_2$
    and $\hat{z}$ in the right-handed local optical-element frame $(\hat{X}_1,\hat{X}_2,\hat{z})$.
    The coordinates $x_1$ and $x_2$ lie in the local tangent plane at the surface
    vertex, and $z$ is the local front-surface-normal sag coordinate. This is a radius
    of curvature, not a reciprocal curvature.


    At the surface vertex, after subtracting planar tilt so that $\partial z/\partial
    x_2=0$ there, the signed radius is defined by the second derivative of the sag
    in the $X_2$ normal section:


    $$

    \frac{1}{R_2} = \left.\frac{\partial^2 z}{\partial x_2^2}\right|_{x_2=0}

    $$


    where $z(x_2)$ is the front-surface sag along $\hat{z}$, $x_2$ is displacement
    along $\hat{X}_2$, and $R_2$ is this signed radius; $z$, $x_2$, and $R_2$ are
    in meters. For small sag this definition implies $z(x_2)-z(0)\simeq x_2^2/(2R_2)$
    near the vertex, and a flat section is the limiting case $1/R_2=0$.


    For spherical surface models the first- and second-local-tangential radii of the
    front surface are equal. For cylindrical, toroidal, or separably curved surface
    models they may differ, so this quantity is distinct from the orthogonal first-local-tangential
    front-surface quantity x_front_surface_curvature_of_optical_element and from the
    rear-surface quantity [vertical_back_surface_curvature_of_optical_element](name:vertical_back_surface_curvature_of_optical_element);
    [vertical_front_surface_curvature_of_optical_element](name:vertical_front_surface_curvature_of_optical_element)
    uses the same second-local-tangential front-surface radius convention.


    Sign convention: Positive when the center of curvature of the front surface in
    the normal section spanned by $\hat{X}_2$ and $\hat{z}$ lies on the $+\hat{z}$
    side of the local tangent plane.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_back_surface_curvature_of_optical_element
  - name:vertical_front_surface_curvature_of_optical_element
  sources:
  - dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_curvature
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-reflector-x2_curvature
