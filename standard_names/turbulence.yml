- name: parallel_normalized_gyrocenter_perturbed_current_density
  kind: scalar
  status: draft
  description: Normalized parallel current-density perturbation obtained from the
    charge-weighted first parallel-velocity moment of a species perturbed gyrocenter
    distribution function. For a linear gyrokinetic eigenmode it is generally complex,
    carrying amplitude and phase.
  documentation: 'Parallel normalized gyrocenter perturbed current density is the
    dimensionless species contribution to the perturbed current flowing along the
    equilibrium magnetic field. It is a current-density moment, so the parallel velocity
    moment of the perturbed gyrocenter distribution is weighted by the species charge.
    In linear gyrokinetic eigenmode analysis the quantity is a complex amplitude;
    the real physical perturbation is obtained after applying the chosen eigenmode
    phase and time dependence.


    The species contribution is defined by normalizing the charge-weighted parallel
    velocity moment to a positive reference current density:


    $$

    \widehat{\delta j}_{\parallel,s} = \frac{q_s}{j_\mathrm{ref}} \int v_\parallel\,\delta
    f_s(\mathbf{R},\mathbf{v},t)\,d^3v

    $$


    where $q_s$ is the species charge in C, $v_\parallel$ is velocity along $\hat{b}=\mathbf{B}/|\mathbf{B}|$
    in m s$^{-1}$, $\delta f_s$ is the perturbed gyrocenter distribution with units
    m$^{-3}$(m s$^{-1}$)$^{-3}$, $d^3v$ is the velocity-space volume element with
    units (m s$^{-1}$)$^3$, and $j_\mathrm{ref}$ is the reference current density
    in A m$^{-2}$. The normalization makes $\widehat{\delta j}_{\parallel,s}$ dimensionless.


    In practice this moment is computed from the complex perturbed distribution function
    produced by a linear gyrokinetic calculation, using the same velocity-space quadrature
    as other gyrocenter moments. Species contributions can be compared individually
    or summed to form a total normalized parallel current response, provided the same
    $j_\mathrm{ref}$ is used. A related gyroaveraged current-density response includes
    finite-Larmor-radius gyroaveraging factors, whereas this perturbed gyrocenter
    moment is the direct charge-weighted moment of $\delta f_s$.


    Typical dimensionless magnitudes are normalization dependent because a linear
    eigenmode can be multiplied by an arbitrary complex constant. With eigenfunctions
    normalized to fluctuation amplitudes of order unity, species current moments are
    often 10$^{-4}$-10; relative amplitudes and phases are more meaningful than absolute
    values until the fluctuation amplitude and $j_\mathrm{ref}$ are specified.


    Sign convention: Positive when the charge-weighted parallel moment $q_s\int v_\parallel\delta
    f_s\,d^3v$ is directed along $\hat{b}=\mathbf{B}/|\mathbf{B}|$.'
  unit: '1'
  physics_domain: turbulence
