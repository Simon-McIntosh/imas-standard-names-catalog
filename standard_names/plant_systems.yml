    enhanced_context:
      description: Pumping flow rate of a specific molecular species through a gas
        pumping duct, representing the volumetric throughput removed from the vessel
        per unit time. Key quantity for particle inventory and exhaust control.
      kind: llm
- name: neon_count
  kind: scalar
  status: active
  description: Count of neon atoms expressed as an equivalent-electron inventory,
    where each neon atom contributes 10 equivalent electrons equal to its atomic number
    Z = 10.
  documentation: 'The neon count quantifies the neon atom inventory as a dimensionless
    equivalent-electron count. Each neon atom contributes $Z_{\rm Ne}$ equivalent
    electrons equal to the atomic number of neon, so the total inventory is:


    $$

    N_{\rm eq} = Z_{\rm Ne} \cdot N_{\rm Ne}

    $$


    where $N_{\rm Ne}$ is the number of neon atoms and $Z_{\rm Ne} = 10$ is the neon
    atomic number. This convention is shared across noble-gas and impurity species
    inventories; for comparison, [argon_count](name:argon_count) uses $Z_{\rm Ar}
    = 18$ and [krypton_count](name:krypton_count) uses $Z_{\rm Kr} = 36$. The [accumulated_neon_count](name:accumulated_neon_count)
    is the time-integrated form of this quantity, accumulating since plasma breakdown;
    the present quantity is the instantaneous or snapshot total at a given time.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_count
  - name:krypton_count
  - name:accumulated_neon_count
- name: accumulated_neon_count
  kind: scalar
  status: active
  description: Cumulative number of neon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons.
  documentation: "The accumulated neon count is the running temporal integral of the\
    \ neon gas injection rate from plasma breakdown onward, giving the total neon\
    \ inventory delivered to the plasma vessel over the discharge. Each injected neon\
    \ atom contributes to the tally in equivalent-electron units \u2014 the raw particle\
    \ count scaled by the neon atomic number $Z_\\mathrm{Ne} = 10$ \u2014 enabling\
    \ direct comparison with other injected fuel and impurity species.\n\nThe defining\
    \ integral is:\n\n$$\nN_\\mathrm{acc}(t) = Z_\\mathrm{Ne} \\int_{t_0}^{t} \\dot{n}_\\\
    mathrm{Ne}(t') \\, dt'\n$$\n\nwhere $\\dot{n}_\\mathrm{Ne}$ is the instantaneous\
    \ neon injection rate in atoms per second, $t_0$ is the time of plasma breakdown,\
    \ and $Z_\\mathrm{Ne} = 10$ is the neon atomic number.\n\nThis quantity is determined\
    \ from calibrated gas valve flow measurements integrated temporally throughout\
    \ the discharge. It is particularly relevant in impurity seeding and disruption\
    \ mitigation experiments where the cumulative neon dose governs radiated power\
    \ fractions and pedestal stability.\n\nThe parent neon_count provides phase-specific\
    \ or instantaneous counts; [neon_prefill_count](name:neon_prefill_count) covers\
    \ the pre-breakdown injection phase exclusively. Analogous accumulated quantities\
    \ for other injected species include [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ and [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection).\n\
    \nSign convention: Positive when neon gas is injected, so the accumulated count\
    \ increases monotonically from zero at plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:neon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
  arguments:
  - name: neon_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/neon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-neon-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_accumulated/neon
      parent: Neon
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Neon.
      kind: template
- name: neon_source_rate
  kind: scalar
  status: active
  description: Instantaneous injection rate of neon gas into the plasma vessel, expressed
    in equivalent electrons per second.
  documentation: 'The neon source rate quantifies the instantaneous rate at which
    neon gas is introduced into the plasma vessel through gas injection systems. Each
    neon atom (atomic number $Z = 10$) contributes 10 equivalent electrons to the
    count, so the source rate equals 10 times the atomic injection rate expressed
    in atoms per second. Neon seeding is widely applied in fusion devices to control
    edge radiation and protect plasma-facing components from excessive heat loads,
    and is also employed in disruption mitigation scenarios requiring rapid radiative
    cooling. The source rate is inferred from calibrated flow controllers or gas injection
    valve diagnostics, with values ranging from $10^{20}$ to $10^{23}$ s$^{-1}$ depending
    on the seeding scenario. Integrating this rate over time yields the [accumulated
    neon count](name:accumulated_neon_count). Analogous injection rates for other
    species include [nitrogen_source_rate](name:nitrogen_source_rate) and [oxygen_source_rate](name:oxygen_source_rate),
    which follow the same equivalent-electron convention.


    Sign convention: Positive when neon gas is being injected into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_neon_count
  - name:nitrogen_source_rate
  - name:oxygen_source_rate
  sources:
  - dd_path: summary/gas_injection_rates/neon/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-neon-value
    dd_documentation:
