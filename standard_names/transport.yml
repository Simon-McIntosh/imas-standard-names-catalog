- name: electron_collisionality
  kind: scalar
  status: draft
  description: Collision frequency of electrons normalized to the bounce frequency,
    characterizing the neoclassical transport regime.
  documentation: "Electron collisionality, denoted $\\nu^*_e$, is defined as the ratio\
    \ of the effective electron collision frequency $\\nu_e$ to the bounce frequency\
    \ $\\omega_b$ of trapped particles on a given flux surface: $\\nu^*_e = \\nu_e\
    \ / \\omega_b$. This dimensionless parameter distinguishes the three neoclassical\
    \ transport regimes: the banana regime ($\\nu^*_e \\ll 1$), the plateau regime\
    \ ($\\nu^*_e \\sim 1$), and the Pfirsch-Schl\xFCter regime ($\\nu^*_e \\gg 1$).\
    \ It is computed from the electron density and temperature profiles, and is essential\
    \ for predicting confinement and bootstrap current fractions in tokamak and stellarator\
    \ plasmas. Typical core values range from $10^{-2}$ to $10$, depending on density\
    \ and temperature. See also [normalized_electron_collisionality](name:normalized_electron_collisionality)\
    \ for an alternative normalization convention.\n\nSign convention: Positive when\
    \ the collision frequency exceeds the bounce frequency.\n\nIn the banana regime,\
    \ the collisionless trapped-particle orbits dominate heat and particle transport,\
    \ while in the plateau and Pfirsch-Schl\xFCter regimes, the transport is increasingly\
    \ collisional and local. The quantity is closely related to [coulomb_logarithm](name:coulomb_logarithm),\
    \ which sets the magnitude of the collision frequency, and to [effective_charge](name:effective_charge),\
    \ which influences the collision frequency through impurity content."
  unit: '1'
  physics_domain: transport
  links:
  - name:normalized_electron_collisionality
  - name:coulomb_logarithm
  - name:effective_charge
  sources:
  - id: dd:plasma_profiles/profiles_1d/electrons/collisionality_norm
    dd_path: plasma_profiles/profiles_1d/electrons/collisionality_norm
    status: composed
- name: electron_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Local number density of free electrons at the internal transport barrier
    location in the confined plasma.
  documentation: 'The electron number density $n_e$ at the internal transport barrier
    (ITB) location defines the local electron particle density $n_e(\rho_{\mathrm{ITB}})$
    in particles per cubic meter. This quantity is a key input for transport analysis,
    since the ITB is a region of strongly reduced anomalous transport that modifies
    the density and temperature profiles. Typical core ITB densities range from $10^{19}$
    to $10^{20}$ m$^{-3}$ in diverted tokamak plasmas, depending on the fueling and
    heating conditions. The density is routinely measured by Thomson scattering, microwave
    reflectometry, or interferometry, and is used together with the electron temperature
    to evaluate the local pressure gradient, a driver for ITB formation. The related
    quantity [electron_density](name:electron_density) gives the full radial profile,
    while [iron_density_at_internal_transport_barrier](name:iron_density_at_internal_transport_barrier)
    and [helium_3_density_at_internal_transport_barrier](name:helium_3_density_at_internal_transport_barrier)
    provide comparative impurity densities at the same location.


    Sign convention: Positive when electron particle number increases, corresponding
    to higher local charge carrier concentration.


    This single-value summary provides a direct measure of the ITB plasma conditions
    for global confinement analysis.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:iron_density_at_internal_transport_barrier
  - name:helium_3_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_e/value
    dd_path: summary/local/itb/n_e/value
    status: composed
- name: helium_3_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: "Number density of singly ionized helium-3 (\xB3He\u207A) particles\
    \ at the location of the internal transport barrier."
  documentation: 'The helium-3 ion density $n_{^3\text{He}^+}$ at the internal transport
    barrier (ITB) quantifies the concentration of this minority fusion-born or externally
    injected species at the radial position where sheared plasma rotation or reversed
    magnetic shear suppresses turbulent transport, forming a transport barrier. ITBs
    are characterized by steep density and temperature gradients, so the local helium-3
    density is both a tracer of barrier confinement quality and a source for fusion
    reactions in advanced scenarios. Measured by charge-exchange recombination spectroscopy
    (CXRS) or inferred from equilibrium reconstruction, with typical values ranging
    from $10^{16}$ to $10^{19}\,\text{m}^{-3}$ in the barrier region of medium- to
    large-size tokamaks. Related quantities include the helium-3 density profiles
    at other internal locations such as [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis)
    and [helium_3_density_at_separatrix](name:helium_3_density_at_separatrix), as
    well as the local barrier properties captured by [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier).


    Sign convention: Positive when the helium-3 density at the ITB location is non-zero.
    Density is a non-negative scalar; negative values are unphysical and would indicate
    a measurement error or inversion artifact.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:helium_3_density_at_magnetic_axis
  - name:helium_3_density_at_separatrix
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/helium_3/value
    dd_path: summary/local/itb/n_i/helium_3/value
    status: composed
- name: helium_3_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of helium-3 ions at the magnetic axis.
  documentation: The number density of singly-ionized helium-3 ions at the magnetic
    axis.  Helium-3 is a minority ion species commonly introduced through neutral
    beam injection or ion cyclotron resonance heating; its density at the axis is
    a key input for fusion power calculations and fast-ion confinement studies.  Density
    values are always non-negative and are typically in the range $10^{16}$ to $10^{20}\,\mathrm{m}^{-3}$,
    depending on fueling and transport conditions.  In tokamaks, the on-axis density
    of helium-3 is often inferred from charge-exchange recombination spectroscopy
    or from neutral particle analyzer measurements, and may be compared with the line-averaged
    or volume-averaged density to assess profile peaking.
  unit: m^-3
  physics_domain: transport
