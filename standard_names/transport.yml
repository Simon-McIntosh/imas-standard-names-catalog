- name: trapped_fast_particle_power_density_due_to_collisions
  kind: scalar
  status: draft
  description: Coulomb-collisional power density deposited in or removed from the
    fast-particle population by the trapped-orbit part of the fast-particle distribution.
  documentation: 'Trapped fast-particle collisional power density is the local rate
    per unit volume at which Coulomb collisions exchange kinetic energy with the fast-particle
    population, restricted to particles on trapped orbits. It is the trapped-orbit
    contribution to [fast_particle_power_density_due_to_collisions](name:fast_particle_power_density_due_to_collisions),
    complementary to co-passing and counter-passing orbit-class contributions.


    For a species $s$, a kinetic definition is the energy moment of the collision
    operator over the trapped region of velocity space:


    $$

    P_{\mathrm{trap}} = \int_{\Omega_{\mathrm{trap}}} \frac{1}{2} m_s v^2\, C_{\mathrm{fast}}[f_{\mathrm{trap}}](\mathbf{v})\,
    d^3v

    $$


    where $P_{\mathrm{trap}}$ is in W m^-3, $m_s$ is the particle mass in kg, $\mathbf{v}$
    is the velocity vector, $v = |\mathbf{v}|$ is in m s^-1, $f_{\mathrm{trap}}$ is
    the trapped-orbit part of the fast-particle distribution with units m^-3 (m s^-1)^-3,
    $C_{\mathrm{fast}}[f_{\mathrm{trap}}]$ is the Coulomb-collisional rate of change
    of that distribution contributing to the fast population with units m^-3 s^-1
    (m s^-1)^-3, and $d^3v$ is the velocity-space volume element with units m^3 s^-3.
    The domain $\Omega_{\mathrm{trap}}$ contains velocity-space points whose guiding-center
    orbits are trapped; in large-aspect-ratio notation this is often approximated
    by $v_\parallel^2/v^2 < \epsilon$, where $v_\parallel$ is the velocity parallel
    to the magnetic field and $\epsilon \simeq r/R$ is the local inverse aspect ratio.


    This quantity is computed from kinetic transport, Fokker-Planck, Monte Carlo,
    or reduced fast-particle models by applying Coulomb collision operators to the
    trapped part of the distribution and taking the kinetic-energy moment. Experimentally
    constrained estimates use reconstructed fast-particle distributions, magnetic-equilibrium
    information for orbit classification, and background density and temperature profiles
    that determine the collisional coefficients.


    Typical absolute magnitudes are about 10^3-10^7 W m^-3 in neutral-beam, radio-frequency,
    or fusion-alpha fast-particle populations, with values below 10^3 W m^-3 in weak
    tails or near depleted regions and localized peaks approaching 10^8 W m^-3 in
    compact high-power scenarios. The sign can be either positive or negative depending
    on whether collisions heat or slow the trapped fast-particle population.


    Sign convention: Positive when Coulomb collisions transfer kinetic energy to the
    fast-particle population associated with trapped orbits.'
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:fast_particle_power_density_due_to_collisions
  - name:counter_passing_fast_particle_power_density_due_to_collisions
  - name:trapped_fast_electron_power_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/collisions/electrons/power_fast
    dd_path: distributions/distribution/profiles_1d/trapped/collisions/electrons/power_fast
    status: composed
- name: trapped_fast_particle_pressure
  kind: scalar
  status: draft
  description: Flux-surface-averaged isotropic pressure carried by energetic non-thermal
    particles on trapped guiding-center orbits. It is the scalar pressure moment of
    the trapped part of the fast-particle distribution function.
  documentation: 'Trapped fast-particle pressure is the scalar kinetic pressure contributed
    by energetic non-thermal particles whose guiding-center orbits bounce between
    magnetic mirror points rather than circulating freely around the torus. It is
    the trapped-orbit component of the total fast-particle pressure and contributes
    to equilibrium pressure balance and energetic-particle drive while giving little
    direct contribution to net toroidal current in an axisymmetric plasma.


    For a set of fast-particle species, the trapped scalar pressure is the second
    velocity moment of the distribution over the trapped part of velocity space:


    $$

    p_{\mathrm{fast,tr}} = \left\langle \sum_s \frac{m_s}{3} \int_{\Omega_{\mathrm{tr},s}}
    v^2 f_{\mathrm{fast},s}(\mathbf{x},\mathbf{v})\, d^3v \right\rangle_{\mathrm{FS}}

    $$


    where $s$ labels fast species, $m_s$ is particle mass in kg, $v$ is speed in m/s,
    $f_{\mathrm{fast},s}$ is the fast-particle phase-space density with units $s^3\,m^{-6}$
    when integrated over velocity space to give number density, $d^3v$ has units $m^3\,s^{-3}$,
    $\Omega_{\mathrm{tr},s}$ is the trapped-orbit region of velocity space, and $\langle\cdot\rangle_{\mathrm{FS}}$
    denotes a flux-surface average. The factor $1/3$ converts the scalar second moment
    into isotropic pressure. A common trapped-passing boundary uses pitch-angle cosine
    $\xi = v_\parallel/v$ with $|\xi| < \xi_T$ and $\xi_T = \sqrt{1 - B_{\min}/B_{\max}}$,
    where $B_{\min}$ and $B_{\max}$ are the minimum and maximum magnetic-field magnitudes
    sampled along the orbit.


    In an orbit-class decomposition, the total fast-particle pressure is the sum of
    trapped, co-passing, and counter-passing scalar contributions when those classes
    partition the same distribution. The quantity is computed from kinetic distribution
    functions produced by Fokker-Planck, Monte Carlo, guiding-center, or full-orbit
    models, or inferred by combining energetic-particle diagnostics with an equilibrium
    and a reconstructed distribution. Anisotropic descriptions instead use separate
    parallel and perpendicular pressure moments; those are distinct from this isotropic
    scalar pressure.


    Typical flux-surface-averaged trapped fast-particle pressures are about 10^2-10^4
    Pa in weakly heated plasmas, 10^4-10^5 Pa in strongly beam- or radio-frequency-heated
    tokamaks, and can approach 10^5-10^6 Pa locally in high-performance deuterium-tritium
    plasmas with significant alpha-particle pressure.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_particle_pressure
  - name:co_passing_fast_particle_pressure
  - name:counter_passing_fast_particle_pressure
  - name:parallel_trapped_fast_particle_pressure
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/pressure_fast
    dd_path: distributions/distribution/profiles_1d/trapped/pressure_fast
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/pressure_fast
    dd_path: distributions/distribution/profiles_2d/trapped/pressure_fast
    status: attached
- name: parallel_trapped_fast_particle_pressure
  kind: scalar
  status: draft
  description: Flux-surface-averaged field-aligned component of the pressure tensor
    for trapped fast particles. It is evaluated from the trapped-orbit part of the
    non-thermal distribution function and represents the parallel kinetic stress of
    that population.
  documentation: 'Parallel trapped fast particle pressure is the component of the
    fast-particle pressure tensor along the magnetic field, restricted to particles
    whose guiding-center orbits are trapped between mirror points. It is a flux-surface-averaged
    second velocity moment of the trapped-orbit part of the non-thermal distribution
    and quantifies the field-aligned kinetic stress carried by that population.


    The flux-surface-averaged parallel pressure is defined by the trapped fast-particle
    velocity moment:


    $$

    p_{\parallel,\mathrm{fast,tr}}(\psi) = \left\langle \sum_s m_s \int \left(v_\parallel
    - U_{\parallel s}\right)^2 f_{\mathrm{fast,tr},s}(\mathbf{x},\mathbf{v})\,d^3v
    \right\rangle_\psi

    $$


    where $\langle\cdot\rangle_\psi$ denotes an average over a closed magnetic flux
    surface labeled by $\psi$, $s$ indexes fast-particle species, $m_s$ is the species
    mass in kg, $v_\parallel$ and $U_{\parallel s}$ are velocities along the magnetic
    field in m s$^{-1}$, and $f_{\mathrm{fast,tr},s}$ is normalized so that $\int
    f_{\mathrm{fast,tr},s}\,d^3v = n_{\mathrm{fast,tr},s}$ with density in m$^{-3}$.
    If the retained fast-particle distribution has negligible mean parallel flow,
    $U_{\parallel s}$ is set to zero; for multiple fast species, the result is the
    mass-weighted sum of their separate moment contributions.


    This quantity is usually computed from a kinetic fast-particle distribution after
    classifying phase-space elements by trapped-orbit topology in the reconstructed
    magnetic equilibrium. It is not a direct diagnostic observable, but it can be
    constrained by energetic-particle measurements and by consistency with equilibrium
    and transport analysis. Because trapped particles reverse $v_\parallel$ along
    their bounce motion, the first parallel moment may be small while this second
    moment remains finite.


    Typical flux-surface-averaged values range from 10$^2$-10$^5$ Pa in heated tokamak
    core plasmas, with lower values toward the edge or in weak fast-particle populations.
    High-fast-pressure regimes can approach 10$^6$ Pa locally or on central flux surfaces,
    while the trapped parallel component may be much smaller than the total fast-particle
    pressure when the distribution is strongly perpendicular-anisotropic.'
  unit: Pa
  physics_domain: transport
  links: []
  arguments:
  - name: trapped_fast_particle_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/trapped/pressure_fast_parallel
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_2d/trapped/pressure_fast_parallel
    status: attached
- name: tritium_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Tritium ion number density evaluated at the radial location of an internal
    transport barrier.
  documentation: 'Tritium density at an internal transport barrier is the local number
    density of tritium ions at the radial position where an internal transport barrier
    has been identified. It counts tritium ions per unit volume and is a species-resolved
    fuel-density quantity, not a mass density.


    The density is the zeroth velocity-space moment of the tritium ion distribution
    function evaluated at the barrier location:


    $$

    n_T(\mathbf{x}_\mathrm{ITB}, t) = \int f_T(\mathbf{x}_\mathrm{ITB}, \mathbf{v},
    t)\, d^3v

    $$


    where $n_T$ is the tritium ion number density in m^-3, $f_T$ is normalized so
    that $f_T\,d^3x\,d^3v$ gives the number of tritium ions and therefore has units
    s^3 m^-6, $d^3v$ has units m^3 s^-3, and $\mathbf{x}_\mathrm{ITB}$ denotes the
    physical location of the internal transport barrier.


    In practice this quantity is obtained by evaluating an inferred or modeled tritium-density
    distribution at the barrier location. The tritium density may be constrained by
    isotope-fraction measurements, charge-exchange or spectroscopy where available,
    particle-balance modeling, fueling source accounting, and, in deuterium-tritium
    plasmas, neutron-emission constraints.


    Representative values are strongly scenario dependent. They can be effectively
    zero in plasmas without tritium fueling, may be below 10^18 m^-3 for trace-tritium
    conditions, and are commonly of order 10^19-10^20 m^-3 in high-density deuterium-tritium
    fuel mixtures.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:deuterium_density_at_internal_transport_barrier
  - name:tritium_density_at_pedestal
  - name:tritium_density_at_limiter
  - name:tritium_density_at_divertor_target
  - name:density_at_internal_transport_barrier
