- name: factor_of_spectrometer
  kind: scalar
  status: active
  description: Factor of spectrometer is the generic multiplicative coefficient associated
    with a spectrometer response or signal conversion. Its specific qualified form
    defines what signal is multiplied and what physical observable or corrected signal
    results.
  documentation: 'Factor of spectrometer is a parent quantity for multiplicative response
    coefficients of a spectrometer. It denotes the factor that scales a spectrometer
    signal or an already defined spectrometer-related quantity into the corresponding
    quantity specified by a more qualified standard name.


    For a purely multiplicative spectrometer response, the defining relation is:


    $$

    Q = F_{\mathrm{spec}} S

    $$


    where $S$ is the input spectrometer signal or quantity, $F_{\mathrm{spec}}$ is
    the spectrometer factor, and $Q$ is the resulting scaled quantity.


    This parent name does not by itself fix the target observable, signal convention,
    spectral dependence, or dimensional character of the factor; those semantics belong
    to its qualified descendants. The [calibration factor of spectrometer](name:calibration_factor_of_spectrometer)
    is one concrete specialization, where the factor represents an absolute calibration
    response rather than the entire parent category.'
  unit: m^-3.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:calibration_factor_of_spectrometer
  - name:spectral_etendue_of_spectrometer_channel
- name: calibration_factor_of_spectrometer
  kind: scalar
  status: active
  description: Multiplicative absolute radiometric calibration coefficient for a spectrometer
    response channel, mapping registered photon count rate to the corresponding photon
    radiance density. It abstracts calibration factors by their count-rate-to-radiance
    role rather than by a specific resolved-variable specialization.
  documentation: 'Calibration factor of a spectrometer is the multiplicative coefficient
    that places a spectrometer response channel on an absolute photon radiance-density
    scale. It represents the net radiometric response needed to convert the photon
    count rate registered in that channel into the corresponding photon radiance density.


    The defining relation is:


    $$

    \mathcal{L}_\gamma = C_\mathrm{cal} \, \dot{N}_\gamma

    $$


    where $\mathcal{L}_\gamma$ is the photon radiance density represented by the spectrometer
    response channel, $\dot{N}_\gamma$ is the photon count rate registered in the
    same channel, and $C_\mathrm{cal}$ is this calibration factor.


    This parent quantity is defined by the absolute radiometric count-rate-to-radiance
    conversion, not by the particular variable used to identify the spectrometer channel.
    The [spectral calibration factor of a spectrometer](name:spectral_calibration_factor_of_spectrometer)
    is the wavelength-resolved specialization; non-radiometric spectrometer factors
    and additive corrections such as background or dark-count offsets are excluded.'
  unit: m^-3.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:factor_of_spectrometer
  - name:spectral_calibration_factor_of_spectrometer
  - name:spectral_flux_of_spectrometer_channel
  arguments:
  - name: factor_of_spectrometer
    operator: calibration
    operator_kind: qualifier
- name: factor_of_visible_camera
  kind: scalar
  status: active
  description: Visible-camera factor is a multiplicative radiometric coefficient associated
    with visible-band camera measurements. In this dimensional convention, it scales
    a corrected dimensionless camera signal to band-integrated photon radiance while
    absorbing throughput, detector response, etendue, and exposure treatment.
  documentation: 'Visible-camera factor is a parent concept for multiplicative radiometric
    coefficients used with visible-band camera measurements. It represents the response
    factor that converts a consistently corrected, dimensionless detector signal into
    absolute photon radiance integrated over the relevant spectral band, with optical
    throughput, detector response, electronics, exposure treatment, and viewing etendue
    condensed into one coefficient. The absolute-calibration specialization [calibration
    factor of visible camera](name:calibration_factor_of_visible_camera) is one concrete
    member of this factor family.


    When used in the radiance-calibration direction, the defining relationship is


    $$

    L_\gamma = F_\mathrm{vis} S_\mathrm{corr}

    $$


    where $L_\gamma$ is the band-integrated photon radiance, $F_\mathrm{vis}$ is the
    visible-camera factor, and $S_\mathrm{corr}$ is a dimensionless detector signal
    after the corrections and normalizations specified for the factor. A signal represented
    as a rate would require a coefficient with different dimensionality, so the treatment
    of exposure time or frame integration is part of the factor definition.


    The factor is determined by radiometric calibration with a source of known photon
    radiance, by end-to-end modeling of the optical and detector response, or by a
    hybrid of both. The calibration must be consistent with dark subtraction, background
    removal, flat-fielding, nonlinearity correction, spectral filtering, and any conversion
    between camera electronics and corrected signal.


    Numerical values are highly instrument-specific because throughput, etendue, exposure
    duration, gain, and bandpass can vary widely. For visible imaging channels, values
    of order $10^{12}$-$10^{19}$ per corrected count are common; a single constant
    factor is not valid for saturated, nonlinear, or configuration-dependent response
    unless those effects are explicitly included.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:calibration_factor_of_visible_camera
  - name:brightness_of_visible_camera
  - name:calibration_factor_of_spectrometer
- name: calibration_factor_of_visible_camera
  kind: scalar
  status: active
  description: Multiplicative radiometric coefficient that converts a corrected visible-camera
    detector signal into absolute photon radiance integrated over the admitted spectral
    band.
  documentation: 'A visible-camera radiometric factor converts a consistently corrected
    detector signal into band-integrated photon radiance. It represents the combined
    response of the optical throughput, detector sensitivity, pixel etendue, and exposure
    treatment rather than the radiance itself.


    The defining conversion is


    $$

    L_{\mathrm{vis}} = C_{\mathrm{vis}} S_{\mathrm{corr}}

    $$


    where $L_{\mathrm{vis}}$ is the [visible-camera brightness](name:brightness_of_visible_camera),
    $C_{\mathrm{vis}}$ is this visible-camera factor, and $S_{\mathrm{corr}}$ is the
    corrected detector signal. The spectral dependence is integrated over the relevant
    visible passband. Unlike the resulting brightness, the factor is a calibration
    coefficient and must be applied to the corrected signal; it is the camera-specific
    component of the parent [factor of visible camera](name:factor_of_visible_camera).'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:brightness_of_visible_camera
  - name:factor_of_visible_camera
  arguments:
  - name: factor_of_visible_camera
    operator: calibration
    operator_kind: qualifier
  sources:
  - dd_path: camera_visible/channel/detector/counts_to_radiance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_visible.html#camera_visible-channel-detector-counts_to_radiance
    dd_documentation:
