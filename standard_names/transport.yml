- name: toroidal_trapped_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal current density associated with the
    trapped part of a particle distribution. It includes the fast-particle contribution
    and the accompanying thermal electron and ion drag back-current.
  documentation: 'Toroidal trapped current density is the flux-surface average of
    the toroidal component of current associated with particles classified as trapped
    in the magnetic field. It represents the total trapped-sector contribution in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    The total trapped contribution is decomposed into the direct fast-particle moment
    and the thermal drag-current response:


    $$

    \langle J_{\phi,\mathrm{trap}} \rangle = \langle J_{\phi,\mathrm{trap}}^{\mathrm{fast}}
    \rangle + \langle J_{\phi,\mathrm{trap}}^{\mathrm{drag},e} \rangle + \langle J_{\phi,\mathrm{trap}}^{\mathrm{drag},i}
    \rangle

    $$


    where $\langle J_{\phi,\mathrm{trap}} \rangle$, $\langle J_{\phi,\mathrm{trap}}^{\mathrm{fast}}
    \rangle$, $\langle J_{\phi,\mathrm{trap}}^{\mathrm{drag},e} \rangle$, and $\langle
    J_{\phi,\mathrm{trap}}^{\mathrm{drag},i} \rangle$ are flux-surface-averaged toroidal
    current densities in A.m^-2. The full passing/trapped decomposition also includes
    the co-passing and counter-passing toroidal current-density contributions.


    In practice, this quantity is computed from kinetic distribution functions by
    identifying trapped phase-space orbits, taking the charge-weighted toroidal-velocity
    moment of the fast species, and adding the collisional momentum-balance response
    of thermal electrons and ions. It is usually constrained indirectly by magnetic-equilibrium
    information, total-current measurements, and fast-particle diagnostics rather
    than measured as an isolated component.


    Typical magnitudes are 10^3-10^5 A.m^-2 in auxiliary-heated tokamak plasmas and
    can approach 10^6 A.m^-2 in strongly driven regions. The signed total may be much
    smaller than the direct fast-particle term when electron and ion drag-current
    contributions partially cancel it.


    Sign convention: Positive when $J_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/current_phi
    dd_path: distributions/distribution/profiles_1d/trapped/current_phi
    status: attached
  - id: dd:distributions/distribution/profiles_1d/trapped/current_tor
