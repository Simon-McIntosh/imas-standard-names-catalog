    limiter-side evaluation position in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    The density is summed over all positive helium-3 ionization states and excludes
    neutral helium-3 atoms. It is the helium-3-specific member of [density at a limiter](name:density_at_limiter)
    and differs from [ion density at a limiter](name:ion_density_at_limiter), which
    is not restricted to helium-3; [helium-4 density at a limiter](name:helium_4_density_at_limiter)
    describes the corresponding isotope.'
