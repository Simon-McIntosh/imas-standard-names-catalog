name: normalized_pressure_gradient_alpha_parameter_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Experimentally measured normalized pressure gradient parameter $\alpha$
  at the pedestal, quantifying the MHD drive for ballooning instabilities.
documentation: The normalized pressure gradient $\alpha$ is defined as $\alpha = -\frac{2
  \mu_0 R q^2}{B^2} \frac{dp}{dr}$, where $R$ is the major radius (m), $q$ is the
  safety factor, $B$ is the magnetic field magnitude (T), and $dp/dr$ is the total
  pressure gradient (Pa/m). This experimentally derived value represents the actual
  pedestal pressure gradient mapped onto the stability diagram, typically evaluated
  at the maximum-gradient location from an mtanh profile fit. In peeling-ballooning
  stability analysis, the experimental $\alpha$ is compared against the critical $\alpha_{\mathrm{crit}}$
  to assess proximity to the stability boundary. Typical values range from 1 to 5
  in H-mode tokamak pedestals. The quantity is computed from kinetic profile fits
  (Thomson scattering, charge-exchange recombination spectroscopy) combined with equilibrium
  reconstruction. See also `critical_normalized_pressure_gradient_at_pedestal_sauter_bootstrap`
  and `critical_normalized_pressure_gradient_at_pedestal_hager_bootstrap` for the
  stability limits.
