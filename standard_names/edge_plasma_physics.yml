    enhanced_context:
      description: Total ion density (ni_total) summed over all ion species at the
        separatrix. A key boundary parameter for edge plasma modelling and SOL transport.
      kind: template
- name: flux_surface_averaged_total_ion_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged total ion number density at the plasma boundary,
    summing all charged ion species and charge states equally while excluding neutral
    particles.
  documentation: 'This quantity is the flux-surface average of the total charged-ion
    particle density on the plasma boundary. Each charged ion contributes one particle
    regardless of species or charge state, while neutral atoms and molecules are excluded.


    The defining average is


    $$

    \langle n_i \rangle_b = \frac{\displaystyle\int_{S_b} \left(\sum_s \sum_{Z\geq
    1} n_{s,Z}\right)\frac{dS}{|\nabla\psi|}}{\displaystyle\int_{S_b}\frac{dS}{|\nabla\psi|}}

    $$


    where $S_b$ is the plasma-boundary flux surface, $n_{s,Z}$ is the number density
    of ion species $s$ in charge state $Z$, $dS$ is the surface-area element, and
    $\psi$ is a flux-surface label. This is the flux-surface-averaged counterpart
    of the local [total ion density at the plasma boundary](name:total_ion_density_at_plasma_boundary),
    not a charge-weighted density or a neutral-particle density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_density_at_plasma_boundary
  arguments:
  - name: total_ion_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix_average/n_i_total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i_total-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix_average/n_i_total
      parent: Total ion density (sum over species)
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Total ion density (ni_total), the sum of densities over all ion
        species, flux-surface averaged at the separatrix. Represents the total ion
        particle content at the core-SOL boundary.
      kind: template
- name: tritium_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of tritium ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core plasma.
  documentation: 'Tritium density at the pedestal top is the local number density
    of tritium ions (T$^+$, $Z=1$, $A=3$) at the shoulder of the H-mode edge transport
    barrier, where the steep edge density gradient transitions to the flatter confined-plasma
    core profile. The pedestal top is the common evaluation locus for the [density_at_pedestal_top](name:density_at_pedestal_top)
    family.


    The pedestal-top value is the local tritium ion density evaluated at the pedestal-top
    flux surface:


    $$

    n_{\mathrm{T,ped}} = \left.\frac{dN_{\mathrm{T}^+}}{dV}\right|_{\rho=\rho_{\mathrm{ped}}}

    $$


    where $dN_{\mathrm{T}^+}$ is the number of singly ionized tritium ions in the
    volume element $dV$, $\rho$ is the radial flux-surface label in flux coordinates
    $(\rho,\theta,\phi)$, $\theta$ and $\phi$ are the poloidal and toroidal angular
    coordinates in that coordinate set, and $\rho_{\mathrm{ped}}$ is the value of
    $\rho$ at the pedestal-top surface.


    As a species-level number density, this quantity is summed over all ionized charge
    states; for tritium, whose nuclear charge is one, the ionized contribution is
    T$^+$, so the charge-state sum reduces to the singly ionized tritium density.
    It excludes neutral tritium atoms and molecules, is one species-resolved contribution
    to [ion_density_at_pedestal_top](name:ion_density_at_pedestal_top), and is distinct
    from [deuterium_density_at_pedestal_top](name:deuterium_density_at_pedestal_top)
    and the effective combined-fuel quantity [deuterium_tritium_density_at_pedestal_top](name:deuterium_tritium_density_at_pedestal_top).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: tritium
    operator_kind: qualifier
- name: tritium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of tritium ions at the plasma boundary, evaluated as
    the local, intensive particle count per physical volume on the last closed magnetic
    flux surface.
  documentation: 'Number density of tritium ions at the plasma boundary is the local,
    intensive particle count per physical volume for the tritium-ion population evaluated
    on the last closed magnetic flux surface. The plasma boundary is the limiting
    closed magnetic flux surface separating confined plasma from the open-field-line
    scrape-off-layer region.


    The local tritium-ion number density is the zeroth velocity moment of the tritium-ion
    distribution function at a boundary point:


    $$

    n_\mathrm{T}(\mathbf{x}_b,t) = \int f_\mathrm{T}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_\mathrm{T}$ is the tritium-ion number density, $\mathbf{x}_b$ is a point
    on the last closed magnetic flux surface, $t$ is time, $\mathbf{v}$ is tritium-ion
    velocity, $f_\mathrm{T}$ is the tritium-ion phase-space distribution function,
    and $d^3v$ is the velocity-space volume element.


    This quantity applies specifically to ionized tritium and excludes neutral tritium,
    deuterium, protium, electrons, impurity ions, and total ion density. It is a local
    boundary value, with no averaging over the boundary surface or over a volume;
    for tritium, the relevant positive ion population is singly ionized tritium, so
    no aggregation over multiple positive ionization stages is applied.


    It is the tritium-specific instance of [density at the plasma boundary](name:density_at_plasma_boundary).
    The related [flux-surface-averaged tritium density at the plasma boundary](name:flux_surface_averaged_tritium_density_at_plasma_boundary)
    instead represents the average of tritium-ion density over the same last closed
    magnetic flux surface, while [hydrogen density at the plasma boundary](name:hydrogen_density_at_plasma_boundary)
    and [deuterium density at the plasma boundary](name:deuterium_density_at_plasma_boundary)
    refer to different hydrogen-isotope ion populations.'
  unit: m^-3
  physics_domain: edge_plasma_physics
