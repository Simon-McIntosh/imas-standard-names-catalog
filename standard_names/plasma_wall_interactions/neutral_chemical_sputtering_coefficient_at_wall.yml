name: neutral_chemical_sputtering_coefficient_at_wall
status: draft
cocos_transformation_type: one_like
description: Effective chemical sputtering yield due to a given neutral incident species,
  assuming sputtered atoms leave the wall at the local wall temperature.
documentation: "The chemical sputtering coefficient $Y_{\\rm chem}$ (dimensionless)\
  \ quantifies the mean number of wall-material atoms released per incident neutral\
  \ particle through thermally activated chemical reactions at the surface, as distinct\
  \ from momentum-transfer (physical) sputtering. Chemical sputtering is most significant\
  \ for carbon-based plasma-facing materials bombarded by hydrogen isotopes, where\
  \ hydrocarbon formation (e.g., CH$_4$) peaks at surface temperatures $T_{\\rm wall}\
  \ \\approx 600$\u2013900 K and incident energies of a few eV to tens of eV. Typical\
  \ $Y_{\\rm chem}$ values range from $10^{-3}$ to $10^{-1}$ depending on species,\
  \ energy, surface temperature, and flux. Sputtered neutrals are assumed to be thermalized\
  \ at the wall temperature (cold neutrals), which simplifies the source term in edge\
  \ neutral transport codes such as EIRENE. This coefficient complements the physical\
  \ sputtering yield (`neutral_physical_sputtering_coefficient_at_wall`) and together\
  \ they define the total sputtering source for impurity transport modeling."
