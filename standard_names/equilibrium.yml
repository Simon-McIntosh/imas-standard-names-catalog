    dd_path: pf_active/coil/b_field_max_timed
    status: attached
- name: minimum_magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Lowest magnetic-field strength found anywhere on a closed equilibrium
    flux surface, often near the outboard low-field side.
  documentation: 'The minimum magnetic-field magnitude is the smallest field strength
    reached along a closed equilibrium flux surface. It identifies the low-field part
    of the surface that helps set magnetic-mirror trapping boundaries, neoclassical
    orbit widths, and magnetic-well structure. It is the magnitude-resolved counterpart
    of [minimum magnetic field](name:minimum_magnetic_field_magnitude) and complements
    the high-field-side extremum [maximum magnetic field magnitude](name:maximum_magnetic_field_magnitude).


    For a flux surface labeled by poloidal magnetic flux $\psi$, the defining relation
    is


    $$

    B_{\min}(\psi) = \min_{\mathbf{x}\in S(\psi)} \left|\mathbf{B}(\mathbf{x})\right|

    $$


    where $S(\psi)$ is the closed flux surface, $\mathbf{x}$ is position on that surface,
    and $\mathbf{B}$ is the magnetic-field vector.


    This quantity is computed from an equilibrium magnetic-field solution after reconstructing
    the nested flux surfaces from external magnetics, internal magnetic pitch constraints,
    polarimetry, or motional-Stark-effect measurements. It is often used together
    with [flux-surface mean magnetic-field magnitude] to characterize field variation
    around a surface.


    Typical values range from about 0.2-1 T in spherical tokamaks, 1-4 T in medium-size
    tokamaks, and 4-8 T in high-field or reactor-scale scenarios. Because it is a
    magnitude and an extremum over a surface, it is always non-negative.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:minimum_magnetic_field_magnitude
  - name:maximum_magnetic_field_magnitude
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_min
