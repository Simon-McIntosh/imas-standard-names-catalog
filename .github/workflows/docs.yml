name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      - id: version
        run: |
          ref_name="${{ github.ref_name }}"
          clean_name="${ref_name#v}"
          
          if [[ $clean_name =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="v$(echo $clean_name | cut -d. -f1-2)"
            tagged=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}"
            tagged=false
          else
            version=${{ github.ref_name }}
            tagged=false
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tagged=$tagged" >> $GITHUB_OUTPUT
      
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
      
      - name: Build and deploy documentation
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch yet"
          uv run standard-names docs build standard_names/ \
            --version "${{ steps.version.outputs.version }}" --push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      
      - name: Update latest alias
        if: steps.version.outputs.tagged == 'true'
        run: uv run standard-names docs alias --version "${{ steps.version.outputs.version }}" --alias latest --push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
