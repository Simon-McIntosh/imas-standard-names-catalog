- name: flux_surface_averaged_beryllium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface average of the beryllium-ion number density over the plasma
    boundary, summed across beryllium ionization states.
  documentation: 'This quantity is the flux-surface-averaged number density of beryllium
    ions on the plasma boundary, with contributions from Be+ through Be4+. It differs
    from the local [beryllium density at the plasma boundary](name:flux_surface_averaged_beryllium_density_at_plasma_boundary)
    by averaging over the entire boundary surface.


    The flux-surface average is defined by


    $$

    \langle n_{\mathrm{Be}} \rangle = \frac{\oint n_{\mathrm{Be}}\,dS/|\nabla\psi|}{\oint
    dS/|\nabla\psi|}

    $$


    where $n_{\mathrm{Be}} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}$ is the total beryllium-ion
    number density, $dS$ is the surface element, and $\psi$ is the poloidal magnetic-flux
    label. The average is evaluated on the separatrix, the outermost closed magnetic
    flux surface.


    Sign convention: Positive when the beryllium-ion number density is positive.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
