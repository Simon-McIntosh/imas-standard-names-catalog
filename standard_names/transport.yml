- name: atomic_mass
  kind: scalar
  status: active
  description: Mass parameter assigned to a specified ion or neutral particle species,
    encoding its isotope or constituent composition for inertial and transport calculations.
  documentation: 'Atomic mass is the intrinsic mass parameter assigned to one specified
    ion or neutral particle species. It identifies an isotope for an atomic species
    or the constituent composition for a molecular or compound neutral, and provides
    the inertial scale used in collisional and transport physics.


    The mass is represented relative to the atomic mass unit by


    $$

    m_s = A_s m_u

    $$


    where $m_s$ is the atomic mass of the specified species, $A_s$ is its relative
    atomic mass, and $m_u$ is the atomic mass unit.


    The scope is one species definition at a time: either an ion species or a neutral
    particle species. No aggregation over separate species, charge states, or plasma
    populations is implied; for a molecular or compound neutral, combining constituent
    masses is part of that species definition. The ion-specific form [ion atomic mass](name:ion_atomic_mass)
    and neutral-specific form [neutral species atomic mass](name:neutral_species_atomic_mass)
    are corresponding instances of this quantity.


    Atomic masses provide the species-dependent weighting used when forming aggregate
    quantities such as [total plasma mass density](name:total_plasma_mass_density);
    they are not themselves densities, particle counts, or aggregate plasma masses.'
  unit: u
  physics_domain: transport
