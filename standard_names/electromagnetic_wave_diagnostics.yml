  - name:toroidal_angle_of_measurement_position
  - name:poloidal_angle_of_beam_tracing_beam
  arguments:
  - name: poloidal_angle
    operator: measurement_position
    operator_kind: locus
- name: radiative_temperature_at_magnetic_axis
  kind: scalar
  status: draft
  description: Radiative temperature at the magnetic axis is the blackbody-equivalent
    brightness temperature of electron cyclotron emission from the resonance layer
    closest to the magnetic axis. In optically thick thermal emission, it is a central
    electron-temperature proxy reported as an energy-equivalent temperature in electronvolts.
  documentation: 'Radiative temperature at the magnetic axis is the blackbody-equivalent
    brightness temperature assigned to the electron cyclotron emission resonance layer
    nearest the magnetic axis. It is a property of the radiation field rather than
    necessarily a thermodynamic temperature, but in optically thick thermal conditions
    it approaches the local [electron_temperature](name:electron_temperature) and
    is closely related to [temperature_at_magnetic_axis](name:temperature_at_magnetic_axis).


    In the Rayleigh-Jeans limit relevant to microwave electron cyclotron emission,
    the energy-equivalent radiation temperature is defined from spectral radiance
    by:


    $$

    T_\mathrm{rad} = \frac{c^2 I_f}{2 f^2 e}

    $$


    where $I_f$ is the spectral radiance per unit frequency and solid angle at frequency
    $f$, $c$ is the speed of light, and $e$ is the elementary charge. The value is
    expressed in electronvolts; equivalently, $e T_\mathrm{rad}=k_B T_K$, where $T_K$
    is the brightness temperature in kelvin and $k_B$ is Boltzmann''s constant.


    In practice, this quantity is obtained from calibrated electron cyclotron emission
    radiometry by mapping each observing frequency and polarization to a cyclotron
    resonance layer using the magnetic field and equilibrium, then selecting the channel
    whose layer is closest to the magnetic axis. The second-harmonic extraordinary
    mode is often optically thick in the core of tokamak plasmas and therefore gives
    the most direct central electron-temperature estimate; ordinary-mode channels
    may also be used, with greater sensitivity to optical depth and polarization purity.


    Important uncertainties come from absolute radiometric calibration, receiver bandwidth,
    resonance-position mapping, relativistic and Doppler broadening, refraction, wall
    reflections, and possible nonthermal electron emission. When the optical depth
    is not large, $T_\mathrm{rad}$ is an emissivity- and absorption-weighted brightness
    temperature rather than the local electron temperature, so it can differ substantially
    from the true central electron thermal energy.


    Typical central values are 500-3000 eV in ohmic or low-confinement tokamak plasmas
    and 2000-20000 eV in high-performance H-mode plasmas, with larger or burning-plasma
    scenarios potentially exceeding 20000 eV.'
  unit: eV
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
