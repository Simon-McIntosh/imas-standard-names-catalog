- name: current_of_plasma_filament
  kind: scalar
  status: active
  description: Electric current carried by a single discrete plasma-filament element
    in an axisymmetric filamentary representation of the distributed plasma current.
  documentation: "In the filamentary model of an axisymmetric plasma, the spatially\
    \ distributed plasma current is represented as an array of discrete annular current-carrying\
    \ elements, each called a filament. The current of each element is its individual\
    \ contribution to the net toroidal plasma current, and the ensemble of filament\
    \ currents constitutes a discrete model of the plasma current density distribution\
    \ across the poloidal cross-section.\n\nThe total plasma current $I_p$ is recovered\
    \ by summing the contributions from all filament elements:\n\n$$\nI_p = \\sum_k\
    \ I_k\n$$\n\nwhere $I_k$ is the current of the $k$-th filament element and the\
    \ sum runs over all elements in the filamentary array.\n\nFilament currents are\
    \ determined during equilibrium reconstruction or electromagnetic circuit-equation\
    \ integration, treating the plasma as a collection of discrete current sources.\
    \ Each filament element is fully characterized by its current together with its\
    \ geometric descriptors \u2014 including area_of_plasma_filament, [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),\
    \ and [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)\
    \ \u2014 which together define the local current-density contribution. The analogous\
    \ quantity for the conducting vessel structure is [toroidal_current_of_vacuum_vessel](name:toroidal_current_of_vacuum_vessel).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above $+\\hat{Z}$)."
  unit: A
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: pf_plasma/element/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_plasma.html#pf_plasma-element-current
    dd_documentation:
      leaf: Current in the plasma element
      parent_path: pf_plasma/element
      parent: Set of plasma elements
      data_type: FLT_1D
      unit: A
      coordinates:
      - pf_plasma/element/time
    enhanced_context:
      description: Electrical current carried by an individual discrete plasma current
        filament element in the pf_plasma filamentary model. Represents the local
        plasma current contribution to the axisymmetric distributed plasma current
        distribution as a function of time.
      kind: llm
- name: current_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Conventional electrical current through a poloidal-field coil winding,\
    \ with sign set by winding orientation and distinct from the winding\u2019s ampere-turn\
    \ product."
  documentation: 'This quantity is the conventional current carried by the conductor
    forming a poloidal-field coil winding. It describes the circuit current itself,
    independent of the number of turns in the winding, and is the poloidal-field-coil
    counterpart of [current of a toroidal-field coil](name:current_of_toroidal_field_coil).


    The current is defined by the rate of conventional charge flow:


    $$

    I = \frac{dQ}{dt}

    $$


    where $I$ is the winding current, $Q$ is the net transported electric charge,
    and $t$ is time. For a winding with $N$ series-connected turns, its magnetomotive
    effect is proportional to the ampere-turn product $NI$; $N$ is the dimensionless
    number of turns. This quantity is not the coil resistance or the resulting voltage
    drop, which is related to [poloidal-field-coil resistance](name:resistance_of_poloidal_field_coil).


    Sign convention: Positive when conventional current follows the positive reference
    direction assigned around the poloidal-field-coil winding.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_of_toroidal_field_coil
  - name:resistance_of_poloidal_field_coil
  sources:
  - dd_path: equilibrium/time_slice/constraints/pf_current/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-pf_current-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/pf_current
