      data_type: STRUCTURE
      unit: Hz
    enhanced_context:
      description: Operating frequency of an ion cyclotron resonance heating (ICRH)
        antenna, averaged over its modules. Determines the resonance layer location
        and the target ion species for wave absorption in the plasma.
      kind: llm
