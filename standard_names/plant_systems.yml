- name: vertical_component_of_shattered_pellet_velocity
  kind: scalar
  status: draft
  description: Vertical (Z) component of the velocity of the SPI pellet center of
    mass in the right-handed cylindrical $(R, \phi, Z)$ frame, capturing upward or
    downward motion during injection.
  documentation: 'The vertical velocity component $v_Z$ describes the motion of the
    shattered pellet injector (SPI) pellet center of mass along the $Z$-axis of the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$ is the vertical coordinate
    measured from the machine midplane. Together with the radial component, it fully
    characterizes the in-plane translational dynamics of the pellet as it travels
    from the injector exit toward the plasma. SPI pellets are typically injected at
    oblique angles relative to the midplane, so $v_Z$ is generally nonzero and encodes
    the vertical component of the injection trajectory; typical magnitudes range from
    a few m/s to $\sim$100 m/s depending on injector geometry and gas gun pressure.
    This component is obtained from pellet tracking diagnostics (e.g., optical or
    infrared fast cameras) or from pellet flight simulations constrained by injector
    geometry. It is the $Z$-projection of the full velocity vector described by [shattered_pellet_velocity](name:shattered_pellet_velocity),
    and complements [radial_component_of_shattered_pellet_velocity](name:radial_component_of_shattered_pellet_velocity)
    to form the complete poloidal-plane velocity. For the analogous quantity resolved
    at the shattering location, see [shattered_pellet_velocity_magnitude_at_shattering_position](name:shattered_pellet_velocity_magnitude_at_shattering_position).


    Sign convention: Positive when the pellet center of mass moves in the direction
    of increasing $Z$ (upward, away from the machine midplane toward the upper port).'
  unit: m.s^-1
  physics_domain: plant_systems
  links:
