- name: displacement_of_passive_structure
  kind: scalar
  status: active
  description: Displacement of a passive structure is the signed linear displacement
    of a selected point or defined surface target on a passive component relative
    to a reference configuration, projected along a defined positive direction.
  documentation: 'Displacement of a passive structure is the signed scalar component
    of the motion of a selected material point, attachment point, or defined reference
    point on a passive structural component relative to a reference configuration.
    It is the passive-structure instance of mechanical displacement, not an absolute
    position, velocity, acceleration, or strain.


    The signed projected displacement is defined by


    $$

    u(t) = \left[\mathbf{r}(t) - \mathbf{r}_\mathrm{ref}\right] \cdot \hat{\mathbf{e}}_u

    $$


    where $u(t)$ is the scalar displacement, $\mathbf{r}(t)$ is the current position
    vector of the selected point, $\mathbf{r}_\mathrm{ref}$ is the position vector
    of the same point in the reference configuration, and $\hat{\mathbf{e}}_u$ is
    the unit vector defining the positive direction of the displacement component.
    All vectors and the unit direction are expressed in the same right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame, with $\hat{z}$ vertical.


    The selected point, reference configuration, and positive direction are part of
    the semantic definition of any instance. An undeformed, surveyed, calibrated,
    initial, or previous-time configuration may serve as $\mathbf{r}_\mathrm{ref}$
    only if that choice is fixed; changing it changes the displacement, and using
    a previous-time reference defines an incremental displacement over the interval.
    A single value describes one projected local displacement; deformation or strain
    requires spatial variation of displacement or a separate deformation measure.


    Sign convention: Positive when the selected point is displaced from $\mathbf{r}_\mathrm{ref}$
    in the direction of $\hat{\mathbf{e}}_u$.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links: []
  sources:
  - dd_path: operational_instrumentation/sensor/length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/operational_instrumentation.html#operational_instrumentation-sensor-length
    dd_documentation:
      leaf: Length measured by a displacement sensor
      parent_path: operational_instrumentation/sensor
      parent: Set of sensors
      data_type: STRUCTURE
      unit: m
    enhanced_context:
      description: Displacement (length) measured by a displacement sensor for structural
        health monitoring of tokamak components. Provides time-resolved positional
        or deformation data complementing acceleration, strain, and temperature measurements
        from co-located sensors.
      kind: llm
- name: neutral_pressure
  kind: scalar
  status: active
  description: Neutral pressure is the scalar kinetic pressure of a neutral-particle
    population, defined as one third of the trace of its central second velocity moment.
    It is the general neutral-pressure quantity before any thermal, fast, or internal-state
    partition is specified.
  documentation: 'Neutral pressure is the scalar kinetic pressure of a neutral-particle
    population. It is the isotropic scalar obtained from the central second velocity
    moment of the neutral velocity distribution, independent of any decomposition
    into thermal, fast, or internal-state populations.


    For a neutral distribution function $f_n(\mathbf{x},\mathbf{v})$ that is a number
    density per velocity-space volume, the pressure tensor and associated scalar pressure
    are defined by:


    $$

    \mathbf{P}_n = m_n \int (\mathbf{v}-\mathbf{u}_n)(\mathbf{v}-\mathbf{u}_n) f_n(\mathbf{x},\mathbf{v})\,d^3v,\qquad
    p_n = \frac{1}{3}\operatorname{tr}\mathbf{P}_n

    $$


    where $m_n$ is the neutral particle mass, $\mathbf{x}$ is position, $\mathbf{v}$
    is particle velocity, $n_n=\int f_n\,d^3v$ is the neutral number density, and
    $\mathbf{u}_n=n_n^{-1}\int \mathbf{v}f_n\,d^3v$ is the mean neutral flow velocity.


    This is the parent neutral-pressure concept: it does not specify a split into
    [thermal neutral pressure](name:thermal_neutral_pressure) and [fast neutral pressure](name:fast_neutral_pressure),
    nor a selected [neutral internal state pressure](name:neutral_internal_state_pressure).
    When internal states are not explicitly resolved, their distributions are included
    in $f_n$ before the central moment is taken. [Total neutral pressure](name:total_neutral_pressure)
    denotes an explicitly aggregated pressure over named neutral populations. For
    anisotropic or gyrotropic neutral distributions, neutral pressure denotes the
    trace scalar $p_n$, not an individual tensor component.'
  unit: Pa
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:total_neutral_pressure
  - name:fast_neutral_pressure
  - name:neutral_internal_state_pressure
  sources:
  - dd_path: barometry/gauge/pressure
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/barometry.html#barometry-gauge-pressure
    dd_documentation:
      leaf: Pressure
      parent_path: barometry/gauge
      parent: Set of gauges
      data_type: STRUCTURE
      unit: Pa
    enhanced_context:
      description: Neutral gas pressure measured by a barometry gauge within the vacuum
        vessel or surrounding vacuum system. Characterizes local gas inventory and
        vacuum conditions relevant to plasma fuelling, recycling, and neutral gas
        modelling.
      kind: llm
- name: x_coordinate_of_sensor_attachment_point
  kind: scalar
  status: active
  description: Signed Cartesian x coordinate locating the point where a sensor is
    mechanically attached to a device component.
  documentation: 'This quantity gives the x-coordinate of a sensor''s mechanical attachment
    point relative to the origin of the right-handed Cartesian $(x, y, z)$ frame.


    The coordinate is defined by


    $$

    x_{\rm att} = \mathbf{r}_{\rm att} \cdot \hat{x}

    $$


    where $\mathbf{r}_{\rm att}$ is the position vector of the attachment point relative
    to the Cartesian origin and $\hat{x}$ is the unit vector along the positive x-axis.
    Together with the [y coordinate of the sensor attachment point](name:y_coordinate_of_sensor_attachment_point)
    and [z coordinate of the sensor attachment point](name:z_coordinate_of_sensor_attachment_point),
    it specifies the attachment location. A displacement sensor may have two mechanical
    attachment points; other sensor types have one.


    Sign convention: Positive when the attachment point lies in the positive x direction
    from the Cartesian origin.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:y_coordinate_of_sensor_attachment_point
  - name:z_coordinate_of_sensor_attachment_point
  sources:
  - dd_path: operational_instrumentation/sensor/attachement_points/x
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/operational_instrumentation.html#operational_instrumentation-sensor-attachement_points-x
    dd_documentation:
      leaf: Component along X axis
