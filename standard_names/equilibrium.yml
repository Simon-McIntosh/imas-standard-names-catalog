- name: thickness_of_plasma_filament
  kind: scalar
  status: draft
  description: Full thickness of a rectangular plasma filament cross-section, measured
    along the in-plane direction normal to the filament's central segment. It is the
    transverse side length of the rectangle, complementing the tangential length measured
    along the segment.
  documentation: 'Thickness of a plasma filament is the full transverse extent of
    a rectangular (thick-line) filament cross-section, measured in the local plane
    of the element along the direction normal to the filament''s central segment.
    The central segment lies in a poloidal plane of the right-handed cylindrical $(R,
    \phi, Z)$ frame, and the local tangential-normal basis is defined within that
    plane: the tangential direction follows the central segment while the normal direction
    is the in-plane perpendicular. It is a full side length, not a half-width.


    For a rectangular filament cross-section, the cross-sectional area is the product
    of the two full local side lengths:


    $$

    A_\mathrm{fil} = L_\mathrm{tan}\, t

    $$


    where $A_\mathrm{fil}$ is the filament cross-sectional area in $\mathrm{m}^2$,
    $L_\mathrm{tan}$ is the [tangential length](name:thickness_of_plasma_filament)
    in $\mathrm{m}$, and $t$ is the thickness in $\mathrm{m}$. When the local tangential
    and normal directions align with the cylindrical axes, the thickness coincides
    with either the width (radial $R$-direction extent) or the [height](name:height_of_plasma_filament)
    (vertical $Z$-direction extent) of the same rectangular cross-section.


    In equilibrium filament descriptions, the thickness is set by the chosen local
    geometric representation of a discrete current-carrying plasma element. For a
    thick-line element it is specified directly as the rectangle side perpendicular
    to the central segment.


    The value is a non-negative geometric length governed by the spatial resolution
    and local size of the filament representation. No universal device-independent
    numerical range applies; it should be interpreted relative to the associated tangential
    length and to neighboring filament spacing.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:height_of_plasma_filament
- name: toroidal_angle_of_control_surface
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 coordinate of points on the control surface\
    \ used for non-axisymmetric magnetic field analysis, in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: "The toroidal angle $\\phi$ identifies the azimuthal position of\
    \ sample points on the control surface within the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is the major radius from the machine symmetry axis\
    \ and $Z$ is the vertical height. The control surface is a geometric reference\
    \ surface employed in studies of non-axisymmetric magnetic field distributions\
    \ \u2014 for example, to evaluate boundary conditions or to perform surface integrals\
    \ of perturbed field components in three-dimensional equilibrium analysis. Each\
    \ point on the surface is fully specified by its $(R, \\phi, Z)$ triplet; this\
    \ quantity carries the $\\phi$ component of that triplet, related to Cartesian\
    \ coordinates by $x = R\\cos\\phi$ and $y = R\\sin\\phi$.\n\nValues span $[0,\
    \ 2\\pi)$ rad for a full toroidal circuit, though a particular control surface\
    \ may cover only a restricted toroidal arc. The analogous coordinate for diagnostic\
    \ settings is [toroidal_angle_of_measurement_position](name:toroidal_angle_of_measurement_position),\
    \ and the same coordinate applied to EC launcher geometry appears as [toroidal_angle_of_launching_position](name:toroidal_angle_of_launching_position).\n\
    \nSign convention: Positive when $\\phi$ increases in the counter-clockwise direction\
    \ viewed from above along $+\\hat{Z}$."
  unit: rad
  physics_domain: equilibrium
  links:
  - name:toroidal_angle_of_measurement_position
  - name:toroidal_angle_of_launching_position
- name: toroidal_angle_of_measurement_position
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of a generic measurement position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, locating sensors, beams, and diagnostic elements\
    \ at their installed angular positions around the torus."
  documentation: "The toroidal angle $\\phi$ of a measurement position is the angular\
    \ coordinate in the right-handed cylindrical $(R, \\phi, Z)$ frame that locates\
    \ a diagnostic sensor, beam origin, antenna element, or hardware component at\
    \ its installed angular position around the device symmetry axis, where $R$ is\
    \ the major radius from the symmetry axis and $Z$ is the vertical height. It relates\
    \ to horizontal Cartesian coordinates by $\\phi = \\arctan(y/x)$, with $\\phi\
    \ = 0$ fixed by the facility reference direction.\n\nThis coordinate applies across\
    \ a wide range of measurement and hardware contexts \u2014 including neutron detector\
    \ apertures, Thomson scattering laser entry points, NBI beamlet group positions,\
    \ reflectometer channels, charge-exchange spectrometer apertures, and antenna\
    \ modules \u2014 wherever the full angular location of a generic measurement point\
    \ must be specified in three-dimensional geometry. It is the generic-position\
    \ variant of the $\\phi$-coordinate family; more specific counterparts include\
    \ toroidal_angle_of_along_line_of_sight for diagnostic line-of-sight defining\
    \ points, [toroidal_angle_of_antenna_strap](name:toroidal_angle_of_antenna_strap)\
    \ for ICRH antenna strap positions, and [toroidal_angle_of_coil_conductor_element](name:toroidal_angle_of_coil_conductor_element)\
    \ for coil conductor element geometry.\n\nValues span 0 to $2\\pi$ rad for positions\
    \ distributed around the full torus; diagnostics installed at a single port occupy\
    \ a narrow angular range at their installation angle, while symmetric systems\
    \ may provide several evenly spaced values of $\\phi$.\n\nSign convention: Positive\
    \ when $\\phi$ increases in the counter-clockwise direction when viewed from above\
    \ along the $+\\hat{Z}$ axis."
  unit: rad
  physics_domain: equilibrium
  links:
  - name:toroidal_angle_of_antenna_strap
  - name:toroidal_angle_of_coil_conductor_element
- name: toroidal_current_density
  kind: scalar
  status: draft
  description: Toroidal projection of the total electric current density onto the
    geometric toroidal direction, aggregating all inductive, bootstrap, wave-driven,
    and inertial current contributions at every point in the plasma.
  documentation: "The toroidal current density $j_\\phi = \\mathbf{J} \\cdot \\hat{\\\
    phi}$ is the $\\hat{\\phi}$-projection of the total [current_density](name:current_density)\
    \ vector in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the\
    \ major radius and $Z$ is the vertical height. It represents the net signed rate\
    \ of charge transport per unit cross-sectional area in the toroidal direction,\
    \ encompassing every contributing mechanism \u2014 ohmic induction, bootstrap,\
    \ wave-driven, diamagnetic, and inertial \u2014 without attribution to any single\
    \ process.\n\nIn axisymmetric MHD equilibrium, $j_\\phi$ is related to the poloidal\
    \ magnetic field through Ampere's law:\n\n$$\n\\mu_0 j_\\phi = \\frac{\\partial\
    \ B_R}{\\partial Z} - \\frac{\\partial B_Z}{\\partial R}\n$$\n\nwhere $B_R$ and\
    \ $B_Z$ are the radial and vertical components of the magnetic field in the $(R,\
    \ \\phi, Z)$ frame and $\\mu_0 = 4\\pi \\times 10^{-7}$ H m$^{-1}$ is the permeability\
    \ of free space.\n\nThe total toroidal current density profile is inferred from\
    \ equilibrium reconstruction by combining external magnetics measurements with\
    \ internal diagnostics such as motional Stark effect polarimetry. It can also\
    \ be computed directly from fluid or kinetic simulations. Mechanism-specific contributions\
    \ such as [toroidal_current_density_due_to_diamagnetic_drift](name:toroidal_current_density_due_to_diamagnetic_drift)\
    \ and [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction)\
    \ sum to the total quantity defined here.\n\nPeak core values in tokamak H-mode\
    \ plasmas range from $10^5$ to $10^7$ A m$^{-2}$, peaking on the magnetic axis\
    \ and decreasing toward the separatrix; edge and wall regions carry substantially\
    \ lower values.\n\nSign convention: Positive when the current flows in the direction\
    \ of increasing toroidal angle $\\phi$ (counter-clockwise when viewed from above\
    \ the $+\\hat{Z}$ direction)."
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:toroidal_current_density_due_to_diamagnetic_drift
  - name:toroidal_current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_flux_radius
  kind: scalar
  status: draft
  description: Radial flux-surface coordinate equal to the square root of the enclosed
    toroidal magnetic flux divided by pi times the reference vacuum toroidal field,
    approximating the effective minor radius of a flux surface.
  documentation: "The toroidal flux radius $\\rho_{tor}$ is a dimensional radial coordinate\
    \ labeling nested magnetic flux surfaces in a tokamak equilibrium. It is constructed\
    \ from the toroidal magnetic flux enclosed by a given surface rather than from\
    \ a purely geometric distance, making it a magnetic coordinate that faithfully\
    \ reflects the flux-surface topology even in strongly shaped or diverted plasmas.\
    \ It increases monotonically from zero at the magnetic axis to the effective plasma\
    \ minor radius at the last closed flux surface.\n\nThe defining relation is:\n\
    \n$$\n\\rho_{tor} = \\sqrt{\\frac{\\Phi_{tor}}{\\pi B_0}}\n$$\n\nwhere $\\Phi_{tor}$\
    \ is the toroidal magnetic flux enclosed by the flux surface and $B_0$ is the\
    \ reference vacuum toroidal field evaluated at the magnetic axis. In the limit\
    \ of circular cross-section plasmas, $\\rho_{tor}$ converges to the geometric\
    \ minor radius $r$.\n\n$\\rho_{tor}$ is computed from equilibrium reconstruction\
    \ by integrating the toroidal field component over the poloidal cross-section\
    \ of each nested flux surface. It serves as the standard radial grid axis for\
    \ one-dimensional equilibrium profiles, transport analysis, and wave propagation\
    \ calculations across the plasma volume. The dimensionless counterpart [normalized_toroidal_flux_coordinate](name:normalized_toroidal_flux_coordinate)\
    \ is obtained by dividing $\\rho_{tor}$ by its value at the last closed flux surface.\
    \ The underlying enclosed flux is [toroidal_magnetic_flux](name:toroidal_magnetic_flux).\n\
    \nFor medium-sized tokamaks, $\\rho_{tor}$ spans from 0 m at the magnetic axis\
    \ to approximately 1\u20132 m at the plasma boundary.\n\nSign convention: Positive\
    \ when the enclosed toroidal magnetic flux $\\Phi_{tor}$ and the reference vacuum\
    \ toroidal field $B_0$ share the same sign, ensuring the square-root argument\
    \ is non-negative and $\\rho_{tor} \\geq 0$ throughout the confined plasma."
  unit: m
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:toroidal_magnetic_flux
- name: toroidal_flux_radius_at_plasma_boundary
  kind: scalar
  status: draft
  description: Boundary toroidal flux radius rho_tor = sqrt(Phi_tor/(pi B0)) is the
    non-negative square-root radius associated with the toroidal magnetic flux enclosed
    by the plasma boundary. It provides an effective minor-radius scale for the outermost
    closed magnetic flux surface.
  documentation: 'Toroidal flux radius at the plasma boundary is the radial flux label
    obtained from the toroidal magnetic flux enclosed by the selected boundary flux
    surface. It gives a non-negative effective minor-radius scale for the outermost
    closed magnetic flux surface or separatrix, rather than a purely geometric distance.


    The boundary value is defined by normalizing the enclosed toroidal magnetic flux
    to the reference toroidal magnetic field:


    $$

    \rho_{\mathrm{tor},b} = \sqrt{\frac{\Phi_{\mathrm{tor},b}}{\pi B_0}}

    $$


    where $\Phi_{\mathrm{tor},b}$ is the [toroidal magnetic flux at the plasma boundary](name:toroidal_magnetic_flux_at_plasma_boundary),
    $B_0$ is the reference toroidal magnetic field used for the flux-radius normalization,
    and the flux and field are taken consistently so that the ratio is non-negative.


    This quantity is computed from an equilibrium reconstruction by evaluating the
    toroidal flux enclosed by the boundary flux surface and applying the flux-radius
    normalization. It sets the outer radial scale for coordinates such as the [normalized
    toroidal flux coordinate](name:normalized_toroidal_flux_coordinate). For a large-aspect-ratio
    circular plasma with nearly uniform toroidal field it is close to the geometric
    minor radius, while finite aspect ratio, shaping, and toroidal-field variation
    make it an effective flux radius rather than an exact geometric radius.


    Typical values are about 0.2-1 m in small tokamaks, 0.5-2 m in medium and large
    tokamaks, and can exceed 2 m in reactor-scale equilibria.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  arguments:
  - name: toroidal_flux_radius
    operator: plasma_boundary
    operator_kind: locus
- name: toroidal_flux_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Toroidal flux radius evaluated at the magnetic axis.
  documentation: 'Toroidal flux radius at the magnetic axis is the value of the flux
    coordinate $\rho_\mathrm{tor}$ on the central magnetic flux surface. The coordinate
    is a non-negative, minor-radius-like label constructed from the toroidal magnetic
    flux interval between the magnetic axis and a flux surface; at the magnetic axis
    that interval is zero.


    For a flux surface, the toroidal flux radius is defined by


    $$

    \rho_\mathrm{tor} = \sqrt{\frac{|\Delta \Phi_\mathrm{tor}|}{\pi |B_0|}}

    $$


    where $\Delta \Phi_\mathrm{tor}$ is the toroidal magnetic flux difference between
    the magnetic axis and the flux surface, and $B_0$ is the reference toroidal magnetic
    field magnitude used for the normalization. The absolute-value form states the
    radius convention explicitly: equivalently, a signed flux difference and signed
    reference field may be used only when their ratio is non-negative.


    In equilibrium reconstruction, this quantity is obtained by identifying the magnetic
    axis and evaluating the toroidal-flux-radius coordinate on that flux surface.
    Numerically it should be exactly zero; small nonzero values indicate interpolation
    tolerance, finite grid resolution, or an inconsistent choice of flux origin.


    Typical value: 0 m for all equilibria. The allowed range of $\rho_\mathrm{tor}$
    is non-negative, $\rho_\mathrm{tor} \ge 0$, and the magnetic-axis value is the
    inner endpoint of that range.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:toroidal_flux_radius
  - name:toroidal_flux_radius_at_pedestal_top
  arguments:
  - name: toroidal_flux_radius
    operator: magnetic_axis
    operator_kind: locus
- name: toroidal_flux_surface_averaged_current_density_at_constraint_position
  kind: scalar
  status: draft
  description: Flux-surface average of the toroidal component of plasma current density
    evaluated on the magnetic surface selected by an equilibrium reconstruction constraint
    point. The selected surface is identified by the constraint point's normalized
    toroidal flux radius, making this the constrained-location counterpart of the
    unconstrained radial distribution of flux-surface-averaged toroidal current density.
  documentation: 'Toroidal flux-surface-averaged current density at a constraint position
    is the Jacobian-weighted flux-surface average of the toroidal component of plasma
    current density, evaluated on the single magnetic surface picked out by an equilibrium
    reconstruction constraint point. That surface is identified by its normalized
    toroidal flux radius $\rho_\mathrm{tor,norm}$, the radial constraint label, so
    this quantity is a single-point evaluation of the corresponding radial equilibrium
    quantity rather than its full radial dependence.


    For an axisymmetric equilibrium in flux coordinates $(\rho_\mathrm{tor,norm},
    \theta, \phi)$, the defining average on the constraint surface $\rho_c$ is


    $$

    \left\langle j_\phi \right\rangle(\rho_c) = \frac{\displaystyle\oint j_\phi(\rho_c,\theta)\,J(\rho_c,\theta)\,d\theta}{\displaystyle\oint
    J(\rho_c,\theta)\,d\theta}

    $$


    where $j_\phi$ is the toroidal component of current density in A.m^-2 in the right-handed
    cylindrical $(R,\phi,Z)$ frame, $\theta$ is the geometric poloidal angle in radians,
    $J$ is the coordinate Jacobian of the flux coordinates, and the closed integrals
    run over one full poloidal circuit ($\theta$ from $0$ to $2\pi$) at fixed $\rho_c$.
    The denominator $\oint J\,d\theta$ supplies the normalization, so the result is
    the Jacobian-weighted equilibrium flux-surface average and not an unweighted geometric
    surface-area average; the $2\pi$ poloidal circuit cancels between numerator and
    denominator.


    In equilibrium reconstruction, this value is obtained by evaluating the reconstructed
    current-density distribution on the flux surface identified by the constraint
    label and applying the same Jacobian-weighted average used for the radial equilibrium
    quantity. The constrained value is compared against an inferred or prescribed
    toroidal-current-density constraint; inferred values rest on magnetic measurements
    together with diagnostics sensitive to the internal current distribution. The
    unconstrained radial dependence is described by [toroidal_flux_surface_averaged_current_density](name:toroidal_current_density),
    and the field-aligned counterpart at the same point is [parallel_flux_surface_averaged_current_density_at_constraint_position](name:parallel_flux_surface_averaged_current_density_at_constraint_position).


    Typical signed magnitudes in tokamak equilibria reach the order of $10^6$ A.m^-2
    in the high-current core and fall toward $10^4$-$10^5$ A.m^-2 near the edge, with
    hollow or locally reversed values possible in advanced or off-axis current-drive
    scenarios.


    Sign convention: Positive when the toroidal current density points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, counter-clockwise when viewed from above $+\hat{Z}$.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:toroidal_current_density
  - name:parallel_flux_surface_averaged_current_density_at_constraint_position
- name: toroidal_magnetic_field
  kind: scalar
  status: draft
  description: "Toroidal component of the total magnetic field vector along the toroidal\
    \ basis direction in the right-handed cylindrical (R, \u03C6, Z) frame. Positive\
    \ when pointing in the direction of increasing toroidal angle \u03C6 (counter\u2011\
    clockwise when viewed from above). Includes contributions from toroidal field\
    \ coils and plasma currents in the equilibrium."
  documentation: "The toroidal magnetic field is the component of the total [magnetic_field](name:magnetic_field)\
    \ along the toroidal basis direction $\\hat{\\phi}$ in the right\u2011handed cylindrical\
    \ $(R, \\phi, Z)$ frame. It is the dominant magnetic field component in tokamak\
    \ geometry and is generated by the external toroidal\u2011field coils as well\
    \ as by plasma currents (diamagnetic and paramagnetic responses) that modify the\
    \ vacuum field in equilibrium.\n\nIn an axisymmetric magnetohydrodynamic equilibrium,\
    \ the toroidal field is related to the poloidal\u2011current function $F(\\psi)$\
    \ by the Grad\u2013Shafranov equation:\n\n$$\nB_\\phi(R,Z) = \\frac{F(\\psi(R,Z))}{R}\n\
    $$\n\nwhere $B_\\phi$ is the toroidal magnetic field, $R$ is the major radius,\
    \ $\\psi$ is the poloidal magnetic flux labeling the flux surface, and $F = R\
    \ B_\\phi$ has units of T\xB7m. On a given flux surface $F$ is constant; the $1/R$\
    \ factor gives the characteristic variation across the plasma cross section.\n\
    \nThe total toroidal field is obtained from equilibrium reconstruction that solves\
    \ the Grad\u2013Shafranov equation using magnetic probe measurements, flux loops,\
    \ and information on the toroidal\u2011field coil currents. The vacuum contribution\
    \ alone is described by [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field),\
    \ while the value on the magnetic axis is given by [toroidal_magnetic_field_at_magnetic_axis](name:toroidal_magnetic_field_at_magnetic_axis).\n\
    \nTypical magnitudes range from about 0.1\u202FT in small or low\u2011field experiments\
    \ to several tesla in conventional tokamaks, with higher values in high\u2011\
    field devices such as spherical tokamaks.\n\nSign convention: Positive when $B_\\\
    phi$ points in the direction of increasing toroidal angle $\\phi$ in the right\u2011\
    handed cylindrical $(R, \\phi, Z)$ frame."
  unit: T
  physics_domain: equilibrium
  links:
  - name:poloidal_flux_surface_averaged_electron_beta_at_pedestal_top
  - name:toroidal_magnetic_field_at_magnetic_axis
  - name:toroidal_flux_radius_at_pedestal_top
  arguments:
  - name: magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_magnetic_field_at_magnetic_axis
  kind: scalar
  status: draft
  description: "Toroidal component of the total magnetic field at the magnetic axis,\
    \ evaluated as the projection onto the positive toroidal-angle direction in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame. It includes both vacuum toroidal-field-coil\
    \ and equilibrium plasma-current contributions."
  documentation: 'Toroidal magnetic field at the magnetic axis is the signed toroidal
    component of the total magnetic field evaluated at the location where the poloidal
    magnetic flux has its magnetic-axis value. It is the on-axis value of [toroidal_magnetic_field](name:toroidal_magnetic_field),
    not the vacuum reference field represented by [toroidal_vacuum_magnetic_field](name:toroidal_vacuum_magnetic_field).


    In an axisymmetric equilibrium, the toroidal component is commonly expressed through
    the poloidal-current function $F(\psi)=R B_\phi$:


    $$

    B_{\phi,\mathrm{axis}} = \mathbf{B}(R_\mathrm{axis}, Z_\mathrm{axis}) \cdot \hat{\phi}
    = \frac{F(\psi_0)}{R_\mathrm{axis}}

    $$


    where $\mathbf{B}$ is the total magnetic field in T, $\hat{\phi}$ is the unit
    vector in the direction of increasing toroidal angle in the right-handed cylindrical
    $(R,\phi,Z)$ frame, $R_\mathrm{axis}$ is the major radius of the magnetic axis
    in m, $Z_\mathrm{axis}$ is its vertical height in m, $\psi_0$ is the poloidal
    magnetic flux at the magnetic axis in Wb, and $F(\psi)$ has units T m.


    The value is obtained from an equilibrium reconstruction by locating the magnetic
    axis and evaluating the reconstructed total field there, either by projecting
    $\mathbf{B}$ onto $\hat{\phi}$ or by using $F(\psi_0)/R_\mathrm{axis}$. Because
    the toroidal field usually dominates the total magnetic-field magnitude near the
    axis, its absolute value is often used as an approximate reference for cyclotron
    frequencies and Larmor radii; exact gyrofrequency estimates use the magnitude
    of the full magnetic field rather than this signed component alone.


    Representative absolute values in tokamak equilibria are of order 0.1-10 T, with
    low-field or spherical tokamak operation often below 1 T, many conventional devices
    around 1-6 T, and high-field operation reaching larger values.


    Sign convention: Positive when the on-axis toroidal magnetic-field component points
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:toroidal_magnetic_field
- name: toroidal_magnetic_flux
  kind: scalar
  status: draft
  description: Magnetic flux through the poloidal cross-section enclosed by a given
    flux surface, increasing monotonically from zero at the magnetic axis and used
    as a natural radial flux-surface label in equilibrium analysis.
  documentation: "The toroidal magnetic flux $\\Phi_{tor}$ is the total flux of the\
    \ toroidal magnetic field threading the poloidal cross-section enclosed by a closed\
    \ magnetic flux surface. In an axisymmetric equilibrium, $\\Phi_{tor}$ increases\
    \ monotonically from zero at the magnetic axis to its maximum at the plasma boundary,\
    \ making it one of the two fundamental flux-surface labels alongside the poloidal\
    \ magnetic flux $\\psi$.\n\nThe defining integral over the poloidal cross-sectional\
    \ area $S_{\\rm pol}$ bounded by the flux surface is:\n\n$$\n\\Phi_{tor} = \\\
    int_{S_{\\rm pol}} B_\\phi \\, dA\n$$\n\nwhere $B_\\phi$ is the toroidal magnetic\
    \ field component in T and $dA$ is the area element of the poloidal half-plane\
    \ in m\xB2. The safety factor relates the two canonical flux coordinates through\
    \ $q = d\\Phi_{tor}/d\\psi$, linking the toroidal flux to the flux-surface geometry\
    \ characterized by [flux_surface_area](name:surface_area_of_flux_surface).\n\n\
    In equilibrium reconstruction, $\\Phi_{tor}$ profiles are computed from the Grad\u2013\
    Shafranov solution and tabulated as a function of normalized radial coordinates\
    \ across nested flux surfaces. Typical boundary values span a few to tens of Wb\
    \ in current tokamaks, with larger values for higher-field machines. The [toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface](name:toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface)\
    \ isolates the portion of this flux arising from plasma diamagnetism.\n\nSign\
    \ convention: Positive when $B_\\phi$ points in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  arguments:
  - name: magnetic_flux
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Total toroidal magnetic flux through the poloidal cross-section enclosed
    by the plasma boundary, including externally produced toroidal field and the contribution
    associated with plasma poloidal currents.
  documentation: 'Toroidal magnetic flux at the plasma boundary is the net flux of
    toroidal magnetic field through the poloidal cross-section enclosed by the last-closed
    flux surface. It is the boundary value used to normalize toroidal-flux radial
    coordinates and is complementary to [poloidal_magnetic_flux_at_plasma_boundary](name:poloidal_magnetic_flux_at_plasma_boundary),
    which refers to flux through a horizontal disk rather than through a poloidal
    cross-section.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius,
    $\phi$ the toroidal angle, and $Z$ the vertical height, the boundary toroidal
    flux is defined by


    $$

    \Phi_{\mathrm{tor},b} = \int_{A_b} B_\phi(R,Z)\, dR\, dZ = \int_{A_b} \frac{F(\psi(R,Z))}{R}\,
    dR\, dZ

    $$


    where $\Phi_{\mathrm{tor},b}$ is the toroidal magnetic flux in Wb, $B_\phi$ is
    the toroidal magnetic-field component in T, $F=R B_\phi$ is the poloidal-current
    function in T m, $\psi$ is the equilibrium poloidal magnetic-flux label, $R$ and
    $Z$ are in m, and $A_b$ is the boundary-enclosed poloidal area in m^2 at fixed
    toroidal angle $\phi$.


    The value is computed from an axisymmetric equilibrium by integrating the reconstructed
    toroidal magnetic field over the region inside the plasma boundary. The reconstructed
    field generally contains the externally imposed vacuum toroidal-field contribution
    and the plasma-current contribution represented through $F(\psi)$; the quantity
    is therefore an integral flux associated with the boundary, not a local boundary
    condition.


    Typical absolute magnitudes scale approximately as $\langle B_\phi\rangle A_b$:
    compact or medium tokamaks are often in the 0.1-10 Wb range, while large high-field
    plasmas can be 10-100 Wb or more depending on toroidal field strength and boundary
    area.


    Sign convention: Positive when the net toroidal magnetic field threading the plasma-boundary
    cross-section points in the direction of increasing toroidal angle $\phi$.'
  unit: Wb
  physics_domain: equilibrium
  links: []
- name: toroidal_non_axisymmetric_magnetic_field
  kind: scalar
  status: draft
  description: "Toroidal component of the non-axisymmetric vacuum magnetic field,\
    \ defined as its projection along the direction of increasing toroidal angle in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal non-axisymmetric magnetic field is the toroidal component
    of the vacuum magnetic field that varies with toroidal angle and is not part of
    the axisymmetric equilibrium field. It is a local component of the perturbation
    field in the right-handed cylindrical $(R, \phi, Z)$ frame, not a projection onto
    a material or control-surface normal.


    In the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$ satisfying $\hat{R} \times \hat{\phi} = \hat{Z}$, the non-axisymmetric
    magnetic field is decomposed as:


    $$

    \mathbf{B}_{\mathrm{NA}}(R, \phi, Z) = B_R(R, \phi, Z)\,\hat{R} + B_\phi(R, \phi,
    Z)\,\hat{\phi} + B_Z(R, \phi, Z)\,\hat{Z}

    $$


    where $B_\phi$ is the toroidal component described here, $\mathbf{B}_{\mathrm{NA}}$,
    $B_R$, $B_\phi$, and $B_Z$ are measured in T, $R$ is major radius measured from
    the toroidal symmetry axis in m, $\phi$ is toroidal angle in rad increasing counterclockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height in m.


    The quantity is computed from vacuum magnetic-field models for non-axisymmetric
    perturbation coils, error-field sources, and passive conducting structures, or
    inferred by combining magnetic measurements with a field model and removing the
    toroidally averaged axisymmetric contribution. On a control surface, $B_\phi$
    is still the tangent toroidal component; the surface-normal non-axisymmetric field
    is the separate projection $\mathbf{B}_{\mathrm{NA}} \cdot \hat{n}$ and generally
    differs from $B_\phi$.


    Representative magnitudes are device- and location-dependent because the vacuum
    perturbation depends on coil currents, source geometry, and distance from the
    conductors. In tokamak perturbation studies, $|B_\phi|$ is commonly in the range
    $10^{-6}-10^{-2}$ T and is often quoted as $|B_\phi|/B_0$, where $B_0$ is the
    magnitude of the reference axisymmetric toroidal magnetic field in T; perturbative
    cases usually have $|B_\phi|/B_0 \ll 1$.


    Sign convention: Positive when the non-axisymmetric magnetic-field component points
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_non_axisymmetric_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_plasma_current
  kind: scalar
  status: draft
  description: Net toroidal electric current carried by the plasma, equal to the integral
    of the toroidal current density over the poloidal plasma cross-section.
  documentation: 'The toroidal plasma current $I_p$ is the net electric current flowing
    in the toroidal $\hat{\phi}$ direction, integrated over the full poloidal cross-section
    of the plasma column. It is a primary global parameter governing poloidal magnetic
    field generation, MHD equilibrium, plasma confinement, and stability thresholds
    including the Kruskal-Shafranov $q = 1$ condition.


    The quantity is defined as:


    $$

    I_p = \iint_{\mathcal{S}} j_\phi \, dA

    $$


    where $j_\phi$ is the toroidal component of the current density, $dA$ is the area
    element, and $\mathcal{S}$ is the poloidal cross-section of the plasma.


    $I_p$ is measured by Rogowski coils encircling the torus, or inferred from flux-loop
    and magnetic-pickup-coil arrays as a primary constraint in equilibrium reconstruction.
    The closely related [toroidal_total_plasma_current](name:toroidal_plasma_current)
    explicitly labels this as the total aggregated current. It should be distinguished
    from [current_of_toroidal_field_coil](name:current_of_toroidal_field_coil), which
    drives the external vacuum toroidal field, and from [current_of_plasma_filament](name:current_of_plasma_filament),
    which represents current in discrete plasma filament elements.


    Typical values range from a few hundred kA in small research tokamaks to approximately
    15 MA in ITER-class reactors, scaling roughly with the product of toroidal field
    strength and minor radius.


    Sign convention: Positive when the plasma current flows in the direction of increasing
    toroidal angle $\phi$.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_of_plasma_filament
  arguments:
  - name: plasma_current
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
