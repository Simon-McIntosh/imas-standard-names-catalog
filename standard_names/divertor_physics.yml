- name: maximum_of_energy_flux_at_divertor_target
  kind: scalar
  status: active
  description: Maximum local energy deposition rate per unit area on a divertor target,
    combining all incident particle and radiation channels and selecting the highest
    value over the target surface.
  documentation: 'Peak energy flux at a divertor target is the largest local rate
    of energy deposition per unit target-surface area on one divertor-target surface.
    It represents the maximum local heat load rather than the total power deposited
    on the target.


    The peak is defined from the local [energy flux at the divertor target](name:energy_flux_at_divertor_target)
    $q_E(\mathbf{x})$ as


    $$

    q_{E,\max} = \max_{\mathbf{x}\in\Gamma_{\rm target}} q_E(\mathbf{x})

    $$


    where $q_{E,\max}$ is the peak energy flux, $\mathbf{x}$ is a position on the
    target surface, $\Gamma_{\rm target}$ is the set of positions on that target surface,
    and $q_E(\mathbf{x})$ is the local total energy flux at that position.


    The quantity applies to one divertor target surface and combines electron and
    ion conductive heat transport, charged-particle convective enthalpy, neutral-particle
    bombardment, and locally absorbed radiation. These contributions are summed into
    the local total energy flux before the maximum is taken; no individual species
    or transport channel is selected.


    It is the maximum transformation of [energy flux at the divertor target](name:energy_flux_at_divertor_target).
    Unlike [power at a divertor target](name:power_at_divertor_target), it is not
    an integral over the target surface, and unlike [flux at a divertor target](name:flux_at_divertor_target),
    it reports only the largest local value rather than the value at an arbitrary
    target position.'
  unit: W.m^-2
  physics_domain: divertor_physics
