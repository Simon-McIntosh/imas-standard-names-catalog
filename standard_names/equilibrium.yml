- name: vertical_coordinate_of_measurement_position
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of a measurement position in the right-handed
    cylindrical (R, phi, Z) frame, measuring the height of the point above or below
    the tokamak equatorial plane.
  documentation: "The vertical coordinate $Z$ specifies the position of a measurement\
    \ point along the axis parallel to the toroidal symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius from the symmetry\
    \ axis and $\\phi$ is the toroidal angle increasing counter-clockwise when viewed\
    \ from above $+\\hat{Z}$. The reference $Z = 0$ corresponds to the geometric equatorial\
    \ plane of the device.\n\nThis coordinate serves as a general-purpose vertical\
    \ locator applicable to any measurement point in the device, including magnetic\
    \ diagnostic positions, beam injection and wave beam-tracing reference points,\
    \ probe plunge positions, Thomson scattering channel centers, and points at which\
    \ equilibrium constraints are imposed. It is the vertical counterpart to the major-radius\
    \ coordinate $R$ for the same position.\n\nTypical magnitudes for midplane diagnostic\
    \ components lie within $|Z| < 1$ m, while divertor-region or antenna structures\
    \ near the X-point may reach $|Z| \\sim 2$\u2013$4$ m in large tokamaks. The same\
    \ convention governs related vertical-coordinate quantities such as [vertical_coordinate_of_geometric_axis](name:vertical_coordinate_of_geometric_axis),\
    \ [vertical_coordinate_of_current_center](name:vertical_coordinate_of_current_center),\
    \ and [vertical_coordinate_of_constraint_position](name:vertical_coordinate_of_constraint_position).\n\
    \nSign convention: Positive when the measurement position lies above the equatorial\
    \ plane in the $+Z$ direction."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_geometric_axis
  - name:vertical_coordinate_of_current_center
  - name:vertical_coordinate_of_constraint_position
