- name: toroidal_magnetization_of_ferritic_element
  kind: scalar
  status: draft
  description: Toroidal projection of the ferromagnetic magnetization of a ferritic
    structural element onto the direction of increasing toroidal angle.
  documentation: "Ferritic structural elements in a tokamak \u2014 such as ferritic\
    \ steel inserts, stiffening rings, and ferromagnetic vacuum vessel components\
    \ \u2014 develop a magnetization vector $\\mathbf{M}$ in response to the ambient\
    \ magnetic field and their magnetic history. The toroidal component $M_\\phi =\
    \ \\mathbf{M} \\cdot \\hat{\\phi}$ captures the projection of this magnetization\
    \ onto the toroidal unit vector $\\hat{\\phi}$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $\\hat{\\phi}$ points in the direction of increasing\
    \ toroidal angle $\\phi$.\n\nThe magnitude and sign of $M_\\phi$ depend on the\
    \ relative permeability of the ferritic material, the local ambient toroidal field\
    \ evaluated at the element centroid (see [toroidal_magnetic_field_at_ferritic_element_centroid](name:toroidal_magnetic_field_at_ferritic_element_centroid)),\
    \ and the prior magnetization state of the component. Together with the [radial_magnetization_of_ferritic_element](name:radial_magnetization_of_ferritic_element)\
    \ and [vertical_magnetization_of_ferritic_element](name:vertical_magnetization_of_ferritic_element)\
    \ components, the toroidal magnetization fully characterizes the magnetic dipole\
    \ source of each element used to compute stray-field perturbations to the equilibrium.\n\
    \nThese three magnetization components are evaluated as part of electromagnetic\
    \ forward models or equilibrium reconstruction workflows that account for non-axisymmetric\
    \ field errors introduced by ferromagnetic in-vessel components. Accurate treatment\
    \ of ferritic magnetization is essential for predicting field perturbations that\
    \ affect plasma confinement and stability.\n\nSign convention: Positive when $M_\\\
    phi$ points in the direction of increasing toroidal angle $\\phi$."
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_magnetic_field_at_ferritic_element_centroid
  - name:radial_magnetization_of_ferritic_element
  - name:vertical_magnetization_of_ferritic_element
