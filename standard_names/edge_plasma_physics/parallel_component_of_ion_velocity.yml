name: parallel_component_of_ion_velocity
description: Projection of the ion fluid velocity onto the local magnetic field direction
  $\hat{b}$, i.e. $v_{\parallel,i} = \mathbf{v}_i \cdot \hat{b}$.
documentation: "The parallel ion velocity $v_{\\parallel,i}$ (in $\\mathrm{m\\,s^{-1}}$)\
  \ represents the component of the ion fluid flow along the magnetic field line,\
  \ defined by $v_{\\parallel,i} = \\mathbf{v}_i \\cdot \\mathbf{B}/|\\mathbf{B}|$.\
  \ This quantity governs parallel momentum transport and is central to the parallel\
  \ force balance $m_i n_i \\partial_t v_{\\parallel,i} = -\\nabla_{\\parallel} p_i\
  \ + Z_i e n_i E_{\\parallel} - R_{\\parallel}$, where $p_i$ is the ion pressure,\
  \ $E_{\\parallel}$ is the parallel electric field, and $R_{\\parallel}$ is the friction\
  \ force. In the scrape-off layer and divertor, parallel ion flows typically reach\
  \ Mach numbers of order unity ($v_{\\parallel,i} \\sim c_s \\approx 10^4$\u2013\
  $10^5\\;\\mathrm{m\\,s^{-1}}$, where $c_s = \\sqrt{(T_e + T_i)/m_i}$ is the sound\
  \ speed). $v_{\\parallel,i}$ is measured by Mach probes or inferred from charge-exchange\
  \ recombination spectroscopy Doppler shifts and is a primary output of edge fluid\
  \ codes operating on 1-D, 2-D, or GGD meshes. See also `ion_momentum_radial_diffusivity`\
  \ and `parallel_component_of_ion_momentum_diffusivity` for associated transport\
  \ coefficients."
kind: vector_component
unit: m.s^-1
