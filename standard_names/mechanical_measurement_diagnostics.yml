- name: z_coordinate_of_sensor_attachment_point
  kind: scalar
  status: active
  description: Z coordinate of the point where a sensor is mechanically attached to
    a device component, expressed in the right-handed Cartesian (x, y, z) frame with
    z vertical.
  documentation: 'Z coordinate of the point where a sensor is mechanically attached
    to a device component is the signed vertical Cartesian coordinate of the fixed
    mechanical attachment point in the right-handed Cartesian $(x, y, z)$ frame. The
    $hat{z}$ direction is vertical and is aligned with $hat{Z}$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    Let $\mathbf{r}_a$ be the position vector of the attachment point and $\mathbf{r}_0$
    the origin of the right-handed Cartesian $(x, y, z)$ frame. The coordinate is
    the projection on the vertical basis vector of that frame:


    $$

    z_a = (\mathbf{r}_a - \mathbf{r}_0) \cdot \hat{z}

    $$


    where $z_a$ is the sensor-attachment-point z coordinate and $\hat{z}$ is the vertical
    unit vector of the right-handed Cartesian $(x, y, z)$ frame.


    Together with [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)
    and [y_coordinate_of_sensor_attachment_point](name:y_coordinate_of_sensor_attachment_point),
    this quantity locates the same mechanical attachment reference point. It is not
    the sensor sensitive point, line-of-sight reference point, or orientation vector.
    The zero level is the plane $z=0$ through the origin of the right-handed Cartesian
    $(x, y, z)$ frame; for a midplane-centered frame this plane is the machine midplane.


    Sign convention: Positive when the attachment point lies in the $+\hat{z}$ direction
    from the plane $z=0$ of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_coordinate_of_sensor_attachment_point
  - name:y_coordinate_of_sensor_attachment_point
  sources:
  - dd_path: operational_instrumentation/sensor/attachement_points/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/operational_instrumentation.html#operational_instrumentation-sensor-attachement_points-z
