- name: poloidal_magnetic_flux_at_pedestal_top
  kind: scalar
  status: active
  description: Poloidal magnetic flux at the pedestal top is the signed value of the
    poloidal magnetic flux function on the H-mode pedestal-top flux surface.
  documentation: 'Poloidal magnetic flux at the pedestal top is the signed value of
    the poloidal magnetic flux function on the H-mode pedestal-top flux surface. The
    pedestal top is the core-side top of the steep edge pedestal and may be identified
    by the [normalized poloidal flux coordinate of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the value can be represented
    as the flux through a horizontal disk bounded by a point on that flux surface:


    $$

    \psi_\mathrm{ped} = \int_0^{R_\mathrm{ped}} B_Z(R'', Z_\mathrm{ped})\,2\pi R''\,dR''

    $$


    where $\psi_\mathrm{ped}$ denotes this quantity, $(R_\mathrm{ped}, Z_\mathrm{ped})$
    is any point on the pedestal-top flux surface with $R_\mathrm{ped}$ and $Z_\mathrm{ped}$
    in meters, $R''$ is the disk-integration radius in meters, and $B_Z$ is the vertical
    magnetic-field component in tesla. The integral fixes the additive reference to
    the zero-radius disk on the toroidal symmetry axis; only differences in $\psi$
    are invariant under an added constant.


    This dimensional flux value is related to [normalized poloidal magnetic flux at
    the pedestal top](name:normalized_poloidal_magnetic_flux_at_pedestal_top) through
    the normalization $(\psi_\mathrm{ped}-\psi_0)/(\psi_b-\psi_0)$, where $\psi_0$
    is the [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    and $\psi_b$ is the [poloidal magnetic flux at the plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).
    It is not a radius-like coordinate such as [toroidal flux radius at the pedestal
    top](name:toroidal_flux_radius_at_pedestal_top), and it is distinct from values
    at the pedestal center or maximum-gradient surface unless those loci are defined
    to coincide with the pedestal top.


    Sign convention: Positive when $B_Z$ on the horizontal integration disk points
    in the $+\hat{Z}$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_flux_coordinate_of_pedestal
  sources:
  - dd_path: summary/local/pedestal/position/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-pedestal-position-psi
    dd_documentation:
      leaf: Poloidal magnetic flux
