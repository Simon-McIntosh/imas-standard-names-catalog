- name: deuterium_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of deuterium ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core plasma.
  documentation: "Deuterium density at the pedestal top is the local number density\
    \ of deuterium ions (D$^+$, $Z=1$, $A=2$) at the shoulder of the H-mode edge transport\
    \ barrier, where the steep edge density gradient transitions to the flatter confined-plasma\
    \ core profile. As the primary fuel ion species in standard deuterium operations,\
    \ this quantity is a species-resolved member of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family and represents the dominant single ion contribution to the total pedestal\
    \ charge balance.\n\nThe deuterium ion density at the pedestal top participates\
    \ in the local quasi-neutrality constraint alongside all other ion populations:\n\
    \n$$\nn_e = n_D + \\sum_s Z_s \\, n_s\n$$\n\nwhere $n_e$ is the electron number\
    \ density, $n_D$ is the deuterium number density (D$^+$ carries a single ionization\
    \ state), $Z_s$ is the charge number of impurity or minority species $s$, and\
    \ $n_s$ is the number density of that species at the pedestal top.\n\nDeuterium\
    \ pedestal density is inferred from Thomson scattering electron density profiles\
    \ combined with quasi-neutrality, from Balmer-series Stark broadening, or from\
    \ charge-exchange recombination spectroscopy. In H-mode tokamaks, pedestal-top\
    \ densities range from roughly $1$\u2013$10 \\times 10^{19}$ m$^{-3}$, depending\
    \ on plasma current, toroidal field, and fueling rate. Species-resolved siblings\
    \ include [hydrogen_density_at_pedestal_top](name:hydrogen_density_at_pedestal_top)\
    \ for protium, [helium_4_density_at_pedestal_top](name:helium_4_density_at_pedestal_top)\
    \ for helium-4 ash, and [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top)\
    \ for the complementary electron population at this radial location."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:helium_4_density_at_pedestal_top
  - name:electron_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: deuterium
    operator_kind: qualifier
- name: deuterium_tritium_density_at_pedestal_top
  kind: scalar
  status: active
  description: "Number density of the effective deuterium\u2013tritium fuel-ion population\
    \ evaluated at the H-mode pedestal top, where the steep-gradient barrier meets\
    \ the flatter core plasma."
  documentation: "Deuterium\u2013tritium density at the pedestal top is the local\
    \ number density of the effective deuterium\u2013tritium fuel-ion population at\
    \ the shoulder of the H-mode edge transport barrier, where the steep edge density\
    \ gradient transitions to the flatter confined-plasma core variation. The pedestal\
    \ top is the common evaluation locus for the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family.\n\nThe pedestal-top value is the combined local density of deuterium\
    \ and tritium fuel ions evaluated on the pedestal-top flux surface:\n\n$$\nn_{\\\
    mathrm{DT,ped}} = \\left.\\left(n_{\\mathrm{D}^+} + n_{\\mathrm{T}^+}\\right)\\\
    right|_{\\rho=\\rho_{\\mathrm{ped}}}\n$$\n\nwhere $n_{\\mathrm{D}^+}$ and $n_{\\\
    mathrm{T}^+}$ are the local densities of deuterium and tritium ions, respectively,\
    \ $\\rho$ is the radial flux-surface label in flux coordinates $(\\rho,\\theta,\\\
    phi)$, and $\\rho_{\\mathrm{ped}}$ identifies the pedestal-top surface.\n\nThis\
    \ quantity represents an effective single fuel species, not the deuterium\u2013\
    tritium fusion reaction channel. It includes the ionized deuterium and tritium\
    \ fuel populations, excludes neutral atoms and molecules, and combines the separate\
    \ [deuterium_density_at_pedestal_top](name:deuterium_density_at_pedestal_top)\
    \ and [tritium_density_at_pedestal_top](name:tritium_density_at_pedestal_top)\
    \ contributions at the same locus."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:deuterium_density_at_pedestal_top
  - name:tritium_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: deuterium_tritium
    operator_kind: qualifier
- name: edge_localized_mode_frequency
  kind: scalar
  status: active
  description: Rate of recurrent edge-localized mode events during an ELMing H-mode
    phase, expressing the cadence of pedestal-relaxation bursts rather than their
    amplitude or exhaust.
  documentation: 'The edge-localized mode frequency is the event rate of recurrent
    pedestal-relaxation bursts during an ELMing H-mode phase. It characterizes the
    cadence of ELM events, not their amplitude, duration, expelled particle content,
    or transient energy.


    $$

    f_{\mathrm{ELM}} = \frac{N_{\mathrm{ELM}}}{\Delta t}

    $$


    where $f_{\mathrm{ELM}}$ is the ELM event frequency, $N_{\mathrm{ELM}}$ is the
    number of identified ELM events, and $\Delta t$ is the elapsed interval over which
    those events are counted. The interval must represent the ELMing phase being characterized;
    isolated events outside that phase are excluded.'
  unit: Hz
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - dd_path: summary/elms/frequency/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-elms-frequency-value
    dd_documentation:
      leaf: Value
      parent_path: summary/elms/frequency
      parent: ELMs frequency
      data_type: FLT_1D
      unit: Hz
      coordinates:
      - summary/time
    enhanced_context:
      description: Edge Localized Mode (ELM) frequency, the repetition rate of ELM
        events during an H-mode discharge. A key parameter characterizing the ELM
        regime and its impact on divertor heat loads.
      kind: template
- name: effective_charge_at_pedestal_top
  kind: scalar
  status: active
  description: Effective charge at the pedestal top is the local plasma effective
    charge evaluated at the core-side shoulder of the steep-gradient H-mode edge transport
    barrier. It measures the charge-squared weighted contribution of all ion species
    and charge states relative to the local electron density.
  documentation: 'Effective charge at the pedestal top is the local plasma effective
    charge evaluated at the core-side shoulder of the steep-gradient H-mode edge transport
    barrier. It characterizes the all-ion charge-squared weighting relative to the
    local electron density at that locus.


    The local effective charge is defined by the charge-squared weighted ion-density
    sum normalized by electron density:


    $$

    Z_\mathrm{eff} = \frac{\sum_{s,c} n_{s,c} Z_{s,c}^{2}}{n_e}

    $$


    where $s$ labels ion species, $c$ labels charge state, $n_{s,c}$ is the number
    density of ions of species $s$ in charge state $c$, $Z_{s,c}$ is the corresponding
    positive charge number, and $n_e$ is the electron number density.


    The sum includes hydrogenic fuel ions, helium ash, and impurity ions in all populated
    charge states at the pedestal top. For a quasineutral plasma, $n_e = \sum_{s,c}
    n_{s,c} Z_{s,c}$, so a plasma containing only singly ionized hydrogenic ions has
    $Z_\mathrm{eff}=1$; higher charge states increase $Z_\mathrm{eff}$ in proportion
    to $n_{s,c} Z_{s,c}^{2}$. This is the pedestal-top specialization of [effective_charge](name:effective_charge)
    and is the same physical mixture quantity denoted by [charge_at_pedestal_top](name:charge_at_pedestal_top),
    not a separate component or subterm.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:charge_at_pedestal_top
  - name:effective_charge_at_internal_transport_barrier
  arguments:
  - name: charge_at_pedestal_top
    operator: effective
    operator_kind: qualifier
- name: effective_charge_at_plasma_boundary
  kind: scalar
  status: active
  description: Effective charge number of the ion mixture at the plasma boundary is
    the charge-squared-weighted sum of ionic number densities divided by the electron
    number density at that boundary. It equals one for a purely singly charged hydrogenic
    ion mixture and increases with impurity charge content.
  documentation: 'Effective charge number of the ion mixture at the plasma boundary
    is the charge-squared-weighted sum of ionic number densities divided by the electron
    number density, evaluated at the plasma boundary where the confined plasma meets
    the last closed flux surface. Because each ion population is weighted by the square
    of its charge number, higher charge states contribute disproportionately to this
    quantity relative to their particle density.


    The boundary value is defined from the charge-state-resolved ion densities by


    $$

    Z_{\mathrm{eff},b} = \frac{\sum_i n_{i,b} Z_i^2}{n_{e,b}}

    $$


    where $Z_{\mathrm{eff},b}$ is the effective charge at the plasma boundary, $i$
    indexes every ion species and charge state present at the boundary, $n_{i,b}$
    is the number density of ion population $i$ at the boundary in $\mathrm{m}^{-3}$,
    $Z_i$ is its charge number, and $n_{e,b}$ is the electron number density at the
    boundary in $\mathrm{m}^{-3}$. Under quasineutrality, $n_{e,b} = \sum_i n_{i,b}
    Z_i$, so the denominator equals the charge-weighted (first-moment) sum of the
    same ion densities.


    The sum includes all ion species and all charge states at the boundary; for a
    quasineutral, purely singly charged hydrogenic ion mixture, $Z_{\mathrm{eff},b}
    = 1$, and any admixture of multiply charged impurities raises the value above
    unity. This local boundary value is distinct from [flux-surface-averaged effective
    charge at the plasma boundary](name:flux_surface_averaged_effective_charge_at_plasma_boundary),
    which applies an explicit average over the boundary flux surface, and from [effective
    charge at the limiter](name:effective_charge_at_limiter), which is evaluated at
    the limiter contact location rather than at the plasma boundary.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:charge_at_plasma_boundary
  - name:flux_surface_averaged_effective_charge_at_plasma_boundary
  arguments:
  - name: charge_at_plasma_boundary
    operator: effective
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix/zeff/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-zeff-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix/zeff
      parent: Effective charge
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Effective charge.
      kind: template
- name: electron_average_temperature_at_midplane
  kind: scalar
  status: active
  description: Electron average temperature at midplane is the path-length-weighted
    mean electron kinetic temperature along an open scrape-off-layer magnetic field
    line between its upstream midplane crossing and its connected downstream divertor
    target.
  documentation: 'Electron average temperature at midplane is the path-length-weighted
    mean electron kinetic temperature along an open scrape-off-layer magnetic field
    line, assigned to the field line''s upstream midplane crossing. The upstream endpoint
    is the same midplane locus used for [electron temperature at midplane](name:electron_temperature_at_midplane),
    and the downstream endpoint is the connected divertor-target locus used for [electron
    temperature at divertor target](name:electron_temperature_at_divertor_target).
    The midplane is a surface of constant vertical coordinate $Z=Z_\mathrm{mid}$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle increasing counter-clockwise when viewed from above,
    and $Z$ is vertical height.


    Let $s$ be distance along the magnetic field line, increasing from the upstream
    midplane endpoint $s_u$ to the downstream divertor-target endpoint $s_d$. The
    field-line average is


    $$

    \langle T_e \rangle_\parallel = \frac{1}{s_d - s_u}\int_{s_u}^{s_d} T_e(s)\,ds

    $$


    where $T_e(s)$ is the local electron kinetic temperature on the same field line,
    $s_u$ is the upstream midplane endpoint, $s_d$ is the downstream divertor-target
    endpoint, and $s_d-s_u$ is the parallel connection length between them.


    This quantity is an arclength average over a single connected open field-line
    segment, not a volume average, a flux-surface average, or a local endpoint temperature.
    It is defined for open field lines that intersect the midplane and terminate on
    a divertor target.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_midplane
  - name:electron_temperature_at_outboard_midplane
  sources:
  - dd_path: langmuir_probes/reciprocating/plunge/t_e_average
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-plunge-t_e_average
    dd_documentation:
      leaf: Electron temperature (upstream to downstream average)
      parent_path: langmuir_probes/reciprocating/plunge
      parent: Set of plunges of this probe during the pulse, each plunge being recorded
        as a time slice from the Access Layer point of view. The time child node corresponds
        to the time of maximum penetration of the probe during a given plunge. The
        dynamics of physicas quantities within the plunge are described via the time_within_plunge
        vector.
      data_type: STRUCTURE
      unit: eV
    enhanced_context:
      description: Electron temperature (Te) averaged from upstream to downstream
        along the field line, measured by a reciprocating Langmuir probe during a
        plunge. Provides a spatially averaged Te across the scrape-off layer (SOL).
      kind: llm
- name: electron_collisionality_at_pedestal_top
  kind: scalar
  status: active
  description: Dimensionless ratio of the electron collision frequency to the characteristic
    electron bounce frequency at the H-mode pedestal top, governing the neoclassical
    transport regime of the pedestal electron population.
  documentation: "Electron collisionality at the pedestal top quantifies the ratio\
    \ of the electron collision rate to the trapped-electron bounce frequency at the\
    \ inner shoulder of the H-mode edge transport barrier. It is the electron-specific\
    \ member of [collisionality_at_pedestal_top](name:collisionality_at_pedestal_top)\
    \ and determines whether pedestal electrons occupy the banana, plateau, or Pfirsch\u2013\
    Schl\xFCter transport regime.\n\nThe standard dimensionless electron collisionality\
    \ is\n\n$$\n\\nu_e^* = \\frac{\\nu_{ei} \\, q R}{\\epsilon^{3/2} \\, v_{\\mathrm{the}}}\n\
    $$\n\nwhere $\\nu_{ei}$ is the electron\u2013ion collision frequency, $q$ is the\
    \ local safety factor, $R$ is the major radius, $\\epsilon = r/R$ is the inverse\
    \ aspect ratio at the pedestal with minor radius $r$, and $v_{\\mathrm{the}} =\
    \ \\sqrt{2T_e/m_e}$ is the electron thermal speed with electron temperature $T_e$\
    \ and electron mass $m_e$.\n\nThis parameter is central to pedestal physics: $\\\
    nu_e^* \\ll 1$ places electrons in the banana regime where trapped particles complete\
    \ bounce orbits and bootstrap current is substantial, while $\\nu_e^* \\gg 1$\
    \ suppresses trapping effects and enhances Pfirsch\u2013Schl\xFCter transport.\
    \ At the pedestal top, electron collisionality enters peeling-ballooning and kinetic-ballooning-mode\
    \ stability criteria. It is computed from pedestal electron density and temperature\
    \ profiles, commonly from Thomson scattering, combined with the [coulomb_logarithm_at_pedestal_top](name:coulomb_logarithm_at_pedestal_top)\
    \ to evaluate $\\nu_{ei}$.\n\nIn H-mode operation, pedestal electron collisionality\
    \ spans approximately 0.01\u20131 depending on device size, toroidal field, and\
    \ heating power; projected burning-plasma devices are expected to operate in the\
    \ low-collisionality banana regime ($\\nu_e^* \\lesssim 0.1$). The child quantity\
    \ [normalized_electron_collisionality_at_pedestal_top](name:normalized_electron_collisionality_at_pedestal_top)\
    \ expresses this ratio relative to a reference value for cross-machine comparisons."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:collisionality_at_pedestal_top
  - name:coulomb_logarithm_at_pedestal_top
  - name:normalized_electron_collisionality_at_pedestal_top
  arguments:
  - name: collisionality_at_pedestal_top
    operator: electron
    operator_kind: qualifier
- name: electron_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Characteristic outward distance over which electron number density
    decreases by one e-folding in the scrape-off layer.
  documentation: 'This quantity is the e-folding distance for electron number density
    that decreases outward from the confined plasma into the open-field-line scrape-off
    layer. It is the electron-density member of the [decay-length family](name:decay_length_over_scrape_off_layer),
    distinct from the [ion decay length](name:ion_decay_length_over_scrape_off_layer).


    $$

    L_e = \left|\frac{d\ln n_e}{dx}\right|^{-1}

    $$


    where $L_e$ is the electron-density e-folding length, $n_e$ is electron number
    density, and $x$ is outward distance normal to magnetic flux surfaces. The quantity
    is defined locally where the logarithmic gradient is nonzero; the magnitude gives
    the positive distance associated with the outward decrease. It does not denote
    the decay length of temperature or heat flux, which are separate members of the
    family.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:decay_length_over_scrape_off_layer
  - name:ion_decay_length_over_scrape_off_layer
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: summary/scrape_off_layer/n_e_decay_length/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-scrape_off_layer-n_e_decay_length-value
    dd_documentation:
