- name: binormal_coordinate_of_conductor_cross_section_outline
  kind: scalar
  status: draft
  description: Binormal-axis coordinate of vertices defining the polygonal outline
    of a coil conductor cross-section in the local Frenet-Serret (normal, binormal)
    frame attached to the conductor centerline.
  documentation: 'The binormal coordinate $b$ is the projection of a cross-section
    outline vertex onto the binormal axis $\hat{b}$ of the local Frenet-Serret frame
    co-moving with the conductor centerline. Together with the companion [normal-axis
    coordinate](name:normal_coordinate_of_conductor_cross_section_outline), it forms
    the two-component position vector $\mathbf{r}_{\perp} = (n, b)$ that fully describes
    the shape of the conductor cross-section, as detailed in [coordinate_of_conductor_cross_section_outline](name:coordinate_of_conductor_cross_section_outline).
    The binormal axis $\hat{b} = \hat{t} \times \hat{n}$, where $\hat{t}$ is the unit
    tangent and $\hat{n}$ is the principal normal to the centerline curve, so the
    frame is right-handed and orthonormal. Typical values span the physical conductor
    width, ranging from a few millimeters for small diagnostic coils to several centimeters
    for large TF or PF coil conductors. The outline polygon is closed, meaning the
    first and last vertices coincide; the full cross-sectional extent in the binormal
    direction is characterized separately by [binormal_height_of_conductor_cross_section](name:binormal_height_of_conductor_cross_section).


    Sign convention: Positive when the vertex lies in the direction of $\hat{b} =
    \hat{t} \times \hat{n}$, i.e., in the direction completing the right-handed Frenet-Serret
    triad from the tangent and normal axes.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:normal_coordinate_of_conductor_cross_section_outline
  - name:coordinate_of_conductor_cross_section_outline
  - name:binormal_height_of_conductor_cross_section
  constraints: []
  arguments:
  - name: coordinate_of_conductor_cross_section_outline
    operator: coordinate
    operator_kind: coordinate
    axis: binormal
    shape: coordinate
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/outline/binormal
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/binormal
    status: composed
- name: binormal_width_of_conductor_cross_section
  kind: scalar
  status: draft
  description: Full width of a rectangular coil conductor cross-section measured in
    the binormal direction of the local Frenet-Serret frame attached to the conductor
    centerline.
  documentation: "The binormal width characterizes the spatial extent of a rectangular\
    \ conductor cross-section along the binormal axis $\\hat{b}$ of the Frenet-Serret\
    \ frame $(\\hat{t}, \\hat{n}, \\hat{b})$, where $\\hat{t}$ is the unit tangent\
    \ to the conductor centerline, $\\hat{n}$ is the principal normal, and $\\hat{b}\
    \ = \\hat{t} \\times \\hat{n}$ is the binormal. For a rectangular cross-section,\
    \ this dimension \u2014 together with the corresponding normal-direction extent\
    \ \u2014 fully characterizes the cross-sectional geometry; the cross-sectional\
    \ area is then $A = w_b \\times w_n$, where $w_b$ is the binormal width and $w_n$\
    \ is the normal-direction width. This quantity is semantically equivalent to [binormal_extent_of_conductor_cross_section](name:binormal_extent_of_conductor_cross_section),\
    \ which uses the token 'extent' for the same binormal dimension; the complementary\
    \ dimension in the binormal direction is captured by [binormal_height_of_conductor_cross_section](name:binormal_height_of_conductor_cross_section).\
    \ Typical values for superconducting tokamak coil conductors range from a few\
    \ millimeters to several centimeters. The cross-sectional vertices can be described\
    \ using [binormal_coordinate_of_conductor_cross_section_outline](name:binormal_coordinate_of_conductor_cross_section_outline)\
    \ and [normal_coordinate_of_conductor_cross_section_outline](name:normal_coordinate_of_conductor_cross_section_outline)\
    \ for polygonal geometries."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_extent_of_conductor_cross_section
  - name:binormal_height_of_conductor_cross_section
  - name:binormal_coordinate_of_conductor_cross_section_outline
  - name:normal_coordinate_of_conductor_cross_section_outline
  constraints: []
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/height
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/height
    status: composed
- name: conductor_temperature_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Winding-pack averaged temperature of the conductor in a poloidal field
    coil, defined as the bulk thermal state of the current-carrying turns. This is
    distinct from coolant inlet or outlet temperatures and from casing or structural
    temperatures.
  documentation: "The conductor temperature $T_\\mathrm{cond}$ is the winding-pack\
    \ averaged (bulk) temperature of the current-carrying conductor turns within a\
    \ poloidal field coil. It characterizes the mean thermal state of the conductor\
    \ material \u2014 typically a superconducting cable or copper stabilizer \u2014\
    \ and is distinct from the coolant temperature measured at the inlet or outlet\
    \ of the cooling circuit, from any casing or coil-former structural temperature,\
    \ and from a hotspot temperature computed during quench transients.\n\nFor a superconducting\
    \ coil, $T_\\mathrm{cond}$ enters the critical-surface relations that bound the\
    \ maximum sustainable current. The critical current density $J_c$ of a superconductor\
    \ depends jointly on the local magnetic flux density $B$, the temperature $T$,\
    \ and the strain $\\varepsilon$; at fixed $B$ and $\\varepsilon$, $J_c$ is a monotonically\
    \ decreasing function of $T$. For low-temperature superconductors (e.g., Nb$_3$Sn,\
    \ NbTi) typical operating values are in the range $1.8\\,\\mathrm{K} \\lesssim\
    \ T_\\mathrm{cond} \\lesssim 5\\,\\mathrm{K}$, with critical temperatures $T_c\
    \ \\sim 9\\text{\u2013}18\\,\\mathrm{K}$ depending on the strand material. For\
    \ resistive (copper or aluminum) coils, $T_\\mathrm{cond}$ governs Joule heating\
    \ limits and may range from cryogenic to several hundred kelvin during pulsed\
    \ operation.\n\nIn measurement practice, $T_\\mathrm{cond}$ is typically inferred\
    \ from temperature sensors (e.g., resistance temperature detectors or Cernox sensors)\
    \ attached at representative locations on or near the winding pack, or from embedded\
    \ sensors within the cable conduit. The averaging convention is a spatial mean\
    \ over the full winding volume unless a more localized value is explicitly documented\
    \ for a given coil segment.\n\nWhen used as a coordinate axis, $T_\\mathrm{cond}$\
    \ parameterizes the maximum allowable current for a given coil at a specified\
    \ background field, forming one dimension of a multi-variable operational limit\
    \ table. However, this usage is a consequence of the physical quantity; the temperature\
    \ itself is defined independently of any particular application."
  unit: K
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_conductor_element_center
  constraints: []
  sources:
  - id: dd:pf_active/coil/temperature
    dd_path: pf_active/coil/temperature
    status: composed
- name: cross_sectional_area_of_conductor_element
  kind: scalar
  status: draft
  description: Cross-sectional area of an individual conductor element within a poloidal
    field coil winding, measured perpendicular to the element axis.
  documentation: 'The cross-sectional area $A$ of a conductor element is the area
    of the plane section taken perpendicular to the local conductor axis. It enters
    directly into the current density $J = I / A$, where $I$ is the current carried
    by the element, and governs resistive heating, inductance calculations, and electromagnetic
    force estimates for poloidal field coil design. In lumped-element coil models,
    each conductor element is characterized by its centroid location (see [major_radius_of_conductor_element_center](name:major_radius_of_conductor_element_center))
    and this area, which together define the magnetic moment contribution to equilibrium
    field calculations. For annular conductor geometries the net conducting area is
    $A = \pi(r_\mathrm{out}^2 - r_\mathrm{in}^2)$, where $r_\mathrm{in}$ is given
    by [inner_radius_of_annular_conductor_cross_section](name:inner_radius_of_annular_conductor_cross_section)
    and $r_\mathrm{out}$ is the outer radius. Typical values range from $10^{-4}$
    to $10^{-2}$ m$^2$ depending on coil size and current rating. The cross-sectional
    area is specified at coil-design time and is confirmed by dimensional metrology
    during manufacture; it is not a measured plasma quantity.


    Sign convention: Positive when the area is non-zero and measured as a positive-definite
    geometric quantity perpendicular to the conductor axis.'
  unit: m^2
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_conductor_element_center
  - name:inner_radius_of_annular_conductor_cross_section
  constraints: []
  sources:
  - id: dd:pf_active/coil/element/area
    dd_path: pf_active/coil/element/area
    status: composed
- name: inner_radius_of_annular_geometry
  kind: scalar
  status: draft
  description: Inner radius of an annular cross-section element of a ferritic insert
    or iron core segment, defining the radial inner boundary of the hollow cylindrical
    geometry.
  documentation: 'The inner radius $r_{\mathrm{in}}$ of an annular geometry element
    specifies the radial distance from the symmetry axis to the inner wall of the
    hollow cylindrical cross-section. Together with the corresponding outer radius,
    it fully defines the annular cross-sectional area $A = \pi(r_{\mathrm{out}}^2
    - r_{\mathrm{in}}^2)$, where $r_{\mathrm{out}}$ is the outer radius of the same
    annulus. This parameter is used in equilibrium reconstruction and magnetic field
    modeling to characterize ferritic inserts and iron core segments, whose geometry
    directly influences the distribution of magnetic flux in the machine. Typical
    values range from a few centimeters to tens of centimeters depending on the size
    of the structural element. The companion [major-radius coordinate of the annular
    geometry center](name:major_radius_of_annular_geometry) and [vertical coordinate
    of the annulus](name:vertical_coordinate_of_annulus) fully locate the element
    in the right-handed cylindrical $(R, \phi, Z)$ frame. For conductor elements,
    the analogous quantity is the [inner radius of the annular conductor cross-section](name:inner_radius_of_annular_conductor_cross_section).


    Sign convention: Positive when measured as a radial distance outward from the
    machine symmetry axis in the $+\hat{R}$ direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_annular_geometry
  - name:vertical_coordinate_of_annulus
  - name:inner_radius_of_annular_conductor_cross_section
  constraints: []
  sources:
  - id: dd:ferritic/object/axisymmetric/annulus/radius_inner
    dd_path: ferritic/object/axisymmetric/annulus/radius_inner
    status: composed
- name: major_radius_of_annular_geometry
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the center of an annular cross-section
    geometry element in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The major radius $R$ locates the centroid of an annular (hollow-cylinder)
    cross-section element along the radial direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is the perpendicular distance from the machine
    symmetry axis in meters. Annular cross-sections are common idealizations for axisymmetric
    conducting structures such as poloidal field coils, passive stabilizing loops,
    iron-core segments, and antenna straps, where the geometry is fully characterized
    by $R$, the vertical coordinate $Z$ (see [vertical coordinate of annulus](name:vertical_coordinate_of_annulus)),
    the inner radius, and the outer radius. Together with the vertical coordinate,
    this quantity specifies the geometric center used as the reference point for computing
    mutual inductances, magnetic-field contributions, and force balance in axisymmetric
    equilibrium models. Typical values range from $\sim 0.3$ m for compact tokamak
    inner-wall components to $\sim 10$ m for large-device outer structures. This name
    is the adjectival-form analog of [major radius of annulus geometry](name:major_radius_of_annulus_geometry),
    which carries the same physical meaning and should be preferred for new names
    following the established noun-form convention.


    Sign convention: Positive when $R$ is measured outward from the machine symmetry
    axis, as in the right-handed cylindrical $(R, \phi, Z)$ frame where $R \geq 0$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_coordinate_of_annulus
  - name:major_radius_of_annulus_geometry
  constraints: []
  sources:
  - id: dd:iron_core/segment/geometry/annulus/r
    dd_path: iron_core/segment/geometry/annulus/r
    status: composed
- name: major_radius_of_conductor_element_center
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the geometric center of a coil conductor
    element in the right-handed cylindrical $(R, \phi, Z)$ frame, measured as the
    perpendicular distance from the machine symmetry axis.
  documentation: 'The major radius $R$ of a conductor element center is the perpendicular
    distance from the machine symmetry axis to the geometric midpoint of that element,
    evaluated in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is the
    radial coordinate, $\phi$ is the toroidal angle, and $Z$ is the vertical height.
    For non-axisymmetric coil systems, the center point lies midway along the conductor
    element between its start and end points, and $R$ typically ranges from a few
    tens of centimeters to several meters depending on device size and coil geometry.
    This coordinate is used in Biot-Savart calculations of the magnetic field produced
    by discretized coil filaments, and in geometric modeling of coil winding packs.
    The companion coordinates [vertical_coordinate_of_conductor_element_center](name:vertical_coordinate_of_conductor_element_center)
    and [toroidal_angle_of_conductor_element_center](name:toroidal_angle_of_conductor_element_center)
    fully specify the center location in three dimensions, while [major_radius_of_conductor_element_end_point](name:major_radius_of_conductor_element_end_point)
    gives the corresponding radial coordinate at the element endpoint.


    Sign convention: Positive when the center point lies at a finite perpendicular
    distance from the machine symmetry axis in the outward radial direction, i.e.
    $R > 0$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_coordinate_of_conductor_element_center
  - name:toroidal_angle_of_conductor_element_center
  - name:major_radius_of_conductor_element_end_point
  constraints: []
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/elements/centres/r
    dd_path: coils_non_axisymmetric/coil/conductor/elements/centres/r
    status: composed
- name: major_radius_of_conductor_element_end_point
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the end point of a coil conductor element\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, measured as the perpendicular\
    \ distance from the machine symmetry axis."
  documentation: 'The major radius $R$ of a conductor element end point is the perpendicular
    distance from the machine symmetry axis to that terminal vertex of the conductor
    segment, measured in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$
    is the radial coordinate, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above, and $Z$ is the vertical height. Each conductor element
    is geometrically bounded by a start point and an end point; this coordinate specifies
    the radial position of the latter, complementing [major radius of the element
    center](name:major_radius_of_conductor_element_center) and the corresponding [toroidal
    angle of the end point](name:toroidal_angle_of_conductor_element_end_point). In
    non-axisymmetric coil systems, $R$ of the end point typically ranges from a few
    tenths of a meter to several meters depending on the device size and coil geometry.
    The coordinate is used together with its $Z$ and $\phi$ counterparts to reconstruct
    the full three-dimensional path of each conductor element for magnetic field computation
    and inductance calculations.


    Sign convention: Positive when the end point lies at a finite perpendicular distance
    from the machine symmetry axis, as $R \geq 0$ by definition in the cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_conductor_element_center
  - name:toroidal_angle_of_conductor_element_end_point
  constraints: []
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/elements/end_points/r
    dd_path: coils_non_axisymmetric/coil/conductor/elements/end_points/r
    status: composed
- name: major_radius_of_thick_line_second_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the second endpoint of a thick-line cross-section
    geometry element in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The thick-line cross-section geometry describes an axisymmetric\
    \ structural element \u2014 such as an iron-core segment or ferritic component\
    \ \u2014 whose cross-section is defined by two endpoints and a thickness. This\
    \ quantity gives the $R$ coordinate (major radius, measured from the machine symmetry\
    \ axis in the cylindrical $(R, \\phi, Z)$ frame) of the second of those two defining\
    \ endpoints. Together with its companion [vertical coordinate of the second point](name:vertical_coordinate_of_second_point_of_thick_line),\
    \ it fully locates the second endpoint in the poloidal cross-section. Typical\
    \ values range from tens of centimeters to several meters depending on the device\
    \ scale and the radial position of the component. The pair of endpoint coordinates,\
    \ combined with the thickness, replaces the more general outline representation\
    \ used for components with complex cross-sections such as [plasma-facing component\
    \ outline points](name:major_radius_of_plasma_facing_component_outline_point).\
    \ Analogous major-radius coordinates are defined for other cross-section types:\
    \ [oblique geometry](name:major_radius_of_oblique_geometry), [annular geometry](name:major_radius_of_annular_geometry),\
    \ and [rectangular geometry](name:major_radius_of_rectangle_geometry).\n\nSign\
    \ convention: Positive when the second endpoint lies at a finite distance from\
    \ the machine symmetry axis in the outward radial direction, i.e. $R > 0$."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_coordinate_of_second_point_of_thick_line
