- name: diameter_of_pellet
  kind: scalar
  status: active
  description: Transverse extent of the intact cylindrical pellet before injection
    and shattering, defined as the full width of its circular cross-section perpendicular
    to the pellet axis.
  documentation: 'Transverse extent of the intact cylindrical pellet before injection
    and shattering is the full width of its circular cross-section measured perpendicular
    to the pellet axis. It defines the pellet cross-sectional geometry before fragmentation,
    ablation, or interaction with the plasma.


    For an ideal right circular cylindrical pellet, the diameter and axial length
    determine the pellet volume by


    $$

    V_\mathrm{pellet} = \frac{\pi}{4} d_\mathrm{pellet}^2 L_\mathrm{pellet}

    $$


    where $V_\mathrm{pellet}$ is the pellet volume, $d_\mathrm{pellet}$ is the pellet
    diameter, and $L_\mathrm{pellet}$ is the [length of pellet](name:length_of_pellet).


    This quantity excludes the axial extent of the pellet, which is the [length of
    pellet](name:length_of_pellet), and excludes characteristic sizes of shattered
    fragments, ablated material, or the post-shattering material cloud.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:core_density_of_pellet
  - name:shattered_pellet_fragment_density
  sources:
  - dd_path: spi/injector/pellet/diameter
    dd_version: 4.1.0
