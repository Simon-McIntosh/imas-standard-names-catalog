    \ direction. The centroid location is identified by the [vertical coordinate of\
    \ the ferritic element centroid](name:z_coordinate_of_ferritic_element_centroid),\
    \ while this quantity describes the field component there, not the element\u2019\
    s magnetization.\n\n$$\nB_Z(\\mathbf r_c)=\\mathbf B(\\mathbf r_c)\\cdot\\hat{\\\
    mathbf Z}\n$$\n\nwhere $\\mathbf r_c$ is the centroid position, $\\mathbf B$ is\
    \ the local magnetic-field vector, and $\\hat{\\mathbf Z}$ is the vertical unit\
    \ vector in the right-handed cylindrical $(R, \\phi, Z)$ frame. The radial, vertical,\
    \ and toroidal components together describe the local field; the corresponding\
    \ radial and toroidal quantities are [radial magnetic field at ferritic element\
    \ centroid](name:radial_magnetic_field_at_ferritic_element_centroid) and [toroidal\
    \ magnetic field at ferritic element centroid](name:toroidal_magnetic_field_at_ferritic_element_centroid).\n\
    \nSign convention: Positive when $B_Z$ points in the direction of increasing vertical\
    \ coordinate $Z$."
  unit: T
  physics_domain: magnetic_field_systems
  links:
