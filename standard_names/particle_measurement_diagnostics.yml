- name: beryllium_density
  kind: scalar
  status: draft
  description: Local number density of beryllium impurity ions per unit plasma volume,
    summed over all ionization states from singly ionized to fully stripped (Be1+
    through Be4+), excluding neutral beryllium atoms.
  documentation: 'Beryllium (atomic number $Z = 4$) enters the plasma primarily through
    sputtering or evaporation from beryllium first-wall surfaces. The local beryllium
    ion number density $n_\mathrm{Be}$ aggregates contributions from all four charged
    ionization stages:


    $$

    n_\mathrm{Be} = \sum_{z=1}^{4} n_{\mathrm{Be}^{z+}}

    $$


    where $n_{\mathrm{Be}^{z+}}$ is the number density of beryllium ions in charge
    state $z+$, with $z$ running from 1 (singly ionized) to 4 (fully stripped). Neutral
    beryllium atoms are excluded from this sum.


    Beryllium impurity content is inferred from passive spectroscopy of beryllium
    emission lines or from active charge-exchange recombination spectroscopy, with
    spatially resolved profiles reconstructed by tomographic inversion of chord-integrated
    measurements. Spatially averaged representations include [line_averaged_beryllium_density](name:line_averaged_beryllium_density)
    along a diagnostic chord and [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density)
    integrated over the confined plasma volume. The relative impurity abundance with
    respect to the electron population is characterized by the [ratio_of_beryllium_density_to_electron_density](name:ratio_of_beryllium_density_to_electron_density).


    Sign convention: Positive when beryllium ions are present in the plasma volume.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_beryllium_density
  - name:volume_averaged_beryllium_density
  - name:ratio_of_beryllium_density_to_electron_density
- name: diameter_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Full linear width of a circular diagnostic aperture at the entrance
    pupil, equal to twice the aperture radius and determining the solid-angle light-collection
    acceptance of the diagnostic channel.
  documentation: "The diameter of a diagnostic aperture is the full chord across the\
    \ circular opening at the entrance pupil of the optical collection system. It\
    \ is geometrically related to the [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture)\
    \ by $d = 2r$, and it directly governs the solid angle subtended at a given distance\
    \ from the plasma emission region, setting the total light throughput and therefore\
    \ the signal-to-noise balance of the diagnostic.\n\nThe solid angle $\\Omega$\
    \ subtended by a circular aperture of diameter $d$ at perpendicular distance $L$\
    \ from the emission region is:\n\n$$\n\\Omega \\approx \\frac{\\pi d^2}{4 L^2}\n\
    $$\n\nwhere $d$ is the aperture diameter and $L$ is the line-of-sight distance\
    \ from the plasma to the aperture plane.\n\nThis geometric parameter characterizes\
    \ the entrance cone of spectroscopic diagnostics, including charge exchange recombination\
    \ spectroscopy channels where the aperture diameter limits angular acceptance\
    \ and spatial resolution. Typical values in fusion diagnostic systems range from\
    \ a few millimeters to several centimeters depending on the required \xE9tendue\
    \ and spatial selectivity of the measurement.\n\nSign convention: Positive when\
    \ measured as the full chord through the aperture center in the plane of the entrance\
    \ pupil."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
  sources:
  - id: dd:charge_exchange/channel/cone_diameter
    dd_path: charge_exchange/channel/cone_diameter
    status: composed
- name: difference_of_fast_neutral_beam_motional_stark_wavelength_and_fast_neutral_beam_reference_wavelength_of_spectral_line
  kind: scalar
  status: draft
  description: Signed difference between the motional-Stark-shifted wavelength of
    a fast neutral-beam spectral emission line and the field-free reference wavelength
    of the same transition. It is the wavelength correction produced by the Lorentz
    electric field experienced by beam atoms moving through the magnetic field.
  documentation: 'This quantity is the signed wavelength difference between a fast
    neutral-beam spectral line after motional Stark shifting and the field-free reference
    wavelength of the same atomic transition. It isolates the displacement caused
    by the Lorentz electric field in the rest frame of the fast beam atom, distinct
    from Doppler shifts, Zeeman splitting, and instrumental wavelength offsets.


    For a selected spectral transition and Stark component, the linear Stark approximation
    gives the difference as:


    $$

    \Delta\lambda_\mathrm{MS} = \lambda_\mathrm{MS} - \lambda_\mathrm{ref} = S_\ell
    |\mathbf{E}_L|, \qquad \mathbf{E}_L = \mathbf{v}_b \times \mathbf{B}

    $$


    where $\Delta\lambda_\mathrm{MS}$, $\lambda_\mathrm{MS}$, and $\lambda_\mathrm{ref}$
    are wavelengths in meters; $\lambda_\mathrm{MS}$ is the motional-Stark-shifted
    wavelength; $\lambda_\mathrm{ref}$ is the field-free reference wavelength; $S_\ell$
    is the signed linear Stark coefficient for the specified line component in $\mathrm{m^2\,V^{-1}}$;
    $\mathbf{E}_L$ is the Lorentz electric field in $\mathrm{V\,m^{-1}}$; $\mathbf{v}_b$
    is the fast neutral beam velocity in $\mathrm{m\,s^{-1}}$; and $\mathbf{B}$ is
    the magnetic flux density in tesla.


    In beam emission spectroscopy and charge-exchange spectral analysis, this difference
    is computed from the local magnetic field, beam velocity, viewing geometry, and
    transition-specific Stark coefficients, or inferred by fitting resolved Stark
    components in the measured spectrum. It is used as a wavelength correction for
    the same spectral line to which the reference wavelength applies.


    Typical absolute values for deuterium Balmer-alpha emission near a 656 nm reference
    wavelength are about $1\times10^{-10}$-$2\times10^{-9}$ m in medium to large tokamaks,
    depending mainly on beam energy, magnetic field strength, and the selected Stark
    component.


    Sign convention: Positive when the motional-Stark-shifted wavelength is greater
    than the field-free reference wavelength of the same spectral transition.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:polarization_angle_at_constraint_position
  sources:
  - id: dd:charge_exchange/channel/bes/lorentz_shift
    dd_path: charge_exchange/channel/bes/lorentz_shift
    status: composed
- name: efficiency_of_neutron_detector
  kind: scalar
  status: draft
  description: Detection efficiency of a neutron detector is the probability that
    a neutron incident on the sensitive detector surface, with energy in the selected
    band, produces a registered count event.
  documentation: 'Detection efficiency of a neutron detector is a dimensionless probability
    for converting an incident neutron into an accepted count. It includes detector-physics
    and acquisition effects such as neutron conversion reactions, moderation, scintillation
    or ionization yield, thresholds, dead-time corrections when included in the calibration,
    and event-selection cuts.


    For incident neutron kinetic energy $E$ and an accepted energy interval bounded
    by $E_{\min}$ and $E_{\max}$, the efficiency is defined as the registered fraction
    of incident neutrons:


    $$

    \eta(E; E_{\min}, E_{\max}) = \frac{N_{\mathrm{registered}}(E; E_{\min}, E_{\max})}{N_{\mathrm{incident}}(E)}

    $$


    where $N_{\mathrm{incident}}$ is the number of neutrons incident on the sensitive
    detector surface, $N_{\mathrm{registered}}$ is the number producing accepted count
    events in the selected band, and $E$, $E_{\min}$, and $E_{\max}$ are neutron kinetic
    energies in eV, often reported in MeV for fusion neutrons.


    Efficiencies are measured using calibrated neutron fields or inferred from particle-transport
    and detector-response modeling validated by calibration data. The quantity is
    conditional on the detector-surface incidence described by [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector):
    for a uniform surface flux $\Phi_n(E)$ over active area $A$, the count-rate contribution
    is approximately $\int \Phi_n(E) A \eta(E)\,dE$, with angular and spatial dependence
    included when needed. Inferring plasma emission or source emissivity additionally
    requires the source-to-detector response represented by neutron_coefficient_of_neutron_detector;
    efficiency alone does not include plasma-to-detector transport, solid angle, shielding,
    or collimator transmission.


    Values are bounded by 0-1. In fusion-neutron diagnostics, effective efficiencies
    after thresholds and event selection are often 1e-6-1e-1 for collimated fast-neutron
    measurements; compact scintillators or moderated thermal-neutron counters can
    reach 0.01-0.8 in favorable energy bands, while narrow spectrometer bands may
    be lower.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutron_flux_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/energy_band/detection_efficiency
    dd_path: neutron_diagnostic/detector/energy_band/detection_efficiency
    status: composed
  - id: dd:neutron_diagnostic/detectors/energy_band/detection_efficiency
    dd_path: neutron_diagnostic/detectors/energy_band/detection_efficiency
    status: composed
- name: fast_ion_radiance_of_spectral_line_due_to_charge_exchange
  kind: scalar
  status: draft
  description: Line-of-sight photon radiance of a selected spectral line emitted by
    fast ions after charge exchange with neutral beam atoms. It is the path-integrated
    spectral-line emissivity through the beam-plasma overlap and is non-negative.
  documentation: 'Fast-ion charge-exchange spectral-line radiance is the photon radiance
    of a specified atomic transition emitted after fast ions capture electrons from
    beam neutrals and radiatively decay. It is integrated along the viewing path over
    the region where fast ions, neutrals, and the diagnostic sightline overlap, and
    over the selected spectral line rather than per unit wavelength. As a photon-counting
    radiance, physical values are non-negative.


    The defining relation is the line integral of the local spectral-line emissivity
    along the viewing path:


    $$

    \mathcal{R}_{\ell} = \int_{\mathrm{LOS}} \varepsilon_{\ell}^{\mathrm{FICX}}(\mathbf{r},
    \hat{\mathbf{n}})\, dl

    $$


    where $\mathcal{R}_{\ell}$ is the radiance of transition $\ell$, $l$ is distance
    along the line of sight, $\mathbf{r}$ is position on that path, $\hat{\mathbf{n}}$
    is the viewing direction, and $\varepsilon_{\ell}^{\mathrm{FICX}}$ is the local
    photon emissivity for that line in m^-3.s^-1.sr^-1. The path integration gives
    units of m^-2.s^-1.sr^-1.


    In practice it is obtained from absolutely calibrated active charge-exchange spectroscopy
    after correcting for instrument throughput, viewing solid angle, background light,
    and spectral-line fitting. The local emissivity is governed by a velocity-space
    convolution of the fast-ion distribution with the neutral density and relative-speed-dependent
    charge-exchange or excitation rate coefficients, multiplied by the appropriate
    radiative branching probability and the line-shape or Doppler selection of the
    observation.


    Typical calibrated line radiances span about 10^13-10^18 m^-2.s^-1.sr^-1, depending
    on fast-ion density, beam neutral density, path length through the beam-plasma
    overlap, transition strength, and viewing geometry. Values approach zero outside
    the active neutral-beam overlap; negative fitted values, if reported after background
    subtraction, represent measurement uncertainty rather than a physical radiance.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_radiance_of_spectral_line_due_to_charge_exchange
  sources:
  - id: dd:charge_exchange/channel/ion_fast/radiance
    dd_path: charge_exchange/channel/ion_fast/radiance
    status: composed
- name: height_of_neutron_detector
  kind: scalar
  status: draft
  description: Full extent of the neutron detector aperture in the second local coordinate
    direction (X2), specifying one transverse dimension of a rectangular detector
    opening.
  documentation: 'The height of a neutron detector specifies the aperture dimension
    along the second axis of the detector-local Cartesian $(X1, X2)$ coordinate frame,
    where $X2$ is oriented perpendicular to both the line-of-sight direction and the
    $X1$ axis. This quantity applies to rectangular aperture geometries and, paired
    with [width_of_neutron_detector](name:width_of_neutron_detector) measured along
    the $X1$ axis, fully defines the two-dimensional rectangular aperture opening.


    The aperture height enters the computation of geometric detector acceptance: for
    a rectangular aperture the effective acceptance area is the product of the height
    ($X2$) and width ($X1$) dimensions, which scales the solid angle subtended by
    the detector and directly affects the inferred [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).
    The aggregate quantity [surface_area_of_neutron_detector](name:surface_area_of_neutron_detector)
    is derived from these geometric parameters.


    In fusion neutron diagnostics, detector aperture heights range from a few millimeters
    to a few centimeters, chosen to balance spatial resolution against counting-rate
    requirements.


    Sign convention: Positive when the aperture height is measured in the positive
    $X2$ direction of the detector-local coordinate frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:width_of_neutron_detector
  - name:neutron_flux_of_neutron_detector
  - name:surface_area_of_neutron_detector
