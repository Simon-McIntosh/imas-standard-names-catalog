- name: minimum_of_ion_state_charge
  kind: scalar
  status: draft
  description: Minimum ionization charge state Z of the ion charge-state bundle in
    wave deposition profiles.
  documentation: 'This quantity defines the lower ionization charge state $Z_{\mathrm{min}}$
    of a bundled group of charge states for a given ion species, as used in wave deposition
    profile calculations. When multiple charge states are combined into a single bundle
    for computational efficiency (e.g., in ICRF modeling), $Z_{\mathrm{min}}$ specifies
    the lowest charge state in that bundle; for a single-state bundle it equals $Z_{\mathrm{max}}$.
    The value is an integer dimensionless charge number $Z$. The parent quantity [ion_state_charge](name:ion_state_charge)
    represents each individual charge state in the bundle, while the sibling [maximum_of_ion_state_charge](name:maximum_of_ion_state_charge)
    gives the upper bound of the same bundle. This quantity is used together with
    [ion_state_atomic_number](name:ion_state_atomic_number) to fully describe the
    ionization state of the ion species in wave heating models.


    Sign convention: Positive when the charge state $Z_{\mathrm{min}}$ corresponds
    to a higher degree of ionization (more electrons removed).'
  unit: '1'
  physics_domain: auxiliary_heating
