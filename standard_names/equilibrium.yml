- name: major_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Major radius (cylindrical $R$) coordinate of the outermost plasma boundary
    contour in the poloidal plane.
  documentation: 'This standard name gives the major radius $R$ of points on the plasma
    boundary, defined as the last closed flux surface (LCFS) or the bounding contour
    of the confined plasma region. The boundary is represented as a set of $(R, Z)$
    points in the poloidal cross-section, forming the closed curve that separates
    the confined plasma from the scrape-off layer. Typical values range from $R \approx
    1.5\,\text{m}$ in medium-sized tokamaks to $R \approx 6.2\,\text{m}$ in ITER.
    This coordinate is obtained from equilibrium reconstruction codes using external
    magnetic measurements and, where available, internal profile constraints from
    motional Stark effect or polarimetry data. It is used together with the vertical
    coordinate $Z$ to define the full boundary shape. See also [major_radius_of_separatrix](name:major_radius_of_separatrix)
    for the radius of the LCFS alone, [major_radius_of_geometric_axis](name:major_radius_of_geometric_axis)
    for the centroid of the poloidal cross-section, and [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis)
    for the innermost flux surface extremum.


    Sign convention: Positive when the point lies in the direction of increasing $R$
    from the machine symmetry axis ($R=0$).'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_separatrix
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_magnetic_axis
  sources:
