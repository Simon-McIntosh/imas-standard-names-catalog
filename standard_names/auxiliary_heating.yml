- name: x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: X-axis projection of the unit vector that encodes the instantaneous
    movement direction of the steerable electron cyclotron (EC) launcher mirror in
    the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.
  documentation: 'The EC launcher mirror movement direction is fully specified by
    the unit vector $\hat{d} = (d_x, d_y, d_z)$, where $d_x$ is this quantity. Because
    $\hat{d}$ is a unit vector by construction, the three Cartesian components satisfy
    $d_x^2 + d_y^2 + d_z^2 = 1$, so $d_x \in [-1, 1]$. The mirror direction vector
    describes how the reflective surface tilts or rotates to steer the injected high-power
    microwave beam toward the desired deposition location inside the plasma; the $\hat{x}$
    component captures the projection of that motion onto the machine Cartesian $x$-axis.
    In practice, $d_x$ is either set by a geometric model of the launcher mechanism
    or read directly from mirror position encoders, and it enters beam-tracing and
    ray-tracing codes that compute the electron cyclotron resonance heating (ECRH)
    or electron cyclotron current drive (ECCD) power deposition profile. Together
    with the companion components [y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror),
    it reconstructs the full [direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:direction_unit_vector_of_electron_cyclotron_launcher_mirror).
    The orientation frame of the mirror itself is separately described by the local
    unit-vector triad, whose x-projections include [x_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror](name:x_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror).


    Sign convention: Positive when the mirror movement direction has a component in
    the $+\hat{x}$ direction of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  - name:z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  - name:direction_unit_vector_of_electron_cyclotron_launcher_mirror
  - name:x_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror
  constraints: []
