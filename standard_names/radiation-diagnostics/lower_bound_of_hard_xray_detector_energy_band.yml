name: lower_bound_of_hard_xray_detector_energy_band
description: Lower energy threshold of hard X-ray detector sensitive energy band.
documentation: |-
  Lower energy boundary of the hard X-ray detector's sensitive energy band. Hard X-rays typically span ~20-500 keV photon energies, corresponding to runaway electron bremsstrahlung and high-energy plasma emission. The energy band is determined by detector material properties (e.g., CdTe, NaI, BGO), collimator geometry, and photon absorption characteristics.

  Physical significance: The lower bound defines the minimum photon energy to which the detector responds. This parameter is critical for tomographic reconstruction of [hard_xray_emissivity](#hard_xray_emissivity) profiles and separation of different radiation contributions. Multiple energy bands allow spectral analysis for [runaway_electron](#runaway_electron) studies and plasma temperature diagnostics.

  Measurement methods: Energy discrimination is achieved through detector material selection, pulse height analysis, and electronic thresholding. Calibration uses known gamma sources (e.g., $^{137}$Cs, $^{60}$Co) covering the hard X-ray range. The lower bound depends on detector efficiency curve and noise threshold.

  Typical values: 20-100 keV for general hard X-ray tomography. 50-200 keV for runaway electron studies. Lower bounds are chosen to reject soft X-ray contributions while capturing the emission of interest.

  Sign convention: Positive energy value representing photon energy threshold.
status: draft
