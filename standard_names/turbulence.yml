      description: "Normalised collisionality (\u03BD*) between pairs of particle\
        \ species in a local gyrokinetic simulation. Represents the ratio of the inter-species\
        \ collision frequency to a characteristic transit frequency, governing collisional\
        \ coupling and neoclassical effects."
      kind: llm
- name: normalized_debye_length
  kind: scalar
  status: active
  description: Dimensionless ratio of the multispecies Debye shielding length to the
    positive reference length used by the gyrokinetic formulation.
  documentation: 'The multispecies Debye shielding length is the electrostatic screening
    scale produced by the combined response of all charged species. This quantity
    expresses that scale relative to the positive reference length selected for the
    gyrokinetic formulation.


    $$

    \lambda_{D,\mathrm{norm}} = \frac{1}{L_{\mathrm{ref}}}\left(\sum_s \frac{n_s q_s^2}{\epsilon_0
    k_B T_s}\right)^{-1/2}

    $$


    where $n_s$ is the number density of species $s$, $q_s$ is its particle charge,
    $T_s$ is its thermodynamic temperature, $k_B$ is Boltzmann''s constant, $\epsilon_0$
    is the vacuum permittivity, and $L_{\mathrm{ref}}$ is the gyrokinetic reference
    length. The sum includes the charged species contributing to quasistatic Debye
    shielding and excludes neutral populations. The underlying shielding length also
    enters the [Coulomb logarithm](name:coulomb_logarithm); this normalized quantity
    is not a species-specific screening length.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:coulomb_logarithm
  sources:
  - dd_path: gyrokinetics_local/species_all/debye_length_norm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-species_all-debye_length_norm
    dd_documentation:
