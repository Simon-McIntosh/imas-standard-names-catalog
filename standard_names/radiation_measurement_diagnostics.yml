- name: incident_soft_xray_radiance
  kind: scalar
  status: active
  description: Incident soft X-ray power radiance gives received electromagnetic power
    per projected detector area and solid angle, integrated over the selected energy
    band.
  documentation: 'Incident soft-X-ray power radiance is the energy-integrated radiant
    power arriving at a receiving surface from the viewing direction, expressed per
    projected area and per solid angle.


    $$

    L_{\rm inc} = \int_{\mathcal{E}} L_E^{\rm inc}\,dE = \frac{dP_{\rm inc}}{dA_\perp\,d\Omega}

    $$


    where $L_{\rm inc}$ is the incident power radiance, $L_E^{\rm inc}$ is the incident
    spectral power radiance at photon energy $E$, $\mathcal{E}$ is the selected photon-energy
    band or collection of bands, $P_{\rm inc}$ is incident radiant power, $A_\perp$
    is projected receiving area, and $\Omega$ is accepted solid angle.


    The quantity applies to soft X-ray radiation incident on a detector channel, with
    spectral dependence integrated over the selected energy band or bands. It is an
    incoming radiometric quantity per area and solid angle, not a total power integrated
    over the detector aperture or viewing directions, and it is distinct from detector-registration
    efficiency.


    Integrating this radiance over the relevant projected area and solid angle gives
    the band-integrated received power represented by [power of soft X-ray detector](name:power_of_soft_xray_detector).
    Unlike [hard X-ray brightness](name:hard_xray_brightness), which is photon-number
    radiance, this quantity is power radiance; [spectral efficiency of soft X-ray
    detector](name:spectral_efficiency_of_soft_xray_detector) instead describes the
    probability that incident photons are registered.'
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_of_soft_xray_detector
  - name:hard_xray_brightness
  sources:
  - kind: imas-dd
    ref: soft_x_rays/channel/brightness
    version: 4.1.0
- name: lower_bound_photon_energy
  kind: scalar
  status: active
  description: Lower boundary of an X-ray photon-energy band, specifying the minimum
    photon energy included in the defined detection or emission band.
  documentation: 'Lower boundary of an X-ray photon-energy band is the minimum photon
    energy included in the specified detection or emission band. It defines the low-energy
    cutoff of that band.


    The photon-energy band defined by this lower boundary and its complementary upper
    boundary satisfies:


    $$

    E_\mathrm{low} \le E \le E_\mathrm{up}

    $$


    where $E_\mathrm{low}$ is the lower-bound photon energy, $E$ is the photon energy
    being classified, and $E_\mathrm{up}$ is the [upper photon energy](name:upper_photon_energy).


    The scope is an X-ray spectral band for photon detection, photon counting, or
    energy-resolved emissivity. This quantity is a band boundary, not an observed
    photon energy, photon-energy width, photon flux, count rate, emissivity, or detector-response
    amplitude; it is a single boundary for one specified band and implies no averaging
    or summation over photons.


    Together with the [upper photon energy](name:upper_photon_energy), it specifies
    the spectral interval of the band. The lower boundary must not exceed the upper
    boundary, and any derived band width is their difference.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: camera_x_rays/energy_threshold_lower
    version: 4.1.0
  - kind: imas-dd
    ref: hard_x_rays/channel/energy_band/lower_bound
    version: 4.1.0
  - kind: imas-dd
    ref: hard_x_rays/emissivity_profile_1d/lower_bound
    version: 4.1.0
  - kind: imas-dd
    ref: soft_x_rays/channel/energy_band/lower_bound
    version: 4.1.0
- name: photon_radiance_at_spectral_line
  kind: scalar
  status: active
  description: Photon-count radiance from an identified emission transition, integrated
    over its spectral line interval and resolved by projected area and viewing solid
    angle.
  documentation: 'Photon-count line radiance is the photon emission rate from one
    identified transition accumulated along the emitting line of sight, resolved by
    projected collecting area and viewing solid angle.


    The defining photon-count radiance is


    $$

    L_{\gamma,\ell} = \frac{d^3 N_{\gamma,\ell}}{dt\,dA_{\perp}\,d\Omega}

    $$


    where $L_{\gamma,\ell}$ is the line radiance, $N_{\gamma,\ell}$ is the number
    of photons from transition $\ell$, $\ell$ identifies the emission transition,
    $t$ is time, $A_{\perp}$ is collecting area projected normal to the viewing direction,
    and $\Omega$ is viewing solid angle.


    The quantity applies to one identified emission transition without imposing a
    particular emitting species, charge state, or line-splitting mechanism. Photon
    counts are integrated across the selected spectral-line interval and accumulated
    along the viewing path; the result is not resolved per wavelength.


    Integrating [photon-number spectral radiance](name:spectral_radiance) over wavelength
    across the selected line interval gives this line radiance under matching projected-area
    and solid-angle conventions. The qualified [motional-Stark photon radiance at
    a spectral line](name:motional_stark_photon_radiance_at_spectral_line) is a specialized
    instance restricted to an identified motional-Stark-split component. Unlike energy
    radiance, this quantity counts photons without weighting them by photon energy;
    conversion to energy radiance requires applying that energy weighting before integration.'
  unit: m^-2.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_radiance
  sources:
  - kind: imas-dd
    ref: spectrometer_uv/channel/processed_line/radiance
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_visible/channel/grating_spectrometer/processed_line/radiance
    version: 4.1.0
- name: power_of_soft_xray_detector
  kind: scalar
  status: active
  description: Band-integrated radiant power received by a soft X-ray detector channel
    over its selected photon-energy band or bands.
  documentation: "Soft X-ray detector power is the radiant power carried by incident\
    \ soft X-ray photons and received by one detector channel after spectral selection.\
    \ It represents radiation power rather than the detector\u2019s electrical output.\n\
    \nFor a selected photon-energy band, the received power is defined by:\n\n$$\n\
    P_{\\mathcal{B}} = \\int_{\\mathcal{B}} E\\,\\Phi_E(E)\\,dE\n$$\n\nwhere $P_{\\\
    mathcal{B}}$ is the received power for band $\\mathcal{B}$, $E$ is photon energy,\
    \ $\\Phi_E(E)$ is the photon arrival-rate density as a function of photon energy,\
    \ $\\mathcal{B}$ is the selected energy interval, and $dE$ is an infinitesimal\
    \ photon-energy interval.\n\nThe quantity applies to soft X-ray radiation received\
    \ by a particular detector channel and is integrated over photon energy within\
    \ its selected bandpass. It is not summed over detector channels, viewing directions,\
    \ or distinct energy bands; when multiple bands are resolved, each band has its\
    \ own band-integrated received-power value. It excludes plasma-emitted power before\
    \ arrival at the detector and electrical power generated by detector electronics.\n\
    \nThe quantity is distinct from [spectral_efficiency_of_soft_xray_detector](name:spectral_efficiency_of_soft_xray_detector),\
    \ which describes the probability of registering an incident photon rather than\
    \ the received radiant power. It is also distinct from [hard_xray_brightness](name:hard_xray_brightness),\
    \ which describes photon radiance rather than the power collected by a channel\
    \ over its energy band and collection geometry."
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  sources:
  - kind: imas-dd
    ref: soft_x_rays/channel/power
    version: 4.1.0
- name: radial_coordinate_of_camera
  kind: scalar
  status: active
  description: "Major-radius location of a camera\u2019s geometric center, measured\
    \ from the toroidal symmetry axis in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The radial coordinate of a camera is the major-radius position of
    its geometric center, measured perpendicular to the toroidal symmetry axis. It
    identifies the camera center rather than any individual detector pixel, aperture,
    or line-of-sight point.


    The coordinate is defined from the Cartesian coordinates of the camera center:


    $$

    R_{\mathrm{cam}} = \sqrt{x_{\mathrm{cam}}^2 + y_{\mathrm{cam}}^2}

    $$


    where $R_{\mathrm{cam}}$ is the camera-center radial coordinate, and $x_{\mathrm{cam}}$
    and $y_{\mathrm{cam}}$ are the camera-center coordinates in the right-handed Cartesian
    $(\hat{x},\hat{y},\hat{z})$ basis. The corresponding cylindrical frame is the
    right-handed $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    This quantity applies to the geometric center of the camera as a whole and is
    not an average over pixels, viewing directions, or detector elements. It is the
    camera-specific specialization of the parent [radial coordinate](name:radial_coordinate).
    Together with the [vertical coordinate of the camera](name:vertical_coordinate_of_camera)
    and [toroidal coordinate of the camera](name:toroidal_coordinate_of_camera), it
    specifies the camera-center position.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_camera
  - name:toroidal_coordinate_of_camera
  sources:
  - kind: imas-dd
    ref: camera_x_rays/camera/centre/r
    version: 4.1.0
- name: radial_coordinate_of_detector_pixel
  kind: scalar
  status: active
  description: "Major-radius coordinate of a detector pixel\u2019s geometric center,\
    \ locating the pixel relative to the machine symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the major-radius coordinate of the geometric center\
    \ of an individual detector pixel. It identifies the pixel center\u2019s perpendicular\
    \ distance from the toroidal symmetry axis in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame.\n\nUsing the corresponding right-handed Cartesian basis $(x,\
    \ y, z)$, with the symmetry axis at $x=y=0$, the coordinate is defined by\n\n\
    $$\nR_{\\mathrm{pix}} = \\sqrt{x_{\\mathrm{pix}}^2+y_{\\mathrm{pix}}^2}\n$$\n\n\
    where $R_{\\mathrm{pix}}$ is the pixel-center major-radius coordinate, and $x_{\\\
    mathrm{pix}}$ and $y_{\\mathrm{pix}}$ are the Cartesian coordinates of that center\
    \ perpendicular to the symmetry axis.\n\nThe quantity applies to each detector-pixel\
    \ center individually; it is not an average over pixels, a radiation-weighted\
    \ position, or the radial coordinate of the camera as a whole. It is the detector-pixel\
    \ specialization of the [radial coordinate](name:radial_coordinate), while the\
    \ corresponding vertical location is given by the [vertical coordinate of detector\
    \ pixel](name:vertical_coordinate_of_detector_pixel)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_detector_pixel
  sources:
  - kind: imas-dd
    ref: camera_x_rays/camera/pixel_position/r
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_x_ray_crystal/channel/camera/pixel_position/r
    version: 4.1.0
- name: radial_coordinate_of_line_of_sight
  kind: scalar
  status: active
  description: "Major-radius coordinate of a specified geometric point associated\
    \ with a line of sight, measured from the toroidal symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the major-radius coordinate of a specified geometric
    point associated with a line of sight. It locates that point by its perpendicular
    distance from the toroidal symmetry axis in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    $$

    R_{\mathrm{los}} = \sqrt{x_{\mathrm{los}}^2+y_{\mathrm{los}}^2}

    $$


    where $R_{\mathrm{los}}$ is the radial coordinate of the specified line-of-sight
    point, and $x_{\mathrm{los}}$ and $y_{\mathrm{los}}$ are the horizontal Cartesian
    coordinate values of that point in the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$
    basis, whose origin lies on the toroidal symmetry axis.


    The quantity is geometric and pointwise: it applies to a designated point associated
    with a line of sight and has no plasma-population or regional aggregation. A line
    of sight can contain multiple such points, so this name alone does not select
    a first point, second point, third point, endpoint, line-integrated radius, or
    averaged radius.


    It is a locus-specific instance of the general [radial coordinate](name:radial_coordinate)
    quantity, with the line of sight identifying the associated geometric locus rather
    than defining a new radial-coordinate concept.'
  unit: m
