    dd_path: plasma_profiles/profiles_1d/neutral/state/density_fast
    status: attached
- name: fast_particle_energy
  kind: scalar
  status: draft
  description: Total kinetic energy of the fast (suprathermal) particle population
    integrated over the plasma volume.
  documentation: "Fast particle energy quantifies the global energetic inventory stored\
    \ in particles with velocities substantially exceeding the bulk thermal speed.\
    \ These suprathermal particles arise from external heating systems including neutral\
    \ beam injection, ion cyclotron resonance heating, and electron cyclotron heating,\
    \ as well as from fusion-born alpha particles.\n\nThe quantity is defined as the\
    \ volume integral of the kinetic energy density over the non-thermal distribution:\n\
    \n$$\nW_\\text{fast} = \\int \\int \\frac{1}{2} m v^2 \\, f_\\text{fast}(\\mathbf{r},\
    \ \\mathbf{v}) \\, d^3v \\, d^3r\n$$\n\nwhere $f_\\text{fast}(\\mathbf{r}, \\\
    mathbf{v})$ is the fast-particle distribution function in phase space, $m$ is\
    \ the particle mass, and $v$ is the particle speed. This total decomposes additively\
    \ into [parallel_fast_particle_energy](name:parallel_fast_particle_energy) and\
    \ [perpendicular_fast_particle_energy](name:perpendicular_fast_particle_energy)\
    \ relative to the local magnetic field direction.\n\nEstimated through integrated\
    \ fast-ion diagnostics such as fast-ion loss detectors, neutron emission spectroscopy,\
    \ or neutral particle analyzers, often combined with global energy balance comparisons.\
    \ Orbit-following Monte Carlo transport codes evaluate this integral numerically\
    \ from the modeled fast-particle distribution function.\n\nTypical values range\
    \ from 0.1\u20135 MJ in medium-scale tokamaks during high-power NBI or ICRH operation,\
    \ reaching 10\u201350 MJ in larger devices. The accumulated fast particle energy\
    \ constitutes a significant fraction of [total_particle_energy](name:total_particle_energy)\
    \ in high-power heating scenarios, and is bounded by slowing-down and thermalization\
    \ rates, with the corresponding particle count tracked by [fast_count](name:fast_count)."
  unit: J
  physics_domain: transport
  links:
  - name:parallel_fast_particle_energy
  sources:
  - id: dd:distributions/distribution/global_quantities/energy_fast
    dd_path: distributions/distribution/global_quantities/energy_fast
    status: composed
