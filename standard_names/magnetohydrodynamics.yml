- name: runaway_electron_decay_time_due_to_disruption
  kind: scalar
  status: active
  description: Characteristic decay time for the disruption-driven decrease of the
    runaway-electron current. It abstracts over the convention used to assign a time
    scale, such as an exponential e-folding time or a fractional-level linear decay
    time.
  documentation: 'Runaway-electron decay time due to disruption is the characteristic
    time scale associated with the decrease of the runaway-electron current during
    a disruption. It fixes the decaying quantity as the runaway-electron current while
    leaving the specific decay-time convention to the more specialized quantity.


    This parent quantity includes decay times defined from different idealizations
    of the same current decrease, such as an exponential e-folding time or the fractional-level
    convention used by the [linear runaway-electron decay time due to disruption](name:linear_runaway_electron_decay_time_due_to_disruption).
    It is not a decay time for total plasma current, thermal current, or an unspecified
    plasma quantity.'
