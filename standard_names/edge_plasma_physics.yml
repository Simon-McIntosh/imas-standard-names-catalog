- name: flux_surface_averaged_deuterium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of deuterium ions at the plasma
    boundary (separatrix), the last closed flux surface dividing the confined plasma
    from the open-field-line scrape-off layer.
  documentation: "The flux-surface-averaged deuterium density at the plasma boundary\
    \ is the poloidal average of the local deuterium ion (D$^+$, $Z=1$, $A=2$) number\
    \ density over the last closed flux surface (separatrix), which separates the\
    \ magnetically confined plasma from the open-field-line scrape-off layer. This\
    \ single scalar removes poloidal asymmetries driven by Pfirsch\u2013Schl\xFCter\
    \ flows, divertor geometry, and ballooning effects, making it the standard outer\
    \ boundary condition for radial particle transport models of the confined plasma.\n\
    \nThe flux-surface average is defined as\n\n$$\n\\langle n_D \\rangle = \\frac{\\\
    oint n_D \\, \\frac{dl}{B_p}}{\\oint \\frac{dl}{B_p}}\n$$\n\nwhere $n_D$ is the\
    \ local deuterium ion number density, $l$ is the poloidal arc length along the\
    \ separatrix, and $B_p$ is the local poloidal magnetic field magnitude.\n\nThis\
    \ averaged density is inferred by combining local density measurements from Thomson\
    \ scattering or charge exchange recombination spectroscopy at multiple poloidal\
    \ locations with the separatrix geometry from equilibrium reconstruction; the\
    \ non-averaged local counterpart is [deuterium_density_at_plasma_boundary](name:deuterium_density_at_plasma_boundary).\
    \ Typical values in H-mode discharges lie in the range $0.5$\u2013$5 \\times 10^{19}$\
    \ m$^{-3}$, scaling with line-averaged density and pedestal collisionality. The\
    \ equivalent quantity for tritium fuel ions is [flux_surface_averaged_tritium_density_at_plasma_boundary](name:flux_surface_averaged_tritium_density_at_plasma_boundary);\
    \ for neon impurities see [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary).\n\
    \nSign convention: Positive for all physical states containing deuterium; this\
    \ quantity is invariant under reversal of toroidal field direction or plasma current\
    \ direction, unlike signed electromagnetic quantities such as current density\
    \ or loop voltage."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_density_at_plasma_boundary
  - name:flux_surface_averaged_tritium_density_at_plasma_boundary
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  arguments:
  - name: deuterium_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/deuterium/value
    dd_path: summary/local/separatrix_average/n_i/deuterium/value
