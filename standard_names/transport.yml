    status: composed
- name: toroidal_component_of_counter_passing_fast_ion_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the current density carried by counter-passing
    fast (non-thermal) ions, defined as the projection of the fast-ion current density
    vector onto the toroidal unit vector phi-hat, integrated over counter-passing
    orbits only, and excluding electron and thermal ion back-currents or drag-currents.
  documentation: "The toroidal component of the counter-passing fast-ion current density\
    \ is the $\\hat{\\phi}$-projection of the current density contributed solely by\
    \ fast (non-thermal) ions whose guiding-center parallel velocity satisfies $v_\\\
    parallel < 0$ (i.e., moving opposite to the direction of increasing toroidal angle\
    \ $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame). Formally,\n\n\
    $$J_{\\phi,\\mathrm{fast,ctr}} = \\int_{v_\\parallel < 0} q_s\\, v_\\phi\\, f_s(\\\
    mathbf{v})\\, d^3v,$$\n\nwhere $f_s$ is the fast-ion distribution function, $q_s$\
    \ is the ion charge, and $v_\\phi = v_\\parallel b_\\phi + v_\\perp \\hat{e}_{\\\
    perp,\\phi}$ with $b_\\phi$ the toroidal component of the unit vector along the\
    \ magnetic field. The back-current (return current) of electrons and thermal ions\
    \ responding to the fast-ion drive is explicitly excluded; only the direct fast-ion\
    \ contribution is counted.\n\nSign convention: Positive when the net counter-passing\
    \ fast-ion current flows in the direction of increasing toroidal angle $\\phi$\
    \ (the $+\\hat{\\phi}$ direction in the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame).\n\nFor typical tokamak neutral-beam injection driven counter-current,\
    \ $J_{\\phi,\\mathrm{fast,ctr}}$ is negative (fast ions carry net current opposite\
    \ to $+\\hat{\\phi}$), with magnitudes in the range $10^3$\u2013$10^6$ A m$^{-2}$\
    \ depending on injected power and plasma density. The quantity is local in the\
    \ poloidal cross-section and is a function of $(R, Z)$ or an equivalent flux-surface\
    \ coordinate. It is used in current-drive analysis to decompose the total fast-ion\
    \ driven current into co- and counter-passing contributions, enabling assessment\
    \ of current profile modification and intrinsic rotation drive."
  unit: A.m^-2
  physics_domain: transport
