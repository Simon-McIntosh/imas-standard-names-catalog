- name: per_toroidal_mode_thermal_electron_power_density
  kind: scalar
  status: draft
  description: Power per unit volume absorbed from a coherent wave by the bulk thermal
    electron population, resolved by toroidal mode number. It can represent either
    a local value or a magnetic-surface-averaged value, with the same volumetric normalization.
  documentation: 'Per-toroidal-mode thermal electron power density is the coherent-wave
    power absorbed per unit physical volume by the bulk thermal electron population
    in a single toroidal harmonic. It may be evaluated as a local volumetric density
    or as a magnetic-surface-averaged volumetric density; in both cases the quantity
    represents power density, not total power.


    For toroidal mode number $n$, the volumetric definition and the corresponding
    enclosed power are:


    $$

    p_{e,n}(\mathbf{x}) = \frac{dP_{e,n}}{dV}(\mathbf{x}), \qquad P_{e,n}(V) = \int_V
    p_{e,n}(\mathbf{x})\, dV

    $$


    where $p_{e,n}$ is this power density in W m$^{-3}$, $P_{e,n}$ is the power in
    W deposited into thermal electrons by mode number $n$, $V$ is a physical volume,
    $\mathbf{x}$ denotes position, and $dV$ is the volume element. Summing over all
    represented toroidal mode numbers gives the total thermal-electron absorbed power
    density, $p_e = \sum_n p_{e,n}$, and integration over an enclosed volume gives
    the corresponding [per_toroidal_mode_thermal_electron_power](name:per_toroidal_mode_thermal_electron_power).


    In practice this quantity is computed from wave-field solutions or wave energy-balance
    models by partitioning absorbed power by receiving species and by toroidal harmonic.
    It is usually constrained indirectly through electron-temperature evolution, stored-energy
    changes, and consistency with the launched coherent-wave power rather than measured
    as a pointwise observable.


    Typical per-mode values span about 10$^2$-10$^7$ W m$^{-3}$, depending on launched
    power, absorption localization, plasma density and temperature, and the number
    of toroidal modes carrying the wave power. Magnetic-surface-averaged values are
    generally lower than peak local values when absorption is spatially localized.


    Sign convention: Positive when net coherent-wave energy is deposited into the
    bulk thermal electron population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
