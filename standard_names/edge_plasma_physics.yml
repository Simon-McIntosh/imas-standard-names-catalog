- name: flux_surface_averaged_neon_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of neon ions at the plasma boundary
    (separatrix), summed over all ionization stages from Ne+ through fully stripped
    Ne10+.
  documentation: 'The flux-surface-averaged neon density at the plasma boundary is
    the poloidal-flux-surface average of the neon ion number density, encompassing
    all charge states from Ne+ through fully stripped Ne10+, evaluated on the last
    closed flux surface that separates the magnetically confined plasma from the open-field-line
    scrape-off layer. It provides a single representative scalar characterizing the
    neon impurity content at the plasma edge, suppressing poloidal asymmetries that
    arise from localized recycling, divertor pumping, or asymmetric gas puffing.


    The flux-surface average is defined as


    $$

    \langle n_\mathrm{Ne} \rangle_\mathrm{FS} = \frac{\oint n_\mathrm{Ne}(\ell)\,
    d\ell / B_p}{\oint d\ell / B_p}

    $$


    where $n_\mathrm{Ne}$ is the local neon number density summed over all charge
    states, $\ell$ is the arc length along the separatrix contour, and $B_p$ is the
    local poloidal magnetic field magnitude.


    This quantity is the flux-surface-averaged variant of [neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary);
    the two differ in that the parent retains the full poloidal dependence while this
    quantity condenses it to a single scalar. Structurally parallel quantities at
    the same locus exist for other impurity and fuel species, including [flux_surface_averaged_nitrogen_density_at_plasma_boundary](name:flux_surface_averaged_nitrogen_density_at_plasma_boundary),
    [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary),
    and [flux_surface_averaged_helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary).
    Neon is widely deployed as a radiative seed impurity for boundary power exhaust
    management, and the separatrix-averaged density is a key input to edge transport
    models and empirical scaling studies. It is inferred from VUV or charge-exchange
    spectroscopy combined with boundary plasma modeling.


    Sign convention: Positive for non-zero neon impurity concentration at the plasma
    boundary.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_nitrogen_density_at_plasma_boundary
  - name:flux_surface_averaged_deuterium_density_at_plasma_boundary
  - name:flux_surface_averaged_helium_4_density_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/n_i/neon/value
