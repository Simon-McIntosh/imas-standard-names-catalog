      kind: llm
- name: helium_3_density
  kind: scalar
  status: active
  description: Local number density of charged helium-3 ions, obtained by summing
    their populations over all included ionization states at a plasma location.
  documentation: 'Helium-3 ion number density is the local count of charged helium-3
    ions per unit plasma volume at a specified plasma location. It is summed over
    the singly ionized and fully stripped charge states and excludes neutral helium-3
    atoms.


    $$

    n_{{}^{3}\mathrm{He}}(\mathbf{x}) = \sum_{Z=1}^{2} n_{{}^{3}\mathrm{He},Z}(\mathbf{x})

    $$


    where $\mathbf{x}$ is the plasma location, $Z$ is the ionic charge state, and
    $n_{{}^{3}\mathrm{He},Z}$ is the number density of helium-3 ions in charge state
    $Z$, expressed in m$^{-3}$. The [volume-averaged helium-3 density](name:volume_averaged_helium_3_density)
    and [line-averaged helium-3 density](name:line_averaged_helium_3_density) are
    spatial averages of this local quantity over their respective domains.


    Sign convention: Positive when the counted charged helium-3 ion population contributes
    positively to the number-density measure.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_helium_3_density
  - name:line_averaged_helium_3_density
- name: helium_4_density
  kind: scalar
  status: active
  description: Local number density of helium-4 ions per unit plasma volume, the principal
    measure of fusion ash concentration in deuterium-tritium burning plasmas.
  documentation: "The helium-4 ion number density $n_{{}^4\\text{He}}$ quantifies\
    \ the local concentration of ${}^4\\text{He}$ nuclei at a given point in the plasma.\
    \ At fusion-relevant temperatures (several keV), helium-4 is fully stripped to\
    \ He$^{2+}$, and in deuterium-tritium burning plasmas it accumulates as the primary\
    \ fusion ash product of the reaction ${}^2\\text{H} + {}^3\\text{H} \\rightarrow\
    \ {}^4\\text{He} + n$; its buildup dilutes the fuel and reduces the fusion reaction\
    \ rate if not exhausted by the divertor system.\n\nThe time evolution of $n_{{}^4\\\
    text{He}}$ is governed by the particle continuity equation\n\n$$\n\\frac{\\partial\
    \ n_{{}^4\\text{He}}}{\\partial t} + \\nabla \\cdot \\boldsymbol{\\Gamma}_{{}^4\\\
    text{He}} = S_{{}^4\\text{He}}\n$$\n\nwhere $\\boldsymbol{\\Gamma}_{{}^4\\text{He}}$\
    \ is the helium-4 particle flux and $S_{{}^4\\text{He}}$ is the volumetric source\
    \ rate from fusion reactions and ionization of recycled helium neutrals at the\
    \ plasma edge.\n\nThe helium-4 density is measured primarily via charge exchange\
    \ recombination spectroscopy, where injected neutral beam atoms undergo charge\
    \ exchange with He$^{2+}$ ions to produce line emission from excited helium atoms;\
    \ passive spectroscopy of edge recycling emission provides a complementary approach.\
    \ Chord-averaged and volume-averaged forms are provided by [line_averaged_helium_4_density](name:line_averaged_helium_4_density)\
    \ and [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density)\
    \ respectively, while [helium_4_density_at_plasma_boundary](name:flux_surface_averaged_helium_4_density_at_plasma_boundary)\
    \ gives the boundary value.\n\nIn D-T burning plasmas, central He-4 densities\
    \ are in the range $10^{18}$-$10^{19}$ m$^{-3}$, with the helium-to-electron density\
    \ ratio \u2014 captured by [fraction](name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density)\
    \ \u2014 kept below approximately 5-10% in steady state to avoid excessive fuel\
    \ dilution."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_helium_4_density
  - name:volume_averaged_helium_4_density
  - name:flux_surface_averaged_helium_4_density_at_plasma_boundary
  - name:ratio_of_volume_averaged_helium_4_density_to_volume_averaged_electron_density
- name: ion_current
  kind: scalar
  status: active
  description: Electric current carried by positive ions, representing the net charge
    transport attributable to ion species flow across a defined surface or through
    a circuit element.
  documentation: 'Ion current is the net charge transport rate due to positive ions.
    For a multi-species plasma the ion current through a surface $S$ is


    $$

    I_i = \sum_s Z_s e \int_S n_s \mathbf{v}_s \cdot d\mathbf{A}

    $$


    where $Z_s$ is the charge number of species $s$, $e$ is the elementary charge,
    $n_s$ is the number density, and $\mathbf{v}_s$ is the mean drift velocity of
    species $s$. In probe diagnostics, progressively increasing the negative bias
    on a collector reduces the electron current until only the ion contribution remains;
    this limiting value is the [saturated_ion_current](name:saturated_ion_current),
    reached when electron collection is fully suppressed.


    Sign convention: Positive when positive ions flow from the plasma toward the collecting
    surface, constituting conventional current in the direction of ion transport.'
  unit: A
  physics_domain: particle_measurement_diagnostics
  links:
  - name:saturated_ion_current
- name: ion_current_of_mass_spectrometer_channel
  kind: scalar
  status: active
  description: Ion current of a mass spectrometer channel is the signed electrical
    current attributable to ions within the acceptance of one mass-discriminated channel,
    with magnitude set by the charge and arrival rate of those ions.
  documentation: 'Ion current of a mass spectrometer channel is the electrical current
    carried by ions whose mass-to-charge ratio lies within that channel''s acceptance.
    The channel acceptance defines which ions contribute; unresolved ion species or
    charge states admitted by the same channel contribute together according to their
    charge arrival rates.


    The defining charge-rate relation is:


    $$

    I_{\mathrm{ion},\mathrm{ch}} = \sum_{s \in \mathcal{S}_{\mathrm{ch}}} q_s \, \dot{N}_s

    $$


    where $I_{\mathrm{ion},\mathrm{ch}}$ is the ion current of the channel, $\mathcal{S}_{\mathrm{ch}}$
    is the set of ion species or charge states admitted by the channel, $q_s$ is the
    electric charge of ion type $s$, and $\dot{N}_s$ is its collection rate at the
    channel detector.


    This quantity excludes neutral pressure or partial-pressure quantities derived
    from spectrometer sensitivity factors and excludes detector offset, dark current,
    leakage current, and displacement current. For positive-ion collection, [current_of_mass_spectrometer_channel](name:current_of_mass_spectrometer_channel)
    denotes the corresponding channel current without separating the ion carrier explicitly;
    it is not a total of ion and non-ion residual currents.


    Sign convention: Positive when positive ion charge admitted by the channel is
    collected at the channel detector.'
  unit: A
  physics_domain: particle_measurement_diagnostics
  links:
  - name:current_of_mass_spectrometer_channel
  arguments:
  - name: current_of_mass_spectrometer_channel
    operator: ion
    operator_kind: qualifier
  sources:
  - dd_path: spectrometer_mass/channel/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_mass.html#spectrometer_mass-channel-current
    dd_documentation:
      leaf: Collected current
      parent_path: spectrometer_mass/channel
      parent: Set of mass channels, each corresponding to a given atomic mass measured
        continuously by the spectrometer
      data_type: FLT_1D
      unit: A
      coordinates:
