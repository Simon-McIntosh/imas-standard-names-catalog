- name: poloidal_magnetic_flux_of_separatrix
  kind: scalar
  status: draft
  description: Poloidal magnetic flux per radian of toroidal angle evaluated at the
    outermost closed flux surface.
  documentation: "The poloidal magnetic flux $\\psi_{\\rm sep}$ defines the value\
    \ of the poloidal flux function $\u03C8(R,Z)$ on the separatrix, the last closed\
    \ flux surface that separates the confined plasma from the scrape-off layer. In\
    \ equilibrium reconstruction, $\u03C8$ satisfies the Grad-Shafranov equation $\u0394\
    ^*\\psi = -\u03BC_0 R^2 p'(\\psi) - FF'(\\psi)$, where $p$ is the plasma pressure\
    \ and $F = RB_\\phi$ is the poloidal current function. The separatrix flux $\u03C8\
    _{\\rm sep}$ together with the axis flux $\u03C8_{\\rm axis}$ defines the normalized\
    \ poloidal flux coordinate $\\psi_N = (\\psi - \\psi_{\\rm axis})/(\\psi_{\\rm\
    \ sep} - \\psi_{\\rm axis})$ used as a radial coordinate in transport and stability\
    \ analyzes. Typical values in a medium-size tokamak range from $-1$ to $-3$ Wb\
    \ for standard divertor configurations. See also [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ and [poloidal_magnetic_flux_at_plasma_boundary](name:poloidal_magnetic_flux_at_plasma_boundary).\n\
    \nSign convention: Positive when $\u03C8$ increases from the magnetic axis to\
    \ the plasma boundary for a positive plasma current $I_p$ directed in the $+\\\
    phi$ direction.\n\nIn the standard IMAS $(R, \\phi, Z)$ cylindrical frame this\
    \ corresponds to $\u03C8$ decreasing from axis to boundary under the same $I_p$\
    \ convention. The value at the separatrix provides the outer normalization for\
    \ flux-surface labels and defines the plasma volume accessible to core confinement\
    \ codes."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/position/psi
    dd_path: summary/local/separatrix/position/psi
    status: composed
  - id: dd:summary/local/separatrix_average/position/psi
    dd_path: summary/local/separatrix_average/position/psi
    status: composed
- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: Radial ($R$) component of the magnetic field vector in the right-handed
    cylindrical frame.
  documentation: "The radial component $B_R = \\mathbf{B} \\cdot \\hat{R}$ is the\
    \ projection of the total magnetic field onto the direction of increasing major\
    \ radius $R$ in the right-handed cylindrical $(R, \\phi, Z)$ system. In a tokamak,\
    \ $B_R$ is typically much smaller than the toroidal component $[\\text{toroidal\\\
    _magnetic\\_field}](name:toroidal\\_magnetic\\_field)$ but is essential for describing\
    \ poloidal field structure, equilibrium shaping, and non-axisymmetric perturbations.\
    \ It arises from the poloidal field coils and plasma current, and its radial variation\
    \ determines the field-line pitch and magnetic shear. Typical values in the core\
    \ are of order 0.01\u20130.1 T for conventional tokamaks, rising to 0.5\u2013\
    1 T near the plasma boundary or in high-beta plasmas. $B_R$ is measured by Hall\
    \ probes or inferred from equilibrium reconstruction codes that solve the Grad\u2013\
    Shafranov equation. For non-axisymmetric components, see $[\\text{radial\\_non\\\
    _axisymmetric\\_magnetic\\_field}](name:radial\\_non\\_axisymmetric\\_magnetic\\\
    _field)$.\n\nSign convention: Positive when $B_R$ points in the direction of increasing\
    \ major radius $R$ (outward from the machine symmetry axis)."
  unit: T
  physics_domain: equilibrium
  links:
