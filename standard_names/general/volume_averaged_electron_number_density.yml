name: volume_averaged_electron_number_density
status: draft
cocos_transformation_type: one_like
description: Electron number density averaged over the total plasma volume, representing
  the global fueling state of the discharge.
documentation: The volume-averaged electron density $\langle n_e \rangle_V = V_p^{-1}\int
  n_e\,dV$ integrates the electron density profile over the plasma volume $V_p$ (in
  $\mathrm{m^3}$). It is a primary figure of merit for density control, fueling efficiency,
  and confinement scaling laws (e.g., the Greenwald density limit $\bar{n}_{\rm GW}
  = I_p / (\pi a^2)$ in units of $10^{20}\;\mathrm{m^{-3}}$). Typical values range
  from $1 \times 10^{19}$ to $1.5 \times 10^{20}\;\mathrm{m^{-3}}$ across present
  devices. The quantity is computed from fitted $n_e$ profiles (Thomson scattering,
  interferometry) combined with equilibrium-reconstructed flux-surface geometry. See
  also `electron_density_at_pedestal` and `electron_density_at_separatrix` for local
  pedestal characterization.
