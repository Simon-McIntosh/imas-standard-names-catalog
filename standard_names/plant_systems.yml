      data_type: FLT_0D
      unit: '1'
      lifecycle_status: active
    enhanced_context:
      description: Deuterated ammonia (ND3).
      kind: template
- name: ammonia_prefill_count
  kind: scalar
  status: active
  description: Ammonia prefill count is the total amount of NH3 introduced before
    plasma breakdown, expressed as an equivalent-electron count of 10 per neutral
    molecule.
  documentation: 'Ammonia prefill count is the total amount of neutral ammonia, NH3,
    introduced before plasma breakdown, expressed as an equivalent-electron count.
    Each neutral NH3 molecule contributes ten count units: seven from nitrogen and
    one from each of its three hydrogen atoms.


    The count is defined by the accumulated molecular amount over the prefill interval:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{NH_3,prefill}} = 10N_{\mathrm{NH_3,prefill}} = \int_{t_0}^{t_\mathrm{bd}}
    10\dot{N}_{\mathrm{NH_3}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{NH_3,prefill}}$ is the equivalent-electron count,
    $N_{\mathrm{NH_3,prefill}}$ is the accumulated number of ammonia molecules, $\dot{N}_{\mathrm{NH_3}}$
    is the ammonia injection rate in molecules per second, and $t_0$ and $t_{\mathrm{bd}}$
    are the start of prefill and plasma-breakdown times in seconds.


    This species-specific contribution is included in the common prebreakdown bookkeeping
    of [prefill_count](name:prefill_count). Ammonia introduced after breakdown is
    excluded and is represented by [accumulated_ammonia_count](name:accumulated_ammonia_count).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:prefill_count
  - name:accumulated_ammonia_count
  arguments:
  - name: prefill_count
    operator: ammonia
    operator_kind: qualifier
  sources:
