      kind: llm
- name: vertical_coordinate_of_passive_structure
  kind: scalar
  status: active
  description: "Signed vertical position of a reference point on a passive conducting\
    \ structure, measured from the machine midplane in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is the signed vertical displacement of a designated
    reference point on a passive conducting structure from the machine midplane. It
    uses the vertical coordinate $Z$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, rather than the structure''s vertical extent.


    The reference-point coordinate is defined by


    $$

    Z_{\mathrm{ref}} = Z(P_{\mathrm{ref}}) - Z_{\mathrm{mid}}

    $$


    where $P_{\mathrm{ref}}$ is the designated reference point, $Z(P_{\mathrm{ref}})$
    is its vertical coordinate, and $Z_{\mathrm{mid}}$ is the vertical coordinate
    of the machine midplane. The coordinate $Z$ is measured along the vertical direction
    of the cylindrical frame.


    This quantity identifies a position and is distinct from [height of a passive
    structure](name:height_of_passive_structure), which describes the structure''s
    full vertical extent. It is analogous to the [vertical coordinate of a conductor
    cross-section](name:vertical_coordinate_of_conductor_cross_section) when the reference
    point is a cross-sectional center.


    Sign convention: Positive when the reference point lies toward increasing $Z$
    from the machine midplane.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_passive_structure
  sources:
