- name: thermal_electron_number_density
  kind: scalar
  status: draft
  description: Number density of the thermal (Maxwellian) electron population, excluding
    suprathermal or fast electron contributions.
  documentation: 'The thermal electron number density $n_{e,\mathrm{th}}$ quantifies
    the number of electrons per unit volume whose energy distribution is well-described
    by a Maxwellian at the local electron temperature $T_e$. It is the dominant electron
    population in the edge plasma under most conditions, and is related to the total
    electron density by $n_e = n_{e,\mathrm{th}} + n_{e,\mathrm{fast}}$, where [electron_number_density](name:electron_number_density)
    encompasses both thermal and non-thermal contributions and [fast_electron_number_density](name:fast_electron_number_density)
    carries the suprathermal remainder. Typical values in the edge scrape-off layer
    range from $10^{17}$ to $10^{20}$ m$^{-3}$, falling by several orders of magnitude
    from the separatrix to the far SOL. The thermal electron population is inferred
    from Langmuir probe characteristics, Thomson scattering, or reflectometry, which
    yield $n_{e,\mathrm{th}}$ directly when non-thermal contributions are small. In
    the edge plasma, charge neutrality couples $n_{e,\mathrm{th}}$ to the summed [thermal_ion_number_density](name:thermal_ion_number_density)
    plus ionization source profiles.


    Sign convention: Positive when the electron number density is greater than zero,
    as befits a particle count per unit volume.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_number_density
  - name:fast_electron_number_density
  - name:thermal_ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/electrons/density_thermal
    dd_path: edge_profiles/profiles_1d/electrons/density_thermal
    status: composed
- name: thermal_ion_number_density
  kind: scalar
  status: draft
  description: Number density of thermal (Maxwellian) ions of a given species, summed
    over all charge states, in the edge plasma region.
  documentation: 'The thermal ion number density $n_{i,\mathrm{th}}$ quantifies the
    number of ions per unit volume whose velocity distribution is well-approximated
    by a Maxwellian at the local ion temperature $T_i$. When multiple charge states
    are present, this quantity represents the sum $n_{i,\mathrm{th}} = \sum_z n_{i,z,\mathrm{th}}$,
    where $n_{i,z,\mathrm{th}}$ is the thermal ion density in charge state $z$; the
    charge-state-resolved counterpart is [thermal_ion_state_number_density](name:thermal_ion_state_number_density).
    The thermal population excludes suprathermal fast ions generated by neutral-beam
    injection or wave heating, which are tracked separately in [fast_ion_number_density](name:fast_ion_number_density).
    In the edge and scrape-off layer, $n_{i,\mathrm{th}}$ governs pressure balance,
    recycling fluxes, and collisional energy exchange; typical values range from $10^{17}$
    to $10^{20}$ m$^{-3}$ depending on proximity to the separatrix. Measurements are
    obtained via charge-exchange recombination spectroscopy or from fluid transport
    codes constrained by Langmuir probe and Thomson scattering data. For the total
    thermal ion density summed over all species, see [total_thermal_ion_number_density](name:total_thermal_ion_number_density);
    for the total ion population including non-thermal contributions, see [ion_number_density](name:ion_number_density).


    Sign convention: Positive when the thermal ion number density is greater than
    zero, i.e., for all physically realizable plasmas.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_ion_state_number_density
  - name:fast_ion_number_density
  - name:total_thermal_ion_number_density
  - name:ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/ion/density_thermal
    dd_path: edge_profiles/profiles_1d/ion/density_thermal
    status: composed
- name: thermal_ion_state_number_density
  kind: scalar
  status: draft
  description: Number density of thermal (Maxwellian) ions of a given species in a
    specific charge state, distinguishing the thermal population from non-thermal
    contributions at the ionization-stage level.
  documentation: 'The thermal ion state number density $n_{i,z}^{\rm th}$ gives the
    number of thermally distributed ions per unit volume for a particular ion species
    at a specific charge state $z$. The thermal population is characterized by a Maxwellian
    velocity distribution with local temperature $T_i$, distinct from the suprathermal
    ions tracked by [fast_ion_state_number_density](name:fast_ion_state_number_density).
    Summing $n_{i,z}^{\rm th}$ over all charge states $z$ recovers [thermal_ion_number_density](name:thermal_ion_number_density),
    while adding the fast-ion contribution yields the total [ion_state_number_density](name:ion_state_number_density).
    Charge-state resolution is essential for computing radiative cooling rates and
    charge-exchange reaction rates, which depend sensitively on the ionization stage.
    In edge and scrape-off layer plasmas, this quantity is inferred from spectroscopic
    line-ratio analysis combined with collisional-radiative models, or from fluid/kinetic
    transport codes; typical values range from $10^{16}$ to $10^{20}$ m$^{-3}$ depending
    on species and proximity to the separatrix.


    Sign convention: Positive when the thermal ion population at the given charge
    state is non-zero, consistent with a particle number density that is by definition
    non-negative.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:fast_ion_state_number_density
  - name:thermal_ion_number_density
  - name:ion_state_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/ion/state/density_thermal
    dd_path: edge_profiles/profiles_1d/ion/state/density_thermal
    status: composed
- name: thermal_neutral_number_density
  kind: scalar
  status: draft
  description: Number density of thermal (Maxwellian) neutral particles, summed over
    all internal quantum states unless a specific quantum state is indicated by context.
  documentation: 'The thermal neutral number density $n_{n,\mathrm{th}}$ quantifies
    the number of neutrals per unit volume whose velocity distribution is well approximated
    by a Maxwellian at the local plasma temperature, distinguishing them from the
    suprathermal population tracked by [fast_neutral_number_density](name:fast_neutral_number_density).
    Thermal neutrals arise primarily from recycling at plasma-facing components and
    from charge-exchange reactions between cold neutrals and thermal ions, and they
    play a central role in edge energy and particle transport through ionization,
    charge exchange, and elastic collisions. The quantity is a scalar field defined
    on the poloidal cross-section and may represent either the sum over all internal
    quantum states or the density of a specific state, depending on the resolution
    available; the complementary total over all populations is captured by [neutral_number_density](name:neutral_number_density).
    Typical values range from $10^{16}$ m$^{-3}$ in the outer scrape-off layer to
    below $10^{14}$ m$^{-3}$ in the confined plasma core. It is inferred from spectroscopic
    measurements of hydrogen Balmer-series emission combined with collisional-radiative
    modeling, or from neutral transport codes benchmarked against pressure gage data.
    For the corresponding thermal ion and electron counterparts, see [thermal_ion_number_density](name:thermal_ion_number_density)
    and [thermal_electron_number_density](name:thermal_electron_number_density).


    Sign convention: Positive when the neutral particle count per unit volume is non-zero,
    as a number density is intrinsically non-negative.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:fast_neutral_number_density
  - name:neutral_number_density
  - name:thermal_ion_number_density
  - name:thermal_electron_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/neutral/state/density_thermal
    dd_path: edge_profiles/profiles_1d/neutral/state/density_thermal
    status: composed
- name: toroidal_component_of_center_of_mass_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the bulk plasma center-of-mass velocity, giving
    the net mass-flux-weighted flow speed in the toroidal direction averaged over
    all particle species in the edge plasma.
  documentation: 'The toroidal center-of-mass velocity component $v_\phi^{\rm cm}$
    is the projection of the mass-weighted mean fluid velocity onto the toroidal direction
    $\hat{\phi}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It is defined
    as $v_\phi^{\rm cm} = \sum_s m_s n_s v_{\phi,s} / \sum_s m_s n_s$, where $m_s$
    is the mass, $n_s$ is the number density, and $v_{\phi,s}$ is the toroidal velocity
    of species $s$. In edge plasmas this quantity is dominated by the ion contribution
    because $m_i \gg m_e$, and it represents the net toroidal momentum carried by
    the plasma fluid. Typical values range from a few hundred m/s in ohmic or L-mode
    discharges up to $\sim 10^5$ m/s in H-mode plasmas with strong neutral-beam injection.
    The quantity is closely related to the full [center_of_mass_velocity](name:center_of_mass_velocity)
    vector; its radial counterpart is represented by [radial_component_of_neutral_velocity](name:radial_component_of_neutral_velocity)
    for the neutral species contribution, and the [toroidal_component_of_e_cross_b_drift_velocity](name:toroidal_component_of_e_cross_b_drift_velocity)
    captures the dominant perpendicular drift that contributes to toroidal rotation.
    Toroidal rotation is commonly measured by charge-exchange recombination spectroscopy
    of impurity ions.


    Sign convention: Positive when the velocity is directed in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above along $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:center_of_mass_velocity
  - name:radial_component_of_neutral_velocity
  - name:toroidal_component_of_e_cross_b_drift_velocity
  constraints: []
  arguments:
  - name: center_of_mass_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/velocity_mass_centre/phi
    dd_path: edge_profiles/ggd/velocity_mass_centre/phi
    status: composed
- name: toroidal_component_of_e_cross_b_drift_velocity
  kind: scalar
  status: draft
  description: "Toroidal component of the E\xD7B drift velocity, equal to the phi-component\
    \ of (E\xD7B)/|B|^2, where E is the electric field and B is the magnetic field.\
    \ This drift acts on all charged particles in crossed electric and magnetic fields\
    \ and drives azimuthal bulk plasma rotation in the toroidal direction."
  documentation: "The toroidal E\xD7B drift velocity is defined as\n\n$$v_{E\\times\
    \ B,\\phi} = \\frac{(\\mathbf{E}\\times\\mathbf{B})\\cdot\\hat{\\phi}}{|\\mathbf{B}|^2}$$\n\
    \nwhere $\\hat{\\phi}$ is the unit vector in the direction of increasing toroidal\
    \ angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame. Expanding\
    \ in cylindrical components,\n\n$$v_{E\\times B,\\phi} = \\frac{E_R B_Z - E_Z\
    \ B_R}{B_R^2 + B_\\phi^2 + B_Z^2}$$\n\nwhere $E_R$, $E_Z$ are the radial and vertical\
    \ electric field components (in V m$^{-1}$) and $B_R$, $B_\\phi$, $B_Z$ are the\
    \ magnetic field components (in T). The resulting quantity has units of m s$^{-1}$,\
    \ consistent with $[E]/[B] = (\\text{V m}^{-1})/\\text{T} = \\text{m s}^{-1}$.\n\
    \nIn tokamak edge plasmas the dominant driver of this component is the radial\
    \ electric field $E_R$ acting across the vertical magnetic field component $B_Z$\
    \ and the poloidal field $B_\\theta$. Typical toroidal E\xD7B speeds are of order\
    \ $10^3$\u2013$10^4$ m s$^{-1}$ in L-mode edges; in H-mode pedestal regions the\
    \ deepened radial electric field well can drive this component to $\\sim 10^4$\u2013\
    $10^5$ m s$^{-1}$. This drift is identical for all charged species and therefore\
    \ contributes equally to ion and electron fluid velocities; it does not directly\
    \ act on neutral particles, though neutrals may be entrained via ion-neutral collisions.\n\
    \nThe toroidal E\xD7B velocity enters the toroidal momentum balance alongside\
    \ the plasma flow [toroidal_component_of_center_of_mass_velocity](name:toroidal_component_of_center_of_mass_velocity)\
    \ and is a key diagnostic target for intrinsic rotation studies. The radial electric\
    \ field $E_R$ required to evaluate this quantity is commonly inferred from charge-exchange\
    \ recombination spectroscopy combined with magnetic equilibrium reconstruction.\
    \ The full three-component drift vector is described under [e_cross_b_drift_velocity](name:e_cross_b_drift_velocity),\
    \ and the complementary spatial components are [radial_component_of_e_cross_b_drift_velocity](name:radial_component_of_e_cross_b_drift_velocity)\
    \ and [poloidal_component_of_e_cross_b_drift_velocity](name:poloidal_component_of_e_cross_b_drift_velocity).\n\
    \nSign convention: Positive when the drift is directed in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ i.e., in the $+\\hat{\\phi}$ direction with $\\hat{R}\\times\\hat{\\phi}=\\\
    hat{Z}$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_component_of_e_cross_b_drift_velocity
  - name:toroidal_component_of_center_of_mass_velocity
  - name:e_cross_b_drift_velocity
  constraints: []
  arguments:
  - name: e_cross_b_drift_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/ion/state/velocity_exb/phi
    dd_path: edge_profiles/ggd/ion/state/velocity_exb/phi
    status: composed
- name: toroidal_component_of_momentum_source
  kind: scalar
  status: draft
  description: Toroidal projection of the net momentum source density acting on the
    plasma, encompassing contributions from all species and processes including neutral
    beam injection, charge exchange, and viscous forces.
  documentation: "The toroidal component of the momentum source density, $S_{p,\\\
    phi}$, quantifies the net rate of momentum deposition per unit volume in the $\\\
    hat{\\phi}$ direction, where $\\hat{\\phi}$ is the toroidal unit vector in the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame. It is the $\\phi$-projection\
    \ of the full [momentum_source](name:momentum_source) vector $\\mathbf{S}_p$ (kg\
    \ m$^{-1}$ s$^{-2}$), satisfying $S_{p,\\phi} = \\mathbf{S}_p \\cdot \\hat{\\\
    phi}$. Contributions arise from neutral beam injection torque, charge-exchange\
    \ drag between ions and neutrals, gyroviscous and anomalous viscosity terms, and\
    \ electromagnetic $\\mathbf{j} \\times \\mathbf{B}$ body forces projected onto\
    \ the toroidal direction. This quantity covers the total plasma \u2014 ions, neutrals,\
    \ and combined species \u2014 and is distinct from species-resolved counterparts\
    \ such as [implicit_part_of_toroidal_component_of_ion_momentum_source](name:implicit_part_of_toroidal_component_of_ion_momentum_source),\
    \ which isolates the ion channel. The complementary spatial projection is the\
    \ [radial_component_of_momentum_source](name:radial_component_of_momentum_source).\
    \ Typical magnitudes in the edge plasma range from $10^{-2}$ to $10^2$ kg m$^{-1}$\
    \ s$^{-2}$ depending on beam power and plasma density; the toroidal component\
    \ generally dominates in NBI-driven rotation regimes.\n\nSign convention: Positive\
    \ when $S_{p,\\phi}$ acts in the direction of increasing toroidal angle $\\phi$."
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
