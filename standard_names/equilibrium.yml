- name: minor_radius_of_plasma_boundary
  kind: scalar
  status: active
  description: Half the difference between the maximum and minimum major-radius coordinates
    of the last closed plasma-boundary contour, defining its horizontal cross-sectional
    size.
  documentation: 'The minor radius is the effective horizontal semi-axis of the last
    closed plasma-boundary contour and characterizes the radial extent of the plasma
    cross-section.


    The minor radius $a$ is defined by


    $$

    a = \frac{R_{\max} - R_{\min}}{2}

    $$


    where $a$ is the minor radius, $R_{\max}$ is the maximum major-radius coordinate
    on the boundary contour, and $R_{\min}$ is the minimum major-radius coordinate
    on that contour.


    This quantity applies to the complete last closed plasma-boundary contour and
    is determined from its global major-radius extrema. It is a nonnegative geometric
    size parameter, not a local major-radius coordinate such as the [radial coordinate
    at the outboard midplane](name:radial_coordinate_at_outboard_midplane) and not
    a flux-surface average.


    The [elongation of the plasma boundary](name:elongation_of_plasma_boundary) uses
    this minor radius as the horizontal reference semi-axis when forming the boundary''s
    vertical-to-horizontal shape ratio.'
