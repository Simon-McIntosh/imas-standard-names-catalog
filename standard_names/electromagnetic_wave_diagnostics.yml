- name: line_averaged_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume averaged along
    a complete plasma propagation chord, equal to the path integral divided by chord
    length.
  documentation: 'Number density of free electrons per physical volume averaged along
    a complete propagation chord is the path-normalized continuum count density of
    the unqualified free-electron population along that chord.


    For local [electron density](name:electron_density) $n_e(l)$, the defining relation
    is:


    $$

    \bar{n}_e = \frac{1}{L}\int_0^L n_e(l)\,dl

    $$


    where $\bar{n}_e$ is the line-averaged electron density, $n_e(l)$ is the local
    free-electron density at path coordinate $l$, $l$ is distance along the complete
    propagation chord, and $L$ is the full chord length.


    This quantity applies to the complete unqualified free-electron population along
    the chord, aggregating all contributing free-electron populations rather than
    selecting thermal or fast electrons. It is a path average over the chord and is
    not a pointwise [electron density](name:electron_density) or a line-integrated
    column density.


    The numerator in the defining relation is the [line-integrated electron number
    density](name:line_integrated_electron_number_density); dividing it by the chord
    length produces this path-normalized quantity. The same line-averaging construction
    applies to species-specific quantities such as [line-averaged hydrogen density](name:line_averaged_hydrogen_density),
    while this quantity remains specific to free electrons.'
  unit: m^-3
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_density
  - name:line_integrated_electron_number_density
  - name:line_averaged_hydrogen_density
  arguments:
  - name: electron_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: interferometer/channel/n_e_line_average
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-n_e_line_average
    dd_documentation:
      leaf: Line average density, possibly obtained by a combination of multiple interferometry
        wavelengths. Corresponds to the density integrated along the full line-of-sight
        and then divided by the length of the line-of-sight
      parent_path: interferometer/channel
      parent: Set of channels (lines-of-sight)
      data_type: STRUCTURE
      unit: m^-3
    enhanced_context:
      description: "Line-average electron density (n\u0304e), the line-integrated\
        \ electron density along the full interferometer chord divided by the chord\
        \ length. May combine multiple wavelengths for dispersion correction."
      kind: llm
  - dd_path: summary/line_average/n_e/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_e-value
    dd_documentation:
