- name: vertical_coordinate_of_emission_grid_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of a point on the emission grid defining the
    neutron detector field-of-view geometry in the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  documentation: 'The vertical coordinate $Z$ locates each grid point of the emission
    grid used to discretize the neutron-emission volume sampled by a detector field
    of view. The emission grid is a set of spatial sampling points spanning the plasma
    cross-section; each point carries a weight proportional to the local neutron emission
    rate, enabling the line-integrated detector signal to be reconstructed from the
    volume integral $S = \int w(R,Z)\, \varepsilon(R,Z)\, dV$, where $\varepsilon(R,Z)$
    is the local neutron emissivity and $w(R,Z)$ is the geometric weight function.
    Typical $Z$ values range from approximately $-2$ m to $+2$ m for medium-size tokamaks,
    covering the full vertical extent of the plasma. The grid coordinates are determined
    during the diagnostic geometry setup and remain fixed for a given detector configuration;
    compare with [vertical_coordinate_of_start_point](name:vertical_coordinate_of_start_point)
    and [vertical_coordinate_of_third_point_of_line_of_sight](name:vertical_coordinate_of_third_point_of_line_of_sight),
    which define analogous $Z$ positions for other diagnostic geometric loci.


    Sign convention: Positive when the emission grid point lies above the machine
    midplane in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_start_point
  - name:vertical_coordinate_of_third_point_of_line_of_sight
  constraints: []
