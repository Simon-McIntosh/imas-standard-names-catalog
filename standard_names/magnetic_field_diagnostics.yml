- name: area_of_flux_loop
  kind: scalar
  status: draft
  description: Effective sensing area of a flux loop diagnostic, defined as the ratio
    of the measured magnetic flux to the mean magnetic field over the loop aperture.
    This geometric property governs the flux linkage sensitivity of the loop and is
    used to convert induced voltage signals into magnetic flux measurements.
  documentation: 'The effective area $A$ of a flux loop is defined by $\Phi = A \langle
    B_n \rangle$, where $\Phi$ is the total magnetic flux threading the loop and $\langle
    B_n \rangle$ is the average normal component of the magnetic field $\mathbf{B}$
    over the loop aperture. For an ideal planar single-turn loop, $A$ equals the geometric
    enclosed area; for multi-turn or non-planar geometries, $A$ represents the effective
    flux-collection area accounting for the coil winding geometry. This quantity is
    undefined (and should be left empty) when the flux loop is configured as a differential
    loop (type index 6), since differential loops measure field gradients rather than
    total flux.


    The effective area is determined during in-situ calibration or from engineering
    drawings, and typical values range from a few $\text{cm}^2$ to several hundred
    $\text{cm}^2$ depending on the loop size and machine geometry. Compared to the
    [cross-sectional area of a poloidal magnetic field probe](name:cross_sectional_area_of_poloidal_magnetic_field_probe)
    or the [cross-sectional area of a Rogowski coil](name:cross_sectional_area_of_rogowski_coil),
    which characterize per-turn winding geometry, the flux loop effective area characterizes
    the total flux-collecting aperture of the full loop diagnostic.


    Sign convention: Positive when the flux through the loop is in the direction consistent
    with the right-hand rule applied to the loop''s defined normal vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m^2
  physics_domain: magnetic_field_diagnostics
