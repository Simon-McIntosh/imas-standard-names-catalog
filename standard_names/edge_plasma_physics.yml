- name: toroidal_flux_surface_averaged_total_plasma_momentum_at_plasma_boundary
  kind: scalar
  status: active
  description: "Flux-surface-averaged total plasma momentum in the toroidal direction\
    \ at the plasma boundary is the signed flux-surface average, on the last closed\
    \ magnetic flux surface, of the cumulative toroidal linear momentum enclosed by\
    \ that surface, summed over electrons and all ion species. Positive values point\
    \ along increasing toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: "Flux-surface-averaged total plasma momentum in the toroidal direction\
    \ at the plasma boundary is the flux-surface average, on the last closed magnetic\
    \ flux surface, of the cumulative toroidal component of plasma linear momentum\
    \ enclosed by that surface. The cumulative momentum includes electrons and all\
    \ ion species and is treated as a flux-surface scalar before averaging.\n\nThe\
    \ cumulative boundary value is defined by the enclosed-volume integral; writing\
    \ the flux-surface average explicitly gives:\n\n$$\nP_{\\phi,\\mathrm{FSA}}^{\\\
    mathrm{b}}\n=\n\\frac{\\oint_{\\psi=\\psi_\\mathrm{b}} P_\\phi(\\psi_\\mathrm{b})\\\
    , dA/|\\nabla\\psi|}\n     {\\oint_{\\psi=\\psi_\\mathrm{b}} dA/|\\nabla\\psi|}\n\
    =\n\\int_{V_\\mathrm{b}} \\sum_s m_s n_s(\\mathbf{x})\\, v_{\\phi,s}(\\mathbf{x})\\\
    , dV\n$$\n\nwhere $P_{\\phi,\\mathrm{FSA}}^\\mathrm{b}$ is this quantity, $P_\\\
    phi(\\psi_\\mathrm{b})$ is the [toroidal total plasma momentum](name:toroidal_total_plasma_momentum)\
    \ associated with the boundary flux label, $\\psi_\\mathrm{b}$ is the boundary\
    \ value of the [poloidal magnetic-flux label](name:poloidal_magnetic_flux_at_flux_surface),\
    \ $dA/|\\nabla\\psi|$ is the flux-surface averaging measure normalized by the\
    \ denominator, $V_\\mathrm{b}$ is the plasma volume enclosed by the last closed\
    \ magnetic flux surface, $dV$ is the volume element, $s$ runs over electrons and\
    \ all ion species, $m_s$ is species mass, $n_s$ is species number density, and\
    \ $v_{\\phi,s}=\\mathbf{v}_s\\cdot\\hat{\\phi}$ is the toroidal velocity component\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius,\
    \ $\\phi$ is toroidal angle, and $Z$ is vertical height. The product $m_s n_s\
    \ v_{\\phi,s}$ is the toroidal momentum density contribution of species $s$, so\
    \ the flux-surface average is applied to the enclosed total $P_\\phi(\\psi_\\\
    mathrm{b})$, not directly to this local density.\n\nThis quantity is not a boundary-surface\
    \ integral of local toroidal momentum density, not the flux-surface average of\
    \ the local density $g_\\phi=\\sum_s m_s n_s v_{\\phi,s}$ alone, and not a major-radius-weighted\
    \ angular-momentum measure. It is the flux-surface-averaged representation of\
    \ [toroidal total plasma momentum at the plasma boundary](name:toroidal_total_plasma_momentum_at_plasma_boundary);\
    \ the analogous cumulative value at the pedestal top is [toroidal plasma momentum\
    \ at the pedestal top](name:toroidal_plasma_momentum_at_pedestal_top).\n\nSign\
    \ convention: Positive when the enclosed total toroidal momentum is in the direction\
    \ of increasing toroidal angle $\\phi$ in the right-handed cylindrical $(R, \\\
    phi, Z)$ frame."
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum
  - name:toroidal_plasma_momentum_at_magnetic_axis
  sources:
  - dd_path: summary/local/separatrix_average/momentum_phi/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-momentum_phi-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix_average/momentum_phi
      parent: Total plasma toroidal momentum, summed over ion species and electrons
      data_type: FLT_1D
