name: radial_component_of_neutral_energy_flux
status: draft
description: Radial projection of the neutral-species energy flux density, representing
  the net radial transport of thermal and kinetic energy carried by neutrals.
documentation: "The radial neutral energy flux $q_n^{\\rm rad}$ (W\\,m$^{-2}$) captures\
  \ the energy transported by neutral particles in the radial direction, encompassing\
  \ both thermal conduction and convective enthalpy transport. In fluid neutral models,\
  \ it takes the form $q_n^{\\rm rad} = \\frac{5}{2} T_n \\Gamma_n^{\\rm rad} - \\\
  kappa_n \\nabla_r T_n$, where $T_n$ is the neutral temperature (eV), $\\Gamma_n^{\\\
  rm rad}$ is the radial neutral particle flux (m$^{-2}$\\,s$^{-1}$), and $\\kappa_n$\
  \ is the neutral thermal conductivity (W\\,m$^{-1}$\\,eV$^{-1}$). Neutral energy\
  \ transport is especially important in high-recycling divertor scenarios and detached\
  \ plasmas, where Frank-Condon energies (1\u20133 eV per dissociation) and charge-exchange\
  \ cascades redistribute power across the divertor. Typical magnitudes range from\
  \ $10^3$ to $10^6$\\,W\\,m$^{-2}$ depending on divertor conditions. Note: the stated\
  \ unit m$^{-2}$\xB7W should be interpreted as W\\,m$^{-2}$. Computed by neutral\
  \ kinetic codes (EIRENE, DEGAS2) or fluid neutral models in edge transport suites."
