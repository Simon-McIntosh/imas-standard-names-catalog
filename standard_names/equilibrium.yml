- name: vertical_coordinate_of_start_point_of_arc_of_circle
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the start point of each arc-of-circle segment\
    \ defining an axisymmetric cross-section geometry in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, where Z is measured along the machine symmetry axis."
  documentation: The vertical coordinate $Z_\mathrm{start}$ locates the start point
    $P_\mathrm{start} = (R_\mathrm{start},\, Z_\mathrm{start})$ of an arc-of-circle
    segment in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the
    major radius measured from the machine symmetry axis and $Z$ is the vertical height.
    Arc-of-circle segments are used to represent axisymmetric cross-section boundaries
    of passive conductors, ferromagnetic inserts, and plasma-facing components. Each
    arc is fully defined by its start point $(R_\mathrm{start}, Z_\mathrm{start})$,
    end point $(R_\mathrm{end}, Z_\mathrm{end})$, and the radius of curvature $r_c$.
    Together with the companion major-radius coordinate $R_\mathrm{start}$, this quantity
    specifies the start point of each arc segment; the corresponding end-point vertical
    coordinate $Z_\mathrm{end}$ closes the arc definition. The value of $Z_\mathrm{start}$
    is expressed in meters relative to the machine midplane, with negative values
    below and positive values above the midplane. Typical magnitudes range from a
    few centimeters to several meters depending on the device geometry, but no device-specific
    range is intrinsic to the definition of this quantity.
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_arcs_of_circle_start_point
  constraints: []
  sources:
  - id: dd:ferritic/object/axisymmetric/arcs_of_circle/z
    dd_path: ferritic/object/axisymmetric/arcs_of_circle/z
    status: composed
  - id: dd:iron_core/segment/geometry/arcs_of_circle/z
    dd_path: iron_core/segment/geometry/arcs_of_circle/z
    status: composed
  - id: dd:pf_plasma/element/geometry/arcs_of_circle/z
