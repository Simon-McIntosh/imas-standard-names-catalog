  kind: scalar
  status: active
  description: Volume-integrated kinetic energy content of a specified electron population,
    including either bulk thermal or fast suprathermal electrons.
  documentation: 'The quantity is the total kinetic energy contained in a defined
    electron population, obtained by integrating its local kinetic-energy density
    over the plasma volume. The population definition distinguishes bulk thermal electrons
    from fast suprathermal electrons.


    The defining relation is


    $$

    E_e = \int_V u_e(\mathbf{x})\,dV

    $$


    where $E_e$ is the integrated electron energy, $u_e(\mathbf{x})$ is the local
    kinetic-energy density of the included population, $\mathbf{x}$ is position, and
    $V$ is the relevant confined plasma volume. For thermal electrons, [thermal electron
    energy](name:thermal_electron_energy) uses $u_e = 3p_e/2$, where $p_e$ is the
    local thermal electron pressure. [Fast electron energy](name:fast_electron_energy)
    instead excludes the bulk thermal electron contribution and represents the suprathermal
    population. The quantity is an energy content, not a power, power density, or
    absorbed-power rate.'
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_energy
- name: fast_electron_energy
  kind: scalar
  status: active
  description: Volume-integrated kinetic energy of the fast (suprathermal) electron
    population in the plasma, excluding the bulk thermal electron contribution.
  documentation: 'Volume-integrated kinetic energy of the fast (suprathermal) electron
    population in the plasma, excluding the bulk thermal electron contribution. It
    is a stored energy content rather than a power or power density.


    The defining volume integral is


    $$

    E_{\mathrm{fe}} = \int_{V_{\mathrm{p}}} u_{\mathrm{fe}}(\mathbf{x})\,\mathrm{d}V

    $$


    where $E_{\mathrm{fe}}$ is the fast-electron energy, $u_{\mathrm{fe}}(\mathbf{x})$
    is the local fast-electron kinetic-energy density, $\mathbf{x}$ is position, and
    $V_{\mathrm{p}}$ is the plasma volume.


    The quantity excludes the bulk thermal contribution represented by [thermal electron
    energy](name:thermal_electron_energy). When thermal and fast electrons form an
    exhaustive partition, their contributions sum to [electron energy](name:electron_energy);
    [fast particle energy](name:fast_particle_energy) is the corresponding quantity
    including fast particles of all species.'
  unit: J
  physics_domain: auxiliary_heating
  links:
  - name:electron_energy
  - name:fast_particle_energy
  arguments:
  - name: electron_energy
    operator: fast
    operator_kind: qualifier
  sources:
  - dd_path: summary/heating_current_drive/lh/energy_fast/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-lh-energy_fast-value
    dd_documentation:
      leaf: Value
      parent_path: summary/heating_current_drive/lh/energy_fast
