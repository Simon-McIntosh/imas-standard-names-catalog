        case of a spherical mirror (geometry_type = 2), derived from the above geometric
        data
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of sphere centre.
      kind: template
- name: radial_coordinate_of_neutral_beam_injector
  kind: scalar
  status: active
  description: "Major-radius coordinate of the neutral beam injector center, measured\
    \ from the toroidal symmetry axis in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: 'The radial coordinate of a neutral beam injector is the major-radius
    location of the injector unit center relative to the toroidal symmetry axis. It
    is a nonnegative geometric coordinate in the right-handed cylindrical $(R,\\phi,Z)$
    frame, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical
    height.


    For the injector center, the radial coordinate is related to its Cartesian coordinates
    by


    $$

    R = \\sqrt{x^2+y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates of the same injector
    center in the right-handed Cartesian $(\\hat{x},\\hat{y},\\hat{z})$ basis.


    This quantity applies to one selected neutral beam injector unit and represents
    the unit-center position only. It is not an aggregate over multiple injectors
    and does not represent a beam trajectory, launch point, deposition location, or
    plasma response.


    It is the neutral-beam-injector specialization of the general [radial coordinate](name:radial_coordinate),
    with the geometric point fixed to the injector unit center.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
