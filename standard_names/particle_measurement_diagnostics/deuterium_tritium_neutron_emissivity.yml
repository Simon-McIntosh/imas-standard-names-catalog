name: deuterium_tritium_neutron_emissivity
status: draft
description: "Local volumetric emission rate of neutrons from deuterium\u2013tritium\
  \ fusion reactions in the plasma."
documentation: "The DT neutron emissivity $\\varepsilon_{\\mathrm{DT}}$ (in m$^{-3}$\
  \ s$^{-1}$) is the number of 14.1 MeV neutrons produced per unit volume per unit\
  \ time by the D(t,n)$^4$He reaction. It is given by $\\varepsilon_{\\mathrm{DT}}\
  \ = n_D\\, n_T\\, \\langle\\sigma v\\rangle_{\\mathrm{DT}}$, where $n_D$ and $n_T$\
  \ are the deuterium and tritium ion densities (m$^{-3}$) respectively, and $\\langle\\\
  sigma v\\rangle_{\\mathrm{DT}}$ is the Maxwellian-averaged DT fusion reactivity\
  \ (m$^{3}$ s$^{-1}$). The DT reactivity peaks near $T_i \\approx 65$ keV but is\
  \ already substantial above $\\sim$5 keV. For ITER-class plasmas ($n_D \\approx\
  \ n_T \\approx 5 \\times 10^{19}$ m$^{-3}$, $T_i \\approx 15$\u201325 keV), peak\
  \ core emissivities reach $10^{17}$\u2013$10^{18}$ m$^{-3}$ s$^{-1}$. The emissivity\
  \ profile is reconstructed from collimated neutron camera sightlines via tomographic\
  \ inversion and is a key input for neutron wall-loading and tritium-breeding assessments.\
  \ See also the DD counterpart `deuterium_deuterium_neutron_emissivity` and the derived\
  \ quantity `deuterium_tritium_fusion_power_density`."
