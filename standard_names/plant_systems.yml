        power conversion system component. Characterises the thermal state of the
        working fluid at that connection point for thermodynamic cycle analysis.
      kind: llm
- name: core_density_of_pellet
  kind: scalar
  status: active
  description: Number density of atoms of a specified constituent species within the
    condensed core of a pellet before it is shattered for disruption mitigation.
  documentation: 'This quantity is the number of atoms of a specified constituent
    species per unit volume of the condensed pellet core before fragmentation. For
    molecular materials, the count is assigned to individual atoms rather than molecules.


    $$

    n_s = \frac{N_s}{V_{\mathrm{core}}}

    $$


    where $n_s$ is the species atom number density in m$^{-3}$, $N_s$ is the dimensionless
    number of atoms of species $s$, and $V_{\mathrm{core}}$ is the core volume in
    m$^3$. It is the core-specific derivative of [density of pellet](name:density_of_pellet),
    restricted to the constituent species and core region.


    The quantity describes the unshattered pellet core and is distinct from [shattered
    pellet fragment density](name:shattered_pellet_fragment_density), which applies
    to an individual fragment after shattering.'
  unit: m^-3
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_fragment_density
  sources:
  - dd_path: spi/injector/pellet/core/species/density
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-pellet-core-species-density
    dd_documentation:
      leaf: Density of the species
      parent_path: spi/injector/pellet/core/species
      parent: Atomic species in the shell composition
      data_type: FLT_0D
      unit: m^-3
    enhanced_context:
      description: Number density of an atomic species composing the core of a shattered
        pellet injector (SPI) pellet. Characterizes the material composition of the
        pellet core used for disruption mitigation.
      kind: llm
- name: count_due_to_gas_injection
  kind: scalar
  status: active
  description: "Cumulative post-breakdown inventory of atoms delivered by gas injection,\
    \ expressed as an equivalent-electron count weighted by each species\u2019 atomic\
    \ number."
  documentation: 'This quantity is the cumulative inventory of a specified atomic
    gas species delivered by gas injection after plasma breakdown, expressed using
    equivalent-electron count units. Material introduced during the prefill phase
    is excluded.


    For species $s$, the equivalent-electron count is defined by


    $$

    N_{\mathrm{eq},s}(t) = Z_s N_s(t)

    $$


    where $N_{\mathrm{eq},s}$ and $N_s$ are dimensionless cumulative counts, and $Z_s$
    is the dimensionless atomic number of species $s$. The count increases by $Z_s$
    for every delivered atom and represents an atomic inventory, not an instantaneous
    injection rate or an ionization-state population. The [carbon count due to gas
    injection](name:carbon_count_due_to_gas_injection) and [helium-4 count due to
    gas injection](name:helium_4_count_due_to_gas_injection) are species-specific
    instances of this definition.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:carbon_count_due_to_gas_injection
  - name:helium_4_count_due_to_gas_injection
- name: carbon_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of carbon atoms delivered by gas
    injection, expressed as an equivalent-electron count weighted by the carbon atomic
    number. Each injected neutral carbon atom contributes six counts, and prefill
    material is excluded.
  documentation: 'This quantity is the cumulative inventory of carbon atoms delivered
    by gas injection after plasma breakdown, expressed as an equivalent-electron count.
    Material introduced during the prefill phase is excluded.


    For carbon, the equivalent-electron count is defined by


    $$

    N_{\mathrm{eq},C}(t) = Z_C N_C(t) = 6 N_C(t)

    $$


    where $N_{\mathrm{eq},C}$ is the carbon equivalent-electron count, $N_C$ is the
    cumulative count of delivered carbon atoms after breakdown, and $Z_C=6$ is the
    atomic number of carbon.


    The count increases by six for every delivered neutral carbon atom and represents
    an atomic inventory, not an instantaneous injection rate or an ionization-state
    population. This is the carbon-specific instance of [count due to gas injection](name:count_due_to_gas_injection);
    temporal specializations such as [accumulated carbon count due to gas injection](name:accumulated_carbon_count_due_to_gas_injection)
    specify how the running total is reported in time.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:count_due_to_gas_injection
