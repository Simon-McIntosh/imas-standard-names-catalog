- name: neutron_heating_power_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Power deposited within a single breeding blanket module by neutron
    interactions, encompassing prompt kinetic energy transfer to nuclei and electrons,
    gamma heating from radiative capture and inelastic scattering, and exothermic
    nuclear reactions such as the tritium-breeding 6Li(n,t)alpha reaction. Distinct
    from incident neutron power (a surface flux integral) and from total deposited
    thermal power, which includes all heat sources.
  documentation: "The neutron heating power $P_\\mathrm{n,heat}$ of a breeding blanket\
    \ module is the total rate of energy deposition within the module volume arising\
    \ from all neutron-induced processes. This includes: (1) prompt kinetic energy\
    \ imparted to recoil nuclei and knock-on electrons via elastic and inelastic neutron\
    \ scattering; (2) gamma heating from secondary photons produced in radiative capture\
    \ $(n,\\gamma)$ and inelastic scattering $(n,n'\\gamma)$ reactions, where the\
    \ gammas deposit their energy locally via Compton scattering and pair production;\
    \ and (3) the exothermic $^6$Li$(n,t)\\alpha$ reaction, which releases approximately\
    \ 4.78 MeV per event and constitutes the primary tritium-breeding reaction.\n\n\
    The total energy deposition per neutron exceeds the incident neutron kinetic energy\
    \ by the energy multiplication factor $M$, typically in the range $M \\approx\
    \ 1.1$\u2013$1.3$ for a lithium-bearing blanket. This quantity differs from a\
    \ simple kerma (kinetic energy released to matter) calculation: in a thick blanket,\
    \ secondary photons produced at one location deposit energy at a different location,\
    \ and charged-particle equilibrium does not generally hold. A full volumetric\
    \ energy deposition calculation integrates over all reaction channels:\n\n$$P_\\\
    mathrm{n,heat} = \\int_V \\int_0^\\infty \\phi(\\mathbf{r}, E)\\, \\Sigma_\\mathrm{dep}(\\\
    mathbf{r}, E)\\, E_\\mathrm{dep}(E)\\, dE\\, dV$$\n\nwhere $\\phi(\\mathbf{r},\
    \ E)$ is the neutron flux density [n cm$^{-2}$ s$^{-1}$ MeV$^{-1}$] at position\
    \ $\\mathbf{r}$ and neutron energy $E$ [MeV], $\\Sigma_\\mathrm{dep}(\\mathbf{r},\
    \ E)$ [cm$^{-1}$] is the macroscopic cross-section weighted for energy deposition,\
    \ and $E_\\mathrm{dep}(E)$ [MeV] is the energy deposited per reaction at incident\
    \ energy $E$. The integral accounts for the spatial redistribution of secondary\
    \ photon energy, distinguishing it from a point-wise kerma approximation.\n\n\
    For a single first-wall-facing breeding blanket module in a fusion device, typical\
    \ values of $P_\\mathrm{n,heat}$ lie in the range of tens of kilowatts to several\
    \ megawatts depending on module size, toroidal/poloidal location, and first-wall\
    \ neutron wall loading (typically 0.5\u20132 MW m$^{-2}$ for ITER-class devices).\n\
    \nSign convention: Positive when energy is deposited into the module volume (energy\
    \ source for the module)."
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_neutron_power_of_breeding_blanket_module
  - name:extracted_thermal_power_of_breeding_blanket_module
  - name:neutron_thermal_power_of_breeding_blanket_module
  - name:nuclear_heating_power_of_breeding_blanket_layer
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_neutrons
    dd_path: breeding_blanket/module/time_slice/power_thermal_neutrons
    status: composed
- name: nuclear_heating_power_of_breeding_blanket
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited across the entire breeding blanket
    assembly by neutron and gamma radiation interactions.
  documentation: "The nuclear heating power of the breeding blanket, $P_{\\mathrm{nuc}}$,\
    \ is the volume-integrated power deposition rate from neutron scattering, neutron\
    \ capture, and gamma absorption throughout the complete blanket assembly. It is\
    \ governed by $P_{\\mathrm{nuc}} = \\int_V \\dot{q}'''(\\mathbf{r})\\, dV$, where\
    \ $\\dot{q}'''$ is the local nuclear volumetric heating rate integrated over the\
    \ full blanket volume $V$. In deuterium-tritium fusion reactors, roughly 80% of\
    \ the 14.1 MeV fusion neutron energy is ultimately deposited in the blanket as\
    \ nuclear heat; typical total values for a reactor-scale device are 1\u20133 GW.\
    \ This quantity serves as the top-level power budget for the breeding blanket,\
    \ complementing sub-component quantities such as [nuclear heating power of the\
    \ shield](name:nuclear_heating_power_of_breeding_blanket_shield) and [nuclear\
    \ heating power of a specific layer](name:nuclear_heating_power_of_breeding_blanket_layer).\
    \ It feeds directly into the balance-of-plant thermal analysis and is a key input\
    \ for assessing [tritium breeding ratio](name:tritium_breeding_ratio) alongside\
    \ [blanket neutron energy multiplication](name:blanket_neutron_energy_multiplication).\
    \ Values are computed by neutron transport codes (e.g., Monte Carlo particle transport)\
    \ applied to the full blanket geometry."
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeding_blanket_shield
  - name:nuclear_heating_power_of_breeding_blanket_layer
  - name:tritium_breeding_ratio
  - name:blanket_neutron_energy_multiplication
  constraints: []
  sources:
  - id: dd:breeding_blanket/time_slice/power_nuclear_blanket
    dd_path: breeding_blanket/time_slice/power_nuclear_blanket
    status: composed
- name: nuclear_heating_power_of_breeding_blanket_layer
  kind: scalar
  status: draft
  description: Total nuclear heating power from neutron and gamma interactions deposited
    in a specific layer within a breeding blanket module, summing all volumetric energy
    deposition processes across that layer's material volume.
  documentation: 'Nuclear heating in a breeding blanket layer arises from neutron
    elastic and inelastic scattering, radiative capture, and secondary gamma deposition
    within the layer''s structural and functional materials (e.g., first wall, multiplier,
    breeder, or coolant layers). The total nuclear heating power $P_{\rm nuc}$ is
    obtained by integrating the local nuclear heating rate density $q''''''_{\rm nuc}$
    over the layer volume $V_\ell$: $$P_{\rm nuc} = \int_{V_\ell} q''''''_{\rm nuc}\,
    dV,$$ where $q''''''_{\rm nuc}$ includes contributions from neutron kerma and
    gamma kerma in each material. This quantity is a layer-resolved specialization
    of [nuclear_heating_power_of_breeding_blanket](name:nuclear_heating_power_of_breeding_blanket),
    which integrates over the entire blanket assembly; summing over all layers and
    shield structures of a module should recover the module-level total. Typical layer-level
    nuclear heating powers depend strongly on layer position and composition: first-wall
    and multiplier layers immediately behind the plasma-facing surface experience
    the highest neutron flux, while deeper breeder and shield layers see attenuated
    values. Computed from neutronics transport codes (e.g., Monte Carlo or deterministic
    Sn solvers) using detailed material and geometry models; validation uses [blanket_neutron_energy_multiplication](name:blanket_neutron_energy_multiplication)
    as a consistency check on the integrated heating budget. The layer-level resolution
    also supports thermal-hydraulic coupling, where the deposited power drives coolant
    heat removal analyzed via [extracted_thermal_power_of_breeding_blanket_module](name:extracted_thermal_power_of_breeding_blanket_module).'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeding_blanket
  - name:blanket_neutron_energy_multiplication
  - name:extracted_thermal_power_of_breeding_blanket_module
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/layer/time_slice/power_nuclear
    dd_path: breeding_blanket/module/layer/time_slice/power_nuclear
    status: composed
- name: nuclear_heating_power_of_breeding_blanket_shield
  kind: scalar
  status: draft
  description: Nuclear heating power deposited in the neutron shield structures of
    the breeding blanket by neutron and gamma radiation interactions.
  documentation: 'The breeding blanket shield is a structural sub-assembly surrounding
    the tritium-breeding zone, designed to attenuate the neutron and gamma flux that
    would otherwise reach the vessel and superconducting coils. The total nuclear
    heating power $P_{\rm shield}$ is the volumetric integral of the nuclear energy
    deposition rate density $q''''''$ over the shield material volume: $$P_{\rm shield}
    = \int_{V_{\rm shield}} q''''''\, dV$$ where $q''''''$ (W m$^{-3}$) includes contributions
    from neutron scattering, neutron capture, and secondary gamma interactions. In
    D-T fusion reactor designs, the shield typically absorbs a fraction of the 14.1
    MeV neutron energy not already deposited in the breeding zone; typical values
    range from tens to hundreds of kilowatts per module depending on shield thickness,
    composition (e.g. steel, tungsten, water), and neutron flux level. This quantity
    complements [nuclear_heating_power_of_breeding_blanket](name:nuclear_heating_power_of_breeding_blanket),
    which covers the full blanket assembly, and [nuclear_heating_power_of_breeding_blanket_layer](name:nuclear_heating_power_of_breeding_blanket_layer),
    which resolves individual radial layers. It is computed from neutron transport
    codes (e.g. Monte Carlo or discrete-ordinates methods) applied to the blanket
    geometry and contributes to the total [thermal_power_load_of_breeding_blanket](name:thermal_power_load_of_breeding_blanket)
    used in plant thermal-hydraulic analysis.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeding_blanket
  - name:nuclear_heating_power_of_breeding_blanket_layer
  - name:thermal_power_load_of_breeding_blanket
  constraints: []
  sources:
  - id: dd:breeding_blanket/time_slice/power_nuclear_shields
    dd_path: breeding_blanket/time_slice/power_nuclear_shields
    status: composed
- name: radial_distance_from_first_wall_at_midplane
  kind: scalar
  status: draft
  description: Radial distance from the plasma-facing first wall surface to a reference
    point within a breeding blanket module, evaluated at the outboard equatorial midplane,
    with zero defined at the wall surface.
  documentation: "The radial distance from the first wall at the midplane quantifies\
    \ how deeply a given reference location within a breeding blanket module sits\
    \ behind the plasma-facing surface, measured along the major-radius direction\
    \ $R$ in the right-handed cylindrical $(R, \\phi, Z)$ frame at the equatorial\
    \ midplane ($Z = 0$). This geometric parameter governs the local neutron fluence\
    \ and nuclear heating profiles: regions closer to the first wall ($\\Delta R$\
    \ small) experience higher fast-neutron flux, while deeper zones contribute more\
    \ to tritium breeding via thermal-neutron capture in lithium-bearing materials.\
    \ Typical values range from 0 m at the wall to approximately 0.6\u20131.0 m at\
    \ the back of the blanket module, depending on reactor design. It is used alongside\
    \ the [midplane_thickness_of_breeding_blanket_layer](name:midplane_thickness_of_breeding_blanket_layer)\
    \ to locate individual breeding layers within the module stack, and complements\
    \ poloidal geometry descriptors such as [bottom_cap_thickness](name:bottom_cap_thickness)\
    \ and [top_cap_thickness](name:top_cap_thickness) in full 3-D neutronics models.\
    \ The quantity is determined from computer-aided design geometry or neutronics\
    \ mesh generation rather than direct plasma measurement.\n\nSign convention: Positive\
    \ when the reference point lies behind the first wall surface in the direction\
    \ of increasing major radius $R$, away from the plasma."
  unit: m
  physics_domain: structural_components
  links:
  - name:midplane_thickness_of_breeding_blanket_layer
  - name:bottom_cap_thickness
  - name:top_cap_thickness
  constraints: []
  sources:
  - id: dd:breeding_blanket/module/time_slice/midplane_wall_distance
    dd_path: breeding_blanket/module/time_slice/midplane_wall_distance
    status: composed
- name: resistance_of_structural_element
  kind: scalar
  status: draft
  description: Lumped electrical resistance of a discrete block element forming part
    of the cryostat or thermal shield structure, governing induced current magnitude
    in eddy-current analyzes.
  documentation: "The resistance $R$ of a structural block element quantifies the\
    \ element's opposition to electric current flow under an impressed electromotive\
    \ force, following Ohm's law $V = R I$, where $V$ is the voltage across the element\
    \ and $I$ the current through it. In the context of tokamak cryostat and thermal\
    \ shield assemblies, this lumped parameter is used in eddy-current circuit models\
    \ that predict induced currents and resulting electromagnetic forces during plasma\
    \ disruptions or fast field transients. The value depends on the element's geometry\
    \ and material: $R = \\rho \\, l / A$, where $\\rho$ is the material [electrical\
    \ resistivity](name:electrical_resistivity_of_structural_element), $l$ is the\
    \ current path length, and $A$ is the cross-sectional area. Typical cryostat structural\
    \ materials (stainless steel, aluminum alloys) yield element resistances in the\
    \ range $10^{-6}$\u2013$10^{-3}$ ohm, depending on element dimensions. This quantity\
    \ is distinct from the intrinsic material property captured by [electrical_resistivity_of_structural_element](name:electrical_resistivity_of_structural_element),\
    \ which carries units of m\xB7ohm and is independent of geometry."
  unit: ohm
  physics_domain: structural_components
  links:
  - name:electrical_resistivity_of_structural_element
  constraints: []
  sources:
