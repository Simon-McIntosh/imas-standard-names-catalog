    where $\Phi_{\mathrm{tor},b}$ is the toroidal magnetic flux enclosed by the plasma
    boundary, $B_0$ is the reference toroidal magnetic field, and $b$ denotes evaluation
    at the boundary. The principal square root is used.


    This quantity is the outer endpoint of the dimensional toroidal-flux radial coordinate
    and is distinct from [toroidal flux radius at the magnetic axis](name:toroidal_flux_radius_of_magnetic_axis),
    which evaluates the same coordinate at the central flux surface.'
