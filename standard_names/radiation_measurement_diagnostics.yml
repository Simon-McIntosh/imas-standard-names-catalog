- name: second_coordinate_width_of_reflector
  kind: scalar
  status: draft
  description: Full edge-to-edge extent of a rectangular reflector element measured
    along the second local coordinate direction X2, lying within the reflector surface
    plane. This non-negative length, together with the first coordinate width, fully
    characterizes the active area of a rectangular reflector. Applies only when the
    reflector geometry type is rectangular.
  documentation: 'The second coordinate width $w_2$ of a reflector is the full edge-to-edge
    span of the reflecting surface measured along the X2 axis of the local instrument
    reference frame $(X1, X2)$, where X1 and X2 are orthogonal axes lying in the reflector
    plane. It is defined as the total distance between opposite edges projected onto
    the X2 axis:


    $$w_2 = x_{2,\mathrm{max}} - x_{2,\mathrm{min}}$$


    where $x_{2,\mathrm{max}}$ and $x_{2,\mathrm{min}}$ are the outermost boundary
    positions along X2, independent of any choice of element center or reference origin.
    This quantity is strictly non-negative.


    Together with [first_coordinate_width_of_reflector](name:first_coordinate_width_of_reflector),
    $w_2$ fully characterizes the rectangular active area $w_1 \times w_2$ of the
    reflector element. For a circular reflector, the relevant dimension is instead
    the [radius_of_reflector](name:radius_of_reflector), and for polygonal boundaries
    the X2 vertex positions are described by [second_coordinate_of_reflector_outline](name:second_coordinate_of_reflector_outline).
    The corresponding surface curvature of the reflector in the X2 direction is captured
    by [second_coordinate_radius_of_curvature_of_reflector](name:second_coordinate_radius_of_curvature_of_reflector).


    This parameter applies only to rectangular reflector geometry. Typical X2 widths
    for laboratory and fusion X-ray crystal spectrometer reflectors range from a few
    millimeters to several centimeters, depending on the optical design and the desired
    solid angle of radiation collection.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
