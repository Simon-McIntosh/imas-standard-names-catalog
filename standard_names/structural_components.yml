- name: thickness_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Layer-normal distance between the inner and outer material interfaces
    of a breeder blanket layer at the equatorial midplane of a module. For radially
    stacked layers in the right-handed cylindrical (R, phi, Z) frame, it coincides
    with the midplane radial build.
  documentation: 'The thickness of a breeder blanket layer is the local separation
    between the layer''s two bounding material interfaces at the equatorial midplane
    of a blanket module. It is a layer-normal through-thickness, not the toroidal
    width, poloidal height, or a volume-equivalent thickness. For radially stacked
    layers it is the radial build in the right-handed cylindrical $(R, \phi, Z)$ system,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    A local midplane thickness for layer $i$ can be defined from the interface positions
    and the local layer normal:


    $$

    d_i = \left|\left(\mathbf{x}_{i,\mathrm{out}} - \mathbf{x}_{i,\mathrm{in}}\right)
    \cdot \hat{\mathbf{n}}_i\right|

    $$


    where $d_i$ is the layer thickness in m, $\mathbf{x}_{i,\mathrm{in}}$ and $\mathbf{x}_{i,\mathrm{out}}$
    are points on the inner and outer bounding interfaces at the midplane in m, and
    $\hat{\mathbf{n}}_i$ is the unit normal through the layer. When the interfaces
    are locally normal to the major-radius direction, this reduces to the absolute
    midplane difference in $R$. The total build along the same normal may be written
    inline as $D=\sum_i d_i$, with each $d_i$ and the total $D$ in m.


    In practice this quantity is obtained from engineering geometry or a neutronics
    model by intersecting the blanket module with the equatorial midplane, identifying
    consecutive material interfaces, and measuring their spacing along the layer-normal
    direction. When combined with [nuclear_power_density_of_breeder_blanket_layer](name:nuclear_power_density_of_breeder_blanket_layer),
    the product of local nuclear power density and thickness gives an areal power
    contribution in W/m^2 for approximately uniform heating along the normal; total
    power requires integration over the layer volume.


    Typical individual layer thicknesses range from 0.001-0.01 m for thin coatings
    or liners, 0.01-0.10 m for coolant, structural, multiplier, or breeder sublayers,
    and 0.1-0.6 m for large breeding or shielding regions. Complete blanket radial
    builds are commonly of order 0.5-1.5 m, depending on device size and shielding
    requirements.'
  unit: m
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_layer
  - name:thickness_of_breeder_blanket_module
  - name:lower_thickness_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/layer/midplane_thickness
    dd_path: breeding_blanket/module/layer/midplane_thickness
    status: composed
- name: thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Normal distance through the side-wall material of a breeding blanket
    module, measured between the inner face bounding the module interior and the outer
    side-wall face. It is the structural side-wall extent of the module as a whole,
    distinct from the thickness of an individual breeder layer within the module.
  documentation: 'Thickness of a breeder blanket module is the through-wall distance
    across the module side wall, taken normal to the wall between its inner face (bounding
    the module interior) and its outer face. It quantifies the lateral structural
    material enclosing the module and is distinct from the thickness of an individual
    breeder layer in the internal stack.


    The local wall-normal thickness is the projection of the separation between opposing
    wall faces onto the unit normal of the reference wall surface:


    $$

    t = \left|\left(\mathbf{x}_{\mathrm{out}} - \mathbf{x}_{\mathrm{in}}\right) \cdot
    \hat{\mathbf{n}}\right|

    $$


    where $\mathbf{x}_{\mathrm{in}}$ and $\mathbf{x}_{\mathrm{out}}$ are corresponding
    points on the inner and outer side-wall faces, $\hat{\mathbf{n}}$ is the local
    unit normal directed through the wall, and $t$ is in meters. As a magnitude it
    is non-negative by construction. For curved or tapered walls this is a local or
    nominal engineering thickness and is not in general a simple difference in major
    radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The value is obtained from the module envelope or detailed engineering geometry
    at the specified side-wall reference section. Together with material composition,
    layer thicknesses, and the poloidal cap thicknesses it governs mechanical stiffness,
    thermal conduction paths, neutron attenuation, and the volume available for tritium
    breeding material, without itself defining the internal layer arrangement.


    Typical values are design dependent and lie on the centimeter-to-decimeter scale,
    roughly 0.01-0.3 m across common blanket module concepts, with the appropriate
    value set by module size, structural material, coolant and breeder arrangement,
    neutron shielding requirements, and mechanical load margins.'
  unit: m
  physics_domain: structural_components
  links:
  - name:lower_thickness_of_breeder_blanket_module
  - name:upper_thickness_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/side_wall_thickness
    dd_path: breeding_blanket/module/side_wall_thickness
    status: composed
  - id: dd:breeding_blanket/module/time_slice/midplane_wall_distance
    dd_path: breeding_blanket/module/time_slice/midplane_wall_distance
    status: composed
- name: lower_thickness_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Physical extent of the lower cap of a breeder blanket module, measured
    through the cap between its lower exterior boundary surface and its interface
    with the main module body along the local surface normal. It is a non-negative
    geometric length in meters, not a signed coordinate displacement.
  documentation: 'Lower thickness of a breeder blanket module is the non-negative
    length variable that describes the physical extent of the module''s lower cap.
    It is measured through the cap from the lower exterior boundary surface to the
    interface where the cap joins the main module body, along the local normal to
    the lower cap surface. The word lower identifies the lower poloidal end of the
    module; the quantity is not an overall module dimension or a signed vertical position.


    For a locally smooth cap, the thickness can be represented as the projected separation
    between the two reference surfaces:


    $$

    t_{\mathrm{lower}} = \left|\left(\mathbf{x}_{\mathrm{int}} - \mathbf{x}_{\mathrm{ext}}\right)
    \cdot \hat{\mathbf{n}}_{\mathrm{lower}}\right|

    $$


    where $t_{\mathrm{lower}}$ is the lower cap thickness in m, $\mathbf{x}_{\mathrm{ext}}$
    is a point on the lower exterior boundary surface in m, $\mathbf{x}_{\mathrm{int}}$
    is the corresponding point on the interface with the main module body in m, and
    $\hat{\mathbf{n}}_{\mathrm{lower}}$ is the dimensionless unit normal pointing
    from the exterior boundary toward that interface. The absolute value expresses
    that this is a length. The measurement direction is a local surface-normal direction,
    not a projection along $R$ or $Z$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    In practice the value is taken from the engineering geometry or design definition
    of the blanket module. If the lower cap is curved, tapered, or has nonparallel
    reference surfaces, local projected separations can vary; this scalar should denote
    the nominal design thickness specified for the lower cap. Minimum, maximum, average,
    or location-specific lower-cap thicknesses should be defined explicitly rather
    than substituted for this quantity unless the design definition states that the
    nominal scalar is one of those values.


    Typical values are design-dependent and should be checked against the surrounding
    module geometry. Conceptual breeder blanket cap dimensions are commonly centimeter-
    to decimeter-scale engineering lengths, roughly 0.01-0.3 m, and should remain
    consistent with related dimensions such as [thickness_of_breeder_blanket_module](name:thickness_of_breeder_blanket_module),
    [thickness_of_breeder_blanket_layer](name:thickness_of_breeder_blanket_layer),
    and radial_distance_at_midplane.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_breeder_blanket_module
  - name:thickness_of_breeder_blanket_layer
  arguments:
  - name: thickness_of_breeder_blanket_module
    operator: lower
    operator_kind: qualifier
  sources:
  - id: dd:breeding_blanket/module/bottom_cap_thickness
    dd_path: breeding_blanket/module/bottom_cap_thickness
    status: composed
- name: thickness_of_cryostat
  kind: scalar
  status: draft
  description: Physical wall thickness of the cryostat structural vessel, measured
    as the through-wall distance between its inner and outer faces along the local
    wall normal. For an annular layer this is perpendicular to the vessel centerline;
    for a block element it is evaluated along the wall-normal line through the element
    midplane.
  documentation: 'Thickness of the cryostat is the local through-wall extent of the
    load-bearing cryostat vessel material between its inner and outer faces. It is
    a structural geometry parameter for the cryostat wall and is distinct from the
    effective thermal shielding thickness represented by [thermal_thickness_of_cryostat](name:thickness_of_cryostat).


    The general wall-normal definition is the absolute projection of the separation
    between corresponding inner and outer surface points onto the local unit normal:


    $$

    t_c = \left|\left(\mathbf{x}_\mathrm{out} - \mathbf{x}_\mathrm{in}\right) \cdot
    \hat{\mathbf{n}}\right|

    $$


    where $t_c$ is the cryostat thickness, $\mathbf{x}_\mathrm{in}$ and $\mathbf{x}_\mathrm{out}$
    are the inner- and outer-face position vectors in meters, and $\hat{\mathbf{n}}$
    is the local unit normal to the wall. For an annular layer this reduces to the
    radial span $R_\mathrm{out}-R_\mathrm{in}$, with $R_\mathrm{in}$ and $R_\mathrm{out}$
    in meters in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius and $Z$ is vertical height. For a block element the same through-wall distance
    is taken along the wall-normal line passing through the element midplane. The
    absolute value expresses that thickness is non-negative.


    The thickness is obtained from engineering geometry, design drawings, or surveyed
    vessel dimensions and is used in structural stiffness, vacuum-load, thermal-mass,
    and electromagnetic response estimates. The related [thickness_of_vacuum_vessel](name:thickness_of_vacuum_vessel)
    applies the same wall-normal concept to the vacuum vessel, while [resistivity_of_cryostat](name:resistivity_of_cryostat)
    is a material property used with the cryostat geometry in electromagnetic calculations.


    Representative cryostat wall or layer thicknesses are typically about 0.02-0.2
    m for shell panels and local annular layers, with reinforced regions, flanges,
    or block-like structural elements sometimes reaching about 0.5 m. Actual values
    depend on vessel size, pressure loading, support layout, penetrations, and reinforcement
    strategy.'
  unit: m
  physics_domain: structural_components
  links:
  - name:thickness_of_vacuum_vessel
  - name:resistivity_of_cryostat
  sources:
