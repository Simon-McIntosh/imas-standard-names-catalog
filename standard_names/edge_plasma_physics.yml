- name: poloidal_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: "Poloidal component of the electric current density produced by ion-neutral\
    \ frictional momentum exchange, resolved along increasing poloidal angle \u03B8\
    \ in flux coordinates (\u03C1, \u03B8, \u03C6)."
  documentation: 'Poloidal current density due to ion-neutral friction is the component
    of the ion-neutral-friction current density in the direction of increasing poloidal
    angle $\theta$ in flux coordinates $(\rho,\theta,\phi)$. The poloidal direction
    lies in the poloidal cross-section described by the right-handed cylindrical $(R,\phi,Z)$
    frame at fixed $\phi$ and is tangent to a magnetic surface; radial, toroidal,
    and parallel projections describe related components of the same friction-driven
    current contribution.


    The component is defined by projection of the ion-neutral-friction current density
    vector onto the local poloidal unit direction:


    $$

    j_{\theta}^{(in)} = \mathbf{j}^{(in)} \cdot \hat{\mathbf{e}}_{\theta}

    $$


    where $j_{\theta}^{(in)}$ is this scalar current density in $\mathrm{A\,m^{-2}}$,
    $\mathbf{j}^{(in)}$ is the ion-neutral-friction current density vector in $\mathrm{A\,m^{-2}}$,
    and $\hat{\mathbf{e}}_{\theta}$ is the dimensionless unit vector in the direction
    of increasing $\theta$. The underlying momentum-transfer source is commonly represented
    by an ion-neutral friction force density $\mathbf{R}_{in}=\sum_i m_i n_i \nu_{in}(\mathbf{u}_n-\mathbf{u}_i)$,
    where $m_i$ is ion mass in kg, $n_i$ is ion number density in $\mathrm{m^{-3}}$,
    $\nu_{in}$ is an effective ion-neutral momentum-transfer frequency in $\mathrm{s^{-1}}$,
    and $\mathbf{u}_n$ and $\mathbf{u}_i$ are neutral and ion fluid velocities in
    $\mathrm{m\,s^{-1}}$. The conversion from this force density to $\mathbf{j}^{(in)}$
    depends on the charged-species momentum balance, electromagnetic geometry, and
    transport closure; no universal algebraic cross-product formula is implied.


    This quantity is usually obtained from edge plasma fluid, kinetic-fluid, or coupled
    plasma-neutral calculations rather than measured directly. Multispecies ion and
    neutral populations contribute through their individual momentum-transfer rates,
    including elastic scattering and charge exchange, and the reported scalar is the
    sum of the corresponding current contributions after projection onto $\hat{\mathbf{e}}_{\theta}$.
    It is the poloidal member of the component decomposition that also includes [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction),
    [toroidal_current_density_due_to_ion_neutral_friction](name:toroidal_current_density_due_to_ion_neutral_friction),
    and [parallel_current_density_due_to_ion_neutral_friction](name:parallel_current_density_due_to_ion_neutral_friction);
    it is narrower than [poloidal_current_density_due_to_collisions](name:poloidal_current_density_due_to_collisions),
    which includes broader collisional current contributions.


    Typical modeled magnitudes in partially ionized scrape-off-layer and divertor
    plasmas are order $0.1-100\ \mathrm{A\,m^{-2}}$, with localized high-recycling
    or detached regions sometimes reaching order $10^2-10^3\ \mathrm{A\,m^{-2}}$.
    In hotter, more fully ionized regions the ion-neutral-friction contribution is
    usually negligible compared with other current-density terms.


    Sign convention: Positive when the ion-neutral-friction current density has a
    component in the direction of increasing poloidal angle $\theta$ in flux coordinates
    $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: "Poloidal component of the current density arising from perpendicular\
    \ viscosity effects in the plasma momentum balance. It represents the part of\
    \ the viscosity-driven drift current parallel to increasing \u03B8 in a flux-coordinate\
    \ system (\u03C1, \u03B8, \u03C6)."
  documentation: 'Poloidal current density due to perpendicular viscosity is the component,
    along the poloidal direction of a flux-coordinate system $(\rho,\theta,\phi)$,
    of the electric current density driven by the divergence of the perpendicular
    viscous stress tensor. The perpendicular viscous stress represents momentum transport
    associated with velocity shear perpendicular to the local magnetic field, and
    its divergence acts as a force density in the perpendicular momentum balance.


    The viscosity-driven current density and its poloidal projection are defined by:


    $$

    j_\theta^{\Pi_\perp} = \hat{\mathbf{e}}_\theta \cdot \mathbf{j}^{\Pi_\perp}, \qquad

    \mathbf{j}^{\Pi_\perp} = \frac{\mathbf{B} \times (\nabla \cdot \boldsymbol{\Pi}_\perp)}{B^2}

    $$


    where $j_\theta^{\Pi_\perp}$ and $\mathbf{j}^{\Pi_\perp}$ are current densities
    in A m^-2, $\hat{\mathbf{e}}_\theta$ is the dimensionless unit vector in the increasing-$\theta$
    direction, $\mathbf{B}$ is the magnetic field in T, $B=|\mathbf{B}|$, $\boldsymbol{\Pi}_\perp$
    is the perpendicular viscous stress tensor, and $\nabla \cdot \boldsymbol{\Pi}_\perp$
    is a force density in N m^-3.


    This quantity is usually obtained from edge plasma fluid or kinetic-fluid calculations
    rather than measured directly. It depends on the chosen viscosity model, collisionality,
    magnetic geometry, and gradients of density, temperature, and flow, and it is
    combined with other viscosity-related contributions such as [poloidal_current_density_due_to_parallel_viscosity](name:poloidal_current_density_due_to_parallel_viscosity)
    and [poloidal_current_density_due_to_heat_viscosity](name:poloidal_current_density_due_to_heat_viscosity)
    to form [poloidal_current_density_due_to_viscosity](name:poloidal_current_density_due_to_viscosity).


    Typical modeled magnitudes in edge and scrape-off-layer conditions range from
    below 1 A m^-2 to 10^3 A m^-2, with larger localized values possible near strong
    flow shear, steep pressure gradients, or material boundaries.


    Sign convention: Positive when the current density points in the direction of
    increasing poloidal angle $\theta$ in the flux-coordinate system $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_current_density_due_to_parallel_viscosity
  - name:poloidal_current_density_due_to_heat_viscosity
  - name:poloidal_current_density_due_to_viscosity
  - name:toroidal_current_density_due_to_perpendicular_viscosity
  arguments:
  - name: current_density_due_to_perpendicular_viscosity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_electron_diffusivity
  kind: scalar
  status: draft
  description: "Effective scalar diffusion coefficient for electron particle transport\
    \ along the poloidal angle in flux coordinates (\u03C1, \u03B8, \u03C6). It multiplies\
    \ the metric-scaled electron-density gradient to give the diffusive flux component,\
    \ with that flux component taken positive toward increasing \u03B8."
  documentation: 'Poloidal electron diffusivity is an effective scalar transport coefficient
    for electron particles along the poloidal direction on a magnetic flux surface.
    In flux coordinates $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$
    is the poloidal angle, and $\phi$ is the toroidal angle, it quantifies how a poloidal
    electron-density gradient drives a diffusive particle flux.


    The local Fick-law convention for the physical poloidal flux component is:


    $$

    \Gamma^{\mathrm{diff}}_{e,\theta} = -D_{e,\theta}\,\frac{1}{h_\theta}\frac{\partial
    n_e}{\partial \theta}

    $$


    where $D_{e,\theta}$ is the poloidal electron diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Gamma^{\mathrm{diff}}_{e,\theta}$ is the diffusive electron particle flux in
    $\mathrm{m^{-2}\,s^{-1}}$, $n_e$ is the electron density in $\mathrm{m^{-3}}$,
    and $h_\theta = |\partial \mathbf{x}/\partial\theta|$ is the metric scale factor
    in meters converting an increment $d\theta$ at fixed $\rho$ and $\phi$ into poloidal
    distance. The flux component is taken positive in the local direction of increasing
    $\theta$; for $D_{e,\theta}>0$, the flux is down the metric-scaled density gradient.


    This coefficient is not normally measured directly. It is inferred or prescribed
    by combining electron density information with particle-balance constraints and
    an assumed separation between diffusive transport and other contributions such
    as convection, sources, sinks, and parallel losses.


    No universal numerical range is fixed by the definition, because the value is
    an effective transport coefficient and depends on the plasma state and on how
    non-diffusive transport is represented. Non-negative values correspond to a dissipative
    down-gradient diffusive closure, while zero gives no diffusive poloidal electron
    particle flux from a finite poloidal density gradient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_electron_diffusion_coefficient
  - name:poloidal_ion_diffusivity
  - name:poloidal_electron_energy_diffusivity
  arguments:
  - name: electron_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_electron_energy_diffusivity
  kind: scalar
  status: draft
  description: Poloidal electron energy diffusivity is the effective scalar transport
    coefficient for diffusive spreading of electron thermal energy along the poloidal
    direction on a magnetic surface. It relates the poloidal heat-flux projection
    to the local poloidal electron-temperature gradient.
  documentation: 'Poloidal electron energy diffusivity is an effective scalar coefficient
    for conductive transport of electron thermal energy in the poloidal direction
    on a magnetic surface. It represents the diffusive part of the electron energy
    transport closure, distinct from convective heat flow, particle-energy convection,
    radiation, and volumetric sources.


    In a local Fickian heat-flux closure using flux coordinates $(\rho, \theta, \phi)$,
    where $\theta$ is the chosen poloidal angle and $\phi$ is the toroidal angle of
    the right-handed cylindrical $(R, \phi, Z)$ frame with $R$ major radius and $Z$
    vertical height, the scalar poloidal projection can be written as:


    $$

    q_{e,\theta}^{\mathrm{cond}} = - n_e e\, \chi_{e,\theta}\, \hat{\mathbf{e}}_\theta
    \cdot \nabla T_e

    $$


    where $q_{e,\theta}^{\mathrm{cond}}$ is the conductive electron heat-flux component
    in W m$^{-2}$, $n_e$ is electron density in m$^{-3}$, $e$ is the elementary charge
    magnitude in J eV$^{-1}$, $\chi_{e,\theta}$ is the poloidal electron energy diffusivity
    in m$^2$ s$^{-1}$, $T_e$ is electron temperature in eV, and $\hat{\mathbf{e}}_\theta
    \cdot \nabla T_e$ is the temperature gradient per unit length in the direction
    of increasing $\theta$, in eV m$^{-1}$. If $T_e$ is expressed directly as an energy
    in joules, the conversion factor $e$ is omitted. The minus sign gives heat flow
    toward lower electron temperature; the coefficient itself is the scalar multiplying
    this projected gradient.


    The coefficient is usually prescribed or inferred in edge-fluid and transport
    modeling by matching electron temperature, density, and heat-flux balances. It
    may summarize unresolved collisional, turbulent, or numerical transport only within
    the limits of a local diffusive closure; nonlocal, off-diagonal, or advective
    transport should be represented by separate model terms rather than folded into
    this scalar coefficient.


    Typical modeled edge-plasma values are highly regime- and closure-dependent. Values
    of order 0.01-10 m^2.s^-1 are common in reduced transport descriptions, while
    broader phenomenological scans may extend from near zero to about 100 m^2.s^-1
    when enhanced effective transport is being represented.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_electron_diffusivity
  arguments:
  - name: electron_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective scalar diffusion coefficient for poloidal transport of ion
    thermal energy. In a diffusive closure, it multiplies the poloidal gradient of
    ion energy density to give the down-gradient ion energy flux.
  documentation: 'Poloidal ion energy diffusivity is an effective scalar transport
    coefficient for diffusive redistribution of ion thermal energy along the poloidal
    direction. The poloidal direction is tangent to increasing poloidal angle $\theta$
    at fixed radial flux coordinate $\rho$ and toroidal angle $\phi$ in a flux-coordinate
    representation $(\rho, \theta, \phi)$. It characterizes the ion energy channel
    and should be distinguished from aggregate total-ion or total-plasma energy transport
    coefficients when those channels are defined separately.


    A common local down-gradient closure for the diffusive poloidal ion energy flux
    is:


    $$

    q_{\theta,i}^{E,\mathrm{diff}} = -D_{\theta,i}^{E}\,\frac{\partial \varepsilon_i}{\partial
    l_\theta}

    $$


    where $q_{\theta,i}^{E,\mathrm{diff}}$ is the poloidal diffusive ion energy flux
    density in W.m^-2, $D_{\theta,i}^{E}$ is the poloidal ion energy diffusivity in
    m^2.s^-1, $\varepsilon_i$ is the ion thermal energy density in J.m^-3, and $l_\theta$
    is poloidal arclength in meters. For a Maxwellian ion population, $\varepsilon_i
    = 3p_i/2$, where $p_i$ is ion pressure; equivalently, $\varepsilon_i = 3n_iT_i/2$
    when $T_i$ is expressed as energy per particle. The minus sign means that a positive
    diffusivity drives the diffusive contribution from higher toward lower ion thermal
    energy density.


    In practice this coefficient is usually specified, fitted, or inferred within
    edge-plasma transport modeling from ion temperature, density, pressure, and heat-flux
    constraints rather than measured directly as a material property. It is the poloidal
    ion-energy analog of radial transport quantities such as radial_total_energy_diffusion_coefficient,
    [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity),
    and [radial_diffusion_coefficient](name:radial_ion_particle_diffusivity), and
    it is related to [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity) and
    [poloidal_ion_momentum_diffusivity](name:poloidal_ion_momentum_diffusivity) for
    particle and momentum transport in the same direction. Use [poloidal_total_ion_energy_diffusivity](name:poloidal_ion_energy_diffusivity)
    when the modeled coefficient applies to an aggregate total-ion energy channel.


    Typical effective values are strongly model and region dependent, with no universal
    range. Edge transport studies commonly explore broad values such as 0.01-100 m^2.s^-1;
    values near zero suppress modeled poloidal energy diffusion, while larger values
    more rapidly smooth poloidal variations of ion energy density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_particle_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  arguments:
  - name: ion_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective scalar poloidal component of the ion momentum diffusivity
    tensor; it governs diffusive transport tangent to increasing poloidal angle on
    a magnetic surface. In a Fick-law closure, positive values make the signed diffusive
    momentum flux oppose the gradient of the scalar ion momentum-density component.
  documentation: 'Poloidal ion momentum diffusivity is the effective scalar coefficient
    for diffusive transport of ion momentum along the poloidal direction. The poloidal
    direction is tangent to increasing poloidal angle $\theta$ on a magnetic surface,
    for example in flux coordinates $(\rho, \theta, \phi)$ with $\rho$ a radial flux
    label and $\phi$ the toroidal angle. When a tensor momentum-diffusion model is
    reduced to directional scalar components, this quantity corresponds to the poloidal
    diagonal component for the combined ion population rather than a single ionization
    state.


    In a local Fick-law closure written along poloidal arc length $l_\theta$, the
    signed diffusive flux of the scalar poloidal ion momentum-density component is


    $$

    \Gamma_{M_i,\theta}^{\mathrm{diff}} = - D_{M_i,\theta} \frac{\partial M_{i,\theta}}{\partial
    l_\theta}

    $$


    where $D_{M_i,\theta}$ is the poloidal ion momentum diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Gamma_{M_i,\theta}^{\mathrm{diff}}$ is the signed poloidal diffusive flux of
    poloidal ion momentum in $\mathrm{N\,m^{-2}}$, $M_{i,\theta}$ is the scalar poloidal
    ion momentum-density component in $\mathrm{kg\,m^{-2}\,s^{-1}}$, and $l_\theta$
    is distance in meters increasing with $\theta$. For multiple ionization states,
    $M_{i,\theta}$ represents the summed ion momentum-density projection used by the
    fluid closure.


    This coefficient is inferred or prescribed in edge momentum-transport modeling
    from momentum balance, ion flow measurements, density and temperature constraints,
    source terms, and closures for turbulent, neoclassical, and collisional transport.
    It is the diffusivity counterpart to the signed [poloidal_ion_momentum_flux](name:poloidal_ion_momentum_flux),
    and it is distinct from charge-state-resolved coefficients such as [poloidal_ion_state_momentum_diffusivity](name:poloidal_ion_state_momentum_diffusivity)
    and from neutral momentum transport represented by [poloidal_neutral_momentum_diffusivity](name:poloidal_neutral_momentum_diffusivity).


    Representative effective values in edge transport applications are often of order
    0.01-10 m^2 s^-1, but the appropriate value is highly dependent on turbulence
    level, collisionality, magnetic geometry, and the chosen closure. Non-negative
    finite values represent ordinary down-gradient diffusion; negative fitted values
    indicate an up-gradient effective closure and require explicit physical or modeling
    justification.


    Sign convention: Positive when, in flux coordinates $(\rho, \theta, \phi)$, the
    signed diffusive poloidal ion momentum flux is opposite to the gradient of the
    scalar poloidal ion momentum-density component along increasing poloidal angle
    $\theta$.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_diffusivity
  - name:poloidal_ion_state_momentum_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_ion_diffusivity
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_state_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal ion-state diffusivity is the scalar diagonal transport coefficient\
    \ for diffusive particle transport of a specified ion charge state along increasing\
    \ poloidal angle in a chosen flux-coordinate system (\u03C1, \u03B8, \u03C6).\
    \ It multiplies the charge-state density gradient to give the down-gradient poloidal\
    \ particle flux."
  documentation: 'Poloidal ion-state diffusivity is the scalar diagonal component
    of charge-state-resolved ion particle diffusion in the physical poloidal direction
    associated with increasing $\theta$ in a specified flux-coordinate system $(\rho,\theta,\phi)$.
    It applies to one ionization state $z$ and is the charge-state-resolved counterpart
    of [poloidal_ion_diffusivity](name:poloidal_ion_diffusivity), with analogous role
    to momentum transport coefficients such as [poloidal_ion_state_momentum_diffusivity](name:poloidal_ion_state_momentum_diffusivity).


    The local down-gradient closure for the poloidal particle flux component is


    $$

    \Gamma_{\mathrm{pol},z} = -D_{\mathrm{pol},z}\,\nabla_{\mathrm{pol}} n_z

    $$


    where $\Gamma_{\mathrm{pol},z}$ is the charge-state particle flux density along
    the poloidal direction in $m^{-2}\,s^{-1}$, $D_{\mathrm{pol},z}$ is the poloidal
    ion-state diffusivity in $m^2\,s^{-1}$, $n_z$ is the ion number density for charge
    state $z$ in $m^{-3}$, and $\nabla_{\mathrm{pol}} n_z$ is the physical poloidal
    component of the density gradient in $m^{-4}$. The minus sign means that, for
    $D_{\mathrm{pol},z}>0$, the diffusive flux is opposite to the density gradient;
    if density increases along increasing $\theta$, the diffusive flux component points
    toward decreasing $\theta$.


    In edge plasma particle-balance modeling, this coefficient is used when ionization
    states are evolved separately and poloidal redistribution of each charge-state
    population must be represented. It may be prescribed as an effective transport
    parameter or constrained by comparisons with charge-state-sensitive density measurements,
    together with ionization, recombination, parallel losses, and boundary conditions.


    There is no device-independent numerical range fixed by the definition. In a purely
    diffusive closure it is normally treated as non-negative: $D_{\mathrm{pol},z}=0$
    removes this diffusive channel, while larger values more strongly smooth poloidal
    variations of the charge-state density.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_diffusivity
  - name:poloidal_ion_state_momentum_diffusivity
  - name:poloidal_ion_energy_diffusivity
  arguments:
  - name: ion_state_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal diagonal component of the ion charge-state momentum diffusivity,\
    \ governing diffusive transport of that state\u2019s ion momentum density in the\
    \ poloidal direction."
  documentation: 'Poloidal ion state momentum diffusivity is the diagonal transport
    coefficient for diffusive transport of momentum density associated with a specified
    ion charge state along the poloidal direction on a magnetic flux surface. It is
    distinct from a charge-state-summed ion momentum diffusion coefficient, which
    represents transport of total ion momentum density over all ion charge states.


    In flux coordinates $(\rho,\theta,\phi)$, where $\rho$ labels flux surfaces, $\theta$
    is a poloidal angle, and $\phi$ is the toroidal angle of the right-handed cylindrical
    $(R,\phi,Z)$ frame with $R$ major radius and $Z$ vertical height, the diffusive
    poloidal flux of poloidal momentum density for charge state $s$ may be written
    as:


    $$

    \Pi_\theta^{(s)} = -D_\theta^{(s)}\,\nabla_\theta\left(n_s m_s u_\theta^{(s)}\right)

    $$


    where $D_\theta^{(s)}$ is the poloidal ion state momentum diffusivity in $\mathrm{m^2\,s^{-1}}$,
    $\Pi_\theta^{(s)}$ is the diffusive poloidal flux of poloidal momentum density
    in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $n_s$ is the ion density of charge state $s$
    in $\mathrm{m^{-3}}$, $m_s$ is the ion mass in $\mathrm{kg}$, and $u_\theta^{(s)}$
    is the physical poloidal flow velocity in $\mathrm{m\,s^{-1}}$. The metric convention
    is $\nabla_\theta f = h_\theta^{-1}\partial f/\partial\theta$, where $h_\theta
    = |\partial\mathbf{x}/\partial\theta|$ is the poloidal metric scale factor in
    meters, so $\nabla_\theta f$ is a derivative per unit distance along the poloidal
    coordinate line.


    This diffusivity is inferred from poloidal momentum balance, charge-state-resolved
    flow measurements, and theoretical or reduced descriptions of collisional and
    turbulent momentum mixing. It represents only the diffusive contribution; convective
    transport, external torques, ionization and recombination sources, and interspecies
    momentum exchange are separate terms in a full momentum balance.


    Typical edge-plasma values are about $0.01-10\ \mathrm{m^2\,s^{-1}}$. Values below
    $0.1\ \mathrm{m^2\,s^{-1}}$ indicate weak poloidal momentum mixing, while values
    of $1-10\ \mathrm{m^2\,s^{-1}}$ are representative of stronger effective transport
    in turbulent or highly collisional edge regions.


    Sign convention: Positive when a positive $\nabla_\theta(n_s m_s u_\theta^{(s)})$
    in flux coordinates $(\rho,\theta,\phi)$ produces a diffusive poloidal momentum
    flux in the negative $\theta$ direction, so the flux flows down the poloidal gradient.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_ion_state_diffusivity
  - name:poloidal_ion_energy_diffusivity
  - name:poloidal_neutral_momentum_diffusivity
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_energy_diffusivity
  kind: scalar
  status: draft
  description: "Effective diagonal diffusivity for neutral-particle energy transport\
    \ in the poloidal direction of flux coordinates (\u03C1, \u03B8, \u03C6), tangent\
    \ to a flux surface at fixed \u03C1 and \u03C6. It relates the length-normalized\
    \ poloidal gradient of neutral energy density to the diffusive poloidal energy\
    \ flux."
  documentation: 'Poloidal neutral energy diffusivity is the effective diagonal diffusion
    coefficient for transport of neutral-particle energy along the poloidal direction
    in flux coordinates $(\rho,\theta,\phi)$. The direction is tangent to a flux surface
    at fixed $\rho$ and $\phi$, and the coefficient represents how rapidly neutral
    thermal or internal energy is smoothed along that direction.


    A Fick-law closure for the poloidal neutral energy flux density is


    $$

    q_\theta^{\mathrm{n},E} = -D_\theta^{\mathrm{n},E}\,\frac{1}{h_\theta}\,\frac{\partial
    u_n}{\partial \theta}

    $$


    where $q_\theta^{\mathrm{n},E}$ is the neutral energy flux density taken positive
    in the direction of increasing poloidal angle $\theta$, $D_\theta^{\mathrm{n},E}$
    is the poloidal neutral energy diffusivity, $u_n$ is the neutral energy density
    in $\mathrm{J\,m^{-3}}$, and $h_\theta$ is the poloidal metric scale factor in
    meters so that $(1/h_\theta)\partial u_n/\partial\theta$ is a length-normalized
    gradient in $\mathrm{J\,m^{-4}}$. For a Maxwellian neutral population, $u_n$ is
    commonly evaluated from the neutral density and temperature; for example, $u_n=3
    n_n T_n/2$ when $T_n$ is expressed as energy per particle.


    This coefficient is used in reduced neutral-fluid or transport closures for edge
    and scrape-off-layer plasmas when the full neutral energy transport tensor is
    represented by direction-resolved effective diffusivities. Its value may represent
    collisional scattering, charge-exchange mediated redistribution, atomic and molecular
    processes, and unresolved turbulent or kinetic effects. It is the energy-transport
    analog of [poloidal neutral momentum diffusivity](name:poloidal_neutral_momentum_diffusivity),
    and it complements orthogonal-direction quantities such as [radial neutral energy
    diffusion coefficient](name:radial_neutral_energy_diffusion_coefficient).


    Typical effective values range from $0.1-10^4\ \mathrm{m^2\,s^{-1}}$. Smaller
    values are expected for cold, dense, highly collisional divertor neutrals, while
    larger effective values can occur in hotter or more rarefied edge regions, or
    when unresolved kinetic transport is represented by an enhanced diffusive closure.
    A true diffusive coefficient is expected to be non-negative; negative fitted values
    indicate an anti-diffusive effective closure or a convention-dependent model artifact
    rather than ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_momentum_diffusivity
  - name:effective_neutral_energy_diffusivity
  - name:poloidal_ion_energy_diffusivity
  arguments:
  - name: neutral_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_momentum_diffusivity
  kind: scalar
  status: draft
  description: "Poloidal component of the effective neutral-particle momentum diffusivity\
    \ tensor in flux coordinates (\u03C1, \u03B8, \u03C6), governing diffusive redistribution\
    \ of neutral momentum along increasing poloidal angle \u03B8."
  documentation: 'Poloidal neutral momentum diffusivity is the diagonal poloidal component
    of an effective neutral-particle momentum diffusivity tensor. It parameterizes
    how neutral momentum density is smoothed along the poloidal direction, tangent
    to increasing $\theta$ at fixed $\rho$ and $\phi$ in flux coordinates $(\rho,\theta,\phi)$,
    locally lying in a meridional plane of the right-handed cylindrical $(R,\phi,Z)$
    frame where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    In a local Fick-type closure, the poloidal diffusive flux of neutral poloidal
    momentum is written as:


    $$

    \Pi_{\theta,n} = -D_\theta\,\frac{\partial}{\partial l_\theta}\left(m_n n_n u_{\theta,n}\right)

    $$


    where $\Pi_{\theta,n}$ is the poloidal neutral-momentum flux in kg m$^{-1}$ s$^{-2}$,
    taken positive in the direction of increasing $\theta$; $D_\theta$ is the poloidal
    neutral momentum diffusivity in m$^2$ s$^{-1}$; $m_n$ is neutral particle mass
    in kg; $n_n$ is neutral number density in m$^{-3}$; and $u_{\theta,n}$ is the
    neutral fluid velocity component along increasing $\theta$ in m s$^{-1}$. The
    poloidal arclength $l_\theta$ follows the coordinate line of increasing $\theta$,
    with metric relation $dl_\theta=h_\theta d\theta$ and $h_\theta=|\partial\mathbf{x}/\partial\theta|_{\rho,\phi}$
    in meters when $\theta$ is dimensionless; the minus sign means that positive diffusivity
    drives neutral poloidal momentum down its arclength gradient.


    This coefficient is usually obtained indirectly from neutral-transport modeling,
    reduced fluid closures, or interpretation of edge and divertor measurements sensitive
    to neutral flow and momentum exchange. As an effective coefficient, it may include
    neutral-neutral collisions, charge-exchange coupling to ions, and unresolved kinetic
    or geometric effects represented in a diffusive approximation.


    Typical effective values in tokamak edge and divertor neutral-momentum closures
    are about 0.01-10 m$^2$ s$^{-1}$, with values up to roughly 100 m$^2$ s$^{-1}$
    possible in highly diffusive reduced descriptions or regions where long neutral
    mean-free paths are represented by an effective fluid diffusivity.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_diffusivity
  - name:poloidal_ion_momentum_diffusivity
  - name:poloidal_neutral_energy_diffusivity
  arguments:
  - name: neutral_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_neutral_state_energy_diffusivity
  kind: scalar
  status: draft
  description: "Effective diagonal diffusivity for neutral-state energy transport\
    \ along the poloidal tangent in flux coordinates (\u03C1, \u03B8, \u03C6), at\
    \ fixed \u03C1 and \u03C6, in the edge plasma."
  documentation: 'Poloidal neutral state energy diffusivity is the effective diagonal
    transport coefficient for diffusive spreading of the thermal energy density of
    a specified neutral state along the poloidal tangent. In flux coordinates $(\rho,\theta,\phi)$,
    where $\rho$ is a radial flux-surface label, $\theta$ is poloidal angle, and $\phi$
    is toroidal angle, it applies to transport along the physical tangent to changing
    $\theta$ at fixed $\rho$ and $\phi$.


    A length-normalized Fick-law closure for the diffusive poloidal energy flux is


    $$

    q_{\theta,E}^{s} = -D_{\mathrm{pol},E}^{s}\,\frac{\partial \mathcal{E}^{s}}{\partial
    \ell_\theta}

    $$


    where $q_{\theta,E}^{s}$ is the diffusive energy-flux density of neutral state
    $s$ along the poloidal tangent in $W\,m^{-2}$, $\mathcal{E}^{s}$ is the thermal
    energy density of that state in $J\,m^{-3}$, $\ell_\theta$ is physical arc length
    in meters along increasing $\theta$ at fixed $\rho$ and $\phi$, and $D_{\mathrm{pol},E}^{s}$
    is this diffusivity in $m^2\,s^{-1}$. If $h_\theta=|\partial\mathbf{x}/\partial\theta|$
    is the poloidal metric factor for $(\rho,\theta,\phi)$, the gradient in this closure
    is the metric-corrected derivative $h_\theta^{-1}\partial\mathcal{E}^{s}/\partial\theta$.
    The minus sign makes the diffusive flux point down the length-normalized energy-density
    gradient.


    This quantity is usually prescribed, inferred, or calibrated within edge neutral
    transport modeling rather than measured directly. It is the state-resolved counterpart
    of [poloidal_neutral_energy_diffusivity](name:poloidal_neutral_energy_diffusivity),
    the poloidal component of [neutral_state_energy_diffusivity](name:neutral_state_energy_diffusivity),
    and is analogous to directional energy-transport coefficients such as [parallel_energy_diffusivity](name:parallel_energy_diffusivity)
    and [radial_energy_diffusion_coefficient](name:radial_neutral_energy_diffusion_coefficient).
    It may be constrained indirectly by comparison with neutral temperature, radiation,
    particle-balance, or heat-flux observations, depending on the model closure.


    Representative modeling values are highly problem dependent. Reduced edge-neutral
    calculations often explore values of about 0.01-10 m^2 s^-1, while sensitivity
    studies for strong unresolved poloidal mixing may extend toward 100 m^2 s^-1.
    Values near zero represent negligible diffusive poloidal energy spreading for
    the selected neutral state.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_neutral_energy_diffusivity
  - name:neutral_state_energy_diffusivity
  - name:parallel_energy_diffusivity
  - name:radial_neutral_energy_diffusion_coefficient
  arguments:
  - name: neutral_state_energy_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_total_current_density
  kind: scalar
  status: draft
  description: Poloidal total current density is the signed component of the total
    edge-plasma current density along the local poloidal direction, summing ohmic,
    bootstrap, and externally driven contributions over all plasma species and charge
    states.
  documentation: 'The poloidal total current density is the component of the aggregated
    current density vector [total_current_density](name:total_current_density) resolved
    along the local poloidal direction in a flux-coordinate system such as $(\rho,
    \theta, \phi)$. It represents the net conventional positive charge flux per unit
    area along increasing poloidal angle after summing ohmic, bootstrap, and externally
    driven current mechanisms over all resolved plasma species and charge states.
    The poloidal unit vector $\hat{\boldsymbol{\theta}}$ is tangent to changing $\theta$
    at fixed radial flux coordinate and toroidal angle $\phi$, embedded in the right-handed
    cylindrical $(R, \phi, Z)$ frame where $R$ is major radius and $Z$ is vertical
    height.


    The projection is defined by:


    $$

    j_{\theta,\mathrm{total}} = \mathbf{J}_\mathrm{total}\cdot\hat{\boldsymbol{\theta}}
    = \left(\mathbf{J}_\mathrm{ohmic} + \mathbf{J}_\mathrm{bootstrap} + \mathbf{J}_\mathrm{drive}\right)\cdot\hat{\boldsymbol{\theta}}

    $$


    where $j_{\theta,\mathrm{total}}$ is the scalar poloidal total current density
    in A m$^{-2}$, $\mathbf{J}_\mathrm{total}$ and each contribution vector are in
    A m$^{-2}$, and $\hat{\boldsymbol{\theta}}$ is dimensionless. $\mathbf{J}_\mathrm{drive}$
    collects externally driven current sources, while the bootstrap and ohmic terms
    represent neoclassical pressure-gradient drive and inductive electric-field drive,
    respectively.


    In practice this quantity is obtained by projecting a reconstructed or simulated
    total current-density vector onto the local poloidal direction defined by the
    chosen $(\rho, \theta, \phi)$ flux coordinates. It is a directional sibling of
    [radial_total_current_density](name:radial_total_current_density), [toroidal_total_current_density](name:toroidal_total_current_density),
    [vertical_total_current_density](name:vertical_total_current_density), and [parallel_total_current_density](name:parallel_total_current_density);
    the parallel component is field-aligned and is not generally identical to the
    poloidal projection. The related [poloidal_pfirsch_schlueter_current_density](name:poloidal_pfirsch_schlueter_current_density)
    is a specific neoclassical contribution rather than the full summed current.


    Typical edge-plasma magnitudes are highly device- and scenario-dependent. Transport
    and edge simulations commonly give $10^2$-$10^5$ A m$^{-2}$ for steady poloidal
    total current density, with localized source regions, steep-gradient regions,
    or transient events reaching about $10^6$ A m$^{-2}$.


    Sign convention: Positive when conventional current flows in the direction of
    increasing poloidal angle $\theta$ in the explicitly chosen flux-coordinate system
    $(\rho, \theta, \phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_current_density
  - name:radial_total_current_density
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: radial_current_density_due_to_viscosity
  kind: scalar
  status: draft
  description: "Radial component of the viscosity-driven current density in the edge\
    \ plasma, formed from viscous stress contributions and directed along the major-radius\
    \ direction of the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial current density due to viscosity is the major-radius component
    of the electric current density produced by viscous momentum transport in the
    edge plasma. It represents the part of the current associated with viscous stress
    closures, including perpendicular, parallel, and heat-viscous contributions, projected
    onto the $\hat{R}$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.


    A useful defining relation is the projection of the aggregate viscosity-driven
    current density onto the major-radius basis vector:


    $$

    j_R^{\mathrm{visc}} = \left(\mathbf{j}_{\perp}^{\mathrm{visc}} + \mathbf{j}_{\parallel}^{\mathrm{visc}}
    + \mathbf{j}_{q}^{\mathrm{visc}}\right) \cdot \hat{R}

    $$


    where $j_R^{\mathrm{visc}}$ is the radial viscosity-driven current density, $\mathbf{j}_{\perp}^{\mathrm{visc}}$
    is the contribution associated with perpendicular viscous stress, $\mathbf{j}_{\parallel}^{\mathrm{visc}}$
    is the contribution associated with parallel viscous stress, $\mathbf{j}_{q}^{\mathrm{visc}}$
    is the heat-viscous contribution, and $\hat{R}$ is the outward major-radius unit
    vector.


    This quantity is usually computed from edge fluid, gyrofluid, or kinetic transport
    models rather than measured directly. It depends on plasma collisionality, magnetization,
    density and temperature gradients, flow shear, magnetic geometry, and the closure
    used for the viscous stress tensor; it contributes to cross-field current closure
    and to the evolution of electric fields in the edge and scrape-off layer.


    Typical magnitudes are often about 0.01-100 A.m^-2 in quiescent edge conditions,
    with localized or transient values reaching 1000 A.m^-2 when gradients, flows,
    or turbulent structures are strong.


    Sign convention: Positive when the viscosity-driven current density points in
    the direction of increasing major radius $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:radial_current_density_due_to_parallel_viscosity
  - name:radial_current_density_due_to_heat_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  arguments:
  - name: current_density_due_to_viscosity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_electron_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for electron particle transport.
    It is the advective coefficient multiplying electron density in a radial particle-flux
    closure at the plasma edge.
  documentation: 'Radial electron convection velocity is the effective advective speed
    associated with cross-field electron particle transport at the plasma edge. It
    represents the convective, or pinch, part of the radial electron particle flux
    after diffusive transport has been separated from the closure.


    A common particle-flux closure writes the radial electron particle flux as:


    $$

    \Gamma_{e,r} = -D_{e,r}\,\frac{\partial n_e}{\partial r} + v_{e,r}\,n_e

    $$


    where $\Gamma_{e,r}$ is the radial electron particle flux in $\mathrm{m^{-2}\,s^{-1}}$,
    $D_{e,r}$ is an effective radial diffusivity in $\mathrm{m^2\,s^{-1}}$, $n_e$
    is the electron density in $\mathrm{m^{-3}}$, $r$ is an outward radial coordinate
    in meters, and $v_{e,r}$ is the radial electron convection velocity.


    This quantity is usually inferred from edge transport analysis, reduced transport
    modeling, or fits to electron-density evolution using sources, sinks, and radial
    gradients. It is an effective closure coefficient: it need not identify a single
    microscopic drift mechanism and may summarize turbulence, neoclassical effects,
    and geometry-dependent transport into one advective term.


    Typical effective values in the confined edge are from about -50 to 50 m.s^-1.
    Larger apparent values, up to several hundred m.s^-1, can occur in the scrape-off
    layer or during strong transient edge transport, depending on the chosen transport
    closure and averaging interval.


    Sign convention: Positive when the effective electron particle convection is directed
    outward across magnetic flux surfaces from the confined plasma toward the plasma-facing
    material surfaces.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:particle_convection_velocity
  - name:radial_electron_energy_convection_velocity
  - name:radial_ion_convection_velocity
- name: radial_ion_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for ion particle transport in
    the edge plasma. It is the coefficient multiplying ion density in the cross-field
    ion particle flux, not necessarily a literal ion fluid velocity.
  documentation: 'The radial ion convection velocity $v_{r,i}$ is the effective advective
    coefficient for ion particle transport across magnetic flux surfaces in the edge
    plasma. The radial direction is the outward normal direction associated with an
    increasing radial flux label $\rho$ in a flux-surface coordinate system $(\rho,\theta,\phi)$,
    where $\theta$ is poloidal angle and $\phi$ is toroidal angle. This quantity represents
    the particle-transport channel and need not equal the radial component of the
    ion bulk flow.


    The convective contribution to the radial ion particle flux density is defined
    by:


    $$

    \Gamma_{r,i}^{\mathrm{conv}} = n_i v_{r,i}

    $$


    where $\Gamma_{r,i}^{\mathrm{conv}}$ is the convective radial ion particle flux
    density in m$^{-2}$ s$^{-1}$, $n_i$ is the local ion number density in m$^{-3}$,
    and $v_{r,i}$ is the radial ion convection velocity in m s$^{-1}$. In a full transport
    model this term is commonly combined with diffusive and source terms; the convection
    velocity is the coefficient of the density-proportional part of the cross-field
    particle flux.


    In edge-plasma modeling, $v_{r,i}$ is obtained from transport closures, reduced
    fluid or kinetic models, or inference from particle balance after separating density-gradient-driven
    diffusion from density-proportional advection. It may represent the net effect
    of mean drifts, turbulent transport, intermittent filament motion, ion-neutral
    coupling, and other unresolved processes. Analogous effective convection velocities
    are used for ion energy and momentum channels, including charge-state-resolved
    variants.


    Typical absolute values for background effective radial convection in scrape-off-layer
    and divertor transport studies are about 0.1-100 m s$^{-1}$, depending strongly
    on plasma regime, collisionality, turbulence level, and proximity to material
    surfaces. Local transient or filament-associated effective radial speeds can be
    larger, often 10-1000 m s$^{-1}$, but these may not correspond to a steady flux-surface-averaged
    coefficient.


    Sign convention: Positive when $v_{r,i}$ is directed outward across magnetic flux
    surfaces, toward increasing radial flux label $\rho$ in the flux-surface coordinate
    system $(\rho,\theta,\phi)$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_convection_velocity
  - name:radial_ion_state_momentum_convection_velocity
- name: radial_ion_energy_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for the convective part of ion
    energy transport in the edge plasma. It is an energy-transport coefficient, not
    necessarily the ion particle flow velocity.
  documentation: 'Radial ion energy convection velocity is the signed transport coefficient
    that multiplies the ion pressure or thermal-energy scale in the convective radial
    ion energy flux. It characterizes advective transport of ion thermal energy across
    magnetic flux surfaces in the edge plasma, separate from diffusive or conductive
    transport driven by gradients.


    The defining transport relation can be written as:


    $$

    q^{\mathrm{conv}}_{i,E,r} = p_i v_r

    $$


    where $q^{\mathrm{conv}}_{i,E,r}$ is the convective radial ion energy flux density
    in W m$^{-2}$, $p_i$ is the ion pressure or energy-density scale in J m$^{-3}$,
    and $v_r$ is this velocity in m s$^{-1}$. When $p_i=n_i T_i$ is used, $n_i$ is
    in m$^{-3}$ and $T_i$ must be in joules; if $T_i$ is represented in eV, it is
    converted using the elementary charge.


    In practice, $v_r$ is inferred from edge transport analysis by separating the
    convective part of the ion energy flux from conductive or diffusive terms and
    from local sources and sinks. It differs from [radial_ion_convection_velocity](name:radial_ion_convection_velocity),
    which refers to particle advection, and from [radial_ion_effective_energy_convection_velocity](name:radial_ion_energy_convection_velocity)
    when additional non-convective mechanisms are intentionally absorbed into a model-equivalent
    velocity.


    Typical edge-plasma values are often of order -10-50 m s$^{-1}$ on closed edge
    flux surfaces, with larger effective values of order 100 m s$^{-1}$ possible near
    strong pedestal gradients or in scrape-off-layer transport analyzes. Values near
    zero indicate little convective contribution compared with diffusion or conduction.


    Sign convention: Positive when directed outward across magnetic flux surfaces,
    from the confined plasma toward the scrape-off layer and wall.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_convection_velocity
- name: radial_ion_state_diffusivity
  kind: scalar
  status: draft
  description: Radial particle diffusion coefficient for a specific ion charge state,
    relating the cross-field diffusive particle flux to the radial gradient of that
    charge-state's number density in the edge plasma.
  documentation: 'The radial ion state diffusivity $D_r^{(z)}$ quantifies cross-field
    particle diffusion for ions in a specific ionization stage $z$ in the edge plasma.
    It is the radial projection of the full [ion_state_diffusivity](name:ion_state_diffusivity)
    tensor, representing how efficiently that charge state diffuses across magnetic
    flux surfaces perpendicular to the field.


    The quantity enters the charge-state continuity equation through Fick''s law:


    $$

    \Gamma_r^{(z)} = -D_r^{(z)} \nabla_r n_z

    $$


    where $\Gamma_r^{(z)}$ is the radial diffusive particle flux density of the charge
    state (in m$^{-2}$s$^{-1}$) and $\nabla_r n_z$ is the radial component of the
    number density gradient of that charge state (in m$^{-4}$).


    In practice, $D_r^{(z)}$ is either prescribed from turbulent-transport models
    or fitted to experimental edge density profiles by matching computed and measured
    charge-state distributions. It may vary spatially across the edge grid depending
    on local turbulence and plasma conditions.


    Cross-field particle diffusivities in edge plasmas are anomalously enhanced above
    neoclassical levels by turbulence, with values commonly in the range $10^{-2}$
    to $10^1$ m$^2$s$^{-1}$ in the scrape-off layer and pedestal region. The companion
    coefficients [radial_ion_state_energy_diffusivity](name:radial_ion_state_energy_diffusivity)
    and [radial_ion_state_momentum_diffusivity](name:radial_ion_state_momentum_diffusivity)
    govern radial energy and momentum transport for the same charge state, while [parallel_ion_charge_state_diffusivity](name:parallel_ion_charge_state_diffusivity)
    captures diffusion along the magnetic field.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_diffusivity
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_state_momentum_diffusivity
  - name:parallel_ion_charge_state_diffusivity
  arguments:
  - name: ion_state_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_ion_state_momentum_diffusivity
  kind: scalar
  status: draft
  description: Radial ion-state momentum diffusivity is the cross-field diffusion
    coefficient for the directed momentum density of a specified ion charge state.
    It parameterizes the Fickian part of radial momentum transport, with nonnegative
    values driving momentum flux down outward radial gradients.
  documentation: 'Radial ion-state momentum diffusivity is a scalar transport coefficient
    relating the outward radial gradient of directed momentum density for a specified
    ion charge state to the diffusive radial flux of that momentum. The radial label
    used here increases outward across magnetic flux surfaces, from the core side
    toward the scrape-off-layer and material boundary, and the coefficient represents
    charge-state-resolved collisional or turbulent redistribution rather than convective
    momentum transport.


    The local Fickian closure for the diffusive radial momentum flux density is


    $$

    \Pi_{r,\mathrm{diff}}^{(z)} = -D_{p,r}^{(z)} \frac{\partial}{\partial r}\left(m_i
    n^{(z)} u^{(z)}\right)

    $$


    where $D_{p,r}^{(z)}$ is the radial momentum diffusivity for ion charge state
    $z$, $r$ is an outward-increasing cross-field radial label, $m_i$ is ion mass,
    $n^{(z)}$ is the charge-state density, and $u^{(z)}$ is the directed flow speed
    of the transported momentum component. The product $m_i n^{(z)} u^{(z)}$ is the
    directed momentum density with units kg m^-2 s^-1, and $\Pi_{r,\mathrm{diff}}^{(z)}$
    is the radial flux density of directed momentum with units kg m^-1 s^-2, taken
    as positive for outward transport. The minus sign means that a nonnegative diffusivity
    carries momentum from larger to smaller momentum density along the outward radial
    direction.


    In practice this quantity is an effective closure parameter in edge momentum-balance
    modeling. It may be inferred or chosen together with particle, energy, and convective
    momentum-transport coefficients so that modeled charge-state densities and flows
    are consistent with available constraints; it should not be confused with a momentum
    pinch velocity or with a source of momentum.


    Typical numerical values are not universal because the coefficient depends strongly
    on the radial region, turbulence level, collisionality, charge state, and the
    chosen momentum-transport closure. Physically, larger values imply faster smoothing
    of charge-state momentum-density gradients, with a characteristic diffusive time
    scale of order $L^2/D_{p,r}^{(z)}$ across a cross-field length $L$, while zero
    represents no diffusive radial momentum transport in this closure.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_momentum_diffusivity
  - name:radial_ion_state_diffusivity
  - name:radial_ion_state_energy_diffusivity
  - name:radial_ion_charge_state_momentum_diffusivity
  arguments:
  - name: ion_state_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_ion_state_particle_flux
  kind: scalar
  status: draft
  description: Radial component of the particle flux for ions in a specified ionization
    charge state. It is the signed rate at which those ions cross a unit area per
    unit time in the outward radial direction.
  documentation: 'Radial ion state particle flux is the radial component of the particle
    flux for ions of a given species and ionization charge state. It measures cross-field
    particle transport through a surface normal to the radial direction, with the
    radial direction taken locally outward from the confined plasma toward the scrape-off
    layer and plasma-facing surfaces. The analogous poloidal component is [poloidal_ion_charge_state_particle_flux](name:poloidal_ion_charge_state_particle_flux).


    A general kinetic definition is the first velocity moment of the charge-state-resolved
    distribution function projected onto the radial direction:


    $$

    \Gamma_{i,q,r} = \int v_r f_{i,q}(\mathbf{x}, \mathbf{v}, t)\, d^3v

    $$


    where $\Gamma_{i,q,r}$ is the radial particle flux in m^-2.s^-1, $i$ labels the
    ion species, $q$ labels the ionization charge state, $v_r$ is the radial velocity
    component in m.s^-1, $f_{i,q}$ is the distribution function in s^3.m^-6, and $d^3v$
    is the velocity-space volume element in m^3.s^-3.


    In practice this quantity is inferred from particle balance, probe measurements,
    spectroscopy combined with ionization-recombination modeling, or edge transport
    calculations. Fluid closures often decompose the same total flux into convective,
    diffusive, pinch, collisional, and turbulent-correlation contributions, but the
    quantity denotes their net radial particle transport for the selected ion charge
    state.


    Typical values are strongly regime- and species-dependent and can be close to
    zero where inward and outward contributions balance. Representative edge and scrape-off-layer
    charge-state-resolved radial fluxes span about 10^16-10^22 m^-2.s^-1, with trace
    impurity charge states generally toward the lower end and abundant main-ion states
    toward the higher end.


    Sign convention: Positive when directed outward from the confined plasma toward
    the scrape-off layer and plasma-facing surfaces.'
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_particle_flux
  - name:radial_ion_state_diffusivity
  - name:radial_ion_convection_velocity
  - name:radial_ion_momentum_flux_over_edge_region
  arguments:
  - name: ion_state_particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_total_current_density
  kind: scalar
  status: draft
  description: Radial total current density is the component of the total electric
    current density resolved normal to magnetic flux surfaces, summing ohmic, bootstrap,
    and externally driven contributions over all plasma species and charge states.
  documentation: "The radial total current density is the component of the aggregated\
    \ current density vector [total_current_density](name:total_current_density) resolved\
    \ in the direction normal to magnetic flux surfaces. It sums all current-carrying\
    \ mechanisms \u2014 ohmic induction, bootstrap, and externally driven currents\
    \ \u2014 over all resolved species and charge states. This cross-flux-surface\
    \ radial direction is distinct from the cylindrical major-radius $\\hat{R}$ direction\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is major radius\
    \ and $Z$ is vertical height.\n\nThe aggregate radial current density satisfies:\n\
    \n$$\nJ_r = J_{\\mathrm{ohmic},r} + J_{\\mathrm{bootstrap},r} + J_{\\mathrm{drive},r}\n\
    $$\n\nwhere $J_{\\mathrm{ohmic},r}$, $J_{\\mathrm{bootstrap},r}$, and $J_{\\mathrm{drive},r}$\
    \ are the ohmic, bootstrap, and externally driven contributions projected onto\
    \ the flux-surface-normal direction, each in A m$^{-2}$.\n\nIn edge plasma models,\
    \ the radial current density is resolved on generalized geometry grids spanning\
    \ the pedestal, scrape-off layer, and divertor region. It appears in current continuity\
    \ equations and the perpendicular Ohm's law governing cross-field charge transport,\
    \ complementing the field-aligned [parallel_total_current_density](name:parallel_total_current_density)\
    \ and azimuthal [toroidal_total_current_density](name:toroidal_total_current_density)\
    \ projections of the same total current.\n\nSign convention: Positive when conventional\
    \ current flows outward along the flux-surface normal, away from the magnetic\
    \ axis."
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
