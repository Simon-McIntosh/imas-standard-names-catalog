- name: parallel_diamagnetic_current_density
  kind: scalar
  status: draft
  description: Field-aligned component of the diamagnetic current density, projected
    onto the local magnetic field direction in the edge plasma.
  documentation: 'The parallel diamagnetic current density is the projection of the
    total [diamagnetic_current_density](name:diamagnetic_current_density) onto the
    local magnetic field direction at each point in the edge plasma. The diamagnetic
    current arises from the gyration of magnetized particles in a pressure-gradient
    field; in an isotropic ideal plasma, $\mathbf{j}_\mathrm{dia} = (\mathbf{B} \times
    \nabla p)/B^2$ is purely perpendicular to $\mathbf{B}$, so its parallel component
    vanishes in that limit. In more complete descriptions including pressure anisotropy,
    finite Larmor radius corrections, or the inhomogeneous magnetic geometry of the
    tokamak edge, a field-aligned component emerges and must be tracked separately.


    The parallel projection is defined as:


    $$

    j_{\parallel,\mathrm{dia}} = \mathbf{j}_\mathrm{dia} \cdot \hat{b}

    $$


    where $\mathbf{j}_\mathrm{dia}$ is the diamagnetic current density vector and
    $\hat{b} = \mathbf{B}/B$ is the unit vector along the magnetic field of magnitude
    $B$.


    In edge plasma current decompositions, this component is closely related to [parallel_current_density_due_to_diamagnetic_drift](name:parallel_current_density_due_to_diamagnetic_drift),
    which encodes the same physical mechanism through the explicit drift formalism.
    The toroidal_diamagnetic_current_density provides the complementary geometric
    projection of the same vector field onto the toroidal direction.


    Sign convention: Positive when the current flows in the direction of the local
    magnetic field unit vector $\hat{b} = \mathbf{B}/B$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: diamagnetic_current_density
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_energy_diffusivity
  kind: scalar
  status: draft
  description: Field-line-aligned effective diffusivity in a Fick-law closure for
    neutral thermal-energy transport. It multiplies the parallel gradient of neutral
    energy density to give the diffusive neutral energy flux along magnetic field
    lines.
  documentation: 'Parallel energy diffusivity is the component of an effective neutral
    thermal-energy diffusivity tensor aligned with the local magnetic field. It represents
    unresolved collisional, kinetic, or turbulent processes that spread neutral thermal
    energy along field lines in edge plasmas.


    The diffusive closure for the parallel neutral thermal-energy flux is


    $$

    q_{E,\parallel} = -D^E_\parallel \, \nabla_\parallel u_n

    $$


    where $q_{E,\parallel}$ is the parallel diffusive thermal-energy flux density,
    $D^E_\parallel$ is this diffusivity, $u_n$ is the neutral thermal energy density,
    and $\nabla_\parallel = \hat{b}\cdot\nabla$ is the derivative along the magnetic-field
    unit vector $\hat{b}$. The minus sign fixes the Fick-law flux convention: for
    positive $D^E_\parallel$, energy flows from larger to smaller $u_n$ along the
    chosen field-line direction. If the closure is instead written using neutral temperature,
    the temperature must be treated as an energy per particle, or an explicit conversion
    factor such as $k_B$ must be included for temperature in kelvin.


    This coefficient is usually not measured directly. It is inferred from neutral
    transport modeling, collisional mean-free-path estimates, kinetic or fluid closures,
    and comparison with observables such as neutral pressure, spectroscopic emission,
    ionization patterns, and energy loading of plasma-facing surfaces.


    Typical effective values in edge-plasma applications span about 0.1-10^4 m^2.s^-1.
    Cold, highly collisional divertor neutrals often use values near 0.1-10 m^2.s^-1,
    while weakly collisional atoms or molecules with long mean free paths can require
    10^2-10^4 m^2.s^-1.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:effective_neutral_energy_diffusivity
  - name:radial_neutral_energy_diffusion_coefficient
  - name:parallel_neutral_species_particle_diffusivity
  arguments:
  - name: energy_diffusivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_ion_charge_state_diffusivity
  kind: scalar
  status: draft
  description: Parallel ion charge-state diffusivity is the Fickian coefficient relating
    the density gradient of a specified ion charge state to its diffusive particle
    flux along magnetic field lines. A positive value drives particle flux down the
    field-aligned density gradient.
  documentation: 'Parallel ion charge-state diffusivity is the effective particle
    diffusion coefficient along magnetic field lines for ions in a specified charge
    state. It describes only the diffusive part of charge-state-resolved parallel
    transport, distinct from separately modeled advection, sources, ionization, recombination,
    or force-driven terms.


    The diffusive contribution to the associated parallel particle flux is defined
    by Fick''s law along the magnetic field:


    $$

    \Gamma_{\parallel,z}^{\mathrm{diff}} = -D_{\parallel,z}\,\nabla_{\parallel} n_z

    $$


    where $z$ labels the ion charge state, $\Gamma_{\parallel,z}^{\mathrm{diff}}$
    is the diffusive part of the [parallel ion state particle flux](name:parallel_ion_state_particle_flux)
    in m^-2.s^-1, $D_{\parallel,z}$ is the parallel ion charge-state diffusivity in
    m^2.s^-1, $n_z$ is the ion charge-state density in m^-3, and $\nabla_{\parallel}=\hat{b}\cdot\nabla$
    is the derivative along the unit magnetic-field direction $\hat{b}=\mathbf{B}/|\mathbf{B}|$.
    With positive $D_{\parallel,z}$, the diffusive flux is opposite to a positive
    field-aligned density gradient.


    In practice this coefficient is prescribed by a transport closure or inferred
    by comparing density gradients with estimates of the field-aligned particle flux
    in charge-state-resolved edge plasma modeling. It is an effective coefficient:
    any physics not represented explicitly in the flux equation is included only insofar
    as it changes the multiplier of the parallel density-gradient term.


    Typical values are highly model dependent. Edge-plasma applications commonly use
    values from 1-10^5 m^2.s^-1, often much larger than perpendicular diffusivities,
    while 0 m^2.s^-1 represents the absence of an explicit Fickian parallel diffusion
    term for that charge state.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_state_diffusivity
  - name:parallel_energy_diffusivity
  - name:parallel_neutral_species_particle_diffusivity
  arguments:
  - name: ion_charge_state_diffusivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_ion_state_momentum
  kind: scalar
  status: draft
  description: Parallel ion state momentum is the component, along the local magnetic-field
    direction, of the momentum source term for a specified ion species and charge
    state in an edge plasma. It has unit kg m^-1 s^-2 and represents addition or removal
    of that state's parallel momentum.
  documentation: 'Parallel ion state momentum is the signed projection of a charge-state-resolved
    ion momentum source term along the local magnetic-field direction. It applies
    to one ion species and one ion charge state, and has unit $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    the same dimensional unit as pressure or momentum flux.


    The signed parallel projection is defined by:


    $$

    S_{p,\parallel}^{(a,q)} = \mathbf{S}_p^{(a,q)} \cdot \hat{\mathbf{b}}

    $$


    where $S_{p,\parallel}^{(a,q)}$ is the parallel momentum source term for ion species
    $a$ and charge state $q$ with unit $\mathrm{kg\,m^{-1}\,s^{-2}}$, $\mathbf{S}_p^{(a,q)}$
    is the corresponding vector momentum source term with the same unit, $\hat{\mathbf{b}}
    = \mathbf{B}/|\mathbf{B}|$ is the dimensionless unit vector along the local magnetic
    field, and $\mathbf{B}$ is the magnetic field measured in tesla.


    In practice this quantity is usually inferred or computed as part of a momentum
    balance for the selected ion state rather than measured directly. Contributing
    mechanisms can include ion-neutral momentum exchange, charge exchange, ionization
    and recombination momentum transfer, collisional friction, and externally applied
    momentum sources. Complementary projections of the same charge-state-resolved
    ion momentum source are represented by [poloidal_ion_state_momentum](name:poloidal_ion_state_momentum),
    [toroidal_ion_state_momentum](name:toroidal_ion_state_momentum), and radial_ion_state_momentum.


    Typical absolute magnitudes are strongly case dependent: they range from near
    $0\ \mathrm{kg\,m^{-1}\,s^{-2}}$ where net parallel momentum transfer cancels
    to values comparable with local edge ion pressure $p_i$ or dynamic momentum-flux
    scales such as $m_i n_i u_\parallel^2$, where $m_i$, $n_i$, and $u_\parallel$
    are ion mass, ion density, and parallel flow speed. The relevant scale can vary
    by orders of magnitude between weak-source edge regions and localized divertor
    or recycling regions.


    Sign convention: Positive when the momentum source acts in the direction of the
    local magnetic field $\mathbf{B}$.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_ion_state_momentum
  - name:toroidal_ion_state_momentum
  arguments:
  - name: ion_state_momentum
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_ion_state_particle_flux
  kind: scalar
  status: draft
  description: Signed field-parallel particle flux density for a single ion charge
    state. It is the total charge-state particle flux density projected onto the local
    magnetic-field direction, giving the net number of ions crossing a unit area per
    unit time along the field.
  documentation: 'Parallel ion state particle flux is the signed particle flux density
    of a specified ion charge state projected onto the local magnetic-field direction.
    It quantifies net transport of that charge-state population along magnetic field
    lines, including any convective, diffusive, drift, or source-driven contributions
    included in the total particle flux density.


    The defining projection is


    $$

    \Gamma_{\parallel,i,k} = \boldsymbol{\Gamma}_{i,k} \cdot \hat{\boldsymbol{b}}

    $$


    where $\boldsymbol{\Gamma}_{i,k}$ is the total particle flux density of ion species
    $i$ in charge state $k$ in m^-2.s^-1, and $\hat{\boldsymbol{b}} = \boldsymbol{B}/|\boldsymbol{B}|$
    is the unit vector along the local magnetic field. For a purely convective contribution,
    $\boldsymbol{\Gamma}_{i,k} = n_{i,k}\boldsymbol{v}_{i,k}$, so the field-parallel
    part is $n_{i,k} v_{\parallel,i,k}$, where $n_{i,k}$ is the charge-state density
    in m^-3 and $v_{\parallel,i,k}$ is the field-parallel velocity in m.s^-1.


    In edge plasma analysis, this quantity is usually obtained from transport or kinetic
    calculations by projecting the charge-state-resolved particle flux onto $\hat{\boldsymbol{b}}$.
    Experimentally, it may be inferred indirectly from combinations of density, flow,
    spectroscopy, probe measurements, and magnetic geometry, with charge-state separation
    provided by atomic physics modeling or charge-state-resolved diagnostics.


    Typical absolute values in the scrape-off layer and divertor range from 10^20-10^24
    m^-2.s^-1, with the largest values near sheath entrances and high-recycling divertor
    regions. Weakly populated charge states, detached conditions, or near-stagnation
    regions can have much smaller values, and the signed flux may pass through zero
    where the field-parallel flow reverses.


    Sign convention: Positive when the charge-state particle flux is directed along
    the local magnetic field $\boldsymbol{B}$.'
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_particle_flux
  - name:parallel_ion_state_energy_flux
  arguments:
  - name: ion_state_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_neutral_momentum
  kind: scalar
  status: draft
  description: Parallel component of the aggregate neutral momentum source term, summed
    over all neutral states and projected along the local magnetic-field direction.
  documentation: 'Parallel neutral momentum is the signed field-aligned component
    of the neutral momentum source term for the combined neutral population. It represents
    the net momentum loading of neutrals along the local magnetic field after summing
    contributions from all included neutral atomic, molecular, or excited states.


    The aggregate state sum and parallel projection can be written as:


    $$

    S_{\parallel n} = \sum_{\alpha \in \mathcal{N}} \hat{\mathbf{b}} \cdot \mathbf{S}_{n,\alpha},
    \qquad \hat{\mathbf{b}} = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathcal{N}$ is the set of neutral states, $\mathbf{S}_{n,\alpha}$ is the
    momentum-source vector for neutral state $\alpha$ with unit kg m^-1 s^-2, $S_{\parallel
    n}$ is the aggregate scalar with the same unit, $\hat{\mathbf{b}}$ is dimensionless,
    and $\mathbf{B}$ is the magnetic field with unit T. The unit kg m^-1 s^-2 is equivalent
    to N m^-2, so this quantity has the dimensions of a stress or momentum-flux contribution
    in a momentum balance.


    In practice it is computed from neutral momentum-exchange processes such as ionization,
    recombination, charge exchange, elastic scattering, molecular reactions, recycling,
    or neutral injection, without assuming that any one process is dominant. Conceptually
    related quantities include the full [neutral_momentum](name:neutral_momentum)
    source vector, the aggregate [toroidal_neutral_momentum](name:toroidal_neutral_momentum)
    component, the state-resolved [toroidal_neutral_state_momentum](name:toroidal_neutral_state_momentum)
    component, the ion-state analog [parallel_ion_state_momentum](name:parallel_ion_state_momentum),
    and the transport quantity [parallel_neutral_momentum_flux](name:parallel_neutral_momentum_flux).


    Typical magnitudes are highly case-dependent: values are often zero or negligible
    where the neutral density or net parallel exchange is small, while active edge,
    scrape-off-layer, divertor, recycling, or gas-puff regions can span many orders
    of magnitude. As an order-of-magnitude edge-plasma scale, nonzero absolute values
    may lie roughly in the range $10^{-6}$-$10^2$ kg m^-1 s^-2, but they should be
    interpreted relative to local pressure, momentum-flux, and paired plasma-neutral
    exchange terms rather than as a universal bound.


    Sign convention: Positive when the source deposits momentum into the neutral population
    in the direction of $\hat{\mathbf{b}}$, the local magnetic-field direction.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum
  - name:toroidal_neutral_state_momentum
  - name:parallel_ion_state_momentum
  - name:parallel_neutral_momentum_flux
  arguments:
  - name: neutral_momentum
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_neutral_state_momentum_coefficient
  kind: scalar
  status: draft
  description: Dimensionless flux-limiter coefficient that multiplies the field-aligned
    reference momentum-flux density for a neutral state in edge-plasma fluid transport.
    It changes the magnitude of the modeled parallel neutral momentum transport without
    defining its direction.
  documentation: 'The parallel neutral-state momentum coefficient is a dimensionless
    flux-limiter multiplier for the component of neutral momentum transport resolved
    along the local magnetic-field direction. It applies to a specified neutral state
    and modifies the magnitude of a reference field-aligned momentum-flux density
    used by a fluid closure; the coefficient itself does not carry a direction.


    A common closure interpretation is that the limited momentum-flux density is obtained
    by multiplying the reference value by this coefficient:


    $$

    \Pi_{\parallel,n}^{\mathrm{lim}} = C_{\parallel,n}^{\mathrm{mom}}\,\Pi_{\parallel,n}^{\mathrm{ref}}

    $$


    where $C_{\parallel,n}^{\mathrm{mom}}$ is this coefficient, $n$ labels the neutral
    state, and $\Pi_{\parallel,n}^{\mathrm{lim}}$ and $\Pi_{\parallel,n}^{\mathrm{ref}}$
    are the limited and reference parallel momentum-flux densities, both with units
    $\mathrm{N\,m^{-2}}$. The reference momentum-flux density is the signed value
    supplied by the un-limited closure, such as a free-streaming, convective, or diffusive
    estimate, before this multiplier is applied.


    The coefficient is normally specified by the transport model or inferred by calibration
    against kinetic neutral calculations and experimental constraints on edge density,
    pressure, and flow behavior. It is used to keep a fluid neutral momentum closure
    within a physically plausible range when mean-free paths become comparable to
    edge scale lengths.


    Typical values are 0-1. A value of 0 suppresses the reference parallel momentum
    flux, while 1 leaves it unchanged; values greater than 1 represent model-specific
    enhancement rather than flux limiting. Negative values are generally outside the
    physical domain because they reverse the reference momentum-flux density instead
    of limiting it.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_momentum_coefficient
  - name:poloidal_neutral_state_momentum_coefficient
  - name:toroidal_neutral_state_momentum_coefficient
  - name:parallel_momentum_coefficient
  arguments:
  - name: neutral_state_momentum_coefficient
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: plasma_momentum_flux
  kind: vector
  status: draft
  description: Momentum-current vector carried by the plasma across an oriented surface
    per unit area. It is the contraction of the plasma momentum-flux tensor with the
    surface normal and includes convective flow, isotropic pressure, and viscous or
    turbulent stress contributions.
  documentation: 'Plasma momentum flux is the vector flux of bulk plasma linear momentum
    through an oriented surface per unit area. It represents the traction-like momentum
    current obtained by applying the rank-2 plasma momentum-flux tensor to the surface
    unit normal; its direction gives the component of momentum being transported,
    while the chosen normal defines the surface through which transport is evaluated.


    For a single-fluid plasma, the momentum-current vector through a surface with
    unit normal $\hat{\mathbf{n}}$ is commonly written as


    $$

    \boldsymbol{\Gamma}_{p}(\hat{\mathbf{n}}) = \left(\rho_m\,\mathbf{u}\otimes\mathbf{u}
    + p\,\mathbf{I} + \boldsymbol{\pi}\right)\cdot\hat{\mathbf{n}}

    $$


    where $\boldsymbol{\Gamma}_{p}$ has units of kg.m^-1.s^-2, $\rho_m$ is the plasma
    mass density in kg.m^-3, $\mathbf{u}$ is the bulk plasma velocity in m.s^-1, $\mathbf{u}\otimes\mathbf{u}$
    is the dyadic convective momentum transport, $p$ is the scalar plasma pressure
    in Pa, $\mathbf{I}$ is the identity tensor, $\boldsymbol{\pi}$ is the viscous
    or turbulent stress tensor in Pa, and $\hat{\mathbf{n}}$ is a dimensionless unit
    normal. Contracting the rank-2 tensor with one unit normal yields a vector, not
    a scalar; scalar directional fluxes are obtained by an additional projection,
    as in [parallel_plasma_momentum_flux](name:parallel_plasma_momentum_flux).


    In edge and scrape-off-layer plasma modeling this quantity is usually computed
    from fluid moments, kinetic closures, or turbulence simulations rather than measured
    directly. Components are often resolved in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height; neutral analogs
    such as toroidal_neutral_momentum_flux describe momentum transport by neutral
    particles rather than by the charged plasma fluid.


    Typical edge and scrape-off-layer magnitudes are about 0.01-1000 kg.m^-1.s^-2,
    depending strongly on density, temperature, flow speed, turbulence level, and
    magnetic geometry. Values approaching 10^5 kg.m^-1.s^-2 can occur locally in high-pressure-gradient
    pedestal regions, strong divertor flows, or transient edge events.


    Sign convention: Positive when a component of the momentum-current vector points
    in the positive direction of its specified basis vector after the momentum-flux
    tensor is contracted with the chosen oriented surface normal.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_plasma_momentum_flux
  arguments:
  - name: momentum_flux
    operator: plasma
    operator_kind: qualifier
  sources:
  - id: derived:plasma_momentum_flux
    status: composed
- name: parallel_plasma_momentum_flux
  kind: scalar
  status: draft
  description: Parallel plasma momentum flux is the double projection of the charged-plasma
    momentum-flux tensor along the local magnetic-field direction. It includes bulk-flow
    transport of parallel momentum, isotropic pressure, and parallel viscous or anisotropic
    stress.
  documentation: 'Parallel plasma momentum flux is the component of the charged-plasma
    momentum-flux tensor obtained by projecting both tensor indices along the local
    magnetic-field direction. It represents the effective pressure-like transport
    of parallel momentum through a surface normal to the field, including streaming
    inertia, thermodynamic pressure, and parallel viscous stress. Because it is a
    double projection, it is unchanged by reversing the sign chosen for the magnetic-field
    unit vector and should not be interpreted as a one-way directed flux.


    For charged species $s$, the total parallel component is


    $$

    \Phi_{\parallel,\mathrm{plasma}} = \hat{\mathbf{b}}\cdot\left[\sum_{s\in\mathrm{charged}}\left(\rho_s\mathbf{u}_s\mathbf{u}_s
    + p_s\mathbf{I} + \boldsymbol{\pi}_s\right)\right]\cdot\hat{\mathbf{b}} = \sum_{s\in\mathrm{charged}}\left(\rho_s
    u_{\parallel s}^2 + p_s + \pi_{\parallel\parallel s}\right)

    $$


    where $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is dimensionless, $\rho_s$ is
    mass density in $\mathrm{kg\,m^{-3}}$, $\mathbf{u}_s\mathbf{u}_s$ is the dyadic
    product of the flow velocity with itself, $\mathbf{u}_s$ is in $\mathrm{m\,s^{-1}}$,
    $u_{\parallel s}=\mathbf{u}_s\cdot\hat{\mathbf{b}}$, $p_s$ is scalar pressure
    in $\mathrm{kg\,m^{-1}\,s^{-2}}$, $\mathbf{I}$ is the identity tensor, $\boldsymbol{\pi}_s$
    is the viscous or anisotropic stress tensor in $\mathrm{kg\,m^{-1}\,s^{-2}}$,
    and $\pi_{\parallel\parallel s}=\hat{\mathbf{b}}\cdot\boldsymbol{\pi}_s\cdot\hat{\mathbf{b}}$.
    The $\rho_s u_{\parallel s}^2$ term is mean-flow advective transport; a Reynolds-stress
    contribution from turbulent velocity fluctuations would be a separate modeled
    closure.


    In edge-plasma modeling this quantity is computed from charged-species density,
    parallel flow, scalar pressure, and a closure or kinetic evaluation of the parallel
    stress. Experimentally, its components are constrained by density and temperature
    measurements, spectroscopic flow measurements, probes where applicable, and momentum-balance
    analysis; the viscous or anisotropic stress contribution is often inferred rather
    than directly measured. The neutral counterpart resolved by neutral state is [parallel_neutral_state_momentum_flux](name:parallel_neutral_state_momentum_flux).


    Typical magnitudes in scrape-off-layer and divertor plasmas are 0.1-10^4 kg m^-1
    s^-2. Attached edge conditions commonly give 10-10^3 kg m^-1 s^-2, while cold
    detached regions can be below 10 kg m^-1 s^-2 and short transients or high-recycling
    divertor conditions can reach 10^4 kg m^-1 s^-2 or more.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:plasma_momentum_flux
  - name:parallel_center_of_mass_velocity
  - name:parallel_neutral_momentum_flux
  - name:parallel_momentum
  arguments:
  - name: plasma_momentum_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: plasma_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Signed scalar component of the bulk plasma center-of-mass velocity
    associated with diamagnetic drift. It represents the mass-weighted sum of species
    diamagnetic drift velocities caused by pressure gradients perpendicular to the
    magnetic field, with direction retained through the component sign.
  documentation: 'Plasma velocity due to diamagnetic drift is the center-of-mass flow
    component associated with pressure-gradient drifts of the charged species in a
    magnetized plasma. It is a signed projection of the bulk diamagnetic-drift vector
    onto a specified unit direction, not a direction-free speed; the corresponding
    magnitude is [bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude](name:bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude).


    The scalar component is defined from the mass-weighted species drift sum:


    $$

    v_{\mathrm{dia,cm},\hat{e}} = \hat{e}\cdot\frac{\sum_s m_s n_s \mathbf{v}_{\mathrm{dia},s}}{\sum_s
    m_s n_s}, \qquad \mathbf{v}_{\mathrm{dia},s} = \frac{\mathbf{B}\times\nabla p_s}{q_s
    n_s B^2}

    $$


    where $\hat{e}$ is the dimensionless unit direction of the resolved component,
    $s$ indexes charged species, $m_s$ is species mass in kg, $n_s$ is number density
    in m$^{-3}$, $p_s$ is scalar pressure in Pa, $q_s$ is signed charge in C, $\mathbf{B}$
    is magnetic field in T, and $B=|\mathbf{B}|$. The species sum is mass weighted,
    so in ordinary electron-ion plasmas the bulk flow is usually dominated by the
    ion pressure-gradient contribution rather than by the total pressure that drives
    the diamagnetic current.


    In practice, the vector is computed from measured or reconstructed species pressure
    profiles and the magnetic-field geometry, then projected onto the chosen component
    direction. Edge charge-exchange spectroscopy, probe measurements, Thomson scattering,
    and equilibrium reconstruction can constrain the input pressures, gradients, and
    fields, but the diamagnetic component is usually inferred rather than observed
    as an isolated flow.


    Typical component magnitudes in edge plasmas are 10^2-10^4 m.s^-1, increasing
    to several 10^4 m.s^-1 or occasionally about 10^5 m.s^-1 in steep-gradient pedestal
    or scrape-off-layer conditions. Values scale roughly with pressure-gradient strength
    and inversely with magnetic-field strength and species charge.


    Sign convention: Positive when the bulk diamagnetic-drift velocity vector has
    a component in the positive sense of the specified unit direction $\hat{e}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:velocity_due_to_diamagnetic_drift
  - name:neutral_velocity_due_to_diamagnetic_drift
  - name:momentum_flux_due_to_diamagnetic_drift
  arguments:
  - name: velocity_due_to_diamagnetic_drift
    operator: plasma
    operator_kind: qualifier
- name: poloidal_current_density_due_to_heat_viscosity
  kind: scalar
  status: draft
  description: Poloidal component of the current density arising from heat-viscosity
    terms in a collisional edge-plasma closure.
  documentation: 'Poloidal current density due to heat viscosity is the component
    of the heat-viscosity current density tangent to a flux surface in the poloidal
    direction of the flux coordinate system $(\rho,\theta,\phi)$. It isolates the
    part of the electric current density attributed to heat-flux-related viscous stress
    terms in a collisional edge-fluid closure.


    The component is defined by projecting the heat-viscosity current density onto
    the poloidal unit direction:


    $$

    j_{\theta}^{\mathrm{hv}} = \mathbf{j}^{\mathrm{hv}} \cdot \hat{\mathbf{e}}_{\theta}

    $$


    where $j_{\theta}^{\mathrm{hv}}$ is the poloidal component in A m$^{-2}$, $\mathbf{j}^{\mathrm{hv}}$
    is the heat-viscosity current-density vector in A m$^{-2}$, and $\hat{\mathbf{e}}_{\theta}$
    is the dimensionless unit vector in the direction of increasing poloidal angle
    $\theta$ in the flux coordinate system $(\rho,\theta,\phi)$.


    In edge-fluid models, $\mathbf{j}^{\mathrm{hv}}$ is usually a closure-derived
    contribution rather than a directly measured diagnostic quantity. It is associated
    with the divergence of a heat-flux-dependent viscous stress tensor, commonly represented
    at the species level by $\nabla\cdot\boldsymbol{\Pi}^{\mathrm{hv}}_s$ in momentum
    balance, where $\boldsymbol{\Pi}^{\mathrm{hv}}_s$ is a stress tensor and its divergence
    is a force density. The exact constitutive coefficients, species weighting, and
    metric factors depend on the collisional closure and on the chosen flux coordinates.


    No universal numerical range is intrinsic to this term. Reported magnitudes should
    be interpreted relative to the total current density and to related viscosity-driven
    components; the value can be zero when the heat-viscosity closure is not included
    and can vary strongly with edge gradients, collisionality, magnetic geometry,
    and plasma regime.


    Sign convention: Positive when the heat-viscosity current density points in the
    direction of increasing poloidal angle $\theta$ in the flux coordinate system
    $(\rho,\theta,\phi)$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
