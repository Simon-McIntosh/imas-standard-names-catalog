- name: toroidal_current_due_to_wave_driven_current_drive
  kind: scalar
  status: draft
  description: Wave-driven toroidal plasma current enclosed by a magnetic flux surface.
  documentation: 'Toroidal current due to wave-driven current drive is the non-inductive
    toroidal plasma current produced when coherent electromagnetic waves create an
    asymmetric charged-particle distribution through wave-particle interaction. For
    a chosen magnetic flux surface, it is the total driven current in the toroidal
    direction crossing a poloidal cut and enclosed by that surface; at the plasma
    boundary it corresponds to the global wave-driven toroidal current.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is the toroidal angle increasing counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height, the enclosed current at a flux surface
    labeled by poloidal magnetic flux $\psi$ is defined by integrating the toroidal
    component of the wave-driven current density over the enclosed poloidal area:


    $$

    I_{\phi}^{\mathrm{wave}}(\psi) = \int_{A(\psi)} j_{\phi}^{\mathrm{wave}}(R,Z)\,
    dR\, dZ

    $$


    where $A(\psi)$ is the region of the poloidal cross-section inside the $\psi=\mathrm{constant}$
    contour at fixed $\phi$, $j_{\phi}^{\mathrm{wave}}$ is the toroidal wave-driven
    current density in $\mathrm{A\,m^{-2}}$, and $dR\,dZ$ is the poloidal area element.
    Here $\psi$ is the poloidal magnetic flux in Wb. If the boundary of $A(\psi)$
    is parameterized using flux coordinates $(\psi, \theta, \phi)$, the poloidal angle
    $\theta$ increases counter-clockwise from the outboard midplane around the magnetic
    axis in the $(R,Z)$ cross-section drawn with increasing $R$ to the right and increasing
    $Z$ upward.


    The value is obtained by determining the wave-driven current density from wave
    absorption and kinetic response, projecting the driven current onto $\hat{\phi}$
    of the right-handed cylindrical $(R, \phi, Z)$ frame, and integrating over the
    equilibrium flux surface. In experiments it is usually constrained indirectly
    from changes in total plasma current, loop voltage, magnetic equilibrium, and
    diagnostics sensitive to the current distribution, with inductive current and
    other non-inductive sources treated separately.


    Typical absolute magnitudes are $1 \times 10^{3}-1 \times 10^{6}$ A in magnetically
    confined plasmas using radio-frequency current drive; small control actuators
    may drive $1 \times 10^{3}-1 \times 10^{5}$ A, while high-power scenarios can
    approach or exceed $1 \times 10^{6}$ A. The magnitude depends on launched wave
    power, resonance location, plasma density and temperature, magnetic geometry,
    and current-drive efficiency.


    Sign convention: Positive when the driven toroidal current flows in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_current_due_to_wave_driven_current_drive
  arguments:
  - name: current_due_to_wave_driven_current_drive
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
