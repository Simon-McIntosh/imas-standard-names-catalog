- name: temperature_at_midplane
  kind: scalar
  status: draft
  description: Thermodynamic plasma temperature referenced to the outboard, low-field-side
    midplane of the scrape-off layer. This parent concept covers local species temperatures
    and spatial field-line averages anchored at that upstream midplane crossing.
  documentation: 'Temperature at midplane is the thermodynamic energy scale of a plasma
    population associated with the upstream outboard, low-field-side midplane in the
    scrape-off layer. As a parent concept, it includes species-specific local values
    such as [electron_temperature_at_midplane](name:electron_temperature_at_midplane)
    and [ion_temperature_at_midplane](name:ion_temperature_at_midplane), as well as
    spatial averages along open magnetic field lines such as average_temperature_at_midplane.
    It does not by itself specify an electron, ion, impurity, or species-combined
    temperature unless a more specific quantity states that choice.


    For a local plasma population $a$ represented by a scalar pressure relation, the
    temperature expressed in electronvolts is related to pressure by:


    $$

    p_a = e\, n_a\, T_a

    $$


    where $p_a$ is scalar pressure in Pa, $n_a$ is number density in m^-3, $T_a$ is
    the population temperature in eV, $e$ is the elementary-charge conversion factor
    from eV to joules, and the subscript $a$ labels the plasma population. A field-line-averaged
    midplane temperature is formed by averaging the corresponding local temperature
    along an open magnetic field line segment that starts at the upstream outboard
    midplane crossing and extends toward a divertor target, with the spatial weighting
    defined by the more specific quantity.


    Local midplane temperatures are measured with diagnostics sensitive to the relevant
    plasma population, such as Thomson scattering or Langmuir-probe current-voltage
    characteristics for electrons and charge-exchange spectroscopy or retarding-field
    analysis for ions. Field-line averages are computed by sampling or integrating
    the local temperature along reconstructed open magnetic field lines in scrape-off-layer
    transport analysis.


    Typical scrape-off-layer midplane temperatures in tokamak plasmas range from 1-20
    eV in the far scrape-off layer to 10-150 eV near the separatrix. Ion temperatures
    are often comparable to or several times higher than electron temperatures, and
    field-line averages between the midplane and a divertor target commonly fall within
    the same order of magnitude but depend strongly on parallel transport and detachment
    state.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_midplane
  - name:ion_temperature_at_midplane
- name: electron_temperature_at_midplane
  kind: scalar
  status: draft
  description: Local electron temperature at the outboard, low-field-side midplane
    in the scrape-off-layer plasma. It is the thermodynamic electron energy scale
    there, distinct from a flux-surface average or a field-line average.
  documentation: 'Electron temperature at the midplane is the local electron temperature
    at the outboard, low-field-side intersection of the plasma midplane with the scrape-off
    layer. It characterizes the thermal spread of the electron velocity distribution
    at that location, rather than a [flux-surface-averaged electron temperature](name:flux_surface_averaged_electron_temperature)
    or a field-line average such as [electron average temperature at midplane](name:electron_average_temperature_at_midplane).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the local evaluation can
    be written as:


    $$

    T_{e,\mathrm{mid}} = T_e(R_{\mathrm{OMP}}, \phi_0, Z_{\mathrm{mid}})

    $$


    where $T_e$ is the local electron temperature, $R_{\mathrm{OMP}}$ is the major
    radius of the outboard midplane point in the scrape-off layer, $\phi_0$ is the
    toroidal angle of that point, and $Z_{\mathrm{mid}}$ is the vertical height of
    the plasma midplane. Expressed in eV, $T_e$ is the electron thermal energy scale;
    for a Maxwellian distribution, the mean random thermal kinetic energy per electron
    is $\langle E_e\rangle = 3T_e/2$ when both are expressed as energies.


    It is commonly inferred from local edge measurements such as Langmuir-probe current-voltage
    characteristics, with interpretation depending on sheath physics, plasma potential,
    secondary emission, magnetization, and non-Maxwellian effects. Local sampling
    makes this quantity sensitive to radial position relative to the separatrix, turbulent
    fluctuations, and toroidal or poloidal asymmetries; separate measures such as
    [thermal electron decay length over the scrape-off layer](name:thermal_electron_decay_length_over_scrape_off_layer)
    describe radial falloff rather than this single local value.


    Typical values in tokamak scrape-off layers are 5-100 eV near the outboard midplane,
    with lower values common farther from the separatrix and higher values possible
    close to the separatrix in strongly heated plasmas. The value is governed by parallel
    heat conduction, sheath heat transmission, cross-field transport, ionization and
    radiation losses, and upstream power flow.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_average_temperature_at_midplane
  - name:electron_temperature_at_wall
  - name:thermal_electron_decay_length_over_scrape_off_layer
  arguments:
  - name: temperature_at_midplane
    operator: electron
    operator_kind: qualifier
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/collector/t_e
    dd_path: langmuir_probes/reciprocating/plunge/collector/t_e
    status: composed
  - id: dd:langmuir_probes/reciprocating/plunge/t_e
    dd_path: langmuir_probes/reciprocating/plunge/t_e
    status: attached
- name: ion_temperature_at_midplane
  kind: scalar
  status: draft
  description: Local ion temperature at the outboard, low-field-side midplane of the
    scrape-off-layer plasma. It represents the ion thermal energy at that point, not
    a flux-surface or midplane-averaged value.
  documentation: 'Local ion temperature at the midplane is the thermal spread of the
    ion velocity distribution evaluated at the outboard, low-field-side crossing of
    the scrape-off-layer plasma. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height,
    it is a point quantity near the $Z$ position of the magnetic axis, distinct from
    the averaged comparator [ion_average_temperature_at_midplane](name:ion_field_line_average_temperature_over_scrape_off_layer).


    For a single ion species $s$, the numerical temperature reported in electronvolts
    is related to the second central moment of the ion distribution function by:


    $$

    T_{i,s}^{\mathrm{eV}}(\mathbf{x}_m) = \frac{m_s}{3 e\, n_s(\mathbf{x}_m)} \int
    |\mathbf{v}-\mathbf{u}_s(\mathbf{x}_m)|^2 f_s(\mathbf{x}_m,\mathbf{v})\, d^3v

    $$


    where $\mathbf{x}_m$ is the local midplane position, $m_s$ is the ion mass, $e$
    is the elementary charge, $n_s$ is the ion density, $\mathbf{u}_s$ is the mean
    ion flow velocity, and $f_s$ is normalized so that its velocity integral gives
    $n_s$. For unresolved mixtures, the unqualified ion temperature denotes an effective
    bulk-ion value, normally the density-weighted species average $\sum_s n_s T_{i,s}/\sum_s
    n_s$; species-specific temperatures require an explicit species qualifier.


    At the outboard midplane in the scrape-off layer, this quantity is commonly inferred
    from local electrostatic probe measurements, including reciprocating probe plunges,
    or from edge diagnostic analysis constrained by sheath and kinetic models. Because
    the measurement samples the plasma at the collector or viewing location, it should
    be interpreted as a local boundary-plasma value rather than as a flux-surface
    average.


    Representative local scrape-off-layer midplane ion temperatures are typically
    5-100 eV, with values of a few eV to 20 eV in cooler far-scrape-off-layer or detached
    conditions and 20-100 eV closer to the separatrix in attached, higher-power conditions.
    Core and pedestal ion temperatures can be much larger and should not be inferred
    from this local boundary quantity.'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_field_line_average_temperature_over_scrape_off_layer
  arguments:
  - name: temperature_at_midplane
    operator: ion
    operator_kind: qualifier
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/collector/t_i
    dd_path: langmuir_probes/reciprocating/plunge/collector/t_i
    status: attached
  - id: dd:langmuir_probes/reciprocating/plunge/t_i
    dd_path: langmuir_probes/reciprocating/plunge/t_i
    status: composed
- name: temperature_at_sensor_attachment_point
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the material at the point where a monitoring
    sensor is mechanically attached to a structural component. It is a calibrated
    absolute temperature of the attachment region, not the sensor's raw electrical
    response.
  documentation: 'Temperature at a sensor attachment point is the local thermodynamic
    temperature of the structural material at the mechanical contact or bonding location
    of a monitoring sensor. It represents the material state at that attachment region
    on the Kelvin scale, distinct from a temperature difference or from the uncalibrated
    electrical signal produced by the sensor.


    For a sufficiently small attachment region, the quantity is the material temperature
    field evaluated at the attachment location:


    $$

    T_\mathrm{attach}(t) = T_\mathrm{mat}(\mathbf{x}_a,t)

    $$


    where $T_\mathrm{attach}$ is the attachment-point temperature, $T_\mathrm{mat}$
    is the thermodynamic temperature field in the component material, $\mathbf{x}_a$
    is the position of the sensor attachment point, and $t$ is time.


    In practice this temperature is obtained from a calibrated sensor in thermal contact
    with the component, such as a thermocouple, resistance thermometer, or similar
    contact temperature monitor. The calibration converts the measured electrical
    response, together with any reference-junction or lead corrections, into an absolute
    temperature estimate for the attachment region; the raw voltage-type signal is
    a related but different quantity, for example [voltage_of_temperature_sensor](name:voltage_of_temperature_sensor).
    Nearby coolant temperatures such as [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet)
    and [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet) may influence
    the local value but do not define it.


    Representative values for room-temperature structural monitoring are about 290-320
    K before strong local heating or cooling. Operational values are component-, attachment-,
    and sensor-specific, so allowable ranges should be determined from the material,
    thermal environment, and sensor calibration rather than inferred from the standard
    name alone.'
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
  - name:voltage_of_temperature_sensor
  - name:temperature_of_neutron_detector
  sources:
  - id: dd:operational_instrumentation/sensor/temperature
    dd_path: operational_instrumentation/sensor/temperature
    status: composed
- name: temperature_at_wall
  kind: scalar
  status: draft
  description: Representative kinetic temperature of the boundary plasma immediately
    adjacent to a plasma-facing wall surface, encompassing both electron and ion populations
    and distinct from the solid wall material temperature.
  documentation: "The plasma temperature at the wall characterizes the thermal energy\
    \ scale of the boundary plasma in the thin layer immediately in front of plasma-facing\
    \ components. It forms the thermal boundary condition for plasma-wall interaction\
    \ models governing sheath formation, particle recycling, and surface heat loading.\
    \ The separate contributions from electrons and ions are resolved by [electron_temperature_at_wall](name:electron_temperature_at_wall)\
    \ and [ion_temperature_at_wall](name:ion_temperature_at_wall), the latter representing\
    \ a density-weighted average over all ion species and charge states when no species\
    \ is specified.\n\nThe local electron and ion temperatures jointly determine the\
    \ sheath potential $\\phi_s$ at the wall, with the directed ion energy at the\
    \ sheath edge approximated as $E_i \\approx 2 k_B T_e + k_B T_i + e\\phi_s$, where\
    \ $k_B$ is the Boltzmann constant, $T_e$ is the electron temperature, $T_i$ is\
    \ the ion temperature, and $e$ is the elementary charge.\n\nThe wall-adjacent\
    \ plasma temperature is inferred from wall-embedded or near-wall Langmuir probes,\
    \ retarding field analyzers, or from scrape-off-layer transport models constrained\
    \ by measured particle and energy fluxes such as plasma_deposited_power_at_wall.\n\
    \nTypical boundary plasma temperatures range from approximately $10^4$ to $10^6$\
    \ K (1\u2013100 eV) in tokamak devices, with higher values in the main scrape-off\
    \ layer and lower values near divertor targets and limiter surfaces."
  unit: K
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_temperature_at_wall
  - name:ion_temperature_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/temperature/values
    dd_path: wall/description_ggd/ggd/temperature/values
    status: composed
  - id: dd:wall/global_quantities/temperature
    dd_path: wall/global_quantities/temperature
    status: composed
- name: electron_temperature_at_wall
  kind: scalar
  status: draft
  description: Kinetic temperature of electrons in the plasma immediately adjacent
    to a plasma-facing wall surface, distinct from the material temperature of the
    solid wall. It represents the local electron thermal energy scale on the plasma
    side of the sheath.
  documentation: 'Electron temperature at the wall is the scalar kinetic temperature
    of electrons in the boundary plasma on the plasma side of a plasma-facing material
    surface. It describes the local random electron energy spread immediately adjacent
    to the wall and is distinct from the solid material temperature. As a second central
    moment of a velocity distribution, it is non-negative and equals zero only for
    an electron population with no thermal spread.


    For a local electron distribution, the kinetic definition is the second central
    moment of velocity about the mean flow:


    $$

    \mathcal{T}_e = \frac{m_e}{3 n_e}\int |\mathbf{v}-\mathbf{u}_e|^2 f_e(\mathbf{v})\,d^3v

    $$


    where $\mathcal{T}_e$ is the scalar electron thermal energy in joules, $m_e$ is
    the electron mass in kg, $n_e=\int f_e(\mathbf{v})\,d^3v$ is the electron density
    in m^-3, $\mathbf{v}$ and $\mathbf{u}_e$ are particle and mean electron velocities
    in m s^-1, and $f_e$ is normalized so that its velocity integral gives $n_e$ (units
    m^-6 s^3 when velocity is in m s^-1). The value in eV is $T_e=\mathcal{T}_e/E_\mathrm{eV}$,
    with $E_\mathrm{eV}=1.602176634\times10^{-19}\ \mathrm{J}$.


    In practice this quantity is inferred at plasma-facing surfaces from diagnostics
    and models sensitive to the near-wall electron distribution. Flush or embedded
    Langmuir probes estimate it from the electron retarding portion of a swept current-voltage
    characteristic, while analysis may use single- or multi-temperature effective
    fits when the distribution is not well represented by one Maxwellian. It can also
    be supplied by edge or sheath calculations that evaluate the local distribution
    function at the wall.


    Representative values are strongly regime dependent: detached or highly cooled
    divertor plasmas are often around 0.5-5 eV, attached divertor and limiter conditions
    commonly a few to several tens of eV, and hotter low-density boundary plasmas
    can approach 100 eV. This quantity is the electron counterpart of [ion_temperature_at_wall](name:ion_temperature_at_wall)
    and helps interpret total_incident_electron_particle_flux_at_wall and electron_incident_kinetic_energy_flux_at_wall;
    it should not be confused with upstream [electron_temperature_at_midplane](name:electron_temperature_at_midplane).'
  unit: eV
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_temperature_at_wall
  - name:electron_temperature_at_midplane
  arguments:
  - name: temperature_at_wall
    operator: electron
    operator_kind: qualifier
