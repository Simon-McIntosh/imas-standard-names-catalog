      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Net electric power generated by the thermal power plant of a fusion
        facility, equal to turbine output minus parasitic power consumed by pumps
        and compressors. A key metric for assessing plant net electrical output.
      kind: llm
- name: prefill_count
  kind: scalar
  status: active
  description: Dimensionless equivalent-electron count of gas introduced by injection
    during the plasma prefill phase before breakdown, where each injected atom or
    molecule contributes a count equal to the total number of its bound electrons.
  documentation: "The prefill count is a species-resolved, dimensionless measure of\
    \ the neutral gas inventory accumulated in the vessel during the prefill phase\
    \ \u2014 the interval from the start of gas injection up to plasma breakdown.\
    \ Rather than reporting raw atom or molecule numbers, the quantity normalizes\
    \ each species to equivalent electrons so that inventories of different gasses\
    \ are directly comparable on a common electron-inventory scale.\n\nFor a single\
    \ injected species, the equivalent-electron count is:\n\n$$\nN_\\mathrm{eq} =\
    \ Z_\\mathrm{eff} \\, N\n$$\n\nwhere $N$ is the total number of injected atoms\
    \ or molecules accumulated during the prefill phase and $Z_\\mathrm{eff}$ is the\
    \ number of bound electrons per atom or molecule (equal to the atomic number $Z$\
    \ for monatomic species, or the sum of constituent atomic numbers for molecular\
    \ species). For example, [argon_prefill_count](name:argon_prefill_count) uses\
    \ $Z_\\mathrm{eff} = 18$ per atom, while [nitrogen_prefill_count](name:nitrogen_prefill_count)\
    \ uses $Z_\\mathrm{eff} = 7$ per atom (14 per N$_2$ molecule). For [hydrogen_prefill_count](name:hydrogen_prefill_count)\
    \ and [deuterium_prefill_count](name:deuterium_prefill_count), $Z_\\mathrm{eff}\
    \ = 1$, so the equivalent-electron count equals the atom count directly.\n\nThis\
    \ quantity covers only gas introduced by active injection during the prefill phase;\
    \ contributions from wall recycling, neutral beams, pellets, or post-breakdown\
    \ fueling are excluded. The post-breakdown counterpart is represented by the accumulated\
    \ count family, such as [accumulated_neon_count](name:accumulated_neon_count)."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_prefill_count
  - name:nitrogen_prefill_count
  - name:hydrogen_prefill_count
  - name:deuterium_prefill_count
  - name:accumulated_neon_count
