- name: y_coordinate_of_sensor_attachment_point
  kind: scalar
  status: active
  description: Y coordinate of the point where a sensor is physically attached to
    a device component, in the right-handed Cartesian (x, y, z) machine frame.
  documentation: 'The $y$ coordinate of a sensor attachment point specifies the location
    along the $y$ axis of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    machine frame at which a sensor is physically mounted to a structural component,
    where $\hat{z}$ is the vertical axis and $\phi = 0$ is defined by the facility
    convention.


    Together with [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)
    and [vertical_coordinate_of_sensor_attachment_point](name:z_coordinate_of_sensor_attachment_point),
    this coordinate fully determines the three-dimensional position of the mechanical
    attachment point in the machine reference frame. Attachment point coordinates
    are established from engineering drawings or direct metrology surveys of the as-built
    device; accurate knowledge of these positions is essential for relating sensor
    signals to plasma geometry and for alignment corrections in field or current reconstructions.


    Sign convention: Positive when the attachment point lies in the $+\hat{y}$ direction
    from the machine Cartesian origin.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
