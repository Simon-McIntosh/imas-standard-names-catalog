- name: vertical_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the geometric center of an electron cyclotron\
    \ launcher mirror, measured along the machine symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ locates the geometric center of an EC
    launcher mirror along the machine symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z = 0$ denotes the machine midplane. Together with
    the major-radius coordinate [radial_centroid_of_electron_cyclotron_launcher_mirror](name:radial_centroid_of_electron_cyclotron_launcher_mirror)
    and the toroidal angle, it fully specifies the three-dimensional position of the
    mirror center in the machine.


    The vertical position is determined by the port assignment in the vacuum vessel
    and is established during machine assembly or optical survey, with uncertainties
    of order millimeters. The coordinate serves as a boundary condition for beam-tracing
    calculations that compute EC wave power deposition and current-drive profiles;
    small changes in $Z$ shift the injection height and alter which resonance layer
    the beam intercepts.


    EC launchers installed in equatorial ports have mirror $Z$ values near the midplane,
    while upper-port launchers occupy elevated $Z$ positions depending on machine
    geometry and plasma shaping requirements. The [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror)
    parametrizes the mirror rotation that steers the beam poloidally, while the mirror
    boundary in its local planar frame is described by x1_coordinate_of_electron_cyclotron_launcher_mirror
    and x2_coordinate_of_electron_cyclotron_launcher_mirror. For an analogous position
    coordinate of a different heating system, see [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector).


    Sign convention: Positive when the mirror center is located above the machine
    midplane in the direction of increasing $Z$.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:radial_centroid_of_electron_cyclotron_launcher_mirror
  - name:angle_of_electron_cyclotron_launcher_mirror
  - name:vertical_coordinate_of_neutral_beam_injector
  sources:
  - dd_path: ec_launchers/mirror/geometry/centre/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-mirror-geometry-centre-z
    dd_documentation:
      leaf: Height
      parent_path: ec_launchers/mirror/geometry/centre
      parent: 'Coordinates of the origin of the local coordinate system (X1,X2,X3)
        describing the object. This origin is located within the object area and should
        be the middle point of the object surface. If geometry_type=2, it''s the centre
        of the circular object. If geometry_type=3, it''s the centre of the rectangular
        object. '
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Vertical (Z) coordinate of centre.
      kind: template
- name: vertical_coordinate_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: "Vertical coordinate of the reference point of an ion-cyclotron heating\
    \ antenna, measured from the machine equatorial midplane in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is the signed vertical coordinate of the reference
    point of an ion-cyclotron heating antenna. It locates that reference point in
    the right-handed cylindrical $(R, \phi, Z)$ frame with basis $(\hat{R}, \hat{\phi},
    \hat{Z})$, and does not describe the antenna''s dimensions or emitting surface.


    The coordinate is defined by


    $$

    Z_{\mathrm{ref}} = \mathbf{r}_{\mathrm{ref}} \cdot \hat{Z}

    $$


    where $\mathbf{r}_{\mathrm{ref}}$ is the position vector of the antenna reference
    point, $\hat{Z}$ is the upward vertical unit vector, and $Z_{\mathrm{ref}}$ is
    a length coordinate expressed in m. The analogous location quantity for another
    radio-frequency antenna is the [vertical coordinate of a lower hybrid antenna](name:vertical_coordinate_of_lower_hybrid_antenna).


    Sign convention: Positive when the reference point lies in the $+Z$ direction
    from the machine equatorial midplane.'
