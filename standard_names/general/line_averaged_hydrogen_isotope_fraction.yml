name: line_averaged_hydrogen_isotope_fraction
status: draft
cocos_transformation_type: one_like
description: Line-averaged ratio of hydrogen (protium) ion density to total hydrogenic
  ion density along a diagnostic chord, characterizing isotopic composition.
documentation: "The line-averaged hydrogen isotope fraction is $\\langle f_H \\rangle_\\\
  ell = \\langle n_H \\rangle_\\ell / \\langle n_H + n_D + n_T \\rangle_\\ell$, where\
  \ $n_H$, $n_D$, and $n_T$ denote the protium, deuterium, and tritium ion number\
  \ densities respectively, and $\\langle \\cdot \\rangle_\\ell$ indicates a line\
  \ integral divided by path length. This dimensionless quantity lies in $[0, 1]$\
  \ and is essential for fusion performance assessment because D-T reactivity peaks\
  \ near $f_D \\approx f_T \\approx 0.5$; tracking $f_H$ constrains the fuel-mix optimization\
  \ and quantifies protium dilution. The principal diagnostic is Balmer-alpha spectroscopy\
  \ exploiting the isotope wavelength shift ($\\Delta\\lambda \\approx 0.18$ nm between\
  \ H$_\\alpha$ at 656.28 nm and D$_\\alpha$ at 656.10 nm), supplemented by neutral\
  \ particle analyzers and Penning gauges in the sub-divertor region. In deuterium-dominated\
  \ plasmas, typical values are $f_H < 0.05$; mixed H-D heating campaigns may show\
  \ $f_H = 0.1$\u20130.9. See also density-ratio quantities `ratio_of_hydrogen_to_deuterium_number_density`\
  \ and `ratio_of_hydrogen_to_electron_number_density`."
