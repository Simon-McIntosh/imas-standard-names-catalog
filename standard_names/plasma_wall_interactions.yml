- name: ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless global boron abundance ratio using separately volume-averaged
    boron and electron number densities, with neutral boron and every ionic charge
    state included.
  documentation: 'This quantity is the global abundance of elemental boron relative
    to the electron population. It characterizes plasma composition over the full
    plasma volume rather than at a local point or along a line of sight.


    The defining ratio is


    $$

    f_B = \frac{\overline{n}_B}{\overline{n}_e}

    $$


    where $f_B$ is the boron-to-electron abundance ratio, $\overline{n}_B$ is the
    volume-averaged elemental boron number density, and $\overline{n}_e$ is the volume-averaged
    electron number density. The overbar denotes averaging over the plasma volume.


    The numerator includes neutral boron and every ionic boron charge state, while
    the denominator represents the complete electron population. For the associated
    plasma-composition convention, the ratio is evaluated at the time of peak electron
    density.


    This quantity is distinct from local [boron density](name:boron_density) and from
    [line-averaged boron density](name:line_averaged_boron_density): it is a quotient
    of two separately volume-averaged densities, not a volume average of a pointwise
    ratio or a line average. Its numerator is the [volume-averaged boron density](name:volume_averaged_boron_density),
    making this ratio the corresponding normalized composition measure.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links: []
  sources:
  - dd_path: summary/composition/boron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-composition-boron-value
    dd_documentation:
