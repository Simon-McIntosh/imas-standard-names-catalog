  - id: dd:summary/local/separatrix_average/velocity_phi/beryllium/value
    dd_path: summary/local/separatrix_average/velocity_phi/beryllium/value
    status: composed
- name: toroidal_carbon_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the carbon impurity ion fluid velocity evaluated
    at the H-mode pedestal top.
  documentation: 'Toroidal component of the carbon impurity ion fluid velocity evaluated
    at the H-mode pedestal top is the projection of the bulk carbon ion flow onto
    the toroidal direction at the top of the edge transport barrier. As a species-level
    intensive quantity, it denotes the density-weighted mean velocity over all carbon
    charge states when charge states are not resolved.


    The toroidal projection is defined by:


    $$

    v_{\mathrm{C},\phi} = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{C}}$ is the carbon ion fluid velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the major radius and $Z$
    the vertical height.


    In practice this quantity is commonly inferred from Doppler shifts of carbon emission,
    often using charge-exchange recombination spectroscopy, and evaluated at the pedestal-top
    location identified from edge density, temperature, or pressure gradients. It
    is used as an impurity-tracer measure of edge toroidal rotation and momentum coupling
    to the main ion flow.


    Typical pedestal-top magnitudes are about $10^3-5 \times 10^4$ m.s^-1, depending
    on momentum input, collisionality, pedestal structure, and magnetic configuration.


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_beryllium_velocity_at_pedestal_top
  - name:toroidal_nitrogen_velocity_at_pedestal_top
- name: toroidal_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the carbon impurity ion bulk flow velocity at\
    \ the plasma boundary, resolved in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame. It is the local value at the last-closed flux surface, not a flux-surface\
    \ average."
  documentation: 'Toroidal carbon velocity at the plasma boundary is the component
    of the carbon impurity ion bulk flow along the toroidal direction at the last-closed
    flux surface or separatrix. The toroidal direction is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. This quantity denotes a local boundary value;
    the corresponding flux-surface-averaged quantity is [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary).


    The local toroidal component is defined by projecting the carbon bulk velocity
    onto the toroidal unit vector:


    $$

    v_{\phi}^{\mathrm{C}} = \mathbf{v}_{\mathrm{C}} \cdot \hat{\phi} = R\Omega_{\mathrm{C}}

    $$


    where $v_{\phi}^{\mathrm{C}}$ is the carbon toroidal velocity in m.s^-1, $\mathbf{v}_{\mathrm{C}}$
    is the carbon ion bulk velocity in m.s^-1, $\hat{\phi}$ is the unit vector in
    the direction of increasing toroidal angle $\phi$, $R$ is the major radius in
    m, and $\Omega_{\mathrm{C}}$ is the carbon toroidal angular rotation frequency
    in s^-1.


    In practice, this velocity is commonly inferred from Doppler shifts of carbon
    spectral lines, often using charge-exchange or passive edge spectroscopy, after
    correcting for viewing geometry and projecting the measured line-of-sight velocity
    onto the toroidal direction. The plasma boundary location is usually supplied
    by magnetic equilibrium reconstruction, and the measured or modeled velocity is
    mapped to the last-closed flux surface. When only an average over the boundary
    flux surface is intended, the flux-surface-averaged standard name should be used
    instead.


    Typical absolute values at the plasma boundary are of order $10^3-5 \times 10^4$
    m.s^-1 in tokamak edge plasmas. Values can be close to zero in weakly rotating
    conditions and can approach $10^5$ m.s^-1 in plasmas with strong external torque
    or steep edge rotation gradients.


    Sign convention: Positive when the carbon ion flow is in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_magnetic_axis
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:toroidal_krypton_velocity_at_plasma_boundary
- name: toroidal_deuterium_tritium_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal deuterium-tritium velocity at the pedestal top is the component\
    \ along the toroidal direction in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame of the bulk flow velocity of the effective single fuel species representing\
    \ deuterium and tritium with mean atomic mass 2.5."
  documentation: 'Toroidal deuterium-tritium velocity at the pedestal top is the component
    along the toroidal direction in the right-handed cylindrical $(R, \phi, Z)$ frame
    of the bulk flow velocity of the effective single fuel species representing deuterium
    and tritium with mean atomic mass 2.5. The pedestal top is the transition region
    between the steep-gradient H-mode pedestal and the core plasma. As an intensive
    species-level velocity, it denotes the density-weighted mean over all charge states
    represented in that effective species.


    The toroidal component is the projection of the effective deuterium-tritium fluid
    velocity onto the toroidal unit vector:


    $$

    v_\phi = \mathbf{v}_\mathrm{DT} \cdot \hat{\phi}

    $$


    where $v_\phi$ is the toroidal deuterium-tritium velocity in $\mathrm{m\,s^{-1}}$,
    $\mathbf{v}_\mathrm{DT}$ is the bulk fluid velocity of the effective deuterium-tritium
    species in $\mathrm{m\,s^{-1}}$, and $\hat{\phi}$ is the unit vector in the direction
    of increasing $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    At the pedestal top, this quantity characterizes edge rotation and contributes
    to radial force balance and flow shear in the transport barrier. Ion toroidal
    rotation is commonly inferred from Doppler spectroscopy and equilibrium geometry;
    interpreting a measured ion velocity as an effective deuterium-tritium fuel velocity
    requires model assumptions about species differences. Related quantities include
    the deuterium-only counterpart [toroidal_deuterium_velocity_at_pedestal_top](name:toroidal_deuterium_velocity_at_pedestal_top)
    and the same effective-fuel velocity evaluated at the [magnetic axis](name:toroidal_deuterium_tritium_velocity_at_magnetic_axis),
    [internal transport barrier](name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier),
    and [plasma boundary](name:toroidal_deuterium_tritium_velocity_at_plasma_boundary).


    Typical pedestal-top magnitudes are strongly scenario dependent: values can be
    near 0 m.s^-1 in weakly rotating cases and are often up to order 5e4 m.s^-1 in
    rotating H-mode plasmas, with larger magnitudes possible under strong momentum
    input.


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_tritium_velocity_at_magnetic_axis
  - name:toroidal_deuterium_tritium_velocity_at_internal_transport_barrier
  - name:deuterium_tritium_density_at_pedestal_top
- name: toroidal_deuterium_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the bulk flow velocity for the effective deuterium-tritium\
    \ single-species approximation with atomic mass 2.5 amu, evaluated at the last\
    \ closed flux surface. It is the projection along the \u03C6 direction in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, where \u03C6 increases counter-clockwise\
    \ when viewed from above +Z."
  documentation: 'The toroidal deuterium-tritium velocity at the plasma boundary is
    the component of the effective DT bulk flow tangent to the toroidal direction
    at the last closed flux surface. The effective species represents deuterium and
    tritium as a single ion population with atomic mass 2.5 amu. The right-handed
    cylindrical $(R, \phi, Z)$ frame uses $R$ as major radius measured from the toroidal
    symmetry axis, $\phi$ as toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ as vertical height.


    The toroidal component is defined by projecting the effective DT bulk velocity
    vector onto the toroidal basis direction at the plasma boundary:


    $$

    v_{\phi,\mathrm{DT}}^{\mathrm{bdry}} = \left. \mathbf{v}_{\mathrm{DT}}(R,\phi,Z)
    \cdot \hat{\phi} \right|_{\mathrm{LCFS}}

    $$


    where $v_{\phi,\mathrm{DT}}^{\mathrm{bdry}}$ and $\mathbf{v}_{\mathrm{DT}}$ are
    velocities in $\mathrm{m\,s^{-1}}$, $\hat{\phi}$ is the dimensionless toroidal
    unit vector, LCFS denotes the last closed flux surface, $R$ and $Z$ are coordinate
    values in meters, and $\phi$ is in radians.


    In transport modeling this quantity is obtained from the effective DT ion momentum
    balance or velocity field and evaluated, or interpolated, to the last closed flux
    surface. When related to measurements, edge ion flow information is commonly inferred
    from spectroscopic Doppler shifts together with a model that maps the observed
    ion flow to the effective DT species representation.


    Typical edge toroidal ion flow magnitudes near the last closed flux surface are
    about $10^3$-$10^5$ m.s^-1, with smaller values possible in weakly rotating plasmas
    and larger values during strong external momentum input or strong edge electric-field
    shear. The signed value may be positive or negative depending on the toroidal
    flow direction.


    Sign convention: Positive when the toroidal component of the effective deuterium-tritium
    bulk velocity points in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  - name:toroidal_tritium_velocity_at_plasma_boundary
