- name: xenon_density
  kind: scalar
  status: draft
  description: Number density of xenon ions at a given point in the plasma, summed
    over all ionization states from singly ionized through fully stripped xenon, excluding
    neutral xenon atoms.
  documentation: 'Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe}
    = 54$) introduced into fusion plasmas for radiative-mantle experiments, impurity-transport
    studies, and disruption mitigation. The xenon ion number density $n_\mathrm{Xe}$
    quantifies the local concentration of all charged xenon species and enters the
    plasma effective charge through $Z_\mathrm{eff} = \sum_i Z_i^2 n_i / n_e$, where
    $n_i$ is the partial density of ion species $i$ and $n_e$ is the electron density.


    The total xenon ion density is the sum over all ionic charge states:


    $$

    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}

    $$


    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions carrying
    charge $ze$. The charge-state distribution is determined by coronal equilibrium
    or collisional-radiative modeling at the local electron temperature and density.


    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray line
    emission via spectroscopy and tomographic inversion, or from charge-exchange recombination
    spectroscopy using neutral-beam injection. Spatially resolved forms include [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)
    at the innermost flux surface and [xenon_density_at_pedestal](name:xenon_density_at_pedestal)
    in the edge transport barrier, while [volume_averaged_xenon_density](name:volume_averaged_xenon_density)
    provides the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by xenon_fraction.


    Sign convention: Positive when ionized xenon is present in the plasma.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density_at_magnetic_axis
  - name:xenon_density_at_pedestal
  - name:volume_averaged_xenon_density
- name: line_averaged_xenon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of xenon ions along a chord through the
    plasma, obtained by dividing the path integral of the local xenon ion density
    by the chord length.
  documentation: "The line-averaged xenon ion number density is the chord-path mean\
    \ of the local [xenon_density](name:xenon_density), which sums all charged xenon\
    \ ionization states from Xe$^{1+}$ through Xe$^{54+}$, normalized by the measurement\
    \ chord length through the plasma.\n\nThe defining relation is:\n\n$$\n\\bar{n}_\\\
    mathrm{Xe} = \\frac{1}{L} \\int_0^L n_\\mathrm{Xe}(\\ell) \\, d\\ell\n$$\n\nwhere\
    \ $n_\\mathrm{Xe}(\\ell)$ is the local xenon ion number density at arc-length\
    \ position $\\ell$ along the chord and $L$ is the total chord length.\n\nThis\
    \ quantity is inferred from line-integrated emission diagnostics sensitive to\
    \ xenon spectral lines \u2014 including soft X-ray arrays and visible-range spectrometers\
    \ \u2014 combined with knowledge of the chord geometry. The [volume_averaged_xenon_density](name:volume_averaged_xenon_density)\
    \ provides the spatial mean over the full plasma volume, and [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)\
    \ captures the on-axis value. The analogous chord-averaged quantity for argon\
    \ is documented as [line_averaged_argon_density](name:line_averaged_argon_density).\n\
    \nIn trace impurity transport experiments, xenon concentrations yield $\\bar{n}_\\\
    mathrm{Xe} \\sim 10^{14}$\u2013$10^{16}$ m$^{-3}$; during disruption-mitigation\
    \ massive gas injection or shattered-pellet scenarios, values can reach $10^{17}$\u2013\
    $10^{19}$ m$^{-3}$.\n\nSign convention: Positive when xenon ions are present along\
    \ the measurement chord."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density
  - name:volume_averaged_xenon_density
  - name:xenon_density_at_magnetic_axis
  - name:line_averaged_argon_density
  arguments:
  - name: xenon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/xenon/value
    dd_path: summary/line_average/n_i/xenon/value
    status: composed
- name: fast_ion_atomic_number
  kind: scalar
  status: draft
  description: Nuclear proton count of the fast ion species detected in charge exchange
    spectroscopy, uniquely identifying the element independently of its ionization
    state.
  documentation: "The fast ion atomic number $Z_n$ is the number of protons in the\
    \ nucleus of the energetic (non-thermal) ion species observed via Fast Ion Charge\
    \ eXchange (FICX) spectroscopy. As an intrinsic nuclear property, $Z_n$ is invariant\
    \ with respect to ionization state and unambiguously identifies the element: $Z_n\
    \ = 1$ for hydrogen isotopes (deuterium, tritium), $Z_n = 2$ for helium (alpha\
    \ particles), $Z_n = 6$ for carbon, and $Z_n = 74$ for tungsten.\n\nThis quantity\
    \ is the fast-ion-population counterpart of [ion_atomic_number](name:ion_atomic_number),\
    \ which gives the same nuclear property for a general ion species. It is physically\
    \ distinct from [fast_ion_charge](name:fast_ion_atomic_number), which specifies\
    \ the ionic charge state $Z_\\text{ion}$ \u2014 the net charge arising from electron\
    \ removal \u2014 and which can vary for the same element at different ionization\
    \ conditions. Together with [fast_ion_mass](name:ion_atomic_mass), the atomic\
    \ number fully characterizes the fast ion species entering the spectral interpretation\
    \ of FICX emission.\n\nIn charge exchange diagnostics, the fast ion species is\
    \ identified prior to line inversion; $Z_n$ is an integer-valued input parameter\
    \ rather than a derived measurement, taking values from 1 (hydrogenic fast ions\
    \ in D-T plasmas) to the atomic number of the heaviest injected impurity species."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_atomic_number
  - name:ion_atomic_mass
  arguments:
  - name: ion_atomic_number
    operator: fast
    operator_kind: qualifier
  sources:
  - id: dd:charge_exchange/channel/ion_fast/z_ion
    dd_path: charge_exchange/channel/ion_fast/z_ion
    status: composed
- name: line_averaged_argon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of argon ions along a chord through the
    plasma, obtained by dividing the path integral of the local argon ion density
    by the chord length.
  documentation: 'Line-averaged argon density is the chord-averaged number density
    of argon ions along a line of sight through the plasma. The local argon ion density
    is understood as the sum over argon ionization stages, so the line average represents
    the effective argon ion content sampled by the chord.


    The line average is defined by normalizing the line-integrated density by the
    chord length through the plasma:


    $$

    \langle n_{\mathrm{Ar}} \rangle_L = \frac{1}{L}\int_{\mathrm{chord}} n_{\mathrm{Ar}}(l)\,dl

    $$


    where $l$ is distance along the chord in meters, $L$ is the chord length through
    the plasma in meters, and $n_{\mathrm{Ar}}(l)$ is the local argon ion number density
    in $m^{-3}$. The integral has units of $m^{-2}$, and division by $L$ gives a line-averaged
    density in $m^{-3}$.


    In practice this quantity is obtained by first converting calibrated diagnostic
    signals to an argon density line integral, using the appropriate atomic physics,
    instrument response, and plasma-parameter modeling for the measurement. Raw brightness,
    spectral intensity, or other chord-integrated signals are not themselves line-averaged
    density; they must be interpreted as or transformed into $\int n_{\mathrm{Ar}}
    dl$ before normalization by the effective chord length.


    Typical values are about $10^{14}-10^{16}\ m^{-3}$ for trace argon concentrations,
    $10^{16}-10^{18}\ m^{-3}$ during deliberate argon seeding or impurity transport
    studies, and can approach $10^{19}\ m^{-3}$ transiently during strong gas injection
    or disruption-mitigation scenarios.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:argon_density
  - name:volume_averaged_argon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_effective_charge
  arguments:
  - name: argon_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/argon/value
    dd_path: summary/line_average/n_i/argon/value
    status: composed
- name: line_averaged_carbon_density
  kind: scalar
  status: draft
  description: Line-averaged carbon density is the total carbon number density, including
    neutral carbon through fully stripped C6+, averaged along a diagnostic line of
    sight. It equals the path integral of the summed local carbon charge-state densities
    divided by the chord length.
  documentation: 'Line-averaged carbon density quantifies the carbon impurity content
    sampled by a diagnostic chord. It is the chord average of the total local carbon
    number density, where total carbon includes neutral carbon and all ionization
    states through fully stripped carbon.


    The line average is defined by integrating the charge-state-summed carbon density
    along the chord:


    $$

    \bar{n}_C = \frac{1}{L}\int_0^L \left[n_{\mathrm{C^0}}(l) + \sum_{q=1}^{6} n_{\mathrm{C}^{q+}}(l)\right]
    \, dl

    $$


    where $\bar{n}_C$ is the line-averaged carbon density, $L$ is the chord length
    in meters, $l$ is distance along the line of sight in meters, $n_{\mathrm{C^0}}(l)$
    is the local neutral carbon density in m^-3, and $n_{\mathrm{C}^{q+}}(l)$ is the
    local density in m^-3 of carbon with charge state $q$.


    In practice this quantity is inferred from passive impurity spectroscopy, active
    charge-exchange recombination spectroscopy, or related line-emission measurements.
    The inference uses calibrated brightnesses together with viewing geometry, electron
    density and temperature, charge-state balance, and atomic rate coefficients to
    estimate the path-integrated total carbon density before division by the chord
    length.


    Typical line-averaged carbon densities are about $10^{17}-10^{18}$ m^-3 in plasmas
    with carbon plasma-facing components, and can be lower in devices with non-carbon
    walls or strong impurity screening. The same chord-averaging concept is used for
    [line_averaged_electron_density](name:line_averaged_electron_density) and impurity
    analogs such as [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)
    and [line_averaged_iron_density](name:line_averaged_iron_density); [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    is the corresponding volume average of the same total carbon density.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_carbon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  sources:
  - id: dd:summary/line_average/n_i/carbon/value
    dd_path: summary/line_average/n_i/carbon/value
    status: composed
- name: line_averaged_deuterium_density
  kind: scalar
  status: draft
  description: Chord-average of the deuterium ion number density along a diagnostic
    line of sight, equal to the path integral of the local deuterium density divided
    by the chord length.
  documentation: 'The line-averaged deuterium ion number density gives the mean deuterium
    particle density along a diagnostic chord through the plasma, providing a chord-path-weighted
    scalar measure of absolute deuterium content distinct from the isotopic fraction
    described by [volume_averaged_deuterium_fraction](name:volume_averaged_deuterium_fraction).


    The quantity is defined as:


    $$

    \bar{n}_D = \frac{1}{L} \int_0^L n_D(\ell) \, d\ell

    $$


    where $n_D(\ell)$ is the local deuterium ion number density in m$^{-3}$ at chord
    position $\ell$ and $L$ is the total chord length in m.


    It is typically inferred from interferometric phase-shift measurements combined
    with isotope-resolved spectroscopy sensitive to deuterium Balmer emission. It
    complements the volume-based [volume_averaged_deuterium_density](name:volume_averaged_deuterium_density)
    and analogous chord-averaged fuel densities such as [line_averaged_hydrogen_density](name:line_averaged_hydrogen_density)
    for protium and [line_averaged_helium_4_density](name:line_averaged_helium_4_density)
    for helium-4.


    Typical values range from $5 \times 10^{18}$ to $5 \times 10^{20}$ m$^{-3}$ in
    tokamak deuterium plasmas, scaling with the line-averaged electron density and
    the deuterium fuel fraction of the isotopic mix.


    Sign convention: Positive when deuterium ions are present in the plasma along
    the measurement chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_deuterium_fraction
  - name:volume_averaged_deuterium_density
  - name:line_averaged_hydrogen_density
  - name:line_averaged_helium_4_density
  sources:
  - id: dd:summary/line_average/n_i/deuterium/value
    dd_path: summary/line_average/n_i/deuterium/value
    status: composed
- name: line_averaged_deuterium_tritium_density
  kind: scalar
  status: draft
  description: Chord-averaged number density of the combined deuterium-tritium fuel-ion
    pseudo-species. It is the line integral of the local DT density along a diagnostic
    chord divided by the chord length.
  documentation: 'Line-averaged deuterium-tritium density is the chord average of
    the local number density assigned to the combined DT fuel-ion pseudo-species.
    The DT pseudo-species represents the deuterium-tritium fuel population as a single
    effective ion component; when separate deuterium and tritium densities are resolved,
    the corresponding combined density is commonly formed from their sum.


    For a chord $\mathcal{C}$ of length $L$, the line-averaged DT density is defined
    by


    $$

    \langle n_{DT} \rangle_{\mathcal{C}} = \frac{1}{L}\int_{\mathcal{C}} n_{DT}(\ell)\,d\ell

    $$


    where $n_{DT}(\ell)$ is the local combined DT ion number density at path-length
    position $\ell$ along the chord, and $L=\int_{\mathcal{C}} d\ell$ is the total
    chord length through the sampled plasma region.


    In experiments this quantity is generally inferred rather than measured directly
    as a species-resolved line integral. Line-integrated electron-density diagnostics
    provide the total plasma content along the chord, while isotope composition and
    fuel dilution are constrained using spectroscopy, neutral-particle measurements,
    neutron emission, charge-exchange measurements, and transport or equilibrium modeling.
    In simulations it is obtained by integrating the modeled local DT pseudo-species
    density along the chosen chord.


    Typical values in magnetically confined DT plasmas are about $0.1-2 \times 10^{20}$
    m$^{-3}$, with lower values in low-density or strongly diluted plasmas and values
    approaching $2-3 \times 10^{20}$ m$^{-3}$ in high-density reactor-relevant scenarios.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_tritium_density
  - name:line_averaged_deuterium_density
  - name:flux_surface_averaged_deuterium_tritium_density
  - name:volume_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_tritium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
