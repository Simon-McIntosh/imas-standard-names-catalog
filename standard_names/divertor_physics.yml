    n_{\mathrm{Kr}} = \frac{dN_{\mathrm{Kr}}}{dV}

    $$


    where $n_{\mathrm{Kr}}$ is the krypton-ion number density, $N_{\mathrm{Kr}}$ is
    the number of krypton ions, and $V$ is the local plasma volume.


    This quantity applies to the krypton-ion population immediately adjacent to a
    divertor target, evaluated at the plasma-side entrance to the electrostatic sheath.
    It is summed over all positive krypton ionization states, counting each ion once;
    neutral krypton atoms, electrons, and ions of other species are excluded.


    As a species-specific target-locus quantity, it specializes the broader [krypton_density](name:krypton_density)
    by restricting the evaluation point to the divertor target. Its locus and charge-state
    aggregation follow the corresponding [neon_density_at_divertor_target](name:neon_density_at_divertor_target),
    while the species is krypton rather than neon.'
