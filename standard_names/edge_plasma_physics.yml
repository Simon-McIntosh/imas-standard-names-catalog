      kind: template
- name: radial_thermal_ion_charge_state_energy_diffusion_coefficient
  kind: scalar
  status: active
  description: Radial Fickian diffusion coefficient governing cross-field transport
    of thermal energy carried by a specified ion charge state.
  documentation: 'The radial component of the [thermal ion charge-state energy diffusion
    coefficient](name:thermal_ion_charge_state_energy_diffusion_coefficient) governs
    the diffusive transport of thermal energy associated with one specified ion charge
    state. It excludes convective and other non-diffusive transport contributions.


    For the thermal-energy density $u_{E,i,z}$ of ion species $i$ in charge state
    $z$, the radial diffusive energy flux is defined by


    $$

    \Gamma_{E,i,z,R} = -D_{E,i,z,R}\frac{\partial u_{E,i,z}}{\partial R}

    $$


    where $\Gamma_{E,i,z,R}$ is the radial energy flux, $D_{E,i,z,R}$ is this diffusion
    coefficient, and $R$ is the radial coordinate in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Unlike [radial ion energy diffusion coefficient](name:radial_ion_energy_diffusion_coefficient),
    this quantity is resolved to a specified ion charge state rather than aggregated
    over the total ion population.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_ion_charge_state_energy_diffusion_coefficient
  - name:radial_ion_energy_diffusion_coefficient
  arguments:
  - name: thermal_ion_charge_state_energy_diffusion_coefficient
    operator: component
    operator_kind: projection
