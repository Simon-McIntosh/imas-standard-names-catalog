- name: accumulated_deuterated_methane_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative deuterated methane (CD4) delivered by gas injection after
    plasma breakdown, expressed as an equivalent-electron count with ten count units
    per neutral molecule.
  documentation: 'This quantity is the cumulative inventory of neutral deuterated
    methane molecules introduced by gas injection after plasma breakdown, represented
    using an equivalent-electron counting convention.


    $$

    N_{\mathrm{eq}} = 10N_{\mathrm{CD4}}

    $$


    where $N_{\mathrm{eq}}$ is the equivalent-electron count and $N_{\mathrm{CD4}}$
    is the cumulative number of injected CD4 molecules. The factor 10 is the sum of
    carbon''s six atomic-number contributions and one contribution from each of the
    four deuterium atoms.


    The inventory is specific to deuterated methane and excludes gas introduced before
    plasma breakdown or from other species. It differs from [deuterium_count_due_to_gas_injection](name:deuterium_count_due_to_gas_injection),
    which counts only the deuterium-atom contribution.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:deuterium_count_due_to_gas_injection
  sources:
