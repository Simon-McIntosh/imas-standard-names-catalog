- name: electron_absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Wave power absorbed by the electron population from a single coherent
    beam-tracing beam, representing the electron contribution to total path-integrated
    wave energy deposition.
  documentation: "The electron absorbed power of a beam-tracing beam is the total\
    \ wave power transferred from a single traced coherent electromagnetic beam to\
    \ the electron population over its computed propagation path. It represents the\
    \ electron contribution to wave energy deposition and sums with the ion species\
    \ contributions \u2014 ion_absorbed_power_of_beam_tracing_beam and ion_state_absorbed_power_of_beam_tracing_beam\
    \ \u2014 to give the species-summed [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam).\n\
    \nThe path-integrated electron absorbed power is determined by the local electron\
    \ damping coefficient $\\alpha_e(s)$ and the evolving beam power $P(s)$:\n\n$$\n\
    P_{e,\\mathrm{abs}} = \\int_{\\mathrm{path}} 2\\,\\alpha_e(s)\\,P(s)\\,ds\n$$\n\
    \nwhere $s$ is the arc length along the ray and $\\alpha_e$ derives from the electron\
    \ contribution to the anti-Hermitian part of the plasma dielectric tensor. For\
    \ electron cyclotron resonance heating and ECE diagnostics, $\\alpha_e$ peaks\
    \ near the resonance layer where the wave frequency satisfies $\\omega = n\\,\\\
    Omega_{ce}$, with $\\Omega_{ce} = eB/m_e$ the local electron cyclotron frequency\
    \ and $n$ a harmonic integer.\n\nThis quantity is computed by beam-tracing solvers\
    \ that propagate ray equations through a plasma equilibrium and evaluate the electron\
    \ dielectric response at each point along the path. The ratio $P_{e,\\mathrm{abs}}\
    \ / P_0$ \u2014 where $P_0$ is the [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam)\
    \ \u2014 characterizes single-pass absorption efficiency, which approaches unity\
    \ in strongly absorbing scenarios such as fundamental or second-harmonic electron\
    \ cyclotron resonance heating."
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:absorbed_power_of_beam_tracing_beam
  - name:initial_power_of_beam_tracing_beam
  arguments:
  - name: absorbed_power_of_beam_tracing_beam
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: ece/channel/beam_tracing/beam/electrons/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-electrons-power
    dd_documentation:
      leaf: Power absorbed along the beam by the species
      parent_path: ece/channel/beam_tracing/beam/electrons
      parent: Quantities related to the electrons
      data_type: FLT_1D
      unit: W
      coordinates:
      - ece/channel/beam_tracing/beam/length
    enhanced_context:
      description: Power absorbed along the beam or ray path by the electron population
        during ECE beam tracing calculations. Quantifies local electron absorption
        of the probing electromagnetic wave as a function of position along the ray.
      kind: llm
  - dd_path: waves/coherent_wave/beam_tracing/beam/electrons/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-beam_tracing-beam-electrons-power
    dd_documentation:
