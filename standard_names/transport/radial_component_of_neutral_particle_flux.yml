name: radial_component_of_neutral_particle_flux
description: Radial projection of the neutral-species particle flux density, quantifying
  the net transport of neutrals in the radial direction.
documentation: "The radial neutral particle flux $\\Gamma_n^{\\rm rad}$ (m$^{-2}$\\\
  ,s$^{-1}$) represents the number of neutral particles crossing a unit area per unit\
  \ time in the radial direction. It includes both convective and diffusive contributions:\
  \ $\\Gamma_n^{\\rm rad} = n_n v_n^{\\rm rad} - D_n \\nabla_r n_n$, where $n_n$ is\
  \ the neutral number density (m$^{-3}$), $v_n^{\\rm rad}$ is the radial convective\
  \ velocity (m\\,s$^{-1}$), and $D_n$ is the neutral diffusion coefficient (m$^2$\\\
  ,s$^{-1}$). Neutral transport is critical in the edge and divertor regions where\
  \ recycling, gas puffing, and charge-exchange reactions dominate the particle balance.\
  \ Typical values in the divertor region reach $10^{20}$\u2013$10^{22}$\\,m$^{-2}$\\\
  ,s$^{-1}$ depending on plasma density and fueling rate. The flux is evaluated from\
  \ kinetic Monte Carlo codes (EIRENE, DEGAS2) or fluid neutral models embedded in\
  \ edge transport codes."
kind: vector_component
unit: m^-2.s^-1
status: draft
