- name: vertical_coordinate_of_centroid
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the geometric centroid of a device component\
    \ or geometry element in the right-handed cylindrical (R, \u03C6, Z) frame, where\
    \ Z is the height along the machine symmetry axis."
  documentation: "The vertical coordinate of a centroid is the $Z$ component of the\
    \ mass- or area-weighted geometric center of a physical element \u2014 such as\
    \ a launcher mirror, beam source aperture, or current-carrying filament cross-section\
    \ \u2014 in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $Z$ is measured\
    \ along the machine symmetry axis (positive upward by convention). For a planar\
    \ cross-section described by area $A$, this is $Z_c = A^{-1}\\int z\\,dA$, where\
    \ $z$ is the local vertical coordinate and $A$ is the element area. Typical values\
    \ span roughly $-5$ m to $+5$ m for tokamak-scale devices, depending on the component\
    \ location relative to the machine midplane. This coordinate is usually assigned\
    \ from engineering drawings or CAD models of the device geometry rather than measured\
    \ dynamically. It pairs naturally with the corresponding major-radius component\
    \ to fully specify the poloidal-plane position of the centroid; compare [vertical_coordinate_of_annular_centerline](name:vertical_coordinate_of_annular_centerline)\
    \ and [vertical_coordinate_of_diagnostic_component_center](name:vertical_coordinate_of_diagnostic_component_center)\
    \ for analogous coordinates of specific geometry families.\n\nSign convention:\
    \ Positive when the centroid lies above the machine midplane, i.e., in the $+Z$\
    \ direction along the machine symmetry axis."
  unit: m
