name: flux_tube_parallel_domain_poloidal_turn_count
status: draft
cocos_transformation_type: one_like
description: Integer number of complete poloidal circuits spanned by the parallel
  domain of a flux-tube gyrokinetic simulation.
documentation: In flux-tube gyrokinetic simulations the computational domain extends
  along the magnetic field line over a finite parallel extent. The poloidal turn count
  $N_{\mathrm{pol}}$ specifies how many full poloidal transits ($0 \to 2\pi$ in the
  poloidal angle $\theta$) the parallel coordinate window covers, so the parallel
  domain length is $L_\parallel = N_{\mathrm{pol}} \times 2\pi q R_0$, where $q$ is
  the safety factor and $R_0$ is the major radius in meters. A single poloidal turn
  ($N_{\mathrm{pol}} = 1$) is sufficient for most micro-instability studies (ITG,
  TEM), but extended domains ($N_{\mathrm{pol}} \geq 2$) are needed to resolve modes
  with strong parallel structure such as kinetic ballooning modes or near-threshold
  trapped-electron modes. The quantity is dimensionless and positive-integer-valued.
  It is set as a user input in codes such as GS2, GENE, and GKW; convergence studies
  typically scan $N_{\mathrm{pol}}$ from 1 to 4. See also `safety_factor` for the
  field-line pitch that determines the physical parallel length per poloidal turn.
