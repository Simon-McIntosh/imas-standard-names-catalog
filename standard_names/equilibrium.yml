- name: normalized_toroidal_flux_coordinate_at_constraint_position
  kind: scalar
  status: active
  description: Dimensionless radial label locating an equilibrium constraint on a
    nested magnetic surface, normalized from the magnetic axis to the last closed
    flux surface.
  documentation: 'This quantity assigns the radial magnetic-surface coordinate of
    an equilibrium constraint position. It identifies the nested flux surface passing
    through that position rather than the physical quantity being constrained.


    The normalized toroidal flux label is defined by


    $$

    \rho_{\mathrm{tor,norm}} = \left(\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,LCFS}}
    - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the surface through the constraint position,
    $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and $\Phi_{\mathrm{tor,LCFS}}$
    is its value at the last closed flux surface (LCFS).


    The quantity is evaluated pointwise at one equilibrium constraint position within
    the nested closed-flux-surface region. With this normalization, it is zero at
    the magnetic axis and one at the LCFS; it is not a flux-surface average, volume
    average, integral, or value of the constrained current, density, pressure, or
    safety factor.


    This entry is the locus-specific evaluation of the parent [normalized toroidal
    flux coordinate](name:normalized_toroidal_flux_coordinate). It differs from [normalized
    toroidal flux coordinate at measurement position](name:normalized_toroidal_flux_coordinate_at_measurement_position)
    because its locus is an equilibrium constraint position rather than a diagnostic
    measurement location.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: constraint_position
    operator_kind: locus
  sources:
