- name: equilibrium_weight_of_flux_loop
  kind: scalar
  status: active
  description: Nonnegative factor that sets the relative contribution of an individual
    flux-loop poloidal-flux residual to an equilibrium objective function.
  documentation: "This quantity is the nonnegative relative weight assigned to the\
    \ residual of one flux loop\u2019s measured and equilibrium poloidal magnetic\
    \ flux. It controls how strongly that individual constraint influences the equilibrium\
    \ objective, rather than defining a magnetic flux itself.\n\nThe contribution\
    \ associated with one flux-loop constraint is defined by\n\n$$\nJ_{\\mathrm{FL}}\
    \ = \\frac{1}{2} w_{\\mathrm{FL}}^2 \\frac{(\\psi_{\\mathrm{rec}}-\\psi_{\\mathrm{meas}})^2}{\\\
    sigma_{\\mathrm{FL}}^2}\n$$\n\nwhere $J_{\\mathrm{FL}}$ is the objective-function\
    \ contribution of the flux-loop constraint, $w_{\\mathrm{FL}}$ is this equilibrium\
    \ weight, $\\psi_{\\mathrm{rec}}$ is the equilibrium poloidal magnetic flux at\
    \ the constraint location, $\\psi_{\\mathrm{meas}}$ is the corresponding measured\
    \ poloidal magnetic flux, and $\\sigma_{\\mathrm{FL}}$ is the standard deviation\
    \ assigned to that measurement error.\n\nThe weight applies to one flux-loop poloidal-flux\
    \ constraint and is not itself summed over sensors; the objective function aggregates\
    \ the separate contributions from individual constraints. It excludes the flux\
    \ value, the residual, and the measurement-error standard deviation, which are\
    \ distinct physical or statistical quantities.\n\nThe constrained flux is the\
    \ [poloidal magnetic flux at the constraint position](name:poloidal_magnetic_flux_at_constraint_position),\
    \ while the sensor-specific weighting convention parallels the [equilibrium weight\
    \ of a poloidal magnetic-field probe](name:equilibrium_weight_of_poloidal_magnetic_field_probe)\
    \ with a different sensor object."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:equilibrium_weight_of_poloidal_magnetic_field_probe
  sources:
  - dd_path: equilibrium/time_slice/constraints/flux_loop/weight
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-flux_loop-weight
    dd_documentation:
      leaf: Weight given to the measurement
      parent_path: equilibrium/time_slice/constraints/flux_loop
      parent: Set of flux loops
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Weight factor for flux loop.
      kind: template
- name: equilibrium_weight_of_poloidal_magnetic_field_probe
  kind: scalar
  status: active
  description: Dimensionless factor that controls the relative contribution of a poloidal
    magnetic-field probe residual to the equilibrium objective function.
  documentation: 'The equilibrium weight of a poloidal magnetic-field probe is a dimensionless
    factor assigned to the residual of one probe constraint in an equilibrium reconstruction
    objective.


    For constraint index $i$, the objective contribution is defined through


    $$

    J = \frac{1}{2}\sum_i w_i^2\frac{(q_i^{\mathrm{rec}}-q_i^{\mathrm{meas}})^2}{\sigma_i^2}

    $$


    where $J$ is the equilibrium objective function, $w_i$ is the weight of constraint
    $i$, $q_i^{\mathrm{rec}}$ is its reconstructed poloidal magnetic-field value,
    $q_i^{\mathrm{meas}}$ is its measured value, and $\sigma_i$ is the standard deviation
    of its measurement error.


    This quantity applies to a single poloidal magnetic-field probe constraint and
    does not represent the probe field, its residual, or the measurement uncertainty.
    It is not an aggregate over multiple probes; the objective function aggregates
    the individually weighted constraint contributions. The analogous [equilibrium
    weight of an interferometer beam](name:equilibrium_weight_of_interferometer_beam)
    applies the same weighting role to a different constraint observable.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - dd_path: equilibrium/time_slice/constraints/b_field_pol_probe/weight
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-b_field_pol_probe-weight
    dd_documentation:
      leaf: Weight given to the measurement
      parent_path: equilibrium/time_slice/constraints/b_field_pol_probe
      parent: Set of poloidal field probes
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Weight factor for b field pol probe.
      kind: template
- name: faraday_angle
  kind: scalar
  status: active
  description: "Faraday rotation of a probing wave\u2019s polarization plane caused\
    \ by electron density and the magnetic-field component along its plasma path."
  documentation: "The Faraday angle is the signed rotation of a probing electromagnetic\
    \ wave\u2019s polarization plane caused by propagation through magnetized plasma.\
    \ For an equilibrium state, it is the angle predicted from the electron density\
    \ and magnetic field encountered along the beam path.\n\nIn the cold, weakly dispersive\
    \ magnetoionic approximation, the plasma-induced rotation is defined by\n\n$$\n\
    \\theta_F = \\frac{e^3\\lambda^2}{8\\pi^2\\epsilon_0 m_e^2 c^3} \\int_{\\mathcal{L}}\
    \ n_e(\\ell) B_{\\parallel}(\\ell)\\,d\\ell\n$$\n\nwhere $\\theta_F$ is the Faraday\
    \ rotation angle, $e$ is the elementary-charge magnitude, $\\lambda$ is the probing-wave\
    \ vacuum wavelength, $\\pi$ is the circle constant, $\\epsilon_0$ is the vacuum\
    \ permittivity, $m_e$ is the electron mass, $c$ is the speed of light, $\\mathcal{L}$\
    \ is the segment of the beam path crossing the plasma, $\\ell$ is distance along\
    \ that path, $n_e(\\ell)$ is the local electron number density, and $B_{\\parallel}(\\\
    ell)$ is the signed magnetic-field component along the beam direction.\n\nThe\
    \ quantity applies to the electron contribution accumulated along one probing\
    \ beam through the plasma. Its aggregation is a line integral along that path,\
    \ not a local rotation rate, flux-surface average, or sum over multiple beams;\
    \ optical rotation produced outside the plasma is excluded. The equilibrium-derived\
    \ value is the rotation predicted by the reconstructed plasma state and is distinct\
    \ from a directly observed angle or from a residual between prediction and observation.\n\
    \nFaraday angle describes rotation of the polarization plane, whereas [polarization\
    \ ellipticity of a polarimeter beam](name:polarization_ellipticity_of_polarimeter_beam)\
    \ describes the signed shape of the polarization ellipse through its axis ratio;\
    \ the two quantities are not interchangeable.\n\nSign convention: Positive when\
    \ the polarization plane rotates according to the right-hand rule about the beam\
    \ propagation direction from its incident reference orientation."
  unit: rad
  physics_domain: equilibrium
  links:
  - name:polarization_ellipticity_of_polarimeter_beam
  sources:
  - dd_path: equilibrium/time_slice/constraints/faraday_angle/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-faraday_angle-measured
    dd_documentation:
