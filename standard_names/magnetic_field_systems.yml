- name: volume_of_ferritic_element
  kind: scalar
  status: active
  description: Geometric volume enclosed by the boundaries of a ferritic in-vessel
    element, representing its complete material extent rather than a cross-sectional
    dimension.
  documentation: "The volume of a ferritic in-vessel element is the non-negative geometric\
    \ measure of the material region bounded by the element\u2019s physical boundary.\
    \ It represents the element as a whole, rather than a single cross-sectional dimension\
    \ such as its [ferritic-element width](name:width_of_ferritic_element).\n\nThe\
    \ volume is defined by\n\n$$\nV = \\int_{\\Omega} d^3x\n$$\n\nwhere $V$ is the\
    \ element volume, $\\Omega$ is the region occupied by the ferritic element, and\
    \ $d^3x$ is the differential volume element. The quantity excludes surrounding\
    \ plasma, vacuum, and unrelated neighboring structures."
