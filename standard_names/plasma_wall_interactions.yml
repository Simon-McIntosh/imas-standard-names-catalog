- name: ratio_of_volume_averaged_beryllium_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless beryllium abundance formed by dividing the volume-averaged
    beryllium density by the volume-averaged electron density.
  documentation: 'Dimensionless beryllium abundance formed by dividing the volume-averaged
    beryllium density by the volume-averaged electron density. It represents the abundance
    of ionized beryllium relative to free electrons in the confined plasma volume.


    The abundance is defined by the ratio of the two volume averages:


    $$

    a_{\mathrm{Be}} =

    \frac{\langle n_{\mathrm{Be}} \rangle_V}{\langle n_e \rangle_V}

    =

    \frac{\left\langle \sum_{q=1}^{4} n_{\mathrm{Be}^{q+}} \right\rangle_V}{\langle
    n_e \rangle_V}

    $$


    where $a_{\mathrm{Be}}$ is the beryllium abundance ratio, $\langle \cdot \rangle_V$
    denotes averaging over the confined plasma volume, $n_{\mathrm{Be}}$ is the charge-state-summed
    beryllium ion number density, $n_{\mathrm{Be}^{q+}}$ is the number density of
    beryllium ions in charge state $q$, and $n_e$ is the [electron density](name:electron_density).


    The numerator is the [volume-averaged beryllium density](name:volume_averaged_beryllium_density),
    summed over all ionized beryllium charge states and excluding neutral beryllium
    atoms. The denominator is the [volume-averaged electron density](name:volume_averaged_electron_density)
    over the same confined plasma volume.


    This quantity is a ratio of two global volume averages, not a pointwise impurity
    fraction and not the volume average of $n_{\mathrm{Be}}/n_e$. It is not charge-weighted;
    a charge-weighted beryllium contribution to quasineutrality would use terms proportional
    to $q n_{\mathrm{Be}^{q+}}$ rather than the unweighted ion sum. The local pre-averaged
    counterpart of the numerator is [beryllium density](name:beryllium_density).'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:volume_averaged_electron_density
  - name:ratio_of_ion_density_to_electron_density
  sources:
  - dd_path: summary/composition/beryllium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-composition-beryllium-value
    dd_documentation:
