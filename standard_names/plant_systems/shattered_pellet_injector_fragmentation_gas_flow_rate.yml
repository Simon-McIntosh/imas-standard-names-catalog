name: shattered_pellet_injector_fragmentation_gas_flow_rate
status: draft
cocos_transformation_type: one_like
description: Particle flow rate of the fragmentation gas at the exit of a shattered
  pellet injector, quantifying the gas throughput that shatters the pellet.
documentation: "The fragmentation gas flow rate $\\dot{N}_{\\mathrm{frag}}$ (in s$^{-1}$)\
  \ gives the number of gas particles per second exiting the injector nozzle to shatter\
  \ the cryogenic pellet in a shattered pellet injection (SPI) system. Higher flow\
  \ rates produce more violent shattering, yielding smaller fragment sizes and broader\
  \ velocity distributions, which in turn affect the material deposition profile during\
  \ disruption mitigation. Typical values are $10^{21}$\u2013$10^{23}$ s$^{-1}$ depending\
  \ on the reservoir pressure (5\u2013100 bar) and nozzle geometry. The flow rate\
  \ is usually derived from upstream pressure and temperature measurements via calibrated\
  \ orifice relations or directly measured by fast-response mass-flow sensors. See\
  \ also `shattered_pellet_injector_fragmentation_gas_temperature` for the gas thermodynamic\
  \ state and `shattered_pellet_injector_propellant_gas_flow_rate` for the propellant\
  \ gas counterpart."
