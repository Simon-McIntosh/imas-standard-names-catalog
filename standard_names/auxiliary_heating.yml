- name: toroidal_angle_of_electron_cyclotron_beam
  kind: scalar
  status: active
  description: "Signed toroidal steering angle of an electron-cyclotron beam, obtained\
    \ from the toroidal wave-vector direction cosine in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The toroidal steering angle specifies the signed component of an
    electron-cyclotron beam''s propagation direction along the geometric toroidal
    direction. It describes beam orientation, not the toroidal position of the launcher.


    The angle is defined from the toroidal wave-vector component as


    $$

    \alpha_\phi = \arcsin\left(\frac{k_\phi}{|\mathbf{k}|}\right)

    $$


    where $\mathbf{k}$ is the wave vector, $k_\phi = \mathbf{k} \cdot \hat{\phi}$
    is its component along the toroidal unit vector, and $|\mathbf{k}|$ is its magnitude.
    The normalized ratio is the toroidal direction cosine represented by [toroidal_normalized_wave_vector_of_beam_tracing_beam](name:toroidal_normalized_wave_vector_of_beam_tracing_beam);
    the corresponding poloidal steering quantity is [poloidal_angle_of_electron_cyclotron_beam](name:poloidal_angle_of_electron_cyclotron_beam).


    Sign convention: Positive when the beam wave vector has a component in the direction
    of increasing toroidal angle $\phi$.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
  - name:poloidal_angle_of_electron_cyclotron_beam
