    barrier.
  documentation: 'The toroidal nitrogen velocity at the pedestal top is the density-weighted
    mean flow of ionized nitrogen ions over all nitrogen charge states at the core-side
    shoulder of the H-mode edge transport barrier. It describes flow rather than abundance,
    which is represented by [nitrogen density at the pedestal top](name:nitrogen_density_at_pedestal_top).


    For nitrogen charge states $q=1,\ldots,7$, the species velocity is defined by


    $$

    v_{\phi,N} = \frac{\sum_{q=1}^{7} n_q v_{\phi,q}}{\sum_{q=1}^{7} n_q}

    $$


    where $n_q$ is the number density of charge state $q$ in m$^{-3}$ and $v_{\phi,q}$
    is its toroidal velocity in m s$^{-1}$, measured in the right-handed cylindrical
    $(R,\phi,Z)$ frame. Neutral nitrogen is excluded. The pedestal-top value is distinguished
    from the corresponding [toroidal nitrogen velocity at the magnetic axis](name:toroidal_nitrogen_velocity_at_magnetic_axis)
    by its edge-barrier location.


    Sign convention: Positive when the density-weighted velocity points in the direction
    of increasing toroidal angle $\phi$.'
