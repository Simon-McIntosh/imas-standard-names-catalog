      kind: llm
- name: ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Volume-averaged krypton density divided by volume-averaged electron
    density is the plasma-volume krypton abundance ratio relative to electrons, with
    krypton number density summed over all charge states.
  documentation: 'Volume-averaged krypton density divided by volume-averaged electron
    density is the plasma-volume krypton abundance ratio formed from the same averaging
    volume for krypton and electrons. The krypton density is the species-level krypton
    number density summed over all charge states, including neutral through fully
    stripped krypton.


    The ratio is defined by the quotient of the two volume averages:


    $$

    f_{\mathrm{Kr},V} = \frac{\langle n_{\mathrm{Kr}} \rangle_V}{\langle n_e \rangle_V}
    = \frac{V_p^{-1}\int_{V_p}\sum_{q=0}^{Z_{\mathrm{Kr}}} n_{\mathrm{Kr},q}(\mathbf{x})\,dV}{V_p^{-1}\int_{V_p}
    n_e(\mathbf{x})\,dV}

    $$


    where $f_{\mathrm{Kr},V}$ is this krypton abundance ratio, $\langle n_{\mathrm{Kr}}
    \rangle_V$ is the [volume-averaged krypton density](name:volume_averaged_krypton_density),
    $\langle n_e \rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $V_p$ is the averaging plasma volume, $n_{\mathrm{Kr},q}$ is the krypton number
    density in charge state $q$, $q=0$ denotes neutral krypton, $q=Z_{\mathrm{Kr}}$
    denotes fully stripped krypton, $Z_{\mathrm{Kr}}$ is the nuclear charge of krypton,
    $n_e$ is the electron number density, $\mathbf{x}$ is spatial position, and $dV$
    is an infinitesimal volume element.


    This quantity applies to the krypton and electron populations inside the same
    plasma volume $V_p$. Its aggregation convention is volumetric averaging for both
    numerator and denominator; because krypton density is an extensive per-volume
    species amount, the species-level krypton density is charge-state-summed before
    the volume average is taken.


    It is not normalized by the maximum local electron density and is not a krypton-to-electron
    density ratio at a single position. It is also distinct from [line-averaged krypton
    density](name:line_averaged_krypton_density), which averages krypton density along
    a path rather than over the plasma volume.


    The numerator is exactly [volume-averaged krypton density](name:volume_averaged_krypton_density),
    and the denominator is exactly [volume-averaged electron density](name:volume_averaged_electron_density).
    Replacing the denominator by a maximum electron density gives the related but
    different [ratio of volume-averaged krypton density to maximum electron density](name:ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_electron_density
  sources:
  - dd_path: summary/composition/krypton/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-composition-krypton-value
    dd_documentation:
      leaf: Value
      parent_path: summary/composition/krypton
      parent: Krypton (Kr)
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: active
    enhanced_context:
      description: Krypton (Kr).
      kind: template
- name: ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless elemental abundance ratio of charge-state-summed neon
    nuclei to free electrons, formed from their respective mean number densities inside
    the last closed flux surface.
  documentation: 'This quantity is the abundance of neon nuclei relative to free electrons,
    with both species represented by number densities averaged over the plasma volume
    enclosed by the last closed flux surface. Neon is summed over all charge states,
    so the quantity is an elemental composition ratio rather than a charge-state-specific
    abundance or a local density ratio.


    The ratio of volume-averaged densities is defined by


    $$

    \frac{\overline{n}_{\mathrm{Ne}}}{\overline{n}_e} = \frac{\displaystyle \frac{1}{V_p}\int_{V_p}
    n_{\mathrm{Ne}}(\mathbf{x})\,dV}{\displaystyle \frac{1}{V_p}\int_{V_p} n_e(\mathbf{x})\,dV}

    $$


    where $\overline{n}_{\mathrm{Ne}}$ is the [volume-averaged neon density](name:volume_averaged_neon_density),
    $\overline{n}_e$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_{\mathrm{Ne}}(\mathbf{x})$ is the local neon nuclear number density summed
    over charge states, $n_e(\mathbf{x})$ is the local free-electron number density,
    $V_p$ is the plasma volume enclosed by the last closed flux surface, $\mathbf{x}$
    is position, and $dV$ is the volume element.


    Both operands use the same plasma volume and the same volume-averaging convention.
    This quantity is the ratio of the two global means, not the volume average of
    the local ratio $n_{\mathrm{Ne}}(\mathbf{x})/n_e(\mathbf{x})$; its denominator
    is specifically the parent [volume-averaged electron density](name:volume_averaged_electron_density),
    while its numerator is the corresponding [volume-averaged neon density](name:volume_averaged_neon_density).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_electron_density
  sources:
