name: total_thermal_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Sum of the thermal (Maxwellian) ion number densities across all ion species
  and charge states present in the plasma.
documentation: "The total thermal ion number density $n_{i,\\mathrm{th,tot}} = \\\
  sum_s \\sum_Z n_{i,s,Z,\\mathrm{th}}$ aggregates the Maxwellian components of every\
  \ ion species $s$ in every charge state $Z$. It excludes suprathermal (fast) ion\
  \ populations produced by NBI, ICRH, or fusion reactions. Quasi-neutrality relates\
  \ this quantity to the electron density: $n_e \\approx \\sum_s Z_{\\mathrm{eff},s}\\\
  , n_{i,s,\\mathrm{th}} + \\sum_s Z_s\\, n_{i,s,\\mathrm{fast}}$, so $n_{i,\\mathrm{th,tot}}$\
  \ is central to impurity-dilution and fuel-fraction analyses. Typical core values\
  \ in deuterium H-mode plasmas are $3 \\times 10^{19}$\u2013$10^{20}\\;\\mathrm{m^{-3}}$.\
  \ Inferred from charge-exchange recombination spectroscopy, interferometry (providing\
  \ $n_e$), and $Z_{\\mathrm{eff}}$ measurements. See also `thermal_ion_number_density`\
  \ for the per-species quantity, `ion_number_density` (thermal + fast), and `electron_density`."
