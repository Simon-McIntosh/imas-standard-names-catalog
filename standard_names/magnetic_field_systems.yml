- name: radial_outline_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Absolute, non-negative major-radius coordinate R of an outline point,
    including an arc start point, on the cross-sectional contour of a coil conductor
    element in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The radial outline of a coil conductor element is the major-radius
    component $R$ of a point on the element''s cross-sectional contour at fixed toroidal
    angle $\phi$. It is an absolute, non-negative distance from the toroidal symmetry
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame, not a signed local
    offset from a conductor reference point.


    The major radius is related to horizontal Cartesian coordinates by:


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are horizontal distances in meters in a right-handed Cartesian
    $(x, y, z)$ frame with origin on the toroidal symmetry axis and $z$ parallel to
    the vertical $Z$ direction; $R$ is in meters. The accompanying vertical outline
    coordinate $Z$ is the vertical height in meters in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In practice, outline coordinates are obtained from engineering geometry, CAD models,
    or surveyed conductor contours and then expressed in the right-handed cylindrical
    $(R, \phi, Z)$ frame. For a contour represented using circular arcs, an $R$ value
    locates an outline construction point such as an arc start point; the corresponding
    $Z$ value gives its vertical position, while separate arc parameters determine
    the curved segment between construction points.


    This quantity is closely related to [major_radius_of_coil_conductor_element](name:major_radius_of_coil_conductor_element),
    which describes a characteristic major-radius coordinate of the same type of conductor
    element. It is also analogous to [radial_outline_of_poloidal_field_coil](name:radial_outline_of_poloidal_field_coil)
    and uses the same major-radius geometry as [major_radius_of_toroidal_field_coil](name:major_radius_of_toroidal_field_coil).


    Typical values are device-specific non-negative lengths measured in meters and
    lie at the major radii occupied by the conductor outline. Within a single conductor
    cross-section, variations among outline points are usually set by the conductor''s
    radial width rather than by the full device size, so no universal numerical range
    is implied by the quantity.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_outline_of_poloidal_field_coil
  - name:major_radius_of_coil_conductor_element
  sources:
  - id: dd:pf_passive/loop/element/geometry/arcs_of_circle/r
    dd_path: pf_passive/loop/element/geometry/arcs_of_circle/r
    status: composed
- name: radial_outline_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Major-radius coordinate of a point on the poloidal cross-sectional
    outline of a poloidal-field coil conductor in the right-handed cylindrical (R,
    phi, Z) frame. It is the absolute non-negative distance from the toroidal symmetry
    axis to that outline point.
  documentation: 'Radial outline of a poloidal-field coil is the major-radius coordinate
    $R$ of a point on the conductor boundary in a poloidal cross-section. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is the non-negative distance from the toroidal
    symmetry axis and $Z$ is vertical height; for an axisymmetric coil, the same poloidal
    outline is swept around the toroidal direction $\phi$. Together with the [vertical
    outline of a poloidal-field coil], it locates the boundary point; a circular contour
    segment may also require a separate [curvature radius].


    This quantity is determined from the physical conductor envelope in an $(R, Z)$
    poloidal section and is used to define the coil boundary for geometric field,
    force, and inductance calculations. It is a boundary coordinate, not the curvature
    radius of an outline segment and not a central or reference radius of the whole
    coil.


    Typical values range from about 0.5-3 m for compact or inboard poloidal-field
    coils to 3-12 m for large outboard coils, depending on device size and coil placement.
    Valid values are non-negative because $R$ is an absolute distance from the toroidal
    symmetry axis.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:pf_active/coil/geometry/arcs_of_circle/r
    dd_path: pf_active/coil/geometry/arcs_of_circle/r
    status: composed
- name: radial_total_maximum_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Upper allowable bound on a signed linear combination of radial electromagnetic
    forces across an axisymmetric poloidal field coil system. It is used as a mechanical
    integrity constraint for coil-current scenarios and machine protection.
  documentation: 'Radial total maximum force of a poloidal field coil system is the
    upper allowable bound on a signed linear combination of the radial electromagnetic
    forces acting on the coils. The radial direction is the major-radius direction
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame, and the bound represents
    a mechanical integrity constraint for the coil support structure.


    The constraint is commonly expressed as a weighted-force inequality:


    $$

    F_{R,\mathrm{comb}} = \sum_i w_i F_{R,i} \le F_{R,\mathrm{max}}

    $$


    where $F_{R,\mathrm{comb}}$ is the signed combined radial force in N, $w_i$ is
    a dimensionless linear-combination weight, $F_{R,i}$ is the individual radial
    force on coil $i$ in N, and $F_{R,\mathrm{max}}$ is the maximum allowable bound
    in N. Each $F_{R,i}$ is obtained by integrating the Lorentz force density $\mathbf{J}_i
    \times \mathbf{B}$ over the coil conductor and projecting onto $R$, where $\mathbf{J}_i$
    is current density in A m^-2 and $\mathbf{B}$ is magnetic flux density in T.


    This limit is evaluated from electromagnetic load calculations using the coil
    currents, conductor geometry, and magnetic field from the full coil and plasma
    configuration. The resulting force combination is compared with structural margins
    from support design, stress analysis, preload assumptions, and protection requirements.


    Typical allowable magnitudes are highly machine-dependent: small devices may have
    limits of order 10^5-10^6 N, medium and large tokamaks often use 10^6-10^8 N,
    and reactor-scale coil systems can exceed 10^8 N. The appropriate value depends
    on coil size, support stiffness, load sharing, disruption assumptions, and the
    chosen linear-combination weights.


    Sign convention: Positive when the defining weighted sum is positive under the
    specified linear-combination weights, taking each individual radial force as positive
    toward increasing $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:radial_minimum_force_of_poloidal_field_coil
  - name:maximum_force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/radial_force/limit_max
    dd_path: pf_active/radial_force/limit_max
    status: composed
- name: radius_of_ferritic_element
  kind: scalar
  status: draft
  description: Cylindrical radial coordinate R of the geometric point used to locate
    a ferritic element in the right-handed cylindrical (R, phi, Z) frame, measured
    as distance from the toroidal symmetry axis. It is a generic radial position,
    not an inner or outer boundary of an annular cross-section.
  documentation: 'Radius of a ferritic element is the cylindrical radial coordinate
    $R$ of the geometric point used to locate that element in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is distance from the toroidal symmetry axis, $\phi$
    is the toroidal angle, and $Z$ is the vertical height. It specifies a position
    in the poloidal plane and is not the element''s annular thickness; for the radial
    bounds of an annular cross-section use [inner_radius_of_ferritic_element](name:inner_radius_of_ferritic_element)
    and [outer_radius_of_ferritic_element](name:outer_radius_of_ferritic_element),
    and when the point is specifically an outline vertex use [major_radius_of_ferritic_element](name:major_radius_of_ferritic_element).


    For the same point expressed in the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ basis with $\hat{z}$ vertical, the cylindrical radius is


    $$

    R_f = \sqrt{x_f^2 + y_f^2}

    $$


    where $x_f$ and $y_f$ are the horizontal Cartesian coordinates of the ferritic-element
    point in meters and $R_f$ is its radial distance from the toroidal symmetry axis
    in meters.


    In practice this coordinate is taken from the geometric description of the ferritic
    component, such as engineering design geometry, magnetic-model geometry, or survey-derived
    component positions.


    Typical values are machine-size dependent, generally falling in the 0.2-15 m range
    across tokamak magnetic-field systems, within the radial envelope occupied by
    the ferritic structures.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_ferritic_element
  - name:vertical_coordinate_of_ferritic_element
- name: inner_radius_of_ferritic_element
  kind: scalar
  status: draft
  description: Inner radial boundary of the annular cross-section of a ferritic element
    in the axisymmetric equivalent geometry, defining the bore of the annulus centered
    at a reference point in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The inner radius specifies the hollow bore of the annular cross-section
    used to represent a ferritic element in the axisymmetric thick-line equivalent
    geometry. Ferritic elements are ferromagnetic inserts employed in some fusion
    devices to reduce toroidal magnetic-field ripple; each element is modeled as an
    axisymmetric body whose cross-section is an annulus centered at a reference point
    $(R_0, Z_0)$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    the major radius from the toroidal symmetry axis and $Z$ is the vertical height.


    For an annular cross-section with inner radius $r_\mathrm{in}$ and outer radius
    $r_\mathrm{out}$, the enclosed area is


    $$

    A = \pi\bigl(r_\mathrm{out}^2 - r_\mathrm{in}^2\bigr)

    $$


    with the geometric constraint $0 \leq r_\mathrm{in} < r_\mathrm{out}$. The inner
    radius is a design parameter supplied directly to the geometry model and is not
    inferred from in-situ measurements. Together with [outer_radius_of_ferritic_element](name:outer_radius_of_ferritic_element),
    it fully characterizes the radial extent of the annular cross-section, while the
    overall radial placement of the element is given by [radius_of_ferritic_element](name:radius_of_ferritic_element).
    The analogous quantity for iron core segments is [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment).


    Sign convention: Positive as a non-negative radial distance from the annulus center
    to the inner surface in the right-handed cylindrical $(R, \phi, Z)$ frame where
    $R \geq 0$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_ferritic_element
  - name:radius_of_ferritic_element
  - name:inner_radius_of_iron_core_segment
  arguments:
  - name: radius_of_ferritic_element
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:ferritic/object/axisymmetric/annulus/radius_inner
    dd_path: ferritic/object/axisymmetric/annulus/radius_inner
    status: attached
- name: outer_radius_of_ferritic_element
  kind: scalar
  status: draft
  description: Outer major-radius boundary of an annular representation of a ferritic
    element in an axisymmetric equivalent geometry. It is the maximum R extent of
    the ferritic annulus in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The outer radius of a ferritic element is the largest major-radius
    coordinate occupied by the annular cross-section used to represent magnetically
    permeable material in an axisymmetric equivalent geometry. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ is distance from the toroidal symmetry axis
    and $Z$ is vertical height; this quantity defines the radially outward boundary
    of the annulus.


    For an annular ferritic region $\Omega_f$ represented in the poloidal $(R,Z)$
    plane, the outer radius is


    $$

    R_{\mathrm{outer}} = \max_{(R,Z)\in\Omega_f} R

    $$


    where $\Omega_f$ is the cross-section assigned to the ferritic material and $R$
    is the major-radius coordinate in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    The value is usually obtained from engineering geometry, computer-aided design
    models, or simplified axisymmetric models of ferritic inserts, cores, shields,
    or other magnetic structures. Together with the corresponding inner radius, it
    sets the radial thickness and placement of the annular magnetic material used
    in equilibrium and magnetic-field calculations.


    Typical values are device- and component-dependent: compact ferritic inserts may
    have outer radii of 0.2-2 m, while larger ferritic structures in medium to large
    tokamaks may extend to 2-10 m. The value is non-negative by geometry and must
    exceed the corresponding inner radius for a finite annular thickness.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_ferritic_element
  - name:inner_radius_of_ferritic_element
  - name:outer_radius_of_iron_core_segment
  arguments:
  - name: radius_of_ferritic_element
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:ferritic/object/axisymmetric/annulus/radius_outer
    dd_path: ferritic/object/axisymmetric/annulus/radius_outer
    status: composed
- name: radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Non-negative curvature radius of an arc-of-circle segment representing
    the boundary of an iron-core segment in a poloidal cross-section of the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'Radius of an iron-core segment is the non-negative curvature radius
    of a circular-arc element used to describe the segment boundary in a poloidal
    cross-section. The cross-section is the $(R, Z)$ plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. The
    radius specifies the size of the local circular arc, not its position, endpoint,
    sweep angle, or traversal orientation.


    For a circular arc, the radius $r$ is the reciprocal of the magnitude of the local
    curvature $\kappa$:


    $$

    r = \frac{1}{|\kappa|}

    $$


    where $r$ is the curvature radius in m and $\kappa$ is the signed planar curvature
    in m$^{-1}$. The absolute value makes the radius non-negative; the limiting case
    $|\kappa| \to 0$ corresponds to an uncurved boundary element with $r \to \infty$.


    In practice, this quantity is obtained from the geometric description of the iron-core
    cross-section, for example from engineering drawings, computer-aided design boundaries,
    or a fitted piecewise-circular representation of the contour. A complete arc also
    requires geometric information beyond the radius, such as a start point in the
    $(R, Z)$ plane and either an endpoint, a sweep angle, or an orientation convention
    that fixes which part of the circle is used.


    Typical values are set by the scale and detailed shaping of the iron-core segment
    rather than by a universal material property. They are non-negative lengths comparable
    to the local geometric feature size of the represented boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - id: dd:iron_core/segment/geometry/arcs_of_circle/curvature_radii
    dd_path: iron_core/segment/geometry/arcs_of_circle/curvature_radii
    status: attached
- name: inner_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Inner radius of an iron-core segment is the non-negative distance from
    the center or central axis of an annular cross-section to its inner ferromagnetic
    boundary. It defines the hollow bore and must be smaller than the corresponding
    outer radius.
  documentation: 'The inner radius of an iron-core segment is the radius of the inner
    boundary of an annular ferromagnetic cross-section. It identifies the boundary
    between the hollow region and the iron material, and together with [outer_radius_of_iron_core_segment](name:outer_radius_of_iron_core_segment)
    fixes the annular geometry of the segment.


    For a circular annulus, the defining distance is


    $$

    r_\mathrm{inner} = \left|\mathbf{x}_\mathrm{inner} - \mathbf{x}_0\right|

    $$


    where $\mathbf{x}_0$ is the center of the annular cross-section, $\mathbf{x}_\mathrm{inner}$
    is any point on the circular inner ferromagnetic boundary, and the resulting radius
    is measured in meters. A physically valid annulus satisfies $0 \le r_\mathrm{inner}
    < r_\mathrm{outer}$, where $r_\mathrm{outer}$ is the outer radius in meters; the
    corresponding iron cross-sectional area is $A = \pi\left(r_\mathrm{outer}^2 -
    r_\mathrm{inner}^2\right)$.


    This radius is used when constructing geometric and electromagnetic representations
    of iron-core segments. Increasing the inner radius reduces the flux-conducting
    iron area for a fixed outer radius, thereby affecting magnetic reluctance, possible
    saturation, and mass distribution. Non-annular segment cross-sections are more
    naturally described by [width_of_iron_core_segment](name:width_of_iron_core_segment)
    and [height_of_iron_core_segment](name:height_of_iron_core_segment).


    Typical values are strongly device- and design-dependent. In tokamak iron-core
    models they are usually engineering-scale lengths, from about 0.1-5 m, with compact
    or local annular segments toward the lower end and large central-core or return-yoke
    elements toward the upper end.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  arguments:
  - name: radius_of_iron_core_segment
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:iron_core/segment/geometry/annulus/radius_inner
    dd_path: iron_core/segment/geometry/annulus/radius_inner
    status: composed
- name: major_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Major radius coordinate of a point defining an iron core segment contour,
    equal to its radial distance from the toroidal symmetry axis in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'Major radius of an iron core segment is the radial coordinate $R$
    of a point used to define the segment cross-sectional contour. In the right-handed
    cylindrical $(R, \phi, Z)$ frame, $R$ measures distance from the toroidal symmetry
    axis and is paired with the vertical coordinate $Z$ to locate contour or circular-arc
    defining points in the poloidal cross-section.


    When the same point is expressed in a right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ basis with $\hat{z}$ vertical and the toroidal symmetry axis as the
    $z$ axis, the major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are horizontal Cartesian coordinates in meters, and $R$ is the
    corresponding cylindrical radial coordinate in meters. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, $\phi$ is the toroidal angle in radians and $Z$ is vertical
    height in meters.


    The value is determined from the geometric definition of the ferromagnetic core
    segment, for example from engineering drawings, survey data, or a geometry model.
    For circular-arc descriptions it gives the radial coordinate of the arc-defining
    point; for contour descriptions it gives the radial coordinate of the contour
    point itself.


    Typical values are device- and component-specific and lie within the radial extent
    of the iron core, from its innermost to outermost modeled contour points. The
    coordinate is non-negative and is reported in meters.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_iron_core_segment
  - name:major_radius_of_poloidal_field_coil
  - name:major_radius_of_ferritic_element
  arguments:
  - name: radius_of_iron_core_segment
    operator: major
    operator_kind: qualifier
  sources:
  - id: dd:iron_core/segment/geometry/arcs_of_circle/r
    dd_path: iron_core/segment/geometry/arcs_of_circle/r
    status: composed
  - id: dd:iron_core/segment/geometry/outline/r
    dd_path: iron_core/segment/geometry/outline/r
    status: composed
- name: outer_radius_of_iron_core_segment
  kind: scalar
  status: draft
  description: Non-negative radial distance from the toroidal symmetry axis to the
    outer boundary of an annular iron-core segment. Together with the inner radius,
    it fixes the radial extent of the hollow circular cross section.
  documentation: 'The outer radius of an iron-core segment is the non-negative major-radius
    distance from the toroidal symmetry axis to the outer boundary of an annular iron
    region. It is expressed in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    Together with [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment),
    it defines the radial span of the annular segment used to represent the iron transformer
    core.


    For an ideal annular segment, the outer radius is the largest major-radius coordinate
    occupied by the segment material:


    $$

    R_\mathrm{out} = \max_{\mathbf{x} \in \Omega_\mathrm{seg}} R(\mathbf{x})

    $$


    where $\Omega_\mathrm{seg}$ is the material region of the annular iron-core segment
    and $R(\mathbf{x})$ is the major-radius coordinate of point $\mathbf{x}$. The
    radial wall thickness is $R_\mathrm{out} - R_\mathrm{in}$, with $R_\mathrm{out}
    > R_\mathrm{in} \ge 0$ for a physically valid hollow annulus.


    This quantity is usually taken from engineering geometry, survey data, or a simplified
    magnetic-circuit representation of the iron core. It determines the outer radial
    reach of high-permeability material and therefore affects estimates of iron volume,
    magnetic reluctance, flux linkage, and saturation in equilibrium or magnetic-field
    modeling. For rectangular iron-core segment descriptions, related geometric extents
    are [width_of_iron_core_segment](name:width_of_iron_core_segment) and [height_of_iron_core_segment](name:height_of_iron_core_segment).


    Typical values range from about 1-5 m in small and medium tokamaks and about 5-15
    m in large devices, depending on the size and placement of the transformer yoke.
    The difference between outer and inner radii is commonly 0.1-2 m for annular iron-core
    elements.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_iron_core_segment
  - name:width_of_iron_core_segment
  - name:height_of_iron_core_segment
  arguments:
  - name: radius_of_iron_core_segment
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:iron_core/segment/geometry/annulus/radius_outer
    dd_path: iron_core/segment/geometry/annulus/radius_outer
    status: skipped
- name: radius_of_passive_loop
  kind: scalar
  status: draft
  description: Radial dimension of the annular cross-section of a passive conducting
    loop element, abstracting over the specific inner and outer conductor boundaries
    used in electromagnetic and resistive circuit modeling.
  documentation: 'A passive conducting loop element has a toroidal geometry with an
    annular cross-section; the radial extent of this annulus is characterized by its
    inner and outer boundaries. This parent quantity abstracts over both the [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop),
    the distance from the annulus center to the inner conducting surface, and the
    [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop), which defines
    the outer radial boundary of the annulus.


    The cross-sectional area used in resistance and inductance calculations follows
    from


    $$

    A = \pi \left( r_\mathrm{outer}^2 - r_\mathrm{inner}^2 \right)

    $$


    where $r_\mathrm{outer}$ and $r_\mathrm{inner}$ are the outer and inner radii
    in meters. The conductor wall thickness $\delta r = r_\mathrm{outer} - r_\mathrm{inner}$
    and the [area_of_passive_loop](name:area_of_passive_loop) both derive directly
    from these two boundary values.


    Passive loop radii are taken from engineering design specifications or as-built
    conductor surveys, and feed into electromagnetic circuit models for passive stabilization
    and eddy-current analysis. In fusion devices, passive loop cross-sectional radii
    range from a few millimeters for thin stabilizing shells to several centimeters
    for heavier current-carrying elements.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:area_of_passive_loop
- name: inner_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a passive conducting loop
    element. It is the distance from the annulus center to the inner conducting boundary
    and, with the outer radius, sets the conductor thickness used in electromagnetic
    and resistive calculations.
  documentation: 'The inner radius of a passive loop is the radius of the hole or
    excluded central region in an annular conductor cross-section. Together with the
    [outer radius](name:outer_radius_of_passive_loop), it defines the conducting material
    thickness of the loop element and affects its resistance, inductance, and eddy-current
    response.


    For an ideal annular cross-section, the conducting area is related to the inner
    and outer radii by:


    $$

    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)

    $$


    where $A$ is the conducting cross-sectional area, $r_\mathrm{inner}$ is the inner
    radius, and $r_\mathrm{outer}$ is the corresponding outer radius.


    The value is determined from the mechanical geometry of the passive conducting
    structure, such as a vacuum-vessel segment, stabilizing plate, shell, or other
    closed conducting loop. It is used in reduced electromagnetic models to compute
    the conductor area, resistance, mutual inductance, and induced eddy currents.
    The closely related [inner radius of a passive structure](name:inner_radius_of_passive_loop)
    describes the same geometric concept for passive conducting structures more generally.


    Typical values range from 0.001-0.1 m for small annular conductor features and
    from 0.01-1 m for large vessel or support-structure elements, depending on the
    device scale and the level of geometric simplification.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_passive_loop
  arguments:
  - name: radius_of_passive_loop
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_inner
    dd_path: pf_passive/loop/element/geometry/annulus/radius_inner
    status: composed
- name: outer_radius_of_passive_loop
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a passive conducting loop
    element, defining the outer radial boundary of the annulus geometry used in electromagnetic
    modeling.
  documentation: 'The outer radius defines the radial extent of the outer boundary
    of the annular (hollow circular) cross-section of a passive conducting loop element,
    such as a vacuum vessel segment or other passive toroidal conductor. Together
    with [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop), it fully
    parameterizes the annular cross-section geometry used in electromagnetic circuit
    models to compute eddy-current responses, self-inductances, and resistances.


    The cross-sectional area of the annulus is:


    $$

    A = \pi \left( r_{\rm out}^2 - r_{\rm in}^2 \right)

    $$


    where $r_{\rm out}$ is the outer radius and $r_{\rm in}$ is the correspondent
    [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop), both in m.
    This area enters directly into resistance and inductance estimates of the passive
    loop element under the thin-shell approximation.


    Geometry parameters are obtained from engineering drawings or CAD models of the
    passive conductor assembly. Typical values range from a few centimeters for small
    conducting ribs to approximately 0.5 m for large vacuum vessel sectors, depending
    on device scale. The [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    is the analogous quantity for active poloidal field coil conductors.


    Sign convention: Positive when measured as a radial distance from the geometric
    center of the annular cross-section outward to the conductor''s outer boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  arguments:
  - name: radius_of_passive_loop
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_outer
    dd_path: pf_passive/loop/element/geometry/annulus/radius_outer
    status: composed
- name: radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Non-negative curvature radius of one arc-of-circle segment used to
    approximate the cross-sectional contour of a poloidal field coil. The contour
    lies in a poloidal plane of the right-handed cylindrical (R, phi, Z) frame, where
    R is major radius and Z is vertical height.
  documentation: 'Radius of a poloidal-field-coil arc is the non-negative circle radius
    of a single circular segment of the coil cross-sectional contour, taken in a poloidal
    plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius and $Z$ is vertical height. The conductor or winding-pack boundary is approximated
    by connected circular arcs, and this quantity sets the local radius of curvature
    of one such arc.


    For a circular contour segment, the curvature radius $\rho$ (in m) is the inverse
    magnitude of the planar curvature $\kappa$ (in m$^{-1}$) of the boundary curve
    in the $(R, Z)$ cross-section:


    $$

    \rho = \frac{1}{|\kappa|}

    $$


    where a finite physical arc has $\rho > 0$, and as $\rho$ grows the segment approaches
    a straight line ($\kappa \to 0$). Each arc is anchored by a start point in the
    poloidal plane: its major-radius coordinate is given by [major_radius_of_poloidal_field_coil](name:major_radius_of_poloidal_field_coil)
    and its vertical coordinate by [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil);
    both together with $\rho$ are needed to locate and shape one arc, with the end
    of each arc coinciding with the start of the next.


    The value is determined from the designed circular-arc contour, from CAD geometry,
    or by fitting circular arcs to surveyed boundary points. Small radii represent
    tightly rounded corners and compact winding-pack features, while larger radii
    represent gently curved coil sides; the magnitude scales with coil aperture, winding-pack
    dimensions, and mechanical-clearance requirements. An analogous arc-of-circle
    convention applies to iron core segment boundaries via [radius_of_iron_core_segment](name:radius_of_iron_core_segment).'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_poloidal_field_coil
  - name:radial_outline_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/arcs_of_circle/curvature_radii
    dd_path: pf_active/coil/element/geometry/arcs_of_circle/curvature_radii
    status: composed
- name: inner_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of a poloidal field coil,
    defining the size of the conductor bore in the poloidal plane.
  documentation: 'The inner radius is the smaller of the two radial dimensions characterizing
    the annular conductor cross-section of a poloidal field coil, measured from the
    center of the annulus to its inner conducting boundary in a poloidal plane of
    the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius
    and $Z$ is the vertical height.


    Together with [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    and the annulus center position, the inner radius completely specifies the annular
    cross-section geometry required for electromagnetic calculations including inductance
    and field-map computations. The annular cross-sectional area relates to both radii
    via:


    $$

    A = \pi \left( r_\mathrm{out}^2 - r_\mathrm{in}^2 \right)

    $$


    where $r_\mathrm{in}$ is the inner radius and $r_\mathrm{out}$ is the outer radius;
    this area corresponds to [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil).
    The physical constraint $0 \le r_\mathrm{in} < r_\mathrm{out}$ must hold; when
    $r_\mathrm{in} = 0$ the annular cross-section degenerates to a solid disk.


    The inner radius is taken directly from engineering design specifications and
    serves as a geometric input to electromagnetic and structural modeling of PF coil
    systems. The analogous quantity for non-axisymmetric correction coils is [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil).


    Sign convention: Positive when the inner conductor boundary is displaced radially
    outward from the annulus center, as measured in the poloidal cross-section of
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:outer_radius_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:inner_radius_of_correction_coil
  arguments:
  - name: radius_of_poloidal_field_coil
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:pf_active/coil/element/geometry/annulus/radius_inner
    dd_path: pf_active/coil/element/geometry/annulus/radius_inner
    status: composed
  - id: dd:pf_active/coil/geometry/annulus/radius_inner
    dd_path: pf_active/coil/geometry/annulus/radius_inner
    status: attached
- name: major_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Major radius coordinate of an arc-of-circle defining point for a poloidal
    field coil conductor, equal to the radial distance in meters from the toroidal
    symmetry axis in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Major radius for a poloidal field coil is the $R$ coordinate of
    a point on the conductor contour in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is distance from the toroidal symmetry axis, $\phi$ is toroidal
    angle, and $Z$ is vertical height. For an arc-of-circle contour, this quantity
    locates each arc-defining point radially and complements the associated [vertical
    coordinate of the poloidal field coil].


    The relation to horizontal Cartesian coordinates of the same point is:


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$, $x$, $y$, and the associated $Z$ coordinate are all lengths in meters.
    The coordinates $x$ and $y$ are measured in a right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$
    frame with $x=y=0$ on the toroidal symmetry axis and $\hat{z}$ parallel to the
    vertical $+\hat{Z}$ direction.


    The value is determined from engineering geometry, CAD models, or mechanical survey
    of the coil conductor. In an arc-of-circle representation, the radial coordinate
    of each defining point and its associated vertical coordinate determine the arc
    segments that form the conductor cross-section; it is a geometric quantity rather
    than a magnetic field or current.


    Typical values are device-scale non-negative distances in meters. Central-solenoid
    conductors generally have smaller $R$ than outboard poloidal-field coils, but
    the admissible range is machine-specific and no universal numerical interval is
    implied by the quantity definition.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  arguments:
  - name: radius_of_poloidal_field_coil
    operator: major
    operator_kind: qualifier
  sources:
  - id: dd:pf_active/coil/element/geometry/arcs_of_circle/r
    dd_path: pf_active/coil/element/geometry/arcs_of_circle/r
    status: composed
- name: outer_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Outer radius of the annular cross-section of a poloidal field coil
    conductor element, defining the radial outer boundary of the conductor geometry.
  documentation: 'The outer radius defines the outward radial extent of the annular
    cross-section used to model a poloidal field coil conductor element. Together
    with the [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil)
    and the coil center position in the poloidal $(R, Z)$ plane, it fully specifies
    the annular geometry required for electromagnetic calculations such as mutual
    inductance and Biot-Savart field evaluation.


    The annular cross-sectional area $A$ is:


    $$

    A = \pi \left( r_\mathrm{out}^2 - r_\mathrm{in}^2 \right)

    $$


    where $r_\mathrm{out}$ is the outer radius and $r_\mathrm{in}$ is the [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil).
    This [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil) enters directly
    into current density and inductance calculations.


    For PF coil conductors in medium-to-large fusion devices, outer radii range from
    a few centimeters to approximately 0.3-0.5 m, depending on the conductor bundle
    size and design current.


    Sign convention: Positive when the outer boundary lies at a greater radial distance
    from the annulus center than the inner boundary, as required for a physically
    valid annular cross-section.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  arguments:
  - name: radius_of_poloidal_field_coil
    operator: outer
    operator_kind: qualifier
  sources:
