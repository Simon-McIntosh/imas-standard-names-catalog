- name: safety_factor_at_plasma_boundary
  kind: scalar
  status: draft
  description: Safety factor at the outboard midplane intersection with the separatrix,
    a standard MHD stability parameter for the plasma boundary.
  documentation: "The safety factor $q$ at the plasma boundary describes the helicity\
    \ of magnetic field lines on the last closed flux surface, defined as $q = \\\
    partial \\Phi_{\\rm tor} / \\partial \\Phi_{\\rm pol}$ where $\\Phi_{\\rm tor}$\
    \ and $\\Phi_{\\rm pol}$ are the toroidal and poloidal magnetic fluxes, respectively.\
    \ This quantity is a critical indicator of edge stability; low edge $q$ values\
    \ (approaching 2) can trigger peeling-ballooning modes and edge-localized modes\
    \ (ELMs) that govern pedestal confinement and divertor heat loads. Typical values\
    \ at the separatrix are in the range $q_{95} = 3$\u2013$5$ for H-mode tokamaks,\
    \ with the exact value depending on the plasma current, toroidal field, and shaping.\
    \ It is routinely computed from equilibrium reconstruction (e.g., EFIT, LIUQE)\
    \ using external magnetic measurements and internal profile constraints.\n\nSign\
    \ convention: Positive when the magnetic field lines are left-handed with respect\
    \ to the plasma current direction, which is standard for tokamaks in the IMAS\
    \ $(R,\\phi,Z)$ frame.\n\nRelated quantities: [safety_factor](name:safety_factor)\
    \ evaluated at 95% flux surface, [minimum_safety_factor](name:minimum_safety_factor)\
    \ as an MHD stability indicator, and [safety_factor_at_internal_transport_barrier](name:safety_factor_at_internal_transport_barrier)\
    \ for transport barrier studies."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:safety_factor
  - name:minimum_safety_factor
  - name:safety_factor_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/separatrix/q/value
    dd_path: summary/local/separatrix/q/value
    status: composed
- name: thermal_electron_pressure_at_pedestal
  kind: scalar
  status: draft
  description: Thermal (Maxwellian) component of the electron pressure at the pedestal
    height location, obtained from edge profile fitting and characterizing the steep-gradient
    region of the H-mode pedestal.
  documentation: 'The thermal electron pressure at the pedestal height is defined
    as $p_{e\,\text{therm}} = n_e k_B T_e$, where $n_e$ and $T_e$ are the local electron
    density and temperature of the Maxwellian population, and $k_B$ is the Boltzmann
    constant. This quantity isolates the thermal component from any non-thermal contributions
    (e.g., fast electrons), providing the pressure that contributes to the total pressure
    gradient used in MHD stability analyzes of the pedestal. The pedestal height,
    typically identified at the radial location of the maximum pressure gradient,
    determines the local H-mode pedestal performance and the stored energy; typical
    values range from 0.1 to 50 kPa in present tokamaks depending on confinement regime
    and heating power. It is routinely inferred from Thomson scattering or other edge
    diagnostics combined with equilibrium reconstruction. The thermal electron pressure
    at the pedestal relates directly to the pedestal width via [electron_pedestal_width](name:electron_pedestal_width)
    and to the peak gradient via [gradient_of_electron_pressure_at_pedestal](name:gradient_of_electron_pressure_at_pedestal).


    Sign convention: Positive when the Maxwellian electron pressure produces an outward
    force, consistent with the usual definition of kinetic pressure.


    See also the total electron pressure at the pedestal [electron_pressure](name:electron_pressure)
    and the corresponding density [electron_density_at_pedestal](name:electron_density_at_pedestal).'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pedestal_width
  - name:gradient_of_electron_pressure_at_pedestal
  - name:electron_pressure
  - name:electron_density_at_pedestal
  sources:
  - id: dd:summary/pedestal_fits/linear/pressure_electron/pedestal_height/value
    dd_path: summary/pedestal_fits/linear/pressure_electron/pedestal_height/value
    status: composed
- name: thermal_ion_pedestal_energy
  kind: scalar
  status: draft
  description: Ion contribution to the pedestal stored thermal energy, derived from
    an mtanh fit of the ion temperature and density profiles.
  documentation: The thermal stored energy of the ion pedestal, $W_{\text{th},i}^{\text{ped}}$,
    represents the ion contribution to the total pedestal thermal energy and is calculated
    as the volume integral of the thermal ion pressure over the pedestal region. It
    is derived from an mtanh (modified hyperbolic tangent) fit to the ion temperature
    and density profiles in the edge plasma, which parameterizes the pedestal height,
    width, and position. This quantity, together with [thermal_electron_pedestal_energy](name:thermal_electron_pedestal_energy),
    determines the total pedestal stored energy, a key parameter for edge-localized
    mode (ELM) stability and pedestal structure analysis. Typical values for the ion
    pedestal energy in H-mode tokamak plasmas range from 0.1 to 1 MJ, depending on
    machine size, heating power, and plasma conditions. The pedestal energy is inferred
    from profile diagnostics (e.g., Thomson scattering, charge exchange recombination
    spectroscopy) and equilibrium reconstruction, and is routinely used in pedestal
    databases and ELM prediction models.
  unit: J
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_electron_pedestal_energy
  sources:
  - id: dd:summary/pedestal_fits/linear/energy_thermal_pedestal_ion/value
    dd_path: summary/pedestal_fits/linear/energy_thermal_pedestal_ion/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/energy_thermal_pedestal_ion/value
    dd_path: summary/pedestal_fits/mtanh/energy_thermal_pedestal_ion/value
    status: composed
- name: toroidal_conductivity
  kind: scalar
  status: draft
  description: The component of the electrical conductivity tensor corresponding to
    current driven along the toroidal direction.
  documentation: The toroidal component $\sigma_{\phi\phi}$ of the conductivity tensor
    quantifies the plasma's ability to conduct electric current in the geometric toroidal
    direction $\hat{\phi}$ of the cylindrical $(R, \phi, Z)$ frame. This component
    is distinct from [parallel_conductivity](name:parallel_conductivity) which acts
    along the magnetic field line, and is relevant for modeling current redistribution
    and resistive dissipation in axisymmetric configurations. It is typically evaluated
    from neoclassical transport coefficients or derived self-consistently in edge/SOL
    simulations on unstructured generalized grids, complementing [radial_conductivity](name:radial_conductivity)
    and [poloidal_conductivity](name:poloidal_conductivity). Typical values in the
    edge plasma range from $10^3$ to $10^6\;\Omega^{-1}\mathrm{m}^{-1}$, decreasing
    with lower electron temperature and increasing collisionality.
  unit: m^-1.ohm^-1
  physics_domain: edge_plasma_physics
