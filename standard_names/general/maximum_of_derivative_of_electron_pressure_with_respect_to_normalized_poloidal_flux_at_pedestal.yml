name: maximum_of_derivative_of_electron_pressure_with_respect_to_normalized_poloidal_flux_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Peak magnitude of the electron pressure gradient $|dp_e/d\psi_N|$ in
  the pedestal region, quantifying the steepest part of the H-mode edge barrier.
documentation: "This scalar records the maximum absolute value of $dp_e/d\\psi_N$\
  \ across the pedestal, where $p_e$ is the electron pressure and $\\psi_N$ the normalized\
  \ poloidal flux. It is a key parameter in peeling\u2013ballooning stability analysis:\
  \ the onset of edge-localized modes (ELMs) is triggered when the pressure gradient\
  \ and edge current density exceed a critical boundary in $(\\alpha, j_{\\rm edge})$\
  \ space, where $\\alpha \\propto -R q^2 dp/dr$ is the normalized pressure gradient,\
  \ $R$ the major radius, and $q$ the safety factor. Typical values range from $10^4$\
  \ Pa in small tokamaks to $10^6$ Pa in ITER-class devices. Usually extracted from\
  \ an mtanh fit to high-spatial-resolution Thomson scattering data, evaluated at\
  \ the inflection point of the pedestal profile. See also `derivative_of_electron_pressure_with_respect_to_normalized_poloidal_flux`\
  \ for the full profile and `electron_pressure_at_pedestal` for the pedestal-top\
  \ pressure."
