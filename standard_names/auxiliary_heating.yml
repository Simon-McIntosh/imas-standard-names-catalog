- name: per_toroidal_mode_left_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: active
  description: Power-deposition-weighted flux-surface average of the complex left-hand
    circularly polarized wave electric-field phasor for one toroidal Fourier mode,
    retaining its referenced phase.
  documentation: 'This quantity is the complex left-hand circular polarization electric-field
    phasor for one toroidal Fourier mode, averaged over a magnetic flux surface with
    local wave-power deposition as the weighting function. It is a weighted component
    of the [left-hand circularly polarized wave electric field](name:left_hand_circularly_polarized_wave_electric_field),
    not a separate polarization state.


    The defining weighted average is


    $$

    \mathcal{E}_{+,P}^{(n)}(\psi)=

    \frac{\left\langle P_{\mathrm{dep}}^{(n)} E_{+}^{(n)}\right\rangle_{\psi}}

    {\left\langle P_{\mathrm{dep}}^{(n)}\right\rangle_{\psi}}

    $$


    where $\mathcal{E}_{+,P}^{(n)}$ is the requested phasor, $E_{+}^{(n)}$ is the
    left-hand circularly polarized wave electric-field phasor, $P_{\mathrm{dep}}^{(n)}$
    is the local deposition weight for toroidal mode number $n$, and $\langle\cdot\rangle_{\psi}$
    denotes a flux-surface average on the surface labeled by $\psi$. The denominator
    must be nonzero.


    The result retains amplitude and phase. Its phase is referenced to the selected
    zero-phase toroidal location, with toroidal angle $\phi$ defined in the right-handed
    cylindrical $(R,\phi,Z)$ frame and represented on the interval $(-\pi,\pi]$. It
    differs from the unweighted [per-toroidal-mode left-hand circularly polarized
    electric field](name:per_toroidal_mode_left_hand_circularly_polarized_electric_field)
    through the deposition weighting.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_wave_electric_field
  arguments:
  - name: left_hand_circularly_polarized_wave_electric_field
    operator: per_toroidal_mode
    operator_kind: qualifier
