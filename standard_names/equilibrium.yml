- name: vertical_coordinate_of_magnetic_axis
  kind: scalar
  status: active
  description: "Signed vertical Z coordinate of the magnetic axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, marking the interior extremum organizing nested\
    \ magnetic flux surfaces."
  documentation: 'The quantity is the signed vertical coordinate $Z_\mathrm{axis}$
    of the magnetic-axis point in a poloidal cross-section. The magnetic axis is the
    interior extremum of the poloidal magnetic-flux function around which nested magnetic
    flux surfaces are organized.


    For an equilibrium with poloidal flux function $\psi(R,Z)$, the magnetic-axis
    point satisfies the stationary-point condition


    $$

    \left.\frac{\partial \psi}{\partial R}\right|_{\mathrm{axis}}

    =

    \left.\frac{\partial \psi}{\partial Z}\right|_{\mathrm{axis}}

    =0

    $$


    where $\psi$ is the poloidal magnetic-flux function, $R$ is the major-radius coordinate,
    $Z$ is the vertical coordinate, and the subscript $\mathrm{axis}$ denotes evaluation
    at the magnetic-axis point. The derivatives are taken in the poloidal cross-section,
    and $0$ denotes a vanishing derivative.


    The coordinate is defined in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $\phi$ is the toroidal angle. It applies to the single interior magnetic-axis
    point, has no species or particle-population scope, and is neither averaged nor
    integrated over a surface, region, or volume. It records only the vertical coordinate;
    the corresponding radial coordinate is required to locate the point fully.


    This quantity is distinct from the [vertical coordinate of the geometric axis](name:vertical_coordinate_of_geometric_axis),
    which describes a boundary-derived geometric center, and from the [vertical coordinate
    of the X-point](name:vertical_coordinate_of_x_point), which identifies a magnetic
    null where separatrix branches meet.


    Sign convention: Positive when the magnetic axis lies in the direction of increasing
    vertical coordinate $Z$ from the origin of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_geometric_axis
  sources:
  - dd_path: distribution_sources/magnetic_axis/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/distribution_sources.html#distribution_sources-magnetic_axis-z
