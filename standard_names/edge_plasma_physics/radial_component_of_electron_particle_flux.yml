name: radial_component_of_electron_particle_flux
status: draft
description: Radial projection of the electron particle flux density, giving the net
  rate of cross-field electron transport per unit area in the radial direction.
documentation: "The radial component of the electron particle flux $\\Gamma_{e,r}$\
  \ (m$^{-2}$ s$^{-1}$) quantifies the net rate at which electrons cross flux surfaces\
  \ per unit area in the radial ($\\hat{r}$) direction. In the diffusive\u2013convective\
  \ picture $\\Gamma_{e,r} = -D_e \\nabla_r n_e + n_e v_{\\mathrm{pinch},e}$, where\
  \ $D_e$ is the electron particle diffusivity (m$^{2}$ s$^{-1}$), $n_e$ the electron\
  \ density (m$^{-3}$), and $v_{\\mathrm{pinch},e}$ an inward pinch velocity (m/s).\
  \ In the SOL, $\\Gamma_{e,r}$ determines the radial density scrape-off length and\
  \ fueling efficiency. Typical magnitudes span $10^{19}$\u2013$10^{22}$ m$^{-2}$\
  \ s$^{-1}$ depending on regime (L-mode vs H-mode pedestal). Ambipolarity constrains\
  \ this flux to balance the sum of ion radial particle fluxes weighted by charge\
  \ state. Inferred from density profile evolution or Langmuir probe measurements\
  \ in the SOL."
