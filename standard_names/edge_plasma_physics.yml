- name: neutral_pressure_over_scrape_off_layer
  kind: scalar
  status: active
  description: Volume-averaged thermal pressure of neutral atoms and molecules in
    the scrape-off layer, the open-field-line region between the last closed flux
    surface and material plasma-facing components.
  documentation: 'Neutral pressure over the scrape-off layer is the volume-averaged
    thermal pressure of neutral atoms and molecules in the open-field-line region
    between the last closed flux surface and the material plasma-facing components.
    It represents the neutral-gas contribution to the SOL pressure, distinct from
    the electron partial pressure described by [electron pressure over the scrape-off
    layer](name:electron_pressure_over_scrape_off_layer), and is a component of [pressure
    over the scrape-off layer](name:pressure_over_scrape_off_layer).


    The defining volume average is


    $$

    \overline{p}_{\mathrm{n,SOL}} = \frac{1}{V_{\mathrm{SOL}}} \int_{\mathrm{SOL}}
    p_{\mathrm{n}}(\mathbf{r})\,\mathrm{d}V, \qquad p_{\mathrm{n}}(\mathbf{r}) = \sum_s
    n_s(\mathbf{r}) k_B T_s(\mathbf{r})

    $$


    where $V_{\mathrm{SOL}}$ is the scrape-off-layer volume, $\mathbf{r}$ is position,
    $p_{\mathrm{n}}$ is local neutral pressure, $s$ indexes neutral atomic and molecular
    species, $n_s$ is their number density, $T_s$ is their thermodynamic temperature,
    and $k_B$ is Boltzmann''s constant.


    The quantity excludes charged-particle pressure and represents an average over
    the entire scrape-off-layer domain rather than a pressure evaluated at a particular
    location.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_over_scrape_off_layer
  - name:pressure_over_scrape_off_layer
  arguments:
  - name: pressure_over_scrape_off_layer
    operator: neutral
    operator_kind: qualifier
  sources:
