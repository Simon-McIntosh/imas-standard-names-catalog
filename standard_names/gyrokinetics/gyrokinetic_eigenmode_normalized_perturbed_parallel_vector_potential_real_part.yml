name: gyrokinetic_eigenmode_normalized_perturbed_parallel_vector_potential_real_part
status: draft
description: Real part of the normalized perturbed parallel vector potential $\delta
  \hat{A}_\parallel$ for a gyrokinetic eigenmode.
documentation: "The real component of the dimensionless perturbed parallel magnetic\
  \ vector potential $\\mathrm{Re}(\\delta \\hat{A}_\\parallel)$ associated with a\
  \ specific gyrokinetic eigenmode at a given wavevector $(k_\\theta, k_\\phi)$. The\
  \ normalization is typically $\\delta \\hat{A}_\\parallel = \\delta A_\\parallel\
  \ / (B_0 \\rho_s)$, where $B_0$ is the reference magnetic field in T, and $\\rho_s\
  \ = c_s / \\Omega_i$ is the ion sound Larmor radius in m with $c_s$ the sound speed\
  \ and $\\Omega_i$ the ion cyclotron frequency. Together with its imaginary counterpart,\
  \ this quantity fully specifies the complex eigenmode structure of the electromagnetic\
  \ perturbation along the magnetic field line. The parallel vector potential perturbation\
  \ $\\delta A_\\parallel$ drives the parallel magnetic flutter transport and enters\
  \ Amp\xE8re's law closure in the gyrokinetic system. Computed by linear or nonlinear\
  \ gyrokinetic codes such as GS2, GENE, or GKW; the eigenmode is resolved on a parallel-coordinate\
  \ grid spanning the ballooning angle or the field-line-following coordinate. See\
  \ also the companion imaginary part and the electrostatic potential eigenmode structure."
