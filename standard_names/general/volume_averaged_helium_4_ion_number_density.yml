name: volume_averaged_helium_4_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of helium-4 (alpha-particle) ions,
  the primary fusion ash species in D-T plasmas.
documentation: "The volume-averaged helium-4 ion number density $\\langle n_{{}^4\\\
  mathrm{He}} \\rangle_V = V^{-1} \\int n_{{}^4\\mathrm{He}}(\\mathbf{r})\\, dV$ where\
  \ $n_{{}^4\\mathrm{He}}$ is the local ${}^4\\mathrm{He}^{2+}$ (alpha particle) density\
  \ in m$^{-3}$ and $V$ is the plasma volume in m$^3$. In D-T burning plasmas, thermalized\
  \ alpha particles constitute the dominant helium ash; their accumulation dilutes\
  \ the fuel and degrades fusion performance. Typical $\\langle n_{{}^4\\mathrm{He}}\
  \ \\rangle_V$ values of $\\sim 5$\u2013$10\\%$ of $n_e$ (i.e., $5 \\times 10^{18}$\u2013\
  $1 \\times 10^{19}$ m$^{-3}$ at ITER-class densities) are expected before helium\
  \ exhaust maintains steady state. Helium concentration is measured via CXRS on the\
  \ He$^{2+}$ line (468.6 nm) or from visible spectroscopy in the divertor; helium\
  \ transport and exhaust efficiency are key parameters for sustained burn. See also\
  \ `volume_averaged_helium_3_ion_number_density` and `volume_averaged_deuterium_tritium_ion_number_density`."
