- name: parallel_refractive_index
  kind: scalar
  status: draft
  description: Component of the wave refractive index along the local magnetic field
    direction, evaluated along a beam-tracing ray path.
  documentation: 'The parallel refractive index $N_{\parallel} = \mathbf{N} \cdot
    \hat{b}$ is the projection of the wave refractive index vector $\mathbf{N} = c
    \mathbf{k} / \omega$ onto the local magnetic field direction $\hat{b} = \mathbf{B}
    / |\mathbf{B}|$, where $c$ is the speed of light, $\mathbf{k}$ is the wave vector
    (in m$^{-1}$), and $\omega$ is the angular frequency (in rad/s). It determines
    the parallel phase velocity $v_{\phi,\parallel} = c / N_{\parallel}$ and sets
    the resonance condition for electron cyclotron (EC) and ion cyclotron (IC) heating,
    where $\omega - k_{\parallel} v_{\parallel} = n \Omega_c$, with $n$ an integer
    harmonic and $\Omega_c$ the cyclotron frequency. Along an ECE or beam-tracing
    ray path, $N_{\parallel}$ evolves through the plasma according to the cold-plasma
    or warm-plasma dispersion relation and is a key parameter in accessibility calculations
    and absorption modeling.


    Sign convention: Positive when the wave vector component $k_{\parallel}$ points
    in the direction of the local magnetic field $\mathbf{B}$.


    See the parent vector quantity [refractive_index](name:refractive_index) for the
    full two-component description. The perpendicular complement is [perpendicular_refractive_index](name:perpendicular_refractive_index),
    and the related normalized components [normalized_parallel_wave_vector](name:normalized_parallel_wave_vector)
    and [normalized_perpendicular_wave_vector](name:normalized_perpendicular_wave_vector)
    provide an alternative decomposition. In fusion plasmas, typical values of $N_{\parallel}$
    range from near unity for electron cyclotron waves to order 10 for ion cyclotron
    waves, depending on launch conditions and plasma parameters.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:refractive_index
  - name:perpendicular_refractive_index
  - name:normalized_parallel_wave_vector
  - name:normalized_perpendicular_wave_vector
  arguments:
  - name: refractive_index
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:ece/channel/beam_tracing/beam/wave_vector/n_parallel
    dd_path: ece/channel/beam_tracing/beam/wave_vector/n_parallel
    status: composed
  - id: dd:waves/coherent_wave/beam_tracing/beam/wave_vector/n_parallel
    dd_path: waves/coherent_wave/beam_tracing/beam/wave_vector/n_parallel
