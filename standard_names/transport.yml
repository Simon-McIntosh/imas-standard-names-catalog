- name: toroidal_total_current_density
  kind: scalar
  status: draft
  description: Toroidal component of the total electric current density vector, representing
    the net current density flowing in the geometric toroidal direction on the generalized
    grid.
  documentation: "The toroidal total current density $j_{\\phi,\\text{total}}$ is\
    \ the projection of the total current density vector $\\mathbf{j}_{\\text{total}}$\
    \ onto the toroidal unit vector $\\hat{\\phi}$ in the cylindrical $(R, \\phi,\
    \ Z)$ frame: $j_{\\phi,\\text{total}} = \\mathbf{j}_{\\text{total}} \\cdot \\\
    hat{\\phi}$. It sums all current contributions in the toroidal direction, including\
    \ the plasma current, eddy currents induced by time-varying magnetic fields, and\
    \ any externally driven currents. This quantity is typically computed from equilibrium\
    \ reconstruction or from generalized grid (GGD) field values in the plasma edge\
    \ and scrape-off layer, with magnitudes reaching $10^5$\u2013$10^7$ A/m$^2$ in\
    \ the core and decreasing toward the plasma boundary. The toroidal component is\
    \ the dominant contribution to the total current density in tokamaks, directly\
    \ related to the confining poloidal magnetic field via Amp\xE8re's law. See the\
    \ vector parent [total_current_density](name:total_current_density) and the plasma-only\
    \ variant [toroidal_current_density](name:toroidal_current_density).\n\nSign convention:\
    \ Positive when $j_{\\phi,\\text{total}}$ points in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above)."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:total_current_density
  - name:toroidal_current_density
  arguments:
  - name: total_current_density
    operator: component
    operator_kind: projection
    axis: toroidal
