name: hydrogenic_effective_atomic_mass
status: draft
description: Density-weighted mean atomic mass of the hydrogenic ion population (H,
  D, T), expressed in unified atomic mass units.
documentation: The hydrogenic effective mass $m_{\rm eff} = (n_{\rm H} m_{\rm H} +
  n_{\rm D} m_{\rm D} + n_{\rm T} m_{\rm T}) / (n_{\rm H} + n_{\rm D} + n_{\rm T})$
  characterizes the average isotopic composition of the fuel ions, where $n_s$ and
  $m_s$ are the number density (m$^{-3}$) and atomic mass (u) of species $s \in \{\text{H,
  D, T}\}$. In a pure deuterium plasma $m_{\rm eff} \approx 2.01$ u; in a 50:50 D-T
  mix $m_{\rm eff} \approx 2.50$ u. The quantity is volume-averaged and inferred from
  neutron rate ratios (D-D vs. D-T), Balmer-$\alpha$ isotope spectroscopy, or neutral
  particle analyzer energy spectra. It influences confinement scaling through the
  isotope effect ($\tau_E \propto m_{\rm eff}^{\alpha}$ with $\alpha \approx 0.2$),
  ion cyclotron resonance heating layer positions ($\omega_{ci} = Z e B / m_{\rm eff}$),
  and fusion power projections. See also the hydrogen isotope fraction.
