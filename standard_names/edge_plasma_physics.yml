- name: toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "Flux-surface-averaged deuterium-ion bulk-flow velocity along increasing\
    \ toroidal angle on the last closed magnetic surface in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame, with ionization states density-weighted."
  documentation: 'This quantity is the flux-surface average of the toroidal component
    of the deuterium-ion bulk velocity on the plasma boundary, defined as the last
    closed magnetic flux surface. The deuterium velocity is the density-weighted mean
    over all deuterium ionization states.


    $$

    \left\langle V_{\phi,D} \right\rangle_{\mathrm{FS}} = \frac{\displaystyle \oint_{\mathcal{S}_b}
    V_{\phi,D}\,\frac{dS}{|\mathbf{B}|}}{\displaystyle \oint_{\mathcal{S}_b} \frac{dS}{|\mathbf{B}|}}

    $$


    Here, $V_{\phi,D}=\mathbf{V}_D\cdot\hat{\phi}$ is the deuterium bulk-velocity
    projection onto the toroidal unit vector, $\mathcal{S}_b$ is the boundary flux
    surface, $dS$ is its surface-area element, and $|\mathbf{B}|$ is the magnetic-field
    magnitude. The projection is defined in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. Unlike [toroidal deuterium velocity at the plasma boundary](name:toroidal_deuterium_velocity_at_plasma_boundary),
    this quantity is averaged over the entire boundary surface rather than evaluated
    at a local point.


    Sign convention: Positive when the deuterium bulk velocity has a component in
    the direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_plasma_boundary
  sources:
