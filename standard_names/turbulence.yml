        \ TEM modes."
      kind: llm
- name: radial_derivative_of_elongation_of_flux_surface
  kind: scalar
  status: active
  description: Radial rate of change of the flux surface elongation kappa with respect
    to normalized minor radius, measuring how rapidly the poloidal cross-section aspect
    ratio varies across nested flux surfaces.
  documentation: 'The radial derivative of flux surface elongation quantifies how
    the vertical-to-horizontal shape of nested toroidal magnetic surfaces changes
    as a function of radial position. The flux surface elongation $\kappa$ equals
    the ratio of the vertical to horizontal semi-axis of the poloidal cross-section,
    so its radial derivative captures the rate at which flux surfaces become more
    (or less) vertically elongated moving outward from the magnetic axis.


    The quantity is defined as:


    $$

    \frac{d\kappa}{d\hat{r}}

    $$


    where $\kappa$ is the [elongation of the flux surface](name:elongation_of_flux_surface)
    and $\hat{r}$ is the normalized minor radius running from 0 at the magnetic axis
    to 1 at the plasma boundary. Both $\kappa$ and $\hat{r}$ are dimensionless, so
    the derivative is also dimensionless.


    This derivative is a required geometric input to local gyrokinetic flux-tube simulations,
    entering the metric coefficients that govern field-line curvature and grad-$B$
    drift terms within the flux-tube domain. It belongs to the broader family of radial
    flux surface shape coefficient derivatives that also includes the [radial derivative
    of flux surface shape coefficient](name:radial_derivative_of_elongation_of_flux_surface).
    In plasmas with significant edge shaping, this quantity grows in magnitude toward
    the separatrix, while remaining near zero for nearly circular flux surfaces where
    $\kappa \approx 1$ throughout the minor radius.


    Sign convention: Positive when the elongation $\kappa$ increases with increasing
    normalized minor radius $\hat{r}$, corresponding to flux surfaces that become
    more vertically elongated toward the plasma boundary.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:elongation_of_flux_surface
  arguments:
  - name: elongation_of_flux_surface
    operator: radial_derivative
    operator_kind: unary_prefix
  sources:
