- name: total_plant_electrical_power_consumption
  kind: scalar
  status: draft
  description: Total electrical power consumed to operate all systems of the fusion
    power plant, including auxiliary, support, and parasitic loads across every subsystem.
    This quantity is strictly nonnegative and represents an instantaneous or time-averaged
    demand depending on context.
  documentation: "The total plant electrical power consumption $P_\\mathrm{elec,total}$\
    \ is the sum of all electrical loads required to keep the fusion power plant in\
    \ operation. It aggregates contributions from all major subsystems: plasma heating\
    \ and current drive, magnet systems, cooling and cryogenic circuits, fuel processing,\
    \ instrumentation and control, balance-of-plant auxiliaries, and any other parasitic\
    \ or support loads.\n\nAccounting convention: $P_\\mathrm{elec,total} \\geq 0$\
    \ by definition. Each contributing subsystem is treated as a consumer of electrical\
    \ power, so subsystem contributions are nonnegative. Net-generating subsystems\
    \ (if any, such as a turbine directly feeding an auxiliary bus) should be accounted\
    \ for at the subsystem boundary before their residual load enters this sum; the\
    \ total does not include algebraic cancelation between generating and consuming\
    \ subsystems unless explicitly noted in the associated data description. Internal\
    \ electrical distribution losses within the plant are included in the total to\
    \ the extent that they are metered or modeled as identifiable loads.\n\nThe relationship\
    \ to net electric output is: $P_\\mathrm{net} = P_\\mathrm{gross} - P_\\mathrm{elec,total}$,\
    \ where $P_\\mathrm{gross}$ is the gross electrical power generated by the primary\
    \ conversion system. This quantity is therefore a key figure of merit for plant\
    \ recirculating power fraction $f_\\mathrm{recirc} = P_\\mathrm{elec,total} /\
    \ P_\\mathrm{gross}$.\n\nWhether $P_\\mathrm{elec,total}$ represents an instantaneous\
    \ snapshot or a time-averaged value depends on the temporal context of the parent\
    \ dataset; no specific averaging window is prescribed by this standard name itself.\
    \ Typical values for a demonstration-scale fusion plant are of order $10^7$\u2013\
    $10^9$ W."
  unit: W
  physics_domain: plant_systems
  links:
  - name:net_electric_power_output
  - name:plant_system_electrical_power
  - name:plant_subsystem_electrical_power
  - name:fusion_thermal_power_input
  - name:waste_thermal_power_of_plant
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_electric_plant_operation/power_total
    dd_path: balance_of_plant/power_electric_plant_operation/power_total
    status: composed
- name: total_thermal_power_input_to_power_conversion_system_due_to_fusion
  kind: scalar
  status: draft
  description: Rate of thermal energy transfer, originating exclusively from fusion
    reactions, that crosses the inlet boundary of the power conversion system. This
    excludes auxiliary heating contributions and any heat diverted to internal plant
    services upstream of the conversion-system inlet.
  documentation: "## Total Thermal Power Input to Power Conversion System Due to Fusion\n\
    \nThis instantaneous scalar quantity $P_\\mathrm{fus,th}^\\mathrm{PCS}$ is defined\
    \ as the thermal power of fusion origin delivered to the working-fluid interface\
    \ of the power conversion system (PCS). The PCS inlet boundary is the surface\
    \ at which thermal energy enters the thermodynamic cycle \u2014 typically the\
    \ primary-to-secondary heat-exchanger or steam-generator inlet.\n\n### Defining\
    \ identity\n\n$$P_\\mathrm{fus,th}^\\mathrm{PCS} \\;=\\; M_b \\, P_\\mathrm{fus}\
    \ \\;-\\; P_\\mathrm{up}$$\n\nwhere $P_\\mathrm{fus}$ is the total fusion power\
    \ (neutron plus alpha), $M_b$ is the blanket energy multiplication factor (typically\
    \ 1.1\u20131.2), and $P_\\mathrm{up}$ is the aggregate thermal power extracted\
    \ from the primary coolant loop upstream of the PCS inlet (tritium processing\
    \ heat, cryogenic loads, etc.).\n\n### Scope and attribution conventions\n\n-\
    \ **Fusion origin only.** Includes neutron heating of blanket and structural materials,\
    \ plasma radiation absorbed by in-vessel components, and charged-particle power\
    \ conducted to the first wall \u2014 all tracing back to D\u2013T or D\u2013D\
    \ fusion reactions. Auxiliary heating power (ohmic, neutral beam, RF) that is\
    \ deposited in the plasma and subsequently appears as blanket heat is attributed\
    \ to the respective auxiliary source and is excluded.\n- **Upstream losses subtracted.**\
    \ Any thermal power consumed by internal plant services (tritium breeding/extraction,\
    \ shield cooling diverted away from PCS, magnet thermal intercepts) before the\
    \ inlet boundary is not counted.\n- **Instantaneous value.** This is a time-resolved\
    \ quantity representing the power crossing the boundary at a given instant, not\
    \ a cycle-averaged or annual-mean accounting figure.\n\n### Relationship to other\
    \ plant quantities\n\nThe gross electrical output of the PCS is\n\n$$P_\\mathrm{gross}\
    \ = \\eta_\\mathrm{th} \\left( P_\\mathrm{fus,th}^\\mathrm{PCS} + P_\\mathrm{aux,th}^\\\
    mathrm{PCS} \\right)$$\n\nwhere $\\eta_\\mathrm{th}$ is the thermal-to-electric\
    \ conversion efficiency of the PCS and $P_\\mathrm{aux,th}^\\mathrm{PCS}$ (watts)\
    \ is the non-fusion thermal input to the same boundary. When fusion dominates\
    \ ($P_\\mathrm{aux,th}^\\mathrm{PCS} \\ll P_\\mathrm{fus,th}^\\mathrm{PCS}$),\
    \ the [net electric power output](name:net_electric_power_output) is principally\
    \ governed by this quantity and the recirculating electrical demand.\n\nThe [waste\
    \ thermal power](name:waste_thermal_power_of_plant) rejected at the PCS cold side\
    \ satisfies an energy balance over the entire conversion system that also involves\
    \ $P_\\mathrm{aux,th}^\\mathrm{PCS}$ and $P_\\mathrm{gross}$.\n\n### Typical values\n\
    \nFor commercial-scale tokamak power plants targeting ~1 GW$_\\mathrm{e}$ with\
    \ $\\eta_\\mathrm{th} \\approx 0.33$\u2013$0.40$, expected values are 2\u2013\
    3 GW. Near-term burning-plasma experiments with limited fusion gain deliver substantially\
    \ less, typically 0.1\u20130.5 GW to test heat sinks.\n\n### Distinction from\
    \ related quantities\n\nThis quantity differs from [fusion thermal power input](name:fusion_thermal_power_input)\
    \ by strictly scoping the accounting boundary to the PCS inlet rather than to\
    \ the broader set of plasma-facing or breeding-blanket surfaces. It also differs\
    \ from [total plant electrical power consumption](name:total_plant_electrical_power_consumption),\
    \ which is an electrical (not thermal) accounting quantity on the demand side."
  unit: W
  physics_domain: plant_systems
  links:
  - name:waste_thermal_power_of_plant
  - name:fusion_thermal_power_input
  - name:net_electric_power_output
  - name:total_plant_electrical_power_consumption
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/total_heat_supplied
    dd_path: balance_of_plant/power_plant/total_heat_supplied
    status: composed
- name: vertical_component_of_shattered_pellet_fragment_center_of_mass_velocity
  kind: scalar
  status: draft
  description: Vertical ($Z$) component of the center-of-mass velocity of the shattered
    pellet fragment cloud, evaluated at the shattering cone origin in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical component $v_Z$ of the fragment center-of-mass velocity\
    \ characterizes the net upward or downward motion of the shattered pellet fragment\
    \ cloud immediately after the pellet impacts the shattering target. It is the\
    \ $Z$-projection of the [shattered_pellet_fragment_center_of_mass_velocity](name:shattered_pellet_fragment_center_of_mass_velocity)\
    \ vector, evaluated at the shattering cone origin. This quantity differs physically\
    \ from the [vertical_component_of_shattered_pellet_velocity](name:vertical_component_of_shattered_pellet_velocity),\
    \ which refers to the intact pellet center-of-mass velocity before shattering;\
    \ after impact, the fragment cloud acquires a modified velocity distribution whose\
    \ center of mass may deviate from the original pellet trajectory due to asymmetric\
    \ fragmentation. The toroidal counterpart is the [toroidal_component_of_shattered_pellet_fragment_velocity](name:toroidal_component_of_shattered_pellet_fragment_velocity).\
    \ Typical injection velocities for shattered pellet injection (SPI) systems are\
    \ 100\u2013500 m/s; the vertical component depends on the injector geometry and\
    \ angle relative to the machine midplane. The quantity is inferred from fast camera\
    \ imaging or optical diagnostics tracking the fragment cloud position as a function\
    \ of time.\n\nSign convention: Positive when the fragment center-of-mass velocity\
    \ is directed in the $+Z$ direction (upward, away from the vessel midplane in\
    \ the direction of increasing $Z$)."
  unit: m.s^-1
