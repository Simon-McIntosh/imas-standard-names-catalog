name: derivative_of_flux_surface_cross_sectional_area_with_respect_to_radial_coordinate
status: draft
cocos_transformation_type: one_like
description: Radial derivative of the poloidal cross-sectional area enclosed by a
  flux surface with respect to the normalized toroidal radius $\rho_{\mathrm{tor}}$.
documentation: "The quantity $dA/d\\rho_{\\mathrm{tor}}$ describes how the poloidal\
  \ cross-sectional area $A$ of a flux surface changes as the radial label $\\rho_{\\\
  mathrm{tor}} = \\sqrt{\\Phi / \\Phi_{\\mathrm{edge}}}$ increases, where $\\Phi$\
  \ is the toroidal magnetic flux and $\\Phi_{\\mathrm{edge}}$ its value at the last\
  \ closed flux surface. This derivative appears in volume-element calculations for\
  \ flux-surface-averaged transport equations and in relating flux-surface integrals\
  \ to radial profiles; for instance the plasma volume element satisfies $dV = 2\\\
  pi R\\, dA$ in a toroidal geometry approximation. Computed during equilibrium reconstruction\
  \ (e.g., EFIT, LIUQE) from the Grad\u2013Shafranov solution; typical values range\
  \ from zero at the magnetic axis to several square meters per unit $\\rho_{\\mathrm{tor}}$\
  \ at the edge in medium-size tokamaks. See also `derivative_of_plasma_volume_with_respect_to_toroidal_flux_coordinate`\
  \ for the related volume derivative."
