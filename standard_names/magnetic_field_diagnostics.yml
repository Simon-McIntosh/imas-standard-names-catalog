- name: vertical_coordinate_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Vertical Z coordinate of a poloidal magnetic field probe in the right-handed
    cylindrical (R, phi, Z) frame, measuring the probe's height relative to the machine
    midplane.
  documentation: 'The vertical coordinate $Z$ locates a poloidal magnetic field probe
    along the machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius measured from the toroidal symmetry axis,
    $\phi$ is the toroidal angle, and $Z$ increases upward from the machine midplane.


    Poloidal field probes measure the poloidal component of the magnetic field and
    are deployed around the vacuum vessel to support equilibrium reconstruction; their
    precise spatial position is essential because the poloidal field pattern sensitively
    reflects the plasma current distribution. Together with [radial_coordinate_of_poloidal_magnetic_field_probe](name:radial_coordinate_of_poloidal_magnetic_field_probe),
    the $Z$ coordinate fully defines the probe location in the poloidal cross-section.
    The analogous coordinate for toroidal probes is given by [vertical_coordinate_of_toroidal_magnetic_field_probe](name:vertical_coordinate_of_toroidal_magnetic_field_probe),
    and the equivalent geometry for flux loop diagnostics is described by [vertical_coordinate_of_flux_loop](name:vertical_coordinate_of_flux_loop).


    Probe positions are established by mechanical survey during installation or from
    engineering drawings, with positional uncertainties of order 1 mm or less for
    precision installations. Values range from approximately $-2$ m to $+2$ m in medium-sized
    tokamaks, and up to several meters in larger devices.


    Sign convention: Positive when the probe position is above the machine midplane,
    in the direction of increasing $Z$.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:radial_coordinate_of_poloidal_magnetic_field_probe
  - name:vertical_coordinate_of_toroidal_magnetic_field_probe
