      - summary/time
    enhanced_context:
      description: "Total plasma toroidal momentum (p\u03C6), summed over all ion\
        \ species and electrons, evaluated as a flux-surface average at the separatrix.\
        \ A global measure of plasma angular momentum at the core-SOL boundary."
