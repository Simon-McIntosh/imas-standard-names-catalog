    dd_path: neutron_diagnostic/detectors/aperture/centre/r
    status: attached
  - id: dd:neutron_diagnostic/detectors/position/r
    dd_path: neutron_diagnostic/detectors/position/r
    status: composed
- name: neutral_beam_mass
  kind: scalar
  status: draft
  description: Atomic mass per particle of the injected neutral beam species, identifying
    the beam composition for diagnostic applications such as beam emission spectroscopy
    and charge exchange recombination spectroscopy.
  documentation: "The neutral beam mass specifies the atomic mass of the injected\
    \ neutral beam particle on a per-atom basis. This property identifies the beam\
    \ species and is an essential input for modeling spectroscopic observables \u2014\
    \ including Doppler line shapes and Lorentz-field motional Stark effects \u2014\
    \ in beam emission spectroscopy (BES) and charge exchange recombination spectroscopy\
    \ (CXRS).\n\nThis quantity is a fixed hardware parameter determined by the choice\
    \ of injected gas species. In fusion diagnostic applications the beam species\
    \ is a hydrogen isotope; typical masses are 1 u (hydrogen), 2 u (deuterium), or\
    \ 3 u (tritium), with deuterium the most widely used owing to its favorable penetration\
    \ depth and clear spectral separation from plasma impurity lines.\n\nTogether\
    \ with neutral_beam_charge and [neutral_beam_energy](name:neutral_beam_energy),\
    \ this mass fully characterizes the diagnostic beam species for spectral modeling.\
    \ The analogous per-particle mass of the observed fast ion population detected\
    \ via charge exchange emission is [fast_ion_mass](name:ion_atomic_mass), while\
    \ the general ionic species mass is [ion_mass](name:ion_atomic_mass)."
  unit: u
  physics_domain: particle_measurement_diagnostics
  links:
  - name:neutral_beam_energy
  - name:ion_atomic_mass
  sources:
  - id: dd:charge_exchange/channel/bes/a
    dd_path: charge_exchange/channel/bes/a
    status: composed
- name: neutron_rate_of_neutron_detector
  kind: scalar
  status: draft
  description: Number of individual neutron detection events registered per unit time
    by a neutron detector operating in pulse-counting mode.
  documentation: 'Neutron rate of a neutron detector is the count rate of resolved
    neutron-induced pulses recorded by the detector. It is a detector response quantity,
    not the total neutron emission rate of the plasma source and not the incident
    neutron flux at the detector location.


    The rate is defined from the cumulative number of accepted neutron detection events:


    $$

    R_n(t) = \frac{dN_\mathrm{det}(t)}{dt}

    $$


    where $R_n(t)$ is the neutron detection rate and $N_\mathrm{det}(t)$ is the cumulative
    number of neutron events that pass the detector pulse-height, timing, and discrimination
    criteria.


    In practice, the rate is obtained by counting pulses in a finite time bin and
    dividing by the bin duration, with corrections as needed for dead time, background,
    pile-up, and neutron-gamma discrimination. For a given neutron field it depends
    on detector efficiency, active area or volume, shielding, collimation, and the
    neutron energy and angular response; at high rates, unresolved pile-up can make
    pulse counting unreliable and motivate current-mode or other integrating operation.


    Typical pulse-counting rates range from about 10^0-10^7 s^-1, depending on detector
    type, distance from the plasma, shielding, and fusion power. Rates above roughly
    10^6-10^7 s^-1 often require careful dead-time correction or a change of operating
    mode.'
  unit: s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:efficiency_of_neutron_detector
  - name:flux_of_neutron_detector
  - name:rate_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/mode/counting
