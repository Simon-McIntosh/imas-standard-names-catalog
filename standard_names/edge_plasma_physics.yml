- name: toroidal_helium_4_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Toroidal component of the helium-4 ion fluid velocity evaluated at\
    \ the H-mode pressure pedestal top, resolved along the direction of increasing\
    \ toroidal angle in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal component of the helium-4 ion fluid velocity evaluated
    at the H-mode pressure pedestal top, resolved along the direction of increasing
    toroidal angle, is the signed bulk-flow component of helium-4 ions along $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. The pedestal top is the
    core-side shoulder of the H-mode pressure pedestal. As a species-level intensive
    quantity, it is the density-weighted mean over all helium-4 ionization charge
    states in the ion population.


    The charge-state-aggregated toroidal component at the pedestal top is defined
    by


    $$

    v_{\phi,\mathrm{ped}}^{{}^4\mathrm{He}} =

    \frac{\sum_q n_q^{{}^4\mathrm{He}} \left(\mathbf{v}_q^{{}^4\mathrm{He}} \cdot
    \hat{\phi}\right)}

    {\sum_q n_q^{{}^4\mathrm{He}}}

    $$


    where $q$ labels helium-4 ionization charge states, $n_q^{{}^4\mathrm{He}}$ is
    the local number density of charge state $q$, $\mathbf{v}_q^{{}^4\mathrm{He}}$
    is its fluid velocity, and $\hat{\phi}$ is the unit vector in the direction of
    increasing $\phi$; all quantities are evaluated at the pedestal-top location.


    This quantity is local to the pedestal top and is not an average over the full
    pedestal or scrape-off layer. It is a species-level helium-4 velocity, so it differs
    from charge-state-resolved helium-4 velocities by the density-weighted charge-state
    aggregation and from other isotope velocities only by the selected ion species.


    Sign convention: Positive when the helium-4 ion flow is in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, counter-clockwise
    when viewed from above along $+\hat{Z}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_flux_coordinate_of_pedestal
  - name:toroidal_flux_surface_averaged_helium_4_velocity_at_plasma_boundary
