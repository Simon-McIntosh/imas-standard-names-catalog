- name: normalized_toroidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: active
  description: Dimensionless toroidal magnetic-surface label assigned to a physical
    measurement position, locating that position relative to the magnetic axis and
    equilibrium boundary.
  documentation: 'The normalized toroidal flux coordinate at a measurement position
    identifies the nested magnetic surface intersecting that physical location. It
    is a geometric flux label, independent of the measured plasma quantity.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}} = \sqrt{\frac{\Phi_{\mathrm{tor}} - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}}
    - \Phi_{\mathrm{tor,axis}}}}

    $$


    where $\rho_{\mathrm{tor,norm}}$ is the normalized toroidal flux coordinate, $\Phi_{\mathrm{tor}}$
    is the toroidal magnetic flux enclosed by the magnetic surface through the measurement
    position, $\Phi_{\mathrm{tor,axis}}$ is its value at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$
    is its value at the equilibrium boundary.


    This quantity is evaluated at one physical measurement position and is not a population-dependent
    value, spatial average, cylindrical radial distance, or local vector component.
    It maps that position to a magnetic-surface label rather than identifying the
    measured signal itself.


    It is the measurement-position evaluation of the parent [normalized toroidal flux
    coordinate](name:normalized_toroidal_flux_coordinate). Unlike [normalized_poloidal_flux_coordinate_at_measurement_position](name:normalized_poloidal_flux_coordinate_at_measurement_position),
    it is based on toroidal rather than poloidal magnetic flux.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_poloidal_flux_coordinate_at_measurement_position
  arguments:
