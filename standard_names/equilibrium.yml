- name: derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
  kind: scalar
  status: active
  description: Radial rate of change of the volume enclosed by a nested magnetic flux
    surface as its dimensionful toroidal flux coordinate increases.
  documentation: 'The quantity is the local derivative of the cumulative three-dimensional
    volume enclosed by a nested magnetic flux surface with respect to its dimensionful
    toroidal flux coordinate. It is a geometric metric coefficient used in flux-surface-averaged
    equilibrium and transport relations.


    The defining relation is


    $$

    \frac{dV}{d\rho_{\mathrm{tor}}}

    =

    \frac{d}{d\rho_{\mathrm{tor}}}

    \left(\int_{\Omega(\rho_{\mathrm{tor}})} d^3x\right)

    $$


    where $V$ is the volume enclosed by the flux surface, $\rho_{\mathrm{tor}}$ is
    the dimensionful toroidal flux coordinate labeling that surface, $\Omega(\rho_{\mathrm{tor}})$
    is the region inside it, and $\mathbf{x}$ is the spatial position whose volume
    element is $d^3x$.


    This quantity applies to each nested magnetic flux surface, with the enclosed
    volume accumulated from the magnetic axis outward and differentiated locally with
    respect to the toroidal-flux-coordinate label. It is a purely geometric scalar
    with no species, field-component, or process aggregation; it is neither the enclosed
    volume itself nor a flux-surface average.


    It is the derivative of the [volume enclosed by a flux surface](name:volume_of_flux_surface).
    It differs from the [derivative with respect to toroidal flux coordinate of flux-surface
    area](name:derivative_with_respect_to_toroidal_flux_coordinate_of_area_of_flux_surface),
    which differentiates enclosed cross-sectional area, and from the [toroidal flux
    coordinate gradient magnitude](name:toroidal_flux_coordinate_gradient_magnitude),
    which describes spatial variation of the coordinate rather than volume accumulation.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:volume_of_flux_surface
  - name:derivative_with_respect_to_toroidal_flux_coordinate_of_area_of_flux_surface
  arguments:
  - name: volume_of_flux_surface
    operator: derivative_with_respect_to_toroidal_flux_coordinate
    operator_kind: unary_prefix
