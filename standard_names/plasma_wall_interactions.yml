- name: particle_flux_due_to_recombination
  kind: scalar
  status: draft
  description: Particle number flux generated by recombination of incident ions into
    neutral particles, summed over relevant ion species, charge states, and neutral
    product states. It is the parent concept for geometry-specific recombination flux
    densities, such as emission from plasma-facing surfaces.
  documentation: 'Particle flux due to recombination is the rate at which neutral
    particles are produced and carried across a specified interface after ions recombine
    with electrons or surface-bound electrons. This parent quantity abstracts over
    more specific forms; for example, [particle_flux_at_wall_due_to_recombination](name:particle_flux_at_wall_due_to_recombination)
    is the outgoing neutral-particle flux density from a plasma-facing wall. When
    unresolved, the total includes all contributing ion species, charge states, and
    neutral product states.


    For surface recombination flux-density forms, a common particle-balance representation
    is:


    $$

    \Gamma_\mathrm{rec} = \sum_{s,z,\alpha} Y_{s,z,\alpha}\,\Gamma_{\mathrm{ion},s,z}

    $$


    where $\Gamma_\mathrm{rec}$ is the recombination-produced particle flux density,
    $\Gamma_{\mathrm{ion},s,z}$ is the incident ion flux density for species $s$ and
    charge state $z$, $\alpha$ labels the neutral product state, and $Y_{s,z,\alpha}$
    is the effective recombination and re-emission yield. For an area-normalized flux
    density, the SI unit is m^-2 s^-1.


    This quantity is estimated from incident ion fluxes, recycling or recombination
    yields, edge particle balance, neutral transport modeling, and diagnostics sensitive
    to recycling emission near material surfaces. Spectroscopic measurements, ion-saturation-current
    measurements, and inferred neutral source strengths are commonly combined to separate
    recombination-driven neutral production from other particle sources.


    Typical wall recombination flux densities in magnetically confined plasmas are
    about 10^20-10^24 m^-2 s^-1. Main-chamber wall values often lie near 10^20-10^22
    m^-2 s^-1, while divertor or limiter regions with strong recycling can reach 10^22-10^24
    m^-2 s^-1.


    Sign convention: Positive when recombined neutral particles leave the recombining
    surface, such as a plasma-facing wall, and enter the adjacent plasma or gas.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
  sources:
  - id: derived:particle_flux_due_to_recombination
    status: composed
- name: particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Outgoing neutral-particle number flux per unit plasma-facing wall area
    emitted when incident plasma ions recombine at the surface, summed over all ion
    species, charge states, and neutral product states.
  documentation: 'Particle flux at the wall due to recombination quantifies the rate
    at which neutral particles are emitted from a plasma-facing surface per unit area
    as a result of incident plasma ions recombining or neutralizing at the material
    boundary. The flux is summed over all incident ion species, ion charge states,
    and neutral product quantum states, making it the total species-integrated surface
    recombination source for neutrals returning to the plasma.


    The total recombination neutral flux $\Gamma_\text{rec}$ at wall location $\mathbf{x}_w$
    is the sum of all state-resolved emission rates:


    $$

    \Gamma_\text{rec}(\mathbf{x}_w) = \sum_{s,\,q,\,k} \Gamma_{s,q \to k}(\mathbf{x}_w)

    $$


    where $\Gamma_{s,q \to k}$ is the emitted neutral flux per unit wall area for
    neutral product in quantum state $k$ arising from ion species $s$ in charge state
    $q$ recombining at the surface.


    In plasma-facing component modeling, this flux is estimated by applying surface
    neutralization probabilities to incident ion fluxes computed by edge plasma transport
    codes, or by Monte Carlo neutral transport simulations that track individual recombination
    events at the surface. The state-resolved counterpart [neutral_state_particle_flux_at_wall_due_to_recombination](name:neutral_state_particle_flux_at_wall_due_to_recombination)
    disaggregates the total by neutral product species and quantum state; summing
    over all states and species recovers the quantity represented here, which is also
    reported as [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).
    The energy deposited by the same recombination events is captured by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
  arguments:
  - name: particle_flux_due_to_recombination
    operator: wall
    operator_kind: locus
- name: neutral_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Neutral particle flux density emitted from a plasma-facing wall by
    recombination or neutralization of incident plasma ions at the surface, summed
    over all neutral species and internal states. It counts outgoing neutral particles
    per unit wall area and time.
  documentation: 'Neutral particle flux at a wall due to recombination is the emitted
    particle-number flux density of neutral atoms or molecules produced when incident
    plasma ions are neutralized at a plasma-facing material surface. It is aggregated
    over all neutral product species and internal states and excludes neutral emission
    from other wall processes unless they are part of the recombination or neutralization
    channel.


    The aggregate recombination emission flux is the sum of the state-resolved recombination
    fluxes:


    $$

    \Gamma_{n,\mathrm{rec}} = \sum_{s,q} \Gamma_{n,s,q}^{\mathrm{rec}}

    $$


    where $\Gamma_{n,\mathrm{rec}}$ and $\Gamma_{n,s,q}^{\mathrm{rec}}$ have units
    of m^-2 s^-1, $s$ indexes neutral product species, and $q$ indexes internal states
    such as electronic, vibrational, or rotational states. The state-resolved terms
    correspond to [neutral_state_particle_flux_at_wall_due_to_recombination](name:neutral_state_particle_flux_at_wall_due_to_recombination),
    while the more general state-resolved wall flux convention is represented by [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).


    In modeling, this flux is obtained from the incident ion flux to each wall surface
    element together with recombination, neutralization, recycling, and product-branching
    probabilities for the material and plasma conditions. For an individual incoming
    ion channel, the emitted neutral contribution is commonly proportional to the
    incident ion flux multiplied by the probability that the ion is neutralized and
    leaves the surface as a specified neutral product; summing over product branches
    gives the aggregate. Experimentally it is usually inferred indirectly from edge
    neutral diagnostics, spectroscopy, pressure measurements, and plasma-wall interaction
    modeling rather than measured as a direct surface particle counter.


    Representative values span many orders of magnitude: main-chamber wall values
    may be about 10^18-10^22 m^-2 s^-1, while divertor or limiter regions with strong
    recycling can reach about 10^21-10^24 m^-2 s^-1. The total neutral particle flux
    from all wall emission mechanisms is described by [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),
    and the related energy-weighted neutral wall flux is described by [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall).


    Sign convention: Positive when neutral particles cross the plasma-facing surface
    from the material into the plasma.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall
  arguments:
  - name: particle_flux_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/emitted/values
    status: composed
- name: neutral_state_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: State-resolved particle flux density of neutral atoms or molecules
    emitted from a plasma-facing wall in a specified product species and quantum state
    when incident ions recombine at or near the material surface. Summing over all
    neutral product species and quantum states recovers the total emitted recombination
    neutral flux.
  documentation: 'State-resolved particle flux density of neutrals emitted from a
    plasma-facing wall by surface recombination, resolved by neutral product species
    and quantum state. When incident plasma ions capture electrons at or near the
    material surface, they leave as neutral atoms or molecules; this quantity counts
    those emitted neutrals per unit wall area per unit time in one specified electronic,
    vibrational, or rotational state, providing a state-selective recycling source
    from the material boundary into the adjacent plasma.


    Summing over all neutral product species and quantum states recovers the total
    emitted recombination neutral flux:


    $$

    \Gamma^{0}_{\mathrm{rec}} = \sum_{s}\sum_{q} \Gamma^{0}_{\mathrm{rec},s,q}

    $$


    where $\Gamma^{0}_{\mathrm{rec},s,q}$ is the emitted neutral particle flux for
    product species $s$ in quantum state $q$, $\Gamma^{0}_{\mathrm{rec}}$ is the aggregate
    emitted recombination neutral flux, and both are expressed in m^-2.s^-1.


    This quantity is computed in plasma-surface interaction and edge transport models
    from incident ion fluxes, surface recombination probabilities, material conditions,
    and state-selective branching into neutral products. It can be constrained indirectly
    through spectroscopy, neutral pressure gages, and neutral particle diagnostics
    sensitive to recycling. It is the emitted counterpart of the incident neutral
    flux [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall),
    and its species-and-state sum gives [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).


    As an emitted particle number flux it is non-negative, vanishing when recombination
    into the specified state is absent. Typical state-resolved magnitudes range from
    about 10^18 to 10^23 m^-2.s^-1 in tokamak plasma-facing regions, with the largest
    contributions in high-recycling or detached divertor conditions and much smaller
    values for weakly populated excited states.


    Sign convention: Positive when neutral particles cross from the plasma-facing
    material surface into the adjacent plasma or vacuum region.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:neutral_state_particle_flux_at_wall
  - name:neutral_state_energy_flux_due_to_recombination
  arguments:
  - name: particle_flux_at_wall_due_to_recombination
    operator: neutral_state
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/emitted/values
    status: composed
- name: peak_power_density_at_first_wall
  kind: scalar
  status: draft
  description: Spatial maximum of the incident heat flux density deposited on first-wall
    plasma-facing surfaces.
  documentation: 'Peak power density at the first wall is the largest local incident
    thermal power per unit area deposited on first-wall plasma-facing surfaces. It
    is the first-wall-specific form of a wall peak-load metric, distinct from peaks
    evaluated over all wall elements, limiter surfaces, or divertor targets.


    For a first-wall surface $S_\mathrm{FW}$, it is defined as the maximum positive
    projection of the local power-flow vector onto the surface normal pointing from
    the plasma-facing surface into the solid wall:


    $$

    q_{\mathrm{FW}}^{\mathrm{peak}} = \max_{\mathbf{x} \in S_\mathrm{FW}} \max\left(0,
    \boldsymbol{q}(\mathbf{x}) \cdot \hat{\boldsymbol{n}}_w(\mathbf{x})\right)

    $$


    where $q_{\mathrm{FW}}^{\mathrm{peak}}$ is the peak first-wall power density in
    W m^-2, $\boldsymbol{q}(\mathbf{x})$ is the local energy flux density vector in
    W m^-2, and $\hat{\boldsymbol{n}}_w(\mathbf{x})$ is a dimensionless unit normal
    directed into the wall material at surface location $\mathbf{x}$. The inner maximum
    retains only incident heating and excludes outward or cooling fluxes.


    In practice, this quantity is obtained from infrared thermography and inverse
    heat-conduction analysis, embedded thermocouples, calorimetric measurements, or
    modeled combinations of plasma particle bombardment, charge-exchange neutral loading,
    and radiative heat deposition. Surface geometry, material properties, viewing
    factors, and time response are important when converting measured temperature
    or radiation signals into local incident heat flux.


    Representative steady or quasi-steady first-wall peak loads are typically about
    0.1-5 MW m^-2, depending on device size, plasma scenario, wall material, and active
    cooling. Short transients such as edge-localized modes, runaway-electron impacts,
    or disruptions can produce substantially larger instantaneous local peaks over
    shorter durations. Related quantities include [power_density_at_wall](name:power_density_at_wall)
    for a local wall heat-flux density, [peak_power_density_at_wall](name:peak_power_density_at_wall)
    for the maximum over wall surfaces more generally, [peak_power_density_at_limiter](name:peak_power_density_at_limiter)
    for limiter elements, and [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target)
    for divertor target plates.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density
  - name:energy_flux_at_wall
  sources:
  - id: dd:wall/first_wall_power_flux_peak
    dd_path: wall/first_wall_power_flux_peak
    status: composed
- name: peak_power_density_at_limiter
  kind: scalar
  status: draft
  description: Spatial maximum of the heat flux per unit surface area deposited by
    scrape-off-layer plasma on the limiter surface.
  documentation: 'Peak power density at a limiter is the spatial maximum of the local
    heat flux density deposited on the wetted limiter surface by scrape-off-layer
    plasma. It is the limiting local thermal load for limiter plasma-facing material,
    distinct from total limiter power because it depends on how narrowly the heat
    is distributed over the contact area.


    The peak limiter heat-flux density is defined as the maximum of the local deposited
    normal heat flux over the wetted limiter surface:


    $$

    q_{\mathrm{peak,lim}} = \max_{\mathbf{x} \in A_{\mathrm{lim}}} q_\perp(\mathbf{x})

    $$


    where $q_{\mathrm{peak,lim}}$ and $q_\perp$ have units W m^-2, $\mathbf{x}$ is
    a point on the limiter surface, and $A_{\mathrm{lim}}$ is the wetted limiter surface
    area in m^2. For attached scrape-off-layer transport, the geometric projection
    is often approximated by $q_\perp \approx q_\parallel \sin\alpha$, where $q_\parallel$
    is the parallel heat flux in W m^-2 and $\alpha$ is the dimensionless grazing
    angle between the magnetic field line and the surface; sheath heat-transmission
    factors, particle recycling, radiation, and surface incidence effects can modify
    this simple projection.


    In practice this quantity is inferred from infrared thermography, calorimetry,
    embedded temperature sensors, or probes, often combined with surface thermal modeling
    and magnetic field-line tracing to identify the wetted region. Equilibrium geometry
    and limiter alignment are important because small changes in strike location or
    grazing angle can strongly change the local maximum.


    Typical steady attached limiter loads in medium-size tokamaks are about 1-10 MW
    m^-2, with lower values in low-power or strongly radiating plasmas and substantially
    higher short-lived peaks possible during transients or localized contact events.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_divertor_target
  - name:peak_power_density_at_first_wall
  sources:
  - id: dd:summary/local/limiter/power_flux_peak/value
    dd_path: summary/local/limiter/power_flux_peak/value
    status: composed
- name: plasma_deposited_power_at_wall
  kind: scalar
  status: draft
  description: Total power from the plasma deposited on plasma-facing wall surfaces.
    It is the surface integral of the plasma-to-wall energy flux and is positive for
    energy transfer into the wall.
  documentation: 'Plasma deposited power at the wall is the total rate at which energy
    from the plasma is delivered to plasma-facing wall surfaces, including first-wall
    and divertor surfaces. It represents the global wall heat-load contribution associated
    with plasma energy crossing the plasma-wall interface.


    For a wall surface area $A_\mathrm{wall}$, the deposited power is defined from
    the local plasma-to-wall energy flux density $q_{p\to w}$ as:


    $$

    P_{p\to w} = \int_{A_\mathrm{wall}} q_{p\to w}(\mathbf{x})\, dA

    $$


    where $q_{p\to w}$ is the total local energy flux density from the plasma into
    the wall in W m$^{-2}$, $dA$ is a surface-area element, and the integral is over
    the plasma-facing wall area.


    In practice this quantity is inferred from wall calorimetry, infrared thermography
    combined with thermal modeling, embedded heat-flux sensors, bolometry and spectroscopy
    constraints, and power-balance analysis. The local flux density may include conducted,
    convected, radiative, and particle-associated energy contributions, but the standard
    name denotes only their total deposited power, not a decomposition by channel.


    Typical values range from about $10^5$-$10^7$ W in many present tokamak discharges,
    with high-power experiments and reactor-scale scenarios reaching $10^7$-$10^8$
    W or more depending on auxiliary heating, radiated-power fraction, confinement
    regime, and divertor detachment.


    Sign convention: Positive when energy is transferred from the plasma into the
    wall surface.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:deposited_power_at_wall
  - name:total_deposited_plasma_power_at_wall
  - name:total_coolant_absorbed_thermal_power_at_wall
  sources:
  - id: dd:wall/global_quantities/power_from_plasma
    dd_path: wall/global_quantities/power_from_plasma
    status: composed
  - id: dd:wall/global_quantities/power_incident
    dd_path: wall/global_quantities/power_incident
    status: attached
- name: power_density_at_wall
  kind: scalar
  status: draft
  description: Power flux density deposited on plasma-facing wall surfaces by all
    incident particle and radiation channels from the boundary plasma.
  documentation: "Power density at the wall quantifies the total thermal energy load\
    \ per unit surface area delivered to plasma-facing components, aggregating contributions\
    \ from charged particle impact, neutral atom bombardment, charge-exchange flux,\
    \ and photon irradiation. It provides a spatially distributed measure of wall\
    \ heating across the full plasma-facing geometry, in contrast to extremal statistics\
    \ such as [peak_power_density_at_first_wall](name:peak_power_density_at_first_wall)\
    \ or [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\n\
    \nThe local wall power density $q_w$ sums over all incident energy channels:\n\
    \n$$\nq_w = \\sum_s \\Gamma_s \\, E_s + q_{\\mathrm{rad}}\n$$\n\nwhere $\\Gamma_s$\
    \ is the incident particle flux density of species $s$, $E_s$ is the mean energy\
    \ deposited per particle, and $q_{\\mathrm{rad}}$ is the radiative contribution\
    \ represented by [energy_flux_at_wall_due_to_radiation](name:energy_flux_at_wall_due_to_radiation).\n\
    \nSpatially resolved wall heat loads are measured via calibrated infrared thermography\
    \ or derived from boundary plasma transport simulations validated against bolometric\
    \ total-power measurements. The [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)\
    \ and ion contributions can be tracked separately as components of this total.\n\
    \nTypical steady-state values range from 0.1\u20131 MW/m\xB2 on the main first\
    \ wall to 5\u201320 MW/m\xB2 at actively loaded divertor strike zones; transient\
    \ power loads during edge-localized modes can transiently exceed these by an order\
    \ of magnitude."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_divertor_target
  - name:energy_flux_at_wall_due_to_radiation
  - name:electron_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/power_density/values
    dd_path: wall/description_ggd/ggd/power_density/values
    status: composed
- name: radial_total_current_density_at_wall
  kind: scalar
  status: draft
  description: Signed flux-coordinate radial component of the total electric current
    density evaluated at the plasma-facing wall. The radial direction is the outward
    normal to local magnetic flux surfaces, not generally the major-radius direction
    in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Radial total current density at the wall is the component of the
    net electric current-density vector along the outward radial direction of a local
    flux-coordinate system $(\rho,\theta,\phi)$, evaluated at the plasma-facing material
    surface. It includes all current-carrying contributions represented in the total
    current density, such as charged-particle and conductive currents. This flux-coordinate
    radial component is generally distinct from the major-radius projection in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$
    is vertical height.


    A local definition is obtained by projecting the total current-density vector
    onto the outward normal to surfaces of constant radial flux coordinate:


    $$

    j_{\rho,\mathrm{tot}}^{\mathrm{wall}} = \left. \mathbf{j}_{\mathrm{tot}} \cdot
    \frac{\nabla \rho}{|\nabla \rho|} \right|_{\mathrm{wall}}

    $$


    where $\mathbf{j}_{\mathrm{tot}}$ is the total current-density vector in A.m^-2,
    $\rho$ is a dimensionless flux-surface radial coordinate increasing outward from
    the magnetic axis toward the edge, and $\nabla\rho/|\nabla\rho|$ is the corresponding
    outward unit normal. If the material wall is not itself a magnetic flux surface,
    the direction is taken from the local flux-coordinate mapping at the wall location
    and is not the geometric normal to the wall surface.


    In practice this quantity is computed in edge, scrape-off-layer, sheath, and plasma-wall
    interaction models by summing the relevant current contributions and projecting
    the result onto the local flux-coordinate radial direction. It may also be constrained
    experimentally by wall current monitors, Langmuir probes, biased electrodes, and
    magnetic measurements interpreted with a sheath and geometry model.


    Typical absolute magnitudes are strongly scenario dependent. Floating or nearly
    ambipolar plasma-facing surfaces may have net values near 0-10^2 A.m^-2, biased
    surfaces or RF sheath regions can reach 10^3-10^5 A.m^-2, and short transient
    events such as disruptions or localized halo-current contact can produce larger
    localized values.


    Sign convention: Positive when the total current density is directed outward along
    increasing $\rho$ in the flux-coordinate system $(\rho,\theta,\phi)$, from the
    confined plasma toward the plasma-facing wall.'
  unit: A.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:radial_total_current_density
  - name:radial_current_density_due_to_parallel_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:radial_current_density_due_to_heat_viscosity
  - name:radial_current_density_due_to_ion_neutral_friction
