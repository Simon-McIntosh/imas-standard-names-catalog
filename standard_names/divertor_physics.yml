- name: beryllium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Local non-negative number density of beryllium ions at the divertor
    target, summed over Be1+ through Be4+ charge states and excluding neutral beryllium
    atoms.
  documentation: 'Beryllium density at the divertor target is the local number of
    beryllium ions per unit volume in the plasma adjacent to the divertor target surface.
    It is a species-resolved, non-negative scalar density for atomic number 4 and
    excludes neutral beryllium unless a separate neutral-density quantity is specified.


    When individual charge states are not represented separately, the ion density
    is the sum over the bound-electron charge states of beryllium ions:


    $$

    n_{\mathrm{Be},\mathrm{tgt}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+},\mathrm{tgt}}

    $$


    where $n_{\mathrm{Be},\mathrm{tgt}}$ is the beryllium ion number density at the
    divertor target, $n_{\mathrm{Be}^{q+},\mathrm{tgt}}$ is the partial number density
    in m$^{-3}$ of ions in charge state Be$^{q+}$, and $q$ is the charge-state index;
    an ion in charge state $q$ carries charge $+q e$, with $e$ the elementary charge.
    The neutral state Be$^{0}$ is not included in this sum.


    In practice this quantity is inferred from beryllium line emission together with
    atomic population modeling, from impurity transport modeling constrained by edge
    and divertor measurements, or from edge-plasma simulations that evolve species-resolved
    ion densities. It is a beryllium-specific component of the local divertor-target
    ion population and should be interpreted relative to [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    when assessing impurity concentration.


    Typical absolute values are strongly dependent on wall material, erosion and recycling
    conditions, ionization balance, and divertor plasma state, so no device-independent
    numerical range is implied by the definition. Under trace-impurity conditions
    $n_{\mathrm{Be},\mathrm{tgt}}$ is much smaller than the total target ion density;
    in all cases it is constrained to be non-negative and not larger than the local
    total ion density. Related beryllium-density quantities include [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    [beryllium_density_at_limiter](name:beryllium_density_at_limiter), [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    and [line_averaged_beryllium_density](name:line_averaged_beryllium_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:boron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_pedestal
  - name:beryllium_density_at_limiter
  sources:
