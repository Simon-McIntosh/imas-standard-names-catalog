- name: wave_magnetic_field
  kind: scalar
  status: draft
  description: Oscillatory magnetic-field perturbation carried by a coherent electromagnetic
    wave propagating in a magnetized plasma, as computed in full-wave simulations
    of RF heating and current-drive systems.
  documentation: "The wave magnetic field $\\mathbf{B}_w$ is the oscillatory magnetic\
    \ component of a coherent electromagnetic wave \u2014 such as those used in electron\
    \ cyclotron, ion cyclotron, or lower-hybrid heating and current drive \u2014 propagating\
    \ within a magnetized plasma. It represents a small perturbation superimposed\
    \ on the much larger equilibrium confinement field $\\mathbf{B}_0$ that provides\
    \ plasma confinement.\n\nIn full-wave treatment of plasma-wave interactions, $\\\
    mathbf{B}_w$ is related to the wave electric field $\\mathbf{E}_w$ through Faraday's\
    \ induction law:\n\n$$\n\\mathbf{B}_w = -\\frac{1}{i\\omega} \\nabla \\times \\\
    mathbf{E}_w\n$$\n\nwhere $\\omega$ is the angular wave frequency. The field is\
    \ decomposed in field-aligned coordinates into three projections: the component\
    \ parallel to the local equilibrium field (see [parallel_wave_magnetic_field](name:parallel_wave_magnetic_field)),\
    \ a component normal to the local flux surface, and a binormal component.\n\n\
    Full-wave simulations compute $\\mathbf{B}_w$ by solving Maxwell's equations self-consistently\
    \ with the plasma dielectric tensor on a spatial grid covering the plasma volume.\
    \ Together with the wave electric field, $\\mathbf{B}_w$ determines electromagnetic\
    \ power flow via the Poynting vector $\\mathbf{S} = \\mathbf{E}_w \\times \\mathbf{B}_w\
    \ / \\mu_0$, where $\\mu_0$ is the permeability of free space; this Poynting flux\
    \ is closely related to [toroidal_wave_electric_field](name:toroidal_wave_electric_field)\
    \ for toroidally propagating modes. Typical wave magnetic field amplitudes in\
    \ RF heating scenarios satisfy $|\\mathbf{B}_w| / B_0 \\ll 1$, commonly in the\
    \ range $10^{-4}$\u2013$10^{-2}$ in the plasma core."
  unit: T
  physics_domain: auxiliary_heating
  links:
  - name:parallel_wave_magnetic_field
  - name:toroidal_wave_electric_field
  arguments:
  - name: magnetic_field
    operator: wave
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/full_wave/b_field/normal/values
    dd_path: waves/coherent_wave/full_wave/b_field/normal/values
    status: composed
- name: parallel_wave_magnetic_field
  kind: scalar
  status: draft
  description: Signed scalar projection of the electromagnetic wave magnetic-field
    perturbation along the local equilibrium magnetic-field direction. It is a field
    component in tesla, not a magnitude, RMS amplitude, or unspecified complex phasor;
    real- or imaginary-part quantities are named explicitly.
  documentation: 'Parallel wave magnetic field is the field-aligned component of the
    magnetic perturbation associated with an electromagnetic wave in a magnetized
    plasma. Parallel means along the local equilibrium magnetic field, not necessarily
    along the wave vector or any coordinate direction. The quantity is a signed component
    of the physical perturbation field.


    The signed component is defined by projecting the wave magnetic-field perturbation
    onto the local equilibrium field direction:


    $$

    B_{\parallel,\mathrm{w}} = \delta\mathbf{B}_{\mathrm{w}} \cdot \hat{b}_0

    $$


    where $B_{\parallel,\mathrm{w}}$ is in tesla, $\delta\mathbf{B}_{\mathrm{w}}$
    is the wave magnetic-field perturbation in tesla, and $\hat{b}_0 = \mathbf{B}_0/|\mathbf{B}_0|$
    is the dimensionless unit vector along the local equilibrium magnetic field $\mathbf{B}_0$.


    Frequency-domain wave fields are often represented by a complex phasor with physical
    field convention $\delta\mathbf{B}_{\mathrm{w}}(t)=\mathrm{Re}[\tilde{\mathbf{B}}_{\mathrm{w}}\exp(-i\omega
    t)]$. Under such a convention, explicitly named real-part or imaginary-part quantities
    refer to components of the phasor; this unqualified quantity denotes the signed
    physical parallel component and should not be interpreted as $|\tilde{B}_{\parallel,\mathrm{w}}|$,
    an RMS value, or a polarization-normalized amplitude.


    In practice, it is obtained from electromagnetic wave calculations or phase-sensitive
    magnetic measurements by resolving the perturbation along $\hat{b}_0$ determined
    from the equilibrium magnetic field. It characterizes field-aligned wave polarization
    and complements normal magnetic-field projections such as [wave_magnetic_field](name:wave_magnetic_field);
    analogous electric-field projections include [parallel_wave_electric_field_imaginary_part](name:parallel_wave_electric_field_imaginary_part)
    and [parallel_electric_field](name:parallel_electric_field).


    Representative magnitudes in linear auxiliary-heating wave calculations are often
    $10^{-7}$-$10^{-3}$ T in the confined plasma, with values scaling with the source
    or launched-power normalization and potentially larger in near-field regions.
    Because this is a signed component, it can pass through zero and reverse sign
    with wave phase or polarization.


    Sign convention: Positive when $\delta\mathbf{B}_{\mathrm{w}}$ has a component
    in the direction of the local equilibrium magnetic-field unit vector $\hat{b}_0$.'
  unit: T
  physics_domain: auxiliary_heating
  links:
  - name:wave_magnetic_field
  - name:per_toroidal_mode_thermal_ion_power_density
  - name:per_toroidal_mode_thermal_electron_power
  arguments:
  - name: wave_magnetic_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:waves/coherent_wave/full_wave/b_field/parallel/values
    dd_path: waves/coherent_wave/full_wave/b_field/parallel/values
    status: composed
