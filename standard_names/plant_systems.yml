    enhanced_context:
      description: Xenon.
      kind: template
- name: y_major_axis_unit_vector_of_shatter_cone
  kind: scalar
  status: active
  description: Y component of the shatter-cone major-axis unit vector, resolved in
    the right-handed Cartesian (x, y, z) frame.
  documentation: 'The major-axis unit vector $\hat{e}_\mathrm{maj}$ defines the orientation
    of the principal semiaxis of the elliptic shatter cone in a shattered pellet injector.
    This component is the projection $\hat{e}_{\mathrm{maj},y} = \hat{e}_\mathrm{maj}
    \cdot \hat{y}$ onto the Cartesian $y$-axis of the right-handed $(x, y, z)$ frame,
    where $\hat{y}$ is the unit vector in the $y$-direction.


    Together with the [X component](name:x_major_axis_unit_vector_of_shatter_cone)
    and the [Z component](name:z_major_axis_unit_vector_of_shatter_cone), this component
    fully specifies the direction of the shatter-cone major axis in three-dimensional
    space. The three Cartesian components satisfy the normalization identity $(\hat{e}_{\mathrm{maj},x})^2
    + (\hat{e}_{\mathrm{maj},y})^2 + (\hat{e}_{\mathrm{maj},z})^2 = 1$. The major
    axis is geometrically distinct from, and orthogonal to, the minor axis described
    by [y_minor_axis_unit_vector_of_shatter_cone](name:y_minor_axis_unit_vector_of_shatter_cone).'
  unit: '1'
  physics_domain: plant_systems
  links:
