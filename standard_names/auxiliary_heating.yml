- name: per_toroidal_mode_of_fast_electron_wave_absorbed_power
  kind: scalar
  status: draft
  description: Wave power absorbed by the fast (suprathermal) electron population
    from a coherent wave, resolved per toroidal mode number and integrated over the
    total plasma volume.
  documentation: The fast electron population acquires energy from a coherent wave
    through resonant processes such as electron Landau damping and transit-time magnetic
    pumping. Resolving this absorption per toroidal mode number $n_\phi$ reveals which
    spectral components of the wave field drive the suprathermal electron distribution,
    governed by the resonance condition $\omega - n_\phi \Omega_{\phi} - k_\parallel
    v_\parallel = 0$, where $\omega$ is the wave angular frequency, $\Omega_{\phi}$
    is the toroidal transit frequency, $k_\parallel$ is the parallel wavenumber, and
    $v_\parallel$ is the particle velocity along the field line. Summing over all
    toroidal mode numbers recovers the total volume-integrated quantity [fast_electron_wave_absorbed_power](name:fast_electron_wave_absorbed_power).
    The mode-resolved power is computed in wave-kinetic or full-wave codes that perform
    a Fourier decomposition in the toroidal angle $\phi$; typical values for electron-cyclotron
    or lower-hybrid heating scenarios range from tens of kilowatts to several megawatts
    per dominant mode in present tokamaks. The cumulative analog enclosed within a
    given flux surface is provided by [per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface),
    while the corresponding thermal-electron counterpart is [per_toroidal_mode_of_thermal_electron_wave_absorbed_power](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power)
    and the fast-ion analog is [per_toroidal_mode_of_fast_ion_wave_absorbed_power](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power).
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_wave_absorbed_power
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power
  - name:per_toroidal_mode_of_fast_ion_wave_absorbed_power
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/global_quantities/electrons/power_fast_n_phi
    dd_path: waves/coherent_wave/global_quantities/electrons/power_fast_n_phi
    status: composed
