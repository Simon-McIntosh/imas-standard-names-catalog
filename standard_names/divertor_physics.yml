- name: effective_charge_at_divertor_target
  kind: scalar
  status: active
  description: Effective ionic charge of the plasma immediately upstream of a divertor-target
    sheath, combining all positive ion species through charge moments.
  documentation: 'Effective charge at a divertor target is the local charge-squared-weighted
    ionic content of the plasma adjacent to the target, evaluated at the sheath entrance.
    It characterizes impurity content relative to the total positive charge density.


    $$

    Z_{\mathrm{eff}} = \frac{\sum_i n_i Z_i^2}{\sum_i n_i Z_i}

    $$


    where $n_i$ is the local number density of positive-ion species $i$ and $Z_i$
    is its positive integer charge state. The sums include all positive ion species
    and charge states represented in the local plasma. The quantity equals unity for
    a pure singly charged hydrogenic plasma and increases when higher-charge ions
    contribute.


    This effective-charge interpretation is the charge-moment form of [charge at the
    divertor target](name:charge_at_divertor_target), with the same target-local plasma
    scope; it is not a density or a charge-state-specific abundance.'
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:charge_at_divertor_target
  arguments:
  - name: charge_at_divertor_target
    operator: effective
    operator_kind: qualifier
