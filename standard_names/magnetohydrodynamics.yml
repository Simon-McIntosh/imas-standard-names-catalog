- name: ratio_of_upper_bound_plasma_current_to_initial_plasma_current_due_to_disruption
  kind: scalar
  status: draft
  description: User-defined dimensionless upper fractional threshold X2 of the pre-disruption
    plasma current, specifying the higher-current bound for computing the linear decay
    time during a disruption current quench.
  documentation: "This dimensionless ratio represents the upper boundary $X_2$ of\
    \ the plasma current fraction $I_p / I_{p,0}$, where $I_{p,0}$ is the pre-disruption\
    \ initial plasma current, selecting the higher-current end of the interval used\
    \ to characterize the approximately linear phase of the plasma current quench\
    \ during a disruption.\n\nTogether with the lower fractional threshold plasma_lower_fraction_due_to_disruption,\
    \ $X_2$ defines the custom linear plasma current decay time via:\n\n$$\n\\tau_{\\\
    rm lin} = \\frac{t(X_2) - t(X_1)}{X_1 - X_2}\n$$\n\nwhere $t(X_2)$ and $t(X_1)$\
    \ are the times at which $I_p$ passes through fractions $X_2$ and $X_1$ of $I_{p,0}$,\
    \ respectively. Because the current decreases during the quench, $t(X_2) < t(X_1)$\
    \ and $X_1 < X_2$, ensuring the resulting linear_plasma_current_decay_time_due_to_disruption\
    \ is positive. The constraint $X_1 < X_2 \\leq 1$ must always hold; values of\
    \ $X_2$ in the range 0.5\u20130.9 are common so as to capture the roughly linear\
    \ portion of the current ramp-down while avoiding the initial non-linear onset.\
    \ The $(X_1, X_2)$ pair should be documented alongside any reported decay time\
    \ to ensure reproducibility across analyzes comparing different disruption databases\
    \ or against plasma_decay_time from exponential fits."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links: []
  sources:
