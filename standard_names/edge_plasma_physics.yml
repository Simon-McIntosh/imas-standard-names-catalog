- name: parallel_ion_energy_flux
  kind: scalar
  status: draft
  description: Parallel projection of the ion energy flux along the magnetic field
    direction.
  documentation: The parallel ion energy flux $Q_{\parallel,i} = \mathbf{Q}_i \cdot
    \hat{b}$ represents the component of the total ion energy flux vector (thermal
    plus kinetic) projected onto the magnetic field unit vector $\hat{b}$. This quantity
    governs energy transport along field lines in the edge plasma, where parallel
    transport dominates due to high magnetic field-aligned conductivity. In the scrape-off
    layer, $Q_{\parallel,i}$ determines the heat flux deposited on divertor targets,
    with typical values ranging from 1$\,\mathrm{MW\,m^{-2}}$ to 10$\,\mathrm{MW\,m^{-2}}$
    in high-power tokamaks. It is routinely inferred from upstream profile measurements
    combined with two-point SOL models, or directly from Langmuir probe and infrared
    camera data. The total parallel energy transport is described by [parallel_total_ion_energy_flux](name:parallel_total_ion_energy_flux),
    which sums over all charge states, while the full energy flux vector is given
    by [ion_energy_flux](name:ion_energy_flux). For neutral species, the analogous
    quantity is [parallel_neutral_energy_flux](name:parallel_neutral_energy_flux).
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_total_ion_energy_flux
  - name:ion_energy_flux
  - name:parallel_neutral_energy_flux
  arguments:
  - name: ion_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/energy/flux_parallel/values
    dd_path: edge_transport/model/ggd/ion/energy/flux_parallel/values
    status: composed
- name: parallel_neutral_diamagnetic_velocity
  kind: scalar
  status: draft
  description: Parallel component of the diamagnetic drift velocity for neutral particles,
    defined on the generalized grid in the edge plasma.
  documentation: 'The parallel neutral diamagnetic velocity is the projection of the
    neutral diamagnetic drift vector onto the direction of the magnetic field. For
    neutral particles, the diamagnetic drift is not a guiding-center drift as for
    charged species but arises from collisional momentum exchange with the ion fluid
    that carries the diamagnetic current. The parallel component is defined as $v_{\parallel,\,\mathrm{dia}}^{\mathrm{n}}
    = \mathbf{v}_{\mathrm{dia}}^{\mathrm{n}} \cdot \hat{b}$, where $\hat{b} = \mathbf{B}/|\mathbf{B}|$
    is the unit vector along the magnetic field and $\mathbf{v}_{\mathrm{dia}}^{\mathrm{n}}$
    is the neutral diamagnetic velocity. This quantity is typically computed from
    fluid or kinetic transport models on unstructured grids and provides the neutral
    contribution to parallel momentum transport in the edge and scrape-off layer.


    Sign convention: Positive when the parallel component of the neutral diamagnetic
    velocity points in the direction of the magnetic field $\mathbf{B}$.


    Cross-reference with [neutral_diamagnetic_velocity](name:neutral_diamagnetic_velocity)
    for the full vector quantity and with [parallel_ion_diamagnetic_velocity](name:parallel_ion_diamagnetic_velocity)
    for the charged-species counterpart.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_diamagnetic_velocity
  - name:parallel_ion_diamagnetic_velocity
  arguments:
  - name: neutral_diamagnetic_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/neutral/state/velocity_diamagnetic/parallel
    dd_path: edge_profiles/ggd/neutral/state/velocity_diamagnetic/parallel
    status: composed
- name: parallel_neutral_energy_flux
  kind: scalar
  status: draft
  description: Parallel (field-aligned) component of the thermal energy flux carried
    by neutral particles in the edge plasma.
  documentation: "The parallel neutral energy flux $Q_{\\parallel,\\mathrm{n}}$ is\
    \ the projection of the total neutral thermal energy flux vector $\\mathbf{Q}_{\\\
    mathrm{n}}$ onto the magnetic field direction $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$,\
    \ i.e. $Q_{\\parallel,\\mathrm{n}} = \\mathbf{Q}_{\\mathrm{n}} \\cdot \\hat{b}$.\
    \ This quantity quantifies the rate of thermal energy transport by neutral atoms\
    \ and molecules along the magnetic field, a key channel for heat transport in\
    \ the scrape-off layer and divertor region where neutral densities are elevated.$Q_{\\\
    parallel,\\mathrm{n}}$ is typically an output of edge-plasma transport codes such\
    \ as SOLPS or included in the neutral particle model component of integrated modeling\
    \ frameworks. It is distinguished from the total neutral energy flux by its alignment\
    \ to the field and from the charge-state-specific flux by aggregating over all\
    \ neutral charge states. Typical values in the divertor region can range from\
    \ 0.1\u201310 MW m$^{-2}$, depending on the neutral density and temperature. See\
    \ also the total [neutral_energy_flux](name:neutral_energy_flux), the charge-state-specific\
    \ [parallel_neutral_state_energy_flux](name:parallel_neutral_state_energy_flux),\
    \ and the electron counterpart [parallel_electron_energy_flux](name:parallel_electron_energy_flux)."
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_energy_flux
  - name:parallel_neutral_state_energy_flux
  - name:parallel_electron_energy_flux
  arguments:
  - name: neutral_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/energy/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/energy/flux_parallel/values
    status: composed
- name: parallel_neutral_momentum_flux
  kind: scalar
  status: draft
  description: Parallel projection of the neutral particle momentum flux onto the
    magnetic field direction in the edge plasma.
  documentation: "This quantity represents the component of the neutral momentum flux\
    \ directed along the magnetic field lines, denoted $\\Gamma_{n,\\|} = \\Pi_n \\\
    cdot \\hat{b}$, where $\\Pi_n$ is the neutral momentum flux density tensor and\
    \ $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along the magnetic\
    \ field. The parallel neutral momentum flux governs the toroidal and poloidal\
    \ flow of neutral particles in the edge region and is essential for understanding\
    \ momentum transport from the core to the scrape-off layer (SOL). It is a key\
    \ term in the neutral momentum balance equation, coupling the neutral population\
    \ to the ion and electron fluids through charge-exchange and ionization collisions.\
    \ Typical magnitudes in the SOL of a diverted tokamak range from 10$^{-3}$ to\
    \ 1 kg\xB7m$^{-1}$\xB7s$^{-2}$ depending on the neutral density and flow velocity.\
    \ This quantity is computed self-consistently in edge transport codes (e.g., SOLPS,\
    \ EMC3-EIRENE) and is closely related to the [parallel_ion_momentum_flux](name:parallel_ion_momentum_flux)\
    \ for the ion channel and the total [parallel_momentum_flux](name:parallel_momentum_flux).\
    \ The parent quantity is [neutral_momentum_flux](name:neutral_momentum_flux);\
    \ the parallel component isolates the field-aligned contribution from the full\
    \ tensor."
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_ion_momentum_flux
  - name:parallel_momentum_flux
  - name:neutral_momentum_flux
  arguments:
  - name: neutral_momentum_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/momentum/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/momentum/flux_parallel/values
    status: composed
  - id: dd:edge_transport/model/ggd/neutral/state/momentum/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/state/momentum/flux_parallel/values
    status: composed
- name: parallel_neutral_state_energy_flux
  kind: scalar
  status: draft
  description: Parallel thermal energy flux carried by neutral particles in a given
    charge state along the magnetic field.
  documentation: This quantity describes the component of the neutral charge-state
    energy flux projected onto the direction parallel to the equilibrium magnetic
    field line, $Q_{\|,n}^{(\mathrm{state})} = \mathbf{Q}_{n}^{(\mathrm{state})} \cdot
    \hat{b}$, where $\mathbf{Q}_{n}^{(\mathrm{state})}$ is the energy flux of neutrals
    in a specific charge state and $\hat{b}$ is the unit vector along $\mathbf{B}$.
    It quantifies the thermal energy carried along field lines by neutral particles
    undergoing charge-exchange and elastic collisions, which is important for modeling
    edge transport and recycling. Typical magnitudes in the scrape-off layer of diverted
    tokamaks range from $0.1\,\text{kW}\,$ to $10\,\text{kW}\,$ per unit area, depending
    on the neutral density and temperature. The quantity is the parallel component
    of [neutral_state_energy_flux](name:neutral_state_energy_flux) and is related
    to the total neutral energy transport via [parallel_neutral_energy_flux](name:parallel_neutral_energy_flux),
    which sums over all charge states.
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_energy_flux
  - name:parallel_neutral_energy_flux
  arguments:
  - name: neutral_state_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/energy/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/state/energy/flux_parallel/values
    status: composed
- name: parallel_total_ion_energy_flux
  kind: scalar
  status: draft
  description: Projection of the total energy flux from all ion species along the
    magnetic field direction, combining thermal and kinetic contributions.
  documentation: The parallel total ion energy flux $q_{i\parallel}^{\text{tot}}$
    represents the component of the summed ion energy flux vector parallel to the
    equilibrium magnetic field. It is the sum $q_{i\parallel}^{\text{tot}} = \sum_s
    \left( q_{i s,\parallel}^{\text{th}} + q_{i s,\parallel}^{\text{kin}} \right)$
    over all ion species $s$, where $q_{i s,\parallel}^{\text{th}}$ is the thermal
    (conductive) energy flux and $q_{i s,\parallel}^{\text{kin}}$ is the kinetic (convective)
    energy flux carried by the ion flow. This quantity is the parallel component of
    [total_ion_energy_flux](name:total_ion_energy_flux) and is central to scrape-off
    layer and divertor transport modeling, where the ion channel can carry a significant
    fraction of the power along the field line. Typical values in the SOL of a divertor
    tokamak range from 0.1 to 10 MW/m$^{-2}$, depending on the upstream density and
    heating power. The measurement or simulation of this flux requires resolving both
    the thermal pressure gradient and the parallel ion flow, often from kinetic or
    fluid transport codes that treat each charge state separately before summing.
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_energy_flux
  arguments:
  - name: total_ion_energy_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/total_ion_energy/flux_parallel/values
    dd_path: edge_transport/model/ggd/total_ion_energy/flux_parallel/values
    status: composed
- name: poloidal_anomalous_current_density
  kind: scalar
  status: draft
  description: Poloidal component of the anomalous current density, representing the
    non-classical turbulent contribution to the poloidal current in the edge plasma.
  documentation: 'The poloidal anomalous current density $j_{\theta}^{\mathrm{anom}}$
    is the projection of the anomalous current density vector onto the poloidal direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame. This component captures
    the turbulent non-classical current contribution driven by drift-wave or interchange
    instabilities, which is distinct from the collisional (Spitzer) and neoclassical
    current components. In the scrape-off layer, the poloidal anomalous current density
    can influence the radial electric field and poloidal flow damping, affecting edge
    turbulence saturation levels. Typical values in L-mode edge plasmas range from
    $10^3$ to $10^5$ A/m$^2$, depending on fluctuation amplitudes and the local plasma
    gradients. This quantity is linked to the full anomalous current density vector
    via the parent quantity `[anomalous_current_density](name:anomalous_current_density)`
    and is complemented by the `[toroidal_anomalous_current_density](name:toroidal_anomalous_current_density)`
    and `[radial_anomalous_current_density](name:radial_anomalous_current_density)`
    components.


    Sign convention: Positive when the current density points in the direction of
    increasing poloidal angle $\theta$ in the right-handed $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:anomalous_current_density
  - name:toroidal_anomalous_current_density
  - name:radial_anomalous_current_density
  arguments:
  - name: anomalous_current_density
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/j_anomalous/poloidal
    dd_path: edge_profiles/ggd/j_anomalous/poloidal
    status: composed
- name: poloidal_conductivity
  kind: scalar
  status: draft
  description: Poloidal component of the anisotropic electrical conductivity tensor,
    relating the poloidal current density to the poloidal electric field in a plasma.
    It describes the ability of the plasma to conduct electric current in the poloidal
    direction.
  documentation: "The poloidal conductivity $\\sigma_{\\theta\\theta}$ is the diagonal\
    \ element of the conductivity tensor corresponding to the poloidal direction.\
    \ In magnetized plasmas, the conductivity is highly anisotropic: the conductivity\
    \ parallel to the magnetic field is orders of magnitude larger than the perpendicular\
    \ (radial) conductivity. The poloidal component $\\sigma_{\\theta\\theta}$ connects\
    \ the poloidal electric field component $E_\\theta$ to the poloidal current density\
    \ $j_\\theta$ via Ohm's law, $j_\\theta = \\sigma_{\\theta\\theta} E_\\theta +\
    \ \\sigma_{\\theta\\phi} E_\\phi + \\sigma_{\\theta\\psi} E_\\psi$, where $\\\
    sigma_{\\theta\\phi}$ and $\\sigma_{\\theta\\psi}$ are off-diagonal Hall and Pfirsch-Schl\xFC\
    ter terms. Typical values for the poloidal conductivity in tokamak edge plasmas\
    \ range from 10^3 to 10^6 S/m (mho/m), depending on electron temperature and density\
    \ profiles. The poloidal conductivity is relevant for modeling current drive,\
    \ neoclassical transport, and MHD stability in the plasma edge. It is measured\
    \ indirectly through probe arrays or inferred from equilibrium reconstructions.\n\
    \nSign convention: Positive when the poloidal current density $j_\\theta$ flows\
    \ in the direction of increasing poloidal angle $\\theta$ for a given poloidal\
    \ electric field $E_\\theta$."
  unit: m^-1.ohm^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_conductivity
  - name:radial_conductivity
  arguments:
  - name: conductivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/conductivity/poloidal
    dd_path: edge_transport/model/ggd/conductivity/poloidal
    status: composed
- name: poloidal_electric_field
  kind: scalar
  status: draft
  description: Projection of the electric field vector onto the poloidal direction,
    given by $E_\theta = -\nabla_\theta \Phi$ from the electrostatic potential.
  documentation: 'The poloidal electric field is the component of the electric field
    vector resolved along the poloidal coordinate $\theta$ on a flux surface. It is
    defined as the negative gradient of the electrostatic potential $\Phi$ in the
    poloidal direction: $E_\theta = -\frac{1}{R \left| \nabla \theta \right|} \frac{\partial
    \Phi}{\partial \theta}$, where $R$ is the major radius. This field is crucial
    for driving poloidal particle drifts, affecting impurity transport, and determining
    the radial electric field through the force balance equation $E_r = v_\theta B_\phi
    - v_\phi B_\theta + \frac{1}{Z_i e n_i} \nabla_r p_i$. Typical edge values range
    from 0.1 to 10 kV/m in H-mode pedestals, measured indirectly via Doppler backscattering
    or inferred from charge exchange recombination spectroscopy. See also the toroidal
    counterpart [toroidal_electric_field](name:toroidal_electric_field) and the governing
    relation with [poloidal_magnetic_field](name:poloidal_magnetic_field) in the radial
    force balance.


    Sign convention: Positive when $E_\theta$ points in the direction of increasing
    poloidal angle $\theta$.'
  unit: V.m^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_electric_field
  - name:poloidal_magnetic_field
  arguments:
  - name: electric_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_profiles/profiles_1d/e_field/poloidal
    dd_path: edge_profiles/profiles_1d/e_field/poloidal
    status: composed
- name: poloidal_electron_beta_at_pedestal_top
  kind: scalar
  status: draft
  description: Ratio of electron thermal pressure to poloidal magnetic field pressure,
    evaluated at the top of the pedestal region where the pressure gradient is maximal.
  documentation: 'The poloidal electron beta at the pedestal top is defined as:


    $$

    \beta_{\theta, e}^{\text{ped}} = \frac{2 \mu_0 p_e}{B_{\theta}^2}

    $$


    where $\mu_0 = 4\pi \times 10^{-7} \: \mathrm{H \, m^{-1}}$ is the permeability
    of free space, $p_e$ is the electron thermal pressure (in Pa), and $B_{\theta}$
    is the poloidal magnetic field magnitude (in T). The quantity is evaluated at
    the top of the pedestal, i.e., at the radial location where the electron pressure
    gradient is maximal in the edge transport barrier. The radial coordinate used
    in the evaluation is the normalized poloidal flux $\psi_N$, as defined by the
    IMAS flux convention. Typical values in H-mode plasmas range from $10^{-3}$ to
    $10^{-1}$.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_electron_pressure
  - name:poloidal_magnetic_field
  - name:poloidal_magnetic_flux_at_separatrix
  - name:electron_temperature_at_pedestal_top
  sources:
  - id: dd:summary/pedestal_fits/linear/beta_pol_pedestal_top_electron_lfs/value
    dd_path: summary/pedestal_fits/linear/beta_pol_pedestal_top_electron_lfs/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/beta_pol_pedestal_top_electron_lfs/value
    dd_path: summary/pedestal_fits/mtanh/beta_pol_pedestal_top_electron_lfs/value
    status: composed
- name: poloidal_electron_convection_velocity
  kind: scalar
  status: draft
  description: Poloidal component of the effective convective velocity for electron
    particle transport, representing the poloidal advection of the electron density
    profile.
  documentation: 'The poloidal electron convection velocity is the poloidal component
    $v_{\theta,e}^{\text{conv}}$ of the effective velocity field that advects electron
    density in the particle transport equation. In the continuity equation $\partial_t
    n_e + \nabla \cdot (n_e \mathbf{v}^{\text{conv}}_e) = S_e$, this poloidal component
    governs cross-field transport in the poloidal direction. It is typically inferred
    from transport modeling on unstructured edge grids, complementing the total velocity
    $[\text{electron\_convection\_velocity}](name:electron_convection_velocity)$.
    In the edge plasma, poloidal convective velocities are often on the order of 1-100
    m/s, significantly smaller than the toroidal flow but critical for determining
    density profiles and pedestal structure.


    Sign convention: Positive when the poloidal component points in the direction
    of increasing poloidal angle $\theta$.


    Cross-reference the total vector via $[\text{electron\_convection\_velocity}](name:electron_convection_velocity)$
    and the corresponding ion quantity $[\text{poloidal\_ion\_velocity\_due\_to\_convection}](name:poloidal_ion_velocity_due_to_convection)$
    for comparison of species-dependent convection.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_convection_velocity
