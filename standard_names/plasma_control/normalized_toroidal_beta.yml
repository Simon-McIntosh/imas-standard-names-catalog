name: normalized_toroidal_beta
status: draft
cocos_transformation_type: one_like
description: Dimensionless figure of merit $\beta_N = 100 \, \beta_t \, a B_0 / I_p$
  that scales out plasma size, field, and current to assess proximity to ideal-MHD
  stability limits.
documentation: "The normalized toroidal beta is defined as $\\beta_N = 100 \\, \\\
  beta_t \\, a \\, B_0 / I_p$, where $\\beta_t = 2 \\mu_0 \\langle p \\rangle / B_0^2$\
  \ is the volume-averaged toroidal beta (dimensionless), $\\langle p \\rangle$ is\
  \ the volume-averaged plasma pressure (Pa), $a$ is the plasma minor radius (m),\
  \ $B_0$ is the vacuum toroidal magnetic field on axis (T), and $I_p$ is the plasma\
  \ current (MA). The Troyon scaling law establishes that ideal-MHD ballooning and\
  \ external kink modes limit $\\beta_N \\lesssim 2.8$\u2013$3.5$ in conventional\
  \ tokamak scenarios; advanced-tokamak and hybrid regimes with wall stabilization\
  \ and tailored current profiles can push toward $\\beta_N \\approx 4$\u2013$5$.\
  \ It is computed from equilibrium reconstruction combined with kinetic profile data,\
  \ and real-time estimates serve as input to the plasma control system to avoid disruption-triggering\
  \ $\\beta$ limits. $\\beta_N$ is one of the key performance metrics for reactor\
  \ design: ITER targets $\\beta_N \\approx 1.8$ in its baseline scenario. See also\
  \ `normalized_beta` for the related poloidal definition and `plasma_stored_energy`\
  \ which enters through $\\langle p \\rangle$."
