    dd_path: spi/injector/shatter_cone/origin/z
    status: composed
- name: vertical_coordinate_of_shattered_pellet_fragment_position
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of the center-of-mass position of a shattered
    pellet fragment in the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$
