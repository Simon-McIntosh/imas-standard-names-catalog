- name: z_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Vertical component of the unit direction vector that encodes the instantaneous
    movement direction of the steerable EC launcher mirror in the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame, where $\hat{z}$ is aligned with the machine
    vertical axis $Z$.
  documentation: 'The Z-component $d_z$ of the [direction unit vector of the EC launcher
    mirror](name:direction_unit_vector_of_electron_cyclotron_launcher_mirror) specifies
    how much of the mirror''s instantaneous movement direction projects onto the vertical
    axis $\hat{z}$ of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame,
    where $\hat{z}$ coincides with the machine vertical direction. Because the parent
    vector is a unit vector by construction, the three Cartesian components satisfy
    $d_x^2 + d_y^2 + d_z^2 = 1$, so $d_z \in [-1, 1]$. A value of $d_z = \pm 1$ indicates
    purely vertical mirror movement, while $d_z = 0$ means the movement lies entirely
    in the horizontal plane. This component, together with [x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    and [y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror](name:y_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror),
    fully resolves the mirror movement direction needed for beam-steering calculations
    in electron cyclotron heating and current drive systems. The direction vector
    is typically obtained from launcher geometry specifications or actuator kinematics
    models and is used in ray-tracing and beam-tracing codes to propagate the injected
    microwave beam trajectory through the plasma.


    Sign convention: Positive when the mirror movement direction has a component in
    the $+\hat{z}$ direction (upward, toward increasing $Z$).'
  unit: '1'
  physics_domain: auxiliary_heating
