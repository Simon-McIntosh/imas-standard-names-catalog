name: wave_driven_toroidal_current_per_toroidal_mode
status: draft
description: Toroidal current driven by a coherent wave in the plasma, resolved per
  toroidal mode number $n_\phi$.
documentation: "The wave-driven toroidal current $I_{\\phi}(n_\\phi)$ quantifies the\
  \ net toroidal plasma current generated by momentum transfer from a coherent radio-frequency\
  \ or microwave wave to resonant charged particles, decomposed by toroidal mode number\
  \ $n_\\phi$. This quantity is typically obtained from a stand-alone wave solver\
  \ (e.g., TORIC, AORSA, GENRAY/CQL3D) and represents the global (volume-integrated)\
  \ current contribution of each launched toroidal harmonic. Summing over all $n_\\\
  phi$ yields the total wave-driven toroidal current. For electron cyclotron current\
  \ drive (ECCD) scenarios, individual mode contributions are on the order of 1\u2013\
  100 kA depending on injected power and plasma parameters. Because this is a stand-alone\
  \ calculation, it may not be self-consistent with the equilibrium current profile.\
  \ See also the radial profile counterpart `wave_driven_toroidal_current_inside_flux_surface_per_toroidal_mode`\
  \ and the absorbed power sibling `electron_wave_heating_power_per_toroidal_mode`."
