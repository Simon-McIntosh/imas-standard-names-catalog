- name: radial_force_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Signed radial component of the net electromagnetic Lorentz force on
    an individual poloidal-field coil, resolved along increasing major radius.
  documentation: 'The quantity is the net electromagnetic force on an individual poloidal-field
    coil projected onto the radial direction. It describes the resultant coil load,
    not the local electromagnetic body-force density.


    The radial force is defined by


    $$

    F_R = \int_{V_\mathrm{coil}} (\mathbf{J} \times \mathbf{B}) \cdot \hat{\mathbf{R}}\,dV

    $$


    where $V_\mathrm{coil}$ is the conductor volume, $\mathbf{J}$ is the current-density
    vector, $\mathbf{B}$ is the magnetic-field vector, $\hat{\mathbf{R}}$ is the radial
    unit vector, and $dV$ is the volume element. The radial and vertical components
    together determine the [electromagnetic force of a poloidal-field coil](name:force_of_poloidal_field_coil);
    the corresponding vertical component is given by the [vertical force of a poloidal-field
    coil](name:vertical_force_of_poloidal_field_coil). It is distinct from [radial
    volumetric force](name:radial_volumetric_force), which is a local force density
    rather than a net force.


    Sign convention: Positive when the force points toward increasing major radius
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:force_of_poloidal_field_coil
  - name:vertical_force_of_poloidal_field_coil
  - name:radial_volumetric_force
  sources:
  - dd_path: pf_active/coil/force_radial
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-force_radial
    dd_documentation:
      leaf: 'Radial force applied on this coil (positive when outwards) '
      parent_path: pf_active/coil
      parent: Active PF coils
      data_type: STRUCTURE
      unit: N
    enhanced_context:
      description: Radial force (F_R) applied on a poloidal field (PF) coil, with
        positive values indicating the outward (centrifugal) direction. A critical
        structural loading parameter for coil and support design assessment.
      kind: llm
- name: radial_magnetic_field_at_ferritic_element_centroid
