- name: total_ion_density
  kind: scalar
  status: draft
  description: Total number density of all ion species present in the plasma, summing
    over thermal and suprathermal populations.
  documentation: The total ion density $n_i$ is the sum of the number densities of
    every ion species, including both thermal and suprathermal (fast ion) populations,
    at each point in the plasma. It represents the total concentration of positively
    charged nuclei, which is balanced by electron density for overall charge neutrality.
    Typical values in fusion-grade devices range from $10^{19} \, \text{m}^{-3}$ in
    the edge to over $10^{20} \, \text{m}^{-3}$ at the core. This quantity is essential
    for calculating plasma pressure (with contributions from all species), neutral
    beam stopping, and fusion reaction rates. Measurements are often derived from
    interferometry, Thomson scattering, or charge-exchange recombination spectroscopy
    with known impurity composition.
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:total_ion_pressure
  - name:fast_ion_state_density
  - name:runaway_electron_density
  sources:
  - id: dd:mhd/ggd/n_i_total/values
    dd_path: mhd/ggd/n_i_total/values
    status: composed
- name: vertical_current_density
  kind: scalar
  status: draft
  description: Vertical (Z) component of the current density vector in the right-handed
    cylindrical (R, phi, Z) coordinate system.
  documentation: "The vertical current density $j_z$ is the $\\hat{Z}$ component of\
    \ the plasma current density vector in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ coordinate system. It represents the net electric current per unit area\
    \ flowing in the vertical direction, typically arising from poloidal currents\
    \ in the plasma equilibrium or from vertical instabilities. In a tokamak, $j_z$\
    \ is generally small compared to the toroidal component $j_\\phi$ but is essential\
    \ for determining the poloidal field and plasma shaping. Typical values range\
    \ from 0 to several MA\xB7m$^{-2}$ depending on the plasma configuration and current\
    \ drive. Measurement is obtained from magnetic probe arrays or reconstructed via\
    \ equilibrium codes such as EFIT.\n\nSign convention: Positive when the current\
    \ flows in the direction of increasing $Z$ (vertically upward).\n\nThe related\
    \ radial and toroidal components are documented under `name:radial_current_density`\
    \ and `name:toroidal_current_density`, respectively."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:current
  arguments:
  - name: current_density
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:mhd/ggd/j_z/values
    dd_path: mhd/ggd/j_z/values
    status: composed
- name: vertical_plasma_velocity
  kind: scalar
  status: draft
  description: Vertical (Z) component of the mass-center flow velocity of the bulk
    plasma in the cylindrical coordinate system.
  documentation: "The vertical plasma velocity $v_Z = \\mathbf{v}_\\text{total} \\\
    cdot \\hat{Z}$ is the projection of the mass-weighted, multi-species plasma flow\
    \ velocity onto the vertical axis of the cylindrical $(R, \\phi, Z)$ frame. It\
    \ captures the bulk plasma motion in the poloidal plane and is particularly significant\
    \ during vertical displacement events (VDEs) and in nonlinear MHD simulations\
    \ of disruptions.\n\nThe total plasma velocity from which this component derives\
    \ is defined as $\\mathbf{v}_\\text{total} = (\\sum_s n_s m_s \\mathbf{v}_s) /\
    \ (\\sum_s n_s m_s)$, summing over all species $s$ with density $n_s$, mass $m_s$,\
    \ and flow velocity $\\mathbf{v}_s$.\n\nTypical vertical velocities in steady-state\
    \ tokamak operation are small (order 10\u2013100 m/s), but during disruptions\
    \ and VDEs they can reach several hundred m/s, driving the plasma column vertically.\
    \ This quantity is commonly computed in MHD codes (e.g., JOREK, M3D-C1) and can\
    \ be inferred from measurements of the poloidal flow, combined with magnetic equilibrium\
    \ constraints.\n\nSign convention: Positive when the plasma flows in the +Z direction\
    \ (vertically upward).\n\nCross-reference the toroidal and radial counterparts:\
    \ [toroidal_plasma_velocity](name:toroidal_plasma_velocity) and [radial_plasma_velocity](name:radial_plasma_velocity),\
    \ as well as the parent vector [plasma_velocity](name:plasma_velocity)."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_plasma_velocity
  - name:radial_plasma_velocity
  - name:plasma_velocity
  arguments:
  - name: plasma_velocity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:mhd/ggd/velocity_z/values
    dd_path: mhd/ggd/velocity_z/values
    status: composed
