- name: major_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Magnetic axis location in the tokamak poloidal plane, defined by the
    major radius coordinate R_axis where the poloidal magnetic flux gradient vanishes.
  documentation: "$R_{\\mathrm{axis}}$ is the major radius $R$ of the magnetic axis\
    \ in the right-handed cylindrical $(R,\\phi,Z)$ frame, corresponding to the innermost\
    \ point of the nested flux-surface topology where $\\nabla\\psi = 0$ and the poloidal\
    \ magnetic field vanishes. In tokamak equilibrium reconstruction, $R_{\\mathrm{axis}}$\
    \ is found by locating the extremum of $\\psi$ and is constrained by magnetics\
    \ diagnostics, motional-Stark-effect measurements, and X-ray imaging. Typical\
    \ values range from 2.8\u20133.1\u202Fm (JET) to 6.2\u202Fm (ITER) and are correlated\
    \ with the plasma current centroid via $[current\\,center](name:major_radius_of_current_center)$\
    \ and the geometric axis via $[geometric\\,axis](name:major_radius_of_geometric_axis)$.\
    \ The vertical coordinate is given by $[Z_{\\mathrm{axis}}](name:vertical_coordinate_of_magnetic_axis)$.\n\
    \nSign convention: Positive when $R_{\\mathrm{axis}}$ lies radially outward from\
    \ the machine symmetry axis.\n\nSee also $[\\psi_{\\mathrm{axis}}](name:poloidal_magnetic_flux_at_magnetic_axis)$\
    \ for the flux reference."
  unit: m
  physics_domain: equilibrium
