name: electron_temperature_at_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Electron temperature evaluated at the magnetic axis, the innermost extremum
  of the poloidal flux where $\nabla \psi = 0$.
documentation: "The on-axis electron temperature $T_{e,0}$ (in eV) is the value of\
  \ the bulk electron temperature at the magnetic axis, defined as the point in the\
  \ poloidal cross-section where $\\nabla \\psi = 0$ and nested flux surfaces converge.\
  \ It characterizes the peak thermal energy of the electron population and is a key\
  \ figure of merit for confinement performance; typical values span 1\u201330 keV\
  \ in high-performance tokamak discharges and 0.5\u20135 keV during L-mode operation.\
  \ $T_{e,0}$ is obtained from Thomson scattering, electron cyclotron emission (ECE)\
  \ radiometry, or equilibrium-constrained profile fitting. The on-axis value directly\
  \ enters scaling-law analyses and is used to anchor kinetic profile reconstructions.\
  \ See also `electron_temperature` for the full radial profile and `electron_pressure`\
  \ via $p_e = n_e k_B T_e$."
