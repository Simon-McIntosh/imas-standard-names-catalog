- name: toroidal_flux_coordinate
  kind: scalar
  status: active
  description: Non-negative, radius-like label of a nested magnetic flux surface,
    derived from enclosed toroidal magnetic flux using a positive reference vacuum
    toroidal field.
  documentation: 'The toroidal flux coordinate is a non-negative, radius-like label
    assigned to each nested magnetic flux surface. It orders surfaces outward from
    the magnetic axis and approximates an effective minor radius without being a geometric
    distance.


    The coordinate is defined from the enclosed toroidal magnetic flux:


    $$

    \rho_{\rm tor} = \sqrt{\frac{\Phi_{\rm tor}}{\pi B_0}}

    $$


    where $\rho_{\rm tor}$ is the toroidal flux coordinate, $\Phi_{\rm tor}$ is the
    toroidal magnetic flux enclosed by the surface relative to the magnetic axis,
    $B_0$ is the positive reference vacuum toroidal magnetic field, and $\pi$ is the
    circle constant.


    The quantity applies to arbitrary nested magnetic flux surfaces, including the
    magnetic axis, internal characteristic surfaces, and the plasma boundary. Each
    value labels one surface; it has no species or population scope and involves no
    population summation, charge-state aggregation, or averaging convention. It is
    a flux-derived coordinate rather than a direct geometric minor-radius measurement.


    At the magnetic axis, the enclosed relative toroidal flux vanishes and the coordinate
    is zero. Evaluations at particular loci, such as the [toroidal flux coordinate
    at the plasma boundary](name:toroidal_flux_coordinate_at_plasma_boundary) and
    the [toroidal flux coordinate of the magnetic axis](name:toroidal_flux_coordinate_of_magnetic_axis),
    are instances of this same surface-labeling quantity. A [normalized toroidal flux
    coordinate at a measurement position](name:normalized_toroidal_flux_coordinate_at_measurement_position)
    is a dimensionless rescaling of a toroidal-flux label and is distinct from this
    dimensional coordinate.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:toroidal_flux_coordinate_at_plasma_boundary
  - name:toroidal_flux_coordinate_of_magnetic_axis
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  sources:
  - dd_path: core_profiles/profiles_1d/grid/rho_tor
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-grid-rho_tor
    dd_documentation:
      leaf: Toroidal flux coordinate. rho_tor = sqrt(b_flux_tor/(pi*b0)) ~ sqrt(pi*r^2*b0/(pi*b0))
        ~ r [m]. The toroidal field used in its definition is indicated under vacuum_toroidal_field/b0
      parent_path: core_profiles/profiles_1d/grid
      parent: Radial grid
      data_type: FLT_1D
      unit: m
      coordinates:
      - core_profiles/profiles_1d/grid/rho_tor_norm
    enhanced_context:
      description: "Toroidal flux coordinate (\u03C1_tor), defined as sqrt(\u03A6\
        _tor/(\u03C0 B0)), approximating the effective minor radius. Serves as the\
        \ primary radial grid coordinate for 1D core plasma profiles."
      kind: llm
