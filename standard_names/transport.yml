- name: radial_neutral_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Radial component of the momentum diffusion coefficient for neutral
    species, quantifying the rate of radial momentum transport due to neutral collisional
    processes.
  documentation: "The radial momentum diffusion coefficient for neutral species enters\
    \ the momentum balance equation as $\u0393_{\\mathrm{mom,rad}} = -D_{\\mathrm{mom,rad}}\
    \ \\partial (m_n n_n v_{\\|}) / \\partial r$, where $D_{\\mathrm{mom,rad}}$ is\
    \ this coefficient (in m$^2$ s$^{-1}$), $m_n$ is the neutral mass, $n_n$ is the\
    \ neutral density, $v_{\\|}$ is the parallel flow velocity, and $r$ is the radial\
    \ coordinate. This transport coefficient represents the anomalous or neoclassical\
    \ momentum diffusivity experienced by the neutral population in the radial direction,\
    \ typically modeled in edge transport codes. Typical values range $0.1$ to $10$\
    \ m$^2$ s$^{-1}$ in the scrape-off layer of tokamak plasmas, depending on neutral\
    \ density and collisionality. See the parent quantity [neutral_momentum_diffusion_coefficient](name:neutral_momentum_diffusion_coefficient)\
    \ for the full vector description, and the ion counterpart [radial_ion_momentum_diffusion_coefficient](name:radial_ion_momentum_diffusion_coefficient)\
    \ for comparison with the ion channel."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:neutral_momentum_diffusion_coefficient
  - name:radial_ion_momentum_diffusion_coefficient
  arguments:
  - name: neutral_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
