name: volume_averaged_argon_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Argon ion number density (summed over all charge states) averaged over
  the total plasma volume.
documentation: The volume-averaged argon ion number density $\langle n_{\rm Ar}^{\rm
  ion} \rangle_V = V_p^{-1}\int n_{\rm Ar}^{\rm ion}\,dV$ quantifies the global argon
  impurity content inside the confined plasma, summing contributions from all ionization
  stages of argon ($\mathrm{Ar}^{1+}$ through $\mathrm{Ar}^{18+}$). Argon is commonly
  injected for radiative power exhaust, disruption mitigation via massive gas injection,
  or as a diagnostic tracer for charge-exchange recombination spectroscopy. Typical
  volume-averaged values range from $10^{16}$ to $10^{18}\;\mathrm{m^{-3}}$ depending
  on injection rate and confinement time. The effective charge contribution scales
  as $\Delta Z_{\rm eff} \approx n_{\rm Ar} Z_{\rm Ar}^2 / n_e$, making even modest
  concentrations significant for core radiation. See `argon_accumulated_gas_injection`
  for the injected inventory and `volume_averaged_electron_density` for the bulk electron
  density.
