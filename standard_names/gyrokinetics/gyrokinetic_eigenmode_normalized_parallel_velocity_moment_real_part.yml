name: gyrokinetic_eigenmode_normalized_parallel_velocity_moment_real_part
status: draft
description: Real part of the normalized parallel velocity moment of the perturbed
  distribution function for a gyrokinetic eigenmode in the rotating frame.
documentation: This quantity is the real component of the first velocity-space moment
  $\langle v_\parallel \delta \hat{f}_s \rangle_v$ of the perturbed distribution function
  for species $s$, evaluated in the rotating (co-moving) frame and normalized to code
  reference quantities (typically $n_{\mathrm{ref}} v_{\mathrm{th,ref}}$ so the result
  is dimensionless). The parallel velocity moment captures the net parallel flow perturbation
  driven by a given eigenmode at wavevector $\mathbf{k}_\perp$ and is directly related
  to the perturbed parallel momentum carried by the mode. In gyrokinetic codes such
  as GENE and CGYRO this moment is a standard diagnostic output for momentum-transport
  studies and for quantifying the intrinsic rotation drive from turbulence. The imaginary
  part, stored separately, completes the complex representation of the oscillatory
  perturbation. See also the parallel current density moment, which differs by a charge
  weighting.
