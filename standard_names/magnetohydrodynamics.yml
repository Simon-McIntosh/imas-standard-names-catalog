- name: vertical_coordinate_of_active_wall_point
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of the active wall contact point where halo
    currents enter or exit the vessel structure.
  documentation: The vertical coordinate $Z$ (in meters) of the active wall point
    identifies the axial position on the first wall or divertor where halo currents
    flow between the plasma halo region and the conducting structure during a disruption.
    This location is critical for evaluating electromagnetic loads on plasma-facing
    components, since asymmetric halo-current entry points generate localized $\mathbf{j}
    \times \mathbf{B}$ forces. The active wall point is determined by disruption simulation
    codes (e.g., DINA, JOREK) or inferred from shunt-tile current measurements and
    wall-mounted Rogowski coils. Together with the major-radius coordinate [major_radius_of_active_wall_point](name:major_radius_of_active_wall_point),
    it fully specifies the poloidal location of the halo-current contact in the $(R,Z)$
    plane. For ITER-class devices, $Z$ values span roughly $-4$ m to $+4$ m depending
    on the disruption scenario and vertical displacement event (VDE) direction.
  unit: m
