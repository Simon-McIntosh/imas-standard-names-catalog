- name: vertical_coordinate_of_rectangle_center
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the geometric center of a rectangular cross-section
    element of an axisymmetric machine component in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  documentation: 'The $Z$ coordinate locates the centroid of a rectangle cross-section
    along the symmetry axis of the machine, completing the $(R, Z)$ position description
    alongside the corresponding major-radius component of [coordinate_of_rectangle_center](name:coordinate_of_rectangle_center).
    Rectangular cross-sections are a common idealization for poloidal-field coil conductors,
    passive stabilizing loops, ferritic inserts, and plasma-facing component segments;
    the centroid coordinates fully specify the element''s position when combined with
    the rectangle half-widths in $R$ and $Z$. Typical values range from $Z \approx
    -5\,\text{m}$ to $+5\,\text{m}$ for medium-scale tokamaks and up to $\pm 9\,\text{m}$
    for large devices such as ITER. The coordinate is obtained from engineering drawings
    or computer-aided design models and enters equilibrium codes as a fixed geometric
    input. Analogous centroid coordinates for other cross-section shapes include [vertical_coordinate_of_annulus](name:vertical_coordinate_of_annulus)
    for annular elements and [vertical_coordinate_of_oblique_reference_point](name:vertical_coordinate_of_oblique_reference_point)
    for oblique geometries.


    Sign convention: Positive when the rectangle center lies above the machine midplane,
    i.e., in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_rectangle_center
  - name:vertical_coordinate_of_annulus
  - name:vertical_coordinate_of_oblique_reference_point
