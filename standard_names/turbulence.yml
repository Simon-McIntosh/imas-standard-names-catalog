- name: normalized_particle_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Normalized turbulent particle flux arising from the perturbed parallel
    magnetic field $\delta B_\parallel$, summed over the full wavevector spectrum
    in a gyrokinetic simulation.
  documentation: "In electromagnetic gyrokinetic turbulence, fluctuations in the parallel\
    \ magnetic field $\\delta B_\\parallel$ compress and expand field lines, creating\
    \ an additional particle transport channel beyond the electrostatic $\\phi$-driven\
    \ and parallel-vector-potential-driven contributions. The normalized particle\
    \ flux due to $\\delta B_\\parallel$ is defined as $\\hat{\\Gamma}_{\\delta B_\\\
    parallel} = \\sum_{k_x, k_y} \\Gamma_{\\delta B_\\parallel}(k_x, k_y)$, where\
    \ the sum runs over the full $k_x$\u2013$k_y$ wavevector grid and the result is\
    \ normalized by a gyrokinetic reference flux (typically $n_{\\rm ref} v_{\\rm\
    \ ref} \\rho_{\\rm ref}^2 / L_{\\rm ref}^2$, with $n_{\\rm ref}$ the reference\
    \ density, $v_{\\rm ref}$ the thermal velocity, $\\rho_{\\rm ref}$ the Larmor\
    \ radius, and $L_{\\rm ref}$ a macroscopic gradient length). This contribution\
    \ is generally smaller than the electrostatic channel in ion-temperature-gradient\
    \ (ITG) dominated regimes but becomes significant in high-$\\beta$ plasmas or\
    \ when kinetic ballooning modes (KBM) are active. The quantity is obtained from\
    \ nonlinear local gyrokinetic codes and is species-summed unless a species-resolved\
    \ counterpart is specified. For comparison, the electrostatic contribution is\
    \ captured in [normalized particle flux due to perturbed parallel vector potential](name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential),\
    \ while the corresponding energy channel is [normalized energy flux due to perturbed\
    \ parallel magnetic field](name:normalized_energy_flux_due_to_perturbed_parallel_magnetic_field).\n\
    \nSign convention: Positive when the net particle flux is directed radially outward,\
    \ i.e., in the direction of increasing minor radius."
