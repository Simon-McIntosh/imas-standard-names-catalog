      description: "Poloidal magnetic flux (\u03C8) evaluated at the pedestal top\
        \ radial position. Serves as a flux-surface label identifying the pedestal\
        \ location within the magnetic geometry."
      kind: llm
- name: poloidal_particle_diffusivity
  kind: scalar
  status: active
  description: Effective coefficient relating particle transport to number-density
    gradients along the poloidal direction of flux coordinates.
  documentation: 'Poloidal particle diffusivity is the effective transport coefficient
    for particle spreading driven by a number-density gradient along the poloidal
    direction of the flux coordinates $(\rho, \theta, \phi)$. It is the poloidal component
    of the generic [particle diffusivity](name:particle_diffusivity) quantity.


    For physical poloidal arclength, the diffusive particle flux is defined by


    $$

    \Gamma_{\mathrm{pol}} = -D_{\mathrm{pol}}\frac{1}{h_\theta}\frac{\partial n}{\partial
    \theta}

    $$


    where $\Gamma_{\mathrm{pol}}$ is the particle flux, $D_{\mathrm{pol}}$ is the
    poloidal diffusivity, $n$ is particle number density, $\theta$ is the poloidal
    angle, and $h_\theta = \left|\partial\mathbf{r}/\partial\theta\right|$ is the
    metric scale factor converting poloidal-angle displacement to physical arclength.
    The derivative is taken at fixed $\rho$ and $\phi$.


    This generic quantity is distinct from species-specific [poloidal ion diffusivity](name:poloidal_ion_diffusivity)
    and [poloidal electron diffusivity](name:poloidal_electron_diffusivity); it does
    not by itself select a particle species or charge state.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:particle_diffusivity
  - name:poloidal_ion_diffusivity
  - name:poloidal_electron_diffusivity
  arguments:
  - name: particle_diffusivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
