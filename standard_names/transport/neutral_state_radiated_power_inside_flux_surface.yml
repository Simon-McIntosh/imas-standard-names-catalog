name: neutral_state_radiated_power_inside_flux_surface
status: draft
description: Volume-integrated radiated power emitted by a single excitation state
  of a neutral species from the region enclosed by a given flux surface.
documentation: The neutral-state radiated power inside a flux surface, $P_{\mathrm{rad,ns}}(\psi)$,
  is defined as $$P_{\mathrm{rad,ns}}(\psi) = \int_{V(\psi)} \epsilon_{\mathrm{ns}}(\mathbf{r})\,
  dV,$$ where $\epsilon_{\mathrm{ns}}$ (W m$^{-3}$) is the emissivity of a particular
  excitation state of a neutral species (e.g., atomic hydrogen $n=3 \to 2$ Balmer-$\alpha$
  emission, or molecular Fulcher-band radiation from H$_2$). This state-resolved decomposition
  allows detailed comparison with spectroscopic line measurements from individual
  transitions. The summed contribution over all neutral states and species gives `total_neutral_radiated_power_inside_flux_surface`.
  Typical values are modest (kW-level) in core regions where neutral penetration is
  low, but grow significantly near the separatrix and in high-recycling scenarios.
  The quantity is computed by neutral-transport Monte Carlo codes (EIRENE, DEGAS2)
  using collisional-radiative models. See also `neutral_radiated_power_inside_vessel`
  for the vessel-integrated counterpart.
