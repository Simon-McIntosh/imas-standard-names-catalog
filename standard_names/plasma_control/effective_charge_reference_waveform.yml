name: effective_charge_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for the plasma effective charge $Z_{\text{eff}}$
  used by the density or impurity control system.
documentation: "The effective charge reference waveform specifies the desired temporal\
  \ evolution of $Z_{\\text{eff}} = \\sum_j n_j Z_j^2 / n_e$, where $n_j$ and $Z_j$\
  \ are the density and charge number of ion species $j$ and $n_e$ is the electron\
  \ density. $Z_{\\text{eff}}$ quantifies the overall impurity content and directly\
  \ affects resistive power dissipation through the Spitzer resistivity $\\eta \\\
  propto Z_{\\text{eff}}$. Typical reference values range from 1.0 (pure hydrogen\
  \ plasma) to 3\u20135 in impurity-seeded scenarios. The control system may actuate\
  \ impurity seeding valves (e.g., nitrogen, neon, argon) and main-species fueling\
  \ to track this set-point. Error bars encode the control envelope, not measurement\
  \ uncertainty. $Z_{\\text{eff}}$ is commonly inferred from visible bremsstrahlung\
  \ or charge-exchange recombination spectroscopy."
