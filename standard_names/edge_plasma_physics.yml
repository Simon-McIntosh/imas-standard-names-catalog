- name: radial_component_of_ion_diamagnetic_drift_velocity
  kind: scalar
  status: draft
  description: Major-radius component of the ion diamagnetic drift velocity, arising
    from the ion pressure gradient crossed with the magnetic field that drives cross-field
    ion flow in magnetized edge plasmas. This drift is a fluid effect emerging from
    the finite ion Larmor radius in an inhomogeneous pressure field, and is distinct
    from curvature and grad-B drifts.
  documentation: "The ion diamagnetic drift velocity is defined as\n\n$$\\mathbf{v}_{d,i}\
    \ = -\\frac{\\nabla p_i \\times \\mathbf{B}}{q_i n_i B^2}$$\n\nwhere $p_i = n_i\
    \ T_i$ is the ion pressure, $\\mathbf{B}$ is the magnetic field vector, $q_i$\
    \ is the ion charge, $n_i$ is the ion number density, and $B = |\\mathbf{B}|$.\
    \ This quantity is the projection of $\\mathbf{v}_{d,i}$ onto the major-radius\
    \ direction $\\hat{R}$ in the right-handed cylindrical $(R, \\phi, Z)$ frame:\n\
    \n$$v_{d,i,R} = \\mathbf{v}_{d,i} \\cdot \\hat{R}$$\n\nwhere $R$ is the major\
    \ radius measured from the machine symmetry axis. The diamagnetic drift is a fluid\
    \ drift arising purely from the ion pressure gradient; it is distinct from the\
    \ curvature drift and the grad-$B$ drift, which stem from the magnetic field geometry.\
    \ In the guiding-center picture the diamagnetic drift does not represent net particle\
    \ transport by individual guiding centers, but it does contribute to the macroscopic\
    \ fluid momentum and to cross-field transport of energy and particles in edge-plasma\
    \ fluid models.\n\nThe $R$-component is particularly relevant in the scrape-off\
    \ layer and near separatrix regions where radial pressure gradients are steep.\
    \ Typical magnitudes in the edge region of a medium-sized tokamak lie in the range\
    \ $10^2$\u2013$10^4$ m s$^{-1}$, with larger values occurring in high-confinement\
    \ (H-mode) pedestals where $|\\nabla p_i|$ is large.\n\nSign convention: Positive\
    \ when the drift velocity is directed in the direction of increasing major radius\
    \ $R$ (outward from the magnetic axis toward the vessel wall).\n\nThis quantity\
    \ is the $R$-component of the full ion diamagnetic drift vector. The analogous\
    \ electron quantity uses $\\nabla p_e$ and electron charge. In edge-plasma fluid\
    \ codes this drift enters the ion momentum equation as a pressure-gradient-driven\
    \ flow term."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_diamagnetic_drift_velocity
  - name:radial_component_of_e_cross_b_drift_velocity
  - name:ion_momentum_diffusivity_due_to_diamagnetic_drift
  constraints: []
  arguments:
  - name: ion_diamagnetic_drift_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/ion/state/velocity_diamagnetic/r
    dd_path: edge_profiles/ggd/ion/state/velocity_diamagnetic/r
    status: composed
- name: radial_component_of_ion_velocity
  kind: scalar
  status: draft
  description: Major-radius component of the bulk ion fluid velocity, projected onto
    the radial direction of the right-handed cylindrical $(R, \phi, Z)$ frame in the
    edge plasma.
  documentation: "The radial component of the ion velocity, $v_{i,R} = \\mathbf{v}_i\
    \ \\cdot \\hat{R}$, describes the cross-field ion fluid flow along the major-radius\
    \ direction $\\hat{R}$ in the edge and scrape-off layer. This quantity governs\
    \ radial ion transport, contributing to particle and momentum fluxes across flux\
    \ surfaces; together with the [poloidal component](name:poloidal_component_of_ion_velocity),\
    \ it characterizes the full poloidal-cross-section ion flow pattern. The radial\
    \ ion velocity includes contributions from neoclassical and anomalous transport,\
    \ as well as drift flows such as the [E\xD7B drift](name:radial_component_of_e_cross_b_drift_velocity)\
    \ and the [ion diamagnetic drift](name:radial_component_of_ion_diamagnetic_drift_velocity).\
    \ Typical magnitudes in the edge plasma span from tens to hundreds of m/s for\
    \ the thermal bulk ion population, with larger values possible near limiters or\
    \ divertor targets. It is computed in edge fluid codes on general geometry grids\
    \ and can be inferred from spectroscopic measurements of impurity ion Doppler\
    \ shifts combined with ambipolarity constraints. The [radial component of neutral\
    \ velocity](name:radial_component_of_neutral_velocity) provides the analogous\
    \ quantity for the neutral population.\n\nSign convention: Positive when $v_{i,R}$\
    \ points in the direction of increasing major radius $R$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
