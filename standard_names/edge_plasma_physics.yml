    enhanced_context:
      description: Tungsten (W).
      kind: template
- name: toroidal_tungsten_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Toroidal component of the density-weighted bulk velocity of tungsten
    impurity ions at the last closed flux surface separating confined plasma from
    the scrape-off layer.
  documentation: 'This quantity is the local toroidal projection of the tungsten impurity-ion
    bulk velocity at the plasma boundary, defined on the last closed flux surface
    separating confined plasma from the scrape-off layer. It is a density-weighted
    mean over the included tungsten ion charge states.


    $$

    v_{\\phi,\\mathrm{W}}(\\mathbf{x}_b)=\\frac{\\sum_q n_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)\\left[\\mathbf{v}_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)\\cdot\\hat{\\boldsymbol{\\phi}}\\right]}{\\sum_q
    n_{\\mathrm{W}^{q+}}(\\mathbf{x}_b)}

    $$


    Here, $q$ is the tungsten ion charge state, $n_{\\mathrm{W}^{q+}}$ is its number
    density, $\\mathbf{v}_{\\mathrm{W}^{q+}}$ is its bulk velocity, $\\mathbf{x}_b$
    is a point on the boundary, and $\\hat{\\boldsymbol{\\phi}}$ is the toroidal unit
    vector in the right-handed cylindrical $(R, \\phi, Z)$ frame. Unlike [toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary),
    this quantity is local rather than flux-surface averaged.


    Sign convention: Positive when the tungsten-ion velocity component points in the
    direction of increasing toroidal angle $\\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix/velocity_phi/tungsten/value
    dd_version: 4.1.0
