- name: outer_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Radial distance from the center of an annular poloidal-field coil conductor
    cross-section to its outer conducting boundary.
  documentation: 'The outer radius defines the external circular boundary of an annular
    poloidal-field coil conductor cross-section. Together with the [inner radius of
    the poloidal field coil](name:inner_radius_of_poloidal_field_coil), it fixes the
    conductor thickness and determines the current-carrying area relevant to coil
    resistance, inductance, cooling, and electromagnetic loading.


    For a circular annular cross-section with local coordinates $u$ and $v$ in the
    conductor plane, the outer radius $a_{\rm out}$ can be defined from the conductor
    boundary $\partial\Omega$ as:


    $$

    a_{\rm out} = \max_{(u,v)\in\partial\Omega}\sqrt{(u-u_c)^2+(v-v_c)^2}

    $$


    where $(u_c,v_c)$ is the annulus center and $\Omega$ is the conducting region.
    The cross-sectional [area of the poloidal field coil](name:area_of_poloidal_field_coil)
    follows from the annular geometry and is distinct from rectangular measures such
    as the [width of the poloidal field coil](name:width_of_poloidal_field_coil) and
    [height of the poloidal field coil](name:height_of_poloidal_field_coil).


    This dimension is obtained from coil engineering design, manufacturing metrology,
    or survey reconstruction of the conductor pack. Representative values range from
    a few centimeters for compact copper correction coils to several tens of centimeters
    or more for large superconducting poloidal-field coil elements.


    Sign convention: Positive when measured outward from the annulus center to the
    outer conducting boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:height_of_poloidal_field_coil
  sources:
