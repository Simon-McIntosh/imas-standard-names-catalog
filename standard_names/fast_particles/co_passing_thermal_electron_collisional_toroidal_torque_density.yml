name: co_passing_thermal_electron_collisional_toroidal_torque_density
status: draft
description: Collisional toroidal torque density transferred from co-passing fast
  particles to the background thermal electron population.
documentation: "This quantity represents the reaction torque on the thermal electron\
  \ population arising from Coulomb collisions with the co-passing component of the\
  \ fast-particle distribution. By Newton's third law, it is equal in magnitude and\
  \ opposite in sign to the torque exerted on the co-passing fast particles by electrons:\
  \ $\\tau_\\phi^{\\mathrm{th},e} = -\\tau_\\phi^{e\\to f,\\mathrm{co}}$. The unit\
  \ is $\\mathrm{N\\,m^{-2}}$ (force per unit area, equivalent to angular momentum\
  \ density source rate per radian). In practice this quantity is evaluated by Fokker\u2013\
  Planck solvers such as NUBEAM or CQL3D after decomposing the fast-ion distribution\
  \ into pitch-angle classes. The thermal electron torque drives a return (drag) current\
  \ that partially cancels the fast-ion driven current; its magnitude is typically\
  \ $10^{-4}$\u2013$10^{-2}\\;\\mathrm{N\\,m^{-2}}$ in auxiliary-heated tokamak plasmas.\
  \ Accurate evaluation of this term is essential for computing the net non-inductive\
  \ current drive efficiency $\\eta_{\\mathrm{CD}}$."
