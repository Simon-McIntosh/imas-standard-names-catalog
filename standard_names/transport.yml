- name: fast_particle_power_due_to_collisions
  kind: scalar
  status: draft
  description: Volume-integrated Coulomb collisional power transferred from the fast
    (non-Maxwellian) particle population to the bulk electron population.
  documentation: "Fast particles \u2014 such as neutral-beam-injected ions, minority\
    \ ions accelerated by RF heating, or fusion-born alpha particles \u2014 carry\
    \ a non-Maxwellian velocity distribution well above the thermal speed of the bulk\
    \ plasma. As they slow down via Coulomb collisions, energy is deposited into both\
    \ bulk electrons and ions; this quantity captures the total power delivered to\
    \ the electron channel alone, integrated over the plasma volume.\n\nThe governing\
    \ relation connects this quantity to its local density analog [fast_particle_power_density_due_to_collisions](name:fast_particle_power_density_due_to_collisions):\n\
    \n$$\nP_{f \\to e} = \\int_V S_{f \\to e}(\\mathbf{r}) \\, dV\n$$\n\nwhere $S_{f\
    \ \\to e}(\\mathbf{r})$ is the local electron-channel collisional power density\
    \ at position $\\mathbf{r}$, and $V$ is the plasma volume. The fraction of fast-particle\
    \ energy deposited into electrons versus ions is governed by the ratio of the\
    \ fast particle speed to the critical slowing-down velocity $v_c$; above $v_c$,\
    \ electron drag dominates.\n\nThis quantity is evaluated from kinetic calculations\
    \ \u2014 Monte Carlo orbit-following or Fokker-Planck solvers \u2014 that evolve\
    \ the fast particle distribution function and compute the Coulomb collision operator.\
    \ In large tokamaks with multi-megawatt injection, the electron channel receives\
    \ several to tens of megawatts; for fusion-born alpha particles in burning plasmas\
    \ the contribution scales with the fusion power.\n\nThe power received by the\
    \ thermal electron population from this exchange equals [thermal_electron_power_due_to_collisions](name:thermal_electron_power_due_to_collisions),\
    \ and the corresponding ion-channel quantity is [thermal_ion_power_due_to_collisions](name:thermal_ion_power_due_to_collisions).\n\
    \nSign convention: Positive when net energy flows from the fast particle population\
    \ to the electron population via Coulomb collisions."
  unit: W
  physics_domain: transport
  links:
  - name:thermal_ion_power_due_to_collisions
  sources:
  - id: dd:distributions/distribution/global_quantities/collisions/electrons/power_fast
    dd_path: distributions/distribution/global_quantities/collisions/electrons/power_fast
    status: composed
- name: hydrogen_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Number density of hydrogen ions at the radial location of the internal
    transport barrier, where suppressed turbulent transport enables steep particle
    density gradients to develop.
  documentation: "The hydrogen ion number density at the internal transport barrier\
    \ quantifies the local concentration of hydrogen (protium, $^1$H) ions at the\
    \ ITB radius \u2014 the radial position in the plasma core where cross-field turbulent\
    \ transport is significantly reduced, allowing steep gradients in density and\
    \ pressure to be sustained. As the lightest hydrogenic species, hydrogen may serve\
    \ as the primary fuel ion or a minority constituent depending on the operational\
    \ scenario, and its density at the ITB directly reflects the local particle transport\
    \ balance between source, diffusion, and convection.\n\nThis quantity is the hydrogen\
    \ ion number density profile $n_H(r)$ evaluated at $r_\\mathrm{ITB}$, the barrier\
    \ radius identified from a minimum in the local particle diffusivity or a maximum\
    \ of the logarithmic pressure gradient. The parent quantity [density_at_internal_transport_barrier](name:density_at_internal_transport_barrier)\
    \ defines this evaluation framework for any plasma constituent.\n\nThe hydrogen\
    \ density at the ITB is inferred from charge-exchange recombination spectroscopy\
    \ or from interferometric line-integrated density measurements combined with impurity-profile\
    \ modeling. The analogous measurement for the dominant deuterium fuel species\
    \ is [deuterium_density_at_internal_transport_barrier](name:deuterium_density_at_internal_transport_barrier);\
    \ light and heavy impurity contributions at the same location are captured by\
    \ [carbon_density_at_internal_transport_barrier](name:carbon_density_at_internal_transport_barrier)\
    \ and [iron_density_at_internal_transport_barrier](name:iron_density_at_internal_transport_barrier).\
    \ The hydrogen ion density at the plasma edge is separately characterized by [hydrogen_density_at_limiter](name:hydrogen_density_at_limiter)."
  unit: m^-3
  physics_domain: transport
  links:
  - name:density_at_internal_transport_barrier
  - name:deuterium_density_at_internal_transport_barrier
  - name:carbon_density_at_internal_transport_barrier
  - name:iron_density_at_internal_transport_barrier
  - name:hydrogen_density_at_limiter
  sources:
  - id: dd:summary/local/itb/n_i/hydrogen/value
    dd_path: summary/local/itb/n_i/hydrogen/value
    status: composed
- name: ion_average_temperature_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Ion temperature averaged over all ion species, evaluated at the flux
    surface corresponding to the internal transport barrier.
  documentation: 'The internal transport barrier is a region of strongly suppressed
    turbulent transport in the plasma core, identified by steep temperature and pressure
    gradients that separate it from the surrounding plasma. The species-averaged ion
    temperature at this location captures the characteristic thermal state of the
    combined ion population at the barrier, encompassing fuel ions, minority species,
    and impurity ions.


    The density-weighted species average is defined as:


    $$

    T_i^{\mathrm{avg}} = \frac{\sum_s n_s T_{i,s}}{\sum_s n_s}

    $$


    where $n_s$ is the number density and $T_{i,s}$ is the temperature of ion species
    $s$, with the sum running over all ion populations. This density-weighted mean
    ensures numerically dominant species contribute most to the average and corresponds
    to the first moment of the combined ion distribution function.


    The ITB ion temperature is inferred primarily from charge exchange recombination
    spectroscopy, which extracts local ion thermal energy from the Doppler broadening
    of impurity emission lines. The ITB reference position is assigned to the flux
    surface of maximum transport-barrier strength, parameterized by a radial coordinate
    such as the normalized toroidal flux radius. The companion quantity [total_ion_density_at_internal_transport_barrier](name:total_ion_density_at_internal_transport_barrier)
    provides the total ion density at the same surface; [ion_average_temperature_at_plasma_boundary](name:ion_average_temperature_at_plasma_boundary)
    gives the analogous species-averaged temperature at the outer boundary. Typical
    ITB ion temperatures in advanced tokamak scenarios range from 2-15 keV, substantially
    exceeding pedestal-top values.


    Sign convention: Positive when the mean kinetic energy per degree of freedom of
    the ion population is above absolute zero.'
  unit: eV
  physics_domain: transport
  links:
  - name:total_ion_density_at_internal_transport_barrier
  - name:ion_average_temperature_at_plasma_boundary
  sources:
  - id: dd:summary/local/itb/t_i_average/value
    dd_path: summary/local/itb/t_i_average/value
    status: composed
- name: ion_momentum_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Source density of total-ion toroidal angular momentum produced by diamagnetic-drift
    transport, summed over all ion species and charge states. It is the signed contribution
    of ion pressure-gradient drift fluxes to the ion momentum balance.
  documentation: 'Total-ion diamagnetic-drift momentum source density is the local
    rate per unit volume at which pressure-gradient-driven ion drift transport changes
    [toroidal_ion_momentum](name:toroidal_ion_momentum). It is an internal transport
    contribution, not an externally applied torque, and the sum includes all ion species
    and charge states. The toroidal component is defined in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    Written as a conservative transport contribution, the source density is the negative
    divergence of the diamagnetic flux of ion toroidal angular momentum:


    $$

    S_{\phi,\mathrm{ion}}^{\mathrm{dia}} = -\nabla \cdot \boldsymbol{\Gamma}_{L_\phi,\mathrm{ion}}^{\mathrm{dia}}
    = -\nabla \cdot \sum_{a\in\mathrm{ions}} \left(m_a n_a R v_{\phi,a}\right)\mathbf{v}_{D,a}

    $$


    where $S_{\phi,\mathrm{ion}}^{\mathrm{dia}}$ is in kg.m^-1.s^-2, $\boldsymbol{\Gamma}_{L_\phi,\mathrm{ion}}^{\mathrm{dia}}$
    is the [ion diamagnetic momentum flux](name:ion_momentum_flux_due_to_diamagnetic_drift)
    in kg.s^-2, $\nabla\cdot$ is the spatial divergence operator with components in
    m^-1, and $a$ indexes ion species and charge states. Here $m_a$ is ion mass in
    kg, $n_a$ is ion number density in m^-3, $R$ is major radius in meters in the
    right-handed cylindrical $(R,\phi,Z)$ frame, $v_{\phi,a}$ is toroidal fluid velocity
    in m.s^-1, and $\mathbf{v}_{D,a}$ is diamagnetic drift velocity in m.s^-1 generated
    by the perpendicular ion pressure gradient.


    In practice the term is computed by combining equilibrium geometry, ion pressure-gradient
    estimates, species composition, and toroidal-flow information to construct the
    charge-state-resolved diamagnetic momentum fluxes and then taking their divergence.
    It is usually inferred from momentum-balance and transport analyzes rather than
    measured directly; charge-state-resolved contributions correspond to [ion_state_momentum_due_to_diamagnetic_drift](name:ion_state_momentum_due_to_diamagnetic_drift),
    and the total plasma contribution is [momentum_due_to_diamagnetic_drift](name:momentum_due_to_diamagnetic_drift).
    The related neutral contribution, when included in the same source decomposition,
    is [neutral_momentum_due_to_diamagnetic_drift](name:neutral_momentum_due_to_diamagnetic_drift).


    Typical absolute magnitudes are order $10^{-4}$-$10^1$ kg.m^-1.s^-2 in weak-gradient
    core regions and $10^1$-$10^4$ kg.m^-1.s^-2 locally in pedestal, edge, or scrape-off-layer
    regions with short pressure-gradient scale lengths. The value can change sign
    with the direction of toroidal flow, pressure-gradient orientation, magnetic geometry,
    and spatial convergence or divergence of the diamagnetic momentum flux.


    Sign convention: Positive when convergence of the ion diamagnetic-drift momentum
    flux increases total-ion toroidal angular momentum in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_sources/source/ggd/ion/momentum/diamagnetic
    dd_path: edge_sources/source/ggd/ion/momentum/diamagnetic
    status: attached
  - id: dd:edge_sources/source/ggd/ion/state/momentum/diamagnetic
    dd_path: edge_sources/source/ggd/ion/state/momentum/diamagnetic
    status: attached
  - id: dd:plasma_sources/source/ggd/ion/momentum/diamagnetic
    dd_path: plasma_sources/source/ggd/ion/momentum/diamagnetic
    status: attached
- name: ion_particle_flux
  kind: scalar
  status: draft
  description: Net oriented number flux of ions through a unit area per unit time,
    summed over all charge states of an ion species. It is the scalar particle-transport
    flux used in the ion continuity balance.
  documentation: 'Ion particle flux is the net transport rate of ions across an oriented
    unit area, summed over all ion charge states of a given species. It represents
    the scalar projection of the ion particle-flux vector onto the relevant transport
    direction or surface normal, so it can be positive or negative depending on the
    direction of net ion motion.


    Total ion particle conservation is commonly expressed by the continuity balance:


    $$

    \frac{\partial n_i}{\partial t} + \nabla \cdot \boldsymbol{\Gamma}_i = S_i

    $$


    where $n_i$ is the total ion number density in $\mathrm{m}^{-3}$, $\boldsymbol{\Gamma}_i$
    is the ion particle-flux vector in $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$, and $S_i$
    is the net ion particle source density in $\mathrm{m}^{-3}\,\mathrm{s}^{-1}$ from
    ionization, recombination, charge exchange, and imposed sources or sinks. The
    scalar flux is the oriented component of $\boldsymbol{\Gamma}_i$, equivalently
    $\boldsymbol{\Gamma}_i \cdot \hat{\mathbf{n}}$ for positive surface normal $\hat{\mathbf{n}}$.


    In experiments and transport analysis, ion particle flux is inferred from density
    evolution, atomic source estimates, flow measurements, and transport closures
    for diffusive, convective, neoclassical, turbulent, and field-parallel motion.
    The charge-state-resolved counterpart is [ion_state_particle_flux](name:ion_state_particle_flux);
    [parallel_ion_particle_flux](name:parallel_ion_particle_flux) and [parallel_ion_charge_state_particle_flux](name:parallel_ion_charge_state_particle_flux)
    describe field-aligned transport, while [electron_particle_flux](name:electron_particle_flux)
    is the analogous electron quantity entering ambipolar particle balance.


    Typical absolute magnitudes vary widely with plasma region and operating regime.
    Edge and scrape-off-layer transport values often span $10^{18}$-$10^{22}\ \mathrm{m}^{-2}\,\mathrm{s}^{-1}$,
    and directed fluxes near strongly recycling divertor targets can approach $10^{23}\
    \mathrm{m}^{-2}\,\mathrm{s}^{-1}$; core cross-field values are often lower and
    more sensitive to fueling and confinement.


    Sign convention: Positive when the net ion flow is in the direction of the chosen
    positive normal to the surface through which the flux is evaluated.'
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:ion_state_particle_flux
  - name:electron_particle_flux
  sources:
  - id: dd:edge_transport/model/ggd/ion/particles/flux/values
    dd_path: edge_transport/model/ggd/ion/particles/flux/values
    status: composed
  - id: dd:plasma_transport/model/ggd/ion/particles/flux/values
    dd_path: plasma_transport/model/ggd/ion/particles/flux/values
    status: composed
- name: ion_state_diamagnetic_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Diamagnetic velocity of a specified ion charge state, arising from
    the perpendicular gradient of that state's partial pressure. It is the signed
    scalar component of the diamagnetic drift along the local diamagnetic direction
    defined by the cross product of the magnetic field unit vector with the partial-pressure
    gradient, resolving individual charge states rather than the aggregate ion fluid.
  documentation: 'The ion-state diamagnetic velocity due to diamagnetic drift is the
    charge-state-resolved drift speed produced when the partial pressure of a single
    ionization stage varies across the magnetic field. It is local to the plasma position
    and isolates one charge state of an impurity or main-ion species from the combined
    ion fluid.


    The scalar reported here is the signed component of the diamagnetic drift velocity
    along the local diamagnetic direction $\hat{\mathbf{e}}_{\mathrm{dia}} = (\hat{\mathbf{b}}
    \times \nabla_\perp p_s)/|\hat{\mathbf{b}} \times \nabla_\perp p_s|$, where $\hat{\mathbf{b}}
    = \mathbf{B}/B$:


    $$

    v_{\mathrm{dia},s} = \frac{|\nabla_\perp p_s|}{Z_s e\, n_s\, B}

    $$


    where $p_s$ is the partial pressure of ion charge state $s$ (Pa), $n_s$ is its
    number density (m^-3), $Z_s$ is its charge number, $e$ is the elementary charge
    (C), $\nabla_\perp p_s$ is the component of the partial-pressure gradient perpendicular
    to the magnetic field, and $B = |\mathbf{B}|$ is the magnetic field magnitude
    (T). Only the perpendicular pressure-gradient component contributes; pressure
    variation along the field produces no diamagnetic drift.


    This quantity is obtained from charge-state-resolved density and temperature gradients
    together with the local magnetic field from an equilibrium or field model. If
    $p_s = n_s T_s$ is used, $T_s$ must be expressed as energy per particle. Coordinate
    components such as the radial, toroidal, or parallel diamagnetic velocities are
    obtained by projecting the same drift vector onto explicitly defined directions.


    Representative speeds for low-charge ions in tokamak fields of a few tesla are
    $10^2$-$10^4$ m.s^-1 in the core and rise to $10^4$-$10^5$ m.s^-1 across steep
    pedestal or scrape-off-layer pressure gradients. The magnitude scales approximately
    as $T_s/(Z_s B L_p)$, where $L_p = p_s/|\nabla_\perp p_s|$ is the perpendicular
    pressure-gradient length.


    Sign convention: Positive when the drift is directed along $\hat{\mathbf{b}} \times
    \nabla_\perp p_s$ for the positive ion charge $q_s = Z_s e$.'
  unit: m.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_profiles/ggd/ion/state/velocity_diamagnetic/diamagnetic
    dd_path: plasma_profiles/ggd/ion/state/velocity_diamagnetic/diamagnetic
    status: attached
- name: ion_state_energy_convection_velocity
  kind: scalar
  status: draft
  description: Effective velocity at which a specific ion charge state convects its
    thermal energy radially across flux surfaces in the charge-state-resolved energy
    transport equation.
  documentation: 'In flux-surface-averaged radial transport models, the total radial
    energy flux of an ion charge state is decomposed into diffusive and convective
    contributions. The ion state energy convection velocity $v_E$ is the effective
    velocity parameterizing the convective part for a given charge state, providing
    finer charge-state resolution than the species-averaged ion_energy_convection_velocity.


    The convective energy flux contribution $q_{\mathrm{conv}}$ for the charge state
    is:


    $$

    q_{\mathrm{conv}} = \frac{3}{2} n_s T_s v_E

    $$


    where $n_s$ is the number density of the charge state in m$^{-3}$ and $T_s$ is
    its temperature in J.


    This quantity is computed by transport codes that resolve the charge state distribution
    and is not directly measurable; it is inferred from energy balance analysis or
    prescribed within transport models. The particle-convection analog for the same
    charge state is ion_state_convection_velocity, and the analogous quantity for
    neutral states is [neutral_state_energy_convection_velocity](name:neutral_state_energy_convection_velocity).
    The charge-state-summed counterpart is [total_ion_energy_convection_velocity](name:total_ion_energy_convection_velocity).


    Sign convention: Positive when the convective energy flux is directed outward,
    away from the magnetic axis in the direction of increasing normalized poloidal
    flux.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:neutral_state_energy_convection_velocity
  - name:total_ion_energy_convection_velocity
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/energy/v
    dd_path: core_transport/model/profiles_1d/ion/state/energy/v
    status: composed
- name: ion_state_particle_flux
  kind: scalar
  status: draft
  description: Signed scalar particle flux of ions in a specified ionization charge
    state through an oriented unit surface. It is the surface-normal projection of
    the charge-state ion particle flux, including convective, diffusive, drift, and
    turbulent transport contributions.
  documentation: 'Ion state particle flux is the signed number rate per unit area
    at which ions of a given element and ionization charge state cross an oriented
    surface. It is a scalar surface-normal projection, so it can describe crossing
    of a magnetic flux surface, a material boundary, or a control-volume face, rather
    than the magnitude of the full particle-flux vector. In charge-state-resolved
    particle continuity equations it transports the density of that charge state between
    neighboring regions and across boundaries.


    A common decomposition of the scalar normal flux is


    $$

    \Gamma_{a,z,n} = \hat{\mathbf{n}} \cdot \boldsymbol{\Gamma}_{a,z} = n_{a,z} u_{a,z,n}
    - D_{a,z}\,\nabla_n n_{a,z} + \Gamma_{a,z,n}^{\mathrm{drift}} + \Gamma_{a,z,n}^{\mathrm{turb}}

    $$


    where $a$ labels the ion species, $z$ labels the ionization charge state, $\hat{\mathbf{n}}$
    is the chosen unit normal to the surface, $\Gamma_{a,z,n}$ is in $\mathrm{m^{-2}\,s^{-1}}$,
    $n_{a,z}$ is the charge-state density, $u_{a,z,n}$ is the normal convective velocity,
    $D_{a,z}$ is an effective diffusion coefficient, $\nabla_n n_{a,z}$ is the density
    gradient along the normal direction, and the final terms represent drift and turbulent
    contributions when they are retained.


    In practice this flux is computed from fluid or kinetic transport models, inferred
    from particle balance, or constrained by measurements of density, flow, ionization,
    recombination, and boundary loss rates. Diagnostics such as spectroscopy, charge-exchange
    measurements, and probes can constrain pieces of the balance, but the charge-state-resolved
    flux usually requires a transport model because ionization and recombination couple
    neighboring charge states.


    Typical main-ion cross-field values in confined and edge transport are about $10^{19}$-$10^{22}\
    \mathrm{m^{-2}\,s^{-1}}$, while parallel exhaust or sheath-adjacent values can
    reach $10^{22}$-$10^{24}\ \mathrm{m^{-2}\,s^{-1}}$. Trace impurity charge-state
    fluxes scale with abundance and ionization stage and may be much smaller, commonly
    $10^{15}$-$10^{20}\ \mathrm{m^{-2}\,s^{-1}}$.


    Sign convention: Positive when the net particle flow of the specified ionization
    charge state is in the direction of the chosen oriented surface normal.'
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:ion_particle_flux
  - name:ion_state_energy_flux
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/flux/values
    dd_path: edge_transport/model/ggd/ion/state/particles/flux/values
    status: composed
  - id: dd:plasma_transport/model/ggd/ion/state/particles/flux/values
    dd_path: plasma_transport/model/ggd/ion/state/particles/flux/values
    status: composed
- name: ion_state_upper_bound_charge
  kind: scalar
  status: draft
  description: Maximum ionization charge number (Z_max) of an ion charge-state bundle;
    equals the lower-bound charge when the bundle contains only a single resolved
    charge state.
  documentation: 'The upper-bound charge number specifies the highest ionization state
    included in an ion charge-state bundle, where the ionization charge $Z$ counts
    the number of electrons removed from the neutral atom. In multi-fluid plasma models,
    consecutive ionization states of the same ion species are often grouped into bundles
    to reduce computational expense; this quantity gives the ceiling $Z_\mathrm{max}$
    of the charge range $[Z_\mathrm{min}, Z_\mathrm{max}]$ spanned by the bundle.


    When a bundle encloses only a single charge state, $Z_\mathrm{max}$ equals the
    corresponding [lower-bound charge]. For multi-state bundles the interval width
    $Z_\mathrm{max} - Z_\mathrm{min} \geq 1$, and the [concentration-weighted average
    charge] or [mean charge] provides a representative effective charge for transport
    and source-term calculations.


    Charge-state values are non-negative integers bounded above by the nuclear charge
    number $Z_n$ of the species: for hydrogen $Z_\mathrm{max} \leq 1$, for carbon
    $Z_\mathrm{max} \leq 6$, and for heavy impurities such as tungsten $Z_\mathrm{max}
    \leq 74$. The bundle definition is set at model initialization and does not vary
    with plasma conditions at a given time step.


    Sign convention: Positive when the ion carries net positive charge, corresponding
    to the removal of one or more electrons from the neutral atom.'
  unit: '1'
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/z_max
