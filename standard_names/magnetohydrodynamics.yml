- name: alfven_time
  kind: scalar
  status: draft
  description: "Characteristic MHD timescale defined as the transit time of an Alfv\xE9\
    n wave across the major radius, $\\tau_A = R_0 / v_A$."
  documentation: "The Alfv\xE9n time $\\tau_A = R_0 / v_A = R_0 \\sqrt{\\mu_0 \\,\
    \ m_i \\, n_i} / B_0$ sets the fundamental timescale for ideal MHD dynamics, where\
    \ $R_0$ is the major radius (in m), $v_A$ is the Alfv\xE9n speed (in m/s), $m_i$\
    \ is the ion mass (in kg), $n_i$ is the ion number density (in m$^{-3}$), $B_0$\
    \ is the reference toroidal magnetic field (in T), and $\\mu_0 = 4\\pi \\times\
    \ 10^{-7}$ H/m. MHD growth rates are conventionally normalized to $\\tau_A^{-1}$;\
    \ an instability with $\\gamma \\tau_A \\sim 1$ grows on the fastest ideal timescale.\
    \ For ITER-class parameters ($R_0 \\approx 6.2$ m, $B_0 \\approx 5.3$ T, deuterium-tritium\
    \ plasma at $n_i \\approx 10^{20}$ m$^{-3}$), $\\tau_A \\approx 0.5$\u2013$1\\\
    ;\\mu$s. The resistive timescale $\\tau_R$ is orders of magnitude larger; the\
    \ Lundquist number $S = \\tau_R / \\tau_A$ characterizes the separation. See also\
    \ [toroidal_mode_growth_rate](name:toroidal_mode_growth_rate) for the linear MHD\
    \ growth rate normalized to this timescale."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - benchmark-quantity
  - global-quantity
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: electron_radiated_power_due_to_impurity_radiation
  kind: scalar
  status: draft
  description: Total radiated power lost by electrons through collisional excitation
    and recombination of impurity ions across the entire plasma volume.
  documentation: "This quantity represents the volume-integrated power $P_{\\rm rad,imp}$\
    \ (in W) radiated by electrons interacting with impurity species via line radiation,\
    \ bremsstrahlung on impurity ions, and recombination radiation. It is computed\
    \ as $P_{\\rm rad,imp} = \\int n_e \\sum_Z n_Z L_Z(T_e)\\, dV$, where $n_e$ is\
    \ the electron density in m$^{-3}$, $n_Z$ is the density of impurity species $Z$,\
    \ $L_Z(T_e)$ is the cooling rate function in W\xB7m$^3$, and $V$ is the plasma\
    \ volume. During disruptions, impurity radiation can dominate the total energy\
    \ loss, with $P_{\\rm rad,imp}$ reaching 10\u20131000 MW depending on the impurity\
    \ content and pre-disruption stored energy. This quantity covers the full plasma\
    \ (core plus halo); for the halo contribution alone, see [halo_region_electron_radiated_power_due_to_impurity_radiation](name:halo_region_electron_radiated_power_due_to_impurity_radiation).\
    \ Bolometry arrays and filtered soft-X-ray cameras provide experimental estimates,\
    \ while atomic-physics databases (ADAS) supply the cooling-rate coefficients used\
    \ in simulations."
  unit: W
  tags:
  - disruption-prediction
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: electron_temperature_on_ggd
  kind: scalar
  status: draft
  description: Thermal energy of the electron population expressed as a temperature,
    stored on a generalized grid description (GGD).
  documentation: "The electron temperature $T_e$ quantifies the mean kinetic energy\
    \ of the electron velocity distribution, defined via $T_e = 2\\langle E_e\\rangle\
    \ / (3 k_B)$ under the Maxwellian assumption, where $\\langle E_e\\rangle$ is\
    \ the mean electron kinetic energy and $k_B$ is the Boltzmann constant. This field\
    \ is discretized on a GGD mesh (one scalar value per grid element), which allows\
    \ representation of $T_e$ in geometrically complex regions such as the scrape-off\
    \ layer, divertor, and near X-points where flux-surface-aligned 1-D profiles are\
    \ inadequate. Values range from $\\sim$0.5\u201320 keV in the confined core to\
    \ $\\sim$1\u2013100 eV in the divertor and far SOL. Inferred from Thomson scattering,\
    \ electron cyclotron emission, or Langmuir probes, depending on the plasma region.\
    \ See also [electrostatic_potential_on_ggd](name:electrostatic_potential_on_ggd)."
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: electrostatic_potential_on_ggd
  kind: scalar
  status: draft
  description: Scalar electrostatic potential of the plasma, stored on a generalized
    grid description (GGD) mesh.
  documentation: The electrostatic potential $\Phi$ (in V) satisfies the quasi-neutrality
    constraint and governs the perpendicular $\mathbf{E} \times \mathbf{B}$ drift
    via $\mathbf{v}_E = -\nabla\Phi \times \mathbf{B} / B^2$. In reduced-MHD and gyrokinetic
    frameworks, $\Phi$ is the primary electromagnetic unknown for low-frequency dynamics.
    Edge values span roughly $-200$ to $+200$ V relative to the wall in L-mode discharges,
    with sharper gradients (up to several kV over a few cm) in H-mode pedestals where
    the radial electric field well forms. Discretization on the GGD mesh enables representation
    of complex divertor and X-point geometries. The quantity is computed self-consistently
    in codes such as JOREK, BOUT++, and XGC. See also [toroidal_component_of_magnetic_vector_potential_on_ggd](name:toroidal_component_of_magnetic_vector_potential_on_ggd)
    and [vorticity_on_ggd](name:vorticity_on_ggd).
  unit: V
  tags:
  - spatial-profile
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: halo_region_parallel_heat_flux_energy
  kind: scalar
  status: draft
  description: Time-integrated parallel heat flux energy deposited in the halo region
    over the disruption duration.
  documentation: This scalar represents the cumulative energy $E_{\parallel,\mathrm{halo}}
    = \int_0^{t_\mathrm{dis}} P_{\parallel,\mathrm{halo}}(t)\, dt$, where $P_{\parallel,\mathrm{halo}}$
    is the power carried by the parallel heat flux in the halo region (W) and $t_\mathrm{dis}$
    is the disruption duration (s). During a disruption, halo currents develop in
    the open-field-line region between the last closed flux surface and the wall,
    driving significant parallel heat flux that can damage plasma-facing components.
    Values range from $10^4$ to $10^7$ J depending on the stored thermal energy and
    the fraction channeled through the halo. The quantity is a key input for first-wall
    thermal-fatigue assessments. See also [halo_region_ohmic_power](name:halo_region_ohmic_power)
    and [halo_region_electron_radiated_power_due_to_impurity_radiation](name:halo_region_electron_radiated_power_due_to_impurity_radiation).
  unit: J
  tags:
  - disruption-prediction
  - energy-balance
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_major_radius_of_active_wall_point
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the major-radius coordinate
    of the active wall point during a disruption.
  documentation: This quantity gives the negative (lower) error bar on $R_{\mathrm{wall}}$,
    so the confidence interval is $[R_{\mathrm{wall}} - \delta R_{\mathrm{low}},\;
    R_{\mathrm{wall}} + \delta R_{\mathrm{up}}]$ where $\delta R_{\mathrm{low}}$ is
    this field in meters and $\delta R_{\mathrm{up}}$ is the upper uncertainty companion.
    Asymmetric error bars arise from non-Gaussian distributions in disruption equilibrium
    reconstruction or from discrete wall-tile geometry. The value is non-negative
    and shares the unit (m) of the parent quantity. See [major_radius_of_active_wall_point](name:major_radius_of_active_wall_point)
    for the central value and [upper_uncertainty_of_major_radius_of_active_wall_point](name:upper_uncertainty_of_major_radius_of_active_wall_point)
    for the upper error bound.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - disruption-prediction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_minor_radius_of_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the minor-radius location
    of the rational surface at the center of a neoclassical tearing mode (NTM).
  documentation: "This field provides the negative error bar for the toroidal minor-radius\
    \ coordinate $\\rho_{\\mathrm{tor}}$ of the NTM rational surface, representing\
    \ the downward deviation from the nominal value. In NTM detection and tracking\
    \ systems (e.g., based on ECE or magnetic pickup coils), uncertainties arise from\
    \ profile fitting, equilibrium mapping, and temporal resolution of the island\
    \ O-point position. The stored value is a non-negative offset such that the lower\
    \ confidence bound is $\\rho_{\\mathrm{tor}} - \\Delta\\rho_{\\mathrm{lower}}$.\
    \ Combined with the upper uncertainty, the full asymmetric confidence interval\
    \ is recovered. Relevant NTM rational surfaces are at $q = 3/2$ and $q = 2/1$,\
    \ corresponding to $\\rho_{\\mathrm{tor}} \\approx 0.4$\u2013$0.8$ m depending\
    \ on device size. See also [minor_radius_of_neoclassical_tearing_mode_center](name:minor_radius_of_neoclassical_tearing_mode_center)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_poloidal_magnetic_flux_of_magnetic_axis
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the poloidal magnetic
    flux at the magnetic axis.
  documentation: This quantity is the negative (lower) error bar on [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis).
    The asymmetric confidence interval is $[\psi_{\mathrm{axis}} - \delta\psi_{\mathrm{lower}},\;
    \psi_{\mathrm{axis}} + \delta\psi_{\mathrm{upper}}]$, with $\delta\psi_{\mathrm{lower}}$
    given by this field. Uncertainty in $\psi_{\mathrm{axis}}$ propagates directly
    into the normalized poloidal flux coordinate $\psi_N$, affecting all quantities
    mapped to that radial grid. Sources of uncertainty include the finite spatial
    resolution of the equilibrium reconstruction and errors in the pressure and current-density
    profile constraints. See also [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)
    and [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate).
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_poloidal_magnetic_flux_of_plasma_boundary
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the poloidal magnetic
    flux at the plasma boundary.
  documentation: This quantity is the negative (lower) error bar on the poloidal magnetic
    flux $\psi_{\mathrm{bnd}}$ evaluated at the last closed flux surface (plasma boundary).
    The true boundary flux is expected within $[\psi_{\mathrm{bnd}} - \delta\psi_{\mathrm{lower}},\;
    \psi_{\mathrm{bnd}} + \delta\psi_{\mathrm{upper}}]$, where $\delta\psi_{\mathrm{lower}}$
    is this field. Uncertainty in $\psi_{\mathrm{bnd}}$ arises from imprecise X-point
    location, limiter-contact identification, and errors in external magnetic measurements
    propagated through the equilibrium reconstruction. This value is used to normalize
    1-D radial grids when the grid extends from the magnetic axis to the separatrix.
    See also [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)
    and [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate).
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_power_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the total ohmic power
    dissipated in the plasma by resistive heating of the current-carrying medium.
  documentation: "This field provides the negative-side error bar for the total ohmic\
    \ dissipation power $P_{\\Omega}$, representing the downward deviation from the\
    \ nominal value. The ohmic power is given by $P_{\\Omega} = \\int \\eta j^2 \\\
    , dV$, where $\\eta$ is the plasma resistivity (in $\\Omega\\cdot\\mathrm{m}$),\
    \ $j$ is the current density (in $\\mathrm{A/m^2}$), and the integral is taken\
    \ over the plasma volume. When the error distribution is asymmetric\u2014for instance\
    \ due to uncertainty in resistivity profile reconstructions or current-density\
    \ inversions\u2014the lower and upper bounds differ. Combined with the upper uncertainty,\
    \ the full asymmetric confidence interval on $P_{\\Omega}$ is recovered. Values\
    \ are in watts and are non-negative offsets subtracted from the nominal power.\
    \ See also [halo_region_ohmic_power](name:halo_region_ohmic_power) for ohmic dissipation\
    \ in the halo region during disruptions."
  unit: W
  tags:
  - energy-balance
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_seed_island_width_at_ntm_onset
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the seed island full width
    at NTM onset.
  documentation: This quantity represents the negative (lower) error bar on [seed_island_width_at_ntm_onset](name:seed_island_width_at_ntm_onset),
    expressed in meters. The actual seed-island width lies in the interval $[w_{\mathrm{seed}}
    - \sigma_{\mathrm{low}},\; w_{\mathrm{seed}} + \sigma_{\mathrm{up}}]$, where $\sigma_{\mathrm{low}}$
    is this standard name and $\sigma_{\mathrm{up}}$ is [upper_uncertainty_of_seed_island_width_at_ntm_onset](name:upper_uncertainty_of_seed_island_width_at_ntm_onset).
    Asymmetric error bars arise because the island-width diagnostic (ECE imaging,
    magnetic probes) has non-Gaussian systematic uncertainties, particularly near
    the detection threshold. This value must be non-negative; a value of zero indicates
    that only the upper error bar is meaningful.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_toroidal_component_of_magnetic_field
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the toroidal component
    of the magnetic field $B_\phi$.
  documentation: "This quantity represents the lower (negative-side) error bar on\
    \ the toroidal magnetic-field component $B_\\phi = \\mathbf{B} \\cdot \\hat{\\\
    phi}$, where $\\hat{\\phi}$ is the unit vector in the geometric toroidal direction.\
    \ The uncertainty is expressed in tesla and captures measurement or reconstruction\
    \ errors; the true value is expected to lie in the interval $[B_\\phi - \\Delta\
    \ B_{\\phi,\\mathrm{lower}},\\; B_\\phi + \\Delta B_{\\phi,\\mathrm{upper}}]$.\
    \ Sources of uncertainty include sensor calibration errors in ferritic-insert\
    \ magnetometry, finite-element discretization in field mapping, and signal noise.\
    \ For ferritic structural components in tokamaks, residual toroidal field perturbations\
    \ of order 1\u201350 mT are common, with uncertainties on the order of 0.1\u2013\
    1 mT. See also [upper_uncertainty_of_toroidal_component_of_magnetic_field](name:upper_uncertainty_of_toroidal_component_of_magnetic_field)\
    \ for the upper bound."
  unit: T
  tags:
  - measured
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_active_wall_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the point on the wall that actively
    intercepts halo currents during a disruption.
  documentation: "During a tokamak disruption the plasma boundary can contact the\
    \ first wall, and halo currents flow through the vessel at discrete interaction\
    \ points. The major radius $R_{\\mathrm{wall}}$ (in meters) of such an active\
    \ wall point locates the $R$ coordinate of this contact in a cylindrical $(R,\
    \ \\phi, Z)$ system. Knowledge of $R_{\\mathrm{wall}}$ is essential for computing\
    \ electromagnetic forces on the vessel and for halo-current modeling in disruption\
    \ codes such as DINA or JOREK. For medium-size tokamaks (JET, DIII-D), wall-point\
    \ $R$ values span roughly 1.0\u20134.0 m; for ITER the range is approximately\
    \ 4.0\u20138.5 m. The quantity is derived from equilibrium reconstruction or MHD\
    \ simulation output combined with the machine wall geometry. See also [lower_uncertainty_of_major_radius_of_active_wall_point](name:lower_uncertainty_of_major_radius_of_active_wall_point)\
    \ and [upper_uncertainty_of_major_radius_of_active_wall_point](name:upper_uncertainty_of_major_radius_of_active_wall_point)\
    \ for the associated error bounds."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - disruption-prediction
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: mass_density_on_ggd
  kind: scalar
  status: draft
  description: Total plasma mass density stored on a generalized grid description
    (GGD), representing the summed ion mass contributions per unit volume.
  documentation: "The mass density $\\rho = \\sum_s n_s m_s$ (kg m$^{-3}$) sums over\
    \ all ion species $s$ with number density $n_s$ (m$^{-3}$) and mass $m_s$ (kg);\
    \ the electron contribution is negligible by mass ratio. This quantity is fundamental\
    \ for MHD calculations: it enters the Alfv\xE9n speed $v_A = B / \\sqrt{\\mu_0\
    \ \\rho}$, growth rate estimates of ideal MHD modes, and the inertia term $\\\
    rho \\, d\\mathbf{v}/dt$ in the momentum equation. Stored on a GGD mesh, the field\
    \ resolves complex geometries including the separatrix, X-point region, and scrape-off\
    \ layer without requiring flux-surface alignment. In deuterium-tritium tokamak\
    \ cores, $\\rho$ ranges from $10^{-7}$ to $10^{-5}$ kg m$^{-3}$ depending on density\
    \ and composition. See also [electron_temperature_on_ggd](name:electron_temperature_on_ggd)\
    \ and [electrostatic_potential_on_ggd](name:electrostatic_potential_on_ggd)."
  unit: kg.m^-3
  cocos_transformation_type: one_like
  tags:
  - flux-coordinates
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: mhd_mode_amplitude_multiplier
  kind: scalar
  status: draft
  description: Dimensionless scaling factor converting a linear MHD eigenmode structure
    to the amplitude of a nonlinearly saturated mode in physical units.
  documentation: The amplitude multiplier $A_{\mathrm{mult}}$ is a dimensionless scalar
    applied to the normalized eigenfunction from a linear MHD stability calculation,
    so that the product yields the physical perturbation amplitude of the saturated
    mode. Linear codes output mode structures with an arbitrary normalization (e.g.,
    unity maximum displacement); $A_{\mathrm{mult}}$ encodes the saturation level
    determined by nonlinear physics, experimental measurement, or prescribed scenario
    input. When the field is empty or unity, the stored mode structure already represents
    the physical amplitude. The multiplier is essential for coupling linear MHD output
    to transport or synthetic-diagnostic workflows. See also [toroidal_mode_growth_rate](name:toroidal_mode_growth_rate)
    for the associated linear growth rate and [perturbed_potential_energy](name:perturbed_potential_energy)
    for the mode energy.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - benchmark-quantity
  - integrated-modeling
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: minor_radius_of_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Toroidal flux coordinate $\rho_{\mathrm{tor}}$ (in meters) of the rational
    surface at which a neoclassical tearing mode (NTM) is centered.
  documentation: "Neoclassical tearing modes (NTMs) form magnetic islands at rational\
    \ surfaces $q = m/n$ where $m$ and $n$ are poloidal and toroidal mode numbers.\
    \ This quantity records the radial location of the island O-point expressed as\
    \ $\\rho_{\\mathrm{tor}} = \\sqrt{\\Phi_{\\mathrm{tor}} / (\\pi B_0)}$ (in meters),\
    \ where $\\Phi_{\\mathrm{tor}}$ is the toroidal magnetic flux and $B_0$ the vacuum\
    \ toroidal field. Identifying $\\rho_{\\mathrm{tor}}$ of the NTM center is essential\
    \ for targeting electron cyclotron current drive (ECCD) stabilization. In standard\
    \ H-mode scenarios the 2/1 and 3/2 NTMs sit at $\\rho_{\\mathrm{tor}} \\approx\
    \ 0.4$\u20130.8 of the plasma minor radius. The position is determined from electron\
    \ cyclotron emission (ECE) or soft X-ray diagnostics combined with equilibrium\
    \ mapping. See also [tendency_of_neoclassical_tearing_mode_island_width](name:tendency_of_neoclassical_tearing_mode_island_width)\
    \ and [upper_uncertainty_of_minor_radius_of_neoclassical_tearing_mode_center](name:upper_uncertainty_of_minor_radius_of_neoclassical_tearing_mode_center)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: neoclassical_tearing_mode_onset_time_offset
  kind: scalar
  status: draft
  description: Time offset marking the disappearance of a neoclassical tearing mode
    (NTM) island after its initial onset.
  documentation: The NTM onset time offset $\Delta t_{\mathrm{off}}$ records when
    a previously detected neoclassical tearing mode disappears (is fully suppressed
    or decays below detection threshold), measured relative to the base time vector
    of the simulation or experiment. If the same mode reappears later, a separate
    mode index is used, making this field unambiguous within its array entry. The
    quantity is relevant for characterizing the duty cycle of NTM activity and for
    evaluating the efficacy of stabilization techniques such as electron cyclotron
    current drive (ECCD) applied at the rational surface. Values range from milliseconds
    (for transient modes in high-beta plasmas) to seconds (for persistent modes suppressed
    by active control). See also [minor_radius_of_neoclassical_tearing_mode_center](name:minor_radius_of_neoclassical_tearing_mode_center)
    for the radial location and [tendency_of_neoclassical_tearing_mode_island_width](name:tendency_of_neoclassical_tearing_mode_island_width)
    for the island growth rate.
  unit: s
  cocos_transformation_type: one_like
  tags:
  - disruption-prediction
  - mhd-stability-analysis
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: neoclassical_toroidal_viscosity_stress_tensor_real_part
  kind: tensor
  status: draft
  description: Real part of the neoclassical toroidal viscosity (NTV) stress tensor
    arising from non-axisymmetric magnetic perturbations.
  documentation: The NTV stress tensor $\Pi_{\mathrm{NTV}}$ (in N/m$^2$ = Pa) quantifies
    the toroidal momentum dissipation exerted on the plasma by the interaction of
    trapped particles with non-axisymmetric field perturbations. The real part represents
    the in-phase component of the complex Fourier-decomposed stress for a given toroidal
    mode number $n$. The NTV torque density is $T_{\mathrm{NTV}} = -\nabla \cdot \Pi_{\mathrm{NTV}}$
    and acts as a braking mechanism on plasma rotation, playing a critical role in
    error-field penetration and mode locking. Computed by neoclassical drift-kinetic
    codes (e.g., FORTEC-3D, POCA, NTV-related modules in TRANSP), the stress depends
    on plasma collisionality regime ($\nu$-$\sqrt{\nu}$, superbanana-plateau). The
    field is stored per radial position and resolved by toroidal mode. See also [toroidal_mode_growth_rate](name:toroidal_mode_growth_rate)
    for the linear mode growth and [mhd_mode_amplitude_multiplier](name:mhd_mode_amplitude_multiplier)
    for converting linear mode amplitudes to physical units.
  unit: N.m^-2
  tags:
  - fourier-component
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: ohmic_power_due_to_halo_currents
  kind: scalar
  status: draft
  description: Resistive power dissipated in the halo region attributed specifically
    to the halo-current circuit during a disruption.
  documentation: This quantity records the ohmic power $P_{\Omega} = \int \eta\, |\mathbf{j}_{\mathrm{halo}}|^2\,
    dV$ (in watts) dissipated by the halo currents flowing along open field lines
    in the scrape-off and halo regions during a disruption, where $\eta$ is the local
    resistivity (in $\Omega\cdot$m) and $\mathbf{j}_{\mathrm{halo}}$ is the halo current
    density (in A/m$^2$). The process attribution `_due_to_halo_currents` distinguishes
    this from other ohmic contributions (e.g., confined plasma or vessel eddy currents).
    Halo currents arise when the plasma boundary shrinks during a vertical displacement
    event, diverting toroidal and poloidal current through the surrounding low-temperature
    plasma. Computed by disruption simulation codes (DINA, TSC, JOREK); values can
    reach tens of MW in ITER-class devices. See also [halo_region_poloidal_current](name:halo_region_poloidal_current)
    for the current driving the dissipation and [halo_region_parallel_energy_due_to_heat_flux](name:halo_region_parallel_energy_due_to_heat_flux)
    for the cumulative parallel energy channel.
  unit: W
  tags:
  - disruption-prediction
  - energy-balance
  - ohmic-heating
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_fast_electron_pressure
  kind: vector
  status: draft
  description: Pressure exerted by the non-thermal (fast) electron population in the
    direction parallel to the magnetic field.
  documentation: "The fast-electron parallel pressure $p_{e,\\parallel}^{\\mathrm{fast}}$\
    \ (in Pa) is the second velocity moment of the supra-thermal electron distribution\
    \ function projected along $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$: $p_{e,\\parallel}^{\\\
    mathrm{fast}} = m_e \\int f_e^{\\mathrm{fast}} \\, v_{\\parallel}^2 \\, d^3v$.\
    \ It contributes to pressure anisotropy which modifies the MHD equilibrium force\
    \ balance and can destabilize fishbone and internal kink modes. In sawtooth-relevant\
    \ scenarios with strong electron cyclotron or lower-hybrid heating, $p_{e,\\parallel}^{\\\
    mathrm{fast}}$ can reach 1\u201310 kPa in the core. The quantity is used in extended-MHD\
    \ stability codes (MISHKA, MARS-F) and Fokker\u2013Planck solvers (CQL3D, LUKE).\
    \ See also [parallel_component_of_fast_ion_pressure](name:parallel_component_of_fast_ion_pressure)\
    \ for the ion counterpart."
  unit: Pa
  tags:
  - auxiliary-heated
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_fast_ion_pressure
  kind: vector
  status: draft
  description: Projection of the fast (non-thermal) total ion pressure tensor onto
    the magnetic-field direction, summed over all ion species.
  documentation: "The parallel fast-ion pressure $p_{\\|,\\mathrm{fast}} = \\sum_s\
    \ \\int m_s v_{\\|}^2 f_s^{\\mathrm{fast}}\\, d^3v$ is the second velocity-space\
    \ moment of the non-thermal ion distribution function $f_s^{\\mathrm{fast}}$ projected\
    \ along $\\mathbf{b} = \\mathbf{B}/B$, where $m_s$ is the ion mass of species\
    \ $s$ and $v_{\\|}$ is the velocity component parallel to $\\mathbf{B}$. Fast\
    \ ions originate from neutral-beam injection, ion-cyclotron resonance heating,\
    \ or fusion-born alpha particles. The parallel fast-ion pressure enters the MHD\
    \ force balance through the pressure anisotropy term $(p_{\\|} - p_{\\perp})\\\
    mathbf{b}\\mathbf{b}\\cdot\\nabla\\ln B$ in the anisotropic equilibrium equation.\
    \ In sawtooth-relevant profiles, $p_{\\|,\\mathrm{fast}}$ can reach 10\u2013100\
    \ kPa in the core, comparable to or exceeding the thermal pressure gradient. It\
    \ is computed by Monte-Carlo orbit-following codes (NUBEAM, ASCOT, SPIRAL) or\
    \ Fokker\u2013Planck solvers. See also [ion_pressure](name:ion_pressure) for the\
    \ total (thermal + non-thermal) ion pressure."
  unit: Pa
  tags:
  - auxiliary-heated
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_plasma_velocity_on_ggd
  kind: vector
  status: draft
  description: Projection of the bulk plasma velocity onto the magnetic-field direction,
    stored on a generalized grid description (GGD) mesh.
  documentation: "The parallel plasma velocity $v_\\parallel = \\mathbf{v} \\cdot\
    \ \\hat{b}$ (in m s$^{-1}$), where $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the\
    \ unit vector along the magnetic field and $\\mathbf{v}$ is the center-of-mass\
    \ fluid velocity, governs parallel momentum transport and Pfirsch\u2013Schl\xFC\
    ter flows. On the GGD mesh one scalar value is provided per grid element, allowing\
    \ faithful representation of complex X-point and divertor geometries used in extended-MHD\
    \ and edge-transport simulations (e.g., JOREK, SOLPS-ITER). In the scrape-off\
    \ layer, $v_\\parallel$ approaches the ion sound speed $c_s = \\sqrt{(T_e + T_i)/m_i}$\
    \ at the divertor sheath entrance (Bohm criterion). Core values are set by toroidal\
    \ rotation (order $10^4$\u2013$10^5$ m s$^{-1}$ in beam-heated plasmas). See [radial_component_of_plasma_velocity_on_ggd](name:radial_component_of_plasma_velocity_on_ggd)\
    \ and [toroidal_component_of_plasma_velocity_on_ggd](name:toroidal_component_of_plasma_velocity_on_ggd)\
    \ for complementary components."
  unit: m.s^-1
  tags:
  - simulated
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_runaway_electron_current_density
  kind: vector
  status: draft
  description: Flux-surface-averaged runaway-electron current density projected along
    the magnetic field, defined as $\langle \mathbf{j}_{\rm RE} \cdot \mathbf{B} \rangle
    / B_0$.
  documentation: "The parallel runaway-electron current density $j_{\\rm RE,\\parallel}\
    \ = \\langle \\mathbf{j}_{\\rm RE} \\cdot \\mathbf{B} \\rangle / B_0$ characterizes\
    \ the current carried by supra-thermal electrons accelerated beyond the Dreicer\
    \ field $E_D = n_e e^3 \\ln\\Lambda / (4\\pi \\varepsilon_0^2 m_e c^2)$, where\
    \ $n_e$ is the electron density, $e$ the elementary charge, $\\ln\\Lambda$ the\
    \ Coulomb logarithm, $\\varepsilon_0$ the vacuum permittivity, $m_e$ the electron\
    \ mass, and $c$ the speed of light. Here $B_0$ is the vacuum toroidal field at\
    \ the magnetic axis and $\\langle \\cdot \\rangle$ denotes a flux-surface average.\
    \ During disruptions, $j_{\\rm RE,\\parallel}$ can reach $10^6$\u2013$10^7$ A/m$^2$,\
    \ carrying a significant fraction of the pre-disruption plasma current and posing\
    \ a severe threat to in-vessel components upon loss of confinement. The quantity\
    \ is computed by kinetic runaway codes (e.g., DREAM, CQL3D-RE) or estimated from\
    \ hard X-ray emission and synchrotron radiation diagnostics. See also [electron_temperature_on_ggd](name:electron_temperature_on_ggd)\
    \ and [alfven_time](name:alfven_time)."
  unit: A.m^-2
  tags:
  - disruption-prediction
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_total_current_density
  kind: vector
  status: draft
  description: Total plasma current density projected along the magnetic field, defined
    as $\langle \mathbf{j}_{\mathrm{tot}} \cdot \mathbf{B} \rangle / B_0$.
  documentation: "The parallel total current density $j_{\\parallel,\\mathrm{tot}}\
    \ = \\langle \\mathbf{j}_{\\mathrm{tot}} \\cdot \\mathbf{B} \\rangle / B_0$ represents\
    \ the flux-surface-averaged projection of the full current density vector onto\
    \ the magnetic-field direction, normalized by the vacuum toroidal field $B_0$\
    \ (in T) at the magnetic axis. It includes all current-drive mechanisms: ohmic,\
    \ bootstrap, neutral-beam-driven, and RF-driven components. This definition removes\
    \ the $1/R$ geometric weighting inherent in the toroidal current density, making\
    \ it the natural quantity for stability and transport analyses. In tokamak H-mode\
    \ plasmas, peak values are on the order of $10^5$\u2013$10^7$ A m$^{-2}$. Measured\
    \ indirectly through equilibrium reconstruction constrained by external magnetics\
    \ and motional-Stark-effect polarimetry. See [ohmic_current_density_parallel](name:ohmic_current_density_parallel)\
    \ for the resistive component, [parallel_electric_field](name:parallel_electric_field)\
    \ for the driving field, and [parallel_electrical_conductivity](name:parallel_electrical_conductivity)\
    \ for the Ohm's-law relationship $j_{\\parallel,\\mathrm{Ohm}} = \\sigma_\\parallel\
    \ E_\\parallel$."
  unit: A.m^-2
  tags:
  - equilibrium-reconstruction
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_total_pressure
  kind: vector
  status: draft
  description: Component of the total plasma pressure tensor (electrons + ions, thermal
    + non-thermal) projected along the magnetic-field direction.
  documentation: "The total parallel pressure $p_{\\|} = p_{\\|,e} + \\sum_s p_{\\\
    |,s}$ aggregates the electron and all ion species contributions, including both\
    \ thermal and non-thermal (fast) populations. It is defined as $p_{\\|} = \\sum_\\\
    alpha \\int m_\\alpha v_{\\|}^2 f_\\alpha\\, d^3v$, where $\\alpha$ runs over\
    \ all species, $m_\\alpha$ is the particle mass, $v_{\\|}$ the field-aligned velocity,\
    \ and $f_\\alpha$ the distribution function. In an isotropic plasma $p_{\\|} =\
    \ p_{\\perp} = p$, but fast-ion populations and strong ICRH heating induce anisotropy\
    \ with $p_{\\|} \\neq p_{\\perp}$. The anisotropic MHD equilibrium satisfies $\\\
    mathbf{J} \\times \\mathbf{B} = \\nabla p_{\\perp} + (p_{\\|} - p_{\\perp})(\\\
    mathbf{b}\\cdot\\nabla)\\mathbf{b} + \\mathbf{b}\\,\\mathbf{b}\\cdot\\nabla(p_{\\\
    |} - p_{\\perp})$. Core values range from 10 kPa in medium-size devices to 0.5\u2013\
    1 MPa in burning-plasma scenarios. This quantity is used in sawtooth crash modeling\
    \ and resistive MHD stability analysis. See also [parallel_component_of_fast_ion_pressure](name:parallel_component_of_fast_ion_pressure)\
    \ and [ion_pressure](name:ion_pressure)."
  unit: Pa
  tags:
  - energy-balance
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_electrical_conductivity
  kind: scalar
  status: draft
  description: Electrical conductivity of the plasma along the magnetic-field direction,
    governing the ohmic current response to the parallel electric field.
  documentation: "The parallel electrical conductivity $\\sigma_{\\parallel}$ (in\
    \ $\\Omega^{-1}$ m$^{-1}$) relates the parallel current density to the parallel\
    \ electric field via $j_{\\parallel} = \\sigma_{\\parallel} E_{\\parallel}$. In\
    \ a fully ionized hydrogen plasma, the classical Spitzer value is $\\sigma_{\\\
    mathrm{Sp}} \\approx 1.96 \\, n_e e^2 / (m_e \\nu_{ei})$, where $\\nu_{ei}$ is\
    \ the electron\u2013ion collision frequency; neoclassical corrections (trapped-particle\
    \ effects) reduce this by a factor $(1 - f_t)^{1/2}$ with $f_t$ the trapped-particle\
    \ fraction. For core electron temperatures of 1\u201320 keV, $\\sigma_{\\parallel}$\
    \ ranges from $10^7$ to $10^9$ $\\Omega^{-1}$ m$^{-1}$. The profile is an essential\
    \ input to current-diffusion and sawtooth-crash modeling. See also [ohmic_current_density_parallel](name:ohmic_current_density_parallel)\
    \ and [parallel_electric_field](name:parallel_electric_field)."
  unit: m^-1.ohm^-1
  tags:
  - flux-surface-average
  - spatial-profile
  - transport-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_electrostatic_potential_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex Fourier amplitude of the perturbed electrostatic
    potential $\tilde{\Phi}$ for a given toroidal mode number.
  documentation: In linear MHD stability analysis, the electrostatic potential perturbation
    $\tilde{\Phi}(\psi, \theta)$ is decomposed into toroidal Fourier harmonics $\tilde{\Phi}_n
    = \mathrm{Re}(\tilde{\Phi}_n) + i\,\mathrm{Im}(\tilde{\Phi}_n)$, where $n$ is
    the toroidal mode number. This standard name stores $\mathrm{Im}(\tilde{\Phi}_n)$
    in volts. The perturbed electrostatic potential drives $E \times B$ flows via
    $\delta \mathbf{v}_{E} = \mathbf{B} \times \nabla \tilde{\Phi} / B^2$ and enters
    the vorticity equation coupling MHD and electrostatic physics. It is computed
    by linear MHD codes such as CASTOR, MISHKA, or MARS-F on a poloidal cross-section
    grid. Combining with [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part)
    yields the full complex amplitude $|\tilde{\Phi}_n| = \sqrt{\mathrm{Re}^2 + \mathrm{Im}^2}$.
    Perturbation amplitudes are normalized to the equilibrium potential in many codes;
    absolute values depend on the eigenmode normalization convention.
  unit: V
  tags:
  - fourier-component
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_electrostatic_potential_real_part
  kind: complex
  status: draft
  description: Real part of the complex Fourier amplitude of the perturbed electrostatic
    potential $\tilde{\Phi}$ for a given toroidal mode number.
  documentation: In linear MHD stability calculations, perturbations are expanded
    in toroidal Fourier harmonics $\propto e^{in\phi}$, where $\phi$ is the toroidal
    angle and $n$ the toroidal mode number. The perturbed electrostatic potential
    $\tilde{\Phi}_n(\psi, \theta)$ is represented as a complex field; this standard
    name stores $\mathrm{Re}(\tilde{\Phi}_n)$ in volts on the $(\psi, \theta)$ computational
    grid. The electrostatic potential perturbation couples to the perturbed $E \times
    B$ drift $\delta \mathbf{v}_E = \mathbf{B} \times \nabla \tilde{\Phi} / B^2$ and
    appears in the linearized vorticity equation. Codes such as CASTOR, MISHKA, MARS-F,
    and KINX produce this quantity as part of the eigenmode solution. The full complex
    amplitude is recovered by combining with [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part).
    Absolute magnitude depends on the eigenmode normalization convention chosen by
    the code.
  unit: V
  tags:
  - fourier-component
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_mass_density_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex Fourier amplitude of the perturbed plasma
    mass density $\tilde{\rho}$ for a given toroidal mode number.
  documentation: In linear MHD eigenmode analysis, the mass density perturbation is
    decomposed into toroidal Fourier harmonics $\tilde{\rho}_n(\psi, \theta) = \mathrm{Re}(\tilde{\rho}_n)
    + i\,\mathrm{Im}(\tilde{\rho}_n)$, where $n$ is the toroidal mode number, $\psi$
    the poloidal flux, and $\theta$ the poloidal angle. This standard name stores
    $\mathrm{Im}(\tilde{\rho}_n)$ in kg m$^{-3}$. The perturbed mass density enters
    the linearized continuity equation $\partial \tilde{\rho}/\partial t + \nabla
    \cdot (\rho_0 \tilde{\mathbf{v}} + \tilde{\rho}\, \mathbf{v}_0) = 0$, where $\rho_0$
    is the equilibrium mass density and $\tilde{\mathbf{v}}$ is the perturbed velocity.
    Compressional effects are captured when $\tilde{\rho} \neq 0$; in the incompressible
    limit $\tilde{\rho} = 0$. Computed by linear MHD stability codes (CASTOR, MARS-F,
    MISHKA). The full complex perturbation is recovered by combining with [perturbed_mass_density_real_part](name:perturbed_mass_density_real_part).
    See also [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part)
    for another perturbed field in the same eigenmode.
  unit: kg.m^-3
  tags:
  - fourier-component
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_mass_density_real_part
  kind: complex
  status: draft
  description: Real part of the complex Fourier amplitude of the perturbed plasma
    mass density $\tilde{\rho}$ for a given toroidal mode number.
  documentation: In linear MHD stability analysis, plasma perturbations are expanded
    in toroidal Fourier harmonics $\propto e^{in\phi}$. The perturbed mass density
    $\tilde{\rho}_n(\psi, \theta)$ is a complex field on the poloidal cross-section;
    this standard name stores $\mathrm{Re}(\tilde{\rho}_n)$ in kg m$^{-3}$. The perturbed
    mass density appears in the linearized continuity equation $\partial \tilde{\rho}/\partial
    t + \nabla \cdot (\rho_0 \tilde{\mathbf{v}}) + \nabla \cdot (\tilde{\rho}\, \mathbf{v}_0)
    = 0$, where $\rho_0$ is the equilibrium mass density and $\tilde{\mathbf{v}}$
    is the perturbed plasma velocity. Non-zero $\tilde{\rho}$ indicates compressible
    perturbations, relevant for ballooning modes and fast magnetoacoustic waves. Produced
    by linear MHD eigenvalue codes such as CASTOR, MARS-F, and MISHKA. Combine with
    [perturbed_mass_density_imaginary_part](name:perturbed_mass_density_imaginary_part)
    to obtain the full complex amplitude. See also [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part).
  unit: kg.m^-3
  tags:
  - fourier-component
  - mhd-stability-analysis
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_plasma_temperature_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex Fourier amplitude of the perturbed plasma
    temperature for a given toroidal mode number.
  documentation: In linear MHD eigenmode analysis, the plasma temperature perturbation
    $\delta T$ is decomposed into toroidal Fourier harmonics $\delta T(r,\theta,\phi)
    = \sum_n \hat{T}_n(r,\theta)\,e^{in\phi}$, where $n$ is the toroidal mode number,
    $r$ is a radial-like coordinate, $\theta$ is the poloidal angle, and $\phi$ is
    the toroidal angle. This quantity stores $\mathrm{Im}(\hat{T}_n)$ in electronvolts
    for a specific $n$. Together with the real part [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part),
    it fully specifies the complex perturbation amplitude. The imaginary component
    encodes the phase offset of the temperature perturbation relative to other perturbed
    fields (displacement, pressure, magnetic field). Computed by linear MHD stability
    codes (e.g., MISHKA, CASTOR, KINX). See also [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part)
    for the corresponding electrostatic potential perturbation.
  unit: eV
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_plasma_temperature_real_part
  kind: complex
  status: draft
  description: Real part of the complex Fourier amplitude of the perturbed plasma
    temperature for a single toroidal mode in a linear MHD eigenmode analysis.
  documentation: In linearized MHD stability codes the equilibrium temperature $T_0$
    is perturbed by $\delta T(R, Z) \exp(i n \phi)$, where $n$ is the toroidal mode
    number and $\phi$ the toroidal angle. This quantity stores $\mathrm{Re}(\delta
    T)$ in eV on the $(R, Z)$ computational grid for a given $n$. Together with [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part),
    the full complex perturbation is recovered as $\delta T = \mathrm{Re}(\delta T)
    + i\,\mathrm{Im}(\delta T)$, and the physical perturbation in real space is $\delta
    T_{\mathrm{phys}} = \mathrm{Re}[\delta T \exp(i n \phi)]$. The amplitude depends
    on the normalization convention of the eigenmode solver; absolute values are meaningful
    only relative to other perturbed fields in the same eigenmode (e.g., pressure,
    displacement, magnetic field). See also [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part)
    and [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part).
  unit: eV
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: perturbed_potential_energy
  kind: scalar
  status: draft
  description: Energy associated with a linear MHD perturbation mode, combining kinetic
    and potential contributions from the perturbed equilibrium.
  documentation: The perturbed potential energy $\delta W$ (in joules) is the total
    energy content of a linear MHD eigenmode, computed as a volume integral of the
    perturbed field and pressure work over the plasma domain. In the energy principle
    of ideal MHD, $\delta W = \frac{1}{2}\int (|\delta \mathbf{B}|^2/\mu_0 + \gamma
    p |\nabla \cdot \boldsymbol{\xi}|^2 - (\boldsymbol{\xi} \cdot \nabla p)(\boldsymbol{\xi}^*
    \cdot \boldsymbol{\kappa}) + \ldots)\,dV$, where $\delta\mathbf{B}$ is the perturbed
    magnetic field, $\mu_0$ is the vacuum permeability, $\gamma$ is the adiabatic
    index, $p$ is the equilibrium pressure, $\boldsymbol{\xi}$ is the plasma displacement
    vector, and $\boldsymbol{\kappa}$ is the magnetic curvature vector. A negative
    $\delta W$ indicates an unstable mode. The quantity is produced by linear MHD
    stability codes such as MISHKA, CASTOR, or KINX, and is used to assess stability
    boundaries for kink, ballooning, and interchange modes. See also [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part)
    for the electrostatic perturbation component.
  unit: J
  tags:
  - global-quantity
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_component_of_halo_current
  kind: vector
  status: draft
  description: Projection of the halo current vector onto the poloidal direction,
    quantifying current flowing poloidally through the open-field-line halo region
    during a disruption.
  documentation: "The poloidal halo current $I_{\\mathrm{halo,pol}}$ represents the\
    \ component of the disruption-driven halo current that flows in the poloidal plane.\
    \ During a vertical displacement event (VDE) or thermal quench, the confined plasma\
    \ shrinks and current transfers onto open field lines intersecting the vessel\
    \ wall; the resulting halo current has both poloidal and toroidal components.\
    \ The poloidal component is critical for determining electromagnetic loads on\
    \ plasma-facing components because it closes through the vacuum vessel and generates\
    \ forces via $\\mathbf{F} = \\mathbf{J}_{\\mathrm{halo}} \\times \\mathbf{B}$,\
    \ where $\\mathbf{J}_{\\mathrm{halo}}$ is the halo current density (A m$^{-2}$)\
    \ and $\\mathbf{B}$ is the local magnetic field (T). Peak poloidal halo currents\
    \ can reach 20\u201340% of the pre-disruption plasma current $I_p$ in large tokamaks.\
    \ The toroidal peaking factor (TPF), defined as the ratio of maximum local halo\
    \ current density to the toroidally averaged value, further amplifies local wall\
    \ forces. Measured via Rogowski coils, shunt resistors, or tile current sensors\
    \ embedded in divertor structures. See also [halo_region_poloidal_current](name:halo_region_poloidal_current)\
    \ and [halo_region_ohmic_power](name:halo_region_ohmic_power)."
  unit: A
  tags:
  - disruption-prediction
  - global-quantity
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_magnetic_flux_of_magnetic_axis
  kind: scalar
  status: draft
  description: Poloidal magnetic flux $\psi$ evaluated at the magnetic axis, where
    $\nabla\psi = 0$ identifies the innermost flux surface.
  documentation: The poloidal magnetic flux at the magnetic axis, $\psi_{\mathrm{axis}}$,
    is defined as the value of $\psi(R, Z)$ at the O-point of the poloidal flux map,
    i.e., where $\nabla\psi = 0$ inside the plasma. Together with the boundary value
    $\psi_{\mathrm{bnd}}$, it sets the normalization for the dimensionless poloidal
    flux coordinate $\psi_N = (\psi - \psi_{\mathrm{axis}}) / (\psi_{\mathrm{bnd}}
    - \psi_{\mathrm{axis}})$ (see [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)).
    In COCOS conventions the absolute value and sign of $\psi$ depend on the chosen
    coordinate system; users should verify consistency with the COCOS index of the
    source data. Obtained from equilibrium reconstruction codes (EFIT, LIUQE, CLISTE).
    See also [lower_uncertainty_of_poloidal_magnetic_flux_of_magnetic_axis](name:lower_uncertainty_of_poloidal_magnetic_flux_of_magnetic_axis).
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: poloidal_magnetic_flux_of_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at the last closed flux surface (plasma
    boundary), used as an edge reference for flux normalization.
  documentation: "The poloidal magnetic flux at the plasma boundary $\\psi_{\\mathrm{bnd}}$\
    \ is the value of the flux function $\\psi$ (in Wb) on the separatrix or last\
    \ closed flux surface (LCFS). Together with the on-axis value $\\psi_{\\mathrm{axis}}$,\
    \ it defines the normalized poloidal flux coordinate $\\hat{\\psi} = (\\psi -\
    \ \\psi_{\\mathrm{axis}}) / (\\psi_{\\mathrm{bnd}} - \\psi_{\\mathrm{axis}})$,\
    \ which maps every interior flux surface to the range $[0,1]$. In diverted plasmas\
    \ the boundary coincides with the X-point separatrix; in limited plasmas it is\
    \ the surface tangent to the limiter. Equilibrium reconstruction codes (EFIT,\
    \ LIUQE) determine $\\psi_{\\mathrm{bnd}}$ from external magnetic measurements;\
    \ values span roughly 0.5\u201350 Wb depending on device size and plasma current.\
    \ See also [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)\
    \ for the complementary on-axis reference."
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: power_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Total resistive power dissipated in the plasma volume by ohmic heating,
    $P_{\Omega} = \int \eta j^2 \, dV$.
  documentation: "The ohmic dissipation power $P_{\\Omega}$ (in W) is the volume integral\
    \ of the resistive heating rate density $\\eta j^2$, where $\\eta$ is the plasma\
    \ resistivity (inverse of $\\sigma_{\\parallel}$) and $j$ is the current density.\
    \ It quantifies the irreversible conversion of magnetic energy stored in the plasma\
    \ current into thermal energy. In ohmically heated discharges $P_{\\Omega}$ constitutes\
    \ the entire heating source; in auxiliary-heated plasmas it is a smaller but still\
    \ significant contributor to the electron power balance. During disruptions the\
    \ current quench drives $P_{\\Omega}$ to peak values of hundreds of MW as the\
    \ plasma cools and resistivity spikes. Values span 0.1\u20133 MW in steady-state\
    \ tokamak operation and can exceed 100 MW transiently during disruptions. See\
    \ also [ohmic_current_density_parallel](name:ohmic_current_density_parallel) and\
    \ [halo_region_ohmic_power](name:halo_region_ohmic_power)."
  unit: W
  tags:
  - energy-balance
  - global-quantity
  - ohmic-heating
  links: []
  validity_domain: ''
  constraints: []
- name: radial_component_of_plasma_velocity_on_ggd
  kind: vector
  status: draft
  description: Projection of the plasma bulk velocity onto the major-radius direction
    $\hat{R}$, discretized on a generalized grid description (GGD).
  documentation: "The radial component $v_R = \\mathbf{v}_{\\mathrm{plasma}} \\cdot\
    \ \\hat{R}$ captures the outward or inward motion of the plasma fluid in the major-radius\
    \ direction of a cylindrical $(R, \\phi, Z)$ coordinate system. In MHD simulations\
    \ of disruptions, vertical displacement events (VDEs), and halo-current evolution,\
    \ $v_R$ is solved on an unstructured GGD mesh where one scalar value is stored\
    \ per grid element. Values range from near zero in quiescent plasmas to $10^3$\u2013\
    $10^5$ m/s during fast transients such as thermal quenches. Charge-exchange recombination\
    \ spectroscopy (CXRS) provides experimental estimates of radial flow, although\
    \ diagnostic access to $v_R$ is limited compared with toroidal rotation. See also\
    \ [vertical_component_of_plasma_velocity_on_ggd](name:vertical_component_of_plasma_velocity_on_ggd)\
    \ for the complementary $Z$-direction component and [electron_temperature_on_ggd](name:electron_temperature_on_ggd)\
    \ for a GGD-discretized thermodynamic quantity."
  unit: m.s^-1
  tags:
  - spatial-profile
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: radial_mode_number
  kind: scalar
  status: draft
  description: Dimensionless integer counting the number of radial nodes in the eigenfunction
    of a linear MHD perturbation.
  documentation: "The radial mode number $n_r$ (dimensionless integer) enumerates\
    \ radial zeros of the MHD eigenfunction displacement $\\xi_r(\\rho)$ between the\
    \ magnetic axis and the plasma boundary. For Alfv\xE9n eigenmodes, $n_r = 0$ corresponds\
    \ to the fundamental gap mode (TAE), while $n_r \\geq 1$ labels higher-order radial\
    \ harmonics with decreasing drive from energetic particles. In ballooning stability\
    \ analysis, higher $n_r$ modes are generally more stable due to increased FLR\
    \ (finite-Larmor-radius) damping. The quantity is an output of linear MHD stability\
    \ codes (MISHKA, CASTOR, NOVA) and is used alongside the toroidal mode number\
    \ $n$ and dominant poloidal mode number $m$ to classify the mode spectrum. See\
    \ also [toroidal_mode_number](name:toroidal_mode_number)."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: ratio_of_ion_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of total ion number density (summed over all species
    and charge states, thermal and non-thermal) to electron density.
  documentation: The ratio $n_i^{\mathrm{tot}} / n_e$ quantifies the departure of
    the total ion count from the electron count. In a pure hydrogen plasma with singly
    charged ions, quasi-neutrality enforces $n_i / n_e = 1$. The presence of impurities
    with charge state $Z > 1$ reduces this ratio because quasi-neutrality requires
    $n_e = \sum_s Z_s n_s$, so $\sum_s n_s / n_e = 1 - \sum_s (Z_s - 1) n_s / n_e
    < 1$ only when all $Z_s = 1$; in general the total ion count $\sum_s n_s$ can
    exceed $n_e$ if low-$Z$ species dominate, or fall below if high-$Z$ impurities
    are present. For a deuterium plasma with 2% carbon ($Z = 6$), the ratio is approximately
    0.90. This quantity is used in sawtooth modeling and MHD stability analysis to
    account for dilution effects on the ion pressure and resistivity. Inferred from
    charge-exchange recombination spectroscopy (species-resolved $n_s$) combined with
    Thomson-scattering $n_e$. See also [ion_pressure](name:ion_pressure) for the total
    ion pressure that depends on this ratio.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - derived
  - global-quantity
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: reference_major_radius_of_vacuum_toroidal_field
  kind: scalar
  status: draft
  description: Major-radius position $R_0$ at which the vacuum toroidal magnetic field
    $B_0$ is specified.
  documentation: The reference major radius $R_0$ is the radial position (in meters)
    at which the vacuum toroidal magnetic field strength $B_0$ is evaluated. It is
    a fixed geometric parameter of the device, commonly chosen at the geometric center
    of the vacuum vessel at the equatorial midplane. The product $R_0 B_0$ equals
    the poloidal-current stream function $F_0$ in vacuum and must be consistent across
    all equilibrium and transport data. For present-day machines $R_0$ ranges from
    $\sim$0.9 m (spherical tokamaks such as MAST-U) to $\sim$6.2 m (ITER). $R_0$ also
    enters the definition of the toroidal flux coordinate $\rho_{\mathrm{tor}} = \sqrt{\Phi_{\mathrm{tor}}/(\pi
    B_0)}$, linking it to radial grid construction. See also [vacuum_toroidal_magnetic_field_at_reference_major_radius](name:vacuum_toroidal_magnetic_field_at_reference_major_radius)
    and [toroidal_flux_coordinate](name:toroidal_flux_coordinate).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: seed_island_width_at_ntm_onset
  kind: scalar
  status: draft
  description: Full radial width of the magnetic seed island at the moment a neoclassical
    tearing mode (NTM) is triggered.
  documentation: "Neoclassical tearing modes (NTMs) require a seed magnetic island\
    \ of sufficient width $w_{\\mathrm{seed}}$ to overcome the stabilizing threshold\
    \ set by the polarization current and finite-$\\Delta'$ effects. The modified\
    \ Rutherford equation $\\tau_R \\, dw/dt = r_s \\left[ \\Delta'(w) + \\Delta'_{\\\
    mathrm{BS}}(w) - \\Delta'_{\\mathrm{pol}}(w) \\right]$ admits a critical seed\
    \ width below which the perturbation decays, where $\\tau_R$ is the resistive\
    \ time, $r_s$ the rational surface minor radius, and $\\Delta'_{\\mathrm{BS}}$\
    \ and $\\Delta'_{\\mathrm{pol}}$ are the bootstrap-current and polarization-current\
    \ contributions. This standard name records the full (peak-to-peak) width $w_{\\\
    mathrm{seed}}$ in meters at the onset time. Values of 1\u20135 cm are common for\
    \ NTM-triggering events in present-day tokamaks, produced by sawteeth, ELMs, or\
    \ fishbones. Measured via electron-cyclotron emission imaging or soft X-ray tomography;\
    \ inferred from the phase and amplitude of the magnetic perturbation at onset.\
    \ See also [tendency_of_neoclassical_tearing_mode_island_width](name:tendency_of_neoclassical_tearing_mode_island_width)\
    \ and [minor_radius_of_neoclassical_tearing_mode_center](name:minor_radius_of_neoclassical_tearing_mode_center)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - disruption-prediction
  - mhd-stability-analysis
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: tendency_of_neoclassical_tearing_mode_island_width
  kind: scalar
  status: draft
  description: Time derivative of the magnetic island full width for a neoclassical
    tearing mode, quantifying the instantaneous growth or decay rate.
  documentation: The quantity $dw/dt$ (in m/s) is the rate of change of the NTM island
    full width $w$. It is governed by the modified Rutherford equation $\tau_R \,
    dw/dt \propto r_s \left(\Delta' + \Delta'_{\mathrm{bs}} + \Delta'_{\mathrm{pol}}
    + \ldots \right)$, where $r_s$ is the rational-surface minor radius, $\Delta'$
    is the classical tearing stability index, and $\Delta'_{\mathrm{bs}}$ is the bootstrap
    drive term. Positive values indicate island growth; negative values indicate healing
    or active suppression (e.g., by ECCD). For typical medium-size tokamak NTMs, $|dw/dt|$
    ranges from $10^{-3}$ to $10^{-1}$ m/s during the nonlinear evolution phase. See
    also [seed_island_width_at_ntm_onset](name:seed_island_width_at_ntm_onset) for
    the initial island size and [minor_radius_of_neoclassical_tearing_mode_center](name:minor_radius_of_neoclassical_tearing_mode_center)
    for the radial position of the mode.
  unit: m.s^-1
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_magnetic_field
  kind: vector
  status: draft
  description: Projection of the magnetic-field vector onto the geometric toroidal
    direction $\hat{\phi}$, dominating total field magnitude in tokamaks.
  documentation: "The toroidal magnetic-field component $B_\\phi = \\mathbf{B} \\\
    cdot \\hat{\\phi}$ is produced primarily by the external toroidal-field coils\
    \ and constitutes the majority of the total field magnitude in tokamak configurations.\
    \ In vacuum the dependence follows $B_\\phi \\propto 1/R$, where $R$ is the major\
    \ radius in meters; finite plasma pressure and diamagnetic currents modify this\
    \ profile. On-axis values range from 1\u20136 T in present-day tokamaks (DIII-D\
    \ ~2 T, JET ~3.4 T, ITER ~5.3 T). The toroidal field sets the ion cyclotron frequency\
    \ $\\Omega_{ci} = Z_i e B_\\phi / m_i$ and is a key input to equilibrium reconstruction\
    \ codes (EFIT, LIUQE). The quantity is stored per spatial element (centroid or\
    \ GGD node) and may be measured by diamagnetic loops or inferred from coil currents\
    \ and equilibrium solvers. See also [poloidal_component_of_magnetic_field](name:poloidal_component_of_magnetic_field)\
    \ and [magnetic_field_magnitude](name:magnetic_field_magnitude)."
  unit: T
  tags:
  - equilibrium-reconstruction
  - flux-surface-average
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_plasma_velocity_on_ggd
  kind: vector
  status: draft
  description: Projection of the bulk plasma velocity onto the toroidal direction
    $\hat{\phi}$, stored on a generalized grid description (GGD) mesh.
  documentation: "The toroidal plasma velocity $v_\\phi = \\mathbf{v} \\cdot \\hat{\\\
    phi}$ (in m s$^{-1}$) describes the bulk rotation of the plasma in the toroidal\
    \ direction. Toroidal rotation is driven by neutral-beam injection momentum input,\
    \ intrinsic torques, and radial electric-field gradients; it plays a central role\
    \ in resistive-wall-mode stabilization and turbulence suppression via $E \\times\
    \ B$ shear. On the GGD mesh one scalar value is assigned per grid element, allowing\
    \ resolution of steep rotation gradients near transport barriers and the X-point\
    \ region. In NBI-heated tokamak plasmas, core values reach $10^4$\u2013$10^5$\
    \ m s$^{-1}$; in ohmic or electron-heated scenarios, values can be an order of\
    \ magnitude lower. Charge-exchange recombination spectroscopy (CXRS) provides\
    \ direct measurements. See [parallel_component_of_plasma_velocity_on_ggd](name:parallel_component_of_plasma_velocity_on_ggd)\
    \ for the field-aligned projection and [toroidal_component_of_current_density_on_ggd](name:toroidal_component_of_current_density_on_ggd)\
    \ for the toroidal current density on the same mesh."
  unit: m.s^-1
  tags:
  - simulated
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_halo_current
  kind: scalar
  status: draft
  description: Net electric current flowing in the toroidal direction within the halo
    plasma region during a disruption.
  documentation: "The toroidal halo current $I_{\\mathrm{halo},\\phi}$ (in A) is the\
    \ integral of the toroidal current density over the halo-region cross-section\
    \ \u2014 the open-field-line plasma that forms between the last closed flux surface\
    \ and the vessel wall during a vertical displacement event (VDE) or thermal quench.\
    \ It contributes to the electromagnetic loads on plasma-facing components and\
    \ is a key input to structural-integrity assessments. The toroidal and poloidal\
    \ halo currents together close through the vessel wall, generating asymmetric\
    \ forces quantified by the toroidal peaking factor. In ITER-scale disruptions,\
    \ $|I_{\\mathrm{halo},\\phi}|$ can reach several hundred kA, corresponding to\
    \ halo-current fractions $I_{\\mathrm{halo}}/I_p$ of 0.2\u20130.4. It is inferred\
    \ from shunt-tile and Rogowski-coil measurements on divertor structures. See [halo_region_poloidal_current](name:halo_region_poloidal_current)\
    \ for the poloidal component and [ohmic_power_due_to_halo_currents](name:ohmic_power_due_to_halo_currents)\
    \ for the associated resistive dissipation."
  unit: A
  tags:
  - disruption-prediction
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_mode_frequency
  kind: scalar
  status: draft
  description: Oscillation frequency of a toroidal MHD eigenmode, characterizing its
    temporal periodicity in the laboratory frame.
  documentation: "The toroidal mode frequency $f$ (in Hz) specifies the temporal oscillation\
    \ rate of a linear MHD eigenmode with a given toroidal mode number $n$. It is\
    \ related to the complex eigenvalue $\\omega = 2\\pi f + i\\gamma$ (where $\\\
    gamma$ is the growth rate in s$^{-1}$) computed by linear stability codes such\
    \ as CASTOR, MISHKA, or NOVA. For stable modes or weakly damped Alfven eigenmodes\
    \ the frequency is real and determined by the Alfven continuum, diamagnetic effects,\
    \ and plasma rotation. Alfvenic modes in burning plasmas have frequencies in the\
    \ range $10$\u2013$500$ kHz; resistive tearing modes rotate at $1$\u2013$30$ kHz\
    \ depending on plasma rotation and wall proximity. Experimentally, mode frequency\
    \ is extracted from magnetic pickup coil or soft-X-ray array spectrograms. See\
    \ also [toroidal_mode_number](name:toroidal_mode_number) for the integer mode\
    \ label and [toroidal_mode_growth_rate](name:toroidal_mode_growth_rate) for the\
    \ imaginary part of the eigenvalue."
  unit: Hz
  cocos_transformation_type: one_like
  tags:
  - fourier-component
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_mode_growth_rate
  kind: scalar
  status: draft
  description: Linear temporal growth rate of an MHD eigenmode for a specific toroidal
    mode number, expressed as an exponential e-folding frequency.
  documentation: "The toroidal mode growth rate $\\gamma$ (in Hz, i.e., e-foldings\
    \ per second) characterizes how rapidly a given toroidal Fourier harmonic $n$\
    \ of a perturbed MHD quantity grows in the linear phase: $\\delta X(t) \\propto\
    \ e^{\\gamma t}$. A positive $\\gamma$ indicates instability; a negative value\
    \ indicates damping. The growth rate is computed by linear MHD eigenvalue solvers\
    \ (CASTOR, MISHKA, KINX) from the linearized momentum and induction equations,\
    \ and is conventionally normalized to the inverse Alfv\xE9n time $\\tau_A^{-1}$\
    \ for cross-machine comparison. For ideal kink or ballooning modes $\\gamma \\\
    tau_A \\sim 0.01$\u2013$1$; resistive tearing modes grow much slower with $\\\
    gamma \\tau_A \\sim S^{-3/5}$ where $S$ is the Lundquist number. See also [alfven_time](name:alfven_time)\
    \ for the normalization timescale, [toroidal_mode_number](name:toroidal_mode_number)\
    \ for the mode identification, and [perturbed_potential_energy](name:perturbed_potential_energy)\
    \ for the associated energy functional."
  unit: Hz
  cocos_transformation_type: one_like
  tags:
  - benchmark-quantity
  - derived
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_major_radius_of_active_wall_point
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the major-radius coordinate
    of the active wall point during a disruption.
  documentation: This quantity gives the positive (upper) error bar on $R_{\mathrm{wall}}$,
    forming the confidence interval $[R_{\mathrm{wall}} - \delta R_{\mathrm{low}},\;
    R_{\mathrm{wall}} + \delta R_{\mathrm{up}}]$ where $\delta R_{\mathrm{up}}$ is
    this field in meters. Asymmetric uncertainties reflect the non-Gaussian character
    of disruption equilibrium reconstruction or the discrete geometry of wall tiles.
    The value is non-negative and has the same unit (m) as the parent coordinate.
    See [major_radius_of_active_wall_point](name:major_radius_of_active_wall_point)
    for the central value and [lower_uncertainty_of_major_radius_of_active_wall_point](name:lower_uncertainty_of_major_radius_of_active_wall_point)
    for the lower error bound.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - disruption-prediction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_minor_radius_of_neoclassical_tearing_mode_center
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the toroidal flux coordinate
    $\rho_{\mathrm{tor}}$ of the NTM island center.
  documentation: 'This quantity stores the positive (upper) error bar $\delta \rho_{\mathrm{tor}}^{+}$
    (in meters) on the radial position of a neoclassical tearing mode, giving the
    confidence interval $[\rho_{\mathrm{tor}} - \delta\rho^{-},\; \rho_{\mathrm{tor}}
    + \delta\rho^{+}]$. Asymmetric errors arise from the non-uniform spatial resolution
    of the ECE or soft X-ray diagnostics used to localize the mode. Accurate uncertainty
    quantification is critical for ECCD targeting: misalignment by even a few centimeters
    can reduce stabilization efficiency. The value is non-negative and shares the
    unit (m) of the parent coordinate. See [minor_radius_of_neoclassical_tearing_mode_center](name:minor_radius_of_neoclassical_tearing_mode_center)
    for the central value and [tendency_of_neoclassical_tearing_mode_island_width](name:tendency_of_neoclassical_tearing_mode_island_width)
    for the island dynamics.'
  unit: m
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_poloidal_magnetic_flux_of_magnetic_axis
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the poloidal magnetic
    flux at the magnetic axis.
  documentation: This field provides the positive-side error bar for the on-axis poloidal
    flux $\psi_{\mathrm{axis}}$ (in Wb), representing the upward deviation from the
    nominal reconstructed value. The magnetic axis is defined as the point where $\nabla
    \psi = 0$ inside the plasma; its flux value anchors the normalization of all radial
    profiles. Asymmetric uncertainties reflect the nonlinear error structure of equilibrium
    reconstruction, where measurement noise and model constraints propagate differently
    toward higher and lower flux values. The upper uncertainty is a non-negative offset
    added to the nominal $\psi_{\mathrm{axis}}$. See also [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)
    for the parent quantity and [poloidal_magnetic_flux_of_plasma_boundary](name:poloidal_magnetic_flux_of_plasma_boundary)
    for the boundary counterpart.
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_poloidal_magnetic_flux_of_plasma_boundary
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the poloidal magnetic
    flux at the plasma boundary.
  documentation: This field provides the positive-side error bar for the boundary
    poloidal flux $\psi_{\mathrm{bnd}}$ (in Wb), representing the upward deviation
    from the nominal reconstructed value. Asymmetric uncertainties arise because equilibrium
    reconstruction is a nonlinear inverse problem where error propagation from magnetics
    measurements is non-Gaussian near the separatrix. The upper uncertainty is a non-negative
    offset added to the nominal $\psi_{\mathrm{bnd}}$. Combined with the lower uncertainty,
    the full asymmetric confidence interval is recovered. See also [poloidal_magnetic_flux_of_plasma_boundary](name:poloidal_magnetic_flux_of_plasma_boundary)
    for the parent quantity and [poloidal_magnetic_flux_of_magnetic_axis](name:poloidal_magnetic_flux_of_magnetic_axis)
    for the on-axis counterpart.
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_power_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the total ohmic dissipation
    power in the plasma.
  documentation: This field provides the positive (upper) error bar for the total
    ohmic power $P_{\Omega}$, representing the upward deviation from the nominal value.
    The uncertainty arises from propagation of errors in the resistivity profile (driven
    by electron temperature and effective charge $Z_{\mathrm{eff}}$ uncertainties)
    and in the current-density profile inferred from equilibrium reconstruction. The
    stored value is a non-negative offset such that the upper confidence bound is
    $P_{\Omega} + \Delta P_{\Omega,\mathrm{upper}}$. Combined with the lower uncertainty,
    the full asymmetric confidence interval is recovered. See also [power_due_to_ohmic_dissipation](name:power_due_to_ohmic_dissipation).
  unit: W
  tags:
  - energy-balance
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_seed_island_width_at_ntm_onset
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the seed island full width
    at NTM onset.
  documentation: This quantity represents the positive (upper) error bar on [seed_island_width_at_ntm_onset](name:seed_island_width_at_ntm_onset),
    expressed in meters. Together with [lower_uncertainty_of_seed_island_width_at_ntm_onset](name:lower_uncertainty_of_seed_island_width_at_ntm_onset),
    it defines the asymmetric confidence interval $[w_{\mathrm{seed}} - \sigma_{\mathrm{low}},\;
    w_{\mathrm{seed}} + \sigma_{\mathrm{up}}]$, where $\sigma_{\mathrm{up}}$ is this
    standard name. Asymmetric errors are common because island-width inference from
    ECE imaging or soft X-ray tomography involves non-linear fitting with mode-dependent
    systematic effects. This value must be non-negative; a value of zero indicates
    that only the lower error bar is meaningful.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - mhd-stability-analysis
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_toroidal_component_of_magnetic_field
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on the toroidal component
    of the magnetic field $B_\phi$.
  documentation: "This quantity represents the upper (positive-side) error bar on\
    \ the toroidal magnetic-field component $B_\\phi = \\mathbf{B} \\cdot \\hat{\\\
    phi}$, where $\\hat{\\phi}$ is the geometric toroidal unit vector and $B_\\phi$\
    \ is measured in tesla. The true value is expected to satisfy $B_\\phi \\le B_{\\\
    phi,\\mathrm{meas}} + \\Delta B_{\\phi,\\mathrm{upper}}$. Uncertainty contributors\
    \ include Hall-probe calibration drift, ferritic-material hysteresis modeling,\
    \ and equilibrium-reconstruction residuals. In ferritic-insert environments, field\
    \ deviations of 1\u201350 mT are expected with upper uncertainties of 0.1\u2013\
    1 mT depending on sensor density. See also [lower_uncertainty_of_toroidal_component_of_magnetic_field](name:lower_uncertainty_of_toroidal_component_of_magnetic_field)\
    \ for the complementary lower bound."
  unit: T
  tags:
  - measured
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: vacuum_grid_cell_volume
  kind: scalar
  status: draft
  description: Elementary volume of a computational grid cell in the vacuum region
    surrounding the plasma, used in linear MHD eigenvalue calculations.
  documentation: The vacuum grid cell volume $\Delta V_{ij}$ is the volume enclosed
    by the quadrilateral cell formed by nodes $[d_1(i), d_2(j)]$, $[d_1(i+1), d_2(j)]$,
    $[d_1(i), d_2(j+1)]$, and $[d_1(i+1), d_2(j+1)]$ in the vacuum computational domain,
    where $d_1$ and $d_2$ denote the two grid dimensions (e.g., radial and poloidal).
    This quantity is required for volume-weighted integrals of perturbed fields in
    the vacuum region when solving for MHD stability eigenmodes or computing energy
    functionals such as $\delta W_{\mathrm{vac}} = \frac{1}{2\mu_0}\int |\delta \mathbf{B}|^2
    \, dV$. The unit is dimensionless (stored as `1`) because the DD field is normalized
    to a reference volume; in physical applications cell volumes range from $10^{-4}$
    to $10^{-1}\;\mathrm{m}^3$ depending on grid resolution and device size. The companion
    plasma-region grid cell volume is stored at an analogous path for the plasma domain.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  - mhd-stability-analysis
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_component_of_current_density_on_ggd
  kind: vector
  status: draft
  description: Vertical ($Z$) component of the plasma current-density vector, stored
    on a generalized grid description (GGD) mesh.
  documentation: "The vertical current-density component $j_Z$ represents the projection\
    \ of the total current density $\\mathbf{j}$ (in A m$^{-2}$) onto the cylindrical\
    \ $\\hat{Z}$ direction. In axisymmetric equilibria $j_Z$ is related to the poloidal\
    \ current density; in non-axisymmetric or transient MHD simulations (e.g., disruptions,\
    \ halo currents) the full three-component current density including $j_Z$ is required\
    \ for force-balance evaluation via $\\mathbf{j} \\times \\mathbf{B} = \\nabla\
    \ p + \\rho \\, d\\mathbf{v}/dt$. The field is discretized on GGD elements so\
    \ it can represent complex geometries including the scrape-off layer and divertor.\
    \ Values in the confined core are of order $10^5$\u2013$10^7$ A m$^{-2}$ depending\
    \ on device size and plasma current. It is computed from MHD equilibrium codes\
    \ or extracted from extended-MHD simulations (JOREK, NIMROD). See also [toroidal_component_of_current_density_on_ggd](name:toroidal_component_of_current_density_on_ggd)\
    \ and [radial_component_of_current_density_on_ggd](name:radial_component_of_current_density_on_ggd)."
  unit: A.m^-2
  tags:
  - equilibrium-reconstruction
  - spatial-profile
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_component_of_plasma_velocity_on_ggd
  kind: vector
  status: draft
  description: Projection of the plasma bulk velocity onto the vertical direction
    $\hat{Z}$, discretized on a generalized grid description (GGD).
  documentation: "The vertical component $v_Z = \\mathbf{v}_{\\mathrm{plasma}} \\\
    cdot \\hat{Z}$ describes the upward or downward motion of the plasma fluid in\
    \ a cylindrical $(R, \\phi, Z)$ coordinate system. During vertical displacement\
    \ events (VDEs) or disruptions the plasma column can drift vertically at speeds\
    \ of $10^3$\u2013$10^5$ m/s, making $v_Z$ a key output of nonlinear MHD codes\
    \ (e.g., JOREK, NIMROD). One scalar value is stored per element of the GGD subgrid,\
    \ enabling representation on unstructured meshes. Experimental estimates of vertical\
    \ flow are obtainable from Doppler spectroscopy or motional-Stark-effect diagnostics,\
    \ although resolution of the $Z$-component is indirect. See also [radial_component_of_plasma_velocity_on_ggd](name:radial_component_of_plasma_velocity_on_ggd)\
    \ for the companion $R$-direction component and [electron_temperature_on_ggd](name:electron_temperature_on_ggd)\
    \ for another GGD-discretized MHD field."
  unit: m.s^-1
