name: lower_hybrid_antenna_parallel_refractive_index_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for the launched parallel refractive
  index $n_{\parallel}$ of the lower-hybrid antenna.
documentation: 'The lower-hybrid antenna parallel refractive index reference waveform
  specifies the desired temporal trajectory of $n_{\parallel} = c k_{\parallel} /
  \omega$, where $c$ is the speed of light, $k_{\parallel}$ is the parallel wavenumber,
  and $\omega$ is the wave angular frequency. The parallel refractive index determines
  the phase velocity of the launched lower-hybrid wave along the magnetic field and
  hence the energy of resonant electrons via Landau damping: electrons with velocity
  $v_{\parallel} \approx c / n_{\parallel}$ absorb wave energy. Typical $n_{\parallel}$
  values for current-drive applications range from 1.5 to 3.0; lower values drive
  current in faster electrons (higher energy) while higher values couple to the thermal
  bulk. The phased waveguide grill controls $n_{\parallel}$ by adjusting inter-waveguide
  phase differences. Error bars on the reference define the acceptable control envelope.
  See also the launched power reference for lower-hybrid systems.'
