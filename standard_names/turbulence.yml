- name: perpendicular_normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: active
  description: Perpendicular normalized perturbed pressure Bessel-1 is the perpendicular
    pressure moment of a perturbed gyrocenter distribution in a linear gyrokinetic
    eigenmode, normalized to a reference thermal pressure and weighted by the first-order
    Bessel function J1.
  documentation: 'Perpendicular normalized perturbed pressure Bessel-1 is the perpendicular
    kinetic-pressure moment of a perturbed gyrocenter distribution in a linear gyrokinetic
    eigenmode, normalized to a reference thermal pressure and weighted by the first-order
    Bessel function. It is the perpendicular projection of the Bessel-1 normalized
    perturbed pressure moment, associated with particle kinetic energy perpendicular
    to the background magnetic field.


    The normalized moment is defined by


    $$

    \hat{\delta p}_{\perp,J_1} = \frac{1}{p_\mathrm{ref}} \int_{\mathbb{R}^3} \frac{m
    v_\perp^2}{2}\, J_1\!\left(k_\perp \rho(v_\perp)\right)\, \delta f_\mathrm{gc}(\mathbf{v})\,
    d^3v

    $$


    where $\hat{\delta p}_{\perp,J_1}$ is the normalized perpendicular Bessel-1 pressure
    perturbation, $p_\mathrm{ref}=n_\mathrm{ref}T_\mathrm{ref}$ is the reference thermal
    pressure, $n_\mathrm{ref}$ is the reference density, $T_\mathrm{ref}$ is the reference
    temperature expressed as particle energy, $m$ is the species mass, $v_\perp$ is
    the particle speed perpendicular to the background magnetic field, $J_1$ is the
    first-order Bessel function, $k_\perp$ is the perpendicular wave-number magnitude,
    $\rho(v_\perp)$ is the velocity-dependent gyroradius, $\delta f_\mathrm{gc}$ is
    the perturbed gyrocenter distribution, and $d^3v$ is the velocity-space volume
    element.


    This quantity is the perpendicular pressure-tensor projection of [normalized_perturbed_pressure_bessel_1](name:normalized_perturbed_pressure_bessel_1);
    the complementary field-aligned projection is parallel_normalized_perturbed_pressure_bessel_1.
    It differs from [perpendicular_normalized_perturbed_pressure](name:perpendicular_normalized_perturbed_pressure)
    by the first-order Bessel weighting and from [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)
    by representing the Bessel-1 finite-Larmor-radius contribution rather than the
    unweighted gyrocenter moment.


    Sign convention: Positive when, after the eigenmode phase has been fixed by the
    chosen reference perturbation, the real part of the defining Bessel-weighted perpendicular
    kinetic-pressure moment represents an excess over the equilibrium gyrocenter distribution.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_pressure_bessel_1
  - name:perpendicular_normalized_perturbed_pressure
  - name:perpendicular_normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: perpendicular_normalized_perturbed_pressure
    operator: bessel_1
    operator_kind: unary_postfix
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter_bessel_1/pressure_perpendicular
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-linear-wavevector-eigenmode-moments_norm_gyrocenter_bessel_1-pressure_perpendicular
    dd_documentation:
