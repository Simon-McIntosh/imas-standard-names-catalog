    dd_path: equilibrium/time_slice/profiles_2d/b_field_z
    status: composed
- name: vertical_coordinate_of_annular_centerline
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the centerline of an annular cross-section
    geometry element in the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$
    is the height along the machine symmetry axis.
  documentation: 'The vertical coordinate $Z$ of the annular centerline locates the
    axial position of an annular (ring-shaped) cross-section element within the poloidal
    $(R, Z)$ plane of the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is the major radius from the machine symmetry axis and $Z$ is the height along
    that axis. An annular cross-section is defined by its center position $(R_0, Z_0)$
    and inner and outer radii; this scalar gives $Z_0$, the center height. It is the
    vertical component of the full 2D center position described by [coordinate_of_annular_centerline](name:coordinate_of_annular_centerline),
    complementing the major-radius component given by [major_radius_of_annulus_geometry](name:major_radius_of_annulus_geometry).
    Typical values span the machine half-height, ranging from roughly $-10$ m to $+10$
    m for large devices. This quantity applies to axisymmetric conducting or structural
    elements such as poloidal field coils, passive loops, iron core segments, and
    antenna straps. Compare with [vertical_coordinate_of_annulus](name:vertical_coordinate_of_annulus),
    which describes the center of an annular element of an axisymmetric machine component,
    and [vertical_coordinate_of_rectangular_element_center](name:vertical_coordinate_of_rectangular_element_center)
    for rectangular cross-section elements.


    Sign convention: Positive when $Z$ is above the machine midplane (in the $+Z$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame).'
  unit: m
  physics_domain: equilibrium
  links:
