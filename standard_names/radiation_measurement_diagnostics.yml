- name: first_coordinate_of_reflector_outline
  kind: scalar
  status: draft
  description: First local coordinate (X1) of vertices defining the polygonal boundary
    of a spectrometer reflector element in its local (X1, X2) instrument reference
    frame.
  documentation: 'The first local coordinate X1 specifies the position of each vertex
    along the primary axis of the reflector''s local instrument frame, collectively
    defining the polygonal outline of the reflector element used in X-ray crystal
    spectrometer channels. Together with the orthogonal [second coordinate](name:second_coordinate_of_reflector_outline),
    the X1 vertex sequence forms a closed polygon that precisely represents the active
    reflecting surface boundary, which governs the solid angle accepted by the reflector
    and the spatial extent of Bragg diffraction onto the detector. The local $(X1,
    X2)$ frame is defined by the instrument geometry and is independent of the global
    cylindrical $(R, \phi, Z)$ machine frame; the transformation between frames is
    handled externally. Typical reflector dimensions for X-ray crystal spectrometers
    are on the order of millimeters to a few centimeters, so X1 vertex coordinates
    span a comparable range. The outline is closely related to the analogous [first
    coordinate of the crystal outline](name:first_coordinate_of_crystal_outline) and
    [first coordinate of aperture outline](name:first_coordinate_of_aperture_outline),
    which define boundaries for other optical elements in the same spectrometer channel.


    Sign convention: Positive when the vertex position is in the positive X1 direction
    of the local instrument reference frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_coordinate_of_reflector_outline
  - name:first_coordinate_of_crystal_outline
  - name:first_coordinate_of_aperture_outline
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/outline/x1
    dd_path: spectrometer_x_ray_crystal/channel/reflector/outline/x1
    status: composed
- name: first_coordinate_radius_of_curvature_of_filter_window
  kind: scalar
  status: draft
  description: Radius of curvature of a diagnostic filter window surface along the
    first local coordinate direction X1, defined as the radius of the osculating circle
    of the surface cross-section taken in the X1 direction at the window center. Applicable
    to cylindrical or toroidal window geometries; a flat surface corresponds to an
    infinite radius.
  documentation: 'The first-coordinate radius of curvature $R_{c,X1}$ is the radius
    of the osculating circle of the filter window surface profile taken in the first
    local coordinate direction $X1$ of the instrument''s local surface frame $(X1,
    X2)$. It is related to the first principal curvature $\kappa_1$ by $R_{c,X1} =
    1/\kappa_1$. In this convention $R_{c,X1}$ is treated as a positive unsigned scalar;
    the direction of bending (concave versus convex with respect to the incoming beam)
    is determined separately by the curvature geometry type rather than by the sign
    of this quantity.


    For a flat window the surface has zero curvature and $R_{c,X1} \to \infty$; for
    cylindrical windows the curvature is non-zero in one principal direction only,
    while for a toroidal window both $R_{c,X1}$ and its companion $R_{c,X2}$ are finite
    and generally unequal. When both principal radii are equal (spherical geometry)
    this field and $R_{c,X2}$ take the same finite value and either alone fully specifies
    the surface.


    This quantity is required only for curved surface geometries; it need not be populated
    for flat windows. Together with $R_{c,X2}$ (the second-coordinate radius of curvature)
    it fully characterizes the local quadratic surface shape at the window center,
    which is needed for accurate solid-angle and photon-transmission calculations
    in X-ray diagnostic systems.


    Typical values range from roughly 10 mm for tightly curved crystal spectrometer
    filter windows to several meters for gently curved soft X-ray foil windows. The
    first coordinate width of the filter window along the same $X1$ direction sets
    the physical aperture over which this curvature is exercised.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_coordinate_radius_of_curvature_of_filter_window
  - name:first_coordinate_width_of_filter_window
  - name:radius_of_filter_window
  - name:first_coordinate_radius_of_curvature_of_reflector
  constraints: []
  sources:
  - id: dd:soft_x_rays/channel/filter_window/x1_curvature
    dd_path: soft_x_rays/channel/filter_window/x1_curvature
    status: composed
  - id: dd:spectrometer_x_ray_crystal/channel/filter_window/x1_curvature
    dd_path: spectrometer_x_ray_crystal/channel/filter_window/x1_curvature
    status: composed
- name: first_coordinate_radius_of_curvature_of_reflector
  kind: scalar
  status: draft
  description: Radius of curvature of the reflector surface in the first local coordinate
    (X1) direction, defined as the radius of the osculating circle at the surface
    cross-section taken perpendicular to the X2 axis. A flat surface corresponds to
    an infinite radius; finite values describe curved geometries such as cylindrical,
    toroidal, or ellipsoidal reflectors.
  documentation: 'The first-coordinate radius of curvature $R_1$ is the radius of
    the osculating circle that best approximates the reflector surface profile along
    the X1 direction at a given point. Formally, if $\kappa_1$ is the principal curvature
    in the X1 direction at the surface point of interest, then $R_1 = 1/|\kappa_1|$,
    where the osculating circle lies in the plane containing the X1 axis and the surface
    normal at that point. This quantity is reported as a positive magnitude; the sign
    of the curvature (concave versus convex) is not encoded in this scalar.


    For a reflector with anisotropic curvature, $R_1$ and the companion second-coordinate
    radius $R_2$ (see [second_coordinate_radius_of_curvature_of_reflector](name:second_coordinate_radius_of_curvature_of_reflector))
    together specify the local surface shape: a spherical reflector has $R_1 = R_2$;
    a cylindrical reflector has one finite and one infinite radius; a toroidal or
    ellipsoidal reflector has two distinct finite values. For an ellipsoidal surface,
    the local principal radii depend on the position along the surface and cannot
    be inferred from the semi-axes alone without specifying the evaluation point.


    This quantity is meaningful only when the reflector curvature type corresponds
    to a geometry requiring an explicit radius in the X1 direction (e.g., cylindrical,
    toroidal, or ellipsoidal types); for flat or spherical reflectors described by
    a single scalar, see [radius_of_reflector](name:radius_of_reflector). The lateral
    extent of the reflector in the X1 direction is described by [first_coordinate_width_of_reflector](name:first_coordinate_width_of_reflector).
    The analogous quantity for diagnostic filter windows is [first_coordinate_radius_of_curvature_of_filter_window](name:first_coordinate_radius_of_curvature_of_filter_window).


    Typical values range from tens of millimeters for tightly curved crystal or mirror
    optics to several meters for large grazing-incidence or long-focal-length reflector
    designs.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radius_of_reflector
  - name:first_coordinate_width_of_reflector
  - name:first_coordinate_radius_of_curvature_of_filter_window
