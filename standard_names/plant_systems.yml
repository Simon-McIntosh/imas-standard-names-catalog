- name: accumulated_neon_count
  kind: scalar
  status: draft
  description: Cumulative number of neon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons.
  documentation: "The accumulated neon count is the running temporal integral of the\
    \ neon gas injection rate from plasma breakdown onward, giving the total neon\
    \ inventory delivered to the plasma vessel over the discharge. Each injected neon\
    \ atom contributes to the tally in equivalent-electron units \u2014 the raw particle\
    \ count scaled by the neon atomic number $Z_\\mathrm{Ne} = 10$ \u2014 enabling\
    \ direct comparison with other injected fuel and impurity species.\n\nThe defining\
    \ integral is:\n\n$$\nN_\\mathrm{acc}(t) = Z_\\mathrm{Ne} \\int_{t_0}^{t} \\dot{n}_\\\
    mathrm{Ne}(t') \\, dt'\n$$\n\nwhere $\\dot{n}_\\mathrm{Ne}$ is the instantaneous\
    \ neon injection rate in atoms per second, $t_0$ is the time of plasma breakdown,\
    \ and $Z_\\mathrm{Ne} = 10$ is the neon atomic number.\n\nThis quantity is determined\
    \ from calibrated gas valve flow measurements integrated temporally throughout\
    \ the discharge. It is particularly relevant in impurity seeding and disruption\
    \ mitigation experiments where the cumulative neon dose governs radiated power\
    \ fractions and pedestal stability.\n\nThe parent [neon_count](name:neon_count)\
    \ provides phase-specific or instantaneous counts; [neon_prefill_count](name:neon_prefill_count)\
    \ covers the pre-breakdown injection phase exclusively. Analogous accumulated\
    \ quantities for other injected species include [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ and [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection).\n\
    \nSign convention: Positive when neon gas is injected, so the accumulated count\
    \ increases monotonically from zero at plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:neon_count
  - name:neon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/neon/value
    dd_path: summary/gas_injection_accumulated/neon/value
    status: composed
- name: accumulated_nitrogen_count
  kind: scalar
  status: draft
  description: Cumulative nitrogen gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each nitrogen atom contributes 7 equivalent
    electrons equal to its atomic number.
  documentation: 'The accumulated nitrogen count tracks the total nitrogen atoms delivered
    by gas injection from plasma breakdown onward, weighted by the atomic number of
    nitrogen ($Z_N = 7$) to produce a dimensionless equivalent-electron count. This
    convention reflects the electron inventory that would result from complete ionization
    of all injected nitrogen and places different injected species on a common quantitative
    footing shared across the gas-injection monitoring family.


    The count is defined as:


    $$

    C_N = Z_N \, N_N = 7 \, N_N

    $$


    where $N_N$ is the cumulative number of nitrogen atoms delivered since plasma
    breakdown and $Z_N = 7$ is the atomic number of nitrogen. The count integrates
    contributions from each gas valve pulse throughout the discharge and increases
    monotonically from breakdown.


    Nitrogen is regularly injected in fusion devices for divertor detachment seeding,
    radiative power dissipation, and disruption mitigation. The equivalent-electron
    count is inferred from gas valve actuation signals integrated against calibrated
    throughput curves from the moment of plasma breakdown. Typical values span from
    $10^{20}$ equivalent electrons for trace impurity seeding to $10^{24}$ in massive
    gas injection scenarios. The analogous count for argon is provided by [accumulated_argon_count](name:accumulated_argon_count)
    using $Z = 18$, the hydrogen reference uses $Z = 1$ per atom in [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection),
    and the prefill-only nitrogen inventory is tracked separately by [nitrogen_prefill_count](name:nitrogen_prefill_count).


    Sign convention: Positive when nitrogen atoms have been cumulatively injected
    into the plasma vessel after plasma breakdown onset.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:nitrogen_prefill_count
  sources:
  - id: dd:summary/gas_injection_accumulated/nitrogen/value
    dd_path: summary/gas_injection_accumulated/nitrogen/value
    status: composed
- name: accumulated_oxygen_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative post-breakdown oxygen delivered by gas injection, expressed
    as an equivalent-electron count. Each oxygen atom contributes 8 counts, so the
    value is 8 times the injected oxygen atom inventory.
  documentation: 'The accumulated oxygen count due to gas injection is the cumulative
    amount of oxygen introduced after plasma breakdown, expressed in equivalent electrons
    rather than oxygen atoms. It provides a charge-normalized impurity inventory:
    one oxygen atom contributes 8 counts because the atomic number of oxygen is 8.


    The equivalent-electron count $N_\mathrm{eq}$ is defined from the injected oxygen
    atom inventory $N_\mathrm{O}$ by:


    $$

    N_\mathrm{eq} = Z_\mathrm{O} N_\mathrm{O}

    $$


    where $Z_\mathrm{O}=8$ is the atomic number of oxygen and $N_\mathrm{O}$ is the
    cumulative number of oxygen atoms injected after plasma breakdown.


    In practice, the quantity is computed from calibrated gas-injection flow rates
    integrated over time, with molecular composition accounted for when oxygen is
    injected as $\mathrm{O}_2$ or in another oxygen-bearing gas. The accumulation
    starts from zero at breakdown and increases as additional oxygen is delivered;
    it excludes oxygen present in the prefill inventory. The simpler [oxygen_count](name:accumulated_oxygen_count_due_to_gas_injection)
    denotes an oxygen gas count in the same equivalent-electron representation, while
    [accumulated_oxygen_prefill_count_due_to_gas_injection](name:accumulated_oxygen_prefill_count_due_to_gas_injection)
    refers to the corresponding pre-breakdown contribution.


    Typical accumulated values range from about $10^{18}-10^{22}$ equivalent-electron
    counts for small impurity puffs to stronger radiative seeding phases, with larger
    values possible in long pulses or large devices.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_oxygen_prefill_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/oxygen/value
    dd_path: summary/gas_injection_accumulated/oxygen/value
    status: composed
- name: accumulated_oxygen_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative oxygen gas introduced during the prefill phase by gas injection,
    expressed as an equivalent-electron count where each oxygen atom contributes 8
    count units equal to its atomic number.
  documentation: 'The prefill phase precedes plasma breakdown, during which controlled
    gas injection establishes an initial neutral gas background in the vessel. This
    quantity accumulates the total oxygen inventory delivered during that phase, representing
    each oxygen atom as 8 equivalent electrons equal to the atomic number $Z_\mathrm{O}
    = 8$.


    The equivalent-electron inventory is defined as:


    $$

    N_\mathrm{eq} = Z_\mathrm{O} \cdot N_\mathrm{O}

    $$


    where $N_\mathrm{O}$ is the total number of oxygen atoms injected during the prefill
    interval and $Z_\mathrm{O} = 8$ is the atomic number of oxygen.


    The count is inferred from calibrated gas injection valve records integrated over
    the prefill interval, from the start of the prefill phase through plasma breakdown.
    It is the accumulated component of [oxygen_prefill_count_due_to_gas_injection](name:oxygen_prefill_count_due_to_gas_injection)
    and follows the same equivalent-electron convention applied to helium-3 in [accumulated_helium_3_prefill_count_due_to_gas_injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    and to lithium in [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection).
    Post-breakdown oxygen injection is tracked separately by [oxygen_count](name:accumulated_oxygen_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
