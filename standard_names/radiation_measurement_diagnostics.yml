    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_x_ray_crystal.html#spectrometer_x_ray_crystal-channel-crystal-outline-x1
    dd_documentation:
