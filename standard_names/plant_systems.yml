    dd_path: summary/gas_injection_accumulated/methane_deuterated/value
    status: composed
- name: accumulated_ethane_count
  kind: scalar
  status: draft
  description: Cumulative ethane (C2H6) gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each ethane molecule contributes 18 equivalent
    electrons.
  documentation: 'The accumulated ethane count tracks the time-integrated amount of
    ethane (C2H6) gas injected into the plasma vessel since plasma breakdown, expressed
    as a dimensionless equivalent-electron count. Each ethane molecule consists of
    two carbon atoms (atomic number $Z_C = 6$) and six hydrogen atoms (atomic number
    $Z_H = 1$), contributing $2 \times 6 + 6 \times 1 = 18$ equivalent electrons per
    molecule, so the accumulated count $N_{\rm acc}$ and the total number of injected
    molecules $N_{\rm mol}$ are related by:


    $$

    N_{\rm acc} = 18 \, N_{\rm mol}

    $$


    where $N_{\rm mol}$ is the number of ethane molecules delivered since plasma breakdown.


    The accumulated count is obtained by integrating the instantaneous ethane injection
    rate from the moment of plasma breakdown. It provides a direct measure of the
    combined carbon and hydrogen impurity load introduced via ethane injection over
    the discharge. This quantity complements [ethane_prefill_count](name:ethane_prefill_count),
    which covers only the prefill phase preceding breakdown. Related hydrocarbon injection
    counts include [accumulated_propane_count](name:accumulated_propane_count) (C3H8,
    26 electrons per molecule) and [ethylene_count](name:accumulated_ethylene_count)
    (C2H4, 16 electrons per molecule).


    Sign convention: Positive when ethane gas is injected into the plasma vessel.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ethane_prefill_count
  - name:accumulated_propane_count
  - name:accumulated_ethylene_count
- name: accumulated_helium_3_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Time-integrated helium-3 inventory added by gas injection since plasma
    breakdown, represented as an equivalent-electron count. Each helium-3 atom contributes
    2 equivalent electrons because its atomic number is Z = 2.
  documentation: 'Accumulated helium-3 count due to gas injection is the total amount
    of helium-3 introduced after plasma breakdown by gas injection, expressed as a
    dimensionless equivalent-electron count. The equivalent-electron convention weights
    each neutral helium-3 atom by its atomic number, so one injected helium-3 atom
    contributes two counts.


    The accumulated equivalent-electron count is defined from the injected helium-3
    atomic source rate:


    $$

    N_{e,\mathrm{eq}}^{^{3}\mathrm{He}}(t) = 2 \int_{t_\mathrm{bd}}^{t} \Gamma_{^{3}\mathrm{He}}(t'')
    \, dt''

    $$


    where $N_{e,\mathrm{eq}}^{^{3}\mathrm{He}}$ is the accumulated equivalent-electron
    count, $t_\mathrm{bd}$ is the plasma-breakdown time, and $\Gamma_{^{3}\mathrm{He}}$
    is the helium-3 atom injection rate in atoms/s. The factor 2 is the helium atomic
    number and converts atoms to equivalent electrons.


    In practice this quantity is computed from calibrated gas-injection measurements
    such as valve flow calibrations, pressure-volume-temperature accounting, or mass-flow
    controller signals, with isotope-specific calibration for helium-3 when available.
    It represents gas injected after breakdown and is distinct from any prefill inventory
    present before the plasma is formed.


    Typical accumulated values are about $10^{18}-10^{21}$ equivalent electrons for
    trace or minority helium-3 puffs, and can reach $10^{22}-10^{23}$ equivalent electrons
    in large devices or long pulses with deliberate helium-3 fueling.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:helium_3_source_rate_due_to_gas_injection
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/helium_3/value
    dd_path: summary/gas_injection_accumulated/helium_3/value
    status: composed
- name: accumulated_helium_3_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of helium-3 atoms introduced by gas injection during
    the prefill phase, reported as an equivalent electron count. Each helium-3 atom
    contributes two equivalent electrons because its atomic number is 2.
  documentation: 'The accumulated helium-3 prefill count due to gas injection is the
    total amount of helium-3 admitted by gas valves before plasma breakdown, reported
    as an electron-equivalent particle count. It is an accounting convention for particle
    inventory: each neutral helium-3 atom contributes two equivalent electrons, but
    the gas need not be ionized during the prefill phase.


    The electron-equivalent prefill count is obtained by integrating the helium-3
    atomic injection rate over the prefill interval:


    $$

    N_{\mathrm{eq,prefill}}(^{3}\mathrm{He}) = 2 \int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}}
    \dot{N}_{^{3}\mathrm{He}}(t)\,dt

    $$


    where $\dot{N}_{^{3}\mathrm{He}}(t)$ is the helium-3 atomic injection rate in
    atoms s$^{-1}$, $t_{\mathrm{start}}$ is the start time of helium-3 prefill, $t_{\mathrm{bd}}$
    is the breakdown time or end of the prefill phase in seconds, and the factor 2
    converts atoms to equivalent electrons. The resulting count is dimensionless.


    In practice this quantity is inferred from calibrated gas-valve flow, reservoir
    depletion, pressure-rise measurements, or gas-balance analysis integrated over
    the prefill interval. It counts the amount introduced by injection, not the amount
    retained in the vessel after pumping, wall adsorption, or ionization. It is closely
    related to [helium_3_initial_count](name:accumulated_helium_3_prefill_count_due_to_gas_injection),
    is the prefill contribution to [accumulated_helium_3_count](name:accumulated_helium_3_count_due_to_gas_injection),
    and is the helium-3 counterpart of [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Typical values are $10^{19}$-$10^{22}$ equivalent electrons for small to medium
    devices and can approach $10^{23}$ equivalent electrons in large-volume machines
    or high-minority-fraction helium-3 prefills. These counts correspond to half as
    many injected helium-3 atoms and are often chosen to set the initial minority
    concentration for ion-cyclotron-resonance-heating scenarios.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_count_due_to_gas_injection
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/helium_3/value
    dd_path: summary/gas_injection_prefill/helium_3/value
    status: composed
- name: accumulated_helium_4_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Time-integrated count of helium-4 atoms from gas injection accumulated
    since plasma breakdown, expressed in equivalent electrons, where each helium-4
    atom contributes 2 equivalent electrons.
  documentation: "The accumulated helium-4 gas injection count is the time-integrated\
    \ total of helium-4 delivered via gas injection over the full discharge, expressed\
    \ as an equivalent-electron count. Unlike the phase-restricted quantity [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),\
    \ this quantity accumulates contributions from all injection phases \u2014 prefill,\
    \ flat-top fueling, and ramp-down \u2014 and represents the total helium-4 gas\
    \ throughput for the entire pulse, making it the discharge-level integral of helium_4_count_due_to_gas_injection.\n\
    \nThe cumulative count is defined as:\n\n$$\nN_\\text{acc}(t) = \\int_{t_0}^{t}\
    \ \\dot{N}_{\\mathrm{He}_4}(t') \\, dt'\n$$\n\nwhere $\\dot{N}_{\\mathrm{He}_4}$\
    \ is the instantaneous equivalent-electron injection rate and $t_0$ marks plasma\
    \ breakdown. Since helium-4 has atomic number $Z = 2$, each atom contributes 2\
    \ equivalent electrons; the atomic particle count is therefore this value divided\
    \ by 2. This equivalent-electron convention is shared across the gas-injection\
    \ count family, including [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection)\
    \ and [accumulated_argon_count](name:accumulated_argon_count), enabling uniform\
    \ cross-species fueling accounting.\n\nThe accumulated count is obtained by integrating\
    \ calibrated gas-valve flow signals over time and is used for helium inventory\
    \ management, fueling budget analysis, and helium-ash simulation studies.\n\n\
    Sign convention: Positive when helium-4 is injected into the plasma vessel, increasing\
    \ the accumulated equivalent-electron count."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:accumulated_argon_count
- name: accumulated_hydrogen_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative count of hydrogen atoms delivered by gas injection after
    plasma breakdown, expressed in equivalent electrons; hydrogen's atomic number
    Z = 1 means each atom contributes one equivalent electron.
  documentation: "The accumulated hydrogen count due to gas injection is the time-integrated\
    \ number of hydrogen atoms introduced into the plasma vessel by gas injection\
    \ systems after plasma breakdown. Because hydrogen has atomic number $Z_H = 1$,\
    \ the equivalent-electron count equals the atom count directly, unlike heavier\
    \ species such as the analogous [accumulated carbon count due to gas injection](name:accumulated_carbon_count_due_to_gas_injection),\
    \ which multiplies by $Z = 6$.\n\nThe defining relation for equivalent-electron\
    \ counting is:\n\n$$\nN_\\mathrm{eq} = Z \\cdot N_\\mathrm{atoms}\n$$\n\nwhere\
    \ $N_\\mathrm{atoms}$ is the number of injected atoms of the species and $Z$ is\
    \ its atomic number. For hydrogen, $Z_H = 1$, so $N_\\mathrm{eq} = N_\\mathrm{atoms}$.\n\
    \nThis quantity is obtained by integrating the gas valve flow rate over time from\
    \ plasma breakdown onward. The [accumulated hydrogen prefill count](name:accumulated_hydrogen_prefill_count)\
    \ records the hydrogen contributed during the pre-breakdown prefill phase; the\
    \ two together account for the full hydrogen gas inventory. Analogous counts for\
    \ other injected species \u2014 such as [accumulated nitrogen count](name:accumulated_nitrogen_count)\
    \ and [deuterium count due to gas injection](name:deuterium_count_due_to_gas_injection)\
    \ \u2014 follow the same equivalent-electron convention, scaled by the respective\
    \ atomic number.\n\nSign convention: Positive when hydrogen atoms have been injected\
    \ after plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_carbon_count_due_to_gas_injection
  - name:accumulated_hydrogen_prefill_count
  - name:accumulated_nitrogen_count
  - name:deuterium_count_due_to_gas_injection
- name: accumulated_hydrogen_prefill_count
  kind: scalar
  status: draft
  description: Cumulative count of hydrogen atoms introduced by gas injection during
    the plasma prefill phase prior to breakdown, expressed as an equivalent-electron
    count with one count per hydrogen atom.
  documentation: 'The prefill phase occurs before plasma breakdown, during which hydrogen
    gas is introduced into the vacuum vessel to establish the initial neutral density
    required for plasma initiation. This quantity accumulates the total hydrogen gas
    inventory across the entire prefill phase, with each hydrogen atom contributing
    one unit to the count, consistent with hydrogen''s atomic number $Z_H = 1$.


    The equivalent-electron convention expresses multi-species gas inventories on
    a common dimensionless scale by weighting each injected atom''s contribution by
    its atomic number $Z$:


    $$

    N_{\rm eq} = Z \cdot N_{\rm atoms}

    $$


    where $N_{\rm atoms}$ is the total number of injected atoms over the prefill interval.
    For hydrogen ($Z_H = 1$), the equivalent-electron count equals the raw atom count.
    This convention enables direct comparison across prefill species: for example,
    [accumulated helium-4 prefill count](name:accumulated_helium_4_count_due_to_gas_injection)
    weights each helium-4 atom by $Z = 2$, while [accumulated lithium prefill count](name:accumulated_lithium_prefill_count_due_to_gas_injection)
    uses $Z = 3$.


    The quantity is inferred from upstream pressure sensors and calibrated valve conductance
    integrated over the prefill interval, or from mass-flow controllers. The post-breakdown
    hydrogen inventory is tracked separately by [accumulated hydrogen count due to
    gas injection](name:accumulated_hydrogen_count_due_to_gas_injection), which resets
    at plasma breakdown.


    Sign convention: Positive when hydrogen gas flows into the vacuum vessel during
    the prefill phase, incrementing the accumulated atom count.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  - name:accumulated_hydrogen_count_due_to_gas_injection
- name: accumulated_krypton_count
  kind: scalar
  status: draft
  description: Cumulative number of krypton atoms injected into the machine since
    plasma breakdown, expressed in equivalent electrons.
  documentation: 'The accumulated krypton count is the running total of krypton atoms
    introduced since plasma breakdown, converted to an electron-equivalent basis where
    each krypton atom contributes $Z_{\rm Kr} = 36$ electron equivalents when fully
    stripped of its bound electrons.


    The quantity is obtained by integrating the instantaneous injection rate $\dot{N}_{\rm
    Kr}$ over time from the moment of plasma breakdown $t_0$:


    $$

    N_{\rm Kr,eq} = Z_{\rm Kr} \int_{t_0}^{t} \dot{N}_{\rm Kr}(t'') \, dt''

    $$


    where $Z_{\rm Kr} = 36$ is the atomic number of krypton and $\dot{N}_{\rm Kr}$
    is in atoms per second. This is distinct from the prefill-phase contribution captured
    by [krypton_prefill_count](name:krypton_prefill_count), which records only the
    gas load introduced before breakdown. Krypton serves as a heavy radiative seed
    impurity for power exhaust management and as a disruption mitigation agent; the
    cumulative injection inventory is therefore essential for interpreting bolometric
    radiated-power fractions and spectroscopic charge-state distributions throughout
    the discharge. Analogous running totals are defined for other injected species,
    including [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Sign convention: Positive when krypton has been cumulatively injected into the
    plasma since breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:krypton_prefill_count
  - name:accumulated_neon_count
  - name:accumulated_helium_4_count_due_to_gas_injection
- name: accumulated_lithium_count
  kind: scalar
  status: draft
  description: Cumulative amount of lithium supplied by gas injection after plasma
    breakdown, reported as an equivalent-electron count. Each lithium atom contributes
    3 equivalent electrons, so the value is three times the injected lithium atom
    count over the post-breakdown interval.
  documentation: 'Accumulated lithium count is the cumulative lithium supplied by
    gas injection after plasma breakdown, converted to an equivalent-electron count
    using the lithium atomic number 3. It excludes lithium present before breakdown
    or introduced by other sources unless those sources are part of the gas-injection
    flow being integrated. The corresponding accumulated lithium atom count, comparable
    to lithium_count when that quantity represents an inventory or prefill amount,
    is one third of this value.


    The accumulated equivalent-electron count at time $t$ is defined by integrating
    the lithium atom injection rate from breakdown to that time:


    $$

    N_{\mathrm{Li,eqe}}(t) = 3 \int_{t_\mathrm{bd}}^{t} \Gamma_{\mathrm{Li}}(t'')
    \, dt''

    $$


    where $N_{\mathrm{Li,eqe}}$ is the accumulated lithium count expressed as equivalent
    electrons, $\Gamma_{\mathrm{Li}}$ is the neutral lithium atom flow rate delivered
    by gas injection in atoms/s, $t''$ is the integration time in seconds, $t_\mathrm{bd}$
    is the plasma-breakdown time, and the factor 3 is the atomic number of lithium.


    In practice this quantity is computed by time-integrating calibrated gas-injection
    throughput, valve-command, pressure-drop, or mass-flow measurements after conversion
    to a lithium atom flow rate. Corrections may account for valve response, conductance
    of the injection line, reservoir temperature, and uncertainty in the fraction
    of commanded material that enters the plasma chamber.


    Typical values depend strongly on device size and seeding scenario. Small experiments
    may accumulate about $10^{17}-10^{19}$ lithium atoms, corresponding to $3 \times
    10^{17}-3 \times 10^{19}$ equivalent electrons, while deliberate injection in
    medium or large tokamak discharges can reach about $10^{19}-10^{21}$ lithium atoms,
    corresponding to $3 \times 10^{19}-3 \times 10^{21}$ equivalent electrons.'
  unit: '1'
  physics_domain: plant_systems
  links: []
- name: accumulated_lithium_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Accumulated count of lithium introduced by gas injection during the
    prefill phase, expressed as a dimensionless equivalent-electron count. Each lithium
    atom contributes three count units from its atomic number.
  documentation: 'The accumulated lithium prefill count is the total lithium delivered
    by gas injection before plasma breakdown, converted to an equivalent-electron
    bookkeeping count. It includes only the prefill interval and is distinct from
    the post-breakdown accumulated lithium inventory represented by [accumulated_lithium_count](name:accumulated_lithium_count).


    The count is defined by integrating the lithium atom injection rate over the prefill
    window:


    $$

    N_{\mathrm{Li,eq}} = 3 \int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}} \frac{dN_{\mathrm{Li}}}{dt}
    \, dt

    $$


    where $N_{\mathrm{Li,eq}}$ is the dimensionless equivalent-electron count, $dN_{\mathrm{Li}}/dt$
    is the lithium atom injection rate in atoms per second, $N_{\mathrm{Li}}$ counts
    lithium atoms rather than equivalent electrons, $t_{\mathrm{start}}$ is the start
    of the prefill interval, and $t_{\mathrm{bd}}$ is the time of plasma breakdown.
    The factor 3 is lithium''s atomic number, so one injected lithium atom contributes
    three equivalent-electron count units. For non-negative flow rates and $t_{\mathrm{bd}}
    \ge t_{\mathrm{start}}$, the accumulated count is non-negative.


    In practice, the prefill inventory is inferred from calibrated gas-injection flow
    measurements, reservoir conditions, valve timing, or particle-throughput calibrations
    integrated over the pre-breakdown interval. The same equivalent-electron convention
    is used for related prefill species inventories such as [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),
    [accumulated_helium_3_prefill_count_due_to_gas_injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection),
    and [accumulated_oxygen_prefill_count_due_to_gas_injection](name:accumulated_oxygen_prefill_count_due_to_gas_injection).


    Typical values for lithium prefill are often about 10^16-10^21 in dimensionless
    equivalent-electron count, depending on the gas-injection system, valve duration,
    requested conditioning dose, and discharge preparation scenario.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_lithium_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_helium_3_prefill_count_due_to_gas_injection
  - name:accumulated_oxygen_prefill_count_due_to_gas_injection
