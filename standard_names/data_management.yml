- name: simulation_start_time
  kind: scalar
  status: draft
  description: Lower temporal boundary of a numerical simulation interval, marking
    the physical time at which the simulation begins evolving the plasma state.
  documentation: 'The simulation start time $t_0$ defines the absolute time coordinate
    at which the numerical integration of the plasma equations commences. Together
    with [simulation_end_time](name:simulation_end_time), it bounds the simulation
    interval $[t_0, t_f]$; the elapsed duration is $\Delta t = t_f - t_0$. Within
    a running workflow, [simulation_current_time](name:simulation_current_time) advances
    from $t_0$ toward $t_f$ in increments set by [simulation_time_step](name:simulation_time_step)
    $\delta t$. In fusion plasma simulations, $t_0$ is commonly expressed relative
    to the beginning of the discharge pulse, with typical values spanning from $-0.5$
    s (pre-discharge initialization) to several tens of seconds for long-pulse devices.
    When restarting from a checkpoint, $t_0$ is reset to the restart time rather than
    the original simulation origin.


    Sign convention: Positive when $t_0$ is after the reference epoch (typically the
    start of the discharge pulse), and negative when the simulation begins before
    that reference point.'
  unit: s
  physics_domain: data_management
  links:
