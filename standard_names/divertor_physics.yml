- name: argon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of argon impurity ions in the plasma layer immediately
    adjacent to the divertor target surface.
  documentation: 'The argon density at the divertor target quantifies the concentration
    of ionized argon impurities arriving at the plasma-facing surface. Argon is commonly
    injected as a radiative impurity to reduce the peak heat flux to the divertor
    through line radiation; its density near the target is determined by the balance
    between upstream transport, ionization, and recombination within the divertor
    volume. The quantity is routinely inferred from spectroscopic line ratios (e.g.,
    Ar XVI to Ar XVIII emission) combined with collisional-radiative modeling, or
    from Langmuir probe measurements assuming known argon charge-state distribution.
    Typical values in seeded-divertor operation range from $10^{16}$ to $10^{19}$
    m$^{-3}$, depending on the seeding rate and divertor detachment state. The argon
    density is closely coupled to the electron density and electron temperature at
    the target, and it directly affects the divertor radiation front location and
    the total ion density at the target.


    Sign convention: Positive when the number density of argon ions is defined, increasing
    as the ion density rises in the plasma layer contacting the target.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_density_at_divertor_target
  - name:iron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/argon/value
    dd_path: summary/local/divertor_target/n_i/argon/value
    status: vocab_gap
- name: electron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of free electrons in the plasma layer immediately adjacent
    to the divertor target surface.
  documentation: 'The electron density at the divertor target, $n_{e,\text{target}}$,
    is a key parameter in the two-point model of the scrape-off layer (SOL). It controls
    the ion saturation current density, $j_{\text{sat}} = e n_e c_s$, where $e$ is
    the elementary charge and $c_s$ is the sound speed, and sets the power flux to
    the target via the sheath heat transmission. Typical values range from $10^{19}$
    to $10^{21}$ m$^{-3}$ in high-recycling and detached divertor conditions, and
    are inferred from Langmuir probe measurements or spectroscopic line ratios combined
    with collisional-radiative modeling.


    The electron density is closely coupled to the [electron temperature at the target](name:electron_temperature_at_divertor_target)
    through pressure balance along the field line and to the [total ion density](name:total_ion_density_at_divertor_target)
    via quasi-neutrality.


    Sign convention: Positive when the number of electrons per unit volume is defined.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/two_point_model/n_e_target
    dd_path: divertors/divertor/target/two_point_model/n_e_target
    status: composed
  - id: dd:summary/local/divertor_plate/n_e/value
    dd_path: summary/local/divertor_plate/n_e/value
    status: composed
  - id: dd:summary/local/divertor_target/n_e/value
    dd_path: summary/local/divertor_target/n_e/value
    status: composed
- name: electron_power_at_divertor_target
  kind: scalar
  status: draft
  description: Total thermal power carried by electrons to the inner divertor target
    surface.
  documentation: The electron power at the inner divertor target is the integral of
    the incident electron heat flux density over the target surface area. It represents
    the power transported by the electron population along open magnetic field lines
    to the divertor region, typically dominated by parallel transport and sheath acceleration.
    The power is positive when electrons deposit energy onto the target (i.e., net
    power flow into the surface). Typical values in a tokamak range from kilowatts
    to tens of megawatts, scaling with the input heating power and divertor geometry.
    This quantity is measured via Langmuir probes or inferred from infrared thermography
    and spectroscopy.
  unit: W
  physics_domain: divertor_physics
  links:
  - name:total_ion_power_at_divertor_target
  - name:electron_temperature_at_divertor_target
  sources:
  - id: dd:wall/global_quantities/electrons/power_inner_target
    dd_path: wall/global_quantities/electrons/power_inner_target
    status: composed
  - id: dd:wall/global_quantities/electrons/power_outer_target
    dd_path: wall/global_quantities/electrons/power_outer_target
    status: composed
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Electron temperature of the plasma incident on the divertor target
    surface.
  documentation: "The electron temperature at the divertor target, $T_{e,\\mathrm{div}}$,\
    \ quantifies the thermal energy of electrons striking the divertor plate. It is\
    \ a critical parameter for determining the heat flux deposited on the target,\
    \ the onset of detachment, and the erosion rate of plasma-facing components. Typical\
    \ values range from 1\u201310 eV in detached plasmas to 20\u2013100 eV in attached,\
    \ high-recycling regimes, measured by Langmuir probes or interpreted from spectrometer\
    \ line ratios. This quantity is closely related to the [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target)\
    \ and the [scrape_off_layer_heat_length_at_divertor_target](name:scrape_off_layer_heat_length_at_divertor_target),\
    \ which together characterize the divertor plasma state.\n\nSign convention: Positive\
    \ when the electron temperature value is greater than zero.\n\nIn steady-state\
    \ conditions, the target electron temperature is governed by parallel power balance\
    \ along the magnetic field line and the sheath heat transmission factors. For\
    \ attached plasmas, $T_{e,\\mathrm{div}}$ scales approximately with the upstream\
    \ temperature $T_{e,u}$ as $T_{e,\\mathrm{div}} \\approx T_{e,u} / 2$ under the\
    \ two-point model, while strong divertor radiation or detachment reduces it below\
    \ 5 eV."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:ion_temperature_at_divertor_target
  - name:scrape_off_layer_heat_length_at_divertor_target
  sources:
  - id: dd:divertors/divertor/target/two_point_model/t_e_target
    dd_path: divertors/divertor/target/two_point_model/t_e_target
    status: composed
  - id: dd:summary/local/divertor_plate/t_e/value
    dd_path: summary/local/divertor_plate/t_e/value
    status: composed
  - id: dd:summary/local/divertor_target/t_e/value
    dd_path: summary/local/divertor_target/t_e/value
    status: composed
- name: helium_3_density_at_divertor_target
  kind: scalar
  status: draft
  description: "Number density of singly-ionized helium-3 (\xB3He\u207A) particles\
    \ in the plasma layer incident on the divertor target surface."
  documentation: "The helium-3 density at the divertor target quantifies the \xB3\
    He\u207A ion concentration in the plasma scrape-off layer as it reaches the target\
    \ surface. This density is determined by the balance between core helium-3 transport,\
    \ edge neutral recycling, and divertor pumping \u2014 processes critical for controlling\
    \ fusion ash accumulation and fuel mixture in reactors. Typical divertor target\
    \ densities span 10\xB9\u2076\u201310\xB9\u2079 m\u207B\xB3 in tokamaks, depending\
    \ on heating power, divertor regime, and helium-3 gas injection rate. The density\
    \ is inferred from spectroscopic line emission measurements (e.g., He II 468.6\
    \ nm) combined with collisional-radiative modeling, or from target Langmuir probe\
    \ data combined with local ion composition analysis. The companion quantity [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)\
    \ gives the sum over all species, while [helium_3_density_at_separatrix](name:helium_3_density_at_separatrix)\
    \ provides the upstream reference.\n\nSign convention: Positive when the number\
    \ density of helium-3 ions is defined in the rest frame of the target surface,\
    \ i.e., positive for any finite particle concentration.\n\nIn diverted configurations,\
    \ the helium-3 density at the target is a key boundary condition for both core\
    \ impurity transport modeling, via the [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal),\
    \ and for helium exhaust optimization in steady-state reactor scenarios."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:total_ion_density_at_divertor_target
  - name:helium_3_density_at_separatrix
  - name:helium_3_density_at_pedestal
  sources:
  - id: dd:summary/local/divertor_target/n_i/helium_3/value
    dd_path: summary/local/divertor_target/n_i/helium_3/value
    status: composed
- name: helium_4_density_at_divertor_target
  kind: scalar
  status: draft
  description: "Number density of singly-ionized helium-4 (\u2074He\u207A) particles\
    \ in the plasma layer immediately adjacent to the divertor target surface."
  documentation: "The helium-4 density at the divertor target quantifies the concentration\
    \ of singly-ionized \u2074He\u207A ions incident on the target surface. In burning-plasma\
    \ scenarios, \u2074He is the primary fusion ash, and its accumulation in the divertor\
    \ region affects tritium retention and core fueling. The local density $n_{\u2074\
    He\u207A}$ is governed by transport along the scrape-off layer and by volumetric\
    \ recombination and ionization processes. Typical divertor target densities for\
    \ helium ash range from $10^{17}$ to $10^{20}$\u202Fm$^{-3}$, depending on the\
    \ core fusion rate and the divertor detachment state. This quantity is inferred\
    \ from spectroscopic line emission (e.g., He\u202FII 468.6\u202Fnm) interpreted\
    \ through collisional-radiative models, or from Langmuir-probe ion-saturation\
    \ current with mass-resolved correction. It is naturally paired with $[\\text{argon\\\
    _density\\_at\\_divertor\\_target}](name:argon_density_at_divertor_target)$ and\
    \ $[\\text{electron\\_density\\_at\\_divertor\\_target}](name:electron_density_at_divertor_target)$\
    \ to characterize impurity and fuel species in the divertor plasma.\n\nSign convention:\
    \ Positive when the local density of \u2074He\u207A particles is non-zero in the\
    \ plasma layer immediately adjacent to the target surface."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:argon_density_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/helium_4/value
    dd_path: summary/local/divertor_target/n_i/helium_4/value
    status: composed
- name: ion_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Thermal energy of the ion population incident on the divertor target,
    averaged over all ion species.
  documentation: "The ion temperature at the divertor target is the mean thermal energy\
    \ per ion, averaged over all ion species present in the incident plasma, expressed\
    \ as a temperature via $T_i = 2 \\langle E_i \\rangle / (3 k_B)$. It is a key\
    \ parameter controlling the plasma heat flux to the target surface, the ion impact\
    \ energy for sputtering, and the sheath potential drop. Typical values range from\
    \ 1\u201350 eV in detached divertor conditions to 50\u2013200 eV in attached regimes.\
    \ The ion temperature is often inferred from Langmuir probe measurements (assuming\
    \ $T_i \\approx T_e$) or from spectroscopic line broadening. For comparison, the\
    \ [electron temperature at the divertor target](name:electron_temperature_at_divertor_target)\
    \ can differ significantly from the ion temperature in detached plasmas due to\
    \ thermal decoupling.\n\nSign convention: Positive when the ion thermal motion\
    \ is directed toward the target surface."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/t_i_average/value
    dd_path: summary/local/divertor_plate/t_i_average/value
    status: composed
  - id: dd:summary/local/divertor_target/t_i_average/value
    dd_path: summary/local/divertor_target/t_i_average/value
    status: composed
- name: iron_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of ionized iron impurity in the plasma layer immediately
    adjacent to the divertor target surface.
  documentation: 'The iron density $n_{\mathrm{Fe}}$ at the divertor target quantifies
    the local concentration of sputtered or injected iron impurity ions, which can
    radiatively cool the divertor plasma and affect erosion rates. In tokamaks, iron
    impurities typically originate from plasma-facing components (e.g., steel tiles)
    and are transported along field lines into the divertor region. Typical values
    range from $10^{14}\,\text{m}^{-3}$ in well-controlled low-Z scenarios to $10^{18}\,\text{m}^{-3}$
    during high-recycling or detached regimes with elevated sputtering. This density
    is routinely derived from spectroscopic line emission or from probe measurements
    combined with collisional-radiative modeling. The quantity is closely related
    to [iron_density_at_separatrix](name:iron_density_at_separatrix) and to the total
    impurity inventory [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).


    Sign convention: Positive when the iron impurity ion density is measured as a
    particle number per unit volume.


    The local iron density also influences the [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target)
    through radiation losses and charge-exchange energy exchange, and is a key input
    for erosion modeling alongside the target heat flux.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_separatrix
  - name:total_ion_density_at_divertor_target
  - name:ion_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/iron/value
    dd_path: summary/local/divertor_target/n_i/iron/value
    status: composed
- name: krypton_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of krypton impurity ions incident on the plasma-facing
    surface of the divertor target.
  documentation: 'The krypton density at the divertor target $n_{\mathrm{Kr}}(R_{\mathrm{targ}})$
    quantifies the local concentration of injected or intrinsic krypton impurities
    in the plasma layer immediately adjacent to the target surface. Krypton is commonly
    introduced as a radiative impurity to reduce peak heat fluxes in the divertor,
    and its density is inferred from spectroscopic line emission (e.g., Kr VIII at
    133.7 nm) combined with collisional-radiative modeling, or from residual gas analyzer
    signals calibrated against known injection rates. Typical values range from $10^{14}$
    to $10^{17}$ m$^{-3}$ in attached divertor conditions and increase in detached
    or high-density regimes as the impurity accumulates near the target. Understanding
    $n_{\mathrm{Kr}}$ is critical for predicting radiative losses, fuel dilution,
    and erosion of tungsten plasma-facing components. For comparison across impurity
    species, see [iron_density_at_divertor_target](name:iron_density_at_divertor_target);
    the total ion population is captured by [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).


    Sign convention: Positive when the number density of krypton ions is defined as
    a non-negative quantity.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/krypton/value
    dd_path: summary/local/divertor_target/n_i/krypton/value
    status: composed
- name: lithium_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of lithium impurity ions in the plasma layer incident
    on the divertor target surface.
  documentation: 'Lithium is commonly injected into tokamaks for wall conditioning
    and plasma-facing surface coating. The lithium density at the divertor target
    quantifies the local concentration of ionized lithium, which can affect recycling,
    radiative losses, and plasma dilution in the divertor region. Typical values range
    from $10^{15}$ to $10^{18}$ m$^{-3}$ depending on the seeding rate, divertor regime,
    and proximity to the strike point. This quantity is inferred from spectroscopic
    line emission (e.g., Li II 548.5 nm) combined with collisional-radiative modeling
    or from local Langmuir probe measurements with mass discrimination. The sister
    quantity [iron_density_at_divertor_target](name:iron_density_at_divertor_target)
    captures a similar impurity species, while [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target)
    gives the total ion inventory at the target.


    Sign convention: Positive when defined.


    Measurement context includes divertor spectroscopy arrays and retarding-field
    analyzers, with spatial resolution along the divertor target surface. The density
    profile is sensitive to the divertor thermal state, with higher values typically
    observed in detached regimes where volumetric recombination is suppressed. Cross-calibration
    against [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    helps constrain the ionization balance of lithium within the divertor plasma.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/lithium/value
    dd_path: summary/local/divertor_target/n_i/lithium/value
    status: composed
- name: neon_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of ionized neon impurity in the plasma layer immediately
    adjacent to the divertor target surface.
  documentation: 'Neon density at the divertor target quantifies the local concentration
    of ionized neon (Ne$^{+}$) within the sheath or presheath region adjacent to the
    target plate. It is a key metric for impurity seeding scenarios in tokamaks, where
    neon is injected to radiate power and reduce heat flux to the divertor. The density
    depends on the local ionization source, transport along field lines (often from
    the core or separatrix), and the recombination sink at the target surface. Typical
    values range from $10^{15}$ to $10^{19}$ m$^{-3}$ in H-mode plasmas, scaling with
    the injected neon puff rate and the divertor neutral pressure. Measurement is
    obtained via spectroscopy (line emission from excited neutral neon near the target)
    combined with collisional-radiative modeling. This quantity is the natural partner
    to `electron_temperature_at_divertor_target` in the two-point model, which relates
    upstream and target conditions along a flux tube. The number density is defined
    as the total count of Ne$^{+}$ ions per unit volume, and is intrinsically non-negative.


    Sign convention: Positive when number density is non-negative.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:krypton_density_at_divertor_target
  - name:electron_density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i/neon/value
    dd_path: summary/local/divertor_target/n_i/neon/value
    status: composed
- name: parallel_heat_flux_at_divertor_target
  kind: scalar
  status: draft
  description: Heat flux density parallel to the magnetic field line at the divertor
    target surface, mapped to the outboard midplane.
  documentation: "The parallel heat flux $q_{\\parallel}$ at the divertor target quantifies\
    \ the power per unit area conducted and convected along the magnetic field onto\
    \ the target surface. It is a key quantity governing divertor heat loads, target\
    \ erosion, and detachment physics in tokamak scrape-off layer (SOL) plasmas. $q_{\\\
    parallel}$ is inferred from infra-red (IR) thermography of target surface temperatures,\
    \ combined with heat-flux accounting that maps the measured power back along the\
    \ field line to the outboard midplane. Typical values in high-power H-mode discharges\
    \ range 10\u2013100 MW/m\xB2 at the strike point, falling to 1\u201310 MW/m\xB2\
    \ in the far SOL. The total power deposited on the target is given by the integral\
    \ of $q_{\\parallel}$ over the wetted area; see [peak_heat_flux_at_divertor_target](name:peak_heat_flux_at_divertor_target)\
    \ for the peak value and [scrape_off_layer_heat_length_at_divertor_target](name:scrape_off_layer_heat_length_at_divertor_target)\
    \ for the radial decay length."
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:peak_heat_flux_at_divertor_target
  - name:scrape_off_layer_heat_length_at_divertor_target
  sources:
  - id: dd:camera_ir/frame_analysis/power_flux_parallel
    dd_path: camera_ir/frame_analysis/power_flux_parallel
    status: composed
- name: peak_heat_flux_at_divertor_target
  kind: scalar
  status: draft
  description: Maximum heat flux density deposited on a divertor target surface from
    plasma interaction.
  documentation: "The peak heat flux $q_{\\text{peak}}$ is the maximum value of the\
    \ power per unit area incident on a divertor target surface, typically located\
    \ at or near the strike point where the plasma intercepts the target. It is a\
    \ critical engineering parameter for assessing thermal loads on plasma-facing\
    \ components, influencing material erosion and component lifetime. Measured using\
    \ infrared thermography or Langmuir probes, typical values range from 1\u2013\
    15 MW/m\xB2 in H-mode tokamaks, with transient events like edge-localized modes\
    \ producing much higher instantaneous fluxes. The peak heat flux depends on the\
    \ scrape-off layer power width $\\lambda_q$ as described by [scrape_off_layer_heat_length_at_divertor_target](name:scrape_off_layer_heat_length_at_divertor_target)\
    \ and the local [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target)."
  unit: W.m^-2
  physics_domain: divertor_physics
  links:
  - name:scrape_off_layer_heat_length_at_divertor_target
  - name:electron_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_plate/power_flux_peak/value
    dd_path: summary/local/divertor_plate/power_flux_peak/value
    status: composed
- name: total_ion_density_at_divertor_target
  kind: scalar
  status: draft
  description: Total ion particle density at the divertor target, summed over all
    ion species.
  documentation: "The total ion density $n_{\\text{i,total}}$ at the divertor target\
    \ surface quantifies the total number of ions (including main fuel and all impurity\
    \ species) per unit volume incident on the plasma-facing component. This quantity\
    \ is a key input for determining the particle flux $\\Gamma = n_{\\text{i,total}}\
    \ v_{\\parallel}$ onto the target and the resulting erosion, deposition, and hydrogenic\
    \ recycling. Typical values in the divertor region range from $10^{19}\\,\\text{m}^{-3}$\
    \ in low-density attached plasmas to over $10^{21}\\,\\text{m}^{-3}$ in high-recycling\
    \ or detached regimes. It is routinely inferred from Langmuir probe measurements\
    \ (ion saturation current) and collisional-radiative modeling of spectroscopic\
    \ line emission. See also [ion_temperature_at_divertor_target](name:ion_temperature_at_divertor_target)\
    \ for the corresponding ion thermal energy, [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ for a specific impurity contribution, and [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target)\
    \ for the electron temperature at the same location.\n\nSign convention: Positive\
    \ when the ion density is measured in the direction from the plasma toward the\
    \ target surface.\n\nThis quantity is a summed total over all ion species \u2014\
    \ main ions, seeded impurities, and intrinsic impurities alike."
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_temperature_at_divertor_target
  - name:iron_density_at_divertor_target
  - name:electron_temperature_at_divertor_target
  sources:
  - id: dd:summary/local/divertor_target/n_i_total/value
    dd_path: summary/local/divertor_target/n_i_total/value
    status: composed
- name: total_ion_power_at_divertor_target
  kind: scalar
  status: draft
  description: Total thermal power deposited on the inner divertor target by all ion
    species, combining convective and conductive heat transport.
  documentation: 'The total ion power at the inner divertor target represents the
    heat flux carried by all ion species striking the divertor surface. It includes
    both the convective contribution from the plasma flow and the conductive contribution
    from the thermal ion motion: $P_{\text{ion,target}} = \sum_s \left( \frac{5}{2}
    k_B T_s + E_{\text{rec},s} \right) \Gamma_s$, where $T_s$ is the ion temperature
    at the target, $\Gamma_s$ is the ion flux density, and $E_{\text{rec},s}$ accounts
    for surface recombination energy release summed over species $s$ (typically deuterium,
    tritium, and helium). This power drives material erosion and requires active cooling;
    typical values for ITER-scale inner divertors reach $50-100\,\text{MW}$ steady
    state, with transient excursions up to $200\,\text{MW}$ during ELMs. The equivalent
    electron-side quantity is [electron_power_at_divertor_target](name:electron_power_at_divertor_target),
    and the complementary species density distribution is [total_ion_density_at_divertor_target](name:total_ion_density_at_divertor_target).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:electron_power_at_divertor_target
  - name:total_ion_density_at_divertor_target
  sources:
  - id: dd:wall/global_quantities/power_inner_target_ion_total
    dd_path: wall/global_quantities/power_inner_target_ion_total
    status: composed
- name: tungsten_density_at_divertor_target
  kind: scalar
  status: draft
  description: Number density of tungsten impurity ions in the plasma layer immediately
    adjacent to the divertor target surface. This high-Z ion density governs radiative
    cooling and erosion in the divertor region. Measured in particles per cubic meter.
  documentation: 'The tungsten density at the divertor target is the local concentration
    of tungsten impurity ions situated in the plasma layer immediately adjacent to
    the divertor target surface. It quantifies the tungsten particle number per unit
    volume and is critical for assessing radiative power losses, impurity erosion
    rates, and core contamination risks in the divertor. The density is related to
    the electron density and the fractional tungsten impurity concentration by $n_W
    \approx f_{W} \, n_e$, where $n_W$ is the tungsten density in m$^{-3}$, $f_W$
    is the fractional concentration of tungsten ions, and $n_e$ is the electron density
    in m$^{-3}$. Typical values range from $10^{16}$ to $10^{20}\,\text{m}^{-3}$,
    varying with discharge conditions such as divertor plasma temperature and particle
    flux. The tungsten density originates from sputtering or injection of tungsten
    from plasma-facing components and is commonly inferred from spectroscopic measurements
    of tungsten line emission (e.g., WI, WII, WIII) combined with collisional-radiative
    modeling, or from Langmuir probe data with assumptions on the ionization state.


    Sign convention: Positive when the net flow of tungsten ions is directed toward
    the target surface.'
  unit: m^-3
  physics_domain: divertor_physics
