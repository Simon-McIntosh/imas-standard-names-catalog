name: coulomb_collisions_thermal_ion_toroidal_torque
status: draft
description: Volume-integrated toroidal torque transferred to the thermal ion population
  through Coulomb collisions with fast particles of a given species or charge state.
documentation: "This quantity represents the total toroidal torque $T_{\\phi,i}^{\\\
  mathrm{th}}$ (N\xB7m) received by the background thermal ions from Coulomb collisions\
  \ with the supra-thermal fast-particle distribution, integrated over the plasma\
  \ volume. By momentum conservation, $T_{\\phi,i}^{\\mathrm{th}} = -T_{\\phi,\\mathrm{fast\\\
  text{-}i}}$, where $T_{\\phi,\\mathrm{fast\\text{-}i}}$ is the torque on the fast\
  \ particles due to ion friction (`fast_particle_toroidal_torque_due_to_coulomb_collisions_with_ions`).\
  \ For NBI-heated tokamak plasmas, this collisional ion torque is the dominant channel\
  \ through which injected beam momentum reaches the bulk plasma, driving toroidal\
  \ rotation; magnitudes are typically $0.1$\u2013$1\\;\\mathrm{N\\,m}$ and depend\
  \ on the beam injection geometry, energy, and background ion temperature. Evaluated\
  \ by orbit-following Monte Carlo codes (NUBEAM, ASCOT) or analytic slowing-down\
  \ models. This torque enters the toroidal angular momentum balance equation alongside\
  \ turbulent viscous transport and $\\mathbf{j} \\times \\mathbf{B}$ contributions.\
  \ See also the electron recoil channel (`thermal_electron_toroidal_torque_due_to_coulomb_collisions`)\
  \ and the profile-resolved density (`ion_collisional_toroidal_torque_density_on_thermal_population_due_to_fast_ions`)."
