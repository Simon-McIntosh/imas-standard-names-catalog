  documentation: 'The vertical coordinate $Z_{\mathrm{lim}}$ of the active limiter
    point at the plasma boundary in the IMAS cylindrical $(R, \phi, Z)$ frame. This
    point defines the outermost extent of the confined plasma where it contacts the
    limiter surface, governing heat-flux deposition and plasma-wall interaction. The
    value is obtained from equilibrium reconstruction or from magnetic measurements
    that identify the limiter contact location.


    Sign convention: Positive when the active limiter contact point lies above the
    midplane ($Z > 0$).


    Typical values span $\pm moid$ of the vessel vertical height, e.g., $\sim\pm 2\,\mathrm{m}$
    in ITER. Compare with [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point)
    for the nearest wall element and [gap_at_separatrix](name:gap_at_separatrix) for
    the distance to the limiter.'
