- name: radial_component_of_ferritic_element_magnetic_moment
  kind: scalar
  status: draft
  description: Radial ($\hat{R}$) component of the magnetic dipole moment per unit
    area induced in a ferritic structural element by the ambient tokamak magnetic
    field, representing the magnetization state projected onto the major-radius direction.
  documentation: "The radial component $M_R = \\mathbf{M} \\cdot \\hat{R}$ isolates\
    \ the magnetization of ferritic structural elements \u2014 such as ferritic steel\
    \ test blanket modules or vacuum vessel segments \u2014 along the major-radius\
    \ direction in the right-handed cylindrical $(R, \\phi, Z)$ frame. Ferritic components\
    \ become magnetized through their nonlinear permeability response to the local\
    \ field $\\mathbf{B}$, and the resulting induced moment density modifies the equilibrium\
    \ field distribution, particularly near the plasma boundary. Together with [toroidal_component_of_ferritic_element_magnetic_moment](name:toroidal_component_of_ferritic_element_magnetic_moment)\
    \ and [vertical_component_of_ferritic_element_magnetic_moment](name:vertical_component_of_ferritic_element_magnetic_moment),\
    \ this quantity completes the cylindrical $(R, \\phi, Z)$ decomposition of [ferritic_element_magnetic_moment](name:ferritic_element_magnetic_moment).\
    \ The radial component is typically the smallest of the three cylindrical components\
    \ in axisymmetric configurations where $B_\\phi$ dominates, but becomes significant\
    \ near non-axisymmetric features or during transients. It is computed from finite-element\
    \ or boundary-element magnetostatic models of the ferritic structure driven by\
    \ the reconstructed plasma and coil fields.\n\nSign convention: Positive when\
    \ the magnetization component points in the direction of increasing major radius\
    \ $R$ (outward from the machine symmetry axis)."
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
