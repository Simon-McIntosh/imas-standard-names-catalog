- name: parallel_wave_electric_field_real_part
  kind: complex
  status: active
  description: Real, in-phase coefficient of the wave electric-field phasor projected
    along the local equilibrium magnetic-field direction, complementing its quadrature
    coefficient.
  documentation: 'This quantity is the in-phase coefficient of the complex [parallel
    wave electric field](name:parallel_wave_electric_field) phasor, resolved along
    the local equilibrium magnetic-field direction. It represents the component aligned
    with the chosen phasor phase reference, not the field magnitude or instantaneous
    electric field.


    $$

    E_{parallel,mathrm{R}} = operatorname{Re}\!\left(E_{parallel}\right)

    $$


    where $E_{parallel}$ is the complex parallel wave-electric-field phasor, $E_{parallel,mathrm{R}}$
    is its real coefficient, and $\operatorname{Re}$ denotes the real-part operator.
    The phase reference is the same one used for the corresponding [parallel wave
    electric field imaginary part](name:parallel_wave_electric_field_imaginary_part);
    together, the two coefficients specify the complex phasor. The coefficient is
    signed according to projection onto the selected local magnetic-field direction.


    Sign convention: Positive when the in-phase electric-field coefficient points
    along the chosen local equilibrium magnetic-field direction.'
