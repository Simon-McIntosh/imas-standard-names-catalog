- name: magnetic_shear_at_sawtooth_inversion_radius
  kind: scalar
  status: active
  description: Magnetic shear evaluated at the sawtooth inversion radius, defined
    as the normalized logarithmic derivative of the safety factor with respect to
    normalized toroidal flux radius.
  documentation: 'Magnetic shear at the sawtooth inversion radius is the value of
    [magnetic shear](name:magnetic_shear) on the flux surface where the sawtooth-crash
    electron-temperature perturbation changes sign.


    Using the [normalized toroidal flux coordinate at the sawtooth inversion radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius)
    $\rho_{\mathrm{tor,norm}}$ as the radial label, the defining relation is


    $$

    s_{\mathrm{inv}} = \left.\frac{\rho_{\mathrm{tor,norm}}}{q}\frac{dq}{d\rho_{\mathrm{tor,norm}}}\right|_{\rho_{\mathrm{tor,norm}}=\rho_{\mathrm{inv}}}

    $$


    where $q$ is the safety factor, $\rho_{\mathrm{inv}}$ is the normalized toroidal
    flux radius of the inversion surface, and $s_{\mathrm{inv}}$ is the corresponding
    magnetic shear.


    This is a point evaluation at the inversion surface, not a flux-surface average
    or a volume average. The inversion surface is not defined by $q=1$ and differs
    from [magnetic shear at the magnetic axis](name:magnetic_shear_at_magnetic_axis).


    Sign convention: Positive when $q^{-1}dq/d\rho_{\mathrm{tor,norm}}$ is positive
    as the normalized toroidal flux radius increases outward from the magnetic axis.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  - name:magnetic_shear_at_magnetic_axis
  sources:
  - dd_path: sawteeth/diagnostics/magnetic_shear_q1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/sawteeth.html#sawteeth-diagnostics-magnetic_shear_q1
    dd_documentation:
      leaf: Magnetic shear at surface q = 1, defined as rho_tor/q . dq/drho_tor
      parent_path: sawteeth/diagnostics
      parent: Detailed information about the sawtooth characteristics
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - sawteeth/time
    enhanced_context:
      description: "Magnetic shear (s) at the q=1 rational surface, defined as (rho_tor/q)\xB7\
        (dq/drho_tor) evaluated where the safety factor equals unity. A key parameter\
        \ for sawtooth trigger models and MHD stability analysis."
      kind: llm
- name: normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label locating the sawtooth inversion
    radius, where the electron-temperature perturbation changes sign during a crash.
  documentation: 'The quantity is the normalized toroidal magnetic-flux label of the
    magnetic surface passing through the sawtooth inversion radius. This radius is
    the location at which the electron-temperature perturbation reverses sign during
    a sawtooth crash.


    The value is defined by the normalized toroidal flux relation


    $$

    \rho_{\mathrm{tor,norm}}(r_{\mathrm{inv}})=\left[\frac{\Phi_{\mathrm{tor}}(r_{\mathrm{inv}})-\Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}}-\Phi_{\mathrm{tor,axis}}}\right]^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(r_{\mathrm{inv}})$ is the normalized toroidal
    flux coordinate at the inversion radius, $r_{\mathrm{inv}}$ is the sawtooth inversion
    radius, $\Phi_{\mathrm{tor}}(r_{\mathrm{inv}})$ is the toroidal magnetic flux
    enclosed by the magnetic surface at that radius, $\Phi_{\mathrm{tor,axis}}$ is
    the toroidal magnetic flux at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$
    is the toroidal magnetic flux at the equilibrium boundary.


    The quantity applies to the plasma magnetic surface at the sawtooth inversion
    radius and is a point evaluation of the parent [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    not a volume or surface average and not a population-weighted quantity. It is
    not the inversion radius itself, a cylindrical radial distance, or a local vector
    component.


    It is the parent normalized toroidal flux coordinate evaluated specifically at
    the inversion locus. It therefore differs from the corresponding value at the
    [sawtooth mixing radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius),
    which identifies the magnetic surface associated with sawtooth mixing rather than
    the surface where the electron-temperature perturbation changes sign.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: sawtooth_inversion_radius
    operator_kind: locus
  sources:
  - dd_path: sawteeth/diagnostics/rho_tor_norm_inversion
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/sawteeth.html#sawteeth-diagnostics-rho_tor_norm_inversion
    dd_documentation:
      leaf: Normalised toroidal flux coordinate at inversion radius
      parent_path: sawteeth/diagnostics
      parent: Detailed information about the sawtooth characteristics
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - sawteeth/time
    enhanced_context:
      description: "Normalized toroidal flux coordinate (\u03C1_tor_norm) at the sawtooth\
        \ inversion radius, the radial location where the electron temperature perturbation\
        \ changes sign during a sawtooth crash. Characterizes the spatial extent of\
        \ the sawtooth-affected region."
      kind: llm
  - dd_path: sawteeth/diagnostics/rho_tor_norm_q1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/sawteeth.html#sawteeth-diagnostics-rho_tor_norm_q1
    dd_documentation:
