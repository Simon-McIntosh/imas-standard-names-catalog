name: radial_component_of_center_of_mass_velocity
status: draft
description: Projection of the mass-weighted center-of-mass velocity of the plasma
  fluid onto the major-radius ($R$) direction.
documentation: "The center-of-mass velocity is defined as $\\mathbf{v}_{\\rm cm} =\
  \ \\sum_s n_s m_s \\mathbf{v}_s / \\sum_s n_s m_s$, where $n_s$, $m_s$, and $\\\
  mathbf{v}_s$ are the number density, particle mass, and fluid velocity of species\
  \ $s$, respectively. Its radial component $v_{\\rm cm,R} = \\mathbf{v}_{\\rm cm}\
  \ \\cdot \\hat{R}$ quantifies the net mass flow across flux surfaces along the major-radius\
  \ axis. In quiescent H-mode plasmas this quantity is small (order 1\u2013100 m/s)\
  \ because cross-field transport is predominantly diffusive; during disruptions or\
  \ ELMs it can spike to km/s levels. This quantity is evaluated on a GGD mesh and\
  \ enters the single-fluid momentum balance equation. It is dominated by the ion\
  \ contribution because $m_i \\gg m_e$."
