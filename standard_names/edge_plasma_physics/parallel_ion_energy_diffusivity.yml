name: parallel_ion_energy_diffusivity
status: draft
description: Effective diffusion coefficient for ion thermal energy transport along
  the magnetic field direction in edge plasma models.
documentation: "The parallel ion energy diffusivity $D_{\\parallel}^{E,i}$ (in $\\\
  mathrm{m^2\\,s^{-1}}$) governs the diffusive heat flux carried by ions along the\
  \ magnetic field: $q_{\\parallel}^{i} = -n_i D_{\\parallel}^{E,i} \\nabla_{\\parallel}\
  \ T_i$, where $n_i$ is the ion density, $T_i$ the ion temperature, and $\\nabla_{\\\
  parallel}$ denotes the gradient projected onto $\\mathbf{B}/B$. In classical Braginskii\
  \ transport theory, $D_{\\parallel}^{E,i} \\approx 3.9\\,v_{\\mathrm{th},i}^2 \\\
  tau_i$, with $v_{\\mathrm{th},i} = \\sqrt{2T_i/m_i}$ the ion thermal speed and $\\\
  tau_i$ the ion\u2013ion collision time, yielding values of order $10^3$\u2013$10^6\\\
  ;\\mathrm{m^2\\,s^{-1}}$ depending on local temperature and density. The extreme\
  \ anisotropy of magnetized plasma transport ($D_{\\parallel} \\gg D_{\\perp}$) demands\
  \ separate parallel and cross-field diffusivity channels in GGD-based edge transport\
  \ codes (SOLPS-ITER, SOLEDGE2D, UEDGE). In regimes where the ion mean free path\
  \ exceeds the parallel gradient scale length, the effective parallel heat flux must\
  \ be additionally limited by an energy flux limiter coefficient. See `ion_energy_radial_diffusivity_on_ggd`\
  \ for the cross-field counterpart and `parallel_ion_momentum_diffusivity` for the\
  \ parallel momentum channel."
