- name: vertical_curvature_of_bragg_crystal
  kind: scalar
  status: draft
  description: Radius of curvature of the Bragg crystal diffracting surface in the
    vertical, sagittal X2 direction of the local crystal-frame X1, X2, X3 basis. It
    is reported as a positive radius and characterizes the out-of-dispersion bending
    of doubly curved X-ray crystal optics.
  documentation: 'Vertical curvature of a Bragg crystal is the radius of curvature
    of the diffracting surface along the vertical, sagittal surface direction of the
    local crystal-frame $(X_1, X_2, X_3)$ basis, where $X_1$ lies along the spectral
    dispersion direction on the surface, $X_2$ lies along the vertical, out-of-dispersion
    direction on the surface, and $X_3$ is the outward surface normal. It is a geometric
    radius of the bent substrate and is reported as a positive (non-negative) magnitude,
    with smaller values denoting tighter bending; it carries no orientation sign because
    it describes the shape of the surface rather than a directed vector.


    Near a reference point on the diffracting surface, the displacement of the surface
    along the normal direction $X_3$ as a function of the vertical coordinate $X_2$
    defines the vertical radius of curvature through the paraxial sag relation:


    $$

    z(X_2) \simeq \frac{X_2^{\,2}}{2 R_v}

    $$


    where $z$ is the surface sag along $X_3$ in meters, $X_2$ is the vertical, out-of-dispersion
    coordinate on the surface in meters, and $R_v$ is the vertical radius of curvature
    in meters. Equivalently $R_v$ is the inverse of the local surface curvature in
    the $X_2$ direction. In doubly curved geometries this vertical radius works together
    with the meridional (dispersion-plane) radius to set the focusing of the diffracting
    element, controlling how rays that diverge above and below the dispersion plane
    are collected toward the detector.


    The value is fixed by the spectrometer optical design and is verified by mechanical
    or optical metrology of the crystal substrate or diffracting surface, for example
    surface profilometry, interferometry, or coordinate measurement, and may be cross-checked
    by ray-tracing against calibration spectra. It is a design and as-built geometric
    property of the optic, not a measured plasma quantity.


    Typical vertical radii in fusion X-ray crystal spectrometers span roughly 0.1-5
    m, with compact, strongly focusing instruments tending toward the lower end and
    weakly focusing or nearly flat sagittal profiles toward several meters. Very large
    values correspond to a nearly flat surface in the vertical direction and weak
    out-of-dispersion focusing.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/crystal/x2_curvature
    dd_path: spectrometer_x_ray_crystal/channel/crystal/x2_curvature
    status: composed
- name: vertical_front_surface_curvature_of_optical_element
  kind: scalar
  status: draft
  description: Signed vertical principal radius of curvature of an optical element
    front surface in the local aperture frame (X1, X2, z), where X2 is the vertical
    aperture coordinate and z is the surface-normal or optical-axis coordinate. Although
    the name says curvature, the meter unit denotes a radius of curvature.
  documentation: 'The vertical front surface curvature is the signed principal radius
    of curvature of the front, beam-entry surface of an optical element in the vertical
    aperture direction. It describes how the surface bends in the $X_2$ direction
    of the local aperture frame $(X_1, X_2, z)$, where $X_1$ and $X_2$ span the aperture
    plane and $z$ is the surface-normal or optical-axis coordinate.


    Near the surface vertex, the vertical section of the front-surface sag is represented
    to lowest order by:


    $$

    z_s(0, X_2) \simeq \frac{X_2^2}{2 R_2}, \qquad \kappa_2 = \frac{1}{R_2}

    $$


    where $z_s$ is the surface sag, $R_2$ is this signed radius of curvature, and
    $\kappa_2$ is the reciprocal curvature with units m^-1.


    This quantity is meaningful for front-surface prescriptions that resolve curvature
    by aperture direction, including spherical, cylindrical, toroidal, and separably
    curved surfaces. For a spherical surface, the vertical radius equals the orthogonal
    front-surface radius; for a cylindrical surface one principal direction may be
    effectively flat; for toroidal or separably curved surfaces the $X_1$ and $X_2$
    radii may differ. The related [vertical front surface radius](name:vertical_front_surface_radius_of_optical_element)
    denotes the same radius interpretation, while [x front surface curvature] gives
    the corresponding orthogonal aperture-direction quantity.


    The value is normally obtained from the optical prescription or from surface metrology
    by fitting the measured front-surface sag to the chosen surface model. Representative
    absolute radii can span about 0.01-100 m in diagnostic optical systems, with very
    weakly curved or flat directions represented by much larger or effectively infinite
    radii.


    Sign convention: Positive when the center of curvature of the vertical front-surface
    section lies in the $+z$ direction from the surface vertex in the local aperture
    frame $(X_1, X_2, z)$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_front_surface_radius_of_optical_element
  sources:
  - id: dd:camera_visible/channel/optical_element/front_surface/x2_curvature
    dd_path: camera_visible/channel/optical_element/front_surface/x2_curvature
    status: composed
  - id: dd:spectrometer_visible/channel/optical_element/front_surface/x2_curvature
    dd_path: spectrometer_visible/channel/optical_element/front_surface/x2_curvature
    status: attached
- name: vertical_front_surface_radius_of_optical_element
  kind: scalar
  status: draft
  description: Signed radius of curvature of an optical element's front surface along
    the local X2 vertical direction of the aperture frame (X1, X2, z), where z is
    the local surface-normal or optical-axis coordinate. It applies to spherical,
    cylindrical, toroidal, and separably curved front surfaces whose vertical radius
    is specified independently.
  documentation: 'The vertical front-surface radius of an optical element is the signed
    radius of curvature of the element''s entrance or reflecting surface in the $X_2$
    principal section of the local aperture frame $(X_1, X_2, z)$. Here $X_1$ and
    $X_2$ span the local aperture or tangent plane, $X_2$ is the vertical transverse
    direction, and $z$ is the local surface-normal or optical-axis coordinate. This
    is a radius in meters, not the reciprocal curvature in m$^{-1}$.


    Near the local vertex, after subtracting any planar tilt, the small-sag form of
    the front surface in the $X_2$ direction is


    $$

    z(x_2) - z(0) \simeq \frac{x_2^2}{2 R_2}

    $$


    where $x_2$ is displacement along $X_2$ in meters, $z$ is surface sag along the
    local $z$ coordinate in meters, and $R_2$ is this signed vertical front-surface
    radius in meters. The approximation assumes $|x_2| \ll |R_2|$ and a local tangent
    frame; an exactly circular principal section has this expression as its second-order
    expansion.


    The value is usually obtained from optical design specifications, crystal-bending
    geometry, or surface metrology such as profilometry or interferometry. It determines
    vertical focusing in ray tracing and wave-optics calculations. For a spherical
    surface the $X_1$ and $X_2$ radii are equal; for cylindrical, toroidal, or separably
    curved surfaces the two transverse radii may differ and must be specified independently.
    The closely related [vertical_front_surface_curvature_of_optical_element](name:vertical_front_surface_curvature_of_optical_element)
    uses the same vertical front-surface radius convention, while x_front_surface_curvature_of_optical_element
    refers to the orthogonal $X_1$ direction and [vertical_back_surface_curvature_of_optical_element](name:vertical_back_surface_curvature_of_optical_element)
    to the rear surface.


    Typical absolute values range from about 0.1-10 m for tightly bent X-ray crystal
    reflectors to 1-100 m for weakly focusing mirrors or grazing-incidence optics.
    A nearly flat surface is represented by a radius whose magnitude is much larger
    than the aperture size.


    Sign convention: Positive when the center of curvature of the front surface in
    the $X_2$ principal section lies on the $+z$ side of the local tangent plane.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_front_surface_curvature_of_optical_element
  - name:vertical_back_surface_curvature_of_optical_element
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/x2_curvature
    dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_curvature
    status: composed
- name: voltage_of_spectrometer
  kind: scalar
  status: draft
  description: Uncalibrated detector-channel voltage from a visible-light filter spectrometer
    before dark/offset subtraction and radiometric calibration. It represents the
    readout potential difference produced by detector response and electronics, not
    an absolute photon flux or radiance.
  documentation: 'Voltage of a spectrometer is the raw electrical potential difference
    delivered by a visible-light filter spectrometer detector readout for a selected
    spectral passband. It includes detector gain, bias, dark signal, and electronic
    offset, and is not yet converted to detector photon rate, spectral radiance, or
    line-integrated flux.


    The detector response can be modeled as an additive offset plus a wavelength-weighted
    response to photons arriving at the detector:


    $$

    V(t) = V_\mathrm{off}(t) + \int_{\lambda_1}^{\lambda_2} R_V(\lambda,t)\,\dot{N}_{\lambda,\mathrm{det}}(\lambda,t)\,d\lambda

    $$


    where $V$ and $V_\mathrm{off}$ are voltages in V, $\lambda$ is wavelength in m,
    $\lambda_1$ and $\lambda_2$ bound the filter passband, $\dot{N}_{\lambda,\mathrm{det}}$
    is the photon arrival-rate spectral density at the detector in photons s^-1 m^-1,
    and $R_V$ is the effective detector-and-electronics voltage responsivity in V
    s photon^-1. The offset term is retained in the raw voltage and must be estimated
    separately, for example from dark or blocked-light measurements.


    In practice this signal is read from a photodiode, avalanche photodiode, photomultiplier,
    or similar detector chain. Subtracting $V_\mathrm{off}$ and applying detector
    responsivity calibration can infer a detector photon rate, while conversion to
    spectral radiance also requires optical etendue, transmission, filter-shape, window-loss,
    and collection-geometry calibration. The related [flux_at_spectral_line](name:spectral_flux_of_spectrometer_channel)
    is an uncalibrated photon flux integrated over a spectral line and should not
    be interpreted as an absolutely calibrated radiance or photon rate unless those
    calibrations have been applied.


    Typical raw signals at the digitizer input range from 0.0001-10 V, with dark or
    bias offsets commonly 0.0001-0.1 V. Saturation is often set by detector electronics
    or digitizer limits, commonly near 1-10 V or by bipolar input ranges such as -10-10
    V.


    Sign convention: Positive when the spectrometer signal output terminal is at a
    higher electric potential than its reference terminal.'
  unit: V
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_flux_of_spectrometer_channel
- name: requested_voltage_of_spectrometer
  kind: scalar
  status: draft
  description: Commanded setpoint voltage for a spectrometer high-voltage supply,
    giving the intended detector or electrode bias relative to the supply return/reference
    terminal rather than a measured signal output.
  documentation: 'The requested voltage of a spectrometer is the commanded electrical
    potential difference for a spectrometer high-voltage supply. It represents the
    intended bias applied to a detector, multiplier, photocathode, anode, or other
    controlled electrode relative to the designated return/reference terminal.


    When interpreted as an ideal voltage setpoint, the quantity is defined by the
    commanded potential difference:


    $$

    V_\mathrm{req} = \Phi_\mathrm{out,set} - \Phi_\mathrm{ref}

    $$


    where $\Phi_\mathrm{out,set}$ is the commanded electric potential of the controlled
    high-voltage output terminal or biased electrode, and $\Phi_\mathrm{ref}$ is the
    electric potential of the supply return/reference terminal.


    The value is usually generated from an operator setting, diagnostic configuration,
    or automated scan used to control detector gain, charge collection, or particle/electron
    multiplication. It should be distinguished from a measured high-voltage supply
    readback, if one is available, and from voltage_of_spectrometer_channel, which
    denotes an uncalibrated electrical output signal from a spectrometer channel rather
    than the high-voltage supply setpoint.


    Typical requested values range from 0-5000 V in magnitude, depending on detector
    technology and operating mode. Photomultiplier, microchannel-plate, and electron-multiplier
    systems commonly use 500-3000 V in magnitude; low-voltage bias or gating electrodes
    may use 10-200 V.


    Sign convention: Positive when the commanded high-voltage output terminal or biased
    electrode is at a higher electric potential than its designated return/reference
    terminal.'
  unit: V
  physics_domain: radiation_measurement_diagnostics
  links: []
  arguments:
  - name: voltage_of_spectrometer
    operator: requested
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_uv/channel/supply_high_voltage/voltage_set
    dd_path: spectrometer_uv/channel/supply_high_voltage/voltage_set
    status: composed
- name: voltage_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Raw electrical output voltage from one spectrometer detector channel,
    measured relative to its electronics reference or baseline before radiometric
    calibration. It represents detector and front-end response in that spectral channel
    rather than a calibrated radiance, irradiance, photon flux, or optical power.
  documentation: 'Voltage of a spectrometer channel is the electrical potential difference
    produced by one detector channel and its readout electronics for a selected spectral
    channel or wavelength band. It is an uncalibrated detector signal and may include
    effects of detector responsivity, electronic gain, dark current, offsets, integration
    time, and bandwidth.


    The channel voltage is defined relative to the applicable electronics reference
    or baseline:


    $$

    V_\mathrm{ch} = V_\mathrm{out,ch} - V_\mathrm{ref,ch}

    $$


    where $V_\mathrm{out,ch}$ is the detector-channel output potential and $V_\mathrm{ref,ch}$
    is the channel reference potential, zero-light baseline, dark baseline, or digitizer
    reference used for that measurement.


    In practice this voltage is measured by the detector front end, such as a photodiode,
    photomultiplier, avalanche photodiode, or camera readout channel followed by amplification
    and digitization. Conversion to radiometric quantities requires separate calibration
    for spectral response, optical throughput, detector gain, integration time, and
    any dark or background correction.


    Typical unsaturated analog channel voltages range from 0.001-10 V, depending on
    detector type, amplifier gain, light level, and digitizer range. Baseline offsets
    are often 0.0001-0.1 V, while values near the acquisition limits, commonly 1-10
    V, may indicate saturation or clipping rather than increased optical signal.


    Sign convention: Positive when the channel output potential is higher than its
    electronics reference or baseline.'
  unit: V
  physics_domain: radiation_measurement_diagnostics
