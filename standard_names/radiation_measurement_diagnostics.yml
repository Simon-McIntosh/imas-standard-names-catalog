- name: radius_of_filter
  kind: scalar
  status: draft
  description: Radius of a circular diagnostic filter-window aperture, defined as
    the distance from the aperture center to its circular edge.
  documentation: 'Radius of a circular filter-window aperture is the distance from
    the center of the clear opening to its circular edge. It is a purely geometric
    parameter that sets the size of the window through which photons pass in X-ray
    diagnostic channels, and applies only when the filter-window geometry is circular.
    It is distinct from the filter thickness, which governs energy-dependent attenuation,
    and from any radius of curvature of the filter surface.


    The clear circular aperture area $A$ used in solid-angle and geometric throughput
    (etendue) calculations follows directly from the radius $r$:


    $$

    A = \pi r^2

    $$


    where $r$ is the aperture radius in meters and $A$ is the resulting clear aperture
    area in square meters.


    The radius is typically taken from the mechanical design of the filter holder
    or determined by dimensional metrology, optical microscopy, or imaging of the
    aperture edge. When the filter window is itself the limiting circular aperture
    of a channel, this radius coincides with the radius of the diagnostic aperture.


    Typical values range from about $1\times10^{-4}$ m to $5\times10^{-2}$ m, with
    sub-millimeter openings used for tightly collimated channels and millimeter-to-centimeter
    openings used for cameras or spectrometers with larger acceptance.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
