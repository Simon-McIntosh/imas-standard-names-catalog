    status: composed
- name: fast_electron_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the fast (suprathermal) electron population
    from a coherent wave, globally integrated over the plasma volume.
  documentation: "Fast electron power is the volume integral of the local wave energy\
    \ absorption rate by the non-thermal (suprathermal) electron population, representing\
    \ the globally integrated fraction of coherent wave energy transferred to electrons\
    \ whose velocities substantially exceed the bulk thermal velocity.\n\nThe defining\
    \ relation is:\n\n$$\nP_\\mathrm{fast,e} = \\int_V p_\\mathrm{fast,e}(\\mathbf{r})\\\
    , dV\n$$\n\nwhere $p_\\mathrm{fast,e}$ is the [fast electron power density](name:fast_electron_power_density)\
    \ \u2014 the local volumetric wave-energy absorption rate on the suprathermal\
    \ electron population and $V$ is the total plasma volume.\n\nThis quantity is\
    \ computed from wave-kinetic or quasilinear solvers that partition the electron\
    \ velocity distribution into thermal and suprathermal components; in electron\
    \ cyclotron resonance heating scenarios, the fast electron channel captures absorption\
    \ at harmonic resonances and energy transfer during suprathermal tail formation.\
    \ The thermally absorbed complement is [thermal_electron_power](name:thermal_electron_power);\
    \ comparing the two characterizes the non-thermal efficiency of a given wave-heating\
    \ scheme.\n\nTogether with [thermal_electron_power](name:thermal_electron_power)\
    \ and [fast_ion_power](name:fast_ion_power), this quantity contributes to [absorbed_power](name:absorbed_power)\
    \ \u2014 the total wave energy transferred to the plasma per unit time. It enters\
    \ the electron energy balance as a suprathermal source term within [electron_power](name:electron_power),\
    \ the all-channel electron energy-balance quantity."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_density
  - name:thermal_electron_power
  - name:fast_ion_power
  - name:absorbed_power
  - name:electron_power
  sources:
  - id: dd:waves/coherent_wave/global_quantities/electrons/power_fast
    dd_path: waves/coherent_wave/global_quantities/electrons/power_fast
    status: composed
- name: per_toroidal_mode_fast_electron_power
  kind: scalar
  status: draft
  description: Wave power absorbed by the fast (non-thermal) electron population from
    a coherent wave, attributed to a single toroidal Fourier harmonic identified by
    mode number $n_\phi$.
  documentation: "This quantity gives the contribution to the total absorbed fast-electron\
    \ wave power from a single toroidal Fourier harmonic of a coherent wave, identified\
    \ by toroidal mode number $n_\\phi$. It decomposes [fast_electron_power](name:fast_electron_power)\
    \ \u2014 the volume-integrated power absorbed by the non-thermal electron population\
    \ \u2014 into individual harmonic contributions.\n\nThe summation closure relation\
    \ is:\n\n$$\nP_{\\rm fast,e} = \\sum_{n_\\phi} P_{\\rm fast,e}(n_\\phi)\n$$\n\n\
    where $P_{\\rm fast,e}(n_\\phi)$ is the power absorbed by fast electrons from\
    \ the harmonic with toroidal mode number $n_\\phi$.\n\nIn wave-modeling calculations,\
    \ the electromagnetic fields of a coherent wave are expanded as a Fourier series\
    \ in the toroidal angle $\\phi$, and the contribution from each harmonic to the\
    \ fast-electron power balance is evaluated separately using quasilinear diffusion\
    \ theory applied to the non-thermal electron distribution. Resonant absorption\
    \ mechanisms \u2014 such as electron cyclotron or lower-hybrid resonances \u2014\
    \ accelerate electrons to suprathermal energies, and the harmonic decomposition\
    \ reveals which modes dominate this energy transfer. The radially cumulative (inside-flux-surface)\
    \ variant is [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface),\
    \ while the local power-density analog per mode is [per_toroidal_mode_fast_electron_power_density](name:per_toroidal_mode_fast_electron_power_density).\
    \ The equivalent decomposition for the thermal electron population is [per_toroidal_mode_thermal_electron_power](name:per_toroidal_mode_thermal_electron_power),\
    \ and the fast-ion counterpart is [per_toroidal_mode_fast_ion_power](name:per_toroidal_mode_fast_ion_power)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power
  - name:fast_electron_power_at_inside_flux_surface
  - name:per_toroidal_mode_fast_electron_power_density
  - name:per_toroidal_mode_thermal_electron_power
  - name:per_toroidal_mode_fast_ion_power
