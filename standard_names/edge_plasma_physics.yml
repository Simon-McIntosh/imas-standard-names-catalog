- name: flux_surface_averaged_deuterium_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged deuterium ion number density at the plasma boundary
    is the boundary flux-surface average of local deuterium ion density, summed over
    all ionic charge states and excluding neutral deuterium atoms and molecules.
  documentation: 'Flux-surface-averaged deuterium ion number density at the plasma
    boundary is the scalar flux-surface average of local deuterium ion number density
    on the separatrix, the last closed magnetic flux surface separating closed confined
    field lines from open scrape-off-layer field lines. At species level, the deuterium
    ion population is summed over all ionic charge states and excludes neutral deuterium
    atoms and molecules.


    The boundary flux-surface average is defined in flux coordinates $(\rho, \theta,
    \phi)$, where $\rho$ labels nested flux surfaces and $\rho_b$ labels the plasma
    boundary:


    $$

    \langle n_D \rangle_{\rho_b} = \frac{\int_0^{2\pi}\!\int_0^{2\pi} n_D(\rho_b,\theta,\phi)\,J(\rho_b,\theta,\phi)\,d\theta\,d\phi}{\int_0^{2\pi}\!\int_0^{2\pi}
    J(\rho_b,\theta,\phi)\,d\theta\,d\phi}

    $$


    where $n_D$ is the local charge-state-summed deuterium ion number density, $J$
    is the flux-coordinate Jacobian, $\theta$ is a poloidal angle, and $\phi$ is the
    toroidal angle of the right-handed cylindrical $(R, \phi, Z)$ frame with $R$ major
    radius and $Z$ vertical height.


    This is a flux-surface average over the boundary surface, not a local point value
    such as [deuterium ion number density at the plasma boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary).
    It is the deuterium species contribution distinct from the species-summed [flux-surface-averaged
    ion density at the plasma boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary)
    and is directly analogous to [flux-surface-averaged hydrogen density at the plasma
    boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary) and
    [flux-surface-averaged tritium density at the plasma boundary](name:flux_surface_averaged_tritium_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_ion_density_at_plasma_boundary
  - name:flux_surface_averaged_hydrogen_density_at_plasma_boundary
  - name:flux_surface_averaged_tritium_density_at_plasma_boundary
  sources:
  - dd_path: summary/local/separatrix_average/n_i/deuterium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix_average-n_i-deuterium-value
    dd_documentation:
