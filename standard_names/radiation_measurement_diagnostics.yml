- name: x2_coordinate_of_bragg_crystal
  kind: scalar
  status: draft
  description: Signed coordinate along the X2 axis of a Bragg-crystal outline vertex
    in the crystal-local Cartesian (X1, X2) frame, parameterizing the cross-sectional
    boundary of the crystal element in an X-ray crystal spectrometer.
  documentation: 'The X2 coordinate labels each vertex of the Bragg crystal''s cross-sectional
    outline in the crystal-local Cartesian (X1, X2) plane, where X1 and X2 span the
    nominal crystal aperture surface and the X2 axis is the second transverse direction.
    A sequence of such vertices, paired with the corresponding [x1_coordinate_of_bragg_crystal](name:x1_coordinate_of_bragg_crystal)
    values, fully parameterizes the closed irregular boundary of the crystal element
    used for Bragg diffraction in an X-ray crystal spectrometer channel.


    The outline geometry defines the active diffracting area and enters into calculations
    of the solid angle subtended by the crystal from the X-ray source, directly influencing
    photon collection efficiency. For rectangular crystals, the full width along the
    X1 axis is also captured by [bragg_crystal_width](name:bragg_crystal_width), while
    the angular acceptance from the source is characterized by [angular_width_of_bragg_crystal](name:angular_width_of_bragg_crystal).


    Crystal outline coordinates are specified from engineering drawings or coordinate
    metrology of the spectrometer assembly and represent fixed hardware geometry.
    The same (X1, X2) local-frame convention is applied consistently across spectrometer
    components, as in [x2_coordinate_of_diagnostic_aperture](name:x2_coordinate_of_diagnostic_aperture)
    and [x2_coordinate_of_hard_xray_detector](name:x2_coordinate_of_hard_xray_detector).


    Sign convention: Positive when the vertex lies in the positive X2 direction of
    the crystal-local Cartesian (X1, X2) frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
