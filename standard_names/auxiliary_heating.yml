- name: radial_wave_electric_field
  kind: scalar
  status: active
  description: Complex phasor of the wave electric field projected onto a magnetic
    flux-surface normal directed toward increasing flux label, preserving local amplitude,
    phase, and normal polarization.
  documentation: 'The flux-surface-normal wave electric field is the complex phasor
    obtained by projecting the electromagnetic-wave electric-field phasor onto the
    unit normal of a local magnetic flux surface. It preserves the local amplitude,
    phase, and polarization associated with that normal direction.


    The defining projection is


    $$

    \tilde E_{\psi}(\mathbf r)=\tilde{\mathbf E}(\mathbf r)\cdot\hat{\mathbf n}_{\psi}(\mathbf
    r),\qquad \hat{\mathbf n}_{\psi}(\mathbf r)=\frac{\nabla\psi(\mathbf r)}{|\nabla\psi(\mathbf
    r)|}

    $$


    where $\tilde E_{\psi}$ and $\tilde{\mathbf E}$ are electric-field phasors in
    V m$^{-1}$, $\mathbf r$ is position in m, $\psi$ is a scalar magnetic flux-surface
    label, and $\hat{\mathbf n}_{\psi}$ is a dimensionless unit normal.


    This projection is geometric and is not the major-radius component in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is a component of the [wave electric field](name:wave_electric_field)
    and differs from the field-aligned [parallel wave electric field](name:parallel_wave_electric_field).


    Sign convention: Positive when the projection is along $\hat{\mathbf n}_{\psi}$,
    directed toward increasing flux label.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:wave_electric_field
  - name:parallel_wave_electric_field
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
