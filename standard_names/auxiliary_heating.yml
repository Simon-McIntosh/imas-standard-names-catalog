- name: root_mean_square_of_wave_current_of_antenna_strap
  kind: scalar
  status: active
  description: The root-mean-square wave current of an antenna strap is the non-negative
    effective value of the radio-frequency current flowing through an ion-cyclotron-heating
    antenna strap during wave excitation.
  documentation: 'The root-mean-square wave current of an antenna strap is the effective
    value of the time-varying radio-frequency current flowing through an antenna strap
    conductor during wave excitation. It represents the current magnitude associated
    with RF wave launching and excludes static bias current and non-RF current components.


    It is defined over an averaging interval $\tau$ as the square root of the time
    average of the squared instantaneous RF current:


    $$

    I_\mathrm{rms} = \left(\frac{1}{\tau}\int_{t_0}^{t_0+\tau} i_\mathrm{RF}^2(t)\,dt\right)^{1/2}

    $$


    where $i_\mathrm{RF}(t)$ is the instantaneous RF current in amperes, $t$ and $t_0$
    are times in seconds, and $\tau$ is the averaging interval in seconds; for a periodic
    waveform, $\tau$ is an integer number of RF periods, and for a sinusoid with peak
    current $I_0$, $I_\mathrm{rms}=I_0/\sqrt{2}$.


    Because the instantaneous current is squared before averaging, $I_\mathrm{rms}$
    is non-negative and contains no phase information. The companion [strap RF phase](name:wave_phase_of_antenna_strap)
    is required with this RMS current to specify the complex strap-current excitation.


    When the [antenna loading resistance](name:resistance_of_ion_cyclotron_heating_antenna)
    $R_\mathrm{load}$ is the resistive part of the driving-point load associated with
    the strap current, the accepted RF power at that reference plane satisfies $P_\mathrm{acc}=I_\mathrm{rms}^2
    R_\mathrm{load}$; equivalently, it is the [forward RF power](name:forward_power_of_ion_cyclotron_heating_antenna)
    less the [reflected RF power](name:reflected_power_of_ion_cyclotron_heating_antenna)
    at the same reference plane.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:voltage_amplitude
  - name:resistance_of_ion_cyclotron_heating_antenna
  - name:power_of_ion_cyclotron_heating_antenna
  sources:
  - dd_path: ic_antennas/antenna/module/strap/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-current
    dd_documentation:
