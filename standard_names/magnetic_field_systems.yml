- name: normal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate along the normal direction of the local Frenet frame for
    a toroidal field coil conductor cross-section outline.
  documentation: "The normal coordinate of a toroidal field coil conductor cross-section\
    \ specifies the position of the outline vertices along the normal axis of the\
    \ local Frenet frame $(\\hat{n}, \\hat{b}, \\hat{t})$, where $\\hat{n}$ is the\
    \ principal normal pointing toward the center of curvature of the conductor contour.\
    \ Together with the binormal coordinate $[\\text{binormal coordinate of toroidal\
    \ field coil}](name:binormal_coordinate_of_toroidal_field_coil)$, it defines the\
    \ conductor cross-section shape in the plane perpendicular to the coil current\
    \ path. The cross-section area $A = \\int \\mathrm{d}n \\, \\mathrm{d}b$ is obtained\
    \ from these coordinates and determines the coil's current-carrying capacity via\
    \ $J = I / A$, where $I$ is the coil current. Typical toroidal field coils have\
    \ rectangular or trapezoidal cross-sections with normal half-widths of 0.2\u2013\
    1.0 m and binormal half-widths of 0.4\u20133.0 m.\n\nSign convention: Positive\
    \ when the outline point lies in the $+\\hat{n}$ direction (toward the center\
    \ of curvature of the conductor contour)."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/normal
    dd_path: tf/coil/conductor/cross_section/outline/normal
    status: composed
- name: outer_radius_of_passive_loop
  kind: scalar
  status: draft
  description: The outer radius of the annular cross-section of a passive conducting
    loop element, measured from the conductor centerline to the outer edge of the
    cross-section.
  documentation: 'The outer radius $r_{\text{out}}$ of a passive loop defines the
    outermost radial extent of the conductor''s annular cross-section, measured from
    the centroid of the cross-section to its outer boundary. Together with the inner
    radius $r_{\text{in}}$ (see [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)),
    it determines the loop''s cross-sectional area for toroidal or poloidal currents.
    The difference $r_{\text{out}} - r_{\text{in}}$ sets the conductor radial thickness
    and, combined with the resistivity (see [resistivity_of_passive_loop](name:resistivity_of_passive_loop)),
    governs the wall-time constant for eddy-current decay. Typical passive loop outer
    radii range from 0.5 to 6.0 m in medium-size tokamaks, depending on the vessel
    location and the mechanical clearance requirements.


    Sign convention: Positive when the outer surface of the conductor lies at a larger
    major radius $R$ than the centroid of the cross-section.


    Further geometry parameters, such as the cross-sectional area $A_{\text{loop}}$
    (see [area_of_passive_loop](name:area_of_passive_loop)) and the vertical height
    $h_{\text{loop}}$ (see [height_of_passive_loop](name:height_of_passive_loop)),
    complement this radial dimension for full electromagnetic modeling of passive
    structure currents.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:resistivity_of_passive_loop
  - name:area_of_passive_loop
  - name:height_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/annulus/radius_outer
    dd_path: pf_passive/loop/element/geometry/annulus/radius_outer
    status: composed
- name: outer_radius_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Outermost radial extent of an annular poloidal field coil cross-section,
    defining the conductor's outer boundary for electromagnetic and structural analysis.
  documentation: 'The outer radius $r_{\text{out}}$ of the annular cross-section of
    a poloidal field (PF) coil element specifies the radial distance from the coil
    axis to the outermost conducting surface. Together with the `[inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil)$,
    it defines the annulus geometry from which the conductive area $A = \pi (r_{\text{out}}^2
    - r_{\text{in}}^2)$ is computed. This parameter is essential for calculating the
    coil''s self-inductance, magnetic flux linkage, and mechanical stresses under
    electromagnetic loads. In tokamak designs, PF coil outer radii typically range
    from 0.5 m to 3 m depending on the machine size and coil position relative to
    the plasma. The outer radius is a fixed design parameter for each coil element
    and does not vary during plasma operation.


    Sign convention: Positive when the radial coordinate increases outward from the
    coil axis.


    See also `[area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)` for
    the derived cross-sectional area.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/annulus/radius_outer
    dd_path: pf_active/coil/element/geometry/annulus/radius_outer
    status: composed
- name: radial_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: The radial component of the net electromagnetic force on a poloidal
    field coil, representing a structural engineering limit for the coil support system.
    This quantity defines the maximum allowable radial load on the coil.
  documentation: 'The radial force on a poloidal field coil is the Lorentz force resulting
    from the interaction of the coil current with the vertical component of the magnetic
    field at the coil location. For an axisymmetric toroidal current loop representing
    a poloidal field coil, the net radial force magnitude is given by $F_R = 2 \pi
    R_{\text{coil}} I_{\text{coil}} B_Z$, where $R_{\text{coil}}$ is the major radius
    at the coil centroid (in meters), $I_{\text{coil}}$ is the coil current (in amperes),
    and $B_Z$ is the vertical magnetic field component (in tesla) at the coil. This
    force acts radially outward or inward depending on the directions of the coil
    current and the local magnetic field. The radial force limit is a structural engineering
    constraint used in the design of the coil support system; typical values for large
    tokamaks can range from a few hundred kilonewtons to tens of meganewtons. The
    companion identifiers `vertical_force_of_poloidal_field_coil` and `force_of_poloidal_field_coil`
    describe the other components and total force.


    Sign convention: Positive when the radial force acts in the direction of increasing
    major radius $R$ (outward from the machine symmetry axis).'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_force_of_poloidal_field_coil
  - name:force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/radial_force/limit_max
    dd_path: pf_active/radial_force/limit_max
    status: composed
  - id: dd:pf_active/radial_force/limit_min
    dd_path: pf_active/radial_force/limit_min
    status: composed
- name: radial_magnetic_field_of_ferritic_element
  kind: scalar
  status: draft
  description: Radial component of the magnetic field at the centroid of each ferritic
    element, arising from the magnetization of the ferritic insert.
  documentation: 'The radial magnetic field of a ferritic element is the component
    of the magnetic field vector along the $R$ direction in the IMAS cylindrical $(R,
    \phi, Z)$ frame, evaluated at the centroid of the element. This field is generated
    by the magnetization of the ferritic material itself, typically a steel insert
    used for magnetic error field correction or plasma-facing component shaping. Typical
    magnitudes range from a few millitesla (mT) to tens of mT, depending on the element''s
    material properties, geometry, and proximity to the plasma. Measurement or calculation
    methods include pickup coils, Hall probes, or finite-element magnetics simulations;
    values are often inferred from magnetostatic models calibrated against integrated
    flux measurements. For the complete vector definition, see the sibling name `magnetic_field`.


    Sign convention: Positive when the field points in the direction of increasing
    major radius $R$ (i.e., radially outward from the machine symmetry axis).'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_magnetic_field_of_ferritic_element
  - name:toroidal_magnetic_field_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_r
    dd_path: ferritic/object/time_slice/b_field_r
    status: composed
- name: resistance_of_passive_loop
  kind: scalar
  status: draft
  description: Ohmic resistance of a passive axisymmetric conducting loop element
    used for electromagnetic modeling of induced eddy and halo currents.
  documentation: The resistance $R$ of a passive loop quantifies the conductor's opposition
    to the flow of induced toroidal current, given by $R = \rho L / A$, where $\rho$
    is the material resistivity, $L$ is the total toroidal length of the loop, and
    $A$ is its cross-sectional conductor area (see [area_of_passive_loop](name:area_of_passive_loop)).
    This parameter is essential for computing the decay time of eddy currents in conducting
    structures such as the vacuum vessel and stabilizing shells, which in turn affects
    vertical stability and plasma disruption evolution. Typical resistance values
    for passive loops in tokamaks range from tens of micro-ohms to a few milliohms,
    depending on conductor material and geometry. The resistance is used together
    with [resistivity_of_passive_loop](name:resistivity_of_passive_loop) to model
    the electromagnetic response of the structure to time-varying plasma currents.
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_passive_loop
  - name:resistivity_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/resistance
    dd_path: pf_passive/loop/resistance
    status: composed
- name: resistance_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a toroidal field coil conductor, determining
    the voltage drop and power dissipation for a given coil current.
  documentation: The ohmic resistance $R_{\mathrm{TF}}$ of a toroidal field coil conductor
    governs the resistive voltage drop $V = I R_{\mathrm{TF}}$ and the ohmic power
    dissipation $P = I^2 R_{\mathrm{TF}}$ when the coil carries current $I$. For superconducting
    TF coils, the resistance represents the combined resistance of the copper stabilizer
    and any normal-conducting joints or leads; for conventional copper coils it is
    the full conductor resistance. The value depends on the conductor material, cross-sectional
    area, temperature, and total conductor length. The resistance is used together
    with [area_of_toroidal_field_coil](name:area_of_toroidal_field_coil) to compute
    the average current density $J = I / A$, and is related to conductor resistivity
    via $R = \rho L / A$, where $\rho$ is the resistivity, $L$ the conductor length,
    and $A$ the cross-sectional area. Typical TF coil resistances range from micro-ohms
    (superconducting, at cryogenic temperatures) to milliohms (conventional copper
    coils). The quantity is sign-invariant (always positive for passive conductors).
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/resistance
    dd_path: coils_non_axisymmetric/coil/conductor/resistance
    status: attached
  - id: dd:coils_non_axisymmetric/coil/resistance
    dd_path: coils_non_axisymmetric/coil/resistance
    status: attached
  - id: dd:pf_active/coil/resistance
    dd_path: pf_active/coil/resistance
    status: attached
  - id: dd:tf/coil/conductor/resistance
    dd_path: tf/coil/conductor/resistance
    status: attached
  - id: dd:tf/coil/resistance
    dd_path: tf/coil/resistance
    status: attached
- name: resistivity_of_passive_loop
  kind: scalar
  status: draft
  description: Electrical resistivity of a passive loop conductor, characterizing
    its opposition to induced current flow.
  documentation: The resistivity $\eta$ of a passive axisymmetric conducting loop
    determines the magnitude of eddy currents induced during transient electromagnetic
    events, such as plasma disruptions or fast coil current changes. For a loop of
    length $L$ and cross-sectional area $A$, the resistance is given by $R = \eta
    L / A$, where $R$ is the resistance. The resistivity is a material property that
    may be temperature-dependent, influencing passive loop stabilization and eddy
    current decay times. Typical values range from $10^{-8}$ to $10^{-6}$ $\Omega
    \cdot \text{m}$, spanning conductors like copper and stainless steel. This quantity
    is used together with [inner\_radius\_of\_passive\_loop](name:inner_radius_of_passive_loop)
    and [area\_of\_passive\_loop](name:area_of_passive_loop) to model the electromagnetic
    response of passive structures. See also [resistance\_of\_toroidal\_field\_coil](name:resistance_of_toroidal_field_coil)
    for a related quantity on active coils.
  unit: m.ohm
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_passive_loop
  - name:area_of_passive_loop
  - name:resistance_of_toroidal_field_coil
  sources:
  - id: dd:pf_passive/loop/resistivity
    dd_path: pf_passive/loop/resistivity
    status: attached
- name: temperature_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Conductor temperature of a poloidal field coil element, used to evaluate
    current-carrying capacity and resistive losses.
  documentation: "The conductor temperature of a poloidal field (PF) coil sets the\
    \ material resistivity and constrains the maximum allowable current through the\
    \ $I^2R$ heating and thermal stability limits. In superconducting PF coils, the\
    \ temperature margin relative to the current-sharing temperature $T_{cs}$ determines\
    \ the quench protection threshold; for normal-conducting coils, the temperature\
    \ directly drives the ohmic power dissipation $P = I^2 R(T)$. Typical operating\
    \ temperatures range from 4.5 K for NbTi superconducting coils up to 300\u2013\
    350 K for water-cooled copper coils during long-pulse operation. The temperature\
    \ is used alongside the conductor [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)\
    \ to compute current density and is referenced by the coil protection system to\
    \ enforce operational limits. When combined with [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil)\
    \ and other mechanical loads, the thermal expansion from temperature changes contributes\
    \ to structural stress analysis of the coil support system."
  unit: K
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_poloidal_field_coil
  - name:radial_force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/temperature
    dd_path: pf_active/coil/temperature
    status: composed
- name: toroidal_angle_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Toroidal angle of the toroidal field coil conductor cross-section contour
    points relative to a reference point.
  documentation: 'This standard name defines the toroidal angular positions $\Delta
    \phi$ of the contour points describing the conductor cross-section of a toroidal
    field (TF) coil. These positions are specified relative to a reference point (typically
    the start point) of the cross-section contour. Together with the radial and vertical
    offsets (see $[\texttt{inner\_radius\_of\_toroidal\_field\_coil}](name:inner\_radius\_of\_toroidal\_field\_coil)$
    and $[\texttt{vertical\_offset\_of\_toroidal\_field\_coil}](name:vertical\_offset\_of\_toroidal\_field\_coil)$),
    these three coordinates fully define the geometry of the TF coil conductor cross-section
    in the right-handed cylindrical $(R, \phi, Z)$ frame. The angles are measured
    in radians and are used in electromagnetic and structural models of the tokamak
    magnet system. They are directly prescribed by the TF coil design and are not
    measured in operation. Typical values for a full toroidal set of TF coils are
    discrete angles that are multiples of $2\pi / N_{\mathrm{TF}}$, where $N_{\mathrm{TF}}$
    is the number of TF coils, but local variations within a single coil cross-section
    may be small, on the order of milliradians. The cross-section shape, including
    these angular offsets, is a critical input for evaluating the coil''s current-carrying
    capacity and the resulting magnetic field configuration.


    Sign convention: Positive when the toroidal angle is measured in the direction
    of increasing $\phi$ (counter-clockwise viewed from above).'
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:inner
  - name:vertical
  sources:
  - id: dd:tf/coil/conductor/cross_section/delta_phi
    dd_path: tf/coil/conductor/cross_section/delta_phi
    status: composed
- name: toroidal_magnetic_field_of_ferritic_element
  kind: scalar
  status: draft
  description: Toroidal component of the magnetic field at the centroid of each ferritic
    insert element.
  documentation: 'The toroidal magnetic field $B_\phi = \mathbf{B} \cdot \hat{\phi}$
    at the centroid of a ferritic insert element. This field arises from both the
    plasma equilibrium field and the magnetization of the ferromagnetic insert itself.
    Together with the radial and vertical components, it fully characterizes the local
    magnetic perturbation at the insert location, which is used in equilibrium reconstruction
    codes to account for the magnetic response of in-vessel ferritic components.


    Sign convention: Positive when $B_\phi$ points in the direction of increasing
    toroidal angle $\phi$.


    This quantity is closely related to [radial_magnetic_field_of_ferritic_element](name:radial_magnetic_field_of_ferritic_element)
    and [vertical_magnetic_field_of_ferritic_element](name:vertical_magnetic_field_of_ferritic_element),
    which together provide the full vector magnetic field at the same locations.'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_of_ferritic_element
  - name:vertical_magnetic_field_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_phi
    dd_path: ferritic/object/time_slice/b_field_phi
    status: composed
  - id: dd:ferritic/object/time_slice/b_field_tor
    dd_path: ferritic/object/time_slice/b_field_tor
    status: composed
- name: vertical_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Maximum allowable downward-acting vertical component of the net electromagnetic
    force on a poloidal field coil, defining a structural integrity limit.
  documentation: The maximum allowable vertical force on a poloidal field coil represents
    the structural engineering limit for the $Z$-component of the net electromagnetic
    load. This limit is derived from the coil design, accounting for Lorentz forces
    arising from the interaction of the [poloidal_field_coil_current](name:poloidal_field_coil_current)
    with the background magnetic field, including both toroidal and poloidal field
    components. The limit ensures the coil support structure withstands worst-case
    electromagnetic transients, such as those during plasma disruptions or fast vertical
    displacement events (VDEs), without yielding or fracture. This quantity is complementary
    to the maximum radial force on the same coil system, described by [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil),
    and to the net vector magnitude given by [force_of_poloidal_field_coil](name:force_of_poloidal_field_coil).
    The local winding pack geometry and the coil-to-coil mutual inductance influence
    the magnitude of the vertical force component during asymmetric current excitation.
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:poloidal_field_coil_current
  - name:radial_force_of_poloidal_field_coil
  - name:force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/vertical_force/limit_max
    dd_path: pf_active/vertical_force/limit_max
    status: composed
  - id: dd:pf_active/vertical_force/limit_min
    dd_path: pf_active/vertical_force/limit_min
    status: composed
- name: vertical_magnetic_field_of_ferritic_element
  kind: scalar
  status: draft
  description: Vertical component of the magnetic field at the centroid of each ferritic
    element.
  documentation: "The vertical magnetic field component ${B_Z}$ is the $\\hat{Z}$\
    \ component of the magnetic field vector in the IMAS cylindrical $(R, \\phi, Z)$\
    \ frame. $\\hat{Z}$ points vertically upward from the midplane. At the centroid\
    \ of each ferritic element, this quantity represents the magnetic field strength\
    \ along the vertical direction. \n\nTypical values for ${B_Z}$ depend on the proximity\
    \ to field sources. For in-vessel ferritic elements near the toroidal field coil\
    \ center columns, vertical field strengths can reach several Tesla. For ex-vessel\
    \ elements, typical values are on the order of 0.01 T to 1 T, depending on the\
    \ distance from the magnetic axis and local poloidal field contributions. \n\n\
    Sign convention: Positive when the magnetic field vector points in the direction\
    \ of increasing Z (vertically upward)."
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_of_ferritic_element
  - name:toroidal_magnetic_field_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_z
    dd_path: ferritic/object/time_slice/b_field_z
    status: composed
- name: width_of_ferritic_element
  kind: scalar
  status: draft
  description: Horizontal full width of the rectangular cross-section of a ferritic
    element in the axisymmetric electromagnetic model.
  documentation: "The ferritic element width defines the radial extent of each rectangular\
    \ ferritic insert cross-section in the axisymmetric machine model. Together with\
    \ the vertical height, it determines the cross-sectional area that governs the\
    \ magnetic flux-conducting capability of the ferromagnetic material. Typical widths\
    \ range from 0.01\u20130.10\u202Fm for ferritic inserts in large tokamaks, scaling\
    \ with the element's designed magnetic permeability contribution. The width directly\
    \ influences the element's reluctance and its shielding effect on the toroidal\
    \ magnetic field, as computed in electromagnetic simulations (see [radial_magnetic_field_of_ferritic_element](name:radial_magnetic_field_of_ferritic_element)).\
    \ This geometric parameter is paired with [height_of_ferritic_element](name:height_of_ferritic_element)\
    \ to fully define the rectangular cross-section, and with [major_radius_of_iron_core_segment](name:major_radius_of_iron_core_segment)\
    \ to locate the element in the poloidal plane.\n\nSign convention: Positive when\
    \ the width extends outward in the radial direction.\n\nIn the axisymmetric thin-shell\
    \ or thick-shell approximation, the element's magnetic response is modeled by\
    \ assigning this width to an axisymmetric ring of rectangular cross-section, enabling\
    \ efficient computation of induced eddy currents and magnetization fields."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_magnetic_field_of_ferritic_element
  - name:height_of_ferritic_element
  - name:major_radius_of_iron_core_segment
  sources:
  - id: dd:ferritic/object/axisymmetric/rectangle/width
    dd_path: ferritic/object/axisymmetric/rectangle/width
    status: composed
- name: width_of_iron_core_segment
  kind: scalar
  status: draft
  description: Horizontal full width of the rectangular cross-section of a transformer
    iron core segment.
  documentation: 'The width $w$ defines the horizontal extent of the rectangular cross-section
    of an iron core segment, measured in the machine cylindrical $(R, \phi, Z)$ frame.
    This dimension, together with the segment height $h$ (see [height_of_iron_core_segment](name:height_of_iron_core_segment)),
    determines the cross-sectional area $A = w \cdot h$, which is used to compute
    the magnetic flux capacity and saturation limits of the core. Typical widths range
    from 0.5 m to 2 m for medium-size tokamaks like JET and DIII-D, and up to 4 m
    for ITER. The width is obtained from engineering drawings and used as input to
    electromagnetic circuit models for the poloidal field system.


    Sign convention: Positive when the horizontal dimension extends in the direction
    of increasing $R$.


    See also [outer_radius_of_iron_core_segment](name:outer_radius_of_iron_core_segment)
    and [inner_radius_of_iron_core_segment](name:inner_radius_of_iron_core_segment)
    for alternative annular cross-section descriptions.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  - name:inner_radius_of_iron_core_segment
  sources:
  - id: dd:iron_core/segment/geometry/rectangle/width
    dd_path: iron_core/segment/geometry/rectangle/width
    status: composed
- name: width_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Lateral radial extent of a poloidal field coil element's rectangular
    conductor cross-section.
  documentation: 'The width $w$ of the rectangular cross-section of a poloidal field
    coil element defines the conductor''s lateral radial dimension in the machine
    $(R, \phi, Z)$ frame. Together with the element height $h$ (see [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil)),
    it determines the cross-sectional area $A = w \cdot h$, which directly governs
    the current density $j = I / A$ for a given coil current $I$. This geometric parameter
    is essential for electromagnetic modeling of the poloidal field system, influencing
    the coil resistance, inductance, and the resulting magnetic field distribution.
    Typical PF coil widths range from 0.1 m to 1.0 m in present-day tokamaks, depending
    on the coil''s poloidal location and current requirements.


    Sign convention: Positive when extending in the positive radial direction from
    the inboard to outboard edge of the coil cross-section.


    See also [inner_radius_of_poloidal_field_coil](name:inner_radius_of_poloidal_field_coil)
    and [outer_radius_of_poloidal_field_coil](name:outer_radius_of_poloidal_field_coil)
    for the radial limits of annular cross-section coils, and [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil)
    for the product of width and height.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_poloidal_field_coil
  - name:inner_radius_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/element/geometry/rectangle/width
    dd_path: pf_active/coil/element/geometry/rectangle/width
    status: composed
