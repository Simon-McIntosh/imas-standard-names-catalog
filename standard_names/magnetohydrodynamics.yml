- name: toroidal_halo_current_of_halo_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the halo current flowing through the plasma region
    outside the last closed flux surface during a disruption.
  documentation: 'The toroidal halo current $I_{\phi,\text{halo}}$ is the component
    of the disruption-induced current flowing in the halo plasma along the toroidal
    direction $\phi$, measured at the outer boundary of the halo region. This current
    arises from the rapid thermal quench and subsequent current quench, which drive
    large eddy currents in the scrape-off layer and divertor region. Typical values
    for medium-size tokamaks (e.g., JET, DIII-D) range from tens to hundreds of kiloamperes,
    and can reach several megaamperes in reactor-scale devices like ITER. The magnitude
    and distribution of $I_{\phi,\text{halo}}$ are critical for assessing electromagnetic
    forces on the first wall and vacuum vessel during vertical displacement events.
    The poloidal counterpart is given by [poloidal_halo_current_of_halo_boundary](name:poloidal_halo_current_of_halo_boundary),
    while the total current in the halo region is characterized by [toroidal_halo_current_over_scrape_off_layer](name:toroidal_halo_current_over_scrape_off_layer).


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: A
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_halo_current_of_halo_boundary
  - name:toroidal_halo_current_over_scrape_off_layer
  sources:
  - id: dd:disruption/global_quantities/current_halo_phi
    dd_path: disruption/global_quantities/current_halo_phi
    status: composed
- name: toroidal_magnetic_flux_of_halo_boundary
  kind: scalar
  status: draft
  description: Toroidal magnetic flux enclosed by the outer boundary of the halo current
    region in a tokamak disruption.
  documentation: "The toroidal magnetic flux $\\Phi_{\\rm tor}$ at the halo boundary\
    \ defines the magnetic topology of the region between the last-closed flux surface\
    \ and the vessel wall where open field lines carry induced halo currents. This\
    \ quantity is directly related to the growth of the halo region during the disruption\
    \ current quench, where the rate of change of flux $d\\Phi_{\\rm tor}/dt$ drives\
    \ the poloidal electric field. The flux magnitude is typically on the order of\
    \ 1\u201310 Wb for medium-size tokamaks, inferred from equilibrium reconstruction\
    \ constrained by external magnetic measurements and vessel eddy-current monitors.\n\
    \nSign convention: Positive when the flux points in the co-current direction (i.e.,\
    \ in the direction of increasing toroidal angle $\\phi$ for a positive plasma\
    \ current $I_p$)."
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_magnetic_flux_of_halo_boundary
  - name:toroidal_magnetic_flux_of_halo_boundary_due_to_poloidal_current
  sources:
  - id: dd:disruption/global_quantities/phi_halo_boundary
    dd_path: disruption/global_quantities/phi_halo_boundary
    status: composed
- name: toroidal_magnetic_flux_of_halo_boundary_due_to_poloidal_current
  kind: scalar
  status: draft
  description: Toroidal magnetic flux enclosed by the halo region boundary, generated
    by the poloidal current flowing in the halo plasma during a disruption.
  documentation: 'This quantity represents the toroidal component $\Phi_{\phi,\mathrm{halo}}
    = \int \mathbf{B}\cdot\hat{\phi}\,\mathrm{d}S$ of the magnetic flux threading
    the area inside the halo region boundary. The poloidal halo current $I_{\mathrm{halo},\theta}$
    (flowing predominantly along open field lines in the scrape-off layer and halo
    region) generates this toroidal flux through the plasma response, contributing
    to the electromagnetic forces on the vessel during a disruption. The flux is related
    to the halo current via $\Phi_{\phi,\mathrm{halo}} = L_{\mathrm{halo}} I_{\mathrm{halo},\theta}$,
    where $L_{\mathrm{halo}}$ is the effective inductance of the halo current path.
    Typical values in large tokamaks during major disruptions range from 0.1 to 2
    Wb, scaling with plasma current and halo size. This quantity is closely related
    to $[\texttt{toroidal\_magnetic\_flux\_of\_halo\_boundary}](name:toroidal_magnetic_flux_of_halo_boundary)$
    (total toroidal flux at the halo boundary irrespective of the driving current)
    and $[\texttt{poloidal\_magnetic\_flux\_of\_halo\_boundary}](name:poloidal_magnetic_flux_of_halo_boundary)$
    (the poloidal flux counterpart). Together they characterize the magnetic topology
    of the halo region and the associated electromagnetic loading on the first wall.


    Sign convention: Positive when the direction of the poloidal halo current produces
    a toroidal magnetic flux that points in the direction of increasing toroidal angle
    $\phi$ (counter-clockwise viewed from above).'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_magnetic_flux_of_halo_boundary
  - name:poloidal_magnetic_flux_of_halo_boundary
  sources:
  - id: dd:disruption/global_quantities/phi_halo_boundary_poloidal_current
    dd_path: disruption/global_quantities/phi_halo_boundary_poloidal_current
    status: composed
- name: toroidal_mode_number_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Principal toroidal Fourier mode number characterizing the helical periodicity
    of a neoclassical tearing mode magnetic island.
  documentation: "The toroidal mode number $n$ specifies the number of toroidal transits\
    \ a neoclassical tearing mode (NTM) magnetic island completes in one full poloidal\
    \ circuit. Together with the poloidal mode number $m$, it defines the helicity\
    \ $q = m/n$ of the resonant rational flux surface. Mode numbers are determined\
    \ from Mirnov coil arrays or ECE imaging, typically in the range $n = 1$\u2013\
    5 for NTMs in conventional tokamaks. The sign of $n$ distinguishes co-rotating\
    \ (positive) from counter-rotating (negative) modes relative to the plasma current\
    \ direction.\n\nSign convention: Positive when the mode propagates in the direction\
    \ of increasing toroidal angle $\\phi$ (i.e., co-current direction).\n\nSee also\
    \ [poloidal_mode_number_of_neoclassical_tearing_mode](name:poloidal_mode_number_of_neoclassical_tearing_mode)\
    \ for the complementary poloidal periodicity parameter."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
