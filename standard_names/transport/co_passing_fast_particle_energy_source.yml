name: co_passing_fast_particle_energy_source
status: draft
description: Volumetric source rate of energy density for fast particles with co-current
  passing orbits.
documentation: "This quantity represents the net rate at which energy density is injected\
  \ into (or removed from) the co-passing fast-particle population, i.e., supra-thermal\
  \ particles whose parallel velocity is aligned with the plasma current direction\
  \ and whose pitch angle keeps them on passing (non-trapped) orbits. The source rate\
  \ $S_{E,\\mathrm{co,fast}}$ (W m$^{-3}$) includes contributions from neutral beam\
  \ injection, ICRH wave\u2013particle interactions, collisional energy exchange with\
  \ bulk species, and losses such as charge-exchange and orbit losses. Positive values\
  \ indicate net energy gain by the co-passing fast population. Typical magnitudes\
  \ in NBI-heated tokamak cores are $10^4$\u2013$10^6$ W m$^{-3}$. Computed by Fokker\u2013\
  Planck or Monte Carlo orbit-following codes that resolve the velocity-space partition\
  \ into co-passing, counter-passing, and trapped populations."
validity_domain: ''
