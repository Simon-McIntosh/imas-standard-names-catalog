name: toroidal_component_of_current_density_due_to_viscous_heat_flux
status: draft
description: Toroidal projection of the current density driven by the divergence of
  the viscous heat-flux tensor in a magnetized plasma.
documentation: "This quantity represents the $\\hat{\\phi}$ component of the current\
  \ density $j_{\\rm hv,\\phi}$ (A\xB7m$^{-2}$) arising from viscous heat-flux contributions\
  \ to the generalized Ohm's law. In extended magnetohydrodynamic (MHD) formulations,\
  \ the viscous heat-flux current appears through the off-diagonal stress-tensor terms:\
  \ $\\mathbf{j}_{\\rm hv} \\propto \\nabla \\cdot \\boldsymbol{\\pi}_q$, where $\\\
  boldsymbol{\\pi}_q$ is the heat-flux component of the viscosity tensor. This term\
  \ is most significant in the edge and scrape-off layer where strong temperature\
  \ gradients and collisionality variations make finite-Larmor-radius (FLR) and neoclassical\
  \ viscosity corrections non-negligible. Typical magnitudes are small compared with\
  \ the Ohmic and bootstrap current densities\u2014often $|j_{\\rm hv,\\phi}| \\lesssim\
  \ 10^3$ A\xB7m$^{-2}$\u2014but they matter for accurate edge current-profile modeling.\
  \ The quantity is computed by advanced fluid codes (e.g., BOUT++, JOREK) that solve\
  \ the full Braginskii or gyroviscous closures. Positive when $j_{\\rm hv,\\phi}$\
  \ is in the $+\\phi$ direction under the chosen COCOS convention. See also `toroidal_component_of_current_density_due_to_parallel_viscosity`\
  \ and `toroidal_component_of_current_density_due_to_perpendicular_viscosity` for\
  \ companion viscosity-driven current channels."
