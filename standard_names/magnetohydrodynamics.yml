- name: poloidal_perturbed_plasma_magnetic_field
  kind: scalar
  status: active
  description: Poloidal perturbed plasma magnetic field is the poloidal component
    of the complex linear-MHD eigenfunction, or corresponding real perturbation, of
    the magnetic-field deviation carried by the confined-plasma response about equilibrium.
  documentation: 'Poloidal perturbed plasma magnetic field is the poloidal component
    of the complex linear-MHD eigenfunction, or corresponding real perturbation, of
    the magnetic-field deviation carried by the confined-plasma response about an
    equilibrium magnetic field. It is the poloidal projection of the [perturbed plasma
    magnetic field](name:perturbed_plasma_magnetic_field), rather than the unrestricted
    magnetic-field vector.


    $$

    \delta B_{\mathrm{pol}}(\mathbf{x},t)=\hat{\mathbf e}_{\mathrm{pol}}(\mathbf{x})\cdot\delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t)

    $$


    Here, $\delta B_{\mathrm{pol}}$ is the poloidal component, $\hat{\mathbf e}_{\mathrm{pol}}$
    is the chosen poloidal unit vector in the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, and $\delta\mathbf{B}_{\mathrm{pl}}$ is the plasma-response
    perturbation after subtracting the equilibrium field and any separately represented
    externally imposed vacuum perturbation. The complex quantity includes the [poloidal
    real part](name:poloidal_perturbed_plasma_magnetic_field_real_part) and [poloidal
    imaginary part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part);
    the [toroidal perturbed plasma magnetic field](name:toroidal_perturbed_plasma_magnetic_field)
    is its complementary toroidal projection.


    Sign convention: Positive when the perturbed magnetic field points in the direction
    of increasing poloidal angle within the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:toroidal_perturbed_plasma_magnetic_field
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: radial_perturbed_plasma_magnetic_field
  kind: scalar
  status: active
  description: "Radial perturbed plasma magnetic field is the R component of the complex\
    \ linear-MHD plasma-response perturbation in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The radial perturbed plasma magnetic field is the major-radius-directed
    component of the complex linear-MHD magnetic-field perturbation eigenfunction,
    or of its corresponding real perturbation, carried by the confined plasma. It
    is the radial projection of the [perturbed plasma magnetic field](name:perturbed_plasma_magnetic_field).
    The right-handed cylindrical $(R,\phi,Z)$ frame has $R$ as major radius, $\phi$
    as toroidal angle, and $Z$ as vertical height.


    The plasma-response component is defined by


    $$

    \delta B_{R,\mathrm{pl}}(\mathbf{x},t) = \delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t)
    \cdot \hat{\mathbf{R}}

    $$


    where $\delta B_{R,\mathrm{pl}}$ is the radial component, $\delta\mathbf{B}_{\mathrm{pl}}$
    is the plasma-response magnetic perturbation, $\mathbf{x}$ is position, $t$ is
    time, and $\hat{\mathbf{R}}$ is the cylindrical major-radius unit vector. For
    a Fourier-resolved eigenfunction, the projection applies to the specified complex
    harmonic coefficient.


    Here radial means the cylindrical $R$ direction, not the normal to an equilibrium
    magnetic flux surface. The component excludes the equilibrium field and any separately
    represented externally imposed vacuum perturbation. Together with the [toroidal
    perturbed plasma magnetic field](name:toroidal_perturbed_plasma_magnetic_field),
    it describes directional components of the plasma response; its in-phase component
    is represented by the [radial perturbed plasma magnetic field real part](name:radial_perturbed_plasma_magnetic_field_real_part).


    Sign convention: Positive when the magnetic perturbation points toward increasing
    major radius $R$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:toroidal_perturbed_plasma_magnetic_field
  - name:radial_perturbed_plasma_magnetic_field_real_part
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: active
  description: "Radial perturbed plasma magnetic field real part is the in-phase radial\
    \ component of the complex first-order plasma magnetic-field perturbation for\
    \ one toroidal Fourier harmonic. The radial direction is the R component in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial perturbed plasma magnetic field real part is the real part
    of the cylindrical radial component of a complex first-order plasma magnetic-field
    perturbation for a selected toroidal Fourier harmonic. The radial direction is
    the $+\hat{\mathbf{R}}$ basis direction of the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The defining component is


    $$

    \delta B_{R,n}^{\mathrm{re}} = \operatorname{Re}\!\left(\widetilde{\delta\mathbf{B}}_n
    \cdot \hat{\mathbf{R}}\right)

    $$


    where $\delta B_{R,n}^{\mathrm{re}}$ is this real component, $\widetilde{\delta\mathbf{B}}_n$
    is the complex first-order plasma magnetic-field perturbation for toroidal Fourier
    mode number $n$, $\operatorname{Re}$ takes the real part, and $\hat{\mathbf{R}}$
    is the radial basis vector.


    Together with [radial perturbed plasma magnetic field imaginary part], it determines
    the complex [radial perturbed plasma magnetic field](name:radial_perturbed_plasma_magnetic_field);
    changing the chosen complex phase of the harmonic rotates the real and imaginary
    parts without changing the represented perturbation. It is the radial component
    counterpart of [toroidal perturbed plasma magnetic field](name:toroidal_perturbed_plasma_magnetic_field)
    and is distinct from a flux-surface-normal projection, which would use a unit
    normal to a specified flux coordinate rather than $\hat{\mathbf{R}}$.


    Sign convention: Positive when the in-phase radial perturbation component points
    in the $+\hat{\mathbf{R}}$ direction of increasing major radius $R$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_plasma_magnetic_field
  - name:toroidal_perturbed_plasma_magnetic_field
