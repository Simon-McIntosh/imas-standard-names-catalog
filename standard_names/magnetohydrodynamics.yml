      parent: Volume average runaways parameters
      data_type: FLT_1D
      unit: J.m^-3
      coordinates:
      - runaway_electrons/time
    enhanced_context:
      description: Volume-averaged kinetic energy density of the runaway electron
        (RE) population. Represents the mean kinetic energy per unit volume stored
        in suprathermal runaway electrons averaged over the plasma volume.
      kind: llm
- name: vorticity
  kind: scalar
  status: active
  description: Curl of the plasma bulk velocity field measuring local angular rotation
    of fluid elements; parent quantity generalizing over directional projections including
    radial, toroidal, poloidal, and field-aligned components.
  documentation: 'Plasma vorticity characterizes the rotational nature of bulk plasma
    flow and plays a central role in MHD dynamics, entering the momentum equation
    through nonlinear advection and governing the evolution of shear layers and vortex
    structures. It resolves into components along the coordinate axes of the plasma
    geometry, each describing a distinct aspect of rotational fluid motion.


    The defining relation is:


    $$

    \boldsymbol{\omega} = \nabla \times \mathbf{v}

    $$


    where $\mathbf{v}$ is the local plasma bulk flow velocity. Projections in the
    right-handed cylindrical $(R, \phi, Z)$ frame are provided by [radial_vorticity](name:radial_vorticity),
    [toroidal_vorticity](name:toroidal_vorticity), and [vertical_vorticity](name:vertical_vorticity);
    the field-aligned projection is [parallel_vorticity](name:parallel_vorticity).


    Vorticity is evaluated from velocity fields obtained via ion Doppler spectroscopy
    or charge exchange recombination spectroscopy, or computed self-consistently in
    MHD simulations through curl operations applied to the discrete velocity field
    on the computational mesh.


    Sign convention: Positive when the plasma velocity field rotates in the right-hand
    sense about the positive direction of the relevant coordinate axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_vorticity
  - name:toroidal_vorticity
  - name:vertical_vorticity
  - name:parallel_vorticity
  sources:
  - dd_path: mhd/ggd/vorticity/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd.html#mhd-ggd-vorticity-values
