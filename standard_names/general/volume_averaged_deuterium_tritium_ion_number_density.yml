name: volume_averaged_deuterium_tritium_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged combined number density of deuterium and tritium
  ions, representing the total D-T fuel content.
documentation: The volume-averaged D-T ion number density $\langle n_{\mathrm{DT}}
  \rangle_V = V^{-1} \int (n_{\mathrm{D}} + n_{\mathrm{T}})(\mathbf{r})\, dV$ where
  $n_{\mathrm{D}}$ and $n_{\mathrm{T}}$ are the local deuterium and tritium ion densities
  in m$^{-3}$ and $V$ is the plasma volume in m$^3$. This combined quantity provides
  a direct measure of total fuel content relevant to fusion power production; for
  ITER baseline scenarios, $\langle n_{\mathrm{DT}} \rangle_V \approx 1 \times 10^{20}$
  m$^{-3}$ with a target 50:50 D:T mix. Fuel density is derived from electron density
  measurements (Thomson scattering, interferometry) corrected for impurity dilution
  via quasi-neutrality, and independently cross-checked against neutron yield analysis.
  The fusion power scales as $P_{\mathrm{fus}} \propto n_{\mathrm{D}} n_{\mathrm{T}}
  \langle \sigma v \rangle_{\mathrm{DT}}$, making this a critical performance metric.
  See also `volume_averaged_deuterium_ion_number_density` and `electron_number_density`.
