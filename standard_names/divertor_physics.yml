- name: krypton_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of krypton ions in the plasma immediately adjacent to
    a divertor target, summed over all krypton ionization charge states from Kr1+
    through Kr36+ and excluding neutral krypton atoms.
  documentation: 'Krypton density at the divertor target is the local number density
    of ionized krypton in the plasma immediately adjacent to the material target surface,
    evaluated upstream of the electrostatic sheath entrance. It is the charge-state-summed
    krypton ion population at that location, excluding neutral krypton atoms, and
    is a species-resolved instance of [density_at_divertor_target](name:density_at_divertor_target).


    The total krypton ion number density aggregates all 36 bound-electron configurations:


    $$

    n_{\mathrm{Kr}} = \sum_{z=1}^{36} n_{\mathrm{Kr}^{z+}}

    $$


    where $n_{\mathrm{Kr}^{z+}}$ is the local number density of krypton ions carrying
    charge state $z$.


    Krypton (atomic number 36) is a noble gas used as a heavy radiative seeding impurity;
    it radiates efficiently across a broad electron temperature range, redistributing
    power away from the strike zone and facilitating plasma detachment. The local
    density at the target reflects the balance between krypton injection, ionization
    and recombination, cross-field diffusion in the scrape-off layer, parallel transport
    along field lines, and surface recycling. In attached divertor conditions the
    krypton ion population peaks farther upstream; in detached conditions, reduced
    parallel transport can concentrate the ionized fraction closer to the target.
    This quantity complements [krypton_density](name:krypton_density), which gives
    the radially resolved density profile, and [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target)
    for the analogous charge-state-summed carbon species.


    The quantity is inferred from vacuum ultraviolet or extreme ultraviolet emission
    spectroscopy in the divertor volume, or from edge plasma transport simulations
    benchmarked against spectroscopic line-ratio diagnostics.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:krypton_density
  - name:carbon_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: krypton
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/divertor_target/n_i/krypton/value
