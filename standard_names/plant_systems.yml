- name: y_minor_axis_unit_vector_of_shatter_cone
  kind: scalar
  status: active
  description: Y-directed projection of the unit vector defining the minor axis of
    an elliptic shatter cone, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The quantity is the Cartesian y component of the unit vector that
    defines the minor axis of the elliptic shatter cone. It specifies one directional
    component of the shatter-cone orientation.


    In the right-handed Cartesian $(\hat{x},\hat{y},\hat{z})$ basis, with $\hat{z}=\hat{Z}$,
    it is defined by:


    $$

    u_{\mathrm{min},y} = \mathbf{u}_{\mathrm{min}} \cdot \hat{\mathbf{y}}

    $$


    where $\mathbf{u}_{\mathrm{min}}$ is the normalized minor-axis unit vector, $\hat{\mathbf{y}}$
    is the Cartesian y unit vector, and $u_{\mathrm{min},y}$ is their scalar projection.
    The vector satisfies $\lVert\mathbf{u}_{\mathrm{min}}\rVert=1$.


    This component is distinct from the corresponding [x component](name:x_minor_axis_unit_vector_of_shatter_cone)
    and [z component](name:z_minor_axis_unit_vector_of_shatter_cone), and from the
    [y component of the major-axis unit vector](name:y_major_axis_unit_vector_of_shatter_cone).


    Sign convention: Positive when the minor-axis unit vector projects in the direction
    of increasing Cartesian y.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:y_major_axis_unit_vector_of_shatter_cone
  sources:
  - dd_path: spi/injector/shatter_cone/unit_vector_minor/y
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-shatter_cone-unit_vector_minor-y
