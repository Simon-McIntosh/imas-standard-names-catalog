- name: toroidal_hydrogen_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal hydrogen ion flow velocity evaluated at the radial location
    of the internal transport barrier in the right-handed cylindrical (R, phi, Z)
    frame.
  documentation: 'Toroidal hydrogen ion velocity at an internal transport barrier
    is the component of the hydrogen ion bulk flow parallel to the toroidal basis
    direction, evaluated at the radial position where the barrier is identified. It
    describes the local hydrogen rotation associated with the barrier and is a signed
    velocity component, not a speed magnitude.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the component is defined
    by projecting the hydrogen ion flow velocity onto the toroidal unit vector at
    the internal-transport-barrier location:


    $$

    v_{\phi,\mathrm{H},\mathrm{ITB}} = \mathbf{v}_{\mathrm{H}}(r_{\mathrm{ITB}}) \cdot
    \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{H}}$ is the hydrogen ion bulk flow velocity, $r_{\mathrm{ITB}}$
    is a radial label for the barrier location, and $\hat{\phi}$ is the unit vector
    in the direction of increasing toroidal angle $\phi$.


    This quantity is commonly obtained from Doppler spectroscopy of hydrogen-related
    emission, often with charge-exchange or beam-assisted interpretation, and may
    also be constrained through transport analysis using species force balance. In
    such analyzes it is coupled to poloidal flow, pressure gradients, and magnetic-field
    components in determining the radial electric field and flow shear near the barrier.


    Typical magnitudes in core tokamak plasmas are often $10^3$-$10^5$ m.s^-1, depending
    on external momentum input, collisional coupling to other ion species, neutral-beam
    geometry, and the strength of the internal transport barrier. Values near zero
    or sign reversals can occur in weakly rotating or counter-rotating conditions.


    Sign convention: Positive when the hydrogen ion flow is directed in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_helium_4_velocity_at_internal_transport_barrier
  - name:toroidal_nitrogen_velocity_at_internal_transport_barrier
