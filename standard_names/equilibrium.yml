- name: toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface
  kind: scalar
  status: active
  description: Toroidal diamagnetic magnetic flux at an inside flux surface is the
    diamagnetic contribution to the toroidal magnetic flux through the poloidal cross-section
    enclosed by a selected closed flux surface.
  documentation: 'Toroidal diamagnetic magnetic flux at an inside flux surface is
    the diamagnetic contribution to the [toroidal magnetic flux](name:toroidal_magnetic_flux)
    through the poloidal cross-section enclosed by a selected closed flux surface.
    It is a surface-dependent cumulative flux inside the plasma boundary, not only
    a boundary value.


    For an axisymmetric equilibrium in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle increasing counter-clockwise
    viewed from above $+\hat{Z}$, and $Z$ is vertical height, let $S_\chi$ be the
    constant-$\phi$ poloidal cross-section enclosed by the flux surface labeled by
    $\chi$. With $d\mathbf{A}_\phi = \hat{\phi}\,dA$ oriented toward increasing $\phi$,
    the enclosed diamagnetic toroidal flux is defined by:


    $$

    \Phi_{\phi,\mathrm{dia}}(\chi) = \int_{S_\chi} \mathbf{B}_{\mathrm{dia}}(R,Z)
    \cdot d\mathbf{A}_\phi = \int_{S_\chi} B_{\phi,\mathrm{dia}}(R,Z)\,dA

    $$


    where $\chi$ identifies the selected flux surface, $\mathbf{B}_{\mathrm{dia}}$
    is the diamagnetic contribution to the equilibrium magnetic field, $B_{\phi,\mathrm{dia}}
    = \mathbf{B}_{\mathrm{dia}}\cdot\hat{\phi}$ is its toroidal component, $\hat{\phi}$
    is the unit vector toward increasing toroidal angle, and $dA$ is the positive
    scalar area element on $S_\chi$.


    This quantity includes only the diamagnetic magnetic-field contribution. It is
    distinct from the total [toroidal_magnetic_flux](name:toroidal_magnetic_flux),
    which includes all magnetic-field contributions, from [toroidal_magnetic_flux_at_plasma_boundary](name:toroidal_magnetic_flux_at_plasma_boundary),
    which is evaluated at the plasma boundary, and from [toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current](name:toroidal_magnetic_flux_at_plasma_boundary_due_to_poloidal_current),
    which isolates the poloidal-current contribution at that boundary.


    Sign convention: Positive when the net diamagnetic magnetic-field contribution
    through the enclosed poloidal cross-section points in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, counter-clockwise
    viewed from above $+\hat{Z}$.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:toroidal_magnetic_flux_at_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/constraints/diamagnetic_flux
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-diamagnetic_flux
    dd_documentation:
      leaf: Diamagnetic flux
      parent_path: equilibrium/time_slice/constraints
      parent: 'In case of equilibrium reconstruction under constraints, measurements
        used to constrain the equilibrium, reconstructed values and accuracy of the
        fit. The names of the child nodes correspond to the following definition:
        the solver aims at minimizing a cost function defined as : J=1/2*sum_i [ weight_i^2
        (reconstructed_i - measured_i)^2 / sigma_i^2 ]. in which sigma_i is the standard
        deviation of the measurement error (to be found in the IDS of the measurement)'
      data_type: STRUCTURE
      unit: Wb
    enhanced_context:
      description: "Diamagnetic flux (\u03A6_dia) used as a constraint in MHD equilibrium\
        \ reconstruction. Stores measured and reconstructed values along with fit\
        \ quality metrics, representing the change in magnetic flux due to plasma\
        \ diamagnetism."
      kind: llm
- name: toroidal_flux_radius
  kind: scalar
  status: active
  description: Toroidal flux radius is the non-negative effective minor-radius label
    of a nested magnetic flux surface, defined from the enclosed toroidal magnetic
    flux and a positive reference vacuum toroidal-field magnitude. It is a magnetic
    flux-surface label rather than a geometric distance.
  documentation: 'Toroidal flux radius is the non-negative effective minor-radius
    label assigned to a nested magnetic flux surface from the toroidal magnetic flux
    enclosed between the magnetic axis and that surface. It is determined by magnetic
    flux topology, not by geometric distance from the magnetic axis.


    For an enclosed toroidal flux $\Phi_\mathrm{tor}$ and a positive reference toroidal-field
    magnitude $B_\mathrm{ref}$, the toroidal flux radius $\rho_\mathrm{tor}$ is defined
    by:


    $$

    \rho_\mathrm{tor} = \sqrt{\frac{|\Phi_\mathrm{tor}|}{\pi B_\mathrm{ref}}}

    $$


    where $\Phi_\mathrm{tor}$ is the [toroidal magnetic flux](name:toroidal_magnetic_flux)
    enclosed between the magnetic axis and the flux surface, and $B_\mathrm{ref}$
    is the positive magnitude of the reference vacuum toroidal magnetic field used
    for the equilibrium normalization.


    It is zero at the magnetic axis and increases monotonically over nested flux surfaces
    as the enclosed flux magnitude increases. The [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    is obtained by dividing $\rho_\mathrm{tor}$ by its value at the last closed flux
    surface; toroidal flux radius itself remains an effective radius and equals a
    geometric minor radius only in the circular, uniform-reference-field limit.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
  - name:normalized_minor_radius_of_flux_surface
  - name:toroidal_flux_radius_of_magnetic_axis
  sources:
