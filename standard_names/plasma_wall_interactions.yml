      kind: template
- name: surface_emissivity
  kind: scalar
  status: active
  description: Dimensionless ratio of thermal radiation emitted by a surface to blackbody
    radiation at the same surface temperature, with the stated spectral and angular
    averaging.
  documentation: 'Surface emissivity is the effectiveness of a material surface in
    emitting thermal electromagnetic radiation relative to an ideal blackbody at the
    same temperature. It is a material property of the emitting surface and is distinct
    from the emitted energy flux described by [energy flux due to surface emission](name:energy_flux_at_wall_due_to_surface_emission).


    The effective emissivity is defined by


    $$

    \varepsilon = \frac{M_{\mathrm{emit}}(T_s)}{M_{\mathrm{bb}}(T_s)}

    $$


    where $M_{\mathrm{emit}}$ is the surface thermal radiative exitance, $M_{\mathrm{bb}}$
    is the blackbody exitance, and $T_s$ is the surface temperature. The ratio applies
    to the specified spectral band and angular averaging; it is not a wavelength-
    and direction-resolved emissivity. Incident radiation and geometric surface area,
    such as [optical-element area](name:area_of_optical_element), are excluded.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_surface_emission
  - name:area_of_optical_element
  sources:
  - dd_path: camera_ir/channel/camera/frame/region_of_interest/emissivity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-frame-region_of_interest-emissivity
    dd_documentation:
