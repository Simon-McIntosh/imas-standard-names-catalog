- name: saturated_ion_current_density
  kind: scalar
  status: active
  description: Saturated ion current density is the ion charge flux per collecting
    area at the ion-saturation limit, when a sufficiently negative bias suppresses
    electron collection.
  documentation: 'Saturated ion current density is the ion-carried conventional charge
    transport per collecting area at the ion-saturation limit of a negatively biased
    collecting surface. It represents directed ion collection rather than net charge
    transport at an arbitrary bias.


    In a sheath representation, the defining relation is


    $$

    J_{i,\mathrm{sat}} = \sum_s q_s\,\Gamma_{s,\mathrm{sat}} = \sum_s q_s\,n_{s,\mathrm{se}}\,u_{s,\mathrm{B}}

    $$


    where $J_{i,\mathrm{sat}}$ is the saturated ion current density, $q_s$ is the
    charge of ion population $s$, $\Gamma_{s,\mathrm{sat}}$ is its particle flux toward
    the collecting surface, $n_{s,\mathrm{se}}$ is its sheath-edge number density,
    and $u_{s,\mathrm{B}}$ is its directed Bohm-entry speed.


    The quantity preserves charge weighting over the included ion species and charge
    states and excludes electron current. It is the saturation-limit specialization
    of [ion current density](name:ion_current_density), distinct from the area-integrated
    [saturated ion current](name:saturated_ion_current) and from temporal fluctuations
    represented by [fluctuating saturated ion current density](name:fluctuating_saturated_ion_current_density).


    Sign convention: Positive when positive ion charge flows toward the collecting
    surface.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_current_density
  - name:saturated_ion_current
  - name:fluctuating_saturated_ion_current_density
  arguments:
  - name: ion_current_density
    operator: saturated
    operator_kind: qualifier
