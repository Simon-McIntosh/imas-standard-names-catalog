- name: ion_density_at_divertor_target
  kind: scalar
  status: active
  description: Ion density at the divertor target is the local number density of a
    specified positive-ion population near the target, summed over its included charge
    states at the electrostatic sheath entrance.
  documentation: 'Ion density at the divertor target is the local number density of
    a specified positive-ion population in the plasma immediately adjacent to a divertor
    target surface, evaluated at the entrance to the electrostatic sheath. It is the
    ionic component of [density at the divertor target](name:density_at_divertor_target),
    excluding neutral atoms, molecules, and free electrons.


    For an included population $P$, the charge-state-summed density is defined by


    $$

    n_P = \sum_{s \in P} \sum_{z=1}^{Z_s} n_{s,z}

    $$


    where $n_P$ is the ion density, $s$ indexes the included ion species, $z$ is the
    positive ionization charge state, $Z_s$ is the highest included charge state of
    species $s$, and $n_{s,z}$ is its local number density.


    A species-specific member fixes $P$ to one element, while [total ion density at
    the divertor target](name:total_ion_density_at_divertor_target) includes all ionic
    species present locally.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:density_at_divertor_target
  - name:total_ion_density_at_divertor_target
  arguments:
  - name: density_at_divertor_target
    operator: ion
    operator_kind: qualifier
- name: ion_fluence_at_divertor_target
  kind: scalar
  status: active
  description: Cumulative incident ion-particle dose delivered to a divertor target,
    with each ion counted once across all species and charge states.
  documentation: 'Ion fluence at a divertor target is the cumulative number of incident
    ions per unit target area over a specified time interval. It is the ion-only component
    of [fluence at the divertor target](name:fluence_at_divertor_target), including
    all ionic species and charge states while counting each incident ion once.


    $$

    \Phi_{\mathrm{ion}} = \int_{t_1}^{t_2} \left[\sum_{s\in\mathcal{I}} \Gamma_{\perp,s}(t)\right]
    \, dt

    $$


    Here, $\Phi_{\mathrm{ion}}$ is the ion fluence, $t_1$ and $t_2$ are the interval
    endpoints in seconds, $\mathcal{I}$ is the set of included ion species and charge
    states, and $\Gamma_{\perp,s}$ is the incident normal particle-flux density for
    state $s$, in m$^{-2}$ s$^{-1}$. The flux is directed from the plasma toward the
    target surface. Neutral atoms, molecules, and nonparticle channels are excluded.'
  unit: m^-2
  physics_domain: divertor_physics
  links: []
  sources:
  - dd_path: langmuir_probes/embedded/fluence
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-fluence
    dd_documentation:
      leaf: Positive charge fluence normal to an ideal axisymmetric surface of the
        divertor (assuming no shaping), estimated at the probe location.
      parent_path: langmuir_probes/embedded
      parent: Set of embedded (in a plasma facing component) probes or probe pins
      data_type: STRUCTURE
      unit: m^-2
    enhanced_context:
      description: Positive charge fluence normal to an ideal axisymmetric divertor
        surface, estimated at the embedded Langmuir probe location. Represents the
        time-integrated ion charge flux incident on the plasma-facing component.
      kind: llm
