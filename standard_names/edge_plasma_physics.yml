- name: parallel_ion_charge_state_momentum_source
  kind: scalar
  status: active
  description: Parallel ion charge-state momentum source is the parallel projection
    of the area-normalized momentum source acting on one specified ion charge state.
    It represents momentum transfer along the local magnetic-field direction.
  documentation: 'Parallel ion charge-state momentum source is the parallel projection
    of the area-normalized momentum source acting on one specified ion charge state.
    It represents directional momentum transfer to or from that charge state resolved
    along the local magnetic-field direction, rather than summed over charge states.


    The parallel projection is defined by projecting the momentum-source vector for
    that charge state onto the local magnetic-field unit vector:


    $$

    S_{\parallel,i,Z} = \mathbf{S}_{i,Z} \cdot \hat{\mathbf{b}}

    $$


    where $\mathbf{S}_{i,Z}$ is the area-normalized momentum-source vector acting
    on ion species $i$ in charge state $Z$, and $\hat{\mathbf{b}} = \mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field.


    This quantity is distinct from the [poloidal ion charge-state momentum source](name:poloidal_ion_charge_state_momentum_source)
    and the [toroidal ion charge-state momentum source](name:toroidal_ion_charge_state_momentum_source),
    which use poloidal and toroidal projections of the same charge-state-resolved
    momentum source.


    Sign convention: Positive when the momentum-source vector acting on the charge
    state has a component in the direction of $\hat{\mathbf{b}}$, the local magnetic-field
    unit vector.'
