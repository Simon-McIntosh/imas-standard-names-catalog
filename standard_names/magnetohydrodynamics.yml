- name: vertical_magnetic_vector_potential
  kind: scalar
  status: draft
  description: Z-component of the magnetic vector potential in the right-handed cylindrical
    (R, phi, Z) frame, where the full potential satisfies the curl relation giving
    the magnetic induction B.
  documentation: 'The vertical component $A_Z$ is the projection of the magnetic vector
    potential $\mathbf{A}$ onto the vertical axis $\hat{Z}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is the major radius, $\phi$ is the toroidal angle,
    and $Z$ is the vertical height. The full potential satisfies $\mathbf{B} = \nabla
    \times \mathbf{A}$, making $\mathbf{A}$ gage-dependent but essential in canonical
    particle momentum, gyrokinetic formulations, and MHD perturbation theory.


    The projection is formally defined as:


    $$

    A_Z = \mathbf{A} \cdot \hat{Z}

    $$


    where $\hat{Z}$ is the unit vector in the direction of increasing height. Through
    the curl relation, $A_Z$ couples to the radial magnetic-field component as $B_R
    = R^{-1}\partial A_Z/\partial\phi - \partial A_\phi/\partial Z$ and to the toroidal
    component as $B_\phi = \partial A_R/\partial Z - \partial A_Z/\partial R$, where
    $A_R$ and $A_\phi$ are the radial and toroidal components of $\mathbf{A}$.


    Computed from MHD equilibria or electromagnetic simulations covering the full
    plasma domain, including edge and wall-adjacent regions. The companion toroidal_vector_potential
    gives the $\phi$-projection of $\mathbf{A}$, while [vertical_vacuum_magnetic_vector_potential](name:vertical_vacuum_magnetic_vector_potential)
    isolates the vacuum contribution to $A_Z$ arising from external coil currents.
    The corresponding magnetic-field component is [vertical_magnetic_field](name:vertical_magnetic_field).


    Sign convention: Positive when $A_Z$ points in the direction of increasing $Z$.'
  unit: T.m
  physics_domain: magnetohydrodynamics
  links:
  - name:vertical_vacuum_magnetic_vector_potential
  - name:vertical_magnetic_field
  arguments:
  - name: magnetic_vector_potential
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
