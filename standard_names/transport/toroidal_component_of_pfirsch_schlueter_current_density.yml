name: toroidal_component_of_pfirsch_schlueter_current_density
status: draft
description: "Toroidal projection of the Pfirsch\u2013Schl\xFCter return current that\
  \ maintains divergence-free current on toroidal flux surfaces."
documentation: "The toroidal component of the Pfirsch\u2013Schl\xFCter current $j_{\\\
  rm PS,\\phi}$ (A\xB7m$^{-2}$) is the $\\hat{\\phi}$ projection of the parallel return\
  \ current driven by the requirement $\\nabla \\cdot \\mathbf{j} = 0$ in a toroidal\
  \ equilibrium. It arises because grad-$B$ and curvature drifts create a vertical\
  \ charge separation that must be neutralized by field-aligned currents closing through\
  \ the poloidal and toroidal directions. The PS current scales as $j_{\\rm PS} \\\
  propto q (dp/dr) / B$, where $q$ is the safety factor, $dp/dr$ the radial pressure\
  \ gradient (Pa\xB7m$^{-1}$), and $B$ the magnetic field magnitude (T). Because in\
  \ typical tokamak geometry $B_\\phi \\gg B_\\theta$, the toroidal projection is\
  \ close to the total parallel PS current magnitude. Typical values in H-mode pedestals\
  \ reach $10^4$\u2013$10^5$ A\xB7m$^{-2}$. Positive when $j_{\\rm PS,\\phi}$ is in\
  \ the $+\\phi$ direction under the chosen COCOS convention. Evaluated by neoclassical\
  \ codes (NCLASS, NEO) and used in current-profile analysis. See `poloidal_component_of_pfirsch_schlueter_current_density`\
  \ for the poloidal projection and `safety_factor` for the helicity parameter governing\
  \ PS magnitude."
