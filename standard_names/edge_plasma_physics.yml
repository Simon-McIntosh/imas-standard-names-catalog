- name: toroidal_tritium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the tritium ion fluid velocity evaluated at the
    plasma boundary, the last closed flux surface separating the magnetically confined
    plasma from the open-field-line scrape-off layer.
  documentation: 'The toroidal tritium velocity at the plasma boundary gives the bulk
    rotational flow of tritium ions projected onto the toroidal direction $\hat{\phi}$,
    evaluated at the last closed flux surface where the confined plasma meets the
    scrape-off layer. This boundary value constrains the outer edge of the radial
    tritium rotation profile and reflects the balance between momentum injection,
    viscous transport across the pedestal, and ion-neutral friction at the plasma
    edge.


    The defining relation is the projection of the tritium ion fluid velocity vector
    $\mathbf{v}_T$ onto $\hat{\phi}$ at the last closed flux surface:


    $$

    v_{\phi,T}^{\rm b} = \mathbf{v}_T \cdot \hat{\phi}\Big|_{\rm LCFS}

    $$


    where $\hat{\phi}$ is the unit vector in the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ the
    major radius and $Z$ the vertical height.


    The toroidal ion velocity at the boundary is measured by charge exchange recombination
    spectroscopy (CXRS), inferring the flow from Doppler shifts of charge-exchange
    emission lines in the steep-gradient edge region. For tritium-containing plasmas,
    measurements carry additional constraints due to the radioactive nature of the
    fuel species. Edge toroidal ion velocities in tokamak plasmas range from ~1 km/s
    in L-mode to ~100 km/s in strongly heated H-mode discharges. Comparing this quantity
    with [toroidal tritium velocity at the pedestal](name:toroidal_tritium_velocity_at_pedestal)
    and [toroidal tritium velocity at the magnetic axis](name:toroidal_tritium_velocity_at_magnetic_axis)
    characterizes the full radial rotation profile; [toroidal helium-3 velocity at
    the plasma boundary](name:toroidal_helium_3_velocity_at_plasma_boundary) provides
    the analogous boundary quantity for the helium-3 species.


    Sign convention: Positive when tritium ions flow in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from the $+\hat{Z}$ direction).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
