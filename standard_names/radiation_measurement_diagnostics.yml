- name: first_coordinate_width_of_aperture
  kind: scalar
  status: draft
  description: Full width of a diagnostic channel collimating aperture along the first
    local coordinate direction (X1), applicable when the aperture has rectangular
    geometry. This is a nonnegative geometric side length equal to the physical extent
    of the clear opening, not an effective or projected width.
  documentation: 'The quantity $w_{X1}$ is the full physical width of a rectangular
    collimating aperture measured along the first local coordinate axis (X1). It is
    defined as the extent of the clear opening in the X1 direction and is strictly
    nonnegative: $w_{X1} \geq 0$. This width is the actual geometric side length of
    the aperture opening, not an effective, projected, or transmission-weighted width.


    The X1 axis belongs to a local orthonormal frame $(\hat{X1}, \hat{X2}, \hat{X3})$
    attached to the aperture. For a planar rectangular aperture the open area is $A
    = w_{X1} \times w_{X2}$, where $w_{X2}$ is the corresponding width in the second
    local coordinate direction.


    This quantity is meaningful only when the aperture geometry type is rectangular
    (geometry_type = 3). For circular apertures the relevant quantity is the aperture
    radius.


    Typical values range from fractions of a millimeter for high-resolution spectrometer
    slits to several centimeters for broad-acceptance neutron diagnostic collimators.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
