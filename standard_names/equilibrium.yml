- name: toroidal_magnetic_field_at_magnetic_axis
  kind: scalar
  status: active
  description: "Toroidal magnetic field at the magnetic axis is the signed toroidal\
    \ component of the total equilibrium magnetic field at the magnetic axis in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame. It includes externally applied\
    \ vacuum-field and plasma-current-generated contributions."
  documentation: 'Toroidal magnetic field at the magnetic axis is the signed toroidal
    component of the total equilibrium magnetic field evaluated at the magnetic axis
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. The magnetic axis is the
    locus of the equilibrium flux surface with the magnetic-axis value of poloidal
    magnetic flux. The total field includes externally produced vacuum-field and plasma-current-generated
    contributions.


    In an axisymmetric equilibrium, using the poloidal-current function $F(\psi)=R
    B_\phi$, the defining relation is


    $$

    B_{\phi,\mathrm{axis}} = \mathbf{B}_{\mathrm{total}}(R_{\mathrm{axis}}, Z_{\mathrm{axis}})
    \cdot \hat{\phi} = B_\phi(R_{\mathrm{axis}}, Z_{\mathrm{axis}}) = \frac{F(\psi_0)}{R_{\mathrm{axis}}}

    $$


    where $B_{\phi,\mathrm{axis}}$ is this quantity, $\mathbf{B}_{\mathrm{total}}$
    is the total equilibrium magnetic field, $B_\phi$ is the [toroidal magnetic field](name:toroidal_magnetic_field),
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    $\phi$, $R_{\mathrm{axis}}$ and $Z_{\mathrm{axis}}$ are the major-radius and vertical
    coordinates of the magnetic axis, $F(\psi)$ is the [poloidal-current function](name:poloidal_current_function),
    and $\psi_0$ is the [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis).


    The scope is the local magnetic-axis value for the equilibrium state; it is not
    an average over a flux surface, poloidal angle, toroidal angle, or plasma volume.
    Because it is a component, not a magnitude, it retains the sign of the toroidal
    projection and does not represent the absolute magnetic-field strength.


    This quantity is the on-axis specialization of [toroidal magnetic field](name:toroidal_magnetic_field).
    It is distinct from [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field),
    which excludes plasma-current-generated contributions, and from [toroidal reference
    magnetic field](name:toroidal_reference_magnetic_field), which denotes a prescribed
    reference field rather than the local total field at the magnetic axis even when
    numerical values coincide.


    Sign convention: Positive when the total magnetic field at the magnetic axis has
    a toroidal component in the direction of increasing toroidal angle $\phi$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: equilibrium
  links:
