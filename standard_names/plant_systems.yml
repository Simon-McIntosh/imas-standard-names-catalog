- name: vertical_velocity_of_pellet
  kind: scalar
  status: active
  description: "Vertical component of the shattered-pellet center-of-mass velocity,\
    \ resolved along the Z direction in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'This quantity is the translational velocity component of the shattered-pellet
    center of mass along the vertical direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    $$

    v_Z = \frac{dZ_{\rm cm}}{dt} = \mathbf{v}_{\rm cm} \cdot \hat{Z}

    $$


    where $Z_{\rm cm}$ is the vertical coordinate of the pellet center of mass, $t$
    is time, $\mathbf{v}_{\rm cm}$ is its velocity vector, and $\hat{Z}$ is the vertical
    unit vector. This component is distinct from the [radial velocity of the pellet](name:radial_velocity_of_pellet)
    and [toroidal velocity of the pellet](name:toroidal_velocity_of_pellet); it is
    not the total center-of-mass speed.


    Sign convention: Positive when the shattered-pellet center of mass moves toward
    increasing $Z$.'
  unit: m.s^-1
