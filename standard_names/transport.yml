    version: 4.1.0
- name: parallel_magnetic_field
  kind: scalar
  status: active
  description: Signed parallel magnetic-field component of the local total induction,
    resolved along the local equilibrium magnetic-field direction rather than a cylindrical
    axis.
  documentation: 'The parallel magnetic field $B_\parallel$ is the signed component
    of the local total [magnetic induction](name:magnetic_field) resolved along the
    local equilibrium magnetic-field direction. It represents directional field strength
    rather than the full magnetic-induction vector or its magnitude.


    The parallel component is defined by


    $$

    B_\parallel = \mathbf{B} \cdot \hat{\mathbf{b}}_{\rm eq}

    $$


    where $\mathbf{B}$ is the local total magnetic induction, $\hat{\mathbf{b}}_{\rm
    eq}$ is the unit vector in the direction of the local equilibrium magnetic field,
    and $B_\parallel$ is the resulting field-aligned component.


    This quantity is defined locally using the total magnetic induction and the local
    equilibrium-field direction. It has no restriction to a particular plasma source,
    vacuum source, physical region, or species; its aggregation convention is a pointwise
    directional projection, not a sum or average over components, modes, populations,
    or spatial regions.


    Unlike the [radial magnetic field](name:radial_magnetic_field), [toroidal magnetic
    field](name:toroidal_magnetic_field), and [vertical magnetic field](name:vertical_magnetic_field),
    it is resolved along the local equilibrium field rather than along an axis of
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height. Unlike the [parallel wave magnetic
    field](name:parallel_wave_magnetic_field), it is not restricted to an oscillatory
    wave perturbation. It is the field-aligned projection of the parent [magnetic
    induction](name:magnetic_field).


    Sign convention: Positive when the local total magnetic induction has a component
    in the direction of the local equilibrium magnetic-field unit vector.'
  unit: T
  physics_domain: transport
  links:
  - name:radial_magnetic_field
  - name:toroidal_magnetic_field
  - name:vertical_magnetic_field
  sources:
  - kind: imas-dd
    ref: edge_profiles/ggd/b_field/parallel
    version: 4.1.0
  - kind: imas-dd
    ref: plasma_profiles/ggd/b_field/parallel
    version: 4.1.0
- name: ratio_of_line_averaged_electron_density_to_greenwald_density
  kind: scalar
  status: active
  description: Dimensionless Greenwald fraction comparing the electron number density
    averaged along a plasma chord with the empirical density limit set by plasma current
    and effective minor radius.
  documentation: 'The Greenwald fraction measures the proximity of a confined plasma''s
    line-averaged electron density to its empirical Greenwald density limit.


    It is defined by:


    $$

    f_G = \frac{\bar{n}_e}{n_G}

    $$


    where $f_G$ is the Greenwald fraction, $\bar{n}_e$ is the [line-averaged electron
    density](name:line_averaged_electron_density), and $n_G$ is the [Greenwald density](name:greenwald_density)
    determined from the plasma-current magnitude and effective minor radius.


    The numerator represents the electron population averaged along a plasma chord;
    the denominator is the empirical density reference for the confined plasma. This
    quantity is a global normalized ratio, not a local electron density, a density
    limit itself, or an average over charge states or spatial regions.


    The fraction is the direct normalization of line-averaged electron density by
    Greenwald density: values near unity indicate proximity to the empirical reference
    limit, while values above or below unity indicate a line-averaged density respectively
    above or below that reference.'
  unit: '1'
  physics_domain: transport
  links:
  - name:line_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/greenwald_fraction/value
    version: 4.1.0
- name: ratio_of_line_averaged_hydrogen_density_to_line_averaged_total_hydrogenic_density
  kind: scalar
  status: active
  description: Dimensionless line-averaged protium fraction among hydrogenic ions,
    obtained by dividing the protium density by the total hydrogenic density along
    the same chord.
  documentation: 'This quantity is the fraction of hydrogenic ion content carried
    by protium along a specified chord through the plasma. It is a ratio of consistently
    line-averaged densities, rather than a local fraction or a volume-averaged fraction.


    $$

    f_{\rm H}^{\rm line} = \frac{\bar{n}_{\rm H}^{\rm line}}{\bar{n}_{\rm H}^{\rm
    line}+\bar{n}_{\rm D}^{\rm line}+\bar{n}_{\rm T}^{\rm line}}

    $$


    where $f_{\rm H}^{\rm line}$ is the line-averaged protium fraction, $\bar{n}_{\rm
    H}^{\rm line}$ is the line-averaged protium-ion number density, $\bar{n}_{\rm
    D}^{\rm line}$ is the corresponding deuterium-ion number density, and $\bar{n}_{\rm
    T}^{\rm line}$ is the corresponding tritium-ion number density. The symbols H,
    D, and T denote protium, deuterium, and tritium, respectively.


    The quantity applies to the hydrogenic ion population along one common chord and
    aggregates the isotope densities through the total hydrogenic denominator. Neutral
    atomic hydrogen and non-hydrogenic species are excluded. The numerator is the
    [line-averaged hydrogen density](name:line_averaged_hydrogen_density), while the
    denominator is the [total hydrogenic density](name:total_hydrogenic_density) under
    the same line-averaging convention.


    This ratio differs from the [ratio of volume-averaged hydrogen density to volume-averaged
    total hydrogenic density](name:ratio_of_volume_averaged_hydrogen_density_to_volume_averaged_total_hydrogenic_density),
    because the latter uses volume-averaged rather than chord-averaged isotope densities.'
  unit: '1'
  physics_domain: transport
  links:
  - name:line_averaged_hydrogen_density
  arguments:
  - name: line_averaged_hydrogen_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  sources:
  - kind: imas-dd
    ref: summary/line_average/isotope_fraction_hydrogen/value
    version: 4.1.0
- name: ratio_of_total_ion_density_to_electron_density
  kind: scalar
  status: active
  description: Dimensionless ratio of total ion number density, summed over all ion
    species and charge states, to local electron number density including thermal
    and non-thermal electrons.
  documentation: 'The ion-to-electron density ratio compares the total particle count
    density of ions with the local particle count density of electrons. It is a composition
    and quasi-neutrality indicator based on particle counts, not on charge-weighted
    positive and negative densities.


    $$

    \mathcal{R}_{i/e} = \frac{n_{i,\mathrm{tot}}}{n_e}

    $$


    where $\mathcal{R}_{i/e}$ is the ion-to-electron density ratio, $n_{i,\mathrm{tot}}$
    is the [total ion density](name:total_ion_number_density) summed over all represented
    ion species and charge states, including thermal and non-thermal ions, and $n_e$
    is the local electron number density including thermal and non-thermal electrons.


    The quantity applies locally at a plasma point and uses total aggregation in the
    numerator rather than a species-specific or charge-state-resolved ion density.
    It is not a charge density ratio and does not weight ions by their charge; consequently,
    it is distinct from [effective charge](name:effective_charge), which characterizes
    a charge-weighted ionic mixture.


    The ratio is obtained by dividing the aggregated total ion density by the electron
    density, so it equals unity when those two particle number densities are equal.
    Its departure from unity describes the difference between total ion and electron
    counts and must not be interpreted alone as a direct charge-neutrality residual.'
  unit: '1'
  physics_domain: transport
  links:
  - name:effective_charge
  sources:
  - kind: imas-dd
    ref: core_profiles/profiles_1d/n_i_total_over_n_e
    version: 4.1.0
  - kind: imas-dd
    ref: core_profiles/profiles_2d/n_i_total_over_n_e
    version: 4.1.0
  - kind: imas-dd
