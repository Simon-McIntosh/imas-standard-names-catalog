- name: atomic_physics_data_entry_run_number
  kind: scalar
  status: draft
  description: Integer run number identifying the active version of an atomic-physics
    data release.
  documentation: The run number selects a specific version within a given shot entry
    of the atomic, molecular, and nuclear surface (AMNS) data catalog. Each release
    of reaction-rate coefficients, cross-sections, or stopping powers is stored under
    a unique run number so that downstream transport or spectroscopy workflows can
    pin to a reproducible dataset. The companion identifier is the [shot number](name:atomic_physics_data_entry_shot_number),
    which encodes the species via $\text{shot} = A \times 1000 + Z$ where $A$ is the
    mass number and $Z$ is the nuclear charge. Run numbers are positive integers starting
    at 1; higher values denote later revisions of the underlying atomic data.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: data_entry_pulse_number
  kind: scalar
  status: draft
  description: Integer identifier of the experimental pulse (shot) to which the stored
    data record pertains.
  documentation: The pulse number is the primary experimental identifier assigned
    sequentially by the facility control system to each plasma discharge or operational
    cycle. It serves as the top-level key for retrieving all time-dependent and static
    data associated with a single experiment. In multi-machine databases the pulse
    number is combined with a machine identifier and a [run number](name:data_entry_run_number)
    to form a unique data-entry reference. Values start at 1 and can exceed $10^5$
    on long-running devices. Parent-entry pulse numbers link derived or reprocessed
    datasets back to the originating discharge.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: data_entry_run_number
  kind: scalar
  status: draft
  description: Dimensionless integer identifying a specific run within a data entry,
    used to version datasets under the same pulse number.
  documentation: The run number is an integer index that, together with the pulse
    (shot) number, uniquely identifies a stored dataset. Different runs under the
    same pulse number represent successive processing stages, code versions, or analysis
    variants (e.g., initial automated reconstruction vs. validated expert result).
    The run number is recorded both for the current data entry and, where applicable,
    for parent entries from which the data were derived. Conventions for run-number
    allocation are facility-specific but are required to be monotonically increasing
    for a given pulse. See also [data_entry_pulse_number](name:data_entry_pulse_number)
    and [amns_data_entry_run_number](name:amns_data_entry_run_number).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  links: []
  validity_domain: ''
  constraints: []
- name: equilibrium_ids_occurrence_index
  kind: scalar
  status: draft
  description: Dimensionless integer selecting which occurrence of the equilibrium
    data set is used as input by a dependent diagnostic or code.
  documentation: When multiple equilibrium reconstructions coexist in the same database
    entry (e.g., different reconstruction codes or time-resolution variants), the
    occurrence index distinguishes them. A value of 0 selects the default occurrence.
    Downstream consumers such as Langmuir-probe analysis reference this index to ensure
    they use the correct magnetic geometry. Combined with [data_entry_pulse_number](name:data_entry_pulse_number)
    and [data_entry_run_number](name:data_entry_run_number), the triplet (pulse, run,
    occurrence) fully resolves an equilibrium source. The field is always a non-negative
    integer.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: pulse_begin_epoch_seconds
  kind: scalar
  status: draft
  description: Elapsed whole seconds since the Unix epoch (1970-01-01 00:00:00 UTC)
    at the start of the experimental pulse.
  documentation: This integer-valued quantity records the absolute wall-clock time
    at which the pulse begins, expressed as the number of whole seconds since the
    Unix epoch (January 1, 1970, 00:00:00 UTC). Together with the corresponding nanosecond
    field, it provides sub-second absolute timing for the pulse. Absolute timestamps
    are essential for correlating data across independent acquisition systems, linking
    to facility logs, and archiving in long-term databases. The DD unit is dimensionless
    (`1`) because the value is a counter of elapsed SI seconds rather than a physical
    duration. See also [pulse_begin_epoch_nanoseconds](name:pulse_begin_epoch_nanoseconds),
    [pulse_end_epoch_seconds](name:pulse_end_epoch_seconds), and [pulse_number](name:pulse_number).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  links: []
  validity_domain: ''
  constraints: []
- name: pulse_end_epoch_nanoseconds
  kind: scalar
  status: draft
  description: Sub-second nanosecond remainder of the pulse end time relative to the
    whole-second Unix epoch timestamp.
  documentation: This field supplies the fractional-second part (in nanoseconds) of
    the absolute pulse termination instant. The complete pulse-end time is $t_{\mathrm{end}}
    = \mathrm{seconds} + \mathrm{nanoseconds} \times 10^{-9}$, where seconds is given
    by [pulse_end_epoch_seconds](name:pulse_end_epoch_seconds). Values are integers
    in $[0, 999\,999\,999]$. Together with the begin-epoch pair, the pulse duration
    is fully determined at nanosecond precision without floating-point rounding. See
    also [pulse_begin_epoch_nanoseconds](name:pulse_begin_epoch_nanoseconds) for the
    start-time counterpart.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pulse_end_epoch_seconds
  kind: scalar
  status: draft
  description: Elapsed whole seconds since the Unix epoch (1970-01-01 00:00:00 UTC)
    at the end of the experimental pulse.
  documentation: The pulse-end epoch seconds field records the integer part of the
    absolute wall-clock time at which the pulse terminates. Combined with [pulse_end_epoch_nanoseconds](name:pulse_end_epoch_nanoseconds),
    it provides nanosecond-resolution absolute timing. The difference $t_{\mathrm{end}}
    - t_{\mathrm{begin}}$ (using the corresponding begin fields) yields the total
    pulse duration in seconds. For present-day tokamaks, pulse durations range from
    a few seconds (short-pulse devices) to thousands of seconds (long-pulse superconducting
    machines). The unit is dimensionless (integer count of seconds since epoch). See
    also [pulse_begin_epoch_seconds](name:pulse_begin_epoch_seconds).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: pulse_number
  kind: scalar
  status: draft
  description: Dimensionless integer uniquely identifying an experimental pulse (shot)
    within a facility's data catalog.
  documentation: 'The pulse number (also called shot number) is the primary key used
    by all major fusion facilities to catalog and retrieve experimental data. Each
    device assigns sequential integers; for example, JET pulses exceed 100 000 and
    ITER will use a separate numbering series. In the data model, `pulse_number` together
    with [data_entry_run_number](name:data_entry_run_number) uniquely specifies a
    dataset record: the pulse identifies the experiment and the run distinguishes
    processing versions. The value is always a positive integer despite being stored
    with a dimensionless unit annotation.'
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: simulation_time_begin
  kind: scalar
  status: draft
  description: Physical time at which the simulation starts, referenced to the common
    machine or simulation time origin.
  documentation: "The simulation begin time $t_{\\mathrm{begin}}$ marks the first\
    \ physical instant from which a simulation or workflow component computes results.\
    \ It is expressed in seconds relative to the same epoch used by all time-dependent\
    \ data in the modeling chain (commonly the pulse reference time). For predictive\
    \ transport runs, $t_{\\mathrm{begin}}$ is often set to the flat-top onset ($\\\
    approx 1$\u2013$5$ s into the pulse) so that equilibrium and heating sources are\
    \ well established. Combined with [simulation_time_step](name:simulation_time_step),\
    \ the full time grid of a constant-step simulation is $t_k = t_{\\mathrm{begin}}\
    \ + k\\,\\Delta t$. See also [pulse_begin_epoch_seconds](name:pulse_begin_epoch_seconds)\
    \ for the absolute epoch reference."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - integrated-modeling
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: simulation_time_step
  kind: scalar
  status: draft
  description: Constant time interval between successive main steps (e.g., storage
    or advance steps) in a plasma simulation.
  documentation: "The simulation time step $\\Delta t_{\\mathrm{sim}}$ defines the\
    \ fixed temporal spacing between consecutive outputs or solver advances in an\
    \ integrated-modeling workflow. When constant, it governs the Courant\u2013Friedrichs\u2013\
    Lewy (CFL) condition for explicit transport solvers: $\\Delta t < \\Delta x^2\
    \ / (2D)$, where $\\Delta x$ is the spatial grid spacing and $D$ is the dominant\
    \ diffusivity. Values range from $10^{-7}$\u2013$10^{-4}$ s for MHD codes to $10^{-3}$\u2013\
    $1$ s for transport-timescale integrated-modeling suites. This field is only meaningful\
    \ when the time step is uniform; adaptive-step codes may leave it unset. See also\
    \ [simulation_time_begin](name:simulation_time_begin) for the starting instant\
    \ of the run."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - integrated-modeling
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
- name: statistics_time_averaging_interval_width
  kind: scalar
  status: draft
  description: Duration of the time window over which time-dependent quantities have
    been averaged; empty if no averaging was performed.
  documentation: When time-dependent data are stored as time-averaged values rather
    than instantaneous samples, this scalar records the width $\Delta t$ (in seconds)
    of the averaging interval. By convention, the averaging window is centered on
    (or starts at) the associated time coordinate. A non-zero $\Delta t$ indicates
    that short-timescale fluctuations below $\sim 1/\Delta t$ are suppressed in the
    stored profiles. This metadata field is essential for comparing data sets produced
    with different averaging windows, particularly in integrated-modeling workflows
    where profile data from multiple sources must be temporally aligned. Values range
    from sub-millisecond (for fast diagnostic snapshots) to hundreds of milliseconds
    (for steady-state phase averages). See also [pulse_begin_epoch_seconds](name:pulse_begin_epoch_seconds)
    for absolute timing context.
  unit: s
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
