- name: normalized_charge
  kind: scalar
  status: draft
  description: Species electric charge normalized to the simulation reference charge,
    yielding a dimensionless parameter for gyrokinetic flux-tube simulations.
  documentation: 'The normalized charge $\hat{Z}_s = Z_s e / Q_{\mathrm{ref}}$ rescales
    the physical species charge $Z_s e$ by a reference charge $Q_{\mathrm{ref}}$ defined
    by the simulation, making it dimensionless. It enters the gyrokinetic equations
    through the Lorentz force and the species contribution to the quasineutrality
    condition, coupling the electrostatic potential to the perturbed density. In gyrokinetic
    codes, $\hat{Z}_s$ is unity for the reference species (typically the main ion)
    and varies for impurities and electron populations, enabling a unified treatment
    of all species. The same normalization scheme is applied to [normalized_mass](name:normalized_mass)
    and [normalized_density](name:normalized_density), with which it shares the simulation
    reference quantities.


    Sign convention: Positive when the species charge $Z_s e$ has the same sign as
    the reference charge $Q_{\mathrm{ref}}$.


    Typical values range from $-1$ (for electrons when the reference is the main ion
    charge) up to $+6$ for fully stripped carbon impurities. The quantity is always
    dimensionless and scale-invariant under changes to the reference charge normalization.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_mass
  - name:normalized_density
  sources:
  - id: dd:gyrokinetics/species/charge_norm
    dd_path: gyrokinetics/species/charge_norm
    status: composed
- name: normalized_growth_rate
  kind: scalar
  status: draft
  description: Normalized linear growth rate of a gyrokinetic eigenmode, quantifying
    the exponential instability drive at a specified wavevector.
  documentation: 'The normalized growth rate $\gamma_{\mathrm{norm}} = \gamma / \omega_{\mathrm{ref}}$
    is the dimensionless imaginary part of the linear gyrokinetic eigenvalue, characterizing
    how rapidly a microinstability amplifies in time. Here $\gamma$ is the dimensional
    growth rate and $\omega_{\mathrm{ref}} = v_{\mathrm{th}} / R$ is a reference frequency
    set by the thermal velocity $v_{\mathrm{th}}$ and major radius $R$. A positive
    value indicates an unstable mode (e.g., ion temperature gradient (ITG), trapped
    electron mode (TEM), or electron temperature gradient (ETG) instability), driving
    turbulent transport. Negative values indicate damping. In local gyrokinetic codes,
    $\gamma_{\mathrm{norm}}$ is obtained by solving the linear eigenvalue problem
    at each perpendicular wavevector $(k_x, k_y)$ and is used to compute quasilinear
    transport estimates from the mixing-length rule. Typical values range from $10^{-3}$
    to $10^{-1}$ for drift-wave instabilities in core tokamak plasmas. The companion
    quantity `[normalized_frequency](name:normalized_frequency)` gives the real oscillation
    frequency; together they specify the full linear mode structure. See also `[normalized_shearing_rate](name:normalized_shearing_rate)`
    for flow shear effects and `[normalized_time](name:normalized_time)` for averaging
    in nonlinear runs.


    Sign convention: Positive when the eigenmode amplitude grows exponentially in
    time.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_frequency
  - name:normalized_shearing_rate
  - name:normalized_time
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/growth_rate_norm
    dd_path: gyrokinetics/wavevector/eigenmode/growth_rate_norm
    status: attached
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/growth_rate_norm
