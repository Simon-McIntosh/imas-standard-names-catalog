- name: nitrogen_density
  kind: scalar
  status: active
  description: Number density of nitrogen nuclei is the local count of nitrogen atomic
    nuclei per plasma volume, summed over all charge states from neutral through fully
    stripped nitrogen.
  documentation: 'Number density of nitrogen nuclei is the local count of nitrogen
    atomic nuclei per plasma volume. It is a species-level elemental density, so neutral
    nitrogen and every ionized nitrogen charge state are included.


    The charge-state aggregation is defined by


    $$

    n_N = \sum_{z=0}^{7} n_{N,z}

    $$


    where $n_N$ is the nitrogen density, $n_{N,z}$ is the number density of nitrogen
    nuclei in charge state $z$, $z=0$ denotes neutral nitrogen, and $z=7$ denotes
    fully stripped nitrogen because nitrogen has atomic number $7$.


    This quantity is local and is distinct from [line-averaged nitrogen density](name:line_averaged_nitrogen_density)
    and [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density),
    which are spatial averages of the same charge-state-summed species density. In
    the absence of a population qualifier, the density includes thermal, fast, and
    other nonthermal nitrogen nuclei.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_nitrogen_density
  - name:volume_averaged_nitrogen_density
- name: line_averaged_nitrogen_density
  kind: scalar
  status: active
  description: Line-averaged number density of all nitrogen nuclei along a specified
    plasma chord, summed over every ionization state from neutral through fully stripped
    nitrogen.
  documentation: 'Line-averaged nitrogen density is the chord-length average of the
    local number density of all nitrogen nuclei, including every nitrogen ionization
    state from neutral nitrogen through fully stripped nitrogen.


    The line average is defined by


    $$

    \overline{n}_N = \frac{1}{L}\int_0^L n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local charge-state-summed nitrogen density defined by
    [nitrogen density](name:nitrogen_density), $\ell$ is distance along the specified
    chord, and $L$ is the total chord length.


    This quantity is the chord-integrated nitrogen inventory divided by chord length,
    so it preserves the density dimension while removing variation along the chord.
    It is distinct from the spatially averaged [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density),
    which averages over the plasma volume rather than a chord.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nitrogen_density
  - name:volume_averaged_nitrogen_density
  arguments:
  - name: nitrogen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/nitrogen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-nitrogen-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/n_i/nitrogen
      parent: Nitrogen
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Nitrogen.
      kind: template
- name: oxygen_density
  kind: scalar
  status: active
  description: Total number density of oxygen atoms and ions across all charge states,
    from neutral to fully stripped, giving the local oxygen impurity concentration
    at a point in the plasma.
  documentation: "The local oxygen number density $n_\\mathrm{O}$ quantifies the total\
    \ concentration of oxygen impurity per unit plasma volume, encompassing neutral\
    \ atomic oxygen and all ionic charge states up to fully stripped O$^{8+}$. Oxygen\
    \ is a ubiquitous low-Z impurity in fusion devices, entering through wall outgassing\
    \ and vessel conditioning; it contributes to radiative power losses and dilutes\
    \ the hydrogenic fuel inventory.\n\nThe total oxygen density is defined as the\
    \ sum over all ionization states:\n\n$$\nn_\\mathrm{O} = \\sum_{Z=0}^{8} n_{\\\
    mathrm{O}^{Z+}}\n$$\n\nwhere $n_{\\mathrm{O}^{Z+}}$ is the number density of oxygen\
    \ in charge state $Z^+$, with $Z$ ranging from 0 (neutral) to 8 (fully stripped).\n\
    \nThe local density is inferred from passive extreme-ultraviolet spectroscopy,\
    \ charge-exchange recombination spectroscopy, and soft X-ray emission tomography.\
    \ Spatially averaged forms include [line_averaged_oxygen_density](name:line_averaged_oxygen_density)\
    \ (chord integral divided by chord length) and [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ (integral over the plasma volume). The dimensionless oxygen_fraction relates\
    \ this local density to the electron density as an impurity concentration measure.\n\
    \nIn well-conditioned fusion plasmas the core oxygen density is a small fraction\
    \ of the electron density; edge concentrations of $10^{15}$\u2013$10^{17}$ m$^{-3}$\
    \ are representative of limiter and divertor configurations.\n\nSign convention:\
    \ Positive when oxygen atoms or ions are present in the plasma volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_oxygen_density
  - name:volume_averaged_oxygen_density
- name: line_averaged_oxygen_density
  kind: scalar
  status: active
  description: Line-of-sight average of the total oxygen impurity number density,
    encompassing all charge states from neutral to fully stripped, divided by the
    chord length.
  documentation: "The line-averaged oxygen density is the chord-mean of the local\
    \ oxygen number density\u2014summed over all charge states from neutral O$^0$\
    \ through fully stripped O$^{8+}$\u2014along a measurement path through the plasma.\
    \ It characterizes the mean impurity concentration of oxygen along a given line\
    \ of sight and is directly related to the local [oxygen_density](name:oxygen_density)\
    \ integrated along the chord.\n\nThe defining relation is:\n\n$$\n\\langle n_O\
    \ \\rangle_\\ell = \\frac{1}{L} \\int_0^L n_O(\\ell) \\, d\\ell\n$$\n\nwhere $n_O(\\\
    ell)$ is the local oxygen number density at position $\\ell$ along the chord and\
    \ $L$ is the chord length in m.\n\nLine-averaged impurity densities are extracted\
    \ from chord-integrated spectroscopic measurements of oxygen emission lines combined\
    \ with ionization balance models. Passive spectroscopy of ultraviolet oxygen transitions\
    \ or charge-exchange recombination spectroscopy of helium-like and hydrogen-like\
    \ oxygen lines provides the chord-integrated signal from which the line-averaged\
    \ density is inferred. As a chord-averaged observable, spatial resolution is inherently\
    \ limited, and tomographic inversion or profile modeling is required to recover\
    \ local distributions.\n\nOxygen is a low-concentration impurity in fusion plasmas\
    \ under normal operating conditions; line-averaged values fall several orders\
    \ of magnitude below the electron density, with representative ranges of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ depending on wall conditioning and impurity seeding. The [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ provides the plasma-volume\u2013weighted counterpart, while analogous chord-averaged\
    \ densities for other impurity species include [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)\
    \ and [line_averaged_carbon_density](name:line_averaged_carbon_density).\n\nSign\
    \ convention: Positive when oxygen impurity particles are present along the measurement\
    \ chord at nonzero concentration."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:oxygen_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_carbon_density
  arguments:
  - name: oxygen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/oxygen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-oxygen-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/n_i/oxygen
      parent: Oxygen
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Oxygen.
      kind: template
- name: pressure_of_mass_spectrometer_channel
  kind: scalar
  status: active
  description: Calibrated pressure-equivalent assigned to a resolved measurement channel,
    representing a channel-specific gas-pressure contribution without requiring a
    unique neutral species.
  documentation: 'This quantity is a calibrated pressure-equivalent associated with
    one resolved channel response. It represents the gas-pressure contribution assigned
    to that channel from detected ions, while remaining an instrument-response quantity
    rather than necessarily the partial pressure of a unique neutral species.


    The channel-specific calibration maps the detected ion response to a pressure-equivalent
    value; the calibration convention defines that mapping and no universal kinetic-pressure
    equation applies. Accordingly, this quantity must not be interpreted as the charge-state-resolved
    kinetic pressure [ion_charge_state_pressure](name:ion_charge_state_pressure) unless
    the calibration explicitly establishes that equivalence.


    The representative channel-resolved instance is [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).
    Contributions may be compared with the associated [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel),
    but the pressure-equivalent is not itself an ion-current measurement.'
  unit: Pa
  physics_domain: particle_measurement_diagnostics
  links:
  - name:ion_charge_state_pressure
  - name:neutral_pressure_of_mass_spectrometer_channel
  - name:ion_current_of_mass_spectrometer_channel
- name: neutral_pressure_of_mass_spectrometer_channel
  kind: scalar
  status: active
  description: Neutral pressure of a mass-spectrometer channel is the calibrated neutral-gas
    pressure equivalent assigned to a selected mass-to-charge channel. It denotes
    a channel-resolved neutral contribution and does not require correspondence to
    a unique neutral species.
  documentation: 'Neutral pressure of a mass-spectrometer channel is the calibrated
    neutral-gas pressure equivalent assigned to one mass-discriminated channel of
    a mass spectrometer. The channel denotes a response in mass-to-charge space after
    ionization, so the quantity is a pressure equivalent for neutrals that can contribute
    to that channel, not a pressure of the detected ions.


    This quantity is neutral in scope: it excludes charged-particle plasma pressure,
    electron pressure, and any pressure contribution not represented as neutral gas
    before ionization. It is the neutral-specific counterpart of [pressure of a mass-spectrometer
    channel](name:pressure_of_mass_spectrometer_channel).


    A channel value need not be the thermodynamic partial pressure of a single species,
    because fragmentation, isotopologues, charge states of produced ions, and isobaric
    species can overlap in the same mass-to-charge channel. Summing channel values
    represents [total neutral pressure](name:total_neutral_pressure) only when the
    calibrated channels are non-overlapping, span the neutral mixture being represented,
    and treat cross-sensitivities consistently.'
  unit: Pa
  physics_domain: particle_measurement_diagnostics
  links:
  - name:pressure_of_mass_spectrometer_channel
  arguments:
  - name: pressure_of_mass_spectrometer_channel
    operator: neutral
    operator_kind: qualifier
  sources:
  - dd_path: spectrometer_mass/channel/pressure_partial
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_mass.html#spectrometer_mass-channel-pressure_partial
    dd_documentation:
      leaf: Partial pressure (calibrated data)
      parent_path: spectrometer_mass/channel
