    of the coil's conductor or winding pack cross-section, measured from the geometric
    center of the annular cross-section to a specified boundary of the conducting
    material. For an annular winding pack, the principal instance attested is the
    bore-side boundary distance, captured by [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil),
    which represents the non-negative distance from the annulus center to the inward,
    plasma-facing edge of the conducting material. The radial thickness of the winding
    pack follows from the difference between the outer and inner boundary radii, and
    together with the [area_of_toroidal_field_coil](name:area_of_toroidal_field_coil)
    and coil current, these dimensions support estimates of average engineering current
    density and structural load analysis. Radial dimensions are defined in the plane
    perpendicular to the local coil centerline, consistent with the Frenet-Serret
    frame used for [binormal_coordinate_of_toroidal_field_coil](name:binormal_coordinate_of_toroidal_field_coil)
    and related cross-section geometry. An analogous radial boundary quantity for
    non-axisymmetric error-field coils is [inner_radius_of_correction_coil](name:inner_radius_of_correction_coil).
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:inner_radius_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:inner_radius_of_correction_coil
- name: inner_radius_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Inner radius of a toroidal field coil is the bore-side radius of an
    annular conductor or winding-pack cross-section, measured from the geometric center
    of that cross-section to its inner boundary.
  documentation: 'Inner radius of a toroidal field coil is the non-negative radial
    distance in the local cross-sectional plane normal to the local conductor or winding-pack
    centerline, from the geometric center of an annular toroidal-field-coil cross-section
    to its bore-side inner boundary. It defines the bore size of the annular cross-section,
    not the spatial location of the coil.


    For an annular cross-section with circular inner and outer boundaries, the conducting
    or winding-pack cross-sectional area satisfies:


    $$

    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)

    $$


    where $A$ is the annular cross-sectional area in square meters, $r_\mathrm{inner}$
    is this inner radius in meters, and $r_\mathrm{outer}$ is the corresponding outer
    radius in meters.


    The quantity is defined for hollow annular conductor or winding-pack cross-sections
    and obeys $0 \le r_\mathrm{inner} < r_\mathrm{outer}$; the limiting value $r_\mathrm{inner}=0$
    represents a solid circular cross-section treated as an annulus with no bore.
    It is the inner-boundary member of the toroidal-field-coil cross-section radius
    family: outer_radius_of_toroidal_field_coil gives the outer boundary, while [radius_of_toroidal_field_coil](name:radius_of_toroidal_field_coil)
    denotes a generic non-negative cross-section radius not tied specifically to the
    bore-side boundary.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_toroidal_field_coil
  arguments:
  - name: radius_of_toroidal_field_coil
    operator: inner
    operator_kind: qualifier
  sources:
  - dd_path: tf/coil/conductor/cross_section/radius_inner
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-coil-conductor-cross_section-radius_inner
    dd_documentation:
