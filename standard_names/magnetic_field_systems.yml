    operator: coordinate
    operator_kind: coordinate
    axis: vertical
    shape: coordinate
  sources:
  - id: dd:ferritic/object/centroid/z
    dd_path: ferritic/object/centroid/z
    status: composed
- name: vertical_coordinate_of_plasma_facing_component_outline_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of a point on the outline contour of a plasma-facing
    component cross-section in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z$ locates each vertex or sample point
    of the closed polygonal outline that defines the poloidal cross-section of a plasma-facing
    component (first-wall tile, limiter, divertor target, or similar structural element).
    Together with the corresponding major-radius coordinate, it fully specifies the
    two-dimensional shape of the component in the poloidal plane, enabling calculation
    of wetted areas, heat-load profiles, and shadow geometries. Typical $Z$ values
    for divertor targets range from $-2$ m to $-0.5$ m, while first-wall panels may
    span the full machine height of roughly $-3$ m to $+3$ m depending on device size.
    The outline is sampled as an ordered sequence of $(R, Z)$ pairs forming a closed
    or open contour; this quantity is the $Z$ element of each pair. It is part of
    the two-component [coordinate_of_plasma_facing_component_outline_point](name:coordinate_of_plasma_facing_component_outline_point)
    vector. Analogous geometry is described for other machine structures by [vertical_coordinate_of_annular_outer_outline_point](name:vertical_coordinate_of_annular_outer_outline_point)
    and [vertical_coordinate_of_plasma_current_element_outline_point](name:vertical_coordinate_of_plasma_current_element_outline_point).


    Sign convention: Positive when the outline point lies above the machine midplane,
    in the direction of increasing $Z$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:coordinate_of_plasma_facing_component_outline_point
  - name:vertical_coordinate_of_annular_outer_outline_point
  - name:vertical_coordinate_of_plasma_current_element_outline_point
  constraints: []
  arguments:
