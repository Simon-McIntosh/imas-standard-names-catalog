- name: per_toroidal_mode_thermal_ion_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power density on thermal ions, resolved per toroidal
    Fourier mode number in the poloidal plane.
  documentation: The volumetric power density $P_{n_\phi}(R,Z)$ absorbed from a coherent
    wave by the Maxwellian thermal ion population, decomposed into individual toroidal
    Fourier mode contributions. Each mode amplitude $P_{n_\phi}$ is obtained by projecting
    the 3-D wave field onto the toroidal eigenfunction $e^{in_\phi\phi}$, where $n_\phi$
    is the toroidal mode number (dimensionless). The quantity satisfies $P_\text{total}(R,Z)
    = \sum_{n_\phi} P_{n_\phi}(R,Z)$, recovering the total absorbed power density
    when summed over all modes. Typical values for ICRH-relevant scenarios range from
    $10^5\,\text{W}\text{m}^{-3}$ in the core to $10^2\,\text{W}\text{m}^{-3}$ at
    the edge, depending on launched power and resonance location. The power density
    is computed by full-wave or ray-tracing codes that track the wave propagation
    and damping along the ray path. Related quantities include the flux-surface-averaged
    version [per_toroidal_mode_thermal_ion_power_density_flux_surface_average](name:per_toroidal_mode_power_density)
    and the resolved per-species deposition for fast ions [per_toroidal_mode_fast_ion_power_density](name:per_toroidal_mode_fast_ion_power_density).
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_power_density
  - name:per_toroidal_mode_fast_ion_power_density
  sources:
