name: vertical_component_of_diamagnetic_current_density
description: Projection of the diamagnetic current density onto the vertical ($Z$)
  axis in cylindrical coordinates.
documentation: "The diamagnetic current density arises from the pressure gradient\
  \ perpendicular to the magnetic field and is given by $\\mathbf{j}_{\\rm dia} =\
  \ (\\mathbf{B} \\times \\nabla p) / B^2$, where $p$ is the total plasma pressure\
  \ (in Pa) and $\\mathbf{B}$ is the magnetic field (in T). Its vertical component\
  \ $j_{\\rm dia,Z} = \\mathbf{j}_{\\rm dia} \\cdot \\hat{Z}$ captures the up-down\
  \ asymmetry of perpendicular currents important for equilibrium force balance and\
  \ Shafranov shift calculations. Typical magnitudes in the core of a medium-size\
  \ tokamak are $10^4$\u2013$10^6$ A/m$^2$, scaling with the pressure gradient and\
  \ inverse field strength. This component is resolved on GGD meshes and enters the\
  \ curl of the magnetic field via Amp\xE8re's law. It is computed from pressure and\
  \ magnetic-field profiles provided by equilibrium reconstruction or transport codes."
kind: vector_component
unit: A.m^-2
