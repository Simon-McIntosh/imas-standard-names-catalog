name: plasma_inductance
status: draft
description: Effective plasma inductance defined as $L_p = 2 E_{\mathrm{mag}} / I_p^2$,
  relating the stored poloidal magnetic energy to the total plasma current.
documentation: The plasma inductance $L_p$ is computed from $L_p = 2 E_{\mathrm{mag}}
  / I_p^2$, where $E_{\mathrm{mag}} = \frac{1}{2} \int \psi \, j_\phi \, dS$ is the
  poloidal magnetic energy (with $\psi$ the poloidal flux, $j_\phi$ the toroidal current
  density, and the integral taken over the plasma poloidal cross-section) and $I_p$
  is the total plasma current in amperes. This quantity combines the internal inductance
  $l_i$ contribution (current-profile shape) and the external geometric contribution.
  Typical values range from $0.5$ to $5\;\mu\mathrm{H}$ depending on device size and
  current profile; for ITER-class plasmas $L_p \approx 10\;\mu\mathrm{H}$. It is derived
  from equilibrium reconstruction and governs the inductive voltage balance $V_{\mathrm{loop}}
  = L_p \, dI_p/dt + R_p I_p + \dots$ relevant for plasma current ramp-up and ramp-down
  control. See also `plasma_current`, `poloidal_magnetic_flux`, and `elongation_of_plasma_boundary`.
