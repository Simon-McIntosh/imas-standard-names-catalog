name: neutral_pressure_scrape_off_layer
status: draft
cocos_transformation_type: one_like
description: Kinetic pressure of neutral particles in the scrape-off layer, dominated
  by recycled and gas-puffed atomic and molecular hydrogen species.
documentation: "The neutral pressure in the SOL, $p_{n,\\rm SOL}$, represents the\
  \ thermal kinetic pressure of un-ionized atoms and molecules (primarily $\\text{H}$,\
  \ $\\text{D}$, $\\text{T}$, and their molecular forms) residing outside the last\
  \ closed flux surface. It is defined as $p_n = n_n k_B T_n$, where $n_n$ is the\
  \ neutral number density and $T_n$ the neutral temperature (often approximated by\
  \ the Franck\u2013Condon dissociation energy of $\\sim$2\u20133 eV for molecular\
  \ dissociation products, or the wall/divertor surface temperature for thermalized\
  \ neutrals). Typical values span $10^{-2}$\u2013$10^{1}$ Pa, with higher values\
  \ near the divertor strike points and gas-puff ports. Measured by baratron or ionization\
  \ gauges positioned in the divertor or main-chamber sub-divertor regions, or inferred\
  \ from $\\text{H}_\\alpha$/$\\text{D}_\\alpha$ emission calibrated against neutral\
  \ transport codes (e.g., EIRENE). This quantity directly influences the fueling\
  \ efficiency and SOL opacity to neutrals. See also `scrape_off_layer_radiated_power`\
  \ and `electron_pressure_at_separatrix`."
