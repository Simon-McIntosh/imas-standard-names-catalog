name: coulomb_logarithm_at_pedestal_top
status: draft
cocos_transformation_type: one_like
description: Coulomb logarithm evaluated at pedestal-top conditions, quantifying the
  ratio of maximum to minimum impact parameters for Coulomb collisions.
documentation: "The Coulomb logarithm $\\ln\\Lambda$ is defined as $\\ln\\Lambda =\
  \ \\ln(\\lambda_D / b_{\\min})$, where $\\lambda_D$ is the Debye length and $b_{\\\
  min}$ is the distance of closest approach (or the de Broglie wavelength, whichever\
  \ is larger). At the pedestal top, where $n_e \\sim 3$\u2013$8 \\times 10^{19}$\
  \ m$^{-3}$ and $T_e \\sim 0.3$\u2013$1.5$ keV, typical values of $\\ln\\Lambda$\
  \ range from 14 to 17. This quantity enters the Braginskii collision frequency $\\\
  nu_{ei} \\propto n_e \\ln\\Lambda / T_e^{3/2}$ and therefore governs the collisionality\
  \ regime of the pedestal, affecting bootstrap current, neoclassical transport, and\
  \ resistive MHD stability. It is computed from fitted pedestal electron density\
  \ and temperature profiles, typically obtained via Thomson scattering. See also\
  \ `electron_normalized_collisionality_at_pedestal_top` for the dimensionless collisionality\
  \ that depends on this quantity."
