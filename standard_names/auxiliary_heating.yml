- name: launched_power_of_wave_beam
  kind: scalar
  status: active
  description: Net RF or microwave power carried by one wave beam across the vacuum-vessel
    entry plane after transmission and returned-power losses.
  documentation: 'Launched power is the net cycle-averaged electromagnetic power crossing
    the vacuum-vessel entry plane in the propagation direction of one coherent RF
    or microwave beam.


    At the launch reference plane, it is defined by


    $$

    P_{\mathrm{launch}} = P_{\mathrm{forward}} - P_{\mathrm{return}}

    $$


    where $P_{\mathrm{forward}}$ is the forward beam power after transmission losses,
    and $P_{\mathrm{return}}$ is the power propagating back toward the launcher at
    that plane; both are cycle-averaged powers in W.


    This quantity is a stage-specific form of [power of a wave beam](name:power_of_wave_beam).
    It excludes generator or source power, load power, and power subsequently absorbed
    by the plasma; therefore, it is distinct from plasma-absorbed power.'
  unit: W
