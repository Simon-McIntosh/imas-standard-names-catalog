- name: accumulated_neon_count
  kind: scalar
  status: draft
  description: Cumulative number of neon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons.
  documentation: "The accumulated neon count is the running temporal integral of the\
    \ neon gas injection rate from plasma breakdown onward, giving the total neon\
    \ inventory delivered to the plasma vessel over the discharge. Each injected neon\
    \ atom contributes to the tally in equivalent-electron units \u2014 the raw particle\
    \ count scaled by the neon atomic number $Z_\\mathrm{Ne} = 10$ \u2014 enabling\
    \ direct comparison with other injected fuel and impurity species.\n\nThe defining\
    \ integral is:\n\n$$\nN_\\mathrm{acc}(t) = Z_\\mathrm{Ne} \\int_{t_0}^{t} \\dot{n}_\\\
    mathrm{Ne}(t') \\, dt'\n$$\n\nwhere $\\dot{n}_\\mathrm{Ne}$ is the instantaneous\
    \ neon injection rate in atoms per second, $t_0$ is the time of plasma breakdown,\
    \ and $Z_\\mathrm{Ne} = 10$ is the neon atomic number.\n\nThis quantity is determined\
    \ from calibrated gas valve flow measurements integrated temporally throughout\
    \ the discharge. It is particularly relevant in impurity seeding and disruption\
    \ mitigation experiments where the cumulative neon dose governs radiated power\
    \ fractions and pedestal stability.\n\nThe parent neon_count provides phase-specific\
    \ or instantaneous counts; [neon_prefill_count](name:neon_prefill_count) covers\
    \ the pre-breakdown injection phase exclusively. Analogous accumulated quantities\
    \ for other injected species include [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ and [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection).\n\
    \nSign convention: Positive when neon gas is injected, so the accumulated count\
    \ increases monotonically from zero at plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:neon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
- name: accumulated_nitrogen_count
  kind: scalar
  status: draft
  description: Cumulative nitrogen gas injection since plasma breakdown, expressed
    as an equivalent-electron count where each nitrogen atom contributes 7 equivalent
    electrons equal to its atomic number.
  documentation: 'The accumulated nitrogen count tracks the total nitrogen atoms delivered
    by gas injection from plasma breakdown onward, weighted by the atomic number of
    nitrogen ($Z_N = 7$) to produce a dimensionless equivalent-electron count. This
    convention reflects the electron inventory that would result from complete ionization
    of all injected nitrogen and places different injected species on a common quantitative
    footing shared across the gas-injection monitoring family.


    The count is defined as:


    $$

    C_N = Z_N \, N_N = 7 \, N_N

    $$


    where $N_N$ is the cumulative number of nitrogen atoms delivered since plasma
    breakdown and $Z_N = 7$ is the atomic number of nitrogen. The count integrates
    contributions from each gas valve pulse throughout the discharge and increases
    monotonically from breakdown.


    Nitrogen is regularly injected in fusion devices for divertor detachment seeding,
    radiative power dissipation, and disruption mitigation. The equivalent-electron
    count is inferred from gas valve actuation signals integrated against calibrated
    throughput curves from the moment of plasma breakdown. Typical values span from
    $10^{20}$ equivalent electrons for trace impurity seeding to $10^{24}$ in massive
    gas injection scenarios. The analogous count for argon is provided by [accumulated_argon_count](name:accumulated_argon_count)
    using $Z = 18$, the hydrogen reference uses $Z = 1$ per atom in [accumulated_hydrogen_count_due_to_gas_injection](name:accumulated_hydrogen_count_due_to_gas_injection),
    and the prefill-only nitrogen inventory is tracked separately by [nitrogen_prefill_count](name:nitrogen_prefill_count).


    Sign convention: Positive when nitrogen atoms have been cumulatively injected
    into the plasma vessel after plasma breakdown onset.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:accumulated_hydrogen_count_due_to_gas_injection
  - name:nitrogen_prefill_count
- name: accumulated_oxygen_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative post-breakdown oxygen delivered by gas injection, expressed
    as an equivalent-electron count. Each oxygen atom contributes 8 counts, so the
    value is 8 times the injected oxygen atom inventory.
  documentation: 'The accumulated oxygen count due to gas injection is the cumulative
    amount of oxygen introduced after plasma breakdown, expressed in equivalent electrons
    rather than oxygen atoms. It provides a charge-normalized impurity inventory:
    one oxygen atom contributes 8 counts because the atomic number of oxygen is 8.


    The equivalent-electron count $N_\mathrm{eq}$ is defined from the injected oxygen
    atom inventory $N_\mathrm{O}$ by:


    $$

    N_\mathrm{eq} = Z_\mathrm{O} N_\mathrm{O}

    $$


    where $Z_\mathrm{O}=8$ is the atomic number of oxygen and $N_\mathrm{O}$ is the
    cumulative number of oxygen atoms injected after plasma breakdown.


    In practice, the quantity is computed from calibrated gas-injection flow rates
    integrated over time, with molecular composition accounted for when oxygen is
    injected as $\mathrm{O}_2$ or in another oxygen-bearing gas. The accumulation
    starts from zero at breakdown and increases as additional oxygen is delivered;
    it excludes oxygen present in the prefill inventory. The simpler [oxygen_count](name:accumulated_oxygen_count_due_to_gas_injection)
    denotes an oxygen gas count in the same equivalent-electron representation, while
    [accumulated_oxygen_prefill_count_due_to_gas_injection](name:accumulated_oxygen_prefill_count_due_to_gas_injection)
    refers to the corresponding pre-breakdown contribution.


    Typical accumulated values range from about $10^{18}-10^{22}$ equivalent-electron
    counts for small impurity puffs to stronger radiative seeding phases, with larger
    values possible in long pulses or large devices.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_oxygen_prefill_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/oxygen/value
    dd_path: summary/gas_injection_accumulated/oxygen/value
    status: composed
- name: accumulated_oxygen_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative oxygen gas introduced during the prefill phase by gas injection,
    expressed as an equivalent-electron count where each oxygen atom contributes 8
    count units equal to its atomic number.
  documentation: 'The prefill phase precedes plasma breakdown, during which controlled
    gas injection establishes an initial neutral gas background in the vessel. This
    quantity accumulates the total oxygen inventory delivered during that phase, representing
    each oxygen atom as 8 equivalent electrons equal to the atomic number $Z_\mathrm{O}
    = 8$.


    The equivalent-electron inventory is defined as:


    $$

    N_\mathrm{eq} = Z_\mathrm{O} \cdot N_\mathrm{O}

    $$


    where $N_\mathrm{O}$ is the total number of oxygen atoms injected during the prefill
    interval and $Z_\mathrm{O} = 8$ is the atomic number of oxygen.


    The count is inferred from calibrated gas injection valve records integrated over
    the prefill interval, from the start of the prefill phase through plasma breakdown.
    It is the accumulated component of oxygen_prefill_count_due_to_gas_injection and
    follows the same equivalent-electron convention applied to helium-3 in [accumulated_helium_3_prefill_count_due_to_gas_injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    and to lithium in [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection).
    Post-breakdown oxygen injection is tracked separately by [oxygen_count](name:accumulated_oxygen_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_prefill_count_due_to_gas_injection
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  - name:accumulated_oxygen_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/oxygen/value
    dd_path: summary/gas_injection_prefill/oxygen/value
    status: composed
- name: accumulated_particle_count_at_pellet_path_due_to_pellet_injection
  kind: scalar
  status: draft
  description: Cumulative number of particles ablated from an injected pellet between
    the pellet-path entry point and a specified position along its trajectory. It
    is a nondecreasing count representing the integrated release of pellet material
    along the path.
  documentation: 'Accumulated particle count at a pellet path is the total number
    of pellet-material particles released by ablation from the path entry point up
    to a specified position on the trajectory. It starts near zero at entry and increases
    as material is released, reaching the ablated inventory for that pellet at the
    stopping point or final tracked position.


    The path coordinate $s$ is arc length measured in meters from the pellet-path
    entry point, with $s=0$ at entry and increasing in the direction of pellet motion.
    The accumulated count is the line integral of the particle-count gradient along
    the path:


    $$

    N_\mathrm{abl}(s) = \int_0^s \Gamma_N(s'') \, ds''

    $$


    where $N_\mathrm{abl}$ is the dimensionless particle count, $\Gamma_N=dN_\mathrm{abl}/ds$
    is the number of ablated particles per unit path length with unit m^-1, and $s''$
    is arc length in meters. If an ablation model provides a time rate $\dot{N}$ in
    s^-1, the corresponding path gradient is $\Gamma_N=\dot{N}/v_\mathrm{pel}$ for
    pellet speed $v_\mathrm{pel}$ in m s^-1.


    In practice, this quantity is obtained by tracking the pellet trajectory and integrating
    a local ablation source that depends on pellet composition, size, speed, and local
    plasma conditions such as temperature and density. It can also be constrained
    experimentally using combinations of fast imaging, spectroscopy, interferometry,
    and particle inventory balance. The closely related [accumulated_particle_count_of_pellet_path](name:accumulated_particle_count_at_pellet_path_due_to_pellet_injection)
    denotes the same cumulative-count concept for the pellet path.


    Typical final accumulated counts range from about $10^{17}$-$10^{20}$ particles
    for small diagnostic or shallow fueling pellets, $10^{20}$-$10^{22}$ particles
    for routine fueling pellets, and up to about $10^{23}$ particles for large or
    shattered pellets used for rapid fueling or mitigation.'
  unit: '1'
  physics_domain: plant_systems
  links: []
  sources:
  - id: dd:pellets/time_slice/pellet/path_profiles/ablated_particles
    dd_path: pellets/time_slice/pellet/path_profiles/ablated_particles
    status: composed
- name: accumulated_propane_count
  kind: scalar
  status: draft
  description: Accumulated propane count is the time-integrated amount of injected
    propane after plasma breakdown, converted to the number of electrons contained
    in the corresponding neutral propane molecules. One propane molecule contributes
    26 equivalent electrons.
  documentation: 'Accumulated propane count is the cumulative amount of propane gas
    injected after plasma breakdown, expressed as an equivalent-electron count. It
    is an atomic-accounting quantity: a neutral propane molecule, $\mathrm{C_3H_8}$,
    contains 26 electrons, so the value is 26 times the number of injected propane
    molecules rather than a direct measurement of plasma electrons.


    The count at time $t$ can be defined from the molecular injection rate:


    $$

    N_{\mathrm{C_3H_8,eq}}(t) = 26 \int_{t_{\mathrm{bd}}}^{t} \Phi_{\mathrm{C_3H_8}}(t'')\,dt''

    $$


    where $N_{\mathrm{C_3H_8,eq}}$ is dimensionless, $\Phi_{\mathrm{C_3H_8}}$ is the
    propane molecular flow rate in molecules s$^{-1}$, $t$, $t''$, and the breakdown
    time $t_{\mathrm{bd}}$ are in seconds, and $26 = 3\times6 + 8\times1$ is the number
    of bound electrons in one neutral propane molecule.


    In practice, the value is computed by integrating a calibrated propane flow over
    the interval beginning at plasma breakdown. If the available flow is molar, in
    mol s$^{-1}$, it is first multiplied by Avogadro''s constant to obtain molecules
    s$^{-1}$; if it is given as a gas throughput or volume flow, it is converted to
    molecule rate using the relevant gas calibration before applying the electron-count
    conversion. The quantity complements [propane_prefill_count](name:propane_prefill_count)
    for pre-breakdown inventory and is analogous to [accumulated_ethane_count](name:accumulated_ethane_count)
    for another hydrocarbon species.


    Typical values are 0 when no propane is injected, about $10^{18}$-$10^{21}$ for
    small trace or impurity-seeding puffs, and up to $10^{22}$-$10^{23}$ for larger
    or longer injections. These values represent injected inventory; they do not by
    themselves specify the retained amount, ionization fraction, or resulting plasma
    electron density.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:propane_prefill_count
  - name:accumulated_ethane_count
  - name:accumulated_carbon_count_due_to_gas_injection
- name: accumulated_silane_count
  kind: scalar
  status: draft
  description: Accumulated silane gas injection since plasma breakdown, expressed
    as an equivalent-electron count.
  documentation: 'Accumulated silane count is the time-integrated amount of silane,
    SiH4, injected into the plasma after breakdown. The count is dimensionless and
    uses an equivalent-electron convention: one SiH4 molecule corresponds to 18 equivalent
    electrons, from silicon with atomic number 14 and four hydrogen atoms with atomic
    number 1.


    The accumulated count at time $t$ is defined from the silane source rate by


    $$

    N_{\mathrm{SiH_4,acc}}(t) = \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{SiH_4,eq}}(t'')\,dt''
    = 18\int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{SiH_4,mol}}(t'')\,dt''

    $$


    where $N_{\mathrm{SiH_4,acc}}$ is the accumulated dimensionless equivalent-electron
    count, $t_{\mathrm{bd}}$ is the plasma-breakdown time in seconds, $t''$ is time
    in seconds, $\dot{N}_{\mathrm{SiH_4,eq}}$ is the equivalent-electron source rate
    in s^-1, and $\dot{N}_{\mathrm{SiH_4,mol}}$ is the molecular silane injection
    rate in molecules per second. The factor 18 is a counting convention for the injected
    molecular species, not a statement that neutral SiH4 supplies free electrons before
    dissociation or ionization.


    In practice this quantity is computed by integrating the calibrated [silane source
    rate](name:silane_source_rate) from plasma breakdown onward. Gas present as vessel
    prefill or static inventory before breakdown is excluded; only deliberately injected
    silane during the plasma discharge contributes.


    Typical values are 0 for discharges without silane injection. When silane is deliberately
    puffed for wall conditioning or impurity seeding, accumulated values are often
    about 10^18-10^22 in the dimensionless equivalent-electron count, depending on
    pulse duration, valve calibration, and injection recipe.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:silane_source_rate
  - name:accumulated_xenon_count
  - name:accumulated_argon_count
- name: accumulated_total_gas_count_at_midplane_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative total number of gas particles injected from all valves located
    near the equatorial midplane since plasma breakdown.
  documentation: "This quantity represents the running total of gas particles delivered\
    \ from all injection valves positioned near the equatorial midplane, accumulated\
    \ from the moment of plasma breakdown onward. It aggregates contributions from\
    \ all midplane valves regardless of injected species or individual valve identity,\
    \ providing a single integrated measure of total midplane fueling inventory over\
    \ the course of a discharge.\n\nThe accumulated count $N_\\text{mid}$ is obtained\
    \ by integrating the total midplane injection rate $\\dot{N}_\\text{mid}(t')$\
    \ over time:\n\n$$\nN_\\text{mid}(t) = \\int_{t_0}^{t} \\dot{N}_\\text{mid}(t')\
    \ \\, dt'\n$$\n\nwhere $t_0$ is the time of plasma breakdown and $\\dot{N}_\\\
    text{mid}$ is the combined instantaneous particle flux from all midplane gas injection\
    \ valves.\n\nThe count is derived from gas injection valve diagnostics \u2014\
    \ flow meters or pressure gages calibrated in particles per unit time \u2014 integrated\
    \ from plasma breakdown. This midplane-specific total complements the spatially\
    \ resolved siblings accumulated_total_lower_gas_particle_count_due_to_gas_injection\
    \ and accumulated_total_upper_gas_particle_count_at_inlet_due_to_gas_injection,\
    \ which distinguish upper and lower valve groups. For the machine-wide total across\
    \ all injection positions, see [accumulated_total_particle_count_due_to_gas_injection](name:accumulated_total_particle_count_due_to_gas_injection)."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_total_particle_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/midplane/value
    dd_path: summary/gas_injection_accumulated/midplane/value
    status: composed
  - id: dd:summary/gas_injection_prefill/midplane/value
    dd_path: summary/gas_injection_prefill/midplane/value
    status: attached
- name: accumulated_total_particle_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of particles delivered by gas injection since plasma
    breakdown, summed over all injected species and converted to an equivalent-electron
    count. The count resets at each new plasma breakdown event and is non-decreasing
    within a discharge while injection continues.
  documentation: 'Accumulated total particle count due to gas injection is the time-integrated
    amount of neutral gas delivered after plasma breakdown, summed over all injection
    systems and injected species. Each species is weighted by the number of electrons
    carried by one neutral injected particle when fully ionized, so the result is
    a dimensionless equivalent-electron count rather than a molecule count alone.
    The accumulator is reset to zero at each new plasma breakdown event.


    The accumulated count can be written as the species-weighted time integral of
    the injection rates:


    $$

    N_{\mathrm{tot}}(t) = \sum_s Z_s^{\mathrm{eq}} \int_{t_{\mathrm{bd}}}^{t} \Gamma_s(t'')
    \, dt''

    $$


    where $N_{\mathrm{tot}}$ is the dimensionless equivalent-electron count, $t_{\mathrm{bd}}$
    is the plasma-breakdown time, $\Gamma_s$ is the neutral-particle injection rate
    of species $s$ in $s^{-1}$, and $Z_s^{\mathrm{eq}}$ is the number of bound electrons
    in one neutral injected particle of species $s$ when fully ionized. With non-negative
    injection rates the value is monotonic between resets and remains constant between
    gas pulses.


    In practice, this quantity is computed by integrating calibrated gas-valve throughput,
    flow-meter measurements, or reconstructed injected particle rates over time, then
    applying the species weights before summing. It uses the same equivalent-electron
    normalization as [accumulated_total_gas_count](name:accumulated_total_particle_count_due_to_gas_injection),
    while specifically identifying the contribution from gas injection. If injector
    groups are reported separately, accumulated_total_lower_gas_particle_count_due_to_gas_injection
    and accumulated_total_upper_gas_particle_count_due_to_gas_injection are partial
    sums whose total equals the vessel-wide value when the partition covers all gas
    injectors.


    Typical accumulated values are $10^{20}$-$10^{23}$ equivalent electrons for small
    or short-pulse experiments and $10^{22}$-$10^{25}$ equivalent electrons for larger
    tokamak discharges, depending on fueling rate, pulse duration, gas species, and
    whether large pre-programmed gas puffs are included. Short diagnostic or impurity
    puffs can contribute smaller increments, often $10^{18}$-$10^{21}$ equivalent
    electrons.'
  unit: '1'
  physics_domain: plant_systems
  links: []
  sources:
  - id: dd:summary/gas_injection_accumulated/total/value
    dd_path: summary/gas_injection_accumulated/total/value
    status: attached
  - id: dd:summary/gas_injection_prefill/total/value
    dd_path: summary/gas_injection_prefill/total/value
    status: composed
- name: accumulated_tritium_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of tritium atoms delivered by gas injection since
    plasma breakdown, expressed as an equivalent-electron count where each tritium
    atom corresponds to one equivalent electron.
  documentation: "The accumulated tritium count due to gas injection is the running\
    \ total of tritium ($^3\\mathrm{H}$) atoms introduced to the plasma vessel through\
    \ gas injection valves, accumulated continuously from plasma breakdown onward.\
    \ The quantity is dimensionless, representing each injected atom as an equivalent-electron\
    \ contribution scaled by its atomic number.\n\nFor tritium, whose atomic number\
    \ is $Z = 1$, the equivalent-electron inventory equals the raw atom count directly:\n\
    \n$$\nN_\\mathrm{eq} = Z \\cdot N_\\mathrm{atoms} = N_\\mathrm{atoms}\n$$\n\n\
    where $N_\\mathrm{atoms}$ is the total number of tritium atoms injected after\
    \ breakdown. The equivalent-electron convention provides a species-independent\
    \ basis for comparing injected particle inventories \u2014 for higher-$Z$ species\
    \ such as argon ($Z = 18$), the multiplier is correspondingly larger.\n\nThis\
    \ is the time-integrated form of tritium_count_due_to_gas_injection, accumulating\
    \ monotonically as gas is puffed after breakdown. Tritium introduced before breakdown\
    \ is tracked separately as [tritium_prefill_count](name:tritium_prefill_count).\
    \ The deuterium analog in the same equivalent-electron framework is [deuterium_count_due_to_gas_injection](name:deuterium_count_due_to_gas_injection)."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:tritium_prefill_count
  - name:deuterium_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/tritium/value
    dd_path: summary/gas_injection_accumulated/tritium/value
    status: composed
- name: accumulated_xenon_count
  kind: scalar
  status: draft
  description: Cumulative number of xenon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons, where each xenon atom contributes
    54 equivalent electrons corresponding to its atomic number Z = 54.
  documentation: "The accumulated xenon count tracks the total xenon atoms introduced\
    \ by gas injection from plasma breakdown onward, expressed as a dimensionless\
    \ equivalent-electron tally in which each neutral xenon atom contributes 54 counts\
    \ equal to its atomic number $Z_{\\mathrm{Xe}} = 54$.\n\nThe defining integral\
    \ is:\n\n$$\nN_{\\mathrm{Xe,eq}}(t) = 54 \\int_{t_{\\mathrm{bd}}}^{t} \\frac{dN_{\\\
    mathrm{Xe}}}{dt'} \\, dt'\n$$\n\nwhere $dN_{\\mathrm{Xe}}/dt'$ is the instantaneous\
    \ xenon injection rate in atoms s$^{-1}$, $t_{\\mathrm{bd}}$ is the time of plasma\
    \ breakdown in s, and $N_{\\mathrm{Xe,eq}}$ is dimensionless. The prefill xenon\
    \ inventory prior to breakdown is excluded from this integral and is tracked separately\
    \ by [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count).\n\
    \nThe instantaneous injection rate contributing to this integral is characterized\
    \ by [xenon_source_rate](name:xenon_source_rate). Xenon is employed as a high-$Z$\
    \ impurity in disruption mitigation and radiative cooling experiments; in massive\
    \ gas injection scenarios the equivalent-electron count can reach $10^{23}$\u2013\
    $10^{24}$. For lighter noble gas comparisons, see [accumulated_neon_count](name:accumulated_neon_count)\
    \ ($Z = 10$) and [accumulated_krypton_count](name:accumulated_krypton_count) ($Z\
    \ = 36$).\n\nSign convention: Positive when xenon gas is injected into the vessel\
    \ after plasma breakdown, incrementing the cumulative count."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_xenon_prefill_count
  - name:xenon_source_rate
  - name:accumulated_neon_count
  - name:accumulated_krypton_count
- name: accumulated_xenon_prefill_count
  kind: scalar
  status: draft
  description: Accumulated xenon prefill count is the end-of-prefill neutral xenon
    inventory expressed as an equivalent-electron count. Each xenon atom contributes
    54 to the dimensionless count.
  documentation: 'Accumulated xenon prefill count is the scalar final value of the
    xenon gas dose introduced during the plasma prefill interval, expressed as an
    equivalent-electron count rather than as a count of neutral atoms. The conversion
    uses the xenon atomic number, so each neutral xenon atom contributes 54 equivalent
    electrons to the dimensionless count with unit 1.


    The end-of-prefill count is defined from the integrated neutral xenon atom flow
    over the prefill time window:


    $$

    N_{\mathrm{Xe,prefill}}^{\mathrm{eq}}(t_{\mathrm{end}}) = 54\,N_{\mathrm{Xe,prefill}}(t_{\mathrm{end}})
    = 54 \int_{t_{\mathrm{start}}}^{t_{\mathrm{end}}} \dot{N}_{\mathrm{Xe}}(t)\,dt

    $$


    where $N_{\mathrm{Xe,prefill}}^{\mathrm{eq}}$ is the accumulated equivalent-electron
    count, $N_{\mathrm{Xe,prefill}}$ is the accumulated number of xenon atoms, $\dot{N}_{\mathrm{Xe}}$
    is the neutral xenon atom flow rate in atoms per second, $t_{\mathrm{start}}$
    is the start of prefill injection, and $t_{\mathrm{end}}$ is the end of the prefill
    interval, usually before plasma breakdown.


    In practice the value is computed by integrating a calibrated xenon gas-flow or
    inventory estimate over the prefill interval. It is an accumulated final-time
    dose, not an instantaneous flow rate, and is the xenon-specific prefill analog
    of [accumulated_xenon_count](name:accumulated_xenon_count) when restricted to
    the prefill phase.


    Typical values are highly device- and scenario-dependent because prefill dosing
    depends on vessel volume, pumping, gas-valve calibration, and the intended initial
    neutral composition; the standard name therefore specifies the counting convention
    rather than a universal numerical range.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_prefill_count
  - name:krypton_prefill_count
  - name:accumulated_hydrogen_prefill_count
- name: ammonia_deuterated_prefill_count
  kind: scalar
  status: draft
  description: Equivalent-electron count of deuterated ammonia (ND3) accumulated during
    the plasma prefill phase, with each ND3 molecule contributing 10 equivalent electrons.
  documentation: 'The prefill equivalent-electron count for deuterated ammonia (ND3)
    quantifies the total ND3 inventory introduced into the vessel before plasma breakdown,
    using the same equivalent-electron bookkeeping adopted across the prefill gas
    inventory family. This enables direct comparison of different gas species on a
    common electron-count basis regardless of molecular mass.


    The count is defined by multiplying the number of delivered ND3 molecules by the
    total electron count of one neutral ND3 molecule:


    $$

    C = 10 \, N_{\mathrm{ND_3}}

    $$


    where $N_{\mathrm{ND_3}}$ is the number of injected molecules; the factor 10 arises
    from the atomic number of nitrogen ($Z_N = 7$) plus three deuterium atoms ($3
    \times Z_D = 3 \times 1 = 3$). Note that NH3 and ND3 carry the same equivalent-electron
    factor because deuterium and protium share atomic number $Z = 1$.


    The value is derived from gas injection flow records integrated over the prefill
    phase, ending at plasma breakdown. The analogous count for standard ammonia is
    [ammonia_prefill_count](name:ammonia_prefill_count), while post-breakdown ND3
    accumulation is tracked by [accumulated_ammonia_deuterated_count](name:accumulated_ammonia_deuterated_count).
    The same equivalent-electron convention governs [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count)
    and the broader prefill inventory family.


    Sign convention: Positive when deuterated ammonia gas has been injected during
    the prefill phase.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ammonia_prefill_count
  - name:accumulated_ammonia_deuterated_count
  - name:accumulated_xenon_prefill_count
- name: ammonia_deuterated_source_rate
  kind: scalar
  status: draft
  description: Instantaneous rate at which deuterated ammonia (ND3) molecules are
    introduced into the plasma vessel by gas injection.
  documentation: 'Deuterated ammonia (ND3) delivers both nitrogen impurity and deuterium
    fuel to the plasma in a single injection stream, with each molecule contributing
    one nitrogen atom ($Z_N = 7$) and three deuterium atoms ($Z_D = 1$). This dual-function
    character makes ND3 injection relevant to radiative mantle formation, edge cooling,
    and isotope fueling studies.


    The source rate $\dot{N}_{\mathrm{ND_3}}$ is the time derivative of the cumulative
    injected molecule count:


    $$

    \dot{N}_{\mathrm{ND_3}} = \frac{dN_{\mathrm{ND_3}}}{dt}

    $$


    where $N_{\mathrm{ND_3}}$ is the total number of ND3 molecules introduced since
    the reference time. The time-integrated equivalent-electron inventory is tracked
    by [accumulated deuterated ammonia count](name:accumulated_ammonia_deuterated_count),
    where each ND3 molecule contributes 10 equivalent electrons: 7 from nitrogen and
    3 from the three deuterium atoms. The deuterium fueling contribution from ND3
    is three times this rate and should be combined with other deuterium sources when
    using [deuterium source rate due to injection](name:deuterium_source_rate_due_to_injection).


    The rate is inferred from fast gas-valve diagnostics, calibrated using reference-volume
    pressure drops and gas conductance models. Typical injection rates range from
    $10^{19}$ to $10^{21}$ molecules per second for steady-state impurity seeding,
    rising to $10^{22}$ molecules per second or higher during massive gas injection
    for disruption mitigation.


    Sign convention: Positive when ND3 molecules flow into the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ammonia_deuterated_count
  - name:deuterium_source_rate_due_to_injection
- name: ammonia_prefill_count
  kind: scalar
  status: draft
  description: Accumulated ammonia gas injected during the plasma prefill phase, expressed
    as an equivalent-electron count.
  documentation: 'Ammonia prefill count is the accumulated amount of NH$_3$ introduced
    before plasma breakdown, expressed as the number of bound electrons carried by
    the injected neutral molecules. The convention uses the full stoichiometric electron
    content of ammonia, not the instantaneous ionization state of the gas.


    For a number of injected ammonia molecules $N_{\mathrm{NH_3}}$, the equivalent-electron
    count is


    $$

    N_{e,\mathrm{eq}} = 10\,N_{\mathrm{NH_3}}

    $$


    where the factor 10 is the total electron count of one neutral NH$_3$ molecule:
    7 from nitrogen and 3 from hydrogen.


    In practice this quantity is computed from the time-integrated ammonia gas throughput
    during the prefill interval, using calibrated valve, pressure, flow, or reservoir-depletion
    measurements to infer the number of NH$_3$ molecules delivered. It is specific
    to the prefill phase and is conceptually distinct from an accumulated ammonia
    count over a longer or differently defined injection interval.


    Typical values are strongly device and scenario dependent. Small conditioning
    or trace-species prefills may be around $10^{19}$-$10^{21}$ equivalent electrons,
    while larger dedicated molecular-gas prefills can reach $10^{22}$-$10^{23}$ equivalent
    electrons or more.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:nitrogen_prefill_count
  - name:ethylene_prefill_count
  - name:accumulated_ammonia_count
- name: argon_prefill_count
  kind: scalar
  status: draft
  description: Accumulated number of argon atoms injected as gas during the prefill
    phase before plasma breakdown, represented as an equivalent-electron count with
    18 count units per argon atom. The quantity is dimensionless and refers to introduced
    gas, not the retained, ionized, or pumped inventory.
  documentation: 'Argon prefill count is the accumulated amount of argon introduced
    as gas before plasma breakdown, represented in equivalent-electron counting units.
    This is a dimensionless convention in which one neutral argon atom contributes
    18 count units, equal to the atomic number of argon.


    The conversion from physical atom count to equivalent-electron count is


    $$

    N_{\mathrm{Ar,eq}} = 18\,N_{\mathrm{Ar}}

    $$


    where $N_{\mathrm{Ar}}$ is the number of argon atoms injected during the prefill
    phase and $N_{\mathrm{Ar,eq}}$ is the corresponding dimensionless equivalent-electron
    count.


    In practice this quantity is computed from calibrated gas-valve throughput, pressure-volume
    inventory, or other gas-accounting measurements integrated over the pre-breakdown
    prefill interval. It describes the source amount introduced into the vessel and
    does not correct for subsequent pumping, ionization, charge state evolution, wall
    retention, recycling, or the amount remaining in the plasma after breakdown.


    Typical argon prefill values in medium-size experiments are about $10^{18}$-$10^{21}$
    equivalent-electron count units, corresponding to approximately $6 \times 10^{16}$-$6
    \times 10^{19}$ argon atoms. Larger radiative or disruption-mitigation gas injections
    may extend above this range, depending on vessel volume, valve throughput, and
    operating scenario.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_argon_count
  - name:nitrogen_prefill_count
  - name:accumulated_xenon_prefill_count
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
- name: beryllium_source_rate
  kind: scalar
  status: draft
  description: Electron-equivalent rate at which beryllium contributes to the plasma
    particle source balance. It uses the same electron-counting convention as other
    species source rates; the corresponding beryllium nucleus rate depends on the
    assumed electron yield or charge state.
  documentation: 'Beryllium source rate is the electron-equivalent contribution of
    beryllium to the plasma particle balance. It counts the electron source credited
    to beryllium under the chosen charge-state accounting, so it can be compared directly
    with electron-equivalent source quantities such as [total_electron_source_rate](name:total_electron_source_rate)
    and [electron_source_rate_due_to_surface_emission](name:electron_source_rate_due_to_surface_emission).
    It is not an unqualified neutral-atom or nucleus throughput.


    The conversion from beryllium nucleus accounting to the electron-equivalent rate
    is


    $$

    S_\mathrm{Be} = \sum_k y_{e,k}\,\dot{N}_{\mathrm{Be},k}

    $$


    where $S_\mathrm{Be}$ is the beryllium source rate in s^-1, $\dot{N}_{\mathrm{Be},k}$
    is the beryllium nucleus source rate for channel $k$ in s^-1, and $y_{e,k}$ is
    the dimensionless number of electrons credited per beryllium nucleus for that
    channel. The value $y_{e,k}=4$ applies only when each beryllium nucleus is counted
    as fully ionized to $\mathrm{Be}^{4+}$; other effective yields may be used for
    partial ionization, charge-state-resolved accounting, or model-specific penetration
    assumptions.


    In practice, this rate is obtained from the source accounting used for beryllium:
    calibrated material-injection or inventory data, spectroscopy-constrained impurity
    influx estimates, erosion or material-balance models, or integrated particle-balance
    calculations. Comparisons with neighboring species quantities such as [xenon_source_rate](name:xenon_source_rate)
    should be made in electron-equivalent units; comparison of nucleus rates requires
    dividing by the adopted electron yield.


    Absolute values scale with plasma size, operating scenario, source mechanism,
    and the yield convention, so no universal device-independent absolute range exists.
    A useful scale is the fraction $f_\mathrm{Be}=S_\mathrm{Be}/S_e$ relative to a
    total electron source rate $S_e$: for orientation, $f_\mathrm{Be}=10^{-6}-10^{-3}$
    of $S_e=10^{20}-10^{24}$ s^-1 corresponds to $S_\mathrm{Be}=10^{14}-10^{21}$ s^-1.
    Deliberate material introduction, transient erosion, or different charge-state
    accounting can give values outside this range.


    Sign convention: Positive when beryllium processes produce a net increase in the
    plasma electron particle balance.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:carbon_source_rate_due_to_gas_injection
  - name:xenon_source_rate
  - name:hydrogen_source_rate_due_to_gas_injection
- name: carbon_prefill_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Number of carbon atoms injected as gas during the plasma prefill phase,
    expressed in equivalent electrons using six count units per carbon atom.
  documentation: 'Carbon prefill count due to gas injection is the dimensionless equivalent-electron
    inventory assigned to carbon atoms delivered by gas injection before plasma breakdown.
    It is a counting convention: each carbon atom contributes six count units because
    carbon has atomic number 6, independent of whether or when the atom is actually
    ionized.


    The prefill equivalent-electron count is defined from the carbon atom flux delivered
    during the prefill interval:


    $$

    N_{\mathrm{C,prefill}} = 6 \int_{t_{\mathrm{start}}}^{t_{\mathrm{bd}}} \Phi_{\mathrm{C}}(t)\,dt
    = 6\,N_{\mathrm{C,prefill}}^{\mathrm{atoms}}

    $$


    where $N_{\mathrm{C,prefill}}$ is the carbon prefill equivalent-electron count
    in dimensionless count units, $\Phi_{\mathrm{C}}(t)$ is the carbon atom flow rate
    in atoms per second, $t_{\mathrm{start}}$ is the start of the prefill gas delivery
    interval, $t_{\mathrm{bd}}$ is the plasma-breakdown time, and $N_{\mathrm{C,prefill}}^{\mathrm{atoms}}$
    is the number of carbon atoms delivered in the same interval, also as a dimensionless
    count.


    In practice this quantity is inferred from calibrated gas-injection valve commands,
    pressure-rise measurements, gas-line conductance models, or mass-flow diagnostics,
    converted from injected carbon-bearing gas molecules to carbon atoms and then
    multiplied by the six-count-per-carbon-atom convention. It is the carbon contribution
    to the total prefill_count_due_to_gas_injection and is closely related to [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection),
    which represents the same initial carbon inventory convention. Carbon injected
    after plasma breakdown belongs to the post-breakdown counterpart [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection),
    not to this prefill count.


    Typical values depend strongly on vessel volume, wall conditioning, gas species,
    and fueling strategy. Equivalent-electron counts may be negligible when no carbon-bearing
    prefill gas is used, while intentional carbon-bearing prefill can produce about
    10^18-10^22 count units in medium-sized magnetic-confinement devices.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_prefill/carbon/value
    dd_path: summary/gas_injection_prefill/carbon/value
    status: composed
- name: coolant_pressure
  kind: scalar
  status: draft
  description: Absolute static pressure of the coolant working fluid at a component
    port, characterizing the mechanical load and thermodynamic state of the fluid
    interface between connected plant-system components.
  documentation: 'Coolant pressure is the absolute static pressure of the coolant
    working fluid at a component port or fluid interface. It is an isotropic scalar
    measure of the normal compressive loading exerted by the fluid, excluding dynamic
    pressure associated with bulk flow velocity.


    The mechanical definition of static pressure is the normal force per unit area
    in the infinitesimal limit:


    $$

    p = \lim_{\Delta A \to 0} \frac{\Delta F_n}{\Delta A}

    $$


    where $p$ is the absolute pressure in Pa, $\Delta F_n$ is the compressive normal
    force in N exerted by the fluid on a surface element, and $\Delta A$ is the surface
    area in m$^2$.


    Coolant pressure is measured with calibrated absolute or gage pressure transducers,
    with gage readings converted to absolute pressure by adding the local reference
    pressure. In thermal-hydraulic calculations it is combined with [coolant temperature](name:coolant_temperature)
    and [coolant flow] through an equation of state or property table; for a single-phase
    control volume in local thermodynamic equilibrium it enters the enthalpy relation
    $h = u + p/\rho$, where $h$ and $u$ are specific enthalpy and internal energy
    in J kg$^{-1}$ and $\rho$ is density in kg m$^{-3}$. Location-specific boundary
    conditions include [coolant pressure at the cooling circuit inlet](name:coolant_pressure_at_cooling_circuit_inlet),
    often interpreted together with [coolant temperature at inlet](name:coolant_temperature_at_inlet)
    and [coolant temperature at outlet](name:coolant_temperature_at_outlet).


    Typical absolute pressures span about $10^5$-$10^6$ Pa for near-atmospheric auxiliary
    water or gas circuits, $10^6$-$10^7$ Pa for many pressurized gas coolant loops,
    and $10^7$-$2 \times 10^7$ Pa for high-pressure water coolant circuits. The applicable
    range depends on coolant species, phase margin, pump head, heat-exchanger design,
    and component pressure limits.'
  unit: Pa
  physics_domain: plant_systems
  links:
  - name:coolant_temperature
  - name:coolant_pressure_at_cooling_circuit_inlet
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
- name: coolant_temperature
  kind: scalar
  status: draft
  description: Absolute thermodynamic temperature of the coolant or working fluid
    at an inlet or outlet port of a balance-of-plant power conversion component. It
    characterizes the fluid thermal state at that connection point for heat-balance
    and cycle-performance calculations.
  documentation: 'Coolant temperature is the absolute thermodynamic temperature of
    the working fluid at a component connection point in a plant power-conversion
    or heat-transport system. It is a local state variable of the fluid stream and
    may refer to either an inlet or an outlet port unless a more specific standard
    name identifies the locus.


    For a steady single-phase stream with approximately constant heat capacity, the
    temperature change across a component is related to transferred thermal power
    by the calorimetric balance:


    $$

    \dot{Q} = \dot{m} c_p \left(T_\mathrm{out} - T_\mathrm{in}\right)

    $$


    where $\dot{Q}$ is the thermal power transferred to the fluid, $\dot{m}$ is the
    coolant mass flow rate, $c_p$ is the specific heat capacity at constant pressure,
    and $T_\mathrm{in}$ and $T_\mathrm{out}$ are the inlet and outlet coolant temperatures.


    In practice, coolant temperature is measured with temperature sensors such as
    resistance thermometers, thermocouples, or process transmitters installed in the
    fluid stream or thermowell near the port. It is used together with coolant pressure
    and flow to determine fluid enthalpy, heat removal, component efficiency, and
    thermodynamic cycle state points. For outlet-specific quantities, use [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet).


    Typical values are about 293-363 K for low-temperature water cooling circuits,
    about 553-613 K for pressurized-water heat-transfer loops, and about 523-823 K
    for helium or other high-temperature gas coolant systems. The applicable range
    depends strongly on coolant type, pressure, component function, and operating
    regime.'
  unit: K
  physics_domain: plant_systems
  links:
  - name:coolant_temperature_at_outlet
  - name:coolant_flow
  - name:coolant_pressure
  - name:total_coolant_absorbed_thermal_power_at_wall
- name: count_of_pellet
  kind: scalar
  status: draft
  description: Total discrete particle inventory of a pellet, encompassing both the
    individual atom count of the pellet material and the propellant gas-molecule count
    carried with the pellet.
  documentation: The count of a pellet captures the total discrete particle inventory
    attributable to one injected pellet, abstracting over both its solid material
    constituents and its gas-phase payload. The [atomic count](name:atomic_count_of_pellet)
    tallies every individual atom present in the pellet, counting each atom once regardless
    of whether the propellant material is monatomic, diatomic, or molecular in form.
    The [gas count] enumerates the propellant gas molecules carried with the pellet,
    representing the gas-phase component of the overall particle inventory. Together
    these two child quantities partition the total pellet particle inventory and are
    applied in pellet fueling efficiency analysis, particle balance accounting, and
    ablation modeling for pellet injection systems.
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:atomic_count_of_pellet
  sources:
  - id: derived:count_of_pellet
    status: composed
- name: atomic_count_of_pellet
  kind: scalar
  status: draft
  description: Total number of individual atoms in a pellet, with each atom counted
    once regardless of whether the propellant material is monatomic, diatomic, or
    molecular in form.
  documentation: "The atomic count of a pellet is the total discrete number of atoms\
    \ present throughout the entire pellet body, tallied individually without regard\
    \ to the molecular or bonding state of the constituent propellant material. A\
    \ diatomic fuel such as D$_2$ (frozen deuterium) contributes two atoms per molecule;\
    \ monatomic species contribute one atom per particle. This whole-pellet total\
    \ differs from spatially resolved counterparts such as [outer_atomic_count_of_pellet](name:outer_atomic_count_of_pellet),\
    \ and extends the general atom-counting convention of [count_of_pellet](name:count_of_pellet).\n\
    \nThe atomic count $N_\\mathrm{at}$ relates to the number of propellant molecules\
    \ $N_\\mathrm{mol}$ by:\n\n$$\nN_\\mathrm{at} = \\nu \\, N_\\mathrm{mol}\n$$\n\
    \nwhere $\\nu$ is the number of atoms per molecule of the propellant species (for\
    \ example, $\\nu = 2$ for D$_2$ or DT, and $\\nu = 1$ for a monatomic noble gas).\n\
    \nThe count is determined from the pellet geometry combined with the atomic number\
    \ density of the solid propellant at cryogenic storage temperature, or from pellet\
    \ mass measured immediately before injection. Fueling and disruption-mitigation\
    \ pellets for large tokamaks contain on the order of $10^{21}$\u2013$10^{23}$\
    \ atoms. The [normalized_atomic_count_of_pellet](name:normalized_atomic_count_of_pellet)\
    \ expresses this total scaled against a reference count for nondimensional comparison\
    \ across pellet types or injection scenarios."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:outer_atomic_count_of_pellet
  - name:count_of_pellet
  - name:normalized_atomic_count_of_pellet
  arguments:
  - name: count_of_pellet
    operator: atomic
    operator_kind: qualifier
- name: core_atomic_count_of_pellet
  kind: scalar
  status: draft
  description: Total number of atomic nuclei in the innermost core layer of a composite
    pellet, counted regardless of molecular bonding, phase, or species. For a core-outer
    partition, it complements the outer atomic count so their sum gives the whole-pellet
    atomic inventory.
  documentation: 'Core atomic count is the total number of atomic nuclei contained
    in the innermost core material of a composite pellet. It is an inventory, not
    a density: molecular bonding, phase, and ionization state do not change the count.
    In a two-region pellet decomposition it complements the [outer atomic count](name:outer_atomic_count_of_pellet);
    with additional regions, the whole-pellet inventory is the sum over all regions.


    The general definition is the volume integral of total atomic-nuclei number density
    over the core volume:


    $$

    N_\mathrm{core} = \int_{V_\mathrm{core}} n_\mathrm{atom}(\mathbf{x})\,dV = \int_{V_\mathrm{core}}
    \sum_s n_s(\mathbf{x})\,dV

    $$


    where $N_\mathrm{core}$ is the dimensionless count, $V_\mathrm{core}$ is the physical
    volume occupied by the core, $n_\mathrm{atom}$ is the total atomic-nuclei number
    density in m^-3, and $n_s$ is the number density in m^-3 of atomic species or
    isotope $s$. The species sum must be performed for mixtures; for example, deuterium
    and tritium nuclei in a mixed hydrogenic core are counted separately, and each
    molecule contributes one count per atomic nucleus. For a spatially uniform total
    atomic density the expression reduces to $N_\mathrm{core}=n_\mathrm{atom}V_\mathrm{core}$,
    but that product is valid only after all species contributions have been included.


    In practice, the count is computed from the core geometry and material composition
    using solid, liquid, or cryogenic number densities, with corrections for porosity,
    voids, temperature, or graded composition when relevant. It can also be inferred
    from the measured core mass and isotopic or elemental fractions by converting
    mass to numbers of nuclei using molar masses and stoichiometric coefficients.


    Typical values for fusion fueling or disruption-mitigation pellets are about 10^19-10^23
    counted atomic nuclei in the core layer. Small tracer or dopant cores may contain
    10^16-10^19 nuclei, while millimeter-scale hydrogenic cores commonly contain 10^20-10^22
    nuclei.'
  unit: '1'
  physics_domain: plant_systems
