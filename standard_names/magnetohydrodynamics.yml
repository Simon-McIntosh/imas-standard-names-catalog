- name: volume_averaged_runaway_electron_current_density
  kind: scalar
  status: draft
  description: Volume-averaged parallel current density of the runaway electron population.
  documentation: 'The volume-averaged runaway electron current density quantifies
    the total electric current carried by fast electrons undergoing relativistic runaway
    in a plasma, averaged over the entire plasma volume. It is defined as $j_{\text{RE,
    vol}} = \frac{1}{V}\int_V\langle \mathbf{j}_{\text{RE}} \cdot \hat{\mathbf{b}}
    \rangle\,dV$, where $\langle \mathbf{j}_{\text{RE}} \cdot \hat{\mathbf{b}} \rangle$
    is the flux-surface-averaged parallel runaway current density and $V$ is the total
    plasma volume. This global measure represents the net contribution of runaway
    electrons to the toroidal current and is critical for assessing disruption mitigation
    requirements, as beam currents can reach several mega-amperes in ITER-class devices.
    The value is typically derived by integrating radial profiles from kinetic simulations
    or disruption reconstructions, linking to [runaway_electron_kinetic_energy](name:runaway_electron_kinetic_energy)
    and [critical_electric_field](name:critical_electric_field).


    Sign convention: Positive when the runaway electron parallel current flows in
    the direction of increasing toroidal angle $\phi$ (counter-clockwise viewed from
    above).


    Typical values during tokamak disruptions range from $10^5$ to $10^7$ A/m$^2$
    depending on avalanche multiplication and electric field strength.'
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_kinetic_energy
  - name:critical_electric_field
  sources:
  - id: dd:disruption/profiles_1d/j_runaways
    dd_path: disruption/profiles_1d/j_runaways
    status: attached
  - id: dd:runaway_electrons/global_quantities/volume_average/current_density
    dd_path: runaway_electrons/global_quantities/volume_average/current_density
    status: composed
- name: volume_averaged_runaway_electron_source_rate_due_to_hot_tail
  kind: scalar
  status: draft
  description: Volume-averaged volumetric generation rate of runaway electrons due
    to the hot-tail mechanism, representing the primary seed source during a thermal
    quench.
  documentation: The hot-tail mechanism generates runaway electrons when the electron
    temperature drops rapidly during a thermal quench, leaving a high-energy tail
    of the Maxwellian distribution that outruns the rising collisional drag. This
    quantity is the volume-averaged production rate $\langle d n_{\mathrm{RE}} / dt
    \rangle = (1/V) \int_V S_{\mathrm{hot\,tail}}(r) \, dV$, where $S_{\mathrm{hot\,tail}}$
    is the local hot-tail source rate in $\mathrm{m}^{-3}\mathrm{s}^{-1}$. The hot-tail
    seed is typically strongest in the early disruption phase before secondary amplification
    by the avalanche mechanism becomes dominant; characteristic values for ITER-scale
    disruptions range from $10^{18}$ to $10^{21}\,\mathrm{m}^{-3}\mathrm{s}^{-1}$,
    depending on the quench rate and initial temperature. This quantity is a volume-averaged
    version of [runaway_electron_source_rate_due_to_hot_tail](name:runaway_electron_source_rate_due_to_hot_tail)
    and complements the total production rate given by [volume_averaged_runaway_electron_source_rate](name:volume_averaged_runaway_electron_source_rate).
    Measurement relies on hard X-ray and gamma-ray diagnostics during disruptions
    combined with transport simulations.
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate_due_to_hot_tail
  - name:volume_averaged_runaway_electron_source_rate
  sources:
  - id: dd:runaway_electrons/global_quantities/volume_average/ddensity_dt_hot_tail
    dd_path: runaway_electrons/global_quantities/volume_average/ddensity_dt_hot_tail
    status: skipped
- name: width_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Full radial width of the magnetic island associated with a neoclassical
    tearing mode (NTM).
  documentation: 'The full island width $W$ of a neoclassical tearing mode is the
    radial extent of the magnetic island chain, measured from the innermost to the
    outermost separatrix of the O-point. A magnetic island causes a flattening of
    the local pressure and temperature profiles, degrading plasma confinement. The
    saturated island width for a neoclassical tearing mode is determined by a balance
    of the perturbed bootstrap current, polarization current, and stabilizing effects
    such as flow shear. The island width is measured using diagnostic techniques like
    electron cyclotron emission (ECE) imaging or soft X-ray tomography; typical islands
    in medium-size tokamaks range from a few centimeters to tens of centimeters in
    radial width. This quantity is closely related to $[\text{toroidal flux radius
    at the NTM}](name:toroidal_flux_radius_of_neoclassical_tearing_mode)$ and the
    $[\text{island rotation frequency}](name:frequency_of_neoclassical_tearing_mode)$.


    Sign convention: Positive when the magnetic island is present and has a finite
    radial extent, zero when no island exists.


    In plasmas where the island is seeded by sawtooth events or other MHD activity,
    the $[\text{onset island width}](name:width_of_neoclassical_tearing_mode_onset)$
    provides the initial condition for nonlinear evolution. The poloidal mode number
    $m$ is captured by $[\text{poloidal mode number of the NTM}](name:poloidal_mode_number_of_neoclassical_tearing_mode)$.'
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_flux_radius_of_neoclassical_tearing_mode
  - name:frequency_of_neoclassical_tearing_mode
  - name:width_of_neoclassical_tearing_mode_onset
  - name:poloidal_mode_number_of_neoclassical_tearing_mode
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/width
    dd_path: ntms/time_slice/mode/detailed_evolution/width
    status: composed
  - id: dd:ntms/time_slice/mode/width
    dd_path: ntms/time_slice/mode/width
    status: composed
