- name: gyrocenter_particle_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: "Gyrocenter particle flux driven by fluctuations in the parallel component\
    \ of the magnetic field, representing the \u03B4B\u2225 contribution to radial\
    \ particle transport."
  documentation: 'This quantity isolates the contribution of the perturbed parallel
    magnetic field ($\delta B_\parallel$) to the radial particle flux of gyrocenters
    in gyrokinetic simulations. The flux is proportional to the correlation between
    the gyrocenter density fluctuation $\delta n$ and the $\delta B_\parallel$ perturbation,
    and is part of the electromagnetic decomposition of turbulent transport alongside
    contributions from the electrostatic potential ($\phi$) and the parallel vector
    potential ($\delta A_\parallel$). In electromagnetic gyrokinetic simulations at
    finite plasma beta ($\beta$), the $\delta B_\parallel$ component modifies the
    particle transport relative to the electrostatic-only prediction. Typical values
    depend on the turbulence regime: in core ion-temperature-gradient (ITG) turbulence
    the $\delta B_\parallel$ contribution is often subdominant, while in kinetic-ballooning-mode
    (KBM) regimes at higher $\beta$ this flux can become comparable to the $\phi$
    and $\delta A_\parallel$ contributions. This flux is normalized following the
    convention of local flux-tube gyrokinetic codes. See also [particle_flux_due_to_perturbed_parallel_vector_potential](name:particle_flux_due_to_perturbed_parallel_vector_potential)
    for the $\delta A_\parallel$ counterpart, and [energy_flux_due_to_perturbed_parallel_magnetic_field](name:energy_flux_due_to_perturbed_parallel_magnetic_field)
    for the corresponding energy flux.


    Sign convention: Positive when the net radial gyrocenter particle flux driven
    by $\delta B_\parallel$ is outward, consistent with the reference direction of
    the radial coordinate used in the simulation.


    Measurement/Computation: Extracted from the gyrocenter phase space distribution
    function evolved by standard gyrokinetic codes. The flux is obtained by velocity-space
    integration of the $\mathbf{E}\times\mathbf{B}$ nonlinearity weighted by the $\delta
    B_\parallel$ perturbation contribution to the $B_\parallel$ field component. Computed
    as a time-average over the saturated turbulent state at each flux surface in local
    flux-tube simulations, or over the full flux-surface volume in global simulations.
    Cross-references: [particle_flux_due_to_perturbed_parallel_magnetic_field](name:particle_flux_due_to_perturbed_parallel_magnetic_field)
    (same quantity without the explicit gyrocenter label), [normalized_gyrocenter_pressure](name:normalized_gyrocenter_pressure)
    for the gyrocenter pressure defining the gyrocenter response, and [gyrocenter_pressure](name:gyrocenter_pressure)
    for the non-normalized gyrocenter pressure moments contributing to the $\delta
    B_\parallel$ response via the pressure anisotropy in finite-$\beta$ gyrokinetic
    theory.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_flux_due_to_perturbed_parallel_vector_potential
  - name:energy_flux_due_to_perturbed_parallel_magnetic_field
  - name:particle_flux_due_to_perturbed_parallel_magnetic_field
  - name:normalized_gyrocenter_pressure
  - name:gyrocenter_pressure
