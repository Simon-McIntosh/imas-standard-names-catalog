name: derivative_of_ion_poloidal_velocity_with_respect_to_normalized_toroidal_flux_coordinate
status: draft
cocos_transformation_type: one_like
description: Radial gradient of the ion poloidal velocity with respect to the normalized
  toroidal flux coordinate $\rho_{\mathrm{tor,N}}$.
documentation: "This quantity represents the derivative $\\partial v_{\\theta,i} /\
  \ \\partial \\rho_{\\mathrm{tor,N}}$, where $v_{\\theta,i}$ is the ion poloidal\
  \ velocity (in m/s) and $\\rho_{\\mathrm{tor,N}} = \\sqrt{\\Phi / \\Phi_{\\mathrm{edge}}}$\
  \ is the normalized toroidal flux coordinate (dimensionless), with $\\Phi$ the toroidal\
  \ magnetic flux enclosed by a flux surface and $\\Phi_{\\mathrm{edge}}$ its value\
  \ at the last closed flux surface. This gradient is used in transport solvers to\
  \ evaluate neoclassical and turbulent poloidal momentum fluxes and enters the radial\
  \ electric field through the force-balance relation $E_r = v_{\\phi,i} B_\\theta\
  \ - v_{\\theta,i} B_\\phi + \\nabla p_i / (n_i Z_i e)$. In typical tokamak H-mode\
  \ plasmas, $v_{\\theta,i}$ itself is of order 1\u201310 km/s and varies rapidly\
  \ across the pedestal, so its derivative with respect to $\\rho_{\\mathrm{tor,N}}$\
  \ can reach $10^4$\u2013$10^5$ m/s per unit $\\rho_{\\mathrm{tor,N}}$. The quantity\
  \ is obtained from charge-exchange recombination spectroscopy (CXRS) measurements\
  \ of $v_{\\theta,i}$ profiles followed by numerical differentiation, or directly\
  \ from integrated-modeling transport solvers. Note that the unit is m\xB7s$^{-1}$\
  \ (not m\xB7s$^{-1}$ per meter) because $\\rho_{\\mathrm{tor,N}}$ is dimensionless.\
  \ See also `derivative_of_electron_poloidal_velocity_with_respect_to_normalized_toroidal_flux_coordinate`\
  \ for the electron counterpart."
