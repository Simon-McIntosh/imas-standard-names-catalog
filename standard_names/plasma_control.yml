- name: plasma_boundary_gap_angle
  kind: scalar
  status: draft
  description: Angle in the poloidal cross-section between the gap-measurement direction
    and the horizontal axis, defining the orientation along which the plasma-boundary
    gap is evaluated.
  documentation: In plasma shape and position control, a gap is the distance from
    a fixed reference point to the plasma boundary measured along a straight line
    in the poloidal plane. The gap angle $\alpha$ (in radians) specifies the direction
    of this line relative to the outboard midplane horizontal. An angle of $0$ corresponds
    to a purely radial (outboard) measurement, while $\pi/2$ corresponds to a vertical
    measurement. The reference point coordinates are given by [major_radius_of_plasma_boundary_gap_reference_point](name:major_radius_of_plasma_boundary_gap_reference_point)
    and its vertical counterpart. Multiple gaps at different angles are used simultaneously
    in real-time feedback to control elongation, triangularity, and wall clearance.
    Values span $[0, 2\pi)$ and are fixed by machine design. See also [upper_uncertainty_of_major_radius_of_plasma_boundary_gap_reference_point](name:upper_uncertainty_of_major_radius_of_plasma_boundary_gap_reference_point)
    for the uncertainty on the reference-point position.
  unit: rad
  tags:
  - equilibrium-reconstruction
  - real-time-control
  links: []
  validity_domain: ''
  constraints: []
- name: pulse_schedule_event_duration
  kind: scalar
  status: draft
  description: Temporal duration of a discrete event defined in the pulse schedule,
    measured in seconds.
  documentation: "This quantity records how long a scheduled event lasts within the\
    \ pulse timeline. Events in the pulse schedule mark discrete phases or actions\u2014\
    such as plasma breakdown, ramp-up, flat-top hold, auxiliary heating activation,\
    \ or controlled ramp-down\u2014and the duration $\\Delta t$ (in s) specifies the\
    \ time window over which each event's prescribed waveforms and setpoints are active.\
    \ Durations range from milliseconds (e.g., fast gas-puff events, $\\sim 10^{-3}$\
    \ s) to tens of seconds (e.g., sustained flat-top phases, $\\sim 10$\u2013$400$\
    \ s in long-pulse devices). The event duration complements the event time stamp\
    \ [pulse_schedule_event_time](name:pulse_schedule_event_time), with the two together\
    \ defining the temporal interval $[t_{\\text{event}},\\, t_{\\text{event}} + \\\
    Delta t]$ during which the event is in effect. This field is used by plasma control\
    \ systems and scenario-planning tools to sequence actuator commands."
  unit: s
  cocos_transformation_type: one_like
  tags:
  - real-time-control
  - scenario-planning
  - time-dependent
  links: []
  validity_domain: ''
  constraints: []
