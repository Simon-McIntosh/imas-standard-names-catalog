    dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_width
    status: composed
- name: hot_neutral_fraction
  kind: scalar
  status: draft
  description: Fraction of charge-exchange-born hot neutral atoms in the total neutral
    population of a hydrogen isotope, assuming a two-component hot-plus-cold neutral
    partition. It is the hot neutral density divided by the sum of hot and cold neutral
    densities.
  documentation: 'Hot neutral fraction is the dimensionless abundance of fast neutral
    atoms produced mainly by charge exchange relative to all neutral atoms of the
    same hydrogen isotope in a two-component neutral model. The complementary population
    is the cold neutral component, so the modeled total neutral density is the sum
    of hot and cold neutral densities.


    The defining ratio is:


    $$

    f_\mathrm{hot} = \frac{n_\mathrm{hot}}{n_\mathrm{hot} + n_\mathrm{cold}}

    $$


    where $n_\mathrm{hot}$ and $n_\mathrm{cold}$ are the hot and cold neutral number
    densities in $m^{-3}$ for the same isotope and physical region.


    In visible spectroscopy, hot and cold neutral contributions may be inferred from
    line-shape components, such as Doppler-broadened charge-exchange emission and
    colder recycling or fueling emission. The measured component intensities are not
    density fractions by themselves; converting them to $f_\mathrm{hot}$ requires
    an emissivity or collisional-radiative model that accounts for excitation, charge
    exchange, ionization, neutral velocity distributions, instrument response, and
    line-of-sight integration.


    By definition $0 \le f_\mathrm{hot} \le 1$. Values near 0 indicate a cold-neutral-dominated
    population, while values near 1 indicate a hot-neutral-dominated population; the
    realized value is strongly dependent on plasma conditions, neutral sources, charge-exchange
    rates, and the observation region.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:cold_neutral_fraction
  - name:neutral_fraction
  sources:
  - id: dd:spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_fraction
    dd_path: spectrometer_visible/channel/isotope_ratios/isotope/hot_neutrals_fraction
    status: composed
- name: lower_bound_energy_of_detector_pixel
  kind: scalar
  status: draft
  description: Minimum photon energy accepted by a detector pixel in an X-ray crystal
    spectrometer. It is the low-energy edge of that pixel's photon-energy bandpass.
  documentation: 'The lower bound energy of a detector pixel is the minimum photon
    energy in the spectral interval accepted by that pixel. Together with the corresponding
    upper bound, it defines the pixel bandpass around the calibrated photon_energy
    coordinate.


    For a crystal spectrometer calibrated by Bragg diffraction, the lower bound for
    pixel $p$ can be written as the minimum energy over the Bragg-angle interval accepted
    by that pixel:


    $$

    E_{\mathrm{lower},p} = \min_{\theta \in \Omega_p} \frac{n h c}{2 d \sin\theta\,
    e}

    $$


    where $\Omega_p$ is the accepted Bragg-angle interval of pixel $p$, $n$ is the
    positive integer diffraction order for the calibrated spectral branch, $d$ is
    the crystal lattice-plane spacing, $h$ is Planck''s constant, $c$ is the speed
    of light, and $e$ is the elementary charge converting joules to electronvolts.
    Equivalently, if $d$ is expressed in nm, $hc/e = 1239.841984\ \mathrm{eV\,nm}$
    gives $E$ directly in eV.


    In practice this bound is obtained from the spectrometer geometry, crystal spacing
    and orientation, detector position, pixel aperture, and a wavelength or line-emission
    calibration. The finite pixel size and optical response determine the accepted
    angular interval, so the lower bound is the low-energy edge of the pixel response
    rather than merely the energy at its center.


    Typical lower bounds for fusion X-ray crystal spectrometers are 500-20000 eV,
    with common impurity-line measurements in the 3000-8000 eV range and harder spectral
    branches extending to 10000-50000 eV. Adjacent-pixel energy intervals are often
    a few eV to tens of eV, depending on dispersion and pixel size.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links: []
  arguments:
  - name: energy_of_detector_pixel
    operator: lower_bound
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/energy_bound_lower
    dd_path: spectrometer_x_ray_crystal/channel/energy_bound_lower
    status: attached
  - id: dd:spectrometer_x_ray_crystal/energy_bound_lower
    dd_path: spectrometer_x_ray_crystal/energy_bound_lower
    status: composed
- name: lower_photon_energy
  kind: scalar
  status: draft
  description: Minimum photon energy defining the low-energy edge of an X-ray detector,
    camera pixel, or energy-resolved emission band. Incident photons below this cutoff
    are rejected, not counted, or excluded from the corresponding photon-energy window.
  documentation: 'Lower photon energy is the minimum photon energy admitted by a photon-counting
    or energy-selective X-ray measurement. Together with an upper cutoff such as [upper_photon_energy](name:upper_photon_energy),
    it defines the accepted photon-energy interval; for pixel-specific thresholds
    it is the lower-edge counterpart of [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)
    and is paired with [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).


    Photon energy is related to radiation frequency and wavelength by:


    $$

    E_\gamma = h\nu = \frac{hc}{\lambda}

    $$


    where $E_\gamma$ is photon energy, $h$ is Planck''s constant, $\nu$ is photon
    frequency, $c$ is the speed of light, and $\lambda$ is wavelength. The lower threshold
    $E_\mathrm{lower}$ selects photons satisfying $E_\gamma \ge E_\mathrm{lower}$,
    usually in combination with an upper threshold $E_\mathrm{upper}$.


    In practice this threshold is set by detector absorption filters, scintillator
    or semiconductor response, electronic discrimination levels, pulse-height analysis,
    or analysis choices used to isolate an energy band for emissivity inference. Calibration
    with known radiation sources or modeled detector response functions is used to
    relate the threshold setting to photon energy.


    Typical lower thresholds are about 100-1000 eV for soft X-ray measurements and
    about 1e3-1e5 eV for hard X-ray measurements, depending on detector material,
    filter stack, electronic noise floor, and the intended spectral band.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_photon_energy
  - name:lower_bound_energy_of_detector_pixel
  sources:
  - id: dd:camera_x_rays/energy_threshold_lower
    dd_path: camera_x_rays/energy_threshold_lower
    status: composed
  - id: dd:hard_x_rays/channel/energy_band/lower_bound
    dd_path: hard_x_rays/channel/energy_band/lower_bound
    status: attached
  - id: dd:hard_x_rays/emissivity_profile_1d/lower_bound
    dd_path: hard_x_rays/emissivity_profile_1d/lower_bound
    status: attached
  - id: dd:soft_x_rays/channel/energy_band/lower_bound
    dd_path: soft_x_rays/channel/energy_band/lower_bound
    status: attached
- name: lower_wavelength_of_filter
  kind: scalar
  status: draft
  description: Short-wavelength (high-photon-energy) edge of the transmission passband
    of a diagnostic filter or filter window. Radiation at shorter wavelengths than
    this nominal cutoff is attenuated below the specified transmission criterion.
  documentation: 'The lower wavelength of a filter, denoted $\lambda_{\min}$, is the
    nominal short-wavelength edge of the filter or filter-window transmission passband.
    It is expressed in meters and corresponds to the highest photon energies intended
    to be transmitted by the filter; photons with $\lambda < \lambda_{\min}$ are attenuated
    below the applicable transmission criterion.


    Photon energy is inversely related to wavelength:


    $$

    E_\gamma = \frac{hc}{\lambda}

    $$


    where $E_\gamma$ is photon energy, $h$ is Planck''s constant, $c$ is the speed
    of light, and $\lambda$ is photon wavelength. A smaller $\lambda_{\min}$ therefore
    means that higher-energy photons are included in the nominal transmitted band.


    In practice, $\lambda_{\min}$ is determined from a calibrated or manufacturer-specified
    spectral transmission curve $T(\lambda)$. The cutoff should correspond to an explicit
    attenuation or transmission threshold, such as the shortest wavelength at which
    $T(\lambda)$ rises above a chosen fraction of the in-band or peak transmission.
    Together with [upper_wavelength_of_filter](name:upper_wavelength_of_filter), this
    quantity gives the nominal wavelength interval of the filter, but the detailed
    wavelength-dependent response is described by quantities such as [spectral_absorptivity_of_filter](name:spectral_absorptivity_of_filter).


    Typical values depend strongly on the diagnostic spectral range: visible continuum
    filters often have lower wavelengths of about $3 \times 10^{-7}$-$8 \times 10^{-7}$
    m, soft-X-ray filter windows about $10^{-10}$-$10^{-8}$ m, and hard-X-ray filter
    windows about $10^{-12}$-$10^{-10}$ m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:upper_wavelength_of_filter
  - name:wavelength_of_filter
  - name:spectral_absorptivity_of_filter
  - name:thickness_of_filter
