name: toroidal_component_of_ion_momentum_convective_velocity
description: Toroidal projection of the convective velocity entering the ion momentum
  transport equation in edge plasma models.
documentation: The toroidal convective velocity $v_\phi^{\mathrm{conv}}$ (m s$^{-1}$)
  is the $\hat{\phi}$-component of the bulk ion flow velocity appearing in the advective
  term $\nabla \cdot (m_i n_i \mathbf{v}\, v_\phi)$ of the toroidal ion momentum balance,
  where $m_i$ is the ion mass (kg), $n_i$ the ion density (m$^{-3}$), and $v_\phi$
  the toroidal fluid velocity (m s$^{-1}$). In edge fluid transport codes such as
  SOLPS-ITER and SOLEDGE2D, toroidal momentum transport is decomposed into convective
  and diffusive contributions; this quantity represents the former and is evaluated
  per element on a general grid description (GGD). Typical magnitudes range from a
  few km s$^{-1}$ in the far SOL to tens of km s$^{-1}$ near the separatrix, driven
  by auxiliary momentum injection, $\mathbf{E}\times\mathbf{B}$ drifts, and intrinsic
  rotation. Positive when the velocity is in the $+\phi$ direction under the adopted
  COCOS convention. See the radial and vertical counterparts for the remaining vector
  components and the toroidal diffusivity for the diffusive channel.
kind: vector_component
unit: m.s^-1
