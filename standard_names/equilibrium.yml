- name: major_radius_of_magnetic_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate locating the innermost closed magnetic-flux
    surface, which defines the plasma magnetic axis in a toroidal equilibrium.
  documentation: 'The major radius of the magnetic axis is the $R$ coordinate of the
    innermost nested magnetic-flux surface in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is distance from the toroidal symmetry axis and $Z$ is vertical
    height. It locates the magnetic center of the equilibrium and is distinct from
    the shape-based [major radius of the geometric axis](name:major_radius_of_geometric_axis)
    and the current-weighted [major radius of the current center](name:major_radius_of_current_center).


    The magnetic axis is identified as the stationary point of the poloidal magnetic
    flux $\psi$ in the poloidal cross-section:


    $$

    \nabla \psi(R_{\rm axis}, Z_{\rm axis}) = \mathbf{0}

    $$


    where $\psi$ is the poloidal magnetic flux, $R_{\rm axis}$ is the major-radius
    coordinate of the magnetic axis, and $Z_{\rm axis}$ is its vertical coordinate.
    The flux value at this point is the reference for [poloidal magnetic flux at the
    magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis).


    This quantity is computed from magnetic equilibrium reconstruction using external
    magnetic measurements, flux loops, and internal constraints such as polarimetry
    or motional-Stark-effect measurements when available. It is also used as a reference
    position for interpreting flux-surface geometry and plasma radial displacement
    relative to the vessel and coil system.


    Representative values are about 1-3 m in medium-size tokamaks and about 5-7 m
    in reactor-scale devices, depending on machine size and plasma position. During
    controlled displacements, shifts of several centimeters to tens of centimeters
    from the nominal geometric axis can occur.


    Sign convention: Positive when the magnetic axis lies at positive major radius
    $R$ measured outward from the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_current_center
  - name:poloidal_magnetic_flux_at_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/magnetic_axis/r
    dd_path: equilibrium/time_slice/global_quantities/magnetic_axis/r
    status: composed
- name: major_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Major-radius coordinate locating points on the plasma boundary relative
    to the toroidal symmetry axis in the poloidal cross-section.
  documentation: 'The major radius of the plasma boundary is the $R$ coordinate of
    a point on the outermost closed flux surface or separatrix in the right-handed
    cylindrical $(R, \phi, Z)$ frame. Together with the vertical coordinate of the
    boundary contour, it defines the poloidal shape used to derive geometric measures
    such as [minor radius of the plasma boundary](name:minor_radius_of_plasma_boundary),
    [area of the plasma boundary](name:area_of_plasma_boundary), and [poloidal length
    of the plasma boundary](name:poloidal_length_of_plasma_boundary).


    In a Cartesian frame $(x, y, z)$ with $z=Z$, the cylindrical major radius is defined
    by


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are horizontal Cartesian coordinates measured from the toroidal
    symmetry axis. The plasma-boundary major-radius values can also be summarized
    relative to the [major radius of the geometric axis](name:major_radius_of_geometric_axis)
    when defining elongation, triangularity, and radial gaps.


    This quantity is obtained from equilibrium reconstruction by locating the last
    closed magnetic flux surface using magnetic measurements, plasma pressure constraints,
    and, when available, internal magnetic-field diagnostics. It is also compared
    with the [major radius of the closest wall point](name:major_radius_of_closest_wall_point)
    and the [major radius of the plasma-boundary gap reference point](name:major_radius_of_plasma_boundary_gap_reference_point)
    when assessing plasma-wall clearance.


    Representative boundary major-radius values span about 1-4 m in medium-size tokamaks
    and about 4-8 m in reactor-scale devices, with the range over the boundary reflecting
    the plasma minor radius and shaping.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  - name:area_of_plasma_boundary
  - name:poloidal_length_of_plasma_boundary
  - name:major_radius_of_geometric_axis
