- name: thickness_of_passive_loop
  kind: scalar
  status: draft
  description: Non-negative perpendicular distance across a passive conducting loop
    element in its poloidal cross-section, measured between the two parallel bounding
    sides. It is the thickness dimension paired with loop cross-section length and
    inclination to define the conductor geometry.
  documentation: 'Thickness of a passive loop is the non-negative shortest distance
    through the conducting material in a constant-$\phi$ cross-section of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It is measured normal to the pair of parallel
    bounding sides of an oblique trapezoidal, parallelogram, or thick-line rectangular
    approximation, complementing the [length of the passive loop](name:major_length_of_conductor_cross_section)
    and the cross-section inclination angle.


    For two parallel bounding sides, the thickness $d$ is the perpendicular separation
    between them:


    $$

    d = \left|\left(\mathbf{r}_b - \mathbf{r}_a\right) \cdot \hat{\mathbf{n}}_\perp\right|

    $$


    where $\mathbf{r}_a$ and $\mathbf{r}_b$ are any points on the two opposite sides
    in the same cross-section, and $\hat{\mathbf{n}}_\perp$ is the unit vector normal
    to those sides within that plane. The absolute value reflects that thickness is
    a geometric size, not an oriented displacement.


    In practice, $d$ is obtained from mechanical drawings, CAD geometry, surveys,
    or simplified passive-structure models. Together with [length_of_passive_loop](name:major_length_of_conductor_cross_section)
    and the inclination angle, it fixes the cross-section used to compute [area_of_passive_loop](name:area_of_passive_loop);
    for rectangular and parallelogram approximations the area is $d$ times the complementary
    base length, while for a trapezoid it is $d$ times the mean parallel-side length.


    Typical values are 0.003-0.02 m for thin liners or vessel panels, 0.02-0.15 m
    for passive stabilizing plates and shells, and up to about 0.3 m for massive passive
    conductor blocks.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_conductor_cross_section
  - name:area_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/element/geometry/oblique/thickness
    dd_path: pf_passive/loop/element/geometry/oblique/thickness
    status: composed
  - id: dd:pf_passive/loop/element/geometry/thick_line/thickness
    dd_path: pf_passive/loop/element/geometry/thick_line/thickness
    status: composed
- name: thickness_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Thickness of a poloidal field coil is the full conductor-package cross-sectional
    extent measured normal to the coil reference centerline in a poloidal plane of
    the right-handed cylindrical (R, phi, Z) frame, where R is major radius, phi is
    toroidal angle, and Z is vertical height. It is distinct from radial width and
    vertical height.
  documentation: 'Thickness of a poloidal field coil is the face-to-face size of the
    coil conductor package measured along the direction normal to the coil reference
    centerline in a poloidal plane of the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is a local transverse dimension of the winding pack or conductor envelope,
    not necessarily the same as the radial width along $R$ or the vertical height
    along $Z$.


    For a coil cross-section with boundary points $\mathbf{x}$ and a unit normal $\hat{n}$
    in the poloidal plane, the thickness $t$ may be written as the full projected
    extent of the cross-section:


    $$

    t = \max_{\mathbf{x}}(\mathbf{x}\cdot\hat{n}) - \min_{\mathbf{x}}(\mathbf{x}\cdot\hat{n})

    $$


    where $\hat{n}$ is perpendicular to the local coil reference centerline and the
    extrema are taken over the gross conductor-package cross-section.


    The value is obtained from the engineering geometry of the poloidal field coil
    winding pack or conductor package. Unless a more specific quantity states otherwise,
    it denotes the gross physical envelope assigned to the coil package, including
    insulation, stabilizer, casing, or internal voids that are part of that envelope;
    it is not the net area of electrically conducting material alone. Together with
    complementary dimensions such as [width_of_poloidal_field_coil](name:width_of_poloidal_field_coil)
    and [height_of_poloidal_field_coil](name:height_of_poloidal_field_coil), it determines
    the geometric cross-section used to compute quantities such as [area_of_poloidal_field_coil](name:area_of_poloidal_field_coil).


    Typical values range from 0.05-0.5 m for small or medium experimental coils and
    about 0.2-1.5 m for large tokamak poloidal-field winding packs; very large superconducting
    coil packages can have thicknesses of order 2 m or more.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
