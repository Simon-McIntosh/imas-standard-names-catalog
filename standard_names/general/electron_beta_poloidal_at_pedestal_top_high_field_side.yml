name: electron_beta_poloidal_at_pedestal_top_high_field_side
status: draft
cocos_transformation_type: one_like
description: Electron poloidal beta at the pedestal top evaluated on the high-field
  side of the flux surface.
documentation: The electron poloidal beta on the high-field side (HFS) at the pedestal
  top is $\beta_{\mathrm{pol},e}^{\mathrm{HFS}} = 2\mu_0 n_e T_e / B_{\theta,\mathrm{HFS}}^2$,
  where $n_e$ is the electron density (m$^{-3}$), $T_e$ is the electron temperature
  (eV), $B_{\theta,\mathrm{HFS}}$ is the poloidal magnetic field on the inboard midplane
  (T), and $\mu_0$ is the vacuum permeability. Because $B_{\theta}$ varies poloidally
  due to the Shafranov shift and flux-surface shaping, this HFS evaluation differs
  from the flux-surface-averaged or low-field-side values. The quantity is extracted
  from mtanh pedestal profile fits combined with equilibrium reconstruction. Typical
  values are modestly lower than the LFS counterpart owing to the stronger poloidal
  field on the inboard side. It is relevant for assessing poloidal asymmetries in
  the pedestal pressure balance and for validating gyrokinetic turbulence simulations
  that resolve ballooning structure. See also `electron_poloidal_beta_at_pedestal_top_low_field_side`
  and `electron_poloidal_beta_at_pedestal_top_flux_surface_averaged`.
