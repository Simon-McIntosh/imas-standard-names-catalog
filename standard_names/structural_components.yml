    enhanced_context:
      description: Vertical (Z) coordinate of outline.
      kind: template
- name: vertical_outline_of_vacuum_vessel
  kind: scalar
  status: active
  description: "Signed vertical position of a point on a vacuum-vessel element outline,\
    \ measured along the vertical axis of the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'This quantity is the vertical coordinate of a specified point on
    the geometric outline of a vacuum-vessel element. It identifies the point''s height
    relative to the cylindrical coordinate origin, rather than an element center,
    thickness, or surface-normal displacement.


    The coordinate is defined by projection of the point position onto the vertical
    basis vector:


    $$

    Z_{\rm point}=\mathbf{r}_{\rm point}\cdot\hat{\mathbf{Z}}

    $$


    where $\mathbf{r}_{\rm point}$ is the position vector of the outline point, $\hat{\mathbf{Z}}$
    is the vertical unit vector, and $(R,\phi,Z)$ is the right-handed cylindrical
    frame with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical
    coordinate.


    Sign convention: Positive when the outline point lies in the direction of increasing
    $Z$.'
  unit: m
  physics_domain: structural_components
