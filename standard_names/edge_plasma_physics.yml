- name: flux_surface_averaged_iron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of iron ions at the plasma boundary
    (separatrix), summed over all ion charge states from Fe+ through Fe26+ and excluding
    neutral iron.
  documentation: 'Flux-surface-averaged number density of iron ions at the plasma
    boundary (separatrix), summed over all ion charge states from Fe$^+$ through Fe$^{26+}$
    and excluding neutral iron, is the charge-state-summed iron-ion number density
    averaged over the boundary magnetic flux surface. The plasma boundary is the separatrix
    separating closed confined flux surfaces from the open-field-line region.


    For an axisymmetric equilibrium, the charge-state aggregation and boundary flux-surface
    average are defined by:


    $$

    \langle n_\mathrm{Fe} \rangle_\mathrm{sep}

    =

    \frac{\oint_\mathrm{sep} \left(\sum_{Z_i=1}^{26} n_{\mathrm{Fe}^{Z_i+}}\right)\,
    d\ell / B_p}

    {\oint_\mathrm{sep} d\ell / B_p}

    $$


    where $n_{\mathrm{Fe}^{Z_i+}}$ is the local number density of iron ions with charge
    number $Z_i$, $d\ell$ is an arc-length element along the separatrix contour in
    a poloidal plane, and $B_p$ is the poloidal magnetic-field magnitude.


    This quantity is the flux-surface-averaged counterpart of [iron_density_at_plasma_boundary](name:iron_density_at_plasma_boundary);
    it is not a charge-state-resolved iron density and does not include neutral iron.
    If the separatrix contains an X-point, the value is understood as the limit of
    the same average over nested closed flux surfaces approaching the separatrix.
    The same averaging convention applies to related boundary species densities such
    as [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary),
    [flux_surface_averaged_hydrogen_density_at_plasma_boundary](name:flux_surface_averaged_hydrogen_density_at_plasma_boundary),
    and [flux_surface_averaged_ion_density_at_plasma_boundary](name:flux_surface_averaged_ion_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_plasma_boundary
  arguments:
  - name: iron_density_at_plasma_boundary
