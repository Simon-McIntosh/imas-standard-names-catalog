        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Elongation (\u03BA) of the plasma boundary, defined as the ratio\
        \ of the plasma's vertical half-height to its minor radius. A key MHD shaping\
        \ parameter characterizing the plasma cross-sectional geometry at the boundary."
      kind: llm
  - dd_path: summary/boundary/elongation/value
