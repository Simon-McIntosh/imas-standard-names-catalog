- name: vertical_magnetization_of_iron_core_segment
  kind: scalar
  status: active
  description: "Vertical component of an iron-core segment\u2019s magnetization, expressed\
    \ as the equivalent magnetic flux density \u03BC0MZ in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is the vertical component of the magnetization assigned
    to an iron-core segment, expressed as an equivalent magnetic flux density. The
    segment magnetization is treated as uniform, and this quantity is distinct from
    the total magnetic field produced by the plasma, coils, currents, and magnetized
    materials.


    $$

    B_{M,Z} = \mu_0 M_Z

    $$


    where $B_{M,Z}$ is the equivalent vertical magnetization flux density, $M_Z =
    \mathbf{M} \cdot \hat{Z}$ is the vertical component of the magnetization vector,
    and $\mu_0$ is the vacuum permeability. The vertical direction is $\hat{Z}$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame. The corresponding radial component
    is [radial magnetization of an iron-core segment](name:radial_magnetization_of_iron_core_segment).


    Sign convention: Positive when $M_Z$ points in the direction of increasing vertical
    coordinate $Z`.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetization_of_iron_core_segment
  sources:
  - dd_path: equilibrium/time_slice/constraints/iron_core_segment/magnetization_z/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-iron_core_segment-magnetization_z-measured
    dd_documentation:
