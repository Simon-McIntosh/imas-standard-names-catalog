    dd_path: plasma_profiles/ggd/a_field/r
    status: composed
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: Safety factor q evaluated at the magnetic axis, the innermost closed
    flux surface, quantifying the field-line helicity at the plasma core.
  documentation: "The safety factor at the magnetic axis, $q_0 = q(\\psi_{\\text{axis}})$,\
    \ measures the number of toroidal transits a magnetic field line makes per single\
    \ poloidal circuit on the innermost flux surface. It is defined via the differential\
    \ relation $q = d\\Phi_{\\text{tor}} / d\\Phi_{\\text{pol}}$, where $\\Phi_{\\\
    text{tor}}$ and $\\Phi_{\\text{pol}}$ are the toroidal and poloidal magnetic fluxes,\
    \ respectively. In conventional tokamak H-mode plasmas, $q_0$ is typically near\
    \ unity (0.8\u20131.2) and is a critical MHD stability indicator; $q_0 < 1$ drives\
    \ sawtooth oscillations, while $q_0 > 1$ generally indicates a sawtooth-stable\
    \ core. The quantity is routinely inferred from equilibrium reconstruction codes\
    \ using external magnetics, motional Stark effect diagnostics, and polarimetry.\
    \ It is intimately related to the radial magnetic shear `[magnetic_shear_of_magnetic_axis](name:magnetic_shear_of_magnetic_axis)`\
    \ and provides the boundary condition for the `[safety_factor](name:safety_factor)`\
    \ profile. \n\nSign convention: Positive when the poloidal flux decreases radially\
    \ outward for a plasma current in the positive toroidal direction."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_of_magnetic_axis
  - name:safety_factor
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_axis
    dd_path: equilibrium/time_slice/global_quantities/q_axis
    status: composed
  - id: dd:summary/local/magnetic_axis/q/value
    dd_path: summary/local/magnetic_axis/q/value
    status: composed
- name: toroidal_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of the total electric current
    density in the plasma.
  documentation: 'The toroidal current density $j_\phi = \langle \mathbf{j} \cdot
    \hat{\phi} \rangle$ quantifies the net flow of electric charge per unit area in
    the geometric toroidal direction, averaged over a flux surface. This quantity
    is a fundamental input to MHD equilibrium reconstruction and determines the poloidal
    magnetic field via $\nabla \times \mathbf{B} = \mu_0 \mathbf{j}$. It is typically
    inferred from equilibrium reconstruction codes using external magnetic measurements
    and internal constraints such as Motional Stark Effect data. In a tokamak, the
    toroidal current density profile is the sum of inductive (ohmic) and non-inductive
    contributions, including the bootstrap current and externally driven currents.
    The flux-surface average is defined as $\langle j_\phi \rangle = \langle J_\phi
    / R \rangle / \langle 1 / R \rangle$, where $J_\phi$ is the local toroidal current
    density and $R$ is the major radius. The radial integral of $j_\phi$ across the
    plasma cross-section yields the total plasma current $I_p$.


    Sign convention: Positive when the current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: A.m^-2
  physics_domain: equilibrium
  links: []
  arguments:
