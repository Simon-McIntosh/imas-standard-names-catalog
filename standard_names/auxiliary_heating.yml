- name: toroidal_angle_of_electron_cyclotron_beam
  kind: scalar
  status: draft
  description: Toroidal steering angle of an electron cyclotron beam, defined by the
    arc sine of the toroidal wave-vector component divided by the total wave-vector
    magnitude. It specifies the signed toroidal part of propagation in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The toroidal angle of an electron cyclotron beam is the signed steering
    angle associated with the toroidal component of the beam''s local mean wave vector.
    It measures how much of the propagation direction is along $\hat{\phi}$ rather
    than within the plane spanned by $R$ and $Z$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    The angle is defined from the projection of the wave vector onto the toroidal
    basis direction:


    $$

    \alpha_\phi = \sin^{-1}\!\left(\frac{k_\phi}{|\mathbf{k}|}\right)

    $$


    where $\alpha_\phi$ is the toroidal beam angle, $k_\phi$ is the component of the
    mean wave vector along $\hat{\phi}$, and $|\mathbf{k}|$ is the total wave-vector
    magnitude. Both $k_\phi$ and $|\mathbf{k}|$ have units of rad m$^{-1}$, equivalently
    m$^{-1}$ when radians are treated as dimensionless, so the ratio is dimensionless
    and $\alpha_\phi$ is in rad.


    In practice, this angle is determined from EC launcher geometry, calibrated steering-mirror
    orientation, or ray and beam-tracing calculations by decomposing the mean wave
    vector in the right-handed cylindrical $(R,\phi,Z)$ frame. Together with [poloidal_angle_of_electron_cyclotron_beam](name:poloidal_angle_of_electron_cyclotron_beam),
    launch position, frequency, and magnetic geometry, it contributes to the parallel
    refractive index through the local projection $N_\parallel = c\,\mathbf{k}\cdot\hat{\mathbf{b}}/\omega$,
    where $\hat{\mathbf{b}}$ is the unit vector along the magnetic field, $\omega$
    is the wave angular frequency, and $c$ is the speed of light. The toroidal angle
    controls the $k_\phi$ part of that projection but does not by itself determine
    $N_\parallel$ because the magnetic-field pitch and the poloidal propagation component
    also enter; it is complementary to EC beam power, which specifies wave energy
    flow rather than propagation direction.


    Typical values are launcher dependent. The principal-value definition gives a
    mathematical interval from $-\pi/2$ to $+\pi/2$ rad; EC heating launch is often
    near zero toroidal angle, while current-drive-oriented launch commonly uses nonzero
    angles of order a few tenths of a rad. Hardware steering limits and access constraints
    determine the available range for a given device.


    Sign convention: Positive when the toroidal component of the beam wave vector
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_angle_of_electron_cyclotron_beam
  sources:
  - id: dd:ec_launchers/beam/steering_angle_tor
    dd_path: ec_launchers/beam/steering_angle_tor
    status: composed
  - id: dd:summary/heating_current_drive/ec/angle_tor/value
    dd_path: summary/heating_current_drive/ec/angle_tor/value
    status: attached
- name: toroidal_angle_of_launching_position
  kind: scalar
  status: draft
  description: "Toroidal angle of the physical point from which a heating wave or\
    \ particle beam is launched, measured in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The toroidal angle of a launching position is the azimuthal coordinate
    of the launch point around the toroidal symmetry axis. It is defined in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    For a launch point with horizontal Cartesian coordinates $(x_\mathrm{launch},
    y_\mathrm{launch})$ in a right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame with $\hat{z}=\hat{Z}$, the coordinate can be written as:


    $$

    \phi_\mathrm{launch} = \operatorname{atan2}(y_\mathrm{launch}, x_\mathrm{launch})
    \bmod 2\pi

    $$


    where the $x$ axis defines the $\phi=0$ direction and $\operatorname{atan2}$ selects
    the correct quadrant.


    In practice, this angle is determined from the surveyed or modeled geometry of
    the launcher reference point, such as the aperture, antenna phase center, or beam-origin
    point. It specifies the toroidal location of the source point; separate direction
    angles or wave-vector components describe the launch orientation.


    Typical values span the full toroidal range, most commonly reported as 0-6.283
    rad. Fixed launchers usually have values set by port locations, while movable
    or multiple launch systems may provide several discrete toroidal positions.


    Sign convention: Positive when angular displacement from the $\phi=0$ direction
    is in the direction of increasing toroidal angle $\phi$, counter-clockwise when
    viewed from above $+\hat{Z}$.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_measurement_position
