name: effective_charge_at_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Effective ion charge $Z_{\rm eff}$ evaluated at the magnetic axis, quantifying
  plasma impurity content at the core center.
documentation: "The effective charge $Z_{\\rm eff} = \\sum_s n_s Z_s^2 / n_e$ (where\
  \ $n_s$ and $Z_s$ are the density and charge number of ion species $s$, and $n_e$\
  \ is the electron density) characterizes the mean squared charge state of the ion\
  \ population at the magnetic axis. A pure hydrogen plasma yields $Z_{\\rm eff} =\
  \ 1$; values above unity indicate the presence of impurities that enhance resistivity,\
  \ bremsstrahlung radiation, and fuel dilution. On-axis $Z_{\\rm eff}$ typically\
  \ lies in the range 1.0\u20133.0 in well-conditioned tokamaks and can exceed 4 in\
  \ heavily impurity-seeded discharges. The quantity is commonly inferred from visible\
  \ bremsstrahlung measurements along chords passing through the core, or from charge-exchange\
  \ recombination spectroscopy combined with electron density profiles. See also `effective_charge_at_pedestal`\
  \ and `effective_charge_at_plasma_boundary` for the same quantity at other radial\
  \ locations."
