- name: maximum_gas_flow
  kind: scalar
  status: active
  description: Maximum gas flow is the largest pressure-volume throughput that a gas
    injection valve can reliably deliver, defining the upper bound of its controllable
    range.
  documentation: 'Maximum gas flow is the upper reliable operating limit of the pressure-volume
    throughput delivered by a gas injection valve. It represents the aggregate gas
    stream rather than a particular molecular species, charge state, mass flow, or
    particle-number rate.


    The defining pressure-volume throughput at the upper delivery limit is


    $$

    Q_g^{\max} = p_g \frac{dV_g}{dt}

    $$


    where $Q_g^{\max}$ is the maximum gas pressure-volume throughput, $p_g$ is the
    gas pressure at the flow boundary, $V_g$ is the volume of gas crossing that boundary,
    and $t$ is time.


    This quantity applies to gas delivered through a gas injection valve for fueling,
    impurity seeding, or disruption mitigation. The maximum qualifier denotes a reliable
    upper delivery limit for the aggregate gas stream, not a species-resolved flow,
    mass-flow rate, or particle-number rate.


    The quantity is the upper-bound member of the [gas flow](name:gas_flow) family:
    gas flow denotes the same pressure-volume throughput without an upper-limit restriction,
    while [minimum gas flow](name:minimum_gas_flow) denotes its lower reliable operating
    limit.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:gas_flow
  - name:minimum_gas_flow
  arguments:
  - name: gas_flow
    operator: maximum
    operator_kind: qualifier
  sources:
  - dd_path: gas_injection/valve/flow_rate_max
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gas_injection.html#gas_injection-valve-flow_rate_max
    dd_documentation:
      leaf: Maximum flow rate of the valve
      parent_path: gas_injection/valve
      parent: Set of valves connecting a gas bottle to pipes
      data_type: FLT_0D
      unit: Pa.m^3.s^-1
    enhanced_context:
      description: Maximum volumetric flow rate of a gas injection valve. An engineering
        limit parameter defining the peak throughput capacity of the valve for fuelling,
        impurity seeding, or disruption mitigation.
      kind: llm
- name: minimum_gas_flow
  kind: scalar
  status: active
  description: Minimum gas flow is the smallest pressure-volume gas throughput that
    a gas injection valve can reliably deliver, defining the lower bound of its controllable
    range.
  documentation: 'Minimum gas flow is the lower reliable operating limit of the pressure-volume
    throughput delivered by a gas injection valve. It identifies the smallest controllable
    value of the aggregate gas stream throughput, rather than a molecular-species
    flow or particle-number rate.


    The pressure-volume throughput represented by this quantity is defined as


    $$

    Q_g = p_g \frac{dV_g}{dt}

    $$


    where $Q_g$ is gas pressure-volume throughput, $p_g$ is gas pressure at the flow
    boundary, $V_g$ is the volume of gas crossing that boundary, and $t$ is time.


    This quantity applies to the aggregate gas stream delivered through an injection
    system across a defined flow boundary. The stream is not restricted to a particular
    molecular species or charge state, and this quantity is distinct from mass flow
    and particle-number rate. Its defining distinction is the lower reliable operating
    bound, rather than an unrestricted instantaneous throughput.


    The [gas flow](name:gas_flow) quantity defines the same pressure-volume throughput
    without imposing a lower-limit condition; minimum gas flow is its lower reliable
    operating bound. Conversely, [maximum gas flow](name:maximum_gas_flow) is the
    upper reliable operating bound, so the two quantities delimit the controllable
    range rather than represent different throughput definitions.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:gas_flow
  - name:maximum_gas_flow
  arguments:
  - name: gas_flow
    operator: minimum
    operator_kind: qualifier
  sources:
  - dd_path: gas_injection/valve/flow_rate_min
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gas_injection.html#gas_injection-valve-flow_rate_min
    dd_documentation:
      leaf: Minimum flow rate of the valve
      parent_path: gas_injection/valve
      parent: Set of valves connecting a gas bottle to pipes
      data_type: FLT_0D
      unit: Pa.m^3.s^-1
    enhanced_context:
      description: Minimum volumetric flow rate of a gas injection valve, specifying
        the lower operational bound on gas throughput. Used as an engineering constraint
        in density control and gas injection system design.
      kind: llm
- name: total_neutral_source_rate_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron source rate of neutral gas introduced
    into the vessel by gas injection, summed over all injected species.
  documentation: 'This quantity is the instantaneous neutral-gas throughput supplied
    to the vessel by gas injection, expressed as an equivalent-electron rate. It combines
    all injected neutral species rather than representing one gas species.


    For the set of injected species, the equivalent-electron rate is defined by:


    $$

    \dot{N}_{\mathrm{eq}} = \sum_{s \in \mathcal{S}} Z_s\,\dot{N}_s

    $$


    where $\dot{N}_{\mathrm{eq}}$ is the total equivalent-electron source rate, $\mathcal{S}$
    is the set of injected neutral gas species, $\dot{N}_s$ is the particle injection
    rate of species $s$, and $Z_s$ is the equivalent-electron weighting per injected
    particle. For an atomic species, $Z_s$ is its atomic number; for a molecule, it
    is the sum of the atomic numbers of its constituent atoms.


    The quantity applies to the vessel-level gas input and is aggregated by summing
    over all injected neutral species. It is an instantaneous rate, not a time-integrated
    inventory, and excludes ionization and subsequent plasma particle sources. Species-resolved
    rates such as the [hydrogen source rate due to gas injection](name:hydrogen_source_rate_due_to_gas_injection)
    provide individual contributions to this total. Unlike the [total lower gas source
    rate of the vacuum vessel due to gas injection](name:total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection),
    it is not restricted to the lower vessel region.


    The corresponding accumulated quantity, such as the [accumulated hydrogen count
    due to gas injection](name:accumulated_hydrogen_count_due_to_gas_injection), is
    obtained by time integration and represents delivered inventory rather than instantaneous
    throughput.'
  unit: s^-1
  physics_domain: plant_systems
  links: []
  sources:
  - dd_path: summary/gas_injection_rates/total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-total-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_rates/total
      parent: Total gas injection rate (sum over species)
      data_type: FLT_1D
      unit: s^-1
      coordinates:
      - summary/time
    enhanced_context:
      description: Total gas injection rate (sum over species).
      kind: template
- name: normalized_toroidal_flux_coordinate_at_pellet_path
  kind: scalar
  status: active
  description: "Normalized toroidal magnetic-flux surface label assigned to each pellet\
    \ location, identifying the nested magnetic surface reached along the pellet\u2019\
    s in-plasma ablation trajectory."
  documentation: "This quantity identifies the nested magnetic surface containing\
    \ the pellet at a specified location along its in-plasma ablation trajectory.\
    \ It is a magnetic-surface coordinate, not a cylindrical distance or a local vector\
    \ component.\n\nAt pellet position $\\mathbf{x}_{\\mathrm p}$, the normalized\
    \ toroidal flux coordinate is defined by\n\n$$\n\\rho_{\\mathrm{tor,norm}}(\\\
    mathbf{x}_{\\mathrm p}) = \\left[\\frac{\\Phi_{\\mathrm{tor}}(\\mathbf{x}_{\\\
    mathrm p}) - \\Phi_{\\mathrm{tor,axis}}}{\\Phi_{\\mathrm{tor,boundary}} - \\Phi_{\\\
    mathrm{tor,axis}}}\\right]^{1/2}\n$$\n\nwhere $\\rho_{\\mathrm{tor,norm}}$ is\
    \ the normalized toroidal flux coordinate, $\\mathbf{x}_{\\mathrm p}$ is the pellet\
    \ position, $\\Phi_{\\mathrm{tor}}(\\mathbf{x}_{\\mathrm p})$ is the toroidal\
    \ magnetic flux labeling the magnetic surface through that position, $\\Phi_{\\\
    mathrm{tor,axis}}$ is its value at the magnetic axis, and $\\Phi_{\\mathrm{tor,boundary}}$\
    \ is its value at the equilibrium boundary. The position is interpreted in the\
    \ right-handed cylindrical $(R,\\phi,Z)$ frame, where $R$ is major radius, $\\\
    phi$ is toroidal angle, and $Z$ is vertical height.\n\nThe scope is the pellet\u2019\
    s in-plasma ablation trajectory, with the coordinate evaluated pointwise at each\
    \ pellet location. It does not represent distance traveled along the path, a path\
    \ integral, an average over the trajectory, or an aggregate over multiple pellets.\n\
    \nThis is the locus-specific realization of the [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate).\
    \ The axis and boundary references set the coordinate endpoints, so the value\
    \ increases outward across nested magnetic surfaces while remaining distinct from\
    \ a cylindrical radial coordinate."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:normalized_toroidal_flux_coordinate
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: pellet_path
    operator_kind: locus
  sources:
  - dd_path: pellets/time_slice/pellet/path_profiles/rho_tor_norm
    dd_version: 4.1.1
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.1/generated/ids/pellets.html#pellets-time_slice-pellet-path_profiles-rho_tor_norm
    dd_documentation:
      leaf: 'Normalised toroidal coordinate along the pellet path '
      parent_path: pellets/time_slice/pellet/path_profiles
      parent: '1-D profiles of plasma and pellet along the pellet path '
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - pellets/time_slice/pellet/path_profiles/distance
    enhanced_context:
      description: "Normalised toroidal flux coordinate (\u03C1_tor_norm) sampled\
        \ along the pellet ablation path as a 1D profile. Maps each pellet position\
        \ to the corresponding flux surface label, indicating the radial location\
        \ of the pellet as it ablates."
      kind: llm
- name: radial_coordinate_of_shatter_cone
  kind: scalar
  status: active
  description: Major-radius coordinate of the shatter-cone origin, locating its reference
    point by perpendicular distance from the toroidal symmetry axis.
  documentation: 'The radial coordinate of a shatter-cone origin is the major-radius
    location of that geometric reference point relative to the toroidal symmetry axis.
    It is the $R$ coordinate in the right-handed cylindrical $(R, \phi, Z)$ frame,
    with basis vectors $(\hat{R}, \hat{\phi}, \hat{Z})$ satisfying $\hat{R} \times
    \hat{\phi} = \hat{Z}$.


    This quantity applies specifically to the origin of the elliptic shatter cone.
    It denotes one geometric coordinate of that reference point, with no averaging,
    integration, or aggregation over the cone surface, its axis, or injected fragments;
    it is distinct from radial coordinates assigned to other injector features or
    positions.


    It is a locus-specific specialization of [radial coordinate](name:radial_coordinate):
    the parent defines the major-radius coordinate generally, while this quantity
    evaluates it at the shatter-cone origin.'
  unit: m
  physics_domain: plant_systems
  links: []
  sources:
  - dd_path: spi/injector/shatter_cone/origin/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spi.html#spi-injector-shatter_cone-origin-r
    dd_documentation:
      leaf: Major radius
      parent_path: spi/injector/shatter_cone/origin
      parent: Coordinates of the origin of the shatter cone
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of origin.
      kind: template
