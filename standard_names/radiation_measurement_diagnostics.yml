- name: vertical_angle_of_detector_pixel
  kind: scalar
  status: draft
  description: Vertical viewing angle of a detector pixel, defined as the signed elevation
    offset of that pixel's line of sight from the camera optical axis. Together with
    the horizontal pixel angle, it specifies the ray direction within the camera field
    of view.
  documentation: 'Vertical angle of a detector pixel is the signed elevation angle,
    denoted $\beta$, between the pixel line of sight and the camera optical axis,
    measured in the vertical direction of the camera image plane. Both $\beta$ and
    the related horizontal angle $\alpha$ are angular quantities expressed in radians;
    the horizontal counterpart is [alpha angle], and angular acceptance limits may
    be represented by an [upper bound angle].


    In a camera-centered right-handed orthonormal basis $(\hat{h}, \hat{v}, \hat{o})$,
    where $\hat{o}$ points along the optical axis from the camera into the observed
    scene, $\hat{v}$ is the positive vertical direction in the image plane, and $\hat{h}
    \times \hat{v} = \hat{o}$, the vertical angular coordinate of a unit line-of-sight
    direction $\hat{\ell}$ can be written as:


    $$

    \beta = \operatorname{atan2}\!\left(\hat{\ell}\cdot\hat{v},\,\hat{\ell}\cdot\hat{o}\right)

    $$


    where $\operatorname{atan2}$ preserves the sign of the vertical offset and returns
    the angle in radians. For optical systems with distortion or relay optics, this
    expression represents the equivalent calibrated angular coordinate of the ray
    rather than a simple linear detector-coordinate mapping.


    The angle is obtained from optical calibration of the camera, including the lens
    model, detector geometry, alignment of the optical axis, and any mirrors or windows
    in the viewing path. It is used with the horizontal angle to reconstruct the three-dimensional
    line of sight for visible-light measurements and to relate each detector element
    to the observed plasma or wall region.


    Typical values span about $-0.5$-$0.5$ rad for wide-angle views and about $-0.1$-$0.1$
    rad for narrow views; adjacent detector pixels often differ by $10^{-5}$-$10^{-3}$
    rad depending on focal length and detector pitch.


    Sign convention: Positive when the line of sight is tilted from the optical axis
    toward $+\hat{v}$ in the camera-centered right-handed basis $(\hat{h}, \hat{v},
    \hat{o})$.'
  unit: rad
