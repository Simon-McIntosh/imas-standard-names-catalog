name: electron_radiated_power_inside_flux_surface
status: draft
description: Cumulative electromagnetic power radiated by electron processes, volume-integrated
  from the magnetic axis out to a given flux surface.
documentation: The electron radiated power inside a flux surface is defined as $$P_{\mathrm{rad},e}(\psi)
  = \int_{V(\psi)} \epsilon_e(\mathbf{r})\, dV,$$ where $\epsilon_e$ ($\mathrm{W\,m^{-3}}$)
  is the local electron emissivity encompassing bremsstrahlung ($\propto n_e^2 Z_{\mathrm{eff}}
  T_e^{1/2}$), line radiation, and recombination, and $V(\psi)$ is the volume enclosed
  by the flux surface labeled by poloidal flux $\psi$. Here $n_e$ is the electron
  density ($\mathrm{m^{-3}}$), $Z_{\mathrm{eff}}$ the effective charge, and $T_e$
  the electron temperature (eV). The radial derivative $dP_{\mathrm{rad},e}/dV$ recovers
  the local emissivity profile, making this cumulative form convenient for power-balance
  analyses. Typical integrated values range from hundreds of kW in medium-size tokamaks
  (ASDEX Upgrade, DIII-D) to several MW in ITER-class scenarios. Derived from bolometric
  tomography or computed by radiation-transport codes (e.g., CHERAB, STRAHL). Synchrotron
  (electron-cyclotron) radiation may become significant at $T_e \gtrsim 15$ keV. See
  `electron_radiated_power_density` for the local emissivity, `ion_radiated_power_inside_flux_surface`
  for the ion channel, and `total_radiated_power` for the fully integrated quantity.
