- name: normalized_frequency_of_gyrokinetic_eigenmode
  kind: scalar
  status: draft
  description: Dimensionless real oscillation frequency of a linear gyrokinetic eigenmode
    at a specified wavevector and flux surface, divided by the reference angular frequency
    used in the gyrokinetic normalization. Its sign describes phase propagation relative
    to the chosen binormal wavevector orientation.
  documentation: 'Normalized frequency of a gyrokinetic eigenmode is the real oscillation
    frequency of a linear eigenmode divided by the positive reference angular frequency
    used to non-dimensionalize the gyrokinetic equations. It is the real part of the
    normalized complex eigenfrequency and is complementary to the [normalized linear
    growth rate](name:normalized_linear_growth_rate_of_gyrokinetic_eigenmode). The
    value applies to the specified equilibrium flux surface and perpendicular wavevector,
    not to an unrestricted global spectrum.


    The normalized real frequency is defined by


    $$

    \omega_N = \frac{\omega_r}{\omega_\mathrm{ref}}

    $$


    where $\omega_r$ is the real part of the complex eigenfrequency $\Omega = \omega_r
    + i\gamma$, $\gamma$ is the linear growth rate, and both $\omega_r$ and $\omega_\mathrm{ref}$
    are angular frequencies in rad s^-1. The reference angular frequency $\omega_\mathrm{ref}$
    is positive and must be the same normalization used for the corresponding gyrokinetic
    eigenvalue problem.


    In practice, this quantity is obtained from a linear gyrokinetic eigenvalue calculation
    for a specified plasma equilibrium, flux surface, and perpendicular wavevector.
    In field-aligned flux coordinates $(\psi,\alpha,\theta)$, where $\psi$ is a radial
    flux label, $\alpha$ is a binormal field-line label, and $\theta$ is a poloidal
    angle, the perpendicular wavevector may be represented by radial and binormal
    components such as $k_\psi$ and $k_\alpha$ or by local equivalents such as $k_x$
    and $k_y$. Interpreting the sign in terms of ion- or electron-diamagnetic propagation
    requires the same choice of binormal direction and wavevector sign used in the
    calculation.


    Typical absolute values are normalization-dependent. In many ion-scale linear
    microinstability studies, $|\omega_N|$ is of order 0.1-10, with values near zero
    for nearly stationary modes and larger values possible for electron-scale modes
    or for different reference-frequency choices.


    Sign convention: Positive when, for perturbations proportional to $\exp[i(k_\psi\psi+k_\alpha\alpha)-i\omega_r
    t]$, the wave phase propagates in the $+\alpha$ binormal direction for positive
    $k_\alpha$ in the chosen field-aligned flux coordinates $(\psi,\alpha,\theta)$.'
  unit: '1'
  physics_domain: turbulence
