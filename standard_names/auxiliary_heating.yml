- name: per_toroidal_mode_thermal_ion_power_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Wave power absorbed by the thermal ion population, integrated over
    the plasma volume and resolved per toroidal mode number.
  documentation: 'This quantity represents the total, volume-integrated power deposited
    onto the thermal ion population by a coherent electromagnetic wave, decomposed
    by the toroidal mode number $n_\phi$ of the wave. It is obtained by summing the
    local absorbed power density over the plasma volume for each toroidal harmonic.
    The power transferred to thermal ions is a key figure of merit for heating schemes
    such as ion cyclotron resonance heating (ICRH).


    Typical values for this quantity in high-power ICRH scenarios range from a few
    MW up to tens of MW, depending on the auxiliary heating power, plasma parameters,
    and antenna coupling efficiency. The toroidal mode spectrum is determined by the
    antenna geometry and plasma response. This quantity differs from the volumetric
    power density resolved per toroidal mode, `[per_toroidal_mode_thermal_ion_absorbed_wave_power_density](name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density)`,
    by being an integrated total. It is also related to the total power absorbed by
    all thermal species, `[thermal_ion_absorbed_power_due_to_wave_particle_interaction](name:thermal_ion_absorbed_power_due_to_wave_particle_interaction)`,
    which sums over all toroidal mode numbers.


    Sign convention: Positive when net power flows from the wave field to the thermal
    ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density
  - name:thermal_ion_absorbed_power_due_to_wave_particle_interaction
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_thermal_n_phi
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_thermal_n_phi
    status: composed
- name: perpendicular_refractive_index
  kind: scalar
  status: draft
  description: Component of the wave refractive index perpendicular to the local magnetic
    field direction.
  documentation: "The perpendicular refractive index $n_{\\perp} = \\mathbf{n} \\\
    cdot \\hat{e}_{\\perp}$ is the projection of the refractive index vector $\\mathbf{n}\
    \ = c\\mathbf{k}/\\omega$ onto the direction perpendicular to the local magnetic\
    \ field, where $c$ is the speed of light, $\\mathbf{k}$ is the wave vector, and\
    \ $\\omega$ is the wave angular frequency. Together with the [parallel refractive\
    \ index](name:parallel_refractive_index), this component determines the propagation\
    \ and polarization of electromagnetic waves in the magnetized plasma, governing\
    \ the accessibility conditions for electron cyclotron resonance heating. In beam-tracing\
    \ codes for ECRH, $n_{\\perp}$ is evaluated along the ray path using the cold-plasma\
    \ or warm-plasma dispersion relation; typical values range from 0.5 to 2.0 in\
    \ the plasma core for O-mode and X-mode waves at 100\u2013200 GHz.\n\nSign convention:\
    \ Positive when $n_{\\perp}$ points in the direction of increasing $\\mathbf{k}\
    \ \\cdot \\hat{e}_{\\perp}$.\n\nSee [refractive_index](name:refractive_index)\
    \ for the full vector description."
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:parallel_refractive_index
  - name:refractive_index
  arguments:
  - name: refractive_index
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
