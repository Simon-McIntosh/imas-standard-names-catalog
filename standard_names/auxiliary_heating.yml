- name: radial_coordinate_of_lower_hybrid_antenna_row
  kind: scalar
  status: active
  description: "The radial coordinate is the major-radius coordinate of the lower-hybrid\
    \ antenna-row geometric reference point: its perpendicular distance from the toroidal\
    \ symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame, where Z\
    \ is vertical height."
  documentation: 'The radial coordinate of a lower-hybrid antenna row is the major-radius
    coordinate $R$ of the row geometric reference point in the right-handed cylindrical
    $(R, \phi, Z)$ frame. The coordinate $R$ is the perpendicular distance from the
    toroidal symmetry axis, $\phi$ is the toroidal angle increasing counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height.


    When the same reference point is represented by Cartesian coordinates $(x, y,
    z)$ in a right-handed Cartesian basis $(\hat{x}, \hat{y}, \hat{z})$ with $\hat{z}=\hat{Z}$
    and origin on the toroidal symmetry axis, the major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates of the row reference
    point and $R$ is measured in meters.


    This quantity is a position coordinate of the antenna-row reference point, not
    a local coordinate normal to the antenna mouth and not a plasma or wave-launching
    parameter. It should refer to the same geometric reference point as toroidal_angle_of_lower_hybrid_antenna_row
    and [vertical_coordinate_of_lower_hybrid_antenna_row](name:vertical_coordinate_of_lower_hybrid_antenna_row).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_lower_hybrid_antenna_row
  sources:
  - dd_path: lh_antennas/antenna/distance_to_antenna
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/lh_antennas.html#lh_antennas-antenna-distance_to_antenna
