name: exposure_time_of_neutron_detector
status: draft
cocos_transformation_type: one_like
description: Duration over which a neutron detector integrates incident neutron flux
  to produce a single measurement sample.
documentation: "The exposure time $\\Delta t_{\\mathrm{exp}}$ (in s) defines the temporal\
  \ integration window of a neutron detector channel. During this interval the detector\
  \ accumulates counts or charge proportional to the incident neutron flux; the resulting\
  \ signal is reported as a single time-resolved data point. Shorter exposure times\
  \ improve temporal resolution at the expense of counting statistics, governed by\
  \ Poisson uncertainty $\\sigma_N \\approx \\sqrt{N}$ where $N$ is the number of\
  \ detected counts. Typical values range from $10^{-3}$ s for fast scintillator-based\
  \ neutron counters to $10^{0}$\u2013$10^{2}$ s for activation foil and fission chamber\
  \ systems. The exposure time must be distinguished from the detector fall time,\
  \ which characterizes the electronic signal decay response. See `deuterium_deuterium_neutron_emissivity`\
  \ for the volumetric neutron source profile and `converter_temperature_of_neutron_detector`\
  \ for the converter thermal state that may affect detection efficiency over the\
  \ integration window."
