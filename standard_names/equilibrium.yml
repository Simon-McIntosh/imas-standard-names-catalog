- name: toroidal_angle_of_control_surface
  kind: scalar
  status: active
  description: Toroidal angle locating each point of a control surface about the machine
    symmetry axis, measured in the right-handed cylindrical frame from the facility-defined
    zero direction.
  documentation: 'The toroidal angle identifies the azimuthal location of a point
    on the control surface about the machine symmetry axis. It is the geometrical
    coordinate defined for [toroidal angle](name:toroidal_angle), with the control-surface
    locus providing the points to which it applies.


    For a point with Cartesian coordinates $x$ and $y$ in the right-handed $(\hat{x},\hat{y},\hat{z})$
    basis, the angle in the right-handed cylindrical $(R,\phi,Z)$ frame is defined
    by:


    $$

    \phi = \operatorname{atan2}(y,x) \pmod{2\pi}

    $$


    where $R$ is the major radius, $Z$ is vertical height, and the zero of $\phi$
    follows the facility-defined reference direction. The angle is periodic, so values
    differing by an integer multiple of $2\pi$ represent the same toroidal direction;
    it is distinct from the [vertical coordinate of the control surface](name:vertical_coordinate_of_control_surface).


    Sign convention: Positive when $\phi$ increases counter-clockwise when viewed
    from above the $+\hat{Z}$ direction.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_control_surface
  sources:
  - dd_path: b_field_non_axisymmetric/time_slice/control_surface/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/b_field_non_axisymmetric.html#b_field_non_axisymmetric-time_slice-control_surface-phi
    dd_documentation:
      leaf: Toroidal angle array, on which the Fourier decomposition is carried out
      parent_path: b_field_non_axisymmetric/time_slice/control_surface
      parent: 'Magnetic field components and Fourier decomposition of the normal components
        of the magnetic field for a set of given control surfaces '
      data_type: FLT_1D
      unit: rad
      coordinates:
      - 1...N
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of control surface."
      kind: template
- name: toroidal_angle_of_measurement_position
  kind: scalar
  status: active
  description: "Toroidal angle of a measurement position is the azimuthal coordinate\
    \ of the specified point around the toroidal symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal angle of a measurement position is the azimuthal coordinate
    $\phi$ of the specified point associated with a measurement in the right-handed
    cylindrical $(R, \phi, Z)$ frame. In this frame, $R$ is major radius from the
    toroidal symmetry axis and $Z$ is vertical height.


    Together with the radial and vertical coordinates of the same locus, it specifies
    the measurement-position point. It is the measurement-position-specific form of
    [toroidal_angle](name:toroidal_angle); [toroidal_coordinate_of_measurement_position](name:toroidal_coordinate_of_measurement_position)
    and [toroidal_angle_of_line_of_sight](name:toroidal_angle_of_line_of_sight) are
    related angular-coordinate quantities for nearby geometric contexts. The coordinate
    is periodic modulo $2\pi$, with $0 \le \phi < 2\pi$ denoting one complete non-overlapping
    branch.


    Sign convention: Positive when $\phi$ increases counter-clockwise when viewed
    from above along $+\hat{Z}$.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:toroidal_angle_of_line_of_sight
  sources:
  - dd_path: b_field_non_axisymmetric/time_slice/field_map/grid/phi
