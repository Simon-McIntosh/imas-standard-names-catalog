- name: area_of_langmuir_probe
  kind: scalar
  status: draft
  description: Physical surface area of a Langmuir probe collector pin that is exposed
    to the plasma and collects charged particles.
  documentation: 'The exposed surface area $A_{\rm probe}$ of a Langmuir probe pin
    determines the ion and electron current collected by the probe.  The ion saturation
    current $I_{\rm sat} = e n_e c_s A_{\rm probe}$ depends linearly on this area,
    where $e$ is the elementary charge, $n_e$ is the electron density, and $c_s$ is
    the ion sound speed.  The effective collection area may differ from the geometric
    area due to sheath expansion, shadowing by nearby structures, or the probe orientation
    relative to the magnetic field.  Typical probe areas in tokamak edge studies range
    from $10^{-6}\,{\rm m}^2$ (fine pins) to $10^{-4}\,{\rm m}^2$ (larger collectors).  This
    quantity is the geometric area exposed to the plasma; the companion `[electron_density](name:electron_density)`
    and `[parallel_heat_flux](name:parallel_heat_flux)` are inferred from the measured
    currents using this area.


    Sign convention: Positive when the surface normal points in the direction of increasing
    coordinate for that surface element.'
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:electron_density
  - name:parallel_heat_flux
  sources:
  - id: dd:langmuir_probes/embedded/surface_area
    dd_path: langmuir_probes/embedded/surface_area
    status: composed
- name: area_of_reciprocating_probe
  kind: scalar
  status: draft
  description: Physical surface area of a reciprocating Langmuir probe collector that
    is exposed to the plasma and collects charged particles.
  documentation: 'The surface area of a reciprocating probe collector determines the
    collected ion saturation current $I_{\rm sat} = e n_e c_s A_{\rm eff}$ for a given
    electron density $n_e$ and sound speed $c_s$, where $e$ is the elementary charge.
    This area is typically treated as constant during a probe plunge, assuming negligible
    dependence on the magnetic field line angle. The effective collecting area may
    differ from the geometric surface area due to sheath expansion, shadowing, or
    the probe''s orientation relative to the magnetic field. Typical reciprocating
    probe collector areas range from $10^{-6}$ to $10^{-4}$ m$^2$ in tokamak scrape-off
    layer measurements. See also [area_of_langmuir_probe](name:area_of_langmuir_probe)
    for fixed Langmuir probes, and [electron_density](name:electron_density) for the
    quantity derived using this area.


    Sign convention: Positive when the exposed surface area faces the plasma, defined
    as a positive scalar quantity.


    The effective collecting area is often smaller than the geometric surface area,
    and corrections accounting for the probe''s orientation relative to the magnetic
    field may be applied in data analysis. The exposed area is defined as the portion
    of the probe collector surface in direct contact with the plasma, excluding insulated
    or shielded regions.'
  unit: m^2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:area_of_langmuir_probe
  - name:electron_density
  sources:
  - id: dd:langmuir_probes/reciprocating/surface_area
    dd_path: langmuir_probes/reciprocating/surface_area
    status: composed
- name: current_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Electron emission current from the hot filament used to ionize residual
    gas molecules in a mass spectrometer, providing the source of ionizing electrons.
  documentation: The emission current is the electron current drawn from the heated
    filament cathode of a mass spectrometer (also known as a residual gas analyzer,
    RGA). This current controls the rate of electron-impact ionization of neutral
    gas molecules in the spectrometer's ion source. Typical values range from 0.1
    to 10 mA, with higher currents increasing sensitivity at the cost of faster filament
    aging. The emission current must be stabilized against filament temperature drift
    to ensure reproducible ion currents at the detector. It is distinct from the collected
    ion current, which is the current measured at a specific mass channel (see [ion_current_of_mass_spectrometer_channel](name:ion_current_of_mass_spectrometer_channel)).
    The emission current and the detector high voltage (see [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel))
    together define the spectrometer operating point.
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_current_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/emission_current
    dd_path: spectrometer_mass/emission_current
    status: composed
  - id: dd:spectrometer_mass/residual_spectrum/current
    dd_path: spectrometer_mass/residual_spectrum/current
    status: composed
- name: ion_current_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Ion current measured by a mass spectrometer channel tuned to a specific
    atomic mass, used for neutral gas composition analysis.
  documentation: The ion current $I_{\mathrm{ion}}$ collected by a mass spectrometer
    channel (residual gas analyzer) measures the abundance of a specific gas species
    after electron-impact ionization. The channel is tuned to a particular mass-to-charge
    ratio $m/z$ via a quadrupole mass filter or magnetic sector, producing a current
    proportional to the partial pressure of that species. Typical currents range from
    $10^{-12}$ to $10^{-6}$ A depending on gas pressure, ionization efficiency, and
    detector gain. This measurement is commonly used for fuel composition monitoring,
    impurity tracking, and leak detection in fusion devices. See also [current_of_mass_spectrometer_channel](name:current_of_mass_spectrometer_channel)
    for the filament emission current and [voltage_of_mass_spectrometer_channel](name:voltage_of_mass_spectrometer_channel)
    for the detector bias setting.
  unit: A
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:current_of_mass_spectrometer_channel
  - name:voltage_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/channel/current
    dd_path: spectrometer_mass/channel/current
    status: composed
- name: major_radius_of_langmuir_probe
  kind: scalar
  status: draft
  description: "Major radial coordinate (R) specifying the static position of a Langmuir\
    \ probe in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The major radius $R_{\text{probe}}$ defines the radial distance
    from the machine symmetry axis to the fixed Langmuir probe position in the right-handed
    cylindrical $(R, \phi, Z)$ frame. This coordinate is established during probe
    installation and does not vary during plasma operation; it is critical for mapping
    the probe''s measurements to the local flux-surface geometry. Typical values for
    reciprocating probes in the scrape-off layer range from $R_{\text{sep}} - 0.1$
    m to $R_{\text{sep}} + 0.2$ m, where $R_{\text{sep}}$ is the separatrix major
    radius. The static position is measured directly during probe design or assembly;
    dynamic scans during a discharge are tracked separately by the reciprocating mechanism.


    Sign convention: Positive when the probe is farther from the machine symmetry
    axis along the $+\hat{R}$ direction.


    See also [vertical_coordinate_of_langmuir_probe](name:vertical_coordinate_of_langmuir_probe)
    for the corresponding vertical coordinate and [major_radius_of_reciprocating_probe](name:major_radius_of_reciprocating_probe)
    for the dynamic position of a moving probe.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_langmuir_probe
  - name:major_radius_of_reciprocating_probe
  sources:
  - id: dd:langmuir_probes/embedded/position/r
    dd_path: langmuir_probes/embedded/position/r
    status: composed
  - id: dd:langmuir_probes/probe/position_static/r
    dd_path: langmuir_probes/probe/position_static/r
    status: composed
- name: major_radius_of_reciprocating_probe
  kind: scalar
  status: draft
  description: Radial position coordinate in the IMAS right-handed cylindrical $(R,
    \phi, Z)$ frame for a reciprocating probe collector during its plunge into the
    plasma edge.
  documentation: "The major radius $R$ of the reciprocating probe collector positions\
    \ the probe within the tokamak poloidal cross-section, defining its radial location\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ coordinate system. During a\
    \ plunge, the collector moves radially from the vessel wall through the scrape-off\
    \ layer into the plasma edge; $R$ marks its instantaneous location along this\
    \ trajectory, typically in the range $R = 1.5$\u2013$2.5\\,\\text{m}$ for medium-size\
    \ tokamaks. The vertical partner coordinate is given by [vertical_coordinate_of_reciprocating_probe](name:vertical_coordinate_of_reciprocating_probe),\
    \ while static probe positions are described by [major_radius_of_langmuir_probe](name:major_radius_of_langmuir_probe).\n\
    \nSign convention: Positive when measured radially outward from the machine symmetry\
    \ axis in the $(R, \\phi, Z)$ system.\n\nThe collector $R$ is recorded during\
    \ each plunging stroke and used together with the plunge depth to reconstruct\
    \ the probe's trajectory relative to the separatrix, enabling measurement of the\
    \ radial profiles of edge plasma quantities such as [electron_density](name:electron_density)."
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_reciprocating_probe
  - name:major_radius_of_langmuir_probe
  - name:electron_density
  sources:
  - id: dd:langmuir_probes/probe/position_reciprocating/r
    dd_path: langmuir_probes/probe/position_reciprocating/r
    status: composed
  - id: dd:langmuir_probes/reciprocating/plunge/collector/position/r
    dd_path: langmuir_probes/reciprocating/plunge/collector/position/r
    status: composed
  - id: dd:langmuir_probes/reciprocating/plunge/position/r
    dd_path: langmuir_probes/reciprocating/plunge/position/r
