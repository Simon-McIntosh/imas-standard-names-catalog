name: poloidal_component_of_pfirsch_schlueter_current_density
description: "Poloidal projection of the Pfirsch\u2013Schl\xFCter current density,\
  \ the divergence-free return current maintaining pressure balance on toroidal flux\
  \ surfaces."
documentation: "The Pfirsch\u2013Schl\xFCter (PS) current is the toroidally-driven\
  \ return current that arises because the vertical component of the $\\nabla B$ and\
  \ curvature drifts produces a charge separation on each flux surface. To maintain\
  \ $\\nabla \\cdot \\mathbf{j} = 0$, a parallel current flows along field lines and\
  \ closes poloidally. The poloidal component $j_{\\rm PS,\\theta}$ (A\xB7m$^{-2}$)\
  \ is given approximately by $j_{\\rm PS,\\theta} \\approx -2 (dp/d\\psi)(B_\\theta\
  \ / B^2)(R - R_0)$, where $p$ is the plasma pressure (Pa), $\\psi$ the poloidal\
  \ magnetic flux (Wb), $B_\\theta$ the poloidal field (T), $B$ the total field magnitude\
  \ (T), $R$ the major radius (m), and $R_0$ the magnetic-axis major radius (m). In\
  \ a collisional (Pfirsch\u2013Schl\xFCter) transport regime the PS current is the\
  \ dominant neoclassical current channel; typical magnitudes are $10^4$\u2013$10^5$\
  \ A\xB7m$^{-2}$ in the edge pedestal. Positive when the poloidal component points\
  \ in the $+\\theta$ direction under the chosen COCOS convention. Computed by neoclassical\
  \ transport codes (NCLASS, NEO) and equilibrium solvers. See `toroidal_component_of_pfirsch_schlueter_current_density`\
  \ for the toroidal projection and `poloidal_component_of_magnetic_field` for the\
  \ underlying field component."
kind: vector_component
unit: A.m^-2
