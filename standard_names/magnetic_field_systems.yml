- name: radial_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Major-radius component in the cylindrical (R, phi, Z) frame of the
    electromagnetic Lorentz load acting on a poloidal field coil conductor.
  documentation: 'The radial force of a poloidal field coil is the projection of the
    net electromagnetic load on the coil conductor onto the major-radius direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame. It is a structural-design
    quantity because it determines outward or inward loading on coil cases, supports,
    insulation, and pre-compression systems. It is complementary to the [vertical
    force of a poloidal field coil](name:vertical_force_of_poloidal_field_coil), which
    describes the orthogonal $Z$ projection of the same Lorentz loading.


    For a conductor volume $V$, the radial component is obtained from the Lorentz
    force density integrated over the coil:


    $$

    F_R = \int_V (\mathbf{J} \times \mathbf{B}) \cdot \hat{R}\, dV

    $$


    where $F_R$ is the radial force in N, $\mathbf{J}$ is current density in A m$^{-2}$,
    $\mathbf{B}$ is magnetic flux density in T, $\hat{R}$ is the outward major-radius
    unit vector, and $dV$ is a conductor volume element in m$^3$. The force scales
    with the [current of the poloidal field coil](name:current_of_poloidal_field_coil)
    and with the background magnetic field produced by plasma and neighboring coils.


    In practice this load is computed from electromagnetic field calculations using
    the coil geometry, current waveform, and surrounding conductors; mechanical validation
    can use strain gages, support load measurements, or displacement monitoring during
    commissioning pulses. Geometry quantities such as the [radial outline of a poloidal
    field coil](name:radial_outline_of_poloidal_field_coil) and [width of a poloidal
    field coil](name:width_of_poloidal_field_coil) set the integration domain and
    affect the distribution of stress.


    Representative values range from $10^4$-$10^6$ N for small auxiliary shaping coils
    to $10^6$-$10^8$ N for large central-solenoid or equilibrium-field coils in reactor-scale
    devices, depending on current, radius, and magnetic coupling.


    Sign convention: Positive when the force points toward increasing major radius
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_force_of_poloidal_field_coil
  - name:current_of_poloidal_field_coil
  - name:radial_outline_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/force_radial
    dd_path: pf_active/coil/force_radial
    status: composed
- name: radial_outline_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Major-radius coordinate of the boundary points that define a poloidal-field-coil
    conductor in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The radial outline of a poloidal field coil is the major-radius
    coordinate $R$ of points on the conductor boundary in the poloidal cross-section.
    It specifies the coil shape relative to the toroidal symmetry axis and complements
    the coil center coordinate [major radius of poloidal field coil](name:major_radius_of_poloidal_field_coil)
    and the conductor size [width of poloidal field coil](name:width_of_poloidal_field_coil).


    For a point expressed in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    basis with $\hat{z}=\hat{Z}$, the corresponding major radius in the cylindrical
    $(R, \phi, Z)$ frame is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are horizontal Cartesian coordinates in meters measured from
    the toroidal symmetry axis, and $R$ is the distance from that axis.


    This coordinate is obtained from coil engineering geometry, surveying, or electromagnetic
    model geometry used to compute fields and forces. It is interpreted together with
    the vertical outline coordinate when reconstructing the coil cross-section; related
    geometric summaries include [outer radius of poloidal field coil](name:outer_radius_of_poloidal_field_coil),
    [vertical coordinate of poloidal field coil](name:vertical_coordinate_of_poloidal_field_coil),
    and [area of poloidal field coil](name:area_of_poloidal_field_coil).


    Typical values range from about 0.5-15 m in present and reactor-scale tokamaks,
    depending on whether the coil is an inboard shaping coil, an outboard vertical-field
    coil, or an external solenoid-adjacent winding.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_poloidal_field_coil
  - name:width_of_poloidal_field_coil
  - name:outer_radius_of_poloidal_field_coil
  - name:vertical_coordinate_of_poloidal_field_coil
  - name:area_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/coil/geometry/outline/r
    dd_path: pf_active/coil/geometry/outline/r
    status: composed
- name: vertical_coordinate_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Vertical position of the geometric center of a poloidal field coil
    element in the right-handed cylindrical R-phi-Z machine frame.
  documentation: "The vertical coordinate locates the geometric center of a poloidal\
    \ field coil element along the $Z$ axis of the right-handed cylindrical $(R, \\\
    phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. Together\
    \ with the [major radius of the poloidal field coil](name:major_radius_of_poloidal_field_coil),\
    \ it fixes the coil element center in the poloidal cross-section used for magnetic-field\
    \ and force calculations. It is distinct from the [height of a poloidal field\
    \ coil](name:height_of_poloidal_field_coil), which describes the vertical extent\
    \ of the conductor cross-section rather than its location.\n\nFor a coil element\
    \ center position vector $\\mathbf{x}_c$, the coordinate is the projection onto\
    \ the vertical basis direction:\n\n$$\nZ_c = \\mathbf{x}_c \\cdot \\hat{Z}\n$$\n\
    \nwhere $Z_c$ is the vertical coordinate of the coil element center and $\\hat{Z}$\
    \ is the vertical unit vector of the cylindrical $(R, \\phi, Z)$ frame.\n\nThis\
    \ quantity is determined from engineering geometry, metrology surveys, or magnetic-system\
    \ design models, and is used when computing coil-generated poloidal flux, Lorentz\
    \ forces, and free-boundary equilibrium constraints. The [radial outline of the\
    \ poloidal field coil](name:radial_outline_of_poloidal_field_coil) and [area of\
    \ the poloidal field coil](name:area_of_poloidal_field_coil) provide complementary\
    \ shape information for finite conductor models.\n\nTypical values range from\
    \ about -5 to 5 m in medium-size tokamaks and can exceed \xB110 m in large devices,\
    \ depending on the coil set layout relative to the machine midplane. Comparison\
    \ with the [vertical coordinate of the magnetic axis](name:vertical_coordinate_of_magnetic_axis)\
    \ helps characterize the vertical placement of the external field system relative\
    \ to the plasma.\n\nSign convention: Positive when the coil element center is\
    \ displaced in the +Z direction of the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame."
  unit: m
  physics_domain: magnetic_field_systems
