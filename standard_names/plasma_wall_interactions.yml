      unit: m
    enhanced_context:
      description: X coordinate of direction.
      kind: template
- name: xenon_density_at_limiter
  kind: scalar
  status: active
  description: Xenon ion number density in the boundary plasma immediately adjacent
    to a plasma-facing limiter surface, summed over all positive charge states and
    excluding neutral xenon atoms.
  documentation: 'Xenon density at the limiter is the local number density of xenon
    ions in the boundary plasma immediately adjacent to a plasma-facing limiter surface.
    The evaluation point is the plasma side of the magnetic presheath or sheath entrance
    at the plasma-limiter contact, consistent with the parent quantity [density_at_limiter](name:density_at_limiter).


    When charge states are not individually resolved, this quantity represents the
    sum over all positive xenon charge states $\text{Xe}^{q+}$, $q = 1, \ldots, 54$:


    $$

    n_{\text{Xe}} = \sum_{q=1}^{54} n_{\text{Xe}^{q+}}

    $$


    where $n_{\text{Xe}^{q+}}$ is the number density of xenon in charge state $q$.
    Neutral xenon atoms are excluded from this sum.


    Xenon is used as a high-$Z$ impurity seed for radiative power exhaust management
    in the scrape-off layer. Its concentration at the limiter is set by the balance
    of ionization, recombination, and cross-field impurity transport, and it determines
    the local particle flux, radiative power load, and potential sputtering damage
    to the plasma-facing surface. This quantity can be inferred from edge emission
    spectroscopy combined with collisional-radiative modeling. For xenon impurity
    density inside the confined plasma, see [xenon_density](name:xenon_density); for
    the analogous quantity at a divertor surface, see [xenon_density_at_divertor_target](name:xenon_density_at_divertor_target);
    and for xenon at the last closed flux surface, see [xenon_density_at_plasma_boundary](name:flux_surface_averaged_xenon_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:xenon_density
  - name:xenon_density_at_divertor_target
  - name:flux_surface_averaged_xenon_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
    operator: xenon
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/limiter/n_i/xenon/value
    dd_version: 4.1.0
