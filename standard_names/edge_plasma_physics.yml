- name: toroidal_helium_3_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal (toroidal-angle-directed) flow velocity of the helium-3 ion
    population at the pedestal location.
  documentation: 'The toroidal helium-3 velocity $v_{\phi,\,^3\mathrm{He}}$ quantifies
    the toroidal rotation of the $^3\mathrm{He}^{1+}$ ion population in the pedestal
    region, and is a key parameter for understanding edge momentum transport, the
    H-mode pedestal structure, and impurity confinement. It is primarily measured
    via charge exchange recombination spectroscopy (CXRS) by analyzing the Doppler
    shift of the $^3\mathrm{He}$ spectral emission lines, which directly yields the
    toroidal component of the flow velocity relative to the magnetic field direction.
    In tokamak pedestals, typical values range from a few km/s to tens of km/s, and
    the rotation shear can influence the stability of edge-localized modes. Compare
    with the value at the magnetic axis ([toroidal_helium_3_velocity_at_magnetic_axis](name:toroidal_helium_3_velocity_at_magnetic_axis))
    and at the separatrix ([toroidal_helium_3_velocity_at_separatrix](name:toroidal_helium_3_velocity_at_separatrix)).
    The local helium-3 density is given by [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal).


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_separatrix
  - name:helium_3_density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/helium_3/value
    dd_path: summary/local/pedestal/velocity_phi/helium_3/value
    status: composed
- name: toroidal_ion_source_rate
  kind: scalar
  status: draft
  description: Toroidal component of the volumetric momentum source density for a
    given ion charge state in the edge plasma governing ion rotation evolution.
  documentation: "The toroidal ion source rate $S_{m,\\phi,i}$ represents the volumetric\
    \ density of momentum transferred to a specific ion charge state in the $\\phi$\
    \ direction. It acts as a source or sink term in the toroidal momentum balance\
    \ equation for that ion population, $\\partial_t (m_i n_i v_{\\phi,i}) + \\nabla\
    \ \\cdot \\boldsymbol{\\Pi}_{\\phi,i} = S_{m,\\phi,i}$, where $m_i$ is the ion\
    \ mass, $n_i$ the density, and $\\boldsymbol{\\Pi}_{\\phi,i}$ the momentum flux.\
    \ This term can arise from neutral-beam injection, intrinsic rotation drives,\
    \ collisional friction between species, or turbulent fluctuations. The quantity\
    \ is defined on the generalized grid (GGD) subsets of the edge plasma and is typically\
    \ inferred from integrated modeling codes. It complements the total momentum source\
    \ from all species, [ion_source_rate](name:ion_source_rate), and the neutral counterpart\
    \ [toroidal_neutral_source_rate](name:toroidal_neutral_source_rate). Units are\
    \ kg\xB7m\u207B\xB9\xB7s\u207B\xB2, equivalent to momentum per unit volume per\
    \ unit time (N\xB7m\u207B\xB3)."
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_source_rate
  - name:toroidal_neutral_source_rate
  arguments:
  - name: ion_source_rate
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
