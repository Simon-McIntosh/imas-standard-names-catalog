name: parallel_component_of_ion_e_cross_b_drift_velocity
description: Projection of the ion $\mathbf{E} \times \mathbf{B}$ drift velocity onto
  the direction parallel to the magnetic field.
documentation: The parallel component of the $\mathbf{E} \times \mathbf{B}$ drift
  velocity for ions is $v_{E \times B, \parallel} = \mathbf{v}_{E \times B} \cdot
  \hat{b}$, where $\mathbf{v}_{E \times B} = (\mathbf{E} \times \mathbf{B}) / B^2$,
  $\mathbf{E}$ is the electric field, $\mathbf{B}$ the magnetic field with magnitude
  $B$, and $\hat{b} = \mathbf{B}/B$ the unit vector along the field. In a purely perpendicular
  $\mathbf{E} \times \mathbf{B}$ drift this component vanishes identically; a non-zero
  value arises from numerical projections onto a field-aligned coordinate system that
  accounts for finite magnetic-field curvature or from toroidal geometry effects where
  the drift acquires a parallel projection due to the non-orthogonality of the local
  coordinate basis. It is evaluated in edge fluid codes (SOLPS-ITER, UEDGE, SOLEDGE)
  on generalized grids and is typically small ($< 10^{2}\;\mathrm{m\,s^{-1}}$) compared
  to the perpendicular drift. See `diamagnetic_component_of_ion_e_cross_b_drift_velocity`
  for the diamagnetic counterpart.
kind: vector_component
unit: m.s^-1
