- name: per_toroidal_mode_thermal_ion_power_density
  kind: scalar
  status: active
  description: Toroidal-Fourier-mode-resolved coherent-wave power density absorbed
    by the bulk thermal-ion population, with modal contributions partitioning total
    thermal-ion absorption.
  documentation: 'This quantity is the contribution associated with one toroidal Fourier
    mode to the local coherent-wave power density absorbed by bulk thermal ions. It
    resolves [thermal ion power density](name:thermal_ion_power_density) by toroidal
    mode number while retaining the same spatial convention.


    The modal contributions are defined to reconstruct the total thermal-ion absorption:


    $$

    p_{\mathrm{th},i}(\mathbf{x}) = \sum_n p_{\mathrm{th},i,n}(\mathbf{x})

    $$


    where $p_{\mathrm{th},i}$ is the total thermal-ion absorbed-wave power density,
    $p_{\mathrm{th},i,n}$ is the contribution from toroidal mode number $n$, and $\mathbf{x}$
    denotes the evaluation position or spatial averaging domain. The toroidal mode
    number $n$ labels Fourier harmonics in the toroidal angle $\phi$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    Only energy deposited in the bulk Maxwellian ion population is included; direct
    absorption by electrons and fast ions is excluded. Charge-state-resolved contributions
    are represented separately by [per-toroidal-mode thermal ion charge-state power
    density](name:per_toroidal_mode_thermal_ion_charge_state_power_density), while
    fast-ion deposition is distinct from [per-toroidal-mode fast ion power density](name:per_toroidal_mode_fast_ion_power_density).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_density
  - name:per_toroidal_mode_fast_ion_power_density
  arguments:
  - name: thermal_ion_power_density
