name: equilibrium_reconstruction_constraint_weight_of_vertical_iron_core_segment_magnetization
status: draft
cocos_transformation_type: one_like
description: Relative weight assigned to the vertical ($Z$-direction) magnetization
  measurement of an iron core segment in the equilibrium reconstruction.
documentation: Standard $\chi^2$ weight controlling the relative importance of the
  vertical component of iron-core segment magnetization $M_Z$ in the equilibrium reconstruction
  cost functional. Together with the radial component weight, it enables the solver
  to accurately model nonlinear ferromagnetic effects of the iron core on the poloidal
  field distribution. A weight of 1 applies the nominal measurement variance; values
  greater than 1 emphasize this constraint relative to other diagnostics. The companion
  radial magnetization weight is `equilibrium_reconstruction_constraint_weight_of_radial_iron_core_segment_magnetization`.
