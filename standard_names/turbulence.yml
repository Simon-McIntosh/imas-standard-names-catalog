- name: normalized_particle_mass
  kind: scalar
  status: draft
  description: Dimensionless ratio of a particle species' mass to a reference mass,
    specifying the inertial parameter for that species in gyrokinetic equations of
    motion.
  documentation: 'The normalized particle mass is the dimensionless ratio $\hat{m}_s
    = m_s / m_{\rm ref}$ of species mass $m_s$ to a reference mass $m_{\rm ref}$,
    establishing the inertial scale for each species in a gyrokinetic plasma model.
    It is the mass counterpart of [normalized_particle_charge](name:normalized_particle_charge),
    and together these two parameters fully characterize the kinetic identity of a
    species entering the gyrokinetic equations.


    In gyrokinetic theory, $\hat{m}_s$ controls the species thermal gyroradius relative
    to the reference gyroradius:


    $$

    \hat{\rho}_s = \frac{\sqrt{\hat{m}_s \, \hat{T}_s}}{|\hat{q}_s|}

    $$


    where $\hat{T}_s$ is the normalized_temperature of species $s$ and $\hat{q}_s$
    is its [normalized_particle_charge](name:normalized_particle_charge). The cyclotron
    frequency ratio between species scales inversely as $|\hat{q}_s| / \hat{m}_s$.


    The reference mass is conventionally the proton or deuteron mass. Relative to
    a deuteron reference, electrons carry $\hat{m}_s \approx 1/3672$, hydrogen $\approx
    0.5$, deuterium $= 1$, tritium $\approx 1.5$, and impurity species range from
    several to tens depending on atomic mass.


    Sign convention: Positive for any physical particle species, since both the species
    mass $m_s$ and the reference mass $m_{\rm ref}$ are positive-definite quantities.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_charge
  sources:
  - id: dd:gyrokinetics/species/mass_norm
    dd_path: gyrokinetics/species/mass_norm
    status: attached
