- name: alpha_side_length_of_ferritic_object_oblique_cross_section
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at angle $\alpha$ relative
    to the major-radius (horizontal) axis in the oblique cross section of a ferritic
    insert.
  documentation: This quantity $L_\alpha$ (in meters) is one of two side lengths that,
    together with their respective inclination angles $\alpha$ and $\beta$, parameterize
    the oblique-parallelogram cross section of axisymmetric ferritic objects or iron-core
    segments. The side inclined at angle $\alpha$ is measured from the horizontal
    outward-directed radial vector ($\nabla R$); the complementary side is characterized
    by [beta_side_length_of_ferritic_object_oblique_cross_section](name:beta_side_length_of_ferritic_object_oblique_cross_section).
    These parameters enable computation of the cross-sectional area $A = L_\alpha
    L_\beta |\sin(\alpha - \beta)|$ and the associated ferromagnetic volume for permeability
    modeling. See [inclination_angle_alpha_of_ferritic_object_oblique_cross_section](name:inclination_angle_alpha_of_ferritic_object_oblique_cross_section)
    for the angle definition and [inclination_angle_beta_of_ferritic_object_oblique_cross_section](name:inclination_angle_beta_of_ferritic_object_oblique_cross_section)
    for the complementary angle.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: beta_side_length_of_ferritic_object_oblique_cross_section
  kind: scalar
  status: draft
  description: Length of the parallelogram side inclined at angle $\beta$ relative
    to the vertical (height) axis in the oblique cross section of a ferritic insert.
  documentation: "Ferritic inserts in tokamaks are used to compensate toroidal-field\
    \ ripple produced by the finite number of toroidal-field coils. Their cross-sectional\
    \ geometry in the $(R, Z)$ plane is modeled as a parallelogram defined by two\
    \ side lengths and two inclination angles. This quantity, $l_\\beta$ (m), is the\
    \ length of the side whose inclination angle $\\beta$ is measured with respect\
    \ to the vertical ($\\nabla Z$) direction. Together with the companion side length\
    \ $l_\\alpha$ and the two angles $\\alpha$, $\\beta$, the full parallelogram shape\
    \ is determined. Values depend on the machine design; for ITER ferritic inserts,\
    \ individual side lengths are of order 0.05\u20130.5 m. The oblique parametrization\
    \ allows representation of non-rectangular cross sections that arise from manufacturing\
    \ and installation constraints. See [alpha_side_length_of_ferritic_object_oblique_cross_section](name:alpha_side_length_of_ferritic_object_oblique_cross_section)\
    \ for the complementary side and [inclination_angle_beta_of_ferritic_object_oblique_cross_section](name:inclination_angle_beta_of_ferritic_object_oblique_cross_section)\
    \ for the associated angle."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: binormal_coordinate_of_coil_conductor_cross_section_outline_point
  kind: scalar
  status: draft
  description: "Coordinate along the binormal axis of a point on the conductor cross-section\
    \ outline, in the local Frenet\u2013Serret frame."
  documentation: "In the local coordinate system attached to a coil conductor element,\
    \ the binormal axis $\\hat{b}$ is perpendicular to both the tangent (along the\
    \ current path) and the normal $\\hat{n}$ directions, completing a right-handed\
    \ Frenet\u2013Serret frame. The binormal coordinate (in m) of an outline point,\
    \ together with its [normal_coordinate_of_coil_conductor_cross_section_outline_point](name:normal_coordinate_of_coil_conductor_cross_section_outline_point),\
    \ defines the two-dimensional shape of the conductor cross section. Cross-section\
    \ shapes include circles, rectangles, and annuli; the outline is stored as a polygon\
    \ of $(n, b)$ pairs. This information is required by Biot\u2013Savart field solvers\
    \ and for computing the effective current density $j = I / A$, where $A$ is the\
    \ [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element).\
    \ The quantity applies to both TF and non-axisymmetric coils. See also [width_of_coil_conductor_cross_section](name:width_of_coil_conductor_cross_section)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: coil_averaged_poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Poloidal magnetic flux produced by external coils, averaged over the
    plasma poloidal cross section.
  documentation: 'The coil-averaged poloidal magnetic flux $\langle \psi_{\rm coils}
    \rangle$ is defined as the area-weighted integral of the poloidal flux contribution
    from a specified set of poloidal-field (PF) coils, divided by the plasma cross-sectional
    area: $\langle \psi_{\rm coils} \rangle = \int \psi_{\rm coils} \, dA / \int dA$,
    where $dA$ is the differential poloidal cross-sectional area element and $\psi_{\rm
    coils}$ is the flux produced by the listed coils alone (excluding plasma current
    contributions). This quantity is used in feedback-control algorithms and scenario
    design to separate the external (coil-driven) flux from the total poloidal flux,
    enabling monitoring of the plasma inductive flux consumption during a discharge.
    Values range from a few mWb in small devices to tens of Wb in large tokamaks such
    as ITER. See also [electrical_resistance_of_coil_conductor](name:electrical_resistance_of_coil_conductor)
    for conductor properties of the coils that generate this flux.'
  unit: Wb
  tags:
  - equilibrium-reconstruction
  - flux-surface-average
  - real-time-control
  links: []
  validity_domain: ''
  constraints: []
- name: conductor_element_type_index
  kind: scalar
  status: draft
  description: Integer index identifying the geometric primitive (line segment, arc,
    or full circle) of a non-axisymmetric coil conductor element.
  documentation: "Each conductor path in a non-axisymmetric coil is discretized into\
    \ geometric primitives. This integer index encodes the element type: 1 = line\
    \ segment (defined by start and end points), 2 = arc of a circle, 3 = full circle.\
    \ The index is used by field-line tracing and Biot\u2013Savart routines to select\
    \ the appropriate analytic or numerical integration kernel for computing the magnetic\
    \ vector potential $\\mathbf{A}$ and field $\\mathbf{B}$ contributions. See [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ for the associated conductor cross-section area and [width_of_coil_conductor_cross_section](name:width_of_coil_conductor_cross_section)\
    \ for cross-section extent."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - data-archival
  links: []
  validity_domain: ''
  constraints: []
- name: conductor_temperature_of_active_coil
  kind: scalar
  status: draft
  description: Temperature of the conductor material in an active poloidal-field coil,
    serving as a coordinate for current-limit characterization.
  documentation: "The conductor temperature $T_{\\mathrm{cond}}$ (in K) quantifies\
    \ the thermal state of the superconducting or resistive conductor within an active\
    \ PF coil. For superconducting coils, $T_{\\mathrm{cond}}$ determines the margin\
    \ to the critical temperature $T_c$ and thereby the maximum allowable operating\
    \ current; for resistive coils it governs the electrical resistivity $\\rho(T)$\
    \ and associated Ohmic losses $P = I^2 R(T)$. This quantity is used as a coordinate\
    \ axis in current-limit lookup tables: the maximum current $I_{\\max}(T_{\\mathrm{cond}},\
    \ B_{\\max})$ depends jointly on conductor temperature and peak magnetic field\
    \ on the conductor surface. Cryogenic temperature sensors (Cernox, platinum RTDs)\
    \ embedded in the winding pack provide direct measurements; values range from\
    \ 4\u20135 K for Nb$_3$Sn or NbTi conductors under nominal operation to 300 K\
    \ at room temperature. See also [maximum_magnetic_field_on_pf_coil_conductor](name:maximum_magnetic_field_on_pf_coil_conductor)\
    \ and [electrical_resistance_of_coil_conductor](name:electrical_resistance_of_coil_conductor)."
  unit: K
  tags:
  - integrated-modeling
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: cross_sectional_area_of_passive_conductor_element
  kind: scalar
  status: draft
  description: Area of the poloidal cross-section of an individual element within
    a passive conductor loop, governing its resistive and inductive response.
  documentation: "The cross-sectional area $A$ (in m$^2$) of a passive conductor element\
    \ determines its electrical resistance per unit length via $R/L = \\eta / A$,\
    \ where $\\eta$ is the resistivity (in $\\Omega \\cdot$m) and $L$ is the element\
    \ length. Passive conductor structures \u2014 vacuum vessel segments, support\
    \ structures, and stabilizing plates \u2014 carry induced currents during transient\
    \ events such as disruptions and vertical displacement events. Accurate knowledge\
    \ of $A$ is essential for eddy-current modeling in codes such as CARIDDI and STARWALL.\
    \ Values range from $\\sim 10^{-4}$ m$^2$ for thin wall segments to $\\sim 10^{-2}$\
    \ m$^2$ for massive stabilizing plates. See also [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ for the active-coil counterpart and [electrical_resistivity_of_passive_conductor](name:electrical_resistivity_of_passive_conductor)\
    \ for the material property that combines with area to give resistance."
  unit: m^2
  cocos_transformation_type: one_like
  tags:
  - derived
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: electrical_resistance_of_coil_conductor
  kind: scalar
  status: draft
  description: DC electrical resistance of a coil or its conductor, governing resistive
    voltage drop and ohmic heating during operation.
  documentation: "The resistance $R_{\\text{coil}}$ (in ohms) relates the voltage\
    \ drop to the current flowing through the coil conductor via $V = R_{\\text{coil}}\
    \ I + L\\, dI/dt$. For superconducting coils in the normal state $R_{\\text{coil}}$\
    \ is dominated by the copper stabilizer shunt; for resistive coils it is determined\
    \ by $R = \\rho L_c / A_c$, where $\\rho$ is the conductor resistivity in $\\\
    Omega\\cdot$m, $L_c$ is the conductor length in m, and $A_c$ is the cross-sectional\
    \ area in m\xB2. Values range from micro-ohms (superconducting joints) to tens\
    \ of milli-ohms (resistive PF coils). This quantity also covers power-supply internal\
    \ resistance when applied to the supply path. See [electrical_resistance_of_passive_conductor_loop](name:electrical_resistance_of_passive_conductor_loop)\
    \ for passive structures and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ for the conductor cross section."
  unit: ohm
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: electrical_resistance_of_passive_conductor_loop
  kind: scalar
  status: draft
  description: Total DC electrical resistance of a passive conductor loop, governing
    the decay rate of eddy currents induced during transient events.
  documentation: "The resistance $R_{\\mathrm{loop}}$ (in $\\Omega$) of a passive\
    \ conductor loop is the sum of the resistive contributions of all elements forming\
    \ that loop, $R_{\\mathrm{loop}} = \\sum_k \\eta_k l_k / A_k$, where $\\eta_k$\
    \ is the resistivity, $l_k$ the path length, and $A_k$ the cross-sectional area\
    \ of element $k$. Passive loops \u2014 vacuum vessel segments, stabilizing plates,\
    \ and mechanical support structures \u2014 carry eddy currents during plasma disruptions,\
    \ vertical displacement events, and fast ramp scenarios. The $L/R$ time constant\
    \ ($\\tau = L_{\\mathrm{loop}} / R_{\\mathrm{loop}}$) sets the decay time scale\
    \ of these currents and directly affects vertical stability margins. Resistance\
    \ values range from $\\sim 10^{-6}$ $\\Omega$ for massive copper or steel structures\
    \ to $\\sim 10^{-3}$ $\\Omega$ for thin vessel segments. See also [electrical_resistivity_of_passive_conductor](name:electrical_resistivity_of_passive_conductor)\
    \ for the material-level property and [electrical_resistance_of_coil_conductor](name:electrical_resistance_of_coil_conductor)\
    \ for the active-coil counterpart."
  unit: ohm
  tags:
  - derived
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: electrical_resistivity_of_passive_conductor
  kind: scalar
  status: draft
  description: Bulk electrical resistivity of the passive conductor material, relating
    electric field to current density via $\mathbf{E} = \rho \mathbf{J}$.
  documentation: "The electrical resistivity $\\rho$ (in $\\Omega\\cdot$m) characterizes\
    \ the intrinsic resistance of the passive-loop material to eddy-current flow induced\
    \ during plasma transients such as disruptions, vertical displacement events,\
    \ and ramp-up/ramp-down phases. Passive structures (vacuum-vessel segments, stabilizing\
    \ plates) are modeled as lumped or distributed loops; the resistance of each loop\
    \ is $R = \\rho L / A$, where $L$ is the effective current-path length in m and\
    \ $A$ is the cross-sectional area in m\xB2. For stainless steel at operating temperature\
    \ (\u2248 400 K) $\\rho \\approx 7 \\times 10^{-7}\\;\\Omega\\cdot$m; for copper\
    \ stabilizer $\\rho \\approx 2 \\times 10^{-8}\\;\\Omega\\cdot$m at 300 K. See\
    \ [electrical_resistance_of_passive_conductor_loop](name:electrical_resistance_of_passive_conductor_loop)\
    \ for the integrated loop resistance and [cross_sectional_area_of_passive_conductor_element](name:cross_sectional_area_of_passive_conductor_element)\
    \ for the element area."
  unit: m.ohm
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: force_limit_combination_matrix_of_active_coil_set
  kind: scalar
  status: draft
  description: Dimensionless weight matrix defining linear combinations of individual
    coil forces used to express aggregate force limits on the active coil set.
  documentation: The force-limit combination matrix $C_{ij}$ (dimensionless) maps
    individual coil forces $F_j$ to composite force constraints $G_i = \sum_j C_{ij}
    F_j$, where $F_j$ is the force (vertical or radial, in N) on coil $j$ and $G_i$
    is the $i$-th aggregate force quantity to be bounded. Each row of the matrix corresponds
    to one force limit; the associated upper and lower bounds are stored in companion
    limit fields. This formulation allows enforcement of both per-coil and combined
    structural limits during plasma scenario design and real-time coil-current optimization.
    The matrix is defined once per machine configuration and is used by poloidal-field
    control systems and equilibrium reconstruction workflows. See also [conductor_temperature_of_active_coil](name:conductor_temperature_of_active_coil)
    for thermal operating limits on coils and [electrical_resistance_of_coil_conductor](name:electrical_resistance_of_coil_conductor)
    for coil electrical properties.
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - global-quantity
  - real-time-control
  links: []
  validity_domain: ''
  constraints: []
- name: inclination_angle_alpha_of_ferritic_object_oblique_cross_section
  kind: scalar
  status: draft
  description: First inclination angle $\alpha$ of the oblique parallelogram cross-section,
    measured counter-clockwise from the outward radial direction $\hat{R}$.
  documentation: "The angle $\\alpha$ (in radians) defines the tilt of one pair of\
    \ sides of a parallelogram-shaped poloidal cross-section relative to the horizontal\
    \ outward radial unit vector $\\nabla R$. Measurement is counter-clockwise in\
    \ the $(R, Z)$ plane. When $\\alpha = 0$ and $\\beta = 0$ the cross-section degenerates\
    \ to a rectangle aligned with the coordinate axes, and the simpler rectangular\
    \ description should be used instead. The companion angle $\\beta$ \u2014 measured\
    \ from the vertically upward direction $\\nabla Z$ \u2014 defines the inclination\
    \ of the other pair of sides. Together with the side lengths $l_\\alpha$ and $l_\\\
    beta$ and the reference-point coordinates $(R, Z)$, the four angles and lengths\
    \ fully specify the parallelogram. This representation is used for ferritic inserts\
    \ and coil elements whose cross-section is not axis-aligned. See also [inclination_angle_beta_of_ferritic_object_oblique_cross_section](name:inclination_angle_beta_of_ferritic_object_oblique_cross_section)\
    \ and [alpha_side_length_of_ferritic_object_oblique_cross_section](name:alpha_side_length_of_ferritic_object_oblique_cross_section)."
  unit: rad
  tags:
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: inclination_angle_beta_of_ferritic_object_oblique_cross_section
  kind: scalar
  status: draft
  description: Second inclination angle $\beta$ of the oblique parallelogram cross-section,
    measured counter-clockwise from the vertically upward direction $\hat{Z}$.
  documentation: "The angle $\\beta$ (in radians) defines the tilt of the second pair\
    \ of sides of a parallelogram-shaped poloidal cross-section relative to the vertically\
    \ upward unit vector $\\nabla Z$. Measurement is counter-clockwise in the $(R,\
    \ Z)$ plane. When both $\\alpha = 0$ and $\\beta = 0$, the cross-section reduces\
    \ to a rectangle aligned with the coordinate axes; in that case the simpler rectangular\
    \ geometry description should be used. The companion angle $\\alpha$ \u2014 measured\
    \ from the outward radial direction $\\nabla R$ \u2014 defines the other pair\
    \ of sides. Together with the reference-point coordinates $(R, Z)$ and the side\
    \ lengths $l_\\alpha$ and $l_\\beta$, these parameters fully define the parallelogram.\
    \ This parameterization is applied to ferritic inserts, iron-core segments, and\
    \ coil elements with non-axis-aligned cross-sections. See also [inclination_angle_alpha_of_ferritic_object_oblique_cross_section](name:inclination_angle_alpha_of_ferritic_object_oblique_cross_section)\
    \ and [beta_side_length_of_ferritic_object_oblique_cross_section](name:beta_side_length_of_ferritic_object_oblique_cross_section)."
  unit: rad
  tags:
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_radial_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on $B_R$ at each ferritic
    element centroid.
  documentation: This quantity gives the negative (lower) error bar on the radial
    magnetic-field component $B_R$ evaluated at the centroid of each ferritic element,
    expressed in T. The lower uncertainty $\delta B_R^{-}$ satisfies $B_R - \delta
    B_R^{-} \le B_R^{\mathrm{true}} \le B_R$ at the stated confidence level. Sources
    of uncertainty include nonlinear permeability modeling, mesh resolution in 3-D
    field calculations, and measurement errors in ferromagnetic material properties.
    See also [radial_component_of_magnetic_field_at_ferritic_element_centroid](name:radial_component_of_magnetic_field_at_ferritic_element_centroid)
    and [upper_uncertainty_of_toroidal_component_of_magnetic_field_at_ferritic_element_centroid](name:upper_uncertainty_of_toroidal_component_of_magnetic_field_at_ferritic_element_centroid).
  unit: T
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_toroidal_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the toroidal magnetic-field
    component evaluated at the centroid of a ferritic insert element.
  documentation: "This quantity represents the negative (lower) error bar on the toroidal\
    \ component of the magnetic field $B_\\phi$ at the geometric centroid of a ferritic\
    \ element, expressed in tesla. The asymmetric confidence interval is $[B_\\phi\
    \ - \\delta B_{\\phi,\\text{lower}},\\; B_\\phi + \\delta B_{\\phi,\\text{upper}}]$,\
    \ where $\\delta B_{\\phi,\\text{lower}} \\ge 0$ is this stored value. Sources\
    \ of uncertainty include incomplete knowledge of the ferritic material's B-H curve,\
    \ geometric discretization errors in the element mesh, and imprecision in the\
    \ equilibrium reconstruction used to evaluate the local field. The toroidal field\
    \ perturbation from ferritic inserts is relevant for error-field correction and\
    \ non-axisymmetric field modeling; deviations are on the order of $10^{-3}$\u2013\
    $10^{-2}$ T for ferritic steel inserts in ITER-class devices. See [toroidal_component_of_magnetic_field_at_ferritic_element_centroid](name:toroidal_component_of_magnetic_field_at_ferritic_element_centroid)\
    \ for the central value and [radial_component_of_magnetic_field_at_ferritic_element_centroid](name:radial_component_of_magnetic_field_at_ferritic_element_centroid)\
    \ for the radial counterpart."
  unit: T
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_vertical_component_of_magnetic_vector_potential
  kind: vector
  status: draft
  description: Lower bound of the asymmetric uncertainty on the vertical ($Z$) component
    of the magnetic vector potential $A_z$.
  documentation: "This quantity represents the negative (lower) error bar on the vertical\
    \ component $A_z$ of the magnetic vector potential, expressed in units of m\xB7\
    T (equivalently, Wb/m). The asymmetric confidence interval is $[A_z - \\delta\
    \ A_{z,\\text{lower}},\\; A_z + \\delta A_{z,\\text{upper}}]$. The magnetic vector\
    \ potential satisfies $\\mathbf{B} = \\nabla \\times \\mathbf{A}$, where $\\mathbf{B}$\
    \ is the magnetic field in T and $\\mathbf{A}$ has units of m\xB7T. Sources of\
    \ uncertainty include numerical discretization in MHD field solvers, incomplete\
    \ knowledge of current distributions in surrounding conductors, and measurement\
    \ noise propagated through equilibrium reconstruction. The stored value must be\
    \ non-negative. See [vertical_component_of_magnetic_vector_potential](name:vertical_component_of_magnetic_vector_potential)\
    \ for the central value."
  unit: T.m
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_coil_conductor_element_centre
  kind: scalar
  status: draft
  description: Major-radius ($R$) coordinate of the geometric center of a discrete
    conductor element in a non-axisymmetric coil.
  documentation: "The major radius $R_{\\mathrm{centre}}$ (in m) locates the centroid\
    \ of a coil conductor element in the standard cylindrical $(R, \\phi, Z)$ coordinate\
    \ system. For non-axisymmetric coils \u2014 such as error-field correction coils,\
    \ resonant magnetic perturbation coils, or stellarator modular coils \u2014 each\
    \ conductor is discretized into elements whose centers define the effective current-filament\
    \ path used in Biot\u2013Savart field calculations. Together with the corresponding\
    \ toroidal angle and vertical coordinate of the element center, $R_{\\mathrm{centre}}$\
    \ fully specifies the three-dimensional position. Values are bounded by the vacuum-vessel\
    \ major-radius range and depend on the coil geometry; for ITER-class devices,\
    \ 3\u20139 m is a representative span. See also [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ and [electrical_resistance_of_coil_conductor](name:electrical_resistance_of_coil_conductor)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_ferritic_object_outline_point
  kind: scalar
  status: draft
  description: Major-radius ($R$) coordinate of a vertex on the poloidal cross-section
    outline of an axisymmetric ferritic object.
  documentation: "Each outline point specifies the major radius $R$ (in meters) of\
    \ a vertex in the polygonal contour describing the poloidal cross-section of a\
    \ ferritic insert. The full outline is given as an ordered set of $(R, Z)$ pairs\
    \ that, when connected, define the boundary of the ferritic material region. Ferritic\
    \ inserts are placed between toroidal-field coils in devices such as ITER to reduce\
    \ toroidal field ripple by up to a factor of two; accurate geometric description\
    \ is essential for computing the nonlinear magnetization response in equilibrium\
    \ and field-ripple codes. Outline $R$ values for ITER ferritic inserts span approximately\
    \ 5\u20138 m. See also [vertical_coordinate_of_ferritic_object_arc_start_point](name:vertical_coordinate_of_ferritic_object_arc_start_point)\
    \ and [vertical_coordinate_of_ferritic_object_rectangle_centre](name:vertical_coordinate_of_ferritic_object_rectangle_centre)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_iron_core_outline_point
  kind: scalar
  status: draft
  description: Major-radius ($R$) coordinate of a vertex on the poloidal cross-section
    outline of an iron-core segment.
  documentation: Each outline point gives the major radius $R$ (in meters) of a vertex
    in the polygonal contour that describes the poloidal cross-section of an iron-core
    segment used for magnetic flux return in tokamak or transformer-coupled devices.
    The complete outline is an ordered set of $(R, Z)$ pairs forming a closed polygon.
    Iron-core segments, present in devices with iron-core transformers (e.g., certain
    small and medium tokamaks), carry magnetic flux that couples the central solenoid
    to the plasma inductively. The geometry must be accurately represented for equilibrium
    reconstruction codes that model nonlinear iron saturation. See also [vertical_coordinate_of_ferritic_object_rectangle_centre](name:vertical_coordinate_of_ferritic_object_rectangle_centre)
    and [major_radius_of_ferritic_object_outline_point](name:major_radius_of_ferritic_object_outline_point).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: maximum_magnetic_field_on_pf_coil_conductor
  kind: scalar
  status: draft
  description: Peak magnetic-field magnitude on the conductor surface of a poloidal-field
    coil, used as a coordinate for superconductor current-limit curves.
  documentation: "The maximum magnetic field $B_{\\max}$ (in T) on the surface of\
    \ a PF coil conductor determines the operating margin of superconducting windings.\
    \ For NbTi or Nb$_3$Sn conductors the critical current $I_c(B, T)$ is a decreasing\
    \ function of both magnetic field and temperature; $B_{\\max}$ therefore defines\
    \ the most restrictive point on the conductor and serves as the independent coordinate\
    \ for the coil's current-limit envelope. During scenario design, the pair $(B_{\\\
    max}, I_{\\max})$ constrains the allowable coil-current waveform. Values for large\
    \ tokamaks range from 5\u201313 T depending on coil geometry and plasma current.\
    \ This quantity is evaluated either analytically from simplified coil models or\
    \ numerically from 2-D/3-D field maps that include contributions from all coils\
    \ and plasma current. See also [conductor_temperature_of_active_coil](name:conductor_temperature_of_active_coil),\
    \ which provides the temperature coordinate for the same current-limit surface."
  unit: T
  tags:
  - equilibrium-reconstruction
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: normal_coordinate_of_coil_conductor_cross_section_outline_point
  kind: scalar
  status: draft
  description: "Coordinate along the normal axis of a point on the conductor cross-section\
    \ outline, in the local Frenet\u2013Serret frame."
  documentation: "In the local coordinate system of a coil conductor element, the\
    \ normal axis $\\hat{n}$ is directed radially outward from the conductor center-line\
    \ and lies in the osculating plane. The normal coordinate (in m) of an outline\
    \ point, paired with its [binormal_coordinate_of_coil_conductor_cross_section_outline_point](name:binormal_coordinate_of_coil_conductor_cross_section_outline_point),\
    \ fully specifies the two-dimensional cross-section geometry. The outline is stored\
    \ as a polygon of $(n, b)$ coordinate pairs. This data feeds Biot\u2013Savart\
    \ integrations for magnetic-field calculations and determines the [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element).\
    \ The quantity is defined for both TF and non-axisymmetric coils. See also [width_of_coil_conductor_cross_section](name:width_of_coil_conductor_cross_section)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: radial_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Projection of the magnetic-field vector onto the major-radius direction
    $\hat{R}$, evaluated at the geometric centroid of a ferritic insert element.
  documentation: "The radial magnetic-field component $B_R = \\mathbf{B} \\cdot \\\
    hat{R}$ at the centroid of a ferritic element quantifies how the ferromagnetic\
    \ material perturbs the equilibrium field in the major-radius direction. Ferritic\
    \ inserts (e.g., reduced-activation ferritic-martensitic steels in ITER test blanket\
    \ modules) become magnetized by the ambient field, generating field perturbations\
    \ that must be accounted for in error-field analysis and equilibrium reconstruction.\
    \ The centroid field is computed either from a magnetostatic finite-element model\
    \ or from analytic magnetic-moment representations of the element magnetization.\
    \ In ITER-scale devices, ferritic-induced radial perturbations are on the order\
    \ of $10^{-3}$\u2013$10^{-2}$ T. See [toroidal_component_of_magnetic_field_at_ferritic_element_centroid](name:toroidal_component_of_magnetic_field_at_ferritic_element_centroid)\
    \ for the toroidal counterpart and [vertical_component_of_magnetic_field](name:vertical_component_of_magnetic_field)\
    \ for the vertical ($Z$) component."
  unit: T
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: radial_component_of_magnetic_vector_potential_on_ggd
  kind: vector
  status: draft
  description: Radial projection of the magnetic vector potential $\mathbf{A}$ onto
    $\hat{R}$, discretized on a generalized grid description (GGD).
  documentation: "The radial component $A_R = \\mathbf{A} \\cdot \\hat{R}$ of the\
    \ magnetic vector potential, where $\\mathbf{A}$ satisfies $\\mathbf{B} = \\nabla\
    \ \\times \\mathbf{A}$ and $\\hat{R}$ is the unit vector in the major-radius direction.\
    \ One scalar value is stored per element of a GGD grid subset, allowing representation\
    \ on arbitrary unstructured meshes. In the Coulomb gauge ($\\nabla \\cdot \\mathbf{A}\
    \ = 0$), $A_R$ contributes to both the poloidal and toroidal magnetic-field components\
    \ through the curl operation. The unit is m\xB7T, consistent with $[A] = \\mathrm{T\
    \ \\cdot m}$ (equivalently V\xB7s/m). Field-map values are computed from equilibrium\
    \ reconstruction or finite-element solvers for the toroidal-field coil system\
    \ and can be compared against direct integral evaluations from coil-current distributions.\
    \ See also [poloidal_magnetic_flux](name:poloidal_magnetic_flux) and [toroidal_component_of_magnetic_field](name:toroidal_component_of_magnetic_field)."
  unit: T.m
  tags:
  - equilibrium-reconstruction
  - flux-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: radial_force_combination_weight_of_coil
  kind: scalar
  status: draft
  description: Dimensionless coefficient weighting an individual coil's radial force
    contribution within a linear force-combination limit expression.
  documentation: "This weight $w_i$ defines the contribution of the $i$-th coil to\
    \ a combined radial force constraint $F_{\\text{comb}} = \\sum_i w_i F_{R,i}$,\
    \ where $F_{R,i}$ is the radial electromagnetic force (positive outward) on coil\
    \ $i$ in newtons. Force-combination limits protect the support structure against\
    \ differential radial loads \u2014 for example, net outward separation forces\
    \ on adjacent central-solenoid modules. A weight of $+1$ adds the coil force;\
    \ $-1$ subtracts it (e.g., for a difference constraint); 0 excludes the coil.\
    \ See [force_limit_combination_matrix_of_active_coil_set](name:force_limit_combination_matrix_of_active_coil_set)\
    \ for the full matrix representation of all force-limit expressions."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: radial_offset_of_coil_conductor_cross_section_outline_point
  kind: scalar
  status: draft
  description: Radial offset $\Delta R$ of a conductor cross-section outline vertex
    relative to a local reference point, for TF or non-axisymmetric coils.
  documentation: "The radial offset $\\Delta R$ (in meters) specifies the displacement\
    \ in the major-radius direction of a vertex on the conductor cross-section outline,\
    \ measured from a local reference point (the conductor center or a defined origin\
    \ within the cross-section). An ordered set of $(\\Delta R, \\Delta Z)$ pairs\
    \ traces the conductor boundary in the cross-section plane, enabling representation\
    \ of arbitrary conductor shapes (rectangular, circular, racetrack, or free-form).\
    \ For toroidal-field coils, conductor cross-sections have dimensions of order\
    \ 10\u201350 mm; for non-axisymmetric correction coils, similar scales apply.\
    \ Accurate cross-section geometry is required for computing current-density distributions,\
    \ AC losses, and quench propagation in superconducting magnets. See also [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ and [width_of_coil_conductor_cross_section](name:width_of_coil_conductor_cross_section)\
    \ and [binormal_coordinate_of_coil_conductor_cross_section_outline_point](name:binormal_coordinate_of_coil_conductor_cross_section_outline_point)."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: saturated_relative_permeability_of_ferritic_object
  kind: scalar
  status: draft
  description: Relative magnetic permeability of a ferritic insert element in the
    fully saturated magnetization regime.
  documentation: "The saturated relative permeability $\\mu_{r,\\text{sat}}$ characterizes\
    \ the material response $B = \\mu_0 \\mu_r H$ of a ferritic element once its magnetization\
    \ has reached saturation, where $\\mu_0 = 4\\pi \\times 10^{-7}$ H/m is the vacuum\
    \ permeability and $H$ is the magnetic field intensity. For reduced-activation\
    \ ferritic-martensitic steels used in fusion blanket modules, $\\mu_{r,\\text{sat}}$\
    \ approaches values near 1\u20135 (above the knee of the B-H curve), in contrast\
    \ to unsaturated values of several hundred. This parameter feeds into magnetostatic\
    \ solvers that compute field perturbations from ferritic inserts, particularly\
    \ for error-field and ripple assessments. Note: the DD declares unit H\xB7m$^{-1}$,\
    \ but the quantity is described as a dimensionless relative permeability\u2014\
    this is a known DD unit inconsistency. See [magnetic_field_of_permeability_table_entry](name:magnetic_field_of_permeability_table_entry)\
    \ for the B-H look-up table and [vertical_component_of_ferritic_element_magnetic_moment](name:vertical_component_of_ferritic_element_magnetic_moment)\
    \ for the resulting magnetization."
  unit: H.m^-1
  tags:
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_coil_conductor_element_end_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of the end point of a discrete conductor element
    in a coil winding description.
  documentation: The toroidal angle $\phi_{\mathrm{end}}$ (in rad) specifies the azimuthal
    position of the terminating vertex of a filamentary or finite-cross-section conductor
    element in the $(R, \phi, Z)$ cylindrical coordinate system. Together with the
    corresponding major-radius and vertical coordinates, it fully locates the end
    point of each piecewise-linear or arc segment used to discretize the three-dimensional
    coil conductor path. This quantity applies to both toroidal-field (TF) coils and
    non-axisymmetric coils (e.g., error-field correction or RMP coils). The angle
    is oriented counter-clockwise when viewed from above, consistent with the standard
    right-handed cylindrical convention. Values span $[0, 2\pi)$ rad for a full toroidal
    circuit. See also [toroidal_angle_of_coil_conductor_element_start_point](name:toroidal_angle_of_coil_conductor_element_start_point)
    and [toroidal_angle_of_coil_conductor_element_intermediate_point](name:toroidal_angle_of_coil_conductor_element_intermediate_point).
  unit: rad
  tags:
  - cartesian-coordinates
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_coil_conductor_element_intermediate_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of an intermediate waypoint along a coil conductor
    element's 3-D filament path.
  documentation: The toroidal angle $\phi$ (in radians) locates intermediate geometric
    waypoints that, together with start and end points, define the three-dimensional
    trajectory of a conductor element in $(R, \phi, Z)$ cylindrical coordinates. Intermediate
    points are needed when the conductor path between start and end points is not
    a simple arc and requires piecewise-linear or spline interpolation. The angle
    is measured counter-clockwise when viewed from above. For TF coils, $\phi$ varies
    monotonically along the winding; for non-axisymmetric correction coils, saddle-loop
    geometries produce non-monotonic $\phi$ traces. See [toroidal_angle_of_coil_conductor_element_start_point](name:toroidal_angle_of_coil_conductor_element_start_point)
    and [toroidal_angle_of_coil_conductor_element_end_point](name:toroidal_angle_of_coil_conductor_element_end_point)
    for the bounding points.
  unit: rad
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_coil_conductor_element_start_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of the start point of a discrete conductor element
    in a coil winding description.
  documentation: The toroidal angle $\phi_{\mathrm{start}}$ (in rad) specifies the
    azimuthal position of the initial vertex of a filamentary or finite-cross-section
    conductor element in the $(R, \phi, Z)$ cylindrical coordinate system. Combined
    with the major-radius and vertical coordinates, it fully defines the starting
    position of each piecewise-linear or arc segment used to discretize the three-dimensional
    conductor path of TF or non-axisymmetric coils. The angle is oriented counter-clockwise
    when viewed from above, following the standard right-handed cylindrical convention.
    Values span $[0, 2\pi)$ rad. See also [toroidal_angle_of_coil_conductor_element_end_point](name:toroidal_angle_of_coil_conductor_element_end_point)
    and [toroidal_angle_of_coil_conductor_element_intermediate_point](name:toroidal_angle_of_coil_conductor_element_intermediate_point).
  unit: rad
  tags:
  - cartesian-coordinates
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_offset_of_coil_conductor_cross_section_outline_point
  kind: scalar
  status: draft
  description: Toroidal angular displacement of a conductor cross-section outline
    point relative to a reference point on the conductor centerline.
  documentation: The toroidal angle offset $\Delta\phi$ specifies the toroidal displacement
    (in radians) of each discrete point defining the conductor cross-section outline,
    measured relative to a designated reference point on the conductor path. For axisymmetric
    toroidal-field (TF) coils and non-axisymmetric coils alike, the cross-section
    geometry may vary along the winding path; $\Delta\phi$ captures the out-of-plane
    twist or tilt of the cross section in the toroidal direction. This quantity is
    used alongside the radial offset $\Delta R$ and vertical offset $\Delta Z$ to
    fully reconstruct the three-dimensional conductor envelope from a two-dimensional
    outline extruded along the conductor centerline. Values are zero for conductors
    whose cross section lies entirely in the poloidal plane; non-zero values arise
    in helical or twisted conductor geometries. See also [toroidal_angle_of_coil_conductor_element_start_point](name:toroidal_angle_of_coil_conductor_element_start_point)
    and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for related conductor geometry quantities.
  unit: rad
  tags:
  - cartesian-coordinates
  - derived
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Projection of the magnetic field onto the toroidal direction $\hat{\phi}$
    evaluated at the centroid of each ferritic element.
  documentation: "The toroidal magnetic-field component $B_\\phi = \\mathbf{B} \\\
    cdot \\hat{\\phi}$ at a ferritic element centroid quantifies the local field environment\
    \ that drives the magnetization response of the ferritic material. In tokamaks\
    \ with ferritic steel inserts (e.g., ITER test blanket modules or JT-60SA ferritic\
    \ inserts), the total field at each element centroid determines the operating\
    \ point on the $B$\u2013$\\mu_r$ permeability curve. $B_\\phi$ is the dominant\
    \ component, with on-axis values of 1\u20136 T in present devices. Ferritic magnetization,\
    \ in turn, perturbs the equilibrium field and can introduce error fields requiring\
    \ correction coils. This component is computed from equilibrium or 3-D field codes\
    \ that account for the nonlinear permeability of the ferritic inserts. See also\
    \ [radial_component_of_magnetic_field_at_ferritic_element_centroid](name:radial_component_of_magnetic_field_at_ferritic_element_centroid)\
    \ and [vertical_component_of_magnetic_field](name:vertical_component_of_magnetic_field)."
  unit: T
  tags:
  - equilibrium-reconstruction
  - integrated-modeling
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_magnetic_vector_potential_on_ggd
  kind: vector
  status: draft
  description: Toroidal component of the magnetic vector potential $A_\phi$ represented
    on a generalized grid description (GGD).
  documentation: "The toroidal component $A_\\phi = \\mathbf{A} \\cdot \\hat{\\phi}$\
    \ of the magnetic vector potential relates to the magnetic field through $\\mathbf{B}\
    \ = \\nabla \\times \\mathbf{A}$. In axisymmetric equilibria $A_\\phi$ is directly\
    \ linked to the poloidal magnetic flux via $\\psi = R A_\\phi$, where $R$ is the\
    \ major radius (m) and $\\psi$ the poloidal flux (Wb). On a GGD mesh, one scalar\
    \ value of $A_\\phi$ (in m$\\cdot$T = Wb/m) is stored per grid element, enabling\
    \ flexible representation on unstructured or mixed-element grids used by edge\
    \ and MHD codes. Values are of order 0.1\u201310 Wb/m in tokamak-scale devices.\
    \ See also [toroidal_component_of_magnetic_field_on_ggd](name:toroidal_component_of_magnetic_field_on_ggd)\
    \ for the corresponding field component."
  unit: T.m
  tags:
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_non_axisymmetric_magnetic_field
  kind: vector
  status: draft
  description: Projection of the non-axisymmetric (error-field) vacuum magnetic field
    onto the toroidal direction $\hat{\phi}$.
  documentation: "The toroidal component $B_{\\phi,\\text{NA}}$ of the non-axisymmetric\
    \ magnetic field represents the $\\hat{\\phi}$-directed part of the vacuum error\
    \ field produced by misaligned or purposely non-axisymmetric coils. It is defined\
    \ as $B_{\\phi,\\text{NA}} = \\mathbf{B}_{\\text{NA}} \\cdot \\hat{\\phi}$, where\
    \ $\\hat{\\phi}$ is the unit vector in the geometric toroidal direction. Non-axisymmetric\
    \ fields are responsible for resonant magnetic perturbations (RMPs) used for ELM\
    \ control and for intrinsic error fields that can drive locked modes. Values are\
    \ computed from Biot\u2013Savart integration of coil geometries or measured with\
    \ saddle loops and magnetic probes; magnitudes range from $10^{-4}$\u2013$10^{-2}$\
    \ T on control surfaces for current tokamaks. This quantity is evaluated on a\
    \ field map or control surface and does not include the dominant axisymmetric\
    \ equilibrium field. See [toroidal_component_of_magnetic_field](name:toroidal_component_of_magnetic_field)\
    \ for the total field and [magnetic_field_magnitude](name:magnetic_field_magnitude)\
    \ for the full-field norm."
  unit: T
  tags:
  - equilibrium-reconstruction
  - fourier-component
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_radial_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on the major-radius component
    of the magnetic field evaluated at the centroid of a ferritic element.
  documentation: "This quantity gives the positive-side (upward) error bar on the\
    \ radial magnetic field component $B_R$ at the geometric centroid of a ferritic\
    \ insert or structural element. The true value is expected to lie within $[B_R\
    \ - \\delta B_{R,\\mathrm{lower}},\\; B_R + \\delta B_{R,\\mathrm{upper}}]$ at\
    \ the stated confidence level. Ferritic inserts (e.g., reduced-activation ferritic\u2013\
    martensitic steel in ITER test blanket modules) locally perturb the vacuum and\
    \ plasma magnetic fields; the perturbation $\\delta B_R$ at the element centroid\
    \ is computed from finite-element magnetostatic solvers or measured with Hall\
    \ probes during field mapping campaigns. Uncertainties arise from material permeability\
    \ characterization, mesh discretization, and positioning tolerances; values are\
    \ on the order of $10^{-4}$\u2013$10^{-2}\\;\\mathrm{T}$ depending on the ferritic\
    \ mass and proximity to the plasma. The companion base quantity is the radial\
    \ component of the magnetic field at the ferritic element centroid itself."
  unit: T
  tags:
  - equilibrium-reconstruction
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_toroidal_component_of_magnetic_field_at_ferritic_element_centroid
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on $B_\phi$ at each ferritic
    element centroid.
  documentation: This quantity gives the positive (upper) error bar on the toroidal
    magnetic-field component $B_\phi$ evaluated at the centroid of each ferritic element,
    expressed in the same unit (T) as the parent quantity. Asymmetric uncertainties
    arise from nonlinear permeability modeling, spatial discretization of ferritic
    inserts, and incomplete knowledge of the local field environment. The upper uncertainty
    $\delta B_\phi^{+}$ satisfies $B_\phi \le B_\phi^{\mathrm{true}} \le B_\phi +
    \delta B_\phi^{+}$ at the stated confidence level. See also [toroidal_component_of_magnetic_field_at_ferritic_element_centroid](name:toroidal_component_of_magnetic_field_at_ferritic_element_centroid)
    and [lower_uncertainty_of_radial_component_of_magnetic_field_at_ferritic_element_centroid](name:lower_uncertainty_of_radial_component_of_magnetic_field_at_ferritic_element_centroid).
  unit: T
  tags:
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_vertical_component_of_magnetic_vector_potential
  kind: vector
  status: draft
  description: Upper bound of the asymmetric uncertainty on the vertical component
    of the magnetic vector potential $A_Z$.
  documentation: "This quantity gives the positive-side error bar on the vertical\
    \ vector-potential component $A_Z = \\mathbf{A} \\cdot \\hat{Z}$, expressed in\
    \ m\xB7T. The true value satisfies $A_Z \\le A_{Z,\\mathrm{eval}} + \\Delta A_{Z,\\\
    mathrm{upper}}$. Uncertainty sources include mesh discretization error in finite-element\
    \ MHD solvers, truncation of harmonic expansions, and propagation of coil-current\
    \ measurement errors into the computed potential. For toroidal-field and MHD field-map\
    \ evaluations, uncertainties of order $10^{-4}$\u2013$10^{-2}$ m\xB7T are representative.\
    \ See also [vertical_component_of_magnetic_vector_potential](name:vertical_component_of_magnetic_vector_potential)\
    \ for the parent quantity."
  unit: T.m
  tags:
  - spatial-profile
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_component_of_ferritic_element_magnetic_moment
  kind: vector
  status: draft
  description: Vertical ($Z$) component of the magnetic moment per unit volume (magnetization)
    of an individual ferritic element.
  documentation: "The vertical component $M_Z$ (in A\xB7m$^{-2}$, i.e., magnetization)\
    \ of the magnetic moment of a ferritic element quantifies the element's magnetic\
    \ response in the $\\hat{Z}$ direction. In the continuum approximation, magnetization\
    \ $\\mathbf{M} = \\chi_m \\mathbf{H}$ relates to the magnetic susceptibility $\\\
    chi_m$ and the local magnetic field intensity $\\mathbf{H}$; for ferritic materials\
    \ the relationship is nonlinear and described by a $B$\u2013$H$ (or relative-permeability)\
    \ table. The $Z$ component contributes to the poloidal-field perturbation induced\
    \ by the ferritic structure and is essential for accurate equilibrium reconstruction\
    \ when ferritic inserts are present. Companion components in the $R$ and $\\phi$\
    \ directions complete the vector. See also [vertical_component_of_magnetic_field](name:vertical_component_of_magnetic_field)\
    \ for the ambient field, [radial_component_of_magnetic_field_at_ferritic_element_centroid](name:radial_component_of_magnetic_field_at_ferritic_element_centroid)\
    \ for the driving field at the element location, and [saturated_relative_permeability_of_ferritic_object](name:saturated_relative_permeability_of_ferritic_object)\
    \ for the material property."
  unit: A.m^-2
  tags:
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_component_of_magnetic_field_on_ggd
  kind: vector
  status: draft
  description: Vertical ($Z$) component of the magnetic field evaluated on a general
    grid description (GGD) mesh, providing spatially resolved field data.
  documentation: The vertical magnetic-field component $B_Z$ (in T) is defined on
    a GGD grid, with one scalar value per grid element or node in the designated subset.
    In tokamak cylindrical coordinates $(R, \phi, Z)$, $B_Z = \mathbf{B} \cdot \hat{Z}$
    captures the poloidal-plane vertical part of the total magnetic field. This representation
    is used by field-map descriptions of toroidal-field (TF) coil systems and non-axisymmetric
    field sources, where the field must be interpolated onto arbitrary spatial grids
    rather than stored on a regular $(R, Z)$ mesh. The GGD framework supports unstructured
    meshes, enabling efficient representation of fields near complex geometries such
    as divertor baffles and port structures. For ITER-class TF systems, $|B_Z|$ near
    the coils can reach several tesla. See also [vertical_component_of_magnetic_field](name:vertical_component_of_magnetic_field)
    for the standard $(R, Z)$-grid variant.
  unit: T
  tags:
  - equilibrium-reconstruction
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_component_of_magnetic_vector_potential
  kind: vector
  status: draft
  description: Projection of the magnetic vector potential onto the vertical (Z) axis
    in cylindrical coordinates, $A_Z = \mathbf{A} \cdot \hat{Z}$.
  documentation: "The vertical component $A_Z$ of the magnetic vector potential $\\\
    mathbf{A}$ satisfies $\\mathbf{B} = \\nabla \\times \\mathbf{A}$, where $\\mathbf{B}$\
    \ is the magnetic field. In cylindrical coordinates $(R, \\phi, Z)$, the curl\
    \ relation yields contributions such as $B_R = (1/R)\\partial A_Z/\\partial\\\
    phi - \\partial A_\\phi/\\partial Z$. The unit is $\\mathrm{m \\cdot T}$ (equivalently\
    \ $\\mathrm{Wb/m}$). This component is computed on generalized grids (GGD) within\
    \ MHD and toroidal-field codes and is essential for computing the full 3-D vector\
    \ potential in non-axisymmetric configurations. Values depend strongly on the\
    \ gauge choice; in tokamaks, magnitudes of order 0.01\u20131 m\xB7T arise near\
    \ the plasma. See also [vertical_component_of_magnetic_field_on_ggd](name:vertical_component_of_magnetic_field_on_ggd)\
    \ for the corresponding field component."
  unit: T.m
  tags:
  - flux-coordinates
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_annular_element_centroid
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of the geometric center of an annular cross-section
    element used to model coils, ferritic inserts, or iron-core segments.
  documentation: "The vertical coordinate $Z$ of the annular element centroid locates\
    \ the element in the cylindrical $(R, \\phi, Z)$ coordinate system used for axisymmetric\
    \ electromagnetic modeling. Annular elements represent cross-sections of toroidally\
    \ symmetric structural or magnetic components\u2014poloidal-field coils, ferritic\
    \ inserts, or iron-core segments\u2014and their centroid positions are inputs\
    \ to Biot\u2013Savart or magnetostatic solvers. For medium-size tokamaks, $Z$\
    \ values span approximately $\\pm 5$ m, while ITER-class machines extend to $\\\
    pm 7$ m. Paired with [major_radius_of_annular_element_centre](name:major_radius_of_annular_element_centre)\
    \ to fully specify the poloidal-plane position of the element."
  unit: m
