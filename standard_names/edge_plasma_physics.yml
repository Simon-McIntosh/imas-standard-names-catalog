- name: toroidal_hydrogen_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Toroidal fluid velocity of hydrogen ions at the core-side shoulder\
    \ of the H-mode edge transport barrier, resolved along increasing toroidal angle\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the hydrogen-ion fluid velocity component tangent
    to the toroidal direction at the core-side shoulder of the H-mode edge transport
    barrier. It describes the directed bulk motion of the hydrogen-ion population,
    rather than its speed or a thermal velocity spread.


    $$

    v_{\phi,H} = \mathbf{v}_H \cdot \hat{\phi}

    $$


    where $\mathbf{v}_H$ is the hydrogen-ion fluid-velocity vector and $\hat{\phi}$
    is the toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame.
    The pedestal-top locus denotes the inner shoulder of the edge transport barrier
    and is distinct from the hydrogen-ion velocity evaluated at an internal transport
    barrier, as in [toroidal_hydrogen_velocity_at_internal_transport_barrier](name:toroidal_hydrogen_velocity_at_internal_transport_barrier).
    The quantity is a directed component, not the magnitude of the hydrogen-ion velocity.


    Sign convention: Positive when the hydrogen-ion fluid velocity points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_hydrogen_velocity_at_internal_transport_barrier
  sources:
  - dd_path: summary/local/pedestal/velocity_phi/hydrogen/value
    dd_version: 4.1.0
