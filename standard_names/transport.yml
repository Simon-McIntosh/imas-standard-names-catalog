  sources:
  - kind: imas-dd
    ref: summary/local/magnetic_axis/n_i/xenon/value
    version: 4.1.0
- name: fast_electron_density
  kind: scalar
  status: active
  description: Number density of free electrons per physical volume for the local
    fast electron population, excluding the bulk thermal Maxwellian component.
  documentation: 'Number density of free electrons per physical volume for the local
    fast electron population is the local continuum count density of electrons not
    bound to atoms, molecules, or ions that belong to the nonthermal fast-electron
    component.


    For the fast-electron distribution, the defining relation is:


    $$

    n_{e,\mathrm{fast}}(\mathbf{x}) = \int f_{e,\mathrm{fast}}(\mathbf{x},\mathbf{v})\,d^3\mathbf{v}

    $$


    where $n_{e,\mathrm{fast}}(\mathbf{x})$ is the local fast-electron number density,
    $f_{e,\mathrm{fast}}(\mathbf{x},\mathbf{v})$ is the fast-electron velocity distribution,
    $\mathbf{x}$ is position, $\mathbf{v}$ is electron velocity, and $d^3\mathbf{v}$
    is the volume element in velocity space.


    This quantity applies only to the local nonthermal fast or suprathermal electron
    population. The bulk thermal Maxwellian electron component is excluded, and no
    aggregation along a chord or over a plasma volume is performed; the quantity is
    a local component density rather than a fraction of the total population.


    The parent [electron density](name:electron_density) denotes the unqualified local
    free-electron density. The [thermal electron density](name:thermal_electron_density)
    describes the complementary bulk thermal component, while the [total electron
    density](name:total_electron_density) combines the thermal and fast components
    when they are resolved separately.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:electron_density
  - name:thermal_electron_density
