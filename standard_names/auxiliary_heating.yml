- name: vertical_coordinate_of_neutral_beam_injector
  kind: scalar
  status: active
  description: "Vertical coordinate Z of the declared reference position of a neutral\
    \ beam injector is the signed height of that point from the equatorial plane in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Vertical coordinate $Z$ of the declared reference position of a
    neutral beam injector is the signed height of that point relative to the equatorial
    plane in the right-handed cylindrical $(R, \phi, Z)$ frame. It identifies only
    the vertical component of the injector reference-point position.


    The coordinate is the projection of the reference-point displacement onto the
    vertical basis vector:


    $$

    Z_\mathrm{NBI} = \mathbf{r}_\mathrm{ref} \cdot \hat{Z}

    $$


    where $\mathbf{r}_\mathrm{ref}$ is the displacement of the declared reference
    position from an origin on the symmetry axis in the equatorial plane, and $\hat{Z}$
    is the vertical basis vector of the right-handed cylindrical $(R, \phi, Z)$ frame.


    For an extended injector, this quantity locates only the declared reference point;
    it does not define the injector aperture, beam-axis direction, beam footprint,
    or full beam geometry. A complementary position coordinate is [radial_coordinate_of_neutral_beam_injector](name:radial_coordinate_of_neutral_beam_injector)
    when defined for the same reference point.


    Sign convention: Positive when the declared reference position lies above the
    equatorial plane in the $+\hat{Z}$ direction.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:radial_coordinate_of_neutral_beam_injector
  sources:
