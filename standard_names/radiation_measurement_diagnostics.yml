    and minimum edge coordinates along $X_1$. The quantity is non-negative and applies
    to the usable clear opening, excluding opaque mounts or other structures outside
    the aperture. The corresponding extent along the second local tangential axis
    is [height of the optical element](name:height_of_optical_element).'
