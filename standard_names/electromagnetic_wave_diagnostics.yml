- name: parallel_wave_electric_field
  kind: scalar
  status: active
  description: Complex phasor of the wave electric field projected along the local
    equilibrium magnetic-field direction in a magnetized plasma.
  documentation: 'The parallel wave electric field is the complex phasor obtained
    by projecting the electromagnetic-wave electric-field phasor onto the local equilibrium
    magnetic-field direction. It retains both amplitude and phase and is a component
    of the [wave electric field](name:wave_electric_field).


    The parallel component is defined by


    $$

    E_{\parallel}=\mathbf{E}_{w}\cdot\hat{\mathbf{b}},\qquad \hat{\mathbf{b}}=\frac{\mathbf{B}_{0}}{|\mathbf{B}_{0}|}

    $$


    where $\mathbf{E}_{w}$ is the complex wave-electric-field phasor, $\mathbf{B}_{0}$
    is the local equilibrium magnetic field, and $\hat{\mathbf{b}}$ is its unit direction.
    The phasor carries the phase of the harmonic field under the selected time convention.


    This quantity is the complex component rather than its magnitude. Its modulus
    gives the [parallel wave electric field amplitude](name:parallel_wave_electric_field_amplitude),
    while its quadratures include the [parallel wave electric field imaginary part](name:parallel_wave_electric_field_imaginary_part)
    and the corresponding real part.


    Sign convention: Positive when the electric-field component is directed along
    the local equilibrium magnetic-field direction $\hat{\mathbf{b}}$.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wave_electric_field
  - name:parallel_wave_electric_field_amplitude
  - name:parallel_wave_electric_field_imaginary_part
  arguments:
  - name: wave_electric_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_wave_electric_field_imaginary_part
  kind: complex
  status: active
  description: Imaginary quadrature component of the complex wave electric-field phasor
    projected along the local equilibrium magnetic-field direction.
  documentation: 'This quantity is the signed imaginary quadrature component of the
    parallel electromagnetic wave electric-field phasor. It retains phase information
    and is not the field amplitude or magnitude.


    $$

    \tilde E_\parallel = \tilde{\mathbf E}\cdot\hat{\mathbf b} = E_{\parallel,R}+iE_{\parallel,I},\qquad
    E_{\parallel,I}=\operatorname{Im}(\tilde E_\parallel)

    $$


    Here $\tilde{\mathbf E}$ is the complex wave electric-field phasor, $\hat{\mathbf
    b}$ is the unit vector along the local equilibrium magnetic field, and $E_{\parallel,R}$
    and $E_{\parallel,I}$ are its real and imaginary quadrature components. The imaginary
    component, together with the [parallel wave electric field](name:parallel_wave_electric_field),
    specifies the complex parallel field; its algebraic sign follows the selected
    temporal phasor convention. It is distinct from the [parallel wave electric field
    amplitude](name:parallel_wave_electric_field_amplitude).


    Sign convention: Positive when the imaginary quadrature electric-field component
    points along the local equilibrium magnetic-field direction.'
  unit: V.m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_wave_electric_field
  - name:parallel_wave_electric_field_amplitude
  arguments:
  - name: parallel_wave_electric_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - dd_path: ece/channel/beam_tracing/beam/e_field/parallel/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-e_field-parallel-imaginary
    dd_documentation:
