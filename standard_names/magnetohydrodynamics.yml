- name: toroidal_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the toroidal component of the complex first-order magnetic-field
    perturbation eigenfunction in the current-free vacuum region, for a specified
    toroidal mode number in linear MHD stability analysis.
  documentation: 'The real part of [toroidal_perturbed_vacuum_magnetic_field](name:toroidal_perturbed_vacuum_magnetic_field)
    is the in-phase quadrature component of the toroidal projection $\delta B_\phi$
    of the complex first-order magnetic-field perturbation in the current-free vacuum
    region surrounding the plasma. In linear MHD stability analysis, perturbations
    are decomposed by toroidal mode number $n$ via an $e^{in\phi}$ Fourier ansatz,
    producing complex eigenfunctions whose real and imaginary parts represent orthogonal
    quadrature components of the spatial eigenstructure.


    In the vacuum region, $\nabla \times \delta\mathbf{B} = 0$ and $\nabla \cdot \delta\mathbf{B}
    = 0$, so $\delta\mathbf{B}$ derives from a scalar magnetic potential. The real
    part of the toroidal component is extracted as:


    $$

    \mathrm{Re}(\delta B_\phi) = \frac{1}{2}\!\left(\delta\hat{B}_\phi + \delta\hat{B}_\phi^*\right)

    $$


    where $\delta\hat{B}_\phi$ is the complex eigenfunction amplitude and $*$ denotes
    complex conjugation.


    This quantity is computed by linear MHD stability codes solving for the vacuum
    magnetic response for each specified toroidal mode number. The absolute amplitude
    is set by the eigenfunction normalization convention. The complementary quadrature
    component is the [imaginary part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part);
    together they fully specify the complex toroidal vacuum eigenfunction. The analogous
    quantity in the plasma interior is [toroidal_perturbed_plasma_magnetic_field_real_part](name:toroidal_perturbed_plasma_magnetic_field_real_part),
    and the poloidal vacuum counterpart is [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part).


    Sign convention: Positive when $\mathrm{Re}(\delta B_\phi)$ points in the direction
    of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_vacuum_magnetic_field
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
