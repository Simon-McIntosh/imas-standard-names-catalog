name: neoclassical_tearing_mode_toroidal_mode_number
status: draft
cocos_transformation_type: one_like
description: Integer toroidal mode number $n$ of a neoclassical tearing mode, identifying
  the toroidal periodicity of the island structure.
documentation: The toroidal mode number $n$ counts the number of island O-points around
  the torus for a given NTM. Combined with the poloidal mode number $m$, it determines
  the resonant safety factor $q_s = m/n$ at which the island chain is located. Dominant
  NTMs in conventional tokamak scenarios have $n = 1$ (for $m/n = 2/1$ or $3/1$) or
  $n = 2$ (for $m/n = 3/2$); higher-$n$ modes are less commonly observed because neoclassical
  drive decreases with increasing $n$. Identification is performed via toroidal arrays
  of Mirnov coils or saddle loops that resolve the toroidal phase pattern of the magnetic
  perturbation. Electron cyclotron current drive (ECCD) stabilization targets the
  rational surface specified by $m$ and $n$.
