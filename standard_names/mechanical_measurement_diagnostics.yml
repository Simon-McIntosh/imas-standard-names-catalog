- name: x_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: X Cartesian coordinate of the attachment point of an operational instrumentation
    sensor on the device structure, measured in the right-handed Cartesian $(x, y,
    z)$ frame.
  documentation: "The X Cartesian coordinate $x_{\\rm att}$ locates the sensor attachment\
    \ point along the $\\hat{x}$ axis of the right-handed Cartesian $(x, y, z)$ frame,\
    \ where $\\hat{z}$ is vertical and $\\phi = 0$ defines the $\\hat{x}$ direction\
    \ by the facility convention. Together with [y_coordinate_of_sensor_attachment_point](name:y_coordinate_of_sensor_attachment_point)\
    \ and [z_coordinate_of_sensor_attachment_point](name:z_coordinate_of_sensor_attachment_point),\
    \ it fully specifies the three-dimensional position of the structural anchor point\
    \ from which the sensor's measurement location and orientation are referenced.\
    \ Typical values span $\\pm$(0\u201310) m depending on the machine size and sensor\
    \ location. The attachment point is determined from engineering survey data or\
    \ computer-aided design (CAD) geometry and is used in conjunction with the sensor's\
    \ [direction_unit_vector](name:direction_unit_vector) to define the line of sight\
    \ or active sensing volume in device coordinates.\n\nSign convention: Positive\
    \ when the attachment point lies on the $+\\hat{x}$ side of the machine symmetry\
    \ axis, i.e. in the direction of increasing $x$ in the right-handed Cartesian\
    \ $(x, y, z)$ frame."
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:y_coordinate_of_sensor_attachment_point
  - name:z_coordinate_of_sensor_attachment_point
  - name:direction_unit_vector
  constraints: []
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/x
    dd_path: operational_instrumentation/sensor/attachement_points/x
    status: composed
- name: y_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Y Cartesian coordinate of the attachment point of an operational instrumentation
    sensor on the device structure, measured in the right-handed Cartesian $(x, y,
    z)$ frame.
  documentation: "The $y$-coordinate $y_{\\rm att}$ locates the sensor attachment\
    \ point along the $\\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame,\
    \ where $\\hat{z}$ is vertical and $\\hat{x} \\times \\hat{y} = \\hat{z}$. Together\
    \ with the companion coordinates [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)\
    \ and [z_coordinate_of_sensor_attachment_point](name:z_coordinate_of_sensor_attachment_point),\
    \ it fully specifies the three-dimensional position of the mechanical interface\
    \ between a sensor and the device structure. This attachment point governs the\
    \ geometric relationship between the sensor's sensing direction \u2014 described\
    \ by [y_component_of_direction_unit_vector](name:y_component_of_direction_unit_vector)\
    \ \u2014 and the measured physical field, so accurate knowledge of $y_{\\rm att}$\
    \ is essential for field reconstruction and source localization. Values are determined\
    \ from engineering surveys or computer-aided design models of the device, and\
    \ they remain fixed for a given hardware configuration. Typical magnitudes range\
    \ from sub-meter to several meters depending on machine size.\n\nSign convention:\
    \ Positive when the attachment point lies in the $+\\hat{y}$ half-space of the\
    \ right-handed Cartesian $(x, y, z)$ frame."
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_coordinate_of_sensor_attachment_point
  - name:z_coordinate_of_sensor_attachment_point
  - name:y_component_of_direction_unit_vector
  constraints: []
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/y
    dd_path: operational_instrumentation/sensor/attachement_points/y
    status: composed
- name: z_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Vertical (Z) Cartesian coordinate of the attachment point of an operational
    instrumentation sensor on the device structure, measured in the right-handed Cartesian
    $(x, y, z)$ frame.
  documentation: 'The $z$-coordinate locates the sensor attachment point along the
    vertical axis of the device in the right-handed Cartesian $(x, y, z)$ frame, where
    $z$ is vertical height measured in meters from the machine midplane or a defined
    reference datum. Together with the horizontal coordinates [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)
    and [y_coordinate_of_sensor_attachment_point](name:y_coordinate_of_sensor_attachment_point),
    this coordinate fully specifies the three-dimensional position of the mechanical
    interface between the sensor and the supporting structure. Typical values span
    the full vertical extent of the machine, ranging from roughly $-5$ m to $+5$ m
    for large tokamaks, and are determined from engineering drawings or metrology
    surveys during installation. The sensing direction of the instrument at this point
    is characterized by the unit-vector component [z_component_of_direction_unit_vector](name:z_component_of_direction_unit_vector).


    Sign convention: Positive when the attachment point is located above the machine
    equatorial midplane in the $+z$ (upward) direction.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_coordinate_of_sensor_attachment_point
  - name:y_coordinate_of_sensor_attachment_point
  - name:z_component_of_direction_unit_vector
  constraints: []
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/z
    dd_path: operational_instrumentation/sensor/attachement_points/z
    status: composed
