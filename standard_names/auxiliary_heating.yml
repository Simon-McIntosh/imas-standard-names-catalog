- name: per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase
  kind: scalar
  status: draft
  description: Phase angle of the left-hand circularly polarized electric field component
    per toroidal mode number in the poloidal cross-section. Defined as the argument
    of the complex spectral amplitude. The physically meaningful unit is radians (dimensionless).
  documentation: 'In full-wave simulations of ion cyclotron resonance heating (ICRH)
    and related radiofrequency heating scenarios, the wave electric field is decomposed
    into left-hand polarized (LHP) and right-hand polarized (RHP) circularly polarized
    components relative to the background magnetic field $\mathbf{B}_0$. Following
    the Stix convention, the LHP component $E_-$ rotates in the sense opposite to
    positive-ion gyration; it is sometimes denoted $E^-$ or $E_\mathrm{L}$ in the
    literature.


    For each toroidal mode number $n_\phi$, the complex spectral amplitude of the
    LHP component at a point $(R, Z)$ in the poloidal cross-section (right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical
    height) is written


    $$\tilde{E}_-(n_\phi, R, Z) = |\tilde{E}_-|\, e^{i\varphi_-}$$


    where the phase $\varphi_- = \arg(\tilde{E}_-)$ is the quantity reported here,
    and $|\tilde{E}_-|$ is the companion amplitude documented in [per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude](name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude).


    The phase is the principal value $\varphi_- \in (-\pi,\, \pi]$ (radians). The
    full complex field is reconstructed as $\tilde{E}_- = |\tilde{E}_-|\cos\varphi_-
    + i|\tilde{E}_-|\sin\varphi_-$.


    Typical values span the full interval $(-\pi, \pi]$. The phase encodes spatial
    interference patterns among toroidal modes and is essential for coherent superposition
    of the wave field. It does not by itself determine net power absorption, which
    depends on the full wave-particle phase relation integrated over the distribution
    function.


    The LHP component couples resonantly to electrons via electron cyclotron damping
    and to ions at higher harmonics. In minority-heating scenarios, both polarization
    components contribute at the ion-ion hybrid resonance layer.


    Note: The declared unit $\mathrm{m}^{-1}\!\cdot\!\mathrm{V}$ reflects the data-dictionary
    inheritance from the electric-field amplitude family; the physically correct unit
    for a phase angle is radians (dimensionless). This applies equally to all phase
    quantities in this family.


    The right-hand polarized counterpart follows the same spatial scope and phase
    convention; see [per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase](name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase).
    The parallel polarization phase is documented in [per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase](name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase).'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude
  - name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase
  - name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/plus/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/plus/phase
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_tor/plus/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_tor/plus/phase
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_tor/plus/phase
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_tor/plus/phase
    status: composed
- name: per_toroidal_mode_of_parallel_component_of_wave_electric_field_amplitude
  kind: scalar
  status: draft
  description: Amplitude of the parallel component of the wave electric field resolved
    per toroidal mode number, where the parallel direction is along the local equilibrium
    magnetic field unit vector. The unit m^-1.V reflects the Fourier spectral coefficient
    normalization convention for toroidal decomposition.
  documentation: "The wave electric field $\\mathbf{E}$ is decomposed into toroidal\
    \ Fourier modes in the right-handed cylindrical $(R, \\phi, Z)$ frame:\n$$E_\\\
    parallel(R,Z,\\phi) = \\sum_{n_\\phi} \\hat{E}_\\parallel(n_\\phi;\\,R,Z)\\,e^{\\\
    mathrm{i}\\,n_\\phi\\,\\phi},$$\nwhere $E_\\parallel = \\mathbf{E} \\cdot \\hat{b}$\
    \ is the projection of the electric field onto the equilibrium magnetic field\
    \ unit vector $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$, $R$ is the major radius\
    \ in meters, $Z$ is the vertical height in meters, and $\\phi$ is the toroidal\
    \ angle in radians increasing counter-clockwise when viewed from above.\n\nThis\
    \ standard name stores the modulus $|\\hat{E}_\\parallel(n_\\phi)|$ of the complex\
    \ Fourier coefficient for a single toroidal mode number $n_\\phi$. The corresponding\
    \ complex coefficient carries both amplitude and phase information; the phase\
    \ is recorded separately by the companion quantity.\n\nThe registered unit $\\\
    mathrm{m^{-1}\\cdot V}$ (equivalent to $\\mathrm{V\\,m^{-1}}$) is the standard\
    \ unit for all per-toroidal-mode electric field amplitudes in this family. It\
    \ arises because the Fourier coefficient $\\hat{E}_\\parallel$ has the same dimensions\
    \ as the physical field $E_\\parallel$ in $\\mathrm{V\\,m^{-1}}$; the notation\
    \ $\\mathrm{m^{-1}\\cdot V}$ is simply an algebraic rearrangement and does not\
    \ imply an additional length$^{-1}$ factor.\n\nThe parallel electric field component\
    \ is physically significant because it accelerates charged particles along magnetic\
    \ field lines, providing the dominant channel for wave-particle energy exchange\
    \ through Landau damping, transit-time magnetic pumping, and electron cyclotron\
    \ current drive. Resolving per toroidal mode number $n_\\phi$ is essential for\
    \ identifying which spectral components couple to specific resonance layers and\
    \ wave branches in ion-cyclotron range of frequencies (ICRF) and electron cyclotron\
    \ (EC) heating scenarios.\n\nThe time convention assumes a phasor representation\
    \ $e^{\\mathrm{i}(n_\\phi \\phi - \\omega t)}$, so the physical field is recovered\
    \ by taking the real part after multiplying the complex coefficient by the time-harmonic\
    \ factor.\n\nTypical values of $|\\hat{E}_\\parallel(n_\\phi)|$ range from $10^{-2}$\
    \ to $10^{2}\\,\\mathrm{V\\,m^{-1}}$ per toroidal mode near absorption layers\
    \ in auxiliary heating scenarios, depending on launched power, frequency, and\
    \ plasma parameters. Near antenna structures, dominant modes may reach $10^{3}$\u2013\
    $10^{4}\\,\\mathrm{V\\,m^{-1}}$."
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase
  - name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude
  - name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_amplitude
  - name:binormal_component_of_wave_electric_field
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/amplitude
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/amplitude
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/amplitude
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_tor/parallel/amplitude
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_tor/parallel/amplitude
    status: composed
- name: per_toroidal_mode_of_parallel_component_of_wave_electric_field_phase
  kind: scalar
  status: draft
  description: "Argument (phase angle) of the complex spectral amplitude of the field-aligned\
    \ (parallel) component of the coherent wave electric field, resolved per toroidal\
    \ mode number. The phase is defined as the argument of the complex phasor whose\
    \ modulus is the corresponding amplitude standard name. Physically dimensionless\
    \ (radians); the registered unit m^-1\xB7V reflects spectral normalization inherited\
    \ from the electric field decomposition."
  documentation: 'The parallel component of the wave electric field, $E_\parallel
    = \mathbf{E} \cdot \hat{b}$, where $\hat{b}$ is the unit vector along the equilibrium
    magnetic field $\mathbf{B}$, is the field-aligned projection that drives Landau
    damping and transit-time magnetic pumping on both electrons and ions.


    For a coherent wave, the field is decomposed into toroidal Fourier harmonics indexed
    by the toroidal mode number $n_\phi$ (integer, with $\phi$ the toroidal angle
    increasing in the counter-clockwise direction when viewed from above in the right-handed
    cylindrical $(R, \phi, Z)$ frame). This standard name gives the phase $\varphi_\parallel(n_\phi)$
    of that decomposition, defined through the polar representation:

    $$E_\parallel(n_\phi) = |E_\parallel(n_\phi)|\, \exp\!\left(i\,\varphi_\parallel(n_\phi)\right),$$

    where $|E_\parallel(n_\phi)|$ is the companion amplitude standard name `per_toroidal_mode_of_parallel_component_of_wave_electric_field_amplitude`.


    The phase $\varphi_\parallel$ is physically dimensionless (radians). The registered
    unit $\mathrm{m}^{-1}\mathrm{V}$ is a label shared across the per-toroidal-mode
    electric field family and reflects a spectral electric-field normalization convention;
    it does not imply that the phase itself carries those dimensions. The physically
    meaningful quantity is an angle.


    The principal-value convention is $\varphi_\parallel \in (-\pi, \pi]$. Typical
    values span the full $2\pi$ range depending on the spatial location and wave frequency
    relative to the local dispersion relation.


    Together with the corresponding amplitude, the phase fully characterizes the complex
    parallel electric field for each toroidal harmonic. Knowledge of the phase is
    required to reconstruct interference patterns and to determine the spatial distribution
    of wave absorption, for example the power deposited as characterized by `per_toroidal_mode_of_fast_electron_wave_absorbed_power_density`.


    This quantity is one member of a family of per-toroidal-mode electric field phase
    standard names; the analogous phases for the circularly polarized components are
    `per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase` and
    `per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase`.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_parallel_component_of_wave_electric_field_amplitude
  - name:per_toroidal_mode_of_right_hand_circularly_polarized_electric_field_phase
  - name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_phase
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_density
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_phi/parallel/phase
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/phase
    dd_path: waves/coherent_wave/profiles_1d/e_field_n_tor/parallel/phase
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/phase
    dd_path: waves/coherent_wave/profiles_2d/e_field_n_phi/parallel/phase
    status: composed
  - id: dd:waves/coherent_wave/profiles_2d/e_field_n_tor/parallel/phase
