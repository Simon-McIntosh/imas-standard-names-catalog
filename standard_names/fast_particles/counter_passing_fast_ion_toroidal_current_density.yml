name: counter_passing_fast_ion_toroidal_current_density
status: draft
cocos_transformation_type: one_like
description: Toroidal current density carried by the counter-passing fraction of fast
  (non-thermal) ions, excluding back-current contributions.
documentation: "The counter-passing fast-ion toroidal current density $j_\\phi^{f,\\\
  mathrm{ctr}}$ quantifies the toroidal current from supra-thermal ions whose guiding-center\
  \ parallel velocity is anti-parallel to the plasma current ($v_\\parallel < 0$).\
  \ It is evaluated as $j_\\phi^{f,\\mathrm{ctr}} = Z_f e \\int_{\\mathrm{ctr\\text{-}pass}}\
  \ v_\\phi f_f\\, d^3v$, where $Z_f e$ is the fast-ion charge and $f_f$ the fast-ion\
  \ distribution function restricted to the counter-passing velocity-space domain.\
  \ Like its co-passing counterpart, this term excludes the electron and thermal-ion\
  \ drag currents. In tangential NBI with a counter-injection component, $|j_\\phi^{f,\\\
  mathrm{ctr}}|$ can reach $10^3$\u2013$10^4\\;\\mathrm{A\\,m^{-2}}$. Positive when\
  \ the current flows in the $+\\phi$ direction under COCOS-11 (counter-passing ions\
  \ typically contribute a negative $j_\\phi$ in this convention). Computed by Monte\
  \ Carlo orbit-following codes or Fokker\u2013Planck solvers."
