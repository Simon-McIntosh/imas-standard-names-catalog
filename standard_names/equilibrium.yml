- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the closest wall point to the plasma
    boundary in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the
    perpendicular distance from the machine symmetry axis.
  documentation: 'The closest wall point is the point on the first wall or limiter
    surface that lies at minimum geometric distance from the plasma boundary, and
    its major-radius coordinate $R_{\rm cw}$ is measured perpendicular to the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame. This coordinate
    is a key geometric scalar in boundary and wall-loading analyzes, since the proximity
    of the plasma boundary to the wall controls heat-flux deposition, charge-exchange
    neutral recycling, and impurity sputtering yields. Together with the corresponding
    vertical coordinate, $R_{\rm cw}$ defines the 2-D location of the critical wall-contact
    candidate and feeds directly into clearance calculations relative to the plasma
    boundary; compare [major_radius_of_strike_point](name:major_radius_of_strike_point),
    which locates the divertor-target intersection, and [major_radius_of_active_limiter_point](name:major_radius_of_active_limiter_point),
    which locates the limiter contact. Typical values range from ~0.5 m in small devices
    to ~8 m for the ITER first-wall inboard surface, bounded below by the inboard
    wall radius and above by the outboard wall radius of the specific device. The
    quantity is derived from equilibrium reconstruction codes (e.g., EFIT, LIUQE)
    by computing the minimum-distance projection of the reconstructed plasma boundary
    contour onto the machine wall geometry; it can also be obtained from real-time
    shape-control algorithms. The companion [major_radius_of_gap_reference_point](name:major_radius_of_gap_reference_point)
    provides the equivalent coordinate for pre-defined gap measurement locations.


    Sign convention: Positive when $R_{\rm cw}$ is directed outward from the machine
    symmetry axis, i.e. for all physically realizable wall points where $R > 0$.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_strike_point
  - name:major_radius_of_active_limiter_point
  - name:major_radius_of_gap_reference_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/closest_wall_point/r
    dd_path: equilibrium/time_slice/boundary/closest_wall_point/r
    status: composed
- name: major_radius_of_dr_dz_zero_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of a point on the plasma boundary or separatrix
    contour where dR/dZ = 0, indicating that the contour tangent is vertical (parallel
    to the Z-axis) in the poloidal (R, Z) plane, thereby identifying a local radial
    extremum of the boundary outline.
  documentation: "The quantity $R_{dR/dZ=0}$ is the major-radius coordinate of a point\
    \ on the plasma boundary or last closed flux surface (LCFS) / separatrix contour\
    \ at which the derivative of $R$ with respect to $Z$ along the contour vanishes.\
    \ Formally, if the boundary is parameterized as a curve $\\bigl(R(s),\\, Z(s)\\\
    bigr)$ in the right-handed cylindrical $(R, \\phi, Z)$ frame, the condition is\n\
    \n$$\\left.\\frac{dR}{dZ}\\right|_{\\mathrm{contour}} = \\frac{dR/ds}{dZ/ds} =\
    \ 0 \\quad \\Longleftrightarrow \\quad \\frac{dR}{ds} = 0 \\text{ with } \\frac{dZ}{ds}\
    \ \\neq 0.$$\n\nAt such a point the tangent vector to the contour is directed\
    \ purely along $\\hat{Z}$ (vertical), meaning $R$ is stationary along the contour.\
    \ The contour therefore reaches a local radial extremum \u2014 either its innermost\
    \ ($R_{\\min}$) or outermost ($R_{\\max}$) excursion in the poloidal cross-section.\n\
    \nFor a diverted tokamak plasma, the separatrix contour typically possesses at\
    \ least two such points near the midplane: the high-field-side (inboard) radial\
    \ minimum and the low-field-side (outboard) radial maximum. For a limited plasma,\
    \ the LCFS similarly exhibits inner and outer radial extrema where $dR/dZ = 0$.\
    \ When multiple points satisfy this condition, the specific point referenced depends\
    \ on the index within the stored array (see linked DD path).\n\nThis condition\
    \ is distinct from the X-point, where the poloidal magnetic field $B_p$ vanishes\
    \ ($\\nabla\\psi = 0$) and the boundary contour parameterization is singular,\
    \ i.e., both $dR/ds$ and $dZ/ds$ may vanish simultaneously. The $dR/dZ = 0$ condition\
    \ also differs from $dZ/dR = 0$, which identifies points where the contour tangent\
    \ is horizontal (parallel to $\\hat{R}$), corresponding to the top and bottom\
    \ vertical extrema of the boundary.\n\nTypical values depend on device size. For\
    \ a tokamak with major radius $R_0 \\approx 1.5$\u2013$6\\,\\mathrm{m}$ and minor\
    \ radius $a \\approx 0.5$\u2013$2\\,\\mathrm{m}$: the outer radial extremum lies\
    \ near $R_0 + a$ and the inner extremum near $R_0 - a$.\n\n$R$ is non-negative\
    \ by definition of the cylindrical radial coordinate in the right-handed $(R,\
    \ \\phi, Z)$ frame, where $R$ is the perpendicular distance from the machine symmetry\
    \ axis and $Z$ is the vertical height.\n\nThe corresponding vertical coordinate\
    \ of the same geometric point is given by [height_of_dr_dz_zero_point](name:height_of_dr_dz_zero_point).\
    \ For the complementary condition $dZ/dR = 0$ (horizontal tangent, top/bottom\
    \ vertical extrema), see [major_radius_of_dz_dr_zero_point](name:major_radius_of_dz_dr_zero_point)."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_x_point
  - name:major_radius_of_strike_point
  - name:major_radius_of_last_closed_flux_surface
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary_separatrix/dr_dz_zero_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/dr_dz_zero_point/r
    status: composed
- name: major_radius_of_first_point_of_line_of_sight
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the first defining endpoint of a diagnostic
    line-of-sight chord, measured as the perpendicular distance from the machine symmetry
    axis in the right-handed cylindrical (R, phi, Z) frame.
  documentation: "The major radius $R$ of the first point of a line-of-sight chord\
    \ specifies the starting location of the chord in the poloidal plane, defined\
    \ as the perpendicular distance from the machine symmetry axis to that point in\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame. This coordinate, together\
    \ with the corresponding vertical coordinate $Z$ and toroidal angle $\\phi$, fully\
    \ locates the entry point of diagnostic beams used in polarimetry, interferometry,\
    \ electron cyclotron emission, and reflectometry measurements. Typical values\
    \ range from approximately 0.5 m for inner-wall-touching chords to 4\u20135 m\
    \ for outer midplane chords on large-aperture devices such as JET or ITER. The\
    \ paired endpoint [major_radius_of_second_point_of_line_of_sight](name:major_radius_of_second_point_of_line_of_sight)\
    \ defines the exit point of the chord; together these two $R$ coordinates determine\
    \ the chord's horizontal extent across the plasma cross-section. The geometric\
    \ center of a related optical component may be described by [major_radius_of_diagnostic_antenna_reference_point](name:major_radius_of_diagnostic_antenna_reference_point).\n\
    \nSign convention: Positive when the point lies at a finite perpendicular distance\
    \ from the machine symmetry axis, which is always the case for any physical chord\
    \ endpoint; $R$ is intrinsically non-negative in the cylindrical $(R, \\phi, Z)$\
    \ frame."
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_second_point_of_line_of_sight
  - name:major_radius_of_diagnostic_antenna_reference_point
