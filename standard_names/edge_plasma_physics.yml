- name: electrostatic_potential_at_midplane
  kind: scalar
  status: active
  description: Electrostatic potential at midplane is the voltage-valued scalar potential
    of the quasineutral plasma evaluated on the equatorial midplane relative to a
    chosen electrical reference. Its negative spatial gradient defines the local electrostatic
    field, and it is distinct from near-wall plasma potential and floating potential.
  documentation: 'Electrostatic potential at midplane is the voltage-valued scalar
    potential of the quasineutral plasma evaluated on the equatorial midplane of the
    device. It is the midplane restriction of the plasma [electrostatic_potential](name:electrostatic_potential)
    relative to a chosen electrical reference.


    The midplane value is defined by restricting the electrostatic potential to $Z=0$
    in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    \varphi_{\mathrm{mid}}(R,\phi) = \varphi(R,\phi,Z=0)

    $$


    where $\varphi$ is the plasma electrostatic potential, $\varphi_{\mathrm{mid}}$
    is its midplane value, $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The associated electrostatic field is $\mathbf{E}_{\mathrm{es}}=-\nabla\varphi$
    evaluated on the same locus.


    The midplane qualifier specifies a spatial locus, not a material boundary or sheath
    location. This quantity is distinct from [electrostatic_potential_at_wall](name:electrostatic_potential_at_wall),
    which is the plasma-side potential adjacent to a plasma-facing surface, and from
    [floating_electrostatic_potential](name:floating_electrostatic_potential), which
    is the potential acquired by an electrically isolated surface when the net collected
    current is zero. Adding a common constant to the potential and to the electrical
    reference leaves electric fields and potential differences unchanged.


    Sign convention: Positive when the midplane plasma potential exceeds the chosen
    electrical reference potential.'
  unit: V
  physics_domain: edge_plasma_physics
  links:
  - name:electrostatic_potential
  - name:electrostatic_potential_at_wall
  arguments:
  - name: electrostatic_potential
    operator: midplane
    operator_kind: locus
  sources:
  - dd_path: langmuir_probes/reciprocating/plunge/v_plasma
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-reciprocating-plunge-v_plasma
    dd_documentation:
