- name: thermal_ion_absorbed_power_density_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Volumetric power density absorbed by the thermal ion population through
    resonant wave-particle interactions, averaged over a magnetic flux surface.
  documentation: "The quantity $P_{abs,i}^{th}$ represents the power per unit volume\
    \ transferred from a coherent auxiliary wave (e.g., ICRF, LH) to the thermal ion\
    \ population via resonant wave-particle interactions, evaluated as a flux-surface-averaged\
    \ radial profile. It is derived from the wave electric field and the ion susceptibility\
    \ tensor, $P_{abs}^{th} = \\frac{1}{2} \\mathrm{Re}\\left( \\mathbf{j}_{abs}^{th}\
    \ \\cdot \\mathbf{E}^* \\right)$, where $\\mathbf{j}_{abs}^{th}$ is the induced\
    \ current density in the thermal ion population. Deposition profiles are typically\
    \ computed by ray-tracing or full-wave codes coupled to a quasilinear Fokker\u2013\
    Planck solver; in tokamaks, core values can reach several MW/m$^3$ for high-power\
    \ ICRF heating. The flux-surface-averaged absorbed power density on thermal ions\
    \ is distinguished from the total [absorbed_wave_power_density](name:absorbed_wave_power_density)\
    \ by considering only the thermal ion channel. See also [thermal_ion_power_density_due_to_wave_particle_interaction](name:thermal_ion_power_density_due_to_wave_particle_interaction)\
    \ and the per-toroidal-mode counterpart [per_toroidal_mode_thermal_ion_absorbed_wave_power_density](name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density)."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_wave_power_density
  - name:thermal_ion_power_density_due_to_wave_particle_interaction
  - name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_density_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_density_thermal
    status: composed
- name: thermal_ion_absorbed_power_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Total wave power absorbed by the thermal ion population through resonant
    wave-particle interactions, integrated over the full plasma volume.
  documentation: "This quantifies the total power $P_{\\text{th},i}$ transferred from\
    \ a launched auxiliary wave (e.g., ion cyclotron or lower hybrid wave) to the\
    \ thermal ion population via resonant wave-particle interactions. The power is\
    \ the volume integral of the absorbed power density over the plasma, with the\
    \ two-dimensional profile captured by [per_toroidal_mode_thermal_ion_absorbed_wave_power_density](name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density).\
    \ For a wave field with multiple toroidal mode numbers $n_\\phi$, the total absorbed\
    \ power for each $n_\\phi$ is obtained by summing the contributions from the Fourier\
    \ components of the wave field, and the total power across all modes is the sum\
    \ over $n_\\phi$: $P_{\\text{th},i,\\text{total}} = \\sum_{n_\\phi} P_{\\text{th},i}(n_\\\
    phi)$. Typical values for ion cyclotron heating in medium-size tokamaks (e.g.,\
    \ JET, DIII-D) range from 1\u201315 MW for a single antenna. The related quantity\
    \ [per_toroidal_mode_fast_ion_power](name:per_toroidal_mode_fast_ion_power) captures\
    \ the power deposited onto the fast (suprathermal) ion population, which is often\
    \ a critical component of the heating scheme when ion cyclotron resonances generate\
    \ fast-ion tails."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_thermal_ion_absorbed_wave_power_density
  - name:per_toroidal_mode_fast_ion_power
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/power_thermal
    dd_path: waves/coherent_wave/global_quantities/ion/power_thermal
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/ion/power_thermal_n_phi
    dd_path: waves/coherent_wave/global_quantities/ion/power_thermal_n_phi
    status: composed
- name: thermal_ion_power_density_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Volumetric wave power density deposited onto the thermal ion population
    through resonant wave-particle interactions.
  documentation: "The volumetric power density $P_{\\mathrm{th,i}}$ quantifies the\
    \ rate of energy transfer from an auxiliary radio-frequency wave to thermal ions\
    \ via resonant wave-particle interactions. In the quasi-linear regime, the local\
    \ power transfer is $P_{\\mathrm{th,i}} = \\langle \\mathbf{j}_\\mathrm{th,i}\
    \ \\cdot \\mathbf{E} \\rangle$, where $\\mathbf{j}_\\mathrm{th,i}$ is the driven\
    \ current density on thermal ions and $\\mathbf{E}$ is the wave electric field.\
    \ This quantity is evaluated as a 2D poloidal cross-section profile, resolving\
    \ the spatial structure of deposition not captured by flux-surface-averaged quantities.\
    \ Typical values reach $10^5$\u2013$10^7\\,\\mathrm{W\\,m^{-3}}$ in the core of\
    \ ion cyclotron resonance heating (ICRH) scenarios, with the peak located near\
    \ the ion cyclotron resonance layer. It is modeled by ray-tracing or full-wave\
    \ codes (e.g., TORIC, AORS), coupled with a quasi-linear Fokker\u2013Planck solver,\
    \ and is a key input for transport simulations. See also [thermal_ion_absorbed_power_density_due_to_wave_particle_interaction](name:thermal_ion_absorbed_power_density_due_to_wave_particle_interaction)\
    \ for the flux-surface-averaged counterpart, and [per_toroidal_mode_thermal_ion_power_density](name:per_toroidal_mode_thermal_ion_power_density)\
    \ for the decomposition in toroidal mode number."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_absorbed_power_density_due_to_wave_particle_interaction
  - name:per_toroidal_mode_thermal_ion_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_2d/ion/power_density_thermal
    dd_path: waves/coherent_wave/profiles_2d/ion/power_density_thermal
    status: composed
- name: thermal_ion_power_due_to_wave_particle_interaction
  kind: scalar
  status: draft
  description: Wave power absorbed by the thermal ion population through resonant
    wave-particle interactions, integrated over the plasma volume.
  documentation: This quantity represents the net power transferred from a coherent
    electromagnetic wave, typically in the ion cyclotron range of frequencies (ICRF),
    to the thermal ion population. The absorbed power $P_{\rm therm, i} = \int_V p_{\rm
    abs}(\mathbf{r})\, dV$ is the volume integral of the local absorbed power density
    $p_{\rm abs}(\mathbf{r})$ over the plasma region. It is a key metric for assessing
    the efficiency of RF heating schemes, such as ICRH minority heating or mode conversion
    heating, in raising the bulk ion temperature. Typical absorbed powers from ICRF
    systems in medium-size tokamaks range from 1 to 10 MW depending on the plasma
    scenario and antenna coupling. This quantity is distinguished from the power absorbed
    by fast ions via [fast_ion_absorbed_power_due_to_wave_particle_interaction](name:fast_ion_absorbed_power_due_to_wave_particle_interaction)
    and from the spectral decomposition in [per_toroidal_mode_thermal_ion_power_due_to_wave_particle_interaction](name:per_toroidal_mode_thermal_ion_power_due_to_wave_particle_interaction).
    The absorbed power is computed by integrating the local power density from RF
    full-wave or ray-tracing codes (e.g., TORIC, AORSA, GENRAY) over the plasma volume.
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_absorbed_power_due_to_wave_particle_interaction
  - name:per_toroidal_mode_thermal_ion_power_due_to_wave_particle_interaction
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/state/power_thermal
    dd_path: waves/coherent_wave/global_quantities/ion/state/power_thermal
    status: composed
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    status: attached
