name: hard_xray_emissivity
description: Local hard X-ray photon emissivity from plasma radiation.
documentation: |-
  Local hard X-ray photon emissivity $\epsilon_{HXR}$ representing the number of photons emitted per unit volume, per unit solid angle, per unit time in a specified energy band. This quantity is reconstructed from line-integrated detector measurements using tomographic inversion.

  Governing equation:
  $$I = \int_L \epsilon_{HXR}(\mathbf{r}) \, dl$$

  where $I$ is the line-integrated intensity measured by the detector along chord $L$, and $\epsilon_{HXR}(\mathbf{r})$ is the local emissivity at position $\mathbf{r}$.

  Physical significance: Hard X-ray emissivity provides information about high-energy electron populations including [runaway_electron](#runaway_electron) distributions and suprathermal tails. The emissivity profile shape indicates the spatial distribution of energetic electrons and can be used to study [mhd_stability](#mhd_stability) effects on fast particle confinement.

  The emissivity depends on [electron_density](#electron_density), effective charge, and the high-energy electron distribution function. For thermal bremsstrahlung, emissivity scales as $\epsilon \propto n_e^2 Z_{eff} / \sqrt{T_e}$ at high energies. For runaway electrons, the emissivity profile tracks the runaway beam location and intensity.

  Measurement/Calculation methods: Reconstructed from multi-chord hard X-ray camera measurements using tomographic inversion algorithms. The radial profile is typically parameterized on a [normalized_toroidal_flux_coordinate](#normalized_toroidal_flux_coordinate) grid. Detector energy band boundaries ([lower_bound_of_hard_xray_detector_energy_band](#lower_bound_of_hard_xray_detector_energy_band), [upper_bound_of_hard_xray_detector_energy_band](#upper_bound_of_hard_xray_detector_energy_band)) define the spectral range of the measurement.

  Typical values: Core values of $10^{10}$-$10^{14}$ photons/(m$^3$ sr s) depending on plasma conditions and presence of runaway electrons. Higher values during disruptions with runaway electron generation.

  Sign convention: Positive emissivity representing outward photon emission rate per unit volume and solid angle.
