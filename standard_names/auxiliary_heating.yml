  - id: dd:summary/global_quantities/energy_fast_perpendicular/value
    dd_path: summary/global_quantities/energy_fast_perpendicular/value
    status: composed
- name: poloidal_angle_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Poloidal angle of a beam-tracing ray point, defined geometrically as
    atan2(Z - Z_axis, R - R_axis) in the right-handed cylindrical (R, phi, Z) frame.
    It locates the beam in the poloidal plane rather than specifying the propagation
    direction.
  documentation: 'Poloidal angle of a beam-tracing beam is the angular position of
    a ray or beam point in the poloidal plane of the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It is a
    position coordinate of the beam trace, not a propagation angle or wave-vector
    pitch, and it complements radial labels such as [poloidal magnetic flux at the
    same beam-tracing point](name:poloidal_magnetic_flux_at_beam_tracing_point).


    For a geometric angle centered on the magnetic axis, the defining relation is:


    $$

    \theta = \operatorname{atan2}\left(Z - Z_\mathrm{axis}, R - R_\mathrm{axis}\right)

    $$


    where $(R,Z)$ is the beam point position, $(R_\mathrm{axis},Z_\mathrm{axis})$
    is the magnetic-axis position in the same right-handed cylindrical $(R,\phi,Z)$
    frame, and $\operatorname{atan2}(y,x)$ returns the quadrant-resolved angle from
    the positive $R$ direction toward positive $Z$. The outboard midplane corresponds
    to $\theta = 0$.


    In beam-tracing calculations, $\theta$ is computed from the propagated ray coordinates
    or by interpolating an equilibrium coordinate mapping; periodicity is usually
    handled modulo $2\pi$, with optional unwrapping to keep the trajectory continuous.
    The coordinate is used to sample equilibrium and wave-plasma quantities along
    auxiliary-heating beams, including electron-cyclotron and other coherent-wave
    beam models, and to compare beam position with reference geometry such as the
    [poloidal angle at a plasma-boundary gap reference point](name:poloidal_angle_at_plasma_boundary_gap_reference_point).
    It should be distinguished from direction-dependent quantities such as the [radial
    component of normalized wave vector of a beam-tracing beam].


    Typical wrapped values cover 0-6.283 rad: 0 rad on the outboard midplane, about
    1.57 rad above the magnetic axis, about 3.14 rad on the inboard side, and about
    4.71 rad below the magnetic axis. Unwrapped values can differ by integer multiples
    of $2\pi$ rad without changing the physical poloidal location.


    Sign convention: Positive when $\theta$ increases counterclockwise from the outboard
    midplane on an $(R,Z)$ poloidal-plane plot with $R$ increasing to the right and
    $Z$ increasing upward in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_magnetic_flux_at_beam_tracing_point
  - name:poloidal_angle_at_plasma_boundary_gap_reference_point
  arguments:
  - name: poloidal_angle
    operator: beam_tracing_beam
    operator_kind: locus
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/position/theta
    dd_path: waves/coherent_wave/beam_tracing/beam/position/theta
    status: composed
- name: poloidal_angle_of_electron_cyclotron_beam
  kind: scalar
  status: draft
  description: Poloidal steering angle of an electron cyclotron beam in the R-Z plane
    of the right-handed cylindrical (R, phi, Z) frame, defined by atan2(-k_Z, -k_R)
    from the mean wave-vector components. It describes the vertical tilt of the beam
    relative to inward radial propagation.
  documentation: 'The poloidal angle of an electron cyclotron beam is the signed steering
    angle of the beam mean wave vector projected onto the poloidal $R$-$Z$ plane of
    the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius and
    $Z$ is vertical height. It describes the vertical tilt of the EC ray or beam relative
    to an inward radial direction and is used together with launch position and toroidal
    steering to specify the beam propagation direction.


    Using $\operatorname{atan2}(y,x)$ for the quadrant-preserving angle from the positive
    $x$ axis toward the positive $y$ axis, the poloidal angle is defined by:


    $$

    \theta_\mathrm{pol} = \operatorname{atan2}(-k_Z, -k_R)

    $$


    where $k_R$ and $k_Z$ are the radial and vertical components of the beam mean
    wave vector in the right-handed cylindrical $(R,\phi,Z)$ frame, typically expressed
    in rad m$^{-1}$. With this definition, $\theta_\mathrm{pol}$ is measured from
    the inward radial direction $-\hat{R}$ toward the downward vertical direction
    $-\hat{Z}$.


    In practice this angle is obtained from launcher mirror geometry, steering calibration,
    or ray and beam tracing that reconstructs the mean wave vector at launch or near
    resonance. It is interpreted together with quantities such as the [toroidal angle
    of the electron cyclotron beam](name:toroidal_angle_of_electron_cyclotron_beam),
    [vertical coordinate of the electron cyclotron launcher mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror),
    [toroidal angle of the launching position](name:toroidal_angle_of_launching_position),
    and [launched power of the electron cyclotron antenna]; the poloidal angle influences
    the resonance interception and power-deposition location, but those also depend
    on the magnetic equilibrium, wave frequency, polarization, and plasma profiles.


    For near-radial injection the value is close to 0 rad; larger absolute values
    indicate stronger poloidal tilt. The principal-value output of $\operatorname{atan2}$
    lies in the interval $-\pi$ to $\pi$ rad, while the operational steering interval
    is set by the launcher design and is usually narrower.


    Sign convention: Positive when the beam direction in the poloidal plane is rotated
    from the inward radial direction $-\hat{R}$ toward the downward direction $-\hat{Z}$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_electron_cyclotron_beam
  - name:vertical_coordinate_of_electron_cyclotron_launcher_mirror
  - name:toroidal_angle_of_launching_position
  arguments:
  - name: poloidal_angle
