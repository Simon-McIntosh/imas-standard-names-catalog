      kind: llm
- name: reflected_power_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Reflected RF power of a single ion cyclotron resonance heating antenna
    traveling backward toward the generator at the antenna reference plane.
  documentation: 'Reflected power of an ion cyclotron heating antenna is the backward-traveling
    RF power at a defined reference plane on the feed line, directed from the antenna
    toward the generator. It is the component subtracted from forward power to obtain
    the net power launched through the antenna aperture.


    The reflected power is related to the net launched power by:


    $$

    P_\mathrm{reflected} = P_\mathrm{forward} - P_\mathrm{launched}

    $$


    where $P_\mathrm{forward}$ is the incident traveling-wave power represented by
    [forward power](name:forward_power_of_ion_cyclotron_heating_antenna), and $P_\mathrm{launched}$
    is the net power represented by [power of the ion cyclotron heating antenna](name:power_of_ion_cyclotron_heating_antenna),
    with both quantities evaluated at the same reference plane.


    This quantity describes returned RF power and is not plasma-absorbed power or
    net launched power.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_ion_cyclotron_heating_antenna
  - name:power_of_ion_cyclotron_heating_antenna
