      kind: llm
- name: accumulated_total_gas_count_at_midplane_due_to_gas_injection
  kind: scalar
  status: active
  description: Accumulated total gas count at midplane due to gas injection is the
    cumulative unweighted count of neutral gas particles introduced by all injection
    valves near the equatorial midplane over the specified accumulation interval.
    It sums all injected species and is not weighted by neutral electron count, atomic
    number, mass, or valve identity.
  documentation: 'Accumulated total gas count at midplane due to gas injection is
    the cumulative unweighted count of neutral gas particles introduced by all gas-injection
    valves assigned to the equatorial-midplane valve group. It aggregates all injected
    species and all valves in that group; each gas particle contributes one count
    to the total inventory.


    The accumulation over a specified time interval is the time integral of the unweighted
    total midplane gas-particle source rate:


    $$

    N_{\mathrm{gas,mid}}(t_1;t_0) = \int_{t_0}^{t_1} \dot{N}_{\mathrm{gas,mid}}(t'')\,dt''

    $$


    where $N_{\mathrm{gas,mid}}$ is the accumulated dimensionless count, $t_0$ and
    $t_1$ are the interval endpoints in seconds, $t''$ is the integration time in
    seconds, and $\dot{N}_{\mathrm{gas,mid}}$ is the [total gas source rate at midplane
    due to gas injection](name:total_gas_source_rate_at_midplane_due_to_gas_injection)
    in particles per second, summed over all midplane gas-injection valves and all
    injected species.


    For a post-breakdown accumulated inventory, $t_0$ is the plasma-breakdown time;
    for a prefill inventory, the interval is the pre-breakdown gas-fill interval.
    This quantity is the midplane contribution to the all-position [accumulated total
    particle count due to gas injection](name:accumulated_total_particle_count_due_to_gas_injection),
    not a per-valve count and not an equivalent-electron inventory. Species-specific
    inventories such as [accumulated neon count due to gas injection], [accumulated
    nitrogen count due to gas injection], and [accumulated carbon count due to gas
    injection](name:accumulated_carbon_count_due_to_gas_injection) are separate components
    of the injected species inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:total_gas_source_rate_at_midplane_due_to_gas_injection
  - name:accumulated_total_particle_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
