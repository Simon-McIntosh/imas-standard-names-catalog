- name: x2_coordinate_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: X2-axis coordinate of a reflectometer antenna aperture-outline vertex
    in the local aperture frame, paired with the corresponding X1 coordinate to locate
    a point on the emitting or receiving aperture boundary.
  documentation: 'The X2 coordinate of a reflectometer antenna is the signed in-plane
    offset of an aperture-outline vertex along the second transverse axis of the local
    antenna aperture frame. The local frame is the right-handed frame $(\hat{X}_1,
    \hat{X}_2, \hat{n})$, where $\hat{X}_1$ and $\hat{X}_2$ span the aperture plane
    and $\hat{n}$ is the aperture normal.


    For an outline vertex indexed by $j$, the physical point on the aperture boundary
    is represented by


    $$

    \mathbf{r}_j = \mathbf{r}_0 + X_{1,j}\hat{X}_1 + X_{2,j}\hat{X}_2

    $$


    where $\mathbf{r}_0$ is the antenna aperture reference point, $X_{1,j}$ is the
    paired coordinate along $\hat{X}_1$, and $X_{2,j}$ is this coordinate along $\hat{X}_2$,
    all expressed in meters. The ordered vertices $(X_{1,j}, X_{2,j})$ trace the aperture
    boundary; neighboring vertices define boundary segments, and the last vertex connects
    back to the first unless the closing vertex is repeated explicitly.


    In practice, this coordinate is obtained from the antenna mechanical definition,
    design model, survey, or metrology of the emitting or receiving aperture. It is
    used with the paired X1 coordinate to define irregular horn, waveguide, or quasi-optical
    aperture outlines for reflectometry beam and coupling calculations.


    Typical absolute values are set by the physical aperture size: millimeter-scale
    values for small waveguide openings, about 0.01-0.1 m for many horn or quasi-optical
    apertures, and occasionally up to a few tenths of a meter for large launch or
    collection optics.


    Sign convention: Positive when the aperture vertex is displaced from the local
    antenna-frame origin in the $+\hat{X}_2$ direction.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:x1_coordinate_of_reflectometer_antenna
  - name:width_of_reflectometer_antenna
  sources:
  - id: dd:reflectometer_fluctuation/channel/antenna_detection_static/outline/x2
    dd_path: reflectometer_fluctuation/channel/antenna_detection_static/outline/x2
    status: attached
