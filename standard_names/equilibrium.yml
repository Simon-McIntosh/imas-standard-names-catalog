    \ from the machine midplane along the Z direction of the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate of a measurement position is its signed
    height relative to the machine midplane in the right-handed cylindrical $(R,\phi,Z)$
    frame. Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    The coordinate is defined by


    $$

    Z_{\mathrm{meas}} = \mathbf{r}_{\mathrm{meas}} \cdot \hat{\mathbf{Z}}

    $$


    where $Z_{\mathrm{meas}}$ is the vertical coordinate, $\mathbf{r}_{\mathrm{meas}}$
    is the position vector of the measurement location relative to the machine-midplane
    origin, and $\hat{\mathbf{Z}}$ is the vertical unit vector.


    This quantity applies to the geometric measurement position independently of the
    diagnostic type or physical quantity measured there. It represents one coordinate
    of one position, with no averaging over positions, populations, or physical regions,
    and it is not the value of a plasma field evaluated at that location.


    The generic position coordinate has the same geometric meaning as the object-specific
    [vertical coordinate of a camera](name:vertical_coordinate_of_camera) and [vertical
    coordinate of a diagnostic aperture](name:vertical_coordinate_of_diagnostic_aperture);
    those quantities differ only in the object whose position is identified.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_camera
  sources:
