name: tendency_of_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Partial time derivative of the total (thermal plus non-thermal) ion number
  density, $\partial n_i / \partial t$.
documentation: The tendency $\partial n_i / \partial t$ quantifies the local rate
  of change of the ion density at a fixed spatial position and appears on the left-hand
  side of the ion particle continuity equation $\partial n_i / \partial t = S_i -
  \nabla \cdot \Gamma_i$, where $S_i$ represents volumetric sources and sinks (ionization,
  recombination, charge exchange, pellet fueling) and $\Gamma_i$ is the particle flux.
  The unit is m$^{-3}$, consistent with the transport-solver convention where the
  time-step normalization is applied externally. In steady-state conditions $\partial
  n_i / \partial t \approx 0$; significant departures occur during transient events
  such as edge-localized modes, gas puffing, or pellet injection. The value may refer
  to a single charge state or to the sum over charge states for a given ion species.
  Typical transient magnitudes during pellet injection can reach $10^{20}\;\mathrm{m^{-3}\,s^{-1}}$
  locally. See `ion_number_density` for the base profile, `tendency_of_electron_number_density`
  for the electron counterpart, and `volume_averaged_ion_number_density` for the volume-integrated
  view.
