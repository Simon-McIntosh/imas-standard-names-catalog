- name: line_integrated_electron_number_density
  kind: scalar
  status: active
  description: Free-electron column density accumulated along a complete electromagnetic
    propagation path, including both forward and return segments when present.
  documentation: 'The quantity is the column density of free electrons encountered
    along a specified electromagnetic propagation path. It represents the total free-electron
    content accumulated along the path, rather than the local electron population
    at a point.


    For the complete propagation path, the line-integrated electron density is defined
    by


    $$

    N_{e,\mathrm{line}} = \int_{\Gamma_{\mathrm{full}}} n_e(\ell)\,d\ell

    $$


    where $N_{e,\mathrm{line}}$ is the line-integrated electron density, $n_e(\ell)$
    is the local free-electron number density at path position $\ell$, $\ell$ is arclength
    along the path, and $\Gamma_{\mathrm{full}}$ is the complete propagation path.


    The integral applies to the free-electron population along the full line of sight
    and aggregates the local number density over arclength. For a reflected propagation
    channel, the path includes both forward and return segments, with no factor-of-two
    correction. The quantity excludes neutral or bound electrons and is distinct from
    the local [electron density](name:electron_density) and from a path average.


    For a path with total arclength $L$, this quantity relates to the [line-averaged
    electron density](name:line_averaged_electron_density) through $N_{e,\mathrm{line}}
    = L\bar{n}_e$, where $L$ is the total path arclength and $\bar{n}_e$ is the path-averaged
    free-electron number density.'
  unit: m^-2
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_density
  - name:line_averaged_electron_density
  sources:
  - dd_path: equilibrium/time_slice/constraints/n_e_line/measured
