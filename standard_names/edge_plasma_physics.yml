- name: toroidal_helium_3_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: "Toroidal component of the helium-3 ion fluid velocity at the pedestal\
    \ top, resolved along the toroidal direction in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame. It is the density-weighted mean over all helium-3 ion charge\
    \ states and is signed positive for flow toward increasing \u03C6."
  documentation: 'Toroidal component of the helium-3 ion fluid velocity at the pedestal
    top is the helium-3 ion bulk-flow component resolved along $\hat{\phi}$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame. For species-level helium-3, this
    intensive quantity is the density-weighted mean over all helium-3 ion charge states
    at the pedestal top.


    The charge-state-aggregated toroidal component is defined by


    $$

    v_{\phi,\,^3\mathrm{He}}^{\mathrm{ped}} = \frac{\sum_q n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}\left(\mathbf{v}_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}
    \cdot \hat{\phi}\right)}{\sum_q n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}}

    $$


    where $q$ indexes helium-3 ion charge state, $n_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}$
    is the number density of that charge state at the pedestal top, $\mathbf{v}_{^3\mathrm{He}^{q+}}^{\mathrm{ped}}$
    is its ion fluid velocity there, and $\hat{\phi}$ is the unit vector in the direction
    of increasing toroidal angle $\phi$.


    This quantity excludes radial and vertical components in the right-handed cylindrical
    $(R, \phi, Z)$ frame, vector speed, arithmetic averages over charge states, and
    values at other loci such as the [magnetic axis](name:toroidal_helium_3_velocity_at_magnetic_axis).
    It is defined where the total helium-3 ion density in the averaging denominator
    is nonzero.


    Sign convention: Positive when the helium-3 ion fluid velocity is directed toward
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  - name:toroidal_helium_4_velocity_at_pedestal_top
  sources:
