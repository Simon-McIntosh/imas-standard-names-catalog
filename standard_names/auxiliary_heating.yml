- name: fast_ion_power_density
  kind: scalar
  status: draft
  description: Volumetric rate at which RF waves transfer energy to the nonthermal
    fast ion population. It represents deposited wave power per unit plasma volume,
    summed over the relevant fast-ion species and charge states.
  documentation: 'Fast-ion power density is the volumetric source term for energy
    deposited by radio-frequency (RF) waves into the nonthermal ion distribution.
    It is the state-aggregated counterpart of [fast_ion_state_power_density](name:fast_ion_state_power_density)
    and excludes deposition to thermal ions or fast electrons. Its volume integral
    gives [fast_ion_power](name:fast_ion_power), while integration inside a chosen
    flux surface gives [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface).


    For RF absorption, the local source can be written as the cycle-averaged work
    done by the RF electric field on the fast-ion current response:


    $$

    p_{\mathrm{fi}}(\mathbf{x}) = \sum_{a,q} \left\langle \mathbf{J}^{\mathrm{RF}}_{\mathrm{fi},a
    q}(\mathbf{x},t) \cdot \mathbf{E}_{\mathrm{RF}}(\mathbf{x},t) \right\rangle_t

    $$


    where $p_{\mathrm{fi}}$ is the fast-ion power density, $a$ labels ion species,
    $q$ labels charge state, $\mathbf{J}^{\mathrm{RF}}_{\mathrm{fi},a q}$ is the RF
    current response associated with that fast-ion component, $\mathbf{E}_{\mathrm{RF}}$
    is the RF electric field, and $\langle\cdot\rangle_t$ denotes averaging over the
    RF period.


    In practice this quantity is inferred from wave propagation and quasilinear absorption
    calculations constrained by magnetic equilibrium, antenna or launcher parameters,
    and measurements sensitive to the fast-ion distribution. It may also be cross-checked
    against changes in stored fast-ion energy, neutron or gamma-ray emission, neutral-particle
    measurements, and global RF power balance.


    Representative magnitudes are strongly scenario dependent. A useful scale is the
    absorbed RF power divided by the effective deposition volume: 1 MW deposited over
    0.1-10 m$^3$ corresponds to 10$^5$-10$^7$ W m$^{-3}$, while values are near zero
    where no resonant wave-particle interaction occurs.


    Sign convention: Positive when energy is transferred from the RF wave field to
    the fast-ion population.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_density
  - name:fast_ion_state_power_density
