- name: parallel_flux_surface_averaged_current_density_at_constraint_position
  kind: scalar
  status: active
  description: Flux-surface averaged parallel current density at a constraint position
    is the flux-surface average of the current-density vector projected along the
    local magnetic-field direction on the closed magnetic surface selected by the
    constraint position.
  documentation: 'Flux-surface averaged parallel current density at a constraint position
    is the flux-surface average of the current-density vector projected onto the unit
    vector along the local magnetic field, evaluated on the closed magnetic flux surface
    selected by the constraint position. The constraint position is a specified value
    of the normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$, with $0$ on
    the magnetic axis and $1$ at the last closed flux surface.


    For a constraint at $\rho_{\mathrm{tor,norm},c}$, let $\psi_c$ be the value of
    a monotonic flux label $\psi$ on the same magnetic surface. The volume-derivative
    flux-surface average is


    $$

    \langle j_\parallel \rangle_c =

    \frac{\oint_{\psi=\psi_c} \mathbf{j}\cdot\hat{\mathbf{b}} \, dS/|\nabla\psi|}

    {\oint_{\psi=\psi_c} dS/|\nabla\psi|}

    $$


    where $\mathbf{j}$ is the current-density vector, $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector along the local magnetic field $\mathbf{B}$, $dS$ is an element
    of the magnetic surface, and $dS/|\nabla\psi|$ gives the volume-derivative weighting
    of the flux-surface average.


    The definition applies only on closed magnetic flux surfaces for which the flux-surface
    average is defined. It uses the local unit-field projection before averaging;
    it is not a $|\mathbf{B}|$-weighted measure such as $\langle\mathbf{j}\cdot\mathbf{B}\rangle/B_\mathrm{ref}$,
    where $B_\mathrm{ref}$ is a reference magnetic flux density. It is distinct from
    [flux-surface averaged toroidal current density at a constraint position](name:toroidal_flux_surface_averaged_current_density_at_constraint_position),
    which averages the $\hat{\phi}$ component in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $\phi$ is toroidal angle.


    Sign convention: Positive when the flux-surface averaged current-density projection
    is along the local magnetic-field direction.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:parallel_total_current_density
  sources:
  - dd_path: equilibrium/time_slice/constraints/j_parallel/reconstructed
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-j_parallel-reconstructed
    dd_documentation:
      leaf: Value calculated from the reconstructed equilibrium
      parent_path: equilibrium/time_slice/constraints/j_parallel
      parent: Set of flux-surface averaged parallel current density approximations
        at various positions (= average(j.B) / B0, where B0 = /vacuum_toroidal_field/b0)
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Reconstructed value of j parallel.
      kind: template
    semantic_facet: reconstructed
- name: plasma_current
  kind: scalar
  status: active
  description: "Plasma current is the net toroidal electric current carried by the\
    \ plasma column, defined by integrating toroidal current density over the full\
    \ poloidal cross-section in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Plasma current is the net toroidal electric current carried by the
    plasma column in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is the
    cross-sectional integral of the toroidal component of the [total current density](name:total_current_density)
    over the plasma region.


    The defining integral over a poloidal cross-section is


    $$

    I_p = \int_{\mathcal{S}} j_\phi \, dA

    $$


    where $I_p$ is plasma current, $j_\phi$ is the [toroidal current density](name:toroidal_current_density),
    $\mathcal{S}$ is the full poloidal cross-section at fixed toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame and bounded by the plasma boundary,
    and $dA$ is the positive scalar poloidal area element, not an oriented vector
    surface element.


    The integral includes all toroidal current contributions carried by the plasma,
    including inductive, bootstrap, and non-inductive driven currents, and excludes
    currents outside the plasma boundary. For an axisymmetric equilibrium the value
    is independent of the chosen toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame and is the global current associated with the [poloidal magnetic
    field].


    Sign convention: Positive when the net plasma current flows in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, counterclockwise when viewed from the $+\hat{Z}$ direction.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:total_current_density
  - name:toroidal_current_density
  sources:
