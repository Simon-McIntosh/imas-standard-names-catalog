name: floating_potential
status: draft
description: Electric potential acquired by an electrically isolated surface immersed
  in plasma, at which the net current drawn from the plasma is zero.
documentation: "The floating potential $V_f$ is the potential at which the electron\
  \ and ion currents to an unbiased conducting surface balance, yielding zero net\
  \ current: $I_e(V_f) + I_i(V_f) = 0$. For a Maxwellian plasma with electron temperature\
  \ $T_e$ (in eV), $V_f$ is related to the plasma potential $V_p$ by $V_f \\approx\
  \ V_p - \\alpha\\, T_e / e$, where $\\alpha \\approx 2.8$\u20133.0 for hydrogen\
  \ plasmas and depends on the ion mass and secondary-electron emission coefficient.\
  \ Langmuir probes measure $V_f$ directly as the open-circuit voltage of the probe\
  \ tip; sweeping the bias voltage yields the full $I$\u2013$V$ characteristic from\
  \ which $T_e$ and electron density can be extracted. Typical values range from $-200$\
  \ V to $+50$ V in tokamak edge and scrape-off-layer plasmas, with more negative\
  \ values indicating higher $T_e$ or sheath effects. The floating potential is an\
  \ important indicator of sheath behavior and can be used to estimate radial electric\
  \ fields when combined with plasma potential measurements."
