- name: wavelength_of_filter
  kind: scalar
  status: draft
  description: Spectral wavelength characterizing the passband of a diagnostic optical
    filter, encompassing the passband edge wavelengths and the nominal center or reference
    transmission wavelength.
  documentation: 'Optical diagnostic filters define a spectral passband through which
    radiation passes to a detector. Several wavelengths characterize this passband:
    [lower_wavelength_of_filter](name:lower_wavelength_of_filter) marks the short-wavelength
    attenuation edge below which radiation is blocked, [upper_wavelength_of_filter](name:upper_wavelength_of_filter)
    marks the long-wavelength cutoff, and [reference_wavelength_of_filter](name:reference_wavelength_of_filter)
    identifies the nominal peak or center transmission wavelength.


    The relationship between wavelength $\lambda$, photon frequency $\nu$, and the
    speed of light in vacuum $c$ is:


    $$

    \lambda = \frac{c}{\nu}

    $$


    where $\nu$ is the photon oscillation frequency in Hz.


    Passband center wavelengths in visible plasma spectroscopy typically fall in the
    300-800 nm range, selected to coincide with prominent atomic or molecular emission
    features such as H$\alpha$ at 656.3 nm or He I at 587.6 nm. Interference filters
    and narrowband etalons achieve bandwidths from sub-nanometer to tens of nanometers.
    The [spectral_wavelength](name:spectral_wavelength_of_optical_element) describes
    the full spectral axis context, and [wavelength_of_spectral_line](name:wavelength_of_spectral_line)
    provides the rest-frame reference for targeted spectral lines.


    Sign convention: Positive when the wavelength is the spatial period of a forward-propagating
    electromagnetic wave in the transmission medium.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_wavelength_of_filter
  - name:upper_wavelength_of_filter
  - name:reference_wavelength_of_filter
  - name:spectral_wavelength_of_optical_element
  - name:wavelength_of_spectral_line
