- name: parallel_ohmic_current_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel current density driven inductively by
    the parallel electric field, representing the resistively sustained component
    of the total plasma current.
  documentation: 'The ohmic parallel current density is the inductively driven component
    of the total parallel plasma current, sustained by the parallel electric field
    through resistive processes described by Ohm''s law. It is the dominant current
    channel in ohmically heated plasmas and its fractional contribution decreases
    as auxiliary non-inductive drives increase.


    The quantity is defined by the flux-surface average:


    $$

    j_{\mathrm{ohm},\|} = \frac{\langle \mathbf{J}_\mathrm{ohm} \cdot \mathbf{B} \rangle}{B_0}

    $$


    where $\mathbf{J}_\mathrm{ohm}$ is the local ohmic current density vector, $\mathbf{B}$
    is the total magnetic field, $B_0$ is the reference on-axis magnetic field, and
    $\langle \cdot \rangle$ denotes the flux-surface average. The local Ohm''s law
    $j_{\mathrm{ohm},\|} = \sigma_\| E_\|$ couples this quantity to the [parallel
    conductivity] $\sigma_\|$ and the inductive parallel electric field $E_\|$.


    This profile is obtained in transport analyzes by subtracting the [parallel non-inductive
    current density] from the total parallel current density, or computed directly
    from the resistivity profile and the inductive electric field. It enters the magnetic
    flux diffusion equation and governs current-profile evolution on the resistive
    timescale. The [parallel wave-driven current density] and bootstrap contributions
    together constitute the non-inductive complement.


    Typical core values range from $10^5$ to $10^6$ A m$^{-2}$ in auxiliary-heated
    tokamak discharges, decreasing toward the plasma edge and in scenarios with strong
    non-inductive current drive.


    Sign convention: Positive when the ohmic current flows in the same direction as
    the total magnetic field, giving $\langle \mathbf{J}_\mathrm{ohm} \cdot \mathbf{B}
    \rangle > 0$.'
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:core_profiles/profiles_1d/j_ohmic
    dd_path: core_profiles/profiles_1d/j_ohmic
    status: attached
  - id: dd:edge_profiles/profiles_1d/j_ohmic
    dd_path: edge_profiles/profiles_1d/j_ohmic
    status: attached
  - id: dd:plasma_profiles/profiles_1d/j_ohmic
    dd_path: plasma_profiles/profiles_1d/j_ohmic
    status: attached
  - id: dd:sawteeth/profiles_1d/j_ohmic
    dd_path: sawteeth/profiles_1d/j_ohmic
