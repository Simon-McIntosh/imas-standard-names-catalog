- name: ethylene_prefill_count
  kind: scalar
  status: draft
  description: 'Cumulative neutral ethylene (C2H4) introduced during the prefill gas-loading
    phase, expressed as an equivalent-electron count. Each C2H4 molecule contributes
    16 bound atomic electrons: 12 from two carbon atoms and 4 from four hydrogen atoms.'
  documentation: 'Ethylene prefill count is the cumulative amount of neutral ethylene
    introduced during the prefill gas-loading interval before plasma breakdown, expressed
    as an equivalent-electron count. The equivalent-electron convention counts the
    bound atomic electrons in each neutral molecule; for ethylene, two carbon atoms
    with atomic number 6 and four hydrogen atoms with atomic number 1 give 16 electrons
    per C2H4 molecule.


    For a molecular injection rate over the prefill interval, the count is defined
    by


    $$

    N_{\mathrm{eq}}^{\mathrm{prefill}} = \int_{t_0}^{t_b} 16\,\dot{N}_{\mathrm{C_2H_4}}(t)\,dt

    $$


    where $\dot{N}_{\mathrm{C_2H_4}}(t)$ is the neutral ethylene molecular injection
    rate in molecules per second, $t_0$ is the start of the prefill interval, $t_b$
    is the breakdown time or end of prefill, and $N_{\mathrm{eq}}^{\mathrm{prefill}}$
    is a dimensionless equivalent-electron count. Equivalently, if $N_{\mathrm{C_2H_4}}$
    molecules are injected during prefill, the count is $16 N_{\mathrm{C_2H_4}}$.


    In practice the molecular amount is inferred from calibrated gas-flow or valve-throughput
    measurements, reservoir pressure changes, or gas-inventory accounting, with conversion
    to molecule number using the gas equation of state. This quantity is restricted
    to the prefill interval and is distinct from [accumulated_ethylene_count](name:accumulated_ethylene_count),
    which tracks ethylene accumulated from plasma breakdown onward. It follows the
    same equivalent-electron accounting idea used for other injected-species inventory
    counts such as [accumulated_helium_4_prefill_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection),
    [accumulated_lithium_prefill_count_due_to_gas_injection](name:accumulated_lithium_prefill_count_due_to_gas_injection),
    and [carbon_initial_count_due_to_gas_injection](name:carbon_prefill_count_due_to_gas_injection).


    Typical prefill magnitudes are about $10^{19}$-$10^{23}$ equivalent electrons,
    corresponding to roughly $6 \times 10^{17}$-$6 \times 10^{21}$ ethylene molecules.
    The value depends on vessel volume, target prefill pressure, gas-line calibration,
    and the duration of the prefill injection.'
  unit: '1'
  physics_domain: plant_systems
