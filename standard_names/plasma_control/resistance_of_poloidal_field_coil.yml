name: resistance_of_poloidal_field_coil
status: draft
cocos_transformation_type: one_like
description: Electrical resistance of a poloidal-field coil, including any additional
  external resistance inserted for plasma control purposes.
documentation: "The resistance $R_{\\rm PF}$ (dimensionless in normalized representation,\
  \ or in ohms in physical units) of a poloidal-field (PF) coil characterizes its\
  \ Ohmic dissipation $P = R_{\\rm PF} I_{\\rm PF}^2$, where $I_{\\rm PF}$ is the\
  \ coil current. In superconducting coil systems the intrinsic resistance is nominally\
  \ zero and the relevant quantity is additional resistance inserted by external circuits\
  \ (e.g., dump resistors or switching-network resistors) used for current ramp control,\
  \ quench protection, or active plasma shape/position control. For resistive copper\
  \ coils the total resistance includes the conductor resistance at operating temperature,\
  \ typically 1\u2013100 m\u03A9 depending on coil size and number of turns. The value\
  \ is used in circuit-equation models that couple coil currents to the plasma equilibrium\
  \ evolution. See also `poloidal_field_coil_current` for the associated current flowing\
  \ through the coil."
