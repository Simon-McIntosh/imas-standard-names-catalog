- name: incident_neutral_internal_state_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Incident number flux density of neutral recombination products arriving
    at a plasma-facing wall, resolved by neutral species and internal quantum state.
  documentation: 'This quantity is the incident number flux density of neutral particles
    produced by recombination and arriving at a plasma-facing wall, resolved by neutral
    species and by the internal quantum state of each particle. It is the incident
    component of the [neutral internal-state particle flux at the wall due to recombination](name:neutral_internal_state_particle_flux_at_wall_due_to_recombination).


    The defining relation is


    $$

    \Gamma^{\mathrm{rec,inc}}_{a,s} = \frac{\mathrm{d}N^{\mathrm{rec,inc}}_{a,s}}{\mathrm{d}A\,\mathrm{d}t}

    $$


    where $\Gamma^{\mathrm{rec,inc}}_{a,s}$ is the incident flux density for neutral
    species $a$ in internal state $s$, $N^{\mathrm{rec,inc}}_{a,s}$ is the number
    of such particles arriving, $A$ is wall area, and $t$ is time.


    The quantity counts arrivals rather than signed net transport. It excludes neutral
    particles produced by recycling, sputtering, radiation, or other mechanisms unrelated
    to recombination.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_internal_state_particle_flux_at_wall_due_to_recombination
  arguments:
  - name: neutral_internal_state_particle_flux_at_wall_due_to_recombination
    operator: incident
