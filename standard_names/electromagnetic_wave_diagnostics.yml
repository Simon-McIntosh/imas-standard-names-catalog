- name: toroidal_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Toroidal direction cosine of the local electromagnetic wave vector
    along a beam-tracing ray, equal to the toroidal wave vector component divided
    by the total wave vector magnitude.
  documentation: 'The toroidal normalized wave vector component is the projection
    of the unit wave vector onto the geometric toroidal direction $\hat{\phi}$, quantifying
    the fraction of the wave''s phase advance occurring in the toroidal direction
    at each point along a beam-tracing path. It characterizes the propagation geometry
    of electromagnetic waves in magnetized plasma and enters the local dispersion
    relation governing wave accessibility and resonance conditions.


    The defining relation is:


    $$

    k_{\phi,\mathrm{norm}} = \frac{k_\phi}{|\mathbf{k}|}

    $$


    where $k_\phi$ is the toroidal component of the wave vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame and $|\mathbf{k}|$ is the total wave vector magnitude.
    The three normalized direction cosines satisfy $k_{R,\mathrm{norm}}^2 + k_{\phi,\mathrm{norm}}^2
    + k_{Z,\mathrm{norm}}^2 = 1$, linking this component to the [radial normalized
    wave vector](name:radial_normalized_wave_vector_of_beam_tracing_beam) and the
    [vertical normalized wave vector](name:vertical_normalized_wave_vector_of_beam_tracing_beam).
    The unnormalized toroidal component is available as the [toroidal wave vector
    of beam tracing beam](name:toroidal_wave_vector_of_beam_tracing_beam).


    This quantity is computed by beam-tracing or ray-tracing solvers integrating the
    geometric-optics equations for RF or ECE wave propagation in inhomogeneous magnetized
    plasma. It governs polarization selection at cyclotron harmonic layers and mode-conversion
    regions along the beam path.


    Values are bounded by $-1 \leq k_{\phi,\mathrm{norm}} \leq 1$. For beams launched
    near-perpendicular to the magnetic field the toroidal direction cosine is near
    zero; oblique launches into the plasma yield larger magnitudes.


    Sign convention: Positive when the toroidal wave vector component $k_\phi$ points
    in the direction of increasing toroidal angle $\phi$.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:vertical_normalized_wave_vector_of_beam_tracing_beam
  - name:toroidal_wave_vector_of_beam_tracing_beam
  sources:
  - id: dd:ec_launchers/beam/direction/kphi
    dd_path: ec_launchers/beam/direction/kphi
    status: attached
- name: toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: "Physical toroidal component of the electromagnetic wave vector along\
    \ a beam-tracing ray, defined by projection onto the toroidal unit vector in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame. It determines, but is not identical\
    \ to, the toroidal refractive-index component through the wave frequency."
  documentation: 'The toroidal wave vector of a beam-tracing beam is the physical
    component of the electromagnetic wave vector along the toroidal unit direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It describes the local toroidal
    phase advance per unit length of the propagating wave and is one component of
    the full ray wave vector.


    The component is defined by projecting the local wave vector onto the toroidal
    unit vector:


    $$

    k_\phi = \mathbf{k} \cdot \hat{\phi}

    $$


    where $\mathbf{k}$ is the local electromagnetic wave vector and $\hat{\phi}$ is
    the unit vector in the direction of increasing toroidal angle $\phi$. The corresponding
    normalized toroidal refractive-index component is $N_\phi = c k_\phi / \omega$,
    where $c$ is the speed of light in m s$^{-1}$ and $\omega$ is the angular wave
    frequency in rad s$^{-1}$.


    In beam tracing, $k_\phi$ is computed from the ray or beam solution of the electromagnetic
    dispersion relation and evolves as the ray refracts through spatially varying
    plasma and magnetic-field conditions. This quantity is the physical orthonormal
    toroidal component, not the canonical phase-gradient component conjugate to the
    toroidal angle; the associated canonical quantity is $R k_\phi$, and in an axisymmetric
    medium it is $R k_\phi$, not $k_\phi$ alone, that may be conserved along a ray.


    Typical electron-cyclotron and ECE beam-tracing values are about $10^1$-$10^3$
    m$^{-1}$, with values of a few $10^3$ m$^{-1}$ possible for 100-200 GHz waves
    with strong toroidal steering. There is no fixed universal bound independent of
    frequency and plasma dispersion, but as a physical projection it satisfies $|k_\phi|
    \le |\mathbf{k}|$ locally.


    Sign convention: Positive when the wave vector component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
- name: twist_period_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Positive length along a spun optical fiber over which the effective
    birefringent axes complete one full helical turn. It is the optical-axis twist
    pitch used in FOCS polarization modeling, distinct from the nominal manufacturing
    spun period.
  documentation: 'The twist period $L_t$ is the positive arc length along a spun optical
    fiber over which the effective birefringent axes rotate by one full turn. It characterizes
    the helical pitch of the optical-axis orientation that helps average linear birefringence
    in a Fiber Optic Current Sensor, without by itself determining the Faraday responsivity.


    For a signed angular twist rate $\tau$, the twist period is defined by the full-turn
    length:


    $$

    L_t = \frac{2\pi}{|\tau|}

    $$


    where $L_t$ is the twist period in m and $\tau = d\alpha/ds$ is the signed rate
    of change of the effective optical-axis angle $\\alpha$ with fiber arc length
    $s$, in rad m$^{-1}$. The absolute value makes $L_t$ a non-negative period; handedness
    is carried by the signed twist rate or by the initial twist phase, not by the
    period itself.


    The twist period may be obtained from a characterized fiber specification or from
    polarimetric or optical-reflectometry measurements that resolve the rotation of
    the birefringent axes along the fiber. It is conceptually distinct from the [spun
    period], which denotes the imposed manufacturing spin modulation period; $L_t$
    denotes the effective optical-axis period used in the polarization model. Its
    influence is interpreted together with the [linear polarization beat length],
    the [initial twist phase](name:initial_twist_phase_of_fiber_optic_current_sensor),
    the Verdet constant, and the optical path length.


    Values are reported as positive lengths in meters. For birefringence averaging,
    designs are commonly assessed by comparing $L_t$ with the linear polarization
    beat length, often seeking a twist period substantially shorter than that beat
    length; the numerical value is fiber- and fabrication-specific rather than universal.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links: []
- name: verdet_constant_of_fiber_optic_current_sensor
  kind: scalar
  status: draft
  description: Signed magneto-optic coefficient of the optical fiber in a fiber-optic
    current sensor. It relates Faraday polarization rotation to the magnetic-field
    component parallel to the oriented optical path per unit path length.
  documentation: 'The Verdet constant is the local magneto-optic coefficient of an
    optical fiber material. It quantifies how strongly the component of magnetic field
    along the light path rotates the plane of polarization as light propagates, and
    it depends on fiber material, optical wavelength, temperature, and installation-dependent
    stress or birefringence effects.


    For an oriented fiber path, the Faraday rotation is described by the line integral


    $$

    \Delta \chi = \int_C V(s)\,\mathbf{B}(\mathbf{r}(s))\cdot\hat{\mathbf{t}}(s)\,ds

    $$


    where $\Delta \chi$ is the net polarization rotation in radians, $C$ is the oriented
    optical path, $s$ is arc length in meters, $\hat{\mathbf{t}}(s)$ is the unit tangent
    in the positive path direction, $\mathbf{B}$ is the magnetic field in tesla, and
    $V(s)$ is the Verdet constant in m^-1.rad.T^-1. For a uniform fiber and field
    component, $V$ is the rotation per unit path length per unit magnetic-field component
    parallel to the path.


    In a fiber-optic current sensor, the integral is evaluated along the actual optical
    path, including all winding turns around the conductor or plasma current. Each
    turn contributes with the sign set by its path orientation. When $V$ is effectively
    uniform and the fiber forms $N$ closed turns linking the measured current, the
    line integral may be reduced using Ampere''s law to $\Delta \chi \approx V\mu_0
    N I$, where $\mu_0$ is the magnetic permeability of free space and $I$ is the
    linked current; practical systems usually determine an effective calibrated value
    for the installed fiber, wavelength, and operating conditions.


    Typical values for silica-based optical fibers are of order 0.1-10 m^-1.rad.T^-1,
    with larger or smaller values possible for other glass compositions, wavelengths,
    and temperatures. The calibrated value for the specific fiber and optical wavelength
    is normally used for current reconstruction.


    Sign convention: Positive when a magnetic-field component parallel to the positive
    optical path rotates the optical polarization in the positive sense about the
    propagation direction, with positive rotation defined by the right-hand rule.'
  unit: T^-1.m^-1.rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:length_of_fiber_optic_current_sensor
- name: vertical_coordinate_of_diagnostic_antenna
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the geometric center of a diagnostic antenna\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ locates the geometric center of a diagnostic
    antenna along the machine symmetry axis within the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius measured from the symmetry axis
    and $Z$ is the vertical height, both in meters, with the nominal midplane at $Z
    = 0$.


    This coordinate, together with the corresponding major radius, specifies the spatial
    position from which electromagnetic wave diagnostics launch or receive signals.
    Applications include reflectometer emission and detection channels, electron cyclotron
    emission receivers, and X-ray and UV spectrometer optical components. Beam-tracing
    and ray-tracing algorithms use the antenna center position as the boundary condition
    for the launch or detection point of the propagating wave. The analogous geometric
    reference for related diagnostic hardware is captured by [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture),
    [vertical_coordinate_of_optical_element](name:vertical_coordinate_of_optical_element),
    and [vertical_coordinate_of_antenna_strap](name:vertical_coordinate_of_antenna_strap).


    Values span the full height range of the machine port system; in medium-sized
    tokamaks this is approximately $-2$ to $+2$ m depending on port access geometry
    and the plasma region targeted by the diagnostic.


    Sign convention: Positive when the antenna center is located above the device
    midplane in the direction of increasing $Z$.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_coordinate_of_diagnostic_aperture
  - name:vertical_coordinate_of_optical_element
  - name:vertical_coordinate_of_antenna_strap
- name: vertical_magnetic_field_at_wall
  kind: scalar
  status: draft
  description: "Signed, local Z-directed part of the magnetic field at a specified\
    \ vacuum-vessel wall position, in the right-handed cylindrical (R, \u03C6, Z)\
    \ frame where Z is vertical height."
  documentation: 'Vertical magnetic field at the wall is the signed local component
    of the magnetic-field vector along the vertical basis direction at a specified
    point on the vacuum-vessel wall. It is defined in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius in meters, $\phi$ is toroidal
    angle in radians, and $Z$ is vertical height in meters.


    The defining projection is


    $$

    B_Z(R, \phi, Z) = \mathbf{B}(R, \phi, Z) \cdot \hat{Z}

    $$


    where $\mathbf{B}$ is the magnetic-field vector and $B_Z$ is its vertical component,
    both expressed in tesla; $\hat{Z}$ is the unit vector in the direction of increasing
    vertical height.


    In practice, this local scalar may be obtained from wall magnetic diagnostics,
    magnetic-field reconstruction, or electromagnetic modeling at the specified wall
    position. The position is interpreted geometrically in the right-handed cylindrical
    $(R, \phi, Z)$ frame and may be related to coordinates such as the [vertical coordinate
    of measurement position](name:vertical_coordinate_of_measurement_position). This
    quantity itself does not define a closed contour, a path integral, or an enclosed-current
    sign convention.


    The value can be positive, negative, or zero because it is a component of the
    total field rather than a magnitude. Its scale is strongly device-, discharge-,
    and location-dependent, reflecting the local superposition of plasma current,
    external coils, induced currents, and non-axisymmetric perturbations; no universal
    numerical wall-field range is intrinsic to the quantity.


    Sign convention: Positive when $B_Z$ points in the direction of increasing $Z$
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_magnetic_field
  - name:vertical_non_axisymmetric_magnetic_field
  - name:faraday_angle
- name: vertical_normalized_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Direction cosine of the electromagnetic wave vector along the vertical
    Z-direction, equal to k_Z divided by the total wave-vector magnitude, evaluated
    pointwise along a beam-tracing ray path.
  documentation: 'The normalized vertical wave vector component is the direction cosine
    of the local electromagnetic wave propagation direction projected onto the vertical
    $Z$-axis of the right-handed cylindrical $(R, \phi, Z)$ frame, computed pointwise
    along a beam-tracing or ray-tracing path. It encodes the fraction of the propagation
    direction aligned with the vertical direction at each position along the ray.


    The defining relation is:


    $$

    k_{Z,\mathrm{norm}} = \frac{k_Z}{|\mathbf{k}|}

    $$


    where $k_Z$ is the [vertical wave vector component](name:vertical_wave_vector_of_beam_tracing_beam)
    and $|\mathbf{k}|$ is the total wave-vector magnitude. Together with [radial_normalized_wave_vector_of_beam_tracing_beam](name:radial_normalized_wave_vector_of_beam_tracing_beam)
    and [toroidal_normalized_wave_vector_of_beam_tracing_beam](name:toroidal_normalized_wave_vector_of_beam_tracing_beam),
    it fully specifies the unit propagation direction in the cylindrical $(R, \phi,
    Z)$ frame, satisfying $k_{R,\mathrm{norm}}^2 + k_{\phi,\mathrm{norm}}^2 + k_{Z,\mathrm{norm}}^2
    = 1$.


    This quantity is computed during beam-tracing or ray-tracing simulations for RF
    wave propagation and ECE diagnostics, where the Hamiltonian ray equations simultaneously
    advance the spatial position and wave vector along the ray. The normalized form
    characterizes the instantaneous propagation direction independently of the local
    wave number magnitude.


    As a direction cosine, values are bounded to $[-1, 1]$. Values near zero indicate
    nearly horizontal propagation, while values near $\pm 1$ correspond to strongly
    oblique launch geometries or wave turning near a vertical reflection layer.


    Sign convention: Positive when $k_Z$ points in the direction of increasing $Z$.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:radial_normalized_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
- name: vertical_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: The Z-direction component of the wave vector along the beam tracing
    ray path, quantifying the spatial frequency of the electromagnetic wave in the
    vertical direction at each point of propagation.
  documentation: "The vertical wave vector component $k_Z$ is the projection of the\
    \ wave vector $\\mathbf{k}$ onto the vertical axis $\\hat{Z}$ in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame. Together with the radial and toroidal components,\
    \ it fully specifies the local propagation direction of an electromagnetic wave\
    \ at each point along a beam tracing trajectory.\n\nThe component is defined as:\n\
    \n$$\nk_Z = \\mathbf{k} \\cdot \\hat{Z}\n$$\n\nwhere $\\hat{Z}$ is the vertical\
    \ unit vector and $|\\mathbf{k}| = 2\\pi n / \\lambda_0$, with $n$ the local refractive\
    \ index and $\\lambda_0$ the free-space wavelength. During beam tracing, $k_Z$\
    \ evolves according to the ray equation $dk_Z/ds = -\\partial D/\\partial Z$,\
    \ where $D(\\mathbf{x}, \\mathbf{k})$ is the plasma dispersion relation and $s$\
    \ is the arc length along the ray.\n\nBeam tracing is applied in electron cyclotron\
    \ heating and current drive analysis and in electron cyclotron emission diagnostics.\
    \ All three cylindrical wave vector components are propagated together to track\
    \ refraction and mode conversion through the inhomogeneous magnetized plasma.\n\
    \nFor electron cyclotron waves at frequencies of 100\u2013170 GHz, $|k_Z|$ typically\
    \ ranges from zero to order $10^3$ m$^{-1}$, varying continuously as the ray refracts.\
    \ The direction cosine form is given by the [vertical normalized wave vector](name:vertical_normalized_wave_vector_of_beam_tracing_beam)\
    \ ($k_Z / |\\mathbf{k}|$). The complementary cylindrical components are the [radial\
    \ wave vector](name:radial_wave_vector_of_beam_tracing_beam) and the [toroidal\
    \ wave vector](name:toroidal_wave_vector_of_beam_tracing_beam).\n\nSign convention:\
    \ Positive when $k_Z$ points in the direction of increasing $Z$."
  unit: m^-1
