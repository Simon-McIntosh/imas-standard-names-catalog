  documentation: 'Toroidal krypton velocity at the pedestal top is the toroidal component
    of the krypton ion bulk-flow velocity evaluated at the H-mode pedestal-top reference
    location. As a species-level intensive quantity, it is the density-weighted mean
    over all krypton ion charge states, not a sum of charge-state velocities. The
    toroidal direction is the $\hat{\phi}$ basis direction in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The charge-state aggregation and toroidal projection are defined by


    $$

    v_{\phi}^{\mathrm{Kr}} = \frac{\sum_q n_{\mathrm{Kr}^{q+}}\left(\mathbf{v}_{\mathrm{Kr}^{q+}}
    \cdot \hat{\phi}\right)}{\sum_q n_{\mathrm{Kr}^{q+}}}

    $$


    where $q$ indexes krypton ion charge states, $n_{\mathrm{Kr}^{q+}}$ is the number
    density of charge state $q$ in m$^{-3}$, $\mathbf{v}_{\mathrm{Kr}^{q+}}$ is its
    bulk-flow velocity, and $v_{\phi}^{\mathrm{Kr}}$ is the resulting signed species-level
    toroidal velocity.


    This quantity is inferred from krypton line spectroscopy or other impurity-flow
    diagnostics localized near the pedestal top, with viewing-geometry corrections
    used to isolate the toroidal component. Because line emission is often charge-state
    selective, interpretation must map measured charge-state velocities onto the density-weighted
    species mean. Momentum-balance or radial-force-balance analysis may combine this
    quantity with [poloidal krypton velocity at the pedestal top], pressure-gradient,
    electric-field, and magnetic-field information.


    No universal krypton-specific pedestal range applies across devices. Representative
    signed impurity toroidal velocities at pedestal-top conditions are commonly in
    the range $-5 \times 10^4$ to $5 \times 10^4$ m.s$^{-1}$, with higher-rotation
    cases approaching $\pm 10^5$ m.s$^{-1}$ in either toroidal direction.


    Sign convention: Positive when the density-weighted krypton ion bulk flow at the
    pedestal top is along $+\hat{\phi}$, the direction of increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
- name: toroidal_krypton_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the krypton ion bulk velocity at the plasma\
    \ boundary, obtained by projecting the krypton flow on the +\u03C6 direction in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame. The boundary is the last\
    \ closed flux surface separating confined plasma from the scrape-off layer."
  documentation: 'Toroidal krypton velocity at the plasma boundary is the component
    of the bulk flow of krypton ions tangent to the toroidal direction at the last
    closed flux surface. The right-handed cylindrical $(R, \phi, Z)$ frame is used,
    with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical height.
    Unless a charge state is specified separately, the krypton bulk velocity denotes
    the density-weighted mean flow of the krypton ion population over the charge states
    represented in the plasma.


    The boundary value is the toroidal projection of the krypton ion bulk velocity
    evaluated on the last closed flux surface:


    $$

    v_{\phi,\mathrm{Kr}}\big|_{\mathrm{LCFS}} = \left.\mathbf{v}_{\mathrm{Kr}} \cdot
    \hat{\phi}\right|_{\mathrm{LCFS}}

    $$


    where $v_{\phi,\mathrm{Kr}}$ is in $\mathrm{m\,s^{-1}}$, $\mathbf{v}_{\mathrm{Kr}}$
    is the krypton ion bulk velocity vector in $\mathrm{m\,s^{-1}}$, and $\hat{\phi}$
    is the dimensionless unit vector in the direction of increasing toroidal angle.
    If several krypton charge states contribute, the charge-state-combined velocity
    may be interpreted as the density-weighted mean, $\sum_z n_{\mathrm{Kr}^{z+}}\mathbf{v}_{\mathrm{Kr}^{z+}}/\sum_z
    n_{\mathrm{Kr}^{z+}}$.


    This quantity is a boundary-evaluated species velocity, conceptually analogous
    to [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary)
    but for krypton impurity ions. It is not inherently a flux-surface average; names
    that explicitly include flux-surface-averaged, such as [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    identify that additional averaging operation. In practice, krypton toroidal flow
    can be inferred from spectroscopic Doppler measurements of suitable krypton emission
    or computed from impurity momentum balance constrained by edge plasma conditions.


    Representative edge impurity toroidal velocities are scenario dependent and may
    be near zero in weakly driven plasmas or of order $10^3$-$10^4$ m.s^-1 in rotating
    plasmas. Strong external momentum input or strong edge electric-field shear can
    produce values of several $10^4$ m.s^-1 in either toroidal direction.


    Sign convention: Positive when the krypton ion bulk flow is in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_xenon_velocity_at_plasma_boundary
  - name:toroidal_tungsten_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/krypton/value
    dd_path: summary/local/separatrix_average/velocity_phi/krypton/value
    status: composed
- name: toroidal_lithium_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the lithium impurity ion fluid velocity evaluated
    at the H-mode pedestal top. It represents the local azimuthal rotation of lithium
    impurity ions at the steep-gradient edge transport barrier, not a pedestal-region
    average.
  documentation: 'The toroidal lithium ion fluid velocity at the pedestal top is the
    $\hat{\phi}$-projection of the lithium impurity ion mean velocity vector at the
    radial reference location where the H-mode edge transport barrier steep-gradient
    region joins the flatter core profile. This is a point-evaluated quantity, not
    a spatial average over the pedestal region.


    The toroidal component is defined as:


    $$

    v_{\phi}^{\mathrm{Li}} = \mathbf{v}_{\mathrm{Li}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{Li}}$ is the lithium ion fluid velocity vector and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Lithium toroidal rotation at the pedestal is inferred from charge exchange recombination
    spectroscopy (CXRS) using Doppler shifts of lithium spectral lines following charge
    exchange with an injected neutral beam. The pedestal-top reference location is
    identified from the steep-gradient region of the relevant kinetic profile. Comparable
    pedestal-top rotation measurements for other impurity species are provided by
    [toroidal_iron_velocity_at_pedestal_top](name:toroidal_iron_velocity_at_pedestal_top)
    and [toroidal_oxygen_velocity_at_pedestal_top](name:toroidal_oxygen_velocity_at_pedestal_top);
    the lithium ion rotation at other radial reference points is covered by [toroidal_lithium_velocity_at_magnetic_axis](name:toroidal_lithium_velocity_at_magnetic_axis)
    and [toroidal_lithium_velocity_at_internal_transport_barrier](name:toroidal_lithium_velocity_at_internal_transport_barrier).


    Sign convention: Positive when $v_{\phi}^{\mathrm{Li}}$ points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_iron_velocity_at_pedestal_top
  - name:toroidal_oxygen_velocity_at_pedestal_top
  - name:toroidal_lithium_velocity_at_magnetic_axis
  - name:toroidal_lithium_velocity_at_internal_transport_barrier
- name: toroidal_lithium_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the ionized lithium bulk\
    \ flow velocity at the plasma boundary, the last closed flux surface. It is the\
    \ projection onto the direction of increasing toroidal angle in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame; neutral lithium is excluded and unresolved\
    \ charge states are represented by a population-averaged ion flow."
  documentation: 'The toroidal lithium velocity at the plasma boundary is the flux-surface-averaged
    toroidal projection of the ionized lithium bulk flow on the last closed flux surface.
    It characterizes edge impurity rotation and is governed by momentum balance, radial
    electric field effects, collisions with main ions, and external torque sources.
    The lithium population refers to ionized lithium; neutral lithium atoms are not
    included, and unresolved charge states are represented by a density-weighted ion-population
    flow.


    The boundary value is defined by the flux-surface average of the toroidal projection
    over the last closed flux surface:


    $$

    v_{\phi,\mathrm{Li},b} = \frac{\displaystyle \oint_{\mathrm{LCFS}} \left(\mathbf{v}_{\mathrm{Li}}
    \cdot \hat{\phi}\right)\,\frac{dl}{B_p}}{\displaystyle \oint_{\mathrm{LCFS}} \frac{dl}{B_p}}

    $$


    where $v_{\phi,\mathrm{Li},b}$ is the boundary-averaged toroidal lithium ion velocity
    in $\mathrm{m\,s^{-1}}$, $\mathbf{v}_{\mathrm{Li}}$ is the bulk velocity of ionized
    lithium in $\mathrm{m\,s^{-1}}$, $\hat{\phi}$ is the unit vector in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame, $dl$ is poloidal arc length on the last closed flux surface, and $B_p$
    is the poloidal magnetic-field magnitude. The $dl/B_p$ factor gives the flux-surface-average
    weighting for an axisymmetric boundary.


    In practice this quantity can be inferred from spectroscopic Doppler measurements
    of lithium ion emission when suitable lines are available, or estimated by edge
    transport and momentum-balance modeling constrained by measurements. Local estimates
    are mapped to equilibrium flux surfaces, interpolated or extrapolated to the last
    closed flux surface or to the limiting closed-surface approach to it, and then
    averaged with the same $dl/B_p$ weighting. Analogous species-resolved boundary
    velocities include [toroidal_deuterium_velocity_at_plasma_boundary](name:toroidal_deuterium_velocity_at_plasma_boundary),
    [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary),
    and [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary).


    Typical boundary-averaged impurity toroidal velocities are strongly device- and
    regime-dependent. As an order-of-magnitude guide, edge values may be close to
    $0\,\mathrm{m\,s^{-1}}$, with absolute magnitudes of $10^3-10^4\,\mathrm{m\,s^{-1}}$
    in rotating plasmas; substantially larger magnitudes are case-specific and usually
    indicate strong external torque or steep edge momentum gradients.


    Sign convention: Positive when the lithium ion bulk flow has a toroidal component
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_plasma_boundary
  - name:toroidal_beryllium_velocity_at_plasma_boundary
  - name:toroidal_lithium_velocity_at_magnetic_axis
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/lithium/value
    dd_path: summary/local/separatrix_average/velocity_phi/lithium/value
    status: composed
- name: toroidal_neon_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal component of the neon ion fluid velocity in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, evaluated at the H-mode pedestal."
  documentation: 'The toroidal neon velocity at the pedestal is the component of the
    neon ion fluid velocity along the toroidal direction, evaluated in the steep-gradient
    edge region characteristic of H-mode confinement. The pedestal lies near the outer
    edge of the confined plasma and is defined by strong radial gradients in quantities
    such as temperature, density, or pressure.


    The toroidal component is the projection of the neon ion fluid velocity onto the
    toroidal basis direction:


    $$

    v_{\phi,\mathrm{Ne}} = \mathbf{v}_{\mathrm{Ne}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{Ne}}$ is the neon ion fluid velocity in m.s^-1, $v_{\phi,\mathrm{Ne}}$
    is its toroidal component in m.s^-1, and $\hat{\phi}$ is the unit vector in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    In practice, the pedestal location is identified from edge-gradient structure,
    and the neon toroidal flow is evaluated at that location from impurity-flow measurements
    or from impurity momentum-balance calculations. The value represents directed
    rotation of the neon impurity population rather than a thermal speed.


    Typical absolute magnitudes for impurity toroidal flow at the pedestal are of
    order 10^3-10^5 m.s^-1 in tokamak edge plasmas, with the sign and magnitude depending
    on torque input, radial electric field, collisional coupling, and neoclassical
    transport.


    Sign convention: Positive when the neon ion fluid velocity component points in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_pedestal_top
  - name:toroidal_oxygen_velocity_at_pedestal_top
  - name:toroidal_deuterium_velocity_at_pedestal_top
- name: toroidal_neon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the neon impurity-ion fluid velocity evaluated\
    \ at the plasma boundary, projected along increasing toroidal angle \u03C6 in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame. It denotes a local boundary\
    \ value, not an implicit flux-surface or separatrix average."
  documentation: 'The toroidal neon velocity at the plasma boundary is the toroidal
    component of the neon impurity-ion fluid velocity evaluated on the last closed
    flux surface or separatrix. It describes azimuthal edge rotation of neon in the
    right-handed cylindrical $(R, \phi, Z)$ frame and is a local boundary quantity;
    no flux-surface or separatrix average is implied.


    The component is defined by projection of the neon ion fluid velocity onto the
    toroidal basis vector:


    $$

    v_{\phi,\mathrm{Ne}} = \mathbf{v}_{\mathrm{Ne}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{Ne}}$ is the neon impurity-ion fluid velocity at the
    plasma boundary and $\hat{\phi}$ is the unit vector in the direction of increasing
    toroidal angle $\phi$.


    This quantity may be inferred from Doppler spectroscopy or charge-exchange recombination
    measurements of neon line emission when suitable lines are available, or computed
    from impurity momentum-balance and edge-transport models. Because the name does
    not specify an ionization stage, it represents an elemental neon impurity-ion
    velocity; if a measurement is charge-state selective, interpreting it as the elemental
    neon velocity requires an explicit physical assumption about charge-state flow
    equilibration. A flux-surface average of this boundary velocity is a distinct
    quantity, represented by [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary).


    Typical edge impurity toroidal velocity magnitudes are of order $10^3$-$10^5$
    m.s^-1 in tokamak plasmas, with values near zero possible in weakly rotating conditions.
    The magnitude and sign depend on momentum input, radial electric field shear,
    collisional coupling to main ions, and impurity transport near the separatrix.


    Sign convention: Positive when neon ions flow in the direction of increasing toroidal
    angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:toroidal_deuterium_velocity_at_plasma_boundary
- name: toroidal_neutral_momentum_flux_limiter_coefficient
  kind: scalar
  status: draft
  description: "Dimensionless factor applied to the toroidal component of neutral-particle\
    \ momentum flux density in edge-plasma transport closures. It scales the component\
    \ along increasing toroidal angle in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame without defining the sign of that flux."
  documentation: 'The toroidal neutral momentum coefficient is a dimensionless flux-limiter
    factor for the toroidal component of neutral-particle momentum transport. It is
    associated with momentum carried by neutral atoms or molecules along the $\phi$
    direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height. The coefficient
    represents closure-model scaling of a signed toroidal momentum-flux density; it
    does not by itself define the direction or sign of that flux.


    When used as a multiplicative limiter, its role can be written as:


    $$

    \Pi_{\phi,n}^{\mathrm{lim}} = C_{\phi,n}\,\Pi_{\phi,n}^{\mathrm{ref}}

    $$


    where $C_{\phi,n}$ is the dimensionless toroidal neutral momentum coefficient,
    $\Pi_{\phi,n}^{\mathrm{ref}}$ is the reference or unmodified toroidal neutral
    momentum-flux density, and $\Pi_{\phi,n}^{\mathrm{lim}}$ is the limited or effective
    toroidal neutral momentum-flux density. Both flux-density variables have units
    of $\mathrm{kg\,m^{-1}\,s^{-2}}$, equivalently $\mathrm{N\,m^{-2}}$. The sign
    of the associated flux component is the sign of toroidal_neutral_momentum_flux,
    while this coefficient only scales that component.


    The coefficient is specified or computed within a neutral momentum-transport closure,
    for example from local collisionality, neutral mean free path, gradients, or a
    prescribed flux-limiting rule. It is not normally a directly measured observable;
    experimental information constrains it indirectly through comparisons between
    modeled and observed edge-plasma and neutral behavior.


    Typical values are closure-specific dimensionless factors of order unity. In a
    purely attenuating limiter, $C_{\phi,n}=1$ leaves the reference toroidal momentum
    flux unchanged and $0 \le C_{\phi,n} \le 1$ reduces its magnitude; more general
    calibrated closures may define a different admissible interval, so the valid numerical
    range is part of the closure definition rather than a universal neutral-physics
    constant.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links: []
  arguments:
  - name: neutral_momentum_flux_limiter_coefficient
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_nitrogen_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: Toroidal component of the nitrogen impurity ion fluid velocity evaluated
    at the H-mode pedestal top, the inner edge of the steep-gradient edge transport
    barrier. For species-level nitrogen, it represents the density-weighted mean over
    ionized nitrogen charge states.
  documentation: 'Toroidal component of the nitrogen impurity ion fluid velocity evaluated
    at the H-mode pedestal top is the component of the nitrogen ion bulk flow parallel
    to the toroidal direction on the pedestal-top flux surface. The pedestal top is
    the core-side edge of the steep-gradient edge transport barrier and characterizes
    impurity rotation just inside the pedestal. For species-level nitrogen, the velocity
    is the density-weighted mean over all ionized nitrogen charge states.


    The component is defined by projection onto the toroidal basis vector of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height:


    $$

    v_{\phi,\mathrm{N}} = \mathbf{v}_{\mathrm{N}} \cdot \hat{\phi}

    $$


    where $v_{\phi,\mathrm{N}}$ is the pedestal-top toroidal nitrogen velocity, $\mathbf{v}_{\mathrm{N}}$
    is the density-weighted nitrogen ion fluid velocity vector, $\hat{\phi}$ is the
    unit vector in the direction of increasing $\phi$, and both velocity quantities
    are expressed in m.s^-1.


    In practice, this quantity is inferred from Doppler shifts of nitrogen charge-exchange
    or line-emission spectra combined with viewing geometry, or from impurity transport
    modeling constrained by such measurements. The pedestal-top value is obtained
    by fitting the local radial variation and evaluating the fit at the pedestal-top
    location rather than averaging across the edge. It complements [toroidal nitrogen
    velocity at the magnetic axis](name:toroidal_nitrogen_velocity_at_magnetic_axis)
    and [toroidal nitrogen velocity at the plasma boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary)
    in describing radial rotation shear, and can be compared with [toroidal carbon
    velocity at pedestal top](name:toroidal_carbon_velocity_at_pedestal_top) and [toroidal
    oxygen velocity at pedestal top](name:toroidal_oxygen_velocity_at_pedestal_top)
    for species-dependent impurity momentum behavior.


    Representative H-mode cases span from a few 10^2 to about 5 x 10^4 m.s^-1 in magnitude,
    with values near zero or sign reversals possible depending on radial electric
    field, neutral-beam momentum input, collisional coupling to main ions, and impurity
    source localization.


    Sign convention: Positive when the nitrogen ion flow is in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_carbon_velocity_at_pedestal_top
  - name:toroidal_oxygen_velocity_at_pedestal_top
  - name:toroidal_nitrogen_velocity_at_magnetic_axis
- name: toroidal_nitrogen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the nitrogen impurity ion velocity evaluated
    at the last closed flux surface (plasma boundary), characterizing edge impurity
    rotation at the separatrix.
  documentation: 'Nitrogen ($\mathrm{N}$) is a seeding impurity used in tokamak edge
    plasmas for radiative cooling and divertor heat-load mitigation. The toroidal
    velocity of nitrogen ions at the plasma boundary (last closed flux surface) characterizes
    edge impurity rotation and enters momentum-balance models for the scrape-off layer
    boundary condition.


    The quantity is defined as the projection of the nitrogen impurity ion fluid velocity
    onto the toroidal unit vector $\hat{\phi}$ at the separatrix:


    $$

    v_\phi^{\mathrm{N}} = \mathbf{v}_{\mathrm{N}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{\mathrm{N}}$ is the nitrogen impurity ion fluid velocity and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.


    Measurement is typically performed by charge exchange recombination spectroscopy
    (CXRS), in which the Doppler shift of nitrogen emission lines yields the local
    toroidal velocity component; the separatrix position is determined by equilibrium
    reconstruction. The corresponding on-axis quantity is [toroidal nitrogen velocity
    at the magnetic axis](name:toroidal_nitrogen_velocity_at_magnetic_axis); analogous
    boundary-velocity quantities for other seeding impurities include [toroidal_neon_velocity_at_plasma_boundary](name:toroidal_neon_velocity_at_plasma_boundary)
    and [toroidal_xenon_velocity_at_plasma_boundary](name:toroidal_xenon_velocity_at_plasma_boundary).


    Sign convention: Positive when $v_\phi^{\mathrm{N}}$ points in the direction of
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_magnetic_axis
  - name:toroidal_neon_velocity_at_plasma_boundary
  - name:toroidal_xenon_velocity_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix_average/velocity_phi/nitrogen/value
    dd_path: summary/local/separatrix_average/velocity_phi/nitrogen/value
    status: composed
- name: toroidal_oxygen_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal component of the oxygen impurity ion fluid velocity evaluated\
    \ at the H-mode pedestal reference location, projected along the direction of\
    \ increasing toroidal angle in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The toroidal oxygen velocity at the pedestal top characterizes the\
    \ impurity ion fluid flow projected onto the $\\hat{\\phi}$ direction at the H-mode\
    \ edge transport barrier's outer shoulder, where the steep-gradient pedestal region\
    \ transitions to the flatter core profile. Oxygen (atomic number $Z = 8$) is a\
    \ common intrinsic or deliberately seeded impurity in tokamaks, present in charge\
    \ states spanning O$^{5+}$ through O$^{8+}$ in the pedestal; this quantity represents\
    \ the oxygen fluid velocity aggregated over the predominant charge states unless\
    \ a specific ionization state is separately resolved.\n\nThe toroidal component\
    \ is defined by the projection:\n\n$$\nv_{\\phi,\\mathrm{O}} = \\mathbf{v}_{\\\
    mathrm{O}} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\hat{\\phi}$ is the unit vector\
    \ in the direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, and $\\mathbf{v}_{\\mathrm{O}}$ is the oxygen ion fluid\
    \ velocity vector evaluated at the pedestal-top locus.\n\nThis quantity is measured\
    \ via charge exchange recombination spectroscopy, which resolves the Doppler shift\
    \ of oxygen emission lines following charge exchange with an injected neutral\
    \ beam. Toroidal rotation velocities at the pedestal top in H-mode span roughly\
    \ $10^3$\u2013$10^5$ m s$^{-1}$, reflecting neutral beam torque input, intrinsic\
    \ rotation, and impurity-specific flow corrections. Comparison with [toroidal_nitrogen_velocity_at_pedestal_top](name:toroidal_nitrogen_velocity_at_pedestal_top)\
    \ and [toroidal_neon_velocity_at_pedestal_top](name:toroidal_neon_velocity_at_pedestal_top)\
    \ enables cross-species benchmarking of pedestal rotation profiles.\n\nSign convention:\
    \ Positive when the oxygen ion flow is directed in the direction of increasing\
    \ toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_nitrogen_velocity_at_pedestal_top
  - name:toroidal_neon_velocity_at_pedestal_top
- name: toroidal_oxygen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Toroidal component of the oxygen impurity ion bulk flow velocity evaluated
    at the plasma boundary (last closed flux surface).
  documentation: 'The toroidal velocity of oxygen impurity ions at the plasma boundary
    quantifies the toroidal momentum carried by the oxygen ion population at the last
    closed flux surface, which separates the magnetically confined plasma from the
    open-field-line scrape-off layer. This local point value is distinct from the
    flux-surface-averaged quantity [toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_oxygen_velocity_at_plasma_boundary),
    which integrates the velocity weighted by the boundary flux-surface geometry.


    The toroidal component $v_\phi$ is the projection of the oxygen bulk flow velocity
    onto the toroidal direction:


    $$

    v_\phi = \mathbf{v}_\mathrm{O} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_\mathrm{O}$ is the oxygen ion bulk flow velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    Oxygen toroidal velocity at the boundary is primarily measured by charge exchange
    recombination spectroscopy (CXRS), exploiting the Doppler shift of oxygen emission
    lines to extract the ion flow velocity component along $\hat{\phi}$. Analogous
    boundary velocities for other impurity species include [toroidal_carbon_velocity_at_plasma_boundary](name:toroidal_carbon_velocity_at_plasma_boundary)
    and [toroidal_neon_velocity_at_plasma_boundary](name:toroidal_neon_velocity_at_plasma_boundary).


    Sign convention: Positive when the oxygen ion flow is directed in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise when viewed from above
    in the $+\hat{Z}$ direction).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
