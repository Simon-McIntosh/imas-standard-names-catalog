- name: radial_non_axisymmetric_magnetic_field
  kind: scalar
  status: active
  description: Radial non-axisymmetric magnetic field is the signed R component of
    the toroidally varying vacuum field after its toroidally averaged component is
    removed.
  documentation: 'Radial non-axisymmetric magnetic field is the radial component of
    the toroidally varying part of a vacuum magnetic field in the right-handed cylindrical
    $(R,\phi,Z)$ frame. It is the radial projection of the [non-axisymmetric magnetic
    field](name:non_axisymmetric_magnetic_field) produced by external coil currents,
    excluding the axisymmetric vacuum contribution and plasma-response field.


    At fixed major radius and vertical height, the component is defined by


    $$

    B_{\mathrm{na},R}(R,\phi,Z)=B_{\mathrm{vac},R}(R,\phi,Z)-\frac{1}{2\pi}\int_{0}^{2\pi}B_{\mathrm{vac},R}(R,\phi'',Z)\,d\phi''

    $$


    where $B_{\mathrm{na},R}$ and $B_{\mathrm{vac},R}$ are radial magnetic-field components
    in tesla, $R$ is major radius and $Z$ is vertical height in meters, and $\phi$
    and $\phi''$ are toroidal angles in radians, with $\phi''$ the integration variable.
    The radial projection is along the cylindrical $\hat{R}$ direction, distinct from
    the toroidal component [toroidal_non_axisymmetric_magnetic_field](name:toroidal_non_axisymmetric_magnetic_field)
    and the vertical component.


    Sign convention: Positive when $B_{\mathrm{na},R}$ points in the increasing-$R$
    direction of the right-handed cylindrical $(\hat{R},\hat{\phi},\hat{Z})$ basis.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:non_axisymmetric_magnetic_field
  - name:toroidal_non_axisymmetric_magnetic_field
  arguments:
  - name: non_axisymmetric_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
