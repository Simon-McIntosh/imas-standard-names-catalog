- name: parallel_ion_charge_state_particle_flux
  kind: scalar
  status: draft
  description: Particle flux density of ions in a specified charge state projected
    onto the local magnetic-field direction. It is the signed rate at which that charge-state
    population streams along the field per unit area.
  documentation: 'Parallel ion charge-state particle flux is the signed particle flux
    density of ions in one ionization stage resolved along the local magnetic field
    direction. It describes field-aligned streaming of that charge-state population
    and is a charge-state-resolved contribution to [parallel_ion_particle_flux](name:parallel_ion_particle_flux).


    For charge state $z$, the common fluid definition is:


    $$

    \Gamma_{\parallel,z} = n_z v_{\parallel,z}

    $$


    where $n_z$ is the number density of ions in charge state $z$ in $m^{-3}$, and
    $v_{\parallel,z}$ is their mean velocity component along $\hat{b} = \mathbf{B}/|\mathbf{B}|$
    in $m\,s^{-1}$. The product has units of particle flux density, $m^{-2}\,s^{-1}$.


    In charge-state particle balance, this quantity enters through the field-aligned
    divergence term, commonly written inline as $\nabla \cdot (\Gamma_{\parallel,z}\hat{b})$,
    together with perpendicular transport and sources or sinks from ionization, recombination,
    charge exchange, and external fueling. It is usually computed from kinetic distribution
    moments or fluid density and flow variables, and may be constrained indirectly
    using spectroscopy, charge-exchange measurements, and transport reconstruction.


    Typical magnitudes vary widely with species, charge state, confinement region,
    and collisionality. Trace impurity charge states in the confined plasma may be
    below $10^{18}$ m^-2.s^-1, while edge, scrape-off-layer, and divertor charge states
    with strong field-aligned flows commonly reach $10^{20}-10^{24}$ m^-2.s^-1.


    Sign convention: Positive when ions in the specified charge state flow in the
    direction of the local magnetic field vector $\mathbf{B}$, equivalently along
    $\hat{b} = \mathbf{B}/|\mathbf{B}|$.'
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:parallel_ion_particle_flux
  sources:
  - id: dd:plasma_transport/model/ggd/ion/state/particles/flux_parallel/values
    dd_path: plasma_transport/model/ggd/ion/state/particles/flux_parallel/values
    status: composed
- name: parallel_ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Effective local diffusivity for ion thermal-energy transport along
    the magnetic field. It applies to a specified ion species when the transported
    energy is species resolved, and to a total-ion effective channel when ion energies
    are summed.
  documentation: 'Parallel ion energy diffusivity is the local effective diffusion
    coefficient that relates field-aligned gradients of ion thermal energy to the
    conductive part of the ion heat flux. It characterizes how rapidly ion thermal
    energy is smoothed along magnetic field lines; for a species-resolved energy variable
    it is species-specific, while for a summed ion energy variable it is an aggregate
    total-ion coefficient. It is a local transport coefficient, not a line, flux-surface,
    or volume average unless an averaging operation is explicitly part of the physical
    model.


    A common Fick''s-law closure for the conductive field-aligned energy flux is:


    $$

    q_{E_i,\parallel} = -\chi_{E_i,\parallel}\,\nabla_\parallel w_i

    $$


    where $q_{E_i,\parallel}$ is the scalar parallel ion heat-flux density in $\mathrm{W\,m^{-2}}$
    and is positive for energy transport along $\hat{b}$, $\hat{b}=\mathbf{B}/|\mathbf{B}|$
    is the unit vector in the direction of the local magnetic field, $\chi_{E_i,\parallel}$
    is the parallel ion energy diffusivity in $\mathrm{m^2\,s^{-1}}$, $w_i$ is the
    local ion thermal energy density in $\mathrm{J\,m^{-3}}$, and $\nabla_\parallel=\hat{b}\cdot\nabla$
    is the derivative along the magnetic field in $\mathrm{m^{-1}}$. The minus sign
    means that the conductive heat flux is down the field-aligned energy-density gradient.
    For a single ion species $s$, $w_s$ may be written as $(3/2)n_s\mathcal{T}_s$,
    with $n_s$ in $\mathrm{m^{-3}}$ and $\mathcal{T}_s$ the ion temperature expressed
    as energy per particle in joules; if $T_s$ is given in eV, then $\mathcal{T}_s=eT_s$,
    where $e$ is the elementary charge. For total-ion energy, $w_i$ represents the
    summed thermal energy density over the ion species included in the model.


    This coefficient is usually inferred or prescribed rather than measured directly.
    It may be obtained from transport analysis, from collisional or fluid closure
    estimates, or by fitting field-aligned heat transport in a reduced model; the
    interpretation depends on the thermal-energy variable to which the coefficient
    is applied.


    Typical magnitudes are strongly regime and model dependent. Collisional estimates
    scale roughly with ion thermal speed squared times the ion-ion collision time;
    representative effective values can range from $10^2-10^6\ \mathrm{m^2\,s^{-1}}$
    in cold, collisional edge or scrape-off-layer plasmas to $10^8-10^{11}\ \mathrm{m^2\,s^{-1}}$
    in hot, weakly collisional core plasmas.'
  unit: m^2.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_transport/model/ggd/ion/energy/d_parallel/values
    dd_path: edge_transport/model/ggd/ion/energy/d_parallel/values
    status: attached
  - id: dd:edge_transport/model/ggd/ion/state/energy/d_parallel/values
    dd_path: edge_transport/model/ggd/ion/state/energy/d_parallel/values
    status: attached
  - id: dd:edge_transport/model/ggd/total_ion_energy/d_parallel/values
    dd_path: edge_transport/model/ggd/total_ion_energy/d_parallel/values
    status: attached
  - id: dd:plasma_transport/model/ggd/ion/energy/d_parallel/values
    dd_path: plasma_transport/model/ggd/ion/energy/d_parallel/values
    status: composed
  - id: dd:plasma_transport/model/ggd/total_ion_energy/d_parallel/values
    dd_path: plasma_transport/model/ggd/total_ion_energy/d_parallel/values
    status: composed
- name: parallel_ion_particle_flux
  kind: scalar
  status: draft
  description: Parallel component of the total ion particle flux density along the
    local magnetic field direction, aggregated over all charge states of the ion species.
  documentation: 'The parallel ion particle flux $\Gamma_{\parallel,i}$ quantifies
    the net flow of ions per unit area per unit time along the local magnetic field
    direction $\hat{b} = \mathbf{B}/|\mathbf{B}|$, summed over all charge states of
    the ion species. It enters the ion density continuity equation as the divergence
    term governing parallel transport, and is the dominant particle transport channel
    along open magnetic field lines in the scrape-off layer and divertor regions.


    The defining relation is:


    $$

    \Gamma_{\parallel,i} = n_i \, v_{\parallel,i}

    $$


    where $n_i$ is the ion number density and $v_{\parallel,i}$ is the component of
    the ion fluid velocity parallel to $\mathbf{B}$.


    This quantity is computed in edge and plasma transport models from the fluid momentum
    balance or by integrating the ion distribution function over the parallel velocity
    dimension. For charge-state-resolved transport, the counterpart [parallel_ion_charge_state_particle_flux](name:parallel_ion_charge_state_particle_flux)
    provides per-charge-state resolution. The analogous quantities for other plasma
    components are [parallel_electron_particle_flux](name:parallel_electron_particle_flux)
    and [parallel_neutral_particle_flux](name:parallel_neutral_particle_flux).


    Typical magnitudes in the scrape-off layer range from $10^{20}$ to $10^{22}$ m$^{-2}$
    s$^{-1}$, with values increasing toward divertor target plates as parallel flow
    accelerates toward the Bohm condition at the magnetic presheath entrance.


    Sign convention: Positive when the ion particle flow is co-directed with the magnetic
    field vector $\mathbf{B}$.'
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:parallel_ion_charge_state_particle_flux
  arguments:
  - name: ion_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
