    shoulder of the H-mode edge transport barrier, and the quantity is distinct from
    the corresponding [toroidal hydrogen-ion velocity](name:toroidal_hydrogen_velocity_at_pedestal_top).


    Sign convention: Positive when the deuterium-ion fluid velocity has a component
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
