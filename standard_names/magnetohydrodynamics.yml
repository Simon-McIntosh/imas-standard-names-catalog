- name: radiated_power_over_halo_region_due_to_impurity_radiation
  kind: scalar
  status: draft
  description: Total electromagnetic power radiated by electron collisions with impurity
    ions within the halo region during a disruption.
  documentation: 'This quantity represents the power lost through line radiation and
    bremsstrahlung as thermal electrons interact with impurity species (e.g., argon,
    neon, nitrogen) in the halo plasma region during a disruption event. The radiated
    power $P_{\rm rad,halo}^{\rm imp}$ is a critical term in the disruption power
    balance, helping to dissipate the plasma thermal energy and mitigate heat loads
    on plasma-facing components. Typical values in ITER-scale disruptions range from
    tens to hundreds of megawatts, depending on the injected impurity concentration
    and the halo region volume. The radiated power is related to the electron density
    $n_e$, the impurity density $n_{\rm imp}$, and the electron temperature $T_e$
    through the radiation function $L(T_e)$: $P_{\rm rad,halo}^{\rm imp} = \int_{\rm
    halo} n_e n_{\rm imp} L(T_e) \, dV$. This quantity is a subset of the total radiated
    power during a disruption, complementing the core-plasma radiated power from [radiated_power_due_to_impurity_radiation](name:radiated_power_due_to_impurity_radiation)
    and the ohmic dissipation in [ohmic_power_over_halo_region_due_to_ohmic_dissipation](name:ohmic_power_over_halo_region_due_to_ohmic_dissipation).
    The power balance is sign-invariant (always non-negative).'
  unit: W
  physics_domain: magnetohydrodynamics
  links:
  - name:radiated_power_due_to_impurity_radiation
  - name:ohmic_power_over_halo_region_due_to_ohmic_dissipation
  sources:
  - id: dd:disruption/global_quantities/power_radiated_electrons_impurities_halo
    dd_path: disruption/global_quantities/power_radiated_electrons_impurities_halo
    status: composed
- name: runaway_electron_critical_momentum_due_to_hot_tail
  kind: scalar
  status: draft
  description: Critical momentum threshold for hot-tail runaway electron generation,
    given by the momentum above which collisional drag is overcome by the electric
    field during the thermal quench.
  documentation: "The critical momentum for the hot-tail runaway electron generation\
    \ mechanism defines the threshold momentum $p_{\\mathrm{crit}}^{\\mathrm{HT}}$\
    \ above which a suprathermal electron from the high-energy tail of the post-thermal-quench\
    \ distribution can overcome collisional drag and become a runaway electron. The\
    \ hot-tail mechanism is the dominant runaway seed source during a tokamak disruption\
    \ when the electron temperature drops rapidly, leaving a suprathermal population\
    \ that can be accelerated by the induced toroidal electric field. The critical\
    \ momentum scales inversely with the cold-electron density and the electric field\
    \ strength during the current quench; typical values in ITER-relevant disruption\
    \ scenarios range from $0.1\\,m_e c$ to $1.0\\,m_e c$, corresponding to kinetic\
    \ energies of $5$\u2013$500$ keV. This quantity is closely related to the [critical\
    \ electric field](name:critical_electric_field), which defines the Dreicer threshold\
    \ for bulk-electron runaway. The hot-tail seed population is distinct from the\
    \ avalanche multiplication process and is a critical input to disruption mitigation\
    \ strategies."
  unit: kg.m^-1.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:critical_electric_field
  sources:
  - id: dd:runaway_electrons/profiles_1d/momentum_critical_hot_tail
    dd_path: runaway_electrons/profiles_1d/momentum_critical_hot_tail
    status: composed
- name: runaway_electron_density
  kind: scalar
  status: draft
  description: Number density of the runaway electron population, representing electrons
    that have undergone continuous acceleration to relativistic energies in the presence
    of a strong electric field.
  documentation: "The runaway electron density $n_{\\mathrm{RE}}$ quantifies the number\
    \ of relativistic electrons per unit volume that are no longer confined by collisions\
    \ and are continuously accelerated by the toroidal electric field. In tokamak\
    \ disruptions, runaway electron densities can reach $10^{18}$\u2013$10^{20}\\\
    ,\\mathrm{m}^{-3}$, with corresponding current densities up to several MA/m$^2$.\
    \ The density is obtained from fluid models of the runaway dynamics (e.g., solving\
    \ the kinetic equation for the runaway distribution) or from diagnostic measurements\
    \ such as synchrotron radiation imaging and hard X-ray cameras. The radial profile\
    \ of $n_{\\mathrm{RE}}$ is critical for assessing local heat loads and for estimating\
    \ the total runaway current during disruptions. This quantity is related to the\
    \ density of thermal electrons via $n_e = n_{\\mathrm{thermal}} + n_{\\mathrm{RE}}$\
    \ and to the runaway current through $j_{\\mathrm{RE}} = e n_{\\mathrm{RE}} c$\
    \ for fully relativistic electrons.\n\nSign convention: Positive when the number\
    \ of runaway electrons per unit volume is measured.\n\nThe density is closely\
    \ linked to [runaway_electron_source_rate_due_to_dreicer](name:runaway_electron_source_rate_due_to_dreicer)\
    \ which describes the primary generation mechanism, and is distinguished from\
    \ the volume-averaged density [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density)\
    \ by its local, radial-profile nature."
  unit: m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate_due_to_dreicer
  - name:volume_averaged_runaway_electron_density
  sources:
  - id: dd:runaway_electrons/ggd_fluid/density/values
    dd_path: runaway_electrons/ggd_fluid/density/values
    status: composed
  - id: dd:runaway_electrons/profiles_1d/density
    dd_path: runaway_electrons/profiles_1d/density
    status: composed
- name: runaway_electron_kinetic_energy
  kind: scalar
  status: draft
  description: Total relativistic kinetic energy stored in the runaway electron population,
    summed over all electrons in the plasma.
  documentation: "The total runaway electron kinetic energy $E_{\\mathrm{RE}}$ is\
    \ the sum over all runaway electrons of the single-electron relativistic kinetic\
    \ energy:\n\n\\[\nE_{\\mathrm{RE}} = \\sum_i (\\gamma_i - 1) m_e c^2\n\\]\n\n\
    where $\\gamma_i = 1/\\sqrt{1 - v_i^2/c^2}$ is the Lorentz factor of the $i$-th\
    \ electron. For a typical runaway electron with energy 10\u201330\u202FMeV, the\
    \ Lorentz factor ranges from 20 to 60. In large tokamaks such as ITER, the total\
    \ stored energy can reach tens of megajoules, implying a population of $\\sim\
    \ 10^{14}$\u2013$10^{15}$ electrons.\n\nSign convention: Positive when the total\
    \ kinetic energy of the runaway electron population increases relative to a reference\
    \ state.\n\nThis quantity is a global measure of the free energy available for\
    \ a potential disruption event, directly relevant to assessing the threat of runaway-electron-driven\
    \ damage.\n\nTypical value range: for present tokamaks, $E_{\\mathrm{RE}}$ is\
    \ at most a few megajoules; for ITER scenarios with significant runaway generation,\
    \ it can exceed 20\u202FMJ."
  unit: J
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_duration
  - name:parallel_fast_electron_pressure_at_post_sawtooth_crash
  sources:
  - id: dd:runaway_electrons/global_quantities/energy_kinetic
    dd_path: runaway_electrons/global_quantities/energy_kinetic
    status: composed
- name: runaway_electron_source_rate_due_to_fast_ion
  kind: scalar
  status: draft
  description: Volumetric rate of runaway electron generation via knock-on collisions
    between fast ions and thermal electrons, evaluated at fixed normalized radial
    coordinate.
  documentation: "This source rate quantifies the fast-ion knock-on mechanism, where\
    \ a high-energy ion collides with a thermal electron. The electron gains sufficient\
    \ momentum to overcome the critical velocity for runaway acceleration dash; the\
    \ process transforms kinetic energy from the fast-ion population into seed runaway\
    \ electrons. The rate $S_{\\mathrm{RE}}^{\\mathrm{fast\\,ion}}$ is computed as\
    \ an integral over the fast-ion velocity distribution: $S_{\\mathrm{RE}}^{\\mathrm{fast\\\
    ,ion}} = n_{\\mathrm{fast}} \\int \\sigma_{\\mathrm{knock\\,on}}(v_{\\mathrm{fast}},\
    \ v_{\\mathrm{e}})\\, f_{\\mathrm{fast}}(v_{\\mathrm{fast}})\\, d^3 v_{\\mathrm{fast}}$,\
    \ where $n_{\\mathrm{fast}}$ is the fast-ion density, $\\sigma_{\\mathrm{knock\\\
    ,on}}$ is the knock-on cross-section (typically modeled using the M\xF8ller or\
    \ Bhabha scattering formulas), and $f_{\\mathrm{fast}}$ is the normalized fast-ion\
    \ velocity distribution. In a deuterium-tritium plasma, fusion-born alpha particles\
    \ with energy $E_{\\alpha} = 3.5\\,\\mathrm{MeV}$ are a dominant fast-ion source,\
    \ producing seed runaway electrons with typical energies in the MeV range. The\
    \ rate is computed as a radial profile (at fixed normalized radial coordinate,\
    \ e.g., $\\rho_{\\mathrm{tor}}$) from the fast-ion distribution obtained by neutral\
    \ beam injection, ion cyclotron resonance heating, or fusion reactions. Typical\
    \ values near the plasma core can reach $10^{17}\\,{\\mathrm{m}}^{-3}\\,{\\mathrm{s}}^{-1}$\
    \ in high-power discharges. This rate is a primary mechanism for seed runaway\
    \ electron generation and is linked to the Dreicer mechanism; when the knock-on\
    \ seed exceeds the Dreicer rate, the runaway population can be dominated by avalanche\
    \ amplification.\n\nSign convention: Positive when the net rate produces runaway\
    \ electrons from the fast-ion knock-on process."
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate_due_to_dreicer
  sources:
  - id: dd:runaway_electrons/global_quantities/volume_average/ddensity_dt_tritium
    dd_path: runaway_electrons/global_quantities/volume_average/ddensity_dt_tritium
    status: composed
- name: runaway_electron_source_rate_due_to_fusion
  kind: scalar
  status: draft
  description: Volumetric generation rate of runaway electrons resulting from the
    tritium beta decay reaction in a deuterium-tritium plasma.
  documentation: 'This quantity represents the source rate of runaway electrons produced
    by the tritium beta decay process. In a D-T fusion plasma, tritium nuclei undergo
    beta decay with a half-life of 12.32 years, emitting an electron and an antineutrino:
    $\mathrm{T} \rightarrow {}^3\mathrm{He} + e^- + \bar{\nu}_e$. The emitted beta
    electron has a continuous energy spectrum up to 18.6 keV, and a fraction of these
    electrons can become runaway if the local electric field exceeds the critical
    threshold $E_c$. The source rate scales with the tritium density $n_{\mathrm{T}}$
    as $S_{\mathrm{RE}}^{\beta} = n_{\mathrm{T}} / \tau_{\beta}$, where $\tau_{\beta}$
    is the tritium beta decay time constant. Typical values in a burning D-T plasma
    with $n_{\mathrm{T}} \sim 10^{20} \, \mathrm{m}^{-3}$ are on the order of $10^{5}
    \, \mathrm{m}^{-3}\mathrm{s}^{-1}$, much smaller than primary Dreicer or hot-tail
    sources. This beta-decay source is most relevant for long-pulse burning plasmas
    where tritium inventory accumulates, such as ITER. Measurements of the associated
    tritium density and decay products are used to constrain this source term. See
    also [runaway_electron_source_rate_due_to_dreicer](name:runaway_electron_source_rate_due_to_dreicer)
    and [runaway_electron_source_rate_due_to_hot_tail](name:runaway_electron_source_rate_due_to_hot_tail)
    for other generation mechanisms.'
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate_due_to_dreicer
  - name:runaway_electron_source_rate_due_to_hot_tail
  sources:
  - id: dd:runaway_electrons/profiles_1d/ddensity_dt_tritium
    dd_path: runaway_electrons/profiles_1d/ddensity_dt_tritium
    status: skipped
- name: runaway_electron_source_rate_due_to_hot_tail
  kind: scalar
  status: draft
  description: Volumetric generation rate of runaway electrons due to the hot-tail
    mechanism, where a rapidly cooling Maxwellian tail traps suprathermal electrons
    during a thermal quench.
  documentation: The hot-tail mechanism is the dominant primary generation process
    for runaway electrons during a plasma disruption. When the bulk electron temperature
    collapses on a timescale shorter than the collisional slowing-down time of electrons
    at a few times the thermal velocity, the high-energy tail of the velocity distribution
    function is left behind as a suprathermal population that can then be accelerated
    to runaway energies by the induced electric field. The hot-tail source rate $S_{\mathrm{HT}}$
    enters the runaway electron density evolution equation as $\partial n_{\mathrm{RE}}/\partial
    t = S_{\mathrm{Dreicer}} + S_{\mathrm{HT}} + S_{\mathrm{avalanche}}$, where each
    term accounts for a distinct generation mechanism. This rate depends strongly
    on the initial electron temperature, the quench time, and the post-quench plasma
    parameters. The related total generation rate is [runaway_electron_source_rate](name:runaway_electron_source_rate),
    which sums all mechanisms, and the Dreicer-driven rate is [runaway_electron_source_rate_due_to_dreicer](name:runaway_electron_source_rate_due_to_dreicer).
    Typical hot-tail source rates can reach $10^{20}\,\mathrm{m}^{-3}\mathrm{s}^{-1}$
    during the current quench in an ITER-scale disruption, far exceeding the Dreicer
    rate for fast thermal quenches.
  unit: m^-3.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_source_rate
  - name:runaway_electron_source_rate_due_to_dreicer
  sources:
  - id: dd:runaway_electrons/profiles_1d/ddensity_dt_hot_tail
    dd_path: runaway_electrons/profiles_1d/ddensity_dt_hot_tail
    status: attached
  - id: dd:runaway_electrons/profiles_1d/ddensity_dt_total
    dd_path: runaway_electrons/profiles_1d/ddensity_dt_total
    status: composed
- name: thermal_pressure_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Scalar thermal pressure of the Maxwellian electron population, evaluated
    in the plasma core immediately after a sawtooth crash.
  documentation: "The thermal electron pressure $p_{e,\\mathrm{th}}$ quantifies the\
    \ kinetic pressure contributed by the thermal (Maxwellian) electron population.\
    \ In the post-sawtooth-crash state, the central pressure profile is flattened\
    \ inside the inversion radius due to the redistribution of plasma energy. Typical\
    \ core values in a tokamak range from a few tens of kilopascals (e.g., 10\u2013\
    100 kPa in medium-size devices like JET or DIII-D) up to several hundred kPa in\
    \ ITER-like plasmas. This quantity is reconstructed from kinetic profile diagnostics\
    \ (Thomson scattering, electron cyclotron emission) and is related to the electron\
    \ density and temperature via $p_{e,\\mathrm{th}} = n_e k_B T_e$ for a Maxwellian\
    \ distribution. See also the total retained pressure in [total_ion_pressure_at_post_sawtooth_crash](name:total_ion_pressure_at_post_sawtooth_crash)\
    \ and the fast-electron contribution in [parallel_fast_electron_pressure_at_post_sawtooth_crash](name:parallel_fast_electron_pressure_at_post_sawtooth_crash).\n\
    \nSign convention: Positive when the kinetic pressure is compressive, representing\
    \ a net outward force against the confining magnetic field."
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:total_ion_pressure_at_post_sawtooth_crash
  - name:parallel_fast_electron_pressure_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/p_e
    dd_path: sawteeth/profiles_1d/p_e
    status: composed
  - id: dd:sawteeth/profiles_1d/pressure_thermal
    dd_path: sawteeth/profiles_1d/pressure_thermal
    status: composed
- name: time_derivative_of_phase
  kind: scalar
  status: draft
  description: Instantaneous angular frequency of a neoclassical tearing mode, defined
    as the rate of change of its measured phase in the laboratory reference frame.
  documentation: 'The time derivative of the phase, $d\phi/dt$, represents the instantaneous
    angular frequency of a neoclassical tearing mode (NTM). This frequency, often
    denoted as $f = d\phi/(2\pi dt)$ in hertz, measures how fast the mode rotates
    in the laboratory frame. For a mode with toroidal mode number $n$, the angular
    frequency is related to the plasma toroidal rotation frequency $\Omega = d\phi_{\text{plasma}}/dt$
    via the dispersion relation $d\phi/dt = n\Omega$ (i.e., $f = n\Omega/2\pi$), where
    $\Omega$ is the angular frequency of the rotating plasma. Typical values range
    from a few kilohertz to tens of kilohertz in tokamaks, depending on the plasma
    rotation and the mode''s toroidal mode number. This quantity is derived from magnetic
    pickup coils, electron cyclotron emission, or soft X-ray diagnostics, which measure
    the mode''s phase evolution.


    Sign convention: Positive when the phase increases in time, corresponding to mode
    rotation in the direction of increasing toroidal angle $\phi$ in the IMAS cylindrical
    $(R, \phi, Z)$ frame.'
  unit: rad.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:phase
  - name:toroidal_mode_number_of_neoclassical_tearing_mode
  arguments:
  - name: phase
    operator: time_derivative
    operator_kind: unary_prefix
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/dphase_dt
    dd_path: ntms/time_slice/mode/detailed_evolution/dphase_dt
    status: composed
  - id: dd:ntms/time_slice/mode/dphase_dt
    dd_path: ntms/time_slice/mode/dphase_dt
    status: composed
- name: toroidal_current_density_at_post_sawtooth_crash
  kind: scalar
  status: draft
  description: Toroidal component of the total current density on the poloidal cross-section,
    evaluated immediately after a sawtooth crash.
  documentation: 'The toroidal current density $j_\phi = \langle J_\phi / R \rangle
    / \langle 1/R \rangle$ is the flux-surface-averaged projection of the plasma current
    density vector onto the geometric toroidal direction $\hat{\phi}$. Immediately
    after a sawtooth crash, the current density profile is flattened inside the inversion
    radius as the central $q$ profile resets above unity, redistributing the core
    current toward the periphery. This quantity is commonly derived from equilibrium
    reconstructions constrained by magnetic diagnostics, Motional Stark Effect measurements,
    or polarimetry. Typical core values range from 0.1 to 1 MA/m$^2$ and depend on
    the plasma current, safety factor profile, and the magnitude of the sawtooth crash.
    The post-crash current density is closely related to the parallel current density
    [name:parallel_current_density_at_post_sawtooth_crash] and the ohmic component
    [name:ohmic_current_density_at_post_sawtooth_crash] that re-establishes the central
    current after the event.


    Sign convention: Positive when $j_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:parallel_current_density_at_post_sawtooth_crash
  - name:ohmic_current_density_at_post_sawtooth_crash
  sources:
  - id: dd:sawteeth/profiles_1d/j_phi
    dd_path: sawteeth/profiles_1d/j_phi
    status: composed
- name: toroidal_mode_number_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Integer toroidal periodicity (n) of the magnetic island chain associated
    with a neoclassical tearing mode.
  documentation: "The toroidal mode number $n$ quantifies the number of complete toroidal\
    \ transits of the magnetic island chain as the safety factor $q$ varies across\
    \ a rational surface, where $q = m/n$. It is determined from Mirnov coil arrays\
    \ or ECE imaging by analyzing the toroidal phase relationship of the magnetic\
    \ perturbation. In typical tokamak plasmas, NTM toroidal mode numbers range from\
    \ $n=1$ (core modes) to $n=3$ or higher (edge modes). The poloidal counterpart\
    \ is the [poloidal mode number of neoclassical tearing mode](name:poloidal_mode_number_of_neoclassical_tearing_mode)\
    \ $m$, and together they define the island helicity and rational surface location.\
    \ The [frequency of neoclassical tearing mode](name:frequency_of_neoclassical_tearing_mode)\
    \ and [toroidal flux radius of neoclassical tearing mode](name:toroidal_flux_radius_of_neoclassical_tearing_mode)\
    \ further characterize the island dynamics.\n\nSign convention: Positive when\
    \ the field perturbation rotates in the direction of increasing toroidal angle\
    \ $\\phi$.\n\n$n$ is sign-invariant for a given tearing parity \u2014 only the\
    \ absolute value determines the island helicity; the sign convention is preserved\
    \ for consistency with Fourier decomposition of the perturbed magnetic field."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_mode_number_of_neoclassical_tearing_mode
