- name: first_coordinate_width_of_crystal
  kind: scalar
  status: draft
  description: Full width of the dispersing crystal in the first local coordinate
    (X1) direction, applicable for rectangular crystal geometry.
  documentation: 'The first-coordinate width $w_{X1}$ defines the physical extent
    of the dispersing crystal along the X1 axis of the local instrument reference
    frame $(X1, X2)$, which is attached to the crystal element and distinct from the
    machine cylindrical frame $(R, \phi, Z)$. This dimension is used when the crystal
    geometry is rectangular; for non-rectangular boundaries, the outline vertices
    defined by [first_coordinate_of_crystal_outline](name:first_coordinate_of_crystal_outline)
    and [second_coordinate_of_crystal_outline](name:second_coordinate_of_crystal_outline)
    should be used instead. Together with [second_coordinate_width_of_crystal](name:second_coordinate_width_of_crystal),
    which gives the orthogonal X2 extent, these two widths fully characterize the
    rectangular active area of the crystal. The crystal curvature in the X1 direction
    is separately described by [first_coordinate_radius_of_curvature_of_crystal](name:first_coordinate_radius_of_curvature_of_crystal).
    Typical crystal dimensions in X-ray crystal spectrometers range from a few millimeters
    to several tens of millimeters depending on the spectrometer design and the targeted
    spectral resolution.


    Sign convention: Positive when the width is measured in the direction of increasing
    X1 coordinate within the local instrument reference frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_of_crystal_outline
