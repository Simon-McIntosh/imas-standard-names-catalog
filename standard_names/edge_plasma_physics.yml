    dd_path: langmuir_probes/probe/n_e
    status: composed
- name: electron_pressure
  kind: scalar
  status: draft
  description: Scalar kinetic pressure of the electron population, defined as the
    product of electron number density and electron temperature under the Maxwellian
    assumption. Represents the isotropic thermal stress contribution of electrons
    to the total plasma pressure.
  documentation: "The electron pressure $p_e$ is defined by the ideal-gas relation\n\
    \n$$p_e = n_e k_B T_e$$\n\nwhere $n_e$ is the electron number density (m$^{-3}$),\
    \ $k_B$ is the Boltzmann constant, and $T_e$ is the electron thermodynamic temperature\
    \ in kelvin (K). When electron temperature is expressed in electron-volts (eV),\
    \ the relation becomes $p_e = n_e e T_e^{\\mathrm{(eV)}}$, where $e = 1.602 \\\
    times 10^{-19}$ J eV$^{-1}$; both forms yield the same pressure in pascals.\n\n\
    This quantity represents the isotropic part of the electron pressure tensor under\
    \ the Maxwellian (or local thermodynamic equilibrium) assumption. It does not\
    \ include off-diagonal viscous stress or heat-flux corrections that appear in\
    \ extended fluid models.\n\nThe total plasma pressure is the sum of the electron\
    \ pressure and all ion partial pressures: $p = p_e + \\sum_i p_i$. In typical\
    \ tokamak edge plasmas the electron and ion temperatures are comparable, so $p_e$\
    \ contributes roughly half of the total thermal pressure. In the scrape-off layer\
    \ and divertor region, $T_e$ ranges from a few eV near the target plates to tens\
    \ of eV at the separatrix, with $n_e$ of order $10^{18}$\u2013$10^{20}$ m$^{-3}$,\
    \ giving $p_e$ values in the range of roughly $10^{-2}$\u2013$10^{2}$ Pa.\n\n\
    This quantity is a non-negative scalar; it is identically zero only in the absence\
    \ of electrons or at absolute zero temperature."
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_electron_number_density
  - name:ion_pressure
  - name:neutral_pressure
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/electrons/pressure/values
    dd_path: edge_profiles/ggd/electrons/pressure/values
    status: composed
- name: fast_electron_number_density
  kind: scalar
  status: draft
  description: Number density of fast (non-thermal, suprathermal) electrons, representing
    the population with energies significantly exceeding the local thermal energy
    $k_B T_e$.
  documentation: "The fast electron number density $n_{\\rm fast,e}$ quantifies the\
    \ number of suprathermal electrons per unit volume \u2014 those whose kinetic\
    \ energies substantially exceed the bulk Maxwellian thermal energy. Fast electrons\
    \ arise from wave heating (electron cyclotron resonance heating), runaway electron\
    \ generation, and beam injection. They do not participate in collisional equilibration\
    \ on the transport timescale and must be tracked separately from the thermal population.\
    \ The fast electron density is bounded above by the [thermal electron number density](name:thermal_electron_number_density),\
    \ since fast electrons constitute a minority population; their fraction $n_{\\\
    rm fast,e}/n_e^{\\rm total}$ is typically $10^{-4}$\u2013$10^{-2}$ in standard\
    \ H-mode plasmas but can rise to order unity during off-normal events. In the\
    \ edge and scrape-off layer, fast electron populations modify the sheath boundary\
    \ conditions and contribute to enhanced heat fluxes. Experimental inference relies\
    \ on hard X-ray diagnostics, non-thermal electron cyclotron emission, and kinetic\
    \ reconstruction codes. The complement of this quantity \u2014 the thermal electron\
    \ component \u2014 is given by [thermal_electron_number_density](name:thermal_electron_number_density),\
    \ and the total ion counterpart is [ion_number_density](name:ion_number_density).\n\
    \nSign convention: Positive when the fast electron population is present with\
    \ $n_{\\rm fast,e} > 0$, as number density is a non-negative definite scalar quantity."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_electron_number_density
  - name:ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/electrons/density_fast/values
    dd_path: edge_profiles/ggd/electrons/density_fast/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/electrons/density_fast
    dd_path: edge_profiles/profiles_1d/electrons/density_fast
    status: composed
- name: fast_ion_number_density
  kind: scalar
  status: draft
  description: Number density of fast (non-thermal) ions of a given species, summed
    over all charge states, in the edge plasma region. The fast population comprises
    ions whose energy substantially exceeds the local thermal energy, typically arising
    from neutral-beam injection, ion-cyclotron resonance heating, or fusion reactions.
  documentation: 'The fast ion number density $n_\mathrm{fast,i}$ is defined as the
    number of fast (non-thermal) ions per unit volume for a given ion species, integrated
    over all charge states:

    $$n_\mathrm{fast,i} = \sum_z n_\mathrm{fast,i,z}$$

    where $n_\mathrm{fast,i,z}$ is the fast ion density for charge state $z$. The
    total ion number density decomposes as

    $$n_i = n_\mathrm{th,i} + n_\mathrm{fast,i}$$

    where $n_\mathrm{th,i}$ is the thermal ion number density (`ion_number_density`
    refers to the thermal population unless otherwise specified; consult sibling names
    for the decomposition).


    The criterion distinguishing fast from thermal ions is model-dependent but typically
    requires that the ion kinetic energy exceed a threshold of order several times
    the local thermal energy $k_B T_i$. In practice this population is generated by
    neutral-beam injection (NBI), ion-cyclotron resonance heating (ICRH), or thermonuclear
    alpha particles, yielding energies from tens of keV to several MeV.


    Typical values in the edge plasma region of a tokamak range from $10^{15}$ to
    $10^{18}\,\mathrm{m}^{-3}$, depending on heating power and confinement conditions,
    and are substantially lower than the bulk ion density $n_i$.


    Note on quasineutrality: $n_\mathrm{fast,i}$ is a particle number density summed
    over charge states and does not by itself represent a charge density. To form
    the ion charge-density contribution for the quasineutrality condition, one must
    weight each charge-state contribution $n_\mathrm{fast,i,z}$ by the corresponding
    charge number $z$; see `fast_ion_state_number_density` for per-charge-state data.


    This quantity is defined on the generalized grid description (GGD) of the edge
    plasma region, which may cover the scrape-off layer, divertor, and near-wall regions
    in the cylindrical $(R, \phi, Z)$ frame where $R$ is the major radius, $\phi$
    is the toroidal angle, and $Z$ is the vertical height.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_ion_number_density
  - name:fast_electron_number_density
  - name:fast_ion_state_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/ion/density_fast/values
    dd_path: edge_profiles/ggd/ion/density_fast/values
    status: composed
  - id: dd:edge_profiles/ggd/ion/state/density_fast/values
    dd_path: edge_profiles/ggd/ion/state/density_fast/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/ion/density_fast
    dd_path: edge_profiles/profiles_1d/ion/density_fast
    status: composed
- name: fast_ion_state_number_density
  kind: scalar
  status: draft
  description: Number density of fast (non-thermal) ions of a given species in a specific
    charge state, resolving the suprathermal population at the charge-state level
    rather than summing over all ionization stages.
  documentation: "The fast ion charge-state number density $n_{\\mathrm{fast},z}$\
    \ counts suprathermal ions \u2014 those whose energy substantially exceeds the\
    \ local thermal energy $k_B T_i$, where $T_i$ is the thermal ion temperature \u2014\
    \ on a per-charge-state basis. Fast ions in the edge plasma arise principally\
    \ from neutral-beam injection, ion-cyclotron resonance heating, and charge-exchange\
    \ reactions, and their charge-state distribution reflects the local ionization\
    \ balance and recombination rates. This quantity refines [fast_ion_number_density](name:fast_ion_number_density),\
    \ which sums over all charge states of a species; summing $n_{\\mathrm{fast},z}$\
    \ over all charge states $z$ recovers that species-level density. The complementary\
    \ thermal population at the same charge-state resolution is given by [thermal_ion_state_number_density](name:thermal_ion_state_number_density),\
    \ and the total (thermal plus fast) charge-state density is [ion_state_number_density](name:ion_state_number_density).\
    \ In the edge and scrape-off layer, fast ion densities are orders of magnitude\
    \ smaller than thermal densities, with typical values ranging from $10^{14}$ to\
    \ $10^{17}$ m$^{-3}$ depending on heating power and proximity to the separatrix.\
    \ Charge-state-resolved fast ion densities are computed by collisional-radiative\
    \ models or Monte Carlo neutral and fast-particle transport codes.\n\nSign convention:\
    \ Positive when the local fast ion population is finite and above zero, consistent\
    \ with a particle count per unit volume."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:fast_ion_number_density
  - name:thermal_ion_state_number_density
  - name:ion_state_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/ion/state/density_fast
    dd_path: edge_profiles/profiles_1d/ion/state/density_fast
    status: composed
- name: fast_neutral_number_density
  kind: scalar
  status: draft
  description: Number density of fast (non-thermal) neutral particles, summed over
    all internal quantum states, representing the suprathermal neutral population
    whose energies significantly exceed the local thermal energy. Neutrals by definition
    carry zero net charge; the summation is over internal excitation and spin states,
    not charge states.
  documentation: "The fast neutral number density $n_{\\rm fast,n}$ counts neutral\
    \ particles whose kinetic energies lie well above the local thermal energy $E\
    \ \\gg k_B T_e$, $k_B T_i$, and therefore cannot be described by the bulk Maxwellian\
    \ distribution. The total neutral number density decomposes as\n\n$$n_{\\rm n}^{\\\
    rm total} = n_{\\rm thermal,n} + n_{\\rm fast,n},$$\n\nwhere $n_{\\rm thermal,n}$\
    \ is the density of neutrals in thermal equilibrium with the local plasma and\
    \ $n_{\\rm fast,n}$ is the contribution from the suprathermal tail. The fast component\
    \ is generated primarily by charge-exchange reactions between fast ions and thermal\
    \ neutrals, by beam injection, and by energetic neutral recycling from plasma-facing\
    \ components.\n\nThe kinetic source of $n_{\\rm fast,n}$ may be expressed as the\
    \ integral\n\n$$n_{\\rm fast,n} = \\int_{E > E_{\\rm th}} f_n(\\mathbf{v})\\,\
    \ d^3v,$$\n\nwhere $f_n(\\mathbf{v})$ is the neutral distribution function and\
    \ $E_{\\rm th}$ is an energy threshold (typically a few times $k_B T_i$, often\
    \ in the range $3\\text{\u2013}10\\,k_B T_i$, though the precise criterion is\
    \ species- and context-dependent) separating the thermal and suprathermal populations.\n\
    \nThe charge-exchange production rate per unit volume is\n\n$$S_{\\rm cx} = n_{\\\
    rm fast,i}\\, n_{\\rm thermal,n}\\, \\langle \\sigma v \\rangle_{\\rm cx},$$\n\
    \nwith units $\\rm m^{-3}\\,s^{-1}$, where $n_{\\rm fast,i}$ is the fast ion density,\
    \ $n_{\\rm thermal,n}$ is the thermal neutral density, and $\\langle \\sigma v\
    \ \\rangle_{\\rm cx}$ is the charge-exchange rate coefficient.\n\nTypical values\
    \ in the plasma edge range from $10^{14}$ to $10^{18}\\,\\rm m^{-3}$, depending\
    \ on the device, heating scenario, and proximity to neutral beam injection or\
    \ recycling surfaces. $n_{\\rm fast,n}$ is a non-negative definite scalar quantity;\
    \ the summation over internal quantum (excitation and spin) states of the neutral\
    \ species is implied, consistent with the convention used for the total neutral\
    \ density.\n\nThis quantity contributes to the total neutral density `neutral_number_density`\
    \ and complements the fast ion density tracked by `fast_ion_number_density`."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_neutral_number_density
  - name:neutral_number_density
  - name:fast_ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/neutral/state/density_fast/values
    dd_path: edge_profiles/ggd/neutral/state/density_fast/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/neutral/density_fast
    dd_path: edge_profiles/profiles_1d/neutral/density_fast
    status: composed
  - id: dd:edge_profiles/profiles_1d/neutral/state/density_fast
    dd_path: edge_profiles/profiles_1d/neutral/state/density_fast
    status: composed
- name: ion_number_density
  kind: scalar
  status: draft
  description: Total number density of ions of a given species, summing all charge
    states, including both thermal and non-thermal contributions. Represents the number
    of ions per unit volume regardless of ionization state. This quantity aggregates
    over all charge states of a single ion species; for individual charge-state densities
    see ion_state_number_density.
  documentation: 'The ion number density $n_i$ [m$^{-3}$] is defined as the number
    of ions of a given species per unit volume, summed over all charge states $Z$
    of that species:


    $$n_i = \sum_Z n_{i,Z}$$


    where $n_{i,Z}$ is the partial density of ions in charge state $Z$. Both thermal
    and non-thermal (e.g., beam-injected or suprathermal) ion populations contribute.
    No assumption of a Maxwellian velocity distribution is imposed.


    **Species vs. charge-state aggregation:** This quantity aggregates charge states
    of a single species. If only one charge state is relevant (e.g., fully stripped
    impurity), the sum reduces to that single term. For multi-species plasmas, a separate
    $n_i$ is defined per species. The total ion number density across all species
    is the sum over all individual species densities.


    **Typical values:** In tokamak edge and scrape-off layer plasmas, $n_i$ ranges
    from approximately $10^{16}$ m$^{-3}$ in the far scrape-off layer to $10^{20}$
    m$^{-3}$ near the separatrix or in the pedestal region.


    **Physical context:** The ion number density enters the particle continuity equation


    $$\frac{\partial n_i}{\partial t} + \nabla \cdot (n_i \mathbf{u}_i) = S_i$$


    where $\mathbf{u}_i$ is the mean ion fluid velocity and $S_i$ [m$^{-3}$ s$^{-1}$]
    is the net particle source (ionization minus recombination). In the edge plasma,
    $n_i$ is also related to the plasma pressure via $p_i = n_i T_i$, where $T_i$
    is the ion temperature in joules.


    **Measurement context:** Ion number densities in the edge are inferred from spectroscopic
    emission (line-integrated or Abel-inverted), Langmuir probe saturation currents,
    or reflectometry, and from fluid or kinetic edge transport codes.


    This quantity is a non-negative scalar; it is identically zero only in the absence
    of ions.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_ion_number_density
  - name:neutral_number_density
  - name:ion_pressure
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/ion/density/values
    dd_path: edge_profiles/ggd/ion/density/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/ion/density
    dd_path: edge_profiles/profiles_1d/ion/density
    status: composed
- name: ion_pressure
  kind: scalar
  status: draft
  description: Thermal pressure of an ion species, defined as the product of ion number
    density and temperature under the assumption of a locally Maxwellian velocity
    distribution. May be resolved by charge state when the ion population occupies
    a distinct ionization stage with a well-defined temperature.
  documentation: 'The ion pressure $p_i$ is the isotropic scalar thermal pressure
    exerted by an ion species (or charge-state-resolved sub-population) in the edge
    plasma, defined by the equation of state


    $$p_i = n_i k_B T_i,$$


    where $n_i$ is the ion number density (m$^{-3}$), $k_B$ is the Boltzmann constant,
    and $T_i$ is the ion temperature expressed in kelvin (or equivalently in electron-volts
    when $k_B T_i$ is written in eV). This relation assumes the ions are in a locally
    Maxwellian state and that the pressure tensor reduces to an isotropic scalar;
    in strongly non-Maxwellian or anisotropic regimes the full pressure tensor may
    be required.


    When the quantity is resolved by charge state, $T_i$ refers to the temperature
    attributed to that specific ionization stage. Because different charge states
    need not relax to a common temperature on short time scales in the edge and divertor,
    such a charge-state temperature should be understood as an effective Maxwellian
    temperature for that sub-population, not necessarily a rigorously equilibrated
    thermodynamic quantity.


    The total thermal ion pressure of a multi-species plasma is obtained by summing
    $p_i$ over all species and charge states. Ion pressure is a primary driver of
    parallel momentum balance along magnetic field lines, governs cross-field pressure-gradient
    transport, and sets the sheath entrance boundary condition in divertor modeling.
    In the edge and scrape-off layer it can depart substantially from the electron
    pressure due to charge-exchange losses and strong ion-neutral coupling.


    Typical values range from approximately $10^{-2}$ Pa in the far scrape-off layer
    to $\sim 10^{3}$ Pa near the separatrix of a medium-to-large tokamak. Ion pressure
    is inferred experimentally from Langmuir probe data combined with spectroscopic
    ion-temperature estimates, or extracted directly from fluid and gyrofluid simulation
    outputs.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:ion_number_density
  - name:electron_pressure
  - name:neutral_pressure
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/ion/pressure/values
    dd_path: edge_profiles/ggd/ion/pressure/values
    status: composed
  - id: dd:edge_profiles/ggd/ion/state/pressure/values
    dd_path: edge_profiles/ggd/ion/state/pressure/values
    status: composed
- name: neutral_number_density
  kind: scalar
  status: draft
  description: Total number density of neutral particles, summing over all quantum
    and excitation states (thermal plus non-thermal populations) when multiple states
    are considered. Neutrals by definition carry zero net charge; the summation is
    over internal quantum states, not charge states. This quantity represents the
    total neutral particle inventory per unit volume.
  documentation: 'The total neutral number density $n_0$ is defined as the sum of
    partial densities over all quantum and excitation states $k$:


    $$n_0 = \sum_k n_{0,k}$$


    where $n_{0,k}$ is the number density of neutrals in quantum state $k$ (ground
    state, excited states, etc.). The sum also encompasses both thermal and non-thermal
    (fast or charge-exchange) neutral populations. By definition, neutrals carry zero
    net charge; the index $k$ refers to internal quantum or excitation states, not
    to ionization charge states.


    $n_0$ is a non-negative definite quantity (units: m$^{-3}$).


    **Physical context.** Neutrals play a central role in edge plasma physics. They
    govern the particle and energy source terms for the plasma through ionization,
    charge-exchange, and recombination processes. The local ionization source $S_\mathrm{ion}$
    is proportional to $n_0 n_e \langle \sigma v \rangle_\mathrm{ion}$, where $n_e$
    is the electron density and $\langle \sigma v \rangle_\mathrm{ion}$ is the rate
    coefficient. High neutral densities near the divertor target or limiter are essential
    for plasma detachment and power exhaust control.


    **Typical values.** In the far scrape-off layer and divertor private flux region,
    $n_0$ may range from $10^{17}$ to $10^{20}$ m$^{-3}$. In the core plasma, neutral
    penetration is limited and $n_0$ drops below $10^{14}$ m$^{-3}$. Near detached
    divertor targets, $n_0$ can approach or exceed $10^{20}$ m$^{-3}$.


    **Decomposition.** This total density is the sum of the thermal neutral component
    (tracked by `thermal_neutral_number_density`) and the fast or non-thermal component
    (tracked by `fast_neutral_number_density`). State-resolved contributions are tracked
    by `neutral_state_number_density`.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:ion_number_density
  - name:neutral_pressure
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/neutral/density/values
    dd_path: edge_profiles/ggd/neutral/density/values
    status: composed
  - id: dd:edge_profiles/ggd/neutral/state/density/values
    dd_path: edge_profiles/ggd/neutral/state/density/values
    status: composed
  - id: dd:edge_profiles/profiles_1d/neutral/density
    dd_path: edge_profiles/profiles_1d/neutral/density
    status: composed
- name: parallel_component_of_neutral_momentum_diffusivity
  kind: scalar
  status: draft
  description: Parallel component of the effective momentum diffusivity tensor for
    the aggregate neutral particle population, projected onto the direction parallel
    to the local magnetic field. Although neutrals are not magnetically confined,
    the parallel projection provides a geometrically consistent decomposition of the
    diffusivity tensor alongside its poloidal and toroidal counterparts.
  documentation: "The parallel neutral momentum diffusivity, $D_{\\parallel}^{\\mathrm{n}}$,\
    \ is defined as the $(\\hat{b}, \\hat{b})$ projection of the rank-2 effective\
    \ diffusivity tensor $\\mathsf{D}^{\\mathrm{n}}$ that appears in the Fickian momentum-transport\
    \ closure\n\n$$\\boldsymbol{\\Pi}^{\\mathrm{n}} = -\\rho^{\\mathrm{n}}\\,\\mathsf{D}^{\\\
    mathrm{n}} \\cdot \\nabla \\mathbf{u}^{\\mathrm{n}},$$\n\nwhere $\\rho^{\\mathrm{n}}$\
    \ is the neutral mass density, $\\mathbf{u}^{\\mathrm{n}}$ is the neutral bulk-flow\
    \ velocity, and $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along\
    \ the local magnetic field. The projected scalar is\n\n$$D_{\\parallel}^{\\mathrm{n}}\
    \ = \\hat{b} \\cdot \\mathsf{D}^{\\mathrm{n}} \\cdot \\hat{b}.$$\n\nThis projection\
    \ is purely geometric: neutrals are not directly governed by the Lorentz force,\
    \ yet expressing the diffusivity tensor in the field-aligned basis $(\\hat{b},\\\
    ,\\hat{e}_{\\mathrm{pol}},\\,\\hat{e}_{\\mathrm{tor}})$ provides a decomposition\
    \ that is physically consistent and directly comparable with the corresponding\
    \ ion-momentum diffusivities in the same basis.\n\nBecause neutrals are not magnetized,\
    \ $D_{\\parallel}^{\\mathrm{n}}$ is not subject to the strong magnetic suppression\
    \ that makes the perpendicular ion diffusivity orders of magnitude smaller than\
    \ the parallel one. Instead, $D_{\\parallel}^{\\mathrm{n}}$ is governed by neutral\
    \ mean-free-path physics, principally charge-exchange collisions between neutrals\
    \ and ions and elastic neutral\u2013neutral scattering. Typical values encountered\
    \ in edge-plasma transport models range from $\\sim 10$ to $\\sim 10^{4}\\,\\\
    mathrm{m^{2}\\,s^{-1}}$, with the upper end corresponding to low-density or weakly\
    \ collisional edge conditions.\n\nThis quantity applies to the aggregate neutral\
    \ population summed over all internal (electronic and vibrational) states. The\
    \ full field-aligned decomposition of neutral momentum transport is completed\
    \ by the poloidal component $D_{\\mathrm{pol}}^{\\mathrm{n}}$ and the toroidal\
    \ component $D_{\\mathrm{tor}}^{\\mathrm{n}}$, available as separate standard\
    \ names. For the state-resolved parallel ion counterpart see `parallel_component_of_ion_state_momentum_diffusivity`."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_component_of_ion_state_momentum_diffusivity
  - name:neutral_momentum_diffusivity
  - name:neutral_particle_diffusivity
  constraints: []
  arguments:
  - name: neutral_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/momentum/d/parallel
    dd_path: edge_transport/model/ggd/neutral/state/momentum/d/parallel
    status: composed
- name: parallel_component_of_neutral_momentum_flux_limiter
  kind: scalar
  status: draft
  description: Dimensionless flux limiter coefficient for the field-aligned component
    of neutral particle momentum transport in edge plasma simulations. This scalar
    blends between low-order and high-order reconstructed convective neutral momentum
    fluxes along the magnetic field direction, taking values in the range [0, 1].
  documentation: 'The parallel component of the neutral momentum flux limiter, $\alpha_{\parallel}$,
    is the field-aligned projection of the limiter vector associated with neutral
    particle momentum transport. In edge plasma transport codes, a flux limiter controls
    the numerical reconstruction of the convective momentum flux: the effective parallel
    neutral momentum flux is written as

    $$\mathcal{F}_{\parallel} = \mathcal{F}_{\parallel}^{\rm lo} + \alpha_{\parallel}\bigl(\mathcal{F}_{\parallel}^{\rm
    hi} - \mathcal{F}_{\parallel}^{\rm lo}\bigr),$$

    where $\mathcal{F}_{\parallel}^{\rm lo}$ is the low-order (diffusive, first-order
    upwind) reconstruction and $\mathcal{F}_{\parallel}^{\rm hi}$ is the high-order
    reconstruction of the parallel neutral momentum flux. The limiter value $\alpha_{\parallel}
    \in [0,1]$ blends between these two reconstructions: $\alpha_{\parallel} = 0$
    selects the low-order scheme and $\alpha_{\parallel} = 1$ selects the high-order
    scheme. This formulation is consistent with the defining convention of [neutral_momentum_flux_limiter](name:neutral_momentum_flux_limiter)
    and its sibling components.


    The field-aligned direction is physically significant in magnetized edge plasmas
    because neutral momentum transport along the magnetic field is kinematically decoupled
    from the cross-field directions. The parallel limiter is therefore independently
    specified from the [poloidal_component_of_neutral_momentum_flux_limiter](name:poloidal_component_of_neutral_momentum_flux_limiter),
    [toroidal_component_of_neutral_momentum_flux_limiter](name:toroidal_component_of_neutral_momentum_flux_limiter),
    and [radial_component_of_neutral_momentum_flux_limiter](name:radial_component_of_neutral_momentum_flux_limiter)
    components, each controlling the accuracy and stability of the numerical flux
    in its respective direction. Typical values span the full range $[0, 1]$ for all
    physically valid configurations.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_flux_limiter
  - name:poloidal_component_of_neutral_momentum_flux_limiter
  - name:toroidal_component_of_neutral_momentum_flux_limiter
  - name:radial_component_of_neutral_momentum_flux_limiter
  constraints: []
