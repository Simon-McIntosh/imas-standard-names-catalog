- name: vertical_coordinate_of_ferritic_object_arc_start_point
  kind: scalar
  status: draft
  description: Height ($Z$) of the start point of an arc-of-circle segment defining
    the poloidal cross section of a ferritic or iron-core object.
  documentation: "The vertical coordinate $Z$ (in meters) specifies the starting height\
    \ of each arc-of-circle element used to build the poloidal boundary contour of\
    \ axisymmetric ferritic inserts or iron-core segments. Sequential arcs connect\
    \ via their start/end points to form a closed outline. This outline, together\
    \ with major-radius ($R$) coordinates, enables computation of the ferromagnetic\
    \ response \u2014 permeability-weighted volume integrals that modify the equilibrium\
    \ field. Values are referenced to the machine midplane ($Z = 0$). See [beta_side_length_of_ferritic_object_oblique_cross_section](name:beta_side_length_of_ferritic_object_oblique_cross_section)\
    \ for alternative oblique-parallelogram geometry descriptions and [inclination_angle_alpha_of_ferritic_object_oblique_cross_section](name:inclination_angle_alpha_of_ferritic_object_oblique_cross_section)\
    \ for angle parameters."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_ferritic_object_centroid
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of the geometric centroid of a ferritic object,
    computed from its poloidal cross-section in the $(R, Z)$ plane.
  documentation: "The vertical coordinate $Z$ (in meters) of the centroid represents\
    \ the area-weighted geometric center of a ferritic object's poloidal cross-section.\
    \ Ferritic inserts \u2014 high-permeability structural components placed inside\
    \ or near the vacuum vessel \u2014 are used in some tokamak designs (e.g., JT-60SA,\
    \ ITER test-blanket modules) to compensate toroidal field ripple or to model iron-core\
    \ effects. The centroid position is the point at which the object's magnetic-dipole\
    \ response is centered in simplified field-perturbation models. Together with\
    \ the companion Cartesian coordinates ($X$, $Y$) or the major-radius coordinate,\
    \ the 3-D centroid is fully specified. See also [vertical_coordinate_of_coil_conductor_element_centre](name:vertical_coordinate_of_coil_conductor_element_centre)\
    \ for the analogous quantity on active coil conductors and [vertical_coordinate_of_iron_core_outline_point](name:vertical_coordinate_of_iron_core_outline_point)\
    \ for iron-core outline vertices."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cylindrical-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_ferritic_object_outline_point
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of a point on the poloidal outline of an
    axisymmetric ferritic insert object.
  documentation: This quantity stores the height coordinate $Z$ (m) of a vertex in
    the discrete polygon that defines the poloidal cross-section outline of a ferritic
    insert. Ferritic inserts are passive ferromagnetic components installed inside
    the vacuum vessel of a tokamak to reduce toroidal-field ripple; their geometry
    is described by a closed polygon in the $(R, Z)$ plane for axisymmetric representations.
    The outline points, together with their radial ($R$) counterparts, fully specify
    the cross-sectional shape used by equilibrium reconstruction and ripple-compensation
    codes. For ITER-class devices, $Z$ values span roughly $\pm$5 m relative to the
    machine midplane. The outline must form a closed, non-self-intersecting polygon.
    See [alpha_side_length_of_ferritic_object_oblique_cross_section](name:alpha_side_length_of_ferritic_object_oblique_cross_section)
    and [beta_side_length_of_ferritic_object_oblique_cross_section](name:beta_side_length_of_ferritic_object_oblique_cross_section)
    for the alternative oblique-parallelogram parametrization of the same objects.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_ferritic_object_rectangle_centre
  kind: scalar
  status: draft
  description: Vertical ($Z$) coordinate of the geometric center of a rectangular
    cross-section representing an axisymmetric ferritic insert or iron-core segment.
  documentation: The vertical coordinate $Z$ (in meters) locates the geometric center
    of a rectangle used to approximate the poloidal cross-section of a ferritic object
    or an iron-core segment in an axisymmetric representation. Ferritic inserts and
    iron-core segments are employed in tokamaks to shape the magnetic field, reduce
    toroidal field ripple, and provide passive flux return paths. The rectangle center,
    together with its major-radius counterpart and dimensions (width, height), fully
    defines the cross-section geometry for electromagnetic modeling codes that evaluate
    the magnetization response of these components. Values depend on device geometry;
    for example, ITER ferritic inserts are located at $Z$ values spanning roughly
    $\pm 4$ m relative to the midplane. See also [vertical_coordinate_of_ferritic_object_arc_start_point](name:vertical_coordinate_of_ferritic_object_arc_start_point)
    and [vertical_coordinate_of_endpoint](name:vertical_coordinate_of_endpoint).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_iron_core_outline_point
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of a point on the poloidal cross-section outline
    of an iron-core segment in the tokamak cylindrical coordinate system.
  documentation: The vertical coordinate $Z$ (in meters) specifies the height of individual
    vertices that define the poloidal cross-section outline of an iron-core segment.
    Iron-core segments are ferromagnetic structural components used in some tokamak
    designs to shape the poloidal magnetic flux and improve plasma equilibrium control.
    The outline is a closed polygon in the $(R, Z)$ plane; together with the companion
    major-radius coordinate, the full 2-D cross-section geometry is reconstructed.
    Values depend on machine size; for medium-size devices $|Z| < 3$ m, while for
    ITER-class machines $|Z|$ can reach $\sim 6$ m. This quantity is an input to equilibrium
    reconstruction codes that model the magnetization response of the iron core. See
    also [vertical_coordinate_of_ferritic_object_centroid](name:vertical_coordinate_of_ferritic_object_centroid)
    for the centroid height of ferritic objects.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_force_combination_weight_of_coil
  kind: scalar
  status: draft
  description: Dimensionless weight specifying a coil's contribution in a linear combination
    used to evaluate vertical electromagnetic forces on the poloidal-field coil set.
  documentation: This weight $w_i$ (dimensionless) defines the contribution of the
    $i$-th coil when the net vertical force is expressed as the linear combination
    $F_z = \sum_i w_i F_{z,i}$, where $F_{z,i}$ is the vertical force on coil $i$.
    The full coil set yields the total vertical force on the machine structure, but
    subsets with specific weight patterns allow evaluation of separation forces (e.g.,
    between upper and lower central-solenoid modules). Weights of $+1$ and $-1$ on
    opposing coil groups isolate differential forces relevant to structural design
    limits. Force values are computed from the Lorentz force density $\mathbf{j} \times
    \mathbf{B}$ integrated over each coil volume, using equilibrium current and field
    distributions. See also [force_limit_combination_matrix_of_active_coil_set](name:force_limit_combination_matrix_of_active_coil_set).
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - equilibrium-reconstruction
  - global-quantity
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_offset_of_coil_conductor_cross_section_outline_point
  kind: scalar
  status: draft
  description: Vertical displacement of a conductor cross-section outline point relative
    to the conductor center in the local frame.
  documentation: "The offset $\\Delta Z$ (in meters) specifies the vertical position\
    \ of a discrete outline point that traces the conductor cross-section boundary,\
    \ measured relative to a local reference point (the conductor centroid). Together\
    \ with corresponding radial ($\\Delta R$) and toroidal ($\\Delta \\phi$) offsets,\
    \ it defines arbitrary conductor shapes \u2014 rectangular, circular, or annular\
    \ \u2014 used in magnetic-field and force calculations. For rectangular cross\
    \ sections this value equals half the conductor height at the corners; for general\
    \ outlines it supports piecewise-linear polygonal descriptions. See [binormal_coordinate_of_coil_conductor_cross_section_outline_point](name:binormal_coordinate_of_coil_conductor_cross_section_outline_point)\
    \ for the complementary binormal-direction coordinate and [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)\
    \ for the integrated area."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  links: []
  validity_domain: ''
  constraints: []
- name: width_of_coil_conductor_cross_section
  kind: scalar
  status: draft
  description: "Characteristic transverse dimension of the coil conductor cross section\
    \ in the normal direction of the local Frenet\u2013Serret frame."
  documentation: 'This quantity specifies the full width $w$ (in meters) of the conductor
    cross section, whose interpretation depends on the geometry type: for rectangular
    or square sections (geometry_type index 3 or 4) it is the full extent in the normal
    direction; for circular sections (index 2) it equals the diameter; for annular
    sections (index 5) it equals the outer diameter. Combined with the height (binormal
    extent) and, where applicable, inner radius, it fully parameterizes the conductor
    cross-sectional shape for current-density and electromagnetic-force computations.
    Values range from a few millimeters (cable-in-conduit strands) to tens of centimeters
    (large PF coil conductors). See [cross_sectional_area_of_coil_element](name:cross_sectional_area_of_coil_element)
    for the resulting area and [vertical_offset_of_coil_conductor_cross_section_outline_point](name:vertical_offset_of_coil_conductor_cross_section_outline_point)
    for point-by-point outline definitions.'
  unit: m
  cocos_transformation_type: one_like
