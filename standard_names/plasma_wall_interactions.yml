    is the inward-pointing wall-normal unit vector. The integral includes only velocities
    directed toward the surface.


    This quantity excludes electron and neutral-particle contributions. The charge-state-resolved
    refinement is [ion charge-state particle flux at the wall](name:ion_charge_state_particle_flux_at_wall),
