name: equilibrium_reconstruction_constraint_weight_of_radial_iron_core_segment_magnetization
status: draft
cocos_transformation_type: one_like
description: Relative weight assigned to the radial ($R$-direction) magnetization
  measurement of an iron core segment in the equilibrium reconstruction.
documentation: Standard $\chi^2$ weight controlling the relative importance of the
  radial component of iron-core segment magnetization $M_R$ in the equilibrium reconstruction
  cost functional. Iron-core segments in tokamaks with ferromagnetic structures (e.g.,
  WEST, EAST) carry significant magnetization that modifies the vacuum field; constraining
  $M_R$ helps the solver account for nonlinear ferromagnetic effects. A weight of
  1 applies the nominal measurement variance; larger values emphasize this constraint
  when modeling uncertainty dominates. The companion vertical magnetization weight
  is `equilibrium_reconstruction_constraint_weight_of_vertical_iron_core_segment_magnetization`.
