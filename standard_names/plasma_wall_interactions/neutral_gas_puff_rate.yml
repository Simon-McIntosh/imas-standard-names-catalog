name: neutral_gas_puff_rate
status: draft
cocos_transformation_type: one_like
description: Rate of externally injected neutral gas particles of a given species
  entering the vacuum vessel through gas-puff valves.
documentation: 'The neutral gas puff rate $\Gamma_{\mathrm{puff}}$ (in s$^{-1}$) is
  the particle throughput of a gas injection system, expressed as the number of atoms
  (or molecules, depending on species convention) per second delivered into the vessel.
  For deuterium fueling, typical puff rates range from $10^{20}$ to $10^{22}$ s$^{-1}$;
  impurity seeding puffs (e.g., nitrogen, neon) are usually one to two orders of magnitude
  lower. The rate is calibrated from piezoelectric valve conductance curves and upstream
  pressure measurements; real-time feedback on line-averaged density or divertor radiation
  often modulates the puff waveform during a discharge. In the global particle balance,
  $\Gamma_{\mathrm{puff}}$ is one of the primary external source terms: $dN/dt = \Gamma_{\mathrm{puff}}
  + \Gamma_{n,\mathrm{wall}} - \Gamma_{n,\mathrm{plasma}} - \Gamma_{\mathrm{pump}}$,
  where $N$ is the total particle inventory. See `neutral_pumping_speed` for the exhaust
  counterpart and `neutral_particle_flux_from_wall` for the recycling source.'
