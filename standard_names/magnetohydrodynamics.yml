    enhanced_context:
      description: "Normalised toroidal flux coordinate (\u03C1_tor_norm) at the q=1\
        \ rational surface, marking the radial location of the sawtooth inversion\
        \ surface. Used to characterize the extent of the sawtooth-affected zone and\
        \ validate trigger models."
      kind: llm
- name: normalized_toroidal_flux_coordinate_at_sawtooth_mixing_radius
  kind: scalar
  status: active
  description: Normalized toroidal-flux surface label evaluated at the sawtooth mixing
    radius, marking the outer boundary of the plasma region homogenized during a sawtooth
    crash.
  documentation: 'This quantity is the normalized toroidal magnetic-flux label of
    the magnetic surface passing through the sawtooth mixing radius. It identifies
    the outer boundary of the plasma region homogenized during a sawtooth crash.


    The coordinate is defined by


    $$

    \rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}}) = \left(\frac{\Phi_{\mathrm{tor}}(r_{\mathrm{mix}})
    - \Phi_{\mathrm{tor,axis}}}{\Phi_{\mathrm{tor,boundary}} - \Phi_{\mathrm{tor,axis}}}\right)^{1/2}

    $$


    where $\rho_{\mathrm{tor,norm}}(r_{\mathrm{mix}})$ is the normalized toroidal
    flux coordinate at the mixing radius, $r_{\mathrm{mix}}$ is the sawtooth mixing
    radius, $\Phi_{\mathrm{tor}}(r_{\mathrm{mix}})$ is the toroidal magnetic flux
    enclosed by the mixing surface, $\Phi_{\mathrm{tor,axis}}$ is the toroidal magnetic
    flux at the magnetic axis, and $\Phi_{\mathrm{tor,boundary}}$ is the toroidal
    magnetic flux at the equilibrium boundary.


    The scope is the single magnetic surface at the sawtooth mixing radius within
    the plasma region affected by the crash. This is a locus-specific evaluation of
    the broader [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate),
    not a coordinate assigned to every magnetic surface, a volume average, or a flux-surface
    average. It is distinct from the corresponding coordinate at the [sawtooth inversion
    radius](name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius),
    because the mixing radius and inversion radius represent different sawtooth characteristics.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_sawtooth_inversion_radius
