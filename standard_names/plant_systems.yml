- name: total_power_of_plant_system
  kind: scalar
  status: active
  description: Total real electrical power consumed by all included plant systems,
    obtained by summing their individual electrical loads at the corresponding system
    boundaries.
  documentation: 'Total power of plant systems is the real electrical power consumed
    by the included plant systems, summed over their individual electrical loads.
    It is the aggregate auxiliary load counterpart to [power of a plant system](name:power_of_plant_system),
    rather than thermal, apparent, reactive, or accumulated energy.


    For the selected set of plant systems, the total power is defined as


    $$

    P_\mathrm{total} = \sum_{i=1}^{N} P_i

    $$


    where $P_\mathrm{total}$ is the aggregate plant-system power, $P_i$ is the real
    electrical power consumed by plant system $i$, and $N$ is the number of included
    plant systems.


    The sum represents one-way consumption at each system electrical boundary and
    excludes locally generated or returned real power. It differs from [net power
    of a plant system](name:net_power_of_plant_system), which accounts for generation
    minus consumption at one system boundary, and from [absorbed power of a plant
    system](name:absorbed_power_of_plant_system), which describes an individual system.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_system
  - name:net_power_of_plant_system
  - name:absorbed_power_of_plant_system
  arguments:
  - name: power_of_plant_system
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_electric_plant_operation/power_total
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_electric_plant_operation-power_total
    dd_documentation:
