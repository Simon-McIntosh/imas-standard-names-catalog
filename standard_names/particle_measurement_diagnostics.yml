- name: detector_voltage_of_mass_spectrometer
  kind: scalar
  status: draft
  description: Bias voltage applied to the microchannel-plate or electron-multiplier
    detector of a mass spectrometer, setting the gain of ion detection.
  documentation: 'The detector voltage $V_d$ (in volts) determines the electron multiplication
    gain of the microchannel plate (MCP) or secondary-electron multiplier at the output
    stage of the mass spectrometer. Gain depends exponentially on $V_d$: $G \approx
    G_0 \exp(\alpha V_d)$, where $G_0$ is a reference gain and $\alpha$ is a device-specific
    coefficient (V$^{-1}$). For fusion residual gas analyzers, detector voltages range
    from 800 V to 3000 V; higher values increase sensitivity but accelerate detector
    aging. Monitoring $V_d$ is necessary for interpreting absolute signal levels and
    tracking gain degradation over operational campaigns. See also [mass_spectrometer_collected_ion_current](name:mass_spectrometer_collected_ion_current)
    for the amplified output current and [photomultiplier_voltage_of_mass_spectrometer_channel](name:photomultiplier_voltage_of_mass_spectrometer_channel)
    for an analogous photomultiplier bias.'
  unit: V
  tags:
  - calibrated
  - measured
  - real-time
  links: []
  validity_domain: ''
  constraints: []
- name: deuterium_deuterium_fusion_power_density
  kind: scalar
  status: draft
  description: "Volumetric fusion power released per unit volume from deuterium\u2013\
    deuterium nuclear reactions."
  documentation: "The DD fusion power density $P_{\\mathrm{DD}}$ (in W m$^{-3}$) quantifies\
    \ the local rate of energy release from deuterium\u2013deuterium fusion reactions:\
    \ $P_{\\mathrm{DD}} = n_D^2 \\langle \\sigma v \\rangle_{\\mathrm{DD}}\\, E_{\\\
    mathrm{DD}} / 2$, where $n_D$ is the deuterium density in m$^{-3}$, $\\langle\
    \ \\sigma v \\rangle_{\\mathrm{DD}}$ is the DD fusion reactivity in m$^3$ s$^{-1}$,\
    \ and $E_{\\mathrm{DD}} \\approx 3.65$ MeV is the average energy released per\
    \ DD reaction (combining the two roughly equiprobable branches). The factor of\
    \ 2 accounts for the identical-particle combinatorics. This profile is reconstructed\
    \ from neutron detector measurements using tomographic inversion or forward-model\
    \ fitting of the neutron emissivity together with assumed or measured ion temperature\
    \ and density profiles. In present-day deuterium-only tokamak experiments core\
    \ values reach $10^3$\u2013$10^5$ W m$^{-3}$. See also [deuterium_deuterium_neutron_emissivity](name:deuterium_deuterium_neutron_emissivity)\
    \ for the associated neutron birth rate and [deuterium_tritium_fusion_power_density](name:deuterium_tritium_fusion_power_density)\
    \ for the DT counterpart."
  unit: W.m^-3
  tags:
  - reconstructed
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: deuterium_deuterium_neutron_emissivity
  kind: scalar
  status: draft
  description: "Volumetric neutron emission rate from D\u2013D fusion reactions, representing\
    \ the number of 2.45 MeV neutrons produced per unit volume per unit time."
  documentation: "The DD neutron emissivity $\\varepsilon_{\\mathrm{DD}}(\\mathbf{r})$\
    \ is given by $\\varepsilon_{\\mathrm{DD}} = \\frac{1}{2} n_D^2 \\langle \\sigma\
    \ v \\rangle_{\\mathrm{DD}}$, where $n_D$ is the deuterium ion density in m$^{-3}$\
    \ and $\\langle \\sigma v \\rangle_{\\mathrm{DD}}$ is the DD fusion reactivity\
    \ in m$^3$\xB7s$^{-1}$, averaged over the ion velocity distribution. The factor\
    \ $1/2$ accounts for identical-particle reactions. At core temperatures of 5\u2013\
    15 keV in deuterium plasmas, the emissivity peaks on axis with values of order\
    \ $10^{13}$\u2013$10^{15}$ m$^{-3}$\xB7s$^{-1}$. This profile is reconstructed\
    \ from multi-chord neutron camera measurements via tomographic inversion. The\
    \ companion accuracy metric is [deuterium_deuterium_neutron_emissivity_reconstruction_relative_error](name:deuterium_deuterium_neutron_emissivity_reconstruction_relative_error);\
    \ the related DT emissivity is [deuterium_tritium_neutron_emissivity](name:deuterium_tritium_neutron_emissivity).\
    \ The volume integral yields the total DD neutron rate, related to [deuterium_deuterium_fusion_power_density](name:deuterium_deuterium_fusion_power_density)\
    \ by the energy released per reaction ($Q_{\\mathrm{DD}} \\approx 3.27$ MeV for\
    \ the neutron-producing branch)."
  unit: m^-3.s^-1
  tags:
  - reconstructed
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: deuterium_tritium_fusion_power_density
  kind: scalar
  status: draft
  description: "Volumetric fusion power released per unit volume from deuterium\u2013\
    tritium nuclear reactions."
  documentation: "The DT fusion power density $P_{\\mathrm{DT}}$ (in W m$^{-3}$) gives\
    \ the local energy release rate from deuterium\u2013tritium fusion: $P_{\\mathrm{DT}}\
    \ = n_D\\, n_T\\, \\langle \\sigma v \\rangle_{\\mathrm{DT}}\\, E_{\\mathrm{DT}}$,\
    \ where $n_D$ and $n_T$ are the deuterium and tritium densities in m$^{-3}$, $\\\
    langle \\sigma v \\rangle_{\\mathrm{DT}}$ is the DT fusion reactivity in m$^3$\
    \ s$^{-1}$, and $E_{\\mathrm{DT}} = 17.6$ MeV is the total energy released per\
    \ DT reaction (14.1 MeV neutron + 3.5 MeV alpha). This profile is inferred from\
    \ 14.1 MeV neutron measurements via tomographic reconstruction or forward-model\
    \ fitting. Core values in DT experiments such as JET-DTE2 reached $10^5$\u2013\
    $10^6$ W m$^{-3}$; ITER burning-plasma conditions target $\\sim 10^6$ W m$^{-3}$.\
    \ See also [deuterium_tritium_neutron_emissivity](name:deuterium_tritium_neutron_emissivity)\
    \ for the neutron birth rate profile and [deuterium_deuterium_fusion_power_density](name:deuterium_deuterium_fusion_power_density)\
    \ for the DD counterpart."
  unit: W.m^-3
  tags:
  - reconstructed
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: deuterium_tritium_neutron_emissivity
  kind: scalar
  status: draft
  description: "Volumetric neutron birth rate from deuterium\u2013tritium fusion reactions\
    \ per unit plasma volume."
  documentation: 'The DT neutron emissivity $\varepsilon_{\mathrm{DT}}$ (in m$^{-3}$
    s$^{-1}$) is the local rate of 14.1 MeV neutron production: $\varepsilon_{\mathrm{DT}}
    = n_D\, n_T\, \langle \sigma v \rangle_{\mathrm{DT}}$, where $n_D$ and $n_T$ are
    the deuterium and tritium densities in m$^{-3}$ and $\langle \sigma v \rangle_{\mathrm{DT}}$
    is the velocity-averaged DT fusion cross section in m$^3$ s$^{-1}$. This profile
    is reconstructed from collimated neutron camera line-integrated count rates using
    tomographic inversion techniques. The emissivity is directly proportional to the
    [deuterium_tritium_fusion_power_density](name:deuterium_tritium_fusion_power_density)
    via the energy per reaction $E_{\mathrm{DT}} = 17.6$ MeV. In JET DT campaigns,
    peak core emissivities reached $\sim 10^{17}$ m$^{-3}$ s$^{-1}$. See also [deuterium_deuterium_neutron_emissivity](name:deuterium_deuterium_neutron_emissivity)
    for the DD channel and [deuterium_tritium_fuel_ratio](name:deuterium_tritium_fuel_ratio)
    for the $n_T / n_D$ ratio.'
  unit: m^-3.s^-1
  tags:
  - reconstructed
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: filament_emission_current_of_mass_spectrometer
  kind: scalar
  status: draft
  description: Electron emission current from the ionizing filament of a mass spectrometer,
    controlling the ionization rate of sampled gas molecules.
  documentation: 'In a mass spectrometer, neutral gas molecules entering the ion source
    are ionized by thermionic electrons emitted from a heated filament. The filament
    emission current $I_e$ (in amperes) directly scales the ionization probability
    and hence the instrument sensitivity: $S \propto I_e \sigma_i$, where $\sigma_i$
    is the electron-impact ionization cross section (m$^2$). Values range from 0.1
    to 5 mA for residual gas analyzers used in fusion vacuum systems. Maintaining
    a stable emission current is critical for quantitative partial-pressure measurements;
    feedback control loops regulate the filament heating power to hold $I_e$ constant.
    See also [mass_spectrometer_collected_ion_current](name:mass_spectrometer_collected_ion_current)
    for the downstream signal and [partial_pressure_of_gas_species](name:partial_pressure_of_gas_species)
    for the calibrated output.'
  unit: A
  tags:
  - calibrated
  - measured
  - real-time
  links: []
  validity_domain: ''
  constraints: []
- name: floating_potential_of_langmuir_probe
  kind: scalar
  status: draft
  description: Electric potential at which a Langmuir probe draws zero net current
    from the surrounding plasma.
  documentation: "The floating potential $V_f$ is the potential self-consistently\
    \ adopted by an electrically isolated conductor immersed in a plasma, such that\
    \ the electron and ion currents to its surface balance exactly. It is related\
    \ to the plasma potential $V_p$ and electron temperature $T_e$ (in eV) by $V_f\
    \ = V_p - \\alpha\\, T_e$, where $\\alpha \\approx 2.8$\u2013$3.0$ for a hydrogen\
    \ plasma with Maxwellian electrons and depends on the ion mass and probe geometry.\
    \ Langmuir probes measure $V_f$ directly as an open-circuit voltage; values in\
    \ tokamak scrape-off layers range from $-200$ V to $+50$ V depending on the local\
    \ sheath conditions and plasma parameters. Combined with current\u2013voltage\
    \ (I\u2013V) characteristic sweeps, $V_f$ serves as a starting point for extracting\
    \ $T_e$ and the plasma potential. See also [collector_surface_area_of_langmuir_probe](name:collector_surface_area_of_langmuir_probe)\
    \ for probe geometry."
  unit: V
  tags:
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: fusion_power
  kind: scalar
  status: draft
  description: Total thermonuclear fusion power released in the plasma, summing all
    fusion reaction channels.
  documentation: "The fusion power $P_\\mathrm{fus}$ is the volume-integrated rate\
    \ of energy release from nuclear reactions, predominantly D\u2013D and D\u2013\
    T: $P_\\mathrm{fus} = \\int n_1 n_2 \\langle \\sigma v \\rangle Q_\\mathrm{fus}\
    \ \\, dV$, where $n_1, n_2$ are the reactant densities (m$^{-3}$), $\\langle \\\
    sigma v \\rangle$ the Maxwellian-averaged reactivity (m$^3$s$^{-1}$), and $Q_\\\
    mathrm{fus}$ the energy released per reaction (17.6 MeV for D\u2013T, 3.27/4.03\
    \ MeV for D\u2013D branches). Inferred experimentally from calibrated neutron\
    \ detectors (fission chambers, activation foils, diamond detectors) via neutron-rate-to-power\
    \ conversion factors. ITER targets $P_\\mathrm{fus} \\approx 500$ MW (Q = 10);\
    \ present devices achieve $\\sim$10 MW (JET D\u2013T record $\\approx$ 59 MJ total).\
    \ See also [deuterium_tritium_fusion_power_density](name:deuterium_tritium_fusion_power_density),\
    \ [deuterium_deuterium_fusion_power_density](name:deuterium_deuterium_fusion_power_density),\
    \ and [neutron_flux_total](name:neutron_flux_total)."
  unit: W
  tags:
  - energy-balance
  - global-quantity
  - performance-metric
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_floating_potential_of_langmuir_probe
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty on the Langmuir-probe floating
    potential measurement.
  documentation: "This field provides the negative error bar for the floating potential\
    \ $V_f$ measured by a Langmuir probe, representing the downward deviation from\
    \ the nominal value. The floating potential is defined as the bias at which net\
    \ current to the probe vanishes, $I(V_f) = 0$, and its uncertainty arises from\
    \ noise, sheath effects, and finite sampling. Combined with [upper_uncertainty_of_floating_potential_of_langmuir_probe](name:upper_uncertainty_of_floating_potential_of_langmuir_probe),\
    \ the full asymmetric confidence interval is recovered. In scrape-off-layer plasmas,\
    \ $V_f$ ranges from $-200$ V to $+50$ V depending on electron temperature and\
    \ secondary emission; uncertainties are often 1\u201310 V. The floating potential\
    \ relates to electron temperature and plasma potential via $V_f \\approx V_p -\
    \ \\alpha\\, k_B T_e / e$, where $\\alpha \\approx 2$\u20133 depends on ion mass\
    \ and sheath geometry."
  unit: V
  tags:
  - local-measurement
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: lower_uncertainty_of_fusion_power
  kind: scalar
  status: draft
  description: Lower bound of the asymmetric uncertainty interval on the total fusion
    power measurement.
  documentation: "This quantity gives the negative-side (lower) error bar on the reconstructed\
    \ [fusion_power](name:fusion_power), such that the true value is expected to lie\
    \ above $P_\\mathrm{fus} - \\Delta P^{-}$ at the stated confidence level (convention-dependent).\
    \ Sources of uncertainty include neutron detector efficiency calibration, counting\
    \ statistics, background subtraction, and the neutron-rate-to-power conversion\
    \ model. For present-day diagnostics the relative uncertainty is of order 5\u2013\
    15%. Paired with [upper_uncertainty_of_fusion_power](name:upper_uncertainty_of_fusion_power)\
    \ to define the full asymmetric error band."
  unit: W
  tags:
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: mass_spectrometer_collected_ion_current
  kind: scalar
  status: draft
  description: Ion current collected by the detector of a mass spectrometer after
    mass-to-charge separation.
  documentation: "The collected ion current $I$ (in amperes) is the electrical signal\
    \ measured at the detector (Faraday cup or secondary-electron multiplier) of a\
    \ mass spectrometer configured for residual gas analysis or fuel-composition monitoring.\
    \ After ionization in the spectrometer source and mass-to-charge ($m/z$) selection\
    \ by the analyzer (quadrupole, magnetic sector, or time-of-flight), the surviving\
    \ ions produce a current proportional to the partial pressure of the corresponding\
    \ gas species. Calibration against known gas mixtures converts $I$ into partial\
    \ pressures via sensitivity factors. In tokamak sub-divertor and pumping-duct\
    \ environments, collected currents span $10^{-14}$\u2013$10^{-8}$ A depending\
    \ on the gas species concentration and spectrometer gain settings. See also [partial_pressure_of_gas_species](name:partial_pressure_of_gas_species)\
    \ for the calibrated output and [detector_voltage_of_mass_spectrometer](name:detector_voltage_of_mass_spectrometer)\
    \ for the detector bias."
  unit: A
  tags:
  - local-measurement
  - raw-data
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_detector_energy_band_lower_bound
  kind: scalar
  status: draft
  description: Lower energy threshold defining the acceptance window of a neutron
    detector energy band.
  documentation: The lower bound $E_{\mathrm{low}}$ (in eV) specifies the minimum
    neutron energy accepted by a given energy band of the detector. Together with
    the [neutron_detector_energy_band_upper_bound](name:neutron_detector_energy_band_upper_bound),
    it defines the spectral window over which detected events are accumulated or for
    which the detector response function is valid. For DD-neutron diagnostics the
    band is centered near 2.45 MeV ($2.45 \times 10^{6}$ eV), while DT diagnostics
    target 14.1 MeV; thermal-neutron channels may set $E_{\mathrm{low}}$ as low as
    $\sim 0.025$ eV. This threshold is used in conjunction with the [neutron_source_energy_grid](name:neutron_source_energy_grid)
    and the [neutron_detector_detection_efficiency](name:neutron_detector_detection_efficiency)
    to convert raw count spectra into physical neutron rates. See also [neutron_flux_green_function_of_detector](name:neutron_flux_green_function_of_detector).
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_flux_total
  kind: scalar
  status: draft
  description: Total neutron emission rate from the plasma, integrated over all energies
    and the full plasma volume.
  documentation: "The total neutron flux $\\Phi_n$ (in s$^{-1}$) represents the rate\
    \ at which neutrons are emitted from all fusion reactions occurring throughout\
    \ the plasma volume. For a deuterium\u2013deuterium (DD) plasma, $\\Phi_n^{\\\
    mathrm{DD}} = \\int n_D^2 \\langle \\sigma v \\rangle_{\\mathrm{DD}} / 2 \\, dV$,\
    \ where $n_D$ is the deuterium ion density (m$^{-3}$), $\\langle \\sigma v \\\
    rangle_{\\mathrm{DD}}$ is the DD fusion reactivity (m$^{3}$\xB7s$^{-1}$), and\
    \ $V$ is the plasma volume; an analogous relation holds for deuterium\u2013tritium\
    \ (DT) reactions. This quantity is reconstructed from individual detector count\
    \ rates corrected for detection efficiency, solid-angle coverage, and energy-band\
    \ response using Green's-function inversion methods. In present-day tokamaks,\
    \ values range from $\\sim 10^{12}$ s$^{-1}$ (ohmic DD plasmas) to $\\sim 10^{18}$\
    \ s$^{-1}$ (high-performance DT discharges such as JET DTE2). It is a primary\
    \ figure of merit for fusion performance and directly proportional to the [fusion_power](name:fusion_power).\
    \ See also [deuterium_deuterium_neutron_emissivity](name:deuterium_deuterium_neutron_emissivity)\
    \ and [neutron_flux_green_function_of_detector](name:neutron_flux_green_function_of_detector)."
  unit: s^-1
  cocos_transformation_type: one_like
  tags:
  - global-quantity
  - performance-metric
  - reconstructed
  links: []
  validity_domain: ''
  constraints: []
- name: neutron_source_energy_grid
  kind: scalar
  status: draft
  description: Discrete array of neutron energy bin values used to tabulate source
    spectra and detector response functions.
  documentation: "The neutron source energy grid $\\{E_i\\}$ (in eV) defines the set\
    \ of energy nodes at which the source neutron spectrum and the detector Green's\
    \ functions are discretized. Each element $E_i$ represents either a bin center\
    \ or a bin boundary, depending on the convention adopted by the diagnostic processing\
    \ chain. The grid must span the relevant fusion neutron energies: around 2.45\
    \ MeV for DD reactions and 14.1 MeV for DT reactions, with sufficient resolution\
    \ to capture Doppler broadening (full width at half maximum of order 100\u2013\
    200 keV for DT at $T_i \\sim 10$ keV). The [neutron_flux_green_function_of_detector](name:neutron_flux_green_function_of_detector)\
    \ and [neutron_detector_response_function](name:neutron_detector_response_function)\
    \ are tabulated on this grid, and the [neutron_detector_energy_band_lower_bound](name:neutron_detector_energy_band_lower_bound)\
    \ and [neutron_detector_energy_band_upper_bound](name:neutron_detector_energy_band_upper_bound)\
    \ must be consistent with the grid extent."
  unit: eV
  cocos_transformation_type: one_like
  tags:
  - calibrated
  links: []
  validity_domain: ''
  constraints: []
- name: partial_pressure_of_gas_species
  kind: scalar
  status: draft
  description: Calibrated partial pressure exerted by a single gas species in the
    vacuum vessel or diagnostic volume, measured by a mass spectrometer.
  documentation: "The partial pressure $p_i$ of gas species $i$ is the contribution\
    \ of that species to the total gas pressure, satisfying Dalton's law $p_{\\mathrm{tot}}\
    \ = \\sum_i p_i$. It is obtained from the mass-spectrometer ion current for the\
    \ species' characteristic mass-to-charge ratio, converted via a species-dependent\
    \ calibration factor (sensitivity) in Pa\xB7A$^{-1}$. In tokamak vacuum systems,\
    \ dominant species include D$_2$, H$_2$, He, N$_2$, H$_2$O, and various hydrocarbons;\
    \ partial pressures range from $10^{-8}$ Pa (ultra-high vacuum baseline) to $10^{-1}$\
    \ Pa during gas puffing or disruption events. Monitoring partial pressures is\
    \ essential for fuel-mix control, wall-conditioning assessment, and impurity identification.\
    \ See [mass_spectrometer_collected_ion_current](name:mass_spectrometer_collected_ion_current)\
    \ for the raw detector signal and [detector_voltage_of_mass_spectrometer](name:detector_voltage_of_mass_spectrometer)\
    \ for the detector operating point."
  unit: Pa
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: photomultiplier_voltage_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Bias voltage applied to the photomultiplier (or secondary-electron
    multiplier) of a mass spectrometer channel.
  documentation: "This quantity records the high-voltage bias $V_{\\mathrm{PMT}}$\
    \ (in volts) applied to the electron-multiplier or photomultiplier detector of\
    \ a mass spectrometer measurement channel. The multiplier gain $G$ depends exponentially\
    \ on the applied voltage, $G \\propto V_{\\mathrm{PMT}}^{\\,\\alpha N}$, where\
    \ $\\alpha$ is the secondary-emission coefficient per dynode stage and $N$ is\
    \ the number of stages. Adjusting $V_{\\mathrm{PMT}}$ therefore directly controls\
    \ the signal-to-noise ratio and the dynamic range of the [mass_spectrometer_collected_ion_current](name:mass_spectrometer_collected_ion_current).\
    \ Operating voltages for channeltron-type multipliers in fusion residual gas analyzers\
    \ are in the range 1000\u20133000 V. See also [detector_voltage_of_mass_spectrometer](name:detector_voltage_of_mass_spectrometer)\
    \ for the microchannel-plate detector bias."
  unit: V
  tags:
  - calibrated
  - raw-data
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_langmuir_probe_reciprocating_position
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of the reciprocating Langmuir probe measurement
    position in the machine coordinate system.
  documentation: This scalar gives the toroidal angle $\phi$ (in radians) at which
    a reciprocating Langmuir probe samples the plasma, expressed in the tokamak's
    cylindrical coordinate system $(R, Z, \phi)$. Reciprocating probes are plunged
    radially into the scrape-off layer on a fast timescale ($\sim$100 ms) to measure
    local electron temperature $T_e$, density $n_e$, and floating potential $V_f$
    at a well-defined spatial location. The toroidal angle, together with the major-radius
    and vertical coordinates, fully specifies the three-dimensional position of the
    probe tip during each plunge. Values span $[0, 2\pi)$ rad. See also [collector_surface_area_of_langmuir_probe](name:collector_surface_area_of_langmuir_probe)
    for the effective collection area of the probe tip.
  unit: rad
  tags:
  - cylindrical-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_angle_of_neutron_detector_emission_grid_point
  kind: scalar
  status: draft
  description: Toroidal angle $\phi$ of a point on the emission grid used to model
    the field of view of a neutron detector.
  documentation: The toroidal angle $\phi$ (in rad) specifies the azimuthal position
    of each node in the three-dimensional emission grid that discretizes the field
    of view of a neutron detector. The emission grid enables line-integrated or volumetric
    modeling of neutron emissivity contributions from different toroidal locations,
    which is essential for interpreting neutron camera and collimated detector measurements.
    In axisymmetric devices the toroidal coordinate distinguishes detector lines of
    sight that are not purely in the poloidal plane; for non-axisymmetric configurations
    (stellarators, RMP fields) the $\phi$ variation captures genuine toroidal asymmetries
    in the neutron source. Values span $[0, 2\pi)$ rad. See also [deuterium_deuterium_neutron_emissivity](name:deuterium_deuterium_neutron_emissivity)
    for the quantity sampled on this grid.
  unit: rad
  tags:
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_floating_potential_of_langmuir_probe
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty on the floating potential
    measured by a Langmuir probe.
  documentation: "This quantity represents the positive (upper) error bar on the [floating_potential_of_langmuir_probe](name:floating_potential_of_langmuir_probe).\
    \ The uncertainty arises from noise in the measured open-circuit voltage, fluctuations\
    \ in the local plasma conditions during the measurement window, and systematic\
    \ effects such as surface contamination or sheath rectification. In practice the\
    \ upper uncertainty is estimated from the scatter of repeated floating-potential\
    \ samples within a single acquisition window or from the goodness-of-fit when\
    \ $V_f$ is extracted from an I\u2013V sweep. Values in the range 0.5\u201310 V\
    \ are common in tokamak scrape-off layer Langmuir probe measurements."
  unit: V
  tags:
  - local-measurement
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
- name: upper_uncertainty_of_fusion_power
  kind: scalar
  status: draft
  description: Upper bound of the asymmetric uncertainty interval on the total fusion
    power measurement.
  documentation: "This quantity gives the positive-side (upper) error bar on the reconstructed\
    \ [fusion_power](name:fusion_power), such that the true value is expected to lie\
    \ below $P_\\mathrm{fus} + \\Delta P^{+}$ at the stated confidence level (convention-dependent).\
    \ The uncertainty arises from neutron detector calibration errors, counting statistics,\
    \ and modeling assumptions in the neutron-rate-to-power conversion. For present-day\
    \ neutron diagnostics the relative uncertainty is of order 5\u201315%, yielding\
    \ $\\Delta P^{+} \\sim 0.5$\u2013$2$ MW at JET-scale fusion powers. Paired with\
    \ [lower_uncertainty_of_fusion_power](name:lower_uncertainty_of_fusion_power)\
    \ to define the full asymmetric error band."
  unit: W
  tags:
  - global-quantity
  - uncertainty-quantification
  links: []
  validity_domain: ''
  constraints: []
