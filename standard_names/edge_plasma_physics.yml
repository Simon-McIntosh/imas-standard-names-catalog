- name: flux_surface_averaged_xenon_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged number density of xenon ions at the plasma boundary
    (last closed flux surface), summed over all ionization stages.
  documentation: "The flux-surface-averaged xenon density at the plasma boundary is\
    \ the poloidal flux-surface average of the local xenon ion number density evaluated\
    \ on the last closed flux surface (separatrix), summed over all ionization stages\
    \ from Xe$^{1+}$ through fully stripped Xe$^{54+}$ \u2014 the same charge-state\
    \ aggregation used by [xenon_density_at_plasma_boundary](name:flux_surface_averaged_xenon_density_at_plasma_boundary).\
    \ The flux-surface average removes the poloidal dependence and yields a single\
    \ scalar characterizing xenon impurity content at the separatrix.\n\nThe flux-surface\
    \ average on the separatrix is defined as:\n\n$$\n\\langle n_\\mathrm{Xe} \\rangle_\\\
    mathrm{sep} = \\frac{\\oint n_\\mathrm{Xe} \\, dl / |\\nabla \\psi|}{\\oint dl\
    \ / |\\nabla \\psi|}\n$$\n\nwhere $n_\\mathrm{Xe}$ is the local xenon number density\
    \ summed over all ionization states, $dl$ is the poloidal arc length element,\
    \ and $\\nabla \\psi$ is the poloidal magnetic flux gradient evaluated at the\
    \ separatrix.\n\nXenon is a heavy noble-gas impurity injected in tokamak experiments\
    \ to promote edge radiative power loss and to facilitate divertor detachment.\
    \ This separatrix-averaged density reflects the balance of impurity injection,\
    \ cross-field transport, and recycling near the plasma boundary, and is inferred\
    \ from edge spectroscopic measurements of xenon emission lines combined with impurity\
    \ transport modeling. In seeded or detached regimes the separatrix value lies\
    \ in the range $10^{14}$\u2013$10^{16}$ m$^{-3}$, depending on seeding rate and\
    \ plasma configuration. Analogous quantities for lighter impurities include [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary)\
    \ and [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary).\n\
    \nSign convention: Positive when xenon ions are present at the plasma boundary."
  unit: m^-3
  physics_domain: edge_plasma_physics
