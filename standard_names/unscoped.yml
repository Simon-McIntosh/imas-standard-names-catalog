- name: intensity_at_spectral_line
  kind: scalar
  status: active
  description: Uncalibrated photoelectron detection rate obtained by integrating the
    measured emission signal across an identified spectral line.
  documentation: 'This quantity is the uncalibrated photoelectron count rate associated
    with one identified emission line. It represents the detector signal integrated
    across the wavelength interval assigned to that line, rather than an absolutely
    calibrated photon radiance.


    The line-integrated count rate is defined by


    $$

    I_{\rm line} = \int_{\lambda_1}^{\lambda_2} i(\lambda)\,d\lambda

    $$


    where $I_{\rm line}$ is the integrated photoelectron count rate, $i(\lambda)$
    is the spectral photoelectron count-rate density, $\lambda$ is wavelength, and
    $\lambda_1$ and $\lambda_2$ delimit the interval assigned to the identified emission
    line.


    The quantity applies to a single identified spectral line and uses line integration
    as its aggregation convention. It is non-calibrated and is not background-subtracted;
    no aggregation over multiple spectral lines or conversion to absolute photon radiance
    is included.


    It is the uncalibrated line-integrated counterpart of [photon-count radiance at
    a spectral line](name:photon_radiance_at_spectral_line), which additionally represents
    an absolutely calibrated radiance and includes background subtraction. Unlike
    [spectral flux of a spectrometer channel](name:spectral_flux_of_spectrometer_channel),
    this quantity is resolved at one identified line rather than describing the channel-level
    spectral signal.'
  unit: s^-1
  links:
  - name:photon_radiance_at_spectral_line
  - name:spectral_flux_of_spectrometer_channel
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/grating_spectrometer/processed_line/intensity
    version: 4.1.0
- name: ipb98y2_confinement_time
  kind: scalar
  status: active
  description: IPB98(y,2) empirical-scaling reference for global energy confinement
    time, providing the denominator for the H98 confinement enhancement factor.
  documentation: 'The IPB98(y,2) energy confinement time is the global energy-confinement
    timescale predicted by the IPB98(y,2) empirical scaling law. It is an energy-channel
    performance benchmark rather than a species-resolved or local transport time.


    The underlying global energy confinement time is defined by


    $$

    \tau_E = \frac{W}{P_{\mathrm{loss}}}

    $$


    where $\tau_E$ is the global energy confinement time, $W$ is the total thermal
    energy stored in the plasma, and $P_{\mathrm{loss}}$ is the net power leaving
    the plasma. The quantity documented here is the IPB98(y,2) scaling prediction
    of this timescale, not the directly evaluated confinement time for a particular
    plasma state.


    The value applies to the complete plasma energy content and its global loss balance;
    it is not a local profile quantity, a particle confinement time, or a confinement
    time assigned to an individual species. It is a single empirical reference value
    for the energy channel.


    The [energy confinement enhancement factor](name:energy_confinement_enhancement_factor)
    compares the actual global energy confinement time with this reference through
    $H_{98} = \tau_E / \tau_{E,98}$, where $H_{98}$ is the dimensionless confinement
    enhancement factor and $\tau_{E,98}$ is this IPB98(y,2) scaling prediction.'
  unit: s
  links:
  - name:energy_confinement_enhancement_factor
  sources:
  - kind: imas-dd
    ref: summary/global_quantities/tau_energy_98/value
    version: 4.1.0
- name: radiative_temperature_at_ece_channel
  kind: scalar
  status: active
  description: Equivalent blackbody temperature of electron cyclotron emission intensity
    detected by a frequency-selective ECE channel, representing the radiation brightness
    temperature.
  documentation: 'Radiative temperature at an ECE channel is the equivalent blackbody
    temperature associated with the detected electron cyclotron emission intensity
    at that channel''s selected frequency. It is a brightness-temperature representation
    of the radiation, not the kinetic temperature of the electron population.


    For specific intensity represented by a blackbody spectrum, the radiation temperature
    $T_{\mathrm{rad}}$ is defined by


    $$

    I_\nu = \frac{2h\nu^3}{c^2}\left[\exp\left(\frac{h\nu}{T_{\mathrm{rad}}}\right)-1\right]^{-1}

    $$


    where $I_\nu$ is the detected specific intensity at frequency $\nu$, $h$ is Planck''s
    constant, $c$ is the speed of light, and $T_{\mathrm{rad}}$ is the energy-equivalent
    blackbody temperature.


    The quantity applies to one ECE channel and its selected frequency; it is not
    summed or averaged over channels. It excludes the separate kinetic electron temperature
    and polarization-resolved radiation quantities. When the emitting plasma is optically
    thick, $T_{\mathrm{rad}}$ approaches the local electron temperature. The [radiative
    temperature at the magnetic axis](name:radiative_temperature_at_magnetic_axis)
    uses the same brightness-temperature definition at a different evaluation locus.'
  unit: eV
  links:
  - name:radiative_temperature_at_magnetic_axis
  sources:
  - kind: imas-dd
    ref: ece/channel/t_radiation
    version: 4.1.0
- name: voltage_of_ion_cyclotron_heating_antenna_amplitude
  kind: scalar
  status: active
  description: Peak magnitude of the radio-frequency voltage signal on one transmission-line
    feed of an ion-cyclotron-heating antenna module, used in feed power and reflection
    analysis.
  documentation: 'This quantity is the peak radio-frequency voltage amplitude associated
    with one transmission-line feed serving one ion-cyclotron-heating antenna module.
    It represents the magnitude of the oscillating feed voltage rather than its instantaneous
    signed value or phase.


    For a voltage waveform, the peak amplitude is defined by


    $$

    V_{\mathrm{amp}} = \max_t |V(t)|

    $$


    where $V_{\mathrm{amp}}$ is the peak voltage amplitude, $V(t)$ is the instantaneous
    signed voltage between the ordered feed terminals, and $t$ is time.


    The quantity applies to a single transmission-line feed of a single antenna module.
    It is not a module-averaged or antenna-system-aggregated voltage, and it excludes
    the instantaneous waveform and phase information represented by the underlying
    [voltage of the ion-cyclotron-heating antenna](name:voltage_of_ion_cyclotron_heating_antenna).


    The amplitude is the magnitude transformation of that parent voltage quantity:
    the parent defines the terminal potential difference, while this quantity retains
    its peak magnitude for radio-frequency power and reflection analysis. It is distinct
    from reflected power, which characterizes returned wave energy rather than feed
    voltage.'
  unit: V
  links: []
  sources:
  - kind: imas-dd
    ref: ic_antennas/antenna/module/voltage/amplitude
    version: 4.1.0
