name: tendency_of_toroidal_flux_coordinate
status: draft
cocos_transformation_type: one_like
description: Partial time derivative of the toroidal flux coordinate $\rho_{\text{tor}}$,
  quantifying the temporal evolution of the radial coordinate grid.
documentation: "This quantity is $\\partial \\rho_{\\text{tor}} / \\partial t$, where\
  \ $\\rho_{\\text{tor}} = \\sqrt{\\Phi_{\\text{tor}} / (\\pi B_0)}$ (m) is the toroidal\
  \ flux coordinate derived from the toroidal magnetic flux $\\Phi_{\\text{tor}}$\
  \ (Wb) enclosed by a flux surface and a reference field $B_0$ (T). Because the magnetic\
  \ equilibrium evolves in time \u2014 due to current diffusion, heating, and external\
  \ actuator changes \u2014 the flux-surface geometry and hence the coordinate itself\
  \ are time-dependent. The tendency $\\partial \\rho_{\\text{tor}} / \\partial t$\
  \ (m s$^{-1}$) captures this coordinate-frame motion and is essential for transforming\
  \ transport equations from the moving $\\rho_{\\text{tor}}$ frame to the laboratory\
  \ frame, ensuring correct evaluation of convective derivatives. In slowly evolving\
  \ H-mode plasmas, $|\\partial \\rho_{\\text{tor}} / \\partial t|$ is typically small\
  \ ($\\lesssim 0.01$ m s$^{-1}$) but can become significant during fast transients\
  \ such as L\u2013H transitions, sawtooth crashes, or disruption precursors. This\
  \ quantity is computed internally by transport solvers as part of the metric-coefficient\
  \ update cycle."
