    status: composed
  - id: dd:plasma_profiles/ggd/electrons/velocity/radial
    dd_path: plasma_profiles/ggd/electrons/velocity/radial
    status: composed
- name: radial_ion_damping_rate
  kind: scalar
  status: draft
  description: Damping rate for the radial component of summed ion momentum flow,
    quantifying the exponential decay of radial ion flow due to neoclassical collisional
    dissipation.
  documentation: "The radial ion damping rate $\nu_{r}$ quantifies the exponential\
    \ decay constant $\nu_{r} = \\Gamma_r / \\langle p_i \\rangle$ for the radial\
    \ component of the summed thermal ion momentum, where $\nu_{r}$ is in s$^{-1}$,\
    \ $\\Gamma_r$ is the radial momentum flux density, and $\\langle p_i \\rangle$\
    \ is the volume-averaged ion pressure. The radial component governs the rate at\
    \ which radial ion flow (e.g., poloidal rotation-driven radial transport in the\
    \ Pfirsch\u2013Schl\xFCter regime) is damped by ion\u2013ion collisions and neoclassical\
    \ viscous forces. Typical values in the edge of an H-mode tokamak range from 10$^3$\
    \ to 10$^5$ s$^{-1}$, increasing with collisionality. The full damping-rate vector\
    \ is provided by [ion_damping_rate](name:ion_damping_rate); related components\
    \ include [parallel_ion_damping_rate](name:parallel_ion_damping_rate) and [toroidal_ion_damping_rate](name:toroidal_ion_damping_rate).\
    \ Measurement relies on neoclassical transport codes that solve the drift-kinetic\
    \ equation, validated against rotation profile data from charge exchange recombination\
    \ spectroscopy.\n\nSign convention: Positive when the damping force opposes the\
    \ direction of the radial ion flow.\n\nThe quantity is derived from [ion_damping_rate](name:ion_damping_rate),\
    \ where the radial component isolates the damping of radial momentum independent\
    \ of the toroidal and poloidal channels. While the parent vector includes all\
    \ three spatial directions, this scalar component is directly comparable to the\
    \ radial damping rate for charge-state-resolved ion populations via [radial_ion_state_damping_rate](name:radial_ion_state_damping_rate)."
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_damping_rate
  - name:parallel_ion_damping_rate
  - name:toroidal_ion_damping_rate
  - name:radial_ion_state_damping_rate
  arguments:
  - name: ion_damping_rate
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/radial/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/momentum/radial/flow_damping_rate
    status: composed
  - id: dd:plasma_transport/model/profiles_1d/ion/momentum/radial/flow_damping_rate
    dd_path: plasma_transport/model/profiles_1d/ion/momentum/radial/flow_damping_rate
    status: composed
- name: radial_ion_energy_flux_at_flux_surface
  kind: scalar
  status: draft
  description: Radial component of the ion energy flux density across a specified
    flux surface, combining conductive and convective contributions to the net outward
    energy transport.
  documentation: "The radial ion energy flux $Q_i(r)$ quantifies the net outward flow\
    \ of ion internal (thermal and kinetic) energy per unit area perpendicular to\
    \ the flux surface at radial coordinate $r$, where $r$ is the minor radius. It\
    \ encompasses both diffusive transport (driven by gradients in ion temperature,\
    \ density, and rotation) and convective advection (from radial particle transport\
    \ and geodesic curvature effects). This flux is the primary sink term in the steady-state\
    \ ion energy balance equation: $\\frac{\\partial}{\\partial V}\\left(V \\langle\
    \ \\mathbf{\\Gamma}_i \\rangle \\cdot \\nabla r\\right) = \\langle S_i \\rangle$,\
    \ where $\\langle \\mathbf{\\Gamma}_i \\rangle$ is this flux surface\u2013averaged\
    \ energy flux density and $\\langle S_i \\rangle$ is the net volumetric heating\
    \ power density. Typical values range from $10^4$ to $10^6\\,\\text{W}/\\text{m}^2$\
    \ in the core of H-mode tokamaks, dropping sharply across the pedestal. This flux\
    \ is inferred from transport analysis codes constrained by measured temperature\
    \ and density profiles (via Thomson scattering, charge-exchange recombination\
    \ spectroscopy, and neutron diagnostics). For the corresponding quantity summed\
    \ over all ions, see [radial_total_ion_energy_flux](name:radial_total_ion_energy_flux);\
    \ for a single charge state, see [radial_ion_state_energy_flux](name:radial_ion_state_energy_flux)."
  unit: W.m^-2
  physics_domain: transport
  links:
  - name:radial_total_ion_energy_flux
  - name:radial_ion_state_energy_flux
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/energy/flux
    dd_path: core_transport/model/profiles_1d/ion/state/energy/flux
    status: composed
- name: radial_ion_momentum_flux
  kind: scalar
  status: draft
  description: Radial component of the momentum flux density tensor for thermal ions
    in the edge plasma, quantifying cross-field ion momentum transport perpendicular
    to flux surfaces.
  documentation: "The radial component $\\Pi_{i,r} = \\mathbf{\\Pi}_i \\cdot \\hat{r}$\
    \ of the ion momentum flux density tensor $\\mathbf{\\Pi}_i$ describes the rate\
    \ at which thermal ion momentum is transported radially across magnetic flux surfaces.\
    \ This quantity includes both convective contributions ($m_i n_i v_{i,r} \\mathbf{v}_i$)\
    \ and the radial projection of the viscous stress tensor. In tokamak edge plasmas,\
    \ $\\Pi_{i,r}$ is typically negative (directed radially inward) and peaks in the\
    \ steep-gradient region, with magnitudes of order 0.1\u201310 Pa depending on\
    \ the neutral-beam torque input and ion collisionality. It is inferred from ion\
    \ pressure and rotation profiles measured by charge-exchange recombination spectroscopy,\
    \ combined with neoclassical transport calculations. The radial component is a\
    \ key term in the radial force balance and toroidal momentum transport equations.\
    \ For the full vector quantity see [ion_momentum_flux](name:ion_momentum_flux);\
    \ compare with the neutral counterpart [radial_neutral_momentum_flux](name:radial_neutral_momentum_flux)\
    \ and the energy transport analog [radial_ion_energy_flux](name:radial_ion_energy_flux).\n\
    \nSign convention: Positive when the momentum flux is directed radially outward\
    \ (increasing major radius $R$).\n\nTypical measurements from CXRS and equilibrium\
    \ reconstruction yield $\\Pi_{i,r}$ values of order 0.1\u201310 Pa in the edge\
    \ pedestal region of H-mode plasmas, with the sign and magnitude set by the balance\
    \ of neutral-beam torque and collisional damping."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_momentum_flux
  - name:radial_neutral_momentum_flux
  - name:radial_ion_energy_flux
  arguments:
  - name: ion_momentum_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/momentum/flux_radial/values
    dd_path: edge_transport/model/ggd/ion/momentum/flux_radial/values
    status: composed
  - id: dd:plasma_transport/model/ggd/ion/momentum/flux/radial
    dd_path: plasma_transport/model/ggd/ion/momentum/flux/radial
    status: composed
- name: radial_ion_particle_flux
  kind: scalar
  status: draft
  description: Radial component of the ion particle flux density projected onto the
    geometric radial direction.
  documentation: "The radial ion particle flux $\bm{\\Gamma}_{i} \\cdot \\hat{R}$\
    \ describes the net outward transport of thermal ions across a flux surface. In\
    \ the 1D transport formalism, it is decomposed into diffusive and convective contributions\
    \ as $\bm{\\Gamma}_{i} = \\hat{R} \\left( -n_i D_i \\partial_r \\ln n_i + n_i\
    \ v_i \\right)$, where $n_i$ is the ion density (m$^{-3}$), $D_i$ is the particle\
    \ diffusivity (m$^2$s$^{-1}$), and $v_i$ is the pinch velocity (ms$^{-1}$). Typical\
    \ core values range from $10^{18}$ to $10^{20}$ m$^{-2}$s$^{-1}$ in H-mode tokamak\
    \ discharges, with inward (negative) flux in the pedestal region and outward (positive)\
    \ flux in the core. The sign is positive when the net flow direction is radially\
    \ outward, increasing the major radius $R$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame. The radial component is distinguished from the parallel component,\
    \ which dominates transport along magnetic field lines; see [radial_ion_state_particle_flux](name:radial_ion_state_particle_flux)\
    \ for the contribution of a single charge state. This quantity is commonly inferred\
    \ from interpretive transport codes using measured density and temperature profiles\
    \ as input; it is related to the total particle source through the continuity\
    \ equation. See also [radial_ion_energy_flux](name:radial_ion_energy_flux) for\
    \ the energy channel counterpart."
  unit: m^-2.s^-1
  physics_domain: transport
  links:
  - name:radial_ion_state_particle_flux
  - name:radial_ion_energy_flux
  arguments:
  - name: ion_particle_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/particles/flux_radial/values
    dd_path: edge_transport/model/ggd/ion/particles/flux_radial/values
    status: composed
  - id: dd:plasma_transport/model/profiles_1d/ion/particles/flux
    dd_path: plasma_transport/model/profiles_1d/ion/particles/flux
    status: composed
- name: radial_ion_state_momentum_flux
  kind: scalar
  status: draft
  description: Radial component of the momentum flux density tensor for a specific
    ion charge state, describing the rate of cross-field momentum transport perpendicular
    to flux surfaces.
  documentation: "The radial momentum flux density $\\Pi_{Z,r}$ for a given charge\
    \ state $Z$ is the radial\u2013radial component of the stress tensor, quantifying\
    \ the rate at which toroidal (or parallel) momentum is transported across flux\
    \ surfaces by viscous and collisional processes. In the edge and scrape-off layer,\
    \ this flux drives the radial electric field via the force balance equation and\
    \ sets the pedestal rotation profile. Typical magnitudes range from $10^{-4}$\
    \ to $10^{-2}\\,\\text{kg}\\,\\text{m}^{-1}\\,\\text{s}^{-2}$ in L-mode and H-mode\
    \ pedestals, inferred from impurity emission spectroscopy or gyrokinetic simulations.\
    \ This quantity is the radial projection of [ion\\_state\\_momentum\\_flux](name:ion_state_momentum_flux)\
    \ and is closely related to [radial\\_momentum\\_flux](name:radial_momentum_flux)\
    \ for the bulk plasma and [radial\\_neutral\\_state\\_momentum\\_flux](name:radial_neutral_state_momentum_flux)\
    \ for neutrals.\n\nSign convention: Positive when the momentum flux is directed\
    \ radially outward (away from the magnetic axis)."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_state_momentum_flux
  - name:radial_momentum_flux
  - name:radial_neutral_state_momentum_flux
  arguments:
  - name: ion_state_momentum_flux
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
