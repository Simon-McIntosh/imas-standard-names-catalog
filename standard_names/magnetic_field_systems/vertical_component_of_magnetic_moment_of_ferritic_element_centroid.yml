name: vertical_component_of_magnetic_moment_of_ferritic_element_centroid
status: draft
description: Vertical ($Z$) component of the magnetization dipole-moment density at
  the centroid of a ferritic insert element.
documentation: "The vertical component $M_Z$ of the magnetic moment density $\\mathbf{M}$\
  \ (in $\\mathrm{A\\,m^{-2}}$) characterizes the $Z$-directed magnetization response\
  \ of a ferritic steel insert to the ambient magnetic field. In the cylindrical coordinate\
  \ system $(R,\\phi,Z)$ of the machine, $M_Z = \\mathbf{M} \\cdot \\hat{Z}$, evaluated\
  \ at the volumetric centroid of each discrete ferritic element. Ferritic inserts,\
  \ typically martensitic steel tiles installed inside the vacuum vessel (e.g., in\
  \ JT-60SA and JET), are used to reduce toroidal field ripple; their magnetization\
  \ is computed from the local $B$-$H$ curve of the material and the self-consistent\
  \ equilibrium field. The magnetic moment density is the moment per unit volume;\
  \ multiplying by the element volume yields the total dipole moment in $\\mathrm{A\\\
  ,m^2}$. Typical saturation magnetization densities for ferritic steels reach $\\\
  sim 1.2 \\times 10^6\\;\\mathrm{A\\,m^{-1}}$, so centroid values of $|M_Z|$ can\
  \ be of order $10^5$\u2013$10^6\\;\\mathrm{A\\,m^{-2}}$ depending on normalization\
  \ convention. See also the radial and toroidal siblings for the full vector, and\
  \ `vertical_component_of_magnetic_field_at_ferritic_element_centroid` for the driving\
  \ field."
