- name: poloidal_magnetic_flux_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the radial position where the safety factor
    reaches its minimum value within the confined plasma.
  documentation: 'The poloidal magnetic flux $\psi$ is the fundamental flux-surface
    label in tokamak equilibrium, defined by $d\psi = d\Phi_\text{pol} / (2\pi)$ where
    $\Phi_\text{pol}$ is the poloidal magnetic flux. This quantity gives the $\psi$
    coordinate of the flux surface on which the safety factor $q(\psi)=d\Phi_\text{tor}/d\Phi_\text{pol}$
    attains its global minimum $q_\text{min}$, a critical surface for MHD stability.
    The minimum safety factor position is a key radial feature for sawtooth stability
    analysis, and the poloidal flux at this location is used to reference other profile
    values relative to this surface. It is obtained from equilibrium reconstructions
    that solve the Grad-Shafranov equation constrained by magnetic and kinetic measurements.
    Typical core $q_\text{min}$ locations in H-mode tokamaks lie at normalized poloidal
    flux $\psi_N \approx 0.3-0.5$, with the absolute flux value depending on the machine
    size and plasma current. Related quantities that locate the same radial feature
    in different coordinate systems are [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis)
    and [safety_factor_of_separatrix](name:safety_factor_of_separatrix).


    Sign convention: Positive when the poloidal flux $\psi$ increases from the magnetic
    axis toward the plasma boundary.


    This quantity is closely linked to the safety factor minimum value itself; see
    [q_profile](name:q_profile) for the safety factor as a function of flux coordinate.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:safety_factor_of_separatrix
  - name:q_profile
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/psi
    dd_path: equilibrium/time_slice/global_quantities/q_min/psi
    status: composed
- name: poloidal_magnetic_flux_of_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux per radian of toroidal angle at the last closed
    flux surface, providing the outer normalization reference for flux-surface coordinates.
  documentation: "The poloidal magnetic flux $\\psi$ is defined as the magnetic flux\
    \ passing through the area enclosed by the poloidal projection of a toroidal surface,\
    \ per radian of toroidal angle. At the plasma boundary, $\n\n$\\psi_{boundary}$\
    \ marks the last closed flux surface (LCFS), bounding the confined plasma region.\
    \ Its value, together with $\\psi_{axis}$, defines the normalized poloidal flux\
    \ coordinate $\\psi_N = (\\psi - \\psi_{axis})/(\\psi_{boundary} - \\psi_{axis})$,\
    \ which ranges from 0 at the magnetic axis to 1 at the boundary. Typical values\
    \ in conventional tokamaks are on the order of 0.1\u20131 Wb for the difference\
    \ $\\psi_{boundary} - \\psi_{axis}$. The boundary flux is routinely obtained from\
    \ equilibrium reconstruction codes that solve the Grad\u2013Shafranov equation\
    \ constrained by external magnetic measurements. \n\nSign convention: Positive\
    \ when $\\psi$ decreases radially outward for a plasma current in the direction\
    \ of increasing toroidal angle $\\phi$.\n\nSee also [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ for the inner normalization reference and [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)\
    \ for the resulting normalized coordinate."
  unit: Wb
  physics_domain: equilibrium
