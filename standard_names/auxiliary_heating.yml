    dd_path: waves/coherent_wave/full_wave/e_field/parallel/values
    status: composed
- name: parallel_component_of_wave_electric_field_real_part
  kind: scalar
  status: draft
  description: Real part of the complex phasor amplitude of the wave electric field
    component projected along the background magnetic field direction, evaluated at
    positions along the beam tracing path.
  documentation: The parallel component of the wave electric field, $E_\parallel =
    \mathbf{E} \cdot \hat{b}$ where $\hat{b}$ is the unit vector along the local background
    magnetic field $\mathbf{B}$, governs Landau damping and transit-time magnetic
    pumping in magnetized plasmas. For a time-harmonic wave with complex amplitude
    $\tilde{E}_\parallel$, this quantity stores $\mathrm{Re}(\tilde{E}_\parallel)$,
    the in-phase component of the field-aligned electric field; the corresponding
    out-of-phase part is the imaginary part (not yet cataloged as a sibling). In electron-cyclotron
    and lower-hybrid beam tracing, $E_\parallel$ is small relative to the perpendicular
    components for O-mode and X-mode but can dominate for quasi-electrostatic modes;
    typical normalized amplitudes $|E_\parallel|/|\mathbf{E}|$ range from $10^{-3}$
    to order unity depending on wave polarization and plasma parameters. This component
    complements the [right-hand circularly polarized real part](name:right_hand_circularly_polarized_electric_field_real_part)
    and [left-hand circularly polarized real part](name:left_hand_circularly_polarized_electric_field_real_part),
    which decompose the perpendicular plane; together with the [parallel component
    of the total wave electric field](name:parallel_component_of_wave_electric_field)
    and the [normal](name:normal_component_of_wave_electric_field) and [binormal](name:binormal_component_of_wave_electric_field)
    components, these quantities fully characterize the wave polarization state in
    the field-aligned triad (parallel, normal, binormal).
