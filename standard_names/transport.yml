- name: toroidal_current_density_due_to_perpendicular_viscosity
  kind: scalar
  status: draft
  description: Toroidal component of the current density driven by perpendicular viscous
    stress in the plasma fluid, projected along increasing toroidal angle phi in the
    right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal current density due to perpendicular viscosity is the toroidal
    component of the current density associated with perpendicular viscous stress
    in a magnetized plasma. The toroidal direction is the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame, where
    $R$ is major radius and $Z$ is vertical height. This quantity is the toroidal
    projection of [current_density_due_to_perpendicular_viscosity](name:current_density_due_to_perpendicular_viscosity)
    and complements the radial, poloidal, and field-aligned projections of the same
    physical contribution.


    The component is defined by projecting the perpendicular-viscosity-driven current-density
    vector onto the toroidal unit vector:


    $$

    j_{\perp\mathrm{visc},\phi} = \mathbf{j}_{\perp\mathrm{visc}} \cdot \hat{\boldsymbol{\phi}}

    $$


    where $\mathbf{j}_{\perp\mathrm{visc}}$ is the current density due to perpendicular
    viscous stress, measured in A m$^{-2}$, $\hat{\boldsymbol{\phi}}$ is the unit
    vector in the direction of increasing $\phi$, and $j_{\perp\mathrm{visc},\phi}$
    is the toroidal component, also measured in A m$^{-2}$.


    This contribution is usually computed rather than measured directly. It is obtained
    from the perpendicular viscous stress tensor used in a fluid, drift-kinetic, or
    transport model, inserted into the momentum and charge-balance relations that
    define viscosity-driven current, and then projected onto $\hat{\boldsymbol{\phi}}$.
    It contributes alongside other viscous-current terms, such as [toroidal_current_density_due_to_parallel_viscosity](name:toroidal_current_density_due_to_parallel_viscosity)
    and [toroidal_current_density_due_to_heat_viscosity](name:toroidal_current_density_due_to_heat_viscosity),
    to [toroidal_current_density_due_to_viscosity](name:toroidal_current_density_due_to_parallel_viscosity).


    Typical magnitudes are strongly regime dependent. Core values may be below 1 A
    m$^{-2}$ when perpendicular viscous forces are weak or symmetry cancels the toroidal
    projection, while edge, pedestal, and scrape-off-layer calculations commonly span
    1-10^4 A m$^{-2}$, with larger localized values possible in steep-gradient or
    strongly sheared flows.


    Sign convention: Positive when the perpendicular-viscosity-driven current density
    has a component in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:current_density_due_to_perpendicular_viscosity
  - name:toroidal_current_density_due_to_parallel_viscosity
  - name:toroidal_current_density_due_to_heat_viscosity
