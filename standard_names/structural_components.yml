    dd_path: cryostat/description_2d/cryostat/unit/annular/thickness
    status: composed
  - id: dd:cryostat/description_2d/cryostat/unit/element/midplane_thickness
    dd_path: cryostat/description_2d/cryostat/unit/element/midplane_thickness
    status: attached
  - id: dd:cryostat/description_2d/thermal_shield/unit/annular/thickness
