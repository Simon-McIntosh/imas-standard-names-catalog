- name: volume_averaged_neon_density
  kind: scalar
  status: draft
  description: Mean elemental number density of neon averaged over the plasma volume,
    where the local neon density is the sum over all ionization states from neutral
    neon to fully stripped neon.
  documentation: 'Volume-averaged neon density is the plasma-volume mean of the total
    elemental neon number density. The local elemental neon density includes all charge
    states of neon, from neutral atoms to fully stripped ions, so it measures neon
    content rather than any single neon ionization state.


    The volume average is defined by


    $$

    \langle n_{\mathrm{Ne}} \rangle_V = \frac{1}{V}\int_V \left(\sum_{q=0}^{10} n_{\mathrm{Ne}^{q+}}(\mathbf{x})\right)\,dV

    $$


    where $V$ is the plasma volume in m$^3$, $dV$ is a volume element in m$^3$, $n_{\mathrm{Ne}^{q+}}$
    is the number density in m$^{-3}$ of neon with charge state $q$, and $q=0$ denotes
    neutral neon while $q=10$ denotes fully stripped neon.


    In practice, this quantity is inferred by combining impurity diagnostics and plasma
    modeling that relate neon line radiation, charge-state balance, transport, and
    ionization-recombination physics to an elemental neon density distribution. The
    volume average provides a single bulk measure of neon impurity inventory, useful
    for comparing seeding level, dilution, and radiative impurity content across plasma
    scenarios.


    Representative values are highly scenario dependent. Trace neon concentrations
    may give volume-averaged densities around $10^{15}$-$10^{17}$ m$^{-3}$, while
    deliberate neon seeding for radiation control can produce values of order $10^{17}$-$10^{19}$
    m$^{-3}$ depending on plasma density, confinement, and impurity source strength.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:neon_fraction
  - name:neon_density_at_plasma_boundary
  - name:volume_averaged_nitrogen_density
  - name:volume_averaged_deuterium_density
