- name: toroidal_fast_ion_state_torque_density_due_to_collisions
  kind: scalar
  status: draft
  description: Collisional toroidal torque density transferred to fast ions in a specified
    charge state by Coulomb collisions with background particles. It is the toroidal
    angular-momentum source per unit volume, summed over all fast-ion orbit topologies.
  documentation: 'Toroidal fast-ion state torque density due to collisions is the
    Coulomb-collisional source of mechanical toroidal angular momentum for fast ions
    in a specified charge state, expressed per unit plasma volume. It is summed over
    all fast-ion orbit topologies and is associated with the $\phi$ direction in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$
    increases counter-clockwise when viewed from above $+\hat{Z}$, and $Z$ is vertical
    height.


    The local kinetic form is the toroidal angular-momentum moment of the collisional
    operator:


    $$

    \mathcal{T}_{\phi,\mathrm{coll}}^{(q)} = R\,m_q \int v_\phi \left[\sum_b C_{qb}(f_q,
    f_b)\right] \, d^3v

    $$


    where $\mathcal{T}_{\phi,\mathrm{coll}}^{(q)}$ is this torque density for charge
    state $q$ in N m$^{-2}$, $R$ is major radius in m, $m_q$ is the fast-ion mass
    in kg, $v_\phi$ is the particle velocity component in the $+\hat{\phi}$ direction
    in m s$^{-1}$, $f_q$ and $f_b$ are fast-ion and background distribution functions
    normalized to number density with units s$^3$ m$^{-6}$, $C_{qb}$ is the Coulomb
    collision operator for interactions with background population $b$ with units
    of $f_q$ per second, and $d^3v$ has units m$^3$ s$^{-3}$. The integral without
    $R$ is a toroidal force density in N m$^{-3}$; multiplying by $R$ gives torque
    per unit volume in N m$^{-2}$.


    In practice the quantity is computed by applying Fokker-Planck, Monte Carlo, orbit-following,
    or transport collision operators to the fast-ion distribution and then taking
    the toroidal velocity moment for the selected charge state. Experimental analyzes
    infer it indirectly from fast-ion distribution modeling and toroidal momentum
    balance, constrained by diagnostics such as neutron emission, neutral-particle
    analysis, gamma-ray emission, charge exchange, or collective scattering. Conceptually,
    it is the toroidal component of [fast_ion_state_torque_density_due_to_collisions](name:fast_ion_state_torque_density_due_to_collisions);
    summing over charge states gives [toroidal_fast_ion_torque_density_due_to_collisions](name:toroidal_fast_ion_torque_density_due_to_collisions),
    volume integration gives [toroidal_fast_ion_state_torque_due_to_collisions](name:toroidal_fast_ion_state_torque_due_to_collisions),
    and the trapped-orbit contribution is [toroidal_trapped_fast_ion_state_torque_density_due_to_collisions](name:toroidal_fast_ion_state_torque_density_due_to_collisions).


    Typical core magnitudes in beam-heated tokamak plasmas are $10^{-2}$-$10$ N m$^{-2}$.
    Strongly localized slowing-down or pitch-angle-scattering regions can approach
    $10$-$100$ N m$^{-2}$, while weak fast-ion populations or outer-plasma regions
    may be below $10^{-3}$ N m$^{-2}$.


    Sign convention: Positive when the collisional torque accelerates the fast-ion
    charge-state population in the direction of increasing toroidal angle $\phi$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:fast_ion_state_torque_density_due_to_collisions
  sources:
  - id: dd:distributions/distribution/profiles_1d/collisions/ion/state/torque_fast_phi
    dd_path: distributions/distribution/profiles_1d/collisions/ion/state/torque_fast_phi
    status: attached
