      kind: llm
- name: temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Temperature-valued quantity associated with the core-side shoulder
    of an H-mode edge transport barrier, covering population kinetic temperatures,
    density-weighted averages, and stability thresholds.
  documentation: 'This quantity is a temperature associated with the pedestal top,
    defined as the core-side shoulder of an H-mode edge transport barrier. Its instance-specific
    interpretation may be a plasma population''s kinetic temperature, a density-weighted
    population average, or a critical threshold for pedestal stability.


    For population-temperature instances, an isotropic kinetic temperature satisfies


    $$

    \frac{3}{2} k_B T = \langle E_{\mathrm{kin}} \rangle

    $$


    where $T$ is the population temperature, $k_B$ is Boltzmann''s constant, and $\langle
    E_{\mathrm{kin}} \rangle$ is the mean random kinetic energy per particle. The
    [electron temperature at the pedestal top](name:electron_temperature_at_pedestal_top)
    and [average temperature at the pedestal top](name:average_temperature_at_pedestal_top)
    are population-temperature instances. The [critical temperature at the pedestal
    top](name:critical_temperature_at_pedestal_top) instead denotes the threshold
    for marginal ideal magnetohydrodynamic peeling-ballooning stability and is distinct
    from a measured or fitted population temperature.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
  - name:average_temperature_at_pedestal_top
  - name:critical_temperature_at_pedestal_top
- name: average_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Average temperature at the pedestal top is the density-weighted kinetic
    temperature of a specified plasma population at the core-side shoulder of the
    H-mode pedestal.
  documentation: 'Average temperature at the pedestal top is the density-weighted
    kinetic temperature of a specified plasma population evaluated at the top, or
    height, of the H-mode pedestal transport barrier. It is a population-averaged
    specialization of [temperature at the pedestal top](name:temperature_at_pedestal_top).


    The pedestal top is the fitted transition location where the steep edge temperature
    gradient relaxes toward the flatter confined-core region, rather than the physical
    plasma boundary or a particular outboard point.


    Using the normalized poloidal flux coordinate $\psi_N$, the average temperature
    is defined by


    $$

    T_{\mathrm{avg,ped}} = \frac{\sum_{a \in \mathcal{P}} n_a(\psi_{N,\mathrm{ped}})
    T_a(\psi_{N,\mathrm{ped}})}{\sum_{a \in \mathcal{P}} n_a(\psi_{N,\mathrm{ped}})}

    $$


    where $\mathcal{P}$ is the specified set of species and charge-state components,
    $n_a$ is the number density of component $a$, $T_a$ is its kinetic temperature,
    and $\psi_{N,\mathrm{ped}}$ is the fitted pedestal-top coordinate. For example,
    [ion average temperature at the pedestal top](name:ion_average_temperature_at_pedestal_top)
    includes all ion species and charge states in $\mathcal{P}$.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:temperature_at_pedestal_top
  - name:ion_average_temperature_at_pedestal_top
  arguments:
  - name: temperature_at_pedestal_top
    operator: average
    operator_kind: qualifier
- name: electron_temperature_at_pedestal_top
  kind: scalar
  status: active
  description: Electron temperature at the pedestal top is the kinetic temperature
    of the electron population at the core-side shoulder of an H-mode edge transport
    barrier.
  documentation: 'Electron temperature at the pedestal top is the kinetic temperature
    of the electron population evaluated at the core-side shoulder of the H-mode edge
    transport barrier. It is the electron-specific instance of [temperature at the
    pedestal top](name:temperature_at_pedestal_top).


    For an isotropic electron population, the kinetic temperature is defined by


    $$

    T_e = \frac{2}{3}\langle E_{\mathrm{kin},e}\rangle

    $$


    where $T_e$ is the electron temperature and $\langle E_{\mathrm{kin},e}\rangle$
    is the mean random kinetic energy per electron.


    This population-specific thermal quantity is distinct from the density-weighted
    [average temperature at the pedestal top](name:average_temperature_at_pedestal_top)
    and from the stability threshold represented by the [electron critical temperature
    at the pedestal top](name:electron_critical_temperature_at_pedestal_top). Its
    thermodynamic relationship to [electron pressure at the pedestal top](name:electron_pressure_at_pedestal_top)
    follows the electron equation of state.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:temperature_at_pedestal_top
  - name:average_temperature_at_pedestal_top
  - name:electron_critical_temperature_at_pedestal_top
  - name:electron_pressure_at_pedestal_top
  arguments:
  - name: temperature_at_pedestal_top
    operator: electron
    operator_kind: qualifier
