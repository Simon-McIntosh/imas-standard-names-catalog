- name: toroidal_current_density
  kind: scalar
  status: active
  description: Toroidal current density is the conventional charge flux per unit area
    projected onto the geometric toroidal direction, including all charged-particle
    contributions.
  documentation: 'The toroidal component of the [current density](name:current_density)
    vector quantifies conventional charge transport per unit area along the geometric
    toroidal direction in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It
    includes all charged-particle species and current mechanisms.


    The defining projection is:


    $$

    J_\phi = \mathbf{J} \cdot \hat{\phi}

    $$


    where $\mathbf{J}$ is the total current-density vector, $\hat{\phi}$ is the unit
    vector in the direction of increasing toroidal angle, and $J_\phi$ is its toroidal
    component.


    This quantity excludes displacement-current density and is distinct from a scalar
    electric current, which is the flux of $\mathbf{J}$ through a specified surface.
    A restricted contribution, such as [toroidal current density due to diamagnetic
    drift](name:toroidal_current_density_due_to_diamagnetic_drift), represents only
    one mechanism.


    Sign convention: Positive when $\mathbf{J}$ has a component in the direction of
    increasing toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:toroidal_current_density_due_to_diamagnetic_drift
  arguments:
  - name: current_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - dd_path: edge_profiles/ggd/j_total/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/edge_profiles.html#edge_profiles-ggd-j_total-phi
    dd_documentation:
      leaf: Toroidal component, one scalar value is provided per element in the grid
        subset.
      parent_path: edge_profiles/ggd/j_total
      parent: Total current density, given on various grid subsets
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - 1...N
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of j total."
      kind: template
  - dd_path: equilibrium/time_slice/ggd/j_phi/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-ggd-j_phi-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
      parent_path: equilibrium/time_slice/ggd/j_phi
      parent: Toroidal plasma current density, given on various grid subsets
      data_type: FLT_1D
      unit: A.m^-2
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for j phi.
      kind: template
  - dd_path: equilibrium/time_slice/profiles_2d/j_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_2d-j_phi
    dd_documentation:
