- name: vertical_front_surface_radius_of_optical_element
  kind: scalar
  status: draft
  description: Signed radius of curvature of an optical element's front surface along
    the local X2 vertical direction of the aperture frame (X1, X2, z), where z is
    the local surface-normal or optical-axis coordinate. It applies to spherical,
    cylindrical, toroidal, and separably curved front surfaces whose vertical radius
    is specified independently.
  documentation: 'The vertical front-surface radius of an optical element is the signed
    radius of curvature of the element''s entrance or reflecting surface in the $X_2$
    principal section of the local aperture frame $(X_1, X_2, z)$. Here $X_1$ and
    $X_2$ span the local aperture or tangent plane, $X_2$ is the vertical transverse
    direction, and $z$ is the local surface-normal or optical-axis coordinate. This
    is a radius in meters, not the reciprocal curvature in m$^{-1}$.


    Near the local vertex, after subtracting any planar tilt, the small-sag form of
    the front surface in the $X_2$ direction is


    $$

    z(x_2) - z(0) \simeq \frac{x_2^2}{2 R_2}

    $$


    where $x_2$ is displacement along $X_2$ in meters, $z$ is surface sag along the
    local $z$ coordinate in meters, and $R_2$ is this signed vertical front-surface
    radius in meters. The approximation assumes $|x_2| \ll |R_2|$ and a local tangent
    frame; an exactly circular principal section has this expression as its second-order
    expansion.


    The value is usually obtained from optical design specifications, crystal-bending
    geometry, or surface metrology such as profilometry or interferometry. It determines
    vertical focusing in ray tracing and wave-optics calculations. For a spherical
    surface the $X_1$ and $X_2$ radii are equal; for cylindrical, toroidal, or separably
    curved surfaces the two transverse radii may differ and must be specified independently.
    The closely related [vertical_front_surface_curvature_of_optical_element](name:vertical_front_surface_curvature_of_optical_element)
    uses the same vertical front-surface radius convention, while x_front_surface_curvature_of_optical_element
    refers to the orthogonal $X_1$ direction and [vertical_back_surface_curvature_of_optical_element](name:vertical_back_surface_curvature_of_optical_element)
    to the rear surface.


    Typical absolute values range from about 0.1-10 m for tightly bent X-ray crystal
    reflectors to 1-100 m for weakly focusing mirrors or grazing-incidence optics.
    A nearly flat surface is represented by a radius whose magnitude is much larger
    than the aperture size.


    Sign convention: Positive when the center of curvature of the front surface in
    the $X_2$ principal section lies on the $+z$ side of the local tangent plane.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_front_surface_curvature_of_optical_element
  - name:vertical_back_surface_curvature_of_optical_element
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/reflector/x2_curvature
    dd_path: spectrometer_x_ray_crystal/channel/reflector/x2_curvature
    status: composed
- name: wavelength_of_detector_pixel
  kind: scalar
  status: draft
  description: Photon wavelength assigned to each detector pixel of an X-ray crystal
    spectrometer by the Bragg diffraction geometry of the dispersing crystal.
  documentation: "In an X-ray crystal spectrometer, each detector pixel intercepts\
    \ photons diffracted at a specific angle by the Bragg crystal, and this angle\
    \ uniquely determines the photon wavelength. The wavelength varies primarily along\
    \ the principal dispersion direction of the detector, with a secondary dependence\
    \ across the orthogonal direction arising from the elliptical curvature of iso-wavelength\
    \ surfaces produced by curved-crystal geometry.\n\nThe per-pixel wavelength follows\
    \ Bragg's law:\n\n$$\n\\lambda = \\frac{2d\\sin\\theta}{n}\n$$\n\nwhere $d$ is\
    \ the interplanar spacing of the diffracting crystal planes, $\\theta$ is the\
    \ local Bragg angle at the pixel position in the spectrometer focal plane, and\
    \ $n$ is the integer diffraction order.\n\nThe wavelength map is computed from\
    \ the spectrometer geometry \u2014 crystal curvature, crystal-to-detector distance,\
    \ and pixel coordinates \u2014 and calibrated against known spectral emission\
    \ lines; the reference diffraction wavelength at the nominal crystal orientation\
    \ is described by bragg_wavelength. Pixel-by-pixel energy bounds on the spectral\
    \ acceptance window are provided by [lower_bound_energy_of_detector_pixel](name:lower_bound_energy_of_detector_pixel)\
    \ and [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).\
    \ Typical wavelengths for fusion-relevant X-ray impurity emission lines (helium-like\
    \ argon, titanium, or iron charge states) fall in the range 0.1\u20131 nm.\n\n\
    Sign convention: Positive when the wavelength is assigned at a positive Bragg\
    \ diffraction angle from the crystal surface, which is satisfied for all physically\
    \ detected photons."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
  sources:
