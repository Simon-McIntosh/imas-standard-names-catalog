- name: nuclear_charge_number_of_element
  kind: scalar
  status: draft
  description: The atomic number Z of a chemical element, equal to the number of protons
    in the nucleus, uniquely identifying the element's nuclear identity and charge.
  documentation: 'The nuclear charge number $Z$ is the count of protons in an atomic
    nucleus, taking integer values from 1 (hydrogen) to 118 (oganesson) for naturally
    occurring and synthesized elements. It determines the element''s identity, governs
    electron binding energies via the nuclear Coulomb potential $V(r) = -Ze^2/(4\pi\epsilon_0
    r)$ where $e$ is the elementary charge and $r$ is the radial distance from the
    nucleus, and sets the maximum possible ionization charge state of the atom. In
    fusion applications, $Z$ is essential for characterizing injected species in pellet,
    neutral beam, and gas injection systems, and enters impurity transport calculations
    through the effective charge $Z_{\rm eff} = \sum_i n_i Z_i^2 / n_e$ where $n_i$
    is the density of ion species $i$ and $n_e$ is the electron density. Unlike [ion_charge_number](name:ion_charge_number),
    which reflects the actual ionization state of an ion in the plasma, the nuclear
    charge number is a fixed intrinsic property of the element. It is tabulated from
    atomic physics and requires no experimental measurement in the plasma. Closely
    related elemental properties include [atomic_mass_of_element](name:atomic_mass_of_element)
    and [atoms_per_molecule_of_element](name:atoms_per_molecule_of_element), which
    together with the nuclear charge number fully characterize the stoichiometric
    and nuclear identity of an injected species.


    Sign convention: Positive for all physical elements, as proton count is a strictly
    positive integer.'
  unit: '1'
  physics_domain: machine_operations
  links:
