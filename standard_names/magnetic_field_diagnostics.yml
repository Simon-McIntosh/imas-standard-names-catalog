- name: major_radius_of_flux_loop
  kind: scalar
  status: draft
  description: Major-radius coordinate of a flux-loop reference point in the right-handed
    cylindrical (R, phi, Z) frame. It is the perpendicular distance from the toroidal
    symmetry axis to the loop position.
  documentation: 'The major radius of a flux loop is the $R$ coordinate of the loop''s
    chosen reference point in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is distance from the toroidal symmetry axis, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It locates the sensor in the horizontal plane and, together
    with $\phi$ and $Z$, specifies the position associated with the loop geometry
    or attachment point.


    The coordinate is the cylindrical radial coordinate derived from horizontal Cartesian
    coordinates:


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are measured in a right-handed Cartesian $(x, y, z)$ frame with
    $z$ vertical and origin on the toroidal symmetry axis; $x$, $y$, and $R$ have
    units of meters.


    In practice, $R$ is obtained from mechanical design information or metrology of
    the flux-loop winding, support, or attachment point. For an extended loop, the
    reference point is chosen consistently, such as the geometric center of the winding
    or a defined attachment location. This coordinate helps relate the sensor position
    to the measured [poloidal magnetic flux at the sensor attachment point](name:poloidal_magnetic_flux_at_sensor_attachment_point).


    Typical values are comparable to the machine size: about 0.2-2 m in small tokamaks
    and spherical tori, 1-4 m in medium-size tokamaks, and 4-10 m in large devices.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:major_radius_of_poloidal_magnetic_field_probe
  - name:major_radius_of_magnetic_axis
  sources:
  - id: dd:magnetics/flux_loop/position/r
    dd_path: magnetics/flux_loop/position/r
    status: composed
- name: major_radius_of_poloidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Major-radius coordinate of the physical location of a poloidal magnetic
    field probe, giving the probe's distance from the machine symmetry axis in the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The major-radius coordinate $R$ specifies the distance of a poloidal\
    \ magnetic field probe from the machine's toroidal symmetry axis within the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the horizontal distance from\
    \ the symmetry axis in meters, $\\phi$ is the toroidal angle increasing counter-clockwise\
    \ when viewed from above, and $Z$ is the vertical height.\n\nPoloidal magnetic\
    \ field probes (Mirnov coils) measure the poloidal component of the magnetic field\
    \ and are deployed in arrays near the vacuum vessel wall to diagnose MHD activity,\
    \ determine plasma position and shape, and constrain equilibrium reconstructions.\
    \ The $R$ coordinate of each probe is surveyed precisely at installation and must\
    \ be recorded alongside each measured signal so that probe readings can be compared\
    \ with predicted field values and spatially resolved in the poloidal cross-section.\
    \ This coordinate pairs with the corresponding vertical position to fully fix\
    \ each probe's location in the $(R, Z)$ plane.\n\nTypical values range from approximately\
    \ 0.5 m in compact tokamaks to 4\u20135 m in large-scale devices, tracking the\
    \ range of machine major radii. This quantity is the poloidal-probe analog of\
    \ [major_radius_of_toroidal_magnetic_field_probe](name:major_radius_of_toroidal_magnetic_field_probe)\
    \ and, together with [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis),\
    \ provides the geometric context needed to interpret probe measurements in terms\
    \ of the [poloidal_magnetic_field](name:poloidal_magnetic_field) distribution\
    \ across the vessel cross-section.\n\nSign convention: Positive when the probe\
    \ position is measured in the direction of increasing $R$ from the machine symmetry\
    \ axis."
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:major_radius_of_toroidal_magnetic_field_probe
  - name:major_radius_of_magnetic_axis
  - name:poloidal_magnetic_field
  sources:
  - id: dd:magnetics/b_field_pol_probe/position/r
    dd_path: magnetics/b_field_pol_probe/position/r
    status: composed
  - id: dd:magnetics/bpol_probe/position/r
    dd_path: magnetics/bpol_probe/position/r
    status: composed
- name: major_radius_of_rogowski_coil
  kind: scalar
  status: draft
  description: "Major radius (R) coordinate of a Rogowski coil position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Major radius of a Rogowski coil is the $R$ coordinate of the coil
    reference position in the right-handed cylindrical $(R, \phi, Z)$ frame. It is
    the perpendicular distance from the toroidal symmetry axis to that reference point,
    independent of the toroidal angle $\phi$ and vertical coordinate $Z$.


    The cylindrical radius is related to a right-handed Cartesian $(x, y, z)$ frame
    whose $z$ axis is the vertical symmetry axis by


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are horizontal Cartesian coordinates measured from the toroidal
    symmetry axis. The associated cylindrical angle $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$.


    In practice, this coordinate is obtained from the mechanical design, installation
    survey, or metrology of the Rogowski coil reference point, then expressed in the
    right-handed cylindrical $(R, \phi, Z)$ frame. Together with related position
    coordinates such as the vertical position, it specifies the location of the reference
    point but does not by itself describe the full coil shape, winding path, or enclosed
    area.


    Typical values range from about 0.2-2 m in compact devices, 1-4 m in medium-sized
    tokamaks, and up to 6-10 m in large devices, depending on where the Rogowski coil
    is mounted relative to the vacuum vessel, central column, and support structures.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_rogowski_coil
  - name:major_radius_of_coil_conductor_element
  sources:
  - id: dd:magnetics/rogowski_coil/position/r
    dd_path: magnetics/rogowski_coil/position/r
    status: composed
- name: major_radius_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Major-radius R-coordinate of the physical location of a toroidal magnetic
    field probe in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The major radius $R$ specifies the radial distance from the toroidal
    symmetry axis to the physical location of a toroidal magnetic field probe, measured
    in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is the distance
    from the symmetry axis, $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is the vertical height.


    Together with the [vertical coordinate](name:vertical_coordinate_of_toroidal_magnetic_field_probe)
    and the [toroidal angle](name:toroidal_angle_of_toroidal_magnetic_field_probe),
    the major radius fully specifies the three-dimensional position of the probe.
    Accurate knowledge of this radial coordinate is essential for interpreting measured
    $B_\phi$ values and for incorporating probe signals into equilibrium reconstruction
    or non-axisymmetric field mapping, since both the vacuum field magnitude and the
    local flux surface geometry depend strongly on $R$.


    The probe position is determined by mechanical survey or optical metrology during
    installation and is treated as a fixed geometric property of the diagnostic array.
    The [cross-sectional area](name:area_of_toroidal_magnetic_field_probe) of the
    probe coil and its radial position together enter the calibration of flux measurements.
    The analogous coordinate for poloidal field probes is [major_radius_of_poloidal_magnetic_field_probe](name:major_radius_of_poloidal_magnetic_field_probe).


    Sign convention: Positive when measured outward from the toroidal symmetry axis
    in the $+\hat{R}$ direction.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:vertical_coordinate_of_toroidal_magnetic_field_probe
  - name:toroidal_angle_of_toroidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  - name:major_radius_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_phi_probe/position/r
    dd_path: magnetics/b_field_phi_probe/position/r
    status: composed
  - id: dd:magnetics/b_field_tor_probe/position/r
    dd_path: magnetics/b_field_tor_probe/position/r
    status: composed
- name: vertical_coordinate_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the physical location of a toroidal magnetic
    field probe in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The vertical coordinate $Z$ specifies the height of a toroidal magnetic
    field probe above the geometric midplane in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius measured from the toroidal symmetry
    axis and $Z$ is the vertical height. Toroidal magnetic field probes are inductive
    sensors deployed on or near the vacuum vessel to monitor the toroidal component
    $B_\phi$ of the magnetic field; precise knowledge of each probe''s spatial position
    is essential for interpreting the local field measurement and for incorporating
    the data into MHD equilibrium reconstruction.


    The $Z$ position is a fixed geometric attribute established by engineering survey
    during machine installation. Together with the corresponding major-radius and
    toroidal-angle coordinates, it fully specifies the three-dimensional location
    of the probe. This coordinate role is shared across other magnetic diagnostic
    components, such as [poloidal field coil] elements and [general measurement positions](name:vertical_coordinate_of_measurement_position)
    used in equilibrium reconstruction, and analogously for [lower hybrid antenna](name:vertical_coordinate_of_lower_hybrid_antenna)
    reference points.


    Sign convention: Positive when the probe is located above the geometric midplane,
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: magnetic_field_diagnostics
  links:
  - name:vertical_coordinate_of_measurement_position
  - name:vertical_coordinate_of_lower_hybrid_antenna
  sources:
  - id: dd:magnetics/b_field_tor_probe/position/z
    dd_path: magnetics/b_field_tor_probe/position/z
    status: composed
- name: voltage_of_toroidal_magnetic_field_probe
  kind: scalar
  status: draft
  description: Terminal voltage of a toroidal magnetic field probe coil, induced by
    the time variation of the local toroidal magnetic field component threading the
    coil windings.
  documentation: 'A toroidal magnetic field probe is a pickup coil wound to sense
    the toroidal component of the magnetic field at a specific location. The terminal
    voltage is the raw inductive signal produced as the local toroidal field $B_\phi$
    evolves in time.


    The coil voltage follows from Faraday''s law of induction:


    $$

    V = -N A \frac{dB_\phi}{dt}

    $$


    where $N$ is the number of turns and $A$ is the effective cross-sectional area
    per turn. Time-integrating the voltage signal and dividing by the coil sensitivity
    $NA$ recovers the local toroidal field value; the geometric parameters are provided
    by [count_of_toroidal_magnetic_field_probe](name:count_of_toroidal_magnetic_field_probe)
    and [area_of_toroidal_magnetic_field_probe](name:area_of_toroidal_magnetic_field_probe).


    Probes are mounted on the vacuum vessel wall or plasma-facing surfaces and sampled
    on fast analog-to-digital converters to capture the full temporal evolution of
    the toroidal field. The analogous measurement for the poloidal field component
    is given by [voltage_of_poloidal_magnetic_field_probe](name:voltage_of_poloidal_magnetic_field_probe).


    Sign convention: Positive when $dB_\phi/dt > 0$ for a coil wound in the direction
    of increasing toroidal angle $\phi$.'
  unit: V
  physics_domain: magnetic_field_diagnostics
  links:
  - name:count_of_toroidal_magnetic_field_probe
  - name:area_of_toroidal_magnetic_field_probe
  - name:voltage_of_poloidal_magnetic_field_probe
  sources:
  - id: dd:magnetics/b_field_phi_probe/voltage
    dd_path: magnetics/b_field_phi_probe/voltage
    status: attached
