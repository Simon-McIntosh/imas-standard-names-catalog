    dd_path: summary/local/magnetic_axis/n_i/iron/value
    status: composed
- name: magnetic_shear_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Dimensionless measure of the radial variation of the safety factor,
    defined as the fractional change of q per unit normalized toroidal flux radius,
    evaluated at the internal transport barrier.
  documentation: 'The magnetic shear $s$ is a measure of the radial variation of the
    safety factor $q$, defined as


    $$ s = \frac{\rho_\mathrm{tor}}{q} \frac{dq}{d\rho_\mathrm{tor}} $$


    where $\rho_\mathrm{tor}$ is the normalized toroidal flux radius. At the internal
    transport barrier (ITB), $s$ characterizes the steepness of the radial gradient
    of the magnetic field line pitch and is closely linked to the formation and stability
    of the barrier.


    Typical values at an ITB are in the range $s \approx 0$ to $2$, often near zero
    at the barrier center in reversed-shear scenarios. Values far from zero indicate
    strong shear and are associated with reduced turbulent transport.


    In practice, $s$ is derived from equilibrium reconstructions, for example using
    magnetics and MSE data. The sign of $s$ follows the sign of $dq/d\rho_\mathrm{tor}$:
    positive $s$ indicates that $q$ increases with radius (normal magnetic shear),
    while negative $s$ indicates reversed shear (decreasing $q$ with radius).


    Sign convention: Positive when $dq/d\rho_\mathrm{tor} > 0$ (normal shear).'
  unit: '1'
  physics_domain: transport
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_pedestal
  - name:magnetic_shear_at_separatrix
  - name:magnetic_shear
  sources:
  - id: dd:summary/local/itb/magnetic_shear/value
    dd_path: summary/local/itb/magnetic_shear/value
    status: composed
- name: minimum_charge_of_ion_state
  kind: scalar
  status: draft
  description: Minimum ionization charge state (Z_min) of a bundled ion charge-state
    group used in GGD plasma transport models, with zero indicating a neutral species.
  documentation: 'The minimum charge state $Z_{\min}$ defines the lower bound of the
    charge-state bundle for a given ion species in multi-fluid transport simulations.
    The bundle groups multiple ionization states (e.g., $Z_{\min}$ to $Z_{\max}$)
    into a single fluid species to reduce computational cost while preserving charge
    balance in reaction rates and transport coefficients. For a neutral species, $Z_{\min}
    = 0$; for a single charge-state representation, $Z_{\min} = Z_{\max}$.


    The charge-state bundle $[Z_{\min}, Z_{\max}]$ is paired with the average charge
    to compute effective atomic data from the Atomic and Molecular Numerical Database
    (AMNS).


    Sign convention: Positive when the charge state is positive; zero for neutral
    species.


    Typical values range from $Z_{\min} = 0$ (e.g., neutral deuterium) to $Z_{\min}
    = 6$ (e.g., fully stripped carbon). See also [ion_state_average_charge](name:ion_state_average_charge)
    for the mean charge within the bundle and [ion_state_maximum_charge](name:ion_state_maximum_charge)
    for the upper bound.'
  unit: '1'
  physics_domain: transport
  links:
  - name:ion_state_average_charge
  - name:ion_state_maximum_charge
  sources:
  - id: dd:plasma_profiles/ggd/ion/state/z_min
    dd_path: plasma_profiles/ggd/ion/state/z_min
    status: composed
  - id: dd:plasma_transport/model/ggd/ion/state/z_min
    dd_path: plasma_transport/model/ggd/ion/state/z_min
    status: attached
- name: normalized_poloidal_flux_coordinate_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Normalized toroidal flux coordinate at the radial location of the internal
    transport barrier (ITB).
  documentation: 'The normalized toroidal flux coordinate at the internal transport
    barrier is defined as

    $$

    \rho_{\mathrm{tor, norm}}^{(\text{ITB})} \equiv \frac{\Phi(R_{\text{ITB}}, Z_{\text{ITB}})}{\Phi_{\text{sep}}},

    $$

    where $\Phi$ is the toroidal magnetic flux enclosed by a flux surface, $\Phi_{\text{sep}}$
    is the toroidal magnetic flux at the plasma boundary (separatrix or last closed
    flux surface), and $(R_{\text{ITB}}, Z_{\text{ITB}})$ denotes the radial location
    of the ITB. The coordinate $\rho_{\mathrm{tor, norm}}$ is dimensionless and ranges
    from $0$ at the magnetic axis to $1$ at the plasma boundary. Typical values for
    an ITB are in the range $0.0$ to $0.6$ (core region).


    The ITB is a region of steep gradient in the radial electric field and ion temperature,
    often associated with improved confinement. The position is determined from experimental
    profiles (e.g., $T_i$, $E_r$) or from transport models.


    Sign convention: Positive when the flux surface is inside the plasma boundary.


    Related quantities: The absolute toroidal magnetic flux at the ITB location is
    obtained by multiplying $\rho_{\mathrm{tor, norm}}^{(\text{ITB})}$ by the toroidal
    magnetic flux at the separatrix.'
  unit: '1'
  physics_domain: transport
  links:
  - name:normalized_poloidal_flux_coordinate_at_pedestal
  - name:normalized_poloidal_flux_coordinate_at_separatrix
  sources:
  - id: dd:equilibrium/time_slice/constraints/j_tor/position/rho_tor_norm
    dd_path: equilibrium/time_slice/constraints/j_tor/position/rho_tor_norm
    status: skipped
  - id: dd:equilibrium/time_slice/global_quantities/q_min/psi_norm
    dd_path: equilibrium/time_slice/global_quantities/q_min/psi_norm
    status: attached
  - id: dd:summary/local/itb/position/rho_tor_norm
    dd_path: summary/local/itb/position/rho_tor_norm
    status: composed
- name: parallel_electron_velocity
  kind: scalar
  status: draft
  description: Projection of the bulk electron fluid velocity vector onto the direction
    parallel to the local magnetic field line.
  documentation: 'The parallel electron velocity $v_{\parallel e} = \mathbf{v}_e \cdot
    \hat{b}$ is the field-aligned component of the electron fluid flow, where $\hat{b}
    = \mathbf{B}/B$ is the unit vector along the local magnetic field. This component
    dominates the toroidal current drive in Ohm''s law ($E_\parallel = \eta j_\parallel
    + \text{non-inductive sources}$) and is critical for calculating the parallel
    electric field. Typical core values in H-mode tokamaks range from $\sim 10^3$
    to $10^5$ m/s, depending on rotation and current drive; the poloidal component
    $\mathbf{v}_e \cdot \hat{\theta}$ governs cross-field transport and is tracked
    by [poloidal_electron_velocity](name:poloidal_electron_velocity). Diagnostics
    include charge-exchange recombination spectroscopy (for impurity ion proxies)
    and inference from equilibrium reconstruction of the radial electric field via
    force balance. The associated energy flow is described by [parallel_electron_energy_flux](name:parallel_electron_energy_flux).


    Sign convention: Positive when the electron fluid velocity points in the direction
    of increasing distance along the magnetic field line (toward the positive toroidal
    direction for a field line with positive $q$).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:poloidal_electron_velocity
  - name:parallel_electron_energy_flux
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/velocity/parallel
    dd_path: core_profiles/profiles_1d/electrons/velocity/parallel
    status: composed
- name: parallel_fast_electron_pressure
  kind: scalar
  status: draft
  description: Component of the anisotropic fast electron pressure tensor oriented
    parallel to the local magnetic field.
  documentation: 'The parallel fast electron pressure $p_{\parallel,f} = m_e \int
    v_{\parallel}^2 f_f(v)\,d^3v$ quantifies the kinetic stress from suprathermal
    electrons with velocities aligned with the magnetic field, where $m_e$ is the
    electron mass, $v_{\parallel}$ is the velocity component along the field, and
    $f_f(v)$ is the fast electron distribution function. This component is part of
    the anisotropic pressure tensor described by $[\text{fast\_electron\_pressure}](name:fast_electron_pressure)$
    and complements the [perpendicular fast electron pressure](name:perpendicular_fast_electron_pressure).
    It is essential for modeling fast electron confinement, current drive efficiency,
    and magnetohydrodynamic stability, with typical values ranging from 0.1 to 10
    kPa in the core of high-power auxiliary-heated plasmas. The parallel pressure
    is inferred from measurements such as hard X-ray bremsstrahlung spectra or electron
    cyclotron emission, combined with Fokker-Planck modeling of the suprathermal distribution.


    Sign convention: Positive when the kinetic stress from suprathermal electrons
    aligned with the local magnetic field is compressive.'
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_electron_pressure
  - name:perpendicular_fast_electron_pressure
  arguments:
  - name: fast_electron_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/electrons/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/electrons/pressure_fast_parallel
    status: composed
  - id: dd:plasma_profiles/profiles_1d/electrons/pressure_fast_parallel
    dd_path: plasma_profiles/profiles_1d/electrons/pressure_fast_parallel
    status: composed
- name: parallel_fast_neutral_pressure
  kind: scalar
  status: draft
  description: Scalar projection of the fast neutral pressure tensor onto the direction
    parallel to the local magnetic field line, representing the component of kinetic
    stress carried by non-thermal neutral particles along the magnetic field.
  documentation: "The parallel fast neutral pressure is the component of the neutral\
    \ pressure tensor in the direction parallel to the local magnetic field line.\
    \ It is defined as $p_{\\parallel,n} = \\int m_n v_{\\parallel}^2 f_n(\\mathbf{r},\
    \ \\mathbf{v}) \\, d^3v$, where $m_n$ is the neutral mass, $v_{\\parallel}$ is\
    \ the velocity component along the magnetic field, and $f_n$ is the fast neutral\
    \ velocity distribution function. This quantity is typically on the order of 0.1\u2013\
    10 Pa in the edge and scrape-off layer of magnetically confined plasmas, depending\
    \ on neutral density and temperature. It is a key input for parallel momentum\
    \ balance equations involving neutral particles, often appearing alongside the\
    \ parallel fast neutral velocity in transport models. The perpendicular counterpart\
    \ is given by `perpendicular_fast_neutral_pressure`.\n\nTypical values are positive\
    \ and range from sub-Pa levels in the plasma core to a few Pa near the first wall.\
    \ The pressure is always non-negative for any physically realizable distribution\
    \ of fast neutrals."
  unit: Pa
  physics_domain: transport
  links:
  - name:fast_neutral_pressure
  - name:perpendicular_fast_particle_pressure
  - name:parallel_neutral_velocity
  arguments:
  - name: fast_neutral_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/neutral/state/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/neutral/state/pressure_fast_parallel
    status: composed
- name: parallel_ion_state_velocity
  kind: scalar
  status: draft
  description: Projection of the ExB drift velocity of ions in a given charge state
    onto the direction parallel to the local magnetic field line.
  documentation: 'The parallel ion state velocity $v_{\parallel,Z}$ is the component
    of the fluid velocity $\boldsymbol{v}_Z$ of ions in charge state $Z$ resolved
    along the equilibrium magnetic field direction. It determines the convective transport
    of ions and their associated momentum, energy, and particle flux along field lines
    in the plasma core and edge. Measured via charge exchange recombination spectroscopy
    (CXRS) by analyzing the Doppler shift of impurity line emission resolved by charge
    state; typical values range from $10^3$ to $10^5$ m/s depending on plasma rotation
    and radial location. The full velocity vector is given by the parent quantity
    [ion_state_velocity](name:ion_state_velocity), which includes the poloidal component
    [poloidal_ion_state_velocity](name:poloidal_ion_state_velocity). For charge-state-averaged
    parallel flow, see [parallel_ion_velocity](name:parallel_ion_velocity).


    Sign convention: Positive when the flow is in the direction of the equilibrium
    magnetic field $\boldsymbol{B}$.'
  unit: m.s^-1
  physics_domain: transport
  links:
