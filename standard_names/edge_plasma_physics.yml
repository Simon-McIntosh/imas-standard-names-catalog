- name: toroidal_plasma_momentum_at_pedestal
  kind: scalar
  status: draft
  description: "Total plasma momentum in the toroidal \u03C6 direction of the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, summed over all ion species and electrons\
    \ and evaluated at the pedestal top."
  documentation: 'Toroidal plasma momentum at the pedestal top is the net linear momentum
    component along the toroidal direction of the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It is the pedestal-top value of the radial flux-surface function [toroidal_total_plasma_momentum](name:toroidal_total_plasma_momentum),
    summed over all ion species and electrons, and characterizes the rotation state
    at the edge transport barrier.


    The scalar is the total toroidal plasma momentum function evaluated at the pedestal
    flux surface:


    $$

    P_\phi^{\mathrm{ped}} = P_\phi(\rho_{\mathrm{ped}}) = \int_{V(\rho_{\mathrm{ped}})}
    \sum_s m_s n_s(\mathbf{x}) v_{\phi,s}(\mathbf{x})\, dV

    $$


    where $P_\phi^{\mathrm{ped}}$ and $P_\phi$ have units kg m s^-1, $\rho_{\mathrm{ped}}$
    is the pedestal-top value of a dimensionless radial flux-surface label such as
    the normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$, $V(\rho_{\mathrm{ped}})$
    is the plasma volume enclosed by that flux surface, $s$ indexes ion species and
    electrons, $m_s$ is species mass in kg, $n_s$ is number density in m^-3, $v_{\phi,s}$
    is toroidal velocity in m s^-1, and $dV$ is the volume element in m^3.


    In practice this quantity is derived from equilibrium geometry together with density,
    composition, and toroidal-flow estimates near the pedestal top. The pedestal-top
    flux surface is commonly identified from the edge pressure, temperature, or density
    gradient structure; ion flows may be constrained by spectroscopic measurements
    and momentum-balance modeling, while electron contributions are included in the
    species sum but are usually small because of the electron mass.


    Typical absolute magnitudes are about 10^-2-10 kg m s^-1 in medium-size tokamaks,
    and can reach 10-100 kg m s^-1 in large, high-density plasmas or cases with strong
    external torque. Values close to zero occur for weak rotation or when counter-directed
    species contributions nearly cancel.


    Sign convention: Positive when the net toroidal plasma momentum points in the
    direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame.'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum
  - name:toroidal_plasma_momentum_at_magnetic_axis
- name: toroidal_plasma_momentum_at_plasma_boundary
  kind: scalar
  status: draft
  description: Surface integral over the last closed magnetic flux surface of the
    major radius times the species-summed toroidal linear momentum density of all
    ion species and electrons. The boundary label specifies the surface over which
    the integration is performed; it is not a local point value, a flux-surface average,
    or an enclosed-volume integral.
  documentation: 'Toroidal plasma momentum at the plasma boundary is the surface integral,
    taken over the last closed magnetic flux surface, of the major radius weighted
    species-summed toroidal linear momentum density of the plasma. It characterizes
    the net toroidal momentum content carried by the boundary flux surface, combining
    contributions from all ion species and electrons, and serves as an outer reference
    for momentum-transport and edge-rotation studies.


    The boundary momentum is obtained by integrating the major-radius-weighted toroidal
    momentum density over the bounding surface:


    $$

    L_\phi^\mathrm{b} = \oint_{S_\mathrm{b}} R \sum_s m_s n_s v_{\phi,s} \, dS

    $$


    where $S_\mathrm{b}$ is the last closed magnetic flux surface, $R$ is the major
    radius in meters, $s$ runs over all ion species and electrons, $m_s$ is the species
    mass in kilograms, $n_s$ is the species number density in m^-3, and $v_{\phi,s}
    = \mathbf{v}_s \cdot \hat{\phi}$ is the toroidal velocity component in m.s^-1
    in the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ major radius, $\phi$
    toroidal angle, and $Z$ vertical height. The integrand $R \sum_s m_s n_s v_{\phi,s}$
    has units of kg.m^-1.s^-1, so its surface integral has units of kg.m.s^-1. Equivalently,
    this quantity equals the boundary surface area multiplied by the flux-surface
    average of the major-radius-weighted toroidal momentum density.


    In practice this quantity is reconstructed by combining species density and toroidal-rotation
    information with the reconstructed plasma geometry of the boundary flux surface,
    then applying the major-radius weighting and surface integration. Ion toroidal
    velocities are commonly constrained by spectroscopic rotation measurements, while
    species contributions that are not directly measured are inferred from transport,
    quasineutrality, and momentum-balance modeling.


    Typical absolute magnitudes range from roughly $10^{-3}$-$1$ kg.m.s^-1 in small
    and medium-size tokamaks and may reach larger values in strongly rotating or large-volume
    plasmas; values near zero occur when co-current and counter-current contributions
    nearly cancel.


    Sign convention: Positive when the net toroidal momentum points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
