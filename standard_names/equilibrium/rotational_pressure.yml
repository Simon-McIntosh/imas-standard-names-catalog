name: rotational_pressure
status: draft
cocos_transformation_type: one_like
description: Centrifugal contribution to the total plasma pressure arising from bulk
  toroidal rotation of the plasma.
documentation: "The rotational pressure $p_{\\rm rot}$ (Pa) represents the additional\
  \ pressure-like term that appears in the momentum-balanced Grad\u2013Shafranov equation\
  \ when the plasma rotates toroidally at angular velocity $\\Omega(\\psi)$. It is\
  \ given by $p_{\\rm rot} = \\frac{1}{2} m_i n_i \\Omega^2 (R^2 - R_{\\rm ref}^2)$,\
  \ where $m_i$ is the dominant ion mass, $n_i$ the ion density, $R$ the major radius,\
  \ and $R_{\\rm ref}$ a reference major radius on the same flux surface. For typical\
  \ DIII-D or JET plasmas with core toroidal velocities of $\\sim$100\u2013300 km/s,\
  \ $p_{\\rm rot}$ can reach 5\u201315% of the thermal pressure $p_{\\rm th}$, becoming\
  \ significant for equilibrium reconstruction and stability analysis. The quantity\
  \ is measured indirectly via charge-exchange recombination spectroscopy (CXRS) providing\
  \ $v_\\phi$ and $n_i$ profiles, which are then used to compute $p_{\\rm rot}$. Including\
  \ rotational pressure in the equilibrium is essential for high-beta, strongly rotating\
  \ plasmas. See also `plasma_current` for the related equilibrium context."
validity_domain: ''
