      parent: Boron (B)
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Boron (B).
      kind: template
- name: density_over_scrape_off_layer
  kind: scalar
  status: active
  description: Number density of a specified particle population serving as the low-density
    baseline on the open-field-line side of an edge-pedestal fit.
  documentation: 'This quantity is the number density assigned to a specified particle
    population as the low-density baseline of an analytic edge-pedestal representation
    on the open-field-line side of the confined plasma. It represents the offset from
    which the pedestal rise is described.


    For a fitted density representation, the baseline is the offset term:


    $$

    n_{\mathrm{fit}}(\xi)=n_{\mathrm{base}}+\Delta n(\xi)

    $$


    where $n_{\mathrm{fit}}$ is the fitted number density, $n_{\mathrm{base}}$ is
    the baseline number density, $\Delta n(\xi)$ is the pedestal-dependent contribution,
    and $\xi$ is an edge coordinate.


    The particle population is specified by each specialization; [electron density
    over scrape-off layer](name:electron_density_over_scrape_off_layer) is one concrete
    instance. The baseline is distinct from the density at the plasma boundary, represented
    by [density at plasma boundary](name:density_at_plasma_boundary), and from the
    density at the pedestal top, represented by [density at pedestal top](name:density_at_pedestal_top).'
  unit: m^-3
