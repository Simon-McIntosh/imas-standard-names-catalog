- name: halo_current
  kind: vector
  status: draft
  description: Vector current flowing in the open-field-line halo plasma between the
    last closed flux surface and the first wall during a disruption or vertical displacement
    event.
  documentation: "Halo current is the electric current vector carried by the tenuous\
    \ open-field-line plasma (the halo region) that forms between the last closed\
    \ flux surface and the first wall or divertor plates when the plasma column moves\
    \ radially or vertically during a disruption or vertical displacement event. Because\
    \ this current must close through the surrounding conducting wall structures,\
    \ it generates net electromagnetic body forces on plasma-facing components whose\
    \ magnitude and distribution depend on both the total halo current and its spatial\
    \ asymmetry.\n\nThe vector decomposes into a [toroidal component](name:toroidal_halo_current)\
    \ $I_\\phi$, directed along $\\hat{\\phi}$ in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, and a [poloidal component](name:poloidal_halo_current) $I_\\\
    theta$, directed along increasing poloidal angle $\\theta$ in the flux-coordinate\
    \ system $(\\psi, \\theta, \\phi)$. Current continuity $\\nabla \\cdot \\mathbf{J}_\\\
    mathrm{halo} = 0$ within the halo region couples these two projections and makes\
    \ their ratio a key parameter for estimating non-uniform wall loading, quantified\
    \ via the toroidal peaking factor.\n\nHalo currents are measured using poloidal\
    \ and toroidal arrays of Rogowski coils, saddle loops, and current shunts embedded\
    \ in the first wall and divertor structures. The total integrated amplitude and\
    \ its toroidal asymmetry are primary inputs for mechanical design of plasma-facing\
    \ components.\n\nIn large present-day tokamaks, the integrated halo current reaches\
    \ 10\u201330% of the pre-disruption plasma current during major disruptions, with\
    \ values approaching 50% during severe vertically unstable events.\n\nSign convention:\
    \ Positive when $I_\\phi$ flows in the direction of increasing toroidal angle\
    \ $\\phi$ and $I_\\theta$ flows in the direction of increasing poloidal angle\
    \ $\\theta$."
  unit: A
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_halo_current
  - name:poloidal_halo_current
- name: ion_temperature
  kind: scalar
  status: draft
  description: Kinetic temperature of the local ion population expressed as thermal
    energy per ion in electronvolts. It is defined from random motion relative to
    the ion bulk flow, excluding directed flow energy; combined ion populations use
    density weighting.
  documentation: 'Ion temperature $T_i$ is the scalar thermodynamic temperature associated
    with the random kinetic motion of ions at a plasma location, expressed as an energy
    per ion in electronvolts. It excludes kinetic energy in the bulk ion flow and
    represents the isotropic part of the ion thermal energy; for an anisotropic distribution
    it corresponds to one third of the trace of the ion temperature tensor.


    For an ion population with velocity distribution $f_i(\mathbf{v})$, the kinetic
    definition in the eV convention is:


    $$

    T_i = \frac{m_i}{3 e n_i} \int |\mathbf{v}-\mathbf{u}_i|^2 f_i(\mathbf{v})\,d^3v

    $$


    where $m_i$ is the ion mass, $e$ is the elementary charge, $n_i = \int f_i\,d^3v$
    is the ion number density in m$^{-3}$, and $\mathbf{u}_i = n_i^{-1}\int \mathbf{v}
    f_i\,d^3v$ is the ion bulk velocity. The integral gives the random kinetic energy
    density; division by $e$ converts joules per ion to electronvolts. The equivalent
    kelvin temperature is $T_K = eT_i/k_B$, and an isotropic ion pressure satisfies
    $p_i = n_i e T_i$.


    If a reported ion temperature represents several ionization states or ion species,
    the combined value is the density-weighted average of the constituent temperatures,
    $T_i = \sum_a n_a T_a / \sum_a n_a$. This weighting preserves the total isotropic
    thermal pressure, $p_i = e\sum_a n_a T_a$, when the constituents are represented
    by a single effective ion temperature.


    Ion temperature is commonly inferred from Doppler broadening of charge-exchange
    or passive ion emission spectra, from neutron or collective-scattering measurements
    in fusion plasmas, and from boundary-plasma probe analysis where appropriate.
    In simulations and transport analysis it is obtained from ion energy balance,
    including heating, radiation and charge-exchange losses, collisional exchange
    with electrons, and radial or parallel heat transport.


    Typical core ion temperatures in tokamak plasmas are about 1,000-20,000 eV, with
    high-performance cores sometimes exceeding this range. Pedestal and edge values
    are often 100-3,000 eV, while scrape-off-layer and divertor ion temperatures are
    commonly 1-100 eV depending on plasma regime and detachment state.'
  unit: eV
  physics_domain: magnetohydrodynamics
  links:
  - name:ion_temperature_at_plasma_boundary
  - name:ion_temperature_at_midplane
  - name:ion_temperature_at_wall
