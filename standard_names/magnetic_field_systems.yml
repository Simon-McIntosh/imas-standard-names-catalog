  status: active
  description: "Radial magnetic-field component at the geometric centroid of a ferritic\
    \ element, projected onto the outward major-radius direction in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the magnetic-field component evaluated at a ferritic\
    \ element\u2019s geometric centroid and projected along the cylindrical major-radius\
    \ direction. It describes the applied magnetic field, not the ferritic element\u2019\
    s magnetization.\n\nThe radial component is defined by\n\n$$\nB_R = \\mathbf{B}\
    \ \\cdot \\hat{R}\n$$\n\nwhere $\\mathbf{B}$ is the magnetic-field vector and\
    \ $\\hat{R}$ is the outward major-radius unit vector in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. The evaluation point is the ferritic-element centroid;\
    \ its radial location is given by the [radial coordinate of the ferritic element\
    \ centroid](name:radial_coordinate_of_ferritic_element_centroid). Together with\
    \ the [vertical magnetic field at the ferritic element centroid](name:vertical_magnetic_field_at_ferritic_element_centroid)\
    \ and [toroidal magnetic field at the ferritic element centroid](name:toroidal_magnetic_field_at_ferritic_element_centroid),\
    \ it specifies the local field vector.\n\nSign convention: Positive when $B_R$\
    \ points toward increasing major radius $R$."
  unit: T
