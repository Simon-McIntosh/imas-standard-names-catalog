    enhanced_context:
      description: "Flux-surface-averaged wave-driven parallel current density (J\u2225\
        ) per toroidal mode number (n\u03C6), providing the spectral decomposition\
        \ of RF-driven parallel current as a function of radius and mode index."
      kind: llm
- name: per_toroidal_mode_current_due_to_wave_driven_current_drive
  kind: scalar
  status: active
  description: Toroidal mode current due to wave-driven current drive is the cumulative
    toroidal plasma current enclosed by a flux surface for one toroidal Fourier mode.
  documentation: 'Toroidal mode current due to wave-driven current drive is the cumulative
    toroidal plasma current enclosed by a magnetic flux surface and attributed to
    one toroidal Fourier mode. It represents the wave-particle-interaction contribution
    only; inductive and non-wave non-inductive current sources are excluded.


    The cumulative mode current inside the surface labeled by normalized toroidal
    flux radius $\rho_{\mathrm{tor,norm}}$ is defined by:


    $$

    I_{\mathrm{wcd},n}(\rho_{\mathrm{tor,norm}}) = \int_{S(\rho_{\mathrm{tor,norm}})}
    \widetilde{\mathbf{j}}_{\mathrm{wcd},n}(R,Z) \cdot \hat{\phi}\,dR\,dZ

    $$


    where $I_{\mathrm{wcd},n}$ is the mode-resolved current, $n$ is the dimensionless
    toroidal Fourier mode number, $\widetilde{\mathbf{j}}_{\mathrm{wcd},n}$ is the
    corresponding wave-driven current-density coefficient in A m$^{-2}$, $\hat{\phi}$
    is the toroidal unit vector, $R$ is major radius in m, $Z$ is vertical height
    in m, and $S$ is the enclosed poloidal cross-section.


    At the outer closed surface, this quantity is the single-mode contribution to
    [current due to wave-driven current drive](name:current_due_to_wave_driven_current_drive).
    Unlike [toroidal current due to wave-driven current drive](name:toroidal_current_due_to_wave_driven_current_drive),
    it is not summed over toroidal Fourier modes; its local density counterpart is
    [per-toroidal-mode current density due to wave-driven current drive](name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive).


    Sign convention: Positive when the specified mode''s net current contribution
    flows in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:current_due_to_wave_driven_current_drive
  - name:toroidal_current_due_to_wave_driven_current_drive
  - name:per_toroidal_mode_current_density_due_to_wave_driven_current_drive
  arguments:
  - name: current_due_to_wave_driven_current_drive
    operator: per_toroidal_mode
    operator_kind: qualifier
  sources:
  - dd_path: waves/coherent_wave/global_quantities/current_phi_n_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-global_quantities-current_phi_n_phi
    dd_documentation:
