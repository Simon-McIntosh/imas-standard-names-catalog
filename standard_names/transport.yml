- name: oxygen_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of oxygen ions at the magnetic axis, the innermost flux-surface
    singular point where the gradient of the poloidal magnetic flux vanishes.
  documentation: 'The oxygen ion number density at the magnetic axis gives the on-axis
    value of the oxygen impurity concentration radial profile, evaluated at the point
    $(R_\mathrm{axis}, Z_\mathrm{axis})$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame where $\nabla\psi = 0$.


    On-axis oxygen density enters the plasma quasineutrality constraint:


    $$

    n_e = \sum_i Z_i \, n_i

    $$


    where $n_e$ is the electron number density, $Z_i$ is the mean charge number of
    the $i$-th ion species, and the sum runs over all confined ion populations including
    oxygen. Through this relation, a higher on-axis oxygen concentration dilutes the
    hydrogenic fuel-ion population and increases core radiative power losses via line
    emission.


    The on-axis value is inferred from charge-exchange recombination spectroscopy
    targeting oxygen emission lines, vacuum-ultraviolet spectroscopy, or impurity
    transport modeling constrained by line-integrated brightness measurements. It
    is evaluated alongside analogous impurity species such as [carbon_density_at_magnetic_axis](name:carbon_density_at_magnetic_axis),
    [neon_density_at_magnetic_axis](name:neon_density_at_magnetic_axis), and [nitrogen_density_at_magnetic_axis](name:nitrogen_density_at_magnetic_axis),
    all members of the [density_at_magnetic_axis](name:density_at_magnetic_axis) family.


    Sign convention: Positive when oxygen ions are present in the confined plasma.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:carbon_density_at_magnetic_axis
  - name:neon_density_at_magnetic_axis
  - name:nitrogen_density_at_magnetic_axis
  - name:density_at_magnetic_axis
