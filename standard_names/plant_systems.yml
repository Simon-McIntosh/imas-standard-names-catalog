- name: net_power_of_plant_system
  kind: scalar
  status: draft
  description: Net electrical power of a plant system, equal to generated electrical
    power minus internal operational electrical consumption within the same system
    boundary.
  documentation: 'Net electrical power of a plant system is the algebraic electrical
    power delivered by that system after subtracting the electrical power it consumes
    for its own operation. It indicates whether the chosen system boundary is a net
    source or net sink of electricity at a given operating condition.


    For a defined plant-system boundary, the net power is


    $$

    P_\mathrm{net} = P_\mathrm{elec,gen} - P_\mathrm{elec,cons}

    $$


    where $P_\mathrm{net}$, $P_\mathrm{elec,gen}$, and $P_\mathrm{elec,cons}$ are
    electrical powers in W evaluated over the same time interval. $P_\mathrm{elec,gen}$
    is the electrical power produced within the boundary, such as generator-terminal
    or power-conversion output, and $P_\mathrm{elec,cons}$ is the operational electrical
    power drawn by equipment inside the same boundary.


    In practice, this quantity is computed from electrical metering or plant power-accounting
    models by summing generation feeds and subtracting allocated internal loads such
    as pumps, compressors, cryogenic equipment, control systems, power-conversion
    auxiliaries, and other parasitic consumers. The system boundary must be applied
    consistently: loads outside the boundary are excluded, while recirculating power
    and auxiliary loads inside the boundary are included. During startup, shutdown,
    standby, or operation of systems without local generation, the net power can be
    negative.


    Typical values depend strongly on the boundary. Purely consuming plant systems
    are often about -1e3 to -1e8 W, large balance-of-plant or power-conversion systems
    can range from near 0 W to 1e9 W, and whole-plant net electrical output for power-plant-scale
    devices is commonly of order 1e8-2e9 W. Values near 0 W indicate that internal
    electrical consumption nearly balances local electrical generation.


    Sign convention: Positive when the system exports electrical power across its
    boundary after subtracting internal operational consumption.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_thermal_power_at_inlet
  - name:power_of_plant_system
  sources:
