- name: diagnostic_realtime_network_latency_upper_bound
  kind: scalar
  status: draft
  description: Maximum delay between physical signal arrival at the detector and data
    availability on the real-time control network.
  documentation: 'This scalar (in seconds) specifies the worst-case end-to-end latency
    for a given diagnostic subsystem, encompassing analog signal conditioning, digitization,
    data transfer, and network publication. It serves as a guaranteed upper bound
    for real-time plasma control algorithms that require deterministic timing: any
    feedback loop using this diagnostic must tolerate at least this delay. Values
    span from $\sim$10 $\mu$s for fast magnetics to $\sim$10 ms for computed quantities
    (e.g., density from interferometry). The latency is a static or slowly varying
    metadata parameter set during system commissioning and updated if hardware or
    firmware changes. It is common to all diagnostic types (magnetics, bolometry,
    barometry, neutron diagnostics, Langmuir probes, etc.) and is stored identically
    across their data structures.'
  unit: s
  cocos_transformation_type: one_like
  tags:
  - data-archival
  - real-time-control
  links: []
  validity_domain: ''
  constraints: []
- name: gauge_length_of_strain_sensor
  kind: scalar
  status: draft
  description: Physical length of the active sensing region of a strain gauge mounted
    on a structural or in-vessel component.
  documentation: 'The gauge length $L_g$ defines the spatial extent over which mechanical
    strain is averaged by a resistive or fiber-optic strain sensor. It directly affects
    the spatial resolution of strain measurements: shorter gauges resolve sharper
    gradients but produce weaker signals. For fusion-device structural monitoring,
    gauge lengths range from a few millimeters (high-resolution weld inspections)
    to several centimeters (global vessel deformation tracking). The measured strain
    $\varepsilon = \Delta L / L_g$ is referenced to this length, so accurate knowledge
    of $L_g$ is essential for converting raw sensor output to engineering strain.
    Strain sensors are bonded at defined attachment points whose coordinates are stored
    separately (see [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)).'
  unit: m
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: major_radius_of_barometry_gauge
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a neutral-pressure gauge in the cylindrical
    $(R, \phi, Z)$ machine frame.
  documentation: "This field records the major-radius position $R$ (in meters) of\
    \ a barometry gauge used to measure neutral gas pressure inside or near the vacuum\
    \ vessel. Accurate positioning is required to correlate local neutral pressure\
    \ readings with plasma edge conditions and to validate neutral-transport simulations\
    \ (e.g., EIRENE, DEGAS2). Barometry gauges are placed at various toroidal and\
    \ poloidal locations \u2014 divertor baffles, midplane ports, sub-divertor volumes\
    \ \u2014 with $R$ values ranging from the inner-wall radius to beyond the outer\
    \ limiter radius. On medium-size tokamaks, values span approximately 1.0\u2013\
    2.5 m; for ITER, 4\u20139 m. The toroidal angle and vertical coordinate of the\
    \ same gauge complete the 3-D position specification (see sibling names [toroidal_angle_of_diagnostic_component_centre](name:toroidal_angle_of_diagnostic_component_centre)\
    \ and [vertical_coordinate_of_diagnostic_component_centre](name:vertical_coordinate_of_diagnostic_component_centre))."
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cylindrical-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_diagnostic_component_centre
  kind: scalar
  status: draft
  description: Height ($Z$) coordinate of the geometric center of a diagnostic component
    in the tokamak cylindrical coordinate system.
  documentation: The vertical coordinate $Z$ (in m) locates the geometric center of
    a diagnostic sensor or component within the machine cylindrical coordinate system
    $(R, \phi, Z)$. This position is essential for mapping raw measurements to spatial
    locations in equilibrium reconstructions and for computing lines of sight in synthetic
    diagnostics. The value is referenced to the midplane ($Z = 0$), with positive
    $Z$ pointing upward. For in-vessel diagnostics in medium-to-large tokamaks, $Z$
    ranges from approximately $-2$ m to $+2$ m (JET, DIII-D) and up to $\pm 5$ m for
    ITER. This quantity is used across multiple diagnostic subsystems including magnetic
    probes, flux loops, Rogowski coils, and barometry gauges. See also [toroidal_angle_of_diagnostic_component_centre](name:toroidal_angle_of_diagnostic_component_centre)
    for the toroidal position coordinate.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: vertical_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Cartesian $Z$ (vertical) coordinate of the point where a sensor is
    mechanically attached to a structural component.
  documentation: This field records the vertical ($Z$) component of the sensor attachment-point
    position in the machine Cartesian coordinate system $(X, Y, Z)$, where $Z$ is
    aligned with the machine symmetry axis. Together with [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)
    and [y_coordinate_of_sensor_attachment_point](name:y_coordinate_of_sensor_attachment_point),
    it provides the complete 3-D location of each sensor mount. Accurate positioning
    is essential for correlating mechanical measurements (strain, displacement, acceleration)
    with structural finite-element models and for diagnosing asymmetric loading during
    disruptions. Values are in meters relative to the machine midplane; on medium-size
    tokamaks they range from approximately $-3$ m to $+3$ m.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: x_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Cartesian $X$ coordinate of the mechanical attachment point of a sensor
    on a structural or in-vessel component.
  documentation: This field stores the $X$ component (in meters) of the three-dimensional
    Cartesian position vector $(X, Y, Z)$ at which a sensor is physically mounted.
    Together with the companion $Y$ and $Z$ coordinates, it fully specifies the sensor
    location in the laboratory-fixed right-handed Cartesian frame. The value is time-independent
    for rigidly mounted sensors; for sensors on movable probes, the coordinate may
    be updated per plunge or stroke. The Cartesian representation complements the
    cylindrical $(R, \phi, Z)$ description used elsewhere in tokamak databases; the
    two are related by $X = R\cos\phi$ and $Y = R\sin\phi$. See also [y_coordinate_of_sensor_attachment_point](name:y_coordinate_of_sensor_attachment_point)
    and [vertical_coordinate_of_sensor_attachment_point](name:vertical_coordinate_of_sensor_attachment_point).
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: y_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: Cartesian $Y$ coordinate of the point where a sensor is mechanically
    attached to a structural component.
  documentation: This field records the $Y$ component of the attachment-point position
    vector in the machine Cartesian coordinate system $(X, Y, Z)$. Attachment points
    define where sensors (strain gauges, displacement transducers, accelerometers)
    are mechanically bonded to in-vessel or ex-vessel structures. Accurate knowledge
    of these coordinates is required to map sensor readings onto finite-element models
    of the vessel. Together with [x_coordinate_of_sensor_attachment_point](name:x_coordinate_of_sensor_attachment_point)
    and [vertical_coordinate_of_sensor_attachment_point](name:vertical_coordinate_of_sensor_attachment_point),
    the full 3-D location is specified. Values are in meters, with sub-millimeter
    accuracy required for localized strain or vibration analysis.
  unit: m
  cocos_transformation_type: one_like
  tags:
  - cartesian-coordinates
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
