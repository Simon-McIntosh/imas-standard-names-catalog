        of the diffracting crystal used in the X-ray crystal spectrometer channel.
      kind: llm
- name: radius_of_filter
  kind: scalar
  status: active
  description: Geometric radius of the circular aperture associated with a diagnostic
    filter window, measured from its center to the circumferential edge.
  documentation: 'The filter-window aperture radius is the Euclidean distance from
    the aperture center to any point on its circular boundary. It characterizes the
    opening geometry of the filter window and is non-negative.


    $$

    r = \left\|\mathbf{x}_{\mathrm{edge}}-\mathbf{x}_{\mathrm{center}}\right\|

    $$


    where $r$ is the aperture radius, and $\mathbf{x}_{\mathrm{edge}}$ and $\mathbf{x}_{\mathrm{center}}$
    are the position vectors of a boundary point and the aperture center, respectively.


    This quantity applies specifically to a circular filter-window aperture and is
    distinct from the [radius of a diagnostic aperture](name:radius_of_diagnostic_aperture)
    when that aperture is not part of a filter window.'
