    dd_path: nbi/unit/beamlets_group/width_vertical
    status: composed
- name: wave_driven_current
  kind: scalar
  status: draft
  description: Total toroidal current driven by wave-particle interactions, computed
    from a stand-alone wave propagation and damping calculation.
  documentation: 'The wave-driven current is the toroidal component of the non-inductive
    plasma current generated by the transfer of wave momentum to the charged particle
    population through resonant wave-particle interactions, such as Landau damping
    or cyclotron damping. This quantity is calculated from a stand-alone ray-tracing
    or full-wave code that solves the wave propagation and computes the driven current
    density $j_{\mathrm{RF}}(\psi)$ using a kinematic model (e.g., adjoint or Fokker-Planck),
    then integrates over the plasma cross-section to obtain the total current $I_{\mathrm{RF}}
    = \int j_{\mathrm{RF}} \, d\mathbf{A}$ in amperes. Physically, the wave-driven
    current is the product of the absorbed power density, the current-drive efficiency,
    and the plasma volume; for lower hybrid waves in a medium-size tokamak, typical
    values range from 50 kA to 300 kA per MW of launched power. The stand-alone calculation
    does not include self-consistent feedback from the evolving plasma equilibrium
    or distribution function. Compare with the toroidal-mode-resolved component [per_toroidal_mode_wave_driven_current](name:per_toroidal_mode_wave_driven_current)
    and the neoclassical bootstrap contribution [current_due_to_bootstrap](name:current_due_to_bootstrap).


    Sign convention: Positive when the driven current flows in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise viewed from above).'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_wave_driven_current
  - name:current_due_to_bootstrap
  sources:
  - id: dd:waves/coherent_wave/global_quantities/current_phi
    dd_path: waves/coherent_wave/global_quantities/current_phi
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/current_tor
    dd_path: waves/coherent_wave/global_quantities/current_tor
    status: composed
