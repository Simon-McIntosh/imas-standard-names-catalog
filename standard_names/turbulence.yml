- name: parallel_normalized_perturbed_vector_potential_real_part
  kind: complex
  status: draft
  description: Real component of the complex normalized perturbed vector potential
    parallel to the equilibrium magnetic field, expressed versus field-line poloidal
    angle in a gyrokinetic eigenmode. It depends on the selected gage, reference vector-potential
    scale, and arbitrary complex eigenfunction phase.
  documentation: 'Parallel normalized perturbed vector potential real part is the
    real component of the complex eigenfunction representing the perturbation of the
    vector potential projected along the equilibrium magnetic-field direction. It
    describes the electromagnetic perturbation associated with parallel electric-field
    and magnetic-flutter dynamics after a gage and complex phase have been fixed.
    The quantity is dimensionless because the physical vector potential is divided
    by a real, positive reference vector-potential scale.


    The real component is defined from the complex normalized eigenfunction by


    $$

    a_{\parallel,R}(\theta) = \operatorname{Re}\!\left[\frac{\delta A_\parallel(\theta)}{A_{\parallel,\mathrm{ref}}}\right]

    $$


    where $\delta A_\parallel$ is the complex perturbed vector potential parallel
    to the equilibrium magnetic field in T m, $A_{\parallel,\mathrm{ref}}$ is a real
    positive reference vector-potential scale in T m, $\theta$ is the field-line poloidal
    angle in radians, and $a_{\parallel,R}$ is dimensionless. A reproducible normalization
    should state the physical scale used for $A_{\parallel,\mathrm{ref}}$; a common
    gyrokinetic choice is $B_\mathrm{ref}\rho_\mathrm{ref}$, with $B_\mathrm{ref}$
    a reference magnetic-field magnitude in tesla and $\rho_\mathrm{ref}$ a reference
    gyroradius in meters.


    In linear gyrokinetic calculations, $\delta A_\parallel$ is obtained as part of
    a complex eigenmode, so its overall amplitude and phase are arbitrary until an
    eigenfunction normalization and phase convention are imposed. The electromagnetic
    gage must also be specified, because the parallel vector potential is gage dependent.
    Together with parallel_normalized_perturbed_vector_potential_imaginary_part, this
    quantity forms the complex normalized field [parallel_normalized_perturbed_vector_potential](name:parallel_normalized_perturbed_vector_potential_amplitude)
    through $a_\parallel=a_{\parallel,R}+i a_{\parallel,I}$; a normalized modulus
    would be $|a_\parallel|=(a_{\parallel,R}^2+a_{\parallel,I}^2)^{1/2}$ and is not
    the same as this signed real component.


    No universal physical range exists for a linear eigenfunction, because its amplitude
    can be rescaled without changing the mode structure. With a peak-modulus convention
    such as $\max_\theta |a_\parallel|=1$, values of the real part usually lie between
    -1 and 1; with an RMS convention, the RMS value is order 1 by construction. Values
    from different calculations are directly comparable only when the same gage, normalization
    scale, amplitude normalization, and phase convention are used.


    Sign convention: Positive when the perturbed vector potential is projected along
    the positive equilibrium magnetic-field direction and its normalized complex value
    lies in the positive real direction after applying the stated gage, real positive
    normalization scale, and eigenfunction phase convention.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_perturbed_vector_potential_amplitude
  arguments:
  - name: parallel_normalized_perturbed_vector_potential
    operator: real_part
