- name: parallel_momentum_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Parallel-channel (magnetic-flutter) component of the normalized toroidal
    momentum flux driven by the perturbed parallel electromagnetic vector potential
    in gyrokinetic turbulence.
  documentation: 'In electromagnetic gyrokinetic turbulence, the radial flux of toroidal
    angular momentum from the perturbed parallel vector potential $\delta A_\parallel$
    is carried by two distinct channels: a perpendicular ($E \times B$-like drift)
    channel and a parallel (magnetic-flutter) channel. This quantity captures the
    magnetic-flutter contribution, in which particles streaming along radially displaced
    field lines induced by $\delta A_\parallel$ carry toroidal momentum across flux
    surfaces. The complementary perpendicular channel is [perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential](name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential),
    and the combined $\delta A_\parallel$ momentum flux is given by [momentum_flux_due_to_perturbed_parallel_vector_potential](name:momentum_flux_due_to_perturbed_parallel_vector_potential).


    In the normalized gyrokinetic framework, the flutter-driven toroidal momentum
    flux is defined as:


    $$

    \Pi_{\mathrm{tor},\parallel}^{\delta A_\parallel} = \sum_s \left\langle \int d^3v
    \; m_s v_\mathrm{tor} \frac{v_\parallel \delta B_r}{B_0} \, g_s \right\rangle_\psi

    $$


    where $m_s$ is the mass of species $s$, $v_\mathrm{tor}$ is the toroidal particle
    velocity, $v_\parallel$ is the parallel velocity, $\delta B_r$ is the radial magnetic
    perturbation induced by $\delta A_\parallel$, $B_0$ is the equilibrium magnetic
    field magnitude, $g_s$ is the non-adiabatic part of the perturbed distribution
    function, and $\langle \cdots \rangle_\psi$ denotes flux-surface averaging; the
    result is normalized to dimensionless gyrokinetic units.


    This flux is evaluated in nonlinear gyrokinetic simulations by summing over the
    wavevector spectrum in the rotating frame. The flutter contribution becomes significant
    at high plasma $\beta = 2\mu_0 p / B_0^2$ (where $p$ is total pressure and $\mu_0$
    is the permeability of free space), when magnetic fluctuations are large. The
    analogous quantity for compressional magnetic fluctuations is [parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field](name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field).


    Sign convention: Positive when the parallel-channel toroidal momentum flux is
    directed radially outward from the magnetic axis, representing net outward transport
    of toroidal angular momentum.'
  unit: '1'
  physics_domain: turbulence
