- name: parallel_current_density
  kind: scalar
  status: draft
  description: Signed scalar projection of the total plasma current density onto the
    local magnetic-field direction. For the total current it includes inductive Ohmic,
    neoclassical bootstrap, and externally driven non-inductive contributions; positive
    values indicate current flowing along the field.
  documentation: 'The parallel current density $j_\parallel$ is the field-aligned
    scalar component of the plasma [current_density](name:current_density). In its
    total-current meaning it is closely related to [parallel_total_current_density](name:parallel_total_current_density)
    and combines inductive Ohmic current, neoclassical bootstrap current, and externally
    driven non-inductive current contributions.


    The local field-aligned projection is defined by:


    $$

    j_\parallel = \mathbf{J}\cdot\hat{\mathbf{b}} = \frac{\mathbf{J}\cdot\mathbf{B}}{|\mathbf{B}|}

    $$


    where $j_\parallel$ is the parallel current density in A.m^-2, $\mathbf{J}$ is
    the total current-density vector in A.m^-2, $\mathbf{B}$ is the local magnetic-field
    vector in T, and $\hat{\mathbf{b}}=\mathbf{B}/|\mathbf{B}|$ is the dimensionless
    unit vector along the magnetic field.


    This local projection should be distinguished from flux-surface-averaged parallel
    current-density conventions such as $\langle \mathbf{J}\cdot\mathbf{B}\rangle/B_0$,
    where $B_0$ is a reference magnetic-field magnitude in T. Mechanism-specific quantities
    such as [parallel_current_density_due_to_bootstrap](name:parallel_current_density_due_to_bootstrap)
    may use such an averaged normalization and represent only one contribution, rather
    than the total local field-aligned current density.


    In equilibrium analysis, $j_\parallel$ is inferred from the reconstructed current-density
    and magnetic-field distributions constrained by magnetic measurements and plasma
    profiles. In transport and magnetohydrodynamic modeling, it is commonly computed
    by summing the relevant current components and projecting the result along the
    local magnetic field; it strongly affects the safety-factor and magnetic-shear
    profiles.


    Representative tokamak values are highly machine- and scenario-dependent. Total
    core values are often of order 10^5-10^7 A.m^-2, while edge, weak-current, or
    current-reversal regions can be much closer to 0 A.m^-2 and may have either sign.


    Sign convention: Positive when the net current-density vector has a component
    in the direction of the local magnetic-field vector $\mathbf{B}$.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:current_density
  - name:parallel_diamagnetic_current_density
  sources:
