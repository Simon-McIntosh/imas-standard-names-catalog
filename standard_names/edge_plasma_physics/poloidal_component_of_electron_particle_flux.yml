name: poloidal_component_of_electron_particle_flux
status: draft
description: Poloidal projection of the electron particle flux density, giving the
  net rate of electron transport per unit area in the poloidal direction.
documentation: "The poloidal component of the electron particle flux $\\Gamma_{e,\\\
  theta}$ (m$^{-2}$ s$^{-1}$) represents the number of electrons crossing a unit area\
  \ per unit time along the poloidal ($\\hat{\\theta}$) direction. In the fluid framework\
  \ it decomposes as $\\Gamma_{e,\\theta} = n_e v_{e,\\theta}$, where $n_e$ is the\
  \ electron density (m$^{-3}$) and $v_{e,\\theta}$ the poloidal electron drift velocity\
  \ (m/s), which includes $E \\times B$, diamagnetic, and parallel-projected contributions.\
  \ In edge codes such as SOLPS-ITER, $\\Gamma_{e,\\theta}$ is resolved on a general\
  \ grid description (GGD) and governs poloidal particle redistribution toward the\
  \ divertor. Typical SOL values span $10^{19}$\u2013$10^{23}$ m$^{-2}$ s$^{-1}$ depending\
  \ on density regime and proximity to recycling surfaces. Ambipolarity often constrains\
  \ $\\Gamma_{e,\\theta} \\approx \\sum_j Z_j \\Gamma_{j,\\theta}$ where $Z_j$ is\
  \ the charge state."
