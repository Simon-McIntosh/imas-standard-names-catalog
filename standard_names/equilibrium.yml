- name: upper_outer_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless Luce shape coefficient measuring how the upper outboard
    (low-field-side) corner of the plasma boundary departs from the reference ellipse
    defined by boundary minor radius, upper elongation, and upper triangularity.
  documentation: 'The upper outer squareness $\zeta_{uo}$ is one of four corner-specific
    shape parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the upper outer quadrant of the plasma cross-section boundary deviates
    from the reference ellipse defined by the boundary minor radius $a$, upper elongation
    $\kappa_u$, and upper triangularity $\delta_u$. In the poloidal cross-section
    expressed in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is major
    radius and $Z$ is vertical height, this quadrant is the large-$R$, larger-$Z$
    corner relative to the boundary shape center.


    With poloidal parameter $\theta$ increasing from the outboard midplane point to
    the top point, the upper-outboard Luce boundary segment is parameterized by


    $$

    \begin{aligned}

    R(\theta) &= R_0 + a\cos\left[\theta + \arcsin(\delta_u)\sin\theta - \zeta_{uo}\sin(2\theta)\right],\\

    Z(\theta) &= Z_0 + \kappa_u a\sin\left[\theta + \zeta_{uo}\sin(2\theta)\right],\quad
    0 \le \theta \le \frac{\pi}{2}.

    \end{aligned}

    $$


    where $(R(\theta), Z(\theta))$ is the boundary point in the poloidal cross-section,
    $R_0$ and $Z_0$ are the shape-center coordinates, $a$ is the boundary minor radius,
    $\kappa_u$ is the upper elongation, and $\delta_u$ is the upper triangularity.


    The value $\zeta_{uo}=0$ is the reference-ellipse case for the upper-outboard
    quadrant after $a$, $\kappa_u$, and $\delta_u$ have been fixed; nonzero values
    describe residual corner shaping rather than minor radius, elongation, or triangularity.
    Together with [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary),
    [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    and [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    it forms the four-corner boundary squareness decomposition; [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    combines the two outboard corner contributions, while [squareness_of_plasma_boundary](name:squareness_of_plasma_boundary)
    is the single-coefficient boundary summary.


    Sign convention: Positive when the upper outer boundary corner lies outside the
    reference ellipse at the same poloidal parameter, i.e., toward larger $R$ and
    larger $Z$ relative to the shape center in the right-handed cylindrical $(R, \phi,
    Z)$ frame where $R$ is major radius and $Z$ is vertical height.'
  unit: '1'
