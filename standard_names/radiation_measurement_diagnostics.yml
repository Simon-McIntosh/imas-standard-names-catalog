        isotope ratio analysis to account for charge-exchange-born fast neutrals.
      kind: llm
- name: neutron_energy
  kind: scalar
  status: active
  description: Kinetic energy carried by an individual fusion-born neutron, serving
    as the energy coordinate for neutron emission and transport descriptions.
  documentation: 'The neutron kinetic energy is the translational energy carried by
    one neutron produced in a fusion reaction. It characterizes the energy distribution
    of emitted neutrons rather than their total production rate or transported power.


    $$

    E_n = \frac{1}{2}m_n v_n^2

    $$


    where $E_n$ is the neutron kinetic energy, $m_n$ is the neutron mass, and $v_n$
    is the neutron speed; the result is converted from joules to eV. The quantity
    applies to individual fusion-born neutrons and may vary with reaction channel
    and emission conditions. The corresponding integrated production rate is [neutron
    flux](name:neutron_flux), while its local source distribution is described by
    [emissivity due to fusion](name:emissivity_due_to_fusion).'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutron_flux
  - name:emissivity_due_to_fusion
  sources:
  - dd_path: neutron_diagnostic/detector/energy_band/energies
    dd_version: 4.1.0
