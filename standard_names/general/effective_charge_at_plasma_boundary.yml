name: effective_charge_at_plasma_boundary
status: draft
cocos_transformation_type: one_like
description: Effective ion charge $Z_{\rm eff}$ evaluated at the last closed flux
  surface (separatrix), characterizing edge impurity content.
documentation: The effective charge $Z_{\rm eff} = \sum_s n_s Z_s^2 / n_e$ at the
  separatrix (last closed flux surface) quantifies impurity concentration at the interface
  between the confined plasma and the scrape-off layer. This value critically influences
  parallel heat transport, sheath physics, and the boundary conditions for core transport
  modeling. Typical separatrix $Z_{\rm eff}$ values range from 1.5 to 4 and can be
  elevated when impurity seeding (nitrogen, neon, argon) is applied for divertor power
  exhaust control. The quantity is inferred from visible bremsstrahlung spectroscopy
  or from impurity density profiles extrapolated to the separatrix via equilibrium
  reconstruction. See also `effective_charge_at_pedestal` for the pedestal-top value
  and `flux_surface_averaged_effective_charge_of_plasma_boundary` for the flux-surface-averaged
  counterpart.
