- name: total_ion_particle_source
  kind: scalar
  status: draft
  description: Net rate at which ion particles are added to or removed from the plasma,
    integrated over the full plasma volume and summed over all ion species.
  documentation: 'The total ion particle source $S_{i,\mathrm{tot}}$ represents the
    plasma-volume integral of all processes that create or destroy ions, including
    ionization of neutrals, charge exchange, recombination, pellet injection, and
    gas puffing, summed across every ion species. It satisfies $\frac{dN_i}{dt} =
    S_{i,\mathrm{tot}}$, where $N_i$ is the total number of ions in the plasma volume.
    In steady state, quasi-neutrality requires $S_{i,\mathrm{tot}} \approx$ [electron_particle_source](name:electron_particle_source),
    so comparing the two provides a consistency check on source bookkeeping. The cumulative
    radial profile of the source is described by [total_ion_particle_source_inside_flux_surface](name:total_ion_particle_source_inside_flux_surface),
    which integrates up to a given flux surface rather than over the full volume.
    Typical magnitudes range from $10^{19}$ to $10^{22}$ s$^{-1}$ depending on plasma
    density, heating scenario, and fueling method. The quantity is evaluated from
    transport solver source terms or from neutral Monte-Carlo codes coupled to the
    plasma; the implicit linearized component used in solver time-stepping is captured
    separately by [implicit_part_of_total_ion_particle_source](name:implicit_part_of_total_ion_particle_source).


    Sign convention: Positive when there is a net creation of ions in the plasma volume
    (net particle source); negative when ion losses exceed production (net particle
    sink).'
  unit: s^-1
  physics_domain: transport
  links:
  - name:electron_particle_source
  - name:total_ion_particle_source_inside_flux_surface
  - name:implicit_part_of_total_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/global_quantities/total_ion_particles
    dd_path: core_sources/source/global_quantities/total_ion_particles
    status: composed
- name: total_ion_particle_source_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of the total ion particle source rate, summed
    over all ion species, enclosed within a given flux surface.
  documentation: "The total ion particle source inside a flux surface quantifies the\
    \ net rate at which ions from all species are generated within the volume bounded\
    \ by the flux surface at normalized poloidal flux label $\\rho$. It is defined\
    \ as $S_{i,\\mathrm{tot}}(\\rho) = \\int_0^\\rho \\sum_s s_{n,s}(\\rho') \\, dV'$,\
    \ where $s_{n,s}$ is the volumetric particle source rate for ion species $s$ and\
    \ the integral is taken over the plasma volume enclosed within the flux surface.\
    \ This quantity is the driving term in the total ion density transport equation\
    \ and encompasses all ion-generating processes \u2014 including ionization of\
    \ neutrals, pellet ablation, gas puffing, and beam injection. It directly relates\
    \ to [electron_particle_source_inside_flux_surface](name:electron_particle_source_inside_flux_surface)\
    \ through quasi-neutrality: for a pure plasma, the two cumulative source profiles\
    \ must balance at every flux surface. Comparing this cumulative integral with\
    \ the single-species [ion_particle_source_inside_flux_surface](name:ion_particle_source_inside_flux_surface)\
    \ reveals the relative contribution of individual species to the total ion fueling\
    \ profile. The volume-integrated counterpart over the whole plasma is given by\
    \ [total_ion_particle_source](name:total_ion_particle_source). Typical values\
    \ in neutral-beam-heated tokamak discharges range from $10^{19}$ to $10^{22}$\
    \ s$^{-1}$ at the plasma boundary, depending on device size and fueling scenario.\n\
    \nSign convention: Positive when ions are being added to the plasma volume enclosed\
    \ within the flux surface (net particle production)."
  unit: s^-1
  physics_domain: transport
  links:
  - name:electron_particle_source_inside_flux_surface
  - name:ion_particle_source_inside_flux_surface
  - name:total_ion_particle_source
  constraints: []
  sources:
  - id: dd:core_sources/source/profiles_1d/total_ion_particles_inside
    dd_path: core_sources/source/profiles_1d/total_ion_particles_inside
    status: composed
- name: trapped_fast_particle_pressure
  kind: scalar
  status: draft
  description: Isotropic pressure of the trapped fast (suprathermal) particle population,
    flux-surface-averaged over a radial profile.
  documentation: "The trapped fast particle pressure $p_{\\rm trap,fast}$ is the scalar\
    \ (isotropic) component of the pressure tensor of suprathermal particles whose\
    \ guiding-center orbits are magnetically trapped \u2014 i.e., those with pitch\
    \ angle exceeding the trapping threshold $\\sin^2\\theta > B_{\\rm min}/B_{\\\
    rm max}$ on a given flux surface. It is formally the trace of the fast-ion pressure\
    \ tensor restricted to the trapped velocity-space domain: $p_{\\rm trap,fast}\
    \ = \\frac{1}{3}\\int_{\\rm trapped} m v^2 f_{\\rm fast}\\, d^3v$, where $m$ is\
    \ the particle mass, $v$ the speed, and $f_{\\rm fast}$ the fast-particle distribution\
    \ function. Trapped fast particles \u2014 typically produced by neutral-beam injection\
    \ or ion-cyclotron resonance heating \u2014 contribute significantly to the total\
    \ stored energy in high-performance plasmas; their isotropic pressure can exceed\
    \ 10\u201330% of the bulk thermal pressure in neutral-beam-dominated scenarios.\
    \ It complements the [parallel component](name:parallel_component_of_trapped_fast_particle_pressure)\
    \ of the same population's stress tensor and is the trapped-orbit subset of [fast_particle_pressure](name:fast_particle_pressure).\
    \ The counter-passing analog is [counter_passing_fast_particle_pressure](name:counter_passing_fast_particle_pressure);\
    \ summing trapped and all passing contributions reconstructs the total [fast_particle_pressure](name:fast_particle_pressure).\
    \ Inference of this quantity requires velocity-space-resolved diagnostics (e.g.,\
    \ fast-ion $D_\\alpha$ spectroscopy, neutron emission spectroscopy) or kinetic\
    \ distribution-function codes."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:parallel_component_of_trapped_fast_particle_pressure
  - name:fast_particle_pressure
  - name:counter_passing_fast_particle_pressure
  constraints: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/pressure_fast
    dd_path: distributions/distribution/profiles_1d/trapped/pressure_fast
    status: composed
- name: vacuum_toroidal_magnetic_field_at_reference_major_radius
  kind: scalar
  status: draft
  description: 'Vacuum toroidal magnetic field B0 evaluated at the reference major
    radius R0, defined by the toroidal field coil currents in the absence of plasma.
    This is a signed scalar: positive when the toroidal field points in the direction
    of increasing toroidal angle phi (counter-clockwise viewed from above).'
  documentation: "The vacuum toroidal field $B_0$ is the value of the toroidal magnetic\
    \ field, produced by the toroidal field coil system with no plasma present, evaluated\
    \ at the reference major radius $R_0$. Because an ideal toroidal solenoid scales\
    \ as $1/R$, the vacuum field at any major radius $R$ is given by\n\n$$B_0^{\\\
    rm vac}(R) = B_0 \\, \\frac{R_0}{R},$$\n\nwhere $R_0$ is the reference major radius\
    \ defined by [reference_major_radius_of_vacuum_toroidal_magnetic_field](name:reference_major_radius_of_vacuum_toroidal_magnetic_field).\
    \ This $1/R$ relation is exact for a purely toroidal coil geometry and serves\
    \ as the leading-order approximation in large-aspect-ratio (low-$\\varepsilon$)\
    \ treatments of tokamak plasmas.\n\nThe product $R_0 B_0$ is a constant that characterizes\
    \ the toroidal field coil set; it enters the definition of the toroidal flux coordinate\
    \ $\\rho_{\\rm tor}$ and appears in the normalizations used in one-dimensional\
    \ core transport equations. $B_0$ itself is a machine or operational parameter:\
    \ it may be fixed by the coil design or vary as a programmed time-dependent quantity\
    \ during a discharge scenario.\n\nTypical values for present-day tokamaks range\
    \ from about 1 T to 6 T; the ITER design value is approximately 5.3 T at $R_0\
    \ \\approx 6.2$ m. $B_0$ is inferred from coil currents and vacuum field calculations,\
    \ not from direct in-plasma measurements.\n\nIn the cylindrical $(R, \\phi, Z)$\
    \ frame \u2014 where $R$ is major radius measured from the machine symmetry axis,\
    \ $\\phi$ is the toroidal angle increasing counter-clockwise when viewed from\
    \ above $+\\hat{Z}$, and $Z$ is vertical height \u2014 $B_0$ is the $\\hat{\\\
    phi}$ component of the vacuum toroidal field at $R = R_0$.\n\nSign convention:\
    \ Positive when $B_0$ points in the direction of increasing toroidal angle $\\\
    phi$ (counter-clockwise when viewed from above $+\\hat{Z}$)."
  unit: T
  physics_domain: transport
  links:
  - name:reference_major_radius_of_vacuum_toroidal_magnetic_field
  - name:reference_major_radius
