- name: parallel_neutral_internal_state_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Parallel flux-limiter coefficient that sets a nonnegative cap on the
    field-aligned neutral-particle momentum-flux density for a specified internal
    state as a fraction of its collisionless free-streaming bound, without reversing
    the signed component.
  documentation: 'Parallel flux-limiter coefficient that applies to neutral particles
    occupying a specified internal state is the directional coefficient used to bound
    the component of the corresponding neutral internal-state momentum-flux density
    parallel to the magnetic field. The internal state may be an electronic, vibrational,
    rotational, or other resolved excitation state, and this scalar coefficient applies
    to the field-aligned projection rather than to the poloidal or toroidal projection.


    For the parallel component, the limiter defines the admissible cap:


    $$

    |\Pi_{\mathrm{lim},\parallel}| \le \lambda_{\parallel}\,|\Pi_{\mathrm{fs},\parallel}|,\qquad
    0 \le \lambda_{\parallel} \le 1

    $$


    where $\Pi_{\mathrm{lim},\parallel}$ is the limited component of the neutral internal-state
    momentum-flux density parallel to the magnetic field, $\Pi_{\mathrm{fs},\parallel}$
    is the corresponding collisionless free-streaming component whose magnitude defines
    the bound, and $\lambda_{\parallel}$ is this coefficient.


    The inequality is a cap on magnitude rather than an equality for the realized
    momentum-flux density. Because $\lambda_{\parallel}$ is nonnegative, applying
    the limiter may reduce or bound a signed parallel momentum-flux component but
    does not reverse its direction; a nonzero limited component retains the sign of
    the underlying field-aligned component to which the cap is applied. This scalar
    coefficient is the field-aligned member of the [neutral internal-state momentum-flux
    limiter coefficient over the edge region](name:neutral_internal_state_momentum_flux_limiter_coefficient_over_edge_region)
    and is distinct from the [poloidal](name:poloidal_momentum_neutral_internal_state_flux_limiter_coefficient)
    and [toroidal](name:toroidal_neutral_internal_state_momentum_flux_limiter_coefficient)
    directional members.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_internal_state_momentum_flux_limiter_coefficient_over_edge_region
  - name:parallel_ion_charge_state_momentum_flux_limiter_coefficient
  arguments:
  - name: neutral_internal_state_momentum_flux_limiter_coefficient_over_edge_region
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
- name: parallel_neutral_momentum_source
  kind: scalar
  status: active
  description: Parallel component of the area-normalized momentum source for the neutral
    population in the edge plasma, summed over all neutral states. Its sign distinguishes
    momentum transfer along and opposite to the local magnetic-field direction.
  documentation: 'The parallel component of the area-normalized momentum source for
    the neutral population in the edge plasma, summed over all neutral states, is
    the net neutral momentum transfer per unit area resolved along the local magnetic-field
    direction. It is one component of the aggregate [neutral momentum source](name:neutral_momentum_source)
    acting in the neutral momentum balance.


    The parallel component is defined by projecting the parent source vector onto
    the magnetic-field unit vector:


    $$

    S_{n,\parallel} = \boldsymbol{S}_n \cdot \hat{b}

    $$


    where $S_{n,\parallel}$ is the parallel neutral momentum source, $\boldsymbol{S}_n$
    is the area-normalized neutral momentum source vector, and $\hat{b}$ is the unit
    vector in the local magnetic-field direction.


    The quantity is summed over all neutral states and excludes ion momentum sources.
    Unlike the [radial neutral momentum source](name:radial_neutral_momentum_source),
    [poloidal neutral momentum source](name:poloidal_neutral_momentum_source), and
    [toroidal neutral momentum source](name:toroidal_neutral_momentum_source), it
    resolves momentum transfer along the magnetic-field direction rather than along
    a geometric direction such as $\hat{R}$, a poloidal direction, or $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. Here $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    Sign convention: Positive when the neutral momentum source points in the local
    magnetic-field direction.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_source
  - name:poloidal_neutral_momentum_source
  arguments:
