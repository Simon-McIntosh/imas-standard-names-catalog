name: volume_averaged_boron_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of boron ions (all charge states
  combined), characterizing boron impurity content.
documentation: "The volume-averaged boron ion number density $\\langle n_{\\mathrm{B}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{B}}(\\mathbf{r})\\, dV$ where $V$ is the\
  \ plasma volume in m$^3$ and $n_{\\mathrm{B}}$ is the local boron ion density in\
  \ m$^{-3}$, summed over all charge states ($\\mathrm{B}^{1+}$ through $\\mathrm{B}^{5+}$).\
  \ Boron is a common low-$Z$ impurity introduced deliberately via boronization wall\
  \ conditioning or eroded from boron carbide plasma-facing components; typical volume-averaged\
  \ concentrations are $10^{16}$\u2013$10^{18}$ m$^{-3}$ ($\\sim 0.1$\u2013$1\\%$\
  \ of $n_e$). Charge exchange recombination spectroscopy (CXRS) on the B$^{5+}$ line\
  \ (n = 7\u21926, 494.5 nm) is the principal diagnostic; the volume average is computed\
  \ from the radial density profile mapped onto flux-surface geometry from equilibrium\
  \ reconstruction. Boron dilutes the fuel and contributes to $Z_{\\mathrm{eff}}$\
  \ via $\\Delta Z_{\\mathrm{eff}} = n_{\\mathrm{B}} Z_{\\mathrm{B}}^2 / n_e$. See\
  \ also `volume_averaged_carbon_ion_number_density` and `electron_number_density`."
