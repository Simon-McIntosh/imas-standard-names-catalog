name: poloidal_angle_grid_of_flux_tube
status: draft
cocos_transformation_type: one_like
description: Geometric poloidal angle coordinate along the field line defining the
  computational grid of a gyrokinetic flux tube.
documentation: The poloidal angle grid $\theta$ parametrizes the position along the
  magnetic field line within a flux-tube simulation domain. The angle is defined with
  respect to the geometric center $(R_0, Z_0)$ of the last closed flux surface, where
  $R_0 = (R_{\max} + R_{\min})/2$ and $Z_0 = (Z_{\max} + Z_{\min})/2$; $\theta$ increases
  clockwise so that the coordinate system $(r, \theta, \phi)$ is right-handed, with
  $\theta = 0$ at the outboard midplane ($Z = Z_0$, $R > R_0$). The grid typically
  spans $-\pi$ to $+\pi$ (or multiple $2\pi$ periods for extended ballooning representations)
  and determines the parallel resolution of the eigenmode structure. This coordinate
  is dimensionless (unit 1, measured in radians) and is a fundamental input to local
  gyrokinetic codes such as GS2, GENE, and GKW. See also the eigenmode-specific poloidal
  angle array.
