- name: thermal_electron_power_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volumetric power density transferred from fast particles to the thermal
    electron population via Coulomb collisions.
  documentation: "The power density $P_{\\rm te}^{\\rm coll}$ represents the rate\
    \ of energy exchange between fast (suprathermal) particles and the thermal electron\
    \ population through small-angle Coulomb scattering. In a magnetized plasma, this\
    \ collisional energy transfer is described by the Fokker-Planck collision operator\
    \ and scales with the thermal electron density $n_e$, the fast-particle slowing-down\
    \ time, and the energy difference between the populations. Typical values range\
    \ from $10^{-5}$ to $10^{-1}$ W/m\xB3 in fusion-grade plasmas, depending on auxiliary\
    \ heating power (e.g., NBI, ICRH) and the fast-particle confinement. This quantity\
    \ is a key term in the electron power balance and is computed by Fokker-Planck\
    \ codes or integrated transport solvers. It is closely related to [thermal_ion_power_density_due_to_coulomb_collisions](name:thermal_ion_power_density_due_to_coulomb_collisions)\
    \ for the ion channel and [fast_electron_power_density_due_to_coulomb_collisions](name:fast_electron_power_density_due_to_coulomb_collisions)\
    \ for the fast-electron counterpart."
  unit: W.m^-3
  physics_domain: transport
  links:
