        \ trapped particle fractions, and neoclassical calculations as a function\
        \ of the poloidal flux coordinate."
      kind: llm
- name: minimum_over_flux_surface_magnetic_field_magnitude
  kind: scalar
  status: active
  description: Smallest total magnetic-field strength attained along a specified nested
    magnetic flux surface, using the field magnitude rather than a signed component.
  documentation: 'The minimum magnetic-field magnitude is the smallest total field
    strength attained anywhere on a specified nested magnetic flux surface. It is
    sign-invariant because it uses the modulus of the magnetic-field vector rather
    than a signed component.


    For a surface labeled by the magnetic-flux coordinate $\psi$, the quantity is
    defined by


    $$

    B_{\min}(\psi) = \min_{\mathbf{x} \in S(\psi)} \left|\mathbf{B}(\mathbf{x})\right|

    $$


    where $B_{\min}(\psi)$ is the minimum magnetic-field magnitude, $\mathbf{x}$ is
    a position on the surface, $S(\psi)$ is the set of positions belonging to the
    flux surface labeled by $\psi$, and $\mathbf{B}(\mathbf{x})$ is the total magnetic-field
    vector at that position.


    The minimum is taken over all positions on each nested magnetic flux surface and
    includes the complete equilibrium field, including its poloidal and toroidal contributions.
    It is not a signed component minimum, a flux-surface average, or a minimum taken
    across multiple flux surfaces.


    Unlike the [flux-surface-averaged inverse square of magnetic-field magnitude](name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude),
    this quantity reduces the field magnitude itself by a pointwise minimum rather
    than averaging its reciprocal square.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/b_field_min
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-b_field_min
    dd_documentation:
