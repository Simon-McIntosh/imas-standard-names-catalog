- name: electron_density_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Electron number-density baseline on the scrape-off-layer side of an
    analytic H-mode pedestal fit. It is the fitted offset representing the low-density
    open-field-line side of the pedestal, distinct from the density at the plasma
    boundary and from the pedestal-top density.
  documentation: 'Electron density over the scrape-off layer is the asymptotic baseline
    electron number density associated with the open-field-line side of an analytic
    H-mode pedestal representation. It is a fitted offset parameter for the scrape-off-layer
    side of the density shape, not the density evaluated at a particular location
    such as the last closed flux surface or the pedestal top.


    In practice, this quantity is obtained by fitting an analytic pedestal model to
    edge electron-density data or to a modeled edge density distribution. Different
    analytic pedestal forms may use different width, slope, and transition parameters,
    so the common semantic content is the fitted scrape-off-layer offset, often denoted
    $n_{e,\mathrm{SOL}}$, rather than any specific formula for the full radial dependence.
    The separate scrape-off-layer falloff scale is described by electron_decay_length_over_scrape_off_layer,
    while nearby reference densities include [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)
    and [electron_density_at_pedestal](name:electron_density_at_pedestal).


    Typical fitted H-mode tokamak scrape-off-layer density offsets are of order $10^{18}$-$10^{20}$
    m^-3, depending on fueling, divertor conditions, pedestal collisionality, and
    how far the fitted interval extends into the open-field-line region. In well-constrained
    pedestal fits this offset is usually below the pedestal-top density and should
    be interpreted together with the chosen analytic fit form.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
  - name:electron_density_at_pedestal
  sources:
  - id: dd:summary/pedestal_fits/mtanh/n_e/offset/value
    dd_path: summary/pedestal_fits/mtanh/n_e/offset/value
    status: composed
- name: electron_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of electron heat flux in the scrape-off
    layer, equal to the inverse magnitude of its logarithmic radial gradient.
  documentation: 'The electron heat decay length over the scrape-off layer is the
    radial e-folding distance over which the electron heat flux decreases outside
    the last closed flux surface. It quantifies how narrowly the electron heat channel
    is localized in the scrape-off layer; smaller values correspond to a steeper radial
    falloff.


    For a local outward radial coordinate $r$, the decay length is defined from the
    logarithmic radial gradient of the electron heat flux:


    $$

    \lambda_{q_e} = \left|\frac{q_e}{d q_e / dr}\right| = \left|\frac{d \ln q_e}{dr}\right|^{-1}

    $$


    where $q_e(r)$ is the electron heat flux density in W m$^{-2}$, $r$ is the outward
    radial distance in m, and $\lambda_{q_e}$ is in m. The absolute value makes the
    decay length non-negative; for an outwardly decreasing heat flux, $d q_e / dr
    < 0$.


    In practice, $\lambda_{q_e}$ is obtained by fitting an exponential falloff of
    the electron heat flux as a function of a consistently defined radial coordinate,
    or by evaluating the local logarithmic gradient from measurements or edge-plasma
    transport calculations. If distances are mapped between locations, such as from
    a target surface to an outer-midplane radial coordinate, the geometric mapping
    should be treated consistently with the heat-flux definition.


    Typical values in tokamak scrape-off layers are of order millimeters to centimeters,
    approximately 0.001-0.05 m, with the value depending on confinement regime, collisionality,
    connection length, and magnetic geometry.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  - name:thermal_electron_decay_length_over_scrape_off_layer
  - name:electron_decay_length_over_scrape_off_layer
  sources:
  - id: dd:summary/scrape_off_layer/heat_flux_e_decay_length/value
    dd_path: summary/scrape_off_layer/heat_flux_e_decay_length/value
    status: composed
- name: electron_temperature_at_pedestal
  kind: scalar
  status: draft
  description: Electron temperature at the top of the H-mode pedestal transport barrier,
    representing the characteristic pedestal height parameter extracted from analytic
    fits to the steep-gradient edge profile.
  documentation: "The electron pedestal temperature $T_{e,\\mathrm{ped}}$ characterizes\
    \ the bulk thermal energy of the electron population at the top of the H-mode\
    \ edge transport barrier \u2014 the high-confinement pedestal formed just inside\
    \ the separatrix. As a pedestal height parameter, it represents the plateau value\
    \ of the electron temperature profile above the steep-gradient region, providing\
    \ a key macroscopic boundary condition that sets the scale of core temperature\
    \ profiles in H-mode discharges.\n\nThe pedestal height is extracted by fitting\
    \ analytic models \u2014 including linear and smooth modified-hyperbolic-tangent\
    \ forms \u2014 to measured edge electron temperature profiles. Each fitting approach\
    \ yields a value $T_{e,\\mathrm{ped}}$ corresponding to the temperature at which\
    \ the steep pedestal gradient transitions to the flatter core region, making $T_{e,\\\
    mathrm{ped}}$ a robust, fit-model-dependent summary scalar for the pedestal state.\n\
    \nPedestal electron temperatures in H-mode discharges on mid-scale tokamaks range\
    \ from approximately 0.3 to 5 keV, increasing with plasma current and auxiliary\
    \ heating power. Together with the pedestal electron density, $T_{e,\\mathrm{ped}}$\
    \ determines the pedestal electron pressure captured by electron_pressure_at_pedestal.\
    \ The closely related [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)\
    \ targets the same physical location using an explicit profile-top convention,\
    \ while [gradient_of_electron_temperature](name:gradient_of_electron_temperature)\
    \ quantifies the steepness of the transport barrier.\n\nSign convention: Positive\
    \ for all physical plasmas, as electron temperature is a measure of mean thermal\
    \ kinetic energy per degree of freedom and is intrinsically non-negative."
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
  - name:gradient_of_electron_temperature
  sources:
  - id: dd:summary/pedestal_fits/linear/t_e/pedestal_height/value
    dd_path: summary/pedestal_fits/linear/t_e/pedestal_height/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/t_e/pedestal_height/value
    dd_path: summary/pedestal_fits/mtanh/t_e/pedestal_height/value
