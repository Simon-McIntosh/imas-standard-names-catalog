- name: poloidal_magnetic_flux_at_sensor_attachment_point
  kind: scalar
  status: active
  description: Poloidal magnetic flux at a sensor attachment point is the signed value
    of the equilibrium poloidal magnetic flux function at the physical point where
    the sensor is attached. It preserves the global flux function's additive reference
    and is not a magnetic-axis-referenced flux difference.
  documentation: 'Poloidal magnetic flux at a sensor attachment point is the point
    value of the equilibrium [poloidal magnetic flux](name:poloidal_magnetic_flux)
    function at the physical attachment point of a magnetic flux sensor. The quantity
    retains the additive reference of that global flux function.


    The point value is defined by evaluating the flux function at the attachment-point
    coordinates:


    $$

    \psi_\mathrm{attach} = \psi(R_\mathrm{attach}, Z_\mathrm{attach})

    $$


    where $\psi_\mathrm{attach}$ is the poloidal magnetic flux at the sensor attachment
    point, $\psi(R, Z)$ is the equilibrium [poloidal magnetic flux](name:poloidal_magnetic_flux)
    function, and $R_\mathrm{attach}$ and $Z_\mathrm{attach}$ are the major radius
    and vertical height of the attachment point in the right-handed cylindrical $(R,
    \phi, Z)$ frame, with $R$ the major radius, $\phi$ the toroidal angle, and $Z$
    the vertical height. For an axisymmetric equilibrium, $\psi$ is independent of
    $\phi$.


    This is a local value of the same scalar flux function, not the flux linked by
    the finite [area of a flux loop](name:area_of_flux_loop) and not a magnetic-axis-subtracted
    quantity. Subtracting the [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    from this value gives a magnetic-axis-referenced flux difference; if the attachment
    point lies on a magnetic flux surface, its value equals the [poloidal magnetic
    flux at that flux surface](name:poloidal_magnetic_flux_at_flux_surface).


    Sign convention: Positive when the sensor attachment point lies on a level set
    of $\psi$ whose signed flux label is greater than the chosen additive zero of
    the same equilibrium flux function.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:area_of_flux_loop
  sources:
  - dd_path: equilibrium/time_slice/constraints/flux_loop/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-flux_loop-measured
    dd_documentation:
      leaf: Measured value
      parent_path: equilibrium/time_slice/constraints/flux_loop
      parent: Set of flux loops
      data_type: FLT_0D
      unit: Wb
    enhanced_context:
      description: Measured value of flux loop.
      kind: template
    semantic_facet: measured
- name: product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  kind: scalar
  status: active
  description: Product of the poloidal current function and its derivative with respect
    to the poloidal magnetic flux coordinate; a flux-surface scalar in axisymmetric
    equilibrium.
  documentation: 'Product of the poloidal current function and its derivative with
    respect to the poloidal magnetic flux coordinate is a flux-surface scalar in axisymmetric
    magnetohydrodynamic equilibrium. It represents the coordinate derivative of the
    toroidal-field contribution associated with the [poloidal current function](name:poloidal_current_function)
    along surfaces labeled by poloidal magnetic flux.


    The defining relation is


    $$

    Q_F(\psi) = F(\psi)\frac{dF}{d\psi}

    $$


    where $Q_F$ denotes this quantity, $F=R B_\phi$ is the [poloidal current function](name:poloidal_current_function),
    $R$ is major radius, $B_\phi$ is the toroidal magnetic-field component in the
    right-handed cylindrical $(R, \phi, Z)$ frame, and $\psi$ is the [poloidal magnetic
    flux at flux surface](name:poloidal_magnetic_flux_at_flux_surface) used as the
    flux coordinate.


    Equivalently, $Q_F=(1/2)d(F^2)/d\psi$, linking this quantity to the flux derivative
    of the product $F^2$. In the Grad-Shafranov force balance, $F\,dF/d\psi$ is the
    magnetic free-function term appearing with the pressure-gradient term; it contributes
    to the $R$-weighted toroidal current-density balance but is not the same quantity
    as [product of current density and major radius](name:product_of_current_density_and_major_radius).
    The derivative is with respect to the flux coordinate $\psi$, not a spatial derivative
    such as the [gradient of poloidal magnetic flux](name:radial_derivative_of_poloidal_magnetic_flux).


    Sign convention: Positive when $F^2$ increases with increasing poloidal magnetic
    flux coordinate $\psi$.'
  unit: T^2.Wb^-1.m^2
  physics_domain: equilibrium
  links:
  - name:poloidal_current_function
  - name:poloidal_magnetic_flux_at_flux_surface
  - name:product_of_current_density_and_major_radius
  - name:radial_derivative_of_poloidal_magnetic_flux
  arguments:
  - name: poloidal_current_function
    operator: product
    operator_kind: binary
    role: a
    separator: and
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/f_df_dpsi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-f_df_dpsi
    dd_documentation:
      leaf: Derivative of F w.r.t. Psi, multiplied with F
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T^2.m^2.Wb^-1
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Product F\xB7dF/d\u03C8, where F = R\xB7B\u03C6 is the poloidal\
        \ current function and \u03C8 is the poloidal flux. Appears in the Grad-Shafranov\
        \ equation and relates toroidal current density to pressure balance on flux\
        \ surfaces."
      kind: llm
- name: radial_coordinate_of_current_center
  kind: scalar
  status: active
  description: Major-radius coordinate of the plasma-current centroid, obtained as
    the current-density-weighted first moment over the poloidal cross-section.
  documentation: 'The plasma-current centroid is the effective radial location of
    the toroidally distributed plasma current, distinct from the geometric axis of
    the plasma boundary. Its vertical counterpart is the [vertical coordinate of the
    current center](name:vertical_coordinate_of_current_center).


    In the right-handed cylindrical $(R, \phi, Z)$ frame, its major-radius coordinate
    is defined by


    $$

    R_c = \frac{\int_A R\,j_\phi(R,Z)\,dA}{\int_A j_\phi(R,Z)\,dA}

    $$


    where $R_c$ and $R$ are major-radius coordinates in meters, $j_\phi$ is the toroidal
    component of the conventional plasma [current density](name:current_density),
    $dA$ is the differential area in the poloidal cross-section, and $A$ is the cross-sectional
    domain containing the plasma current. The weighting uses the signed toroidal current
    distribution and excludes currents outside the defined plasma-current domain.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_current_center
  - name:current_density
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/current_centre/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-current_centre-r
    dd_documentation:
      leaf: Major radius of the current center, defined as integral over the poloidal
        cross section of (j_tor*r*dS) / Ip
      parent_path: equilibrium/time_slice/global_quantities/current_centre
      parent: Position and vertical velocity of the current centre
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of current centre.
      kind: template
- name: radial_coordinate_of_dr_dz_zero_point
  kind: scalar
  status: active
  description: Major radius coordinate of the point on a plasma boundary or flux surface
    where dR/dZ = 0, locating the inboard or outboard midplane extremity of the contour
    in the poloidal plane.
  documentation: "The dR/dZ = 0 point marks the poloidal location on a plasma boundary\
    \ or flux-surface contour in the poloidal cross-section where the boundary tangent\
    \ is vertical \u2014 equivalently, where the major radius $R$ reaches a local\
    \ extremum as the height $Z$ varies along the contour. For a convex, simply connected\
    \ tokamak boundary, two such points exist per flux surface: the outboard (maximum\
    \ $R$) and inboard (minimum $R$) extremes, both situated near the magnetic midplane.\n\
    \nThe defining geometric condition is\n\n$$\\left.\\frac{dR}{dZ}\\right|_{\\text{contour}}\
    \ = 0$$\n\nwhere $R$ is the major radius measured from the machine symmetry axis\
    \ and $Z$ is the vertical coordinate in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame, with $\\phi$ the toroidal angle.\n\nThis coordinate is obtained from\
    \ equilibrium reconstruction by numerically locating the $R$ extremum on the reconstructed\
    \ last-closed flux surface or separatrix contour. It provides a compact boundary-shape\
    \ descriptor complementary to the X-point geometry described by [radial_coordinate_of_x_point](name:radial_coordinate_of_x_point),\
    \ and is geometrically paired with its vertical counterpart vertical_coordinate_of_dr_dz_zero_point.\n\
    \nSign convention: Positive when the dR/dZ = 0 point lies at a positive major\
    \ radius measured outward from the machine symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, which is satisfied everywhere in the plasma-accessible\
    \ region where $R > 0$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:radial_coordinate_of_x_point
  sources:
  - dd_path: equilibrium/time_slice/boundary/dr_dz_zero_point/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-dr_dz_zero_point-r
    dd_documentation:
      leaf: Major radius
      parent_path: equilibrium/time_slice/boundary/dr_dz_zero_point
      parent: 'Outboard point on the separatrix on which dr/dz = 0 (local maximum
        of the major radius of the separatrix). In case of multiple local maxima,
        the closest one from z=z_magnetic_axis is chosen. '
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Major radius (R) coordinate of dr dz zero point.
      kind: template
- name: radial_coordinate_of_geometric_axis
  kind: scalar
  status: active
  description: "Major-radius coordinate of the geometric axis of the last closed plasma\
    \ boundary, equal to the midpoint between the maximum and minimum boundary values\
    \ of R in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Major-radius coordinate of the geometric axis is the $R$ coordinate
    of the horizontal geometric center of the last closed plasma boundary in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is measured from the toroidal symmetry
    axis. It characterizes the boundary geometry, not the magnetic-flux extremum.


    The coordinate is defined by the radial extrema of the same boundary:


    $$

    R_\mathrm{geom} = \frac{R_\mathrm{max} + R_\mathrm{min}}{2}

    $$


    where $R_\mathrm{max}$ and $R_\mathrm{min}$ are respectively the largest and smallest
    $R$ values attained by the last closed plasma boundary in the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    This quantity is distinct from the [radial coordinate of the magnetic axis](name:radial_coordinate_of_magnetic_axis),
    which is defined by the extremum of poloidal magnetic flux rather than by boundary
    extrema. Together with the [minor radius of the plasma boundary](name:minor_radius_of_plasma_boundary),
    it gives the radial midpoint and radial half-width of the boundary cross-section.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/geometric_axis/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-geometric_axis-r
    dd_documentation:
