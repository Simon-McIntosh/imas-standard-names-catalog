- name: ratio_of_volume_averaged_carbon_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless plasma-wide carbon abundance defined as the ratio of
    volume-averaged carbon number density to volume-averaged electron number density.
    The carbon density is summed over all carbon charge states.
  documentation: 'Dimensionless plasma-wide carbon abundance is the ratio of volume-averaged
    carbon number density to volume-averaged electron number density. It represents
    the elemental carbon abundance relative to electrons over the same plasma volume.


    The defining ratio is


    $$

    f_{C,V} = \frac{\langle n_C \rangle_V}{\langle n_e \rangle_V} = \frac{\left\langle
    \sum_{q=0}^{6} n_{\mathrm{C},q} \right\rangle_V}{\langle n_e \rangle_V}

    $$


    where $f_{C,V}$ is the ratio of volume-averaged carbon density to volume-averaged
    electron density, $\langle n_C \rangle_V$ is the [volume-averaged carbon density](name:volume_averaged_carbon_density),
    $\langle n_e \rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_C$ is the [carbon density](name:carbon_density), $n_{\mathrm{C},q}$ is the
    local number density of carbon nuclei in charge state $q$, $q$ is the carbon charge-state
    index with $q=0$ for neutral carbon and $q=6$ for fully stripped carbon, and $\langle\cdot\rangle_V$
    denotes averaging over the same plasma volume for numerator and denominator.


    The population is elemental carbon in the plasma volume, with the numerator summed
    over neutral carbon and all ionic charge states. The aggregation convention is
    a ratio of two volume averages using the same volume weighting; it is not the
    volume average of the local ratio $n_C/n_e$.


    This quantity is not an ion-only carbon abundance, not a fraction of total particle
    density, and not a charge-weighted impurity measure. It is the carbon member of
    the same volume-averaged impurity-abundance family as the [boron abundance ratio](name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density),
    and it differs from the [ratio of total ion density to electron density](name:ratio_of_total_ion_density_to_electron_density),
    which aggregates over all ion species rather than isolating elemental carbon.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  - name:ratio_of_total_ion_density_to_electron_density
