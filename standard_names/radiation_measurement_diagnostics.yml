- name: spectral_efficiency_of_filter
  kind: scalar
  status: draft
  description: Wavelength-dependent probability, bounded from 0 to 1, that a photon
    incident on a diagnostic filter produces a registered detection event. It includes
    filter transmission, optical throughput, detector quantum efficiency, and other
    wavelength-dependent losses in the detection chain.
  documentation: 'Spectral efficiency of a filter is the fraction of photons incident
    on the filter at a given wavelength that are ultimately registered as detection
    events. It is a dimensionless probability satisfying $0 \le \eta(\lambda) \le
    1$ and represents the detected channel, not merely the optical transmission through
    the filter.


    For a wavelength bin centered at $\lambda_i$, the efficiency is defined from incident
    photon rate and registered count rate over the same bin:


    $$

    \eta_i = \frac{S_i}{\Phi_i} = \frac{\int_{\Delta\lambda_i} S_\lambda(\lambda)\,d\lambda}{\int_{\Delta\lambda_i}
    \Phi_\lambda(\lambda)\,d\lambda}

    $$


    where $S_\lambda$ is the registered event-rate spectral density, in counts per
    second per wavelength unit, $\Phi_\lambda$ is the photon-rate spectral density
    incident on the filter, in photons per second per wavelength unit, and $\Delta\lambda_i$
    is the wavelength bin. The continuous value $\eta(\lambda)$ is the narrow-bin
    limit or a calibrated interpolation of these bin-averaged probabilities.


    Photons not registered may be absorbed in the filter, reflected or scattered out
    of the accepted optical path, redirected by interference-filter angle effects,
    transmitted but lost in later optics, or transmitted to the detector without producing
    an accepted event. Therefore spectral efficiency is related to, but not determined
    solely by, spectral absorptivity or transmittance; it also includes detector quantum
    efficiency, collection geometry, electronic thresholds, and wavelength-dependent
    optical losses.


    In practice, spectral efficiency is measured with a calibrated monochromator,
    tunable laser, or lamp source whose photon rate at the filter is known, and by
    comparing the registered event rate with that incident photon rate for each wavelength
    bin. It may also be computed as a product of independently measured component
    responses, provided their angular, polarization, temperature, aging, and contamination
    dependencies are applicable to the same optical path.


    Typical values range from less than $10^{-4}$ outside a filter passband to $0.01-0.9$
    within the passband. Well matched visible detection chains often peak around $0.1-0.7$,
    while ultraviolet or infrared systems can be lower because of reduced optical
    throughput or detector quantum efficiency.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_absorptivity_of_filter
  - name:efficiency_of_filter
  sources:
  - id: dd:bremsstrahlung_visible/channel/filter/detection_efficiency
    dd_path: bremsstrahlung_visible/channel/filter/detection_efficiency
    status: composed
- name: spectral_etendue_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Spectral etendue of a spectrometer channel is its area-solid-angle
    optical acceptance averaged over wavelength with a normalized channel spectral
    response. The normalization makes the spectral weighting integrate to unity, so
    the quantity retains units of m^2 sr.
  documentation: 'Spectral etendue of a spectrometer channel is the effective optical
    throughput of that channel after accounting for its finite spectral acceptance.
    It represents the geometric area-solid-angle acceptance sampled by photons according
    to the channel spectral instrument function.


    The spectral etendue $G_c$ for channel $c$ can be defined as a response-weighted
    average of the wavelength-dependent etendue:


    $$

    G_c = \int A\Omega(\lambda)\, w_c(\lambda)\, d\lambda, \qquad \int w_c(\lambda)\,
    d\lambda = 1

    $$


    where $A\Omega(\lambda)$ is the area-solid-angle throughput at wavelength $\lambda$,
    and $w_c(\lambda)$ is the normalized spectral weighting for the channel. If an
    unnormalized instrument response $S_c(\lambda)$ is used, then $w_c(\lambda)=S_c(\lambda)/\int
    S_c(\lambda)\,d\lambda$; consequently $w_c$ has inverse-wavelength units and $G_c$
    keeps the same unit as etendue, $\mathrm{m^2\,sr}$.


    In practice this quantity is obtained from optical modeling, ray tracing, aperture
    and solid-angle measurements, or radiometric calibration using a known spectral
    source. The spectral weighting is usually determined from monochromatic scans
    or from a characterized spectrometer line-spread function, then normalized before
    it is applied to the wavelength-dependent throughput.


    No device-independent numerical range is implied: the value is set by aperture
    size, collection solid angle, optical transmission, vignetting, and the width
    and shape of the channel response. It should therefore be treated as an instrument
    calibration quantity rather than inferred from a generic tokamak or spectrometer
    scale.'
  unit: m^2.sr
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:etendue
  - name:etendue_of_spectrometer_channel
  - name:efficiency_of_spectrometer_channel
  - name:effective_spectral_width_of_spectrometer_channel
  arguments:
  - name: etendue_of_spectrometer_channel
    operator: spectral
    operator_kind: qualifier
- name: spectral_flux_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Uncalibrated photon-equivalent count rate registered by a spectrometer
    channel for a selected spectral line or wavelength passband. It is a detector
    count rate measured before conversion to absolute spectral radiance.
  documentation: 'Spectral flux of a spectrometer channel is the photon-equivalent
    detection rate assigned to a selected spectral feature or wavelength passband.
    It is an instrumental count-rate quantity that represents how rapidly photons
    are registered by the detector for that feature, not an absolutely calibrated
    radiance or emissivity.


    For a channel and a selected spectral feature or passband, the detected spectral
    flux is the photon-equivalent count accumulated over the feature divided by the
    integration time:


    $$

    \Phi = \frac{N}{\Delta t}

    $$


    where $\Phi$ is the spectral flux in s^-1, $N$ is the photon-equivalent detector
    count accumulated for the selected line or passband, and $\Delta t$ is the detector
    integration time in seconds.


    In practice this quantity is obtained by summing or fitting the detector signal
    over the wavelength interval associated with an emission line or filter band,
    then dividing by the exposure time. Instrumental corrections such as detector
    gain, dark-signal subtraction, dead-time, and relative channel response may be
    applied so that channels can be compared, but absolute throughput calibration
    is deliberately not applied. Conversion to absolute spectral radiance requires
    multiplying or dividing by a calibration factor that bundles the collection etendue,
    optical transmission, detector quantum efficiency, and effective spectral width
    into a single throughput coefficient; that coefficient is carried by the calibration
    and channel instrument factors rather than by this count rate itself.


    Typical values vary strongly with line brightness, optical throughput, detector
    gain, and integration time. Weak lines may produce roughly 10^2-10^4 s^-1 per
    channel, while bright visible or ultraviolet lines in fusion plasmas commonly
    give 10^5-10^8 s^-1 before detector saturation or nonlinear response becomes important.'
  unit: s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_calibration_factor_of_spectrometer
  sources:
  - id: dd:charge_exchange/channel/spectrum/processed_line/intensity
    dd_path: charge_exchange/channel/spectrum/processed_line/intensity
    status: attached
  - id: dd:spectrometer_uv/channel/processed_line/intensity
    dd_path: spectrometer_uv/channel/processed_line/intensity
    status: composed
  - id: dd:spectrometer_visible/channel/filter_spectrometer/photon_count
    dd_path: spectrometer_visible/channel/filter_spectrometer/photon_count
    status: composed
  - id: dd:spectrometer_visible/channel/grating_spectrometer/processed_line/intensity
    dd_path: spectrometer_visible/channel/grating_spectrometer/processed_line/intensity
    status: attached
- name: spectral_radiance
  kind: scalar
  status: draft
  description: Photon-number spectral radiance of observed plasma emission, equal
    to the photon flux per unit projected collector area, per unit solid angle, and
    per unit wavelength interval along a diagnostic line of sight.
  documentation: 'Spectral radiance is the fundamental radiometric quantity expressing
    the intensity of plasma radiation along a line of sight, resolved simultaneously
    per unit projected collector area, per unit solid angle, and per unit wavelength
    interval. It is the primary photometric observable for absolute spectroscopic
    analysis of plasma emission processes including bremsstrahlung continuum, charge
    exchange recombination, and impurity line radiation.


    The photon-number spectral radiance $L_\lambda$ at wavelength $\lambda$ is defined
    by:


    $$

    L_\lambda = \frac{d^2 \Phi_\gamma}{d\Omega \, dA_\perp \, d\lambda}

    $$


    where $\Phi_\gamma$ is the detected photon rate in s$^{-1}$, $\Omega$ is the solid
    angle subtended by the collecting aperture in sr, $A_\perp$ is the collecting
    area projected onto the plane perpendicular to the line of sight in m$^2$, and
    $\lambda$ is wavelength in m, giving $L_\lambda$ in m$^{-3}$ s$^{-1}$ sr$^{-1}$.
    The non-standard m$^{-3}$ dimension arises from combining the per-area factor
    (m$^{-2}$) with the per-wavelength factor (m$^{-1}$) on a photon-count basis.


    Absolute calibration is performed by comparing raw detector signals to a source
    of known radiance, yielding a [spectral calibration factor](name:spectral_calibration_factor_of_spectrometer).
    The related bremsstrahlung_spectral_radiance specializes this quantity to the
    visible continuum component used for effective charge $Z_\mathrm{eff}$ inference,
    and the local volumetric emission analog is captured by [bremsstrahlung_spectral_emissivity](name:bremsstrahlung_spectral_emissivity).
    Measurements restricted to a discrete spectral line, such as the Stark-split beam
    emission described by [motional_stark_radiance](name:motional_stark_radiance_at_spectral_line),
    employ the same radiometric framework but integrated over a specific spectral
    feature.'
  unit: m^-3.s^-1.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_calibration_factor_of_spectrometer
  - name:bremsstrahlung_spectral_emissivity
  - name:motional_stark_radiance_at_spectral_line
- name: spectral_radiance_of_hard_xray_detector
  kind: scalar
  status: draft
  description: Power radiance of hard X-ray emission received on a detector channel,
    equal to detected power per unit detector area per unit solid angle, resolved
    over one or more photon energy acceptance bands.
  documentation: "The spectral radiance of a hard X-ray detector channel is the detected\
    \ radiative power normalized by the product of detector area and acceptance solid\
    \ angle (the \xE9tendue), integrated within each photon energy band of the channel.\
    \ Hard X-ray emission in fusion plasmas is generated predominantly by bremsstrahlung\
    \ from suprathermal electrons and runaway electron populations, making this quantity\
    \ a key diagnostic for characterizing the high-energy tail of the electron distribution.\n\
    \nThe channel brightness $B$ is defined as:\n\n$$\nB = \\frac{P}{A \\cdot \\Omega}\n\
    $$\n\nwhere $P$ is the radiative power collected by the channel, $A$ is the effective\
    \ detector area, and $\\Omega$ is the solid angle subtended by the collection\
    \ optics; their product $A \\cdot \\Omega$ is the \xE9tendue.\n\nUnlike [hard_xray_brightness](name:hard_xray_brightness),\
    \ which expresses photon flux per unit area and solid angle, this quantity is\
    \ a power-based radiance, directly mirroring [spectral_radiance_of_soft_xray_detector](name:spectral_radiance_of_soft_xray_detector)\
    \ for the hard X-ray energy range. Multi-channel measurements along varied lines\
    \ of sight enable tomographic inversion to recover the spatially resolved hard\
    \ X-ray emissivity profile, from which the energy distribution and confinement\
    \ properties of suprathermal electron populations can be inferred."
  unit: W.m^-2.sr^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:hard_xray_brightness
  - name:spectral_radiance_of_soft_xray_detector
  arguments:
  - name: spectral_radiance
    operator: hard_xray_detector
    operator_kind: locus
  sources:
  - id: dd:hard_x_rays/channel/brightness
    dd_path: hard_x_rays/channel/brightness
