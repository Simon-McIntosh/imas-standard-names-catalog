name: tendency_of_thermal_plasma_stored_energy
status: draft
description: Time derivative of the thermal component of the plasma stored energy,
  $dW_{\mathrm{th}}/dt$, measuring the rate of thermal energy accumulation or loss.
documentation: "The tendency of thermal plasma stored energy $dW_{\\mathrm{th}}/dt$\
  \ (in W) represents the instantaneous rate of change of the volume-integrated thermal\
  \ energy $W_{\\mathrm{th}} = \\frac{3}{2}\\int (n_e k_B T_e + \\sum_i n_i k_B T_i)\\\
  ,dV$, where $n_e$ and $T_e$ are the electron density and temperature, and $n_i$,\
  \ $T_i$ are ion species densities and temperatures. Unlike the diamagnetic energy\
  \ derivative, this quantity excludes fast-ion contributions and is computed from\
  \ kinetic profile data (Thomson scattering for $n_e$, $T_e$; CXRS for $T_i$) combined\
  \ with equilibrium volume information. In steady-state discharges $dW_{\\mathrm{th}}/dt\
  \ \\approx 0$; during sawtooth crashes or ELM events, transient excursions of $\\\
  pm(0.1$\u2013$10)\\;\\mathrm{MW}$ are common. This term enters the thermal energy\
  \ balance: $P_{\\mathrm{heat}} - P_{\\mathrm{rad}} - P_{\\mathrm{cond+conv}} = dW_{\\\
  mathrm{th}}/dt$. See also `tendency_of_diamagnetic_plasma_energy` for the total\
  \ (including fast-ion) counterpart and `total_radiated_power` for the dominant loss\
  \ channel."
