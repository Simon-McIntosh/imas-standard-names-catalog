- name: wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged total absorbed wave power per unit volume summed
    over all plasma species (thermal electrons, thermal ions, and fast particles)
    from a coherent wave.
  documentation: 'The wave absorbed power density $p_\mathrm{abs}(\rho)$ is the net
    electromagnetic power deposited per unit plasma volume after averaging over a
    flux surface, accounting for absorption by all species: thermal electrons, thermal
    ions, and fast (suprathermal) populations. It appears in the plasma energy balance
    as a source term in the heat transport equation, $\partial W / \partial t = \int
    p_\mathrm{abs}\, dV - P_\mathrm{loss}$, where $W$ is the stored energy and $P_\mathrm{loss}$
    represents all loss channels. Typical core values in ICRH- or ECRH-heated tokamaks
    range from $10^4$ to $10^6$ W m$^{-3}$ depending on injected power and plasma
    volume. This quantity is the species-summed analog of the species-resolved quantities
    [thermal electron absorption](name:thermal_electron_wave_absorbed_power_density)
    and [fast ion absorption](name:fast_ion_wave_absorbed_power_density). The cumulative
    volume integral of this density over all enclosed flux surfaces is tracked by
    [wave_absorbed_power_inside_flux_surface](name:wave_absorbed_power_inside_flux_surface).
    The toroidal-mode-resolved form of this total density is [per_toroidal_mode_of_wave_absorbed_power_density](name:per_toroidal_mode_of_wave_absorbed_power_density).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_wave_absorbed_power_density
  - name:fast_ion_wave_absorbed_power_density
  - name:wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_wave_absorbed_power_density
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/power_density
    dd_path: waves/coherent_wave/profiles_1d/power_density
    status: composed
- name: wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of absorbed wave power over all plasma species
    (thermal electrons, thermal ions, and fast ions) enclosed within a given flux
    surface.
  documentation: The total wave absorbed power inside a flux surface is defined as
    $P_{\rm abs}(\psi) = \int_0^\psi p_{\rm abs}(\psi') \, dV$, where $p_{\rm abs}$
    is the local absorbed power density summed over all species and $dV$ is the volume
    element of the flux surface shell. This species-summed quantity includes contributions
    from thermal electrons, thermal ions, and fast ion populations; the species-resolved
    counterparts are [thermal electron absorbed power](name:thermal_electron_wave_absorbed_power_inside_flux_surface),
    [thermal ion absorbed power](name:thermal_ion_wave_absorbed_power_inside_flux_surface),
    and [fast ion absorbed power](name:fast_ion_wave_absorbed_power_inside_flux_surface).
    As a cumulative integral from the magnetic axis outward, the profile monotonically
    increases (or remains flat in unheated regions) and asymptotes to the total coupled
    wave power at the plasma boundary; typical values range from tens of kilowatts
    in current-drive experiments to tens of megawatts in ITER-class scenarios. When
    a single coherent wave is resolved by toroidal harmonic, the mode-resolved counterpart
    is [per toroidal mode absorbed power inside flux surface](name:per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface).
    This quantity is central to power balance analysis and is routinely compared against
    neutron measurements, bolometric reconstructions, and kinetic transport simulations
    to validate RF heating efficiency.
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_wave_absorbed_power_inside_flux_surface
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_wave_absorbed_power_inside_flux_surface
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/power_inside
    dd_path: waves/coherent_wave/profiles_1d/power_inside
    status: composed
- name: x_component_of_direction_unit_vector
  kind: scalar
  status: draft
  description: X-axis Cartesian component of the direction unit vector of a device
    component, equal to the dot product $\hat{d} \cdot \hat{x}$ in the right-handed
    $(x, y, z)$ frame.
  documentation: 'The quantity $d_x = \hat{d} \cdot \hat{x}$ gives the projection
    of the [direction unit vector](name:direction_unit_vector) onto the $\hat{x}$
    axis of the right-handed Cartesian $(x, y, z)$ frame, where $\hat{z}$ is vertical
    and $\hat{x}$ is defined by the facility convention at $\phi = 0$. By construction
    $|\hat{d}|^2 = d_x^2 + d_y^2 + d_z^2 = 1$, so $d_x$ is dimensionless and bounded
    to $[-1, 1]$; it equals $\pm 1$ when the device points purely along $\pm\hat{x}$
    and zero when the orientation is perpendicular to $\hat{x}$. Together with [y_component_of_direction_unit_vector](name:y_component_of_direction_unit_vector)
    and [z_component_of_direction_unit_vector](name:z_component_of_direction_unit_vector),
    this component fully specifies the three-dimensional orientation of any directional
    sensor or beam element. The value is determined geometrically from design data
    or surveyed alignment measurements rather than from a physical field measurement.


    Sign convention: Positive when the device points in the $+\hat{x}$ direction of
    the right-handed Cartesian $(x, y, z)$ frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
