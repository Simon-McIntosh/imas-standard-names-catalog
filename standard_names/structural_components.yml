- name: tritium_breeding_ratio
  kind: scalar
  status: active
  description: Tritium breeding ratio is the blanket-level ratio of tritium atoms
    produced in breeder-blanket breeding regions to the incident fusion-neutron count
    over the same normalization interval. Compatible module contributions share this
    denominator and add to the blanket value.
  documentation: 'Tritium breeding ratio is the blanket-level ratio of tritium atoms
    produced inside the breeding regions of a breeder blanket to the incident fusion-neutron
    count used to normalize the same neutronics balance. It is a tritium production
    figure of merit for the blanket as a whole, distinct from nuclear heating or power
    deposition.


    The ratio is defined over a specified normalization interval by


    $$

    \mathrm{TBR} = \frac{N_{T,\mathrm{blanket}}}{N_{n,\mathrm{inc}}}

    $$


    where $N_{T,\mathrm{blanket}}$ is the number of tritium atoms produced in the
    blanket breeding regions during that interval, and $N_{n,\mathrm{inc}}$ is the
    incident fusion-neutron count for the same interval.


    Breeding regions are the blanket material volumes designated for neutron-induced
    tritium production; tritium produced outside those volumes is excluded unless
    that material is part of the breeder blanket breeding region. The denominator
    is the common incident-neutron denominator, not the number of neutrons absorbed
    in the blanket and not a module-specific denominator. Compatible non-overlapping
    module values of [tritium_breeding_ratio_of_breeder_blanket_module](name:tritium_breeding_ratio_of_breeder_blanket_module)
    that use this same denominator are additive and sum to the blanket-level ratio.


    The quantity differs from [power_of_breeder_blanket](name:power_of_breeder_blanket)
    and [power_of_breeder_blanket_module](name:power_of_breeder_blanket_module), which
    describe energy deposition rates rather than tritium atom yield. Because both
    counts are non-negative and the denominator must be positive, negative values
    are outside the physical domain; values greater than one mean more tritium atoms
    are produced than the tritium atoms consumed by the fusion reactions that generated
    the same incident-neutron population, which is the breeding condition for tritium
    self-sufficiency.'
  unit: '1'
  physics_domain: structural_components
  links:
  - name:tritium_breeding_ratio_of_breeder_blanket_module
  sources:
  - dd_path: breeding_blanket/time_slice/tritium_breeding_ratio
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/breeding_blanket.html#breeding_blanket-time_slice-tritium_breeding_ratio
    dd_documentation:
      leaf: Number of tritium atoms created for each fusion neutron (TBR)
      parent_path: breeding_blanket/time_slice
      parent: Dynamic quantities for a set of time_slices
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: Tritium breeding ratio (TBR), the number of tritium atoms produced
        per fusion neutron absorbed in the breeding blanket. A key figure of merit
        for tritium self-sufficiency in fusion reactor design.
      kind: llm
- name: tritium_breeding_ratio_of_breeder_blanket_module
  kind: scalar
  status: active
  description: Dimensionless tritium-production contribution from one breeder-blanket
    module, normalized by the common incident fusion-neutron count used for the blanket
    balance.
  documentation: 'This quantity is the contribution of one breeder-blanket module
    to the blanket-level [tritium breeding ratio](name:tritium_breeding_ratio). It
    counts tritium atoms produced within that module''s breeding regions and uses
    the common incident fusion-neutron normalization for the complete blanket.


    $$

    TBR_{\mathrm{module}} = \frac{N_{T,\mathrm{module}}}{N_{n,\mathrm{incident}}}

    $$


    where $N_{T,\mathrm{module}}$ is the number of tritium atoms produced in the module''s
    breeding regions and $N_{n,\mathrm{incident}}$ is the incident fusion-neutron
    count used for the blanket balance.


    For modules that partition the blanket breeding regions and share this denominator,
    the module contributions add to the blanket tritium breeding ratio. The quantity
    excludes tritium production outside the specified module and is not a separate
    normalization of the module''s incident neutron count.'
  unit: '1'
  physics_domain: structural_components
  links:
