- name: power_density_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric rate of energy release from all included nuclear-fusion
    reaction channels, including energy carried by charged particles and neutrons.
  documentation: "Fusion power density is the local energy-release rate generated\
    \ by nuclear-fusion reactions per unit volume. It may represent a specific reaction\
    \ channel or the channel-summed quantity, with unqualified fusion power density\
    \ understood as the sum over included channels.\n\nThe defining reaction-rate\
    \ sum is\n\n$$\nP_{\\mathrm{fus}}(\\mathbf{x}) = \\sum_{r \\in \\mathcal{R}} \\\
    frac{n_{a,r}(\\mathbf{x})\\,n_{b,r}(\\mathbf{x})}{1+\\delta_{a_rb_r}}\\,\\langle\\\
    sigma v\\rangle_r\\,E_r\n$$\n\nwhere $r$ indexes fusion channels, $n_{a,r}$ and\
    \ $n_{b,r}$ are reactant number densities in m$^{-3}$, $\\langle\\sigma v\\rangle_r$\
    \ is the reaction-rate coefficient in m$^{3}$ s$^{-1}$, $E_r$ is the energy released\
    \ per reaction in joules, and $\\delta_{a_rb_r}$ is one for identical reactants\
    \ and zero otherwise. The deuterium\u2013deuterium and deuterium\u2013tritium\
    \ instances are represented by [deuterium-deuterium fusion power density](name:deuterium_deuterium_power_density_due_to_fusion)\
    \ and [deuterium-tritium fusion power density](name:deuterium_tritium_power_density_due_to_fusion).\
    \ This energy-release quantity includes neutron and charged-particle product energy\
    \ and is distinct from [fusion neutron emissivity](name:emissivity_due_to_fusion)."
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_power_density_due_to_fusion
  - name:deuterium_tritium_power_density_due_to_fusion
  - name:emissivity_due_to_fusion
- name: deuterium_deuterium_power_density_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric power density from deuterium-deuterium thermonuclear
    reactions, including energy carried by both the neutron-producing and proton-producing
    branches and characterized by their branch-weighted per-reaction Q value.
  documentation: 'The D-D fusion power density is the local rate at which deuterium-deuterium
    thermonuclear reactions $D + D \rightarrow {}^3\mathrm{He} + n$ and $D + D \rightarrow
    T + p$ release energy per unit plasma volume. It includes both the neutron-producing
    branch and the proton-producing branch, so it represents branch-summed D-D fusion
    energy release rather than only neutron-branch energy.


    For a thermal deuterium population, the branch-summed power density is


    $$

    P_{\mathrm{DD}}(\mathbf{x}) = \frac{1}{2} n_D(\mathbf{x})^2 \left[\langle\sigma
    v\rangle_n Q_n + \langle\sigma v\rangle_p Q_p\right]

    $$


    where $n_D$ is the deuterium ion number density in m$^{-3}$, $\langle\sigma v\rangle_n$
    and $\langle\sigma v\rangle_p$ are the thermonuclear rate coefficients in m$^3$
    s$^{-1}$ for the helium-3-neutron and tritium-proton branches, $Q_n$ and $Q_p$
    are the corresponding branch energies in joules, and the factor $1/2$ avoids double
    counting identical deuteron pairs. The branch Q-values are $Q_n = 3.27\,\mathrm{MeV}$
    for $D + D \rightarrow {}^3\mathrm{He} + n$ and $Q_p = 4.03\,\mathrm{MeV}$ for
    $D + D \rightarrow T + p$; equal branch probabilities give a branch-weighted $Q_{\mathrm{DD}}
    \simeq 3.65\,\mathrm{MeV}$ per D-D reaction, to be converted to joules in the
    equation.


    The displayed expression is the thermal-thermal specialization of the definition.
    For beam-thermal, beam-beam, or otherwise non-Maxwellian deuteron populations,
    $P_{\mathrm{DD}}$ is still the branch-summed local energy-release rate, with each
    branch reaction-rate density multiplied by its branch energy rather than using
    Maxwellian rate coefficients. This quantity is the D-D channel instance of [fusion
    power density](name:power_density_due_to_fusion); it includes neutron and charged-particle
    product energy and is distinct from [fusion neutron emissivity](name:emissivity_due_to_fusion),
    from deposited heating of fusion products, and from [D-T fusion power density](name:deuterium_tritium_power_density_due_to_fusion).'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_density_due_to_fusion
  - name:deuterium_deuterium_emissivity_due_to_fusion
  - name:deuterium_tritium_power_density_due_to_fusion
  arguments:
  - name: power_density_due_to_fusion
    operator: deuterium_deuterium
    operator_kind: qualifier
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dd
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-fusion_power_dd
    dd_documentation:
      leaf: Fusion power profile due to DD reactions
      parent_path: neutron_diagnostic/reconstructed_emissivity
      parent: Reconstructed emissivity parameters and data
      data_type: FLT_2D
      unit: W.m^-3
      coordinates:
      - neutron_diagnostic/reconstructed_emissivity/rho_tor_norm
      - neutron_diagnostic/time
    enhanced_context:
      description: Radial profile of fusion power density due to deuterium-deuterium
        (DD) reactions, reconstructed from neutron emissivity tomography. Provides
        a spatially resolved measure of DD fusion reactivity across the plasma cross-section.
      kind: llm
- name: deuterium_tritium_power_density_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric power density from deuterium-tritium thermonuclear
    reactions, with each reaction yielding 17.6 MeV distributed between the alpha
    particle (3.5 MeV) and the neutron (14.1 MeV).
  documentation: "The D-T fusion power density is the local rate at which deuterium-tritium\
    \ reactions $D + T \\rightarrow {}^4\\mathrm{He} + n$ deposit energy per unit\
    \ plasma volume, with each event releasing $Q_\\mathrm{DT} = 17.6\\,\\mathrm{MeV}$,\
    \ partitioned as 3.5 MeV to the alpha particle and 14.1 MeV to the 14.1 MeV neutron.\n\
    \nThe volumetric power density is defined by:\n\n$$\nP_\\mathrm{DT} = n_D \\,\
    \ n_T \\, \\langle \\sigma v \\rangle_\\mathrm{DT} \\, Q_\\mathrm{DT}\n$$\n\n\
    where $n_D$ and $n_T$ are the local deuterium and tritium number densities, $\\\
    langle \\sigma v \\rangle_\\mathrm{DT}$ is the velocity-averaged D-T fusion reactivity\
    \ (maximized near ion temperature $T_i \\approx 65\\,\\mathrm{keV}$), and $Q_\\\
    mathrm{DT} = 17.6\\,\\mathrm{MeV}$ is the total energy released per reaction.\n\
    \nThe spatial distribution of $P_\\mathrm{DT}$ is inferred from neutron emissivity\
    \ tomography: multi-channel neutron detector signals are tomographically inverted\
    \ to yield the [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion)\
    \ (volumetric reaction rate), which is then scaled by $Q_\\mathrm{DT}$ to obtain\
    \ the power density. In a balanced D-T fuel mixture at reactor-relevant temperatures\
    \ of 10\u201320 keV, the D-T channel dominates the total [power_density_due_to_fusion](name:power_density_due_to_fusion),\
    \ exceeding the [deuterium_deuterium_power_density_due_to_fusion](name:deuterium_deuterium_power_density_due_to_fusion)\
    \ by roughly two orders of magnitude due to the much larger D-T reactivity at\
    \ these temperatures. Peak on-axis values in near-ignition plasmas are expected\
    \ to reach several MW m$^{-3}$."
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:power_density_due_to_fusion
  - name:deuterium_deuterium_power_density_due_to_fusion
  arguments:
  - name: power_density_due_to_fusion
    operator: deuterium_tritium
    operator_kind: qualifier
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/fusion_power_dt
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-fusion_power_dt
    dd_documentation:
      leaf: Fusion power profile due to DT reactions
      parent_path: neutron_diagnostic/reconstructed_emissivity
      parent: Reconstructed emissivity parameters and data
      data_type: FLT_2D
      unit: W.m^-3
      coordinates:
      - neutron_diagnostic/reconstructed_emissivity/rho_tor_norm
      - neutron_diagnostic/time
    enhanced_context:
      description: 2D fusion power density profile due to deuterium-tritium (DT) reactions,
        reconstructed from neutron emissivity tomography. Provides the spatial distribution
        of DT fusion power as a function of flux surface and poloidal angle.
      kind: llm
- name: power_density_due_to_radiation
  kind: scalar
  status: active
  description: Local volumetric rate at which plasma energy is converted into emitted
    electromagnetic radiation, with positive values denoting energy loss from the
    plasma.
  documentation: 'Radiative power density is the local rate of electromagnetic energy
    emission per unit volume, summed over the radiation mechanisms included by the
    physical model. It describes energy leaving the plasma as radiation rather than
    energy transferred through collisional, conductive, or convective channels.


    $$

    p_{\mathrm{rad}} = \frac{\partial E_{\mathrm{rad}}}{\partial V\,\partial t}

    $$


    where $p_{\mathrm{rad}}$ is the radiative power density, $E_{\mathrm{rad}}$ is
    emitted electromagnetic energy, $V$ is plasma volume, and $t$ is time. As a radiative
    specialization of [power_density](name:power_density), it may include line radiation,
    continuum radiation, and other modeled emission processes; it excludes energy
    that remains in the plasma or is transferred by nonradiative channels.


    Sign convention: Positive when energy leaves the plasma as emitted electromagnetic
    radiation.'
  unit: W.m^-3
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:power_density
  sources:
  - dd_path: disruption/profiles_1d/power_density_radiative_losses
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-profiles_1d-power_density_radiative_losses
    dd_documentation:
      leaf: Power density of radiative losses (positive sign for losses)
      parent_path: disruption/profiles_1d
      parent: Radial profiles for a set of time slices
      data_type: FLT_1D
      unit: W.m^-3
      coordinates:
      - disruption/profiles_1d/grid/rho_tor_norm
    enhanced_context:
      description: Radial profile of the volumetric radiative power density loss during
        a disruption, with positive sign indicating energy loss from the plasma. Contributes
        to the rapid thermal energy loss characteristic of the thermal quench phase.
      kind: llm
- name: power_due_to_line_radiation
  kind: scalar
  status: active
  description: Total electromagnetic power emitted in discrete spectral lines by bound-bound
    transitions of plasma atoms and ions.
  documentation: 'Line-radiation power is the volume-integrated electromagnetic emission
    from bound-bound transitions of atomic and ionic populations in the plasma. It
    represents the energy carried by discrete spectral lines and is a radiative loss
    from the emitting plasma.


    For downward transitions, the emitted power is defined by


    $$

    P_{\mathrm{line}} = \int_V \sum_s \sum_{i>j} n_{s,i} A_{s,ij} h\nu_{s,ij}\,dV

    $$


    where $V$ is the emitting plasma volume, $n_{s,i}$ is the population density of
    upper state $i$ of species $s$ in m$^{-3}$, $A_{s,ij}$ is the transition probability
    in s$^{-1}$, $h$ is Planck''s constant, and $\nu_{s,ij}$ is the emitted-photon
    frequency in s$^{-1}$. The sums include all specified atomic and ionic emitters
    and radiative transitions.


    This quantity includes line emission from hydrogenic and impurity species, but
    excludes continuum bremsstrahlung represented by [bremsstrahlung_power](name:bremsstrahlung_power)
    and other channels such as [power_due_to_synchrotron_radiation](name:power_due_to_synchrotron_radiation).
    It contributes to [total_plasma_radiated_power](name:total_plasma_radiated_power),
    while [power_due_to_impurity_radiation](name:power_due_to_impurity_radiation)
    covers the impurity-specific component.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:bremsstrahlung_power
  - name:power_due_to_synchrotron_radiation
  - name:total_plasma_radiated_power
  - name:power_due_to_impurity_radiation
  sources:
  - dd_path: summary/global_quantities/power_line/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_line-value
    dd_documentation:
      leaf: Value
