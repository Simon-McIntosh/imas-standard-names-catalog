- name: ion_state_wave_absorbed_power_along_beam
  kind: scalar
  status: draft
  description: Wave power locally absorbed from a coherent wave by a specific ion
    charge state, resolved at each position along the beam path in beam tracing calculations.
    This is a local (differential) quantity along the beam, not a cumulative or volume-integrated
    power. The charge state is identified by its ionization level index within the
    parent ion species.
  documentation: 'In beam tracing simulations of wave heating, the total wave power
    absorbed by ions can be partitioned by charge state, allowing charge-state-resolved
    energy deposition to be tracked along the beam trajectory. This quantity gives
    the absorbed power $P$ in watts at each discrete point along the beam path, representing
    the local rate of energy transfer from the wave field to ions of a specific ionization
    state. It is related to, but distinct from, the differential absorbed power per
    unit path length $dP/ds$ (W m$^{-1}$); the stored scalar in W represents the power
    absorbed locally at each beam-tracing node, consistent with the convention used
    for the parent-species quantity $P_\mathrm{abs}(s)$ without further path-length
    normalization.


    Charge-state resolution is essential when impurity ions or partially stripped
    species contribute differentially to wave absorption, as occurs near ion cyclotron
    resonance layers where absorption strength depends on the charge-to-mass ratio
    $Z_i/A_i$ and minority-ion concentration. Summing over all charge states of a
    given ion species recovers the species-total absorbed power along the beam (see
    [ion_wave_absorbed_power_along_beam](name:ion_wave_absorbed_power_along_beam)).


    Typical absorbed powers range from kilowatts to megawatts per charge state in
    ion cyclotron range of frequencies (ICRF)-heated plasmas, depending on the minority
    concentration, resonance layer geometry, and wave polarization. The spatial profile
    of deposition along the beam connects to flux-surface-integrated quantities such
    as [fast_ion_wave_absorbed_power_inside_flux_surface](name:fast_ion_wave_absorbed_power_inside_flux_surface).


    Sign convention: Positive when power is absorbed from the wave into the ion charge
    state (energy flows from wave to ions).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_wave_absorbed_power_along_beam
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
  - name:electron_wave_absorbed_power_along_beam
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/ion/state/power
    dd_path: waves/coherent_wave/beam_tracing/beam/ion/state/power
    status: composed
- name: ion_wave_absorbed_power_along_beam
  kind: scalar
  status: draft
  description: Wave power absorbed by the total ion population (summed over all ion
    species and charge states) from a coherent wave, evaluated locally along a beam
    or ray path in beam tracing calculations. This is a path-resolved power quantity
    in watts, not a volume-integrated or flux-surface-cumulative value.
  documentation: 'In beam tracing or ray tracing models of wave heating, the wave
    power absorbed by ions at each point along a beam or ray path is computed from
    the anti-Hermitian (absorptive) part of the dielectric tensor. For a wave with
    electric field amplitude $\mathbf{E}$ and wave vector $\mathbf{k}$ propagating
    along a ray, the local power absorbed per unit path length by ions is related
    to the imaginary part of the dielectric response:


    $$\frac{dP_\mathrm{ion}}{ds} = -\frac{\omega}{2} \, \mathbf{E}^* \cdot \mathrm{Im}(\boldsymbol{\epsilon}_\mathrm{ion})
    \cdot \mathbf{E} \, A_\perp$$


    where $s$ is the arc length along the ray (m), $\omega$ is the angular frequency
    of the wave (rad/s), $\boldsymbol{\epsilon}_\mathrm{ion}$ is the ion contribution
    to the dielectric tensor (dimensionless), $\mathbf{E}$ is the wave electric field
    (V/m), and $A_\perp$ is the effective cross-sectional area of the beam (m$^2$).
    The quantity documented here, $P_\mathrm{ion}$ (W), represents the total ion absorbed
    power at a discrete point or segment along the beam, summed over all ion species
    and charge states present in the plasma.


    Typical values range from zero (no absorption) to tens of megawatts for high-power
    ion cyclotron resonance heating (ICRH) scenarios in large tokamaks. The quantity
    is nonnegative for passive absorption (energy transferred from wave to ions) and
    would be negative in the unusual case of wave amplification by ions (stimulated
    emission).


    This quantity gives the total ion contribution without decomposition by species
    or ionization state; see `ion_state_wave_absorbed_power_along_beam` for the species-
    and charge-state-resolved counterpart. The electron counterpart is `electron_wave_absorbed_power_along_beam`.
    Flux-surface-cumulative absorbed powers for ion sub-populations (fast ions, thermal
    ions) are tracked separately and should not be confused with this path-resolved
    total-ion quantity.


    Sign convention: Positive when energy is absorbed by the ion population from the
    wave (power flows from wave to ions).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_state_wave_absorbed_power_along_beam
  - name:electron_wave_absorbed_power_along_beam
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/ion/power
    dd_path: waves/coherent_wave/beam_tracing/beam/ion/power
    status: composed
- name: left_hand_circularly_polarized_electric_field_amplitude
  kind: scalar
  status: draft
  description: Amplitude of the left-hand circularly polarized (LHP) electric field
    component, defined as the modulus of the complex phasor E_+ in the plane perpendicular
    to the equilibrium magnetic field. In the Stix circular basis, E_+ rotates in
    the same sense as ion gyration about B_0, making it the resonant component for
    ion cyclotron heating.
  documentation: "In the Stix circular polarization basis, the wave electric field\
    \ perpendicular to the equilibrium magnetic field $\\mathbf{B}_0$ is decomposed\
    \ into two counter-rotating components:\n\n$$E_+ = \\tfrac{1}{\\sqrt{2}}(E_x +\
    \ i E_y), \\qquad E_- = \\tfrac{1}{\\sqrt{2}}(E_x - i E_y),$$\n\nwhere $\\hat{x}$\
    \ and $\\hat{y}$ are Cartesian unit vectors in the plane perpendicular to $\\\
    mathbf{B}_0$ (i.e. the right-handed $\\hat{x}, \\hat{y}, \\hat{b}_0$ frame with\
    \ $\\hat{b}_0 = \\mathbf{B}_0/|\\mathbf{B}_0|$). The $E_+$ component rotates in\
    \ the left-hand sense relative to $\\mathbf{B}_0$ (same direction as ion gyration),\
    \ and is therefore the resonant polarization for ion cyclotron resonance heating\
    \ (ICRH).\n\nThis quantity is the modulus of that complex phasor, adopting a time\
    \ convention $\\exp(-i\\omega t)$:\n\n$$|E_+| = \\sqrt{\\bigl(E_+^{\\mathrm{re}}\\\
    bigr)^2 + \\bigl(E_+^{\\mathrm{im}}\\bigr)^2},$$\n\nwhere $E_+^{\\mathrm{re}}$\
    \ and $E_+^{\\mathrm{im}}$ are the real and imaginary parts of the complex LHP\
    \ component stored in the companion standard names. The amplitude is a real, non-negative\
    \ quantity representing the peak magnitude of the rotating field vector.\n\nThe\
    \ unit $\\mathrm{V\\,m^{-1}}$ applies to the field amplitude; the registered unit\
    \ $\\mathrm{m^{-1}\\cdot V}$ is an algebraically equivalent representation of\
    \ the same dimension ($\\mathrm{V\\,m^{-1}} = \\mathrm{m^{-1}\\cdot V}$).\n\n\
    Typical amplitudes for ICRH full-wave simulations range from tens to hundreds\
    \ of $\\mathrm{V\\,m^{-1}}$ in the plasma interior at launched powers of order\
    \ 1 MW, with peak values near the resonance layer. The quantity is relevant across\
    \ the ICRH frequency range (tens of MHz) and is the primary figure of merit for\
    \ evaluating wave\u2013ion coupling efficiency in both full-wave and semi-analytical\
    \ models."
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_electric_field_real_part
  - name:left_hand_circularly_polarized_electric_field_imaginary_part
  - name:per_toroidal_mode_of_left_hand_circularly_polarized_electric_field_amplitude
  - name:right_hand_circularly_polarized_electric_field_real_part
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/full_wave/e_field/plus/values
    dd_path: waves/coherent_wave/full_wave/e_field/plus/values
    status: composed
- name: left_hand_circularly_polarized_electric_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the left-hand circularly polarized electric field
    component along the beam tracing path in radio-frequency wave heating calculations.
    The left-hand polarized component E+ rotates in the same sense as ions gyrating
    about the magnetic field, enabling ion cyclotron resonance absorption.
  documentation: 'The wave electric field in magnetized plasma is decomposed into
    left-hand and right-hand circularly polarized components using the rotating basis
    vectors $\hat{e}_+ = (\hat{e}_1 + i\hat{e}_2)/\sqrt{2}$ and $\hat{e}_- = (\hat{e}_1
    - i\hat{e}_2)/\sqrt{2}$, where $\hat{e}_1$ and $\hat{e}_2$ are real unit vectors
    perpendicular to the background magnetic field $\mathbf{B}_0$. The left-hand circularly
    polarized component is


    $$E_+ = \mathbf{E} \cdot \hat{e}_+^* = E_{+,\mathrm{re}} + i\,E_{+,\mathrm{im}},$$


    where $E_{+,\mathrm{re}}$ and $E_{+,\mathrm{im}}$ are the real and imaginary parts,
    respectively. This standard name gives $E_{+,\mathrm{im}} = \mathrm{Im}(E_+)$,
    in units of V m$^{-1}$.


    The left-hand polarized wave rotates in the same direction as positive ions gyrating
    about $\mathbf{B}_0$, making $E_+$ the resonant component for ion cyclotron heating.
    In beam-tracing models, the electric field components are evaluated at discrete
    points along each beam ray. Typical magnitudes of $|E_+|$ in ion cyclotron resonance
    frequency (ICRF) heating scenarios range from $10^2$ to $10^5$ V m$^{-1}$ near
    the resonance layer, depending on launched power and plasma density.


    The imaginary part $E_{+,\mathrm{im}}$ together with the real part $E_{+,\mathrm{re}}$
    fully characterizes the complex phasor $E_+$; the amplitude is $|E_+| = \sqrt{E_{+,\mathrm{re}}^2
    + E_{+,\mathrm{im}}^2}$ and the phase is $\arg(E_+) = \arctan(E_{+,\mathrm{im}}
    / E_{+,\mathrm{re}})$.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:left_hand_circularly_polarized_electric_field_real_part
  - name:left_hand_circularly_polarized_electric_field_amplitude
  - name:right_hand_circularly_polarized_electric_field_imaginary_part
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/e_field/plus/imaginary
    dd_path: waves/coherent_wave/beam_tracing/beam/e_field/plus/imaginary
    status: composed
- name: lower_hybrid_wave_power_per_toroidal_and_poloidal_refractive_index
  kind: scalar
  status: draft
  description: "Joint power spectral density d\xB2P/(dn_tor dn_pol) of lower hybrid\
    \ waves launched by an antenna row, resolved simultaneously over toroidal and\
    \ poloidal refractive index space."
  documentation: "The two-dimensional power spectral density $d^2P/(dn_\\mathrm{tor}\\\
    ,dn_\\mathrm{pol})$ describes how the total launched lower hybrid wave power is\
    \ distributed across the two-dimensional refractive index space spanned by the\
    \ toroidal refractive index $n_\\mathrm{tor} = k_\\mathrm{tor}\\,c/\\omega$ and\
    \ the poloidal refractive index $n_\\mathrm{pol} = k_\\mathrm{pol}\\,c/\\omega$,\
    \ where $k_\\mathrm{tor}$ and $k_\\mathrm{pol}$ are the toroidal and poloidal\
    \ wavenumbers, $c$ is the speed of light, and $\\omega$ is the wave angular frequency.\
    \ Integrating this spectrum over $n_\\mathrm{pol}$ recovers the one-dimensional\
    \ marginal spectrum [lower_hybrid_wave_power_per_toroidal_refractive_index](name:lower_hybrid_wave_power_per_toroidal_refractive_index),\
    \ and integrating over both $n_\\mathrm{tor}$ and $n_\\mathrm{pol}$ yields the\
    \ total launched power. The spectrum is determined by the phasing and geometry\
    \ of the lower hybrid antenna grill and is computed from coupled-mode or spectral\
    \ codes using the antenna current distribution as input; the launched $n_\\mathrm{tor}$\
    \ spectrum typically peaks in the range $1.5$\u2013$3.5$ for current-drive applications\
    \ in tokamaks. The toroidal refractive index values accessible by a given antenna\
    \ row are cataloged in [toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row](name:toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:lower_hybrid_wave_power_per_toroidal_refractive_index
  - name:toroidal_refractive_index_spectrum_of_lower_hybrid_antenna_row
  constraints: []
  sources:
