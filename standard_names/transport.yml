- name: runaway_electron_current_density
  kind: vector
  status: draft
  description: Current density vector carried by suprathermal runaway electrons accelerated
    by a parallel electric field strong enough to overcome collisional drag. It represents
    the charge flow of the runaway electron distribution, distinct from thermal plasma
    current.
  documentation: 'Runaway electron current density is the vector electric current
    per unit area carried by the suprathermal electron population whose parallel acceleration
    is not balanced by collisional friction. It is distinct from the thermal electron
    and ion current densities and is usually dominated by the component parallel to
    the magnetic field; in axisymmetric toroidal plasmas, its toroidal projection
    is described in the right-handed cylindrical $(R,\phi,Z)$ frame where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a kinetic runaway electron distribution, the current density is the first
    velocity moment of the distribution multiplied by the electron charge:


    $$

    \mathbf{J}_\mathrm{RE}(\mathbf{x},t) = -e \int \mathbf{v}\, f_\mathrm{RE}(\mathbf{x},\mathbf{v},t)\,
    d^3v

    $$


    where $e$ is the positive elementary charge in C, $\mathbf{v}$ is electron velocity
    in m s$^{-1}$, $f_\mathrm{RE}$ is the runaway-electron distribution function in
    s$^3$ m$^{-6}$, and $d^3v$ is the velocity-space volume element in m$^3$ s$^{-3}$.
    The minus sign accounts for the negative electron charge, so the current direction
    is opposite to the mean runaway electron velocity.


    In practice this quantity is computed from kinetic or reduced fluid models that
    include Dreicer generation, avalanche multiplication, collisional slowing, pitch-angle
    scattering, synchrotron and bremsstrahlung losses, and radial transport. It can
    be inferred indirectly from magnetic measurements, current-balance constraints,
    hard-x-ray emission, synchrotron radiation, and other diagnostics sensitive to
    the runaway electron population and its momentum distribution.


    Typical magnitudes range from 10$^2$-10$^5$ A m$^{-2}$ for weak seed populations,
    10$^5$-10$^7$ A m$^{-2}$ in substantial runaway plateaus, and can approach 10$^8$
    A m$^{-2}$ in narrow disruption-generated runaway beams.


    Sign convention: Positive when a component of $\mathbf{J}_\mathrm{RE}$ is aligned
    with the positive direction of its coordinate basis vector; in the right-handed
    cylindrical $(R,\phi,Z)$ frame, a positive toroidal component points toward increasing
    toroidal angle $\phi$.'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:current_density
  - name:parallel_runaway_electron_current_density
  - name:runaway_electron_source_rate_due_to_dreicer
  - name:electric_field_due_to_dreicer
- name: second_radial_derivative_of_ion_temperature
  kind: scalar
  status: draft
  description: Second derivative of the charge-state-averaged ion temperature with
    respect to normalized toroidal flux radius, quantifying the local curvature of
    the ion temperature profile used in numerical transport equation discretization.
  documentation: 'The second radial derivative of ion temperature characterizes the
    local curvature of the charge-state-averaged [ion_temperature](name:ion_temperature)
    profile $T_i$ along the normalized toroidal flux coordinate $\rho_\mathrm{tor,norm}
    \in [0, 1]$, where $\rho_\mathrm{tor,norm} = 0$ at the magnetic axis and $\rho_\mathrm{tor,norm}
    = 1$ at the last closed flux surface.


    The defining relation is:


    $$

    \frac{\partial^2 T_i}{\partial \rho_\mathrm{tor,norm}^2}

    $$


    where $T_i$ is the charge-state-averaged ion temperature and $\rho_\mathrm{tor,norm}$
    is the dimensionless normalized toroidal flux radius, so the result retains the
    unit of temperature.


    This quantity arises in the numerical discretization of the ion energy transport
    equation, where second-order spatial operators encode diffusive heat transport.
    It is not measured directly but derived from ion temperature profiles inferred
    from diagnostics such as charge exchange recombination spectroscopy. The charge-state-resolved
    form is [second_radial_derivative_of_ion_state_temperature](name:second_radial_derivative_of_ion_state_temperature),
    and the first radial derivative is [radial_derivative_of_ion_temperature](name:radial_derivative_of_ion_temperature).
    The electron species analog is [second_radial_derivative_of_electron_temperature](name:second_radial_derivative_of_electron_temperature).


    Sign convention: Positive when the radial gradient $\partial T_i / \partial \rho_\mathrm{tor,norm}$
    increases in the direction of increasing $\rho_\mathrm{tor,norm}$, corresponding
    to concave-upward curvature of the ion temperature profile.'
  unit: eV
  physics_domain: transport
  links:
  - name:ion_temperature
  - name:second_radial_derivative_of_ion_state_temperature
  - name:radial_derivative_of_ion_temperature
  - name:second_radial_derivative_of_electron_temperature
