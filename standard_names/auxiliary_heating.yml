    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:ic_antennas/antenna/module/strap/width_tor
    dd_path: ic_antennas/antenna/module/strap/width_tor
    status: composed
- name: vertical_coordinate_of_launching_position
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the electron cyclotron wave launching position,
    specifying the height of the launcher above or below the machine midplane in the
    right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The vertical coordinate $Z_{\rm launch}$ locates the point at which
    an electron cyclotron (EC) beam enters the plasma in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $Z$ measures height relative to the machine midplane,
    $R$ is the major radius from the symmetry axis, and $\phi$ is the toroidal angle.
    Together with [major_radius_of_launching_position](name:major_radius_of_launching_position),
    it fully specifies the poloidal-plane position of the EC launcher aperture, which
    determines the initial ray trajectory used in beam-tracing or ray-tracing codes
    to model wave propagation and absorption in the plasma. Typical values range from
    approximately $-2$ m to $+2$ m for medium-to-large tokamaks, depending on launcher
    installation height and whether the beam is aimed from the low-field or high-field
    side. The launching position is usually defined at the antenna mirror or waveguide
    mouth and is provided as a fixed geometric parameter in the launcher design documentation
    or inferred from engineering surveys; it pairs with the mirror orientation angles
    described by [toroidal_angle_of_electron_cyclotron_launcher_mirror](name:toroidal_angle_of_electron_cyclotron_launcher_mirror)
    to fully characterize the beam injection geometry.


    Sign convention: Positive when the launching position lies above the machine midplane
    in the $+Z$ direction.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:major_radius_of_launching_position
  - name:toroidal_angle_of_electron_cyclotron_launcher_mirror
  constraints: []
  sources:
  - id: dd:ec_launchers/beam/launching_position/z
    dd_path: ec_launchers/beam/launching_position/z
    status: composed
  - id: dd:ec_launchers/launcher/launching_position/z
    dd_path: ec_launchers/launcher/launching_position/z
    status: composed
- name: vertical_coordinate_of_measurement_position
  kind: scalar
  status: draft
  description: Vertical Z coordinate locating a generic diagnostic or reflectometer
    measurement position in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $Z$ is the height above or below the machine midplane.
  documentation: "The vertical coordinate $Z$ specifies the height of a measurement\
    \ position in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is\
    \ the major radius from the machine symmetry axis, $\\phi$ is the toroidal angle\
    \ increasing counter-clockwise when viewed from above, and $Z$ is the vertical\
    \ height in meters. This generic locus token applies across multiple diagnostic\
    \ systems \u2014 including reflectometers, interferometers, ECE radiometers, flux\
    \ loops, and barometry gages \u2014 where the measurement position is defined\
    \ by a single spatial point rather than an endpoint of a line of sight. Typical\
    \ values range from approximately $-2$ m to $+2$ m for medium-to-large tokamaks,\
    \ with $Z = 0$ at the machine midplane. For more precisely defined geometric loci\
    \ on diagnostic lines of sight, see [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight),\
    \ [vertical_coordinate_of_second_point_of_line_of_sight](name:vertical_coordinate_of_second_point_of_line_of_sight),\
    \ and [vertical_coordinate_of_third_point_of_line_of_sight](name:vertical_coordinate_of_third_point_of_line_of_sight);\
    \ for antenna-based diagnostics see [vertical_coordinate_of_centroid_of_diagnostic_antenna](name:vertical_coordinate_of_centroid_of_diagnostic_antenna).\
    \ The companion major-radius coordinate for the same measurement position is [major_radius_of_launching_position](name:major_radius_of_launching_position)\
    \ for launcher-type diagnostics.\n\nSign convention: Positive when the measurement\
    \ position is above the machine midplane in the $+Z$ direction of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: auxiliary_heating
