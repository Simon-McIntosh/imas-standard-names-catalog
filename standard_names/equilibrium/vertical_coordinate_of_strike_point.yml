name: vertical_coordinate_of_strike_point
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of the intersection between the separatrix
  and the divertor target surface.
documentation: 'The strike-point height $Z_{\mathrm{sp}}$ locates, in the poloidal
  cross section, where an open field line of the separatrix impinges on the divertor
  target plate. In single-null configurations there are two strike points (inner and
  outer); double-null or snowflake topologies produce additional intersections on
  secondary separatrices. Accurate knowledge of $Z_{\mathrm{sp}}$ is critical for
  power-exhaust management: the peak heat flux on the target scales inversely with
  the wetted area, which depends on strike-point geometry and flux expansion. Typical
  ranges are device-specific; for JET $Z_{\mathrm{sp}} \approx -1.6$ to $-1.2$ m and
  for ITER $Z_{\mathrm{sp}} \approx -4.0$ to $-3.5$ m relative to the midplane. The
  quantity is provided by equilibrium reconstruction and is used as a real-time control
  target in divertor-sweeping schemes. See `vertical_coordinate_of_active_limiter_point`
  for the limiter-configuration analog and `elongation_of_plasma_boundary` for the
  related boundary shape parameter.'
