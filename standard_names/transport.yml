- name: parallel_fast_ion_pressure
  kind: scalar
  status: draft
  description: Pressure of fast (non-thermal) ions resolved along the magnetic field
    direction, representing the parallel component of the gyrotropic fast-ion pressure
    tensor summed over charge states.
  documentation: "For a non-thermal ion population with a non-isotropic velocity distribution,\
    \ the pressure tensor decomposes into a component parallel to the magnetic field\
    \ $\\mathbf{B}$ and a component perpendicular to it. The parallel fast-ion pressure\
    \ is defined as $p_{\\parallel,\\mathrm{fast}} = m_i \\int (v_\\parallel - u_\\\
    parallel)^2 f_\\mathrm{fast}(\\mathbf{v})\\, d^3v$, where $m_i$ is the ion mass,\
    \ $v_\\parallel$ is the velocity component along $\\mathbf{B}$, $u_\\parallel$\
    \ is the mean parallel fluid velocity, and $f_\\mathrm{fast}$ is the fast-ion\
    \ distribution function; the integral is summed over all charge states when multiple\
    \ states are present. Fast ions generated by neutral beam injection (NBI) or ion\
    \ cyclotron resonance heating (ICRH) are strongly anisotropic \u2014 their parallel\
    \ pressure can differ substantially from [perpendicular_fast_ion_pressure](name:perpendicular_fast_ion_pressure)\
    \ \u2014 making both components necessary to characterize the full pressure tensor.\
    \ Together they relate to the scalar fast-ion pressure via $p_\\mathrm{fast} =\
    \ (p_{\\parallel,\\mathrm{fast}} + 2\\, p_{\\perp,\\mathrm{fast}})/3$, where [fast_ion_pressure](name:fast_ion_pressure)\
    \ is the isotropic average. Typical values in NBI-heated tokamaks range from a\
    \ few hundred Pa to several kPa in the plasma core, depending on beam power and\
    \ ion species. The quantity is computed from fast-ion distribution functions obtained\
    \ via Fokker\u2013Planck codes or Monte Carlo orbit-following codes, and can be\
    \ compared against fast-ion diagnostics such as neutral particle analyzers or\
    \ fast-ion loss detectors. Its contribution to total pressure should be compared\
    \ against [ion_pressure](name:ion_pressure) and [total_pressure](name:total_pressure)\
    \ to assess the non-thermal fraction.\n\nSign convention: Positive when the fast-ion\
    \ distribution carries net kinetic energy in the direction parallel to the local\
    \ magnetic field $\\mathbf{B}$, consistent with a positive-definite pressure."
  unit: Pa
  physics_domain: transport
  links:
  - name:perpendicular_fast_ion_pressure
  - name:fast_ion_pressure
  - name:ion_pressure
  - name:total_pressure
  arguments:
  - name: fast_ion_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/ion/pressure_fast_parallel
    dd_path: core_profiles/profiles_1d/ion/pressure_fast_parallel
    status: composed
