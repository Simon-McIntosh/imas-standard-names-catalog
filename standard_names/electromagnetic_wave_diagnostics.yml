    dd_path: reflectometer_profile/channel/antenna_emission/outline/x2
    status: attached
- name: electron_absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Wave power absorbed by the electron population from a single coherent
    beam-tracing beam, representing the electron contribution to total path-integrated
    wave energy deposition.
  documentation: "The electron absorbed power of a beam-tracing beam is the total\
    \ wave power transferred from a single traced coherent electromagnetic beam to\
    \ the electron population over its computed propagation path. It represents the\
    \ electron contribution to wave energy deposition and sums with the ion species\
    \ contributions \u2014 ion_absorbed_power_of_beam_tracing_beam and [ion_state_absorbed_power_of_beam_tracing_beam](name:ion_state_absorbed_power_of_beam_tracing_beam)\
    \ \u2014 to give the species-summed [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam).\n\
    \nThe path-integrated electron absorbed power is determined by the local electron\
    \ damping coefficient $\\alpha_e(s)$ and the evolving beam power $P(s)$:\n\n$$\n\
    P_{e,\\mathrm{abs}} = \\int_{\\mathrm{path}} 2\\,\\alpha_e(s)\\,P(s)\\,ds\n$$\n\
    \nwhere $s$ is the arc length along the ray and $\\alpha_e$ derives from the electron\
    \ contribution to the anti-Hermitian part of the plasma dielectric tensor. For\
    \ electron cyclotron resonance heating and ECE diagnostics, $\\alpha_e$ peaks\
    \ near the resonance layer where the wave frequency satisfies $\\omega = n\\,\\\
    Omega_{ce}$, with $\\Omega_{ce} = eB/m_e$ the local electron cyclotron frequency\
    \ and $n$ a harmonic integer.\n\nThis quantity is computed by beam-tracing solvers\
    \ that propagate ray equations through a plasma equilibrium and evaluate the electron\
    \ dielectric response at each point along the path. The ratio $P_{e,\\mathrm{abs}}\
    \ / P_0$ \u2014 where $P_0$ is the [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam)\
    \ \u2014 characterizes single-pass absorption efficiency, which approaches unity\
    \ in strongly absorbing scenarios such as fundamental or second-harmonic electron\
    \ cyclotron resonance heating."
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:ion_state_absorbed_power_of_beam_tracing_beam
  - name:absorbed_power_of_beam_tracing_beam
  - name:initial_power_of_beam_tracing_beam
  arguments:
  - name: absorbed_power_of_beam_tracing_beam
    operator: electron
    operator_kind: qualifier
- name: initial_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Electromagnetic wave power assigned to a beam-tracing beam at its launch
    point. It sets the reference power from which electron and ion absorption losses
    are evaluated along the beam propagation path.
  documentation: 'Initial power of a beam-tracing beam is the electromagnetic wave
    power carried by the beam at the start of the propagation calculation, before
    attenuation by plasma absorption. It is a normalization reference for the remaining
    beam power and for absorbed-power channels, including electron absorption and
    ion absorption by species or charge state.


    For single-pass attenuation along the beam path, the remaining beam power is commonly
    modeled as


    $$

    P(s) = P_0 \exp\left[-\int_0^s \alpha_\mathrm{tot}(s'')\,ds''\right]

    $$


    where $P_0$ is the initial beam power in W, $P(s)$ is the beam power in W after
    distance $s$, $s$ is path length in m measured from the launch point along the
    direction of propagation, and $\alpha_\mathrm{tot}$ is the total absorption coefficient
    in m^-1. Equivalently, with $s$ increasing along propagation, positive absorption
    gives $dP/ds = -\alpha_\mathrm{tot}P$; the total absorbed fraction is obtained
    from all absorption channels together, not from the electron channel alone unless
    ion absorption is negligible.


    In practice, this quantity may be set by source calibration, receiver/antenna
    normalization, optical throughput modeling, or a chosen reference value for a
    linear beam-tracing calculation. Absorbed powers are then computed relative to
    this initial value and partitioned among electrons, bulk ions, and ion charge-state
    channels according to the wave-plasma absorption model.


    Typical values depend strongly on the application: normalized diagnostic calculations
    often use 1 W, calibrated passive or probing diagnostics can correspond to much
    smaller or larger effective powers, and actively launched microwave diagnostic
    beams may use 1-100000 W.'
  unit: W
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:length_of_electron_cyclotron_beam
  - name:electron_absorbed_power_of_beam_tracing_beam
  - name:power_of_beam_tracing_beam
  arguments:
  - name: power_of_beam_tracing_beam
    operator: initial
    operator_kind: qualifier
- name: line_averaged_electron_density
  kind: scalar
  status: draft
  description: Electron number density averaged along a representative chord through
    the plasma, equal to the line-integrated electron density divided by the chord
    length.
  documentation: "The line-averaged electron density $\\bar{n}_e$ is the local [electron_density](name:electron_density)\
    \ $n_e$ integrated along a straight diagnostic chord through the plasma cross-section\
    \ and divided by the chord length $L$. It condenses the spatially-resolved density\
    \ profile to a single line-of-sight scalar proportional to the total electron\
    \ content along the chord, serving as a standard global density measure for confinement\
    \ scaling and density feedback control.\n\nThe defining relation is:\n\n$$\n\\\
    bar{n}_e = \\frac{1}{L} \\int_0^L n_e(\\ell) \\, d\\ell\n$$\n\nwhere $\\ell$ is\
    \ the coordinate along the chord and $L$ is the chord length.\n\nInterferometers\
    \ \u2014 microwave, far-infrared, or visible-laser systems \u2014 measure a phase\
    \ shift $\\Delta\\phi$ proportional to $\\int n_e \\, d\\ell$; dividing by $L$\
    \ and the spectral_calibration_factor_of_interferometer_beam yields $\\bar{n}_e$.\
    \ Multi-wavelength systems combine two or more channels for dispersion-based absolute\
    \ phase determination.\n\nTypical values span $10^{18}$\u2013$10^{20}$ m$^{-3}$\
    \ in ohmic and L-mode discharges, rising to $\\sim 10^{21}$ m$^{-3}$ near the\
    \ density limit. The greenwald_fraction normalizes $\\bar{n}_e$ by the Greenwald\
    \ limit to yield a dimensionless confinement-regime indicator. The chord-averaged\
    \ analog for ion content is [line_averaged_total_ion_density](name:line_averaged_total_ion_density),\
    \ and [line_averaged_electron_temperature](name:line_averaged_electron_temperature)\
    \ provides the corresponding temperature scalar."
  unit: m^-3
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:electron_density
  - name:line_averaged_total_ion_density
  - name:line_averaged_electron_temperature
  arguments:
  - name: electron_density
    operator: line_averaged
    operator_kind: qualifier
- name: normalized_toroidal_flux_coordinate_at_magnetic_axis
  kind: scalar
  status: draft
  description: Normalized toroidal flux coordinate evaluated at the magnetic axis.
    It is the non-negative radial flux-surface label based on toroidal magnetic flux
    and is exactly zero at the axis because that reference location has no toroidal
    flux interval relative to itself.
  documentation: 'The [normalized toroidal flux coordinate](name:normalized_toroidal_flux_coordinate)
    at the magnetic axis is the value of the dimensionless radial flux-surface label
    on the magnetic-axis reference line of a toroidal equilibrium. It is zero by definition
    because the magnetic axis is the inner reference for closed flux surfaces, so
    no finite toroidal-flux interval lies between the axis and itself. In flux coordinates
    $(\rho_{\mathrm{tor,norm}}, \theta, \phi)$, the poloidal angle $\theta$ is singular
    at the magnetic axis, but the radial coordinate has the well-defined limiting
    value $\rho_{\mathrm{tor,norm}} = 0$.


    The normalized coordinate is defined using the non-negative square root of the
    toroidal-flux fraction between the magnetic-axis and boundary reference values:


    $$

    \rho_{\mathrm{tor,norm}} = \sqrt{\frac{\Phi - \Phi_0}{\Phi_b - \Phi_0}}

    $$


    where $\Phi$ is the toroidal magnetic flux in Wb on the flux surface being labeled,
    $\Phi_0$ is the magnetic-axis reference value in Wb, and $\Phi_b$ is the boundary
    reference value in Wb at the last closed flux surface. At the magnetic axis $\Phi
    = \Phi_0$, so $\rho_{\mathrm{tor,norm}} = 0$.


    This value is computed from an equilibrium reconstruction rather than measured
    as an independent observable. In diagnostic mapping, it serves as the radial origin
    and a consistency check for measurement locations assigned close to the plasma
    center; off-axis locations are described by quantities such as [normalized_toroidal_flux_coordinate_at_measurement_position](name:normalized_toroidal_flux_coordinate_at_measurement_position).
    It is the dimensionless axis counterpart of the dimensional [toroidal_flux_radius_of_magnetic_axis](name:toroidal_flux_radius_of_magnetic_axis),
    while the outer normalization is set by the boundary reference related to [toroidal_flux_radius_at_plasma_boundary](name:toroidal_flux_radius_at_plasma_boundary).


    The physical value at the magnetic axis is exactly 0. For closed flux surfaces,
    $\rho_{\mathrm{tor,norm}}$ spans 0-1 from the magnetic axis to the last closed
    flux surface; diagnostic positions near, but not exactly on, the axis may be assigned
    small nonzero values because of finite spatial resolution and equilibrium-reconstruction
    uncertainty.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_measurement_position
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: magnetic_axis
    operator_kind: locus
- name: normalized_toroidal_flux_coordinate_at_measurement_position
  kind: scalar
  status: draft
  description: Dimensionless radial flux-surface label based on normalized toroidal
    magnetic flux, evaluated at the physical position sampled by a diagnostic measurement.
    It identifies the corresponding nested flux surface, with 0 at the magnetic axis
    and approximately 1 at the last closed flux surface.
  documentation: 'The normalized toroidal flux coordinate at a measurement position
    is the dimensionless radial label assigned to the point or localized region sampled
    by a diagnostic measurement. It is derived from the toroidal magnetic flux enclosed
    by nested magnetic flux surfaces, with the origin at the magnetic axis and the
    outer normalization reference at the plasma boundary or last closed flux surface.


    The coordinate is defined from the toroidal flux difference between the flux surface
    through the measurement position and the magnetic-axis flux:


    $$

    \rho_{\mathrm{tor,norm}}(\mathbf{x}_m) = \sqrt{\frac{\Phi_m - \Phi_0}{\Phi_b -
    \Phi_0}}

    $$


    where $\mathbf{x}_m$ is the measurement position, $\Phi_m$ is the toroidal magnetic
    flux in Wb of the flux surface passing through that position, $\Phi_0$ is the
    magnetic-axis toroidal flux in Wb, and $\Phi_b$ is the boundary toroidal flux
    in Wb. The square root makes this a nonnegative radial coordinate; for a valid
    nested-flux-surface mapping the numerator and denominator have the same flux orientation,
    so the ratio is nonnegative and increases outward from the magnetic axis.


    In practice, the value is obtained by combining the diagnostic measurement geometry
    with an equilibrium reconstruction that maps the sampled position to a flux surface.
    For measurements with finite spatial extent, the value represents the effective
    or representative measurement position used in the diagnostic interpretation,
    rather than a property of the diagnostic signal itself.


    Typical values for measurements inside the confined plasma are 0-1, with values
    near 0 corresponding to the core, 0.2-0.8 to the plasma interior, and 0.8-1 to
    the edge region near the last closed flux surface. Values greater than 1 can occur
    for positions mapped outside the last closed flux surface or when an equilibrium
    mapping is extrapolated beyond the confined region.'
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:normalized_toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_magnetic_axis
  - name:normalized_toroidal_flux_coordinate_at_constraint_position
  arguments:
  - name: normalized_toroidal_flux_coordinate
    operator: measurement_position
    operator_kind: locus
- name: poloidal_angle_of_measurement_position
  kind: scalar
  status: draft
  description: "Poloidal angle of a diagnostic measurement position in the poloidal\
    \ cross-section of the right-handed cylindrical (R, \u03C6, Z) frame. The zero\
    \ direction is outward major radius +R from the magnetic axis, and positive angles\
    \ increase clockwise when viewed from the +\u03C6 direction."
  documentation: 'The poloidal angle of a measurement position is the angular coordinate
    of that point about the magnetic axis in a poloidal cross-section of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It identifies where around the magnetic axis
    a diagnostic samples, separate from any radial coordinate or absolute position
    coordinates.


    For a measurement position $(R_\mathrm{m},Z_\mathrm{m})$ and magnetic-axis position
    $(R_\mathrm{ax},Z_\mathrm{ax})$ in that cross-section, the clockwise-positive
    angle from the outward radial direction can be written as:


    $$

    \theta \equiv \operatorname{atan2}(Z_\mathrm{ax}-Z_\mathrm{m},\, R_\mathrm{m}-R_\mathrm{ax})
    \pmod{2\pi}

    $$


    where $R_\mathrm{m}$ and $Z_\mathrm{m}$ are the measurement-position major radius
    and vertical height in meters, $R_\mathrm{ax}$ and $Z_\mathrm{ax}$ are the magnetic-axis
    major radius and vertical height in meters, and $\operatorname{atan2}(y,x)$ returns
    a quadrant-resolved angle in radians. Values that differ by $2\pi n$ with integer
    $n$ represent the same physical direction; the branch, such as $(-\pi,\pi]$ or
    $[0,2\pi)$, is a representation choice rather than part of the physical definition.


    In practice this angle is computed from the reconstructed measurement position
    and magnetic-axis location, or from an equivalent ray, beam, or scattering-point
    geometry for electromagnetic-wave diagnostics. It is commonly used together with
    measurement-position major radius, vertical height, or a radial flux coordinate
    to describe the diagnostic sampling location without implying a unique spatial
    position by the angle alone.


    A full poloidal coverage spans any interval of length $2\pi$ rad. With the convention
    above, outboard-midplane positions have $\theta$ near 0 rad, lower positions have
    $\theta$ near $+1.57$ rad, upper positions have $\theta$ near $-1.57$ rad, and
    inboard-midplane positions lie near $\pm 3.14$ rad depending on the chosen branch.


    Sign convention: Positive when the angular displacement from the outward radial
    $+R$ direction toward the measurement position is clockwise in the poloidal cross-section
    of the right-handed cylindrical $(R,\phi,Z)$ frame when viewed from the $+\hat{\phi}$
    direction.'
  unit: rad
  physics_domain: electromagnetic_wave_diagnostics
  links:
