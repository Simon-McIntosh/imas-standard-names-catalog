- name: major_radius_of_measurement_position
  kind: scalar
  status: draft
  description: Major-radius coordinate R of a measurement position in the right-handed
    cylindrical (R, phi, Z) frame, where R is the perpendicular distance from the
    machine symmetry axis. R is intrinsically non-negative and is expressed in meters.
  documentation: "The major-radius coordinate $R$ locates a measurement position as\
    \ the perpendicular distance from the machine symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R \\geq 0$ by construction.\n\nTogether\
    \ with the toroidal angle $\\phi$ and the vertical coordinate $Z$, this quantity\
    \ fully specifies the position in three-dimensional space. The companion coordinates\
    \ are the toroidal-angle coordinate $\\phi$ and the vertical-height coordinate\
    \ $Z$ of the same measurement position.\n\nTypical values for tokamak devices\
    \ range from roughly $0.1\\,\\mathrm{m}$ (tight-aspect-ratio machines) to $8\\\
    text{\u2013}10\\,\\mathrm{m}$ (large conventional tokamaks), depending on the\
    \ radial location of the measurement within the plasma cross-section.\n\nThis\
    \ coordinate applies generally to any diagnostic or hardware element \u2014 including\
    \ beam-tracing or reflectometry channel positions, antenna modules, and pressure\
    \ gage locations \u2014 where a spatial reference point must be recorded. It identifies\
    \ the geometric location of the measurement without implying any specific physical\
    \ interpretation about what is being measured at that point."
