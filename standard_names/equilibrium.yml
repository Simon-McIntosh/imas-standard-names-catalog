- name: vertical_coordinate_of_x_point
  kind: scalar
  status: draft
  description: "Vertical (Z) coordinate of the primary X-point in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, locating the poloidal field null point of\
    \ a diverted magnetic equilibrium."
  documentation: "The vertical coordinate of the primary X-point defines the height\
    \ $Z_{\\mathrm{X}}$ of the magnetic field null (Br = Bz = 0) on the main separatrix\
    \ in a diverted tokamak configuration. This X-point location determines the vertical\
    \ position of the divertor entrance and strongly influences the scrape-off layer\
    \ geometry, heat flux distribution to the divertor targets, and H-mode pedestal\
    \ stability. The coordinate is measured in the IMAS cylindrical $(R, \\phi, Z)$\
    \ frame with $Z$ increasing upward from the machine midplane.\n\nTypical values\
    \ for the primary X-point vertical coordinate range from $Z_{\\mathrm{X}} \\approx\
    \ \\pm 0.1$\u202Fm (lower single-null) to $\\pm 0.5$\u202Fm (highly elongated\
    \ shapes) below or above the midplane in medium-size tokamaks, depending on the\
    \ poloidal field coil currents and plasma shaping. In ITER, the primary X-point\
    \ is planned to lie approximately $\\pm 0.5$\u202Fm from the midplane. The X-point\
    \ position is routinely reconstructed from magnetic diagnostics via equilibrium\
    \ codes (e.g., EFIT, LIUQE) and can be controlled in real time by the plasma control\
    \ system.\n\nSign convention: Positive when the X-point is located above the machine\
    \ midplane (i.e., $Z > 0$).\n\nSee also [vertical_coordinate_of_magnetic_axis](name:vertical_coordinate_of_magnetic_axis)\
    \ for the magnetic axis height, and [major_radius_of_x_point](name:major_radius_of_x_point)\
    \ for the horizontal coordinate of the X-point."
  unit: m
  physics_domain: equilibrium
