- name: toroidal_ion_damping_rate
  kind: scalar
  status: draft
  description: Damping rate for the toroidal component of summed thermal ion momentum
    flow due to neoclassical collisional processes.
  documentation: "The toroidal ion damping rate $\nu_{\\phi,i}$ characterizes the\
    \ exponential decay constant for the toroidal component of the summed thermal\
    \ ion momentum flow in the edge plasma, describing how neoclassical collisional\
    \ processes (e.g., parallel viscosity, poloidal friction) dissipate toroidal rotation.\
    \ It is one component of the vector-valued [ion_damping_rate](name:ion_damping_rate),\
    \ which also includes radial, poloidal, and parallel components. In the cylindrical\
    \ $(R, \\phi, Z)$ frame, the damping of toroidal momentum is a key determinant\
    \ of the plasma rotation profile and influences transport barriers. Typical damping\
    \ rates in the core of H-mode tokamak plasmas range from 1\u2013100 s$^{-1}$,\
    \ increasing toward the edge. The toroidal component is particularly important\
    \ for controlling impurity transport and stabilizing neoclassical tearing modes.\n\
    \nSign convention: Positive when toroidal momentum is damped in the direction\
    \ of flow (i.e., the damping rate acts as a dissipative term reducing the magnitude\
    \ of the toroidal angular momentum).\n\nSee also [toroidal_ion_state_damping_rate](name:toroidal_ion_state_damping_rate)\
    \ for charge-state-resolved variants and [parallel_ion_damping_rate](name:parallel_ion_damping_rate)\
    \ for the parallel component."
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_damping_rate
  - name:toroidal_ion_state_damping_rate
  - name:parallel_ion_damping_rate
  arguments:
  - name: ion_damping_rate
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    status: composed
  - id: dd:plasma_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    dd_path: plasma_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    status: composed
- name: toroidal_ion_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Toroidal component of the momentum diffusion coefficient for the summed
    ion population, quantifying the cross-field transport of toroidal angular momentum.
  documentation: Toroidal momentum diffusion coefficient for the summed ion population,
    representing the rate at which toroidal angular momentum is transported radially
    across flux surfaces due to turbulent and collisional processes. It appears in
    the momentum flux relation $\Pi_{\phi} = -\chi_{\phi}^{\mathrm{ion}} \, n_i m_i
    R^2 \, \nabla \Omega_{\phi}$, where $n_i$ is the total ion number density, $m_i$
    the mean ion mass, $R$ the major radius, and $\Omega_{\phi}$ the toroidal rotation
    frequency. Typical values in the core of H-mode tokamaks range from 0.1 to 10
    m$^2$s$^{-1}$, with larger values in the edge region where turbulence is stronger.
    This quantity is distinguished from the charge-state-resolved diffusivity by applying
    to the summed ion population; the per-species equivalent is given by `toroidal_ion_state_momentum_diffusion_coefficient`.
    The full vector diffusivity, which includes radial and poloidal components, is
    described by `ion_momentum_diffusion_coefficient`. Measurement is typically inferred
    from interpretive transport analysis using measured toroidal rotation profiles
    (e.g., from charge-exchange recombination spectroscopy) combined with neoclassical
    and gyrokinetic modeling.
  unit: m^2.s^-1
  physics_domain: transport
  links: []
  arguments:
  - name: ion_momentum_diffusion_coefficient
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:plasma_transport/model/profiles_1d/ion/momentum/toroidal/d
    dd_path: plasma_transport/model/profiles_1d/ion/momentum/toroidal/d
    status: composed
- name: toroidal_ion_state_damping_rate
  kind: scalar
  status: draft
  description: Collisional damping rate for the toroidal component of the momentum
    flow of a single ion charge state.
  documentation: "The toroidal ion-state damping rate quantifies the rate at which\
    \ the toroidal component of the ion momentum flux for a specific charge state\
    \ relaxes due to collisions. In the neoclassical transport framework, this damping\
    \ rate $\nu_{\text{damp}}$ governs the resistive dissipation of toroidal rotation\
    \ for that charge state, and appears as a coefficient in the momentum balance\
    \ equation $\frac{\text{d} \tilde{v}_{\text{T}}}{\text{d}t} = -\nu_{\text{damp}}\
    \ \tilde{v}_{\text{T}}$. Typical values for thermal ions in the plasma core range\
    \ from $10^1$ to $10^4$ s$^{-1}$ depending on collisionality and charge state.\
    \ It is computed from neoclassical models and is distinguished from the momentum\
    \ damping rate summed over all ion charge states by the `[toroidal_ion_damping_rate](name:toroidal_ion_damping_rate)`.\
    \ See also `[ion_state_damping_rate](name:ion_state_damping_rate)` for the poloidal\
    \ and radial components of the same quantity.\n\nSign convention: Positive when\
    \ the toroidal momentum perturbation is damped (i.e., the damping reduces the\
    \ perturbed flow towards equilibrium)."
  unit: s^-1
  physics_domain: transport
  links:
  - name:toroidal_ion_damping_rate
  - name:ion_state_damping_rate
  arguments:
  - name: ion_state_damping_rate
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/momentum/toroidal/flow_damping_rate
    status: composed
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/toroidal/flow_damping_rate
    status: composed
