name: parallel_electrical_conductivity
status: draft
description: Electrical conductivity of the plasma measured along the magnetic-field
  direction, governing parallel current response to the inductive electric field.
documentation: "The parallel electrical conductivity $\\sigma_\\parallel$ (S m$^{-1}$\
  \ = $\\Omega^{-1}$ m$^{-1}$) relates the current density component along $\\mathbf{B}$\
  \ to the parallel electric field via $J_\\parallel = \\sigma_\\parallel E_\\parallel$.\
  \ In a fully ionized plasma it is given by the Spitzer-H\xE4rm formula $\\sigma_{\\\
  rm Sp} = \\kappa_0 \\, (k_B T_e)^{3/2} / (Z_{\\rm eff} \\, e^2 \\, m_e^{1/2} \\\
  , \\ln\\Lambda)$, where $\\kappa_0$ is a numerical factor depending on $Z_{\\rm\
  \ eff}$, $T_e$ is the electron temperature (eV), $\\ln\\Lambda$ is the Coulomb logarithm,\
  \ and $Z_{\\rm eff}$ is the effective ion charge number. Neoclassical corrections\
  \ (trapped-particle effects) reduce $\\sigma_\\parallel$ relative to the Spitzer\
  \ value by a factor that depends on the inverse aspect ratio and collisionality\
  \ regime. Typical core values in tokamaks range from $10^7$ to $10^9$ S m$^{-1}$\
  \ for $T_e \\sim 1$\u2013$20$ keV. This quantity is central to sawtooth crash modeling,\
  \ resistive MHD stability analysis, and current-diffusion simulations. It is generally\
  \ computed from local $T_e$, $n_e$, and $Z_{\\rm eff}$ profiles rather than measured\
  \ directly."
