- name: helium_4_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of helium-4 (alpha) ions per unit volume at the magnetic
    axis.
  documentation: 'Helium-4 ion density $n_{\alpha}$ at the magnetic axis, where $\nabla
    \psi = 0$ and the innermost flux surface is located. Fusion-produced alpha particles
    thermalize via Coulomb collisions with the background plasma, contributing to
    core fuel density and pressure. Measurement is inferred from charge-exchange recombination
    spectroscopy (CXRS) or passive spectroscopy of He II emission; core densities
    in D-T burning plasmas range from $10^{17}$ to $10^{19}\,\text{m}^{-3}$. The axis
    value is typically the maximum of the radial density profile, constrained by the
    balance between alpha particle production and transport. See also [helium_4_density_at_separatrix](name:helium_4_density_at_separatrix)
    and [helium_4_density_at_pedestal](name:helium_4_density_at_pedestal) for profile
    comparisons.


    Sign convention: Positive when $n_{\alpha}$ increases with increasing density
    of the alpha particle population.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:helium_4_density_at_separatrix
  - name:helium_4_density_at_pedestal
  sources:
  - id: dd:summary/local/magnetic_axis/n_i/helium_4/value
    dd_path: summary/local/magnetic_axis/n_i/helium_4/value
    status: composed
- name: hydrogen_density_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Hydrogen ion number density at the radial location of an internal transport
    barrier, where turbulent transport is strongly suppressed.
  documentation: 'The hydrogen ion number density, denoted $n_{\mathrm{H}}$, quantifies
    the density of hydrogen ions (all charge states summed) at the internal transport
    barrier (ITB) location. The ITB is a region of steep pressure gradient where turbulent
    transport is reduced, leading to a localized enhancement of the density profile.
    This quantity is typically inferred from ion density profile measurements, such
    as those from charge exchange recombination spectroscopy (CXRS) or from equilibrium
    reconstructions constrained by Thomson scattering and interferometry. The density
    gradient across the ITB can approach the ideal ballooning limit, with $n_{\mathrm{H}}$
    reaching values typical of the core region, e.g., $10^{19}$ to $10^{20} \, \mathrm{m}^{-3}$
    in medium-size tokamaks. See also [hydrogen_density_at_pedestal](name:hydrogen_density_at_pedestal)
    for the edge transport barrier, and [tritium_density_at_internal_transport_barrier](name:tritium_density_at_internal_transport_barrier)
    for the tritium species at the same barrier location.


    Sign convention: Positive when the hydrogen ion number density is positive.


    Measurement methods include profile reflectometry and the inversion of line-integrated
    density measurements from interferometry or polarimetry. The exact ITB radial
    coordinate is defined by the location of the maximum gradient in the ion temperature
    or toroidal rotation profile, established from the transport analysis.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:hydrogen_density_at_pedestal
  - name:tritium_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/n_i/hydrogen/value
    dd_path: summary/local/itb/n_i/hydrogen/value
    status: composed
- name: ion_momentum_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Volume source density of ion momentum resulting from the diamagnetic
    drift in a magnetized plasma. This term arises from the gyromotion of ions in
    a pressure gradient.
  documentation: "The diamagnetic momentum source density for the ion species is given\
    \ by $\\mathbf{M}_{\\mathrm{dia}} = \\mathbf{b} \\times \\nabla p_i / \\Omega_{ci}$,\
    \ where $\\mathbf{b}$ is the unit vector along the magnetic field, $\\nabla p_i$\
    \ is the ion pressure gradient, and $\\Omega_{ci} = e Z_i B / m_i$ is the ion\
    \ cyclotron frequency. This source contributes to the ion momentum balance equation\
    \ $\\partial_t (m_i n_i \\mathbf{v}_i) + \\nabla \\cdot \\boldsymbol{\\Pi}_i =\
    \ \\mathbf{j}_i \\times \\mathbf{B} + \\mathbf{M}_{\\mathrm{dia}} + \\dots$, where\
    \ $\\boldsymbol{\\Pi}_i$ is the ion stress tensor. The component along the magnetic\
    \ field direction is $M_{\\|} = \\mathbf{M}_{\\mathrm{dia}} \\cdot \\mathbf{b}\
    \ = 0$, consistent with the purely perpendicular nature of the diamagnetic drift.\
    \ Typical values in the tokamak pedestal region are in the range 0.1--10 kg\\\
    ,m$^{-1}$\\,s$^{-2}$ for ITER-like parameters, scaling with the product of density\
    \ and temperature gradients. \n\nSign convention: Positive when the momentum is\
    \ directed along the magnetic field unit vector $\\mathbf{b}$.\n\nSee also [ion_velocity_due_to_diamagnetic_drift](name:ion_velocity_due_to_diamagnetic_drift)\
    \ for the corresponding velocity and [neutral_momentum_due_to_diamagnetic_drift](name:neutral_momentum_due_to_diamagnetic_drift)\
    \ for the neutral counterpart."
  unit: kg.m^-1.s^-2
  physics_domain: transport
  links:
  - name:ion_velocity_due_to_diamagnetic_drift
  - name:neutral_momentum_due_to_diamagnetic_drift
  sources:
  - id: dd:plasma_sources/source/ggd/ion/state/momentum/diamagnetic
    dd_path: plasma_sources/source/ggd/ion/state/momentum/diamagnetic
    status: composed
- name: ion_state_density
  kind: scalar
  status: draft
  description: Density of a specific ion charge state, including both thermal and
    fast (non-thermal) populations. This total density is the sum of the thermal ion
    density and the fast ion density for that charge state.
  documentation: 'The ion state density $n_{z,\text{total}}$ is the total number of
    ions with charge state $z$ per unit volume, combining both thermal and fast (non-thermal)
    populations. It is defined as:


    $$n_{z,\text{total}} = n_{z,\text{thermal}} + n_{z,\text{fast}}$$


    where:

    - $n_{z,\text{thermal}}$ is the density of thermalized ions with charge state
    $z$ (in m$^{-3}$),

    - $n_{z,\text{fast}}$ is the density of fast (non-thermal) ions with charge state
    $z$ (in m$^{-3}$).


    Typical values range from $10^{17}\,\text{m}^{-3}$ in the edge of low-density
    tokamak plasmas to $10^{21}\,\text{m}^{-3}$ in the core of high-density devices.
    Multi-charge-state modeling resolves the distribution of ionization stages for
    elements such as carbon, tungsten, or argon. Measurement techniques include charge-exchange
    recombination spectroscopy for thermal populations and fast-ion diagnostics (e.g.,
    neutral particle analyzers) for non-thermal populations. The total density is
    used in transport simulations and radiation calculations.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:state_density
  - name:thermal_ion_density
  - name:fast_ion_density
  sources:
  - id: dd:core_profiles/profiles_1d/ion/state/density
    dd_path: core_profiles/profiles_1d/ion/state/density
    status: attached
  - id: dd:plasma_profiles/profiles_2d/ion/state/density
    dd_path: plasma_profiles/profiles_2d/ion/state/density
    status: composed
- name: ion_state_power_density
  kind: scalar
  status: draft
  description: Volumetric power density deposited into or extracted from the ion energy
    transport equation for a specific ion charge state.
  documentation: The volumetric power density $P_{z,i} = \Gamma_z E_z + Q_{z,i}$ represents
    the net energy source or sink for charge state $z$ of an impurity or fuel ion
    species, where $\Gamma_z$ is the particle source rate for that charge state, $E_z$
    is the characteristic energy per particle, and $Q_{z,i}$ accounts for collisional
    energy exchange with other species. This term appears as a source in the ion energy
    transport equation and is typically provided by atomic physics models (e.g., for
    ionization, recombination, and charge exchange processes) or from heating and
    current drive calculations. Typical values in the core of a fusion-grade plasma
    range from $10^3$ to $10^7\ \mathrm{W\,m^{-3}}$, depending on the charge state,
    background density, and heating power. The sum over all charge states for a given
    species yields the net power density for that species, while the sum over all
    species and charge states recovers the total ion power density [total_ion_power_density](name:total_ion_power_density).
    The analogous quantity for the neutral population is [neutral_state_power_density](name:neutral_state_power_density).
  unit: W.m^-3
  physics_domain: transport
  links:
  - name:total_ion_power_density
  - name:neutral_state_power_density
  sources:
  - id: dd:core_sources/source/profiles_1d/ion/state/energy
    dd_path: core_sources/source/profiles_1d/ion/state/energy
    status: composed
  - id: dd:edge_sources/source/ggd/ion/state/energy/values
    dd_path: edge_sources/source/ggd/ion/state/energy/values
    status: composed
- name: ion_state_source_rate_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of the net particle source rate for a specific
    ion charge state inside a flux surface.
  documentation: 'This quantity represents the total net particle production rate
    per second for a chosen ion charge state (e.g., fully stripped helium or partially
    stripped impurity), integrated from the magnetic axis outward to a given flux
    surface. It serves as the source term in the ion density transport equation, quantifying
    how many ions of that charge state are added or removed within the enclosed plasma
    volume. The volumetric counterpart is $S_{Z,q} = \mathrm{d} n_{Z,q} / \mathrm{d}
    t$ (see [ion\_state\_source\_rate](name:ion_state_source_rate), with units m$^{-3}$
    s$^{-1}$), and the cumulative source is $S_{Z,q}^{\mathrm{cum}}(\psi) = \int_{V(\psi)}
    S_{Z,q} \,\mathrm{d}V$, where $V(\psi)$ is the volume enclosed by flux surface
    $\psi$. Typical cumulative source rates range from 10$^{19}$--10$^{22}$ s$^{-1}$
    for hydrogenic species in NBI-heated tokamaks, depending on the charge state and
    ionization balance. The value is derived from spectroscopic measurements of line
    emission coupled with collisional-radiative models, or from neutral beam attenuation
    and bremsstrahlung analysis.


    Sign convention: Positive when the net particle source adds particles to the enclosed
    volume.


    See also the cumulative sources for total ions [total\_ion\_source\_rate\_at\_inside\_flux\_surface](name:total_ion_source_rate_at_inside_flux_surface)
    and for specific species [ion\_source\_rate\_at\_inside\_flux\_surface](name:ion_source_rate_at_inside_flux_surface).
    The corresponding electron source is [electron\_source\_rate\_at\_inside\_flux\_surface](name:electron_source_rate_at_inside_flux_surface).'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_state_source_rate
  - name:total_ion_source_rate_at_inside_flux_surface
  - name:ion_source_rate_at_inside_flux_surface
  - name:electron_source_rate_at_inside_flux_surface
