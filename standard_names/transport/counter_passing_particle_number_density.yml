name: counter_passing_particle_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of particles whose parallel velocity is opposite to the
  plasma current direction, i.e. counter-passing orbits with $v_\parallel < 0$ (COCOS-dependent).
documentation: 'The counter-passing particle number density $n_{\mathrm{ctr}}$ counts
  particles per unit volume whose guiding-center orbits circulate in the direction
  opposite to the plasma current (counter-passing: $v_\parallel / B < 0$ under standard
  COCOS-11 sign conventions). It is obtained by integrating the distribution function
  $f(\mathbf{v})$ over the velocity-space region satisfying the counter-passing orbit
  condition, $n_{\mathrm{ctr}} = \int_{v_\parallel < 0,\,\mathrm{passing}} f(\mathbf{v})\,d^3v$,
  where $v_\parallel$ is the velocity component parallel to $\mathbf{B}$. This quantity
  is central to anisotropic transport modeling and neutral-beam current-drive analysis,
  where the balance between co- and counter-passing populations determines the net
  beam-driven current. Typical core values in NBI-heated tokamak plasmas range from
  $10^{18}$ to $10^{20}\,\mathrm{m^{-3}}$ depending on beam geometry and plasma density.
  See also the co-passing counterpart and the total distribution density.'
