- name: hydrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of hydrogen (protium) ions in the boundary plasma adjacent
    to a limiter surface. It characterizes the local ion population interacting with
    the plasma-facing limiter material.
  documentation: 'Hydrogen density at a limiter is the local number density of hydrogen
    ions in the boundary plasma next to a limiter surface. It describes the plasma
    population available for particle flux, recycling, charge exchange, and plasma-material
    interaction at the limiter location, without implying a universal relation to
    upstream or pedestal densities.


    As a number density, it is defined by the local particle content per unit volume:


    $$

    n_{\mathrm{H}^+} = \frac{dN_{\mathrm{H}^+}}{dV}

    $$


    where $N_{\mathrm{H}^+}$ is the number of hydrogen ions in a small plasma volume
    $V$ near the limiter. The value is non-negative and is expressed in $m^{-3}$.


    In practice this quantity is inferred from boundary-plasma diagnostics and modeling,
    such as Langmuir probes, spectroscopic measurements combined with collisional-radiative
    interpretation, or edge plasma simulations constrained by measurements. Its value
    depends on local ionization, recycling from the limiter, cross-field transport,
    magnetic connection length, plasma fueling, and the limiter geometry.


    Typical values in tokamak boundary plasmas are about $10^{17}$-$10^{20}$ m$^{-3}$,
    with lower values in tenuous scrape-off-layer conditions and higher values near
    dense, strongly recycling limiter plasmas.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_density_at_limiter
  - name:hydrogen_density_at_pedestal
  - name:hydrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: hydrogen
    operator_kind: qualifier
- name: ion_average_temperature_at_limiter
  kind: scalar
  status: draft
  description: Ion average temperature at a limiter is the density-weighted temperature
    of the boundary-plasma ion population adjacent to a limiter surface, averaged
    over all ion species and their charge states.
  documentation: 'Ion average temperature at a limiter is the local thermal temperature
    of ions in the boundary plasma adjacent to a limiter surface. It represents the
    mixture-averaged ion thermal energy near the plasma-wall interface and includes
    all contributing ion species and ionization states.


    A common definition is the density-weighted average over species and charge states:


    $$

    T_{i,\mathrm{avg}} = \frac{\sum_s \sum_z n_{s,z} T_{i,s,z}}{\sum_s \sum_z n_{s,z}}

    $$


    where $s$ indexes ion species, $z$ indexes charge states, $n_{s,z}$ is the local
    number density of ions in charge state $z$ of species $s$ in $\mathrm{m}^{-3}$,
    and $T_{i,s,z}$ is the corresponding ion temperature in eV. The resulting $T_{i,\mathrm{avg}}$
    is in eV; if charge states are not separately resolved, the same expression applies
    using the available effective species populations and temperatures.


    In practice, this quantity is obtained from boundary-plasma measurements, edge
    modeling, or a combination of both at a location representative of the limiter
    interaction region. It is a plasma ion temperature, not a material surface temperature,
    and may correspond to the ion population approaching the sheath when the limiter
    directly intersects open magnetic field lines.


    Typical limiter-edge values are of order 1-100 eV. Cold, strongly recycling boundary
    plasmas may have ion average temperatures of only a few eV, while attached or
    high-power limiter conditions can reach several tens of eV or higher.'
  unit: eV
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_temperature_at_midplane
- name: ion_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Outgoing energy flux per unit plasma-facing wall area released by recombination
    of plasma ions at the material boundary, summed over all incident ion species,
    charge states, and surface recombination channels.
  documentation: 'Ion recombination energy flux at the wall quantifies the outgoing
    power per unit plasma-facing surface area emitted when plasma ions of any species
    and charge state recombine or neutralize at the material boundary. It is the species-and-charge-state-integrated
    ion contribution to [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination),
    complementing the neutral recombination energy channel given by [neutral_energy_flux_at_wall_due_to_recombination](name:neutral_energy_flux_at_wall_due_to_recombination).


    The ion recombination energy flux $Q_\text{ion,rec}$ at wall location $\mathbf{x}_w$
    is the sum of charge-state-resolved contributions across all incident species
    and channels:


    $$

    Q_\text{ion,rec}(\mathbf{x}_w) = \sum_{s,q,c} Q^{\text{ion}}_{s,q,c}(\mathbf{x}_w)

    $$


    where $s$ labels the ion species, $q$ the charge state, $c$ the surface recombination
    channel, and $Q^{\text{ion}}_{s,q,c}$ is the per-channel contribution resolved
    by [ion_state_energy_flux_at_wall_due_to_recombination](name:ion_state_energy_flux_at_wall_due_to_recombination).


    In plasma-facing component modeling, this quantity is computed from incident ion
    flux distributions, surface neutralization probabilities, potential energy accommodation,
    and atomic recombination energetics for each species and charge state. The spatial
    distribution depends on scrape-off-layer plasma conditions and surface material
    properties, and contributes to the surface power balance alongside kinetic and
    other deposition channels captured by [energy_flux_at_wall](name:energy_flux_at_wall).'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:neutral_energy_flux_at_wall_due_to_recombination
  - name:ion_state_energy_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: ion
    operator_kind: qualifier
- name: ion_kinetic_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident kinetic energy flux per unit wall area carried by plasma ions,
    summed over ion species and charge states, as they strike the plasma-facing wall.
  documentation: 'Ion kinetic energy flux at the wall is the incident component of
    kinetic power carried by ions crossing a plasma-facing material surface per unit
    area. It includes the translational kinetic energy of ions at impact, summed over
    all ion species and charge states, and is the ionic contribution to the total
    kinetic_energy_flux_at_wall. It excludes ion potential energy, radiation, and
    energy transported by particles emitted or reflected from the wall.


    For a kinetic ion distribution evaluated at a wall point, the local incident flux
    can be written as:


    $$

    Q_{i,\mathrm{kin}}^{\mathrm{inc}}(\mathbf{x}_w) = \sum_{s,z} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_w
    < 0} \frac{1}{2} m_s |\mathbf{v}|^2 |\mathbf{v}\cdot\hat{\mathbf{n}}_w| f_{s,z}(\mathbf{x}_w,\mathbf{v})\,d^3v

    $$


    where $Q_{i,\mathrm{kin}}^{\mathrm{inc}}$ is in W m^-2, $\mathbf{x}_w$ is the
    wall-surface position in meters, $s$ labels ion species, $z$ labels charge state,
    $m_s$ is the ion mass in kg, $\mathbf{v}$ is ion velocity in m s^-1, $\hat{\mathbf{n}}_w$
    is the unit normal directed from the wall material into the plasma, and $f_{s,z}$
    is the ion distribution function in m^-3 (m s^-1)^-3. The integration domain selects
    ions moving toward the wall.


    In practice this quantity is estimated from ion particle fluxes and impact energies
    using boundary plasma diagnostics, sheath or edge-plasma modeling, kinetic simulations,
    or wall heat-flux measurements combined with a decomposition of the total heat
    load. Separating the ion kinetic contribution from electron heat flux, neutral
    heat flux, potential-energy terms, radiation, and emitted-particle losses generally
    requires model assumptions.


    Typical magnitudes are strongly dependent on wall location and plasma regime.
    Main-chamber surfaces may receive values from about 10^2-10^5 W m^-2, while divertor
    or limiter strike regions in attached or partially detached operation can reach
    about 10^5-10^7 W m^-2; short transient events can be substantially larger.


    Sign convention: Positive when the wall-normal ion kinetic energy flux is directed
    from the plasma into the wall material.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links: []
- name: ion_state_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Energy flux density emitted from a plasma-facing wall by recombination
    of a specified ion charge state. It gives the charge-state-resolved contribution
    to the recombination energy released per unit wall area.
  documentation: 'Ion-state recombination energy flux at the wall is the power per
    unit plasma-facing surface area emitted at the surface when ions of a specified
    species and charge state recombine. It represents only that initial charge-state
    contribution; summing over charge states for one ion species gives [ion_energy_flux_at_wall_due_to_recombination](name:ion_energy_flux_at_wall_due_to_recombination),
    and summing over ion species gives [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).
    This quantity refers to recombination energy release, not to the incident ion
    kinetic or thermal energy flux.


    For ions of species $s$ arriving in charge state $z$, a local estimate is the
    recombining particle flux multiplied by the total ionization energy recovered
    during neutralization:


    $$

    q^{\mathrm{rec}}_{s,z} = \Gamma_{s,z} \, e \sum_{k=1}^{z} I_{s,k}

    $$


    where $q^{\mathrm{rec}}_{s,z}$ is the recombination energy flux density in W m$^{-2}$,
    $\Gamma_{s,z}$ is the flux of recombining ions of species $s$ and charge state
    $z$ to the wall in m$^{-2}$ s$^{-1}$, $I_{s,k}$ is the $k$th ionization potential
    of species $s$ in eV, and $e$ converts eV to joule. More detailed surface models
    may partition this released energy among photons, emitted neutrals, electrons,
    and solid-surface heating, but the charge-state-resolved energy scale is set by
    the sum of ionization potentials.


    In practice this quantity is computed from charge-state-resolved ion fluxes to
    plasma-facing components together with atomic ionization energies and surface
    recombination or neutralization models. It may also be constrained indirectly
    by combining particle-flux estimates from probes, spectroscopy, or particle balance
    with atomic data, while keeping it separate from incident kinetic heat flux, radiation
    absorbed at the wall, and chemical or sputtering energy terms.


    Typical charge-state-resolved values range from less than 10$^{2}$ W m$^{-2}$
    on weakly wetted wall regions to 10$^{4}$-10$^{6}$ W m$^{-2}$ in recycling divertor
    or limiter regions. Local values can approach 10$^{6}$-10$^{7}$ W m$^{-2}$ for
    very large particle fluxes or high charge states, but the summed recombination
    contribution is usually below the total plasma heat load.


    Sign convention: Positive when recombination energy is emitted from the wall surface
    into the adjacent plasma or vacuum.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:ion_state_kinetic_energy_flux_at_wall
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: ion_state
    operator_kind: qualifier
- name: iron_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of iron (Fe) impurity ions in the plasma immediately
    adjacent to a limiter surface, excluding neutral iron atoms.
  documentation: 'Iron density at the limiter is the local number density of ionized
    iron in the plasma-side region next to a limiter surface. It represents iron impurity
    ions only; neutral Fe atoms are excluded from this quantity.


    When charge states are resolved, the total iron ion density is the sum over all
    positive ionization states:


    $$

    n_{\mathrm{Fe}} = \sum_{q=1}^{26} n_{\mathrm{Fe}^{q+}}

    $$


    where $n_{\mathrm{Fe}}$ is the total iron ion number density in m$^{-3}$, $q$
    is the ion charge state, and $n_{\mathrm{Fe}^{q+}}$ is the number density in m$^{-3}$
    of iron ions with charge $+q e$. The sum starts at $q=1$, so neutral iron, $\mathrm{Fe}^0$,
    is not included.


    In practice this quantity is obtained from local or modeled impurity-ion densities
    evaluated at the plasma-facing limiter boundary. If only charge-state-resolved
    densities are available, they are summed over ionized charge states; if a total
    iron ion density is available directly, it should correspond to the same ion-only
    definition.


    Typical values are highly device-, discharge-, material-, and plasma-edge dependent,
    and no universal range is implied by the definition. The value is non-negative
    and is expressed in m$^{-3}$.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:iron_density_at_divertor_target
  - name:iron_density_at_pedestal
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  arguments:
  - name: density_at_limiter
    operator: iron
    operator_kind: qualifier
- name: kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Power per unit plasma-facing wall area carried as kinetic energy by
    particles emitted from the surface through plasma-material interaction processes
    such as sputtering or backscattering. It is the outgoing emitted-particle contribution,
    distinct from incident or total wall energy flux.
  documentation: 'Kinetic energy flux at a wall due to surface emission is the surface-normal
    power density carried by particles that leave a plasma-facing material after plasma-material
    interactions such as physical sputtering or backscattering. It includes only translational
    kinetic energy of the emitted population moving away from the material surface,
    and is distinct from the incident heat load arriving at the wall or the total
    wall energy balance.


    The quantity can be written as a velocity moment of the emitted distribution over
    the outward half-space of velocities:


    $$

    q_\mathrm{emit}^\mathrm{kin} = \sum_{\alpha} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}>0}
    \frac{1}{2} m_\alpha v^2 f_\alpha^\mathrm{emit}(\mathbf{v}) \, (\mathbf{v}\cdot\hat{\mathbf{n}})
    \, d^3v

    $$


    where $q_\mathrm{emit}^\mathrm{kin}$ is the emitted kinetic energy flux density,
    $\alpha$ labels the emitted component being aggregated, $m_\alpha$ is particle
    mass, $v=|\mathbf{v}|$, $f_\alpha^\mathrm{emit}$ is the emitted velocity distribution
    at the surface, and $\hat{\mathbf{n}}$ is the unit normal directed from the material
    into the plasma-facing region. For a resolved component the summation is restricted
    to that component.


    Species-summed ion contributions are represented by [ion kinetic energy flux at
    wall due to surface emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission),
    while charge-state-resolved ion contributions are represented by [ion-state kinetic
    energy flux at wall due to surface emission](name:ion_state_kinetic_energy_flux_at_wall_due_to_surface_emission).
    A broader wall quantity such as [energy flux at wall](name:energy_flux_at_wall)
    includes incident and other exchanged energy channels, whereas this quantity isolates
    kinetic energy carried by particles emitted from the surface.


    Values are usually computed from plasma-material interaction models that combine
    incident particle fluxes, energies, and angles with surface-emission yields and
    emitted energy-angle distributions. Experimental constraints are indirect, coming
    from spectroscopy, surface analysis, mass or charge resolved particle diagnostics,
    and calorimetry.


    For ion-resolved realizations, representative modeled magnitudes are typically
    10^1-10^4 W m^-2 on main-chamber surfaces and 10^3-10^5 W m^-2 in divertor regions;
    localized high-yield cases may approach 10^6 W m^-2, still generally below the
    total incident heat flux.


    Sign convention: Positive when emitted particles carry kinetic energy away from
    the material surface and into the plasma-facing region.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:ion_state_kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:electron_energy_flux_at_wall
  - name:energy_flux_at_wall_due_to_surface_emission
  arguments:
  - name: energy_flux_at_wall_due_to_surface_emission
    operator: kinetic
    operator_kind: qualifier
- name: ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Kinetic energy flux density carried by ions leaving the plasma-facing
    wall through surface emission processes such as physical sputtering and ion backscattering.
  documentation: "The kinetic energy flux density at the plasma-facing wall surface\
    \ carried by ions emitted outward via surface emission \u2014 the family of plasma\u2013\
    wall interaction processes, including physical sputtering, chemical sputtering,\
    \ and ion backscattering, that return ionic species from the wall to the plasma.\
    \ The `kinetic` qualifier restricts this to translational kinetic energy of the\
    \ emitted ion velocity distribution, excluding potential energy stored in electronic\
    \ excitation or residual ionization charge, which is captured separately by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).\n\
    \nThe emitted kinetic energy flux $\\Phi_{\\mathrm{kin,emit}}$ sums over all emitted\
    \ ion species $s$:\n\n$$\n\\Phi_{\\mathrm{kin,emit}} = \\sum_s \\int_{v_n > 0}\
    \ \\tfrac{1}{2} m_s v^2 \\, v_n \\, f_{s,\\mathrm{emit}}(\\mathbf{v}) \\, d^3v\n\
    $$\n\nwhere $m_s$ is the ion mass of species $s$, $v = |\\mathbf{v}|$ is the ion\
    \ speed, $v_n > 0$ is the outward surface-normal velocity component at the wall,\
    \ and $f_{s,\\mathrm{emit}}(\\mathbf{v})$ is the velocity distribution function\
    \ of emitted ions.\n\nIn plasma\u2013surface interaction modeling, this flux is\
    \ evaluated by convolving incident plasma conditions with energy-resolved surface\
    \ emission yields and backscattering coefficients from binary-collision approximation\
    \ databases. It is the mechanism-attributed form of [ion_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission)\
    \ and the emitted counterpart to [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),\
    \ which captures the incident kinetic flux. Charge-state-resolved contributions\
    \ are tracked by ion_state_energy_flux_at_wall, and the electron analog is [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_kinetic_energy_flux_at_wall
  - name:electron_energy_flux_at_wall
  arguments:
  - name: kinetic_energy_flux_at_wall_due_to_surface_emission
    operator: ion
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/ion/emitted/values
    status: composed
- name: ion_state_kinetic_energy_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Power per unit wall area carried by emitted ions in a specified charge
    state leaving a plasma-facing surface through surface emission processes such
    as physical sputtering and backscattering.
  documentation: "This quantity gives the outward kinetic energy flux density at a\
    \ plasma-facing wall surface attributable to ions in a single charge state, emitted\
    \ via surface interactions including physical sputtering, backscattering, and\
    \ secondary ion emission. It is the charge-state-resolved counterpart of [ion_kinetic_energy_flux_at_wall_due_to_surface_emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission),\
    \ which aggregates contributions from all ion charge states.\n\nThe emitted kinetic\
    \ energy flux density for charge state $z$ is defined as:\n\n$$\nQ_{\\mathrm{ke},z}^{\\\
    mathrm{emit}} = \\int_0^{\\infty} E \\, j_{z}^{\\mathrm{emit}}(E) \\, dE\n$$\n\
    \nwhere $E$ is the kinetic energy of an emitted ion and $j_{z}^{\\mathrm{emit}}(E)$\
    \ is the energy-differential particle flux density of ions emitted in charge state\
    \ $z$ from the surface. Summing $Q_{\\mathrm{ke},z}^{\\mathrm{emit}}$ over all\
    \ charge states recovers [ion_kinetic_energy_flux_at_wall_due_to_surface_emission](name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission).\n\
    \nTogether with the incident [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),\
    \ the emitted component per charge state enters the net kinetic energy exchange\
    \ at each wall element; the net wall kinetic energy balance \u2014 incident minus\
    \ emitted \u2014 feeds into the total [energy_flux_at_wall](name:energy_flux_at_wall).\
    \ This quantity is computed from plasma-material interaction models or Monte Carlo\
    \ transport codes that resolve sputtering and backscattering yields as a function\
    \ of incident ion energy, angle, and charge state."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_kinetic_energy_flux_at_wall_due_to_surface_emission
  - name:ion_kinetic_energy_flux_at_wall
  - name:energy_flux_at_wall
  arguments:
  - name: kinetic_energy_flux_at_wall_due_to_surface_emission
    operator: ion_state
    operator_kind: qualifier
- name: krypton_density_at_limiter
  kind: scalar
  status: draft
  description: Local krypton ion number density evaluated at the plasma-facing limiter
    surface, where impurity sputtering and recycling connect edge plasma composition
    to the wall material.
  documentation: 'The krypton number density at the limiter is the local volumetric
    count of krypton ions per unit volume at the plasma-side limiter contact point,
    near the sheath entrance of this plasma-facing component. It is the krypton-species-resolved
    component of the total [density_at_limiter](name:density_at_limiter). When individual
    ionization stages are resolved, this quantity equals their sum:


    $$

    n_\mathrm{Kr}(x_\mathrm{lim}) = \sum_{q=1}^{36} n_{\mathrm{Kr}^{q+}}(x_\mathrm{lim})

    $$


    where $n_{\mathrm{Kr}^{q+}}$ is the number density of krypton ions in charge state
    $q+$ at the limiter evaluation point $x_\mathrm{lim}$; when charge states are
    not individually resolved, this sum is implicit.


    Krypton ($Z = 36$) is a high-atomic-number noble gas that can be seeded into the
    edge plasma for radiative cooling of the scrape-off layer, disruption mitigation
    studies, or impurity transport experiments near plasma-facing components. Its
    local concentration at the limiter is governed by sputtering sources, charge-exchange
    recycling, and cross-field impurity transport from the confined region. Spatial
    counterparts at other poloidal positions include [krypton_density_at_pedestal](name:krypton_density_at_pedestal),
    [krypton_density_at_divertor_target](name:krypton_density_at_divertor_target),
    and [krypton_density_at_magnetic_axis](name:krypton_density_at_magnetic_axis);
    the [volume_averaged_krypton_density](name:volume_averaged_krypton_density) characterizes
    the global impurity inventory.


    Sign convention: Positive when krypton ions are present at the limiter location,
    consistent with particle number density being a non-negative definite quantity.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_divertor_target
  - name:krypton_density_at_magnetic_axis
  - name:volume_averaged_krypton_density
  arguments:
  - name: density_at_limiter
    operator: krypton
    operator_kind: qualifier
- name: lithium_density_at_limiter
  kind: scalar
  status: draft
  description: Lithium ion number density in the plasma immediately adjacent to the
    limiter surface, where lithium impurities originate from wall conditioning, sputtering,
    or deliberate injection.
  documentation: 'Lithium ion number density at the limiter quantifies the local concentration
    of lithium ions in the plasma at the limiter contact region, evaluated near the
    sheath entrance on the plasma side rather than within the solid wall material.
    It is the lithium-species contribution to the total [density_at_limiter](name:density_at_limiter),
    isolating lithium impurities arising from sputtering, desorption, or intentional
    wall conditioning from contributions by other ion species present at the same
    location.


    The number density is defined as the lithium ion count per unit volume adjacent
    to the limiter surface, $n_{\mathrm{Li}} = N_{\mathrm{Li}} / V$, where $N_{\mathrm{Li}}$
    is the number of lithium ions within the volume element $V$.


    Measurement relies on passive or active optical emission spectroscopy detecting
    characteristic lithium line emission from the plasma edge, or on edge transport
    models constrained by spectroscopic observations of the limiter vicinity. In lithium
    wall-conditioning experiments, elevated values at the limiter reflect recycled
    and re-ionized lithium returning from the plasma-facing surface. Typical edge
    lithium densities in conditioning regimes range from $10^{15}$ to $10^{18}\ \mathrm{m^{-3}}$,
    depending on conditioning intensity and plasma parameters.


    For the same species at other spatial locations, [lithium_density_at_pedestal](name:lithium_density_at_pedestal)
    and lithium_density_at_divertor_target provide analogous localized quantities,
    while [line_averaged_lithium_density](name:line_averaged_lithium_density) gives
    the chord-integrated complement useful for global impurity inventory estimates.


    Sign convention: Positive for any finite concentration of lithium ions at the
    limiter position, consistent with number density being a non-negative particle
    count per unit volume.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:lithium_density_at_pedestal
  - name:line_averaged_lithium_density
  arguments:
  - name: density_at_limiter
    operator: lithium
    operator_kind: qualifier
- name: mass_of_wall_material
  kind: scalar
  status: draft
  description: Mass of one atom of the element constituting a plasma-facing wall material,
    used in plasma-material interaction modeling to determine sputtering yields, nuclear
    stopping cross sections, and ion implantation ranges.
  documentation: "The atomic mass of a wall material element is the mass of a single\
    \ neutral atom of that element, with $1\\,\\text{u} = 1/12$ the mass of a $^{12}\\\
    text{C}$ atom. For pure elemental plasma-facing materials \u2014 tungsten ($A\
    \ \\approx 184\\,\\text{u}$), beryllium ($A \\approx 9\\,\\text{u}$), carbon ($A\
    \ \\approx 12\\,\\text{u}$), and iron ($A \\approx 56\\,\\text{u}$) \u2014 the\
    \ value equals the standard atomic weight of the element.\n\nIn plasma-material\
    \ interaction modeling, $A_\\mathrm{wall}$ appears in sputtering yield formulae\
    \ through the mass ratio $M_1 / M_2$ between the incident plasma ion of mass $M_1$\
    \ and the target wall atom of mass $M_2 = A_\\mathrm{wall}\\,\\text{u}$, governing\
    \ both the kinematic energy transfer factor and nuclear stopping cross sections.\
    \ Erosion rates and ion implantation ranges at plasma-facing surfaces \u2014 including\
    \ limiters and divertor targets \u2014 are sensitive functions of $A_\\mathrm{wall}$\
    \ through standard sputtering threshold and yield models.\n\nThe atomic mass is\
    \ a fixed nuclear property obtained from established atomic data tables and is\
    \ independent of plasma conditions. The specific elemental value for a configured\
    \ wall is provided by [atomic_mass_of_wall_material](name:atomic_mass_of_wall_material)."
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:atomic_mass_of_wall_material
  sources:
  - id: derived:mass_of_wall_material
    status: composed
- name: atomic_mass_of_wall_material
  kind: scalar
  status: draft
  description: Atomic mass of the element or isotope constituting the plasma-facing
    wall material, expressed in unified atomic mass units referenced to one-twelfth
    the mass of a carbon-12 atom.
  documentation: 'The atomic mass of a wall material element is the ratio of the mean
    atomic mass of that element (or of a specific isotope) to the unified atomic mass
    unit $u$, where $u \approx 1.66054 \times 10^{-27}$ kg. This quantity enters sputtering
    yield models, particle momentum transfer calculations, and impurity transport
    equations in the boundary plasma at plasma-wall interfaces.


    The defining relation is:


    $$

    A = \frac{m_{\mathrm{atom}}}{u}

    $$


    where $m_{\mathrm{atom}}$ is the mass of the atom or isotope of interest and $u$
    is the unified atomic mass unit.


    Values are tabulated in standard nuclear data libraries for pure elemental materials;
    for alloys or composite wall materials the relevant constituent element or isotope
    must be identified separately in associated metadata, since a single scalar value
    cannot represent a mixture without additional weighting. Typical values for common
    plasma-facing materials span approximately 9 for beryllium (a first-wall candidate),
    12 for carbon, 56 for iron structural alloys, and 184 for tungsten used as divertor
    armor.


    The companion quantity [nuclear_mass](name:atomic_mass_of_wall_material) provides
    a closely equivalent representation for the same wall-material context. The general
    species-agnostic form [atomic_mass](name:atomic_mass) applies to any atomic species,
    while [ion_atomic_mass](name:ion_atomic_mass) and [neutral_species_atomic_mass](name:neutral_species_atomic_mass)
    specialize this concept to charged and neutral plasma species in the boundary
    region, respectively.'
  unit: u
  physics_domain: plasma_wall_interactions
  links:
  - name:atomic_mass
  - name:ion_atomic_mass
  - name:neutral_species_atomic_mass
  arguments:
  - name: mass_of_wall_material
    operator: atomic
    operator_kind: qualifier
- name: neon_density_at_limiter
  kind: scalar
  status: draft
  description: Neon ion number density in the boundary plasma immediately adjacent
    to a limiter surface, evaluated at the plasma-side sheath entrance. It is summed
    over neon ionization stages unless a charge-state-resolved quantity is specified.
  documentation: 'Neon density at the limiter is the local number density of neon
    ions in the boundary plasma just outside a limiter surface, at the plasma-side
    sheath entrance. It is the limiter-surface analog of [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),
    restricted to the plasma-wall interaction region rather than the global plasma
    boundary.


    For a small plasma volume adjacent to the limiter, the charge-state-summed neon
    ion density is the count of neon ions per unit volume:


    $$

    n_\mathrm{Ne} = \frac{N_\mathrm{Ne}}{V}

    $$


    where $N_\mathrm{Ne}=\sum_z N_{\mathrm{Ne}^{z+}}$ is the total number of neon
    ions over all included ionization stages and $V$ is the sampled plasma volume
    in m^3, giving $n_\mathrm{Ne}$ in m^-3.


    In practice this quantity is inferred from limiter-viewing spectroscopy with collisional-radiative
    modeling, from edge impurity transport analysis constrained by local electron
    density and temperature, or from plasma-wall interaction simulations. It counts
    neon ions in the plasma, not neutral neon at the wall and not a charge-weighted
    quantity such as an effective charge contribution.


    Typical limiter-adjacent neon ion densities are about 10^14-10^18 m^-3 in trace
    to moderately seeded boundary plasmas, with local values approaching 10^19 m^-3
    during strong neon puffing or very dense, cool edge conditions.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_pedestal
  - name:xenon_density_at_limiter
  - name:argon_density_at_limiter
  - name:nitrogen_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: neon
    operator_kind: qualifier
- name: neutral_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident arrival flux density at a plasma-facing wall for neutral particles
    in the kinetic-energy channel, summed over all neutral species and internal quantum
    states.
  documentation: "Neutral energy flux at the wall is the rate at which neutral particles\u2014\
    atoms and molecules from the plasma and scrape-off layer\u2014arrive at a plasma-facing\
    \ material surface per unit area per unit time in the kinetic-energy transport\
    \ channel, with contributions integrated over all neutral species and internal\
    \ quantum states. This quantity is the species-and-state-integrated counterpart\
    \ to [neutral_state_energy_flux_at_wall](name:neutral_state_energy_flux_at_wall),\
    \ which resolves individual quantum states, and represents the total neutral kinetic\
    \ contribution within the [energy_flux_at_wall](name:energy_flux_at_wall) family.\n\
    \nThe incident flux is the inward normal velocity moment of the total neutral\
    \ distribution function, summed over species $s$ and quantum states $k$:\n\n$$\n\
    \\Gamma_{n,\\mathrm{inc}} = \\sum_s \\sum_k \\int_{\\mathbf{v}\\cdot\\hat{\\mathbf{n}}_w\
    \ < 0} (-\\mathbf{v}\\cdot\\hat{\\mathbf{n}}_w)\\, f_{n,s,k}(\\mathbf{v})\\, d^3v\n\
    $$\n\nwhere $\\hat{\\mathbf{n}}_w$ is the unit surface normal pointing from the\
    \ wall outward into the plasma, $\\mathbf{v}$ is the neutral particle velocity,\
    \ and $f_{n,s,k}(\\mathbf{v})$ is the velocity distribution function of neutral\
    \ species $s$ in quantum state $k$. The result carries units m$^{-2}$ s$^{-1}$\u2014\
    a particle arrival count\u2014because the \"energy_flux\" label identifies the\
    \ kinetic-energy transport channel as distinct from potential-energy or radiative\
    \ channels of neutral wall loading, not a power density in W m$^{-2}$.\n\nThis\
    \ quantity is obtained from neutral transport simulations, Monte Carlo particle-tracking\
    \ calculations, or fluid-neutral models coupled to plasma-boundary solvers. It\
    \ informs surface recycling coefficients and sputtering source terms; [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall)\
    \ provides the same species-integrated arrival rate without the energy-channel\
    \ classification."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_energy_flux_at_wall
  - name:energy_flux_at_wall
  - name:neutral_particle_flux_at_wall
  arguments:
  - name: energy_flux_at_wall
    operator: neutral
    operator_kind: qualifier
- name: neutral_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Neutral recombination energy-channel flux at a wall is the outgoing
    number flux per unit plasma-facing wall area of neutral atoms or molecules emitted
    after surface recombination, integrated over a specified kinetic-energy interval
    and summed over neutral product species and ion precursors. It is not an energy-weighted
    heat flux.
  documentation: 'Neutral recombination energy-channel flux at the wall is the number
    flux per unit plasma-facing surface area emitted from the material surface when
    incident ions recombine or neutralize and leave as neutral atoms or molecules
    in a specified kinetic-energy interval. It represents the neutral-product channel
    of recombination at the boundary, summed over neutral product species, product
    states, and ion precursor species unless those dependencies are resolved separately.
    The same emitted-neutral population without kinetic-energy selection is described
    by [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination);
    an energy-weighted heat-flux contribution would instead have unit W m$^{-2}$ and
    contribute to [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).


    The flux in a kinetic-energy interval $\Delta E$ can be written as the interval
    integral of the outgoing neutral energy spectrum, equivalently as the corresponding
    velocity-space moment of recombination products leaving the surface:


    $$

    \Gamma^{0,\mathrm{rec}}_{\Delta E}(\mathbf{x}_w)

    = \sum_a \int_{\Delta E} \Phi^{0,\mathrm{rec}}_a(\mathbf{x}_w,E)\,dE

    = \sum_a \int_{\substack{E_a(\mathbf{v})\in\Delta E \\ \mathbf{v}\cdot\hat{\mathbf{n}}_p>0}}

    f^{0,\mathrm{rec}}_a(\mathbf{x}_w,\mathbf{v})\,(\mathbf{v}\cdot\hat{\mathbf{n}}_p)\,d^3v

    $$


    where $\Gamma^{0,\mathrm{rec}}_{\Delta E}$ has unit m$^{-2}$ s$^{-1}$, $\mathbf{x}_w$
    is a wall-surface point in meters, $a$ labels neutral product species or states,
    $E_a(\mathbf{v})=m_a|\mathbf{v}|^2/2$ is the neutral kinetic energy in joules,
    $m_a$ is the neutral mass in kilograms, $\mathbf{v}$ is velocity in m s$^{-1}$,
    $\Delta E$ is an energy interval in the same energy unit as $E$, $\Phi^{0,\mathrm{rec}}_a$
    is the outgoing differential neutral flux spectrum with unit m$^{-2}$ s$^{-1}$
    J$^{-1}$ when $E$ is in joules, $f^{0,\mathrm{rec}}_a$ is the velocity distribution
    of recombination products with unit m$^{-3}$(m s$^{-1}$)$^{-3}$, $d^3v$ has unit
    (m s$^{-1}$)$^3$, and $\hat{\mathbf{n}}_p$ is the dimensionless unit normal directed
    from the material surface into the plasma-facing volume. For spectra tabulated
    per electronvolt, $\Phi^{0,\mathrm{rec}}_a$ carries the corresponding per-eV unit
    and the interval integral still gives m$^{-2}$ s$^{-1}$.


    In plasma-facing component modeling, this quantity is computed from incident charged-particle
    fluxes, surface neutralization or recombination probabilities, wall material and
    temperature, energy accommodation, and the angular and kinetic-energy distribution
    assigned to emitted neutral products. State-resolved neutral recombination particle
    fluxes are represented by [neutral_state_particle_flux_at_wall_due_to_recombination](name:neutral_state_particle_flux_at_wall_due_to_recombination),
    while summing this quantity over kinetic-energy intervals recovers the corresponding
    neutral recombination particle flux at the wall. Direct measurement is uncommon;
    model results are usually constrained by consistency with edge neutral emission,
    gas balance, and plasma-wall particle balance.


    Typical values are highly dependent on recycling regime and on the width of $\Delta
    E$. For broad kinetic-energy intervals, order-of-magnitude modeling values can
    range from 10^16-10^20 m$^{-2}$ s$^{-1}$ on weakly recycling main-chamber surfaces
    to 10^20-10^23 m$^{-2}$ s$^{-1}$ in high-recycling divertor or limiter regions;
    narrow energy bins are smaller in proportion to the spectral bin width.


    Sign convention: Positive when neutral recombination products cross the wall surface
    from the material surface into the plasma-facing volume.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
  - name:neutral_state_energy_flux_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/incident/values
    status: composed
- name: neutral_state_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Neutral-state energy flux at the wall is the incident arrival rate
    per unit area and time for neutral particles in a specified internal quantum state
    within the kinetic neutral-wall channel. Despite the energy-flux label, it is
    a particle arrival flux density, not a heat flux, and is not multiplied by kinetic
    energy.
  documentation: "Neutral-state energy flux at the wall is the rate at which neutral\
    \ particles\u2014atoms or molecules in a specified internal quantum state\u2014\
    arrive at a plasma-facing material surface per unit area per unit time in the\
    \ kinetic neutral-wall channel. The state label identifies a resolved internal\
    \ population, such as an electronic state, metastable level, or molecular vibrational\
    \ or rotational level. This quantity counts incident arrivals and is not deposited\
    \ power; it contains no multiplication by particle kinetic energy or by a surface\
    \ energy-deposition coefficient.\n\nFor a neutral velocity distribution at the\
    \ wall, the state-resolved incident arrival flux density is\n\n$$\n\\Gamma_{n,q}(\\\
    mathbf{x}_w) = \\int_{\\mathbf{v}\\cdot\\hat{\\mathbf{n}}_w < 0} |\\mathbf{v}\\\
    cdot\\hat{\\mathbf{n}}_w|\\, f_{n,q}(\\mathbf{x}_w,\\mathbf{v})\\, d^3v\n$$\n\n\
    where $\\Gamma_{n,q}$ is the incident neutral arrival flux density for internal\
    \ state $q$, $\\mathbf{x}_w$ is the wall-surface position, $\\hat{\\mathbf{n}}_w$\
    \ is the unit normal pointing from the wall into the plasma, and the condition\
    \ $\\mathbf{v}\\cdot\\hat{\\mathbf{n}}_w < 0$ selects particles moving toward\
    \ the material. The distribution $f_{n,q}$ is the neutral velocity distribution\
    \ for state $q$, with phase-space-density units such that the integral has units\
    \ of m$^{-2}$ s$^{-1}$. If arrivals are additionally separated by kinetic-energy\
    \ group, the integration is restricted to velocities in that group, but the integrand\
    \ remains a particle-count flux rather than an energy-weighted flux.\n\nIn practice\
    \ this quantity is computed by counting neutral wall crossings in state-resolved\
    \ edge neutral transport, kinetic, or particle-tracking calculations. Experimental\
    \ constraints are indirect and come from spectroscopy of state populations, pressure\
    \ and recycling measurements, and plasma-edge diagnostics; wall calorimetry measures\
    \ deposited power and therefore requires a surface-interaction model before it\
    \ can be related to this arrival flux. Summing over internal states gives the\
    \ corresponding state-summed [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall),\
    \ while omitting the kinetic-channel classification gives the closely related\
    \ [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).\n\
    \nTypical values for an individual neutral state range from about $10^{15}$-$10^{20}$\
    \ m$^{-2}$ s$^{-1}$ on main-chamber surfaces and can reach $10^{20}$-$10^{23}$\
    \ m$^{-2}$ s$^{-1}$ in high-recycling or detached divertor regions. The value\
    \ depends strongly on neutral density, recycling coefficient, molecular dissociation,\
    \ ionization balance, wall temperature, surface material, and the definition of\
    \ the resolved internal state."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_at_wall
  - name:energy_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  - name:neutral_state_energy_flux_due_to_recombination
  arguments:
  - name: energy_flux_at_wall
    operator: neutral_state
    operator_kind: qualifier
- name: neutral_state_energy_flux_due_to_recombination
  kind: scalar
  status: draft
  description: Incident energy-resolved flux density of neutral particles in a specified
    quantum state produced by recombination and directed toward a plasma-facing wall
    surface.
  documentation: 'Neutral state energy flux due to recombination is the incident,
    energy-resolved flux density of neutral particles in a specified quantum state
    that are produced by recombination and cross a plasma-facing surface toward the
    material. It counts the neutral particle flow associated with a kinetic-energy
    channel and internal state, so its canonical unit is m^-2 s^-1 rather than power
    per unit area.


    For a surface element with unit normal $\hat{\mathbf n}_w$ directed from the material
    toward the plasma, the incident flux in state $q$ and energy interval $\Delta
    E$ may be written as


    $$

    \Gamma_{q,\Delta E}^{\mathrm{rec,inc}} = \int_{\mathbf v\cdot\hat{\mathbf n}_w
    < 0,\ E(\mathbf v)\in\Delta E} \left(-\mathbf v\cdot\hat{\mathbf n}_w\right) f_q^{\mathrm{rec}}(\mathbf
    x_w,\mathbf v)\,d^3v

    $$


    where $f_q^{\mathrm{rec}}$ is the velocity distribution of recombination-produced
    neutrals in quantum state $q$ at wall position $\mathbf x_w$, $E(\mathbf v)$ is
    their kinetic energy, and $-\mathbf v\cdot\hat{\mathbf n}_w$ is the positive speed
    component into the wall. Integrating over energy intervals and summing over neutral
    states gives the corresponding total recombination-produced incident neutral flux.


    In practice this quantity is obtained from edge-plasma and plasma-wall interaction
    modeling, neutral transport calculations, or diagnostics combined with a collisional-radiative
    model that resolves recombination channels and neutral-state populations. It is
    non-negative because only particles crossing toward the surface are included;
    neutrals moving away from the surface are part of the outgoing flux, not the incident
    flux.


    Typical values depend strongly on plasma density, electron temperature near the
    surface, recycling, and detached-divertor conditions. Representative incident
    state-resolved recombination fluxes can range from 10^16-10^22 m^-2 s^-1, with
    the largest values usually occurring in cold, dense recombining boundary plasmas.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_due_to_recombination
  - name:energy_flux_due_to_recombination
  - name:neutral_state_energy_flux_at_wall
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:ion_state_energy_flux_at_wall_due_to_recombination
- name: nitrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of ionized nitrogen in the boundary plasma immediately
    adjacent to a limiter. It represents the local nitrogen impurity ion population,
    normally summed over ion charge states.
  documentation: 'Ionized nitrogen density at a limiter is the local number of nitrogen
    impurity ions per unit volume in the boundary plasma immediately adjacent to a
    limiter surface. Unless a charge-state-specific quantity is named, it denotes
    the sum over all ionized nitrogen charge states $N^{q+}$ with $q=1,\ldots,7$ and
    excludes neutral nitrogen atoms or molecules.


    The charge-state-summed density is the zeroth velocity-space moment of the nitrogen
    ion distribution functions:


    $$

    n_N^{\mathrm{ion}} = \sum_{q=1}^{7} n_{N^{q+}} = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{v})
    \, d^3v

    $$


    where $n_N^{\mathrm{ion}}$ is the total ionized nitrogen number density in m^-3,
    $n_{N^{q+}}$ is the number density of charge state $q$ in m^-3, $f_{N^{q+}}(\mathbf{v})$
    is the velocity-space distribution function with units s^3 m^-6, and $d^3v$ is
    the velocity-space volume element with units m^3 s^-3.


    In experiments, this quantity is typically inferred from impurity spectroscopy
    together with atomic data, local electron density and temperature constraints,
    and edge plasma modeling. In simulations or reconstructions that resolve nitrogen
    charge states, the limiter value is obtained by summing the local ionized charge-state
    densities adjacent to the limiter; neutral nitrogen is treated separately.


    Typical summed ionized nitrogen densities near limiters are about $10^{14}$-$10^{17}$
    m^-3 for trace or weakly seeded nitrogen and can reach $10^{17}$-$10^{19}$ m^-3
    during strong nitrogen seeding or local nitrogen release. The value depends on
    the limiter source rate, ionization balance, recombination, and transport along
    the boundary plasma.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:nitrogen_density_at_pedestal
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:argon_density_at_limiter
  - name:neon_density_at_limiter
  - name:density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: nitrogen
    operator_kind: qualifier
- name: oxygen_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed number density of ionized oxygen impurity immediately
    adjacent to a limiter surface at the plasma-wall interface.
  documentation: 'Oxygen density at a limiter is the local number density of ionized
    oxygen impurity in the plasma immediately adjacent to the limiter surface. It
    is species-specific and charge-state-summed, so it represents oxygen ions only,
    not neutral oxygen or electrons.


    For oxygen ion charge states from singly ionized to fully stripped, the charge-state-summed
    limiter density is defined as:


    $$

    n_{\mathrm{O,lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{O,lim}}$ and each charge-state density $n_{\mathrm{O}^{q+},\mathrm{lim}}$
    are number densities in m^-3, $q$ is the dimensionless ion charge state, and the
    upper limit 8 is the nuclear charge of oxygen. The neutral state $q=0$ is excluded.


    In practice, this quantity is estimated from oxygen spectral line emission together
    with collisional-radiative or ionization-balance modeling, or from edge plasma
    and impurity-transport calculations constrained by local plasma conditions and
    wall-interaction source terms. It is the limiter-local counterpart of [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    and is interpreted alongside limiter plasma quantities such as [electron_density_at_limiter](name:electron_density_at_limiter).


    Typical limiter-adjacent oxygen ion densities are strongly device- and scenario-dependent
    and are usually trace impurity values relative to the local electron density.
    Representative order-of-magnitude values can range from 10^14-10^18 m^-3 in clean
    or moderately conditioned edge plasmas, with larger transient values possible
    during enhanced oxygen influx or strong plasma-wall interaction.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_limiter
  - name:nitrogen_density_at_limiter
  - name:carbon_density_at_limiter
  - name:xenon_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: oxygen
    operator_kind: qualifier
- name: particle_flux_at_wall
  kind: scalar
  status: draft
  description: Number of particles arriving at a plasma-facing wall surface per unit
    area per unit time from the plasma side, serving as the parent concept for species-resolved
    wall particle fluxes covering electrons, ions of any charge state, and neutral
    atoms or molecules.
  documentation: "Particle flux at the wall is the number rate per unit area at which\
    \ plasma-side particles \u2014 electrons, ions of any charge state, or neutral\
    \ atoms and molecules \u2014 impinge on a plasma-facing boundary surface. It is\
    \ the most general form of the wall particle-flux concept, abstracting over the\
    \ species identity of the arriving particles.\n\nFor a particle species $s$ with\
    \ velocity distribution function $f_s(\\mathbf{v})$, the incident flux is\n\n\
    $$\n\\Gamma_s = \\int_{\\mathbf{v}\\cdot\\hat{n} < 0} f_s(\\mathbf{v})\\,|\\mathbf{v}\\\
    cdot\\hat{n}|\\,d^3v\n$$\n\nwhere $\\hat{n}$ is the inward-pointing wall-normal\
    \ unit vector and the integral extends over particle velocities directed toward\
    \ the surface. The total wall particle flux is obtained by summing $\\Gamma_s$\
    \ over all contributing species.\n\nSpecies-resolved refinements include [electron_particle_flux_at_wall](name:electron_particle_flux_at_wall)\
    \ for the electron channel, [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall)\
    \ for ions aggregated over all charge states, and [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall)\
    \ for neutral atoms and molecules summed over quantum states. The particle flux\
    \ at the wall drives key plasma-material interaction processes including physical\
    \ sputtering, chemical erosion, fuel retention, and recycling, and is closely\
    \ coupled to the kinetic energy delivered to the surface, described by incident_kinetic_energy_flux_at_wall.\n\
    \nIn scrape-off-layer plasmas the ion component to a divertor target spans roughly\
    \ $10^{21}$\u2013$10^{24}$ m$^{-2}$ s$^{-1}$ depending on plasma density, confinement\
    \ mode, and divertor geometry; electron fluxes are comparable in magnitude at\
    \ the sheath edge where quasi-neutrality is maintained."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_particle_flux_at_wall
  - name:ion_particle_flux_at_wall
  - name:neutral_particle_flux_at_wall
- name: electron_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident electron particle flux density at a plasma-facing wall, equal
    to the number of electrons arriving from the plasma side per unit wall area per
    unit time.
  documentation: 'Electron particle flux at a wall is the one-way incident number
    flux density of electrons crossing from the plasma into a material surface. It
    counts arriving electrons per unit wall area and per unit time; electrons emitted,
    reflected, or backscattered from the surface are not included.


    For a wall point $\mathbf r_w$, the incident flux is the velocity-space moment
    over particles moving into the wall:


    $$

    \Gamma_e^\mathrm{inc}(\mathbf r_w) = \int_{\mathbf v \cdot \hat{\mathbf n}_w >
    0} (\mathbf v \cdot \hat{\mathbf n}_w)\, f_e(\mathbf r_w,\mathbf v)\, d^3v

    $$


    where $\hat{\mathbf n}_w$ is the dimensionless unit normal pointing from the plasma
    into the wall material, $\mathbf v$ is electron velocity in m.s^-1, and $f_e$
    is the electron velocity distribution with units m^-3 (m.s^-1)^-3. The result
    has units m^-2.s^-1 and is a one-way arrival flux, not the signed normal component
    of the electron fluid particle flux.


    For a finite wall region $A$, the associated total incident electron arrival rate
    is $\dot N_e^\mathrm{inc}(A)=\int_A \Gamma_e^\mathrm{inc}(\mathbf r_w)\,dA$, where
    $dA$ is a surface element in m^2 and $\dot N_e^\mathrm{inc}$ has units s^-1; this
    is the area-integrated quantity related to electron_source_rate_at_wall. In practice
    the flux is estimated from sheath or edge-plasma modeling, kinetic simulations,
    probe current measurements, retarding-field or surface diagnostics, and particle-balance
    analysis, with corrections for local sheath potential, magnetic incidence angle,
    and emitted-electron contributions when those affect the inferred incident population.


    Typical time-averaged values range from 10^20-10^23 m^-2.s^-1 on main-chamber
    plasma-facing surfaces and 10^22-10^24 m^-2.s^-1 in attached divertor strike-point
    regions. Detached, shadowed, or remote wall areas can be orders of magnitude lower,
    while transient events can briefly exceed steady-state levels.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links: []
  arguments:
  - name: particle_flux_at_wall
    operator: electron
    operator_kind: qualifier
- name: ion_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Aggregate incident particle flux of ions, summed over all charge states,
    arriving at the plasma-facing wall surface.
  documentation: 'The ion particle flux at the wall is the aggregate rate at which
    ions from the plasma impinge on a unit area of plasma-facing material, summed
    over all ion charge states. As the ion-species component of the total [particle_flux_at_wall](name:particle_flux_at_wall),
    it does not include contributions from neutral particles (see [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall))
    or electrons.


    In fluid plasma models, the incident flux $\Gamma_i^{\rm wall}$ at a wall surface
    element with inward surface normal $\hat{n}$ is:


    $$

    \Gamma_i^{\rm wall} = \sum_z n_{i,z} \, \mathbf{u}_{i,z} \cdot \hat{n}

    $$


    where $n_{i,z}$ is the number density of ions in charge state $z$ and $\mathbf{u}_{i,z}$
    is the corresponding bulk ion flow velocity, with the summation running over all
    charge states $z$. The charge-state-resolved analog is given by [ion_state_particle_flux_at_wall](name:ion_state_particle_flux_at_wall).


    This flux is computed as a surface boundary output of edge plasma fluid simulations
    or estimated from experimental ion saturation current density measurements via
    the Bohm sheath criterion. Together with [ion_kinetic_energy_flux_at_wall](name:ion_kinetic_energy_flux_at_wall),
    it characterizes the particle and energy loading on plasma-facing components and
    serves as a key input to sputtering yield and fuel-retention models.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall
  - name:neutral_particle_flux_at_wall
  - name:ion_state_particle_flux_at_wall
  - name:ion_kinetic_energy_flux_at_wall
  arguments:
  - name: particle_flux_at_wall
    operator: ion
    operator_kind: qualifier
- name: ion_state_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident particle flux of ions in a specific charge state at the plasma-facing
    wall surface.
  documentation: 'Ions bombarding plasma-facing surfaces arrive in a range of charge
    states whose individual contributions govern sputtering thresholds, energy deposition,
    and fuel recycling. This quantity gives the local incident particle flux from
    ions in a single specified charge state $z$, the charge-state-resolved building
    block of the total ion bombardment.


    The incident flux from ions in charge state $z$ is:


    $$

    \Gamma_{\mathrm{ion},z} = n_{\mathrm{ion},z} \, v_{\perp,z}

    $$


    where $n_{\mathrm{ion},z}$ is the local number density of ions in charge state
    $z$ (m$^{-3}$) and $v_{\perp,z}$ is their mean velocity component directed toward
    the wall surface (m s$^{-1}$).


    Summing over all charge states recovers [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall);
    including all particle species (neutrals, electrons) gives [particle_flux_at_wall](name:particle_flux_at_wall).
    The structurally analogous quantity for neutral particles resolved by quantum
    state is [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).
    Charge-state resolution is essential for computing state-dependent sputtering
    yields and surface chemistry reactions in plasma-wall interaction models.


    Typical incident ion fluxes in tokamak boundary plasmas range from $10^{19}$ to
    $10^{22}$ m$^{-2}$ s$^{-1}$, with peak values near divertor strike points on plasma-facing
    components.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_particle_flux_at_wall
  - name:particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  arguments:
  - name: particle_flux_at_wall
    operator: ion_state
    operator_kind: qualifier
- name: neutral_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident flux of neutral particles (atoms and molecules) arriving at
    the plasma-facing wall per unit area per unit time, summed over all quantum states
    of the neutral species.
  documentation: 'The neutral particle flux at the wall is the local rate per unit
    area at which neutral atoms and molecules impinge on plasma-facing material from
    the plasma-boundary region. It is the total neutral contribution to [particle_flux_at_wall](name:particle_flux_at_wall),
    summed over all quantum states of the neutral species. Neutrals reaching the wall
    arrive primarily through charge-exchange reactions and recombination in the scrape-off
    layer, gas injection, and desorption from the surface.


    The incident neutral flux density is defined by integrating the wall-directed
    component of the neutral velocity distribution:


    $$

    \Gamma_n = \int_{v_\perp > 0} v_\perp \, f_n(\mathbf{v}) \, d^3v

    $$


    where $v_\perp$ is the velocity component directed toward the wall surface and
    $f_n(\mathbf{v})$ is the neutral particle velocity distribution function.


    This flux is a primary driver of fuel recycling, hydrogenic implantation, and
    physical sputtering of plasma-facing components. The quantum-state-resolved analog
    [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall)
    decomposes this total by individual electronic excitation state, while [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall)
    gives the associated kinetic energy carried by the same neutral population. The
    species counterparts [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall)
    and [electron_particle_flux_at_wall](name:electron_particle_flux_at_wall) complete
    the particle-species decomposition of the total wall loading.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  - name:neutral_energy_flux_at_wall
  - name:ion_particle_flux_at_wall
  - name:electron_particle_flux_at_wall
  arguments:
  - name: particle_flux_at_wall
    operator: neutral
    operator_kind: qualifier
- name: neutral_state_particle_flux_at_wall
  kind: scalar
  status: draft
  description: Incident particle flux at the plasma-facing wall for neutral particles
    in a specified quantum state, such as a particular electronic energy level or
    molecular internal state.
  documentation: "The particle flux at the wall for a neutral species in a given quantum\
    \ state quantifies the local arrival rate of neutrals \u2014 carrying a specific\
    \ electronic excitation level, charge state, or internal molecular state \u2014\
    \ per unit area of plasma-facing material. It provides finer resolution than [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),\
    \ which sums over all neutral states, enabling plasma-wall interaction models\
    \ to track contributions from individual neutral populations such as ground-state\
    \ atoms, excited neutrals, or molecular dissociation products.\n\nThe incident\
    \ flux in quantum state $s$ is defined as:\n\n$$\n\\Gamma_{\\rm wall}^{(s)} =\
    \ \\int_{v_n > 0} v_n \\, f_s(\\mathbf{v}) \\, d^3v\n$$\n\nwhere $f_s(\\mathbf{v})$\
    \ is the velocity distribution function of neutrals in state $s$ and $v_n$ is\
    \ the component of particle velocity normal to the wall surface, with the integral\
    \ restricted to particles directed toward the wall.\n\nThis quantity is evaluated\
    \ in plasma-edge neutral-transport codes that resolve neutral populations by quantum\
    \ state using collisional-radiative models describing excitation, ionization,\
    \ and recombination transitions. Summing over all neutral quantum states yields\
    \ [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall), while including\
    \ all particle species gives the total incident loading captured in [particle_flux_at_wall](name:particle_flux_at_wall).\
    \ The corresponding kinetic energy flux for the same quantum state is given by\
    \ [neutral_state_energy_flux_at_wall](name:neutral_state_energy_flux_at_wall)."
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall
  - name:particle_flux_at_wall
  - name:neutral_state_energy_flux_at_wall
  arguments:
  - name: particle_flux_at_wall
    operator: neutral_state
    operator_kind: qualifier
- name: particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Outgoing neutral-particle number flux per unit plasma-facing wall area
    emitted when incident plasma ions recombine at the surface, summed over all ion
    species, charge states, and neutral product states.
  documentation: 'Particle flux at the wall due to recombination quantifies the rate
    at which neutral particles are emitted from a plasma-facing surface per unit area
    as a result of incident plasma ions recombining or neutralizing at the material
    boundary. The flux is summed over all incident ion species, ion charge states,
    and neutral product quantum states, making it the total species-integrated surface
    recombination source for neutrals returning to the plasma.


    The total recombination neutral flux $\Gamma_\text{rec}$ at wall location $\mathbf{x}_w$
    is the sum of all state-resolved emission rates:


    $$

    \Gamma_\text{rec}(\mathbf{x}_w) = \sum_{s,\,q,\,k} \Gamma_{s,q \to k}(\mathbf{x}_w)

    $$


    where $\Gamma_{s,q \to k}$ is the emitted neutral flux per unit wall area for
    neutral product in quantum state $k$ arising from ion species $s$ in charge state
    $q$ recombining at the surface.


    In plasma-facing component modeling, this flux is estimated by applying surface
    neutralization probabilities to incident ion fluxes computed by edge plasma transport
    codes, or by Monte Carlo neutral transport simulations that track individual recombination
    events at the surface. The state-resolved counterpart [neutral_state_particle_flux_at_wall_due_to_recombination](name:neutral_state_particle_flux_at_wall_due_to_recombination)
    disaggregates the total by neutral product species and quantum state; summing
    over all states and species recovers the quantity represented here, which is also
    reported as [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).
    The energy deposited by the same recombination events is captured by [energy_flux_at_wall_due_to_recombination](name:energy_flux_at_wall_due_to_recombination).'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:energy_flux_at_wall_due_to_recombination
- name: neutral_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Neutral particle flux density emitted from a plasma-facing wall by
    recombination or neutralization of incident plasma ions at the surface, summed
    over all neutral species and internal states. It counts outgoing neutral particles
    per unit wall area and time.
  documentation: 'Neutral particle flux at a wall due to recombination is the emitted
    particle-number flux density of neutral atoms or molecules produced when incident
    plasma ions are neutralized at a plasma-facing material surface. It is aggregated
    over all neutral product species and internal states and excludes neutral emission
    from other wall processes unless they are part of the recombination or neutralization
    channel.


    The aggregate recombination emission flux is the sum of the state-resolved recombination
    fluxes:


    $$

    \Gamma_{n,\mathrm{rec}} = \sum_{s,q} \Gamma_{n,s,q}^{\mathrm{rec}}

    $$


    where $\Gamma_{n,\mathrm{rec}}$ and $\Gamma_{n,s,q}^{\mathrm{rec}}$ have units
    of m^-2 s^-1, $s$ indexes neutral product species, and $q$ indexes internal states
    such as electronic, vibrational, or rotational states. The state-resolved terms
    correspond to [neutral_state_particle_flux_at_wall_due_to_recombination](name:neutral_state_particle_flux_at_wall_due_to_recombination),
    while the more general state-resolved wall flux convention is represented by [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).


    In modeling, this flux is obtained from the incident ion flux to each wall surface
    element together with recombination, neutralization, recycling, and product-branching
    probabilities for the material and plasma conditions. For an individual incoming
    ion channel, the emitted neutral contribution is commonly proportional to the
    incident ion flux multiplied by the probability that the ion is neutralized and
    leaves the surface as a specified neutral product; summing over product branches
    gives the aggregate. Experimentally it is usually inferred indirectly from edge
    neutral diagnostics, spectroscopy, pressure measurements, and plasma-wall interaction
    modeling rather than measured as a direct surface particle counter.


    Representative values span many orders of magnitude: main-chamber wall values
    may be about 10^18-10^22 m^-2 s^-1, while divertor or limiter regions with strong
    recycling can reach about 10^21-10^24 m^-2 s^-1. The total neutral particle flux
    from all wall emission mechanisms is described by [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),
    and the related energy-weighted neutral wall flux is described by [neutral_energy_flux_at_wall](name:neutral_energy_flux_at_wall).


    Sign convention: Positive when neutral particles cross the plasma-facing surface
    from the material into the plasma.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall
  arguments:
  - name: particle_flux_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
- name: neutral_state_particle_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: State-resolved particle flux density of neutral atoms or molecules
    emitted from a plasma-facing wall in a specified product species and quantum state
    when incident ions recombine at or near the material surface. Summing over all
    neutral product species and quantum states recovers the total emitted recombination
    neutral flux.
  documentation: 'State-resolved particle flux density of neutrals emitted from a
    plasma-facing wall by surface recombination, resolved by neutral product species
    and quantum state. When incident plasma ions capture electrons at or near the
    material surface, they leave as neutral atoms or molecules; this quantity counts
    those emitted neutrals per unit wall area per unit time in one specified electronic,
    vibrational, or rotational state, providing a state-selective recycling source
    from the material boundary into the adjacent plasma.


    Summing over all neutral product species and quantum states recovers the total
    emitted recombination neutral flux:


    $$

    \Gamma^{0}_{\mathrm{rec}} = \sum_{s}\sum_{q} \Gamma^{0}_{\mathrm{rec},s,q}

    $$


    where $\Gamma^{0}_{\mathrm{rec},s,q}$ is the emitted neutral particle flux for
    product species $s$ in quantum state $q$, $\Gamma^{0}_{\mathrm{rec}}$ is the aggregate
    emitted recombination neutral flux, and both are expressed in m^-2.s^-1.


    This quantity is computed in plasma-surface interaction and edge transport models
    from incident ion fluxes, surface recombination probabilities, material conditions,
    and state-selective branching into neutral products. It can be constrained indirectly
    through spectroscopy, neutral pressure gages, and neutral particle diagnostics
    sensitive to recycling. It is the emitted counterpart of the incident neutral
    flux [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall),
    and its species-and-state sum gives [neutral_particle_flux_at_wall_due_to_recombination](name:neutral_particle_flux_at_wall_due_to_recombination).


    As an emitted particle number flux it is non-negative, vanishing when recombination
    into the specified state is absent. Typical state-resolved magnitudes range from
    about 10^18 to 10^23 m^-2.s^-1 in tokamak plasma-facing regions, with the largest
    contributions in high-recycling or detached divertor conditions and much smaller
    values for weakly populated excited states.


    Sign convention: Positive when neutral particles cross from the plasma-facing
    material surface into the adjacent plasma or vacuum region.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:neutral_state_particle_flux_at_wall
  - name:neutral_state_energy_flux_due_to_recombination
  arguments:
  - name: particle_flux_at_wall_due_to_recombination
    operator: neutral_state
    operator_kind: qualifier
- name: peak_power_density_at_first_wall
  kind: scalar
  status: draft
  description: Spatial maximum of the incident heat flux density deposited on first-wall
    plasma-facing surfaces.
  documentation: 'Peak power density at the first wall is the largest local incident
    thermal power per unit area deposited on first-wall plasma-facing surfaces. It
    is the first-wall-specific form of a wall peak-load metric, distinct from peaks
    evaluated over all wall elements, limiter surfaces, or divertor targets.


    For a first-wall surface $S_\mathrm{FW}$, it is defined as the maximum positive
    projection of the local power-flow vector onto the surface normal pointing from
    the plasma-facing surface into the solid wall:


    $$

    q_{\mathrm{FW}}^{\mathrm{peak}} = \max_{\mathbf{x} \in S_\mathrm{FW}} \max\left(0,
    \boldsymbol{q}(\mathbf{x}) \cdot \hat{\boldsymbol{n}}_w(\mathbf{x})\right)

    $$


    where $q_{\mathrm{FW}}^{\mathrm{peak}}$ is the peak first-wall power density in
    W m^-2, $\boldsymbol{q}(\mathbf{x})$ is the local energy flux density vector in
    W m^-2, and $\hat{\boldsymbol{n}}_w(\mathbf{x})$ is a dimensionless unit normal
    directed into the wall material at surface location $\mathbf{x}$. The inner maximum
    retains only incident heating and excludes outward or cooling fluxes.


    In practice, this quantity is obtained from infrared thermography and inverse
    heat-conduction analysis, embedded thermocouples, calorimetric measurements, or
    modeled combinations of plasma particle bombardment, charge-exchange neutral loading,
    and radiative heat deposition. Surface geometry, material properties, viewing
    factors, and time response are important when converting measured temperature
    or radiation signals into local incident heat flux.


    Representative steady or quasi-steady first-wall peak loads are typically about
    0.1-5 MW m^-2, depending on device size, plasma scenario, wall material, and active
    cooling. Short transients such as edge-localized modes, runaway-electron impacts,
    or disruptions can produce substantially larger instantaneous local peaks over
    shorter durations. Related quantities include [power_density_at_wall](name:power_density_at_wall)
    for a local wall heat-flux density, [peak_power_density_at_wall](name:peak_power_density_at_wall)
    for the maximum over wall surfaces more generally, [peak_power_density_at_limiter](name:peak_power_density_at_limiter)
    for limiter elements, and [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target)
    for divertor target plates.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density
  - name:energy_flux_at_wall
- name: peak_power_density_at_limiter
  kind: scalar
  status: draft
  description: Spatial maximum of the heat flux per unit surface area deposited by
    scrape-off-layer plasma on the limiter surface.
  documentation: 'Peak power density at a limiter is the spatial maximum of the local
    heat flux density deposited on the wetted limiter surface by scrape-off-layer
    plasma. It is the limiting local thermal load for limiter plasma-facing material,
    distinct from total limiter power because it depends on how narrowly the heat
    is distributed over the contact area.


    The peak limiter heat-flux density is defined as the maximum of the local deposited
    normal heat flux over the wetted limiter surface:


    $$

    q_{\mathrm{peak,lim}} = \max_{\mathbf{x} \in A_{\mathrm{lim}}} q_\perp(\mathbf{x})

    $$


    where $q_{\mathrm{peak,lim}}$ and $q_\perp$ have units W m^-2, $\mathbf{x}$ is
    a point on the limiter surface, and $A_{\mathrm{lim}}$ is the wetted limiter surface
    area in m^2. For attached scrape-off-layer transport, the geometric projection
    is often approximated by $q_\perp \approx q_\parallel \sin\alpha$, where $q_\parallel$
    is the parallel heat flux in W m^-2 and $\alpha$ is the dimensionless grazing
    angle between the magnetic field line and the surface; sheath heat-transmission
    factors, particle recycling, radiation, and surface incidence effects can modify
    this simple projection.


    In practice this quantity is inferred from infrared thermography, calorimetry,
    embedded temperature sensors, or probes, often combined with surface thermal modeling
    and magnetic field-line tracing to identify the wetted region. Equilibrium geometry
    and limiter alignment are important because small changes in strike location or
    grazing angle can strongly change the local maximum.


    Typical steady attached limiter loads in medium-size tokamaks are about 1-10 MW
    m^-2, with lower values in low-power or strongly radiating plasmas and substantially
    higher short-lived peaks possible during transients or localized contact events.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_divertor_target
  - name:peak_power_density_at_first_wall
- name: radial_total_current_density_at_wall
  kind: scalar
  status: draft
  description: "Signed flux-coordinate radial component of the total electric current\
    \ density evaluated at the plasma-facing wall. The radial direction is the outward\
    \ normal to local magnetic flux surfaces, not generally the major-radius direction\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Radial total current density at the wall is the component of the
    net electric current-density vector along the outward radial direction of a local
    flux-coordinate system $(\rho,\theta,\phi)$, evaluated at the plasma-facing material
    surface. It includes all current-carrying contributions represented in the total
    current density, such as charged-particle and conductive currents. This flux-coordinate
    radial component is generally distinct from the major-radius projection in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius and $Z$
    is vertical height.


    A local definition is obtained by projecting the total current-density vector
    onto the outward normal to surfaces of constant radial flux coordinate:


    $$

    j_{\rho,\mathrm{tot}}^{\mathrm{wall}} = \left. \mathbf{j}_{\mathrm{tot}} \cdot
    \frac{\nabla \rho}{|\nabla \rho|} \right|_{\mathrm{wall}}

    $$


    where $\mathbf{j}_{\mathrm{tot}}$ is the total current-density vector in A.m^-2,
    $\rho$ is a dimensionless flux-surface radial coordinate increasing outward from
    the magnetic axis toward the edge, and $\nabla\rho/|\nabla\rho|$ is the corresponding
    outward unit normal. If the material wall is not itself a magnetic flux surface,
    the direction is taken from the local flux-coordinate mapping at the wall location
    and is not the geometric normal to the wall surface.


    In practice this quantity is computed in edge, scrape-off-layer, sheath, and plasma-wall
    interaction models by summing the relevant current contributions and projecting
    the result onto the local flux-coordinate radial direction. It may also be constrained
    experimentally by wall current monitors, Langmuir probes, biased electrodes, and
    magnetic measurements interpreted with a sheath and geometry model.


    Typical absolute magnitudes are strongly scenario dependent. Floating or nearly
    ambipolar plasma-facing surfaces may have net values near 0-10^2 A.m^-2, biased
    surfaces or RF sheath regions can reach 10^3-10^5 A.m^-2, and short transient
    events such as disruptions or localized halo-current contact can produce larger
    localized values.


    Sign convention: Positive when the total current density is directed outward along
    increasing $\rho$ in the flux-coordinate system $(\rho,\theta,\phi)$, from the
    confined plasma toward the plasma-facing wall.'
  unit: A.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:radial_total_current_density
  - name:radial_current_density_due_to_parallel_viscosity
  - name:radial_current_density_due_to_perpendicular_viscosity
  - name:radial_current_density_due_to_heat_viscosity
  - name:radial_current_density_due_to_ion_neutral_friction
- name: surface_area_of_optical_element
  kind: scalar
  status: draft
  description: Total geometric surface area of the optically active surface or surfaces
    of an optical element. It is the actual surface area of the material region that
    can interact with radiation, not the projected aperture area.
  documentation: 'Surface area of an optical element is the total geometric area of
    the surface portions that are optically active, such as a coated mirror face,
    crystal face, polarizer face, or fiber-bundle end face. If more than one surface
    of the element is active, the areas of those surfaces are included; inactive supports,
    edges, backs, or masked regions are excluded unless they are part of the active
    optical surface.


    For an active surface region $S$, the area is defined by the surface integral:


    $$

    A = \int_S dA

    $$


    where $A$ is the surface area in m^2, $S$ is the union of the active surface patches,
    and $dA$ is the differential surface-area element in m^2.


    The value is normally obtained from the element geometry, mechanical drawings,
    metrology, or optical design models. For a flat rectangular or circular face it
    is the actual face area; for a curved mirror, lens, or crystal it is the integrated
    curved-surface area. This quantity differs from projected aperture area, which
    is the area of the element projected onto a plane normal to a chosen viewing direction
    and can be smaller than the actual surface area for tilted or curved surfaces.


    Surface area is non-negative, with physical range $A \ge 0$. Typical optical diagnostic
    elements range from about $1 \times 10^{-8}$-$1 \times 10^{-4}$ m^2 for individual
    fiber cores or small fiber-bundle faces, $1 \times 10^{-6}$-$1 \times 10^{-2}$
    m^2 for filters, polarizers, crystals, and small mirrors, and up to $10^{-1}$
    m^2 for large collection mirrors or window-like elements.'
  unit: m^2
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_area_of_filter
  - name:area_of_optical_element
- name: surface_emissivity
  kind: scalar
  status: draft
  description: 'Surface emissivity is the dimensionless effective thermal emissivity
    of a plasma-facing surface: the ratio of its emitted thermal radiance or radiative
    exitance to that of a blackbody at the same surface temperature. As a scalar,
    it represents the stated spectral band and angular averaging rather than a wavelength-
    and direction-resolved emissivity.'
  documentation: 'Surface emissivity is a dimensionless measure of how efficiently
    a real surface emits thermal radiation compared with a blackbody at the same surface
    temperature. For a scalar value, it is an effective emissivity averaged over the
    relevant wavelength band and angular domain, not the full spectral, directional,
    or polarization-dependent emissivity function.


    The effective value can be defined as a weighted ratio of emitted spectral radiance
    to blackbody spectral radiance:


    $$

    \epsilon_\mathrm{eff}(T_s) = \frac{\int_{\lambda}\int_{\Omega} W(\lambda,\Omega)\,L_\lambda^\mathrm{surf}(T_s,\Omega)\,d\Omega\,d\lambda}{\int_{\lambda}\int_{\Omega}
    W(\lambda,\Omega)\,L_\lambda^\mathrm{bb}(T_s)\,d\Omega\,d\lambda}

    $$


    where $T_s$ is the surface temperature, $L_\lambda^\mathrm{surf}$ is the emitted
    spectral radiance of the real surface, $L_\lambda^\mathrm{bb}$ is the blackbody
    spectral radiance at the same temperature, $\Omega$ is the selected angular domain,
    and $W(\lambda,\Omega)$ specifies the spectral response and angular weighting.
    For a broadband hemispherical thermal model, the angular domain is the outward
    hemisphere and the associated emitted heat-flux density is $q_\mathrm{rad}=\epsilon_\mathrm{eff}\sigma
    T_s^4$; total radiated power is obtained by integrating that flux density over
    surface area.


    In practice, surface emissivity is obtained from material data, laboratory calibration,
    in-situ calibration, or fitting of thermal-radiation measurements together with
    an independent temperature estimate. It is strongly affected by material composition,
    roughness, oxidation, deposited layers, erosion, temperature, wavelength band,
    and viewing angle, so the averaging convention should match the radiation model
    or infrared measurement being interpreted.


    Typical values range from 0.02-0.2 for clean polished metals, 0.3-0.9 for oxidized
    or rough metals, 0.7-0.95 for graphite and many carbon-rich surfaces, and about
    0.1-0.6 for tungsten plasma-facing components depending on wavelength and surface
    condition. For an opaque passive surface the physical range is normally $0 \le
    \epsilon_\mathrm{eff} \le 1$; apparent values outside this range usually indicate
    calibration, reflection, background-subtraction, or model-assumption errors.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:maximum_surface_temperature
- name: surface_temperature
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the exposed material surface of a plasma-facing
    component at a specified surface location and time. It is a local surface state
    variable, distinct from a surface average or a maximum over an area.
  documentation: 'Surface temperature is the thermodynamic temperature of the outermost
    exposed material surface at a specified location and time. It is a local material
    property of a plasma-facing component; surface averages, area-integrated quantities,
    and peak values are different quantities and should not be inferred from this
    name alone.


    The temperature controls thermal emission from the surface. For an opaque gray
    surface, the hemispherical radiant exitance may be approximated by the Stefan-Boltzmann
    relation:


    $$

    M = \varepsilon \sigma T_s^4

    $$


    where $M$ is the emitted radiant power per unit surface area, $\varepsilon$ is
    the surface emissivity, $\sigma$ is the Stefan-Boltzmann constant, and $T_s$ is
    the surface temperature.


    In practice, surface temperature may be obtained from infrared thermography, pyrometry,
    embedded temperature sensors, thermocouples, or heat-transfer modeling. Thermal-emission
    methods require knowledge of emissivity, optical transmission, viewing geometry,
    reflected radiation, and calibration. The referenced location is the material
    point on the exposed surface, which may be parameterized by surface coordinates
    or by its position in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    Typical values are 290-320 K for components near room temperature before operation,
    500-1500 K for heated first-wall or divertor surfaces during plasma exposure,
    and 1500-3000 K for localized hot spots or transient heat loads. Values approaching
    material limits, such as about 3683 K for tungsten melting, are critical for component
    lifetime and machine protection.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_emissivity
  - name:maximum_surface_temperature
- name: maximum_surface_temperature
  kind: scalar
  status: draft
  description: Highest apparent surface temperature among the valid points in a defined
    infrared camera region of interest. It is a temperature maximum, not a heat flux
    or power-density measure.
  documentation: 'Maximum surface temperature is the largest apparent temperature
    assigned to an observed plasma-facing surface within a defined region of interest
    at a given observation time. The word apparent indicates the radiance-derived
    temperature after the assumed emissivity, optical transmission, calibration, and
    background corrections have been applied; it may differ from the true thermodynamic
    surface temperature if those assumptions are inaccurate. This quantity identifies
    the hottest inferred point in the region, but it does not by itself quantify deposited
    heat flux.


    For a region of interest $\Omega_\mathrm{ROI}$, the maximum is defined as the
    maximum over all valid temperature samples in that region:


    $$

    T_\mathrm{max} = \max_{p \in \Omega_\mathrm{ROI}} T_\mathrm{app}(p)

    $$


    where $T_\mathrm{max}$ and $T_\mathrm{app}(p)$ are temperatures in kelvin, $p$
    labels a valid surface sample or camera pixel associated with the region of interest,
    and $\Omega_\mathrm{ROI}$ is the selected set of samples. Invalid, masked, saturated,
    or uncalibrated samples are excluded before taking the maximum; the result is
    a pointwise maximum, not an average, percentile, or time maximum unless an additional
    processing definition states otherwise.


    In practice, infrared thermography infers $T_\mathrm{app}$ from measured thermal
    radiance using camera calibration, spectral response, surface emissivity, optical
    transmission, and reflected-background corrections. A common calibration model
    is based on Planck spectral radiance, with $L_\lambda(T) = \epsilon(\lambda,T)\,2hc^2/\lambda^5[\exp(hc/(\lambda
    k_B T))-1]^{-1}$ integrated over the camera bandpass, where $L_\lambda$ is spectral
    radiance in W m^-3 sr^-1, $\epsilon$ is dimensionless emissivity, $\lambda$ is
    wavelength in meters, $h$ is Planck''s constant in J s, $c$ is the speed of light
    in m s^-1, $k_B$ is Boltzmann''s constant in J K^-1, and $T$ is temperature in
    kelvin.


    Typical values are about 290-350 K for surfaces near room temperature before plasma
    exposure, several hundred to 1500 K during moderate heating, and above 2000 K
    for localized hot spots in high-power operation. Allowable maxima depend strongly
    on surface material, coatings, pulse duration, and machine-protection limits.


    This quantity should be distinguished from heat-flux or power-density quantities
    such as peak power density at a divertor target or limiter. Temperature is the
    surface thermal state, whereas heat flux depends on deposited power, material
    thermal properties, geometry, cooling, and the time history of the exposure.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:surface_emissivity
  arguments:
  - name: surface_temperature
    operator: maximum
    operator_kind: qualifier
- name: toroidal_current_of_vacuum_vessel
  kind: scalar
  status: draft
  description: "Net electric current flowing toroidally in the conducting vacuum vessel,\
    \ produced by induction from time-varying magnetic flux linked with the vessel.\
    \ The toroidal direction is that of the right-handed cylindrical (R, \u03C6, Z)\
    \ frame."
  documentation: 'Toroidal vacuum-vessel current is the net electric current carried
    by the conducting vessel in the toroidal direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is an algebraic scalar: signed contributions from vessel
    sectors or passive conducting branches are summed to give the total vessel current,
    rather than describing only one local branch.


    The scalar total is defined as the signed sum of toroidal currents carried by
    the vessel conductors:


    $$

    I_{\mathrm{vv},\phi} = \sum_{k \in \mathrm{vessel}} I_{\phi,k}

    $$


    where $I_{\mathrm{vv},\phi}$ is the total toroidal vacuum-vessel current in A,
    and $I_{\phi,k}$ is the signed toroidal current in A carried by conducting vessel
    sector or passive branch $k$.


    This current is induced when magnetic flux linked by closed conducting paths in
    the vessel changes, for example because of changing plasma current or external-coil
    currents. In practice it is estimated from electromagnetic models of passive conductors
    constrained by magnetic measurements, flux-loop signals, coil-current histories,
    and vessel electrical properties; it is closely related to the current in a passive
    conducting loop.


    Typical absolute values are highly device and transient dependent. Net toroidal
    vessel currents of $10^3$-$10^6$ A are common in medium and large tokamaks during
    appreciable magnetic-flux changes, while smaller devices or slow current ramps
    may produce values below $10^3$ A.


    Sign convention: Positive when the vessel current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame (counter-clockwise
    when viewed from above $+\hat{Z}$).'
  unit: A
  physics_domain: plasma_wall_interactions
  links:
  - name:resistance_of_vacuum_vessel
  - name:toroidal_plasma_current
  - name:toroidal_current_of_cryostat
- name: total_incident_power_at_wall
  kind: scalar
  status: draft
  description: "Aggregate power from the plasma delivered to all plasma-facing surfaces,\
    \ integrating all heat-flux channels \u2014 parallel conduction, convection, charge-exchange\
    \ neutrals, and radiation \u2014 over the entire wetted wall area before surface\
    \ reflection or re-emission."
  documentation: "The total incident power at the wall is the global sum of energy\
    \ arriving from the plasma onto all plasma-facing components \u2014 first wall\
    \ panels, divertor targets, and limiters \u2014 encompassing parallel and perpendicular\
    \ conduction, convective particle fluxes, charge-exchange neutral fluxes, and\
    \ incident radiation, all evaluated before any surface absorption, reflection,\
    \ or secondary emission.\n\nIt equals the area integral of the local perpendicular\
    \ energy flux density over all plasma-facing surfaces $S$:\n\n$$\nP_\\mathrm{wall}\
    \ = \\int_S q_\\perp \\, dA\n$$\n\nwhere $q_\\perp$ is the energy flux component\
    \ normal to the wall surface, integrated over the full wetted area $A$.\n\nIn\
    \ global power balance accounting this quantity equals the total coupled input\
    \ power minus the radiated power retained within the confined plasma volume. Process-resolved\
    \ contributions such as [power at wall due to conduction](name:power_at_wall_due_to_conduction)\
    \ are subsets of this total, and the local per-unit-area counterpart [energy_flux_at_wall](name:energy_flux_at_wall)\
    \ recovers this aggregate when integrated over all plasma-facing surfaces.\n\n\
    It is estimated by combining calorimetric measurements of individual plasma-facing\
    \ components and infrared thermography of tile surfaces, or computed directly\
    \ from plasma-boundary fluid or kinetic simulations. Typical values range from\
    \ 1\u201310 MW in L-mode discharges to 20\u201350 MW in high-power H-mode conditions\
    \ in present-day tokamaks, with next-step devices projecting up to ~100 MW of\
    \ total wall power exhaust."
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_conduction
  - name:energy_flux_at_wall
  sources:
  - id: dd:wall/global_quantities/power_incident
    dd_path: wall/global_quantities/power_incident
    status: composed
- name: total_ion_density_at_limiter
  kind: scalar
  status: draft
  description: Total ion number density summed over all ion species and charge states,
    evaluated at the plasma-facing limiter surface.
  documentation: 'The total ion density at the limiter is the unweighted sum of number
    densities of all ion species and charge states present in the boundary plasma
    immediately adjacent to the limiter plasma-facing surface. It aggregates contributions
    from bulk hydrogenic fuel ions and all impurity ion populations, characterizing
    the net ion particle inventory at the plasma-material contact zone.


    The defining sum is:


    $$

    n_i^{\rm total} = \sum_s n_{i,s}

    $$


    where $n_{i,s}$ is the number density of ion species $s$ (summed over all charge
    states of that species) evaluated at the limiter location. Under quasi-neutrality,
    the local electron density satisfies $n_e \approx \sum_s \bar{Z}_s n_{i,s}$, where
    $\bar{Z}_s$ is the mean charge of species $s$, directly linking the total ion
    density to electron density diagnostics at the boundary.


    This quantity is the aggregate form of ion_density_at_limiter, which resolves
    the same density by individual species. It is closely related to [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary),
    which evaluates the equivalent species sum at the last closed flux surface, and
    to [total_ion_density_at_pedestal](name:total_ion_density_at_pedestal) for the
    pedestal region. It is typically inferred from Langmuir probe arrays mounted on
    the limiter structure, from recycling spectroscopy, or from edge transport modeling
    constrained by particle-balance measurements.


    Sign convention: Positive when ions are present at the limiter surface; number
    density is non-negative by definition for all physical plasma states.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:total_ion_density_at_plasma_boundary
  - name:total_ion_density_at_pedestal
- name: total_neutral_particle_flux_at_wall_due_to_surface_emission
  kind: scalar
  status: draft
  description: Total rate at which neutral atoms and molecules are emitted from plasma-facing
    material surfaces into the adjacent plasma-facing region by surface processes
    such as recycling of incident particles and outgassing, summed over the relevant
    wall area.
  documentation: 'Total neutral particle flux at the wall due to surface emission
    is the globally counted rate at which neutral atoms or molecules leave plasma-facing
    material surfaces and enter the adjacent plasma-facing region. It represents wall-related
    neutral production dominated by recycling of incident plasma particles neutralized
    at the surface and by thermally activated outgassing, accumulated over all participating
    wall area.


    The total emission rate is the surface integral of the local emitted neutral particle
    flux density:


    $$

    \Gamma_{\mathrm{em}} = \int_{A_{\mathrm{wall}}} \gamma_{\mathrm{em}}(\mathbf{x})
    \, dA

    $$


    where $\Gamma_{\mathrm{em}}$ is the total neutral emission rate in s^-1, $A_{\mathrm{wall}}$
    is the plasma-facing wall area included in the sum, $\gamma_{\mathrm{em}}(\mathbf{x})$
    is the local outward neutral particle flux density in m^-2 s^-1 at surface position
    $\mathbf{x}$, and $dA$ is a surface area element.


    This quantity is the neutral-species, wall-integrated counterpart of the local
    emitted flux density carried by [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall).
    It is numerically equivalent to the global emission term [neutral_particle_source_rate_at_wall_due_to_surface_emission](name:total_neutral_particle_flux_at_wall_due_to_surface_emission),
    which expresses the same surface-integrated neutral release as a plasma source
    term, and it is the neutral-specific case of the species-general integrated rate
    particle_flux_due_to_surface_emission.


    In practice the quantity is computed by integrating local wall-emission estimates
    from particle-balance analysis or plasma-wall interaction models. Experimental
    constraints come indirectly from neutral pressure measurements, spectroscopic
    neutral line emission, fueling and exhaust balance, and estimates of incident
    particle fluxes combined with recycling yields.


    Typical integrated rates range from 10^20-10^22 s^-1 in small or low-density plasmas
    and from 10^22-10^24 s^-1 in medium and large tokamak discharges, with short recycling
    or outgassing transients producing larger instantaneous rates.


    Sign convention: Positive when neutral particles are emitted away from the material
    wall surface into the plasma-facing region.'
  unit: s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_particle_flux_at_wall
  sources:
  - id: dd:wall/global_quantities/neutral/particle_flux_from_wall
    dd_path: wall/global_quantities/neutral/particle_flux_from_wall
    status: composed
- name: tritium_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of tritium ions in the plasma immediately adjacent to
    a plasma-facing limiter surface.
  documentation: 'Tritium density at a limiter is the local number density of tritium
    ions $T^+$ in the scrape-off-layer plasma immediately adjacent to a plasma-facing
    limiter surface. It is a species-resolved ion density, not a neutral tritium density,
    surface inventory, or particle flux. As a number density it is a non-negative
    scalar measured per unit volume.


    The local density is the tritium-ion particle count per infinitesimal plasma volume
    at the limiter-adjacent location:


    $$

    n_T = \frac{dN_T}{dV}

    $$


    where $dN_T$ is the number of tritium ions in the volume element $dV$, and $n_T$
    has units of $\mathrm{m}^{-3}$. If an electron-normalized isotope fraction is
    used, [tritium_fraction](name:ratio_of_tritium_density_to_electron_density) corresponds
    to $n_T/n_e$, where $n_e$ is the electron density in $\mathrm{m}^{-3}$; it is
    not a fraction of total ion density unless that convention is stated separately.


    In practice this quantity is inferred from isotope-resolved edge spectroscopy,
    neutral and ion source modeling, probe-constrained scrape-off-layer analysis,
    or edge transport simulations. Its value reflects the local balance between parallel
    transport along open field lines, ionization of recycled tritium neutrals, cross-field
    transport, and ion loss to the material surface. It should not be assumed to have
    a fixed ordering relative to [tritium_density_at_plasma_boundary](name:tritium_density_at_plasma_boundary),
    [tritium_density_at_pedestal](name:tritium_density_at_pedestal), or [tritium_density_at_divertor_target](name:tritium_density_at_divertor_target),
    because recycling strength, fueling mix, geometry, and plasma conditions can change
    the local limiter-adjacent density.


    Representative limiter scrape-off-layer tritium-ion densities can span roughly
    $10^{17}-10^{20}\ \mathrm{m}^{-3}$ in deuterium-tritium operation, with the tritium
    component set by both the local plasma density and the isotope composition. Values
    may be much lower in low-tritium or trace-tritium plasmas and can vary strongly
    over the limiter surface and during transient plasma-wall interaction events.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_tritium_density_to_electron_density
  - name:tritium_density_at_plasma_boundary
  - name:tritium_density_at_pedestal
  - name:tritium_density_at_divertor_target
  arguments:
  - name: density_at_limiter
    operator: tritium
    operator_kind: qualifier
- name: tungsten_density
  kind: scalar
  status: draft
  description: Total number density of tungsten ions in the plasma, summed over all
    ionization states from W$^{1+}$ through W$^{74+}$, excluding neutral tungsten
    atoms.
  documentation: "Tungsten density is the local number density of ionized tungsten\
    \ in a plasma, aggregated across all charge states from W$^{1+}$ through W$^{74+}$,\
    \ without including neutral tungsten atoms. Tungsten is introduced into the plasma\
    \ primarily through sputtering and erosion of plasma-facing components; because\
    \ of its high atomic number, even trace concentrations can increase radiative\
    \ losses substantially and degrade energy confinement.\n\nThe total tungsten ion\
    \ density is defined as:\n\n$$\nn_W = \\sum_{q=1}^{74} n_{W^{q+}}\n$$\n\nwhere\
    \ $n_{W^{q+}}$ is the number density of tungsten ions in charge state $q$.\n\n\
    At concentrations $n_W/n_e \\sim 10^{-5}$\u2013$10^{-4}$, partially ionized tungsten\
    \ radiates copiously in the vacuum ultraviolet and soft X-ray ranges, driving\
    \ hollow temperature profiles and degrading H-mode performance. The [ratio of\
    \ tungsten density to electron density](name:ratio_of_tungsten_density_to_electron_density)\
    \ is the standard dimensionless measure of tungsten contamination, while the [volume-averaged\
    \ tungsten density](name:volume_averaged_tungsten_density) characterizes the total\
    \ confined tungsten inventory. In experiments, $n_W$ is inferred from spectroscopic\
    \ measurement of tungsten line emission \u2014 typically in the vacuum ultraviolet\
    \ or soft X-ray spectral range \u2014 combined with atomic data for the charge-state\
    \ distribution.\n\nSign convention: Positive when tungsten ions are present in\
    \ the plasma region of interest."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_tungsten_density_to_electron_density
  - name:volume_averaged_tungsten_density
  sources:
  - id: dd:summary/line_average/n_i/tungsten/value
    dd_path: summary/line_average/n_i/tungsten/value
    status: composed
- name: ratio_of_tungsten_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless concentration ratio of tungsten ion number density to
    electron number density in a plasma. The tungsten density is summed over ionized
    tungsten charge states and excludes neutral tungsten atoms.
  documentation: 'Ratio of tungsten density to electron density is a dimensionless
    impurity concentration comparing the total number density of tungsten ions with
    the free-electron number density. The tungsten density counts tungsten nuclei
    in ionized charge states, summed over charge state, and excludes neutral tungsten
    atoms. It is not charge weighted, so it is not the fraction of the electron population
    supplied by tungsten ions.


    The ratio is defined as:


    $$

    c_W = \frac{n_W}{n_e} = \frac{\sum_{z=1}^{74} n_{\mathrm{W}^{z+}}}{n_e}

    $$


    where $n_{\mathrm{W}^{z+}}$ is the number density of tungsten ions in charge state
    $z$, $n_W$ is the total ionized tungsten number density, and $n_e$ is the free-electron
    number density. The lower limit excludes neutral tungsten $\mathrm{W}^0$; if all
    densities are expressed in the same number-density unit, the ratio has unit 1.
    The quantity is meaningful where $n_e>0$ and is non-negative for physical number
    densities.


    In practice, $n_W$ is inferred from plasma composition analysis constrained by
    tungsten radiation and charge-state information, while $n_e$ is obtained from
    electron-density measurements or kinetic reconstructions. The numerator and denominator
    should refer to the same plasma region or averaging operation when the ratio is
    interpreted as a regional concentration.


    Representative core-plasma values in tungsten-containing devices are often $10^{-6}$-$10^{-4}$.
    Local values near strong tungsten sources or in colder boundary regions can be
    higher, for example $10^{-4}$-$10^{-3}$, depending on source strength, ionization
    balance, and plasma conditions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:tungsten_density_at_magnetic_axis
  - name:tungsten_density_at_pedestal
  - name:volume_averaged_tungsten_density
  arguments:
  - name: tungsten_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
- name: tungsten_density_at_limiter
  kind: scalar
  status: draft
  description: Tungsten ion number density in the boundary plasma immediately adjacent
    to a limiter surface at the plasma-limiter contact.
  documentation: 'Tungsten density at a limiter is the local number density of tungsten
    ions in the boundary plasma immediately next to a limiter surface. It characterizes
    how much tungsten released from the limiter is present in the plasma-facing region
    before dilution, ionization, and transport redistribute it elsewhere.


    When charge states are resolved, the total tungsten ion density at the limiter
    is the sum over ionization stages:


    $$

    n_{\mathrm{W,lim}} = \sum_{z=1}^{74} n_{\mathrm{W}^{z+},\mathrm{lim}}

    $$


    where $n_{\mathrm{W}^{z+},\mathrm{lim}}$ is the number density in m^-3 of tungsten
    ions with charge $z$ adjacent to the limiter, and 74 is the atomic number of tungsten.
    Neutral tungsten is not included in this ion density.


    In practice this quantity is estimated from edge impurity diagnostics and boundary-plasma
    modeling, for example by combining spectroscopic line emission, local plasma conditions,
    atomic data, and transport or source estimates. It is closely related to tungsten
    density at other plasma locations, but can be more directly affected by local
    sputtering, prompt redeposition, sheath conditions, and near-surface plasma parameters.


    Typical values are highly device- and discharge-dependent. Trace tungsten conditions
    may give about $10^{10}-10^{14}$ m^-3 near a limiter, while strong local sputtering
    or transient impurity release can raise the boundary value to about $10^{15}-10^{17}$
    m^-3.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:tungsten_density_at_pedestal
  - name:tungsten_density_at_magnetic_axis
  arguments:
  - name: density_at_limiter
    operator: tungsten
    operator_kind: qualifier
- name: vertical_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the geometric center of a diagnostic aperture\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, measured upward from the\
    \ machine midplane."
  documentation: 'The vertical coordinate $Z$ locates the center of a diagnostic aperture
    along the machine symmetry axis in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $Z$ increases upward from the geometric midplane. Diagnostic apertures
    are the physical openings in detector housings, filter assemblies, crystal-spectrometer
    cameras, and other optical benches through which plasma emission passes; their
    geometric centers define the reference point from which lines of sight, solid
    angles, and etendue are computed for each diagnostic channel.


    Together with the corresponding major-radius $R$ and toroidal angle $\phi$, this
    coordinate fully specifies the aperture center in three dimensions. The analogous
    coordinate for a generic aperture is [vertical_coordinate_of_aperture](name:vertical_coordinate_of_aperture),
    while [vertical_coordinate_of_optical_element](name:vertical_coordinate_of_optical_element)
    covers the broader class of optical components and [vertical_coordinate_of_measurement_position](name:vertical_coordinate_of_measurement_position)
    covers general sensor locations.


    On present-day medium and large tokamaks, diagnostic apertures range from the
    lower divertor region (Z near -2 m) to the machine top (Z near +2 m); port-mounted
    apertures near the midplane have |Z| less than approximately 0.5 m.


    Sign convention: Positive when the aperture center lies above the geometric midplane
    in the $+Z$ direction.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_coordinate_of_aperture
  - name:vertical_coordinate_of_optical_element
  - name:vertical_coordinate_of_measurement_position
- name: vertical_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the divertor target surface center in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame, where Z is vertical height."
  documentation: 'The vertical coordinate of the divertor target is the $Z$ component
    of the geometric center of the target surface in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It locates the hardware surface as a geometric reference
    and is distinct from the vertical position of a plasma strike point on that surface.


    For a finite divertor target surface $S_t$, the surface-center coordinate is the
    area centroid of that surface:


    $$

    Z_t = \frac{1}{A_t}\int_{S_t} Z(\mathbf{x})\,dA, \qquad A_t = \int_{S_t} dA

    $$


    where $Z_t$ is the target-center vertical coordinate, $A_t$ is the target-surface
    area, $dA$ is the surface area element, and $Z(\mathbf{x})$ is the vertical height
    of point $\mathbf{x}$ on the target surface.


    In practice this coordinate is computed from the defined target geometry, for
    example from an engineering surface model, metrology description, or calibrated
    diagnostic geometry. For a mesh representation, the integral is evaluated as an
    area-weighted average of the mesh-element center $Z$ coordinates. The corresponding
    horizontal or transverse coordinates are described by [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [y_coordinate_of_divertor_target](name:y_coordinate_of_divertor_target), while
    inner and outer strike-location quantities refer to different physical points
    on the divertor.


    Typical values are machine-size and vertical-origin dependent. In lower-single-null
    tokamaks the target surface center commonly has $Z<0$, often about 0.5-3 m below
    the magnetic-axis or midplane region in medium to large devices; upper-divertor
    targets have comparable positive values, and compact devices can have magnitudes
    of about 0.1-1 m.


    Sign convention: Positive when the divertor target surface center lies in the
    $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:y_coordinate_of_divertor_target
  - name:vertical_coordinate_of_inner_divertor_target
  - name:vertical_coordinate_of_outer_divertor_target
- name: vertical_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the geometric center of an optical element\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, measured from the machine\
    \ midplane."
  documentation: 'The vertical coordinate $Z$ specifies the height of the geometric
    center of an optical element along the symmetry axis direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius from the machine
    symmetry axis, $\phi$ is the toroidal angle, and $Z$ is the upward vertical height.
    Optical elements include mirrors, lenses, optical fibers, beam splitters, and
    windows deployed in visible-light cameras, infrared cameras, and spectrometers
    used for plasma diagnostics.


    This position is established from engineering metrology, alignment surveys, or
    installation records and is used together with the major radius and toroidal angle
    to reconstruct complete sight-line or ray-tracing geometries. The vertical center
    coordinate is geometrically analogous to [vertical_coordinate_of_aperture](name:vertical_coordinate_of_aperture)
    and [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture),
    which describe the corresponding position for other components along the same
    observation path.


    Typical values span approximately $-3$ to $+3$ m in medium-sized tokamaks, measured
    relative to the machine midplane at $Z = 0$.


    Sign convention: Positive when the optical element center is located above the
    machine midplane, in the direction of increasing $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_coordinate_of_aperture
  - name:vertical_coordinate_of_diagnostic_aperture
- name: x_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: X coordinate of the center of a diagnostic aperture, measured along
    the x axis in a right-handed camera Cartesian frame with basis (x, y, z). It locates
    the aperture laterally relative to the chosen camera-frame origin.
  documentation: 'The x coordinate of a diagnostic aperture is the signed lateral
    position of the aperture center relative to the origin of a right-handed camera
    Cartesian frame with basis $(\hat{x}, \hat{y}, \hat{z})$. It specifies one component
    of the aperture center location used to define viewing geometry, optical alignment,
    and line-of-sight calculations.


    The coordinate is the projection of the aperture-center displacement onto the
    camera-frame x basis direction:


    $$

    x_\mathrm{ap} = (\mathbf{r}_\mathrm{ap} - \mathbf{r}_0) \cdot \hat{x}

    $$


    where $\mathbf{r}_\mathrm{ap}$ is the aperture-center position, $\mathbf{r}_0$
    is the origin of the camera Cartesian frame, and $\hat{x}$ is the unit vector
    along its x axis.


    In practice, this coordinate is determined from mechanical design drawings, metrology,
    optical calibration, or camera alignment procedures. Together with the corresponding
    y and z coordinates, it fixes the aperture center used to construct rays or fields
    of view for diagnostics such as infrared cameras, visible cameras, bolometry,
    or spectroscopy systems.


    Typical values depend on the chosen camera origin and optical layout. For compact
    in-vessel or port-mounted diagnostics, offsets are often in the range -0.5-0.5
    m, while larger external optical assemblies may have offsets of order -2-2 m.


    Sign convention: Positive when the aperture center is displaced from the camera-frame
    origin in the $+\hat{x}$ direction of the right-handed camera Cartesian frame
    with basis $(\hat{x}, \hat{y}, \hat{z})$.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_diagnostic_aperture
  - name:x1_coordinate_of_filter
  - name:x2_coordinate_of_diagnostic_aperture
  - name:x_coordinate_of_sensor_attachment_point
- name: x_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: "Cartesian x coordinate of the divertor target surface center in the\
    \ right-handed Cartesian (x, y, z) frame. The +x direction is the horizontal direction\
    \ corresponding to toroidal angle \u03C6 = 0, and z is vertical."
  documentation: 'The x coordinate of a divertor target is the signed horizontal Cartesian
    coordinate of the geometric center of the target surface, expressed relative to
    an origin on the toroidal symmetry axis in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis. The $+\hat{x}$ direction is the horizontal reference
    direction at toroidal angle $\phi=0$, and $\hat{z}$ is vertical. The coordinate
    itself does not identify which physical target is meant; inner, outer, upper,
    lower, or other target identity is specified by the associated divertor geometry
    context.


    Its relation to the right-handed cylindrical $(R, \phi, Z)$ frame is


    $$

    x = R \cos\phi

    $$


    where $R$ is the major radius measured from the toroidal symmetry axis, $\phi$
    is the toroidal angle measured from the $+\hat{x}$ direction, and $Z$ is vertical
    height with $z=Z$.


    This coordinate is used with the corresponding y and vertical coordinates to locate
    the divertor target surface center in three-dimensional space. It provides the
    geometric reference point for describing target placement, plasma-wall interaction
    geometry, and line-of-sight or incidence-angle relationships without implying
    any particular method used to determine the geometry.


    Typical magnitudes for divertor target surface centers are about 0.5-8 m in medium-size
    to large tokamaks. Values near the $\phi=0$ reference direction are positive and
    comparable to the local major radius, while targets at other toroidal angles can
    have smaller or negative x coordinates.


    Sign convention: Positive when the divertor-target surface center lies on the
    $+\hat{x}$ side of the origin in the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
- name: xenon_density_at_limiter
  kind: scalar
  status: draft
  description: Total xenon ion number density in the boundary plasma immediately adjacent
    to a limiter, summed over all positive charge states and excluding neutral xenon
    atoms.
  documentation: 'Xenon density at a limiter is the total number density of xenon
    ions at the plasma-side near-sheath location where open magnetic field lines meet
    the limiter surface. The unqualified impurity ion density is summed over all positive
    xenon charge states; neutral xenon atoms are excluded. As a number density, its
    physical range is non-negative.


    It is defined from charge-state-resolved xenon ion densities by


    $$

    n_{\mathrm{Xe,lim}} = \sum_{q=1}^{Z_{\mathrm{Xe}}} n_{\mathrm{Xe}^{q+},\mathrm{lim}}

    $$


    where $q$ is the integer positive charge state, $Z_{\mathrm{Xe}}=54$ is the xenon
    nuclear charge, and $n_{\mathrm{Xe}^{q+},\mathrm{lim}}$ is the local density of
    xenon ions with charge $+q e$ at the limiter, in m$^{-3}$. The summed density
    $n_{\mathrm{Xe,lim}}$ is also in m$^{-3}$.


    In practice this quantity is inferred from edge and limiter-region line emission
    together with collisional-radiative modeling, local electron temperature and electron
    density estimates, and boundary-plasma transport modeling. It is sensitive to
    local ionization and recombination, parallel transport along open field lines,
    xenon source strength, and recycling or retention at nearby plasma-facing material.


    Typical values are highly scenario dependent. Trace xenon seeding near a limiter
    can give about $10^{12}$-$10^{16}$ m$^{-3}$, while strong localized injection
    or radiating-edge operation can produce local near-surface values of about $10^{16}$-$10^{18}$
    m$^{-3}$; the value remains zero when no xenon ions are present.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:xenon_density_at_pedestal
  - name:xenon_density_at_plasma_boundary
  - name:density_at_limiter
  - name:neon_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: xenon
    operator_kind: qualifier
- name: y_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Y coordinate of the center of a diagnostic aperture in the camera right-handed
    Cartesian (x, y, z) frame, measured from that frame's origin along its y axis.
  documentation: 'The Y coordinate of a diagnostic aperture is the displacement of
    the aperture center along the $\hat{\mathbf{y}}$ axis of the camera right-handed
    Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame. The
    frame origin is the point assigned coordinates $(0,0,0)$ by the calibrated camera
    geometry, so this coordinate is one component of the aperture-center position
    relative to that same origin.


    The camera-frame aperture position and its Y component are related by projection
    onto the camera-frame basis:


    $$

    \mathbf{r}_{O_c\to\mathrm{ap}} = x_\mathrm{ap}\hat{\mathbf{x}} + y_\mathrm{ap}\hat{\mathbf{y}}
    + z_\mathrm{ap}\hat{\mathbf{z}}, \qquad y_\mathrm{ap} = \mathbf{r}_{O_c\to\mathrm{ap}}\cdot\hat{\mathbf{y}}

    $$


    where $O_c$ is the camera-frame origin, $\mathbf{r}_{O_c\to\mathrm{ap}}$ is the
    vector from that origin to the aperture center, $x_\mathrm{ap}$, $y_\mathrm{ap}$,
    and $z_\mathrm{ap}$ are camera-frame Cartesian coordinates in meters, and the
    basis vectors are dimensionless unit vectors. The camera-frame $z_\mathrm{ap}$
    component is distinct from vertical height unless the camera right-handed Cartesian
    $(\hat{\mathbf{x}}, \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame is explicitly aligned
    with the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    This coordinate is determined from the calibrated geometry of the diagnostic aperture,
    using mechanical design information, optical-bench survey, photogrammetry, or
    in-vessel alignment measurements. Together with [x_coordinate_of_diagnostic_aperture](name:x_coordinate_of_diagnostic_aperture)
    and the corresponding camera-frame $z$ component, it specifies the aperture-center
    position in the camera right-handed Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}},
    \hat{\mathbf{z}})$ frame; related geometric descriptions may instead use major_radius_of_diagnostic_aperture
    and [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture)
    in the right-handed cylindrical $(R,\phi,Z)$ frame.


    Typical numerical values are installation-specific because they depend on the
    chosen camera-frame origin and aperture mounting geometry. The coordinate is reported
    in meters and is normally fixed for a calibrated aperture unless the diagnostic
    is mechanically reconfigured or realigned.


    Sign convention: Positive when the aperture center is displaced in the $+\hat{\mathbf{y}}$
    direction from the origin of the camera right-handed Cartesian $(\hat{\mathbf{x}},
    \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_diagnostic_aperture
  - name:vertical_coordinate_of_diagnostic_aperture
- name: y_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Cartesian Y coordinate of the divertor target surface center in the
    right-handed (x, y, z) frame.
  documentation: 'The Y coordinate locates the center of the divertor target surface
    along the $\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where
    $\hat{z} = \hat{Z}$ is vertical and $\hat{x}$ is aligned with $\phi = 0$, with
    the toroidal angle $\phi$ increasing counter-clockwise when viewed from above
    $+\hat{Z}$. This coordinate relates to the cylindrical $(R, \phi, Z)$ description
    of the same point by the standard transformation $y = R\sin\phi$, where $R$ is
    the major radius from the toroidal symmetry axis and $\phi$ is the toroidal angle.


    This coordinate is used alongside [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target)
    to fully specify the three-dimensional Cartesian position of the divertor target
    center in plasma-wall interaction modeling. It is obtained from engineering drawings
    of the divertor geometry or from geometric calibration of diagnostics such as
    infrared cameras that image the target surface.


    The magnitude of $y$ is bounded by the major radius of the machine; for a target
    segment at toroidal angle $\phi$ and radial distance $R$ from the symmetry axis,
    $|y|$ spans zero to approximately $R$ depending on the toroidal location of the
    target.


    Sign convention: Positive when the divertor target center is displaced in the
    $+\hat{y}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
- name: y_image_up_unit_vector_of_camera
  kind: scalar
  status: draft
  description: Y-axis projection of the unit vector defining the image-up orientation
    direction of a camera, resolved in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The image-up unit vector of a camera specifies the spatial direction
    in three-dimensional space that corresponds to the upward direction within the
    camera''s image plane, defining the camera''s rotational orientation about its
    optical axis. The Y component gives the projection of this orientation vector
    onto the $\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where
    $\hat{x}$, $\hat{y}$, and $\hat{z}$ are mutually orthogonal basis vectors satisfying
    $\hat{x} \times \hat{y} = \hat{z}$.


    The three Cartesian components of the image-up unit vector satisfy the normalization
    constraint:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    where $u_x$, $u_y$, and $u_z$ are the X, Y, and Z projections respectively, each
    dimensionless and bounded in $[-1, 1]$.


    The image-up direction is perpendicular to the camera''s line-of-sight (optical
    axis) and lies in the image plane; it is determined by the physical mounting orientation
    of the camera on the diagnostic structure. Together with [x_image_up_unit_vector_of_camera](name:x_image_up_unit_vector_of_camera),
    the full image-up orientation can be reconstructed. The value is set at installation
    or calibration time from a survey of the camera geometry in the device coordinate
    frame.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:x_image_up_unit_vector_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/up/y
    dd_path: camera_ir/channel/camera/up/y
    status: composed
- name: power_at_wall_due_to_conduction
  kind: scalar
  status: draft
  description: Global thermal power deposited on all plasma-facing wall and divertor
    surfaces by parallel conduction along scrape-off-layer magnetic field lines, excluding
    convective, radiative, and neutral-particle power channels.
  documentation: "The power at wall due to conduction is the total thermal power deposited\
    \ on all plasma-facing surfaces\u2014spanning the first wall, limiters, and divertor\
    \ targets\u2014by electron and ion heat conduction along open magnetic field lines\
    \ in the scrape-off-layer plasma. It is the globally integrated conductive component\
    \ of the plasma\u2013wall power balance described by [power_due_to_conduction](name:power_due_to_conduction),\
    \ isolating the conduction channel from contributions by convective particle enthalpy\
    \ flux, absorbed radiation, and neutral-particle energy deposition. It complements\
    \ the convective component [power_at_wall_due_to_convection](name:power_at_wall_due_to_convection)\
    \ and relates to the target-resolved quantity [power_at_divertor_target_due_to_conduction](name:power_at_divertor_target_due_to_conduction)\
    \ when individual strike-point surfaces are distinguished.\n\nIn the scrape-off\
    \ layer the dominant electron conductive heat flux follows the Spitzer\u2013H\xE4\
    rm closure:\n\n$$\nq_{\\parallel,e} = -\\kappa_0 T_e^{5/2} \\nabla_\\parallel\
    \ T_e\n$$\n\nwhere $\\kappa_0 \\approx 2000\\ \\mathrm{W\\,m^{-1}\\,eV^{-7/2}}$\
    \ is the electron thermal conductivity prefactor, $T_e$ is the local electron\
    \ temperature, and $\\nabla_\\parallel T_e$ is the temperature gradient along\
    \ the magnetic field. The total conducted power at the wall is the surface integral\
    \ of this flux\u2014plus the ion conductive contribution\u2014over all wetted\
    \ plasma-facing areas.\n\nThis quantity is estimated from two-point model power-balance\
    \ calculations relating upstream scrape-off-layer conditions to total surface\
    \ heat loads, or by subtracting the convective, radiative, and recombination channels\
    \ from the total incident_power_at_wall. In attached divertor operation the conducted\
    \ fraction constitutes a substantial part of the total exhaust; in detached regimes,\
    \ volumetric power dissipation by radiation and recombination in the divertor\
    \ volume substantially reduces its magnitude, making this quantity a global indicator\
    \ of divertor detachment efficacy."
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_conduction
  - name:power_at_wall_due_to_convection
  - name:power_at_divertor_target_due_to_conduction
- name: power_at_wall_due_to_convection
  kind: scalar
  status: draft
  description: Power deposited on plasma-facing wall and divertor surfaces by convective
    particle energy flux from the scrape-off layer, including particle enthalpy and
    directed kinetic energy carried into the material surface.
  documentation: 'Convective power at the wall is the surface-integrated rate at which
    plasma particles deposit energy on plasma-facing material surfaces by their motion
    into the surface. It includes thermal enthalpy and directed kinetic energy carried
    by particles from the scrape-off layer, and is distinct from conductive heat transport
    without net particle flow, represented by [power_at_wall_due_to_conduction](name:power_at_wall_due_to_conduction).


    The deposited convective power is defined as the integral of the incident normal
    convective heat-flux density over the plasma-facing surface:


    $$

    P_\mathrm{conv} = \int_S q_{\mathrm{conv},\perp} \, dA, \qquad q_{\mathrm{conv},\perp}=\mathbf{q}_\mathrm{conv}\cdot\hat{n}_m

    $$


    where $S$ is the union of wall and divertor surfaces exposed to the plasma, $\mathbf{q}_\mathrm{conv}$
    is the convective particle energy-flux vector, and $\hat{n}_m$ is the unit normal
    directed from the plasma into the material. With this convention $q_{\mathrm{conv},\perp}$
    is positive for power incident on the component, consistent with the local flux-density
    quantity heat_flux_of_plasma_facing_component. In sheath-limited estimates, $q_{\mathrm{conv},\perp}\approx
    \sum_s \gamma_s n_s T_s c_s$, where $n_s$ is the sheath-entrance number density
    in m$^{-3}$, $T_s$ is the species temperature in joules per particle, $c_s$ is
    the characteristic sound speed in m s$^{-1}$, and $\gamma_s$ is a dimensionless
    sheath heat-transmission factor; if $T_s$ is supplied in eV it must be multiplied
    by the elementary charge to give SI power density.


    In practice this quantity is obtained from edge-plasma transport or kinetic modeling
    with sheath boundary conditions, or inferred from integrated heat-load measurements
    combined with power-balance constraints. It contributes to the total thermal_power_at_wall,
    while [thermal_power_of_divertor](name:thermal_power_of_divertor) refers to the
    corresponding thermal power deposited on divertor surfaces only.


    Typical integrated values are strongly scenario dependent. In attached divertor
    conditions they are commonly of order 0.01-1 MW in low-power experiments, 0.1-10
    MW in medium and large tokamak plasmas, and can exceed 10 MW in high-power exhaust
    scenarios before strong detachment or radiative dissipation reduces the particle
    energy reaching material surfaces.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_conduction
  - name:thermal_power_of_divertor
  arguments:
  - name: power_due_to_convection
    operator: wall
    operator_kind: locus
- name: power_at_wall_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Total resistive Joule power converted to heat within conducting wall,
    plasma-facing, and vessel structures by induced, halo, or other plasma-wall currents.
  documentation: 'Power at the wall due to ohmic dissipation is the total rate at
    which electrical energy is converted into heat inside conducting wall, plasma-facing,
    and vessel structures by currents associated with plasma-wall interaction. It
    includes resistive dissipation from eddy currents induced by changing magnetic
    fields and from halo or shared currents that pass through conducting structures.


    The instantaneous Joule-heating power over the conducting material volume is


    $$

    P_\mathrm{ohm} = \int_V \eta(\mathbf{x},T)\, |\mathbf{j}(\mathbf{x})|^2 \, dV

    $$


    where $V$ is the conducting material volume, $\eta(\mathbf{x},T)$ is the electrical
    resistivity at position $\mathbf{x}$ and material temperature $T$ in $\Omega\,\mathrm{m}$,
    $\mathbf{j}$ is the local current density in $\mathrm{A}\,\mathrm{m}^{-2}$, and
    $dV$ is a differential volume element in $\mathrm{m}^3$. For passive resistive
    materials, $\eta \ge 0$ and $|\mathbf{j}|^2 \ge 0$, so the integral is non-negative
    and represents heat production rather than a signed electromagnetic power flow.


    This quantity is computed from electromagnetic circuit or field models of the
    conducting structures, often constrained by magnetic sensors, wall-current measurements,
    halo-current measurements, and material resistivity data. Thermal analysis or
    calorimetry can provide an independent constraint when other heat sources, such
    as particle impact, radiation, and recombination, are separated. The related [energy
    flux at wall due to eddy current](name:energy_flux_at_wall_due_to_eddy_current)
    describes a local surface heat flux from eddy-current dissipation only; this quantity
    is a volume-integrated power and may also include halo-current dissipation.


    Typical values are about 10^3-10^6 W during routine operation with slowly varying
    fields, and about 10^6-10^9 W during disruptions, vertical displacement events,
    or rapid current quenches in large devices. The magnitude depends on plasma current,
    magnetic-field ramp rate, wall geometry, material resistivity, and the electrical
    circuit paths that connect the plasma to surrounding conducting structures.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:plasma_power_at_wall
  arguments:
  - name: power_due_to_ohmic_dissipation
    operator: wall
    operator_kind: locus
- name: power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on plasma-facing wall surfaces by all recombination
    processes, encompassing both plasma-ion recombination and surface recombination
    of incident neutral particles into molecules.
  documentation: 'The total recombination power at the wall aggregates two distinct
    heat-load channels: the plasma-ion channel, in which ions arriving at the surface
    capture free electrons and release their recombination energy into the wall material,
    and the neutral surface-recombination channel, in which incident hydrogen-isotope
    atoms combine into diatomic molecules on the material surface and deposit the
    molecular binding energy as heat.


    This quantity is the wall-surface component of the broader [power due to recombination](name:power_due_to_recombination),
    which encompasses volumetric recombination throughout the plasma volume. The two
    contributing channels are resolved separately: [plasma_power_at_wall_due_to_recombination](name:plasma_power_at_wall_due_to_recombination)
    carries the ion-channel contribution and [neutral_power_at_wall_due_to_recombination](name:neutral_power_at_wall_due_to_recombination)
    carries the neutral surface-recombination contribution, their sum giving:


    $$

    P_{\mathrm{rec,wall}} = P_{\mathrm{rec,wall}}^{\mathrm{ion}} + P_{\mathrm{rec,wall}}^{\mathrm{neutral}}

    $$


    where $P_{\mathrm{rec,wall}}^{\mathrm{ion}}$ is the integrated plasma-ion recombination
    power and $P_{\mathrm{rec,wall}}^{\mathrm{neutral}}$ is the neutral surface-recombination
    power, both summed over all plasma-facing surfaces.


    In edge plasma models, this quantity is evaluated from particle-balance calculations
    coupled to surface-interaction models, with each channel weighted by the recombination
    energy per event and the incident particle flux to the wall.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  - name:neutral_power_at_wall_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: wall
    operator_kind: locus
- name: neutral_power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Power deposited on the plasma-facing wall by surface recombination
    of incident neutral particles, predominantly hydrogen-isotope atoms that combine
    into diatomic molecules and release their binding energy as heat in the wall material.
    It is distinct from the recombination power associated with incident plasma ions.
  documentation: 'Neutral recombination power at the wall is the rate at which binding
    energy released by surface recombination of incident neutral particles is converted
    into heat in plasma-facing wall material. For hydrogenic plasmas the dominant
    channel is associative formation of H2, D2, T2, or mixed-isotope molecules from
    two adsorbed atoms, releasing the molecular formation enthalpy into the solid.
    This is the neutral-origin component of the total recombination wall power and
    is separate from the recombination heat carried by incident plasma ions.


    The deposited power is obtained by integrating the local heat release over the
    plasma-facing surface:


    $$

    P_{\mathrm{rec},n} = \int_{A_{\mathrm{wall}}} \Gamma_{n}(\mathbf{x})\, E_{\mathrm{rec}}(\mathbf{x})\,
    dA

    $$


    where $\Gamma_{n}$ is the local flux of incident neutral particles participating
    in surface recombination, in m^-2 s^-1, and $E_{\mathrm{rec}}$ is the effective
    heat deposited in the wall per participating particle, in J. If the molecular
    formation enthalpy $\Delta H_{\mathrm{mol}}$ is quoted per molecule, about 4.5
    eV for one hydrogen-isotope molecule formed from two atoms, then the heat deposited
    per incident atom is approximately $\eta_{\mathrm{heat}}\,\Delta H_{\mathrm{mol}}/2$,
    where $\eta_{\mathrm{heat}}$ is the fraction of released energy retained in the
    solid rather than carried away by desorbed molecules.


    In practice this quantity is estimated from modeled neutral fluxes to plasma-facing
    surfaces, surface recombination probabilities, and the effective accommodation
    of the released binding energy. It can be constrained by wall calorimetry, particle-balance
    analysis, spectroscopy, and neutral-transport modeling. The effective heat fraction
    depends on surface material, temperature, isotope, adsorbate coverage, and roughness.


    Typical integrated values span roughly 10^2-10^5 W for main-chamber wall recycling
    in medium-sized devices, with larger values possible under high-recycling conditions
    and large neutral fluxes. This contribution is generally smaller than the total
    neutral power deposited on the wall but is relevant to detailed plasma-wall interaction
    power balances.


    Sign convention: Positive when energy is deposited into the wall.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  arguments:
  - name: power_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
- name: plasma_power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on plasma-facing wall surfaces by recombination
    of plasma ions, constituting the ion-channel contribution to the overall recombination
    wall heat load integrated over all plasma-facing surfaces.
  documentation: 'When plasma ions arrive at a plasma-facing wall surface, they undergo
    surface recombination, releasing energy equal to their ionization potential plus
    any residual kinetic energy carried to the surface. This quantity integrates that
    energy deposition rate over all plasma-facing wall surfaces and represents the
    plasma-ion species channel within the parent quantity [power_at_wall_due_to_recombination](name:power_at_wall_due_to_recombination),
    which also includes neutral-particle contributions.


    The deposited power is related to the local incident ion flux density by:


    $$

    P_\mathrm{rec} = \int_A \Gamma_\mathrm{ion}(\mathbf{r}) \, E_\mathrm{rec} \, dA

    $$


    where $\Gamma_\mathrm{ion}$ is the local ion particle flux density at the surface
    in m$^{-2}$ s$^{-1}$, $E_\mathrm{rec}$ is the mean energy released per recombination
    event (sum of ionization potential and residual kinetic energy, in J), and the
    integral extends over the total wetted plasma-facing area $A$.


    This quantity excludes energy deposited by recombination of neutral particles
    into molecules at the surface, which is captured separately by [neutral_power_at_wall_due_to_recombination](name:neutral_power_at_wall_due_to_recombination).
    The analogous quantity resolved at divertor strike surfaces is plasma_power_at_divertor_target_due_to_recombination.
    It is estimated from edge plasma transport models constrained by incident ion-flux
    and particle-balance measurements at the boundary.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_recombination
  - name:neutral_power_at_wall_due_to_recombination
  arguments:
  - name: power_at_wall_due_to_recombination
    operator: plasma
    operator_kind: qualifier
- name: power_density_at_wall
  kind: scalar
  status: draft
  description: Power flux density deposited on plasma-facing wall surfaces by all
    incident particle and radiation channels from the boundary plasma.
  documentation: "Power density at the wall quantifies the total thermal energy load\
    \ per unit surface area delivered to plasma-facing components, aggregating contributions\
    \ from charged particle impact, neutral atom bombardment, charge-exchange flux,\
    \ and photon irradiation. It provides a spatially distributed measure of wall\
    \ heating across the full plasma-facing geometry, in contrast to extremal statistics\
    \ such as [peak_power_density_at_first_wall](name:peak_power_density_at_first_wall)\
    \ or [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\n\
    \nThe local wall power density $q_w$ sums over all incident energy channels:\n\
    \n$$\nq_w = \\sum_s \\Gamma_s \\, E_s + q_{\\mathrm{rad}}\n$$\n\nwhere $\\Gamma_s$\
    \ is the incident particle flux density of species $s$, $E_s$ is the mean energy\
    \ deposited per particle, and $q_{\\mathrm{rad}}$ is the radiative contribution\
    \ represented by [energy_flux_at_wall_due_to_radiation](name:energy_flux_at_wall_due_to_radiation).\n\
    \nSpatially resolved wall heat loads are measured via calibrated infrared thermography\
    \ or derived from boundary plasma transport simulations validated against bolometric\
    \ total-power measurements. The [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)\
    \ and ion contributions can be tracked separately as components of this total.\n\
    \nTypical steady-state values range from 0.1\u20131 MW/m\xB2 on the main first\
    \ wall to 5\u201320 MW/m\xB2 at actively loaded divertor strike zones; transient\
    \ power loads during edge-localized modes can transiently exceed these by an order\
    \ of magnitude."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_divertor_target
  - name:energy_flux_at_wall_due_to_radiation
  - name:electron_energy_flux_at_wall
  arguments:
  - name: power_density
    operator: wall
    operator_kind: locus
- name: ratio_of_beryllium_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of total beryllium ion number density to electron
    number density. It measures beryllium impurity abundance relative to the plasma
    electron population, with the beryllium ion density summed over charged ionization
    states.
  documentation: 'The ratio of beryllium density to electron density is a dimensionless
    impurity abundance measuring how much beryllium ion population is present relative
    to the free electron population. The beryllium numerator is the total beryllium
    ion number density, summed over charged ionization states, and does not by itself
    weight the ions by charge.


    The defining relation is:


    $$

    f_\mathrm{Be} = \frac{n_\mathrm{Be}}{n_e} = \frac{\sum_{q=1}^{4} n_{\mathrm{Be}^{q+}}}{n_e}

    $$


    where $n_\mathrm{Be}$ is the total beryllium ion number density, $n_{\mathrm{Be}^{q+}}$
    is the number density of beryllium ions in charge state $q$, and $n_e$ is the
    electron number density; all densities in the ratio have units of m$^{-3}$. In
    a quasi-neutral plasma, the charge-weighted impurity contribution enters the electron
    balance through terms of the form $q n_{\mathrm{Be}^{q+}}$, so this ratio is closely
    related to fuel dilution but is not itself the charge fraction.


    Beryllium impurities are commonly produced by plasma-wall interaction processes
    such as sputtering of beryllium-containing plasma-facing components, followed
    by transport and ionization in the edge and confined plasma. The ratio is inferred
    by combining beryllium spectroscopic measurements and collisional-radiative modeling
    with electron density measurements from diagnostics such as interferometry and
    Thomson scattering. Related beryllium density quantities include [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis),
    [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    and [beryllium_density_at_limiter](name:beryllium_density_at_limiter).


    Typical values in well-conditioned plasmas with beryllium plasma-facing surfaces
    are about $10^{-4}$-$10^{-2}$, with many H-mode conditions lying near $10^{-3}$-$5
    \times 10^{-3}$. Values can rise to several percent during strong wall source
    events, early conditioning phases, or after disruptions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_plasma_boundary
  arguments:
  - name: beryllium_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
- name: ratio_of_carbon_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless impurity fraction formed from total carbon nucleus density,
    including neutral carbon and all ionization states through C6+, divided by electron
    density. It measures carbon abundance; its effect on effective charge depends
    on charge-state weighting, not on the total fraction alone.
  documentation: 'The ratio of carbon density to electron density is the carbon impurity
    fraction relative to the electron population. The carbon density is the total
    number density of carbon nuclei, including neutral carbon atoms and ionized carbon
    from C$^{1+}$ through fully stripped C$^{6+}$. The ratio is meaningful only when
    the carbon and electron densities share the same evaluation context, such as the
    same local point, flux surface, line of sight, volume average, or other explicitly
    defined weighting.


    The defining expression is:


    $$

    f_C = \frac{n_C}{n_e} = \frac{\sum_{q=0}^{6} n_{\mathrm{C},q}}{n_e}

    $$


    where $f_C$ is the carbon fraction, $n_e$ is the electron number density in m$^{-3}$,
    $n_C$ is the total carbon number density in m$^{-3}$, $n_{\mathrm{C},0}$ is neutral
    atomic carbon, and $n_{\mathrm{C},q}$ for $q=1,\ldots,6$ is the number density
    of carbon with charge state $q+$.


    This total-carbon fraction is not itself a charge-weighted impurity measure. Its
    connection to [effective charge](name:effective_charge) depends on the charge-state
    moments of the carbon population: carbon contributes $\sum_q q^2 n_{\mathrm{C},q}/n_e$
    to $Z_\mathrm{eff}$, while quasineutrality depends on $\sum_q q n_{\mathrm{C},q}/n_e$.
    Equivalently, for singly charged fuel ions, $Z_\mathrm{eff}=1+(\langle q^2\rangle_C-\langle
    q\rangle_C)f_C$, where the averages are over the carbon nuclei included in $n_C$.
    For fully stripped carbon, this reduces to $Z_\mathrm{eff}=1+6(6-1)f_C=1+30f_C$;
    partial ionization and neutral carbon give a smaller charge-weighted effect for
    the same total carbon fraction.


    In practice, the numerator may be inferred from carbon spectroscopy, charge-exchange
    recombination measurements of highly ionized carbon, passive edge or divertor
    line emission, or collisional-radiative modeling, together with an independently
    determined electron density. If the numerator is a [volume-averaged carbon density](name:volume_averaged_carbon_density)
    or [line-averaged carbon density](name:line_averaged_carbon_density), the denominator
    should be the corresponding electron density evaluated with the same averaging
    definition.


    Representative carbon fractions are often in the range $10^{-4}$-$10^{-2}$ for
    low-carbon wall conditions and $10^{-2}$-$5\times10^{-2}$ when carbon sources,
    erosion, or recycling are significant. Larger local values can occur near carbon
    plasma-facing components, in the scrape-off layer, or in detached divertor regions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density
  - name:carbon_density_at_limiter
  - name:volume_averaged_carbon_density
  - name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  arguments:
  - name: carbon_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
- name: ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Dimensionless global boron impurity fraction equal to the volume-averaged
    total boron number density divided by the volume-averaged electron number density.
  documentation: 'This quantity is a global measure of boron content in a plasma,
    expressed as the ratio of the volume-averaged total boron number density to the
    volume-averaged electron number density. The boron density includes boron nuclei
    in all ionization states represented in the plasma composition, so the ratio measures
    elemental boron abundance relative to electrons rather than a single charge state.


    For a plasma volume $V$, the ratio is defined by


    $$

    f_B = \frac{\langle n_B \rangle_V}{\langle n_e \rangle_V}, \qquad \langle n \rangle_V
    = \frac{1}{V}\int_V n(\mathbf{x})\,dV

    $$


    where $n_B$ is the total boron number density, $n_e$ is the electron number density,
    and both averaged densities have units of m$^{-3}$. The ratio $f_B$ is dimensionless.


    The value is commonly inferred from plasma composition analysis by combining measurements
    or modeling of impurity content with the electron density distribution used to
    form the same volume average. It is useful for comparing the global level of boron
    introduced by wall conditioning, erosion, or impurity transport independently
    of the absolute plasma density.


    Typical values are non-negative and usually much smaller than unity when boron
    is a trace impurity. Values approaching unity would indicate that boron makes
    a major contribution to the plasma particle inventory and charge balance rather
    than acting as a minor impurity.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  - name:volume_averaged_boron_density
  arguments:
  - name: volume_averaged_boron_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: volume_averaged_electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/boron/value
    dd_path: summary/composition/boron/value
    status: composed
- name: ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Ratio of volume-averaged total oxygen ion number density to volume-averaged
    electron density, expressing the global oxygen impurity concentration as a dimensionless
    plasma composition fraction.
  documentation: 'The oxygen fraction $f_O$ measures the global oxygen impurity burden
    in a fusion plasma as the ratio of the volume-averaged oxygen ion density to the
    volume-averaged electron density, where both averages are taken over the plasma
    volume enclosed by the last closed flux surface.


    $$

    f_O = \frac{\langle n_O \rangle}{\langle n_e \rangle}

    $$


    where $\langle n_O \rangle = \sum_{q=1}^{8} \langle n_{O^{q+}} \rangle$ is the
    volume-averaged oxygen ion number density summed over all ionization stages from
    $O^{1+}$ to $O^{8+}$, and $\langle n_e \rangle$ is the [volume-averaged electron
    density](name:volume_averaged_electron_density).


    The quantity is inferred from vacuum ultraviolet or soft X-ray spectroscopy of
    oxygen emission lines combined with collisional-radiative or coronal equilibrium
    modeling; it is the normalized complement to [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density),
    which carries the absolute density, while [line_averaged_oxygen_density](name:line_averaged_oxygen_density)
    provides a routinely measured chord-integrated cross-check.


    In clean, well-conditioned tokamak discharges $f_O$ remains below 0.01; values
    of several percent can occur during commissioning, after disruptions, or with
    intentional oxygen seeding. Because each fully-stripped oxygen ion contributes
    eight electrons, even modest $f_O$ values measurably dilute fuel ion density and
    enhance radiative power losses through oxygen line emission.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:volume_averaged_electron_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_oxygen_density
  arguments:
  - name: volume_averaged_electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/oxygen/value
    dd_path: summary/composition/oxygen/value
    status: composed
- name: reference_wavelength_of_filter
  kind: scalar
  status: draft
  description: Reference wavelength of an optical filter is the nominal center or
    peak wavelength of its passband, usually the wavelength at which the nominal transmission
    is maximal. It identifies the spectral location of the filter response, not the
    full passband shape or width.
  documentation: 'Reference wavelength of a filter, $\lambda_\mathrm{ref}$, is the
    nominal spectral position assigned to an optical bandpass filter. For a single-peaked
    bandpass it is normally the wavelength at which the nominal spectral transmittance
    is largest; for asymmetric or structured responses it is a manufacturer- or calibration-defined
    reference point for the passband center.


    For a peak-defined filter reference, the defining relation is


    $$

    \lambda_\mathrm{ref} = \operatorname*{arg\,max}_{\lambda} T_\mathrm{nom}(\lambda)

    $$


    where $T_\mathrm{nom}(\lambda)$ is the nominal spectral transmittance as a function
    of wavelength $\lambda$.


    The value is obtained from the filter specification or from laboratory spectral-transmission
    calibration. It is used together with the passband width and, when available,
    lower and upper wavelength bounds to describe the spectral region transmitted
    by the filter; the reference wavelength alone does not fully determine the filter
    response.


    Typical values for visible and infrared plasma diagnostics are about $4\times10^{-7}$-$1.5\times10^{-5}$
    m, with narrow line filters often centered near specific atomic or molecular emission
    wavelengths and thermal-infrared filters commonly in the micrometer range.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:wavelength_of_filter
  - name:spectral_width_of_filter
  - name:spectral_wavelength
  arguments:
  - name: wavelength_of_filter
    operator: reference
    operator_kind: qualifier
