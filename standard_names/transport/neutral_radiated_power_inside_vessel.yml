name: neutral_radiated_power_inside_vessel
status: draft
description: Total electromagnetic power radiated by all neutral species within the
  vacuum vessel volume.
documentation: "The neutral radiated power inside the vessel, $P_{\\mathrm{rad,n}}^{\\\
  mathrm{vessel}}$, is the volume integral of the neutral emissivity $\\epsilon_n(\\\
  mathbf{r})$ over the entire in-vessel region: $$P_{\\mathrm{rad,n}}^{\\mathrm{vessel}}\
  \ = \\int_{V_{\\mathrm{vessel}}} \\epsilon_n(\\mathbf{r})\\, dV,$$ where $\\epsilon_n$\
  \ (W m$^{-3}$) includes line emission from atomic and molecular neutrals (Lyman,\
  \ Balmer series for hydrogen isotopes, and analogous transitions for impurity neutrals).\
  \ This contribution is typically small compared to the ion radiated power, but becomes\
  \ significant in high-recycling and detached divertor regimes where neutral densities\
  \ exceed $10^{18}$\u2013$10^{19}$ m$^{-3}$. Typical values range from tens of kW\
  \ to several MW depending on fueling rate and recycling conditions. The quantity\
  \ is derived from bolometric inversion, EIRENE or DEGAS2 neutral transport modeling,\
  \ or filtered camera imaging. Knowledge of $P_{\\mathrm{rad,n}}^{\\mathrm{vessel}}$\
  \ is essential for closing the power balance between the plasma edge and the vessel\
  \ first wall. See also `neutral_state_radiated_power_inside_flux_surface` for the\
  \ flux-surface-resolved neutral-state profile and `total_neutral_radiated_power_inside_flux_surface`\
  \ for the summed neutral contribution within a flux surface."
