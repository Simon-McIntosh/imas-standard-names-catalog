- name: elongation_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless vertical-to-horizontal aspect ratio of a nested magnetic
    flux-surface cross-section, defining its poloidal elongation independently of
    overall size.
  documentation: 'Poloidal elongation is the aspect ratio of a nested magnetic flux-surface
    cross-section, comparing its vertical extent with its radial extent. It describes
    plasma shaping independently of the surface''s absolute size.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height, the elongation of the surface labeled by $\psi$ is
    defined by


    $$

    \kappa(\psi) = \frac{a_Z(\psi)}{a_R(\psi)}

    $$


    where $a_Z$ and $a_R$ are the vertical and radial semi-extents of that flux surface,
    and $\psi$ is its magnetic-flux label.


    This parent quantity applies to every nested magnetic flux surface; the boundary-specific
    case is [elongation of the plasma boundary](name:elongation_of_plasma_boundary).
    Its radial variation is described by [radial derivative of elongation of the flux
    surface](name:radial_derivative_of_elongation_of_flux_surface).'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_plasma_boundary
  - name:radial_derivative_of_elongation_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-elongation
    dd_documentation:
      leaf: Elongation
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Elongation (\u03BA) of nested magnetic flux surfaces as a 1D radial\
        \ profile in the MHD equilibrium, defined as the ratio of the vertical to\
        \ horizontal semi-axis of each flux surface. Characterizes plasma shape as\
        \ a function of the poloidal flux coordinate."
      kind: llm
  - dd_path: gyrokinetics_local/flux_surface/elongation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gyrokinetics_local.html#gyrokinetics_local-flux_surface-elongation
    dd_documentation:
