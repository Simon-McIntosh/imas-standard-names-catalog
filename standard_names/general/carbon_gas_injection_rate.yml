name: carbon_gas_injection_rate
status: draft
cocos_transformation_type: one_like
description: Instantaneous rate of carbon atom (or carbon-containing molecule) injection
  into the vessel, in particles per second.
documentation: "The carbon gas injection rate $\\dot{N}_{\\mathrm{C}}$ (in $\\mathrm{s}^{-1}$)\
  \ gives the number of carbon particles delivered per unit time through gas-injection\
  \ valves. It is obtained from calibrated piezo-valve flow measurements or mass-flow\
  \ controllers. Integrating $\\dot{N}_{\\mathrm{C}}$ over the discharge yields the\
  \ accumulated carbon injection: $N_{\\mathrm{C,acc}} = \\int_0^t \\dot{N}_{\\mathrm{C}}(t')\\\
  ,dt'$. Carbon gas puffing is employed for radiative-mantle formation, divertor detachment\
  \ experiments, and as a spectroscopic tracer for impurity-transport studies; typical\
  \ rates span $10^{18}$\u2013$10^{21}\\;\\mathrm{s}^{-1}$ depending on the application."
