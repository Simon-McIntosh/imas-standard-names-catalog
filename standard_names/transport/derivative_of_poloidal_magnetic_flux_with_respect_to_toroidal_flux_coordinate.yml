name: derivative_of_poloidal_magnetic_flux_with_respect_to_toroidal_flux_coordinate
status: draft
description: Radial gradient of the poloidal magnetic flux $\psi$ with respect to
  the toroidal flux coordinate $\rho_{\rm tor}$, linking poloidal and toroidal flux
  mappings.
documentation: "The quantity $d\\psi/d\\rho_{\\rm tor}$ relates the poloidal magnetic\
  \ flux $\\psi$ (in Wb) to the toroidal flux coordinate $\\rho_{\\rm tor}$ (in m),\
  \ where $\\rho_{\\rm tor} = \\sqrt{\\Phi_{\\rm tor}/(\\pi B_0)}$ with $\\Phi_{\\\
  rm tor}$ the toroidal magnetic flux enclosed by a given flux surface and $B_0$ the\
  \ reference toroidal field. This derivative is essential for coordinate transformations\
  \ in 1-D radial transport solvers, converting flux-surface-averaged transport equations\
  \ between the $\\psi$ and $\\rho_{\\rm tor}$ representations. It encodes the local\
  \ relationship between the safety factor $q = d\\Phi_{\\rm tor}/d\\psi$ and the\
  \ metric coefficients of the flux coordinate system. Typical values range from $\\\
  sim 0$ at the magnetic axis (where $\\psi$ is extremal) to order $\\sim 1$\u2013\
  $10\\;\\mathrm{m^{-1}\\cdot Wb}$ at the plasma boundary, depending on the device\
  \ size and field strength. Computed from equilibrium reconstruction codes such as\
  \ EFIT or LIUQE. See also `poloidal_magnetic_flux` and `safety_factor` for the parent\
  \ quantities."
validity_domain: ''
