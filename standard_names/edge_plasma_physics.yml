- name: toroidal_lithium_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Signed toroidal component of the lithium ion fluid velocity at the
    H-mode pedestal top in the right-handed cylindrical (R, phi, Z) frame. It represents
    the local azimuthal rotation of lithium impurity ions at the steep-gradient edge
    transport barrier, not a pedestal average.
  documentation: 'Toroidal lithium velocity at the pedestal is the local toroidal
    component of the lithium ion fluid velocity at the pedestal-top reference location,
    near the inner edge of the steep-gradient H-mode edge transport barrier. It is
    a signed component in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height; it
    is not a radial integral, volume average, or average over the full pedestal width.


    The component is defined by projecting the lithium ion fluid velocity onto the
    toroidal unit vector:


    $$

    v_{\phi}^{\mathrm{Li}} = \mathbf{v}^{\mathrm{Li}} \cdot \hat{\phi}

    $$


    where $v_{\phi}^{\mathrm{Li}}$ is the toroidal lithium velocity in m.s^-1, $\mathbf{v}^{\mathrm{Li}}$
    is the lithium ion fluid velocity in m.s^-1, and $\hat{\phi}$ is the dimensionless
    unit vector in the direction of increasing toroidal angle $\phi$.


    In practice, this quantity is commonly inferred from Doppler shifts of localized
    lithium line emission or charge-exchange emission, with corrections for viewing
    geometry, instrumental wavelength calibration, and the projection of the measured
    line-of-sight velocity onto $\hat{\phi}$. The pedestal-top reference location
    is determined from edge profile analysis, typically using the radial position
    at the top of the steep gradient region rather than a flux-surface average over
    the pedestal.


    Representative pedestal impurity toroidal velocities are device- and scenario-dependent
    and may be near zero or of order $10^3-10^5$ m.s^-1 in tokamak H-mode plasmas.
    The value can change sign with the direction of toroidal rotation and may differ
    from main-ion rotation because lithium is an impurity species with its own charge
    state, source distribution, and collisional coupling.


    Sign convention: Positive when the lithium ion fluid velocity component is in
    the $+\hat{\phi}$ direction, the direction of increasing toroidal angle $\phi$,
    in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_lithium_velocity_at_magnetic_axis
  - name:toroidal_lithium_velocity_at_internal_transport_barrier
