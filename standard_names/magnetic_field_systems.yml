- name: length_of_ferritic_element
  kind: scalar
  status: active
  description: "Euclidean length of a designated inclined side of an oblique parallelogram\
    \ cross-section, measured in the poloidal plane of the right-handed cylindrical\
    \ (R, \u03C6, Z) frame."
  documentation: 'The quantity is the Euclidean length of a designated inclined side
    of an oblique parallelogram cross-section of a physical component. [Major length
    of a ferritic element](name:major_length_of_ferritic_element) is a component-specific
    instance of this geometric quantity.


    For endpoints $(R_1,Z_1)$ and $(R_2,Z_2)$ of the side at a common toroidal angle
    $[1m\phi[0m$, its length is defined by


    $$

    L = \sqrt{(R_2-R_1)^2 + (Z_2-Z_1)^2}

    $$


    where $L$ is the side length, $R_i$ are major-radius coordinates, and $Z_i$ are
    vertical coordinates in the right-handed cylindrical $(R,\phi,Z)$ frame; $\phi$
    is the toroidal angle. The quantity is nonnegative and describes geometric extent
    only; it does not encode the side''s signed inclination or orientation.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_ferritic_element
