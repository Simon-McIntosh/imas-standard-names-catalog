    frame. The three components satisfy $\hat{e}_{1,x}^2 + \hat{e}_{1,y}^2 + \hat{e}_{1,z}^2
    = 1$, and $\hat{e}_1$ is orthogonal to the second and third local unit vectors
    forming the complete orthonormal orientation triad of the optical element or aperture.
    Values are dimensionless and confined to $[-1, 1]$; they are specified geometrically
