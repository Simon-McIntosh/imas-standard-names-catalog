      - summary/time
    enhanced_context:
      description: Tritium (T).
      kind: template
- name: tungsten_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of tungsten impurity ions at the pedestal top is the
    particle count per volume at the core-side shoulder of the H-mode edge transport
    barrier, summed over W1+ through W74+ and excluding neutral tungsten atoms.
  documentation: 'Number density of tungsten impurity ions at the pedestal top is
    the local particle count per volume for tungsten ions evaluated at the core-side
    shoulder of an H-mode pedestal. The pedestal top is the transition where the steep-gradient
    edge transport barrier meets the flatter confined-core density variation, distinct
    from a separatrix or plasma-boundary value. This quantity is the tungsten-specific
    specialization of [density at the pedestal top](name:density_at_pedestal_top).


    The tungsten density at the pedestal-top location is defined by


    $$

    n_{\rm W}(\xi_{\rm ped,top}) = \sum_{Z=1}^{74} n_{\mathrm{W}^{Z+}}(\xi_{\rm ped,top})

    $$


    where $n_{\rm W}$ and $n_{\mathrm{W}^{Z+}}$ are number densities in m$^{-3}$,
    $Z$ is the dimensionless tungsten charge-state index, and $\xi_{\rm ped,top}$
    is the radial label of the pedestal-top location.


    The sum includes tungsten ions from W1+ through fully stripped W74+ and excludes
    neutral tungsten atoms. Unlike [tungsten density](name:tungsten_density), this
    quantity is restricted to the pedestal-top locus; [iron density at the pedestal
    top](name:iron_density_at_pedestal_top) is an analogous species-resolved family
    member.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:tungsten_density
  - name:iron_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: tungsten
    operator_kind: qualifier
- name: volume_averaged_neutral_species_density
  kind: scalar
  status: active
  description: Mean number density of a specified neutral species over the plasma
    volume enclosed by the last closed flux surface during plasma initiation.
  documentation: 'This quantity is the spatial mean of the local number density of
    one specified neutral species within the plasma volume enclosed by the last closed
    flux surface during plasma initiation. The local quantity is distinguished from
    [neutral_density](name:neutral_density), which is evaluated at a point.


    $$

    \overline{n}_0 = \frac{1}{V_{\mathrm{LCFS}}} \int_{V_{\mathrm{LCFS}}} n_0(\mathbf{r})\,dV

    $$


    where $n_0(\mathbf{r})$ is the local number density of the specified neutral species
    at position $\mathbf{r}$, $V_{\mathrm{LCFS}}$ is the volume enclosed by the last
    closed flux surface, and $dV$ is the volume element.


    The average is species-specific and excludes neutral particles outside the enclosed
    volume. It is not the charge-state or population aggregate represented by [total_neutral_density](name:total_neutral_density),
    nor the volume average of ion density represented by [volume_averaged_ion_density](name:volume_averaged_ion_density).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_density
  - name:total_neutral_density
  - name:volume_averaged_ion_density
  sources:
