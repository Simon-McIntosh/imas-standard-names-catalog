- name: energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: active
  description: Outgoing energy flux per unit plasma-facing wall area produced when
    incident plasma ions recombine at the surface, summed over incident-ion species,
    incident-ion charge states, recombination channels, and emitted product species
    and states.
  documentation: 'Energy flux at the wall due to recombination quantifies the rate
    at which recombination-associated energy is emitted from a plasma-facing surface
    per unit area as a result of incident plasma ions recombining or neutralizing
    at the material boundary. It is the total outgoing energy flux carried by emitted
    recombination products or quanta, not the incident plasma energy flux or heat
    deposited in the wall material.


    The total recombination energy flux at wall location $\mathbf{x}_w$ is defined
    as the product-energy moment of the outgoing recombination source:


    $$

    Q_\mathrm{rec}(\mathbf{x}_w) = \sum_{i,\,\zeta,\,c,\,a,\,k}\int E_\mathrm{out}\,\frac{d\Gamma_{i,\zeta,c,a,k}}{dE_\mathrm{out}}(\mathbf{x}_w,E_\mathrm{out})\,dE_\mathrm{out}

    $$


    where $i$ identifies the incident-ion species, $\zeta$ the incident-ion charge
    state, $c$ the surface recombination or neutralization channel, $a$ the emitted
    product species, $k$ the product internal state or emission class, $E_\mathrm{out}$
    the energy carried into the plasma-facing half-space by an emitted product or
    quantum, and $d\Gamma_{i,\zeta,c,a,k}/dE_\mathrm{out}$ the corresponding outgoing
    recombination-product flux distribution with respect to product energy. For discrete
    product energies, the integral is replaced by the corresponding sum.


    This quantity is the energy-weighted counterpart of [particle flux at the wall
    due to recombination](name:particle_flux_at_wall_due_to_recombination), which
    counts the same surface recombination source without energy weighting, and is
    the energy-flux realization of [flux at the wall due to recombination](name:flux_at_wall_due_to_recombination).
    The incident-ion decomposition is charge-state-summed in this total: [ion charge-state
    energy flux at the wall due to recombination](name:ion_charge_state_energy_flux_at_wall_due_to_recombination)
    resolves a specified incident-ion species and charge state, while [ion energy
    flux at the wall due to recombination](name:ion_energy_flux_at_wall_due_to_recombination)
    is the corresponding ion contribution after summing over charge states. Neutral-product
    particle specializations such as [neutral particle flux at the wall due to recombination](name:neutral_particle_flux_at_wall_due_to_recombination)
    partition emitted-product counts and do not by themselves include energy weighting.


    Sign convention: Positive when recombination-associated energy is emitted away
    from the plasma-facing wall surface into the plasma-facing half-space.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:ion_energy_flux_at_wall_due_to_recombination
- name: flux_at_wall_due_to_eddy_current
  kind: scalar
  status: active
  description: Flux at wall due to eddy current is the plasma-facing wall surface
    density of power whose causal origin is eddy-current induction in conducting material.
    It identifies the eddy-current-attributed wall boundary flux without fixing the
    internal conversion, transport, or surface-emission pathway.
  documentation: 'Flux at wall due to eddy current is the plasma-facing wall surface
    density of power whose causal origin is eddy-current induction in conducting material.
    It denotes the boundary flux associated with eddy-current effects as a class,
    independent of the particular internal conversion, transport, or surface-emission
    pathway by which that power appears at the wall.


    The local value is defined as the surface density of eddy-current-attributed power
    associated with a wall surface element:


    $$

    q_{\mathrm{ec,w}} = \frac{dP_{\mathrm{ec,w}}}{dA}

    $$


    where $q_{\mathrm{ec,w}}$ is the local wall flux due to eddy current, $P_{\mathrm{ec,w}}$
    is the eddy-current-attributed power associated with the wall surface, and $A$
    is wall surface area.


    The common semantics are the wall locus and the eddy-current causal attribution.
    More specific members such as [energy flux at wall due to eddy current](name:energy_flux_at_wall_due_to_eddy_current)
    may constrain the transported quantity or realization pathway; fluxes caused by
    plasma particles, radiation, neutrals, externally applied heating, or other non-eddy-current
    sources are excluded.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  arguments:
  - name: flux_due_to_eddy_current
    operator: wall
    operator_kind: locus
- name: energy_flux_at_wall_due_to_eddy_current
  kind: scalar
  status: active
  description: Energy flux at the wall due to eddy current is the thermal energy flux
    density emitted from a plasma-facing wall surface toward the plasma by heat generated
    from eddy-current Joule dissipation in conducting structures.
  documentation: 'Energy flux at the wall due to eddy current is the thermal energy
    flux density emitted from a plasma-facing wall surface toward the plasma by heat
    generated from eddy-current Joule dissipation in conducting structures. It is
    the wall-normal component of the heat-flux field attributable to eddy-current
    heating, evaluated at the plasma-facing boundary.


    The signed surface flux is the projection of the eddy-current heat-flux vector
    onto the local surface normal from wall material toward plasma:


    $$

    q_\mathrm{wall}^{\mathrm{eddy}} = \mathbf{q}_\mathrm{th}^{\mathrm{eddy}} \cdot
    \hat{\mathbf{n}}_{\mathrm{wall}\to\mathrm{plasma}}

    $$


    where $q_\mathrm{wall}^{\mathrm{eddy}}$ is the signed surface energy flux density
    in W m$^{-2}$, $\mathbf{q}_\mathrm{th}^{\mathrm{eddy}}$ is the heat-flux vector
    due only to eddy-current Joule heating with components in W m$^{-2}$, and $\hat{\mathbf{n}}_{\mathrm{wall}\to\mathrm{plasma}}$
    is the unit normal directed from the wall material toward the plasma.


    The underlying volumetric Joule source is $p_\mathrm{eddy} = \mathbf{J}_\mathrm{eddy}\cdot\mathbf{E}_\mathrm{eddy}$,
    equal to $|\mathbf{J}_\mathrm{eddy}|^2/\sigma_w$ for scalar Ohmic conductivity
    $\sigma_w$. This surface quantity includes only the portion of that internally
    generated thermal power crossing the plasma-facing surface; it excludes eddy-current
    power retained elsewhere in the structure, heat leaving other surfaces, and energy
    fluxes at the wall due to radiation, particle impact, or plasma-side electromagnetic
    fields. Its area integral over a specified wall surface gives the corresponding
    emitted power, distinct from total [power at the wall due to Ohmic dissipation](name:power_at_wall_due_to_ohmic_dissipation).


    Sign convention: Positive when thermal energy crosses the plasma-facing wall surface
    from the wall material toward the plasma.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:flux_at_wall_due_to_eddy_current
  - name:power_at_wall_due_to_ohmic_dissipation
