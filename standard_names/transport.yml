- name: toroidal_momentum_convection_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the effective convection velocity for momentum
    transport, governing the pinch-like non-diffusive radial flux of toroidal momentum
    independent of local momentum-density gradients.
  documentation: "The toroidal momentum convection velocity is the toroidal projection\
    \ of the effective convection vector $\\mathbf{v}^{\\rm conv}$ that enters the\
    \ diffusion-convection decomposition of the radial momentum flux. It quantifies\
    \ all non-diffusive contributions to toroidal momentum transport \u2014 including\
    \ intrinsic rotation, Coriolis pinch, and turbulence-driven parallel velocity\
    \ pinch effects \u2014 that produce a net radial momentum flux even in the absence\
    \ of a local momentum-density gradient.\n\nIn the standard flux-gradient framework,\
    \ the radial flux of toroidal momentum $\\Gamma_{p_\\phi}$ is decomposed as:\n\
    \n$$\n\\Gamma_{p_\\phi} = -D_\\phi \\frac{\\partial (m_i n_i v_\\phi)}{\\partial\
    \ r} + v_\\phi^{\\rm conv} \\cdot m_i n_i v_\\phi\n$$\n\nwhere $D_\\phi$ is the\
    \ toroidal momentum diffusivity, $m_i$ is the ion mass, $n_i$ is the number density,\
    \ and $v_\\phi$ is the toroidal fluid velocity. The convection velocity $v_\\\
    phi^{\\rm conv}$ is the quantity documented here.\n\nThis coefficient is derived\
    \ from turbulent transport simulations or neoclassical calculations and is central\
    \ to predicting toroidal rotation profiles in the plasma edge and core regions.\
    \ It is the toroidal projection of [momentum_convection_velocity](name:momentum_convection_velocity);\
    \ the corresponding poloidal projection is [poloidal_momentum_convection_velocity](name:poloidal_momentum_convection_velocity).\
    \ Species-resolved neutral variants are [toroidal_neutral_species_momentum_convection_velocity](name:toroidal_neutral_species_momentum_convection_velocity)\
    \ and [toroidal_neutral_state_momentum_convection_velocity](name:toroidal_neutral_state_momentum_convection_velocity).\
    \ The closely related [toroidal_momentum_velocity](name:toroidal_momentum_velocity)\
    \ captures the same pinch physics for the radial grid formulation.\n\nSign convention:\
    \ Positive when the convection velocity is directed in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above the $+\\hat{Z}$\
    \ axis)."
  unit: m.s^-1
  physics_domain: transport
