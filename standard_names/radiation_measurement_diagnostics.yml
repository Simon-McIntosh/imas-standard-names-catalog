        from neutron emissivity tomographic inversion. Characterises the local isotopic
        fuel mix in the plasma as a function of radius and time.
      kind: llm
- name: efficiency_of_filter
  kind: scalar
  status: active
  description: Dimensionless probability, bounded from 0 to 1, that a photon incident
    on a diagnostic filter produces a registered detection event, combining filter
    transmission, relay optics throughput, detector quantum efficiency, and all other
    losses in the detection chain.
  documentation: 'The efficiency of a diagnostic filter is the overall probability
    that a photon arriving at the filter aperture is ultimately registered as a detection
    event, accounting for every source of attenuation and conversion loss between
    the optical input and the readout electronics. Contributing factors include the
    wavelength-dependent transmission of the filter material, the geometric and optical
    throughput of any relay optics, and the quantum efficiency of the detector element.
    The quantity is dimensionless and bounded between 0 and 1, where 0 indicates complete
    attenuation or detector insensitivity and 1 indicates perfect detection of every
    incident photon.


    The spectrally resolved form is given by the [spectral efficiency of filter](name:spectral_efficiency_of_filter),
    which tracks detection probability as a function of wavelength across the filter
    passband and is the primary input for absolute photon-flux calibrations. A band-integrated
    effective efficiency may be derived by weighting the spectral form by the incident
    spectrum and integrating over the filter passband. The [absorptivity of filter](name:absorptivity_of_filter)
    isolates the photon-absorption component of the loss budget, while [efficiency
    of spectrometer channel](name:efficiency_of_spectrometer_channel) provides the
    analogous combined throughput descriptor for a full dispersive detection channel.


    This efficiency is determined experimentally through absolute photometric calibration
    using a source of known spectral irradiance, or assembled from independently measured
    component efficiencies across the detection chain.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_efficiency_of_filter
  - name:absorptivity_of_filter
  - name:efficiency_of_spectrometer_channel
- name: efficiency_of_spectrometer_channel
  kind: scalar
  status: active
  description: Efficiency of a spectrometer channel is a bounded dimensionless fraction,
    between zero and one, of photons already within the channel acceptance that reach
    the active detector area after optical-path losses.
  documentation: 'Efficiency of a spectrometer channel is a bounded dimensionless
    fraction, between zero and one, of photons already within the channel''s geometrical
    and spectral acceptance that reach the active detector area after propagation
    through the channel optical path. It characterizes the channel efficiency after
    acceptance, not the acceptance itself.


    The channel efficiency is defined by the ratio of photon rates for the same accepted
    spectral interval:


    $$

    \eta_\mathrm{ch} = \frac{\dot{N}_\mathrm{det}}{\dot{N}_\mathrm{acc}}

    $$


    where $\dot{N}_\mathrm{det}$ is the photon rate arriving at the active detector
    area and $\dot{N}_\mathrm{acc}$ is the photon rate within the channel acceptance
    before optical-path losses. Both rates are expressed in the same units, for example
    photons per second for an interval-integrated rate or photons per second per meter
    for a wavelength-resolved rate.


    This quantity is distinct from [spectral etendue of a spectrometer channel](name:spectral_etendue_of_spectrometer_channel),
    which defines the accepted geometrical and spectral phase-space extent rather
    than a loss probability. It excludes [detector quantum efficiency], detector gain,
    and electronic registration probability after photons reach the active detector
    area. Component filter properties such as [absorptivity of a filter](name:absorptivity_of_filter)
    and [transmissivity of a filter] describe individual optical elements; they may
    contribute to, but are not synonyms for, the aggregate spectrometer-channel efficiency.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_etendue_of_spectrometer_channel
  - name:absorptivity_of_filter
  sources:
  - dd_path: spectrometer_visible/channel/light_collection_efficiencies/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/spectrometer_visible.html#spectrometer_visible-channel-light_collection_efficiencies-values
    dd_documentation:
