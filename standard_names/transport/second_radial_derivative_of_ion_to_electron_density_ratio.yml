name: second_radial_derivative_of_ion_to_electron_density_ratio
status: draft
cocos_transformation_type: one_like
description: Second derivative of the total-ion to electron density ratio with respect
  to the normalized toroidal flux coordinate $\rho_{\mathrm{tor,norm}}$.
documentation: "This quantity is defined as $d^2 (n_i^{\\mathrm{tot}} / n_e) / d\\\
  rho_{\\mathrm{tor,norm}}^2$, where $n_i^{\\mathrm{tot}}$ is the sum of all ion species\
  \ densities over species and charge states (thermal + non-thermal) and $n_e$ is\
  \ the electron number density. The ratio $n_i^{\\mathrm{tot}} / n_e$ deviates from\
  \ unity in plasmas with significant impurity content or non-thermal populations;\
  \ its second radial derivative captures the curvature of this departure and feeds\
  \ into higher-order transport-solver discretization. In a pure hydrogen plasma,\
  \ $n_i^{\\mathrm{tot}} / n_e = 1$ everywhere, so all derivatives vanish. For impurity-seeded\
  \ scenarios (e.g., nitrogen or neon injection), the ratio can vary by 5\u201320%\
  \ across the pedestal, yielding non-trivial second derivatives. See `ion_to_electron_density_ratio_radial_derivative`\
  \ for the first derivative and `electron_number_density` for the denominator profile."
