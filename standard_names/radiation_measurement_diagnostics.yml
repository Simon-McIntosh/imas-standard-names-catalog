- name: ratio_of_volume_averaged_krypton_number_density_to_maximum_electron_number_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of the volume-averaged total krypton number density
    to the maximum electron number density. It is a global scalar measure of krypton
    impurity concentration normalized to the peak electron number density.
  documentation: 'This quantity is the total krypton number density averaged over
    the plasma volume, divided by the maximum electron number density in the same
    plasma. It measures the global krypton inventory relative to the peak electron-density
    scale, rather than a local krypton abundance at the position of peak density.


    The ratio is defined using the volume average of the sum over krypton charge states:


    $$

    F_{\mathrm{Kr}} = \frac{\langle n_{\mathrm{Kr}} \rangle_V}{\max_{\mathbf{x}\in
    V_p} n_e(\mathbf{x})}, \qquad \langle n_{\mathrm{Kr}} \rangle_V = \frac{1}{V_p}\int_{V_p}\sum_q
    n_{\mathrm{Kr},q}(\mathbf{x})\,dV

    $$


    where $V_p$ is the plasma volume, $n_{\mathrm{Kr},q}$ is the krypton number density
    in charge state $q$, $\sum_q n_{\mathrm{Kr},q}$ is the total krypton number density
    in m^-3, and $n_e$ is the electron number density in m^-3. The resulting ratio
    is dimensionless.


    In practice, the krypton density is inferred from impurity spectroscopy, bolometry,
    soft-x-ray emission, and collisional-radiative modeling, combined with an equilibrium
    estimate of the plasma volume. The maximum electron number density is obtained
    from electron-density diagnostics such as interferometry, Thomson scattering,
    or reflectometry, depending on the available measurements and reconstruction method.


    Typical values for krypton-seeded plasmas are about $10^{-6}-10^{-4}$ for trace
    impurity operation and may approach $10^{-3}$ when krypton radiation is intentionally
    strong. The value depends on fueling, impurity transport, charge-state distribution,
    plasma volume, and the degree of central density peaking.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:summary/composition/krypton/value
    dd_path: summary/composition/krypton/value
    status: composed
- name: reference_calibration_wavelength_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Zero-pixel wavelength intercept of the linear pixel-to-wavelength dispersion
    mapping used to calibrate a spectrometer channel.
  documentation: "This parameter defines the wavelength assigned to pixel index zero\
    \ in the linear dispersion model for a spectrometer channel. The pixel-to-wavelength\
    \ mapping takes the form:\n\n$$\n\\lambda(k) = k \\cdot g + \\lambda_0\n$$\n\n\
    where $\\lambda(k)$ is the wavelength at pixel $k$, $g$ is the dispersion gain\
    \ (wavelength increment per pixel), and $\\lambda_0$ is this reference calibration\
    \ wavelength \u2014 the zero-pixel intercept. Together with the gain, $\\lambda_0$\
    \ fully specifies the linear wavelength axis, enabling conversion of raw detector\
    \ pixel indices to physical wavelengths.\n\nThe offset is determined during spectrometer\
    \ wavelength calibration by fitting the pixel positions of precisely known emission\
    \ lines to the linear dispersion model; the intercept $\\lambda_0$ is extracted\
    \ from the resulting least-squares fit. This procedure applies to both UV and\
    \ visible grating spectrometers used in plasma spectroscopy diagnostics.\n\nTypical\
    \ values lie in the range $1 \\times 10^{-7}$ to $8 \\times 10^{-7}$ m, spanning\
    \ the UV-to-visible operational range of fusion spectroscopy systems. This intercept\
    \ is the complement to the dispersion gain encoded in calibration_wavelength_of_spectrometer_channel;\
    \ together they constitute the complete linear wavelength calibration. Absolute\
    \ photon spectral radiance is subsequently obtained using the [spectral_calibration_factor_of_spectrometer](name:spectral_calibration_factor_of_spectrometer)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_calibration_factor_of_spectrometer
  sources:
  - id: dd:spectrometer_uv/channel/wavelength_calibration/offset
    dd_path: spectrometer_uv/channel/wavelength_calibration/offset
    status: attached
  - id: dd:spectrometer_visible/channel/grating_spectrometer/wavelength_calibration/offset
    dd_path: spectrometer_visible/channel/grating_spectrometer/wavelength_calibration/offset
    status: attached
- name: reference_wavelength_of_spectrometer_channel
  kind: scalar
  status: draft
  description: Reference wavelength of a spectrometer channel is the wavelength at
    which that channel's spectral instrument function has maximum response. It is
    a peak-position parameter of the channel response, distinct from a calibration
    reference wavelength and from the wavelength of a physical spectral line.
  documentation: 'Reference wavelength of a spectrometer channel is the wavelength
    coordinate at which that channel''s spectral instrument function reaches its maximum
    response. It is an instrument-response property for the channel, not the wavelength
    of an observed spectral line and not the reference wavelength used to define or
    check a wavelength calibration. As a wavelength, it is a non-negative spectral
    coordinate rather than a signed direction-dependent quantity.


    Let $G_c(\lambda)$ denote the spectral instrument function of channel $c$ as a
    function of wavelength $\lambda$. The reference wavelength $\lambda_{\mathrm{ref},c}$
    is the peak location:


    $$

    \lambda_{\mathrm{ref},c} = \operatorname*{arg\,max}_{\lambda} G_c(\lambda)

    $$


    where $G_c$ may be normalized or unnormalized, because the peak position is unchanged
    by an overall response scaling. If the response model has multiple local maxima,
    the reference wavelength denotes the designated principal response peak used to
    define the channel center.


    In practice, $\lambda_{\mathrm{ref},c}$ is obtained from wavelength calibration
    measurements, an optical or diffraction geometry model, or spectral fitting of
    known features to a channel response model. For crystal X-ray spectrometers, the
    nominal wavelength is constrained by the Bragg relation $n\lambda = 2d\sin\theta_B$,
    where $d$ is the lattice-plane spacing, $\theta_B$ is the Bragg angle, and $n$
    is the diffraction order. The related [spectral_width_of_spectrometer_channel](name:spectral_width_of_spectrometer_channel)
    describes response broadening, while spectral_instrument_function_of_spectrometer_channel
    describes the full wavelength-dependent response shape.


    This quantity should be distinguished from [reference_calibration_wavelength](name:reference_calibration_wavelength_of_spectrometer_channel),
    which is a fiducial wavelength used to establish or validate a wavelength scale,
    and from [wavelength_of_spectral_line](name:wavelength_of_spectral_line), which
    is a physical photon wavelength associated with an atomic, molecular, or ionic
    transition.


    Typical values depend on the spectral band: crystal X-ray spectrometer channels
    commonly lie in the range $10^{-11}$-$10^{-9}$ m, with many impurity-line measurements
    near $10^{-10}$-$10^{-9}$ m, while ultraviolet and visible spectrometer channels
    are typically about $10^{-7}$-$10^{-6}$ m.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_width_of_spectrometer_channel
  - name:reference_calibration_wavelength_of_spectrometer_channel
  - name:wavelength_of_spectral_line
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/bin/instrument_function/centre
    dd_path: spectrometer_x_ray_crystal/channel/bin/instrument_function/centre
    status: attached
