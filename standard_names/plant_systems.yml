- name: accumulated_lithium_prefill_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of lithium introduced by gas
    injection during plasma prefill, with three count units assigned to each lithium
    atom.
  documentation: 'This quantity is the accumulated lithium inventory delivered by
    gas injection during the plasma prefill phase, expressed as equivalent electrons
    rather than as a count of free plasma electrons.


    The defining relation is:


    $$

    N_{e,\mathrm{Li}}^{\mathrm{prefill}} = Z_{\mathrm{Li}} N_{\mathrm{Li}}^{\mathrm{prefill}}

    $$


    where $N_{e,\mathrm{Li}}^{\mathrm{prefill}}$ is the equivalent-electron inventory,
    $N_{\mathrm{Li}}^{\mathrm{prefill}}$ is the accumulated number of injected lithium
    atoms, and $Z_{\mathrm{Li}}=3$ is lithium''s atomic number.


    The quantity includes only lithium introduced during prefill by gas injection.
    It is distinct from the post-breakdown [accumulated lithium count](name:accumulated_lithium_count),
    while [lithium count](name:lithium_count) defines the corresponding equivalent-electron
    convention without the prefill and accumulation-locus restriction.'
  unit: '1'
