- name: area_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Physical cross-sectional area of the aperture of the antenna that emits
    the probing millimeter-wave beam in a reflectometer diagnostic. This is the geometric
    area of the antenna aperture and does not include beam or coupling efficiency
    factors.
  documentation: The physical cross-sectional area of the antenna aperture determines
    the spatial resolution and power handling of the probing millimeter-wave beam
    in a reflectometer system. For a typical horn antenna, the aperture area is approximately
    the product of the horn's width and height at the radiating face, while for a
    lens-coupled antenna it is the clear aperture area of the lens. Typical values
    range from $10^{-4}\ \mathrm{m}^2$ (for small waveguide-fed horns) to $10^{-2}\
    \mathrm{m}^2$ (for large imaging arrays). This area is a positive scalar; it is
    distinct from the effective area, which incorporates antenna gain and ohmic losses.
    In IMAS, the antenna surface is stored in the reflectometer_profile data structure
    as a 2-D surface geometry, and the area is derived from that geometry.
  unit: m^2
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:area_of_diagnostic_aperture
  sources:
