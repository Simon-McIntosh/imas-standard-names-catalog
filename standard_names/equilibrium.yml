- name: flux_surface_averaged_inverse_of_major_radius
  kind: scalar
  status: active
  description: Flux-surface average of reciprocal major radius, providing a geometric
    equilibrium coefficient for toroidal geometry in flux-coordinate equations.
  documentation: 'This quantity is the geometric average of the reciprocal major radius
    over a complete magnetic flux surface. It is an equilibrium metric coefficient
    independent of plasma species, population, magnetic-field component, and physical
    transport process.


    For a magnetic flux surface identified by the label $\psi$, the defining flux-surface
    average is:


    $$

    g_{1/R}(\psi) =

    \left\langle \frac{1}{R} \right\rangle_\psi =

    \frac{\displaystyle\oint_{\mathcal{S}(\psi)}

    \frac{dS}{|\nabla\psi|}\,\frac{1}{R}}

    {\displaystyle\oint_{\mathcal{S}(\psi)}

    \frac{dS}{|\nabla\psi|}}

    $$


    Here $g_{1/R}$ denotes the metric coefficient, $R$ is the major-radius coordinate,
    $\psi$ is the magnetic flux-surface label, $\mathcal{S}(\psi)$ is the corresponding
    closed magnetic flux surface, $dS$ is its surface-area element, and $\nabla\psi$
    is the spatial gradient of the flux-surface label. The coordinate $R$ belongs
    to the right-handed cylindrical $(R,\phi,Z)$ frame, where $\phi$ is the toroidal
    angle and $Z$ is the vertical coordinate.


    The aggregation is over the entire closed flux surface using the flux-surface
    weighting shown in the defining relation; this is not the local reciprocal radius
    at a point. The quantity is distinct from the flux-surface average of reciprocal
    squared major radius, [flux-surface-averaged inverse square of major radius](name:flux_surface_averaged_inverse_of_square_of_major_radius).


    It is the flux-surface-averaged specialization of [inverse major radius](name:inverse_of_major_radius):
    the averaging operator is applied to the local reciprocal-major-radius quantity
    without introducing a species, field-component, or process restriction.'
  unit: m^-1
