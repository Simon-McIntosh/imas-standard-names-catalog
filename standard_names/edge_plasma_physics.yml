- name: gradient_of_electron_pressure
  kind: scalar
  status: active
  description: Algebraically signed slope of electron pressure with respect to normalized
    poloidal magnetic flux, evaluated where its absolute steepness is greatest in
    the H-mode pedestal.
  documentation: 'This quantity is the local electron-pressure slope at the H-mode
    pedestal location where the magnitude of the slope is greatest. It is distinct
    from the [electron pressure](name:electron_pressure) itself and from the pressure
    slope evaluated specifically at the pedestal top.


    $$

    G_{e,*} = \left.\frac{\partial p_e}{\partial \psi_N}\right|_{\psi_N=\psi_*},\qquad
    \psi_* = \underset{\psi_N\,\mathrm{in\ the\ pedestal}}{\operatorname{arg\,max}}\left|\frac{\partial
    p_e}{\partial \psi_N}\right|

    $$


    Here $p_e$ is electron pressure, $\psi_N$ is the normalized poloidal magnetic-flux
    coordinate increasing from the magnetic axis toward the plasma boundary, and $\psi_*$
    is the selected pedestal location. The selection is based on absolute steepness,
    while $G_{e,*}$ retains the algebraic sign; it therefore differs from [derivative
    with respect to normalized poloidal flux coordinate of electron pressure at pedestal
    top](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top).


    Sign convention: Positive when electron pressure increases toward increasing normalized
    poloidal magnetic flux.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure
  - name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top
  arguments:
  - name: electron_pressure
