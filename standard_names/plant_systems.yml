- name: deposited_thermal_power_of_breeding_blanket_module
  kind: scalar
  status: draft
  description: Total thermal power deposited into a single tritium breeding blanket
    module from all nuclear and radiative heating mechanisms, representing the gross
    heat load before coolant extraction.
  documentation: "The deposited thermal power of a breeding blanket module is the\
    \ instantaneous rate at which energy from all sources \u2014 primarily neutron\
    \ slowing-down, gamma heating, and charged-particle deposition \u2014 is converted\
    \ to heat within the module volume. It is related to the [neutron thermal power\
    \ of the module](name:neutron_thermal_power_of_breeding_blanket_module) and [neutron\
    \ heating power](name:neutron_heating_power_of_breeding_blanket_module) by the\
    \ addition of non-neutron radiative contributions, satisfying $P_\\mathrm{dep}\
    \ = P_\\mathrm{neutron} + P_\\mathrm{\\gamma} + P_\\mathrm{other}$, where each\
    \ term is in W. The deposited power sets an upper bound on the [extracted thermal\
    \ power of the breeding blanket module](name:extracted_thermal_power_of_breeding_blanket_module),\
    \ with the difference accounting for in-module thermal storage and structural\
    \ losses. Typical values range from tens to hundreds of megawatts per module in\
    \ reactor-scale designs, depending on blanket geometry, neutron wall loading,\
    \ and breeder material choice. This quantity integrates over the full module boundary\
    \ and is distinguished from the [thermal power load of the breeding blanket](name:thermal_power_load_of_breeding_blanket),\
    \ which applies to the blanket assembly as a whole rather than to individual modules."
  unit: W
  physics_domain: plant_systems
  links:
  - name:neutron_thermal_power_of_breeding_blanket_module
  - name:neutron_heating_power_of_breeding_blanket_module
  - name:extracted_thermal_power_of_breeding_blanket_module
  - name:thermal_power_load_of_breeding_blanket
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/heat_load_breeder
    dd_path: balance_of_plant/power_plant/heat_load_breeder
    status: composed
- name: electrical_power_consumption_of_plant_subsystem
  kind: scalar
  status: draft
  description: Electrical power consumed by an individual subsystem within the plant
    electric operation network, measured at the subsystem electrical boundary. Positive
    values indicate net consumption (load); negative values indicate net generation
    (source). Each subsystem's contribution aggregates to the parent system and ultimately
    to the total plant electrical power consumption.
  documentation: "The electrical power consumption of a single subsystem within the\
    \ plant balance-of-plant (BoP) electric operation network. A subsystem is a discrete\
    \ functional unit nested within a plant system (e.g., a cooling pump nested within\
    \ the cooling water system). This quantity is measured at the subsystem's electrical\
    \ interface boundary and represents the net power drawn from or supplied to the\
    \ local electrical bus.\n\nThe consumption convention follows:\n$$P_{\\mathrm{subsystem}}\
    \ > 0 \\quad \\Rightarrow \\quad \\text{net load (consuming power)}$$\n$$P_{\\\
    mathrm{subsystem}} < 0 \\quad \\Rightarrow \\quad \\text{net source (generating\
    \ or recovering power)}$$\n\nThe subsystem powers aggregate hierarchically. For\
    \ a plant system $k$ containing $N_k$ subsystems:\n$$P_{\\mathrm{system},k} =\
    \ \\sum_{i=1}^{N_k} P_{\\mathrm{subsystem},k,i}$$\nand the total plant electrical\
    \ consumption is:\n$$P_{\\mathrm{total}} = \\sum_{k} P_{\\mathrm{system},k} =\
    \ \\sum_{k}\\sum_{i} P_{\\mathrm{subsystem},k,i}$$\n\nTypical magnitudes vary\
    \ widely by subsystem type: auxiliary cooling pumps may draw $10^4$\u2013$10^6$\
    \ W, while large cryogenic compressor subsystems can reach $10^7$ W. Subsystems\
    \ capable of energy recovery (e.g., regenerative drives, heat-to-power converters)\
    \ may yield negative values during partial recovery operation.\n\nSign convention:\
    \ Positive when the subsystem draws net electrical power from the plant bus (net\
    \ consumption); negative when the subsystem returns net electrical power to the\
    \ plant bus (net generation or recovery)."
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_plant_electrical_power_consumption
  - name:plant_subsystem_electrical_power
  - name:electrical_power_consumption_of_plant_system
  - name:net_electric_power_output
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_electric_plant_operation/system/subsystem/power
    dd_path: balance_of_plant/power_electric_plant_operation/system/subsystem/power
    status: composed
- name: electrical_power_consumption_of_plant_system
  kind: scalar
  status: draft
  description: Electrical power consumed by a plant system in the balance-of-plant
    electric operation accounting. Defined at the system boundary as net power drawn
    from the facility electrical network; positive values indicate net consumption.
    A negative value indicates the system delivers net electrical power back to the
    facility bus.
  documentation: 'The electrical power consumption of a plant system, $P_\mathrm{sys}$,
    is the net electrical power exchanged at the boundary between the plant system
    and the facility electrical distribution network. It enters the balance-of-plant
    electric power accounting as a signed load term:


    $$P_\mathrm{total} = \sum_i P_{\mathrm{sys},i}$$


    where the sum runs over all plant systems contributing to the facility power budget.


    Sign convention: Positive when the system draws net electrical power from the
    facility network (net consumption). Negative when the system delivers net electrical
    power to the facility network (net generation or recovery).


    Typical values range from a few kilowatts for small auxiliary systems to tens
    of megawatts for large cryogenic, pumping, or heating systems in a fusion facility.
    The quantity is defined at the system boundary and does not resolve the internal
    distribution of power among subsystems; see `electrical_power_consumption_of_plant_subsystem`
    for subsystem-level decomposition.


    This quantity is used in overall facility power balance assessments, including
    the calculation of the recirculating power fraction and net electric output.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_plant_electrical_power_consumption
  - name:plant_subsystem_electrical_power
  - name:net_electric_power_output
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_electric_plant_operation/system/power
    dd_path: balance_of_plant/power_electric_plant_operation/system/power
    status: composed
- name: fragmentation_gas_flow_rate_of_shattered_pellet_injector
  kind: scalar
  status: draft
  description: Particle flow rate of fragmentation gas at the shattered pellet injector
    exit, defined as the number of gas particles passing the injector exit boundary
    per unit time. This is a species-summed scalar quantity evaluated at the exit
    plane, independent of the inference method used to determine it.
  documentation: "The fragmentation gas flow rate $\\dot{N}_{\\rm frag}$ is defined\
    \ as\n\n$$\\dot{N}_{\\rm frag} = \\frac{dN}{dt}$$\n\nwhere $N$ is the total number\
    \ of fragmentation gas particles (summed over all constituent species if a gas\
    \ mixture is used) passing the injector exit boundary per unit time. The quantity\
    \ is evaluated at the exit plane of the injector and is independent of the method\
    \ by which it is inferred or measured.\n\nThe fragmentation gas is injected to\
    \ promote mechanical breakup of the pellet at the shattering target; however,\
    \ $\\dot{N}_{\\rm frag}$ characterizes only the gas supply at the exit plane and\
    \ does not by itself determine the fragmentation outcome, which depends on the\
    \ full injector\u2013target interaction.\n\nTypical values range from $10^{21}$\
    \ to $10^{23}$ s$^{-1}$ depending on injector design, pellet size, and required\
    \ fragment size distribution.\n\nSign convention: Positive when gas flows out\
    \ of the injector exit in the intended direction of pellet travel.\n\nSee also:\
    \ `fragmentation_gas_pressure_of_shattered_pellet_injector` for the upstream pressure\
    \ driving this flow, `propellant_gas_flow_rate_of_shattered_pellet_injector` for\
    \ the analogous quantity for the propellant gas, and `pellet_flow_rate_of_shattered_pellet_injector`\
    \ for the pellet delivery rate."
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:propellant_gas_flow_rate
  - name:fragmentation_gas_particle_flow_rate_of_shattered_pellet_injector
  - name:shattered_pellet_gas_flow_rate
  constraints: []
  sources:
  - id: dd:spi/injector/fragmentation_gas/flow_rate
    dd_path: spi/injector/fragmentation_gas/flow_rate
    status: composed
- name: major_radius_of_end_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the exit (end) position of a gas injection
    or pellet injector pipe in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The major radius $R$ locates the endpoint of a gas injection pipe\
    \ or pellet/shattered-pellet injector outlet in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is the perpendicular distance from the machine symmetry\
    \ axis. This geometric coordinate is essential for modeling the spatial origin\
    \ of injected gas or pellet fragments entering the plasma, and is used alongside\
    \ the companion [vertical coordinate](name:vertical_coordinate_of_end_point) to\
    \ fully specify the poloidal position of the injection point. Typical values range\
    \ from ~0.5 m (inboard wall injection) to ~3\u20136 m (outboard or midplane injection)\
    \ depending on machine size and injector geometry. The coordinate is fixed hardware\
    \ geometry, obtained from engineering drawings or optical survey of the installed\
    \ injector assembly, and does not vary during a plasma discharge. It is analogous\
    \ to the radial position used for other geometric boundary references such as\
    \ [major radius of active limiter point](name:major_radius_of_active_limiter_point)\
    \ and [major radius of gap reference point](name:major_radius_of_gap_reference_point).\n\
    \nSign convention: Positive when $R$ is measured outward from the machine symmetry\
    \ axis, i.e. for all physically realizable positions $R > 0$."
  unit: m
  physics_domain: plant_systems
  links:
  - name:vertical_coordinate_of_end_point
  - name:major_radius_of_active_limiter_point
  - name:major_radius_of_gap_reference_point
  constraints: []
  sources:
  - id: dd:gas_injection/pipe/exit_position/r
    dd_path: gas_injection/pipe/exit_position/r
    status: composed
- name: maximum_gas_valve_flow_rate
  kind: scalar
  status: draft
  description: Upper operational bound on the throughput of a gas injection valve,
    specifying the highest flow rate at which the valve can reliably deliver gas for
    fueling or impurity seeding.
  documentation: "The maximum gas valve flow rate defines the design or control upper\
    \ limit on the throughput of a gas injection valve, measured in units of pressure\
    \ times volume per unit time ($\\dot{Q}_{\\max}$, in Pa\xB7m\xB3\xB7s\u207B\xB9\
    ). This unit convention reflects the product of the volumetric flow rate $dV/dt$\
    \ and the gas pressure $P$, making the quantity proportional to the particle flux\
    \ via the ideal gas relation $\\dot{N} = \\dot{Q} / (k_B T)$, where $k_B$ is the\
    \ Boltzmann constant and $T$ is the gas temperature. In practice, gas injection\
    \ valves are used for plasma fueling, impurity seeding, and disruption mitigation;\
    \ the maximum flow rate is a hardware-level constraint set by valve geometry,\
    \ actuator speed, and upstream supply pressure. Typical values for fueling valves\
    \ on large tokamaks range from $10^{-2}$ to $10^{0}$ Pa\xB7m\xB3\xB7s\u207B\xB9\
    , depending on valve type and application. The counterpart lower bound is given\
    \ by [minimum gas valve flow rate](name:minimum_gas_valve_flow_rate), and the\
    \ instantaneous delivered composition can be characterized by [injected gas species\
    \ molar fraction](name:injected_gas_species_molar_fraction)."
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:minimum_gas_valve_flow_rate
  - name:injected_gas_species_molar_fraction
  constraints: []
  sources:
  - id: dd:gas_injection/pipe/valve/flow_rate_max
    dd_path: gas_injection/pipe/valve/flow_rate_max
    status: composed
  - id: dd:gas_injection/valve/flow_rate_max
    dd_path: gas_injection/valve/flow_rate_max
    status: composed
- name: mechanical_power_of_plant_component
  kind: scalar
  status: draft
  description: Mechanical (shaft) power exchanged at a balance-of-plant component
    port, with positive values indicating power flowing into the system and negative
    values indicating power flowing out.
  documentation: "Mechanical shaft power $P_\\mathrm{mech}$ quantifies the rate of\
    \ work transmitted across the port boundary of a balance-of-plant component \u2014\
    \ for example, turbine shafts, pumps, compressors, or fans. It is defined by $P_\\\
    mathrm{mech} = \\tau \\omega$, where $\\tau$ is the applied torque and $\\omega$\
    \ is the angular velocity of the rotating element. This power contributes to the\
    \ overall plant energy balance alongside [thermal_power_of_plant_component](name:thermal_power_of_plant_component)\
    \ and [plant_system_electrical_power](name:plant_system_electrical_power). In\
    \ balance-of-plant analysis, typical pump or compressor shaft powers range from\
    \ tens of kilowatts to tens of megawatts depending on coolant flow rate and system\
    \ pressure; turbine shaft outputs can reach hundreds of megawatts in large power-conversion\
    \ cycles. The quantity is evaluated at the component port boundary, consistent\
    \ with standard thermodynamic control-volume accounting, and contributes to plant-level\
    \ aggregates such as [net_electric_power_output](name:net_electric_power_output)\
    \ and [total_plant_electrical_power_consumption](name:total_plant_electrical_power_consumption).\n\
    \nSign convention: Positive when shaft work is delivered into the component (e.g.,\
    \ power driving a pump or compressor), and negative when shaft work is extracted\
    \ from the component (e.g., power output from a turbine)."
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_of_plant_component
  - name:plant_system_electrical_power
  - name:net_electric_power_output
  - name:total_plant_electrical_power_consumption
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/system/component/port/power_mechanical
    dd_path: balance_of_plant/power_plant/system/component/port/power_mechanical
    status: composed
- name: net_electric_power_output
  kind: scalar
  status: draft
  description: Net electrical power delivered to the grid by the fusion power plant,
    equal to gross turbine output minus all internal auxiliary and parasitic electrical
    consumption.
  documentation: "The net electric power output $P_\\mathrm{net}$ quantifies the usable\
    \ electrical energy delivered to the external grid per unit time after accounting\
    \ for all internal plant loads. It is defined by $P_\\mathrm{net} = P_\\mathrm{gross}\
    \ - P_\\mathrm{aux}$, where $P_\\mathrm{gross}$ is the gross electrical output\
    \ of the turbine-generator set and $P_\\mathrm{aux}$ is the [total plant electrical\
    \ power consumption](name:total_plant_electrical_power_consumption) including\
    \ pumps, compressors, cryogenic systems, and all balance-of-plant auxiliary loads.\
    \ The net output sets the commercial electricity yield and, together with the\
    \ [fusion thermal power input](name:fusion_thermal_power_input) $P_\\mathrm{fusion}$,\
    \ determines the overall plant efficiency $\\eta = P_\\mathrm{net} / P_\\mathrm{fusion}$.\
    \ For a demonstration-scale tokamak plant, projected $P_\\mathrm{net}$ values\
    \ range from 100\u2013500 MW; current experimental devices operate at negative\
    \ net output (i.e. $P_\\mathrm{net} < 0$) because fusion thermal power does not\
    \ yet exceed auxiliary consumption. This quantity is the primary figure of merit\
    \ for assessing the economic viability of a fusion power plant and is closely\
    \ related to individual system-level loads tracked via [plant system electrical\
    \ power](name:plant_system_electrical_power)."
  unit: W
  physics_domain: plant_systems
  links:
  - name:total_plant_electrical_power_consumption
  - name:fusion_thermal_power_input
  - name:plant_system_electrical_power
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_electricity_net
    dd_path: balance_of_plant/power_electricity_net
    status: attached
  - id: dd:balance_of_plant/power_plant/power_electric_generated
    dd_path: balance_of_plant/power_plant/power_electric_generated
    status: composed
- name: normalized_propellant_gas_molecule_count_of_pellet
  kind: scalar
  status: draft
  description: Ratio of the number of propellant gas molecules entering the vacuum
    vessel during a pellet launch to the total number of molecules comprising the
    pellet.
  documentation: "The normalized propellant gas molecule count is defined as\n\n$$\\\
    tilde{N}_{\\mathrm{prop}} \\;=\\; \\frac{N_{\\mathrm{prop}}}{N_{\\mathrm{pellet}}}$$\n\
    \nwhere\n\n- $N_{\\mathrm{prop}}$ is the number of propellant gas molecules that\
    \ cross the vacuum-vessel boundary and enter the plasma chamber during a single\
    \ pellet launch event,\n- $N_{\\mathrm{pellet}}$ is the total number of molecules\
    \ constituting the intact pellet prior to injection (the normalization reference).\n\
    \nBoth quantities are dimensionless molecule counts; their ratio is therefore\
    \ also dimensionless (unit 1).\n\n**Scope of $N_{\\mathrm{prop}}$:** Only those\
    \ propellant molecules that pass beyond the injector-to-vessel interface are counted.\
    \ Propellant that is differentially pumped at the guide-tube throat or within\
    \ the injector assembly itself is excluded. The relevant boundary is the last\
    \ vacuum seal separating the injection line from the confined plasma volume.\n\
    \n**Typical values:** In well-optimized gas-gun and centrifuge injectors, $\\\
    tilde{N}_{\\mathrm{prop}}$ is of order $10^{-2}$\u2013$10^{-1}$. Values approaching\
    \ or exceeding unity indicate that propellant molecule injection is comparable\
    \ to or larger than the pellet molecule inventory; such conditions are undesirable\
    \ because the additional neutral gas load can degrade fueling efficiency and complicate\
    \ particle-balance analysis.\n\n**Physical context:** The propellant gas (commonly\
    \ deuterium, hydrogen, or helium) accelerates the frozen pellet through the guide\
    \ tube. Knowledge of $\\tilde{N}_{\\mathrm{prop}}$ is essential for accurate particle\
    \ accounting in fueling studies, because the propellant constitutes an uncontrolled\
    \ gas source whose magnitude, species composition, and temporal profile differ\
    \ from the pellet ablation source.\n\nThe quantity is non-negative by construction\
    \ ($\\tilde{N}_{\\mathrm{prop}} \\geq 0$)."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:propellant_gas_molecule_count_normalized_to_pellet
  - name:propellant_gas_molecule_count_per_pellet
  - name:normalized_molecule_count_of_propellant_gas
  - name:propellant_gas_particle_flow_rate_of_shattered_pellet_injector
  constraints: []
  sources:
  - id: dd:pellets/time_slice/pellet/propellant_gas/molecules_n
    dd_path: pellets/time_slice/pellet/propellant_gas/molecules_n
    status: composed
- name: pellet_ablation_rate_along_pellet_path
  kind: scalar
  status: draft
  description: Number of electrons released per unit time from an ablating pellet,
    evaluated at each point along its trajectory through the plasma. This quantity
    is intrinsically non-negative and characterizes the local deposition of particles
    as the pellet travels along its path.
  documentation: "The pellet ablation rate $\\dot{N}_e(s)$ is defined as the number\
    \ of electrons liberated from the pellet surface per unit time at a given point\
    \ along the pellet trajectory, where $s$ is a scalar path-length coordinate measured\
    \ in meters along the pellet trajectory from the injection point. Formally,\n\n\
    $$\\dot{N}_e(s) = \\frac{dN_e}{dt}\\bigg|_s$$\n\nwhere $N_e$ is the cumulative\
    \ number of electrons released up to position $s$. Because ablation is a mass-loss\
    \ process driven by the incident heat flux from the surrounding plasma, $\\dot{N}_e(s)\
    \ \\geq 0$ everywhere along the path; there is no sign ambiguity.\n\nPhysical\
    \ intuition: The ablation rate peaks near the region of maximum heat flux along\
    \ the trajectory \u2014 typically as the pellet penetrates into hotter, denser\
    \ plasma. Neutral and ionized ablation products subsequently expand radially and\
    \ are assimilated into the background plasma as an electron particle source. The\
    \ path-parameterized form $\\dot{N}_e(s)$ retains full spatial resolution along\
    \ the trajectory and is used to compute integrated particle deposition profiles\
    \ on flux surfaces.\n\nThe trajectory is described in the cylindrical $(R, \\\
    phi, Z)$ frame, where $R$ is the major radius from the machine symmetry axis,\
    \ $\\phi$ is the toroidal angle increasing counter-clockwise when viewed from\
    \ above $+\\hat{Z}$, and $Z$ is the vertical height. Typical peak values range\
    \ from $10^{21}$ to $10^{23}$ s$^{-1}$ for deuterium pellets of radius 1\u2013\
    4 mm in present-day tokamaks, depending on pellet size, injection velocity, and\
    \ local plasma parameters.\n\nThis quantity is evaluated by ablation models such\
    \ as the Neutral Gas Shielding (NGS) model or Parks\u2013Turnbull model, and may\
    \ also be inferred from pellet-cloud emission diagnostics."
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:total_neutron_emission_rate
  constraints: []
  sources:
  - id: dd:pellets/time_slice/pellet/path_profiles/ablation_rate
    dd_path: pellets/time_slice/pellet/path_profiles/ablation_rate
    status: composed
- name: radial_component_of_shattered_pellet_velocity
  kind: scalar
  status: draft
  description: Projection of the shattered pellet injector (SPI) pellet center-of-mass
    velocity onto the major-radius direction $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame, isolating the inward or outward radial motion of the pellet.
  documentation: "The radial velocity component $v_R$ is the $R$-projection of the\
    \ full pellet center-of-mass velocity vector described by [shattered_pellet_velocity](name:shattered_pellet_velocity),\
    \ decomposed as $v_R = \\mathbf{v} \\cdot \\hat{R}$, where $\\hat{R}$ points away\
    \ from the machine symmetry axis. In shattered pellet injection (SPI), the pellet\
    \ is fired from an injector port toward the plasma, so $v_R$ is typically negative\
    \ (inward) during the injection phase, with magnitudes on the order of 50\u2013\
    500 m s$^{-1}$ depending on the injector geometry and gas pressure. Together with\
    \ [toroidal_component_of_shattered_pellet_velocity](name:toroidal_component_of_shattered_pellet_velocity)\
    \ and the vertical component, it fully resolves the pellet trajectory in the cylindrical\
    \ $(R, \\phi, Z)$ frame. The radial component governs how quickly the pellet penetrates\
    \ toward the plasma core and directly affects the deposition profile of the ablated\
    \ material during a disruption mitigation event. It is inferred from high-speed\
    \ imaging or from injector ballistic models, and the pre-shattering speed magnitude\
    \ is related to [shattered_pellet_speed_before_shattering](name:shattered_pellet_speed_before_shattering).\n\
    \nSign convention: Positive when the pellet center-of-mass moves in the direction\
    \ of increasing major radius $R$, i.e., away from the machine symmetry axis."
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_velocity
  - name:toroidal_component_of_shattered_pellet_velocity
  - name:shattered_pellet_speed_before_shattering
  constraints: []
  arguments:
  - name: shattered_pellet_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - id: dd:spi/injector/pellet/velocity_r
    dd_path: spi/injector/pellet/velocity_r
    status: composed
- name: shattered_pellet_velocity_magnitude_at_shattering_position
  kind: scalar
  status: draft
  description: Scalar speed of the shattered pellet injector (SPI) pellet center of
    mass immediately before impact with the shattering target, equal to the Euclidean
    norm of the pellet velocity vector at that location.
  documentation: "The shattering speed $v_\\mathrm{shatter} = |\\mathbf{v}_\\mathrm{pellet}|$\
    \ is the Euclidean norm of the pellet center-of-mass velocity vector evaluated\
    \ at the shattering position \u2014 the point where the intact pellet strikes\
    \ the shattering target and fragments into a cloud of smaller pieces. This scalar\
    \ quantity sets the kinetic energy budget of the fragmentation event and strongly\
    \ influences the resulting fragment size distribution, fragment speed, and the\
    \ spatial spread of the debris cloud injected into the plasma. Typical values\
    \ for shattered pellet injection (SPI) systems lie in the range 100\u2013500 m\
    \ s$^{-1}$, depending on injector design and propellant gas pressure. It is related\
    \ to the full velocity vector [shattered_pellet_velocity](name:shattered_pellet_velocity),\
    \ whose radial and vertical projections are given by [radial_component_of_shattered_pellet_velocity](name:radial_component_of_shattered_pellet_velocity)\
    \ and [vertical_component_of_shattered_pellet_velocity](name:vertical_component_of_shattered_pellet_velocity)\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame; the magnitude described\
    \ here satisfies $v_\\mathrm{shatter}^2 = v_R^2 + v_Z^2 + v_\\phi^2$. In practice\
    \ it is determined from optical or laser time-of-flight diagnostics that track\
    \ the pellet position along the guide tube prior to impact.\n\nSign convention:\
    \ Positive when the pellet is moving toward the shattering target, i.e., the speed\
    \ is a non-negative definite scalar magnitude."
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_velocity
  - name:radial_component_of_shattered_pellet_velocity
  - name:vertical_component_of_shattered_pellet_velocity
  constraints: []
  arguments:
  - name: shattered_pellet_velocity_at_shattering_position
    operator: magnitude
    operator_kind: unary_postfix
  sources:
  - id: dd:spi/injector/pellet/velocity_shatter
    dd_path: spi/injector/pellet/velocity_shatter
    status: composed
- name: thermal_power_load_of_first_wall
  kind: scalar
  status: draft
  description: Total thermal power directed toward the first wall from the plasma,
    encompassing conducted and convected heat flux integrated over the first-wall
    surface. This instantaneous quantity represents the gross heat load on this plasma-facing
    component and is used in balance-of-plant energy accounting.
  documentation: 'The thermal power load of the first wall, $P_\mathrm{wall}$, is
    the instantaneous total power crossing the accounting boundary defined at the
    plasma-facing surface of the first wall, carried by conduction and convection.
    It does not include power deposited by volumetric radiation absorbed at the wall
    surface, which is tracked separately; this convention avoids double-counting in
    global power balance equations where radiated power $P_\mathrm{rad}$ is accounted
    for independently.


    In a simplified scrape-off layer (SOL) power balance, the power directed to the
    first wall and divertor satisfies


    $$P_\mathrm{heat} = P_\mathrm{wall} + P_\mathrm{divertor} + P_\mathrm{rad}$$


    where $P_\mathrm{heat}$ is the total heating power entering the SOL. The first-wall
    fraction $P_\mathrm{wall}$ depends on the magnetic geometry, the degree of outer-midplane
    versus inner-wall interaction, and limiter contact, and typically ranges from
    a few percent to several tens of percent of $P_\mathrm{heat}$ depending on machine
    configuration and operational scenario.


    This quantity is defined as an instantaneous value evaluated at a given time;
    time-averaged values should be clearly indicated at the analysis level and are
    not implied by this definition. The accounting boundary is the plasma-facing surface
    of the first-wall assembly, integrated over its full toroidal and poloidal extent.


    Sign convention: Positive when net thermal power flows from the plasma toward
    the first-wall surface.


    Typical values in present-day tokamaks range from $\sim10\,\mathrm{kW}$ to several
    $\mathrm{MW}$; in future high-power devices the first-wall heat load may reach
    tens of $\mathrm{MW}$ under specific operational conditions.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_load_of_divertor
  - name:deposited_thermal_power_of_breeding_blanket_module
  - name:thermal_power_of_plant_component
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/heat_load_wall
    dd_path: balance_of_plant/power_plant/heat_load_wall
    status: composed
- name: thermal_power_of_plant_component
  kind: scalar
  status: draft
  description: Heat transfer rate at a balance-of-plant component port, with positive
    values indicating power flowing into the system and negative values indicating
    power flowing out.
  documentation: "Thermal power at a plant component port quantifies the instantaneous\
    \ rate of heat transfer across the component boundary, $\\dot{Q} = dQ/dt$ where\
    \ $Q$ is the thermal energy exchanged. This is a signed quantity: power delivered\
    \ to the system (e.g., heat input from a heat exchanger source) is positive, while\
    \ power extracted from the system (e.g., heat rejection to a secondary loop or\
    \ cooling sink) is negative. In fusion balance-of-plant modeling, this quantity\
    \ appears at the ports of individual subsystem components \u2014 pumps, heat exchangers,\
    \ steam generators, condensers, and similar elements \u2014 and feeds directly\
    \ into the plant-level energy balance. Typical magnitudes range from kilowatts\
    \ for auxiliary components to hundreds of megawatts for primary heat exchangers\
    \ in a fusion power plant. It is complementary to [mechanical_power_of_plant_component](name:mechanical_power_of_plant_component),\
    \ which accounts for shaft work at the same port; together the two terms capture\
    \ the full exergy exchange at a component boundary. At the plant system level,\
    \ summing this quantity over all rejection ports connects to the [waste_thermal_power_of_plant](name:waste_thermal_power_of_plant),\
    \ while the net conversion efficiency depends on the balance between heat input\
    \ and the [net_electric_power_output](name:net_electric_power_output).\n\nSign\
    \ convention: Positive when thermal power flows into the plant component system\
    \ boundary."
  unit: W
  physics_domain: plant_systems
  links:
  - name:mechanical_power_of_plant_component
  - name:waste_thermal_power_of_plant
  - name:net_electric_power_output
  constraints: []
  sources:
  - id: dd:balance_of_plant/power_plant/system/component/port/power_thermal
    dd_path: balance_of_plant/power_plant/system/component/port/power_thermal
    status: composed
- name: toroidal_component_of_shattered_pellet_fragment_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the velocity vector of a shattered pellet fragment,
    defined as the projection onto the toroidal unit vector phi-hat in the right-handed
    cylindrical (R, phi, Z) frame. This component captures any net azimuthal motion
    the fragment acquires at or after the shattering event.
  documentation: "The toroidal component of the fragment velocity is defined by the\
    \ projection\n\n$$v_\\phi = \\mathbf{v} \\cdot \\hat{\\phi}$$\n\nwhere $\\mathbf{v}$\
    \ is the velocity vector of an individual shattered pellet fragment evaluated\
    \ at the fragment position after shattering, and $\\hat{\\phi}$ is the unit vector\
    \ in the direction of increasing toroidal angle $\\phi$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame ($R$ is major radius, $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above $+\\hat{Z}$, and $Z$ is vertical height).\n\
    \nThe full velocity vector decomposes as\n\n$$\\mathbf{v} = v_R\\,\\hat{R} + v_\\\
    phi\\,\\hat{\\phi} + v_Z\\,\\hat{Z}$$\n\nso that $v_\\phi$ is one of three orthogonal\
    \ components alongside the radial component $v_R$ (see `radial_component_of_shattered_pellet_fragment_velocity`)\
    \ and the vertical component $v_Z$ (see `vertical_component_of_shattered_pellet_fragment_velocity`).\n\
    \nFor shattered pellet injection (SPI) systems, the injector barrel is typically\
    \ oriented to deliver pellets predominantly along a single trajectory (often with\
    \ a dominant $R$ or $Z$ component). Consequently, $v_\\phi$ is in many cases small\
    \ compared with $v_R$ or $v_Z$, but may become non-negligible when the shattering\
    \ tube is angled toroidally or when secondary fragment collisions impart azimuthal\
    \ momentum. Typical magnitudes range from $\\sim 0$ to a few hundred m/s depending\
    \ on injector geometry, with the intact pellet speed at the shattering position\
    \ typically in the range $150$\u2013$600$ m/s.\n\nThis quantity applies to individual\
    \ fragments, not to the center of mass of the intact pellet. The pellet center-of-mass\
    \ speed at the shattering position is a distinct quantity and should not be conflated\
    \ with fragment-level velocities.\n\nSign convention: Positive when the fragment\
    \ moves in the direction of increasing toroidal angle $\\phi$ (counter-clockwise\
    \ when viewed from above $+\\hat{Z}$)."
  unit: m.s^-1
  physics_domain: plant_systems
  links:
  - name:shattered_pellet_fragment_velocity
  - name:radial_component_of_shattered_pellet_velocity
  - name:vertical_component_of_shattered_pellet_velocity
  - name:vertical_component_of_shattered_pellet_fragment_center_of_mass_velocity
  - name:shattered_pellet_velocity_magnitude_at_shattering_position
  constraints: []
  arguments:
  - name: shattered_pellet_fragment_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
