- name: height_of_antenna_strap
  kind: scalar
  status: draft
  description: Full vertical height of the rectangular cross-section of an ICRH antenna
    strap conductor element, measured along the poloidal direction.
  documentation: 'The height of an antenna strap is the full vertical (poloidal) extent
    of the rectangular cross-section of the current-carrying strap conductor in an
    ion cyclotron resonance heating (ICRH) antenna system. In ICRH antennas, the strap
    is the active radiating element that launches electromagnetic waves near the ion
    cyclotron frequency; its cross-sectional geometry governs current distribution,
    RF resistance, and coupling efficiency to the plasma.


    For a rectangular strap cross-section, the three characteristic dimensions are
    height (this quantity), [width](name:width_of_antenna_strap) measured along the
    toroidal direction, and [thickness](name:thickness_of_antenna_strap) perpendicular
    to the strap plane. Height is measured along the vertical direction $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius,
    $\phi$ is the toroidal angle, and $Z$ is the vertical coordinate. For strap conductors
    with annular cross-sections, the analogous radial dimensions are the [outer radius](name:outer_radius_of_antenna_strap)
    and [inner radius](name:inner_radius_of_antenna_strap) of the conductor.


    Typical ICRH strap heights range from a few centimeters to approximately 50 cm
    depending on antenna design and machine geometry.


    Sign convention: Positive when measured in the direction of increasing $Z$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:outer_radius_of_antenna_strap
  - name:inner_radius_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/height
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/height
    status: composed
- name: inner_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of an ICRH antenna strap,
    measured from the strap conductor axis to the inner cylindrical boundary of the
    conductor.
  documentation: 'Inner radius of an antenna strap is the radial distance from the
    local strap conductor axis to the inner cylindrical surface of an annular strap
    cross-section. It applies to hollow or tubular ICRH strap conductors; straps with
    solid rectangular or otherwise non-annular cross-sections do not have this quantity.
    In a strap-local right-handed cylindrical $(r_s, \varphi_s, z_s)$ frame, $z_s$
    follows the strap centerline or long current-carrying direction and $r_s$ is measured
    perpendicular to that axis.


    The inner radius is the distance from the strap axis to the inner wall of the
    annulus:


    $$

    r_\mathrm{inner} = \left|\mathbf{x}_\perp - \mathbf{x}_\mathrm{axis}\right|

    $$


    where $\mathbf{x}_\perp$ is a point on the inner cylindrical boundary in a cross-section
    normal to the strap axis, $\mathbf{x}_\mathrm{axis}$ is the corresponding point
    on the strap centerline, and both positions are expressed in meters.


    This quantity is obtained from antenna mechanical design, CAD geometry, or direct
    metrology of the conductor cross-section. Together with [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap),
    it determines the annular conducting area, $A = \pi(r_\mathrm{outer}^2-r_\mathrm{inner}^2)$,
    and the wall thickness, $r_\mathrm{outer}-r_\mathrm{inner}$, which are important
    for cooling-channel design, RF current distribution, and impedance modeling at
    ion-cyclotron frequencies.


    Typical ICRH tubular copper strap inner radii are about 0.005-0.03 m, depending
    on RF power, cooling requirements, and mechanical constraints. Larger high-power
    antenna conductors may use somewhat larger inner radii to reduce hydraulic resistance
    and thermal loading.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:outer_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:width_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    status: composed
- name: ion_state_absorbed_power_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Wave power absorbed by ions of a specified species and charge state
    along a coherent-wave beam-tracing beam path. It is the charge-state-resolved
    contribution to the total ion power absorbed from that beam.
  documentation: 'Ion-state absorbed power of a beam-tracing beam is the net power
    transferred from a coherent wave beam to ions of one specified species and ionization
    (charge) state along the traced beam path. It is the charge-state-resolved share
    of the ion power absorbed from that beam, and summing it over all charge states
    of a species recovers the species-level ion absorption.


    The absorbed power is the integral of the local absorption rate per unit path
    length over the beam representation:


    $$

    P_{i,z} = \int_{\mathcal{C}} \frac{dP_{i,z}}{d\ell} \, d\ell

    $$


    where $\mathcal{C}$ is the traced beam path, $\ell$ is distance along that path
    in meters, and $dP_{i,z}/d\ell$ is the local net power transferred to ion species
    $i$ in charge state $z$ per unit path length, expressed in W/m. The integral runs
    along the beam path used to represent the propagating field, not over the full
    plasma volume; the corresponding volumetric deposition rates per unit plasma volume
    are tracked separately.


    The quantity is evaluated by beam-tracing models, which extend geometrical optics
    to include finite beam-width effects by following a Gaussian wave packet through
    an inhomogeneous plasma. The local transfer follows from the wave field, plasma
    equilibrium, species composition, charge-state populations, and ion distribution
    functions, and may arise from any modeled wave-particle damping mechanism rather
    than only ion-cyclotron resonance. The species and charge state are fixed by the
    associated ion-state identifier.


    Typical per-beam ion-state absorbed power spans a broad range, from near zero
    on weakly damped paths or for trace charge states up to of order the total coupled
    beam power for strongly resonant states; the value is bounded above by the available
    beam power in a passively absorbing plasma.


    Sign convention: Positive when net wave energy is transferred from the beam to
    the specified ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_beam_tracing_beam
  - name:thermal_ion_state_power_density
  - name:fast_ion_state_power_density
  arguments:
  - name: absorbed_power_of_beam_tracing_beam
    operator: ion_state
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/beam_tracing/beam/ion/state/power
    dd_path: waves/coherent_wave/beam_tracing/beam/ion/state/power
    status: composed
- name: launched_power_of_electron_cyclotron_launcher
  kind: scalar
  status: draft
  description: Net electron cyclotron radio-frequency power crossing from a single
    launcher into the vacuum vessel, defined as forward minus reflected power at the
    launcher aperture or reference plane. Evaluated after transmission-line and launcher
    losses and before any plasma absorption, reflection, or shine-through.
  documentation: 'Launched power of an electron cyclotron launcher is the net radio-frequency
    wave power delivered by one electron cyclotron launcher across its launch aperture
    into the vacuum vessel. It is a boundary power for electron-cyclotron heating
    and current-drive calculations, defined as the forward power minus the power reflected
    back at the launcher aperture or reference plane, and before any plasma absorption,
    reflection from cutoff or resonance regions, wall interaction, or shine-through.


    For a launcher represented by one or more launched wave beams, the launcher launched
    power is the sum of the launched powers of those beams:


    $$

    P_{\mathrm{EC,launched}}^{\mathrm{launcher}} = \sum_b P_{\mathrm{launched},b}

    $$


    where $P_{\mathrm{launched},b}$ is the launched power of beam $b$ in watts, taken
    after transmission losses and before plasma interaction. Equivalently, in terms
    of the directional power components at the reference plane, $P_{\mathrm{EC,launched}}^{\mathrm{launcher}}
    = P_{\mathrm{forward}} - P_{\mathrm{reflected}}$, with all terms in watts.


    This power is typically derived from gyrotron or source output power corrected
    for transmission-line, window, switch, and launcher losses, or inferred from calibrated
    radio-frequency power monitors near the launcher. It is commonly used as the input
    power for ray-tracing or beam-tracing models; subsequent absorbed, reflected,
    or shine-through power is accounted for separately.


    Typical values for a single electron cyclotron launcher are of order $1 \times
    10^5$ to $2 \times 10^6$ W in present tokamak systems, with multi-beam or high-power
    launchers reaching several $10^6$ W.


    Sign convention: Positive when electron cyclotron wave power flows from the launcher
    into the vacuum vessel.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_electron_cyclotron_launcher
  - name:total_power_of_electron_cyclotron_launcher
  - name:launched_power_of_wave_beam
  sources:
  - id: dd:ec_antennas/antenna/power_launched
    dd_path: ec_antennas/antenna/power_launched
    status: attached
  - id: dd:ec_launchers/launcher/power_launched
    dd_path: ec_launchers/launcher/power_launched
    status: composed
- name: launched_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power entering the vacuum vessel from a single lower-hybrid
    antenna, equal to forward power minus reflected power at the antenna aperture.
  documentation: 'The launched power of a lower-hybrid antenna is the net radio-frequency
    power injected into the vacuum vessel from one lower-hybrid antenna assembly per
    unit time. It quantifies the RF energy flux actually available to couple to plasma
    waves, distinguishing it from the gross input to the antenna system and from the
    fraction ultimately absorbed by the plasma.


    The net launched power is defined as:


    $$

    P_\mathrm{launched} = P_\mathrm{forward} - P_\mathrm{reflected}

    $$


    where $P_\mathrm{forward}$ is the [forward power](name:forward_power_of_lower_hybrid_antenna)
    at the antenna aperture and $P_\mathrm{reflected}$ is the [reflected power](name:reflected_power_of_lower_hybrid_antenna)
    returning toward the transmission line. The coupling efficiency is $\eta = P_\mathrm{launched}/P_\mathrm{forward}$,
    which depends on the match between the antenna wave spectrum and the plasma density
    at the waveguide mouth.


    This quantity is measured by directional couplers on the transmission line feeding
    each antenna and serves as the primary input to ray-tracing and full-wave calculations
    for lower hybrid current drive power deposition. Launched powers in current experiments
    range from tens of kilowatts to several megawatts per antenna.


    The gross RF input to the antenna system before accounting for reflections is
    given by [power_of_lower_hybrid_antenna](name:power_of_lower_hybrid_antenna).
    The system-level aggregate over all launcher units is captured by [total_launched_power_of_lower_hybrid_antenna](name:total_launched_power_of_lower_hybrid_antenna),
    while the fraction deposited in the plasma is tracked by [total_absorbed_power_of_lower_hybrid_antenna](name:total_absorbed_power_of_lower_hybrid_antenna).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  - name:power_of_lower_hybrid_antenna
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/antenna/power_launched
    dd_path: lh_antennas/antenna/power_launched
    status: composed
- name: length_of_antenna_strap
  kind: scalar
  status: draft
  description: Base length of the oblique trapezoidal cross-section used to represent
    an ICRH antenna strap conductor. It is a reference edge dimension of the conductor
    section, not the slant height of an inclined side.
  documentation: 'Length of antenna strap is the reference base dimension of an oblique
    trapezoidal cross-section used to describe an ion-cyclotron-range-of-frequencies
    antenna strap conductor. It identifies the straight base edge of the section and
    should not be interpreted as the sloping side length, slant height, or inclined-face
    chord.


    For an oblique strap section, this length is only one geometric parameter. The
    full non-rectangular outline also depends on the [width](name:width_of_antenna_strap),
    [thickness](name:thickness_of_antenna_strap), and inclination angles such as $\alpha$
    in [alpha_angle_of_antenna_strap](name:alpha_angle_of_antenna_strap) and $\beta$
    in angle_of_antenna_strap. No universal $1/\cos\alpha$ or similar conversion is
    implied unless the angle reference directions and the selected base edge are specified
    by the geometric construction.


    In practice the value is taken from antenna engineering drawings, CAD geometry,
    or metrology of the strap conductor as the distance between the endpoints of the
    chosen base edge of the physical cross-section. It is used with the other strap
    dimensions and angles in electromagnetic, thermal, and structural models of ICRH
    antenna conductors.


    Typical values are device- and design-dependent, but base lengths for conducting
    ICRH strap cross-sections commonly lie in the range 0.02-0.5 m, with larger values
    for high-power antenna straps and smaller values for compact test structures.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:alpha_angle_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/oblique/length
    dd_path: ic_antennas/antenna/module/strap/geometry/oblique/length
    status: composed
- name: maximum_angle_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: Upper mechanical travel limit for the signed rotation angle of an electron-cyclotron
    launcher mirror about its movement axis.
  documentation: 'The maximum angle of an electron-cyclotron launcher mirror is the
    upper endpoint of the allowed signed rotation interval for the mirror steering
    actuator. It is referenced to the launcher mirror reference orientation and, together
    with [minimum_angle_of_electron_cyclotron_launcher_mirror](name:minimum_angle_of_electron_cyclotron_launcher_mirror),
    bounds the permitted values of the instantaneous [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror).
    This is a hardware constraint rather than a plasma quantity.


    The admissible mirror rotation is constrained by


    $$

    \alpha_{\min} \leq \alpha \leq \alpha_{\max}

    $$


    where $\alpha_{\max}$ is this maximum angle in rad, $\alpha_{\min}$ is the corresponding
    lower mechanical limit in rad, and $\alpha$ is the instantaneous mirror rotation
    angle in rad.


    The value is established from the launcher mechanical design, actuator travel,
    clearances, and commissioning calibration. During operation it is used by steering
    control and protection logic to reject commanded or measured mirror angles outside
    the allowed interval. The mirror angle affects the launch direction of the electron-cyclotron
    beam, but the mapping from mirror rotation to beam direction is specific to the
    launcher optics.


    Typical limits are device-specific. For many steerable electron-cyclotron mirrors
    the allowed excursion is of order 0.1-1 rad from the reference orientation, while
    narrower or broader ranges can occur depending on actuator geometry and mechanical
    stops; the signed upper limit must satisfy $\alpha_{\max} \geq \alpha_{\min}$.


    Sign convention: Positive when the mirror rotation is counter-clockwise about
    the movement axis as seen by an observer for whom the positive mirror movement-direction
    vector points toward the observer.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:minimum_angle_of_electron_cyclotron_launcher_mirror
  - name:angle_of_electron_cyclotron_launcher_mirror
  sources:
  - id: dd:ec_launchers/mirror/movement/rotation_angle_max
    dd_path: ec_launchers/mirror/movement/rotation_angle_max
    status: composed
- name: outer_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Outer radial boundary of the annular cross-section of an ICRH antenna
    strap conductor, defining the larger of the two radii that bound the conductor
    annulus.
  documentation: 'The outer radius of an ICRH antenna strap is the radial distance
    from the central axis of the strap conductor to the outer cylindrical surface
    of the annular cross-section. It marks the external boundary of the conductor
    material and, together with the [inner radius](name:inner_radius_of_antenna_strap),
    fully specifies the radial extent of the annular conductor.


    For an annular cross-section, the radial conductor wall thickness follows $\Delta
    r = r_\mathrm{out} - r_\mathrm{in}$, where $r_\mathrm{out}$ is the outer radius
    and $r_\mathrm{in}$ is the inner radius. The nominal centerline radius reported
    by [radius_of_antenna_strap](name:radius_of_antenna_strap) is the mean $(r_\mathrm{out}
    + r_\mathrm{in})/2$.


    This geometric parameter enters electromagnetic wave-coupling calculations and
    RF impedance modeling for ion cyclotron resonance heating systems. Together with
    the [width](name:width_of_antenna_strap), [height](name:height_of_antenna_strap),
    and [thickness](name:thickness_of_antenna_strap) of the conductor, it provides
    the complete geometric description needed for antenna strap simulations.


    Sign convention: Positive when measured radially outward from the strap conductor
    axis.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:inner_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:width_of_antenna_strap
  - name:height_of_antenna_strap
  - name:thickness_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    status: composed
- name: per_toroidal_mode_fast_ion_power
  kind: scalar
  status: draft
  description: Cumulative coherent-wave power absorbed by suprathermal ions inside
    a flux surface, resolved by toroidal mode number.
  documentation: 'Per-toroidal-mode fast-ion power is the net rate of energy transfer
    from a coherent wave to the suprathermal ion population for one toroidal Fourier
    mode, accumulated over the volume enclosed by a chosen flux surface. Summing over
    toroidal mode numbers gives the total fast-ion wave power inside that surface,
    while charge-state-resolved and thermal-species analogs separate the same physical
    transfer by ion charge state or receiving population.


    The cumulative mode-resolved power is defined by integrating the local net power-transfer
    density for that mode over the enclosed volume:


    $$

    P_{\mathrm{fast},n_\phi}(\psi) = \int_{V(\psi)} q_{\mathrm{fast},n_\phi}(\mathbf{x})\,dV

    $$


    where $P_{\mathrm{fast},n_\phi}$ is the cumulative power in W, $q_{\mathrm{fast},n_\phi}$
    is the local net power-transfer density in W m$^{-3}$, $V(\psi)$ is the volume
    inside the flux surface labeled by $\psi$, and $dV$ is the volume element in m$^3$.
    The label $\psi$ may be a magnetic-flux coordinate in Wb or a normalized flux
    coordinate with unit 1, and $n_\phi$ is a dimensionless integer toroidal mode
    number defined with respect to the toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height.


    In practice this quantity is computed by decomposing the coherent wave field into
    toroidal Fourier components and evaluating the wave-particle energy exchange with
    the modeled fast-ion distribution. The radial cumulative value is obtained by
    integrating the mode-resolved deposition density inside successive flux surfaces;
    direct experimental inference usually combines wave coupling information, equilibrium
    geometry, and fast-ion distribution modeling rather than a single diagnostic measurement.
    Closely related quantities include [per_toroidal_mode_fast_ion_state_power](name:per_toroidal_mode_fast_ion_state_power),
    [per_toroidal_mode_thermal_ion_power](name:per_toroidal_mode_thermal_ion_power),
    [per_toroidal_mode_thermal_electron_power](name:per_toroidal_mode_thermal_electron_power),
    and [per_toroidal_mode_fast_electron_power](name:per_toroidal_mode_fast_electron_power).


    Representative values range from near 0 W for weakly coupled or nonresonant modes
    to a substantial fraction of the absorbed coherent-wave power for resonant modes.
    In megawatt-class radio-frequency heating, dominant individual toroidal modes
    are commonly of order 10^3-10^6 W, with the sum over modes bounded by the net
    wave power transferred to plasma particles.


    Sign convention: Positive when net energy is transferred from the coherent wave
    field to the suprathermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_power_at_inside_flux_surface
  - name:per_toroidal_mode_fast_electron_power
  - name:per_toroidal_mode_thermal_ion_power
  - name:per_toroidal_mode_fast_ion_state_power
  sources:
  - id: dd:waves/coherent_wave/global_quantities/ion/power_fast_n_phi
    dd_path: waves/coherent_wave/global_quantities/ion/power_fast_n_phi
    status: composed
  - id: dd:waves/coherent_wave/global_quantities/ion/power_fast_n_tor
