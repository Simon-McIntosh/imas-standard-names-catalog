- name: toroidal_component_of_fast_ion_torque_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Collisional toroidal torque density exchanged with the fast ion population
    via Coulomb collisions with background ion species, expressed as force per unit
    volume in the toroidal direction. This is a local volumetric quantity whose flux-surface
    average yields the 1D radial torque density profile used in transport modeling.
  documentation: "This quantity is the toroidal component of the collisional friction\
    \ force density acting on the fast ion population due to Coulomb scattering off\
    \ background ion species. Formally, it is the $\\hat{\\phi}$-projection of the\
    \ collisional momentum exchange rate density:\n\n$$T_\\phi^\\mathrm{fast,ion}\
    \ = \\int m_\\mathrm{fast}\\, v_\\phi\\, C[f_\\mathrm{fast}]\\, d^3v$$\n\nwhere\
    \ $C[f_\\mathrm{fast}]$ is the Fokker\u2013Planck collision operator acting on\
    \ the fast ion distribution function $f_\\mathrm{fast}$, $m_\\mathrm{fast}$ is\
    \ the fast ion mass, and $v_\\phi = R\\dot{\\phi}$ is the toroidal velocity. The\
    \ projection onto $\\hat{\\phi}$ is taken in the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame, where $R$ is the major radius from the machine symmetry axis,\
    \ $\\phi$ is the toroidal angle increasing counter-clockwise when viewed from\
    \ above $+\\hat{Z}$, and $Z$ is the vertical height.\n\nThe local volumetric torque\
    \ density $T_\\phi^\\mathrm{fast,ion}(R, Z)$ can be flux-surface-averaged to obtain\
    \ the 1D profile $\\langle T_\\phi^\\mathrm{fast,ion} \\rangle(\\rho)$ entering\
    \ radial angular momentum transport equations, where $\\rho$ denotes a flux-surface\
    \ label (e.g., the normalized toroidal flux radius $\\rho_\\mathrm{tor,norm}$).\
    \ The volume-integrated torque is recovered as $\\tau_\\phi = \\int T_\\phi^\\\
    mathrm{fast,ion}\\, dV$.\n\nThis quantity represents the sum over all background\
    \ ion collision partners. For the contribution from electron collisions alone,\
    \ see the related name for fast-particle torque density due to Coulomb collisions\
    \ with electrons. Coulomb collisions can transfer angular momentum either to or\
    \ from the fast ion population depending on the relative drift velocities and\
    \ distribution function gradients; consequently this quantity may be positive\
    \ or negative.\n\nTypical magnitudes in neutral-beam-heated tokamaks range from\
    \ $10^3$ to $10^6$ N m$^{-3}$, depending on beam power, fast ion density, and\
    \ background plasma temperature. This quantity is evaluated from distribution-function\
    \ codes (e.g., Fokker\u2013Planck or Monte Carlo solvers) that evolve the fast\
    \ ion velocity distribution.\n\nSign convention: Positive when the collisional\
    \ torque acts on the fast ions in the direction of increasing toroidal angle $\\\
    phi$ (i.e., in the $+\\hat{\\phi}$ direction of the right-handed cylindrical $(R,\
    \ \\phi, Z)$ frame)."
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_ion
  - name:toroidal_component_of_fast_particle_torque_due_to_coulomb_collisions_with_electrons
  - name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions
