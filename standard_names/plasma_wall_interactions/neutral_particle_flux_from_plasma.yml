name: neutral_particle_flux_from_plasma
status: draft
cocos_transformation_type: one_like
description: Total rate of neutral particles leaving the confined plasma and reaching
  the wall, accounting for charge-exchange and recombination sources.
documentation: The neutral particle flux from the plasma $\Gamma_{n,\mathrm{plasma}}$
  (in s$^{-1}$) is the global rate at which neutral atoms or molecules originating
  from charge-exchange reactions, volume recombination, and edge-plasma processes
  escape the last closed flux surface toward the wall. It is a key term in the global
  particle balance $dN/dt = S_{\mathrm{ext}} + \Gamma_{n,\mathrm{wall}} - \Gamma_{n,\mathrm{plasma}}
  - S_{\mathrm{pump}}$, where $N$ is the total particle inventory, $S_{\mathrm{ext}}$
  is the external fueling rate (s$^{-1}$), and $S_{\mathrm{pump}}$ is the pumping
  rate (s$^{-1}$). Typical values range from $10^{20}$ to $10^{22}$ s$^{-1}$ in medium
  to large tokamaks. The quantity is computed by neutral transport codes such as EIRENE
  or DEGAS-2, or inferred from global particle balance using calibrated $H_\alpha$
  / $D_\alpha$ photon fluxes. See also `neutral_particle_flux_from_wall` for the reverse
  flux and `neutral_pumping_speed` for the exhaust term.
