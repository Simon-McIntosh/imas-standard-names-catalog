- name: current_of_plasma_filament
  kind: scalar
  status: draft
  description: Electric current carried by a single discrete plasma-filament element
    in an axisymmetric filamentary representation of the distributed plasma current.
  documentation: "In the filamentary model of an axisymmetric plasma, the spatially\
    \ distributed plasma current is represented as an array of discrete annular current-carrying\
    \ elements, each called a filament. The current of each element is its individual\
    \ contribution to the net toroidal plasma current, and the ensemble of filament\
    \ currents constitutes a discrete model of the plasma current density distribution\
    \ across the poloidal cross-section.\n\nThe total plasma current $I_p$ is recovered\
    \ by summing the contributions from all filament elements:\n\n$$\nI_p = \\sum_k\
    \ I_k\n$$\n\nwhere $I_k$ is the current of the $k$-th filament element and the\
    \ sum runs over all elements in the filamentary array.\n\nFilament currents are\
    \ determined during equilibrium reconstruction or electromagnetic circuit-equation\
    \ integration, treating the plasma as a collection of discrete current sources.\
    \ Each filament element is fully characterized by its current together with its\
    \ geometric descriptors \u2014 including area_of_plasma_filament, [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament),\
    \ and [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament)\
    \ \u2014 which together define the local current-density contribution. The analogous\
    \ quantity for the conducting vessel structure is [toroidal_current_of_vacuum_vessel](name:toroidal_current_of_vacuum_vessel).\n\
    \nSign convention: Positive when the current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise viewed from above $+\\hat{Z}$)."
  unit: A
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:pf_plasma/element/current
    dd_path: pf_plasma/element/current
    status: composed
- name: current_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Signed conductor current carried by a poloidal-field coil winding.
    It is the electrical current in amperes through the winding conductor, distinct
    from the ampere-turn product obtained by multiplying by the number of turns.
  documentation: 'Current of a poloidal-field coil is the signed electrical current
    carried by the coil winding conductor. For a multi-turn winding, this quantity
    is the conductor current $I_\mathrm{PF}$, while the magnetomotive ampere-turn
    product is $N I_\mathrm{PF}$, where $N$ is the number of turns.


    The vacuum poloidal-flux contribution of a coil can be written, for a field point
    in the right-handed cylindrical $(R, \phi, Z)$ system where $R$ is major radius
    in meters and $Z$ is vertical height in meters, as


    $$

    \psi_\mathrm{coil}(R,Z) = M_\mathrm{coil}(R,Z) I_\mathrm{PF}

    $$


    where $\psi_\mathrm{coil}$ is in Wb, $I_\mathrm{PF}$ is in A, and $M_\mathrm{coil}$
    is the mutual inductance in Wb/A between the modeled coil winding and the flux
    surface label at $(R,Z)$. When $M_\mathrm{coil}$ is defined per conductor current,
    it includes the winding turn count and the finite coil cross-section represented
    by the coil model; if a per-turn Green-function response is used instead, the
    factor $N I_\mathrm{PF}$ appears explicitly.


    In practice, poloidal-field coil currents are measured with electrical current
    transducers in the coil circuits and may also be estimated or constrained during
    equilibrium reconstruction. These currents determine the externally applied poloidal
    magnetic-field and flux contributions used for plasma position, boundary, and
    shape control, together with plasma current and currents in passive conducting
    structures.


    Representative values are strongly device- and coil-dependent, ranging from kA-scale
    currents in smaller or auxiliary poloidal-field coils to several tens of kA in
    large shaping or vertical-field coils.


    Sign convention: Positive when the conventional current in the winding flows in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ system.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_of_passive_structure
  sources:
  - id: dd:equilibrium/time_slice/constraints/pf_current/measured
    dd_path: equilibrium/time_slice/constraints/pf_current/measured
    status: composed
  - id: dd:equilibrium/time_slice/constraints/pf_current/reconstructed
    dd_path: equilibrium/time_slice/constraints/pf_current/reconstructed
    status: composed
  - id: dd:pf_active/circuit/current
    dd_path: pf_active/circuit/current
    status: attached
- name: elongation_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless ratio of the vertical to horizontal semi-axis of each
    nested magnetic flux surface, parameterizing the poloidal elongation of plasma
    shape as a function of the flux label.
  documentation: "The elongation $\\kappa$ of a flux surface is a dimensionless measure\
    \ of how vertically stretched the poloidal cross-section of a nested toroidal\
    \ magnetic surface is relative to its horizontal extent. A value of $\\kappa =\
    \ 1$ denotes a circular cross-section, while $\\kappa > 1$ characterizes the vertically\
    \ elongated shapes used in modern tokamaks to improve MHD stability and energy\
    \ confinement.\n\nThe defining relation is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\
    \nwhere $b$ is the vertical semi-axis (half-height measured from the geometric\
    \ center of the surface) and $a$ is the horizontal semi-axis (half-width) of the\
    \ flux surface in the poloidal cross-section.\n\nThe elongation profile is derived\
    \ from MHD equilibrium reconstruction by extracting the geometric shape parameters\
    \ of each nested flux surface obtained from the Grad-Shafranov solution, parameterized\
    \ as a function of the poloidal flux coordinate $\\psi$ across the minor radius.\
    \ The radial variation of $\\kappa$ is captured by [radial_derivative_of_elongation_of_flux_surface](name:radial_derivative_of_elongation_of_flux_surface).\
    \ Complementary poloidal shape descriptors include [lower_outer_squareness_of_flux_surface](name:lower_outer_squareness_of_flux_surface),\
    \ which characterizes the poloidal corner geometry, and [area_of_flux_surface](name:surface_area_of_flux_surface),\
    \ which gives the total enclosed cross-sectional area.\n\nTypical values rise\
    \ from $\\kappa \\approx 1.0$ near the magnetic axis to $\\kappa \\approx 1.5$\u2013\
    $2.0$ at the plasma boundary in shaped tokamak discharges; ITER is designed for\
    \ a boundary elongation near $\\kappa = 1.85$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/elongation
    dd_path: equilibrium/time_slice/profiles_1d/elongation
    status: composed
  - id: dd:gyrokinetics/flux_surface/elongation
    dd_path: gyrokinetics/flux_surface/elongation
    status: attached
  - id: dd:gyrokinetics_local/flux_surface/elongation
    dd_path: gyrokinetics_local/flux_surface/elongation
    status: attached
- name: elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Dimensionless ratio of the plasma boundary vertical half-height to
    its minor radius, quantifying the overall vertical elongation of the plasma cross-sectional
    shape at the last closed flux surface.
  documentation: "The elongation $\\kappa$ is a global dimensionless shape parameter\
    \ characterizing the vertical-to-horizontal aspect ratio of the plasma cross-section\
    \ at the plasma boundary. It enters directly into MHD stability criteria, the\
    \ Troyon beta limit, and confinement scaling relations, making it one of the primary\
    \ descriptors of plasma shaping alongside triangularity.\n\nThe defining relation\
    \ is:\n\n$$\n\\kappa = \\frac{b}{a}\n$$\n\nwhere $b$ is the vertical half-height\
    \ of the plasma boundary (half the total poloidal extent between the uppermost\
    \ and lowermost boundary points) and $a$ is the plasma minor radius (half the\
    \ horizontal full width at the midplane).\n\nThe quantity is obtained from equilibrium\
    \ reconstruction by fitting the closed poloidal boundary contour to external magnetic\
    \ measurements and internal pressure or current profiles. The boundary extremal\
    \ coordinates determine $b$ and $a$ directly.\n\nA circular cross-section corresponds\
    \ to $\\kappa = 1$. Modern shaped tokamaks typically operate in the range $\\\
    kappa = 1.5$\u2013$2.0$; strongly elongated configurations approach $\\kappa \\\
    approx 1.8$\u2013$2.0$. Higher elongation increases plasma volume at fixed minor\
    \ radius and improves the MHD beta limit, but at the cost of reduced vertical\
    \ stability requiring active position control.\n\nWhen up-down asymmetry is significant,\
    \ this global parameter decomposes into [upper elongation](name:upper_elongation_of_plasma_boundary)\
    \ and [lower elongation], each measuring the half-boundary contribution. The radial\
    \ variation of elongation across nested flux surfaces is captured by [elongation_of_flux_surface](name:elongation_of_flux_surface)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation
    dd_path: equilibrium/time_slice/boundary/elongation
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation
    status: attached
  - id: dd:summary/boundary/elongation/value
    dd_path: summary/boundary/elongation/value
    status: attached
- name: flux_surface_area_at_plasma_boundary
  kind: scalar
  status: draft
  description: Total geometric surface area of the last closed flux surface (plasma
    boundary), computed by revolving the closed poloidal boundary contour through
    the full toroidal revolution around the machine symmetry axis.
  documentation: "The flux surface area at the plasma boundary quantifies the full\
    \ three-dimensional surface area of the last closed flux surface (LCFS) \u2014\
    \ the outermost toroidal magnetic surface that bounds the confined plasma. As\
    \ a global equilibrium scalar, it is sensitive to the plasma major radius, minor\
    \ radius, and poloidal shape, including elongation and triangularity, and provides\
    \ a natural normalization for surface-integrated transport and heat-load analyzes.\n\
    \nFor an axisymmetric toroidal equilibrium, the LCFS surface area follows from\
    \ revolving the closed poloidal boundary contour around the torus symmetry axis\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame:\n\n$$\nS_\\mathrm{LCFS}\
    \ = 2\\pi \\oint_\\mathrm{LCFS} R \\, d\\ell_p\n$$\n\nwhere $R$ is the major-radius\
    \ coordinate and $d\\ell_p$ is the differential poloidal arc length along the\
    \ boundary contour.\n\nThis quantity is obtained from magnetohydrodynamic equilibrium\
    \ reconstruction: once the LCFS geometry is determined, the surface area follows\
    \ by direct geometric integration. It appears in global power-balance studies,\
    \ surface-averaged heat-load estimates, and geometric normalizations in confinement\
    \ scaling. The full radial profile of flux-surface areas is [flux_surface_area](name:surface_area_of_flux_surface),\
    \ of which this is the outermost value; the corresponding poloidal flux label\
    \ at the boundary is given by [poloidal_magnetic_flux_at_plasma_boundary](name:poloidal_magnetic_flux_at_plasma_boundary).\
    \ Typical values range from tens of m\xB2 for compact tokamaks to several hundred\
    \ m\xB2 for large devices.\n\nSign convention: Positive when $R > 0$ and the LCFS\
    \ forms a single well-defined closed toroidal surface, conditions satisfied in\
    \ all standard confined equilibria."
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/area
    dd_path: equilibrium/time_slice/global_quantities/area
    status: composed
  - id: dd:equilibrium/time_slice/global_quantities/surface
    dd_path: equilibrium/time_slice/global_quantities/surface
    status: composed
- name: flux_surface_averaged_major_radius
  kind: scalar
  status: draft
  description: Flux-surface average of the major radius coordinate R on each nested
    magnetic flux surface, yielding the mean distance from the toroidal symmetry axis
    weighted by the inverse poloidal field strength.
  documentation: 'The flux-surface averaged major radius $\langle R \rangle$ is the
    mean value of the cylindrical major radius coordinate $R$ over a closed toroidal
    magnetic flux surface, weighted by the local inverse poloidal magnetic field magnitude.
    It belongs to the family of geometric metric coefficients (sometimes denoted $gm8$
    in neoclassical transport literature) that enter the flux-surface-averaged forms
    of transport and equilibrium equations, and is the flux-surface-averaging transformation
    of the parent quantity [major_radius](name:major_radius).


    The defining expression is:


    $$

    \langle R \rangle = \frac{\oint R \, \frac{dl}{B_p}}{\oint \frac{dl}{B_p}}

    $$


    where $l$ is the poloidal arc length along the flux surface and $B_p$ is the poloidal
    magnetic field magnitude, with integrals taken over one complete poloidal circuit.
    Because $B_p$ is smaller on the outboard low-field side, field lines dwell longer
    there, and $\langle R \rangle$ is shifted toward larger $R$ relative to a simple
    geometric centroid; it lies between the [inner_major_radius_of_flux_surface](name:inner_major_radius_of_flux_surface)
    and the [outer_major_radius_of_flux_surface](name:outer_major_radius_of_flux_surface).


    This coefficient is computed directly from the magnetic geometry obtained in equilibrium
    reconstruction, and is closely related to [flux_surface_average_magnetic_field](name:flux_surface_average_magnetic_field)
    and [flux_surface_averaged_curvature](name:flux_surface_averaged_curvature), which
    are derived from the same surface-averaging procedure.


    Sign convention: Positive when $R$ is measured outward from the toroidal symmetry
    axis in the $+\hat{R}$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_major_radius_of_flux_surface
  - name:flux_surface_average_magnetic_field
  - name:flux_surface_averaged_curvature
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/gm8
    dd_path: equilibrium/time_slice/profiles_1d/gm8
    status: composed
- name: height_of_plasma_filament
  kind: scalar
  status: draft
  description: Vertical full height of the rectangular cross-section of a discrete
    plasma current-carrying filament element, measured parallel to the machine symmetry
    axis.
  documentation: 'In the filamentary model of plasma current distribution used for
    equilibrium reconstruction, the plasma current is represented by a set of discrete
    elements, each assigned a cross-sectional geometry. When the cross-section is
    modeled as a rectangle, the height defines the full vertical extent of that rectangle
    measured along the $Z$ axis of the cylindrical $(R, \phi, Z)$ frame, where $R$
    is the major radius, $\phi$ is the toroidal angle, and $Z$ is the vertical coordinate.


    For a rectangular filament element with height $h$ and horizontal width $w$, the
    rectangular cross-sectional area is $A = h \times w$, which is consistent with
    area_of_plasma_filament. The height is specified alongside [width_of_plasma_filament](name:width_of_plasma_filament)
    to fully characterize the rectangular geometry; for annular cross-sections, the
    radial bounds are instead described by [inner_radius_of_plasma_filament](name:inner_radius_of_plasma_filament)
    and [outer_radius_of_plasma_filament](name:outer_radius_of_plasma_filament).


    The height is a fixed geometric input parameter assigned when constructing the
    filamentary current model, with its value chosen to resolve the spatial scale
    of interest in the current distribution. Typical values range from a few centimeters
    to tens of centimeters depending on the resolution requirements of the equilibrium
    reconstruction.


    Sign convention: Positive when the vertical extent of the filament cross-section
    is measured in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:pf_plasma/element/geometry/rectangle/height
    dd_path: pf_plasma/element/geometry/rectangle/height
    status: composed
- name: inner_major_radius_of_flux_surface
  kind: scalar
  status: draft
  description: Major radius of the high-field-side intersection of a nested magnetic
    flux surface with the equatorial plane in the right-handed cylindrical (R, phi,
    Z) frame. It is the smaller midplane radius of the surface, which together with
    the outer major radius defines the surface's horizontal width and geometric center.
  documentation: 'The inner major radius of a flux surface is the smaller-$R$ intersection
    of that surface with the midplane in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius measured from the toroidal symmetry axis and
    $Z$ is vertical height. It is the high-field-side equatorial radius of the surface;
    as the surface shrinks toward the innermost flux surface it approaches the [major_radius_of_magnetic_axis](name:major_radius_of_magnetic_axis).
    Each surface is identified by a monotonic flux-surface label such as normalized
    poloidal flux $\psi_N$ or normalized toroidal flux radius $\rho_\mathrm{tor,norm}$.


    For an axisymmetric equilibrium, the closed flux-surface contour $\mathcal{C}_\lambda$
    labeled by a radial coordinate $\lambda$ lies in the poloidal plane, and the inner
    major radius is the minimum $R$ at the magnetic-axis height:


    $$

    R_\mathrm{in}(\lambda) = \min\left\{R : (R, Z_\mathrm{axis}) \in \mathcal{C}_\lambda\right\}

    $$


    where $Z_\mathrm{axis}$ is the vertical coordinate of the magnetic axis. Axisymmetry
    ensures the surface''s two midplane crossings lie on the horizontal line $Z =
    Z_\mathrm{axis}$; in strongly up-down asymmetric equilibria the relevant midplane
    height may differ from the axis height. Together with the [outer_major_radius_of_flux_surface](name:outer_major_radius_of_flux_surface),
    it gives the midplane geometric center $R_\mathrm{geo} = (R_\mathrm{out} + R_\mathrm{in})/2$
    and the midplane half-width $a_\mathrm{mid} = (R_\mathrm{out} - R_\mathrm{in})/2$;
    the radial variation of $R_\mathrm{geo}$ across surfaces is a common measure of
    the Shafranov shift. The [flux_surface_averaged_major_radius](name:flux_surface_averaged_major_radius)
    is a surface-average quantity and need not equal this midplane geometric center
    when shaping and toroidal weighting are significant.


    In equilibrium reconstruction, $R_\mathrm{in}$ is obtained by tracing a closed
    constant-flux contour and interpolating its intersection with the horizontal line
    through the magnetic axis. At the last closed flux surface it corresponds to the
    inboard midplane boundary radius, but the definition applies to any nested closed
    magnetic surface.


    Values are largest near the magnetic axis, where they approach the magnetic-axis
    major radius, and decrease monotonically toward the inboard plasma boundary as
    surfaces expand outward. The overall magnitude scales with the major radius of
    the device, ranging from well below a meter in compact machines to several meters
    in large tokamaks.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:outer_major_radius_of_flux_surface
  - name:flux_surface_averaged_major_radius
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/r_inboard
    dd_path: equilibrium/time_slice/profiles_1d/r_inboard
    status: composed
- name: internal_inductance
  kind: scalar
  status: draft
  description: Dimensionless measure of plasma current profile peaking, defined as
    the volume-integrated squared poloidal magnetic field normalized by the square
    of the total plasma current and the reference major radius.
  documentation: "The internal inductance $l_i$ is a dimensionless global equilibrium\
    \ parameter that characterizes the shape of the plasma current density profile.\
    \ A broadly distributed current results in a lower $l_i$ (near 0.5 for a circular\
    \ cross-section with uniform current), while a strongly peaked profile raises\
    \ it toward 2. This quantity enters vertical stability analysis and the plasma\u2013\
    coil circuit equations relating the resistive loop voltage to the time-evolving\
    \ current distribution.\n\nThe $l_{i,3}$ definition relates $l_i$ to the volume\
    \ integral of the squared poloidal magnetic field:\n\n$$\nl_{i,3} = \\frac{2}{R_0\
    \ \\mu_0^2 I_p^2} \\int B_p^2 \\, dV\n$$\n\nwhere $R_0$ is the reference major\
    \ radius of the geometric axis, $\\mu_0$ is the vacuum permeability, $I_p$ is\
    \ the total plasma current, $B_p$ is the poloidal magnetic field magnitude, and\
    \ the integral is taken over the plasma volume.\n\nThe internal inductance is\
    \ inferred from equilibrium reconstruction using external magnetic measurements,\
    \ or estimated from the resistive diffusion evolution of the current profile during\
    \ ramp-up and flat-top phases. In H-mode flat-top conditions, $l_i$ lies in the\
    \ range 0.7\u20131.2; sawtooth-free operation and current ramp-up can drive values\
    \ toward 2. The [total plasma inductance] $L_p$ combines $l_i$ with the external\
    \ inductance contribution to give the total inductive impedance of the plasma\
    \ circuit.\n\nSign convention: Positive for any current-carrying plasma, since\
    \ $l_{i,3}$ is proportional to $\\int B_p^2 \\, dV$, which is intrinsically non-negative."
  unit: '1'
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:core_profiles/global_quantities/li
    dd_path: core_profiles/global_quantities/li
    status: attached
  - id: dd:core_profiles/global_quantities/li_3
