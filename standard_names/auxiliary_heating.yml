      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Ion cyclotron resonance heating (ICRH) power coupled to the plasma
        from a specific launcher. Represents the net power absorbed by the plasma
        from the IC heating system.
      kind: template
- name: power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: Power of a beam-tracing beam is the residual electromagnetic wave power
    still carried by one coherent wave beam at the endpoint of its traced trajectory.
    It is distinct from initial launch power and from cumulative plasma-absorbed power.
  documentation: 'Power of a beam-tracing beam is the residual electromagnetic wave
    power still carried by a single coherent beam at the endpoint of the traced trajectory.
    It represents power remaining in the wave after propagation and after modeled
    transfer of wave energy to the plasma.


    The single-beam power balance relates the residual power to the initial and absorbed
    powers:


    $$

    P_{\mathrm{res}} = P_0 - P_{\mathrm{abs}}

    $$


    where $P_{\mathrm{res}}$ is [power_of_beam_tracing_beam](name:power_of_beam_tracing_beam),
    $P_0$ is [initial_power_of_beam_tracing_beam](name:initial_power_of_beam_tracing_beam),
    and $P_{\mathrm{abs}}$ is [absorbed_power_of_beam_tracing_beam](name:absorbed_power_of_beam_tracing_beam)
    over the same beam trajectory.


    This quantity excludes power already transferred to plasma particles; deposited
    power is represented by absorbed-power quantities, including species-resolved
    forms such as [electron_absorbed_power_of_beam_tracing_beam](name:electron_absorbed_power_of_beam_tracing_beam).
    The more general wave-beam power concept is [power_of_wave_beam](name:power_of_wave_beam).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:initial_power_of_beam_tracing_beam
  - name:absorbed_power_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/power_initial
    dd_version: 4.1.0
