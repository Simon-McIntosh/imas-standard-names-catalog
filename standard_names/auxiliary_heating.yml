- name: thermal_ion_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Local absorbed wave power per unit volume deposited on the thermal
    ion population by a coherent wave, summed over all toroidal mode contributions.
  documentation: 'The thermal ion wave absorbed power density $P_{\rm abs,i}^{\rm
    th}(R,Z)$ quantifies the local volumetric rate at which wave energy is transferred
    to the bulk (thermal) ion population in the poloidal plane. It represents the
    total deposition summed over all toroidal mode numbers, making it the natural
    counterpart to [per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density),
    which resolves the same quantity per toroidal mode $n_\phi$. Physically, $P_{\rm
    abs,i}^{\rm th}$ appears in the ion energy balance as a volumetric source: $\partial(n_i
    T_i)/\partial t + \nabla \cdot \mathbf{q}_i = P_{\rm abs,i}^{\rm th} + \ldots$,
    where $n_i$ is the ion number density, $T_i$ the ion temperature, and $\mathbf{q}_i$
    the ion heat flux. Typical magnitudes in ion-cyclotron resonance heating scenarios
    range from $10^5$ to $10^8$ W m$^{-3}$ in the core deposition region, depending
    on the applied radio-frequency power and plasma density. This quantity is computed
    by full-wave or ray-tracing wave propagation codes and is related to the cumulative
    integral [thermal_ion_wave_absorbed_power_inside_flux_surface](name:thermal_ion_wave_absorbed_power_inside_flux_surface)
    via volume integration over the region enclosed by a flux surface. The complementary
    deposition on the thermal electron population is described by [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density),
    and the fast-ion counterpart by [per_toroidal_mode_of_fast_ion_wave_absorbed_power_density](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_density).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
