    dd_path: edge_profiles/ggd/j_ion_neutral_friction/parallel
    status: attached
  - id: dd:plasma_profiles/ggd/j_ion_neutral_friction/parallel
    dd_path: plasma_profiles/ggd/j_ion_neutral_friction/parallel
    status: composed
- name: parallel_electron_energy_flux
  kind: scalar
  status: draft
  description: Scalar component of the electron energy flux density parallel to the
    local magnetic field. It is positive for transport in the direction of the magnetic
    field and negative for transport in the opposite direction.
  documentation: 'Parallel electron energy flux is the field-aligned scalar component
    of the electron energy flux density. It represents the rate at which electron
    energy crosses a unit area whose normal is parallel to the local magnetic-field
    direction, including conductive, convective, and other modeled electron-energy
    transport contributions as appropriate.


    The parallel component is defined by projecting the electron energy flux density
    vector onto the magnetic-field unit vector:


    $$

    q_{e,\parallel} = \mathbf{Q}_e \cdot \hat{\mathbf{b}}, \qquad \hat{\mathbf{b}}
    = \frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $q_{e,\parallel}$ is the parallel electron energy flux in W m$^{-2}$, $\mathbf{Q}_e$
    is the electron energy flux density vector in W m$^{-2}$, $\mathbf{B}$ is the
    magnetic flux density in T, and $\hat{\mathbf{b}}$ is a dimensionless unit vector
    along $\mathbf{B}$. In collisional fluid descriptions, a common conductive contribution
    is proportional to $-\kappa_{e,\parallel}\nabla_{\parallel}T_e$, while an enthalpy
    or convective contribution is commonly proportional to $n_e T_e v_{e,\parallel}$;
    the reported value is the signed total parallel electron-energy flux used by the
    transport model.


    This quantity is computed in electron energy transport calculations from the modeled
    heat-flux closure, particle flow, temperature gradient, and magnetic geometry.
    It is the energy-flux analog of [parallel_electron_particle_flux](name:parallel_electron_particle_flux)
    and complements transverse components such as [radial_electron_energy_flux](name:radial_electron_energy_flux)
    when decomposing electron energy transport relative to the magnetic field.


    Representative magnitudes are highly regime dependent. Parallel electron energy
    fluxes in confined or edge plasma transport studies can range from about $10^3$-$10^6$
    W m$^{-2}$ in weakly driven regions to $10^6$-$10^8$ W m$^{-2}$ or more along
    scrape-off-layer field lines connected to strong exhaust power.


    Sign convention: Positive when the electron energy flux is directed along $\hat{\mathbf{b}}
    = \mathbf{B}/|\mathbf{B}|$.'
  unit: W.m^-2
  physics_domain: transport
  links:
  - name:poloidal_electron_energy_flux
  - name:parallel_ion_energy_flux
  - name:parallel_ion_state_energy_flux
  sources:
