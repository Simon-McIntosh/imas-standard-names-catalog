- name: ion_diffusion_coefficient
  kind: scalar
  status: draft
  description: Particle diffusion coefficient for thermal ions, governing radial transport
    due to collisional and turbulent processes in the confined plasma.
  documentation: 'The ion diffusion coefficient $D_i$ parameterizes the radial particle
    flux of thermal ions in the neoclassical and anomalous transport equations, relating
    the flux density to the ion density gradient via $

    Gamma_i = -D_i \nabla n_i$. This coefficient captures both collisional (neoclassical)
    transport and turbulent (anomalous) contributions, with typical values ranging
    from $10^{-2}\,\text{m}^2/\text{s}$ in the core to $10^{-1}\,\text{m}^2/\text{s}$
    near the edge of H-mode tokamak plasmas. The diffusion coefficient is inferred
    from transport analysis codes that solve the continuity equation for each ion
    species, using measured density profiles and sources. This scalar quantity differs
    from the [ion momentum diffusion coefficient](name:poloidal_ion_momentum_diffusion_coefficient)
    which governs toroidal rotation damping, and from the [neutral state energy diffusion
    coefficient](name:neutral_state_energy_diffusion_coefficient) for neutral species.
    The sign convention ensures that particle transport is directed down the density
    gradient (outward) for a positive ion density gradient minus an inward pinch term.


    Sign convention: Positive when the particle flux is directed radially outward
    (down the density gradient for a monotonically decreasing density profile).


    The diffusion coefficient is independent of the specific ion charge state and
    applies to the bulk ion population, distinct from the enhanced diffusivity at
    a neoclassical tearing mode [center](name:diffusion_coefficient_at_neoclassical_tearing_mode_center).'
  unit: '1'
  physics_domain: transport
  links:
  - name:poloidal_ion_momentum_diffusion_coefficient
  - name:neutral_state_energy_diffusion_coefficient
  - name:diffusion_coefficient_at_neoclassical_tearing_mode_center
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/a
    dd_path: transport_solver_numerics/derivatives_1d/ion/a
    status: composed
- name: ion_mass
  kind: scalar
  status: draft
  description: Mass of an ion species, including molecular ions, expressed in unified
    atomic mass units (u) for use in transport and atomic physics calculations.
  documentation: The mass of an ion species quantifies the inertial and collisional
    properties of charged particles in the plasma, directly affecting gyroradius,
    cyclotron frequency, and energy exchange rates. In fusion plasmas, this mass can
    range from 1 u for protons to over 200 u for high-Z impurities like tungsten,
    and it is a key input for calculating the Coulomb logarithm and ion thermal velocity.
    For molecular ions, the mass is the sum of the constituent atomic masses, distinguished
    from the per-nucleon value given by [ion_atomic_mass](name:ion_atomic_mass). The
    mass also determines the isotope-dependent drift velocities and is essential for
    modeling impurity transport and neutral beam injection. See also [neutral_mass](name:neutral_mass)
    for neutral species and [ion_count](name:ion_count) for the number of atoms per
    molecular ion.
  unit: u
  physics_domain: transport
