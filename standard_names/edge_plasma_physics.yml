- name: toroidal_neutral_momentum_source
  kind: scalar
  status: active
  description: "Toroidal component of the area-normalized momentum source for the\
    \ neutral population in the edge plasma, summed over all neutral states. Its sign\
    \ distinguishes neutral momentum transfer along increasing versus decreasing toroidal\
    \ angle in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal component of the area-normalized momentum source for
    the neutral population in the edge plasma, summed over all neutral states, is
    the net neutral momentum transfer per unit area resolved along the toroidal direction.
    It is one component of the aggregate [neutral momentum source](name:neutral_momentum_source)
    acting in the neutral momentum balance.


    The toroidal component is defined by projecting the parent source vector onto
    the toroidal unit vector:


    $$

    S_{\phi,n} = \boldsymbol{S}_n \cdot \hat{\phi}

    $$


    where $S_{\phi,n}$ is the toroidal neutral momentum source, $\boldsymbol{S}_n$
    is the area-normalized [neutral momentum source](name:neutral_momentum_source)
    vector, and $\hat{\phi}$ is the toroidal unit vector in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Here $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height.


    The quantity is summed over all neutral states and excludes ion momentum sources.
    Unlike the [radial neutral momentum source](name:radial_neutral_momentum_source),
    [poloidal neutral momentum source](name:poloidal_neutral_momentum_source), and
    [parallel neutral momentum source](name:parallel_neutral_momentum_source), it
    resolves momentum transfer along the toroidal direction rather than along major
    radius, the local poloidal direction, or the local magnetic-field direction.


    Sign convention: Positive when the neutral momentum source points in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_source
  - name:poloidal_neutral_momentum_source
  arguments:
