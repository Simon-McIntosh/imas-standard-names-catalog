- name: toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Density-weighted toroidal bulk-flow velocity of carbon impurity ions,
    averaged over the last closed magnetic flux surface at the plasma boundary.
  documentation: 'Flux-surface-averaged toroidal carbon velocity is the density-weighted
    mean toroidal bulk-flow velocity of carbon impurity ions over the last closed
    magnetic flux surface. All carbon ion charge states are included in the mean.


    The flux-surface average is defined by


    $$

    \langle V_\phi \rangle_{\mathrm{FS}} = \frac{\oint V_\phi\,dl/B_p}{\oint dl/B_p}

    $$


    where $V_\phi$ is the toroidal velocity component, $dl$ is poloidal arc length
    along the flux surface, and $B_p$ is the magnitude of the poloidal magnetic field.
    The quantity is distinct from the local [toroidal carbon velocity at the plasma
    boundary](name:toroidal_carbon_velocity_at_plasma_boundary) and from velocities
    of other impurity species.


    Sign convention: Positive when the carbon-ion flow points in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
