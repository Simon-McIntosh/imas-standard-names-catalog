name: ion_radiated_power_inside_last_closed_flux_surface
status: draft
description: Total electromagnetic power radiated by all ion species within the volume
  enclosed by the last closed flux surface (LCFS).
documentation: 'The ion radiated power inside the LCFS, $P_{\mathrm{rad,ion}}^{\mathrm{LCFS}}$,
  is the volume integral of the ion emissivity $\epsilon_{\mathrm{ion}}(\mathbf{r})$
  over the confined plasma region: $$P_{\mathrm{rad,ion}}^{\mathrm{LCFS}} = \int_{V_{\mathrm{LCFS}}}
  \epsilon_{\mathrm{ion}}(\mathbf{r})\, dV,$$ where $\epsilon_{\mathrm{ion}}$ (W m$^{-3}$)
  includes line radiation, bremsstrahlung, and recombination radiation from all ion
  charge states. Dominant contributions arise from partially stripped impurity ions
  (e.g., carbon, tungsten) via excitation and recombination processes; in metallic-wall
  tokamaks tungsten radiation alone can account for $>$50% of $P_{\mathrm{rad,ion}}^{\mathrm{LCFS}}$.
  Typical values range from a few hundred kW in medium-size devices to tens of MW
  in ITER-class machines. The quantity is inferred from bolometric tomography combined
  with spectroscopic decomposition, or computed by impurity-transport codes such as
  STRAHL or SANCO. Together with the electron contribution, the total confined radiated
  power sets the radiation fraction $f_{\mathrm{rad}} = P_{\mathrm{rad}} / P_{\mathrm{heat}}$,
  a key parameter for detachment and divertor heat-flux control. See also `electron_radiated_power_inside_flux_surface`
  for the electron channel and `ion_radiated_power_inside_flux_surface` for the flux-surface-resolved
  profile.'
