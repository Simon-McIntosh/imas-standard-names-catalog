- name: ethane_source_rate
  kind: scalar
  status: active
  description: Instantaneous ethane-gas injection rate into the plasma vessel, expressed
    as equivalent electrons per second, with 18 equivalent electrons assigned to each
    neutral C2H6 molecule.
  documentation: 'This quantity is the instantaneous rate at which neutral ethane
    molecules are delivered to the plasma vessel, converted to an equivalent-electron
    rate. It counts the electrons associated with neutral molecular composition, not
    free electrons produced by ionization.


    $$

    \dot{N}_{\mathrm{eq}}(t)=18\,\dot{N}_{\mathrm{C_2H_6}}(t)

    $$


    where $\dot{N}_{\mathrm{eq}}$ is the equivalent-electron injection rate, $\dot{N}_{\mathrm{C_2H_6}}$
    is the neutral ethane molecular injection rate in molecules per second, and $t$
    is time in seconds. The factor $18=2\times6+6\times1$ is the total atomic-number
    electron count of one C2H6 molecule.


    This is an instantaneous rate rather than a cumulative inventory; its time integral
    gives the accumulated equivalent-electron count represented by [accumulated ethane
    count](name:accumulated_ethane_count). It excludes other molecular species, including
    the distinct [ethylene source rate](name:ethylene_source_rate).'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
