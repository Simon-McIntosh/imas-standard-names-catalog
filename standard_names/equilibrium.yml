- name: major_radius_of_plasma_boundary
  kind: scalar
  status: draft
  description: Major-radius coordinate of a location on the plasma-boundary contour
    in the right-handed cylindrical (R, phi, Z) frame, measured from the toroidal
    symmetry axis.
  documentation: 'The major radius of the plasma boundary is the coordinate $R_b$
    of a point on the outermost closed flux-surface contour, measured from the toroidal
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame. In a limited
    plasma this contour is the last closed flux surface, while in a diverted plasma
    it is the separatrix contour.


    Using a contour parameter $s$, the boundary can be parameterized by $(R_b(s),
    Z_b(s))$ at fixed toroidal angle $\phi$. For a flux-surface boundary, the contour
    is defined by the poloidal-flux condition


    $$

    \psi(R_b(s), Z_b(s)) = \psi_b

    $$


    where $R_b$ is the boundary major-radius coordinate in m, $Z_b$ is the boundary
    vertical coordinate in m, $\psi$ is the poloidal magnetic flux in Wb, and $\psi_b$
    is the boundary value of that flux in Wb. The parameter $s$ labels position along
    the poloidal contour, commonly as arc length in m ordered counter-clockwise in
    the $(R,Z)$ cross-section when plotted with $R$ increasing to the right and $Z$
    upward; changing this ordering only re-labels the same curve.


    The coordinate is obtained from an equilibrium reconstruction by tracing the boundary
    flux contour and recording its $R$ value at each contour location. Together with
    [vertical_coordinate_of_plasma_boundary](name:vertical_coordinate_of_plasma_boundary),
    it specifies the plasma cross-sectional shape and is used to derive geometric
    quantities such as [length_of_plasma_boundary](name:length_of_plasma_boundary)
    and [minor_radius_of_plasma_boundary](name:minor_radius_of_plasma_boundary).


    Typical magnitudes are device-size dependent and are comparable to the machine
    major radius. Along a single boundary contour, $R_b$ spans the radial interval
    between the inboard and outboard plasma edges, approximately from $R_0-a$ to $R_0+a$,
    where $R_0$ is the magnetic-axis major radius and $a$ is the plasma minor-radius
    scale, both expressed in meters.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:minor_radius_of_plasma_boundary
  - name:flux_surface_averaged_major_radius
  sources:
