- name: line_averaged_effective_charge
  kind: scalar
  status: active
  description: Line-averaged effective charge of the plasma, equal to the chord-length
    average of local effective ionic charge along a specified viewing path.
  documentation: 'The line-averaged effective charge is the chord-length mean of the
    local effective ionic charge encountered along a specified plasma-crossing path.
    It characterizes the impurity content weighted along that path rather than at
    a single location.


    The defining relation is:


    $$

    \langle Z_\text{eff} \rangle_L = \frac{1}{L} \int_\mathcal{L} Z_\text{eff}(l)\,dl

    $$


    where $Z_\text{eff}(l)$ is the local effective charge at path coordinate $l$,
    $\mathcal{L}$ is the chord, and $L$ is its total length. The parent [effective
    charge](name:effective_charge) defines the local quantity being averaged. This
    path average is distinct from the [volume-averaged effective charge](name:volume_averaged_effective_charge),
    which weights the plasma volume rather than a chord.'
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:effective_charge
  - name:volume_averaged_effective_charge
  arguments:
  - name: effective_charge
    operator: line_averaged
    operator_kind: qualifier
  sources:
