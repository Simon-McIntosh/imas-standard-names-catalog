name: vertical_coordinate_of_x_point
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of a magnetic X-point, where the poloidal magnetic
  field vanishes and flux surfaces exhibit a hyperbolic topology.
documentation: The vertical coordinate $Z_{\mathrm{X}}$ locates the height of an X-point
  (magnetic saddle point) in the poloidal cross-section, defined by $\nabla \psi =
  0$ with a hyperbolic local topology of the poloidal flux $\psi$. In diverted tokamak
  configurations the lower X-point typically sits at $Z_{\mathrm{X}} \approx -1.0$
  to $-1.5\;\mathrm{m}$ below the midplane; upper X-points mirror this above the midplane
  in double-null geometries. The position is obtained from equilibrium reconstruction
  codes (e.g., EFIT, LIUQE) constrained by external magnetic measurements and, where
  available, motional-Stark-effect data. X-point location critically determines the
  divertor strike-point geometry and heat-flux footprint width. See also `major_radius_of_magnetic_axis`,
  `vertical_coordinate_of_active_limiter_point`, and `elongation_of_plasma_boundary`.
