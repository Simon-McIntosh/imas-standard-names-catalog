name: major_radius_of_langmuir_probe
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of a Langmuir probe tip, specifying its radial
  position in the tokamak cylindrical coordinate system.
documentation: The major radius $R$ (in meters) of a Langmuir probe defines the radial
  location of the probe tip in the $(R, \phi, Z)$ cylindrical coordinate system of
  the device. Langmuir probes are electrostatic diagnostics typically mounted on reciprocating
  drives or fixed tiles in the scrape-off layer (SOL) and divertor region; the probe
  position must be known precisely to map measured quantities such as electron temperature
  $T_e$, electron density $n_e$, and floating potential $V_f$ onto the poloidal flux
  coordinate $\psi_N$. Typical values range from $R \approx 0.5$ m for compact devices
  to $R \approx 6$ m for ITER-class machines, with SOL-mounted probes usually located
  near the last closed flux surface or on divertor targets. Accurate knowledge of
  probe position is critical for constructing SOL profiles and comparing with Thomson
  scattering or reflectometry data. See also `electron_temperature`, `electron_number_density`.
