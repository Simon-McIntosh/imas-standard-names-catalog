- name: total_power_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Aggregate neutral beam injection power carried by all active injector
    units into the vacuum vessel, evaluated before plasma absorption, shinethrough,
    charge-exchange, wall, or other downstream losses are applied.
  documentation: 'Total neutral-beam-injector power is the aggregate rate at which
    kinetic energy is carried by neutral atoms from all active injector units into
    the vacuum vessel. It is a launched source power for the neutral beam injection
    system, distinct from absorbed_power_of_neutral_beam_injector and from net plasma-heating
    quantities such as power_due_to_neutral_beam_injection.


    The total is defined by summing the launched power of each active injector unit:


    $$

    P_{\mathrm{NBI,total}} = \sum_{k \in \mathcal{A}} P_{\mathrm{NBI},k}

    $$


    where $P_{\mathrm{NBI},k}$ is the [power_of_neutral_beam_injector](name:power_of_neutral_beam_injector)
    for injector unit $k$, and $\mathcal{A}$ is the set of active injector units.
    The accounting direction is into the vacuum vessel: each term is the kinetic-energy
    flux delivered across the vessel interface toward the plasma region, and later
    shinethrough, ionization, charge-exchange, wall, or plasma-absorption losses are
    not subtracted from this total.


    In practice, this quantity is evaluated from injector operating measurements such
    as acceleration voltage, extracted beam current, neutralization efficiency, species
    and energy fractions, beamline transmission, and pulse timing, with calorimetry
    or dedicated beam diagnostics used for calibration. For multi-energy neutral beams,
    each injector contribution includes the weighted kinetic-energy flux of all neutral
    species components launched by that injector.


    Representative values range from $10^5$-$10^6$ W for small or commissioning injectors
    to $10^6$-$5 \times 10^7$ W for multi-injector tokamak heating systems; the value
    is zero when no neutral beam injector is active. It is the neutral-beam analog
    of aggregate launched-power quantities for other auxiliary heating systems, such
    as [total_power_of_ion_cyclotron_heating_antenna](name:total_power_of_ion_cyclotron_heating_antenna)
    and total_power_of_electron_cyclotron_launcher.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_of_neutral_beam_injector
  - name:total_power_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:summary/heating_current_drive/power_launched_nbi/value
    dd_path: summary/heating_current_drive/power_launched_nbi/value
    status: composed
- name: vertical_angle_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Vertical inclination angle of the central beamlet of a neutral beam
    injector, measured from the horizontal plane to the beamlet axis.
  documentation: 'The vertical angle of a neutral beam injector characterizes the
    elevation of the central beamlet axis with respect to the horizontal plane, encoding
    the upward or downward tilt component of the beam''s injection direction. Together
    with the toroidal pointing geometry described by [angle_of_neutral_beam_injector](name:angle_of_neutral_beam_injector)
    and the tangency major radius [beam_major_radius_of_neutral_beam_injector](name:beam_major_radius_of_neutral_beam_injector),
    this angle fully specifies the 3D trajectory of the central beam axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The angle $\alpha_v$ is the elevation of the central beamlet unit direction vector
    $\hat{b}$ above the horizontal plane:


    $$

    \alpha_v = \arcsin\!\left(\hat{b} \cdot \hat{Z}\right)

    $$


    where $\hat{Z}$ is the vertical unit vector and $\hat{b}$ is the unit vector along
    the central beamlet axis, with $\alpha_v = 0$ for a perfectly horizontal beam
    and $|\alpha_v| < \pi/2$ for any physical configuration.


    This geometric parameter is fixed by the physical design and alignment of the
    injector unit and its duct orientation, established from engineering design specifications
    and optical survey measurements. The vertical_width_of_neutral_beam_injector describes
    the vertical spatial extent of the full beamlet group at the injector aperture,
    complementing this directional quantity.


    Sign convention: Positive when the central beamlet is directed upward, in the
    $+Z$ direction above the horizontal plane.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:angle_of_neutral_beam_injector
  - name:beam_major_radius_of_neutral_beam_injector
