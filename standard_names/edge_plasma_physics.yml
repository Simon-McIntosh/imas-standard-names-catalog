- name: krypton_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of krypton ions at the H-mode pedestal top, summed over
    all ionization states. The pedestal top is the core-side end of the steep edge
    transport barrier.
  documentation: 'Krypton density at the pedestal is the local elemental krypton ion
    number density evaluated at the pedestal top, the core-side end of the steep H-mode
    edge transport barrier. It represents the total krypton ion population at that
    location rather than the density of a single charge state.


    The quantity is the charge-state sum of charge-resolved krypton ion densities
    at the pedestal top:


    $$

    n_{\mathrm{Kr,ped}} = \sum_{q=1}^{Z_{\mathrm{Kr}}} n_{\mathrm{Kr}^{q+},\mathrm{ped}}

    $$


    where $n_{\mathrm{Kr,ped}}$ and $n_{\mathrm{Kr}^{q+},\mathrm{ped}}$ are number
    densities in m^-3, $q$ is the dimensionless ion charge state, and $Z_{\mathrm{Kr}}=36$
    is the dimensionless nuclear charge of krypton.


    The pedestal-top location is identified from the transition between the steep
    edge transport-barrier region and the flatter core plasma. Charge-state-resolved
    krypton densities are inferred from spectroscopic constraints combined with atomic
    physics, ionization-balance, or impurity-transport modeling; the summed density
    removes dependence on which individual krypton charge states dominate locally.


    Because krypton is usually used as a trace radiating impurity, its pedestal density
    is strongly scenario dependent and is commonly interpreted together with the local
    electron density or krypton concentration rather than by a universal absolute
    range.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:krypton_density_at_magnetic_axis
  - name:krypton_density_at_divertor_target
  arguments:
  - name: density_at_pedestal
    operator: krypton
    operator_kind: qualifier
- name: lithium_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of ionized lithium at the H-mode pedestal top, equal
    to the local sum over Li+, Li2+, and Li3+ charge states. Neutral lithium atoms
    are excluded, so the quantity is non-negative and expressed per cubic meter.
  documentation: 'Lithium density at the pedestal is the local number density of ionized
    lithium evaluated at the H-mode pedestal top, where the steep-gradient edge transport
    barrier transitions toward the flatter core plasma. It includes the lithium ion
    charge states Li$^+$, Li$^{2+}$, and Li$^{3+}$, and excludes neutral lithium atoms,
    lithium molecules, and wall-bound lithium. The value is a local pedestal-top density,
    not an average over the pedestal region.


    The pedestal-top lithium-ion density is defined by the charge-state sum:


    $$

    n_{\mathrm{Li,ped}} = \sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}\big|_{\mathrm{ped}}

    $$


    where $n_{\mathrm{Li}^{q+}}\big|_{\mathrm{ped}}$ is the local number density of
    lithium ions with charge state $q+$ at the pedestal top. The neutral density $n_{\mathrm{Li}^0}$
    is not included in this sum.


    In practice, this quantity is inferred from lithium-sensitive spectroscopy, charge-exchange
    or emission analysis where available, and impurity transport or collisional-radiative
    modeling constrained by local electron density and temperature. The pedestal-top
    location is usually identified from steep-gradient-region structure in measured
    or reconstructed edge plasma quantities, then the lithium charge-state densities
    are evaluated at that location.


    Typical values are strongly scenario dependent. In plasmas without an active lithium
    source the value may be zero or below diagnostic detectability, while lithium-conditioned
    or lithium-injected plasmas often remain in a trace-impurity range of about $10^{14}$-$10^{18}$
    m$^{-3}$ at the pedestal top; higher local values can occur during strong transient
    injection.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:lithium_density_at_plasma_boundary
  - name:lithium_density_at_limiter
  - name:argon_density_at_pedestal
  arguments:
  - name: density_at_pedestal
    operator: lithium
    operator_kind: qualifier
- name: lithium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of ionized lithium impurity at the plasma boundary,
    identified with the separatrix. It is summed over Li+, Li2+, and Li3+ charge states,
    excludes neutral lithium, and is a non-negative scalar in m^-3.
  documentation: 'Lithium density at the plasma boundary is the number density of
    ionized lithium impurity at the separatrix, the interface between closed magnetic
    flux surfaces and open scrape-off-layer field lines. It includes all ionized lithium
    charge states, Li$^+$ through Li$^{3+}$, and excludes neutral lithium. As a particle
    number density, it is non-negative and has unit m$^{-3}$.


    The charge-state-summed lithium ion density is defined by:


    $$

    n_\mathrm{Li} = \sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}

    $$


    where $n_\mathrm{Li}$ is the total ionized lithium number density in m$^{-3}$,
    $n_{\mathrm{Li}^{q+}}$ is the number density in m$^{-3}$ of lithium ions with
    charge state $q$, and $q=1,2,3$ for lithium. Neutral lithium, $\mathrm{Li}^0$,
    is not included.


    Boundary lithium ion density is inferred from edge impurity spectroscopy, charge-exchange
    measurements when available, atomic-physics modeling, and consistency with separatrix
    electron density and temperature. When represented as a single boundary scalar,
    it denotes a representative separatrix value; it should not be interpreted as
    necessarily flux-surface averaged unless the quantity is explicitly identified
    as flux-surface averaged, as in [flux_surface_averaged_electron_density_at_plasma_boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary).


    Typical separatrix lithium ion densities are often trace levels of about $10^{14}$-$10^{17}$
    m$^{-3}$, but active lithium injection, evaporation, or strong lithium wall sources
    can raise values toward $10^{18}$ m$^{-3}$. These values are usually small compared
    with [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary)
    and the corresponding electron density, but they can still affect edge radiation
    and [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary).
    The concept is analogous to other impurity boundary densities such as [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_plasma_boundary
  - name:lithium_density_at_pedestal
  - name:lithium_density_at_divertor_target
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: lithium
    operator_kind: qualifier
- name: momentum_coefficient
  kind: vector
  status: draft
  description: Dimensionless coefficient that scales the collisionless free-streaming
    upper bound on momentum-flux density in multi-fluid edge plasma transport closures,
    capping the flux magnitude while leaving its sign direction unchanged.
  documentation: "In multi-fluid edge plasma transport models, gradient-driven diffusive\
    \ closures can produce momentum-flux densities that exceed the physically realizable\
    \ collisionless free-streaming limit in steep-gradient regions such as the scrape-off\
    \ layer and divertor. A flux-limiter coefficient $\\alpha_m$ is introduced to\
    \ bound the effective flux: the limited momentum-flux density magnitude cannot\
    \ exceed $\\alpha_m$ times a free-streaming reference scale, while the sign follows\
    \ the underlying diffusive flux direction.\n\nThe limited momentum-flux density\
    \ $\\Pi^{\\mathrm{lim}}$ is formed by the harmonic-mean combination:\n\n$$\n\\\
    Pi^{\\mathrm{lim}} = \\frac{\\alpha_m \\, \\Pi^{\\mathrm{FS}} \\cdot \\Pi^{\\\
    mathrm{diff}}}{|\\Pi^{\\mathrm{diff}}| + \\alpha_m \\, \\Pi^{\\mathrm{FS}}}\n\
    $$\n\nwhere $\\Pi^{\\mathrm{diff}}$ is the collisional diffusive momentum-flux\
    \ estimate, $\\Pi^{\\mathrm{FS}} = m n v_{\\mathrm{th}}^2$ is the free-streaming\
    \ scale with $m$ the particle mass, $n$ the number density, and $v_{\\mathrm{th}}$\
    \ the thermal speed. When $|\\Pi^{\\mathrm{diff}}| \\gg \\alpha_m \\Pi^{\\mathrm{FS}}$\
    \ the flux saturates at $\\pm \\alpha_m \\Pi^{\\mathrm{FS}}$; when $|\\Pi^{\\\
    mathrm{diff}}| \\ll \\alpha_m \\Pi^{\\mathrm{FS}}$ the diffusive value is recovered\
    \ unchanged.\n\nSpecializations target individual projection directions, such\
    \ as parallel_momentum_coefficient for field-aligned transport, and individual\
    \ particle populations, such as [ion_state_momentum_coefficient](name:ion_state_momentum_coefficient)\
    \ for specific ion charge states or [parallel_neutral_state_momentum_coefficient](name:parallel_neutral_state_momentum_coefficient)\
    \ for neutral-particle parallel transport. The coefficient is intrinsically non-negative;\
    \ values in the range 0.1\u20131 are common in edge-plasma simulations, selected\
    \ by calibration against experimental separatrix and divertor data."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_momentum_coefficient
  - name:parallel_neutral_state_momentum_coefficient
  sources:
  - id: derived:momentum_coefficient
    status: composed
- name: neon_density_at_pedestal
  kind: scalar
  status: draft
  description: Neon ion number density at the H-mode pedestal top, summed over all
    ionization charge states of the neon element. It is a non-negative elemental impurity
    density at the transition from the steep edge transport barrier to the flatter
    core plasma.
  documentation: 'The neon density at the pedestal is the total number density of
    neon ions at the H-mode pedestal top, where the steep-gradient edge transport
    barrier joins the more weakly varying confined plasma. It is an elemental impurity
    density: ions in different neon charge states contribute to the same total. As
    a number density, it is non-negative and has units of $\mathrm{m}^{-3}$.


    The charge-state-summed elemental density is defined by


    $$

    n_{\mathrm{Ne,ped}} = \sum_{q=1}^{Z_\mathrm{Ne}} n_{\mathrm{Ne}^{q+},\mathrm{ped}}

    $$


    where $n_{\mathrm{Ne,ped}}$ is the neon ion number density at the pedestal top
    in $\mathrm{m}^{-3}$, $n_{\mathrm{Ne}^{q+},\mathrm{ped}}$ is the number density
    in $\mathrm{m}^{-3}$ of neon ions with charge state $q+$ at the pedestal top,
    and $Z_\mathrm{Ne}=10$ is the nuclear charge of neon.


    In practice, this quantity is obtained by summing resolved charge-state densities,
    or by inferring the elemental neon content from impurity measurements together
    with a pedestal-top location determined from plasma profiles and equilibrium information.
    It is commonly interpreted relative to [electron_density_at_pedestal](name:electron_density_at_pedestal)
    or main_ion_density_at_pedestal, for example through the concentration $n_{\mathrm{Ne,ped}}/n_{e,\mathrm{ped}}$,
    because neon is usually a trace or minor impurity rather than the dominant ion
    species.


    Typical values are strongly scenario-dependent, especially in plasmas with deliberate
    neon seeding for edge radiation control. No device-independent absolute range
    is implied by the definition; the physically useful scale is usually the neon
    concentration relative to the local pedestal electron or main-ion density.


    This quantity is the neon counterpart of pedestal impurity densities such as [nitrogen_density_at_pedestal](name:nitrogen_density_at_pedestal),
    [oxygen_density_at_pedestal](name:oxygen_density_at_pedestal), and [xenon_density_at_pedestal](name:xenon_density_at_pedestal).
    The same elemental neon density evaluated at an internal transport barrier is
    represented by [neon_density_at_internal_transport_barrier](name:neon_density_at_internal_transport_barrier).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
