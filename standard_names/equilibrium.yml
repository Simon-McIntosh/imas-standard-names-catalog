- name: derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_volume_of_flux_surface
  kind: scalar
  status: active
  description: Derivative of the enclosed volume of a nested magnetic flux surface
    with respect to its signed poloidal magnetic-flux label.
  documentation: 'This quantity is the local geometric rate at which the volume enclosed
    by a nested magnetic flux surface changes as the signed poloidal magnetic-flux
    label changes. It describes the differential volume associated with an increment
    of that label, rather than the enclosed volume itself.


    The defining derivative is


    $$

    \frac{dV}{d\psi}(\psi) = \lim_{\Delta\psi \to 0} \frac{V(\psi + \Delta\psi) -
    V(\psi)}{\Delta\psi}

    $$


    where $V(\psi)$ is the volume enclosed by the nested magnetic flux surface labeled
    by the signed poloidal magnetic flux $\psi$, and $\Delta\psi$ is an increment
    of that flux label.


    The quantity applies to nested closed magnetic flux surfaces and uses the cumulative
    volume interior to each surface, ordered from the magnetic axis toward the outermost
    closed surface. It is a scalar geometric metric based on dimensional poloidal
    magnetic flux; it excludes volume outside the selected surface and is not an integral
    over a finite range of flux labels.


    It is the differential counterpart of the [volume of a flux surface](name:volume_of_flux_surface),
    obtained by differentiating that enclosed-volume quantity with respect to $\psi$.
    As a flux-coordinate Jacobian factor, it contributes to flux-surface averages,
    pressure-balance relations, and one-dimensional transport formulations. It must
    be distinguished from a derivative with respect to the [normalized poloidal flux
    coordinate](name:normalized_poloidal_flux_coordinate), which includes the coordinate
    normalization in its chain rule.


    Sign convention: Positive when the enclosed volume increases toward increasing
    signed poloidal magnetic flux $\psi$; with positive plasma current in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height, $\psi$ decreases outward and the outward increase of volume therefore
    gives a negative derivative.'
  unit: Wb^-1.m^3
