- name: density_at_limiter
  kind: scalar
  status: draft
  description: Local particle number density of any plasma species evaluated in the
    boundary plasma immediately adjacent to the plasma-facing limiter surface, on
    the plasma side of the magnetic presheath or sheath entrance.
  documentation: "Number density of a specified plasma species \u2014 electrons, fuel\
    \ ions, or impurity ions \u2014 evaluated at the plasma-limiter interface on the\
    \ plasma side of the magnetic presheath or sheath entrance. The limiter terminates\
    \ open magnetic field lines in the scrape-off layer (SOL), and this boundary density\
    \ sets the particle source for both the confining plasma and for wall-material\
    \ interactions including sputtering, recycling, and impurity release.\n\nThe macroscopic\
    \ number density is related to the velocity distribution function $f_s$ of species\
    \ $s$ by:\n\n$$\nn_s = \\int f_s(\\mathbf{v}) \\, d^3v\n$$\n\nwhere the integral\
    \ is taken over all velocities at the evaluation point immediately adjacent to\
    \ the limiter.\n\nQuasineutrality at the sheath entrance couples the [electron_density_at_limiter](name:electron_density_at_limiter)\
    \ to the charge-weighted sum of ion densities, $n_e \\approx \\sum_s Z_s n_s$,\
    \ where $Z_s$ is the ion charge number of species $s$. The charge-state-summed\
    \ ion total is given by [total_ion_density_at_limiter](name:total_ion_density_at_limiter),\
    \ while impurity species such as [carbon_density_at_limiter](name:carbon_density_at_limiter)\
    \ and [oxygen_density_at_limiter](name:oxygen_density_at_limiter) contribute to\
    \ the local effective charge. The analogous family at divertor target surfaces\
    \ is [density_at_divertor_target](name:density_at_divertor_target).\n\nThis density\
    \ is measured by Langmuir probes embedded in or flush-mounted near the limiter,\
    \ or inferred from edge spectroscopy combined with ionization balance modeling.\
    \ Typical boundary plasma densities at limiter surfaces span $10^{17}$\u2013$10^{20}$\
    \ m$^{-3}$ depending on species, heating power, and plasma configuration.\n\n\
    Sign convention: Positive when the local plasma contains particles of the specified\
    \ species at the evaluation point adjacent to the limiter."
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density_at_limiter
  - name:total_ion_density_at_limiter
  - name:carbon_density_at_limiter
  - name:oxygen_density_at_limiter
  - name:density_at_divertor_target
- name: argon_density_at_limiter
  kind: scalar
  status: draft
  description: Argon ion number density immediately adjacent to a limiter material
    surface, evaluated in the boundary plasma at the plasma-limiter contact. It represents
    the local concentration of ionized argon impurity at the plasma-wall interface.
  documentation: 'Argon density at the limiter is the number density of ionized argon
    in the boundary plasma immediately adjacent to a material limiter surface. The
    evaluation point is the plasma-facing sheath-edge region at the plasma-limiter
    contact, not inside the solid limiter and not a core, pedestal, or flux-surface-averaged
    value.


    For an argon impurity population resolved by charge state, the local ion density
    is


    $$

    n_{\mathrm{Ar,lim}} = \lim_{\Delta V \to 0} \frac{1}{\Delta V}\sum_{q=1}^{18}
    \Delta N_{\mathrm{Ar}^{q+}}

    $$


    where $q$ is the argon charge state, $\Delta N_{\mathrm{Ar}^{q+}}$ is the number
    of argon ions in charge state $q$ within a small plasma sampling volume adjacent
    to the limiter, and $\Delta V$ is that volume in m$^3$, giving $n_{\mathrm{Ar,lim}}$
    in m$^{-3}$. Neutral argon atoms are not included in this ion density.


    In practice this quantity is obtained from boundary-plasma and impurity-transport
    modeling, or inferred from argon line emission using collisional-radiative modeling
    together with local electron density and temperature. It is governed by parallel
    transport to the limiter, ionization and recombination balance, recycling and
    impurity source rates, and radiative cooling in the scrape-off-layer plasma near
    the limiter.


    Typical values for trace argon seeding near limiter contact are about $10^{14}$-$10^{18}$
    m$^{-3}$. Strong local impurity sources or highly radiating edge conditions can
    produce values approaching $10^{19}$ m$^{-3}$, while unseeded plasmas may be below
    spectroscopic detectability.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:argon_density_at_plasma_boundary
  - name:argon_density_at_pedestal
  - name:neon_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: argon
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/argon/value
    dd_path: summary/local/limiter/n_i/argon/value
    status: composed
- name: beryllium_density_at_limiter
  kind: scalar
  status: draft
  description: Local number density of charged beryllium ions in the boundary plasma
    immediately adjacent to a limiter surface, summed over all charged ionization
    states. Neutral beryllium atoms are not included.
  documentation: 'Beryllium density at a limiter is the local total number density
    of charged beryllium ions in the plasma immediately next to a limiter material
    surface. It is an impurity ion density for beryllium charge states and excludes
    neutral beryllium atoms, molecules, dust, and beryllium bound in the solid wall.


    The total charged beryllium ion density is the sum over the charged ionization
    states of beryllium:


    $$

    n_{\mathrm{Be,lim}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{Be,lim}}$ is the total charged beryllium ion density in m^-3,
    $n_{\mathrm{Be}^{q+},\mathrm{lim}}$ is the number density in m^-3 of beryllium
    ions with charge $q e$, and $q=1,\ldots,4$ for beryllium.


    In practice, this density may be evaluated by summing charge-state densities in
    a boundary-plasma or impurity-transport calculation, or inferred from charge-state-sensitive
    spectroscopic observations together with an atomic population model and local
    plasma parameters. The definition is independent of the method used to obtain
    the charge-state densities.


    As a number density, its physically allowed range is $n_{\mathrm{Be,lim}} \ge
    0$ m^-3. A value of 0 m^-3 means that no charged beryllium ions are present at
    the limiter location within the sensitivity of the model or measurement; finite
    values are often interpreted relative to the local electron density or main-ion
    density because absolute magnitudes depend strongly on local boundary-plasma conditions
    and discharge phase.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_divertor_target
  arguments:
  - name: density_at_limiter
    operator: beryllium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/beryllium/value
    dd_path: summary/local/limiter/n_i/beryllium/value
    status: composed
- name: boron_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed boron ion number density immediately adjacent to
    a plasma-facing limiter surface.
  documentation: 'Boron density at the limiter is the local number density of boron
    ions in the plasma volume immediately adjacent to a plasma-facing limiter, where
    open scrape-off-layer field lines intersect a material boundary. Unless a single
    charge state is specified, it is the charge-state-summed boron ion population
    and is the boron-resolved component of [density_at_limiter](name:density_at_limiter).


    For a representative small plasma volume next to the limiter, the localized density
    $n_{B,\mathrm{lim}}$ is the boron ion count per unit volume:


    $$

    n_{B,\mathrm{lim}} = \frac{N_B}{V}

    $$


    where $N_B$ is the number of boron ions in the sampled volume and $V$ is that
    volume in m$^3$, giving $n_{B,\mathrm{lim}}$ in m$^{-3}$. Because fully stripped
    boron carries charge $Z_B = 5$, its contribution to the effective charge $Z_\mathrm{eff}
    = \sum_k n_k Z_k^2 / n_e$ is large relative to its number fraction, so even sub-percent
    boron concentrations affect plasma resistivity and the radiated power budget.


    This quantity is inferred from edge impurity emission spectroscopy combined with
    collisional-radiative or atomic-rate modeling, from active charge-exchange recombination
    spectroscopy, or from scrape-off-layer transport calculations constrained by limiter
    source estimates. The limiter value refers to the plasma-side impurity density
    adjacent to the material surface, not to boron bound within the solid limiter
    material.


    Typical limiter-adjacent boron densities depend strongly on wall conditioning,
    limiter material history, plasma density, erosion source strength, and ionization
    balance. Trace impurity values in edge modeling are often roughly $10^{14}$-$10^{18}$
    m$^{-3}$, while localized transient sources, boron injection, or freshly boronized
    surfaces can produce values outside this range.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:boron_density_at_pedestal
  - name:boron_density_at_divertor_target
  - name:boron_density_at_plasma_boundary
  arguments:
  - name: density_at_limiter
    operator: boron
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/boron/value
    dd_path: summary/local/limiter/n_i/boron/value
    status: composed
- name: carbon_density_at_limiter
  kind: scalar
  status: draft
  description: Unweighted number density of ionized carbon in the boundary plasma
    immediately adjacent to a limiter, summed over all carbon ionization stages. It
    excludes neutral carbon atoms and does not weight charge states by charge or mass.
  documentation: 'Carbon density at a limiter is the local number density of carbon
    impurity ions in the boundary plasma next to a limiter surface. It is an unweighted
    sum over ionized carbon charge states and excludes neutral carbon atoms.


    The charge-state-summed ion density is defined by:


    $$

    n_{\mathrm{C,ion}} = \sum_{q=1}^{6} n_{\mathrm{C}^{q+}}

    $$


    where $n_{\mathrm{C}^{q+}}$ is the number density of carbon ions with charge state
    $q$ in $\mathrm{m}^{-3}$, and $n_{\mathrm{C,ion}}$ is also in $\mathrm{m}^{-3}$.
    The sum runs over ionized carbon from $\mathrm{C}^+$ through fully stripped $\mathrm{C}^{6+}$;
    neutral carbon $\mathrm{C}^0$ is not included.


    In practice this quantity is obtained from local impurity charge-state populations
    in boundary-plasma modeling, or constrained experimentally using carbon line emission
    together with electron density, electron temperature, and collisional-radiative
    modeling. It is sensitive to local impurity sources, ionization balance, transport,
    and the plasma conditions adjacent to the limiter.


    No device-independent typical range is implied by the definition. Values are non-negative,
    reported in $\mathrm{m}^{-3}$, and should be interpreted relative to the local
    edge plasma density and carbon impurity fraction for the discharge being considered.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:oxygen_density_at_limiter
  - name:nitrogen_density_at_limiter
  - name:xenon_density_at_limiter
