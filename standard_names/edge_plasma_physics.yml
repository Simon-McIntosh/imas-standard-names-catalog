- name: argon_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of argon ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile.
  documentation: 'The argon ion number density at the pedestal top quantifies the
    local concentration of argon impurity ions at the shoulder of the H-mode edge
    transport barrier. The pedestal top is the radial position where the steep edge-gradient
    region transitions to the shallower core profile, establishing the inner boundary
    condition for argon impurity transport into the plasma core and setting the argon
    inventory available for radiative power exhaust.


    The local number density is the zeroth velocity-space moment of the argon ion
    distribution function $f_{\rm Ar}$:


    $$

    n_{\rm Ar} = \int f_{\rm Ar}(\mathbf{v}) \, d^3v

    $$


    where $\mathbf{v}$ is the ion velocity. The contribution of pedestal argon to
    the free electron density is $n_e^{\rm Ar} = \bar{Z}_{\rm Ar} \, n_{\rm Ar}$,
    where $\bar{Z}_{\rm Ar}$ is the mean ionization state of argon at the pedestal.


    Pedestal argon density is typically inferred from charge-exchange recombination
    spectroscopy or spectroscopic analysis of argon line emission, supplemented by
    edge impurity transport modeling. Comparing this value with [argon_density_at_plasma_boundary](name:argon_density_at_plasma_boundary)
    characterizes the argon density gradient across the pedestal, while [argon_density_at_magnetic_axis](name:argon_density_at_magnetic_axis)
    reflects core accumulation. The analogous quantity for neon seeding is [neon_density_at_pedestal](name:neon_density_at_pedestal).
    This quantity forms part of the broader [density_at_pedestal](name:density_at_pedestal)
    family describing impurity and main-ion pedestal characterization.


    Typical argon pedestal densities in seeded H-mode discharges range from $10^{15}$
    to $10^{18}$ m$^{-3}$, several orders of magnitude below the main ion pedestal
    density.


    Sign convention: Positive when argon ions populate the pedestal plasma; vanishes
    in the absence of argon seeding.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:argon_density_at_plasma_boundary
  - name:argon_density_at_magnetic_axis
  - name:neon_density_at_pedestal
  - name:density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/argon/value
    dd_path: summary/local/pedestal/n_i/argon/value
    status: composed
- name: argon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Boundary-averaged number density of argon ions on the plasma boundary,
    represented by the last closed flux surface separating the magnetically confined
    plasma from the open-field-line scrape-off layer. Unless a charge state is specified
    separately, argon ions refers to all ionization stages combined.
  documentation: 'Argon density at the plasma boundary is the surface-averaged number
    density of argon ions on the last closed flux surface, also called the separatrix.
    It provides a boundary-representative measure of argon impurity content, distinct
    from local poloidal or toroidal variations, and is the argon analog of other impurity
    boundary densities such as [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary).


    The boundary average over the separatrix surface is defined by


    $$

    n_{\mathrm{Ar},b} = \left\langle n_{\mathrm{Ar}} \right\rangle_{S_\mathrm{sep}}
    = \frac{\int_{S_\mathrm{sep}} n_{\mathrm{Ar}}(\mathbf{x})\, dA}{\int_{S_\mathrm{sep}}
    dA}

    $$


    where $S_\mathrm{sep}$ is the last closed flux surface, $n_{\mathrm{Ar}}(\mathbf{x})$
    is the local total argon ion number density, and $dA$ is the surface area element.
    Unless an individual charge state is explicitly specified, $n_{\mathrm{Ar}}$ denotes
    the sum over all argon ionization stages.


    In experiments, this quantity is inferred from argon line emission using spectroscopic
    measurements together with electron density, electron temperature, and collisional-radiative
    or impurity transport modeling. In simulations and equilibrium-edge coupling,
    it is often computed by averaging the modeled argon density over the separatrix,
    without assuming that the impurity density is constant on that surface.


    Typical values are about $10^{14}-10^{16}$ m^-3 for trace argon concentrations
    and about $10^{16}-10^{18}$ m^-3 during deliberate radiative seeding, depending
    on gas injection rate, edge temperature, ionization balance, transport, and plasma
    size. These values are usually small compared with the total electron or main-ion
    density at the boundary, but can strongly affect edge radiation because argon
    is a high-Z impurity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:argon_density_at_divertor_target
  - name:argon_density_at_pedestal
  - name:neon_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/argon/value
    dd_path: summary/local/separatrix/n_i/argon/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/argon/value
    dd_path: summary/local/separatrix_average/n_i/argon/value
    status: composed
- name: beryllium_density_at_pedestal
  kind: scalar
  status: draft
  description: Local number density of beryllium ions at the H-mode pedestal top.
    Unless a charge state is specified, it is summed over all beryllium ionization
    stages.
  documentation: 'Beryllium density at the pedestal is the local number density of
    beryllium ions at the top of the H-mode edge pedestal, where the steep-gradient
    edge transport barrier connects to the more weakly varying confined-plasma core.
    Unless a particular charge state is specified, the quantity includes all ionized
    beryllium charge states and excludes neutral beryllium atoms. It is the beryllium-specific
    member of the [density_at_pedestal](name:density_at_pedestal) family.


    The summed ion density is defined by adding the local densities of the ionized
    beryllium charge states at the pedestal-top reference position:


    $$

    n_{\mathrm{Be,ped}} = \sum_{q=1}^{4} n_{\mathrm{Be}^{q+}}(r_\mathrm{ped})

    $$


    where $n_{\mathrm{Be,ped}}$ and $n_{\mathrm{Be}^{q+}}$ are number densities in
    m$^{-3}$, $q$ is the positive ion charge state of beryllium, and $r_\mathrm{ped}$
    denotes the pedestal-top reference position.


    In practice this density is inferred from beryllium line emission using charge-exchange
    recombination spectroscopy, vacuum-ultraviolet spectroscopy, or collisional-radiative
    modeling constrained by local electron temperature and electron density. It may
    also be estimated from impurity transport calculations that balance turbulent
    diffusion, neoclassical convection, source recycling, and screening at the plasma
    edge.


    Typical pedestal values in tokamak plasmas with beryllium plasma-facing components
    are $10^{16}$-$10^{18}$ m$^{-3}$, often corresponding to about $10^{-4}$-$10^{-2}$
    of the pedestal electron density. Related radial reference quantities include
    [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    [beryllium_density_at_internal_transport_barrier](name:beryllium_density_at_internal_transport_barrier),
    and [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis);
    related pedestal impurity quantities include [oxygen_density_at_pedestal](name:oxygen_density_at_pedestal).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/pedestal/n_i/beryllium/value
    dd_path: summary/local/pedestal/n_i/beryllium/value
    status: composed
- name: beryllium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of beryllium ions at the plasma boundary (last closed
    flux surface), summed over all ionization stages unless a specific charge state
    is specified.
  documentation: 'The beryllium ion number density at the plasma boundary is the total
    count of beryllium ions per unit volume evaluated at the separatrix, the last
    closed flux surface separating the magnetically confined core plasma from the
    open-field-line scrape-off layer. Beryllium (atomic number $Z = 4$, mass number
    $A = 9$) is a low-Z metallic impurity that enters the plasma primarily through
    physical sputtering of beryllium plasma-facing components. Unless a charge-state-resolved
    quantity is specified, contributions from all ionization stages $\text{Be}^{z+}$
    ($z = 0, 1, 2, 3, 4$) are included.


    The total density at the separatrix is:


    $$

    n_\text{Be}(r_\text{sep}) = \sum_{z=0}^{4} n_{\text{Be}^{z+}}

    $$


    where $n_{\text{Be}^{z+}}$ is the partial density of beryllium ions in the $z$-fold
    ionized state and $r_\text{sep}$ denotes the separatrix location.


    This quantity is inferred from UV and visible spectroscopy of beryllium emission
    lines, complemented by impurity transport modeling constrained by local electron
    density and temperature profiles. It forms the outer radial boundary condition
    for impurity core profiles, linking the central [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    to the downstream [beryllium_density_at_divertor_target](name:beryllium_density_at_divertor_target).
    The pedestal-resolved counterpart [beryllium_density_at_pedestal](name:beryllium_density_at_pedestal)
    characterizes the steep-gradient region just inside the separatrix, while the
    species-agnostic parent [density_at_plasma_boundary](name:density_at_plasma_boundary)
    provides the general definition applicable to any plasma constituent.


    Sign convention: Positive when beryllium ions are present at the plasma boundary;
    number density is intrinsically non-negative as a particle count per unit volume.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:beryllium_density_at_magnetic_axis
  - name:beryllium_density_at_divertor_target
  - name:beryllium_density_at_pedestal
  - name:density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/beryllium/value
    dd_path: summary/local/separatrix/n_i/beryllium/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/beryllium/value
    dd_path: summary/local/separatrix_average/n_i/beryllium/value
    status: composed
- name: boron_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of boron impurity ions at the H-mode pedestal top, where
    the steep-gradient edge transport barrier meets the flatter core profile.
  documentation: "Boron density at the pedestal quantifies the local particle number\
    \ density of boron ions at the radial shoulder of the steep-gradient edge transport\
    \ barrier that characterizes H-mode confinement. Boron (atomic number $Z=5$) is\
    \ a low-Z impurity typically introduced through wall boronization or controlled\
    \ injection, and its pedestal concentration governs both radiative cooling and\
    \ the effective plasma charge $Z_\\mathrm{eff}$.\n\nThe contribution of boron\
    \ to the effective charge is:\n\n$$\nZ_\\mathrm{eff} = \\frac{\\sum_k n_k Z_k^2}{n_e}\n\
    $$\n\nwhere $n_k$ is the number density of ion species $k$, $Z_k$ is the charge\
    \ state, and $n_e$ is the electron number density. For fully stripped boron (B$^{5+}$),\
    \ each boron ion contributes $25/n_e$ to $Z_\\mathrm{eff}$, so even trace concentrations\
    \ measurably elevate the effective charge at the pedestal.\n\nPedestal boron density\
    \ is inferred from charge-exchange recombination spectroscopy targeting boron\
    \ emission lines or from passive spectroscopy of boron line radiation in the pedestal\
    \ region. Typical values range from $10^{16}$ to $10^{18}$ m$^{-3}$ in H-mode\
    \ pedestals, representing fractional concentrations of order 0.1\u20135% of the\
    \ pedestal electron density. As a member of the [density_at_pedestal](name:density_at_pedestal)\
    \ family, this quantity is directly analogous to [carbon_density_at_pedestal](name:carbon_density_at_pedestal)\
    \ and [argon_density_at_pedestal](name:argon_density_at_pedestal). The radial\
    \ evolution of the boron impurity content can be traced through [boron_density_at_magnetic_axis](name:boron_density_at_magnetic_axis),\
    \ [boron_density_at_plasma_boundary](name:boron_density_at_plasma_boundary), and\
    \ [boron_density_at_divertor_target](name:boron_density_at_divertor_target).\n\
    \nSign convention: Positive when the boron ion population is finite and non-zero\
    \ at the pedestal, consistent with particle number density being an intrinsically\
    \ non-negative scalar."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:carbon_density_at_pedestal
  - name:argon_density_at_pedestal
  - name:boron_density_at_magnetic_axis
  - name:boron_density_at_plasma_boundary
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/pedestal/n_i/boron/value
    dd_path: summary/local/pedestal/n_i/boron/value
    status: composed
- name: boron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of boron ions at the last closed flux surface, which
    separates the magnetically confined plasma from the open-field-line scrape-off
    layer.
  documentation: 'Boron (atomic number $Z_B = 5$) is a low-Z impurity introduced into
    tokamaks through boronization to suppress high-Z metallic impurity influx and
    limit radiative losses from the confined plasma. The boron ion number density
    at the plasma boundary is the local concentration of boron ions evaluated at the
    last closed flux surface, the topological boundary separating closed-field-line
    confinement from the open-field-line scrape-off layer. It is the boron-specific
    realization of [density_at_plasma_boundary](name:density_at_plasma_boundary).


    The boron ion number density $n_B$ is the zeroth velocity moment of the boron
    ion phase-space distribution function $f_B$:


    $$

    n_B = \int f_B(\mathbf{x}, \mathbf{v}) \, d^3v

    $$


    evaluated at $\mathbf{x}$ on the separatrix, where $\mathbf{v}$ is the particle
    velocity. Without accompanying charge-state information, $n_B$ represents the
    total boron ion density summed over all ionization stages.


    Boron concentration at the separatrix is inferred from vacuum-ultraviolet spectroscopy
    of boron line emission combined with impurity transport modeling, or from charge-exchange
    recombination spectroscopy when a neutral beam is available. This quantity determines
    boron''s contribution to the local [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary).
    Analogous boundary densities for other seeded impurities are provided by [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary);
    [boron_density_at_divertor_target](name:boron_density_at_divertor_target) gives
    the companion value further downstream at the divertor plate.


    Typical values at the separatrix in boronized tokamaks range from $10^{16}$ to
    $10^{17}$ m$^{-3}$, decreasing between boronization events as the wall coating
    erodes.


    Sign convention: Positive when boron ions are present at the plasma boundary.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:effective_charge_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:xenon_density_at_plasma_boundary
  - name:boron_density_at_divertor_target
  sources:
  - id: dd:summary/local/separatrix/n_i/boron/value
    dd_path: summary/local/separatrix/n_i/boron/value
    status: composed
- name: carbon_density_at_pedestal
  kind: scalar
  status: draft
  description: Carbon ion number density evaluated at the H-mode pedestal top, with
    charge states summed unless a specific ionization state is named.
  documentation: 'Carbon density at the pedestal is the number of carbon impurity
    ions per unit volume at the top of the H-mode edge transport barrier, where the
    steep edge gradients transition toward core plasma conditions. Unless a charge
    state is explicitly specified, it denotes the total carbon ion density summed
    over carbon ionization states rather than a charge-state-resolved population.


    The total carbon ion density at this location can be written as the sum over carbon
    charge states:


    $$

    n_{\mathrm{C,ped}} = \sum_{q=1}^{6} \left. n_{\mathrm{C}^{q+}} \right|_{\mathrm{ped}}

    $$


    where $n_{\mathrm{C,ped}}$ and each charge-state density $n_{\mathrm{C}^{q+}}$
    are in $\mathrm{m}^{-3}$, and $q$ indexes carbon ions from singly ionized to fully
    stripped carbon. Neutral carbon atoms are not included in this ion density.


    In practice, this quantity is inferred from impurity spectroscopy, charge-exchange
    recombination spectroscopy, collisional-radiative modeling, and analysis that
    identifies the pedestal-top location. If only selected charge states are measured,
    the total carbon density requires ionization-balance assumptions to account for
    unobserved charge states.


    For orientation, H-mode pedestal carbon ion densities are commonly of order $10^{16}-10^{18}\
    \mathrm{m}^{-3}$, typically well below the electron density at the same location.
    The value is sensitive to wall material, impurity sources, edge screening, and
    confinement conditions, so comparisons often also use the local ratio $n_{\mathrm{C,ped}}/n_{e,\mathrm{ped}}$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:oxygen_density_at_pedestal
  - name:nitrogen_density_at_pedestal
  - name:carbon_density_at_limiter
  sources:
  - id: dd:summary/local/pedestal/n_i/carbon/value
    dd_path: summary/local/pedestal/n_i/carbon/value
    status: composed
- name: deuterium_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of deuterium ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile.
  documentation: 'Deuterium ion number density at the pedestal top is the deuterium-specific
    instantiation of [density_at_pedestal](name:density_at_pedestal), characterizing
    the primary hydrogenic fuel species at the shoulder of the H-mode edge transport
    barrier. The pedestal top marks the radial flux surface where the steep density
    gradient of the barrier region transitions to the gentler core gradient, and the
    deuterium density at this location governs fueling efficiency, pressure pedestal
    height, and edge-localized mode stability.


    The number density $n_D$ is the zeroth velocity-space moment of the deuterium
    ion distribution function $f_D(\mathbf{v})$:


    $$

    n_D = \int f_D(\mathbf{v}) \, d^3v

    $$


    where $f_D(\mathbf{v})$ (in m$^{-6}$ s$^3$) is evaluated at the pedestal-top radial
    location.


    The pedestal deuterium density is inferred from edge Thomson scattering systems,
    charge exchange recombination spectroscopy mapped to the pedestal region, or from
    fitted profiles combining reflectometry and interferometry data. In DT fuel scenarios,
    the companion quantity [tritium_density_at_pedestal](name:tritium_density_at_pedestal)
    provides the tritium ion density at the same radial location, while [deuterium_density_at_magnetic_axis](name:deuterium_density_at_magnetic_axis)
    supplies the on-axis reference value for core-to-edge comparison.


    Pedestal-top deuterium ion densities in H-mode discharges range from $1 \times
    10^{19}$ m$^{-3}$ near the L-H power threshold to $5 \times 10^{20}$ m$^{-3}$
    in high-density, high-performance scenarios.


    Sign convention: Positive when deuterium ions are present in the pedestal plasma,
    consistent with the intrinsic non-negativity of particle number density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:tritium_density_at_pedestal
  - name:deuterium_density_at_magnetic_axis
  sources:
  - id: dd:summary/local/pedestal/n_i/deuterium/value
    dd_path: summary/local/pedestal/n_i/deuterium/value
    status: composed
- name: deuterium_tritium_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density at the H-mode pedestal top of the fictitious single-ion
    DT pseudo-constituent with atomic mass 2.5 amu, representing deuterium and tritium
    fuel ions as one constituent.
  documentation: 'This quantity is the ion number density of the DT pseudo-constituent
    at the H-mode pedestal top. The pseudo-constituent represents the deuterium-tritium
    fuel mixture as a single ion species with atomic mass 2.5 amu, so the value is
    a fuel-ion density rather than a resolved deuterium or tritium isotope density.


    When the pedestal ion pressure is represented by this pseudo-species and a common
    ion temperature, the pressure relation is


    $$

    p_{\mathrm{DT,ped}} = e\, n_{\mathrm{DT,ped}}\, T_{\mathrm{i,ped}}

    $$


    where $p_{\mathrm{DT,ped}}$ is the pedestal ion pressure in Pa, $n_{\mathrm{DT,ped}}$
    is this density in $\mathrm{m}^{-3}$, $T_{\mathrm{i,ped}}$ is the pedestal ion
    temperature expressed in eV, and $e$ is the elementary charge converting eV to
    joules.


    In experiments, the pedestal-top density is inferred from edge density measurements
    such as Thomson scattering, reflectometry, interferometry, and spectroscopic constraints,
    combined with pedestal fits that identify the top of the steep-gradient region.
    The DT pseudo-species value may be constructed from the total fuel-ion density,
    using quasineutrality and isotope-composition information when the individual
    deuterium and tritium densities are not separately resolved.


    Typical H-mode pedestal fuel-ion densities are about $2-10 \times 10^{19}\,\mathrm{m}^{-3}$
    in many present tokamak plasmas and may approach $1-2 \times 10^{20}\,\mathrm{m}^{-3}$
    in high-density burning-plasma scenarios. The value is generally close to the
    electron pedestal density after accounting for non-fuel ion impurities and their
    charge states.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:deuterium_tritium_density_at_plasma_boundary
  - name:volume_averaged_deuterium_tritium_density
  - name:density_at_pedestal
  - name:deuterium_tritium_density_at_limiter
  sources:
  - id: dd:summary/local/pedestal/n_i/deuterium_tritium/value
    dd_path: summary/local/pedestal/n_i/deuterium_tritium/value
    status: composed
- name: edge_localized_mode_frequency
  kind: scalar
  status: draft
  description: Repetition rate of edge-localized mode bursts during an ELMing H-mode
    phase. It quantifies how often pedestal relaxation events occur and sets the cadence,
    not the size, of transient particle and energy exhaust to the scrape-off layer
    and divertor.
  documentation: 'Edge-localized mode frequency is the rate at which discrete ELM
    bursts occur during an ELMing H-mode phase. It characterizes the temporal spacing
    of pedestal relaxation events; the energy or particle loss per burst must be specified
    separately from this rate.


    For an analysis window of duration $\Delta t$, the frequency is defined by counting
    ELM onsets within that window:


    $$

    f_\mathrm{ELM} = \frac{N_\mathrm{ELM}}{\Delta t} \simeq \frac{1}{\langle \tau_\mathrm{ELM}
    \rangle}

    $$


    where $N_\mathrm{ELM}$ is the number of accepted ELM events, $\Delta t$ is measured
    in seconds, $f_\mathrm{ELM}$ is in Hz ($\mathrm{s}^{-1}$), $\tau_\mathrm{ELM}$
    is the time between consecutive ELM onsets in seconds, and $\langle \tau_\mathrm{ELM}
    \rangle$ is the mean inter-ELM interval over the same window. The reciprocal-interval
    form is equivalent to the count rate when the same events and boundary treatment
    are used.


    In practice, ELM onsets are identified from correlated transient signatures such
    as edge light emission, divertor heat-flux pulses, magnetic fluctuations, density
    bursts, or pedestal profile drops. The averaging window should be chosen so that
    it is short enough to follow slow discharge evolution but long enough to contain
    representative events; intervals with no ELMing H-mode, ambiguous compound events,
    pacing triggers, or deliberately selected ELM classes should be treated by a consistent
    event-selection rule.


    Typical values span about 0.5-1000 Hz. Large, infrequent ELM regimes are often
    below 10 Hz, many routinely ELMing H-mode plasmas are in the 10-100 Hz range,
    and small-ELM or actively paced regimes can reach 100-1000 Hz; a value of 0 Hz
    indicates that no accepted ELM events occurred in the averaging window.'
  unit: Hz
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_pedestal_top
  sources:
  - id: dd:summary/elms/frequency/value
    dd_path: summary/elms/frequency/value
    status: composed
- name: effective_charge_at_pedestal
  kind: scalar
  status: draft
  description: Effective charge (Zeff) at the H-mode pedestal, measuring impurity
    content through the charge-weighted mean squared ion charge near the edge transport
    barrier.
  documentation: 'Effective charge at the pedestal is the local plasma effective charge
    evaluated in the H-mode edge transport barrier. It is a dimensionless measure
    of impurity content: hydrogenic fuel ions alone give a value close to one, while
    impurity ions increase the value in proportion to both their density and the square
    of their charge state.


    The effective charge is the electron-density-normalized, charge-squared weighted
    ion density sum:


    $$

    Z_\mathrm{eff} = \frac{\sum_s n_s Z_s^2}{n_e}

    $$


    where the sum is over ion species $s$, $n_s$ is the ion density of species $s$
    in m^-3, $Z_s$ is its mean ionization state, and $n_e$ is the electron density
    in m^-3; for a quasineutral plasma, $n_e = \sum_s n_s Z_s$.


    Pedestal effective charge is inferred from impurity spectroscopy, visible or soft-X-ray
    bremsstrahlung, charge-exchange measurements, and edge transport or equilibrium
    analysis constrained by electron density and temperature. Optically thin bremsstrahlung
    emissivity scales approximately with $n_e^2 Z_\mathrm{eff} T_e^{1/2}$, making
    the pedestal value important for radiation, collisionality, resistivity, and bootstrap-current
    estimates in the edge transport barrier.


    Typical pedestal values in H-mode tokamak plasmas are about 1.2-3.5. Values close
    to 1 indicate a nearly pure hydrogenic plasma, while larger values occur with
    impurity seeding, enhanced wall influx, or accumulation of high-charge-state impurities.


    This quantity complements the generic [effective_charge](name:effective_charge),
    location-specific values such as [effective_charge_at_magnetic_axis](name:effective_charge_at_magnetic_axis),
    [effective_charge_at_internal_transport_barrier](name:effective_charge_at_internal_transport_barrier),
    and [effective_charge_at_limiter](name:effective_charge_at_limiter), and global
    measures such as [volume_averaged_effective_charge](name:volume_averaged_effective_charge).'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_magnetic_axis
  - name:effective_charge_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/pedestal/zeff/value
    dd_path: summary/local/pedestal/zeff/value
    status: composed
- name: effective_charge_at_plasma_boundary
  kind: scalar
  status: draft
  description: Effective charge number of the ion mixture at the plasma boundary (separatrix),
    equal to the charge-squared-weighted sum of ionic densities normalized to electron
    density.
  documentation: "The effective charge $Z_\\text{eff}$ at the plasma boundary captures\
    \ the aggregate charge state of all ion species at the last closed flux surface,\
    \ where the magnetically confined plasma transitions to the open-field-line scrape-off\
    \ layer. In a pure hydrogenic plasma $Z_\\text{eff} = 1$; impurity ions with charge\
    \ state $Z_i > 1$ raise $Z_\\text{eff}$ above unity, increasing resistivity and\
    \ impurity radiation losses.\n\n$$\nZ_\\text{eff} = \\frac{\\sum_i n_i Z_i^2}{n_e}\n\
    $$\n\nwhere $n_i$ is the number density of ion species $i$, $Z_i$ is the charge\
    \ state of species $i$, and $n_e$ is the electron number density, with the sum\
    \ running over all ion species and charge states present at the boundary.\n\n\
    At the separatrix, $Z_\\text{eff}$ is sensitive to plasma-wall interactions, impurity\
    \ seeding, and edge transport processes that concentrate high-$Z$ ions near the\
    \ boundary. It governs local Spitzer resistivity ($\\eta \\propto Z_\\text{eff}$)\
    \ and modifies neoclassical transport coefficients in the edge region. The [electron_pressure_at_plasma_boundary](name:electron_pressure_at_plasma_boundary)\
    \ and [hydrogen_density_at_plasma_boundary](name:hydrogen_density_at_plasma_boundary)\
    \ characterize the thermodynamic state at the same boundary location; the analogous\
    \ pedestal quantity is [effective_charge_at_pedestal](name:effective_charge_at_pedestal).\
    \ It is inferred from visible bremsstrahlung spectroscopy or from consistency\
    \ between line-integrated electron density and charge-exchange spectroscopy.\n\
    \nTypical values range from 1 in near-pure hydrogen plasmas to 2\u20135 in impurity-seeded\
    \ or metallic-wall discharges.\n\nSign convention: Positive when ions are present,\
    \ as $Z_\\text{eff}$ is defined as a ratio of positive-definite charge-weighted\
    \ ion densities to electron density."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_plasma_boundary
  - name:hydrogen_density_at_plasma_boundary
  - name:effective_charge_at_pedestal
  sources:
