- name: lower_outer_squareness_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless Luce squareness coefficient for the lower outer quadrant
    of each flux surface, measuring the deviation of that corner from a reference
    ellipse sharing the same center, horizontal half-width, and elongation.
  documentation: "The lower outer squareness $\\zeta_{lo}$ is the quadrant-specific\
    \ Luce (2013) shape parameter describing how the lower outboard corner of a poloidal\
    \ flux-surface cross-section departs from a reference ellipse sharing the same\
    \ center, horizontal half-width $a$, and elongation $\\kappa$. As one of four\
    \ independent corner squareness coefficients, it captures asymmetries \u2014 both\
    \ up-down and in-out \u2014 that a single symmetric squareness value cannot resolve.\n\
    \nIn the Luce parametric form, the lower outer quadrant shape is governed by:\n\
    \n$$\nZ(\\theta) = Z_0 + a\\,\\kappa\\sin\\!\\bigl(\\theta + \\zeta_{lo}\\sin\
    \ 2\\theta\\bigr)\n$$\n\nwhere $\\theta \\in (-\\pi/2,\\,0)$ parameterizes the\
    \ lower outer quadrant, $Z_0$ is the geometric center height of the flux surface,\
    \ $a$ is the horizontal minor half-width, and $\\kappa$ is the local [elongation_of_flux_surface](name:elongation_of_flux_surface).\
    \ Setting $\\zeta_{lo} = 0$ recovers a pure ellipse in that quadrant.\n\nThis\
    \ quantity is obtained from equilibrium reconstruction by fitting the Luce parametric\
    \ contour to each nested flux surface computed from magnetics and internal measurements.\
    \ At the outermost closed flux surface the value reduces to [lower_outer_squareness_of_plasma_boundary](name:lower_outer_squareness_of_plasma_boundary).\
    \ The upper-outer analog is [upper_outer_squareness_of_flux_surface](name:upper_outer_squareness_of_flux_surface),\
    \ the lower inner counterpart is [lower_inner_squareness_of_flux_surface](name:lower_inner_squareness_of_flux_surface),\
    \ and the up-down symmetric outer combination is [outer_squareness_of_flux_surface](name:outer_squareness_of_flux_surface).\n\
    \nSign convention: Positive when the lower outer corner of the flux-surface cross-section\
    \ bulges outward beyond the reference ellipse, increasing the cross-sectional\
    \ area of the lower outer quadrant relative to the elliptic baseline."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  - name:lower_outer_squareness_of_plasma_boundary
  - name:upper_outer_squareness_of_flux_surface
  - name:lower_inner_squareness_of_flux_surface
  - name:outer_squareness_of_flux_surface
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/squareness_lower_outer
    dd_path: equilibrium/time_slice/profiles_1d/squareness_lower_outer
    status: composed
- name: lower_outer_squareness_of_plasma_boundary
  kind: scalar
  status: draft
  description: Shape parameter for the lower outer quadrant of the plasma cross-section
    boundary measuring its deviation from an inscribed ellipse, following the Luce
    (2013) four-corner squareness decomposition.
  documentation: 'The lower outer squareness $\zeta_{lo}$ is one of four corner-specific
    shape parameters in the Luce (2013) plasma boundary parameterization, describing
    how much the lower outer quadrant of the plasma cross-section boundary deviates
    from an inscribed ellipse with the same elongation and triangularity. The lower
    outer quadrant spans the outboard lower region of the cross-section, characterized
    by increasing major radius $R$ and decreasing height $Z$ from the geometric midplane.


    In the Luce framework the boundary near each corner is locally fitted by a superellipse
    whose exponent $n_{lo}$ controls the corner curvature:


    $$

    \zeta_{lo} = 1 - \frac{2}{n_{lo}}

    $$


    where $n_{lo} = 2$ corresponds to a pure ellipse ($\zeta_{lo} = 0$), $n_{lo} >
    2$ produces more rectangular corners ($\zeta_{lo} > 0$), and $n_{lo} < 2$ produces
    more rounded corners ($\zeta_{lo} < 0$). The squareness parameters capture fourth-order
    boundary shaping effects that are independent of elongation and triangularity.


    The squareness parameters are obtained from equilibrium reconstructions by fitting
    the reconstructed last-closed flux surface or separatrix boundary contour. They
    are particularly relevant for diverted configurations where divertor geometry
    shapes the lower boundary region.


    Typical values of $\zeta_{lo}$ in tokamak plasmas range from approximately $-0.3$
    to $+0.3$. Together with [lower_inner_squareness_of_plasma_boundary](name:lower_inner_squareness_of_plasma_boundary),
    [upper_outer_squareness_of_plasma_boundary](name:upper_outer_squareness_of_plasma_boundary),
    and [upper_inner_squareness_of_plasma_boundary](name:upper_inner_squareness_of_plasma_boundary),
    it completes the four-corner boundary shape decomposition; the parent quantity
    [outer_squareness_of_plasma_boundary](name:outer_squareness_of_plasma_boundary)
    describes outer-quadrant squareness without the upper/lower distinction.


    Sign convention: Positive when the lower outer quadrant of the boundary protrudes
    further outward than the ellipse inscribed at the same elongation and triangularity.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_inner_squareness_of_plasma_boundary
  - name:upper_inner_squareness_of_plasma_boundary
  - name:outer_squareness_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/squareness_lower_outer
    dd_path: equilibrium/time_slice/boundary/squareness_lower_outer
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/squareness_lower_outer
    dd_path: equilibrium/time_slice/boundary_separatrix/squareness_lower_outer
    status: attached
- name: lower_triangularity_of_plasma_boundary
  kind: scalar
  status: draft
  description: Lower triangularity is a dimensionless shape parameter for the lower
    half of the plasma boundary in the right-handed cylindrical (R, phi, Z) frame,
    where R is major radius and Z is vertical height. It is the inward displacement
    of the boundary point at minimum Z relative to the geometric center, normalized
    by half the maximum-minus-minimum R extent.
  documentation: 'Lower triangularity $\delta_{\rm lower}$ quantifies triangular shaping
    of the lower half of the plasma boundary in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius and $Z$ is vertical height. It compares
    the major radius of the lower boundary extremum with the geometric center constructed
    from the inboard and outboard radial extrema of the same boundary.


    The geometric definition uses the boundary minor-radius normalization:


    $$

    \delta_{\rm lower} = \frac{R_0 - R_{\rm low}}{a}, \qquad R_0 = \frac{R_{\rm out}+R_{\rm
    in}}{2}, \qquad a = \frac{R_{\rm out}-R_{\rm in}}{2}

    $$


    where $R_{\rm low}$ is the major radius in meters at the minimum-$Z$ point of
    the boundary, $R_{\rm in}$ and $R_{\rm out}$ are the minimum and maximum boundary
    major radii in meters, $R_0$ is the geometric-center major radius in meters, and
    $a$ is the [minor_radius_of_plasma_boundary](name:minor_radius_of_plasma_boundary)
    in meters. This construction makes inward lower shaping, $R_{\rm low}<R_0$, positive
    and outward lower shaping negative.


    It is computed from an equilibrium boundary contour by locating the inboard, outboard,
    and lower vertical extrema and applying the geometric construction above. The
    lower value can differ from [upper_triangularity_of_plasma_boundary](name:upper_triangularity_of_plasma_boundary)
    in vertically asymmetric, single-null, or double-null configurations, while [minor_triangularity_of_plasma_boundary](name:minor_triangularity_of_plasma_boundary)
    denotes a related but distinct boundary-shape measure.


    Typical values are order-unity dimensionless numbers: nearly circular or weakly
    shaped lower boundaries are close to 0, positive-triangularity tokamak plasmas
    commonly lie around 0.2-0.6, and reverse-triangularity lower shaping is negative.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:minor_triangularity_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/triangularity_lower
    dd_path: equilibrium/time_slice/boundary/triangularity_lower
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/triangularity_lower
    dd_path: equilibrium/time_slice/boundary_separatrix/triangularity_lower
    status: attached
  - id: dd:summary/boundary/triangularity_lower/value
    dd_path: summary/boundary/triangularity_lower/value
    status: attached
- name: major_radius_of_active_limiter_point
  kind: scalar
  status: draft
  description: Major-radius coordinate of the active limiter point in the right-handed
    cylindrical (R, phi, Z) frame. It gives the radial distance from the machine symmetry
    axis to the material contact point that sets the outermost closed flux surface
    in a limited plasma.
  documentation: 'The major radius of the active limiter point is the $R$ coordinate
    of the limiter contact point in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is distance from the machine symmetry axis, $\phi$ is toroidal angle,
    and $Z$ is vertical height. The active limiter point is the material point at
    which a limited plasma boundary contacts the surrounding structure; this coordinate
    identifies its radial location only.


    For an active limiter point with Cartesian coordinates $(x_a, y_a, z_a)$ in a
    right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame whose $\hat{z}$ direction
    is vertical, the corresponding major radius is


    $$

    R_a = \sqrt{x_a^2 + y_a^2}

    $$


    where $x_a$ and $y_a$ are measured from the toroidal symmetry axis and $R_a$ is
    the major-radius coordinate of the active limiter point.


    In equilibrium interpretation, this value is determined from the limiter geometry
    and the reconstructed last-closed flux surface for a limited configuration. It
    is distinct from the major radius of a general plasma-boundary point, from the
    major radius of the closest wall point, and from the wall gap, which describes
    a separation distance rather than the contact coordinate.


    Typical values range from about 0.2-8 m across present and planned tokamaks, depending
    on machine size and whether the active contact is on an inboard, outboard, upper,
    or lower limiter surface.'
  unit: m
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/active_limiter_point/r
    dd_path: equilibrium/time_slice/boundary/active_limiter_point/r
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/active_limiter_point/r
    dd_path: equilibrium/time_slice/boundary_separatrix/active_limiter_point/r
    status: attached
- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major-radius R coordinate of the first-wall point that is geometrically
    closest to the plasma boundary or magnetic separatrix.
  documentation: 'The major-radius coordinate $R$ of the closest wall point locates,
    in the right-handed cylindrical $(R, \phi, Z)$ frame, the position on the first
    wall at minimum Euclidean distance from the plasma boundary or magnetic separatrix.
    This proximity measure characterizes the tightest clearance between the confined
    plasma and the surrounding vessel structure, directly relevant to heat-load assessment,
    disruption halo-current modeling, and plasma-shape control.


    The closest wall point $(R_{cw}, Z_{cw})$ is the element of the first-wall contour
    $\mathcal{W}$ in the poloidal $(R, Z)$ cross-section that minimizes the distance
    to the plasma boundary contour $\partial\Omega$:


    $$

    (R_{cw}, Z_{cw}) = \underset{(R_w,\,Z_w)\,\in\,\mathcal{W}}{\arg\min}\; d\bigl((R_w,
    Z_w),\,\partial\Omega\bigr)

    $$


    where $d$ is the Euclidean distance in the poloidal $(R, Z)$ plane. The reported
    quantity is the $R$ component of this minimizing wall point.


    The closest wall point is identified during equilibrium reconstruction by comparing
    the reconstructed plasma boundary contour against the stored first-wall geometry.
    In limited plasmas, [major_radius_of_active_limiter_point](name:major_radius_of_active_limiter_point)
    often coincides with this quantity, since the active limiter contact point is
    by definition the nearest wall element. For diverted plasmas, the closest approach
    is frequently near the divertor target as characterized by [major_radius_of_strike_point](name:major_radius_of_strike_point).
    The radial position of the geometric center is given by [major_radius_of_geometric_axis](name:major_radius_of_geometric_axis),
    providing a central reference against which wall clearances can be contextualized.


    Sign convention: Positive when the closest wall point lies at a radial distance
    from the toroidal symmetry axis measured in the $+\hat{R}$ direction.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_active_limiter_point
  - name:major_radius_of_strike_point
  - name:major_radius_of_geometric_axis
  sources:
  - id: dd:disruption/halo_currents/active_wall_point/r
    dd_path: disruption/halo_currents/active_wall_point/r
    status: attached
