- name: major_radius_of_rectangle_center
  kind: scalar
  status: draft
  description: Major radius $R$ coordinate of the geometric center of a rectangular
    cross-section element, locating the centroid of the rectangle in the cylindrical
    $(R, \phi, Z)$ frame.
  documentation: "The major radius of the rectangle center identifies the $R$ coordinate\
    \ \u2014 measured from the machine symmetry axis in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame \u2014 at which the centroid of a rectangular cross-section\
    \ lies. Rectangular cross-sections are used to approximate the geometry of poloidal-field\
    \ coil elements, passive conducting loops, iron-core segments, antenna straps,\
    \ and diagnostic spatial-resolution cells; the centroid coordinates $(R, Z)$ together\
    \ fully specify the element's in-plane position. The companion vertical coordinate\
    \ is given by [vertical_coordinate_of_rectangle_center](name:vertical_coordinate_of_rectangle_center),\
    \ and the analogous quantity for a general diagnostic component is [major_radius_of_diagnostic_component_center](name:major_radius_of_diagnostic_component_center).\
    \ Typical values range from fractions of a meter for near-axis elements to several\
    \ meters for outboard coil elements, depending on device size; for ITER-scale\
    \ machines the range is approximately 1.5\u20138 m.\n\nSign convention: Positive\
    \ when the rectangle center lies at a finite distance from the machine symmetry\
    \ axis in the outward radial direction, consistent with $R > 0$ everywhere in\
    \ the cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_rectangle_center
  - name:major_radius_of_diagnostic_component_center
  constraints: []
  sources:
  - id: dd:mse/channel/active_spatial_resolution/width/r
    dd_path: mse/channel/active_spatial_resolution/width/r
    status: composed
- name: toroidal_angle_of_first_point_of_line_of_sight
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the first endpoint defining the line of sight\
    \ of a diagnostic channel, specifying the azimuthal entry point of the chord in\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame."
  documentation: 'The toroidal angle $\phi$ locates the first defining point of a
    diagnostic line of sight azimuthally around the machine symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $\phi$ increases counter-clockwise when
    viewed from above ($+\hat{Z}$). Together with the major radius [major_radius_of_first_point_of_line_of_sight](name:major_radius_of_first_point_of_line_of_sight)
    and the vertical coordinate [vertical_coordinate_of_first_point_of_line_of_sight](name:vertical_coordinate_of_first_point_of_line_of_sight),
    this angle fully specifies the Cartesian position of the chord entry point. The
    line of sight is then directed from this first point toward [toroidal_angle_of_second_point_of_line_of_sight](name:toroidal_angle_of_second_point_of_line_of_sight),
    defining the chord geometry used in bolometry, Thomson scattering, hard and soft
    X-ray cameras, visible and UV spectrometers, and motional Stark effect diagnostics.
    Typical values span $0$ to $2\pi$ rad depending on the toroidal sector in which
    the diagnostic is installed; many single-sector diagnostics cluster near $\phi
    = 0$.


    Sign convention: Positive when $\phi$ is in the direction of increasing toroidal
    angle, counter-clockwise when viewed from above $+\hat{Z}$.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:major_radius_of_first_point_of_line_of_sight
  - name:vertical_coordinate_of_first_point_of_line_of_sight
  - name:toroidal_angle_of_second_point_of_line_of_sight
  constraints: []
  sources:
  - id: dd:camera_x_rays/camera/line_of_sight/first_point/phi
    dd_path: camera_x_rays/camera/line_of_sight/first_point/phi
    status: composed
- name: toroidal_angle_of_second_point_of_line_of_sight
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of the second endpoint defining the line of\
    \ sight of a diagnostic channel, specifying the azimuthal exit point of the chord\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame."
  documentation: "The toroidal angle $\\phi$ of the second endpoint locates the azimuthal\
    \ position at which a diagnostic line-of-sight chord terminates (or exits) the\
    \ measurement volume, expressed in the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame where $\\phi$ increases counter-clockwise when viewed from above $+\\\
    hat{Z}$. Together with the major-radius coordinate [major_radius_of_second_point_of_line_of_sight](name:major_radius_of_second_point_of_line_of_sight)\
    \ and the vertical coordinate [vertical_coordinate_of_second_point_of_line_of_sight](name:vertical_coordinate_of_second_point_of_line_of_sight),\
    \ this angle fully specifies the three-dimensional position of the second endpoint\
    \ in the cylindrical $(R, \\phi, Z)$ frame. The chord geometry defined by the\
    \ first and second endpoints is used across many passive and active plasma diagnostics\
    \ \u2014 including bolometry, soft and hard X-ray cameras, ECE, bremsstrahlung,\
    \ and motional Stark effect systems \u2014 to compute line-integrated emission\
    \ or absorption along the sight line. Typical values span $0$ to $2\\pi$ rad depending\
    \ on the toroidal location of the diagnostic port; non-axisymmetric diagnostic\
    \ arrangements may use second-point $\\phi$ values that differ substantially from\
    \ those of the first endpoint. The companion first-endpoint coordinate is [toroidal_angle_of_first_point_of_line_of_sight](name:toroidal_angle_of_first_point_of_line_of_sight).\n\
    \nSign convention: Positive when $\\phi$ is measured in the direction of increasing\
    \ toroidal angle, i.e., counter-clockwise when viewed from above $+\\hat{Z}$."
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:major_radius_of_second_point_of_line_of_sight
  - name:vertical_coordinate_of_second_point_of_line_of_sight
  - name:toroidal_angle_of_first_point_of_line_of_sight
  constraints: []
  sources:
  - id: dd:camera_x_rays/camera/line_of_sight/second_point/phi
    dd_path: camera_x_rays/camera/line_of_sight/second_point/phi
    status: composed
