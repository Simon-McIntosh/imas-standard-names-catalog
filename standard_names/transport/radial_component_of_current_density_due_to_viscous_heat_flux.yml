name: radial_component_of_current_density_due_to_viscous_heat_flux
status: draft
description: Radial projection of the current density arising from the viscous component
  of the heat flux tensor in the plasma.
documentation: "This quantity represents the radial component $j_r^{\\mathrm{visc,heat}}$\
  \ (in $\\mathrm{A\\,m^{-2}}$) of the current density generated by viscous heat flux\
  \ mechanisms. In the fluid description of a magnetized plasma, the viscous stress\
  \ tensor $\\boldsymbol{\\pi}$ contributes to both momentum and energy transport;\
  \ the associated heat-flux-driven current arises from the divergence of off-diagonal\
  \ stress tensor elements acting on the energy flow. The viscous heat-flux current\
  \ is typically small compared to the total parallel current but can become significant\
  \ near steep gradient regions such as the pedestal or in the scrape-off layer where\
  \ collisionality is intermediate (Pfirsch\u2013Schl\xFCter and plateau regimes).\
  \ Evaluated in edge transport codes (SOLPS-ITER, UEDGE) by closing the Braginskii\
  \ moment hierarchy through the viscous stress tensor components $\\pi_{ij}$, where\
  \ $i,j$ run over the local magnetic-field-aligned coordinate system. Typical magnitudes\
  \ are $10^{-1}$\u2013$10^{2}\\;\\mathrm{A\\,m^{-2}}$ in the SOL. See related quantities\
  \ for the full current density decomposition."
validity_domain: ''
