- name: pressure_at_plasma_boundary
  kind: scalar
  status: active
  description: Pressure at the plasma boundary is the isotropic kinetic pressure of
    a specified plasma constituent or population evaluated on the last closed flux
    surface separating confined plasma from the scrape-off layer. It represents scalar
    momentum flux from random particle motion at that boundary.
  documentation: 'Pressure at the plasma boundary is the isotropic kinetic pressure
    of a specified plasma constituent or population evaluated on the plasma boundary,
    the last closed flux surface separating closed magnetic flux surfaces from the
    scrape-off layer. It is the scalar part of the kinetic pressure tensor at that
    locus and represents momentum flux from random particle motion, not magnetic pressure
    or directed-flow dynamic pressure.


    The scalar boundary pressure for population $a$ is defined from its kinetic pressure
    tensor evaluated at the boundary as:


    $$

    p_{a,\mathrm{b}} = \frac{1}{3}\operatorname{tr}\!\left(\mathbf{P}_a\right)_{\mathrm{b}}

    $$


    where $p_{a,\mathrm{b}}$ is the boundary pressure of population $a$, $\mathbf{P}_a$
    is its kinetic pressure tensor, and subscript $\mathrm{b}$ denotes evaluation
    on the plasma boundary. For an isotropic Maxwellian population, this is equivalent
    to $p_{a,\mathrm{b}} = n_{a,\mathrm{b}} k_\mathrm{B} T_{a,\mathrm{b}}$, where
    $n_{a,\mathrm{b}}$ is the boundary number density of that population, $T_{a,\mathrm{b}}$
    is its boundary thermodynamic temperature, and $k_\mathrm{B}$ is the Boltzmann
    constant.


    The constituent or population may be electrons, ions, neutrals, or an explicitly
    defined subset; [electron pressure at the plasma boundary](name:electron_pressure_at_plasma_boundary)
    is the electron-specific instance. For a species-level constituent that contains
    multiple charge states, this pressure is summed over charge states because pressure
    tensors from distinct particle populations add.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_plasma_boundary
- name: electron_pressure_at_plasma_boundary
  kind: scalar
  status: active
  description: Isotropic momentum-flux density of random electron motion evaluated
    on the last closed flux surface separating confined plasma from the scrape-off
    layer.
  documentation: 'Electron thermal pressure at the plasma boundary is the isotropic
    momentum-flux density produced by random electron motion on the last closed magnetic
    flux surface. It is the electron-specific contribution to [thermal pressure at
    the plasma boundary](name:pressure_at_plasma_boundary), not the total plasma pressure.


    For an isotropic electron population, the pressure is defined by


    $$

    p_e = \frac{2}{3} n_e \langle E_e \rangle

    $$


    where $p_e$ is electron thermal pressure, $n_e$ is electron number density, and
    $\langle E_e \rangle$ is the mean random kinetic energy per electron. The quantity
    is related to [electron temperature at the plasma boundary](name:electron_temperature_at_plasma_boundary)
    through $p_e = n_e T_e$ when $T_e$ is expressed as thermal energy per particle.


    The definition excludes directed electron bulk-flow momentum and nonthermal stress
    contributions; the plasma boundary denotes the separatrix between closed and open
    magnetic field lines.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:pressure_at_plasma_boundary
  - name:electron_temperature_at_plasma_boundary
  arguments:
  - name: pressure_at_plasma_boundary
    operator: electron
    operator_kind: qualifier
  sources:
