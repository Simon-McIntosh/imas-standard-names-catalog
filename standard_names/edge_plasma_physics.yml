- name: plasma_velocity_due_to_diamagnetic_drift
  kind: scalar
  status: active
  description: The plasma velocity due to diamagnetic drift is a signed scalar component
    of the bulk-plasma diamagnetic drift velocity, obtained by projecting the mass-weighted
    pressure-gradient-driven species drifts onto a specified positive component direction.
  documentation: 'The plasma velocity due to diamagnetic drift is a signed scalar
    component of the pressure-gradient-driven perpendicular drift of the bulk plasma.
    It is the projection of the mass-weighted charged-species center-of-mass diamagnetic-drift
    velocity, not a direction-free speed and not a charge-weighted diamagnetic-current
    quantity.


    The defining scalar projection of the [bulk-plasma diamagnetic-drift velocity](name:bulk_plasma_velocity_due_to_diamagnetic_drift)
    onto the specified unit direction $\hat{e}$ is:


    $$

    v_{\ast,\mathrm{plasma},\hat{e}} = \hat{e}\cdot\mathbf{v}_{\ast,\mathrm{plasma}}
    = \hat{e}\cdot\frac{\sum_s m_s n_s \mathbf{v}_{\ast s}}{\sum_s m_s n_s}

    $$


    where $\mathbf{v}_{\ast,\mathrm{plasma}}$ is the bulk-plasma diamagnetic-drift
    velocity, $s$ indexes charged plasma species, $m_s$ is species mass, $n_s$ is
    number density, and $\mathbf{v}_{\ast s}$ is the species diamagnetic-drift velocity.
    For a charged species, $\mathbf{v}_{\ast s} = -\nabla p_s \times \mathbf{B}/(q_s
    n_s B^2)$, where $p_s$ is species partial pressure, $\mathbf{B}$ is the magnetic-field
    vector, $B=|\mathbf{B}|$, and $q_s$ is signed species charge.


    The mass weighting makes this a bulk-plasma flow component; it is distinct from
    the signed bulk component along the local diamagnetic direction, [diamagnetic_velocity_due_to_diamagnetic_drift](name:diamagnetic_velocity_due_to_diamagnetic_drift),
    and from the corresponding direction-free magnitude, [bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude](name:bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude).


    Sign convention: Positive when the bulk-plasma diamagnetic-drift velocity has
    a component in the positive sense of the specified unit direction $\hat{e}$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:velocity_due_to_diamagnetic_drift
  - name:diamagnetic_velocity_due_to_diamagnetic_drift
  - name:bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude
