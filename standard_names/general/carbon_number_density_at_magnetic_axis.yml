name: carbon_number_density_at_magnetic_axis
status: draft
cocos_transformation_type: one_like
description: Total number density of carbon (all charge states) evaluated at the magnetic
  axis, where $\nabla\psi = 0$.
documentation: The carbon number density at the magnetic axis $n_{\mathrm{C}}(R_{\mathrm{axis}},
  Z_{\mathrm{axis}})$ gives the sum of carbon ion densities across all ionization
  stages (C$^{1+}$ through C$^{6+}$) at the flux-surface center. Carbon is a common
  intrinsic impurity in tokamaks with graphite plasma-facing components, and its on-axis
  concentration directly affects the effective charge $Z_{\mathrm{eff}}$ and radiative
  losses. Typical on-axis carbon densities range from $10^{16}$ to $10^{18}\;\mathrm{m^{-3}}$
  depending on wall conditioning and plasma regime. The quantity is inferred from
  charge-exchange recombination spectroscopy (CXRS) or UV spectroscopy combined with
  impurity transport modeling. See also `argon_number_density_at_magnetic_axis` for
  another impurity evaluated at the same location, and `total_thermal_ion_number_density`
  for the aggregate ion content.
