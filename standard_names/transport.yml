- name: second_radial_derivative_of_fast_ion_density
  kind: scalar
  status: draft
  description: Second derivative of fast (non-thermal) ion number density with respect
    to the normalized toroidal flux coordinate, capturing the radial curvature of
    the non-thermal ion density profile.
  documentation: 'The second radial derivative of fast-ion density measures the local
    curvature of the non-thermal ion population density profile along the normalized
    toroidal flux coordinate $\rho_\mathrm{tor,norm} \in [0, 1]$. It quantifies how
    rapidly the radial slope of [fast_ion_density](name:fast_ion_density) changes
    across nested flux surfaces, which is central to higher-order spatial discretization
    of fast-ion transport equations.


    The quantity is formally defined as:


    $$

    \frac{d^2 n_\mathrm{fast}}{d\rho_\mathrm{tor,norm}^2}

    $$


    where $n_\mathrm{fast}$ is the fast-ion number density summed over all charge
    states, and $\rho_\mathrm{tor,norm}$ is the normalized toroidal flux radius equal
    to 0 at the magnetic axis and 1 at the separatrix. Because $\rho_\mathrm{tor,norm}$
    is dimensionless, differentiation preserves the dimensions of $n_\mathrm{fast}$.


    This derivative is computed numerically within transport solver frameworks as
    part of the internal spatial discretization of fast-ion transport equations. The
    first radial derivative [radial_derivative_of_fast_ion_density](name:radial_derivative_of_fast_ion_density)
    provides the corresponding radial slope, while [second_radial_derivative_of_fast_ion_state_density](name:second_radial_derivative_of_fast_ion_state_density)
    gives the charge-state-resolved version. The species-summed counterpart [second_radial_derivative_of_total_ion_density](name:second_radial_derivative_of_total_ion_density)
    includes both thermal and non-thermal ion contributions.


    Sign convention: Positive when the fast-ion density profile is concave upward
    with respect to increasing $\rho_\mathrm{tor,norm}$, i.e., when the radial gradient
    of $n_\mathrm{fast}$ increases with increasing $\rho_\mathrm{tor,norm}$.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:fast_ion_density
  - name:radial_derivative_of_fast_ion_density
  - name:second_radial_derivative_of_fast_ion_state_density
  - name:second_radial_derivative_of_total_ion_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density_fast
    dd_path: transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density_fast
    status: composed
- name: second_radial_derivative_of_total_electron_density
  kind: scalar
  status: draft
  description: Second derivative of total electron number density with respect to
    the normalized toroidal flux coordinate, quantifying the radial curvature of the
    electron density profile.
  documentation: "The second radial derivative of total electron density characterizes\
    \ the curvature of the electron density profile along the normalized toroidal\
    \ flux coordinate $\\rho_\\mathrm{tor,norm}$. The total electron density $n_e$\
    \ encompasses both thermal and non-thermal (fast) electron sub-populations, making\
    \ this derivative applicable across all plasma regimes where both contribute \u2014\
    \ consistent with [total_electron_density](name:total_electron_density).\n\nThe\
    \ quantity is formally defined as:\n\n$$\n\\frac{\\partial^2 n_e}{\\partial \\\
    rho_\\mathrm{tor,norm}^2}\n$$\n\nwhere $n_e$ is the total electron number density\
    \ and $\\rho_\\mathrm{tor,norm} \\in [0, 1]$ is the normalized toroidal flux coordinate,\
    \ with $\\rho_\\mathrm{tor,norm} = 0$ at the magnetic axis and $\\rho_\\mathrm{tor,norm}\
    \ = 1$ at the last-closed flux surface. Because $\\rho_\\mathrm{tor,norm}$ is\
    \ dimensionless, this second derivative carries the same units as the density\
    \ itself.\n\nThis derivative is computed numerically within transport solver discretizations,\
    \ where second-order spatial operators appear in the diffusion terms of the radial\
    \ transport equations. It complements the first-order [radial_derivative_of_total_electron_density](name:radial_derivative_of_total_electron_density),\
    \ together providing both the gradient and curvature information needed for higher-order\
    \ numerical schemes. The corresponding quantity for the fast electron sub-population\
    \ is [second_radial_derivative_of_fast_electron_density](name:second_radial_derivative_of_fast_electron_density),\
    \ and the analogous ion-state quantity is [second_radial_derivative_of_total_ion_state_density](name:second_radial_derivative_of_total_ion_state_density).\n\
    \nSign convention: Positive when the total electron density profile is concave\
    \ upward with respect to increasing $\\rho_\\mathrm{tor,norm}$, i.e., when the\
    \ outward radial gradient of $n_e$ increases with increasing normalized toroidal\
    \ flux."
  unit: m^-3
  physics_domain: transport
  links:
  - name:total_electron_density
  - name:radial_derivative_of_total_electron_density
  - name:second_radial_derivative_of_fast_electron_density
  - name:second_radial_derivative_of_total_ion_state_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/electrons/d2_drho_tor_norm2/density
    dd_path: transport_solver_numerics/derivatives_1d/electrons/d2_drho_tor_norm2/density
    status: composed
- name: second_radial_derivative_of_total_ion_density
  kind: scalar
  status: draft
  description: Second derivative of total ion number density (thermal plus non-thermal,
    summed over all charge states) with respect to the normalized toroidal flux coordinate,
    quantifying the radial curvature of the ion density profile.
  documentation: 'The second radial derivative of total ion density describes the
    curvature of the ion density profile along the normalized toroidal flux coordinate
    $\rho_\mathrm{tor,norm}$. The total ion density $n_i$ encompasses both thermal
    and non-thermal (fast) ion contributions, summed over all charge states, providing
    a complete representation of the ion population''s radial structure as required
    by 1D transport equations.


    The quantity is defined as:


    $$

    \frac{d^2 n_i}{d\rho_\mathrm{tor,norm}^2}

    $$


    where $n_i$ is the total ion density and $\rho_\mathrm{tor,norm} \in [0, 1]$ is
    the normalized toroidal flux coordinate, with $\rho_\mathrm{tor,norm} = 0$ at
    the magnetic axis and $\rho_\mathrm{tor,norm} = 1$ at the last closed flux surface.
    Because $\rho_\mathrm{tor,norm}$ is dimensionless, this second derivative carries
    the same unit as the density itself.


    This curvature term arises in second-order spatial discretization of radial ion
    transport equations, where both first- and second-order derivatives are needed
    to evaluate diffusive flux terms accurately. It is computed numerically from the
    total ion density profile during transport solver iterations, complementing the
    [first radial derivative of total ion density](name:radial_derivative_of_total_ion_density).
    Analogous second-derivative quantities are defined for the fast-ion sub-population
    in [second_radial_derivative_of_fast_ion_density](name:second_radial_derivative_of_fast_ion_density)
    and for individual charge states in [second_radial_derivative_of_total_ion_state_density](name:second_radial_derivative_of_total_ion_state_density).


    Sign convention: Positive when the total ion density profile is concave upward
    as a function of increasing $\rho_\mathrm{tor,norm}$, i.e., when the local profile
    curvature $d^2 n_i / d\rho_\mathrm{tor,norm}^2 > 0$.'
  unit: m^-3
  physics_domain: transport
  links:
  - name:radial_derivative_of_total_ion_density
  - name:second_radial_derivative_of_fast_ion_density
  - name:second_radial_derivative_of_total_ion_state_density
  sources:
  - id: dd:transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density
    dd_path: transport_solver_numerics/derivatives_1d/ion/d2_drho_tor_norm2/density
    status: composed
- name: thermal_ion_state_power_due_to_collisions
  kind: scalar
  status: draft
  description: Volume-integrated Coulomb collisional power transferred from a fast
    particle distribution to the thermal population of a specified ion species charge
    state.
  documentation: "The quantity gives the total rate at which Coulomb collisions transfer\
    \ kinetic energy from a fast (non-Maxwellian) particle population into the thermal\
    \ ion population of a specified ion species $a$ at charge state $z$, integrated\
    \ over the plasma volume $V$.\n\n$$\nP_{\\mathrm{th}}^{(a,z)} = \\int_V Q_{\\\
    mathrm{coll}}^{(a,z)}(\\mathbf{r})\\,dV\n$$\n\nwhere $Q_{\\mathrm{coll}}^{(a,z)}$\
    \ is the local volumetric Coulomb collisional power density deposited into thermal\
    \ ions of species $a$ at charge state $z$, evaluated from the fast particle kinetic\
    \ distribution via Fokker\u2013Planck collision integrals.\n\nThis is the charge-state-resolved\
    \ component of [thermal_ion_power_due_to_collisions](name:thermal_ion_power_due_to_collisions),\
    \ which sums over all ionization states of the species. The fast-population analog\
    \ at the same charge-state resolution is [fast_ion_state_power_due_to_collisions](name:fast_ion_state_power_due_to_collisions),\
    \ while [thermal_electron_power_due_to_collisions](name:thermal_electron_power_due_to_collisions)\
    \ provides the corresponding electron channel. The local power density form appears\
    \ in [trapped_thermal_ion_state_power_density_due_to_collisions](name:trapped_thermal_ion_state_power_density_due_to_collisions)\
    \ for orbit-class-resolved analyzes. This quantity enters collisional energy-balance\
    \ equations for impurity heating and fast-ion thermalization.\n\nSign convention:\
    \ Positive when net kinetic energy flows from the fast particle distribution into\
    \ the thermal ion charge-state population."
  unit: W
  physics_domain: transport
