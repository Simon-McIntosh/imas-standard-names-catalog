name: runaway_electron_kinetic_energy_density
status: draft
description: Volume-averaged kinetic energy per unit volume carried by the runaway
  electron population.
documentation: "The runaway electron kinetic energy density $w_{\\mathrm{RE}} = \\\
  int f_{\\mathrm{RE}}(\\mathbf{p})\\,(\\gamma - 1) m_e c^2\\,d^3p$ represents the\
  \ mean kinetic energy stored per unit volume in runaway electrons, where $f_{\\\
  mathrm{RE}}$ is the runaway distribution function, $\\gamma$ the Lorentz factor,\
  \ $m_e$ the electron rest mass, and $c$ the speed of light. Because runaway electrons\
  \ are highly relativistic (energies from $\\sim 1\\;\\mathrm{MeV}$ to tens of MeV),\
  \ $w_{\\mathrm{RE}}$ can reach $10^3$\u2013$10^5\\;\\mathrm{J\\,m^{-3}}$ during\
  \ disruption runaway beams in large tokamaks, representing a significant fraction\
  \ of the pre-disruption plasma energy. This quantity is critical for disruption\
  \ mitigation design because localized deposition of the runaway energy budget can\
  \ damage plasma-facing components. It is typically computed by kinetic runaway solvers\
  \ (DREAM, CODE, CQL3D) or estimated from synchrotron-emission diagnostics and hard\
  \ X-ray monitors. The profile of $w_{\\mathrm{RE}}$ versus normalized poloidal flux\
  \ $\\rho$ informs where energy is concentrated in the runaway beam. See also `electron_incident_kinetic_energy_flux_on_wall`\
  \ for the wall-loading counterpart."
