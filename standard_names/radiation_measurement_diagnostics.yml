- name: toroidal_angle_of_detector_pixel
  kind: scalar
  status: draft
  description: "Toroidal angle \u03C6 of a detector pixel position in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame, where \u03C6 increases counter-clockwise when\
    \ viewed from above."
  documentation: "The toroidal angle $\\phi$ locates a detector pixel around the machine\
    \ symmetry axis in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$\
    \ is the major radius, $\\phi$ is the toroidal angle increasing counter-clockwise\
    \ when viewed from above $+\\hat{Z}$, and $Z$ is the vertical height. For pixel-array\
    \ diagnostics such as X-ray cameras and crystal spectrometers, each pixel subtends\
    \ a distinct line of sight whose toroidal origin is characterized by this angle;\
    \ combined with the corresponding major-radius and vertical coordinates, it fully\
    \ specifies the three-dimensional pixel position in machine geometry. Values span\
    \ $[0, 2\\pi)$ rad for full-torus coverage, though individual diagnostic cameras\
    \ typically subtend a narrow toroidal arc of order $10^{-2}$\u2013$10^{-1}$ rad.\
    \ This quantity belongs to the same geometric family as [toroidal_angle_of_measurement_position](name:toroidal_angle_of_measurement_position)\
    \ and [toroidal_angle_of_outline_point](name:toroidal_angle_of_outline_point),\
    \ differing only in that the locus is an individual detector pixel rather than\
    \ a coarser measurement or outline point.\n\nSign convention: Positive when $\\\
    phi$ increases in the counter-clockwise direction when viewed from above $+\\\
    hat{Z}$."
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:toroidal_angle_of_measurement_position
  - name:toroidal_angle_of_outline_point
  constraints: []
  sources:
  - id: dd:camera_x_rays/camera/pixel_position/phi
    dd_path: camera_x_rays/camera/pixel_position/phi
