        of poloidal flux. A fundamental quantity relating to plasma beta and the Grad-Shafranov
        current distribution.
      kind: llm
- name: poloidal_angle_of_flux_surface
  kind: scalar
  status: active
  description: Pointwise geometric angle locating a position around a magnetic flux-surface
    cross-section, measured clockwise from its low-field-side midplane.
  documentation: 'Poloidal angle is the geometric angular coordinate assigned pointwise
    to each position on the poloidal cross-section of a specified magnetic flux surface.
    It is measured from the geometric center of that cross-section rather than from
    magnetic-field-line distance.


    At a point on the surface, the angle $\theta$ is defined by


    $$

    \theta = \operatorname{atan2}\!\left(-(Z-Z_0),\,R-R_0\right)

    $$


    where $\theta$ is the poloidal angle, $\operatorname{atan2}$ returns the signed
    principal angle, $R$ is the major-radius coordinate, $Z$ is the vertical coordinate,
    and $(R_0,Z_0)$ is the geometric center of the flux-surface cross-section. These
    coordinates belong to the right-handed cylindrical $(R,\phi,Z)$ frame, where $\phi$
    is the toroidal angle.


    The quantity applies to individual points on one magnetic flux surface and has
    no averaging or summation over the surface. The surface is identified by a constant
    [poloidal magnetic flux at a flux surface](name:poloidal_magnetic_flux_at_flux_surface)
    value; the angle therefore parameterizes position around that surface rather than
    assigning one unique angle to the entire surface. It is a geometric angle, distinct
    from a straight-field-line poloidal angle.


    This quantity specializes [poloidal angle](name:poloidal_angle_of_flux_surface)
    by making the flux-surface locus explicit and provides the angular coordinate
    used to distinguish positions around the surface''s poloidal cross-section.


    Sign convention: Positive when the point advances clockwise from the low-field-side
    midplane in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/ggd/theta/values
