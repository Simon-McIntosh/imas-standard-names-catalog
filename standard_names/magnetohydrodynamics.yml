- name: toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current
  kind: scalar
  status: active
  description: Toroidal magnetic flux at the halo boundary due to poloidal current
    is the signed flux through the poloidal cross-section bounded by the outermost
    halo-region flux surface, retaining only the toroidal magnetic-field contribution
    generated by poloidal halo current. It excludes contributions from all other current
    systems.
  documentation: 'Toroidal magnetic flux at the halo boundary due to poloidal current
    is the signed toroidal magnetic flux through the poloidal cross-section bounded
    by the outermost halo-region flux surface. It contains only the magnetic-field
    contribution generated by the [poloidal_halo_current](name:poloidal_halo_current),
    the poloidal component of halo current.


    Let $S_h$ be the area enclosed by the halo-boundary contour in a plane of constant
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ increases counter-clockwise when viewed from above
    $+\hat{Z}$, and $Z$ is vertical height. With the oriented surface element $d\mathbf{S}=+\hat{\phi}\,dA$,
    the flux is


    $$

    \Phi_{\mathrm{tor},h}^{(\mathrm{pol})} = \int_{S_h} \mathbf{B}_h^{(\mathrm{pol})}\cdot
    d\mathbf{S} = \int_{S_h} B_{\phi,h}^{(\mathrm{pol})}\,dA

    $$


    where $\Phi_{\mathrm{tor},h}^{(\mathrm{pol})}$ denotes this quantity, $\mathbf{B}_h^{(\mathrm{pol})}$
    is the magnetic-field contribution from poloidal halo current, $B_{\phi,h}^{(\mathrm{pol})}$
    is its component along $+\hat{\phi}$ in tesla, $d\mathbf{S}$ is the oriented surface
    element in square meters, and $dA$ is the corresponding scalar area element in
    square meters.


    This quantity is the poloidal-current source component of [toroidal_magnetic_flux_at_halo_boundary](name:toroidal_magnetic_flux_at_halo_boundary),
    which includes all magnetic-field sources. It excludes toroidal flux contributions
    generated by any current other than poloidal halo current and is distinct from
    [poloidal_magnetic_flux_at_halo_boundary](name:poloidal_magnetic_flux_at_halo_boundary),
    which concerns poloidal magnetic flux at the same halo boundary.


    Sign convention: Positive when the magnetic-field contribution generated by the
    poloidal halo current crosses $S_h$ in the $+\hat{\phi}$ direction of the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_magnetic_flux_at_halo_boundary
  - name:toroidal_halo_current
  sources:
