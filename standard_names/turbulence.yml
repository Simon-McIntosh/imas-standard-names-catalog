- name: effective_energy
  kind: scalar
  status: draft
  description: Abstract parent quantity for the guiding-center single-particle effective
    energy, combining parallel kinetic energy with the adiabatic magnetic-moment perpendicular
    contribution, covering both physical and reference-normalized dimensionless forms.
  documentation: 'The effective particle energy is the conserved single-particle energy
    in guiding-center theory, formed from the parallel kinetic contribution and the
    energy associated with the adiabatic magnetic moment. This parent quantity generalizes
    over both the dimensional physical energy and its dimensionless form obtained
    by dividing by a reference thermal energy, as represented concretely by [particle_effective_energy](name:particle_effective_energy).


    The defining expression is:


    $$

    \varepsilon = \frac{1}{2}m v_\parallel^2 + \mu B

    $$


    where $v_\parallel$ is the particle speed parallel to the equilibrium magnetic
    field of magnitude $B$, $m$ is the particle mass, and $\mu = mv_\perp^2/(2B)$
    is the conserved magnetic moment with $v_\perp$ the speed perpendicular to $B$.
    Normalized forms divide $\varepsilon$ by a reference thermal energy $T_\mathrm{ref}$,
    yielding a dimensionless coordinate.


    In gyrokinetic turbulence calculations, the distribution function is expressed
    in $(\varepsilon, \mu)$ velocity-space coordinates, and $\varepsilon$ appears
    directly in the integration weights for fluid moments such as particle density,
    parallel current, and heat flux. The poloidal variation of the normalized form,
    captured by [derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy](name:derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy),
    enters bounce-average and transit-average operators in the gyrokinetic equation
    and is needed when tracing particle orbits along flux surfaces.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_effective_energy
  - name:derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy
  sources:
  - id: derived:effective_energy
    status: composed
- name: electron_density_at_outboard_midplane
  kind: scalar
  status: draft
  description: Electron number density evaluated at the low-field-side intersection
    of a magnetic flux surface with the equatorial midplane.
  documentation: 'Electron density at the outboard midplane is the electron number
    density at the low-field-side intersection of a magnetic flux surface with the
    equatorial midplane. In the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius and $Z$ is vertical height, this point lies at larger $R$
    than the magnetic axis and is often denoted by poloidal angle $\theta=0$ in flux
    coordinates $(\rho, \theta, \phi)$.


    The density is the zeroth velocity moment of the electron distribution function
    at the outboard-midplane position:


    $$

    n_{e,\mathrm{omp}}(t) = \int f_e(\mathbf{x}_{\mathrm{omp}}, \mathbf{v}, t)\, d^3v

    $$


    where $n_{e,\mathrm{omp}}$ is the electron density at that location, $\mathbf{x}_{\mathrm{omp}}$
    is the outboard-midplane point on the flux surface, $\mathbf{v}$ is particle velocity,
    and $f_e$ is the physical electron velocity distribution with SI units $\mathrm{s^3\,m^{-6}}$
    so that the velocity-space integral has units $\mathrm{m^{-3}}$.


    In experiments this local value is inferred from density diagnostics together
    with magnetic-equilibrium mapping; Thomson scattering and reflectometry can provide
    local constraints, while line-integrated interferometry constrains the density
    only after inversion or profile reconstruction. In gyrokinetic modeling it is
    commonly used as a reference density $n_\mathrm{ref}$ for dimensionless quantities
    such as normalized_density, $n/n_\mathrm{ref}$, often alongside a reference temperature
    such as [electron_temperature_at_outboard_midplane](name:electron_temperature_at_outboard_midplane).


    Typical values range from $10^{18}$-$10^{20}$ m^-3 in magnetically confined plasmas,
    with edge and scrape-off-layer reference locations generally near the lower end
    and core or pedestal reference locations often near the upper end.'
  unit: m^-3
  physics_domain: turbulence
  links:
  - name:electron_temperature_at_outboard_midplane
  sources:
  - id: dd:gyrokinetics/normalizing_quantities/n_e
    dd_path: gyrokinetics/normalizing_quantities/n_e
    status: attached
  - id: dd:gyrokinetics_local/normalizing_quantities/n_e
    dd_path: gyrokinetics_local/normalizing_quantities/n_e
    status: composed
- name: electron_temperature_at_outboard_midplane
  kind: scalar
  status: draft
  description: Electron temperature evaluated where a chosen flux surface intersects
    the low-field-side equatorial plane, the outboard midplane. It is the local kinetic
    temperature characterizing the electron velocity distribution at that location.
  documentation: 'Electron temperature at the outboard midplane is the electron kinetic
    temperature evaluated where a chosen flux surface crosses the low-field-side equatorial
    plane. In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ major radius,
    $\phi$ toroidal angle, and $Z$ vertical height, this is the large-$R$ intersection
    of the surface with the equatorial plane; in flux coordinates $(\rho, \theta,
    \phi)$ it is commonly denoted by the poloidal angle location $\theta = 0$.


    For a kinetic distribution, the eV-valued temperature is the second central velocity
    moment evaluated at the outboard-midplane location:


    $$

    T_{e,\mathrm{OMP}} = \left.\frac{1}{3 e n_e}\int m_e\left|\mathbf{v}-\mathbf{u}_e\right|^2
    f_e(\mathbf{x},\mathbf{v})\,d^3v\right|_{\theta=0}

    $$


    where $e$ is the elementary charge, $n_e$ is the local electron density in m$^{-3}$,
    $m_e$ is the electron mass, $\mathbf{v}$ and $\mathbf{u}_e$ are velocities in
    m s$^{-1}$, and $f_e$ is normalized so that $\int f_e\,d^3v=n_e$. The factor $1/e$
    converts the joule-valued kinetic energy per particle into electronvolts; for
    example, a thermal speed based on this quantity must use an energy $eT_e$, such
    as $v_{Te}=\sqrt{eT_e/m_e}$ or $\sqrt{2eT_e/m_e}$ depending on the adopted thermal-speed
    convention.


    In practice, this quantity is obtained by mapping measured or reconstructed electron
    temperature information onto the selected flux surface and evaluating it at the
    outboard equatorial crossing. Core and edge measurements may come from Thomson
    scattering, electron cyclotron emission, probes, or spectroscopic constraints,
    while simulations may compute it directly from the local electron distribution
    function. It provides a local electron energy scale for normalization, but additional
    density, magnetic, flow, collisional, and geometric quantities are needed to specify
    a complete normalized plasma state.


    Typical values are about 10-300 eV near the edge or scrape-off-layer side of a
    reference surface, 500-5000 eV in many core-gradient regions, and up to 10000-30000
    eV in high-performance tokamak cores.'
  unit: eV
  physics_domain: turbulence
  links:
  - name:electron_density_at_outboard_midplane
  sources:
  - id: dd:gyrokinetics/normalizing_quantities/t_e
    dd_path: gyrokinetics/normalizing_quantities/t_e
    status: attached
  - id: dd:gyrokinetics_local/normalizing_quantities/t_e
    dd_path: gyrokinetics_local/normalizing_quantities/t_e
    status: composed
- name: flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Normalized turbulent transport flux contributed by compressional parallel
    magnetic-field fluctuations in gyrokinetic simulations, serving as the parent
    abstraction over particle, momentum, and energy flux channels driven by this electromagnetic
    perturbation.
  documentation: 'Turbulent flux due to perturbed parallel magnetic field represents
    the transport of a conserved quantity (such as particles, toroidal momentum, or
    energy) that arises from correlations between fluctuating components of the parallel
    magnetic field and the transported quantity. It is a dimensionless, normalized
    flux typically defined as a flux-surface average.


    The general flux $\Gamma_{\delta B_\parallel}$ can be expressed as


    $$

    \Gamma_{\delta B_\parallel} = \left\langle \int d^3v \, \mathcal{W}_X \, \delta
    B_\parallel \, \delta g \right\rangle

    $$


    where $\delta B_\parallel$ is the perturbed parallel magnetic field, $\delta g$
    is the fluctuating gyrocenter distribution function, $\mathcal{W}_X$ is the weight
    function specific to the transported quantity $X$ (e.g., $X=1$ for particle flux,
    $X=m_s v_\parallel$ for momentum flux, $X=m_s v^2/2$ for energy flux), and $\langle
    \cdot \rangle$ denotes flux-surface average.


    This flux is computed from gyrokinetic simulations or analytical turbulence models
    by evaluating the nonlinear correlation of $\delta B_\parallel$ with the fluctuating
    distribution function. It is normalized by a reference gyro-Bohm flux or by the
    equilibrium magnetic field.


    In core tokamak plasmas, the normalized magnitude of this flux component ranges
    from $10^{-4}$ to $10^{-2}$ relative to the gyro-Bohm diffusivity, depending on
    plasma beta and the strength of electromagnetic effects.


    Sign convention: Positive when the flux is directed radially outward (toward the
    plasma boundary).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:momentum_flux_due_to_perturbed_parallel_magnetic_field
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
- name: flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Normalized radial flux of a conserved moment (e.g., toroidal angular
    momentum, particles, thermal energy) driven by the perturbed parallel vector potential
    in electromagnetic gyrokinetic turbulence. The specific transported quantity is
    identified by a child standard name. The normalization is with respect to a reference
    flux, making the quantity dimensionless.
  documentation: 'The normalized radial flux of a conserved moment $M$ mediated by
    the perturbed parallel vector potential $A_\parallel$ quantifies the electromagnetic
    contribution to anomalous transport in gyrokinetic turbulent simulations. It generalizes
    over all conserved moments for which a specific child standard name exists, such
    as toroidal angular momentum in the child [momentum_flux_due_to_perturbed_parallel_vector_potential](name:momentum_flux_due_to_perturbed_parallel_vector_potential).


    The flux is defined as the velocity-space integral of the perturbed gyrocenter
    distribution function $\delta f_s$ over each species $s$, weighted by the moment
    $M_s(\mathbf{v})$ and the radial component of the $A_\parallel$-induced drift
    velocity $v_r^{A_\parallel}$, normalized to a reference flux $\Gamma_\mathrm{ref}$:


    $$

    \Gamma^{A_\parallel}_M = \frac{1}{\Gamma_\mathrm{ref}} \sum_s \int d^3v \, M_s(\mathbf{v})
    \, v_r^{A_\parallel} \, \delta f_s

    $$


    where $\Gamma_\mathrm{ref}$ is a characteristic flux scale such as the gyro-Bohm
    flux, $M_s$ may represent particle charge, toroidal angular momentum $m_s R v_\phi$,
    or kinetic energy $\frac{1}{2} m_s v^2$, and $v_r^{A_\parallel}$ is the radial
    component of the electromagnetic drift driven by $\delta A_\parallel$.


    This quantity is computed directly from linear or nonlinear gyrokinetic simulations
    by accumulating flux-surface averages of the appropriate velocity moments. It
    isolates the contribution of magnetic flutter (perturbed parallel vector potential)
    to the radial transport of the chosen moment.


    Typical normalized values range from 0.1 to 10 in gyro-Bohm units, depending on
    plasma beta, collisionality, and the specific moment, with electromagnetic contributions
    increasing relative to electrostatic channels at high beta.


    Sign convention: Positive when the net radial flux is directed outward, in the
    direction of increasing normalized minor radius.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
  - name:momentum_flux_due_to_perturbed_parallel_magnetic_field
- name: gyrocenter_pressure
  kind: scalar
  status: draft
  description: Normalized second-order velocity-space moment of the gyrocenter distribution
    function in gyrokinetic theory, quantifying the kinetic stress carried by gyrocenters
    and including finite-Larmor-radius effects through the gyroaveraging transformation.
    In a magnetized plasma this moment is gyrotropic, resolving into distinct parallel
    and perpendicular components aligned with the background magnetic field; this
    quantity generalizes over both.
  documentation: 'Gyrocenter pressure is the second-order velocity-space moment of
    the gyrocenter distribution function $F(\mathbf{R}, v_\parallel, \mu, t)$ in gyrokinetic
    theory, expressed here in normalized form relative to a reference thermal pressure.
    It measures the kinetic stress associated with gyrocenter motion and, because
    gyrokinetics operates in guiding-center phase space, it incorporates finite-Larmor-radius
    corrections through the gyroaveraging transformation, distinguishing it from the
    particle-based pressure. In a strongly magnetized plasma this moment is gyrotropic:
    the pressure tensor is diagonal in the frame aligned with the background magnetic
    field $\mathbf{B}$ and resolves into a parallel component (along $\mathbf{B}$)
    and a perpendicular component. This name is a general abstraction over those gyrotropic
    components rather than the isotropic trace alone.


    The gyrotropic moments follow from weighted integrals of the gyrocenter distribution
    over velocity space:


    $$

    P_g^{(w)}(\mathbf{R}, t) = \int F \, w \, \mathcal{J} \, \mathrm{d}v_\parallel
    \, \mathrm{d}\mu \, \mathrm{d}\alpha

    $$


    where $v_\parallel$ is the parallel gyrocenter velocity, $\mu$ is the magnetic
    moment, $\alpha$ is the gyrophase, and $\mathcal{J}$ is the phase-space Jacobian.
    The parallel component uses the weight $w = m v_\parallel^2$ and the perpendicular
    component uses $w = \mu B$, so the same moment operation yields the two gyrotropic
    pressures; the isotropic scalar pressure is their weighted trace. Values are reported
    normalized to a reference pressure $p_\mathrm{ref} = n_\mathrm{ref} T_\mathrm{ref}$.


    Gyrocenter pressure is obtained by post-processing gyrokinetic simulation output
    through direct velocity-space integration of the distribution function, or supplied
    by closure relations in reduced fluid-gyrokinetic models. It couples the distribution
    function to the electromagnetic field perturbations through the gyrokinetic moment
    hierarchy and the field equations. Its fluctuating part is captured by the child
    name [perturbed_gyrocenter_pressure](name:perturbed_gyrocenter_pressure).


    Normalized equilibrium values are of order unity relative to the reference pressure,
    while turbulent fluctuation amplitudes typically span $10^{-3}$ to $10^{-1}$ of
    the equilibrium pressure in core plasmas.


    Sign convention: Positive when the gyrocenter pressure moment corresponds to a
    local increase above its equilibrium reference value.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_gyrocenter_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_density
  sources:
  - id: derived:gyrocenter_pressure
    status: composed
- name: momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Normalized toroidal momentum flux contributed by perturbed parallel
    magnetic-field fluctuations in gyrokinetic turbulence, serving as the parent abstraction
    over the parallel and perpendicular projections of this electromagnetic transport
    channel.
  documentation: 'In nonlinear gyrokinetic turbulence, electromagnetic fluctuations
    include compressional perturbations $\delta B_\parallel$, the perturbation to
    the magnetic-field magnitude along the equilibrium field direction $\hat{b}$.
    Such perturbations couple to the gyrocenter distribution function and drive a
    distinct channel of cross-field toroidal angular momentum transport, complementary
    to the electrostatic ($\phi$) and parallel-vector-potential ($\delta A_\parallel$)
    contributions.


    The full $\delta B_\parallel$ contribution to the normalized toroidal momentum
    flux $\hat{\Gamma}_{p_\phi}^{\delta B_\parallel}$ decomposes into a [parallel
    component](name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field),
    capturing field-aligned momentum transport driven by $\delta B_\parallel$, and
    a [perpendicular component](name:perpendicular_momentum_flux_due_to_perturbed_parallel_magnetic_field),
    capturing the cross-field compressional contribution. The normalization reference
    follows the standard gyrokinetic convention using outboard-midplane values of
    electron density and temperature.


    This quantity arises in electromagnetic nonlinear gyrokinetic simulations at finite
    plasma $\beta$ (ratio of plasma to magnetic pressure) where $\delta B_\parallel$
    is non-negligible. It is computed alongside [momentum_flux_due_to_perturbed_parallel_vector_potential](name:momentum_flux_due_to_perturbed_parallel_vector_potential)
    as part of the standard electromagnetic decomposition of turbulent toroidal momentum
    transport.


    Sign convention: Positive when the $\delta B_\parallel$-driven toroidal momentum
    flux is directed radially outward, away from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field
  - name:perpendicular_momentum_flux_due_to_perturbed_parallel_magnetic_field
  - name:momentum_flux_due_to_perturbed_parallel_vector_potential
