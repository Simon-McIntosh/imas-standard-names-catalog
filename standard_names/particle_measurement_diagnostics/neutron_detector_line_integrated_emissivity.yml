name: neutron_detector_line_integrated_emissivity
status: draft
description: Line-integrated neutron emissivity along a detector line of sight, derived
  from the measured neutron count rate.
documentation: "The neutron detector line-integrated emissivity $\\mathcal{B} = \\\
  int \\varepsilon_n \\, dl$ is the integral of the local volumetric neutron emissivity\
  \ $\\varepsilon_n$ (in $\\mathrm{m^{-3}\\,s^{-1}}$) along the detector's line of\
  \ sight $l$ (in m), yielding units of $\\mathrm{m^{-2}\\,s^{-1}}$. It is the primary\
  \ observable of passive neutron cameras and collimated neutron detectors, obtained\
  \ by converting measured count rates through calibrated detection efficiencies and\
  \ solid-angle factors. Tomographic inversion of multiple line-integrated measurements\
  \ is used to reconstruct the local emissivity profile $\\varepsilon_n(\\psi)$, which\
  \ in turn constrains the fusion power density. For deuterium\u2013deuterium plasmas\
  \ typical line-integrated values range from $10^{10}$ to $10^{14}\\;\\mathrm{m^{-2}\\\
  ,s^{-1}}$ depending on plasma performance. See `deuterium_deuterium_neutron_emissivity`\
  \ for the local volumetric emissivity and `deuterium_tritium_neutron_emissivity`\
  \ for the D-T counterpart."
validity_domain: ''
