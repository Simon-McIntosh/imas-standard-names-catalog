- name: electron_number_density
  kind: scalar
  status: draft
  description: Total (thermal plus non-thermal) electron number density, encompassing
    all electron populations per unit volume.
  documentation: "The electron number density $n_e$ is the total number of electrons\
    \ per unit volume, summing contributions from all populations including thermal,\
    \ suprathermal, and fast electrons. It enters the plasma pressure relation $p_e\
    \ = n_e k_B T_e$ (where $k_B$ is Boltzmann's constant and $T_e$ is the electron\
    \ temperature) and the quasi-neutrality condition $n_e \\approx \\sum_i Z_i n_i$,\
    \ where $Z_i$ and $n_i$ are the charge number and number density of ion species\
    \ $i$. Typical values span $10^{17}$\u2013$10^{20}$ m$^{-3}$ in the edge and scrape-off\
    \ layer, dropping toward $10^{16}$ m$^{-3}$ at the far edge. Measurement methods\
    \ include Langmuir probes, Thomson scattering, interferometry, and reflectometry.\
    \ For the purely thermal electron contribution, see [thermal electron number density](name:thermal_electron_number_density);\
    \ for the complementary fast electron population, see [fast electron number density](name:fast_electron_number_density).\
    \ The total ion density summed over all species satisfies quasi-neutrality and\
    \ is documented under [total ion number density](name:total_ion_number_density).\n\
    \nSign convention: Positive when the electron number density is a non-negative\
    \ count of electrons per unit volume."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:thermal_electron_number_density
  - name:fast_electron_number_density
  - name:total_ion_number_density
  constraints: []
  sources:
