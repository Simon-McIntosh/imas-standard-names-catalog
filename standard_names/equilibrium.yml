- name: area_of_flux_surface
  kind: scalar
  status: draft
  description: Area enclosed by a nested equilibrium flux-surface contour in the poloidal
    cross-section, used as a radial geometry measure.
  documentation: 'The flux-surface area is the poloidal cross-sectional area enclosed
    by a closed equilibrium flux surface. It is a geometric measure of the size of
    the region inside a given magnetic surface, distinct from the full three-dimensional
    [surface area of the flux surface](name:surface_area_of_flux_surface). The outermost
    value approaches the [area of the plasma boundary](name:area_of_plasma_boundary)
    when the selected surface is the last closed flux surface.


    For a flux surface labeled by [poloidal magnetic flux](name:poloidal_magnetic_flux),
    the enclosed area is


    $$

    A(\psi) = \int_{S(\psi)} dR\,dZ

    $$


    where $S(\psi)$ is the region enclosed by the flux-surface contour in the poloidal
    plane of the right-handed cylindrical $(R, \phi, Z)$ system, with $R$ the major
    radius, $\phi$ the toroidal angle, and $Z$ the vertical coordinate.


    It is computed from equilibrium reconstruction by locating the closed flux contour
    and integrating the area inside that contour in the poloidal plane. Magnetic measurements,
    kinetic pressure constraints, and internal magnetic diagnostics can all affect
    the reconstructed contour geometry and therefore this area.


    Typical values range from about 0.1-5 m^2 for small and medium tokamaks and can
    exceed 10 m^2 in large reactor-scale equilibria. The value increases monotonically
    from near zero at the magnetic axis to the boundary area for well-nested flux
    surfaces, while non-nested or open-field-line regions are outside its validity.


    Sign convention: Positive when the oriented poloidal area element $dR\,dZ$ is
    taken with the contour orientation consistent with the right-handed cylindrical
    $(R, \phi, Z)$ basis.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  - name:area_of_plasma_boundary
  - name:poloidal_magnetic_flux
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/area
    dd_path: equilibrium/time_slice/profiles_1d/area
    status: composed
- name: area_of_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal cross-sectional area enclosed by the last closed flux surface,
    measuring the size of the plasma column in a meridional plane.
  documentation: 'The plasma-boundary area is the poloidal cross-sectional area enclosed
    by the last closed flux surface. It characterizes the geometric size of the confined
    plasma and is distinct from the full toroidal [surface area of the plasma boundary](name:surface_area_of_plasma_boundary).
    Together with the [poloidal length of the plasma boundary](name:poloidal_length_of_plasma_boundary),
    it provides a compact measure of boundary size and shape.


    For a closed boundary contour in the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height, the signed area can be written using Green''s theorem:


    $$

    A_b = \frac{1}{2}\oint_{\partial\Omega_b} \left(R\,dZ - Z\,dR\right)

    $$


    where $A_b$ is the boundary area and $\partial\Omega_b$ is the last-closed-flux-surface
    contour enclosing the plasma domain $\Omega_b$.


    The area is computed from equilibrium reconstruction by locating the separatrix
    or limiting boundary and evaluating the enclosed poloidal contour area by quadrature.
    It is also used to compare nested surfaces through [area of a flux surface](name:area_of_flux_surface)
    and to normalize shape metrics such as [outer triangularity](name:outer_triangularity).
    Typical values range from about 0.1-5 m^2 in compact or medium-size tokamaks and
    5-25 m^2 in large tokamak plasmas, depending mainly on minor radius and elongation.


    Sign convention: Positive when the plasma-boundary contour is traversed counter-clockwise
    in the poloidal $(R, Z)$ plane of the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m^2
  physics_domain: equilibrium
  links:
  - name:surface_area_of_plasma_boundary
  - name:poloidal_length_of_plasma_boundary
  - name:area_of_flux_surface
  - name:outer_triangularity
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/area
    dd_path: equilibrium/time_slice/global_quantities/area
    status: composed
- name: elongation
  kind: scalar
  status: draft
  description: Ratio of plasma-boundary vertical half-height to horizontal minor radius
    in the cylindrical (R, phi, Z) frame, measuring vertical stretching.
  documentation: 'Elongation, denoted $\kappa$, describes the vertical stretching
    of a closed flux surface or plasma boundary in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. For a boundary-like value it summarizes the overall shape
    of the last closed flux surface, while asymmetric shaping is resolved by [upper
    elongation](name:upper_elongation) and [lower elongation](name:lower_elongation_of_plasma_boundary).


    A common geometric definition is


    $$

    \kappa = \frac{Z_{\max}-Z_{\min}}{2a}

    $$


    where $Z_{\max}$ and $Z_{\min}$ are the upper and lower vertical extrema of the
    flux-surface contour, and $a = (R_{\max}-R_{\min})/2$ is the horizontal minor
    radius from the outer and inner radial extrema $R_{\max}$ and $R_{\min}$.


    Elongation is obtained from magnetic equilibrium reconstruction using magnetic
    probes, flux loops, pressure constraints, and shape measurements that determine
    the plasma-boundary contour. It is used with boundary position quantities such
    as [major radius of plasma boundary](name:major_radius_of_plasma_boundary) and
    shape parameters such as [outer triangularity](name:outer_triangularity) to characterize
    plasma shaping and vertical stability.


    Representative tokamak boundary values are about 1.0 for a circular cross-section,
    1.5-2.0 in many elongated H-mode plasmas, and up to about 2.5 in strongly shaped
    configurations before vertical-stability and control limits become restrictive.


    Sign convention: Positive when $Z_{\max}$ lies above $Z_{\min}$ in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame and the horizontal minor
    radius $a$ is positive.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation
  - name:lower_elongation_of_plasma_boundary
  - name:major_radius_of_plasma_boundary
  - name:outer_triangularity
  sources:
