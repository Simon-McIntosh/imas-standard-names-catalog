- name: diamagnetic_magnetic_flux
  kind: scalar
  status: draft
  description: Statistical weight factor assigned to the diamagnetic flux constraint
    in equilibrium reconstruction, controlling its relative contribution to the least-squares
    cost functional.
  documentation: "The diamagnetic flux $\\Phi_{\\mathrm{dia}}$ is the poloidal flux\
    \ contribution arising from the plasma diamagnetic current, which reduces the\
    \ toroidal magnetic field inside the plasma relative to the vacuum field. The\
    \ weight $w_{\\mathrm{dia}}$ is a dimensionless multiplicative factor in the $\\\
    chi^2$ cost function of equilibrium reconstruction, setting the relative importance\
    \ of the diamagnetic flux measurement against all other constraints. A weight\
    \ of unity applies the nominal measurement variance; larger values up-weight the\
    \ constraint when systematic effects (e.g., eddy currents, calibration drift)\
    \ are underestimated. Typical values for modern tokamaks are of order 1, with\
    \ adjustments spanning 0.1\u201310 depending on measurement reliability and the\
    \ reconstruction's sensitivity to the diamagnetic signal. This weight works alongside\
    \ [weight_of_poloidal_magnetic_field_probe](name:weight_of_poloidal_magnetic_field_probe)\
    \ and other constraint weights to determine the equilibrium solution.\n\nSign\
    \ convention: Positive when the diamagnetic flux constraint is active in the reconstruction\
    \ cost functional.\n\nThe companion constraint data is the diamagnetic flux measurement\
    \ itself, which is compared with the reconstructed diamagnetic flux derived from\
    \ the equilibrium. The poloidal component [poloidal_diamagnetic_magnetic_flux](name:poloidal_diamagnetic_magnetic_flux)\
    \ isolates the poloidal projection of this diamagnetic effect. Cross-reference\
    \ with [normalized_toroidal_flux_coordinate_at_constraint_position](name:normalized_toroidal_flux_coordinate_at_constraint_position)\
    \ when the constraint is applied at a specific radial location."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:weight_of_poloidal_magnetic_field_probe
  - name:poloidal_diamagnetic_magnetic_flux
  - name:normalized_toroidal_flux_coordinate_at_constraint_position
  sources:
  - id: dd:equilibrium/time_slice/constraints/diamagnetic_flux/weight
    dd_path: equilibrium/time_slice/constraints/diamagnetic_flux/weight
    status: composed
  - id: dd:equilibrium/time_slice/constraints/pressure/weight
    dd_path: equilibrium/time_slice/constraints/pressure/weight
    status: composed
- name: electron_density_at_measurement_position
  kind: scalar
  status: draft
  description: Electron number density at a spatial location used as a constraint
    in equilibrium reconstruction, representing either a measured or reconstructed
    value.
  documentation: 'The electron density $n_e$ at the specified measurement position
    serves as a local constraint in equilibrium reconstruction codes, providing pointwise
    information about the plasma density profile. This quantity can represent either
    a measured value from a diagnostic system (e.g., Thomson scattering, reflectometry,
    or interferometry) or the value calculated from the reconstructed equilibrium
    at the same spatial location.


    Typical values in tokamak plasmas range from $10^{19}\ \mathrm{m}^{-3}$ in the
    scrape-off layer to $10^{20}\ \mathrm{m}^{-3}$ in the core of high-density H-mode
    discharges. The density at the measurement position is compared with the reconstructed
    value in the equilibrium fitting process to evaluate the $

    chi^2$ cost functional.


    Sign convention: Positive when the electron number density is finite (the density
    is inherently a non-negative quantity).


    See also: [toroidal_current_density_at_constraint_position](name:toroidal_current_density_at_constraint_position)
    for the analogous current constraint, and [electron_density_at_divertor_target](name:electron_density_at_divertor_target)
    for the density in the divertor region.'
  unit: m^-3
  physics_domain: equilibrium
  links:
  - name:toroidal_current_density_at_constraint_position
  - name:electron_density_at_divertor_target
  sources:
  - id: dd:equilibrium/time_slice/constraints/n_e/measured
    dd_path: equilibrium/time_slice/constraints/n_e/measured
    status: composed
  - id: dd:equilibrium/time_slice/constraints/n_e/reconstructed
    dd_path: equilibrium/time_slice/constraints/n_e/reconstructed
    status: composed
- name: flux_surface_averaged_magnetic_field
  kind: scalar
  status: draft
  description: Flux-surface average of the total magnetic field magnitude, defined
    as the mean of |B| over a flux surface.
  documentation: 'This quantity represents the flux-surface average of the total magnetic
    field magnitude, computed as $\langle |B| \rangle = \frac{1}{V''} \oint |B| \,
    \frac{d\theta}{\mathbf{B} \cdot \nabla \theta}$ where $V'' = dV/d\psi$ is the
    flux-surface volume derivative. It is always positive irrespective of the sign
    convention for the magnetic field direction. In tokamak equilibria, the flux-surface
    averaged field varies radially, typically decreasing from the inboard to the outboard
    side; values range from $1\,\text{T}$ to $6\,\text{T}$ in present devices along
    the minor radius. This quantity is obtained from equilibrium reconstruction (e.g.,
    EFIT, LIUQE) and is related to the safety factor through $q = \frac{1}{2\pi} \oint
    \frac{B_\phi}{|\nabla\psi|} \, d\theta$. See [flux_surface_magnetic_field_magnitude](name:flux_surface_magnetic_field_magnitude)
    for a closely related quantity with an alternative label, and [magnetic_field_magnitude](name:magnetic_field_magnitude)
    for the unequally-weighted value at a point on a flux surface.


    Sign convention: Positive when the magnetic field magnitude is defined as the
    Euclidean norm of the magnetic field vector.


    The flux-surface average is a key ingredient in neoclassical transport theory,
    appearing in expressions for the bootstrap current and the neoclassical conductivity.
    For a given equilibrium, the on-axis value $\langle |B| \rangle_{\psi=0}$ matches
    the vacuum toroidal field $B_0$ scaled by the major radius ratio, while at the
    plasma edge it approaches the total field at the last closed flux surface.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:flux_surface_magnetic_field_magnitude
  - name:magnetic_field_magnitude
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/b_field_average
    dd_path: equilibrium/time_slice/profiles_1d/b_field_average
    status: composed
- name: magnetic_field_magnitude
  kind: scalar
  status: draft
  description: Maximum magnitude of the total magnetic field on each flux surface,
    determining the minimum possible value of the magnetic field strength encountered
    by a particle on that surface.
  documentation: 'The magnetic field magnitude maximum $B_\mathrm{max}(\psi)$ on a
    given flux surface is the largest value of $|\mathbf{B}|$ along the poloidal circumference.
    This quantity governs the mirror ratio $R_\mathrm{mirror} = B_\mathrm{max}/B_\mathrm{min}$
    of the magnetic well, which is a key parameter for trapped-particle confinement
    and neoclassical transport: particles with pitch angle $\xi = v_\parallel/v$ satisfying
    $|\xi| < \sqrt{1 - B_\mathrm{min}/B_\mathrm{max}}$ become trapped in the magnetic
    mirror. $B_\mathrm{max}$ is routinely obtained from equilibrium reconstruction
    codes (EFIT, LIUQE) and can be validated by ECE diagnostics resolving the cyclotron
    resonance layer. Typical core values in diverted tokamaks range from 1 T (low-field
    side) to 6 T (high-field side) depending on the plasma cross-section elongation
    and triangularity. See also [magnetic_field](name:magnetic_field) for the full
    vector field, [flux_surface_averaged_magnetic_field](name:flux_surface_averaged_magnetic_field)
    for the surface-averaged magnitude, and [magnetic_field_magnitude](name:magnetic_field_magnitude)
    for the local field modulus at a point.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  - name:flux_surface_averaged_magnetic_field
  - name:magnetic_field_magnitude
  arguments:
  - name: magnetic_field
    operator: magnitude
    operator_kind: unary_postfix
  sources:
