- name: vertical_coordinate_of_ion_cyclotron_heating_antenna
  kind: scalar
  status: draft
  description: "Vertical coordinate of the reference point used to locate an ion cyclotron\
    \ heating antenna. It is the Z component in the right-handed cylindrical (R, \u03C6\
    , Z) frame, where R is major radius and Z is vertical height."
  documentation: 'The vertical coordinate of an ion cyclotron heating antenna is the
    $Z$ component of the antenna reference point in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height. The reference point is a defined geometric point for the antenna
    placement; it is not necessarily a physical endpoint or aperture center unless
    the antenna geometry defines it that way.


    Together with the [major-radius coordinate] and toroidal angle of the same reference
    point, this quantity specifies the antenna reference-point position in the cylindrical
    $(R, \phi, Z)$ frame. The same coordinate concept is used for other actuator placement
    reference points, including lower-hybrid antennas, neutral-beam injectors, and
    electron-cyclotron launcher mirrors.


    In practice, the value is obtained from mechanical design geometry, installation
    alignment, or survey data for the antenna reference point, expressed in the right-handed
    cylindrical $(R, \phi, Z)$ frame. Any uncertainty is usually dominated by the
    definition of the reference point and by mechanical alignment tolerances rather
    than by plasma conditions.


    Typical values are device- and origin-dependent. For antennas mounted near a machine
    midplane the coordinate is often close to 0 m, while upper or lower port locations
    have positive or negative offsets with magnitudes from fractions of a meter to
    several meters depending on device size.


    Sign convention: Positive when the antenna reference point is displaced in the
    $+Z$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - id: dd:ic_antennas/reference_point/z
    dd_path: ic_antennas/reference_point/z
    status: composed
- name: vertical_coordinate_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: "Vertical Z-coordinate of the reference point of a lower hybrid antenna\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, where R is major radius,\
    \ \u03C6 is toroidal angle, and Z is vertical height."
  documentation: 'The vertical coordinate of a lower hybrid antenna is the $Z$ value
    of the antenna reference point in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It specifies the vertical placement of the launcher reference datum, typically
    relative to the $Z=0$ midplane of the device geometry.


    The coordinate is the $Z$ component assigned to the antenna reference point:


    $$

    Z_\mathrm{ant} = Z_\mathrm{ref}

    $$


    where $Z_\mathrm{ref}$ is the vertical coordinate of the nominated reference point
    and $Z_\mathrm{ant}$ is the corresponding lower-hybrid-antenna coordinate.


    The reference point is usually a mechanical or geometric datum of the launcher,
    such as a mounting datum, aperture center, or defined antenna center. It is determined
    from engineering geometry or installation survey data and, together with the complementary
    major-radius and toroidal-angle coordinates, fixes the antenna position in the
    right-handed cylindrical $(R, \phi, Z)$ frame. Row-specific vertical positions
    are represented separately by [vertical_coordinate_of_lower_hybrid_antenna_row](name:vertical_coordinate_of_lower_hybrid_antenna_row).


    Typical values are device- and installation-dependent. Midplane launchers often
    have $Z_\mathrm{ant}$ close to 0 m, while vertically displaced launchers can have
    offsets of order 0.1-1 m; larger offsets are possible in large devices or for
    antennas deliberately mounted away from the midplane.


    Sign convention: Positive when the reference point lies in the direction of increasing
    vertical coordinate $Z$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_lower_hybrid_antenna_row
  - name:current_due_to_lower_hybrid_current_drive
  sources:
  - id: dd:lh_antennas/reference_point/z
    dd_path: lh_antennas/reference_point/z
    status: composed
- name: vertical_coordinate_of_lower_hybrid_antenna_row
  kind: scalar
  status: draft
  description: Vertical Z coordinate, in meters, of the geometric reference point
    of a lower hybrid antenna row in the right-handed cylindrical (R, phi, Z) frame.
    It locates the row's height relative to the machine equatorial plane and is not
    the row height or row spacing.
  documentation: 'The vertical coordinate $Z_\mathrm{row}$ is the height of the specified
    geometric reference point of a lower hybrid antenna row in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. The datum is the row reference point used to locate the
    row geometry; this coordinate does not describe the physical vertical extent of
    the row.


    For a row reference point with cylindrical coordinates $(R_\mathrm{row}, \phi_\mathrm{row},
    Z_\mathrm{row})$, its position may be written as:


    $$

    \mathbf{x}_\mathrm{row} = R_\mathrm{row}\,\hat{R}(\phi_\mathrm{row}) + Z_\mathrm{row}\,\hat{Z}

    $$


    where $\hat{R}$ and $\hat{Z}$ are basis vectors of the right-handed cylindrical
    $(R, \phi, Z)$ frame, $R_\mathrm{row}$ is the major-radius coordinate, $\phi_\mathrm{row}$
    is the toroidal angle coordinate, and $Z_\mathrm{row}$ is the vertical coordinate
    in meters.


    This coordinate is normally obtained from the antenna mechanical geometry, alignment
    survey, or design model using the same row reference point as the companion major-radius
    and toroidal-angle coordinates. Together these three coordinates specify the location
    of the row reference point in space.


    There is no device-independent typical range for this coordinate. Rows mounted
    near the equatorial plane have $Z_\mathrm{row}$ close to $0$ m, while rows placed
    above or below the midplane take positive or negative values set by the launcher
    port location and row spacing.


    Sign convention: Positive when the row reference point lies in the $+\hat{Z}$
    direction of the right-handed cylindrical $(R, \phi, Z)$ frame from the $Z=0$
    equatorial plane.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_launched_wave_index_of_lower_hybrid_antenna
  - name:poloidal_launched_wave_index_of_lower_hybrid_antenna
  - name:vertical_coordinate_of_antenna_strap
  sources:
  - id: dd:lh_antennas/antenna/row/position/z
    dd_path: lh_antennas/antenna/row/position/z
    status: composed
- name: voltage_amplitude
  kind: scalar
  status: draft
  description: Peak magnitude of the radio-frequency voltage waveform at an ion-cyclotron
    antenna module transmission-line feed.
  documentation: 'Voltage amplitude is the peak magnitude of the RF potential difference
    between the conductors of an ion-cyclotron antenna module transmission-line feed
    at a specified reference plane. For a sinusoidal component it is the magnitude
    of the complex peak voltage phasor, not the RMS value; the RMS value is $V_{\mathrm{amp}}/\sqrt{2}$.


    With synchronized peak phasors for voltage and current at the same reference plane,
    the net time-averaged real power crossing that plane is


    $$

    P_{\mathrm{net}} = \frac{1}{2} V_{\mathrm{amp}} I_{\mathrm{amp}} \cos(\theta_V-\theta_I)

    $$


    where $P_{\mathrm{net}}$ is in W, $V_{\mathrm{amp}}$ is the voltage amplitude
    in V, $I_{\mathrm{amp}}$ is the current amplitude in A, and $\theta_V$ and $\theta_I$
    are voltage and current phases in radians. This relation shows that voltage amplitude
    and current amplitude alone do not determine RF power; the relative phase is also
    required.


    The amplitude is obtained from calibrated high-voltage RF probes, capacitive dividers,
    directional couplers, or equivalent transmission-line measurements by extracting
    the peak phasor at the operating frequency. For reflection analysis, voltage,
    current, phase, and line-impedance calibration must refer to the same reference
    plane; forward and reflected powers require a traveling-wave decomposition and
    are affected by transmission-line losses, matching networks, and probe calibration.
    Comparisons with [reflected_power_of_ion_cyclotron_heating_antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)
    or with forward-minus-reflected power should include only the power balance defined
    at that reference plane after accounting for intervening losses.


    Typical peak amplitudes in high-power ion-cyclotron heating feeds are $5\times10^3$-$5\times10^4$
    V; low-power conditioning may be below $10^3$ V, while voltage-standoff limits
    often keep routine operation below about $8\times10^4$ V.'
  unit: V
  physics_domain: auxiliary_heating
  links:
  - name:capacitance_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:ic_antennas/antenna/module/voltage/amplitude
    dd_path: ic_antennas/antenna/module/voltage/amplitude
    status: composed
- name: x1_coordinate_of_aperture
  kind: scalar
  status: draft
  description: First local transverse coordinate of a neutral-beam injector collimating-aperture
    outline vertex, measured from the aperture origin in the local aperture-plane
    Cartesian (X1, X2) frame.
  documentation: 'The $X_1$ coordinate of an aperture is the signed distance of an
    outline vertex along the first axis of the local aperture-plane Cartesian $(X_1,
    X_2)$ frame with in-plane basis $(\hat{X}_1, \hat{X}_2)$. The frame origin is
    the aperture reference point, normally the nominal beam-axis intersection with
    the aperture plane or the mechanical center used for alignment; $X_1=0$ is the
    line through that origin parallel to the $X_2$ axis. It is not a coordinate in
    the right-handed cylindrical $(R, \phi, Z)$ frame; it describes transverse position
    within the injector aperture plane.


    Together with [x2_coordinate_of_aperture](name:x2_coordinate_of_aperture), ordered
    vertices define the closed planar aperture boundary: consecutive vertices lie
    on adjacent boundary segments, and the final vertex is connected back to the first.
    The coordinate is determined by projecting each vertex position in the aperture
    plane onto the $+\hat{X}_1$ axis after the local origin and axis orientation have
    been established from component geometry and alignment.


    Typical neutral-beam collimating apertures have transverse half-widths of 0.01-0.3
    m, so individual $X_1$ vertex coordinates commonly span from about -0.3 m to 0.3
    m. Small beamlet or mask openings may be at the 0.001-0.02 m scale, while large
    shaped collimators can approach 0.5 m in full width.


    Sign convention: Positive when the vertex displacement from the aperture origin
    is along the $+X_1$ direction of the local aperture-plane Cartesian $(X_1, X_2)$
    frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:x2_coordinate_of_aperture
  - name:x1_coordinate_of_filter
  sources:
  - id: dd:nbi/unit/aperture/outline/x1
    dd_path: nbi/unit/aperture/outline/x1
    status: composed
- name: x1_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: X1 coordinate of a vertex on the closed outline contour of an electron
    cyclotron launcher mirror in its element-local planar (X1, X2) Cartesian frame.
  documentation: "The electron cyclotron launcher mirror is a steerable reflective\
    \ element used in ECRH and ECCD systems to direct the gyrotron beam into the plasma\
    \ at a prescribed injection angle. Its cross-sectional boundary is described by\
    \ a closed outline contour defined in a local two-dimensional Cartesian frame\
    \ with orthogonal axes X1 and X2. This coordinate gives the position of each successive\
    \ vertex of that closed polygon along the X1 axis, fully specifying the mirror\
    \ shape in the local plane at its reference (unrotated) position.\n\nThe local\
    \ (X1, X2) frame is attached to the mirror at its reference orientation; the relationship\
    \ of this frame to the machine's right-handed cylindrical $(R, \\phi, Z)$ frame\
    \ is determined by the mirror's mounting geometry. Together with [x2_coordinate_of_electron_cyclotron_launcher_mirror](name:x2_coordinate_of_electron_cyclotron_launcher_mirror),\
    \ this coordinate fully defines the 2D mirror outline. The [angle_of_electron_cyclotron_launcher_mirror](name:angle_of_electron_cyclotron_launcher_mirror)\
    \ describes rotation of the mirror about its movement axis, but the outline vertex\
    \ coordinates in the local frame remain fixed with respect to that rotation.\n\
    \nMirror apertures in ECRH systems span roughly 5\u201320 cm, so X1 outline vertex\
    \ values cover ranges of that order within the local frame.\n\nSign convention:\
    \ Positive when the outline vertex lies in the positive X1 direction of the element-local\
    \ Cartesian frame."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:x2_coordinate_of_electron_cyclotron_launcher_mirror
  - name:angle_of_electron_cyclotron_launcher_mirror
  sources:
  - id: dd:ec_launchers/mirror/geometry/outline/x1
    dd_path: ec_launchers/mirror/geometry/outline/x1
    status: composed
- name: x1_coordinate_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Position along X1 of a neutral beam injector source-outline vertex
    in the beam-local Cartesian (X1, X2) frame, referenced to the aperture center.
  documentation: 'The $X_1$ coordinate of a neutral beam injector source-outline vertex
    is the signed displacement of that vertex along the first transverse axis of the
    beam-local Cartesian $(X_1, X_2)$ frame. This frame has basis axes $(\hat{X}_1,
    \hat{X}_2)$ in the source extraction plane, transverse to the nominal beam propagation
    direction. The origin is the source-aperture center, i.e. the intersection of
    the nominal beam centerline with the extraction plane.


    Together with the [X2 coordinate](name:x2_coordinate_of_neutral_beam_injector),
    this quantity defines a vertex of the closed outline of the beam extraction surface.
    The outline geometry is usually obtained from the source-aperture design or as-built
    metrology; vertices are normally ordered consistently around the aperture, clockwise
    or counterclockwise as viewed along the nominal beam direction. A rectangular
    source outline uses four vertices, while chamfered, rounded, or segmented extraction
    surfaces may use more.


    The local source outline complements global injector-position quantities such
    as the [vertical coordinate of a neutral beam injector](name:vertical_coordinate_of_neutral_beam_injector),
    which are expressed in the right-handed cylindrical $(R, \phi, Z)$ frame where
    $R$ is major radius, $\phi$ is toroidal angle increasing counterclockwise when
    viewed from $+\hat{Z}$, and $Z$ is vertical height.


    Representative absolute values of $X_1$ for neutral beam source outlines are typically
    0.05-0.5 m, depending on source size and whether $X_1$ is aligned with the wider
    or narrower aperture dimension; large high-power source modules can be larger.


    Sign convention: Positive when the source-outline vertex is displaced from the
    local origin in the $+\hat{X}_1$ direction of the beam-local Cartesian $(X_1,
    X_2)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:x2_coordinate_of_neutral_beam_injector
  - name:x1_coordinate_of_neutron_detector
  - name:x2_coordinate_of_aperture
  sources:
  - id: dd:nbi/unit/source/outline/x1
    dd_path: nbi/unit/source/outline/x1
    status: composed
- name: x2_coordinate_of_aperture
  kind: scalar
  status: draft
  description: Second local coordinate of a neutral beam injector collimating-aperture
    outline vertex in the transverse (X1, X2) aperture plane. With the paired first
    coordinate, it gives the signed in-plane position of a beam-limiting boundary
    point relative to the aperture origin.
  documentation: 'The X2 coordinate is the signed scalar component of an aperture-outline
    vertex along the second axis of the local aperture-plane Cartesian frame $(X_1,
    X_2)$ with basis $(\hat{X}_1, \hat{X}_2)$. The local origin is the point represented
    by $x_1=x_2=0$, and all aperture vertices use the same origin and in-plane basis.
    Paired with [x1_coordinate_of_aperture](name:x1_coordinate_of_aperture), it identifies
    a point on the boundary of the neutral beam collimating opening.


    Given an aperture-plane origin $\mathbf{r}_0$ and unit basis vectors $\hat{X}_1$
    and $\hat{X}_2$, the local reconstruction of a vertex position is


    $$

    \mathbf{r}_v = \mathbf{r}_0 + x_1\hat{X}_1 + x_2\hat{X}_2

    $$


    where $\mathbf{r}_v$ is the vertex position in the aperture plane, $x_1$ is the
    paired first local coordinate, and $x_2$ is this second local coordinate.


    Aperture-outline coordinates are specified from the mechanical definition of the
    collimating aperture or from a measured outline of the hardware. They are used
    when the beam-limiting opening is represented by explicit boundary vertices rather
    than by a reduced geometric parameter such as width_of_aperture for a rectangular
    description or [neutral_beam_radius_of_aperture](name:neutral_beam_radius_of_aperture)
    for a circular description.


    Values are expressed in meters and may be negative, zero, or positive depending
    on the vertex location and the chosen local origin. The applicable range is aperture-specific;
    for an opening centered on the local origin, X2 coordinates span roughly from
    $-a_2$ to $+a_2$, where $a_2$ is the half-extent of the aperture along $\hat{X}_2$.


    Sign convention: Positive when the vertex is displaced from the local aperture-plane
    origin in the $+\hat{X}_2$ direction.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:x1_coordinate_of_aperture
  - name:neutral_beam_radius_of_aperture
  sources:
  - id: dd:nbi/unit/aperture/outline/x2
    dd_path: nbi/unit/aperture/outline/x2
    status: composed
- name: x2_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: X2 coordinate of a point on the boundary contour of an electron cyclotron
    launcher mirror in its local planar (X1, X2) frame.
  documentation: 'The X2 coordinate of an electron cyclotron launcher mirror is the
    signed in-plane displacement of a boundary-contour point along the second axis
    of the mirror''s local planar Cartesian $(X_1, X_2)$ frame with basis $(\hat{X}_1,
    \hat{X}_2)$. Together with the companion $X_1$ coordinate, it describes the mirror
    outline relative to the mirror reference point, not the absolute position of the
    mirror center.


    For a contour point with in-plane position vector $\mathbf{r}_\perp$ measured
    from the mirror reference point, the coordinate is


    $$

    x_2 = \mathbf{r}_\perp \cdot \hat{X}_2

    $$


    where $\hat{X}_2$ is the unit vector along the second local planar axis and $x_2$
    is measured in meters.


    In practice, this coordinate is obtained from the mirror design geometry, metrology,
    or a fitted boundary model by projecting each outline point onto the local $(X_1,
    X_2)$ axes. The local outline specifies the mirror aperture or reflecting-surface
    boundary; placement of the mirror center in the right-handed cylindrical $(R,
    \phi, Z)$ frame requires separate radial and vertical center coordinates, together
    with the mirror orientation.


    Typical values are set by the mirror size: small steering mirrors often have $x_2$
    coordinates within about -0.1-0.1 m, while larger focusing or launcher mirrors
    may span roughly -0.5-0.5 m.


    Sign convention: Positive when the boundary point is displaced in the $+\hat{X}_2$
    direction of the local planar Cartesian $(X_1, X_2)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:x1_coordinate_of_electron_cyclotron_launcher_mirror
  - name:angle_of_electron_cyclotron_launcher_mirror
