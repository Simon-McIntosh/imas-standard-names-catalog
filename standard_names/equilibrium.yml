- name: radial_magnetization_of_iron_core_segment
  kind: scalar
  status: draft
  description: Radial component, in the right-handed cylindrical (R, phi, Z) frame,
    of the magnetic-flux-density-equivalent magnetization of an iron core segment.
    It equals the permeability of free space times the textbook radial magnetization
    component, so it is expressed in tesla rather than amperes per meter.
  documentation: 'Radial magnetization of an iron core segment is the radial component
    of the segment magnetization vector in the right-handed cylindrical $(R, \phi,
    Z)$ system, where $R$ is the major radius measured from the toroidal symmetry
    axis and $Z$ is vertical height. The documented quantity is the magnetic-flux-density-equivalent
    component, equal to the permeability of free space times the textbook magnetization
    component, so it is expressed in tesla rather than amperes per meter.


    The conversion from the textbook material magnetization to this iron-core quantity
    is


    $$

    M_R = \mu_0\,\mathbf{M}\cdot\hat{R}

    $$


    where $\mathbf{M}$ is the material magnetization vector in A/m, $\hat{R}$ is the
    outward radial unit vector of the right-handed cylindrical $(R, \phi, Z)$ system,
    and $\mu_0 = 4\pi \times 10^{-7}$ T m/A is the permeability of free space.


    In equilibrium analysis, this quantity is inferred from magnetic measurements
    together with a ferromagnetic model of the iron core. The segment model treats
    the magnetization as uniform within each iron segment, while the fitted value
    can depend on nonlinear permeability, hysteresis, remanent magnetization, demagnetization
    effects, and the approach to magnetic saturation.


    Typical values range from near 0 T in weakly magnetized or demagnetized regions
    to about 1.5-2.2 T in magnitude near saturation in soft iron. The radial component
    may be much smaller than the total magnetization if the material is magnetized
    mainly in another direction.


    Sign convention: Positive when the magnetization vector has a component in the
    $+\hat{R}$ direction, outward from the toroidal symmetry axis, in the right-handed
    cylindrical $(R, \phi, Z)$ system.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:vertical_magnetization_of_iron_core_segment
  sources:
  - id: dd:equilibrium/time_slice/constraints/iron_core_segment/magnetisation_r/measured
    dd_path: equilibrium/time_slice/constraints/iron_core_segment/magnetisation_r/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/iron_core_segment/magnetisation_r/reconstructed
    dd_path: equilibrium/time_slice/constraints/iron_core_segment/magnetisation_r/reconstructed
    status: attached
  - id: dd:equilibrium/time_slice/constraints/iron_core_segment/magnetization_r/measured
    dd_path: equilibrium/time_slice/constraints/iron_core_segment/magnetization_r/measured
    status: attached
  - id: dd:equilibrium/time_slice/constraints/iron_core_segment/magnetization_r/reconstructed
    dd_path: equilibrium/time_slice/constraints/iron_core_segment/magnetization_r/reconstructed
