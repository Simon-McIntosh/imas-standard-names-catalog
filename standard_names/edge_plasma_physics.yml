      kind: template
- name: total_power_at_separatrix
  kind: scalar
  status: active
  description: Net energy power leaving the confined plasma through the last closed
    magnetic flux surface and entering the scrape-off layer.
  documentation: 'Separatrix power is the net global energy loss from the confined
    plasma into the scrape-off layer across the last closed magnetic flux surface.
    It represents the aggregate power crossing the entire separatrix rather than a
    local surface value.


    The defining boundary integral is


    $$

    P_{\rm sep} = \oint_{S_{\rm sep}} \mathbf{S}_E \cdot \hat{\mathbf{n}}\, dA

    $$


    where $P_{\rm sep}$ is the separatrix power, $S_{\rm sep}$ is the last closed
    magnetic flux surface, $\mathbf{S}_E$ is the net plasma-energy flux density, $\hat{\mathbf{n}}$
    is the unit normal directed from the confined plasma toward the scrape-off layer,
    and $dA$ is an element of separatrix area.


    This is a total, net quantity integrated over the complete separatrix. It applies
    to the confined plasma as a whole, with no selection of species, reaction channel,
    or individual transport mechanism; outward energy transfer is the plasma loss
    represented by the quantity. It is not a pointwise energy-flux density or a power
    associated with a single surface location.


    The boundary total is distinct from [radiated power over the core region](name:radiated_power_over_core_region),
    which describes electromagnetic power emitted within the core and is not necessarily
    equal to power crossing the separatrix. It is also distinct from [power due to
    conduction](name:power_due_to_conduction), which describes conduction-mediated
    power deposited on plasma-facing surfaces downstream of the separatrix.'
  unit: W
  physics_domain: edge_plasma_physics
  links:
  - name:radiated_power_over_core_region
  sources:
  - dd_path: summary/global_quantities/power_loss/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-global_quantities-power_loss-value
    dd_documentation:
      leaf: Value
      parent_path: summary/global_quantities/power_loss
      parent: Power through separatrix
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Total power crossing the separatrix (Psep), representing the net
        energy loss from the confined plasma through the last closed flux surface
        into the scrape-off layer.
      kind: template
- name: toroidal_flux_coordinate_at_pedestal_top
  kind: scalar
  status: active
  description: Non-negative radius-like toroidal-flux label identifying the magnetic
    flux surface at the core-side shoulder of the H-mode edge transport barrier.
  documentation: 'This quantity is the non-negative, radius-like toroidal-flux label
    of the magnetic flux surface at the H-mode [pedestal top](name:normalized_poloidal_flux_coordinate_of_pedestal),
    the core-side shoulder of the edge transport barrier. It locates that surface
    on the physical toroidal-flux scale rather than specifying a geometric distance.


    The coordinate is defined from enclosed toroidal magnetic flux by:


    $$

    \rho_{\rm tor} = \sqrt{\frac{\Phi_{\rm tor}}{\pi B_0}}

    $$


    where $\rho_{\rm tor}$ is the toroidal flux coordinate, $\Phi_{\rm tor}$ is the
    enclosed toroidal magnetic flux, $B_0$ is the positive reference vacuum toroidal-field
    magnitude that sets the coordinate scale, and $\pi$ is the circular constant.


    The value applies to the single nested magnetic flux surface passing through the
    pedestal top. It is a local flux-surface label, not a flux-surface or volume average,
    and it has no particle-population or charge-state aggregation.


    This is the pedestal-top specialization of the parent [toroidal flux coordinate](name:toroidal_flux_coordinate),
    obtained by evaluating that coordinate on the pedestal-top surface. Unlike the
    [normalized toroidal flux coordinate at the pedestal top](name:normalized_toroidal_flux_coordinate_at_pedestal_top),
    it retains the radius-like physical scale of the toroidal flux coordinate.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_flux_coordinate_of_pedestal
  - name:toroidal_flux_coordinate
  - name:normalized_toroidal_flux_coordinate_at_pedestal_top
  arguments:
  - name: toroidal_flux_coordinate
    operator: pedestal_top
    operator_kind: locus
  sources:
  - dd_path: summary/local/pedestal/position/rho_tor
