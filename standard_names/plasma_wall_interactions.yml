- name: vertical_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the divertor target surface center in the
    right-handed cylindrical (R, phi, Z) frame, where Z is vertical height.
  documentation: 'The vertical coordinate of the divertor target is the $Z$ component
    of the geometric center of the target surface in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It locates the hardware surface as a geometric reference
    and is distinct from the vertical position of a plasma strike point on that surface.


    For a finite divertor target surface $S_t$, the surface-center coordinate is the
    area centroid of that surface:


    $$

    Z_t = \frac{1}{A_t}\int_{S_t} Z(\mathbf{x})\,dA, \qquad A_t = \int_{S_t} dA

    $$


    where $Z_t$ is the target-center vertical coordinate, $A_t$ is the target-surface
    area, $dA$ is the surface area element, and $Z(\mathbf{x})$ is the vertical height
    of point $\mathbf{x}$ on the target surface.


    In practice this coordinate is computed from the defined target geometry, for
    example from an engineering surface model, metrology description, or calibrated
    diagnostic geometry. For a mesh representation, the integral is evaluated as an
    area-weighted average of the mesh-element center $Z$ coordinates. The corresponding
    horizontal or transverse coordinates are described by [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [y_coordinate_of_divertor_target](name:y_coordinate_of_divertor_target), while
    inner and outer strike-location quantities refer to different physical points
    on the divertor.


    Typical values are machine-size and vertical-origin dependent. In lower-single-null
    tokamaks the target surface center commonly has $Z<0$, often about 0.5-3 m below
    the magnetic-axis or midplane region in medium to large devices; upper-divertor
    targets have comparable positive values, and compact devices can have magnitudes
    of about 0.1-1 m.


    Sign convention: Positive when the divertor target surface center lies in the
    $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:y_coordinate_of_divertor_target
  - name:vertical_coordinate_of_inner_divertor_target
  - name:vertical_coordinate_of_outer_divertor_target
  sources:
  - id: dd:camera_ir/channel/target_surface_center/z
    dd_path: camera_ir/channel/target_surface_center/z
    status: composed
- name: vertical_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: Vertical Z-coordinate, in meters, of the center of an optical element
    in the right-handed cylindrical (R, phi, Z) frame, measured upward from the machine
    midplane.
  documentation: 'The vertical coordinate of an optical element is the height of the
    element''s center along the $Z$ axis of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It specifies the element position relative to the machine midplane and
    is independent of the element orientation, aperture size, or viewing direction.


    For an optical-element center position $\mathbf{x}_c$, the vertical coordinate
    is the projection of its displacement from the midplane reference onto the vertical
    basis direction:


    $$

    Z_c = (\mathbf{x}_c - \mathbf{x}_0) \cdot \hat{Z}

    $$


    where $\mathbf{x}_0$ is a reference point on the machine midplane, $\hat{Z}$ is
    the upward vertical unit vector, and $Z_c$ is reported in meters.


    This coordinate is usually obtained from mechanical survey, metrology, or geometry
    models of the diagnostic hardware. For finite optical components such as lenses,
    mirrors, fibers, or apertures, the center should be the defined geometric or optical
    center used consistently with the corresponding radial and toroidal coordinates.


    Typical signed values for optical elements near the vessel or diagnostic ports
    are about $-5$ m to $5$ m in medium-sized tokamaks, with larger devices extending
    to roughly $\pm 10$ m. Values near $0$ m indicate placement close to the machine
    midplane.


    Sign convention: Positive when the optical-element center lies in the $+Z$ direction,
    upward from the machine midplane.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_coordinate_of_diagnostic_aperture
  - name:vertical_coordinate_of_measurement_position
  sources:
  - id: dd:camera_ir/fibre_bundle/geometry/centre/z
    dd_path: camera_ir/fibre_bundle/geometry/centre/z
    status: composed
- name: x_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: X coordinate of the center of a diagnostic aperture, measured along
    the x axis in a right-handed camera Cartesian frame with basis (x, y, z). It locates
    the aperture laterally relative to the chosen camera-frame origin.
  documentation: 'The x coordinate of a diagnostic aperture is the signed lateral
    position of the aperture center relative to the origin of a right-handed camera
    Cartesian frame with basis $(\hat{x}, \hat{y}, \hat{z})$. It specifies one component
    of the aperture center location used to define viewing geometry, optical alignment,
    and line-of-sight calculations.


    The coordinate is the projection of the aperture-center displacement onto the
    camera-frame x basis direction:


    $$

    x_\mathrm{ap} = (\mathbf{r}_\mathrm{ap} - \mathbf{r}_0) \cdot \hat{x}

    $$


    where $\mathbf{r}_\mathrm{ap}$ is the aperture-center position, $\mathbf{r}_0$
    is the origin of the camera Cartesian frame, and $\hat{x}$ is the unit vector
    along its x axis.


    In practice, this coordinate is determined from mechanical design drawings, metrology,
    optical calibration, or camera alignment procedures. Together with the corresponding
    y and z coordinates, it fixes the aperture center used to construct rays or fields
    of view for diagnostics such as infrared cameras, visible cameras, bolometry,
    or spectroscopy systems.


    Typical values depend on the chosen camera origin and optical layout. For compact
    in-vessel or port-mounted diagnostics, offsets are often in the range -0.5-0.5
    m, while larger external optical assemblies may have offsets of order -2-2 m.


    Sign convention: Positive when the aperture center is displaced from the camera-frame
    origin in the $+\hat{x}$ direction of the right-handed camera Cartesian frame
    with basis $(\hat{x}, \hat{y}, \hat{z})$.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_diagnostic_aperture
  - name:x1_coordinate_of_filter
  - name:x2_coordinate_of_diagnostic_aperture
  - name:x_coordinate_of_sensor_attachment_point
  sources:
  - id: dd:camera_ir/channel/camera/pinhole/x
    dd_path: camera_ir/channel/camera/pinhole/x
    status: composed
- name: x_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Cartesian x coordinate of the divertor target surface center in the
    right-handed Cartesian (x, y, z) frame. The +x direction is the horizontal direction
    corresponding to toroidal angle phi = 0, and z is vertical.
  documentation: 'The x coordinate of a divertor target is the signed horizontal Cartesian
    coordinate of the geometric center of the target surface, expressed relative to
    an origin on the toroidal symmetry axis in the right-handed Cartesian $(\hat{x},
    \hat{y}, \hat{z})$ basis. The $+\hat{x}$ direction is the horizontal reference
    direction at toroidal angle $\phi=0$, and $\hat{z}$ is vertical. The coordinate
    itself does not identify which physical target is meant; inner, outer, upper,
    lower, or other target identity is specified by the associated divertor geometry
    context.


    Its relation to the right-handed cylindrical $(R, \phi, Z)$ frame is


    $$

    x = R \cos\phi

    $$


    where $R$ is the major radius measured from the toroidal symmetry axis, $\phi$
    is the toroidal angle measured from the $+\hat{x}$ direction, and $Z$ is vertical
    height with $z=Z$.


    This coordinate is used with the corresponding y and vertical coordinates to locate
    the divertor target surface center in three-dimensional space. It provides the
    geometric reference point for describing target placement, plasma-wall interaction
    geometry, and line-of-sight or incidence-angle relationships without implying
    any particular method used to determine the geometry.


    Typical magnitudes for divertor target surface centers are about 0.5-8 m in medium-size
    to large tokamaks. Values near the $\phi=0$ reference direction are positive and
    comparable to the local major radius, while targets at other toroidal angles can
    have smaller or negative x coordinates.


    Sign convention: Positive when the divertor-target surface center lies on the
    $+\hat{x}$ side of the origin in the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:y_coordinate_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
  sources:
  - id: dd:camera_ir/channel/target_surface_center/x
    dd_path: camera_ir/channel/target_surface_center/x
    status: composed
- name: x_direction_unit_vector_of_camera
  kind: scalar
  status: draft
  description: X-axis projection of the unit vector defining the image-up orientation
    direction of a camera in the right-handed Cartesian (x, y, z) frame.
  documentation: 'The X component of the camera''s image-up direction unit vector
    specifies how much the camera''s vertical image axis aligns with the $\hat{x}$
    direction of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame. The
    image-up direction defines which way is "up" in the camera''s recorded field of
    view and, together with the line-of-sight axis, fully characterizes the camera''s
    rotational orientation in the machine frame.


    The three Cartesian components $(u_x, u_y, u_z)$ of the image-up unit vector satisfy
    the normalization constraint:


    $$

    u_x^2 + u_y^2 + u_z^2 = 1

    $$


    where $u_x$ is this quantity and $u_y$ is the [Y component](name:y_direction_unit_vector_of_camera).
    Because the vector is a unit vector by construction, the magnitude of each component
    is bounded between $-1$ and $+1$.


    The components are established from the mechanical mounting geometry of the camera,
    typically determined during installation surveys or geometric calibration against
    surveyed reference targets. Knowing the image-up vector is essential for mapping
    pixel coordinates in the camera image to spatial directions in the machine frame.


    Sign convention: Positive when the camera''s image-up direction unit vector has
    a component pointing in the $+\hat{x}$ direction of the right-handed Cartesian
    $(\hat{x}, \hat{y}, \hat{z})$ frame.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:y_direction_unit_vector_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/up/x
    dd_path: camera_ir/channel/camera/up/x
    status: composed
- name: xenon_density_at_limiter
  kind: scalar
  status: draft
  description: Total xenon ion number density in the boundary plasma immediately adjacent
    to a limiter, summed over all positive charge states and excluding neutral xenon
    atoms.
  documentation: 'Xenon density at a limiter is the total number density of xenon
    ions at the plasma-side near-sheath location where open magnetic field lines meet
    the limiter surface. The unqualified impurity ion density is summed over all positive
    xenon charge states; neutral xenon atoms are excluded. As a number density, its
    physical range is non-negative.


    It is defined from charge-state-resolved xenon ion densities by


    $$

    n_{\mathrm{Xe,lim}} = \sum_{q=1}^{Z_{\mathrm{Xe}}} n_{\mathrm{Xe}^{q+},\mathrm{lim}}

    $$


    where $q$ is the integer positive charge state, $Z_{\mathrm{Xe}}=54$ is the xenon
    nuclear charge, and $n_{\mathrm{Xe}^{q+},\mathrm{lim}}$ is the local density of
    xenon ions with charge $+q e$ at the limiter, in m$^{-3}$. The summed density
    $n_{\mathrm{Xe,lim}}$ is also in m$^{-3}$.


    In practice this quantity is inferred from edge and limiter-region line emission
    together with collisional-radiative modeling, local electron temperature and electron
    density estimates, and boundary-plasma transport modeling. It is sensitive to
    local ionization and recombination, parallel transport along open field lines,
    xenon source strength, and recycling or retention at nearby plasma-facing material.


    Typical values are highly scenario dependent. Trace xenon seeding near a limiter
    can give about $10^{12}$-$10^{16}$ m$^{-3}$, while strong localized injection
    or radiating-edge operation can produce local near-surface values of about $10^{16}$-$10^{18}$
    m$^{-3}$; the value remains zero when no xenon ions are present.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:xenon_density_at_pedestal
  - name:xenon_density_at_plasma_boundary
  - name:density_at_limiter
  - name:neon_density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: xenon
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/xenon/value
    dd_path: summary/local/limiter/n_i/xenon/value
    status: composed
- name: y_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Y coordinate of the center of a diagnostic aperture in the camera right-handed
    Cartesian (x, y, z) frame, measured from that frame's origin along its y axis.
  documentation: 'The Y coordinate of a diagnostic aperture is the displacement of
    the aperture center along the $\hat{\mathbf{y}}$ axis of the camera right-handed
    Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame. The
    frame origin is the point assigned coordinates $(0,0,0)$ by the calibrated camera
    geometry, so this coordinate is one component of the aperture-center position
    relative to that same origin.


    The camera-frame aperture position and its Y component are related by projection
    onto the camera-frame basis:


    $$

    \mathbf{r}_{O_c\to\mathrm{ap}} = x_\mathrm{ap}\hat{\mathbf{x}} + y_\mathrm{ap}\hat{\mathbf{y}}
    + z_\mathrm{ap}\hat{\mathbf{z}}, \qquad y_\mathrm{ap} = \mathbf{r}_{O_c\to\mathrm{ap}}\cdot\hat{\mathbf{y}}

    $$


    where $O_c$ is the camera-frame origin, $\mathbf{r}_{O_c\to\mathrm{ap}}$ is the
    vector from that origin to the aperture center, $x_\mathrm{ap}$, $y_\mathrm{ap}$,
    and $z_\mathrm{ap}$ are camera-frame Cartesian coordinates in meters, and the
    basis vectors are dimensionless unit vectors. The camera-frame $z_\mathrm{ap}$
    component is distinct from vertical height unless the camera right-handed Cartesian
    $(\hat{\mathbf{x}}, \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame is explicitly aligned
    with the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height.


    This coordinate is determined from the calibrated geometry of the diagnostic aperture,
    using mechanical design information, optical-bench survey, photogrammetry, or
    in-vessel alignment measurements. Together with [x_coordinate_of_diagnostic_aperture](name:x_coordinate_of_diagnostic_aperture)
    and the corresponding camera-frame $z$ component, it specifies the aperture-center
    position in the camera right-handed Cartesian $(\hat{\mathbf{x}}, \hat{\mathbf{y}},
    \hat{\mathbf{z}})$ frame; related geometric descriptions may instead use [major_radius_of_diagnostic_aperture](name:major_radius_of_diagnostic_aperture)
    and [vertical_coordinate_of_diagnostic_aperture](name:vertical_coordinate_of_diagnostic_aperture)
    in the right-handed cylindrical $(R,\phi,Z)$ frame.


    Typical numerical values are installation-specific because they depend on the
    chosen camera-frame origin and aperture mounting geometry. The coordinate is reported
    in meters and is normally fixed for a calibrated aperture unless the diagnostic
    is mechanically reconfigured or realigned.


    Sign convention: Positive when the aperture center is displaced in the $+\hat{\mathbf{y}}$
    direction from the origin of the camera right-handed Cartesian $(\hat{\mathbf{x}},
    \hat{\mathbf{y}}, \hat{\mathbf{z}})$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_diagnostic_aperture
  sources:
  - id: dd:camera_ir/channel/camera/pinhole/y
    dd_path: camera_ir/channel/camera/pinhole/y
    status: composed
- name: y_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Cartesian Y coordinate of the divertor target surface center in the
    right-handed (x, y, z) frame.
  documentation: 'The Y coordinate locates the center of the divertor target surface
    along the $\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where
    $\hat{z} = \hat{Z}$ is vertical and $\hat{x}$ is aligned with $\phi = 0$, with
    the toroidal angle $\phi$ increasing counter-clockwise when viewed from above
    $+\hat{Z}$. This coordinate relates to the cylindrical $(R, \phi, Z)$ description
    of the same point by the standard transformation $y = R\sin\phi$, where $R$ is
    the major radius from the toroidal symmetry axis and $\phi$ is the toroidal angle.


    This coordinate is used alongside [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target)
    to fully specify the three-dimensional Cartesian position of the divertor target
    center in plasma-wall interaction modeling. It is obtained from engineering drawings
    of the divertor geometry or from geometric calibration of diagnostics such as
    infrared cameras that image the target surface.


    The magnitude of $y$ is bounded by the major radius of the machine; for a target
    segment at toroidal angle $\phi$ and radial distance $R$ from the symmetry axis,
    $|y|$ spans zero to approximately $R$ depending on the toroidal location of the
    target.


    Sign convention: Positive when the divertor target center is displaced in the
    $+\hat{y}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
  sources:
  - id: dd:camera_ir/channel/target_surface_center/y
    dd_path: camera_ir/channel/target_surface_center/y
    status: composed
- name: y_direction_unit_vector_of_camera
  kind: scalar
  status: draft
  description: Y component of the camera's image-up unit vector in its local right-handed
    Cartesian (x, y, z) frame. It is a dimensionless scalar giving the projection
    of the camera's image-up direction onto the local +y axis.
  documentation: 'The y direction unit vector component of a camera is the y projection
    of the camera''s image-up unit vector, which defines the physical direction appearing
    upward in the recorded image. It is resolved in the camera''s local right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame and is a dimensionless scalar.


    The component is the projection of the normalized up vector onto the local $\hat{y}$
    basis direction:


    $$

    u_y = \mathbf{u}_{\mathrm{up}} \cdot \hat{y}

    $$


    where $\mathbf{u}_{\mathrm{up}} = (u_x, u_y, u_z)$ is the camera image-up unit
    vector with dimensionless components satisfying $u_x^2 + u_y^2 + u_z^2 = 1$.


    The up vector is established from the camera mounting geometry and refined by
    optical calibration or an in-vessel surveyed reference direction, then normalized
    before its components are used. The y component alone does not fix the camera
    pose; the complete image-up axis requires all three components, and the full orientation
    additionally requires the viewing direction.


    Values lie in the range $[-1, 1]$: near $+1$ the image-up direction is nearly
    aligned with $+\hat{y}$, near $-1$ with $-\hat{y}$, and near $0$ the up direction
    has little projection along $\hat{y}$.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:x_direction_unit_vector_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/up/y
    dd_path: camera_ir/channel/camera/up/y
    status: composed
- name: power_at_wall_due_to_conduction
  kind: scalar
  status: draft
  description: Conductive component of plasma power deposited on first-wall and divertor
    material surfaces. It represents heat carried by thermal conduction and excludes
    convected, radiated, recombination, and neutral-particle power channels.
  documentation: 'Power at wall due to conduction is the component of the wall-deposited
    plasma energy flux carried by thermal conduction, primarily electron heat conduction
    along magnetic field lines in the scrape-off-layer and divertor plasma. It is
    distinct from particle enthalpy convection, radiation, recombination energy, and
    neutral-particle energy deposition.


    The scalar power is defined by integrating the deposited conductive heat-flux
    density over the plasma-facing material surface:


    $$

    P_{\mathrm{wall,cond}} = \int_{A_{\mathrm{wall}}} q_{n,\mathrm{cond}}^{\mathrm{dep}}
    \, dA

    $$


    where $P_{\mathrm{wall,cond}}$ is the conducted wall power, $A_{\mathrm{wall}}$
    is the wetted first-wall and divertor material surface, $dA$ is a surface element
    in $\mathrm{m^2}$, and $q_{n,\mathrm{cond}}^{\mathrm{dep}}$ is the local conductive
    heat-flux density into the material in $\mathrm{W\,m^{-2}}$. The upstream parallel
    conductive heat flux is often modeled as $q_{\parallel,\mathrm{cond}} = -\kappa_\parallel
    \nabla_\parallel T_e$, where $q_{\parallel,\mathrm{cond}}$ is in $\mathrm{W\,m^{-2}}$,
    $\kappa_\parallel$ is in $\mathrm{W\,m^{-1}\,eV^{-1}}$ when $T_e$ is expressed
    in eV, and $\nabla_\parallel T_e$ is in $\mathrm{eV\,m^{-1}}$. Mapping this upstream
    flux to $q_{n,\mathrm{cond}}^{\mathrm{dep}}$ includes magnetic incidence on the
    surface and may include a sheath heat-transmission factor, so the deposited conductive
    power is not simply the bare upstream parallel flux integrated over geometric
    wall area.


    In practice this quantity is inferred from wall heat-flux measurements and edge-plasma
    modeling. Infrared thermography, calorimetry, embedded temperature sensors, Langmuir
    probes, and edge Thomson scattering can constrain the deposited heat flux, electron
    temperature gradients, and the partition between conductive and convective channels.
    Together with [power_at_wall_due_to_convection](name:power_at_wall_due_to_convection),
    this quantity forms the main kinetic thermal contribution to plasma_power_at_wall;
    it is also part of thermal_power_at_wall and the divertor-local thermal load described
    by [thermal_power_of_divertor](name:thermal_power_of_divertor).


    Typical magnitudes range from $10^5-10^7$ W in medium-size tokamak plasmas, can
    fall near zero in strongly detached or highly radiative conditions, and can reach
    $10^7-10^8$ W or more in high-power devices if a large fraction of scrape-off-layer
    power reaches material surfaces conductively.


    Sign convention: Positive when conductive thermal energy is deposited from the
    plasma into first-wall or divertor material surfaces.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_convection
  - name:thermal_power_of_divertor
  sources:
  - id: dd:wall/global_quantities/power_conducted
    dd_path: wall/global_quantities/power_conducted
    status: composed
- name: power_at_wall_due_to_convection
  kind: scalar
  status: draft
  description: Power deposited on plasma-facing wall and divertor surfaces by convective
    particle energy flux from the scrape-off layer, including particle enthalpy and
    directed kinetic energy carried into the material surface.
  documentation: 'Convective power at the wall is the surface-integrated rate at which
    plasma particles deposit energy on plasma-facing material surfaces by their motion
    into the surface. It includes thermal enthalpy and directed kinetic energy carried
    by particles from the scrape-off layer, and is distinct from conductive heat transport
    without net particle flow, represented by [power_at_wall_due_to_conduction](name:power_at_wall_due_to_conduction).


    The deposited convective power is defined as the integral of the incident normal
    convective heat-flux density over the plasma-facing surface:


    $$

    P_\mathrm{conv} = \int_S q_{\mathrm{conv},\perp} \, dA, \qquad q_{\mathrm{conv},\perp}=\mathbf{q}_\mathrm{conv}\cdot\hat{n}_m

    $$


    where $S$ is the union of wall and divertor surfaces exposed to the plasma, $\mathbf{q}_\mathrm{conv}$
    is the convective particle energy-flux vector, and $\hat{n}_m$ is the unit normal
    directed from the plasma into the material. With this convention $q_{\mathrm{conv},\perp}$
    is positive for power incident on the component, consistent with the local flux-density
    quantity heat_flux_of_plasma_facing_component. In sheath-limited estimates, $q_{\mathrm{conv},\perp}\approx
    \sum_s \gamma_s n_s T_s c_s$, where $n_s$ is the sheath-entrance number density
    in m$^{-3}$, $T_s$ is the species temperature in joules per particle, $c_s$ is
    the characteristic sound speed in m s$^{-1}$, and $\gamma_s$ is a dimensionless
    sheath heat-transmission factor; if $T_s$ is supplied in eV it must be multiplied
    by the elementary charge to give SI power density.


    In practice this quantity is obtained from edge-plasma transport or kinetic modeling
    with sheath boundary conditions, or inferred from integrated heat-load measurements
    combined with power-balance constraints. It contributes to the total thermal_power_at_wall,
    while [thermal_power_of_divertor](name:thermal_power_of_divertor) refers to the
    corresponding thermal power deposited on divertor surfaces only.


    Typical integrated values are strongly scenario dependent. In attached divertor
    conditions they are commonly of order 0.01-1 MW in low-power experiments, 0.1-10
    MW in medium and large tokamak plasmas, and can exceed 10 MW in high-power exhaust
    scenarios before strong detachment or radiative dissipation reduces the particle
    energy reaching material surfaces.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_conduction
  - name:thermal_power_of_divertor
  arguments:
  - name: power_due_to_convection
    operator: wall
    operator_kind: locus
  sources:
  - id: dd:wall/global_quantities/power_convected
    dd_path: wall/global_quantities/power_convected
    status: composed
- name: power_at_wall_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Total resistive Joule power converted to heat within conducting wall,
    plasma-facing, and vessel structures by induced, halo, or other plasma-wall currents.
  documentation: 'Power at the wall due to ohmic dissipation is the total rate at
    which electrical energy is converted into heat inside conducting wall, plasma-facing,
    and vessel structures by currents associated with plasma-wall interaction. It
    includes resistive dissipation from eddy currents induced by changing magnetic
    fields and from halo or shared currents that pass through conducting structures.


    The instantaneous Joule-heating power over the conducting material volume is


    $$

    P_\mathrm{ohm} = \int_V \eta(\mathbf{x},T)\, |\mathbf{j}(\mathbf{x})|^2 \, dV

    $$


    where $V$ is the conducting material volume, $\eta(\mathbf{x},T)$ is the electrical
    resistivity at position $\mathbf{x}$ and material temperature $T$ in $\Omega\,\mathrm{m}$,
    $\mathbf{j}$ is the local current density in $\mathrm{A}\,\mathrm{m}^{-2}$, and
    $dV$ is a differential volume element in $\mathrm{m}^3$. For passive resistive
    materials, $\eta \ge 0$ and $|\mathbf{j}|^2 \ge 0$, so the integral is non-negative
    and represents heat production rather than a signed electromagnetic power flow.


    This quantity is computed from electromagnetic circuit or field models of the
    conducting structures, often constrained by magnetic sensors, wall-current measurements,
    halo-current measurements, and material resistivity data. Thermal analysis or
    calorimetry can provide an independent constraint when other heat sources, such
    as particle impact, radiation, and recombination, are separated. The related [energy
    flux at wall due to eddy current](name:energy_flux_at_wall_due_to_eddy_current)
    describes a local surface heat flux from eddy-current dissipation only; this quantity
    is a volume-integrated power and may also include halo-current dissipation.


    Typical values are about 10^3-10^6 W during routine operation with slowly varying
    fields, and about 10^6-10^9 W during disruptions, vertical displacement events,
    or rapid current quenches in large devices. The magnitude depends on plasma current,
    magnetic-field ramp rate, wall geometry, material resistivity, and the electrical
    circuit paths that connect the plasma to surrounding conducting structures.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:plasma_power_at_wall
  arguments:
  - name: power_due_to_ohmic_dissipation
    operator: wall
    operator_kind: locus
  sources:
  - id: dd:wall/global_quantities/power_currents
    dd_path: wall/global_quantities/power_currents
    status: composed
- name: power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on plasma-facing wall surfaces by all recombination
    processes, encompassing both plasma-ion recombination and surface recombination
    of incident neutral particles into molecules.
  documentation: 'The total recombination power at the wall aggregates two distinct
    heat-load channels: the plasma-ion channel, in which ions arriving at the surface
    capture free electrons and release their recombination energy into the wall material,
    and the neutral surface-recombination channel, in which incident hydrogen-isotope
    atoms combine into diatomic molecules on the material surface and deposit the
    molecular binding energy as heat.


    This quantity is the wall-surface component of the broader [power due to recombination](name:power_due_to_recombination),
    which encompasses volumetric recombination throughout the plasma volume. The two
    contributing channels are resolved separately: [plasma_power_at_wall_due_to_recombination](name:plasma_power_at_wall_due_to_recombination)
    carries the ion-channel contribution and [neutral_power_at_wall_due_to_recombination](name:neutral_power_at_wall_due_to_recombination)
    carries the neutral surface-recombination contribution, their sum giving:


    $$

    P_{\mathrm{rec,wall}} = P_{\mathrm{rec,wall}}^{\mathrm{ion}} + P_{\mathrm{rec,wall}}^{\mathrm{neutral}}

    $$


    where $P_{\mathrm{rec,wall}}^{\mathrm{ion}}$ is the integrated plasma-ion recombination
    power and $P_{\mathrm{rec,wall}}^{\mathrm{neutral}}$ is the neutral surface-recombination
    power, both summed over all plasma-facing surfaces.


    In edge plasma models, this quantity is evaluated from particle-balance calculations
    coupled to surface-interaction models, with each channel weighted by the recombination
    energy per event and the incident particle flux to the wall.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  - name:neutral_power_at_wall_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: wall
    operator_kind: locus
- name: neutral_power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Power deposited on the plasma-facing wall by surface recombination
    of incident neutral particles, predominantly hydrogen-isotope atoms that combine
    into diatomic molecules and release their binding energy as heat in the wall material.
    It is distinct from the recombination power associated with incident plasma ions.
  documentation: 'Neutral recombination power at the wall is the rate at which binding
    energy released by surface recombination of incident neutral particles is converted
    into heat in plasma-facing wall material. For hydrogenic plasmas the dominant
    channel is associative formation of H2, D2, T2, or mixed-isotope molecules from
    two adsorbed atoms, releasing the molecular formation enthalpy into the solid.
    This is the neutral-origin component of the total recombination wall power and
    is separate from the recombination heat carried by incident plasma ions.


    The deposited power is obtained by integrating the local heat release over the
    plasma-facing surface:


    $$

    P_{\mathrm{rec},n} = \int_{A_{\mathrm{wall}}} \Gamma_{n}(\mathbf{x})\, E_{\mathrm{rec}}(\mathbf{x})\,
    dA

    $$


    where $\Gamma_{n}$ is the local flux of incident neutral particles participating
    in surface recombination, in m^-2 s^-1, and $E_{\mathrm{rec}}$ is the effective
    heat deposited in the wall per participating particle, in J. If the molecular
    formation enthalpy $\Delta H_{\mathrm{mol}}$ is quoted per molecule, about 4.5
    eV for one hydrogen-isotope molecule formed from two atoms, then the heat deposited
    per incident atom is approximately $\eta_{\mathrm{heat}}\,\Delta H_{\mathrm{mol}}/2$,
    where $\eta_{\mathrm{heat}}$ is the fraction of released energy retained in the
    solid rather than carried away by desorbed molecules.


    In practice this quantity is estimated from modeled neutral fluxes to plasma-facing
    surfaces, surface recombination probabilities, and the effective accommodation
    of the released binding energy. It can be constrained by wall calorimetry, particle-balance
    analysis, spectroscopy, and neutral-transport modeling. The effective heat fraction
    depends on surface material, temperature, isotope, adsorbate coverage, and roughness.


    Typical integrated values span roughly 10^2-10^5 W for main-chamber wall recycling
    in medium-sized devices, with larger values possible under high-recycling conditions
    and large neutral fluxes. This contribution is generally smaller than the total
    neutral power deposited on the wall but is relevant to detailed plasma-wall interaction
    power balances.


    Sign convention: Positive when energy is deposited into the wall.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_recombination
  - name:plasma_power_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  arguments:
  - name: power_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/global_quantities/power_neutrals
    dd_path: wall/global_quantities/power_neutrals
    status: composed
  - id: dd:wall/global_quantities/power_recombination_neutrals
    dd_path: wall/global_quantities/power_recombination_neutrals
    status: composed
- name: plasma_power_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Total power deposited on plasma-facing wall surfaces by recombination
    of plasma ions, constituting the ion-channel contribution to the overall recombination
    wall heat load integrated over all plasma-facing surfaces.
  documentation: 'When plasma ions arrive at a plasma-facing wall surface, they undergo
    surface recombination, releasing energy equal to their ionization potential plus
    any residual kinetic energy carried to the surface. This quantity integrates that
    energy deposition rate over all plasma-facing wall surfaces and represents the
    plasma-ion species channel within the parent quantity [power_at_wall_due_to_recombination](name:power_at_wall_due_to_recombination),
    which also includes neutral-particle contributions.


    The deposited power is related to the local incident ion flux density by:


    $$

    P_\mathrm{rec} = \int_A \Gamma_\mathrm{ion}(\mathbf{r}) \, E_\mathrm{rec} \, dA

    $$


    where $\Gamma_\mathrm{ion}$ is the local ion particle flux density at the surface
    in m$^{-2}$ s$^{-1}$, $E_\mathrm{rec}$ is the mean energy released per recombination
    event (sum of ionization potential and residual kinetic energy, in J), and the
    integral extends over the total wetted plasma-facing area $A$.


    This quantity excludes energy deposited by recombination of neutral particles
    into molecules at the surface, which is captured separately by [neutral_power_at_wall_due_to_recombination](name:neutral_power_at_wall_due_to_recombination).
    The analogous quantity resolved at divertor strike surfaces is [plasma_power_at_divertor_target_due_to_recombination](name:plasma_power_at_divertor_target_due_to_recombination).
    It is estimated from edge plasma transport models constrained by incident ion-flux
    and particle-balance measurements at the boundary.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_recombination
  - name:neutral_power_at_wall_due_to_recombination
  - name:plasma_power_at_divertor_target_due_to_recombination
  arguments:
  - name: power_at_wall_due_to_recombination
    operator: plasma
    operator_kind: qualifier
  sources:
  - id: dd:wall/global_quantities/power_recombination_plasma
    dd_path: wall/global_quantities/power_recombination_plasma
    status: composed
- name: ratio_of_beryllium_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of total beryllium ion number density to electron
    number density. It measures beryllium impurity abundance relative to the plasma
    electron population, with the beryllium ion density summed over charged ionization
    states.
  documentation: 'The ratio of beryllium density to electron density is a dimensionless
    impurity abundance measuring how much beryllium ion population is present relative
    to the free electron population. The beryllium numerator is the total beryllium
    ion number density, summed over charged ionization states, and does not by itself
    weight the ions by charge.


    The defining relation is:


    $$

    f_\mathrm{Be} = \frac{n_\mathrm{Be}}{n_e} = \frac{\sum_{q=1}^{4} n_{\mathrm{Be}^{q+}}}{n_e}

    $$


    where $n_\mathrm{Be}$ is the total beryllium ion number density, $n_{\mathrm{Be}^{q+}}$
    is the number density of beryllium ions in charge state $q$, and $n_e$ is the
    electron number density; all densities in the ratio have units of m$^{-3}$. In
    a quasi-neutral plasma, the charge-weighted impurity contribution enters the electron
    balance through terms of the form $q n_{\mathrm{Be}^{q+}}$, so this ratio is closely
    related to fuel dilution but is not itself the charge fraction.


    Beryllium impurities are commonly produced by plasma-wall interaction processes
    such as sputtering of beryllium-containing plasma-facing components, followed
    by transport and ionization in the edge and confined plasma. The ratio is inferred
    by combining beryllium spectroscopic measurements and collisional-radiative modeling
    with electron density measurements from diagnostics such as interferometry and
    Thomson scattering. Related beryllium density quantities include [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis),
    [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    and [beryllium_density_at_limiter](name:beryllium_density_at_limiter).


    Typical values in well-conditioned plasmas with beryllium plasma-facing surfaces
    are about $10^{-4}$-$10^{-2}$, with many H-mode conditions lying near $10^{-3}$-$5
    \times 10^{-3}$. Values can rise to several percent during strong wall source
    events, early conditioning phases, or after disruptions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_plasma_boundary
  arguments:
  - name: beryllium_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/beryllium/value
    dd_path: summary/composition/beryllium/value
    status: composed
- name: ratio_of_carbon_density_to_electron_density
  kind: scalar
  status: draft
  description: Ratio of total carbon number density, summed over neutral carbon and
    all carbon charge states, to electron number density.
  documentation: 'The ratio of carbon density to electron density is a dimensionless
    impurity fraction expressing the abundance of carbon relative to the electron
    population. The carbon density is the total number density of carbon nuclei, including
    neutral carbon atoms and all ionized charge states from singly ionized to fully
    stripped carbon.


    The ratio is defined by normalizing the summed carbon density to the electron
    density:


    $$

    f_C = \frac{n_C}{n_e}, \qquad n_C = \sum_{q=0}^{6} n_{\mathrm{C},q}

    $$


    where $f_C$ is the carbon fraction, $n_e$ is the electron number density in m$^{-3}$,
    $n_C$ is the total carbon number density in m$^{-3}$, $n_{\mathrm{C},0}$ is neutral
    atomic carbon, and $n_{\mathrm{C},q}$ for $q=1,\ldots,6$ are carbon ions with
    charge state $q+$.


    In practice, $n_C$ may be inferred from spectroscopic measurements, charge-exchange
    recombination spectroscopy, edge and divertor line emission, or collisional-radiative
    modeling, often combined with an independently measured or reconstructed $n_e$.
    The numerator may correspond conceptually to a [volume-averaged carbon density](name:volume_averaged_carbon_density),
    a [line-averaged carbon density](name:line_averaged_carbon_density), or another
    physically specified carbon density measure, but the defining ratio is always
    formed with the corresponding electron density. Because neutral carbon contributes
    to $n_C$ but not directly to quasineutrality or $Z_\mathrm{eff}$, the ionization-state
    distribution matters when relating this fraction to charge-weighted impurity effects.
    In an otherwise deuterium plasma with fully stripped carbon, quasineutrality gives
    $Z_\mathrm{eff}=1+30 f_C$; partial ionization gives a smaller charge-weighted
    contribution for the same total carbon density.


    Typical core or volume-averaged carbon fractions are about $10^{-4}$-$10^{-2}$
    in low-carbon wall conditions and about $10^{-2}$-$5\times10^{-2}$ in carbon-wall
    or strong erosion conditions. Larger local values can occur near plasma-facing
    carbon sources, in the scrape-off layer, or in detached divertor regions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_volume_averaged_krypton_number_density_to_maximum_electron_number_density
  arguments:
  - name: carbon_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/carbon/value
    dd_path: summary/composition/carbon/value
    status: composed
- name: ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
  kind: scalar
  status: draft
  description: Dimensionless global boron impurity fraction equal to the volume-averaged
    total boron number density divided by the volume-averaged electron number density.
  documentation: 'This quantity is a global measure of boron content in a plasma,
    expressed as the ratio of the volume-averaged total boron number density to the
    volume-averaged electron number density. The boron density includes boron nuclei
    in all ionization states represented in the plasma composition, so the ratio measures
    elemental boron abundance relative to electrons rather than a single charge state.


    For a plasma volume $V$, the ratio is defined by


    $$

    f_B = \frac{\langle n_B \rangle_V}{\langle n_e \rangle_V}, \qquad \langle n \rangle_V
    = \frac{1}{V}\int_V n(\mathbf{x})\,dV

    $$


    where $n_B$ is the total boron number density, $n_e$ is the electron number density,
    and both averaged densities have units of m$^{-3}$. The ratio $f_B$ is dimensionless.


    The value is commonly inferred from plasma composition analysis by combining measurements
    or modeling of impurity content with the electron density distribution used to
    form the same volume average. It is useful for comparing the global level of boron
    introduced by wall conditioning, erosion, or impurity transport independently
    of the absolute plasma density.


    Typical values are non-negative and usually much smaller than unity when boron
    is a trace impurity. Values approaching unity would indicate that boron makes
    a major contribution to the plasma particle inventory and charge balance rather
    than acting as a minor impurity.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:ratio_of_volume_averaged_oxygen_ion_density_to_volume_averaged_electron_density
  - name:volume_averaged_boron_density
  arguments:
