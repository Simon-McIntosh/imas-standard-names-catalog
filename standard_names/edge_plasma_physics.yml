- name: radial_neutral_momentum_diffusion_coefficient
  kind: scalar
  status: draft
  description: Radial component of the momentum diffusion coefficient for neutral
    particles in the edge plasma, describing diffusive transport of neutral momentum
    in the radial direction relative to the magnetic axis.
  documentation: 'The radial neutral momentum diffusion coefficient characterizes
    the diffusive transport of neutral particle momentum along the radial coordinate
    $r$ (or $\rho$, the normalized toroidal flux radius) in the edge plasma region.
    It quantifies how gradients in neutral momentum lead to a radial flux of momentum.
    Typical values range from $10^{-2}$ to $10^1$ m$^2$ s$^{-1}$ depending on plasma
    density, neutral pressure, and collisionality. This coefficient is a key input
    for fluid neutral models and is often derived from kinetic calculations or empirical
    fits. In the IMAS edge transport model, this radial component is one scalar per
    element of the grid subset, distinct from perpendicular components described in
    `toroidal_neutral_momentum_diffusion_coefficient` and `poloidal_neutral_momentum_diffusion_coefficient`.


    Sign convention: Positive when momentum diffuses from regions of higher to lower
    radial neutral momentum density in the direction of increasing $r$.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
