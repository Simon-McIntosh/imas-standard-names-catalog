name: radial_component_of_electron_energy_flux
status: draft
description: Radial projection of the electron energy flux density, quantifying the
  net cross-field electron energy transport per unit area.
documentation: "The radial electron energy flux $Q_{e,r}$ (in W m$^{-2}$) is the radial\
  \ component of the electron energy flux vector, encompassing both conductive and\
  \ convective transport: $Q_{e,r} = -\\kappa_{e,\\perp} \\nabla_r T_e + \\frac{5}{2}\
  \ T_e \\Gamma_{e,r}$, where $\\kappa_{e,\\perp}$ is the perpendicular electron thermal\
  \ conductivity, $T_e$ is the electron temperature, and $\\Gamma_{e,r}$ is the radial\
  \ electron particle flux (m$^{-2}$ s$^{-1}$). This quantity is a primary diagnostic\
  \ of cross-field transport and is essential for determining energy confinement and\
  \ divertor heat loading. Edge transport codes compute $Q_{e,r}$ on generalized grids;\
  \ values in the pedestal region of H-mode plasmas are typically $10^{4}$\u2013$10^{6}$\
  \ W m$^{-2}$. Experimentally, radial energy fluxes can be inferred from power balance\
  \ analysis using Thomson scattering and bolometry data. See `radial_component_of_electron_particle_flux`\
  \ for the particle-flux analog and `electron_energy_radial_diffusivity` for the\
  \ associated diffusive coefficient."
validity_domain: ''
