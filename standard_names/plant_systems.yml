      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Electrical power consumed by a specific system in the balance-of-plant
        electric plant operation. Represents the instantaneous power draw of the named
        system as part of the overall plant power balance accounting.
      kind: llm
- name: net_power_of_plant_system
  kind: scalar
  status: active
  description: Net real electrical power of a plant system, defined as generation
    minus internal electrical consumption at the same system boundary; positive values
    denote net export.
  documentation: 'Net power of a plant system is the real electrical power balance
    of one plant system, with generation counted positively and internal consumption
    counted negatively. It is the generated-minus-consumed counterpart to the load-oriented
    [power of a plant system](name:power_of_plant_system), rather than thermal, apparent,
    reactive, or accumulated energy.


    For a consistently defined system boundary, the net power is defined as


    $$

    P_\mathrm{net} = P_\mathrm{generated} - P_\mathrm{consumed} = -P_\mathrm{system}

    $$


    where $P_\mathrm{net}$ is this plant-system quantity, $P_\mathrm{generated}$ is
    real electrical power generated within the boundary, $P_\mathrm{consumed}$ is
    real electrical power consumed within the boundary, and $P_\mathrm{system}$ is
    [power of a plant system](name:power_of_plant_system) using the load-positive
    convention. Internal transfers between included subsystems cancel. The quantity
    is the negative of [net absorbed power of a plant system](name:net_absorbed_power_of_plant_system)
    when both use the same boundary and scope; positive values denote net electrical
    export from the system boundary.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_system
  - name:net_absorbed_power_of_plant_system
  arguments:
  - name: power_of_plant_system
    operator: net
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_electricity_net
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_electricity_net
    dd_documentation:
      leaf: Net electric power
      data_type: FLT_1D
      unit: W
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Net electric power output (P_net) of the fusion power plant, equal
        to gross generated electricity minus plant operational power consumption.
        A primary figure of merit for power plant engineering performance.
      kind: llm
  - dd_path: balance_of_plant/power_plant/power_electric_generated
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-power_electric_generated
    dd_documentation:
