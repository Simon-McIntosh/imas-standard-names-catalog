name: plasma_filament_current
status: draft
description: Toroidal current flowing in a discrete plasma filament element used to
  represent the distributed plasma current in circuit models.
documentation: In plasma-circuit modeling, the distributed toroidal plasma current
  is discretized into a set of filamentary current elements, each carrying a current
  $I_{\mathrm{fil}}$ in amperes. The filament representation enables fast computation
  of the mutual inductance between the plasma and external conductors (poloidal field
  coils, passive structures) via the Neumann formula $M_{ij} = (\mu_0 / 4\pi) \oint
  \oint d\mathbf{l}_i \cdot d\mathbf{l}_j / |\mathbf{r}_i - \mathbf{r}_j|$, where
  $\mu_0 = 4\pi \times 10^{-7}$ H/m is the vacuum permeability. Typical filament counts
  range from tens (for real-time vertical-stability controllers) to thousands (in
  detailed free-boundary equilibrium solvers such as CEDRES++ or CREATE-L). Individual
  filament currents span from a few kA to hundreds of kA depending on the discretization;
  the sum over all filaments recovers the total plasma current $I_p = \sum_k I_{\mathrm{fil},k}$.
  See `plasma_current` for the total integrated toroidal current and `major_radius_of_current_center`
  for the current-weighted radial position.
