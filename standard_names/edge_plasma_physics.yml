      kind: template
- name: total_ion_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of all ions at the H-mode pedestal top is the ion particle
    count per volume at the core-side shoulder of the H-mode edge transport barrier.
    It is summed over all ion species and positive charge states in the confined plasma.
  documentation: 'Number density of all ions at the H-mode pedestal top is the ion
    particle count per volume at the core-side shoulder of the H-mode edge transport
    barrier. It includes every positive ion species present at that locus; for each
    species, the contribution is summed over all positive charge states.


    The species and charge-state aggregation is defined by:


    $$

    n_{i,\mathrm{tot}} = \sum_s \sum_{Z>0} n_{s,Z}

    $$


    where $n_{i,\mathrm{tot}}$ denotes this quantity, $s$ indexes ion species, $Z$
    is the ion charge number, and $n_{s,Z}$ is the number density of ions of species
    $s$ in charge state $Z$.


    The pedestal top is in the confined plasma at the core-side shoulder of the edge
    transport barrier, not at the separatrix, plasma boundary, or scrape-off layer.
    This quantity is the aggregate over ion populations at that locus, not any one
    population''s [ion density at pedestal top](name:ion_density_at_pedestal_top).


    Species-specific pedestal-top densities such as [hydrogen density at pedestal
    top](name:hydrogen_density_at_pedestal_top), [deuterium density at pedestal top](name:deuterium_density_at_pedestal_top),
    [carbon density at pedestal top](name:carbon_density_at_pedestal_top), and [nitrogen
    density at pedestal top](name:nitrogen_density_at_pedestal_top) are charge-state-summed
    contributions to this total. Electrons and neutral particles are excluded.


    This is an unweighted ion particle density, not an ion charge density and not
    the [electron density at pedestal top](name:electron_density_at_pedestal_top).
    For a quasineutral plasma, $n_e = \sum_s \sum_{Z>0} Z n_{s,Z}$, where $n_e$ is
    the electron density at the pedestal top; this quantity equals $n_e$ only when
    every contributing ion is singly charged.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:ion_density_at_pedestal_top
  arguments:
  - name: ion_density_at_pedestal_top
    operator: total
    operator_kind: qualifier
- name: total_ion_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Total ion number density at the plasma boundary is the local particle
    count per volume, summing all charged ion species and charge states while excluding
    neutrals.
  documentation: 'Total ion density at the plasma boundary is the local number density
    of all positively charged ion populations at the separatrix, the last closed flux
    surface separating confined plasma from the open-field-line scrape-off layer.
    It is the charge-state-summed specialization of [ion density at the plasma boundary](name:ion_density_at_plasma_boundary).


    The total ion density is defined by


    $$

    n_i^{\mathrm{tot}} = \sum_s \sum_{Z\geq 1} n_{s,Z}

    $$


    where $n_{s,Z}$ is the number density of ion species $s$ in charge state $Z$,
    and the sums include every charged ion species and charge state present at the
    boundary.


    Neutral particles are excluded, and each ion contributes one particle regardless
    of its charge. The corresponding surface average is [flux-surface-averaged total
    ion density at the plasma boundary](name:flux_surface_averaged_total_ion_density_at_plasma_boundary),
    which averages this local quantity over the separatrix.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:ion_density_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density_at_plasma_boundary
  arguments:
  - name: ion_density_at_plasma_boundary
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/separatrix/n_i_total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-n_i_total-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix/n_i_total
      parent: Total ion density (sum over species)
      data_type: FLT_1D
      unit: m^-3
