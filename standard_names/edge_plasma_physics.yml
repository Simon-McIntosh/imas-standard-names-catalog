- name: parallel_total_ion_energy_convection_velocity
  kind: scalar
  status: active
  description: Effective field-aligned convection velocity multiplying convective
    transport of total ion energy, with the energy summed over all ion species.
  documentation: 'This quantity is the effective velocity associated with the convective
    part of the total ion-energy transport along magnetic field lines. It is a transport
    coefficient, not necessarily the bulk-flow velocity of any individual ion species.


    The convective parallel energy flux is defined by


    $$

    F_{i,\parallel}^{\mathrm{conv}} = v_{i,\parallel}^{E} E_{i,\mathrm{tot}}

    $$


    where $F_{i,\parallel}^{\mathrm{conv}}$ is the parallel convective ion-energy
    flux (W m$^{-2}$), $E_{i,\mathrm{tot}}$ is the total ion-energy density (J m$^{-3}$)
    summed over ion species, and $v_{i,\parallel}^{E}$ is this effective convection
    velocity. The quantity excludes nonconvective conductive, diffusive, and source
    terms. It is the field-aligned counterpart of [radial ion energy convection velocity](name:radial_ion_energy_convection_velocity)
    and is distinct from [parallel ion heat convection velocity](name:parallel_ion_heat_convection_velocity),
    which refers specifically to bulk ion thermal-energy advection.


    Sign convention: Positive when the effective velocity points along the magnetic-field
    vector, with the magnetic field represented in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_ion_energy_convection_velocity
  - name:parallel_ion_heat_convection_velocity
  sources:
