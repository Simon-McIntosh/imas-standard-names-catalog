      kind: template
- name: flux_surface_averaged_magnetic_field_magnitude
  kind: vector
  status: active
  description: Flux-surface average of the local magnetic-field strength, retaining
    the pointwise modulus before averaging over each magnetic surface.
  documentation: 'This quantity is the flux-surface average of the magnitude of the
    total equilibrium magnetic-field vector. It represents the mean field strength
    on a magnetic surface, rather than a component or a vector average.


    The flux-surface average is defined by


    $$

    \left\langle \lvert\mathbf{B}\rvert \right\rangle_{\psi} = \frac{\oint_{\psi}
    \lvert\mathbf{B}\rvert\,\mathrm{d}S/\lvert\nabla\psi\rvert}{\oint_{\psi} \mathrm{d}S/\lvert\nabla\psi\rvert}

    $$


    where $\mathbf{B}$ is the total equilibrium magnetic-field vector, $\psi$ is the
    scalar label of the magnetic flux surface, $\mathrm{d}S$ is the surface-area element,
    and $\nabla\psi$ is the spatial gradient of that surface label. The aggregation
    is the normalized surface integral with weighting $\mathrm{d}S/\lvert\nabla\psi\rvert$.


    The quantity applies to all components of the equilibrium field on the selected
    magnetic flux surface and is non-negative. It excludes any signed field component,
    any species or source decomposition, and the magnitude of a vector obtained by
    averaging $\mathbf{B}$ before taking its modulus.


    It is the flux-surface-averaged transformation of [magnetic-field magnitude].
    It differs from [flux-surface-averaged square of magnetic-field magnitude](name:flux_surface_averaged_square_of_magnetic_field_magnitude),
    which averages the squared field strength rather than the field strength itself.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_square_of_magnetic_field_magnitude
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/b_field_average
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-b_field_average
