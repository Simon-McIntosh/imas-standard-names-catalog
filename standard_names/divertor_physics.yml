- name: vertical_length_of_divertor_target
  kind: scalar
  status: active
  description: "Non-negative vertical span of a divertor target surface, defined by\
    \ the difference between its maximum and minimum Z coordinates in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical extent of a divertor target is the range of vertical
    positions occupied by its surface, rather than the vertical position of its center.


    $$

    H_Z = Z_{\\max} - Z_{\\min}

    $$


    where $H_Z$ is the vertical span, and $Z_{\\max}$ and $Z_{\\min}$ are respectively
    the maximum and minimum vertical coordinates over the target surface in the right-handed
    cylindrical $(R, \\phi, Z)$ frame. Here, $R$ is major radius, $\\phi$ is toroidal
    angle, and $Z$ is vertical height. This extent complements the [radial length
    of the divertor target](name:radial_length_of_divertor_target) and is distinct
    from the [Z coordinate of the divertor target](name:z_coordinate_of_divertor_target),
    which locates its surface center.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:radial_length_of_divertor_target
  - name:z_coordinate_of_divertor_target
  sources:
  - dd_path: divertors/divertor/target/extension_z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-extension_z
    dd_documentation:
      leaf: Target length projected on the height axis
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Projected length of the divertor target along the vertical (Z)
        axis, characterizing the vertical extent of the target geometry. Used in divertor
        geometry description and power exhaust modelling.
      kind: llm
- name: vertical_outline_of_divertor_tile
  kind: scalar
  status: active
  description: Vertical (Z) coordinate of the surface outline defining the geometric
    boundary of an individual divertor tile in the poloidal cross-section.
  documentation: 'The vertical height component of each point defining the surface
    outline of a divertor tile within the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is the major radius from the toroidal symmetry axis and $Z$ is
    the vertical coordinate measured from the machine midplane. Paired with the corresponding
    radial outline coordinate, this quantity fully specifies the cross-sectional geometry
    of the tile surface in any toroidally axisymmetric representation, enabling computation
    of wetted surface area, heat-load distribution, and geometric shadowing between
    adjacent plasma-facing components.


    Divertor tile outlines are obtained from engineering or CAD specifications of
    the first-wall assembly. The geometric boundary of the tile determines which surface
    elements intercept the scrape-off-layer heat flux in the vicinity of the magnetic
    strike-point. The outline is also used in optical and infrared camera line-of-sight
    calculations to monitor tile erosion and thermal response. For the analogous geometry
    of limiter tiles, see [vertical_outline_of_limiter_tile](name:vertical_outline_of_limiter_tile);
    for the vacuum vessel boundary, see [vertical_outline_of_vacuum_vessel](name:vertical_outline_of_vacuum_vessel).
    The center-point location of the divertor target surface is given by [vertical_coordinate_of_divertor_target](name:z_coordinate_of_divertor_target),
    which captures a single reference point rather than a full outline contour.


    Sign convention: Positive when the outline point is located above the machine
    midplane, in the direction of increasing $Z$.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_outline_of_limiter_tile
  - name:vertical_outline_of_vacuum_vessel
  - name:z_coordinate_of_divertor_target
  sources:
  - dd_path: divertors/divertor/target/tile/surface_outline/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-tile-surface_outline-z
    dd_documentation:
      leaf: Height
      parent_path: divertors/divertor/target/tile/surface_outline
      parent: Outline of the tile surface facing the plasma
      data_type: FLT_1D
      unit: m
      coordinates:
      - divertors/divertor/target/tile/surface_outline/r
    enhanced_context:
      description: Vertical (Z) coordinate of surface outline.
      kind: template
- name: wetted_area_of_divertor_target
  kind: scalar
  status: active
  description: Area of one divertor target receiving deposited heat flux at or above
    one e-folding below its peak, including flux expansion and spreading.
  documentation: 'The wetted area is the portion of one divertor target surface that
    receives deposited heat flux at least equal to the peak target heat flux divided
    by $e$. It characterizes the heat-load footprint produced by mapping the scrape-off-layer
    heat-flux decay length to the target surface.


    $$

    A_w = \int_{A_t} H\!\left(q_t(\mathbf{s}) - \frac{q_{t,\max}}{e}\right)\,\mathrm{d}A

    $$


    where $A_t$ is the plasma-facing area of the target, $q_t(\mathbf{s})$ is the
    deposited heat-flux density at target position $\mathbf{s}$, $q_{t,\max}$ is its
    maximum value on that target, $H$ is the Heaviside step function, and $\mathrm{d}A$
    is the surface-area element. The mapped footprint includes flux expansion and
    the spreading factor associated with the scrape-off-layer decay length.


    This is a per-target footprint area, distinct from the geometric area of a [divertor
    tile](name:surface_area_of_divertor_tile). The total over all targets is [wetted
    area of the divertor](name:wetted_area_of_divertor).'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:surface_area_of_divertor_tile
  sources:
  - dd_path: divertors/divertor/target/wetted_area
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-wetted_area
    dd_documentation:
      leaf: Wetted area of the target, defined by the SOL heat flux decay length (lambda_q)
        mapped to the target using flux expansion and spreading factor and the target
        toroidal circumference. In other words, this is the area getting heat flux
        from the maximum value down to one e-fold decay.
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: m^2
    enhanced_context:
      description: "Wetted area of the divertor target, defined by mapping the SOL\
        \ heat flux decay length (\u03BB_q) to the target plate using flux expansion\
        \ and spreading factor. Represents the region receiving heat flux down to\
        \ one e-folding decay from peak."
      kind: llm
- name: xenon_density_at_divertor_target
  kind: scalar
  status: active
  description: Number density of the xenon species at the divertor target is the local
    particle count per volume for xenon ions at the sheath entrance immediately upstream
    of the target-facing plasma boundary.
  documentation: 'Number density of the xenon species at the divertor target is the
    local particle count per volume for xenon ions at the sheath entrance immediately
    upstream of the target-facing plasma boundary. It is the xenon-specific member
    of [density_at_divertor_target](name:density_at_divertor_target).


    The local xenon ion number density is defined by the differential particle count:


    $$

    n_{\mathrm{Xe}} = \frac{dN_{\mathrm{Xe}}}{dV}

    $$


    where $n_{\mathrm{Xe}}$ is the xenon ion number density, $N_{\mathrm{Xe}}$ is
    the number of included xenon ions, and $V$ is a local plasma volume whose center
    approaches the sheath entrance from the plasma side.


    This quantity applies to the xenon-ion population immediately adjacent to one
    divertor target and is summed over all positive xenon ionization states, from
    singly ionized through fully stripped xenon. Neutral xenon atoms are excluded;
    this is a local sheath-entrance density, not a volume-averaged density or a density
    at a general plasma location.


    Compared with [xenon_density](name:xenon_density), which denotes xenon ion density
    at a general plasma point, this quantity is specialized to the divertor-target
    sheath entrance. Its charge-state-summed species convention parallels [oxygen_density_at_divertor_target](name:oxygen_density_at_divertor_target),
    with xenon replacing oxygen.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:oxygen_density_at_divertor_target
  sources:
  - dd_path: summary/local/divertor_target/n_i/xenon/value
