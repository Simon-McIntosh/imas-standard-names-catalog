name: toroidal_component_of_inertial_current_density
status: draft
description: Toroidal ($\hat{\phi}$) projection of the inertial current density driven
  by time-varying plasma momentum.
documentation: "The toroidal inertial current density $j_{\\mathrm{inert},\\phi} =\
  \ \\mathbf{j}_{\\mathrm{inert}} \\cdot \\hat{\\phi}$ is the toroidal component of\
  \ $\\mathbf{j}_{\\mathrm{inert}} = \\rho \\, d\\mathbf{v}/dt$, where $\\rho$ is\
  \ the mass density (kg\xB7m$^{-3}$) and $d\\mathbf{v}/dt$ is the convective derivative\
  \ of the fluid velocity (m\xB7s$^{-2}$). This term becomes significant during rapid\
  \ transients\u2014disruptions, ELMs, and sawtooth crashes\u2014when inertial effects\
  \ can transiently modify the current profile. In steady-state scenarios the inertial\
  \ contribution is negligible compared to Ohmic, bootstrap, and beam-driven current\
  \ densities, but during a thermal quench it may reach $10^4$\u2013$10^5$ A\xB7m$^{-2}$\
  \ in the edge region. Positive when $j_{\\mathrm{inert},\\phi}$ is in the $+\\phi$\
  \ direction under the chosen COCOS convention. Evaluated from time-dependent MHD\
  \ or multi-fluid edge transport simulations."
validity_domain: ''
