name: electron_pressure_pedestal_width
status: draft
cocos_transformation_type: one_like
description: Width in normalized poloidal flux $\psi_N$ of the steep-gradient region
  in the electron pressure pedestal.
documentation: "The electron pressure pedestal width $\\Delta_{p_e}$ measures the\
  \ extent in normalized poloidal flux $\\psi_N$ over which the electron pressure\
  \ transitions from the pedestal top to the scrape-off layer value. It is determined\
  \ by fitting the $p_e(\\psi_N)$ profile with a modified hyperbolic tangent (mtanh)\
  \ or linear model using Thomson scattering and interferometry data. Typical values\
  \ in conventional H-mode tokamaks range from $\\Delta_{p_e} \\approx 0.02$ to $0.08$\
  \ in $\\psi_N$; narrower pedestals are generally associated with higher normalized\
  \ pressure gradient $\\alpha_{\\rm MHD}$ and proximity to the peeling\u2013ballooning\
  \ stability boundary. The pedestal width is a key input for the EPED predictive\
  \ pedestal model and inter-ELM stability assessments. See also `electron_pressure_pedestal_position`,\
  \ `electron_temperature_pedestal_width`."
