- name: radial_pfirsch_schlueter_current_density
  kind: scalar
  status: draft
  description: "Major-radius component of the Pfirsch-Schl\xFCter neoclassical current\
    \ density in a right-handed cylindrical (R, phi, Z) frame. It is the return-current\
    \ contribution produced by toroidal geometry to maintain current continuity in\
    \ the presence of pressure-gradient-driven diamagnetic current."
  documentation: "Radial Pfirsch-Schl\xFCter current density is the major-radius component\
    \ of the local Pfirsch-Schl\xFCter neoclassical current density in a toroidal\
    \ plasma. The Pfirsch-Schl\xFCter current is the return-current contribution associated\
    \ with toroidal magnetic geometry and pressure-gradient-driven diamagnetic current,\
    \ arranged so that the total current remains continuous.\n\nThe component is defined\
    \ by projecting the Pfirsch-Schl\xFCter current density vector onto the radial\
    \ basis vector of the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$\
    \ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height:\n\n\
    $$\nJ_{R,\\mathrm{PS}} = \\mathbf{J}_{\\mathrm{PS}} \\cdot \\hat{R}\n$$\n\nwhere\
    \ $J_{R,\\mathrm{PS}}$ is in A.m^-2, $\\mathbf{J}_{\\mathrm{PS}}$ is the Pfirsch-Schl\xFC\
    ter current density vector, and $\\hat{R}$ is the unit vector in the direction\
    \ of increasing major radius. This is a local vector component, not a flux-surface\
    \ average.\n\nIn neoclassical transport modeling, $\\mathbf{J}_{\\mathrm{PS}}$\
    \ is obtained from the requirement of current continuity together with magnetic\
    \ geometry, pressure-gradient information, and collisional transport closures.\
    \ The radial projection can be nonzero because field-line pitch and flux-surface\
    \ geometry are not generally aligned with the cylindrical $R$ direction. This\
    \ quantity is closely related to [pfirsch_schlueter_diamagnetic_current_density](name:pfirsch_schlueter_diamagnetic_current_density);\
    \ together with components such as [toroidal_pfirsch_schlueter_current_density](name:toroidal_pfirsch_schlueter_current_density),\
    \ it helps specify the full Pfirsch-Schl\xFCter current density vector.\n\nDirect\
    \ diagnostics usually constrain magnetic geometry, pressure profiles, and total\
    \ current distributions rather than isolating this component. It is therefore\
    \ normally inferred from equilibrium or transport calculations and should be interpreted\
    \ as a signed local contribution to the current density.\n\nNo device-independent\
    \ range exists. As order-of-magnitude guidance, modeled local magnitudes are often\
    \ near zero in weak-gradient regions and can span 10^1-10^5 A.m^-2 where pressure\
    \ gradients and geometric projection are strong; the signed value may change across\
    \ a flux surface.\n\nSign convention: Positive when the Pfirsch-Schl\xFCter current\
    \ density has a component in the direction of increasing major radius $R$, away\
    \ from the toroidal symmetry axis in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame."
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_profiles/ggd/j_pfirsch_schlueter/r
    dd_path: edge_profiles/ggd/j_pfirsch_schlueter/r
    status: attached
  - id: dd:edge_profiles/ggd/j_pfirsch_schlueter/radial
    dd_path: edge_profiles/ggd/j_pfirsch_schlueter/radial
    status: attached
