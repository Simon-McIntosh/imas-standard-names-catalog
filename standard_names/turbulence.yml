- name: normalized_total_particle_perturbed_pressure_of_gyrokinetic_eigenmode
  kind: scalar
  status: active
  description: The normalized total perturbed particle pressure of a gyrokinetic eigenmode
    is the second velocity-space moment of the perturbed particle distribution, scaled
    by the equilibrium species pressure. It is the sum of the normalized parallel
    and perpendicular particle pressure perturbations under the same eigenmode amplitude
    and phase convention.
  documentation: 'The normalized total perturbed particle pressure of a gyrokinetic
    eigenmode is the second velocity-space moment of the perturbed particle distribution,
    scaled by the equilibrium species pressure. It combines kinetic-pressure perturbations
    from velocity components parallel and perpendicular to the equilibrium magnetic
    field $\mathbf{B}_0$ and is a perturbation moment of a linear eigenmode, not an
    equilibrium thermodynamic pressure.


    The defining particle moment and component decomposition are:


    $$

    \hat{p}_{\mathrm{part},s} = \frac{\delta p_{\parallel,\mathrm{part},s}+\delta
    p_{\perp,\mathrm{part},s}}{p_{0s}} = \frac{m_s\int v_\parallel^2\,\delta f_{\mathrm{part},s}\,d^3v
    + m_s\int \frac{v_\perp^2}{2}\,\delta f_{\mathrm{part},s}\,d^3v}{p_{0s}} = \hat{p}_{\parallel,\mathrm{part},s}+\hat{p}_{\perp,\mathrm{part},s},
    \qquad p_{0s}=n_{0s}T_{0s}

    $$


    where $s$ labels the species, $\delta f_{\mathrm{part},s}$ is the perturbed particle
    distribution for that species, $m_s$ is the species particle mass in kilograms,
    $v_\parallel$ and $v_\perp$ are the velocity components parallel and perpendicular
    to $\mathbf{B}_0$ in meters per second, and $d^3v$ is the velocity-space volume
    element. The two velocity integrals define $\delta p_{\parallel,\mathrm{part},s}$
    and $\delta p_{\perp,\mathrm{part},s}$, the parallel and perpendicular particle
    pressure perturbations in pascals; $p_{0s}$ is the equilibrium species pressure
    in pascals, $n_{0s}$ is the equilibrium number density in $\mathrm{m}^{-3}$, and
    $T_{0s}$ is the equilibrium temperature expressed as energy per particle in joules.
    If $T_{0s}$ is represented in electronvolts, $p_{0s}=n_{0s}eT_{0s}$ with $e$ the
    elementary charge.


    The total moment is exactly the sum of the component moments [parallel_normalized_particle_perturbed_pressure](name:parallel_normalized_particle_perturbed_pressure)
    and [perpendicular_normalized_particle_perturbed_pressure](name:perpendicular_normalized_particle_perturbed_pressure);
    it is not an additional closure variable. It is the particle-representation member
    of [normalized_perturbed_pressure](name:normalized_perturbed_pressure). It differs
    from [normalized_gyrocenter_perturbed_pressure](name:normalized_gyrocenter_perturbed_pressure)
    because that moment is formed from the perturbed gyrocenter distribution before
    the gyrocenter-to-particle mapping; normalized_gyroaveraged_pressure denotes the
    related gyroaveraged pressure response.


    A linear eigenmode may be multiplied by an arbitrary complex constant, so comparisons
    of this moment require the same eigenmode normalization and phase convention as
    its component pressure moments and related perturbed eigenmode quantities.


    Sign convention: Positive when, under the chosen common eigenmode phase convention,
    the real particle pressure perturbation moment increases the particle pressure
    relative to the equilibrium species pressure.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_particle_perturbed_pressure
  - name:perpendicular_normalized_particle_perturbed_pressure
  - name:normalized_perturbed_pressure
  - name:normalized_gyrocenter_perturbed_pressure
  sources:
  - dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/pressure
