name: distribution_particle_count
status: draft
cocos_transformation_type: one_like
description: Total number of particles in a given distribution function, computed
  as the volume integral of the particle number density.
documentation: "The distribution particle count is $N = \\int_V n(\\mathbf{r})\\,\
  \ dV$, where $n(\\mathbf{r})$ (unit $\\mathrm{m^{-3}}$) is the particle number density\
  \ derived from the full distribution function and $V$ is the plasma volume. This\
  \ is the number of real physical particles, not the number of computational markers\
  \ in a Monte Carlo simulation. For a thermal electron or ion distribution, $N$ is\
  \ typically $10^{19}$\u2013$10^{22}$ in medium to large tokamaks. For a beam-injected\
  \ fast-ion distribution, values are several orders of magnitude smaller. This global\
  \ scalar is useful for verifying particle conservation in transport simulations\
  \ and for normalizing distribution-function outputs. See also the local density\
  \ profiles and the fast-ion subset count."
