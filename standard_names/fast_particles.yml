    dd_path: distributions/distribution/global_quantities/collisions/electrons/torque_thermal_tor
    status: composed
- name: toroidal_component_of_thermal_ion_torque_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Toroidal component of the Coulomb-collision torque density exerted
    on the bulk thermal ion population, representing the local rate of toroidal angular
    momentum transfer per unit volume from fast particles to thermal ions via binary
    collisions.
  documentation: 'The toroidal collisional torque density on thermal ions quantifies
    the rate at which Coulomb collisions redistribute toroidal angular momentum from
    the fast particle distribution to the bulk ion population. In the toroidal direction
    $\hat{\phi}$ of the right-handed cylindrical $(R, \phi, Z)$ frame, this is expressed
    as $\tau_\phi^{\rm th,i} = \int C[f_{\rm fast}, f_{\rm th,i}]\, m_i v_\phi \,
    d^3v$, where $C$ is the Coulomb collision operator, $f_{\rm fast}$ and $f_{\rm
    th,i}$ are the fast particle and thermal ion distribution functions respectively,
    and $m_i v_\phi$ is the toroidal momentum of an ion. This quantity is the volume
    density form of [toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions](name:toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions);
    integrating over a plasma volume recovers the total toroidal torque on the thermal
    ion population. It complements [toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions](name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions)
    for the electron channel and [toroidal_component_of_fast_ion_torque_density_due_to_coulomb_collisions](name:toroidal_component_of_fast_ion_torque_density_due_to_coulomb_collisions)
    for the fast ion population. Typical magnitudes in neutral-beam-heated tokamaks
    range from $10^{-3}$ to $10^{-1}$ N m$^{-2}$ depending on beam power, plasma density,
    and ion charge state. This term drives neoclassical and anomalous toroidal rotation
    and feeds directly into the toroidal momentum balance equation for the thermal
    ion fluid.


    Sign convention: Positive when the torque density acts to accelerate thermal ions
    in the direction of increasing toroidal angle $\phi$.'
  unit: N.m^-2
  physics_domain: fast_particles
  links:
  - name:toroidal_component_of_thermal_ion_torque_due_to_coulomb_collisions
  - name:toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions
  - name:toroidal_component_of_fast_ion_torque_density_due_to_coulomb_collisions
  constraints: []
  arguments:
  - name: thermal_ion_torque_density_due_to_coulomb_collisions
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
