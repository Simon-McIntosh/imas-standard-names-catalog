- name: spectral_calibration_factor_at_line_of_sight
  kind: scalar
  status: active
  description: Wavelength-specific interferometric conversion coefficient that converts
    a signed phase change along a line of sight into electron column density.
  documentation: 'The spectral calibration factor is the wavelength-specific proportionality
    that maps an interferometric phase change along one line of sight to the electron
    column density on that optical path.


    The conversion is defined by


    $$

    N_{e,\mathrm{line}} = K_{\mathrm{spec}}\,\Delta\varphi

    $$


    where $N_{e,\mathrm{line}}$ is the [line-integrated electron number density](name:line_integrated_electron_number_density),
    $K_{\mathrm{spec}}$ is this spectral calibration factor, and $\Delta\varphi$ is
    the signed interferometric phase change.


    The factor applies to the complete electron-density integral along the associated
    line of sight and to its corresponding probing wavelength. It represents the electron
    contribution only and is not a local density, a line-averaged density, or an optical
    phase itself.


    Applying this factor produces the line-integrated electron number density; dividing
    that result by the optical chord length gives [line-averaged electron density](name:line_averaged_electron_density).
    The associated wavelength is the spectral parameter of the probing electromagnetic
    wave, related to [wavelength of wave beam](name:wavelength_of_wave_beam).'
  unit: m^-2.rad^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_integrated_electron_number_density
  - name:line_averaged_electron_density
  - name:wavelength_of_wave_beam
  sources:
  - dd_path: interferometer/channel/wavelength/phase_to_n_e_line
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-wavelength-phase_to_n_e_line
    dd_documentation:
      leaf: Conversion factor to be used to convert phase into line density for this
        wavelength
      parent_path: interferometer/channel/wavelength
      parent: Set of wavelengths used for interferometry
      data_type: FLT_0D
      unit: m^-2.rad^-1
    enhanced_context:
      description: "Conversion factor from measured interferometric phase to line-integrated\
        \ electron density (\u222Bne\xB7dl) for a given wavelength channel. Applied\
        \ to translate raw phase shifts into physically meaningful line density values."
      kind: llm
- name: variation_of_length_of_interferometer_beam
  kind: scalar
  status: active
  description: Signed change in the effective optical path length accumulated along
    an interferometer beam, caused by plasma relative to the corresponding no-plasma
    reference path.
  documentation: 'The quantity is the signed plasma-induced change in effective optical
    path length accumulated along one interferometer-beam line of sight. It captures
    the integrated refractive effect of the plasma along that path rather than a local
    geometric displacement.


    The defining difference is


    $$

    \Delta L = L_{\mathrm{plasma}} - L_{\mathrm{ref}}

    $$


    where $\Delta L$ is the plasma-induced optical path-length variation, $L_{\mathrm{plasma}}$
    is the effective optical path length with the plasma contribution present, and
    $L_{\mathrm{ref}}$ is the corresponding effective optical path length for the
    same beam path with the plasma contribution removed.


    The quantity applies to all plasma encountered along the complete propagation
    path of a single interferometer beam, with distributed contributions aggregated
    into one path-length difference. It has no local spatial, species-resolved, or
    charge-state-resolved meaning. It excludes the unvaried reference path length
    and is not the total [effective optical path length](name:length_of_interferometer_beam)
    of the beam.


    This variation is the optical-path quantity associated with the interferometric
    phase shift and is used to relate the propagation path to the [line-integrated
    electron number density](name:line_integrated_electron_number_density). It remains
    a path-length difference and must not be identified with the electron column density
    itself.


    Sign convention: Positive when the plasma increases the effective optical path
    length relative to the corresponding no-plasma reference path.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:line_integrated_electron_number_density
  sources:
  - dd_path: interferometer/channel/path_length_variation
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/interferometer.html#interferometer-channel-path_length_variation
    dd_documentation:
      leaf: Optical path length variation due to the plasma
      parent_path: interferometer/channel
