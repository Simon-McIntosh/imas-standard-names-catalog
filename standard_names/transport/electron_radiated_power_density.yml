name: electron_radiated_power_density
status: draft
description: Local volumetric emissivity of electrons, summing bremsstrahlung, line-excitation,
  recombination, and cyclotron radiation contributions.
documentation: "The electron radiated power density $P_{\\mathrm{rad},e}$ ($\\mathrm{W\\\
  ,m^{-3}}$) quantifies the electromagnetic power emitted per unit volume by electron\
  \ processes in the plasma. The dominant contributions are free\u2013free bremsstrahlung\
  \ $\\epsilon_{\\mathrm{brem}} \\propto n_e^2 Z_{\\mathrm{eff}} T_e^{1/2}$, electron-impact\
  \ line excitation of partially stripped impurity ions, and radiative recombination,\
  \ where $n_e$ is the electron density ($\\mathrm{m^{-3}}$), $Z_{\\mathrm{eff}}$\
  \ the effective ion charge (dimensionless), and $T_e$ the electron temperature (eV).\
  \ In clean, low-$Z_{\\mathrm{eff}}$ core plasmas, typical values range from $10^3$\
  \ to $10^5\\;\\mathrm{W\\,m^{-3}}$; in impurity-seeded detachment or radiative-mantle\
  \ scenarios, values can reach $10^6$\u2013$10^8\\;\\mathrm{W\\,m^{-3}}$. Measured\
  \ by resistive or AXUV bolometer arrays with tomographic inversion, or calculated\
  \ from atomic data (ADAS, OPEN-ADAS) given kinetic profiles. Volume integration\
  \ of $P_{\\mathrm{rad},e}$ yields the total electron radiated power; see `electron_radiated_power_inside_flux_surface`\
  \ for the cumulative radial profile. Related quantities include `ion_radiated_power_density`\
  \ for the ion channel and `total_radiated_power` for the whole-plasma integral."
