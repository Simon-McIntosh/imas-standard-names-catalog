name: gyrokinetic_eigenmode_normalized_gyrocenter_perpendicular_pressure_moment
status: draft
cocos_transformation_type: one_like
description: Normalized perpendicular pressure (temperature) moment of the perturbed
  gyrocenter distribution for a gyrokinetic eigenmode.
documentation: "This quantity represents the second velocity-space moment of the perturbed\
  \ gyrocenter distribution function $\\delta \\hat{f}_s$ weighted by the perpendicular\
  \ kinetic energy $\\mu B$, where $\\mu$ is the magnetic moment and $B$ is the equilibrium\
  \ magnetic field strength. The moment captures the perpendicular pressure (equivalently\
  \ perpendicular temperature) perturbation associated with a specific eigenmode at\
  \ wavevector $\\mathbf{k}_\\perp$ and is normalized to code reference quantities\
  \ (typically $n_{\\mathrm{ref}} T_{\\mathrm{ref}}$) yielding a dimensionless result.\
  \ In gyrokinetic turbulence simulations this moment is a primary diagnostic for\
  \ quantifying the perpendicular energy channel of turbulent transport and for assessing\
  \ pressure anisotropy $\\delta p_\\perp / \\delta p_\\parallel$ of unstable modes.\
  \ Codes such as GENE, GS2, and CGYRO output this alongside the parallel pressure\
  \ (temperature) moment to close the perturbed energy balance. Note the DD path label\
  \ says 'perpendicular temperature' \u2014 in normalized form the temperature and\
  \ pressure moments are equivalent up to a density factor already absorbed in the\
  \ normalization."
