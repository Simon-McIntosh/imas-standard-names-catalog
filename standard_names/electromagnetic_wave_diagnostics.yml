- name: period_of_fiber_optic_current_sensor
  kind: scalar
  status: active
  description: Period of a fiber optic current sensor is the repeat arclength along
    the sensing fiber of a specified spatially periodic optical or geometrical state.
    Specialized names identify which state repeats, such as optical-axis twist.
  documentation: 'Period of a fiber optic current sensor is the repeat arclength along
    the sensing fiber centerline of a specified spatially periodic optical or geometrical
    state of the sensor. It identifies the longitudinal spacing of repetition; the
    specialized standard name supplies the repeating state.


    For a state $Q(s)$ that is periodic along the fiber, the period $L_p$ is the smallest
    positive arclength satisfying:


    $$

    Q(s + L_p) = Q(s)

    $$


    where $s$ is arclength along the fiber centerline and $Q$ is the periodic state
    specified by the specialized name.


    This parent quantity is intentionally generic across fiber-sensor periods. The
    [twist period of a fiber optic current sensor](name:twist_period_of_fiber_optic_current_sensor)
    is one specialization, with $Q$ the effective birefringent-axis orientation; the
    parent does not itself specify twist, manufacturing spin, the total [length of
    the fiber optic current sensor](name:length_of_fiber_optic_current_sensor), or
    the [polarization beat length](name:polarization_beat_length).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:twist_period_of_fiber_optic_current_sensor
  - name:length_of_fiber_optic_current_sensor
- name: perpendicular_normalized_power_of_beam_tracing_beam
  kind: scalar
  status: active
  description: "Non-negative fraction of a beam\u2019s local time-averaged electromagnetic\
    \ power flow perpendicular to the local magnetic field, normalized to its initial\
    \ launch power."
  documentation: "This quantity is the magnitude of the local time-averaged electromagnetic\
    \ power-flow component perpendicular to the local magnetic-field direction, normalized\
    \ by the beam\u2019s initial launch power. It measures transverse power flow and\
    \ is not a signed projection onto a selected perpendicular direction.\n\n$$\n\
    p_{\\perp} = \\frac{\\left\\lVert \\mathbf{P} - (\\mathbf{P}\\cdot\\hat{\\mathbf{b}})\\\
    hat{\\mathbf{b}}\\right\\rVert}{P_0}\n$$\n\nwhere $\\mathbf{P}$ is the local beam\
    \ power-flow vector, $\\hat{\\mathbf{b}}$ is the unit vector along the local magnetic\
    \ field, and $P_0$ is the initial launch power. The magnitude makes $p_{\\perp}$\
    \ non-negative. Together with the signed [parallel normalized beam power](name:parallel_normalized_power_of_beam_tracing_beam),\
    \ it characterizes the local power-flow decomposition relative to the magnetic\
    \ field; [initial beam power](name:initial_power_of_beam_tracing_beam) supplies\
    \ the normalization reference."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
