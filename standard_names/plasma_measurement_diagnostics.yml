- name: electron_temperature
  kind: scalar
  status: draft
  description: Electron temperature of the plasma electron population, characterizing
    the mean thermal energy per degree of freedom of the electron velocity distribution.
    For a Maxwellian distribution, it is related to the mean kinetic energy by T_e
    = (2/3) times the mean electron kinetic energy per particle, expressed here in
    eV. When multiple electron populations are present, this quantity refers to the
    bulk (primary) electron component.
  documentation: "The electron temperature $T_e$ quantifies the thermal energy scale\
    \ of the electron population. For a 3D isotropic Maxwellian distribution, the\
    \ mean kinetic energy per electron is $\\langle E_e \\rangle = \\tfrac{3}{2}\\\
    , T_e$, where $T_e$ is expressed in eV (so that $k_B T_e$ has units of energy\
    \ when $T_e$ is in kelvin, but in IMAS the unit is eV and no factor of $k_B$ is\
    \ needed). The conversion between units is $T_e\\,[\\mathrm{eV}] = T_e\\,[\\mathrm{K}]\
    \ / 11{,}604.5$.\n\nThe electron temperature governs the electron pressure through\
    \ $p_e = n_e\\, T_e$, where $n_e$ is the electron number density and $p_e$ carries\
    \ units of eV$\\cdot$m$^{-3}$ when $T_e$ is in eV and $n_e$ is in m$^{-3}$. To\
    \ convert to pascals, $p_e\\,[\\mathrm{Pa}] = n_e\\,[\\mathrm{m}^{-3}]\\, T_e\\\
    ,[\\mathrm{eV}]\\times 1.602\\times10^{-19}$.\n\nWhen the electron energy distribution\
    \ cannot be described by a single Maxwellian \u2014 for instance, when suprathermal\
    \ or secondary populations are present \u2014 a multi-temperature fit resolves\
    \ distinct electron components. In this case, $T_e$ reported here corresponds\
    \ to the bulk (primary) electron population; component-specific temperatures for\
    \ each population in a multi-temperature fit are tracked separately via the corresponding\
    \ fit-index resolved standard names.\n\nTypical values range from approximately\
    \ 1\u201320 eV in the scrape-off layer and divertor regions to 10\u2013100 eV\
    \ in the near-core boundary, and can exceed several keV in the plasma core. The\
    \ electron temperature is a key parameter governing energy transport, ionization\
    \ rates, and radiation losses throughout the plasma.\n\nSign convention: Positive\
    \ when the electron population carries net thermal energy above absolute zero;\
    \ $T_e$ is a strictly nonnegative quantity."
  unit: eV
  physics_domain: plasma_measurement_diagnostics
