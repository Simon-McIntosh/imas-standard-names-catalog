name: vertical_component_of_inertial_current_density
description: Vertical (Z-axis) projection of the inertial current density arising
  from plasma acceleration and time-varying flows.
documentation: "The vertical component $j_{\\mathrm{inert},z} = (\\mathbf{j}_{\\mathrm{inert}}\
  \ \\cdot \\hat{z})$ captures the height-directed part of the inertial current density,\
  \ where $\\mathbf{j}_{\\mathrm{inert}} = \\rho \\, d\\mathbf{v}/dt$ with $\\rho$\
  \ the mass density (kg\xB7m$^{-3}$) and $\\mathbf{v}$ the plasma fluid velocity\
  \ (m\xB7s$^{-1}$). This term is significant during transient events such as disruptions,\
  \ edge-localized modes (ELMs), and vertical displacement events where rapid momentum\
  \ changes produce non-negligible current contributions. Typical magnitudes are small\
  \ compared to Ohmic or bootstrap current densities in steady-state but can reach\
  \ $10^4$\u2013$10^5$ A\xB7m$^{-2}$ during fast transients in the edge and scrape-off\
  \ layer. Computed from time-dependent fluid simulations (e.g., SOLPS-ITER, JOREK)\
  \ or inferred from force-balance analysis. See also `toroidal_component_of_inertial_current_density`\
  \ for the toroidal projection and `toroidal_component_of_total_current_density`\
  \ for the aggregate current."
kind: vector_component
unit: A.m^-2
status: draft
