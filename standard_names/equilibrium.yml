- name: poloidal_magnetic_flux_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Poloidal magnetic flux evaluated at the radial location where the safety
    factor reaches its minimum value across the plasma profile.
  documentation: "The poloidal magnetic flux $\\psi$ is the flux of the poloidal magnetic\
    \ field through a surface of constant toroidal angle, serving as the fundamental\
    \ flux surface label in axisymmetric equilibrium. At the location where the safety\
    \ factor $q(r)$ attains its minimum $q_{\\mathrm{min}}$, this quantity $\\psi(q_{\\\
    mathrm{min}})$ provides the flux coordinate of the most MHD-sensitive radial zone.\
    \ In conventional tokamak H-modes, $q_{\\mathrm{min}}$ typically lies near $\\\
    psi / \\psi_{\\mathrm{sep}} \\approx 0.5$\u2013$0.7$, with $\\psi_{\\mathrm{sep}}$\
    \ the poloidal flux at the separatrix; the radial position of $q_{\\mathrm{min}}$\
    \ strongly influences sawtooth stability and the onset of neoclassical tearing\
    \ modes. This flux value is routinely extracted from equilibrium reconstruction\
    \ (EFIT, LIUQE) and is paired with [minimum_safety_factor](name:minimum_safety_factor)\
    \ to define the $q$-profile minimum. See also [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ and [poloidal_magnetic_flux_at_separatrix](name:poloidal_magnetic_flux_at_separatrix)\
    \ for the bounding references of the radial flux coordinate. The quantity is COCOS-dependent:\
    \ under the standard IMAS right-handed cylindrical $(R, \\phi, Z)$ frame, $\\\
    psi$ is defined such that $B_{\\mathrm{pol}} = (1/R)\\, \\nabla \\psi \\times\
    \ \\hat{\\phi}$.\n\nSign convention: Positive when $\\psi$ decreases from the\
    \ magnetic axis to the plasma boundary for a plasma current $I_p$ flowing in the\
    \ direction of increasing toroidal angle $\\phi$."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:minimum_safety_factor
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_separatrix
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/psi
    dd_path: equilibrium/time_slice/global_quantities/q_min/psi
    status: composed
- name: poloidal_magnetic_flux_of_flux_loop
  kind: scalar
  status: draft
  description: Poloidal component of the magnetic flux threading a flux loop sensor,
    equal to the loop voltage integrated in time.
  documentation: "The poloidal magnetic flux through a flux loop sensor is the integral\
    \ of the inductive voltage induced in the loop, $\u03A8_{\\text{loop}} = \\int\
    \ V_{\\text{loop}} \\, dt$. This flux is dominated by the poloidal field generated\
    \ by the plasma current and external poloidal field coils, with contributions\
    \ from eddy currents in passive structures. It serves as a fundamental constraint\
    \ in equilibrium reconstruction codes, such as EFIT or LIUQE, that solve the Grad-Shafranov\
    \ equation. Typical flux values range from 1 to 10 Wb in medium-size tokamaks.\
    \ For a loop located inside the vacuum vessel, the measured flux includes both\
    \ the plasma contribution and the flux from induced currents in the vessel wall.\n\
    \nSign convention: Positive when the flux through the loop is directed in the\
    \ direction of increasing toroidal angle $\u03C6$.\n\nThe measured value [magnetic_flux_of_flux_loop](name:magnetic_flux_of_flux_loop)\
    \ is compared with the reconstructed value in the equilibrium solution; the mutual\
    \ inductance [mutual_inductance_of_flux_loop](name:mutual_inductance_of_flux_loop)\
    \ relates the flux to currents in poloidal field coils. The poloidal magnetic\
    \ flux at the magnetic axis [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ and at the separatrix [poloidal_magnetic_flux_at_separatrix](name:poloidal_magnetic_flux_at_separatrix)\
    \ provide normalization references."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:magnetic_flux_of_flux_loop
  - name:mutual_inductance_of_flux_loop
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_separatrix
  sources:
  - id: dd:equilibrium/time_slice/constraints/flux_loop/measured
    dd_path: equilibrium/time_slice/constraints/flux_loop/measured
    status: composed
- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: Radial component of the magnetic field vector on the 2D poloidal grid,
    representing the projection onto the major-radius direction of the cylindrical
    coordinate system.
  documentation: The radial magnetic field $B_R = \mathbf{B} \cdot \hat{R}$ is the
    projection of the magnetic field vector onto the radial ($\hat{R}$) axis of the
    right-handed cylindrical $(R, \phi, Z)$ coordinate system. In the confined plasma
    region, $B_R$ describes the poloidal magnetic field's contribution to the equilibrium
    force balance $\nabla p = \mathbf{j} \times \mathbf{B}$, and it is a key output
    of Grad-Shafranov equilibrium reconstruction codes such as EFIT or LIUQE. Typical
    values range from a few tens of mT in the plasma core to several hundred mT near
    the separatrix in medium-size tokamaks. The sign indicates the direction of the
    field component relative to increasing major radius $R$; this is convention-dependent
    and must be understood from the reconstruction setup. The full magnetic field
    vector is represented by the parent quantity [magnetic_field](name:magnetic_field),
    with companion components [poloidal_magnetic_field](name:poloidal_magnetic_field)
    and a toroidal component [toroidal_magnetic_field_at_magnetic_axis](name:toroidal_magnetic_field_at_magnetic_axis).
