- name: normalized_particle_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Gyro-Bohm-normalized turbulent particle flux arising from the perturbed
    parallel electromagnetic vector potential delta_A_parallel in a nonlinear gyrokinetic
    simulation, obtained by flux-surface averaging the delta_A_parallel channel of
    the gyrokinetic Vlasov equation over a quasi-stationary turbulent state.
  documentation: 'In electromagnetic gyrokinetic turbulence, the total particle flux
    decomposes into contributions from distinct fluctuation channels. This quantity
    isolates the $\delta A_\parallel$ channel, which enters through the parallel inductive
    electric field $E_\parallel = -\partial_t \delta A_\parallel$ and drives particle
    transport via field-line bending (magnetic flutter). It is distinct from the compressional
    $\delta B_\parallel$ channel (mirror-force-driven transport) and the electrostatic
    $\delta\phi$ channel.


    **Defining expression**


    The $\delta A_\parallel$ contribution to the particle flux is

    $$\Gamma_{A_\parallel,s} = \left\langle \int d^3v\, \delta f_s\, \frac{v_{\parallel}
    \delta A_\parallel}{B_0}\, \nabla r \right\rangle_{\mathrm{FS}},$$

    where $\delta f_s$ is the perturbed distribution function for species $s$, $v_\parallel$
    is the parallel velocity, $B_0$ is the equilibrium magnetic field magnitude, $\nabla
    r$ is the gradient in the radial flux-surface label direction, and $\langle \cdots
    \rangle_{\mathrm{FS}}$ denotes the flux-surface average in flux coordinates $(\rho,
    \theta, \phi)$ with $\rho$ the flux-surface label, $\theta$ the poloidal angle,
    and $\phi$ the toroidal angle in the right-handed cylindrical $(R, \phi, Z)$ frame
    ($R$ major radius, $Z$ vertical height).


    This flux is normalized to the gyro-Bohm particle flux

    $$\Gamma_\mathrm{gB} = n_\mathrm{ref}\, c_{s,\mathrm{ref}}\left(\frac{\rho_{s,\mathrm{ref}}}{a}\right)^2,$$

    where $n_\mathrm{ref}$ is the reference density, $c_{s,\mathrm{ref}} = \sqrt{T_\mathrm{ref}/m_\mathrm{ref}}$
    is the reference thermal velocity, $\rho_{s,\mathrm{ref}} = c_{s,\mathrm{ref}}
    m_\mathrm{ref}/(e B_0)$ is the reference gyroradius, and $a$ is the plasma minor
    radius. The reported dimensionless quantity is $\Gamma_{A_\parallel,s}/\Gamma_\mathrm{gB}$.


    **Species resolution**


    The flux is typically species-resolved; the specific species is identified by
    context in the IDS structure. Summed-over-species variants may also appear depending
    on the simulation output.


    **Physical regimes**


    In electrostatic or low-$\beta$ turbulence dominated by ion-temperature-gradient
    (ITG) modes, the $\delta A_\parallel$ contribution is small relative to the electrostatic
    $\delta\phi$ channel. It becomes progressively more significant at elevated normalized
    plasma pressure $\beta = 2\mu_0 n T / B_0^2$, and can dominate in kinetic ballooning
    mode (KBM) or microtearing mode (MTM) regimes. Typical normalized magnitudes range
    from $\sim 0.01$ in nearly electrostatic cases to several gyro-Bohm units in high-$\beta$
    electromagnetic turbulence.


    **Averaging**


    The time average $\langle \cdots \rangle_t$ is taken over a quasi-stationary turbulent
    interval after the initial transient phase. The flux-surface average $\langle
    \cdots \rangle_{\mathrm{FS}}$ is performed in the flux-coordinate system $(\rho,
    \theta, \phi)$, consistent with the right-handed cylindrical $(R, \phi, Z)$ frame
    in which $R$ is the major radius and $Z$ is the vertical height.


    Sign convention: Positive when the net particle flux is directed outward, away
    from the magnetic axis toward increasing minor radius.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_flux_due_to_perturbed_parallel_magnetic_field
