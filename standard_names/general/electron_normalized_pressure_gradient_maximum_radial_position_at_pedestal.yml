name: electron_normalized_pressure_gradient_maximum_radial_position_at_pedestal
description: Normalized poloidal flux coordinate $\psi_N$ where the electron pressure
  normalized gradient parameter $\alpha$ reaches its maximum.
documentation: "This quantity gives the $\\psi_N$ location at which the normalized\
  \ pressure gradient $\\alpha = -\\frac{2\\mu_0}{B_{\\rm pol}^2} R q^2 \\frac{dp_e}{dr}$\
  \ attains its peak within the pedestal. In type-I ELMy H-mode, the position of maximum\
  \ $\\alpha$ typically falls at $\\psi_N \\approx 0.94$\u2013$0.98$, roughly coinciding\
  \ with the pedestal midpoint or the maximum gradient location. This coordinate is\
  \ important for mapping the operational point onto the peeling\u2013ballooning stability\
  \ diagram, where the radial location affects the relative importance of peeling\
  \ versus ballooning drive. It is extracted from mtanh fits to $p_e(\\psi_N)$ combined\
  \ with equilibrium geometry from magnetic reconstruction. See also `electron_pressure_pedestal_alpha_parameter_maximum`,\
  \ `electron_pressure_pedestal_maximum_gradient_position`."
kind: scalar
unit: '1'
