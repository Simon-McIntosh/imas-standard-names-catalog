- name: boron_density
  kind: scalar
  status: draft
  description: Total number density of elemental boron in the plasma, encompassing
    neutral boron atoms and all ionization states from B+ through B5+, providing a
    local or spatially averaged measure of boron impurity concentration.
  documentation: "Boron number density quantifies the total number of boron particles\
    \ \u2014 neutral atoms and all ionized charge states \u2014 per unit volume of\
    \ plasma. It is the primary scalar measure of boron impurity content, governing\
    \ contributions to radiative power losses, dilution of the hydrogenic fuel, and\
    \ the effective charge $Z_\\mathrm{eff}$.\n\nThe total elemental boron density\
    \ is the sum over all charge states:\n\n$$\nn_\\mathrm{B} = \\sum_{z=0}^{5} n_\\\
    mathrm{B}^{(z)}\n$$\n\nwhere $n_\\mathrm{B}^{(z)}$ is the number density of boron\
    \ in ionization state $z$, with $z = 0$ denoting neutral boron and $z = 5$ the\
    \ fully stripped B$^{5+}$ ion.\n\nBoron impurity content is inferred experimentally\
    \ via vacuum ultraviolet spectroscopy, charge-exchange recombination spectroscopy,\
    \ or soft X-ray tomography. Spatially resolved variants include the [volume-averaged\
    \ boron density](name:volume_averaged_boron_density), which integrates over the\
    \ entire confined plasma volume and includes neutrals, and the [line-averaged\
    \ boron density](name:line_averaged_boron_density), which is the chord-integrated\
    \ density along a diagnostic line of sight divided by the chord length. The flux-surface-averaged\
    \ value at the separatrix is captured by the [flux-surface-averaged boron density](name:flux_surface_averaged_boron_density).\
    \ The dimensionless global boron impurity fraction relative to the electron density\
    \ is given by [boron_fraction](name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density).\n\
    \nTypical boron densities in tokamak core plasmas range from $10^{16}$ to $10^{18}$\
    \ m$^{-3}$, corresponding to impurity concentrations of roughly $10^{-4}$ to $10^{-2}$\
    \ relative to the electron density.\n\nSign convention: Positive when boron atoms\
    \ or ions are present at the measurement location."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:volume_averaged_boron_density
  - name:line_averaged_boron_density
  - name:flux_surface_averaged_boron_density
  - name:ratio_of_volume_averaged_boron_density_to_volume_averaged_electron_density
- name: carbon_density
  kind: scalar
  status: draft
  description: Total number density of elemental carbon in the plasma, summed over
    all charge states from neutral atoms through fully stripped C6+.
  documentation: 'Carbon density is the total number density of elemental carbon present
    in the plasma, encompassing neutral carbon atoms and all ionic charge states from
    singly ionized $C^+$ through fully stripped $C^{6+}$. As a light impurity, carbon
    dilutes hydrogenic fuel species and contributes to radiative energy losses through
    line radiation from partially ionized charge states.


    The total carbon number density is defined as the charge-state sum:


    $$

    n_C = \sum_{z=0}^{6} n_{C^{z+}}

    $$


    where $n_{C^{z+}}$ is the number density of carbon in charge state $z+$, in m$^{-3}$.


    Carbon density is inferred from charge exchange recombination spectroscopy, which
    resolves individual charge-state densities, or from passive spectroscopy of carbon
    line emission analyzed with collisional-radiative models. Spatially resolved forms
    include [flux_surface_averaged_carbon_density](name:flux_surface_averaged_carbon_density)
    on closed magnetic surfaces and [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    over the confined plasma volume.


    Carbon impurity fractions $n_C/n_e$ range from roughly $10^{-4}$ in metallic-wall
    devices to a few percent in carbon-wall campaigns; [ratio_of_carbon_density_to_electron_density](name:ratio_of_carbon_density_to_electron_density)
    captures this dimensionless concentration measure. Comparison with [beryllium_density](name:beryllium_density)
    and [tungsten_density](name:tungsten_density) places carbon in the broader impurity
    inventory.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_carbon_density
  - name:volume_averaged_carbon_density
  - name:ratio_of_carbon_density_to_electron_density
  - name:beryllium_density
  - name:tungsten_density
- name: decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: "Radial e-folding scale over which a plasma quantity \u2014 heat flux,\
    \ particle density, or temperature \u2014 decreases exponentially with distance\
    \ from the separatrix into the open-field-line scrape-off layer."
  documentation: "The decay length over the scrape-off layer (SOL) is the radial e-folding\
    \ scale over which a plasma quantity decreases exponentially with increasing distance\
    \ from the magnetic separatrix into the open-field-line region between the separatrix\
    \ and the material wall. It is the abstract parent of a family of species- and\
    \ transport-channel-specific lengths, including [heat_decay_length_over_scrape_off_layer](name:heat_decay_length_over_scrape_off_layer)\
    \ and electron_decay_length_over_scrape_off_layer, and is itself a specialization\
    \ of length_over_scrape_off_layer restricted to exponentially decaying profiles.\n\
    \nThe e-folding length $\\lambda$ is defined by the exponential fit to the radial\
    \ profile:\n\n$$\nf(r) = f_0 \\exp\\!\\left(-\\frac{r}{\\lambda}\\right)\n$$\n\
    \nwhere $r$ is the radial distance measured outward from the separatrix in the\
    \ direction perpendicular to the magnetic field and $f_0$ is the value of the\
    \ decaying quantity at the separatrix.\n\nSOL decay lengths are inferred from\
    \ midplane Langmuir probe traversals, edge Thomson scattering measurements, or\
    \ divertor target heat-flux distributions mapped back to the upstream midplane\
    \ along field lines. Typical heat-channel decay lengths in H-mode tokamak plasmas\
    \ lie in the range 1\u201310 mm, while particle density e-folding lengths are\
    \ generally larger at 10\u201350 mm, reflecting the differing cross-field transport\
    \ coefficients for energy and particles."
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:heat_decay_length_over_scrape_off_layer
  sources:
  - id: dd:summary/scrape_off_layer/n_e_decay_length/value
    dd_path: summary/scrape_off_layer/n_e_decay_length/value
    status: composed
- name: density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density at the pedestal top is the particle count per volume
    for the named particle population at the core-side shoulder of the H-mode edge
    transport barrier, where the steep density gradient transitions to the flatter
    confined-core variation.
  documentation: 'Number density at the pedestal top is the particle count per volume
    for the named plasma particle population evaluated at the core-side shoulder of
    an H-mode pedestal. The pedestal top is the transition where the steep-gradient
    edge transport barrier meets the flatter confined-core density variation, distinct
    from a separatrix or plasma-boundary value. For a bare chemical species or element,
    the density is summed over all ionization charge states unless a particular charge
    state is explicitly named; as a particle count per volume, the physical value
    is non-negative.


    For a population $s$ on the pedestal-top flux surface, the defining local density
    is


    $$

    n_s(\xi_{\mathrm{ped,top}}) = \left.\frac{dN_s}{dV}\right|_{\xi=\xi_{\mathrm{ped,top}}}

    $$


    where $n_s$ is the number density of population $s$ in $\mathrm{m^{-3}}$, $N_s$
    is the dimensionless particle count, $V$ is physical volume in $\mathrm{m^3}$,
    and $\xi_{\mathrm{ped,top}}$ is the explicitly chosen radial label of the pedestal-top
    flux surface, for example normalized toroidal flux radius $\rho_\mathrm{tor,norm}$
    or normalized poloidal flux $\psi_N$.


    In practice, the pedestal-top density is obtained by fitting edge density measurements
    across the pedestal and evaluating the fitted density at the top location, often
    identified from the change in gradient. Electron density is commonly constrained
    by Thomson scattering, reflectometry, or interferometry; impurity and ion population
    densities are inferred from species-sensitive spectroscopy, charge balance, or
    quasineutrality constraints as appropriate. Related quantities include [electron
    density at pedestal top](name:electron_density_at_pedestal_top), [nitrogen density
    at pedestal top](name:nitrogen_density_at_pedestal_top), and [total ion density
    at pedestal]; boundary values such as [electron density at plasma boundary](name:electron_density_at_plasma_boundary)
    refer to a different locus.


    Typical H-mode tokamak pedestal-top densities for electrons and bulk ions are
    about $5\times10^{18}$-$1.5\times10^{20}\ \mathrm{m^{-3}}$. Fuel minority or impurity
    species can span wider ranges, from trace levels below $10^{16}\ \mathrm{m^{-3}}$
    to seeded or abundant species near $10^{18}$-$10^{19}\ \mathrm{m^{-3}}$, depending
    on fueling, recycling, radiation control, and the charge-state summation convention.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_pedestal_top
  - name:nitrogen_density_at_pedestal_top
  - name:electron_density_at_plasma_boundary
- name: argon_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of argon ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile,
    summed over all ionization states unless a specific charge state is given.
  documentation: "Argon density at the pedestal is the local number density of argon\
    \ ions on the pedestal-top flux surface, at the shoulder of the H-mode edge transport\
    \ barrier where steep edge gradients transition toward the confined core plasma.\
    \ Unless a charge state is separately specified, this quantity is summed over\
    \ all ionization stages from singly ionized Ar$^{1+}$ through fully stripped Ar$^{18+}$:\n\
    \n$$\nn_\\mathrm{Ar} = \\sum_{k=1}^{18} n_{\\mathrm{Ar},k}\n$$\n\nwhere $n_{\\\
    mathrm{Ar},k}$ is the number density of argon ions in charge state $k$.\n\nArgon\
    \ ($Z = 18$) is a noble gas impurity injected for radiative power exhaust management;\
    \ its high charge number makes it an effective radiator compared to lighter seeding\
    \ impurities such as [nitrogen_density_at_pedestal_top](name:nitrogen_density_at_pedestal_top)\
    \ or [boron_density_at_pedestal_top](name:boron_density_at_pedestal_top). The\
    \ pedestal-top value is obtained from the radial density profile \u2014 measured\
    \ via Thomson scattering or passive spectroscopy and fit with a modified hyperbolic-tangent\
    \ function \u2014 to identify the pedestal shoulder location. Argon pedestal concentrations\
    \ are typically $10^{-4}$\u2013$10^{-2}$ of the electron density, depending on\
    \ seeding rate and plasma regime. The parent quantity [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ generalizes over all species at this locus, and [argon_density_at_plasma_boundary](name:argon_density_at_plasma_boundary)\
    \ gives the corresponding value at the last closed flux surface."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:nitrogen_density_at_pedestal_top
  - name:boron_density_at_pedestal_top
  - name:density_at_pedestal_top
  - name:argon_density_at_plasma_boundary
  arguments:
  - name: density_at_pedestal_top
    operator: argon
    operator_kind: qualifier
- name: beryllium_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of beryllium impurity ions evaluated at the H-mode pedestal
    top, summed over all ionization states unless a specific charge state is specified.
  documentation: 'Beryllium density at the pedestal top is the local number density
    of beryllium impurity ions at the shoulder of the H-mode edge transport barrier,
    summed over all charge states from singly ionized Be$^+$ through fully stripped
    Be$^{4+}$ unless a specific ionization stage is identified separately. This quantity
    is the beryllium-specific member of the [density_at_pedestal_top](name:density_at_pedestal_top)
    family, which spans all plasma species evaluated at this locus.


    The species-summed number density is defined as:


    $$

    n_\mathrm{Be} = \sum_{j=1}^{4} n_{\mathrm{Be}^{j+}}

    $$


    where $j$ indexes the ionization stage from singly ionized ($j=1$) to fully stripped
    ($j=4$, atomic number $Z=4$).


    The pedestal top marks the core-side end of the steep H-mode edge-transport barrier,
    where the edge density and temperature gradients transition toward the flatter
    confined-region profiles. Beryllium is a light impurity that enters the plasma
    via sputtering and recycling from beryllium plasma-facing components; its concentration
    at the pedestal top influences hydrogenic fuel dilution and edge radiated power.


    Beryllium density at the pedestal can be inferred from charge-exchange recombination
    spectroscopy or from passive UV/VUV spectroscopy of beryllium emission lines.
    The complementary locus-resolved quantities [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary)
    and [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    bracket this pedestal-top value radially, while [beryllium_density](name:beryllium_density)
    describes the full spatial profile.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_magnetic_axis
  - name:beryllium_density
  arguments:
  - name: density_at_pedestal_top
    operator: beryllium
    operator_kind: qualifier
- name: boron_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Boron ion number density evaluated at the H-mode pedestal top, where
    the steep-gradient edge transport barrier meets the flatter core profile, summed
    over all ionization states.
  documentation: "Boron density at the pedestal is the local number density of boron\
    \ impurity ions evaluated at the pedestal top, the core-side shoulder of the H-mode\
    \ edge transport barrier where the steep edge density gradient transitions toward\
    \ the flatter confined core plasma. Unless a specific charge state is named, the\
    \ value is summed over all ionization states from B$^{1+}$ through fully stripped\
    \ B$^{5+}$, yielding the total elemental boron ion density at that location; the\
    \ corresponding radial profile quantity is [boron_density](name:boron_density),\
    \ and the species-generalizing parent is [density_at_pedestal_top](name:density_at_pedestal_top).\
    \ Boron enters tokamak plasmas primarily through boronization of the first wall\
    \ and as a candidate low-Z radiating impurity; its pedestal-top concentration\
    \ influences both the electron density budget and edge radiative losses. It is\
    \ inferred from passive spectroscopy of boron line emission in the vacuum-ultraviolet\
    \ and visible ranges, or from charge exchange recombination spectroscopy when\
    \ a co-injected neutral beam is available. Typical pedestal-top values in boronized\
    \ devices span $10^{16}$\u2013$10^{18}$ m$^{-3}$. Related light-impurity and seeding-impurity\
    \ densities at the pedestal include [nitrogen_density_at_pedestal_top](name:nitrogen_density_at_pedestal_top)\
    \ and [krypton_density_at_pedestal_top](name:krypton_density_at_pedestal_top)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density
  - name:density_at_pedestal_top
  - name:nitrogen_density_at_pedestal_top
  - name:krypton_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: boron
    operator_kind: qualifier
