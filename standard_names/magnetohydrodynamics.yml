- name: mode_number
  kind: vector
  status: draft
  description: Dimensionless integer tuple of the poloidal, toroidal, and radial mode
    numbers that together identify the spatial periodicity and radial branch of a
    linear MHD perturbation eigenmode.
  documentation: "The mode number vector collects the set of dimensionless integer\
    \ quantum numbers that jointly specify the spatial structure of a linear MHD perturbation\
    \ eigenmode in toroidal geometry. Its components are the toroidal mode number\
    \ $n$ (periodicity in the toroidal angle $\\phi$), the poloidal mode number $m$\
    \ (Fourier harmonic in the poloidal angle $\\theta$ of flux coordinates $(\\rho,\
    \ \\theta, \\phi)$), and a non-negative radial index counting radial nodes between\
    \ the magnetic axis and the plasma boundary.\n\nThe spatial phase of a single\
    \ Fourier component is governed by\n\n$$\n\\exp\\!\\bigl(i(m\\theta - n\\phi)\\\
    bigr)\n$$\n\nwhere $\\theta$ is the poloidal angle and $\\phi$ is the toroidal\
    \ angle in the right-handed cylindrical $(R, \\phi, Z)$ frame. An eigenmode at\
    \ fixed toroidal number $n$ generally couples multiple poloidal harmonics $m$\
    \ through safety-factor variation and equilibrium shaping, so the full poloidal\
    \ harmonic content accompanies a single toroidal and a single radial index.\n\n\
    Mode numbers are identified from linear MHD stability calculations or inferred\
    \ experimentally using magnetic probe arrays, soft X-ray tomography, or ECE diagnostics\
    \ that spatially resolve the perturbation structure. The [Alfv\xE9n continuum\
    \ frequency](name:alfven_frequency) is evaluated per toroidal mode number $n$,\
    \ directly linking the mode number to local plasma conditions and continuum boundaries.\n\
    \nTypical toroidal mode numbers are $n = 1$\u2013$3$ for neoclassical tearing\
    \ modes and $n = 1$\u2013$50$ for higher-frequency MHD instabilities; poloidal\
    \ mode numbers span $m = 1$\u2013$30$; the radial mode number is a non-negative\
    \ integer with $0$ denoting the fundamental branch.\n\nSign convention: Positive\
    \ when the toroidal mode number $n$ labels a perturbation phase increasing in\
    \ the direction of increasing toroidal angle $\\phi$."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency
  sources:
  - id: derived:mode_number
    status: composed
- name: neoclassical_tearing_mode_phase
  kind: scalar
  status: draft
  description: Helical phase angle of a neoclassical tearing mode magnetic island,
    giving the instantaneous angular orientation of the (m,n) island on its resonant
    flux surface relative to a fixed zero-phase reference. Its time derivative is
    the island rotation angular frequency.
  documentation: 'Neoclassical tearing mode phase is the angular offset that locates
    the magnetic island of a specified $(m,n)$ tearing perturbation on its resonant
    flux surface. Working in the flux coordinates $(\rho, \theta, \phi)$, where $\rho$
    labels the surface, $\theta$ is the poloidal angle, and $\phi$ is the toroidal
    angle, the phase fixes the instantaneous helical orientation of the island relative
    to a chosen zero-phase reference.


    The phase $\Phi$ is defined as the additive angle in the argument of the helical
    magnetic perturbation, with the mode amplitude taken to be real and non-negative
    so that $\Phi$ is unambiguous (no phase can be absorbed into the amplitude):


    $$

    \delta B_\rho(\rho, \theta, \phi, t) = A_{mn}(\rho, t)\,\cos\!\left[m\theta -
    n\phi + \Phi(t)\right]

    $$


    where $\delta B_\rho$ is the radial magnetic-field perturbation in tesla, $A_{mn}(\rho,
    t) \geq 0$ is the real perturbation amplitude in tesla for poloidal mode number
    $m$ and toroidal mode number $n$, the angles $\theta$ and $\phi$ are in radians,
    and $\Phi$ is the island phase in radians. The phase is physically meaningful
    modulo $2\pi$; wrapped values require a specified branch such as $0$ to $2\pi$
    rad or $-\pi$ to $\pi$ rad, while an unwrapped phase follows continuous island
    rotation. Its time derivative gives the [mode rotation frequency](name:rotation_frequency_of_neoclassical_tearing_mode).


    In practice the phase is obtained by fitting the phase of the measured or reconstructed
    magnetic perturbation to the specified $(m,n)$ helical structure relative to a
    fixed reference sensor. The onset phase is the value of $\Phi$ when the mode first
    appears, and time-resolved estimates track the rotating island orientation as
    the mode evolves. Together with the [island width](name:radial_width_of_neoclassical_tearing_mode)
    and the [radial location of the resonant surface](name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center),
    it characterizes the leading-order island kinematics.


    Typical wrapped values span one full angular interval, either 0 to about 6.28
    rad or about -3.14 to 3.14 rad depending on the chosen branch. During sustained
    rotation an unwrapped phase advances or retreats through many multiples of $2\pi$,
    and electromagnetic torques can drive the rotation toward zero, signaling mode
    locking.


    Sign convention: Positive when the island phase advances such that the helical
    structure rotates in the direction of increasing toroidal angle $\phi$ (counter-clockwise
    viewed from above $+\hat{Z}$).'
  unit: rad
  physics_domain: magnetohydrodynamics
  links:
  - name:rotation_frequency_of_neoclassical_tearing_mode
  - name:radial_width_of_neoclassical_tearing_mode
  - name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/phase
    dd_path: ntms/time_slice/mode/detailed_evolution/phase
    status: attached
  - id: dd:ntms/time_slice/mode/onset/phase
    dd_path: ntms/time_slice/mode/onset/phase
    status: attached
  - id: dd:ntms/time_slice/mode/phase
    dd_path: ntms/time_slice/mode/phase
    status: attached
- name: per_toroidal_mode_growth_rate
  kind: scalar
  status: draft
  description: Linear exponential growth rate of a single MHD eigenmode resolved per
    toroidal mode number, equal to the imaginary part of the complex eigenfrequency
    from linear stability analysis.
  documentation: "The per-toroidal-mode growth rate is the linear growth rate $\\\
    gamma$ of a plasma MHD instability eigenmode for a specific toroidal Fourier mode\
    \ number $n_\\phi$. It is the imaginary part of the complex eigenfrequency $\\\
    omega = \\omega_r + i\\gamma$, where the real part $\\omega_r$ is the mode oscillation\
    \ frequency given by mode_frequency.\n\nThe eigenmode amplitude $A$ evolves in\
    \ time as:\n\n$$\nA(t) \\propto e^{(\\gamma + i\\omega_r)\\,t}\n$$\n\nwhere $t$\
    \ is time. A positive $\\gamma$ signals exponential growth of the perturbation\
    \ (instability), while a negative $\\gamma$ indicates a damped or stable mode.\n\
    \nThe growth rate is obtained by solving the linearized MHD equations as an eigenvalue\
    \ problem, treating each toroidal mode number $n_\\phi$ independently under the\
    \ assumption of an axisymmetric background equilibrium. The complementary per_toroidal_mode_perturbed_energy\
    \ characterizes the energy content of the same eigenmode, and [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part)\
    \ provides an analogous growth or damping rate for the shear Alfv\xE9n continuum.\n\
    \nIdeal kink ($n_\\phi = 1$) instabilities in high-normalized-pressure plasmas\
    \ can reach $10^3$\u2013$10^5$ Hz, while resistive tearing modes grow on slower\
    \ timescales, $\\gamma \\sim 1$\u2013$10^3$ Hz.\n\nSign convention: Positive when\
    \ the eigenmode amplitude grows exponentially in time, indicating instability;\
    \ negative when the mode is stable or damped."
  unit: Hz
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_imaginary_part
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/growthrate
    dd_path: mhd_linear/time_slice/toroidal_mode/growthrate
    status: composed
- name: perturbed_electrostatic_potential
  kind: scalar
  status: draft
  description: Complex eigenfunction of the first-order electrostatic potential perturbation
    for a specified toroidal Fourier mode in linear MHD stability analysis, encoding
    the scalar electric potential contribution to the perturbed field separate from
    inductive vector-potential effects.
  documentation: 'The perturbed electrostatic potential is the scalar electric potential
    component of the first-order electromagnetic perturbation in linear MHD or drift-kinetic
    stability analysis. It arises from the decomposition of the perturbed electric
    field into electrostatic and inductive contributions, and governs the $\mathbf{E}\times\mathbf{B}$
    drifts and electrostatic forces associated with the eigenmode structure.


    The perturbed electric field decomposes as:


    $$

    \delta\mathbf{E} = -\nabla\delta\phi - \frac{\partial \delta\mathbf{A}}{\partial
    t}

    $$


    where $\delta\phi$ is the electrostatic potential perturbation (this quantity)
    and $\delta\mathbf{A}$ is the perturbed magnetic vector potential. For a single
    toroidal Fourier mode labeled by the [toroidal MHD mode number](name:toroidal_mhd_mode_number)
    $n$, the eigenfunction $\delta\hat{\phi}$ is complex-valued.


    The complex eigenfunction is computed by solving the quasi-neutrality condition
    or perturbed Poisson equation in a linear stability calculation. Eigenfunction
    amplitude and phase are normalization-dependent; physically meaningful information
    resides in amplitude ratios between field components and in cross-phases relative
    to other perturbation eigenfunctions such as [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part).
    The full complex eigenfunction is decomposed into [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part)
    and [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part),
    which store the real and imaginary parts respectively for a given toroidal mode.'
  unit: V
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_mhd_mode_number
  - name:perturbed_plasma_mass_density_real_part
  - name:perturbed_electrostatic_potential_real_part
  - name:perturbed_electrostatic_potential_imaginary_part
  arguments:
  - name: electrostatic_potential
    operator: perturbed
    operator_kind: qualifier
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed/imaginary
    status: composed
- name: perturbed_electrostatic_potential_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex first-order electrostatic potential perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: "The imaginary part of the perturbed electrostatic potential eigenfunction\
    \ is one of two real-valued components that together fully specify the complex\
    \ scalar perturbation $\\delta\\phi$ throughout the confined plasma for a single\
    \ linear magnetohydrodynamic eigenmode. The irrotational component of the perturbed\
    \ electric field is $\\delta\\mathbf{E}_\\mathrm{es} = -\\nabla\\delta\\phi$,\
    \ separate from the inductive contribution arising from the perturbed magnetic\
    \ vector potential.\n\nThe complex eigenfunction decomposes as:\n\n$$\n\\delta\\\
    phi = \\operatorname{Re}(\\delta\\phi) + i\\,\\operatorname{Im}(\\delta\\phi)\n\
    $$\n\nwhere $\\operatorname{Re}(\\delta\\phi)$ is the [real part](name:perturbed_electrostatic_potential_real_part)\
    \ and $\\operatorname{Im}(\\delta\\phi)$ \u2014 this quantity \u2014 encodes the\
    \ spatial phase distribution of the electrostatic perturbation for toroidal mode\
    \ number $n$.\n\nLinear MHD or extended-MHD stability solvers compute $\\delta\\\
    phi$ as part of the eigenmode solution for a specified $n$; the overall complex\
    \ normalization is fixed by the solver's phase convention, so the imaginary part\
    \ carries physical meaning only in conjunction with the real part. The same complex\
    \ decomposition pattern applies to [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part)\
    \ and [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part)\
    \ within the complete set of MHD perturbation eigenfunctions for the same eigenmode."
  unit: V
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_electrostatic_potential_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_imaginary_part
  arguments:
  - name: perturbed_electrostatic_potential
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed/imaginary
    status: composed
- name: perturbed_electrostatic_potential_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order electrostatic potential perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The perturbed electrostatic potential $\delta\hat{\phi}$ is a complex
    spatial eigenfunction in linear MHD stability analysis, representing the scalar
    potential part of the first-order electric field perturbation $\delta\mathbf{E}
    = -\nabla\delta\phi - \partial_t\delta\mathbf{A}$ for a single toroidal Fourier
    mode number $n$. This quantity is the real part $\mathrm{Re}(\delta\hat{\phi})$,
    encoding the in-phase component of the eigenfunction in the poloidal plane defined
    by the $(R, Z)$ coordinates of the right-handed cylindrical $(R, \phi, Z)$ frame.


    The complex eigenfunction is fully specified by combining this quantity with [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part):


    $$

    \delta\hat{\phi}(R,Z) = \mathrm{Re}(\delta\hat{\phi}) + i\,\mathrm{Im}(\delta\hat{\phi})

    $$


    where the physical perturbation field at toroidal angle $\phi$ is recovered as
    $\mathrm{Re}[\delta\hat{\phi}(R,Z)\,e^{in\phi}]$, and $n$ is the toroidal mode
    number.


    The absolute amplitude and phase of the eigenfunction depend on the normalization
    convention adopted by the linear stability solver; only relative amplitudes among
    simultaneously computed perturbation quantities carry physical meaning. The analogous
    real-part components in the same eigenfunction family include [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part),
    all resolved on the same poloidal plane for a given toroidal mode.'
  unit: V
  physics_domain: magnetohydrodynamics
