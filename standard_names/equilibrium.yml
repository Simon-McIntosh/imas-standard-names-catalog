- name: safety_factor_at_normalized_poloidal_magnetic_flux_equal_to_0_95
  kind: scalar
  status: active
  description: Signed field-line winding number on the closed magnetic flux surface
    labeled by normalized poloidal magnetic flux 0.95, near but inside the plasma
    boundary.
  documentation: 'This quantity is the signed field-line winding number on the closed
    magnetic flux surface labeled by normalized poloidal magnetic flux 0.95. It gives
    the toroidal transits per complete poloidal circuit on that specific surface.


    The locus-specific evaluation is


    $$

    q_{95}=q(\psi_N=0.95)

    $$


    where $q_{95}$ is the safety factor at the specified locus, $q$ is the [safety
    factor](name:safety_factor), and $\psi_N$ is the normalized poloidal magnetic-flux
    coordinate. The value 0.95 selects the surface at 95% of the normalized poloidal-flux
    interval, with the magnetic axis and plasma boundary serving as the inner and
    outer reference surfaces.


    The quantity applies only to that single closed flux surface. It is a scalar flux-surface
    value, with no summation, integration, or averaging over neighboring surfaces.
    It is distinct from the [safety factor at the magnetic axis](name:safety_factor_at_magnetic_axis)
    and the [safety factor at the plasma boundary](name:safety_factor_at_plasma_boundary),
    which use different evaluation loci.


    Thus, this quantity is the normalized-poloidal-flux-locus specialization of the
    parent [safety factor](name:safety_factor); the field-line winding definition
    is unchanged, and only the evaluation surface differs. The right-handed cylindrical
    $(R,\phi,Z)$ frame has $R$ as major radius, $\phi$ as toroidal angle, and $Z$
    as vertical height.


    Sign convention: Positive when the signed toroidal and poloidal magnetic-flux
    increments defining the field-line winding ratio have the same sign in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: equilibrium
