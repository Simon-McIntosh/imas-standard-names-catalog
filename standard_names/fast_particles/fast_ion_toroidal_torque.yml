name: fast_ion_toroidal_torque
status: draft
description: Total toroidal torque exerted on the plasma by the supra-thermal (fast)
  ion population, integrated over the plasma volume.
documentation: "The toroidal torque due to fast ions $\\tau_\\phi^{\\rm fi}$ (in N\xB7\
  m) quantifies the net rate of toroidal angular momentum transfer from the fast-ion\
  \ distribution to the bulk plasma. It encompasses contributions from $\\mathbf{j}_{\\\
  rm fi} \\times \\mathbf{B}$ forces, collisional drag on thermal species, and any\
  \ anisotropic pressure effects, summed over the entire plasma volume. In neutral-beam-heated\
  \ discharges, this torque is the dominant external momentum input and typically\
  \ ranges from 0.5 to 10 N\xB7m depending on beam energy, geometry, and injection\
  \ angle. It is computed by codes such as NUBEAM, ASCOT, or TRANSP that follow fast-ion\
  \ orbits in the equilibrium magnetic field and accumulate the collisional and electromagnetic\
  \ momentum exchange. Positive $\\tau_\\phi^{\\rm fi}$ corresponds to torque in the\
  \ co-current toroidal direction. See also the volumetric density counterpart `fast_particle_angular_momentum_toroidal_source`\
  \ and the collisional channel `fast_ion_collisional_toroidal_torque_density_due_to_collisions`."
