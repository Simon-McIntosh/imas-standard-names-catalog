    status: composed
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: draft
  description: The safety factor q evaluated at the magnetic axis, equal to the ratio
    of toroidal to poloidal field-line turns at the innermost flux surface. It is
    the limiting value of the q profile as the minor radius approaches zero, and is
    a key parameter governing the stability of the plasma core.
  documentation: "The safety factor at the magnetic axis, $q_0$, is the value of the\
    \ safety factor profile $q(\\rho)$ taken in the limit $\\rho \\to 0$, where $\\\
    rho$ is the effective minor-radius-like radial coordinate labeling nested flux\
    \ surfaces. Because flux surfaces degenerate to a single point (the magnetic axis)\
    \ at $\\rho = 0$, the value $q_0$ is obtained as a well-defined limit of the ratio\n\
    \n$$q_0 = \\lim_{\\rho \\to 0} q(\\rho) = \\lim_{\\rho \\to 0} \\frac{d\\Phi}{d\\\
    Psi}$$\n\nwhere $\\Phi$ is the toroidal magnetic flux and $\\Psi$ is the poloidal\
    \ magnetic flux enclosed within a flux surface. This definition is equivalent\
    \ to counting the number of toroidal transits a field line completes per poloidal\
    \ revolution at the axis, and is consistent with the definition used throughout\
    \ the $q(\\rho)$ profile family.\n\nIn the neighborhood of the magnetic axis,\
    \ assuming circular cross-section and a locally uniform current density $j_0 \\\
    equiv j_\\phi(0)$ on axis, $q_0$ is well approximated by\n\n$$q_0 \\approx \\\
    frac{2 B_0}{\\mu_0 R_0 j_0}$$\n\nwhere $B_0$ is the on-axis toroidal field in\
    \ tesla, $R_0$ is the major radius of the magnetic axis in meters, $j_0$ is the\
    \ toroidal current density at the axis in $\\mathrm{A\\,m^{-2}}$, and $\\mu_0\
    \ = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$. This expression follows from\
    \ Ampere's law applied locally near the axis and is exact in the small-$\\rho$\
    \ limit.\n\nTypically $q_0 \\approx 0.8$\u2013$1.2$ in standard H-mode tokamak\
    \ discharges; advanced scenarios with reversed shear may exhibit $q_0 > 1.5$,\
    \ while sawtoothing discharges are associated with $q_0$ near or slightly above\
    \ unity. Disruptions are related to $q_0$ dropping below rational values such\
    \ as $1$ or $2$.\n\nSign convention: Positive when the toroidal magnetic field\
    \ component points in the direction of increasing toroidal angle $\\phi$ and the\
    \ plasma current flows in the same direction, so that $d\\Phi/d\\Psi > 0$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor
