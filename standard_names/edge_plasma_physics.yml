- name: radial_electron_convection_velocity
  kind: scalar
  status: active
  description: Radial component of the effective electron particle convection velocity,
    the advective coefficient multiplying electron density in a radial particle-transport
    flux law.
  documentation: 'Radial electron convection velocity is the effective advective velocity
    component for electron particle transport in the radial direction of a flux coordinate
    system $(\rho, \theta, \phi)$. It is a transport coefficient rather than necessarily
    the microscopic electron fluid velocity, representing directed electron particle
    transport after diffusive density-gradient transport is separated.


    The radial electron particle flux is decomposed into diffusive and convective
    contributions:


    $$

    \Gamma_{e,\rho} = -D_{e,\rho}\frac{1}{h_\rho}\frac{\partial n_e}{\partial \rho}
    + n_e v_{e,\rho}^{\mathrm{conv}}

    $$


    where $\Gamma_{e,\rho}$ is the radial electron particle flux, $D_{e,\rho}$ is
    the radial electron particle diffusivity, $n_e$ is electron number density, $v_{e,\rho}^{\mathrm{conv}}$
    is the radial electron convection velocity, $\rho$ is the radial flux coordinate,
    and $h_\rho$ converts variation in $\rho$ into physical distance. This component
    specializes the effective [electron convection velocity] and complements the [poloidal
    electron convection velocity](name:poloidal_electron_convection_velocity); its
    species contrast is the [radial ion convection velocity](name:radial_ion_convection_velocity).


    Sign convention: Positive when electron particle convection is directed toward
    increasing radial flux coordinate $\rho$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_electron_convection_velocity
  - name:radial_ion_convection_velocity
  sources:
