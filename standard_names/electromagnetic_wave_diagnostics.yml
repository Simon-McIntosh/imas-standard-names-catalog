      unit: s
    enhanced_context:
      description: Duration of a single frequency sweep of the fluctuation reflectometer
        channel. Sets the temporal resolution of the swept-frequency measurement,
        determining the trade-off between spectral coverage and time resolution.
      kind: llm
- name: length_of_electron_cyclotron_beam
  kind: scalar
  status: active
  description: Curvilinear distance measured along an electron-cyclotron beam-tracing
    ray, providing the propagation coordinate from its launch point to the evaluated
    point.
  documentation: 'This quantity is the cumulative arclength along an electron-cyclotron
    beam-tracing ray from its launch point to a specified point on the propagation
    path. It parameterizes the ray independently of the arbitrary parameter used to
    trace it.


    The arclength is defined by


    $$

    s(\lambda)=\int_{\lambda_0}^{\lambda}\left\lvert\frac{d\mathbf{r}}{d\lambda''}\right\rvert\,d\lambda''

    $$


    where $\mathbf{r}(\lambda'')$ is the ray position in the right-handed cylindrical
    $(R, \phi, Z)$ frame, $\lambda''$ is an arbitrary path parameter, and $\lambda_0$
    denotes the launch point. The arclength is non-negative and increases in the chosen
    propagation direction. It is a local path coordinate; the complete trajectory
    length represented by [length of beam-tracing beam](name:length_of_beam_tracing_beam)
    is a distinct endpoint quantity.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:length_of_beam_tracing_beam
  sources:
  - dd_path: ece/channel/beam_tracing/beam/length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ece.html#ece-channel-beam_tracing-beam-length
    dd_documentation:
      leaf: Ray/beam curvilinear length
      parent_path: ece/channel/beam_tracing/beam
      parent: Set of rays/beams describing the wave propagation
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: Curvilinear arc length along the ray or beam path in ECE beam-tracing
        calculations. Parameterizes the propagation distance from the launcher to
        the emission or absorption region along the beam trajectory.
      kind: llm
- name: length_of_fiber_optic_current_sensor
  kind: scalar
  status: active
  description: Total physical arclength of the optical fiber centerline in a fiber-optic
    current sensor, defining its optical propagation distance and distributed magneto-optic
    interaction length.
  documentation: 'This quantity is the total arclength of the optical fiber centerline
    forming the fiber-optic current sensor. It includes the complete winding path
    and is not the straight-line distance between endpoints or the length of the sensor
    outline.


    For a centerline parameterized by an arbitrary parameter $u$, the fiber length
    is defined by


    $$

    L = \int_{u_0}^{u_1} \left|\frac{d\mathbf{r}}{du}\right|\,du

    $$


    where $L$ is the total fiber arclength, $\mathbf{r}(u)$ is the centerline position,
    and $u_0$ and $u_1$ delimit the fiber path. The length sets the optical propagation
    distance; accumulated Faraday rotation additionally depends on the magnetic-field
    projection along the winding and the [Verdet constant](name:verdet_constant_of_fiber_optic_current_sensor).'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:verdet_constant_of_fiber_optic_current_sensor
  sources:
  - dd_path: focs/fibre_length
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/focs.html#focs-fibre_length
    dd_documentation:
      leaf: Spun fibre length on the vacuum vessel
      data_type: FLT_0D
      unit: m
    enhanced_context:
