    enhanced_context:
      description: X coordinate of centroid.
      kind: template
- name: z_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the geometric centroid of a ferritic element\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, where Z increases upward\
    \ from the machine midplane."
  documentation: 'The vertical coordinate $Z_\mathrm{cent}$ specifies the height of
    the geometric centroid of a ferritic element along the $Z$-axis of the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is the major radius from the symmetry
    axis, $\phi$ is the toroidal angle increasing counter-clockwise when viewed from
    above $+\hat{Z}$, and $Z$ is the vertical height measured from the machine midplane.


    Ferritic elements are passive ferromagnetic components installed in some tokamak
    configurations to reduce toroidal magnetic field ripple generated by discrete
    toroidal field coils. The centroid position serves as the representative reference
    point for each element in electromagnetic field models that compute the perturbed
    equilibrium field arising from the ferromagnetic material. Together with [radial_coordinate_of_ferritic_element_centroid](name:radial_coordinate_of_ferritic_element_centroid),
    this coordinate fully determines the axisymmetric centroid location in the poloidal
    $(R, Z)$ plane.


    For configurations requiring the full three-dimensional centroid location, the
    Cartesian counterparts [x_coordinate_of_ferritic_element_centroid](name:x_coordinate_of_ferritic_element_centroid)
    and [y_coordinate_of_ferritic_element_centroid](name:y_coordinate_of_ferritic_element_centroid)
    provide the transverse displacement when the element''s toroidal position is also
    needed. Centroid coordinates are derived from the engineering design geometry
    of the device and used as inputs to equilibrium reconstruction and ripple-compensation
    analyzes.


    Sign convention: Positive when the centroid lies above the machine midplane in
    the $+Z$ direction.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_coordinate_of_ferritic_element_centroid
  - name:x_coordinate_of_ferritic_element_centroid
  - name:y_coordinate_of_ferritic_element_centroid
  sources:
  - dd_path: ferritic/object/centroid/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ferritic.html#ferritic-object-centroid-z
    dd_documentation:
      leaf: List of Z coordinates
      parent_path: ferritic/object/centroid
      parent: List of positions of the centroids, in Cartesian coordinates
      data_type: FLT_1D
      unit: m
      coordinates:
      - ferritic/object/centroid/x
    enhanced_context:
      description: Vertical (Z) coordinate of centroid.
      kind: template
- name: vacuum_magnetic_vector_potential
  kind: vector
  status: active
  description: Gage-dependent vacuum magnetic vector potential generated by external
    current sources; its curl gives the magnetic induction when plasma-current contributions
    are excluded.
  documentation: 'The vacuum magnetic vector potential is a gage-dependent vector
    field representing the external-source contribution to the [magnetic vector potential](name:magnetic_vector_potential).
    It excludes the contribution generated by plasma currents while retaining the
    gage dependence of the full potential.


    The defining relation between this potential and the corresponding vacuum magnetic
    induction is:


    $$

    \mathbf{B}_{\mathrm{vac}} = \nabla \times \mathbf{A}_{\mathrm{vac}}

    $$


    where $\mathbf{A}_{\mathrm{vac}}$ is the vacuum magnetic vector potential, $\mathbf{B}_{\mathrm{vac}}$
    is the magnetic induction produced by the external sources alone, and $\nabla
    \times$ is the curl operator. Replacing $\mathbf{A}_{\mathrm{vac}}$ by $\mathbf{A}_{\mathrm{vac}}
    + \nabla \chi$, where $\chi$ is an arbitrary scalar gage function, leaves $\mathbf{B}_{\mathrm{vac}}$
    unchanged.


    The vector may be resolved into components in the right-handed cylindrical $(R,
    \phi, Z)$ frame. Its radial and vertical projections are represented by the [radial
    vacuum magnetic vector potential](name:radial_vacuum_magnetic_vector_potential)
    and [vertical vacuum magnetic vector potential](name:vertical_vacuum_magnetic_vector_potential),
    respectively.


    Sign convention: Positive when a component of the vector points along its corresponding
    positive basis direction in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:magnetic_vector_potential
  - name:radial_vacuum_magnetic_vector_potential
  - name:vertical_vacuum_magnetic_vector_potential
  arguments:
  - name: magnetic_vector_potential
    operator: vacuum
    operator_kind: qualifier
- name: radial_vacuum_magnetic_vector_potential
  kind: scalar
  status: active
  description: "Radial (R) component of the vacuum magnetic vector potential produced\
    \ by toroidal-field coil currents, evaluated in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The radial component $A_R$ of the vacuum magnetic vector potential
    is the projection of $\mathbf{A}_\mathrm{vac}$ onto the major-radius direction
    $\hat{R}$ in the right-handed cylindrical $(R, \phi, Z)$ frame. It represents
    the $R$-directed contribution of the vector field generated exclusively by toroidal-field
    coil conductor currents in the absence of any plasma contribution, forming part
    of the complete [vacuum magnetic vector potential](name:vacuum_magnetic_vector_potential)
    vector $(A_R, A_\phi, A_Z)$.


    The vacuum magnetic field is related to the vector potential by $\mathbf{B}_\mathrm{vac}
    = \nabla \times \mathbf{A}_\mathrm{vac}$, so the poloidal field components follow
    from the cylindrical curl of $(A_R, A_\phi, A_Z)$. Because only $\nabla \times
    \mathbf{A}_\mathrm{vac}$ is gage-invariant, $A_R$ individually depends on the
    chosen gage; the Coulomb gage $\nabla \cdot \mathbf{A} = 0$ is standard for static
    TF coil computations.


    This component is calculated numerically via Biot-Savart integration over the
    TF coil conductor geometry and current distribution, and is used in equilibrium
    reconstruction and MHD stability analysis on both structured and unstructured
    spatial grids. The complementary vertical component is provided by [vertical_vacuum_magnetic_vector_potential](name:vertical_vacuum_magnetic_vector_potential),
    while the analogous quantity incorporating full plasma and coil contributions
    is [radial_magnetic_vector_potential](name:radial_magnetic_vector_potential).


    Sign convention: Positive when $A_R$ points in the direction of increasing major
    radius $R$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:vacuum_magnetic_vector_potential
  - name:vertical_vacuum_magnetic_vector_potential
  - name:radial_magnetic_vector_potential
  arguments:
  - name: vacuum_magnetic_vector_potential
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
  sources:
  - dd_path: tf/field_map/a_field_r/values
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-field_map-a_field_r-values
    dd_documentation:
      leaf: One scalar value is provided per element in the grid subset.
      parent_path: tf/field_map/a_field_r
      parent: R component of the vacuum vector potential, given on various grid subsets
      data_type: FLT_1D
      unit: T.m
      coordinates:
      - 1...N
    enhanced_context:
      description: Array of values for a field r.
      kind: template
- name: vertical_vacuum_magnetic_vector_potential
  kind: scalar
  status: active
  description: "Vertical (Z) component of the vacuum magnetic vector potential produced\
    \ solely by toroidal-field coil currents in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The vertical component $A_Z$ of the vacuum magnetic vector potential
    is the projection of $\mathbf{A}_\mathrm{vac}$ onto the vertical direction $\hat{Z}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It represents the $Z$-directed
    contribution of the vector field generated exclusively by toroidal-field coil
    currents in the absence of plasma and eddy-current contributions, forming part
    of the complete [vacuum magnetic vector potential](name:vacuum_magnetic_vector_potential)
    vector $(A_R, A_\phi, A_Z)$.


    The vacuum magnetic field is related to the vector potential by


    $$

    \mathbf{B}_\mathrm{vac} = \nabla \times \mathbf{A}_\mathrm{vac}

    $$


    where $\mathbf{B}_\mathrm{vac}$ is the vacuum magnetic field, $\mathbf{A}_\mathrm{vac}$
    is the vacuum magnetic vector potential, and $\nabla \times$ is the curl operator.
    The curl is gage-invariant, whereas $A_Z$ depends on the selected gage and is
    not itself a magnetic-field component. The complementary radial component is [radial_vacuum_magnetic_vector_potential](name:radial_vacuum_magnetic_vector_potential);
    unlike [vertical_magnetic_vector_potential](name:vertical_magnetic_vector_potential),
    this quantity excludes plasma and eddy-current contributions.


    Sign convention: Positive when $A_Z$ points in the direction of increasing vertical
    height $Z$.'
  unit: T.m
  physics_domain: magnetic_field_systems
  links:
  - name:vacuum_magnetic_vector_potential
  - name:radial_vacuum_magnetic_vector_potential
  - name:vertical_magnetic_vector_potential
  arguments:
  - name: vacuum_magnetic_vector_potential
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
