- name: radius_of_antenna_strap
  kind: scalar
  status: draft
  description: A radial distance from the symmetry axis of an ICRH antenna strap conductor
    to one of its cylindrical boundary surfaces, encompassing both the inner and outer
    conductor radii of an annular cross-section.
  documentation: 'The radius of an antenna strap is a geometric length characterizing
    the cylindrical cross-sectional profile of an ion cyclotron range-of-frequencies
    (ICRH) antenna strap conductor, measured from the conductor''s symmetry axis to
    a specified boundary surface. For an annular conductor cross-section, two distinct
    radii are physically relevant and independently defined: the [inner radius](name:inner_radius_of_antenna_strap),
    bounding the hollow interior of the conductor, and the [outer radius](name:outer_radius_of_antenna_strap),
    at the outer conductor wall.


    These radial dimensions are geometric input parameters for electromagnetic and
    mechanical modeling of the ICRH antenna assembly. The conductor wall thickness
    equals the difference between the outer and inner radii, and together with the
    [width](name:width_of_antenna_strap) and [thickness](name:thickness_of_antenna_strap)
    of the strap, the radial boundary values fully specify the cross-sectional geometry
    used in RF coupling calculations and thermal-mechanical stress analyzes. At typical
    ICRH frequencies, skin-depth effects confine RF current to a thin surface layer,
    making the precise radial boundaries relevant to the strap''s distributed resistance
    and inductance.


    Sign convention: Positive when the radial distance is measured outward from the
    conductor symmetry axis.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:inner_radius_of_antenna_strap
  - name:outer_radius_of_antenna_strap
  - name:width_of_antenna_strap
  - name:thickness_of_antenna_strap
- name: inner_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Inner radius of the annular cross-section of an ICRH antenna strap,
    measured from the strap conductor axis to the inner cylindrical boundary of the
    conductor.
  documentation: 'Inner radius of an antenna strap is the radial distance from the
    local strap conductor axis to the inner cylindrical surface of an annular strap
    cross-section. It applies to hollow or tubular ICRH strap conductors; straps with
    solid rectangular or otherwise non-annular cross-sections do not have this quantity.
    In a strap-local right-handed cylindrical $(r_s, \varphi_s, z_s)$ frame, $z_s$
    follows the strap centerline or long current-carrying direction and $r_s$ is measured
    perpendicular to that axis.


    The inner radius is the distance from the strap axis to the inner wall of the
    annulus:


    $$

    r_\mathrm{inner} = \left|\mathbf{x}_\perp - \mathbf{x}_\mathrm{axis}\right|

    $$


    where $\mathbf{x}_\perp$ is a point on the inner cylindrical boundary in a cross-section
    normal to the strap axis, $\mathbf{x}_\mathrm{axis}$ is the corresponding point
    on the strap centerline, and both positions are expressed in meters.


    This quantity is obtained from antenna mechanical design, CAD geometry, or direct
    metrology of the conductor cross-section. Together with [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap),
    it determines the annular conducting area, $A = \pi(r_\mathrm{outer}^2-r_\mathrm{inner}^2)$,
    and the wall thickness, $r_\mathrm{outer}-r_\mathrm{inner}$, which are important
    for cooling-channel design, RF current distribution, and impedance modeling at
    ion-cyclotron frequencies.


    Typical ICRH tubular copper strap inner radii are about 0.005-0.03 m, depending
    on RF power, cooling requirements, and mechanical constraints. Larger high-power
    antenna conductors may use somewhat larger inner radii to reduce hydraulic resistance
    and thermal loading.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:outer_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:width_of_antenna_strap
  arguments:
  - name: radius_of_antenna_strap
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_inner
    status: composed
- name: outer_radius_of_antenna_strap
  kind: scalar
  status: draft
  description: Outer radial boundary of the annular cross-section of an ICRH antenna
    strap conductor, defining the larger of the two radii that bound the conductor
    annulus.
  documentation: 'The outer radius of an ICRH antenna strap is the radial distance
    from the central axis of the strap conductor to the outer cylindrical surface
    of the annular cross-section. It marks the external boundary of the conductor
    material and, together with the [inner radius](name:inner_radius_of_antenna_strap),
    fully specifies the radial extent of the annular conductor.


    For an annular cross-section, the radial conductor wall thickness follows $\Delta
    r = r_\mathrm{out} - r_\mathrm{in}$, where $r_\mathrm{out}$ is the outer radius
    and $r_\mathrm{in}$ is the inner radius. The nominal centerline radius reported
    by [radius_of_antenna_strap](name:radius_of_antenna_strap) is the mean $(r_\mathrm{out}
    + r_\mathrm{in})/2$.


    This geometric parameter enters electromagnetic wave-coupling calculations and
    RF impedance modeling for ion cyclotron resonance heating systems. Together with
    the [width](name:width_of_antenna_strap), [height](name:height_of_antenna_strap),
    and [thickness](name:thickness_of_antenna_strap) of the conductor, it provides
    the complete geometric description needed for antenna strap simulations.


    Sign convention: Positive when measured radially outward from the strap conductor
    axis.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:inner_radius_of_antenna_strap
  - name:radius_of_antenna_strap
  - name:width_of_antenna_strap
  - name:height_of_antenna_strap
  - name:thickness_of_antenna_strap
  arguments:
  - name: radius_of_antenna_strap
    operator: outer
    operator_kind: qualifier
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/radius_outer
    status: composed
- name: thermal_electron_power
  kind: scalar
  status: draft
  description: Thermal electron power is the total coherent-wave power absorbed by
    the bulk thermal electron population, integrated over the plasma volume. It excludes
    power deposited in fast electrons, ions, or other channels.
  documentation: 'Thermal electron power is the volume-integrated rate at which a
    coherent electromagnetic wave transfers energy to the bulk thermal electron population.
    It represents the thermal-electron heating channel of wave absorption and excludes
    absorption assigned to fast electrons, ions, or other particle populations.


    The quantity is defined as the volume integral of the local thermal-electron wave
    power density:


    $$

    P_{e,\mathrm{th}} = \int_V p_{e,\mathrm{th}}(\mathbf{x}) \, dV

    $$


    where $P_{e,\mathrm{th}}$ is the total thermal electron power in W, $p_{e,\mathrm{th}}$
    is the local power density in W m$^{-3}$, $\mathbf{x}$ is position in m, $dV$
    is the volume element in m$^3$, and $V$ is the plasma volume over which absorption
    is evaluated.


    In practice this power is inferred from wave-heating power balance, electron energy
    balance, heating modulation, or wave-absorption calculations constrained by launched
    power, transmission, reflection, and measured plasma conditions. It is a channel-resolved
    absorbed power, so consistency with the total absorbed wave power requires summing
    over all absorbing populations and accounting for unabsorbed or lost wave power.


    Typical values range from near 0 W when thermal-electron absorption is weak to
    10^4-10^7 W in many wave-heated tokamak plasmas, with values of several 10^7 W
    possible in high-power heating scenarios. The value depends on launched wave power,
    coupling efficiency, wave frequency, plasma density and temperature, magnetic
    configuration, and competing absorption by ions or fast particles.


    Sign convention: Positive when the coherent wave transfers net energy to the bulk
    thermal electron population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power
  - name:absorbed_power
  - name:thermal_electron_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_electron_power
  - name:fast_electron_power
  arguments:
  - name: electron_power
    operator: thermal
    operator_kind: qualifier
  sources:
