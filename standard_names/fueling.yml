- name: injected_gas_species_molar_fraction
  kind: scalar
  status: draft
  description: Molar fraction of a specific gas species in a multi-component injected
    gas mixture, defined as the ratio of the number of molecules of that species to
    the total number of molecules in the mixture.
  documentation: 'The molar fraction $x_s$ of species $s$ in an injected gas mixture
    is defined as $x_s = N_s / \sum_i N_i$, where $N_s$ is the number of molecules
    of species $s$ and the sum runs over all species $i$ in the mixture. By definition,
    $\sum_s x_s = 1$ for a complete species inventory, making this a dimensionless
    quantity bounded on $[0, 1]$. In fusion devices, gas injection systems deliver
    mixtures of fueling species (e.g., deuterium, tritium, helium, neon, argon) for
    plasma fueling, impurity seeding, or radiative cooling; the molar fraction specifies
    the stoichiometric composition of the mixture at the injection point. This quantity
    governs the partial pressures delivered to the plasma and is used as input to
    transport and fuel-cycle models. The [element atoms per molecule](name:element_atoms_per_molecule)
    quantity provides complementary stoichiometric data at the molecular level.


    Sign convention: Positive when the species molar fraction is nonzero, i.e., when
    the species is present in the mixture.'
  unit: '1'
  physics_domain: fueling
  links:
  - name:element_atoms_per_molecule
  constraints: []
  sources:
  - id: dd:gas_injection/pipe/valve/species/fraction
    dd_path: gas_injection/pipe/valve/species/fraction
    status: composed
- name: minimum_gas_valve_flow_rate
  kind: scalar
  status: draft
  description: Lower operational bound on the throughput of a gas injection valve,
    below which the valve cannot reliably control gas flow into the plasma vessel.
  documentation: "The minimum gas valve flow rate sets the lower limit of the controllable\
    \ throughput range for a gas injection valve, expressed as a pressure\u2013volume\
    \ flow $\\dot{Q}_{\\min}$ with dimensions of Pa\xB7m\xB3\xB7s\u207B\xB9. Physical\
    \ constraints such as valve seat geometry, pressure differentials, and actuator\
    \ resolution determine this bound; operating below it risks uncontrolled flow\
    \ or valve instability. In tokamak fueling and impurity seeding systems, this\
    \ parameter is used by the plasma control system to enforce a feasible command\
    \ range and to schedule gas pulses accurately. Typical values depend strongly\
    \ on valve design and gas species: piezoelectric and solenoid valves used for\
    \ deuterium fueling may have minimum flow rates of order $10^{-3}$\u2013$10^{-1}$\
    \ Pa\xB7m\xB3\xB7s\u207B\xB9, while smaller valves for trace impurity injection\
    \ can be one to two orders of magnitude lower. This quantity is the lower-bound\
    \ companion of [maximum gas valve flow rate](name:maximum_gas_valve_flow_rate),\
    \ and together they define the dynamic range of the valve. For multi-species injection,\
    \ the [injected gas species molar fraction](name:injected_gas_species_molar_fraction)\
    \ further characterizes the composition of the injected gas mixture."
  unit: Pa.m^3.s^-1
  physics_domain: fueling
  links:
  - name:maximum_gas_valve_flow_rate
  - name:injected_gas_species_molar_fraction
  constraints: []
  sources:
  - id: dd:gas_injection/pipe/valve/flow_rate_min
    dd_path: gas_injection/pipe/valve/flow_rate_min
    status: composed
  - id: dd:gas_injection/valve/flow_rate_min
    dd_path: gas_injection/valve/flow_rate_min
    status: composed
- name: toroidal_component_of_shattered_pellet_velocity
  kind: scalar
  status: draft
  description: Projection of the shattered pellet injector (SPI) pellet center-of-mass
    velocity onto the toroidal direction $\hat{\phi}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  documentation: 'The toroidal velocity component $v_\phi$ quantifies how fast the
    SPI pellet''s center-of-mass moves along the toroidal direction $\hat{\phi}$ as
    it travels through the plasma vessel before and during the shattering event. It
    is the $\hat{\phi}$-projection of the full velocity vector described by [shattered_pellet_velocity](name:shattered_pellet_velocity),
    i.e. $v_\phi = \mathbf{v} \cdot \hat{\phi}$, where $\hat{\phi}$ points in the
    direction of increasing toroidal angle $\phi$. In most SPI configurations the
    pellet is injected with predominantly radial or vertical motion and the toroidal
    component is small (typically $|v_\phi| \ll |v_R|$), but finite toroidal injection
    angles are used on some devices to optimize material deposition for disruption
    mitigation. This component is inferred from pellet-tracking diagnostics (e.g.
    fast cameras, pellet-imaging systems) or from the known injector geometry and
    pellet speed measured before shattering; consult [shattered_pellet_speed_before_shattering](name:shattered_pellet_speed_before_shattering)
    for the pre-shattering speed magnitude. The complementary spatial components are
    the major-radius component [radial_component_of_shattered_pellet_velocity](name:radial_component_of_shattered_pellet_velocity)
    and the vertical component [vertical_component_of_shattered_pellet_fragment_cloud_velocity](name:vertical_component_of_shattered_pellet_fragment_cloud_velocity)
    for the post-shattering fragment cloud.


    Sign convention: Positive when $v_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above $+\hat{Z}$).'
  unit: m.s^-1
  physics_domain: fueling
  links:
  - name:shattered_pellet_velocity
  - name:shattered_pellet_speed_before_shattering
  - name:radial_component_of_shattered_pellet_velocity
  - name:vertical_component_of_shattered_pellet_fragment_cloud_velocity
  constraints: []
  arguments:
  - name: shattered_pellet_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:spi/injector/pellet/velocity_tor
    dd_path: spi/injector/pellet/velocity_tor
    status: composed
