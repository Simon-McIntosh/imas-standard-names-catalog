- name: derivative_with_respect_to_toroidal_flux_coordinate_of_area_of_flux_surface
  kind: scalar
  status: active
  description: Rate of change of the poloidal cross-sectional area enclosed by a nested
    magnetic flux surface as the dimensionful toroidal-flux coordinate varies.
  documentation: 'This quantity is the radial rate of change of the poloidal cross-sectional
    area enclosed by a closed magnetic flux surface, parameterized by the dimensionful
    toroidal flux coordinate. It describes how neighboring flux-surface cross sections
    change along that coordinate.


    For a nested family of flux surfaces, it is defined by


    $$

    \frac{dA}{d\rho_{\mathrm{tor}}}

    $$


    where $A(\rho_{\mathrm{tor}})$ is the poloidal cross-sectional area enclosed by
    the flux surface labeled by $\rho_{\mathrm{tor}}$, and $\rho_{\mathrm{tor}}$ is
    the dimensionful toroidal flux coordinate.


    The scope is the enclosed poloidal cross-sectional area of a closed magnetic flux
    surface in an equilibrium, with no averaging or summation over flux surfaces.
    It is a local geometric derivative along the nested-surface family, not the area
    of the three-dimensional toroidal surface.


    This quantity is a derivative specialization of [area of a flux surface]. It is
    distinct from the [derivative with respect to normalized poloidal flux coordinate
    of area of a flux surface](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_area_of_flux_surface),
    which uses a normalized poloidal-flux coordinate, and from the [derivative with
    respect to toroidal flux coordinate of volume of a flux surface](name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface),
    which differentiates enclosed volume rather than cross-sectional area.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:derivative_with_respect_to_toroidal_flux_coordinate_of_volume_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/darea_drho_tor
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-darea_drho_tor
    dd_documentation:
      leaf: Radial derivative of the cross-sectional area of the flux surface with
        respect to rho_tor
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: m
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Radial derivative of the cross-sectional area of a magnetic flux\
        \ surface with respect to the toroidal flux coordinate rho_tor (dA/d\u03C1\
        _tor). Used in flux-surface geometry calculations and transport equation coefficients."
      kind: llm
- name: electron_density
  kind: scalar
  status: active
  description: Free-electron number density per physical volume, with included populations
    and spatial aggregation specified by applicable qualifiers or loci.
  documentation: 'Free-electron number density is the amount of unbound electron population
    occupying a local physical volume. It is the zeroth velocity-space moment of the
    electron distribution.


    For a kinetic description, the defining relation is:


    $$

    n_e(\mathbf{r},t)=\int f_e(\mathbf{r},\mathbf{v},t)\,d^3\mathbf{v}

    $$


    where $n_e$ is the free-electron number density, $\mathbf{r}$ is position, $t$
    is time, $f_e$ is the electron velocity-distribution function, $\mathbf{v}$ is
    electron velocity, and $d^3\mathbf{v}$ is the differential volume element in velocity
    space.


    The unqualified quantity denotes a local physical-volume density without selecting
    a thermal, fast, suprathermal, or complete-population component. Its aggregation
    convention is local rather than line-averaged or volume-averaged; population-qualified
    and spatially aggregated forms are narrower instances of this general electron-density
    concept.


    Bound electrons and ion populations are excluded. The quantity is distinct from
    [thermal electron density](name:thermal_electron_density), which excludes fast
    and suprathermal electrons, and from [total electron density](name:total_electron_density),
    which explicitly combines the specified electron populations.


    The [line-averaged electron density](name:line_averaged_electron_density) is the
    path integral of local electron density divided by the complete chord length,
    while [volume-averaged electron density](name:volume_averaged_electron_density)
    is the corresponding average over the plasma volume. Electron density also provides
    the denominator in the [ratio of total ion density to electron density](name:ratio_of_total_ion_density_to_electron_density).'
  unit: m^-3
  physics_domain: equilibrium
  links:
  - name:thermal_electron_density
  - name:total_electron_density
  - name:line_averaged_electron_density
  - name:volume_averaged_electron_density
  - name:ratio_of_total_ion_density_to_electron_density
