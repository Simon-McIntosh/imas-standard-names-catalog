    enhanced_context:
      description: Wave-driven toroidal current from a standalone calculation, resolved
        per toroidal mode number (n_phi). Represents the toroidal current contribution
        from each phi-mode without self-consistent coupling to other sources.
      kind: llm
  - dd_path: waves/coherent_wave/profiles_1d/current_phi_inside_n_phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-current_phi_inside_n_phi
