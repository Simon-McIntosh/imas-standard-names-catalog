name: radial_mode_number
status: draft
cocos_transformation_type: one_like
description: Integer index counting the radial nodes of an MHD eigenmode perturbation
  across the plasma minor radius.
documentation: "The radial mode number enumerates the number of nodes in the radial\
  \ eigenfunction of an MHD perturbation. For a linear MHD mode characterized by toroidal\
  \ mode number $n_\\phi$ and poloidal mode number $m$, the radial mode number provides\
  \ the additional quantum number needed to distinguish eigenstates sharing the same\
  \ $(m, n_\\phi)$ pair but differing in their radial structure. The fundamental radial\
  \ mode (zero internal nodes) is typically the most unstable and most commonly observed\
  \ experimentally; higher radial mode numbers correspond to finer radial oscillations\
  \ and generally higher stability thresholds. In linear MHD stability codes such\
  \ as MISHKA, CASTOR, and ELITE, eigenvalue solutions are ordered by radial mode\
  \ number at fixed $(m, n_\\phi)$. Experimental identification is performed via soft\
  \ X-ray tomography, ECE imaging, or MHD spectroscopy by fitting the measured perturbation\
  \ profile to computed eigenfunctions. The radial mode number is a non-negative integer,\
  \ typically in the range 0\u20135 for the most experimentally relevant modes. See\
  \ `neoclassical_tearing_mode_poloidal_mode_number` and `neoclassical_tearing_mode_toroidal_mode_number`\
  \ for the poloidal and toroidal mode-number counterparts."
