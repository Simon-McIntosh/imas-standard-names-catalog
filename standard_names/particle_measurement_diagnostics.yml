- name: floating_potential_of_langmuir_probe
  kind: scalar
  status: draft
  description: Electrostatic potential at which the net current collected by a Langmuir
    probe is exactly zero, so that electron and ion currents to the probe surface
    balance. Referenced to machine ground, it lies below the local plasma potential
    by a positive sheath voltage drop whose magnitude depends on plasma species and
    electron temperature.
  documentation: "The floating potential $V_f$ is the probe electrode potential at\
    \ which the total particle current to the probe vanishes:\n\n$$I_\\mathrm{probe}(V_f)\
    \ = I_e(V_f) + I_i(V_f) = 0$$\n\nwhere $I_e$ and $I_i$ are the electron and ion\
    \ current contributions respectively. This zero-current condition is satisfied\
    \ when the repelling sheath has reduced the collected electron current to equal\
    \ the (approximately saturation-level) ion current.\n\nFor a Maxwellian electron\
    \ distribution in a collisionless planar sheath (the regime in which basic probe\
    \ theory applies), the floating potential is related to the local plasma potential\
    \ $V_p$ by\n\n$$V_f = V_p - \\frac{k_B T_e}{2e} \\ln\\!\\left(\\frac{m_i}{2\\\
    pi m_e}\\right)$$\n\nwhere $T_e$ is the electron temperature, $m_i$ the ion mass,\
    \ and $m_e$ the electron mass. This expression is approximate and its precise\
    \ form changes for non-Maxwellian distributions, magnetized sheaths, multi-species\
    \ plasmas, or cylindrical/spherical probe geometries; in general the sheath drop\
    \ is of order several $k_B T_e / e$.\n\nThe quantity is reported in volts referenced\
    \ to machine ground. Typical values in tokamak edge and scrape-off layer plasmas\
    \ range from approximately $-50$ V to $-5$ V with respect to ground, depending\
    \ on electron temperature (commonly $5$\u2013$50$ eV in the SOL) and the local\
    \ machine-ground reference. The sign is negative for standard fusion plasmas because\
    \ the probe must be biased below the plasma potential to repel excess electrons.\n\
    \nSign convention: Positive when the probe electrode is above machine ground.\n\
    \nThe floating potential provides a practical, passive measurement of the local\
    \ electrostatic conditions at the probe tip without requiring an external bias\
    \ supply. It is closely related to the plasma potential but is not identical to\
    \ it; the plasma potential itself must be inferred from the full current-voltage\
    \ characteristic. Multiple Langmuir probe tips distributed poloidally and toroidally\
    \ allow reconstruction of edge potential profiles and fluctuations."
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:electrostatic_potential
  - name:floating_potential
  - name:parallel_component_of_ion_current_density
  constraints: []
  sources:
  - id: dd:langmuir_probes/probe/potential_floating
    dd_path: langmuir_probes/probe/potential_floating
    status: composed
- name: major_radius_of_emission_grid_point
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a point on the emission grid used to
    discretize the neutron detector field-of-view geometry, in the right-handed cylindrical
    $(R, \phi, Z)$ frame.
  documentation: "The major radius $R$ locates an emission grid point in the poloidal\
    \ cross-section of the plasma, where $R$ is the perpendicular distance from the\
    \ machine symmetry axis in the right-handed cylindrical $(R, \\phi, Z)$ frame\
    \ with $R$ in meters. Emission grids are constructed along detector lines of sight\
    \ to discretize the plasma volume contributing to the measured neutron signal;\
    \ each grid point carries a geometric weight proportional to its contribution\
    \ to the detector response. Together with the companion [vertical coordinate](name:vertical_coordinate_of_emission_grid_point),\
    \ this coordinate fully specifies the poloidal position of each grid point. Typical\
    \ values span 1\u201310 m depending on the machine size, covering the full plasma\
    \ cross-section from the inner to the outer wall. For context, [major_radius_of_neutron_detector_reference_point](name:major_radius_of_neutron_detector_reference_point)\
    \ gives the $R$ coordinate of the detector element center, while [major_radius_of_measurement_position](name:major_radius_of_measurement_position)\
    \ serves the analogous role for ECE beam-tracing diagnostics.\n\nSign convention:\
    \ Positive when $R$ is measured outward from the machine symmetry axis in the\
    \ direction of increasing major radius."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_emission_grid_point
  - name:major_radius_of_neutron_detector_reference_point
  - name:major_radius_of_measurement_position
  constraints: []
