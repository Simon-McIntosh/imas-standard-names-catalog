      data_type: FLT_1D
      unit: Wb
      coordinates:
      - disruption/time
    enhanced_context:
      description: "Poloidal magnetic flux (\u03C8) at the boundary of the halo current\
        \ region during a disruption. Defines the flux surface separating the halo\
        \ current domain from the confined plasma region."
      kind: llm
- name: poloidal_mode_number
  kind: scalar
  status: active
  description: Dimensionless integer Fourier harmonic labeling the poloidal periodicity
    of a linear MHD perturbation; coupled poloidal harmonics may form one eigenmode.
  documentation: 'Poloidal mode number is a dimensionless integer Fourier harmonic
    that specifies the variation of a linear MHD perturbation with poloidal angle.
    It is one component of the [mode number](name:mode_number), alongside the toroidal
    mode number and the radial mode number.


    The angular phase of a Fourier component is represented by


    $$

    \delta X(\rho,\theta,\phi) \propto \exp\!\bigl(i(m\theta-n\phi)\bigr)

    $$


    where $\delta X$ is a complex perturbation amplitude, $m$ is the poloidal mode
    number, $n$ is the toroidal mode number, and $(\rho,\theta,\phi)$ are flux coordinates.
    The angle $\phi$ is the toroidal angle in the right-handed cylindrical $(R,\phi,Z)$
    frame, with $R$ the major radius and $Z$ the vertical height.


    A single eigenmode can contain several coupled poloidal harmonics; this quantity
    identifies one harmonic rather than the complete mode vector. Its radial branch
    is identified separately by the [radial mode number](name:radial_mode_number).


    Sign convention: Positive when the perturbation phase advances as the poloidal
    angle $\theta$ increases.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:radial_mode_number
