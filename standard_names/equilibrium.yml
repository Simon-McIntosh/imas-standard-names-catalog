- name: radial_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the magnetic-field vector along increasing major radius
    in the cylindrical R, phi, Z frame, capturing the radial part of the poloidal
    field.
  documentation: 'The radial magnetic field is the component of the full [magnetic
    field](name:magnetic_field) directed along the major-radius coordinate in the
    right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is distance from the
    toroidal symmetry axis, $\phi$ is toroidal angle, and $Z$ is vertical height.
    Together with the [vertical magnetic field](name:vertical_magnetic_field), it
    forms the poloidal-plane field whose magnitude is represented by the [poloidal
    magnetic field](name:poloidal_magnetic_field), while the [toroidal magnetic field](name:toroidal_magnetic_field)
    is the orthogonal toroidal component.


    The defining projection is


    $$

    B_R = \mathbf{B} \cdot \hat{R}

    $$


    where $\mathbf{B}$ is the magnetic-field vector and $\hat{R}$ is the unit vector
    in the direction of increasing major radius. In axisymmetric equilibrium calculations,
    $B_R$ is also obtained from gradients of the poloidal magnetic flux, so it is
    sensitive to vertical variation of flux surfaces.


    This component is inferred from equilibrium reconstruction constrained by external
    magnetic probes, flux loops, motional-Stark-effect measurements, and polarimetry.
    Representative absolute values in tokamak equilibria range from near zero at symmetry
    locations to 0.01-0.5 T in shaped plasmas, generally smaller than the toroidal
    field but essential for determining flux-surface geometry and magnetic shear.


    Sign convention: Positive when the magnetic-field vector points toward increasing
    major radius $R$, away from the toroidal symmetry axis.'
  unit: T
  physics_domain: equilibrium
  links:
