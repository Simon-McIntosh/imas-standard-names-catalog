- name: poloidal_angle_at_plasma_boundary_gap_reference_point
  kind: scalar
  status: active
  description: "Poloidal angle of a plasma-boundary-gap reference point in the poloidal\
    \ cross-section of the right-handed cylindrical (R, \u03C6, Z) frame, measured\
    \ clockwise from the outward radial direction about the magnetic axis."
  documentation: 'The poloidal angle of a plasma-boundary-gap reference point is the
    angular coordinate of that point about the magnetic axis in a poloidal cross-section
    of the right-handed cylindrical $(R,phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. It locates the reference
    point used to define the [gap at plasma boundary](name:gap_at_plasma_boundary),
    using the geometric convention of [poloidal angle](name:poloidal_angle).


    For reference-point coordinates $(R_\mathrm{g},Z_\mathrm{g})$ and magnetic-axis
    coordinates $(R_\mathrm{ax},Z_\mathrm{ax})$, the angle is


    $$

    \theta_\mathrm{g}=\operatorname{atan2}(Z_\mathrm{ax}-Z_\mathrm{g},\,R_\mathrm{g}-R_\mathrm{ax})\pmod{2\pi}

    $$


    where $R_\mathrm{g}$ and $R_\mathrm{ax}$ are major radii in meters, $Z_\mathrm{g}$
    and $Z_\mathrm{ax}$ are vertical heights in meters, and $\operatorname{atan2}$
    returns a quadrant-resolved angle. The reference point is distinct from the boundary
    itself and from the gap distance; [poloidal angle of a measurement position](name:poloidal_angle_of_measurement_position)
    applies the same construction to a measurement location.


    Sign convention: Positive when the reference point lies clockwise from the outward
    $+R$ direction when viewed from the $+\phi$ direction.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:gap_at_plasma_boundary
  - name:poloidal_angle_of_measurement_position
  sources:
  - dd_path: pulse_schedule/position_control/gap/angle
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pulse_schedule.html#pulse_schedule-position_control-gap-angle
    dd_documentation:
      leaf: 'Angle between the direction in which the gap is measured (in the poloidal
        cross-section) and the horizontal axis. '
      parent_path: pulse_schedule/position_control/gap
      parent: Set of gaps, defined by a reference point and a direction.
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: Angle of the plasma boundary gap direction measured clockwise from
        the radial (grad R) direction in the poloidal cross-section. Defines the orientation
        of the gap vector used as a reference in plasma position control.
      kind: llm
- name: poloidal_angle_of_flux_surface
  kind: scalar
  status: active
  description: "Poloidal angle of a flux-surface point in the poloidal cross-section\
    \ of the right-handed cylindrical (R, \u03C6, Z) frame, measured clockwise from\
    \ the outward radial direction about the magnetic axis."
  documentation: 'The poloidal angle of a flux-surface point is the angular coordinate
    of that point about the magnetic axis in a poloidal cross-section of the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. It parameterizes points on a surface of constant
    poloidal magnetic flux and is the flux-surface form of [poloidal angle](name:poloidal_angle).


    For a surface point with coordinates $(R,Z)$ and magnetic-axis coordinates $(R_\mathrm{ax},Z_\mathrm{ax})$,
    the angle is


    $$

    \theta=\operatorname{atan2}(Z_\mathrm{ax}-Z,\,R-R_\mathrm{ax})\pmod{2\pi}

    $$


    where $\operatorname{atan2}$ returns the quadrant-resolved angle. The flux surface
    identifies the set of valid points, but does not define one unique angle; each
    point has its own value. Unlike [poloidal angle of a measurement position](name:poloidal_angle_of_measurement_position),
    this quantity applies to points on a flux surface rather than to a diagnostic
    location.


    Sign convention: Positive when the point lies clockwise from the outward $+R$
    direction when viewed from the $+\phi$ direction.'
  unit: rad
  physics_domain: equilibrium
  links:
