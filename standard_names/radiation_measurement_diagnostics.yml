  kind: scalar
  status: draft
  description: Zero-pixel wavelength intercept of the linear pixel-to-wavelength dispersion
    mapping used to calibrate a spectrometer channel.
  documentation: "This parameter defines the wavelength assigned to pixel index zero\
    \ in the linear dispersion model for a spectrometer channel. The pixel-to-wavelength\
    \ mapping takes the form:\n\n$$\n\\lambda(k) = k \\cdot g + \\lambda_0\n$$\n\n\
    where $\\lambda(k)$ is the wavelength at pixel $k$, $g$ is the dispersion gain\
    \ (wavelength increment per pixel), and $\\lambda_0$ is this reference calibration\
    \ wavelength \u2014 the zero-pixel intercept. Together with the gain, $\\lambda_0$\
    \ fully specifies the linear wavelength axis, enabling conversion of raw detector\
    \ pixel indices to physical wavelengths.\n\nThe offset is determined during spectrometer\
    \ wavelength calibration by fitting the pixel positions of precisely known emission\
    \ lines to the linear dispersion model; the intercept $\\lambda_0$ is extracted\
    \ from the resulting least-squares fit. This procedure applies to both UV and\
    \ visible grating spectrometers used in plasma spectroscopy diagnostics.\n\nTypical\
    \ values lie in the range $1 \\times 10^{-7}$ to $8 \\times 10^{-7}$ m, spanning\
    \ the UV-to-visible operational range of fusion spectroscopy systems. This intercept\
    \ is the complement to the dispersion gain encoded in [calibration_wavelength_of_spectrometer_channel](name:calibration_wavelength_of_spectrometer_channel);\
    \ together they constitute the complete linear wavelength calibration. Absolute\
    \ photon spectral radiance is subsequently obtained using the [spectral_calibration_factor_of_spectrometer](name:spectral_calibration_factor_of_spectrometer)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:calibration_wavelength_of_spectrometer_channel
  - name:spectral_calibration_factor_of_spectrometer
