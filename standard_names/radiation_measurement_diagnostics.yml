- name: width_of_hard_xray_detector
  kind: scalar
  status: active
  description: Full physical width of a rectangular hard X-ray detector aperture measured
    along the first local axis of the detector frame (X1, X2, X3).
  documentation: 'The hard X-ray detector aperture width is the full physical extent
    of the rectangular aperture along the first local detector axis, X1, in the local
    frame (X1, X2, X3). It is the width dimension orthogonal to the aperture height.


    The width is defined by the separation of the two opposite aperture edges along
    X1:


    $$

    W_{X1} = x_{1,\mathrm{max}} - x_{1,\mathrm{min}}

    $$


    where $x_{1,\mathrm{max}}$ and $x_{1,\mathrm{min}}$ are the X1 coordinates of
    those edges, and $W_{X1}$ is the full aperture width.


    This quantity describes the geometric aperture dimension and excludes the orthogonal
    extent represented by [height of hard X-ray detector](name:height_of_hard_xray_detector),
    as well as detector response or radiation throughput.'
