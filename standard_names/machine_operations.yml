- name: connection_length_of_magnetic_field_line
  kind: scalar
  status: draft
  description: Arc length along a magnetic field line between its two termination
    points (on a material surface, limiter, or, for a closed field line, after one
    full toroidal revolution returning to the starting point). Short values indicate
    open lines intercepted by the vessel wall or limiter; longer values characterize
    confined or partially confined flux regions.
  documentation: "The connection length $L_c$ is the total arc length integrated along\
    \ the direction of the magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$ from one endpoint to the other:\n\n$$L_c = \\int_{s_0}^{s_1} ds$$\n\
    \nwhere $s$ is the coordinate measuring distance along the field-line trajectory\
    \ traced in the right-handed cylindrical $(R, \\phi, Z)$ frame. The quantity is\
    \ a geometric property of the field-line topology and is frame-invariant: it depends\
    \ only on $|\\mathbf{B}|$ and the curvature of the trajectory, not on the orientation\
    \ of the coordinate frame used to perform the tracing.\n\n**Endpoint conventions.**\
    \ For open field lines the two endpoints $s_0$ and $s_1$ are the physical intersection\
    \ points with a material boundary (first wall, limiter, divertor target, or similar\
    \ structure). For closed field lines \u2014 which do not intercept a material\
    \ surface \u2014 the endpoints are defined operationally as the starting point\
    \ and the first return to that point after one complete toroidal transit; in this\
    \ case $L_c$ equals one field-line period and is finite even in the absence of\
    \ any limiting surface.\n\n**Typical values.** During plasma initiation or with\
    \ open ergodic flux regions, $L_c$ can range from a fraction of a meter (lines\
    \ immediately intercepted by limiters) to tens of meters (lines winding many times\
    \ before striking a surface). On well-confined closed flux surfaces in a tokamak\
    \ the periodic connection length is on the order of $2\\pi q R_0$, where $q$ is\
    \ the safety factor and $R_0$ is the major radius, giving values typically in\
    \ the range $10$\u2013$100\\ \\mathrm{m}$ for standard tokamak parameters.\n\n\
    **Physical significance.** Short connection lengths during the pre-ionization\
    \ or breakdown phase indicate that flux regions are dominated by open field lines\
    \ terminated on the vessel wall, which increases particle and energy losses. As\
    \ the discharge ramps up and closed nested flux surfaces form, connection lengths\
    \ grow, facilitating the bootstrap of toroidal current and the transition to a\
    \ confined plasma state. The distribution of connection lengths across a poloidal\
    \ cross-section is therefore a diagnostic of field-line topology and confinement\
    \ quality at early times."
  unit: m
  physics_domain: machine_operations
  links:
  - name:major_radius_of_field_line_tracing_start_position
  - name:magnetic_field_line_connection_length
  constraints: []
  sources:
  - id: dd:plasma_initiation/b_field_lines/lengths
    dd_path: plasma_initiation/b_field_lines/lengths
    status: composed
- name: major_radius_of_field_line_tracing_start_position
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the starting position for magnetic field-line
    tracing during plasma initiation. R is the non-negative distance from the machine
    symmetry axis in the right-handed cylindrical (R, phi, Z) frame, with R >= 0 by
    definition.
  documentation: "The major-radius coordinate $R$ is the non-negative radial distance\
    \ from the machine symmetry axis to the prescribed start point of a magnetic field-line\
    \ trace, measured in the right-handed cylindrical $(R, \\phi, Z)$ frame where\
    \ $R \\geq 0$, $\\phi$ increases counter-clockwise when viewed from above, and\
    \ $Z$ is the vertical height.\n\nDuring plasma initiation, a set of start positions\
    \ $(R, Z)$ \u2014 or $(R, \\phi, Z)$ for a three-dimensional survey \u2014 is\
    \ specified and individual magnetic field lines are traced from each point to\
    \ characterize the pre-plasma magnetic topology. The traces reveal regions of\
    \ closed and open flux, Townsend avalanche zones, and field-line connection lengths\
    \ relevant to the breakdown process.\n\nTypical values of $R$ span the vacuum-vessel\
    \ cross-section: from roughly $0.3\\,\\text{m}$ to $4\\,\\text{m}$ depending on\
    \ device size. The full spatial location of each start position requires the companion\
    \ vertical coordinate and, for three-dimensional surveys, the toroidal angle;\
    \ the connection length from a start position to the field-line termination point\
    \ quantifies the integrated path.\n\nThis quantity is distinct from $R$ coordinates\
    \ of Townsend-avalanche specific positions or grid-survey positions, which are\
    \ defined for particular sub-families of field-line analyzes."
  unit: m
  physics_domain: machine_operations
  links:
  - name:vertical_coordinate_of_townsend_position
  - name:connection_length_of_magnetic_field_line
  - name:major_radius_of_townsend_grid_position
  constraints: []
  sources:
  - id: dd:plasma_initiation/b_field_lines/starting_positions/r
    dd_path: plasma_initiation/b_field_lines/starting_positions/r
    status: composed
- name: major_radius_of_townsend_grid_position
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of a discrete grid point used in Townsend
    avalanche or closed field-line analysis during plasma initiation, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.
  documentation: "The major radius $R$ locates a grid point on the Townsend or closed\
    \ field-line grid in the right-handed cylindrical $(R, \\phi, Z)$ frame, where\
    \ $R$ is the perpendicular distance from the machine symmetry axis in meters.\
    \ This discretized grid is used during plasma initiation studies to trace field\
    \ lines and analyze Townsend avalanche processes \u2014 runaway electron generation\
    \ mechanisms driven by strong electric fields in the pre-breakdown phase. The\
    \ Townsend grid provides a structured set of positions sampling the plasma volume,\
    \ distinct from the single-position locus captured by [major_radius_of_townsend_position](name:major_radius_of_townsend_position).\
    \ The companion vertical coordinate of the same grid point is given by [vertical_coordinate_of_townsend_grid_position](name:vertical_coordinate_of_townsend_grid_position).\
    \ Typical values of $R$ span the range of the device's plasma cross-section, from\
    \ the inner wall to the outer wall major radius, generally 0.5\u201310 m depending\
    \ on the machine size.\n\nSign convention: Positive when $R$ is measured outward\
    \ from the machine symmetry axis, which is always the case for a physical major-radius\
    \ coordinate."
  unit: m
  physics_domain: machine_operations
  links:
  - name:major_radius_of_townsend_position
  - name:vertical_coordinate_of_townsend_grid_position
  constraints: []
  sources:
