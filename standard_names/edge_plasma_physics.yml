- name: toroidal_helium_3_velocity_at_pedestal
  kind: scalar
  status: draft
  description: "Toroidal component of the bulk helium-3 ion flow velocity at the H-mode\
    \ pressure pedestal, resolved along the toroidal direction in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal helium-3 velocity at the pedestal is the component of the
    bulk flow velocity of $^3\mathrm{He}$ ions along the toroidal basis direction
    at the H-mode pressure pedestal. The pedestal denotes the steep-gradient edge
    region just inside the last-closed flux surface, where flows strongly affect radial
    electric field balance, impurity and isotope transport, and edge stability.


    The toroidal component is the projection of the helium-3 bulk velocity onto the
    toroidal unit vector in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,^3\mathrm{He}} = \mathbf{v}_{^3\mathrm{He}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{^3\mathrm{He}}$ is the bulk helium-3 ion flow velocity and
    $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    $\phi$.


    In practice this quantity is inferred from charge-exchange recombination spectroscopy,
    passive spectroscopy when applicable, or edge-plasma modeling constrained by diagnostics.
    The pedestal value is obtained by evaluating the reconstructed helium-3 toroidal
    flow at the pedestal location, commonly identified from the steep-gradient region
    of pressure, density, or temperature.


    Typical pedestal toroidal ion velocities range from about $-1\times10^5$ to $1\times10^5$
    m.s^-1 in tokamak H-mode plasmas, with isotope-specific values depending on neutral-beam
    momentum input, collisional coupling, radial electric field shear, and edge rotation
    damping.


    Sign convention: Positive when the helium-3 bulk flow is in the direction of increasing
    toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_pedestal
  - name:toroidal_helium_3_velocity_at_magnetic_axis
  - name:toroidal_helium_3_velocity_at_plasma_boundary
  - name:toroidal_helium_3_velocity_at_internal_transport_barrier
- name: toroidal_helium_3_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Toroidal component of the helium-3 ion bulk flow velocity at the plasma\
    \ boundary, resolved along the \u03C6 direction in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It characterizes rotation or flow of helium-3 ions where\
    \ closed magnetic flux surfaces meet the scrape-off layer."
  documentation: 'Toroidal helium-3 velocity at the plasma boundary is the toroidal
    component of the bulk flow velocity of $^3\mathrm{He}$ ions evaluated on the last
    closed flux surface. It describes the directed motion of the helium-3 ion population
    around the torus at the interface between confined plasma and the open-field-line
    scrape-off layer.


    The component is defined by projecting the helium-3 ion bulk velocity onto the
    toroidal basis direction of the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    v_{\phi,^3\mathrm{He}} = \mathbf{v}_{^3\mathrm{He}} \cdot \hat{\phi}

    $$


    where $\mathbf{v}_{^3\mathrm{He}}$ is the helium-3 ion bulk velocity and $\hat{\phi}$
    is the unit vector in the direction of increasing toroidal angle $\phi$.


    In practice, this quantity may be inferred from Doppler shifts of helium spectral
    lines, charge-exchange measurements when suitable active neutrals are available,
    or from edge plasma modeling constrained by spectroscopy and equilibrium reconstruction.
    The boundary value is obtained by evaluating or interpolating the helium-3 flow
    to the last closed flux surface.


    Typical boundary values are often in the range $-5 \times 10^4$ to $5 \times 10^4$
    m.s^-1, with larger magnitudes approaching $1 \times 10^5$ m.s^-1 possible when
    strong momentum input, edge electric fields, or ion-temperature-gradient-driven
    flows are present.


    Sign convention: Positive when the helium-3 ion bulk flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_helium_4_velocity_at_plasma_boundary
  - name:toroidal_helium_3_velocity_at_magnetic_axis
- name: toroidal_helium_4_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal component of the helium-4 ion fluid velocity evaluated at
    the H-mode pressure pedestal, resolved along the direction of increasing toroidal
    angle.
  documentation: "The toroidal helium-4 velocity at the pedestal is the projection\
    \ of the bulk helium-4 ($^4$He) ion fluid velocity onto the toroidal direction\
    \ $\\hat{\\phi}$ in the right-handed cylindrical $(R, \\phi, Z)$ frame, evaluated\
    \ at the H-mode pressure pedestal. This quantity characterizes the toroidal rotation\
    \ of $^4$He ions within the steep-gradient edge transport barrier that governs\
    \ H-mode energy confinement.\n\nThe defining relation is\n\n$$\nv_\\phi^{\\,^4\\\
    text{He}} = \\mathbf{v}_{^4\\text{He}} \\cdot \\hat{\\phi}\n$$\n\nwhere $\\mathbf{v}_{^4\\\
    text{He}}$ is the local helium-4 ion fluid velocity and $\\hat{\\phi}$ is the\
    \ unit vector in the direction of increasing toroidal angle $\\phi$.\n\nPedestal\
    \ ion toroidal velocities are measured by charge exchange recombination spectroscopy\
    \ (CXRS), which resolves the Doppler shift of emission lines from $^4$He ions\
    \ excited during charge exchange with beam neutrals; the pedestal value is extracted\
    \ by fitting the measured radial profile and evaluating it at the pedestal location\
    \ identified from electron pressure or density measurements.\n\nIon toroidal rotation\
    \ at the H-mode pedestal spans from a few km/s to tens of km/s depending on neutral\
    \ beam torque input, intrinsic rotation, and impurity\u2013main-ion momentum coupling.\
    \ The helium-4 velocity closely follows the deuterium main-ion rotation \u2014\
    \ compare [toroidal_deuterium_velocity_at_pedestal](name:toroidal_deuterium_velocity_at_pedestal).\
    \ The isotopic companion [toroidal_helium_3_velocity_at_pedestal](name:toroidal_helium_3_velocity_at_pedestal)\
    \ characterizes the lighter $^3$He species at the same location, while toroidal_helium_4_velocity_at_magnetic_axis\
    \ and [toroidal_helium_4_velocity_at_plasma_boundary](name:toroidal_helium_4_velocity_at_plasma_boundary)\
    \ track the same species at other radial positions.\n\nSign convention: Positive\
    \ when the helium-4 ion flow is directed along increasing toroidal angle $\\phi$\
    \ (counter-clockwise when viewed from above in the $+\\hat{Z}$ direction)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
