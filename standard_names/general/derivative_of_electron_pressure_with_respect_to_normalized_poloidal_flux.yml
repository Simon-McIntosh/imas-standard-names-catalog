name: derivative_of_electron_pressure_with_respect_to_normalized_poloidal_flux
status: draft
cocos_transformation_type: one_like
description: Gradient of electron pressure with respect to the normalized poloidal
  flux coordinate $\psi_N$, characterizing the steepness of the $p_e$ profile.
documentation: "The quantity $dp_e/d\\psi_N$ measures how rapidly the electron pressure\
  \ $p_e$ (Pa) changes per unit of normalized poloidal flux $\\psi_N \\in [0, 1]$,\
  \ where $\\psi_N = (\\psi - \\psi_{\\rm axis})/(\\psi_{\\rm sep} - \\psi_{\\rm axis})$\
  \ with $\\psi$ the poloidal magnetic flux, $\\psi_{\\rm axis}$ its value on the\
  \ magnetic axis, and $\\psi_{\\rm sep}$ at the separatrix. Large negative values\
  \ of $dp_e/d\\psi_N$ in the pedestal region (typically $\\psi_N \\approx 0.9$\u2013\
  1.0) indicate steep edge pressure gradients that drive peeling\u2013ballooning MHD\
  \ instabilities (ELMs). Typical pedestal gradient magnitudes reach $10^4$\u2013\
  $10^6$ Pa per unit $\\psi_N$ depending on device size and confinement regime. Derived\
  \ from mtanh or polynomial fits to Thomson scattering and charge-exchange recombination\
  \ spectroscopy profiles. See also `electron_pressure_at_pedestal` and `maximum_of_derivative_of_electron_pressure_with_respect_to_normalized_poloidal_flux_at_pedestal`\
  \ for the peak gradient value."
