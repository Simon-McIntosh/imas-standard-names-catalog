- name: parallel_flux_surface_averaged_electric_field_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged parallel electric field at the plasma boundary,\
    \ defined as the separatrix average of the electric-field and magnetic-field dot\
    \ product divided by the signed reference toroidal field in the right-handed cylindrical\
    \ (R, \u03C6, Z) frame. It is not an average of the local unit-vector projection."
  documentation: 'The parallel flux-surface-averaged electric field at the plasma
    boundary is a separatrix scalar describing the net field-aligned electric drive
    at the interface between the closed-field-line plasma and the scrape-off layer.
    It is a magnetic-field-weighted surface average, distinct from [parallel_electric_field_at_plasma_boundary](name:parallel_electric_field_at_plasma_boundary),
    which represents the local projection of the electric field onto the unit magnetic-field
    direction.


    Using a magnetic surface labeled by poloidal magnetic flux $\psi$, the boundary
    value is defined by


    $$

    \begin{aligned}

    E_{\parallel,\mathrm{FSA},b}

    &= \frac{\left\langle \mathbf{E}\cdot\mathbf{B}\right\rangle_{\psi_b}}{B_0}, \\

    \left\langle f\right\rangle_{\psi_b}

    &= \frac{\int_{\psi=\psi_b} f\, dA/|\nabla\psi|}{\int_{\psi=\psi_b} dA/|\nabla\psi|}

    \end{aligned}

    $$


    where $E_{\parallel,\mathrm{FSA},b}$ denotes this boundary flux-surface-averaged
    quantity, $\mathbf{E}$ is the electric field in V m^-1, $\mathbf{B}$ is the magnetic
    field in T, $B_0$ is the signed reference toroidal magnetic field in T, and $\psi_b$
    is the boundary value of $\psi$. In the averaging convention, $\psi$ is in Wb,
    $dA$ is a magnetic-surface area element in m^2, $\nabla\psi$ is in Wb m^-1, and
    $\langle f\rangle_{\psi_b}$ has the same unit as $f$. The toroidal direction is
    defined in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The quantity is computed by evaluating $\mathbf{E}\cdot\mathbf{B}$ from an equilibrium
    magnetic field together with an electric field inferred from loop voltage, electrostatic-potential
    evolution, or a transport model, then applying the flux-surface average before
    division by $B_0$. Averaging the local projection $\mathbf{E}\cdot\mathbf{B}/|\mathbf{B}|$
    would give a different physical quantity. In diverted plasmas, care is needed
    near an X point because $|\nabla\psi|$ becomes small; practical analyzes should
    make clear whether a limiting closed surface or a regularized boundary average
    is used.


    A useful order-of-magnitude scale is the loop-voltage electric-field magnitude
    $|V_\mathrm{loop}|/(2\pi R_0)$. In many quasistationary tokamak plasmas this scale
    is about 0.01-1 V m^-1; values close to zero can occur when inductive and electrostatic
    contributions nearly cancel, and transient or strongly driven edge conditions
    may exceed this range.


    Sign convention: Positive when the separatrix flux-surface average of $\mathbf{E}\cdot\mathbf{B}$
    has the same sign as the signed reference toroidal magnetic field $B_0$, with
    $B_0$ positive for toroidal magnetic field in the direction of increasing $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: V.m^-1
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:effective_charge_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
- name: parallel_ion_heat_convection_velocity
  kind: scalar
  status: draft
  description: The effective velocity at which bulk ion thermal energy is advected
    along magnetic field lines in the edge plasma, used as a transport coefficient
    in the parallel ion energy equation.
  documentation: "The parallel ion heat convection velocity is the field-aligned component\
    \ of the effective velocity governing convective ion thermal-energy transport\
    \ in the edge plasma. It represents the aggregate ion population over all charge\
    \ states, in contrast to the per-charge-state quantity parallel_effective_ion_state_energy_convection_velocity,\
    \ which resolves a single ionization level.\n\nIn the ion energy equation, the\
    \ parallel convective heat flux density is:\n\n$$\nq_{\\parallel,i}^{\\text{conv}}\
    \ = \\frac{5}{2}\\, n_i T_i\\, v_{\\parallel,\\text{heat}}^{i}\n$$\n\nwhere $n_i$\
    \ is the total ion number density, $T_i$ is the ion temperature, and $v_{\\parallel,\\\
    text{heat}}^{i}$ is this convection velocity. The prefactor $5/2$ reflects the\
    \ enthalpy content per particle for a monatomic ideal gas.\n\nThis quantity is\
    \ computed from edge plasma fluid transport models solving the ion energy equation\
    \ in the scrape-off layer and divertor regions. Values range from order $10^2$\
    \ m/s in low-density far-SOL regions to near the ion acoustic speed ($\\sim 10^4$\u2013\
    $10^5$ m/s) approaching divertor target plates, depending on local ion density\
    \ and temperature.\n\nThe parent quantity ion_heat_convection_velocity defines\
    \ the full vector; the parallel component dominates along open field lines where\
    \ parallel transport greatly exceeds cross-field transport. The analogous transport\
    \ coefficient for parallel momentum is parallel_momentum_effective_convection_velocity.\n\
    \nSign convention: Positive when the ion heat convection is directed along the\
    \ local magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:edge_transport/model/ggd/electrons/energy/v_parallel/values
    dd_path: edge_transport/model/ggd/electrons/energy/v_parallel/values
    status: skipped
  - id: dd:edge_transport/model/ggd/ion/energy/v_parallel/values
    dd_path: edge_transport/model/ggd/ion/energy/v_parallel/values
