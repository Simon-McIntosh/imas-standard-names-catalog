name: fast_ion_particle_count
status: draft
cocos_transformation_type: one_like
description: Total number of fast (supra-thermal) ions in the distribution, obtained
  by volume integration of the fast-ion density.
documentation: "The fast ion particle count $N_{\\rm fast} = \\int_V n_{\\rm fast}(\\\
  mathbf{r})\\, dV$ gives the total number of supra-thermal ions contained in the\
  \ plasma volume $V$, where $n_{\\rm fast}$ is the fast-ion number density (unit\
  \ $\\mathrm{m^{-3}}$). This quantity counts real physical particles, not computational\
  \ markers used in Monte Carlo orbit-following codes. Fast ions originate from neutral\
  \ beam injection (NBI), ion cyclotron resonance heating (ICRH) acceleration, or\
  \ fusion-born alpha particles; typical values range from $10^{17}$\u2013$10^{20}$\
  \ depending on machine size and heating power. Monitoring $N_{\\rm fast}$ is critical\
  \ for assessing fast-ion confinement and the drive of Alfv\xE9nic instabilities.\
  \ It is computed by codes such as NUBEAM, TRANSP, or ASCOT, and can be constrained\
  \ experimentally by fast-ion $D_\\alpha$ (FIDA) spectroscopy and neutron-rate measurements.\
  \ See also the total distribution particle count and the fast-ion energy content."
