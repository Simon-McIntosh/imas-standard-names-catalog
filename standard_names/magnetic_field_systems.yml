      description: Terminal voltage of a non-axisymmetric coil, time-resolved. Used
        for monitoring and control of 3D field-shaping coil systems such as ELM control
        coils or error field correction coils.
      kind: llm
- name: voltage_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Signed terminal voltage across a poloidal-field-coil winding, equal
    to its resistive voltage drop plus the voltage induced by changing magnetic flux
    linkage.
  documentation: 'The terminal voltage is the total voltage drop across a poloidal-field-coil
    winding. It combines the ohmic voltage drop in the conductor with the inductive
    voltage associated with changing magnetic flux linkage.


    Using a consistent winding orientation, the voltage is defined by


    $$

    V_{\mathrm{term}} = R_{\mathrm{w}} I + \frac{d\Phi_{\mathrm{link}}}{dt}

    $$


    where $V_{\mathrm{term}}$ is the terminal voltage, $R_{\mathrm{w}}$ is the winding
    resistance represented by the [poloidal-field-coil resistance](name:resistance_of_poloidal_field_coil),
    $I$ is the conventional current in the winding, $\Phi_{\mathrm{link}}$ is its
    signed total magnetic flux linkage, and $t$ is time.


    This quantity applies to the complete active winding and includes both self-field
    and externally produced flux linkage. It is distinct from the induced terminal
    voltage of a separate [poloidal magnetic-field probe](name:voltage_of_poloidal_magnetic_field_probe)
    and is analogous to the [toroidal-field-coil terminal voltage](name:voltage_of_toroidal_field_coil).


    Sign convention: Positive when the terminal potential drop is measured in the
    direction of the winding''s defined positive conventional-current direction.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_poloidal_field_coil
  - name:voltage_of_poloidal_magnetic_field_probe
  - name:voltage_of_toroidal_field_coil
  sources:
  - dd_path: pf_active/coil/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-voltage
    dd_documentation:
      leaf: Voltage on the coil terminals
      parent_path: pf_active/coil
      parent: Active PF coils
      data_type: STRUCTURE
      unit: V
    enhanced_context:
      description: Voltage measured at the terminals of an active poloidal field (PF)
        coil. A time-resolved electrical quantity used in power supply modelling,
        circuit simulation, and plasma shape control.
      kind: llm
- name: voltage_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Terminal voltage across a toroidal-field-coil winding, combining the
    resistive drop with the inductive voltage caused by changing winding current.
  documentation: 'Terminal voltage across a toroidal-field-coil winding is the sum
    of the ohmic voltage drop and the inductive voltage associated with changing winding
    current.


    For constant winding inductance, it is defined by


    $$

    V = R I + L\frac{dI}{dt}

    $$


    where $V$ is terminal voltage in volts, $R$ is winding resistance in ohms, $I$
    is signed conventional current in amperes, $L$ is self-inductance in henries,
    and $t$ is time in seconds. The resistive contribution uses the winding [resistance](name:resistance_of_toroidal_field_coil),
    and the current is the signed quantity defined by [current](name:current_of_toroidal_field_coil).


    This quantity applies across the coil winding terminals and excludes voltage drops
    in external leads, power supplies, or other circuit elements.


    Sign convention: Positive when the terminal where the positive conventional current
    enters is at higher electric potential than the other terminal; positive current
    produces a toroidal magnetic-field component toward increasing $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: V
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_toroidal_field_coil
  - name:current_of_toroidal_field_coil
  sources:
  - dd_path: tf/coil/conductor/voltage
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/tf.html#tf-coil-conductor-voltage
    dd_documentation:
      leaf: Voltage on the conductor terminals
