    enhanced_context:
      description: Electrical power consumed by an individual subsystem of the fusion
        power plant's electric plant operation. Tracks the operational power demand
        of each subsystem for plant-level power balance accounting.
      kind: llm
- name: power_of_plant_system
  kind: scalar
  status: active
  description: Real electrical power assigned at a plant-system boundary, representing
    absorbed load, net generation balance, or an aggregate of included system loads.
  documentation: 'Real electrical power is the rate of electrical-energy transfer
    or accounting associated with a plant system at its electrical boundary. It excludes
    reactive power and other non-electrical energy flows.


    The instantaneous power is defined by


    $$

    P = \frac{\mathrm{d}E}{\mathrm{d}t}

    $$


    where $E$ is the electrical energy associated with the accounting boundary and
    $t$ is time.


    The accounting convention is fixed by the specialized quantity. [Absorbed power
    of a plant system](name:absorbed_power_of_plant_system) represents one-way incoming
    electrical load, [net power of a plant system](name:net_power_of_plant_system)
    represents generation minus internal consumption and is positive for net export,
    and [total power of a plant system](name:total_power_of_plant_system) is the sum
    of the loads of all included systems. These forms are distinct applications of
    the same plant-boundary electrical-power concept.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:absorbed_power_of_plant_system
  - name:net_power_of_plant_system
  - name:total_power_of_plant_system
  sources:
  - dd_path: balance_of_plant/power_electric_plant_operation/system/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_electric_plant_operation-system-power
    dd_documentation:
      leaf: Electrical power used to operate the system
      parent_path: balance_of_plant/power_electric_plant_operation/system
      parent: Set of systems involved in the electric plant operation
      data_type: FLT_1D
      unit: W
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Electrical power consumed by a specific system in the balance-of-plant
        electric plant operation. Represents the instantaneous power draw of the named
        system as part of the overall plant power balance accounting.
      kind: llm
- name: absorbed_power_of_plant_system
  kind: scalar
  status: active
  description: Real electrical power absorbed by an individual plant system during
    operation, evaluated at the system electrical boundary. It is the one-way incoming
    load component, excluding locally generated or returned real power and distinct
    from generated-minus-consumed net balance.
  documentation: 'Absorbed power of a plant system is the real electrical power crossing
    the electrical boundary of one plant system into that system, with inward transfer
    represented as a one-way absorbed component. It describes electrical boundary
    input at system level, not thermal power, apparent power, reactive power, accumulated
    energy, internal dissipation, or storage inside the boundary.


    For $M$ electrical terminals referenced so that positive terminal real power enters
    the plant-system boundary, absorbed power is defined as the sum of positive incoming
    terminal real-power components:


    $$

    P_\mathrm{abs} = \sum_{k=1}^{M} [P_k]_+,\qquad P_k = \left\langle v_k(t)\,i_k(t)\right\rangle

    $$


    where $M$ is the number of included electrical terminals, $P_\mathrm{abs}$ is
    this absorbed plant-system power in W, $P_k$ is the signed real power at terminal
    $k$ in W, $v_k$ is terminal voltage in V, $i_k$ is terminal current in A, $\langle\cdot\rangle$
    denotes the averaging needed to form real power, and $[x]_+=\max(x,0)$. For sinusoidal
    steady state, the same terminal real power may be written $P_k=\Re\{V_k I_k^*\}$,
    where $V_k$ and $I_k$ are RMS voltage and current phasors in V and A with the
    current phasor referenced inward.


    Generated or returned real electrical power crossing outward is not counted as
    negative absorbed power; it is excluded from $P_\mathrm{abs}$. The corresponding
    [net_absorbed_power_of_plant_system](name:net_absorbed_power_of_plant_system)
    combines incoming consumption with local generation or returned real power using
    consumed-minus-generated accounting, whereas [net_power_of_plant_system](name:net_power_of_plant_system)
    uses generated-minus-consumed accounting. Consistently bounded subsystem contributions
    are related to [power_of_plant_subsystem](name:power_of_plant_subsystem), and
    the unqualified load-positive system boundary quantity is [power_of_plant_system](name:power_of_plant_system).'
  unit: W
  physics_domain: plant_systems
  links:
  - name:power_of_plant_system
  - name:net_absorbed_power_of_plant_system
  arguments:
  - name: power_of_plant_system
    operator: absorbed
    operator_kind: qualifier
- name: net_absorbed_power_of_plant_system
  kind: scalar
  status: active
  description: 'Signed net electrical load of a plant system: internally consumed
    power minus locally generated power, positive for net electrical uptake.'
  documentation: 'Net absorbed power is the real electrical load balance of a plant
    system, representing internal consumption after local generation is accounted
    for.


    $$

    P_{\mathrm{net,abs}} = P_{\mathrm{cons}} - P_{\mathrm{gen}} = -P_{\mathrm{net}}

    $$


    where $P_{\mathrm{cons}}$ is the real electrical power consumed within the system,
    $P_{\mathrm{gen}}$ is real electrical power generated locally within the same
    boundary, and $P_{\mathrm{net}}$ is the generated-minus-consumed balance defined
    by [net power of plant system](name:net_power_of_plant_system). Positive values
    indicate net electrical uptake; negative values indicate that local generation
    exceeds consumption. This signed balance is distinct from [absorbed power of plant
    system](name:absorbed_power_of_plant_system), which denotes one-way inward electrical
    boundary transfer, and from [power of plant system](name:power_of_plant_system),
    which denotes gross electrical draw without the local-generation subtraction.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:net_power_of_plant_system
  - name:absorbed_power_of_plant_system
  - name:power_of_plant_system
  arguments:
  - name: absorbed_power_of_plant_system
    operator: net
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_electric_plant_operation/system/power
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_electric_plant_operation-system-power
    dd_documentation:
