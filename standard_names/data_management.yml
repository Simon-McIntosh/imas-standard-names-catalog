- name: simulation_time_step
  kind: scalar
  status: draft
  description: Discrete time interval assigned to a simulation component for a single
    computation step, defining the temporal resolution of the numerical integration.
  documentation: 'The simulation time step $\Delta t$ governs the temporal resolution
    at which a numerical simulation advances its state variables. A smaller $\Delta
    t$ improves accuracy and stability of time-integration schemes (e.g., Runge-Kutta,
    Crank-Nicolson) at the cost of increased computational expense; stability criteria
    such as the Courant-Friedrichs-Lewy condition $\Delta t \leq \Delta x / v$ constrain
    the maximum permissible step size for explicit methods, where $\Delta x$ is the
    spatial grid spacing and $v$ is a characteristic signal velocity. In adaptive
    schemes, $\Delta t$ may vary between cycles; in fixed-step simulations it remains
    constant throughout the run. Typical values range from microseconds ($\sim 10^{-6}$
    s) for fast MHD or wave-propagation solvers to seconds or longer for transport
    codes evolving slow equilibrium profiles. This quantity complements the simulation
    time-point quantities [simulation_start_time](name:simulation_start_time), [simulation_end_time](name:simulation_end_time),
    and [simulation_current_time](name:simulation_current_time), which together fully
    specify the temporal extent and position of a simulation run.


    Sign convention: Positive when the simulation advances forward in time.'
  unit: s
  physics_domain: data_management
  links:
  - name:simulation_start_time
  - name:simulation_end_time
  - name:simulation_current_time
  constraints: []
