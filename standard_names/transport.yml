- name: radial_electron_velocity
  kind: scalar
  status: draft
  description: Component of the electron fluid velocity along the major radius coordinate
    in the cylindrical $(R, \phi, Z)$ frame.
  documentation: "The radial electron velocity $v_{e,R} = \\mathbf{v}_e \\cdot \\\
    hat{R}$ is the projection of the electron fluid velocity vector onto the radial\
    \ direction of the machine cylindrical coordinate system. It quantifies the net\
    \ particle flux in the radial direction and is a key quantity for understanding\
    \ particle transport across the magnetic field, particularly in the edge and scrape-off\
    \ layer. Positive $v_{e,R}$ indicates outward-directed electron flow. The radial\
    \ velocity is typically inferred from the convective contribution to the radial\
    \ electron particle flux, measured via Langmuir probes or determined from profile\
    \ evolution and equilibrium particle sources. In the plasma core, the radial component\
    \ is small (order 1\u201310 m/s) due to neoclassical and turbulent transport,\
    \ while in the SOL it can reach $10^3$ m/s during ELMs. The complete velocity\
    \ field is given by [electron_velocity](name:electron_velocity); see also [radial_ion_velocity](name:radial_ion_velocity)\
    \ and [radial_center_of_mass_velocity](name:radial_center_of_mass_velocity).\n\
    \nSign convention: Positive when the electron fluid flows in the direction of\
    \ increasing major radius $R$ (outward from the machine axis)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:electron_velocity
  - name:radial_ion_velocity
  - name:radial_center_of_mass_velocity
  arguments:
  - name: electron_velocity
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
