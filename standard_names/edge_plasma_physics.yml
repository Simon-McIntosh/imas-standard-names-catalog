- name: radial_ion_convection_velocity
  kind: scalar
  status: active
  description: Effective radial coefficient for convective transport of ion particle
    density across the edge plasma; it multiplies ion density in the convective particle-flux
    relation and need not equal the ion fluid velocity.
  documentation: 'This quantity is the radial component of the effective ion convection
    velocity used to represent convective cross-field particle transport in the edge
    plasma. It is the radial specialization of [ion convection velocity], not necessarily
    the local ion fluid velocity.


    $$

    \Gamma_{i,R}^{\mathrm{conv}} = n_i\,v_{i,R}^{\mathrm{conv}}

    $$


    where $\Gamma_{i,R}^{\mathrm{conv}}$ is the convective ion particle flux, $n_i$
    is the ion number density, and $v_{i,R}^{\mathrm{conv}}$ is this effective coefficient.
    The component is defined along the cylindrical $R$ direction, distinct from the
    diffusive coefficient represented by [radial ion particle diffusivity](name:radial_ion_particle_diffusivity).


    Sign convention: Positive when the convective ion particle flux points toward
    increasing major radius $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
