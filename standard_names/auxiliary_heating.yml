- name: per_toroidal_mode_of_thermal_ion_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the thermal ion population from a coherent
    wave, resolved per toroidal mode number $n_\phi$ and integrated over the plasma
    volume.
  documentation: "This quantity gives the plasma-volume-integrated wave power $P_{\\\
    rm th,i}(n_\\phi)$ deposited on the thermal ion population by a coherent wave\
    \ at each toroidal mode number $n_\\phi$, where $n_\\phi$ is the integer Fourier\
    \ index of the wave field with respect to the toroidal angle $\\phi$. The total\
    \ thermal-ion absorbed power is recovered by summing over all contributing toroidal\
    \ modes: $P_{\\rm th,i} = \\sum_{n_\\phi} P_{\\rm th,i}(n_\\phi)$. The mode-resolved\
    \ decomposition is essential for identifying which wave branches \u2014 and at\
    \ which toroidal wavenumber \u2014 couple most efficiently to the thermal bulk,\
    \ distinguishing, for example, ion-cyclotron harmonic heating from transit-time\
    \ magnetic pumping. Typical values in ICRF-heated tokamak plasmas span from near\
    \ zero (modes with negligible ion damping) to tens of megawatts for the dominant\
    \ resonant harmonic. This quantity is the thermal-ion counterpart to [per-toroidal-mode\
    \ fast-ion absorbed power](name:per_toroidal_mode_of_fast_ion_wave_absorbed_power)\
    \ and [per-toroidal-mode thermal-electron absorbed power](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power).\
