      data_type: STRUCTURE
      unit: eV
    enhanced_context:
      description: Radiation temperature (Trad) measured by an ECE channel, corresponding
        to the detected electron cyclotron emission intensity expressed as an equivalent
        blackbody temperature. Approaches electron temperature (Te) when the plasma
        is optically thick.
      kind: llm
