- name: fast_neutral_density
  kind: scalar
  status: draft
  description: Suprathermal (non-Maxwellian) neutral particle number density at a
    point in the plasma, summed over all internal quantum states of the neutral species.
    It represents the neutral population not described by the local thermal neutral
    distribution.
  documentation: 'Fast neutral density is the number of neutral atoms or molecules
    per unit volume belonging to a suprathermal, non-Maxwellian population of a specified
    neutral species. It excludes the locally thermalized neutral component and is
    summed over internal quantum states such as excitation levels when those states
    are not resolved.


    At a spatial point $\mathbf{x}$, it is the zeroth velocity moment of the fast
    component of the neutral distribution function:


    $$

    n_\mathrm{fast}(\mathbf{x}) = \sum_\alpha \int f_{\alpha,\mathrm{fast}}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $\alpha$ labels internal quantum states, $f_{\alpha,\mathrm{fast}}$ has
    units of m$^{-6}$ s$^{3}$ when velocity is in m s$^{-1}$, and the integral is
    over the velocity distribution assigned to the suprathermal component. The fast
    component is not defined by a universal sharp cutoff at the local thermal speed;
    it is the non-Maxwellian part separated from the locally thermal neutral distribution
    by the physics model or diagnostic interpretation.


    In practice, fast neutral density is inferred or computed from neutral transport,
    beam attenuation, recycling, and charge-exchange source models, often constrained
    by spectroscopic emission or charge-exchange measurements. The operational separation
    from [thermal_neutral_density](name:thermal_neutral_density) is based on whether
    the neutral population is locally equilibrated with the background gas or plasma-neutral
    environment; beam neutrals, halo neutrals, and energetic charge-exchange neutrals
    are typical contributors to the fast component.


    Typical values vary strongly with fueling, beam power, wall recycling, and plasma
    opacity. Hot confined plasmas may have local fast neutral densities around $10^{12}$-$10^{16}$
    m$^{-3}$, while intense neutral-beam paths, edge, or scrape-off-layer charge-exchange
    regions can reach about $10^{15}$-$10^{18}$ m$^{-3}$; the value is generally less
    than or comparable to the [total_neutral_density](name:total_neutral_density).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:thermal_neutral_density
  sources:
  - id: dd:core_profiles/profiles_1d/neutral/density_fast
    dd_path: core_profiles/profiles_1d/neutral/density_fast
    status: attached
