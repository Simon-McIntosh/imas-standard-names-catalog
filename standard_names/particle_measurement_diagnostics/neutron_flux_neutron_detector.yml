name: neutron_flux_neutron_detector
status: draft
description: Neutron flux incident on a detector surface, inferred from the measured
  count rate and the detector response function.
documentation: "The neutron flux $\\Phi_n$ (in m$^{-2}$ s$^{-1}$) represents the number\
  \ of neutrons crossing a unit area at the detector location per unit time. It is\
  \ deduced from the raw pulse count rate $C$ (s$^{-1}$) via $\\Phi_n = C / (\\eta\\\
  , A_{\\mathrm{eff}})$, where $\\eta$ is the detector intrinsic efficiency (dimensionless)\
  \ and $A_{\\mathrm{eff}}$ is the effective detection area (m$^{2}$). Common detector\
  \ technologies include fission chambers ($^{235}$U, $^{238}$U), $^{3}$He proportional\
  \ counters, and scintillator-based systems; the choice depends on the expected neutron\
  \ energy spectrum (2.45 MeV for D\u2013D reactions, 14.1 MeV for D\u2013T reactions).\
  \ Typical values range from $10^{6}$ to $10^{12}$ m$^{-2}$ s$^{-1}$ at detector\
  \ positions several meters from the plasma in present-day tokamaks. The neutron\
  \ flux at the detector is related to the plasma neutron emissivity through the collimator\
  \ geometry and the solid-angle acceptance function. See `deuterium_deuterium_neutron_emissivity`\
  \ for the local volumetric neutron source and `exposure_time_of_neutron_detector`\
  \ for the integration window over which the count rate is accumulated."
