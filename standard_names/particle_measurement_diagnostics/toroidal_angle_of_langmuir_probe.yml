name: toroidal_angle_of_langmuir_probe
status: draft
description: Toroidal angle $\phi$ specifying the azimuthal position of a Langmuir
  probe in the tokamak coordinate system.
documentation: The toroidal angle $\phi$ (in radians) locates a Langmuir probe along
  the machine's toroidal circumference, measured from a device-specific reference
  plane. For reciprocating probes, the toroidal position may vary during a plunge
  if the probe trajectory has a toroidal component, though in most installations the
  plunge is purely radial so $\phi$ remains constant within a given plunge. Accurate
  knowledge of $\phi$ is essential for mapping probe measurements of electron temperature,
  density, and floating potential onto flux-surface coordinates, especially when combining
  data from multiple toroidal locations to study toroidal asymmetries in the scrape-off
  layer. Typical values span $[0, 2\pi)$ rad. See also the companion spatial coordinates
  for the probe position.
