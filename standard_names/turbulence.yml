- name: normalized_intensity_of_perturbed_electrostatic_potential
  kind: scalar
  status: draft
  description: Dimensionless mean-square amplitude of the perturbed electrostatic
    potential in gyrokinetic turbulence, normalized to the square of the gyrobohm
    reference potential. This positive-definite scalar characterizes the overall level
    of electrostatic fluctuations.
  documentation: '## Normalized Intensity of the Perturbed Electrostatic Potential


    This quantity measures the squared amplitude of the electrostatic potential fluctuation
    $\delta\phi$ in nonlinear gyrokinetic turbulence, rendered dimensionless by the
    gyrobohm reference potential. The defining relation is


    $$I_\phi = \frac{\langle |\delta\phi|^2 \rangle}{\phi_{\mathrm{ref}}^2},$$


    where the averaging operator $\langle \cdot \rangle$ denotes a sum (or integral)
    over all resolved perpendicular wavenumbers $(k_x, k_y)$ followed by a time average
    over the statistically stationary saturated turbulent state. The gyrobohm reference
    potential is


    $$\phi_{\mathrm{ref}} = \frac{\rho_s}{a} \frac{T_{e,\mathrm{ref}}}{e},$$


    with $\rho_s = c_s / \Omega_i$ the ion sound Larmor radius (where $c_s = \sqrt{T_{e,\mathrm{ref}}
    / m_i}$ is the ion sound speed and $\Omega_i = eB_{\mathrm{ref}}/m_i$ the ion
    cyclotron frequency), $a$ the minor radius, $T_{e,\mathrm{ref}}$ the reference
    electron temperature, and $e$ the elementary charge.


    Because $I_\phi$ is constructed from $|\delta\phi|^2$ it is strictly non-negative.
    In well-saturated ion-temperature-gradient (ITG) or trapped-electron-mode (TEM)
    turbulence typical of tokamak core conditions, $I_\phi$ ranges from approximately
    $10^{-3}$ to $10^{-1}$, with larger values indicating stronger electrostatic fluctuation
    levels.


    Physically, $I_\phi$ quantifies the energy stored in electrostatic fluctuations.
    The $E\times B$ velocity fluctuation amplitude scales as $|\tilde{v}_{E\times
    B}| \sim k_\perp |\delta\phi| / B$, so $I_\phi$ is related to (but does not directly
    equal) the squared $E\times B$ flow; the relationship involves weighting by perpendicular
    wavenumber and depends on the cross-phase between $\delta\phi$ and density or
    temperature perturbations for determining actual transport. Consequently, $I_\phi$
    is a precursor diagnostic that characterizes the turbulent field itself, complementing
    the normalized particle and energy flux quantities that measure the resulting
    cross-field transport.


    This quantity is identical in physical content to the standard name [normalized_electrostatic_potential_perturbation_intensity](name:normalized_electrostatic_potential_perturbation_intensity),
    which represents the same scalar under an alternate naming convention in this
    catalog.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_electrostatic_potential_perturbation_intensity
  - name:normalized_particle_flux_due_to_electrostatic_potential
  - name:normalized_energy_flux_due_to_electrostatic_potential
  constraints: []
  sources:
