- name: vertical_coordinate_of_bragg_crystal
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the Bragg crystal summit point in the right-handed
    cylindrical (R, phi, Z) frame, locating the crystal within an X-ray crystal spectrometer
    assembly.
  documentation: 'The vertical coordinate $Z$ specifies the height of the Bragg crystal
    summit above the device equatorial plane in the right-handed cylindrical $(R,
    \phi, Z)$ frame, where $R$ is the major radius, $\phi$ is the toroidal angle increasing
    counter-clockwise when viewed from above, and $Z$ is the vertical height. Together
    with the [radial coordinate](name:radial_coordinate_of_bragg_crystal), it fully
    defines the poloidal location of the crystal summit used as the primary geometric
    reference for the spectrometer.


    In X-ray crystal spectrometers, the crystal diffracts plasma X-ray emission according
    to the Bragg condition:


    $$

    2d\sin\theta_B = n\lambda

    $$


    where $d$ is the crystal lattice spacing, $\theta_B$ is the Bragg angle, $n$ is
    the diffraction order, and $\lambda$ is the X-ray wavelength. The summit coordinates
    enter directly into photon path-length calculations, solid-angle integrations,
    and line-of-sight geometry for individual detector channels. The position is established
    from engineering metrology surveys and complements the crystal''s angular acceptance
    described by [angular_width_of_bragg_crystal](name:angular_width_of_bragg_crystal).


    Sign convention: Positive when the crystal summit lies above the device equatorial
    plane in the $+Z$ direction.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_bragg_crystal
  - name:angular_width_of_bragg_crystal
