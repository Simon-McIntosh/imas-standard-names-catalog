- name: toroidal_magnetic_flux
  kind: scalar
  status: draft
  description: Magnetic flux through the poloidal cross-section enclosed by a given
    flux surface, increasing monotonically from zero at the magnetic axis and used
    as a natural radial flux-surface label in equilibrium analysis.
  documentation: "The toroidal magnetic flux $\\Phi_{tor}$ is the total flux of the\
    \ toroidal magnetic field threading the poloidal cross-section enclosed by a closed\
    \ magnetic flux surface. In an axisymmetric equilibrium, $\\Phi_{tor}$ increases\
    \ monotonically from zero at the magnetic axis to its maximum at the plasma boundary,\
    \ making it one of the two fundamental flux-surface labels alongside the poloidal\
    \ magnetic flux $\\psi$.\n\nThe defining integral over the poloidal cross-sectional\
    \ area $S_{\\rm pol}$ bounded by the flux surface is:\n\n$$\n\\Phi_{tor} = \\\
    int_{S_{\\rm pol}} B_\\phi \\, dA\n$$\n\nwhere $B_\\phi$ is the toroidal magnetic\
    \ field component in T and $dA$ is the area element of the poloidal half-plane\
    \ in m\xB2. The safety factor relates the two canonical flux coordinates through\
    \ $q = d\\Phi_{tor}/d\\psi$, linking the toroidal flux to the flux-surface geometry\
    \ characterized by [flux_surface_area](name:surface_area_of_flux_surface).\n\n\
    In equilibrium reconstruction, $\\Phi_{tor}$ profiles are computed from the Grad\u2013\
    Shafranov solution and tabulated as a function of normalized radial coordinates\
    \ across nested flux surfaces. Typical boundary values span a few to tens of Wb\
    \ in current tokamaks, with larger values for higher-field machines. The [toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface](name:toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface)\
    \ isolates the portion of this flux arising from plasma diamagnetism.\n\nSign\
    \ convention: Positive when $B_\\phi$ points in the direction of increasing toroidal\
    \ angle $\\phi$."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:surface_area_of_flux_surface
  - name:toroidal_diamagnetic_magnetic_flux_at_inside_flux_surface
