- name: energy_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Normalized gyrocenter energy flux driven by the perturbed parallel
    magnetic field in gyrokinetic simulations.
  documentation: "The gyrocenter energy flux $Q_{\\delta B_\\parallel}$ measures the\
    \ radial transport of gyrocenter energy mediated by fluctuations in the parallel\
    \ magnetic field component $\\delta B_\\parallel$. This flux is the electromagnetic\
    \ contribution to the total energy flux, distinct from the electrostatic drive\
    \ from $\\delta \\phi$ or the inductive drive from $\\delta A_\\parallel$. It\
    \ is obtained by integrating the perturbed gyrocenter distribution function with\
    \ the $\\delta B_\\parallel$ component of the electromagnetic fluctuation, normalized\
    \ to the simulation reference gyrokinetic energy flux scale. In local flux-tube\
    \ gyrokinetic simulations, $\\delta B_\\parallel$ effects arise from finite-\u03B2\
    \ electromagnetic physics and are relevant for describing turbulent transport\
    \ at high plasma pressure. Typical values in electromagnetic gyrokinetic simulations\
    \ are of order 0.1\u201310 in normalized units, increasing with plasma \u03B2\
    . This quantity is the energy-flux counterpart of [particle_flux_due_to_perturbed_parallel_magnetic_field](name:particle_flux_due_to_perturbed_parallel_magnetic_field)\
    \ and is complementary to the electrostatic-driven energy flux [energy_flux_due_to_perturbed_parallel_vector_potential](name:energy_flux_due_to_perturbed_parallel_vector_potential).\n\
    \nSign convention: Positive when the energy flux is radially outward.\n\nThe flux\
    \ is computed in the local flux-tube approximation, where radial transport is\
    \ driven by the combination of $\\mathbf{E}\\times\\mathbf{B}$ drift from perturbed\
    \ electrostatic and electromagnetic fields."
  unit: '1'
  physics_domain: turbulence
