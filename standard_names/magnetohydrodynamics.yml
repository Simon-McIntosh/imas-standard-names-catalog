- name: per_toroidal_mode_growth_rate
  kind: scalar
  status: active
  description: Linear exponential growth rate of a single MHD eigenmode resolved per
    toroidal mode number, equal to the imaginary part of the complex eigenfrequency
    from linear stability analysis.
  documentation: "The per-toroidal-mode growth rate is the linear growth rate $\\\
    gamma$ of a plasma MHD instability eigenmode for a specific toroidal Fourier mode\
    \ number $n_\\phi$. It is the imaginary part of the complex eigenfrequency $\\\
    omega = \\omega_r + i\\gamma$, where the real part $\\omega_r$ is the mode oscillation\
    \ frequency given by mode_frequency.\n\nThe eigenmode amplitude $A$ evolves in\
    \ time as:\n\n$$\nA(t) \\propto e^{(\\gamma + i\\omega_r)\\,t}\n$$\n\nwhere $t$\
    \ is time. A positive $\\gamma$ signals exponential growth of the perturbation\
    \ (instability), while a negative $\\gamma$ indicates a damped or stable mode.\n\
    \nThe growth rate is obtained by solving the linearized MHD equations as an eigenvalue\
    \ problem, treating each toroidal mode number $n_\\phi$ independently under the\
    \ assumption of an axisymmetric background equilibrium. The complementary per_toroidal_mode_perturbed_energy\
    \ characterizes the energy content of the same eigenmode, and [alfven_frequency_imaginary_part](name:alfven_frequency_imaginary_part)\
    \ provides an analogous growth or damping rate for the shear Alfv\xE9n continuum.\n\
    \nIdeal kink ($n_\\phi = 1$) instabilities in high-normalized-pressure plasmas\
    \ can reach $10^3$\u2013$10^5$ Hz, while resistive tearing modes grow on slower\
    \ timescales, $\\gamma \\sim 1$\u2013$10^3$ Hz.\n\nSign convention: Positive when\
    \ the eigenmode amplitude grows exponentially in time, indicating instability;\
    \ negative when the mode is stable or damped."
  unit: Hz
  physics_domain: magnetohydrodynamics
  links:
  - name:alfven_frequency_imaginary_part
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/growthrate
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-growthrate
    dd_documentation:
      leaf: Linear growthrate of the mode
      parent_path: mhd_linear/time_slice/toroidal_mode
      parent: Vector of toroidal modes
      data_type: FLT_0D
      unit: Hz
    enhanced_context:
      description: "Linear growth rate (\u03B3) of an MHD toroidal mode, characterizing\
        \ the exponential growth timescale of the instability. A primary output of\
        \ linear MHD stability analysis codes such as MARS, MISHKA, or KINX."
      kind: llm
- name: perturbed_electrostatic_potential
  kind: scalar
  status: active
  description: Perturbed electrostatic potential is the voltage-valued scalar potential
    perturbation of the quasineutral plasma about an equilibrium state and electrical
    reference. Its negative spatial gradient defines the electrostatic contribution
    to the perturbed electric field, distinct from inductive electric-field contributions.
  documentation: 'Perturbed electrostatic potential is the voltage-valued scalar potential
    perturbation of the quasineutral plasma about an equilibrium state. It is the
    first-order variation of [electrostatic_potential](name:electrostatic_potential)
    evaluated relative to the same electrical reference as the equilibrium potential.
    It encodes only the electrostatic part of the linear electric perturbation.


    The first-order decomposition of the plasma electrostatic potential is:


    $$

    \Phi(\mathbf{x}, t) = \Phi_0(\mathbf{x}) + \epsilon\,\delta\Phi(\mathbf{x}, t)
    + O(\epsilon^2)

    $$


    where $\Phi$ is the total electrostatic potential, $\Phi_0$ is the equilibrium
    electrostatic potential, $\delta\Phi$ is the perturbed electrostatic potential,
    $\epsilon$ is an ordering parameter, and $\mathbf{x}$ is position. For a single
    toroidal Fourier mode, a complex representation of $\delta\Phi$ uses the amplitude
    $\hat{\Phi}(R,Z)$ multiplying $e^{i(n\phi-\omega t)}$ in the right-handed cylindrical
    $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is the toroidal angle, $Z$
    is vertical height, $n$ is toroidal mode number, and $\omega$ is complex angular
    frequency.


    The electrostatic contribution to the perturbed electric field is $-\nabla\delta\Phi$;
    terms such as $-\partial\delta\mathbf{A}/\partial t$ are inductive contributions
    and are excluded from this scalar potential. In complex modal notation, [perturbed_electrostatic_potential_real_part](name:perturbed_electrostatic_potential_real_part)
    and [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part)
    denote the real and imaginary components of the complex amplitude, while [normalized_perturbed_electrostatic_potential](name:normalized_perturbed_electrostatic_potential)
    denotes a normalized form rather than this unnormalized perturbation.


    Sign convention: Positive when the perturbation increases the local plasma electrostatic
    potential above the equilibrium value for the same electrical reference.'
  unit: V
  physics_domain: magnetohydrodynamics
  links:
  - name:electrostatic_potential
  - name:normalized_perturbed_electrostatic_potential
  arguments:
  - name: electrostatic_potential
    operator: perturbed
    operator_kind: qualifier
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed/imaginary
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-plasma-phi_potential_perturbed-imaginary
    dd_documentation:
      leaf: Imaginary part
      parent_path: mhd_linear/time_slice/toroidal_mode/plasma/phi_potential_perturbed
      parent: Perturbed electrostatic potential for given toroidal mode number
      data_type: FLT_2D
      unit: V
      coordinates:
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim1
      - mhd_linear/time_slice/toroidal_mode/plasma/grid/dim2
    enhanced_context:
      description: "Imaginary part of the perturbed electrostatic potential (\u03B4\
        \u03C6) eigenfunction for a given toroidal mode number in linear MHD analysis\
        \ within the confined plasma. Together with the real part, it defines the\
        \ complex electrostatic component of the MHD perturbation."
      kind: llm
- name: perturbed_plasma_mass_density_real_part
  kind: complex
  status: active
  description: In-phase component of the complex first-order plasma mass-density eigenfunction
    for one toroidal Fourier harmonic in linear MHD stability theory.
  documentation: 'The quantity is the real, in-phase component of the complex first-order
    plasma mass-density perturbation eigenfunction associated with one toroidal Fourier
    harmonic in linear MHD stability theory. The complete complex quantity is [perturbed
    plasma mass density](name:perturbed_plasma_mass_density).


    The real component is defined by


    $$

    \widetilde{\rho}_{n,\mathrm{real}}(\mathbf{x}) = \operatorname{Re}\!\left[\widetilde{\rho}_n(\mathbf{x})\right]

    $$


    where $\widetilde{\rho}_n$ is the complex first-order mass-density eigenfunction,
    $n$ is the toroidal Fourier mode number, and $\mathbf{x}$ denotes position. The
    decomposition is relative to the phase convention of the complex eigenfunction.


    This quantity excludes the imaginary quadrature component and must not be interpreted
    as the magnitude of the complex perturbation. Its meaning parallels the real component
    of the corresponding temperature eigenfunction, [perturbed plasma temperature
    real part](name:perturbed_plasma_temperature_real_part).'
  unit: kg.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_temperature_real_part
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/mass_density_perturbed/real
    dd_version: 4.1.0
