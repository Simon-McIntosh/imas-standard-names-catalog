- name: roughness_of_optical_element
  kind: scalar
  status: active
  description: 'Roughness of an optical element is an optical roughness parameter
    that quantifies redistribution of reflected radiation between ideal specular and
    ideal diffuse behavior: 0 denotes ideal specular reflection and 1 denotes ideal
    diffuse reflection.'
  documentation: 'Roughness of an optical element is an optical roughness parameter
    that quantifies how the element partitions reflected radiation between a specular
    component and a diffuse component. The endpoint value zero denotes ideal specular
    reflection, and the endpoint value one denotes ideal diffuse reflection.


    The parameter is defined from the reflected-power partition as


    $$

    P_{\mathrm{refl}} = P_{\mathrm{spec}} + P_{\mathrm{diff}}, \qquad r = \frac{P_{\mathrm{diff}}}{P_{\mathrm{refl}}}
    = 1 - \frac{P_{\mathrm{spec}}}{P_{\mathrm{refl}}}, \qquad 0 \le r \le 1

    $$


    where $r$ is the roughness parameter, and $P_{\mathrm{refl}}$, $P_{\mathrm{spec}}$,
    and $P_{\mathrm{diff}}$ are radiant powers in watts for the total reflected, ideal-specular,
    and diffuse reflected components under the same incident radiation and optical
    state.


    This quantity is not a metrological surface-height roughness such as an rms height
    or correlation length. Intermediate values specify the diffuse fraction of reflected
    power in the stated partition; they do not by themselves prescribe the angular
    distribution of the diffuse component, require Lambertian scattering, or include
    transmitted or absorbed power.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:surface_roughness_of_optical_element
  sources:
  - dd_path: camera_ir/optical_element/material_properties/roughness
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-optical_element-material_properties-roughness
    dd_documentation:
      leaf: Roughness parameter of the material. Varies in range [0, 1]. 0 is perfectly
        specular, 1 is perfectly rough
      parent_path: camera_ir/optical_element/material_properties
      parent: Material properties of the optical element
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - camera_ir/optical_element/material_properties/wavelengths
    enhanced_context:
      description: Surface roughness parameter of an IR camera optical element, ranging
