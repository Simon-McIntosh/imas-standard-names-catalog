- name: vertical_coordinate_of_bolometer
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of the center of a bolometer detector in the
    right-handed cylindrical (R, phi, Z) frame, where R is major radius, phi is toroidal
    angle, and Z is vertical height.
  documentation: 'The vertical coordinate of a bolometer is the $Z$ position of the
    detector center in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$
    is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. The coordinate
    value is measured in meters relative to the device coordinate origin and locates
    the detector center above or below the reference midplane.


    This coordinate is determined from the diagnostic geometry, typically using mechanical
    design data, metrology surveys, or alignment calibration. Together with the detector
    radial coordinate, toroidal angle, aperture position, and viewing direction, it
    contributes to the geometric definition of a bolometer line of sight or viewing
    cone, but does not by itself define the full chord geometry.


    Typical values are device dependent. Detector centers are commonly near diagnostic
    ports or the vessel periphery, with $Z$ values of about -2 to 2 m in medium-sized
    tokamaks and up to roughly -10 to 10 m in large devices.


    Sign convention: Positive when the detector center lies in the $+Z$ direction,
    vertically above the coordinate origin.'
  unit: m
