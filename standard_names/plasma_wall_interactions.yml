- name: neutral_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident wall-normal arrival flux density of neutral atoms and molecules
    in the kinetic-energy channel reaching a plasma-facing wall, summed over neutral
    species and internal quantum states. It counts particle arrivals per unit wall
    area and time, expressed in arrivals per square meter per second, and is not a
    heat flux in watts per square meter.
  documentation: 'Neutral energy flux at the wall is the incident arrival flux density
    of neutral atoms and molecules associated with the kinetic-energy channel at a
    plasma-facing surface, summed over all neutral species and internal quantum states.
    Despite the term "energy flux" in the name, its canonical unit is particle arrivals
    per square meter per second, so it is a particle-rate quantity and not an energy-weighted
    heat flux in watts per square meter.


    For a point on the wall it is defined from the inward-directed part of the neutral
    velocity distribution as the wall-normal arrival rate per unit area:


    $$

    \Gamma^{\mathrm{inc}} = \sum_{\alpha} \int_{\mathbf{v}\cdot\hat{\mathbf{n}}_p<0}
    \left(-\mathbf{v}\cdot\hat{\mathbf{n}}_p\right) f_{\alpha}^{0}(\mathbf{x}_w,\mathbf{v})\,
    d^3v

    $$


    where $\Gamma^{\mathrm{inc}}$ has units $\mathrm{m^{-2}\,s^{-1}}$, $\alpha$ labels
    neutral species and internal states, $\hat{\mathbf{n}}_p$ is the unit normal pointing
    from the material wall toward the plasma, $\mathbf{x}_w$ is the wall position
    in meters, $\mathbf{v}$ is the neutral velocity in meters per second, and $f_{\alpha}^{0}$
    is the neutral distribution function with units $\mathrm{s^3\,m^{-6}}$. No factor
    of kinetic energy multiplies the integrand: an energy-weighted neutral heat flux
    would require weighting by $E_k = m_{\alpha} v^2 / 2$ and would instead carry
    units $\mathrm{W\,m^{-2}}$.


    This quantity is obtained from neutral transport modeling and kinetic wall tallies
    that accumulate inward-crossing neutral trajectories, with contributions summed
    over atomic, molecular, and excited populations. It is the species- and state-summed
    counterpart of [neutral_state_energy_flux_at_wall](name:neutral_state_energy_flux_at_wall);
    the analogous quantity without the kinetic-channel qualifier is [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),
    whose state-resolved form is [neutral_state_particle_flux_at_wall](name:neutral_state_particle_flux_at_wall).
    It should be distinguished from [energy_flux_at_wall](name:energy_flux_at_wall_due_to_eddy_current),
    which is an energy-weighted wall loading rather than a particle-rate flux.


    Typical values are about $10^{18}-10^{21}\ \mathrm{m^{-2}\,s^{-1}}$ on main-chamber
    surfaces and $10^{21}-10^{24}\ \mathrm{m^{-2}\,s^{-1}}$ in strongly recycling
    divertor or limiter regions, depending on plasma density, recycling coefficient,
    fueling rate, and wall geometry.


    Sign convention: Positive when neutral particles cross the wall surface from the
    plasma side toward the material wall.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_state_energy_flux_at_wall
  - name:neutral_particle_flux_at_wall
  - name:neutral_state_particle_flux_at_wall
  - name:energy_flux_at_wall_due_to_eddy_current
  arguments:
  - name: energy_flux_at_wall
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/incident/values
    status: composed
- name: neutral_energy_flux_at_wall_due_to_recombination
  kind: scalar
  status: draft
  description: Flux density of neutral recombination products leaving a plasma-facing
    wall surface in a specified kinetic-energy interval. It is an energy-resolved
    particle flux, with unit m^-2.s^-1 for the interval, not an energy or heat load.
  documentation: 'Neutral energy flux at a wall due to recombination is the number
    flux per unit wall area and per unit time of neutral atoms or molecules produced
    by recombination at or very near a plasma-facing surface and emitted into the
    plasma-facing volume in a specified kinetic-energy interval. The word energy identifies
    the kinetic-energy channel of the neutral product; the quantity is not the energy-weighted
    heat flux.


    The energy-channel particle flux can be written as the velocity-space moment of
    the neutral distribution of recombination products leaving the surface:


    $$

    \Gamma^{\mathrm{rec}}_{n,\Delta E}(\mathbf{x}_w)=\int_{m_n |\mathbf{v}|^2/2 \in
    \Delta E,\ \mathbf{v}\cdot\hat{\mathbf{n}}_p>0} f^{\mathrm{rec}}_n(\mathbf{x}_w,\mathbf{v})\,(\mathbf{v}\cdot\hat{\mathbf{n}}_p)\,d^3v

    $$


    where $\Gamma^{\mathrm{rec}}_{n,\Delta E}$ is the recombination neutral flux in
    the kinetic-energy interval $\Delta E$, $\mathbf{x}_w$ is a point on the wall
    surface, $m_n$ is the neutral-particle mass, $\mathbf{v}$ is neutral velocity,
    $f^{\mathrm{rec}}_n$ is the velocity distribution of recombination products, and
    $\hat{\mathbf{n}}_p$ is the unit normal directed from the material surface into
    the plasma-facing volume. The result has unit $\mathrm{m}^{-2}\,\mathrm{s}^{-1}$;
    a differential spectrum $d\Gamma/dE$ must be integrated over an energy interval
    to give this quantity. An energy-weighted heat-flux contribution would instead
    use an additional kinetic-energy moment and have units of power per area.


    In practice this flux is computed from plasma-wall interaction and neutral-transport
    models using the incident charged-particle flux, recombination probability, wall
    material, surface temperature, accommodation physics, and the angular and energy
    distribution of emitted neutral products. Experimental constraints are usually
    indirect, coming from neutral spectroscopy, gas balance, pressure measurements,
    and particle-balance consistency with edge plasma diagnostics.


    Typical values span a wide range because recombination is strongly localized by
    recycling conditions. Main-chamber wall values may be 10^16-10^20 m^-2.s^-1 for
    a broad energy interval, while actively recycling limiter or divertor regions
    commonly reach 10^20-10^23 m^-2.s^-1 and can approach 10^24 m^-2.s^-1 in high-recycling
    or detached conditions.


    Sign convention: Positive when neutral recombination products cross the wall surface
    from the material surface into the plasma-facing volume.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_recombination
  - name:ion_energy_flux_at_wall_due_to_recombination
  - name:neutral_particle_flux_at_wall_due_to_recombination
  - name:neutral_state_energy_flux_due_to_recombination
  arguments:
  - name: energy_flux_at_wall_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/incident/values
    status: composed
- name: neutral_state_energy_flux_at_wall
  kind: scalar
  status: draft
  description: Incident arrival flux density at a wall surface for neutral particles
    in a specified internal quantum state and kinetic-energy channel. It counts neutral
    arrivals per unit wall area and time, not kinetic power or heat deposited on the
    wall.
  documentation: 'State-resolved neutral energy-channel flux at a wall surface is
    the rate at which neutral particles in a specified internal quantum state and
    kinetic-energy interval strike unit wall area. The energy label denotes how the
    arrivals are sorted by kinetic energy; the quantity is an arrival flux density
    with unit m^-2 s^-1. It is not a wall heat flux and contains no multiplication
    by the particle kinetic energy or by an energy-deposition coefficient.


    For a neutral velocity distribution at the wall, the bin-integrated incident flux
    can be written as:


    $$

    \Gamma_{n,s,\Delta E}(\mathbf{x}_w) =

    \int_{\mathbf{v}\cdot\hat{\mathbf{n}}}_w < 0

    |\mathbf{v}\cdot\hat{\mathbf{n}}_w|\,

    f_{n,s}(\mathbf{x}_w,\mathbf{v})\,

    \chi_{\Delta E}\!\left(\frac{1}{2}m_n |\mathbf{v}|^2\right)\, d^3v

    $$


    where $\Gamma_{n,s,\Delta E}$ is the incident neutral arrival flux density for
    internal state $s$ and kinetic-energy interval $\Delta E$, $\mathbf{x}_w$ is the
    wall-surface position, $\hat{\mathbf{n}}_w$ is the unit normal pointing from the
    wall into the plasma, $f_{n,s}$ is the neutral velocity distribution for state
    $s$, $m_n$ is the neutral particle mass, and $\chi_{\Delta E}$ selects particles
    whose kinetic energy lies in the chosen interval. The indicator selects arrivals
    by energy but does not weight them by energy.


    In practice this quantity is obtained from neutral transport calculations or particle
    tallies by counting wall crossings toward the material and sorting them by internal
    state and kinetic-energy interval. Experimental constraints come indirectly from
    edge spectroscopy, pressure measurements, and recycling diagnostics; wall calorimetry
    measures deposited power and must be interpreted with a model before it can be
    related to this arrival flux.


    Typical values for individual state and energy selections range from 10^15-10^20
    m^-2 s^-1 on main-chamber surfaces and from 10^20-10^23 m^-2 s^-1 in high-recycling
    or detached divertor regions. Values depend strongly on neutral density, recycling
    conditions, molecular dissociation, ionization balance, and the width of the kinetic-energy
    interval.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_at_wall
  - name:neutral_state_energy_flux_due_to_recombination
  arguments:
  - name: energy_flux_at_wall
    operator: neutral_state
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/kinetic/neutral/state/incident/values
    status: composed
- name: neutral_state_energy_flux_due_to_recombination
  kind: scalar
  status: draft
  description: Incident energy-resolved flux density of neutral particles in a specified
    quantum state produced by recombination and directed toward a plasma-facing wall
    surface.
  documentation: 'Neutral state energy flux due to recombination is the incident,
    energy-resolved flux density of neutral particles in a specified quantum state
    that are produced by recombination and cross a plasma-facing surface toward the
    material. It counts the neutral particle flow associated with a kinetic-energy
    channel and internal state, so its canonical unit is m^-2 s^-1 rather than power
    per unit area.


    For a surface element with unit normal $\hat{\mathbf n}_w$ directed from the material
    toward the plasma, the incident flux in state $q$ and energy interval $\Delta
    E$ may be written as


    $$

    \Gamma_{q,\Delta E}^{\mathrm{rec,inc}} = \int_{\mathbf v\cdot\hat{\mathbf n}_w
    < 0,\ E(\mathbf v)\in\Delta E} \left(-\mathbf v\cdot\hat{\mathbf n}_w\right) f_q^{\mathrm{rec}}(\mathbf
    x_w,\mathbf v)\,d^3v

    $$


    where $f_q^{\mathrm{rec}}$ is the velocity distribution of recombination-produced
    neutrals in quantum state $q$ at wall position $\mathbf x_w$, $E(\mathbf v)$ is
    their kinetic energy, and $-\mathbf v\cdot\hat{\mathbf n}_w$ is the positive speed
    component into the wall. Integrating over energy intervals and summing over neutral
    states gives the corresponding total recombination-produced incident neutral flux.


    In practice this quantity is obtained from edge-plasma and plasma-wall interaction
    modeling, neutral transport calculations, or diagnostics combined with a collisional-radiative
    model that resolves recombination channels and neutral-state populations. It is
    non-negative because only particles crossing toward the surface are included;
    neutrals moving away from the surface are part of the outgoing flux, not the incident
    flux.


    Typical values depend strongly on plasma density, electron temperature near the
    surface, recycling, and detached-divertor conditions. Representative incident
    state-resolved recombination fluxes can range from 10^16-10^22 m^-2 s^-1, with
    the largest values usually occurring in cold, dense recombining boundary plasmas.'
  unit: m^-2.s^-1
  physics_domain: plasma_wall_interactions
  links:
  - name:neutral_energy_flux_due_to_recombination
  - name:energy_flux_due_to_recombination
  - name:neutral_state_energy_flux_at_wall
  - name:neutral_state_particle_flux_at_wall_due_to_recombination
  - name:ion_state_energy_flux_at_wall_due_to_recombination
  arguments:
  - name: energy_flux_due_to_recombination
    operator: neutral_state
    operator_kind: qualifier
  sources:
  - id: dd:wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/incident/values
    dd_path: wall/description_ggd/ggd/energy_fluxes/recombination/neutral/state/incident/values
    status: composed
- name: nitrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of ionized nitrogen in the boundary plasma immediately
    adjacent to a limiter. It represents the local nitrogen impurity ion population,
    normally summed over ion charge states.
  documentation: 'Ionized nitrogen density at a limiter is the local number of nitrogen
    impurity ions per unit volume in the boundary plasma immediately adjacent to a
    limiter surface. Unless a charge-state-specific quantity is named, it denotes
    the sum over all ionized nitrogen charge states $N^{q+}$ with $q=1,\ldots,7$ and
    excludes neutral nitrogen atoms or molecules.


    The charge-state-summed density is the zeroth velocity-space moment of the nitrogen
    ion distribution functions:


    $$

    n_N^{\mathrm{ion}} = \sum_{q=1}^{7} n_{N^{q+}} = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{v})
    \, d^3v

    $$


    where $n_N^{\mathrm{ion}}$ is the total ionized nitrogen number density in m^-3,
    $n_{N^{q+}}$ is the number density of charge state $q$ in m^-3, $f_{N^{q+}}(\mathbf{v})$
    is the velocity-space distribution function with units s^3 m^-6, and $d^3v$ is
    the velocity-space volume element with units m^3 s^-3.


    In experiments, this quantity is typically inferred from impurity spectroscopy
    together with atomic data, local electron density and temperature constraints,
    and edge plasma modeling. In simulations or reconstructions that resolve nitrogen
    charge states, the limiter value is obtained by summing the local ionized charge-state
    densities adjacent to the limiter; neutral nitrogen is treated separately.


    Typical summed ionized nitrogen densities near limiters are about $10^{14}$-$10^{17}$
    m^-3 for trace or weakly seeded nitrogen and can reach $10^{17}$-$10^{19}$ m^-3
    during strong nitrogen seeding or local nitrogen release. The value depends on
    the limiter source rate, ionization balance, recombination, and transport along
    the boundary plasma.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:nitrogen_density_at_pedestal
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:argon_density_at_limiter
  - name:neon_density_at_limiter
  - name:density_at_limiter
  arguments:
  - name: density_at_limiter
    operator: nitrogen
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/limiter/n_i/nitrogen/value
    dd_path: summary/local/limiter/n_i/nitrogen/value
    status: composed
- name: oxygen_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed number density of ionized oxygen impurity immediately
    adjacent to a limiter surface at the plasma-wall interface.
  documentation: 'Oxygen density at a limiter is the local number density of ionized
    oxygen impurity in the plasma immediately adjacent to the limiter surface. It
    is species-specific and charge-state-summed, so it represents oxygen ions only,
    not neutral oxygen or electrons.


    For oxygen ion charge states from singly ionized to fully stripped, the charge-state-summed
    limiter density is defined as:


    $$

    n_{\mathrm{O,lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{O,lim}}$ and each charge-state density $n_{\mathrm{O}^{q+},\mathrm{lim}}$
    are number densities in m^-3, $q$ is the dimensionless ion charge state, and the
    upper limit 8 is the nuclear charge of oxygen. The neutral state $q=0$ is excluded.


    In practice, this quantity is estimated from oxygen spectral line emission together
    with collisional-radiative or ionization-balance modeling, or from edge plasma
    and impurity-transport calculations constrained by local plasma conditions and
    wall-interaction source terms. It is the limiter-local counterpart of [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    and is interpreted alongside limiter plasma quantities such as [electron_density_at_limiter](name:electron_density_at_limiter).


    Typical limiter-adjacent oxygen ion densities are strongly device- and scenario-dependent
    and are usually trace impurity values relative to the local electron density.
    Representative order-of-magnitude values can range from 10^14-10^18 m^-3 in clean
    or moderately conditioned edge plasmas, with larger transient values possible
    during enhanced oxygen influx or strong plasma-wall interaction.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_limiter
  - name:nitrogen_density_at_limiter
