- name: total_external_heating_power
  kind: scalar
  status: active
  description: Aggregate zero-or-positive non-inductive auxiliary heating power absorbed
    or deposited in the plasma, including neutral-beam and radio-frequency heating
    contributions and excluding Ohmic inductive heating.
  documentation: 'Total external heating power is the aggregate zero-or-positive auxiliary
    heating power absorbed or deposited in the plasma by external non-inductive heating
    systems. It includes plasma-coupled contributions from neutral-beam injection
    and radio-frequency systems such as electron-cyclotron, ion-cyclotron, and lower-hybrid
    heating, and excludes Ohmic inductive heating. It is zero when no external auxiliary
    heating power is absorbed or deposited in the plasma.


    The aggregate is defined as the scalar sum of absorbed auxiliary-heating contributions:


    $$

    P_\mathrm{ext} = \sum_i P_{i,\mathrm{abs}}

    $$


    where $P_\mathrm{ext}$ and each $P_{i,\mathrm{abs}}$ are powers expressed in watts,
    and $i$ indexes the auxiliary heating systems included in the aggregate.


    This quantity represents absorbed or deposited plasma power, not source electrical
    input, generator power, launched radio-frequency power, transmitted-line power,
    or neutral-beam power before plasma absorption. Component contributions include
    quantities such as [total power due to electron cyclotron heating](name:total_power_due_to_electron_cyclotron_heating),
    [total power due to ion cyclotron heating](name:total_power_due_to_ion_cyclotron_heating),
    and [absorbed power of neutral beam injector](name:absorbed_power_of_neutral_beam_injector).
    The launched neutral-beam quantity [total power of neutral beam injector](name:total_power_of_neutral_beam_injector)
    is distinct because it is defined before absorption losses, whereas this aggregate
    includes only the absorbed contribution.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_power_due_to_electron_cyclotron_heating
  - name:total_power_due_to_ion_cyclotron_heating
  sources:
  - dd_path: summary/heating_current_drive/power_additional/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-power_additional-value
    dd_documentation:
      leaf: Value
      parent_path: summary/heating_current_drive/power_additional
      parent: Total additional external power (NBI+EC+IC+LH, without ohmic) coupled
        to the plasma
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Total additional external heating power coupled to the plasma,
        summing all auxiliary heating systems (NBI, EC, IC, and LH) excluding Ohmic
        power. Represents the total non-inductive power input driving plasma heating
        and current drive.
      kind: template
- name: total_power_due_to_electron_cyclotron_heating
  kind: scalar
  status: active
  description: Total power due to electron cyclotron heating is the net radiofrequency
    power absorbed by the plasma from all electron-cyclotron wave sources through
    resonant electron-cyclotron interactions. It excludes launched, transmitted, reflected,
    and unabsorbed shine-through power.
  documentation: 'Total power due to electron cyclotron heating is the net radiofrequency
    power absorbed by the plasma from all electron-cyclotron wave sources through
    resonant interaction with electrons at the electron cyclotron frequency or its
    harmonics. It is an absorbed heating power, not the generated, launched, transmitted,
    reflected, or unabsorbed radiofrequency power.


    The total absorbed electron-cyclotron heating power is the sum of the net absorbed
    powers from the contributing electron-cyclotron sources:


    $$

    P_\mathrm{EC} = \sum_{s=1}^{N_\mathrm{EC}} P_{\mathrm{EC},s}

    $$


    where $N_\mathrm{EC}$ is the number of contributing electron-cyclotron sources,
    $P_{\mathrm{EC},s}$ is the net electron-cyclotron power absorbed by the plasma
    from source $s$ expressed in watts, and $P_\mathrm{EC}$ is the total absorbed
    electron-cyclotron heating power expressed in watts.


    The per-source contribution is [power_due_to_electron_cyclotron_heating](name:power_due_to_electron_cyclotron_heating).
    This quantity is non-negative and is zero when no electron-cyclotron power is
    absorbed by the plasma; it is a component of [total_external_heating_power](name:total_external_heating_power)
    when total external heating is formed over all auxiliary heating methods.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_electron_cyclotron_heating
  arguments:
  - name: power_due_to_electron_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: summary/heating_current_drive/power_ec/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-power_ec-value
    dd_documentation:
      leaf: Value
      parent_path: summary/heating_current_drive/power_ec
      parent: Total EC power coupled to the plasma
      data_type: FLT_1D
      unit: W
      coordinates:
      - summary/time
    enhanced_context:
      description: Total electron cyclotron (EC) heating power coupled to the plasma.
        Represents the absorbed RF power delivered to the plasma by ECRH systems,
        a key global energy input parameter.
      kind: template
- name: total_power_due_to_ion_cyclotron_heating
  kind: scalar
  status: active
  description: Total net radio-frequency power absorbed by the plasma through ion
    cyclotron resonance heating, summed over all ion-cyclotron launchers or antenna
    systems. It excludes power that is launched but reflected or lost before coupling
    to the plasma.
  documentation: "Total power due to ion cyclotron heating is the total rate at which\
    \ electromagnetic wave power in the ion-cyclotron frequency range is coupled from\
    \ all launchers to the plasma.\n\nThe total coupled power is\n\n$$\nP_{IC} = \\\
    sum_a P_{IC,a}\n$$\n\nwhere $P_{IC,a}$ is the power coupled to the plasma from\
    \ launcher $a$, given per launcher by [power_due_to_ion_cyclotron_heating](name:power_due_to_ion_cyclotron_heating).\
    \ Coupled power is the net wave power crossing the antenna\u2013plasma boundary:\
    \ it excludes generator output, reflected power, and transmission and antenna\
    \ losses, and it is not reduced by any subsequent incomplete absorption of the\
    \ coupled wave field within the plasma."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_ion_cyclotron_heating
  - name:reflected_power_of_ion_cyclotron_heating_antenna
