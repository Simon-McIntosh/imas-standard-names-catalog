- name: toroidal_plasma_momentum_at_measurement_position
  kind: scalar
  status: draft
  description: Local density of toroidal angular momentum of the plasma at a diagnostic
    measurement position, equal to the major-radius lever arm times the total toroidal
    linear momentum density. The total includes electrons and all ion species.
  documentation: 'Toroidal plasma momentum at a measurement position is the local
    density of angular momentum about the toroidal symmetry axis. It is the major-radius
    lever arm multiplying the toroidal component of the total plasma linear momentum
    density at the sampled point, including electrons and all ion species.


    For a measurement point $\mathbf{x}_m$, the quantity is defined by


    $$

    \ell_\phi(\mathbf{x}_m) = R_m \sum_{s \in \{e,\mathrm{ions}\}} n_s(\mathbf{x}_m)\,m_s\,V_{\phi,s}(\mathbf{x}_m)

    $$


    where $R_m$ is the major radius of the measurement point in the right-handed cylindrical
    $(R, \phi, Z)$ frame, $n_s$ is the number density of species $s$, $m_s$ is its
    particle mass, and $V_{\phi,s}$ is its toroidal linear velocity component. The
    factor $R_m$ converts toroidal linear momentum density to angular momentum density
    about the symmetry axis, giving units of $\mathrm{kg\,m^{-1}\,s^{-1}}$.


    In charge exchange recombination spectroscopy, the ion contribution is commonly
    inferred from Doppler shifts of impurity emission together with geometry, density,
    and species-composition information. Main-ion and electron contributions may be
    measured, inferred, or modeled; the electron term is included in the total definition
    but is usually small because of the electron mass.


    Typical magnitudes range from $10^{-4}$ to $1\ \mathrm{kg\,m^{-1}\,s^{-1}}$ in
    tokamak plasmas, depending mainly on density, major radius, ion mass, and toroidal
    rotation speed. Strongly beam-driven or rapidly rotating plasmas can reach several
    $\mathrm{kg\,m^{-1}\,s^{-1}}$ locally, while weakly rotating plasmas may be close
    to zero.


    Sign convention: Positive when the total toroidal linear momentum density points
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: kg.m^-1.s^-1
  physics_domain: particle_measurement_diagnostics
  links:
  - name:toroidal_plasma_angular_momentum_density
  - name:toroidal_plasma_momentum_at_magnetic_axis
