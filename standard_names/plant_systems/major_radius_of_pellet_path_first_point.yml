name: major_radius_of_pellet_path_first_point
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of the first point defining the geometric
  path of a pellet through the tokamak cross-section.
documentation: "The major radius of the pellet path first point $R_{\\mathrm{p,1}}$\
  \ (in m) specifies the $R$ coordinate (distance from the machine symmetry axis)\
  \ of the starting location of the pellet trajectory inside the vacuum vessel. This\
  \ anchor point, together with its vertical coordinate counterpart and subsequent\
  \ path points, defines the straight-line or curved injection geometry used by ablation\
  \ and deposition models. Typical values range from the inboard wall radius ($R \\\
  approx 1$\u20132 m in medium tokamaks) for high-field-side injection to the outboard\
  \ midplane ($R \\approx 2$\u20134 m) for low-field-side injection; ITER values are\
  \ approximately 4\u20138 m depending on injector port. The coordinate is usually\
  \ derived from engineering drawings or laser-alignment surveys of the guide tube\
  \ exit. See also `major_radius_of_x_point` for a related geometric coordinate and\
  \ `pellet_size` for the pellet dimensions at injection."
