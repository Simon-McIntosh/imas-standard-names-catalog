- name: toroidal_neon_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "Toroidal neon velocity at the plasma boundary is the toroidal component\
    \ of the density-weighted bulk velocity of neon impurity ions at the last closed\
    \ flux surface, in the right-handed cylindrical (R, \u03C6, Z) frame. It is the\
    \ density-weighted mean over all neon ion charge states and is local, not a flux-surface\
    \ average."
  documentation: 'Toroidal neon velocity at the plasma boundary is the toroidal component
    of the density-weighted bulk velocity of neon impurity ions at the last closed
    flux surface. The toroidal component is taken in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. Because no neon ionization state is specified, the elemental
    neon velocity is the density-weighted mean over all neon ion charge states present
    at that locus.


    The component and charge-state aggregation are defined by


    $$

    v_{\phi,\mathrm{Ne}} = \left(\frac{\sum_q n_{\mathrm{Ne}^{q+}}\,\mathbf{v}_{\mathrm{Ne}^{q+}}}{\sum_q
    n_{\mathrm{Ne}^{q+}}}\right) \cdot \hat{\phi}

    $$


    where $q$ indexes neon ion charge states, $n_{\mathrm{Ne}^{q+}}$ is the number
    density of charge state $q$, $\mathbf{v}_{\mathrm{Ne}^{q+}}$ is its bulk velocity,
    and $\hat{\phi}$ is the unit vector in the direction of increasing toroidal angle
    $\phi$.


    This quantity is a local boundary value and does not imply a flux-surface average,
    poloidal average, toroidal average, or charge-state sum. The flux-surface-averaged
    boundary counterpart is [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary);
    the same toroidal component at other radial loci includes [toroidal_neon_velocity_at_magnetic_axis](name:toroidal_neon_velocity_at_magnetic_axis)
    and [toroidal_neon_velocity_at_internal_transport_barrier](name:toroidal_neon_velocity_at_internal_transport_barrier).


    Sign convention: Positive when the density-weighted neon ion flow is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
