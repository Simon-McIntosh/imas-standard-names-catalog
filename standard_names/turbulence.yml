    status: composed
- name: normalized_gyrocenter_pressure
  kind: scalar
  status: draft
  description: Normalized scalar pressure moment of the perturbed gyrocenter distribution,
    computed as the sum of parallel and perpendicular components weighted by the first-order
    Bessel function.
  documentation: 'The normalized gyrocenter pressure $\langle p \rangle = \langle
    p_\parallel \rangle + \langle p_\perp \rangle$ is the summed parallel and perpendicular
    pressure moments of the perturbed gyrocenter distribution function, weighted by
    the finite-Larmor-radius Bessel factor $J_1(k_\perp \rho_i)$. This quantity emerges
    from the gyrokinetic moment hierarchy for a linear eigenmode at a prescribed wavevector
    $(k_x, k_y)$ and describes the effective pressure perturbation experienced by
    the bulk gyrocenter population due to electromagnetic fluctuations. In local gyrokinetic
    flux-tube simulations, it is routinely computed as a diagnostic of turbulent transport
    amplitude alongside [normalized_particle_pressure](name:normalized_particle_pressure)
    and [gyrocenter_particle_flux](name:gyrocenter_particle_flux). The perpendicular-energy-weighted
    moment [normalized_energy](name:normalized_energy) provides a related higher-order
    velocity-space diagnostic. Typical values in ITG-driven turbulence are order-unity
    when normalized to the equilibrium scale $n_0 T_0$.


    Sign convention: Positive when the perturbed pressure moment $\langle p \rangle$
    is aligned in sign with the eigenmode phase, consistent with the convention for
    the parent eigenmode amplitude.


    References: [normalized_parallel_gyrocenter_current_density](name:normalized_parallel_gyrocenter_current_density)
    for the analogous current moment at the same Bessel order.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_pressure
  - name:gyrocenter_particle_flux
  - name:normalized_energy
  - name:normalized_parallel_gyrocenter_current_density
  sources:
