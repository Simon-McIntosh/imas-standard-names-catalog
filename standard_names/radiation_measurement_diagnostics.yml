- name: upper_bound_energy_of_detector_pixel
  kind: scalar
  status: draft
  description: High-energy edge of the photon spectral acceptance interval for a detector
    pixel in an X-ray crystal spectrometer. It is the maximum photon energy included
    in that pixel's bandpass.
  documentation: 'The upper bound energy of a detector pixel is the largest photon
    energy accepted within that pixel''s spectral bandpass. In a dispersive X-ray
    crystal spectrometer it marks the high-energy edge of the interval over which
    photons diffracted by the crystal are assigned to that pixel, complementing the
    lower bound and bracketing the representative pixel energy.


    For a crystal reflection, the high-energy edge is related to the Bragg angle at
    the corresponding edge of the pixel acceptance:


    $$

    E_{\mathrm{upper}} = \frac{n h c}{2 d \sin\theta_{\mathrm{upper}}}

    $$


    where $E_{\mathrm{upper}}$ is in eV, $n$ is the dimensionless diffraction order,
    $h$ is Planck''s constant in eV s, $c$ is the speed of light in $m\,s^{-1}$, $d$
    is the lattice-plane spacing in meters, and $\theta_{\mathrm{upper}}$ is the Bragg
    angle in radians. Equivalently, $n\lambda_{\mathrm{upper}} = 2d\sin\theta_{\mathrm{upper}}$
    with photon wavelength $\lambda_{\mathrm{upper}}$ in meters and $E_{\mathrm{upper}}
    = hc/\lambda_{\mathrm{upper}}$.


    In practice this quantity is obtained from the calibrated mapping between detector
    position and photon energy, using the crystal spacing, diffraction order, spectrometer
    geometry, and detector pixel extent. Calibration may be refined with known spectral
    lines, and the resulting bound can include effects from finite pixel size, crystal
    rocking curve, source extent, alignment uncertainty, and the chosen definition
    of the pixel response threshold.


    Typical upper-bound energies for fusion X-ray crystal spectrometers are 1000-20000
    eV. The separation from the corresponding lower bound is often 1-50 eV in high-resolution
    line spectroscopy and can be larger for broad-band or lower-dispersion configurations.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_bound_energy_of_detector_pixel
  - name:energy_of_detector_pixel
  arguments:
  - name: energy_of_detector_pixel
    operator: upper_bound
    operator_kind: qualifier
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/energy_bound_upper
    dd_path: spectrometer_x_ray_crystal/channel/energy_bound_upper
    status: attached
  - id: dd:spectrometer_x_ray_crystal/energy_bound_upper
    dd_path: spectrometer_x_ray_crystal/energy_bound_upper
    status: composed
- name: upper_bound_wavelength_of_camera
  kind: scalar
  status: draft
  description: Long-wavelength (red-side) cutoff of the spectral sensitivity band
    of a visible camera detector channel, above which photons fall outside the detector
    response.
  documentation: 'The upper bound wavelength is the long-wavelength edge of the spectral
    acceptance band of a visible camera detector channel. Photons with wavelengths
    exceeding this value lie outside the detector''s sensitivity range and do not
    contribute to the measured signal. Together with the lower-wavelength cutoff,
    it defines the complete bandpass window within which photon flux from the plasma
    is integrated.


    The effective spectral bandwidth of the detection channel is


    $$

    \Delta\lambda = \lambda_{\mathrm{upper}} - \lambda_{\mathrm{lower}}

    $$


    where $\lambda_{\mathrm{lower}}$ is the short-wavelength (blue-side) cutoff. The
    [calibration factor of the visible camera] converts counts integrated over this
    window to absolute photon radiance.


    The spectral cutoff is governed by the photodetector material''s quantum efficiency
    rolloff and any bandpass interference filters placed in the optical collection
    path. Narrow-band filtered channels constrain the upper bound to within a few
    nanometers above the center of a target plasma emission line, while broadband
    unfiltered channels are bounded by the sensor''s intrinsic material response.


    Typical upper bound values for silicon-based sensors range from approximately
    $6 \times 10^{-7}$ to $1.1 \times 10^{-6}$ m; channels targeting D-alpha (approximately
    $6.56 \times 10^{-7}$ m) or He-I (approximately $5.87 \times 10^{-7}$ m) emission
    use narrow bandpass filters with upper cutoffs placed a few nanometers above the
    respective line centers.


    Sign convention: Positive when the wavelength corresponds to a physically realizable
    electromagnetic wave, as all electromagnetic wavelengths are intrinsically positive-valued
    lengths.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:camera_visible/channel/detector/wavelength_upper
    dd_path: camera_visible/channel/detector/wavelength_upper
    status: composed
- name: upper_photon_energy
  kind: scalar
  status: draft
  description: Upper photon energy bound defining the high-energy threshold of an
    X-ray detector channel spectral sensitivity window.
  documentation: "The upper photon energy bound marks the maximum photon energy at\
    \ which a detector channel registers photon counts, defining the high-energy edge\
    \ of the band over which photon flux is integrated. Together with [lower_photon_energy](name:lower_photon_energy),\
    \ it fully specifies the energy band used for spectrally resolved X-ray bremsstrahlung\
    \ measurements in both soft and hard X-ray diagnostics.\n\nThe photon energy $E_\\\
    gamma$ relates to radiation frequency $\\nu$ and wavelength $\\lambda$ through:\n\
    \n$$\nE_\\gamma = h\\nu = \\frac{hc}{\\lambda}\n$$\n\nwhere $h \\approx 4.136\
    \ \\times 10^{-15}$ eV\xB7s is Planck's constant and $c$ is the speed of light\
    \ in vacuum.\n\nThe upper energy limit is set by detector material properties,\
    \ filter transmittance, and electronic discriminator thresholds in the pulse-height\
    \ analyzer. Soft X-ray channel upper bounds span roughly 0.1\u201310 keV; hard\
    \ X-ray diagnostic channels extend to tens to hundreds of keV depending on detector\
    \ type. The analogous threshold for crystal spectrometer cameras is [upper_bound_energy_of_detector_pixel](name:upper_bound_energy_of_detector_pixel).\n\
    \nSign convention: Positive for all physical photon energies, as $E_\\gamma =\
    \ h\\nu > 0$ for any non-zero photon frequency."
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:lower_photon_energy
  - name:upper_bound_energy_of_detector_pixel
  sources:
