  - id: dd:spectrometer_x_ray_crystal/crystal/angular_span_horizontal
    dd_path: spectrometer_x_ray_crystal/crystal/angular_span_horizontal
    status: composed
- name: total_neutron_source_rate_due_to_thermal_fusion
  kind: scalar
  status: draft
  description: Total neutron production rate from thermonuclear reactions among Maxwellian
    bulk ions, summed over neutron-producing DD, DT, and TT branches. It excludes
    beam-target, beam-beam, fusion-product, radio-frequency-tail, and other fast-ion
    fusion contributions.
  documentation: 'The total neutron source rate due to thermal fusion is the number
    of neutrons produced per unit time by fusion reactions between bulk ions whose
    velocity distributions are locally Maxwellian. It is the thermal component of
    [total neutron source rate due to fusion], made from neutron-producing D-D, D-T,
    and T-T reaction branches. Neutron multiplicity is counted, and non-Maxwellian
    fast-ion reactions are excluded.


    The thermal source rate can be expressed as a volume integral of local Maxwellian
    reaction rates:


    $$

    S_n^{\mathrm{th}} = \int_V \sum_r \nu_{n,r}\,\frac{n_{a_r} n_{b_r}}{1+\delta_{a_r
    b_r}}\,\langle \sigma v \rangle_r(T_{a_r},T_{b_r})\,dV

    $$


    where $S_n^{\mathrm{th}}$ is the total thermal neutron source rate, $r$ labels
    neutron-producing reaction branches, $\nu_{n,r}$ is the number of neutrons emitted
    by branch $r$, $n_{a_r}$ and $n_{b_r}$ are reactant ion densities, $\delta_{a_r
    b_r}$ is one for identical reactants and zero otherwise, and $\langle \sigma v
    \rangle_r$ is the Maxwellian-averaged fusion reactivity. The denominator prevents
    double counting of identical ion pairs; for D-D fusion, the D(d,n)$^3\mathrm{He}$
    branch is counted and the D(d,p)T branch is not.


    In practice, this quantity is computed from reconstructed ion density, ion temperature,
    fuel composition, and plasma volume using tabulated or fitted Maxwellian reactivities.
    It is inferred experimentally from absolutely calibrated neutron measurements,
    such as fission chambers, activation systems, scintillators, or neutron cameras,
    with corrections for detector efficiency, attenuation, scattering, and viewing
    geometry. Separating the thermal component from fast-ion contributions generally
    requires kinetic modeling, neutron energy information, or comparison with beam
    and radio-frequency heating histories.


    Typical values are below $10^{10}$ Hz in low-temperature or very low-density plasmas,
    about $10^{12}$-$10^{16}$ Hz in many deuterium plasmas, and $10^{17}$-$10^{20}$
    Hz in high-performance D-T experiments; reactor-scale D-T plasmas can approach
    $10^{20}$-$10^{21}$ Hz. Because the reactivity rises steeply with ion temperature
    in the several-keV range and the source scales approximately with reacting density
    products such as $n_D n_T$, small changes in temperature, fuel mix, and dilution
    can change the rate by orders of magnitude.'
  unit: Hz
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - id: dd:summary/fusion/neutron_fluxes/thermal/value
    dd_path: summary/fusion/neutron_fluxes/thermal/value
    status: composed
  - id: dd:summary/fusion/neutron_rates/thermal/value
    dd_path: summary/fusion/neutron_rates/thermal/value
    status: attached
- name: total_power_due_to_fusion_reactions
  kind: scalar
  status: draft
  description: Volume-integrated rate of thermonuclear energy release from all fusion
    reaction branches in the plasma, encompassing the kinetic energy of both charged
    products and fusion neutrons.
  documentation: 'Total fusion power is the global integral of the local [power_due_to_fusion_reactions]
    density over the plasma volume, summing contributions from all reaction branches
    (D-D, D-T, and higher-order reactions) and all product species. It represents
    the total rate at which nuclear binding-energy difference is converted to kinetic
    energy of the reaction products.


    The defining relation is:


    $$

    P_\mathrm{fus} = \int_V \sum_k Q_k \, n_a^{(k)} n_b^{(k)} \langle \sigma v \rangle_k
    \, dV

    $$


    where $Q_k$ is the total energy released per reaction (in J) for branch $k$, $n_a^{(k)}$
    and $n_b^{(k)}$ are the reactant number densities, $\langle \sigma v \rangle_k$
    is the thermally averaged reactivity, and $V$ is the plasma volume. For D-T reactions,
    $Q_\mathrm{DT} = 17.6$ MeV per event, split between the 3.5 MeV alpha particle
    and the 14.1 MeV neutron.


    In experimental practice, $P_\mathrm{fus}$ is inferred from neutron emission diagnostics
    by integrating the volumetric neutron source rate, as characterized by [emissivity_due_to_fusion](name:emissivity_due_to_fusion),
    and scaling to the total energy per reaction event. Unlike [total_neutron_power](name:total_neutron_power),
    which captures only the neutron-borne fraction of the fusion yield (~80% for D-T),
    $P_\mathrm{fus}$ includes the charged-particle fraction that heats the plasma
    directly. The fusion gain $Q = P_\mathrm{fus} / P_\mathrm{heat}$, where $P_\mathrm{heat}$
    is the [total_plasma_heating_power](name:total_plasma_heating_power), is the primary
    figure of merit for burning-plasma performance.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:emissivity_due_to_fusion
  - name:total_neutron_power
  - name:total_plasma_heating_power
  sources:
  - id: dd:neutron_diagnostic/synthetic_signals/fusion_power
    dd_path: neutron_diagnostic/synthetic_signals/fusion_power
    status: composed
- name: tritium_density
  kind: scalar
  status: draft
  description: Local number density of tritium ions in the plasma, the foundational
    fuel-ion parameter underlying chord-averaged, volume-averaged, and isotopic ratio
    child quantities.
  documentation: 'Tritium ion number density $n_T$ quantifies the local concentration
    of hydrogen-3 fuel ions in the plasma. It serves as the common physical basis
    for a family of derived quantities: the chord-integrated mean [line_averaged_tritium_density](name:line_averaged_tritium_density),
    the confined-volume mean [volume_averaged_tritium_density](name:volume_averaged_tritium_density),
    and dimensionless isotopic ratios such as [ratio_of_tritium_density_to_electron_density](name:ratio_of_tritium_density_to_electron_density)
    and [ratio_of_tritium_density_to_deuterium_density](name:ratio_of_tritium_density_to_deuterium_density).


    In deuterium-tritium (DT) fusion plasmas the local volumetric reaction rate is:


    $$

    R_{DT} = n_T \, n_D \langle \sigma v \rangle_{DT}

    $$


    where $n_D$ is the deuterium ion number density and $\langle \sigma v \rangle_{DT}$
    is the Maxwellian-averaged DT fusion reactivity. The combined DT fuel-ion purity
    relative to the electron population is tracked by [ratio_of_deuterium_tritium_density_to_electron_density](name:ratio_of_deuterium_tritium_density_to_electron_density).


    Tritium density is inferred from active charge-exchange recombination spectroscopy,
    neutron emission measurements in DT plasmas, or pellet injection and fueling diagnostics.


    Sign convention: Positive when tritium ions are present in the plasma.'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:line_averaged_tritium_density
  - name:volume_averaged_tritium_density
  - name:ratio_of_tritium_density_to_electron_density
  - name:ratio_of_tritium_density_to_deuterium_density
  - name:ratio_of_deuterium_tritium_density_to_electron_density
  sources:
  - id: dd:neutron_diagnostic/reconstructed_emissivity/fuel_ratio
    dd_path: neutron_diagnostic/reconstructed_emissivity/fuel_ratio
