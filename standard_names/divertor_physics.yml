      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: Electron temperature (Te) at the divertor target, structured to
        hold the value and associated uncertainties. Part of the local plasma parameter
        summary at the divertor target location.
      kind: template
- name: ion_temperature_at_divertor_target
  kind: scalar
  status: active
  description: Ion temperature at the divertor target is the thermal energy per particle
    of the ion population averaged over ion species and evaluated at the plasma side
    of a divertor-target sheath, distinct from the target material temperature.
  documentation: 'Ion temperature at the divertor target is the thermal energy per
    particle of the ion population averaged over ion species and evaluated at the
    plasma side of a divertor-target sheath. It is a plasma boundary quantity for
    ions at the downstream end of the scrape-off layer, not a thermodynamic property
    of the solid target material.


    For the ion population, the species-averaged target temperature is defined from
    the ion kinetic thermal-energy moments by:


    $$

    T_{i,t} = \left\langle \frac{m_s}{3 n_{s,t}} \int \lvert \mathbf{v} - \mathbf{u}_{s,t}
    \rvert^2 f_{s,t}(\mathbf{v})\,d^3v \right\rangle_s

    $$


    where $T_{i,t}$ is the ion temperature at the divertor target, $i$ identifies
    the ion population, $t$ identifies the divertor-target sheath-edge locus, $s$
    indexes the included ion species, $m_s$ is the mass of species $s$, $n_{s,t}$
    is its number density at the target sheath edge, $\mathbf{v}$ is ion velocity,
    $\mathbf{u}_{s,t}$ is the mean flow velocity of species $s$ there, $f_{s,t}(\mathbf{v})$
    is its velocity distribution, $d^3v$ is the velocity-space volume element, and
    angle brackets denote averaging over the included ion species.


    This quantity applies exclusively to the ion population immediately upstream of
    a specified divertor target and represents an intensive, per-particle thermal-energy
    scale averaged over ion species. It is not an extensive sum of ion energies or
    densities, and it excludes electron, neutral-particle, and solid-target temperatures.


    It is the ion-specific component of [temperature at the divertor target](name:temperature_at_divertor_target).
    Unlike [electron temperature at the divertor target](name:electron_temperature_at_divertor_target),
    it describes ion kinetic thermal energy at the same plasma-side target locus.'
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  sources:
  - dd_path: summary/local/divertor_target/t_i_average/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-t_i_average-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/divertor_target/t_i_average
      parent: Ion temperature (average over ion species)
      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: Ion temperature (Ti) at the divertor target, averaged over ion
        species. Represents the thermal energy of ions at the target surface in the
        divertor region.
      kind: template
- name: total_ion_density_at_divertor_target
  kind: scalar
  status: active
  description: Total positive-ion number density at the divertor target, summed over
    all ionic species and charge states at the entrance to the electrostatic sheath.
  documentation: 'This quantity is the local number density of all positive ions in
    the plasma immediately adjacent to a divertor target surface. It is the all-ion
    aggregate of [ion density at the divertor target](name:ion_density_at_divertor_target),
    rather than a species-specific or charge-state-resolved density.


    The total ion density is defined by


    $$

    n_{i,total} = \sum_{s \in \mathcal{S}} \sum_{Z \in \mathcal{Z}_s} n_{s,Z}

    $$


    where $n_{i,\mathrm{total}}$ is the total ion number density, $s$ indexes the
    included ionic species, $Z$ indexes their positive charge states, and $n_{s,Z}$
    is the number density of species $s$ in charge state $Z$. The sums include all
    positive-ion populations evaluated at the entrance to the electrostatic sheath.


    Neutral atoms and molecules, as well as free electrons, are excluded. A density
    resolved for one charge state is represented separately by [ion charge state density](name:ion_charge_state_density).'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:ion_density_at_divertor_target
  - name:ion_charge_state_density
  arguments:
  - name: ion_density_at_divertor_target
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/divertor_target/n_i_total/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-divertor_target-n_i_total-value
    dd_documentation:
      leaf: Value
