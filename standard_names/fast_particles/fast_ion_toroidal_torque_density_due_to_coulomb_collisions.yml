name: fast_ion_toroidal_torque_density_due_to_coulomb_collisions
status: draft
description: Toroidal torque density exerted on the fast-ion population itself through
  Coulomb collisions with background species.
documentation: "The collisional toroidal torque density on fast ions, $\\tau_{\\phi,\\\
  mathrm{fast}}^{\\mathrm{coll}}$, quantifies the rate of toroidal angular momentum\
  \ change of the supra-thermal ion distribution due to friction with thermal ions\
  \ and electrons. By Newton's third law, $\\tau_{\\phi,\\mathrm{fast}}^{\\mathrm{coll}}\
  \ = -\\tau_{\\phi,\\mathrm{th,i}}^{\\mathrm{coll,fi}} - \\tau_{\\phi,\\mathrm{th,e}}^{\\\
  mathrm{coll,fi}}$, where the right-hand terms are the torques delivered to the thermal-ion\
  \ and thermal-electron populations respectively. This drag torque governs the slowing-down\
  \ and pitch-angle scattering of NBI- or ICRH-generated fast ions and feeds directly\
  \ into the fast-ion continuity equation in phase space. Typical values are of order\
  \ $10^{-3}$\u2013$10^{-1}\\;\\mathrm{N\\,m^{-2}}$ in high-power NBI scenarios. Computed\
  \ by Monte-Carlo or Fokker\u2013Planck fast-particle codes. Related quantities include\
  \ `ion_collisional_toroidal_torque_density_on_thermal_population_due_to_fast_ions`\
  \ and `fast_electron_collisional_toroidal_torque_density_due_to_collisions`."
