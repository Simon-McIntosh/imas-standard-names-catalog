- name: perturbed_gyrocenter_density
  kind: scalar
  status: active
  description: Dimensionless zeroth velocity-space moment of the perturbed gyrocenter
    distribution function for a plasma species, giving the gyrocenter density response
    to a fluctuation before finite-Larmor-radius averaging.
  documentation: 'The gyrocenter perturbed density is the unweighted (zeroth) velocity-space
    integral of the deviation $\delta f_g(\mathbf{R}, v_\parallel, \mu)$ of the gyrocenter
    distribution function from its equilibrium background, normalized to a positive
    reference number density $n_{\rm ref}$.


    $$

    \delta \tilde{n}_g = \frac{1}{n_{\rm ref}} \int \delta f_g \, d^3v

    $$


    where the integral is over the full gyrocenter velocity space, $v_\parallel$ is
    the velocity parallel to the background magnetic field, and $\mu$ is the magnetic
    moment. The quantity is evaluated at the gyrocenter position $\mathbf{R}$ and
    does not incorporate the finite-Larmor-radius corrections that arise when transforming
    back to particle coordinates; it therefore differs from the particle density perturbation
    by gyroaveraging terms of order $(k_\perp \rho)^2$, where $k_\perp$ is the perpendicular
    wavenumber and $\rho$ is the thermal Larmor radius. It represents the perturbation
    to the background [gyrocenter_density](name:gyrocenter_density). The concrete
    normalized instance resolved for a linear gyrokinetic eigenmode is [normalized_gyrocenter_perturbed_density](name:normalized_gyrocenter_perturbed_density).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_gyrocenter_perturbed_density
  arguments:
  - name: gyrocenter_density
    operator: perturbed
    operator_kind: qualifier
- name: normalized_gyrocenter_perturbed_density
  kind: scalar
  status: active
  description: Normalized gyrocenter perturbed density is the species-resolved zeroth
    velocity-space moment of the perturbed gyrocenter distribution divided by a positive
    reference density. It is the before-finite-Larmor-radius gyrocenter-density fluctuation
    response, distinct from a gyroaveraged particle-density perturbation.
  documentation: 'Normalized gyrocenter perturbed density is the species-resolved
    zeroth velocity-space moment of the perturbed gyrocenter distribution divided
    by a positive reference density. It is the before-finite-Larmor-radius [gyrocenter
    density](name:gyrocenter_density) fluctuation response; the normalization removes
    the scale of the reference density while preserving perturbation amplitude and
    phase.


    For magnetic moment $\mu = m_s v_\perp^2/(2B)$, the normalized moment is defined
    by:


    $$

    \widehat{n}_{gc,s} = \frac{1}{n_{\mathrm{ref},s}} \int_{-\infty}^{\infty} \int_{0}^{\infty}
    \delta f_{gc,s}(v_\parallel,\mu)\,\frac{2\pi B}{m_s}\,d\mu\,dv_\parallel

    $$


    where $\widehat{n}_{gc,s}$ is the normalized gyrocenter perturbed density for
    species $s$, $n_{\mathrm{ref},s}$ is the positive reference number density for
    that species, $\delta f_{gc,s}$ is the perturbed gyrocenter distribution with
    respect to ordinary velocity-space volume, $B$ is the local magnetic-field magnitude,
    $m_s$ is the species mass, $v_\parallel$ is velocity parallel to the magnetic
    field, $v_\perp$ is speed perpendicular to the magnetic field, and $\mu$ is magnetic
    moment. The factor $2\pi B/m_s$ is the gyroangle-integrated velocity-space Jacobian
    for this definition of $\mu$.


    For a species represented by multiple charge states, the perturbed gyrocenter-density
    numerator and the reference density are charge-state-summed before the ratio is
    formed. This quantity excludes any Bessel-function or finite-Larmor-radius weighting
    inside the velocity-space integral; that weighted moment is the [normalized gyrocenter
    gyroaveraged density]. The dimensional numerator of the ratio is the unnormalized
    gyrocenter-density perturbation; the related [perturbed gyrocenter density](name:perturbed_gyrocenter_density)
    denotes a dimensionless gyrocenter-density perturbation in the same family. The
    [normalized gyrocenter perturbed pressure](name:normalized_gyrocenter_perturbed_pressure)
    is the corresponding perturbed pressure moment. For complex perturbation amplitudes,
    the integral is taken over the complex amplitude; the arbitrary overall mode phase
    is external to the definition.


    Sign convention: Positive when, for a real perturbation amplitude, the velocity-space
    integral of the perturbed gyrocenter distribution gives an excess gyrocenter density
    relative to the positive reference density.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_gyrocenter_density
  - name:normalized_gyrocenter_perturbed_pressure
  arguments:
  - name: perturbed_gyrocenter_density
    operator: normalized
    operator_kind: qualifier
  sources:
