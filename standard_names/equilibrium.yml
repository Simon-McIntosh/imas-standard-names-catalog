- name: toroidal_angle_of_measurement_position
  kind: scalar
  status: active
  description: "Toroidal angular coordinate locating a measurement position around\
    \ the machine symmetry axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The toroidal angle is the azimuthal coordinate of a geometric point
    designated as a measurement position, locating that point around the machine symmetry
    axis in the right-handed cylindrical $(R, \phi, Z)$ frame.


    The angle may be defined from the transverse Cartesian coordinates by:


    $$

    \phi = \operatorname{atan2}(y,x)

    $$


    where $\phi$ is the toroidal angle, $x$ and $y$ are the transverse Cartesian coordinates
    in the right-handed $(\hat{x}, \hat{y}, \hat{z})$ basis, and $\operatorname{atan2}$
    returns the oriented azimuth relative to the defined zero-angle direction. In
    the cylindrical frame, $R$ is major radius and $Z$ is vertical height.


    This quantity applies to one geometric measurement position and has no plasma-population,
    field, or region weighting. It is a point coordinate rather than a line-of-sight
    integral, spatial average, or toroidal displacement from a reference position.


    The absolute angular coordinate differs from the signed displacement represented
    by [toroidal offset at measurement position](name:toroidal_offset_at_measurement_position).
    The same toroidal-coordinate concept applied to another geometric locus is represented
    by [toroidal coordinate of aperture](name:toroidal_coordinate_of_aperture).


    Sign convention: Positive when measured counter-clockwise from the defined zero-toroidal-angle
    half-plane when viewed from above along $+\hat{Z}$.'
  unit: rad
  physics_domain: equilibrium
  links:
  - name:toroidal_coordinate_of_aperture
  sources:
  - dd_path: barometry/gauge/position/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/barometry.html#barometry-gauge-position-phi
    dd_documentation:
      leaf: Toroidal angle (oriented counter-clockwise when viewing from above)
      parent_path: barometry/gauge/position
      parent: Position of the measurements
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "Toroidal angle (\u03C6) coordinate of position."
      kind: template
  - dd_path: ece/channel/position/phi
