      data_type: FLT_1D
      unit: W
      coordinates:
      - wall/time
    enhanced_context:
      description: Power transferred from the plasma-facing wall to the active cooling
        systems. Represents the total thermal power extracted by cooling, balancing
        incident plasma heat loads and accounting for energy removal from the tokamak
        wall.
      kind: llm
- name: total_thermal_power_at_inlet
  kind: scalar
  status: active
  description: Thermal power at inlet is the recoverable heat-input rate entering
    a power-conversion cycle at its heat-input boundary before thermal-to-electric
    conversion, aggregated over all inlet streams feeding the cycle.
  documentation: 'Thermal power at inlet is the recoverable heat-input rate entering
    a power-conversion cycle at its heat-input boundary before thermal-to-electric
    conversion. This member is the cycle-level total, summed over all inlet streams
    and heat-input contributions feeding the cycle, rather than the rate of a single
    stream or port.


    The total inlet heat-input rate is the sum over the heat-input boundary contributions:


    $$

    P_\mathrm{th,in} = \sum_{i \in \mathcal{I}_\mathrm{in}} \dot{Q}_{\mathrm{th,in},i}

    $$


    where $\mathcal{I}_\mathrm{in}$ is the set of heat-input boundary contributions,
    $\dot{Q}_{\mathrm{th,in},i}$ is the recoverable thermal power delivered by contribution
    $i$ into the cycle in watts, and $P_\mathrm{th,in}$ is the aggregate inlet thermal
    power in watts. Each per-port contribution corresponds to a [thermal power of
    plant component port](name:thermal_power_of_plant_component_port) evaluated at
    an inlet port, and the single-stream counterpart is [thermal power at inlet](name:thermal_power_at_inlet).


    This quantity excludes [total thermal power at outlet](name:total_thermal_power_at_outlet),
    which is the heat rejected from the cycle, and excludes net electrical output.
    Over the same balance boundary, [thermal efficiency of plant system](name:thermal_efficiency_of_plant_system)
    relates these quantities through $\eta_\mathrm{th} = (P_\mathrm{th,in} - P_\mathrm{th,out})/P_\mathrm{th,in}$,
    where $P_\mathrm{th,out}$ is the rejected thermal power.


    Sign convention: Positive when net heat flows into the power-conversion cycle
    across the heat-input boundary.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_at_inlet
  arguments:
  - name: thermal_power_at_inlet
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_plant/total_heat_supplied
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-total_heat_supplied
    dd_documentation:
      leaf: Total heat flow being supplied to the thermal plant (fusion thermal power)
      parent_path: balance_of_plant/power_plant
      parent: Energy conversion
      data_type: FLT_1D
      unit: W
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Total thermal power supplied to the power conversion cycle of a
        fusion power plant, representing gross heat input driving thermal-to-electric
        conversion. Includes contributions from fusion reactions and blanket energy
        multiplication.
      kind: llm
- name: total_thermal_power_at_outlet
  kind: scalar
  status: active
  description: Total thermal power at the outlet is the aggregate rate at which thermal
    energy leaves a power-conversion cycle through all heat-rejection outlet streams.
    It includes all rejected heat contributions and excludes useful electrical output.
  documentation: 'Total thermal power at the outlet is the aggregate rate at which
    thermal energy leaves a power-conversion cycle through all heat-rejection outlet
    streams. It represents the total rejected heat load delivered from the conversion
    cycle to its heat sink, excluding useful electrical output.


    The total outlet thermal power is the sum of the thermal-power contributions from
    the individual heat-rejection outlet streams:


    $$

    P_{\mathrm{th,out}}^{\mathrm{tot}} = \sum_{i \in \mathcal{O}} P_{\mathrm{th,out},i}
    = \frac{dE_{\mathrm{waste,out}}}{dt}

    $$


    where $\mathcal{O}$ is the set of heat-rejection outlet streams, $P_{\mathrm{th,out},i}$
    is the thermal power carried by outlet stream $i$, $E_{\mathrm{waste,out}}$ is
    the cumulative rejected thermal energy in J, and $t$ is time in s.


    This quantity is the aggregate over outlet streams; an individual outlet-stream
    contribution is [thermal_power_at_outlet](name:thermal_power_at_outlet). For a
    steady conversion cycle with no net energy accumulation inside the conversion
    boundary, it is related to [total_thermal_power_at_inlet](name:total_thermal_power_at_inlet)
    by the first-law balance $P_{\mathrm{th,out}}^{\mathrm{tot}} = P_{\mathrm{th,in}}^{\mathrm{tot}}
    - P_{\mathrm{net}}$, where $P_{\mathrm{net}}$ is the net useful electrical power
    delivered by the conversion system.'
  unit: W
  physics_domain: plant_systems
  links:
  - name:thermal_power_at_outlet
  - name:thermal_power_at_inlet
  - name:thermal_efficiency_of_plant_system
  arguments:
  - name: thermal_power_at_outlet
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: balance_of_plant/power_plant/total_heat_rejected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/balance_of_plant.html#balance_of_plant-power_plant-total_heat_rejected
    dd_documentation:
      leaf: Total heat flow being rejected from the thermal plant
      parent_path: balance_of_plant/power_plant
      parent: Energy conversion
      data_type: FLT_1D
      unit: W
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Total thermal power rejected from the power plant thermodynamic
        cycle to the environment (waste heat not converted to electricity). Represents
        the heat sink load governed by the second law of thermodynamics in the fusion
        power plant balance.
      kind: llm
- name: tritium_prefill_count
  kind: scalar
  status: active
  description: Accumulated number of tritium atoms injected as gas during the plasma
    prefill phase, expressed in equivalent electrons.
  documentation: "The tritium prefill count records the total number of tritium atoms\
    \ ($^3_1\\text{H}$, charge number $Z = 1$) delivered to the vessel as neutral\
    \ gas during the prefill phase \u2014 the period from the start of gas injection\
    \ up to plasma breakdown. Because tritium is a hydrogen isotope with $Z = 1$,\
    \ the equivalent-electron count equals the raw atom count directly.\n\nThe prefill\
    \ phase establishes the initial neutral gas background required for reproducible\
    \ plasma initiation; the tritium component is particularly relevant in deuterium-tritium\
    \ operations, where it contributes to the initial fuel mix and breakdown conditions.\
    \ The count is accumulated from calibrated gas injection valve signals integrated\
    \ over the duration of the prefill phase. For multi-species prefill scenarios,\
    \ the total electron-equivalent inventory is $\\sum_s Z_s N_s$, where $Z_s$ is\
    \ the charge number and $N_s$ the atom count for species $s$.\n\nThis quantity\
    \ complements [deuterium_prefill_count](name:deuterium_prefill_count), [neon_prefill_count](name:neon_prefill_count),\
    \ and [krypton_prefill_count](name:krypton_prefill_count), which together with\
    \ this name characterize the full multi-species neutral gas inventory available\
    \ at breakdown; the aggregate is captured by [prefill_count](name:accumulated_lithium_prefill_count_due_to_gas_injection).\n\
    \nSign convention: Positive when tritium atoms have been injected into the vessel\
    \ during the prefill phase."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:deuterium_prefill_count
  - name:neon_prefill_count
  - name:krypton_prefill_count
  - name:accumulated_lithium_prefill_count_due_to_gas_injection
  arguments:
  - name: prefill_count
    operator: tritium
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_prefill/tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_prefill-tritium-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_prefill/tritium
      parent: Tritium
      data_type: FLT_0D
      unit: '1'
      lifecycle_status: active
    enhanced_context:
      description: Tritium.
      kind: template
- name: tritium_source_rate_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron tritium source rate delivered to
    the plasma vessel by gas injection, with each injected tritium atom contributing
    one equivalent-electron count.
  documentation: 'The tritium source rate due to gas injection characterizes the instantaneous
    rate at which neutral tritium with atomic number $Z_{\mathrm{T}} = 1$ is admitted
    to the plasma vessel by gas injection hardware, expressed as an equivalent-electron
    count rate. It is the tritium-specific component of the [source rate due to gas
    injection](name:source_rate_due_to_gas_injection).


    The defining relation is:


    $$

    \dot{S}_{\mathrm{T}} = Z_{\mathrm{T}} \dot{N}_{\mathrm{T}} = \dot{N}_{\mathrm{T}}

    $$


    where $\dot{S}_{\mathrm{T}}$ is the equivalent-electron source rate, $\dot{N}_{\mathrm{T}}$
    is the raw tritium atom delivery rate in atoms per second, and $Z_{\mathrm{T}}$
    is tritium''s atomic number. The rate is the instantaneous derivative of the accumulated
    inventory [accumulated tritium count due to gas injection](name:accumulated_tritium_count_due_to_gas_injection),
    and it counts delivered atoms rather than plasma electron content or ionization
    state.


    Sign convention: Positive when tritium gas is being delivered into the vessel,
    increasing the equivalent-electron inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_gas_injection
  - name:accumulated_tritium_count_due_to_gas_injection
  arguments:
  - name: source_rate_due_to_gas_injection
    operator: tritium
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_rates/tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-tritium-value
    dd_documentation:
