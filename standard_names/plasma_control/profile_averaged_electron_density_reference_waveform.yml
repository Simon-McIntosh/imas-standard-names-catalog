name: profile_averaged_electron_density_reference_waveform
status: draft
cocos_transformation_type: one_like
description: Prescribed time-dependent target for the profile-averaged electron density
  used by the plasma density control system.
documentation: The profile-averaged electron density reference waveform specifies
  the desired temporal evolution of the electron density averaged over the radial
  profile, $\langle n_e \rangle_{\text{prof}}$, as a function of time during a plasma
  discharge. This quantity serves as the set-point input to the density feedback controller,
  which typically actuates gas valves and pellet injectors to track the reference.
  The control envelope (error bars on the waveform) defines the acceptable deviation
  band rather than measurement uncertainty. Typical reference values range from $1
  \times 10^{19}$ to $1.5 \times 10^{20}\,\mathrm{m^{-3}}$ for tokamak plasmas, normalized
  to dimensionless form (unit 1) depending on the normalization convention adopted.
  See also the volume-averaged counterpart and the line-integrated density reference
  used in interferometry-based feedback.
