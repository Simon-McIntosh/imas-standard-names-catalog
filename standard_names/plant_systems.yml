- name: electron_source_rate_due_to_injection
  kind: scalar
  status: active
  description: Instantaneous rate of electron-equivalent particles supplied by active
    injection, obtained by nuclear-charge weighting each injected atomic species.
  documentation: 'This quantity is the instantaneous particle supply from active injection
    systems, expressed on an equivalent-electron basis when multiple injected species
    are combined. It represents the electron inventory that the supplied material
    can contribute after ionization.


    The equivalent-electron source rate is defined by


    $$

    \dot{N}_{\mathrm{eq}}(t)=\sum_s Z_s\dot{N}_s(t)

    $$


    where $\dot{N}_{\mathrm{eq}}$ and $\dot{N}_s$ are source rates, $s$ indexes the
    injected atomic species, and $Z_s$ is the dimensionless nuclear charge number.
    For molecular feeds, each constituent atom is included with its nuclear-charge
    weighting. This is the charge-weighted instance of the [source rate due to injection](name:source_rate_due_to_injection);
    for unit-charge deuterium, it equals the [deuterium source rate due to injection](name:deuterium_source_rate_due_to_injection).


    This is an injected inventory rate, not a local volumetric particle source or
    a net plasma production-minus-loss rate such as the [total electron source rate](name:total_electron_source_rate).


    Sign convention: Positive when active injection increases the supplied equivalent-electron
    inventory.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:source_rate_due_to_injection
  - name:deuterium_source_rate_due_to_injection
  - name:total_electron_source_rate
  arguments:
  - name: source_rate_due_to_injection
    operator: electron
    operator_kind: qualifier
  sources:
