name: implicit_part_of_ion_particle_source
status: draft
cocos_transformation_type: one_like
description: Implicit coefficient of the ion particle source term, to be multiplied
  by the local ion density to yield the full implicit source contribution.
documentation: When solving the ion continuity (particle transport) equation with
  a semi-implicit numerical scheme, the particle source is decomposed as $S_n = S_{\rm
  explicit} + S_{\rm implicit} \cdot n_i$, where $n_i$ is the ion number density and
  $S_{\rm implicit}$ (unit $\mathrm{s^{-1}}$) is the linearized implicit coefficient.
  This formulation moves density-dependent source and sink terms (e.g., ionization,
  recombination, charge-exchange losses) onto the implicit side of the linear system,
  improving convergence and stability. Typical contributors include neutral-beam fueling
  models, pellet ablation codes, and atomic-physics packages. Values can be negative
  for net recombination or loss processes. See also the corresponding ion energy implicit
  part and the total ion particle source.
