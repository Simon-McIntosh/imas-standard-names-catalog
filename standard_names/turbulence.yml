- name: normalized_perturbed_electrostatic_potential_real_part
  kind: complex
  status: draft
  description: Real part of the normalized perturbed electrostatic potential eigenfunction,
    giving the in-phase spatial structure of the electrostatic perturbation along
    the field-line parallel coordinate in a gyrokinetic eigenmode.
  documentation: 'The normalized perturbed electrostatic potential eigenfunction $\delta\phi/\phi_\mathrm{ref}$
    is complex-valued, encoding both amplitude and phase of electrostatic fluctuations
    as a function of the parallel field-line coordinate $\chi$ in gyrokinetic theory.
    Its real part isolates the in-phase component of this perturbation, where the
    reference potential $\phi_\mathrm{ref} = T_{e,\mathrm{ref}}/e$ normalizes the
    amplitude with $T_{e,\mathrm{ref}}$ the reference electron temperature and $e$
    the elementary charge.


    The defining relation is:


    $$

    \widetilde{\phi}_R(\chi) = \mathrm{Re}\!\left[\frac{\delta\phi(\chi)}{\phi_\mathrm{ref}}\right]

    $$


    where $\widetilde{\phi}_R(\chi)$ is dimensionless and $\chi$ parameterizes position
    along the magnetic field line. Together with [normalized_perturbed_electrostatic_potential_imaginary_part](name:normalized_perturbed_electrostatic_potential_imaginary_part),
    the two components fully reconstruct the complex eigenfunction; the flux-surface
    and time-averaged normalized intensity corresponds to normalized_perturbed_flux_surface_time_averaged_electrostatic_potential.


    This quantity is computed by linear gyrokinetic eigenvalue solvers, where the
    fluctuating potential is written $\delta\phi(\mathbf{x},t) = \hat{\phi}(\chi)\exp[i(k_x
    x + k_y y - \omega t)]$ with radial and binormal wave vector components $k_x$
    and $k_y$, and complex eigenfrequency $\omega$ whose real and imaginary parts
    correspond to frequency_of_gyrokinetic_eigenmode and linear_growth_rate_of_gyrokinetic_eigenmode,
    respectively. The peak amplitude of $\widetilde{\phi}_R$ is of order unity at
    the mode rational surface, decaying along $\chi$ toward the field-line endpoints.
    The electromagnetic analog for the parallel magnetic vector potential is [parallel_normalized_perturbed_vector_potential_real_part](name:parallel_normalized_perturbed_vector_potential_real_part).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_electrostatic_potential_imaginary_part
  - name:parallel_normalized_perturbed_vector_potential_real_part
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/phi_potential_perturbed_norm_real
    dd_path: gyrokinetics/wavevector/eigenmode/phi_potential_perturbed_norm_real
    status: composed
- name: normalized_shearing_rate_due_to_e_cross_b_drift
  kind: scalar
  status: draft
  description: Dimensionless radial shear of the toroidal E cross B drift velocity,
    normalized by a reference speed and length scale. It gives the E cross B shearing
    rate relative to the reference gyrokinetic frequency.
  documentation: "Normalized shearing rate due to E\xD7B drift is the radial gradient\
    \ of the toroidal component of the E\xD7B drift velocity expressed relative to\
    \ a reference gyrokinetic frequency. It measures how rapidly neighboring flux\
    \ surfaces advect past one another by E\xD7B motion; the magnitude gives the normalized\
    \ shear rate and the sign gives the orientation of that radial shear.\n\nUsing\
    \ normalized minor radius $\\rho$ with $r=L_\\mathrm{ref}\\rho$, the dimensionless\
    \ shearing rate can be written as:\n\n$$\n\\hat{\\omega}_{E\\times B} = \\frac{\\\
    omega_{E\\times B}}{\\omega_\\mathrm{ref}} = \\frac{L_\\mathrm{ref}}{c_\\mathrm{ref}}\\\
    frac{\\partial u_{\\phi,E\\times B}}{\\partial r} = \\frac{\\partial u_{\\phi,E\\\
    times B,N}}{\\partial \\rho}\n$$\n\nwhere $\\omega_{E\\times B}$ is the dimensional\
    \ shearing rate in s$^{-1}$, $\\omega_\\mathrm{ref}=c_\\mathrm{ref}/L_\\mathrm{ref}$\
    \ is the reference gyrokinetic frequency in s$^{-1}$, $c_\\mathrm{ref}$ is a reference\
    \ speed in m s$^{-1}$, $L_\\mathrm{ref}$ and $r$ are lengths in m, $u_{\\phi,E\\\
    times B}$ is the toroidal component of the E\xD7B drift velocity in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame in m s$^{-1}$, and $u_{\\phi,E\\times B,N}=u_{\\\
    phi,E\\times B}/c_\\mathrm{ref}$ is dimensionless. The final form is the normalized-minor-radius\
    \ derivative of the normalized toroidal E\xD7B velocity.\n\nIn practice this quantity\
    \ is computed from the radial variation of the equilibrium E\xD7B drift, often\
    \ through the radial electric field and magnetic geometry, followed by differentiation\
    \ with respect to $\\rho$. A spatially uniform toroidal E\xD7B drift gives zero\
    \ shearing rate; only radial variation of that drift contributes.\n\nRepresentative\
    \ dimensionless values are commonly in the range -5 to 5. Values with absolute\
    \ magnitude near 1 correspond to shear comparable to the reference gyrokinetic\
    \ frequency, while values close to 0 indicate weak E\xD7B shear in the chosen\
    \ normalization.\n\nSign convention: Positive when the toroidal E\xD7B drift velocity\
    \ component in the direction of increasing toroidal angle $\\phi$ in the right-handed\
    \ cylindrical $(R,\\phi,Z)$ frame increases with increasing normalized minor radius\
    \ $\\rho$."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:shearing_rate_due_to_e_cross_b_drift
  - name:derivative_with_respect_to_normalized_minor_radius_of_toroidal_normalized_gyrokinetic_velocity_due_to_e_cross_b_drift
