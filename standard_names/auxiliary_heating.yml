- name: parallel_component_of_wave_magnetic_field
  kind: scalar
  status: draft
  description: Projection of the coherent wave magnetic field vector onto the unit
    vector parallel to the local equilibrium magnetic field, yielding the field-aligned
    scalar component within the parallel-normal-binormal decomposition.
  documentation: "The parallel component of the wave magnetic field is defined as\n\
    \n$$B_{w,\\parallel} = \\mathbf{B}_w \\cdot \\hat{b},$$\n\nwhere $\\hat{b} = \\\
    mathbf{B}_0 / |\\mathbf{B}_0|$ is the unit vector along the local equilibrium\
    \ magnetic field $\\mathbf{B}_0$, and $\\mathbf{B}_w$ is the coherent wave magnetic\
    \ field vector.\n\n**Local field-aligned triad.** The orthonormal right-handed\
    \ coordinate system is $(\\hat{b},\\, \\hat{n},\\, \\hat{b} \\times \\hat{n})$,\
    \ where $\\hat{n}$ is the principal normal direction (pointing radially inward\
    \ in the flux-surface picture) and $\\hat{b} \\times \\hat{n}$ is the binormal.\
    \ The three scalar projections onto this triad \u2014 parallel, [normal](name:normal_component_of_wave_magnetic_field),\
    \ and [binormal](name:binormal_component_of_wave_magnetic_field) \u2014 reconstruct\
    \ the full [wave magnetic field](name:wave_magnetic_field) vector.\n\n**Complex-amplitude\
    \ convention.** The quantity is a complex phasor in the $e^{-i\\omega t}$ time\
    \ convention. The instantaneous physical field is recovered as $\\mathrm{Re}[B_{w,\\\
    parallel}\\, e^{-i\\omega t}]$. The real part gives the in-phase amplitude and\
    \ the imaginary part gives the quadrature amplitude.\n\n**Unit convention.** The\
    \ registered unit $\\mathrm{m^{-1} \\cdot V}$ expresses the wave magnetic field\
    \ normalized to a reference electric-field amplitude $E_{\\mathrm{ref}}$ with\
    \ unit V/m. Specifically, $B_{w,\\parallel}$ carries dimensions of $[E_{\\mathrm{ref}}]\
    \ / [v]$ where $v$ is a characteristic velocity (units m/s), so the ratio has\
    \ dimensions $\\mathrm{(V/m) \\cdot (s/m)} = \\mathrm{V \\cdot m^{-1} \\cdot s\
    \ \\cdot m^{-1}}$; equivalently, because $1\\,\\mathrm{T} = 1\\,\\mathrm{V\\,s\\\
    ,m^{-2}}$, the normalization removes the time dimension and yields the compact\
    \ form $\\mathrm{m^{-1}\\cdot V}$. This convention is shared across all wave field\
    \ components: the [parallel](name:parallel_component_of_wave_electric_field),\
    \ [normal](name:normal_component_of_wave_electric_field), and [binormal](name:binormal_component_of_wave_electric_field)\
    \ electric-field components and the corresponding magnetic-field triad.\n\n**Physical\
    \ context.** For a purely transverse electromagnetic wave in vacuum, $B_{w,\\\
    parallel}$ vanishes identically. In a magnetized plasma, a nonzero parallel magnetic\
    \ perturbation arises from compressional Alfv\xE9n waves, whistler-branch propagation,\
    \ lower-hybrid mode conversion, and any coupling that transfers energy into a\
    \ field-aligned magnetic oscillation. Typical normalized magnitudes range from\
    \ negligible (fast-wave-dominated scenarios) to comparable with the perpendicular\
    \ components (compressional or electrostatic-to-electromagnetic conversion regions).\n\
    \nSign convention: Positive when the wave magnetic field perturbation has a component\
    \ in the direction of the local equilibrium magnetic field unit vector $\\hat{b}$."
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:normal_component_of_wave_magnetic_field
  - name:binormal_component_of_wave_magnetic_field
  - name:wave_magnetic_field
  - name:parallel_component_of_wave_electric_field
  - name:normal_component_of_wave_electric_field
  - name:binormal_component_of_wave_electric_field
