name: ion_average_square_charge_of_ion_state
status: draft
cocos_transformation_type: one_like
description: Density-weighted mean of the squared ionization charge within a charge-state
  bundle, used in $Z_{\mathrm{eff}}$ and radiation calculations.
documentation: "The average square charge $\\langle Z^2 \\rangle_s$ (dimensionless)\
  \ for a charge-state bundle $s$ is defined as $\\langle Z^2 \\rangle_s = \\sum_z\
  \ Z_z^2 x_z$, where $Z_z$ is the charge of state $z$ and $x_z = n_z / \\sum_z n_z$\
  \ is the relative population within the bundle. This second moment of the charge\
  \ distribution enters directly into the effective charge calculation $Z_{\\mathrm{eff}}\
  \ = \\sum_i n_i \\langle Z^2 \\rangle_i / n_e$, Bremsstrahlung radiation power $P_{\\\
  mathrm{Br}} \\propto n_e \\sum_i n_i Z_i^2$, and resistivity corrections in Spitzer\
  \ theory. For a pure single charge state, $\\langle Z^2 \\rangle_s = Z_s^2$; for\
  \ tungsten at $T_e \\approx 1\\;\\mathrm{keV}$, typical values are $\\sim 400$\u2013\
  $900$ depending on the ionization equilibrium. It is computed alongside `ion_average_charge_of_ion_state`\
  \ from ionization balance databases (ADAS). See also `ion_average_charge_number_at_ion_state`\
  \ and `ion_maximum_charge_state_of_ion_state`."
