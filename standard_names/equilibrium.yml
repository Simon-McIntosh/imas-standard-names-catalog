- name: poloidal_magnetic_field_at_constraint_position
  kind: scalar
  status: draft
  description: Signed projection of the poloidal magnetic field at a specified constraint
    position onto the local poloidal sensitive direction in the right-handed cylindrical
    (R, phi, Z) frame.
  documentation: 'Poloidal magnetic field at a constraint position is the signed component
    of the magnetic field in the meridional $(R,Z)$ plane of the right-handed cylindrical
    $(R,\phi,Z)$ frame, evaluated at a specified spatial point. It is a direction-resolved
    form of [poloidal_magnetic_field](name:poloidal_magnetic_field): the [radial_magnetic_field](name:radial_magnetic_field)
    and vertical component contribute to it, while the [toroidal_magnetic_field](name:toroidal_magnetic_field)
    is excluded.


    The defining projection is


    $$

    B_{\mathrm{pol},c} = \mathbf{B}_{\mathrm{pol}}(R_c,\phi_c,Z_c)\cdot\hat{\mathbf{s}}_{\mathrm{pol},c}
    = B_R(R_c,\phi_c,Z_c)s_R + B_Z(R_c,\phi_c,Z_c)s_Z

    $$


    where $(R_c,\phi_c,Z_c)$ is the constraint position, with $R_c$ and $Z_c$ in meters
    and $\phi_c$ in radians; $\mathbf{B}_{\mathrm{pol}}=B_R\hat{R}+B_Z\hat{Z}$ is
    the local poloidal magnetic-field vector in tesla; and $\hat{\mathbf{s}}_{\mathrm{pol},c}=s_R\hat{R}+s_Z\hat{Z}$
    is the dimensionless unit vector defining the positive local sensitive direction
    in the poloidal plane. For axisymmetric equilibria the field components do not
    depend on $\phi_c$, but the point and the sensitive direction still define the
    signed scalar value.


    In equilibrium calculations, $B_R$ and $B_Z$ may be obtained from a poloidal magnetic-flux
    function $\psi(R,Z)$. The relations $B_R=-(1/R)\partial\psi/\partial Z$ and $B_Z=(1/R)\partial\psi/\partial
    R$ assume the Grad-Shafranov flux normalization in which $\psi$ is the poloidal
    flux per radian, commonly reported in Wb because the radian is dimensionless;
    if a full $2\pi$ flux convention is used, the corresponding $1/(2\pi R)$ factor
    must be included. Only derivatives of $\psi$ enter, so an additive reference such
    as [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    does not change the field.


    The quantity is obtained by evaluating a magnetic-field model at the constraint
    position and projecting it onto the specified sensitive direction, or by calibrating
    a local magnetic probe whose orientation defines that direction. Calibration sets
    the scale in tesla and the positive orientation, while geometric alignment determines
    the coefficients $s_R$ and $s_Z$.


    Representative absolute magnitudes for tokamak wall or near-wall magnetic constraints
    are strongly device- and position-dependent, often spanning roughly 0.001-0.3
    T. The value depends on distance from plasma and coils, enclosed toroidal current,
    plasma shape, and the chosen sensitive direction.


    Sign convention: Positive when the local poloidal magnetic field points along
    the chosen local poloidal sensitive direction at the constraint position.'
  unit: T
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/constraints/b_field_pol_probe/reconstructed
    dd_path: equilibrium/time_slice/constraints/b_field_pol_probe/reconstructed
    status: composed
  - id: dd:equilibrium/time_slice/constraints/bpol_probe/reconstructed
    dd_path: equilibrium/time_slice/constraints/bpol_probe/reconstructed
    status: composed
- name: poloidal_magnetic_flux
  kind: scalar
  status: draft
  description: Total magnetic flux threading a horizontal disk centered on the toroidal
    symmetry axis, serving as the canonical radial coordinate for labeling nested
    flux surfaces in axisymmetric plasma equilibria.
  documentation: "The poloidal magnetic flux $\\psi$ is the total magnetic flux threading\
    \ a horizontal disk of major radius $R$, centered on the toroidal symmetry axis\
    \ at height $Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame. Because\
    \ $\\psi$ is constant on each nested magnetic-flux surface in an axisymmetric\
    \ equilibrium, it provides the natural radial coordinate for plasma profiles and\
    \ equilibrium analysis, ranging from [the magnetic-axis value](name:poloidal_magnetic_flux_at_magnetic_axis)\
    \ to the last-closed-flux-surface boundary.\n\nThe defining integral is:\n\n$$\n\
    \\psi(R, Z) = \\int_0^R B_Z(R', Z) \\, 2\\pi R' \\, dR'\n$$\n\nwhere $B_Z$ is\
    \ the vertical component of the magnetic field and $R'$ integrates from the symmetry\
    \ axis to major radius $R$. In MHD equilibrium, $\\psi$ satisfies the Grad-Shafranov\
    \ equation and all equilibrium quantities \u2014 plasma pressure $p(\\psi)$ and\
    \ the toroidal-field function $F(\\psi) = R B_\\phi$ \u2014 are functions of $\\\
    psi$ alone. The [gradient of the poloidal flux](name:radial_derivative_of_poloidal_magnetic_flux)\
    \ determines the local poloidal-field strength, and the [time derivative](name:time_derivative_of_poloidal_magnetic_flux)\
    \ is related to the inductive electric field by Faraday's law.\n\nEvaluated at\
    \ specific flux surfaces, $\\psi$ serves as a coordinate label; sampled values\
    \ such as [the pedestal value](name:poloidal_magnetic_flux_at_pedestal) provide\
    \ reference points for normalized flux coordinates. The profile is recovered from\
    \ external magnetic measurements \u2014 flux loop signals, pickup coil voltages,\
    \ and Rogowski-integrated coil currents \u2014 through MHD equilibrium reconstruction,\
    \ supplemented by internal constraints from motional Stark effect polarimetry\
    \ where available.\n\nSign convention: Positive when the net vertical magnetic\
    \ field $B_Z$ threading the horizontal integration disk points in the $+Z$ direction."
  unit: Wb
  physics_domain: equilibrium
