- name: width_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: "Full transverse width of a rectangular diagnostic aperture along X1\
    \ in its local aperture frame (X1, X2, X3), where X1 and X2 span the opening and\
    \ X3 is normal to it. It defines one clear-opening dimension for line-of-sight\
    \ collimation, aperture area, and \xE9tendue calculations."
  documentation: "Width of a diagnostic aperture is the full clear opening of a rectangular\
    \ aperture measured along the $X_1$ direction of a local Cartesian aperture frame\
    \ $(X_1, X_2, X_3)$. The $X_1$ and $X_2$ axes span the aperture plane, while $X_3$\
    \ is normal to the aperture or aligned with the nominal line of sight. It is one\
    \ of the two transverse dimensions that determine the finite acceptance of a collimating\
    \ opening.\n\nFor an ideal rectangular opening, the clear aperture area is the\
    \ product of the two transverse widths:\n\n$$\nA = w_1 w_2\n$$\n\nwhere $A$ is\
    \ the open area in m$^2$, $w_1$ is this width along $X_1$ in m, and $w_2$ is the\
    \ companion orthogonal width along $X_2$ in m. The geometric \xE9tendue for small-angle\
    \ uniform acceptance scales approximately as $A\\Omega$, where $\\Omega$ is the\
    \ accepted solid angle.\n\nIn practice, the width is taken from mechanical design\
    \ models, engineering drawings, or as-built metrology at the limiting clear aperture,\
    \ excluding masks, supports, bevels, or other structures that do not transmit\
    \ the line of sight. The physical concept is the diagnostic counterpart of width_of_aperture,\
    \ which describes the same full transverse opening dimension for non-diagnostic\
    \ collimators. The orthogonal $X_2$ aperture width supplies the second rectangular\
    \ dimension; [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture)\
    \ is the corresponding size parameter for circular diagnostic openings, while\
    \ [filter_window_width](name:filter_window_width) describes a transmitting window\
    \ rather than the collimating aperture itself.\n\nTypical values range from $1\
    \ \\times 10^{-4}$-$5 \\times 10^{-2}$ m. Fiber entrances and pinholes are often\
    \ $1 \\times 10^{-4}$-$2 \\times 10^{-3}$ m, bolometer slits and small optical\
    \ apertures are commonly $10^{-3}$-$10^{-2}$ m, and neutron or gamma-ray collimating\
    \ apertures may reach several $10^{-2}$ m."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
