- name: flux_surface_averaged_boron_density
  kind: scalar
  status: draft
  description: Number density of boron ions averaged over the last closed flux surface
    (separatrix) at the plasma boundary, summed over all ionization states and excluding
    neutral boron atoms. It quantifies the boundary boron impurity content as a particle
    density.
  documentation: 'Flux-surface-averaged boron density is the number density of boron
    ions averaged over the last closed flux surface (separatrix) at the plasma boundary.
    The boron population is counted by nuclei in ionic charge states only, so neutral
    boron atoms are excluded. It is the flux-surface-averaged counterpart of [boron_density_at_plasma_boundary](name:boron_density_at_plasma_boundary)
    and can be compared with [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density)
    to characterize the boundary boron fraction.


    In magnetic flux coordinates $(\psi, \theta, \phi)$, where $\psi$ labels nested
    toroidal flux surfaces, $\theta$ is a poloidal angle, and $\phi$ is the toroidal
    angle, the boundary value is the closed-surface limit of the Jacobian-weighted
    flux-surface average:


    $$

    \left\langle n_\mathrm{B} \right\rangle_\mathrm{LCFS} = \lim_{\psi \to \psi_b}
    \frac{\int_0^{2\pi} n_\mathrm{B}(\psi, \theta)\, J(\psi, \theta)\, d\theta}{\int_0^{2\pi}
    J(\psi, \theta)\, d\theta}

    $$


    where $n_\mathrm{B}$ is the local boron ion density in $\mathrm{m}^{-3}$ summed
    over all charge states, $\psi_b$ is the flux value at the last closed flux surface,
    and $J$ (in $\mathrm{m}/\mathrm{T}$ for $(\psi, \theta)$) is the coordinate-space
    Jacobian that supplies the flux-surface-average weighting measure rather than
    a simple arithmetic average over poloidal angle. Near an X point the separatrix
    value is interpreted as a limit from neighboring closed flux surfaces.


    The quantity is inferred from edge impurity emission spectroscopy combined with
    charge-state-resolved collisional-radiative and impurity-transport modeling, mapped
    to the plasma boundary through equilibrium reconstruction. Because each boron
    ion is counted once regardless of charge state, this is a particle density and
    carries no charge-squared weighting; charge-state populations are required separately
    to evaluate charge density, radiated power, or effective-charge contributions.


    Unlike the present quantity, [volume_averaged_boron_density](name:volume_averaged_boron_density)
    averages over the entire confined plasma volume and, depending on definition,
    may include neutral boron. Boundary boron densities depend strongly on wall conditioning,
    boronization, and edge transport, and are typically small relative to the boundary
    total ion density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density_at_plasma_boundary
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  - name:volume_averaged_boron_density
  sources:
  - id: dd:summary/local/separatrix_average/n_i/boron/value
    dd_path: summary/local/separatrix_average/n_i/boron/value
    status: composed
- name: flux_surface_averaged_carbon_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total elemental carbon number density on
    a closed magnetic surface. The local carbon density is summed over all charge
    states from neutral carbon to fully stripped carbon before averaging.
  documentation: 'Flux-surface-averaged carbon density is the mean total elemental
    carbon number density on a closed magnetic flux surface. The local carbon density
    is summed over all charge states from neutral carbon through fully stripped carbon
    before averaging, matching the charge-state scope of [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    and [line_averaged_carbon_density](name:line_averaged_carbon_density) while using
    a magnetic-surface average.


    For an axisymmetric closed surface labeled by the poloidal magnetic flux $\psi$,
    the flux-surface average over the closed poloidal contour is


    $$

    \langle n_C \rangle_\psi = \frac{\oint_\psi n_C(R,Z)\, R\, dl / |\nabla\psi|}{\oint_\psi
    R\, dl / |\nabla\psi|}

    $$


    where $n_C = \sum_{q=0}^{6} n_{\mathrm{C},q}$ is the total carbon density, $n_{\mathrm{C},0}$
    is neutral carbon, and $n_{\mathrm{C},6}$ is fully stripped carbon. The contour
    lies in a poloidal cross-section of the right-handed cylindrical $(R,\phi,Z)$
    frame, with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical
    height; $dl$ is the arc-length element in meters, $\psi$ is in webers, and $|\nabla\psi|$
    is in Wb m$^{-1}$. The denominator normalizes the geometric weighting so the result
    retains units of m$^{-3}$.


    In practice, local charge-state densities are estimated from impurity spectroscopy,
    charge-exchange recombination measurements when available, collisional-radiative
    modeling, and particle-balance constraints for weakly observed charge states.
    A magnetic equilibrium maps those local estimates to the same closed flux surfaces
    used for [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density),
    and the charge-state sum is formed consistently before applying the average.


    Representative edge-plasma values are commonly $10^{16}-10^{18}\ \mathrm{m}^{-3}$
    in carbon-wall or carbon-seeded conditions, with smaller values possible in low-carbon
    metal-wall plasmas and larger transient values during sputtering or injection
    events. Comparison with [ratio_of_carbon_density_to_electron_density](name:ratio_of_carbon_density_to_electron_density)
    expresses the carbon burden relative to electrons, while [carbon_density_at_magnetic_axis](name:carbon_density_at_magnetic_axis)
    gives the corresponding central local value. The analogous [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density)
    applies the same magnetic-surface average to iron.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_iron_density
  - name:ratio_of_carbon_density_to_electron_density
  sources:
  - id: dd:summary/local/separatrix_average/n_i/carbon/value
    dd_path: summary/local/separatrix_average/n_i/carbon/value
    status: composed
- name: flux_surface_averaged_iron_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total iron impurity ion number density,
    summed over all iron ionization states. It represents the density assigned to
    a magnetic flux surface after averaging local variation around that surface, not
    a statement that iron is spatially uniform there.
  documentation: 'Flux-surface-averaged iron density is the average of the total iron
    impurity ion number density on a magnetic flux surface. The total iron density
    is summed over all iron ionization states. It is a representative density for
    the surface and does not imply that the local iron density is uniform on that
    surface.


    The flux-surface average can be written using a poloidal magnetic flux label $\psi$:


    $$

    \langle n_{\mathrm{Fe}}\rangle_{\psi} = \frac{\int_{\psi=\mathrm{const}} n_{\mathrm{Fe}}\,
    dA/|\nabla\psi|}{\int_{\psi=\mathrm{const}} dA/|\nabla\psi|}

    $$


    where $n_{\mathrm{Fe}}$ is the local total iron ion density in $\mathrm{m}^{-3}$,
    $n_{\mathrm{Fe}}=\sum_q n_{\mathrm{Fe}^{q+}}$ over iron ionization states $q$,
    $dA$ is a surface-area element in $\mathrm{m}^2$, and $|\nabla\psi|$ is in $\mathrm{Wb}\,\mathrm{m}^{-1}$
    when $\psi$ is in $\mathrm{Wb}$. The weighting corresponds to averaging over the
    thin volume between neighboring flux surfaces.


    In practice, this quantity is obtained by combining an equilibrium reconstruction
    that supplies the magnetic flux surfaces with local or modeled iron charge-state
    densities. These densities may be inferred from extreme-ultraviolet, x-ray, or
    visible line emission with collisional-radiative modeling, and may be constrained
    by impurity transport, radiation, electron density, and electron temperature measurements.
    Strong edge gradients and localized sources can make the local iron density vary
    strongly on a surface, so the flux-surface average should be interpreted as an
    averaged abundance rather than a local value.


    Typical values for trace iron contamination are $10^{12}-10^{16}\ \mathrm{m}^{-3}$
    in confined plasmas. During strong wall influx, impurity accumulation, disruptions,
    or deliberate impurity injection, edge or separatrix averages can reach $10^{17}\
    \mathrm{m}^{-3}$ or higher.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_carbon_density
  - name:iron_density
  - name:volume_averaged_iron_density
  - name:iron_density_at_magnetic_axis
  - name:iron_density_at_divertor_target
  sources:
  - id: dd:summary/local/separatrix_average/n_i/iron/value
    dd_path: summary/local/separatrix_average/n_i/iron/value
    status: composed
- name: flux_surface_averaged_magnetic_shear
  kind: scalar
  status: draft
  description: Flux-surface value of magnetic shear, describing how the safety factor
    changes with normalized toroidal flux radius on a magnetic flux surface. When
    the safety factor is a flux function, it is the representative surface value,
    not an independent average of a local pointwise shear.
  documentation: 'Flux-surface-averaged magnetic shear is the magnetic shear assigned
    to an entire magnetic flux surface, quantifying the radial variation of field-line
    pitch through the safety factor. It is the flux-surface counterpart of [magnetic_shear](name:magnetic_shear_at_pedestal);
    when the safety factor is constant on a flux surface, no separate local-shear
    averaging model is implied.


    The value on a surface labeled by normalized toroidal flux radius $\rho_{\mathrm{tor}}$
    is defined by:


    $$

    s_{\mathrm{fs}}(\rho_{\mathrm{tor}}) = \frac{\rho_{\mathrm{tor}}}{q(\rho_{\mathrm{tor}})}
    \frac{d q}{d \rho_{\mathrm{tor}}}

    $$


    where $s_{\mathrm{fs}}$ is the flux-surface value of magnetic shear, $q$ is the
    [safety factor](name:safety_factor), and $\rho_{\mathrm{tor}}$ labels the flux
    surface, with $\rho_{\mathrm{tor}}=0$ at the magnetic axis and $\rho_{\mathrm{tor}}=1$
    at the last-closed flux surface.


    In practice, this quantity is inferred from an equilibrium description by evaluating
    the radial derivative of $q(\rho_{\mathrm{tor}})$ at the chosen surface, such
    as a separatrix, pedestal, or internal-transport-barrier location. It is sensitive
    to the local radial variation of $q$, so uncertainty is largest where the safety-factor
    variation is weakly constrained or changes rapidly.


    Typical dimensionless values are of order unity to several in many tokamak equilibria.
    Values near zero indicate a locally flat safety-factor variation, negative values
    indicate reversed magnetic shear, and larger positive values can occur in steep-gradient
    edge or separatrix regions.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_pedestal
  - name:safety_factor
  sources:
  - id: dd:summary/local/separatrix_average/magnetic_shear/value
    dd_path: summary/local/separatrix_average/magnetic_shear/value
    status: composed
- name: helium_3_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of helium-3 ions (the stable helium isotope with mass
    number 3) evaluated at the plasma boundary, the last closed flux surface separating
    the magnetically confined plasma from the scrape-off layer.
  documentation: "Helium-3 ($^3$He) is the stable helium isotope with two protons\
    \ and one neutron (mass number 3, charge number 2). This quantity gives the number\
    \ of $^3$He ions per unit volume evaluated at the plasma boundary, defined as\
    \ the last closed flux surface (separatrix) that divides the closed-field-line\
    \ confined region from the open-field-line scrape-off layer. It is the helium-3\
    \ specialization of [density_at_plasma_boundary](name:density_at_plasma_boundary).\n\
    \nHelium-3 enters tokamak plasmas either as a minority heating species in ion\
    \ cyclotron resonance heating schemes, where a small $^3$He fraction resonates\
    \ efficiently with the ICRH wave, or as a fuel ion in D-$^3$He burn scenarios.\
    \ In both cases, the boundary density is a key parameter for edge particle balance\
    \ and fuel-purity assessment. Boundary values are inferred from charge-exchange\
    \ recombination spectroscopy using $^3$He spectral lines or from edge transport\
    \ modeling constrained by particle flux boundary conditions.\n\nTypical $^3$He\
    \ boundary densities in minority-heating scenarios lie in the range $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$, well below the separatrix electron density of $10^{19}$\u2013\
    $10^{20}$ m$^{-3}$. The corresponding core value is captured by [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis),\
    \ the pedestal-top value by [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal),\
    \ and the downstream target value by [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target),\
    \ together forming a complete radial survey of $^3$He ion density from core to\
    \ divertor."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:helium_3_density_at_magnetic_axis
  - name:helium_3_density_at_pedestal
  - name:helium_3_density_at_divertor_target
  sources:
  - id: dd:summary/local/separatrix/n_i/helium_3/value
    dd_path: summary/local/separatrix/n_i/helium_3/value
    status: attached
  - id: dd:summary/local/separatrix_average/n_i/helium_3/value
    dd_path: summary/local/separatrix_average/n_i/helium_3/value
    status: composed
- name: helium_4_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of helium-4 ions evaluated on the plasma boundary, the
    last closed flux surface separating the magnetically confined plasma from the
    scrape-off layer.
  documentation: 'Helium-4 density at the plasma boundary is the number density of
    ions whose nuclei are the isotope $^{4}\mathrm{He}$, evaluated on the last closed
    flux surface. The plasma boundary is the separatrix between the closed-field-line
    region and the scrape-off layer. The quantity is non-negative and is a species
    density, not a charge density.


    Using a flux-coordinate system $(\rho,\theta,\phi)$ with normalized radial label
    $\rho$ chosen so that the plasma boundary is at $\rho=1$, the local boundary value
    is


    $$

    n_{^{4}\mathrm{He},b} = n_{^{4}\mathrm{He}}(\rho=1)

    $$


    where $n_{^{4}\mathrm{He}}$ is the helium-4 ion number density field and the subscript
    $b$ denotes evaluation at the boundary. This definition specifies boundary evaluation
    only; it does not by itself imply a flux-surface average over $(\theta,\phi)$.
    If an averaged boundary value is used, that averaging is an additional reduction
    of the local boundary density.


    In practice the value is obtained by evaluating a species-resolved edge plasma
    model or reconstruction at the separatrix, often constrained by spectroscopic,
    charge-exchange, divertor, or edge-profile measurements when available. In a fully
    ionized plasma, helium-4 is typically present as $\mathrm{He}^{2+}$, so its electron-density
    contribution is $2 n_{^{4}\mathrm{He}}$; charge-state effects should be treated
    consistently when partial ionization is important near the edge.


    Typical values can range from near 0 m^-3 when helium-4 is absent or weakly retained
    to about $10^{16}$-$10^{19}$ m^-3 in plasmas with helium ash, helium fueling,
    or dedicated helium operation. The upper range is limited by the local edge electron
    density and the helium concentration.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
