- name: radial_magnetic_flux
  kind: scalar
  status: draft
  description: Component of the magnetic vector potential projected onto the major-radius
    direction in the right-handed cylindrical frame.
  documentation: "The radial component $A_R = A \\cdot \\hat{R}$ of the magnetic vector\
    \ potential $\\mathbf{A}$ quantifies the poloidal magnetic flux per unit length\
    \ through surfaces normal to the major-radius direction. It is related to the\
    \ toroidal magnetic field via $\\mathbf{B} = \\nabla \\times \\mathbf{A}$, giving\
    \ $B_\\phi = (\\partial A_Z / \\partial R - \\partial A_R / \\partial Z)$ in the\
    \ cylindrical $(R, \\phi, Z)$ basis. This component is computed from equilibrium\
    \ reconstruction codes that solve the Grad\u2013Shafranov equation, yielding $A_R$\
    \ as part of the vector potential solution on generalized grid subsets throughout\
    \ the plasma volume. Typical values in the plasma edge range from 0.1 to 1 T\xB7\
    m for medium-size tokamaks such as DIII-D and ASDEX Upgrade. See also [magnetic_flux](name:magnetic_flux)\
    \ as the parent quantity, and the poloidal component [vertical_magnetic_flux](name:vertical_magnetic_flux)\
    \ for the complementary projection."
  unit: T.m
  physics_domain: equilibrium
