- name: second_coordinate_radius_of_curvature_of_filter_window
  kind: scalar
  status: draft
  description: Radius of curvature of the filter window surface measured along the
    second local coordinate direction (X2), defined as the radius of the osculating
    circle to the surface cross-section curve in the X2 direction. Applies only when
    the window curvature type index is 3 or 5, indicating a non-planar surface geometry
    that is curved in X2.
  documentation: 'The second-coordinate radius of curvature $R_2$ characterizes how
    sharply the filter window surface bends along the local X2 direction. Formally,
    if the surface is parameterized by the local coordinates $(X1, X2)$, then $R_2$
    is the radius of the osculating circle to the curve obtained by holding $X1$ constant
    and varying $X2$: $R_2 = \left(1 + \left(\frac{\partial z}{\partial X2}\right)^2\right)^{3/2}
    \bigg/ \left|\frac{\partial^2 z}{\partial X2^2}\right|$, where $z$ is the surface
    height along the local surface normal. A larger value of $R_2$ indicates a flatter
    surface in the X2 direction; as $R_2 \to \infty$ the window approaches a plane
    in that direction. Physically, $R_2$ is the distance from the surface to the center
    of curvature along the local outward surface normal, measured in the X2 cross-section
    plane.


    This quantity is filled only when the curvature type index equals 3 (curved in
    X2 only) or 5 (curved in both X1 and X2, i.e., a doubly curved surface such as
    a spherical cap or a toroidal segment). When the index is 1 (flat) or 2 (curved
    in X1 only), $R_2$ is not applicable and should not be populated.


    Typical values for diagnostic filter windows range from tens of millimeters for
    strongly curved focusing windows to several meters for nearly planar windows.
    The quantity is always positive; the sense of bending (concave vs. convex relative
    to the incoming radiation) is encoded separately through the curvature type index
    rather than through the sign of $R_2$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_radius_of_curvature_of_filter_window
  - name:second_coordinate_width_of_filter_window
  - name:radius_of_filter_window
  constraints: []
  sources:
  - id: dd:soft_x_rays/channel/filter_window/x2_curvature
    dd_path: soft_x_rays/channel/filter_window/x2_curvature
    status: composed
  - id: dd:spectrometer_x_ray_crystal/channel/filter_window/x2_curvature
    dd_path: spectrometer_x_ray_crystal/channel/filter_window/x2_curvature
