name: boron_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Number density of ionized boron summed over all charge states, representing
  the charged boron population in the plasma.
documentation: The boron ion number density $n_{\mathrm{B,ion}}$ quantifies the total
  volumetric concentration of boron ions (from $\mathrm{B}^{1+}$ through $\mathrm{B}^{5+}$)
  in the plasma. Note that the listed unit is dimensionless (1), which is inconsistent
  with the expected physical unit of $\mathrm{m^{-3}}$ for a number density; this
  discrepancy should be flagged for upstream correction. In typical tokamak core conditions
  ($T_e > 200\;\mathrm{eV}$), boron is fully stripped to $\mathrm{B}^{5+}$, so $n_{\mathrm{B,ion}}
  \approx n_{\mathrm{B}}$. The boron ion population contributes to $Z_{\mathrm{eff}}$
  as $\Delta Z_{\mathrm{eff}} = n_{\mathrm{B}^{5+}} \cdot 25 / n_e$ for fully ionized
  boron. Measured via charge-exchange recombination spectroscopy on injected neutral-beam
  atoms or inferred from visible bremsstrahlung and soft-X-ray tomography. See also
  `boron_number_density` for the total boron content and `ion_number_density` for
  the generic ion density.
