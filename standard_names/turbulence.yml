    status: composed
- name: parallel_normalized_perturbed_current_density_bessel_1
  kind: scalar
  status: draft
  description: Dimensionless parallel current-density moment of the perturbed gyrocenter
    distribution function weighted by the first-order Bessel function J1. It represents
    the finite-Larmor-radius part of the parallel current response.
  documentation: 'This quantity is a normalized moment of the perturbed gyrocenter
    distribution function formed with charge, parallel velocity, and a first-order
    Bessel weight. The $J_1$ factor isolates the finite-Larmor-radius contribution
    to the parallel current response, distinct from the $J_0$ gyroaveraged parallel
    current moment.


    A representative definition is


    $$

    \hat{j}_{\parallel,J_1} = \frac{1}{j_\mathrm{ref}} \sum_s q_s \int v_\parallel
    J_1(\lambda_s)\,\delta f_s\,d^3v

    $$


    where the sum is over species $s$, $q_s$ is the signed species charge, $v_\parallel$
    is velocity along the equilibrium magnetic field, $\delta f_s$ is the perturbed
    gyrocenter distribution function, $J_1$ is the first-order Bessel function, $\lambda_s
    = k_\perp v_\perp/|\Omega_s|$ is the gyroaveraging argument, and $j_\mathrm{ref}$
    is the reference current density used for normalization. The numerator has the
    dimensions of current density, and division by $j_\mathrm{ref}$ makes the reported
    quantity dimensionless with unit 1.


    In practice this moment is computed from the eigenmode perturbation in velocity
    space. Because $J_1(x) \simeq x/2$ for small $x$, the moment is small at long
    perpendicular wavelength and becomes more important when $k_\perp \rho_s$ is appreciable,
    where finite-Larmor-radius electromagnetic effects contribute to the parallel
    current response.


    Because a linear eigenmode has arbitrary overall amplitude, typical magnitudes
    depend on the chosen eigenvector normalization. For perturbations normalized so
    that the dominant fluctuating field or distribution component is order unity,
    values below $10^{-3}$ indicate a negligible $J_1$-weighted current response,
    while $10^{-2}-1$ is typical when finite-Larmor-radius electromagnetic coupling
    is significant.


    Sign convention: Positive when the $J_1$-weighted perturbed current density is
    directed along the positive parallel direction, defined by the equilibrium magnetic-field
    direction used for positive $v_\parallel$.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_gyrocenter_gyroaveraged_current_density
  - name:parallel_normalized_perturbed_current_density
  - name:parallel_normalized_perturbed_pressure_bessel_1
  - name:parallel_normalized_perturbed_heat_flux_bessel_1
