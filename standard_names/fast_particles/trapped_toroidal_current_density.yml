name: trapped_toroidal_current_density
status: draft
cocos_transformation_type: one_like
description: Total toroidal current density carried by trapped particles, including
  fast-ion, thermal-ion, and electron back-current contributions.
documentation: "The trapped toroidal current density $j_{\\phi,\\mathrm{trap}}$ sums\
  \ all contributions to the toroidal current from magnetically trapped particles\
  \ on banana orbits, encompassing the direct fast-ion current and the associated\
  \ thermal-electron and thermal-ion drag (back-) currents. In a tokamak, trapped\
  \ particles occupy the region of velocity space with pitch-angle cosine $|\\xi|\
  \ < \\sqrt{1 - B_{\\min}/B_{\\max}}$, where $B_{\\min}$ and $B_{\\max}$ are the\
  \ minimum and maximum magnetic-field strengths on the flux surface. Although a single\
  \ trapped particle averages to zero parallel velocity over a full bounce, finite\
  \ orbit-width (FOW) effects, pressure gradients, and collisional friction produce\
  \ a net toroidal current density that is important for bootstrap-current and fast-particle-driven\
  \ current calculations. Typical magnitudes are $10^3$\u2013$10^6\\;\\mathrm{A\\\
  ,m^{-2}}$ in the core of auxiliary-heated discharges. Positive when the net current\
  \ is in the $+\\phi$ direction under COCOS-11. See `trapped_fast_ion_toroidal_current_density`\
  \ for the fast-ion-only trapped contribution."
