        conduction. A time-resolved scalar representing the conductive heat flux channel
        contribution to the total power load on the target.
      kind: llm
- name: power_due_to_convection
  kind: scalar
  status: active
  description: Power deposited on plasma-facing surfaces by convective plasma particle
    flux, comprising thermal enthalpy and directed kinetic energy carried by streaming
    ions and electrons from the scrape-off layer.
  documentation: "Convective power quantifies the energy transported to a plasma-facing\
    \ surface by the bulk flow of plasma particles \u2014 ions, electrons, and neutral\
    \ species \u2014 streaming along open magnetic field lines from the scrape-off\
    \ layer to bounding material surfaces. It represents the convective channel of\
    \ the total surface power balance, distinct from the conductive contribution driven\
    \ by parallel temperature gradients and from radiative deposition.\n\nThe local\
    \ convective heat-flux density summed over particle species $s$ is\n\n$$\nq_{\\\
    mathrm{conv}} = \\sum_s n_s v_{\\parallel,s} \\left( \\frac{\\gamma_s}{\\gamma_s\
    \ - 1} k_B T_s + \\frac{1}{2} m_s v_{\\parallel,s}^2 \\right)\n$$\n\nwhere $n_s$\
    \ is the number density, $v_{\\parallel,s}$ the parallel flow speed, $\\gamma_s$\
    \ the adiabatic index (5/3 for monatomic species), $T_s$ the temperature, and\
    \ $m_s$ the particle mass. Integrating $q_{\\mathrm{conv}}$ over the wetted surface\
    \ area yields the total convective power in watts.\n\nIn experiments the convective\
    \ power is inferred from Langmuir-probe measurements of particle flux and sheath-entrance\
    \ temperature, or decomposed from total calorimetric measurements by subtracting\
    \ the conductive fraction estimated via two-point model analysis. More specific\
    \ realizations include [power at a single divertor target due to convection](name:power_at_divertor_target_due_to_convection),\
    \ [convective power summed over all divertor targets](name:power_of_divertor_due_to_convection),\
    \ and [convective power at the first wall](name:power_at_wall_due_to_convection).\
    \ The full surface load integrating all channels is characterized by heat_flux_of_plasma_facing_component."
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_convection
  - name:power_of_divertor_due_to_convection
  - name:power_at_wall_due_to_convection
- name: power_at_divertor_target_due_to_convection
  kind: scalar
  status: active
  description: Power deposited on a single divertor target by convective plasma particle
    flux, comprising thermal enthalpy and directed kinetic energy carried by streaming
    ions and electrons from the scrape-off layer.
  documentation: 'Convective power at a single divertor target quantifies the energy
    transported to that target by plasma particles streaming from the scrape-off layer.
    It includes thermal enthalpy and directed kinetic energy carried into the material
    surface and is the target-local contribution to [power due to convection](name:power_due_to_convection).


    The target-integrated convective power is defined by


    $$

    P_{\mathrm{conv,target}} = \int_{A_{\mathrm{target}}} \sum_s n_s v_{n,s} \left[
    \frac{\gamma_s}{\gamma_s-1} k_B T_s + \frac{1}{2}m_s v_{n,s}^{2} \right] \, dA

    $$


    where $A_{\mathrm{target}}$ is the wetted target surface, $n_s$ is the number
    density of species $s$, $v_{n,s}$ is its flow speed normal to and into the target,
    $\gamma_s$ is its adiabatic index, $k_B$ is Boltzmann''s constant, $T_s$ is its
    temperature, and $m_s$ is its particle mass. The species sum includes the particle
    channels assigned to convective transport and excludes conductive and radiative
    deposition.


    This quantity applies to one target; summing corresponding target contributions
    gives [convective power of the divertor](name:power_of_divertor_due_to_convection).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_convection
  - name:power_of_divertor_due_to_convection
  arguments:
  - name: power_due_to_convection
    operator: divertor_target
    operator_kind: locus
  sources:
  - dd_path: divertors/divertor/target/power_convected
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_convected
    dd_documentation:
      leaf: Power convected by the plasma on this divertor target
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power convected by the plasma onto a divertor target surface, representing
        the kinetic energy flux carried by plasma particle flow (convective heat transport)
        to the target. Complements the conducted power channel in the total target
        heat load.
      kind: llm
- name: power_due_to_fusion
  kind: scalar
  status: active
  description: Nuclear fusion reaction energy deposition rate integrated over a specified
    plasma region or material component. It counts fusion-product energy where it
    is deposited, not merely where it is released.
  documentation: 'Nuclear fusion reaction energy deposition rate integrated over a
    specified plasma region or material component is the rate at which energy whose
    ultimate source is fuel-ion fusion reactions is transferred to matter within that
    region or component. It is an extensive deposited-power quantity, so energy is
    assigned to the place where it is deposited, which may differ from the place where
    the fusion reaction occurred.


    For a specified region or component $\Omega$, the quantity is defined by the local
    fusion-origin deposition rate density:


    $$

    P_{\mathrm{fusion,dep}}(\Omega) = \int_{\Omega} q_{\mathrm{fusion,dep}}(\mathbf{x})\,
    dV

    $$


    where $q_{\mathrm{fusion,dep}}(\mathbf{x})$ is the local rate density of energy
    deposited at position $\mathbf{x}$ by fusion products, fusion-neutron interactions,
    and secondary nuclear radiation, and $dV$ is the volume element of $\Omega$.


    Each reaction channel contributes according to the partition of its released energy
    among products. For the deuterium-tritium channel, approximately one fifth of
    the fusion energy is born in the alpha particle and four fifths in the neutron;
    this birth partition does not imply local deposition. Charged-product energy is
    included in a plasma region only for the fraction actually deposited there during
    slowing down, while escaping charged products or neutrons contribute where they
    subsequently deposit energy through interactions and secondary radiation.


    This name is distinct from [power density due to fusion](name:power_density_due_to_fusion),
    which denotes local fusion energy release rate before nonlocal transport, and
    from [neutron power](name:neutron_power), which tracks energy carried by neutrons
    rather than deposited energy in $\Omega$. [Power due to neutron interaction] is
    the neutron-interaction contribution when the interacting neutrons originate from
    fusion. The divertor specializations [deposited power of divertor due to fusion](name:deposited_power_of_divertor_due_to_fusion)
    and [power of divertor due to fusion](name:power_of_divertor_due_to_fusion) restrict
    $\Omega$ to the divertor; non-fusion heat loads such as conduction, plasma radiation,
    charge-exchange neutrals, and externally supplied heating are excluded.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_density_due_to_fusion
  - name:power_of_divertor_due_to_fusion
- name: power_due_to_radiation
  kind: scalar
  status: active
  description: Power due to radiation is the net rate at which photon energy is absorbed
    by a specified plasma-facing surface or assembly after reflected photon energy
    is excluded.
  documentation: 'Power due to radiation is the net rate at which photon energy from
    plasma radiation is absorbed by a specified plasma-facing surface or assembly.
    It represents the radiative contribution to the surface heat load after excluding
    photon energy reflected by the material.


    For a plasma-facing surface $S$, it is defined by integrating the absorbed part
    of the incident radiative power flux density:


    $$

    P_{\mathrm{rad}} = \int_S \left[1-\rho_\gamma(\mathbf{r})\right] q_{\mathrm{rad}}(\mathbf{r})\,
    dA

    $$


    where $P_{\mathrm{rad}}$ is the power due to radiation, $q_{\mathrm{rad}}(\mathbf{r})$
    is the non-negative incident photon energy flux density onto the surface at position
    $\mathbf{r}$, $\rho_\gamma(\mathbf{r})$ is the effective photon-energy reflectivity
    for the incident spectrum and angular distribution, and $dA$ is an element of
    the receiving surface. The local surface normal is directed from the material
    into the plasma-facing half-space, so incident photons propagate toward the material.


    This quantity is an area-integrated absorbed power and is distinct from [flux_at_wall_due_to_radiation](name:flux_at_wall_due_to_radiation),
    which is an incident photon energy flux density at a wall, not a photon-number
    flux, before surface integration and before exclusion of reflected energy. It
    excludes conductive and convective plasma heat loads and power radiated by the
    material itself.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_of_divertor_due_to_radiation
- name: power_due_to_recombination
  kind: scalar
  status: active
  description: Power deposited on plasma-facing materials by recombination processes,
    encompassing both plasma-ion recombination and surface recombination of neutral
    atoms, without restriction to a particular surface location.
  documentation: 'Recombination power is the heat load delivered to plasma-facing
    materials when ions recover electrons and transition to neutral states, releasing
    ionization potential energy and residual kinetic energy at or near material surfaces.
    Two principal channels contribute: sheath-accelerated plasma-ion recombination
    at target surfaces, and surface recombination of neutral atoms into molecules,
    which deposits the molecular binding energy directly into the wall or divertor
    plate material.


    The integrated power from recombination events over a wetted area $A$ is:


    $$P_\text{rec} = \sum_s \int_A \Gamma_s \, E_s \, dA$$


    where $\Gamma_s$ [m$^{-2}$ s$^{-1}$] is the incident particle flux density for
    species $s$ and $E_s$ [J] is the energy released per recombination event for that
    species, including ionization potential and kinetic contributions.


    This power channel is intrinsically non-negative and becomes particularly significant
    in detached and partially detached divertor regimes, where volumetric ion-electron
    recombination upstream of the strike point redistributes energy deposition away
    from the target. Location-specific realizations include [power deposited on a
    single divertor target](name:power_at_divertor_target_due_to_recombination), the
    [total over the full divertor assembly](name:power_of_divertor_due_to_recombination),
    and [power at first-wall surfaces](name:power_at_wall_due_to_recombination). The
    neutral recombination particle flux produced in these processes is characterized
    by [neutral_energy_flux_due_to_recombination](name:neutral_energy_flux_at_wall_due_to_recombination).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_recombination
  - name:power_of_divertor_due_to_recombination
  - name:power_at_wall_due_to_recombination
  - name:neutral_energy_flux_at_wall_due_to_recombination
  sources:
  - dd_path: divertors/divertor/power_recombination_plasma
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-power_recombination_plasma
    dd_documentation:
      leaf: Power deposited on the divertor targets due to recombination of plasma
        ions (sum over all targets)
      parent_path: divertors/divertor
      parent: Set of divertors
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Power deposited on divertor targets due to recombination of plasma
        ions, summed over all targets of the divertor. Represents the energy released
        when ions recombine at the target surface, contributing to the total divertor
        heat load.
      kind: llm
- name: power_at_divertor_target_due_to_recombination
  kind: scalar
  status: active
  description: Total power deposited on a divertor target by recombination processes,
    summing the plasma-ion and neutral-particle recombination channels at the plasma-material
    interface.
  documentation: 'This quantity captures the combined recombination power delivered
    to a single divertor target, encompassing two physically distinct contributions:
    energy released when plasma ions recombine at or near the target surface (the
    plasma channel, quantified by plasma_power_at_divertor_target_due_to_recombination)
    and energy deposited when neutral particles undergo recombination into lower-energy
    bound states at the material wall (the neutral channel, quantified by [neutral_power_at_divertor_target_due_to_recombination](name:neutral_power_at_divertor_target_due_to_recombination)).


    The total recombination power at the target decomposes additively:


    $$

    P_{\rm rec,target} = P_{\rm rec,plasma} + P_{\rm rec,neutral}

    $$


    where $P_{\rm rec,plasma}$ is the ion-recombination contribution and $P_{\rm rec,neutral}$
    is the neutral-particle recombination contribution, both in W.


    This target-localized quantity is a spatial specialization of the volume-integrated
    [power_due_to_recombination](name:power_due_to_recombination), which integrates
    recombination power over the full plasma domain. In attached divertor operation,
    recombination power at the target is a minor fraction of the total heat load;
    in detached or high-recycling regimes, surface and volumetric recombination become
    significant energy sinks that reduce the conducted and convected flux reaching
    the target. It is inferred from edge plasma simulations or from particle flux
    measurements combined with surface energy-release models, and is non-negative
    by definition.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_at_divertor_target_due_to_recombination
  - name:power_due_to_recombination
  arguments:
  - name: power_due_to_recombination
    operator: divertor_target
    operator_kind: locus
- name: neutral_power_at_divertor_target_due_to_recombination
  kind: scalar
  status: active
  description: Neutral-particle power deposited on a divertor target by recombination
    processes at the plasma-material interface, excluding the plasma-ion recombination
    channel.
  documentation: 'This quantity captures the neutral-particle recombination power
    delivered to a single divertor target, encompassing energy deposited when neutral
    particles recombine into lower-energy bound states at the plasma-material interface.
    Only the fraction of released binding, internal, and kinetic energy accommodated
    by the target material contributes to this quantity.


    The target-localized neutral recombination power is the inward surface integral
    of the neutral-recombination energy-flux vector over the wetted target area:


    $$

    P_{\mathrm{rec,n,target}} = \int_{\mathcal{A}_t} \mathbf{q}_{\mathrm{rec,n}} \cdot
    \hat{\mathbf{n}}_{\mathrm{mat}} \, dA

    $$


    where $P_{\mathrm{rec,n,target}}$ is the neutral-particle recombination power
    at the target, $\mathbf{q}_{\mathrm{rec,n}}$ is the energy-flux vector due only
    to neutral-particle recombination, $\hat{\mathbf{n}}_{\mathrm{mat}}$ is the unit
    normal to the target surface directed into the material, and $\mathcal{A}_t$ is
    the target area receiving that contribution.


    This target-localized quantity is the neutral-particle channel of [power_at_divertor_target_due_to_recombination](name:power_at_divertor_target_due_to_recombination),
    distinct from [plasma_power_at_divertor_target_due_to_recombination](name:plasma_power_at_divertor_target_due_to_recombination),
    which describes recombination of plasma ions. It excludes conducted, convected,
    radiative, charge-exchange, ionization, and plasma-ion recombination heat loads.
    Summed over all divertor targets, it gives [neutral_power_of_divertor_due_to_recombination](name:neutral_power_of_divertor_due_to_recombination).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_recombination
  arguments:
  - name: power_at_divertor_target_due_to_recombination
    operator: neutral
    operator_kind: qualifier
  sources:
  - dd_path: divertors/divertor/target/power_recombination_neutrals
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/divertors.html#divertors-divertor-target-power_recombination_neutrals
    dd_documentation:
      leaf: Power deposited on this divertor target due to recombination of neutrals
        into a ground state (e.g. molecules)
      parent_path: divertors/divertor/target
      parent: Set of divertor targets
      data_type: STRUCTURE
      unit: W
    enhanced_context:
      description: Thermal power deposited on a divertor target due to recombination
        of neutral particles into their ground state (e.g., molecule formation). One
        component of the total power load on the target plate.
      kind: llm
- name: power_of_divertor
  kind: scalar
  status: active
  description: Total rate of energy deposited on wetted plasma-facing surfaces throughout
    the divertor assembly, summed over all included components and deposition channels.
  documentation: 'Divertor power is the total energy-deposition rate on the wetted
    plasma-facing surfaces of the complete divertor assembly. It includes deposition
    on all included divertor targets and other plasma-facing components, regardless
    of the deposition channel.


    The total deposited power is defined by the surface integral


    $$

    P_{\mathrm{div}} = \int_{S_{\mathrm{div}}} q_{\mathrm{dep}}(\mathbf{x})\,\mathrm{d}A

    $$


    where $S_{\mathrm{div}}$ is the union of wetted plasma-facing surfaces in the
    divertor assembly, $q_{\mathrm{dep}}$ is the inward energy-deposition flux density
    at surface position $\mathbf{x}$, and $\mathrm{d}A$ is a surface element.


    This quantity aggregates thermal plasma deposition, neutral-particle deposition
    represented by [neutral power of divertor](name:neutral_power_of_divertor), and
    other included channels without double counting. It is the parent quantity for
    the thermal contribution represented by [thermal power of divertor](name:thermal_power_of_divertor);
    power deposited outside the divertor assembly is excluded.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:neutral_power_of_divertor
  - name:thermal_power_of_divertor
  sources:
