name: major_radius_of_beam_tracing_beam
status: draft
cocos_transformation_type: one_like
description: Major-radius coordinate $R$ of a point along the central ray of a beam-tracing
  calculation for a coherent wave.
documentation: The major radius $R$ (in meters) specifies the radial position in the
  tokamak cylindrical coordinate system $(R, \phi, Z)$ of the beam-tracing ray path
  for a coherent wave. Beam tracing generalizes ray tracing by retaining a finite
  beam cross-section described by a paraxial (Gaussian) envelope around the central
  ray; this coordinate tracks the central-ray trajectory as it propagates through
  the plasma. It is used in auxiliary heating and current-drive modeling for electron
  cyclotron (ECRH/ECCD), ion cyclotron (ICRH), and lower-hybrid (LHCD) wave scenarios,
  and is computed by codes such as TORBEAM, GRAY, or C3PO. Typical values range from
  $R \approx 0.5\,\mathrm{m}$ (compact devices) to $R \approx 8\,\mathrm{m}$ (ITER-class
  machines), depending on the launch geometry and plasma equilibrium. The full spatial
  trajectory is described jointly with `vertical_coordinate_of_beam_tracing_beam`
  and the toroidal angle, enabling visualization of the wave deposition path.
