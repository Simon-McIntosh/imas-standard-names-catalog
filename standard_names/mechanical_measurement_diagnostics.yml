- name: parallel_ion_fluctuating_current_density
  kind: scalar
  status: draft
  description: Standard deviation of the ion current density component parallel to
    the local magnetic field, expressed per unit effective collection area perpendicular
    to that field. It is a non-negative fluctuation amplitude of the signed parallel
    ion current density.
  documentation: 'Parallel ion fluctuating current density is the standard deviation
    of the signed ion current density component along the local magnetic field. The
    current density is defined per unit effective collection area perpendicular to
    the local magnetic field, so it represents fluctuations of parallel ion flux density
    rather than fluctuations of total collected current.


    For a time series or ensemble of instantaneous parallel ion current density, the
    fluctuation amplitude is defined as the root-mean-square departure from the mean:


    $$

    j_{i\parallel,\sigma} = \sqrt{\left\langle \left(j_{i\parallel} - \left\langle
    j_{i\parallel}\right\rangle\right)^2 \right\rangle}

    $$


    where $j_{i\parallel,\sigma}$ and $j_{i\parallel}$ are in A m$^{-2}$, and $\langle\cdot\rangle$
    denotes the chosen time average, ensemble average, or analysis-window average.


    In collecting-surface measurements, the signed density is obtained from a collected
    ion current using $j_{i\parallel}=I_i/A_\mathrm{eff}$, where $I_i$ is in A and
    $A_\mathrm{eff}$ is the effective collection area in m$^2$ for ions moving along
    the local magnetic field. The same [effective collection area](name:effective_area_of_langmuir_probe)
    convention used for [parallel ion current density](name:parallel_ion_current_density)
    must be used for its fluctuation amplitude. Practical estimates also depend on
    the averaging interval, sampling bandwidth, detrending, and separation of slow
    changes from turbulent fluctuations.


    No universal absolute range in A m$^{-2}$ is intrinsic to this quantity, because
    it scales with local plasma density, ion sound speed, magnetic incidence angle,
    surface collection model, and analysis bandwidth. Comparisons are most meaningful
    when the effective-area convention and averaging window are stated, or when the
    amplitude is normalized to the local mean parallel ion current density.


    Because this quantity is a standard deviation, it is non-negative and does not
    retain the sign of the underlying instantaneous parallel ion current density.'
  unit: A.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:parallel_ion_current_density
  - name:ion_fluctuating_current_density
  - name:ion_saturated_fluctuating_current_density
  - name:fluctuating_electrostatic_potential
  sources:
  - id: dd:langmuir_probes/embedded/j_i_parallel_sigma
    dd_path: langmuir_probes/embedded/j_i_parallel_sigma
    status: composed
- name: thermal_energy_of_plant_component_port
  kind: scalar
  status: draft
  description: Cumulative thermal energy extracted through a cooling-loop port on
    a plant component since the start of the plasma pulse, obtained by time-integrating
    the measured coolant enthalpy balance.
  documentation: 'The thermal energy of a plant component port is the total heat removed
    by the cooling loop of that component, accumulated from pulse start to the current
    measurement time. It is the time-integral of the instantaneous [thermal power
    extracted at the port](name:thermal_power_of_plant_component_port), making it
    a running calorimetric total rather than a rate quantity.


    The defining relation is:


    $$

    E_\text{th}(t) = \int_0^t P_\text{th}(t'') \, dt''

    $$


    where $P_\text{th}$ is the instantaneous extracted thermal power (in W) and the
    lower integration limit is the start of the pulse.


    The integrand $P_\text{th}$ is itself derived from the coolant enthalpy balance
    $P_\text{th} = \dot{m} c_p (T_\text{out} - T_\text{in})$, where $\dot{m}$ is the
    coolant mass flow rate, $c_p$ is the specific heat capacity of the coolant, and
    $T_\text{out}$ and $T_\text{in}$ are the [outlet](name:coolant_temperature_at_outlet)
    and [inlet](name:coolant_temperature_at_inlet) coolant temperatures. This cumulative
    measure is used in pulse-integrated heat load accounting for plasma-facing components
    and cooling circuits, complementing the instantaneous power signal for assessing
    total energy deposition over a discharge.'
  unit: J
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:thermal_power_of_plant_component_port
  - name:coolant_temperature_at_outlet
  - name:coolant_temperature_at_inlet
  sources:
  - id: dd:calorimetry/group/component/energy_cumulated
    dd_path: calorimetry/group/component/energy_cumulated
    status: composed
- name: vertical_angle_of_camera
  kind: scalar
  status: draft
  description: Vertical angular field of view of the camera, defined as the total
    angular span covered along the detector-plane vertical direction.
  documentation: 'Vertical angle of a camera is the vertical field-of-view width:
    the total angular span imaged between the lower and upper edges of the active
    detector area along the detector-plane vertical direction. It is an angular aperture,
    not a signed pointing or elevation angle, so it is reported as a non-negative
    value in radians.


    For an ideal rectilinear optical model with an effective focal length, the vertical
    field of view is commonly approximated by:


    $$

    \theta_v = 2\arctan\left(\frac{h}{2 f_\mathrm{eff}}\right)

    $$


    where $\theta_v$ is the vertical angular field of view, $h$ is the active detector
    height in meters, and $f_\mathrm{eff}$ is the effective focal length in meters.
    This relation assumes a rectilinear projection and an effective focal length that
    already includes the relevant optical configuration.


    In practice, the value is obtained from optical design parameters, laboratory
    calibration, or a ray-tracing model of the camera and its lenses. For distorted,
    telecentric, or otherwise non-rectilinear optics, the field of view is better
    determined from the calibrated viewing rays at the vertical detector edges, or
    equivalently from the difference between the upper and lower vertical viewing-angle
    bounds of the detector pixels.


    Typical values for diagnostic cameras range from about 0.05-1 rad, with narrow
    views used for localized high-resolution imaging and wider views used to cover
    larger plasma-facing regions.'
  unit: rad
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:x_angle_of_camera
  sources:
  - id: dd:camera_ir/channel/camera/field_of_view_vertical
    dd_path: camera_ir/channel/camera/field_of_view_vertical
    status: composed
- name: x_coordinate_of_sensor_attachment_point
  kind: scalar
  status: draft
  description: X coordinate of the point where a sensor is mechanically attached to
    a device component, expressed in the right-handed Cartesian (x, y, z) frame. It
    is signed relative to the Cartesian origin and +x direction.
  documentation: 'The $x$ coordinate of a sensor attachment point is the signed horizontal
    position component of the mechanical point at which a sensor or its mount is fixed
    to a device component. It is defined in a right-handed Cartesian $(x, y, z)$ frame
    with basis $(\hat{x}, \hat{y}, \hat{z})$; $+\hat{z}$ is vertical and parallel
    to $+\hat{Z}$ of the right-handed cylindrical $(R, \phi, Z)$ frame. The origin
    lies on the toroidal symmetry axis at the machine midplane, so $z=0$ and $Z=0$
    denote the midplane.


    Relative to the right-handed cylindrical $(R, \phi, Z)$ frame, the horizontal
    Cartesian component is


    $$

    x = R \cos\phi

    $$


    where $R$ is major radius in meters and $\phi$ is toroidal angle in radians; $\phi=0$
    lies along $+\hat{x}$ and increasing $\phi$ points toward $+\hat{y}$ when viewed
    from $+\hat{z}$.


    Together with the [y coordinate of the sensor attachment point](name:y_coordinate_of_sensor_attachment_point)
    and the [vertical coordinate of the sensor attachment point](name:vertical_coordinate_of_sensor_attachment_point),
    this quantity specifies the mechanical attachment location. In practice it is
    obtained from engineering design geometry or from alignment surveys using coordinate-measuring
    equipment, laser trackers, photogrammetry, or optical metrology of the installed
    sensor and mount. The attachment point is a mechanical reference point, not necessarily
    the sensitive volume, viewing aperture, or line-of-sight origin of the sensor.


    Typical values are set by device size and by whether the sensor is mounted inside
    the vessel, on the vessel wall, or on external support structures. Compact devices
    often fall within $\pm 2$ m, medium-sized devices within $\pm 5$ m, and large
    devices or external diagnostic supports can reach $\pm 15$ m.


    Sign convention: Positive when the attachment point is displaced from the Cartesian
    origin in the $+\hat{x}$ direction.'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:y_coordinate_of_sensor_attachment_point
  - name:vertical_coordinate_of_sensor_attachment_point
  sources:
  - id: dd:operational_instrumentation/sensor/attachement_points/x
    dd_path: operational_instrumentation/sensor/attachement_points/x
    status: composed
- name: x_direction_unit_vector
  kind: scalar
  status: draft
  description: X-axis projection of a direction unit vector encoding the spatial orientation
    of a device or sensor in the right-handed Cartesian (x, y, z) frame.
  documentation: "The x component of the [direction_unit_vector](name:direction_unit_vector)\
    \ gives the projection of a hardware device's pointing direction onto the $\\\
    hat{x}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where $\\hat{z}$\
    \ coincides with the vertical $+Z$ direction and the azimuthal origin $\\phi =\
    \ 0$ is defined by facility convention.\n\nFor a unit vector $\\hat{d}$ specifying\
    \ device orientation, the three Cartesian components satisfy the unit-norm identity:\n\
    \n$$\nd_x^2 + d_y^2 + d_z^2 = 1\n$$\n\nwhere $d_x$ is this quantity, $d_y$ is\
    \ the [y_direction_unit_vector](name:y_direction_unit_vector_of_strain_gauge_sensor),\
    \ and $d_z$ is the [vertical_direction_unit_vector](name:vertical_direction_unit_vector).\
    \ This constraint restricts the valid range to $d_x \\in [-1, 1]$, with $|d_x|\
    \ = 1$ only when the device points purely along the $\\pm x$ axis.\n\nThis component\
    \ is determined from mechanical installation geometry \u2014 precision survey\
    \ measurements or engineering alignment procedures \u2014 rather than from plasma\
    \ diagnostics. It applies to a broad class of hardware components including sensors,\
    \ cameras, injector nozzles, and launcher mirrors whose spatial pointing must\
    \ be registered in a common Cartesian frame.\n\nSign convention: Positive when\
    \ the direction vector has a component in the $+x$ direction of the right-handed\
    \ Cartesian $(x, y, z)$ frame."
  unit: '1'
  physics_domain: mechanical_measurement_diagnostics
