- name: toroidal_deuterium_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal component of the deuterium ion flow velocity evaluated at
    the radial location of the internal transport barrier.
  documentation: "The toroidal deuterium velocity at the internal transport barrier\
    \ (ITB) is the $\\hat{\\phi}$-component of the bulk deuterium ion flow vector\
    \ sampled at the ITB \u2014 a region of reduced turbulent transport in the plasma\
    \ interior, characterized by steep gradients in temperature, density, and rotation\
    \ velocity, often associated with reversed or weak magnetic shear.\n\nThe quantity\
    \ is defined by the projection:\n\n$$\nv_\\phi^D = \\mathbf{v}_D \\cdot \\hat{\\\
    phi}\n$$\n\nwhere $\\hat{\\phi}$ is the unit vector in the direction of increasing\
    \ toroidal angle in the right-handed cylindrical $(R, \\phi, Z)$ frame, $R$ is\
    \ the major radius and $Z$ is the vertical coordinate.\n\nToroidal ion flow at\
    \ the ITB is measured primarily by charge exchange recombination spectroscopy\
    \ (CXRS), where the Doppler shift of emission lines from reactions between injected\
    \ neutral beam atoms and plasma deuterium ions yields the local bulk velocity.\
    \ Rotation velocities in ITB plasmas range from a few km/s to several tens of\
    \ km/s depending on plasma current, heating power, and barrier strength. Velocity\
    \ shear at the ITB location is closely linked to radial electric field structure\
    \ and plays a central role in turbulence suppression. For toroidal velocities\
    \ of other species at the same location, see [toroidal_tritium_velocity_at_internal_transport_barrier](name:toroidal_tritium_velocity_at_internal_transport_barrier)\
    \ and [toroidal_hydrogen_velocity_at_internal_transport_barrier](name:toroidal_hydrogen_velocity_at_internal_transport_barrier).\n\
    \nSign convention: Positive when the deuterium ion flow is directed in the direction\
    \ of increasing toroidal angle $\\phi$ (counter-clockwise when viewed from above\
    \ along $+\\hat{Z}$)."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_tritium_velocity_at_internal_transport_barrier
  - name:toroidal_hydrogen_velocity_at_internal_transport_barrier
