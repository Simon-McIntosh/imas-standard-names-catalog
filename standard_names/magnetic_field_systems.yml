        loops; any connected loops are expressed as active coil circuits with no power
        supply attached.
      data_type: FLT_0D
      unit: ohm
    enhanced_context:
      description: Electrical resistance of a passive conducting loop in the tokamak,
        characterizing its resistive dissipation. Together with the loop inductance,
        determines the L/R time constant governing the decay of induced eddy currents
        during plasma transients.
      kind: llm
- name: resistance_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Ohmic resistance of an individual poloidal-field coil winding, relating
    its resistive voltage drop to current and determining Joule dissipation.
  documentation: 'The ohmic resistance characterizes the opposition to electrical
    current in an individual poloidal-field coil winding and the associated conversion
    of electrical energy into heat.


    For coil current $I$ and resistive voltage drop $V_R$, the resistance is defined
    by


    $$

    V_R = R I

    $$


    where $R$ is the ohmic resistance, $I$ is the signed winding current in amperes,
    and $V_R$ is the resistive voltage drop in volts.


    This quantity excludes inductive back-EMF and other transient voltage contributions
    represented by the [voltage of the poloidal field coil](name:voltage_of_poloidal_field_coil).
    Its value may depend on the conductor state, including the [temperature of the
    poloidal field coil](name:temperature_of_poloidal_field_coil), and is conceptually
    analogous to the [resistance of the toroidal field coil](name:resistance_of_toroidal_field_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:voltage_of_poloidal_field_coil
  - name:resistance_of_toroidal_field_coil
  sources:
