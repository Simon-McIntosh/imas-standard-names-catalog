- name: major_radius_of_pellet
  kind: scalar
  status: draft
  description: Major radius (R) cylindrical coordinate of the position of a pellet
    used for plasma material injection.
  documentation: 'The major radius $R$ of the pellet position is the radial coordinate
    in the IMAS cylindrical $(R, \phi, Z)$ frame, measured from the machine symmetry
    axis to the pellet location. This coordinate determines the injection point of
    cryogenic pellets (e.g., for shattered pellet injection or fueling) and is critical
    for predicting pellet ablation dynamics and deposition profiles.


    Sign convention: Positive when the pellet position lies at $R > 0$, with the origin
    at the machine axis.


    Typical pellet injection radii range from $R \approx 1.5$ m (inner wall) to $R
    \approx 3.0$ m (outer midplane) in medium-size tokamaks; in ITER, the major radius
    is approximately $6.2$ m. The radial location is routinely prescribed by the injector
    geometry or adjusted for dedicated experiments. See also [major_radius_of_launching_position](name:major_radius_of_launching_position)
    for the analogous coordinate of electron cyclotron launchers.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:major_radius_of_launching_position
  sources:
  - id: dd:spi/injector/pellet/position/r
    dd_path: spi/injector/pellet/position/r
    status: composed
- name: major_radius_of_pellet_path
  kind: scalar
  status: draft
  description: Major radius of the second point defining the straight-line trajectory
    of a pellet injection path in the cylindrical (R, phi, Z) frame, measured from
    the machine symmetry axis.
  documentation: 'The major radius of the pellet path second point is one of two positions
    that define the straight-line trajectory of a pellet as it is injected and before
    it ablates. The path is determined by a first point and a second point, both given
    in the cylindrical (R, phi, Z) frame, with the trajectory extending from the first
    through the second in the direction of travel. The major radius is the radial
    distance from the machine symmetry axis (Z-axis) to the second point, measured
    in meters. Typical values for the major radius range from 0.5 m to 3.0 m depending
    on device size and pellet injector location. This coordinate pair allows calculation
    of the pellet''s velocity and direction of travel when combined with time-of-flight
    measurements. The second point is typically further along the trajectory than
    the first and is located near the plasma edge or beyond.


    Sign convention: Positive when the second point is radially outward from the machine
    symmetry axis.'
  unit: m
  physics_domain: plant_systems
  links:
  - name:major_radius_of_pellet
  - name:toroidal_angle_of_pellet_path
  sources:
  - id: dd:pellets/time_slice/pellet/path_geometry/first_point/r
    dd_path: pellets/time_slice/pellet/path_geometry/first_point/r
    status: skipped
  - id: dd:pellets/time_slice/pellet/path_geometry/second_point/r
    dd_path: pellets/time_slice/pellet/path_geometry/second_point/r
    status: skipped
- name: silane_source_rate_due_to_injection
  kind: scalar
  status: draft
  description: Instantaneous rate of silane molecules injected into the vacuum vessel
    via gas puffing systems for plasma-facing surface conditioning or diagnostic purposes.
  documentation: The silane source rate measures the number of silane (SiH$_4$) molecules
    per second introduced into the vacuum vessel from the gas injection system. Silane
    is used in tokamak operations for deposition of silicon coatings on plasma-facing
    components or for plasma chemistry studies. Typical injection rates range from
    $10^{18}\ \text{s}^{-1}$ to $10^{22}\ \text{s}^{-1}$, depending on the conditioning
    regime and diagnostic requirements. In the IMAS cylindrical $(R, \phi, Z)$ frame,
    the rate is a scalar quantity and does not depend on direction. The value is positive
    when silane flows into the vacuum vessel.
  unit: s^-1
  physics_domain: plant_systems
