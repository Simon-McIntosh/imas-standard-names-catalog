- name: z_major_axis_unit_vector_of_shatter_cone
  kind: scalar
  status: active
  description: Z component of the shatter-cone major-axis unit vector, resolved in
    the right-handed Cartesian (x, y, z) frame.
  documentation: 'The shatter cone is an elliptic cone forming the impact surface
    of a shattered pellet injector. When a pellet strikes this cone it fragments into
    a spray of shards directed toward the plasma vessel. The orientation of the cone''s
    elliptic cross-section is described by two orthogonal unit vectors; the major-axis
    unit vector $\hat{e}_\mathrm{major}$ defines the long axis of that ellipse.


    The z-component of the major-axis unit vector is the projection


    $$

    (\hat{e}_\mathrm{major})_z = \hat{e}_\mathrm{major} \cdot \hat{z}

    $$


    where $\hat{z}$ is the vertical basis vector of the right-handed Cartesian $(x,
    y, z)$ frame, aligned with the vertical axis $\hat{Z}$ of the cylindrical $(R,
    \phi, Z)$ frame. As a unit-vector component this quantity is dimensionless and
    lies in $[-1, 1]$.


    Together with [x_major_axis_unit_vector_of_shatter_cone](name:x_major_axis_unit_vector_of_shatter_cone)
    and [y_major_axis_unit_vector_of_shatter_cone](name:y_major_axis_unit_vector_of_shatter_cone),
    this component fully specifies the direction of the cone''s major axis in three-dimensional
    space. The corresponding minor-axis complement is [z_minor_axis_unit_vector_of_shatter_cone](name:z_minor_axis_unit_vector_of_shatter_cone).
    The cone direction is determined from injector geometry surveys or hardware design
    records.


    Sign convention: Positive when the major axis of the shatter cone has a component
    pointing in the $+z$ (vertically upward) direction.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:x_major_axis_unit_vector_of_shatter_cone
  - name:y_major_axis_unit_vector_of_shatter_cone
  sources:
