name: passive_loop_current
status: draft
description: Electric current flowing in a passive (unpowered) conducting structure
  surrounding the plasma, induced by time-varying magnetic flux.
documentation: 'Passive-loop currents arise in the resistive conducting structures
  (vacuum vessel segments, stabilizing shells, support rings) that surround the plasma
  column. They are driven by Faraday induction: $\mathcal{E} = -d\Phi/dt$, where $\Phi$
  is the total poloidal magnetic flux threading the loop and $\mathcal{E}$ the induced
  electromotive force. These eddy-like currents modify the external poloidal field
  seen by the plasma and play a critical role in vertical stability, resistive wall
  mode dynamics, and disruption current quench evolution. Measurement is typically
  performed with Rogowski coils or by monitoring the voltage across a calibrated shunt
  resistor on each vessel segment; values range from a few kA in quiescent phases
  to several hundred kA during disruptions. In equilibrium reconstruction, passive-loop
  currents enter as boundary conditions or are included in the set of free-boundary
  unknowns to improve the accuracy of the reconstructed pressure and current-density
  profiles. See `equilibrium_reconstruction_constraint_weight_of_passive_loop_current`
  for the associated fitting weight and `plasma_current` for the dominant toroidal
  current in the confined region.'
