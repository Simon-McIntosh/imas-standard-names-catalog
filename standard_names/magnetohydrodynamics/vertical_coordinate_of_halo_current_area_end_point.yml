name: vertical_coordinate_of_halo_current_area_end_point
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of the end point of the cross-sectional area
  through which the halo current flows.
documentation: During a disruption, a fraction of the plasma current transfers to
  open field lines forming a halo current that flows poloidally through the scrape-off
  layer and returns through the vacuum vessel structure. The cross-sectional area
  of this halo current channel is bounded by start and end points in the poloidal
  plane. The vertical coordinate $Z$ of the end point, together with the corresponding
  major-radius coordinate, specifies the upper or outer boundary of that halo current
  cross section. Typical values span the range $\pm 2$ m depending on the device geometry
  and the vertical displacement during the disruption. Halo current geometry is reconstructed
  from Rogowski coils, shunt measurements in vessel tiles, and MHD simulations of
  the vertical displacement event (VDE). See also `major_radius_of_halo_current_area_end_point`
  for the corresponding $R$ coordinate.
