- name: parallel_neutral_velocity
  kind: scalar
  status: draft
  description: Projection of the charge-state-averaged neutral particle fluid velocity
    vector onto the direction parallel to the local magnetic field line.
  documentation: 'The parallel neutral velocity $v_{\parallel,n} = \mathbf{v}_n \cdot
    \hat{b}$ quantifies the field-aligned component of the bulk neutral fluid motion,
    where $\hat{b} = \mathbf{B}/|\mathbf{B}|$ is the unit vector along the total magnetic
    field. This component governs the parallel transport of neutral particles and
    momentum, particularly in the edge and divertor regions where charge-exchange
    and ionization processes couple neutral and plasma flows. Typical magnitudes range
    from $10^3$ to $10^5$ m/s depending on the neutral source (gas puffing, recycling,
    or beam injection) and the local plasma collisionality. Measured indirectly through
    spectroscopic Doppler shifts of neutral emission lines (e.g., D$\alpha$ or H$\alpha$)
    or inferred from kinetic neutral transport codes.


    Sign convention: Positive when the neutral velocity component points in the direction
    of increasing poloidal angle along the field line (the field-line direction of
    $\hat{b}$).


    The parallel neutral velocity is a key observable for the plasma edge flow balance
    and is related to the bulk [neutral_velocity](name:neutral_velocity) vector field,
    and to the [parallel_electron_velocity](name:parallel_electron_velocity) and [parallel_neutral_momentum](name:parallel_neutral_momentum)
    quantities for the electron and momentum channels, respectively.'
  unit: m.s^-1
  physics_domain: transport
