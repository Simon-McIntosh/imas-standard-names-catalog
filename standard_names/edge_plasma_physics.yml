- name: electron_temperature_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron thermal temperature evaluated locally at the plasma boundary,
    normally the separatrix where closed magnetic flux surfaces meet the open-field-line
    scrape-off layer. It is a local confined-edge value, not a flux-surface average.
  documentation: 'Electron temperature at the plasma boundary is the scalar electron
    thermal temperature evaluated on the last closed magnetic flux surface, or separatrix
    in a diverted plasma. It denotes a local separatrix value on the confined-plasma
    side; it is not the same as a [flux_surface_averaged_electron_temperature](name:flux_surface_averaged_electron_temperature)
    unless an explicit flux-surface average has been applied.


    For a scalar-temperature description of an isotropic electron distribution, the
    temperature is related to the mean random kinetic energy per electron at the separatrix
    by:


    $$

    \left\langle E_{e,\mathrm{rand}}\right\rangle_{\mathrm{sep}} = \frac{3}{2}\,e\,T_{e,\mathrm{sep}}

    $$


    where $\left\langle E_{e,\mathrm{rand}}\right\rangle_{\mathrm{sep}}$ is in joules,
    $e$ is the elementary charge, and $T_{e,\mathrm{sep}}$ is this temperature in
    eV. The related boundary electron pressure is $p_{e,\mathrm{sep}} = n_{e,\mathrm{sep}}
    e T_{e,\mathrm{sep}}$, where $n_{e,\mathrm{sep}}$ is the [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary)
    in m^-3 and $p_{e,\mathrm{sep}}$ is in pascals.


    The boundary location is identified from the magnetic equilibrium as the separatrix
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. In practice, the value is
    commonly obtained by evaluating an edge electron-temperature fit at the separatrix,
    often constrained by spatially resolved Thomson scattering and, in colder boundary
    plasmas, by probe or spectroscopic measurements. It characterizes the upstream
    edge thermal condition adjacent to the temperature_over_scrape_off_layer, and
    it is generally lower than the [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)
    while being physically distinct from the [electron_temperature_at_divertor_target](name:electron_temperature_at_divertor_target).


    Representative tokamak separatrix electron temperatures are of order 10-300 eV.
    L-mode plasmas are often around 10-100 eV, while H-mode plasmas with strong edge
    pedestals commonly reach tens to a few hundred eV, depending on plasma current,
    heating power, density, and divertor conditions.'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:electron_density_at_plasma_boundary
  - name:electron_temperature_at_pedestal_top
  - name:electron_temperature_at_divertor_target
- name: energy_diffusion_coefficient
  kind: vector
  status: draft
  description: Fick's-law coefficient relating the diffusive thermal energy flux of
    a plasma constituent to its local temperature gradient, serving as the species-agnostic
    parent abstraction over electron, ion, and neutral population specializations.
  documentation: "The energy diffusion coefficient characterizes gradient-driven thermal\
    \ energy transport for any plasma constituent \u2014 electrons, ions, or neutrals\
    \ \u2014 by specifying the proportionality between the diffusive heat flux and\
    \ the local temperature gradient in the Fick's-law sense. It is the thermal-energy\
    \ channel of the general diffusion_coefficient, which governs particle, momentum,\
    \ and energy transport alike, and it is distinct from convective or $E \\times\
    \ B$ contributions to the total heat flux.\n\nThe defining relation for the diffusive\
    \ energy flux $\\mathbf{Q}_\\mathrm{diff}$ of a given constituent is:\n\n$$\n\\\
    mathbf{Q}_\\mathrm{diff} = -D_E \\, \\nabla T\n$$\n\nwhere $D_E$ is the energy\
    \ diffusion coefficient and $\\nabla T$ is the temperature gradient of that constituent.\
    \ In a magnetized plasma $D_E$ is strongly anisotropic; radial cross-field values\
    \ govern energy confinement while values along field lines are orders of magnitude\
    \ larger.\n\nSpecies-resolved children include [electron_energy_diffusion_coefficient](name:electron_energy_diffusion_coefficient)\
    \ for the electron population and [ion_energy_diffusion_coefficient](name:ion_energy_diffusion_coefficient)\
    \ for the total ion population aggregated over all charge states; neutral-particle\
    \ transport is handled by analogous neutral specializations. The effective diffusivity\
    \ that combines diffusive and convective contributions is tracked separately by\
    \ energy_effective_diffusivity."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_energy_diffusion_coefficient
  - name:ion_energy_diffusion_coefficient
  sources:
  - id: derived:energy_diffusion_coefficient
    status: composed
- name: flux_surface_averaged_boron_density
  kind: scalar
  status: draft
  description: Number density of boron ions averaged over the last closed flux surface
    (separatrix) at the plasma boundary, summed over all ionization states and excluding
    neutral boron atoms. It quantifies the boundary boron impurity content as a particle
    density.
  documentation: 'Flux-surface-averaged boron density is the number density of boron
    ions averaged over the last closed flux surface (separatrix) at the plasma boundary.
    The boron population is counted by nuclei in ionic charge states only, so neutral
    boron atoms are excluded. It is the flux-surface-averaged counterpart of [boron_density_at_plasma_boundary](name:boron_density_at_plasma_boundary)
    and can be compared with [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density)
    to characterize the boundary boron fraction.


    In magnetic flux coordinates $(\psi, \theta, \phi)$, where $\psi$ labels nested
    toroidal flux surfaces, $\theta$ is a poloidal angle, and $\phi$ is the toroidal
    angle, the boundary value is the closed-surface limit of the Jacobian-weighted
    flux-surface average:


    $$

    \left\langle n_\mathrm{B} \right\rangle_\mathrm{LCFS} = \lim_{\psi \to \psi_b}
    \frac{\int_0^{2\pi} n_\mathrm{B}(\psi, \theta)\, J(\psi, \theta)\, d\theta}{\int_0^{2\pi}
    J(\psi, \theta)\, d\theta}

    $$


    where $n_\mathrm{B}$ is the local boron ion density in $\mathrm{m}^{-3}$ summed
    over all charge states, $\psi_b$ is the flux value at the last closed flux surface,
    and $J$ (in $\mathrm{m}/\mathrm{T}$ for $(\psi, \theta)$) is the coordinate-space
    Jacobian that supplies the flux-surface-average weighting measure rather than
    a simple arithmetic average over poloidal angle. Near an X point the separatrix
    value is interpreted as a limit from neighboring closed flux surfaces.


    The quantity is inferred from edge impurity emission spectroscopy combined with
    charge-state-resolved collisional-radiative and impurity-transport modeling, mapped
    to the plasma boundary through equilibrium reconstruction. Because each boron
    ion is counted once regardless of charge state, this is a particle density and
    carries no charge-squared weighting; charge-state populations are required separately
    to evaluate charge density, radiated power, or effective-charge contributions.


    Unlike the present quantity, [volume_averaged_boron_density](name:volume_averaged_boron_density)
    averages over the entire confined plasma volume and, depending on definition,
    may include neutral boron. Boundary boron densities depend strongly on wall conditioning,
    boronization, and edge transport, and are typically small relative to the boundary
    total ion density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density_at_plasma_boundary
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  - name:volume_averaged_boron_density
  arguments:
  - name: boron_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_carbon_density
  kind: scalar
  status: draft
  description: Flux-surface average of the total elemental carbon number density on
    a closed magnetic surface. The local carbon density is summed over all charge
    states from neutral carbon to fully stripped carbon before averaging.
  documentation: 'Flux-surface-averaged carbon density is the mean total elemental
    carbon number density on a closed magnetic flux surface. The local carbon density
    is summed over all charge states from neutral carbon through fully stripped carbon
    before averaging, matching the charge-state scope of [volume_averaged_carbon_density](name:volume_averaged_carbon_density)
    and [line_averaged_carbon_density](name:line_averaged_carbon_density) while using
    a magnetic-surface average.


    For an axisymmetric closed surface labeled by the poloidal magnetic flux $\psi$,
    the flux-surface average over the closed poloidal contour is


    $$

    \langle n_C \rangle_\psi = \frac{\oint_\psi n_C(R,Z)\, R\, dl / |\nabla\psi|}{\oint_\psi
    R\, dl / |\nabla\psi|}

    $$


    where $n_C = \sum_{q=0}^{6} n_{\mathrm{C},q}$ is the total carbon density, $n_{\mathrm{C},0}$
    is neutral carbon, and $n_{\mathrm{C},6}$ is fully stripped carbon. The contour
    lies in a poloidal cross-section of the right-handed cylindrical $(R,\phi,Z)$
    frame, with $R$ the major radius, $\phi$ the toroidal angle, and $Z$ the vertical
    height; $dl$ is the arc-length element in meters, $\psi$ is in webers, and $|\nabla\psi|$
    is in Wb m$^{-1}$. The denominator normalizes the geometric weighting so the result
    retains units of m$^{-3}$.


    In practice, local charge-state densities are estimated from impurity spectroscopy,
    charge-exchange recombination measurements when available, collisional-radiative
    modeling, and particle-balance constraints for weakly observed charge states.
    A magnetic equilibrium maps those local estimates to the same closed flux surfaces
    used for [flux_surface_averaged_total_ion_density](name:flux_surface_averaged_total_ion_density),
    and the charge-state sum is formed consistently before applying the average.


    Representative edge-plasma values are commonly $10^{16}-10^{18}\ \mathrm{m}^{-3}$
    in carbon-wall or carbon-seeded conditions, with smaller values possible in low-carbon
    metal-wall plasmas and larger transient values during sputtering or injection
    events. Comparison with [ratio_of_carbon_density_to_electron_density](name:ratio_of_carbon_density_to_electron_density)
    expresses the carbon burden relative to electrons, while [carbon_density_at_magnetic_axis](name:carbon_density_at_magnetic_axis)
    gives the corresponding central local value. The analogous [flux_surface_averaged_iron_density](name:flux_surface_averaged_iron_density)
    applies the same magnetic-surface average to iron.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_iron_density
  - name:ratio_of_carbon_density_to_electron_density
  arguments:
  - name: carbon_density
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: flux_surface_averaged_electron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Electron number density averaged over the last closed flux surface
    at the plasma boundary. It represents the separatrix density as the limiting flux-surface
    average from the confined plasma side.
  documentation: 'Flux-surface-averaged electron density at the plasma boundary is
    the electron number density averaged over the separatrix, or last closed flux
    surface. Because the separatrix is the boundary between closed magnetic surfaces
    and open scrape-off-layer field lines, the quantity is interpreted as the limit
    of the closed-surface average taken from inside the confined plasma.


    The separatrix value is defined from the flux-surface average of the electron
    density as the closed magnetic surface approaches the separatrix:


    $$

    \langle n_e \rangle_{\mathrm{sep}} = \lim_{\psi \to \psi_{\mathrm{sep}}^-} \frac{\oint_{\psi=\mathrm{const}}
    n_e \, dS / |\nabla\psi|}{\oint_{\psi=\mathrm{const}} dS / |\nabla\psi|}

    $$


    where $n_e$ is the local electron number density in m^-3, $\psi$ is a poloidal
    magnetic flux label, $\psi_{\mathrm{sep}}$ is its value at the separatrix, $dS$
    is the surface-area element on a closed magnetic surface, and $|\nabla\psi|$ accounts
    for the differential volume between neighboring flux surfaces. The weighting is
    therefore a volume-shell weighting of the flux-surface average, not a measure
    of field-line spacing.


    In practice this quantity is inferred by combining edge density measurements,
    such as Thomson scattering, interferometry, reflectometry, or Langmuir-probe information,
    with an equilibrium reconstruction that identifies the last closed flux surface.
    Because diagnostics rarely sample the mathematical separatrix exactly, the value
    is usually obtained by fitting or mapping measurements to flux coordinates and
    extrapolating or interpolating to the separatrix from the confined-plasma side.


    Typical values in tokamak plasmas are about $0.1-5 \times 10^{19}$ m^-3, with
    lower values in low-density limiter-like or detached-edge conditions and higher
    values in high-density H-mode or reactor-relevant edge plasmas. The value depends
    strongly on fueling, recycling, pedestal conditions, and divertor or scrape-off-layer
    transport.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_electron_temperature
  - name:electron_pressure_at_plasma_boundary
  - name:flux_surface_averaged_total_ion_density
  - name:electron_density_at_plasma_boundary
  arguments:
  - name: electron_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
- name: gradient_of_radial_electron_density
  kind: scalar
  status: draft
  description: Core-side derivative of electron number density with respect to normalized
    poloidal flux at the H-mode pedestal, representing the density slope just inside
    the steep pedestal region.
  documentation: 'The gradient of radial electron density is the derivative of electron
    number density with respect to the normalized poloidal flux coordinate $\psi_N$,
    evaluated on the core-side branch of an H-mode pedestal density fit. It characterizes
    the gentler radial variation just inside the steep pedestal layer and is distinct
    from the maximum pedestal density gradient gradient_of_electron_density.


    The core-side pedestal slope is defined by evaluating the derivative of the fitted
    electron density $n_e$ at the core-side pedestal location $\psi_{N,\mathrm{core}}$:


    $$

    G_{n_e,\mathrm{core}} = \left.\frac{d n_e}{d\psi_N}\right|_{\psi_N = \psi_{N,\mathrm{core}}}

    $$


    where $G_{n_e,\mathrm{core}}$ is this quantity, $n_e$ is electron number density,
    and $\psi_N$ is the normalized poloidal flux coordinate. Because $\psi_N$ is dimensionless,
    the derivative has the same unit as electron number density.


    In practice, this quantity is obtained by fitting edge electron density measurements
    with a pedestal representation and taking the derivative of that fitted function
    on the core side of the pedestal. The value should not be interpreted as the steepest
    pedestal slope; that maximum-gradient quantity is usually larger in magnitude
    and located within the narrow pedestal transition region.


    Typical H-mode core-side values are often negative, with magnitudes about $10^{18}$-$10^{20}$
    m^-3 for weakly varying or moderately sloped density, and occasionally approaching
    $10^{21}$ m^-3 in strongly shaped or high-density pedestals. Values near zero
    indicate an almost flat core-side density variation over the fitted interval.


    Sign convention: Positive when electron number density increases with increasing
    normalized poloidal flux coordinate $\psi_N$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
- name: heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of the heat flux profile in the scrape-off
    layer, without specifying the electron or ion heat channel.
  documentation: "The heat decay length in the scrape-off layer (SOL) is the radial\
    \ distance over which the heat flux profile falls to $1/e$ of its value at the\
    \ separatrix, characterizing the spatial scale of heat exhaust across the open-field-line\
    \ region. This parent quantity leaves the contributing heat channel unspecified,\
    \ generalizing over both the electron and ion contributions captured by its species-resolved\
    \ children.\n\nThe decay length is formally defined as the inverse of the magnitude\
    \ of the logarithmic radial gradient of the heat flux $q$:\n\n$$\n\\lambda_q =\
    \ \\left| \\frac{\\partial \\ln q}{\\partial r} \\right|^{-1}\n$$\n\nwhere $r$\
    \ is the radial coordinate measured outward from the separatrix into the SOL.\
    \ The species-specific children [electron_heat_decay_length_over_scrape_off_layer](name:electron_heat_decay_length_over_scrape_off_layer)\
    \ and [ion_heat_decay_length_over_scrape_off_layer](name:ion_heat_decay_length_over_scrape_off_layer)\
    \ resolve this quantity into the electron and ion heat channels, respectively;\
    \ users requiring species resolution should reference those names directly.\n\n\
    The heat decay length is inferred from infrared thermography of the divertor target,\
    \ which images the radial heat load footprint, or from radially distributed Langmuir\
    \ probe arrays in the SOL. Typical midplane-mapped values in H-mode tokamak plasmas\
    \ span 1\u201310 mm.\n\nSign convention: Positive when the heat flux decreases\
    \ with increasing radial distance outward from the separatrix toward the first\
    \ wall."
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: heat
    operator_kind: qualifier
- name: electron_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: draft
  description: Radial e-folding decay length of electron heat flux in the scrape-off
    layer, equal to the inverse magnitude of its logarithmic radial gradient.
  documentation: 'The electron heat decay length over the scrape-off layer is the
    radial e-folding distance over which the electron heat flux decreases outside
    the last closed flux surface. It quantifies how narrowly the electron heat channel
    is localized in the scrape-off layer; smaller values correspond to a steeper radial
    falloff.


    For a local outward radial coordinate $r$, the decay length is defined from the
    logarithmic radial gradient of the electron heat flux:


    $$

    \lambda_{q_e} = \left|\frac{q_e}{d q_e / dr}\right| = \left|\frac{d \ln q_e}{dr}\right|^{-1}

    $$


    where $q_e(r)$ is the electron heat flux density in W m$^{-2}$, $r$ is the outward
    radial distance in m, and $\lambda_{q_e}$ is in m. The absolute value makes the
    decay length non-negative; for an outwardly decreasing heat flux, $d q_e / dr
    < 0$.


    In practice, $\lambda_{q_e}$ is obtained by fitting an exponential falloff of
    the electron heat flux as a function of a consistently defined radial coordinate,
    or by evaluating the local logarithmic gradient from measurements or edge-plasma
    transport calculations. If distances are mapped between locations, such as from
    a target surface to an outer-midplane radial coordinate, the geometric mapping
    should be treated consistently with the heat-flux definition.


    Typical values in tokamak scrape-off layers are of order millimeters to centimeters,
    approximately 0.001-0.05 m, with the value depending on confinement regime, collisionality,
    connection length, and magnetic geometry.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  - name:thermal_electron_decay_length_over_scrape_off_layer
  - name:electron_decay_length_over_scrape_off_layer
  arguments:
  - name: heat_decay_length_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
- name: helium_3_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of helium-3 ions at the H-mode pedestal top, where the
    steep edge transport barrier joins the flatter confined-plasma density region.
  documentation: 'Helium-3 density at the pedestal is the local number density of
    ions of the stable mass-3 helium isotope evaluated at the pedestal top. The pedestal
    top is the inner edge of the steep-gradient edge transport barrier, so this quantity
    characterizes the helium-3 content entering the confined plasma from the edge
    region.


    The local pedestal value may be defined by the particle-number density of helium-3
    ions in a small volume centered on the pedestal-top location:


    $$

    n_{^3\mathrm{He},\mathrm{ped}} = \left.\frac{dN_{^3\mathrm{He}}}{dV}\right|_{\mathrm{ped}}

    $$


    where $N_{^3\mathrm{He}}$ is the number of helium-3 ions in volume $V$, and the
    subscript $\mathrm{ped}$ denotes evaluation at the pedestal top.


    In practice it is obtained from an edge or pedestal density reconstruction combined
    with an estimate of the helium-3 isotope fraction. That fraction may come from
    fuel accounting, isotope-sensitive spectroscopy or neutral analysis where available,
    and transport or particle-balance modeling; the result is usually interpreted
    together with quasineutrality and the densities of the main ion species.


    Typical values are highly scenario dependent. In plasmas without intentional helium-3
    fueling, the pedestal helium-3 density is usually a trace component, often below
    routine quantification or below about $10^{16}$-$10^{18}$ m^-3. In helium-3 minority
    or fueled scenarios, a pedestal isotope fraction of about 0.1-10% of an ion pedestal
    density near $10^{19}$-$10^{20}$ m^-3 corresponds to roughly $10^{16}$-$10^{19}$
    m^-3.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal
  - name:helium_3_density_at_internal_transport_barrier
  - name:helium_3_density_at_plasma_boundary
  - name:helium_3_density_at_divertor_target
  arguments:
  - name: density_at_pedestal
    operator: helium_3
    operator_kind: qualifier
- name: helium_3_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of helium-3 ions (the stable helium isotope with mass
    number 3) evaluated at the plasma boundary, the last closed flux surface separating
    the magnetically confined plasma from the scrape-off layer.
  documentation: "Helium-3 ($^3$He) is the stable helium isotope with two protons\
    \ and one neutron (mass number 3, charge number 2). This quantity gives the number\
    \ of $^3$He ions per unit volume evaluated at the plasma boundary, defined as\
    \ the last closed flux surface (separatrix) that divides the closed-field-line\
    \ confined region from the open-field-line scrape-off layer. It is the helium-3\
    \ specialization of [density_at_plasma_boundary](name:density_at_plasma_boundary).\n\
    \nHelium-3 enters tokamak plasmas either as a minority heating species in ion\
    \ cyclotron resonance heating schemes, where a small $^3$He fraction resonates\
    \ efficiently with the ICRH wave, or as a fuel ion in D-$^3$He burn scenarios.\
    \ In both cases, the boundary density is a key parameter for edge particle balance\
    \ and fuel-purity assessment. Boundary values are inferred from charge-exchange\
    \ recombination spectroscopy using $^3$He spectral lines or from edge transport\
    \ modeling constrained by particle flux boundary conditions.\n\nTypical $^3$He\
    \ boundary densities in minority-heating scenarios lie in the range $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$, well below the separatrix electron density of $10^{19}$\u2013\
    $10^{20}$ m$^{-3}$. The corresponding core value is captured by [helium_3_density_at_magnetic_axis](name:helium_3_density_at_magnetic_axis),\
    \ the pedestal-top value by [helium_3_density_at_pedestal](name:helium_3_density_at_pedestal),\
    \ and the downstream target value by [helium_3_density_at_divertor_target](name:helium_3_density_at_divertor_target),\
    \ together forming a complete radial survey of $^3$He ion density from core to\
    \ divertor."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:helium_3_density_at_magnetic_axis
  - name:helium_3_density_at_pedestal
  - name:helium_3_density_at_divertor_target
