- name: per_toroidal_mode_of_fast_electron_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Absorbed wave power per unit volume deposited on the fast (suprathermal)
    electron population from a coherent wave, resolved by toroidal mode number n at
    each spatial location in the poloidal cross-section. Summing over all mode numbers
    n recovers the total fast-electron absorbed power density at that location.
  documentation: "## per_toroidal_mode_of_fast_electron_wave_absorbed_power_density\n\
    \nThis quantity gives the local volumetric power deposition on the fast (suprathermal)\
    \ electron population attributable to a single toroidal mode number $n$ of a coherent\
    \ wave. It is defined such that\n\n$$p_\\mathrm{fast}(R, Z) = \\sum_{n} p_\\mathrm{fast,n}(R,\
    \ Z),$$\n\nwhere $p_\\mathrm{fast}(R, Z)$ is the total fast-electron absorbed\
    \ power density at position $(R, Z)$ in the poloidal plane (with $R$ the major\
    \ radius and $Z$ the vertical height in the right-handed cylindrical $(R, \\phi,\
    \ Z)$ frame), and $p_\\mathrm{fast,n}(R, Z)$ is the mode-resolved density documented\
    \ here. The notation \"per toroidal mode\" refers to a discrete decomposition:\
    \ each mode index $n$ is an integer, and the quantity is not a spectral density\
    \ in the calculus sense \u2014 no $dn$ factor is implied.\n\n**Unit:** $\\mathrm{W\\\
    ,m^{-3}}$\n\n**Toroidal mode index convention:** The integer $n$ is the toroidal\
    \ mode number entering the eikonal phase $\\exp(i n \\phi)$, where $\\phi$ is\
    \ the toroidal angle increasing counter-clockwise when viewed from above $(+\\\
    hat{Z})$. Positive $n$ corresponds to a wave propagating in the direction of increasing\
    \ $\\phi$; negative $n$ indicates propagation in the opposite (clockwise from\
    \ above) direction.\n\n**Admissible index set:** In practice, launched wave beams\
    \ in ion-cyclotron, lower-hybrid, and electron-cyclotron heating scenarios typically\
    \ involve a finite set of dominant mode numbers. The index set depends on the\
    \ antenna geometry and the modeling approach; codes may retain a single dominant\
    \ $n$ or a full spectrum.\n\n**Typical values:** For high-power auxiliary heating\
    \ ($\\sim$MW class), peak densities in the absorption region are of order $10^5$\u2013\
    $10^7\\,\\mathrm{W\\,m^{-3}}$, but values vary strongly with plasma geometry and\
    \ wave frequency. Regions outside the absorption layer carry negligible deposition.\n\
    \n**Relation to companion quantities:** Flux-surface averaging $p_\\mathrm{fast,n}(R,\
    \ Z)$ over a flux surface labeled by a normalized radial coordinate yields the\
    \ flux-surface-averaged mode-resolved density. Volume integration of $p_\\mathrm{fast,n}$\
    \ over the region enclosed by a given flux surface gives the enclosed absorbed\
    \ power per mode (cf. `per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface`).\
    \ Summing or integrating over all $n$ and over the full plasma volume recovers\
    \ the total absorbed power on fast electrons (cf. `per_toroidal_mode_of_fast_electron_wave_absorbed_power`)."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power
  - name:per_toroidal_mode_of_fast_ion_wave_absorbed_power_density
  - name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power_density
  - name:per_toroidal_mode_of_fast_electron_wave_absorbed_power_inside_flux_surface
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_density_fast_n_phi
