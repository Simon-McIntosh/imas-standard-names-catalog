name: parallel_component_of_current_density_due_to_non_inductive_current_drive
description: Flux-surface-averaged current density projected along the magnetic field
  direction, driven by non-inductive sources such as neutral beams, RF waves, and
  the bootstrap effect.
documentation: This quantity is defined as $\langle j_{\parallel}^{\mathrm{NI}} \rangle
  = \langle \mathbf{j}_{\mathrm{NI}} \cdot \mathbf{B} \rangle / B_0$, where $\mathbf{j}_{\mathrm{NI}}$
  is the non-inductive current density, $\mathbf{B}$ is the local magnetic field,
  $\langle \cdot \rangle$ denotes a flux-surface average, and $B_0$ is the vacuum
  toroidal magnetic field on the magnetic axis (in T). Non-inductive contributions
  include neutral beam current drive (NBCD), electron cyclotron current drive (ECCD),
  lower hybrid current drive (LHCD), and the neoclassical bootstrap current. In steady-state
  tokamak scenarios, full non-inductive operation requires $\langle j_{\parallel}^{\mathrm{NI}}
  \rangle$ to sustain the entire plasma current, with typical local values ranging
  from $10^4$ to $10^6\;\mathrm{A\,m^{-2}}$. Positive $\langle j_{\parallel}^{\mathrm{NI}}
  \rangle$ corresponds to current flowing in the direction of $\mathbf{B}$ (co-current
  under the chosen COCOS convention). This profile is a key input for transport solvers
  and equilibrium reconstructions targeting advanced scenarios. See also `plasma_current`
  for the total integrated current and `safety_factor` for the resulting field-line
  helicity.
kind: vector_component
unit: A.m^-2
status: draft
