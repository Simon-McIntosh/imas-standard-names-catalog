- name: reflected_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: RF power returning from a lower hybrid antenna back toward the transmission
    line, representing the portion of forward power not coupled into the plasma.
  documentation: "Reflected power from a lower hybrid antenna is the component of\
    \ incident RF power that fails to couple into the plasma and propagates back toward\
    \ the transmission line source. Poor coupling arises from unfavorable edge plasma\
    \ density gradients, suboptimal launcher\u2013plasma distance, or antenna phasing\
    \ conditions that mismatch the slow-wave accessibility window of the lower hybrid\
    \ wave.\n\nThe power reflection coefficient $|\\Gamma|^2$ relates reflected power\
    \ $P_\\text{ref}$ to forward power $P_\\text{fwd}$:\n\n$$\n|\\Gamma|^2 = \\frac{P_\\\
    text{ref}}{P_\\text{fwd}}\n$$\n\nwhere $P_\\text{fwd}$ is the total power delivered\
    \ to the antenna from the transmission line. The [launched power](name:launched_power_of_lower_hybrid_antenna)\
    \ into the vacuum vessel is the difference $P_\\text{fwd} - P_\\text{ref}$, and\
    \ the [total absorbed power](name:total_absorbed_power_of_lower_hybrid_antenna)\
    \ accounts for remaining waveguide and plasma losses. The gross RF input to the\
    \ antenna system is captured by the parent quantity `power_of_lower_hybrid_antenna`.\n\
    \nReflected power is monitored in real time using directional couplers embedded\
    \ in the transmission line feeding the lower hybrid launcher. In well-coupled\
    \ regimes, $P_\\text{ref}/P_\\text{fwd}$ is typically below 5\u201310%; transients\
    \ such as L\u2013H mode transitions or edge density fluctuations can briefly increase\
    \ the reflected fraction to 30\u201350%, triggering protection interlocks. The\
    \ analogous quantity for ion cyclotron systems is [reflected power of an IC antenna](name:reflected_power_of_ion_cyclotron_heating_antenna)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:launched_power_of_lower_hybrid_antenna
  - name:total_absorbed_power_of_lower_hybrid_antenna
  - name:reflected_power_of_ion_cyclotron_heating_antenna
  sources:
  - id: dd:lh_antennas/antenna/power_reflected
    dd_path: lh_antennas/antenna/power_reflected
    status: composed
- name: thermal_electron_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the bulk thermal electron population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal electron power at an inside flux surface quantifies the
    total rate at which coherent wave energy is absorbed by the bulk (Maxwellian)
    thermal electron population within the plasma volume bounded by a given flux surface.
    It represents the radially cumulative wave deposition profile for the thermal
    electron channel, complementing the fast-electron contribution [fast_electron_power_at_inside_flux_surface](name:fast_electron_power_at_inside_flux_surface)
    to form the total [electron_power_at_inside_flux_surface](name:electron_power_at_inside_flux_surface).


    The quantity is obtained by integrating the flux-surface-averaged [thermal_electron_power_density](name:thermal_electron_power_density)
    $p_{\mathrm{th,e}}$ over the enclosed plasma volume:


    $$

    P_{\mathrm{th,e}}(\rho) = \int_0^\rho p_{\mathrm{th,e}}(\rho'') \frac{dV}{d\rho''}
    \, d\rho''

    $$


    where $\rho$ labels the flux surface and $dV/d\rho''$ is the differential volume
    element per unit radial coordinate.


    This profile is computed by RF wave propagation and absorption solvers; the value
    at the outermost closed flux surface gives the total wave power absorbed by thermal
    electrons. The analogous quantity for thermal ions is [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface),
    and the charge-state-resolved thermal ion analog is [thermal_ion_state_power_at_inside_flux_surface](name:thermal_ion_state_power_at_inside_flux_surface).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_at_inside_flux_surface
  - name:electron_power_at_inside_flux_surface
  - name:thermal_electron_power_density
  - name:thermal_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  arguments:
  - name: electron_power_at_inside_flux_surface
    operator: thermal
    operator_kind: qualifier
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    status: composed
- name: thermal_ion_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative wave power absorbed by the thermal ion population within
    the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Thermal ion power at an inside flux surface is the cumulative rate
    at which wave energy is deposited in the bulk ion population inside the volume
    enclosed by that magnetic flux surface. It represents thermal-ion heating integrated
    from the magnetic axis to the chosen surface and excludes direct deposition to
    electrons and fast ions.


    The cumulative power for a flux surface labeled by the dimensionless radial coordinate
    $\rho$ in a flux coordinate system $(\rho,\theta,\phi)$ is defined from the local
    thermal-ion wave-power density:


    $$

    P_{\mathrm{th\,ion}}(\rho) = \int_{V(\rho)} p_{\mathrm{th\,ion}} \, dV''

    $$


    where $V(\rho)$ is the plasma volume enclosed by the flux surface, $p_{\mathrm{th\,ion}}$
    is the local net wave-power density for thermal ions in W m^-3, $dV''$ is a volume
    element in m^3, and $P_{\mathrm{th\,ion}}$ is the cumulative power.


    In practice this quantity is computed by integrating wave-power deposition densities
    from wave propagation and wave-particle absorption modeling over the reconstructed
    plasma volume. Experimental constraints include injected wave power, coupling
    losses, ion temperature evolution, species composition, and other heating and
    transport terms needed to separate thermal-ion absorption from electron or fast-ion
    channels.


    Typical values are near 0 W at the magnetic axis and increase toward the total
    thermal-ion absorbed wave power at the plasma boundary. Medium-size tokamak discharges
    commonly have 10^4-10^6 W, while high-power wave-heating scenarios in large devices
    can reach 10^6-2 x 10^7 W within the outer flux surfaces.


    Sign convention: Positive when wave energy is transferred to the thermal ion population.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  - name:thermal_ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_power
  - name:thermal_electron_power_at_inside_flux_surface
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_thermal
    status: composed
- name: thermal_ion_state_power_at_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative radio-frequency wave power absorbed by a specified thermal
    ion charge state inside the plasma volume enclosed by a selected magnetic flux
    surface. It is the volume integral of the charge-state-resolved absorbed power
    density.
  documentation: 'Thermal ion state power at an inside flux surface is the cumulative
    radio-frequency wave power transferred to one specified thermal ion species and
    charge state within the volume bounded by that magnetic flux surface. It is the
    charge-state-resolved contribution to cumulative thermal-ion RF absorption.


    The cumulative absorbed power for charge state $z$ of ion species $s$ inside the
    flux surface labeled by $\rho$ is defined by the volume integral of the local
    absorbed power density:


    $$

    P_{\mathrm{th},s,z}(\rho) = \int_{V(\rho)} p_{\mathrm{th},s,z}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{th},s,z}$ is in W, $p_{\mathrm{th},s,z}$ is the local RF power
    density transferred to that thermal ion charge state in W m$^{-3}$, $dV$ is the
    differential volume element in m$^3$, and $V(\rho)$ is the plasma volume enclosed
    by the magnetic flux surface labeled by the dimensionless normalized flux-surface
    coordinate $\rho$.


    In practice this quantity is computed from wave propagation and wave-particle
    interaction models by integrating the charge-state-resolved absorption over nested
    equilibrium volumes. Summing over all relevant charge states and all thermal ion
    species gives the total cumulative RF power absorbed by thermal ions inside the
    same flux surface; summing over charge states for only one species gives the species-resolved
    contribution.


    Typical values for an individual thermal ion charge state range from near 0 W
    for weakly absorbing states to 10^5-10^7 W when the state is a dominant RF absorber.
    The value depends on coupled RF power, resonance location, ion composition, charge-state
    population, temperature, density, and the chosen flux surface.


    Sign convention: Positive when net RF energy is transferred from the wave field
    to the specified thermal ion charge state.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_state_power_at_inside_flux_surface
  - name:ion_state_power_at_inside_flux_surface
  - name:per_toroidal_mode_thermal_ion_state_power_density
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/ion/state/power_inside_thermal
    status: composed
- name: toroidal_angle_of_electron_cyclotron_beam
  kind: scalar
  status: draft
  description: Toroidal steering angle of an electron cyclotron beam, defined by the
    arc sine of the toroidal wave-vector component divided by the total wave-vector
    magnitude. It specifies the signed toroidal part of propagation in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The toroidal angle of an electron cyclotron beam is the signed steering
    angle associated with the toroidal component of the beam''s local mean wave vector.
    It measures how much of the propagation direction is along $\hat{\phi}$ rather
    than within the plane spanned by $R$ and $Z$ in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    The angle is defined from the projection of the wave vector onto the toroidal
    basis direction:


    $$

    \alpha_\phi = \sin^{-1}\!\left(\frac{k_\phi}{|\mathbf{k}|}\right)

    $$


    where $\alpha_\phi$ is the toroidal beam angle, $k_\phi$ is the component of the
    mean wave vector along $\hat{\phi}$, and $|\mathbf{k}|$ is the total wave-vector
    magnitude. Both $k_\phi$ and $|\mathbf{k}|$ have units of rad m$^{-1}$, equivalently
    m$^{-1}$ when radians are treated as dimensionless, so the ratio is dimensionless
    and $\alpha_\phi$ is in rad.


    In practice, this angle is determined from EC launcher geometry, calibrated steering-mirror
    orientation, or ray and beam-tracing calculations by decomposing the mean wave
    vector in the right-handed cylindrical $(R,\phi,Z)$ frame. Together with [poloidal_angle_of_electron_cyclotron_beam](name:poloidal_angle_of_electron_cyclotron_beam),
    launch position, frequency, and magnetic geometry, it contributes to the parallel
    refractive index through the local projection $N_\parallel = c\,\mathbf{k}\cdot\hat{\mathbf{b}}/\omega$,
    where $\hat{\mathbf{b}}$ is the unit vector along the magnetic field, $\omega$
    is the wave angular frequency, and $c$ is the speed of light. The toroidal angle
    controls the $k_\phi$ part of that projection but does not by itself determine
    $N_\parallel$ because the magnetic-field pitch and the poloidal propagation component
    also enter; it is complementary to EC beam power, which specifies wave energy
    flow rather than propagation direction.


    Typical values are launcher dependent. The principal-value definition gives a
    mathematical interval from $-\pi/2$ to $+\pi/2$ rad; EC heating launch is often
    near zero toroidal angle, while current-drive-oriented launch commonly uses nonzero
    angles of order a few tenths of a rad. Hardware steering limits and access constraints
    determine the available range for a given device.


    Sign convention: Positive when the toroidal component of the beam wave vector
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: rad
  physics_domain: auxiliary_heating
  links:
  - name:poloidal_angle_of_electron_cyclotron_beam
  sources:
  - id: dd:ec_launchers/beam/steering_angle_tor
    dd_path: ec_launchers/beam/steering_angle_tor
    status: composed
  - id: dd:summary/heating_current_drive/ec/angle_tor/value
    dd_path: summary/heating_current_drive/ec/angle_tor/value
    status: attached
- name: total_absorbed_power_of_lower_hybrid_antenna
  kind: scalar
  status: draft
  description: Net RF power deposited into the plasma by the lower hybrid antenna
    system, aggregated over all individual antennas.
  documentation: 'The total absorbed power of the lower hybrid antenna system quantifies
    the net RF energy deposition rate from the LHCD launcher array into the confined
    plasma, summed over all individual antennas. It is the primary power accounting
    metric for lower hybrid current drive and supplemental electron heating, governing
    the wave energy available for driving non-inductive plasma current.


    The absorbed power is defined as the volume integral of the local LH wave power
    deposition density over the plasma volume:


    $$

    P_\text{abs} = \int_V q_\text{LH}(\mathbf{r}) \, dV

    $$


    where $q_\text{LH}(\mathbf{r})$ is the volumetric LH wave absorption density at
    position $\mathbf{r}$ within the plasma volume $V$.


    This quantity is distinct from the [total launched power](name:total_launched_power_of_lower_hybrid_antenna),
    which represents power entering the vacuum vessel and can exceed the absorbed
    power by any residual absorption in the edge region or scrape-off layer that does
    not reach the confined plasma. In practice, the absorbed power is estimated from
    directional-coupler measurements of the [forward power](name:forward_power_of_lower_hybrid_antenna)
    and [reflected power](name:reflected_power_of_lower_hybrid_antenna) on the high-power
    RF transmission lines, corrected for resistive dissipation in the launcher structure
    and waveguide network.


    In current LHCD systems on medium-to-large tokamaks, total absorbed power levels
    range from 1-10 MW.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_launched_power_of_lower_hybrid_antenna
  - name:forward_power_of_lower_hybrid_antenna
  - name:reflected_power_of_lower_hybrid_antenna
  sources:
  - id: dd:lh_antennas/power
    dd_path: lh_antennas/power
    status: composed
- name: total_external_heating_power
  kind: scalar
  status: draft
  description: Total non-inductive auxiliary heating power absorbed or deposited in
    the plasma, combining neutral beam, electron cyclotron, ion cyclotron, lower hybrid,
    and similar systems. It excludes ohmic inductive heating and source power not
    coupled to the plasma.
  documentation: 'Total external heating power is the aggregate non-inductive auxiliary
    power absorbed or deposited in the plasma. It includes coupled contributions from
    neutral beam injection and radiofrequency heating systems such as electron cyclotron,
    ion cyclotron, and lower hybrid heating, and excludes ohmic inductive heating.
    As a sum of absorbed heating powers, it is non-negative; 0 W indicates that no
    external auxiliary heating power is coupled to the plasma.


    The aggregate power is commonly defined as the sum of the plasma-coupled absorbed
    powers from the active auxiliary systems:


    $$

    P_\mathrm{ext} = P_\mathrm{NBI,abs} + P_\mathrm{EC} + P_\mathrm{IC} + P_\mathrm{LH}
    + \cdots

    $$


    where $P_\mathrm{NBI,abs}$ is the absorbed neutral-beam power, and $P_\mathrm{EC}$,
    $P_\mathrm{IC}$, and $P_\mathrm{LH}$ are the plasma-coupled electron-cyclotron,
    ion-cyclotron, and lower-hybrid powers, respectively.


    In practice, each contribution is evaluated with source-specific accounting. Neutral-beam
    absorbed power is inferred from beam energy and current together with corrections
    for shine-through, reionization, prompt losses, and fast-ion deposition. Radiofrequency
    contributions are inferred from launched power corrected for transmission-line,
    matching, reflection, and coupling losses, together with absorption estimates
    from diagnostics or wave-deposition modeling. The total should include only power
    coupled to the plasma, not source inefficiency, unabsorbed radiation, or power
    lost before reaching the plasma.


    Typical values range from 0 W when auxiliary systems are inactive to about $10^5$-$10^7$
    W in small and medium experiments, with large high-power scenarios reaching $10^7$-$10^8$
    W depending on the active heating mix and plasma conditions.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:total_plasma_heating_power
  - name:total_plasma_radiated_power
  sources:
  - id: dd:summary/heating_current_drive/power_additional/value
    dd_path: summary/heating_current_drive/power_additional/value
    status: composed
- name: total_power_due_to_electron_cyclotron_heating
  kind: scalar
  status: draft
  description: Total radiofrequency power absorbed in the plasma by electron cyclotron
    heating, summed over all electron cyclotron wave sources. It represents deposited
    heating power, not launched, transmitted, or reflected power, and is zero or positive.
  documentation: 'Total power due to electron cyclotron heating is the aggregate rate
    at which electron cyclotron waves transfer electromagnetic energy to the plasma
    through resonant interaction with electrons at the cyclotron frequency or its
    harmonics. It is an absorbed heating power: it counts only the power that is actually
    deposited in the plasma, excluding power that remains in transmission paths, is
    reflected, or shines through without absorption.


    The total absorbed electron cyclotron heating power is the sum of the absorbed
    powers from the individual electron cyclotron wave sources:


    $$

    P_\mathrm{EC} = \sum_{i=1}^{N_\mathrm{EC}} P_{\mathrm{EC},i}

    $$


    where $N_\mathrm{EC}$ is the number of contributing electron cyclotron wave sources,
    $P_{\mathrm{EC},i}$ (in W) is the heating power absorbed in the plasma from source
    $i$, and $P_\mathrm{EC}$ (in W) is the total deposited power. The per-source contribution
    is reported by [power_due_to_electron_cyclotron_heating](name:power_due_to_electron_cyclotron_heating).


    In practice this quantity is obtained from power-balance and wave-deposition analysis
    that combines the launched radiofrequency power with absorption estimates from
    ray-tracing or beam-tracing calculations, accounting for single-pass absorption
    efficiency and shine-through losses. It enters the electron energy balance as
    a heating source term and is therefore closely related to [total_electron_power](name:total_electron_power).


    Representative integrated values range from a few hundred kilowatts to several
    megawatts in present-day auxiliary-heated experiments, and reach tens of megawatts
    in high-power systems, with the exact value depending on source power, coupling
    efficiency, plasma density and temperature, magnetic field, and the absorption
    location. The value is zero when no electron cyclotron heating is applied.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_due_to_electron_cyclotron_heating
  - name:total_power_of_electron_cyclotron_launcher
  - name:current_due_to_electron_cyclotron_current_drive
  - name:total_power_due_to_ion_cyclotron_heating
  arguments:
  - name: power_due_to_electron_cyclotron_heating
    operator: total
    operator_kind: qualifier
  sources:
  - id: dd:summary/heating_current_drive/power_ec/value
    dd_path: summary/heating_current_drive/power_ec/value
