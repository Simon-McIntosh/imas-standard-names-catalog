- name: instrument_function_central_wavelength
  kind: scalar
  status: draft
  description: Peak wavelength of the spectral response kernel (instrument function)
    of an X-ray crystal spectrometer channel, defined as the wavelength at which the
    kernel attains its maximum value, expressed in absolute wavelength units (meters).
  documentation: 'The instrument function $f(\lambda)$ of an X-ray crystal spectrometer
    channel describes how the spectrometer broadens and redistributes spectral radiance
    as a function of wavelength. The central wavelength $\lambda_0$ is the peak of
    this response kernel, i.e., the wavelength satisfying


    $$\frac{d f}{d \lambda}\bigg|_{\lambda = \lambda_0} = 0, \quad f(\lambda_0) =
    \max_\lambda f(\lambda).$$


    This quantity locates the center of the line-spread profile in absolute wavelength
    space and sets the reference point for computing spectral shifts and widths. In
    practice $\lambda_0$ corresponds to the Bragg-reflected wavelength of the crystal
    at the nominal alignment angle, and for typical X-ray crystal spectrometers it
    falls in the range $0.1\,\text{nm}$ to $1\,\text{nm}$ ($10^{-10}$ to $10^{-9}$
    m), covering emission lines from highly ionized mid-Z to high-Z impurity species
    such as helium-like argon ($\approx 0.395\,\text{nm}$) or hydrogen-like iron ($\approx
    0.178\,\text{nm}$).


    Knowing $\lambda_0$ is essential for interpreting Doppler shifts (which yield
    ion flow velocities) and Doppler broadening (which yields ion temperatures), as
    well as for correcting instrumental contributions to observed line widths. The
    central wavelength is independent of the plasma emission intensity and is determined
    solely by the crystal and detector geometry at the time of calibration.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_line_central_wavelength
  - name:photon_wavelength_of_crystal_spectrometer_pixel
  - name:optical_filter_central_wavelength
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/bin/instrument_function/centre
    dd_path: spectrometer_x_ray_crystal/channel/bin/instrument_function/centre
    status: composed
  - id: dd:spectrometer_x_ray_crystal/channel/instrument_function/centre
    dd_path: spectrometer_x_ray_crystal/channel/instrument_function/centre
    status: composed
- name: instrument_function_gaussian_width
  kind: scalar
  status: draft
  description: Standard deviation (sigma) of the Gaussian instrument function of an
    X-ray crystal spectrometer, quantifying spectral broadening due to the optical
    response of the instrument.
  documentation: "The instrument function describes the spectral response kernel of\
    \ a spectrometer channel \u2014 the output line shape produced by a monochromatic\
    \ input. When approximated as a Gaussian, its width is fully characterized by\
    \ the standard deviation $\\sigma$, so that the kernel takes the form $K(\\lambda)\
    \ = (\\sigma\\sqrt{2\\pi})^{-1}\\exp[-(\\lambda - \\lambda_0)^2 / (2\\sigma^2)]$,\
    \ where $\\lambda_0$ is the central wavelength (see [instrument_function_central_wavelength](name:instrument_function_central_wavelength))\
    \ and $\\lambda$ is wavelength. The full width at half maximum relates to $\\\
    sigma$ as $\\text{FWHM} = 2\\sqrt{2\\ln 2}\\,\\sigma \\approx 2.355\\,\\sigma$.\
    \ For X-ray crystal spectrometers used in fusion diagnostics, $\\sigma$ is typically\
    \ in the range $10^{-13}$\u2013$10^{-12}$ m (sub-picometer to picometer scale),\
    \ depending on crystal type, geometry, and photon energy. It is determined from\
    \ calibration measurements using known spectral lines or from optical ray-tracing\
    \ models that account for contributions from the [spectrometer_entrance_slit_width](name:spectrometer_entrance_slit_width),\
    \ crystal rocking curve, and detector point-spread function. This quantity applies\
    \ per spectrometer channel or per detector bin when the instrument function varies\
    \ across the detector plane.\n\nSign convention: Positive when the standard deviation\
    \ $\\sigma$ is greater than zero, corresponding to a physically realizable finite-width\
    \ Gaussian kernel."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:instrument_function_central_wavelength
  - name:spectrometer_entrance_slit_width
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/bin/instrument_function/sigma
    dd_path: spectrometer_x_ray_crystal/channel/bin/instrument_function/sigma
    status: composed
- name: major_radius_of_grating_summit
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the summit (apex) point of a spectrometer\
    \ diffraction grating or crystal, in the right-handed cylindrical (R, \u03C6,\
    \ Z) frame."
  documentation: "The major radius $R$ of a grating or crystal summit locates the\
    \ apex of the dispersing element in the machine cylindrical frame $(R, \\phi,\
    \ Z)$, where $R$ is the perpendicular distance from the machine symmetry axis.\
    \ Together with [vertical_coordinate_of_grating_summit](name:vertical_coordinate_of_grating_summit)\
    \ and [toroidal_angle_of_grating_summit](name:toroidal_angle_of_grating_summit),\
    \ this quantity completes the cylindrical coordinate triple $(R, \\phi, Z)$ needed\
    \ to fully specify the summit position \u2014 a prerequisite for ray-tracing and\
    \ Rowland-circle geometry calculations in UV and X-ray crystal spectrometer systems.\
    \ Typical values range from roughly 1.5 m to 10 m depending on the tokamak or\
    \ stellarator size and port location. The coordinate is derived from engineering\
    \ survey data or optical alignment measurements during installation and is held\
    \ fixed unless the grating is repositioned.\n\nSign convention: Positive when\
    \ $R$ is measured radially outward from the machine symmetry axis, as is always\
    \ the case for a physically realizable major radius."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_grating_summit
  - name:toroidal_angle_of_grating_summit
  constraints: []
  sources:
  - id: dd:spectrometer_uv/channel/grating/summit/r
    dd_path: spectrometer_uv/channel/grating/summit/r
    status: composed
  - id: dd:spectrometer_x_ray_crystal/crystal/summit/r
    dd_path: spectrometer_x_ray_crystal/crystal/summit/r
    status: composed
- name: photon_wavelength_of_detector_pixel
  kind: scalar
  status: draft
  description: Photon wavelength assigned to a generic detector pixel, providing the
    spectral axis calibration for any pixel-based radiation diagnostic.
  documentation: "The photon wavelength at a detector pixel gives the central wavelength\
    \ $\\lambda$ of incoming photons mapped to that pixel by the instrument's dispersion\
    \ relation, establishing the spectral calibration axis. For Bragg-reflecting crystal\
    \ spectrometers the mapping follows $2d\\sin\\theta = n\\lambda$, where $d$ is\
    \ the crystal plane spacing, $\\theta$ is the Bragg angle at the pixel position,\
    \ and $n$ is the diffraction order; for grating-based instruments an analogous\
    \ grating equation applies. Because the dispersion is generally nonlinear, each\
    \ pixel carries a distinct wavelength value rather than a uniform spectral step.\
    \ Typical X-ray emission spectroscopy targets wavelengths in the range $10^{-11}$\u2013\
    $10^{-9}$ m (0.01\u20131 nm), corresponding to photon energies of order 1\u2013\
    100 keV. The wavelength map is derived from geometric ray-tracing models constrained\
    \ by known line positions (e.g., He-like or H-like charge-exchange emission) during\
    \ wavelength calibration. The more specific [photon wavelength of crystal spectrometer\
    \ pixel](name:photon_wavelength_of_crystal_spectrometer_pixel) applies when the\
    \ detector is the imaging plane of a crystal spectrometer and the full 2D wavelength\
    \ map accounts for the elliptical curvature of iso-wavelength surfaces. The [instrument\
    \ function central wavelength](name:instrument_function_central_wavelength) gives\
    \ the peak of the spectrometer's spectral response kernel at a given channel and\
    \ complements the per-pixel calibration described here."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:photon_wavelength_of_crystal_spectrometer_pixel
  - name:instrument_function_central_wavelength
  constraints: []
  sources:
  - id: dd:spectrometer_x_ray_crystal/channel/bin/wavelength
    dd_path: spectrometer_x_ray_crystal/channel/bin/wavelength
    status: composed
- name: radius_of_detector
  kind: scalar
  status: draft
  description: Radius of the circular active area of a diagnostic detector element,
    applicable when the detector geometry is circular rather than rectangular.
  documentation: 'The detector radius $r_d$ characterizes the circular sensitive area
    of an individual diagnostic channel, directly determining the solid angle subtended
    at the detector and hence the geometric throughput (etendue) of the measurement
    system. For a circular detector of radius $r_d$ separated by distance $L$ from
    a collimating aperture, the geometric etendue scales as $\mathcal{G} \propto \pi
    r_d^2 \cdot \Omega$, where $\Omega$ is the solid angle accepted by the aperture.
    Typical detector radii range from 0.5 mm to 10 mm for hard and soft X-ray spectrometer
    or bolometer channels in tokamak diagnostics. This quantity is only meaningful
    when the detector cross-section is circular; for rectangular detectors, [first_coordinate_width_of_detector](name:first_coordinate_width_of_detector)
    and [second_coordinate_width_of_detector](name:second_coordinate_width_of_detector)
    provide the equivalent geometry. The circular detector geometry is analogous to
    the [radius_of_aperture](name:radius_of_aperture) and [radius_of_filter_window](name:radius_of_filter_window)
    constructs describing other optical elements in the same diagnostic channel.


    Sign convention: Positive when the radius is measured outward from the detector
    center.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_width_of_detector
  - name:second_coordinate_width_of_detector
  - name:radius_of_aperture
  - name:radius_of_filter_window
  constraints: []
  sources:
  - id: dd:mse/channel/detector/radius
    dd_path: mse/channel/detector/radius
    status: attached
  - id: dd:soft_x_rays/channel/detector/radius
    dd_path: soft_x_rays/channel/detector/radius
    status: composed
- name: radius_of_filter_window
  kind: scalar
  status: draft
  description: Radius of a circular diagnostic filter window, defined as the distance
    from the geometric center of the window to the edge of its clear optical opening.
    This quantity applies only when the window has circular geometry; rectangular
    windows are characterized by orthogonal width quantities instead.
  documentation: "A diagnostic filter window placed in front of a detector or aperture\
    \ attenuates or spectrally selects incident radiation. When the window has circular\
    \ geometry, its size is fully characterized by a single radius $r_{\\rm fw}$,\
    \ defined as the distance from the geometric center of the circular opening to\
    \ the edge of its clear optical aperture \u2014 that is, the unobscured region\
    \ through which radiation passes, excluding any mount, frame, or retaining ring\
    \ that may partially occlude the opening.\n\nFor a circular window of radius $r_{\\\
    rm fw}$ at distance $d$ from a point source (with $r_{\\rm fw} \\ll d$), the projected\
    \ solid angle subtended by the clear opening is $\\Omega \\approx \\pi r_{\\rm\
    \ fw}^2 / d^2$, and the accepted photon flux scales accordingly. Corrections for\
    \ finite source extent, off-axis geometry, or partial vignetting by mounts may\
    \ be required in precision radiometric calibrations.\n\nTypical radii range from\
    \ sub-millimeter values in collimated crystal spectrometer channels to several\
    \ centimeters in wide-field soft-X-ray or bolometric cameras; values are determined\
    \ from engineering drawings or optical metrology.\n\nThis quantity is defined\
    \ only when the filter window has circular geometry. Windows with rectangular\
    \ geometry are instead described by [first_coordinate_width_of_filter_window](name:first_coordinate_width_of_filter_window)\
    \ and [second_coordinate_width_of_filter_window](name:second_coordinate_width_of_filter_window).\
    \ The clear aperture radius of the same channel is given by [radius_of_aperture](name:radius_of_aperture),\
    \ and the active detector element radius by [radius_of_detector](name:radius_of_detector)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_coordinate_width_of_filter_window
  - name:second_coordinate_width_of_filter_window
  - name:radius_of_aperture
  - name:radius_of_detector
  constraints: []
  sources:
  - id: dd:soft_x_rays/channel/filter_window/radius
    dd_path: soft_x_rays/channel/filter_window/radius
    status: composed
