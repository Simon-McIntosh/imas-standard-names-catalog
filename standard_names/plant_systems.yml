- name: argon_prefill_count
  kind: scalar
  status: active
  description: Argon prefill count is the total amount of neutral argon (Ar) introduced
    before plasma breakdown, expressed as an equivalent-electron count with 18 per
    atom.
  documentation: 'Argon prefill count is the total amount of neutral argon (Ar) introduced
    during the prefill phase before plasma breakdown, expressed as an equivalent-electron
    count. Each neutral argon atom contributes 18 equivalent electrons.


    The equivalent-electron count is obtained by accumulating injected argon atoms
    over the prefill interval and weighting them by the argon atomic number:


    $$

    N_{e,\mathrm{eq}}^{\mathrm{Ar,prefill}} = Z_{\mathrm{Ar}} N_{\mathrm{Ar,prefill}}
    = Z_{\mathrm{Ar}} \int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Ar}}(t)\,dt =
    18\int_{t_0}^{t_{\mathrm{bd}}} \dot{N}_{\mathrm{Ar}}(t)\,dt

    $$


    where $N_{e,\mathrm{eq}}^{\mathrm{Ar,prefill}}$ is the equivalent-electron count,
    $N_{\mathrm{Ar,prefill}}$ is the accumulated neutral-argon atom count, $Z_{\mathrm{Ar}}=18$
    is the argon atomic number, $\dot{N}_{\mathrm{Ar}}$ is the argon atom injection
    rate, $t_0$ is the prefill start time, and $t_{\mathrm{bd}}$ is the plasma-breakdown
    time.


    This quantity includes only argon introduced before breakdown and excludes wall
    recycling, neutral-beam or pellet fueling, later gas injection, and retained or
    ionized inventory. It is the argon-specific component of [prefill count](name:prefill_count)
    and follows the isotope-resolved convention used for [tritium prefill count](name:tritium_prefill_count).'
  unit: '1'
