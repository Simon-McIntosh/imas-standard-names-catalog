name: electron_pressure_pedestal_fit_offset
status: draft
cocos_transformation_type: one_like
description: Residual electron pressure in the far scrape-off layer, used as the asymptotic
  offset in pedestal profile fitting functions.
documentation: "The electron pressure SOL offset $p_{e,\\rm offset}$ is the constant\
  \ baseline value that the electron pressure profile approaches far outside the separatrix\
  \ ($\\psi_N > 1$). In the standard mtanh pedestal parameterization, $p_e(\\psi_N)\
  \ = p_{e,\\rm ped} \\cdot [\\text{mtanh}(\\ldots)] + p_{e,\\rm offset}$, this offset\
  \ prevents the fit from being forced to zero in the SOL where residual ionization\
  \ and recycling maintain a finite $p_e$. Typical values are 10\u2013500 Pa, depending\
  \ on fueling, recycling conditions, and wall proximity. Accurate determination of\
  \ this offset is important for separatrix power-balance calculations and for constraining\
  \ edge transport models. Measured via far-SOL Thomson scattering channels or reciprocating\
  \ Langmuir probes. See also `electron_pressure_at_separatrix` and `electron_pressure_at_pedestal`."
