- name: solid_angle_of_detector_voxel
  kind: scalar
  status: draft
  description: Solid angle subtended by a single detector voxel as seen from the plasma
    emission region, providing the geometric weighting factor that relates emitted
    radiation to the signal recorded in that voxel.
  documentation: 'The solid angle $\Omega$ of a detector voxel quantifies the fraction
    of the full sphere ($4\pi$ sr) intercepted by that voxel as viewed from a source
    point in the plasma. For a planar detector element of area $A_d$ at distance $r$
    from the source, oriented at angle $\theta$ relative to the line joining source
    to detector, the differential solid angle is


    $$d\Omega = \frac{A_d \cos\theta}{r^2}.$$


    For a finite voxel the quantity reported here is the solid angle averaged over
    the voxel volume, accounting for the spatial variation of $r$ and $\theta$ across
    the voxel. It is defined purely geometrically and does not incorporate detector
    efficiency, neutron transport cross-sections, or spectral response.


    The solid angle enters the neutron transport relation


    $$\Phi_{\mathrm{voxel}} = \frac{\Omega}{4\pi} \int_{\mathrm{voxel}} S(\mathbf{r})\,
    dV,$$


    where $\Phi_{\mathrm{voxel}}$ (neutrons s$^{-1}$) is the flux incident on the
    detector from the voxel and $S(\mathbf{r})$ (neutrons m$^{-3}$ s$^{-1}$) is the
    volumetric neutron emission rate, assuming the voxel is small enough that $\Omega$
    is approximately uniform across it.


    Typical values range from $10^{-6}$ sr for a compact high-resolution detector
    array to $10^{-2}$ sr for a large near-field collimator. The quantity is independent
    of plasma conditions and is determined entirely by the detector geometry and its
    distance from the source region. It is used as a per-voxel geometric weight in
    line-of-sight integration and tomographic reconstruction of the neutron emission
    profile.'
  unit: sr
  physics_domain: particle_measurement_diagnostics
  links:
  - name:solid_angle_of_field_of_view
  - name:volume_of_neutron_detector_converter
  - name:major_radius_of_emission_grid_point
  - name:vertical_coordinate_of_emission_grid_point
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detector/field_of_view/solid_angle
    dd_path: neutron_diagnostic/detector/field_of_view/solid_angle
    status: composed
- name: total_fusion_power
  kind: scalar
  status: draft
  description: Aggregate power produced by all fusion reactions occurring within the
    plasma, obtained by integrating the local fusion power density over the full plasma
    volume.
  documentation: 'The total fusion power $P_\mathrm{fus}$ is the volume integral of
    the fusion reaction rate density multiplied by the energy released per reaction:


    $$P_\mathrm{fus} = \int Q \, R_{\alpha\beta}(\mathbf{r}) \, d^3r$$


    where $Q$ is the energy yield per fusion event (17.6 MeV for D-T), $R_{\alpha\beta}$
    is the local reaction rate density in m$^{-3}$ s$^{-1}$, and the integral extends
    over the plasma volume. For a D-T plasma, $R_{\alpha\beta} = n_D n_T \langle \sigma
    v \rangle_{DT}$, where $n_D$ and $n_T$ are the deuterium and tritium number densities
    and $\langle \sigma v \rangle_{DT}$ is the reactivity. In present tokamak experiments,
    $P_\mathrm{fus}$ is not measured directly but is inferred from [neutron emission
    rate measurements](name:total_neutron_emission_rate), since each D-T reaction
    produces one 14.1 MeV neutron; [fusion_power](name:fusion_power) provides the
    neutron-detector-based reconstruction of this same quantity. Typical values range
    from a few kilowatts in current deuterium-only experiments to several hundred
    megawatts projected for burning-plasma devices such as ITER ($P_\mathrm{fus} \approx
    500$ MW at $Q = 10$). The fusion power is the primary heat source driving [fusion_thermal_power_input](name:fusion_thermal_power_input)
    in a power-plant context and sets the alpha-particle heating power $P_\alpha =
    0.2\, P_\mathrm{fus}$ available to sustain the plasma.'
  unit: W
  physics_domain: particle_measurement_diagnostics
  links:
  - name:total_neutron_emission_rate
  - name:fusion_power
  - name:fusion_thermal_power_input
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/fusion_power
