- name: width_of_poloidal_field_coil
  kind: scalar
  status: active
  description: "Full radial extent of the rectangular cross-section of one active\
    \ poloidal-field coil conductor, measured parallel to the major-radius coordinate\
    \ R in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Full radial extent of the rectangular cross-section of one active
    poloidal-field coil conductor is the scalar side length of that rectangle parallel
    to the major-radius coordinate $R$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame. Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height.


    This quantity applies to a single active poloidal-field coil conductor whose cross-section
    is represented as rectangular. It is the full radial extent of that one conductor
    cross-section, with no summation, averaging, or aggregation over multiple conductors,
    turns, or coil elements.


    It is distinct from the [height of a poloidal-field coil](name:height_of_poloidal_field_coil),
    which is the full vertical extent parallel to $Z$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is also distinct from the [area of a poloidal-field coil](name:area_of_poloidal_field_coil),
    a cross-sectional area rather than a side length, and from any directed displacement
    or position coordinate.


    For the same rectangular conductor cross-section, the [area of a poloidal-field
    coil](name:area_of_poloidal_field_coil) is the product of this width and the [height
    of a poloidal-field coil](name:height_of_poloidal_field_coil).'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - dd_path: pf_active/coil/element/geometry/rectangle/width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-geometry-rectangle-width
