- name: line_averaged_total_ion_density
  kind: scalar
  status: active
  description: Total ion number density averaged along a specified plasma chord, summing
    all ion species and charge states, including thermal and non-thermal ions.
  documentation: 'The line-averaged total ion density is the chord average of the
    local [total ion density](name:total_ion_density), including all ion species,
    resolved charge states, and thermal and non-thermal ion populations. It excludes
    electron density.


    $$

    n_{\mathrm{i,line}} = \frac{1}{L}\int_0^L n_{\mathrm{i,total}}(l)\,dl

    $$


    where $l$ is distance along the chord, $L$ is chord length, $n_{\mathrm{i,total}}(l)$
    is local total ion density, and $n_{\mathrm{i,line}}$ is the resulting line average.
    Unlike the [volume-averaged total ion density](name:volume_averaged_total_ion_density),
    it averages along a chord rather than throughout a volume.'
  unit: m^-3
