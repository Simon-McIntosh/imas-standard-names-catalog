- name: refractive_index_of_optical_element
  kind: scalar
  status: active
  description: Dimensionless wave-propagation quantity relating electromagnetic phase
    propagation in a medium to vacuum propagation, including vector and scalar forms.
  documentation: "The refractive index is the dimensionless relation between an electromagnetic\
    \ wave\u2019s phase propagation in a medium and in vacuum. It describes the wave-vector\
    \ direction and magnitude relative to vacuum propagation, while material-specific\
    \ forms describe the corresponding phase-velocity ratio.\n\nThe defining relation\
    \ is:\n\n$$\n\\mathbf{n} = \\frac{\\mathbf{k}}{k_0}, \\qquad k_0 = \\frac{\\omega}{c}\n\
    $$\n\nwhere $\\mathbf{n}$ is the refractive-index vector, $\\mathbf{k}$ is the\
    \ wave vector, $k_0$ is the vacuum wave number, $\\omega$ is angular frequency,\
    \ and $c$ is the speed of light in vacuum. For a scalar bulk-medium index, the\
    \ corresponding relation is $n = c/v_{\\rm ph}$, where $v_{\\rm ph}$ is phase\
    \ velocity. Directional plasma projections include [parallel refractive index](name:parallel_refractive_index),\
    \ while wavelength-resolved optical-material behavior is represented by [spectral\
    \ refractive index of optical element](name:spectral_refractive_index_of_optical_element).\n\
    \nSign convention: Positive when a signed wave-vector projection points along\
    \ its stated positive direction; cylindrical directions use the right-handed $(R,\
    \ \\phi, Z)$ basis."
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:parallel_refractive_index
  - name:spectral_refractive_index_of_optical_element
  arguments:
  - name: refractive_index
    operator: optical_element
    operator_kind: locus
- name: spectral_refractive_index_of_optical_element
  kind: scalar
  status: active
  description: Wavelength-dependent refractive index of an optical-element material,
    defined by the ratio of vacuum light speed to phase velocity and expressing material
    dispersion.
  documentation: 'This quantity is the phase refractive index of the optical-element
    material resolved as a function of wavelength. It describes how the material changes
    electromagnetic phase propagation relative to vacuum.


    For vacuum wavelength $\lambda$, the refractive index is defined by


    $$

    n(\lambda) = \frac{c}{v_p(\lambda)}

    $$


    where $n(\lambda)$ is the dimensionless refractive index, $c$ is the vacuum speed
    of light, $v_p(\lambda)$ is the material phase velocity, and $\lambda$ is the
    vacuum wavelength; $c$ and $v_p$ are measured in m s$^{-1}$ and $\lambda$ in m.


    The wavelength dependence represents material dispersion and distinguishes this
    quantity from the wavelength-independent abstraction [refractive index of the
    optical element](name:refractive_index_of_optical_element). It describes phase
    propagation only and does not represent absorptive loss or a complex extinction
    component. The wavelength coordinate is the spectral axis defined by [spectral
    wavelength of optical element](name:spectral_wavelength_of_optical_element).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:refractive_index_of_optical_element
  - name:spectral_wavelength_of_optical_element
  arguments:
  - name: refractive_index_of_optical_element
    operator: spectral
    operator_kind: qualifier
  sources:
