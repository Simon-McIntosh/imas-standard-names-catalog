name: electron_normalized_collisionality_at_pedestal_top
status: draft
cocos_transformation_type: one_like
description: Dimensionless electron collisionality $\nu_e^*$ at the pedestal top,
  measuring the ratio of the electron collision rate to the bounce frequency.
documentation: "The normalized electron collisionality is defined as $\\nu_e^* = \\\
  nu_{ei} q R / (\\epsilon^{3/2} v_{\\mathrm{th},e})$, where $\\nu_{ei}$ is the electron-ion\
  \ collision frequency (s$^{-1}$), $q$ is the safety factor, $R$ is the major radius\
  \ (m), $\\epsilon = r/R$ is the local inverse aspect ratio, and $v_{\\mathrm{th},e}\
  \ = \\sqrt{2 T_e / m_e}$ is the electron thermal speed (m/s). Evaluated at the pedestal\
  \ top, this quantity determines whether the pedestal electrons are in the banana\
  \ ($\\nu_e^* \\ll 1$), plateau ($\\nu_e^* \\sim 1$), or Pfirsch\u2013Schl\xFCter\
  \ ($\\nu_e^* \\gg 1$) neoclassical regime, directly affecting the bootstrap current\
  \ density and neoclassical transport. Typical pedestal-top values range from $\\\
  nu_e^* \\sim 0.1$ (low-density, high-temperature pedestals) to $\\nu_e^* \\sim 10$\
  \ (high-density, low-temperature conditions). This parameter is a key ingredient\
  \ in pedestal scaling laws and the EPED stability model. Computed from fitted pedestal\
  \ profiles of $n_e$ and $T_e$ together with equilibrium quantities $q$ and $\\epsilon$.\
  \ See also `coulomb_logarithm_at_pedestal_top` and `electron_poloidal_beta_at_pedestal_top_flux_surface_averaged`."
