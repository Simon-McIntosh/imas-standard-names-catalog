- name: electron_number_density_at_divertor_target
  kind: scalar
  status: draft
  description: Electron number density at the divertor target plate. This is the local
    electron density at the material surface where the scrape-off layer plasma terminates,
    and may be inferred from Langmuir probe measurements or estimated using a two-point
    scrape-off layer model.
  documentation: 'The electron number density at the divertor target, $n_{e,t}$ (m$^{-3}$),
    is the number of free electrons per unit volume evaluated at the plasma-facing
    surface of the divertor target plate. It characterizes the plasma conditions at
    the point where the open field lines of the scrape-off layer (SOL) intersect the
    solid target material.


    Within the two-point SOL model the target density is related to the upstream (midplane)
    electron density $n_{e,u}$ and to the parallel pressure balance along the magnetic
    field line. Under the assumption of constant total pressure along the field line
    (no momentum losses), the target pressure equals the upstream pressure:

    $$p_{e,u} = n_{e,u} k_B T_{e,u} \approx n_{e,t} k_B T_{e,t}$$

    where $T_{e,u}$ and $T_{e,t}$ are the upstream and target electron temperatures
    (both in kelvin when SI units are used). Accordingly,

    $$n_{e,t} = n_{e,u}\,\frac{T_{e,u}}{T_{e,t}}$$

    Because $T_{e,t} \ll T_{e,u}$ in detached or high-recycling regimes, $n_{e,t}$
    can greatly exceed $n_{e,u}$.


    Typical values range from $\sim 10^{18}$ m$^{-3}$ in attached, low-density plasmas
    to $\sim 10^{21}$ m$^{-3}$ or higher under strongly detached conditions. The quantity
    is a non-negative scalar; it is zero only in the limit of complete plasma extinction
    at the target.


    Experimentally, $n_{e,t}$ is most commonly inferred from Langmuir probes embedded
    in the target tile, from which the ion saturation current density combined with
    a temperature measurement yields the local density. Spectroscopic inversion and
    particle balance methods provide alternative estimates.


    This quantity is distinct from the line-averaged or volume-averaged electron density
    and from the upstream density. It is the boundary condition for heat-flux and
    particle-flux analyzes at the divertor surface.'
  unit: m^-3
  physics_domain: divertor_physics
  links:
  - name:electron_temperature_at_divertor_target
  - name:electron_pressure
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/two_point_model/n_e_target
    dd_path: divertors/divertor/target/two_point_model/n_e_target
    status: composed
- name: electron_temperature_at_divertor_target
  kind: scalar
  status: draft
  description: Electron temperature of the plasma immediately at the divertor target
    plate surface. This is a non-negative scalar quantity characterizing the thermal
    energy of electrons in the plasma-wetted region of the target, accessible through
    Langmuir probe measurements or inferred from the two-point scrape-off layer model.
  documentation: "The electron temperature at the divertor target, $T_{e,\\mathrm{target}}$,\
    \ is defined as the local electron thermal energy (in eV) of the plasma at the\
    \ point where field lines intersect the divertor target plate. It is a non-negative\
    \ scalar quantity.\n\n**Formal definition:** In the two-point scrape-off layer\
    \ (SOL) model, $T_{e,\\mathrm{target}}$ is obtained by integrating the parallel\
    \ energy balance along a flux tube connecting the upstream SOL midplane to the\
    \ divertor target. The defining relation for the steady-state, conduction-limited\
    \ regime is:\n\n$$T_{e,\\mathrm{target}} = \\left( T_{e,u}^{7/2} - \\frac{7}{2}\
    \ \\frac{q_{\\parallel} L}{\\kappa_0} \\right)^{2/7}$$\n\nwhere $T_{e,u}$ is the\
    \ upstream electron temperature (eV), $q_{\\parallel}$ is the parallel heat flux\
    \ density (W m$^{-2}$), $L$ is the connection length from midplane to target (m),\
    \ and $\\kappa_0 \\approx 2000$ W m$^{-1}$ eV$^{-7/2}$ is the Spitzer-H\xE4rm\
    \ electron thermal conductivity coefficient. This expression assumes purely conductive\
    \ parallel transport with no volumetric radiation or ionization losses between\
    \ upstream and target; when significant power losses occur, the effective $q_{\\\
    parallel}$ entering the target is reduced accordingly.\n\n**Measurement:** Direct\
    \ measurement is typically performed via flush-mounted Langmuir probes embedded\
    \ in the target tile, from the slope of the ion saturation current or from the\
    \ electron-retardation branch of the probe characteristic. Spectroscopic and Thomson\
    \ scattering measurements near the target can provide independent estimates.\n\
    \n**Typical values:** In attached, high-recycling divertor conditions, $T_{e,\\\
    mathrm{target}}$ typically ranges from a few eV to tens of eV (approximately 5\u2013\
    50 eV for conventional tokamak divertors). Under partial or full detachment, $T_{e,\\\
    mathrm{target}}$ can fall below 5 eV or approach 1 eV, consistent with volumetric\
    \ recombination and radiation dominating the power balance near the target.\n\n\
    **Physical significance:** A low $T_{e,\\mathrm{target}}$ reduces physical sputtering\
    \ of the target material and is a key objective of divertor design. The value\
    \ serves as a boundary condition for SOL transport codes and is central to heat-load\
    \ and impurity-generation estimates."
  unit: eV
  physics_domain: divertor_physics
  links:
  - name:electron_number_density_at_divertor_target
  - name:total_thermal_power_directed_to_divertor
  - name:electron_temperature
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/two_point_model/t_e_target
    dd_path: divertors/divertor/target/two_point_model/t_e_target
    status: composed
- name: major_radius_of_divertor_tile_surface_outline_point
  kind: scalar
  status: draft
  description: Major-radius (R) coordinate of a point on the plasma-facing surface
    outline contour of a divertor tile, measured in the right-handed cylindrical $(R,
    \phi, Z)$ frame.
  documentation: 'The major radius $R$ locates a point along the discretized outline
    contour of a divertor tile surface in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is the perpendicular distance from the machine symmetry axis.
    Divertor tile surface outlines are defined as a set of $(R, Z)$ coordinate pairs
    tracing the poloidal cross-section of the plasma-facing tile geometry; the full
    contour geometry is recovered by pairing this quantity with its vertical counterpart
    [vertical coordinate of the divertor tile surface outline point](name:vertical_coordinate_of_divertor_tile_surface_outline_point).
    Typical values range from approximately 0.5 m to 3 m depending on the device and
    tile location, with inner-target tiles at smaller $R$ and outer-target tiles at
    larger $R$. The contour is used in heat-flux and erosion calculations, particle-flux
    mapping, and plasma-wall interaction modeling; it is obtained from engineering
    drawings or coordinate-measurement surveys of the divertor geometry. The analogous
    coordinate for the plasma boundary is [major radius of a plasma boundary outline
    point](name:major_radius_of_plasma_boundary_outline_point), which uses the same
    geometric convention.


    Sign convention: Positive when $R$ is measured in the outward radial direction
    from the machine symmetry axis, consistent with the right-handed cylindrical $(R,
    \phi, Z)$ frame where $R > 0$ everywhere.'
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_coordinate_of_divertor_tile_surface_outline_point
  - name:major_radius_of_plasma_boundary_outline_point
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/r
    dd_path: divertors/divertor/target/tile/surface_outline/r
    status: composed
- name: radial_extent_of_divertor_target
  kind: scalar
  status: draft
  description: Projected length of the divertor target surface along the major-radius
    $R$ direction in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The radial extent of the divertor target quantifies the span of\
    \ the plasma-facing strike surface projected onto the major-radius axis $R$ of\
    \ the right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the distance\
    \ from the machine symmetry axis. This geometric parameter determines the area\
    \ over which particle and heat fluxes are distributed and directly influences\
    \ power-handling calculations via the projected wetted area. Together with the\
    \ complementary [vertical extent](name:vertical_extent_of_divertor_target), it\
    \ fully characterizes the two-dimensional projected footprint of the target surface\
    \ in the poloidal $(R, Z)$ plane. Typical values range from a few centimeters\
    \ to tens of centimeters depending on the divertor configuration (vertical, horizontal,\
    \ or tilted target) and machine size; for large tokamaks the radial extent may\
    \ reach 0.1\u20130.4 m. The quantity is obtained from the engineering geometry\
    \ of the divertor assembly and can be verified against surface outline coordinates\
    \ such as [major-radius outline points](name:major_radius_of_divertor_tile_surface_outline_point).\n\
    \nSign convention: Positive when the target surface extends in the direction of\
    \ increasing major radius $R$."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:vertical_extent_of_divertor_target
  - name:major_radius_of_divertor_tile_surface_outline_point
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/extension_r
    dd_path: divertors/divertor/target/extension_r
    status: composed
- name: scrape_off_layer_heat_flux_decay_length
  kind: scalar
  status: draft
  description: Radial e-folding length of the heat flux profile in the scrape-off
    layer, mapped to the outboard midplane, defining the narrow power channel width
    lambda_q.
  documentation: "The heat flux decay length $\\lambda_q$ characterizes the exponential\
    \ fall-off of the parallel heat flux $q_\\parallel$ with distance $r$ from the\
    \ last closed flux surface (LCFS) in the scrape-off layer: $q_\\parallel(r) \\\
    propto \\exp(-r/\\lambda_q)$, where $r$ is the radial coordinate measured from\
    \ the LCFS at the outboard midplane. This parameter governs the peak heat load\
    \ deposited on divertor targets through flux expansion and parallel transport;\
    \ it enters the two-point model expression $q_\\mathrm{peak} \\propto P_\\mathrm{SOL}\
    \ / (\\lambda_q f_x R)$, where $P_\\mathrm{SOL}$ is the power flowing into the\
    \ SOL, $f_x$ is the flux expansion factor, and $R$ is the major radius. Typical\
    \ midplane values in high-confinement mode tokamak plasmas range from 1\u2013\
    5 mm, with the multi-machine scaling by Eich et al. (Nucl. Fusion 53, 2013, 093031)\
    \ giving $\\lambda_q \\propto B_\\mathrm{pol}^{-1.19}$, where $B_\\mathrm{pol}$\
    \ is the poloidal field. The quantity is inferred from infrared thermography measurements\
    \ of the target heat-flux profile combined with geometric mapping from the divertor\
    \ to the midplane. It is distinct from the [heat flux spreading length](name:scrape_off_layer_heat_flux_spreading_length)\
    \ $S$, which parameterizes additional broadening due to perpendicular transport\
    \ near the target; together $\\lambda_q$ and $S$ appear in the Eich integral-width\
    \ formula $\\lambda_\\mathrm{int} = \\lambda_q + 1.64 S$.\n\nSign convention:\
    \ Positive when the heat flux magnitude decreases in the direction of increasing\
    \ major radius $R$ away from the LCFS."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:scrape_off_layer_heat_flux_spreading_length
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/two_point_model/sol_heat_decay_length
    dd_path: divertors/divertor/target/two_point_model/sol_heat_decay_length
    status: composed
- name: scrape_off_layer_heat_flux_spreading_length
  kind: scalar
  status: draft
  description: Characteristic radial spreading length S of the heat flux profile in
    the scrape-off layer at the outboard midplane, quantifying flux-tube broadening
    beyond the narrow exponential decay channel.
  documentation: "The heat flux spreading length $S$ parameterizes the broadening\
    \ of the radial heat flux profile in the scrape-off layer beyond the narrow exponential\
    \ channel described by the decay length $\\lambda_q$ (see [scrape-off layer heat\
    \ flux decay length](name:scrape_off_layer_heat_flux_decay_length)). In the two-point\
    \ model framework of Eich et al. (Nucl. Fusion 53, 093031, 2013), the total heat\
    \ flux profile at the outboard midplane is approximated by the convolution of\
    \ an exponential with a Gaussian of width $S$, yielding an effective broadening\
    \ of the power footprint on divertor targets. Physically, $S$ arises from cross-field\
    \ transport processes \u2014 including drift-driven and turbulent transport \u2014\
    \ that spread energy radially as field lines map from midplane to divertor target.\
    \ Typical values of $S$ in attached H-mode plasmas on medium-size tokamaks range\
    \ from 0.5 to 5 mm at the outboard midplane; $S$ is generally comparable to or\
    \ smaller than $\\lambda_q$ in high-confinement regimes. The quantity is inferred\
    \ from infrared thermography measurements of the heat flux footprint on the divertor\
    \ target, combined with field-line mapping. This quantity is relevant only for\
    \ attached plasma conditions; detached regimes require separate treatment of parallel\
    \ heat transport. The distinction between $S$ and $\\lambda_q$ is operationally\
    \ important: $\\lambda_q$ governs peak heat flux while $S$ redistributes the integrated\
    \ power over a broader wetted area.\n\nSign convention: Positive when the spreading\
    \ length $S$ is a non-negative real value representing a physical radial width."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:scrape_off_layer_heat_flux_decay_length
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/two_point_model/sol_heat_spreading_length
    dd_path: divertors/divertor/target/two_point_model/sol_heat_spreading_length
    status: composed
- name: surface_area_of_divertor_tile
  kind: scalar
  status: draft
  description: True plasma-facing surface area of an individual divertor tile, computed
    as the integral of the differential area element over the actual three-dimensional
    plasma-facing surface, including curvature and faceting of the tile geometry.
  documentation: 'The surface area $A$ of a divertor tile is the total area of the
    plasma-facing surface as defined by the tile surface outline, computed as the
    surface integral

    $$A = \int_{\mathcal{S}} dS$$

    over the true three-dimensional plasma-facing surface $\mathcal{S}$. For curved
    or faceted tile geometries, this is not a planar projection but the actual area
    swept by the surface, consistent with the outline described by the $(R, Z)$ coordinates
    of surface outline points in the cylindrical $(R, \phi, Z)$ frame (with $R$ the
    major radius and $Z$ the vertical height).


    This quantity governs the local time-averaged and peak heat and particle flux
    densities: the heat flux density $q = P/A$ and the particle flux density $\Gamma
    = F/A$, where $P$ and $F$ are the power and particle flow intercepted by the tile.
    Typical single-tile surface areas in present-day tokamaks range from $\sim 10^{-3}\,\mathrm{m}^2$
    to $\sim 10^{-2}\,\mathrm{m}^2$, depending on tile dimensions and toroidal extent.


    The tile surface area is distinct from the projected strike-footprint area, which
    is the projection of the wetted area onto a reference plane; the true surface
    area accounts for tile tilt, curvature, and the angle of incidence of field lines.
    It is also distinct from the total target surface area, which aggregates contributions
    from all tiles in a target assembly.'
  unit: m^2
  physics_domain: divertor_physics
  links:
  - name:major_radius_of_strike_point
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/tile/surface_area
    dd_path: divertors/divertor/target/tile/surface_area
    status: composed
- name: vertical_coordinate_of_divertor_tile_surface_outline_point
  kind: scalar
  status: draft
  description: Vertical (Z) coordinate of a point on the plasma-facing surface outline
    contour of a divertor tile, measured in the right-handed cylindrical $(R, \phi,
    Z)$ frame.
  documentation: "The vertical coordinate $Z$ locates a point along the poloidal cross-section\
    \ outline of a divertor tile's plasma-facing surface in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame, where $Z$ is the height above the machine midplane in\
    \ meters. Together with the complementary [major-radius coordinate](name:major_radius_of_divertor_tile_surface_outline_point),\
    \ a sequence of $(R, Z)$ pairs traces the full two-dimensional contour of the\
    \ tile surface as seen in a poloidal cross-section. This contour defines the geometry\
    \ used for heat-load analysis, particle flux calculations, and the mapping of\
    \ plasma\u2013surface interactions onto individual divertor tiles. Typical $Z$\
    \ values for divertor tiles range from approximately $-1.5$ m to $-0.5$ m below\
    \ the midplane for conventional lower single-null configurations. The outline\
    \ is obtained from engineering CAD models or in-vessel metrology surveys and is\
    \ used in conjunction with [vertical_coordinate_of_plasma_facing_component_outline_point](name:vertical_coordinate_of_plasma_facing_component_outline_point)\
    \ for consistency checks across the full first-wall geometry.\n\nSign convention:\
    \ Positive when the point lies above the machine midplane in the direction of\
    \ increasing $Z$."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:major_radius_of_divertor_tile_surface_outline_point
  - name:vertical_coordinate_of_plasma_facing_component_outline_point
  constraints: []
  sources:
  - id: dd:divertors/divertor/target/tile/surface_outline/z
    dd_path: divertors/divertor/target/tile/surface_outline/z
    status: composed
- name: vertical_extent_of_divertor_target
  kind: scalar
  status: draft
  description: Projected length of the divertor target surface along the vertical
    $Z$ axis in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: "The vertical extent of a divertor target quantifies the spatial\
    \ span of the plasma-facing surface projected onto the $Z$ (height) axis, where\
    \ $Z$ is the vertical coordinate in the right-handed cylindrical $(R, \\phi, Z)$\
    \ frame. Together with the complementary [radial extent](name:radial_extent_of_divertor_target),\
    \ which measures the projection along the major-radius $R$ axis, these two orthogonal\
    \ extents define the bounding rectangle of the target surface in the poloidal\
    \ cross-section. Typical values range from a few centimeters for compact inner\
    \ targets to 0.3\u20130.5 m for large outer vertical targets in medium-to-large\
    \ tokamaks such as JET or ITER. This quantity is used in divertor engineering\
    \ and plasma-surface interaction models to estimate wetted areas, heat-flux footprints,\
    \ and geometric shielding factors. It is obtained from CAD specifications of the\
    \ first-wall and divertor hardware or from photogrammetric surveys of tile positions;\
    \ individual tile surface outline points are described by [vertical_coordinate_of_divertor_tile_surface_outline_point](name:vertical_coordinate_of_divertor_tile_surface_outline_point).\n\
    \nSign convention: Positive when the target surface extends in the direction of\
    \ increasing $Z$."
  unit: m
  physics_domain: divertor_physics
  links:
  - name:radial_extent_of_divertor_target
  - name:vertical_coordinate_of_divertor_tile_surface_outline_point
  constraints: []
  sources:
