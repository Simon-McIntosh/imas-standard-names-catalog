- name: current_of_rogowski_coil
  kind: scalar
  status: active
  description: Signed conventional current threading a Rogowski-coil winding contour,
    with orientation set by the coil's assigned normal.
  documentation: 'Signed conventional current threading a Rogowski-coil winding contour
    is the net conventional electric current crossing an oriented surface bounded
    by that contour. The surface orientation is specified by the coil''s assigned
    normal and the associated right-hand rule for the contour.


    The enclosed current is defined by the surface integral of conventional current
    density:


    $$

    I_{\mathrm{enc}} = \int_S \mathbf{J} \cdot \hat{\mathbf{n}}\, dS

    $$


    where $S$ is any surface whose boundary is the Rogowski-coil contour, $\hat{\mathbf{n}}$
    is the assigned unit normal to that surface, and $\mathbf{J}$ is the conventional
    electric current density.


    This is an enclosed-current quantity, not the electrical current carried by the
    Rogowski-coil sensor winding. In the Rogowski-coil principle, the induced winding
    voltage is proportional to $dI_{\mathrm{enc}}/dt$; $I_{\mathrm{enc}}$ is the current
    whose time variation drives that signal.


    Sign convention: Positive when the net conventional current crosses the oriented
    surface in the direction of the assigned normal.'
  unit: A
  physics_domain: magnetic_field_diagnostics
  links:
  - name:area_of_rogowski_coil
  sources:
  - dd_path: magnetics/rogowski_coil/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/magnetics.html#magnetics-rogowski_coil-current
    dd_documentation:
      leaf: 'Measured current inside the Rogowski coil contour. The normal direction
        to the Rogowski coil is defined by the order of points in the list of guiding
        centre positions. The current is positive when oriented in the same direction
        as the normal. '
      parent_path: magnetics/rogowski_coil
      parent: Set of Rogowski coils
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Measured current enclosed within a Rogowski coil contour, used
        to determine the net current (e.g., plasma current) threading the coil loop.
        The sign convention follows the right-hand rule relative to the coil's normal
        direction.
      kind: llm
- name: length_of_poloidal_magnetic_field_probe
  kind: scalar
  status: active
  description: Physical length of the poloidal magnetic field probe coil along its
    normal vector axis. Geometric calibration parameter used with coil cross-sectional
    area and turn count to characterize the sensor geometry and effective sensing
    volume.
  documentation: 'Physical length of the poloidal magnetic field probe coil along
    its normal vector axis is the non-negative axial extent of the winding that contributes
    to the probe''s effective sensing volume. It is a geometric calibration parameter
    of the poloidal magnetic-field pickup coil.


    This quantity is an extent of the probe coil, not a directed displacement, position,
    or signed projection. It excludes the coil cross-sectional area, the number of
    turns, lead lengths, support structures, and any calibration factor that combines
    geometry with electromagnetic response; the corresponding quantity for a toroidal
    magnetic-field probe is [length_of_toroidal_magnetic_field_probe](name:length_of_toroidal_magnetic_field_probe).'
