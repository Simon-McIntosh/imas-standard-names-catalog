- name: neutral_pressure
  kind: scalar
  status: draft
  description: Kinetic pressure exerted by the neutral particle population in a tokamak
    plasma, arising from the second velocity moment of the neutral distribution function.
  documentation: 'Neutral pressure is the kinetic stress exerted by neutral particles
    in the plasma, defined as the scalar pressure derived from the second velocity
    moment of the neutral distribution function summed over all internal quantum states
    of the neutral species. It encompasses contributions from the [thermal neutral
    population](name:thermal_neutral_pressure), which exerts isotropic pressure from
    random thermal motion about the mean flow, and the [fast (suprathermal) neutral
    population](name:fast_neutral_pressure), generated primarily by charge-exchange
    reactions or beam-plasma interactions, which exhibits a gyrotropic pressure tensor
    with distinct parallel and perpendicular components relative to the local magnetic
    field. The sum of both contributions is expressed by [total_neutral_pressure](name:total_neutral_pressure).


    The scalar neutral pressure is related to the neutral distribution function $f_n(\mathbf{v})$
    by:


    $$

    p_n = \frac{m_n}{3} \int f_n(\mathbf{v})\,|\mathbf{v} - \mathbf{u}_n|^2\, d^3v

    $$


    where $m_n$ is the neutral particle mass and $\mathbf{u}_n$ is the mean neutral
    flow velocity. For the thermal neutral component this expression is exact as the
    isotropic pressure; for fast neutrals it represents one-third of the trace of
    the full gyrotropic pressure tensor.


    Neutral pressure is measured by barometry gages distributed over the vacuum vessel
    walls, providing local neutral gas inventory data relevant to plasma fueling,
    recycling, and neutral transport modeling. It may also be inferred from charge-exchange
    spectroscopy or computed by neutral transport codes solving the Boltzmann equation
    for the neutral species. A species-discriminated counterpart is given by [neutral_pressure_of_mass_spectrometer_channel](name:neutral_pressure_of_mass_spectrometer_channel).


    Typical values in tokamak divertors range from $10^{-4}$ Pa to several Pa during
    attached operation, rising toward tens of Pa near strike points under high-recycling
    or detached conditions.


    Sign convention: Positive for any neutral particle ensemble with a finite second
    velocity moment about the mean flow velocity.'
  unit: Pa
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:thermal_neutral_pressure
  - name:fast_neutral_pressure
  - name:total_neutral_pressure
  - name:neutral_pressure_of_mass_spectrometer_channel
  sources:
  - id: dd:barometry/gauge/pressure
    dd_path: barometry/gauge/pressure
    status: composed
  - id: derived:neutral_pressure
    status: composed
- name: neutral_pressure_of_mass_spectrometer_channel
  kind: scalar
  status: draft
  description: Calibrated neutral pressure equivalent assigned to one mass-discriminated
    mass-spectrometer channel. It is a channel-resolved pressure contribution inferred
    from detected ions, not necessarily the partial pressure of a unique neutral species.
  documentation: 'Neutral pressure of a mass spectrometer channel is the calibrated
    partial-pressure equivalent associated with neutrals whose ionization products
    contribute to a selected mass-to-charge channel. Because ionization can produce
    fragments and because different isotopologues, charge states, or isobaric species
    can overlap in mass, the value is best interpreted as a channel-resolved neutral
    pressure contribution unless the calibration model resolves a unique species.


    A linear response model is commonly used to express the calibration and cross-sensitivity
    between neutral components and measured ion currents:


    $$

    I_j = \sum_k R_{jk}\,p_k

    $$


    where $I_j$ is the measured ion current in detector channel $j$ in A, $p_k$ is
    the calibrated neutral pressure equivalent for component or channel $k$ in Pa,
    and $R_{jk}$ is the response matrix in A Pa$^{-1}$. The reported quantity is one
    component $p_k$ obtained from a calibrated inverse or regularized inverse of this
    response relation; when cross-sensitivities are negligible this reduces to the
    scalar calibration $p_k = C_k I_k$, with $C_k$ in Pa A$^{-1}$ after background
    subtraction.


    In practice the quantity is inferred with a residual-gas or mass spectrometer
    by ionizing sampled neutrals, separating ions by mass-to-charge ratio, and applying
    calibrated sensitivities for the ionizer, analyzer, detector gain, fragmentation
    pattern, and sampling line. A physically meaningful calibrated pressure is non-negative
    and valid only within the calibration domain, including the gas mixture assumptions,
    mass resolution, linear detector response, pressure range, and operating settings
    used to determine the response matrix. Negative numerical estimates can occur
    after offset subtraction or noisy matrix inversion; these should be interpreted
    as below-quantification or invalid estimates, not as negative neutral pressure.


    The sum of calibrated, non-overlapping channel contributions estimates the corresponding
    [total neutral pressure](name:total_neutral_pressure) only when the channel set
    spans the neutral mixture and cross-sensitivities or unresolved overlaps have
    been treated consistently. If fragments, isobars, or isotopologues are not deconvolved,
    a channel pressure is a calibrated pressure equivalent for that channel rather
    than an additive thermodynamic partial pressure of a single species.


    Typical values are strongly dependent on sampling location and operating state.
    Calibrated channel pressures in fusion vacuum and exhaust measurements can span
    many decades, from about $10^{-8}$ Pa in clean high-vacuum residual-gas conditions
    to $10^{-1}$-$10^1$ Pa in exhaust-line, fueling, or pumping transients; values
    outside these illustrative ranges can be valid when covered by calibration.'
  unit: Pa
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:pressure_of_mass_spectrometer_channel
  - name:ion_current_of_mass_spectrometer_channel
  sources:
  - id: dd:spectrometer_mass/channel/pressure_partial
    dd_path: spectrometer_mass/channel/pressure_partial
    status: composed
- name: parallel_heat_flux
  kind: scalar
  status: draft
  description: Power per unit area transported along the local magnetic field direction,
    quantifying the dominant energy exhaust channel in the scrape-off layer and at
    plasma-facing surfaces.
  documentation: "The parallel heat flux $q_\\parallel$ is the component of the heat\
    \ flux vector aligned with the local magnetic field, representing the primary\
    \ energy transport mechanism in the scrape-off layer (SOL) where conduction along\
    \ field lines exceeds cross-field transport by orders of magnitude.\n\nIn Langmuir\
    \ probe diagnostics, $q_\\parallel$ is inferred from the sheath energy balance:\n\
    \n$$\nq_\\parallel = \\gamma_\\mathrm{sh} \\, \\frac{k_B T_e}{e} \\, j_\\mathrm{sat}\n\
    $$\n\nwhere $j_\\mathrm{sat}$ is the [ion saturation current density](name:ion_saturated_current_density),\
    \ $T_e$ is the local [electron temperature at the wall](name:electron_temperature_at_wall),\
    \ $\\gamma_\\mathrm{sh} \\approx 5$\u2013$8$ is the dimensionless sheath heat\
    \ transmission coefficient accounting for both ion and electron energy channels,\
    \ $k_B$ is Boltzmann's constant, and $e$ is the elementary charge.\n\nMeasurements\
    \ are performed using probes embedded in plasma-facing components such as divertor\
    \ tiles and limiters, or on reciprocating drives that plunge into the SOL. Accurate\
    \ conversion from raw probe signals to heat flux requires both the [effective\
    \ probe collection area](name:effective_area_of_langmuir_probe) and the local\
    \ magnetic field incidence angle described by angle_of_langmuir_probe.\n\nTypical\
    \ values in current tokamak SOLs range from 1\u2013100 MW m$^{-2}$, with peak\
    \ loads near the divertor strike points posing a primary challenge for plasma-facing\
    \ component design and lifetime.\n\nSign convention: Positive when heat flows\
    \ in the direction of the magnetic field unit vector $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$ at the probe position."
  unit: W.m^-2
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:ion_saturated_current_density
  - name:electron_temperature_at_wall
  - name:effective_area_of_langmuir_probe
