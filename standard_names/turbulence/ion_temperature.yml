name: ion_temperature
description: Thermal energy of the bulk ion population expressed as a temperature,
  $T_i = 2 \langle E_i \rangle / (3 k_B)$, typically averaged over charge states.
documentation: The ion temperature $T_i$ characterizes the thermal spread of the ion
  velocity distribution, assumed Maxwellian, and enters the ion pressure via $p_i
  = n_i k_B T_i$, where $n_i$ is the ion number density (m$^{-3}$) and $k_B$ is the
  Boltzmann constant. When multiple ion species or charge states are present, $T_i$
  often represents a density-weighted average across species. Core $T_i$ is measured
  by charge-exchange recombination spectroscopy (CXRS), neutron emission rates (for
  D-T plasmas), and X-ray crystal spectroscopy; edge values are accessible via retarding-field
  energy analyzers and Langmuir probes. Typical core values range from 1–25 keV in
  tokamak H-mode plasmas, with $T_i / T_e \approx 0.5$–$1.5$ depending on heating
  scheme; ion-heated scenarios (e.g., NBI-dominated) tend toward $T_i > T_e$. The
  ratio $T_i / T_e$ strongly influences the ion-temperature-gradient (ITG) turbulence
  threshold and confinement scaling. See `electron_temperature` for the electron counterpart
  and `electron_density` for the companion density profile.
kind: scalar
unit: eV
