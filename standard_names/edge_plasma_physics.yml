- name: parallel_current_density_due_to_heat_viscosity
  kind: scalar
  status: active
  description: Parallel component of the electric current density generated by heat-viscosity
    terms in a collisional magnetized-plasma fluid closure, projected along the local
    magnetic-field direction.
  documentation: 'The parallel heat-viscosity current density is the field-aligned
    component of the electric current density generated when heat-viscosity terms
    in a collisional magnetized-plasma fluid closure drive net charge transport. It
    is the parallel projection of the parent [heat-viscosity current density](name:current_density_due_to_heat_viscosity).


    The defining projection is


    $$

    j_{\mathrm{hv},\parallel}=\mathbf{j}_{\mathrm{hv}}\cdot\mathbf{b}, \qquad \mathbf{b}=\frac{\mathbf{B}}{|\mathbf{B}|}

    $$


    where $\mathbf{j}_{\mathrm{hv}}$ is the heat-viscosity current-density vector,
    $\mathbf{B}$ is the local magnetic-field vector, $|\mathbf{B}|$ is its magnitude,
    and $\mathbf{b}$ is the corresponding unit vector.


    This quantity includes only the heat-viscosity mechanism and field-aligned projection;
    [parallel current density due to parallel viscosity](name:parallel_current_density_due_to_parallel_viscosity)
    represents a distinct viscosity contribution.


    Sign convention: Positive when the heat-viscosity current density points along
    the local magnetic-field direction $\mathbf{B}$.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_heat_viscosity
  - name:parallel_current_density_due_to_parallel_viscosity
