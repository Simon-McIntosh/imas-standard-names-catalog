- name: toroidal_total_plasma_momentum_at_pedestal
  kind: scalar
  status: draft
  description: Total angular momentum of the thermal plasma in the geometric toroidal
    direction at the top of the H-mode edge pedestal.
  documentation: 'The total toroidal plasma momentum $L_\phi = \int m_i n_i v_\phi
    \, dV$ summed over all ion species and electrons, evaluated at the radial location
    of the pedestal top near the last closed flux surface. This quantity sets the
    lower boundary condition for core toroidal rotation and is a key input to transport
    modeling of momentum confinement in H-mode plasmas, where the steep edge pressure
    gradient drives strong $E\times B$ shear affecting turbulent transport. It is
    typically inferred from charge-exchange recombination spectroscopy measurements
    of main-ion toroidal rotation combined with density and temperature profiles from
    Thomson scattering or neutral particle analysis. The sign matches that of the
    toroidal rotation velocity of the bulk plasma in the direction of increasing toroidal
    angle $\phi$.


    Sign convention: Positive when the net toroidal angular momentum is aligned with
    the direction of increasing toroidal angle $\phi$.


    Sibling quantities at other radial locations include [toroidal_total_plasma_momentum_at_magnetic_axis](name:toroidal_total_plasma_momentum_at_magnetic_axis)
    and [toroidal_total_plasma_momentum_at_separatrix](name:toroidal_total_plasma_momentum_at_separatrix),
    which together define the radial momentum profile. The corresponding fuel-ion
    velocity in the same region is given by [deuterium_tritium_velocity_at_pedestal](name:deuterium_tritium_velocity_at_pedestal).'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum_at_magnetic_axis
  - name:toroidal_total_plasma_momentum_at_separatrix
  - name:deuterium_tritium_velocity_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/momentum_tor/value
    dd_path: summary/local/pedestal/momentum_tor/value
    status: composed
- name: toroidal_total_plasma_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the mass-center velocity of the total plasma,
    representing the bulk plasma rotation in the direction of the toroidal angle.
  documentation: "The toroidal total plasma velocity $v_{\\phi, \\mathrm{plasma}}$\
    \ is the projection of the mass-center velocity vector $\\mathbf{v}_{\\mathrm{plasma}}$\
    \ onto the geometric toroidal direction $\\hat{\\phi}$. In a multi-species plasma\
    \ it is defined as $\\mathbf{v}_{\\mathrm{plasma}} = \\sum_s n_s m_s \\mathbf{v}_s\
    \ \\, / \\, \\sum_s n_s m_s$, where $n_s$ is the density, $m_s$ the mass, and\
    \ $\\mathbf{v}_s$ the velocity of species $s$. This component dominates the mechanical\
    \ rotation in tokamaks and is routinely measured by charge exchange recombination\
    \ spectroscopy (CXRS) from the Doppler shift of impurity emission lines. Typical\
    \ core values reach 30\u2013300 km/s in neutral-beam-heated H-mode plasmas, decreasing\
    \ to near-zero at the separatrix. The perpendicular viscosity and radial electric\
    \ field drive changes in the toroidal rotation profile, which couples to the $E\
    \ \\times B$ shear that regulates edge turbulence. See also [radial_total_plasma_velocity](name:radial_total_plasma_velocity),\
    \ [toroidal_ion_velocity](name:toroidal_ion_velocity), and the parent [total_plasma_velocity](name:total_plasma_velocity).\n\
    \nSign convention: Positive when $v_{\\phi, \\mathrm{plasma}}$ points in the direction\
    \ of increasing toroidal angle $\\phi$ (counter-clockwise when viewed from above\
    \ the machine)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_total_plasma_velocity
  - name:toroidal_ion_velocity
  - name:total_plasma_velocity
  arguments:
  - name: total_plasma_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/momentum/v/toroidal
    dd_path: edge_transport/model/ggd/momentum/v/toroidal
    status: composed
- name: toroidal_tungsten_velocity_at_pedestal
  kind: scalar
  status: draft
  description: Toroidal velocity of tungsten impurity ions in the pedestal region,
    representing the bulk toroidal rotation velocity of the tungsten impurity species
    specifically at the top of the edge transport barrier.
  documentation: "The toroidal velocity of tungsten impurity ions in the pedestal\
    \ region of a tokamak, representing the bulk toroidal rotation velocity of the\
    \ tungsten impurity species at the top of the edge transport barrier (pedestal\
    \ top). This velocity is typically inferred from charge exchange recombination\
    \ spectroscopy (CXRS) measurements of tungsten line emission (e.g., W XLV at 6.0\
    \ nm) viewed along multiple toroidal chords in the IMAS right-handed cylindrical\
    \ frame $(R, \\phi, Z)$. The measurement employs a beam-based technique: a neutral\
    \ beam injection (NBI) heating source provides a fast neutral particle beam that\
    \ undergoes charge exchange reactions with tungsten impurity ions, producing a\
    \ characteristic line spectrum. The Doppler shift of this emission (typically\
    \ 0.1-0.5 nm for W XLV at 6.0 nm) yields the projection of the tungsten velocity\
    \ along the line-of-sight, which is then tomographically inverted to recover the\
    \ toroidal component. In H-mode plasmas, pedestal toroidal rotation exhibits strong\
    \ shear and can reach values of 20-150 km/s, with tungsten accumulating preferentially\
    \ at the pedestal top where the impurity confinement time is longest. The velocity\
    \ is defined as $v_{\\phi, \\mathrm{W}} = \\frac{d\\phi}{dt} R$, where $\\phi$\
    \ is the toroidal angle in radians and $R$ is the major radius in meters, evaluated\
    \ at the pedestal top location. The measurement resolution is typically 10-20\
    \ ms temporally and 1-3 cm radially in the pedestal region, with an accuracy of\
    \ 10-20 km/s depending on signal intensity and passive emission subtraction.\n\
    \nSign convention: Positive when the velocity points in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above the +Z axis),\
    \ consistent with the right-handed $\\hat{R} \\times \\hat{\\phi} = \\hat{Z}$\
    \ orientation of the IMAS cylindrical coordinate system.\n\nTypical values: In\
    \ the pedestal region of ITER baseline plasmas, the tungsten toroidal velocity\
    \ ranges from 20 to 150 km/s in the co-current direction for L-mode and low-confinement\
    \ H-mode, but can become sub-sonic (c_s ~ 500-1000 km/s) for ELM-free or high-density\
    \ regimes. The radial gradient of toroidal rotation (shear) typically exceeds\
    \ 1 km/s/cm in narrow pedestal widths (1-5 cm), which is critical for impurity\
    \ transport suppression. The measurement uncertainty dominated by photon statistics\
    \ (typically 5-10% at 50 ms integration) and by uncertainties in the geometric\
    \ projection factor (sin(\u03B8) from line-of-sight to toroidal)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_tungsten_velocity_at_separatrix
  - name:toroidal_tungsten_velocity_at_magnetic_axis
  sources:
  - id: dd:summary/local/pedestal/velocity_phi/tungsten/value
    dd_path: summary/local/pedestal/velocity_phi/tungsten/value
    status: composed
- name: toroidal_tungsten_velocity_at_separatrix
  kind: scalar
  status: draft
  description: Toroidal velocity of tungsten impurity ions at the separatrix, the
    outermost closed flux surface.
  documentation: 'The toroidal velocity $v_{\phi,\mathrm{W}}$ of tungsten ions at
    the separatrix quantifies the rotation of a high-Z impurity species at the plasma
    boundary. In magnetically confined plasmas, tungsten is a common wall material
    whose ions, if they penetrate the core, can cause significant radiative losses;
    the toroidal velocity at the separatrix determines the influx, screening, and
    eventual transport of these impurities through the pedestal. This velocity is
    measured using charge-exchange recombination spectroscopy (CXRS) on visible or
    ultraviolet tungsten emission lines, analyzing the Doppler shift of the spectral
    lines relative to a cold reference. Typical velocities in the edge region of H-mode
    tokamaks range from a few km/s to several tens of km/s, depending on the plasma
    rotation state and the direction of neutral beam injection. The quantity is closely
    related to the tungsten velocity at the pedestal and at the magnetic axis, which
    together characterize the full radial rotation profile.


    Sign convention: Positive when $\mathbf{v} \cdot \hat{\phi} > 0$, i.e., when the
    toroidal component points in the direction of increasing toroidal angle $\phi$
    (counter-clockwise when viewed from above).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - id: dd:summary/local/separatrix/velocity_phi/tungsten/value
    dd_path: summary/local/separatrix/velocity_phi/tungsten/value
    status: composed
- name: total_ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Energy diffusion coefficient characterizing the cross-field radial
    transport of thermal energy for the total ion population, summed over all charge
    states and thermal species.
  documentation: 'The total ion energy diffusivity, $\chi_i^{\mathrm{total}}$, is
    a scalar transport coefficient used in Fick-type flux-gradient closures to model
    radial ion heat transport: $Q_i = -n_i \chi_i^{\mathrm{total}} \nabla T_i$, where
    $Q_i$ is the radial ion energy flux, $n_i$ the total ion density, and $T_i$ the
    ion temperature. As a ''total'' diffusivity, it encompasses the combined effect
    of all ion species (e.g., deuterium, tritium, helium-4) and thermal populations,
    without resolving individual charge states. Typical edge values range from $10^{-2}\,\mathrm{m^2\,s^{-1}}$
    in the steep-gradient pedestal region to $10^{0}\,\mathrm{m^2\,s^{-1}}$ in the
    scrape-off layer, depending on turbulent transport levels. It is inferred from
    transport modeling constrained by measured [ion energy diffusivity](name:ion_energy_diffusivity)
    profiles and edge diagnostics such as charge exchange recombination spectroscopy,
    or extracted from gyrokinetic turbulence simulations. The quantity complements
    [radial_total_ion_energy_flux](name:radial_total_ion_energy_flux) in the transport
    closure and is related to the [radial_ion_momentum_diffusion_coefficient](name:radial_ion_momentum_diffusion_coefficient)
    via turbulent Prandtl numbers. Note that this diffusivity is for the total ion
    population, distinct from resolved charge-state diffusivities such as [ion_state_energy_diffusivity](name:ion_state_energy_diffusivity).'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_energy_diffusivity
  - name:radial_total_ion_energy_flux
  - name:radial_ion_momentum_diffusion_coefficient
  - name:ion_state_energy_diffusivity
  sources:
  - id: dd:edge_transport/model/ggd/total_ion_energy/d/values
    dd_path: edge_transport/model/ggd/total_ion_energy/d/values
    status: composed
- name: tritium_density_at_limiter
  kind: scalar
  status: draft
  description: Tritium ion number density at the limiter surface, representing the
    local fuel ion concentration in the scrape-off layer.
  documentation: "The tritium ion number density $n_{\\mathrm{T}^+}$ at the limiter\
    \ defines the local particle concentration of fuel ions at the plasma-facing limiter\
    \ surface. This quantity is a key boundary condition for edge plasma transport\
    \ and determines the incident ion flux onto the limiter via $\\Gamma_{\\mathrm{T}^+}\
    \ = n_{\\mathrm{T}^+} v_{\\parallel}$ where $v_{\\parallel}$ is the parallel flow\
    \ velocity. Typical values in the limiter shadow range from $10^{17}$ to $10^{19}\\\
    ,\\mathrm{m}^{-3}$ in tokamak scrape-off layers, depending on upstream density\
    \ and SOL collisionality. It is inferred from Langmuir probe measurements or spectroscopic\
    \ line emission of tritium Balmer-\u03B1 transitions, and is closely related to\
    \ [tritium_density_at_separatrix](name:tritium_density_at_separatrix) and [tritium_density_at_pedestal](name:tritium_density_at_pedestal).\n\
    \nSign convention: Positive when the tritium ion number density is measured as\
    \ an absolute (non-negative) volume density.\n\nThe density at the limiter establishes\
    \ the plasma contact with the material surface and influences erosion, redeposition,\
    \ and tritium retention. It is also linked to the electron density via quasi-neutrality\
    \ and to the [electron_density_at_separatrix](name:electron_density_at_separatrix)\
    \ for SOL particle balance assessments."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:tritium_density_at_separatrix
  - name:tritium_density_at_pedestal
  - name:electron_density_at_separatrix
  sources:
  - id: dd:summary/local/limiter/n_i/tritium/value
    dd_path: summary/local/limiter/n_i/tritium/value
    status: composed
- name: tritium_density_at_separatrix
  kind: scalar
  status: draft
  description: Number density of thermal tritium ions at the separatrix, the outermost
    closed flux surface of the confined plasma.
  documentation: 'The tritium ion density at the separatrix $n_{\mathrm{T}}(\psi_{\mathrm{sep}})$
    establishes the boundary condition for the core density profile and directly determines
    the D-T fusion reaction rate in the pedestal region via $R_{\mathrm{DT}} = n_{\mathrm{D}}
    n_{\mathrm{T}} \langle \sigma v \rangle_{\mathrm{DT}}$. This quantity is routinely
    inferred from charge-exchange recombination spectroscopy (CXRS) on tritium emission
    lines or from equilibrium reconstruction combined with Thomson-scattering measurements
    of electron density and impurity concentrations. Typical separatrix tritium densities
    range from $1\times10^{18}$ to $1\times10^{19}\,\mathrm{m}^{-3}$ in H-mode tokamaks,
    an order of magnitude below core values due to steep pedestal gradients. The ratio
    of tritium to deuterium density at the separatrix is a key actuator for fuel-ratio
    control and determines the tritium exhaust rate via the divertor pumping system.


    Sign convention: Positive when the tritium ion density is defined as a positive-definite
    scalar number density.


    See also [tritium_density_at_pedestal](name:tritium_density_at_pedestal) for the
    density at the pedestal top, [tritium_density_at_divertor_target](name:tritium_density_at_divertor_target)
    for the incident divertor flux, and [tritium_density_at_internal_transport_barrier](name:tritium_density_at_internal_transport_barrier)
    for ITB applications.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:tritium_density_at_pedestal
  - name:tritium_density_at_divertor_target
  - name:tritium_density_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/separatrix/n_i/tritium/value
    dd_path: summary/local/separatrix/n_i/tritium/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/tritium/value
    dd_path: summary/local/separatrix_average/n_i/tritium/value
    status: composed
- name: vertical_conductivity
  kind: scalar
  status: draft
  description: Vertical component of the electrical conductivity tensor in the edge
    plasma, describing current flow along the machine height (Z) axis.
  documentation: "The vertical conductivity quantifies the plasma's ability to conduct\
    \ current in the $\\hat{Z}$ direction, perpendicular to both the radial and toroidal\
    \ axes in the IMAS cylindrical $(R, \\phi, Z)$ frame. It is one component of the\
    \ full conductivity tensor $\\sigma_{ij}$, which in magnetized plasmas is strongly\
    \ anisotropic \u2014 parallel (field-aligned) conductivity is orders of magnitude\
    \ larger than perpendicular components. This component is relevant for edge transport\
    \ models that resolve poloidal asymmetries or vertical current paths, for example\
    \ in the scrape-off layer where magnetic field lines intersect divertor targets\
    \ at a finite poloidal angle. The vertical conductivity typically follows a similar\
    \ scaling to the radial (cross-field) component, governed by electron-ion collisions\
    \ through the Spitzer conductivity, but projected onto the vertical direction.\
    \ Its magnitude is comparable to the poloidal conductivity component $[\\texttt{poloidal\\\
    _conductivity}](name:poloidal\\_conductivity)$, and together with the toroidal\
    \ component $[\\texttt{toroidal\\_conductivity}](name:toroidal\\_conductivity)$\
    \ they complete the tensor description referenced by the parent $[\\texttt{conductivity}](name:conductivity)$\
    \ entry. Typical values in the edge plasma are in the range $10^1$\u2013$10^3\
    \ \\, \\Omega^{-1}\\text{m}^{-1}$, several orders of magnitude below the parallel\
    \ conductivity due to the magnetic field's suppression of cross-field transport.\
    \ The sign follows the right-handed cylindrical coordinate convention: positive\
    \ current corresponds to flow in the $+\\hat{Z}$ direction."
  unit: m^-1.ohm^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal
  - name:toroidal
  - name:conductivity
  arguments:
  - name: conductivity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/conductivity/z
    dd_path: edge_transport/model/ggd/conductivity/z
    status: composed
- name: vertical_ion_momentum_diffusivity
  kind: scalar
  status: draft
  description: Vertical component of the ion momentum diffusivity tensor, quantifying
    the diffusive radial transport of toroidal angular momentum due to vertical gradients
    in the ion flow velocity.
  documentation: "The vertical momentum diffusivity $\tilde{\\chi}_{\\phi,Z}^{(i)}$\
    \ is the $Z$-component of the ion momentum diffusivity tensor $\\chi^{(i)}_{\\\
    phi}$, where $\\phi$ denotes the toroidal momentum direction. It relates the vertical\
    \ gradient of the ion toroidal rotation velocity $v_{\\phi,i}$ to the resulting\
    \ diffusive momentum flux via $\\Gamma^{(i)}_{\\phi,Z} = -\\tilde{\\chi}_{\\phi,Z}^{(i)}\
    \ \\, \\partial v_{\\phi,i}/\\partial Z$. This component captures momentum transport\
    \ driven by vertical flow shear, which can be significant in the edge pedestal\
    \ region where strong $Z$-gradients develop. The quantity is resolved on the unstructured\
    \ GGD mesh and provides the $Z$-axis contribution to the full scalar [ion_momentum_diffusivity](name:ion_momentum_diffusivity).\
    \ Typical values in the edge range $10^{-1}$\u2013$10^{1}$ m$^2$s$^{-1}$, comparable\
    \ in magnitude to the radial component in high-confinement regimes. Related components\
    \ include [vertical_neutral_momentum_diffusivity](name:vertical_neutral_momentum_diffusivity)\
    \ and [vertical_momentum_diffusivity](name:vertical_momentum_diffusivity).\n\n\
    Sign convention: Positive for diffusive transport directed down the vertical gradient\
    \ of the ion toroidal velocity."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_diffusivity
  - name:vertical_neutral_momentum_diffusivity
  - name:vertical_momentum_diffusivity
  arguments:
  - name: ion_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: vertical
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/momentum/d/z
    dd_path: edge_transport/model/ggd/ion/momentum/d/z
    status: composed
  - id: dd:edge_transport/model/ggd/ion/state/momentum/d/z
    dd_path: edge_transport/model/ggd/ion/state/momentum/d/z
    status: composed
- name: vertical_neutral_momentum_diffusivity
  kind: scalar
  status: draft
  description: Vertical component of the momentum diffusivity for neutral particles,
    resolved in the cylindrical $(R, \phi, Z)$ frame.
  documentation: The vertical momentum diffusivity $D_{n,Z}$ characterizes cross-field
    transport of neutral particle momentum along the machine height axis $Z$, arising
    from charge-exchange and elastic collisions with the background plasma. It is
    the vertical component of the vector $[\mathbf{D}_n]_{Z} = D_{n,Z}$ which together
    with the toroidal component $[\mathbf{D}_n]_{\phi}$ forms the full neutral momentum
    diffusivity vector [neutral_momentum_diffusivity](name:neutral_momentum_diffusivity).
    Typical values in the edge plasma range $1\!-\!100$ m$^2$s$^{-1}$, increasing
    with neutral pressure and decreasing with plasma density. This coefficient is
    inferred from kinetic neutral transport codes (EIRENE, DEGAS 2) or from fluid-edge
    modeling constrained by spectroscopic measurements of neutral penetration and
    momentum damping. See also [vertical_ion_momentum_diffusivity](name:vertical_ion_momentum_diffusivity)
    for the analogous ion quantity and [toroidal_neutral_momentum_diffusivity](name:toroidal_neutral_momentum_diffusivity)
    for the orthogonal component.
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_momentum_diffusivity
  - name:vertical_ion_momentum_diffusivity
  - name:toroidal_neutral_momentum_diffusivity
  arguments:
  - name: neutral_momentum_diffusivity
