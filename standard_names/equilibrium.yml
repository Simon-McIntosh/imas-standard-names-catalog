      kind: llm
- name: safety_factor_at_magnetic_axis
  kind: scalar
  status: active
  description: Limiting signed field-line winding number on the innermost closed flux
    surface, giving toroidal turns per poloidal circuit at the magnetic axis.
  documentation: 'The safety factor at the magnetic axis is the limiting signed field-line
    winding number as nested closed magnetic flux surfaces contract toward the magnetic
    axis. It gives the toroidal transits per complete poloidal circuit in that limit.


    The axis value is defined by


    $$

    q_{\rm axis} = \lim_{\psi \to \psi_{\rm axis}} q(\psi)

    $$


    where $q_{\rm axis}$ is the safety factor at the magnetic axis, $q(\psi)$ is the
    safety factor on the flux surface labeled by $\psi$, and $\psi_{\rm axis}$ is
    the value of that flux-surface label at the magnetic axis.


    This quantity applies only to the magnetic-axis limit of nested closed flux surfaces
    in an equilibrium. It is a single equilibrium winding value with no species, population,
    or charge-state aggregation, and it is distinct from safety factor values on finite-radius
    surfaces such as the [safety factor at the plasma boundary](name:safety_factor_at_plasma_boundary).


    It is the magnetic-axis specialization of the [safety factor](name:safety_factor):
    the parent quantity describes field-line winding as a function of flux-surface
    label, while this quantity selects its limiting value at $\psi_{\rm axis}$. The
    parent relation is the signed flux-increment ratio $q = d\Phi_{\rm tor}/(d\Phi_{\rm
    pol}/2\pi)$, where $\Phi_{\rm tor}$ is toroidal magnetic flux and $\Phi_{\rm pol}$
    is poloidal magnetic flux.


    Sign convention: Positive when the toroidal magnetic-flux increment $d\Phi_{\rm
    tor}$ and poloidal magnetic-flux increment $d\Phi_{\rm pol}$ have the same sign
    for the positively oriented field-line circuit, with $\phi$ increasing in the
    right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$
    is toroidal angle, and $Z$ is vertical height.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_plasma_boundary
  - name:safety_factor
  arguments:
  - name: safety_factor
    operator: magnetic_axis
    operator_kind: locus
  sources:
