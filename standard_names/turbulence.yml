- name: gyrokinetic_magnetic_shear
  kind: scalar
  status: draft
  description: Dimensionless magnetic shear at the outboard midplane normalized radius,
    used to parameterize the parallel variation of the safety factor in local gyrokinetic
    flux-tube simulations.
  documentation: 'The gyrokinetic magnetic shear quantifies the radial gradient of
    the safety factor $q$ relative to a local flux-surface minor radius $r$, defined
    as $\hat{s} = (r/q)\,dq/dr$ for a given reference flux surface. It controls the
    ballooning-mode structure and is a key stability parameter for drift-wave microinstabilities,
    with typical values ranging from $\hat{s} \approx 0.5$ (weak shear) to $\hat{s}
    \approx 3$ (strong shear) in tokamak core plasmas. This quantity is extracted
    from the equilibrium reconstruction at the outboard midplane position where the
    local minor radius $r$ is measured, and it is used as an input to gyrokinetic
    codes to set the flux-surface geometry. The definition follows the standard local-shear
    convention, which differs from the equilibrium IDS magnetic shear (defined with
    the normalized toroidal flux coordinate).


    Sign convention: Positive when the safety factor increases with minor radius.


    Related quantities include [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis)
    and [magnetic_shear_at_separatrix](name:magnetic_shear_at_separatrix), which evaluate
    the local magnetic shear at specific radial positions.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_separatrix
  sources:
  - id: dd:gyrokinetics_local/flux_surface/magnetic_shear_r_minor
    dd_path: gyrokinetics_local/flux_surface/magnetic_shear_r_minor
    status: composed
- name: lower_triangularity_of_flux_surface
  kind: scalar
  status: draft
  description: Dimensionless shaping parameter quantifying the D-shaped asymmetry
    of the lower half of a tokamak flux surface.
  documentation: 'The lower triangularity $\delta_{\text{lower}} = (R_{\text{lower}}
    - R_{\text{geo}}) / a$ measures the radial shift of the flux surface midpoint
    at the lower midplane relative to the geometric center, normalized by the minor
    radius $a$. This parameter characterizes the bean-shaped distortion of the plasma
    cross-section and influences magnetohydrodynamic stability and confinement. In
    local gyrokinetic simulations using Miller parametrization, $\delta_{\text{lower}}$
    together with the flux surface elongation and the radial shape derivatives defines
    the magnetic geometry at a given flux surface. Typical values for conventional
    tokamaks range from $\delta_{\text{lower}} \approx 0.1$ to $0.5$ for strongly
    shaped plasmas, with the separatrix value usually larger than interior surfaces.


    Sign convention: Positive when the flux surface midpoint is shifted radially inward
    at the lower midplane, corresponding to a D-shaped cross-section.


    The lower triangularity complements the upper triangularity; together they describe
    the vertical asymmetry of the flux surface shape, linked to [upper_triangularity_of_flux_surface](name:upper_triangularity_of_flux_surface)
    and [elongation_of_flux_surface](name:elongation_of_flux_surface).'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:upper_triangularity_of_flux_surface
  - name:elongation_of_flux_surface
  sources:
  - id: dd:gyrokinetics/flux_surface/triangularity_lower
    dd_path: gyrokinetics/flux_surface/triangularity_lower
    status: composed
- name: normalized_debye_length
  kind: scalar
  status: draft
  description: Debye length normalized to a reference value, setting the spatial scale
    for gyrokinetic simulations and indicating the strength of electrostatic screening.
  documentation: The normalized Debye length is defined as $\lambda_D / \lambda_{D,ref}$,
    where $\lambda_D = \sqrt{\epsilon_0 T_e / n_e e^2}$ is the electron Debye length
    and $\lambda_{D,ref}$ is a reference Debye length from the gyrokinetic normalization
    scheme. A value much less than 1 indicates strong electrostatic screening relative
    to the reference scale, justifying the quasi-neutrality approximation in the simulation.
    Typical values in the turbulent core of tokamak plasmas range from $10^{-5}$ to
    $10^{-3}$.
  unit: '1'
  physics_domain: turbulence
  links:
  - name:energy_flux
  sources:
  - id: dd:gyrokinetics/species_all/debye_length_reference
    dd_path: gyrokinetics/species_all/debye_length_reference
    status: composed
  - id: dd:gyrokinetics_local/species_all/debye_length_norm
    dd_path: gyrokinetics_local/species_all/debye_length_norm
    status: composed
- name: normalized_temperature
  kind: scalar
  status: draft
  description: Temperature of a gyrokinetic particle species normalized to a reference
    temperature for the simulation.
  documentation: 'The normalized temperature $T/T_{\mathrm{ref}}$ scales the species
    temperature by the reference temperature $T_{\mathrm{ref}}$ that defines the simulation''s
    thermal energy scale. In local gyrokinetic flux-tube simulations this dimensionless
    ratio, together with [normalized_density](name:normalized_density) and [normalized_mass](name:normalized_mass),
    defines the species input parameters for the linearized collision operator and
    the background Maxwellian. The reference temperature is typically the on-axis
    or volume-averaged electron temperature; typical values for a deuterium main-ion
    species are $T/T_{\mathrm{ref}} = 1$ when the species temperature is set equal
    to the reference.


    Sign convention: Positive when the species temperature exceeds the reference temperature.


    The combination of normalized temperature with [normalized_density](name:normalized_density)
    and [normalized_mass](name:normalized_mass) determines the species pressure ratio
    and the diamagnetic drift frequencies that drive microinstabilities.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_density
  - name:normalized_mass
  sources:
  - id: dd:gyrokinetics/species/temperature_norm
    dd_path: gyrokinetics/species/temperature_norm
    status: composed
  - id: dd:gyrokinetics_local/species/temperature_norm
    dd_path: gyrokinetics_local/species/temperature_norm
    status: composed
- name: parallel_gyrocenter_energy
  kind: scalar
  status: draft
  description: Normalized velocity-space moment of the perturbed gyrocenter distribution
    function, integrating the product of the parallel kinetic energy and the perpendicular
    kinetic energy.
  documentation: "The parallel gyrocenter energy moment $\\langle \frac{1}{2} m v_\t\
    ext{par}^2 \rangle_\text{gc}$ is the gyrocenter energy component along the magnetic\
    \ field direction, defined as the velocity-space integral of $\frac{1}{2} m v_\t\
    ext{par}^2 f_\text{gc}$ normalized to the reference density and temperature scale.\
    \ Together with the perpendicular gyrocenter energy, which is the integral of\
    \ $\frac{1}{2} m v_\text{perp}^2 f_\text{gc}$, it composes the total gyrocenter\
    \ energy vector $[\\text{gyrocenter\\_energy}](name:gyrocenter_energy)$. This\
    \ moment quantifies the parallel kinetic energy stored in the perturbed distribution\
    \ for a linear eigenmode, and its ratio to the perpendicular moment informs the\
    \ anisotropy of the fluctuation energy in gyrokinetic turbulence simulations.\
    \ Typical values for core microturbulence are order unity when normalized, reflecting\
    \ near-equipartition between parallel and perpendicular energy in electrostatic\
    \ instabilities. The sign convention is set by the gyrocenter distribution moment\
    \ definition: $\\langle \\frac{1}{2} m v_\\text{par}^2 \\rangle_\\text{gc} = \\\
    int \\frac{1}{2} m v_\\text{par}^2 \\, f_\\text{gc} \\, d^3 v$, where the moment\
    \ is positive for any positive $f_\\text{gc}$.\n\nSign convention: Positive when\
    \ the perturbed gyrocenter distribution function is non-negative over the velocity-space\
    \ volume.\n\nSee also the perpendicular counterpart $[\\text{perpendicular\\_gyrocenter\\\
    _energy}](name:perpendicular_gyrocenter_energy)$ for the complementary component,\
    \ and note that the sum of these two moments gives the total $[\\text{gyrocenter\\\
    _energy}](name:gyrocenter_energy)$ per mode."
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_energy
  - name:perpendicular_gyrocenter_energy
  arguments:
  - name: gyrocenter_energy
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/v_parallel_energy_perpendicular_gyroav
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/v_parallel_energy_perpendicular_gyroav
    status: attached
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/v_parallel_energy_perpendicular
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_gyrocenter/v_parallel_energy_perpendicular
    status: composed
- name: perpendicular_gyrocenter_energy
  kind: scalar
  status: draft
  description: Normalized perpendicular kinetic energy moment of the perturbed gyrocenter
    distribution for a linear gyrokinetic eigenmode.
  documentation: 'This quantity is the normalized perpendicular gyrocenter energy,
    computed as the velocity-space moment $\int \frac{1}{2} m v_\perp^2 \, \delta
    f_g \, J_1(k_\perp \rho_g) \, d^3\mathbf{v}$, where $\delta f_g$ is the perturbed
    gyrocenter distribution, $J_1$ is the first-order Bessel function with argument
    $k_\perp \rho_g$, $m$ is the species mass, and $v_\perp$ is the speed perpendicular
    to the magnetic field. It represents the second component of the two-component
    vector `[gyrocenter_energy](name:gyrocenter_energy)`. This moment quantifies how
    the perturbed distribution transfers energy into perpendicular gyromotion, and
    is typically evaluated for each complex eigenmode in local gyrokinetic simulations
    at a single wavevector. The perpendicular gyrocenter energy is related to the
    perpendicular pressure through the second moment of the distribution; see `[perpendicular_gyrocenter_pressure](name:perpendicular_gyrocenter_pressure)`.
    Typical values in normalized gyrokinetic units range from $10^{-6}$ to $10^{-1}$
    for low-amplitude linear modes.


    Sign convention: Positive for any perturbed gyrocenter distribution with non-zero
    perpendicular kinetic energy.


    Cross-reference: This scalar is the perpendicular component of `[gyrocenter_energy](name:gyrocenter_energy)`
    and complements `[parallel_gyrocenter_energy](name:parallel_gyrocenter_energy)`.
    It is distinct from the particle-frame quantity `[perpendicular_particle_energy](name:perpendicular_particle_energy)`,
    which does not include the gyroaveraging Bessel factor.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_energy
  - name:perpendicular_gyrocenter_pressure
  - name:parallel_gyrocenter_energy
  - name:perpendicular_particle_energy
  arguments:
  - name: gyrocenter_energy
    operator: component
    operator_kind: projection
    axis: perpendicular
    shape: component
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/v_perpendicular_square_energy_gyroav
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_gyrocenter/v_perpendicular_square_energy_gyroav
