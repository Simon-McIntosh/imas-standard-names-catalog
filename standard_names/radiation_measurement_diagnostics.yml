    enhanced_context:
      description: Line-of-sight projected velocity of cold neutral atoms measured
        via Doppler spectroscopy in a polarization spectroscopy channel. Positive
        values indicate motion from the first to the second point of the line of sight.
      kind: llm
- name: hot_neutral_temperature
  kind: scalar
  status: active
  description: Translational kinetic temperature, expressed as energy per particle,
    of the energetic neutral-atom component in the plasma edge or scrape-off layer.
  documentation: 'Energetic neutral temperature is the translational kinetic temperature
    of the energetic neutral-atom component in the plasma edge or scrape-off layer,
    representing random kinetic energy after removal of mean flow. It is the component-specific
    counterpart of [neutral temperature](name:neutral_temperature) and is distinct
    from the low-energy population described by [cold neutral temperature](name:cold_neutral_temperature).


    For the included energetic neutral states, the density-weighted temperature is
    defined by


    $$

    T_{\mathrm{en}} = \frac{\sum_s m_s \int \left|\mathbf{v}-\mathbf{u}_s\right|^2
    f_s(\mathbf{v})\,d^3v}{3e\sum_s n_s}, \qquad n_s=\int f_s(\mathbf{v})\,d^3v

    $$


    where $T_{\mathrm{en}}$ is the energetic neutral temperature, $s$ indexes the
    included neutral states, $m_s$ is the particle mass, $e$ is the elementary charge,
    $f_s(\mathbf{v})$ is the state velocity distribution, $n_s$ is its number density,
    $\mathbf{v}$ is particle velocity, and $\mathbf{u}_s$ is the state mean velocity.


    Only the energetic neutral-atom component is included; cold neutral atoms and
    populations outside the specified energetic selection are excluded. State contributions
    are combined by number-density weighting rather than equal weighting.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutral_temperature
  - name:cold_neutral_temperature
  arguments:
  - name: neutral_temperature
    operator: hot
    operator_kind: qualifier
  sources:
