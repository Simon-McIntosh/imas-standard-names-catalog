- name: surface_area_of_filter
  kind: scalar
  status: active
  description: Geometric area of the actual filter-window surface that intercepts
    or transmits incoming radiation, including surface curvature rather than only
    its projected aperture.
  documentation: 'The filter-window surface area is the geometric area of the actual
    material surface associated with a radiation filter and participating in interception
    or transmission of incoming radiation. It is the window-specific component of
    the parent [filter area](name:area_of_filter).


    The area is defined by integrating the surface-area element over the filter-window
    surface:


    $$

    A_w = \int_{S_w} dS

    $$


    where $A_w$ is the filter-window area, $S_w$ is the actual window surface, and
    $dS$ is an infinitesimal surface-area element.


    This quantity includes curvature of the material surface and excludes a planar
    projected aperture area or areas belonging to other filter components.'
  unit: m^2
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:area_of_filter
