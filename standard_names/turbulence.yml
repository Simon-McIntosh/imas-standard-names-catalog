- name: normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Gyrobohm-normalized turbulent energy flux driven by the perturbed parallel
    electromagnetic vector potential $\delta A_\parallel$, summed over the wavevector
    spectrum in a nonlinear gyrokinetic simulation.
  documentation: 'In electromagnetic gyrokinetic turbulence, the total radial energy
    flux has distinct contributions from the electrostatic channel and the electromagnetic
    channel mediated by the perturbed parallel vector potential $\delta A_\parallel$.
    This quantity captures the latter: the Gyro-Bohm-normalized radial energy flux
    $Q_{A_\parallel} / Q_{\mathrm{gB}}$, where $Q_{A_\parallel}$ is the energy flux
    driven by $\delta A_\parallel$ fluctuations and $Q_{\mathrm{gB}} = n_s T_s v_{\mathrm{th},s}
    (\rho_s/L_s)^2$ is the Gyro-Bohm reference flux ($n_s$ is species density, $T_s$
    is species temperature, $v_{\mathrm{th},s}$ is the thermal velocity, $\rho_s$
    is the Larmor radius, and $L_s$ is the reference gradient length scale). The $\delta
    A_\parallel$ channel arises from the parallel magnetic stress tensor and the $E
    \times B$ advection of the perturbed distribution function weighted by the parallel
    magnetic perturbation; it becomes significant at finite plasma beta where $\delta
    A_\parallel$ fluctuations are not negligible. This electromagnetic contribution
    complements [normalized_energy_flux_due_to_electrostatic_potential](name:normalized_energy_flux_due_to_electrostatic_potential),
    and the analogous particle-flux quantity is [normalized_particle_flux_due_to_perturbed_parallel_vector_potential](name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential).
    Typical magnitudes are small relative to the electrostatic channel at low beta
    but can become comparable at $\beta \sim 1\%$ in tokamak core conditions. Values
    are obtained from nonlinear gyrokinetic codes by integrating the electromagnetic
    energy-flux kernel over the $(k_x, k_y)$ wavevector grid.


    Sign convention: Positive when the normalized energy flux is directed radially
    outward, away from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links:
