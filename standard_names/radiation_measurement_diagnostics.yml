- name: second_local_tangential_coordinate_of_filter
  kind: scalar
  status: active
  description: Second local tangential coordinate of a filter boundary point is the
    signed position of that point along the filter's second in-plane basis direction
    in the object-local planar frame attached to the filter.
  documentation: 'Second local tangential coordinate of a filter boundary point is
    the signed scalar coordinate obtained by projecting the point''s displacement
    from the filter local-frame origin onto the filter''s second local tangential
    direction. It is paired with the [first local tangential coordinate of a filter](name:first_local_tangential_coordinate_of_filter)
    to locate points in the filter plane.


    The coordinate is defined by the projection


    $$

    u_{2,f} = (\mathbf{r} - \mathbf{r}_{0,f}) \cdot \hat{\mathbf{t}}_{2,f}

    $$


    where $u_{2,f}$ is this coordinate, $\mathbf{r}$ is the position vector of the
    filter boundary point, $\mathbf{r}_{0,f}$ is the filter local-frame origin, and
    $\hat{\mathbf{t}}_{2,f}$ is the second local tangential unit vector of the filter.


    The filter local frame is object-local: $\hat{\mathbf{t}}_{1,f}$ and $\hat{\mathbf{t}}_{2,f}$
    lie in the filter plane. The first local tangential unit vector is chosen with
    positive projection along increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame; the second local tangential unit vector completes
    the oriented in-plane basis with the filter normal, so that $\hat{\mathbf{t}}_{1,f}
    \times \hat{\mathbf{t}}_{2,f}$ points along the positive filter normal. This quantity
    refers to the filter boundary itself, not to the [second local tangential coordinate
    of a filter window](name:second_local_tangential_coordinate_of_filter_window).


    Sign convention: Positive when the displacement from the filter local-frame origin
    to the point has positive projection on the second local tangential unit vector
    of the filter.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_filter
  - name:second_local_tangential_coordinate_of_filter_window
  sources:
  - dd_path: soft_x_rays/channel/filter_window/outline/x2
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-filter_window-outline-x2
    dd_documentation:
      leaf: Positions along x2 axis
      parent_path: soft_x_rays/channel/filter_window/outline
      parent: Irregular outline of the filter in the (X1, X2) coordinate system, used
        only if geometry_type/index=1. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - soft_x_rays/channel/filter_window/outline/x1
    enhanced_context:
      description: Positions of the soft X-ray filter window outline vertices along
        the X2 axis in the local (X1, X2) coordinate system. Together with X1 positions,
        defines the irregular boundary shape of the filter window for a soft X-ray
        channel.
      kind: llm
- name: second_local_tangential_coordinate_of_filter_window
  kind: scalar
  status: active
  description: Signed position of a filter-window outline vertex along the second
    local tangential axis, which completes the window-local (X1, X2) frame.
  documentation: 'This quantity is the signed position of a filter-window outline
    vertex projected onto the second local tangential axis. Together with the [first
    local tangential coordinate of the filter window](name:first_local_tangential_coordinate_of_filter_window),
    it specifies the window aperture boundary in the object-local planar $(X_1,X_2)$
    frame.


    The coordinate is defined by


    $$

    x_2 = (\mathbf{r}-\mathbf{r}_0)\mathbin{\cdot}\hat{\mathbf{e}}_2

    $$


    where $\mathbf{r}$ is the outline-vertex position, $\mathbf{r}_0$ is the origin
    of the window-local frame, and $\hat{\mathbf{e}}_2$ is the second local tangential
    unit vector. The vector $\hat{\mathbf{e}}_2$ completes the right-handed window-local
    triad $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$, with $\hat{\mathbf{e}}_1$
    the first local tangential direction and $\hat{\mathbf{e}}_3$ the window-normal
    direction. This quantity describes the filter window rather than the corresponding
    filter boundary, whose analogous coordinate is [second local tangential coordinate
    of the filter](name:second_local_tangential_coordinate_of_filter).


    Sign convention: Positive when the displacement from $\mathbf{r}_0$ points along
    $\hat{\mathbf{e}}_2$.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:first_local_tangential_coordinate_of_filter_window
  - name:second_local_tangential_coordinate_of_filter
  sources:
  - dd_path: camera_x_rays/filter_window/outline/x2
