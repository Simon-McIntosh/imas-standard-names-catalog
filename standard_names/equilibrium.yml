- name: elongation
  kind: scalar
  status: draft
  description: Flux surface elongation ratio, the vertical half-height divided by
    the horizontal semi-minor width.
  documentation: "The elongation $\\kappa = h / w$ quantifies the poloidal compression\
    \ of a flux surface, where $h$ is the vertical half-height and $w$ is the horizontal\
    \ minor half-width (midplane semi-axis) of the cross-section. In tokamaks, shaped\
    \ plasmas with $\\kappa > 1$ are common, ranging from $\\kappa \\approx 1.2$\u2013\
    $1.6$ in conventional divertor configurations up to $\\kappa \\approx 1.8$\u2013\
    $2.0$ for high-performance regimes. The elongation, together with triangularity\
    \ [upper_triangularity](name:upper_triangularity) and the radial coordinate [normalized_minor_radius](name:normalized_minor_radius),\
    \ fully parameterizes the Miller equilibrium geometry used in local gyrokinetic\
    \ simulations.\n\nSign convention: Positive when the flux surface is compressed\
    \ vertically, i.e., $h / w > 0$.\n\nObtained from equilibrium reconstruction codes\
    \ by mapping the flux surface contour in the poloidal $(R, Z)$ plane. The global\
    \ value at the last closed flux surface is given by [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity
  - name:normalized_minor_radius
  - name:elongation_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/profiles_1d/elongation
    dd_path: equilibrium/time_slice/profiles_1d/elongation
    status: composed
  - id: dd:gyrokinetics_local/flux_surface/elongation
    dd_path: gyrokinetics_local/flux_surface/elongation
    status: composed
- name: elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: "Plasma boundary elongation parameter \u03BA, the ratio of the full\
    \ vertical half-height to the horizontal minor radius."
  documentation: "The boundary elongation $\\kappa$ quantifies the vertical stretching\
    \ of the last closed flux surface (LCFS), defined as $\\kappa = (Z_{\\rm max}\
    \ - Z_{\\rm min}) / (2a)$, where $Z_{\\rm max}$ and $Z_{\\rm min}$ are the maximum\
    \ and minimum vertical coordinates of the boundary, and $a$ is the minor radius.\
    \ This shaping parameter directly affects the ideal MHD stability limit (Troyon\
    \ limit) and the H-mode power threshold; typical values range from $\\kappa =\
    \ 1.0$ (circular plasmas) to $\\kappa \\approx 1.8$\u2013$2.0$ in strongly shaped\
    \ DIII-D and JET plasmas, with ITER baseline designs targeting $\\kappa \\approx\
    \ 1.7$. The elongation is obtained from equilibrium reconstruction codes (e.g.,\
    \ EFIT, LIUQE) that fit the separatrix or boundary contour to magnetic and kinetic\
    \ measurements. For asymmetric configurations, separate upper and lower elongations\
    \ can be defined via [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary).\
    \ See also [major_radius_of_plasma_boundary](name:major_radius_of_plasma_boundary)\
    \ for the radial counterpart.\n\nSign convention: Positive when the plasma boundary\
    \ is vertically elongated.\n\nElongation values above unity correspond to D-shaped\
    \ cross-sections, which improve vertical stability and access to high-\u03B2 regimes."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:major_radius_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation
    dd_path: equilibrium/time_slice/boundary/elongation
    status: attached
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation
    status: composed
  - id: dd:summary/boundary/elongation/value
    dd_path: summary/boundary/elongation/value
    status: composed
- name: internal_inductance
  kind: scalar
  status: draft
  description: Normalized internal inductance li_3 of the plasma current profile,
    quantifying poloidal magnetic field energy relative to a uniform current distribution.
  documentation: "The normalized internal inductance $l_i(3)$ is a dimensionless global\
    \ equilibrium parameter defined as $l_i(3) = 2\\int_V B_p^2\\,dV\\,/\\,(R_0 \\\
    mu_0^2 I_p^2)$, where $B_p$ is the poloidal magnetic field, $R_0$ the geometric\
    \ major radius, $\\mu_0$ the vacuum permeability, and $I_p$ the total plasma current.\
    \ It measures the peaking of the toroidal current density profile: higher $l_i(3)$\
    \ corresponds to a more peaked current distribution, while lower values indicate\
    \ broader profiles toward the plasma edge. Typical values range from 0.3\u2013\
    0.5 for broad H-mode profiles to 1.0\u20131.5 for strongly peaked L-mode or sawtooth-free\
    \ discharges. The quantity is derived from MHD equilibrium reconstruction using\
    \ external magnetic measurements (flux loops, pickup coils) combined with internal\
    \ constraints from MSE or polarimetry. It is directly related to the poloidal\
    \ beta $\\beta_p$ through the Shafranov equilibrium equation and to the plasma\
    \ shape via the elongation $\\kappa$ and triangularity $\\delta$.\n\nSign convention:\
    \ Positive when the volume-integrated poloidal field energy is positive, which\
    \ holds for all physical current profiles producing a confining poloidal field.\n\
    \nSee also [magnetic_shear_of_magnetic_axis](name:magnetic_shear_of_magnetic_axis)\
    \ for the local gradient of the safety factor that complements the global current-peaking\
    \ information provided by $l_i(3)$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_of_magnetic_axis
  sources:
  - id: dd:core_profiles/global_quantities/li
    dd_path: core_profiles/global_quantities/li
    status: attached
  - id: dd:core_profiles/global_quantities/li_3
    dd_path: core_profiles/global_quantities/li_3
    status: attached
  - id: dd:plasma_profiles/global_quantities/li_3
    dd_path: plasma_profiles/global_quantities/li_3
    status: attached
  - id: dd:summary/global_quantities/li/value
    dd_path: summary/global_quantities/li/value
    status: attached
  - id: dd:summary/global_quantities/li_3/value
    dd_path: summary/global_quantities/li_3/value
    status: attached
  - id: dd:summary/global_quantities/li_3_mhd/value
    dd_path: summary/global_quantities/li_3_mhd/value
    status: composed
- name: lower_elongation_of_plasma_boundary
  kind: scalar
  status: draft
  description: Lower-half elongation of the plasma boundary, defined as the ratio
    of the vertical half-height below the geometric axis to the horizontal minor radius.
  documentation: 'The lower elongation $\kappa_{\text{lower}}$ characterizes the vertical
    stretching of the poloidal cross-section below the geometric axis relative to
    the plasma minor radius $a$. It is one of the shaping parameters that describes
    the asymmetry of the plasma boundary and, together with the upper elongation,
    determines the total elongation $\kappa$. Typical values of $\kappa_{\text{lower}}$
    range from 1.0 to 2.5 in diverted tokamak configurations, with values greater
    than unity indicating an elongated lower half. This parameter is routinely obtained
    from equilibrium reconstruction codes using magnetic measurements and is used
    to assess MHD stability and vertical control requirements. See also [upper_elongation_of_plasma_boundary](name:upper_elongation_of_plasma_boundary)
    for the corresponding upper-half parameter and [elongation_of_plasma_boundary](name:elongation_of_plasma_boundary)
    for the combined elongation.


    Sign convention: Positive when the vertical half-height below the geometric axis
    has a finite positive value, with the quantity being inherently non-negative for
    conventional plasma boundaries.


    Lower elongation values are typically compared with [lower_triangularity_of_plasma_boundary](name:lower_triangularity_of_plasma_boundary)
    to fully characterize the lower plasma shape for divertor design and scrape-off
    layer modeling.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_elongation_of_plasma_boundary
  - name:elongation_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  sources:
  - id: dd:equilibrium/time_slice/boundary/elongation_lower
    dd_path: equilibrium/time_slice/boundary/elongation_lower
    status: composed
  - id: dd:equilibrium/time_slice/boundary_separatrix/elongation_lower
    dd_path: equilibrium/time_slice/boundary_separatrix/elongation_lower
    status: composed
- name: magnetic_field_magnitude
  kind: scalar
  status: draft
  description: The scalar magnitude of the total magnetic field vector on each flux
    surface, representing the local field strength irrespective of direction.
  documentation: "The magnetic field magnitude $|\\mathbf{B}| = \\sqrt{B_R^2 + B_\\\
    phi^2 + B_Z^2}$ is evaluated at the centroid of each finite element discretizing\
    \ the ferritic inserts and iron core segments in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame. This quantity is always positive and physically corresponds\
    \ to the total field strength sensed by a scalar probe; it is distinct from the\
    \ signed minimum of $B_\\phi$ on a flux surface ($B_{\\min}$) used in trapped-particle\
    \ and neoclassical transport calculations, where the variation of $|\\mathbf{B}|$\
    \ along the flux surface determines the fraction of trapped particles. In typical\
    \ tokamak equilibria, $|\\mathbf{B}|$ ranges from 1\u20136 T on axis and decreases\
    \ radially outward; the minimum of $|\\mathbf{B}|$ on each flux surface is a key\
    \ parameter for classifying particle orbits and for evaluating magnetic-well stabilization\
    \ of MHD modes. This quantity is obtained from equilibrium reconstruction codes\
    \ using magnetic measurements as inputs. See also the base quantity `[magnetic_field](name:magnetic_field)`\
    \ and the related `[poloidal_magnetic_field_at_magnetic_axis](name:poloidal_magnetic_field_at_magnetic_axis)`\
    \ for the poloidal component alone."
  unit: T
  physics_domain: equilibrium
  links:
