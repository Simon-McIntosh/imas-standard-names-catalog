- name: gas_species_fraction
  kind: scalar
  status: draft
  description: Molecular fraction of a given species within a gas mixture used for
    injection or neutral-beam source operation.
  documentation: "The gas species fraction $f_s$ gives the relative number of molecules\
    \ of species $s$ in the total gas mixture, satisfying the closure $\\sum_s f_s\
    \ = 1$ where $f_s \\in [0,1]$. This dimensionless quantity determines the effective\
    \ atomic mass and ionization cross-section of the injected neutrals and directly\
    \ influences the plasma fueling efficiency and edge neutral pressure. In deuterium\u2013\
    tritium campaigns the fraction specifies the D/T ratio; impurity seeding scenarios\
    \ use $f_s$ to prescribe neon, nitrogen, or argon admixtures at the percent level.\
    \ Values are set by mass-flow-controller calibration or residual gas analyzer\
    \ measurements upstream of the valve. See also [maximum_flow_rate_of_gas_injection_valve](name:maximum_flow_rate_of_gas_injection_valve)\
    \ for the volumetric throughput and [minimum_flow_rate_of_gas_injection_valve](name:minimum_flow_rate_of_gas_injection_valve)\
    \ for the lower flow limit."
  unit: '1'
  cocos_transformation_type: one_like
  tags:
  - calibrated
  - particle-balance
  - scenario-planning
  links: []
  validity_domain: ''
  constraints: []
- name: toroidal_component_of_shattered_pellet_fragment_velocity
  kind: vector
  status: draft
  description: Projection of a shattered-pellet-injection fragment's velocity vector
    onto the toroidal direction $\hat{\phi}$.
  documentation: The toroidal velocity component $v_{\phi,\text{frag}}$ characterizes
    the fragment motion along the toroidal axis after a cryogenic pellet is shattered
    at the injection guide tube exit. In shattered pellet injection (SPI) systems
    used for disruption mitigation, fragments leave the shattering cone with a distribution
    of velocities; $v_{\phi,\text{frag}}$ governs the toroidal spread of material
    deposition and thus the uniformity of the resulting thermal quench radiation.
    Fragment speeds range from $100$ to $800\;\mathrm{m\,s^{-1}}$ in current SPI designs
    (DIII-D, JET), with the toroidal component determined by the cone half-angle and
    injector port orientation. Measurement is performed via fast-camera stereoscopic
    tracking or microwave-cavity time-of-flight diagnostics. See also the radial and
    vertical counterparts for the full velocity vector reconstruction.
  unit: m.s^-1
  tags:
  - disruption-prediction
  - spatial-profile
  - transient
  links: []
  validity_domain: ''
  constraints: []
