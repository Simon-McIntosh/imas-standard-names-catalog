name: plasma_volume_inside_flux_surface
status: draft
cocos_transformation_type: one_like
description: Volume of plasma enclosed by a given magnetic flux surface, computed
  by integration of the Jacobian over the enclosed region.
documentation: The plasma volume inside a flux surface $V(\psi)$ is the total volume
  enclosed by the magnetic surface labeled by the poloidal flux $\psi$, computed as
  $V(\psi) = \oint_{\psi'<\psi} J\, d\theta\, d\phi$ where $J$ is the coordinate Jacobian
  (m$^3$), $\theta$ is the poloidal angle, and $\phi$ is the toroidal angle. It is
  a monotonically increasing function of the flux label, with $V = 0$ at the magnetic
  axis and $V = V_{\mathrm{plasma}}$ at the last closed flux surface. The derivative
  $V'(\psi) = dV/d\psi$ serves as the flux-surface metric in transport equations and
  relates volume-integrated sources to flux-surface-averaged quantities. Typical values
  range from a few m$^3$ for medium-size tokamaks (DIII-D, AUG) to $\sim$830 m$^3$
  for ITER. The quantity is obtained from equilibrium reconstruction codes (e.g.,
  EFIT, LIUQE) or directly from the plasma geometry in transport simulations.
