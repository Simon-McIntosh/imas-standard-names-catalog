      parent: '1-D profiles of plasma and pellet along the pellet path '
      data_type: FLT_1D
      unit: s^-1
      coordinates:
      - pellets/time_slice/pellet/path_profiles/distance
    enhanced_context:
      description: Ablation rate of particles along the pellet path, giving the number
        of electrons released per unit time at each position along the pellet trajectory
        as it ablates inside the plasma.
      kind: llm
- name: energy_of_plant_component_port
  kind: scalar
  status: active
  description: Energy of a plant component port is the cumulative amount of energy
    transferred across a plant-component port for a specified energy-transfer channel.
    It is the time integral of the corresponding port power and is the parent concept
    for forms such as thermal energy extracted through a cooling loop.
  documentation: 'Energy of a plant component port is the cumulative amount of energy
    transferred across a port of a plant component during a specified time interval.
    It represents the time-integrated counterpart of the relevant port power for the
    same component, port, and energy-transfer channel.


    The cumulative port energy for a chosen energy-transfer channel is defined by
    integrating the corresponding port power over time:


    $$

    E_{\mathrm{port}}(t) = \int_{t_0}^{t} P_{\mathrm{port}}(t'')\,dt''

    $$


    where $E_{\mathrm{port}}$ is the energy of the plant component port, $P_{\mathrm{port}}$
    is the corresponding port power for the same component, port, and energy-transfer
    channel, and $t_0$ is the beginning of the accumulation interval.


    This parent quantity does not specify the physical form, carrier, or mechanism
    of the energy transfer. Those restrictions belong to more specific child quantities,
    such as the [thermal energy of a plant component port](name:thermal_energy_of_plant_component_port),
    and it is distinct from instantaneous port power, such as [thermal power of a
    plant component port](name:thermal_power_of_plant_component_port).'
  unit: J
  physics_domain: plant_systems
  links:
  - name:thermal_energy_of_plant_component_port
  - name:thermal_power_of_plant_component_port
- name: ethane_count
  kind: scalar
  status: active
  description: Ethane equivalent-electron count is the inventory of ethane molecules
    expressed as the number of electrons in the corresponding neutral C2H6 molecules,
    assigning 18 counts per molecule.
  documentation: 'Ethane equivalent-electron count is the ethane-only molecular inventory
    expressed on an equivalent-electron basis. Each neutral ethane molecule contributes
    the total atomic number of its constituent atoms.


    The defining relation is


    $$

    N_{\mathrm{eq},\mathrm{C_2H_6}} = 18\,N_{\mathrm{C_2H_6}}

    $$


    where $N_{\mathrm{eq},\mathrm{C_2H_6}}$ is the ethane equivalent-electron count
    and $N_{\mathrm{C_2H_6}}$ is the number of neutral ethane molecules represented
    by the inventory. The factor $18$ is the sum of the atomic numbers of two carbon
    atoms and six hydrogen atoms in one neutral ethane molecule.


    This quantity is scoped to ethane alone and is not a generic sum over multiple
    injected gas species. The [accumulated ethane count](name:accumulated_ethane_count)
    is the cumulative form of this same ethane-only equivalent-electron count.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_ethane_count
  - name:ethane_source_rate
- name: accumulated_ethane_count
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of ethane molecules injected
    after plasma breakdown, assigning 18 equivalent-electron counts to each neutral
    C2H6 molecule.
  documentation: 'This quantity is the post-breakdown cumulative ethane-gas inventory
    expressed as an equivalent-electron count. Each neutral C2H6 molecule contributes
    18 counts: 12 from its two carbon atoms and 6 from its six hydrogen atoms.


    The accumulated count is defined by


    $$

    N_{\mathrm{eq}}(t) = 18\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{C_2H_6}}(t'')\,dt''

    $$


    where $N_{\mathrm{eq}}$ is the equivalent-electron count, $\dot{N}_{\mathrm{C_2H_6}}$
    is the ethane molecule injection rate, $t_{\mathrm{bd}}$ is the plasma-breakdown
    time, and $t$ is the evaluation time.


    This quantity is the accumulated post-breakdown form of the [ethane count](name:ethane_count)
    convention. It excludes ethane introduced during prefill, represented by [ethane
    prefill count](name:ethane_prefill_count), and differs from the instantaneous
    [ethane source rate](name:ethane_source_rate).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:ethane_count
  - name:ethane_prefill_count
  - name:ethane_source_rate
