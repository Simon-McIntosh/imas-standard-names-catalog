- name: accumulated_helium_3_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of helium-3 atoms delivered
    by gas injection after plasma breakdown, assigning two count units to each atom.
  documentation: 'This quantity is the cumulative post-breakdown inventory of helium-3
    atoms delivered by gas injection, expressed as an equivalent-electron count. It
    represents delivered atomic inventory, not the number of free plasma electrons
    or the ionization state of the helium-3.


    $$

    N_{\mathrm{eq}}(t)=Z_{\mathrm{He\text{-}3}}\int_{t_{\mathrm{bd}}}^{t}\dot{N}_{\mathrm{He\text{-}3}}(t'')\,dt''

    $$


    Here, $N_{\mathrm{eq}}$ is the dimensionless equivalent-electron count, $Z_{\mathrm{He\text{-}3}}=2$
    is the helium-3 atomic number, $\dot{N}_{\mathrm{He\text{-}3}}$ is the helium-3
    atom delivery rate in atoms per second, $t$ and $t''$ are times in seconds, and
    $t_{\mathrm{bd}}$ is the plasma-breakdown time.


    The quantity includes only helium-3 delivered after breakdown and is cumulative
    rather than instantaneous. The corresponding instantaneous delivery rate is [helium-3
    source rate due to gas injection](name:helium_3_source_rate_due_to_gas_injection),
    while [accumulated helium-3 prefill count due to gas injection](name:accumulated_helium_3_prefill_count_due_to_gas_injection)
    covers delivery before breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:helium_3_source_rate_due_to_gas_injection
  - name:accumulated_helium_3_prefill_count_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_accumulated/helium_3/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-helium_3-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_accumulated/helium_3
      parent: Helium isotope with 3 nucleons
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - summary/time
    enhanced_context:
      description: Helium isotope with 3 nucleons.
      kind: template
- name: accumulated_helium_3_prefill_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative equivalent-electron inventory of helium-3 atoms introduced
    by gas injection during plasma prefill before plasma breakdown, with two count
    units assigned per atom.
  documentation: 'The quantity is the cumulative inventory of helium-3 atoms delivered
    by gas injection during the plasma prefill phase, expressed as an equivalent-electron
    count. It covers injection before plasma breakdown and excludes helium-3 introduced
    after breakdown.


    The equivalent-electron count is defined by


    $$

    N_{\mathrm{eq}} = Z_{\mathrm{He\text{-}3}} N_{\mathrm{He\text{-}3}} = 2\int_{t_0}^{t_{\mathrm{bd}}}
    \dot{N}_{\mathrm{He\text{-}3}}(t)\,dt

    $$


    where $N_{\mathrm{eq}}$ is the equivalent-electron count, $Z_{\mathrm{He\text{-}3}}=2$
    is the helium-3 atomic number, $N_{\mathrm{He\text{-}3}}$ is the injected helium-3
    atom count, $\dot{N}_{\mathrm{He\text{-}3}}$ is the injection rate in s$^{-1}$,
    and $t_0$ and $t_{\mathrm{bd}}$ are the prefill start and breakdown times in s.


    This is the pre-breakdown counterpart of [accumulated helium-3 count due to gas
    injection](name:accumulated_helium_3_count_due_to_gas_injection); [helium-3 source
    rate due to gas injection](name:helium_3_source_rate_due_to_gas_injection) represents
    the instantaneous rate rather than the accumulated inventory.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_helium_3_count_due_to_gas_injection
  - name:helium_3_source_rate_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_prefill/helium_3/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_prefill-helium_3-value
