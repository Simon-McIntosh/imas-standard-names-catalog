name: flux_surface_averaged_major_radius
status: draft
cocos_transformation_type: one_like
description: Flux-surface average of the major-radius coordinate $R$, denoted $\langle
  R \rangle$, evaluated on each closed magnetic surface.
documentation: 'The flux-surface-averaged major radius is defined as $\langle R \rangle
  = \oint R \, dl_p / \oint dl_p$, where $dl_p$ is the poloidal arc-length element
  along the flux surface contour and $R$ is the major-radius coordinate. More precisely,
  it corresponds to the geometric metric quantity often labeled $gm8$ in equilibrium
  codes: $\langle R \rangle = (1/V'') \oint (R / |\nabla \rho|) \, dA$, where $V''
  = dV/d\rho$ is the flux-surface volume derivative and $dA$ the poloidal area element.
  This quantity enters transport equations when converting between different radial
  coordinate representations and appears in the evaluation of neoclassical coefficients
  that depend on the local aspect ratio. Typical values range from the on-axis major
  radius $R_0$ (e.g., 1.7 m for DIII-D, 6.2 m for ITER) on inner surfaces to slightly
  shifted values on outer surfaces due to the Shafranov shift. It is computed as a
  standard output of equilibrium reconstruction codes. See `major_radius_of_magnetic_axis`
  for the on-axis value and `safety_factor` for another flux-surface-labeled equilibrium
  profile.'
