- name: vertical_coordinate_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: "Vertical Z coordinate of the geometric center of a diagnostic aperture\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame, where Z is vertical height."
  documentation: 'The vertical coordinate of a diagnostic aperture is the $Z$ position
    of the aperture''s geometric center in the right-handed cylindrical $(R, \phi,
    Z)$ frame. Here $R$ is major radius measured from the machine symmetry axis, $\phi$
    is the toroidal angle, and $Z$ is vertical height.


    For a physical aperture such as a pinhole, collimator opening, or entrance slit,
    the geometric center is the reference point used to define the diagnostic viewing
    geometry. The coordinate is normally obtained from mechanical design data, metrology
    surveys, or alignment calibrations, and may be updated when in-vessel components
    move or are re-surveyed.


    Typical values are set by the vertical size of the device and diagnostic installation
    location, commonly ranging from -10-10 m in large fusion devices and from -3-3
    m in smaller experiments.


    Sign convention: Positive when the aperture center is displaced in the $+Z$ direction
    of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
