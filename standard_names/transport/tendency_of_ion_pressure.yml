name: tendency_of_ion_pressure
status: draft
cocos_transformation_type: one_like
description: Time derivative of the thermal ion pressure, quantifying how the ion
  pressure profile evolves in a transport calculation.
documentation: "The tendency of ion pressure $\\partial p_i / \\partial t$ (Pa s$^{-1}$\
  \ in a temporal context) represents the rate at which thermal ion pressure changes\
  \ due to heating, radiation losses, particle sources, and radial energy transport.\
  \ Here $p_i = n_i k_B T_i$, where $n_i$ is the ion number density, $T_i$ the ion\
  \ temperature, and $k_B$ the Boltzmann constant. In 1-D transport solvers this term\
  \ forms the left-hand side of the ion energy-balance equation. Typical core ion\
  \ pressures in tokamak H-mode plasmas are 10\u2013300 kPa; tendencies during transient\
  \ events such as ELMs or auxiliary heating ramp-up can reach $\\sim 10^{6}$ Pa s$^{-1}$.\
  \ The quantity may represent a total over all ion species or be resolved per species\
  \ and charge state depending on the solver configuration. See `ion_number_density`\
  \ for the density component and `tendency_of_ion_temperature` for the temperature\
  \ evolution."
