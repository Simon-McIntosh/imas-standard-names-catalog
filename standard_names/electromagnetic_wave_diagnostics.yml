- name: first_local_tangential_coordinate_of_reflectometer_antenna
  kind: scalar
  status: active
  description: "Signed position of a reflectometer-antenna aperture-outline vertex\
    \ along the first local tangential axis of the antenna\u2019s in-plane frame."
  documentation: 'This quantity is the signed first local tangential coordinate of
    a vertex on the reflectometer antenna aperture outline. It defines the vertex
    position in the antenna-local tangential frame.


    $$

    x_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_1

    $$


    where $x_1$ is the first local tangential coordinate, $\mathbf{r}$ is the position
    of the aperture-outline vertex, $\mathbf{r}_0$ is the origin of the local frame,
    and $\hat{\mathbf{e}}_1$ is its first local tangential unit vector. The right-handed
    local basis $(\hat{\mathbf{e}}_1, \hat{\mathbf{e}}_2, \hat{\mathbf{e}}_3)$ uses
    the more-horizontal in-plane tangent toward increasing toroidal angle $\phi$ in
    the right-handed cylindrical $(R, \phi, Z)$ frame; $\hat{\mathbf{e}}_3$ is the
    plasma-facing normal and $\hat{\mathbf{e}}_2 = \hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$.


    Each value locates one aperture-outline vertex and is not the aperture width or
    a global cylindrical coordinate. The complementary coordinate along the second
    local tangent is the [second local tangential coordinate of the reflectometer
    antenna](name:second_local_tangential_coordinate_of_reflectometer_antenna).


    Sign convention: Positive when the outline vertex lies in the direction of $\hat{\mathbf{e}}_1$
    from $\mathbf{r}_0$.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:second_local_tangential_coordinate_of_reflectometer_antenna
  sources:
  - dd_path: reflectometer_fluctuation/channel/antenna_detection_static/outline/x1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/reflectometer_fluctuation.html#reflectometer_fluctuation-channel-antenna_detection_static-outline-x1
    dd_documentation:
      leaf: Positions along x1 axis
      parent_path: reflectometer_fluctuation/channel/antenna_detection_static/outline
      parent: Irregular outline of the detector/aperture in the (X1, X2) coordinate
        system. Do NOT repeat the first point.
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: X1-axis coordinates of the vertices defining the irregular aperture
        outline of a static detection antenna distinct from the emission antenna in
        a fluctuation reflectometer channel. Defines part of the aperture polygon
