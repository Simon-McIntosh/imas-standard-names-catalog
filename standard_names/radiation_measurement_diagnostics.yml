- name: toroidal_coordinate_of_optical_element
  kind: scalar
  status: active
  description: "Toroidal angular coordinate of an optical element\u2019s geometric\
    \ reference center, locating it around the machine symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: "The toroidal coordinate $\\phi$ gives the azimuthal location of\
    \ an optical element\u2019s geometric reference point around the machine symmetry\
    \ axis. It is defined in the right-handed cylindrical $(R,\\phi,Z)$ frame, where\
    \ $R$ is major radius and $Z$ is vertical height.\n\nFor a reference point with\
    \ horizontal Cartesian coordinates $x$ and $y$ in the right-handed $(\\hat{x},\\\
    hat{y},\\hat{z})$ basis, with the $x$ direction aligned to $\\phi=0$, the angular\
    \ coordinate is\n\n$$\n\\phi = \\operatorname{atan2}(y,x)\n$$\n\nThe reference\
    \ point is the geometric center of a circular optical element or the origin of\
    \ the local coordinate system describing a planar detector or aperture. Its vertical\
    \ counterpart is the [vertical coordinate of the optical element](name:vertical_coordinate_of_optical_element).\n\
    \nSign convention: Positive when the reference point lies in the direction of\
    \ increasing toroidal angle $\\phi$, counter-clockwise when viewed from above\
    \ along $+\\hat{Z}$."
  unit: rad
  physics_domain: radiation_measurement_diagnostics
