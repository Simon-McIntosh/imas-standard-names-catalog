- name: first_local_tangential_coordinate_of_bragg_crystal
  kind: scalar
  status: active
  description: "Signed coordinate of a Bragg-crystal outline vertex along the first\
    \ local tangential axis of the right-handed crystal-local (e1, e2, e3) frame,\
    \ with e1 the more horizontal crystal-tangential direction oriented toward increasing\
    \ toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Signed coordinate of a Bragg-crystal outline vertex along the first
    local tangential axis is the scalar displacement of that vertex from the crystal-local
    reference point along the first in-surface direction of the Bragg crystal. The
    quantity is defined in the right-handed crystal-local $(\hat{\mathbf{e}}_1,\hat{\mathbf{e}}_2,\hat{\mathbf{e}}_3)$
    frame tied to the crystal surface.


    The coordinate is the projection of the vertex displacement onto the first local
    tangential unit vector:


    $$

    X_1 = (\mathbf{r} - \mathbf{r}_0) \cdot \hat{\mathbf{e}}_1

    $$


    where $\mathbf{r}$ is the position vector of the Bragg-crystal outline vertex,
    $\mathbf{r}_0$ is the position vector of the crystal-local reference point, and
    $\hat{\mathbf{e}}_1$ is the first local tangential unit vector.


    The crystal-local triad is fixed geometrically: $\hat{\mathbf{e}}_3$ is the plasma-facing
    surface normal, $\hat{\mathbf{e}}_1$ is the more horizontal tangent to the crystal
    surface and is oriented so that its toroidal component points in the $+\hat{\phi}$
    direction of the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height, and $\hat{\mathbf{e}}_2
    = \hat{\mathbf{e}}_3 \times \hat{\mathbf{e}}_1$. This coordinate is distinct from
    the [second local tangential coordinate](name:second_local_tangential_coordinate_of_bragg_crystal),
    which uses $\hat{\mathbf{e}}_2$, and from any coordinate along the surface normal.


    Sign convention: Positive when the outline vertex is displaced from the crystal-local
    reference point in the $+\hat{\mathbf{e}}_1$ direction, the more horizontal crystal-tangential
    direction oriented toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:second_local_tangential_coordinate_of_bragg_crystal
  sources:
