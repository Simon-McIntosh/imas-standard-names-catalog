- name: diameter_of_diagnostic_aperture
  kind: scalar
  status: draft
  description: Full linear width of a circular diagnostic aperture at the entrance
    pupil, equal to twice the aperture radius and determining the solid-angle light-collection
    acceptance of the diagnostic channel.
  documentation: "The diameter of a diagnostic aperture is the full chord across the\
    \ circular opening at the entrance pupil of the optical collection system. It\
    \ is geometrically related to the [radius_of_diagnostic_aperture](name:radius_of_diagnostic_aperture)\
    \ by $d = 2r$, and it directly governs the solid angle subtended at a given distance\
    \ from the plasma emission region, setting the total light throughput and therefore\
    \ the signal-to-noise balance of the diagnostic.\n\nThe solid angle $\\Omega$\
    \ subtended by a circular aperture of diameter $d$ at perpendicular distance $L$\
    \ from the emission region is:\n\n$$\n\\Omega \\approx \\frac{\\pi d^2}{4 L^2}\n\
    $$\n\nwhere $d$ is the aperture diameter and $L$ is the line-of-sight distance\
    \ from the plasma to the aperture plane.\n\nThis geometric parameter characterizes\
    \ the entrance cone of spectroscopic diagnostics, including charge exchange recombination\
    \ spectroscopy channels where the aperture diameter limits angular acceptance\
    \ and spatial resolution. Typical values in fusion diagnostic systems range from\
    \ a few millimeters to several centimeters depending on the required \xE9tendue\
    \ and spatial selectivity of the measurement.\n\nSign convention: Positive when\
    \ measured as the full chord through the aperture center in the plane of the entrance\
    \ pupil."
  unit: m
  physics_domain: particle_measurement_diagnostics
  links:
  - name:radius_of_diagnostic_aperture
  sources:
  - id: dd:charge_exchange/channel/cone_diameter
    dd_path: charge_exchange/channel/cone_diameter
    status: composed
- name: helium_4_density
  kind: scalar
  status: draft
  description: Local number density of helium-4 ions per unit plasma volume, the principal
    measure of fusion ash concentration in deuterium-tritium burning plasmas.
  documentation: "The helium-4 ion number density $n_{{}^4\\text{He}}$ quantifies\
    \ the local concentration of ${}^4\\text{He}$ nuclei at a given point in the plasma.\
    \ At fusion-relevant temperatures (several keV), helium-4 is fully stripped to\
    \ He$^{2+}$, and in deuterium-tritium burning plasmas it accumulates as the primary\
    \ fusion ash product of the reaction ${}^2\\text{H} + {}^3\\text{H} \\rightarrow\
    \ {}^4\\text{He} + n$; its buildup dilutes the fuel and reduces the fusion reaction\
    \ rate if not exhausted by the divertor system.\n\nThe time evolution of $n_{{}^4\\\
    text{He}}$ is governed by the particle continuity equation\n\n$$\n\\frac{\\partial\
    \ n_{{}^4\\text{He}}}{\\partial t} + \\nabla \\cdot \\boldsymbol{\\Gamma}_{{}^4\\\
    text{He}} = S_{{}^4\\text{He}}\n$$\n\nwhere $\\boldsymbol{\\Gamma}_{{}^4\\text{He}}$\
    \ is the helium-4 particle flux and $S_{{}^4\\text{He}}$ is the volumetric source\
    \ rate from fusion reactions and ionization of recycled helium neutrals at the\
    \ plasma edge.\n\nThe helium-4 density is measured primarily via charge exchange\
    \ recombination spectroscopy, where injected neutral beam atoms undergo charge\
    \ exchange with He$^{2+}$ ions to produce line emission from excited helium atoms;\
    \ passive spectroscopy of edge recycling emission provides a complementary approach.\
    \ Chord-averaged and volume-averaged forms are provided by [line_averaged_helium_4_density](name:line_averaged_helium_4_density)\
    \ and [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density)\
    \ respectively, while [helium_4_density_at_plasma_boundary](name:helium_4_density_at_plasma_boundary)\
    \ gives the boundary value.\n\nIn D-T burning plasmas, central He-4 densities\
    \ are in the range $10^{18}$-$10^{19}$ m$^{-3}$, with the helium-to-electron density\
    \ ratio \u2014 captured by [fraction](name:fraction) \u2014 kept below approximately\
    \ 5-10% in steady state to avoid excessive fuel dilution."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_helium_4_density
  - name:volume_averaged_helium_4_density
  - name:helium_4_density_at_plasma_boundary
  - name:fraction
- name: krypton_density
  kind: scalar
  status: draft
  description: Local number density of krypton impurity summed over all ionization
    states, giving the total krypton particle concentration per unit plasma volume.
  documentation: "The krypton number density is the volumetric concentration of krypton\
    \ impurity at a given point in the plasma, encompassing all ionization states\
    \ from neutral krypton Kr$^0$ through fully stripped Kr$^{36+}$. It is the primary\
    \ local measure of krypton seeding level and the parent quantity from which spatially\
    \ averaged forms are derived.\n\nThe total krypton particle density $n_\\mathrm{Kr}$\
    \ at a given location is defined as:\n\n$$\nn_\\mathrm{Kr} = \\sum_{q=0}^{36}\
    \ n_\\mathrm{Kr}^{(q)}\n$$\n\nwhere $n_\\mathrm{Kr}^{(q)}$ is the number density\
    \ of krypton ions in charge state $q$. The [chord-averaged form](name:line_averaged_krypton_density)\
    \ integrates this local quantity along a line of sight, while [volume_averaged_krypton_density](name:volume_averaged_krypton_density)\
    \ provides a global mean. The concentration relative to electron density is tracked\
    \ by [krypton_fraction](name:krypton_fraction), and the pedestal-region value\
    \ by [krypton_density_at_pedestal](name:krypton_density_at_pedestal).\n\nKrypton\
    \ (atomic number $Z=36$) is injected as a high-$Z$ seeding gas for radiative power\
    \ exhaust and divertor detachment control. Its local density is inferred from\
    \ passive spectroscopy of charge-state emission lines, active charge-exchange\
    \ recombination spectroscopy, or tomographic inversion of multi-chord line-integrated\
    \ measurements. Typical seeded-discharge values in tokamak edge and divertor regions\
    \ range from $10^{16}$ to $10^{18}$ m$^{-3}$, corresponding to 0.01\u20131% of\
    \ the local electron density.\n\nSign convention: Positive when krypton particles\
    \ are present in the plasma volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_krypton_density
  - name:volume_averaged_krypton_density
  - name:krypton_fraction
  - name:krypton_density_at_pedestal
- name: line_averaged_helium_4_density
  kind: scalar
  status: draft
  description: Chord-averaged helium-4 ion number density, equal to the path integral
    of the local helium-4 density divided by the measurement chord length.
  documentation: 'The line-averaged helium-4 density gives the spatial mean of the
    local [helium_4_density](name:helium_4_density) along a diagnostic chord through
    the plasma. As the principal ash product of deuterium-tritium fusion, helium-4
    accumulates in the plasma core and its line-integrated concentration must be monitored
    to prevent fuel dilution and degradation of energy confinement.


    The chord average is defined as:


    $$

    \bar{n}_{\mathrm{He4}} = \frac{1}{L} \int_0^L n_{\mathrm{He4}}(\ell) \, d\ell

    $$


    where $n_{\mathrm{He4}}(\ell)$ is the local helium-4 ion number density at position
    $\ell$ along the chord (in m$^{-3}$) and $L$ is the total chord length in m.


    This quantity is a natural output of line-integrated optical diagnostics such
    as charge-exchange recombination spectroscopy and helium spectral-line emission
    measurements, prior to any spatial inversion. It complements [volume_averaged_helium_4_density](name:volume_averaged_helium_4_density),
    which integrates over the full plasma volume, and is directly analogous to [line_averaged_helium_3_density](name:line_averaged_helium_3_density)
    for the lighter helium isotope. Typical values in deuterium-tritium burning plasmas
    range from $10^{17}$ to $10^{19}$ m$^{-3}$, depending on fusion power and helium
    exhaust efficiency.


    Sign convention: Positive when helium-4 ions occupy the measurement chord at finite
    density; number density is orientation-independent and cannot take negative values.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:helium_4_density
  - name:volume_averaged_helium_4_density
  - name:line_averaged_helium_3_density
  arguments:
  - name: helium_4_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/helium_4/value
    dd_path: summary/line_average/n_i/helium_4/value
    status: composed
- name: line_averaged_krypton_density
  kind: scalar
  status: draft
  description: Chord-average of the krypton number density, equal to the path integral
    of the local krypton particle density divided by the measurement chord length.
  documentation: 'Krypton ($Z = 36$) is a noble-gas impurity that may be seeded into
    fusion plasmas for edge radiative cooling and power exhaust control. The line-averaged
    krypton density $\bar{n}_\mathrm{Kr}$ gives the krypton particle concentration
    averaged along a measurement chord, providing a line-of-sight integrated measure
    of impurity content rather than a local point value.


    The defining relation is:


    $$

    \bar{n}_\mathrm{Kr} = \frac{1}{L} \int_0^L n_\mathrm{Kr}(\ell) \, d\ell

    $$


    where $n_\mathrm{Kr}(\ell)$ is the local krypton number density at position $\ell$
    along the chord and $L$ is the total chord length in meters.


    This quantity is typically inferred from chord-integrated optical or vacuum-ultraviolet
    emission spectroscopy of krypton line radiation, combined with emissivity modeling
    along the line of sight. It provides a path-integrated measure complementary to
    the local [krypton_density](name:krypton_density) and to the global [volume_averaged_krypton_density](name:volume_averaged_krypton_density).
    For comparison, [line_averaged_argon_density](name:line_averaged_argon_density)
    follows the same chord-average definition for argon seeding. Local concentrations
    at specific plasma regions are captured by [krypton_density_at_pedestal](name:krypton_density_at_pedestal)
    and [krypton_density_at_limiter](name:krypton_density_at_limiter).


    Typical line-averaged krypton densities in power-exhaust seeding scenarios range
    from $10^{16}$ to $10^{18}$ m$^{-3}$, depending on seeding rate and plasma confinement
    regime.


    Sign convention: Positive when krypton particles are present along the measurement
    chord, consistent with the intrinsically non-negative character of particle number
    density.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:krypton_density
  - name:volume_averaged_krypton_density
  - name:line_averaged_argon_density
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_limiter
  arguments:
  - name: krypton_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/krypton/value
    dd_path: summary/line_average/n_i/krypton/value
    status: composed
- name: line_averaged_lithium_density
  kind: scalar
  status: draft
  description: Path-length average of the lithium impurity ion number density along
    a diagnostic line of sight. It sums all ionized lithium charge states and excludes
    neutral lithium.
  documentation: 'Line-averaged lithium density is the path-length average of the
    lithium impurity ion number density along a specified line of sight. The local
    lithium ion density is the sum over ionized lithium charge states, $n_{\mathrm{Li,ion}}
    = n_{\mathrm{Li}^+} + n_{\mathrm{Li}^{2+}} + n_{\mathrm{Li}^{3+}}$, and excludes
    neutral lithium atoms.


    For a chord of length $L$, the line average is defined by


    $$

    \langle n_{\mathrm{Li}} \rangle_{\mathrm{line}} = \frac{1}{L}\int_0^L n_{\mathrm{Li,ion}}(\ell)\,d\ell

    $$


    where $\ell$ is distance along the line of sight in meters, $L$ is the chord length
    in meters, $n_{\mathrm{Li,ion}}$ is the local summed ionized-lithium density in
    m^-3, and $\langle n_{\mathrm{Li}} \rangle_{\mathrm{line}}$ is in m^-3.


    In practice, this quantity may be inferred from a line-integrated lithium-sensitive
    measurement divided by the relevant chord length, or computed by integrating a
    reconstructed local lithium ion density along the same path. It provides a bulk
    chord measure of lithium impurity content and does not by itself resolve where
    along the line of sight the lithium ions are located.


    The value is non-negative and is typically interpreted relative to electron density
    or to other impurity densities, because lithium content depends strongly on wall
    conditioning, fueling, transport, and plasma scenario. No universal numerical
    range is implied by the definition.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:lithium_density
  - name:volume_averaged_lithium_density
  - name:lithium_fraction
  sources:
  - id: dd:summary/line_average/n_i/lithium/value
    dd_path: summary/line_average/n_i/lithium/value
    status: composed
- name: line_averaged_nitrogen_density
  kind: scalar
  status: draft
  description: Line-averaged number density of nitrogen nuclei along a plasma diagnostic
    chord, summed over all ionization states. It equals the path integral of the local
    nitrogen density divided by the chord length.
  documentation: 'Line-averaged nitrogen density is the chord-average of the local
    nitrogen number density sampled along a diagnostic line of sight. The nitrogen
    density includes nitrogen nuclei in all ionization states, so different charge
    states contribute according to their local abundance along the chord.


    For a chord path $\Gamma$, the line-averaged nitrogen density is defined by:


    $$

    \langle n_N \rangle_L = \frac{1}{L}\int_{\Gamma} n_N(\ell)\,d\ell

    $$


    where $n_N(\ell)$ is the local nitrogen number density in m^-3, summed over all
    ionization states, $\ell$ is arclength along the chord in meters, and $L=\int_{\Gamma}d\ell$
    is the chord length in meters over the sampled plasma region.


    In practice this quantity is inferred from diagnostics and analysis methods that
    constrain nitrogen content along a line of sight, often using spectroscopic signals,
    atomic physics modeling, plasma background parameters, and the known viewing geometry.
    Because many measurements are sensitive to emissivity or to particular charge-state
    populations rather than directly to total nitrogen density, the conversion to
    all-ionization-state nitrogen density is model dependent and is not simply a geometric
    division of a raw signal by chord length.


    Typical line-averaged nitrogen densities in tokamak plasmas range from about 1e15-1e18
    m^-3 for trace-seeded conditions and can reach 1e19 m^-3 in strongly seeded or
    detached-edge regimes, depending on fueling, impurity seeding rate, transport,
    and ionization balance.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:volume_averaged_nitrogen_density
  - name:line_averaged_oxygen_density
  - name:line_averaged_carbon_density
  - name:nitrogen_density
  sources:
  - id: dd:summary/line_average/n_i/nitrogen/value
    dd_path: summary/line_average/n_i/nitrogen/value
    status: composed
- name: nuclear_density_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Number density of target nuclei in a neutron detector converter material
    for the nuclear species involved in the neutron-induced detection reaction.
  documentation: 'Nuclear density of a neutron detector converter is the number of
    target atomic nuclei per unit volume of converter material for the nuclear species
    that participates in the neutron-induced detection reaction. It is a material-and-composition
    property, distinct from converter volume or neutron flux, and sets the number
    of reaction centers available to incident neutrons.


    For a converter made from one or more compounds or phases $c$, the target-nucleus
    density can be computed from the bulk material density and composition as:


    $$

    n_i = \rho_m N_A \sum_c f_c \frac{\nu_{i,c} a_{i,c}}{M_c}

    $$


    where $n_i$ is the target nuclear density in $\mathrm{m}^{-3}$, $\rho_m$ is the
    bulk mass density of the converter material in $\mathrm{kg\,m}^{-3}$, $N_A$ is
    Avogadro''s constant in $\mathrm{mol}^{-1}$, $f_c$ is the dimensionless mass fraction
    of compound or phase $c$, $M_c$ is its molar mass in $\mathrm{kg\,mol}^{-1}$,
    $\nu_{i,c}$ is the number of atoms of the relevant parent element per formula
    unit, and $a_{i,c}$ is the dimensionless isotopic abundance or enrichment of target
    isotope $i$. For a pure elemental or pure isotopic converter this reduces to the
    familiar single-component density relation.


    In practice this quantity is derived from material specifications, density measurements,
    stoichiometry, isotopic assay, enrichment certificates, and corrections for porosity
    or inactive binder fraction when those affect the active converter volume. In
    response calculations it is combined with the microscopic reaction cross section
    and the converter-level neutron flux, such as [neutron_flux_of_neutron_detector_converter](name:neutron_flux_of_neutron_detector_converter);
    this is the flux at or within the converter and is distinct from a detector-level
    incident or averaged [neutron_flux_of_neutron_detector](name:neutron_flux_of_neutron_detector).


    Typical dense solid converter materials have total atomic densities of about $10^{28}-10^{29}\
    \mathrm{m}^{-3}$. Target isotope densities are commonly $10^{26}-10^{29}\ \mathrm{m}^{-3}$
    depending on stoichiometry, enrichment, and loading, while gas or low-density
    converter media can be much lower, around $10^{20}-10^{25}\ \mathrm{m}^{-3}$.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:nuclear_rate_of_neutron_detector_converter
  - name:volume_of_neutron_detector_converter
  - name:neutron_flux_of_neutron_detector
  - name:efficiency_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_nuclear_density
    dd_path: neutron_diagnostic/detectors/radiation/converter_nuclear_density
    status: composed
- name: oxygen_density
  kind: scalar
  status: draft
  description: Total number density of oxygen atoms and ions across all charge states,
    from neutral to fully stripped, giving the local oxygen impurity concentration
    at a point in the plasma.
  documentation: "The local oxygen number density $n_\\mathrm{O}$ quantifies the total\
    \ concentration of oxygen impurity per unit plasma volume, encompassing neutral\
    \ atomic oxygen and all ionic charge states up to fully stripped O$^{8+}$. Oxygen\
    \ is a ubiquitous low-Z impurity in fusion devices, entering through wall outgassing\
    \ and vessel conditioning; it contributes to radiative power losses and dilutes\
    \ the hydrogenic fuel inventory.\n\nThe total oxygen density is defined as the\
    \ sum over all ionization states:\n\n$$\nn_\\mathrm{O} = \\sum_{Z=0}^{8} n_{\\\
    mathrm{O}^{Z+}}\n$$\n\nwhere $n_{\\mathrm{O}^{Z+}}$ is the number density of oxygen\
    \ in charge state $Z^+$, with $Z$ ranging from 0 (neutral) to 8 (fully stripped).\n\
    \nThe local density is inferred from passive extreme-ultraviolet spectroscopy,\
    \ charge-exchange recombination spectroscopy, and soft X-ray emission tomography.\
    \ Spatially averaged forms include [line_averaged_oxygen_density](name:line_averaged_oxygen_density)\
    \ (chord integral divided by chord length) and [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ (integral over the plasma volume). The dimensionless [oxygen_fraction](name:oxygen_fraction)\
    \ relates this local density to the electron density as an impurity concentration\
    \ measure.\n\nIn well-conditioned fusion plasmas the core oxygen density is a\
    \ small fraction of the electron density; edge concentrations of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ are representative of limiter and divertor configurations.\n\
    \nSign convention: Positive when oxygen atoms or ions are present in the plasma\
    \ volume element."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:line_averaged_oxygen_density
  - name:volume_averaged_oxygen_density
  - name:oxygen_fraction
- name: line_averaged_oxygen_density
  kind: scalar
  status: draft
  description: Line-of-sight average of the total oxygen impurity number density,
    encompassing all charge states from neutral to fully stripped, divided by the
    chord length.
  documentation: "The line-averaged oxygen density is the chord-mean of the local\
    \ oxygen number density\u2014summed over all charge states from neutral O$^0$\
    \ through fully stripped O$^{8+}$\u2014along a measurement path through the plasma.\
    \ It characterizes the mean impurity concentration of oxygen along a given line\
    \ of sight and is directly related to the local [oxygen_density](name:oxygen_density)\
    \ integrated along the chord.\n\nThe defining relation is:\n\n$$\n\\langle n_O\
    \ \\rangle_\\ell = \\frac{1}{L} \\int_0^L n_O(\\ell) \\, d\\ell\n$$\n\nwhere $n_O(\\\
    ell)$ is the local oxygen number density at position $\\ell$ along the chord and\
    \ $L$ is the chord length in m.\n\nLine-averaged impurity densities are extracted\
    \ from chord-integrated spectroscopic measurements of oxygen emission lines combined\
    \ with ionization balance models. Passive spectroscopy of ultraviolet oxygen transitions\
    \ or charge-exchange recombination spectroscopy of helium-like and hydrogen-like\
    \ oxygen lines provides the chord-integrated signal from which the line-averaged\
    \ density is inferred. As a chord-averaged observable, spatial resolution is inherently\
    \ limited, and tomographic inversion or profile modeling is required to recover\
    \ local distributions.\n\nOxygen is a low-concentration impurity in fusion plasmas\
    \ under normal operating conditions; line-averaged values fall several orders\
    \ of magnitude below the electron density, with representative ranges of $10^{15}$\u2013\
    $10^{17}$ m$^{-3}$ depending on wall conditioning and impurity seeding. The [volume_averaged_oxygen_density](name:volume_averaged_oxygen_density)\
    \ provides the plasma-volume\u2013weighted counterpart, while analogous chord-averaged\
    \ densities for other impurity species include [line_averaged_nitrogen_density](name:line_averaged_nitrogen_density)\
    \ and [line_averaged_carbon_density](name:line_averaged_carbon_density).\n\nSign\
    \ convention: Positive when oxygen impurity particles are present along the measurement\
    \ chord at nonzero concentration."
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:oxygen_density
  - name:volume_averaged_oxygen_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_carbon_density
  arguments:
  - name: oxygen_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/line_average/n_i/oxygen/value
    dd_path: summary/line_average/n_i/oxygen/value
    status: composed
- name: requested_lower_voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Requested low-voltage supply setpoint for a neutron detector module.
    It is the commanded target potential difference for detector electronics operation,
    not a measured detector signal.
  documentation: 'The requested low-voltage supply setpoint is the target electrical
    potential difference commanded for the low-voltage power supply associated with
    a neutron detector module. It represents the intended operating point of the detector
    electronics supply rather than the voltage actually delivered at the terminals.


    The setpoint is defined as the commanded potential difference between the regulated
    low-voltage output and its electrical reference:


    $$

    V_{\mathrm{LV,set}} = \Phi_{\mathrm{out,set}} - \Phi_{\mathrm{ref}}

    $$


    where $V_{\mathrm{LV,set}}$ is the requested low-voltage setpoint in volts (V),
    $\Phi_{\mathrm{out,set}}$ is the commanded output-terminal electric potential
    in volts (V), and $\Phi_{\mathrm{ref}}$ is the associated supply return or electrical
    reference potential in volts (V).


    This quantity is produced by the detector control or configuration system as the
    target for a regulated low-voltage supply. It should be distinguished from the
    high-voltage bias command represented by [requested upper voltage of neutron detector](name:requested_upper_voltage_of_neutron_detector)
    and from detector signal voltages such as [voltage of neutron detector](name:voltage_of_neutron_detector).
    When an actual low-voltage monitor is available, this setpoint is the reference
    value against which the achieved supply voltage is assessed.


    Typical values are device-specific and set by the detector electronics design.
    Low-voltage detector supplies are commonly commanded to nominal service rails
    of a few V to a few tens of V; allowable zero, standby, bipolar, or negative-rail
    commands depend on the particular supply and detector module.


    Sign convention: Positive when the commanded low-voltage supply output terminal
    is at higher electric potential than its associated supply return or electrical
    reference terminal.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:requested_upper_voltage_of_neutron_detector
  - name:voltage_of_neutron_detector
  - name:peak_voltage_of_neutron_detector
  sources:
  - id: dd:neutron_diagnostic/detector/supply_low_voltage/voltage_set
    dd_path: neutron_diagnostic/detector/supply_low_voltage/voltage_set
    status: composed
  - id: dd:neutron_diagnostic/detectors/supply_low_voltage/voltage_set
    dd_path: neutron_diagnostic/detectors/supply_low_voltage/voltage_set
    status: attached
- name: voltage_of_neutron_detector
  kind: scalar
  status: draft
  description: Instantaneous or sampled raw electrical output voltage of a neutron
    detector module, measured relative to its electronics reference or baseline before
    pulse extraction, filtering, calibration, or conversion to neutron rate.
  documentation: 'Voltage of a neutron detector is the signed electrical potential
    difference produced at the detector output at a specified instant or sample of
    the raw waveform. It represents the direct analog signal relative to an electronics
    reference level or baseline, not a calibrated neutron flux, count rate, pulse
    height, or integrated charge.


    For an output node with electric potential $\Phi_\mathrm{out}(t)$ and a reference
    or baseline potential $\Phi_\mathrm{ref}(t)$, the raw detector voltage is defined
    by:


    $$

    V_\mathrm{raw}(t) = \Phi_\mathrm{out}(t) - \Phi_\mathrm{ref}(t)

    $$


    where $t$ is the sampling time, $\Phi_\mathrm{out}$ is the detector or front-end
    electronics output potential, and $\Phi_\mathrm{ref}$ is the chosen electronics
    ground, bias reference, or estimated baseline.


    In practice this quantity is obtained from the uncalibrated detector readout before
    pulse finding, shaping correction, pile-up rejection, energy calibration, efficiency
    correction, or conversion to neutron rate. For pulsed detectors it is the waveform
    sample value; derived quantities such as pulse maximum, pulse integral, or discriminator
    counts should be treated separately.


    Typical raw amplitudes range from 1e-3-10 V depending on detector type, biasing,
    preamplifier gain, termination, and neutron intensity. Baseline fluctuations and
    electronic noise are often in the 1e-4-1e-2 V range, while large pulses may approach
    the dynamic range or saturation limit of the acquisition electronics.


    Sign convention: Positive when the detector output potential is above the chosen
    electronics reference or baseline potential.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:peak_voltage_of_neutron_detector
  - name:neutron_rate_of_neutron_detector
  sources:
