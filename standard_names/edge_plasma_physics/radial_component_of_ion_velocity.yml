name: radial_component_of_ion_velocity
status: draft
description: Projection of the ion fluid velocity vector onto the major-radius ($R$)
  direction.
documentation: The radial ion velocity $v_{i,R}$ is the component of the ion fluid
  velocity along the major-radius axis $\hat{R}$, measured in m/s. In edge transport
  modeling, this component captures the net radial (cross-field) motion of ions, which
  results from $E \times B$ drifts, diamagnetic drifts, and neoclassical flows. Typical
  magnitudes in tokamak edge plasmas range from $10^0$ to $10^3$ m/s, generally much
  smaller than the parallel flow speed. Positive values indicate ion motion toward
  increasing major radius. This quantity is computed by edge fluid codes on generalized
  grid descriptions and can be inferred experimentally from Mach-probe measurements
  or charge-exchange recombination spectroscopy. See also `ion_diamagnetic_drift_velocity`
  for the diamagnetic contribution and `radial_component_of_ion_momentum_convective_velocity`
  for the convective pinch velocity.
