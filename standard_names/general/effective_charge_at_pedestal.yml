name: effective_charge_at_pedestal
status: draft
cocos_transformation_type: one_like
description: Effective ion charge $Z_{\rm eff}$ evaluated at the pedestal top, indicating
  impurity content in the high-gradient edge transport barrier.
documentation: "The effective charge $Z_{\\rm eff} = \\sum_s n_s Z_s^2 / n_e$ at the\
  \ pedestal top quantifies the weighted impurity content at the radial location where\
  \ the H-mode edge transport barrier establishes its inner boundary. Pedestal $Z_{\\\
  rm eff}$ values are typically 1.2\u20132.5 in ELMy H-mode plasmas, depending on\
  \ wall material and impurity seeding level; elevated values reduce pedestal pressure\
  \ via fuel dilution and increased resistivity. The quantity is usually obtained\
  \ from visible bremsstrahlung line-integrated measurements inverted to local values,\
  \ or from CXRS impurity density profiles combined with the electron density. Its\
  \ value influences ELM stability through the bootstrap current, which scales inversely\
  \ with $Z_{\\rm eff}$. See also `effective_charge_at_magnetic_axis` for the core\
  \ value and `effective_charge_at_plasma_boundary` for the separatrix value."
