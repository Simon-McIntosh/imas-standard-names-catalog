- name: lithium_count
  kind: scalar
  status: active
  description: Lithium count is the amount of lithium represented as an equivalent-electron
    count, with each lithium atom contributing three counts because lithium has atomic
    number 3. It is the lithium-scoped parent for accumulated or phase-specific lithium
    inventories.
  documentation: 'Lithium count is an extensive lithium-only inventory expressed using
    an equivalent-electron counting convention. It represents the amount of lithium
    before specifying an accumulation interval, injection phase, delivery mechanism,
    removal mechanism, or retention locus.


    The equivalent-electron count for lithium is defined by:


    $$

    N_{\mathrm{Li,eq}} = Z_{\mathrm{Li}} N_{\mathrm{Li}}

    $$


    where $N_{\mathrm{Li,eq}}$ is the lithium equivalent-electron count, $N_{\mathrm{Li}}$
    is the number of lithium atoms represented, and $Z_{\mathrm{Li}} = 3$ is the atomic
    number of lithium.


    This quantity is not a multi-species material count; only lithium atoms contribute
    to $N_{\mathrm{Li}}$. More specific phase or interval forms specialize this parent,
    for example [accumulated lithium count](name:accumulated_lithium_count) and [accumulated
    lithium prefill count due to gas injection](name:accumulated_lithium_prefill_count_due_to_gas_injection).
    A rate form such as [lithium source rate due to gas injection](name:lithium_source_rate_due_to_gas_injection)
    is a time derivative of a lithium count rather than a count itself.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_lithium_count
- name: accumulated_lithium_count
  kind: scalar
  status: active
  description: Cumulative lithium delivered by gas injection after plasma breakdown,
    expressed as an equivalent-electron count with three counts per lithium atom.
  documentation: 'This quantity is the post-breakdown gas-injection contribution to
    [lithium count](name:lithium_count), expressed as an equivalent-electron count.
    It includes lithium atoms delivered by gas injection after plasma breakdown and
    excludes prefill delivery and lithium introduced by other mechanisms.


    The defining relation is


    $$

    C_{\mathrm{Li,gas}}(t) = Z_{\mathrm{Li}} N_{\mathrm{Li,gas}}(t) = 3N_{\mathrm{Li,gas}}(t)

    $$


    where $C_{\mathrm{Li,gas}}(t)$ is the cumulative equivalent-electron count, $N_{\mathrm{Li,gas}}(t)$
    is the number of lithium atoms delivered by gas injection since plasma breakdown,
    and $Z_{\mathrm{Li}}=3$ is lithium''s atomic number. The quantity is the time
    integral of the corresponding [lithium gas-injection source rate](name:lithium_source_rate_due_to_gas_injection),
    and is distinct from the [accumulated lithium prefill count](name:accumulated_lithium_prefill_count_due_to_gas_injection).'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:lithium_count
