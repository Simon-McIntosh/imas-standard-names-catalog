- name: line_averaged_electron_temperature
  kind: scalar
  status: active
  description: Energy-equivalent measure of the mean random kinetic energy of the
    bulk electron population, averaged uniformly along a specified plasma chord.
  documentation: 'Line-averaged electron temperature is the energy-equivalent measure
    of the mean random kinetic energy of the bulk electron population, averaged uniformly
    along a specified plasma chord. It is a spatially averaged form of the local [electron
    temperature](name:electron_temperature).


    For a chord of length $L$, the defining relation is


    $$

    T_{e,\mathrm{line}} = \frac{1}{L}\int_0^L T_e(\ell)\,d\ell

    $$


    where $T_e(\ell)$ is the local electron temperature at path coordinate $\ell$,
    $L$ is the chord length, and $T_{e,\mathrm{line}}$ is the resulting line average.


    The average is uniform with respect to distance along the specified chord and
    characterizes the bulk electron population. It differs from the [volume-averaged
    electron temperature](name:volume_averaged_electron_temperature), which averages
    over a confined plasma volume. Fast or suprathermal electrons are excluded unless
    explicitly included in the population being characterized.'
  unit: eV
  physics_domain: particle_measurement_diagnostics
  links:
  - name:electron_temperature
  - name:volume_averaged_electron_temperature
  arguments:
  - name: electron_temperature
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/t_e/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-t_e-value
    dd_documentation:
      leaf: Value
      parent_path: summary/line_average/t_e
      parent: Electron temperature
      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: Electron temperature (Te), line-averaged along a chord through
        the plasma. Represents the thermal energy of the bulk electron population
        averaged along the line of sight.
      kind: template
- name: line_averaged_hydrogen_density
  kind: scalar
  status: active
  description: Number density of hydrogen (protium) ions averaged along a specified
    chord through the plasma, representing path-normalized ion content.
  documentation: 'The line-averaged hydrogen density quantifies the chord-averaged
    concentration of protium ions along a specified path through the plasma. It is
    derived from the local [hydrogen density](name:hydrogen_density) and excludes
    neutral atomic hydrogen and heavier hydrogen isotopes.


    The line-averaged density $\overline{n}_H$ is defined as


    $$

    \overline{n}_H = \frac{1}{L}\int_0^L n_H(l)\,dl

    $$


    where $n_H(l)$ is the local hydrogen-ion number density at path coordinate $l$,
    and $L$ is the chord length. The average is over path length rather than plasma
    volume; the corresponding volume average is [volume_averaged_hydrogen_density](name:volume_averaged_hydrogen_density).'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
