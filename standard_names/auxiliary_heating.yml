- name: x_component_of_third_unit_vector_of_beam_source
  kind: scalar
  status: draft
  description: X-axis projection of the third local unit vector that completes the
    right-handed orientation frame of a beam source, diagnostic aperture, or optical
    element in the Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.
  documentation: 'The third unit vector $\hat{e}_3$ of a beam source forms the third
    axis of a right-handed local orthonormal triad $\{\hat{e}_1, \hat{e}_2, \hat{e}_3\}$
    that fully specifies the geometric orientation of the source or aperture element.
    Its x-component is the projection $e_{3,x} = \hat{e}_3 \cdot \hat{x}$, where $\hat{x}$
    is the Cartesian axis in the right-handed frame $(\hat{x}, \hat{y}, \hat{z})$
    with $\hat{z}$ vertical. Because $\hat{e}_3$ is a unit vector, its three Cartesian
    projections satisfy $e_{3,x}^2 + e_{3,y}^2 + e_{3,z}^2 = 1$, so this component
    is bounded in $[-1, 1]$. In practice the triad is determined from engineering
    survey data or from the geometric configuration of the NBI injector, EC mirror,
    or diagnostic filter window, and is used to transform beam-aligned quantities
    into the machine Cartesian frame for ray-tracing and power-deposition calculations.
    The complementary projections are captured by the y- and z-components of the same
    vector, and the full orientation context is provided by [third_unit_vector_of_beam_source](name:third_unit_vector_of_beam_source).
    The first and second unit vectors of the same frame are described by the analogous
    families whose x-components are [x_component_of_first_unit_vector_of_beam_source](name:x_component_of_first_unit_vector_of_beam_source);
    the same decomposition for diagnostic antennas is [third_unit_vector_x_component_of_diagnostic_antenna](name:third_unit_vector_x_component_of_diagnostic_antenna).


    Sign convention: Positive when the projection of $\hat{e}_3$ onto $\hat{x}$ is
    in the direction of increasing $x$ in the right-handed Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:third_unit_vector_of_beam_source
  - name:x_component_of_first_unit_vector_of_beam_source
  - name:third_unit_vector_x_component_of_diagnostic_antenna
  constraints: []
  arguments:
  - name: third_unit_vector_of_beam_source
    operator: component
    operator_kind: projection
    axis: x
    shape: component
  sources:
  - id: dd:nbi/unit/source/x3_unit_vector/x
    dd_path: nbi/unit/source/x3_unit_vector/x
    status: composed
- name: x_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: draft
  description: X-axis projection of the third unit vector in the orthonormal triad
    that defines the local orientation frame of an electron cyclotron (EC) launcher
    mirror, expressed in the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$
    frame.
  documentation: 'The [third unit vector of the EC launcher mirror](name:third_unit_vector_of_electron_cyclotron_launcher_mirror)
    completes the right-handed orthonormal triad that fully specifies the mirror''s
    spatial orientation for beam-steering calculations. Its $x$-component is the dot
    product $\hat{e}_3 \cdot \hat{x}$, where $\hat{e}_3$ is the third local axis of
    the mirror frame and $\hat{x}$ is the global Cartesian axis in the right-handed
    $( \hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}$ vertical. Together with the
    [y-component](name:y_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror)
    and the [z-component](name:z_component_of_third_unit_vector_of_electron_cyclotron_launcher_mirror),
    the three Cartesian projections satisfy $e_{3x}^2 + e_{3y}^2 + e_{3z}^2 = 1$ by
    construction. The triad is determined from the mechanical geometry of the launcher,
    with the third axis often aligned with the mirror normal or a defined reference
    direction; values therefore lie in $[-1, 1]$ and are set at configuration time
    rather than measured dynamically. The [x-component of the first unit vector](name:x_component_of_first_unit_vector_of_electron_cyclotron_launcher_mirror)
    and the [x-component of the direction unit vector](name:x_component_of_direction_unit_vector_of_electron_cyclotron_launcher_mirror)
    are the analogous projections for the first axis and the mirror movement direction,
    respectively.


    Sign convention: Positive when the third unit vector has a positive projection
    onto the $+\hat{x}$ Cartesian axis.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:third_unit_vector_of_electron_cyclotron_launcher_mirror
