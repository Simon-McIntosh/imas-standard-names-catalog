      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "First inclination angle (alpha, \u03B1) of the oblique (trapezoidal/parallelogram)\
        \ cross-sectional geometry of an active PF coil element. Part of the oblique\
        \ geometry parameterisation for non-rectangular conductor cross-sections."
      kind: llm
- name: radial_coordinate_of_ferritic_element_centroid
  kind: scalar
  status: active
  description: "Non-negative major-radius coordinate locating a ferritic-element geometric\
    \ centroid in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the non-negative major-radius coordinate $R$ of
    the geometric centroid of a ferritic element. In the right-handed cylindrical
    $(R,\phi,Z)$ frame, $R$ is measured from the machine symmetry axis and identifies
    the centroid''s radial location.


    For the same centroid, the radial coordinate is related to its Cartesian coordinates
    by:


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $x$ and $y$ are the signed Cartesian coordinates of the centroid in the
    right-handed Cartesian $(x,y,z)$ frame. The corresponding [x coordinate of the
    ferritic-element centroid](name:x_coordinate_of_ferritic_element_centroid), [y
    coordinate of the ferritic-element centroid](name:y_coordinate_of_ferritic_element_centroid),
    and [z coordinate of the ferritic-element centroid](name:z_coordinate_of_ferritic_element_centroid)
    locate the same geometric point.


    This is an absolute major-radius coordinate, not a signed local offset, radial
    extent, outer radius, or curvature radius.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:x_coordinate_of_ferritic_element_centroid
  - name:y_coordinate_of_ferritic_element_centroid
  - name:z_coordinate_of_ferritic_element_centroid
  sources:
