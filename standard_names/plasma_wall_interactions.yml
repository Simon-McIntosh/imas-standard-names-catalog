- name: ion_charge_state_particle_flux_at_wall
  kind: scalar
  status: active
  description: Incident particle flux of ions in a specified charge state arriving
    at the plasma-facing wall per unit area per unit time.
  documentation: "The ion charge-state particle flux at the wall is the rate per unit\
    \ area at which ions of a specified charge state impinge on a plasma-facing material\
    \ surface from the plasma side. It is the charge-state-resolved refinement of\
    \ [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall), which aggregates\
    \ this quantity over all ion charge states.\n\nFor ions in charge state $q$ with\
    \ velocity distribution function $f_q(\\mathbf{v})$, the incident flux is\n\n\
    $$\n\\Gamma_q = \\int_{\\mathbf{v}\\cdot\\hat{n} < 0} f_q(\\mathbf{v})\\,|\\mathbf{v}\\\
    cdot\\hat{n}|\\,d^3v\n$$\n\nwhere $\\hat{n}$ is the inward-pointing wall-normal\
    \ unit vector and the integration extends over velocities directed toward the\
    \ surface. Summing $\\Gamma_q$ over all charge states recovers [ion_particle_flux_at_wall](name:ion_particle_flux_at_wall);\
    \ summing further over all species \u2014 including electrons and neutrals \u2014\
    \ recovers the parent [particle_flux_at_wall](name:particle_flux_at_wall).\n\n\
    This quantity is non-negative and is distinct from [neutral_particle_flux_at_wall](name:neutral_particle_flux_at_wall),\
    \ which counts uncharged species arriving at the wall."
  unit: m^-2.s^-1
