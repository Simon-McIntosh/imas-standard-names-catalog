- name: toroidal_flux_surface_averaged_krypton_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: "Density-weighted toroidal bulk velocity of krypton ions, averaged\
    \ over all ionization states and the last closed magnetic flux surface in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Flux-surface-averaged toroidal krypton velocity is the density-weighted
    mean over all krypton ionization states on the plasma boundary, identified with
    the last closed magnetic flux surface. The toroidal direction is the direction
    of increasing angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.


    $$

    \left\langle v_{\phi,\mathrm{Kr}}\right\rangle_{\mathrm{FS},b} = \frac{\displaystyle\oint_{\psi=\psi_b}
    \left(\sum_q n_{\mathrm{Kr}^{q+}} v_{\phi,\mathrm{Kr}^{q+}}\right)\frac{dl}{B_p}}{\displaystyle\oint_{\psi=\psi_b}
    \left(\sum_q n_{\mathrm{Kr}^{q+}}\right)\frac{dl}{B_p}}

    $$


    Here $q$ indexes krypton ionization states, $n_{\mathrm{Kr}^{q+}}$ is the number
    density of state $q$ in m$^{-3}$, $v_{\phi,\mathrm{Kr}^{q+}}$ is its toroidal
    bulk velocity, $dl$ is poloidal arc length, $B_p$ is the poloidal magnetic-field
    magnitude, and $\psi_b$ labels the boundary surface. This species-resolved quantity
    differs from the total-ion quantity [toroidal flux-surface-averaged ion velocity
    at the plasma boundary](name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary);
    its locus differs from [toroidal krypton velocity at the magnetic axis](name:toroidal_krypton_velocity_at_magnetic_axis).


    Sign convention: Positive when the krypton-ion bulk velocity points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary
