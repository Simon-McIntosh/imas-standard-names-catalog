name: ion_heating_power
status: draft
description: Total power coupled into all thermal ion species, summing contributions
  from auxiliary heating, collisional exchange, and other energy transfer channels.
documentation: "The ion heating power $P_i$ (W) represents the volume-integrated net\
  \ rate of energy transfer into the bulk (thermal) ion population. Contributors include\
  \ neutral beam injection (NBI) ion heating, ion cyclotron resonance heating (ICRH),\
  \ electron\u2013ion collisional energy exchange $P_{ei}$, ohmic coupling via resistive\
  \ dissipation, and alpha-particle thermalization in burning plasmas. In steady-state\
  \ power balance the ion energy equation integrates to $$P_i = \\int \\left(\\nabla\
  \ \\cdot \\mathbf{q}_i + P_{\\mathrm{rad},i} + P_{\\mathrm{cx}} + \\frac{\\partial}{\\\
  partial t}\\left(\\tfrac{3}{2} n_i T_i\\right)\\right) dV,$$ where $\\mathbf{q}_i$\
  \ is the ion heat flux (W m$^{-2}$), $P_{\\mathrm{rad},i}$ the ion radiative loss\
  \ density (W m$^{-3}$), $P_{\\mathrm{cx}}$ the charge-exchange loss density (W m$^{-3}$),\
  \ $n_i$ the ion density (m$^{-3}$), and $T_i$ the ion temperature (eV). Typical\
  \ global values are 1\u201320 MW in present-day medium-size tokamaks and projected\
  \ to reach 50\u2013100 MW in ITER. The quantity is computed from power-balance analysis\
  \ using measured kinetic profiles or from integrated transport modeling codes (TRANSP,\
  \ JINTRAC). See `heating_power_due_to_neutral_beam_injection` for the NBI component,\
  \ `total_radiated_power` for the radiative loss channel, and `ion_radiated_power_density`\
  \ for spectral radiation losses."
