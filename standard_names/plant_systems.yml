    dd_path: summary/gas_injection_accumulated/helium_4/value
    status: composed
  - id: dd:summary/gas_injection_prefill/helium_4/value
    dd_path: summary/gas_injection_prefill/helium_4/value
    status: composed
- name: accumulated_krypton_count
  kind: scalar
  status: draft
  description: Cumulative number of krypton atoms injected into the machine since
    plasma breakdown, expressed in equivalent electrons.
  documentation: 'The accumulated krypton count is the running total of krypton atoms
    introduced since plasma breakdown, converted to an electron-equivalent basis where
    each krypton atom contributes $Z_{\rm Kr} = 36$ electron equivalents when fully
    stripped of its bound electrons.


    The quantity is obtained by integrating the instantaneous injection rate $\dot{N}_{\rm
    Kr}$ over time from the moment of plasma breakdown $t_0$:


    $$

    N_{\rm Kr,eq} = Z_{\rm Kr} \int_{t_0}^{t} \dot{N}_{\rm Kr}(t'') \, dt''

    $$


    where $Z_{\rm Kr} = 36$ is the atomic number of krypton and $\dot{N}_{\rm Kr}$
    is in atoms per second. This is distinct from the prefill-phase contribution captured
    by [krypton_prefill_count](name:krypton_prefill_count), which records only the
    gas load introduced before breakdown. Krypton serves as a heavy radiative seed
    impurity for power exhaust management and as a disruption mitigation agent; the
    cumulative injection inventory is therefore essential for interpreting bolometric
    radiated-power fractions and spectroscopic charge-state distributions throughout
    the discharge. Analogous running totals are defined for other injected species,
    including [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Sign convention: Positive when krypton has been cumulatively injected into the
    plasma since breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:krypton_prefill_count
  - name:accumulated_neon_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/krypton/value
    dd_path: summary/gas_injection_accumulated/krypton/value
    status: composed
- name: accumulated_lithium_count
  kind: scalar
  status: draft
  description: Cumulative amount of lithium supplied by gas injection after plasma
    breakdown, reported as an equivalent-electron count. Each lithium atom contributes
    3 equivalent electrons, so the value is three times the injected lithium atom
    count over the post-breakdown interval.
  documentation: 'Accumulated lithium count is the cumulative lithium supplied by
    gas injection after plasma breakdown, converted to an equivalent-electron count
    using the lithium atomic number 3. It excludes lithium present before breakdown
    or introduced by other sources unless those sources are part of the gas-injection
    flow being integrated. The corresponding accumulated lithium atom count, comparable
    to [lithium_count](name:lithium_count) when that quantity represents an inventory
    or prefill amount, is one third of this value.


    The accumulated equivalent-electron count at time $t$ is defined by integrating
    the lithium atom injection rate from breakdown to that time:


    $$

    N_{\mathrm{Li,eqe}}(t) = 3 \int_{t_\mathrm{bd}}^{t} \Gamma_{\mathrm{Li}}(t'')
    \, dt''

    $$


    where $N_{\mathrm{Li,eqe}}$ is the accumulated lithium count expressed as equivalent
    electrons, $\Gamma_{\mathrm{Li}}$ is the neutral lithium atom flow rate delivered
    by gas injection in atoms/s, $t''$ is the integration time in seconds, $t_\mathrm{bd}$
    is the plasma-breakdown time, and the factor 3 is the atomic number of lithium.


    In practice this quantity is computed by time-integrating calibrated gas-injection
    throughput, valve-command, pressure-drop, or mass-flow measurements after conversion
    to a lithium atom flow rate. Corrections may account for valve response, conductance
    of the injection line, reservoir temperature, and uncertainty in the fraction
    of commanded material that enters the plasma chamber.


    Typical values depend strongly on device size and seeding scenario. Small experiments
    may accumulate about $10^{17}-10^{19}$ lithium atoms, corresponding to $3 \times
    10^{17}-3 \times 10^{19}$ equivalent electrons, while deliberate injection in
    medium or large tokamak discharges can reach about $10^{19}-10^{21}$ lithium atoms,
    corresponding to $3 \times 10^{19}-3 \times 10^{21}$ equivalent electrons.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_neon_count
  - name:accumulated_argon_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/lithium/value
    dd_path: summary/gas_injection_accumulated/lithium/value
    status: composed
- name: accumulated_neon_count
  kind: scalar
  status: draft
  description: Cumulative number of neon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons.
  documentation: "The accumulated neon count is the running temporal integral of the\
    \ neon gas injection rate from plasma breakdown onward, giving the total neon\
    \ inventory delivered to the plasma vessel over the discharge. Each injected neon\
    \ atom contributes to the tally in equivalent-electron units \u2014 the raw particle\
    \ count scaled by the neon atomic number $Z_\\mathrm{Ne} = 10$ \u2014 enabling\
    \ direct comparison with other injected fuel and impurity species.\n\nThe defining\
    \ integral is:\n\n$$\nN_\\mathrm{acc}(t) = Z_\\mathrm{Ne} \\int_{t_0}^{t} \\dot{n}_\\\
    mathrm{Ne}(t') \\, dt'\n$$\n\nwhere $\\dot{n}_\\mathrm{Ne}$ is the instantaneous\
    \ neon injection rate in atoms per second, $t_0$ is the time of plasma breakdown,\
    \ and $Z_\\mathrm{Ne} = 10$ is the neon atomic number.\n\nThis quantity is determined\
    \ from calibrated gas valve flow measurements integrated temporally throughout\
    \ the discharge. It is particularly relevant in impurity seeding and disruption\
    \ mitigation experiments where the cumulative neon dose governs radiated power\
    \ fractions and pedestal stability.\n\nThe parent [neon_count](name:neon_count)\
    \ provides phase-specific or instantaneous counts; [neon_prefill_count](name:neon_prefill_count)\
    \ covers the pre-breakdown injection phase exclusively. Analogous accumulated\
    \ quantities for other injected species include [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection)\
    \ and [accumulated_carbon_count_due_to_gas_injection](name:accumulated_carbon_count_due_to_gas_injection).\n\
    \nSign convention: Positive when neon gas is injected, so the accumulated count\
    \ increases monotonically from zero at plasma breakdown."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:neon_count
  - name:neon_prefill_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/neon/value
    dd_path: summary/gas_injection_accumulated/neon/value
    status: composed
- name: accumulated_propane_count
  kind: scalar
  status: draft
  description: Accumulated propane count is the time-integrated amount of injected
    propane after plasma breakdown, converted to the number of electrons contained
    in the corresponding neutral propane molecules. One propane molecule contributes
    26 equivalent electrons.
  documentation: 'Accumulated propane count is the cumulative amount of propane gas
    injected after plasma breakdown, expressed as an equivalent-electron count. It
    is an atomic-accounting quantity: a neutral propane molecule, $\mathrm{C_3H_8}$,
    contains 26 electrons, so the value is 26 times the number of injected propane
    molecules rather than a direct measurement of plasma electrons.


    The count at time $t$ can be defined from the molecular injection rate:


    $$

    N_{\mathrm{C_3H_8,eq}}(t) = 26 \int_{t_{\mathrm{bd}}}^{t} \Phi_{\mathrm{C_3H_8}}(t'')\,dt''

    $$


    where $N_{\mathrm{C_3H_8,eq}}$ is dimensionless, $\Phi_{\mathrm{C_3H_8}}$ is the
    propane molecular flow rate in molecules s$^{-1}$, $t$, $t''$, and the breakdown
    time $t_{\mathrm{bd}}$ are in seconds, and $26 = 3\times6 + 8\times1$ is the number
    of bound electrons in one neutral propane molecule.


    In practice, the value is computed by integrating a calibrated propane flow over
    the interval beginning at plasma breakdown. If the available flow is molar, in
    mol s$^{-1}$, it is first multiplied by Avogadro''s constant to obtain molecules
    s$^{-1}$; if it is given as a gas throughput or volume flow, it is converted to
    molecule rate using the relevant gas calibration before applying the electron-count
    conversion. The quantity complements [propane_prefill_count](name:propane_prefill_count)
    for pre-breakdown inventory and is analogous to [accumulated_ethane_count](name:accumulated_ethane_count)
    for another hydrocarbon species.


    Typical values are 0 when no propane is injected, about $10^{18}$-$10^{21}$ for
    small trace or impurity-seeding puffs, and up to $10^{22}$-$10^{23}$ for larger
    or longer injections. These values represent injected inventory; they do not by
    themselves specify the retained amount, ionization fraction, or resulting plasma
    electron density.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:propane_prefill_count
  - name:accumulated_ethane_count
  - name:accumulated_carbon_count_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/propane/value
    dd_path: summary/gas_injection_accumulated/propane/value
    status: composed
- name: accumulated_silane_count
  kind: scalar
  status: draft
  description: Accumulated silane gas injection since plasma breakdown, expressed
    as an equivalent-electron count.
  documentation: 'Accumulated silane count is the time-integrated amount of silane,
    SiH4, injected into the plasma after breakdown. The count is dimensionless and
    uses an equivalent-electron convention: one SiH4 molecule corresponds to 18 equivalent
    electrons, from silicon with atomic number 14 and four hydrogen atoms with atomic
    number 1.


    The accumulated count at time $t$ is defined from the silane source rate by


    $$

    N_{\mathrm{SiH_4,acc}}(t) = \int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{SiH_4,eq}}(t'')\,dt''
    = 18\int_{t_{\mathrm{bd}}}^{t} \dot{N}_{\mathrm{SiH_4,mol}}(t'')\,dt''

    $$


    where $N_{\mathrm{SiH_4,acc}}$ is the accumulated dimensionless equivalent-electron
    count, $t_{\mathrm{bd}}$ is the plasma-breakdown time in seconds, $t''$ is time
    in seconds, $\dot{N}_{\mathrm{SiH_4,eq}}$ is the equivalent-electron source rate
    in s^-1, and $\dot{N}_{\mathrm{SiH_4,mol}}$ is the molecular silane injection
    rate in molecules per second. The factor 18 is a counting convention for the injected
    molecular species, not a statement that neutral SiH4 supplies free electrons before
    dissociation or ionization.


    In practice this quantity is computed by integrating the calibrated [silane source
    rate](name:silane_source_rate) from plasma breakdown onward. Gas present as vessel
    prefill or static inventory before breakdown is excluded; only deliberately injected
    silane during the plasma discharge contributes.


    Typical values are 0 for discharges without silane injection. When silane is deliberately
    puffed for wall conditioning or impurity seeding, accumulated values are often
    about 10^18-10^22 in the dimensionless equivalent-electron count, depending on
    pulse duration, valve calibration, and injection recipe.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:silane_source_rate
  - name:accumulated_xenon_count
  - name:accumulated_argon_count
  sources:
  - id: dd:summary/gas_injection_accumulated/silane/value
    dd_path: summary/gas_injection_accumulated/silane/value
    status: composed
- name: accumulated_total_particle_count_due_to_gas_injection
  kind: scalar
  status: draft
  description: Cumulative number of particles delivered by gas injection since plasma
    breakdown, summed over all injected species and converted to an equivalent-electron
    count. The count resets at each new plasma breakdown event and is non-decreasing
    within a discharge while injection continues.
  documentation: 'Accumulated total particle count due to gas injection is the time-integrated
    amount of neutral gas delivered after plasma breakdown, summed over all injection
    systems and injected species. Each species is weighted by the number of electrons
    carried by one neutral injected particle when fully ionized, so the result is
    a dimensionless equivalent-electron count rather than a molecule count alone.
    The accumulator is reset to zero at each new plasma breakdown event.


    The accumulated count can be written as the species-weighted time integral of
    the injection rates:


    $$

    N_{\mathrm{tot}}(t) = \sum_s Z_s^{\mathrm{eq}} \int_{t_{\mathrm{bd}}}^{t} \Gamma_s(t'')
    \, dt''

    $$


    where $N_{\mathrm{tot}}$ is the dimensionless equivalent-electron count, $t_{\mathrm{bd}}$
    is the plasma-breakdown time, $\Gamma_s$ is the neutral-particle injection rate
    of species $s$ in $s^{-1}$, and $Z_s^{\mathrm{eq}}$ is the number of bound electrons
    in one neutral injected particle of species $s$ when fully ionized. With non-negative
    injection rates the value is monotonic between resets and remains constant between
    gas pulses.


    In practice, this quantity is computed by integrating calibrated gas-valve throughput,
    flow-meter measurements, or reconstructed injected particle rates over time, then
    applying the species weights before summing. It uses the same equivalent-electron
    normalization as [accumulated_total_gas_count](name:accumulated_total_particle_count_due_to_gas_injection),
    while specifically identifying the contribution from gas injection. If injector
    groups are reported separately, [accumulated_total_lower_gas_particle_count_due_to_gas_injection](name:accumulated_gas_particle_count_at_inlet_due_to_gas_injection)
    and accumulated_total_upper_gas_particle_count_due_to_gas_injection are partial
    sums whose total equals the vessel-wide value when the partition covers all gas
    injectors.


    Typical accumulated values are $10^{20}$-$10^{23}$ equivalent electrons for small
    or short-pulse experiments and $10^{22}$-$10^{25}$ equivalent electrons for larger
    tokamak discharges, depending on fueling rate, pulse duration, gas species, and
    whether large pre-programmed gas puffs are included. Short diagnostic or impurity
    puffs can contribute smaller increments, often $10^{18}$-$10^{21}$ equivalent
    electrons.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_gas_particle_count_at_inlet_due_to_gas_injection
  sources:
  - id: dd:summary/gas_injection_accumulated/total/value
    dd_path: summary/gas_injection_accumulated/total/value
    status: attached
  - id: dd:summary/gas_injection_prefill/total/value
    dd_path: summary/gas_injection_prefill/total/value
    status: composed
- name: accumulated_xenon_count
  kind: scalar
  status: draft
  description: Cumulative number of xenon atoms from gas injection accumulated since
    plasma breakdown, expressed in equivalent electrons, where each xenon atom contributes
    54 equivalent electrons corresponding to its atomic number Z = 54.
  documentation: "The accumulated xenon count tracks the total xenon atoms introduced\
    \ by gas injection from plasma breakdown onward, expressed as a dimensionless\
    \ equivalent-electron tally in which each neutral xenon atom contributes 54 counts\
    \ equal to its atomic number $Z_{\\mathrm{Xe}} = 54$.\n\nThe defining integral\
    \ is:\n\n$$\nN_{\\mathrm{Xe,eq}}(t) = 54 \\int_{t_{\\mathrm{bd}}}^{t} \\frac{dN_{\\\
    mathrm{Xe}}}{dt'} \\, dt'\n$$\n\nwhere $dN_{\\mathrm{Xe}}/dt'$ is the instantaneous\
    \ xenon injection rate in atoms s$^{-1}$, $t_{\\mathrm{bd}}$ is the time of plasma\
    \ breakdown in s, and $N_{\\mathrm{Xe,eq}}$ is dimensionless. The prefill xenon\
    \ inventory prior to breakdown is excluded from this integral and is tracked separately\
    \ by [accumulated_xenon_prefill_count](name:accumulated_xenon_prefill_count).\n\
    \nThe instantaneous injection rate contributing to this integral is characterized\
    \ by [xenon_source_rate](name:xenon_source_rate). Xenon is employed as a high-$Z$\
    \ impurity in disruption mitigation and radiative cooling experiments; in massive\
    \ gas injection scenarios the equivalent-electron count can reach $10^{23}$\u2013\
    $10^{24}$. For lighter noble gas comparisons, see [accumulated_neon_count](name:accumulated_neon_count)\
    \ ($Z = 10$) and [accumulated_krypton_count](name:accumulated_krypton_count) ($Z\
    \ = 36$).\n\nSign convention: Positive when xenon gas is injected into the vessel\
    \ after plasma breakdown, incrementing the cumulative count."
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_xenon_prefill_count
  - name:xenon_source_rate
  - name:accumulated_neon_count
  - name:accumulated_krypton_count
  sources:
  - id: dd:summary/gas_injection_accumulated/xenon/value
    dd_path: summary/gas_injection_accumulated/xenon/value
    status: composed
- name: accumulated_xenon_prefill_count
  kind: scalar
  status: draft
  description: Accumulated xenon prefill count is the end-of-prefill neutral xenon
    inventory expressed as an equivalent-electron count. Each xenon atom contributes
    54 to the dimensionless count.
  documentation: 'Accumulated xenon prefill count is the scalar final value of the
    xenon gas dose introduced during the plasma prefill interval, expressed as an
    equivalent-electron count rather than as a count of neutral atoms. The conversion
    uses the xenon atomic number, so each neutral xenon atom contributes 54 equivalent
    electrons to the dimensionless count with unit 1.


    The end-of-prefill count is defined from the integrated neutral xenon atom flow
    over the prefill time window:


    $$

    N_{\mathrm{Xe,prefill}}^{\mathrm{eq}}(t_{\mathrm{end}}) = 54\,N_{\mathrm{Xe,prefill}}(t_{\mathrm{end}})
    = 54 \int_{t_{\mathrm{start}}}^{t_{\mathrm{end}}} \dot{N}_{\mathrm{Xe}}(t)\,dt

    $$


    where $N_{\mathrm{Xe,prefill}}^{\mathrm{eq}}$ is the accumulated equivalent-electron
    count, $N_{\mathrm{Xe,prefill}}$ is the accumulated number of xenon atoms, $\dot{N}_{\mathrm{Xe}}$
    is the neutral xenon atom flow rate in atoms per second, $t_{\mathrm{start}}$
    is the start of prefill injection, and $t_{\mathrm{end}}$ is the end of the prefill
    interval, usually before plasma breakdown.


    In practice the value is computed by integrating a calibrated xenon gas-flow or
    inventory estimate over the prefill interval. It is an accumulated final-time
    dose, not an instantaneous flow rate, and is the xenon-specific prefill analog
    of [accumulated_xenon_count](name:accumulated_xenon_count) when restricted to
    the prefill phase.


    Typical values are highly device- and scenario-dependent because prefill dosing
    depends on vessel volume, pumping, gas-valve calibration, and the intended initial
    neutral composition; the standard name therefore specifies the counting convention
    rather than a universal numerical range.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_prefill_count
  - name:krypton_prefill_count
  - name:accumulated_hydrogen_prefill_count
  sources:
  - id: dd:summary/gas_injection_prefill/xenon/value
    dd_path: summary/gas_injection_prefill/xenon/value
    status: composed
- name: ammonia_prefill_count
  kind: scalar
  status: draft
  description: Accumulated ammonia gas injected during the plasma prefill phase, expressed
    as an equivalent-electron count.
  documentation: 'Ammonia prefill count is the accumulated amount of NH$_3$ introduced
    before plasma breakdown, expressed as the number of bound electrons carried by
    the injected neutral molecules. The convention uses the full stoichiometric electron
    content of ammonia, not the instantaneous ionization state of the gas.


    For a number of injected ammonia molecules $N_{\mathrm{NH_3}}$, the equivalent-electron
    count is


    $$

    N_{e,\mathrm{eq}} = 10\,N_{\mathrm{NH_3}}

    $$


    where the factor 10 is the total electron count of one neutral NH$_3$ molecule:
    7 from nitrogen and 3 from hydrogen.


    In practice this quantity is computed from the time-integrated ammonia gas throughput
    during the prefill interval, using calibrated valve, pressure, flow, or reservoir-depletion
    measurements to infer the number of NH$_3$ molecules delivered. It is specific
    to the prefill phase and is conceptually distinct from an accumulated ammonia
    count over a longer or differently defined injection interval.


    Typical values are strongly device and scenario dependent. Small conditioning
    or trace-species prefills may be around $10^{19}$-$10^{21}$ equivalent electrons,
    while larger dedicated molecular-gas prefills can reach $10^{22}$-$10^{23}$ equivalent
    electrons or more.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:nitrogen_prefill_count
  - name:ethylene_prefill_count
  - name:accumulated_ammonia_count
  sources:
