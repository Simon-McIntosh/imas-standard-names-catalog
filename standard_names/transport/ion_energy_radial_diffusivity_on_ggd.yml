name: ion_energy_radial_diffusivity_on_ggd
status: draft
description: Radial diffusion coefficient for ion energy transport, evaluated on a
  generalized grid description (GGD), quantifying cross-field thermal conduction.
documentation: 'The radial energy diffusivity $\chi_i^{\rm rad}$ (m$^2$\,s$^{-1}$)
  enters the ion energy transport equation as the coefficient relating the radial
  ion heat flux $q_i^{\rm rad}$ to the radial gradient of ion temperature: $q_i^{\rm
  rad} = -n_i \chi_i^{\rm rad} \nabla_r T_i$, where $n_i$ is the ion number density
  (m$^{-3}$) and $T_i$ is the ion temperature (eV). On a generalized grid description
  (GGD), one scalar value is provided per grid element, enabling representation on
  unstructured meshes typical of edge and scrape-off-layer simulations. Typical core
  values in tokamak H-mode plasmas range from 0.5 to 5 m$^2$\,s$^{-1}$, while edge
  and SOL values can exceed 10 m$^2$\,s$^{-1}$ depending on turbulence levels. The
  quantity is computed by integrated-modeling transport codes (e.g., SOLPS-ITER, SOLEDGE2D)
  or derived from experimental power-balance analysis. See also the radial ion energy
  flux and ion temperature for related quantities.'
