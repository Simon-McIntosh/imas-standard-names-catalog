- name: x1_coordinate_of_reflectometer_antenna
  kind: scalar
  status: draft
  description: Positions of the reflectometer antenna aperture outline vertices along
    the X1 axis of the local (X1, X2) orthogonal coordinate frame.
  documentation: 'The X1 coordinate positions define the vertices of the aperture
    polygon of a reflectometer antenna projected onto the first axis of the local
    orthogonal (X1, X2) frame attached to the antenna element. Together with [x2_coordinate_of_reflectometer_antenna](name:x2_coordinate_of_reflectometer_antenna),
    the X1 coordinates fully characterize the two-dimensional cross-sectional shape
    of the emission or detection aperture for both profile and fluctuation reflectometer
    channels.


    Reflectometers probe plasma electron density by transmitting microwaves that reflect
    from density cutoff layers; the detailed aperture outline described by the X1
    vertex positions determines the launched beam pattern and influences diffraction
    modeling in wave propagation calculations. The [width_of_reflectometer_antenna](name:width_of_reflectometer_antenna)
    provides a scalar summary of the aperture extent derived from the full polygon
    geometry.


    The outline is specified as an ordered polygon in the (X1, X2) plane, with the
    number of vertices chosen to represent non-rectangular aperture shapes. Typical
    aperture dimensions for fusion-relevant reflectometer antennas span a few centimeters
    to several tens of centimeters, depending on operating frequency and the required
    beam directivity.


    Sign convention: Positive when the vertex position lies in the positive X1 direction
    from the local frame origin.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:x2_coordinate_of_reflectometer_antenna
  - name:width_of_reflectometer_antenna
