- name: toroidal_flux_surface_averaged_ion_velocity_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-averaged toroidal bulk-flow velocity of the total ion
    fluid at the plasma boundary, representing the density-weighted mean over all
    ion species and charge states.
  documentation: "The toroidal component of the ion bulk-flow velocity, flux-surface\
    \ averaged over the plasma boundary \u2014 the last closed flux surface forming\
    \ the core\u2013scrape-off-layer interface. For a plasma containing multiple ion\
    \ species and charge states, the ion velocity is the density-weighted mean\n\n\
    $$\nv_\\phi = \\frac{\\sum_s n_s \\, v_{\\phi,s}}{\\sum_s n_s}\n$$\n\nwhere $n_s$\
    \ is the number density and $v_{\\phi,s}$ is the toroidal velocity of species\
    \ $s$, with the sum running over all ion species and charge states present.\n\n\
    The flux-surface average is evaluated as $\\langle A \\rangle = \\oint A \\, dl/B_p\
    \ \\,/\\, \\oint dl/B_p$, where $dl$ is the poloidal arc-length element and $B_p$\
    \ is the poloidal magnetic field magnitude, integrated along the plasma boundary\
    \ flux surface. Species-resolved counterparts such as [toroidal_flux_surface_averaged_nitrogen_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_nitrogen_velocity_at_plasma_boundary)\
    \ and [toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_tritium_velocity_at_plasma_boundary)\
    \ give contributions from individual ion species.\n\nSign convention: Positive\
    \ when $v_\\phi$ points in the direction of increasing toroidal angle $\\phi$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
