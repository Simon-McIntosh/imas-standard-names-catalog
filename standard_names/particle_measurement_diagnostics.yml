      parent: Deuterium
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Deuterium.
      kind: template
- name: line_averaged_deuterium_tritium_density
  kind: scalar
  status: active
  description: Chord-averaged ion number density of the combined deuterium-tritium
    fuel pseudo-species along a specified line of sight.
  documentation: 'The deuterium-tritium density is the chord-averaged ion count per
    unit volume of the fictitious combined fuel pseudo-species formed by merging deuterium
    and tritium ions. It is derived from the local [deuterium-tritium density](name:deuterium_tritium_density)
    along a specified chord.


    The chord average is defined by


    $$

    \bar{n}_{DT} = \frac{1}{L}\int_0^L n_{DT}(l)\,dl

    $$


    where $\bar{n}_{DT}$ is the chord-averaged density, $L$ is the chord length, $l$
    is distance along the chord, and $n_{DT}(l)$ is the local deuterium-tritium pseudo-species
    density. The quantity is a line average and must not be interpreted as the [volume-averaged
    deuterium-tritium density](name:volume_averaged_deuterium_tritium_density); both
    retain the deuterium-plus-tritium aggregation convention.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:deuterium_tritium_density
  - name:volume_averaged_deuterium_tritium_density
  arguments:
  - name: deuterium_tritium_density
    operator: line_averaged
    operator_kind: qualifier
  sources:
  - dd_path: summary/line_average/n_i/deuterium_tritium/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-line_average-n_i-deuterium_tritium-value
    dd_documentation:
