- name: toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Flux-surface-averaged toroidal component of the argon ion bulk flow\
    \ velocity at the plasma boundary, in the right-handed cylindrical (R, \u03C6\
    , Z) frame. It refers to the elemental argon ion population rather than a single\
    \ specified charge state."
  documentation: 'This quantity is the toroidal component of the bulk flow velocity
    of argon ions, averaged over the magnetic flux surface at the plasma boundary,
    usually identified with the last closed flux surface or separatrix. It refers
    to the elemental argon ion population; when individual charge states are not resolved,
    the velocity is interpreted as a density-weighted bulk velocity over the contributing
    argon ion charge states.


    For an axisymmetric boundary flux surface, the flux-surface average can be written
    as a poloidal contour average weighted by the inverse poloidal magnetic-field
    magnitude:


    $$

    \langle v_{\phi,\mathrm{Ar}} \rangle_{\psi_b} = \frac{\oint_{\psi=\psi_b} v_{\phi,\mathrm{Ar}}(l)\,
    B_p(l)^{-1}\, dl}{\oint_{\psi=\psi_b} B_p(l)^{-1}\, dl}

    $$


    where $v_{\phi,\mathrm{Ar}}$ is the toroidal component of the argon ion bulk velocity
    in the right-handed cylindrical $(R, \phi, Z)$ frame, $\psi_b$ labels the boundary
    flux surface, $l$ is poloidal arc length around that surface, and $B_p$ is the
    poloidal magnetic-field magnitude. This expression defines the flux-surface average
    operator for this scalar at the boundary.


    In experiments, argon ion toroidal velocity is commonly inferred from Doppler
    shifts of argon charge-exchange recombination or line-emission spectra, with atomic
    physics, viewing geometry, and spatial mapping to the boundary flux surface taken
    into account. In transport or edge-plasma calculations it may be obtained from
    impurity momentum balance, including parallel transport, friction with main ions,
    electric-field effects, and charge-state coupling.


    Typical edge argon toroidal velocities are on the order of 10^3-5 x 10^4 m.s^-1.
    Values near the plasma boundary can be smaller in weakly rotating plasmas and
    may approach 10^5 m.s^-1 in strongly torqued or pedestal regimes; either sign
    is possible depending on the rotation direction.


    Sign convention: Positive when the argon ion toroidal velocity is in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_argon_velocity_at_plasma_boundary
  - name:argon_density_at_plasma_boundary
  - name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary
