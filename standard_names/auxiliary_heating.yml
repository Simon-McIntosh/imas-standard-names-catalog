- name: vertical_centroid_of_coil_conductor_element
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the geometric centroid of a rectangular coil
    conductor element cross-section, measured in the right-handed cylindrical (R,
    phi, Z) frame.
  documentation: "The vertical centroid coordinate locates the geometric center of\
    \ a rectangular coil conductor element cross-section along the $Z$-axis of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major-radius\
    \ distance from the machine symmetry axis, $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above, and $Z$ is the vertical height.\n\n\
    For a rectangular cross-section with lower edge at $Z_\\text{min}$ and upper edge\
    \ at $Z_\\text{max}$, the centroid is:\n\n$$\nZ_c = \\frac{Z_\\text{min} + Z_\\\
    text{max}}{2}\n$$\n\nwhere $Z_c$ is in meters and coincides with the midpoint\
    \ between the two horizontal bounding edges of the rectangle.\n\nThis geometric\
    \ parameter is specified in engineering design documentation for coil, antenna,\
    \ and passive-structure assemblies, and may be confirmed by physical survey measurements\
    \ before or during machine operation. Paired with the corresponding major-radius\
    \ centroid, it fully characterizes the planar position of each sub-element within\
    \ the poloidal cross-section, providing the input required for Biot\u2013Savart\
    \ magnetic field calculations from individual current-carrying segments. The analogous\
    \ coordinate for the parent coil conductor is captured by [vertical_coordinate_of_coil_conductor](name:vertical_coordinate_of_coil_conductor),\
    \ the generic conductor cross-section center by [vertical_coordinate_of_conductor_cross_section](name:vertical_coordinate_of_conductor_cross_section),\
    \ and the ion cyclotron antenna strap center by [vertical_coordinate_of_antenna_strap](name:vertical_coordinate_of_antenna_strap).\n\
    \nSign convention: Positive when the centroid lies above the machine midplane\
    \ in the direction of increasing $Z$."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_coil_conductor
  - name:vertical_coordinate_of_conductor_cross_section
  - name:vertical_coordinate_of_antenna_strap
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/rectangle/z
    dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/z
    status: attached
- name: vertical_coordinate_of_antenna_strap
  kind: scalar
  status: draft
  description: Vertical Z-coordinate of the geometric center of an antenna strap in
    the right-handed cylindrical (R, phi, Z) frame. It locates the strap along the
    vertical direction and is distinct from the strap height or vertical extent.
  documentation: 'The vertical coordinate of an antenna strap is the $Z$-coordinate
    of the strap''s geometric center in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It locates the conducting strap within an ion-cyclotron antenna module
    for geometric and electromagnetic modeling. This quantity is a center coordinate,
    not the strap height, vertical span, thickness, or spacing to another strap.


    When the strap center is defined as an area centroid of a planar strap face or
    cross-section, the relevant plane is the local meridional plane at fixed $\phi$
    in the right-handed cylindrical $(R, \phi, Z)$ frame:


    $$

    Z_c = \frac{1}{A_\perp}\int_{A_\perp} Z\,dA_\perp

    $$


    where $Z_c$ is the strap-center vertical coordinate, $A_\perp$ is the area enclosed
    by the projected strap contour in that local meridional plane, and $dA_\perp$
    is its area element. For rectangular, annular, or otherwise symmetric strap descriptions,
    this coordinate often reduces to the midpoint between the upper and lower $Z$
    bounds.


    In practice, the value is obtained from mechanical design geometry, metrology,
    or antenna layout models. It is used with the corresponding radial and toroidal
    placement of the strap to determine antenna-plasma spacing, near-field phasing
    geometry, and RF coupling calculations.


    Typical values for midplane-mounted ion-cyclotron antenna straps are about -2
    to 2 m in medium-sized tokamaks; compact devices may be within -1 to 1 m, while
    large devices can place strap centers several meters from the vertical origin.


    Sign convention: Positive when the antenna-strap geometric center lies in the
    $+Z$ direction from the chosen vertical origin in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:height_of_antenna_strap
  - name:vertical_coordinate_of_diagnostic_aperture
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/annulus/z
    dd_path: ic_antennas/antenna/module/strap/geometry/annulus/z
    status: attached
  - id: dd:ic_antennas/antenna/module/strap/geometry/outline/z
    dd_path: ic_antennas/antenna/module/strap/geometry/outline/z
    status: composed
- name: vertical_coordinate_of_aperture
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the geometric center of an aperture in the
    right-handed cylindrical (R, phi, Z) frame.
  documentation: "The vertical coordinate $Z$ locates the geometric center of an aperture\
    \ along the direction parallel to the toroidal symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $Z$ is measured upward from the machine\
    \ midplane. Apertures appear across a wide range of fusion-relevant hardware \u2014\
    \ neutral beam injectors, electron cyclotron launcher ports, optical diagnostic\
    \ slits, and detector entrance windows \u2014 and their vertical positions are\
    \ essential inputs for sight-line reconstruction, ray-tracing, and geometric alignment\
    \ with plasma-facing components. For a given component, this quantity is paired\
    \ with the corresponding radial coordinate to fully specify the 2-D cross-sectional\
    \ location of the aperture center; the analogous quantity for optical elements\
    \ is [vertical_coordinate_of_optical_element](name:vertical_coordinate_of_optical_element),\
    \ which follows an identical convention. Aperture center positions are fixed geometric\
    \ descriptors of the hardware configuration, determined from engineering drawings\
    \ or in-situ survey measurements and updated only when hardware is modified.\n\
    \nSign convention: Positive when the aperture center lies above the machine midplane\
    \ in the $+Z$ direction of the right-handed cylindrical $(R, \\phi, Z)$ frame."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_optical_element
  sources:
  - id: dd:nbi/unit/aperture/centre/z
    dd_path: nbi/unit/aperture/centre/z
    status: attached
- name: vertical_coordinate_of_coil_conductor
  kind: scalar
  status: draft
  description: Vertical coordinate Z of a point on a coil conductor, measured in the
    right-handed cylindrical (R, phi, Z) frame where R is major radius and Z is vertical
    height.
  documentation: 'The vertical coordinate of a coil conductor is the height of a point
    on the current-carrying conductor relative to the horizontal reference plane used
    for the device geometry. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    $R$ is major radius from the toroidal symmetry axis, $\phi$ is toroidal angle,
    and $Z$ is vertical height. This quantity specifies the vertical placement and
    shape of the conductor independently of the current carried by it.


    For a conductor point with position vector $\mathbf{r}$, the vertical coordinate
    is the projection onto the vertical basis direction:


    $$

    Z = \mathbf{r} \cdot \hat{Z}

    $$


    where $\hat{Z}$ is the vertical unit vector of the right-handed cylindrical $(R,
    \phi, Z)$ frame.


    In practice, this coordinate is obtained from engineering geometry, survey metrology,
    or design models of the conductor path. It is used together with the corresponding
    radial coordinate and toroidal angle to locate conductor points for electromagnetic,
    heating, and structural calculations.


    Typical values are device dependent. Conductor points are often located within
    about $-1$-$1$ m of the midplane in compact devices and can extend to several
    meters above or below the midplane in larger machines.


    Sign convention: Positive when the conductor point lies in the $+\hat{Z}$ direction,
    above the horizontal reference plane of the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_conductor_cross_section
  - name:vertical_centroid_of_coil_conductor_element
  - name:toroidal_angle_of_coil_conductor_element
  sources:
  - id: dd:ic_antennas/antenna/module/strap/geometry/arcs_of_circle/z
    dd_path: ic_antennas/antenna/module/strap/geometry/arcs_of_circle/z
