    dd_path: plasma_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    status: composed
- name: poloidal_momentum_effective_convection_velocity
  kind: scalar
  status: draft
  description: Effective radial convection velocity for transport of aggregate ion
    poloidal momentum across magnetic flux surfaces. It is the velocity-like coefficient
    of the convective, or pinch, term rather than the poloidal flow speed itself.
  documentation: 'Poloidal momentum effective convection velocity is the velocity-like
    coefficient that represents radial advection of aggregate ion poloidal momentum
    across magnetic flux surfaces. It is a transport coefficient in the momentum balance,
    not the poloidal flow speed itself, and no additional moment-arm or angular-momentum
    normalization is implied.


    The coefficient is defined by the convective term in a diffusion-convection decomposition
    of the radial flux of poloidal ion momentum:


    $$

    \Pi_{\theta,r} = -D_\theta \frac{\partial (m_i n_i v_\theta)}{\partial r} + V_\theta^{\mathrm{eff}}
    m_i n_i v_\theta

    $$


    where $V_\theta^{\mathrm{eff}}$ is this quantity in $m.s^{-1}$, $\Pi_{\theta,r}$
    is the radial flux of poloidal momentum in $kg.m^{-1}.s^{-2}$, $D_\theta$ is the
    poloidal momentum diffusivity in $m^2.s^{-1}$, $m_i$ is ion mass in $kg$, $n_i$
    is ion number density in $m^{-3}$, $v_\theta$ is poloidal flow speed in $m.s^{-1}$,
    and $r$ is a minor-radius-like radial label in meters increasing outward across
    the flux surfaces. The component $\theta$ is the poloidal direction in flux coordinates
    $(r,\theta,\phi)$, where $\theta$ is poloidal angle and $\phi$ is toroidal angle.
    For multiple ion species or charge states, $m_i n_i v_\theta$ denotes the aggregate
    ion poloidal momentum density used in the balance.


    In practice, this coefficient is specified by a transport closure or inferred
    by fitting an evaluated radial poloidal-momentum flux to a chosen diffusive-convective
    form. The split between diffusion and convection is meaningful only after the
    transported momentum density, radial label, and diffusivity convention have been
    fixed. This aggregate-ion quantity has the same physical role as poloidal_ion_momentum_convection_velocity,
    while [poloidal_ion_state_momentum_convection_velocity](name:poloidal_ion_state_momentum_convection_velocity)
    denotes the corresponding charge-state-resolved coefficient; related component
    analogs include toroidal_ion_momentum_convection_velocity and [parallel_momentum_effective_convection_velocity](name:parallel_momentum_effective_convection_velocity).


    Representative magnitudes are strongly model- and regime-dependent. In core momentum-transport
    studies the magnitude is often of order 0-10 m.s^-1, while fitted edge, pedestal,
    or transient coefficients can reach several tens of m.s^-1; either sign is possible
    depending on whether the effective convective transport is outward or inward.


    Sign convention: Positive when the effective convective transport of poloidal
    momentum is radially outward, from the magnetic axis toward the plasma boundary.'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:parallel_momentum_effective_convection_velocity
  sources:
  - id: dd:plasma_transport/model/profiles_1d/ion/momentum/poloidal/v
    dd_path: plasma_transport/model/profiles_1d/ion/momentum/poloidal/v
    status: composed
- name: poloidal_neutral_state_energy_diffusion_coefficient
  kind: scalar
  status: draft
  description: Effective poloidal diffusivity for energy transport of neutral particles
    in a specified state.
  documentation: 'Poloidal neutral-state energy diffusion coefficient is the effective
    diffusivity multiplying the poloidal gradient of neutral energy density for particles
    in a specified neutral state. In this context, diffusion coefficient and diffusivity
    denote the same physical transport coefficient, with dimensions of area per time.


    For a Fickian closure in a flux-coordinate system $(\rho,\theta,\phi)$, the poloidal
    neutral-energy flux density may be written as


    $$

    q_{E,\theta}^{(n,s)} = -D_{E,\theta}^{(n,s)}\,\frac{1}{h_\theta}\frac{\partial
    U_E^{(n,s)}}{\partial \theta}

    $$


    where $q_{E,\theta}^{(n,s)}$ is the poloidal neutral-energy flux density in W
    m$^{-2}$, $D_{E,\theta}^{(n,s)}$ is this diffusion coefficient in m$^2$ s$^{-1}$,
    $U_E^{(n,s)}$ is the neutral energy density in J m$^{-3}$, $h_\theta$ is the poloidal
    metric scale factor in meters, and $(n,s)$ identifies the neutral species and
    state. The flux component $q_{E,\theta}^{(n,s)}$ is positive in the direction
    of increasing poloidal angle $\theta$; the minus sign means that, for positive
    $D_{E,\theta}^{(n,s)}$, energy diffuses down the poloidal energy-density gradient.


    This coefficient is usually not measured directly. It is inferred or prescribed
    in neutral transport modeling from collisional mean-free-path estimates, kinetic
    or fluid neutral calculations, and calibration against measurements sensitive
    to neutral energy transport, such as neutral pressure, emission, and edge power-balance
    constraints.


    Typical effective values are broad because neutral mean free paths vary strongly
    with ionization, charge exchange, and wall recycling conditions. Dense, cold divertor
    or limiter regions may use about $10^{-3}$-$1$ m$^2$ s$^{-1}$, while more weakly
    collisional edge or scrape-off-layer conditions may require about $1$-$10^{2}$
    m$^2$ s$^{-1}$. Negative values are not expected for a physically diffusive diagonal
    coefficient; they would represent an anti-diffusive model closure rather than
    ordinary diffusion.'
  unit: m^2.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:plasma_transport/model/ggd/neutral/state/energy/d_pol/values
    dd_path: plasma_transport/model/ggd/neutral/state/energy/d_pol/values
    status: composed
- name: power_due_to_neutral_beam_shinethrough
  kind: scalar
  status: draft
  description: Power carried by neutral beam particles that traverse the plasma without
    being ionized or otherwise stopped and leave the far plasma boundary. It represents
    the unabsorbed fraction of launched neutral beam power that is deposited on plasma-facing
    surfaces rather than in the plasma.
  documentation: 'Neutral beam shinethrough power is the portion of injected neutral
    beam power that remains in fast neutral particles after crossing the confined
    plasma and exits the far side without being absorbed. It is distinct from prompt
    fast-ion orbit loss after ionization and from power lost before the beam enters
    the plasma; the absorbed plasma-heating counterpart is [power_due_to_neutral_beam_injection](name:power_due_to_neutral_beam_injection).


    For beamlets or beam energy components treated independently, a survival-probability
    model is:


    $$

    P_{\mathrm{sh}} = \sum_b P_{b,0}\exp\!\left[-\int_{\ell_b} n_e(\ell)\,\sigma_{\mathrm{eff},b}(\ell)\,d\ell\right]

    $$


    where $P_{\mathrm{sh}}$ is the shinethrough power, $b$ indexes beamlets or beam
    energy components, $P_{b,0}$ is the launched neutral-beam power contribution for
    $b$ whose sum is related to [total_power_of_neutral_beam_injector](name:total_power_of_neutral_beam_injector),
    $\ell$ is distance along the neutral trajectory in m, $n_e(\ell)$ is electron
    density in m^-3, and $\sigma_{\mathrm{eff},b}(\ell)$ is the effective stopping
    cross-section in m^2 including ionization and charge-exchange removal of beam
    neutrals. The exponential factor is the neutral survival probability, so shinethrough
    decreases rapidly as the line-integrated density or stopping cross-section increases.


    In practice, this quantity is computed by tracing neutral beamlets through reconstructed
    plasma density, temperature, and impurity distributions and integrating the corresponding
    attenuation along each path. Experimental constraints can come from calorimetry
    or thermography of shine-through armor, together with accounting of launched and
    plasma-deposited neutral beam power.


    Typical values in high-density heating plasmas are $10^4-10^6$ W for multi-megawatt
    injectors, often less than 1-5% of launched power. Low-density startup, current
    ramp-up, very high beam energy, or long tangency paths can raise values to $10^6-10^7$
    W, about 10-50% of launched power in unfavorable cases.'
  unit: W
  physics_domain: transport
  links: []
  sources:
  - id: dd:distribution_sources/source/global_quantities/shinethrough/power
    dd_path: distribution_sources/source/global_quantities/shinethrough/power
    status: composed
- name: radial_anomalous_current_density
  kind: scalar
  status: draft
  description: Radial component of anomalous current density, the cross-field current
    associated with turbulence-driven charge transport beyond classical and neoclassical
    collisional contributions. It is signed with respect to the outward radial direction
    across magnetic flux surfaces.
  documentation: 'Radial anomalous current density is the component of the turbulence-driven
    current-density vector normal to magnetic flux surfaces. It represents nonclassical
    cross-field charge transport, usually interpreted as the part not accounted for
    by classical collisional and neoclassical mechanisms.


    In a flux-coordinate system $(\rho, \theta, \phi)$ with $\rho$ increasing outward
    from the magnetic axis toward the plasma boundary, the radial component is defined
    by projection onto the outward radial unit vector:


    $$

    j_{\mathrm{anom},\rho} = \mathbf{j}_{\mathrm{anom}} \cdot \hat{\mathbf{e}}_\rho

    $$


    where $j_{\mathrm{anom},\rho}$ is the radial anomalous current density in A m^-2,
    $\mathbf{j}_{\mathrm{anom}}$ is the anomalous current-density vector in A m^-2,
    and $\hat{\mathbf{e}}_\rho$ is the dimensionless unit vector in the direction
    of increasing $\rho$.


    In practice this quantity is usually obtained from turbulence or transport modeling,
    from charge-balance constraints, or as a residual after subtracting classical
    and neoclassical radial current contributions from the total inferred cross-field
    current. It may also be related to species anomalous particle fluxes through charge-weighted
    sums, so departures from ambipolar turbulent transport directly affect its value.


    Because quasineutral plasmas are nearly ambipolar, flux-surface-averaged core
    values are often close to zero, with typical modeled magnitudes below 0.01-1 A
    m^-2. Localized edge, pedestal, scrape-off-layer, or transient turbulent structures
    can reach about 1-100 A m^-2, with larger short-lived values possible during strong
    relaxation events.


    Sign convention: Positive when the anomalous current density points in the direction
    of increasing $\rho$ in the flux-coordinate system $(\rho, \theta, \phi)$.'
  unit: A.m^-2
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_profiles/ggd/j_anomalous/r
    dd_path: edge_profiles/ggd/j_anomalous/r
    status: attached
  - id: dd:edge_profiles/ggd/j_anomalous/radial
    dd_path: edge_profiles/ggd/j_anomalous/radial
