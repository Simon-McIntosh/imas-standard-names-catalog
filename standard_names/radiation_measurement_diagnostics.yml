      kind: template
- name: emissivity_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric rate of neutron production from thermonuclear fusion
    reactions, giving the spatial distribution of fusion neutron emission per unit
    volume at each point in the plasma.
  documentation: 'The neutron emissivity due to fusion quantifies the number of fusion-born
    neutrons generated per unit volume per unit time at a given plasma location. This
    volumetric source term encodes the combined effect of local fuel-ion densities
    and the thermally-averaged fusion reactivity, and drives the global neutron field
    from which plasma performance is diagnosed.


    For a binary fusion reaction between ion species $a$ and $b$, the emissivity is
    given by:


    $$

    \epsilon_{ab} = \frac{n_a \, n_b}{1 + \delta_{ab}} \langle \sigma v \rangle_{ab}

    $$


    where $n_a$ and $n_b$ are the number densities of the reacting ions, $\langle
    \sigma v \rangle_{ab}$ is the fusion reactivity (velocity-averaged fusion cross-section)
    at the local ion temperature, and $\delta_{ab} = 1$ for identical-species reactions
    to avoid double-counting.


    The emissivity profile is inferred from measurements by neutron camera arrays
    and collimated detector systems via Abel inversion or tomographic reconstruction.
    The two principal reaction channels are resolved as [deuterium_deuterium_emissivity_due_to_fusion](name:deuterium_deuterium_emissivity_due_to_fusion),
    covering the neutron-emitting D-D branch, and [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion),
    which dominates in D-T operation due to the much larger fusion cross-section.
    Integrating this emissivity over the plasma volume and weighting by the per-reaction
    neutron energy connects to the [total_neutron_power](name:total_neutron_power).'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_deuterium_emissivity_due_to_fusion
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:total_neutron_power
- name: deuterium_deuterium_emissivity_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric rate of neutron production from deuterium-deuterium
    fusion reactions, giving the spatial distribution of DD neutron emission per unit
    volume across the plasma.
  documentation: 'The deuterium-deuterium neutron emissivity $\varepsilon_{DD}$ is
    the local number of neutrons produced per unit volume per unit time from D-D fusion
    reactions. Of the two equally probable D-D reaction branches, only the neutron-producing
    channel $^2\text{H} + ^2\text{H} \rightarrow {^3\text{He}} + n$ (releasing a 2.45
    MeV neutron) contributes to this quantity; the proton-producing branch $^2\text{H}
    + ^2\text{H} \rightarrow T + p$ does not.


    The emissivity is related to the local fuel conditions by:


    $$

    \varepsilon_{DD} = \frac{n_D^2}{2} \langle \sigma v \rangle_{DD,n}

    $$


    where $n_D$ is the local deuterium number density and $\langle \sigma v \rangle_{DD,n}$
    is the velocity-averaged reaction rate coefficient for the neutron-producing branch;
    the factor $1/2$ prevents double-counting of identical reactants.


    The spatial profile of $\varepsilon_{DD}$ is reconstructed from chord-integrated
    signals recorded by multiple neutron detectors distributed around the device,
    using tomographic inversion to recover the local distribution. Volume integration
    of $\varepsilon_{DD}$ yields the global neutron emission rate characterized by
    deuterium_deuterium_flux_due_to_thermal_fusion for the purely thermal component
    and includes beam-related contributions captured by deuterium_deuterium_flux_due_to_beam_thermal_fusion.
    The D-T plasma analog is [deuterium_tritium_emissivity_due_to_fusion](name:deuterium_tritium_emissivity_due_to_fusion),
    and the corresponding local fusion power density from all D-D channels is [deuterium_deuterium_power_density_due_to_fusion](name:deuterium_deuterium_power_density_due_to_fusion).'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:deuterium_tritium_emissivity_due_to_fusion
  - name:deuterium_deuterium_power_density_due_to_fusion
  arguments:
  - name: emissivity_due_to_fusion
    operator: deuterium_deuterium
    operator_kind: qualifier
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dd
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-emissivity_dd
    dd_documentation:
      leaf: Emissivity profile due to DD reactions
      parent_path: neutron_diagnostic/reconstructed_emissivity
      parent: Reconstructed emissivity parameters and data
      data_type: FLT_2D
      unit: m^-3.s^-1
      coordinates:
      - neutron_diagnostic/time
      - neutron_diagnostic/reconstructed_emissivity/rho_tor_norm
    enhanced_context:
      description: "Neutron emissivity profile (\u03B5_DD) due to D-D fusion reactions,\
        \ reconstructed from neutron detector signals. Provides the spatial distribution\
        \ of DD neutron emission rate per unit volume."
      kind: llm
- name: deuterium_tritium_emissivity_due_to_fusion
  kind: scalar
  status: active
  description: Local volumetric rate of neutron production from deuterium-tritium
    fusion reactions, giving the spatial distribution of D-T neutron emission per
    unit volume at each point in the plasma.
  documentation: 'The deuterium-tritium neutron emissivity $\varepsilon_{DT}$ is the
    local number of neutrons produced per unit volume per unit time from D-T fusion
    reactions. Each D-T fusion reaction produces exactly one neutron, so this quantity
    is equal to the local D-T fusion reaction-rate density.


    For reacting deuterium and tritium ion populations, the emissivity is given by:


    $$

    \varepsilon_{DT} = n_D \, n_T \, \langle \sigma v \rangle_{DT}

    $$


    where $n_D$ and $n_T$ are the local deuterium and tritium number densities and
    $\langle \sigma v \rangle_{DT}$ is the D-T fusion reactivity, the velocity-averaged
    fusion cross-section evaluated over the relative-velocity distribution of the
    reacting ion populations; for thermal reactants it is the thermally averaged reactivity
    at the local ion temperature. No symmetry factor appears because the reactants
    are distinct species.


    This quantity counts neutron production, not fusion energy deposition or neutron
    power. It is the D-T channel of the parent [emissivity_due_to_fusion](name:emissivity_due_to_fusion)
    and the counterpart of [deuterium_deuterium_emissivity_due_to_fusion](name:deuterium_deuterium_emissivity_due_to_fusion),
    which covers the neutron-emitting D-D branch. Its energy-weighted counterpart
    is [deuterium_tritium_power_density_due_to_fusion](name:deuterium_tritium_power_density_due_to_fusion),
    and integrating the emissivity over the plasma volume and weighting by the per-reaction
    neutron energy connects to the [total_neutron_power](name:total_neutron_power).'
  unit: m^-3.s^-1
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:emissivity_due_to_fusion
  - name:deuterium_deuterium_emissivity_due_to_fusion
  arguments:
  - name: emissivity_due_to_fusion
    operator: deuterium_tritium
    operator_kind: qualifier
  sources:
  - dd_path: neutron_diagnostic/reconstructed_emissivity/emissivity_dt
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/neutron_diagnostic.html#neutron_diagnostic-reconstructed_emissivity-emissivity_dt
    dd_documentation:
      leaf: Emissivity profile due to DT reactions
      parent_path: neutron_diagnostic/reconstructed_emissivity
      parent: Reconstructed emissivity parameters and data
      data_type: FLT_2D
      unit: m^-3.s^-1
      coordinates:
      - neutron_diagnostic/time
      - neutron_diagnostic/reconstructed_emissivity/rho_tor_norm
    enhanced_context:
      description: Radial profile of neutron emissivity due to deuterium-tritium (DT)
        fusion reactions, reconstructed from neutron diagnostic measurements via tomographic
        inversion. Provides the spatial distribution of DT fusion reactivity as a
        function of plasma radius.
      kind: llm
- name: energy_of_detector_pixel
  kind: scalar
  status: active
  description: The energy of a detector pixel is the central or representative photon
    energy assigned to that pixel's spectral bandpass in an X-ray crystal spectrometer.
    It is distinct from the lower and upper bandpass-edge energies.
  documentation: 'The energy of a detector pixel is the central or representative
    photon energy assigned to that pixel''s spectral bandpass in an X-ray crystal
    spectrometer. It is the energy counterpart of the [wavelength of detector pixel](name:wavelength_of_detector_pixel)
    and identifies the pixel''s spectral-channel assignment rather than the finite
    width of its accepted band.


    For diffraction order $n$, the representative pixel energy is related to the pixel
    Bragg angle by Bragg''s law and the photon energy-wavelength relation:


    $$

    E_\mathrm{pix} = \frac{n h c}{2 e d \sin\theta_\mathrm{pix}}

    $$


    where $E_\mathrm{pix}$ is the energy of the detector pixel, $n$ is the diffraction
    order, $h$ is Planck''s constant, $c$ is the speed of light in vacuum, $e$ is
    the elementary-charge magnitude, $d$ is the spacing of the diffracting crystal
    planes, and $\theta_\mathrm{pix}$ is the Bragg angle associated with the pixel.


    This representative energy is the calibrated spectral-channel value selected by
    the spectrometer energy scale; it need not equal the arithmetic midpoint between
    the [lower bound energy of detector pixel](name:lower_bound_energy_of_detector_pixel)
    and the [upper bound energy of detector pixel](name:upper_bound_energy_of_detector_pixel),
    which define the edges of the pixel''s accepted photon-energy interval.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_detector_pixel
  - name:lower_bound_energy_of_detector_pixel
  - name:upper_bound_energy_of_detector_pixel
- name: etendue_of_spectrometer_channel
  kind: scalar
  status: active
  description: Optical phase-space acceptance of a radiation-collection system, determined
    by effective collecting area and accepted ray directions and optionally weighted
    by spectral response.
  documentation: "Optical \xE9tendue is the geometric phase-space acceptance of a\
    \ radiation-collection system. It describes how the collecting area and range\
    \ of accepted ray directions jointly determine the system's throughput for radiation\
    \ from an observed source.\n\nFor an effective area and accepted solid angle,\
    \ the \xE9tendue $G$ is defined by:\n\n$$\nG = A_{\\mathrm{eff}}\\Omega_{\\mathrm{eff}}\n\
    $$\n\nwhere $G$ is the optical \xE9tendue, $A_{\\mathrm{eff}}$ is the effective\
    \ collecting area, and $\\Omega_{\\mathrm{eff}}$ is the accepted solid angle.\n\
    \nThe quantity applies to radiation entering an optical collection system from\
    \ a plasma or other observed source and aggregates acceptance over the collecting\
    \ area and accepted ray directions. It is non-negative and does not itself represent\
    \ radiance, collected power, detector signal, or spectral intensity. The [spectral\
    \ \xE9tendue of a spectrometer channel](name:spectral_etendue_of_spectrometer_channel)\
    \ is a narrower response-weighted form in which the optical acceptance is weighted\
    \ by the channel's wavelength response, while [\xE9tendue of a spectrometer](name:etendue_of_spectrometer)\
    \ represents the corresponding unweighted spectrometer-level acceptance."
  unit: m^2.sr
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - dd_path: soft_x_rays/channel/etendue
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/soft_x_rays.html#soft_x_rays-channel-etendue
    dd_documentation:
      leaf: Etendue (geometric extent) of the channel's optical system
      parent_path: soft_x_rays/channel
      parent: Set of channels (detector or pixel of a camera)
      data_type: FLT_0D
      unit: m^2.sr
    enhanced_context:
      description: "\xC9tendue (geometric extent, A\u03A9) of a soft X-ray diagnostic\
        \ channel's optical system. Characterizes the product of detector area and\
        \ solid angle, determining the channel's geometric sensitivity to plasma emission."
      kind: llm
- name: exposure_time_of_spectrometer_channel
  kind: scalar
  status: active
  description: Temporal duration over which a spectrometer channel accumulates incident
    photons to form one spectral measurement.
  documentation: 'The integration duration is the elapsed time between the start and
    end of the photon-accumulation interval for a spectrometer channel. It defines
    the temporal window contributing to one spectral measurement and is distinct from
    the channel''s spectral response, including its [effective spectral width](name:effective_spectral_width_of_spectrometer_channel).


    It is defined by


    $$

    \Delta t = t_{\mathrm{end}} - t_{\mathrm{start}}

    $$


    where $\Delta t$ is the integration duration, and $t_{\mathrm{start}}$ and $t_{\mathrm{end}}$
    are the times at which photon accumulation begins and ends. The accumulated signal
    is determined by the time integral of the [incident spectral flux](name:incident_spectral_flux)
    over this interval.'
  unit: s
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:effective_spectral_width_of_spectrometer_channel
  sources:
