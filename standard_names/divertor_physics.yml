- name: power_due_to_conduction
  kind: scalar
  status: active
  description: Thermal power deposited on one or more plasma-facing surfaces by electron
    and ion conduction along scrape-off-layer magnetic field lines, excluding convective,
    radiative, and neutral-particle power.
  documentation: 'Conductive deposited power is thermal power transferred from scrape-off-layer
    plasma to one or more plasma-facing surfaces by electron and ion heat conduction
    along magnetic field lines. The selected surface may be an individual target,
    a divertor assembly, or a collection of wall and divertor surfaces.


    The defining surface integral is:


    $$

    P_{\mathrm{cond}} = \int_S \left(\mathbf{q}_{e,\parallel}^{\mathrm{cond}} + \mathbf{q}_{i,\parallel}^{\mathrm{cond}}\right)
    \cdot \hat{\mathbf{n}}\,\mathrm{d}A

    $$


    where $P_{\mathrm{cond}}$ is the deposited power, $S$ is the selected plasma-facing
    surface, $\mathbf{q}_{e,\parallel}^{\mathrm{cond}}$ and $\mathbf{q}_{i,\parallel}^{\mathrm{cond}}$
    are the electron and ion conductive heat-flux vectors, $\hat{\mathbf{n}}$ is the
    unit normal directed from the plasma toward the material, and $\mathrm{d}A$ is
    a surface-area element.


    The quantity excludes convective enthalpy, radiative absorption, and neutral-particle
    bombardment. A single-target instance is represented by [power at divertor target
    due to conduction](name:power_at_divertor_target_due_to_conduction), while the
    corresponding all-channel energy flux density is distinguished by [energy flux
    at divertor target](name:energy_flux_at_divertor_target).'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_at_divertor_target_due_to_conduction
  - name:energy_flux_at_divertor_target
- name: power_at_divertor_target_due_to_conduction
  kind: scalar
  status: active
  description: Thermal power deposited on a single divertor target by parallel electron
    and ion heat conduction along scrape-off-layer magnetic field lines, excluding
    convective, radiative, and neutral-particle channels.
  documentation: 'The power at a divertor target due to conduction is the thermal
    energy deposited on one divertor target by electron and ion heat conduction along
    open scrape-off-layer magnetic field lines. It excludes convective particle enthalpy,
    absorbed radiation, recombination, and neutral-particle power, and is the single-target
    specialization of [power_due_to_conduction](name:power_due_to_conduction).


    The deposited conductive power is the normal component of the conductive heat
    flux integrated over the wetted target area:


    $$

    P_{\mathrm{cond,target}} = \int_{A_{\mathrm{target}}} \mathbf{q}_{\mathrm{cond}}
    \cdot \hat{\mathbf{n}}\,\mathrm{d}A

    $$


    where $\mathbf{q}_{\mathrm{cond}}$ is the sum of the electron and ion conductive
    heat-flux vectors, $\hat{\mathbf{n}}$ is the unit normal directed from the plasma
    toward the target material, and $A_{\mathrm{target}}$ is the wetted target area.
    Unlike [power_of_divertor_due_to_conduction](name:power_of_divertor_due_to_conduction),
    this quantity applies to one divertor target rather than the complete divertor
    assembly.'
  unit: W
  physics_domain: divertor_physics
  links:
  - name:power_due_to_conduction
  - name:power_of_divertor_due_to_conduction
  arguments:
  - name: power_due_to_conduction
    operator: divertor_target
    operator_kind: locus
  sources:
