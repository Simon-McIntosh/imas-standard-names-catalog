- name: magnetic_shear_of_magnetic_axis
  kind: scalar
  status: draft
  description: Normalized radial gradient of the safety factor, quantifying the divergence
    of magnetic field lines between adjacent flux surfaces, evaluated at the innermost
    flux surface.
  documentation: 'The magnetic shear at the magnetic axis, $s_0 = s(\psi=0)$, is defined
    as $s = (\rho_{\rm tor}/q)\,(dq/d\rho_{\rm tor})$, where $\rho_{\rm tor}$ is the
    normalized toroidal flux radius and $q$ is the safety factor. This quantity measures
    the local rate of change of the helical winding of magnetic field lines; at the
    magnetic axis it determines the stability thresholds for ideal and resistive MHD
    modes. In conventional H-mode tokamaks, $s_0$ is typically near zero for monotonic
    $q$ profiles and can become negative for reversed-shear configurations that favor
    internal transport barrier formation. The magnetic shear profile is reconstructed
    from equilibrium solvers using external magnetics and internal profile diagnostics
    such as motional Stark effect or Faraday rotation polarimetry. The sign of $s$
    reflects whether the safety factor increases or decreases with radius.


    Sign convention: Positive when the safety factor increases with normalized toroidal
    flux radius.


    See also [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis)
    for the on-axis $q$ value and [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal)
    for the same quantity at the edge transport barrier.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:safety_factor_at_magnetic_axis
  - name:magnetic_shear_at_pedestal
  sources:
  - id: dd:summary/local/magnetic_axis/magnetic_shear/value
    dd_path: summary/local/magnetic_axis/magnetic_shear/value
    status: composed
- name: magnetic_shear_of_separatrix
  kind: scalar
  status: draft
  description: Normalized radial gradient of the safety factor at the last-closed
    flux surface, quantifying magnetic field-line divergence in the plasma boundary
    region.
  documentation: "Magnetic shear $s = (\\rho_{\\mathrm{tor}}/q)(dq/d\\rho_{\\mathrm{tor}})$\
    \ at the separatrix measures how rapidly the safety factor $q$ varies with the\
    \ normalized toroidal flux radius $\\rho_{\\mathrm{tor}}$ at the plasma boundary.\
    \ It governs the magnetic field-line winding rate between adjacent flux surfaces\
    \ and strongly influences the stability of edge-localized modes (ELMs) and the\
    \ edge harmonic oscillation. Typical values at the separatrix range from $s \\\
    approx 2$\u2013$6$ in H-mode tokamak plasmas, depending on the edge current density\
    \ and pressure gradient profiles, and are routinely obtained from equilibrium\
    \ reconstruction codes such as EFIT. The sign of magnetic shear is determined\
    \ by the monotonicity of the $q$ profile and the direction of the toroidal plasma\
    \ current.\n\nSign convention: Positive when $q$ increases radially outward, i.e.\
    \ when the toroidal plasma current flows in the direction of increasing toroidal\
    \ angle $\\phi$.\n\nSee also [magnetic_shear_of_magnetic_axis](name:magnetic_shear_of_magnetic_axis)\
    \ for the innermost flux-surface value and [magnetic_shear_at_pedestal](name:magnetic_shear_at_pedestal)\
    \ for the pedestal-top value."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:magnetic_shear_of_magnetic_axis
  - name:magnetic_shear_at_pedestal
  sources:
  - id: dd:summary/local/separatrix/magnetic_shear/value
    dd_path: summary/local/separatrix/magnetic_shear/value
    status: composed
- name: major_radius_of_closest_wall_point
  kind: scalar
  status: draft
  description: Major radius coordinate of the point on the first wall geometrically
    closest to the plasma boundary, used for gap estimation and halo current analysis.
  documentation: 'The major radius $R_{\mathrm{wall}}$ of the point on the first-wall
    surface that minimizes the Euclidean distance to the plasma boundary contour in
    the poloidal plane. This point is identified during equilibrium reconstruction
    by scanning the vessel wall geometry against the separatrix or last-closed flux
    surface, and its radial coordinate is a key input for plasma-wall gap estimation,
    disruption halo current path modeling, and limiter contact calculations. Typical
    values range from $R \approx 2.0\,\text{m}$ in medium-size tokamaks to $R \approx
    6.2\,\text{m}$ for ITER, with the exact coordinate depending on the wall tile
    layout and plasma shape. The quantity is paired with [vertical_coordinate_of_closest_wall_point](name:vertical_coordinate_of_closest_wall_point)
    to define the full 2-D wall contact location, and is distinct from the gap magnitude
    given by [major_radius_of_plasma_boundary_gap](name:major_radius_of_plasma_boundary_gap).


    Sign convention: Positive when the point lies at a larger major radius than the
    machine symmetry axis ($R = 0$).'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_closest_wall_point
  - name:major_radius_of_plasma_boundary_gap
