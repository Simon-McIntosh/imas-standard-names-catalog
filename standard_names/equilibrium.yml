- name: flux_surface_averaged_inverse_of_square_of_magnetic_field_magnitude
  kind: vector
  status: active
  description: Flux-surface average of the reciprocal square of total magnetic-field
    strength, a geometric coefficient in neoclassical and flux-surface-averaged transport
    relations.
  documentation: 'This quantity is the flux-surface average of the reciprocal square
    of the total magnetic-field strength on a nested magnetic surface. It captures
    field-strength geometry independently of the magnetic-field direction.


    The defining relation is


    $$

    \left\langle \frac{1}{|\mathbf{B}|^2} \right\rangle_\psi

    =

    \frac{\displaystyle \int_{S(\psi)} |\mathbf{B}|^{-2}\,\frac{dS}{|\nabla\psi|}}

    {\displaystyle \int_{S(\psi)} \frac{dS}{|\nabla\psi|}}

    $$


    where $\mathbf{B}$ is the total magnetic-field vector, $|\mathbf{B}|$ is its magnitude,
    $\psi$ is the flux-surface label, $S(\psi)$ is the magnetic surface labeled by
    $\psi$, $dS$ is its surface-area element, and $\nabla\psi$ is the spatial gradient
    of the flux-surface label.


    The quantity applies to the complete magnetic flux surface and uses the inverse-$|\nabla\psi|$
    weighting shown in the defining relation. It is not a pointwise inverse-square
    field value and has no selection by magnetic-field direction, component, species,
    or source.


    It is the flux-surface-averaged transformation of the parent [inverse square of
    magnetic-field magnitude](name:inverse_of_square_of_magnetic_field_magnitude),
    with the reciprocal square formed locally before averaging. It is distinct from
    [flux-surface-averaged magnetic-field magnitude](name:flux_surface_averaged_magnetic_field_magnitude)
    and [flux-surface-averaged square of magnetic-field magnitude](name:flux_surface_averaged_square_of_magnetic_field_magnitude),
    because nonlinear inversion and squaring do not commute with surface averaging.'
  unit: T^-2
  physics_domain: equilibrium
  links:
  - name:flux_surface_averaged_magnetic_field_magnitude
  - name:flux_surface_averaged_square_of_magnetic_field_magnitude
