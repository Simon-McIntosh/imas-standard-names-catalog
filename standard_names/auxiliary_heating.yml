- name: neutral_beam_energy
  kind: scalar
  status: active
  description: Kinetic energy per atom of the full-energy neutral-beam component,
    set by the ion-source acceleration voltage before neutralization.
  documentation: 'The quantity is the kinetic energy carried by one atom in the full-energy
    component of an injected neutral beam. It represents the energy associated with
    the complete ion-source acceleration, rather than beam power or total injected
    energy.


    The full-energy value is defined by the accelerating potential difference:


    $$

    E_{\mathrm{full}} = e V_{\mathrm{acc}}

    $$


    where $E_{\mathrm{full}}$ is the atom''s kinetic energy in joules, $e$ is the
    elementary charge, and $V_{\mathrm{acc}}$ is the magnitude of the ion-source acceleration
    voltage in volts. Expressed in electron-volts, the numerical energy equals the
    numerical acceleration voltage in volts.


    This quantity applies only to the full-energy component. It excludes half- and
    third-energy components produced by molecular dissociation and is not an abundance-weighted
    average over those components. The associated injector power is a separate quantity,
    [neutral beam injector power](name:power_of_neutral_beam_injector).'
  unit: eV
  physics_domain: auxiliary_heating
  links:
  - name:power_of_neutral_beam_injector
  sources:
  - dd_path: summary/heating_current_drive/nbi/energy/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-nbi-energy-value
    dd_documentation:
      leaf: Value
      parent_path: summary/heating_current_drive/nbi/energy
      parent: Full energy of the injected species (acceleration of a single atom)
      data_type: FLT_1D
      unit: eV
      coordinates:
      - summary/time
    enhanced_context:
      description: Full beam energy of the injected neutral beam species, corresponding
        to the kinetic energy gained by a single atom during acceleration. This is
        the characteristic injection energy for the NBI unit, determining penetration
        depth and heating profile.
      kind: template
- name: ordinary_mode_fraction_of_wave_beam
  kind: scalar
  status: active
  description: Fraction of the launched electron-cyclotron wave-beam power carried
    by the ordinary polarization mode.
  documentation: 'The ordinary-mode fraction is the share of launched electron-cyclotron
    wave-beam power carried by the ordinary electromagnetic polarization eigenmode.
    It distinguishes this polarization component from the complementary mode contributions
    represented by the parent quantity [fraction of wave beam](name:fraction_of_wave_beam).


    $$

    f_O = \frac{P_O}{P_{\rm launch}}

    $$


    where $f_O$ is the ordinary-mode power fraction, $P_O$ is the launched power in
    the ordinary mode, and $P_{\rm launch}$ is the total launched wave-beam power.
    The fraction is bounded by zero and one when the polarization-mode powers are
    nonnegative and exhaust the launched power; it excludes power introduced or lost
    after launch.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
