- name: poloidal_ion_momentum_flux_limiter_coefficient
  kind: scalar
  status: active
  description: Poloidal component of the dimensionless ion momentum flux-limiter coefficient
    that scales the free-streaming bound on poloidal ion momentum-flux density.
  documentation: 'The poloidal component of the dimensionless ion momentum-flux limiter
    coefficient scales the free-streaming upper bound imposed on ion momentum-flux
    density in the local poloidal direction. It is the poloidal member of the vector
    quantity [ion momentum flux limiter coefficient](name:ion_momentum_flux_limiter_coefficient),
    with the poloidal direction tangent to a magnetic flux surface in the right-handed
    cylindrical $(R, \phi, Z)$ frame.


    The limiting relation is


    $$

    \left|\Pi_{\theta,i}\right| \leq C_{\theta,i}\,\Pi_{\theta,\mathrm{fs}}

    $$


    where $C_{\theta,i}$ is this coefficient, $\Pi_{\theta,i}$ is the signed poloidal
    ion momentum-flux density, and $\Pi_{\theta,\mathrm{fs}}$ is the nonnegative poloidal
    free-streaming bound.


    The coefficient is nonnegative and applies to ion momentum-flux density summed
    over charge states. It is distinct from the charge-state-resolved [poloidal ion
    charge-state momentum flux limiter coefficient](name:poloidal_ion_charge_state_momentum_flux_limiter_coefficient).


    Sign convention: Positive when the associated signed poloidal momentum-flux density
    points in the positive local poloidal direction.'
