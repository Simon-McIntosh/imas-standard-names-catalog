- name: y_component_of_third_unit_vector
  kind: scalar
  status: draft
  description: Y-axis Cartesian component of the third local unit vector defining
    the orientation of a diagnostic optical element in the right-handed $(\hat{x},
    \hat{y}, \hat{z})$ frame.
  documentation: 'The quantity $y_3 = \hat{x}_3 \cdot \hat{y}$ is the projection of
    the third local unit vector $\hat{x}_3$ onto the machine Cartesian $\hat{y}$ axis,
    where $\hat{x}_3$ completes a right-handed orthonormal triad $\{\hat{x}_1, \hat{x}_2,
    \hat{x}_3\}$ fully specifying the orientation of a diagnostic optical element
    (detector, aperture, grating, or mirror). Together with [x_component_of_third_unit_vector](name:x_component_of_third_unit_vector)
    and [z_component_of_third_unit_vector](name:z_component_of_third_unit_vector),
    this component fully resolves $\hat{x}_3$ in the Cartesian $(\hat{x}, \hat{y},
    \hat{z})$ frame, enabling coordinate transformations between the local diagnostic
    frame and the machine frame. Since $\hat{x}_3$ is a unit vector, the three Cartesian
    components satisfy $x_3^2 + y_3^2 + z_3^2 = 1$, so $y_3 \in [-1, 1]$. This quantity
    is specified from engineering survey data or optical alignment measurements during
    diagnostic installation and is used in geometric ray-tracing and solid-angle calculations.


    Sign convention: Positive when the third unit vector has a component in the $+\hat{y}$
    direction of the right-handed Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame.'
