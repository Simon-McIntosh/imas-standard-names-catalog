- name: volume_averaged_runaway_electron_critical_momentum_due_to_avalanche
  kind: scalar
  status: active
  description: Volume-averaged momentum threshold for runaway-electron avalanche multiplication,
    separating collisional drag-dominated electrons from those capable of net acceleration
    and secondary runaway production.
  documentation: 'This quantity is the plasma-volume average of the local critical
    momentum threshold for avalanche-driven runaway-electron generation. It characterizes
    the boundary between collisional drag-dominated and net-accelerated electron dynamics.


    The volume average is defined by


    $$

    p_{c,\mathrm{av}} = \frac{1}{V}\int_V p_c(\mathbf{r})\,dV

    $$


    where $p_{c,\mathrm{av}}$ is the averaged threshold, $V$ is the plasma volume,
    $dV$ is a differential volume element, and $p_c(\mathbf{r})$ is the local [critical
    momentum due to avalanche](name:critical_momentum_due_to_avalanche) at position
    $\mathbf{r}$.


    This quantity is an unweighted volume average, not the momentum carried by the
    runaway-electron population and not a volume average of electron momentum. It
    is the spatially aggregated form of the local avalanche threshold and is distinct
    from the broader [momentum due to avalanche](name:momentum_due_to_avalanche),
    which need not denote a critical threshold.'
  unit: kg.m^-1.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:critical_momentum_due_to_avalanche
  - name:momentum_due_to_avalanche
  sources:
  - dd_path: runaway_electrons/global_quantities/volume_average/momentum_critical_avalanche
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/runaway_electrons.html#runaway_electrons-global_quantities-volume_average-momentum_critical_avalanche
    dd_documentation:
      leaf: Critical momentum for avalanche, Compton and tritium
      parent_path: runaway_electrons/global_quantities/volume_average
      parent: Volume average runaways parameters
      data_type: FLT_1D
      unit: kg.m^-1.s^-1
      coordinates:
      - runaway_electrons/time
    enhanced_context:
      description: Volume-averaged critical momentum (p_c,av) for runaway electron
        avalanche generation, above which electrons undergo net acceleration via avalanche,
        Compton, or tritium decay mechanisms. The threshold separating runaway from
        drag-dominated electron dynamics.
      kind: llm
- name: volume_averaged_runaway_electron_kinetic_energy_density
  kind: scalar
  status: active
  description: Mean relativistic kinetic energy per unit volume of the runaway electron
    population, obtained by averaging the local kinetic energy density over the confined
    plasma volume.
  documentation: 'The volume-averaged runaway electron kinetic energy density is a
    global scalar characterizing the mean suprathermal energy stored per unit volume
    in the runaway electron (RE) population. It is obtained by integrating the local
    relativistic kinetic energy density over the total confined plasma volume $V$
    and dividing by $V$.


    The underlying local quantity is the relativistic kinetic energy moment of the
    RE distribution function:


    $$

    u_\mathrm{RE}(\mathbf{r}) = \int f_\mathrm{RE}(\mathbf{r}, \mathbf{p})\,(\gamma
    - 1)\,m_e c^2 \, d^3p

    $$


    where $f_\mathrm{RE}$ is the runaway electron phase-space distribution function,
    $\gamma = (1 + p^2 / m_e^2 c^2)^{1/2}$ is the Lorentz factor, $m_e$ is the electron
    rest mass, $c$ is the speed of light, and $\mathbf{p}$ is the relativistic momentum.
    The volume average is then $\langle u_\mathrm{RE} \rangle = V^{-1} \int_V u_\mathrm{RE}\,dV$.


    This quantity is evaluated from kinetic or reduced-fluid runaway electron models,
    particularly in disruption current-quench simulations where RE populations can
    reach energies of several to tens of MeV per particle. Multiplying by the plasma
    volume $V$ recovers the total stored relativistic energy given by [runaway_electron_kinetic_energy](name:runaway_electron_kinetic_energy).
    The local non-averaged counterpart is runaway_electron_kinetic_energy_density,
    and the corresponding global particle number density is [volume_averaged_runaway_electron_density](name:volume_averaged_runaway_electron_density).'
  unit: J.m^-3
  physics_domain: magnetohydrodynamics
  links:
  - name:runaway_electron_kinetic_energy
  - name:volume_averaged_runaway_electron_density
  sources:
  - dd_path: runaway_electrons/global_quantities/volume_average/energy_density_kinetic
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/runaway_electrons.html#runaway_electrons-global_quantities-volume_average-energy_density_kinetic
    dd_documentation:
