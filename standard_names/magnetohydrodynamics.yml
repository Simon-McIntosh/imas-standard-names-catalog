    dd_path: summary/disruption/decay_times/ip/linear_custom/x2
    status: composed
- name: rotation_frequency_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Angular rotation frequency of a neoclassical tearing mode magnetic
    island, equal to the instantaneous time rate of change of the mode's helical phase.
  documentation: 'The rotation frequency of a neoclassical tearing mode (NTM) quantifies
    how rapidly the associated magnetic island rotates toroidally. It is governed
    primarily by the local plasma rotation at the rational flux surface where the
    island resides, modified by the electromagnetic torque balance that couples the
    island to the surrounding plasma.


    The rotation frequency is defined as the time derivative of the mode phase $\varphi$:


    $$

    \omega = \frac{d\varphi}{dt}

    $$


    where $\varphi$ is the instantaneous helical phase of the rotating magnetic island
    perturbation.


    As an NTM island grows, electromagnetic braking torques modify the local plasma
    rotation at the rational $q = m/n$ surface (where $m$ and $n$ are the poloidal
    and toroidal mode numbers), causing a measurable frequency shift that signals
    mode onset and saturation. The frequency is typically inferred from Mirnov coil
    arrays by tracking the temporal phase evolution of the rotating magnetic perturbation,
    or computed as the time derivative of [neoclassical_tearing_mode_phase](name:neoclassical_tearing_mode_phase).
    The [radial_width_of_neoclassical_tearing_mode](name:radial_width_of_neoclassical_tearing_mode)
    governs the braking torque magnitude through the modified Rutherford equation,
    while the torque balance itself is captured by torque_due_to_neoclassical_tearing_mode.
    The time evolution of this frequency is described by [tendency_of_rotation_frequency_of_neoclassical_tearing_mode](name:tendency_of_rotation_frequency_of_neoclassical_tearing_mode).


    Sign convention: Positive when the island rotates in the direction of increasing
    toroidal angle $\phi$.'
  unit: rad.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:neoclassical_tearing_mode_phase
  - name:radial_width_of_neoclassical_tearing_mode
  - name:tendency_of_rotation_frequency_of_neoclassical_tearing_mode
