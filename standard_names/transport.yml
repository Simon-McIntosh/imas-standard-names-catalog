- name: iron_density_at_magnetic_axis
  kind: scalar
  status: draft
  description: Number density of iron impurity ions located at the magnetic axis,
    the innermost flux surface of the confined plasma.
  documentation: 'The iron density at the magnetic axis $n_\text{Fe}(R_\text{axis})$
    quantifies the concentration of iron ions sourced from plasma-facing component
    erosion that have accumulated at the center of the plasma. Iron is a high-Z impurity
    that can radiatively cool the core, so this density is a critical input to transport
    modeling and impurity-seeding studies. The quantity is routinely inferred by combining
    spectroscopic measurements (e.g., X-ray line emission from highly ionized charge
    states) with collisional-radiative modeling to recover the total iron density
    from individual charge-state densities. Core values in present-day tokamaks range
    from $10^{14}\,\text{m}^{-3}$ for low-erosion conditions up to $10^{18}\,\text{m}^{-3}$
    during deliberate seeding or transient events. This quantity is the central-position
    specialization of the general iron density field; see [iron_density_at_separatrix](name:iron_density_at_separatrix)
    for the edge value and [volume_averaged_iron_density](name:volume_averaged_iron_density)
    for the global core average.


    Sign convention: Positive when the number of iron ions per unit volume is defined.


    Typical inboard-outboard impurity accumulation patterns make the magnetic axis
    value a key benchmark for neoclassical transport codes and for validating impurity-peaking
    models against [ion_temperature_at_magnetic_axis](name:ion_temperature_at_magnetic_axis).'
  unit: m^-3
  physics_domain: transport
  links:
  - name:iron_density_at_separatrix
  - name:volume_averaged_iron_density
  - name:ion_temperature_at_magnetic_axis
  sources:
