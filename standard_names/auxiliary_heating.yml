- name: parallel_wave_magnetic_field
  kind: scalar
  status: active
  description: Signed component of the oscillatory electromagnetic-wave magnetic perturbation
    along the local equilibrium magnetic-field direction, distinct from the total
    parallel magnetic field.
  documentation: 'This quantity is the field-aligned component of the oscillatory
    magnetic perturbation carried by a coherent electromagnetic wave. It excludes
    equilibrium and other static magnetic-field contributions.


    The component is defined by


    $$

    B_{\rm parallel}^{\rm wave} = \delta\mathbf{B}_{\rm wave} \cdot \hat{\mathbf{b}}_{\rm
    eq}

    $$


    where $\delta\mathbf{B}_{\rm wave}$ is the wave magnetic-field perturbation and
    $\hat{\mathbf{b}}_{\rm eq} = \mathbf{B}_{\rm eq}/|\mathbf{B}_{\rm eq}|$ is the
    local unit vector along the equilibrium magnetic field. It is a component of the
    parent [wave magnetic field](name:wave_magnetic_field), not its magnitude or a
    complex-quadrature part. Unlike [parallel magnetic field](name:parallel_magnetic_field),
    it does not include the equilibrium field.


    Sign convention: Positive when the wave magnetic-field perturbation points in
    the direction of the local equilibrium magnetic-field unit vector.'
  unit: T
  physics_domain: auxiliary_heating
  links:
  - name:wave_magnetic_field
  - name:parallel_magnetic_field
  arguments:
  - name: wave_magnetic_field
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
