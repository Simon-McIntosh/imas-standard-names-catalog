      kind: llm
- name: total_power_of_neutral_beam_injector
  kind: scalar
  status: active
  description: Power delivered by all neutral beam injectors at the vacuum vessel
    boundary, evaluated before plasma absorption, shine-through, and fast-ion first-orbit
    loss corrections. It is the non-negative sum of launched kinetic powers over the
    injectors.
  documentation: 'Power delivered by all neutral beam injectors at the vacuum vessel
    boundary is the aggregate launched kinetic power carried by neutral beam particles
    as they enter the vessel. It is a non-negative scalar defined before subsequent
    interaction of the beams with the plasma.


    The sum of per-injector launched powers defines the quantity as:


    $$

    P_{\mathrm{NBI}} = \sum_{j \in \mathcal{J}} P_j

    $$


    where $P_{\mathrm{NBI}}$ is the total launched neutral-beam-injector power, $\mathcal{J}$
    is the set of neutral beam injectors included in the aggregate, and $P_j$ is the
    launched power of injector $j$ crossing its vessel-entry surface into the vessel.
    Injectors that do not launch neutral particles contribute zero.


    This quantity includes all neutral energy components delivered by the aggregated
    injectors at the vessel boundary. It is the sum over [power_of_neutral_beam_injector](name:power_of_neutral_beam_injector)
    and differs from [absorbed_power_of_neutral_beam_injector](name:absorbed_power_of_neutral_beam_injector),
    which is evaluated after subtracting neutral-beam shine-through and fast-ion first-orbit
    losses from launched power. It excludes source electrical input and power stopped
    upstream of the vessel boundary, but no plasma-interaction loss or absorption
    term is subtracted from this launched total.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_neutral_beam_injector
  arguments:
  - name: power_of_neutral_beam_injector
    operator: total
    operator_kind: qualifier
  sources:
  - dd_path: summary/heating_current_drive/power_launched_nbi/value
