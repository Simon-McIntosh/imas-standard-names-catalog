      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Lower triangularity (\u03B4_lower) of nested flux surfaces as\
        \ a function of the poloidal flux coordinate in the MHD equilibrium. Characterizes\
        \ asymmetric shaping of the lower plasma cross-section, influencing MHD stability\
        \ and confinement."
      kind: llm
- name: triangularity_of_plasma_boundary
  kind: scalar
  status: active
  description: Dimensionless shaping parameter equal to the mean normalized inward
    radial displacement of the upper and lower plasma-boundary extrema from the geometric
    center.
  documentation: 'Triangularity of the plasma boundary is a signed dimensionless measure
    of the horizontal displacement of its upper and lower poloidal extrema relative
    to the geometric center. The parent quantity averages the upper and lower contributions
    rather than selecting either extremum alone.


    $$

    \delta = \frac{1}{2}\left[\frac{R_0-R_u}{a}+\frac{R_0-R_l}{a}\right]

    $$


    Here, $\delta$ is the average triangularity; $R_0$ is the major-radius coordinate
    of the geometric center; $R_u$ and $R_l$ are the major-radius coordinates of the
    upper and lower vertical extrema; and $a$ is the plasma-boundary minor radius,
    with all lengths measured in m in the right-handed cylindrical $(R, \phi, Z)$
    frame. The component quantities [upper triangularity](name:upper_triangularity_of_plasma_boundary)
    and [lower triangularity](name:lower_triangularity_of_plasma_boundary) provide
    the two terms, while the normalization uses the boundary radius defined by [radius
    of plasma boundary](name:radius_of_plasma_boundary).


    Sign convention: Positive when the upper and lower extrema are displaced inward,
    toward decreasing major radius $R$, relative to the geometric center.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity_of_plasma_boundary
  - name:lower_triangularity_of_plasma_boundary
  - name:radius_of_plasma_boundary
  sources:
  - dd_path: equilibrium/time_slice/boundary/triangularity
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-boundary-triangularity
    dd_documentation:
      leaf: Triangularity of the plasma boundary
      parent_path: equilibrium/time_slice/boundary
      parent: Description of the plasma boundary used by fixed-boundary codes and
        typically chosen at psi_norm = 99.x% of the separatrix
      data_type: FLT_0D
      unit: '1'
    enhanced_context:
      description: "Triangularity (\u03B4) of the plasma boundary, a shape parameter\
        \ quantifying the asymmetry of the poloidal cross-section relative to the\
        \ midplane. A key geometric descriptor for plasma confinement and MHD stability\
        \ characterisation."
      kind: llm
- name: lower_triangularity_of_plasma_boundary
  kind: scalar
  status: active
  description: Lower triangularity is a dimensionless shape parameter measuring the
    inward radial displacement of the lower plasma-boundary extremum from the geometric
    center, normalized by the plasma minor radius.
  documentation: 'Lower triangularity $\delta_L$ quantifies triangular shaping of
    the lower half of the plasma boundary in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height.


    It is defined from the lower vertical extremum of the last closed magnetic-flux-surface
    contour:


    $$

    \delta_L = \frac{R_\mathrm{geo} - R_L}{a}

    $$


    where $R_\mathrm{geo} = (R_\mathrm{max} + R_\mathrm{min})/2$ is the major radius
    of the geometric center, $R_L$ is the major radius at the boundary point of minimum
    $Z$, and $a = (R_\mathrm{max} - R_\mathrm{min})/2$ is the plasma minor radius.


    This lower component combines with [upper_triangularity_of_plasma_boundary](name:upper_triangularity_of_plasma_boundary)
    to form the average [triangularity_of_plasma_boundary](name:triangularity_of_plasma_boundary).
    It applies to the plasma boundary, whereas [lower_triangularity_of_flux_surface](name:lower_triangularity_of_flux_surface)
    describes a nested interior flux surface.


    Sign convention: Positive when the lower boundary extremum is displaced inward,
    toward smaller major radius $R$, relative to the geometric center.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:upper_triangularity_of_plasma_boundary
  - name:triangularity_of_plasma_boundary
  - name:lower_triangularity_of_flux_surface
