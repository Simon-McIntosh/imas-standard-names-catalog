- name: current_due_to_neutral_beam_injection
  kind: scalar
  status: active
  description: Net toroidal plasma current driven by neutral-beam injection, combining
    the fast-ion current and collisional electron return current after beam ionization.
  documentation: 'Neutral-beam-driven plasma current is the net toroidal current produced
    when injected neutrals ionize and their fast ions transfer momentum to the plasma.
    It includes both the directed fast-ion contribution and the associated collisional
    electron return-current contribution.


    The current is defined by integrating the net neutral-beam-driven toroidal current
    density over the plasma cross-sectional area:


    $$

    I_{\mathrm{NBI}} = \int_{\mathcal{A}_{p}} j_{\phi,\mathrm{NBI}}(R,Z)\,d\mathcal{A}

    $$


    where $I_{\mathrm{NBI}}$ is the neutral-beam-driven plasma current, $j_{\phi,\mathrm{NBI}}$
    is its toroidal current-density contribution, and $\mathcal{A}_{p}$ is the plasma
    cross-sectional area in the right-handed cylindrical $(R,\phi,Z)$ frame.


    This source contribution is distinct from [absorbed power of a neutral beam injector](name:absorbed_power_of_neutral_beam_injector)
    and is combined with other current sources, including [plasma current due to ohmic
    induction](name:plasma_current_due_to_ohmic_induction) and [current due to electron-cyclotron
    current drive](name:current_due_to_electron_cyclotron_current_drive).


    Sign convention: Positive when the net toroidal current flows in the direction
    of increasing toroidal angle $\phi$.'
  unit: A
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_neutral_beam_injector
  - name:plasma_current_due_to_ohmic_induction
  - name:current_due_to_electron_cyclotron_current_drive
  sources:
  - dd_path: summary/heating_current_drive/nbi/current/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-heating_current_drive-nbi-current-value
