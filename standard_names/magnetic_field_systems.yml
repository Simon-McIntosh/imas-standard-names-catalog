      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: "Inclination angle beta (\u03B2) of the second oblique side in\
        \ the trapezoidal cross-section description of an active PF coil element.\
        \ Part of the geometric parameterisation for non-rectangular conductor cross-sections."
      kind: llm
  - dd_path: pf_active/coil/geometry/oblique/beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-geometry-oblique-beta
    dd_documentation:
