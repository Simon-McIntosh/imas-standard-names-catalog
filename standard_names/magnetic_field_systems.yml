- name: resistance_of_passive_loop
  kind: scalar
  status: active
  description: Ohmic resistance of one passive conducting loop, relating its induced
    current to the resistive voltage drop and determining dissipation during electromagnetic
    transients.
  documentation: 'The electrical resistance of a passive conducting loop is the proportionality
    between its current and the voltage drop caused by ohmic dissipation. It represents
    irreversible conversion of electrical energy into heat in the conducting path.


    $$

    V_R = R_{\rm loop} I_{\rm loop}

    $$


    where $V_R$ is the resistive voltage drop in volts, $I_{\rm loop}$ is the loop
    current in amperes, and $R_{\rm loop}$ is the resistance in ohms. For a uniform
    conductor, the resistance is governed by $R_{\rm loop}=\rho\ell/A$, where $\rho$
    is electrical resistivity, $\ell$ is conductor length, and $A$ is cross-sectional
    area. The current is the [current of a passive loop](name:current_of_passive_loop).
    This quantity excludes inductive voltage and describes only the ohmic contribution;
    together with the loop self-inductance, it determines the resistive electromagnetic
    decay timescale. It is the loop-level counterpart of the [resistance of a vacuum
    vessel](name:resistance_of_vacuum_vessel) and depends on the conductor material
    described by its [resistivity](name:resistivity_of_wall_material).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_passive_loop
  - name:resistance_of_vacuum_vessel
  - name:resistivity_of_wall_material
  sources:
  - dd_path: pf_passive/loop/resistance
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_passive.html#pf_passive-loop-resistance
    dd_documentation:
