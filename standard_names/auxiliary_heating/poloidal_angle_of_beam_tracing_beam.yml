name: poloidal_angle_of_beam_tracing_beam
status: draft
description: Poloidal angle of a beam-tracing ray position, measured clockwise from
  the outboard midplane when viewed from the right-hand side of the axis.
documentation: The poloidal angle $\theta_{\mathrm{beam}}$ specifies the angular position
  of a beam-tracing ray in the poloidal cross-section, with the origin at the magnetic
  axis. The convention is clockwise-positive when the poloidal cross-section is viewed
  on the right-hand side of the tokamak symmetry axis, consistent with standard beam-tracing
  codes such as TORBEAM and GRAY. This coordinate, together with the corresponding
  major-radius or flux-surface label, locates the beam trajectory within the plasma
  and is used to compute wave-field amplitude, refractive-index evolution, and power
  deposition profiles for electron cyclotron (EC) heating and current-drive scenarios.
  Typical range is $[0, 2\pi)\;\mathrm{rad}$. See `poloidal_angle_grid_of_flux_tube`
  for an analogous poloidal-angle grid used in gyrokinetic calculations.
