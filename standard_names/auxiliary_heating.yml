- name: thermal_ion_power_density
  kind: scalar
  status: active
  description: Net non-transport volumetric energy source rate for the thermal-ion
    channel, giving local coherent-wave power absorbed by the bulk Maxwellian ion
    population and summed over included thermal-ion species and all charge states.
  documentation: 'Thermal ion power density is the net non-transport volumetric energy
    source rate for the thermal-ion channel, giving the local coherent-wave power
    absorbed by the bulk Maxwellian ion population. It is the absorbed-wave contribution
    associated with [ion power density](name:ion_power_density) for thermal ions,
    not the full ion thermal-channel source term from all heating and loss mechanisms.


    For a complex-amplitude wave representation, the local time-averaged absorbed-wave
    density is the toroidal-mode sum of the electromagnetic work on the thermal-ion
    response:


    $$

    P_i^{\mathrm{th}}(\mathbf{x}) = \sum_n P_{i,n}^{\mathrm{th}}(\mathbf{x}), \qquad
    P_{i,n}^{\mathrm{th}}(\mathbf{x}) = \frac{1}{2}\operatorname{Re}\!\left[\mathbf{J}_{i,n}^{\mathrm{th}}(\mathbf{x})
    \cdot \mathbf{E}_n^*(\mathbf{x})\right]

    $$


    where $P_i^{\mathrm{th}}$ is this thermal ion power density and $P_{i,n}^{\mathrm{th}}$
    is its $n$th toroidal-mode contribution, each in W m$^{-3}$; $\mathbf{x}$ is position;
    $n$ is the toroidal Fourier mode index for angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ increases counter-clockwise
    when viewed from above $+\hat{Z}$, and $Z$ is vertical height; $\mathbf{E}_n$
    is the complex wave electric-field amplitude; $\mathbf{J}_{i,n}^{\mathrm{th}}$
    is the induced current density associated with the thermal-ion response; $^*$
    denotes complex conjugation; and $\operatorname{Re}$ denotes the real part.


    This quantity is extensive in the ion population: it is summed over included thermal-ion
    species and, for each species, over all charge states; [thermal ion charge-state
    power density](name:thermal_ion_charge_state_power_density) denotes the corresponding
    charge-state-resolved density. It excludes power deposited directly into electrons
    or nonthermal fast ions, subsequent collisional energy transfer into thermal ions,
    and transport-flux divergence. The corresponding volume integral is [thermal ion
    absorbed wave power](name:thermal_ion_absorbed_wave_power), and the toroidal-mode
    contribution is [per-toroidal-mode thermal ion power density](name:per_toroidal_mode_thermal_ion_power_density).


    Sign convention: Positive when coherent-wave energy is converted into thermal-ion
    internal energy.'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_density
  - name:per_toroidal_mode_thermal_ion_power_density
  arguments:
  - name: ion_power_density
    operator: thermal
    operator_kind: qualifier
  sources:
