- name: power_over_scrape_off_layer
  kind: scalar
  status: active
  description: Total power of a specified physical process integrated over the scrape-off
    layer, the open-field-line plasma region between the separatrix and the material
    boundaries.
  documentation: "Power over the scrape-off layer quantifies the total power contributed\
    \ by a specified physical process or channel, integrated over the plasma volume\
    \ occupying open magnetic field lines between the last closed flux surface (separatrix)\
    \ and the plasma-facing components. This parent concept generalizes over process-specific\
    \ realizations: the accepted child [radiated_power_over_scrape_off_layer](name:radiated_power_over_scrape_off_layer)\
    \ gives the total electromagnetic radiation emitted by all plasma species and\
    \ emission channels within that region. The upstream power boundary condition\
    \ \u2014 total power crossing the separatrix from the confined plasma into the\
    \ SOL \u2014 is given by [total_lost_power_over_scrape_off_layer](name:total_lost_power_over_scrape_off_layer),\
    \ which is distinct from the process-attributed power described here."
  unit: W
  physics_domain: edge_plasma_physics
  links:
  - name:radiated_power_over_scrape_off_layer
- name: pressure_at_pedestal_top
  kind: scalar
  status: active
  description: Kinetic plasma pressure evaluated at the core-side shoulder of the
    H-mode edge transport barrier for a specified population or defined aggregate.
  documentation: 'Pedestal-top pressure is the kinetic pressure of a specified plasma
    population or defined aggregate, evaluated at the core-side shoulder of the H-mode
    edge transport barrier. Its location is defined by the [normalized poloidal flux
    coordinate of the pedestal](name:normalized_poloidal_flux_coordinate_of_pedestal),
    and its value represents the fitted pedestal-height amplitude.


    For an isotropic kinetic population, pressure is related to its density and temperature
    by:


    $$

    p_{\mathrm{ped}} = n_{\mathrm{ped}} k_B T_{\mathrm{ped}}

    $$


    where $p_{\mathrm{ped}}$ is the pedestal-top kinetic pressure, $n_{\mathrm{ped}}$
    is the corresponding [number density at the pedestal top](name:density_at_pedestal_top),
    $T_{\mathrm{ped}}$ is the corresponding [average temperature at the pedestal top](name:average_temperature_at_pedestal_top),
    and $k_B$ is Boltzmann''s constant.


    A population-specific value is a partial pressure; an aggregate value is the sum
    of the included partial pressures. The [electron pressure at the pedestal top](name:electron_pressure_at_pedestal_top)
    is a concrete population-specific instance. This quantity is distinct from a pressure
    gradient, a maximum-steepness derivative, or a volume-averaged scrape-off-layer
    pressure.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:normalized_poloidal_flux_coordinate_of_pedestal
  - name:density_at_pedestal_top
  - name:average_temperature_at_pedestal_top
  - name:electron_pressure_at_pedestal_top
- name: electron_pressure_at_pedestal_top
  kind: scalar
  status: active
  description: Electron pressure at the pedestal top is the electron kinetic pressure
    pedestal-height amplitude at the fitted core-side shoulder of the H-mode edge
    transport barrier. It is the electron partial-pressure contribution, distinct
    from total plasma pressure at the pedestal top.
  documentation: 'Electron pressure at the pedestal top is the electron kinetic pressure
    pedestal-height amplitude at the fitted core-side shoulder of the H-mode edge
    transport barrier. The quantity represents the electron partial-pressure component
    assigned to that fitted top.


    For scalar electron kinetic pressure, the defining relation to the corresponding
    pedestal-top electron density and electron temperature is:


    $$

    p_{e,\mathrm{ped}} = n_{e,\mathrm{ped}}\, e\, T_{e,\mathrm{ped}}

    $$


    where $p_{e,\mathrm{ped}}$ is this quantity, the subscript $\mathrm{ped}$ denotes
    the pedestal top, $n_{e,\mathrm{ped}}$ is [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top),
    $T_{e,\mathrm{ped}}$ is [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)
    expressed in electronvolts, and $e$ is the elementary-charge conversion factor
    satisfying $1\,\mathrm{eV}=e\,\mathrm{J}$.


    This quantity is distinct from [pressure_at_pedestal_top](name:pressure_at_pedestal_top),
    which includes electron and ion pressure components at the same fitted pedestal
    top. It also excludes separate pedestal-location, width, baseline, and gradient
    quantities, which characterize the position or shape of the edge transport barrier
    rather than the electron pressure height.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_pedestal_top
  - name:pressure_at_pedestal_top
  - name:electron_pressure_over_scrape_off_layer
  arguments:
  - name: pressure_at_pedestal_top
    operator: electron
    operator_kind: qualifier
- name: derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_pressure_at_pedestal_top
  kind: scalar
  status: active
  description: Signed local derivative of fitted electron pressure with respect to
    the normalized poloidal flux coordinate at the H-mode pedestal top. It describes
    the core-side pedestal-top variation of the fitted electron-pressure function,
    not the pressure value or a maximum over a pedestal interval.
  documentation: 'Signed local derivative of fitted electron pressure with respect
    to the normalized poloidal flux coordinate at the H-mode pedestal top is the local
    rate of change of the fitted electron-pressure function with the flux coordinate
    $\psi_N$ at the pedestal-top locus. It is not the derivative of the scalar [electron
    pressure at the H-mode pedestal top](name:electron_pressure_at_pedestal_top);
    that scalar is the pressure value at the same locus.


    The derivative is defined by differentiating the fitted electron-pressure function
    with respect to $\psi_N$ and evaluating the result at the pedestal top:


    $$

    D_{p_e,\mathrm{ped\ top}} = \left.\frac{\partial p_e}{\partial \psi_N}\right|_{\mathrm{ped\
    top}}

    $$


    where $D_{p_e,\mathrm{ped\ top}}$ is this quantity, $p_e$ is [electron pressure](name:electron_pressure),
    and $\psi_N$ is the normalized poloidal flux coordinate, with $\psi_N=0$ at the
    magnetic axis and $\psi_N=1$ at the plasma boundary.


    This quantity is a local pedestal-top derivative. It excludes the steepest pressure-gradient
    value over a pedestal interval, represented by [gradient of electron pressure](name:gradient_of_electron_pressure),
    and it is distinct from electron-density derivatives such as [derivative with
    respect to normalized poloidal flux coordinate of electron density at pedestal
    maximum](name:derivative_with_respect_to_normalized_poloidal_flux_coordinate_of_electron_density_at_pedestal_maximum).


    Sign convention: Positive when electron pressure increases with increasing normalized
    poloidal flux coordinate $\psi_N$ from the magnetic axis toward the plasma boundary.'
  unit: Pa
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_pedestal_top
  arguments:
  - name: electron_pressure_at_pedestal_top
    operator: derivative_with_respect_to_normalized_poloidal_flux_coordinate
    operator_kind: unary_prefix
  sources:
  - dd_path: summary/pedestal_fits/linear/pressure_electron/d_dpsi_norm/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-pedestal_fits-linear-pressure_electron-d_dpsi_norm-value
