- name: radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Generic radial dimension of a toroidal field coil, parameterizing either
    the conductor's absolute major-radius position from the toroidal symmetry axis
    or a local cross-sectional radius of the annular conductor.
  documentation: "A radial distance associated with the geometry of a toroidal field\
    \ coil, abstracting over both the macroscopic position of the coil within the\
    \ machine and the local dimensions of the conductor cross-section. This parent\
    \ quantity encompasses specializations that serve distinct geometric roles in\
    \ electromagnetic modeling and structural analysis of the toroidal field system.\n\
    \nThe child [major_radius_of_toroidal_field_coil](name:major_radius_of_toroidal_field_coil)\
    \ gives the absolute $R$ coordinate of a conductor outline point in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, measured from the toroidal symmetry axis;\
    \ this position governs the $B_\\phi \\propto \\mu_0 N I / (2\\pi R)$ spatial\
    \ variation of the toroidal magnetic field, where $N$ is the number of turns and\
    \ $I$ is the coil current. The child [inner_radius_of_toroidal_field_coil](name:inner_radius_of_toroidal_field_coil)\
    \ gives the bore-side boundary of the annular conductor cross-section \u2014 the\
    \ non-negative distance from the annulus center to the inner edge of the conducting\
    \ material \u2014 which sets the available winding window and governs current\
    \ density estimates.\n\nThese radial measures are obtained from engineering drawings,\
    \ metrology surveys, or finite-element structural models and enter equilibrium\
    \ reconstruction, field mapping, and Lorentz-force calculations. Major-radius\
    \ values for conductor outline points range from roughly 0.5 m on the inboard\
    \ side to several meters on the outboard side depending on device scale; inner\
    \ cross-sectional radii are of order centimeters to tens of centimeters depending\
    \ on conductor design."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_radius_of_toroidal_field_coil
  - name:inner_radius_of_toroidal_field_coil
- name: inner_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Inner radius of the annular conductor cross-section of a toroidal field
    coil. It is the non-negative distance from the annulus center to the bore-side
    boundary of the conducting material.
  documentation: 'The inner radius $r_\mathrm{inner}$ is the distance from the center
    of an annular toroidal-field-coil conductor cross-section to the inner boundary
    of the conducting material. It describes the radius of the central opening of
    the annulus and is defined only for hollow, annular conductor cross-sections,
    with $0 \le r_\mathrm{inner} < r_\mathrm{outer}$.


    For an annular conductor, the conducting cross-sectional area is related to the
    inner and outer radii by:


    $$

    A = \pi\left(r_\mathrm{outer}^2 - r_\mathrm{inner}^2\right)

    $$


    where $A$ is the conducting area, $r_\mathrm{inner}$ is the inner radius in meters,
    and $r_\mathrm{outer}$ is the outer radius in meters. The paired quantity $r_\mathrm{outer}$
    is represented by outer_radius_of_toroidal_field_coil.


    This radius is specified from the mechanical design of the toroidal field coil
    conductor or inferred from cross-section drawings and manufacturing data. Together
    with the outer radius, it determines the amount of conducting material, the available
    cooling or insulation space in the central opening, and derived engineering quantities
    such as average current density.


    Typical values range from 0 m for a solid conductor treated as the limiting case
    to about 0.01-0.5 m for large annular conductors, depending on coil scale, conductor
    technology, cooling-channel layout, and structural design.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  arguments:
  - name: radius_of_toroidal_field_coil
    operator: inner
    operator_kind: qualifier
  sources:
  - id: dd:tf/coil/conductor/cross_section/radius_inner
    dd_path: tf/coil/conductor/cross_section/radius_inner
    status: composed
- name: major_radius_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Major radius of a toroidal-field-coil conductor outline point is its
    radial distance from the toroidal symmetry axis in the right-handed cylindrical
    (R, phi, Z) frame. It is an absolute non-negative coordinate, not a local radial
    offset.
  documentation: 'Major radius of a toroidal-field-coil conductor outline point is
    the absolute radial coordinate $R$ of that point, measured from the toroidal symmetry
    axis. In the right-handed cylindrical $(R, \phi, Z)$ frame, $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height. This quantity describes
    where the conductor outline lies radially and is distinct from a local construction
    offset used to generate the outline.


    For a point with horizontal Cartesian position $(x,y)$ in the right-handed Cartesian
    $(x,y,z)$ frame with $z=Z$, the major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $R$ is the major radius in meters, and $x$ and $y$ are horizontal distances
    in meters from the toroidal symmetry axis. By definition $R \ge 0$; negative values
    are not physical. If an outline point is specified by a local radial offset $\Delta
    R_i$ from a reference radius $R_\mathrm{ref}$, the absolute coordinate is $R_i
    = R_\mathrm{ref} + \Delta R_i$, with $R_i$, $R_\mathrm{ref}$, and $\Delta R_i$
    all in meters.


    In practice, this coordinate is obtained from engineering geometry, survey data,
    or electromagnetic-model geometry by transforming each conductor outline point
    into the right-handed cylindrical $(R, \phi, Z)$ frame and reading its $R$ value.
    It uses the same radial-coordinate concept as [major_radius_of_coil_conductor_element](name:major_radius_of_coil_conductor_element),
    and is analogous to the poloidal-field-coil outline coordinate [radial_outline_of_poloidal_field_coil](name:radial_outline_of_poloidal_field_coil).
    The transverse size of the toroidal-field-coil conductor is instead characterized
    by quantities such as [width_of_toroidal_field_coil](name:width_of_toroidal_field_coil).


    Typical values are set by the scale of the device rather than by a universal material
    property. For tokamak toroidal-field-coil systems, major radii are commonly of
    order 1-10 m, with compact devices below this range and reactor-scale designs
    above it; variations between nearby outline points are usually much smaller than
    the absolute major radius.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radius_of_toroidal_field_coil
  - name:area_of_toroidal_field_coil
  - name:binormal_coordinate_of_toroidal_field_coil
  - name:width_of_toroidal_field_coil
  - name:major_radius_of_poloidal_field_coil
  arguments:
  - name: radius_of_toroidal_field_coil
    operator: major
    operator_kind: qualifier
  sources:
  - id: dd:tf/coil/conductor/cross_section/delta_r
    dd_path: tf/coil/conductor/cross_section/delta_r
    status: composed
- name: resistance_of_correction_coil
  kind: scalar
  status: draft
  description: Electrical resistance of a non-axisymmetric correction coil conductor,
    determining the ohmic power dissipation and static voltage drop across the coil
    terminals.
  documentation: 'The resistance of a correction coil characterizes the DC ohmic resistance
    of the conductor winding, governing resistive power dissipation and the steady-state
    voltage-current relationship in the coil circuit. Correction coils are non-axisymmetric
    coils that apply three-dimensional magnetic perturbations for ELM suppression,
    error field correction, or resonant magnetic perturbation experiments.


    The ohmic power dissipated in the coil is:


    $$

    P_{\rm ohm} = I^2 R

    $$


    where $I$ is the [current through the coil](name:current_of_correction_coil) and
    $R$ is the resistance. The corresponding [terminal voltage](name:voltage_of_correction_coil)
    satisfies $V = IR$ under DC conditions; at finite frequency an inductive contribution
    adds to the impedance, but the resistive component captured here determines steady-state
    dissipation and thermal loading on the coil support structure.


    Resistance is determined from conductor material resistivity (which varies with
    temperature), conductor cross-sectional area, and total winding path length, or
    measured directly by a DC voltage-current sweep at the coil terminals.


    Values for correction coils in large tokamaks range from a few milliohms to several
    ohms, depending on conductor dimensions and winding geometry. The analogous quantity
    for toroidal field coils is [resistance_of_toroidal_field_coil](name:resistance_of_toroidal_field_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_correction_coil
  - name:voltage_of_correction_coil
  - name:resistance_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/resistance
    dd_path: coils_non_axisymmetric/coil/conductor/resistance
    status: composed
  - id: dd:coils_non_axisymmetric/coil/resistance
    dd_path: coils_non_axisymmetric/coil/resistance
    status: composed
- name: resistance_of_passive_loop
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a passive conducting loop, which together
    with its self-inductance sets the L/R time constant governing eddy-current decay
    during plasma transients.
  documentation: 'The resistance of a passive conducting loop quantifies the ohmic
    opposition to current flow in an axisymmetric conductor that is inductively coupled
    to the plasma but not connected to an external power supply. Passive loops carry
    eddy currents induced by changes in plasma current or equilibrium position, and
    their resistance governs how quickly those induced currents decay.


    The resistance $R$ and self-inductance $L$ together determine the characteristic
    decay time constant:


    $$

    \tau = \frac{L}{R}

    $$


    where $\tau$ is the e-folding time for eddy-current decay, $L$ is the self-inductance,
    and $R$ is this resistance. A smaller resistance extends $\tau$, prolonging the
    stabilizing influence of the eddy currents during vertical displacement events
    or plasma disruptions.


    For a loop of uniform cross-section, $R = \rho \ell / A$, where $\rho$ is the
    material resistivity (see [resistivity_of_passive_structure](name:resistivity_of_passive_structure)),
    $\ell$ is the mean conductor path length, and $A$ is the cross-sectional area
    determined by [inner_radius_of_passive_loop](name:inner_radius_of_passive_loop)
    and [outer_radius_of_passive_loop](name:outer_radius_of_passive_loop). Values
    range from sub-milliohm for low-resistivity conductors to tens of milliohms for
    higher-resistivity materials, depending on geometry. This quantity follows the
    established resistance-of-object pattern alongside [resistance_of_toroidal_field_coil](name:resistance_of_toroidal_field_coil)
    and [resistance_of_correction_coil](name:resistance_of_correction_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:resistivity_of_passive_structure
  - name:inner_radius_of_passive_loop
  - name:outer_radius_of_passive_loop
  - name:resistance_of_toroidal_field_coil
  - name:resistance_of_correction_coil
  sources:
  - id: dd:pf_passive/loop/resistance
    dd_path: pf_passive/loop/resistance
    status: composed
- name: resistance_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a poloidal field coil winding. It relates
    coil current to resistive voltage drop and Joule heating at the specified operating
    state.
  documentation: 'Resistance of a poloidal field coil is the effective series ohmic
    resistance of the coil winding at its operating state. It represents conversion
    of electrical energy into heat in the conductor, joints, and other series elements
    included in the coil definition, and it sets the resistive part of the terminal
    voltage demand.


    In a lumped circuit model for coil $k$, the terminal-voltage balance is commonly
    written after choosing branch-current and terminal-voltage reference directions:


    $$

    V_k = R_k I_k + L_k \frac{dI_k}{dt} + \sum_{j \ne k} \epsilon_{kj} M_{kj} \frac{dI_j}{dt}

    $$


    where $V_k$ is the terminal voltage in V, $R_k$ is the coil resistance in ohm,
    $I_k$ and $I_j$ are currents in A, $L_k$ is self-inductance in H, $M_{kj}$ is
    mutual inductance in H, $dI/dt$ is in A/s, $j$ labels coupled circuits or conductors,
    and $\epsilon_{kj}$ is a dimensionless factor equal to $+1$ or $-1$ for the chosen
    mutual-reference orientation. The equation assumes the passive reference for the
    resistive drop, with $V_k$ positive as a voltage drop along the chosen positive
    $I_k$ direction; reversing a current reference or terminal-voltage polarity changes
    the algebraic signs of the inductive and mutual terms consistently, but does not
    change the non-negative value of $R_k$.


    The value is computed from conductor material resistivity, winding length, cross-sectional
    area, cooling state, and the temperature distribution of the winding. It may be
    measured by four-terminal DC injection or inferred from slow current ramps after
    subtracting inductive and mutual voltage contributions. For normal-conducting
    coils the resistance increases with temperature; for superconducting coils the
    effective series resistance depends on whether joints, current-sharing regions,
    or quench behavior are included in the coil model.


    Typical effective resistances are $10^{-4}$-$10^{-1}$ ohm for large normal-conducting
    poloidal field coils and $10^{-3}$-1 ohm for smaller shaping or laboratory coils.
    Superconducting poloidal field windings in steady superconducting operation are
    often represented as 0-$10^{-6}$ ohm effective series resistance when only persistent
    or joint losses are included; during current sharing or a quench, the apparent
    resistance can rise to $10^{-4}$-1 ohm and becomes strongly time dependent.'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:current_of_poloidal_field_coil
  - name:resistance_of_toroidal_field_coil
  - name:resistance_of_correction_coil
  - name:resistance_of_passive_loop
  sources:
  - id: dd:pf_active/coil/resistance
    dd_path: pf_active/coil/resistance
    status: composed
- name: resistance_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Ohmic electrical resistance of a toroidal field coil conductor, determining
    resistive power dissipation and voltage drop during coil operation.
  documentation: 'The resistance of a toroidal field coil is the ohmic impedance of
    its conductor winding at a given temperature and operational state, governing
    how the coil dissipates energy and sustains a voltage drop when carrying current.


    The resistive power deposited in the coil is defined by:


    $$

    P_\mathrm{ohm} = I^2 R_\mathrm{TF}

    $$


    where $I$ is the coil current and $R_\mathrm{TF}$ is the coil resistance. The
    resistance depends on conductor geometry and material electrical resistivity $\rho_e$
    through $R_\mathrm{TF} = \rho_e L / A_c$, where $L$ is the total conductor length
    and $A_c$ is the conductor cross-sectional area.


    Coil resistance is determined by direct four-wire (Kelvin) electrical measurements
    or from conductor material properties and geometry as a function of temperature.
    For superconducting TF coils operated below the critical temperature, the effective
    resistance is negligible; for normal-conducting (resistive) TF coils, values range
    from a few milliohms to tens of milliohms depending on device scale and conductor
    material.


    The resistive voltage drop $V_R = I \cdot R_\mathrm{TF}$ contributes to the total
    terminal voltage captured by [voltage_of_toroidal_field_coil](name:voltage_of_toroidal_field_coil).
    Analogous quantities for other coil systems include [resistance_of_poloidal_field_coil](name:resistance_of_poloidal_field_coil)
    and [resistance_of_correction_coil](name:resistance_of_correction_coil).'
  unit: ohm
  physics_domain: magnetic_field_systems
  links:
  - name:voltage_of_toroidal_field_coil
  - name:resistance_of_poloidal_field_coil
  - name:resistance_of_correction_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/resistance
    dd_path: coils_non_axisymmetric/coil/conductor/resistance
    status: composed
  - id: dd:tf/coil/conductor/resistance
    dd_path: tf/coil/conductor/resistance
    status: composed
  - id: dd:tf/coil/resistance
    dd_path: tf/coil/resistance
    status: composed
- name: resistivity_of_passive_structure
  kind: scalar
  status: draft
  description: Intrinsic electrical resistivity of the material forming a passive
    conducting structure. It is an effective isotropic, nonnegative scalar material
    property that relates local current density to electric field, independent of
    the conductor's geometry, and is distinct from the structure's total electrical
    resistance.
  documentation: 'Electrical resistivity of a passive conducting structure is the
    intrinsic, effective isotropic scalar material property that relates current density
    to electric field and quantifies how strongly the material opposes electrical
    conduction. It applies to non-driven conductors such as vacuum-vessel shells,
    passive stabilizing plates, blanket modules, and support structures, and unlike
    the total resistance it does not depend on the conductor''s path length or cross-sectional
    area. As a material property it is nonnegative.


    The resistivity enters the local form of Ohm''s law relating electric field to
    current density:


    $$

    \mathbf{E} = \rho \, \mathbf{J}

    $$


    where $\mathbf{E}$ is the electric field, $\mathbf{J}$ is the current density,
    and $\rho$ is the resistivity in ohm meter. Its reciprocal is the electrical conductivity,
    $\sigma = 1/\rho$. For a uniform circuit element of effective current-path length
    $L$ and cross-sectional area $A$, the lumped resistance follows as $R = \rho L
    / A$, the quantity that enters circuit models directly.


    Resistivity is usually taken from material specifications, temperature-dependent
    material databases, or direct electrical measurements such as four-terminal resistance
    tests on representative samples. In passive-conductor models it is combined with
    geometry to compute each element resistance, which sets the inductive eddy-current
    decay time $\tau = L/R$ ($L$ being the element self-inductance) governing how
    rapidly induced currents decay following a change in external flux linkage during
    transient electromagnetic events.


    Typical room-temperature values are about $1.7 \times 10^{-8}\,\Omega\,\mathrm{m}$
    for high-conductivity copper, $2.5\text{-}5 \times 10^{-8}\,\Omega\,\mathrm{m}$
    for copper alloys, $2.7 \times 10^{-8}\,\Omega\,\mathrm{m}$ for aluminum, and
    $6\text{-}8 \times 10^{-7}\,\Omega\,\mathrm{m}$ for austenitic stainless steels.
    Heating to several hundred degrees Celsius can raise copper resistivity by roughly
    a factor of 2-3 and stainless-steel resistivity by about 20-50%, depending on
    alloy and temperature history.'
  unit: m.ohm
  physics_domain: magnetic_field_systems
  links:
  - name:area_of_passive_loop
  - name:current_of_passive_loop
  - name:resistance_of_passive_loop
  sources:
  - id: dd:pf_passive/loop/resistivity
    dd_path: pf_passive/loop/resistivity
