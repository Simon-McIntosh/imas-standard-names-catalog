- name: ratio_of_tungsten_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless concentration ratio of tungsten ion number density to
    electron number density in a plasma. The tungsten density is summed over ionized
    tungsten charge states and excludes neutral tungsten atoms.
  documentation: 'Ratio of tungsten density to electron density is a dimensionless
    impurity concentration comparing the total number density of tungsten ions with
    the free-electron number density. The tungsten density counts tungsten nuclei
    in ionized charge states, summed over charge state, and excludes neutral tungsten
    atoms. It is not charge weighted, so it is not the fraction of the electron population
    supplied by tungsten ions.


    The ratio is defined as:


    $$

    c_W = \frac{n_W}{n_e} = \frac{\sum_{z=1}^{74} n_{\mathrm{W}^{z+}}}{n_e}

    $$


    where $n_{\mathrm{W}^{z+}}$ is the number density of tungsten ions in charge state
    $z$, $n_W$ is the total ionized tungsten number density, and $n_e$ is the free-electron
    number density. The lower limit excludes neutral tungsten $\mathrm{W}^0$; if all
    densities are expressed in the same number-density unit, the ratio has unit 1.
    The quantity is meaningful where $n_e>0$ and is non-negative for physical number
    densities.


    In practice, $n_W$ is inferred from plasma composition analysis constrained by
    tungsten radiation and charge-state information, while $n_e$ is obtained from
    electron-density measurements or kinetic reconstructions. The numerator and denominator
    should refer to the same plasma region or averaging operation when the ratio is
    interpreted as a regional concentration.


    Representative core-plasma values in tungsten-containing devices are often $10^{-6}$-$10^{-4}$.
    Local values near strong tungsten sources or in colder boundary regions can be
    higher, for example $10^{-4}$-$10^{-3}$, depending on source strength, ionization
    balance, and plasma conditions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:tungsten_density_at_magnetic_axis
  - name:tungsten_density_at_pedestal
  - name:volume_averaged_tungsten_density
  arguments:
  - name: tungsten_density
    operator: ratio
    operator_kind: binary
    role: a
    separator: to
  - name: electron_density
    operator: ratio
    operator_kind: binary
    role: b
    separator: to
  sources:
  - id: dd:summary/composition/tungsten/value
    dd_path: summary/composition/tungsten/value
    status: composed
- name: tungsten_density_at_limiter
  kind: scalar
  status: draft
  description: Tungsten ion number density in the boundary plasma immediately adjacent
    to a limiter surface at the plasma-limiter contact.
  documentation: 'Tungsten density at a limiter is the local number density of tungsten
    ions in the boundary plasma immediately next to a limiter surface. It characterizes
    how much tungsten released from the limiter is present in the plasma-facing region
    before dilution, ionization, and transport redistribute it elsewhere.


    When charge states are resolved, the total tungsten ion density at the limiter
    is the sum over ionization stages:


    $$

    n_{\mathrm{W,lim}} = \sum_{z=1}^{74} n_{\mathrm{W}^{z+},\mathrm{lim}}

    $$


    where $n_{\mathrm{W}^{z+},\mathrm{lim}}$ is the number density in m^-3 of tungsten
    ions with charge $z$ adjacent to the limiter, and 74 is the atomic number of tungsten.
    Neutral tungsten is not included in this ion density.


    In practice this quantity is estimated from edge impurity diagnostics and boundary-plasma
    modeling, for example by combining spectroscopic line emission, local plasma conditions,
    atomic data, and transport or source estimates. It is closely related to tungsten
    density at other plasma locations, but can be more directly affected by local
    sputtering, prompt redeposition, sheath conditions, and near-surface plasma parameters.


    Typical values are highly device- and discharge-dependent. Trace tungsten conditions
    may give about $10^{10}-10^{14}$ m^-3 near a limiter, while strong local sputtering
    or transient impurity release can raise the boundary value to about $10^{15}-10^{17}$
    m^-3.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
