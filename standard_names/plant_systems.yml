- name: deuterium_count_due_to_gas_injection
  kind: scalar
  status: active
  description: Cumulative post-breakdown inventory of deuterium atoms delivered by
    gas injection, expressed as an equivalent-electron count; each deuterium atom
    contributes one count, and prefill material is excluded.
  documentation: 'This quantity is the cumulative inventory of deuterium atoms delivered
    by gas injection after plasma breakdown, expressed using equivalent-electron count
    units. Material introduced during the prefill phase is excluded.


    For deuterium, the equivalent-electron count is defined by


    $$

    N_{\mathrm{eq},D}(t) = Z_D N_D(t)

    $$


    where $N_{\mathrm{eq},D}$ and $N_D$ are dimensionless cumulative counts, and $Z_D$
    is the dimensionless atomic number of deuterium, equal to one. Thus, the count
    increases by one for every delivered deuterium atom and represents an atomic inventory,
    not an instantaneous injection rate or an ionization-state population. This is
    the deuterium-specific instance of [count due to gas injection](name:count_due_to_gas_injection),
    distinct from the helium-4 inventory [helium-4 count due to gas injection](name:helium_4_count_due_to_gas_injection)
    and from the prefill inventory [deuterium prefill count](name:deuterium_prefill_count).'
  unit: '1'
