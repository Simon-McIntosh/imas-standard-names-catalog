- name: poloidal_mode_number
  kind: scalar
  status: draft
  description: Poloidal mode number m is the dimensionless integer Fourier harmonic
    label for the variation of an MHD perturbation with poloidal angle theta in flux
    coordinates (rho, theta, phi). A single eigenmode may contain several coupled
    m harmonics.
  documentation: "The poloidal mode number $m$ labels the integer Fourier harmonic\
    \ of an MHD perturbation in the poloidal angle $\\theta$ in flux coordinates $(\\\
    rho,\\theta,\\phi)$, where $\\rho$ labels flux surfaces and $\\phi$ is the toroidal\
    \ angle. It describes poloidal periodicity, not radial node count, which is characterized\
    \ separately by [radial_mode_number](name:radial_mode_number). The mathematical\
    \ Fourier index can be any integer; in mode-identification contexts the dominant\
    \ value is usually reported as a non-negative integer, while signed spectral representations\
    \ may retain both signs.\n\nFor a single complex helical harmonic, the perturbation\
    \ of a scalar or field component may be written as\n\n$$\n\\delta f(\\rho,\\theta,\\\
    phi,t) = \\tilde f_m(\\rho)\\,\\exp\\left[i\\left(m\\theta - n\\phi - \\omega\
    \ t\\right)\\right]\n$$\n\nwhere $\\delta f$ is the perturbation, $\\tilde f_m$\
    \ is its radial amplitude, $n$ is the [toroidal_mode_number](name:toroidal_mode_number),\
    \ $\\omega$ is the angular frequency in rad/s, and $\\theta$ and $\\phi$ are angular\
    \ coordinates in radians. For a single harmonic pair, field-line resonance is\
    \ associated with surfaces satisfying $q=m/n$, where $q$ is the [safety_factor](name:safety_factor);\
    \ this condition is not necessarily unique if the $q$ profile is nonmonotonic,\
    \ and a physical eigenmode may include several coupled $m$ values.\n\nIn computations,\
    \ $m$ is obtained by projecting an eigenfunction or perturbation field onto a\
    \ Fourier basis in $\\theta$ on flux surfaces in coordinates $(\\rho,\\theta,\\\
    phi)$. Experimentally it is inferred from the poloidal phase pattern measured\
    \ by magnetic probes, soft-x-ray diagnostics, electron-cyclotron-emission channels,\
    \ or other diagnostics with sufficient poloidal coverage. When multiple harmonics\
    \ are important, a reported value denotes the selected or dominant harmonic for\
    \ that analysis rather than the complete poloidal spectrum.\n\nTypical low-order\
    \ tearing and global MHD modes have $|m|=1-5$, with $m=0$ representing no poloidal\
    \ phase variation. Alfv\xE9nic and high-toroidal-mode-number perturbations can\
    \ involve $|m|$ of order 10-100 or larger, depending on the safety-factor profile\
    \ and on $n$.\n\nSign convention: Positive when the poloidal phase contribution\
    \ in the defining factor is $+m\\theta$, so at fixed $\\rho$, $\\phi$, and $t$\
    \ the complex phase increases as $\\theta$ increases in flux coordinates $(\\\
    rho,\\theta,\\phi)$."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:mode_number
  - name:radial_mode_number
  - name:mode_frequency
