name: argon_gas_injection_rate
status: draft
cocos_transformation_type: one_like
description: Instantaneous rate of argon atom injection into the vacuum vessel, expressed
  in particles per second.
documentation: "The argon gas injection rate $\\Gamma_{\\mathrm{Ar}}$ (s$^{-1}$) gives\
  \ the number of argon atoms entering the vessel per unit time through calibrated\
  \ gas valves. Argon seeding is a standard technique for divertor detachment and\
  \ radiative power exhaust; typical rates span $10^{18}$\u2013$10^{21}$ s$^{-1}$\
  \ depending on device size and scenario. The time integral $\\int \\Gamma_{\\mathrm{Ar}}\\\
  ,dt$ yields the accumulated injection count `argon_accumulated_gas_injection`. Valve\
  \ flow is calibrated against known plenum pressures and molecular-flow conductance\
  \ models. See also `argon_prefill_gas_injection` for the pre-breakdown contribution."
validity_domain: ''
constraints: []
tags:
- particle-balance
