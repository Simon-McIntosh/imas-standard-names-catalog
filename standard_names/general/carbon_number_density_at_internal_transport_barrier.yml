name: carbon_number_density_at_internal_transport_barrier
status: draft
cocos_transformation_type: one_like
description: Number density of carbon ions (summed over all charge states) evaluated
  at the internal transport barrier location.
documentation: The carbon ion number density $n_{\rm C}$ at the internal transport
  barrier (ITB) quantifies the local concentration of all carbon charge states ($\mathrm{C}^{1+}$
  through $\mathrm{C}^{6+}$) at the radial position where the ITB forms. Carbon is
  a common intrinsic impurity in tokamak plasmas with graphite first-wall components,
  and its concentration at the ITB is critical for assessing dilution of the main
  fuel species ($n_{\rm D}$, $n_{\rm T}$) and local radiative losses via $P_{\rm rad}
  \propto n_e n_{\rm C} L_{\rm C}(T_e)$, where $L_{\rm C}$ is the carbon cooling rate.
  Typical ITB carbon densities range from $10^{16}$ to $10^{18}\;\mathrm{m^{-3}}$
  depending on wall conditioning and transport regime. The quantity is usually inferred
  from charge-exchange recombination spectroscopy (CXRS) combined with coronal or
  collisional-radiative modeling. See also `electron_number_density`, `effective_charge`,
  and `boron_ion_number_density` for related impurity and plasma composition quantities.
