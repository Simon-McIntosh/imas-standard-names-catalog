name: neutral_energy_radial_diffusivity_on_ggd
status: draft
description: Effective radial diffusion coefficient for neutral energy (thermal) transport,
  discretized on a general grid description (GGD) mesh.
documentation: "The neutral energy radial diffusivity $\\chi_{n}$ (in $\\mathrm{m^2\\\
  ,s^{-1}}$) parameterizes cross-field heat transport by neutrals in the diffusive\
  \ approximation $q_n = -n_n \\chi_n \\nabla T_n$, where $n_n$ is the neutral density\
  \ and $T_n$ the neutral temperature. This coefficient is used in fluid neutral models\
  \ within edge transport codes (e.g., SOLPS-ITER, SOLEDGE2D) and is discretized on\
  \ the GGD mesh with one value per grid element, enabling spatially resolved treatment\
  \ across the SOL, divertor, and private-flux region. Neutral energy transport governs\
  \ detachment dynamics and target heat-flux footprints. Typical values are comparable\
  \ to the neutral particle diffusivity, $\\chi_n \\sim 0.01$\u2013$10\\,\\mathrm{m^2\\\
  ,s^{-1}}$, depending on neutral opacity and local plasma conditions. See `neutral_particle_radial_diffusivity_on_ggd`\
  \ for the particle channel and `neutral_momentum_radial_diffusivity_on_ggd` for\
  \ the momentum channel."
validity_domain: ''
