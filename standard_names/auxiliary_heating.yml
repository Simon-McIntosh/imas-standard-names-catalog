- name: thermal_ion_state_power_density
  kind: scalar
  status: draft
  description: Volumetric coherent-wave power density absorbed by the thermal (bulk)
    ion population of a specified charge state, distinguishing bulk-ion heating from
    fast-particle wave absorption at the same charge state.
  documentation: "This quantity gives the local rate of wave energy deposition per\
    \ unit plasma volume into the thermal ion population of one specified charge state\
    \ from a coherent electromagnetic wave, such as an ion cyclotron resonance heating\
    \ (ICRH) wave. It is the thermal-ion, charge-state-resolved component of the total\
    \ ion-state power density, separating bulk-ion absorption from the suprathermal\
    \ contribution captured by [fast_ion_state_power_density](name:fast_ion_state_power_density).\n\
    \nThe local absorbed power density for thermal ions in charge state $q$ is:\n\n\
    $$\np_{\\mathrm{th},q} = \\frac{1}{2} \\, \\mathrm{Re}\\!\\left(\\mathbf{E} \\\
    cdot \\mathbf{J}^{*}_{\\mathrm{th},q}\\right)\n$$\n\nwhere $\\mathbf{E}$ is the\
    \ complex wave electric field amplitude and $\\mathbf{J}_{\\mathrm{th},q}$ is\
    \ the complex current density response of the thermal ions in charge state $q$.\n\
    \nSumming over all charge states of a given species yields the species-level quantity\
    \ [thermal_ion_power_density](name:thermal_ion_power_density). Volume-integrating\
    \ over the region enclosed by a given flux surface gives the cumulative absorbed\
    \ power [thermal_ion_state_power_at_inside_flux_surface](name:thermal_ion_state_power_at_inside_flux_surface),\
    \ and the toroidal-mode-resolved form is available as [per_toroidal_mode_thermal_ion_state_power_density](name:per_toroidal_mode_thermal_ion_state_power_density).\
    \ The quantity is computed from full-wave or ray-tracing wave propagation solvers\
    \ coupled to a kinetic description of the bulk ion distribution.\n\nIn ICRH scenarios,\
    \ bulk thermal-ion absorption power densities near the fundamental or harmonic\
    \ cyclotron resonance layer reach 0.1\u201310 MW m$^{-3}$, with the partition\
    \ between thermal and fast ions depending on the minority heating scheme and local\
    \ ion temperature."
  unit: W.m^-3
