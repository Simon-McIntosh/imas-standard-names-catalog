- name: vertical_coordinate_of_reciprocating_probe
  kind: scalar
  status: draft
  description: "Vertical coordinate (cylindrical Z) of the reciprocating probe position\
    \ in the right-handed IMAS cylindrical (R, \u03C6, Z) frame."
  documentation: 'The vertical coordinate $Z$ specifies the height of the reciprocating
    probe head or collector relative to the device midplane ($Z=0$) in the cylindrical
    $(R, \phi, Z)$ system where $Z$ increases upward. This coordinate, together with
    the major radius $R$ ([major_radius_of_reciprocating_probe](name:major_radius_of_reciprocating_probe)),
    defines the probe''s position in the poloidal cross-section. The reciprocating
    probe is typically plunged radially into the edge plasma or scrape-off layer to
    measure local plasma parameters such as [electron_density](name:electron_density)
    and electron temperature; its vertical coordinate is critical for mapping measurements
    to flux surfaces and for analyzing radial profiles at a fixed poloidal angle.


    Sign convention: Positive when the probe is positioned above the device midplane
    ($Z=0$).'
  unit: m
  physics_domain: mechanical_measurement_diagnostics
  links:
  - name:major_radius_of_reciprocating_probe
  - name:electron_density
  sources:
  - id: dd:langmuir_probes/reciprocating/plunge/position/z
    dd_path: langmuir_probes/reciprocating/plunge/position/z
    status: composed
