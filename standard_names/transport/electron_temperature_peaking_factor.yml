name: electron_temperature_peaking_factor
status: draft
cocos_transformation_type: one_like
description: Ratio of the on-axis electron temperature $T_{e,0}$ to the volume-averaged
  electron temperature $\langle T_e \rangle_{\mathrm{vol}}$ inside the last closed
  flux surface.
documentation: "The electron temperature peaking factor is defined as $f_{T_e} = T_{e,0}\
  \ / \\langle T_e \\rangle_{\\mathrm{vol}}$, where $T_{e,0}$ is the electron temperature\
  \ evaluated at the magnetic axis and $\\langle T_e \\rangle_{\\mathrm{vol}} = V^{-1}\\\
  int T_e\\,dV$ is the volume average computed over the plasma volume $V$ enclosed\
  \ by the last closed flux surface (LCFS). It quantifies the degree of profile peaking\
  \ and is a key dimensionless parameter governing core confinement: peaked profiles\
  \ ($f_{T_e} \\gtrsim 2$) are typical of ohmic and low-density L-mode plasmas, while\
  \ broad profiles ($f_{T_e} \\approx 1.2$\u20131.8) characterize high-performance\
  \ H-mode discharges. The peaking factor is routinely derived from Thomson scattering\
  \ and electron cyclotron emission (ECE) measurements combined with equilibrium reconstruction\
  \ for the flux-surface geometry. It appears in global energy confinement scaling\
  \ laws and zero-dimensional power-balance analyses."
