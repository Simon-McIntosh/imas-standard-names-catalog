- name: tendency_of_oscillation_frequency_of_neoclassical_tearing_mode
  kind: scalar
  status: draft
  description: Time rate of change of the lab-frame oscillation frequency of a neoclassical
    tearing mode (NTM), identified by poloidal and toroidal mode numbers (m, n). Quantifies
    instantaneous angular acceleration or deceleration of the rotating magnetic island
    structure.
  documentation: "The tendency of oscillation frequency of a neoclassical tearing\
    \ mode is defined as\n$$\\frac{d\\omega}{dt},$$\nwhere $\\omega$ is the lab-frame\
    \ angular frequency (rad s$^{-1}$) of the mode's oscillation, i.e., the quantity\
    \ given by [oscillation frequency of NTM](name:oscillation_frequency_of_neoclassical_tearing_mode).\
    \ Because radians are dimensionless, the resulting unit is s$^{-2}$.\n\nThe mode\
    \ is labeled by the poloidal and toroidal mode number pair $(m, n)$; common NTM\
    \ modes in tokamaks include $(3,2)$ and $(2,1)$. The oscillation frequency $\\\
    omega$ is measured in the laboratory frame and differs from the plasma-frame frequency\
    \ by the local toroidal plasma rotation velocity at the rational surface $q =\
    \ m/n$.\n\n**Torque-balance context (model illustration):**\n\nIn a simplified\
    \ torque-balance model for the mode layer at the rational surface, this quantity\
    \ relates to the net torque as\n$$\\frac{d\\omega}{dt} = \\frac{1}{J}\\sum_i \\\
    tau_i,$$\nwhere $J$ (kg m$^2$) is the effective rotational inertia of the perturbed\
    \ flow region \u2014 dependent on the island half-width $W$, local mass density\
    \ profile, and radial extent of the flow perturbation \u2014 and $\\tau_i$ (N\
    \ m) are the individual torque contributions (electromagnetic braking, neutral-beam\
    \ momentum input, viscous coupling to bulk plasma, etc.). This model provides\
    \ physical context but is not the definition of the quantity; $d\\omega/dt$ is\
    \ defined purely as the time derivative of the measured lab-frame oscillation\
    \ frequency.\n\n**Typical magnitudes:**\n\n- Quasi-steady rotation phase: $|d\\\
    omega/dt| \\sim 10^2$\u2013$10^3$ s$^{-2}$.\n- During rapid locking events: $|d\\\
    omega/dt|$ can transiently reach $10^4$\u2013$10^5$ s$^{-2}$.\n\nSign convention:\
    \ Positive when the oscillation frequency is increasing in time, corresponding\
    \ to acceleration of the mode in the direction of increasing toroidal angle $\\\
    phi$ in the right-handed cylindrical $(R, \\phi, Z)$ frame; negative when the\
    \ mode is decelerating.\n\nThe related [NTM torque](name:neoclassical_tearing_mode_torque)\
    \ quantifies forces driving changes in this quantity, while the [island width](name:neoclassical_tearing_mode_island_width)\
    \ characterizes the mode amplitude."
  unit: s^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:neoclassical_tearing_mode_torque
  - name:neoclassical_tearing_mode_island_width
  - name:neoclassical_tearing_mode_seed_island_width
  - name:tendency_of_neoclassical_tearing_mode_oscillation_frequency
  constraints: []
  sources:
  - id: dd:ntms/time_slice/mode/dfrequency_dt
    dd_path: ntms/time_slice/mode/dfrequency_dt
    status: composed
- name: toroidal_flux_radius_of_neoclassical_tearing_mode_island_center
  kind: scalar
  status: draft
  description: Toroidal flux radius at the radial center (O-point) of a neoclassical
    tearing mode magnetic island, obtained by mapping the O-point position onto the
    unperturbed axisymmetric equilibrium flux-surface labeling.
  documentation: "The toroidal flux radius of the NTM island center is a dimensional\
    \ radial coordinate $\\rho_{\\mathrm{tor}}$ (in meters) that labels the radial\
    \ position of the magnetic O-point of a neoclassical tearing mode (NTM) island\
    \ chain within the equilibrium flux-surface geometry.\n\n## Definition\n\nThe\
    \ coordinate is defined as\n$$\\rho_{\\mathrm{tor}} = \\sqrt{\\frac{\\Phi_{\\\
    mathrm{tor}}}{\\pi B_0}},$$\nwhere $\\Phi_{\\mathrm{tor}}$ is the toroidal magnetic\
    \ flux enclosed by a flux surface in the unperturbed axisymmetric equilibrium,\
    \ and $B_0$ is the vacuum toroidal magnetic field evaluated at the reference major\
    \ radius $R_0$. Because the NTM island breaks the nested flux-surface topology\
    \ in a finite radial band around the rational surface $q = m/n$, the O-point itself\
    \ does not lie on a regular axisymmetric flux surface. The reported $\\rho_{\\\
    mathrm{tor}}$ value is therefore the label of the unperturbed flux surface whose\
    \ radial position in the midplane corresponds to the O-point location\u2014i.e.,\
    \ it is a mapped coordinate assigned by projecting the island center back onto\
    \ the surrounding equilibrium.\n\nSign convention: Positive when the enclosed\
    \ toroidal flux $\\Phi_{\\mathrm{tor}}$ increases from the magnetic axis outward,\
    \ with $\\rho_{\\mathrm{tor}} = 0$ at the magnetic axis.\n\n## Physical context\n\
    \nIn the small-island limit the O-point coincides with the unperturbed rational\
    \ surface; as the island grows the O-point may shift due to equilibrium evolution,\
    \ pressure profile flattening within the island separatrix, and nonlinear coupling\
    \ to neighboring rational surfaces. The reported value reflects the instantaneous\
    \ O-point position rather than a fixed rational-surface label.\n\nTypical values\
    \ in present-day tokamaks range from approximately $0.1$ m to $0.8$ m depending\
    \ on device size. In normalized terms the island center commonly lies in the region\
    \ $\\rho_{\\mathrm{tor}}/\\rho_{\\mathrm{tor,edge}} \\approx 0.3$\u2013$0.8$,\
    \ with $(m,n) = (3,2)$ modes tending to appear at smaller radii than $(2,1)$ modes.\n\
    \n## Relationship to related quantities\n\nThis quantity specifies the center\
    \ of the island; the radial extent around that center is given by [neoclassical_tearing_mode_island_width](name:neoclassical_tearing_mode_island_width).\
    \ The sibling standard name [neoclassical_tearing_mode_toroidal_flux_radius](name:neoclassical_tearing_mode_toroidal_flux_radius)\
    \ denotes the same physical concept\u2014the flux-surface label at the island\
    \ center\u2014expressed in the same coordinate. The torque exerted by the NTM\
    \ on the plasma, characterized by [torque_due_to_neoclassical_tearing_mode](name:torque_due_to_neoclassical_tearing_mode),\
    \ depends sensitively on this radial location through the local bootstrap current\
    \ gradient.\n\nThe reference magnetic field $B_0$ entering the definition is evaluated\
    \ at the major radius recorded under [major_radius_of_vacuum_toroidal_field_reference_point](name:major_radius_of_vacuum_toroidal_field_reference_point)."
  unit: m
  physics_domain: magnetohydrodynamics
  links:
  - name:neoclassical_tearing_mode_island_width
  - name:neoclassical_tearing_mode_toroidal_flux_radius
  - name:torque_due_to_neoclassical_tearing_mode
  constraints: []
  sources:
  - id: dd:ntms/time_slice/mode/detailed_evolution/rho_tor
    dd_path: ntms/time_slice/mode/detailed_evolution/rho_tor
    status: composed
