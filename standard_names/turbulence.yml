- name: particle_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: draft
  description: Normalized gyrocenter particle flux driven by the perturbed parallel
    component of the magnetic vector potential in gyrokinetic simulations.
  documentation: "This quantity represents the contribution of the perturbed parallel\
    \ electromagnetic vector potential ($\tilde{A}_{\\parallel}$) to the turbulent\
    \ radial particle transport, normalized using the simulation reference scales.\
    \ In electromagnetic gyrokinetic simulations, the particle flux $\u0393(\\tilde{A}_{\\\
    parallel})$ captures the $\u03B4\\mathbf{B}_{\\perp}$-induced drift transport\
    \ channel, complementing the electrostatic ($\u03C6$) and parallel magnetic ($\u03B4\
    \ B_{\\parallel}$) channels. Typical values in nonlinear gyrokinetic flux-tube\
    \ simulations range from 0.1 to 10 times the gyro-Bohm level for ion-scale turbulence,\
    \ becoming significant at finite plasma beta when electromagnetic effects modify\
    \ the mode structure. The flux is computed by velocity-space integration of the\
    \ product of the perturbed distribution function and the radial component of the\
    \ $\u03B4\\mathbf{A}_{\\parallel}$-induced $\\mathbf{E}\\times\\mathbf{B}$ drift\
    \ velocity.\n\nSign convention: Positive when the net radial particle flux from\
    \ the $\tilde{A}_{\\parallel}$ channel is directed outward (away from the magnetic\
    \ axis).\n\nThis quantity is the particle-flux counterpart of [energy_flux_due_to_perturbed_parallel_vector_potential](name:energy_flux_due_to_perturbed_parallel_vector_potential)\
    \ and the particle-flux complement to [particle_flux_due_to_perturbed_parallel_magnetic_field](name:particle_flux_due_to_perturbed_parallel_magnetic_field),\
    \ together providing a complete decomposition of electromagnetic turbulent transport."
  unit: '1'
