- name: toroidal_angle_of_launching_position
  kind: scalar
  status: active
  description: "Toroidal angle of launching position is the azimuthal coordinate of\
    \ the physical point where a heating wave or particle beam is launched, measured\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame with R major radius, \u03C6\
    \ toroidal angle, and Z vertical height."
  documentation: 'Toroidal angle of launching position is the azimuthal coordinate
    of the physical point where a heating wave or particle beam is launched. It is
    defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major
    radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    For a launch point whose horizontal Cartesian coordinates are expressed in a right-handed
    Cartesian $(\hat{x}, \hat{y}, \hat{z})$ frame with $\hat{z}=\hat{Z}$ and $+\hat{x}$
    defining $\phi=0$, the toroidal angle is


    $$

    \phi_\mathrm{launch} = \operatorname{atan2}(y_\mathrm{launch}, x_\mathrm{launch})
    \bmod 2\pi

    $$


    where $x_\mathrm{launch}$ and $y_\mathrm{launch}$ are the horizontal Cartesian
    coordinates of the launch point, in meters, and $\operatorname{atan2}$ returns
    the quadrant-resolved azimuth.


    This quantity specifies only the toroidal location of the launch point. The vertical
    coordinate of the same point is [vertical_coordinate_of_launching_position](name:vertical_coordinate_of_launching_position),
    while steering or propagation orientation is represented by direction quantities
    such as [toroidal_angle_of_electron_cyclotron_beam](name:toroidal_angle_of_electron_cyclotron_beam);
    this quantity is not a beam direction or wave-vector angle. Values differing by
    integer multiples of $2\pi$ identify the same toroidal locus.


    Sign convention: Positive when the angular displacement from the $\phi=0$ direction
    is counter-clockwise as viewed from the $+\hat{Z}$ side looking toward decreasing
    $Z$.'
  unit: rad
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ec_launchers/beam/launching_position/phi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-beam-launching_position-phi
