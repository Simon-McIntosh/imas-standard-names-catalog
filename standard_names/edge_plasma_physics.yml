- name: argon_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of argon ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile.
  documentation: 'The argon ion number density at the pedestal top quantifies the
    local concentration of argon impurity ions at the shoulder of the H-mode edge
    transport barrier. The pedestal top is the radial position where the steep edge-gradient
    region transitions to the shallower core profile, establishing the inner boundary
    condition for argon impurity transport into the plasma core and setting the argon
    inventory available for radiative power exhaust.


    The local number density is the zeroth velocity-space moment of the argon ion
    distribution function $f_{\rm Ar}$:


    $$

    n_{\rm Ar} = \int f_{\rm Ar}(\mathbf{v}) \, d^3v

    $$


    where $\mathbf{v}$ is the ion velocity. The contribution of pedestal argon to
    the free electron density is $n_e^{\rm Ar} = \bar{Z}_{\rm Ar} \, n_{\rm Ar}$,
    where $\bar{Z}_{\rm Ar}$ is the mean ionization state of argon at the pedestal.


    Pedestal argon density is typically inferred from charge-exchange recombination
    spectroscopy or spectroscopic analysis of argon line emission, supplemented by
    edge impurity transport modeling. Comparing this value with [argon_density_at_plasma_boundary](name:argon_density_at_plasma_boundary)
    characterizes the argon density gradient across the pedestal, while [argon_density_at_magnetic_axis](name:argon_density_at_magnetic_axis)
    reflects core accumulation. The analogous quantity for neon seeding is [neon_density_at_pedestal](name:neon_density_at_pedestal).
    This quantity forms part of the broader [density_at_pedestal](name:density_at_pedestal)
    family describing impurity and main-ion pedestal characterization.


    Typical argon pedestal densities in seeded H-mode discharges range from $10^{15}$
    to $10^{18}$ m$^{-3}$, several orders of magnitude below the main ion pedestal
    density.


    Sign convention: Positive when argon ions populate the pedestal plasma; vanishes
    in the absence of argon seeding.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:argon_density_at_plasma_boundary
  - name:argon_density_at_magnetic_axis
  - name:neon_density_at_pedestal
  - name:density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/argon/value
    dd_path: summary/local/pedestal/n_i/argon/value
    status: composed
- name: argon_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Boundary-averaged number density of argon ions on the plasma boundary,
    represented by the last closed flux surface separating the magnetically confined
    plasma from the open-field-line scrape-off layer. Unless a charge state is specified
    separately, argon ions refers to all ionization stages combined.
  documentation: 'Argon density at the plasma boundary is the surface-averaged number
    density of argon ions on the last closed flux surface, also called the separatrix.
    It provides a boundary-representative measure of argon impurity content, distinct
    from local poloidal or toroidal variations, and is the argon analog of other impurity
    boundary densities such as [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary)
    and [xenon_density_at_plasma_boundary](name:xenon_density_at_plasma_boundary).


    The boundary average over the separatrix surface is defined by


    $$

    n_{\mathrm{Ar},b} = \left\langle n_{\mathrm{Ar}} \right\rangle_{S_\mathrm{sep}}
    = \frac{\int_{S_\mathrm{sep}} n_{\mathrm{Ar}}(\mathbf{x})\, dA}{\int_{S_\mathrm{sep}}
    dA}

    $$


    where $S_\mathrm{sep}$ is the last closed flux surface, $n_{\mathrm{Ar}}(\mathbf{x})$
    is the local total argon ion number density, and $dA$ is the surface area element.
    Unless an individual charge state is explicitly specified, $n_{\mathrm{Ar}}$ denotes
    the sum over all argon ionization stages.


    In experiments, this quantity is inferred from argon line emission using spectroscopic
    measurements together with electron density, electron temperature, and collisional-radiative
    or impurity transport modeling. In simulations and equilibrium-edge coupling,
    it is often computed by averaging the modeled argon density over the separatrix,
    without assuming that the impurity density is constant on that surface.


    Typical values are about $10^{14}-10^{16}$ m^-3 for trace argon concentrations
    and about $10^{16}-10^{18}$ m^-3 during deliberate radiative seeding, depending
    on gas injection rate, edge temperature, ionization balance, transport, and plasma
    size. These values are usually small compared with the total electron or main-ion
    density at the boundary, but can strongly affect edge radiation because argon
    is a high-Z impurity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:argon_density_at_divertor_target
  - name:argon_density_at_pedestal
  - name:neon_density_at_plasma_boundary
  sources:
  - id: dd:summary/local/separatrix/n_i/argon/value
    dd_path: summary/local/separatrix/n_i/argon/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/argon/value
    dd_path: summary/local/separatrix_average/n_i/argon/value
    status: composed
- name: electron_temperature_at_pedestal
  kind: scalar
  status: draft
  description: Electron temperature at the top of the H-mode pedestal transport barrier,
    representing the characteristic pedestal height parameter extracted from analytic
    fits to the steep-gradient edge profile.
  documentation: "The electron pedestal temperature $T_{e,\\mathrm{ped}}$ characterizes\
    \ the bulk thermal energy of the electron population at the top of the H-mode\
    \ edge transport barrier \u2014 the high-confinement pedestal formed just inside\
    \ the separatrix. As a pedestal height parameter, it represents the plateau value\
    \ of the electron temperature profile above the steep-gradient region, providing\
    \ a key macroscopic boundary condition that sets the scale of core temperature\
    \ profiles in H-mode discharges.\n\nThe pedestal height is extracted by fitting\
    \ analytic models \u2014 including linear and smooth modified-hyperbolic-tangent\
    \ forms \u2014 to measured edge electron temperature profiles. Each fitting approach\
    \ yields a value $T_{e,\\mathrm{ped}}$ corresponding to the temperature at which\
    \ the steep pedestal gradient transitions to the flatter core region, making $T_{e,\\\
    mathrm{ped}}$ a robust, fit-model-dependent summary scalar for the pedestal state.\n\
    \nPedestal electron temperatures in H-mode discharges on mid-scale tokamaks range\
    \ from approximately 0.3 to 5 keV, increasing with plasma current and auxiliary\
    \ heating power. Together with the pedestal electron density, $T_{e,\\mathrm{ped}}$\
    \ determines the pedestal electron pressure captured by [electron_pressure_at_pedestal](name:electron_pressure_at_pedestal).\
    \ The closely related [electron_temperature_at_pedestal_top](name:electron_temperature_at_pedestal_top)\
    \ targets the same physical location using an explicit profile-top convention,\
    \ while [gradient_of_electron_temperature](name:gradient_of_electron_temperature)\
    \ quantifies the steepness of the transport barrier.\n\nSign convention: Positive\
    \ for all physical plasmas, as electron temperature is a measure of mean thermal\
    \ kinetic energy per degree of freedom and is intrinsically non-negative."
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_pressure_at_pedestal
  - name:electron_temperature_at_pedestal_top
  - name:gradient_of_electron_temperature
  sources:
  - id: dd:summary/pedestal_fits/linear/t_e/pedestal_height/value
    dd_path: summary/pedestal_fits/linear/t_e/pedestal_height/value
    status: composed
  - id: dd:summary/pedestal_fits/mtanh/t_e/pedestal_height/value
    dd_path: summary/pedestal_fits/mtanh/t_e/pedestal_height/value
    status: attached
- name: magnetic_shear_at_pedestal
  kind: scalar
  status: draft
  description: "Dimensionless magnetic shear \u2014 the normalized logarithmic derivative\
    \ of the safety factor with respect to normalized toroidal flux radius \u2014\
    \ evaluated at the H-mode pedestal transport barrier."
  documentation: "Magnetic shear quantifies the spatial variation of field-line helicity\
    \ across nested flux surfaces, controlling the stability of MHD and drift-wave\
    \ modes. Evaluated at the pedestal \u2014 the steep pressure-gradient transport\
    \ barrier characteristic of H-mode confinement \u2014 it enters directly into\
    \ peeling-ballooning stability criteria governing edge-localized modes and sets\
    \ constraints on the maximum achievable pedestal pressure.\n\nThe pedestal magnetic\
    \ shear is defined as:\n\n$$\ns = \\frac{\\rho_\\mathrm{tor}}{q} \\frac{dq}{d\\\
    rho_\\mathrm{tor}}\n$$\n\nwhere $q$ is the local safety factor and $\\rho_\\mathrm{tor}$\
    \ is the normalized toroidal flux radius, equal to 0 at the magnetic axis and\
    \ 1 at the separatrix. This is the scalar pedestal-locus counterpart of the radial\
    \ profile [magnetic_shear](name:magnetic_shear_at_pedestal), and is analogous\
    \ in structure to [magnetic_shear_at_magnetic_axis](name:magnetic_shear_at_magnetic_axis)\
    \ evaluated on axis and [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier)\
    \ evaluated at internal barriers.\n\nPedestal magnetic shear is inferred from\
    \ equilibrium reconstruction, combining external magnetic measurements with internal\
    \ profile constraints such as motional Stark effect polarimetry or pressure-profile\
    \ data. In conventional H-mode pedestals, $s$ spans 1\u20135, reflecting the rapid\
    \ increase in $q$ across the narrow pedestal width; reversed-shear configurations\
    \ can yield negative values near the pedestal foot.\n\nSign convention: Positive\
    \ when $q$ increases with increasing $\\rho_\\mathrm{tor}$, corresponding to outward-increasing\
    \ field-line helicity toward the plasma edge."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_at_magnetic_axis
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/pedestal/magnetic_shear/value
    dd_path: summary/local/pedestal/magnetic_shear/value
    status: composed
- name: nitrogen_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of nitrogen impurity ions at the H-mode pedestal top,
    where the steep-gradient edge transport barrier transitions to the flatter core
    plasma.
  documentation: 'Nitrogen density at the pedestal is the total number density of
    nitrogen impurity ions at the pedestal top of an H-mode plasma. Unless a charge
    state is specified separately, it represents the sum over all nitrogen ionization
    states at the location where the steep edge transport barrier joins the core plasma.


    The density is the zeroth velocity moment of the nitrogen ion distribution functions
    at the pedestal-top position:


    $$

    n_{\mathrm{N,ped}} = \sum_q \int f_{\mathrm{N}^{q+}}(\mathbf{x}_{\mathrm{ped}},\mathbf{v})\,d^3v

    $$


    where $n_{\mathrm{N,ped}}$ is in m^-3, $q$ indexes nitrogen ionization charge
    states, $f_{\mathrm{N}^{q+}}$ is the phase-space distribution function with units
    m^-6 s^3, $\mathbf{x}_{\mathrm{ped}}$ is the pedestal-top position, $\mathbf{v}$
    is particle velocity in m/s, and $d^3v$ has units m^3 s^-3. For a single resolved
    charge state, the summation is omitted.


    In practice this quantity is inferred from impurity spectroscopy, charge-exchange
    recombination measurements when available, and collisional-radiative modeling,
    often constrained by local electron density and temperature at the pedestal top.
    The pedestal top is identified from the transition between the steep edge gradient
    region and the core plasma, commonly using fitted electron pressure, density,
    or temperature behavior.


    Representative pedestal nitrogen densities span roughly 10^16-10^19 m^-3, depending
    strongly on nitrogen seeding level, edge transport, ionization balance, and plasma
    size. Trace or unseeded conditions are usually toward the lower end, while actively
    seeded H-mode plasmas can reach the upper part of this range locally.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:nitrogen_density_at_limiter
  - name:density_at_pedestal
  - name:neon_density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/nitrogen/value
    dd_path: summary/local/pedestal/n_i/nitrogen/value
    status: composed
- name: nitrogen_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of nitrogen impurity ions evaluated at the plasma boundary
    (separatrix), representing the impurity concentration at the last closed flux
    surface separating confined plasma from the scrape-off layer.
  documentation: "Nitrogen ion number density at the plasma boundary quantifies the\
    \ concentration of nitrogen impurity ions at the separatrix \u2014 the last closed\
    \ flux surface demarcating the magnetically confined plasma from the open-field-line\
    \ scrape-off layer. This is the nitrogen-species instantiation of [density_at_plasma_boundary](name:density_at_plasma_boundary).\
    \ Nitrogen is routinely injected into tokamaks as a controlled impurity to enhance\
    \ radiative dissipation of exhaust power and reduce peak heat loads at divertor\
    \ targets.\n\nThe boundary value reflects the balance between impurity sources\
    \ (gas injection, ionization of recycled neutrals) and outward transport through\
    \ the scrape-off layer. Its magnitude relative to the main-ion density influences\
    \ the effective charge $Z_\\mathrm{eff}$ and the radiated power fraction at the\
    \ plasma edge. The toroidal flow of nitrogen at the same location is separately\
    \ captured by [toroidal_nitrogen_velocity_at_plasma_boundary](name:toroidal_nitrogen_velocity_at_plasma_boundary).\n\
    \nThe quantity is inferred from spectroscopic measurements of nitrogen line emission\
    \ in the edge and divertor regions combined with collisional-radiative modeling,\
    \ or from fluid impurity transport simulations constrained by bolometric data.\
    \ Typical values range from $10^{16}$ to $10^{19}$ m$^{-3}$, depending on the\
    \ nitrogen injection rate and edge plasma density. Analogous separatrix densities\
    \ for other impurity species include [neon_density_at_plasma_boundary](name:neon_density_at_plasma_boundary),\
    \ [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary),\
    \ and [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary).\n\
    \nSign convention: Positive definite, as number density is a particle count per\
    \ unit volume and does not change sign under any coordinate transformation."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:toroidal_nitrogen_velocity_at_plasma_boundary
  - name:neon_density_at_plasma_boundary
  - name:carbon_density_at_plasma_boundary
  - name:oxygen_density_at_plasma_boundary
