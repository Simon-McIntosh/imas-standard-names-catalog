- name: vertical_offset_of_conductor_cross_section_contour_point
  kind: scalar
  status: draft
  description: Vertical displacement $\Delta Z$ of a conductor cross-section contour
    point relative to the local reference point, specifying the vertical extent of
    the coil conductor shape.
  documentation: 'The vertical offset $\Delta Z$ is the $Z$-component of the displacement
    vector from a local reference point to a point on the boundary contour of a coil
    conductor cross-section, measured in the right-handed cylindrical $(R, \phi, Z)$
    frame where $Z$ is the vertical coordinate. Together with the radial counterpart
    [radial_offset_of_conductor_cross_section_contour_point](name:radial_offset_of_conductor_cross_section_contour_point),
    it fully characterizes the two-dimensional cross-sectional shape of the conductor;
    the pair $(\Delta R, \Delta Z)$ forms the full displacement vector described by
    the parent quantity [offset_of_conductor_cross_section_contour_point](name:offset_of_conductor_cross_section_contour_point).
    The contour is typically defined by a polygon of $N$ vertices, with each vertex
    contributing one $\Delta Z$ value; the set of vertices traces the conductor outline
    used in current-carrying area calculations and mutual-inductance evaluations.
    Typical magnitudes range from a few millimeters to tens of centimeters depending
    on conductor size, and the values are obtained from engineering drawings or CAD
    models of the coil assembly. The absolute vertical position of the conductor element
    center is given separately by [vertical_coordinate_of_conductor_element_center](name:vertical_coordinate_of_conductor_element_center).


    Sign convention: Positive when the contour point is displaced in the direction
    of increasing $Z$ (upward) relative to the reference point.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:radial_offset_of_conductor_cross_section_contour_point
  - name:offset_of_conductor_cross_section_contour_point
  - name:vertical_coordinate_of_conductor_element_center
