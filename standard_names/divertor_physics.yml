      kind: llm
- name: particle_flux_of_divertor_due_to_recycling
  kind: scalar
  status: active
  description: Rate at which recycling processes at divertor plasma-facing surfaces
    return particles to the plasma, encompassing neutral re-emission, molecular gas
    release, desorption, and ion reflection across the divertor assembly.
  documentation: 'The particle flux of the divertor due to recycling is the global
    rate, in particles per second, at which recycling at divertor plasma-facing surfaces
    replenishes the edge plasma particle inventory. Recycling mechanisms include neutral
    re-emission, molecular gas release, desorption from the target material, and ion
    reflection, followed by dissociation or ionization that re-introduces particles
    into the plasma.


    This quantity is the particle-channel specialization of the broader [flux_of_divertor_due_to_recycling](name:flux_of_divertor_due_to_recycling),
    which covers energy, momentum, and other transported channels in addition to particle
    content. It covers all divertor targets collectively; the fully aggregated instance
    summed over all divertor targets is [total_particle_flux_of_divertor_due_to_recycling](name:total_particle_flux_of_divertor_due_to_recycling).
    It excludes particle injection from wall or limiter surfaces, which is described
    by [source_rate_due_to_surface_emission](name:source_rate_due_to_surface_emission).'
  unit: s^-1
  physics_domain: divertor_physics
  links:
  - name:flux_of_divertor_due_to_recycling
  - name:total_particle_flux_of_divertor_due_to_recycling
  - name:source_rate_due_to_surface_emission
