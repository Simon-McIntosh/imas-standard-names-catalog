      data_type: FLT_0D
      unit: e
    enhanced_context:
      description: Ionic charge (Z_ion) of the fast ion species involved in a Fast
        Ion Charge eXchange (FICX) emission event measured by the charge exchange
        diagnostic. Specifies the charge state of the energetic ion associated with
        the measured CXRS spectral line.
      kind: llm
- name: floating_electrostatic_potential
  kind: scalar
  status: active
  description: Floating electrostatic potential is the voltage-valued potential of
    an electrically isolated probe or surface when net current from the plasma is
    zero.
  documentation: 'Floating electrostatic potential is the voltage-valued scalar potential
    established at an electrically isolated probe or surface when the net current
    from the plasma to that object is zero. It is a floating realization of [electrostatic_potential](name:electrostatic_potential),
    distinct from a prescribed wall voltage, material wall voltage, or applied bias.


    Its defining current-balance condition is


    $$

    I_{\rm net}(\Phi_f) = 0

    $$


    where $\Phi_f$ is the floating potential expressed in volts and $I_{\rm net}$
    is the total conventional electric current collected by the isolated object, expressed
    in amperes.


    The value is determined by the balance of all included charged-particle current
    contributions. It is distinct from the adjacent plasma potential represented by
    [electrostatic_potential_at_wall](name:electrostatic_potential_at_wall). The corresponding
    [fluctuating floating electrostatic potential](name:fluctuating_floating_electrostatic_potential)
    describes variation about this floating value rather than the mean potential itself.


    Sign convention: Positive when a positive test charge has greater electrostatic
    potential energy at the isolated object than at the chosen electrical reference.'
  unit: V
  physics_domain: particle_measurement_diagnostics
  links:
  - name:electrostatic_potential
  - name:electrostatic_potential_at_wall
  arguments:
  - name: electrostatic_potential
    operator: floating
    operator_kind: qualifier
  sources:
  - dd_path: langmuir_probes/embedded/v_floating
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/langmuir_probes.html#langmuir_probes-embedded-v_floating
