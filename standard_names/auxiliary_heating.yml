- name: per_toroidal_mode_right_hand_circularly_polarized_wave_electric_field
  kind: scalar
  status: draft
  description: Amplitude of the right-hand circularly polarized E-minus component
    of a radio-frequency wave electric field for one toroidal Fourier mode. It is
    a local electric-field amplitude used to characterize polarization-dependent wave
    coupling and absorption.
  documentation: 'Per-toroidal-mode right-hand circularly polarized wave electric
    field is the local amplitude of the $E^-$ component of an oscillatory electromagnetic
    wave for a single toroidal Fourier harmonic. It isolates the transverse wave-field
    component with right-hand circular polarization about the equilibrium magnetic-field
    direction. The quantity is local in the poloidal plane and is not a flux-surface
    average.


    Let the toroidal dependence be expanded in the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius in meters, $\phi$ is toroidal angle in radians,
    and $Z$ is vertical height in meters. For harmonic $n$, use a local right-handed
    field-aligned basis $(\hat{e}_1, \hat{e}_2, \hat{b})$ with $\hat{b}=\mathbf{B}_0/|\mathbf{B}_0|$
    and $\hat{e}_1\times\hat{e}_2=\hat{b}$; with wave phasors proportional to $e^{i
    n\phi-i\omega t}$, the $E^-$ amplitude is:


    $$

    E_{-,n}(R,Z)=\left|\frac{E_{1,n}(R,Z)-iE_{2,n}(R,Z)}{\sqrt{2}}\right|

    $$


    where $E_{1,n}$ and $E_{2,n}$ are the complex transverse electric-field components
    of harmonic $n$, each in V m$^{-1}$; $n$ is the dimensionless toroidal mode number;
    $\omega$ is angular frequency in rad s$^{-1}$; and $E_{-,n}$ has units V m$^{-1}$.
    The minus projection $(E_{1,n}-iE_{2,n})/\sqrt{2}$ defines the right-hand circular
    $E^-$ basis convention, and this quantity is the magnitude of that complex component,
    not its phase.


    In practice, $E_{-,n}$ is usually obtained from frequency-domain wave calculations
    of the launched antenna spectrum using the equilibrium magnetic field, plasma
    density, temperature, and species composition. Experimental constraints are indirect
    and can come from radio-frequency field probes, antenna loading, deposited-power
    estimates, fast-ion response, and comparison with inferred absorption patterns.


    Typical amplitudes in ion-cyclotron-range heating are 10^2-10^4 V m^-1 in the
    confined plasma and 10^3-10^5 V m^-1 near antennas, edge evanescence regions,
    or strong resonance layers. Values scale approximately with the square root of
    launched power for fixed plasma conditions and depend strongly on the toroidal
    mode spectrum and polarization.'
  unit: V.m^-1
  physics_domain: auxiliary_heating
  links:
  - name:right_hand_circularly_polarized_wave_electric_field_amplitude
  - name:per_toroidal_mode_right_hand_circularly_polarized_electric_field
  - name:left_hand_circularly_polarized_wave_electric_field_amplitude
  sources:
