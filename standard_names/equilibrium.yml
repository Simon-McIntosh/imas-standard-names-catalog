- name: major_radius_of_measurement_position
  kind: scalar
  status: draft
  description: Major-radius coordinate of a diagnostic measurement position in the
    right-handed cylindrical (R, phi, Z) frame, equal to the perpendicular distance
    from the toroidal symmetry axis to the measurement point.
  documentation: 'The major radius $R$ of a measurement position is the perpendicular
    distance from the toroidal symmetry axis to the measurement point in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is the horizontal distance from the
    machine axis, $\phi$ is the toroidal angle increasing counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is the vertical height. This coordinate locates
    a diagnostic element radially within the poloidal cross-section: examples include
    an endpoint of a spectroscopic or interferometric line-of-sight chord, a waypoint
    along a pellet ablation trajectory, or the exit location of a gas or material
    injector.


    The value is determined from engineering surveys, 3-D CAD models of the device,
    or from path reconstruction algorithms that combine detector geometry with the
    machine coordinate system. It provides the radial component required to fully
    specify a measurement point in the $(R, \phi, Z)$ frame as input to chord-integration
    codes, line-of-sight models, and ablation simulations.


    For related major-radius coordinates at structurally defined points, see [major_radius_of_geometric_axis](name:major_radius_of_geometric_axis)
    for the plasma geometric axis, [major_radius_of_strike_point](name:major_radius_of_strike_point)
    for the divertor strike point, and [major_radius_of_x_point](name:major_radius_of_x_point)
    for the magnetic separatrix null point.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_geometric_axis
  - name:major_radius_of_strike_point
  - name:major_radius_of_x_point
