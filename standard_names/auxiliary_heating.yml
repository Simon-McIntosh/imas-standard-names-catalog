- name: per_toroidal_mode_fast_ion_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged wave power density absorbed by the fast ion population,
    resolved per toroidal Fourier mode.
  documentation: 'The power density deposited by radio-frequency waves (e.g., ICRF)
    into the fast ion population is decomposed by toroidal mode number $n_\phi$, giving
    the spectral distribution of heating. Summing over all $n_\phi$ recovers the total
    absorbed fast-ion power density on a given flux surface: $p_{\mathrm{abs}}(\rho)
    = \sum_{n_\phi} p_{n_\phi}(\rho)$. Negative values correspond to wave damping
    and power transfer to the ions, while positive values indicate wave generation
    by the particles. Typical core values in ICRF-heated plasmas range from $0.1$
    to $10\,\mathrm{MW\,m^{-3}}$, with the dominant modes determined by the antenna
    spectrum and plasma composition. This quantity complements the cumulative absorbed
    power [$\texttt{per\_toroidal\_mode\_fast\_ion\_absorbed\_power}$](name:per_toroidal_mode_fast_ion_absorbed_power),
    and its electron counterpart [$\texttt{per\_toroidal\_mode\_fast\_electron\_power\_density}$](name:per_toroidal_mode_fast_electron_power_density).


    Sign convention: Positive when the wave deposits power into the fast ion population
    (i.e., absorption dominates over emission).'
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
