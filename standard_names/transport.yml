- name: parallel_fast_particle_energy
  kind: scalar
  status: draft
  description: Total parallel kinetic energy of fast (suprathermal) particles, integrated
    over the plasma volume.
  documentation: 'Parallel fast-particle energy is the part of the kinetic energy
    of the suprathermal particle population associated with motion along the local
    magnetic field. It is the field-aligned counterpart of perpendicular fast-particle
    energy and excludes the perpendicular gyromotion contribution.


    For a distribution-function definition, the parallel contribution is obtained
    from the field-aligned velocity moment of the fast-particle distribution:


    $$

    W_{\parallel,f} = \sum_s \int_V \int \frac{1}{2} m_s v_\parallel^2 f_{f,s}(\mathbf{x},\mathbf{v})\,
    d^3v\, dV

    $$


    where $s$ labels fast-particle species, $m_s$ is particle mass, $v_\parallel$
    is the velocity component along the local magnetic field, $f_{f,s}$ is the fast-particle
    distribution function, and $dV$ is a physical volume element in m^3. If the same
    moment is represented by a parallel pressure $p_{\parallel,f}$, then $p_{\parallel,f}$
    has units Pa = J m^-3 and the one-degree-of-freedom contribution is $W_{\parallel,f}=\frac{1}{2}\int_V
    p_{\parallel,f}\,dV$.


    In practice this quantity is computed from fast-particle distribution functions,
    kinetic transport calculations, or pressure-moment reconstructions constrained
    by heating, slowing-down, and loss physics. It is sensitive to pitch-angle anisotropy:
    particles born or accelerated mainly along the magnetic field increase the parallel
    share, while strongly trapped or perpendicular populations shift energy toward
    the perpendicular contribution.


    Representative values are highly device and scenario dependent, spanning roughly
    10^3-10^7 J in many auxiliary-heated tokamak plasmas and reaching 10^7-10^8 J
    in large high-power or burning-plasma scenarios. The fraction of total fast-particle
    energy in the parallel degree of freedom depends on source geometry, collisional
    pitch-angle scattering, and confinement losses.'
  unit: J
  physics_domain: transport
  links:
  - name:fast_particle_energy
  - name:perpendicular_fast_particle_energy
  arguments:
  - name: fast_particle_energy
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/global_quantities/energy_fast_parallel
    dd_path: distributions/distribution/global_quantities/energy_fast_parallel
    status: composed
  - id: dd:summary/global_quantities/energy_fast_parallel/value
    dd_path: summary/global_quantities/energy_fast_parallel/value
