name: parallel_component_of_neutral_velocity
status: draft
description: Projection of the neutral-particle fluid velocity onto the local magnetic-field
  direction, $v_{n\parallel} = \mathbf{v}_n \cdot \hat{b}$.
documentation: "The parallel neutral velocity $v_{n\\parallel} = \\mathbf{v}_n \\\
  cdot \\hat{b}$ (m s$^{-1}$), where $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$, describes\
  \ the bulk flow of neutral atoms or molecules along the magnetic field direction.\
  \ Although neutrals are not magnetized, resolving their velocity along $\\hat{b}$\
  \ is essential for computing momentum transfer via charge-exchange reactions, where\
  \ fast neutrals exchange momentum with ions along field lines. In the scrape-off\
  \ layer and divertor region, parallel neutral velocities of order $10^3$\u2013$10^4$\
  \ m s$^{-1}$ are typical, set by the local Franck\u2013Condon dissociation energy\
  \ ($\\sim$2\u20133 eV for D$_2$) and thermalization with the background plasma.\
  \ The quantity is tracked per neutral state (atomic, molecular, excited) in kinetic\
  \ neutral transport codes such as EIRENE and DEGAS-2, and can also be computed from\
  \ fluid neutral models. Positive $v_{n\\parallel}$ follows the direction of $\\\
  mathbf{B}$. See `ion_number_density` and `parallel_component_of_electron_velocity`\
  \ for related plasma flow quantities."
