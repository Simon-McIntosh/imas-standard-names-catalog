    dd_path: gyrokinetics_local/species/mass_norm
    status: composed
- name: normalized_perturbed_density_imaginary_part
  kind: complex
  status: draft
  description: "Imaginary component of the complex, dimensionless zeroth velocity-space\
    \ moment of the perturbed gyrocenter distribution function for a gyrokinetic eigenmode,\
    \ expressed in the mode\u2019s rotating frame. Together with the corresponding\
    \ real component, it gives the normalized density response phase relative to the\
    \ chosen eigenmode reference."
  documentation: 'This quantity is the imaginary part of the normalized perturbed
    density moment for a gyrokinetic eigenmode. It represents the quadrature component
    of the dimensionless zeroth velocity-space moment of the perturbed gyrocenter
    distribution function in the frame rotating with the eigenmode phase.


    The complex normalized density moment may be written as


    $$

    \delta n_{\mathrm{norm}}^{\mathrm{rot}} = \frac{1}{n_0}\int \delta f_g^{\mathrm{rot}}\,d^3v
    = \delta n_R^{\mathrm{rot}} + i\,\delta n_I^{\mathrm{rot}}

    $$


    where $\delta f_g^{\mathrm{rot}}$ is the perturbed gyrocenter distribution function
    in the rotating frame, $d^3v$ is the velocity-space volume element, $n_0$ is the
    reference equilibrium density used for normalization, $\delta n_R^{\mathrm{rot}}$
    is the real part, and $\delta n_I^{\mathrm{rot}}$ is this quantity. No gyroaveraging
    kernel is implied by this name; gyroaveraged density moments are distinct quantities.


    It is computed from the complex eigenfunction returned by a gyrokinetic linear
    calculation by integrating the perturbed distribution over velocity space and
    dividing by the chosen reference density. The absolute split between real and
    imaginary parts depends on the global eigenmode phase reference: multiplying the
    eigenfunction by $e^{i\alpha}$ rotates $\delta n_R^{\mathrm{rot}}$ and $\delta
    n_I^{\mathrm{rot}}$ into one another. Therefore the value should be interpreted
    relative to the same phase convention used for the other eigenmode fields, such
    as fixing a selected reference component to be real.


    There is no universal physical range because linear eigenfunctions may be scaled
    arbitrarily. With an eigenvector normalization such as unit maximum amplitude,
    reported dimensionless values commonly lie between -1 and 1, but larger or smaller
    values can occur under different normalizations or for species and regions with
    weak reference response.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_density
  - name:normalized_perturbed_electrostatic_potential_imaginary_part
  - name:normalized_perturbed_gyroaveraged_density_real_part
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_rotating_frame/density_imaginary
    dd_path: gyrokinetics/wavevector/eigenmode/fluxes_moments/moments_norm_rotating_frame/density_imaginary
    status: composed
- name: normalized_perturbed_electrostatic_potential_amplitude
  kind: scalar
  status: draft
  description: Modulus of the complex normalized perturbed electrostatic potential
    eigenfunction for a gyrokinetic mode.
  documentation: 'Normalized perturbed electrostatic potential amplitude is the modulus
    of the complex normalized electrostatic-potential perturbation eigenfunction for
    a gyrokinetic mode. It represents the phase-independent strength of the electrostatic
    potential component of the mode while discarding the arbitrary complex phase of
    the eigenfunction.


    For a complex normalized potential eigenfunction $\delta\hat{\phi}$, the amplitude
    is obtained from its real and imaginary parts as


    $$

    |\delta\hat{\phi}| = \sqrt{\left(\operatorname{Re}\delta\hat{\phi}\right)^2 +
    \left(\operatorname{Im}\delta\hat{\phi}\right)^2}

    $$


    where $\operatorname{Re}\delta\hat{\phi}$ and $\operatorname{Im}\delta\hat{\phi}$
    are the [real](name:normalized_perturbed_electrostatic_potential_real_part) and
    [imaginary](name:normalized_perturbed_electrostatic_potential_imaginary_part)
    parts of the same normalized eigenfunction. In a temperature-normalized gyrokinetic
    convention, $\delta\hat{\phi}=e\,\delta\phi/T_\mathrm{ref}$, where $\delta\phi$
    is the dimensional electrostatic-potential perturbation, $e$ is the elementary
    charge, and $T_\mathrm{ref}$ is the [reference temperature] expressed as an energy.


    The amplitude is computed from the complex electrostatic potential eigenfunction
    returned by a linear gyrokinetic or eigenmode calculation. Because a linear eigenfunction
    has arbitrary overall scale and phase, this quantity is most meaningful for relative
    mode structure or for comparisons made using the same normalization.


    Typical values are normalization dependent. With peak normalization the amplitude
    ranges from 0 to 1 and equals 1 at the chosen normalization location; other dimensionless
    normalizations commonly give values of order 1 but should be compared only within
    the same normalization convention.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_perturbed_electrostatic_potential_real_part
  - name:normalized_perturbed_electrostatic_potential_imaginary_part
  sources:
  - id: dd:gyrokinetics/wavevector/eigenmode/phi_potential_perturbed_weight
    dd_path: gyrokinetics/wavevector/eigenmode/phi_potential_perturbed_weight
    status: attached
  - id: dd:gyrokinetics_local/linear/wavevector/eigenmode/fields/phi_potential_perturbed_weight
    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/fields/phi_potential_perturbed_weight
    status: composed
- name: normalized_perturbed_electrostatic_potential_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the normalized perturbed electrostatic-potential
    eigenmode for a gyrokinetic mode with specified toroidal mode number in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The imaginary part of the normalized perturbed electrostatic potential
    is the quadrature component of a complex electrostatic-potential eigenfunction
    after division by a positive reference potential. It is dimensionless and, together
    with the [real part](name:normalized_perturbed_electrostatic_potential_real_part),
    determines the phase and amplitude of the normalized gyrokinetic mode envelope
    along a magnetic field line for a specified toroidal mode number $n$.


    The complex normalized eigenfunction for a single toroidal mode is represented
    using the toroidal phase factor $e^{i n\phi}$:


    $$

    \frac{\delta\widetilde{\varphi}_n(s,\phi)}{\varphi_\mathrm{ref}} = \left[A_R(s)
    + i A_I(s)\right] e^{i n\phi}

    $$


    where $A_I(s)$ is this quantity, $A_R(s)$ is the real-part counterpart, $\delta\widetilde{\varphi}_n$
    is the complex electrostatic-potential perturbation for toroidal mode number $n$,
    $\varphi_\mathrm{ref}$ is the reference electric potential used for normalization,
    both potentials have units of volts, $A_R$ and $A_I$ are dimensionless, $i$ is
    the imaginary unit, $s$ labels position along the selected magnetic field line,
    and $\phi$ is the toroidal angle in radians in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    In practice this quantity is obtained from the complex electrostatic-potential
    eigenfunction produced by a gyrokinetic eigenmode calculation, or by extracting
    the selected toroidal Fourier component from a fluctuating electrostatic potential
    and applying the same normalization. Multiplying by $\varphi_\mathrm{ref}$ gives
    the corresponding unnormalized imaginary component, [perturbed_electrostatic_potential_imaginary_part](name:perturbed_electrostatic_potential_imaginary_part).


    Because the overall amplitude and global complex phase of a linear eigenfunction
    can be chosen by normalization, there is no universal physical range. With a convention
    that scales the maximum complex normalized potential to order unity, $A_I$ is
    commonly of order 1 and may be positive, negative, or zero.


    Sign convention: Positive when the normalized eigenfunction has a positive coefficient
    of $+i$ in the complex amplitude multiplying $e^{i n\phi}$, with $\phi$ increasing
    in the $+\hat{\phi}$ direction of the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: '1'
  physics_domain: turbulence
