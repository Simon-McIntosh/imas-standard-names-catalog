- name: toroidal_current_due_to_wave_driven_current_drive
  kind: scalar
  status: active
  description: Toroidal current due to wave-driven current drive is the cumulative
    toroidal plasma current enclosed by a magnetic flux surface and attributable to
    wave-particle interactions. It is the total wave-driven contribution, not a single
    toroidal Fourier harmonic.
  documentation: 'Toroidal current due to wave-driven current drive is the cumulative
    toroidal plasma current enclosed by a magnetic flux surface and attributable to
    wave-particle interactions. It represents the wave-particle-interaction contribution
    to the enclosed toroidal current, excluding inductive, bootstrap, neutral-beam-driven,
    and other non-wave current sources.


    For a magnetic flux surface labeled by the [poloidal magnetic flux](name:poloidal_magnetic_flux)
    $\psi$, the enclosed current is defined by the poloidal-area integral of the toroidal
    component of the wave-driven current density:


    $$

    I_{\phi,\mathrm{wcd}}(\psi) = \int_{A(\psi)} j_{\mathrm{wcd},\phi}(R,Z)\, dA

    $$


    where $I_{\phi,\mathrm{wcd}}$ is the toroidal current due to wave-driven current
    drive, $A(\psi)$ is the poloidal cross-sectional area inside the $\psi=\mathrm{constant}$
    contour at fixed toroidal angle, $j_{\mathrm{wcd},\phi}$ is the toroidal component
    of the [wave-driven current density](name:current_density_due_to_wave_driven_current_drive),
    $dA$ is the physical area element on that poloidal cross-section, and $(R, \phi,
    Z)$ is the right-handed cylindrical frame with $R$ major radius, $\phi$ toroidal
    angle increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    vertical height.


    This is an enclosed-current quantity: $I_{\phi,\mathrm{wcd}}(\psi)$ depends on
    the selected flux surface, and at the outer closed flux surface it equals the
    net [current due to wave-driven current drive](name:current_due_to_wave_driven_current_drive).
    When a toroidal Fourier decomposition of the wave field is used, this quantity
    is the sum over harmonics; [per-toroidal-mode current due to wave-driven current
    drive](name:per_toroidal_mode_current_due_to_wave_driven_current_drive) is the
    corresponding single-harmonic contribution.


    Sign convention: Positive when the wave-driven toroidal plasma current flows in
    the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: auxiliary_heating
