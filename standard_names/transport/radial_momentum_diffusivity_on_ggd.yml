name: radial_momentum_diffusivity_on_ggd
status: draft
description: Effective radial diffusion coefficient for total plasma momentum, discretized
  on a general grid description (GGD) mesh.
documentation: The radial momentum diffusivity $\mu_{\perp}$ (in $\mathrm{m^2\,s^{-1}}$)
  parameterizes cross-field viscous momentum transport via the diffusive closure $\Pi_{\perp}
  = -\rho \mu_{\perp} \nabla v_{\parallel}$, where $\rho = \sum_s n_s m_s$ is the
  mass density and $v_{\parallel}$ the parallel flow velocity. This is an aggregate
  coefficient representing the total plasma (all ion species combined) momentum diffusion,
  discretized on a GGD mesh with one value per grid element. It is used in edge transport
  codes (SOLPS-ITER, EDGE2D, SOLEDGE2D) to model toroidal and parallel momentum redistribution
  across the SOL, divertor, and private-flux region. Typical values range from $\sim
  0.01\,\mathrm{m^2\,s^{-1}}$ in the pedestal to $\sim 1\,\mathrm{m^2\,s^{-1}}$ in
  the far SOL. See `ion_momentum_radial_diffusivity` for the species-resolved 1-D
  counterpart and `neutral_momentum_radial_diffusivity_on_ggd` for the neutral channel.
