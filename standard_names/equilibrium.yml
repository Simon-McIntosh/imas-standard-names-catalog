- name: external_loop_voltage
  kind: scalar
  status: active
  description: Electromotive-force contribution to the plasma loop voltage caused
    by changing externally generated poloidal magnetic flux, including flux linked
    through active coils and passive conducting structures.
  documentation: 'This quantity is the inductive electromotive-force contribution
    to the plasma loop voltage produced by time-varying poloidal magnetic flux generated
    by active coil circuits and magnetically coupled passive conducting structures.
    It excludes resistive voltage drops and other non-inductive contributions.


    The contribution is defined by Faraday''s law:


    $$

    V_{\mathrm{ext}}(t) = -\frac{d\Phi_{\mathrm{ext}}(t)}{dt}

    $$


    where $\Phi_{\mathrm{ext}}$ is the externally generated poloidal magnetic flux
    linked by the considered toroidal plasma circuit and $t$ is time. It contributes
    to the total [loop voltage at the plasma boundary](name:loop_voltage_at_plasma_boundary);
    currents in passive conductors are represented by the linked-flux response of
    structures such as those described by [current of passive structure](name:current_of_passive_structure).


    Sign convention: Positive when the induced electromotive force has a positive
    line integral in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: V
  physics_domain: equilibrium
  links:
  - name:loop_voltage_at_plasma_boundary
