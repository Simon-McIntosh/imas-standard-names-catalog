name: heating_power_due_to_neutral_beam_injection
status: draft
description: Total thermal power deposited into the plasma by neutral beam injection,
  accounting for shine-through and orbit losses.
documentation: "The NBI heating power $P_{\\mathrm{NBI}}$ (in W) is the net thermal\
  \ power transferred to the plasma from injected fast neutral atoms after ionization\
  \ and thermalization. It is related to the launched power by $P_{\\mathrm{NBI}}\
  \ = P_{\\mathrm{launched}} - P_{\\mathrm{shine}} - P_{\\mathrm{orbit}} - P_{\\mathrm{CX}}$,\
  \ where $P_{\\mathrm{shine}}$ is the shine-through loss, $P_{\\mathrm{orbit}}$ represents\
  \ prompt orbit losses, and $P_{\\mathrm{CX}}$ accounts for charge-exchange losses\
  \ of fast ions before thermalization. Typical values range from 1\u201320 MW in\
  \ present-day tokamaks (DIII-D, JET, ASDEX Upgrade) and up to 33 MW planned for\
  \ ITER. The deposited power is computed by Monte Carlo beam-deposition codes (e.g.,\
  \ NUBEAM, TRANSP) using measured plasma density and temperature profiles. $P_{\\\
  mathrm{NBI}}$ is a key input to the energy balance $dW/dt = P_{\\mathrm{NBI}} +\
  \ P_{\\mathrm{OH}} + P_{\\alpha} - P_{\\mathrm{loss}}$ and directly affects confinement\
  \ scaling."
