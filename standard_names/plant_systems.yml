- name: krypton_count
  kind: scalar
  status: active
  description: Count of krypton atoms expressed as an equivalent-electron inventory,
    where each krypton atom contributes 36 equivalent electrons equal to its atomic
    number.
  documentation: 'The krypton count quantifies the inventory of krypton atoms in the
    plasma system as a dimensionless equivalent-electron count. The conversion uses
    the atomic number of krypton, $Z_\mathrm{Kr} = 36$, so that each krypton atom
    contributes 36 equivalent electrons:


    $$

    N_\mathrm{eq} = Z_\mathrm{Kr} \cdot N_\mathrm{Kr}

    $$


    where $N_\mathrm{Kr}$ is the number of krypton atoms and $N_\mathrm{eq}$ is the
    dimensionless equivalent-electron count.


    The time-integrated form accumulated since plasma breakdown is given by [accumulated_krypton_count](name:accumulated_krypton_count).
    The same equivalent-electron convention applies to other impurity species, such
    as [argon_count](name:argon_count) and [neon_count](name:neon_count), each scaled
    by their respective atomic numbers.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:accumulated_krypton_count
  - name:argon_count
  - name:neon_count
- name: accumulated_krypton_count
  kind: scalar
  status: active
  description: Cumulative number of krypton atoms injected into the machine since
    plasma breakdown, expressed in equivalent electrons.
  documentation: 'The accumulated krypton count is the running total of krypton atoms
    introduced since plasma breakdown, converted to an electron-equivalent basis where
    each krypton atom contributes $Z_{\rm Kr} = 36$ electron equivalents when fully
    stripped of its bound electrons.


    The quantity is obtained by integrating the instantaneous injection rate $\dot{N}_{\rm
    Kr}$ over time from the moment of plasma breakdown $t_0$:


    $$

    N_{\rm Kr,eq} = Z_{\rm Kr} \int_{t_0}^{t} \dot{N}_{\rm Kr}(t'') \, dt''

    $$


    where $Z_{\rm Kr} = 36$ is the atomic number of krypton and $\dot{N}_{\rm Kr}$
    is in atoms per second. This is distinct from the prefill-phase contribution captured
    by [krypton_prefill_count](name:krypton_prefill_count), which records only the
    gas load introduced before breakdown. Krypton serves as a heavy radiative seed
    impurity for power exhaust management and as a disruption mitigation agent; the
    cumulative injection inventory is therefore essential for interpreting bolometric
    radiated-power fractions and spectroscopic charge-state distributions throughout
    the discharge. Analogous running totals are defined for other injected species,
    including [accumulated_neon_count](name:accumulated_neon_count) and [accumulated_helium_4_count_due_to_gas_injection](name:accumulated_helium_4_count_due_to_gas_injection).


    Sign convention: Positive when krypton has been cumulatively injected into the
    plasma since breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:krypton_prefill_count
  - name:accumulated_neon_count
  - name:accumulated_helium_4_count_due_to_gas_injection
  arguments:
  - name: krypton_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/krypton/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-krypton-value
    dd_documentation:
