name: shattered_pellet_injector_propellant_gas_flow_rate
status: draft
cocos_transformation_type: one_like
description: Particle flow rate of the propellant gas at the exit of a shattered pellet
  injector, characterizing the gas that accelerates the pellet.
documentation: "The propellant gas flow rate $\\dot{N}_{\\mathrm{prop}}$ (in s$^{-1}$)\
  \ quantifies the number of propellant gas particles per second leaving the injector\
  \ barrel in a shattered pellet injection (SPI) system. The propellant gas (typically\
  \ high-pressure helium at 10\u2013150 bar) accelerates the cryogenic pellet through\
  \ the guide tube to velocities of 100\u2013600 m/s before the pellet reaches the\
  \ shatter point. This flow rate, together with the reservoir pressure and gas temperature,\
  \ determines the pellet velocity via the light-gas gun relation $v_{\\mathrm{pellet}}\
  \ \\propto \\sqrt{k_B T_{\\mathrm{prop}} / m_{\\mathrm{prop}}}$, where $T_{\\mathrm{prop}}$\
  \ and $m_{\\mathrm{prop}}$ are the propellant gas temperature and molecular mass\
  \ respectively. Typical values range from $10^{21}$ to $10^{23}$ s$^{-1}$. The quantity\
  \ is measured by fast pressure transducers or calibrated flow meters at the barrel\
  \ exit. See also `shattered_pellet_injector_fragmentation_gas_flow_rate` for the\
  \ fragmentation-side counterpart."
