- name: normalized_parallel_component_of_wave_energy_flux
  kind: scalar
  status: draft
  description: Normalized parallel component of the wave energy flux vector along
    the electron cyclotron emission beam tracing path, equal to the cosine of the
    angle between the Poynting vector S and the local magnetic field unit vector b-hat.
    This dimensionless quantity ranges from -1 to +1 and characterizes the directional
    alignment of wave energy propagation relative to the ambient magnetic field.
  documentation: "This quantity is defined as\n\n$$S_{\\parallel,\\mathrm{norm}} =\
    \ \\frac{\\mathbf{S} \\cdot \\hat{\\mathbf{b}}}{|\\mathbf{S}|}$$\n\nwhere $\\\
    mathbf{S}$ is the wave energy flux (Poynting) vector (W m$^{-2}$), $\\hat{\\mathbf{b}}\
    \ = \\mathbf{B}/|\\mathbf{B}|$ is the unit vector along the local magnetic field\
    \ $\\mathbf{B}$, and $|\\mathbf{S}|$ is the magnitude of the energy flux. The\
    \ result is dimensionless (unit: 1) and is the direction cosine of the angle $\\\
    theta$ between $\\mathbf{S}$ and $\\hat{\\mathbf{b}}$, i.e., $S_{\\parallel,\\\
    mathrm{norm}} = \\cos\\theta$. It is NOT an energy fraction; the squared quantity\
    \ $\\cos^2\\theta = (\\mathbf{S}\\cdot\\hat{\\mathbf{b}})^2/|\\mathbf{S}|^2$ would\
    \ represent the fractional energy in the parallel direction.\n\nTypical values\
    \ along an ECE beam path lie in $[-1, +1]$. A value of $+1$ indicates that the\
    \ wave energy propagates entirely in the direction of the local magnetic field,\
    \ $-1$ indicates propagation anti-parallel to the field, and $0$ indicates purely\
    \ perpendicular propagation with respect to $\\mathbf{B}$. For typical oblique\
    \ ECE beam geometries, values cluster near $\\pm 0.1$\u2013$0.5$ depending on\
    \ the launch angle and local field curvature.\n\nThis quantity is evaluated at\
    \ each point along the ray or beam tracing path through the plasma. The magnetic\
    \ field direction is defined in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is the major radius from the machine symmetry axis, $\\phi$ is the\
    \ toroidal angle increasing counter-clockwise viewed from above $+\\hat{Z}$, and\
    \ $Z$ is the vertical height.\n\nSign convention: Positive when $\\mathbf{S}$\
    \ has a component in the same direction as $\\hat{\\mathbf{b}}$, i.e., when wave\
    \ energy propagates in the direction of increasing magnetic field line orientation.\n\
    \nThis quantity characterizes the degree of field-alignment of the wave beam and\
    \ is relevant for distinguishing ordinary (O-mode) and extraordinary (X-mode)\
    \ propagation regimes, for ray-tracing convergence checks, and for computing absorbed\
    \ power densities from wave kinetic equations. It complements the perpendicular\
    \ normalized component and the parallel refractive index $N_\\parallel = c k_\\\
    parallel / \\omega$ (which characterizes phase velocity alignment rather than\
    \ energy flux alignment)."
  unit: '1'
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:parallel_component_of_wave_energy_flow_normalized
  - name:thermal_electron_wave_absorbed_power_density
  - name:ion_wave_absorbed_power_along_beam
  - name:arc_length_along_electron_cyclotron_wave_beam
  constraints: []
  sources:
  - id: dd:ece/channel/beam_tracing/beam/power_flow_norm/parallel
    dd_path: ece/channel/beam_tracing/beam/power_flow_norm/parallel
    status: composed
- name: probing_beam_wavelength_of_interferometer_channel
  kind: scalar
  status: draft
  description: Wavelength of the electromagnetic probing beam used in an interferometer
    channel for line-integrated electron density measurement.
  documentation: "The probing beam wavelength $\\lambda$ sets the sensitivity and\
    \ refractive-index response of a microwave or laser interferometer. The measured\
    \ phase shift accumulated along the chord is $\\Delta\\phi = (2\\pi/\\lambda)\
    \ \\int (n - 1)\\, dl$, where $n$ is the plasma refractive index and $l$ is the\
    \ path length along the line of sight; for an unmagnetized cold plasma this reduces\
    \ to $\\Delta\\phi \\approx -(r_e \\lambda) \\int n_e\\, dl$, with $r_e$ the classical\
    \ electron radius and $n_e$ the electron density. Common choices span from infrared\
    \ CO$_2$ laser lines near $10.6\\,\\mu$m to far-infrared HCN laser lines near\
    \ $337\\,\\mu$m and millimeter-wave sources in the range $1$\u2013$4\\,\\text{mm}$;\
    \ shorter wavelengths tolerate higher densities before cutoff while longer wavelengths\
    \ yield higher phase sensitivity per unit $\\int n_e\\, dl$. The value is fixed\
    \ by the source hardware for a given channel and enters directly into the density\
    \ inversion. The sibling name [wavelength](name:wavelength) captures the same\
    \ physical concept in the broader interferometer diagnostic context."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:wavelength
  constraints: []
  sources:
  - id: dd:interferometer/channel/wavelength/value
    dd_path: interferometer/channel/wavelength/value
    status: composed
- name: radial_width_of_reflectometer_fluctuation_window
  kind: scalar
  status: draft
  description: Radial extent of the spatial averaging window over which reflectometer
    fluctuation profiles are processed, defining the effective radial resolution of
    the measurement channel.
  documentation: "The quantity $\\Delta r$ is the non-negative radial width (in meters)\
    \ of the effective spatial window over which a reflectometer fluctuation channel\
    \ integrates or averages turbulent density fluctuation information. It represents\
    \ the combined convolution width arising from both the intrinsic beam localization\
    \ at the reflection layer and any explicit analysis window applied during signal\
    \ processing.\n\nPhysically, $\\Delta r$ encompasses contributions from:\n\n1.\
    \ **Intrinsic localization** \u2014 the finite spatial extent over which the probing\
    \ wave interacts with density fluctuations near the cutoff or turning-point layer.\
    \ This depends on the probing frequency, polarization mode, and local density\
    \ gradient.\n2. **Analysis windowing** \u2014 any gate function, weighted averaging\
    \ kernel, or spatial filter applied during data reduction to extract the fluctuation\
    \ amplitude or spectrum over a radial interval.\n\nThe reported value is the effective\
    \ combined width as determined by the diagnostic operator. The specific statistical\
    \ definition (e.g., FWHM, $1/e$ half-width, or equivalent rectangular bandwidth)\
    \ is diagnostic-dependent and should be documented alongside the measurement;\
    \ this standard name records the numerical value of whatever convention is applied.\n\
    \nTypical values in tokamak plasmas lie in the range $0.003\\,\\mathrm{m} \\lesssim\
    \ \\Delta r \\lesssim 0.05\\,\\mathrm{m}$. Smaller values (a few millimeters)\
    \ correspond to high-frequency probing with steep density gradients at the reflection\
    \ layer, while larger values (several centimeters) arise from low-frequency probing,\
    \ shallow density gradients, or broad beam-waist configurations.\n\nThis quantity\
    \ characterizes the spatial resolution of the fluctuation measurement; the complementary\
    \ temporal resolution is described by [reflectometer_fluctuation_spectrum_averaging_duration](name:reflectometer_fluctuation_spectrum_averaging_duration).\
    \ For channels operating specifically in Doppler backscattering geometry, the\
    \ closely related quantity [doppler_reflectometer_fluctuation_window_radial_extent](name:doppler_reflectometer_fluctuation_window_radial_extent)\
    \ applies; likewise, [radial_width_of_fluctuation_measurement_window](name:radial_width_of_fluctuation_measurement_window)\
    \ describes the equivalent window width in the Doppler reflectometer context.\n\
    \nConstraint: $\\Delta r \\geq 0$."
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:reflectometer_fluctuation_spectrum_averaging_duration
  - name:doppler_reflectometer_fluctuation_window_radial_extent
  constraints: []
  sources:
  - id: dd:reflectometer_fluctuation/channel/doppler/radial_width
    dd_path: reflectometer_fluctuation/channel/doppler/radial_width
    status: composed
  - id: dd:reflectometer_fluctuation/channel/fluctuations_level/radial_width
    dd_path: reflectometer_fluctuation/channel/fluctuations_level/radial_width
    status: composed
- name: reflectometer_fluctuation_spectrum_averaging_duration
  kind: scalar
  status: draft
  description: Duration of the time window over which the reflectometer fluctuation
    power spectrum is computed per channel, setting the trade-off between temporal
    resolution and spectral statistical quality.
  documentation: The reflectometer fluctuation spectrum averaging duration $\Delta
    t$ defines the width of the time interval over which raw IQ-detector signals are
    processed to produce a fluctuation power spectrum for a given reflectometer channel.
    By convention, the interval spans $[t - \Delta t,\, t]$, where $t$ is the timestamp
    of the resulting spectrum. Longer $\Delta t$ improves spectral statistics and
    reduces noise on the estimated power spectral density, but degrades the ability
    to track transient events; typical values range from tens of microseconds to a
    few milliseconds depending on the turbulence frequency range of interest and the
    plasma regime. This parameter is closely related to [reflectometer frequency sweep
    duration](name:reflectometer_frequency_sweep_duration), which governs the time
    resolution of the companion density-profile channel, and to [radial width of reflectometer
    fluctuation window](name:radial_width_of_reflectometer_fluctuation_window), which
    sets the corresponding spatial resolution. For neutron spectroscopy, the analogous
    parameter is the [neutron spectrum integration duration](name:neutron_spectrum_integration_duration).
  unit: s
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:reflectometer_frequency_sweep_duration
  - name:radial_width_of_reflectometer_fluctuation_window
  - name:neutron_spectrum_integration_duration
  constraints: []
  sources:
  - id: dd:reflectometer_fluctuation/channel/doppler/time_width
    dd_path: reflectometer_fluctuation/channel/doppler/time_width
    status: composed
  - id: dd:reflectometer_fluctuation/channel/fluctuations_level/time_width
    dd_path: reflectometer_fluctuation/channel/fluctuations_level/time_width
    status: composed
  - id: dd:reflectometer_fluctuation/channel/fluctuations_spectrum/time_width
    dd_path: reflectometer_fluctuation/channel/fluctuations_spectrum/time_width
    status: composed
  - id: dd:summary/time_width
    dd_path: summary/time_width
    status: composed
- name: reflectometer_frequency_sweep_duration
  kind: scalar
  status: draft
  description: Duration of a single frequency sweep in a reflectometer or refractometer
    diagnostic channel, defined as the elapsed time from the start frequency to the
    end frequency of one complete sweep across the probing band. This positive-definite
    interval sets the temporal resolution of each reconstructed radial electron density
    profile.
  documentation: "The reflectometer frequency sweep duration $\\tau_{\\rm sweep}$\
    \ is formally defined as\n$$\\tau_{\\rm sweep} = t_{f_{\\rm max}} - t_{f_{\\rm\
    \ min}} \\geq 0,$$\nwhere $t_{f_{\\rm min}}$ and $t_{f_{\\rm max}}$ are the times\
    \ at which the probing frequency reaches the lower and upper bounds of the sweep\
    \ band, respectively. Being a time interval, $\\tau_{\\rm sweep}$ is strictly\
    \ non-negative; the direction (ascending or descending in frequency) is a separate\
    \ operational parameter and does not affect the sign of this quantity.\n\nThis\
    \ duration governs the trade-off between temporal resolution and measurement quality.\
    \ Shorter sweeps improve the time resolution with which the radial electron density\
    \ profile $n_e(r)$ can be tracked, but reduce the number of averaged samples per\
    \ frequency step, lowering the signal-to-noise ratio. Longer sweeps allow more\
    \ signal averaging per step, improving profile quality, but smear plasma dynamics\
    \ occurring on time scales comparable to $\\tau_{\\rm sweep}$. Typical values\
    \ span roughly $10\\,\\mu\\mathrm{s}$ to $5\\,\\mathrm{ms}$: fast-sweep systems\
    \ designed to follow turbulent or MHD-driven density fluctuations operate in the\
    \ range $10$\u2013$100\\,\\mu\\mathrm{s}$, while conventional profile-reflectometer\
    \ channels typically use $0.5$\u2013$5\\,\\mathrm{ms}$.\n\nThe sweep duration\
    \ also interacts with spatial resolution: a very short $\\tau_{\\rm sweep}$ may\
    \ require a broader instantaneous bandwidth that limits the localization of the\
    \ reflection layer, connecting this quantity to the radial width of the measurement\
    \ window characterized by [radial_width_of_reflectometer_fluctuation_window](name:radial_width_of_reflectometer_fluctuation_window).\
    \ For fluctuation-mode operation, $\\tau_{\\rm sweep}$ should be compared against\
    \ the spectral averaging time discussed in [reflectometer_fluctuation_spectrum_averaging_duration](name:reflectometer_fluctuation_spectrum_averaging_duration).\
    \ The instrument-agnostic counterpart covering both reflectometer and refractometer\
    \ channels in a unified way is defined in [frequency_sweep_duration](name:frequency_sweep_duration)."
  unit: s
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:frequency_sweep_duration
  - name:reflectometer_fluctuation_spectrum_averaging_duration
  constraints: []
