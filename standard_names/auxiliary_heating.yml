      parent: Angle of inclination between a beamlet at the centre of the injection
        unit surface and the horiontal plane
      data_type: FLT_0D
      unit: rad
    enhanced_context:
      description: Angle of inclination of a beamlet at the centre of the NBI injection
        unit surface relative to the horizontal plane. Characterises the vertical
        pointing geometry of the neutral beam injection unit.
      kind: template
- name: vertical_centroid_of_coil_conductor_element
  kind: scalar
  status: active
  description: "Vertical Z-coordinate of the geometric centroid of a rectangular coil\
    \ conductor element cross-section, measured in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: "The vertical centroid coordinate locates the geometric center of\
    \ a rectangular coil conductor element cross-section along the $Z$-axis of the\
    \ right-handed cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major-radius\
    \ distance from the machine symmetry axis, $\\phi$ is the toroidal angle increasing\
    \ counter-clockwise when viewed from above, and $Z$ is the vertical height.\n\n\
    For a rectangular cross-section with lower edge at $Z_\\text{min}$ and upper edge\
    \ at $Z_\\text{max}$, the centroid is:\n\n$$\nZ_c = \\frac{Z_\\text{min} + Z_\\\
    text{max}}{2}\n$$\n\nwhere $Z_c$ is in meters and coincides with the midpoint\
    \ between the two horizontal bounding edges of the rectangle.\n\nThis geometric\
    \ parameter is specified in engineering design documentation for coil, antenna,\
    \ and passive-structure assemblies, and may be confirmed by physical survey measurements\
    \ before or during machine operation. Paired with the corresponding major-radius\
    \ centroid, it fully characterizes the planar position of each sub-element within\
    \ the poloidal cross-section, providing the input required for Biot\u2013Savart\
    \ magnetic field calculations from individual current-carrying segments. The analogous\
    \ coordinate for the parent coil conductor is captured by [vertical_coordinate_of_coil_conductor](name:vertical_coordinate_of_coil_conductor),\
    \ the generic conductor cross-section center by [vertical_coordinate_of_conductor_cross_section](name:vertical_coordinate_of_conductor_cross_section),\
    \ and the ion cyclotron antenna strap center by [vertical_coordinate_of_antenna_strap](name:vertical_coordinate_of_antenna_strap).\n\
    \nSign convention: Positive when the centroid lies above the machine midplane\
    \ in the direction of increasing $Z$."
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:vertical_coordinate_of_coil_conductor
  - name:vertical_coordinate_of_antenna_strap
  sources:
  - dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/z
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-geometry-rectangle-z
    dd_documentation:
