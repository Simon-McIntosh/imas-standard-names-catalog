name: coolant_outlet_temperature_of_breeding_blanket_module
status: draft
description: Temperature of the coolant fluid at the outlet manifold of a breeding
  blanket module.
documentation: "The coolant outlet temperature $T_{\\mathrm{out}}$ (in K) is the bulk\
  \ fluid temperature at the exit point of the cooling circuit of a breeding blanket\
  \ module. The difference $\\Delta T = T_{\\mathrm{out}} - T_{\\mathrm{in}}$ between\
  \ outlet and inlet temperatures, combined with the coolant mass flow rate $\\dot{m}$\
  \ and specific heat $c_p$, yields the extracted thermal power $P = \\dot{m}\\,c_p\\\
  ,\\Delta T$. For helium-cooled ceramic breeder designs $T_{\\mathrm{out}} \\approx\
  \ 773$\u2013$823\\;\\mathrm{K}$ (500\u2013550 \xB0C); for water-cooled lithium-lead\
  \ concepts $T_{\\mathrm{out}} \\approx 598\\;\\mathrm{K}$ (325 \xB0C). $T_{\\mathrm{out}}$\
  \ is measured by RTDs or thermocouples in the outlet piping and is a key indicator\
  \ of blanket thermal performance and safety margins. See also `coolant_inlet_temperature_of_breeding_blanket_module`\
  \ and `nuclear_heating_power_of_breeding_blanket`."
