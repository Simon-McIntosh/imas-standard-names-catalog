- name: radial_coordinate_of_coil_conductor_element
  kind: scalar
  status: active
  description: "Major-radius R coordinate of the start point of each coil-conductor\
    \ element, measured perpendicular to the toroidal symmetry axis in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the major-radius coordinate of the start point
    of a selected geometric element in a coil conductor. It locates that point by
    its perpendicular distance from the toroidal symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The defining geometric relation is:


    $$

    R_{\mathrm{start}} = \operatorname{dist}(\mathbf{x}_{\mathrm{start}}, \mathcal{A})

    $$


    where $R_{\mathrm{start}}$ is the radial coordinate of the element start point,
    $\mathbf{x}_{\mathrm{start}}$ is its spatial position, $\mathcal{A}$ is the toroidal
    symmetry axis, and $\operatorname{dist}$ denotes the shortest Euclidean distance
    to that axis.


    The scope is one start point for each geometric element forming a coil-conductor
    centerline, including a line segment or circular arc. The quantity is not the
    radial coordinate of an element center, the full conductor, or the coil, and it
    is neither summed nor averaged over elements.


    This is a locus-specific specialization of the general [radial coordinate](name:radial_coordinate):
    it retains the same major-radius definition while fixing the evaluated point to
    the start point of a coil-conductor element.'
  unit: m
  physics_domain: magnetic_field_systems
  links: []
  sources:
  - dd_path: coils_non_axisymmetric/coil/conductor/elements/start_points/r
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-conductor-elements-start_points-r
    dd_documentation:
