- name: width_of_iron_core_segment
  kind: scalar
  status: active
  description: "Full non-negative radial extent of an iron core segment\u2019s rectangular\
    \ cross-section, measured along major radius in the right-handed cylindrical (R,\
    \ \u03C6, Z) frame."
  documentation: 'The iron core segment width is the complete radial span between
    the inner and outer faces of its rectangular cross-section. It is a geometric
    extent, not the radial position of the segment or the curvature radius of an arc
    boundary.


    The width is defined by


    $$

    w_{\rm iron} = R_{\rm outer} - R_{\rm inner}

    $$


    where $R_{\rm outer}$ and $R_{\rm inner}$ are the major-radius coordinates in
    meters of the outer and inner radial faces, respectively, and $w_{\rm iron}$ is
    the resulting full extent. The width complements the [height of the iron core
    segment](name:height_of_iron_core_segment), while the [outer radius of the iron
    core segment](name:outer_radius_of_iron_core_segment) identifies a boundary position
    rather than a cross-sectional span.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:height_of_iron_core_segment
  - name:outer_radius_of_iron_core_segment
  sources:
  - dd_path: iron_core/segment/geometry/rectangle/width
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/iron_core.html#iron_core-segment-geometry-rectangle-width
    dd_documentation:
      leaf: Horizontal full width
      parent_path: iron_core/segment/geometry/rectangle
      parent: Rectangular description of the element
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Horizontal full width of the rectangular cross-section of an iron
        core segment in the tokamak magnetic circuit. A geometric parameter defining
        the segment shape in 2D cross-section for neutronics and electromagnetic modelling.
      kind: llm
- name: width_of_passive_structure
  kind: scalar
  status: active
  description: "Full radial extent of a rectangular passive conducting structure element\
    \ in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The radial width is the full major-radius extent of a rectangular
    passive conducting structure element, measured between its inner and outer radial
    boundaries.


    $$

    W = R_{\mathrm{outer}} - R_{\mathrm{inner}}

    $$


    where $W$ is the radial width, and $R_{\mathrm{outer}}$ and $R_{\mathrm{inner}}$
    are the major-radius coordinates in meters of the outer and inner boundaries in
    the right-handed cylindrical $(R, \phi, Z)$ frame.


    The quantity is non-negative and describes radial extent only; it is distinct
    from the full vertical extent given by [height of passive structure](name:height_of_passive_structure)
    and from the element length given by [length of passive structure](name:length_of_passive_structure).'
  unit: m
