name: prefill_gas_pressure
status: draft
cocos_transformation_type: one_like
description: Neutral gas pressure inside the vacuum vessel prior to plasma breakdown,
  governing the Townsend avalanche threshold for ionization.
documentation: "The prefill gas pressure $p_{\\rm fill}$ (Pa) is the neutral-gas filling\
  \ pressure established in the tokamak or stellarator vessel immediately before the\
  \ loop voltage is applied to initiate plasma breakdown. Together with the applied\
  \ electric field $E$, it determines the reduced electric field $E/p$ that controls\
  \ the Townsend ionization coefficient $\\alpha(E/p)$; successful breakdown requires\
  \ $E/p$ to exceed a device- and gas-species-dependent threshold, typically in the\
  \ range 0.3\u20133 kV\xB7m$^{-1}$\xB7Pa$^{-1}$ for hydrogen and deuterium. Typical\
  \ prefill pressures range from $10^{-3}$ to $10^{-1}$ Pa ($\\sim 10^{-5}$\u2013\
  $10^{-3}$ mbar) depending on the target plasma density and the gas species. The\
  \ prefill is supplied through piezoelectric or solenoid gas valves and monitored\
  \ by capacitance manometers or ionization gauges calibrated for the working gas.\
  \ Lower prefill pressures ease the electric-field requirement but reduce the available\
  \ seed-electron population, making reliable breakdown more sensitive to stray magnetic\
  \ fields and vessel conditioning. Higher pressures increase radiative losses during\
  \ the ionization phase, potentially preventing full current ramp-up. The quantity\
  \ is sign-invariant (always non-negative). See also `gas_valve_flow_rate` for the\
  \ dynamic gas injection and `toroidal_component_of_electric_field` for the driving\
  \ field during startup."
