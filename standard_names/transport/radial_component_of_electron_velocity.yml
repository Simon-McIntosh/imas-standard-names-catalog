name: radial_component_of_electron_velocity
description: Projection of the electron fluid velocity vector onto the major-radius
  ($R$) direction in cylindrical coordinates.
documentation: "The radial component $v_{e,R} = \\mathbf{v}_e \\cdot \\hat{R}$ represents\
  \ the electron fluid flow along the major-radius axis. In a tokamak plasma the radial\
  \ electron velocity is typically much smaller than the parallel or toroidal components,\
  \ but it governs cross-field particle transport: the radial electron particle flux\
  \ is $\\Gamma_{e,R} = n_e v_{e,R}$, where $n_e$ is the electron number density in\
  \ m$^{-3}$. Radial electron velocities in the core are of order 0.1\u201310 m/s\
  \ in quiescent plasmas but can reach $\\sim 10^3$ m/s during transient events such\
  \ as edge-localized modes. The quantity is resolved on general grid description\
  \ (GGD) meshes and is relevant for edge-transport codes (SOLPS, SOLEDGE) and kinetic\
  \ simulations. See also the toroidal and vertical siblings for the full vector decomposition."
kind: vector_component
unit: m.s^-1
