- name: toroidal_ion_charge_state_momentum_source
  kind: scalar
  status: active
  description: The toroidal component of the area-normalized momentum source for a
    specified ion charge state represents directional momentum transfer in an edge
    plasma.
  documentation: 'The toroidal component of the area-normalized momentum source for
    a specified ion charge state represents directional momentum transfer in an edge
    plasma. It is resolved for one ion species and charge state rather than summed
    over charge states.


    The toroidal component is defined by


    $$

    S_{\phi,i,q} = \mathbf{S}_{i,q} \cdot \hat{\phi}

    $$


    where $\mathbf{S}_{i,q}$ is the area-normalized momentum source for ion species
    $i$ in charge state $q$, and $\hat{\phi}$ is the toroidal unit vector in the right-handed
    cylindrical $(R,\phi,Z)$ frame.


    This quantity is the toroidal specialization of the charge-state-resolved vector
    [ion charge state momentum source](name:ion_charge_state_momentum_source). It
    represents net momentum transfer associated with ionization, recombination, charge
    exchange, and related collisional processes; unlike [toroidal ion momentum source](name:toroidal_ion_momentum_source),
    it is not summed over ion charge states. Its corresponding poloidal projection
    is [poloidal ion charge state momentum source](name:poloidal_ion_charge_state_momentum_source).


