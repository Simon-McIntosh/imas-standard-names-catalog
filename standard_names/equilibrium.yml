- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: active
  description: Signed poloidal magnetic flux evaluated on the last closed flux surface,
    providing the outer reference for normalized poloidal-flux coordinates.
  documentation: 'The poloidal magnetic flux at the plasma boundary is the signed
    magnetic flux through a horizontal disk whose edge lies on the last closed flux
    surface. It is the outer boundary value of the poloidal magnetic-flux function
    for the confined plasma.


    In the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the boundary value for an
    axisymmetric equilibrium is


    $$

    \psi_b = \psi(R_b,Z_b) = \int_0^{R_b} B_Z(R'',Z_b)\,2\pi R''\,dR''

    $$


    where $\psi_b$ is the poloidal magnetic flux at the plasma boundary, $\psi(R_b,Z_b)$
    is the poloidal magnetic-flux function at a selected boundary point, $(R_b,Z_b)$
    are that point''s cylindrical coordinates, $B_Z$ is the vertical magnetic-field
    component, $R''$ is the integration variable representing major radius, and $\pi$
    is the circle constant.


    This quantity applies specifically to the last closed flux surface bounding the
    confined plasma. It is a single boundary value of the flux function, with no averaging
    over the boundary or enclosed plasma implied; it is distinct from the value at
    the magnetic axis given by [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis).


    The boundary value supplies the outer endpoint for [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate),
    while the magnetic-axis value supplies the corresponding inner endpoint. The poloidal
    flux function is constant along a given closed flux surface in the axisymmetric
    equilibrium description.


    Sign convention: Positive when $B_Z$ on the defining horizontal disk points in
    the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  sources:
