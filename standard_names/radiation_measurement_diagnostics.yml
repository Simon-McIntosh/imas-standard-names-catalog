- name: radial_coordinate_of_spectrometer_channel
  kind: scalar
  status: active
  description: "Major-radius coordinate of an interpolated geometry point associated\
    \ with a spectrometer channel, measured from the toroidal symmetry axis in the\
    \ right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'The quantity is the major-radius coordinate of an interpolated geometry
    point associated with a spectrometer channel. It locates that point by its perpendicular
    distance from the toroidal symmetry axis in the right-handed cylindrical $(R,\phi,Z)$
    frame.


    At each interpolated geometry point, the coordinate is defined from its transverse
    Cartesian coordinates:


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $R$ is the major-radius coordinate, and $x$ and $y$ are the Cartesian coordinates
    along the $\hat{x}$ and $\hat{y}$ directions. The right-handed Cartesian basis
    is $(\hat{x},\hat{y},\hat{z})$, with $\hat{z}$ equal to the vertical unit direction
    $\hat{Z}$; in the cylindrical frame, $\phi$ is toroidal angle and $Z$ is vertical
    height.


    The quantity applies pointwise to each interpolated geometry knot associated with
    one spectrometer channel and is not summed, averaged, or integrated over knots,
    channels, viewing paths, or plasma regions. It identifies a geometry-point locus
    rather than a single radial location for the channel body or a channel-wide average.


    This is the spectrometer-channel-specific instance of the [radial coordinate](name:radial_coordinate).
    It retains the parent quantity''s major-radius definition while restricting its
    locus to an interpolated point in the channel geometry.'
