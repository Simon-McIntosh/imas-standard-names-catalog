- name: vertical_current_density
  kind: scalar
  status: draft
  description: "Vertical (Z) component of the total current density vector in the\
    \ right-handed cylindrical (R, \u03C6, Z) coordinate system."
  documentation: "The vertical current density $j_Z = \\mathbf{j} \\cdot \\hat{Z}$\
    \ is the projection of the total current density vector onto the vertical axis\
    \ of the right-handed cylindrical $(R, \\phi, Z)$ frame, where $Z$ is the height\
    \ above the tokamak midplane. It represents the net charge flow per unit area\
    \ in the vertical direction and is a fundamental component of the vector [current_density](name:current_density).\
    \ This quantity is routinely computed in equilibrium reconstruction and MHD stability\
    \ analysis from magnetic measurements or inferred from diagnostic data; in axisymmetric\
    \ configurations, the vertical component is related to the poloidal current stream\
    \ function. Typical values in the edge region of diverted tokamak plasmas range\
    \ from 0.1 to 10 kA\xB7m$^{-2}$, depending on the plasma regime and the presence\
    \ of halo currents during disruptions.\n\nSign convention: Positive when the current\
    \ flows in the direction of increasing vertical coordinate $Z$ (upward)."
  unit: A.m^-2
  physics_domain: magnetohydrodynamics
  links:
  - name:current_density
  arguments:
