name: normalized_toroidal_flux_coordinate_of_minimum_safety_factor
status: draft
cocos_transformation_type: one_like
description: Normalized toroidal flux coordinate $\rho_{\rm tor,N}$ at the radial
  location where the safety factor $q$ reaches its minimum value.
documentation: "The normalized toroidal flux coordinate $\\rho_{\\rm tor,N} = \\sqrt{\\\
  Phi_{\\rm tor}/\\Phi_{\\rm tor,edge}}$ evaluated at the flux surface where $q(\\\
  rho_{\\rm tor,N})$ is minimized. In standard monotonic $q$-profiles, this location\
  \ is at the magnetic axis ($\\rho_{\\rm tor,N} = 0$); in reversed-shear or hybrid\
  \ scenarios the minimum moves to $\\rho_{\\rm tor,N} \\approx 0.3$\u2013$0.6$, marking\
  \ the reversal point where magnetic shear $s = (\\rho/q)(dq/d\\rho)$ vanishes. The\
  \ radial position of $q_{\\min}$ is a key parameter for predicting neoclassical\
  \ tearing mode and double-tearing mode stability, and it defines the location of\
  \ internal transport barriers observed in advanced tokamak regimes. This value is\
  \ determined by equilibrium reconstruction, typically constrained by MSE or polarimetry\
  \ diagnostics. See `safety_factor` for the $q$-profile itself, `normalized_poloidal_magnetic_flux_of_minimum_safety_factor`\
  \ for the same position in $\\psi_N$ coordinates, and `magnetic_shear` for the related\
  \ derivative quantity."
