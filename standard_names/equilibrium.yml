- name: toroidal_magnetic_field
  kind: scalar
  status: draft
  description: Toroidal component of the total magnetic field in the right-handed
    cylindrical (R, phi, Z) frame. It is the projection along the direction of increasing
    toroidal angle phi and is usually the dominant magnetic-field component in tokamak
    equilibria.
  documentation: 'Toroidal magnetic field $B_\phi$ is the component of the total [magnetic
    field](name:magnetic_field) along $\hat{\phi}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It is the field component that wraps around the toroidal
    symmetry axis, complements the [poloidal magnetic field](name:poloidal_magnetic_field),
    and includes both the externally applied field and plasma response; the vacuum
    contribution alone is described by [toroidal vacuum magnetic field](name:toroidal_vacuum_magnetic_field).


    For an axisymmetric magnetohydrodynamic equilibrium with nested poloidal flux
    surfaces, the toroidal field is related to the toroidal-field function $F(\psi)$
    by:


    $$

    B_\phi(R,\psi) = \frac{F(\psi)}{R}

    $$


    where $\psi$ is the poloidal magnetic flux label, $R$ is the local major radius
    in meters, and $F(\psi)=R B_\phi$ is constant on each flux surface and has units
    of T m. This relation gives the familiar approximate $1/R$ variation, so the toroidal
    field is typically stronger on the high-field side than on the low-field side.


    $B_\phi$ is inferred from magnetic equilibrium reconstruction using external coil
    currents, magnetic measurements, and force-balance constraints, and may also be
    measured locally by magnetic probes. The value at the magnetic axis is a common
    reference quantity, described by [toroidal magnetic field at magnetic axis](name:toroidal_magnetic_field_at_magnetic_axis).


    Typical magnitudes are 0.1-1 T in small or low-field devices and 1-6 T in many
    present-day tokamaks, with higher values possible in high-field configurations.
    Spatial variation across the plasma is governed mainly by the local major radius
    and by the flux-surface dependence of $F(\psi)$.


    Sign convention: Positive when $B_\phi$ points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above the $+\hat{Z}$
    side).'
  unit: T
  physics_domain: equilibrium
  links:
  - name:magnetic_field
  arguments:
