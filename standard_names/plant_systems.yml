- name: total_gas_source_rate_at_midplane_due_to_gas_injection
  kind: scalar
  status: active
  description: Gas source rate at midplane due to gas injection is the non-negative
    total unweighted rate at which neutral gas particles are injected by gas valves
    assigned to the vessel equatorial midplane. It is not an electron-equivalent or
    charge-weighted rate.
  documentation: 'Gas source rate at midplane due to gas injection is the instantaneous
    total unweighted source rate of neutral gas particles injected by gas-injection
    valves assigned to the vessel equatorial midplane. It counts injected neutral
    gas particles themselves, not electron-equivalent particles, charge-weighted particles,
    or particles produced by later plasma or wall interactions.


    For the set of midplane injection valves, the total rate is the sum of the individual
    unweighted valve particle throughputs:


    $$

    \dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}} = \sum_{k \in \mathcal{M}_{\mathrm{mid}}}
    \dot{N}_k

    $$


    where $\dot{N}_{\mathrm{mid}}^{\mathrm{gas\,inj}}$ is the gas source rate at midplane
    due to gas injection, $\mathcal{M}_{\mathrm{mid}}$ is the set of gas-injection
    valves assigned to the vessel equatorial midplane, and $\dot{N}_k$ is the unweighted
    neutral-particle throughput of valve $k$.


    The total includes all gas-injection valves in the midplane group and excludes
    upper, lower, wall, recycling, pumping, ionization, and transport contributions.
    It is not additive with regional gas-source quantities that use an electron-equivalent
    or charge-weighted convention. Its time integral is the corresponding [accumulated
    total gas count at midplane due to gas injection](name:accumulated_total_gas_count_at_midplane_due_to_gas_injection).'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_total_gas_count_at_midplane_due_to_gas_injection
  - name:total_particle_source_rate_at_wall_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_rates/midplane/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-midplane-value
    dd_documentation:
      leaf: Value
      parent_path: summary/gas_injection_rates/midplane
      parent: Gas injection rate from all valves located near the equatorial midplane
      data_type: FLT_1D
      unit: s^-1
      coordinates:
      - summary/time
    enhanced_context:
      description: Gas injection rate from all valves located near the equatorial
        midplane.
      kind: template
- name: total_lower_gas_source_rate_of_vacuum_vessel_due_to_gas_injection
  kind: scalar
  status: active
  description: Instantaneous total rate at which neutral gas is introduced into the
    lower vacuum-vessel region by gas injection valves, summed over lower-region valves
    and expressed using the equivalent-electron convention across injected species.
  documentation: 'Instantaneous total rate at which neutral gas is introduced into
    the lower vacuum-vessel region by gas injection valves is the lower-region aggregate
    equivalent-electron source rate due to gas injection. It counts each injected
    neutral atom or molecule by the number of electrons associated with its neutral
    composition and sums over all injected species and all lower-region gas-injection
    valves.


    The multi-species aggregate is defined by:


    $$

    \dot{N}_{e,\mathrm{eq}}^{\mathrm{lower}} = \sum_{v \in \mathrm{lower}} \sum_m
    E_m\,\dot{N}_{v,m}

    $$


    where $\dot{N}_{e,\mathrm{eq}}^{\mathrm{lower}}$ is this total lower gas source
    rate, $\dot{N}_{v,m}$ is the neutral gas injection rate of atomic or molecular
    species $m$ from lower-region valve $v$, and $E_m = \sum_a \nu_{a,m} Z_a$ is the
    equivalent-electron count for one neutral injected particle of species $m$, with
    $\nu_{a,m}$ the stoichiometric count of atom $a$ in species $m$ and $Z_a$ its
    atomic number.


    This quantity is an injected source into the vacuum vessel and excludes pumping,
    wall recycling, ionization losses after entry, and gas introduced outside the
    lower region. Species-level quantities such as [neon source rate](name:neon_source_rate)
    and [propane source rate](name:propane_source_rate) are individual species contributions
    under the same equivalent-electron convention; [gas source rate of the vacuum
    vessel due to gas injection] is the vessel-level source quantity without the lower-region
    restriction.


    Sign convention: Positive when neutral gas is introduced into the vacuum vessel
    through lower-region injection valves.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:neon_source_rate
  - name:propane_source_rate
  sources:
  - dd_path: summary/gas_injection_rates/bottom/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-bottom-value
    dd_documentation:
