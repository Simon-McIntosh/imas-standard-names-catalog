- name: poloidal_beta
  kind: scalar
  status: active
  description: Poloidal beta is a dimensionless global equilibrium ratio of volume-averaged
    plasma pressure to the magnetic-pressure scale of the plasma-current-generated
    poloidal field. The reference poloidal-field scale is fixed by total toroidal
    plasma current, reference major radius, and confined plasma volume.
  documentation: 'Poloidal beta is a global equilibrium pressure-normalization parameter
    for the confined plasma. It compares the volume-averaged scalar plasma pressure
    with the magnetic-pressure scale of the poloidal magnetic field generated by the
    total toroidal plasma current.


    The volume-integral definition closes the reference poloidal-field scale:


    $$

    \beta_p = \frac{2\mu_0 \langle p\rangle_V}{B_{p,\mathrm{ref}}^2}

    = \frac{4\int_V p\,dV}{\mu_0 R_0 I_p^2},\qquad

    \langle p\rangle_V = \frac{1}{V}\int_V p\,dV,\qquad

    B_{p,\mathrm{ref}}^2 = \frac{\mu_0^2 R_0 I_p^2}{2V}

    $$


    where $V$ is the confined plasma volume in cubic meters, $p$ is the scalar plasma
    pressure in pascals, $dV$ is a volume element in cubic meters, $\langle p\rangle_V$
    is the volume average of $p$, $\mu_0$ is the permeability of free space in henries
    per meter, $R_0$ is a reference major radius in meters measured from the toroidal
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height, $I_p$ is the
    total toroidal plasma current in amperes, and $B_{p,\mathrm{ref}}$ is the reference
    poloidal magnetic field in teslas.


    The pressure $p$ is the scalar kinetic pressure entering the equilibrium force
    balance; it excludes the magnetic pressure used in the normalization. Poloidal
    beta differs from [toroidal beta], which is normalized to toroidal-field magnetic
    pressure, and from [normalized plasma internal inductance](name:normalized_plasma_internal_inductance),
    which characterizes poloidal-field energy associated with the spatial distribution
    of toroidal current. The use of $I_p^2$ makes poloidal beta independent of the
    sign of the toroidal plasma current.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_plasma_internal_inductance
  sources:
  - dd_path: core_profiles/global_quantities/beta_pol
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-global_quantities-beta_pol
    dd_documentation:
      leaf: Poloidal beta. Defined as betap = 4 int(p dV) / [R_0 * mu_0 * Ip^2]
      parent_path: core_profiles/global_quantities
      parent: Various global quantities derived from the profiles
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - core_profiles/time
    enhanced_context:
      description: "Poloidal beta (\u03B2p), defined as \u03B2p = 4\u222Bp dV / (R0\xB7\
        \u03BC0\xB7Ip\xB2). A dimensionless measure of plasma pressure normalized\
        \ to the poloidal magnetic pressure, key for MHD stability and confinement\
        \ characterization."
      kind: llm
  - dd_path: equilibrium/time_slice/global_quantities/beta_pol
