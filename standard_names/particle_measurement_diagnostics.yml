- name: xenon_density
  kind: scalar
  status: draft
  description: Number density of xenon ions at a given point in the plasma, summed
    over all ionization states from singly ionized through fully stripped xenon, excluding
    neutral xenon atoms.
  documentation: 'Xenon is a high-$Z$ noble-gas impurity (atomic number $Z_\mathrm{Xe}
    = 54$) introduced into fusion plasmas for radiative-mantle experiments, impurity-transport
    studies, and disruption mitigation. The xenon ion number density $n_\mathrm{Xe}$
    quantifies the local concentration of all charged xenon species and enters the
    plasma effective charge through $Z_\mathrm{eff} = \sum_i Z_i^2 n_i / n_e$, where
    $n_i$ is the partial density of ion species $i$ and $n_e$ is the electron density.


    The total xenon ion density is the sum over all ionic charge states:


    $$

    n_\mathrm{Xe} = \sum_{z=1}^{54} n_{\mathrm{Xe}^{z+}}

    $$


    where $n_{\mathrm{Xe}^{z+}}$ is the partial number density of xenon ions carrying
    charge $ze$. The charge-state distribution is determined by coronal equilibrium
    or collisional-radiative modeling at the local electron temperature and density.


    The xenon density profile is inferred from vacuum-ultraviolet or soft-X-ray line
    emission via spectroscopy and tomographic inversion, or from charge-exchange recombination
    spectroscopy using neutral-beam injection. Spatially resolved forms include [xenon_density_at_magnetic_axis](name:xenon_density_at_magnetic_axis)
    at the innermost flux surface and [xenon_density_at_pedestal](name:xenon_density_at_pedestal)
    in the edge transport barrier, while [volume_averaged_xenon_density](name:volume_averaged_xenon_density)
    provides the global impurity content figure of merit. The dimensionless impurity
    fraction relative to electron density is given by [xenon_fraction](name:xenon_fraction).


    Sign convention: Positive when ionized xenon is present in the plasma.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:xenon_density_at_magnetic_axis
  - name:xenon_density_at_pedestal
  - name:volume_averaged_xenon_density
  - name:xenon_fraction
- name: line_averaged_argon_density
  kind: scalar
  status: draft
  description: Line-averaged number density of argon ions along a chord through the
    plasma, obtained by dividing the path integral of the local argon ion density
    by the chord length.
  documentation: 'Line-averaged argon density is the chord-averaged number density
    of argon ions along a line of sight through the plasma. The local argon ion density
    is understood as the sum over argon ionization stages, so the line average represents
    the effective argon ion content sampled by the chord.


    The line average is defined by normalizing the line-integrated density by the
    chord length through the plasma:


    $$

    \langle n_{\mathrm{Ar}} \rangle_L = \frac{1}{L}\int_{\mathrm{chord}} n_{\mathrm{Ar}}(l)\,dl

    $$


    where $l$ is distance along the chord in meters, $L$ is the chord length through
    the plasma in meters, and $n_{\mathrm{Ar}}(l)$ is the local argon ion number density
    in $m^{-3}$. The integral has units of $m^{-2}$, and division by $L$ gives a line-averaged
    density in $m^{-3}$.


    In practice this quantity is obtained by first converting calibrated diagnostic
    signals to an argon density line integral, using the appropriate atomic physics,
    instrument response, and plasma-parameter modeling for the measurement. Raw brightness,
    spectral intensity, or other chord-integrated signals are not themselves line-averaged
    density; they must be interpreted as or transformed into $\int n_{\mathrm{Ar}}
    dl$ before normalization by the effective chord length.


    Typical values are about $10^{14}-10^{16}\ m^{-3}$ for trace argon concentrations,
    $10^{16}-10^{18}\ m^{-3}$ during deliberate argon seeding or impurity transport
    studies, and can approach $10^{19}\ m^{-3}$ transiently during strong gas injection
    or disruption-mitigation scenarios.'
  unit: m^-3
  physics_domain: particle_measurement_diagnostics
  links:
  - name:argon_density
  - name:volume_averaged_argon_density
  - name:line_averaged_nitrogen_density
  - name:line_averaged_effective_charge
  sources:
  - id: dd:summary/line_average/n_i/argon/value
    dd_path: summary/line_average/n_i/argon/value
    status: composed
- name: line_averaged_effective_charge
  kind: scalar
  status: draft
  description: Line-averaged effective ion charge Zeff of the plasma, obtained as
    the chord-path integral of the local effective charge divided by the chord length.
  documentation: "The line-averaged effective charge characterizes the mean impurity\
    \ content of the plasma as sampled along a diagnostic line of sight. The local\
    \ [effective charge](name:effective_charge) $Z_\\text{eff}$ is defined as $Z_\\\
    text{eff} = \\sum_i n_i Z_i^2 / n_e$, where $n_i$ is the number density of ion\
    \ species $i$, $Z_i$ is the integer charge number of species $i$, and $n_e$ is\
    \ the electron number density; deviations above unity indicate the presence of\
    \ impurity ions heavier than hydrogen.\n\nThe line average integrates the local\
    \ effective charge along a chord of length $L$:\n\n$$\n\\langle Z_\\text{eff}\
    \ \\rangle_L = \\frac{1}{L} \\int_0^L Z_\\text{eff}(l) \\, dl\n$$\n\nwhere $l$\
    \ is the coordinate along the chord.\n\nThis quantity is inferred from visible\
    \ or near-ultraviolet bremsstrahlung continuum emission along a chord, whose emissivity\
    \ scales as $\\varepsilon \\propto n_e^2 Z_\\text{eff} T_e^{-1/2}$, where $T_e$\
    \ is the electron temperature; combining this signal with a simultaneous line-integrated\
    \ electron density measurement yields $\\langle Z_\\text{eff} \\rangle_L$ without\
    \ requiring assumed spatial profile shapes. In a pure deuterium plasma $Z_\\text{eff}\
    \ = 1$; with typical light impurity content in reactor-relevant tokamak operation\
    \ values of 1.5\u20133 are common, while heavy impurity seeding scenarios can\
    \ yield values of 4\u20136. This chord-averaged quantity complements [volume_averaged_effective_charge](name:volume_averaged_effective_charge),\
    \ which weights by the full plasma volume, and differs from [effective_charge_at_limiter](name:effective_charge_at_limiter),\
    \ which is a boundary-localized evaluation.\n\nSign convention: Positive for any\
    \ plasma with nonzero electron density, since $Z_\\text{eff}$ equals the ratio\
    \ of the charge-weighted ion density second moment to $n_e$, both of which are\
    \ positive-definite quantities."
  unit: '1'
  physics_domain: particle_measurement_diagnostics
  links:
  - name:effective_charge
  - name:volume_averaged_effective_charge
  - name:effective_charge_at_limiter
  sources:
  - id: dd:summary/line_average/zeff/value
    dd_path: summary/line_average/zeff/value
    status: composed
