- name: normalized_toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  kind: scalar
  status: active
  description: Dimensionless magnetic-surface label locating the resonant flux surface
    at the center of a neoclassical tearing-mode magnetic island.
  documentation: "This quantity is the normalized toroidal-flux label of the magnetic\
    \ surface passing through the center of a neoclassical tearing-mode magnetic island.\
    \ It identifies the island\u2019s resonant surface rather than describing the\
    \ island\u2019s helical phase or radial extent.\n\nAt the island center, the normalized\
    \ toroidal-flux coordinate is defined by\n\n$$\n\\rho_{\\mathrm{tor,norm}} = \\\
    left(\\frac{\\Phi_{\\mathrm{tor}} - \\Phi_{\\mathrm{tor,axis}}}{\\Phi_{\\mathrm{tor,boundary}}\
    \ - \\Phi_{\\mathrm{tor,axis}}}\\right)^{1/2}\n$$\n\nwhere $\\rho_{\\mathrm{tor,norm}}$\
    \ is the normalized toroidal-flux coordinate, $\\Phi_{\\mathrm{tor}}$ is the enclosed\
    \ toroidal magnetic flux at the island center, $\\Phi_{\\mathrm{tor,axis}}$ is\
    \ its value at the magnetic axis, and $\\Phi_{\\mathrm{tor,boundary}}$ is its\
    \ value at the equilibrium boundary.\n\nThe quantity applies to the center, or\
    \ resonant-surface location, of one specified neoclassical tearing-mode island\
    \ and is a pointwise magnetic-surface label, not an average over the island or\
    \ a sum over modes. It is not a cylindrical radial distance, a local vector component,\
    \ or the unnormalized toroidal-flux radius represented by [toroidal flux coordinate\
    \ at the neoclassical tearing-mode center](name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center).\n\
    \nIt is the locus-specific evaluation of the parent [normalized toroidal flux\
    \ coordinate](name:normalized_toroidal_flux_coordinate) at the neoclassical tearing-mode\
    \ center. The island\u2019s helical orientation is described separately by its\
    \ [neoclassical tearing-mode phase](name:neoclassical_tearing_mode_phase)."
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_flux_coordinate_of_neoclassical_tearing_mode_center
  - name:normalized_toroidal_flux_coordinate
