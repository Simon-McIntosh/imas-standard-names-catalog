- name: wavelength_of_spectrometer_channel
  kind: scalar
  status: active
  description: Wavelength of a spectrometer channel is the spectral coordinate, expressed
    as vacuum wavelength, that identifies a characteristic point of the channel's
    spectral response. It covers channel-response wavelengths such as the reference
    wavelength at maximum instrument-function response.
  documentation: 'Wavelength of a spectrometer channel is the spectral coordinate,
    expressed as vacuum wavelength, that assigns a characteristic wavelength to a
    spectrometer channel''s optical response. It is a property of the channel response,
    rather than the rest-frame wavelength of a physical spectral transition.


    When represented by its corresponding vacuum frequency, the channel wavelength
    obeys:


    $$

    \lambda_{\mathrm{ch}} = \frac{c}{\nu_{\mathrm{ch}}}

    $$


    where $\lambda_{\mathrm{ch}}$ is the vacuum wavelength assigned to the spectrometer
    channel, $c$ is the speed of light in vacuum in m s$^{-1}$, and $\nu_{\mathrm{ch}}$
    is the corresponding vacuum frequency in s$^{-1}$.


    This parent quantity is limited to wavelength coordinates assigned to spectrometer
    channels through their spectral response. The attested concrete specialization
    is the [reference wavelength of a spectrometer channel](name:reference_wavelength_of_spectrometer_channel),
    the vacuum wavelength at which the channel''s spectral instrument function has
    maximum response; the quantity excludes channel bandwidths and in-medium wavelengths
    unless a separate medium-dependent convention is explicitly defined.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength
  - name:reference_wavelength_of_spectrometer_channel
  arguments:
  - name: wavelength
    operator: spectrometer_channel
    operator_kind: locus
- name: reference_wavelength_of_spectrometer_channel
  kind: scalar
  status: active
  description: "Vacuum wavelength at which a spectrometer channel\u2019s spectral\
    \ instrument function has its maximum response, identifying the channel\u2019\
    s response peak rather than a physical spectral line."
  documentation: "The reference wavelength of a spectrometer channel is the vacuum\
    \ wavelength corresponding to the maximum of that channel\u2019s spectral instrument\
    \ function. It is the peak-position specialization of [wavelength of a spectrometer\
    \ channel](name:wavelength_of_spectrometer_channel), not the wavelength of a plasma\
    \ emission line or an independently selected calibration reference.\n\nThe reference\
    \ wavelength is defined by\n\n$$\n\\lambda_{\\mathrm{ref}} = \\underset{\\lambda}{\\\
    operatorname{arg\\,max}}\\; \\mathcal{I}_{\\mathrm{ch}}(\\lambda)\n$$\n\nwhere\
    \ $\\lambda$ is vacuum wavelength and $\\mathcal{I}_{\\mathrm{ch}}(\\lambda)$\
    \ is the spectral instrument function of the channel as a function of wavelength.\
    \ The value identifies the response maximum; the response spread is described\
    \ separately by quantities such as [spectral width of a spectrometer channel](name:spectral_width_of_spectrometer_channel)."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_spectrometer_channel
  - name:spectral_width_of_spectrometer_channel
  arguments:
  - name: wavelength_of_spectrometer_channel
    operator: reference
    operator_kind: qualifier
  sources:
