    dd_path: turbulence/profiles_2d/neutral/density_thermal
    status: composed
- name: toroidal_argon_velocity_at_internal_transport_barrier
  kind: scalar
  status: draft
  description: Toroidal rotation velocity of argon ions at the radial location of
    an internal transport barrier.
  documentation: 'The toroidal velocity of argon ions at the internal transport barrier
    (ITB) location characterizes the toroidal plasma rotation at the radial position
    where anomalous transport is strongly suppressed. This rotation is a key element
    of barrier formation and stability, often linked to the $E \times B$ shear flow
    that suppresses turbulence. The ITB is identified by a steep gradient in the plasma
    profiles, and the argon velocity is typically measured via charge exchange recombination
    spectroscopy (CXRS) from the Doppler shift of the Ar$^{16+}$ emission line, providing
    a localized measurement. Typical toroidal velocities at the ITB in tokamak H-mode
    and advanced scenarios range from 10 to 100 km/s, depending on the injected torque
    and plasma parameters. This quantity is related to the radial electric field through
    the radial force balance and provides insight into the momentum transport and
    confinement properties. Related quantities include [toroidal_argon_velocity_at_magnetic_axis](name:toroidal_argon_velocity_at_magnetic_axis),
    [toroidal_argon_velocity_at_separatrix](name:toroidal_argon_velocity_at_separatrix),
    and [toroidal_tungsten_velocity_at_internal_transport_barrier](name:toroidal_tungsten_velocity_at_internal_transport_barrier).


    Sign convention: Positive when the velocity points in the direction of increasing
    toroidal angle $\phi$ (counter-clockwise when viewed from above).'
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:toroidal_argon_velocity_at_magnetic_axis
  - name:toroidal_argon_velocity_at_separatrix
  - name:toroidal_tungsten_velocity_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/itb/velocity_phi/argon/value
    dd_path: summary/local/itb/velocity_phi/argon/value
    status: composed
- name: toroidal_current_density_due_to_inertial
  kind: scalar
  status: draft
  description: Toroidal component of the current density due to inertial effects in
    a plasma, arising from the cross product of mass density and fluid vorticity.
  documentation: 'The toroidal inertial current density $j_{\mathrm{in},\phi}$ is
    the projection of the inertial current density vector $\mathbf{j}_{\mathrm{in}}
    = \rho_m \mathbf{v} \times \boldsymbol{\omega}$ onto the toroidal direction $\hat{\phi}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame. Here $\rho_m$ is the mass
    density, $\mathbf{v}$ is the fluid velocity, and $\boldsymbol{\omega} = \nabla
    \times \mathbf{v}$ is the fluid vorticity. This component is non-zero in rotating
    tokamak plasmas with poloidal flows interacting with toroidal rotation, contributing
    to MHD force balance in equilibrium reconstruction codes. Typical values in the
    core of neutral-beam-heated tokamaks range from $10^3$ to $10^5$ A/m$^2$.


    Sign convention: Positive when $j_{\mathrm{in},\phi}$ points in the direction
    of increasing toroidal angle $\phi$ (counter-clockwise viewed from above $+\hat{Z}$).'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:poloidal_current_density_due_to_inertial
  - name:current_density_due_to_inertial
  arguments:
  - name: current_density_due_to_inertial
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:plasma_profiles/ggd/j_inertial/toroidal
    dd_path: plasma_profiles/ggd/j_inertial/toroidal
    status: composed
- name: toroidal_fast_particle_current_density
  kind: scalar
  status: draft
  description: Toroidal current density driven by the fast-particle population, excluding
    electron and thermal ion back-currents.
  documentation: "The toroidal fast particle current density $j_{\\phi,\\mathrm{fast}}$\
    \ represents the net current carried by suprathermal (fast) ions in the toroidal\
    \ direction $\\hat{\\phi}$, computed as the flux-surface average $\\langle j_{\\\
    phi,\\mathrm{fast}} \\rangle$. This quantity excludes the electron and thermal\
    \ ion back-current (the so-called drag or shielding current) that neutralizes\
    \ the fast-particle current in a steady-state MHD equilibrium; it therefore isolates\
    \ the non-inductive current drive contribution from energetic particles alone.\
    \ Typical values in NBI-heated tokamaks range from 0.1\u20131 MA/m\xB2 in the\
    \ core, depending on beam power and plasma density, and are inferred from fast-ion\
    \ distribution functions via Fokker-Planck codes (e.g., NUBEAM, TRANSP) constrained\
    \ by neutron and neutral-particle measurements. The total fast particle current\
    \ density is the sum of the trapped, co-passing, and counter-passing orbit contributions,\
    \ each weighted by the orbit confinement fraction. The quantity is closely related\
    \ to the bootstrap current via the radial pressure gradient of fast ions, and\
    \ it is resolved per population in [toroidal_trapped_current_density](name:toroidal_trapped_current_density),\
    \ [toroidal_co_passing_current_density](name:toroidal_co_passing_current_density),\
    \ and [toroidal_counter_passing_current_density](name:toroidal_counter_passing_current_density).\
    \ The parent quantity is [fast_particle_current_density](name:fast_particle_current_density),\
    \ of which this is the toroidal component; the two are related by $j_{\\phi,\\\
    mathrm{fast}} = \\mathbf{j}_{\\mathrm{fast}} \\cdot \\hat{\\phi}$.\n\nSign convention:\
    \ Positive when the fast-particle current flows in the direction of increasing\
    \ toroidal angle $\\phi$ (counter-clockwise when viewed from above)."
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:toroidal_trapped_current_density
  - name:toroidal_co_passing_current_density
  - name:toroidal_counter_passing_current_density
  - name:fast_particle_current_density
  arguments:
  - name: fast_particle_current_density
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
