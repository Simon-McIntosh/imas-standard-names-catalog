- name: poloidal_current_function
  kind: scalar
  status: active
  description: Major-radius-weighted toroidal magnetic-field function used in axisymmetric
    equilibria and vacuum fields; in ideal-MHD plasma it is constant on each magnetic
    flux surface.
  documentation: "The poloidal current function is the major-radius-weighted toroidal\
    \ magnetic field that defines the equilibrium $F$-function. It provides a common\
    \ description for the toroidal field in axisymmetric plasma equilibria and in\
    \ current-free vacuum magnetic fields.\n\nIn the right-handed cylindrical $(R,\\\
    phi,Z)$ frame, the defining relation is\n\n$$\nF(R,Z) = R B_\\phi(R,Z)\n$$\n\n\
    where $F$ is the poloidal current function, $R$ is major radius measured from\
    \ the machine symmetry axis, $B_\\phi$ is the toroidal component of the magnetic\
    \ field, $\\phi$ is toroidal angle, and $Z$ is vertical height.\n\nFor an axisymmetric\
    \ ideal-MHD plasma equilibrium, $F$ is a flux function: it is constant on each\
    \ nested magnetic flux surface and can therefore be expressed as a function of\
    \ the poloidal magnetic-flux coordinate. The quantity describes the full toroidal\
    \ magnetic field represented by the equilibrium; it is not a surface or volume\
    \ integral, an average, or a restriction to a particular current source.\n\nThe\
    \ [vacuum poloidal current function](name:vacuum_poloidal_current_function) is\
    \ the corresponding external-coil contribution in a current-free vacuum region,\
    \ whereas the unqualified quantity denotes the general $F$-function. The [product\
    \ of the poloidal current function and its derivative with respect to the poloidal\
    \ magnetic flux coordinate](name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function)\
    \ is a distinct Grad\u2013Shafranov source term formed from $F$ and its flux derivative.\n\
    \nSign convention: Positive when $B_\\phi$ points in the direction of increasing\
    \ toroidal angle $\\phi$ in the right-handed cylindrical $(R,\\phi,Z)$ frame."
  unit: T.m
  physics_domain: equilibrium
  links:
  - name:vacuum_poloidal_current_function
  - name:product_of_poloidal_current_function_and_derivative_with_respect_to_poloidal_magnetic_flux_coordinate_of_poloidal_current_function
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/f
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-f
    dd_documentation:
      leaf: Diamagnetic function (F=R B_Phi)
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: T.m
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Diamagnetic function (F = R\xB7B\u03C6), the poloidal current\
        \ function constant on flux surfaces in ideal MHD equilibrium. Relates the\
        \ toroidal magnetic field to radial position and is a fundamental equilibrium\
        \ profile quantity."
      kind: llm
- name: poloidal_length_of_flux_surface
  kind: scalar
  status: active
  description: Poloidal arc length of a closed magnetic-flux-surface contour in an
    equilibrium poloidal cross-section, measuring the perimeter of that selected surface.
  documentation: 'The poloidal length is the perimeter of the closed contour formed
    by one selected magnetic flux surface in a poloidal cross-section. It is a geometric
    property of the surface boundary, rather than its enclosed area, volume, or toroidal
    circumference.


    The contour length is defined in the right-handed cylindrical $(R,\phi,Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height:


    $$

    L_{\mathrm{pol}} = \int_{\theta_a}^{\theta_b} \sqrt{\left(\frac{dR(\theta)}{d\theta}\right)^2
    + \left(\frac{dZ(\theta)}{d\theta}\right)^2}\,d\theta

    $$


    Here $L_{\mathrm{pol}}$ is the poloidal length, $\theta$ is any smooth parameter
    along the contour, $R(\theta)$ and $Z(\theta)$ are its cylindrical coordinate
    functions, and $\theta_a$ and $\theta_b$ are parameter values at the same contour
    point after one complete circuit. The contour is taken at fixed toroidal angle
    $\phi$.


    The quantity applies to one magnetic flux surface and includes the complete closed
    poloidal contour, with no averaging or summation over multiple surfaces. It excludes
    local arc segments and geometric quantities associated with the enclosed region.
    The selected surface may be labeled by the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate).


    Unlike [elongation of a flux surface](name:elongation_of_flux_surface), which
    describes a scale-independent cross-sectional shape ratio, the poloidal length
    retains the absolute geometric scale of the contour.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:elongation_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/global_quantities/length_pol
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-global_quantities-length_pol
    dd_documentation:
      leaf: Poloidal length of the magnetic surface
      parent_path: equilibrium/time_slice/global_quantities
      parent: 0D parameters of the equilibrium
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Poloidal arc length of the magnetic flux surface boundary contour
        in the poloidal plane (length_pol). A geometric property of the equilibrium
        flux surface used in flux-surface-averaged quantities.
      kind: llm
- name: poloidal_magnetic_field
  kind: scalar
  status: active
  description: "Poloidal magnetic-field strength formed from the radial and vertical\
    \ components of local magnetic induction in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The poloidal magnetic field $B_p$ is the magnitude of the projection
    of the local [magnetic induction](name:magnetic_field) $mathbf{B}$ onto the poloidal
    plane of the right-handed cylindrical $(R,\phi,Z)$ frame. It combines the radial
    and vertical field components while excluding the toroidal component.


    The defining relation is


    $$

    B_p = \sqrt{B_R^2 + B_Z^2}

    $$


    where $B_R$ is the [radial magnetic field](name:radial_magnetic_field) component,
    $B_Z$ is the [vertical magnetic field](name:vertical_magnetic_field) component,
    and $B_p$ is their poloidal-plane magnitude. The coordinate $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height in the right-handed cylindrical
    $(R,\phi,Z)$ frame.


    This quantity applies to the local total magnetic induction without selecting
    a particular source contribution, perturbation, equilibrium state, or evaluation
    locus. It is unaveraged and represents the combined radial and vertical contribution
    rather than either signed component separately.


    Together with the [toroidal magnetic field](name:toroidal_magnetic_field), the
    poloidal magnetic field separates the local magnetic induction into poloidal and
    toroidal parts. Unlike the radial and vertical components, $B_p$ is a magnitude
    and therefore does not retain their individual directional signs.'
  unit: T
  physics_domain: equilibrium
  links:
  - name:radial_magnetic_field
  - name:vertical_magnetic_field
  - name:toroidal_magnetic_field
  sources:
  - dd_path: edge_profiles/ggd/b_field/poloidal
