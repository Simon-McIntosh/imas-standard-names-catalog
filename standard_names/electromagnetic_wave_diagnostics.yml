- name: toroidal_wave_vector_of_beam_tracing_beam
  kind: scalar
  status: draft
  description: Physical toroidal component of the electromagnetic wave vector along
    a beam-tracing ray, defined by projection onto the toroidal unit vector in the
    right-handed cylindrical (R, phi, Z) frame. It determines, but is not identical
    to, the toroidal refractive-index component through the wave frequency.
  documentation: 'The toroidal wave vector of a beam-tracing beam is the physical
    component of the electromagnetic wave vector along the toroidal unit direction
    in the right-handed cylindrical $(R, \phi, Z)$ frame. It describes the local toroidal
    phase advance per unit length of the propagating wave and is one component of
    the full ray wave vector.


    The component is defined by projecting the local wave vector onto the toroidal
    unit vector:


    $$

    k_\phi = \mathbf{k} \cdot \hat{\phi}

    $$


    where $\mathbf{k}$ is the local electromagnetic wave vector and $\hat{\phi}$ is
    the unit vector in the direction of increasing toroidal angle $\phi$. The corresponding
    normalized toroidal refractive-index component is $N_\phi = c k_\phi / \omega$,
    where $c$ is the speed of light in m s$^{-1}$ and $\omega$ is the angular wave
    frequency in rad s$^{-1}$.


    In beam tracing, $k_\phi$ is computed from the ray or beam solution of the electromagnetic
    dispersion relation and evolves as the ray refracts through spatially varying
    plasma and magnetic-field conditions. This quantity is the physical orthonormal
    toroidal component, not the canonical phase-gradient component conjugate to the
    toroidal angle; the associated canonical quantity is $R k_\phi$, and in an axisymmetric
    medium it is $R k_\phi$, not $k_\phi$ alone, that may be conserved along a ray.


    Typical electron-cyclotron and ECE beam-tracing values are about $10^1$-$10^3$
    m$^{-1}$, with values of a few $10^3$ m$^{-1}$ possible for 100-200 GHz waves
    with strong toroidal steering. There is no fixed universal bound independent of
    frequency and plasma dispersion, but as a physical projection it satisfies $|k_\phi|
    \le |\mathbf{k}|$ locally.


    Sign convention: Positive when the wave vector component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m^-1
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radial_wave_vector_of_beam_tracing_beam
  - name:vertical_wave_vector_of_beam_tracing_beam
  - name:toroidal_normalized_wave_vector_of_beam_tracing_beam
