  - id: dd:bremsstrahlung_visible/channel/intensity
    dd_path: bremsstrahlung_visible/channel/intensity
    status: composed
- name: toroidal_angle_of_along_line_of_sight
  kind: scalar
  status: draft
  description: Toroidal angle coordinate of the second point used with a first point
    to define a diagnostic line of sight or pellet path in the right-handed cylindrical
    (R, phi, Z) frame. It gives the point's azimuthal position about the toroidal
    symmetry axis, in radians.
  documentation: 'This quantity is the toroidal angle $\phi$ of the second point used,
    together with a corresponding first point, to define a diagnostic line of sight
    or an analogous pellet path. In the right-handed cylindrical $(R, \phi, Z)$ frame,
    $R$ is major radius measured from the toroidal symmetry axis in meters, $\phi$
    is azimuthal angle in radians, and $Z$ is vertical height in meters. Angles differing
    by integer multiples of $2\pi$ represent the same physical azimuthal direction.


    Relative to a right-handed Cartesian basis $(\hat{x}, \hat{y}, \hat{z})$ with
    coordinate values $(x,y,z)$, $\hat{z}=\hat{Z}$, and a chosen $\phi=0$ direction,
    the second-point coordinates satisfy:


    $$

    x = R\cos\phi,\quad y = R\sin\phi,\quad z = Z

    $$


    where $R$ and $Z$ are in meters and $\phi$ is in radians. Equivalently, $\phi$
    is obtained from the transverse Cartesian coordinates by a two-argument arctangent,
    modulo $2\pi$.


    The second point is normally determined from the designed geometry, survey, optical
    alignment, or trajectory setup. Paired with the corresponding first point, it
    fixes the direction of the line of sight or pellet path; intermediate positions
    along that line or path have coordinates derived from the defining-point geometry
    and should not be confused with this second-point coordinate. The companion coordinates
    needed to specify the same point are major_radius_of_along_line_of_sight and [vertical_coordinate_of_along_line_of_sight](name:vertical_coordinate_of_bragg_crystal).


    Typical angular representatives span a full toroidal turn, such as $0-2\pi$ rad
    or $-\pi-\pi$ rad depending on the chosen wrap convention, while a particular
    port, viewing system, or pellet injector usually occupies a narrower sector. Comparisons
    of angle differences should account for periodic wrapping at multiples of $2\pi$.


    Sign convention: Positive when $\phi$ increases counter-clockwise when viewed
    from above in the $+\hat{Z}$ direction.'
  unit: rad
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:vertical_coordinate_of_bragg_crystal
