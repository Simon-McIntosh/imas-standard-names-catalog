- name: shearing_rate_due_to_e_cross_b_drift
  kind: scalar
  status: active
  description: "Shearing rate due to E\xD7B drift is a signed measure of differential\
    \ advection by the E\xD7B flow across neighboring magnetic flux surfaces. It is\
    \ formed from the flux-surface-normal variation of a selected E\xD7B flow quantity\
    \ scaled by a positive reference rate, without fixing the component or the reference\
    \ normalization."
  documentation: 'Shearing rate due to $E \times B$ drift is a signed scalar measure
    of how neighboring magnetic flux surfaces are differentially advected by the $E
    \times B$ flow. It characterizes the shear of that drift flow across flux surfaces,
    with the physical gradient scaled by a positive reference rate.


    The scaled shearing rate is locally defined by


    $$

    \hat{\gamma}_E = \frac{1}{\Omega_\mathrm{ref}} \frac{\partial u_{E\times B}}{\partial
    \ell_n}

    $$


    where $\hat{\gamma}_E$ is the scaled shearing rate, $u_{E\times B}$ is the selected
    component or equivalent scalar flow speed of $\mathbf{v}_{E\times B}$, $\mathbf{v}_{E\times
    B}=\mathbf{E}\times\mathbf{B}/B^2$, $\mathbf{E}$ is the electric field, $\mathbf{B}$
    is the magnetic field with magnitude $B$, $\ell_n$ is distance along the flux-surface-normal
    direction, positive toward increasing chosen flux-surface label, and $\Omega_\mathrm{ref}$
    is a positive reference rate with the same dimensions as $\partial u_{E\times
    B}/\partial \ell_n$.


    This quantity does not by itself specify the flow component, the flux-surface
    label, or the reference rate. More specific quantities may fix those choices,
    for example [normalized shearing rate due to $E \times B$ drift](name:normalized_shearing_rate_due_to_e_cross_b_drift).
    It is distinct from the $E \times B$ drift velocity because it is a gradient of
    that flow, and distinct from turbulence growth rates because it describes differential
    advection rather than temporal amplification.


    Sign convention: Positive when $u_{E\times B}$ increases as $\ell_n$ increases
    toward increasing chosen flux-surface label.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_shearing_rate_due_to_e_cross_b_drift
- name: normalized_shearing_rate_due_to_e_cross_b_drift
  kind: scalar
  status: active
  description: "Normalized shearing rate due to E\xD7B drift is the flux-surface-radius\
    \ derivative of the toroidal E\xD7B drift velocity, normalized by the gyro-Bohm\
    \ reference rate set by the reference sound speed over the reference minor radius."
  documentation: "Normalized shearing rate due to E\xD7B drift is the dimensionless\
    \ measure of how rapidly the toroidal component of the E\xD7B drift velocity varies\
    \ across neighboring flux surfaces, expressed relative to the gyro-Bohm reference\
    \ rate. It is the gyro-Bohm-normalized counterpart of [shearing_rate_due_to_e_cross_b_drift](name:shearing_rate_due_to_e_cross_b_drift).\n\
    \nWith a flux-surface minor-radius coordinate $r = a_\\mathrm{ref}\\,\\rho$, it\
    \ is defined as\n\n$$\n\\hat{\\gamma}_{E\\times B} = \\frac{a_\\mathrm{ref}}{c_\\\
    mathrm{ref}}\\,\\frac{\\partial u_{\\phi,E\\times B}}{\\partial r} = \\frac{\\\
    partial}{\\partial \\rho}\\!\\left(\\frac{u_{\\phi,E\\times B}}{c_\\mathrm{ref}}\\\
    right)\n$$\n\nwhere $u_{\\phi,E\\times B}$ is the toroidal component of the E\xD7\
    B drift velocity in the right-handed cylindrical $(R,\\phi,Z)$ frame in m s$^{-1}$,\
    \ $c_\\mathrm{ref}$ is the reference sound speed in m s$^{-1}$, $a_\\mathrm{ref}$\
    \ is the reference minor radius in m, and $\\rho$ is the normalized flux-surface\
    \ minor-radius coordinate increasing from the magnetic axis toward the plasma\
    \ boundary.\n\nThe shear is taken of the toroidal drift velocity $u_{\\phi,E\\\
    times B}$ itself, not of the associated angular rotation frequency. The angular\
    \ quantity [toroidal_rotation_frequency_due_to_e_cross_b_drift](name:toroidal_rotation_frequency_due_to_e_cross_b_drift)\
    \ is the same drift divided by the local major radius $R$; because $R$ varies\
    \ across a flux surface, the radial derivative of that angular frequency differs\
    \ from this velocity-based shear. The derivative is with respect to the flux-surface\
    \ coordinate $\\rho$, not along the major-radius coordinate $R$; a uniform toroidal\
    \ E\xD7B drift gives zero shearing rate, since only variation between neighboring\
    \ flux surfaces contributes.\n\nSign convention: Positive when $u_{\\phi,E\\times\
    \ B}$, taken positive in the direction of increasing toroidal angle $\\phi$ in\
    \ the right-handed cylindrical $(R,\\phi,Z)$ frame, increases with increasing\
    \ normalized flux-surface minor-radius coordinate $\\rho$."
  unit: '1'
  physics_domain: turbulence
