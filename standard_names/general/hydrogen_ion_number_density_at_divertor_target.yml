name: hydrogen_ion_number_density_at_divertor_target
status: draft
cocos_transformation_type: one_like
description: "Hydrogen ion number density measured at the divertor target plate strike\
  \ point, characterizing hydrogenic plasma conditions at the plasma\u2013wall interface."
documentation: The hydrogen ion number density at the divertor target, $n_{i,H}^{\mathrm{div}}$
  (in m$^{-3}$), represents the local density of hydrogen ions (summed over charge
  states, typically H$^+$) where open field lines intersect the divertor plate. This
  quantity governs the hydrogen particle flux $\Gamma_H = n_{i,H} v_{\parallel}$ to
  the surface, where $v_{\parallel}$ is the parallel flow velocity (in m s$^{-1}$),
  and is a key input to sputtering yield and recycling models. It is typically inferred
  from Langmuir probe arrays embedded in the divertor tiles, combined with spectroscopic
  H-alpha emission measurements. In attached divertor conditions, typical values range
  from $10^{18}$ to $10^{20}$ m$^{-3}$; during detachment the density can drop by
  one to two orders of magnitude. See also `electron_density_at_divertor_target` for
  the companion electron measurement.
