- name: normalized_gyrocenter_perturbed_gyroaveraged_density
  kind: scalar
  status: draft
  description: Dimensionless gyroaveraged zeroth velocity moment of the perturbed
    gyrocenter distribution function, normalized by the reference density, quantifying
    the gyrocenter particle density perturbation for a gyrokinetic eigenmode.
  documentation: 'The normalized gyrocenter perturbed gyroaveraged density is the
    dimensionless gyrophase-averaged zeroth velocity moment of the perturbed gyrocenter
    distribution function, scaled by the gyrokinetic reference density. It characterizes
    how the local gyrocenter particle density departs from its equilibrium value for
    a given eigenmode wavevector, after the fast gyromotion has been removed by the
    gyroaveraging operator.


    The defining moment is:


    $$

    \tilde{n}_{\mathrm{gc},s} = \frac{1}{n_{\mathrm{ref}}} \int J_0(k_\perp \rho_s)\,
    \delta F_s \, d^3v

    $$


    where $J_0$ is the zeroth-order Bessel function of the first kind implementing
    the gyroaveraging operation, $k_\perp$ is the perpendicular wavenumber, $\rho_s
    = v_{th,s}/\Omega_s$ is the thermal Larmor radius of species $s$ with thermal
    velocity $v_{th,s}$ and cyclotron frequency $\Omega_s$, $\delta F_s$ is the perturbed
    gyrocenter distribution function, and $n_{\mathrm{ref}}$ is the normalization
    reference density.


    This moment enters the gyrokinetic quasi-neutrality equation, coupling the perturbed
    electrostatic potential to gyrocenter charge-density fluctuations. It is computed
    in linear gyrokinetic eigenmode solvers as a function of wavevector and species
    index. The unnormalized parent quantity is [gyrocenter_perturbed_gyroaveraged_density](name:gyrocenter_perturbed_gyroaveraged_density).
    The corresponding moments for parallel current and heat flux in the same gyrocenter
    frame are [normalized_gyrocenter_perturbed_gyroaveraged_current_density](name:normalized_gyrocenter_perturbed_gyroaveraged_current_density)
    and [normalized_gyrocenter_perturbed_gyroaveraged_heat_flux](name:normalized_gyrocenter_perturbed_gyroaveraged_heat_flux).


    Sign convention: Positive when the gyroaveraged gyrocenter density perturbation
    represents a local enhancement of particle number density above the equilibrium
    background.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:gyrocenter_perturbed_gyroaveraged_density
  - name:normalized_gyrocenter_perturbed_gyroaveraged_current_density
  - name:normalized_gyrocenter_perturbed_gyroaveraged_heat_flux
