        \ beam path in the beam tracing calculation, providing the flux-surface label\
        \ at each propagation step."
      kind: llm
- name: power_at_inside_flux_surface
  kind: scalar
  status: active
  description: Cumulative power associated with a specified plasma heating or energy-transfer
    channel, integrated over the volume enclosed by a magnetic flux surface.
  documentation: 'This quantity is the cumulative power associated with one physically
    defined plasma heating or energy-transfer channel inside a specified magnetic
    flux surface. The parent does not by itself select a species, population, source,
    absorption mechanism, or whether the channel is absorbed power or net transferred
    power.


    For a volumetric channel power density, the cumulative power is


    $$

    P_{\mathrm{ch}}(\psi) = \int_{V(\psi)} p_{\mathrm{ch}}(\mathbf{r})\,\mathrm{d}V

    $$


    where $P_{\mathrm{ch}}(\psi)$ is the cumulative channel power, $\psi$ is the magnetic-flux-surface
    label, $V(\psi)$ is the volume enclosed by that surface, $p_{\mathrm{ch}}$ is
    the corresponding volumetric power density, $\mathbf{r}$ is position, and $\mathrm{d}V$
    is the volume element.


    Species- and population-specific instances include [electron power at an inside
    flux surface](name:electron_power_at_inside_flux_surface), [ion power at an inside
    flux surface](name:ion_power_at_inside_flux_surface), and [ion charge-state power
    at an inside flux surface](name:ion_charge_state_power_at_inside_flux_surface).
    Absorbed-power channels count energy deposited in the recipient population, whereas
    net-transfer channels follow the specified transfer direction and may be signed.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
- name: ion_power_at_inside_flux_surface
  kind: scalar
  status: active
  description: "Cumulative wave power absorbed by all ion populations \u2014 thermal\
    \ and fast \u2014 within the plasma volume enclosed by a specified magnetic flux\
    \ surface."
  documentation: "The ion power at inside flux surface is the cumulative rate at which\
    \ wave energy is deposited into the ion population \u2014 spanning both thermal\
    \ bulk ions and fast (non-thermal) ions \u2014 within the plasma volume bounded\
    \ by a closed magnetic flux surface. It is the ion-channel component of the more\
    \ general [power_at_inside_flux_surface](name:power_at_inside_flux_surface), separating\
    \ ion energy absorption from the corresponding electron heating contribution.\n\
    \nThe quantity is the volume integral of the total ion wave-power density $p_i(\\\
    mathbf{r})$ over the plasma domain $V(\\psi)$ enclosed by the flux surface labeled\
    \ $\\psi$:\n\n$$\nP_i(\\psi) = \\int_{V(\\psi)} p_i(\\mathbf{r}) \\, dV\n$$\n\n\
    where $p_i$ is the ion volumetric heating power density in W m$^{-3}$ and $\\\
    psi$ is the chosen flux-surface label, such as the normalized toroidal flux radius\
    \ $\\rho_\\mathrm{tor,norm}$.\n\nThe population-resolved breakdown is given by\
    \ [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface)\
    \ for the bulk ion channel and [fast_ion_power_at_inside_flux_surface](name:fast_ion_power_at_inside_flux_surface)\
    \ for non-thermal beam or fusion-born ions. This cumulative radial profile enables\
    \ power-balance analysis and is inferred from combining absorbed-power density\
    \ profiles computed via wave ray-tracing or Monte Carlo beam-deposition codes\
    \ with equilibrium flux-surface geometry."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:power_at_inside_flux_surface
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_power_at_inside_flux_surface
  arguments:
  - name: power_at_inside_flux_surface
    operator: ion
    operator_kind: qualifier
- name: fast_ion_power_at_inside_flux_surface
  kind: scalar
  status: active
  description: Cumulative wave power absorbed by the fast (non-thermal) ion population
    within the plasma volume enclosed by a specified magnetic flux surface.
  documentation: 'Fast-ion power at inside flux surface quantifies the running volume
    integral of RF wave power deposited into the suprathermal (non-thermal) ion population,
    profiling the radial distribution of enclosed fast-ion wave absorption. It forms
    the fast-ion component of [ion_power_at_inside_flux_surface](name:ion_power_at_inside_flux_surface),
    which includes both this quantity and the complementary thermal-ion contribution
    captured by [thermal_ion_power_at_inside_flux_surface](name:thermal_ion_power_at_inside_flux_surface).


    The enclosed fast-ion power is defined as:


    $$

    P_\mathrm{fast}(\psi) = \int_{V(\psi)} Q_\mathrm{fast}(\mathbf{r})\, dV

    $$


    where $Q_\mathrm{fast}$ is the volumetric fast-ion wave power deposition density
    and $V(\psi)$ is the plasma volume enclosed within the flux surface at poloidal
    flux coordinate $\psi$.


    This quantity arises primarily in scenarios such as ion cyclotron resonance heating,
    where waves resonantly accelerate minority ions to suprathermal energies and sustain
    a non-Maxwellian tail population. The profile of $P_\mathrm{fast}(\psi)$ accumulates
    with increasing enclosed volume, saturating at the total fast-ion absorbed power
    at the last closed flux surface. For the charge-state-resolved counterpart, see
    [fast_ion_state_power_at_inside_flux_surface](name:fast_ion_charge_state_power_at_inside_flux_surface);
    the local deposition density from which this integral is constructed is given
    by [fast_ion_power_density](name:fast_ion_power_density).'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:ion_power_at_inside_flux_surface
  - name:thermal_ion_power_at_inside_flux_surface
  - name:fast_ion_power_density
  arguments:
  - name: ion_power_at_inside_flux_surface
    operator: fast
    operator_kind: qualifier
  sources:
  - dd_path: waves/coherent_wave/profiles_1d/ion/power_inside_fast
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/waves.html#waves-coherent_wave-profiles_1d-ion-power_inside_fast
    dd_documentation:
