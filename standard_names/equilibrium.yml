- name: poloidal_magnetic_flux_at_magnetic_axis
  kind: scalar
  status: active
  description: Poloidal magnetic flux evaluated at the magnetic axis, providing the
    inner reference for normalized poloidal-flux coordinates.
  documentation: 'The poloidal magnetic flux at the magnetic axis is the value of
    the equilibrium flux function at the interior extremum that defines the magnetic
    axis. It is the inner reference for the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate),
    complementary to the value at the [plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).


    $$

    \psi_{\mathrm{axis}} = \psi(R_{\mathrm{axis}}, Z_{\mathrm{axis}})

    $$


    Here $\psi$ is poloidal magnetic flux, and $R_{\mathrm{axis}}$ and $Z_{\mathrm{axis}}$
    are the major-radius and vertical coordinates of the magnetic axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame. The magnetic axis is the interior point where
    the gradient of $\psi$ vanishes.


    Sign convention: Positive when the vertical magnetic field through the defining
    horizontal disk points in the $+Z$ direction.'
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:normalized_poloidal_flux_coordinate
  - name:poloidal_magnetic_flux_at_plasma_boundary
