- name: magnetic_field_incidence_angle_of_langmuir_probe
  kind: scalar
  status: draft
  description: Angle between the local magnetic-field vector and the plasma-facing
    surface at a Langmuir probe, in radians.
  documentation: "The magnetic-field incidence angle $\\alpha$ is defined as the angle\
    \ between the magnetic-field vector $\\mathbf{B}$ and the tangent plane of the\
    \ plasma-facing component (PFC) at the probe location. It determines the effective\
    \ collection area seen by parallel particle fluxes: $A_{\\mathrm{eff}} = A_{\\\
    mathrm{probe}} \\sin\\alpha$, where $A_{\\mathrm{probe}}$ is the geometric probe\
    \ area. Accurate knowledge of $\\alpha$ is critical for converting measured ion\
    \ saturation current $I_{\\mathrm{sat}}$ to parallel current density $j_{\\parallel}\
    \ = I_{\\mathrm{sat}} / A_{\\mathrm{eff}}$. In divertor and limiter geometries,\
    \ $\\alpha$ ranges from a few degrees (near-grazing incidence) to $\\sim\\!90\xB0\
    $ ($\\pi/2$ rad) for probes normal to the field. The angle is computed from equilibrium\
    \ reconstruction or direct magnetic-field measurements combined with probe geometry\
    \ surveys. See also [parallel_component_of_ion_current_density](name:parallel_component_of_ion_current_density)\
    \ for the derived current density and [electron_temperature](name:electron_temperature)\
    \ for the kinetic quantity extracted from the probe I-V characteristic."
  unit: rad
  tags:
  - equilibrium-reconstruction
  - local-measurement
  links: []
  validity_domain: ''
  constraints: []
- name: parallel_component_of_ion_current_density
  kind: vector
  status: draft
  description: Projection of the ion current density vector onto the local magnetic-field
    direction, as measured at a Langmuir probe.
  documentation: 'The parallel ion current density $j_{i,\parallel} = \mathbf{j}_i
    \cdot \hat{b}$ represents the net ion charge flux along the magnetic field line
    at the probe location, where $\hat{b} = \mathbf{B}/|\mathbf{B}|$ is the unit vector
    along the local magnetic field $\mathbf{B}$. In Langmuir probe analysis, $j_{i,\parallel}$
    is inferred from the ion saturation current $I_{\mathrm{sat}}$ corrected for the
    probe''s projected collection area: $j_{i,\parallel} = I_{\mathrm{sat}} / (A_{\mathrm{probe}}
    \sin\alpha)$, where $A_{\mathrm{probe}}$ is the geometric probe area and $\alpha$
    is the magnetic-field incidence angle with respect to the plasma-facing surface.
    Values in the scrape-off layer of medium-size tokamaks range from $10^3$ to $10^5\,\mathrm{A\,m^{-2}}$
    depending on density and connection length. See also [electron_temperature](name:electron_temperature)
    for the electron kinetic energy used in probe characteristic fitting, [plasma_potential_of_langmuir_probe](name:plasma_potential_of_langmuir_probe)
    for the local plasma potential, and [magnetic_field_incidence_angle_of_langmuir_probe](name:magnetic_field_incidence_angle_of_langmuir_probe)
    for the incidence angle $\alpha$.'
  unit: A.m^-2
  tags:
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
- name: plasma_potential_of_langmuir_probe
  kind: scalar
  status: draft
  description: Local plasma space potential inferred from a Langmuir probe I-V characteristic,
    representing the electrostatic potential of the unperturbed plasma at the probe
    location.
  documentation: "The plasma potential $V_p$ is the electrostatic potential at which\
    \ the probe surface is at the same potential as the ambient plasma, so that no\
    \ electric field exists between them. It is extracted from the Langmuir probe\
    \ current\u2013voltage (I-V) characteristic as the voltage at which the electron\
    \ current saturates, i.e. the inflection point where $d^2 I/dV^2 = 0$ in the ideal\
    \ case. In practice, $V_p$ is determined by fitting the electron-retarding and\
    \ electron-saturation regions of the I-V curve; typical values range from +5 V\
    \ to +100 V relative to the vacuum vessel in tokamak scrape-off layer (SOL) plasmas.\
    \ The plasma potential is related to the [floating_potential_of_langmuir_probe](name:floating_potential_of_langmuir_probe)\
    \ by $V_p = V_f + \\alpha\\, k_B T_e / e$, where $\\alpha \\approx 2.5$\u2013\
    3 depends on the ion mass, $T_e$ is the [electron_temperature](name:electron_temperature)\
    \ in eV, and $e$ is the elementary charge. Knowledge of $V_p$ is essential for\
    \ characterizing radial electric fields $E_r = -\\nabla V_p$ in the SOL and edge\
    \ regions, which influence turbulent transport and the L\u2013H transition."
  unit: V
  tags:
  - derived
  - local-measurement
  - spatial-profile
  links: []
  validity_domain: ''
  constraints: []
