- name: toroidal_perturbed_plasma_magnetic_field
  kind: scalar
  status: active
  description: Toroidal perturbed plasma magnetic field is the toroidal component
    of the complex linear-MHD magnetic-field perturbation carried by the confined-plasma
    response about equilibrium.
  documentation: 'Toroidal perturbed plasma magnetic field is the toroidal component
    of the complex linear-MHD eigenfunction, or corresponding real perturbation, of
    the magnetic-field deviation carried by the confined-plasma response about an
    equilibrium field. It is the toroidal projection of the [perturbed plasma magnetic
    field](name:perturbed_plasma_magnetic_field) and excludes separately represented
    externally imposed vacuum perturbations.


    The toroidal component is defined by


    $$

    \delta B_{\mathrm{pl},\phi}(\mathbf{x},t) = \delta\mathbf{B}_{\mathrm{pl}}(\mathbf{x},t)
    \cdot \hat{\boldsymbol{\phi}}

    $$


    where $\delta B_{\mathrm{pl},\phi}$ is the toroidal component, $\delta\mathbf{B}_{\mathrm{pl}}$
    is the plasma-response perturbation, $\mathbf{x}$ is position, $t$ is time, and
    $\hat{\boldsymbol{\phi}}$ is the toroidal unit vector in the right-handed cylindrical
    $(R,\phi,Z)$ frame with oriented basis $(\hat{\mathbf{R}},\hat{\boldsymbol{\phi}},\hat{\mathbf{Z}})$.
    Here $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The response field is $\delta\mathbf{B}_{\mathrm{pl}}=\mathbf{B}-\mathbf{B}_0-\delta\mathbf{B}_{\mathrm{vac}}$,
    where $\mathbf{B}$ is total field, $\mathbf{B}_0$ is equilibrium field, and $\delta\mathbf{B}_{\mathrm{vac}}$
    is a separately represented vacuum perturbation. For a specified toroidal Fourier
    harmonic, the [real part](name:toroidal_perturbed_plasma_magnetic_field_real_part)
    and [imaginary part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part)
    are phase components of this same toroidal quantity.


    Sign convention: Positive when the corresponding real-valued perturbation points
    in the direction of increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_magnetic_field
  - name:toroidal_perturbed_plasma_magnetic_field_real_part
  arguments:
  - name: perturbed_plasma_magnetic_field
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_perturbed_plasma_magnetic_field_real_part
  kind: complex
  status: active
  description: "Toroidal perturbed plasma magnetic-field real part is the in-phase\
    \ \u03C6 component, in the right-handed cylindrical (R, \u03C6, Z) frame, of the\
    \ complex first-order plasma magnetic-field perturbation eigenfunction for one\
    \ specified toroidal Fourier harmonic. In this frame, R is major radius, \u03C6\
    \ is toroidal angle, and Z is vertical height."
  documentation: 'Toroidal perturbed plasma magnetic-field real part is the real component
    of the toroidal projection of the complex first-order plasma magnetic-field perturbation
    eigenfunction in the plasma region for one specified toroidal Fourier harmonic.
    The toroidal projection is the component along $\hat{\phi}$ in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle increasing counter-clockwise when viewed from above $+\hat{Z}$, and $Z$
    is vertical height.


    The physical toroidal perturbation associated with the complex eigenfunction is
    represented by


    $$

    \delta B_\phi(R,\phi,Z,t) = \operatorname{Re}\!\left[\delta\tilde{B}_\phi(R,Z)\exp\!\left(i(n\phi-\omega
    t)\right)\right]

    $$


    where $\delta B_\phi$ is the physical first-order toroidal magnetic-field perturbation,
    $\delta\tilde{B}_\phi$ is the complex toroidal eigenfunction amplitude, $\operatorname{Re}$
    denotes the real-part operator, $n$ is the toroidal mode number, $\omega$ is the
    mode angular frequency, and $t$ is time. This quantity is $\operatorname{Re}[\delta\tilde{B}_\phi(R,Z)]$.


    Together with [toroidal_perturbed_plasma_magnetic_field_imaginary_part](name:toroidal_perturbed_plasma_magnetic_field_imaginary_part),
    this quantity specifies the complex toroidal perturbation component [toroidal_perturbed_plasma_magnetic_field](name:toroidal_perturbed_plasma_magnetic_field)
    for the selected harmonic. It is distinct from the radial and poloidal real-part
    components [radial_perturbed_plasma_magnetic_field_real_part](name:radial_perturbed_plasma_magnetic_field_real_part)
    and [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part),
    from the equilibrium toroidal magnetic field, and from the vacuum-region counterpart
    [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part).
    A global complex phase rotation of the eigenfunction changes the split between
    real and imaginary parts while leaving the reconstructed physical perturbation
    unchanged when the same Fourier convention is used.


    Sign convention: Positive when $\operatorname{Re}[\delta\tilde{B}_\phi]$ is directed
    along increasing toroidal angle $\phi$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_magnetic_field
  arguments:
  - name: toroidal_perturbed_plasma_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/plasma/b_field_perturbed/coordinate3/real
