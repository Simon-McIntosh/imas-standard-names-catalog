        heating (ICRH) antenna strap, characterizing the RF current amplitude used
        to excite the electromagnetic wave field for plasma heating.
      kind: llm
- name: second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: Signed coordinate of a point on the closed outline of an electron-cyclotron
    launcher mirror along its second local tangential axis in its object-local planar
    frame, measured from the mirror-local origin.
  documentation: 'Signed coordinate of a point on the closed outline of an electron-cyclotron
    launcher mirror along its second local tangential axis in its object-local planar
    frame, measured from the mirror-local origin, is the scalar projection of that
    point''s displacement onto the mirror''s second local tangential direction. The
    mirror-local triad is $(\hat{\mathbf{t}}_1,\hat{\mathbf{t}}_2,\hat{\mathbf{n}})$,
    where $\hat{\mathbf{t}}_1$ is the more-horizontal tangential direction directed
    toward increasing toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$
    frame, with $R$ the major radius and $Z$ the vertical height; $\hat{\mathbf{n}}$
    is the plasma-facing unit normal; and $\hat{\mathbf{t}}_2=\hat{\mathbf{n}}\times\hat{\mathbf{t}}_1$
    completes the right-handed triad.


    For an outline point with position vector $\mathbf{r}$ and mirror-local origin
    $\mathbf{r}_0$, the coordinate is defined by


    $$

    x_2 = \left(\mathbf{r}-\mathbf{r}_0\right)\cdot\hat{\mathbf{t}}_2

    $$


    where $x_2$ is the second local tangential coordinate of the outline point.


    This coordinate specifies the second in-plane component of the mirror outline
    and complements the [first local tangential coordinate](name:first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror).
    It is not the cylindrical radial coordinate $R$, toroidal angle $\phi$, or vertical
    coordinate $Z$ in the right-handed cylindrical $(R,\phi,Z)$ frame.


    Sign convention: Positive when the displacement from the mirror-local origin to
    the outline point has a component in the direction $\hat{\mathbf{t}}_2=\hat{\mathbf{n}}\times\hat{\mathbf{t}}_1$.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  sources:
  - dd_path: ec_launchers/mirror/geometry/outline/x2
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-mirror-geometry-outline-x2
