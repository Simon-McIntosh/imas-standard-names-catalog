name: poloidal_component_of_electron_energy_flux
description: Poloidal projection of the electron energy flux density vector, giving
  the net electron energy transport rate per unit area along the poloidal direction.
documentation: 'The poloidal electron energy flux $Q_{e,\theta}$ (in W m$^{-2}$) represents
  the projection of the total electron energy flux vector onto the poloidal direction
  $\hat{\theta}$, including both conductive and convective contributions: $Q_{e,\theta}
  = q_{e,\theta} + \tfrac{5}{2} T_e \Gamma_{e,\theta}$, where $q_{e,\theta}$ is the
  electron conductive heat flux (W m$^{-2}$), $T_e$ is the electron temperature (eV,
  converted to J via the elementary charge $e$), and $\Gamma_{e,\theta}$ is the poloidal
  electron particle flux (m$^{-2}$ s$^{-1}$). The factor $5/2$ arises from the enthalpy
  flux for a monatomic ideal gas. This quantity is central to two-point divertor models
  and edge energy balance analysis; it governs the heat exhaust channeled along the
  magnetic field toward divertor targets. It is evaluated on generalized geometry
  grids (GGD) in edge transport codes such as SOLPS-ITER and SOLEDGE2D. Typical values
  in the SOL range from $10^{4}$ to $10^{7}$ W m$^{-2}$ depending on confinement mode,
  upstream density, and connection length. See `poloidal_component_of_electron_particle_flux`
  for the particle-flux analog, `radial_component_of_electron_energy_flux` for the
  cross-field counterpart, and `electron_energy_flux` for the total (unresolved) energy
  flux.'
kind: vector_component
unit: m^-2.W
