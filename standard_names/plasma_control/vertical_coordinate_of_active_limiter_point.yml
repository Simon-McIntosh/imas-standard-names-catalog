name: vertical_coordinate_of_active_limiter_point
status: draft
cocos_transformation_type: one_like
description: Vertical ($Z$) coordinate of the active limiter contact point used as
  a plasma position-control target.
documentation: The active limiter point is the location on the first wall or limiter
  structure that the plasma control system designates as the plasma-wall contact point
  during limiter-bounded (L-mode startup/rampdown) phases. The vertical coordinate
  $Z_{\rm lim}$ specifies its height in the poloidal cross-section and is defined
  in the machine (cylindrical) coordinate system, where $Z = 0$ corresponds to the
  midplane. In position-control algorithms, this reference value is compared with
  the reconstructed plasma boundary to generate vertical-position error signals. Typical
  values span $\pm 0.5$ m on medium-size tokamaks, depending on whether upper or lower
  limiter configurations are selected. This quantity is paired with the corresponding
  major-radius coordinate of the active limiter point.
