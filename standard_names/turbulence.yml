    status: composed
- name: perpendicular_normalized_particle_perturbed_energy
  kind: scalar
  status: draft
  description: Dimensionless velocity-space moment of the perturbed particle distribution
    weighted by 0.5 times the species mass, the squared perpendicular speed, and the
    total speed squared. It measures the perpendicular-speed-weighted kinetic response
    of a linear gyrokinetic eigenmode relative to the chosen normalization.
  documentation: 'Perpendicular normalized particle perturbed energy is a dimensionless
    moment of the perturbed particle distribution for a species in a linear gyrokinetic
    eigenmode. Its weighting is the total kinetic-energy factor multiplied by squared
    speed perpendicular to the local magnetic field; it is not the product of perpendicular
    kinetic energy and total kinetic energy.


    The normalized moment may be written as


    $$

    M_{\perp E,s} = \frac{1}{N_{\perp E,s}} \int \frac{1}{2} m_s v_\perp^2 v^2 \,
    \delta f_s(\mathbf{v}) \, d^3v

    $$


    where $m_s$ is the species mass, $v_\perp$ is the particle speed perpendicular
    to the local magnetic field, $v^2 = v_\parallel^2 + v_\perp^2$ is the total speed
    squared, $\delta f_s$ is the perturbed particle distribution with units $s^3 m^{-6}$,
    and $d^3v$ has units $m^3 s^{-3}$. The normalization factor $N_{\perp E,s}$ has
    units $kg\,m\,s^{-4}$, matching the unnormalized integral, so that $M_{\perp E,s}$
    has unit 1.


    This quantity is computed from the velocity-space representation of the linear
    eigenfunction by numerical quadrature over $\delta f_s$. It is mainly used to
    compare how strongly different species or modes populate high-perpendicular-speed
    parts of velocity space, relative to the selected eigenmode normalization.


    No device-independent numerical range is physically meaningful for this normalized
    moment. A linear eigenmode can be multiplied by an arbitrary real or complex amplitude,
    and this moment scales by the same factor; therefore only comparisons made with
    the same normalization and eigenfunction phase convention are physically meaningful.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perpendicular_normalized_gyrocenter_perturbed_energy
  - name:parallel_normalized_particle_perturbed_pressure
  - name:normalized_particle_perturbed_energy
  sources:
