- name: magnetic_field_sensor_signal_rise_time
  kind: scalar
  status: draft
  description: Leading-edge rise time of the magnetic field sensor pulse in a neutron
    detector assembly, defined as the interval for the signal to transition from baseline
    to peak amplitude.
  documentation: 'The rise time $t_\mathrm{rise}$ quantifies how rapidly the magnetic
    field sensor output transitions from its baseline level to peak amplitude following
    a neutron-induced or test excitation event. It is governed by the sensor''s electromagnetic
    bandwidth, cable parasitics, and front-end amplifier response, and is formally
    defined as the elapsed time between the 10% and 90% amplitude thresholds on the
    leading edge of the pulse waveform. Typical values for fast magnetic pickup sensors
    in fusion neutron diagnostics range from tens of nanoseconds to a few microseconds
    depending on sensor geometry and readout electronics. The rise time directly sets
    the upper bound on count-rate capability and pile-up rejection; a short $t_\mathrm{rise}$
    permits higher neutron fluxes to be resolved without waveform overlap. The complementary
    trailing-edge quantity is [magnetic field sensor signal fall time](name:magnetic_field_sensor_signal_fall_time),
    and the analogous timing parameter for thermal sensors is [temperature sensor
    signal rise time](name:temperature_sensor_signal_rise_time). For calibration purposes,
    the same timing metric is characterized on the electronics chain using [test pulse
    generator signal rise time](name:test_pulse_generator_signal_rise_time).


    Sign convention: Positive when the signal amplitude is increasing in time, i.e.,
    the sensor output transitions from the lower baseline level toward peak amplitude.'
  unit: s
  physics_domain: neutronics
  links:
  - name:magnetic_field_sensor_signal_fall_time
  - name:temperature_sensor_signal_rise_time
  - name:test_pulse_generator_signal_rise_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/b_field_sensor/rise_time
    dd_path: neutron_diagnostic/detectors/b_field_sensor/rise_time
    status: composed
- name: neutron_detector_acquisition_end_time
  kind: scalar
  status: draft
  description: Absolute timestamp marking the end of the data recording window for
    a neutron detector channel, defining the upper temporal boundary of its acquisition
    period.
  documentation: 'The acquisition end time defines the moment at which a neutron detector
    channel stops recording data, closing the measurement window whose lower boundary
    is set by the [acquisition start time](name:neutron_detector_acquisition_start_time).
    The duration of the recording window is therefore $\Delta t = t_{\mathrm{end}}
    - t_{\mathrm{start}}$, where $t_{\mathrm{end}}$ is the acquisition end time and
    $t_{\mathrm{start}}$ is the acquisition start time, both expressed in seconds
    relative to a facility-defined reference epoch. Defining this boundary precisely
    is essential for correlating neutron count rates and spectra with plasma evolution
    phases such as the flat-top or ramp-down. In pulsed fusion devices, acquisition
    windows are typically set to span a few hundred milliseconds to several seconds
    depending on the discharge duration, and may be shorter than the full discharge
    if the detector is operated in a burst mode to avoid saturation or to capture
    transient events. The [dead time](name:neutron_detector_dead_time) and [minimum
    pulse length](name:neutron_detector_minimum_pulse_length) of the detector constrain
    the effective time resolution achievable within this window, while the [spectrum
    sampling time](name:neutron_spectrum_sampling_time) subdivides the window into
    individual spectral accumulation intervals.


    Sign convention: Positive when the end time is later than the facility reference
    epoch $t = 0$.'
  unit: s
  physics_domain: neutronics
  links:
  - name:neutron_detector_acquisition_start_time
  - name:neutron_detector_dead_time
  - name:neutron_detector_minimum_pulse_length
  - name:neutron_spectrum_sampling_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/end_time
    dd_path: neutron_diagnostic/detectors/end_time
    status: composed
- name: neutron_detector_acquisition_start_time
  kind: scalar
  status: draft
  description: Absolute start time of data recording for a neutron detector channel,
    marking the lower temporal boundary of its acquisition window.
  documentation: 'The acquisition start time defines the moment at which a neutron
    detector channel begins recording data, establishing the lower bound of the measurement
    interval $[t_\mathrm{start}, t_\mathrm{end}]$. Together with the corresponding
    [acquisition end time](name:neutron_detector_acquisition_end_time), it fully specifies
    the active recording window; the duration $\Delta t = t_\mathrm{end} - t_\mathrm{start}$
    governs how many neutron counts or spectral samples accumulate per acquisition
    period. For pulse-counting detectors (e.g., fission chambers, $^3$He proportional
    counters) in fusion experiments, acquisition windows range from a few milliseconds
    for transient events to several seconds for steady-state discharges. The start
    time is set by the data acquisition system trigger, which may be synchronized
    to the plasma current ramp-up or a reference timing signal. It should be distinguished
    from the [neutron detector dead time](name:neutron_detector_dead_time), which
    characterizes the detector''s intrinsic response limit rather than the programmed
    recording window, and from the [neutron spectrum sampling time](name:neutron_spectrum_sampling_time),
    which describes per-slice integration intervals within a longer acquisition.


    Sign convention: Positive when the acquisition start time is after the experiment
    reference epoch $t = 0$.'
  unit: s
  physics_domain: neutronics
  links:
  - name:neutron_detector_acquisition_end_time
  - name:neutron_detector_dead_time
  - name:neutron_spectrum_sampling_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/start_time
    dd_path: neutron_diagnostic/detectors/start_time
    status: composed
- name: neutron_detector_converter_temperature
  kind: scalar
  status: draft
  description: Temperature of the converter material within a neutron detector, in
    kelvin. The converter is the neutron-absorbing medium that produces detectable
    secondary charged particles through nuclear reactions. This scalar represents
    the bulk or sensor-inferred effective temperature of the converter body.
  documentation: 'The converter temperature $T_\mathrm{conv}$ is the thermodynamic
    temperature of the neutron-absorbing material (e.g., $^6$LiF, $^{10}$B$_4$C, or
    $^{10}$B-loaded films) inside a neutron detector. It quantifies the thermal state
    of the solid or liquid medium responsible for converting incident neutrons into
    charged secondary particles via reactions such as $^6$Li$(n,\alpha)^3$H or $^{10}$B$(n,\alpha)^7$Li.


    **Spatial interpretation:** For a scalar quantity, $T_\mathrm{conv}$ represents
    either the bulk-averaged temperature of the converter volume or the effective
    temperature inferred from a local sensor (thermocouple or RTD) embedded in or
    adjacent to the converter body. When spatial gradients are significant, the value
    corresponds to the sensor reading at the monitored location.


    **Physical relevance:**


    Monitoring $T_\mathrm{conv}$ is important for several reasons:


    - *Material integrity:* Elevated temperatures accelerate outgassing, chemical
    degradation, and mechanical stress in converter films and substrates, which can
    reduce detector lifetime and performance.

    - *Dimensional stability:* Thermal expansion of the converter alters its effective
    thickness and geometric efficiency.

    - *Efficiency calibration:* Precise absolute calibrations may require knowledge
    of $T_\mathrm{conv}$ to account for temperature-dependent material density and,
    in moderated detector configurations, the local thermal neutron spectrum shape.


    Note that for common converter isotopes ($^6$Li, $^{10}$B), capture cross-sections
    follow a $1/v$ dependence on neutron speed. The thermally averaged reaction rate
    for a Maxwellian neutron spectrum at temperature $T_n$ is:

    $$\langle \sigma v \rangle = \sigma_0 v_0,$$

    where $\sigma_0$ and $v_0$ are reference values at 2200 m/s. This rate is independent
    of the neutron spectrum temperature $T_n$ (and by extension largely insensitive
    to $T_\mathrm{conv}$ in thermalized environments). However, this idealized result
    applies strictly to pure $1/v$ absorbers; other converter materials or resonance-dominated
    reactions may exhibit stronger temperature sensitivity.


    **Typical values:** Under normal tokamak diagnostic conditions, $T_\mathrm{conv}$
    ranges from approximately 280 K to 400 K. Specialized cryogenic detector configurations
    may operate below 100 K. The quantity is strictly non-negative ($T_\mathrm{conv}
    \geq 0$ K).


    **Measurement:** Converter temperature is typically obtained from embedded thermocouples,
    platinum RTDs, or fiber-optic temperature sensors in thermal contact with the
    converter body.'
  unit: K
  physics_domain: neutronics
  links:
  - name:volume_of_neutron_detector_converter
  - name:temperature_sensor_signal_rise_time
  - name:temperature_sensor_signal_fall_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/radiation/converter_temperature
    dd_path: neutron_diagnostic/detectors/radiation/converter_temperature
    status: composed
- name: neutron_detector_dead_time
  kind: scalar
  status: draft
  description: Minimum interval after a detection event during which the neutron detector
    cannot register a new event, limiting the maximum countable neutron flux.
  documentation: 'The dead time $\tau_d$ of a neutron detector is the post-event paralysis
    interval during which pulse-processing electronics are occupied recovering from
    the preceding detection and are insensitive to any new incoming particle. For
    a non-paralyzable (Type I) detector the true count rate $n$ relates to the observed
    rate $m$ by $m = n / (1 + n\tau_d)$, while a paralyzable (Type II) detector obeys
    $m = n\,e^{-n\tau_d}$, where $n$ is the true neutron flux rate and $m$ is the
    measured count rate. Dead time correction is essential at high neutron fluxes
    such as those encountered during DT fusion operation, where uncorrected rate saturation
    can introduce large systematic errors in neutron yield estimates. Typical values
    range from tens of nanoseconds for fast scintillator systems to several microseconds
    for $^3$He proportional counters. Dead time must be known alongside the [acquisition
    window](name:neutron_detector_acquisition_start_time) and the [minimum pulse length](name:neutron_detector_minimum_pulse_length)
    to fully characterize the temporal response of a neutron diagnostic channel.


    Sign convention: Positive when the dead-time interval extends forward in time
    from the triggering detection event.'
  unit: s
  physics_domain: neutronics
  links:
  - name:neutron_detector_acquisition_start_time
  - name:neutron_detector_minimum_pulse_length
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/characteristics/dead_time
    dd_path: neutron_diagnostic/characteristics/dead_time
    status: composed
- name: neutron_detector_energy_grid_point
  kind: scalar
  status: draft
  description: Discrete energy value on the spectral axis of a neutron detector, serving
    as an abscissa coordinate for tabulating detector response or detection efficiency
    as a function of neutron energy.
  documentation: "Each grid point defines a specific neutron energy $E_n$ at which\
    \ the detector response \u2014 such as detection efficiency $\\varepsilon(E_n)$\
    \ \u2014 is evaluated or tabulated. The full set of such points constitutes the\
    \ energy axis of the detector's spectral response function, spanning the energy\
    \ range of interest from thermal neutrons ($\\sim 0.025$ eV) up to fast fusion\
    \ neutrons (2.45 MeV for DD reactions, 14.1 MeV for DT reactions). The energy\
    \ grid is used to reconstruct the incident neutron spectrum via unfolding techniques,\
    \ where the measured count rate $C = \\int \\varepsilon(E) \\Phi(E)\\, dE$ relates\
    \ the neutron flux $\\Phi(E)$ to the detector response. This is the top-level\
    \ detector energy axis; for grid points scoped to a specific detection band, see\
    \ [neutron_detection_band_energy_grid_point](name:neutron_detection_band_energy_grid_point),\
    \ and for the analogous axis on the neutron source side see [neutron_source_energy_grid_point](name:neutron_source_energy_grid_point).\
    \ The spacing and density of grid points affect the spectral resolution achievable\
    \ in neutron emission spectrometry measurements at fusion devices."
  unit: eV
  physics_domain: neutronics
  links:
  - name:neutron_detection_band_energy_grid_point
  - name:neutron_source_energy_grid_point
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/energy_band/energies
    dd_path: neutron_diagnostic/detectors/energy_band/energies
    status: composed
- name: neutron_spectrum_integration_duration
  kind: scalar
  status: draft
  description: 'Duration of the accumulation window used to acquire a single time-resolved
    neutron energy spectrum slice. This integration duration sets the temporal resolution
    of the spectral measurement: shorter durations yield finer time resolution at
    the cost of counting statistics.'
  documentation: "The neutron spectrum integration duration $\\Delta t$ is the length\
    \ of the time window over which detector counts are accumulated to form one spectrum\
    \ slice. If a slice is indexed by $k$, then its measurement window spans $[t_k,\\\
    , t_k + \\Delta t]$, where $t_k$ is the start time of the $k$-th slice.\n\nThis\
    \ quantity is conceptually related to but distinct from `neutron_spectrum_sampling_time`,\
    \ which may encode the cadence between successive slices (including any dead-time\
    \ or readout gap), whereas $\\Delta t$ refers specifically to the active accumulation\
    \ (live-gate) period. In general the sampling period $T_s \\geq \\Delta t$, with\
    \ equality when consecutive slices are contiguous and dead-time is negligible.\n\
    \nTypical values depend strongly on neutron yield and detector efficiency:\n-\
    \ High-power tokamak discharges: $\\Delta t \\sim 1\\text{\u2013}10\\,\\mathrm{ms}$\n\
    - Low-yield or startup phases: $\\Delta t \\sim 10\\text{\u2013}100\\,\\mathrm{ms}$\n\
    \nThe choice of $\\Delta t$ represents a trade-off between time resolution and\
    \ spectral statistical quality. Shorter integration windows resolve fast transients\
    \ (e.g., neutral-beam blips, sawtooth crashes) but reduce counts per energy bin,\
    \ degrading energy resolution and fit accuracy for quantities such as ion temperature\
    \ derived from the spectral shape.\n\nThe integration duration is set at the hardware\
    \ or acquisition-system level and applies uniformly to all energy channels within\
    \ a given time slice. It must be reported alongside the spectral data to allow\
    \ proper uncertainty quantification and comparison across diagnostics or discharges."
  unit: s
  physics_domain: neutronics
  links:
  - name:neutron_spectrum_sampling_time
  - name:neutron_detector_acquisition_start_time
  - name:neutron_detector_acquisition_end_time
  - name:neutron_detection_band_energy_grid_point
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/spectrum_sampling_time
    dd_path: neutron_diagnostic/detectors/spectrum_sampling_time
    status: composed
- name: temperature_sensor_signal_fall_time
  kind: scalar
  status: draft
  description: Fall time of the temperature sensor signal in a neutron detector assembly,
    defined as the time interval for the signal to decay from 90% to 10% of its peak
    amplitude. This quantity is intrinsically non-negative and characterizes how quickly
    the sensor responds to a decrease in thermal input.
  documentation: "The fall time $t_\\mathrm{fall}$ is defined as\n\n$$t_\\mathrm{fall}\
    \ = t_{10\\%} - t_{90\\%}$$\n\nwhere $t_{90\\%}$ is the time at which the trailing\
    \ edge of the signal first crosses 90% of the peak amplitude $A_\\mathrm{peak}$,\
    \ and $t_{10\\%}$ is the time at which it subsequently crosses 10% of $A_\\mathrm{peak}$.\
    \ The baseline is taken as the mean signal level in a quiescent window preceding\
    \ the pulse. By construction, $t_{10\\%} > t_{90\\%}$, so $t_\\mathrm{fall} \\\
    geq 0$ always; it is intrinsically non-negative and carries no sign ambiguity.\n\
    \nThe fall time is a key figure of merit for neutron diagnostic temperature sensors.\
    \ It governs how rapidly the sensor can track a decrease in thermal input following\
    \ a neutron or gamma-ray burst. Shorter fall times indicate faster thermal relaxation\
    \ and tighter thermal coupling between the sensing element and its heat sink.\
    \ Together with the rise time $t_\\mathrm{rise}$, the fall time determines the\
    \ overall pulse width and influences \u2014 though does not alone set \u2014 the\
    \ practical repetition rate of pulsed measurements.\n\nTypical values range from\
    \ microseconds for fast thermistor or thermocouple-based sensors to milliseconds\
    \ for larger bolometric elements, depending on the sensor mass, thermal contact\
    \ resistance, and cooling design.\n\nThis quantity is distinct from the electronic\
    \ shaping time applied in downstream signal processing; it reflects the intrinsic\
    \ thermal (or electrothermal) response of the sensing element itself."
  unit: s
  physics_domain: neutronics
  links:
  - name:temperature_sensor_signal_rise_time
  - name:magnetic_field_sensor_signal_fall_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/temperature_sensor/fall_time
    dd_path: neutron_diagnostic/detectors/temperature_sensor/fall_time
    status: composed
- name: temperature_sensor_signal_rise_time
  kind: scalar
  status: draft
  description: Rise time of the signal from a temperature sensor in a neutron detector
    assembly, defined as the interval for the signal to transition from 10% to 90%
    of its peak amplitude following a leading edge. This scalar duration is non-negative
    by definition.
  documentation: "The rise time $t_r$ characterizes how quickly the output signal\
    \ of a temperature sensor responds to a transient thermal or radiation-induced\
    \ input. It is defined operationally as the elapsed time between the instants\
    \ at which the signal first crosses 10% and then 90% of its peak amplitude on\
    \ the leading edge:\n\n$$t_r = t_{90\\%} - t_{10\\%}$$\n\nwhere $t_{90\\%}$ and\
    \ $t_{10\\%}$ are the times at which the signal reaches 90% and 10% of its peak\
    \ amplitude, respectively, measured relative to the pre-event baseline level.\n\
    \nThis quantity is always non-negative; a value of zero would indicate an instantaneous\
    \ step, which is physically unrealizable.\n\nTypical values depend strongly on\
    \ sensor type and thermal coupling. Thermocouple-based sensors may exhibit rise\
    \ times ranging from tens of milliseconds to several seconds, whereas faster resistance\
    \ temperature detectors (RTDs) or thermistors with thin sensing elements can respond\
    \ in 1\u2013100 ms. In neutron detector assemblies, the temperature sensor monitors\
    \ local heating from neutron and gamma deposition; the rise time is a key parameter\
    \ for assessing whether the sensor can follow fast power transients or pulsed\
    \ neutron sources.\n\nThe 10%\u201390% convention is consistent with the definition\
    \ used for signal rise times of other detector sensors in the same assembly, including\
    \ magnetic field sensors and test pulse generator signals."
  unit: s
  physics_domain: neutronics
  links:
  - name:temperature_sensor_signal_fall_time
  - name:magnetic_field_sensor_signal_rise_time
  - name:test_pulse_generator_signal_rise_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/temperature_sensor/rise_time
    dd_path: neutron_diagnostic/detectors/temperature_sensor/rise_time
    status: composed
- name: test_pulse_generator_signal_fall_time
  kind: scalar
  status: draft
  description: Trailing-edge fall time of the signal produced by a test pulse generator
    used to calibrate neutron detectors, defined as the time interval for the waveform
    to decay from 90% to 10% of peak amplitude. This quantity is intrinsically non-negative
    and characterizes the shaping speed of the generator output pulse.
  documentation: 'The fall time $t_\mathrm{fall}$ is the duration for the trailing
    edge of the test pulse generator output to decrease from 90\% to 10\% of its peak
    amplitude:


    $$t_\mathrm{fall} = t_{10\%} - t_{90\%}$$


    where $t_{90\%}$ is the instant the waveform crosses 90\% of peak on its descending
    edge and $t_{10\%}$ is the subsequent instant it crosses 10\% of peak. This threshold-based
    convention ensures reproducibility across different measurement systems and avoids
    ambiguity associated with the exact peak or baseline level.


    The fall time is intrinsically non-negative ($t_\mathrm{fall} \geq 0$) as it measures
    a duration.


    Test pulse generators are used to inject known electrical pulses into neutron
    detector readout chains for calibration and timing diagnostics. The fall time
    characterizes how quickly the generator pulse transitions to its baseline after
    the peak, which affects the dead time, pile-up rejection performance, and timing
    resolution of the detector electronics. Typical values for fast detector calibration
    systems range from a few nanoseconds to several hundred nanoseconds depending
    on the pulse shaper design.


    This quantity is the complement of the rise time: together, $t_\mathrm{rise}$
    and $t_\mathrm{fall}$ fully characterize the edge behavior of the calibration
    pulse waveform.'
  unit: s
  physics_domain: neutronics
  links:
  - name:test_pulse_generator_signal_rise_time
  - name:magnetic_field_sensor_signal_fall_time
  - name:temperature_sensor_signal_fall_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/test_generator/fall_time
    dd_path: neutron_diagnostic/detectors/test_generator/fall_time
    status: composed
- name: test_pulse_generator_signal_rise_time
  kind: scalar
  status: draft
  description: Rise time of the signal produced by a test pulse generator used to
    calibrate neutron detectors, defined as the interval for the waveform leading
    edge to transition from 10% to 90% of its peak amplitude.
  documentation: 'The rise time characterizes the leading-edge slew rate of the calibration
    pulse waveform emitted by the test pulse generator. It is defined as the time
    interval $\Delta t_{\mathrm{rise}}$ for the signal amplitude to increase from
    10\% to 90\% of its peak (baseline-subtracted) value:


    $$\Delta t_{\mathrm{rise}} = t_{90\%} - t_{10\%}$$


    where $t_{10\%}$ and $t_{90\%}$ are the times at which the waveform crosses the
    10\% and 90\% amplitude thresholds, respectively, on the rising edge.


    This quantity is a positive scalar time interval measured in seconds. Typical
    values for neutron diagnostic test pulse generators range from a few nanoseconds
    to several tens of nanoseconds, depending on the pulse-shaping electronics and
    the bandwidth requirements of the detector under calibration.


    The rise time is an important figure of merit for timing resolution: a shorter
    rise time enables more precise time-of-flight or coincidence measurements, while
    a longer rise time may broaden the measured pulse shape and degrade energy resolution
    via pile-up effects. Together with the fall time and pulse width, the rise time
    fully characterizes the temporal waveform envelope of the calibration signal.'
  unit: s
  physics_domain: neutronics
  links:
  - name:test_pulse_generator_signal_fall_time
  - name:temperature_sensor_signal_rise_time
  - name:magnetic_field_sensor_signal_rise_time
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/detectors/test_generator/rise_time
    dd_path: neutron_diagnostic/detectors/test_generator/rise_time
    status: composed
- name: total_neutron_emission_rate
  kind: scalar
  status: draft
  description: Volume-integrated rate at which neutrons are emitted from the plasma
    per unit time, summing contributions from all neutron-producing reactions including
    deuterium-tritium (DT), deuterium-deuterium (DD), and non-fusion processes such
    as beam-target and thermally driven reactions.
  documentation: "The total neutron emission rate $S_n$ is defined as the volume integral\
    \ of the local neutron source density $s_n(\\mathbf{r})$ over the entire plasma\
    \ volume $V$:\n\n$$S_n = \\int_V s_n(\\mathbf{r})\\, dV,$$\n\nwhere $s_n(\\mathbf{r})$\
    \ (units: $\\mathrm{m^{-3}\\,s^{-1}}$) includes contributions from all neutron-producing\
    \ channels \u2014 primarily the DT reaction $d + t \\to {}^4\\mathrm{He} + n$\
    \ (14.1 MeV neutrons) and the DD branch $d + d \\to {}^3\\mathrm{He} + n$ (2.45\
    \ MeV neutrons), as well as beam-target, beam-beam, and other non-thermonuclear\
    \ processes. $S_n$ therefore represents the total neutron source strength of the\
    \ plasma and has SI units of $\\mathrm{s^{-1}}$.\n\nFor a pure thermonuclear DT\
    \ plasma, the dominant contribution is\n\n$$S_n^{\\mathrm{DT}} = \\int_V n_d\\\
    , n_t\\, \\langle\\sigma v\\rangle_{\\mathrm{DT}}\\, dV,$$\n\nwhere $n_d$ and\
    \ $n_t$ are the deuterium and tritium number densities ($\\mathrm{m^{-3}}$) and\
    \ $\\langle\\sigma v\\rangle_{\\mathrm{DT}}$ is the reactivity-averaged DT fusion\
    \ cross-section ($\\mathrm{m^3\\,s^{-1}}$). Analogous integrals define the DD\
    \ and non-fusion contributions. The total emission rate is the sum of all such\
    \ channel integrals.\n\nTypical values range from $\\sim 10^{14}\\,\\mathrm{s^{-1}}$\
    \ in present-day DD experiments to $\\sim 10^{20}\\,\\mathrm{s^{-1}}$ projected\
    \ for reactor-grade DT plasmas. In ITER burning-plasma conditions, values near\
    \ $3\\times 10^{20}\\,\\mathrm{s^{-1}}$ are expected at full fusion power.\n\n\
    Because the DT fusion power $P_{\\mathrm{fus}}$ is proportional to the DT channel\
    \ of $S_n$ alone (via $P_{\\mathrm{fus}} = S_n^{\\mathrm{DT}} \\times Q_{\\mathrm{DT}}$\
    \ where $Q_{\\mathrm{DT}} = 17.6\\,\\mathrm{MeV}$), the total $S_n$ is a useful\
    \ but not direct measure of fusion power when non-fusion neutron sources are significant.\
    \ In practice $S_n$ is reconstructed from calibrated neutron detector signals\
    \ and serves as a primary global diagnostic of plasma performance."
  unit: s^-1
  physics_domain: neutronics
  links:
  - name:pellet_ablation_rate_along_pellet_path
  constraints: []
  sources:
  - id: dd:neutron_diagnostic/neutron_flux_total
    dd_path: neutron_diagnostic/neutron_flux_total
    status: composed
  - id: dd:neutron_diagnostic/synthetic_signals/total_neutron_flux
    dd_path: neutron_diagnostic/synthetic_signals/total_neutron_flux
    status: composed
- name: volume_of_neutron_detector_converter
  kind: scalar
  status: draft
  description: Physical volume of the converter material within a neutron detector,
    defined as the total geometric volume occupied by the converter substance itself.
    This is a strictly non-negative scalar quantity measured in cubic meters, representing
    the physical extent of the neutron-absorbing or neutron-converting medium.
  documentation: 'The converter volume $V_c$ is the total geometric volume enclosed
    by the outer boundary of the converter material within a single neutron detector
    element. It refers to the physical volume of the converter substance itself and
    excludes voids, cladding layers, structural support material, and any inactive
    regions not composed of the converter medium. For segmented or multi-region detectors,
    $V_c$ is the sum of the geometric volumes of all individual converter segments.


    This quantity is strictly non-negative ($V_c \geq 0$) and is inherently a geometric
    property of the detector construction, independent of the neutron flux environment.


    Physical context: Under the approximation of spatially uniform neutron flux $\Phi$
    (neutrons m$^{-2}$ s$^{-1}$) and uniform converter number density $n_c$ (m$^{-3}$)
    with microscopic reaction cross-section $\sigma_c$ (m$^2$), the volumetric reaction
    rate is

    $$R = n_c \, \sigma_c \, \Phi \, V_c,$$

    where $R$ is the total reaction rate (s$^{-1}$). This linear dependence on $V_c$
    motivates its use as a key design parameter for detector sensitivity. In practice,
    non-uniformities in flux or converter density require integrating $n_c(\mathbf{r})
    \sigma_c \Phi(\mathbf{r})$ over the converter volume.


    Typical values range from $\sim 10^{-8}$ m$^3$ (small laboratory detectors) to
    $\sim 10^{-4}$ m$^3$ (large-area fusion diagnostic detectors). The quantity describes
    only the physical geometric volume as fabricated; any effective or efficiency-weighted
    volume derived from response modeling is a separate, derived quantity.'
  unit: m^3
  physics_domain: neutronics
