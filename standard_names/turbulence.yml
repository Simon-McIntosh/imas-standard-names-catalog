- name: normalized_energy_flux_due_to_electrostatic_potential
  kind: scalar
  status: draft
  description: Gyrobohm-normalized turbulent energy flux driven by the perturbed electrostatic
    potential $\delta\phi$, summed over the flux surface in a nonlinear gyrokinetic
    simulation.
  documentation: 'In gyrokinetic turbulence, the electrostatic potential perturbation
    $\delta\phi$ drives an $E\times B$ drift that transports energy across flux surfaces.
    The normalized energy flux is defined as $Q_\phi / Q_{\mathrm{gB}}$, where $Q_\phi$
    is the radial energy flux carried by $E\times B$ convection due to $\delta\phi$
    fluctuations and $Q_{\mathrm{gB}} = n_s T_s v_{\mathrm{th},s} (\rho_s/a)^2$ is
    the gyro-Bohm normalization factor, with $n_s$ the species number density, $T_s$
    the species temperature, $v_{\mathrm{th},s} = \sqrt{T_s/m_s}$ the thermal velocity,
    $\rho_s$ the species thermal gyroradius, and $a$ the minor radius. This quantity
    represents the electrostatic contribution to the total turbulent energy transport
    and is the direct energy-flux counterpart to [normalized particle flux due to
    electrostatic potential](name:normalized_particle_flux_due_to_electrostatic_potential).
    Typical normalized values range from near zero in weakly driven turbulence to
    order unity or above near instability thresholds. The electromagnetic complement
    to this quantity is [normalized energy flux due to perturbed parallel vector potential](name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential),
    while the associated momentum transport is described by [toroidal momentum flux
    due to electrostatic potential](name:toroidal_momentum_flux_due_to_electrostatic_potential).


    Sign convention: Positive when energy flux is directed radially outward, away
    from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_flux_due_to_electrostatic_potential
  - name:normalized_energy_flux_due_to_perturbed_parallel_vector_potential
  - name:toroidal_momentum_flux_due_to_electrostatic_potential
