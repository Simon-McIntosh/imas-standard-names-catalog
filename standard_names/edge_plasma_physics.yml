- name: toroidal_neutral_state_velocity_due_to_e_cross_b_drift
  kind: scalar
  status: draft
  description: "Toroidal (phi) component of the E\xD7B drift velocity for neutral\
    \ particles in a resolved quantum state."
  documentation: "The toroidal component of the E\xD7B drift velocity for neutrals\
    \ in a given quantum state (e.g., ground or excited electronic state) on the unstructured\
    \ edge grid. This component is given by $v_{\\phi, \\mathrm{E\\times B}} = (\\\
    mathbf{E} \\times \\mathbf{B})_\\phi / B^2$, where $\\mathbf{E}$ is the electric\
    \ field and $\\mathbf{B}$ is the magnetic field. It represents the toroidal guiding-center\
    \ drift arising from the perpendicular electric and magnetic fields, contributing\
    \ to the overall toroidal rotation of the neutral population in the edge region.\
    \ Typical magnitudes in the scrape-off layer are of the order of 1\u201310 km/s.\
    \ This quantity is the toroidal projection of the full vector drift velocity $[\\\
    mathrm{neutral\\_state\\_velocity\\_due\\_to\\_e\\_cross\\_b\\_drift}]$.\n\nSign\
    \ convention: Positive when the drift velocity points in the direction of increasing\
    \ toroidal angle $\\phi$.\n\nRelated quantities include the toroidal E\xD7B drift\
    \ for ions $[\\mathrm{toroidal\\_ion\\_e\\_cross\\_b\\_drift\\_velocity}]$ and\
    \ the radial component for neutral states $[\\mathrm{radial\\_ion\\_state\\_velocity\\\
    _due\\_to\\_e\\_cross\\_b\\_drift}]$."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
