- name: minimum_safety_factor
  kind: scalar
  status: draft
  description: Global minimum of the safety factor $q$ taken over all nested flux
    surfaces within the plasma volume.
  documentation: "The safety factor minimum $q_{\\min}$ is the smallest value of $q(\\\
    psi) = d\\Phi_{\\mathrm{tor}}/d\\Phi_{\\mathrm{pol}}$ \u2014 where $\\Phi_{\\\
    mathrm{tor}}$ is the toroidal magnetic flux and $\\Phi_{\\mathrm{pol}}$ is the\
    \ poloidal magnetic flux \u2014 attained anywhere across the nested flux-surface\
    \ family. Its location relative to rational values (e.g. $q_{\\min} = 1, 3/2,\
    \ 2$) determines susceptibility to global MHD instabilities: when $q_{\\min}$\
    \ drops below unity the plasma is prone to sawtooth oscillations, while $q_{\\\
    min}$ near low-order rationals can trigger neoclassical tearing modes. In advanced\
    \ tokamak scenarios with reversed or weak magnetic shear, $q_{\\min}$ lies off-axis\
    \ and its position is tracked by [normalized_minor_radius_at_minimum_safety_factor](name:normalized_minor_radius_at_minimum_safety_factor).\
    \ Typical values range from $q_{\\min} \\approx 0.7$ during sawtooth-active phases\
    \ to $q_{\\min} > 1.5$ in hybrid and steady-state scenarios. It is derived from\
    \ equilibrium reconstruction codes using magnetic measurements supplemented by\
    \ motional Stark effect or polarimetry data. For context, the full radial $q$\
    \ profile is captured by [safety_factor](name:safety_factor), and the on-axis\
    \ value is given by [safety_factor_at_magnetic_axis](name:safety_factor_at_magnetic_axis).\n\
    \nSign convention: Positive when the toroidal field and plasma current flow in\
    \ the same direction relative to the increasing toroidal angle $\\phi$."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:normalized_minor_radius_at_minimum_safety_factor
  - name:safety_factor
  - name:safety_factor_at_magnetic_axis
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/value
    dd_path: equilibrium/time_slice/global_quantities/q_min/value
    status: composed
- name: normalized_minor_radius_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Normalized toroidal flux radius $\rho_{\mathrm{tor,norm}}$ evaluated
    at the radial location where the safety factor reaches its minimum value.
  documentation: "The normalized toroidal flux radius $\\rho_{\\mathrm{tor,norm}}\
    \ = \\sqrt{\\Phi_{\\mathrm{tor}} / \\Phi_{\\mathrm{tor,edge}}}$, where $\\Phi_{\\\
    mathrm{tor}}$ is the toroidal magnetic flux enclosed by a flux surface and $\\\
    Phi_{\\mathrm{tor,edge}}$ is its value at the plasma boundary, ranges from 0 at\
    \ the magnetic axis to 1 at the last closed flux surface. This quantity identifies\
    \ where on the radial coordinate the [minimum safety factor](name:minimum_safety_factor)\
    \ $q_{\\mathrm{min}}$ occurs, a location of central importance for MHD stability:\
    \ reversed-shear configurations with $q_{\\mathrm{min}} > 1$ placed well off-axis\
    \ are associated with internal transport barriers, while $q_{\\mathrm{min}} <\
    \ 1$ on axis governs sawtooth activity. In standard H-mode or advanced tokamak\
    \ scenarios, the $q_{\\mathrm{min}}$ location typically spans $\\rho_{\\mathrm{tor,norm}}\
    \ \\approx 0.3$\u2013$0.7$, depending on the current profile shape. The quantity\
    \ is inferred from equilibrium reconstruction constrained by motional Stark effect\
    \ polarimetry or internal inductance measurements; it complements the full [safety\
    \ factor](name:safety_factor) profile and the on-axis value [safety factor at\
    \ the magnetic axis](name:safety_factor_at_magnetic_axis).\n\nSign convention:\
    \ Positive when the normalized toroidal flux coordinate increases outward from\
    \ the magnetic axis toward the plasma boundary."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:minimum_safety_factor
  - name:safety_factor
  - name:safety_factor_at_magnetic_axis
  locus:
