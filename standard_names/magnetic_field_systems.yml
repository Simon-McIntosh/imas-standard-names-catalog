- name: maximum_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Upper bound on a signed electromagnetic force resultant for poloidal-field
    coils, with the resultant and its sign defined by the weights in one row of the
    force-combination matrix.
  documentation: 'Maximum force of a poloidal-field coil is the upper allowable value
    of a signed electromagnetic force resultant acting on the poloidal-field coil
    system. Each row of the force-combination matrix defines one such resultant by
    weighting independent products of coil currents; this quantity is the upper bound
    for that row. Together with [minimum_force_of_poloidal_field_coil](name:minimum_force_of_poloidal_field_coil),
    it defines the admissible signed force interval for the matrix-defined load.


    The force resultant for row $k$ of the force-combination matrix is constrained
    by the maximum limit:


    $$

    F_k = \sum_j C_{kj} G_j \le F_{k,\max}

    $$


    where $F_k$ is the $k$-th [force_of_poloidal_field_coil](name:force_of_poloidal_field_coil)
    and $F_{k,\max}$ is its maximum limit, both in N. The index $j$ runs over the
    matrix columns, each representing an independent coil-current product $G_j$ such
    as $I_m I_n$; $G_j$ has dimensions of current squared when currents are in A.
    The coefficient $C_{kj}$ is the signed force weight for that product, with units
    $\mathrm{N}\,\mathrm{A}^{-2}$ for currents in A, so each term $C_{kj}G_j$ has
    units N.


    The limit is normally selected from allowable mechanical loads or scenario-design
    constraints and used when evaluating candidate coil currents. The same matrix
    formalism can describe radial loads along $R$ or vertical loads along $Z$ in the
    right-handed cylindrical $(R, \phi, Z)$ frame, as in [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil)
    and [vertical_force_of_poloidal_field_coil](name:vertical_force_of_poloidal_field_coil),
    or aggregate resultants such as [radial_total_maximum_force_of_poloidal_field_coil](name:radial_total_maximum_force_of_poloidal_field_coil).
    If no finite upper ceiling is imposed for a particular row, the absence of a bound
    means that row does not constrain the force from above.


    No device-independent numerical range is intrinsic to this quantity. Finite values
    are real numbers in N determined by the selected load combination and allowable-load
    model; their scale follows the electromagnetic force coefficients and the square
    of the relevant coil currents, and may differ between radial $R$, vertical $Z$,
    and aggregate load constraints in the right-handed cylindrical $(R, \phi, Z)$
    frame.


    Sign convention: Positive when the force resultant computed from the corresponding
    row of the force-combination matrix is positive, i.e. when the weighted sum of
    the signed coil-current products specified by that row is positive.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:minimum_force_of_poloidal_field_coil
  - name:radial_total_maximum_force_of_poloidal_field_coil
  - name:vertical_maximum_force
  arguments:
  - name: force_of_poloidal_field_coil
    operator: maximum
    operator_kind: qualifier
  sources:
  - id: dd:pf_active/force_limits/limit_max
    dd_path: pf_active/force_limits/limit_max
    status: composed
- name: minimum_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Lower engineering limit on a signed net electromagnetic force formed
    from poloidal field coil force components in the right-handed cylindrical (R,
    phi, Z) frame. It is a hard constraint for axisymmetric PF coil-system design
    and scenario optimization.
  documentation: 'Minimum force of a poloidal field coil system is the lower engineering
    bound on a signed net electromagnetic force formed from individual poloidal-field-coil
    force components. It constrains axisymmetric coil-system design and scenario optimization
    by excluding coil-current waveforms or plasma scenarios that would exceed allowable
    mechanical loading in the negative limiting sense. The force components are resolved
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius
    outward from the symmetry axis, $\phi$ increases counter-clockwise when viewed
    from above $+\hat{Z}$, and $Z$ is vertical height.


    For the $i$-th force constraint, acceptable operating states satisfy:


    $$

    \mathbf{c}_i \cdot \mathbf{F} \ge F_{\min,i}

    $$


    where $\mathbf{F}$ is the vector of electromagnetic force components on the poloidal
    field coils in N, $\mathbf{c}_i$ is the dimensionless vector of weighting coefficients
    that defines the signed force combination, and $F_{\min,i}$ is the minimum permitted
    value in N. If no finite lower bound is imposed for a particular combination,
    the lower constraint is mathematically absent rather than represented by a mechanical
    force value.


    The actual signed combination is the [force_of_poloidal_field_coil](name:force_of_poloidal_field_coil).
    It is typically computed from electromagnetic equilibrium or coil-design models
    by integrating $\mathbf{J}\times\mathbf{B}$ loads over conductor volumes, or equivalently
    by evaluating mutual forces between current-carrying circuits and surrounding
    magnetic fields. The lower bound is set from structural allowables for winding
    packs, casings, supports, insulation, and fatigue margins, and is used together
    with [maximum_force_of_poloidal_field_coil](name:maximum_force_of_poloidal_field_coil)
    to define the admissible force interval for each signed combination.


    Typical absolute magnitudes of finite lower limits are 10^5-10^8 N for medium-sized
    PF coil systems and can approach 10^9 N in very large devices or for aggregate
    load combinations. The signed value may be negative, zero, or positive depending
    on the chosen combination-matrix weights and on whether the limiting sense is
    inward, outward, downward, or upward.


    Sign convention: Positive when the limiting force corresponds to a weighted electromagnetic-force
    resultant in the sense selected by positive weighting coefficients: $+\hat{R}$
    for outward radial components, $+\hat{\phi}$ for increasing toroidal angle $\phi$,
    and $+\hat{Z}$ for upward vertical components in the right-handed cylindrical
    $(R, \phi, Z)$ frame; negative weighting coefficients reverse the selected sense.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:force_of_poloidal_field_coil
  - name:maximum_force_of_poloidal_field_coil
  - name:radial_total_minimum_force_of_poloidal_field_coil
  - name:vertical_minimum_force
  arguments:
  - name: force_of_poloidal_field_coil
    operator: minimum
    operator_kind: qualifier
  sources:
  - id: dd:pf_active/force_limits/limit_min
    dd_path: pf_active/force_limits/limit_min
    status: composed
- name: normal_coordinate_of_correction_coil
  kind: scalar
  status: draft
  description: "Coordinate of the correction-coil conductor cross-section outline\
    \ vertices along the normal axis of the local Frenet\u2013Serret frame."
  documentation: "The normal coordinate locates each vertex of the polygonal outline\
    \ bounding a correction-coil conductor cross-section along the principal normal\
    \ basis vector $\\hat{n}$ of the Frenet\u2013Serret moving frame. In that frame,\
    \ $\\hat{t}$ is the unit tangent along the conductor centerline, $\\hat{n}$ points\
    \ toward the instantaneous center of curvature, and $\\hat{b} = \\hat{t} \\times\
    \ \\hat{n}$ is the binormal. Paired with the complementary [binormal coordinate](name:binormal_coordinate_of_correction_coil),\
    \ the two coordinates fully specify each outline vertex in the plane perpendicular\
    \ to the centerline.\n\nFor an outline vertex at position $\\mathbf{r}$ relative\
    \ to the centerline reference point $\\mathbf{r}_0$, the normal coordinate is:\n\
    \n$$\nn = (\\mathbf{r} - \\mathbf{r}_0) \\cdot \\hat{n}\n$$\n\nwhere $\\hat{n}$\
    \ is the Frenet\u2013Serret principal normal unit vector at the corresponding\
    \ centerline location.\n\nThe outline vertices are defined from engineering drawings\
    \ or CAD models of the correction-coil winding pack. The closed polygon formed\
    \ by the normal and binormal vertex pairs encloses the [cross-sectional area](name:area_of_correction_coil)\
    \ of the conductor. The analogous quantity for toroidal field coils is [normal_coordinate_of_toroidal_field_coil](name:normal_coordinate_of_toroidal_field_coil).\n\
    \nSign convention: Positive when the vertex displacement is in the direction of\
    \ the principal normal $\\hat{n}$, pointing toward the center of curvature of\
    \ the conductor centerline."
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_correction_coil
  - name:area_of_correction_coil
  - name:normal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    dd_path: coils_non_axisymmetric/coil/conductor/cross_section/outline/normal
    status: composed
- name: normal_coordinate_of_toroidal_field_coil
  kind: scalar
  status: draft
  description: Coordinate along the normal axis of the local Frenet-Serret frame for
    a toroidal field coil conductor cross-section, measuring each outline vertex's
    displacement perpendicular to both the conductor centerline and the binormal direction.
  documentation: 'The normal coordinate specifies the position of each vertex of the
    toroidal field coil conductor cross-section outline polygon along the principal
    normal axis $\hat{N}$ of the local Frenet-Serret frame. Together with the [binormal
    coordinate](name:binormal_coordinate_of_toroidal_field_coil), it fully describes
    the 2D polygonal shape of the conductor cross-section in the plane perpendicular
    to the conductor centerline.


    At any point along the conductor path, the Frenet-Serret frame is defined by the
    unit tangent $\hat{T}$ (along the centerline), the principal normal $\hat{N}$
    (perpendicular to $\hat{T}$ in the plane of curvature), and the binormal $\hat{B}
    = \hat{T} \times \hat{N}$. The normal coordinate of an outline vertex is:


    $$

    s_N = \mathbf{r}_v \cdot \hat{N}

    $$


    where $\mathbf{r}_v$ is the displacement vector from the local centerline point
    to the vertex in meters, and $\hat{N}$ is the dimensionless unit normal vector.


    The complete set of normal and binormal coordinate pairs for all outline vertices
    defines the conductor cross-section polygon, which determines conductor area,
    current density distribution, and electromagnetic force calculations on the coil.
    The analogous quantity for non-axisymmetric correction coils is [normal_coordinate_of_correction_coil](name:normal_coordinate_of_correction_coil).


    Typical TF coil conductor cross-sections in large tokamaks span a few centimeters
    to tens of centimeters, placing vertex coordinates in the range of roughly $-0.1$
    to $0.1$ m relative to the conductor centerline.


    Sign convention: Positive when the vertex displacement is in the direction of
    the Frenet-Serret normal vector $\hat{N}$.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:binormal_coordinate_of_toroidal_field_coil
  sources:
  - id: dd:tf/coil/conductor/cross_section/outline/normal
    dd_path: tf/coil/conductor/cross_section/outline/normal
    status: composed
- name: radial_angle_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: First inclination angle (alpha) of the oblique parallelogram or trapezoidal
    cross-section of a poloidal field coil element, measured in the poloidal plane
    from the outward major-radius direction.
  documentation: "Poloidal field coil conductors are frequently designed with non-rectangular\
    \ cross-sections modeled as parallelograms or trapezoids in the poloidal $(R,\
    \ Z)$ plane of the right-handed cylindrical $(R, \\phi, Z)$ frame. The radial\
    \ angle $\\alpha$ defines the inclination of one pair of parallel sides (the alpha-sides)\
    \ relative to the outward major-radius direction $+\\hat{R}$, characterizing how\
    \ much the conductor winding departs from a purely radial orientation.\n\nThe\
    \ oblique cross-section is fully parameterized by two inclination angles and two\
    \ side lengths. The radial angle $\\alpha$ pairs with the [vertical angle](name:vertical_angle_of_poloidal_field_coil)\
    \ $\\beta$ \u2014 measured from the vertical $+\\hat{Z}$ direction \u2014 to define\
    \ both side orientations, while [major_length_of_poloidal_field_coil](name:major_length_of_poloidal_field_coil)\
    \ and [length_of_poloidal_field_coil](name:length_of_poloidal_field_coil) give\
    \ the corresponding alpha-side and beta-side lengths.\n\nThis angle is a fixed\
    \ geometric design parameter derived from coil engineering drawings and used in\
    \ computing cross-sectional area, mutual inductance, and electromagnetic force\
    \ distributions in poloidal field coil systems. The analogous first inclination\
    \ angle for iron core segments is described by [alpha_angle_of_iron_core_segment](name:alpha_angle_of_iron_core_segment).\n\
    \nSign convention: Positive when the alpha-side of the cross-section is inclined\
    \ counter-clockwise from $+\\hat{R}$ (toward $+\\hat{Z}$) in the poloidal $(R,\
    \ Z)$ plane."
  unit: rad
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_angle_of_poloidal_field_coil
  - name:major_length_of_poloidal_field_coil
  - name:length_of_poloidal_field_coil
  - name:alpha_angle_of_iron_core_segment
  sources:
  - id: dd:pf_active/coil/element/geometry/oblique/alpha
    dd_path: pf_active/coil/element/geometry/oblique/alpha
    status: composed
- name: radial_force
  kind: scalar
  status: draft
  description: Total electromagnetic force on the poloidal-field coil system resolved
    along increasing major radius R in the right-handed cylindrical (R, phi, Z) frame,
    where Z is vertical height. It equals the sum of the radial force components on
    the individual poloidal-field coils.
  documentation: 'Radial force is the net electromagnetic force component acting on
    the poloidal-field coil system in the direction of major radius. It represents
    the aggregate radial Lorentz load over all active poloidal-field coils, complementary
    to the axial component described by vertical_force.


    The radial component can be written as the radial projection of the Lorentz force
    density integrated over the coil conductors, equivalently as a sum over individual
    coil contributions:


    $$

    F_R = \int_{V_{\mathrm{PF}}} (\mathbf{j} \times \mathbf{B}) \cdot \hat{\mathbf{R}}\,
    dV = \sum_k F_{R,k}

    $$


    where $F_R$ and each $F_{R,k}$ are forces in N, $V_{\mathrm{PF}}$ is the conducting
    volume of the poloidal-field coil system, $\mathbf{j}$ is current density in A
    m^-2, $\mathbf{B}$ is magnetic flux density in T, $dV$ is a volume element in
    m^3, and $\hat{\mathbf{R}}$ is the outward radial unit vector in the right-handed
    cylindrical $(R, \phi, Z)$ frame. The term $F_{R,k}$ is the [radial_force_of_poloidal_field_coil](name:radial_force_of_poloidal_field_coil)
    for coil $k$.


    This quantity is usually computed from electromagnetic models using the coil current
    distribution, conductor geometry, and magnetic field at the coil locations. It
    may also be obtained by summing the evaluated radial forces of the individual
    poloidal-field coils.


    Typical absolute magnitudes are strongly device and scenario dependent: small
    experimental coil systems may have radial forces of order $10^3$-$10^5$ N, while
    medium and large tokamak poloidal-field systems commonly reach $10^6$-$10^8$ N.
    Values should be interpreted relative to the mechanical limits defined for the
    specific coil system.


    Sign convention: Positive when the force is directed toward increasing major radius
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:radial_force_of_poloidal_field_coil
  sources:
  - id: dd:pf_active/radial_force/force
    dd_path: pf_active/radial_force/force
    status: composed
- name: radial_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Radial component of the electromagnetic Lorentz force acting on an
    individual poloidal field coil, positive in the direction of increasing major
    radius.
  documentation: 'The radial force on a poloidal field coil is the $\hat{R}$ component
    of the integrated Lorentz body force on the conductor, arising from the interaction
    of the coil current with the total magnetic field produced by the plasma, the
    central solenoid, and all other coils in the right-handed cylindrical $(R, \phi,
    Z)$ frame. It represents the net mechanical loading pushing the coil radially
    toward or away from the machine symmetry axis under a given plasma scenario.


    The defining relation is:


    $$

    F_R = \hat{R} \cdot \oint I \, d\boldsymbol{\ell} \times \mathbf{B}

    $$


    where $I$ is the coil current, $d\boldsymbol{\ell}$ is the vectorial conductor
    path element, and $\mathbf{B}$ is the total magnetic field at the conductor location.


    In practice, $F_R$ is computed from electromagnetic modeling of the coil-plasma
    system or inferred from equilibrium reconstruction combined with coil-current
    measurements. It is a primary structural loading parameter governing coil support
    structure design, machine assembly tolerances, and operational limits. For large
    tokamaks, individual PF coil radial forces can range from a few MN to several
    hundred MN depending on coil geometry, current, and plasma scenario. The companion
    quantity [vertical_force_of_poloidal_field_coil](name:vertical_force_of_poloidal_field_coil)
    captures the $Z$-direction loading on the same coil, while [radial_force](name:radial_force)
    gives the system-level sum over the full PF coil assembly.


    Sign convention: Positive when the force is directed in the direction of increasing
    major radius $R$, outward from the machine symmetry axis.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_force_of_poloidal_field_coil
  - name:radial_force
  sources:
  - id: dd:pf_active/coil/force_radial
    dd_path: pf_active/coil/force_radial
    status: composed
- name: radial_magnetic_field_at_ferritic_element_centroid
  kind: scalar
  status: draft
  description: Radial component of the magnetic field evaluated at the centroid of
    a ferritic element in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The radial magnetic field at a ferritic element centroid is the
    component of the local magnetic flux density projected onto the outward major-radius
    direction at the element''s geometric center. In the right-handed cylindrical
    $(R, \phi, Z)$ frame, $R$ is major radius measured outward from the symmetry axis,
    $\phi$ is toroidal angle, and $Z$ is vertical height.


    The component is defined by the projection of the magnetic field vector onto the
    local radial unit vector:


    $$

    B_R(\mathbf{x}_c) = \mathbf{B}(\mathbf{x}_c) \cdot \hat{R}(\mathbf{x}_c)

    $$


    where $\mathbf{x}_c$ is the ferritic element centroid, $\mathbf{B}$ is the magnetic
    flux density vector with components in T, $B_R$ is its radial component in T,
    and $\hat{R}$ is the dimensionless unit vector in the direction of increasing
    $R$.


    In practice, this quantity is obtained from magnetic-field calculations or equilibrium/electromagnetic
    reconstructions evaluated at the ferritic element centroid, including contributions
    from external coils, plasma current, induced currents, and magnetized materials
    as appropriate. It is relevant to ferritic response modeling, but magnetization
    is determined through the magnetic field intensity $\mathbf{H}$ in A/m and the
    material constitutive relation for magnetization $\mathbf{M}$ in A/m, rather than
    by $B_R$ alone.


    Typical absolute values $|B_R|$ near ferritic structures are often 1e-4-1 T, depending
    on proximity to coils, plasma current, geometry, and magnetic shielding. Local
    values can approach several T in regions close to strong sources or highly magnetized
    ferromagnetic material.


    Sign convention: Positive when the local magnetic field component points in the
    direction of increasing major radius $R$ in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetic_field_systems
  links:
  - name:vertical_magnetic_field_at_ferritic_element_centroid
  - name:toroidal_magnetic_field_at_ferritic_element_centroid
  - name:radial_magnetization_of_ferritic_element
  sources:
  - id: dd:ferritic/object/time_slice/b_field_r
    dd_path: ferritic/object/time_slice/b_field_r
    status: composed
- name: radial_magnetization_of_ferritic_element
  kind: scalar
  status: draft
  description: Radial component of the magnetization vector of a ferritic element,
    projecting the local magnetic polarization along the major-radius direction in
    the right-handed cylindrical (R, phi, Z) frame.
  documentation: "Magnetization is the volumetric density of magnetic dipole moments\
    \ within a material. For ferromagnetic structural components \u2014 such as ferritic\
    \ inserts positioned within the tokamak vessel \u2014 the confinement magnetic\
    \ field induces a local magnetization vector $\\mathbf{M}$ whose projection onto\
    \ the outward major-radius direction defines the radial component $M_R$.\n\n$$\n\
    M_R = \\mathbf{M} \\cdot \\hat{R}\n$$\n\nwhere $\\hat{R}$ is the unit vector pointing\
    \ in the direction of increasing major radius $R$ in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame.\n\nThe magnetization state of ferritic elements is obtained\
    \ from nonlinear electromagnetic models that couple the permeability of the ferritic\
    \ material to the local applied magnetic field. Together with [toroidal_magnetization_of_ferritic_element](name:toroidal_magnetization_of_ferritic_element)\
    \ and [vertical_magnetization_of_ferritic_element](name:vertical_magnetization_of_ferritic_element),\
    \ this radial component fully characterizes the magnetization vector in the cylindrical\
    \ $(R, \\phi, Z)$ frame. The field perturbations induced by the magnetized elements\
    \ can be evaluated at each element's geometric center via quantities such as [radial_magnetic_field_at_ferritic_element_centroid](name:radial_magnetic_field_at_ferritic_element_centroid).\n\
    \nSign convention: Positive when $M_R$ points in the direction of increasing major\
    \ radius $R$, away from the toroidal symmetry axis."
  unit: A.m^-2
  physics_domain: magnetic_field_systems
  links:
  - name:toroidal_magnetization_of_ferritic_element
  - name:vertical_magnetization_of_ferritic_element
  - name:radial_magnetic_field_at_ferritic_element_centroid
  sources:
  - id: dd:ferritic/object/time_slice/magnetic_moment_r
    dd_path: ferritic/object/time_slice/magnetic_moment_r
    status: composed
- name: radial_minimum_force_of_poloidal_field_coil
  kind: scalar
  status: draft
  description: Minimum allowed value of the signed weighted radial-force combination
    for a poloidal field coil set. It is the lower structural bound applied to a selected
    radial loading mode of the coils.
  documentation: 'Radial minimum force of a poloidal field coil set is the lower allowable
    value of a signed weighted combination of radial electromagnetic forces on the
    axisymmetric coils. The radial direction refers to the major-radius coordinate
    $R$ in the right-handed cylindrical $(R, \phi, Z)$ frame; the sign of the combined
    loading mode is defined by the selected force-combination weights, not by a universal
    inward or outward convention.


    The lower-bound constraint is


    $$

    F_{\mathrm{rad}}^{\mathrm{comb}} = \sum_{j=1}^{N_{\mathrm{coil}}} w_j F_{R,j},
    \qquad F_{\mathrm{rad}}^{\mathrm{comb}} \ge F_{\mathrm{rad,min}}

    $$


    where $F_{\mathrm{rad}}^{\mathrm{comb}}$ is the signed combined radial force in
    N, $F_{R,j}$ is the radial electromagnetic force assigned to coil $j$ in N, $w_j$
    is the dimensionless combination weight for that coil, $N_{\mathrm{coil}}$ is
    the number of coils included in the combination, and $F_{\mathrm{rad,min}}$ is
    this minimum allowable value in N. Different choices of $w_j$ represent different
    mechanically relevant load modes, such as a single-coil limit, a group load, or
    a differential load between coil groups.


    In practice the individual coil forces are computed from coil currents and magnetic
    fields using the Lorentz force density or an equivalent magnetic-energy derivative,
    then combined with the prescribed weights from the structural constraint set.
    The limit is normally established from engineering analysis of coil supports,
    cases, and attachments, and is used to reject operating points whose radial loading
    would exceed the allowed lower bound.


    Typical magnitudes of lower radial-force limits are strongly machine-specific:
    small devices may use bounds of order 10^4-10^6 N, medium-sized tokamaks often
    use 10^6-10^8 N, and large superconducting systems can use 10^8-10^9 N for the
    most demanding load combinations. The signed stored value may be negative or positive
    depending on the selected combination weights and the allowable load interval.


    Sign convention: Positive when the weighted combination $\sum_j w_j F_{R,j}$ is
    positive for the selected radial-force combination weights.'
  unit: N
  physics_domain: magnetic_field_systems
  links:
