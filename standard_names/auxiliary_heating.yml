- name: major_radius_of_beamlet_group
  kind: scalar
  status: draft
  description: Cylindrical major radius coordinate of the neutral beam injector beamlet
    group in the tokamak frame.
  documentation: 'The major radius $R$ of a neutral beam injector beamlet group locates
    the position of the group in the IMAS right-handed cylindrical $(R, \phi, Z)$
    frame. This coordinate is measured from the machine symmetry axis to the reference
    point of the group, typically the geometric center of the beamlet array. The position
    is essential for calculating the beamline geometry and the injection angle of
    neutral particles into the plasma for heating and current drive.


    The beamlet group major radius is a geometric quantity determined from the neutral
    beam injector design and installation parameters. It provides the radial location
    of the beam source, which, together with the vertical coordinate $Z$ and the toroidal
    angle $\phi$, defines the line-of-sight for the neutral beam. The location of
    the beamlet group influences the shine-through fraction, the energy deposition
    profile, and the torque input to the plasma, making it a key input for beam-tracing
    codes and transport analyzes.


    Typical values for the beamlet group major radius in present-day tokamaks range
    from $1.5\,\text{m}$ (e.g., MAST-U) to $3.0\,\text{m}$ (e.g., JET), and up to
    $6.0\,\text{m}$ for ITER. The coordinate is obtained from engineering drawings
    or fitted during beamline alignment. The companion quantity `[toroidal_angle_of_neutral_beam_injector](name:toroidal_angle_of_neutral_beam_injector)`
    provides the corresponding toroidal location, and `[major_radius_of_neutral_beam_injector](name:major_radius_of_neutral_beam_injector)`
    gives the coordinate of the injector assembly.


    Sign convention: Positive when the beamlet group is located at a larger major
    radius (outward from the machine symmetry axis).


    The beamlet group major radius is also related to the `[major_radius_of_beam_tracing_beam](name:major_radius_of_beam_tracing_beam)`
    coordinate, which defines the radial position of the beam axis during ray tracing.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_angle_of_neutral_beam_injector
  - name:major_radius_of_neutral_beam_injector
  - name:major_radius_of_beam_tracing_beam
  sources:
