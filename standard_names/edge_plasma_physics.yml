- name: total_ion_number_density
  kind: scalar
  status: draft
  description: Number density of all ion species summed over all charge states and
    all populations (thermal plus non-thermal), representing the complete ion inventory
    per unit volume.
  documentation: 'The total ion number density $n_{i,\mathrm{tot}}$ is the sum of
    all ion contributions across every species, charge state, and energy population
    (thermal and non-thermal) present in the plasma. It satisfies $n_{i,\mathrm{tot}}
    = \sum_s \sum_z n_{s,z}$, where $s$ indexes species and $z$ indexes charge states.
    This quantity differs from [total thermal ion number density](name:total_thermal_ion_number_density),
    which excludes fast (suprathermal) ions, and from [ion number density](name:ion_number_density),
    which is also a sum over all charge states but may be used in contexts where the
    thermal-plus-fast distinction is less explicit. In the edge and scrape-off layer,
    $n_{i,\mathrm{tot}}$ typically ranges from $10^{17}$ to $10^{20}$ m$^{-3}$, with
    the highest values in the divertor region. It is obtained from fluid or kinetic
    edge transport codes and can be inferred via Langmuir probe arrays or Thomson
    scattering when species-resolved measurements are available. The complementary
    neutral inventory is described by [neutral number density](name:neutral_number_density),
    and fast ion contributions are isolated in [fast ion number density](name:fast_ion_number_density).


    Sign convention: Positive when the ion particle count per unit volume is nonzero,
    as a number density is inherently non-negative.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:total_thermal_ion_number_density
  - name:ion_number_density
  - name:neutral_number_density
  - name:fast_ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/ggd/n_i_total/values
    dd_path: edge_profiles/ggd/n_i_total/values
    status: composed
- name: total_ion_state_number_density
  kind: scalar
  status: draft
  description: Total (thermal plus non-thermal) ion number density for a specific
    charge state, encompassing all ion populations per unit volume at that ionization
    stage.
  documentation: "The total ion state number density $n_{z,\\text{tot}}$ gives the\
    \ number of ions per unit volume occupying a particular charge state $z$, summing\
    \ over both thermal (Maxwellian) and non-thermal (fast or suprathermal) ion populations.\
    \ This charge-state-resolved quantity satisfies $n_{\\text{ion}} = \\sum_z n_{z,\\\
    text{tot}}$, where $n_{\\text{ion}}$ is the species-integrated [ion number density](name:ion_number_density)\
    \ and the sum runs over all ionization stages. Resolving the density by charge\
    \ state is essential in the edge and scrape-off layer, where partial ionization\
    \ and recombination create a distribution of charge states whose individual densities\
    \ control radiative cooling rates, charge-exchange reactions, and impurity transport.\
    \ Typical values span $10^{16}$\u2013$10^{20}$ m$^{-3}$ depending on species,\
    \ charge state, and plasma region. The complementary quantity for the non-thermal\
    \ population alone is [fast ion state number density](name:fast_ion_state_number_density),\
    \ while the charge-state-summed thermal ion density is [thermal ion number density](name:thermal_ion_number_density).\
    \ For neutrals resolved by internal excitation state, the analogous quantity is\
    \ [total neutral state number density](name:total_neutral_state_number_density)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:ion_number_density
  - name:fast_ion_state_number_density
  - name:thermal_ion_number_density
  - name:total_neutral_state_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/ion/state/density
    dd_path: edge_profiles/profiles_1d/ion/state/density
    status: composed
- name: total_neutral_state_number_density
  kind: scalar
  status: draft
  description: Total (thermal plus non-thermal) neutral particle number density resolved
    per internal quantum excitation state, summed over all neutral populations.
  documentation: "The total neutral state number density $n_{\\rm neutral,state}$\
    \ gives the number of neutral particles per unit volume that occupy a specific\
    \ internal quantum state (electronic, vibrational, or rotational excitation level),\
    \ aggregating contributions from both thermal (Maxwellian) and non-thermal (suprathermal)\
    \ neutral populations. This state-resolved quantity is essential for collisional-radiative\
    \ modeling in the edge and scrape-off layer, where excited-state populations govern\
    \ photon emission rates, ionization cross-sections, and charge-exchange reaction\
    \ rates. The governing relation is $n_{\\rm total} = \\sum_s n_{\\rm neutral,state}(s)$,\
    \ where the sum over all internal states $s$ recovers the [total neutral number\
    \ density](name:neutral_number_density). In typical divertor or scrape-off layer\
    \ conditions, ground-state densities can reach $10^{18}$\u2013$10^{20}\\,\\mathrm{m}^{-3}$,\
    \ while excited-state populations are orders of magnitude smaller and set by local\
    \ collisional-radiative equilibrium. This quantity is computed by neutral transport\
    \ or collisional-radiative codes and inferred experimentally from spectroscopic\
    \ line intensities. The per-state analog restricted to a single neutral population\
    \ is [neutral_state_number_density](name:neutral_state_number_density), while\
    \ the analogous ion quantity resolved by charge state is [total_ion_state_number_density](name:total_ion_state_number_density);\
    \ the thermal neutral contribution summed over all states is captured by [thermal_neutral_number_density](name:thermal_neutral_number_density)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_number_density
  - name:neutral_state_number_density
  - name:total_ion_state_number_density
  - name:thermal_neutral_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/neutral/state/density
    dd_path: edge_profiles/profiles_1d/neutral/state/density
    status: composed
- name: total_thermal_ion_number_density
  kind: scalar
  status: draft
  description: Number density of thermal ions summed over all ion species and charge
    states, representing the complete thermal ion population per unit volume in the
    edge plasma.
  documentation: 'The total thermal ion number density $n_{i,\mathrm{th,total}}$ is
    the sum of the thermal (Maxwellian) ion number densities over all ion species
    $s$ and all charge states $z$: $$n_{i,\mathrm{th,total}} = \sum_s \sum_z n_{i,s,z}^{\mathrm{th}},$$
    where each $n_{i,s,z}^{\mathrm{th}}$ is the thermal partial density for species
    $s$ in charge state $z$. This quantity aggregates the full thermal ion inventory
    without contribution from fast or suprathermal ions; the non-thermal fast-ion
    component is tracked separately by [fast_ion_number_density](name:fast_ion_number_density).
    In quasi-neutral edge plasmas, $n_{i,\mathrm{th,total}}$ approaches the [electron_number_density](name:electron_number_density)
    when fast-ion fractions are small, providing a useful check of charge neutrality.
    The per-species thermal density is given by [thermal_ion_number_density](name:thermal_ion_number_density),
    while per-charge-state resolution is available from [ion_state_number_density](name:ion_state_number_density).
    The complete ion inventory including fast ions corresponds to [total_ion_number_density](name:total_ion_number_density).
    Typical values in the edge scrape-off layer range from $10^{17}$ to $10^{20}$
    m$^{-3}$, dropping sharply across the last closed flux surface toward the wall.


    Sign convention: Positive when the thermal ion population is finite and nonzero,
    as a number density is an intrinsically non-negative quantity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:fast_ion_number_density
  - name:electron_number_density
  - name:thermal_ion_number_density
  - name:ion_state_number_density
  - name:total_ion_number_density
  constraints: []
  sources:
  - id: dd:edge_profiles/profiles_1d/n_i_thermal_total
    dd_path: edge_profiles/profiles_1d/n_i_thermal_total
    status: composed
- name: vertical_component_of_ion_velocity_due_to_convection
  kind: scalar
  status: draft
  description: 'Vertical (Z) component of the bulk ion fluid velocity due to convection,
    defined as the projection of the ion convective flow velocity vector onto the
    vertical axis: v_{i,Z} = v_i dot Z-hat in the right-handed cylindrical (R, phi,
    Z) frame, where Z is the vertical height coordinate.'
  documentation: "The vertical component of the ion convective velocity, $v_{i,Z}$,\
    \ is defined by the projection\n$$v_{i,Z} = \\mathbf{v}_i \\cdot \\hat{Z}$$\n\
    where $\\mathbf{v}_i$ is the bulk ion fluid velocity vector and $\\hat{Z}$ is\
    \ the unit vector along the vertical height axis $Z$ of the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame ($R$ is major radius, $\\phi$ is toroidal angle, $Z$ is\
    \ vertical height). This quantity represents the component of the full ion velocity\
    \ vector along $\\hat{Z}$ and is one member of the Cartesian-like decomposition\
    \ of $\\mathbf{v}_i$ along the cylindrical coordinate directions. It is distinct\
    \ from the poloidal or parallel projections commonly used in flux-coordinate analyzes.\n\
    \nThe qualifier 'due to convection' reflects that this velocity enters the convective\
    \ (advective) terms of the ion momentum and energy equations \u2014 the bulk fluid\
    \ motion carrying mass, momentum, and energy. It is not a transport-budget partition\
    \ separating convective from diffusive fluxes; it is the ion bulk fluid velocity\
    \ itself projected onto $\\hat{Z}$.\n\nTypical magnitudes in the edge plasma and\
    \ scrape-off layer range from tens to several hundred m s$^{-1}$, with larger\
    \ values near X-points and divertor targets where poloidal and vertical flows\
    \ are enhanced by recycling and sheath boundary conditions. The $\\hat{Z}$ projection\
    \ is particularly relevant in divertor geometry, where it captures flows directed\
    \ toward or away from divertor strike points.\n\nSign convention: Positive when\
    \ the ion convective flow is directed in the $+\\hat{Z}$ direction (upward, toward\
    \ increasing $Z$)."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:radial_component_of_ion_velocity
  - name:parallel_component_of_particle_convection_velocity
  constraints: []
  sources:
  - id: dd:edge_transport/model/ggd/momentum/v/z
    dd_path: edge_transport/model/ggd/momentum/v/z
    status: composed
