      kind: template
- name: reference_wavelength_of_filter
  kind: scalar
  status: active
  description: Reference wavelength of the passband transmitted by a diagnostic filter
    window. It is the nominal center or designated peak-transmission wavelength of
    the filter-window transmission band.
  documentation: 'The reference wavelength of a filter, $\lambda_\mathrm{ref}$, is
    the nominal center or designated peak-transmission wavelength of the passband
    transmitted by a filter window. It is the wavelength used as the central spectral
    marker of the filter-window transmission criterion and therefore locates the passband
    without specifying its width or edge roll-off.


    For a peak-defined filter reference, the reference wavelength is determined from
    the nominal spectral transmittance by:


    $$

    \lambda_\mathrm{ref} = \operatorname*{arg\,max}_{\lambda} T_\mathrm{nom}(\lambda)

    $$


    where $T_\mathrm{nom}(\lambda)$ is the nominal spectral transmittance as a function
    of wavelength $\lambda$.


    If the passband maximum is flat, multi-peaked, or defined by an edge-based centering
    rule rather than by a unique transmittance maximum, $\lambda_\mathrm{ref}$ is
    the specified scalar reference point of that passband. It is distinct from the
    passband boundaries [lower_wavelength_of_filter](name:lower_wavelength_of_filter)
    and [upper_wavelength_of_filter](name:upper_wavelength_of_filter), and from the
    passband width [width_of_filter](name:width_of_filter); together these quantities
    characterize the passband but do not by themselves define the full spectral response.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:wavelength_of_filter
  - name:lower_wavelength_of_filter
  - name:upper_wavelength_of_filter
  - name:spectral_width_of_filter
  arguments:
  - name: wavelength_of_filter
    operator: reference
    operator_kind: qualifier
  sources:
  - dd_path: camera_ir/channel/camera/frame/filter/wavelength_central
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/camera_ir.html#camera_ir-channel-camera-frame-filter-wavelength_central
