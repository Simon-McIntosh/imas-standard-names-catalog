  documentation: 'The vertical coordinate $Z$ specifies the height of the optical
    pellet diagnostic sensor location in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height measured from the machine midplane. This position descriptor locates the
    optical sensor or its reference point used to observe pellet injection trajectories,
    complementing the full three-component position given by [coordinate_of_optical_pellet_diagnostic_position](name:coordinate_of_optical_pellet_diagnostic_position).
    Typical $Z$ values for in-vessel diagnostic components range from roughly $-2$
    m to $+2$ m depending on device geometry; the optical diagnostic is often placed
    near the pellet injection port or the plasma midplane to maximize line-of-sight
    coverage. The value is obtained from engineering metrology or CAD survey of the
    installed diagnostic assembly. For comparison, the vertical position of the pellet
