name: perpendicular_component_of_tendency_of_fast_ion_pressure
status: draft
description: Time derivative of the fast (non-thermal) ion pressure projected perpendicular
  to the magnetic-field direction.
documentation: "This quantity is $\\partial p_{i,\\mathrm{fast},\\perp}/\\partial\
  \ t$, where $p_{i,\\mathrm{fast},\\perp}$ (Pa) is the perpendicular element of the\
  \ suprathermal ion pressure tensor. For ICRH-heated minority ions the perpendicular\
  \ energy fraction dominates because the resonance preferentially increases $v_{\\\
  perp}$; by contrast, tangential NBI produces mainly parallel fast-ion pressure.\
  \ Pitch-angle scattering at rate $\\nu_{\\perp\\parallel} \\propto n_e / E^{3/2}$\
  \ mediates energy transfer between the two channels, where $n_e$ is the electron\
  \ density and $E$ the fast-ion energy. Transport solvers evolve $p_{\\mathrm{fast},\\\
  perp}$ and $p_{\\mathrm{fast},\\parallel}$ separately to capture MHD effects such\
  \ as fishbones and toroidal Alfv\xE9n eigenmodes that depend on pressure anisotropy\
  \ $\\Delta p = p_{\\perp} - p_{\\parallel}$. Typical values are $10^3$\u2013$10^5$\
  \ Pa s$^{-1}$ depending on heating power. See `parallel_component_of_tendency_of_fast_ion_pressure`\
  \ for the parallel channel."
