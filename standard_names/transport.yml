- name: thermal_ion_power_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Volumetric power density transferred to the thermal ion population
    from fast particles via Coulomb collisions.
  documentation: "This quantity represents the collisional power density $P_{ti}^{C}$\
    \ deposited into the thermal ion population through Coulomb scattering with fast\
    \ (suprathermal) ions or electrons. It is a local, volumetric measure (W/m$^3$)\
    \ of the energy exchange rate between the fast and thermal ion species, governed\
    \ by the Fokker-Planck collision operator. The power transfer is dominated by\
    \ pitch-angle scattering and energy slowing-down processes, and it is a critical\
    \ term in the thermal ion power balance, influencing the ion temperature profile\
    \ in the plasma core. Typical values are on the order of 0.01\u20131 MW/m$^3$\
    \ in the core of NBI-heated tokamak plasmas, increasing with fast particle pressure.\
    \ This quantity complements the related [fast ion power density due to Coulomb\
    \ collisions](name:fast_ion_power_density_due_to_coulomb_collisions) and the [thermal\
    \ electron collisional power density](name:thermal_electron_power_density_due_to_coulomb_collisions)."
  unit: W.m^-3
