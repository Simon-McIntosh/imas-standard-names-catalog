name: toroidal_component_of_magnetic_moment_of_ferritic_element_centroid
description: Toroidal ($\phi$) component of the magnetization dipole-moment density
  $\mathbf{M} \cdot \hat{\phi}$ at the volumetric centroid of a ferritic insert element.
documentation: "The toroidal magnetic moment density $M_\\phi = \\mathbf{M} \\cdot\
  \ \\hat{\\phi}$ (in A m$^{-2}$) quantifies the azimuthal magnetization of a ferritic\
  \ steel element evaluated at its volumetric centroid, where $\\mathbf{M}$ is the\
  \ magnetization vector and $\\hat{\\phi}$ is the geometric toroidal unit vector.\
  \ Ferritic inserts placed symmetrically around the torus are used to reduce the\
  \ toroidal field ripple $\\delta B_\\phi / B_\\phi$ that drives energetic-particle\
  \ losses and localized heat loads; their toroidal magnetization component couples\
  \ most directly to the dominant $1/R$ dependence of the vacuum toroidal field $B_\\\
  phi$. The magnetization is computed self-consistently from the nonlinear $B$\u2013\
  $H$ characteristic of the ferritic steel and the local total field, typically via\
  \ a fixed-point iteration or a coupled finite-element solver; saturation magnetization\
  \ densities for reactor-grade ferritic steels (e.g., F82H, Eurofer-97) reach $\\\
  sim 10^5$\u2013$10^6$ A m$^{-2}$, with the toroidal component dominant in regions\
  \ where $|B_\\phi| \\gg |B_\\theta|$. Together with the radial and vertical siblings,\
  \ this quantity reconstructs the full magnetization vector $\\mathbf{M} = M_R \\\
  hat{R} + M_\\phi \\hat{\\phi} + M_Z \\hat{Z}$. See `toroidal_component_of_magnetic_field_at_ferritic_element_centroid`\
  \ for the driving field at the same location and `vertical_component_of_magnetic_moment_of_ferritic_element_centroid`\
  \ for a sibling component."
kind: vector_component
unit: A.m^-2
