name: maximum_of_derivative_of_electron_number_density_with_respect_to_normalized_poloidal_flux
status: draft
cocos_transformation_type: one_like
description: Peak value of $dn_e/d\psi_N$ across the profile, typically located at
  the steepest point of the H-mode pedestal.
documentation: "The maximum of the electron density gradient $\\max(dn_e/d\\psi_N)$\
  \ identifies the steepest point of the $n_e$ profile in normalized poloidal flux\
  \ space. In H-mode plasmas this peak occurs in the pedestal region near $\\psi_N\
  \ \\approx 0.95$\u2013$0.98$ and is a primary input to peeling\u2013ballooning stability\
  \ codes (e.g., ELITE, MISHKA) that assess the threshold for edge-localized modes.\
  \ Typical peak magnitudes range from $5 \\times 10^{20}$ to $5 \\times 10^{21}\\\
  ;\\mathrm{m^{-3}}$ per unit $\\psi_N$ depending on machine size and fueling. The\
  \ value is usually extracted from the analytic derivative of the mtanh pedestal\
  \ fit (see `mtanh_pedestal_fit_coefficients`). Related quantities include `derivative_of_electron_number_density_with_respect_to_normalized_poloidal_flux`\
  \ and `electron_density_at_pedestal`."
