      - summary/time
    enhanced_context:
      description: "Total plasma toroidal momentum (L\u03C6), summed over all ion\
        \ species and electrons, evaluated at the pedestal top. Captures the net toroidal\
        \ angular momentum at this key boundary transport layer."
      kind: template
- name: toroidal_total_plasma_momentum_at_plasma_boundary
  kind: scalar
  status: active
  description: "Signed total plasma linear momentum along increasing toroidal angle\
    \ in the right-handed (R, \u03C6, Z) frame, integrated within the separatrix and\
    \ summed over electrons and all ion species."
  documentation: 'Total toroidal plasma momentum at the separatrix is the net linear
    momentum carried in the geometric toroidal direction by electrons and all ion
    species within the volume bounded by the separatrix. The separatrix defines the
    outer boundary of the confined-plasma volume; this quantity is not toroidal angular
    momentum.


    The defining volume integral is


    $$

    P_\phi(\mathcal{S}) = \int_{V(\mathcal{S})} \sum_s m_s n_s(\mathbf{r}) v_{\phi,s}(\mathbf{r})\,dV

    $$


    where $\mathcal{S}$ is the separatrix, $V(\mathcal{S})$ is the enclosed plasma
    volume, $m_s$ is the mass of species $s$ in kg, $n_s$ is its number density in
    m$^{-3}$, and $v_{\phi,s}$ is its signed toroidal velocity in the right-handed
    cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height. The summation includes electrons and all ion
    species.


    This boundary-specific quantity complements [toroidal total plasma momentum](name:toroidal_total_plasma_momentum)
    and differs from [toroidal plasma momentum at magnetic axis](name:toroidal_plasma_momentum_at_magnetic_axis)
    by its evaluation locus.


    Sign convention: Positive when the net momentum points in the direction of increasing
    toroidal angle $\phi$.'
  unit: kg.m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_total_plasma_momentum
  - name:toroidal_plasma_momentum_at_magnetic_axis
  sources:
  - dd_path: summary/local/separatrix/momentum_phi/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-momentum_phi-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/separatrix/momentum_phi
      parent: Total plasma toroidal momentum, summed over ion species and electrons
      data_type: FLT_1D
      unit: kg.m.s^-1
      coordinates:
      - summary/time
    enhanced_context:
      description: "Total plasma toroidal momentum (L\u03C6), summed over all ion\
        \ species and electrons, evaluated at the separatrix. Captures the net toroidal\
        \ angular momentum of the plasma at this boundary location."
      kind: template
- name: toroidal_tungsten_velocity_at_pedestal_top
  kind: scalar
  status: active
  description: Density-weighted mean toroidal velocity of tungsten impurity ions at
    the H-mode pedestal top, averaged over all tungsten ion charge states.
  documentation: 'The toroidal tungsten velocity at the H-mode pedestal top is the
    density-weighted mean of the toroidal fluid velocities of tungsten impurity ions
    over their ionization states. It is evaluated at the core-side shoulder of the
    edge transport barrier in the right-handed cylindrical $(R,\phi,Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    The defining charge-state average is


    $$

    V_{\phi,\mathrm{W}} = \frac{\sum_q n_q v_{\phi,q}}{\sum_q n_q}

    $$


    where $V_{\phi,\mathrm{W}}$ is the tungsten toroidal velocity, $n_q$ is the number
    density of tungsten ions in charge state $q$, and $v_{\phi,q}$ is their toroidal
    velocity component.


    The average is density-weighted over tungsten ion charge states, not a sum of
    velocities and not a flux-surface average. It therefore differs from the [toroidal
    flux-surface-averaged tungsten velocity at the plasma boundary](name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary);
    [toroidal carbon velocity at the pedestal top](name:toroidal_carbon_velocity_at_pedestal_top)
    is the analogous species-specific quantity.


    Sign convention: Positive when the tungsten velocity component points in the direction
    of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_flux_surface_averaged_tungsten_velocity_at_plasma_boundary
  - name:toroidal_carbon_velocity_at_pedestal_top
  sources:
  - dd_path: summary/local/pedestal/velocity_phi/tungsten/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-pedestal-velocity_phi-tungsten-value
    dd_documentation:
      leaf: Value
