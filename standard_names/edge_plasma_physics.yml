- name: flux_surface_averaged_electron_temperature_at_plasma_boundary
  kind: scalar
  status: active
  description: Flux-surface-weighted mean of the bulk electron kinetic temperature
    on the last closed magnetic flux surface, with poloidal and toroidal variation
    averaged out.
  documentation: 'This quantity is the flux-surface average of the bulk electron temperature
    on the plasma boundary, represented by the last closed magnetic flux surface.
    It retains the boundary-surface locus while removing variation along that surface.


    $$

    \langle T_e\rangle_{\psi_b} = \frac{\displaystyle\oint_{\psi=\psi_b} T_e\,\frac{dS}{|\nabla\psi|}}{\displaystyle\oint_{\psi=\psi_b}
    \frac{dS}{|\nabla\psi|}}

    $$


    Here, $T_e$ is the local electron temperature, $\psi$ is the magnetic-flux surface
    label, $\psi_b$ is its value at the plasma boundary, $dS$ is the surface-area
    element, and $|\nabla\psi|$ is the magnitude of the flux-label gradient. This
    averaged quantity is distinct from the pointwise boundary value [electron_temperature_at_plasma_boundary](name:electron_temperature_at_plasma_boundary)
    and from the volume average [volume_averaged_electron_temperature](name:volume_averaged_electron_temperature).'
  unit: eV
  physics_domain: edge_plasma_physics
  links:
  - name:electron_temperature_at_plasma_boundary
  - name:volume_averaged_electron_temperature
  arguments:
  - name: electron_temperature_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
