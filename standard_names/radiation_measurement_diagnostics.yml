    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/charge_exchange.html#charge_exchange-channel-spectrum-instrument_function
    dd_documentation:
      leaf: Array of Gaussian widths and amplitudes which as a sum make up the instrument
        fuction. IF(lambda) = sum( instrument_function(1,i)/sqrt(2 * pi * instrument_function(2,i)^2  )
        * exp( -lambda^2/(2 * instrument_function(2,i)^2) )  ),whereby sum( instrument_function(1,i)
        ) = 1
      parent_path: charge_exchange/channel/spectrum
      parent: Set of spectra obtained by various gratings
      data_type: FLT_2D
      unit: m
      coordinates:
      - 1...N
      - 1...2
    enhanced_context:
