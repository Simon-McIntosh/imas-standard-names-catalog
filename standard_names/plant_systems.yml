      unit: '1'
      coordinates:
      - balance_of_plant/time
    enhanced_context:
      description: Plant electricity gain (Q_plant), defined as the ratio of net electric
        power output to the total plant electrical consumption during operation. A
        key reactor-level performance metric for fusion power plant feasibility assessments.
      kind: llm
- name: nitrogen_count
  kind: scalar
  status: active
  description: Count of nitrogen particles expressed as a dimensionless equivalent-electron
    inventory, where each nitrogen atom contributes 7 equivalent electrons equal to
    its atomic number Z = 7.
  documentation: 'The nitrogen count quantifies the nitrogen particle inventory by
    converting the atom count to an equivalent-electron basis using the atomic number
    $Z_\mathrm{N} = 7$ of nitrogen.


    $$

    N_\mathrm{eq} = Z_\mathrm{N} \cdot N_\mathrm{N}

    $$


    where $N_\mathrm{N}$ is the number of nitrogen atoms and $Z_\mathrm{N} = 7$. This
    equivalent-electron convention, shared across gas-injection inventory quantities
    such as [argon_count](name:argon_count), enables consistent comparison of particle
    inventories across species with different atomic numbers. The [accumulated_nitrogen_count](name:accumulated_nitrogen_count)
    is the time-integrated form of this quantity, tracking cumulative nitrogen introduced
    since plasma breakdown.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:argon_count
  - name:accumulated_nitrogen_count
- name: accumulated_nitrogen_count
  kind: scalar
  status: active
  description: Cumulative nitrogen delivered by gas injection after plasma breakdown,
    expressed as an equivalent-electron inventory with seven counts per nitrogen atom.
  documentation: 'This quantity is the cumulative equivalent-electron inventory of
    nitrogen atoms delivered by gas injection after plasma breakdown. It is the gas-injection
    contribution to the [nitrogen count](name:nitrogen_count), not the actual free-electron
    inventory or a charge-state-resolved particle count.


    The equivalent-electron count is defined by:


    $$

    N_{\mathrm{N,eq}}^{\mathrm{gas}}(t)=7\,N_{\mathrm{N}}^{\mathrm{gas}}(t)

    $$


    where $N_{\mathrm{N}}^{\mathrm{gas}}(t)$ is the cumulative number of nitrogen
    atoms delivered by gas injection from plasma breakdown to time $t$, and the dimensionless
    factor 7 is nitrogen''s atomic number. The quantity includes only nitrogen attributed
    to post-breakdown gas injection; it excludes nitrogen introduced by other delivery
    channels and does not represent the instantaneous ionization-state population.'
  unit: '1'
  physics_domain: plant_systems
  links:
  - name:nitrogen_count
  arguments:
  - name: nitrogen_count
    operator: accumulated
    operator_kind: qualifier
  sources:
  - dd_path: summary/gas_injection_accumulated/nitrogen/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_accumulated-nitrogen-value
    dd_documentation:
      leaf: Value
