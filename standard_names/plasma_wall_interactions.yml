- name: nitrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of ionized nitrogen in the boundary plasma immediately
    adjacent to a limiter. It represents the local nitrogen impurity ion population,
    normally summed over ion charge states.
  documentation: 'Ionized nitrogen density at a limiter is the local number of nitrogen
    impurity ions per unit volume in the boundary plasma immediately adjacent to a
    limiter surface. Unless a charge-state-specific quantity is named, it denotes
    the sum over all ionized nitrogen charge states $N^{q+}$ with $q=1,\ldots,7$ and
    excludes neutral nitrogen atoms or molecules.


    The charge-state-summed density is the zeroth velocity-space moment of the nitrogen
    ion distribution functions:


    $$

    n_N^{\mathrm{ion}} = \sum_{q=1}^{7} n_{N^{q+}} = \sum_{q=1}^{7} \int f_{N^{q+}}(\mathbf{v})
    \, d^3v

    $$


    where $n_N^{\mathrm{ion}}$ is the total ionized nitrogen number density in m^-3,
    $n_{N^{q+}}$ is the number density of charge state $q$ in m^-3, $f_{N^{q+}}(\mathbf{v})$
    is the velocity-space distribution function with units s^3 m^-6, and $d^3v$ is
    the velocity-space volume element with units m^3 s^-3.


    In experiments, this quantity is typically inferred from impurity spectroscopy
    together with atomic data, local electron density and temperature constraints,
    and edge plasma modeling. In simulations or reconstructions that resolve nitrogen
    charge states, the limiter value is obtained by summing the local ionized charge-state
    densities adjacent to the limiter; neutral nitrogen is treated separately.


    Typical summed ionized nitrogen densities near limiters are about $10^{14}$-$10^{17}$
    m^-3 for trace or weakly seeded nitrogen and can reach $10^{17}$-$10^{19}$ m^-3
    during strong nitrogen seeding or local nitrogen release. The value depends on
    the limiter source rate, ionization balance, recombination, and transport along
    the boundary plasma.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:nitrogen_density_at_pedestal
  - name:nitrogen_density_at_plasma_boundary
  - name:nitrogen_density_at_magnetic_axis
  - name:argon_density_at_limiter
  - name:neon_density_at_limiter
  - name:density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/nitrogen/value
    dd_path: summary/local/limiter/n_i/nitrogen/value
    status: composed
- name: oxygen_density_at_limiter
  kind: scalar
  status: draft
  description: Charge-state-summed number density of ionized oxygen impurity immediately
    adjacent to a limiter surface at the plasma-wall interface.
  documentation: 'Oxygen density at a limiter is the local number density of ionized
    oxygen impurity in the plasma immediately adjacent to the limiter surface. It
    is species-specific and charge-state-summed, so it represents oxygen ions only,
    not neutral oxygen or electrons.


    For oxygen ion charge states from singly ionized to fully stripped, the charge-state-summed
    limiter density is defined as:


    $$

    n_{\mathrm{O,lim}} = \sum_{q=1}^{8} n_{\mathrm{O}^{q+},\mathrm{lim}}

    $$


    where $n_{\mathrm{O,lim}}$ and each charge-state density $n_{\mathrm{O}^{q+},\mathrm{lim}}$
    are number densities in m^-3, $q$ is the dimensionless ion charge state, and the
    upper limit 8 is the nuclear charge of oxygen. The neutral state $q=0$ is excluded.


    In practice, this quantity is estimated from oxygen spectral line emission together
    with collisional-radiative or ionization-balance modeling, or from edge plasma
    and impurity-transport calculations constrained by local plasma conditions and
    wall-interaction source terms. It is the limiter-local counterpart of [oxygen_density_at_plasma_boundary](name:oxygen_density_at_plasma_boundary)
    and is interpreted alongside limiter plasma quantities such as [electron_density_at_limiter](name:electron_density_at_limiter).


    Typical limiter-adjacent oxygen ion densities are strongly device- and scenario-dependent
    and are usually trace impurity values relative to the local electron density.
    Representative order-of-magnitude values can range from 10^14-10^18 m^-3 in clean
    or moderately conditioned edge plasmas, with larger transient values possible
    during enhanced oxygen influx or strong plasma-wall interaction.'
  unit: m^-3
  physics_domain: plasma_wall_interactions
  links:
  - name:density_at_limiter
  - name:neon_density_at_limiter
  - name:nitrogen_density_at_limiter
  - name:carbon_density_at_limiter
  - name:xenon_density_at_limiter
  sources:
  - id: dd:summary/local/limiter/n_i/oxygen/value
    dd_path: summary/local/limiter/n_i/oxygen/value
    status: composed
- name: peak_power_density_at_first_wall
  kind: scalar
  status: draft
  description: Spatial maximum of the incident heat flux density deposited on first-wall
    plasma-facing surfaces.
  documentation: 'Peak power density at the first wall is the largest local incident
    thermal power per unit area deposited on first-wall plasma-facing surfaces. It
    is the first-wall-specific form of a wall peak-load metric, distinct from peaks
    evaluated over all wall elements, limiter surfaces, or divertor targets.


    For a first-wall surface $S_\mathrm{FW}$, it is defined as the maximum positive
    projection of the local power-flow vector onto the surface normal pointing from
    the plasma-facing surface into the solid wall:


    $$

    q_{\mathrm{FW}}^{\mathrm{peak}} = \max_{\mathbf{x} \in S_\mathrm{FW}} \max\left(0,
    \boldsymbol{q}(\mathbf{x}) \cdot \hat{\boldsymbol{n}}_w(\mathbf{x})\right)

    $$


    where $q_{\mathrm{FW}}^{\mathrm{peak}}$ is the peak first-wall power density in
    W m^-2, $\boldsymbol{q}(\mathbf{x})$ is the local energy flux density vector in
    W m^-2, and $\hat{\boldsymbol{n}}_w(\mathbf{x})$ is a dimensionless unit normal
    directed into the wall material at surface location $\mathbf{x}$. The inner maximum
    retains only incident heating and excludes outward or cooling fluxes.


    In practice, this quantity is obtained from infrared thermography and inverse
    heat-conduction analysis, embedded thermocouples, calorimetric measurements, or
    modeled combinations of plasma particle bombardment, charge-exchange neutral loading,
    and radiative heat deposition. Surface geometry, material properties, viewing
    factors, and time response are important when converting measured temperature
    or radiation signals into local incident heat flux.


    Representative steady or quasi-steady first-wall peak loads are typically about
    0.1-5 MW m^-2, depending on device size, plasma scenario, wall material, and active
    cooling. Short transients such as edge-localized modes, runaway-electron impacts,
    or disruptions can produce substantially larger instantaneous local peaks over
    shorter durations. Related quantities include [power_density_at_wall](name:power_density_at_wall)
    for a local wall heat-flux density, [peak_power_density_at_wall](name:peak_power_density_at_wall)
    for the maximum over wall surfaces more generally, [peak_power_density_at_limiter](name:peak_power_density_at_limiter)
    for limiter elements, and [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target)
    for divertor target plates.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density
  - name:energy_flux_at_wall
  sources:
  - id: dd:wall/first_wall_power_flux_peak
    dd_path: wall/first_wall_power_flux_peak
    status: composed
- name: peak_power_density_at_limiter
  kind: scalar
  status: draft
  description: Spatial maximum of the heat flux per unit surface area deposited by
    scrape-off-layer plasma on the limiter surface.
  documentation: 'Peak power density at a limiter is the spatial maximum of the local
    heat flux density deposited on the wetted limiter surface by scrape-off-layer
    plasma. It is the limiting local thermal load for limiter plasma-facing material,
    distinct from total limiter power because it depends on how narrowly the heat
    is distributed over the contact area.


    The peak limiter heat-flux density is defined as the maximum of the local deposited
    normal heat flux over the wetted limiter surface:


    $$

    q_{\mathrm{peak,lim}} = \max_{\mathbf{x} \in A_{\mathrm{lim}}} q_\perp(\mathbf{x})

    $$


    where $q_{\mathrm{peak,lim}}$ and $q_\perp$ have units W m^-2, $\mathbf{x}$ is
    a point on the limiter surface, and $A_{\mathrm{lim}}$ is the wetted limiter surface
    area in m^2. For attached scrape-off-layer transport, the geometric projection
    is often approximated by $q_\perp \approx q_\parallel \sin\alpha$, where $q_\parallel$
    is the parallel heat flux in W m^-2 and $\alpha$ is the dimensionless grazing
    angle between the magnetic field line and the surface; sheath heat-transmission
    factors, particle recycling, radiation, and surface incidence effects can modify
    this simple projection.


    In practice this quantity is inferred from infrared thermography, calorimetry,
    embedded temperature sensors, or probes, often combined with surface thermal modeling
    and magnetic field-line tracing to identify the wetted region. Equilibrium geometry
    and limiter alignment are important because small changes in strike location or
    grazing angle can strongly change the local maximum.


    Typical steady attached limiter loads in medium-size tokamaks are about 1-10 MW
    m^-2, with lower values in low-power or strongly radiating plasmas and substantially
    higher short-lived peaks possible during transients or localized contact events.'
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_divertor_target
  - name:peak_power_density_at_first_wall
  sources:
  - id: dd:summary/local/limiter/power_flux_peak/value
    dd_path: summary/local/limiter/power_flux_peak/value
    status: composed
- name: power_density_at_wall
  kind: scalar
  status: draft
  description: Power flux density deposited on plasma-facing wall surfaces by all
    incident particle and radiation channels from the boundary plasma.
  documentation: "Power density at the wall quantifies the total thermal energy load\
    \ per unit surface area delivered to plasma-facing components, aggregating contributions\
    \ from charged particle impact, neutral atom bombardment, charge-exchange flux,\
    \ and photon irradiation. It provides a spatially distributed measure of wall\
    \ heating across the full plasma-facing geometry, in contrast to extremal statistics\
    \ such as [peak_power_density_at_first_wall](name:peak_power_density_at_first_wall)\
    \ or [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\n\
    \nThe local wall power density $q_w$ sums over all incident energy channels:\n\
    \n$$\nq_w = \\sum_s \\Gamma_s \\, E_s + q_{\\mathrm{rad}}\n$$\n\nwhere $\\Gamma_s$\
    \ is the incident particle flux density of species $s$, $E_s$ is the mean energy\
    \ deposited per particle, and $q_{\\mathrm{rad}}$ is the radiative contribution\
    \ represented by [energy_flux_at_wall_due_to_radiation](name:energy_flux_at_wall_due_to_radiation).\n\
    \nSpatially resolved wall heat loads are measured via calibrated infrared thermography\
    \ or derived from boundary plasma transport simulations validated against bolometric\
    \ total-power measurements. The [electron_energy_flux_at_wall](name:electron_energy_flux_at_wall)\
    \ and ion contributions can be tracked separately as components of this total.\n\
    \nTypical steady-state values range from 0.1\u20131 MW/m\xB2 on the main first\
    \ wall to 5\u201320 MW/m\xB2 at actively loaded divertor strike zones; transient\
    \ power loads during edge-localized modes can transiently exceed these by an order\
    \ of magnitude."
  unit: W.m^-2
  physics_domain: plasma_wall_interactions
  links:
  - name:peak_power_density_at_first_wall
  - name:peak_power_density_at_divertor_target
  - name:energy_flux_at_wall_due_to_radiation
  - name:electron_energy_flux_at_wall
  sources:
  - id: dd:wall/description_ggd/ggd/power_density/values
    dd_path: wall/description_ggd/ggd/power_density/values
    status: composed
- name: radiated_power_at_wall
  kind: scalar
  status: draft
  description: Net photon power deposited on plasma-facing first-wall surfaces by
    radiation emitted from the plasma. It is the surface-integrated incident radiative
    power intercepted by the wall minus the power carried away by reflected photons.
  documentation: 'Radiated power at the wall is the net radiative heating power delivered
    to plasma-facing first-wall surfaces by photons originating in the plasma. It
    is the radiation-only contribution to the wall heat-load budget, distinct from
    conductive, convective, neutral-particle, and charge-exchange energy channels,
    and it complements the total wall load described by thermal_power_at_wall.


    The net deposited radiative power is defined by the incident photon power on the
    wall minus the reflected photon power:


    $$

    P_\mathrm{rad,wall} = P_\mathrm{inc} - P_\mathrm{ref} = (1 - \mathcal{R}_\mathrm{eff})
    P_\mathrm{inc}

    $$


    where $P_\mathrm{inc}$ is the photon power incident on all relevant first-wall
    surfaces, $P_\mathrm{ref}$ is the photon power reflected from those surfaces,
    and $\mathcal{R}_\mathrm{eff}$ is an effective wall reflectivity averaged over
    surface material, spectrum, angle of incidence, and illuminated area.


    This quantity is usually estimated from bolometric measurements of plasma radiation
    combined with geometric view-factor or ray-tracing calculations that determine
    how much photon power reaches the first wall. It may also be inferred from infrared
    thermography or surface calorimetry when the radiative component can be separated
    from other heat-load channels. It is related to [radiated_power_at_inside_flux_surface](name:total_plasma_radiated_power),
    but represents only the photon power that escapes the plasma region and is absorbed
    at the wall; the analogous divertor-target radiation load is [power_at_divertor_target_due_to_radiation](name:power_at_divertor_target_due_to_radiation).


    Typical values range from $10^3$-$10^5$ W in small experiments to $10^6$-$10^8$
    W in large tokamaks during high-density, impurity-seeded, or detached-plasma operation.
    The value increases with total plasma radiation, wall view factor, and wall absorptivity,
    and decreases when a larger fraction of photons is intercepted by divertor targets
    or reflected by plasma-facing materials.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:total_plasma_radiated_power
  - name:power_at_divertor_target_due_to_radiation
  sources:
  - id: dd:wall/global_quantities/power_radiated
    dd_path: wall/global_quantities/power_radiated
    status: composed
- name: surface_emissivity
  kind: scalar
  status: draft
  description: 'Surface emissivity is the dimensionless effective thermal emissivity
    of a plasma-facing surface: the ratio of its emitted thermal radiance or radiative
    exitance to that of a blackbody at the same surface temperature. As a scalar,
    it represents the stated spectral band and angular averaging rather than a wavelength-
    and direction-resolved emissivity.'
  documentation: 'Surface emissivity is a dimensionless measure of how efficiently
    a real surface emits thermal radiation compared with a blackbody at the same surface
    temperature. For a scalar value, it is an effective emissivity averaged over the
    relevant wavelength band and angular domain, not the full spectral, directional,
    or polarization-dependent emissivity function.


    The effective value can be defined as a weighted ratio of emitted spectral radiance
    to blackbody spectral radiance:


    $$

    \epsilon_\mathrm{eff}(T_s) = \frac{\int_{\lambda}\int_{\Omega} W(\lambda,\Omega)\,L_\lambda^\mathrm{surf}(T_s,\Omega)\,d\Omega\,d\lambda}{\int_{\lambda}\int_{\Omega}
    W(\lambda,\Omega)\,L_\lambda^\mathrm{bb}(T_s)\,d\Omega\,d\lambda}

    $$


    where $T_s$ is the surface temperature, $L_\lambda^\mathrm{surf}$ is the emitted
    spectral radiance of the real surface, $L_\lambda^\mathrm{bb}$ is the blackbody
    spectral radiance at the same temperature, $\Omega$ is the selected angular domain,
    and $W(\lambda,\Omega)$ specifies the spectral response and angular weighting.
    For a broadband hemispherical thermal model, the angular domain is the outward
    hemisphere and the associated emitted heat-flux density is $q_\mathrm{rad}=\epsilon_\mathrm{eff}\sigma
    T_s^4$; total radiated power is obtained by integrating that flux density over
    surface area.


    In practice, surface emissivity is obtained from material data, laboratory calibration,
    in-situ calibration, or fitting of thermal-radiation measurements together with
    an independent temperature estimate. It is strongly affected by material composition,
    roughness, oxidation, deposited layers, erosion, temperature, wavelength band,
    and viewing angle, so the averaging convention should match the radiation model
    or infrared measurement being interpreted.


    Typical values range from 0.02-0.2 for clean polished metals, 0.3-0.9 for oxidized
    or rough metals, 0.7-0.95 for graphite and many carbon-rich surfaces, and about
    0.1-0.6 for tungsten plasma-facing components depending on wavelength and surface
    condition. For an opaque passive surface the physical range is normally $0 \le
    \epsilon_\mathrm{eff} \le 1$; apparent values outside this range usually indicate
    calibration, reflection, background-subtraction, or model-assumption errors.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:maximum_surface_temperature
  sources:
  - id: dd:camera_ir/channel/camera/frame/region_of_interest/emissivity
    dd_path: camera_ir/channel/camera/frame/region_of_interest/emissivity
    status: composed
- name: surface_temperature
  kind: scalar
  status: draft
  description: Thermodynamic temperature of the exposed material surface of a plasma-facing
    component at a specified surface location and time. It is a local surface state
    variable, distinct from a surface average or a maximum over an area.
  documentation: 'Surface temperature is the thermodynamic temperature of the outermost
    exposed material surface at a specified location and time. It is a local material
    property of a plasma-facing component; surface averages, area-integrated quantities,
    and peak values are different quantities and should not be inferred from this
    name alone.


    The temperature controls thermal emission from the surface. For an opaque gray
    surface, the hemispherical radiant exitance may be approximated by the Stefan-Boltzmann
    relation:


    $$

    M = \varepsilon \sigma T_s^4

    $$


    where $M$ is the emitted radiant power per unit surface area, $\varepsilon$ is
    the surface emissivity, $\sigma$ is the Stefan-Boltzmann constant, and $T_s$ is
    the surface temperature.


    In practice, surface temperature may be obtained from infrared thermography, pyrometry,
    embedded temperature sensors, thermocouples, or heat-transfer modeling. Thermal-emission
    methods require knowledge of emissivity, optical transmission, viewing geometry,
    reflected radiation, and calibration. The referenced location is the material
    point on the exposed surface, which may be parameterized by surface coordinates
    or by its position in the right-handed cylindrical $(R, \phi, Z)$ frame, where
    $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.


    Typical values are 290-320 K for components near room temperature before operation,
    500-1500 K for heated first-wall or divertor surfaces during plasma exposure,
    and 1500-3000 K for localized hot spots or transient heat loads. Values approaching
    material limits, such as about 3683 K for tungsten melting, are critical for component
    lifetime and machine protection.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_emissivity
  - name:maximum_surface_temperature
  sources:
  - id: dd:camera_ir/channel/camera/frame/apparent_temperature
    dd_path: camera_ir/channel/camera/frame/apparent_temperature
    status: composed
  - id: dd:camera_ir/frame/surface_temperature
    dd_path: camera_ir/frame/surface_temperature
    status: composed
- name: maximum_surface_temperature
  kind: scalar
  status: draft
  description: Highest apparent surface temperature among the valid points in a defined
    infrared camera region of interest. It is a temperature maximum, not a heat flux
    or power-density measure.
  documentation: 'Maximum surface temperature is the largest apparent temperature
    assigned to an observed plasma-facing surface within a defined region of interest
    at a given observation time. The word apparent indicates the radiance-derived
    temperature after the assumed emissivity, optical transmission, calibration, and
    background corrections have been applied; it may differ from the true thermodynamic
    surface temperature if those assumptions are inaccurate. This quantity identifies
    the hottest inferred point in the region, but it does not by itself quantify deposited
    heat flux.


    For a region of interest $\Omega_\mathrm{ROI}$, the maximum is defined as the
    maximum over all valid temperature samples in that region:


    $$

    T_\mathrm{max} = \max_{p \in \Omega_\mathrm{ROI}} T_\mathrm{app}(p)

    $$


    where $T_\mathrm{max}$ and $T_\mathrm{app}(p)$ are temperatures in kelvin, $p$
    labels a valid surface sample or camera pixel associated with the region of interest,
    and $\Omega_\mathrm{ROI}$ is the selected set of samples. Invalid, masked, saturated,
    or uncalibrated samples are excluded before taking the maximum; the result is
    a pointwise maximum, not an average, percentile, or time maximum unless an additional
    processing definition states otherwise.


    In practice, infrared thermography infers $T_\mathrm{app}$ from measured thermal
    radiance using camera calibration, spectral response, surface emissivity, optical
    transmission, and reflected-background corrections. A common calibration model
    is based on Planck spectral radiance, with $L_\lambda(T) = \epsilon(\lambda,T)\,2hc^2/\lambda^5[\exp(hc/(\lambda
    k_B T))-1]^{-1}$ integrated over the camera bandpass, where $L_\lambda$ is spectral
    radiance in W m^-3 sr^-1, $\epsilon$ is dimensionless emissivity, $\lambda$ is
    wavelength in meters, $h$ is Planck''s constant in J s, $c$ is the speed of light
    in m s^-1, $k_B$ is Boltzmann''s constant in J K^-1, and $T$ is temperature in
    kelvin.


    Typical values are about 290-350 K for surfaces near room temperature before plasma
    exposure, several hundred to 1500 K during moderate heating, and above 2000 K
    for localized hot spots in high-power operation. Allowable maxima depend strongly
    on surface material, coatings, pulse duration, and machine-protection limits.


    This quantity should be distinguished from heat-flux or power-density quantities
    such as peak power density at a divertor target or limiter. Temperature is the
    surface thermal state, whereas heat flux depends on deposited power, material
    thermal properties, geometry, cooling, and the time history of the exposure.'
  unit: K
  physics_domain: plasma_wall_interactions
  links:
  - name:surface_temperature
  - name:surface_emissivity
  arguments:
  - name: surface_temperature
    operator: maximum
    operator_kind: qualifier
  sources:
  - id: dd:camera_ir/channel/camera/frame/region_of_interest/temperature_max
    dd_path: camera_ir/channel/camera/frame/region_of_interest/temperature_max
    status: composed
- name: toroidal_current_of_vacuum_vessel
  kind: scalar
  status: draft
  description: Net electric current flowing toroidally in the conducting vacuum vessel,
    produced by induction from time-varying magnetic flux linked with the vessel.
    The toroidal direction is that of the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'Toroidal vacuum-vessel current is the net electric current carried
    by the conducting vessel in the toroidal direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame. It is an algebraic scalar: signed contributions from vessel
    sectors or passive conducting branches are summed to give the total vessel current,
    rather than describing only one local branch.


    The scalar total is defined as the signed sum of toroidal currents carried by
    the vessel conductors:


    $$

    I_{\mathrm{vv},\phi} = \sum_{k \in \mathrm{vessel}} I_{\phi,k}

    $$


    where $I_{\mathrm{vv},\phi}$ is the total toroidal vacuum-vessel current in A,
    and $I_{\phi,k}$ is the signed toroidal current in A carried by conducting vessel
    sector or passive branch $k$.


    This current is induced when magnetic flux linked by closed conducting paths in
    the vessel changes, for example because of changing plasma current or external-coil
    currents. In practice it is estimated from electromagnetic models of passive conductors
    constrained by magnetic measurements, flux-loop signals, coil-current histories,
    and vessel electrical properties; it is closely related to the current in a passive
    conducting loop.


    Typical absolute values are highly device and transient dependent. Net toroidal
    vessel currents of $10^3$-$10^6$ A are common in medium and large tokamaks during
    appreciable magnetic-flux changes, while smaller devices or slow current ramps
    may produce values below $10^3$ A.


    Sign convention: Positive when the vessel current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame (counter-clockwise
    when viewed from above $+\hat{Z}$).'
  unit: A
  physics_domain: plasma_wall_interactions
  links:
  - name:resistance_of_vacuum_vessel
  - name:toroidal_plasma_current
  - name:toroidal_current_of_cryostat
  sources:
  - id: dd:wall/description_2d/vessel/unit/element/j_phi
    dd_path: wall/description_2d/vessel/unit/element/j_phi
    status: composed
  - id: dd:wall/description_2d/vessel/unit/element/j_tor
    dd_path: wall/description_2d/vessel/unit/element/j_tor
    status: attached
  - id: dd:wall/global_quantities/current_phi
    dd_path: wall/global_quantities/current_phi
    status: attached
  - id: dd:wall/global_quantities/current_tor
    dd_path: wall/global_quantities/current_tor
    status: attached
- name: vertical_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Vertical Z coordinate of the divertor target surface center in the
    right-handed cylindrical (R, phi, Z) frame, where Z is vertical height.
  documentation: 'The vertical coordinate of the divertor target is the $Z$ component
    of the geometric center of the target surface in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. It locates the hardware surface as a geometric reference
    and is distinct from the vertical position of a plasma strike point on that surface.


    For a finite divertor target surface $S_t$, the surface-center coordinate is the
    area centroid of that surface:


    $$

    Z_t = \frac{1}{A_t}\int_{S_t} Z(\mathbf{x})\,dA, \qquad A_t = \int_{S_t} dA

    $$


    where $Z_t$ is the target-center vertical coordinate, $A_t$ is the target-surface
    area, $dA$ is the surface area element, and $Z(\mathbf{x})$ is the vertical height
    of point $\mathbf{x}$ on the target surface.


    In practice this coordinate is computed from the defined target geometry, for
    example from an engineering surface model, metrology description, or calibrated
    diagnostic geometry. For a mesh representation, the integral is evaluated as an
    area-weighted average of the mesh-element center $Z$ coordinates. The corresponding
    horizontal or transverse coordinates are described by [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [y_coordinate_of_divertor_target](name:y_coordinate_of_divertor_target), while
    inner and outer strike-location quantities refer to different physical points
    on the divertor.


    Typical values are machine-size and vertical-origin dependent. In lower-single-null
    tokamaks the target surface center commonly has $Z<0$, often about 0.5-3 m below
    the magnetic-axis or midplane region in medium to large devices; upper-divertor
    targets have comparable positive values, and compact devices can have magnitudes
    of about 0.1-1 m.


    Sign convention: Positive when the divertor target surface center lies in the
    $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:y_coordinate_of_divertor_target
  - name:vertical_coordinate_of_inner_divertor_target
  - name:vertical_coordinate_of_outer_divertor_target
  sources:
  - id: dd:camera_ir/channel/target_surface_center/z
    dd_path: camera_ir/channel/target_surface_center/z
    status: composed
- name: vertical_coordinate_of_optical_element
  kind: scalar
  status: draft
  description: Vertical Z-coordinate, in meters, of the center of an optical element
    in the right-handed cylindrical (R, phi, Z) frame, measured upward from the machine
    midplane.
  documentation: 'The vertical coordinate of an optical element is the height of the
    element''s center along the $Z$ axis of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical
    height. It specifies the element position relative to the machine midplane and
    is independent of the element orientation, aperture size, or viewing direction.


    For an optical-element center position $\mathbf{x}_c$, the vertical coordinate
    is the projection of its displacement from the midplane reference onto the vertical
    basis direction:


    $$

    Z_c = (\mathbf{x}_c - \mathbf{x}_0) \cdot \hat{Z}

    $$


    where $\mathbf{x}_0$ is a reference point on the machine midplane, $\hat{Z}$ is
    the upward vertical unit vector, and $Z_c$ is reported in meters.


    This coordinate is usually obtained from mechanical survey, metrology, or geometry
    models of the diagnostic hardware. For finite optical components such as lenses,
    mirrors, fibers, or apertures, the center should be the defined geometric or optical
    center used consistently with the corresponding radial and toroidal coordinates.


    Typical signed values for optical elements near the vessel or diagnostic ports
    are about $-5$ m to $5$ m in medium-sized tokamaks, with larger devices extending
    to roughly $\pm 10$ m. Values near $0$ m indicate placement close to the machine
    midplane.


    Sign convention: Positive when the optical-element center lies in the $+Z$ direction,
    upward from the machine midplane.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:vertical_coordinate_of_diagnostic_aperture
  - name:vertical_coordinate_of_measurement_position
  sources:
  - id: dd:camera_ir/fibre_bundle/geometry/centre/z
    dd_path: camera_ir/fibre_bundle/geometry/centre/z
    status: composed
- name: y_coordinate_of_divertor_target
  kind: scalar
  status: draft
  description: Cartesian Y coordinate of the divertor target surface center in the
    right-handed (x, y, z) frame.
  documentation: 'The Y coordinate locates the center of the divertor target surface
    along the $\hat{y}$ axis of the right-handed Cartesian $(x, y, z)$ frame, where
    $\hat{z} = \hat{Z}$ is vertical and $\hat{x}$ is aligned with $\phi = 0$, with
    the toroidal angle $\phi$ increasing counter-clockwise when viewed from above
    $+\hat{Z}$. This coordinate relates to the cylindrical $(R, \phi, Z)$ description
    of the same point by the standard transformation $y = R\sin\phi$, where $R$ is
    the major radius from the toroidal symmetry axis and $\phi$ is the toroidal angle.


    This coordinate is used alongside [x_coordinate_of_divertor_target](name:x_coordinate_of_divertor_target)
    and [vertical_coordinate_of_divertor_target](name:vertical_coordinate_of_divertor_target)
    to fully specify the three-dimensional Cartesian position of the divertor target
    center in plasma-wall interaction modeling. It is obtained from engineering drawings
    of the divertor geometry or from geometric calibration of diagnostics such as
    infrared cameras that image the target surface.


    The magnitude of $y$ is bounded by the major radius of the machine; for a target
    segment at toroidal angle $\phi$ and radial distance $R$ from the symmetry axis,
    $|y|$ spans zero to approximately $R$ depending on the toroidal location of the
    target.


    Sign convention: Positive when the divertor target center is displaced in the
    $+\hat{y}$ direction of the right-handed Cartesian $(x, y, z)$ frame.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:x_coordinate_of_divertor_target
  - name:vertical_coordinate_of_divertor_target
  sources:
  - id: dd:camera_ir/channel/target_surface_center/y
    dd_path: camera_ir/channel/target_surface_center/y
    status: composed
- name: power_at_wall_due_to_conduction
  kind: scalar
  status: draft
  description: Conductive component of plasma power deposited on first-wall and divertor
    material surfaces. It represents heat carried by thermal conduction and excludes
    convected, radiated, recombination, and neutral-particle power channels.
  documentation: 'Power at wall due to conduction is the component of the wall-deposited
    plasma energy flux carried by thermal conduction, primarily electron heat conduction
    along magnetic field lines in the scrape-off-layer and divertor plasma. It is
    distinct from particle enthalpy convection, radiation, recombination energy, and
    neutral-particle energy deposition.


    The scalar power is defined by integrating the deposited conductive heat-flux
    density over the plasma-facing material surface:


    $$

    P_{\mathrm{wall,cond}} = \int_{A_{\mathrm{wall}}} q_{n,\mathrm{cond}}^{\mathrm{dep}}
    \, dA

    $$


    where $P_{\mathrm{wall,cond}}$ is the conducted wall power, $A_{\mathrm{wall}}$
    is the wetted first-wall and divertor material surface, $dA$ is a surface element
    in $\mathrm{m^2}$, and $q_{n,\mathrm{cond}}^{\mathrm{dep}}$ is the local conductive
    heat-flux density into the material in $\mathrm{W\,m^{-2}}$. The upstream parallel
    conductive heat flux is often modeled as $q_{\parallel,\mathrm{cond}} = -\kappa_\parallel
    \nabla_\parallel T_e$, where $q_{\parallel,\mathrm{cond}}$ is in $\mathrm{W\,m^{-2}}$,
    $\kappa_\parallel$ is in $\mathrm{W\,m^{-1}\,eV^{-1}}$ when $T_e$ is expressed
    in eV, and $\nabla_\parallel T_e$ is in $\mathrm{eV\,m^{-1}}$. Mapping this upstream
    flux to $q_{n,\mathrm{cond}}^{\mathrm{dep}}$ includes magnetic incidence on the
    surface and may include a sheath heat-transmission factor, so the deposited conductive
    power is not simply the bare upstream parallel flux integrated over geometric
    wall area.


    In practice this quantity is inferred from wall heat-flux measurements and edge-plasma
    modeling. Infrared thermography, calorimetry, embedded temperature sensors, Langmuir
    probes, and edge Thomson scattering can constrain the deposited heat flux, electron
    temperature gradients, and the partition between conductive and convective channels.
    Together with [power_at_wall_due_to_convection](name:power_at_wall_due_to_convection),
    this quantity forms the main kinetic thermal contribution to plasma_power_at_wall;
    it is also part of thermal_power_at_wall and the divertor-local thermal load described
    by [thermal_power_of_divertor](name:thermal_power_of_divertor).


    Typical magnitudes range from $10^5-10^7$ W in medium-size tokamak plasmas, can
    fall near zero in strongly detached or highly radiative conditions, and can reach
    $10^7-10^8$ W or more in high-power devices if a large fraction of scrape-off-layer
    power reaches material surfaces conductively.


    Sign convention: Positive when conductive thermal energy is deposited from the
    plasma into first-wall or divertor material surfaces.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:power_at_wall_due_to_convection
  - name:thermal_power_of_divertor
  sources:
  - id: dd:wall/global_quantities/power_conducted
    dd_path: wall/global_quantities/power_conducted
    status: composed
- name: power_at_wall_due_to_ohmic_dissipation
  kind: scalar
  status: draft
  description: Total resistive Joule power converted to heat within conducting wall,
    plasma-facing, and vessel structures by induced, halo, or other plasma-wall currents.
  documentation: 'Power at the wall due to ohmic dissipation is the total rate at
    which electrical energy is converted into heat inside conducting wall, plasma-facing,
    and vessel structures by currents associated with plasma-wall interaction. It
    includes resistive dissipation from eddy currents induced by changing magnetic
    fields and from halo or shared currents that pass through conducting structures.


    The instantaneous Joule-heating power over the conducting material volume is


    $$

    P_\mathrm{ohm} = \int_V \eta(\mathbf{x},T)\, |\mathbf{j}(\mathbf{x})|^2 \, dV

    $$


    where $V$ is the conducting material volume, $\eta(\mathbf{x},T)$ is the electrical
    resistivity at position $\mathbf{x}$ and material temperature $T$ in $\Omega\,\mathrm{m}$,
    $\mathbf{j}$ is the local current density in $\mathrm{A}\,\mathrm{m}^{-2}$, and
    $dV$ is a differential volume element in $\mathrm{m}^3$. For passive resistive
    materials, $\eta \ge 0$ and $|\mathbf{j}|^2 \ge 0$, so the integral is non-negative
    and represents heat production rather than a signed electromagnetic power flow.


    This quantity is computed from electromagnetic circuit or field models of the
    conducting structures, often constrained by magnetic sensors, wall-current measurements,
    halo-current measurements, and material resistivity data. Thermal analysis or
    calorimetry can provide an independent constraint when other heat sources, such
    as particle impact, radiation, and recombination, are separated. The related [energy
    flux at wall due to eddy current](name:energy_flux_at_wall_due_to_eddy_current)
    describes a local surface heat flux from eddy-current dissipation only; this quantity
    is a volume-integrated power and may also include halo-current dissipation.


    Typical values are about 10^3-10^6 W during routine operation with slowly varying
    fields, and about 10^6-10^9 W during disruptions, vertical displacement events,
    or rapid current quenches in large devices. The magnitude depends on plasma current,
    magnetic-field ramp rate, wall geometry, material resistivity, and the electrical
    circuit paths that connect the plasma to surrounding conducting structures.'
  unit: W
  physics_domain: plasma_wall_interactions
  links:
  - name:energy_flux_at_wall_due_to_eddy_current
  - name:plasma_power_at_wall
  arguments:
  - name: power_due_to_ohmic_dissipation
    operator: wall
    operator_kind: locus
  sources:
  - id: dd:wall/global_quantities/power_currents
    dd_path: wall/global_quantities/power_currents
    status: composed
- name: ratio_of_beryllium_density_to_electron_density
  kind: scalar
  status: draft
  description: Dimensionless ratio of total beryllium ion number density to electron
    number density. It measures beryllium impurity abundance relative to the plasma
    electron population, with the beryllium ion density summed over charged ionization
    states.
  documentation: 'The ratio of beryllium density to electron density is a dimensionless
    impurity abundance measuring how much beryllium ion population is present relative
    to the free electron population. The beryllium numerator is the total beryllium
    ion number density, summed over charged ionization states, and does not by itself
    weight the ions by charge.


    The defining relation is:


    $$

    f_\mathrm{Be} = \frac{n_\mathrm{Be}}{n_e} = \frac{\sum_{q=1}^{4} n_{\mathrm{Be}^{q+}}}{n_e}

    $$


    where $n_\mathrm{Be}$ is the total beryllium ion number density, $n_{\mathrm{Be}^{q+}}$
    is the number density of beryllium ions in charge state $q$, and $n_e$ is the
    electron number density; all densities in the ratio have units of m$^{-3}$. In
    a quasi-neutral plasma, the charge-weighted impurity contribution enters the electron
    balance through terms of the form $q n_{\mathrm{Be}^{q+}}$, so this ratio is closely
    related to fuel dilution but is not itself the charge fraction.


    Beryllium impurities are commonly produced by plasma-wall interaction processes
    such as sputtering of beryllium-containing plasma-facing components, followed
    by transport and ionization in the edge and confined plasma. The ratio is inferred
    by combining beryllium spectroscopic measurements and collisional-radiative modeling
    with electron density measurements from diagnostics such as interferometry and
    Thomson scattering. Related beryllium density quantities include [volume_averaged_beryllium_density](name:volume_averaged_beryllium_density),
    [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis),
    [beryllium_density_at_plasma_boundary](name:beryllium_density_at_plasma_boundary),
    and [beryllium_density_at_limiter](name:beryllium_density_at_limiter).


    Typical values in well-conditioned plasmas with beryllium plasma-facing surfaces
    are about $10^{-4}$-$10^{-2}$, with many H-mode conditions lying near $10^{-3}$-$5
    \times 10^{-3}$. Values can rise to several percent during strong wall source
    events, early conditioning phases, or after disruptions.'
  unit: '1'
  physics_domain: plasma_wall_interactions
  links:
  - name:electron_density
  - name:volume_averaged_beryllium_density
  - name:beryllium_density_at_plasma_boundary
  sources:
  - id: dd:summary/composition/beryllium/value
    dd_path: summary/composition/beryllium/value
    status: composed
- name: reference_wavelength_of_filter
  kind: scalar
  status: draft
  description: Reference wavelength of an optical filter is the nominal center or
    peak wavelength of its passband, usually the wavelength at which the nominal transmission
    is maximal. It identifies the spectral location of the filter response, not the
    full passband shape or width.
  documentation: 'Reference wavelength of a filter, $\lambda_\mathrm{ref}$, is the
    nominal spectral position assigned to an optical bandpass filter. For a single-peaked
    bandpass it is normally the wavelength at which the nominal spectral transmittance
    is largest; for asymmetric or structured responses it is a manufacturer- or calibration-defined
    reference point for the passband center.


    For a peak-defined filter reference, the defining relation is


    $$

    \lambda_\mathrm{ref} = \operatorname*{arg\,max}_{\lambda} T_\mathrm{nom}(\lambda)

    $$


    where $T_\mathrm{nom}(\lambda)$ is the nominal spectral transmittance as a function
    of wavelength $\lambda$.


    The value is obtained from the filter specification or from laboratory spectral-transmission
    calibration. It is used together with the passband width and, when available,
    lower and upper wavelength bounds to describe the spectral region transmitted
    by the filter; the reference wavelength alone does not fully determine the filter
    response.


    Typical values for visible and infrared plasma diagnostics are about $4\times10^{-7}$-$1.5\times10^{-5}$
    m, with narrow line filters often centered near specific atomic or molecular emission
    wavelengths and thermal-infrared filters commonly in the micrometer range.'
  unit: m
  physics_domain: plasma_wall_interactions
  links:
  - name:wavelength_of_filter
  - name:spectral_width_of_filter
  - name:spectral_wavelength
  sources:
  - id: dd:camera_ir/channel/camera/frame/filter/wavelength_central
    dd_path: camera_ir/channel/camera/frame/filter/wavelength_central
    status: composed
