name: vertical_component_of_current_density_due_to_viscous_heat_flux
description: Vertical ($Z$) projection of the current density arising from the divergence
  of the viscous heat-flux tensor.
documentation: 'This quantity gives the $Z$-component (height direction in a cylindrical
  $R, Z, \phi$ coordinate system) of the current density $\mathbf{j}_{\mathrm{visc,Q}}$
  driven by viscous heat transport in the plasma. The viscous heat flux tensor $\boldsymbol{\Pi}_Q$
  contributes a current density through the generalized Ohm''s law when the plasma
  is sufficiently collisional and anisotropic pressure effects become important: $\mathbf{j}_{\mathrm{visc,Q}}
  \propto \nabla \cdot \boldsymbol{\Pi}_Q / (n_e e)$, where $n_e$ is the electron
  density and $e$ is the elementary charge. This term is typically significant in
  the edge and divertor regions where temperature gradients and collisionality are
  high. Edge fluid codes such as SOLPS-ITER or SOLEDGE evaluate this contribution
  on generalized grids (GGD) with one scalar value per grid element. Magnitudes are
  generally small compared to the Ohmic and bootstrap contributions but can be locally
  important near X-points and in detached divertor conditions. See the companion parallel
  and perpendicular viscosity current density components for the full viscous decomposition.'
kind: vector_component
unit: A.m^-2
status: draft
