- name: radial_coordinate_of_filter_window
  kind: scalar
  status: draft
  description: Radial (R) position of the geometric center of a diagnostic filter
    window, giving its distance from the toroidal symmetry axis in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The coordinate $R$ gives the perpendicular distance from the toroidal
    symmetry axis to the geometric center of a diagnostic filter window in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $\phi$ is the toroidal angle increasing
    counter-clockwise when viewed from above $+\hat{Z}$ and $Z$ is the vertical height.
    Filter windows are thin absorbing foils or transmission elements placed in the
    optical path of X-ray and spectroscopic diagnostic channels; their precise spatial
    location is required for line-of-sight modeling, solid-angle weighting, and cross-channel
    spatial registration.


    This coordinate is obtained from mechanical design specifications or optical metrology
    surveys of the installed diagnostic assembly. It pairs naturally with the aperture-dimension
    descriptors [filter_window_width](name:filter_window_width) and [filter_window_height](name:filter_window_height),
    which give the transverse extents of the filter aperture, and with [thickness_of_filter](name:thickness_of_filter),
    which governs photon attenuation through the filter material. The corresponding
    radial position of a diagnostic aperture element is given by [radial_coordinate_of_aperture](name:radial_coordinate_of_aperture).


    Sign convention: Positive when the filter window center is displaced outward from
    the toroidal symmetry axis, consistent with $R \geq 0$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m
