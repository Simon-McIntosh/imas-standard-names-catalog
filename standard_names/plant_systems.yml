    \dot{S}_{\mathrm{H}} = Z_{\mathrm{H}}\dot{N}_{\mathrm{H}} = \dot{N}_{\mathrm{H}},
    \qquad Z_{\mathrm{H}} = 1

    $$


    where $\dot{S}_{\mathrm{H}}$ is the equivalent-electron source rate, $\dot{N}_{\mathrm{H}}$
    is the neutral hydrogen-atom delivery rate in atoms per second, and $Z_{\mathrm{H}}$
    is the hydrogen atomic number. This is the hydrogen component of the total [source
    rate due to gas injection](name:source_rate_due_to_gas_injection). Its time integral
    gives the accumulated hydrogen inventory [accumulated hydrogen count due to gas
    injection](name:accumulated_hydrogen_count_due_to_gas_injection).


    Sign convention: Positive when hydrogen gas is being delivered into the vessel,
    increasing the equivalent-electron inventory.'
