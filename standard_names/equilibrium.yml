- name: triangularity_of_flux_surface
  kind: scalar
  status: active
  description: Dimensionless triangularity shape parameter for a nested magnetic flux
    surface, given by the normalized inward radial displacement of its upper or lower
    vertical extremum.
  documentation: "Flux-surface triangularity is the signed shaping parameter that\
    \ measures the horizontal displacement of a flux surface\u2019s vertical extremum\
    \ from its geometric center, normalized by the surface\u2019s minor radius. It\
    \ characterizes triangular shaping in a poloidal cross-section.\n\nFor the relevant\
    \ upper or lower vertical extremum, the defining relation is:\n\n$$\n\\delta =\
    \ \\frac{R_c - R_{\\mathrm{ext}}}{a}\n$$\n\nwhere $\\delta$ is triangularity,\
    \ $R_c$ is the major-radius coordinate of the geometric center, $R_{\\mathrm{ext}}$\
    \ is the major-radius coordinate of the vertical extremum, and $a$ is the flux-surface\
    \ minor radius; $R_c$, $R_{\\mathrm{ext}}$, and $a$ are lengths in meters. These\
    \ quantities are defined in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical height.\n\
    \nThe parent quantity is not restricted to one vertical extremum. When the lower\
    \ extremum is resolved separately, it is represented by [lower triangularity of\
    \ a flux surface](name:lower_triangularity_of_flux_surface). Triangularity is\
    \ distinct from [elongation of a flux surface](name:elongation_of_flux_surface),\
    \ which measures aspect ratio, and [squareness of a flux surface](name:squareness_of_flux_surface),\
    \ which measures non-elliptical corner shaping.\n\nSign convention: Positive when\
    \ the relevant vertical extremum lies at smaller major radius $R$ than the geometric\
    \ center, corresponding to an inward displacement."
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:lower_triangularity_of_flux_surface
  - name:elongation_of_flux_surface
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/triangularity_lower
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-triangularity_lower
    dd_documentation:
      leaf: Lower triangularity w.r.t. magnetic axis
      parent_path: equilibrium/time_slice/profiles_1d
      parent: Equilibrium profiles (1D radial grid) as a function of the poloidal
        flux
      data_type: FLT_1D
      unit: '1'
      coordinates:
      - equilibrium/time_slice/profiles_1d/psi
    enhanced_context:
      description: "Lower triangularity (\u03B4_lower) of nested flux surfaces as\
        \ a function of the poloidal flux coordinate in the MHD equilibrium. Characterizes\
        \ asymmetric shaping of the lower plasma cross-section, influencing MHD stability\
        \ and confinement."
      kind: llm
- name: lower_triangularity_of_flux_surface
  kind: scalar
  status: active
  description: Lower triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the lower vertical extremum of a nested magnetic flux
    surface, using the flux-surface geometric center as the radial reference.
  documentation: 'Lower triangularity of a flux surface is the dimensionless triangularity
    shape parameter defined at the lower vertical extremum of a nested magnetic flux
    surface. It is the normalized inward radial displacement of that lower extremum
    relative to the flux-surface geometric center in a poloidal cross-section.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, with $R$ major radius, $\phi$
    toroidal angle, and $Z$ vertical height, the lower triangularity is defined as:


    $$

    \delta_\mathrm{lower} = \frac{R_\mathrm{c} - R_\mathrm{lower}}{a}

    $$


    where $R_\mathrm{c} = (R_\mathrm{out}+R_\mathrm{in})/2$ is the major radius of
    the flux-surface geometric center, $R_\mathrm{lower}$ is the major radius of the
    point on the same flux surface with minimum $Z$, and $a = (R_\mathrm{out}-R_\mathrm{in})/2$
    is the minor radius of that flux surface. Here $R_\mathrm{out}$ and $R_\mathrm{in}$
    are the largest and smallest major radii of the poloidal contour.


    This definition is a flux-surface shape parameter, not a displacement from the
    magnetic axis; a radially shifted but geometrically elliptical flux surface has
    zero lower triangularity by this definition. It distinguishes lower shaping from
    [upper triangularity of a flux surface]; for an up-down symmetric flux surface
    the upper and lower triangularities are equal.'
  unit: '1'
  physics_domain: equilibrium
  links: []
  arguments:
  - name: triangularity_of_flux_surface
    operator: lower
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/profiles_1d/triangularity_lower
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-profiles_1d-triangularity_lower
    dd_documentation:
