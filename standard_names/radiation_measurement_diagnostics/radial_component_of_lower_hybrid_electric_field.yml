name: radial_component_of_lower_hybrid_electric_field
description: Projection of the lower-hybrid wave electric field onto the major-radius
  direction $\hat{R}$ in cylindrical coordinates.
documentation: "The radial component $E_{\\mathrm{LH},R} = \\mathbf{E}_{\\mathrm{LH}}\
  \ \\cdot \\hat{R}$ represents the oscillating electric field of lower-hybrid (LH)\
  \ waves resolved along the major-radius axis, where $\\hat{R}$ is the outward unit\
  \ vector in the $(R, \\phi, Z)$ cylindrical coordinate system. Lower-hybrid waves,\
  \ launched in the 1\u20138 GHz range for current drive, carry an electric field\
  \ with components in all three cylindrical directions; the radial component contributes\
  \ to the ponderomotive force and to wave-particle coupling in the edge and scrape-off\
  \ layer. Polarization spectroscopy of visible emission lines (Stark splitting) in\
  \ the plasma edge can resolve local LH electric-field components with amplitudes\
  \ typically in the range 0.1\u201310 kV/m depending on launched power and plasma\
  \ density. Note: the stated unit $\\mathrm{m^{-1} \\cdot V}$ is equivalent to $\\\
  mathrm{V/m}$. See also `toroidal_component_of_lower_hybrid_electric_field` and `vertical_component_of_lower_hybrid_electric_field`\
  \ for the companion cylindrical projections."
kind: vector_component
unit: m^-1.V
