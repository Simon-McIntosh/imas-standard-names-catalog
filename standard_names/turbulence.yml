    dd_path: gyrokinetics_local/linear/wavevector/eigenmode/moments_norm_particle/v_perpendicular_square_energy
    status: composed
- name: perpendicular_normalized_perturbed_pressure_bessel_1
  kind: scalar
  status: draft
  description: Dimensionless perpendicular pressure moment of the perturbed gyrocenter
    distribution for a linear gyrokinetic eigenmode, weighted by the first-order Bessel
    function J1 of the gyroaveraging argument. It is the Bessel-1 counterpart of the
    normalized perpendicular gyrocenter pressure perturbation.
  documentation: 'The perpendicular normalized perturbed pressure Bessel-1 moment
    is the perpendicular kinetic-energy moment of the perturbed gyrocenter distribution
    weighted by $J_1$. It represents the finite-Larmor-radius part of the perpendicular
    pressure response of a linear gyrokinetic eigenmode and is generally a complex
    eigenfunction amplitude.


    The normalized moment is defined by


    $$

    \hat{\delta p}_{\perp,J_1} = \frac{1}{n_\mathrm{ref} T_\mathrm{ref}} \int_{\mathbb{R}^3}
    \frac{m v_\perp^2}{2}\, J_1\!\left(k_\perp \rho(v_\perp)\right)\, \delta f_\mathrm{gc}(\mathbf{v})\,
    d^3v

    $$


    where $\hat{\delta p}_{\perp,J_1}$ is dimensionless, $n_\mathrm{ref}$ is the reference
    density in $\mathrm{m}^{-3}$, and $T_\mathrm{ref}$ is the reference particle energy
    so that $n_\mathrm{ref}T_\mathrm{ref}$ is a reference pressure. Here $m$ is the
    species mass in kg, $v_\perp$ is the speed perpendicular to the background magnetic
    field in $\mathrm{m\,s}^{-1}$, $J_1$ is the dimensionless first-order Bessel function,
    $k_\perp$ is the perpendicular wave-number magnitude in $\mathrm{m}^{-1}$, and
    $\rho(v_\perp)=v_\perp/|\Omega|$ is the velocity-dependent gyroradius in meters
    for cyclotron angular frequency $\Omega$ in $\mathrm{s}^{-1}$. The perturbed gyrocenter
    distribution $\delta f_\mathrm{gc}$ has units $\mathrm{s}^3\,\mathrm{m}^{-6}$,
    and the velocity-space measure $d^3v$ has units $\mathrm{m}^3\,\mathrm{s}^{-3}$;
    using velocity variables $(v_\parallel,v_\perp,\alpha)$, $d^3v = v_\perp\,dv_\perp\,d\alpha\,dv_\parallel$,
    with $v_\parallel$ the velocity along the background magnetic field and $\alpha$
    the gyroangle.


    This quantity is computed from the eigenmode distribution function by carrying
    out the velocity-space moment for each species and wave vector. It is not a directly
    measured thermodynamic pressure; experimental fluctuation measurements may constrain
    related density, temperature, or field perturbations, while this gyrocenter moment
    is obtained through gyrokinetic interpretation or simulation.


    The $J_1$ weighting separates a finite-Larmor-radius contribution from the unweighted
    or $J_0$-gyroaveraged perpendicular pressure moments, linking it to related quantities
    such as [perpendicular_normalized_gyrocenter_perturbed_pressure](name:perpendicular_normalized_gyrocenter_perturbed_pressure)
    and [perpendicular_normalized_gyrocenter_gyroaveraged_pressure](name:perpendicular_normalized_gyrocenter_gyroaveraged_pressure).
    The complementary parallel contribution is [parallel_normalized_perturbed_pressure_bessel_1](name:parallel_normalized_perturbed_pressure_bessel_1),
    and their combination gives the corresponding total Bessel-1 pressure moment.


    There is no normalization-independent typical magnitude for a linear eigenmode,
    because multiplying the eigenfunction by any nonzero complex constant rescales
    this moment. Values are therefore interpreted as relative complex amplitudes only
    after the eigenmode amplitude and phase have been fixed by the chosen normalization.


    Sign convention: Positive when, after the eigenmode phase has been fixed by the
    selected reference perturbation, the Bessel-weighted excess of perpendicular gyrocenter
    kinetic energy in the defining velocity-space integral is positive.'
  unit: '1'
  physics_domain: turbulence
