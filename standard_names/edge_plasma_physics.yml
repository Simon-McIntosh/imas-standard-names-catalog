- name: flux_surface_averaged_iron_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged number density of iron impurity ions at the plasma
    boundary (separatrix), summed over all ion charge states from Fe+ through Fe26+
    and excluding neutral iron.
  documentation: 'Flux-surface-averaged number density of iron impurity ions at the
    plasma boundary (separatrix), summed over all ion charge states from Fe$^+$ through
    Fe$^{26+}$ and excluding neutral iron. It is the flux-surface-averaged counterpart
    of [iron density at the plasma boundary](name:iron_density_at_plasma_boundary)
    and represents the total charged iron impurity content on the boundary surface.


    For an axisymmetric equilibrium, the conventional flux-surface average on the
    separatrix is written as


    $$

    \langle n_\mathrm{Fe} \rangle_\mathrm{sep}

    =

    \frac{\oint_\mathrm{sep} n_\mathrm{Fe} \, d\ell / B_p}

    {\oint_\mathrm{sep} d\ell / B_p}

    $$


    where $n_\mathrm{Fe}$ is the local iron ion number density summed over charge
    states, $d\ell$ is an arc-length element along the separatrix contour in a poloidal
    cross-section, and $B_p$ is the poloidal magnetic-field magnitude. The $1/B_p$
    weighting accounts for the variation of surface area represented by each contour
    element.


    Because the exact separatrix can contain an X-point, the value is commonly evaluated
    as the limiting average on closed flux surfaces approaching the separatrix. In
    practice it is computed by summing charge-state-resolved iron ion densities and
    applying the flux-surface average to that sum; the charge-state balance is typically
    constrained by edge impurity transport or collisional-radiative modeling together
    with spectroscopic line emission and local plasma conditions.


    Typical boundary abundance ratios are often $n_\mathrm{Fe}/n_e \sim 10^{-5}-10^{-3}$,
    with metallic-wall or enhanced-sputtering conditions toward the upper end. For
    edge electron densities of $10^{19}-10^{20}$ m$^{-3}$, this corresponds roughly
    to $10^{14}-10^{17}$ m$^{-3}$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_plasma_boundary
  - name:flux_surface_averaged_neon_density_at_plasma_boundary
  - name:flux_surface_averaged_nitrogen_density_at_plasma_boundary
  arguments:
  - name: iron_density_at_plasma_boundary
    operator: flux_surface_averaged
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/iron/value
    dd_path: summary/local/separatrix_average/n_i/iron/value
    status: composed
- name: krypton_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of krypton impurity ions at the H-mode pedestal top,
    summed over all ionization stages, where the steep-gradient edge transport barrier
    meets the flatter core plasma.
  documentation: "Krypton density at the pedestal is the local number density of krypton\
    \ impurity ions at the top of the H-mode edge transport barrier, summed over all\
    \ ionization stages from Kr$^+$ through Kr$^{36+}$. The pedestal top is the radial\
    \ position where the steep edge density gradient of the transport barrier transitions\
    \ to the flatter confined core plasma, as characterized by the parent quantity\
    \ [density_at_pedestal_top](name:density_at_pedestal_top).\n\nThe total pedestal-top\
    \ krypton number density is the charge-state sum:\n\n$$\nn_{\\mathrm{Kr}} = \\\
    sum_{z=1}^{36} n_{\\mathrm{Kr}^{z+}}\n$$\n\nwhere $n_{\\mathrm{Kr}^{z+}}$ is the\
    \ number density of krypton ions in charge state $z^+$ at the pedestal-top flux\
    \ surface.\n\nKrypton ($Z = 36$) is a high-Z noble gas employed for radiative\
    \ seeding to distribute power exhaust across the divertor and first wall; its\
    \ pedestal concentration is therefore a key parameter in impurity-transport and\
    \ power-balance modeling. The pedestal-top value is inferred from charge-exchange\
    \ recombination spectroscopy or passive emission spectroscopy in the vacuum ultraviolet\
    \ and soft-X-ray regimes, where krypton line radiation from highly ionized charge\
    \ states is resolved in the pedestal region.\n\nTypical pedestal-top krypton concentrations\
    \ in seeded H-mode plasmas lie in the range $10^{16}$\u2013$10^{17}$ m$^{-3}$,\
    \ corresponding to impurity fractions of roughly 0.1\u20131% of [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top).\
    \ For the heavier noble-gas seeding analog compare [xenon_density_at_pedestal_top](name:xenon_density_at_pedestal_top),\
    \ and for the lighter seeding gas compare [argon_density_at_pedestal_top](name:argon_density_at_pedestal_top)."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:electron_density_at_pedestal_top
  - name:xenon_density_at_pedestal_top
  - name:argon_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: krypton
    operator_kind: qualifier
- name: lithium_density_at_pedestal_top
  kind: scalar
  status: draft
  description: Number density of lithium impurity ions at the H-mode pedestal top,
    summed over all ionization states from Li+ through Li3+, excluding neutral lithium
    atoms.
  documentation: "Lithium density at the pedestal top is the local number density\
    \ of lithium ions at the shoulder of the H-mode edge transport barrier, where\
    \ the steep edge density gradient transitions to the flatter confined core plasma.\
    \ Lithium (atomic number $Z = 3$) contributes three ionized charge states, and\
    \ this quantity is their sum:\n\n$$\nn_\\mathrm{Li} = \\sum_{k=1}^{3} n_{\\mathrm{Li}^{k+}}\n\
    $$\n\nwhere $n_{\\mathrm{Li}^{k+}}$ is the number density of lithium ions carrying\
    \ charge state $k+$. Neutral lithium atoms are excluded, so the quantity is non-negative.\n\
    \nLithium is used in tokamaks as a low-Z wall-conditioning and impurity-seeding\
    \ element; its concentration at the pedestal top characterizes the depth of lithium\
    \ penetration into the confined plasma and its contribution to edge radiative\
    \ losses. The value is typically inferred from passive spectroscopy or charge-exchange\
    \ recombination spectroscopy combined with equilibrium reconstruction to locate\
    \ the pedestal-top flux surface. Typical lithium impurity densities at the pedestal\
    \ top lie in the range $10^{16}$\u2013$10^{18}$ m$^{-3}$, well below main-ion\
    \ densities, depending on wall loading and injection method.\n\nThis quantity\
    \ is a species-resolved member of the [density_at_pedestal_top](name:density_at_pedestal_top)\
    \ family, analogous to [carbon_density_at_pedestal_top](name:carbon_density_at_pedestal_top)\
    \ and [beryllium_density_at_pedestal_top](name:beryllium_density_at_pedestal_top)\
    \ for other low-Z impurities. The companion boundary value [lithium_density_at_plasma_boundary](name:lithium_density_at_plasma_boundary)\
    \ evaluates the same charge-state sum at the separatrix, while [lithium_density](name:lithium_density)\
    \ describes the full radial density profile."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:carbon_density_at_pedestal_top
  - name:beryllium_density_at_pedestal_top
  - name:lithium_density_at_plasma_boundary
  - name:lithium_density
  arguments:
  - name: density_at_pedestal_top
    operator: lithium
    operator_kind: qualifier
- name: lithium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Number density of ionized lithium impurity at the plasma boundary,
    identified with the separatrix. It is summed over Li+, Li2+, and Li3+ charge states,
    excludes neutral lithium, and is a non-negative scalar in m^-3.
  documentation: 'Lithium density at the plasma boundary is the number density of
    ionized lithium impurity at the separatrix, the interface between closed magnetic
    flux surfaces and open scrape-off-layer field lines. It includes all ionized lithium
    charge states, Li$^+$ through Li$^{3+}$, and excludes neutral lithium. As a particle
    number density, it is non-negative and has unit m$^{-3}$.


    The charge-state-summed lithium ion density is defined by:


    $$

    n_\mathrm{Li} = \sum_{q=1}^{3} n_{\mathrm{Li}^{q+}}

    $$


    where $n_\mathrm{Li}$ is the total ionized lithium number density in m$^{-3}$,
    $n_{\mathrm{Li}^{q+}}$ is the number density in m$^{-3}$ of lithium ions with
    charge state $q$, and $q=1,2,3$ for lithium. Neutral lithium, $\mathrm{Li}^0$,
    is not included.


    Boundary lithium ion density is inferred from edge impurity spectroscopy, charge-exchange
    measurements when available, atomic-physics modeling, and consistency with separatrix
    electron density and temperature. When represented as a single boundary scalar,
    it denotes a representative separatrix value; it should not be interpreted as
    necessarily flux-surface averaged unless the quantity is explicitly identified
    as flux-surface averaged, as in [flux_surface_averaged_electron_density_at_plasma_boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary).


    Typical separatrix lithium ion densities are often trace levels of about $10^{14}$-$10^{17}$
    m$^{-3}$, but active lithium injection, evaporation, or strong lithium wall sources
    can raise values toward $10^{18}$ m$^{-3}$. These values are usually small compared
    with [total_ion_density_at_plasma_boundary](name:total_ion_density_at_plasma_boundary)
    and the corresponding electron density, but they can still affect edge radiation
    and [effective_charge_at_plasma_boundary](name:effective_charge_at_plasma_boundary).
    The concept is analogous to other impurity boundary densities such as [carbon_density_at_plasma_boundary](name:carbon_density_at_plasma_boundary).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_plasma_boundary
  - name:density_at_plasma_boundary
  arguments:
  - name: density_at_plasma_boundary
    operator: lithium
    operator_kind: qualifier
  sources:
  - id: dd:summary/local/separatrix_average/n_i/lithium/value
    dd_path: summary/local/separatrix_average/n_i/lithium/value
    status: composed
- name: flux_surface_averaged_lithium_density_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged total number density of lithium ions, summed
    over all charge states from Li+ through Li3+, evaluated at the plasma boundary
    (separatrix).
  documentation: "This is the flux-surface average of lithium ion number density,\
    \ summed over all ionization stages from Li$^+$ through fully stripped Li$^{3+}$,\
    \ evaluated on the last closed flux surface (separatrix) that bounds the confined\
    \ plasma. The averaging collapses poloidal variation along the boundary into a\
    \ single representative scalar, yielding the mean lithium impurity content at\
    \ the confined-plasma edge \u2014 the flux-surface-averaged counterpart to [lithium_density_at_plasma_boundary](name:lithium_density_at_plasma_boundary).\n\
    \nThe flux-surface average of lithium number density $n_{Li}$ on the separatrix\
    \ is defined as\n\n$$\n\\langle n_{Li} \\rangle = \\frac{\\oint n_{Li}\\, dl /\
    \ B_p}{\\oint dl / B_p}\n$$\n\nwhere $l$ is the poloidal arc length along the\
    \ separatrix contour and $B_p$ is the poloidal magnetic field strength.\n\nThis\
    \ quantity is inferred from impurity transport modeling constrained by edge spectroscopy\
    \ \u2014 passive emission of lithium lines or charge-exchange recombination spectroscopy\
    \ \u2014 and serves as a standard boundary condition in edge and core transport\
    \ codes. Analogous flux-surface-averaged boundary densities for other species\
    \ include [flux_surface_averaged_neon_density_at_plasma_boundary](name:flux_surface_averaged_neon_density_at_plasma_boundary),\
    \ [flux_surface_averaged_iron_density_at_plasma_boundary](name:flux_surface_averaged_iron_density_at_plasma_boundary),\
    \ and [flux_surface_averaged_deuterium_density_at_plasma_boundary](name:flux_surface_averaged_deuterium_density_at_plasma_boundary).\
    \ In lithium-coated wall devices, separatrix lithium densities can reach $10^{16}$\u2013\
    $10^{18}$ m$^{-3}$; under trace impurity conditions the boundary value falls in\
    \ the range $10^{14}$\u2013$10^{16}$ m$^{-3}$.\n\nSign convention: Positive when\
    \ the separatrix plasma contains lithium impurity ions."
  unit: m^-3
  physics_domain: edge_plasma_physics
