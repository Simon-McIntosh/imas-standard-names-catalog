- name: toroidal_linear_mhd_mode_reference_phase
  kind: scalar
  status: draft
  description: Angular Fourier phase offset that fixes the complex reference phase
    of a linear MHD toroidal eigenmode in the right-handed cylindrical (R, phi, Z)
    frame. It is a phase in the toroidal harmonic, not a literal toroidal displacement;
    for toroidal mode number n the equivalent pattern shift is scaled by 1/n.
  documentation: 'The toroidal linear MHD mode reference phase is the additive angular
    phase that fixes the reference complex phase of a linear magnetohydrodynamic eigenmode
    in the toroidal Fourier harmonic. It is defined with respect to the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    For a perturbation quantity $\delta q$ represented as a single toroidal normal
    mode, the reference phase enters as


    $$

    \delta q(R,\phi,Z,t)=\Re\left\{\hat{q}(R,Z)\exp\left[i\left(n\phi+\phi_\mathrm{ref}-\omega_r
    t\right)\right]\right\}

    $$


    where $\hat{q}$ is the complex eigenfunction amplitude, $n$ is the integer toroidal
    mode number, $\phi_\mathrm{ref}$ is the reference phase, and $\omega_r$ is the
    real angular oscillation frequency. Under this convention, a change $\Delta\phi_\mathrm{ref}$
    corresponds to a toroidal pattern displacement $\Delta\phi_\mathrm{pattern}=-\Delta\phi_\mathrm{ref}/n$
    for nonzero $n$; for $n=0$ it is a global complex phase rather than a toroidal
    position.


    The phase is determined by choosing a complex reference for the eigenfunction,
    for example by fixing the phase of one perturbation component at a reference location
    or by fitting a toroidal Fourier harmonic to measurements at multiple toroidal
    angles. Because a linear eigenfunction may be multiplied by an arbitrary complex
    constant, the absolute reference phase is meaningful only relative to the chosen
    phase reference; relative phases between components, modes, or times carry the
    invariant physical information.


    As an angular phase, it is defined modulo $2\pi$: values differing by $2\pi k$,
    with integer $k$, represent the same toroidal eigenmode phase. Typical principal-branch
    values span $(-\pi,\pi]$ rad or $[0,2\pi)$ rad, and continuous phase evolution
    may be unwrapped to avoid artificial jumps at the branch cut.


    Sign convention: Positive when it increases the additive phase in the toroidal
    Fourier factor $e^{i(n\phi+\phi_\mathrm{ref})}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame; for positive $n$ this shifts a fixed phase feature toward
    decreasing $\phi$.'
  unit: rad
  physics_domain: magnetohydrodynamics
  links:
  - name:linear_mhd_mode_reference_phase
  - name:per_toroidal_mode_perturbed_energy
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/phase
    dd_path: mhd_linear/time_slice/toroidal_mode/phase
    status: composed
- name: toroidal_magnetic_flux_at_halo_boundary
  kind: scalar
  status: draft
  description: Value of the toroidal magnetic flux function on the outermost flux
    surface bounding the halo-current region during a plasma disruption. It quantifies
    the net toroidal-field flux threading the poloidal cross-section enclosed by that
    boundary and is the toroidal-flux counterpart of the poloidal flux at the same
    surface.
  documentation: 'Toroidal magnetic flux at the halo boundary is the value of the
    toroidal flux function on the outermost flux surface bounding the halo-current
    region during a plasma disruption. During a disruption the plasma column moves
    toward the wall and current flows along partially open field lines through an
    annular halo zone; this quantity labels the flux surface enclosing that zone and
    characterizes how much toroidal magnetic field threads the poloidal cross-section
    inside it.


    The toroidal magnetic flux $\Phi_\mathrm{tor}$ is the surface integral of the
    toroidal magnetic-field component $B_\phi$ over the poloidal cross-section $S$
    enclosed by the halo-boundary flux surface:


    $$

    \Phi_{\mathrm{tor}} = \iint_{S} B_\phi \, dR \, dZ

    $$


    where $R$ is the major radius in meters, $Z$ is the vertical height in meters,
    $\phi$ is the toroidal angle in the right-handed cylindrical $(R, \phi, Z)$ frame,
    $B_\phi$ is the toroidal magnetic-field component in tesla, and the area element
    $dR\,dZ$ is in square meters, giving a result in webers.


    The boundary value is obtained by identifying the flux surface that separates
    the halo-current region from the surrounding region in a disruption-phase magnetic
    equilibrium and then evaluating the toroidal flux over the enclosed poloidal area.
    It is commonly interpreted together with [toroidal_halo_current](name:toroidal_halo_current)
    and [poloidal_halo_current](name:poloidal_halo_current), and complements [poloidal_magnetic_flux_at_halo_boundary](name:poloidal_magnetic_flux_at_halo_boundary);
    the contribution attributable to the plasma poloidal current is isolated by [toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current](name:toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current).


    The magnitude scales mainly with the toroidal-field strength and the poloidal
    area enclosed by the halo-boundary flux surface, and it can change rapidly during
    vertical displacement, current quench, and halo-current growth.


    Sign convention: Positive when $B_\phi$ over the enclosed poloidal cross-section
    points in the direction of increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_magnetic_flux_at_halo_boundary
  - name:toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current
  - name:toroidal_halo_current
  - name:poloidal_halo_current
  sources:
  - id: dd:disruption/global_quantities/phi_halo_boundary
    dd_path: disruption/global_quantities/phi_halo_boundary
    status: attached
- name: toroidal_magnetic_flux_at_halo_boundary_due_to_poloidal_current
  kind: scalar
  status: draft
  description: Value of the toroidal flux function on the flux surface forming the
    outer boundary of the halo-current region, retaining only the field produced by
    the poloidal component of the halo current. It is the source-separated toroidal-field
    flux through a poloidal cut of that boundary, distinct from the total toroidal
    flux from all current systems.
  documentation: 'Toroidal magnetic flux at the halo boundary due to poloidal current
    is the source-separated value of the toroidal flux function on the flux surface
    forming the outer boundary of the halo-current-carrying region that develops during
    a plasma disruption. It retains only the toroidal magnetic field produced by the
    poloidal component of the halo current; [toroidal_magnetic_flux_at_halo_boundary](name:toroidal_magnetic_flux_at_halo_boundary)
    is the corresponding total value from all magnetic-field sources. It is paired
    with [poloidal_magnetic_flux_at_halo_boundary](name:poloidal_magnetic_flux_at_halo_boundary),
    which represents the complementary poloidal-field flux associated with the same
    halo boundary.


    Let $S_h$ be the area inside the closed halo-boundary contour in a plane of constant
    toroidal angle $\phi$, oriented with $d\mathbf{S}=+\hat{\phi}\,dA$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame. The source-separated toroidal flux is


    $$

    \Phi_{\mathrm{tor},h}^{(I_{\mathrm{pol,h}})} = \int_{S_h} \mathbf{B}^{(I_{\mathrm{pol,h}})}
    \cdot d\mathbf{S} = \int_{S_h} B_{\phi}^{(I_{\mathrm{pol,h}})}(R,Z)\, dA

    $$


    where $\Phi_{\mathrm{tor},h}^{(I_{\mathrm{pol,h}})}$ is in Wb, $\mathbf{B}^{(I_{\mathrm{pol,h}})}$
    is the magnetic-field contribution in tesla generated by the poloidal halo current
    $I_{\mathrm{pol,h}}$ in amperes, $B_{\phi}^{(I_{\mathrm{pol,h}})}$ is its component
    along $\hat{\phi}$, and $dA$ is the scalar area element in m^2 on the constant-$\phi$
    cut. In axisymmetry the value is independent of which constant-$\phi$ cut is used.


    In practice this quantity is computed from a disruption equilibrium or magnetostatic
    reconstruction by separating magnetic-field contributions by current source, evaluating
    the field produced by [poloidal_halo_current](name:poloidal_halo_current) alone,
    and integrating it over the halo-boundary contour. For an axisymmetric segment,
    Ampere''s law gives the local scaling $B_{\phi}^{(I_{\mathrm{pol,h}})} \simeq
    \mu_0 I_{\mathrm{pol,enc}}/(2\pi R)$, where $I_{\mathrm{pol,enc}}$ is the net
    poloidal halo current in amperes crossing a surface bounded by a toroidal Amperian
    circle at fixed $R$ and $Z$, $R$ is major radius in meters, and $\mu_0$ is the
    magnetic permeability of free space in H m^-1. The [toroidal_halo_current](name:toroidal_halo_current)
    is the complementary halo-current component that mainly contributes to poloidal
    magnetic field rather than to this isolated toroidal-field flux.


    Order-of-magnitude absolute values are often 10^-4-10^-1 Wb in small and medium
    tokamaks and 10^-2-1 Wb in larger, high-current disruptions; values of several
    Wb require megampere-scale poloidal halo currents and square-meter-scale halo
    cross sections. The value scales with enclosed poloidal halo current, halo-boundary
    cross-sectional area, and approximately 1/R through the Ampere-law field scaling.


    Sign convention: Positive when $B_{\phi}^{(I_{\mathrm{pol,h}})}$ crosses the oriented
    surface $S_h$ in the $+\hat{\phi}$ direction of the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: Wb
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_magnetic_flux_at_halo_boundary
  - name:poloidal_halo_current
  - name:poloidal_magnetic_flux_at_halo_boundary
  sources:
  - id: dd:disruption/global_quantities/phi_halo_boundary_poloidal_current
    dd_path: disruption/global_quantities/phi_halo_boundary_poloidal_current
    status: attached
- name: toroidal_perturbed_plasma_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the complex first-order plasma velocity perturbation
    eigenfunction in linear MHD stability analysis, encoding the amplitude and phase
    of toroidal bulk plasma oscillation for a specified Fourier mode.
  documentation: 'The toroidal perturbed plasma velocity $\delta\hat{v}_\phi$ is the
    projection of the complex vector eigenfunction $\delta\hat{\mathbf{v}}(\mathbf{r})$
    representing first-order oscillatory perturbations of bulk plasma flow in linear
    MHD onto the $\hat{\phi}$ direction of the right-handed cylindrical $(R, \phi,
    Z)$ frame, where $R$ is major radius and $Z$ is vertical height. For each toroidal
    Fourier harmonic $n$, this component captures how the bulk plasma oscillates along
    the toroidal direction about the magnetostatic equilibrium.


    As a complex scalar, it decomposes into real and imaginary parts:


    $$

    \delta\hat{v}_\phi(\mathbf{r}) = \mathrm{Re}[\delta\hat{v}_\phi] + i\,\mathrm{Im}[\delta\hat{v}_\phi]

    $$


    where $\mathrm{Re}[\delta\hat{v}_\phi]$ is given by [toroidal_perturbed_plasma_velocity_real_part](name:toroidal_perturbed_plasma_velocity_real_part)
    and $\mathrm{Im}[\delta\hat{v}_\phi]$ by [toroidal_perturbed_plasma_velocity_imaginary_part](name:toroidal_perturbed_plasma_velocity_imaginary_part);
    together they encode the spatial amplitude and phase of the toroidal flow perturbation
    for the eigenmode.


    This is the toroidal projection of the full vector eigenfunction described by
    [perturbed_plasma_velocity](name:perturbed_plasma_velocity); analogous complex
    structures exist for radial and poloidal projections, such as [radial_perturbed_plasma_velocity_real_part](name:radial_perturbed_plasma_velocity_real_part)
    and [poloidal_perturbed_plasma_velocity_real_part](name:poloidal_perturbed_plasma_velocity_real_part).
    The relative magnitudes of toroidal, poloidal, and radial components characterize
    the mode polarization; the eigenfunction is evaluated by linear MHD eigenvalue
    solvers applied to a reconstructed magnetostatic equilibrium.


    Sign convention: Positive when $\delta\hat{v}_\phi$ points in the direction of
    increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_velocity_real_part
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  - name:perturbed_plasma_velocity
  - name:radial_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  arguments:
  - name: perturbed_plasma_velocity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
- name: toroidal_perturbed_plasma_velocity_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the toroidal component of the complex plasma velocity
    perturbation eigenfunction in linear MHD stability analysis for a specified toroidal
    mode number.
  documentation: 'The imaginary part $\operatorname{Im}(\tilde{v}_\phi)$ is the out-of-phase
    component of the first-order toroidal fluid velocity perturbation arising in linear
    MHD stability analysis. The full toroidal perturbation eigenfunction $\tilde{v}_\phi
    = \tilde{\mathbf{v}} \cdot \hat{\phi}$ is the projection of the complex velocity
    eigenfunction $\tilde{\mathbf{v}}(R,Z)$ onto the toroidal unit vector $\hat{\phi}$
    of the right-handed cylindrical $(R, \phi, Z)$ frame, where the mode varies as
    $e^{i(n\phi - \omega t)}$ for toroidal mode number $n$ and complex eigenfrequency
    $\omega$:


    $$

    \tilde{v}_\phi = \operatorname{Re}(\tilde{v}_\phi) + i\,\operatorname{Im}(\tilde{v}_\phi)

    $$


    where $\operatorname{Re}(\tilde{v}_\phi)$ is the in-phase component documented
    in [toroidal_perturbed_plasma_velocity_real_part](name:toroidal_perturbed_plasma_velocity_real_part)
    and both parts carry the same units as the eigenfunction normalization convention
    dictates.


    This quantity is computed by linear MHD stability solvers as the imaginary part
    of the toroidal eigenfunction component. Because eigenfunction amplitudes are
    normalization-dependent, only phase ratios and relative magnitudes across components
    carry intrinsic physical meaning. The companion imaginary-part components [poloidal_perturbed_plasma_velocity_imaginary_part](name:poloidal_perturbed_plasma_velocity_imaginary_part)
    and [radial_perturbed_plasma_velocity_imaginary_part](name:radial_perturbed_plasma_velocity_imaginary_part)
    complete the cylindrical decomposition of the perturbed velocity.


    Sign convention: Positive when $\operatorname{Im}(\tilde{v}_\phi)$ points in the
    direction of increasing toroidal angle $\phi$.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_imaginary_part
  arguments:
  - name: toroidal_perturbed_plasma_velocity
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/imaginary
    status: composed
- name: toroidal_perturbed_plasma_velocity_real_part
  kind: complex
  status: draft
  description: Real part of the phi-directed component, in the right-handed cylindrical
    (R, phi, Z) frame, of the complex first-order plasma velocity perturbation eigenfunction
    for a specified toroidal Fourier harmonic in linear MHD.
  documentation: 'Toroidal perturbed plasma velocity real part is the real component
    of the complex first-order plasma velocity perturbation eigenfunction projected
    along $\hat{\boldsymbol{\phi}}$, the direction of increasing toroidal angle $\phi$
    in the right-handed cylindrical $(R,\phi,Z)$ frame, where $R$ is major radius
    and $Z$ is vertical height. It describes the oscillatory flow perturbation associated
    with a specified toroidal Fourier harmonic, not the equilibrium rotation.


    The component is defined by the projection of the complex velocity eigenfunction
    onto the toroidal basis direction:


    $$

    v_{\phi,\mathrm{Re}}(R,Z) = \operatorname{Re}\!\left[\widetilde{\mathbf v}(R,Z)\cdot\hat{\boldsymbol{\phi}}\right]

    $$


    where $v_{\phi,\mathrm{Re}}$ is in m.s^-1, $R$ and $Z$ are in m, $\widetilde{\mathbf
    v}$ is the complex perturbed velocity eigenfunction in m.s^-1, $\hat{\boldsymbol{\phi}}$
    is dimensionless, and $\operatorname{Re}$ denotes the real part. With toroidal
    dependence proportional to $\exp(i n\phi)$, $n$ is the dimensionless toroidal
    mode number, $\phi$ is in radians, and $i$ is the dimensionless imaginary unit.


    For a static ideal-MHD equilibrium and temporal factor $\exp(-i\omega t)$, the
    full complex vector is constrained by the linearized momentum balance $-i\omega\rho_0\widetilde{\mathbf
    v}= -\nabla\widetilde p + [(\nabla\times\widetilde{\mathbf B})\times\mathbf B_0
    + (\nabla\times\mathbf B_0)\times\widetilde{\mathbf B}]/\mu_0$, coupled to the
    induction and pressure equations. Here $\omega$ is the complex eigenfrequency
    in s^-1, $t$ is time in s, $\rho_0$ is equilibrium mass density in kg.m^-3, $\widetilde
    p$ is pressure perturbation in Pa, $\nabla$ is the spatial derivative operator
    in m^-1, $\widetilde{\mathbf B}$ and $\mathbf B_0$ are magnetic fields in T, and
    $\mu_0$ is magnetic permeability in H.m^-1.


    This quantity is normally computed from a linear MHD eigenmode calculation and
    compared with measurements only after choosing a mode amplitude and complex phase.
    Velocity fluctuations may be constrained directly by spectroscopic or imaging
    diagnostics, or indirectly through magnetic and density fluctuation measurements
    combined with a mode model. Because a complex eigenvector can be multiplied by
    an arbitrary complex constant, the real and imaginary parts depend on the chosen
    normalization and phase; if a local phase angle is needed, it should be formed
    with $\operatorname{atan2}(v_{\phi,\mathrm{Im}},v_{\phi,\mathrm{Re}})$ so that
    quadrant information is retained.


    Typical values are normalization-dependent. For eigenfunctions scaled to measured
    coherent fluctuations, $|v_{\phi,\mathrm{Re}}|$ is often 1-10^3 m.s^-1 for low-frequency
    tearing or kink-like activity and 10^2-10^5 m.s^-1 for faster Alfvenic perturbations;
    values outside these ranges can occur under different eigenvector normalizations.


    Sign convention: Positive when $v_{\phi,\mathrm{Re}}$ is directed toward increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R,\phi,Z)$ frame.'
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
  - name:toroidal_perturbed_plasma_velocity
  - name:toroidal_perturbed_plasma_velocity_imaginary_part
  - name:radial_perturbed_plasma_velocity_real_part
  - name:poloidal_perturbed_plasma_velocity_real_part
  arguments:
  - name: toroidal_perturbed_plasma_velocity
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/velocity_perturbed/coordinate3/real
    status: composed
- name: vertical_plasma_velocity
  kind: scalar
  status: draft
  description: Z-direction component of the plasma center-of-mass bulk fluid velocity
    in the right-handed cylindrical (R, phi, Z) frame, capturing net vertical mass
    transport of the plasma.
  documentation: "The vertical plasma velocity is the projection of the plasma center-of-mass\
    \ bulk fluid velocity onto the vertical direction $\\hat{Z}$ of the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the major radius from the symmetry\
    \ axis and $Z$ is the height above the midplane. It captures net vertical mass\
    \ transport \u2014 relevant to equilibrium vertical stability, edge flows near\
    \ magnetic X-points, and the onset or evolution of vertical displacement events.\n\
    \nThe component is defined as:\n\n$$\nv_Z = \\mathbf{v}_\\mathrm{cm} \\cdot \\\
    hat{Z}\n$$\n\nwhere $\\mathbf{v}_\\mathrm{cm}$ is the [plasma_velocity](name:plasma_velocity)\
    \ center-of-mass bulk velocity vector, a mass-weighted mean of all contributing\
    \ plasma species.\n\nTogether with [radial_plasma_velocity](name:radial_plasma_velocity)\
    \ and [toroidal_plasma_velocity](name:toroidal_impurity_ion_velocity_at_measurement_position),\
    \ this component fully decomposes the bulk plasma flow in the cylindrical $(R,\
    \ \\phi, Z)$ frame. The [parallel_plasma_velocity](name:parallel_plasma_velocity)\
    \ gives the field-aligned projection, which combines contributions from all three\
    \ cylindrical directions. In tokamak near-equilibrium conditions, vertical velocities\
    \ are generally much smaller than toroidal rotation speeds but become significant\
    \ near magnetic X-points, in scrape-off layer flows, or during vertical stability\
    \ transients.\n\nSign convention: Positive when the plasma flow is directed in\
    \ the $+Z$ direction (vertically upward)."
  unit: m.s^-1
  physics_domain: magnetohydrodynamics
  links:
