- name: length_of_poloidal_field_coil
  kind: scalar
  status: active
  description: Euclidean length of an inclined side of an oblique parallelogram cross-section
    of a magnetic component, defining one of its oblique geometric dimensions.
  documentation: 'This quantity is the Euclidean length of a designated inclined side
    of an oblique parallelogram cross-section of a magnetic component. It defines
    one oblique geometric dimension independently of the component''s particular identity
    or side-label convention.


    The edge length is defined in the poloidal plane of the right-handed cylindrical
    $(R, \phi, Z)$ frame by


    $$

    L = \sqrt{(R_2-R_1)^2 + (Z_2-Z_1)^2}

    $$


    where $L$ is the edge length, $R_1$ and $R_2$ are the major-radius coordinates
    of the endpoints, and $Z_1$ and $Z_2$ are their vertical-height coordinates; all
    length coordinates are in meters. The endpoints share the same toroidal angle
    $\phi$.


    The selected edge may be distinguished by its inclination or geometric role. [major_length_of_poloidal_field_coil](name:major_length_of_poloidal_field_coil)
    is a concrete poloidal-field-coil instance, while [length_of_passive_structure](name:length_of_passive_structure)
    and [major_length_of_iron_core_segment](name:major_length_of_iron_core_segment)
    apply the same geometric concept to other magnetic components. This quantity is
    distinct from a cross-sectional height, width, or area.


    Sign convention: Positive when the Euclidean edge length is represented as a non-negative
    magnitude.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
  - name:major_length_of_poloidal_field_coil
  - name:length_of_passive_structure
  sources:
  - dd_path: pf_active/coil/element/geometry/oblique/length_beta
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_active.html#pf_active-coil-element-geometry-oblique-length_beta
    dd_documentation:
      leaf: Length of the parallelogram side inclined with angle beta with respect
        to the height axis
      parent_path: pf_active/coil/element/geometry/oblique
      parent: Trapezoidal description of the element
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Length of the parallelogram side inclined at angle beta with respect
        to the height axis in the oblique (trapezoidal) cross-section of an active
        PF coil element. Defines one oblique dimension of the coil geometry.
      kind: llm
