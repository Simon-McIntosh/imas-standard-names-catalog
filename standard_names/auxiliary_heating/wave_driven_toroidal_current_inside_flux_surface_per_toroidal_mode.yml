name: wave_driven_toroidal_current_inside_flux_surface_per_toroidal_mode
status: draft
description: Cumulative toroidal current driven by a coherent wave inside a given
  flux surface, resolved per toroidal mode number $n_\phi$.
documentation: The enclosed wave-driven toroidal current $I_{\phi}^{\mathrm{enc}}(\rho,
  n_\phi)$ is the volume integral of the wave-driven toroidal current density $j_{\phi,\mathrm{wave}}$
  from the magnetic axis out to the flux surface labeled by $\rho$, for a single toroidal
  mode number $n_\phi$. Mathematically, $I_{\phi}^{\mathrm{enc}}(\rho, n_\phi) = \int_0^\rho
  j_{\phi,\mathrm{wave}}(\rho', n_\phi)\, dV'$, where $dV'$ is the differential volume
  element. This radial profile is produced by wave propagation and absorption codes
  such as TORIC, GENRAY, or AORSA and is used to assess localized current-drive efficiency
  across the plasma cross section. At the last closed flux surface, $I_{\phi}^{\mathrm{enc}}$
  equals the global wave-driven current for that mode, linking this quantity to `wave_driven_toroidal_current_per_toroidal_mode`.
  Typical values for ECCD range from a few kA near the axis to tens of kA at the edge
  per mode.
