        types (index 3 or 5), defining aspherical or toroidal surface geometry.
      kind: llm
- name: vertical_coordinate_of_bragg_crystal
  kind: scalar
  status: active
  description: "Vertical Z coordinate of the geometric center of a Bragg crystal,\
    \ measured from the machine midplane in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'Vertical Z coordinate of the geometric center of a Bragg crystal
    is the $Z$ coordinate of the crystal''s geometric center in the right-handed cylindrical
    $(R, \phi, Z)$ frame, measured from the machine midplane $Z=0$. It specifies the
    vertical location of that center, not the coordinate of another point on the crystal.


    For a geometric-center position vector $\mathbf{r}_c$ taken from the coordinate
    origin, the coordinate is the projection onto the vertical basis direction:


    $$

    Z_c = \mathbf{r}_c \cdot \hat{Z}

    $$


    where $Z_c$ is the vertical coordinate of the Bragg-crystal geometric center and
    $\hat{Z}$ is the vertical basis vector of the right-handed cylindrical $(R, \phi,
    Z)$ frame.


    This quantity refers only to the geometric center of the Bragg crystal as a diffracting
    optical element. It excludes the vertical coordinate of crystal surface vertices,
    mounts, apertures, detectors, or any other associated component.


    Sign convention: Positive when the Bragg-crystal geometric center lies above the
    machine midplane $Z=0$.'
  unit: m
