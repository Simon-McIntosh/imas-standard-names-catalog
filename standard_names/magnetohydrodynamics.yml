      kind: llm
- name: poloidal_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: active
  description: Real part of the single-toroidal-mode poloidal perturbed vacuum magnetic
    field, equal to the in-phase projection of the complex first-order vacuum magnetic-field
    perturbation onto the poloidal unit tangent outside the plasma.
  documentation: 'Real part of the single-toroidal-mode poloidal perturbed vacuum
    magnetic field is the in-phase scalar component of the complex first-order vacuum
    magnetic-field perturbation projected onto the poloidal unit tangent outside the
    plasma. The poloidal unit tangent is defined in a specified flux-coordinate system
    $(\rho,\theta,\phi)$ as the direction of increasing poloidal angle $\theta$ at
    fixed $\rho$ and $\phi$, where $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R,\phi,Z)$ frame with basis $(\hat{R},\hat{\phi},\hat{Z})$. This
    poloidal direction is a local flux-coordinate tangent, not a cylindrical-basis
    direction.


    The real poloidal vacuum perturbation amplitude is defined by projecting the complex
    vacuum perturbation onto the poloidal unit tangent and taking the real part:


    $$

    \delta B_{\theta,\mathrm{real}}^{\mathrm{vac}}(\rho,\theta;n) = \operatorname{Re}\!\left[\delta\mathbf{B}^{\mathrm{vac}}(\rho,\theta;n)
    \cdot \hat{\mathbf{e}}_{\theta}\right]

    $$


    where $\delta B_{\theta,\mathrm{real}}^{\mathrm{vac}}$ is this real poloidal vacuum
    perturbation amplitude, $\delta\mathbf{B}^{\mathrm{vac}}$ is the complex first-order
    [perturbed vacuum magnetic field](name:perturbed_vacuum_magnetic_field) amplitude,
    $n$ is the integer toroidal mode number, and $\hat{\mathbf{e}}_{\theta}$ is the
    poloidal unit tangent defined above.


    The vacuum qualifier restricts the quantity to the current-free region exterior
    to the plasma, where the first-order perturbation satisfies $\nabla\times\delta\mathbf{B}^{\mathrm{vac}}=0$
    and $\nabla\cdot\delta\mathbf{B}^{\mathrm{vac}}=0$. For a single toroidal mode,
    the complex poloidal amplitude is reconstructed as $\delta B_{\theta}^{\mathrm{vac}}=\delta
    B_{\theta,\mathrm{real}}^{\mathrm{vac}}+i\,\delta B_{\theta,\mathrm{imag}}^{\mathrm{vac}}$
    and enters the toroidal dependence through the factor $\exp(i n\phi)$; this quantity
    is the real part of that mode amplitude, not a poloidal Fourier coefficient. It
    is distinct from the [imaginary-part counterpart](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part),
    the [radial](name:radial_perturbed_vacuum_magnetic_field_real_part) and [toroidal](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    vacuum projections, and the corresponding [plasma-region component](name:poloidal_perturbed_plasma_magnetic_field_real_part).


    Sign convention: Positive when the in-phase magnetic-field perturbation component
    points along $\hat{\mathbf{e}}_{\theta}$, the unit tangent toward increasing poloidal
    angle $\theta$ at fixed $\rho$ and $\phi$ in the specified flux-coordinate system
    $(\rho,\theta,\phi)$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links: []
  sources:
  - dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/real
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/mhd_linear.html#mhd_linear-time_slice-toroidal_mode-vacuum-b_field_perturbed-coordinate2-real
    dd_documentation:
