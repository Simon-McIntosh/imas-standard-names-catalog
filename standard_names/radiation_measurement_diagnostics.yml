- name: total_plasma_radiated_power
  kind: scalar
  status: active
  description: Total plasma radiated power is the electromagnetic power emitted by
    the full plasma, summed over all photon-emission mechanisms and integrated over
    the plasma volume.
  documentation: 'Total plasma radiated power is the total rate at which electromagnetic
    radiation carries energy away from the plasma. It is the full-plasma radiation
    loss quantity formed from all photon-emission mechanisms, including line radiation,
    bremsstrahlung, recombination, synchrotron, and any other radiative emission present.


    The defining relation is the volume integral of the local radiation power density
    over the plasma volume:


    $$

    P_{\mathrm{rad}} = \int_{V_{\mathrm{plasma}}} p_{\mathrm{rad}}(\mathbf{r})\, dV

    $$


    where $P_{\mathrm{rad}}$ is total plasma radiated power, $V_{\mathrm{plasma}}$
    is the full plasma volume, $p_{\mathrm{rad}}(\mathbf{r})$ is the [power density
    due to radiation](name:power_density_due_to_radiation) at position $\mathbf{r}$,
    and $dV$ is the volume element.


    The scope is the plasma as a whole; the aggregation convention is integration
    over the full plasma volume together with summation over all electromagnetic emission
    mechanisms and spectral contributions. It is not a region-restricted quantity
    such as [radiated power over core region](name:radiated_power_over_core_region),
    and it is not a diagnostic-channel signal or line-of-sight quantity.


    [Bremsstrahlung power](name:bremsstrahlung_power) is one radiative contribution
    when defined for the same plasma population, whereas total plasma radiated power
    includes all radiative contributions. [Total neutron power] is distinct because
    it is kinetic energy carried by neutrons rather than electromagnetic radiation.
    In an energy balance, total plasma radiated power is a non-negative emitted power
    that enters as a loss according to the balance convention; it is not itself a
    signed source term.'
  unit: W
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radiated_power_over_core_region
  sources:
  - kind: imas-dd
    ref: bolometer/power_radiated_total
    version: 4.1.0
  - kind: imas-dd
    ref: summary/global_quantities/power_radiated/value
    version: 4.1.0
- name: upper_photon_energy
  kind: scalar
  status: active
  description: High-energy boundary of an X-ray photon-acceptance band, defining the
    maximum photon energy included in a selected spectral window.
  documentation: 'Upper photon energy is the high-energy edge of an X-ray spectral
    band used to select photons or define an energy-resolved emissivity interval.
    It identifies a band boundary, not a representative photon energy for the band.


    For a band bounded by lower and upper photon energies, the accepted interval is
    defined by


    $$

    E_{\rm lower} \leq E_\gamma \leq E_{\rm upper}

    $$


    where $E_\gamma$ is the photon energy, $E_{\rm lower}$ is the lower photon-energy
    boundary, and $E_{\rm upper}$ is this quantity.


    The quantity applies to one selected X-ray spectral band used for channel counting
    or for an emissivity quantity. It is one upper boundary for that band; no summation
    or averaging over channels, bands, or photon energies is implied.


    Together with the corresponding lower boundary, it fixes the spectral window.
    It is distinct from [energy of detector pixel](name:energy_of_detector_pixel),
    which denotes a central or representative energy, while [upper bound energy of
    detector pixel](name:upper_bound_energy_of_detector_pixel) applies the same upper-edge
    concept specifically to an individual detector pixel.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links: []
  sources:
  - kind: imas-dd
    ref: hard_x_rays/channel/energy_band/upper_bound
    version: 4.1.0
  - kind: imas-dd
    ref: hard_x_rays/emissivity_profile_1d/upper_bound
    version: 4.1.0
  - kind: imas-dd
    ref: soft_x_rays/channel/energy_band/upper_bound
    version: 4.1.0
- name: vertical_coordinate_of_camera
  kind: scalar
  status: active
  description: "Signed vertical position of a camera\u2019s geometric center along\
    \ Z in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "This quantity is the signed vertical coordinate of a camera\u2019\
    s geometric center in the right-handed cylindrical $(R,\\phi,Z)$ frame. It specifies\
    \ the camera\u2019s position rather than its viewing direction or detector orientation.\n\
    \nThe coordinate is the projection of the camera-center position vector onto the\
    \ vertical basis direction:\n\n$$\nZ_{\\mathrm{cam}} = \\mathbf{r}_{\\mathrm{cam}}\
    \ \\cdot \\hat{\\mathbf{Z}}\n$$\n\nwhere $Z_{\\mathrm{cam}}$ is the camera-center\
    \ vertical coordinate, $\\mathbf{r}_{\\mathrm{cam}}$ is the position vector of\
    \ the camera\u2019s geometric center, and $\\hat{\\mathbf{Z}}$ is the vertical\
    \ unit vector. The frame is right-handed with basis $(\\hat{R},\\hat{\\phi},\\\
    hat{Z})$, where $R$ is major radius, $\\phi$ is toroidal angle, and $Z$ is vertical\
    \ height.\n\nThe scope is restricted to the geometric center of the camera as\
    \ a whole and represents one positional coordinate, with no averaging over pixels,\
    \ channels, viewing rays, or detector surfaces. It is distinct from [vertical\
    \ coordinate of an aperture](name:vertical_coordinate_of_aperture), which refers\
    \ to a different diagnostic object.\n\nTogether with the [radial coordinate of\
    \ the camera](name:radial_coordinate_of_camera), this quantity gives the camera\
    \ center\u2019s radial and vertical positional components in the cylindrical frame;\
    \ it does not describe camera orientation or angular imaging coverage."
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_camera
  sources:
  - kind: imas-dd
    ref: camera_x_rays/camera/centre/z
    version: 4.1.0
- name: vertical_coordinate_of_detector_pixel
  kind: scalar
  status: active
  description: "Vertical coordinate locating the geometric center of an individual\
    \ detector pixel in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'This quantity is the vertical position of the geometric center of
    one detector pixel. It locates that center along the cylindrical $Z$ direction
    rather than describing a pixel dimension, boundary, or radiation signal.


    The coordinate is defined in the right-handed cylindrical $(R, \phi, Z)$ frame,
    where $R$ is major radius, $\phi$ is toroidal angle, and $Z$ is vertical height.
    It applies separately to each detector pixel and is neither summed nor averaged
    over pixels, channels, detectors, or cameras.


    The quantity describes the center point of the pixel and excludes pixel span,
    edge coordinates, detector response, and any detector-local coordinate components.
    Together with the [radial coordinate of a detector pixel](name:radial_coordinate_of_detector_pixel),
    it locates the same pixel center in the cylindrical $R$-$Z$ plane. Its generic
    detector-pixel scope distinguishes it from the corresponding coordinate defined
    for a specifically identified [soft X-ray detector](name:vertical_coordinate_of_soft_xray_detector).'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:radial_coordinate_of_detector_pixel
  sources:
  - kind: imas-dd
    ref: camera_x_rays/camera/pixel_position/z
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_x_ray_crystal/channel/camera/pixel_position/z
    version: 4.1.0
- name: cold_neutral_temperature
  kind: scalar
  status: active
  description: Translational kinetic temperature, expressed as energy per particle,
    of the cold neutral population, based on random translational motion after removal
    of its bulk flow.
  documentation: 'Translational kinetic temperature, expressed as energy per particle,
    of the cold neutral population, based on random translational motion after removal
    of its bulk flow. It characterizes the low-energy neutral component associated
    with a selected hydrogen isotope.


    For the cold neutral population, the translational temperature is defined by


    $$

    T_c = \frac{2}{3 n_c}\int \frac{1}{2}m_c \lvert\mathbf{v}-\mathbf{u}_c\rvert^2
    f_c(\mathbf{v})\,d^3v

    $$


    Here $T_c$ is the cold-neutral translational temperature, $n_c$ is the cold-neutral
    number density, $m_c$ is the mass of a cold neutral atom, $\mathbf{v}$ is particle
    velocity, $\mathbf{u}_c$ is the bulk velocity of the cold neutral population,
    $f_c(\mathbf{v})$ is its velocity distribution, and $d^3v$ is differential volume
    in velocity space. The distribution is normalized by $n_c=\int f_c(\mathbf{v})\,d^3v$.


    The quantity applies to the low-energy neutral-atom population in the plasma edge
    or scrape-off layer and is specific to the selected hydrogen isotope. It is averaged
    over particles in that cold population, not summed with the energetic neutral
    population or with other isotopes. It excludes bulk flow energy and does not represent
    a temperature associated with an internal quantum or excitation state.


    This quantity is the cold-population specialization of [neutral temperature](name:neutral_temperature),
    while [hot neutral temperature](name:hot_neutral_temperature) applies the same
    translational definition to the energetic neutral population. Unlike [volume-averaged
    neutral temperature](name:volume_averaged_neutral_temperature), it is not defined
    by averaging the temperature over a plasma volume.'
  unit: eV
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:neutral_temperature
  - name:volume_averaged_neutral_temperature
  arguments:
  - name: neutral_temperature
    operator: cold
    operator_kind: qualifier
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/isotope_ratios/isotope/cold_neutrals_temperature
    version: 4.1.0
  - kind: imas-dd
    ref: spectrometer_visible/channel/polarization_spectroscopy/temperature_cold_neutrals
    version: 4.1.0
- name: ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Volume-averaged krypton density divided by volume-averaged electron
    density is the plasma-volume krypton abundance ratio relative to electrons, with
    krypton number density summed over all charge states.
  documentation: 'Volume-averaged krypton density divided by volume-averaged electron
    density is the plasma-volume krypton abundance ratio formed from the same averaging
    volume for krypton and electrons. The krypton density is the species-level krypton
    number density summed over all charge states, including neutral through fully
    stripped krypton.


    The ratio is defined by the quotient of the two volume averages:


    $$

    f_{\mathrm{Kr},V} = \frac{\langle n_{\mathrm{Kr}} \rangle_V}{\langle n_e \rangle_V}
    = \frac{V_p^{-1}\int_{V_p}\sum_{q=0}^{Z_{\mathrm{Kr}}} n_{\mathrm{Kr},q}(\mathbf{x})\,dV}{V_p^{-1}\int_{V_p}
    n_e(\mathbf{x})\,dV}

    $$


    where $f_{\mathrm{Kr},V}$ is this krypton abundance ratio, $\langle n_{\mathrm{Kr}}
    \rangle_V$ is the [volume-averaged krypton density](name:volume_averaged_krypton_density),
    $\langle n_e \rangle_V$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $V_p$ is the averaging plasma volume, $n_{\mathrm{Kr},q}$ is the krypton number
    density in charge state $q$, $q=0$ denotes neutral krypton, $q=Z_{\mathrm{Kr}}$
    denotes fully stripped krypton, $Z_{\mathrm{Kr}}$ is the nuclear charge of krypton,
    $n_e$ is the electron number density, $\mathbf{x}$ is spatial position, and $dV$
    is an infinitesimal volume element.


    This quantity applies to the krypton and electron populations inside the same
    plasma volume $V_p$. Its aggregation convention is volumetric averaging for both
    numerator and denominator; because krypton density is an extensive per-volume
    species amount, the species-level krypton density is charge-state-summed before
    the volume average is taken.


    It is not normalized by the maximum local electron density and is not a krypton-to-electron
    density ratio at a single position. It is also distinct from [line-averaged krypton
    density](name:line_averaged_krypton_density), which averages krypton density along
    a path rather than over the plasma volume.


    The numerator is exactly [volume-averaged krypton density](name:volume_averaged_krypton_density),
    and the denominator is exactly [volume-averaged electron density](name:volume_averaged_electron_density).
    Replacing the denominator by a maximum electron density gives the related but
    different [ratio of volume-averaged krypton density to maximum electron density](name:ratio_of_volume_averaged_krypton_density_to_volume_averaged_electron_density).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/krypton/value
    version: 4.1.0
- name: ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless elemental abundance ratio of charge-state-summed neon
    nuclei to free electrons, formed from their respective mean number densities inside
    the last closed flux surface.
  documentation: 'This quantity is the abundance of neon nuclei relative to free electrons,
    with both species represented by number densities averaged over the plasma volume
    enclosed by the last closed flux surface. Neon is summed over all charge states,
    so the quantity is an elemental composition ratio rather than a charge-state-specific
    abundance or a local density ratio.


    The ratio of volume-averaged densities is defined by


    $$

    \frac{\overline{n}_{\mathrm{Ne}}}{\overline{n}_e} = \frac{\displaystyle \frac{1}{V_p}\int_{V_p}
    n_{\mathrm{Ne}}(\mathbf{x})\,dV}{\displaystyle \frac{1}{V_p}\int_{V_p} n_e(\mathbf{x})\,dV}

    $$


    where $\overline{n}_{\mathrm{Ne}}$ is the [volume-averaged neon density](name:volume_averaged_neon_density),
    $\overline{n}_e$ is the [volume-averaged electron density](name:volume_averaged_electron_density),
    $n_{\mathrm{Ne}}(\mathbf{x})$ is the local neon nuclear number density summed
    over charge states, $n_e(\mathbf{x})$ is the local free-electron number density,
    $V_p$ is the plasma volume enclosed by the last closed flux surface, $\mathbf{x}$
    is position, and $dV$ is the volume element.


    Both operands use the same plasma volume and the same volume-averaging convention.
    This quantity is the ratio of the two global means, not the volume average of
    the local ratio $n_{\mathrm{Ne}}(\mathbf{x})/n_e(\mathbf{x})$; its denominator
    is specifically the parent [volume-averaged electron density](name:volume_averaged_electron_density),
    while its numerator is the corresponding [volume-averaged neon density](name:volume_averaged_neon_density).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:volume_averaged_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/neon/value
    version: 4.1.0
- name: ratio_of_volume_averaged_nitrogen_density_to_volume_averaged_electron_density
  kind: scalar
  status: active
  description: Dimensionless abundance ratio of charge-state-summed nitrogen nuclei
    to electrons, with both number densities averaged over the plasma volume bounded
    by the last closed flux surface.
  documentation: 'Dimensionless abundance ratio of charge-state-summed nitrogen nuclei
    to electrons, with both number densities averaged over the plasma volume bounded
    by the last closed flux surface. It represents the species-level nitrogen abundance
    relative to the free-electron population in the confined plasma.


    The defining ratio is:


    $$

    f_{\mathrm{N/e}} = \frac{\left\langle \sum_{q=0}^{7} n_{\mathrm{N}^{q+}} \right\rangle_V}{\left\langle
    n_e \right\rangle_V}

    $$


    where $f_{\mathrm{N/e}}$ is the nitrogen-to-electron abundance ratio, $n_{\mathrm{N}^{q+}}$
    is the nitrogen number density in charge state $q$, $q=0$ denotes neutral nitrogen,
    $q=7$ denotes fully stripped nitrogen, $n_e$ is the [electron density](name:electron_density),
    and $\langle\cdot\rangle_V$ denotes averaging over the plasma volume bounded by
    the last closed flux surface.


    The numerator is the charge-state-summed [nitrogen density](name:nitrogen_density)
    after volume averaging, equivalently the [volume-averaged nitrogen density](name:volume_averaged_nitrogen_density).
    The denominator is the [volume-averaged electron density](name:volume_averaged_electron_density)
    evaluated with the same volume-averaging convention.


    This quantity is a ratio of separate volume averages, not the volume average of
    a local nitrogen-to-electron density ratio. It is species-level and charge-state-summed,
    so it differs from any charge-state-resolved nitrogen abundance that retains a
    single ionization state in the numerator. It follows the same abundance-ratio
    convention as [ratio of volume-averaged neon density to volume-averaged electron
    density](name:ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density)
    and [ratio of volume-averaged iron density to volume-averaged electron density](name:ratio_of_iron_density_to_electron_density).'
  unit: '1'
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:electron_density
  - name:volume_averaged_electron_density
  - name:ratio_of_volume_averaged_neon_density_to_volume_averaged_electron_density
  - name:ratio_of_iron_density_to_electron_density
  sources:
  - kind: imas-dd
    ref: summary/composition/nitrogen/value
    version: 4.1.0
- name: wavelength_of_filter
  kind: scalar
  status: active
  description: Wavelength of a filter is the vacuum-wavelength spectral coordinate
    identifying the nominal center of the filter transmission band. It characterizes
    the central filter response, not the lower or upper bandpass edge.
  documentation: 'Wavelength of a filter is the vacuum-wavelength spectral coordinate
    identifying the nominal center of the filter transmission band. It is a property
    of the filter transmission response and denotes the central or nominal wavelength
    of the passband selected for spectral transmission.


    For a filter characteristic associated with temporal frequency $\nu_f$, the vacuum
    wavelength $\lambda_f$ is defined by:


    $$

    \lambda_f = \frac{c}{\nu_f}

    $$


    where $\lambda_f$ is the wavelength of the filter, $c$ is the speed of light in
    vacuum, and $\nu_f$ is the corresponding temporal frequency.


    This quantity applies to the filter passband response, not to radiation after
    propagation in a material medium and not to the rest-frame wavelength of an emitted
    or absorbed spectral feature such as the [wavelength of a spectral line](name:wavelength_of_spectral_line).
    It is distinct from the [lower wavelength of a filter](name:lower_wavelength_of_filter)
    and [upper wavelength of a filter](name:upper_wavelength_of_filter), which identify
    the short-wavelength and long-wavelength bandpass edges.


    The wavelength of a filter is also distinct from the [width of a filter]: that
    related quantity denotes a geometric extent of the filter window, not a spectral
    passband interval. The lower and upper wavelength quantities bound the transmitted
    spectral band, while the wavelength of a filter identifies its nominal central
    spectral coordinate.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_spectral_line
  - name:lower_wavelength_of_filter
  - name:upper_wavelength_of_filter
  sources:
  - kind: imas-dd
    ref: spectrometer_visible/channel/filter_spectrometer/filter/wavelength_central
    version: 4.1.0
- name: lower_wavelength_of_filter
  kind: scalar
  status: active
  description: Lower wavelength of a filter is the spectral coordinate, expressed
    as vacuum wavelength, that identifies the short-wavelength boundary of a diagnostic
    filter's transmitted spectral band.
  documentation: 'Lower wavelength of a filter is the vacuum-wavelength spectral coordinate
    that identifies the short-wavelength boundary of a diagnostic filter''s transmitted
    spectral band. It marks the high-photon-energy edge of the interval selected by
    the filter transmission response.


    For a lower-bound characteristic associated with temporal frequency $\nu_\mathrm{lower}$,
    the vacuum wavelength is defined by:


    $$

    \lambda_\mathrm{lower} = \frac{c}{\nu_\mathrm{lower}}

    $$


    where $\lambda_\mathrm{lower}$ is the lower filter-boundary vacuum wavelength,
    $c$ is the speed of light in vacuum, and $\nu_\mathrm{lower}$ is the temporal
    frequency corresponding to that boundary.


    This quantity applies to the transmitted spectral band of the filter and is a
    single lower-edge value, not a wavelength average, an integrated spectral quantity,
    or the complete transmission function. It is distinct from a spectral-line rest
    wavelength and from a wavelength defined inside a material medium.


    As the lower-bound member of [wavelength of a filter](name:wavelength_of_filter),
    it identifies one characteristic point of the filter response. Together with the
    [upper wavelength of a filter](name:upper_wavelength_of_filter), it defines the
    passband span represented by the [width of a filter].'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:wavelength_of_filter
  - name:upper_wavelength_of_filter
  arguments:
  - name: wavelength_of_filter
    operator: lower
    operator_kind: qualifier
  sources:
