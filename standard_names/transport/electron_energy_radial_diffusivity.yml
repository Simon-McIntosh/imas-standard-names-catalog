name: electron_energy_radial_diffusivity
status: draft
description: Effective radial diffusion coefficient for electron energy transport
  across magnetic flux surfaces.
documentation: "The electron energy radial diffusivity $\\chi_{e,r}$ (in m$^2$ s$^{-1}$)\
  \ parameterizes the diffusive component of the radial electron energy flux as $q_{e,r}^{\\\
  mathrm{diff}} = -n_e \\chi_{e,r} \\nabla_r T_e$, where $n_e$ is the electron density\
  \ (m$^{-3}$) and $T_e$ is the electron temperature (eV or J). This coefficient encapsulates\
  \ anomalous (turbulence-driven) and, in some models, neoclassical contributions\
  \ to cross-field electron heat transport. In core tokamak plasmas, typical values\
  \ are $\\chi_{e,r} \\sim 0.1$\u2013$5$ m$^2$ s$^{-1}$, increasing strongly in L-mode\
  \ and decreasing inside transport barriers (H-mode pedestal, ITBs). In the SOL and\
  \ edge, $\\chi_{e,r}$ may exceed $10$ m$^2$ s$^{-1}$ due to intermittent filamentary\
  \ transport. Edge codes evaluate this on generalized grids. Experimentally, $\\\
  chi_{e,r}$ is inferred from power balance or perturbative transport experiments.\
  \ See `radial_component_of_electron_energy_flux` for the flux driven by this coefficient\
  \ and `radial_component_of_ion_momentum_diffusivity` for the analogous ion momentum\
  \ transport quantity."
