- name: radial_coordinate_of_magnetic_axis
  kind: scalar
  status: active
  description: Major-radius coordinate of the magnetic axis, the O-point where the
    poloidal magnetic field vanishes and nested closed flux surfaces are centered.
  documentation: 'The major-radius coordinate of the magnetic axis is the value of
    $R$ locating the O-point of a nested-flux-surface equilibrium. It identifies the
    center of the magnetic flux surfaces and is distinct from the geometric axis of
    the plasma boundary.


    In the right-handed cylindrical $(R, \phi, Z)$ frame, the magnetic axis satisfies


    $$

    \nabla\psi(R_{\rm axis},Z_{\rm axis})=0

    $$


    where $\psi$ is the poloidal magnetic flux, and $R_{\rm axis}$ and $Z_{\rm axis}$
    are the radial and vertical coordinates of the O-point. The corresponding flux
    value is the [poloidal magnetic flux at the magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis),
    which provides the inner reference for the [normalized poloidal flux coordinate](name:normalized_poloidal_flux_coordinate).
    The [radial coordinate of the geometric axis](name:radial_coordinate_of_geometric_axis)
    instead describes the boundary geometry.'
  unit: m
  physics_domain: equilibrium
