- name: spectral_line_central_wavelength
  kind: scalar
  status: draft
  description: Vacuum wavelength at the line center of a spectral emission feature
    observed by a visible or UV spectrometer channel, used to identify the emitting
    ion species and charge state.
  documentation: 'The central wavelength $\lambda_0$ of a spectral emission line is
    the vacuum wavelength at which the line-integrated emissivity of a transition
    between two quantum states reaches its peak, as defined by atomic physics (e.g.,
    the Rydberg formula or quantum-mechanical transition energies). For Doppler-shifted
    measurements, the observed $\lambda_0$ may deviate from the rest-frame tabulated
    value $\lambda_{\rm rest}$ according to $\lambda_0 = \lambda_{\rm rest}(1 + v_\parallel/c)$,
    where $v_\parallel$ is the line-of-sight plasma flow velocity and $c$ is the speed
    of light; this shift is exploited in charge-exchange recombination spectroscopy
    and passive emission spectroscopy to infer impurity ion velocities. Typical values
    range from roughly 200 nm (UV transitions of highly ionized impurities such as
    C IV or B V) to 800 nm (near-infrared lines of neutral deuterium or lower charge-state
    impurities). The central wavelength is calibrated against known atomic reference
    standards (e.g., neon or argon pen lamps) and may differ from the nominal [optical
    filter central wavelength](name:optical_filter_central_wavelength) of the bandpass
    filter used to select the line.


    Sign convention: Positive when the wavelength value is greater than zero, as expected
    for any physical electromagnetic transition.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:optical_filter_central_wavelength
  constraints: []
