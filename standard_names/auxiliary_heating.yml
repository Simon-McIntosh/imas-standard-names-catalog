    enhanced_context:
      description: Cumulative absorbed wave power deposited on fast (non-thermal)
        electrons inside a given flux surface, computed by volume integration of the
        fast-electron power deposition density from the magnetic axis outward.
      kind: llm
- name: first_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  kind: scalar
  status: active
  description: "First local tangential coordinate of a point on the closed outline\
    \ of an electron-cyclotron launcher mirror is its signed displacement from the\
    \ mirror-local origin along the first local tangential direction. That direction\
    \ is the more horizontally directed in-plane mirror tangent oriented toward increasing\
    \ toroidal angle \u03C6 in the right-handed cylindrical (R, \u03C6, Z) frame,\
    \ where R is major radius, \u03C6 is toroidal angle, and Z is vertical height."
  documentation: 'First local tangential coordinate of a point on the closed outline
    of an electron-cyclotron launcher mirror is the signed scalar projection of the
    point displacement from the mirror-local origin onto the mirror''s first local
    tangential axis. The mirror-local orthonormal triad $(\hat{\mathbf t}_1, \hat{\mathbf
    t}_2, \hat{\mathbf n})$ has $\hat{\mathbf t}_1$ and $\hat{\mathbf t}_2$ tangent
    to the mirror outline plane and $\hat{\mathbf n}$ as the plasma-facing normal.
    The first local tangential axis $\hat{\mathbf t}_1$ is the more horizontally directed
    in-plane tangent, oriented toward increasing toroidal angle $\phi$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    The coordinate is defined by the Euclidean projection of the outline-point position
    relative to the mirror-local origin onto the first local tangential unit vector:


    $$

    \xi_1 = (\mathbf r - \mathbf r_0) \cdot \hat{\mathbf t}_1

    $$


    where $\xi_1$ is the first local tangential coordinate of the mirror outline point,
    $\mathbf r$ is the position vector of the outline point, $\mathbf r_0$ is the
    mirror-local origin, and $\hat{\mathbf t}_1$ is the first local tangential unit
    vector.


    This coordinate is paired with the [second local tangential coordinate of the
    electron-cyclotron launcher mirror](name:second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror),
    which uses $\hat{\mathbf t}_2$ in the same mirror-local tangential plane. The
    second local tangential direction is fixed by $\hat{\mathbf t}_2 = \hat{\mathbf
    n} \times \hat{\mathbf t}_1$, so $\hat{\mathbf t}_1 \times \hat{\mathbf t}_2 =
    \hat{\mathbf n}$. This local coordinate is distinct from locating the mirror in
    the right-handed cylindrical $(R, \phi, Z)$ frame through quantities such as the
    [radial centroid of the electron-cyclotron launcher mirror](name:radial_centroid_of_electron_cyclotron_launcher_mirror)
    and the [vertical coordinate of the electron-cyclotron launcher mirror](name:vertical_coordinate_of_electron_cyclotron_launcher_mirror).


    Sign convention: Positive when the displacement from the mirror-local origin to
    the outline point has a component in the direction of $\hat{\mathbf t}_1$.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:second_local_tangential_coordinate_of_electron_cyclotron_launcher_mirror
  sources:
  - dd_path: ec_launchers/mirror/geometry/outline/x1
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ec_launchers.html#ec_launchers-mirror-geometry-outline-x1
    dd_documentation:
      leaf: Positions along x1 axis
      parent_path: ec_launchers/mirror/geometry/outline
      parent: Irregular outline of the object in the (X1, X2) coordinate system, used
        only if geometry_type/index=1. Repeat the first point since this is a closed
        contour
      data_type: FLT_1D
      unit: m
      coordinates:
      - 1...N
    enhanced_context:
      description: Positions along the x1 axis of the irregular outline defining the
        EC launcher mirror geometry in its reference position, in the local (X1, X2)
        coordinate system. Forms part of the closed contour describing the mirror
        cross-sectional shape.
      kind: llm
- name: fraction_of_wave_beam
  kind: scalar
  status: active
  description: Dimensionless fraction of the total launched wave-beam power carried
    by a specific electromagnetic polarization mode, ranging from zero (no power in
    that mode) to unity (entirely that mode).
  documentation: 'In magnetized plasma wave heating, an electromagnetic beam injected
    into the plasma can be decomposed into orthogonal polarization eigenmodes whose
    power partition governs both the coupling efficiency and the spatial deposition
    profile. This quantity expresses the power fraction residing in one named eigenmode
    relative to the total beam power, providing a dimensionless measure of the modal
    purity of the launched beam.


    For a beam composed of two complementary orthogonal modes, the mode fractions
    satisfy


    $$

    f_\mathrm{mode} = \frac{P_\mathrm{mode}}{P_\mathrm{total}}

    $$


    where $P_\mathrm{mode}$ is the power in the specified polarization mode and $P_\mathrm{total}$
    is the total launched beam power, so fractions for complementary modes sum to
    unity.


    For electron-cyclotron heating, the two principal eigenmodes are the ordinary
    mode (O-mode, with electric field parallel to the equilibrium magnetic field at
    perpendicular incidence) and the extraordinary mode (X-mode); the specific ordinary-mode
    case is captured by [ordinary_mode_fraction_of_wave_beam](name:ordinary_mode_fraction_of_wave_beam).
    The mode fraction is determined by the launch polarization state of the antenna
    or mirror system and is set as a launch parameter in ray-tracing or beam-tracing
    calculations.


    Values span $[0, 1]$; a value of 1 indicates a purely single-mode launch, while
    intermediate values arise from imperfect polarization optics or intentional mixed-mode
    injection.'
  unit: '1'
  physics_domain: auxiliary_heating
  links:
  - name:ordinary_mode_fraction_of_wave_beam
- name: frequency_of_electron_cyclotron_heating_antenna
  kind: scalar
  status: active
  description: Operating radio frequency of an electron-cyclotron heating antenna
    that sets the electron-cyclotron resonance conditions for its emitted electromagnetic
    wave.
  documentation: 'The operating frequency is the temporal frequency of the electromagnetic
    wave generated by the antenna. It determines the magnetic-field strengths at which
    the wave can resonantly interact with electrons.


    For the nonrelativistic electron-cyclotron harmonic condition,


    $$

    2\pi f_{\rm rf} = \omega_{\rm rf} = s\frac{eB}{m_e}

    $$


    where $f_{\rm rf}$ is the radio-frequency drive frequency, $\omega_{\rm rf}$ is
    the corresponding angular frequency, $s$ is the positive integer harmonic number,
    $e$ is the elementary-charge magnitude, $B$ is the local magnetic-field magnitude,
    and $m_e$ is the electron mass.


    This quantity describes the antenna drive frequency, not its emitted power, feed
    voltage, or beam-steering angle. It is distinct from the [ion-cyclotron heating
    antenna frequency](name:frequency_of_ion_cyclotron_heating_antenna), which selects
    ion-cyclotron rather than electron-cyclotron resonance conditions.'
  unit: Hz
  physics_domain: auxiliary_heating
  links:
  - name:frequency_of_ion_cyclotron_heating_antenna
  sources:
