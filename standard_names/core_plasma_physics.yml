- name: toroidal_component_of_plasma_angular_momentum_density
  kind: scalar
  status: draft
  description: Toroidal projection of angular momentum per unit volume of the plasma,
    summed over all ion species and electrons.
  documentation: "The toroidal angular momentum density $\\ell_\\phi$ is defined as\
    \ the volume density of toroidal angular momentum carried by the plasma, $\\ell_\\\
    phi = \\sum_s m_s n_s v_{\\phi,s} R$, where $m_s$ is the particle mass of species\
    \ $s$, $n_s$ is the number density, $v_{\\phi,s}$ is the toroidal fluid velocity,\
    \ and $R$ is the major radius in the cylindrical $(R, \\phi, Z)$ frame. Integrating\
    \ $\\ell_\\phi$ over a plasma volume recovers the total toroidal angular momentum,\
    \ whose rate of change is set by the net toroidal torque as expressed in the angular\
    \ momentum theorem $\\partial_t \\ell_\\phi = \\nabla \\cdot \\boldsymbol{\\Pi}_\\\
    phi + T_\\phi$, where $\\boldsymbol{\\Pi}_\\phi$ is the toroidal momentum flux\
    \ tensor and $T_\\phi$ is the local torque density. Typical core values in tokamak\
    \ H-mode plasmas lie in the range $10^{-2}$\u2013$1\\;\\mathrm{kg\\,m^{-2}\\,s^{-1}}$,\
    \ scaling with plasma density and toroidal rotation speed. This quantity is closely\
    \ related to [toroidal_component_of_total_plasma_angular_momentum_density](name:toroidal_component_of_total_plasma_angular_momentum_density),\
    \ which uses an explicit `total` qualifier; the present name is equivalent when\
    \ all species are summed. The cumulative surface-enclosed version of its source\
    \ is given by [toroidal_component_of_plasma_torque_inside_flux_surface](name:toroidal_component_of_plasma_torque_inside_flux_surface),\
    \ and the volume-integrated torque is described by [toroidal_component_of_plasma_torque](name:toroidal_component_of_plasma_torque).\n\
    \nSign convention: Positive when $\\ell_\\phi$ is directed in the direction of\
    \ increasing toroidal angle $\\phi$."
  unit: kg.m.s^-1
  physics_domain: core_plasma_physics
  links:
  - name:toroidal_component_of_total_plasma_angular_momentum_density
  - name:toroidal_component_of_plasma_torque_inside_flux_surface
  - name:toroidal_component_of_plasma_torque
  constraints: []
  sources:
  - id: dd:sawteeth/profiles_1d/momentum_tor
    dd_path: sawteeth/profiles_1d/momentum_tor
    status: composed
- name: toroidal_component_of_plasma_torque
  kind: scalar
  status: draft
  description: Net toroidal torque exerted on the plasma, integrated over the entire
    plasma volume, quantifying the total source rate of toroidal angular momentum.
  documentation: "The toroidal component of plasma torque, $\\tau_\\phi = \\int_V\
    \ \\mathbf{r} \\times \\mathbf{F} \\cdot \\hat{\\phi}\\, dV$, represents the volume-integrated\
    \ rate of toroidal angular momentum injection into the plasma, where $\\mathbf{F}$\
    \ is the body force density, $\\mathbf{r}$ is the position vector, and $\\hat{\\\
    phi}$ is the unit vector in the direction of increasing toroidal angle $\\phi$.\
    \ Sources of toroidal torque include neutral beam injection (NBI), which transfers\
    \ momentum from fast neutral atoms to plasma ions, as well as electromagnetic\
    \ torques from resonant magnetic perturbations and neoclassical toroidal viscosity.\
    \ The balance of toroidal angular momentum governs plasma rotation, which in turn\
    \ stabilizes resistive wall modes and influences the radial electric field and\
    \ $\\mathbf{E}\\times\\mathbf{B}$ shear stabilization of turbulence. This global\
    \ quantity is the volume integral of local torque-density contributions; the cumulative\
    \ enclosed torque as a function of flux surface is tracked by [toroidal component\
    \ of plasma torque inside flux surface](name:toroidal_component_of_plasma_torque_inside_flux_surface),\
    \ while [toroidal component of torque](name:toroidal_component_of_torque) provides\
    \ the equivalent quantity attributed to a specific plasma source. Typical values\
    \ in NBI-heated tokamaks range from $10^3$ to $10^5$ N\xB7m depending on NBI power\
    \ and injection geometry.\n\nSign convention: Positive when the net torque acts\
    \ in the direction of increasing toroidal angle $\\phi$ (counter-clockwise when\
    \ viewed from above $+\\hat{Z}$)."
  unit: kg.m^2.s^-2
  physics_domain: core_plasma_physics
  links:
  - name:toroidal_component_of_plasma_torque_inside_flux_surface
  - name:toroidal_component_of_torque
  constraints: []
