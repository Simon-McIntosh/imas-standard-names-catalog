- name: electron_density
  kind: scalar
  status: draft
  description: Local number of electrons per unit volume, including thermal and non-thermal
    electron populations participating in plasma quasineutrality.
  documentation: 'Electron density is the local particle concentration of the full
    electron population, including both [thermal electrons](name:thermal_electron_density)
    and [fast electrons](name:fast_electron_density) when present. It sets collisionality,
    plasma frequency, charge balance with [ion density](name:ion_density), and the
    pressure contribution combined with [electron temperature](name:electron_temperature)
    in [electron pressure](name:electron_pressure).


    For an electron phase-space distribution $f_e(\mathbf{x},\mathbf{v},t)$, the density
    $n_e(\mathbf{x},t)$ is the zeroth velocity moment:


    $$

    n_e(\mathbf{x},t) = \int f_e(\mathbf{x},\mathbf{v},t)\,d^3v

    $$


    where $\mathbf{x}$ is position, $\mathbf{v}$ is particle velocity, and $f_e$ is
    normalized so that the integral gives $n_e$ in m$^{-3}$.


    Electron density is measured by interferometry, reflectometry, Thomson scattering,
    and Langmuir probes in colder boundary plasmas; it is also inferred in transport
    modeling from particle balance and quasineutrality. Core tokamak values commonly
    span $0.1-2 \times 10^{20}$ m$^{-3}$, while scrape-off-layer values range from
    $10^{17}$ to $10^{20}$ m$^{-3}$ depending on fueling, confinement regime, and
    divertor conditions.


    Sign convention: Positive when the electron phase-space distribution has a nonzero
    integral over velocity space.'
  unit: m^-3
  physics_domain: transport
  links:
