name: volume_averaged_neon_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of neon ions, a noble gas impurity
  commonly seeded for radiative divertor operation.
documentation: "The volume-averaged neon ion number density $\\langle n_{\\mathrm{Ne}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{Ne}}(\\mathbf{r})\\, dV$ where $n_{\\mathrm{Ne}}$\
  \ is the local neon ion density in m$^{-3}$ summed over all charge states ($\\mathrm{Ne}^{1+}$\
  \ through $\\mathrm{Ne}^{10+}$) and $V$ is the plasma volume in m$^3$. Neon ($Z\
  \ = 10$) is deliberately seeded to enhance radiative dissipation in the divertor\
  \ and edge region, mitigating heat-flux loads on plasma-facing components; typical\
  \ concentrations are $\\sim 10^{-3}$\u2013$10^{-2}$ of $n_e$, corresponding to $\\\
  langle n_{\\mathrm{Ne}} \\rangle_V \\sim 10^{16}$\u2013$10^{18}$ m$^{-3}$. VUV spectroscopy\
  \ on Ne line emissions and charge exchange recombination spectroscopy provide profile\
  \ measurements. Neon radiation peaks at $T_e \\sim 30$\u2013$50$ eV, making it effective\
  \ for boundary cooling while minimizing core radiative losses compared to higher-$Z$\
  \ species. See also `volume_averaged_krypton_ion_number_density` and `volume_averaged_nitrogen_ion_number_density`."
