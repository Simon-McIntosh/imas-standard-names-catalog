- name: toroidal_flux_surface_averaged_xenon_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: Flux-surface-averaged toroidal component of xenon ion bulk flow velocity
    at the plasma boundary (last closed flux surface).
  documentation: 'The flux-surface-averaged toroidal xenon velocity at the plasma
    boundary quantifies the mean azimuthal flow of xenon impurity ions around the
    torus, averaged along the last closed flux surface (separatrix). Xenon ($Z=54$)
    is a heavy noble-gas impurity used in radiative-mantle experiments to spread divertor
    heat loads, and its toroidal rotation reflects momentum balance between collisional
    coupling to the bulk plasma, neoclassical forces, and external toroidal momentum
    input.


    The flux-surface average of the toroidal velocity component $v_\phi^\mathrm{Xe}$
    is defined as:


    $$

    \langle v_\phi^\mathrm{Xe} \rangle = \frac{\oint v_\phi^\mathrm{Xe} \, B_p^{-1}
    \, dl}{\oint B_p^{-1} \, dl}

    $$


    where $B_p$ is the poloidal magnetic field magnitude and the line integrals are
    taken along the plasma boundary contour.


    Toroidal impurity velocities at the separatrix are measured primarily by charge
    exchange recombination spectroscopy (CXRS), resolving Doppler shifts from charge
    exchange between injected neutral beam atoms and Xe ions; a poloidally distributed
    array of sightlines is necessary to reconstruct the flux-surface average. The
    non-averaged counterpart is given by [toroidal_xenon_velocity_at_plasma_boundary](name:toroidal_xenon_velocity_at_plasma_boundary),
    while analogous averaged quantities for lighter seeding species include [toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_neon_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_argon_velocity_at_plasma_boundary).


    Sign convention: Positive when the xenon ion flow is directed in the sense of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
