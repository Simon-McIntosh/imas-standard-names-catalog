- name: thermal_electron_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the thermal (bulk) electron population
    from a coherent wave, integrated over the plasma volume.
  documentation: The thermal electron wave absorbed power $P_{\rm abs,e,th}$ quantifies
    the volume-integrated rate at which wave energy is transferred to the bulk (Maxwellian)
    electron population from a coherent RF wave. This quantity is central to the power
    balance of RF heating schemes such as electron cyclotron resonance heating (ECRH)
    and lower hybrid current drive (LHCD), where absorption preferentially targets
    the thermal electrons via collisional or quasi-linear Landau damping mechanisms.
    Typical values range from tens of kilowatts in small-scale experiments to several
    megawatts in large tokamaks operating with full ECRH power. It is computed by
    wave-tracing or full-wave codes as the integral $P_{\rm abs,e,th} = \int Q_{\rm
    e,th}\, dV$, where $Q_{\rm e,th}$ is the local absorbed power density on thermal
    electrons and $V$ is the plasma volume. The complement quantity for suprathermal
    electrons is [fast_electron_wave_absorbed_power](name:fast_electron_wave_absorbed_power),
    and the analogous quantity for the bulk ion population is [thermal_ion_wave_absorbed_power](name:thermal_ion_wave_absorbed_power).
    The total absorbed power across all species is given by [wave_absorbed_power](name:wave_absorbed_power).
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_wave_absorbed_power
  - name:thermal_ion_wave_absorbed_power
  - name:wave_absorbed_power
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/global_quantities/electrons/power_thermal
    dd_path: waves/coherent_wave/global_quantities/electrons/power_thermal
    status: composed
- name: thermal_electron_wave_absorbed_power_density
  kind: scalar
  status: draft
  description: Flux-surface-averaged absorbed wave power per unit volume deposited
    on the thermal electron population by a coherent wave, summed over all toroidal
    mode contributions.
  documentation: "The thermal electron wave absorbed power density $P_{\\rm abs,th,e}$\
    \ quantifies the local wave energy deposition rate per unit volume transferred\
    \ to the bulk (thermal) electron population from a coherent electromagnetic wave,\
    \ flux-surface averaged at each radial location. It arises from wave\u2013particle\
    \ resonance mechanisms such as electron cyclotron resonance (ECR) damping and\
    \ Landau damping, where the wave electric field does net work on thermal electrons\
    \ satisfying the resonance condition $\\omega - k_\\parallel v_\\parallel = n\\\
    Omega_{ce}$, with $\\omega$ the wave frequency, $k_\\parallel$ the parallel wavenumber,\
    \ $v_\\parallel$ the electron parallel velocity, $n$ an integer, and $\\Omega_{ce}\
    \ = eB/m_e$ the electron cyclotron frequency. Summing $P_{\\rm abs,th,e}$ over\
    \ the plasma volume recovers the total power absorbed by thermal electrons, which\
    \ relates to the cumulative integral [thermal_electron_wave_absorbed_power_inside_flux_surface](name:thermal_electron_wave_absorbed_power_inside_flux_surface).\
    \ This quantity is distinct from [wave_absorbed_power_density](name:wave_absorbed_power_density),\
    \ which aggregates contributions from all species, and from [fast_ion_wave_absorbed_power_density](name:fast_ion_wave_absorbed_power_density),\
    \ which captures deposition on the non-thermal ion population. The toroidal-mode-resolved\
    \ counterpart is [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density).\
    \ Typical peak values in ECR-heated tokamak plasmas range from $10^5$ to $10^7$\
    \ W m$^{-3}$ in the core deposition layer, depending on launched power and plasma\
    \ density."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:thermal_electron_wave_absorbed_power_inside_flux_surface
  - name:wave_absorbed_power_density
  - name:fast_ion_wave_absorbed_power_density
  - name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_density
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_density_thermal
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_density_thermal
    status: composed
- name: thermal_electron_wave_absorbed_power_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume-integrated absorbed wave power on the thermal electron
    population enclosed within a given flux surface, obtained as the volume integral
    of the thermal electron wave absorption power density from the plasma center to
    that surface.
  documentation: "The thermal electron wave absorbed power inside a flux surface,\
    \ $P_{\\rm abs,e,th}(\\psi)$, is defined as the cumulative volume integral of\
    \ the local thermal electron wave absorption power density $Q_{\\rm abs,e,th}$\
    \ from the magnetic axis to the flux surface labeled by poloidal flux $\\psi$:\n\
    \n$$P_{\\rm abs,e,th}(\\psi) = \\int_0^\\psi Q_{\\rm abs,e,th}\\, dV$$\n\nwhere\
    \ $dV$ is the volume element. This quantity captures how wave energy from a coherent\
    \ electromagnetic wave (such as electron cyclotron, lower hybrid, or ion cyclotron\
    \ heating) is deposited in the thermal electron population as a function of the\
    \ enclosed plasma volume. It provides a radially cumulative picture that is directly\
    \ useful for energy balance analysis and transport modeling. Typical values range\
    \ from near zero at the plasma edge to the full single-wave thermal-electron heating\
    \ power (order 1\u201310 MW) at the outermost closed flux surface in current fusion\
    \ devices. The thermal electron contribution is distinguished from the fast ion\
    \ and thermal ion channels, which are tracked separately by [fast_ion_wave_absorbed_power_inside_flux_surface](name:fast_ion_wave_absorbed_power_inside_flux_surface)\
    \ and [thermal_ion_wave_absorbed_power_inside_flux_surface](name:thermal_ion_wave_absorbed_power_inside_flux_surface);\
    \ the sum over all species corresponds to [wave_absorbed_power_inside_flux_surface](name:wave_absorbed_power_inside_flux_surface).\
    \ The radial derivative of this quantity yields the flux-surface-averaged local\
    \ deposition profile tracked by [thermal_electron_wave_absorbed_power_density](name:thermal_electron_wave_absorbed_power_density).\
    \ A per-toroidal-mode-resolved variant is provided by [per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface](name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface)."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_wave_absorbed_power_inside_flux_surface
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
  - name:wave_absorbed_power_inside_flux_surface
  - name:thermal_electron_wave_absorbed_power_density
  - name:per_toroidal_mode_of_thermal_electron_wave_absorbed_power_inside_flux_surface
  constraints: []
  sources:
  - id: dd:waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    dd_path: waves/coherent_wave/profiles_1d/electrons/power_inside_thermal
    status: composed
- name: thermal_ion_wave_absorbed_power
  kind: scalar
  status: draft
  description: Total wave power absorbed by the thermal (bulk) ion population from
    a coherent wave, integrated over the entire plasma volume.
  documentation: "The thermal ion wave absorbed power $P_{\\rm abs,th,i}$ is the volume-integrated\
    \ power transferred from a coherent electromagnetic wave to the thermal bulk ion\
    \ population via wave\u2013particle interactions such as ion cyclotron resonance\
    \ or transit-time magnetic pumping. It represents the collisional channel of wave\
    \ heating that directly raises the thermal energy of the ion distribution, in\
    \ contrast to power deposited on fast (suprathermal) ions (see [fast_ion_wave_absorbed_power](name:fast_ion_wave_absorbed_power))\
    \ or on the thermal electron population (see [thermal_electron_wave_absorbed_power](name:thermal_electron_wave_absorbed_power)).\n\
    \nThe quantity is obtained by integrating the local absorbed power density $p_{\\\
    rm abs,th,i}(\\psi)$ over the plasma volume: $P_{\\rm abs,th,i} = \\int p_{\\\
    rm abs,th,i}\\, dV$, where $\\psi$ denotes the poloidal magnetic flux coordinate.\
    \ In ICRH scenarios this power is resonantly deposited near the ion cyclotron\
    \ frequency $\\omega = Z_i e B / m_i$, with typical values of order 1\u201320\
    \ MW in present-day tokamak experiments. The flux-surface-resolved cumulative\
    \ form is given by [thermal_ion_wave_absorbed_power_inside_flux_surface](name:thermal_ion_wave_absorbed_power_inside_flux_surface),\
    \ and the quantity resolved per toroidal mode number is [per_toroidal_mode_of_thermal_ion_wave_absorbed_power](name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power).\
    \ The absorbed power is computed by wave-tracing or full-wave codes and is a primary\
    \ input to power-balance and transport analyzes."
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:fast_ion_wave_absorbed_power
  - name:thermal_electron_wave_absorbed_power
  - name:thermal_ion_wave_absorbed_power_inside_flux_surface
  - name:per_toroidal_mode_of_thermal_ion_wave_absorbed_power
  constraints: []
