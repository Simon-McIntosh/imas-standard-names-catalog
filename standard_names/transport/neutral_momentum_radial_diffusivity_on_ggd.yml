name: neutral_momentum_radial_diffusivity_on_ggd
status: draft
description: Effective radial diffusion coefficient for neutral momentum transport,
  discretized on a general grid description (GGD) mesh.
documentation: "The neutral momentum radial diffusivity $\\mu_n$ (in $\\mathrm{m^2\\\
  ,s^{-1}}$) enters the viscous momentum transport equation for neutrals, $\\Pi_n\
  \ = -n_n m_n \\mu_n \\nabla v_n$, where $n_n$ is the neutral density, $m_n$ the\
  \ neutral mass, and $v_n$ the neutral fluid velocity. One scalar value is provided\
  \ per GGD grid element, permitting spatially resolved momentum diffusion across\
  \ the edge, SOL, and divertor in fluid neutral models within codes such as SOLPS-ITER\
  \ and SOLEDGE2D. Neutral momentum transport influences flow patterns near recycling\
  \ surfaces and pumping geometry. Typical magnitudes are of order $0.01$\u2013$10\\\
  ,\\mathrm{m^2\\,s^{-1}}$, similar to the neutral particle diffusivity. See `ion_momentum_radial_diffusivity`\
  \ for the charged-species counterpart and `neutral_particle_radial_diffusivity_on_ggd`\
  \ for the neutral particle channel."
validity_domain: ''
