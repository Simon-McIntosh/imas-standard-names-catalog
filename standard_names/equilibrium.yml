- name: poloidal_magnetic_flux_at_flux_surface
  kind: scalar
  status: active
  description: "Poloidal magnetic flux \u03C8 at a point in the poloidal cross-section\
    \ of an axisymmetric equilibrium, constant on each nested flux surface and serving\
    \ as a natural radial coordinate between the magnetic axis and the plasma boundary."
  documentation: "The poloidal magnetic flux $\\psi$ is the total magnetic flux threading\
    \ a horizontal disk of radius $R$ centered on the toroidal symmetry axis at height\
    \ $Z$:\n\n$$\n\\psi(R, Z) = \\int_0^R B_Z(R', Z)\\, 2\\pi R' \\, dR'\n$$\n\nwhere\
    \ $B_Z$ is the vertical component of the magnetic field in the right-handed cylindrical\
    \ $(R, \\phi, Z)$ frame and $R$ is the major radius from the symmetry axis. Because\
    \ $\\psi$ is constant on each nested flux surface, it provides a natural radial\
    \ coordinate for axisymmetric equilibria, varying monotonically between its value\
    \ at the [magnetic axis](name:poloidal_magnetic_flux_at_magnetic_axis) and its\
    \ value at the [plasma boundary](name:poloidal_magnetic_flux_at_plasma_boundary).\
    \ At topological critical points of the poloidal flux map \u2014 O-points (local\
    \ extrema of $\\psi$, including the primary magnetic axis) and X-points (saddle\
    \ points where $\\nabla\\psi = 0$ but $\\psi$ is not a local extremum, including\
    \ the separatrix X-point) \u2014 the value of $\\psi$ identifies the flux level\
    \ of that node within the equilibrium topology, characterizing the connectivity\
    \ structure of the poloidal flux contours.\n\nSign convention: Positive when the\
    \ net vertical magnetic flux threading the horizontal integration disk points\
    \ in the $+Z$ direction."
  unit: Wb
  physics_domain: equilibrium
  links:
  - name:poloidal_magnetic_flux_at_magnetic_axis
  - name:poloidal_magnetic_flux_at_plasma_boundary
  sources:
  - dd_path: core_profiles/profiles_1d/grid/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_profiles.html#core_profiles-profiles_1d-grid-psi
    dd_documentation:
      leaf: Poloidal magnetic flux
      parent_path: core_profiles/profiles_1d/grid
      parent: Radial grid
      data_type: FLT_1D
      unit: Wb
      coordinates:
      - core_profiles/profiles_1d/grid/rho_tor_norm
    enhanced_context:
      description: "Poloidal magnetic flux (\u03C8, psi) as a function of the radial\
        \ grid coordinate in the core plasma profiles. Used as a flux-surface coordinate\
        \ for mapping and interpolating radial profiles of plasma quantities."
      kind: llm
  - dd_path: core_transport/model/profiles_1d/grid_flux/psi
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/core_transport.html#core_transport-model-profiles_1d-grid_flux-psi
    dd_documentation:
