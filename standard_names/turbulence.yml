- name: parity_of_gyrokinetic_eigenmode
  kind: scalar
  status: draft
  description: Discrete symmetry label of a gyrokinetic perturbed-field eigenfunction
    in flux coordinates (rho, theta, phi), with +1 for even symmetry and -1 for odd
    symmetry under poloidal-angle reflection about the outboard midplane.
  documentation: 'Parity of a gyrokinetic eigenmode is the discrete even/odd symmetry
    label of the mode''s perturbed-field eigenfunction under reflection of poloidal
    angle about the outboard midplane. It is defined in flux coordinates $(\rho,\theta,\phi)$,
    with $\theta=0$ at the outboard midplane: $P=+1$ denotes even, symmetric parity,
    and $P=-1$ denotes odd, antisymmetric parity.


    The label is defined by the reflection relation for a representative perturbed-field
    eigenfunction $\tilde{q}$ of the mode:


    $$

    \tilde{q}(\rho,-\theta,\phi) = P\,\tilde{q}(\rho,\theta,\phi), \qquad P \in \{+1,-1\}

    $$


    where $\tilde{q}$ is the complex eigenfunction amplitude in flux coordinates $(\rho,\theta,\phi)$
    and $P$ is the parity label. The canonical value convention is only $+1$ for even
    parity and $-1$ for odd parity; a 0/1 encoding is not part of this definition.


    In practice, the parity is determined from a linear gyrokinetic eigenmode by comparing
    the perturbed-field eigenfunction at mirrored poloidal angles $+\theta$ and $-\theta$
    at the same radial and toroidal coordinates. The arbitrary overall complex normalization
    of the eigenmode does not change the parity. If the reflected eigenfunction is
    neither equal nor equal with opposite sign within the relevant numerical tolerance,
    the mode is best regarded as having no definite parity rather than being assigned
    an intermediate value.


    The allowed values are exactly $+1$ and $-1$. Even parity means the perturbation
    has the same complex amplitude at mirrored poloidal angles, while odd parity means
    it has the opposite complex amplitude and, for a continuous eigenfunction, a node
    at the outboard midplane.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:perturbed_parity_of_gyrokinetic_eigenmode
  - name:perturbed_parity
  - name:normalized_frequency_of_gyrokinetic_eigenmode
- name: particle_effective_energy
  kind: scalar
  status: draft
  description: Effective particle energy is the guiding-center single-particle energy
    combining kinetic energy parallel to the magnetic field with magnetic-moment perpendicular
    energy. The parent concept covers the physical energy and dimensionless forms
    normalized by a reference thermal energy.
  documentation: 'Effective particle energy is the single-particle guiding-center
    energy associated with motion along the magnetic field and gyromotion perpendicular
    to it. It is an energy-like phase-space quantity used to characterize particle
    distribution functions and turbulent fluctuations. The concept is not inherently
    normalized; dimensionless forms are obtained by scaling the physical energy by
    a reference thermal energy.


    For species $s$, the physical effective energy is commonly written as the sum
    of parallel kinetic energy and magnetic-moment energy:


    $$

    \mathcal{E}_{\mathrm{eff},s} = \frac{1}{2} m_s v_\parallel^2 + \mu B

    $$


    where $m_s$ is the particle mass, $v_\parallel$ is the velocity component parallel
    to the magnetic field, $\mu$ is the magnetic moment, and $B$ is the magnetic-field
    magnitude. A dimensionless quantity such as [normalized effective particle energy]
    is obtained by dividing $\mathcal{E}_{\mathrm{eff},s}$ by a chosen reference thermal
    energy.


    In turbulence and gyrokinetic calculations, effective particle energy is computed
    from the phase-space variables, species mass, and local magnetic-field magnitude
    rather than measured directly. It is used to parameterize kinetic distribution
    functions, separate thermal and suprathermal particle populations, and express
    velocity-space dependence in a compact form.


    For bulk thermal particles, the physical effective energy is typically of the
    order of the species thermal energy, from about 10 eV-20 keV in common edge-to-core
    fusion-plasma conditions, while energetic-particle populations can extend to much
    higher energies. In normalized form, thermal particles usually have values of
    order 1, with suprathermal tails extending to 10 or more.'
  unit: '1'
  physics_domain: turbulence
  links: []
  arguments:
  - name: effective_energy
    operator: particle
    operator_kind: qualifier
- name: normalized_particle_effective_energy
  kind: scalar
  status: draft
  description: Normalized effective particle energy is the effective velocity-space
    energy of one species divided by a strictly positive species reference thermal
    energy. The reference is an energy scale, such as electronvolts or Boltzmann constant
    times a thermodynamic temperature, so the result is dimensionless.
  documentation: 'Normalized effective particle energy is a dimensionless energy coordinate
    for a particle species in gyrokinetic normalization. It represents the physical
    effective particle energy scaled by a strictly positive species reference thermal
    energy, so particles with energies comparable to that reference have values of
    order unity. The reference scale has units of energy; if it is derived from a
    thermodynamic temperature in kelvin, the energy scale is Boltzmann constant times
    that temperature.


    The normalization and a common guiding-center decomposition of the physical effective
    energy are


    $$

    \bar{\mathcal{E}}_s = \frac{\mathcal{E}_s}{E_{\mathrm{ref},s}}, \qquad \mathcal{E}_s
    = \frac{1}{2} m_s v_{\parallel}^2 + \mu B + U_{\mathrm{eff},s}

    $$


    where $s$ labels the species, $\mathcal{E}_s$ is the physical effective particle
    energy in joules, and $E_{\mathrm{ref},s} > 0$ is the species reference thermal
    energy in joules. Here $m_s$ is species mass in kilograms, $v_{\parallel}$ is
    velocity parallel to the magnetic field in meters per second, $\mu$ is magnetic
    moment in joules per tesla, $B$ is magnetic-field magnitude in tesla, and $U_{\mathrm{eff},s}$
    is the effective potential-energy contribution in joules. The normalized potential
    contribution is the corresponding [normalized_particle_effective_potential](name:normalized_particle_effective_potential),
    equal to $U_{\mathrm{eff},s}/E_{\mathrm{ref},s}$ when the same reference energy
    is used.


    In practice this quantity is computed from the species phase-space coordinates,
    magnetic-field magnitude, effective potential model, and chosen reference energy.
    The species dependence of the kinetic term is tied to the mass normalization used
    for [normalized_particle_mass](name:normalized_particle_mass), while electrostatic
    potential terms depend on the species charge normalization represented by [normalized_particle_charge](name:normalized_particle_charge).
    The detailed contents of $U_{\mathrm{eff},s}$ are model dependent, but they must
    be additive energy terms in the effective single-particle Hamiltonian.


    Values near 1 indicate effective energies comparable with the selected species
    thermal-energy reference. Values much larger than 1 represent high-energy tail
    or suprathermal particles relative to that reference, while the numerical zero
    and any lower bound depend on the chosen effective-potential offset.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:effective_particle_energy
  - name:normalized_energy
  - name:normalized_particle_effective_potential
  - name:derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy
  arguments:
  - name: particle_effective_energy
    operator: normalized
    operator_kind: qualifier
- name: derivative_with_respect_to_poloidal_angle_of_normalized_effective_particle_energy
  kind: scalar
  status: draft
  description: Coordinate derivative of normalized effective particle energy with
    respect to poloidal angle theta in flux coordinates (rho, theta, phi). It gives
    the change per radian along the poloidal coordinate on a flux surface.
  documentation: 'The derivative with respect to poloidal angle of normalized effective
    particle energy is the coordinate rate of change of the dimensionless [normalized
    effective particle energy] for a plasma species as the poloidal angle is varied.
    It is defined in a chosen flux-coordinate system $(\rho, \theta, \phi)$ and is
    a derivative with respect to the coordinate $\theta$, not a metric component of
    a spatial gradient.


    The defining coordinate derivative is


    $$

    \partial_\theta \mathcal{E}_{\mathrm{eff},n} = \left.\frac{\partial \mathcal{E}_{\mathrm{eff},n}}{\partial
    \theta}\right|_{\rho,\phi}

    $$


    where $\mathcal{E}_{\mathrm{eff},n}$ is the normalized effective particle energy
    and is dimensionless, $\theta$ is the poloidal angle in radians, and the radial
    flux label $\rho$ and toroidal angle $\phi$ are held fixed.


    In local gyrokinetic modeling this quantity is computed from the specified poloidal
    dependence of the species effective energy, using analytic differentiation, finite
    differences, or spectral differentiation in $\theta$. It is generally a model
    or equilibrium-derived input rather than a directly measured diagnostic observable.


    No universal value range exists. The quantity is dimensionless and may be negative,
    zero, or positive; magnitudes near 0 indicate weak poloidal variation, while magnitudes
    of order 1 indicate changes over about one poloidal radian.


    Sign convention: Positive when $\mathcal{E}_{\mathrm{eff},n}$ increases for increasing
    poloidal angle $\theta$ in the chosen flux-coordinate system $(\rho, \theta, \phi)$,
    with $\rho$ and $\phi$ held fixed.'
  unit: '1'
  physics_domain: turbulence
  links: []
  arguments:
  - name: normalized_particle_effective_energy
    operator: derivative_with_respect_to_poloidal_angle
    operator_kind: unary_prefix
  sources:
  - id: dd:gyrokinetics_local/species/potential_energy_gradient_norm
    dd_path: gyrokinetics_local/species/potential_energy_gradient_norm
    status: composed
- name: perpendicular_momentum_flux_due_to_perturbed_parallel_magnetic_field
  kind: scalar
  status: draft
  description: Normalized perpendicular contribution to toroidal gyrocenter momentum
    flux driven by perturbed parallel magnetic-field fluctuations in electromagnetic
    gyrokinetic turbulence. It represents the wavevector-summed cross-field transport
    channel associated with compressional magnetic perturbations.
  documentation: 'Perpendicular momentum flux due to perturbed parallel magnetic field
    is the dimensionless contribution to turbulent toroidal gyrocenter momentum transport
    carried by the $\delta B_\parallel$ compressional electromagnetic perturbation
    through gyrocenter motion perpendicular to the equilibrium magnetic field. The
    transported momentum is the toroidal gyrocenter momentum associated with the angle
    $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame, and the radial flux
    is the projection along increasing $\rho$ in flux coordinates $(\rho, \theta,
    \phi)$.


    A compact normalized form is:


    $$

    \hat{\Pi}_{\phi,\perp}^{\delta B_\parallel}

    =

    \frac{\Pi_{\phi,\perp}^{\delta B_\parallel}}{\Pi_\mathrm{ref}}

    =

    \sum_{\mathbf{k}_\perp}\sum_s

    \left\langle

    \int d\hat{\Lambda}_s\,

    \hat{p}_{\phi,s}\,

    \operatorname{Re}\!\left[

    \hat{g}_{s,\mathbf{k}_\perp}^{*}

    \hat{v}_{\rho,\perp,s,\mathbf{k}_\perp}^{\delta B_\parallel}

    \right]

    \right\rangle_{\rho,t}

    $$


    where $\Pi_{\phi,\perp}^{\delta B_\parallel}$ is the physical perpendicular toroidal
    momentum flux from the $\delta B_\parallel$ channel, $\Pi_\mathrm{ref}$ is the
    reference momentum-flux scale, $s$ labels species, $d\hat{\Lambda}_s$ is the normalized
    velocity-space measure including the gyrocenter Jacobian, $\hat{p}_{\phi,s}$ is
    normalized toroidal gyrocenter momentum, $\hat{g}_{s,\mathbf{k}_\perp}$ is the
    normalized non-adiabatic gyrocenter distribution perturbation, and $\hat{v}_{\rho,\perp,s,\mathbf{k}_\perp}^{\delta
    B_\parallel}$ is the normalized radial projection of the perpendicular gyrocenter
    velocity driven by $\delta B_\parallel$. The hats indicate quantities scaled so
    that the phase-space integral has the same normalization as $\Pi_{\phi,\perp}^{\delta
    B_\parallel}/\Pi_\mathrm{ref}$, and the sum is over the retained perpendicular
    wavevectors.


    This quantity is computed by isolating the $\delta B_\parallel$ terms in the electromagnetic
    gyrocenter equations, forming the toroidal-momentum moment of the non-adiabatic
    gyrocenter distribution, averaging over the turbulent state or eigenmode phase,
    and summing the spectral contributions. It is the perpendicular-channel counterpart
    of [parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field](name:parallel_momentum_flux_due_to_perturbed_parallel_magnetic_field),
    contributes to the $\delta B_\parallel$ momentum-flux decomposition represented
    by [momentum_flux_due_to_perturbed_parallel_magnetic_field](name:momentum_flux_due_to_perturbed_parallel_magnetic_field),
    and is distinct from the perturbed-parallel-vector-potential channel [perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential](name:perpendicular_momentum_flux_due_to_perturbed_parallel_vector_potential).
    In rotating-frame formulations, $\hat{p}_{\phi,s}$ and the corresponding radial
    drift are evaluated relative to that rotating frame.


    Typical normalized absolute values in core gyrokinetic turbulence are often of
    order $10^{-4}$-$10^{-1}$, with the largest contributions occurring when electromagnetic
    compressional fluctuations are appreciable. The sign and magnitude are sensitive
    to plasma beta, magnetic geometry, rotation-gradient drive, and the cross phase
    between $\delta B_\parallel$ and the gyrocenter distribution response.


    Sign convention: Positive when the $\delta B_\parallel$-driven perpendicular flux
    transports positive toroidal gyrocenter momentum outward, toward increasing $\rho$
    in flux coordinates $(\rho, \theta, \phi)$, where positive toroidal momentum is
    in the direction of increasing $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: '1'
  physics_domain: turbulence
