- name: heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Characteristic outward distance over which a decaying heat-flux magnitude
    decreases by one e-folding in the scrape-off layer, without selecting an electron
    or ion channel.
  documentation: 'This quantity is the e-folding distance for a heat-flux magnitude
    that decreases outward from the confined plasma into the open-field-line scrape-off
    layer. It represents the common decay-length concept for both electron and ion
    heat fluxes without selecting either channel.


    $$

    L_q = \left|\frac{d\ln q}{dx}\right|^{-1}

    $$


    where $L_q$ is the e-folding length, $q$ is the positive heat-flux magnitude,
    and $x$ is outward distance normal to magnetic flux surfaces. The scale is defined
    locally where the logarithmic gradient is nonzero. The quantity is the heat-flux
    specialization of [decay length over scrape-off layer](name:decay_length_over_scrape_off_layer);
    its species-resolved instances include [electron heat decay length](name:electron_heat_decay_length_over_scrape_off_layer)
    and [ion heat decay length](name:ion_heat_decay_length_over_scrape_off_layer).


    Sign convention: Positive when the reference direction is outward from the confined
    plasma into the scrape-off layer and the heat-flux magnitude decreases along it.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:decay_length_over_scrape_off_layer
  - name:electron_heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: decay_length_over_scrape_off_layer
    operator: heat
    operator_kind: qualifier
- name: electron_heat_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Radial e-folding decay length of the electron heat flux in the scrape-off
    layer, defined by the inverse magnitude of its outward logarithmic gradient.
  documentation: 'The electron heat decay length in the scrape-off layer (SOL) is
    the radial distance over which the electron heat-flux profile falls to $1/e$ of
    its separatrix value. It characterizes the spatial scale of electron heat exhaust
    across the open-field-line region and specializes the channel-unspecified [heat
    decay length](name:heat_decay_length_over_scrape_off_layer).


    The decay length is defined as the inverse magnitude of the outward logarithmic
    gradient of the electron heat flux:


    $$

    \lambda_{q,e} = \left| \frac{\partial \ln q_e}{\partial r} \right|^{-1}

    $$


    where $q_e$ is the electron heat flux and $r$ is radial distance measured outward
    from the separatrix into the SOL.


    This quantity includes only the electron heat channel and is distinct from the
    corresponding [ion heat decay length](name:ion_heat_decay_length_over_scrape_off_layer).
    As the magnitude of a logarithmic gradient, the decay length is non-negative.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:heat_decay_length_over_scrape_off_layer
  - name:ion_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: heat_decay_length_over_scrape_off_layer
    operator: electron
    operator_kind: qualifier
  sources:
  - dd_path: summary/scrape_off_layer/heat_flux_e_decay_length/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-scrape_off_layer-heat_flux_e_decay_length-value
    dd_documentation:
      leaf: Value
      parent_path: summary/scrape_off_layer/heat_flux_e_decay_length
      parent: Electron heat flux radial decay length inv(grad qe/qe)
      data_type: FLT_1D
      unit: m
      coordinates:
      - summary/time
    enhanced_context:
      description: "Electron heat flux radial decay length in the scrape-off layer\
        \ (SOL), defined as the inverse of the logarithmic gradient of the electron\
        \ heat flux (qe): \u03BBqe = |qe / (dqe/dr)|. Characterizes how rapidly the\
        \ electron heat flux falls off radially in the SOL."
      kind: template
- name: heat_flux
  kind: vector
  status: active
  description: Vector of plasma energy transport per unit area, whose projection through
    an oriented surface gives the power crossing it through convective, conductive,
    and turbulent channels.
  documentation: 'The heat-flux vector represents the net transport of plasma energy
    through space, including convective, conductive, cross-field, field-aligned, and
    fluctuation-driven contributions when included in the energy balance.


    For an oriented surface $S$, the transported power is defined by


    $$

    P_S = \int_S \mathbf{q} \cdot \hat{\mathbf{n}}\,dA

    $$


    where $\mathbf{q}$ is the heat-flux vector, $P_S$ is the crossing power in W,
    $\hat{\mathbf{n}}$ is the chosen unit normal, and $dA$ is a surface element in
    m$^2$. The [parallel heat flux](name:parallel_heat_flux) is its projection along
    the local magnetic-field direction. Convective transport may be parameterized
    by the [ratio of heat flux to product of particle flux and particle temperature
    due to convection](name:ratio_of_heat_flux_to_product_of_particle_flux_and_particle_temperature_due_to_convection).


    Sign convention: Positive when the local component of $\mathbf{q}$ points along
    the chosen oriented surface normal $\hat{\mathbf{n}}$.'
  unit: W.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:parallel_heat_flux
- name: helium_3_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of helium-3 ions evaluated at the H-mode pedestal top,
    where the steep-gradient edge transport barrier meets the flatter core profile,
    summed over all ionization states.
  documentation: 'Helium-3 density at the pedestal is the local number density of
    helium-3 ions ($Z=2$, $A=3$) at the top of the H-mode edge transport barrier,
    summed over all ionization states from singly ionized $\mathrm{He}^+$ through
    fully stripped $\mathrm{He}^{2+}$. The pedestal top is the radial position where
    the steep edge density gradient transitions to the more weakly varying confined-core
    density; it is distinct from the separatrix or [density_at_plasma_boundary](name:density_at_plasma_boundary)
    locus.


    $$

    n_{\mathrm{He3}}(\xi_{\mathrm{ped,top}}) = \left.\frac{dN_{\mathrm{He3}}}{dV}\right|_{\xi
    = \xi_{\mathrm{ped,top}}}

    $$


    where $N_{\mathrm{He3}}$ is the helium-3 ion count summed over charge states $q
    = 1$ and $q = 2$, $V$ is physical volume in m$^3$, and $\xi_{\mathrm{ped,top}}$
    is the radial label of the pedestal-top flux surface (for example $\rho_{\mathrm{tor,norm}}$
    or $\psi_N$). This name is the helium-3 isotopic member of the [density_at_pedestal_top](name:density_at_pedestal_top)
    family; the helium-4 isotopic counterpart is [helium_4_density_at_pedestal_top](name:helium_4_density_at_pedestal_top).


    Sign convention: Positive when helium-3 ions are present in the pedestal plasma.'
  unit: m^-3
  physics_domain: edge_plasma_physics
