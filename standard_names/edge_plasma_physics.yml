    dd_path: summary/local/pedestal/n_i/helium_4/value
    status: composed
- name: helium_4_density_at_separatrix
  kind: scalar
  status: draft
  description: Volume number density of fully ionized helium-4 (alpha particle) ions
    at the separatrix, the outermost closed flux surface.
  documentation: 'The helium-4 density at the separatrix, $n_{\alpha}(\psi_{\text{sep}})$
    (with $\psi_{\text{sep}}$ the poloidal flux at the separatrix), characterizes
    the alpha particle density boundary condition for the confined plasma and sets
    the influx into the scrape-off layer. In a fusion plasma, this quantity is determined
    by the balance between alpha heating, thermalization, and radial transport from
    the core, influencing fuel dilution and fusion power exhaust. Typical separatrix
    alpha densities range from $10^{15}\,\text{m}^{-3}$ to $10^{17}\,\text{m}^{-3}$
    in H-mode tokamaks, depending on fusion power and particle confinement. It is
    measured spectroscopically via charge exchange recombination spectroscopy (CXRS)
    on He II emission, or inferred from neutral particle analysis and equilibrium
    reconstruction. The local density relates to the flux-surface-averaged value via
    $n_{\alpha} = \left[\text{flux_surface_averaged_helium_4_density_at_separatrix}\right]
    / (1 + \Lambda)$, where $\Lambda$ accounts for poloidal asymmetry. See also [helium_4_density_at_magnetic_axis](name:helium_4_density_at_magnetic_axis),
    [helium_4_density_at_pedestal](name:helium_4_density_at_pedestal), and [electron_density_at_separatrix](name:electron_density_at_separatrix),
    which together constrain the edge particle balance.


    Sign convention: Positive when the particle number per unit volume has a finite,
    non-negative value.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:helium_4_density_at_magnetic_axis
  - name:helium_4_density_at_pedestal
  - name:electron_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/n_i/helium_4/value
    dd_path: summary/local/separatrix/n_i/helium_4/value
    status: composed
- name: hydrogen_density_at_limiter
  kind: scalar
  status: draft
  description: Volume number density of hydrogen ions (protons) in the vicinity of
    the limiter, the primary plasma-facing component that defines the outermost boundary
    of the confined plasma.
  documentation: 'The hydrogen ion density at the limiter, $n_{\mathrm{H,limiter}}$,
    quantifies the local concentration of hydrogenic ions near the material surface
    that defines the plasma edge. This density is a key boundary condition for particle
    transport models and sets the ionization source in the scrape-off layer (SOL)
    through electron-impact ionization of neutrals. Typical values range from $10^{18}$
    to $10^{20}$ m$^{-3}$ in the limiter shadow region of tokamaks, depending on the
    discharge regime and wall recycling level. The quantity is inferred from Langmuir
    probe measurements or spectroscopic line intensities and is closely related to
    the upstream separatrix density; see [hydrogen_density_at_separatrix](name:hydrogen_density_at_separatrix)
    and [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target)
    for comparisons at other plasma boundaries.


    Sign convention: Positive when the density value is greater than zero, representing
    a physical particle concentration.


    Cross-field transport and local ionization balance determine the radial fall-off
    of $n_{\mathrm{H,limiter}}$ into the far SOL, coupling it to the [electron_density_at_separatrix](name:electron_density_at_separatrix)
    via quasi-neutrality and to the neutral particle dynamics captured by [fast_neutral_density](name:fast_neutral_density).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:hydrogen_density_at_separatrix
  - name:hydrogen_density_at_divertor_target
  - name:electron_density_at_separatrix
  - name:fast_neutral_density
  sources:
  - id: dd:summary/local/limiter/n_i/hydrogen/value
    dd_path: summary/local/limiter/n_i/hydrogen/value
    status: composed
- name: hydrogen_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of hydrogen ions at the radial location of the pedestal
    maximum pressure gradient.
  documentation: 'The hydrogen ion number density at the pedestal quantifies the thermal
    population of hydrogen (H$^+$) ions at the top of the edge transport barrier,
    where the density profile steepens before flattening at the separatrix. This density
    directly influences the pedestal pressure through $p_{\text{ped}} = n_i k_B T_i
    + n_e k_B T_e$ and sets the boundary condition for core fueling and ELM stability.
    Typical values in H-mode tokamaks range from $10^{19}$ to $10^{20}$ m$^{-3}$,
    measured by Thomson scattering or charge-exchange recombination spectroscopy (CXRS)
    and often constrained by equilibrium reconstruction. The pedestal hydrogen density
    evolves during the inter-ELM cycle and is paired with the [electron_density_at_separatrix](name:electron_density_at_separatrix)
    and [hydrogen_density_at_separatrix](name:hydrogen_density_at_separatrix) to characterize
    the pedestal structure.


    Sign convention: Positive when the number density value is greater than zero,
    representing a physical particle population.


    Related quantities include the pedestal ion temperature gradient (see [gradient_of_electron_temperature_at_pedestal](name:gradient_of_electron_temperature_at_pedestal))
    and the pedestal pressure (see [electron_pressure_at_separatrix](name:electron_pressure_at_separatrix)).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_separatrix
  - name:hydrogen_density_at_separatrix
  - name:gradient_of_electron_temperature_at_pedestal
  - name:electron_pressure_at_separatrix
  sources:
  - id: dd:summary/local/pedestal/n_i/hydrogen/value
    dd_path: summary/local/pedestal/n_i/hydrogen/value
    status: composed
- name: ion_energy_diffusivity
  kind: scalar
  status: draft
  description: Cross-field diffusivity governing the radial transport of ion thermal
    energy in the edge plasma, parameterized by Fick's law closure of the ion heat
    flux.
  documentation: "The ion energy diffusivity $\u03C7_i$ relates the radial ion heat\
    \ flux $Q_{i,r}$ to the ion temperature gradient via $Q_{i,r} = -n_i \u03C7_i\
    \ \u2202T_i/\u2202r$, where $n_i$ is the ion density and $T_i$ is the ion temperature.\
    \ This transport coefficient captures the combined effect of turbulent and neoclassical\
    \ processes that redistribute ion thermal energy across flux surfaces. Typical\
    \ values in the edge region range from $0.1\\,\\text{m}^2\\text{s}^{-1}$ in the\
    \ steep-gradient pedestal to several $\\text{m}^2\\text{s}^{-1}$ in the scrape-off\
    \ layer. The diffusivity is inferred from interpretative transport analysis using\
    \ measured [ion_temperature](name:ion_temperature) profiles and power balance\
    \ calculations, or predicted by gyrokinetic turbulence simulations. This quantity\
    \ is distinct from [electron_energy_diffusivity](name:electron_energy_diffusivity)\
    \ and [particle_diffusivity](name:particle_diffusivity), as ion thermal transport\
    \ can differ substantially from electron thermal transport and particle transport\
    \ due to different instability drive mechanisms. When resolved by charge state,\
    \ see [ion_state_energy_diffusivity](name:ion_state_energy_diffusivity)."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_temperature
  - name:electron_energy_diffusivity
  - name:particle_diffusivity
  - name:ion_state_energy_diffusivity
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/energy/d
    dd_path: core_transport/model/profiles_1d/ion/energy/d
    status: attached
  - id: dd:edge_transport/model/ggd/ion/energy/d/values
    dd_path: edge_transport/model/ggd/ion/energy/d/values
    status: composed
- name: ion_momentum_diamagnetic_diffusion_coefficient
  kind: scalar
  status: draft
  description: Diamagnetic component of the momentum diffusion coefficient for thermal
    ions, describing cross-field transport in the presence of pressure gradients.
  documentation: "The diamagnetic momentum diffusion coefficient $D_{i,\\text{dia}}$\
    \ quantifies the contribution to ion cross-field momentum transport arising from\
    \ the diamagnetic drift, which is driven by the ion pressure gradient $\\nabla\
    \ p_i$ in a magnetized plasma. In edge transport codes, this coefficient enters\
    \ the diffusive closure for the radial flux of toroidal angular momentum, supplementing\
    \ the neoclassical and anomalous components. The diamagnetic component is typically\
    \ comparable to or larger than the classical momentum diffusivity in the steep-gradient\
    \ edge pedestal region, where $\\nabla p_i / p_i \\sim 10$\u2013$100\\ \\text{m}^{-1}$.\
    \ It is inferred from ion density and temperature profiles measured by charge-exchange\
    \ recombination spectroscopy (CXRS) and Thomson scattering. See also [momentum_diamagnetic_diffusion_coefficient](name:momentum_diamagnetic_diffusion_coefficient)\
    \ for the bulk plasma case and [neutral_momentum_diamagnetic_diffusion_coefficient](name:neutral_momentum_diamagnetic_diffusion_coefficient)\
    \ for neutral species. The poloidal component is given by [poloidal_ion_momentum_diffusion_coefficient](name:poloidal_ion_momentum_diffusion_coefficient),\
    \ while the underlying drift mechanism is described by [ion_velocity_due_to_diamagnetic_drift](name:ion_velocity_due_to_diamagnetic_drift)."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:momentum_diamagnetic_diffusion_coefficient
  - name:neutral_momentum_diamagnetic_diffusion_coefficient
  - name:poloidal_ion_momentum_diffusion_coefficient
  - name:ion_velocity_due_to_diamagnetic_drift
  sources:
  - id: dd:edge_transport/model/ggd/ion/momentum/d/diamagnetic
    dd_path: edge_transport/model/ggd/ion/momentum/d/diamagnetic
    status: composed
  - id: dd:edge_transport/model/ggd/ion/state/momentum/d/diamagnetic
    dd_path: edge_transport/model/ggd/ion/state/momentum/d/diamagnetic
    status: composed
- name: iron_density_at_pedestal
  kind: scalar
  status: draft
  description: Number density of iron impurity ions at the top of the edge pedestal.
  documentation: 'The iron density at the pedestal top quantifies the concentration
    of sputtered iron impurities entering the confined plasma across the edge transport
    barrier. These high-Z impurities originate from plasma-facing components and,
    through line radiation, can significantly degrade pedestal performance and core
    confinement. Typical pedestal-top iron densities range from $10^{14}$ to $10^{16}\,\text{m}^{-3}$
    in tokamaks with metallic walls, measured via visible or VUV spectroscopy of line
    emission and interpreted through collisional-radiative modeling. The iron density
    profile influences the impurity radiation power and dilution of the main fuel,
    linking directly to [iron_density_at_separatrix](name:iron_density_at_separatrix)
    and [iron_density_at_limiter](name:iron_density_at_limiter).


    Sign convention: Positive when the number of iron impurity ions per unit volume
    is measured in a finite volume element.


    Pedestal-top impurity densities are compared with [deuterium_tritium_density_at_pedestal](name:deuterium_tritium_density_at_pedestal)
    to assess the effective ion charge $Z_{\text{eff}}$ and the associated radiative
    power loss in the edge transport barrier.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_separatrix
  - name:iron_density_at_limiter
  - name:deuterium_tritium_density_at_pedestal
  sources:
  - id: dd:summary/local/pedestal/n_i/iron/value
    dd_path: summary/local/pedestal/n_i/iron/value
    status: composed
- name: iron_density_at_separatrix
  kind: scalar
  status: draft
  description: Number density of iron impurity ions at the separatrix, the outermost
    closed flux surface of the confined plasma.
  documentation: 'The iron density at the separatrix, $n_{\mathrm{Fe}}^{\mathrm{sep}}$,
    quantifies the concentration of sputtered iron atoms that have ionized and been
    transported to the plasma boundary. This quantity is line-integrated from vacuum-ultraviolet
    spectroscopy or X-ray measurements and is a critical boundary condition for impurity
    transport codes. Typical values in tokamaks range from $10^{14}\,\mathrm{m}^{-3}$
    to $10^{16}\,\mathrm{m}^{-3}$, depending on wall-material erosion rates.


    Sign convention: Positive when the number of iron ions per unit volume is non-negative.


    Compare with [iron_density_at_limiter](name:iron_density_at_limiter) and [iron_density_at_pedestal](name:iron_density_at_pedestal),
    which sample the iron impurity density at different radial locations. The flux-surface-averaged
    counterpart for a different impurity species is [flux_surface_averaged_neon_density_of_separatrix](name:flux_surface_averaged_neon_density_of_separatrix).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:iron_density_at_limiter
  - name:iron_density_at_pedestal
  - name:flux_surface_averaged_neon_density_of_separatrix
  sources:
  - id: dd:summary/local/separatrix_average/n_i/iron/value
    dd_path: summary/local/separatrix_average/n_i/iron/value
    status: composed
- name: iron_density_of_separatrix
  kind: scalar
  status: draft
  description: Volume number density of iron ions at the separatrix, the outermost
    closed flux surface of the confined plasma.
  documentation: 'The iron ion density at the separatrix characterizes the mid-Z impurity
    concentration in the edge plasma, serving as a boundary condition for impurity
    transport simulations. Iron is a common wall material (from steel plasma-facing
    components) and its density profile determines radiative losses and plasma dilution.
    Typical separatrix densities range from $10^{14}$ to $10^{16}\,\text{m}^{-3}$,
    depending on wall erosion and divertor conditions. Measurements are obtained from
    spectroscopic line-intensity ratios combined with collisional-radiative modeling,
    or from charge-exchange recombination spectroscopy. The iron density is linked
    to the electron density through the quasi-neutrality condition, $n_e \approx n_{\text{main
    ion}} + \sum_s Z_s n_{s}$. See also [boron_density_at_separatrix](name:boron_density_at_separatrix)
    and [flux_surface_averaged_helium_4_density_at_separatrix](name:flux_surface_averaged_helium_4_density_at_separatrix)
    for analogous impurity species.


    Sign convention: Positive when the iron ion number density is above zero, indicating
    a measurable concentration at the separatrix.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:boron_density_at_separatrix
  - name:flux_surface_averaged_helium_4_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/n_i/iron/value
    dd_path: summary/local/separatrix/n_i/iron/value
    status: composed
- name: krypton_density_at_limiter
  kind: scalar
  status: draft
  description: Number density of krypton ions at the limiter surface, representing
    the local impurity concentration near this plasma-facing component.
  documentation: 'The krypton ion number density at the limiter, $n_{\mathrm{Kr}}(R_{\mathrm{lim}})$,
    quantifies the local concentration of this high-Z impurity species at the plasma-facing
    surface. Krypton may be deliberately injected for radiative cooling or as a diagnostic
    tracer, and its density at the limiter is influenced by parallel transport along
    open field lines and local erosion or deposition processes. Typical values in
    the scrape-off layer range from $10^{15}$ to $10^{18}\,\mathrm{m}^{-3}$, depending
    on the seeding rate and core plasma conditions. This density is routinely estimated
    from spectroscopic measurements of krypton line emission combined with collisional-radiative
    modeling. The radial profile across the edge is related to the pedestal value
    via [krypton_density_at_pedestal](name:krypton_density_at_pedestal) and to the
    confined plasma density via [krypton_density_at_separatrix](name:krypton_density_at_separatrix).


    Sign convention: Positive when the krypton ion number density is finite at the
    limiter location.


    For the line-averaged impurity density along a diagnostic chord, see [line_averaged_krypton_density](name:line_averaged_krypton_density).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:krypton_density_at_pedestal
  - name:krypton_density_at_separatrix
  - name:line_averaged_krypton_density
  sources:
  - id: dd:summary/local/limiter/n_i/krypton/value
    dd_path: summary/local/limiter/n_i/krypton/value
    status: composed
- name: krypton_density_at_separatrix
  kind: scalar
  status: draft
  description: Volume number density of krypton ions averaged over the separatrix
    region.
  documentation: 'The ion number density $n_\mathrm{Kr}$ of krypton, averaged over
    the separatrix surface or a narrow radial band encompassing the last closed flux
    surface. This quantity characterizes the impurity content at the plasma boundary,
    where krypton is often injected as a radiative divertor seed to reduce heat flux
    to plasma-facing components. Typical separatrix krypton densities range from $10^{15}$
    to $10^{18}\,\mathrm{m}^{-3}$ depending on the seeding rate and divertor geometry.
    The krypton density is closely related to the [krypton density at the divertor
    target](name:krypton_density_at_divertor_target), which is typically lower due
    to volumetric losses, and to the [electron density at the separatrix](name:electron_density_at_separatrix),
    which sets the background plasma density. Neighboring impurity species with identical
    spatial definition include [boron density at separatrix](name:boron_density_at_separatrix)
    and [helium 4 density at separatrix](name:helium_4_density_at_separatrix).


    Sign convention: Positive when measured as a volumetric number density, which
    is a non-negative quantity.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:krypton_density_at_divertor_target
  - name:electron_density_at_separatrix
  - name:boron_density_at_separatrix
  - name:helium_4_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/n_i/krypton/value
    dd_path: summary/local/separatrix/n_i/krypton/value
    status: composed
  - id: dd:summary/local/separatrix_average/n_i/krypton/value
    dd_path: summary/local/separatrix_average/n_i/krypton/value
    status: composed
- name: lithium_density_at_pedestal
  kind: scalar
  status: draft
  description: Volume number density of lithium impurity ions, summed over all ionization
    states, at the top of the edge pedestal region.
  documentation: 'The lithium density at the pedestal top, denoted $n_{\mathrm{Li}}$,
    is the total number of lithium ions (neutral and all charge states $\mathrm{Li}^{q+}$)
    per unit volume, measured at the radial location where the density gradient transitions
    from the steep pedestal to the flat core. It is a key quantity for characterizing
    edge impurity content and for evaluating radiative losses, dilution effects, and
    pedestal stability in magnetically confined fusion plasmas. Typical values in
    present-day tokamaks range from $10^{15}\,\mathrm{m}^{-3}$ to $10^{17}\,\mathrm{m}^{-3}$,
    depending on wall conditions, fueling, and plasma parameters. The density is measured
    via spectroscopic diagnostics (e.g., visible or VUV lines) coupled with collisional-radiative
    modeling to invert line-integrated signals into local densities.


    The quantity is the ionization-state sum $n_{\mathrm{Li}} = \sum_q n_{\mathrm{Li}^{q+}}$,
    where $q=0$ (neutral) through fully stripped $q=3$. In the pedestal region, the
    population is typically dominated by $\mathrm{Li}^{2+}$ and $\mathrm{Li}^{3+}$
    due to the high electron temperature ($T_e \sim 100\, \mathrm{eV}$ to $1\,\mathrm{keV}$).
    For comparison with electron density $n_e$, the mixing ratio $f_{\mathrm{Li}}
    = n_{\mathrm{Li}} / n_e$ provides the fractional impurity content; see `electron_density_at_separatrix`
    for the reference electron density.


    Sign convention: Positive when $n_{\mathrm{Li}} > 0$.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:lithium_density_at_separatrix
  - name:lithium_density_at_limiter
  sources:
  - id: dd:summary/local/pedestal/n_i/lithium/value
    dd_path: summary/local/pedestal/n_i/lithium/value
    status: composed
- name: lithium_density_at_separatrix
  kind: scalar
  status: draft
  description: Volume number density of singly ionized lithium impurity ions at the
    separatrix, the outermost closed flux surface of the confined plasma.
  documentation: "The lithium impurity number density $n_{\\mathrm{Li}}$ at the separatrix\
    \ provides a boundary condition for pedestal and scrape-off-layer transport modeling\
    \ and quantifies the impurity source from plasma-facing components (PFCs) coated\
    \ or infused with lithium. In magnetized fusion plasmas, lithium is often injected\
    \ or applied as a first-wall conditioning agent to reduce recycling and control\
    \ core impurity content; its density at the separatrix governs the influx into\
    \ the confined region through transport and ionization balance. Typical separatrix\
    \ values range from $10^{15}$\u2013$10^{19}\\;\\mathrm{m^{-3}}$ depending on the\
    \ injection rate, wall recycling, and plasma conditions, and are inferred from\
    \ spectroscopic line-emission measurements (e.g., Li I or Li II line intensities)\
    \ combined with collisional-radiative models.\n\nSign convention: Positive when\
    \ the lithium ion number is increasing in a given volume element.\n\nRelated quantities\
    \ include [flux_surface_averaged_lithium_density_at_separatrix](name:flux_surface_averaged_lithium_density_at_separatrix)\
    \ for the surface-integrated average, [lithium_density_at_magnetic_axis](name:lithium_density_at_magnetic_axis)\
    \ for the core concentration, and the electron density boundary condition [electron_density_at_separatrix](name:electron_density_at_separatrix)\
    \ which determines the quasi-neutrality constraint."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:flux_surface_averaged_lithium_density_at_separatrix
  - name:lithium_density_at_magnetic_axis
  - name:electron_density_at_separatrix
  sources:
  - id: dd:summary/local/separatrix/n_i/lithium/value
    dd_path: summary/local/separatrix/n_i/lithium/value
    status: composed
- name: magnetic_shear_at_pedestal
  kind: scalar
  status: draft
  description: Radial derivative of the safety factor, normalized by the local safety
    factor, evaluated at the pedestal top.
  documentation: "The magnetic shear $s = (\\rho_{\\mathrm{tor}} / q) \\, dq / d\\\
    rho_{\\mathrm{tor}}$ quantifies the radial variation of the safety factor $q$\
    \ and controls the pitch-angle divergence of magnetic field lines between adjacent\
    \ flux surfaces. At the pedestal top, the magnetic shear is a key parameter governing\
    \ peeling-ballooning mode stability and the pedestal height in H-mode plasmas.\
    \ Typical values range from $s \\approx 1$\u20135 depending on the plasma shaping\
    \ and edge current profile; low shear can stabilize edge-localized modes while\
    \ high shear promotes turbulent transport. The magnetic shear is reconstructed\
    \ from equilibrium codes using magnetic diagnostics and pressure profile constraints.\
    \ \n\nSign convention: Positive when the safety factor increases radially outward\
    \ ($dq/d\\rho_{\\mathrm{tor}} > 0$).\n\nSee also [magnetic_shear_of_magnetic_axis](name:magnetic_shear_of_magnetic_axis)\
    \ for the value at the innermost flux surface, and [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier)\
    \ for the shear at an internal barrier location."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_of_magnetic_axis
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/pedestal/magnetic_shear/value
    dd_path: summary/local/pedestal/magnetic_shear/value
    status: composed
- name: magnetic_shear_at_separatrix
  kind: scalar
  status: draft
  description: Normalized radial gradient of the tokamak safety factor evaluated at
    the last closed flux surface, quantifying magnetic field line pitch variation.
  documentation: "The magnetic shear $s = (\\rho_{\\mathrm{tor}} / q) \\, (dq / d\\\
    rho_{\\mathrm{tor}})$ at the separatrix is a dimensionless parameter that measures\
    \ the rate of change of the field-line helicity across the plasma boundary. Here\
    \ $\\rho_{\\mathrm{tor}}$ is the normalized toroidal flux radius and $q$ is the\
    \ safety factor. This quantity governs edge magnetohydrodynamic (MHD) stability,\
    \ particularly the peeling\u2013ballooning modes responsible for edge-localized\
    \ modes (ELMs), and influences turbulent transport through its effect on the radial\
    \ correlation length of fluctuations. Typical values at the separatrix range from\
    \ $s \\approx 2$ to $s \\approx 6$ in H-mode tokamak plasmas, with lower shear\
    \ generally stabilizing external kink modes. It is routinely extracted from equilibrium\
    \ reconstructions that solve the Grad\u2013Shafranov equation, using external\
    \ magnetic measurements combined with internal profile constraints from motional\
    \ Stark effect or polarimetry diagnostics.\n\nSign convention: Positive when the\
    \ safety factor increases radially outward, corresponding to a monotonic $q$ profile.\n\
    \nThis quantity is closely related to [magnetic_shear_of_separatrix](name:magnetic_shear_of_separatrix),\
    \ which uses the identical definition, and to [magnetic_shear_of_magnetic_axis](name:magnetic_shear_of_magnetic_axis),\
    \ which characterizes the central plasma instead. The magnetic shear at the pedestal\
    \ top [magnetic_shear_at_internal_transport_barrier](name:magnetic_shear_at_internal_transport_barrier)\
    \ further links to edge transport barrier physics."
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:magnetic_shear_of_separatrix
  - name:magnetic_shear_of_magnetic_axis
  - name:magnetic_shear_at_internal_transport_barrier
  sources:
  - id: dd:summary/local/separatrix_average/magnetic_shear/value
    dd_path: summary/local/separatrix_average/magnetic_shear/value
    status: composed
- name: neon_density_at_limiter
  kind: scalar
  status: draft
  description: Volumetric number density of neon impurity ions in the vicinity of
    the limiter surface.
  documentation: "The neon density at the limiter, $n_{\\text{Ne,lim}}$, is the total\
    \ number density of neon impurity ions (summed over all charge states $Z$) evaluated\
    \ within a region close to the limiter surface, typically within a few limiter\
    \ shadow widths. It is defined as\n\n\\begin{equation}\nn_{\\text{Ne,lim}} = \\\
    sum_{Z} n_{\\text{Ne}^{Z+},\\text{lim}},\n\\end{equation}\n\nwhere each $n_{\\\
    text{Ne}^{Z+},\\text{lim}}$ (in $\\text{m}^{-3}$) is the number density of the\
    \ $Z$-times ionized neon species at the same location. Typical values at the limiter\
    \ range from $10^{15}\\,\\text{m}^{-3}$ to $10^{17}\\,\text{m}^{-3}$ depending\
    \ on impurity seeding rate, plasma density, and recycling conditions. The density\
    \ is commonly inferred from line emission measurements via space-resolved visible\
    \ or vacuum-ultraviolet spectroscopy, with the line-of-sight integrated signal\
    \ tomographically inverted to obtain local values. The integration domain for\
    \ 'vicinity of the limiter' is the plasma region radially outside the last closed\
    \ flux surface (the scrape-off layer) and within a few shadow widths of the limiter\
    \ surface, as set by local magnetic geometry and limiter design."
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neon_density_of_pedestal
  - name:neon_density_of_separatrix
  sources:
  - id: dd:summary/local/limiter/n_i/neon/value
    dd_path: summary/local/limiter/n_i/neon/value
    status: composed
- name: neon_density_of_pedestal
  kind: scalar
  status: draft
  description: Number density of singly ionized neon impurity ions at the top of the
    edge pedestal region, defined as the location of maximum pressure gradient within
    the edge transport barrier.
  documentation: The neon impurity density at the pedestal quantifies the volumetric
    concentration of neon ions at the top of the edge transport barrier, typically
    the location of steepest gradient in the H-mode pedestal. This density is a critical
    input for calculating radiative cooling and impurity transport in the edge region,
    where neon is often injected for divertor power dissipation. The pedestal width
    $\Delta_{\text{ped}}$ influences the profile shape, but no single exponential
    relation with an electron-based scale length is assumed here; the density at the
    pedestal top is a measurement or output of transport simulations. For a given
    pedestal width, the relation to the separatrix density may be written as $n_{\text{Ne},\text{ped}}
    = n_{\text{Ne},\text{sep}} \cdot f(\Delta_{\text{ped}}, L_n)$ where $L_n$ is the
    local density gradient scale length and $f$ is a monotonically increasing function
    determined by the pedestal transport physics. Typical values in tokamak pedestals
    range from $10^{16}\;\text{m}^{-3}$ to $10^{18}\;\text{m}^{-3}$ depending on the
    seeding rate and plasma conditions. Diagnostic access is provided by visible spectroscopy
    of neon emission lines combined with collisional-radiative modeling; charge exchange
    recombination spectroscopy (CXRS) on a dedicated neutral beam can also resolve
    the pedestal profile.
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:neon_density_at_limiter
  - name:neon_density_of_separatrix
  - name:line_averaged_neon_density
  sources:
  - id: dd:summary/local/pedestal/n_i/neon/value
    dd_path: summary/local/pedestal/n_i/neon/value
    status: composed
- name: neutral_momentum_due_to_diamagnetic_drift
  kind: scalar
  status: draft
  description: Volume source density of neutral species momentum arising from the
    diamagnetic drift in a magnetized plasma.
  documentation: 'The neutral momentum source density due to the diamagnetic drift
    represents the local rate of momentum transfer per unit volume to the neutral
    population, driven by the gradient in the neutral partial pressure across magnetic
    field lines. In a magnetized plasma, the diamagnetic drift velocity for a species
    $s$ is $\mathbf{v}_{\mathrm{dia},s} = (\mathbf{B} \times \nabla p_s) / (q_s n_s
    B^2)$, where $p_s$ is the species pressure, $q_s$ the charge, $n_s$ the density,
    and $\mathbf{B}$ the magnetic field. The resulting momentum source density for
    neutrals is $\mathbf{S}_{\mathrm{mom}} = m_n n_n \mathbf{v}_{\mathrm{dia},n}$,
    with $m_n$ the neutral mass and $n_n$ the neutral density. This source term is
    critical for momentum balance in the edge plasma, where neutral particles interact
    with the confined plasma through charge-exchange and ionization. Typical magnitudes
    in the scrape-off layer can reach $10^{-3}$ to $10^{-1}\,\mathrm{kg\,m^{-2}\,s^{-2}}$,
    varying strongly with the neutral pressure gradient. Related quantities include
    the [ion_momentum_due_to_diamagnetic_drift](name:ion_momentum_due_to_diamagnetic_drift)
    for the ion species and the [radial_current_density_due_to_diamagnetic_drift](name:radial_current_density_due_to_diamagnetic_drift)
    describing the associated current. The source is sign-invariant under field reversal,
    as it depends on the pressure gradient direction.


    Sign convention: Positive when the neutral diamagnetic drift momentum source points
    in the direction of increasing toroidal angle $\phi$ for a right-handed cylindrical
    $(R, \phi, Z)$ system, given the local orientation of the pressure gradient and
    magnetic field.'
  unit: kg.m^-1.s^-2
  physics_domain: edge_plasma_physics
  links:
  - name:ion_momentum_due_to_diamagnetic_drift
  - name:radial_current_density_due_to_diamagnetic_drift
  sources:
  - id: dd:plasma_sources/source/ggd/neutral/state/momentum/diamagnetic
    dd_path: plasma_sources/source/ggd/neutral/state/momentum/diamagnetic
    status: composed
- name: neutral_particle_flux
  kind: scalar
  status: draft
  description: Incident particle flux of neutral species onto the wall surface.
  documentation: The neutral particle flux $\Gamma_n$ quantifies the number of neutral
    atoms or molecules striking the wall surface per unit area per unit time, a key
    quantity for net erosion, deposition, and fueling in the edge plasma.  It is typically
    inferred from collisional-radiative models or measured directly by residual gas
    analyzers and Langmuir probes, with values ranging from $10^{19}$ to $10^{22}$
    m$^{-2}$s$^{-1}$ depending on divertor conditions.  The flux of neutral species
    is closely related to the [neutral_state_particle_flux](name:neutral_state_particle_flux)
    which differentiates by atomic or molecular state, and the [neutral_particle_flux_at_plasma_boundary](name:neutral_particle_flux_at_plasma_boundary)
    that gives the total rate across the last closed flux surface.
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_particle_flux
  - name:neutral_particle_flux_at_plasma_boundary
  sources:
  - id: dd:edge_transport/model/ggd/neutral/particles/flux/values
    dd_path: edge_transport/model/ggd/neutral/particles/flux/values
    status: composed
  - id: dd:edge_transport/model/ggd/neutral/state/particles/flux/values
    dd_path: edge_transport/model/ggd/neutral/state/particles/flux/values
    status: composed
  - id: dd:wall/description_ggd/ggd/particle_fluxes/neutral/incident/values
    dd_path: wall/description_ggd/ggd/particle_fluxes/neutral/incident/values
    status: composed
- name: neutral_state_energy_diffusivity
  kind: scalar
  status: draft
  description: Energy diffusivity of a neutral species in a specific charge state,
    governing the radial transport of thermal energy through the partially ionized
    edge plasma.
  documentation: "The neutral state energy diffusivity quantifies the radial transport\
    \ of thermal energy carried by neutral atoms or molecules in a given charge state\
    \ (e.g., $\\text{D}^0$ or $\\text{D}_2^+$) through the edge plasma. It is a key\
    \ transport coefficient in fluid or kinetic models describing neutral particle\
    \ dynamics, defined by the radial energy flux $Q_{\\text{neutral},Z} = -n_{\\\
    text{neutral},Z} \\, \\chi_{\\text{neutral},Z} \\, \\partial T_{\\text{neutral},Z}\
    \ / \\partial r$, where $n_{\\text{neutral},Z}$ is the number density and $T_{\\\
    text{neutral},Z}$ the temperature of that charge state. The diffusivity arises\
    \ from collisional processes including charge exchange with background ions and\
    \ elastic scattering with neutrals, with values typically ranging from $1$\u2013\
    $100\\ \\text{m}^2\\text{s}^{-1}$ in the scrape-off layer depending on the neutral\
    \ density and plasma parameters. It is distinguished from the total `[neutral_energy_diffusivity](name:neutral_energy_diffusivity)`\
    \ by resolving transport per charge state, analogous to `[ion_state_energy_diffusivity](name:ion_state_energy_diffusivity)`\
    \ for ions. The diffusivity is sign-invariant (always positive) as it describes\
    \ the magnitude of diffusive energy transport."
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_energy_diffusivity
  - name:ion_state_energy_diffusivity
  sources:
  - id: dd:core_transport/model/profiles_1d/neutral/state/energy/d
    dd_path: core_transport/model/profiles_1d/neutral/state/energy/d
    status: attached
  - id: dd:edge_transport/model/ggd/neutral/state/energy/d/values
    dd_path: edge_transport/model/ggd/neutral/state/energy/d/values
    status: composed
- name: parallel_current_density_due_to_ion_neutral_friction
  kind: scalar
  status: draft
  description: Field-aligned component of the electric current density generated by
    collisional momentum exchange between ions and neutrals in the partially ionized
    edge plasma.
  documentation: 'This quantity represents the projection of the ion-neutral friction
    current density onto the local magnetic field direction. The friction force between
    ions and neutrals is given by $

    mathbf{f}_{i-n} = m_i n_i \nu_{in} (\mathbf{v}_n - \mathbf{v}_i)$, where $m_i$
    is the ion mass, $n_i$ the ion density, $\nu_{in}$ the ion-neutral collision frequency,
    and $\mathbf{v}_n$, $\mathbf{v}_i$ the neutral and ion fluid velocities. The parallel
    component of the resulting current density is $j_{\\parallel} = (e n_i Z_i / B)
    \hat{b} \cdot \mathbf{f}_{i-n}$, with $e$ the elementary charge and $Z_i$ the
    ion charge state. This parallel current contributes to the force balance in the
    scrape-off layer and divertor regions, where neutral densities are elevated. In
    the edge plasma, typical values range from $10^3$ to $10^5$ A/m$^2$ depending
    on the neutral pressure and plasma conditions. The total ion-neutral friction
    current density is described by [current_density_due_to_ion_neutral_friction](name:current_density_due_to_ion_neutral_friction),
    while the radial component is captured by [radial_current_density_due_to_ion_neutral_friction](name:radial_current_density_due_to_ion_neutral_friction).
    Related field-aligned transport quantities include [parallel_ion_particle_flux](name:parallel_ion_particle_flux)
    and [parallel_neutral_particle_flux](name:parallel_neutral_particle_flux).


    Sign convention: Positive when $j_{\\parallel}$ flows in the direction of the
    local magnetic field $\hat{b}$, i.e., in the direction of increasing toroidal
    angle $\phi$ in the IMAS cylindrical $(R, \phi, Z)$ frame.


    This parallel current plays a role in establishing the parallel electric field
    and ambipolar particle flow in the edge plasma, and its magnitude depends on the
    relative ion-neutral drift velocity along the field line.'
  unit: A.m^-2
  physics_domain: edge_plasma_physics
  links:
  - name:current_density_due_to_ion_neutral_friction
  - name:radial_current_density_due_to_ion_neutral_friction
  - name:parallel_ion_particle_flux
  - name:parallel_neutral_particle_flux
  arguments:
  - name: current_density_due_to_ion_neutral_friction
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/j_ion_neutral_friction/parallel
    dd_path: edge_profiles/ggd/j_ion_neutral_friction/parallel
    status: composed
  - id: dd:plasma_profiles/ggd/j_ion_neutral_friction/parallel
    dd_path: plasma_profiles/ggd/j_ion_neutral_friction/parallel
    status: composed
- name: parallel_electron_particle_flux
  kind: scalar
  status: draft
  description: Parallel component of the electron particle flux, defined as the number
    of electrons crossing a unit area per unit time along the magnetic field direction.
  documentation: The parallel electron particle flux $\Gamma_{e,\parallel} = n_e v_{\parallel,e}$
    quantifies the rate at which electrons stream along magnetic field lines, where
    $n_e$ is the local electron density and $v_{\parallel,e}$ is the electron flow
    velocity parallel to the magnetic field. This quantity is critical for modeling
    scrape-off layer (SOL) transport, setting the sheath boundary condition at divertor
    targets, and determining the parallel heat flux density carried by electrons.
    Typical values in the SOL of a diverted tokamak range from $10^{21}$ to $10^{24}$
    m$^{-2}$s$^{-1}$, depending on the local density and parallel flow speed. The
    parallel flux is related to the total [electron_particle_flux](name:electron_particle_flux)
    at the wall through a projection onto the field-line direction prescribed by the
    magnetic field pitch at the surface. Experimental estimates are obtained from
    Langmuir probe measurements of the ion saturation current combined with the electron
    temperature, assuming quasi-neutrality and a known ratio of electron-to-ion temperature.
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:electron_particle_flux
  arguments:
  - name: electron_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/electrons/particles/flux_parallel/values
    dd_path: edge_transport/model/ggd/electrons/particles/flux_parallel/values
    status: composed
- name: parallel_ion_state_particle_flux
  kind: scalar
  status: draft
  description: Field-aligned component of the particle flux for multiply charged ions
    in a specific charge state in the edge plasma.
  documentation: The parallel ion-state particle flux $\Gamma_{\|,Z} = n_Z v_{\|}$
    quantifies the net rate at which ions of charge state $Z$ stream along magnetic
    field lines, where $n_Z$ is the ion-state density and $v_{\|}$ is the parallel
    flow velocity. This flux governs the plasma density evolution along the field
    in the scrape-off layer and divertor regions, connecting the upstream midplane
    to the target plates. Typical values in the divertor reach $10^{22}$ to $10^{24}$
    m$^{-2}$s$^{-1}$ for low-Z impurities, inferred from Langmuir probe arrays and
    spectroscopic line intensities. The parent quantity [ion_state_particle_flux](name:ion_state_particle_flux)
    describes the total (non-projected) incident flux on the wall, while the parallel
    projection isolates the field-aligned transport component. Related quantities
    for other species include [parallel_ion_particle_flux](name:parallel_ion_particle_flux)
    and [parallel_electron_particle_flux](name:parallel_electron_particle_flux).
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_particle_flux
  - name:parallel_ion_particle_flux
  - name:parallel_electron_particle_flux
  arguments:
  - name: ion_state_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/ion/state/particles/flux_parallel/values
    dd_path: edge_transport/model/ggd/ion/state/particles/flux_parallel/values
    status: composed
- name: parallel_neutral_particle_flux
  kind: scalar
  status: draft
  description: Parallel component of the neutral particle flux, representing the rate
    at which neutral particles cross a unit area aligned with the magnetic field direction.
  documentation: The parallel neutral particle flux $\Gamma_{n,\|} = \mathbf{\Gamma}_n
    \cdot \hat{b}$ quantifies the flow of neutral atoms or molecules along the magnetic
    field line direction in the edge plasma. In the scrape-off layer and divertor
    regions, this parallel flux governs the transport of neutral particles from the
    plasma core toward plasma-facing components, where they influence recycling, fueling,
    and erosion processes. Typical parallel neutral fluxes in the SOL of diverted
    tokamaks range from $10^{20}$ to $10^{23}$ m$^{-2}$s$^{-1}$, depending on the
    neutral density and local plasma conditions. The parallel component is distinguished
    from the total [neutral_particle_flux](name:neutral_particle_flux) by its projection
    onto the field-aligned direction, and is often significantly larger than the cross-field
    radial neutral flux due to the high mobility of neutrals along field lines. Values
    are typically inferred from collisional-radiative models constrained by spectroscopic
    measurements of neutral line emission, or from fluid neutral transport simulations
    using kinetic correction factors for charge-exchange and ionization processes.
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_particle_flux
  arguments:
  - name: neutral_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/particles/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/particles/flux_parallel/values
    status: composed
- name: parallel_neutral_state_particle_flux
  kind: scalar
  status: draft
  description: The parallel component of the particle flux for neutral particles in
    a specified charge state, representing the flow along the magnetic field direction.
  documentation: This quantity, the parallel component of the neutral state particle
    flux $\Gamma_{\parallel, \text{n}, i}$, resolves the net flow of neutral particles
    in a specific charge state $i$ along the magnetic field direction into the projection
    $\Gamma_{\parallel} = \mathbf{\Gamma} \cdot \hat{b}$, where $\hat{b} = \mathbf{B}/|\mathbf{B}|$
    is the unit vector along the magnetic field. At the plasma boundary and in the
    scrape-off layer, this parallel flux governs the particle exhaust along the magnetic
    field lines towards divertor targets, where neutral particles can recycle. In
    the deep edge pedestal, it contributes to the balance of neutral density through
    ionization and charge-exchange sources. Typical values in the edge of a fusion
    plasma range from $10^{19}$ to $10^{22}$ \text{m}^{-2}\text{s}^{-1}$, depending
    on the neutral species, charge state, and local plasma parameters. This is a component
    of the vector quantity [neutral_state_particle_flux](name:neutral_state_particle_flux).
    See also [parallel_neutral_particle_flux](name:parallel_neutral_particle_flux)
    for the equivalent quantity without resolved charge state, and [parallel_ion_state_particle_flux](name:parallel_ion_state_particle_flux)
    for the analogous quantity for ions.
  unit: m^-2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_state_particle_flux
  - name:parallel_neutral_particle_flux
  - name:parallel_ion_state_particle_flux
  arguments:
  - name: neutral_state_particle_flux
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/neutral/state/particles/flux_parallel/values
    dd_path: edge_transport/model/ggd/neutral/state/particles/flux_parallel/values
    status: composed
- name: parallel_vorticity
  kind: scalar
  status: draft
  description: Parallel component of the plasma vorticity vector field, representing
    the component aligned with the local magnetic field direction.
  documentation: 'The parallel vorticity $\boldsymbol{\omega}_\parallel = (\nabla
    \times \mathbf{v})\cdot\hat{b}$ is the projection of the plasma fluid vorticity
    $\boldsymbol{\omega} = \nabla \times \mathbf{v}$ onto the unit vector $\hat{b}$
    parallel to the local magnetic field, where $\mathbf{v}$ is the plasma fluid velocity.
    This component captures the rotational flow structure along the field line and
    is central to drift-wave instabilities and blob dynamics in the edge region. The
    parallel vorticity is related to the radial electric field via the $\mathbf{E}\times\mathbf{B}$
    drift, and its evolution is governed by the charge conservation equation in reduced
    MHD models. Typical values in the edge and scrape-off-layer range from 10$^3$
    to 10$^6$ s$^{-1}$, depending on the turbulence regime.


    Sign convention: Positive when the flow rotation corresponds to a positive curl
    in the direction of $\hat{b}$.


    See also [poloidal_vorticity](name:poloidal_vorticity) and [radial_vorticity](name:radial_vorticity)
    for the other components of the vorticity vector.'
  unit: s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:poloidal_vorticity
  - name:radial_vorticity
  arguments:
  - name: vorticity
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:edge_profiles/ggd/vorticity/parallel
    dd_path: edge_profiles/ggd/vorticity/parallel
    status: composed
  - id: dd:edge_profiles/ggd/vorticity_over_r/parallel
    dd_path: edge_profiles/ggd/vorticity_over_r/parallel
    status: composed
- name: poloidal_conductivity
  kind: scalar
  status: draft
  description: Poloidal component of the electrical conductivity tensor in the edge
    transport model, describing current flow in response to an electric field along
    the poloidal direction.
  documentation: 'The poloidal electrical conductivity $\sigma_{\theta}$ is the component
    of the conductivity tensor that governs current flow driven by an electric field
    in the poloidal direction. In magnetized edge plasmas, conductivity is highly
    anisotropic; the poloidal component is typically much smaller than the parallel
    ($\sigma_{\parallel}$) component due to the strong magnetic field. This quantity,
    together with [toroidal_conductivity](name:toroidal_conductivity) and [vertical_conductivity](name:vertical_conductivity),
    forms the diagonal tensor elements in the local field-aligned coordinate system
    $(\parallel, \theta, Z)$ used in edge transport models. The poloidal conductivity
    influences poloidal current diffusion timescales and the radial electric field
    balance at the plasma edge, with typical values on the order of $10^3\,\text{m}^{-1}\Omega^{-1}$
    in the scrape-off layer.


    The conductivity tensor is fundamental to Ohm''s law $\mathbf{J} = \sigma \cdot
    \mathbf{E}$, where current density $\mathbf{J}$ and electric field $\mathbf{E}$
    are related through the tensor elements. The parent quantity [conductivity](name:conductivity)
    bundles all tensor components; this poloidal entry represents one of the resolved
    components on generalized grid elements.'
  unit: m^-1.ohm^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_conductivity
  - name:vertical_conductivity
  - name:conductivity
  arguments:
  - name: conductivity
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
  - id: dd:edge_transport/model/ggd/conductivity/poloidal
    dd_path: edge_transport/model/ggd/conductivity/poloidal
    status: composed
- name: poloidal_ion_state_velocity_due_to_e_cross_b_drift
  kind: scalar
  status: draft
  description: "Poloidal component of the E\xD7B drift velocity for a specific ion\
    \ charge state in the edge plasma."
  documentation: "The poloidal component $v_{\\theta, E\\times B}$ of the E\xD7B drift\
    \ velocity for a resolved ion charge state is the projection onto the poloidal\
    \ direction $\\hat{\\theta}$ of the full drift velocity $\\mathbf{v}_{E\\times\
    \ B} = (\\mathbf{E} \\times \\mathbf{B}) / B^2$, where $\\mathbf{E}$ is the electric\
    \ field and $\\mathbf{B}$ is the magnetic field. This poloidal flow component\
    \ is a primary driver of edge plasma rotation and is critical for understanding\
    \ the H-mode pedestal structure. The poloidal velocity is typically on the order\
    \ of kilometers per second in the edge region and is measured indirectly through\
    \ spectroscopic techniques or inferred from radial force balance. The total drift\
    \ velocity vector is given by [ion_state_velocity_due_to_e_cross_b_drift](name:ion_state_velocity_due_to_e_cross_b_drift),\
    \ with radial and toroidal analogs available as [radial_ion_state_velocity_due_to_e_cross_b_drift](name:radial_ion_state_velocity_due_to_e_cross_b_drift)\
    \ and [toroidal_ion_state_velocity_due_to_e_cross_b_drift](name:toroidal_ion_state_velocity_due_to_e_cross_b_drift)\
    \ respectively. For the neutral counterpart, see [poloidal_neutral_state_velocity_due_to_e_cross_b_drift](name:poloidal_neutral_state_velocity_due_to_e_cross_b_drift).\n\
    \nSign convention: Positive when the direction of the poloidal E\xD7B drift component\
    \ aligns with the direction of increasing poloidal angle $\\theta$ in the flux\
    \ coordinate system."
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:ion_state_velocity_due_to_e_cross_b_drift
  - name:radial_ion_state_velocity_due_to_e_cross_b_drift
  - name:toroidal_ion_state_velocity_due_to_e_cross_b_drift
  - name:poloidal_neutral_state_velocity_due_to_e_cross_b_drift
  arguments:
  - name: ion_state_velocity_due_to_e_cross_b_drift
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
  sources:
