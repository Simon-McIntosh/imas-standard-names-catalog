- name: toroidal_ion_state_velocity
  kind: scalar
  status: draft
  description: Toroidal component of the bulk flow velocity for ions in a specified
    charge state, representing the plasma rotation around the machine axis.
  documentation: 'The toroidal velocity $v_{\phi,\mathrm{ion},Z} = \mathbf{v}_{\mathrm{ion},Z}
    \cdot \hat{\phi}$ provides the projection of the ion charge state flow velocity
    onto the geometric toroidal direction $\hat{\phi}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame. This quantity describes the dominant rotation component
    in tokamaks, driven by the $\mathbf{E} \times \mathbf{B}$ drift, neoclassical
    flows, and collisional momentum exchange with the bulk plasma. Toroidal rotation
    shear plays a critical role in suppressing edge turbulent transport and stabilizing
    resistive wall modes.


    Sign convention: Positive when the velocity vector points in the direction of
    increasing toroidal angle $\phi$ (counter-clockwise viewed from above).


    Typical values in the edge pedestal range from 10 to 100 km/s depending on the
    heating power and the ion charge state; values are routinely measured via charge
    exchange recombination spectroscopy (CXRS) for intrinsic impurities like carbon
    or nitrogen, or via passive spectroscopy for heavier species. Cross-referencing
    with [toroidal_ion_state_velocity_due_to_e_cross_b_drift](name:toroidal_ion_state_velocity_due_to_e_cross_b_drift)
    isolates the $\mathbf{E} \times \mathbf{B}$ contribution, while [toroidal_neutral_state_velocity](name:toroidal_neutral_state_velocity)
    provides a comparison for the neutral population. The full vector quantity is
    described by [ion_state_velocity](name:ion_state_velocity).'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_ion_state_velocity_due_to_e_cross_b_drift
  - name:toroidal_neutral_state_velocity
  - name:ion_state_velocity
