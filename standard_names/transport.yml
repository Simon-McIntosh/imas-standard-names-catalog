- name: parallel_trapped_fast_particle_pressure
  kind: scalar
  status: draft
  description: Flux-surface-averaged field-aligned component of the pressure tensor
    for trapped fast particles. It is evaluated from the trapped-orbit part of the
    non-thermal distribution function and represents the parallel kinetic stress of
    that population.
  documentation: 'Parallel trapped fast particle pressure is the component of the
    fast-particle pressure tensor along the magnetic field, restricted to particles
    whose guiding-center orbits are trapped between mirror points. It is a flux-surface-averaged
    second velocity moment of the trapped-orbit part of the non-thermal distribution
    and quantifies the field-aligned kinetic stress carried by that population.


    The flux-surface-averaged parallel pressure is defined by the trapped fast-particle
    velocity moment:


    $$

    p_{\parallel,\mathrm{fast,tr}}(\psi) = \left\langle \sum_s m_s \int \left(v_\parallel
    - U_{\parallel s}\right)^2 f_{\mathrm{fast,tr},s}(\mathbf{x},\mathbf{v})\,d^3v
    \right\rangle_\psi

    $$


    where $\langle\cdot\rangle_\psi$ denotes an average over a closed magnetic flux
    surface labeled by $\psi$, $s$ indexes fast-particle species, $m_s$ is the species
    mass in kg, $v_\parallel$ and $U_{\parallel s}$ are velocities along the magnetic
    field in m s$^{-1}$, and $f_{\mathrm{fast,tr},s}$ is normalized so that $\int
    f_{\mathrm{fast,tr},s}\,d^3v = n_{\mathrm{fast,tr},s}$ with density in m$^{-3}$.
    If the retained fast-particle distribution has negligible mean parallel flow,
    $U_{\parallel s}$ is set to zero; for multiple fast species, the result is the
    mass-weighted sum of their separate moment contributions.


    This quantity is usually computed from a kinetic fast-particle distribution after
    classifying phase-space elements by trapped-orbit topology in the reconstructed
    magnetic equilibrium. It is not a direct diagnostic observable, but it can be
    constrained by energetic-particle measurements and by consistency with equilibrium
    and transport analysis. Because trapped particles reverse $v_\parallel$ along
    their bounce motion, the first parallel moment may be small while this second
    moment remains finite.


    Typical flux-surface-averaged values range from 10$^2$-10$^5$ Pa in heated tokamak
    core plasmas, with lower values toward the edge or in weak fast-particle populations.
    High-fast-pressure regimes can approach 10$^6$ Pa locally or on central flux surfaces,
    while the trapped parallel component may be much smaller than the total fast-particle
    pressure when the distribution is strongly perpendicular-anisotropic.'
  unit: Pa
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/trapped/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/trapped/pressure_fast_parallel
    status: composed
  - id: dd:distributions/distribution/profiles_2d/trapped/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_2d/trapped/pressure_fast_parallel
    status: attached
- name: perpendicular_co_passing_fast_particle_pressure
  kind: scalar
  status: draft
  description: Perpendicular component of the species-summed fast-particle pressure
    tensor for co-passing orbits, produced by velocity components transverse to the
    local magnetic field. Co-passing denotes passing guiding-center motion with the
    same toroidal sense as the plasma current.
  documentation: 'Perpendicular co-passing fast-particle pressure is the perpendicular
    component of the fast-particle pressure tensor after restricting the distribution
    to co-passing passing orbits and summing over the included fast species. It represents
    kinetic stress from velocity components orthogonal to the local magnetic field.
    In the right-handed cylindrical $(R,\phi,Z)$ system, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, co-passing denotes passing
    guiding-center orbits whose toroidal motion is in the same sense as the plasma
    current.


    The species-summed kinetic moment is


    $$

    P_{\perp,\mathrm{co}}(\mathbf{x},t) = \sum_s \int_{\Omega_{\mathrm{co},s}} \frac{1}{2}
    m_s v_\perp^2 f_s(\mathbf{x},\mathbf{v},t)\,d^3v

    $$


    where $s$ labels the included fast-particle species, $m_s$ is the species mass
    in kg, $\mathbf{x}$ is position in m, $t$ is time in s, $\mathbf{v}$ is particle
    velocity in m s$^{-1}$, $v_\perp$ is the speed perpendicular to the local magnetic
    field in m s$^{-1}$, $f_s$ is the fast-particle distribution function in s$^3$
    m$^{-6}$, and $d^3v$ is the velocity-space volume element in m$^3$ s$^{-3}$. The
    domain $\Omega_{\mathrm{co},s}$ is the passing part of velocity space whose guiding-center
    orbit has bounce-averaged toroidal velocity $R\dot{\phi}$, in the same $(R,\phi,Z)$
    system, in the same sense as the plasma current; trapped and counter-passing orbits
    are excluded. For common heating and fusion-product applications the fast species
    are usually energetic ions, but the definition applies to any suprathermal species
    included in the sum.


    This quantity is computed as a second velocity moment of an orbit-class-resolved
    fast-particle distribution, typically after classifying particles by pitch, constants
    of motion, or guiding-center trajectories. It is not usually measured directly
    as a local tensor component; instead it is inferred through kinetic modeling constrained
    by diagnostics sensitive to suprathermal particles. Together with [parallel_co_passing_fast_particle_pressure](name:parallel_co_passing_fast_particle_pressure),
    it describes pressure anisotropy of the co-passing fast population, while [perpendicular_fast_particle_pressure](name:perpendicular_fast_particle_pressure)
    includes the corresponding perpendicular contributions from all fast-particle
    orbit classes.


    Typical values are strongly scenario dependent. As an order-of-magnitude guide,
    auxiliary-heated tokamak cores can have perpendicular co-passing fast-particle
    pressures of about $10^2$-$5\times10^4$ Pa, with much smaller values in weakly
    heated regions or where the co-passing fast-particle population is depleted.'
  unit: Pa
  physics_domain: transport
  links: []
  sources:
  - id: dd:distributions/distribution/profiles_1d/co_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_1d/co_passing/pressure_fast_perpendicular
    status: composed
  - id: dd:distributions/distribution/profiles_2d/co_passing/pressure_fast_perpendicular
    dd_path: distributions/distribution/profiles_2d/co_passing/pressure_fast_perpendicular
    status: attached
- name: perpendicular_runaway_electron_particle_flux
  kind: scalar
  status: draft
  description: Scalar component of runaway-electron particle flux across magnetic
    flux surfaces, projected onto the outward flux-surface normal.
  documentation: 'Perpendicular runaway-electron particle flux is the scalar flux
    of runaway electrons crossing magnetic flux surfaces. It is the normal component
    of the runaway-electron particle-flux vector and describes cross-field transport,
    distinct from particle motion along the local magnetic-field direction as represented
    by parallel particle-flux components such as [parallel_electron_particle_flux](name:parallel_electron_particle_flux)
    and [parallel_ion_particle_flux](name:parallel_ion_particle_flux).


    The projection defining the scalar perpendicular flux is


    $$

    \Gamma_{\perp,\mathrm{RE}} = \boldsymbol{\Gamma}_{\mathrm{RE}} \cdot \hat{\mathbf{n}}_{\mathrm{out}}

    $$


    where $\boldsymbol{\Gamma}_{\mathrm{RE}}$ is the runaway-electron particle-flux
    vector in m^-2.s^-1 and $\hat{\mathbf{n}}_{\mathrm{out}}$ is the dimensionless
    unit normal to the magnetic flux surface, oriented from the magnetic axis toward
    the plasma boundary. The scalar $\Gamma_{\perp,\mathrm{RE}}$ has units m^-2.s^-1.


    In transport modeling this quantity may be computed from the continuity balance
    for [runaway_electron_density](name:runaway_electron_density) or represented with
    an effective convection-diffusion closure along a local flux-surface-normal coordinate
    $r_\perp$ in meters. A common form is $\Gamma_{\perp,\mathrm{RE}} = -D_\perp\,\partial
    n_{\mathrm{RE}}/\partial r_\perp + V_\perp n_{\mathrm{RE}}$, where $D_\perp$ is
    [perpendicular_runaway_electron_diffusivity](name:perpendicular_runaway_electron_diffusivity)
    in m^2.s^-1, $V_\perp$ is [perpendicular_runaway_electron_convection_velocity](name:perpendicular_runaway_electron_convection_velocity)
    in m.s^-1, $n_{\mathrm{RE}}$ is runaway-electron density in m^-3, and $\partial
    n_{\mathrm{RE}}/\partial r_\perp$ has units m^-4. This closure is a modeling representation;
    the physical quantity itself is the normal projection of the particle flux.


    The flux is generally inferred rather than measured directly, using reconstructed
    or modeled runaway-electron density evolution together with transport assumptions.
    No device-independent numerical range is implied by the standard name; representative
    magnitudes should be assessed from the scale $|\Gamma_{\perp,\mathrm{RE}}| \sim
    D_\perp n_{\mathrm{RE}}/L_\perp + |V_\perp| n_{\mathrm{RE}}$, where $L_\perp$
    is the characteristic density-gradient length in meters.


    Sign convention: Positive when the net flux is directed along the outward flux-surface
    normal from the magnetic axis toward the plasma boundary.'
  unit: m^-2.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:runaway_electrons/profiles_1d/transport_perpendicular/flux
    dd_path: runaway_electrons/profiles_1d/transport_perpendicular/flux
    status: composed
- name: poloidal_center_of_mass_velocity
  kind: scalar
  status: draft
  description: Poloidal component of the plasma center-of-mass velocity, computed
    as the mass-weighted mean of all contributing species fluid velocities projected
    onto the poloidal direction.
  documentation: 'The center-of-mass velocity describes the bulk fluid motion of the
    plasma as a whole, accounting for all ionic, electronic, and neutral particle
    species weighted by their mass density. The poloidal component $v_{\theta,\mathrm{cm}}$
    characterizes the net poloidal circulation of this composite fluid, which governs
    neoclassical poloidal rotation and enters the radial force balance that determines
    the radial electric field.


    The defining relation is:


    $$

    v_{\theta,\mathrm{cm}} = \frac{\sum_s m_s n_s v_{\theta,s}}{\sum_s m_s n_s}

    $$


    where $m_s$ is the particle mass of species $s$, $n_s$ its number density, and
    $v_{\theta,s}$ its individual poloidal fluid velocity, with the sum running over
    all plasma species.


    The poloidal component complements [toroidal_center_of_mass_velocity](name:toroidal_center_of_mass_velocity)
    to describe the bulk plasma flow in the poloidal plane; [poloidal_ion_velocity](name:poloidal_ion_velocity)
    and [poloidal_neutral_velocity](name:poloidal_neutral_velocity) give the individual
    species contributions. This quantity is inferred from multi-species charge exchange
    recombination spectroscopy combined with momentum-balance constraints in fluid
    transport modeling.


    Poloidal rotation speeds in tokamak plasmas are typically small relative to toroidal
    rotation, with values in the range 0.1-5 km/s in the plasma core and potentially
    higher magnitudes near internal transport barriers and the separatrix.


    Sign convention: Positive when the bulk plasma flow is directed in the direction
    of increasing poloidal angle $\theta$.'
  unit: m.s^-1
  physics_domain: transport
  links: []
  sources:
  - id: dd:edge_profiles/ggd/velocity_mass_centre/poloidal
    dd_path: edge_profiles/ggd/velocity_mass_centre/poloidal
    status: attached
  - id: dd:plasma_profiles/ggd/velocity_mass_centre/poloidal
    dd_path: plasma_profiles/ggd/velocity_mass_centre/poloidal
    status: composed
  - id: dd:plasma_transport/model/ggd/momentum/v/poloidal
    dd_path: plasma_transport/model/ggd/momentum/v/poloidal
    status: attached
- name: poloidal_ion_state_momentum_damping_rate
  kind: scalar
  status: draft
  description: Reciprocal of the relaxation time for collisional or neoclassical damping
    of the poloidal momentum of a specified ion species and charge state. The poloidal
    component is tangent to a magnetic flux surface in the meridional plane of the
    right-handed cylindrical (R, phi, Z) system and points along increasing theta
    in explicit flux coordinates such as (rho, theta, phi).
  documentation: 'Poloidal ion-state momentum damping rate is the reciprocal of the
    relaxation time over which the poloidal momentum of a specified ion species and
    charge state is dissipated. The poloidal component is tangent to a magnetic flux
    surface in the meridional $(R, Z)$ plane of the right-handed cylindrical $(R,
    \phi, Z)$ system, where $R$ is major radius, $\phi$ is toroidal angle, and $Z$
    is vertical height; equivalently it is the component along increasing $\theta$
    in an explicitly specified flux coordinate system such as $(\rho, \theta, \phi)$
    at fixed $\rho$ and $\phi$.


    In a local momentum-density balance, the damping contribution is represented as
    a linear relaxation term:


    $$

    \left(\frac{\partial p_{\theta,a}}{\partial t}\right)_\mathrm{damp} = -\nu_{\theta,a}\,
    p_{\theta,a}

    $$


    where $a$ labels the ion charge state, $\nu_{\theta,a}$ is the damping rate, and
    $p_{\theta,a} = m_a n_a V_{\theta,a}$ is the poloidal momentum density with $m_a$
    in kg, $n_a$ in m$^{-3}$, and $V_{\theta,a}$ in m s$^{-1}$. The minus sign makes
    the term dissipative: a non-negative $\nu_{\theta,a}$ relaxes the existing poloidal
    momentum toward zero regardless of its sign.


    This rate is typically obtained from collisional and neoclassical momentum-balance
    models, or inferred by fitting observed poloidal-flow relaxation to such a balance.
    It depends on charge state, ion mass and charge, density, temperature, magnetic
    geometry, collisionality, and coupling to other species through Coulomb friction
    and poloidal viscous stresses. Charge-state resolution matters for impurity species
    occupying several ionization stages simultaneously, each carrying a distinct damping
    coefficient; the species-summed counterpart is the poloidal ion momentum damping
    rate.


    As an order-of-magnitude guide, hot, weakly collisional core conditions tend to
    give values near $10^2$-$10^5$ s$^{-1}$, while cooler, denser, more collisional
    edge conditions and high-charge states can reach $10^5$-$10^7$ s$^{-1}$; these
    ranges are contextual rather than canonical.'
  unit: s^-1
  physics_domain: transport
  links:
  - name:ion_state_momentum_damping_rate
  - name:toroidal_ion_state_momentum_damping_rate
  - name:radial_ion_state_momentum_damping_rate
  - name:parallel_ion_state_momentum_damping_rate
  - name:poloidal_ion_momentum_damping_rate
  sources:
  - id: dd:core_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    dd_path: core_transport/model/profiles_1d/ion/state/momentum/poloidal/flow_damping_rate
    status: attached
