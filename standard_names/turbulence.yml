- name: parallel_normalized_particle_perturbed_pressure
  kind: scalar
  status: draft
  description: Normalized parallel pressure moment of the perturbed particle distribution
    function for a linear gyrokinetic eigenmode. It is the complex parallel component
    of the particle pressure perturbation, normalized to a reference pressure, and
    is distinct from the corresponding gyrocenter moment.
  documentation: 'The parallel normalized particle perturbed pressure is a dimensionless
    complex eigenmode moment of the perturbed particle distribution function. It represents
    the fluctuation of the pressure associated with random particle motion along the
    local magnetic-field direction, evaluated in particle variables rather than gyrocenter
    variables.


    For species $s$, using reference density $n_{\mathrm{ref},s}$ and reference temperature
    $T_{\mathrm{ref},s}$ expressed as an energy, a common normalization is


    $$

    \widehat{p}_{\parallel s}^{\,\mathrm{part}} = \frac{m_s}{n_{\mathrm{ref},s} T_{\mathrm{ref},s}}
    \int v_\parallel^2\,\delta f_s^{\,\mathrm{part}}(\mathbf{x},\mathbf{v})\,d^3v

    $$


    where $m_s$ is the particle mass, $v_\parallel$ is the particle velocity component
    along the magnetic field in $\mathrm{m\,s^{-1}}$, $\delta f_s^{\,\mathrm{part}}$
    is the perturbed particle distribution function in $\mathrm{m^{-6}\,s^3}$, and
    $d^3v$ is the velocity-space volume element in $\mathrm{m^3\,s^{-3}}$. The denominator
    $n_{\mathrm{ref},s}T_{\mathrm{ref},s}$ is a reference pressure; if temperature
    is supplied in eV it must be converted to joules for this expression.


    In linear gyrokinetic analysis this moment is computed by applying the parallel-pressure
    velocity-space weight to the particle perturbed distribution eigenfunction and
    integrating over velocity space. When the same reference pressure and particle
    distribution are used, the scalar normalized perturbed pressure is related to
    the gyrotropic components by $\widehat{p}_s^{\mathrm{part}}=(\widehat{p}_{\parallel
    s}^{\mathrm{part}}+2\widehat{p}_{\perp s}^{\mathrm{part}})/3$; this trace relation
    does not specify nongyrotropic or off-diagonal pressure-tensor moments. The particle
    moment should not be assumed equal to the gyrocenter parallel pressure moment,
    because the variables used in the velocity-space moment are different.


    Typical magnitudes are normalization dependent. With unit-amplitude eigenfunction
    normalizations, values from about $10^{-3}$ to $10$ are common, while ratios between
    species, radial locations, or pressure components and the relative complex phase
    usually carry more physical meaning than the absolute magnitude.


    For a linear eigenmode the overall complex amplitude and phase are arbitrary.
    A self-contained convention is obtained by choosing one reference eigenfunction
    component to be real with a fixed positive value; changing that choice multiplies
    all complex moments by the same complex constant, leaving relative phases and
    normalized ratios invariant.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:parallel_normalized_gyrocenter_perturbed_pressure
  - name:perpendicular_normalized_perturbed_pressure
  - name:normalized_perturbed_pressure
  - name:parallel_normalized_particle_perturbed_current_density
