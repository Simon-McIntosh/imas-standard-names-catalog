  documentation: 'Particle number density of the lithium ion population evaluated
    at the magnetic axis is the local lithium-ion count per physical volume at that
    location, summed over all lithium ionic charge states. It represents ionized lithium
    specifically, rather than electrons, neutral lithium, or another plasma population.


    The defining relation is


    $$

    n_{\mathrm{Li,axis}} = \left.\frac{dN_{\mathrm{Li}}}{dV}\right|_{\mathrm{axis}}
    = \left.\sum_{q\ge 1} n_{\mathrm{Li}^{q+}}\right|_{\mathrm{axis}}

    $$


    where $n_{\mathrm{Li,axis}}$ is the total lithium-ion number density at the magnetic
    axis, $N_{\mathrm{Li}}$ is the number of lithium ions, $V$ is physical volume,
    $q$ is the positive integer labeling a lithium ionic charge state, and $n_{\mathrm{Li}^{q+}}$
    is the number density of lithium ions in charge state $q$.


    The quantity is local to the magnetic axis, the innermost location of nested closed
    poloidal magnetic-flux surfaces where the poloidal-flux gradient vanishes. It
    applies to the complete ionized lithium population at that location and uses a
    sum over all lithium ionic charge states, not a density for one selected charge
    state or a sum over different chemical elements. It is neither a flux-surface
    nor volume integral and excludes neutral lithium.


    This is the lithium-specific realization of the population-independent [density
    at the magnetic axis](name:density_at_magnetic_axis). It has the same local-density
    and magnetic-axis scope as [deuterium density at the magnetic axis](name:deuterium_density_at_magnetic_axis),
    but counts lithium ions rather than deuterium ions; unlike [electron density at
    the magnetic axis](name:electron_density_at_magnetic_axis), it does not count
    electrons.'
