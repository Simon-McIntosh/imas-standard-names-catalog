- name: area_of_first_wall
  kind: scalar
  status: draft
  description: Total surface area of the plasma-facing first wall components that
    enclose the vessel interior.
  documentation: 'The first-wall surface area is the total geometric area of the solid
    material boundary directly exposed to the plasma, defining the primary plasma-facing
    surface area of the fusion device. This quantity is used to normalize global heat
    loads and particle fluxes to the wall, and to compute engineering parameters such
    as average heat flux $Q_{\mathrm{avg}} = P_{\mathrm{sep}} / A_{\mathrm{FW}}$ where
    $P_{\mathrm{sep}}$ is the power crossing the separatrix and $A_{\mathrm{FW}}$
    is the first-wall area. Typical values for ITER are approximately $900\,\mathrm{m}^2$
    for the first-wall panels. The area is obtained from the CAD model or engineering
    drawings of the vessel interior, integrated over all first-wall tiles, and is
    distinct from the [flux_surface_area](name:flux_surface_area) of internal magnetic
    surfaces. This quantity is sign-invariant as it represents a positive definite
    geometric extent.


    Sign convention: Positive when the surface area is defined as the outward-facing
    area of the first-wall contour.


    The companion quantity [volume_of_first_wall](name:volume_of_first_wall) describes
    the enclosed plasma-accessible volume, while [surface_area_of_divertor_target](name:surface_area_of_divertor_target)
    specifies the area of the divertor region separately.'
  unit: m^2
  physics_domain: structural_components
  links:
  - name:flux_surface_area
  - name:volume_of_first_wall
  - name:surface_area_of_divertor_target
  sources:
  - id: dd:wall/first_wall_surface_area
    dd_path: wall/first_wall_surface_area
    status: composed
- name: coolant_temperature_of_breeder_blanket
  kind: scalar
  status: draft
  description: Temperature of the coolant fluid at the outlet of the breeder blanket
    cooling circuit.
  documentation: "The outlet coolant temperature quantifies the thermal energy extracted\
    \ from the breeder blanket by the cooling circuit, representing the coolant fluid\
    \ temperature after it has passed through the blanket modules. It is a key parameter\
    \ for evaluating the thermal-hydraulic performance and heat removal capability\
    \ of the breeding blanket system. The temperature rise relative to the inlet temperature,\
    \ together with the coolant mass flow rate and specific heat capacity, determines\
    \ the thermal power deposited in the blanket from nuclear heating and plasma radiation.\
    \ Typical outlet temperatures for liquid breeder blankets (e.g., lead-lithium,\
    \ PbLi) range from 450 to 550 \xB0C in fusion reactor designs, depending on the\
    \ operating conditions and cooling loop configuration. This quantity is measured\
    \ by thermocouples or resistance temperature detectors (RTDs) installed at the\
    \ cooling circuit outlet ports of each blanket module. The temperature difference\
    \ between inlet and outlet is directly related to the [coolant_pressure](name:cockpit_pressure)\
    \ drop and the heat transfer coefficient of the coolant channels. See also [coolant_volume_of_breeder_blanket](name:coolant_volume_of_breeder_blanket)\
    \ for the total coolant inventory in the blanket."
  unit: K
  physics_domain: structural_components
  links:
  - name:cockpit_pressure
  - name:coolant_volume_of_breeder_blanket
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_inlet
    status: composed
  - id: dd:breeding_blanket/module/cooling/time_slice/temperature_outlet
    dd_path: breeding_blanket/module/cooling/time_slice/temperature_outlet
    status: composed
- name: nuclear_power_due_to_fusion
  kind: scalar
  status: draft
  description: Thermal power deposited in the breeding blanket by nuclear reactions,
    specifically from the attenuation of fusion neutrons and secondary gamma photons.
  documentation: "The nuclear power represents the volumetric heating rate within\
    \ the breeding blanket materials due to the slowing down and capture of 14.1 MeV\
    \ fusion neutrons and the subsequent gamma-ray cascade. This energy deposition\
    \ is the primary source of heat in the blanket, which must be extracted by the\
    \ coolant for both tritium breeding and electricity generation. The quantity is\
    \ driven by the fusion source strength, neutron transport cross-sections, and\
    \ blanket material composition. Typical values for a 500 MW fusion power plant\
    \ range from 10\u201330 MW per module, with peak volumetric heating rates of 5\u2013\
    15 MW/m\xB3 near the first wall. This heating is distinct from the [electron_power_at_inner_divertor_target](name:electron_power_at_inner_divertor_target),\
    \ which is from plasma exhaust, and from the [coolant_temperature_of_breeder_blanket](name:coolant_temperature_of_breeder_blanket),\
    \ which measures the thermal state of the coolant removing this heat."
  unit: W
  physics_domain: structural_components
  links:
  - name:electron_power_at_inner_divertor_target
  - name:coolant_temperature_of_breeder_blanket
  sources:
