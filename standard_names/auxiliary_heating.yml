- name: per_toroidal_mode_fast_electron_power_density
  kind: scalar
  status: draft
  description: RF wave energy deposition rate per unit volume into the suprathermal
    electron population, resolved per toroidal mode number, such that summing over
    all modes recovers the total fast electron power density.
  documentation: "Fast electron power density per toroidal mode is the volumetric\
    \ rate at which a coherent RF wave deposits energy into the suprathermal (non-thermal)\
    \ electron population attributed to a single toroidal harmonic of the wave field.\
    \ The fast electrons are those resonantly accelerated above the bulk thermal velocity\
    \ through wave-particle interaction, forming a non-Maxwellian energetic tail in\
    \ the electron distribution function.\n\nThe total [fast electron power density](name:fast_electron_power_density)\
    \ is recovered by summing over all toroidal mode numbers:\n\n$$\nP_\\mathrm{fast,e}(r)\
    \ = \\sum_{n_\\phi} p_\\mathrm{fast,e}(r,\\, n_\\phi)\n$$\n\nwhere $p_\\mathrm{fast,e}(r,\
    \ n_\\phi)$ is the power density contribution from toroidal mode number $n_\\\
    phi$ and $r$ is the radial coordinate.\n\nThe mode-resolved deposition is computed\
    \ by wave-propagation models \u2014 ray-tracing or full-wave solvers equipped\
    \ with quasilinear diffusion operators \u2014 that decompose the RF electric field\
    \ into toroidal harmonics and evaluate the mode-dependent damping on the fast\
    \ electron component of the distribution function.\n\nThe harmonic structure of\
    \ fast-electron absorption depends on wave type: electron cyclotron heating concentrates\
    \ deposition near the fundamental or harmonic cyclotron resonance in a narrow\
    \ toroidal mode range, while lower-hybrid and ICRH Landau and transit-time damping\
    \ distribute absorption across a broader toroidal mode spectrum. The fast-ion\
    \ counterpart is [per_toroidal_mode_fast_ion_power_density](name:per_toroidal_mode_fast_ion_power_density),\
    \ the thermal electron counterpart is [per_toroidal_mode_thermal_electron_power_density](name:per_toroidal_mode_thermal_electron_power_density),\
    \ and the mode-resolved total absorbed power density summed over all populations\
    \ is given by per_toroidal_mode_absorbed_power_density."
  unit: W.m^-3
  physics_domain: auxiliary_heating
  links:
  - name:fast_electron_power_density
