name: poloidal_component_of_electron_convective_velocity
description: Projection of the electron convective (bulk flow) velocity onto the poloidal
  direction in the tokamak cross-section.
documentation: "The poloidal electron convective velocity $v_{\\theta,e}^{\\mathrm{conv}}$\
  \ is the component of the mean electron fluid velocity along the poloidal unit vector\
  \ $\\hat{\\theta}$. It governs the poloidal convective transport of electron particles,\
  \ entering the continuity equation as $\\nabla \\cdot (n_e \\mathbf{v}_e^{\\mathrm{conv}})$,\
  \ where $n_e$ is the electron number density (m$^{-3}$). In the edge and scrape-off\
  \ layer, this velocity is primarily set by the $\\mathbf{E} \\times \\mathbf{B}$\
  \ drift and the electron diamagnetic drift $v_{\\mathrm{dia},e} = -\\nabla p_e \\\
  times \\mathbf{B} / (e n_e B^2)$, with $p_e$ the electron pressure (Pa) and $e$\
  \ the elementary charge (C). Typical magnitudes are $10^2$\u2013$10^4$ m/s in diverted\
  \ tokamak plasmas. The quantity is resolved in edge fluid transport codes such as\
  \ SOLPS-ITER, SOLEDGE2D, or UEDGE, and can be benchmarked against Langmuir-probe\
  \ Mach-number measurements in the SOL. See the ion counterpart and the parallel\
  \ electron momentum velocity for a complete picture of the electron flow field."
kind: vector_component
unit: m.s^-1
