- name: gap_of_antenna_strap
  kind: scalar
  status: active
  description: Gap of an antenna strap is the nonnegative perpendicular clearance
    from the rear-facing surface of an ion-cyclotron-range antenna strap conductor
    to the conducting wall directly behind it, on the side facing away from the plasma.
  documentation: 'Gap of an antenna strap is the scalar mechanical clearance between
    the rear-facing surface of an ion-cyclotron-range antenna strap conductor and
    the conducting wall directly behind it. It is defined on the side of the strap
    facing away from the plasma and represents the empty perpendicular separation,
    not a dimension of the conductor itself.


    The clearance is the minimum perpendicular separation from the strap rear surface
    to the rear conducting wall:


    $$

    g = \min_{\mathbf{x}\in S_\mathrm{rear}} d_\perp(\mathbf{x}, W_\mathrm{back})

    $$


    where $g$ is the antenna-strap gap in meters, $S_\mathrm{rear}$ is the rear-facing
    surface of the strap conductor, $W_\mathrm{back}$ is the conducting wall directly
    behind the strap, and $d_\perp$ is the nonnegative perpendicular distance in meters
    from point $\mathbf{x}$ on $S_\mathrm{rear}$ to $W_\mathrm{back}$.


    This name denotes the same rear-surface-to-back-wall clearance as [back_surface_gap_of_antenna_strap](name:back_surface_gap_of_antenna_strap),
    with shorter wording. It excludes strap body dimensions such as [thickness_of_antenna_strap](name:thickness_of_antenna_strap),
    [inner_radius_of_antenna_strap](name:inner_radius_of_antenna_strap), and [outer_radius_of_antenna_strap](name:outer_radius_of_antenna_strap),
    and it does not denote a signed displacement or a plasma-facing standoff distance.'
  unit: m
  physics_domain: auxiliary_heating
  links: []
  sources:
  - dd_path: ic_antennas/antenna/module/strap/distance_to_conductor
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-distance_to_conductor
    dd_documentation:
      leaf: Distance to conducting wall or other conductor behind the antenna strap
      parent_path: ic_antennas/antenna/module/strap
      parent: Set of IC antenna straps
      data_type: FLT_0D
      unit: m
    enhanced_context:
      description: Distance from an ICRH antenna strap to the conducting wall or conductor
        located behind it. This geometric parameter influences the antenna loading
        resistance and RF coupling efficiency to the plasma.
      kind: llm
- name: height_of_antenna_strap
  kind: scalar
  status: active
  description: "Full vertical extent of an ICRH antenna strap conductor cross-section,\
    \ measured parallel to the Z direction in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The antenna-strap height is the full vertical extent of the rectangular
    conductor cross-section, measured parallel to the $Z$ direction in the right-handed
    cylindrical $(R, \phi, Z)$ frame. It is a geometric cross-section dimension, not
    the antenna elevation or its distance from the plasma.


    $$

    H = Z_{\max} - Z_{\min}

    $$


    where $H$ is the strap height and $Z_{\max}$ and $Z_{\min}$ are the vertical coordinates
    of the upper and lower cross-section boundaries. The dimension is non-negative
    and complements the [toroidal width of the antenna strap](name:toroidal_width_of_antenna_strap)
    and [thickness of the antenna strap](name:thickness_of_antenna_strap), which describe
    the other conductor extents. For an annular cross-section, the radial boundaries
    are specified by the [inner radius of the antenna strap](name:inner_radius_of_antenna_strap)
    and [outer radius of the antenna strap](name:outer_radius_of_antenna_strap).'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:toroidal_width_of_antenna_strap
  - name:thickness_of_antenna_strap
  - name:inner_radius_of_antenna_strap
  - name:outer_radius_of_antenna_strap
  sources:
  - dd_path: ic_antennas/antenna/module/strap/geometry/rectangle/height
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/ic_antennas.html#ic_antennas-antenna-module-strap-geometry-rectangle-height
    dd_documentation:
