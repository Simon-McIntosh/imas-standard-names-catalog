- name: power_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: Non-negative kinetic power launched by a single neutral beam injector
    into the vacuum vessel, evaluated at the vessel interface before plasma absorption,
    shine-through, or orbit-loss corrections are applied.
  documentation: 'Power of a neutral beam injector is the rate at which kinetic energy
    carried by neutral atoms from one injector is launched into the vacuum vessel.
    It is a non-negative scalar evaluated before the beam interacts with the plasma,
    so it excludes subsequent absorption, shine-through, charge-exchange orbit loss,
    and other plasma-loss corrections.


    For an injector whose extracted ions give rise to full-, half-, and one-third-energy
    neutral components, a common source-current estimate is


    $$

    P_\mathrm{NBI} = I_\mathrm{ext} V_\mathrm{acc} \left(\eta_1 f_1 + \frac{\eta_2
    f_2}{2} + \frac{\eta_3 f_3}{3}\right)

    $$


    where $P_\mathrm{NBI}$ is the launched neutral power, $I_\mathrm{ext}$ is the
    extracted ion current in amperes, $V_\mathrm{acc}$ is the acceleration voltage
    in volts, $f_1$, $f_2$, and $f_3$ are the extracted source current fractions that
    produce neutrals at $E_0$, $E_0/2$, and $E_0/3$, and $\eta_1$, $\eta_2$, and $\eta_3$
    are the corresponding neutralization and beamline-transmission efficiencies. When
    the reported species fractions are already measured for neutrals delivered to
    the vessel interface, these efficiency factors are effectively included in those
    fractions.


    In practice, the launched power is obtained from source current and voltage measurements,
    species-fraction diagnostics, neutralizer and duct transmission estimates, and
    calorimetry on beam dumps. It is the per-injector quantity whose sum over active
    injectors contributes to [total_power_of_neutral_beam_injector](name:total_power_of_neutral_beam_injector),
    and it differs from [absorbed_power_of_neutral_beam_injector](name:absorbed_power_of_neutral_beam_injector),
    which is evaluated after plasma absorption and loss processes are applied.


    Typical launched powers for heating injectors are $1\times10^6$-$5\times10^6$
    W per injector in many medium-sized devices and $1\times10^7$-$2\times10^7$ W
    for high-power systems. Diagnostic neutral beams or low-power commissioning operation
    may be much lower, about $10^3$-$10^5$ W.'
  unit: W
  physics_domain: auxiliary_heating
  links:
  - name:beam_energy_fraction_of_neutral_beam_injector
  - name:absorbed_power_of_neutral_beam_injector
  - name:total_power_of_neutral_beam_injector
