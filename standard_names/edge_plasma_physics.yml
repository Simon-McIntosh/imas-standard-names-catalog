- name: parallel_neutral_species_particle_diffusivity
  kind: scalar
  status: active
  description: Effective coefficient relating neutral-species particle flux along
    magnetic field lines to the neutral number-density gradient in edge-plasma transport.
  documentation: 'The parallel neutral-species particle diffusivity is the effective
    Fickian transport coefficient for particle-number diffusion along the local magnetic-field
    direction. It characterizes neutral particle transport, not neutral thermal-energy
    transport.


    The parallel diffusive particle flux is defined by


    $$

    \Gamma_{\parallel,n} = -D_{\parallel,n}\nabla_{\parallel} n_n

    $$


    where $\Gamma_{\parallel,n}$ is the signed neutral particle flux density, $D_{\parallel,n}$
    is the parallel diffusivity, $n_n$ is the neutral-species number density, and
    $\nabla_{\parallel}=\hat{\mathbf b}\cdot\nabla$ is the derivative along the magnetic-field
    unit vector $\hat{\mathbf b}$. The minus sign specifies flux down the density
    gradient. This coefficient is the directional counterpart of the [neutral diffusion
    coefficient](name:neutral_diffusion_coefficient) and is distinct from the [poloidal
    neutral energy diffusion coefficient](name:poloidal_neutral_energy_diffusion_coefficient),
    which governs thermal-energy transport.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:neutral_diffusion_coefficient
  - name:poloidal_neutral_energy_diffusion_coefficient
  sources:
