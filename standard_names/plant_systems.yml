- name: oxygen_source_rate
  kind: scalar
  status: active
  description: Instantaneous equivalent-electron source rate of oxygen gas admitted
    to the plasma vessel, counting eight bound-electron equivalents per oxygen atom.
  documentation: 'This quantity is the instantaneous oxygen inventory rate delivered
    to the plasma vessel by gas injection, expressed using equivalent bound-electron
    counts. The weighting is based on oxygen atomic content rather than the molecular
    representation of the injected gas.


    $$

    \dot{N}_{\mathrm{eq,O}}(t)=8\dot{N}_{\mathrm{O}}(t)=16\dot{N}_{\mathrm{O_2}}(t)

    $$


    where $t$ is time, $\dot{N}_{\mathrm{eq,O}}$ is the equivalent-electron source
    rate, $\dot{N}_{\mathrm{O}}$ is the injected oxygen-atom rate, and $\dot{N}_{\mathrm{O_2}}$
    is the injected molecular-oxygen rate. The factors 8 and 16 are the numbers of
    bound-electron equivalents per oxygen atom and oxygen molecule, respectively.


    This instantaneous rate is the time derivative of the cumulative inventory represented
    by [accumulated oxygen count due to gas injection](name:accumulated_oxygen_count_due_to_gas_injection)
    and is a species-specific form of [source rate due to gas injection](name:source_rate_due_to_gas_injection).'
  unit: s^-1
