- name: absorbed_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Net photon power absorbed by a breeding blanket module from incident
    plasma radiation, equal to the incident radiated power on the module surface minus
    the reflectivity-weighted reflected photon power.
  documentation: 'Absorbed radiated power of a breeding blanket module is the net
    photon power deposited in the module by plasma radiation after reflection at its
    exposed surfaces. It is the radiative heat-load component of the module power
    balance and excludes particle heat flux, conductive heat transfer from neighboring
    structures, neutron nuclear heating, and internally generated power.


    The absorbed power is defined from the incident photon power and the reflected
    fraction:


    $$

    P_{\mathrm{abs}} = P_{\mathrm{inc}} - P_{\mathrm{refl}} = \left(1 - \alpha_{\mathrm{eff}}\right)
    P_{\mathrm{inc}}

    $$


    where $P_{\mathrm{abs}}$, $P_{\mathrm{inc}}$, and $P_{\mathrm{refl}}$ are powers
    in W, and $\alpha_{\mathrm{eff}}$ is an effective dimensionless radiative reflectivity
    for the relevant surface, spectrum, incidence angles, and operating conditions.
    The reflected power is therefore $P_{\mathrm{refl}} = \alpha_{\mathrm{eff}} P_{\mathrm{inc}}$.


    In practice, this quantity is computed by combining plasma radiation measurements
    or radiation-transport calculations with the module-facing geometry and surface
    optical properties. It is conceptually analogous to [radiated_power_at_wall](name:radiated_power_at_wall),
    but restricted to the portion of the wall represented by a breeding blanket module.


    Typical values are strongly device-, module-, and scenario-dependent: they may
    be near 0 W when no plasma radiation reaches the module, can be in the 10^3-10^6
    W range for substantial module-facing radiative loads, and may be higher for large
    blanket sectors in reactor-relevant designs.'
  unit: W
  physics_domain: structural_components
  links:
  - name:incident_radiated_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:net_thermal_power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_radiated
    dd_path: breeding_blanket/module/time_slice/power_thermal_radiated
    status: composed
- name: coolant_pressure_at_cooling_circuit_inlet
  kind: scalar
  status: draft
  description: Absolute static pressure of the coolant at the entry point of a cooling
    circuit, providing the upstream pressure boundary condition for hydraulic, heat-transfer,
    and structural-load calculations.
  documentation: 'Coolant pressure at a cooling-circuit inlet is the absolute static
    thermodynamic pressure of the fluid as it enters the hydraulically defined circuit
    or component. It sets the upstream pressure boundary condition for the momentum
    balance and influences coolant density, phase margin, pumping requirements, and
    pressure loading on the surrounding structure.


    For a hydraulically equivalent circuit segment after any hydrostatic head correction,
    the inlet pressure is commonly related to outlet pressure by the Darcy-Weisbach
    loss relation:


    $$

    P_\mathrm{in} = P_\mathrm{out} + \Delta P = P_\mathrm{out} + \left(f\frac{L}{D_h}
    + \sum_i K_i\right)\frac{\rho v^2}{2}

    $$


    where $P_\mathrm{in}$ and $P_\mathrm{out}$ are absolute static inlet and outlet
    pressures in Pa, $\Delta P$ is the pressure loss in Pa, $f$ is the dimensionless
    Darcy friction factor, $L$ is the flow length in m, $D_h$ is the hydraulic diameter
    in m, $K_i$ are dimensionless local-loss coefficients, $\rho$ is coolant mass
    density in kg m^-3, and $v$ is mean coolant speed in m s^-1.


    In practice, this pressure is measured with a static pressure tap and pressure
    transducer near the circuit entrance, or computed from pump, manifold, and hydraulic-resistance
    models. Its interpretation is closely tied to coolant_flow: the mass flow rate
    sets the mean speed through the flow area and therefore the frictional and local
    pressure losses. Thermal power removal is evaluated primarily from mass flow,
    [coolant_temperature_at_inlet](name:coolant_temperature_at_inlet), [coolant_temperature_at_outlet](name:coolant_temperature_at_outlet),
    and pressure-dependent coolant properties; inlet pressure alone does not determine
    the enthalpy rise or [net_thermal_power_of_breeder_blanket_module](name:net_thermal_power_of_breeder_blanket_module).


    Typical inlet pressures for structural-component cooling circuits range from 10^5-2
    x 10^7 Pa. Pressurized water and helium circuits commonly operate at 5 x 10^6-1.6
    x 10^7 Pa, while lower-pressure liquid-metal or auxiliary coolant loops may operate
    near 10^5-10^6 Pa.'
  unit: Pa
  physics_domain: structural_components
  links:
  - name:coolant_temperature_at_inlet
  - name:coolant_temperature_at_outlet
  - name:net_thermal_power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/cooling/time_slice/pressure_inlet
    dd_path: breeding_blanket/module/cooling/time_slice/pressure_inlet
    status: composed
- name: incident_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Power carried by fusion-born neutrons crossing into a single breeder
    blanket module. This is an incident surface load, not the energy deposited or
    multiplied inside the module.
  documentation: 'Incident power of a breeder blanket module is the rate at which
    kinetic energy of fusion-born neutrons enters one module across the surfaces exposed
    to the external neutron field. It is a non-negative incoming surface load, distinct
    from volumetric nuclear heating, tritium production, or neutron multiplication
    inside the module.


    The incident power $P_\mathrm{inc}$ is defined by integrating the incoming neutron
    energy current over the relevant module surface:


    $$

    P_\mathrm{inc} = \int_S \int_0^\infty E\, j_n^-(E,\mathbf{r})\, dE\, dA

    $$


    where $S$ is the module surface receiving the external fusion-neutron field, $E$
    is neutron kinetic energy in joules, $j_n^-(E,\mathbf{r})$ is the differential
    inward neutron current density at surface position $\mathbf{r}$ with units $m^{-2}\,s^{-1}\,J^{-1}$,
    $dE$ is an energy interval in joules, and $dA$ is a surface element in square
    meters. The inward-current notation includes only neutrons crossing into the module
    from outside; secondary neutrons generated after entry contribute to related neutron-power
    quantities rather than to this incident term.


    In practice, this quantity is evaluated from the energy- and angle-dependent neutron
    field at the module boundary, constrained by the fusion neutron source strength,
    module area and solid angle, gaps, and attenuation or shadowing by intervening
    structures. It provides a boundary load for breeding and heating analyzes; [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module)
    describes neutron power after interactions and multiplication within the module,
    while [power_of_breeder_blanket_module](name:power_of_breeder_blanket_module)
    represents the broader module power balance.


    Representative per-module values in reactor-scale deuterium-tritium blanket systems
    are typically $10^5-10^7$ W, with smaller test modules or heavily shadowed regions
    below $10^5$ W. Values scale mainly with total fusion neutron source strength,
    exposed area, geometric coverage, and shielding by nearby components.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_incident_neutron
    dd_path: breeding_blanket/module/time_slice/power_incident_neutron
    status: composed
- name: incident_radiated_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Total electromagnetic radiative power from the plasma arriving at the
    outer surface of a breeding blanket module, including bremsstrahlung and line
    radiation contributions, before accounting for surface reflection losses.
  documentation: 'The incident radiated power of a breeding blanket module is the
    total electromagnetic power from the surrounding plasma that arrives at the module''s
    outer surface, integrated over that surface per unit time. Plasma radiation sources
    contributing to this load include bremsstrahlung from electron-ion Coulomb collisions,
    impurity line radiation, and synchrotron emission, all transported across the
    scrape-off layer to the first-wall and blanket boundary.


    The incident radiative load is defined as:


    $$

    P_\mathrm{inc,rad} = \int_S \mathbf{q}_\mathrm{rad} \cdot \hat{n} \, dA

    $$


    where $\mathbf{q}_\mathrm{rad}$ is the local incident radiative heat-flux vector,
    $\hat{n}$ is the inward surface unit normal, and the integral extends over the
    total module surface area $A$.


    This quantity represents the gross radiative power before surface reflection;
    the net thermally retained fraction is captured by [absorbed_radiated_power_of_breeder_blanket_module](name:absorbed_radiated_power_of_breeder_blanket_module),
    which subtracts the reflected component. Together with nuclear heating quantified
    by [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    this term enters the full surface thermal balance of the blanket and is a key
    input for coolant circuit design and blanket lifetime assessment.'
  unit: W
  physics_domain: structural_components
  links:
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_incident_radiated
    dd_path: breeding_blanket/module/time_slice/power_incident_radiated
    status: composed
- name: net_thermal_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Net thermal power removed from a single breeder blanket module by its
    coolant. It equals the total coolant enthalpy increase summed across all coolant
    branches serving the module and combines nuclear energy deposition with the absorbed
    fraction of incident radiation that reaches the coolant.
  documentation: "Net thermal power of a breeder blanket module is the rate at which\
    \ the module's coolant circuit carries thermal energy away from that module. It\
    \ is an aggregate per-module power that combines thermal energy transferred to\
    \ the coolant from neutron and gamma heating, decay heat when relevant, and the\
    \ absorbed fraction of incident radiation, while excluding power generated or\
    \ removed outside the module boundary.\n\nFor a steady coolant circuit, the defining\
    \ calorimetric relation is the total coolant enthalpy rise across all coolant\
    \ branches serving the module:\n\n$$\nP_{\\mathrm{th,net}} = \\sum_k \\dot{m}_k\
    \ \\left(h_{\\mathrm{out},k} - h_{\\mathrm{in},k}\\right)\n$$\n\nwhere $k$ labels\
    \ coolant branches, $\\dot{m}_k$ is the coolant mass flow rate in branch $k$ (kg/s),\
    \ and $h_{\\mathrm{in},k}$ and $h_{\\mathrm{out},k}$ are the inlet and outlet\
    \ specific enthalpies (J/kg). The common expression $\\dot{m}\\, c_p\\, \\Delta\
    \ T$, with $c_p$ in J/(kg\xB7K), is a constant-$c_p$ approximation to this enthalpy\
    \ balance valid when pressure changes and the temperature dependence of the heat\
    \ capacity are small.\n\nThis module-level power aggregates the nuclear deposition\
    \ tracked by [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket)\
    \ and its layer-resolved counterpart [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer),\
    \ and shares the same coolant enthalpy-balance formalism as [thermal_power_of_plant_component_port](name:thermal_power_of_plant_component_port).\
    \ It feeds reactor-level power balance and tritium-breeding-efficiency assessments.\n\
    \nTypical values range from about $10^4$-$10^6$ W for small test blanket modules\
    \ or low-power operating phases, and about $10^6$-$10^7$ W per module for reactor-relevant\
    \ breeding blanket segments, depending on module size, neutron wall loading, coolant\
    \ design, and plasma radiated power.\n\nSign convention: Positive when thermal\
    \ energy is removed from the breeder blanket module by the coolant circuit."
  unit: W
  physics_domain: structural_components
  links:
  - name:total_neutron_power_of_breeder_blanket_module
  - name:absorbed_radiated_power_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:power_of_breeder_blanket_layer
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_extracted
    dd_path: breeding_blanket/module/time_slice/power_thermal_extracted
    status: composed
- name: neutron_maximum_back_surface_energy_flux_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Peak neutron energy flux density escaping through the plasma-distal
    rear face of a breeding blanket module, serving as the primary figure of merit
    for blanket shielding effectiveness against the fusion neutron field.
  documentation: 'The back surface of a breeding blanket module is its plasma-distal
    face, which interfaces with the vacuum vessel and structural components located
    behind the blanket. The maximum neutron energy flux at this surface quantifies
    the spatial peak of the neutron energy current per unit area escaping through
    the rear face after the neutron population has traversed the full blanket material
    stack, including breeding, multiplying, and structural layers.


    The local neutron energy flux at a point $\mathbf{r}$ on the back surface is:


    $$

    \Phi_n(\mathbf{r}) = \int_0^\infty \int_{\hat{\Omega}\cdot\hat{n}\,>\,0} E\,\psi(\mathbf{r},\hat{\Omega},E)\,(\hat{\Omega}\cdot\hat{n})\,d\hat{\Omega}\,dE

    $$


    where $\psi$ is the neutron angular flux (neutrons per unit area per unit time
    per unit solid angle per unit energy), $E$ is neutron energy, $\hat{\Omega}$ is
    the particle direction unit vector, and $\hat{n}$ is the outward surface normal
    at the back face. The standard name records the maximum of $\Phi_n$ over all back-surface
    area elements of the module.


    This quantity is evaluated through neutron transport calculations applied to the
    three-dimensional blanket geometry. For reactor-scale designs, the incoming neutron
    energy flux at the first wall is of order 2 MW m$^{-2}$; shielding requirements
    typically demand that back-surface values be reduced by three or more orders of
    magnitude to protect superconducting coils and other sensitive components. Compare
    with [neutron_maximum_energy_flux_at_first_wall](name:neutron_maximum_energy_flux_at_first_wall),
    which characterizes the peak incoming flux at the plasma-facing surface, and [nuclear_heating_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module)
    for the corresponding volumetrically integrated nuclear energy deposition.'
  unit: W.m^-2
  physics_domain: structural_components
  links:
  - name:neutron_maximum_energy_flux_at_first_wall
  - name:nuclear_heating_power_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/escape_flux_max
    dd_path: breeding_blanket/module/time_slice/escape_flux_max
    status: composed
- name: neutron_maximum_energy_flux_at_first_wall
  kind: scalar
  status: draft
  description: Maximum over the plasma-facing first-wall surface of the incoming neutron
    energy current per unit area for a breeding blanket module. It counts neutrons
    crossing into the wall from the plasma side, not rear-surface or outgoing crossings.
  documentation: 'Neutron maximum energy flux at the first wall is the largest local
    incident neutron power per unit area on the plasma-facing surface of a breeding
    blanket module. It is a surface-crossing quantity: only the incoming component
    of the neutron angular current through the first-wall surface is included, and
    the reported value is the maximum over that surface.


    For a first-wall surface $S_{fw}$ with unit normal $\hat{n}$ pointing from the
    blanket material toward the plasma, the local incident neutron energy flux can
    be defined from the neutron angular flux $\Phi_n(\mathbf{r},E,\hat{\Omega})$ as:


    $$

    q_n^{inc}(\mathbf{r}) = \int_0^\infty \int_{\hat{\Omega}\cdot\hat{n}<0} E\,\Phi_n(\mathbf{r},E,\hat{\Omega})\,|\hat{\Omega}\cdot\hat{n}|\,d\hat{\Omega}\,dE,
    \qquad q_{n,max}^{inc}=\max_{\mathbf{r}\in S_{fw}} q_n^{inc}(\mathbf{r})

    $$


    where $E$ is neutron kinetic energy, $\hat{\Omega}$ is the neutron flight direction,
    and the condition $\hat{\Omega}\cdot\hat{n}<0$ selects neutrons traveling from
    the plasma side into the first wall. The absolute projected factor makes the incident
    flux non-negative and excludes neutrons leaving the material surface.


    In practice this quantity is computed with neutron transport calculations using
    the fusion neutron source, detailed blanket and vessel geometry, material compositions,
    and local surface normals. Experimental constraints may come from activation foils,
    fission chambers, or other neutron monitors, but the local maximum on the first-wall
    surface is usually obtained from a validated neutronics model rather than direct
    point measurement.


    Typical peak values are about $10^5$-$10^6$ W m$^{-2}$ in lower-power experimental
    blanket environments and $10^6$-$10^7$ W m$^{-2}$ in reactor-class deuterium-tritium
    blanket designs. The corresponding surface integral over the first wall gives
    an integrated neutron power, while back-surface neutron energy flux characterizes
    neutrons crossing the opposite side of the module.'
  unit: W.m^-2
  physics_domain: structural_components
  links:
  - name:neutron_maximum_back_surface_energy_flux_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/module/time_slice/wall_flux_max
    dd_path: breeding_blanket/module/time_slice/wall_flux_max
    status: composed
- name: nuclear_heating_power_of_breeder_blanket_layer
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited within one material layer of
    a breeding blanket by neutron and photon energy deposition in that layer.
  documentation: 'Nuclear heating power of a breeder blanket layer is the total rate
    at which fusion-born neutrons and secondary photons deposit energy in the material
    volume assigned to that layer. It includes local energy deposition from nuclear
    reactions and photon interactions in structural, breeder, multiplier, coolant-channel,
    or other functional materials that belong to the layer.


    It is obtained by integrating the local nuclear heating power density over the
    layer volume:


    $$

    P_{\mathrm{nuc}} = \int_{V_{\mathrm{layer}}} q_{\mathrm{nuc}}(\mathbf{x})\, dV

    $$


    where $P_{\mathrm{nuc}}$ is the layer nuclear heating power in W, $V_{\mathrm{layer}}$
    is the physical volume of the layer in m$^3$, $dV$ is a differential volume element
    in m$^3$, and $q_{\mathrm{nuc}}$ is the local nuclear heating power density in
    W m$^{-3}$.


    In practice this quantity is computed from coupled neutron-photon transport and
    nuclear data, usually by tallying heating over the material cells representing
    the layer. Gamma heating should be interpreted as energy deposited by photons
    produced by neutron interactions, activation, capture, inelastic scattering, or
    other photon sources represented in the transport model, not as a universal signature
    of a particular breeding reaction. If a module is decomposed into non-overlapping
    layers that completely partition the module volume, the sum of the layer heating
    powers equals the corresponding [module nuclear heating power](name:nuclear_heating_power_of_breeder_blanket_module);
    otherwise gaps, overlaps, homogenization choices, and separately modeled components
    can make the sums differ.


    Typical values for a single blanket-module layer range from about 10^3-10^6 W
    in reactor-relevant blanket designs, depending on neutron wall loading, layer
    volume, material composition, and radial position. Small test modules or weakly
    irradiated peripheral layers may be below this range, while large high-power modules
    or layers close to the plasma-facing side can exceed it.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_power_density_of_breeder_blanket_layer
  - name:power_of_breeder_blanket_layer
  sources:
  - id: dd:breeding_blanket/module/layer/time_slice/power_nuclear
    dd_path: breeding_blanket/module/layer/time_slice/power_nuclear
    status: composed
- name: nuclear_heating_power_of_breeder_blanket_module
  kind: scalar
  status: draft
  description: Total nuclear heating power deposited in a single breeder blanket module
    by neutron scattering, neutron capture, and secondary gamma radiation interactions
    with the module's structural and functional materials.
  documentation: 'Nuclear heating power of a breeder blanket module is the total rate
    at which neutron and photon radiation transfer energy to the structural and functional
    materials comprising that module. The dominant mechanisms are neutron elastic
    and inelastic scattering, exothermic neutron capture reactions (including lithium
    reactions that also breed tritium), and absorption of secondary gamma rays produced
    throughout the module volume.


    The module-level heating power is the volume integral of the local nuclear heating
    power density $q_\text{nuc}(\mathbf{r})$ over the module volume $V$:


    $$

    P_\text{nuc} = \int_V q_\text{nuc}(\mathbf{r}) \, dV

    $$


    where $q_\text{nuc}$ is the volumetric energy deposition rate in W m$^{-3}$, as
    described by [nuclear_power_density_of_breeder_blanket_module](name:nuclear_power_density_of_breeder_blanket_module).


    This quantity is obtained from neutron and photon transport simulations and feeds
    directly into thermal-hydraulic analyzes for coolant sizing and material temperature
    verification. It is more spatially resolved than [nuclear_heating_power_of_breeder_blanket](name:nuclear_heating_power_of_breeder_blanket),
    which aggregates over all modules, and complements [nuclear_heating_power_of_breeder_blanket_layer](name:nuclear_heating_power_of_breeder_blanket_layer),
    which further resolves heating by material layer within the module. Unlike [total_neutron_power_of_breeder_blanket_module](name:nuclear_heating_power_of_breeder_blanket_module),
    this quantity includes gamma-ray heating contributions and accounts only for energy
    absorbed rather than that generated within the module.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_heating_power_of_breeder_blanket_layer
  sources:
  - id: dd:breeding_blanket/module/time_slice/power_thermal_neutrons
    dd_path: breeding_blanket/module/time_slice/power_thermal_neutrons
    status: composed
- name: nuclear_heating_power_of_breeder_blanket_shield
  kind: scalar
  status: draft
  description: Nuclear heating power deposited in the breeding blanket shield by neutron
    and gamma radiation interactions with shield structural materials.
  documentation: 'The breeder blanket shield absorbs residual neutron and gamma radiation
    that penetrates the breeding zone, converting particle energy to heat through
    neutron scattering, capture reactions, and Compton scattering of secondary photons.
    This thermal load determines the cooling circuit requirements for the shield structure
    and is a principal design constraint for protecting superconducting magnets from
    radiation-induced heating.


    The total nuclear heating power is the volume integral of the local nuclear power
    density $q''''''(\mathbf{r})$ over the shield volume $V_\mathrm{shield}$:


    $$

    P_\mathrm{shield} = \int_{V_\mathrm{shield}} q''''''(\mathbf{r}) \, dV

    $$


    where $q''''''(\mathbf{r})$ is in W m$^{-3}$ and sums contributions from both
    neutron and secondary gamma interactions throughout the shield material.


    This quantity is evaluated via neutron transport analysis using validated nuclear
    cross-section libraries for the shield material composition, benchmarked against
    integral activation experiments. It is the shield-level analog of the layer-resolved
    [nuclear heating power of a breeder blanket layer](name:nuclear_heating_power_of_breeder_blanket_layer)
    and the blanket-wide integral [nuclear heating power of the full breeding blanket](name:nuclear_heating_power_of_breeder_blanket);
    the volumetric counterpart [nuclear power density of a breeder blanket module](name:nuclear_power_density_of_breeder_blanket_module)
    provides the spatially resolved distribution used in detailed thermal-hydraulic
    analyzes.'
  unit: W
  physics_domain: structural_components
  links:
  - name:nuclear_heating_power_of_breeder_blanket_layer
  - name:nuclear_heating_power_of_breeder_blanket
  - name:nuclear_power_density_of_breeder_blanket_module
  sources:
  - id: dd:breeding_blanket/time_slice/power_nuclear_shields
    dd_path: breeding_blanket/time_slice/power_nuclear_shields
    status: composed
- name: nuclear_power_density_of_limiter_tile
  kind: scalar
  status: draft
  description: Local volumetric heating rate in a limiter tile due to neutron scattering,
    neutron capture, and secondary gamma radiation interactions with the tile material.
  documentation: 'Nuclear power density in a limiter tile is the volumetric rate of
    energy deposition arising from nuclear interactions between the fusion neutron
    field and the tile material, including fast neutron elastic and inelastic scattering,
    radiative capture, and secondary gamma heating. It characterizes how the total
    nuclear heat load is distributed spatially within the tile volume.


    The nuclear power density $q''''''_\mathrm{nuc}(\mathbf{r})$ at a point $\mathbf{r}$
    within the tile is:


    $$

    q''''''_\mathrm{nuc}(\mathbf{r}) = \sum_r \Sigma_r(\mathbf{r})\,\phi(\mathbf{r})\,Q_r

    $$


    where $\Sigma_r(\mathbf{r})$ is the macroscopic cross section for reaction $r$,
    $\phi(\mathbf{r})$ is the local neutron flux, and $Q_r$ is the energy deposited
    per reaction. Integrating $q''''''_\mathrm{nuc}$ over the tile volume yields the
    total nuclear power deposited in the tile, as given by [nuclear_power_of_limiter_tile](name:nuclear_power_of_limiter_tile).


    This quantity is computed from neutronics transport calculations using the fusion
    neutron source spectrum and material-specific nuclear cross-section libraries,
    with the spatial distribution depending on local material composition and tile
    geometry. Analogous volumetric nuclear heating quantities for breeding blanket
    structures are given by [nuclear_power_density_of_breeder_blanket_module](name:nuclear_power_density_of_breeder_blanket_module)
    and [nuclear_power_density_of_breeder_blanket_layer](name:nuclear_power_density_of_breeder_blanket_layer),
    where nuclear deposition additionally drives tritium breeding.'
  unit: W.m^-3
  physics_domain: structural_components
  links:
  - name:nuclear_power_of_limiter_tile
  - name:nuclear_power_density_of_breeder_blanket_module
  - name:nuclear_power_density_of_breeder_blanket_layer
  sources:
  - id: dd:wall/description_2d/limiter/unit/midplane_power_density_nuclear
    dd_path: wall/description_2d/limiter/unit/midplane_power_density_nuclear
    status: composed
- name: resistance_of_cryostat
  kind: scalar
  status: draft
  description: Electrical resistance of a discrete block element of the cryostat passive
    conductor structure, covering both the structural vessel and thermal shield segments,
    used in eddy current and electromagnetic analyzes.
  documentation: 'The electrical resistance of a discrete cryostat element quantifies
    its opposition to current flow, characterizing the ohmic property of a localized
    conducting segment within the passive cryostat structure. The cryostat passive
    structure encompasses both the structural vessel body and the thermal shield;
    in lumped-circuit electromagnetic models each is discretized into finite block
    elements, each assigned a resistance value.


    For a homogeneous element, the resistance relates to the bulk material resistivity
    $\rho$ (see [resistivity_of_cryostat](name:resistivity_of_cryostat)) through:


    $$

    R = \frac{\rho \, \ell}{A}

    $$


    where $\ell$ is the current-path length through the element and $A$ is the cross-sectional
    area perpendicular to current flow.


    During plasma disruptions, halo events, or fast field transients, time-varying
    magnetic fluxes induce eddy currents in the passive cryostat structure; the per-element
    resistance governs both the magnitude of the [toroidal current of the cryostat](name:toroidal_current_of_cryostat)
    and the Joule dissipation rate $P = I^2 R$ in each segment. The analogous quantity
    for the vacuum vessel passive structure is [resistance_of_vacuum_vessel](name:resistance_of_vacuum_vessel),
    which follows the same discrete-element methodology. For large fusion-device cryostats
    fabricated from austenitic stainless steel or Inconel, individual block-element
    resistances typically fall in the micro-ohm to milli-ohm range, depending on element
    geometry and alloy composition.'
  unit: ohm
  physics_domain: structural_components
  links:
  - name:resistivity_of_cryostat
  - name:toroidal_current_of_cryostat
  - name:resistance_of_vacuum_vessel
