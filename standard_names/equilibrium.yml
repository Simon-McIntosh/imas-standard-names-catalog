- name: poloidal_magnetic_flux_at_minimum_safety_factor
  kind: scalar
  status: draft
  description: Poloidal magnetic flux on the closed flux surface where the safety
    factor profile attains its minimum value. It is a dimensional flux given in webers
    that labels that surface, not the dimensionless normalized flux coordinate of
    the same surface.
  documentation: 'Poloidal magnetic flux at minimum safety factor is the value of
    the poloidal magnetic flux on the closed flux surface where the safety factor
    profile reaches its minimum. It provides an absolute, dimensional flux label (in
    webers) for that surface, as opposed to the dimensionless normalized poloidal
    flux coordinate of the same surface.


    The quantity is defined by selecting the flux surface that minimizes the safety
    factor and reading off its poloidal flux:


    $$

    \psi_{q_{\min}} = \psi(\chi_\ast), \qquad \chi_\ast \in \operatorname*{arg\,min}_{\chi
    \in \mathcal{D}} q(\chi)

    $$


    where $\psi$ is the poloidal magnetic flux in Wb, $q$ is the dimensionless safety
    factor, $\chi$ is any monotonic label ordering the nested closed flux surfaces
    of the domain $\mathcal{D}$, and $\chi_\ast$ labels a surface on which $q = q_\mathrm{min}$.
    The argmin form makes no assumption that the minimum is an interior extremum:
    it may occur at the magnetic axis, at an interior surface, or near the plasma
    boundary. The poloidal flux itself is the magnetic flux through a horizontal disk
    centered on the toroidal symmetry axis, $\psi(R,Z) = \int_0^R B_Z(R'',Z)\,2\pi
    R''\,dR''$, and is defined only up to an arbitrary additive gage constant; only
    flux differences (for example relative to the magnetic axis or boundary) are physically
    meaningful.


    In practice the quantity is obtained from an equilibrium reconstruction by evaluating
    $q$ over the nested closed flux surfaces, identifying the surface that attains
    $q_\mathrm{min}$, and interpolating the corresponding $\psi$ value. The same surface
    can be expressed in dimensionless form by [normalized_poloidal_flux_coordinate_at_minimum_safety_factor](name:normalized_poloidal_flux_coordinate_at_minimum_safety_factor)
    via a normalization such as $\psi_N = (\psi - \psi_\mathrm{axis})/(\psi_\mathrm{boundary}
    - \psi_\mathrm{axis})$, where $\psi_\mathrm{axis}$ and $\psi_\mathrm{boundary}$
    are the magnetic-axis and boundary fluxes; this removes the gage ambiguity inherent
    in the dimensional value.


    Typical magnitudes scale with device size, plasma current, toroidal field, and
    the gage chosen for $\psi$, so absolute values are reported as flux differences
    from the magnetic axis. Monotonic-shear equilibria place the minimum at or near
    the magnetic axis, while reversed-shear configurations move it to mid-radius or
    farther out.


    Sign convention: Positive when the poloidal magnetic flux through the enclosed
    horizontal disk centered on the toroidal symmetry axis is oriented along $+\hat{Z}$
    in the right-handed cylindrical $(R, \phi, Z)$ frame, where $Z$ is vertical height.'
  unit: Wb
  physics_domain: equilibrium
  links: []
  sources:
  - id: dd:equilibrium/time_slice/global_quantities/q_min/psi
    dd_path: equilibrium/time_slice/global_quantities/q_min/psi
    status: composed
- name: poloidal_magnetic_flux_at_plasma_boundary
  kind: scalar
  status: draft
  description: Poloidal magnetic flux at the plasma boundary is the value of the axisymmetric
    equilibrium flux function on the last closed flux surface. It is paired with the
    magnetic-axis flux to define normalized poloidal-flux coordinates.
  documentation: 'Poloidal magnetic flux at the plasma boundary, denoted $\psi_b$,
    is the value of the equilibrium poloidal-flux function on the last closed flux
    surface (LCFS), the outermost closed magnetic surface enclosing confined plasma.
    In diverted configurations the LCFS passes through an X-point; in limited configurations
    it contacts the limiter. This boundary value is the outer endpoint paired with
    [poloidal_magnetic_flux_at_magnetic_axis](name:poloidal_magnetic_flux_at_magnetic_axis)
    for flux-coordinate normalization.


    For an axisymmetric equilibrium, the poloidal magnetic flux at a boundary point
    can be written as the flux of the vertical magnetic-field component through a
    horizontal disk centered on the toroidal symmetry axis in the right-handed cylindrical
    $(R, \phi, Z)$ system:


    $$

    \psi_b = \int_0^{R_b} B_Z(R'', Z_b)\,2\pi R''\,dR''

    $$


    where $B_Z$ is the vertical magnetic-field component in tesla, $R_b$ and $Z_b$
    are the coordinates of a point on the LCFS, and $R''$ is the integration radius.
    In an exact axisymmetric equilibrium, $\psi$ is constant on the LCFS, so any point
    on that surface gives the same boundary value; the resulting $\psi_b$ is in webers.


    This quantity is obtained from equilibrium reconstruction by determining the poloidal-flux
    function and locating its outermost closed contour. Together with the axis value
    $\psi_0$, it defines the [normalized_poloidal_flux_coordinate](name:normalized_poloidal_flux_coordinate)
    through the endpoint relation $\psi_N=(\psi-\psi_0)/(\psi_b-\psi_0)$, so that
    the magnetic axis maps to 0 and the plasma boundary maps to 1.


    Typical absolute magnitudes are 0.1-5 Wb in small to medium tokamaks and several
    to tens of Wb in large, high-current devices, depending mainly on plasma current,
    toroidal magnetic field, and plasma size.


    Sign convention: Positive when $B_Z$ on the horizontal integration disk is directed
    in the $+Z$ direction of the right-handed cylindrical $(R, \phi, Z)$ system.'
  unit: Wb
  physics_domain: equilibrium
  links: []
  sources:
