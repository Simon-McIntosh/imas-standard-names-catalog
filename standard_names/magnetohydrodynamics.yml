- name: mode_number
  kind: vector
  status: active
  description: Dimensionless mode-number vector labeling the radial branch and poloidal
    and toroidal periodicities of a linear magnetohydrodynamic perturbation.
  documentation: 'This quantity is the collection of discrete mode labels that identifies
    a linear magnetohydrodynamic perturbation across its radial, poloidal, and toroidal
    structure. It is a mode-index vector, not a spatial wavevector or a physical displacement
    vector.


    $$

    \mathbf{N} = (n_r, m, n_\phi)

    $$


    where $n_r$ is the non-negative radial branch index, $m$ is the integer poloidal
    Fourier harmonic, and $n_\phi$ is the integer toroidal Fourier harmonic. The radial
    component is defined by the number of radial nodes, as described by the [radial
    mode number](name:radial_mode_number); the angular components label periodicity
    and correspond to the [poloidal mode number](name:poloidal_mode_number) and [toroidal
    MHD mode number](name:toroidal_mhd_mode_number). Coupled poloidal harmonics may
    belong to one eigenmode, so the vector identifies the mode labels rather than
    requiring a single separable spatial harmonic.'
  unit: '1'
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_mode_number
  - name:poloidal_mode_number
  - name:toroidal_mhd_mode_number
  sources:
  - dd_path: distribution_sources/source/markers/orbit_integrals/m_pol
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/distribution_sources.html#distribution_sources-source-markers-orbit_integrals-m_pol
    dd_documentation:
      leaf: Array of poloidal mode numbers, where quantities vary as exp(-i.m_pol.theta)
        and theta is the angle defined by the choice of ../../coordinate_identifier,
        with its centre at the magnetic axis recalled at the root of this IDS
      parent_path: distribution_sources/source/markers/orbit_integrals
      parent: 'Integrals along the markers orbit. These dimensionless expressions
        are of the form: (1/tau) integral (f(n_tor,m_pol,k,eq,...) dt) from time -
        tau to time, where tau is the transit/trapping time of the marker and f()
        a dimensionless function (phase factor,drift,etc) of the equilibrium (e.g.
        q) and perturbation (Fourier harmonics n_tor,m_pol and bounce harmonic k)
        along the particles orbits. In fact the integrals are taken during the last
        orbit of each marker at the time value of the time node below'
      data_type: INT_1D
      unit: ''
      coordinates:
      - 1...N
    enhanced_context:
      description: "Array of poloidal mode numbers (m_pol) indexing the Fourier decomposition\
        \ of orbit integrals along marker trajectories, where perturbations vary as\
        \ exp(\u2212i\xB7m_pol\xB7\u03B8). Used in kinetic wave-particle resonance\
        \ calculations."
