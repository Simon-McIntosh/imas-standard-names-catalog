- name: perturbed_plasma_pressure
  kind: scalar
  status: draft
  description: First-order linear perturbation of the total plasma pressure about
    a magnetohydrostatic equilibrium, expressed as a complex eigenfunction for a given
    toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The perturbed plasma pressure $\delta p$ is the first-order variation
    of the scalar plasma pressure about a static magnetohydrodynamic equilibrium.
    When the equilibrium is subjected to a small displacement decomposed into toroidal
    Fourier harmonics $e^{in\phi}$, the resulting $\delta p$ for each toroidal mode
    number $n$ is a complex-valued eigenfunction whose amplitude and spatial phase
    describe the spatial structure of the pressure disturbance across flux surfaces.


    The adiabatic linearized relation governing $\delta p$ in terms of the plasma
    displacement vector $\boldsymbol{\xi}$ is:


    $$

    \delta p = -\boldsymbol{\xi} \cdot \nabla p_0 - \Gamma p_0 \nabla \cdot \boldsymbol{\xi}

    $$


    where $p_0$ is the equilibrium scalar pressure (see [plasma_pressure](name:plasma_pressure)),
    and $\Gamma$ is the adiabatic index ($5/3$ for a fully ionized monatomic plasma).
    The overall magnitude and phase of the eigenfunction are set by the normalization
    convention of the stability solver.


    The complex eigenfunction is decomposed into its [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part)
    and [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part),
    which together fully specify $\delta p$ for a given mode. The pressure perturbation
    is the primary scalar driver of ideal MHD ballooning and interchange modes; the
    total energy content of the associated eigenmode is quantified by per_toroidal_mode_perturbed_energy.
    Analogous complex eigenfunctions for other fluid variables are defined consistently,
    as illustrated by [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part)
    for the density perturbation.'
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:plasma_pressure
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_real_part
  arguments:
  - name: plasma_pressure
    operator: perturbed
    operator_kind: qualifier
- name: perturbed_plasma_pressure_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex first-order plasma pressure perturbation
    eigenfunction for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The perturbed plasma pressure $\tilde{p}$ is the complex scalar
    eigenfunction representing the linearized first-order pressure perturbation for
    a single toroidal mode number $n$ in a linear MHD stability calculation. The total
    pressure decomposes as $p = p_0 + \mathrm{Re}[\tilde{p}\,e^{i(n\phi - \omega t)}]$,
    where $p_0$ is the equilibrium pressure profile, $\phi$ is the toroidal angle
    in the right-handed cylindrical $(R, \phi, Z)$ frame, and $\omega$ is the complex
    eigenfrequency.


    This quantity is the imaginary component of $\tilde{p}$ under the standard complex
    decomposition:


    $$

    \tilde{p} = \mathrm{Re}(\tilde{p}) + i\,\mathrm{Im}(\tilde{p})

    $$


    where both $\mathrm{Re}(\tilde{p})$ and $\mathrm{Im}(\tilde{p})$ are real-valued
    scalar fields resolved on the two-dimensional poloidal cross-section. Combined
    with [perturbed_plasma_pressure_real_part](name:perturbed_plasma_pressure_real_part),
    this quantity fully specifies the complex pressure perturbation amplitude at each
    grid point for the given mode.


    The imaginary part encodes the local spatial phase of the pressure perturbation
    relative to the phase reference convention of the linear MHD eigenvalue solver.
    Eigenfunction normalization is solver-dependent, so absolute amplitudes are physically
    meaningful only when a normalization convention is explicitly fixed. This quantity
    is structurally analogous to [perturbed_plasma_mass_density_imaginary_part](name:perturbed_plasma_mass_density_imaginary_part)
    and [perturbed_plasma_temperature_imaginary_part](name:perturbed_plasma_temperature_imaginary_part),
    which follow the same Fourier decomposition for their respective physical scalars.


    Sign convention: Positive when $\mathrm{Im}(\tilde{p}) > 0$ under the decomposition
    $\tilde{p} = \mathrm{Re}(\tilde{p}) + i\,\mathrm{Im}(\tilde{p})$ with toroidal
    Fourier factor $e^{in\phi}$, where $\phi$ increases counter-clockwise viewed from
    above $+\hat{Z}$.'
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_pressure_real_part
  - name:perturbed_plasma_mass_density_imaginary_part
  - name:perturbed_plasma_temperature_imaginary_part
  arguments:
  - name: perturbed_plasma_pressure
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/pressure_perturbed/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/pressure_perturbed/imaginary
    status: composed
- name: perturbed_plasma_pressure_real_part
  kind: complex
  status: draft
  description: Real part of the complex first-order plasma pressure perturbation eigenfunction
    for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The real part of the complex pressure perturbation eigenfunction
    $\tilde{p}$ gives the in-phase component of the linearized first-order pressure
    variation associated with a given toroidal MHD mode, distributed over the poloidal
    cross-section.


    The full pressure field decomposes as:


    $$

    p = p_0 + \text{Re}\!\left[\tilde{p}(R,Z)\, e^{i(n_\phi \phi - \omega t)}\right]

    $$


    where $p_0$ is the equilibrium pressure profile, $n_\phi$ is the toroidal mode
    number, $\phi$ is the toroidal angle in the right-handed cylindrical $(R, \phi,
    Z)$ frame, and $\omega$ is the complex MHD eigenfrequency. The quantity $\text{Re}(\tilde{p})$
    is the real component of the parent eigenfunction [perturbed_plasma_pressure](name:perturbed_plasma_pressure)
    evaluated on the poloidal plane.


    Together with the [perturbed_plasma_pressure_imaginary_part](name:perturbed_plasma_pressure_imaginary_part),
    it fully specifies the complex amplitude and phase of $\tilde{p}$; the amplitude
    is $|\tilde{p}| = \sqrt{\text{Re}(\tilde{p})^2 + \text{Im}(\tilde{p})^2}$. Analogous
    real-part eigenfunctions for other linearized MHD perturbation quantities include
    [perturbed_plasma_mass_density_real_part](name:perturbed_plasma_mass_density_real_part)
    and [perturbed_plasma_temperature_real_part](name:perturbed_plasma_temperature_real_part).


    This quantity is produced by linear MHD stability solvers as part of the eigenvalue
    problem on the poloidal grid. Because the eigenfunction phase is fixed by the
    solver normalization convention, the absolute sign of $\text{Re}(\tilde{p})$ is
    convention-dependent; only relative magnitudes and phase angles among the perturbed
    quantities in the same eigenfunction carry physical content.'
  unit: Pa
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_plasma_pressure
  - name:perturbed_plasma_pressure_imaginary_part
  - name:perturbed_plasma_mass_density_real_part
  - name:perturbed_plasma_temperature_real_part
  arguments:
  - name: perturbed_plasma_pressure
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/plasma/pressure_perturbed/real
    dd_path: mhd_linear/time_slice/toroidal_mode/plasma/pressure_perturbed/real
    status: composed
- name: perturbed_vacuum_magnetic_field
  kind: vector
  status: draft
  description: Complex first-order magnetic-field perturbation vector in the current-free
    vacuum region outside the plasma, forming a single-toroidal-mode eigenfunction
    in linear MHD stability analysis.
  documentation: "The perturbed vacuum magnetic field $\\delta\\mathbf{B}_\\mathrm{vac}$\
    \ is the complex first-order perturbation of the magnetic-field vector in the\
    \ exterior current-free domain surrounding the plasma, arising in linear MHD stability\
    \ analysis when the plasma undergoes a small displacement from equilibrium relative\
    \ to the background [vacuum_magnetic_field](name:vacuum_magnetic_field). In this\
    \ region all plasma currents are absent, so the perturbation obeys the source-free\
    \ Maxwell conditions $\\nabla \\times \\delta\\mathbf{B}_\\mathrm{vac} = 0$ and\
    \ $\\nabla \\cdot \\delta\\mathbf{B}_\\mathrm{vac} = 0$.\n\nBecause the vacuum\
    \ perturbation is curl-free, it derives from a scalar magnetic potential $\\delta\\\
    Phi$:\n\n$$\n\\delta\\mathbf{B}_\\mathrm{vac} = -\\nabla\\delta\\Phi\n$$\n\nwhere\
    \ $\\nabla^2\\delta\\Phi = 0$ in the vacuum domain, expanded for a single toroidal\
    \ harmonic of mode number $n$ (see [toroidal_mhd_mode_number](name:toroidal_mhd_mode_number)).\
    \ The eigenfunction is obtained by matching the normal component of the perturbation\
    \ at the plasma\u2013vacuum interface, with $|\\delta\\mathbf{B}_\\mathrm{vac}|\
    \ \\to 0$ in the far field.\n\nThe full complex vector is resolved in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame into the [radial](name:radial_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_R$, [poloidal](name:poloidal_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_\\theta$, and [toroidal](name:toroidal_perturbed_vacuum_magnetic_field)\
    \ component $\\delta B_\\phi$. The complex representation encodes both amplitude\
    \ and spatial phase of the mode; the real and imaginary parts of each component\
    \ form two orthogonal phase quadratures, accessible via quantities such as the\
    \ [real part of the toroidal component](name:toroidal_perturbed_vacuum_magnetic_field_real_part).\n\
    \nSign convention: Positive for each cylindrical component when directed along\
    \ $+R$, $+\\phi$, or $+Z$ in the right-handed cylindrical $(R, \\phi, Z)$ frame,\
    \ where $\\phi$ increases counter-clockwise viewed from above $+\\hat{Z}$."
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:vacuum_magnetic_field
  - name:toroidal_mhd_mode_number
  - name:radial_perturbed_vacuum_magnetic_field
  - name:poloidal_perturbed_vacuum_magnetic_field
  - name:toroidal_perturbed_vacuum_magnetic_field
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  arguments:
  - name: vacuum_magnetic_field
    operator: perturbed
    operator_kind: qualifier
  sources:
  - id: derived:perturbed_vacuum_magnetic_field
    status: composed
- name: poloidal_perturbed_vacuum_magnetic_field
  kind: scalar
  status: draft
  description: Complex poloidal component of the first-order magnetic-field perturbation
    eigenfunction in the current-free vacuum region outside the plasma boundary, for
    a single toroidal Fourier mode in linear MHD stability analysis.
  documentation: "The poloidal component of the perturbed vacuum magnetic field is\
    \ the projection of the first-order magnetic-field eigenfunction onto the poloidal\
    \ direction in the current-free exterior region, where $\\nabla \\times \\delta\\\
    mathbf{B} = 0$ and $\\nabla \\cdot \\delta\\mathbf{B} = 0$. In this vacuum region\
    \ the perturbation derives from a Laplace-scalar magnetic potential, and the poloidal\
    \ projection is one of the three components characterizing the full spatial structure\
    \ of the eigenfunction. The complex representation \u2014 its [real part](name:poloidal_perturbed_vacuum_magnetic_field_real_part)\
    \ and [imaginary part](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part)\
    \ together \u2014 encodes amplitude and phase of the mode, arising from the toroidal\
    \ Fourier expansion for a single mode number $n$.\n\nThe poloidal projection is\
    \ defined as:\n\n$$\n\\delta B_\\theta = \\delta\\mathbf{B}_{\\mathrm{vac}} \\\
    cdot \\hat{\\mathbf{e}}_\\theta\n$$\n\nwhere $\\hat{\\mathbf{e}}_\\theta$ is the\
    \ poloidal unit vector and $\\delta\\mathbf{B}_{\\mathrm{vac}}$ is the full complex\
    \ first-order vacuum magnetic-field perturbation described by the parent [perturbed_vacuum_magnetic_field](name:perturbed_vacuum_magnetic_field).\n\
    \nThis component enters the plasma-vacuum interface matching conditions in linear\
    \ stability analysis, coupling the vacuum eigenfunction to the plasma-region solution\
    \ to determine free-boundary MHD stability. It complements the toroidal counterpart\
    \ documented in [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)\
    \ and [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part)\
    \ in characterizing the angular structure of the eigenmode outside the plasma.\
    \ The eigenfunction amplitude is normalization-dependent; only its value relative\
    \ to the plasma-region solution carries physical meaning for stability assessments.\n\
    \nSign convention: Positive when $\\delta B_\\theta$ points in the direction of\
    \ increasing poloidal angle $\\theta$."
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_vacuum_magnetic_field_real_part
  - name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  - name:perturbed_vacuum_magnetic_field
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: perturbed_vacuum_magnetic_field
    operator: component
    operator_kind: projection
    axis: poloidal
    shape: component
- name: poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex poloidal component of the vacuum magnetic-field
    perturbation eigenfunction outside the plasma boundary, for a single toroidal
    Fourier mode in linear MHD stability analysis.
  documentation: 'The poloidal perturbed vacuum magnetic-field imaginary part is the
    imaginary component of the complex poloidal projection of the linearized magnetic-field
    perturbation $\delta\mathbf{B}$ in the current-free region outside the plasma
    boundary, resolving a single toroidal Fourier mode $n$. Together with [poloidal_perturbed_vacuum_magnetic_field_real_part](name:poloidal_perturbed_vacuum_magnetic_field_real_part),
    it fully specifies the complex eigenfunction amplitude along the poloidal direction.


    The complex poloidal vacuum perturbation decomposes as:


    $$

    \delta B_\theta^{(V)} = \mathrm{Re}(\delta B_\theta^{(V)}) + i\,\mathrm{Im}(\delta
    B_\theta^{(V)})

    $$


    where $\delta B_\theta^{(V)}$ is the component of the perturbed vacuum field along
    the poloidal basis vector $\hat{e}_\theta$ in flux coordinates $(\rho, \theta,
    \phi)$, with $\rho$ the flux-surface label and $\phi$ the toroidal angle. In the
    vacuum region, $\delta\mathbf{B}^{(V)}$ satisfies $\nabla \times \delta\mathbf{B}^{(V)}
    = 0$ and $\nabla \cdot \delta\mathbf{B}^{(V)} = 0$.


    This quantity is obtained from linear MHD stability solvers that match plasma-region
    eigenfunctions to vacuum-region solutions at the plasma-vacuum interface. Because
    the overall eigenfunction amplitude and phase are set by the normalization convention
    of the stability calculation, only relative magnitudes and phase relationships
    across components and spatial locations carry physical meaning. The analogous
    plasma-region quantity is [poloidal_perturbed_plasma_magnetic_field_imaginary_part](name:poloidal_perturbed_plasma_magnetic_field_imaginary_part);
    the vacuum imaginary parts for other projections are [radial_perturbed_vacuum_magnetic_field_imaginary_part](name:radial_perturbed_vacuum_magnetic_field_imaginary_part)
    and [toroidal_perturbed_vacuum_magnetic_field_imaginary_part](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part).


    Sign convention: Positive when $\mathrm{Im}(\delta B_\theta^{(V)})$ points in
    the direction of increasing poloidal angle $\theta$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_vacuum_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_imaginary_part
  - name:radial_perturbed_vacuum_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: poloidal_perturbed_vacuum_magnetic_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/imaginary
    status: composed
- name: poloidal_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex poloidal component of the vacuum magnetic-field
    perturbation eigenfunction for a specified toroidal Fourier mode in linear MHD
    stability analysis.
  documentation: 'The real part of the complex poloidal vacuum magnetic-field perturbation
    eigenfunction, $\mathrm{Re}(\delta B_\theta)$, is the in-phase component of $\delta\mathbf{B}$
    projected along the poloidal direction in the current-free vacuum region exterior
    to the plasma boundary, for a specified toroidal mode number $n$. Together with
    its companion [poloidal_perturbed_vacuum_magnetic_field_imaginary_part](name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part),
    it fully specifies the complex-valued [poloidal_perturbed_vacuum_magnetic_field](name:poloidal_perturbed_vacuum_magnetic_field)
    via $\delta B_\theta = \mathrm{Re}(\delta B_\theta) + i\,\mathrm{Im}(\delta B_\theta)$.


    In the vacuum region, the perturbed field satisfies $\nabla \times \delta\mathbf{B}
    = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The poloidal component in flux coordinates
    $(\rho, \theta, \phi)$ is:


    $$

    \delta B_\theta = \delta\mathbf{B} \cdot \hat{e}_\theta

    $$


    where $\hat{e}_\theta$ is the covariant basis vector tangent to increasing poloidal
    angle $\theta$, and the toroidal dependence is carried by the Fourier factor $e^{in\phi}$.


    The vacuum eigenfunction is obtained from linear MHD stability codes that solve
    the interior plasma equations and match solutions at the plasma boundary by enforcing
    continuity of the normal field component. The decomposition into real and imaginary
    parts is phase-convention dependent; absolute magnitudes carry physical meaning
    only relative to other components within the same normalized eigenfunction. The
    sibling quantities [radial_perturbed_vacuum_magnetic_field_real_part](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and [toroidal_perturbed_vacuum_magnetic_field_real_part](name:toroidal_perturbed_vacuum_magnetic_field_real_part)
    provide the other real-part projections in the vacuum, while [poloidal_perturbed_plasma_magnetic_field_real_part](name:poloidal_perturbed_plasma_magnetic_field_real_part)
    is the analogous quantity inside the plasma.


    Sign convention: Positive when $\mathrm{Re}(\delta B_\theta)$ points in the direction
    of increasing poloidal angle $\theta$.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:poloidal_perturbed_vacuum_magnetic_field_imaginary_part
  - name:poloidal_perturbed_vacuum_magnetic_field
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:toroidal_perturbed_vacuum_magnetic_field_real_part
  - name:poloidal_perturbed_plasma_magnetic_field_real_part
  arguments:
  - name: poloidal_perturbed_vacuum_magnetic_field
    operator: real_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/real
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate2/real
    status: composed
- name: radial_perturbed_vacuum_magnetic_field
  kind: scalar
  status: draft
  description: Radial R component of the complex first-order vacuum magnetic-field
    perturbation eigenfunction in the current-free region outside the plasma, for
    a specified toroidal Fourier harmonic. The component is defined in the right-handed
    cylindrical (R, phi, Z) frame.
  documentation: 'The radial perturbed vacuum magnetic field is the $R$ component
    of the first-order magnetic-field perturbation eigenfunction in the current-free
    vacuum region outside the plasma boundary. It describes the part of the external
    perturbation pointing along increasing major radius in the right-handed cylindrical
    $(R, \phi, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal angle, and
    $Z$ is vertical height. For a toroidal harmonic, the physical perturbation is
    obtained from the real part of a complex eigenfunction with the chosen toroidal
    phase dependence.


    The component is defined by projection onto the radial basis vector:


    $$

    \delta B_R^{\mathrm{vac}} = \hat{R} \cdot \delta \mathbf{B}^{\mathrm{vac}}

    $$


    where $\delta \mathbf{B}^{\mathrm{vac}}$ is the vacuum magnetic-field perturbation
    eigenfunction in tesla, $\hat{R}$ is the unit vector in the direction of increasing
    $R$, and $\delta B_R^{\mathrm{vac}}$ is measured in tesla. In a current-free vacuum,
    $\delta \mathbf{B}^{\mathrm{vac}}$ satisfies $\nabla \times \delta \mathbf{B}^{\mathrm{vac}}
    = 0$ and $\nabla \cdot \delta \mathbf{B}^{\mathrm{vac}} = 0$, so it may be represented
    through a scalar magnetic potential satisfying Laplace''s equation.


    This quantity is usually computed as part of a linear MHD eigenvalue or response
    calculation by solving the external vacuum field problem, often using harmonic
    expansions or Green-function methods together with conducting-wall or open-boundary
    conditions. The boundary condition at the plasma-vacuum interface involves continuity
    of the normal magnetic perturbation, $\mathbf{n} \cdot \delta \mathbf{B}$; $\delta
    B_R^{\mathrm{vac}}$ contributes to that normal projection according to the local
    boundary geometry but is not itself generally the boundary-normal component.


    No intrinsic typical magnitude exists for this eigenfunction component, because
    linear MHD eigenfunctions have arbitrary overall normalization and phase. Reported
    values depend on the chosen normalization, such as a specified boundary displacement,
    a maximum perturbed field amplitude, or an imposed external perturbation; for
    a fixed normalization they may span many orders of magnitude in tesla.


    Sign convention: Positive when the vacuum magnetic-field perturbation points in
    the $+\hat{R}$ direction, toward increasing major radius $R$, in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:perturbed_vacuum_magnetic_field
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:radial_perturbed_vacuum_magnetic_field_imaginary_part
  - name:radial_perturbed_plasma_magnetic_field_real_part
  arguments:
  - name: perturbed_vacuum_magnetic_field
    operator: component
    operator_kind: projection
    axis: radial
    shape: component
- name: radial_perturbed_vacuum_magnetic_field_imaginary_part
  kind: complex
  status: draft
  description: Imaginary part of the complex radial component of the linearized magnetic-field
    perturbation eigenfunction in the current-free vacuum region outside the plasma,
    for a specified toroidal Fourier mode in linear MHD stability analysis.
  documentation: 'The imaginary part of the complex radial vacuum magnetic-field perturbation,
    $\delta B_R^{\rm im}$, is the quadrature component of the first-order linearized
    magnetic-field perturbation projected along $+\hat{R}$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame, in the current-free vacuum region surrounding the plasma.
    In linear MHD stability analysis, perturbed fields are cast as complex Fourier
    harmonics in the toroidal angle $\phi$; the imaginary part encodes the phase of
    the eigenmode relative to the normalization reference, together with the [real
    part](name:radial_perturbed_vacuum_magnetic_field_real_part).


    In the vacuum region, $\delta\mathbf{B}$ satisfies $\nabla \times \delta\mathbf{B}
    = 0$ and $\nabla \cdot \delta\mathbf{B} = 0$. The complex radial component decomposes
    as:


    $$

    \delta\tilde{B}_R^{\rm vac} = \delta B_R^{\rm re} + i\,\delta B_R^{\rm im}

    $$


    where $\delta B_R^{\rm re}$ is the [real part](name:radial_perturbed_vacuum_magnetic_field_real_part)
    and $\delta B_R^{\rm im}$ is this imaginary part. The perturbation amplitude is
    $|\delta\tilde{B}_R^{\rm vac}| = \sqrt{(\delta B_R^{\rm re})^2 + (\delta B_R^{\rm
    im})^2}$ and the phase is $\theta = \mathrm{atan2}(\delta B_R^{\rm im},\,\delta
    B_R^{\rm re})$.


    This quantity is computed by linear MHD stability codes for a specified toroidal
    mode number $n$. Matching conditions at the plasma-vacuum interface link it to
    its plasma-region counterpart, [the radial plasma imaginary part](name:radial_perturbed_plasma_magnetic_field_imaginary_part).
    Alongside [the toroidal vacuum imaginary component](name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part),
    it characterizes the helical spatial structure of the perturbed vacuum field.
    As with all linear eigenfunctions, the partition between real and imaginary parts
    depends on the phase normalization convention applied to the eigenmode.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_vacuum_magnetic_field_real_part
  - name:radial_perturbed_plasma_magnetic_field_imaginary_part
  - name:toroidal_perturbed_vacuum_magnetic_field_imaginary_part
  arguments:
  - name: radial_perturbed_vacuum_magnetic_field
    operator: imaginary_part
    operator_kind: unary_postfix
  sources:
  - id: dd:mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    dd_path: mhd_linear/time_slice/toroidal_mode/vacuum/b_field_perturbed/coordinate1/imaginary
    status: composed
- name: radial_perturbed_vacuum_magnetic_field_real_part
  kind: complex
  status: draft
  description: Real part of the complex flux-surface-normal component of the linearized
    magnetic-field perturbation eigenfunction in the current-free vacuum region outside
    the plasma, for a specified toroidal Fourier harmonic in linear-MHD stability
    analysis.
  documentation: 'This quantity is the real coefficient of the radial vacuum magnetic-field
    perturbation eigenfunction for one toroidal harmonic. Here radial means the projection
    of the complex perturbation field onto the outward normal to the unperturbed magnetic
    flux surfaces, rather than the major-radius direction of the right-handed cylindrical
    $(R, \phi, Z)$ frame.


    A common Fourier and complex-amplitude convention is


    $$

    \delta \mathbf{B}^{\rm vac}(\mathbf{x},\phi,t) = \operatorname{Re}\left\{\delta\tilde{\mathbf{B}}^{\rm
    vac}_n(\mathbf{x})\,e^{i(n\phi-\omega t)}\right\}, \qquad \delta\tilde B^{\rm
    vac}_{n,r} = \delta\tilde{\mathbf{B}}^{\rm vac}_n \cdot \hat{\mathbf n}_\psi =
    \delta B^{\rm vac,Re}_{n,r} + i\,\delta B^{\rm vac,Im}_{n,r}

    $$


    where $\delta\tilde{\mathbf{B}}^{\rm vac}_n$ is the complex magnetic-field eigenfunction
    for toroidal mode number $n$, $\phi$ is the toroidal angle in the right-handed
    cylindrical $(R, \phi, Z)$ frame, $\omega$ is the mode angular frequency, $\hat{\mathbf
    n}_\psi$ is the outward flux-surface normal, and $\delta B^{\rm vac,Re}_{n,r}$
    is this real part. Both the complex radial amplitude and its real and imaginary
    parts have unit T.


    In the vacuum region the perturbed current density is zero, so the magnetic perturbation
    satisfies $\nabla\times\delta\tilde{\mathbf{B}}^{\rm vac}_n=0$ and $\nabla\cdot\delta\tilde{\mathbf{B}}^{\rm
    vac}_n=0$, subject to matching conditions at the plasma boundary and electromagnetic
    boundary conditions at conducting structures. It is typically computed as part
    of a linear-MHD stability calculation and may be compared with magnetic measurements
    outside the plasma after an overall eigenfunction normalization is chosen.


    Because linear eigenfunctions can be scaled arbitrarily, the numerical magnitude
    depends on the chosen normalization. When scaled to experimentally observed edge
    or external magnetic perturbations, representative radial vacuum-field amplitudes
    are often about $10^{-6}$-$10^{-3}$ T, with larger values possible for deliberately
    driven perturbations or rapidly growing modes.


    Sign convention: Positive when the radial projection of the complex vacuum perturbation
    onto the outward flux-surface normal has a positive real coefficient in the Fourier
    convention $e^{i(n\phi-\omega t)}$, with $\phi$ increasing in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: T
  physics_domain: magnetohydrodynamics
  links:
  - name:radial_perturbed_vacuum_magnetic_field_imaginary_part
  - name:radial_perturbed_vacuum_magnetic_field
  - name:radial_perturbed_plasma_magnetic_field_real_part
