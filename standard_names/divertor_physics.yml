- name: neutral_power_of_divertor
  kind: scalar
  status: active
  description: Neutral power of divertor is the total rate of neutral-particle energy
    deposited on wetted plasma-facing surfaces throughout the divertor assembly.
  documentation: 'Neutral power of divertor is the total rate of neutral-particle
    energy deposited on the wetted plasma-facing surfaces of the divertor assembly.
    It sums neutral-particle deposition over all included divertor targets and other
    divertor plasma-facing components.


    The defining surface integral is


    $$

    P_{\mathrm{neu,div}} = \int_{S_{\mathrm{div}}} q_{\mathrm{neu}}\,\mathrm{d}A

    $$


    where $S_{\mathrm{div}}$ is the union of the included wetted divertor surfaces,
    $q_{\mathrm{neu}}$ is the neutral-particle deposited energy-flux density on those
    surfaces, and $\mathrm{d}A$ is the surface-area element. The neutral contribution
    includes charge-exchange neutrals and other neutral-particle impact channels.


    This quantity is the neutral-channel component of [power_of_divertor](name:power_of_divertor).
    Unlike [neutral_power_at_divertor_target](name:neutral_power_at_divertor_target),
    it aggregates deposition over the divertor assembly rather than one target. Energy
    carried by neutral particles that does not reach an included divertor surface,
    and deposition from charged-particle, radiative, or other non-neutral channels,
    is excluded.'
  unit: W
  physics_domain: divertor_physics
