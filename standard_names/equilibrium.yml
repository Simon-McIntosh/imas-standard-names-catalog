- name: upper_inner_squareness_of_plasma_boundary
  kind: scalar
  status: active
  description: "Upper-inner squareness of the plasma boundary is the dimensionless\
    \ Luce shape coefficient measuring the upper high-field-side corner\u2019s signed\
    \ departure from a reference ellipse."
  documentation: 'The upper-inner squareness of the plasma boundary is the dimensionless
    Luce shape coefficient quantifying the departure of the upper inboard corner of
    the last closed flux surface from a reference ellipse. It is the upper-quadrant
    component of the [inner squareness of the plasma boundary](name:inner_squareness_of_plasma_boundary),
    paired with the [lower-inner squareness of the plasma boundary](name:lower_inner_squareness_of_plasma_boundary).


    In a poloidal cross-section at fixed toroidal angle $\phi$ of the right-handed
    cylindrical $(R, \phi, Z)$ frame, the coefficient is


    $$

    \zeta_{\mathrm{UI}} = \frac{\overline{OD} - \overline{OE}}{\overline{OF} - \overline{OE}}

    $$


    where $O$ is the reference-ellipse center, $D$ is the upper-inner boundary intersection
    along the corner diagonal, $E$ is the corresponding ellipse intersection, and
    $F$ is the corner of the circumscribing rectangle. The reference ellipse is determined
    by the boundary size and shaping parameters.


    Sign convention: Positive when the upper-inner boundary corner lies outward from
    the reference ellipse toward the corresponding corner of the circumscribing rectangle.'
  unit: '1'
  physics_domain: equilibrium
  links:
  - name:inner_squareness_of_plasma_boundary
  - name:lower_inner_squareness_of_plasma_boundary
  arguments:
  - name: inner_squareness_of_plasma_boundary
    operator: upper
    operator_kind: qualifier
  sources:
  - dd_path: equilibrium/time_slice/boundary/squareness_upper_inner
