- name: boron_density
  kind: scalar
  status: active
  description: Elemental boron number density, summed over neutral atoms and all ionic
    charge states through fully stripped B5+.
  documentation: 'Boron density is the elemental boron particle density, with neutral
    boron and every ionic charge state included in one additive quantity.


    $$

    n_B = \sum_{Z=0}^{5} n_{B,Z}

    $$


    where $n_B$ is the elemental boron density, $Z$ is the boron ionic charge state
    with $Z=0$ denoting neutral boron, and $n_{B,Z}$ is the density of boron in state
    $Z$.


    The quantity is the underlying boron density field; [line-averaged boron density](name:line_averaged_boron_density)
    and [volume-averaged boron density](name:volume_averaged_boron_density) are distinct
    averages of it. It excludes no boron charge state but is not a charge-state-specific
    or charge-weighted density.


    Sign convention: Positive when the local elemental-boron population contributes
    additively to the particle density.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:line_averaged_boron_density
  - name:volume_averaged_boron_density
- name: carbon_density
  kind: scalar
  status: active
  description: Carbon density is the local number density of elemental carbon in the
    plasma, summed over neutral carbon atoms and all ionic charge states through fully
    stripped C6+.
  documentation: 'Carbon density is the local number density of elemental carbon in
    the plasma, summed over neutral carbon atoms and all ionic charge states through
    fully stripped $C^{6+}$. It represents the elemental carbon population per physical
    volume, independent of ionization balance.


    The charge-state aggregation is defined by the number-density sum:


    $$

    n_C = \sum_{z=0}^{6} n_{C^{z+}}

    $$


    where $n_C$ is the carbon density, $z=0$ denotes neutral carbon, $z=1,\ldots,6$
    denote ionic charge states, and $n_{C^{z+}}$ is the number density of carbon in
    charge state $z$.


    This quantity is unweighted by charge, mass, or radiation emissivity and is distinct
    from electron density, charge density, and individual charge-state densities.
    Spatially averaged or locus-specific carbon-density quantities include [volume_averaged_carbon_density](name:volume_averaged_carbon_density),
    [flux_surface_averaged_carbon_density_at_plasma_boundary](name:flux_surface_averaged_carbon_density_at_plasma_boundary),
    and the ion-only divertor-target quantity [carbon_density_at_divertor_target](name:carbon_density_at_divertor_target).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:line_averaged_carbon_density
  - name:volume_averaged_carbon_density
- name: charge_at_pedestal_top
  kind: scalar
  status: active
  description: Charge at the pedestal top is a generic ionic charge-state metric for
    the plasma at the core-side shoulder of the H-mode edge pedestal. The specific
    child quantity defines which species, charge states, and weighting are included.
  documentation: 'Charge at the pedestal top is an ionic charge-state metric evaluated
    at the pedestal top, the core-side shoulder of the steep-gradient H-mode edge
    transport barrier. It characterizes the local ion mixture or selected ion population
    according to the aggregation convention specified by the more specific quantity.


    This parent quantity defines the pedestal-top locus and the general ionic-charge
    concept only. It does not prescribe charge-squared weighting, species inclusion,
    charge-state aggregation, or normalization; those distinctions belong to child
    quantities such as [effective charge at the pedestal top](name:effective_charge_at_pedestal_top).
    It is distinct from electric charge density, net charge balance, and analogous
    charge metrics at other plasma loci.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_pedestal_top
  - name:charge_at_plasma_boundary
  - name:charge_at_internal_transport_barrier
- name: charge_at_plasma_boundary
  kind: scalar
  status: active
  description: Charge at the plasma boundary is a generic charge measure for the ion
    mixture evaluated at the plasma boundary. Specific child quantities define the
    charge moment, normalization, and species aggregation used.
  documentation: 'Charge at the plasma boundary is a generic charge measure for the
    plasma composition evaluated at the plasma boundary. It identifies the boundary
    locus of the charge-related quantity without prescribing a particular charge moment
    or normalization.


    Concrete specializations define the mathematical charge weighting and population
    scope. For example, [effective charge at the plasma boundary](name:effective_charge_at_plasma_boundary)
    uses a charge-squared ionic density moment normalized to electron density; other
    charge measures need not share that weighting or its bounds.


    This parent quantity must not be interpreted as a specific effective-charge definition,
    a signed electric charge density, or a net boundary charge. It is an abstraction
    over charge-type scalar quantities at the plasma boundary; the defining equation
    belongs to each child quantity.'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:effective_charge_at_plasma_boundary
  - name:effective_charge_at_internal_transport_barrier
- name: collisionality_at_pedestal_top
  kind: scalar
  status: active
  description: "Dimensionless comparison of a plasma population\u2019s collision frequency\
    \ with its characteristic bounce, transit, or streaming frequency."
  documentation: 'Collisionality measures whether a plasma population undergoes many
    or few collisions during a characteristic orbital or streaming timescale. It provides
    a dimensionless indicator of the collisional transport regime.


    The generalized collisionality is defined by


    $$

    \nu_* = \frac{\nu_{\mathrm{coll}}}{\omega_{\mathrm{char}}}

    $$


    where $\nu_{\mathrm{coll}}$ is the relevant collision frequency and $\omega_{\mathrm{char}}$
    is the characteristic bounce, transit, or streaming frequency, both expressed
    as inverse times. A value larger than unity indicates frequent collisions during
    the characteristic motion, while a value smaller than unity indicates weak collisionality.
    Specific realizations may select a particle species and location, such as [electron
    collisionality](name:electron_collisionality) or [electron collisionality at the
    pedestal top](name:electron_collisionality_at_pedestal_top); normalized variants
    may use a trapped-particle bounce frequency, as in [normalized electron collisionality
    at the pedestal top](name:normalized_electron_collisionality_at_pedestal_top).'
  unit: '1'
  physics_domain: edge_plasma_physics
  links:
  - name:electron_collisionality
  - name:electron_collisionality_at_pedestal_top
  - name:normalized_electron_collisionality_at_pedestal_top
- name: decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Characteristic outward distance over which a decaying plasma quantity
    decreases by one e-folding in the scrape-off layer.
  documentation: 'This quantity is the e-folding distance for a plasma quantity that
    decreases outward from the confined plasma into the open-field-line scrape-off
    layer. The operand may be a particle density, temperature, or heat-flux magnitude.


    $$

    L_f = \left|\frac{d\ln f}{dx}\right|^{-1}

    $$


    where $L_f$ is the e-folding length, $f$ is the positive scalar quantity or magnitude
    being characterized, and $x$ is outward distance from the confined plasma in the
    direction normal to magnetic flux surfaces. The scale is defined locally where
    the logarithmic gradient is nonzero.


    The general quantity includes the electron number-density specialization [electron
    decay length](name:electron_decay_length_over_scrape_off_layer), the ion number-density
    specialization [ion decay length](name:ion_decay_length_over_scrape_off_layer),
    and the heat-flux specialization [heat decay length](name:heat_decay_length_over_scrape_off_layer).
    It does not select a species, transport channel, or particular decaying quantity.


    Sign convention: Positive when the reference direction is outward from the confined
    plasma into the scrape-off layer and the associated quantity decreases along it.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_decay_length_over_scrape_off_layer
  - name:ion_decay_length_over_scrape_off_layer
  - name:heat_decay_length_over_scrape_off_layer
  sources:
  - dd_path: summary/scrape_off_layer/n_e_decay_length/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-scrape_off_layer-n_e_decay_length-value
    dd_documentation:
      leaf: Value
      parent_path: summary/scrape_off_layer/n_e_decay_length
      parent: Electron density radial decay length inv(grad ne/ne)
      data_type: FLT_1D
      unit: m
      coordinates:
      - summary/time
    enhanced_context:
      description: "Radial e-folding decay length of the electron density (\u03BB\
        ne) in the scrape-off layer (SOL), defined as the inverse of the logarithmic\
        \ gradient of ne. Characterizes the width of the particle transport channel\
        \ in the SOL."
      kind: template
- name: density_at_launching_position
  kind: scalar
  status: active
  description: Number density of a designated plasma species evaluated at the wave
    launcher aperture or waveguide mouth, where externally injected electromagnetic
    waves first encounter the edge plasma.
  documentation: 'Number density at the launching position is the particle count per
    unit volume of a designated plasma species at the geometric location of a wave
    launcher aperture or waveguide mouth.


    The launching position identifies the spatial point where an injected wave first
    contacts the plasma boundary or the adjacent edge region; the local density at
    this locus sets the plasma frequency and governs accessibility of the injected
    wave to the plasma interior. The launching-position locus is distinct from the
    broader [density_at_plasma_boundary](name:density_at_plasma_boundary) concept,
    which is defined over the entire last closed flux surface rather than a specific
    aperture geometry.


    The species-specific realization [electron_density_at_launching_position](name:electron_density_at_launching_position)
    gives the electron number density at this locus.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_plasma_boundary
  - name:electron_density_at_launching_position
- name: density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of a specified plasma particle population evaluated
    at the core-side shoulder of the H-mode edge transport barrier.
  documentation: 'This quantity is the local number density of a specified plasma
    particle population at the H-mode pedestal top, the core-side shoulder of the
    edge transport barrier. It provides the shared density concept for [electron density
    at the pedestal top](name:electron_density_at_pedestal_top), [ion density at the
    pedestal top](name:ion_density_at_pedestal_top), and species-specific impurity
    densities such as [carbon density at the pedestal top](name:carbon_density_at_pedestal_top).


    The number density is defined by


    $$

    n_s(r_p) = \frac{dN_s}{dV}

    $$


    where $n_s$ is the number density of population $s$, $N_s$ is the number of particles
    belonging to that population, $V$ is physical volume, and $r_p$ identifies the
    pedestal-top location.


    The population and aggregation scope are supplied by the specific subject. Elemental
    and fuel-ion densities include the ionic charge states belonging to the named
    population unless a charge-state-resolved quantity is specified; electron density
    counts electrons directly. Neutral-particle inclusion is likewise population-dependent
    and is not implied by this unspecific parent name.


    Sign convention: Positive when the specified population contributes particles
    to the local number count.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_pedestal_top
  - name:ion_density_at_pedestal_top
  - name:carbon_density_at_pedestal_top
- name: argon_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of argon impurity ions evaluated at the H-mode pedestal
    top, summed over all ionization states from singly ionized Ar+ through fully stripped
    Ar18+.
  documentation: 'Argon density at the pedestal top is the local number density of
    argon impurity ions at the shoulder of the H-mode edge transport barrier, summed
    over all ionization states from singly ionized Ar+ through fully stripped Ar18+.
    The pedestal top is the common evaluation locus for the [density_at_pedestal_top](name:density_at_pedestal_top)
    family.


    The pedestal-top value is the local charge-state-summed argon ion density evaluated
    at the pedestal-top flux surface:


    $$

    n_{\mathrm{Ar,ped}} = \left.\sum_{q=1}^{18}\frac{dN_{\mathrm{Ar}^{q+}}}{dV}\right|_{\rho=\rho_{\mathrm{ped}}}

    $$


    where $n_{\mathrm{Ar,ped}}$ is the argon ion number density, $q$ is the argon
    ionic charge state, $dN_{\mathrm{Ar}^{q+}}$ is the number of ions in charge state
    $q$, $dV$ is a physical volume element, $\rho$ is the radial flux-surface label
    in flux coordinates $(\rho,\theta,\phi)$, $\theta$ and $\phi$ are the poloidal
    and toroidal angular coordinates, and $\rho_{\mathrm{ped}}$ identifies the pedestal-top
    surface.


    This quantity excludes neutral argon and is an impurity-specific contribution
    to [ion density at the pedestal top](name:ion_density_at_pedestal_top); it is
    distinct from the corresponding [krypton density at the pedestal top](name:krypton_density_at_pedestal_top).'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:ion_density_at_pedestal_top
  - name:krypton_density_at_pedestal_top
  arguments:
  - name: density_at_pedestal_top
    operator: argon
    operator_kind: qualifier
- name: beryllium_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of beryllium impurity ions evaluated at the H-mode pedestal
    top, summed over all ionization states unless a specific charge state is specified.
  documentation: 'Beryllium density at the pedestal top is the local number density
    of beryllium impurity ions at the shoulder of the H-mode edge transport barrier,
    summed over all charge states from singly ionized Be$^+$ through fully stripped
    Be$^{4+}$ unless a specific ionization stage is identified separately. This quantity
    is the beryllium-specific member of the [density_at_pedestal_top](name:density_at_pedestal_top)
    family, which spans all plasma species evaluated at this locus.


    The species-summed number density is defined as:


    $$

    n_\mathrm{Be} = \sum_{j=1}^{4} n_{\mathrm{Be}^{j+}}

    $$


    where $j$ indexes the ionization stage from singly ionized ($j=1$) to fully stripped
    ($j=4$, atomic number $Z=4$).


    The pedestal top marks the core-side end of the steep H-mode edge-transport barrier,
    where the edge density and temperature gradients transition toward the flatter
    confined-region profiles. Beryllium is a light impurity that enters the plasma
    via sputtering and recycling from beryllium plasma-facing components; its concentration
    at the pedestal top influences hydrogenic fuel dilution and edge radiated power.


    Beryllium density at the pedestal can be inferred from charge-exchange recombination
    spectroscopy or from passive UV/VUV spectroscopy of beryllium emission lines.
    The complementary locus-resolved quantities [beryllium_density_at_plasma_boundary](name:flux_surface_averaged_beryllium_density_at_plasma_boundary)
    and [beryllium_density_at_magnetic_axis](name:beryllium_density_at_magnetic_axis)
    bracket this pedestal-top value radially, while [beryllium_density](name:beryllium_density)
    describes the full spatial profile.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:flux_surface_averaged_beryllium_density_at_plasma_boundary
  - name:beryllium_density_at_magnetic_axis
  - name:beryllium_density
  arguments:
  - name: density_at_pedestal_top
    operator: beryllium
    operator_kind: qualifier
- name: boron_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of boron impurity ions at the pedestal top is the particle
    count per volume at the core-side shoulder of the H-mode edge transport barrier,
    summed over charge states from singly ionized B+ through fully stripped B5+ unless
    a specific charge state is named.
  documentation: 'Number density of boron impurity ions at the pedestal top is the
    local particle count per volume of boron ions at the core-side shoulder of an
    H-mode pedestal. The pedestal top is the transition where the steep-gradient edge
    transport barrier meets the flatter confined-core density variation, distinct
    from a separatrix or plasma-boundary value. For bare boron, the density is summed
    over all ionization charge states from singly ionized $\mathrm{B}^{+}$ through
    fully stripped $\mathrm{B}^{5+}$ unless a specific charge state is explicitly
    named; neutral boron atoms are excluded.


    For the boron ion population on the pedestal-top flux surface, the defining local
    density is


    $$

    n_{\mathrm{B}}(\xi_{\mathrm{ped,top}}) = \sum_{q=1}^{5} n_{\mathrm{B}^{q+}}(\xi_{\mathrm{ped,top}})
    = \left.\sum_{q=1}^{5}\frac{dN_{\mathrm{B}^{q+}}}{dV}\right|_{\xi=\xi_{\mathrm{ped,top}}}

    $$


    where $n_{\mathrm{B}}$ is the charge-state-summed boron ion number density, $q$
    is the positive integer ion charge state, $n_{\mathrm{B}^{q+}}$ is the number
    density of boron ions in charge state $q+$, $N_{\mathrm{B}^{q+}}$ is the particle
    count of that charge state, $V$ is physical volume, and $\xi_{\mathrm{ped,top}}$
    is the explicitly chosen radial label of the pedestal-top flux surface, for example
    normalized toroidal flux radius $\rho_\mathrm{tor,norm}$ or normalized poloidal
    flux $\psi_N$.


    This quantity is species-resolved and charge-state aggregated for ionized boron
    only. It is distinct from total ion density, electron density, a charge-state-resolved
    boron density, and any neutral-boron population density at the same pedestal-top
    locus.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:boron_density
  arguments:
  - name: density_at_pedestal_top
    operator: boron
    operator_kind: qualifier
  sources:
  - dd_path: summary/local/pedestal/n_i/boron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-pedestal-n_i-boron-value
    dd_documentation:
      leaf: Value
      parent_path: summary/local/pedestal/n_i/boron
      parent: Boron (B)
      data_type: FLT_1D
      unit: m^-3
      coordinates:
      - summary/time
    enhanced_context:
      description: Boron (B).
      kind: template
- name: carbon_density_at_pedestal_top
  kind: scalar
  status: active
  description: Number density of carbon impurity ions at the H-mode pedestal top is
    the particle count per volume at the core-side shoulder of the H-mode edge transport
    barrier, summed over C+ through fully stripped C6+.
  documentation: 'Number density of carbon impurity ions at the H-mode pedestal top
    is the local particle count per volume of carbon ions evaluated on the flux surface
    marking the core-side shoulder of the edge transport barrier. It is the carbon-specific
    member of [density_at_pedestal_top](name:density_at_pedestal_top) and is distinct
    from the electron population represented by [electron_density_at_pedestal_top](name:electron_density_at_pedestal_top).


    For the carbon-ion population, the defining local density is


    $$

    n_{\mathrm{C}} = \left.\sum_{q=1}^{6} \frac{dN_{\mathrm{C}^{q+}}}{dV}\right|_{\xi=\xi_{\mathrm{ped,top}}}

    $$


    where $n_{\mathrm{C}}$ is carbon-ion number density in m$^{-3}$, $N_{\mathrm{C}^{q+}}$
    is the dimensionless count of carbon ions in charge state $q$, $V$ is physical
    volume in m$^{3}$, and $\xi_{\mathrm{ped,top}}$ is the dimensionless radial label
    of the pedestal-top flux surface, expressed using an explicitly named coordinate
    such as normalized poloidal flux.


    The sum includes carbon ions from singly ionized C+ through fully stripped C6+
    and excludes neutral carbon. The locus is the confined-plasma pedestal top, not
    the separatrix, plasma boundary, or scrape-off layer; [carbon_density](name:carbon_density)
    denotes the corresponding elemental density without this pedestal-top localization.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:density_at_pedestal_top
  - name:electron_density_at_pedestal_top
  - name:carbon_density
  arguments:
  - name: density_at_pedestal_top
    operator: carbon
    operator_kind: qualifier
- name: density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of a specified plasma particle population at the plasma
    boundary, evaluated as the local, intensive particle count per physical volume
    on the last closed magnetic flux surface.
  documentation: 'Number density of a specified plasma particle population at the
    plasma boundary is the local, intensive particle count per physical volume for
    that population evaluated on the last closed magnetic flux surface. The plasma
    boundary is the limiting closed magnetic flux surface separating the confined
    plasma from the scrape-off-layer region. The specified population may be electrons,
    ions, neutral particles, or an impurity species.


    The local number density is the zeroth velocity moment of the distribution function
    at a boundary point:


    $$

    n_s(\mathbf{x}_b,t) = \int f_s(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_s$ is the number density of population $s$, $\mathbf{x}_b$ is a point
    on the last closed magnetic flux surface, $t$ is time, $\mathbf{v}$ is particle
    velocity, $f_s$ is the phase-space distribution function for population $s$, and
    $d^3v$ is the velocity-space volume element.


    When the specified population is a chemical or isotope species without an explicit
    charge state, the boundary density is summed over all charge states of that species;
    a charge-state-resolved population denotes only particles in the stated ionization
    state. Species-qualified boundary-density names such as [electron_density_at_plasma_boundary](name:electron_density_at_plasma_boundary),
    [ion_density_at_plasma_boundary](name:ion_density_at_plasma_boundary), and krypton_density_at_plasma_boundary
    are population-specific instances of this quantity.


    This quantity denotes a local value at the boundary, not an average over the boundary
    surface or over a volume. Averaged counterparts include [flux_surface_averaged_electron_density_at_plasma_boundary](name:flux_surface_averaged_electron_density_at_plasma_boundary)
    for a flux-surface average at the same boundary and [volume_averaged_neutral_species_density](name:volume_averaged_neutral_species_density)
    for a volume average; densities evaluated at other loci, such as density_at_pedestal
    and [density_at_magnetic_axis](name:density_at_magnetic_axis), are distinct.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links:
  - name:electron_density_at_plasma_boundary
  - name:ion_density_at_plasma_boundary
  - name:flux_surface_averaged_electron_density_at_plasma_boundary
  - name:volume_averaged_neutral_species_density
  - name:density_at_magnetic_axis
- name: boron_density_at_plasma_boundary
  kind: scalar
  status: active
  description: Number density of boron at the plasma boundary, evaluated as the local,
    intensive particle count per physical volume on the last closed magnetic flux
    surface, summed over neutral atoms and all ionization states.
  documentation: 'Number density of boron at the plasma boundary is the local, intensive
    particle count per physical volume for elemental boron evaluated on the last closed
    magnetic flux surface. The plasma boundary is the limiting closed magnetic flux
    surface separating confined plasma from the open-field-line scrape-off-layer region.


    The local elemental-boron number density at a boundary point is the zeroth velocity
    moment summed over neutral boron and all ionic charge states:


    $$

    n_{\mathrm B}(\mathbf{x}_b,t) = \sum_{z=0}^{5} \int f_{\mathrm B,z}(\mathbf{x}_b,\mathbf{v},t)\,d^3v

    $$


    where $n_{\mathrm B}$ is the elemental-boron number density, $\mathrm B$ denotes
    boron, $\mathbf{x}_b$ is a point on the last closed magnetic flux surface, $t$
    is time, $z$ is the boron charge-state index with $z=0$ denoting neutral boron
    and $z=1$ through $5$ denoting the ionic states, $f_{\mathrm B,z}$ is the phase-space
    distribution function for that state, $\mathbf{v}$ is particle velocity, and $d^3v$
    is the velocity-space volume element.


    This quantity applies specifically to elemental boron and includes neutral atoms
    together with all ionic charge states through fully stripped B5+. It is a local
    value at the plasma boundary, with no averaging over the boundary surface or over
    a volume, and excludes densities of other elements and electrons. Unlike [ion_density_at_plasma_boundary](name:ion_density_at_plasma_boundary),
    it is not restricted to charged ions.


    It is the boron-specific instance of [density_at_plasma_boundary](name:density_at_plasma_boundary).
    The related [flux_surface_averaged_boron_density_at_plasma_boundary](name:flux_surface_averaged_boron_density_at_plasma_boundary)
    applies the same neutral-plus-ionic boron aggregation but averages the density
    over the last closed magnetic flux surface rather than giving the local boundary
    value.'
  unit: m^-3
  physics_domain: edge_plasma_physics
  links: []
  sources:
  - dd_path: summary/local/separatrix/n_i/boron/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-local-separatrix-n_i-boron-value
    dd_documentation:
      leaf: Value
