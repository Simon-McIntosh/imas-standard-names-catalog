- name: current_of_correction_coil
  kind: scalar
  status: active
  description: Signed conventional current circulating through a non-axisymmetric
    correction-coil winding and determining its electromagnetic excitation.
  documentation: 'Correction-coil current is the signed rate of charge transport through
    the winding circuit. It represents the net circuit current driving the magnetic
    field generated by the correction coil, rather than the local current density
    within its conductor.


    The current is defined by


    $$

    I = \frac{dQ}{dt}

    $$


    where $I$ is conventional current, $Q$ is transported electric charge in coulombs,
    and $t$ is time in seconds. Its electrical behavior is related to the coil''s
    [resistance](name:resistance_of_correction_coil), while the conductor geometry
    is characterized by its [cross-sectional area](name:area_of_correction_coil).
    It is distinct from [passive-loop current](name:current_of_passive_loop), which
    is induced in a passive conducting loop rather than deliberately driven through
    a correction-coil winding.


    Sign convention: Positive when conventional current flows in the designated positive
    direction around the correction-coil winding; reversing the winding traversal
    reverses the sign.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_correction_coil
  - name:area_of_correction_coil
  - name:current_of_passive_loop
  sources:
  - dd_path: coils_non_axisymmetric/coil/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/coils_non_axisymmetric.html#coils_non_axisymmetric-coil-current
    dd_documentation:
      leaf: Current in the coil
      parent_path: coils_non_axisymmetric/coil
      parent: Set of coils
      data_type: STRUCTURE
      unit: A
    enhanced_context:
      description: Electrical current flowing through a non-axisymmetric coil element,
        such as an ELM control or error field correction coil. Time-resolved waveform
        used to compute the resulting 3D perturbed magnetic field.
      kind: llm
- name: current_of_passive_loop
  kind: scalar
  status: active
  description: Current of a passive loop is the signed toroidal current flowing in
    one passive conducting loop identified by a passive-loop index. It is an eddy
    current induced by changes in linked magnetic flux from plasma currents, active
    coils, and mutual coupling to other passive conductors.
  documentation: 'Current of a passive loop is the signed toroidal electric current
    flowing in one identified closed passive conducting loop with no applied power
    supply. Each value is per passive-loop index, where the index denotes a distinct
    conducting circuit; it is not the aggregate current of a passive structure.


    For lumped passive circuit $k$, Faraday''s law and Ohm''s law give the source-free
    circuit equation:


    $$

    \mathcal{R}_k I_k + \frac{d}{dt}\left(L_k I_k + \sum_{j \ne k} M^{pp}_{kj} I_j
    + \sum_a M^{pa}_{ka} I_a + \Psi^{\mathrm{pl}}_k\right) = 0

    $$


    where $I_k$ is the current of passive loop $k$, $\mathcal{R}_k$ is its [resistance_of_passive_loop](name:resistance_of_passive_loop),
    $L_k$ is its self-inductance, $M^{pp}_{kj}$ couples it to passive loop $j$, $M^{pa}_{ka}$
    couples it to active coil circuit $a$, $I_j$ and $I_a$ are the corresponding currents,
    and $\Psi^{\mathrm{pl}}_k$ is the plasma-linked magnetic flux. The mutual-inductance
    terms represent coupling to neighboring passive loops and active coils; they are
    not included in $\Psi^{\mathrm{pl}}_k$. All flux-linkage terms are signed by the
    right-hand rule for the loop orientation corresponding to positive $I_k$.


    This quantity is distinct from [current_of_passive_structure](name:current_of_passive_structure),
    which denotes an aggregate or structure-level passive current rather than the
    current assigned to one passive-loop index. It is also distinct from voltage_of_passive_loop
    and [voltage_of_toroidal_magnetic_field_probe](name:voltage_of_toroidal_magnetic_field_probe),
    which denote loop voltages rather than conduction currents in a passive loop.


    Sign convention: Positive when the loop current circulates in the direction of
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, where $R$ is major radius and $Z$ is vertical height.'
  unit: A
  physics_domain: magnetic_field_systems
  links:
  - name:resistance_of_passive_loop
  - name:current_of_passive_structure
  - name:voltage_of_toroidal_magnetic_field_probe
  sources:
  - dd_path: pf_passive/loop/current
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/pf_passive.html#pf_passive-loop-current
    dd_documentation:
      leaf: Passive loop current
      parent_path: pf_passive/loop
      parent: Passive axisymmetric conductor description in the form of non-connected
        loops; any connected loops are expressed as active coil circuits with no power
        supply attached.
      data_type: FLT_1D
      unit: A
      coordinates:
      - pf_passive/time
      - pf_passive/loop/time
    enhanced_context:
      description: Induced current flowing in a passive conducting loop as a function
        of time. Arises from inductive coupling during plasma current changes, active
        coil transients, and disruptions, and plays a key role in vertical stability.
      kind: llm
- name: current_of_toroidal_field_coil
  kind: scalar
  status: active
  description: Current of a toroidal-field coil is the signed conventional electric
    current carried by one toroidal-field-coil winding. Its sign is defined by the
    toroidal magnetic-field component produced by that coil.
  documentation: 'Current of a toroidal-field coil is the signed conventional electric
    current carried by one toroidal-field-coil winding. It represents the coil current
    that sources that coil''s contribution to the toroidal magnetic field.


    The signed current is the current-density flux through an oriented cross-section
    of the winding conductor:


    $$

    I = \int_S \mathbf{J} \cdot \hat{\mathbf{n}}\, dA

    $$


    where $I$ is the coil current, $\mathbf{J}$ is the conventional current density,
    $S$ is the oriented cross-section, $\hat{\mathbf{n}}$ is its unit normal, and
    $dA$ is the surface area element.


    This quantity is an individual coil or coil-circuit current. It excludes multiplication
    by the number of turns, summation over a toroidal-field-coil set, and currents
    induced in passive conducting structures such as [current of passive structure](name:current_of_passive_structure).
    It is distinct from terminal [voltage of a toroidal-field coil](name:voltage_of_toroidal_field_coil)
    and from [resistance of a toroidal-field coil](name:resistance_of_toroidal_field_coil).


    Sign convention: Positive when the toroidal component of the magnetic-field contribution
    from the coil is positive, $B_\phi > 0$, in the right-handed cylindrical $(R,
    \phi, Z)$ frame.'
  unit: A
  physics_domain: magnetic_field_systems
