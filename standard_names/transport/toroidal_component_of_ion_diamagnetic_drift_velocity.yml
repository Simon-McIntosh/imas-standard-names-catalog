name: toroidal_component_of_ion_diamagnetic_drift_velocity
description: Toroidal ($\hat{\phi}$) projection of the ion diamagnetic drift velocity
  driven by perpendicular ion pressure gradients.
documentation: "The toroidal diamagnetic drift velocity of ions is $v_{\\mathrm{dia},\\\
  phi}^{(i)} = (\\mathbf{v}_{\\mathrm{dia}}^{(i)} \\cdot \\hat{\\phi})$, where the\
  \ full diamagnetic drift is $\\mathbf{v}_{\\mathrm{dia}}^{(i)} = -(\\nabla p_i \\\
  times \\mathbf{B}) / (Z_i e n_i B^2)$ with $p_i$ the ion pressure (Pa), $n_i$ the\
  \ ion number density (m$^{-3}$), $Z_i$ the charge state, and $e = 1.602 \\times\
  \ 10^{-19}$ C. The toroidal projection is particularly important for interpreting\
  \ toroidal rotation measurements from charge-exchange recombination spectroscopy\
  \ (CXRS), since the measured rotation includes both the $\\mathbf{E} \\times \\\
  mathbf{B}$ and diamagnetic contributions. Typical values are $10^3$\u2013$10^4$\
  \ m\xB7s$^{-1}$ in the plasma edge, comparable to the toroidal $\\mathbf{E} \\times\
  \ \\mathbf{B}$ drift. Positive when the drift is in the $+\\phi$ direction; the\
  \ ion diamagnetic direction is opposite to the electron diamagnetic direction for\
  \ the same pressure gradient. See also `ion_diamagnetic_drift_velocity` for the\
  \ magnitude and `diamagnetic_component_of_ion_e_cross_b_drift_velocity` for the\
  \ diamagnetic projection of the $\\mathbf{E} \\times \\mathbf{B}$ drift."
kind: vector_component
unit: m.s^-1
status: draft
