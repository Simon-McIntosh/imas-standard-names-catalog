name: electron_density_at_divertor_target
status: draft
cocos_transformation_type: one_like
description: Electron number density at the divertor target plate strike point, characterizing
  the plasma conditions where open field lines terminate on the material surface.
documentation: "The electron density at the divertor target $n_{e,\\mathrm{target}}$\
  \ quantifies the local plasma density at the point where the scrape-off layer (SOL)\
  \ field lines intersect the divertor plate. In the two-point model framework, $n_{e,\\\
  mathrm{target}}$ is related to the upstream (midplane) density $n_{e,u}$ through\
  \ particle flux conservation along the SOL flux tube: $n_{e,\\mathrm{target}} v_{\\\
  mathrm{target}} = n_{e,u} v_u f_{\\mathrm{exp}}$, where $v$ is the parallel flow\
  \ velocity and $f_{\\mathrm{exp}}$ is the flux expansion factor. Typical values\
  \ range from $10^{18}$\u2013$10^{20}\\,\\mathrm{m}^{-3}$ in attached conditions,\
  \ rising toward $10^{21}\\,\\mathrm{m}^{-3}$ under high-recycling or detached regimes.\
  \ Measured by Langmuir probes embedded in the divertor tiles or inferred from spectroscopic\
  \ Stark broadening of Balmer lines. High target density is generally associated\
  \ with partial detachment and reduced sputtering erosion. See also `electron_temperature_at_divertor_target`\
  \ for the companion thermal condition, and `electron_density` for the general plasma\
  \ density."
