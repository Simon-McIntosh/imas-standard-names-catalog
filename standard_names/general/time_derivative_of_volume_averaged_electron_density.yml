name: time_derivative_of_volume_averaged_electron_density
status: draft
description: Time derivative of the volume-averaged electron density, $d\langle n_e\rangle/dt$,
  characterizing the rate of change of the bulk electron inventory.
documentation: "This quantity represents $d\\langle n_e\\rangle/dt$ in units of m$^{-3}$\xB7\
  s$^{-1}$, where $\\langle n_e\\rangle$ is the electron density averaged over the\
  \ confined plasma volume. It encapsulates the net effect of fueling (gas puff, pellet\
  \ injection, neutral-beam injection), ionization of recycled neutrals, and particle\
  \ transport losses across the last closed flux surface. In steady-state H-mode conditions\
  \ the tendency is near zero; during density ramp-up phases values of order $10^{18}$\u2013\
  $10^{19}$ m$^{-3}$\xB7s$^{-1}$ are typical for medium-size tokamaks. The quantity\
  \ is derived from interferometry or Thomson scattering density profiles integrated\
  \ over the equilibrium-reconstructed plasma volume and numerically differentiated\
  \ in time. Rapid positive excursions can signal pellet ablation events, while negative\
  \ transients may indicate disruption precursors or loss of fueling."
validity_domain: ''
