- name: effective_charge_at_divertor_target
  kind: scalar
  status: draft
  description: Effective charge (Zeff) of the plasma evaluated at the divertor target,
    a dimensionless composite indicator of impurity content equal to unity for a pure
    hydrogen plasma and rising above unity as high-charge impurity species accumulate.
  documentation: "The effective charge $Z_\\text{eff}$ characterizes the multi-species\
    \ ion composition at the divertor target by weighting each ion species by the\
    \ square of its charge number, normalized to the electron density. It reflects\
    \ the local impurity content arising from sputtering of plasma-facing components,\
    \ deliberate impurity seeding for power exhaust control, and recycling processes\
    \ at the divertor surface.\n\nThe quantity is defined under quasi-neutrality by:\n\
    \n$$\nZ_\\text{eff} = \\frac{\\sum_s n_s Z_s^2}{n_e}\n$$\n\nwhere $n_s$ is the\
    \ number density of ion species $s$ with charge number $Z_s$, and $n_e = \\sum_s\
    \ n_s Z_s$ is the electron number density enforced by quasi-neutrality. High-$Z$\
    \ impurities contribute disproportionately: a trace fraction of [iron_density_at_divertor_target](name:iron_density_at_divertor_target)\
    \ or [argon_density_at_divertor_target](name:argon_density_at_divertor_target)\
    \ raises $Z_\\text{eff}$ far more than an equivalent density of [hydrogen_density_at_divertor_target](name:hydrogen_density_at_divertor_target).\n\
    \n$Z_\\text{eff}$ at the divertor is inferred from spectroscopic impurity line\
    \ emission or from the Bremsstrahlung continuum, whose volumetric emissivity scales\
    \ as $n_e^2 Z_\\text{eff}$. Impurity seeding enhances radiative power dissipation\
    \ in detachment scenarios, thereby reducing the [peak_power_density_at_divertor_target](name:peak_power_density_at_divertor_target).\
    \ This is the effective-charge component of the [charge_at_divertor_target](name:charge_at_divertor_target)\
    \ family.\n\nTypical values range from 1 for a pure hydrogen plasma to 2\u2013\
    8 in seeded or erosion-dominated divertor conditions.\n\nSign convention: Positive\
    \ when at least one ion species with nonzero charge number is present in the plasma,\
    \ as the numerator $\\sum_s n_s Z_s^2$ and denominator $n_e$ are both positive\
    \ under quasi-neutrality, ensuring $Z_\\text{eff} \\geq 1$."
  unit: '1'
  physics_domain: divertor_physics
  links:
  - name:iron_density_at_divertor_target
  - name:argon_density_at_divertor_target
  - name:hydrogen_density_at_divertor_target
  - name:peak_power_density_at_divertor_target
  - name:charge_at_divertor_target
  sources:
