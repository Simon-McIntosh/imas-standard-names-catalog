- name: major_radius_of_gap_reference_point
  kind: scalar
  status: draft
  description: Major-radius coordinate R of the reference point that defines a plasma-boundary
    gap measurement, in the right-handed cylindrical (R, phi, Z) frame.
  documentation: 'The gap reference point is a fixed geometric location used to define
    the direction and extent of a gap measurement between the plasma boundary and
    a target surface or limiter. The major-radius coordinate $R$ of this point specifies
    the perpendicular distance from the machine symmetry axis in the right-handed
    cylindrical $(R, \phi, Z)$ frame, where $R \geq 0$ by definition. Together with
    the corresponding vertical coordinate, it anchors the gap vector and is used in
    plasma position control to evaluate clearance between the plasma boundary and
    the first wall. Typical values range from about 1 m to 8 m depending on the device
    size. The companion quantity [major_radius_of_closest_wall_point](name:major_radius_of_closest_wall_point)
    gives the R-coordinate of the nearest wall element to the plasma boundary, while
    [major_radius_of_plasma_boundary_outline_point](name:major_radius_of_plasma_boundary_outline_point)
    samples the plasma boundary contour itself.


    Sign convention: Positive when $R$ is measured outward from the machine symmetry
    axis in the direction of increasing major radius.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:major_radius_of_closest_wall_point
  - name:major_radius_of_plasma_boundary_outline_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/gap/r
    dd_path: equilibrium/time_slice/boundary/gap/r
    status: composed
  - id: dd:pulse_schedule/position_control/gap/r
    dd_path: pulse_schedule/position_control/gap/r
    status: composed
- name: major_radius_of_geometric_axis
  kind: scalar
  status: draft
  description: Major-radius coordinate $R$ of the geometric axis (area centroid) of
    the plasma cross-section, measured as the perpendicular distance from the machine
    symmetry axis in the right-handed cylindrical $(R, \phi, Z)$ frame.
  documentation: 'The geometric axis is the area centroid of the plasma poloidal cross-section,
    defined by $R_{\rm geo} = (R_{\rm max} + R_{\rm min})/2$, where $R_{\rm max}$
    and $R_{\rm min}$ are the outermost and innermost major-radius extents of the
    plasma boundary. This coordinate locates the geometric center of the plasma shape
    and is a key parameter in plasma positioning and shape control, distinct from
    the magnetic axis (where $\nabla\psi = 0$). Typical values range from approximately
    0.6 m in small tokamaks to 6.2 m for ITER. It is inferred from equilibrium reconstruction
    using external magnetics, supplemented by internal measurements such as motional
    Stark effect or soft X-ray emission. The companion vertical coordinate is given
    by [vertical coordinate of centroid](name:vertical_coordinate_of_centroid), and
    the related [major radius of the plasma boundary outline point](name:major_radius_of_plasma_boundary_outline_point)
    provides the full boundary shape from which the centroid is computed.


    Sign convention: Positive when the geometric axis lies at a finite perpendicular
    distance from the machine symmetry axis, consistent with $R \geq 0$ in the right-handed
    cylindrical $(R, \phi, Z)$ frame.'
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_centroid
  - name:major_radius_of_plasma_boundary_outline_point
  constraints: []
  sources:
  - id: dd:equilibrium/time_slice/boundary/geometric_axis/r
    dd_path: equilibrium/time_slice/boundary/geometric_axis/r
    status: composed
- name: major_radius_of_oblique_geometry
  kind: scalar
  status: draft
  description: "Major-radius coordinate R of the reference point of an oblique cross-section\
    \ geometry element, measured as the perpendicular distance from the machine symmetry\
    \ axis in the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: "The oblique cross-section geometry element is characterized by a\
    \ reference point (conventionally marked by a + on engineering diagrams) from\
    \ which the orientation angles $\\alpha$ and $\\beta$ that define the oblique\
    \ shape are measured. The major-radius coordinate $R$ of this reference point\
    \ gives its perpendicular distance from the machine symmetry axis in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R \\geq 0$ by construction. This coordinate\
    \ locates oblique elements \u2014 such as ferritic inserts, poloidal-field coil\
    \ conductors with non-rectangular cross-sections, or iron-core segments \u2014\
    \ in the poloidal $(R, Z)$ plane. The companion vertical coordinate is given by\
    \ [vertical_coordinate_of_oblique_reference_point](name:vertical_coordinate_of_oblique_reference_point).\
    \ For rectangular and annular cross-section elements the analogous quantities\
    \ are [major_radius_of_rectangle_geometry](name:major_radius_of_rectangle_geometry)\
    \ and [major_radius_of_annular_geometry](name:major_radius_of_annular_geometry),\
    \ respectively. Typical values range from tenths of a meter to several meters\
    \ depending on the radial position of the component within the device.\n\nSign\
    \ convention: Positive when R is directed away from the machine symmetry axis,\
    \ i.e. in the direction of increasing major radius $R > 0$."
  unit: m
  physics_domain: equilibrium
  links:
  - name:vertical_coordinate_of_oblique_reference_point
