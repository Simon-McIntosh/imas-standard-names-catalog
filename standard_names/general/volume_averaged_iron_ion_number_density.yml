name: volume_averaged_iron_ion_number_density
status: draft
cocos_transformation_type: one_like
description: Plasma volume-averaged number density of iron ions (all charge states),
  a high-$Z$ impurity tracer from metallic plasma-facing components.
documentation: "The volume-averaged iron ion number density $\\langle n_{\\mathrm{Fe}}\
  \ \\rangle_V = V^{-1} \\int n_{\\mathrm{Fe}}(\\mathbf{r})\\, dV$ where $n_{\\mathrm{Fe}}$\
  \ is the local iron ion density in m$^{-3}$ summed over all charge states ($\\mathrm{Fe}^{1+}$\
  \ through $\\mathrm{Fe}^{26+}$) and $V$ is the plasma volume in m$^3$. Iron enters\
  \ the plasma through sputtering and evaporation from stainless-steel vessel components,\
  \ diagnostic mirrors, or RF antenna structures; even trace concentrations ($\\sim\
  \ 10^{14}$\u2013$10^{16}$ m$^{-3}$) significantly increase radiative losses and\
  \ $Z_{\\mathrm{eff}}$ due to the high nuclear charge ($Z = 26$). VUV and soft X-ray\
  \ spectroscopy on characteristic Fe line emissions are the primary diagnostics,\
  \ complemented by bolometry for total radiated power attribution. Iron accumulation\
  \ in the core can trigger radiative collapse, making this quantity critical for\
  \ impurity transport monitoring. See also `volume_averaged_carbon_ion_number_density`\
  \ and `electron_number_density`."
