- name: thickness_of_filter
  kind: scalar
  status: draft
  description: Physical thickness of a diagnostic filter window material, which governs
    the energy-dependent photon attenuation and the effective spectral passband of
    X-ray detector channels.
  documentation: 'The filter window thickness is the geometric extent of the absorbing
    filter material measured along the direction normal to the filter surface, coinciding
    with the photon beam propagation path. Together with the material composition,
    it sets the Beer-Lambert transmission spectrum of the filter, controlling the
    low-energy photon cutoff and shaping the spectral sensitivity of the detector
    channel.


    The photon transmission through a filter of thickness $d$ at photon energy $E$
    follows:


    $$

    T(E) = \exp(-\mu(E)\, d)

    $$


    where $\mu(E)$ is the energy-dependent linear attenuation coefficient of the filter
    material in m$^{-1}$ and $d$ is the filter thickness. Increasing $d$ suppresses
    low-energy photons more strongly, raising the effective energy cutoff of the diagnostic.


    The thickness is a fixed hardware parameter established at instrument construction
    and determined by the required spectral selection. In soft X-ray diagnostics,
    filter foils span from tens of nanometers to tens of micrometers; hard X-ray diagnostics
    may use material layers from tens of micrometers to millimeters. The wavelength-resolved
    photon absorption that results from this thickness is captured by [spectral absorptivity
    of the filter](name:spectral_absorptivity_of_filter), while the lateral extent
    of the filter opening is characterized by [radius_of_filter](name:radius_of_filter).
    The analogous geometric parameter for the dispersing element is [thickness_of_bragg_crystal](name:thickness_of_bragg_crystal).


    Sign convention: Positive when the filter material thickness is measured from
    the beam-entry face to the beam-exit face along the direction of photon propagation.'
  unit: m
  physics_domain: radiation_measurement_diagnostics
  links:
  - name:spectral_absorptivity_of_filter
  - name:radius_of_filter
  - name:thickness_of_bragg_crystal
  sources:
