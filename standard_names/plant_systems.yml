- name: maximum_gas_flow
  kind: scalar
  status: active
  description: Maximum gas flow is the largest pressure-volume gas throughput that
    a gas injection valve can reliably deliver, defining the upper bound of its controllable
    range.
  documentation: 'Maximum gas flow is the upper reliable operating limit of the pressure-volume
    throughput delivered by a gas injection valve. It is a static hardware capability
    that bounds the same physical quantity represented by [gas flow], while [minimum
    gas flow](name:minimum_gas_flow) gives the corresponding lower limit.


    The underlying pressure-volume gas throughput is defined by


    $$

    Q = p\,\dot{V}

    $$


    where $Q$ is the gas throughput, $p$ is the gas pressure, and $\dot{V}$ is the
    volumetric flow rate. The maximum gas flow is the upper reliable value of $Q$
    for the valve, not a particle source rate; for an ideal gas, the corresponding
    molecular source rate is $\dot{N}=Q/(k_B T_g)$, where $T_g$ is the gas temperature
    and $k_B$ is Boltzmann''s constant.


    This quantity defines the upper endpoint of the valve''s controllable gas-flow
    range and excludes gas throughput from other injection or pumping components.'
  unit: Pa.m^3.s^-1
  physics_domain: plant_systems
  links:
  - name:minimum_gas_flow
  sources:
  - dd_path: gas_injection/valve/flow_rate_max
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/gas_injection.html#gas_injection-valve-flow_rate_max
    dd_documentation:
      leaf: Maximum flow rate of the valve
      parent_path: gas_injection/valve
      parent: Set of valves connecting a gas bottle to pipes
      data_type: FLT_0D
      unit: Pa.m^3.s^-1
    enhanced_context:
      description: Maximum volumetric flow rate of a gas injection valve. An engineering
        limit parameter defining the peak throughput capacity of the valve for fuelling,
        impurity seeding, or disruption mitigation.
      kind: llm
- name: methane_carbon_13_source_rate
  kind: scalar
  status: active
  description: Instantaneous injection rate of carbon-13-labeled methane (13CH4) into
    the plasma vessel, expressed as an equivalent-electron rate where each molecule
    contributes 10 equivalent electrons.
  documentation: 'Carbon-13-labeled methane (13CH4) is deployed as a controlled tracer
    gas for erosion and carbon transport studies in fusion devices, because the stable
    13C isotope can be discriminated spectroscopically from the naturally occurring
    12C background. The equivalent-electron weighting assigns a factor of 10 to each
    injected 13CH4 molecule, reflecting the total electron count of the neutral species:
    atomic number $Z = 6$ for carbon plus $Z = 1$ for each of the four hydrogen atoms.


    The instantaneous equivalent-electron source rate $\dot{S}$ accumulates over time
    to give the total equivalent-electron inventory:


    $$

    N(t) = \int_0^t \dot{S}(t'') \, dt''

    $$


    where $N(t)$ is the cumulative equivalent-electron count tracked by [accumulated
    13CH4 injection](name:accumulated_methane_carbon_13_count_due_to_gas_injection).


    The rate is inferred from upstream reservoir pressure and valve conductance measurements.
    For comprehensive carbon gas accounting, this quantity complements [carbon_rate_due_to_gas_injection](name:carbon_source_rate_due_to_gas_injection),
    which sums contributions from all carbon-bearing gas species.


    Sign convention: Positive when 13CH4 gas flows from the injection system into
    the plasma vessel.'
  unit: s^-1
  physics_domain: plant_systems
  links:
  - name:accumulated_methane_carbon_13_count_due_to_gas_injection
  - name:carbon_source_rate_due_to_gas_injection
  sources:
  - dd_path: summary/gas_injection_rates/methane_carbon_13/value
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/summary.html#summary-gas_injection_rates-methane_carbon_13-value
    dd_documentation:
