    dd_path: distributions/distribution/profiles_2d/counter_passing/pressure_fast_parallel
    status: composed
- name: parallel_component_of_current_density_due_to_ohmic
  kind: scalar
  status: draft
  description: Flux-surface-averaged parallel component of the ohmic (resistively
    driven) current density, defined as the ratio of the flux-surface average of the
    dot product of the ohmic current density vector with the magnetic field vector
    to the reference vacuum toroidal field magnitude B0.
  documentation: 'The ohmic current density is the resistively driven component of
    the plasma current, sustained by the inductive toroidal electric field through
    the relation $\mathbf{J}_\mathrm{ohm} = \mathbf{E}_\parallel / \eta$, where $\eta$
    is the local plasma resistivity and $\mathbf{E}_\parallel$ is the component of
    the electric field parallel to $\mathbf{B}$.


    This quantity is defined as the flux-surface-averaged projection onto the magnetic
    field direction:

    $$j_\mathrm{ohm} = \frac{\langle \mathbf{J}_\mathrm{ohm} \cdot \mathbf{B} \rangle}{B_0}$$

    where $\mathbf{B}$ is the total magnetic field vector (not its magnitude), $\langle
    \cdot \rangle$ denotes the flux-surface average, and $B_0$ is the reference vacuum
    toroidal field magnitude evaluated on the magnetic axis (in tesla). This projection
    convention is consistent with the definitions used for the total parallel current
    density and the non-inductive current density components.


    The total parallel current density satisfies the additive decomposition:

    $$j_\parallel = j_\mathrm{ohm} + j_\mathrm{non\text{-}inductive}$$

    where $j_\mathrm{non\text{-}inductive}$ encompasses bootstrap, neutral-beam-injected,
    and wave-driven contributions.


    Typical values in present-day tokamak discharges range from $\sim 10^5$ A m$^{-2}$
    in low-density ohmic plasmas to near zero in strongly non-inductively driven scenarios.
    The quantity is evaluated on a one-dimensional grid of flux surfaces labeled by
    a normalized radial coordinate such as $\rho_\mathrm{tor,norm}$ (normalized toroidal
    flux radius) and is used in current diffusion modeling and resistive MHD transport
    codes.


    Sign convention: Positive when the ohmic current flows in the direction of the
    total plasma current, i.e., in the direction of increasing toroidal angle $\phi$
    for positive plasma current in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A.m^-2
  physics_domain: transport
  links:
  - name:parallel_component_of_non_inductive_current_density
  constraints: []
  arguments:
  - name: current_density_due_to_ohmic
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:core_profiles/profiles_1d/j_ohmic
    dd_path: core_profiles/profiles_1d/j_ohmic
    status: composed
- name: parallel_component_of_fast_particle_pressure
  kind: scalar
  status: draft
  description: Parallel component of the pressure tensor of the total fast (suprathermal)
    particle population, defined as the kinetic stress along the local magnetic field
    direction and summed over all fast-particle species and pitch-angle populations.
    It is the second moment of the distribution weighted by the square of the velocity
    component parallel to the magnetic field.
  documentation: "The parallel fast-particle pressure $p_{\\mathrm{fast},\\parallel}$\
    \ is the $(\\hat{b},\\hat{b})$ diagonal element of the pressure tensor of the\
    \ total fast (suprathermal) particle population, where $\\hat{b} = \\mathbf{B}/|\\\
    mathbf{B}|$ is the unit vector along the local magnetic field in the cylindrical\
    \ $(R, \\phi, Z)$ frame. It is defined as the species-summed second velocity moment\n\
    \n$$p_{\\mathrm{fast},\\parallel} = \\sum_s m_s \\int (v_{\\parallel})^2 f_s(\\\
    mathbf{x}, \\mathbf{v}) \\, d^3v,$$\n\nwhere the sum runs over all fast-particle\
    \ species $s$, $m_s$ is the mass of species $s$, $v_{\\parallel} = \\mathbf{v}\\\
    cdot\\hat{b}$ is the velocity component along $\\hat{b}$, and $f_s$ is the distribution\
    \ function of species $s$. The corresponding perpendicular component is $p_{\\\
    mathrm{fast},\\perp} = \\frac{1}{2}\\sum_s m_s \\int v_{\\perp}^2 f_s \\, d^3v$,\
    \ so the full isotropic (scalar) pressure relates as $p_{\\mathrm{fast}} = \\\
    tfrac{1}{3}(p_{\\mathrm{fast},\\parallel} + 2\\,p_{\\mathrm{fast},\\perp})$. For\
    \ a locally isotropic fast-particle distribution, $p_{\\mathrm{fast},\\parallel}\
    \ = p_{\\mathrm{fast},\\perp}$; significant anisotropy ($p_{\\mathrm{fast},\\\
    parallel} \\neq p_{\\mathrm{fast},\\perp}$) is characteristic of beam-heated or\
    \ wave-accelerated populations.\n\nTypical values in a reactor-scale tokamak with\
    \ neutral-beam injection lie in the range $10^2$\u2013$10^4\\,\\mathrm{Pa}$ in\
    \ the plasma core, rising toward the beam deposition region. The quantity is evaluated\
    \ locally at each spatial position (not a flux-surface average), consistent with\
    \ the gyrokinetic or bounce-averaged kinetic treatment of fast particles. It enters\
    \ MHD stability analysis (e.g., through the fast-particle contribution to the\
    \ parallel pressure balance along field lines) and is used in computing anisotropic\
    \ fast-particle pressure corrections to the total pressure gradient and rotational\
    \ transform."
  unit: J.m^-3
  physics_domain: transport
  links:
  - name:parallel_component_of_co_passing_fast_particle_pressure
  - name:parallel_component_of_counter_passing_fast_particle_pressure
  - name:fast_particle_pressure
  constraints: []
  arguments:
  - name: fast_particle_pressure
    operator: component
    operator_kind: projection
    axis: parallel
    shape: component
  sources:
  - id: dd:distributions/distribution/profiles_1d/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_1d/pressure_fast_parallel
    status: composed
  - id: dd:distributions/distribution/profiles_2d/pressure_fast_parallel
    dd_path: distributions/distribution/profiles_2d/pressure_fast_parallel
    status: composed
- name: parallel_component_of_ion_convection_velocity
  kind: scalar
  status: draft
  description: Projection of the ion bulk velocity vector onto the local magnetic
    field direction, defined as the scalar v_parallel_i = v_i dot b_hat, where b_hat
    is the unit vector along the magnetic field. This quantity characterizes field-aligned
    ion motion and appears in the parallel ion momentum and energy balance equations.
  documentation: "The parallel component of the ion convection velocity is defined\
    \ by\n\n$$v_{\\parallel,i} = \\mathbf{v}_i \\cdot \\hat{b}$$\n\nwhere $\\mathbf{v}_i$\
    \ is the ion fluid velocity vector and $\\hat{b} = \\mathbf{B}/|\\mathbf{B}|$\
    \ is the unit vector tangent to the magnetic field line. This is a local, pointwise\
    \ quantity evaluated at each spatial location in the plasma domain; it is not\
    \ a flux-surface average unless explicitly specified by context.\n\nIn the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, the magnetic field direction $\\hat{b}$ has\
    \ both toroidal and poloidal components, so $v_{\\parallel,i}$ combines contributions\
    \ from the toroidal ion velocity $v_{\\phi,i}$ and the poloidal ion velocity $v_{\\\
    theta,i}$.\n\nThe parallel convection velocity enters the parallel ion heat flux\
    \ in the Braginskii framework as\n\n$$q_{\\parallel,\\mathrm{adv},i} = \\frac{5}{2}\
    \ p_i \\, v_{\\parallel,i}$$\n\nwhere $p_i = n_i k_B T_i$ is the ion pressure,\
    \ $n_i$ is the ion density, $k_B$ is the Boltzmann constant, and $T_i$ is the\
    \ ion temperature. This advective heat flux describes the transport of ion thermal\
    \ energy along field lines by the bulk ion flow.\n\nTypical magnitudes in tokamak\
    \ edge and scrape-off layer (SOL) plasmas range from tens to hundreds of meters\
    \ per second for subsonic conditions, up to the ion acoustic (sonic) speed $c_s\
    \ = \\sqrt{\\gamma k_B T_i / m_i}$, where $\\gamma$ is the adiabatic index and\
    \ $m_i$ is the ion mass. Near material surfaces or X-points, $v_{\\parallel,i}$\
    \ can approach or exceed $c_s \\sim 10^4$\u2013$10^5$ m s$^{-1}$ for typical deuterium\
    \ plasmas at $T_i \\sim 10$\u2013$100$ eV.\n\nIn the core plasma, parallel flows\
    \ are typically smaller (subsonic, $v_{\\parallel,i} \\ll c_s$), and the quantity\
    \ is often relevant to neoclassical transport theory, where parallel viscosity\
    \ and collisional coupling drive the evolution of poloidal and toroidal rotation."
  unit: m.s^-1
  physics_domain: transport
  links:
  - name:ion_pressure
  - name:parallel_component_of_convection_velocity
  - name:ion_convection_velocity
  - name:ion_energy_diffusivity
  - name:ion_particle_diffusivity
