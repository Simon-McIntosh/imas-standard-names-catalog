- name: bulk_plasma_velocity_due_to_diamagnetic_drift_magnitude
  kind: scalar
  status: active
  description: Magnitude of the thermal bulk-plasma velocity contribution associated
    with pressure-gradient-driven diamagnetic drift, independent of its direction.
  documentation: 'Diamagnetic-drift speed is the magnitude of the thermal bulk-plasma
    velocity contribution associated with the pressure-gradient term in the perpendicular
    fluid momentum balance. It describes a collective center-of-mass flow contribution,
    not an individual-particle drift.


    The speed is defined from the corresponding velocity vector:


    $$

    v_{\mathrm{dia}} = \left|\mathbf{v}_{\mathrm{dia}}\right|

    $$


    where $v_{\mathrm{dia}}$ is the diamagnetic-drift speed and $\mathbf{v}_{\mathrm{dia}}$
    is the bulk plasma velocity due to diamagnetic drift, defined in [bulk plasma
    velocity due to diamagnetic drift](name:bulk_plasma_velocity_due_to_diamagnetic_drift).


    The magnitude is non-negative and contains no directional sign; signed projections
    of the same velocity are distinct quantities.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
