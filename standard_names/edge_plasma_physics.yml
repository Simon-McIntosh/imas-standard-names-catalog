- name: toroidal_neutral_internal_state_momentum_diffusion_coefficient
  kind: scalar
  status: active
  description: Toroidal component of the momentum diffusion coefficient for neutral
    particles in a resolved neutral-state channel. It governs Fickian redistribution
    of that state's momentum along the toroidal direction.
  documentation: 'Toroidal component of the momentum diffusion coefficient for neutral
    particles in a resolved neutral-state channel. It is the effective kinematic coefficient
    governing Fickian redistribution of momentum carried by neutrals along the toroidal
    direction.


    Let $\mathbf{D}^{(s)}$ denote the neutral internal-state momentum-diffusion vector
    for resolved state $s$, and let $\hat{\phi}$ be the toroidal unit vector in the
    right-handed cylindrical $(R,\phi,Z)$ frame. The toroidal component is defined
    by:


    $$

    D_\phi^{(s)} = \mathbf{D}^{(s)} \cdot \hat{\phi}

    $$


    Here $D_\phi^{(s)}$ is the toroidal diffusivity and $s$ identifies the specified
    electronic, vibrational, or rotational neutral state.


    This is the toroidal directional member of the [neutral internal-state momentum
    diffusion coefficient](name:neutral_internal_state_momentum_diffusion_coefficient).
    It is distinct from the [poloidal neutral internal-state momentum diffusion coefficient](name:poloidal_neutral_internal_state_momentum_diffusion_coefficient),
    while the associated [toroidal neutral internal-state momentum flux](name:toroidal_neutral_internal_state_momentum_flux)
    represents transported momentum rather than the coefficient governing its diffusive
    redistribution.'
  unit: m^2.s^-1
  physics_domain: edge_plasma_physics
