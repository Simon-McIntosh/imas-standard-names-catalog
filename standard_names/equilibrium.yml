- name: current_density
  kind: vector
  status: active
  description: Current density is the vector flux density of conventional electric
    charge, equal to electric current per unit area normal to the flow. It points
    in the direction of positive charge transport and includes all charged-particle
    contributions unless a narrower current-density quantity is specified.
  documentation: 'Current density $\mathbf{J}$ is the vector density of conventional
    electric charge flux at a point. It represents the signed flow of electric charge
    carried by charged particles, with direction defined by positive charge transport.


    A kinetic definition is the charge-weighted first velocity moment of the particle
    distribution functions:


    $$

    \mathbf{J}(\mathbf{x},t) = \sum_s q_s \int \mathbf{v}\, f_s(\mathbf{x},\mathbf{v},t)\,
    d^3v

    $$


    where $\mathbf{x}$ is position, $t$ is time, $s$ indexes charged species, $q_s$
    is the species charge, $\mathbf{v}$ is particle velocity, and $f_s$ is the velocity-space
    distribution function. In quasistatic equilibrium it is the source term in Ampere''s
    law, $\nabla \times \mathbf{B} = \mu_0 \mathbf{J}$ when displacement current is
    neglected, and steady charge conservation gives $\nabla \cdot \mathbf{J}=0$.


    This quantity excludes displacement-current density and is distinct from a scalar
    electric current, which is the flux of $\mathbf{J}$ through a specified surface.
    In the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is major radius,
    $\phi$ is toroidal angle, and $Z$ is vertical height, the geometric components
    are the projections along $(\hat{R}, \hat{\phi}, \hat{Z})$: radial_current_density,
    [toroidal_current_density](name:toroidal_current_density), and [vertical_current_density](name:vertical_current_density).
    The full vector has direction rather than a single scalar sign; scalar components
    and projections inherit the positive direction of their defining basis vector
    or unit vector.


    Sign convention: Positive when the stated component or scalar projection of $\mathbf{J}$
    is aligned with the positive direction of the basis vector or unit vector defining
    that component or projection.'
  unit: A.m^-2
  physics_domain: equilibrium
  links:
  - name:toroidal_current_density
  - name:vertical_current_density
- name: current_of_passive_structure
  kind: scalar
  status: active
  description: Net conventional electric current circulating toroidally in a passive
    conducting structure, induced electromagnetically rather than driven by an external
    power supply.
  documentation: 'The quantity is the net conventional electric current circulating
    in a passive conducting structure. It represents an induced current caused by
    changing magnetic flux linked with the structure, including contributions from
    the plasma, active coils, and neighboring conducting structures, rather than an
    intentionally supplied drive current.


    For an oriented cross-section $S$ of the structure, the net current is defined
    by


    $$

    I_{\mathrm{passive}} = \int_S \mathbf{J} \cdot d\mathbf{S}

    $$


    where $\mathbf{J}$ is the conventional electric-current density and $d\mathbf{S}$
    is the oriented area element normal to the toroidal current path.


    This is a structure-level net current. [Current of a passive loop](name:current_of_passive_loop)
    is the corresponding quantity for one identified passive loop, while [toroidal
    current of the vacuum vessel](name:toroidal_current_of_vacuum_vessel) is the vessel-specific
    case.


    Sign convention: Positive when the net current flows in the direction of increasing
    toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$ frame.'
  unit: A
  physics_domain: equilibrium
  links:
  - name:current_of_passive_loop
  - name:toroidal_current_of_vacuum_vessel
  sources:
  - dd_path: equilibrium/time_slice/constraints/pf_passive_current/measured
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/equilibrium.html#equilibrium-time_slice-constraints-pf_passive_current-measured
    dd_documentation:
