- name: power_due_to_ohmic_dissipation
  kind: scalar
  status: active
  description: Irreversible electrical power converted into heat by finite resistivity,
    obtained by integrating Joule heating over the relevant conducting plasma or material
    domain.
  documentation: "Ohmic-dissipation power is the irreversible conversion of electromagnetic\
    \ work into heat by finite electrical resistivity in a conducting plasma or material\
    \ domain. It is nonnegative for passive resistive media.\n\n$$\nP_{\\mathrm{ohm}}\
    \ = \\int_{\\mathcal{V}} \\mathbf{J} \\cdot \\mathbf{E}_{\\mathrm{res}}\\,dV =\
    \ \\int_{\\mathcal{V}} \\eta |\\mathbf{J}|^2\\,dV\n$$\n\nwhere $P_{\\mathrm{ohm}}$\
    \ is the total dissipated power, $\\mathbf{J}$ is current density in A m$^{-2}$,\
    \ $\\mathbf{E}_{\\mathrm{res}}$ is the resistive electric field in V m$^{-1}$,\
    \ $\\eta$ is scalar resistivity in \u03A9 m, and $\\mathcal{V}$ is the included\
    \ conducting volume. The second equality applies when $\\mathbf{E}_{\\mathrm{res}}=\\\
    eta\\mathbf{J}$.\n\nThe integration domain sets the scope: the wall contribution\
    \ is [power at the wall due to ohmic dissipation](name:power_at_wall_due_to_ohmic_dissipation),\
    \ while a plasma-column contribution is related to [plasma resistance](name:plasma_resistance)\
    \ by $P_{\\mathrm{ohm}}=R_{\\mathrm{p}}I_{\\mathrm{p}}^2$ when a lumped resistance\
    \ $R_{\\mathrm{p}}$ and total current $I_{\\mathrm{p}}$ are defined. Reversible\
    \ electromagnetic energy storage and externally delivered power are excluded."
  unit: W
  physics_domain: magnetohydrodynamics
  links:
  - name:power_at_wall_due_to_ohmic_dissipation
  - name:plasma_resistance
  sources:
  - dd_path: disruption/global_quantities/power_ohm
    dd_version: 4.1.0
    dd_documentation_url: https://imas-data-dictionary.readthedocs.io/en/4.1.0/generated/ids/disruption.html#disruption-global_quantities-power_ohm
    dd_documentation:
