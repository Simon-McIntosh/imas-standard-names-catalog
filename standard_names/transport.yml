- name: toroidal_component_of_plasma_momentum_diffusivity
  kind: scalar
  status: draft
  description: Effective diffusivity governing diffusive transport of toroidal momentum
    across flux surfaces for all plasma species, including ions of all charge states
    and electrons, defined via the Fick-type flux-gradient relation for toroidal momentum
    density.
  documentation: "The toroidal plasma momentum diffusivity $D_\\phi$ appears in the\
    \ Fick-type flux-gradient relation for radial transport of toroidal momentum density:\n\
    \n$$\\Gamma_{p_\\phi} = -D_\\phi \\, \\nabla p_\\phi$$\n\nwhere $p_\\phi$ is the\
    \ flux-surface-averaged toroidal momentum density [kg m$^{-2}$ s$^{-1}$] (mass\
    \ density times toroidal velocity, $\\rho v_\\phi$), $\\nabla p_\\phi$ is its\
    \ radial gradient [kg m$^{-3}$ s$^{-1}$], and $\\Gamma_{p_\\phi}$ is the radial\
    \ momentum flux [kg m$^{-1}$ s$^{-2}$]. The toroidal direction $\\phi$ is defined\
    \ in the right-handed cylindrical $(R, \\phi, Z)$ frame, where $\\phi$ increases\
    \ counter-clockwise when viewed from above $+\\hat{Z}$.\n\nSign convention: Positive\
    \ when the momentum flux is directed radially outward (in the direction of increasing\
    \ $R$ at the outboard midplane), opposing a positive radial gradient of toroidal\
    \ momentum density.\n\nThis quantity aggregates diffusive momentum transport from\
    \ all plasma species \u2014 ions of all charge states and electrons \u2014 and\
    \ is closely related to the ion-species-only diffusivity given by [toroidal_component_of_ion_momentum_diffusivity](name:toroidal_component_of_ion_momentum_diffusivity).\
    \ The total momentum diffusivity [toroidal_component_of_total_momentum_diffusivity](name:toroidal_component_of_total_momentum_diffusivity)\
    \ may additionally include contributions from neutrals or other non-plasma constituents;\
    \ in regimes where plasma species dominate, the two quantities are approximately\
    \ equal.\n\nTypical values in tokamak core plasmas range from $0.1$ to $10\\;\\\
    mathrm{m^2\\,s^{-1}}$. The ratio to the ion thermal diffusivity $\\chi_i$ defines\
    \ the momentum Prandtl number $\\mathrm{Pr} = D_\\phi / \\chi_i$, which typically\
    \ falls in the range $0.2$\u2013$1$ in standard H-mode conditions. This diffusivity\
    \ is inferred experimentally from rotation profile evolution \u2014 commonly measured\
    \ via charge-exchange recombination spectroscopy for the impurity ion toroidal\
    \ velocity \u2014 combined with one-dimensional radial transport modeling. The\
    \ analogous quantity for poloidal momentum transport of individual ion species\
    \ is given by [poloidal_component_of_ion_momentum_diffusivity](name:poloidal_component_of_ion_momentum_diffusivity)."
  unit: m^2.s^-1
  physics_domain: transport
  links:
  - name:toroidal_component_of_ion_momentum_diffusivity
  - name:toroidal_component_of_total_momentum_diffusivity
  - name:poloidal_component_of_ion_momentum_diffusivity
  constraints: []
  arguments:
  - name: plasma_momentum_diffusivity
    operator: component
    operator_kind: projection
    axis: toroidal
    shape: component
  sources:
  - id: dd:core_transport/model/profiles_1d/momentum_phi/d
    dd_path: core_transport/model/profiles_1d/momentum_phi/d
    status: composed
- name: toroidal_component_of_plasma_torque_inside_flux_surface
  kind: scalar
  status: draft
  description: Cumulative volume integral of the toroidal component of plasma torque
    enclosed within a given flux surface, representing the net toroidal angular momentum
    source accumulated from the magnetic axis to that surface.
  documentation: The toroidal component of plasma torque inside a flux surface is
    the volume-integrated source term $\tau_\phi(\psi) = \int_0^\psi \mathcal{T}_\phi
    \, dV$, where $\mathcal{T}_\phi$ (in kg m$^{-1}$ s$^{-2}$) is the local toroidal
    torque density and $\psi$ labels the enclosing flux surface. This quantity appears
    directly in the 1D toroidal momentum transport equation, playing the same structural
    role for angular momentum as cumulative particle and energy sources play for their
    respective transport equations. It accumulates from zero at the magnetic axis
    to the total plasma torque at the last closed flux surface. Sources contributing
    to $\mathcal{T}_\phi$ include neutral beam injection, radiofrequency wave momentum
    deposition, and neoclassical and anomalous viscosity; typical magnitudes for neutral
    beam-heated tokamaks range from $10^{-1}$ to $10^1$ N m. The closely related quantity
    [toroidal torque inside flux surface](name:toroidal_torque_inside_flux_surface)
    captures the same cumulative torque without the explicit plasma-specificity qualifier,
    while [plasma toroidal torque](name:plasma_toroidal_torque) gives the total volume-integrated
    value. The analogous cumulative particle source is documented under [total ion
    particle source inside flux surface](name:total_ion_particle_source_inside_flux_surface).
  unit: kg.m^2.s^-2
  physics_domain: transport
  links:
  - name:toroidal_torque_inside_flux_surface
  - name:plasma_toroidal_torque
  - name:total_ion_particle_source_inside_flux_surface
  constraints: []
  sources:
  - id: dd:plasma_sources/source/profiles_1d/torque_phi_inside
    dd_path: plasma_sources/source/profiles_1d/torque_phi_inside
    status: composed
- name: toroidal_component_of_thermal_electron_torque_density_due_to_coulomb_collisions
  kind: scalar
  status: draft
  description: Toroidal component of the collisional torque density transferred to
    the bulk thermal electron population via Coulomb collisions with fast (non-thermal)
    distribution particles, representing the local per-unit-volume angular momentum
    exchange rate.
  documentation: 'This quantity is the $\hat{\phi}$-projection of the collisional
    torque density exerted on the thermal electron population by Coulomb scattering
    from a non-thermal particle distribution. It is defined as


    $$\tau_{\phi,e}^{\rm coll} = \int m_e v_\phi C[f_{\rm fast}, f_{e}]\, d^3v$$


    where $m_e$ is the electron mass, $v_\phi$ is the toroidal velocity, and $C[f_{\rm
    fast}, f_e]$ is the Coulomb collision operator acting between the fast-particle
    distribution $f_{\rm fast}$ and the thermal electron distribution $f_e$. The unit
    $\text{N}\cdot\text{m}^{-2}$ (equivalently $\text{m}^{-2}\cdot\text{N}$) confirms
    the per-unit-volume character: integrating over the plasma volume yields the [volume-integrated
    toroidal torque](name:toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions).
    This collisional channel is the electron counterpart to [ion torque density via
    Coulomb collisions](name:toroidal_component_of_thermal_ion_torque_density_due_to_coulomb_collisions)
    and enters the toroidal angular momentum balance of the thermal electrons in kinetic
    transport codes. Contributions arise from both trapped and co-/counter-passing
    fast particle sub-populations; summing over all orbit classes recovers the total
    collisional momentum deposition. Typical magnitudes in NBI-heated tokamaks range
    from $10^{-3}$ to $10^{0}$ N m$^{-2}$ depending on fast-ion density and collision
    frequency. The fast-particle counterpart, [toroidal fast-particle torque density
    via electron collisions](name:toroidal_component_of_fast_particle_torque_density_due_to_coulomb_collisions_with_electrons),
    carries the equal-and-opposite reaction force by Newton''s third law.


    Sign convention: Positive when the torque density accelerates the thermal electron
    population in the direction of increasing toroidal angle $\phi$.'
  unit: N.m^-2
  physics_domain: transport
  links:
  - name:toroidal_component_of_thermal_electron_torque_due_to_coulomb_collisions
  - name:toroidal_component_of_thermal_ion_torque_density_due_to_coulomb_collisions
