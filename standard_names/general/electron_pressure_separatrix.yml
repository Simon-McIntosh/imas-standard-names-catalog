name: electron_pressure_separatrix
status: draft
cocos_transformation_type: one_like
description: Kinetic pressure of the electron population evaluated at the last closed
  flux surface (separatrix), $p_{e,\rm sep} = n_{e,\rm sep} k_B T_{e,\rm sep}$.
documentation: "The electron pressure at the separatrix $p_{e,\\rm sep} = n_{e,\\\
  rm sep} T_{e,\\rm sep}$ (with $T_e$ in energy units) sets the upstream boundary\
  \ condition for scrape-off layer transport and is a critical parameter in the two-point\
  \ divertor model. Here $n_{e,\\rm sep}$ is the electron number density and $T_{e,\\\
  rm sep}$ the electron temperature, both evaluated at the separatrix. Typical values\
  \ range from 0.5 to 5 kPa in H-mode tokamak plasmas; higher values generally correlate\
  \ with higher divertor heat loads. This quantity is commonly extracted from modified\
  \ hyperbolic-tangent (mtanh) or linear fits to Thomson scattering edge profiles.\
  \ The separatrix location itself is determined by equilibrium reconstruction and\
  \ carries an uncertainty of order 5\u201310 mm in major radius. See also `electron_pressure_at_pedestal`\
  \ for the pedestal-top value and `electron_temperature_at_plasma_boundary` for the\
  \ electron thermal energy at the boundary."
validity_domain: ''
