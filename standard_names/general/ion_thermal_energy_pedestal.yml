name: ion_thermal_energy_pedestal
status: draft
description: Thermal energy stored in the ion population within the pedestal region,
  obtained from volume integration of $\frac{3}{2} n_i k_B T_i$ over the pedestal.
documentation: "The ion thermal energy at the pedestal $W_{i,\\rm ped} = \\frac{3}{2}\
  \ \\int_{\\rm ped} n_i k_B T_i \\, dV$ quantifies the energy content of the thermalized\
  \ ion population inside the H-mode edge transport barrier, where $n_i$ is the total\
  \ thermal ion density, $T_i$ the ion temperature, and the integral extends over\
  \ the pedestal volume. In many H-mode scenarios $T_i \\approx T_e$ at the pedestal,\
  \ so $W_{i,\\rm ped}$ is comparable to the electron counterpart, with typical values\
  \ of 10\u2013300 kJ in medium to large tokamaks. The quantity is essential for evaluating\
  \ ELM losses and pedestal energy confinement: type-I ELMs can expel 5\u201315% of\
  \ the total pedestal stored energy. It is derived from CXRS ion temperature and\
  \ density profiles combined with the magnetic equilibrium volume element. See also\
  \ `electron_thermal_energy_at_pedestal` for the electron counterpart and `total_thermal_ion_number_density_at_internal_transport_barrier`\
  \ for a related ion density quantity."
