name: neutral_state_radiated_power_density
status: draft
description: Electromagnetic power radiated per unit volume by a single quantum or
  excitation state of a given neutral species.
documentation: The neutral-state radiated power density $P_{\mathrm{rad},n,s}$ (unit
  $\mathrm{W\,m^{-3}}$) resolves the volumetric emissivity from a specific internal
  state $s$ (ground, metastable, vibrationally or rotationally excited) of a neutral
  species, including resonance-line emission (e.g., Lyman-$\alpha$ from $n=2 \to 1$
  hydrogen) and molecular band radiation from particular rovibrational levels. State-resolved
  tracking is important because metastable hydrogen atoms and vibrationally excited
  $\mathrm{H}_2$ molecules have significantly different ionization and radiation rates
  than ground-state populations. Computed by state-resolved collisional-radiative
  codes (Yacora, B2.5-Eirene with ro-vibrational model) using local $n_e$, $T_e$,
  and state-specific neutral densities. Summing over all states $s$ of a neutral species
  yields the species-total `neutral_radiated_power_density`. Typical values in the
  divertor range from $10^3$ to $10^6\;\mathrm{W\,m^{-3}}$ depending on the state
  population and plasma conditions. See also `ion_state_radiated_power_density` for
  the charged-particle counterpart.
