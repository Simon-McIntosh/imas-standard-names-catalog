- name: thermal_electron_decay_length_over_scrape_off_layer
  kind: scalar
  status: active
  description: Positive outward e-folding distance of the thermal electron temperature
    in the scrape-off layer, distinct from electron-density and heat-flux decay lengths.
  documentation: 'The thermal electron temperature decay length is the positive e-folding
    distance associated with the outward decrease of electron temperature in the scrape-off
    layer. It characterizes temperature falloff rather than electron-density or heat-flux
    falloff.


    It is defined from the outward logarithmic temperature gradient as


    $$

    \lambda_{T_e} = \left|\frac{d\ln T_e}{d r_\perp}\right|^{-1}

    $$


    where $\lambda_{T_e}$ is the temperature decay length, $T_e$ is the thermal electron
    temperature, and $r_\perp$ is outward distance across the scrape-off layer.


    This quantity is distinct from the [electron decay length over the scrape-off
    layer](name:electron_decay_length_over_scrape_off_layer), which applies the same
    scale-length definition to electron number density, and from the [electron heat
    decay length over the scrape-off layer](name:electron_heat_decay_length_over_scrape_off_layer),
    which applies it to electron heat flux.'
  unit: m
  physics_domain: edge_plasma_physics
  links:
  - name:electron_decay_length_over_scrape_off_layer
  - name:electron_heat_decay_length_over_scrape_off_layer
  arguments:
  - name: electron_decay_length_over_scrape_off_layer
    operator: thermal
    operator_kind: qualifier
  sources:
