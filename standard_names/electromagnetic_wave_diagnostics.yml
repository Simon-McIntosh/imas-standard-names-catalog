- name: voltage_of_diagnostic_antenna
  kind: scalar
  status: draft
  description: Raw voltage reported by an electron-cyclotron-emission diagnostic antenna
    channel before calibration to radiation temperature. It is measured relative to
    an electronics reference and can include receiver gain, detector response, baseline
    offset, and readout polarity, so it is not by itself a strictly proportional measure
    of received power.
  documentation: 'Voltage of a diagnostic antenna is the uncalibrated electrical readout
    of an electron-cyclotron-emission radiometer channel associated with a receiving
    antenna band. It is the voltage after the receiver, detector, and readout electronics,
    measured relative to an electronics reference, before conversion to a calibrated
    radiation temperature.


    The channel affine calibration to [radiative_temperature](name:radiative_temperature)
    is written as:


    $$

    T_{\mathrm{rad}} = a_V\,(V - V_{\mathrm{ref}}) + T_{\mathrm{ref}}

    $$


    where $V$ is the raw channel voltage in volts, $V_{\mathrm{ref}}$ is the electronics
    reference or baseline voltage in volts, $a_V$ is the channel calibration coefficient
    in temperature units per volt, and $T_{\mathrm{ref}}$ is an additive temperature
    offset in the same unit as $T_{\mathrm{rad}}$.


    In a heterodyne radiometer, this quantity denotes the detected video-bandwidth
    voltage formed after microwave mixing, intermediate-frequency filtering, and detection;
    in a direct-detection radiometer, it denotes the detector video voltage. It is
    not the microwave electric-field waveform at the antenna terminals. Interpreting
    the calibrated signal as a local electron temperature also requires the calibrated
    [frequency_of_diagnostic_antenna](name:frequency_of_diagnostic_antenna), the relevant
    cyclotron harmonic and polarization, viewing geometry, magnetic-field information
    along the line of sight, and an assessment that the emission is sufficiently optically
    thick.


    Typical magnitudes for detected ECE video outputs are instrument dependent and
    are often about 0.001-1 V during normal operation. Offsets, receiver gain, detector
    type, bandwidth, and digitizer scaling can shift the recorded baseline or full-scale
    value outside this range, so the calibrated temperature relation carries the physical
    interpretation rather than the raw voltage alone.


    Sign convention: Positive when the channel readout, with its assigned electronics
    polarity, is above the electronics reference level.'
  unit: V
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:radiative_temperature
  - name:frequency_of_diagnostic_antenna
  - name:voltage_of_spectrometer
  sources:
  - id: dd:ece/channel/t_e_voltage
    dd_path: ece/channel/t_e_voltage
    status: attached
  - id: dd:ece/channel/voltage_t_radiation
    dd_path: ece/channel/voltage_t_radiation
    status: composed
- name: wavelength_of_wave_beam
  kind: scalar
  status: draft
  description: Vacuum wavelength of a probing electromagnetic wave beam, the spatial
    period corresponding to one complete cycle of its field phase.
  documentation: 'The wavelength of a wave beam is the vacuum spatial period of the
    probing electromagnetic field along its propagation direction. It refers to the
    incident or launch radiation itself, not to the detection-side spectral coordinate
    used to label measured scattered or emitted light, such as [spectral_wavelength](name:spectral_wavelength_of_optical_element).


    For a monochromatic component in vacuum, the defining relation is


    $$

    \lambda_0 = \frac{c_0}{f}

    $$


    where $\lambda_0$ is the vacuum wavelength in meters, $c_0$ is the speed of light
    in vacuum in meters per second, and $f$ is the wave frequency in hertz ($\mathrm{s}^{-1}$).
    If angular frequency $\omega$ is used, $f = \omega/(2\pi)$.


    In practice, the wavelength is set by the electromagnetic source, for example
    a laser line or microwave oscillator, and may be determined from the source frequency
    or by spectroscopic calibration. For finite-bandwidth or pulsed beams, the quoted
    value is usually the central vacuum wavelength. Plasma propagation changes the
    local wavelength through the refractive index, but this quantity remains the vacuum
    reference wavelength used to specify the launched beam.


    The wavelength enters diagnostic sensitivity and calibration. In cold-plasma interferometry,
    the magnitude of the plasma phase shift relative to vacuum scales as $\lambda_0
    \int n_e\,dl$, linking this quantity to the spectral_calibration_factor_of_interferometer_beam;
    in polarimetry, Faraday rotation scales as $\lambda_0^2 \int n_e B_\parallel\,dl$,
    where $n_e$ is electron number density, $B_\parallel$ is the magnetic-field component
    along the beam path, and $l$ is path length. In Thomson scattering, the probe
    wavelength sets the spectral location of the scattered signal and affects the
    scattering geometry and calibration.


    Typical values are $5.32 \times 10^{-7}$ m and $1.064 \times 10^{-6}$ m for common
    Thomson-scattering lasers, $1.06 \times 10^{-5}$ m for CO2 interferometers, $1
    \times 10^{-4}$-$1 \times 10^{-3}$ m for far-infrared interferometry or polarimetry,
    and $1 \times 10^{-3}$-$1 \times 10^{-2}$ m for millimeter-wave systems.'
  unit: m
  physics_domain: electromagnetic_wave_diagnostics
  links:
  - name:spectral_wavelength_of_optical_element
  sources:
  - id: dd:interferometer/channel/wavelength/value
    dd_path: interferometer/channel/wavelength/value
    status: attached
