- name: toroidal_hydrogen_velocity_at_pedestal_top
  kind: scalar
  status: draft
  description: "Toroidal component of the hydrogen ion fluid velocity evaluated at\
    \ the H-mode pedestal top, projected along increasing toroidal angle \u03C6 in\
    \ the right-handed cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal component of the hydrogen ion fluid velocity evaluated
    at the H-mode pedestal top is the scalar projection of the local hydrogen ion
    bulk flow onto the toroidal direction. As a species-level ion velocity, it denotes
    the density-weighted mean over hydrogen ion charge states at that location; for
    hydrogen this is normally the singly ionized ion population. It should be compared
    with other pedestal-top species velocities only at the same pedestal-top reference
    location.


    The toroidal projection is defined by


    $$

    v_{\phi,\mathrm{H}} = \mathbf{v}_{\mathrm{H}} \cdot \hat{\phi}

    $$


    where $v_{\phi,\mathrm{H}}$ is the toroidal hydrogen ion velocity, $\mathbf{v}_{\mathrm{H}}$
    is the hydrogen ion bulk fluid velocity, and $\hat{\phi}$ is the unit vector along
    increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi, Z)$
    frame, with $R$ the major radius and $Z$ the vertical height.


    The local value is inferred by evaluating measured or modeled hydrogen ion flow
    at the H-mode pedestal top. Experimental estimates may use suitable Doppler-shift
    information or other edge-flow constraints together with viewing geometry and
    magnetic-equilibrium geometry; simulations obtain the value from the hydrogen
    species momentum balance sampled at the same pedestal-top location. Related comparisons
    include [toroidal_deuterium_velocity_at_pedestal_top](name:toroidal_deuterium_velocity_at_pedestal_top),
    [toroidal_helium_3_velocity_at_pedestal_top](name:toroidal_helium_3_velocity_at_pedestal_top),
    and [toroidal_neon_velocity_at_pedestal_top](name:toroidal_neon_velocity_at_pedestal_top).


    Typical pedestal-top toroidal hydrogen velocities in present tokamaks are often
    close to 0 m.s^-1 in weakly rotating edges and commonly have magnitudes of 10^4-10^5
    m.s^-1 when measurable rotation is present; the sign and magnitude depend on torque
    input, intrinsic rotation, collisional coupling, and edge transport.


    Sign convention: Positive when the hydrogen ion fluid velocity has a component
    in the direction of increasing toroidal angle $\phi$ in the right-handed cylindrical
    $(R, \phi, Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
  links:
  - name:toroidal_deuterium_velocity_at_pedestal_top
  - name:toroidal_helium_3_velocity_at_pedestal_top
  - name:toroidal_neon_velocity_at_pedestal_top
- name: toroidal_hydrogen_velocity_at_plasma_boundary
  kind: scalar
  status: draft
  description: "Local toroidal component of the hydrogen species bulk-flow velocity\
    \ evaluated at a point on the plasma boundary, meaning the last-closed flux surface\
    \ or separatrix. It is not a flux-surface average and is signed in the right-handed\
    \ cylindrical (R, \u03C6, Z) frame."
  documentation: 'Toroidal hydrogen velocity at the plasma boundary is the local component
    of the hydrogen species bulk-flow velocity tangent to the toroidal direction at
    a specified point on the last-closed flux surface or separatrix. The component
    is defined in the right-handed cylindrical $(R, \phi, Z)$ frame, where $R$ is
    major radius, $\phi$ is toroidal angle, and $Z$ is vertical height. It is distinct
    from flux-surface-averaged boundary quantities such as [toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_deuterium_velocity_at_plasma_boundary)
    and [toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary](name:toroidal_flux_surface_averaged_carbon_velocity_at_plasma_boundary),
    which average around the boundary rather than retaining the local value.


    The local projection is


    $$

    v_{\phi,\mathrm{H}}(\mathbf{x}_b) = \mathbf{v}_{\mathrm{H}}(\mathbf{x}_b) \cdot
    \hat{\phi}

    $$


    where $\mathbf{x}_b$ is the selected boundary position, specified by $R$ and $Z$
    in meters and $\phi$ in radians; $\mathbf{v}_{\mathrm{H}}$ is the hydrogen bulk
    velocity in m.s^-1; $\hat{\phi}$ is the dimensionless toroidal unit vector; and
    $v_{\phi,\mathrm{H}}$ is the toroidal component in m.s^-1.


    In practice this quantity may be inferred from edge flow diagnostics, spectroscopic
    velocity measurements when applicable, or transport calculations constrained by
    edge plasma observations. Because it is local, it can vary with poloidal position
    along the separatrix and should not be substituted for a flux-surface average
    without an explicit averaging operation.


    No universal numerical range applies at the separatrix because the value depends
    strongly on plasma current, toroidal field, collisionality, rotation sources,
    and edge momentum transport. Representative edge main-species toroidal speeds
    are often of order 10^3-10^4 m.s^-1, with values that may be near zero or may
    reverse sign locally.


    Sign convention: Positive when the hydrogen bulk flow has a component in the direction
    of increasing toroidal angle $\phi$ in the right-handed cylindrical $(R, \phi,
    Z)$ frame.'
  unit: m.s^-1
  physics_domain: edge_plasma_physics
