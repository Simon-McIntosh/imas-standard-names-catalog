- name: radial_coordinate_of_iron_core_segment
  kind: scalar
  status: active
  description: "Non-negative major-radius coordinate of an arc-of-circle defining\
    \ point on an iron-core-segment boundary in the right-handed cylindrical (R, \u03C6\
    , Z) frame."
  documentation: 'The major-radius coordinate $R$ of an arc-of-circle defining point
    on an iron-core-segment boundary is its perpendicular distance from the toroidal
    symmetry axis. It locates the point in the poloidal cross-section in the right-handed
    cylindrical $(R, [1m\phi[0m, Z)$ frame, where $R$ is major radius, $\phi$ is toroidal
    angle, and $Z$ is vertical height.


    $$

    R = \sqrt{x^2+y^2}

    $$


    where $x$ and $y$ are horizontal Cartesian coordinates in the right-handed Cartesian
    basis $(\hat{x},\hat{y},\hat{z})$, with $\hat{z}=\hat{Z}$, measured from the toroidal
    symmetry axis and expressed in meters.


    This quantity applies to a boundary point defined by the arc geometry. It is distinct
    from the [radius of the iron-core segment](name:radius_of_iron_core_segment),
    which is the curvature radius of the arc, and from the [radial coordinate of a
    measurement position](name:radial_coordinate_of_measurement_position), which applies
    the same major-radius definition at a measurement location.'
  unit: m
  physics_domain: magnetic_field_systems
  links:
