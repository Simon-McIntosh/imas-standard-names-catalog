  documentation: 'Number density of krypton impurity ions at the pedestal top is the
    particle count per volume for krypton ions evaluated at the core-side shoulder
    of an H-mode pedestal. The pedestal top is the transition where the steep-gradient
    edge transport barrier meets the flatter confined-core density variation, distinct
    from a separatrix or plasma-boundary value. This quantity is the krypton-specific
    specialization of [density at the pedestal top](name:density_at_pedestal_top),
    while [ion density at the pedestal top](name:ion_density_at_pedestal_top) denotes
    the corresponding broader ion population.


    The defining local density is


    $$

    n_{\mathrm{Kr}}(\xi_{\mathrm{ped,top}}) = \sum_{Z=1}^{36} n_{\mathrm{Kr}^{Z+}}(\xi_{\mathrm{ped,top}})
    = \left.\frac{dN_{\mathrm{Kr}}}{dV}\right|_{\xi=\xi_{\mathrm{ped,top}}}

    $$


    where $n_{\mathrm{Kr}}$ is the krypton-ion number density in m$^{-3}$, $n_{\mathrm{Kr}^{Z+}}$
    is the density for charge state $Z$, $N_{\mathrm{Kr}}$ is the dimensionless krypton-ion
    count, $V$ is physical volume in m$^3$, and $\xi_{\mathrm{ped,top}}$ is the radial
    label of the pedestal-top location. The sum includes singly ionized through fully
    stripped krypton and excludes neutral krypton.'
