- name: radial_coordinate_of_lower_hybrid_antenna_row
  kind: scalar
  status: draft
  description: Radial coordinate of the geometric reference point of a lower hybrid
    antenna row in the right-handed cylindrical (R, phi, Z) frame. R is the major
    radius measured from the machine symmetry axis; this is not a local distance from
    the antenna mouth.
  documentation: 'The radial coordinate of a lower hybrid antenna row is the major-radius
    coordinate $R$ of the row''s geometric reference point in the right-handed cylindrical
    $(R, \phi, Z)$ frame. Here $R$ is distance from the machine symmetry axis, $\phi$
    is the toroidal angle increasing counter-clockwise when viewed from above, and
    $Z$ is vertical height. This coordinate locates the antenna row in the device
    geometry and is distinct from any local coordinate normal to the antenna mouth
    or from the electron density at the launching position.


    If the same point is expressed in a right-handed Cartesian $(x, y, z)$ frame with
    $z=Z$ and origin on the machine symmetry axis, its major radius is


    $$

    R = \sqrt{x^2 + y^2}

    $$


    where $x$ and $y$ are the horizontal Cartesian coordinates of the row reference
    point.


    The coordinate is usually determined from mechanical design data, installation
    survey, metrology, or geometric reconstruction of the launcher position. The chosen
    row reference point should be a reproducible physical point, such as the center
    of the row aperture or another documented launcher reference point, so that radial
    and vertical row coordinates describe the same physical location.


    Typical values are of order the device major radius: about 1-4 m in medium-size
    tokamaks and about 4-9 m in large tokamaks, with lower hybrid launchers commonly
    mounted near the low-field-side boundary.'
  unit: m
  physics_domain: auxiliary_heating
  links:
  - name:absorbed_power_of_lower_hybrid_antenna
  - name:current_due_to_lower_hybrid_current_drive
  sources:
  - id: dd:lh_antennas/antenna/distance_to_antenna
    dd_path: lh_antennas/antenna/distance_to_antenna
    status: composed
- name: radial_coordinate_of_neutral_beam_injector
  kind: scalar
  status: draft
  description: "Major radius coordinate of the declared reference position of a neutral\
    \ beam injector in the right-handed cylindrical (R, \u03C6, Z) frame, measured\
    \ as the perpendicular distance from the toroidal symmetry axis."
  documentation: "The radial coordinate $R$ of a neutral beam injector specifies the\
    \ major radius of the declared reference position of the injector in the right-handed\
    \ cylindrical $(R, \\phi, Z)$ frame, where $R$ is the perpendicular distance from\
    \ the toroidal symmetry axis and $\\phi$ is the toroidal angle increasing counter-clockwise\
    \ when viewed from above $+\\hat{Z}$. Paired with [vertical_coordinate_of_neutral_beam_injector](name:vertical_coordinate_of_neutral_beam_injector),\
    \ this coordinate fully locates the injector reference point in the poloidal cross-section\
    \ and provides the geometric anchor for beam-path tracing and shine-through calculations.\n\
    \nThe reference position corresponds to a nominated geometric point on the injector\
    \ assembly \u2014 such as the ion-source face center or beam duct exit plane \u2014\
    \ with the precise convention established per facility. This coordinate is directly\
    \ analogous to [radial_coordinate_of_aperture](name:radial_coordinate_of_aperture)\
    \ for diagnostic apertures and enters the geometric model used to compute the\
    \ [absorbed_power_of_neutral_beam_injector](name:absorbed_power_of_neutral_beam_injector)\
    \ deposition profile.\n\nTypical values range from roughly 1 m in compact devices\
    \ to over 10 m in large-scale tokamaks, with injector ports most commonly located\
    \ on the outboard midplane where $R$ substantially exceeds the magnetic axis major\
    \ radius.\n\nSign convention: Positive when the reference position is displaced\
    \ from the toroidal symmetry axis in the outward $+\\hat{R}$ direction, increasing\
    \ with perpendicular distance from the axis."
  unit: m
  physics_domain: auxiliary_heating
  links:
