      kind: llm
- name: particle_energy
  kind: scalar
  status: active
  description: Energy-like measure of particle motion in velocity space, combining
    parallel and perpendicular kinetic-energy contributions for distribution-based
    plasma quantities.
  documentation: 'Particle energy denotes the kinetic-energy content or energy coordinate
    associated with a species'' velocity-space distribution. It is based on both parallel
    and perpendicular motion and can characterize an ordering coordinate, a distribution
    moment, or a response of a perturbed distribution.


    The underlying single-particle kinetic energy is


    $$

    E = \frac{1}{2}m\left(v_\parallel^2 + v_\perp^2\right)

    $$


    where $E$ is particle kinetic energy, $m$ is particle mass, and $v_\parallel$
    and $v_\perp$ are the velocity components parallel and perpendicular to the local
    magnetic field. Distribution-based quantities use this energy or an equivalent
    velocity-space weighting; [fast_particle_energy](name:fast_particle_energy) represents
    a fast-population moment, while [perturbed_particle_energy](name:perturbed_particle_energy)
    represents the corresponding response of a perturbed distribution. An effective
    coordinate may additionally be scaled by a positive reference energy, as in [effective_particle_energy](name:effective_particle_energy).
    A moment of a perturbed distribution may be signed even though the underlying
    single-particle kinetic energy is nonnegative.'
  unit: J
  physics_domain: turbulence
  links:
  - name:fast_particle_energy
- name: particle_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: active
  description: Particle-flux contribution to turbulent cross-field transport associated
    with the perturbed vector-potential component parallel to the magnetic field.
    It fixes the transported quantity as particles and the mechanism as parallel-vector-potential
    fluctuations without fixing a projection or normalization.
  documentation: 'Particle flux due to perturbed parallel vector potential is the
    mechanism-resolved contribution to turbulent particle transport arising from the
    component of the perturbed vector potential parallel to the equilibrium magnetic
    field, commonly denoted $\delta A_\parallel$. The transported quantity is particle
    number; the mechanism qualifier selects the perturbed-parallel-vector-potential
    part of the turbulent flux.


    This family-level quantity does not by itself prescribe a transport projection,
    flux label, averaging operation, or scaling. A specialized quantity supplies those
    additional qualifiers; for example, [normalized particle flux due to perturbed
    parallel vector potential](name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential)
    is a scaled member of this same mechanism-resolved particle-flux family.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:normalized_particle_flux_due_to_perturbed_parallel_vector_potential
  arguments:
  - name: flux_due_to_perturbed_parallel_vector_potential
    operator: particle
    operator_kind: qualifier
- name: normalized_particle_flux_due_to_perturbed_parallel_vector_potential
  kind: scalar
  status: active
  description: Dimensionless gyro-Bohm-normalized contribution to turbulent radial
    particle transport produced by fluctuations of the perturbed parallel vector potential.
  documentation: 'This quantity is the normalized magnetic-flutter contribution to
    turbulent radial particle transport caused by fluctuations of the perturbed parallel
    vector potential. It isolates this electromagnetic channel from other contributions
    to the total turbulent particle flux.


    $$

    \widehat{\Gamma}_{r,A_\parallel}=\frac{\Gamma_{r,A_\parallel}}{\Gamma_{\rm GB}}

    $$


    where $\Gamma_{r,A_\parallel}$ is the radial particle-flux contribution attributed
    to the perturbed parallel vector potential, and $\Gamma_{\rm GB}$ is the positive
    reference gyro-Bohm particle-flux scale. The normalized result is dimensionless
    and corresponds to the related unnormalized [particle-flux contribution](name:particle_flux_due_to_perturbed_parallel_vector_potential).


    It excludes particle transport produced by electrostatic fluctuations, collisional
    processes, or other electromagnetic perturbation channels unless they are included
    in the defined parent contribution.


    Sign convention: Positive when the net particle transport is outward, toward increasing
    distance from the magnetic axis.'
  unit: '1'
  physics_domain: turbulence
  links:
  - name:particle_flux_due_to_perturbed_parallel_vector_potential
  arguments:
  - name: particle_flux_due_to_perturbed_parallel_vector_potential
    operator: normalized
    operator_kind: qualifier
